rteert; als een machtig volk, dat in slagorde opgesteld is.", "6": "Voor hun aangezicht zullen de volken pijn lijden; alle gezichten zullen bleek wegtrekken*.", "7": "Als helden zullen zij lopen, als krijgslieden zullen zij de muren beklimmen; en zij zullen daarheen trekken, ieder in zijn eigen weg, en zullen hun paden niet verdraaien.", "8": "Ook zullen zij de een de ander niet verdringen; zij zullen daarheen trekken elk in zijn eigen baan; en al vielen zij op een wapen, zij zouden niet verwond worden.", "9": "Zij zullen door de stad heen en weer lopen, zij zullen lopen op de muren, zij zullen klimmen in de huizen; zij zullen door de vensters binnenkomen als een dief.", "10": "De aarde is beroerd voor hun aangezicht, de hemel beeft; de zon en maan worden zwart, en de sterren trekken hun glans in.", "11": "En de HEERE verheft Zijn stem voor Zijn leger uit; want Zijn leger is zeer groot, want Hij is machtig, Hij die Zijn woord uitvoert; want de dag van de HEERE is groot en zeer vreselijk, en wie zal hem kunnen verdragen?", "12": "Nu dan ook, spreekt de HEERE, bekeert u tot Mij met uw hele hart, en dat met vasten en met geween, en met rouwklagen.", "13": "En scheurt uw hart en niet uw kleren, en bekeert u tot de HEERE, uw God; want Hij is genadig en barmhartig, geduldig en groot van goedertierenheid, en Hij heeft berouw over het kwade.", "14": "Wie weet, Hij mocht Zich wenden en berouw hebben; en Hij mocht een zegen achter Zich overlaten tot spijsoffer en drankoffer voor de HEERE, uw God.", "15": "Waait op de bazuin te Sion, heiligt een vasten, roept een verbodsdag uit.", "16": "Verzamelt het volk, heiligt de gemeente, vergadert de oudsten, verzamelt de kinderen, en wie de borsten zuigen; de bruidegom ga uit zijn binnenkamer, en de bruid uit haar slaapkamer.", "17": "Laat de priesters, de dienaars van de HEERE, wenen tussen het voorhuis en het altaar, en laat hen zeggen: Spaar Uw volk, o HEERE! en geef Uw erfenis niet over tot een smaad, dat de heidenen over hen zouden heersen; waarom zouden zij onder de volken zeggen: Waar is hun God?", "18": "Zo zal de HEERE ijveren over Zijn land, en Hij zal Zijn volk verschonen.", "19": "En de HEERE zal antwoorden en tegen Zijn volk zeggen: Ziet, Ik zend u het koren, en de most, en de olie, zodat u daarvan verzadigd zult worden; en Ik zal u niet meer overgeven tot een smaad onder de heidenen.", "20": "En Ik zal hem die uit het noorden komt ver van u doen vertrekken, en hem wegdrijven in een dor en woest land, zijn voorkant naar de Oostzee, en zijn achterkant naar de verste zee; en zijn stank zal opgaan, en zijn vuiligheid zal opgaan; want hij heeft grote dingen gedaan.", "21": "Vrees niet, o land! verheug u, en wees blijde; want de HEERE heeft grote dingen gedaan.", "22": "Vreest niet, dieren van het veld! want de weiden van de woestijn zullen weer jong gras voortbrengen; want het geboomte zal zijn vrucht dragen, de wijnstok en vijgenboom zullen hun vermogen geven.", "23": "En u, kinderen van Sion! verheugt u en weest blijde in de HEERE, uw God; want Hij zal u die Leraar ter gerechtigheid geven; en Hij zal u de regen doen neerdalen, de vroege regen en de late regen in de eerste maand.", "24": "En de dorsvloeren zullen vol koren zijn, en de perskuipen zullen overlopen van most en olie.", "25": "Zo zal Ik u de jaren vergelden, die de sprinkhaan, de kever, en de kruidworm, en de rups heeft afgegeten; Mijn grote leger, dat Ik onder u gezonden heb.", "26": "En u zult overvloedig en tot verzadiging eten, en de Naam van de HEERE, uw God, prijzen, Die wonderlijk bij u gehandeld heeft; en Mijn volk zal niet beschaamd worden tot in eeuwigheid.", "27": "En u zult weten, dat Ik in het midden van Israël ben, en dat Ik de HEERE, uw God, ben, en niemand anders meer; en Mijn volk zal niet beschaamd worden in eeuwigheid.", "28": "En daarna zal het gebeuren, dat Ik Mijn Geest zal uitgieten over alle vlees, en uw zonen en uw dochters zullen profeteren; uw ouden zullen dromen dromen, uw jongelingen zullen gezichten zien;", "29": "Ja, ook over de dienstknechten, en over de dienstmaagden, zal Ik in die dagen Mijn Geest uitgieten.", "30": "En Ik zal wondertekenen geven in de hemel en op de aarde: bloed, en vuur, en rookpilaren.", "31": "De zon zal veranderd worden in duisternis, en de maan in bloed, voordat die grote en vreselijke dag van de HEERE komt.", "32": "En het zal gebeuren, dat ieder die de Naam van de HEERE zal aanroepen, behouden zal worden; want op de berg Sion en te Jeruzalem zal ontkoming zijn, zoals de HEERE gezegd heeft; en dat, bij de overgeblevenen, die de HEERE zal roepen."}, "SV": {"1": "Blaast de bazuin te Sion, en roept luide op den berg Mijner heiligheid; laat alle inwoners des lands beroerd zijn, want de dag des HEEREN komt, want hij is nabij.", "2": "Een dag van duisternis en donkerheid, een dag van wolken en dikke duisterheid, als de dageraad uitgespreid over de bergen; een groot en machtig volk, desgelijks van ouds niet geweest is, en na hetzelve niet meer zal zijn tot in jaren van vele geslachten.", "3": "Voor hetzelve verteert een vuur, en achter hetzelve brandt een vlam; het land is voor hetzelve als een lusthof, maar achter hetzelve een woeste wildernis, en ook is er geen ontkomen van hetzelve.", "4": "De gedaante deszelven is als de gedaante van paarden, en als ruiters zo zullen zij lopen.", "5": "Zij zullen daarhenen springen als een gedruis van wagenen, op de hoogten der bergen; als het gedruis ener vuurvlam, die stoppelen verteert; als een machtig volk, dat in slagorde gesteld is.", "6": "Van deszelfs aangezicht zullen de volken in pijn zijn; alle aangezichten zullen betrekken *als* een pot.", "7": "Als helden zullen zij lopen, als krijgslieden zullen zij de muren beklimmen; en zij zullen daarhenen trekken, een iegelijk in zijn wegen, en zullen hun paden niet verdraaien.", "8": "Ook zullen zij de een den ander niet dringen; zij zullen daarhenen trekken elk in zijn baan; en al vielen zij op een geweer, zij zouden niet verwond worden.", "9": "Zij zullen in de stad omlopen, zij zullen lopen op de muren, zij zullen klimmen in de huizen; zij zullen door de vensteren inkomen als een dief.", "10": "De aarde is beroerd voor deszelfs aangezicht, de hemel beeft; de zon en maan worden zwart, en de sterren trekken haar glans in.", "11": "En de HEERE verheft Zijn stem voor Zijn heir henen; want Zijn leger is zeer groot, want Hij is machtig, doende Zijn woord; want de dag des HEEREN is groot en zeer vreselijk, en wie zal hem verdragen?", "12": "Nu dan ook, spreekt de HEERE, bekeert u tot Mij met uw ganse hart, en dat met vasten en met geween, en met rouwklage.", "13": "En scheurt uw hart en niet uw klederen, en bekeert u tot den HEERE, uw God; want Hij is genadig en barmhartig, lankmoedig en groot van goedertierenheid, en berouw hebbende over het kwade.", "14": "Wie weet, Hij mocht Zich wenden en berouw hebben; en Hij mocht een zegen achter Zich overlaten *tot* spijsoffer en drankoffer voor den HEERE, uw God.", "15": "Blaast de bazuin te Sion, heiligt een vasten, roept een verbodsdag uit.", "16": "Verzamelt het volk, heiligt de gemeente, vergadert de oudsten, verzamelt de kinderkens, en die de borsten zuigen; de bruidegom ga uit zijn binnenkamer, en de bruid uit haar slaapkamer.", "17": "Laat de priesters, des HEEREN dienaars, wenen tussen het voorhuis en het altaar, en laat hen zeggen: Spaar Uw volk, o HEERE! en geef Uw erfenis niet over tot een smaadheid, dat de heidenen over hen zouden heersen; waarom zouden zij onder de volken zeggen: Waar is hunlieder God?", "18": "Zo zal de HEERE ijveren over Zijn land, en Hij zal Zijn volk verschonen.", "19": "En de HEERE zal antwoorden en tot Zijn volk zeggen: Ziet, Ik zend ulieden het koren, en den most, en de olie, dat gij daarvan verzadigd zult worden; en Ik zal u niet meer overgeven *tot* een smaadheid onder de heidenen.", "20": "En Ik zal dien van het noorden verre van ulieden doen vertrekken, en hem wegdrijven in een dor en woest land, zijn aangezicht naar de Oostzee, en zijn einde naar de achterste zee; en zijn stank zal opgaan, en zijn vuiligheid zal opgaan; want hij heeft grote dingen gedaan.", "21": "Vrees niet, o land! verheug u, en wees blijde; want de HEERE heeft grote dingen gedaan.", "22": "Vreest niet, gij beesten des velds! want de weiden der woestijn zullen *weder* jong gras voortbrengen; want het geboomte zal zijn vrucht dragen, de wijnstok en vijgeboom zullen hun vermogen geven.", "23": "En gij, kinderen van Sion! verheugt u en zijt blijde in den HEERE, uw God; want Hij zal u geven dien Leraar ter gerechtigheid; en Hij zal u den regen doen nederdalen, den vroegen regen en den spaden regen in de eerste *maand*.", "24": "En de dorsvloeren zullen vol koren zijn, en de perskuipen van most en olie overlopen.", "25": "Alzo zal Ik ulieden de jaren vergelden, die de sprinkhaan, de kever, en de kruidworm, en de rups heeft afgegeten; Mijn groot heir, dat Ik onder u gezonden heb.", "26": "En gij zult overvloediglijk en tot verzadiging eten, en prijzen den Naam des HEEREN, uw Gods, Die wonderlijk bij u gehandeld heeft; en Mijn volk zal niet beschaamd worden tot in eeuwigheid.", "27": "En gij zult weten, dat Ik in het midden van Israël ben, en *dat* Ik de HEERE, uw God, ben, en niemand meer; en Mijn volk zal niet beschaamd worden in eeuwigheid.", "28": "En daarna zal het geschieden, dat Ik Mijn Geest zal uitgieten over alle vlees, en uw zonen en uw dochteren zullen profeteren; uw ouden zullen dromen dromen, uw jongelingen zullen gezichten zien;", "29": "Ja, ook over de dienstknechten, en over de dienstmaagden, zal Ik in die dagen Mijn Geest uitgieten.", "30": "En Ik zal wondertekenen geven in den hemel en op de aarde: bloed, en vuur, en rookpilaren.", "31": "De zon zal veranderd worden in duisternis, en de maan in bloed, eer dat die grote en vreselijke dag des HEEREN komt.", "32": "En het zal geschieden, al wie den Naam des HEEREN zal aanroepen, zal behouden worden; want op den berg Sions en te Jeruzalem zal ontkoming zijn, gelijk als834 de HEERE gezegd heeft; en dat, bij de overgeblevenen, die de HEERE zal roepen."}, "KJV": {"1": "Blow ye the trumpet in Zion, and sound an alarm in my holy mountain: let all the inhabitants of the land tremble: for the day of the LORD cometh, for *it is* nigh at hand;", "2": "A day of darkness and of gloominess, a day of clouds and of thick darkness, as the morning spread upon the mountains: a great people and a strong; there hath not been ever the like, neither shall be any more after it, *even* to the years of many generations.", "3": "A fire devoureth before them; and behind them a flame burneth: the land *is* as the garden of Eden before them, and behind them a desolate wilderness; yea, and nothing shall escape", "4": "The appearance of them *is* as the appearance of horses; and as horsemen, so shall they run.", "5": "Like the noise of chariots on the tops of mountains shall they leap, like the noise of a flame of fire that devoureth the stubble, as a strong people set in battle array.", "6": "Before their face the people shall be much pained: all faces shall gather blackness.", "7": "They shall run like mighty men; they shall climb the wall like men of war; and they shall march every one on his ways, and they shall not break their ranks:", "8": "Neither shall one thrust another; they shall walk every one in his path: and *when* they fall upon the sword, they shall not be wounded.", "9": "They shall run to and fro in the city; they shall run upon the wall, they shall climb up upon the houses; they shall enter in at the windows like a thief.", "10": "The earth shall quake before them; the heavens shall tremble: the sun and the moon shall be dark, and the stars shall withdraw their shining:", "11": "And the LORD shall utter his voice before his army: for his camp *is* very great: for *he is* strong that executeth his word: for the day of the LORD *is* great and very terrible; and who can abide", "12": "Therefore also now, saith the LORD, turn ye *even* to me with all your heart, and with fasting, and with weeping, and with mourning:", "13": "And rend your heart, and not your garments, and turn unto the LORD your God: for he *is* gracious and merciful, slow to anger, and of great kindness, and repenteth him of the evil.", "14": "Who knoweth *if* he will return and repent, and leave a blessing behind him; *even* a meat offering and a drink offering unto the LORD your God?", "15": "Blow the trumpet in Zion, sanctify a fast, call a solemn assembly:", "16": "Gather the people, sanctify the congregation, assemble the elders, gather the children, and those that suck the breasts: let the bridegroom go forth of his chamber, and the bride out of her closet.", "17": "Let the priests, the ministers of the LORD, weep between the porch and the altar, and let them say, Spare thy people, O LORD, and give not thine heritage to reproach, that the heathen should rule over them: wherefore should they say among the people, Where *is* their God?", "18": "Then will the LORD be jealous for his land, and pity his people.", "19": "Yea, the LORD will answer and say unto his people, Behold, I will send you corn, and wine, and oil, and ye shall be satisfied therewith: and I will no more make you a reproach among the heathen:", "20": "But I will remove far off from you the northern *army*, and will drive him into a land barren and desolate, with his face toward the east sea, and his hinder part toward the utmost sea, and his stink shall come up, and his ill savour shall come up, because he hath done great things.", "21": "Fear not, O land; be glad and rejoice: for the LORD will do great things.", "22": "Be not afraid, ye beasts of the field: for the pastures of the wilderness do spring, for the tree beareth her fruit, the fig tree and the vine do yield their strength.", "23": "Be glad then, ye children of Zion, and rejoice in the LORD your God: for he hath given you the former rain moderately, and he will cause to come down for you the rain, the former rain, and the latter rain in the first", "24": "And the floors shall be full of wheat, and the fats shall overflow with wine and oil.", "25": "And I will restore to you the years that the locust hath eaten, the cankerworm, and the caterpiller, and the palmerworm, my great army which I sent", "26": "And ye shall eat in plenty, and be satisfied, and praise the name of the LORD your God, that hath dealt wondrously with you: and my people shall never be ashamed.", "27": "And ye shall know that I *am* in the midst of Israel, and *that* I *am* the LORD your God, and none else: and my people shall never be ashamed.", "28": "And it shall come to pass afterward, *that* I will pour out my spirit upon all flesh; and your sons and your daughters shall prophesy, your old men shall dream dreams, your young men shall see visions:", "29": "And also upon the servants and upon the handmaids in those days will I pour out my spirit.", "30": "And I will shew wonders in the heavens and in the earth, blood, and fire, and pillars of smoke.", "31": "The sun shall be turned into darkness, and the moon into blood, before the great and the terrible day of the LORD come.", "32": "And it shall come to pass, *that* whosoever shall call on the name of the LORD shall be delivered: for in mount Zion and in Jerusalem shall be deliverance, as the LORD hath said, and in the remnant whom the LORD shall call."}}, "tsk": {"1": [{"kopje": "Waait", "refs": ["Joël 2:15", "Num 10:3", "Num 10:8", "Jer 4:5", "Hos 8:1"]}, {"kopje": "bazuin", "refs": ["1 Kron 15:28", "Hos 5:8"]}, {"kopje": "en roept luide", "refs": ["Num 10:5-7", "Num 10:9", "Ezech 33:3", "Ezech 33:6", "Amos 3:6", "Zef 1:16"]}, {"kopje": "van Mijn heiligheid", "refs": ["Joël 3:17", "Ps 87:1", "Dan 9:16", "Dan 9:20", "Zef 3:11", "Zach 8:3"]}, {"kopje": "laat", "refs": ["Ezra 9:3", "Ezra 9:4", "Ps 119:120", "Jes 66:2", "Jes 66:5", "Jer 5:22", "Jer 16:7", "Jer 16:10", "Dan 6:27", "Fil 2:12"]}, {"kopje": "want de", "refs": ["Joël 1:15", "Jes t van de Heere is nabij.", "Fil 3:1": "Verder, mijn broeders, verblijd u in de Heere. Dezelfde dingen aan u te schrijven is voor mij niet vermoeiend, en voor u is het zeker.", "Jer 1:14": "En de HEERE zei tegen mij: Van het noorden zal dit kwaad zich opdoen over alle inwoners van het land.", "Amos 3:6": "Zal de bazuin in de stad geblazen worden, zonder dat het volk sidddert? Zal er een kwaad in de stad zijn, dat de HEERE niet doet?", "Jes 55:6": "Zoek de HEERE, terwijl Hij te vinden is; roep Hem aan, terwijl Hij nabij is.", "Jes 44:23": "Zing met vreugde, u hemelen! Want de HEERE heeft het gedaan; juich, u onderste delen van de aarde! U bergen! Maak een groot gedreun met vreugdegezang, u bossen, en al het geboomte daarin! Want de HEERE heeft Jakob verlost, en Zich heerlijk gemaakt in Israël.", "Jes 62:9": "Maar wie het inzamelen, zullen het eten, en zij zullen de HEERE prijzen; en wie het bijeenbrengen, zullen het drinken in de voorhoven van Mijn heiligdom.", "Openb 6:12": "En ik zag, toen Het het zesde zegel geopend had, en zie, er werd een grote aardbeving; en de zon werd zwart als een haren zak, en de maan werd als bloed.", "Ezech 31:8": "De ceders in Gods hof konden hem niet overtreffen, de dennenbomen waren zijn takken niet gelijk, en de kastanjebomen waren niet gelijk aan zijn scheuten; geen boom in Gods hof was hem gelijk in zijn schoonheid.", "Ps 106:45": "En Hij dacht tot hun voordeel aan Zijn verbond, en het berouwde Hem naar de veelheid van Zijn blijken van goedertierenheid.", "Jes 35:1": "De woestijn en de dorre plaatsen zullen hierover vrolijk zijn, en de wildernis zal zich verheugen, en zal bloeien als een roos.", "Ps 10:6": "Hij zegt in zijn hart: Ik zal niet wankelen; want ik zal van geslacht tot geslacht in geen kwaad zijn.", "Jona 3:9": "Wie weet, God mocht Zich wenden, en berouw hebben; en Hij mocht Zich wenden van de gloed van Zijn toorn, zodat wij niet vergaan!", "Jer 33:3": "Roep tot Mij, en Ik zal u antwoorden, en Ik zal u grote en vaste dingen bekendmaken, die u niet weet.", "Zach 8:2": "Zo zegt de HEERE van de heerscharen: Ik heb geijverd over Sion met een grote ijver; ja, met grote grimmigheid heb Ik over haar geijverd.", "Amos 9:14": "En Ik zal de gevangenschap van Mijn volk Israël omkeren, en zij zullen de verwoeste steden herbouwen en bewonen, en wijngaarden planten, en daarvan de wijn drinken; en zij zullen tuinen maken, en daarvan de vrucht eten.", "Ps 42:11": "Met een doodsteek in mijn beenderen honen mij mijn tegenstanders, als zij de hele dag tegen mij zeggen: Waar is uw God?", "Jes 13:8": "en zij zullen verschrikt worden, smarten en weeën zullen hen aangrijpen, zij zullen bang zijn als een barende vrouw; ieder zal over zijn naaste verbaasd zijn; hun gezichten zullen vlammende gezichten zijn.", "Jer 3:3": "Daarom zijn de regendruppels ingehouden, en is er geen late regen geweest. Maar u hebt een hoerenvoorhoofd, u weigert schaamrood te worden.", "Ezech 34:29": "En Ik zal hun een plant van naam doen opkomen; en zij zullen niet meer weggeraapt worden door honger in het land, en de smaad van de heidenen niet meer dragen.", "Zach 10:7": "En zij zullen zijn als een held van Efraïm, en hun hart zal zich verblijden als door de wijn; en hun kinderen zullen het zien en zich verblijden, hun hart zal zich verheugen in de HEERE.", "Jes 8:22": "als hij de aarde aanschouwen zal, zie, dan zal er benauwdheid en duisternis zijn; hij zal verduisterd zijn door angst, en voortgedreven door donkerheid.", "Nahum 3:3": "De ruiter steekt omhoog, zo het vlammende zwaard, als de bliksemende speer, en er zal een veelheid van verslagenen zijn, en een zware menigte dode lichamen; ja, er zal geen einde zijn aan de lichamen, men zal over hun lichamen struikelen;", "Deut 23:14": "Want de HEERE, uw God, wandelt in het midden van uw leger, om u te verlossen, en om uw vijanden aan u over te geven; daarom zal uw leger heilig zijn, opdat Hij niets schandelijks onder u ziet, en Zich niet van u afkeert.", "Jer 23:28": "De profeet, bij wie een droom is, vertelt de droom; en bij wie Mijn woord is, spreekt Mijn woord waarachtig; wat heeft het stro met het koren te maken? spreekt de HEERE.", "Jona 4:2": "En hij bad tot de HEERE, en zei: Och HEERE! Was dit niet mijn woord, toen ik nog in mijn land was? Daarom kwam ik het voor, door naar Tarsis te vluchten; want ik wist dat U een genadig en barmhartig God bent, geduldig en groot van goedertierenheid, en berouw hebbend over het kwaad.", "Ps 114:7": "Beef, aarde, voor het aangezicht van de Heere, voor het aangezicht van de God van Jakob;", "Hab 3:18": "Zo zal ik toch in de HEERE van vreugde opspringen, ik zal mij verheugen in de God van mijn heil.", "Jer 5:17": "En het zal uw oogst en uw brood opeten, dat uw zonen en uw dochters zouden eten; het zal uw schapen en uw runderen opeten; het zal uw wijnstok en uw vijgenboom opeten; uw vaste steden, waarop u vertrouwt, zal het arm maken door het zwaard.", "Jak 1:20": "Want de toorn van de man werkt de gerechtigheid van God niet.", "Ezech 47:8": "Toen zei hij tegen mij: Dit water stroomt uit naar het oostelijke gebied, en daalt af in het vlakke veld; daarna komt het in de zee; wanneer het in de zee is uitgekomen, wordt het water gezond.", "2 Kon 5:7": "En het gebeurde, toen de koning van Israël de brief gelezen had, dat hij zijn kleren scheurde, en zei: Ben ik dan God, om te doden en levend te maken, dat deze man naar mij toe stuurt, om een man van zijn melaatsheid te verlossen? Want inderdaad, let toch op en zie, dat hij een aanleiding tegen mij zoekt.", "2 Sam 12:22": "En hij zei: Toen het kind nog leefde, heb ik gevast en gehuild; want ik zei: Wie weet, de HEERE zou mij misschien genadig kunnen zijn, zodat het kind in leven bleef.", "Jes 41:10": "Vrees niet, want Ik ben met u; wees niet verbaasd, want Ik ben uw God; Ik sterk u, ook help Ik u, ook ondersteun Ik u met de rechterhand van Mijn gerechtigheid.", "Mal 3:2": "Maar wie zal de dag van Zijn komst verdragen, en wie zal standhouden als Hij verschijnt? Want Hij zal zijn als het vuur van een goudsmid, en als zeep van de blekers.", "Rom 10:11": "Want de Schrift zegt: Ieder die in Hem gelooft, zal niet beschaamd worden.", "Joh 7:39": "(En dit zei Hij van de Geest, die zij die in Hem geloven zouden ontvangen; want de Heilige Geest was er nog niet, omdat Jezus nog niet verheerlijkt was.)", "Amos 5:8": "Die het Zevengesternte en de Orion maakt, en de doodsschaduw in de morgen verandert, en de dag als de nacht verduistert; Die de wateren van de zee roept, en ze uitgiet over de aardbodem, HEERE is Zijn Naam.", "Jona 4:11": "En zou Ik dan die grote stad Ninevé niet ontzien? Daarin wonen meer dan honderdtwintigduizend mensen, die geen onderscheid weten te maken tussen hun rechterhand en hun linkerhand; en bovendien nog veel vee?", "Jes 58:5": "Zou dit zulk een vasten zijn dat Ik verkiezen zou, dat de mens zijn ziel een dag kwelt, dat hij zijn hoofd kromt zoals een bieze, en een zak en as onder zich spreidt? Zou u dat een vasten noemen, en een dag die de HEERE aangenaam is?", "Dan 9:19": "O Heere, hoor! o Heere, vergeef! o Heere, merk op en doe het, wacht er niet mee! Om Uzelf, o mijn God! Want Uw stad, en Uw volk is naar Uw Naam genoemd.", "Joël 1:19": "Tot U, HEERE, roep ik; want een vuur heeft de weiden van de woestijn verteerd, en een vlam heeft alle bomen van het veld aangestoken.", "Ps 68:19": "U bent opgevaren in de hoogte; U hebt de gevangenis gevankelijk weggevoerd; U hebt gaven genomen om uit te delen onder de mensen; ja, ook de opstandigen, om bij U te wonen, o HEERE God!", "Rom 5:20": "Maar de wet is bovendien ingekomen, opdat de misdaad meer zou worden; en waar de zonde meer geworden is, daar is de genade veel meer overvloedig geweest;", "Jes 45:22": "Wend u naar Mij toe, word behouden, alle einden van de aarde! Want Ik ben God, en niemand meer.", "Jes 5:24": "Daarom, zoals de tong van het vuur de stoppel verteert, en het kaf door de vlam verteerd wordt, zo zal hun wortel als verrotting zijn; en hun bloesem zal als stof opstijgen; omdat zij de wet van de HEERE van de heerscharen verwerpen, en het woord van de Heilige van Israël versmaden.", "Amos 5:15": "Haat het kwade, en heb het goede lief, en zorg voor recht in de poort; misschien zal de HEERE, de God van de heerscharen, aan het overblijfsel van Jozef genadig zijn.", "2 Kron 8:12": "Toen offerde Salomo de HEERE brandoffers op het altaar van de HEERE, dat hij vóór de voorhal gebouwd had;", "Neh 9:2": "En het nageslacht van Israël scheidde zich af van alle vreemden. En zij stonden, en beleden hun zonden en de ongerechtigheden van hun vaderen.", "Jak 1:19": "Daarom, mijn geliefde broeders, laat ieder mens snel zijn om te horen, traag om te spreken, traag tot toorn;", "Joël 1:9": "Spijsoffer en drankoffer is van het huis van de HEERE afgesneden; de priesters, dienaars van de HEERE, treuren.", "Matt 9:15": "En Jezus zei tegen hen: Kunnen de bruiloftsgasten treuren, zolang de Bruidegom bij hen is? Maar de dagen zullen komen, wanneer de Bruidegom van hen weggenomen zal zijn, en dan zullen zij vasten.", "Jes 13:9": "Zie, de dag van de HEERE komt, gruwelijk, met verbolgenheid en hevige toorn, om het land tot verwoesting te stellen, en de zondaars daaruit te verdelgen.", "Ezech 36:35": "En zij zullen zeggen: Dit land, dat verwoest was, is geworden als een hof van Eden; en de eenzame en de verwoeste en verstoorde steden zijn versterkt en bewoond.", "Jes 54:13": "En al uw kinderen zullen door de HEERE geleerd zijn, en de vrede van uw kinderen zal groot zijn.", "Openb 9:9": "En zij hadden borstwapens als ijzeren borstwapens; en het gedruis van hun vleugels was als een gedruis van wagens, wanneer veel paarden naar de strijd lopen.", "Matt 24:29": "En meteen na de verdrukking van die dagen zal de zon verduisterd worden, en de maan zal haar licht niet geven, en de sterren zullen van de hemel vallen, en de krachten van de hemelen zullen beven.", "Num 12:6": "En Hij zei: Hoor nu Mijn woorden! Als er een profeet onder u is, zal Ik, de HEERE, Mij door een gezicht aan hem bekendmaken, door een droom zal Ik met hem spreken.", "Ex 10:5": "En zij zullen het oppervlak van het land bedekken, zodat men de aarde niet zal kunnen zien; en zij zullen opeten wat overgebleven is, wat u overgebleven is van de hagel; zij zullen ook alle bomen opeten, die voor u van het veld opkomen.", "1 Kon 9:7": "Dan zal Ik Israël uitroeien van het land, dat Ik hun gegeven heb, en dit huis, dat Ik voor Mijn Naam geheiligd heb, zal Ik van Mijn aangezicht wegwerpen; en Israël zal tot een spreekwoord en spotrede zijn onder alle volken.", "Ps 46:7": "De heidenen raasden, de koninkrijken bewogen zich; Hij verhief Zijn stem, de aarde versmolt.", "Zef 2:3": "Zoekt de HEERE, alle zachtmoedigen van het land, die Zijn recht doen! Zoekt gerechtigheid, zoekt zachtmoedigheid, misschien zult u verborgen worden in de dag van de toorn van de HEERE.", "2 Sam 22:15": "En Hij zond pijlen uit en verstrooide ze; bliksemen en verschrikte ze.", "Ezech 9:4": "En de HEERE zei tot hem: Ga door, door het midden van de stad, door het midden van Jeruzalem, en zet een teken op de voorhoofden van de mensen die zuchten en uitroepen over al die gruwelen die in haar midden gedaan worden.", "Ps 103:5": "Die uw mond verzadigt met het goede, uw jeugd vernieuwt als die van een arend.", "Ezech 39:29": "En Ik zal Mijn aangezicht niet meer voor hen verbergen, wanneer Ik Mijn Geest over het huis van Israël zal hebben uitgegoten, spreekt de Heere HEERE.", "Matt 27:51": "En zie, het voorhangsel van de tempel scheurde in tweeën, van boven tot beneden; en de aarde beefde, en de rotsen scheurden.", "Dan 6:27": "Van mij is een bevel uitgegaan, dat men in de hele heerschappij van mijn koninkrijk moet beven en sidderen voor het aangezicht van de God van Daniël; want Hij is de levende God, en blijvend in eeuwigheid, en Zijn koninkrijk gaat niet te gronde, en Zijn heerschappij duurt tot het einde toe.", "Ps 74:10": "Hoe lang, o God, zal de tegenstander smaden? Zal de vijand Uw Naam voor eeuwig lasteren?", "Richt 10:16": "En zij deden de vreemde goden uit hun midden weg, en dienden de HEERE. Toen werd Zijn ziel verdrietig over de ellende van Israël.", "Ezech 34:26": "Want Ik zal hen, en de plaatsen rondom Mijn heuvel, stellen tot een zegen; en Ik zal de plasregen doen neerdalen op zijn tijd, plasregens van zegen zullen er zijn.", "2 Kron 20:3": "Josafat nu werd bevreesd, en richtte zich erop om de HEERE te zoeken; en hij riep een vasten uit in heel Juda.", "Deut 29:10": "U staat heden allen voor het aangezicht van de HEERE, uw God: uw hoofden van uw stammen, uw oudsten, en uw opzichters, alle mannen van Israël;", "Dan 9:20": "Terwijl ik nog sprak, en bad, en mijn zonde beleed, en de zonde van mijn volk Israël, en mijn smeking neerwierp voor het aangezicht van de HEERE, mijn God, om de heilige berg van mijn God;", "Hos 6:1": "Kom, laten wij terugkeren tot de Heere, want Hij heeft verscheurd, en Hij zal ons genezen; Hij heeft geslagen, en Hij zal ons verbinden.", "Ps 147:9": "Die het vee zijn voer geeft; aan de jonge raven, als zij roepen.", "1 Kon 21:12": "Zij riepen een vasten uit; en zij zetten Naboth vooraan onder het volk.", "Hos 14:2": "Bekeer u, o Israël! tot de Heere, uw God, toe; want u bent gevallen om uw ongerechtigheid.", "Ex 10:6": "En zij zullen uw huizen vullen, en de huizen van al uw knechten, en de huizen van alle Egyptenaren; wat uw vaders, en de vaders van uw vaders niet gezien hebben, van de dag af dat zij op de aardbodem zijn geweest, tot op deze dag. En hij keerde zich om en ging weg bij Farao vandaan.", "Gen 2:8": "Ook had de HEERE God een hof geplant in Eden, tegen het oosten, en Hij zette daar de mens, die Hij gevormd had.", "Ex 10:19": "Toen keerde de HEERE een zeer sterke westenwind, die hief de sprinkhanen op, en wierp ze in de Schelfzee; er bleef niet één sprinkhaan over in heel het gebied van Egypte.", "Jes 59:21": "Wat Mij aangaat, dit is Mijn Verbond met hen, zegt de HEERE: Mijn Geest, Die op u is, en Mijn woorden, die Ik in uw mond gelegd heb, die zullen van uw mond niet wijken, ook niet van de mond van uw zaad, ook niet van de mond van het zaad van uw zaad, zegt de HEERE, van nu af tot in eeuwigheid toe.", "Matt 5:3": "Zalig zijn de armen van geest, want hun is het Koninkrijk der hemelen.", "Klaagl 4:2": "Beth. De kostbare kinderen van Sion, tegen fijn goud geschat, hoe worden zij nu gelijkgesteld aan de aarden kruiken, het werk van de handen van een pottenbakker!", "Nahum 2:3": "De schilden van zijn helden zijn rood gemaakt, de dappere mannen zijn scharlakengekleurd; de wagens zijn in het vuur van de fakkels, ten dage als hij zich klaarmaakt; en de spiesen worden geschud.", "1 Kor 7:5": "Onttrek u niet aan elkaar, tenzij met wederzijdse instemming voor een tijd, opdat u zich aan vasten en bidden kunt wijden; en kom weer bijeen, opdat de satan u niet verzoekt, omdat u zich niet kunt onthouden.", "Jes 63:9": "In al hun benauwdheid was Hij benauwd, en de Engel van Zijn aangezicht heeft hen behouden; door Zijn liefde en door Zijn genade heeft Hij hen verlost; en Hij nam hen op, en Hij droeg hen al de dagen van ouds.", "Rom 11:26": "En zo zal heel Israël zalig worden; zoals geschreven is: De Verlosser zal uit Sion komen en zal de goddeloosheden afwenden van Jakob.", "Joël 1:2": "Hoor dit, oudsten! En neem ter ore, alle inwoners van het land! Is dit gebeurd in uw dagen, of ook in de dagen van uw vaderen?", "Job 1:20": "Toen stond Job op, en scheurde zijn mantel, en schoor zijn hoofd, en viel op de aarde, en boog zich neer;", "Joël 3:15": "De zon en de maan zijn zwart geworden, en de sterren hebben hun glans ingetrokken.", "Mal 1:9": "Nu dan, smeek toch het aangezicht van God, dat Hij ons genadig is; dit is door uw toedoen gebeurd, zal Hij u gunstig ontvangen? zegt de HEERE van de heerscharen?", "Zach 1:3": "Daarom zeg tegen hen: Zo zegt de HEERE van de heerscharen: Keer terug tot Mij, spreekt de HEERE van de heerscharen, zo zal Ik weer tot u terugkeren, zegt de HEERE van de heerscharen.", "Openb 6:13": "En de sterren van de hemel vielen op de aarde, zoals een vijgenboom zijn onrijpe vijgen afwerpt, als hij door een grote wind geschud wordt.", "Ps 34:19": "Koph. De HEERE is nabij de gebrokenen van hart, en Hij behoudt de verslagenen van geest.", "1 Tim 6:17": "Beveel de rijken in deze tegenwoordige wereld dat zij niet hoogmoedig zijn, en ook niet hun hoop stellen op de onzekerheid van de rijkdom, maar op de levende God, Die ons alle dingen rijkelijk verleent om ervan te genieten;", "Jer 4:5": "Verkondig het in Juda, en laat het horen te Jeruzalem, en zeg het; ja, blaas de bazuin in het land; roep met volle stem en zeg: Verzamel u, en laten wij ingaan in de versterkte steden!", "Ex 19:10": "Ook zei de HEERE tot Mozes: Ga tot het volk, en heilig hen heden en morgen, en laat hen hun kleren wassen,", "Mark 13:25": "En de sterren van de hemel zullen daaruit vallen, en de krachten die in de hemelen zijn, zullen bewogen worden.", "Klaagl 3:22": "Cheth. Het zijn de blijken van goedertierenheid van de HEERE, dat wij niet vernietigd zijn, dat Zijn barmhartigheden geen einde hebben;", "1 Tess 5:2": "Want u weet zelf zeer goed dat de dag van de Heere zo zal komen, zoals een dief in de nacht.", "Ps 126:3": "De HEERE heeft grote dingen bij ons gedaan; daarom zijn wij verblijd.", "Jer 18:8": "Maar als datzelfde volk, over wie Ik dat gesproken heb, zich van zijn boosheid bekeert, dan zal Ik berouw hebben over het kwaad dat Ik dacht hen aan te doen.", "Nahum 2:4": "De wagens razen door de wijken, zij lopen heen en weer op de straten; hun verschijning is als die van fakkels, zij lopen door elkaar heen als de bliksems.", "Hand 15:17": "opdat de overige mensen de Heere zoeken, en alle heidenen, over wie Mijn Naam aangeroepen is, zegt de Heere, Die dit alles doet.", "Hos 8:1": "De bazuin aan uw mond; hij komt als een arend tegen het huis van de Heere; omdat zij Mijn verbond hebben overtreden, en tegen Mijn wet in opstand zijn gekomen.", "Joël 1:6": "Want een volk is opgekomen over mijn land, machtig en zonder getal; zijn tanden zijn leeuwentanden, en het heeft baktanden van een oude leeuw.", "Hos 2:20": "En het zal op die dag gebeuren, dat Ik verhoren zal, spreekt de Heere; Ik zal de hemel verhoren, en die zal de aarde verhoren.", "Jona 3:7": "En hij liet uitroepen, en men sprak te Nineve, op bevel van de koning en zijn groten: Laat mens noch dier, rund noch schaap, iets proeven, laat ze niet grazen, noch water drinken.", "Gen 19:28": "En hij keek uit naar Sodom en Gomorra, en naar het hele land van die vlakte; en hij zag, en zie, er steeg rook op van het land, als de rook van een oven.", "Deut 12:7": "En daar zult u voor het aangezicht van de HEERE, uw God, eten en vrolijk zijn, u en uw huizen, over alles waaraan u uw hand geslagen hebt, waarin de HEERE, uw God, u gezegend heeft.", "Ps 145:15": "Ain. Aller ogen wachten op U; en U geeft hun hun voedsel op de juiste tijd.", "1 Joh 2:28": "En nu, kinderen, blijft in Hem; opdat, wanneer Hij geopenbaard zal zijn, wij vrijmoedigheid hebben, en wij bij Zijn komst niet beschaamd worden voor Hem.", "Neh 9:36": "Zie, wij zijn heden knechten; ja, het land, dat U onze vaderen gegeven hebt, om de vrucht daarvan, en het goede daarvan te eten, zie, daarin zijn wij knechten.", "Mark 13:24": "Maar in die dagen, na die verdrukking, zal de zon verduisterd worden, en de maan zal haar licht niet geven.", "2 Kron 29:24": "En de priesters slachtten ze, en ontzondigden met hun bloed op het altaar, om verzoening te doen voor heel Israël; want de koning had dat brandoffer en dat zondoffer voor heel Israël bevolen.", "Deut 12:12": "En u zult vrolijk zijn voor het aangezicht van de HEERE, uw God, u, en uw zonen, en uw dochters, en uw dienstknechten, en uw dienstmaagden, en de Leviet die in uw poorten is; want hij heeft geen deel noch erfenis met u.", "Luk 21:11": "En er zullen grote aardbevingen zijn op verscheidene plaatsen, en hongersnoden, en pestilentiën; er zullen ook schrikwekkende dingen, en grote tekenen van de hemel gebeuren.", "Hos 2:14": "En Ik zal haar haar wijngaarden geven van daaraf, en het dal Achor, tot een deur van hoop; en daar zal zij zingen, als in de dagen van haar jeugd, en als op de dag dat zij optrok uit Egypteland.", "Openb 21:3": "En ik hoorde een grote stem uit de hemel, die zei: Zie, de tabernakel van God is bij de mensen, en Hij zal bij hen wonen, en zij zullen Zijn volk zijn, en God Zelf zal bij hen en hun God zijn.", "Deut 8:10": "Als u dan gegeten zult hebben, en verzadigd bent, dan zult u de HEERE, uw God, loven, om dat goede land dat Hij u gegeven zal hebben.", "Jes 66:2": "Want Mijn hand heeft al deze dingen gemaakt, en al deze dingen zijn geweest, spreekt de HEERE; maar op deze zal Ik zien, op de arme en verslagene van geest, en die voor Mijn woord beeft.", "Joël 3:1": "Want zie, in die dagen en in die tijd, als Ik de gevangenschap van Juda en Jeruzalem zal wenden,", "Jer 29:13": "En u zult Mij zoeken en vinden, wanneer u naar Mij zult vragen met heel uw hart.", "Hand 2:19": "En Ik zal wonderen geven in de hemel boven, en tekenen op de aarde beneden: bloed en vuur en rookwalm.", "Ex 34:9": "En hij zei: Heere! Als ik nu genade gevonden heb in Uw ogen, ga dan nu de Heere in ons midden, want dit is een hardnekkig volk; maar vergeef onze ongerechtigheid en onze zonde, en neem ons aan tot een erfdeel!", "Zach 10:1": "Vraag van de HEERE regen, in de tijd van de late regen; de HEERE maakt de bliksemwolken¹, en Hij zal hun regen genoeg geven, voor ieder kruid op het veld.", "Num 14:18": "De HEERE is geduldig en groot van goedertierenheid, Hij vergeeft de ongerechtigheid en overtreding, maar houdt de schuldige geenszins onschuldig, en bezoekt de ongerechtigheid van de vaderen aan de kinderen, tot het derde en vierde geslacht.", "Jes 65:8": "Zo zegt de HEERE: Zoals wanneer men most in een tros druiven vindt, men zegt: Verderf ze niet, want er is een zegen in; zo zal Ik het om Mijn knechten doen, dat Ik hen niet allen verderf.", "Zach 7:5": "Spreek tot heel het volk van dit land, en tot de priesters: Toen u vastte en rouwklaagde, in de vijfde en in de zevende maand, namelijk nu zeventig jaren, hebt u dan voor Mij, voor Mij, werkelijk gevast?", "Lev 26:5": "En de dorstijd zal u reiken tot de wijnoogst, en de wijnoogst zal reiken tot de zaaitijd; en u zult uw brood eten tot verzadiging toe, en u zult zeker in uw land wonen.", "Jes 11:11": "Want het zal gebeuren op die dag, dat de Heere voor de tweede keer Zijn hand zal aanleggen om het overblijfsel van Zijn volk terug te verwerven, dat overgebleven zal zijn van Assyrië, en van Egypte, en van Pathros, en van Morenland, en van Elam, en van Sinear, en van Hamath, en van de eilanden van de zee.", "Deut 32:27": "Ware het niet, dat Ik de toorn van de vijand vreesde, dat hun tegenpartijen zich niet vreemd zouden houden; dat zij niet zouden zeggen: Onze hand is hoog geweest; de HEERE heeft dit alles niet gedaan.", "Jes 66:5": "Hoor het woord van de HEERE, u die voor Zijn woord beeft! Uw broeders, die u haten, die u ver wegsturen, om Mijn Naam, zeggen: Laat de HEERE heerlijk worden! Maar Hij zal verschijnen tot uw vreugde, zij daarentegen zullen beschaamd worden.", "Micha 7:10": "En mijn vijandin zal het zien, en schaamte zal haar bedekken; zij die tegen mij zegt: Waar is de HEERE, uw God? Mijn ogen zullen op haar neerzien; nu zal zij worden tot vertreding, als slijk van de straten.", "Jer 25:30": "U zult dan al deze woorden tot hen profeteren, en u zult tot hen zeggen: De HEERE zal brullen uit de hoogte, en Zijn stem verheffen uit de woning van Zijn heiligheid; Hij zal geweldig brullen over Zijn woonstede; Hij zal een vreugdegeroep, als de druiventreders, uitroepen tegen alle inwoners van de aarde.", "1 Sam 7:6": "En zij werden verzameld te Mizpa, en zij schepten water en goten het uit voor het aangezicht van de HEERE; en zij vastten die dag, en zeiden daar: Wij hebben tegen de HEERE gezondigd. Zo richtte Samuël de kinderen van Israël te Mizpa.", "Lev 26:26": "Als Ik u de staf van het brood zal hebben gebroken, dan zullen tien vrouwen uw brood in één oven bakken, en zullen uw brood bij het gewicht teruggeven; en u zult eten, maar niet verzadigd worden.", "1 Kon 21:9": "En zij schreef in die brieven: Roept een vasten uit, en zet Naboth vooraan onder het volk;", "1 Sam 12:16": "Ga nu ook hier staan, en zie dit grote wonder, dat de HEERE voor uw ogen doen zal.", "Ex 32:30": "En het gebeurde de volgende dag, dat Mozes tegen het volk zei: U hebt een grote zonde gezondigd; maar nu, ik zal naar de HEERE opklimmen; misschien zal ik verzoening kunnen doen voor uw zonde.", "Amos 5:18": "Wee hen die de dag van de HEERE verlangen! Waartoe toch zal de dag van de HEERE u zijn? Hij zal duisternis zijn en geen licht.", "Ps 13:6": "Maar ik vertrouw op Uw goedertierenheid; mijn hart zal zich verheugen in Uw heil; ik zal de HEERE zingen, omdat Hij mij goedgedaan heeft.", "Jes 25:1": "HEERE! U bent mijn God, U zal ik verhogen, Uw Naam zal ik loven, want U hebt wonder gedaan; Uw raadslagen van verre zijn waarheid en vastigheid.", "Jak 5:11": "Zie, wij noemen hen gelukkig die volharden; u hebt van de volharding van Job gehoord, en u hebt gezien hoe de Heere het einde bracht, dat de Heere zeer barmhartig is en vol ontferming.", "2 Kron 32:5": "Zo versterkte hij zich, en bouwde de hele muur weer op waar hij gebroken was, en trok hem op tot aan de torens, met een andere muur daarbuiten, en hij versterkte Millo in de stad van David; en hij maakte wapens en schilden in menigte.", "Ezech 47:7": "Toen ik terugkeerde, zie, zo stonden er aan de oever van de beek heel veel bomen, aan deze en aan de andere kant.", "Ps 19:6": "En die is als een bruidegom, die uitgaat uit zijn slaapkamer; zij is vrolijk als een held, om het pad te lopen.", "Openb 8:12": "En de vierde engel heeft op de bazuin geblazen, en het derde deel van de zon werd getroffen, en het derde deel van de maan, en het derde deel van de sterren; zodat het derde deel daarvan verduisterd zou worden, en het derde deel van de dag niet zou lichten; en van de nacht evenzo.", "Joël 3:16": "En de HEERE zal uit Sion brullen, en uit Jeruzalem Zijn stem geven, zodat hemel en aarde beven zullen; maar de HEERE zal de toevlucht van Zijn volk, en de sterkte van de kinderen van Israël zijn.", "Micha 4:6": "Op die dag, spreekt de HEERE, zal Ik haar die kreupel was verzamelen, en haar die verdreven was bijeenbrengen, en haar die Ik geplaagd had.", "Gen 13:10": "En Lot hief zijn ogen op, en zag de hele vlakte van de Jordaan, dat die overal goed bevochtigd was; voordat de HEERE Sodom en Gomorra verwoest had, was zij als de hof van de HEERE, als het land Egypte, tot waar men bij Zoar komt.", "2 Kron 35:6": "En slacht het pascha, en heilig u, en bereid dat voor uw broeders, doende naar het woord van de HEERE, door de hand van Mozes.", "Jes 11:16": "En er zal een gebaande weg zijn voor het overblijfsel van Zijn volk, dat overgebleven zal zijn van Assur, zoals het Israël gebeurde op de dag toen het uit Egypteland optrok.", "Jer 30:7": "O wee! Want die dag is zo groot, dat er zijn gelijke niet geweest is; en het is een tijd van benauwdheid voor Jakob; toch zal hij daaruit verlost worden.", "Jer 5:10": "Beklim haar muren, en verwoest ze (maar maak er geen einde aan); haal haar tinnen weg, want zij zijn niet van de HEERE.", "1 Tim 4:8": "Want de lichamelijke oefening is van weinig nut; maar de godvruchtigheid is nuttig voor alles, omdat zij de belofte heeft van het tegenwoordige en van het toekomende leven.", "1 Kron 15:28": "Zo bracht heel Israël de ark van het verbond van de HEERE op, met gejuich, en met geluid van de bazuin, en met trompetten, en met cimbalen, en maakte geluid met luiten en met harpen.", "2 Kron 20:13": "En heel Juda stond voor het aangezicht van de HEERE, ook hun kinderen, hun vrouwen en hun zonen.", "Jona 3:8": "Maar mens en dier zullen met zakken bedekt zijn, en zullen sterk tot God roepen; en zij zullen zich bekeren, ieder van zijn boze weg, en van het geweld dat in hun handen is.", "Ps 22:27": "De zachtmoedigen zullen eten en verzadigd worden; zij zullen de HEERE prijzen, die Hem zoeken; uw hart zal in eeuwigheid leven.", "Ps 149:2": "Laat Israël zich verblijden in Hem Die hem gemaakt heeft; laat de kinderen van Sion zich verheugen over hun Koning.", "Fil 2:12": "Welnu, mijn geliefden, zoals u altijd gehoorzaam bent geweest, niet alleen zoals in mijn aanwezigheid, maar nu des te meer in mijn afwezigheid, werk uw eigen zaligheid met vrees en beven:", "Ezech 20:9": "Doch Ik deed het om Mijn Naam, opdat die niet ontheiligd zou worden voor de ogen van de heidenvolken, in wier midden zij waren; aan wie Ik Mij, voor hun ogen, bekend heb gemaakt, door hen uit Egypteland uit te leiden.", "Hand 2:20": "De zon zal veranderd worden in duisternis, en de maan in bloed, voordat de grote en luisterrijke dag van de Heere komt.", "Nahum 1:5": "De bergen beven voor Hem, en de heuvels smelten; en de aarde licht zich op voor Zijn aangezicht, ja de wereld, en allen die daarin wonen.", "Jes 40:5": "En de heerlijkheid van de HEERE zal geopenbaard worden; en alle vlees tegelijk zal zien, dat de mond van de HEERE het gesproken heeft.", "Zach 14:8": "Ook zal het op die dag gebeuren, dat er levend water uit Jeruzalem zal vloeien, de helft daarvan naar de oostzee, en de helft daarvan naar de achterste zee toe; het zal 's zomers en 's winters zijn.", "Jer 50:34": "Maar hun Verlosser is sterk, HEERE van de heerscharen is Zijn Naam; Hij zal hun geschil zeker beslechten, opdat Hij het land tot rust brengt, maar de inwoners van Babel verontrust.", "Deut 28:12": "De HEERE zal voor u Zijn goede schat openen, de hemel, om aan uw land regen te geven op zijn tijd, en om al het werk van uw hand te zegenen; en u zult aan veel volken lenen, maar u zult niet lenen van anderen.", "Neh 4:23": "Verder trokken noch ik, noch mijn broeders, noch mijn knechten, noch de mannen van de wacht die achter mij waren, onze kleren uit; ieder had zijn wapen, ook bij het water.", "Lev 26:12": "En Ik zal in uw midden wandelen, en zal u tot een God zijn, en u zult Mij tot een volk zijn.", "Joël 1:16": "Is niet het voedsel voor onze ogen afgesneden? Blijdschap en verheuging van het huis van onze God?", "2 Sam 1:11": "Toen greep David zijn kleren en scheurde ze; evenzo ook al de mannen die met hem waren.", "Zef 1:15": "Die dag zal een dag van verbolgenheid zijn; een dag van benauwdheid en angst, een dag van woestheid en verwoesting, een dag van duisternis en donkerheid, een dag van wolk en dikke duisternis;", "2 Kron 20:4": "En Juda kwam bijeen om hulp te zoeken bij de HEERE; ook kwamen zij uit alle steden van Juda om de HEERE te zoeken.", "Job 1:5": "Het gebeurde dan, als de dagen van de maaltijden voorbij waren, dat Job hen liet halen en hen heiligde en 's morgens vroeg opstond en brandoffers offerde naar hun aller getal; want Job zei: Misschien hebben mijn kinderen gezondigd, en God in hun hart vervloekt. Zo deed Job al die dagen.", "Jes 44:3": "Want Ik zal water gieten op de dorstige, en stromen op het droge; Ik zal Mijn Geest op uw nageslacht gieten, en Mijn zegen op uw nakomelingen.", "Gen 37:29": "Toen Ruben nu naar de kuil terugkeerde, zie, Jozef was niet meer in de kuil; toen scheurde hij zijn kleren.", "Hand 2:21": "En het zal gebeuren dat ieder die de Naam van de Heere zal aanroepen, behouden zal worden.", "2 Kron 6:39": "Hoor dan uit de hemel, uit de vaste plaats van Uw woning, hun gebed en hun smekingen, en voer hun recht uit, en vergeef Uw volk wat zij tegen U gezondigd zullen hebben.", "Joh 4:22": "U aanbidt wat u niet weet; wij aanbidden wat wij weten; want de zaligheid is uit de Joden.", "Deut 32:7": "Denk aan de dagen van vroeger; merk op de jaren van elk geslacht; vraag uw vader, die zal het u bekendmaken, uw ouderen, en zij zullen het u zeggen.", "Klaagl 4:8": "Cheth. Maar nu is hun gedaante donkerder dan roet, men herkent hen niet op de straten; hun huid kleeft aan hun beenderen, zij is verdord, zij is geworden als hout.", "Amos 7:5": "Toen zei ik: Heere HEERE, houd toch op; wie zou er van Jakob blijven staan, want hij is klein!", "Joël 1:13": "Omgord u, en rouwklaag, priesters! Huil, dienaars van het altaar! Ga naar binnen, overnacht in zakken, dienaars van mijn God! Want spijsoffer en drankoffer is geweerd van het huis van uw God.", "Ps 72:7": "In zijn dagen zal de rechtvaardige bloeien, en de veelheid van vrede, totdat de maan niet meer is.", "Jer 31:20": "Is Efraïm Mij niet een dierbare zoon, is hij Mij niet een troetelkind? Want sinds Ik tegen hem gesproken heb, denk Ik nog met ernst aan hem; daarom rommelt Mijn binnenste over hem; Ik zal Mij zijn zeker ontfermen, spreekt de HEERE.", "Ps 25:2": "Beth. Mijn God! op U vertrouw ik; laat mij niet beschaamd worden; laat mijn vijanden niet van vreugde opspringen over mij.", "Joël 3:14": "Menigten, menigten in het dal van de beslissing; want de dag van de HEERE is nabij, in het dal van de beslissing.", "Ezech 12:23": "Daarom, zeg tegen hen: Zo zegt de Heere HEERE: Ik zal dit spreekwoord doen ophouden, zodat zij het niet meer als spreekwoord zullen gebruiken in Israël. Maar spreek tot hen: De dagen zijn nabijgekomen, en het woord van elk visioen.", "Hebr 12:18": "Want u bent niet gekomen tot de tastbare berg, en het brandende vuur, en donkerheid, en duisternis, en onweer,", "Richt 20:38": "En de mannen van Israël hadden een afgesproken teken met de hinderlaag, dat zij een grote verheffing van rook uit de stad zouden laten opgaan.", "Ps 18:8": "Toen daverde en beefde de aarde, en de gronden van de bergen beroerden zich en daverden, omdat Hij ontstoken was.", "Jes 60:10": "En de vreemden zullen uw muren bouwen, en hun koningen zullen u dienen; want in Mijn verbolgenheid heb Ik u geslagen, maar in Mijn welbehagen heb Ik Mij over u ontfermd.", "Jer 18:7": "In een ogenblik zal Ik spreken over een volk en over een koninkrijk, dat Ik het zal uitrukken en afbreken en verdoen;", "Gen 15:1": "Na deze dingen kwam het woord van de HEERE tot Abram in een visioen, en Hij zei: Vrees niet, Abram! Ik ben u een Schild, uw Loon zeer groot.", "Hab 3:17": "Alhoewel de vijgenboom niet bloeien zal, en er geen vrucht aan de wijnstok zal zijn, dat het werk van de olijfboom liegen zal, en de velden geen voedsel voortbrengen; dat men de kudde uit de kooi zal wegscheuren, en dat er geen rund in de stallen zal zijn;", "Joz 14:12": "En nu, geef mij dit gebergte, waarvan de HEERE op die dag gesproken heeft; want u hebt op diezelfde dag gehoord dat de Enakieten daar waren, en dat er grote versterkte steden waren; misschien is de HEERE met mij, zodat ik hen verdrijf, zoals de HEERE gesproken heeft.", "Micha 5:6": "En het overblijfsel van Jakob zal zijn in het midden van veel volken, als een dauw van de HEERE, als druppels op het gras, dat naar geen man wacht, en op geen mensenkinderen hoopt.", "Joël 1:14": "Heilig een vasten, roep een verbodsdag uit, verzamel de oudsten, en alle inwoners van dit land, naar het huis van de HEERE, uw God, en roep tot de HEERE.", "Hos 5:8": "Blaas de bazuin te Gibea, de trompet te Rama; roep luid te Beth-Aven; achter u, Benjamin!", "Jer 30:9": "Maar zij zullen de HEERE, hun God, dienen, en hun koning David, die Ik hun verwekken zal.", "Amos 1:2": "En hij zei: De HEERE zal brullen uit Sion, en Zijn stem verheffen uit Jeruzalem; en de woningen van de herders zullen treuren, en de top van Karmel zal verdorren.", "Ps 96:12": "Laat het veld huppelt van vreugde met alles wat erin is, laat dan alle bomen van het woud juichen.", "Ps 65:14": "De velden zijn bekleed met kudden, en de dalen zijn bedekt met koren; zij juichen, ook zingen zij.", "Rom 2:4": "Of veracht u de rijkdom van Zijn goedertierenheid, en verdraagzaamheid, en geduld, zonder te weten dat de goedertierenheid van God u tot bekering leidt?", "2 Kron 6:38": "En zij zich tot U bekeren, met hun gehele hart en met hun gehele ziel, in het land van hun gevangenschap, waarheen zij hen gevankelijk weggevoerd hebben, en bidden zullen in de richting van hun land, dat U hun vaderen gegeven hebt, en naar deze stad die U verkoren hebt, en naar dit huis dat ik voor Uw Naam gebouwd heb;", "Joh 10:16": "Ik heb nog andere schapen, die niet van deze schaapskooi zijn; ook die moet Ik toebrengen; en zij zullen Mijn stem horen; en het zal worden één kudde, en één Herder.", "Fil 4:4": "Verblijd u in de Heere te allen tijd; opnieuw zeg ik: Verblijd u.", "2 Sam 5:8": "Want David zei op diezelfde dag: Ieder die de Jebusieten slaat en bij die watergoot komt, en die kreupelen en die blinden, die door Davids ziel gehaat worden, die zal tot een hoofd en tot een leider zijn; daarom zegt men: Een blinde en kreupele zal het huis niet binnenkomen.", "Luk 1:46": "En Maria zei: Mijn ziel maakt de Heere groot,", "2 Kon 8:13": "En Hazaël zei: Wat is uw dienaar toch, die een hond is, dat hij deze grote zaak zou doen? En Elisa zei: De HEERE heeft mij getoond dat u koning zult zijn over Syrië.", "Micha 6:14": "U zult eten, maar niet verzadigd worden, en uw neergedrukte honger zal in uw midden blijven; en u zult aangrijpen, maar niet wegbrengen, en wat u zult wegbrengen, zal Ik aan het zwaard overgeven.", "Amos 8:2": "En Hij zei: Wat ziet u, Amos? En ik zei: Een korf met zomervruchten. Toen zei de HEERE tegen mij: Het einde is gekomen over Mijn volk Israël; Ik zal het voortaan niet meer voorbijgaan.", "Matt 23:35": "opdat over u komt al het rechtvaardige bloed dat vergoten is op de aarde, vanaf het bloed van de rechtvaardige Abel tot het bloed van Zacharia, de zoon van Barachia, die u gedood hebt tussen de tempel en het altaar.", "Jer 16:7": "Ook zal men hun niets uitdelen bij de rouw, om iemand te troosten over een dode; noch hun te drinken geven uit de troostbeker, vanwege iemands vader of moeder.", "Ezech 36:15": "En Ik zal maken dat men de schimp van de heidenen niet meer over u hoort, en u zult de smaad van de natiën niet meer dragen; en u zult uw volken niet meer doen struikelen, spreekt de Heere HEERE.", "Jes 13:4": "Er is een ruisende stem op de bergen, gelijk aan een groot volk; een stem van gedruis van de koninkrijken, van de verzamelde heidenvolken; de HEERE van de heerscharen monstert het krijgsleger.", "Deut 26:11": "en u zult vrolijk zijn over al het goede dat de HEERE, uw God, aan u en uw huis gegeven heeft; u, en de Leviet, en de vreemdeling die in uw midden is.", "Openb 20:11": "En ik zag een grote witte troon, en Hem Die daarop zat, van Wiens aangezicht de aarde en de hemel wegvloden, en er werd geen plaats voor hen gevonden.", "Ps 50:3": "Onze God zal komen en zal niet zwijgen; een vuur voor Zijn aangezicht zal verteren, en rondom Hem zal het zeer stormen.", "Gal 4:26": "Maar het Jeruzalem dat boven is, is vrij, en dat is onze aller moeder.", "Micha 5:2": "Daarom zal Hij hen overgeven, tot de tijd toe dat zij, die baren zal, gebaard heeft; dan zullen de overigen van Zijn broeders zich bekeren met de kinderen van Israël.", "Jes 30:21": "En uw oren zullen het woord horen van hem die achter u is, die zegt: Dit is de weg, wandelt daarin; als u zou afwijken naar rechts of naar links.", "Ps 86:5": "Want Gij, Heere! zijt goed, en vergeeft graag, en van grote goedertierenheid voor allen die U aanroepen.", "Dan 9:16": "O Heere! naar al Uw gerechtigheden, laat toch Uw toorn en Uw grimmigheid afgekeerd worden van Uw stad Jeruzalem, Uw heilige berg; want om onze zonden en om de ongerechtigheden van onze vaderen zijn Jeruzalem en Uw volk tot smaad bij allen die rondom ons zijn.", "Ps 79:4": "Wij zijn onze buren tot smaad geworden; een spot en schimp voor hen die rondom ons zijn.", "Obadja 1:15": "Want de dag van de HEERE is nabij, over alle heidenvolken; zoals u gedaan hebt, zal u gedaan worden; uw vergelding zal op uw eigen hoofd terugkeren.", "Rom 5:21": "Opdat, zoals de zonde geheerst heeft tot de dood, zo ook de genade zou heersen door rechtvaardigheid tot het eeuwige leven, door Jezus Christus onze Heere.", "Ex 34:6": "Toen de HEERE nu voor zijn aangezicht voorbijging, riep Hij: HEERE, HEERE, God, barmhartig en genadig, geduldig en groot van goedertierenheid en waarheid.", "Zach 9:13": "Wanneer Ik Mij Juda zal gespannen hebben, en Ik Efraïm de boog zal gevuld hebben; en Ik uw kinderen, o Sion! zal verwekt hebben tegen uw kinderen, o Griekenland! en u gesteld zal hebben als het zwaard van een held.", "Micha 4:7": "En Ik zal haar die kreupel was maken tot een overblijfsel, en haar die ver weg verstoten was, tot een machtig volk; en de HEERE zal Koning over hen zijn op de berg Sion, van nu af aan tot in eeuwigheid.", "Ps 44:15": "U stelt ons tot een spreekwoord onder de heidenvolken, tot een hoofdschudden onder de volken.", "Ex 34:7": "Die de goedertierenheid bewaart aan vele duizenden, Die de ongerechtigheid, en overtreding, en zonde vergeeft; Die de schuldige geenszins onschuldig houdt, en de ongerechtigheid van de vaders bezoekt aan de kinderen, en aan de kindskinderen, tot in het derde en vierde geslacht.", "Ps 65:13": "Zij bedruipen de weiden van de woestijn; en de heuvels zijn omgord met blijdschap.", "Micha 5:7": "Ja, het overblijfsel van Jakob zal zijn onder de heidenen, in het midden van veel volken, als een leeuw onder de dieren van het woud, als een jonge leeuw onder de schaapskudden; die, wanneer hij erdoorheen gaat, vertreedt en verscheurt, zodat niemand redt.", "Zach 10:6": "En Ik zal het huis van Juda versterken, en het huis van Jozef zal Ik behouden, en Ik zal hen weer terugzetten; want Ik heb Mij over hen ontfermd, en zij zullen zijn alsof Ik hen niet verstoten had; want Ik ben de HEERE, hun God, en Ik zal hen verhoren.", "Amos 9:15": "En Ik zal ze in hun land planten; en zij zullen niet meer worden weggerukt uit hun land, dat Ik hun gegeven heb, zegt de HEERE, uw God.", "Jes 49:23": "En koningen zullen uw voedsterheren zijn, hun vorstinnen uw zoogvrouwen; zij zullen zich voor u buigen met het aangezicht ter aarde, en zij zullen het stof van uw voeten likken; en u zult weten, dat Ik de HEERE ben, dat zij niet beschaamd zullen worden die Mij verwachten.", "Jer 16:10": "En het zal gebeuren, als u dit volk al deze woorden aanzegt, en zij tegen u zeggen: Waarom spreekt de HEERE al dit grote kwaad over ons, en wat is onze misdaad, en wat is onze zonde, die wij tegen de HEERE, onze God, gezondigd hebben?", "Spr 30:27": "De sprinkhanen hebben geen koning; toch trekken zij allen uit, verdeeld in groepen.", "Hand 15:7": "En toen daarover een grote twist ontstond, stond Petrus op en zei tegen hen: Mannen broeders, u weet dat God van lang geleden onder ons mij uitgekozen heeft, dat de heidenen door mijn mond het woord van het Evangelie zouden horen, en geloven.", "Gal 3:28": "Daarin is geen Jood en geen Griek; daarin is geen slaaf en geen vrije; daarin is geen man en vrouw; want u bent allen één in Christus Jezus.", "Jer 29:12": "Dan zult u Mij aanroepen, en heengaan, en tot Mij bidden; en Ik zal naar u horen.", "Amos 7:4": "Verder liet de Heere HEERE mij dit zien: zie, de Heere HEERE riep, dat Hij wilde twisten met vuur; en het verteerde een grote afgrond, ook verteerde het een stuk land.", "Ps 98:8": "Laten de rivieren met de handen klappen, laten de bergen tegelijk vreugde bedrijven,", "Ps 145:16": "Pe. U doet Uw hand open, en verzadigt alles wat leeft, naar Uw welbehagen.", "Ex 10:15": "Want zij bedekten het oppervlak van het hele land, zodat het land verduisterd werd; en zij aten al het groen van het land op, en alle vruchten van de bomen die de hagel had overgelaten; en er bleef niets groens over aan de bomen, noch aan het groen van het veld, in het hele Egypteland.", "Ps 72:6": "Hij zal neerdalen als een regen op het nagras, als de druppels, die de aarde bevochtigen.", "Jak 4:9": "Gedraag u als ellendigen, en treur en ween; laat uw lachen veranderen in treuren, en uw blijdschap in verdriet.", "Obadja 1:17": "Maar op de berg Sion zal ontkoming zijn, en hij zal een heiligheid zijn; en zij die van het huis van Jakob zijn, zullen hun erfgoederen erfelijk bezitten.", "Judas 1:13": "Wilde golven van de zee, die hun eigen schande opschuimen; dwalende sterren, aan wie de zwartste duisternis voor eeuwig bewaard wordt.", "Ef 2:4": "Maar God, Die rijk is in barmhartigheid door Zijn grote liefde, waarmee Hij ons liefgehad heeft,", "Nahum 3:2": "Er is het geklap van de zweep, en het geluid van het bulderen van de raderen; en de paarden stampen, en de wagens springen op.", "Jes 49:6": "Verder zei Hij: Het is te gering, dat U Mij een Knecht zou zijn, om op te richten de stammen van Jakob, en om terug te brengen de bewaarden in Israël; Ik heb U ook gegeven tot een Licht van de heidenen, om Mijn heil te zijn tot aan het einde van de aarde.", "Amos 9:13": "Zie, de dagen komen, spreekt de HEERE, dat de ploeger de maaier zal bereiken, en de druiventreder de zaadzaaier; en de bergen zullen van zoete wijn druipen, en alle heuvels zullen smelten.", "Hand 2:33": "Hij dan, door de rechterhand van God verhoogd, en de belofte van de Heilige Geest ontvangen hebbend van de Vader, heeft dit uitgestort, wat u nu ziet en hoort.", "1 Kor 3:7": "Zo is dan noch hij die plant iets, noch hij die nat maakt, maar God, Die de groei geeft.", "Hoogl 4:13": "Uw scheuten zijn een paradijs van granaatappels, met edele vruchten, cyprus met nardus;", "Ps 25:3": "Gimel. Ja, allen die U verwachten, zullen niet beschaamd worden; zij zullen beschaamd worden, die trouweloos handelen zonder oorzaak.", "Hoogl 5:1": "Ik ben in Mijn hof gekomen, o Mijn zuster, o bruid! Ik heb Mijn mirre geplukt met Mijn specerij; Ik heb Mijn honigraten met Mijn honig gegeten; Ik heb Mijn wijn, alsook Mijn melk gedronken. Eet, vrienden! Drink, en word dronken, o liefsten!", "Jes 42:13": "De HEERE zal uittrekken als een held; Hij zal de ijver opwekken als een krijgsman; Hij zal juichen, ja, Hij zal een groot geschreeuw maken; Hij zal Zijn vijanden overweldigen.", "Ezech 32:7": "En als Ik u zal uitblussen, zal Ik de hemel bedekken en zijn sterren zwart maken; Ik zal de zon met wolken bedekken, en de maan zal haar licht niet laten schijnen.", "Neh 4:17": "Zij die aan de muur bouwden en zij die de lasten droegen, en zij die inlaadden, waren ieder met de ene hand bezig met het werk, en met de andere hielden zij het wapen vast.", "Ezech 47:18": "De oostkant nu zult u meten van tussen Havran en tussen Damaskus en tussen Gilead en tussen het land van Israël, langs de Jordaan, vanaf het gebied tot de Oostzee toe; en dat zal de oostkant zijn.", "Joël 1:15": "Ach, die dag! Want de dag van de HEERE is nabij, en zal als een verwoesting komen van de Almachtige.", "Job 33:23": "Is er dan bij Hem een Gezant, een Uitlegger, een uit duizend, om de mens zijn rechte plicht te verkondigen;", "Jes 30:23": "Dan zal Hij uw zaad, waarmee u het land bezaaid hebt, regen geven, en brood van de opbrengst van het land, en dat zal vet en overvloedig zijn; uw vee zal op die dag in een wijde landouwe weiden.", "Jes 45:5": "Ik ben de HEERE, en niemand meer, buiten Mij is er geen God; Ik zal u gorden, hoewel u Mij niet kent.", "Matt 3:12": "Zijn wan is in Zijn hand, en Hij zal Zijn dorsvloer helemaal zuiveren, en Zijn tarwe in Zijn schuur samenbrengen, en Hij zal het kaf met onblusbaar vuur verbranden.", "Klaagl 3:41": "Nun. Laat ons onze harten opheffen, alsook de handen, tot God in de hemel, en zeggen:", "Micha 7:18": "Wie is een God gelijk U, Die de ongerechtigheid vergeeft, en de overtreding van het overblijfsel van Zijn erfenis voorbijgaat? Hij houdt Zijn toorn niet voor eeuwig vast; want Hij heeft lust aan goedertierenheid.", "Rom 5:5": "En de hoop beschaamt niet, omdat de liefde van God in onze harten uitgestort is door de Heilige Geest, Die ons gegeven is.", "Luk 21:25": "En er zullen tekenen zijn in de zon, en maan, en sterren, en op de aarde benauwdheid van de volken met radeloosheid, wanneer de zee en de watergolven groot geluid zullen geven;", "Luk 15:20": "En hij stond op en ging naar zijn vader. En toen hij nog ver van hem verwijderd was, zag zijn vader hem, en werd innerlijk met ontferming bewogen; en hij liep hem tegemoet, viel hem om de hals, en kuste hem.", "Num 10:8": "En de zonen van Aäron, de priesters, zullen met die trompetten blazen; en zij zullen u zijn tot een eeuwige inzetting bij uw geslachten.", "Zach 1:14": "En de Engel Die met mij sprak, zei tegen mij: Roep uit en zeg: Zo zegt de HEERE van de heerscharen: Ik ijver over Jeruzalem en over Sion met een grote ijver.", "Gen 37:34": "Toen scheurde Jakob zijn kleren en legde een zak om zijn heupen; en hij bedreef rouw over zijn zoon, vele dagen.", "Luk 21:26": "En de mensen zal het hart bezwijken van vrees en verwachting van de dingen die het aardrijk zullen overkomen; want de krachten van de hemelen zullen bewogen worden.", "Deut 32:2": "Mijn leer druipt als een regen, mijn rede vloeit als een dauw; als een stofregen op de grasscheutjes, en als druppels op het kruid.", "2 Sam 2:18": "Nu waren daar drie zonen van Zeruja, Joab, en Abisai en Asahel; en Asahel was licht op zijn voeten, als een van de reeën die in het veld zijn.", "Rom 11:7": "Wat dan? Wat Israël zoekt, dat heeft het niet verkregen; maar de uitverkorenen hebben het verkregen, en de anderen zijn verhard geworden.", "Jer 30:10": "Gij dan, vrees niet, o Mijn knecht Jakob! spreekt de HEERE, wees niet ontzet, Israël! Want zie, Ik zal u uit verre landen verlossen, en uw nageslacht uit het land van hun gevangenschap; en Jakob zal terugkomen, en stil en gerust zijn, en er zal niemand zijn die hem verschrikt.", "Rom 11:5": "Zo is er dan ook in deze tegenwoordige tijd een overblijfsel geworden, naar de verkiezing van de genade.", "Ps 119:120": "Het haar van mijn vlees is te berge gerezen van verschrikking voor U, en ik heb gevreesd voor Uw oordelen.", "Nahum 2:10": "Zij is geledigd, ja, uitgeledigd, uitgeput, en haar hart smelt weg, en de knieën schudden, en in alle lenden is smart, en aller aangezichten worden bleek, als een pot.", "Ex 19:15": "En hij zei tot het volk: Weest gereed tegen de derde dag, en nadert niet tot de vrouw.", "1 Sam 16:5": "Hij zei: Met vrede; ik ben gekomen om de HEERE een offer te brengen; heilig uzelf, en kom met mij naar het offer; en hij heiligde Isaï en zijn zonen, en nodigde hen uit voor het offer.", "Richt 20:40": "Toen begon de verheffing op te gaan uit de stad, als een pilaar van rook; toen nu Benjamin achter zich omzag, ziet, zo ging de brand van de stad op naar de hemel.", "Hos 12:7": "U dan, bekeer u tot uw God, bewaar goedertierenheid en recht, en wacht voortdurend op uw God.", "Hoogl 3:6": "Wie is zij, die daar opkomt uit de woestijn, als rookpilaren, berookt met mirre en wierook, en met allerlei poeder van de kruidenier?", "Ezech 39:22": "En zij die van het huis van Israël zijn, zullen weten dat Ik, de HEERE, hun God ben, vanaf die dag en voortaan.", "Ps 79:10": "Waarom zouden de heidenen zeggen: Waar is hun God? Laat de wraak van het vergoten bloed van Uw knechten onder de heidenen voor onze ogen bekend worden.", "Hebr 12:22": "Maar u bent gekomen tot de berg Sion, en de stad van de levende God, tot het hemelse Jeruzalem, en de vele duizenden engelen;", "Spr 16:15": "In het licht van het gezicht van de koning is leven; en zijn welbehagen is als een wolk van de late regen.", "Deut 12:18": "Maar u zult dat eten voor het aangezicht van de HEERE, uw God, in de plaats die de HEERE, uw God, zal uitkiezen, u, en uw zoon, en uw dochter, en uw dienstknecht, en uw dienstmaagd, en de Leviet die in uw poorten is; en u zult vrolijk zijn voor het aangezicht van de HEERE, uw God, over alles waaraan u uw handen geslagen hebt.", "2 Tess 2:13": "Maar wij zijn verplicht altijd God te danken voor u, broeders, die door de Heere bemind bent, dat God u van het begin af verkoren heeft tot zaligheid, in heiliging door de Geest, en geloof in de waarheid;", "Ezech 7:10": "Zie, de dag, zie, de morgenstond is gekomen, de morgenstond is voortgekomen, de roede heeft gebloeid, de hoogmoed heeft gebloeid.", "Mark 13:19": "Want die dagen zullen zo'n verdrukking zijn, zoals er niet geweest is vanaf het begin van de schepping die God geschapen heeft, tot nu toe, en er ook niet meer zal zijn.", "Jes 55:12": "Want in blijdschap zult u uittrekken, en met vrede voortgeleid worden; de bergen en heuvelen zullen geschal maken met vrolijk gezang voor uw aangezicht, en alle bomen van het veld zullen de handen samenklappen.", "1 Sam 12:24": "Vrees alleen de HEERE, en dien Hem trouw met uw hele hart; want zie, hoe grote dingen Hij bij u gedaan heeft!", "Dan 12:1": "En in die tijd zal Michaël opstaan, die grote vorst, die voor de kinderen van uw volk staat, als het zo'n tijd van benauwdheid zal zijn, als er niet geweest is sinds er een volk geweest is, tot op die tijd toe; en in die tijd zal uw volk verlost worden, ieder die gevonden wordt geschreven te zijn in het boek.", "Ps 89:52": "Waarmee, o HEERE! Uw vijanden smaden, waarmee zij de voetstappen van Uw gezalfde smaden.", "2 Tess 2:14": "waartoe Hij u geroepen heeft door ons Evangelie, tot verkrijging van de heerlijkheid van onze Heere Jezus Christus.", "Gen 33:11": "Neem toch mijn zegen aan, die u gebracht is, omdat God mij genadig behandeld heeft, en omdat ik alles heb wat ik nodig heb; en hij hield bij hem aan, zodat hij het aannam.", "2 Kon 10:20": "Verder zei Jehu: Heiligt Baäl een dag van het verbod. En zij riepen die uit.", "1 Kon 21:27": "Het gebeurde nu, toen Achab deze woorden hoorde, dat hij zijn kleren scheurde, en een zak om zijn lichaam legde, en vastte; hij lag ook neer in de zak, en ging langzaam.", "Deut 29:11": "Uw kinderen, uw vrouwen, en uw vreemdeling, die in het midden van uw kamp is, van uw houthakker tot uw waterputter toe;", "1 Kon 6:3": "En het voorhuis, vooraan de tempel van dat huis, was in zijn lengte twintig ellen, overeenkomstig de breedte van het huis, tien ellen in zijn breedte, vooraan het huis.", "Amos 7:2": "En het gebeurde, toen zij het gewas van het land helemaal zouden hebben opgegeten, dat ik zei: Heere HEERE, vergeef toch; wie zou er van Jakob blijven staan, want hij is klein!", "Ps 97:2": "Rondom Hem zijn wolken en donkerheid, gerechtigheid en recht zijn de vastigheid van Zijn troon.", "Ps 96:11": "Laat de hemel zich verblijden, en de aarde zich verheugt, laat de zee bruist met haar volheid.", "Ps 36:7": "Uw gerechtigheid is als de bergen van God, Uw oordelen zijn een grote afgrond; HEERE! U behoudt mensen en beesten.", "Ezech 8:16": "En Hij bracht mij tot de binnenste voorhof van het huis van de HEERE; en zie, aan de deur van de tempel van de HEERE, tussen het voorhuis en het altaar, waren ongeveer vijfentwintig mannen; hun achterste lichaamsdelen waren naar de tempel van de HEERE, en hun gezichten naar het oosten, en zij bogen zich neer naar het oosten voor de zon.", "Mal 4:5": "Zie, Ik zend u de profeet Elia, voordat die grote en vreselijke dag van de HEERE komt.", "2 Kon 6:30": "En het gebeurde, toen de koning de woorden van deze vrouw gehoord had, dat hij zijn kleren scheurde, terwijl hij over de muur voortging; en het volk zag dat er, zie, een zak van binnen over zijn vlees was.", "Klaagl 3:40": "Nun. Laat ons onze wegen onderzoeken en doorzoeken, en laat ons terugkeren tot de HEERE.", "2 Kron 30:17": "Want er was een menigte in die gemeente, die zich niet geheiligd hadden; daarom waren de Levieten belast met het slachten van de paaslammeren, voor ieder die niet rein was, om die voor de HEERE te heiligen.", "Jer 5:22": "Zult u Mij niet vrezen? spreekt de HEERE; zult u voor Mijn aangezicht niet beven? Ik heb het zand tot een grens voor de zee gesteld, met een eeuwige verordening, zodat zij daar niet overheen zal gaan; al bewegen haar golven zich, toch zullen zij niets vermogen, al bruisen zij, toch zullen zij daar niet overheen gaan.", "Jak 4:8": "Kom dicht bij God, en Hij zal dicht bij u komen. Reinig de handen, zondaars, en zuiver de harten, dubbelhartigen!", "Jes 30:24": "En de ossen, en ezelveulens, die het land bewerken, zullen zuiver voeder eten, dat verschud is met de werpschoffel en met de wan.", "Deut 4:30": "Wanneer u in angst zult zijn, en al deze dingen u zullen treffen, in de laatste dagen, dan zult u terugkeren tot de HEERE, uw God, en Zijn stem gehoorzaam zijn.", "Jes 54:4": "Vrees niet, want u zult niet beschaamd worden, en word niet schaamrood, want u zult niet te schande worden; maar u zult de schaamte van uw jonkheid vergeten, en de smaad van het weduwschap zult u niet meer gedenken.", "Ps 71:19": "Ook is Uw gerechtigheid, o God, tot in de hoogte; Gij, Die grote dingen gedaan hebt; o God! wie is U gelijk?", "1 Petr 2:6": "Daarom staat er ook in de Schrift: Zie, Ik leg in Sion een uitverkoren, kostbare hoeksteen; en wie in Hem gelooft, zal niet beschaamd worden.", "Joël 1:10": "Het veld is verwoest, het land treurt; want het koren is verwoest, de most is verdroogd, de olie is uitgeput.", "Matt 5:4": "Zalig zijn zij die treuren, want zij zullen vertroost worden.", "Deut 4:32": "Want vraag toch naar de vorige dagen, die vóór u geweest zijn, vanaf de dag dat God de mens op de aarde geschapen heeft, van het ene einde van de hemel tot aan het andere einde van de hemel, of er ooit zo'n groot ding gebeurd of gehoord is als dit:", "2 Kron 29:23": "Daarna brachten zij de bokken naderbij, als zondoffer, voor het aangezicht van de koning en de gemeente, en zij legden hun handen op hen.", "Gal 4:27": "Want er is geschreven: Wees vrolijk, u onvruchtbare, die niet baart, breek uit en roep, u die geen weeën hebt, want de kinderen van de eenzame zijn veel meer dan van haar die de man heeft.", "Jer 36:9": "Want het gebeurde in het vijfde jaar van Jojakim, de zoon van Josia, de koning van Juda, in de negende maand, dat zij een vasten voor het aangezicht van de HEERE uitriepen, voor het hele volk in Jeruzalem, alsook voor het hele volk dat uit de steden van Juda naar Jeruzalem kwam.", "Ps 86:15": "Maar Gij, Heere! zijt een barmhartig en genadig God, geduldig, en groot van goedertierenheid en waarheid.", "Jes 34:4": "En heel het leger van de hemelen zal wegkwijnen, en de hemelen zullen worden opgerold als een boek, en heel hun leger zal afvallen, zoals een blad van de wijnstok afvalt, en zoals een vijg afvalt van de vijgenboom.", "Jer 31:7": "Want zo zegt de HEERE: Roept luide over Jakob met vreugde, en juicht vanwege het hoofd van de heidenvolken; laat het horen, lofzingt, en zegt: O HEERE! Behoud Uw volk, het overblijfsel van Israël.", "2 Kron 7:13": "Als Ik de hemel toesluit, zodat er geen regen is, of als Ik de sprinkhaan gebied het land te verteren, of als Ik pest onder Mijn volk zend;", "Num 24:23": "Vervolgens hief hij zijn spreuk op en zei: Och, wie zal leven, als God dit doet!", "Ezech 36:8": "Maar u, o bergen van Israël! U zult weer uw takken geven, en uw vrucht voor Mijn volk Israël dragen, want zij zijn dicht bij om te komen.", "Jes 59:20": "En er zal een Verlosser tot Sion komen, namelijk voor hen die zich bekeren van de overtreding in Jakob, spreekt de HEERE.", "2 Kron 7:20": "Dan zal Ik hen uitrukken uit Mijn land, dat Ik hun gegeven heb, en dit huis, dat Ik voor Mijn Naam geheiligd heb, zal Ik van Mijn aangezicht wegwerpen, en zal het tot een spreekwoord en spotrede onder alle volken maken.", "2 Kor 6:16": "Of welke samenvoeging heeft de tempel van God met de afgoden? Want u bent de tempel van de levende God; zoals God gezegd heeft: Ik zal in hen wonen, en Ik zal onder hen wandelen; en Ik zal hun God zijn, en zij zullen Mij een volk zijn.", "Ps 116:7": "Mijn ziel, keer terug tot uw rust, want de HEERE heeft u goedgedaan.", "2 Sam 22:14": "De HEERE donderde vanuit de hemel, en de Allerhoogste gaf Zijn stem.", "Jer 8:21": "Ik ben gebroken vanwege de breuk van de dochter van mijn volk; ik ga gehuld in het zwart, ontzetting heeft mij aangegrepen.", "2 Kon 22:11": "Het gebeurde nu, toen de koning de woorden van het wetboek hoorde, dat hij zijn kleren scheurde.", "Amos 4:13": "Want zie, Die de bergen vormt, en de wind schept, en de mens bekendmaakt wat Zijn gedachte is, Die de dageraad duisternis maakt, en op de hoogten van de aarde treedt, HEERE, God van de heerscharen, is Zijn Naam.", "Lev 26:4": "Dan zal Ik uw regens geven op hun tijd; en het land zal zijn opbrengst geven, en het geboomte van het veld zal zijn vrucht geven;", "Openb 18:8": "Daarom zullen haar plagen op één dag komen, namelijk dood, en rouw, en honger, en zij zal met vuur verbrand worden; want sterk is de Heere God, Die haar oordeelt.", "Jes 12:6": "Juich en zing vrolijk, u inwoners van Sion! Want de Heilige van Israël is groot in uw midden.", "Deut 11:24": "Elke plaats, waar uw voetzool op treedt, zal de uwe zijn; van de woestijn en de Libanon, van de rivier, de rivier de Eufraat, tot aan de verste zee, zal uw gebied zijn.", "Joël 1:3": "Vertel uw kinderen daarvan, en laat het uw kinderen hun kinderen vertellen, en van die kinderen aan een ander geslacht.", "Zef 3:11": "Op die dag zult u niet beschaamd zijn vanwege al uw handelingen, waarmee u tegen Mij overtreden hebt; want dan zal Ik uit uw midden wegnemen wie van vreugde opspringen over uw hoogmoed, en u zult zich voortaan niet meer verheffen om Mijn heilige berg.", "Spr 1:23": "Keert u tot Mijn bestraffing; ziet, Ik zal Mijn Geest overvloedig over u uitstorten; Ik zal Mijn woorden u bekendmaken.", "Openb 18:9": "En de koningen van de aarde, die met haar gehoereerd en in weelde geleefd hebben, zullen haar bewenen, en rouw over haar bedrijven, wanneer zij de rook van haar brand zullen zien;", "Zef 3:17": "De HEERE, uw God, is in uw midden, een Held, Die verlossen zal; Hij zal Zich over u verblijden met blijdschap, Hij zal zwijgen in Zijn liefde, Hij zal Zich over u verheugen met gejuich.", "Ezech 33:3": "En hij het zwaard over het land ziet komen, en op de bazuin blaast en het volk waarschuwt;", "Jer 4:1": "Als u zich zult bekeren, Israël! spreekt de HEERE, bekeer u tot Mij; en als u uw afschuwelijke afgoden van Mijn aangezicht zult wegdoen, dwaal dan niet meer rond.", "Matt 27:43": "Hij heeft op God vertrouwd; laat God Hem nu verlossen, als Hij Hem tenminste wil hebben; want Hij heeft gezegd: Ik ben Gods Zoon.", "Ps 104:34": "Mijn overdenking van Hem zal zoet zijn; ik zal mij in de HEERE verblijden.", "Ps 33:1": "Rechtvaardigen! Zingt vrolijk in de HEERE; lof past de oprechten.", "Zef 3:16": "Op die dag zal tegen Jeruzalem gezegd worden: Vrees niet, o Sion! Laat uw handen niet slap worden.", "Ps 87:1": "Een psalm, een lied voor de kinderen van Korach. Zijn grondslag is op de bergen van heiligheid.", "Jes 61:10": "Ik verheug mij zeer in de HEERE, mijn ziel verblijdt zich in mijn God, want Hij heeft mij bekleed met de klederen van het heil, de mantel van de gerechtigheid heeft Hij mij omgedaan; zoals een bruidegom zich met priesterlijk sieraad versiert, en zoals een bruid zich versiert met haar sieraden.", "1 Sam 7:3": "Toen sprak Samuël tot heel het huis van Israël en zei: Als u zich met heel uw hart tot de HEERE bekeert, doe dan de vreemde goden uit uw midden weg, ook de Astharoths; en richt uw hart op de HEERE, en dien Hem alleen, dan zal Hij u uit de hand van de Filistijnen rukken.", "Jona 1:6": "En de opperschipper kwam naar hem toe, en zei tegen hem: Wat is er met u, harde slaper? Sta op, roep tot uw God; misschien zal die God aan ons denken, zodat wij niet vergaan.", "Ezra 9:4": "Toen verzamelden zich bij mij allen die voor de woorden van de God van Israël beefden, om de overtreding van de weggevoerden; maar ik bleef verbaasd zitten tot aan het avondoffer.", "Ezech 36:30": "En Ik zal de vrucht van het geboomte en de opbrengst van het veld vermenigvuldigen, opdat u de smaad van het honger niet meer ontvangt onder de heidenen.", "Zach 8:15": "zo ben Ik van plan opnieuw in deze dagen goed te doen aan Jeruzalem, en aan het huis van Juda; wees niet bang!", "Zach 9:17": "Want hoe groot zal zijn goed wezen en hoe groot zal zijn schoonheid wezen! Het koren zal de jongelingen, en de most zal de jonkvrouwen sprekend maken.", "Jer 4:23": "Ik keek naar het land, en zie, het was woest en leeg; ook naar de hemel, en zijn licht was er niet.", "Jes 57:15": "Want zo zeg
