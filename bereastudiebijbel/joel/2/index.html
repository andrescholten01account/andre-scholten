t de Hoge en Verhevene, Die in de eeuwigheid woont, en Wiens Naam heilig is: Ik woon in de hoogte en in het heilige, en bij hem die een verbrijzelde en nederige geest heeft, om de geest van de nederigen levend te maken, en om het hart van de verbrijzelden levend te maken.", "Joz 8:20": "Toen de mannen van Ai zich omkeerden, zagen zij, en zie, de rook van de stad steeg op naar de hemel; en zij hadden geen mogelijkheid om deze of gene kant op te vluchten; want het volk dat naar de woestijn vluchtte, keerde zich om tegen hen die hen achtervolgden.", "Hos 6:3": "Dan zullen wij kennen, wij zullen ernaar streven om de Heere te kennen; Zijn opgang is zeker als de dageraad; en Hij zal tot ons komen als een regen, als de late regen en vroege regen voor het land.", "Hand 15:8": "En God, de Kenner van de harten, heeft hun getuigenis gegeven, doordat Hij hun de Heilige Geest gaf, evenals ook aan ons;", "Ps 119:83": "Want ik ben geworden als een lederen zak in de rook; doch Uw inzettingen heb ik niet vergeten.", "Jes 63:15": "Zie neer van de hemel, en aanschouw van Uw heilige en Uw heerlijke woning; waar zijn Uw ijver en Uw krachten, het gerommel van Uw ingewand en van Uw barmhartigheden? Zij houden zich tegen mij in.", "Jer 30:6": "Vraagt toch en kijkt, of een man een kind baart? Waarom zie Ik dan van ieder man de handen op zijn heupen, als van een barende vrouw, en alle gezichten veranderd in bleekheid?", "Jes 53:6": "Wij dwaalden allen als schapen, wij keerden ons ieder naar zijn eigen weg; maar de HEERE heeft de ongerechtigheid van ons allen op Hem doen neerkomen.", "Ezech 34:27": "En het geboomte van het veld zal zijn vrucht geven, en het land zal zijn opbrengst geven, en zij zullen zeker zijn in hun land; en zullen weten, dat Ik de HEERE ben, als Ik de disselbomen van hun juk zal hebben verbroken, en hen gered heb uit de hand van hen die zich door hen deden dienen.", "Jes 46:13": "Ik breng Mijn gerechtigheid nabij, zij zal niet ver weg zijn, en Mijn heil zal niet uitblijven; maar Ik zal heil geven in Sion, aan Israël Mijn heerlijkheid.", "Deut 26:10": "En nu, zie, ik heb de eerstelingen van de vrucht van dit land gebracht, dat U, HEERE, mij gegeven hebt! Dan zult u ze neerzetten voor het aangezicht van de HEERE, uw God, en u buigen voor het aangezicht van de HEERE, uw God;", "Ps 37:19": "Zij zullen niet beschaamd worden in de kwade tijd, en in de dagen van het honger zullen zij verzadigd worden.", "Rom 9:33": "zoals geschreven is: Zie, Ik leg in Sion een steen des aanstoots, en een rots der ergernis; en ieder die in Hem gelooft, zal niet beschaamd worden.", "Joël 3:17": "En u zult weten dat Ik de HEERE, uw God, ben, die op Sion woont, Mijn heilige berg; en Jeruzalem zal heilig zijn, en vreemden zullen er niet meer doorheen trekken.", "Ps 126:2": "Toen was onze mond vol lachen, en onze tong vol gejuich; toen zei men onder de heidenvolken: De HEERE heeft grote dingen aan hen gedaan.", "2 Sam 2:19": "En Asahel jaagde Abner achterna; en hij week niet af, om van achter Abner naar rechts of naar links af te gaan.", "Hos 14:3": "Neem deze woorden met u, en bekeer u tot de Heere; zeg tegen Hem: Neem weg alle ongerechtigheid, en geef het goede, zo zullen wij betalen de stieren van onze lippen.", "Jer 9:21": "Want de dood is geklommen in onze vensters, hij is in onze paleizen gekomen, om de kinderen uit te roeien van de wijken, de jongemannen van de straten.", "Hagg 2:20": "Is er nog zaad in de schuur? Zelfs de wijnstok, en de vijgenboom, en de granaatappelboom, en de olijfboom, die niet gedragen hebben, die zal Ik vanaf deze dag zegenen.", "Neh 9:1": "Verder, op de vierentwintigste dag van deze maand verzamelden de kinderen van Israël zich met vasten en met zakken, en aarde was op hen.", "Ezech 7:12": "De tijd is gekomen, de dag is genaderd; de koper zij niet blij, en de verkoper klaagt niet; want een brandende toorn is over de gehele menigte van het land.", "Job 36:12": "Maar als zij niet horen, dan gaan zij door het zwaard om, en geven zij de geest zonder kennis.", "Nahum 1:3": "De HEERE is geduldig, maar van grote kracht, en Hij houdt de schuldige zeker niet onschuldig. De weg van de HEERE is in wervelwind en in storm, en de wolken zijn het stof van Zijn voeten.", "1 Petr 4:7": "En het einde van alle dingen is nabij; wees dan nuchter en waak in de gebeden.", "2 Kron 23:10": "En hij stelde heel het volk op, ieder met zijn wapen in zijn hand, van de rechterzijde van het huis tot de linkerzijde van het huis, bij het altaar en bij het huis, rondom de koning.", "Openb 6:17": "Want de grote dag van Zijn toorn is gekomen, en wie kan bestaan?", "Ps 103:8": "Barmhartig en genadig is de HEERE, geduldig en groot van goedertierenheid.", "Jes 62:8": "De HEERE heeft gezworen bij Zijn rechterhand, en bij de arm van Zijn sterkte: Als Ik uw koren nog geef tot voedsel voor uw vijanden, en als de vreemden zullen drinken van uw most, waarvoor u hebt gewerkt!", "Hand 26:20": "Maar heb eerst aan hen die te Damaskus waren, en te Jeruzalem, en in het gehele land Judea, en aan de heidenen verkondigd dat zij zich zouden bekeren en zich tot God bekeren, en werken zouden doen die de bekering waardig zijn.", "Ps 103:13": "Zoals een vader zich ontfermt over zijn kinderen, ontfermt de HEERE Zich over hen die Hem vrezen.", "Jes 30:30": "En de HEERE zal Zijn heerlijke stem doen horen, en de nederlating van Zijn arm doen zien, met grimmigheid van toorn, en een vlam van verterend vuur, stralen, en een vloed, en hagelstenen.", "Jes 5:30": "En zij zullen op die dag tegen hen bruisen, als het bruisen van de zee. Als men dan naar het land kijkt, zie, dan is er duisternis en benauwdheid, en het licht zal verduisterd worden in de wolken erboven.", "Ps 32:11": "Verblijd u in de HEERE, en verheug u, rechtvaardigen! En zing vrolijk, alle oprechten van hart!", "Joz 7:13": "Sta op, heilig het volk, en zeg: Heilig uzelf tegen morgen; want zo zegt de HEERE, de God van Israël: Er is een ban in uw midden, Israël! U zult niet kunnen standhouden voor het aangezicht van uw vijanden, totdat u de ban uit uw midden wegdoet.", "Ps 28:7": "De HEERE is mijn Sterkte en mijn Schild; op Hem heeft mijn hart vertrouwd, en ik ben geholpen; daarom springt mijn hart op van vreugde, en ik zal Hem met mijn gezang loven.", "Jes 55:2": "Waarom weegt u geld uit voor wat geen brood is, en uw arbeid voor wat niet verzadigen kan? Hoor aandachtig naar Mij, en eet het goede, en laat uw ziel zich verlustigen in vettigheid.", "Deut 6:11": "En huizen, vol van alle goeds, die u niet gevuld hebt, en uitgehouwen putten, die u niet uitgehouwen hebt, wijngaarden en olijfgaarden, die u niet geplant hebt, en u gegeten hebt en verzadigd bent;", "2 Kron 7:14": "En Mijn volk, over wie Mijn Naam genoemd wordt, zich verootmoedigt en bidt, en zij Mijn aangezicht zoeken, en zich bekeren van hun slechte wegen; dan zal Ik uit de hemel horen, en hun zonden vergeven, en hun land genezen.", "Dan 9:18": "Neig Uw oor, mijn God! en hoor, doe Uw ogen open, en zie onze verwoestingen, en de stad die naar Uw Naam genoemd is; want wij leggen onze smekingen niet voor Uw aangezicht neer om onze gerechtigheden, maar om Uw barmhartigheden, die groot zijn.", "Ps 72:18": "Geloofd zij de HEERE God, de God van Israël, Die alleen wonderen doet.", "Jes 45:17": "Maar Israël wordt verlost door de HEERE, met een eeuwige verlossing; u zult niet beschaamd worden, ook niet tot schande worden, tot in alle eeuwigheden.", "Joël 1:20": "Ook schreeuwt elk beest van het veld tot U; want de waterstromen zijn uitgedroogd, en een vuur heeft de weiden van de woestijn verteerd.", "1 Kor 1:2": "Aan de Gemeente van God, die te Korinthe is, de geheiligden in Christus Jezus, de geroepen heiligen, met allen die de Naam van onze Heere Jezus Christus aanroepen in elke plaats, zowel hun als onze Heere;", "Num 10:3": "Als zij daarmee blazen zullen, dan zal de hele vergadering tot u verzameld worden, aan de deur van de tent der samenkomst.", "Gen 4:12": "Als u de aardbodem bewerkt, zal hij u zijn opbrengst niet meer geven; u zult zwervend en dolend zijn op de aarde.", "Jes 13:10": "Want de sterren van de hemel en zijn sterrenbeelden zullen hun licht niet laten schijnen; de zon zal verduisterd worden wanneer zij opgaat, en de maan zal haar licht niet laten schijnen.", "Job 33:18": "Dat Hij zijn ziel van het verderf afhoudt; en zijn leven, dat het door het zwaard niet doorga.", "Deut 4:29": "Dan zult u vandaar de HEERE, uw God, zoeken, en vinden; als u Hem zoekt met heel uw hart en met heel uw ziel.", "Jes 45:18": "Want zo zegt de HEERE, Die de hemelen geschapen heeft, die God, Die de aarde gevormd heeft, en Die haar gemaakt heeft; Hij heeft haar bevestigd, Hij heeft haar niet geschapen opdat zij leeg zou zijn, maar heeft haar gevormd opdat men daarin zou wonen: Ik ben de HEERE, en niemand meer.", "Zach 8:3": "Zo zegt de HEERE: Ik ben teruggekeerd naar Sion, en Ik zal in het midden van Jeruzalem wonen; en Jeruzalem zal genoemd worden een stad van de waarheid, en de berg van de HEERE van de heerscharen, een berg van heiligheid.", "Deut 32:16": "Zij hebben Hem tot ijver verwekt door vreemde goden; door gruwelen hebben zij Hem tot toorn verwekt.", "Zach 7:14": "Maar Ik heb hen weggestormd onder alle heidenvolken die zij niet kenden; en het land werd achter hen verwoest, zodat niemand er doorheen trok of terugkeerde; want zij maakten het begerenswaardige land tot een verwoesting.", "Ex 10:14": "En de sprinkhanen kwamen op over het hele Egypteland, en streken neer over het hele gebied van de Egyptenaren, heel zwaar; vóór deze tijd zijn er zulke sprinkhanen als deze nooit geweest, en na deze tijd zullen er zulke niet meer zijn;", "Spr 13:25": "De rechtvaardige eet tot verzadiging van zijn ziel toe; maar de buik van de goddelozen zal gebrek hebben.", "Ps 46:6": "God is in het midden van haar, zij zal niet wankelen; God zal haar helpen bij het aanbreken van de morgenstond.", "Jes 7:18": "Want het zal op die dag gebeuren, dat de HEERE zal fluiten naar de vliegen, die aan het einde van de rivieren van Egypte zijn, en naar de bijen die in het land van Assyrië zijn.", "Jes 41:16": "U zult ze wannen, en de wind zal ze wegvoeren, en de stormwind zal ze verstrooien; maar u zult u verheugen in de HEERE; in de Heilige van Israël zult u zich beroemen.", "Jes 55:7": "De goddeloze verlaat zijn weg, en de onrechtvaardige man zijn gedachten; en hij bekeert zich tot de HEERE, zo zal Hij Zich over hem ontfermen, en tot onze God, want Hij vergeeft menigvuldig.", "Ex 19:22": "Daartoe zullen ook de priesters, die tot de HEERE naderen, zich heiligen, dat de HEERE niet tegen hen uitbreekt.", "Hagg 2:17": "Voordat die dingen gebeurden, kwam iemand bij de korenhoop van twintig maten, en er waren er maar tien; kwam iemand bij de wijnbak om vijftig maten uit de pers te putten, en er waren er maar twintig.", "Luk 1:47": "en mijn geest verheugt zich in God, mijn Zaligmaker;", "Deut 6:12": "Zo let erop, dat u de HEERE niet vergeet, Die u uit Egypteland, uit het diensthuis heeft uitgeleid.", "Jer 13:16": "Geeft eer aan de HEERE, uw God, voor Hij het duister maakt, en voor uw voeten zich stoten aan de schemerende bergen; terwijl u naar licht uitkijkt, en Hij dat tot een schaduw van de dood maakt, en tot diepe duisternis zet.", "2 Kon 19:4": "Misschien zal de HEERE, uw God, alle woorden horen van Rabsake, door wie zijn heer, de koning van Assyrië, gezonden is, om de levende God te honen en met woorden te schelden, die de HEERE, uw God, gehoord heeft; hef dan een gebed op voor het overblijfsel dat nog gevonden wordt.", "2 Kron 29:5": "En hij zei tegen hen: Hoor mij, Levieten; heilig nu uzelf, en heilig het huis van de HEERE, de God van uw vaderen, en breng de onreinheid naar buiten, uit het heiligdom.", "Jes 51:3": "Want de HEERE zal Sion troosten, Hij zal al haar woeste plaatsen troosten, en Hij zal haar woestijn maken als Eden, en haar wildernis als de hof van de HEERE; vreugde en blijdschap zal daarin gevonden worden, dankzegging en een stem van het gezang.", "Jes 10:22": "Want ofschoon uw volk, o Israël, is als het zand van de zee, zo zal toch maar het overblijfsel daarvan terugkeren; de verdelging is vast besloten, overvloeiend met gerechtigheid.", "Ps 51:19": "De offeranden van God zijn een gebroken geest; een gebroken en verslagen hart zult U, o God! niet verachten.", "Amos 5:20": "Zal dan niet de dag van de HEERE duisternis zijn, en geen licht? En donkerheid, zodat er geen glans aan is?", "Ps 115:2": "Waarom zouden de heidenen zeggen: Waar is nu hun God?", "Jes 45:21": "Verkondig het en treed hier toe, ja, beraadslaag samen: wie heeft dat van oudsher laten horen? Wie heeft dat van toen af verkondigd? Ben Ik het niet, de HEERE? En er is geen God meer behalve Mij, een rechtvaardig God, en een Heiland, niemand is er dan Ik.", "Nahum 1:6": "Wie zal voor Zijn gramschap staan, en wie zal bestaan voor de gloed van Zijn toorn? Zijn grimmigheid is uitgestort als vuur, en de rotsen worden door Hem verbrijzeld.", "Zef 1:16": "Een dag van de bazuin en van het geschal tegen de vaste steden en tegen de hoge hoeken.", "Deut 32:36": "Want de HEERE zal Zijn volk recht doen, en het zal Hem berouwen over Zijn knechten; want Hij zal zien, dat de hand is weggegaan, en er niemand meer over is, gebonden of vrij.", "Zach 12:10": "Doch over het huis van David, en over de inwoners van Jeruzalem, zal Ik uitstorten de Geest van de genade en van de gebeden; en zij zullen Mij aanschouwen, Die zij doorstoken hebben, en zij zullen over Hem rouwklagen, zoals met de rouwklacht over een enige zoon; en zij zullen over Hem bitter kermen, zoals men bitter kermt over een eerstgeborene.", "Ps 147:8": "Die de hemel met wolken bedekt, Die voor de aarde regen klaarmaakt; Die het gras op de bergen laat opkomen;", "Hand 2:39": "Want voor u is de belofte, en voor uw kinderen, en voor allen die ver weg zijn, zoveel als de Heere, onze God, ertoe roepen zal.", "Openb 18:18": "En riepen, toen zij de rook van haar brand zagen, en zeiden: Wat stad was aan deze grote stad gelijk?", "Joh 10:1": "Voorwaar, voorwaar zeg Ik u: die niet door de deur ingaat in de schaapskooi, maar van elders inklimt, die is een dief en rover.", "2 Kon 22:19": "Omdat uw hart week geworden is, en u zich voor het aangezicht van de HEERE vernederd hebt, toen u hoorde wat Ik gesproken heb tegen deze plaats en haar inwoners, dat zij tot een verwoesting en vloek zullen worden, en dat u uw kleren gescheurd en voor Mijn aangezicht geweend hebt; zo heb Ik u ook verhoord, spreekt de HEERE.", "Zach 13:9": "En Ik zal dat derde deel in het vuur brengen, en Ik zal het louteren, zoals men zilver loutert, en Ik zal het beproeven, zoals men goud beproeft; het zal Mijn Naam aanroepen, en Ik zal het verhoren; Ik zal zeggen: Het is Mijn volk; en het zal zeggen: De HEERE is mijn God.", "Jes 34:5": "Want Mijn zwaard is dronken geworden in de hemel; zie, het zal ten oordeel neerdalen op Edom, en op het volk dat Ik met de ban geslagen heb.", "Neh 9:17": "En zij hebben geweigerd te horen, en niet gedacht aan Uw wonderen, die U bij hen gedaan had, en hebben hun nek verhard, en in hun weerspannigheid een hoofd aangesteld, om terug te keren tot hun dienstbaarheid. Doch U, een God van vergevingen, genadig en barmhartig, geduldig, en groot van weldadigheid, hebt hen toch niet verlaten.", "Jes 2:12": "Want de dag van de HEERE van de heerscharen zal zijn tegen alle hovaardige en hoge, en tegen alle verhevene, opdat hij vernederd wordt;", "Matt 6:33": "Maar zoek eerst het Koninkrijk van God en Zijn gerechtigheid, en al deze dingen zullen u erbij gegeven worden.", "Ps 67:7": "De aarde geeft haar opbrengst; God, onze God, zal ons zegenen.", "Richt 20:26": "Toen trokken alle kinderen van Israël en heel het volk op, en kwamen bij het huis van God, en weenden, en bleven daar voor het aangezicht van de HEERE, en vastten die dag tot de avond; en zij offerden brandoffers en dankoffers voor het aangezicht van de HEERE.", "Ezech 39:28": "dan zullen zij weten dat Ik, de HEERE, hun God ben, omdat Ik hen gevankelijk heb laten wegvoeren onder de heidenen, maar hen weer verzameld heb in hun land, en daar niemand van hen meer heb overgelaten.", "Jes 29:22": "Daarom zegt de HEERE, Die Abraham verlost heeft, zo tot het huis van Jakob: Jakob zal nu niet meer beschaamd worden, en nu zal zijn gezicht niet meer bleek worden;", "2 Kron 30:19": "die zijn hele hart erop gericht heeft, om God, de HEERE, de God van zijn vaderen, te zoeken, ook al is dat niet naar de reinheid van het heiligdom.", "Deut 28:37": "En u zult tot een schrik, tot een spreekwoord en tot een spotlied worden, onder al de volken waarheen de HEERE u leiden zal.", "2 Tim 2:25": "met zachtmoedigheid onderwijzend hen die tegenstand bieden; of God hun misschien op enig moment bekering zou geven tot erkenning van de waarheid;", "Hand 21:9": "Deze had nu vier dochters, nog maagden, die profeteerden.", "Deut 11:14": "Zo zal Ik de regen van uw land geven op zijn tijd, vroege regen en late regen, opdat u uw koren, en uw most, en uw olie inzamelt.", "Neh 9:25": "En zij hebben vaste steden en een vet land ingenomen, en erfelijk bezeten, huizen, vol van allerlei goed, uitgehouwen waterputten, wijngaarden, olijfgaarden en fruitbomen, in overvloed; en zij hebben gegeten, en zijn verzadigd en vet geworden, en hebben in weelde geleefd, door Uw grote goedheid.", "Deut 32:43": "Juich, heidenen, met Zijn volk! want Hij zal het bloed van Zijn knechten wreken; en Hij zal de wraak op Zijn tegenpartijen doen wederkeren, en verzoenen Zijn land en Zijn volk.", "Hos 11:9": "Ik zal de gloed van Mijn toorn niet uitvoeren; Ik zal niet terugkeren om Efraïm te verderven; want Ik ben God en geen mens, de Heilige in uw midden, en Ik zal niet in de stad komen.", "Ezech 33:6": "Wanneer daarentegen de wachter het zwaard ziet komen, en niet op de bazuin blaast, zodat het volk niet gewaarschuwd wordt; en het zwaard komt en neemt iemand van hen weg, dan is die wel om zijn eigen ongerechtigheid weggenomen, maar zijn bloed zal Ik van de hand van de wachter eisen.", "Zach 7:3": "door te zeggen tegen de priesters die in het huis van de HEERE van de heerscharen waren, en tegen de profeten: Moet ik wenen in de vijfde maand, doordat ik mij afzonder, zoals ik nu al zoveel jaren gedaan heb?", "Ps 103:17": "Maar de goedertierenheid van de HEERE is van eeuwigheid tot eeuwigheid over hen die Hem vrezen, en Zijn gerechtigheid over kindskinderen;", "Jes 37:20": "Nu dan, HEERE, onze God, verlos ons uit zijn hand, zodat alle koninkrijken van de aarde weten dat U alleen de HEERE bent.", "Ezra 9:3": "Toen ik deze zaak hoorde, scheurde ik mijn kleed en mijn mantel; en ik trok het haar van mijn hoofd en van mijn baard uit, en zat verbaasd neer.", "Amos 4:7": "Daarbij heb Ik ook de regen van u geweerd, toen er nog drie maanden waren tot de oogst, en heb doen regenen over de ene stad, maar over de andere stad niet doen regenen; het ene stuk land werd beregend, maar het andere stuk land, waar het niet op regende, verdorde.", "Hos 11:8": "Hoe zou Ik u overgeven, o Efraïm? U overleveren, o Israël? Hoe zou Ik u maken als Adama, u stellen als Zeboïm? Mijn hart is in Mij omgekeerd, al Mijn medelijden is samen ontstoken.", "Zach 8:12": "Want het zaad zal voorspoedig zijn, de wijnstok zal zijn vrucht geven, en de aarde zal haar opbrengst geven, en de hemel zal zijn dauw geven; en Ik zal het overblijfsel van dit volk dit alles doen erven.", "Ex 20:21": "En het volk bleef op een afstand staan; maar Mozes naderde tot de donkerheid waar God was.", "Zach 9:15": "De HEERE van de heerscharen zal hen beschutten, en zij zullen eten, nadat zij de slingerstenen zullen ten onder gebracht hebben; zij zullen ook drinken, en een gedruis maken als bij de wijn; en zij zullen vervuld worden, als het bekken, als de hoeken van het altaar.", "Rom 9:24": "Ons namelijk, die Hij ook geroepen heeft, niet alleen uit de Joden, maar ook uit de heidenen.", "Rom 9:27": "En Jesaja roept over Israël: Al zou het aantal kinderen van Israël zijn als het zand van de zee, toch zal het overblijfsel behouden worden.", "Num 10:9": "En wanneer u in uw land ten strijde zult trekken tegen de vijand die u benauwt, zult u ook met die trompetten alarm maken; zo zal aan u gedacht worden voor het aangezicht van de HEERE, uw God, en u zult van uw vijanden verlost worden.", "Jes 22:12": "En op die dag zal de Heere, de HEERE van de heerscharen, roepen tot geween, en tot rouwklacht, en tot kaalheid, en tot omgording met de zak.", "Fil 3:3": "Want wij zijn de besnijding, wij, die God in de Geest dienen, en in Christus Jezus roemen, en niet vertrouwen op het vlees.", "Matt 27:45": "En van het zesde uur af kwam er duisternis over het hele land, tot het negende uur toe.", "Zach 1:4": "Wees niet als uw vaderen, tot wie de vorige profeten riepen en zeiden: Zo zegt de HEERE van de heerscharen: Bekeer u toch van uw slechte wegen en uw slechte daden; maar zij hoorden niet, en zij luisterden niet naar Mij, spreekt de HEERE.", "Zef 1:14": "De grote dag van de HEERE is nabij; hij is nabij, en zeer haastende; de stem van de dag van de HEERE; de held zal daar bitter schreeuwen.", "Luk 3:6": "En alle vlees zal de zaligheid van God zien.", "Obadja 1:21": "En er zullen heilbrengers op de berg Sion opkomen, om het gebergte van Ezau te richten; en het koninkrijk zal van de HEERE zijn.", "Zach 9:9": "Verheug u zeer, dochter van Sion! Juich, dochter van Jeruzalem! Zie, uw Koning zal tot u komen, rechtvaardig, en Hij is een Heiland; arm, en rijdend op een ezel, en op een veulen, het jong van de ezelinnen.", "Ezech 31:9": "Ik had hem zo mooi gemaakt door de veelheid van zijn takken, dat alle bomen van Eden, die in Gods hof waren, hem benijdden.", "2 Sam 1:23": "Saul en Jonathan, die geliefd waren, en die liefelijke mensen in hun leven, zijn ook in hun dood niet gescheiden; zij waren sneller dan arenden, zij waren sterker dan leeuwen."}, "noten": {"1": "Vers 3: SV: lusthof. D.i.: de hof van Eden.", "2": "Vers 6: SV: alle aangezichten zullen betrekken als een pot. D. l wl-kjv\" data-code=\"H6051\">clouds</span> and of thick <span class=\"wl wl-kjv\" data-code=\"H6205\">darkness,</span> as the <span class=\"wl wl-kjv\" data-code=\"H7837\">morning</span> <span class=\"wl wl-kjv\" data-code=\"H6566\">spread</span> upon the <span class=\"wl wl-kjv\" data-code=\"H2022\">mountains:</span> a <span class=\"wl wl-kjv\" data-code=\"H7227\">great</span> <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> and a <span class=\"wl wl-kjv\" data-code=\"H6099\">strong;</span> there hath not <span class=\"wl wl-kjv\" data-code=\"H1961\">been</span> <span class=\"wl wl-kjv\" data-code=\"H5769\">ever</span> the like, neither shall be any <span class=\"wl wl-kjv\" data-code=\"H3254\">more</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> it, even to the <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> of <span class=\"wl wl-kjv\" data-code=\"H1755\">many</span> generations.", "3": "A <span class=\"wl wl-kjv\" data-code=\"H784\">fire</span> <span class=\"wl wl-kjv\" data-code=\"H398\">devoureth</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> them; and <span class=\"wl wl-kjv\" data-code=\"H310\">behind</span> them a <span class=\"wl wl-kjv\" data-code=\"H3852\">flame</span> <span class=\"wl wl-kjv\" data-code=\"H3857\">burneth:</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> is as the <span class=\"wl wl-kjv\" data-code=\"H1588\">garden</span> of <span class=\"wl wl-kjv\" data-code=\"H5731\">Eden</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> them, and <span class=\"wl wl-kjv\" data-code=\"H310\">behind</span> them a <span class=\"wl wl-kjv\" data-code=\"H8077\">desolate</span> <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness;</span> yea, and nothing shall escape", "4": "The <span class=\"wl wl-kjv\" data-code=\"H4758\">appearance</span> of them is as the <span class=\"wl wl-kjv\" data-code=\"H4758\">appearance</span> of <span class=\"wl wl-kjv\" data-code=\"H5483\">horses;</span> and as <span class=\"wl wl-kjv\" data-code=\"H6571\">horsemen,</span> so shall they run.", "5": "Like the <span class=\"wl wl-kjv\" data-code=\"H6963\">noise</span> of <span class=\"wl wl-kjv\" data-code=\"H4818\">chariots</span> on the <span class=\"wl wl-kjv\" data-code=\"H7218\">tops</span> of <span class=\"wl wl-kjv\" data-code=\"H2022\">mountains</span> shall they <span class=\"wl wl-kjv\" data-code=\"H7540\">leap,</span> like the <span class=\"wl wl-kjv\" data-code=\"H6963\">noise</span> of a <span class=\"wl wl-kjv\" data-code=\"H3851\">flame</span> of <span class=\"wl wl-kjv\" data-code=\"H784\">fire</span> that <span class=\"wl wl-kjv\" data-code=\"H398\">devoureth</span> the <span class=\"wl wl-kjv\" data-code=\"H7179\">stubble,</span> as a <span class=\"wl wl-kjv\" data-code=\"H6099\">strong</span> <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> set in <span class=\"wl wl-kjv\" data-code=\"H4421\">battle</span> array.", "6": "Before their <span class=\"wl wl-kjv\" data-code=\"H6440\">face</span> the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> shall be much <span class=\"wl wl-kjv\" data-code=\"H2342\">pained:</span> all <span class=\"wl wl-kjv\" data-code=\"H6440\">faces</span> shall <span class=\"wl wl-kjv\" data-code=\"H6908\">gather</span> blackness.", "7": "They shall <span class=\"wl wl-kjv\" data-code=\"H7323\">run</span> like mighty <span class=\"wl wl-kjv\" data-code=\"H1368\">men;</span> they shall <span class=\"wl wl-kjv\" data-code=\"H5927\">climb</span> the <span class=\"wl wl-kjv\" data-code=\"H2346\">wall</span> like <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H4421\">war;</span> and they shall <span class=\"wl wl-kjv\" data-code=\"H3212\">march</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">one</span> on his <span class=\"wl wl-kjv\" data-code=\"H1870\">ways,</span> and they shall not <span class=\"wl wl-kjv\" data-code=\"H5670\">break</span> their ranks:", "8": "Neither shall <span class=\"wl wl-kjv\" data-code=\"H376\">one</span> <span class=\"wl wl-kjv\" data-code=\"H1766\">thrust</span> <span class=\"wl wl-kjv\" data-code=\"H251\">another;</span> they shall <span class=\"wl wl-kjv\" data-code=\"H3212\">walk</span> every <span class=\"wl wl-kjv\" data-code=\"H1397\">one</span> in his <span class=\"wl wl-kjv\" data-code=\"H4546\">path:</span> and when they <span class=\"wl wl-kjv\" data-code=\"H5307\">fall</span> upon the <span class=\"wl wl-kjv\" data-code=\"H7973\">sword,</span> they shall not be wounded.", "9": "They shall run to and <span class=\"wl wl-kjv\" data-code=\"H8264\">fro</span> in the <span class=\"wl wl-kjv\" data-code=\"H5892\">city;</span> they shall <span class=\"wl wl-kjv\" data-code=\"H7323\">run</span> upon the <span class=\"wl wl-kjv\" data-code=\"H2346\">wall,</span> they shall climb <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> upon the <span class=\"wl wl-kjv\" data-code=\"H1004\">houses;</span> they shall enter <span class=\"wl wl-kjv\" data-code=\"H935\">in</span> at the <span class=\"wl wl-kjv\" data-code=\"H2474\">windows</span> like a thief.", "10": "The <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> shall <span class=\"wl wl-kjv\" data-code=\"H7264\">quake</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> them; the <span class=\"wl wl-kjv\" data-code=\"H8064\">heavens</span> shall <span class=\"wl wl-kjv\" data-code=\"H7493\">tremble:</span> the <span class=\"wl wl-kjv\" data-code=\"H8121\">sun</span> and the <span class=\"wl wl-kjv\" data-code=\"H3394\">moon</span> shall be <span class=\"wl wl-kjv\" data-code=\"H6937\">dark,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3556\">stars</span> shall <span class=\"wl wl-kjv\" data-code=\"H622\">withdraw</span> their shining:", "11": "And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall <span class=\"wl wl-kjv\" data-code=\"H5414\">utter</span> his <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> his <span class=\"wl wl-kjv\" data-code=\"H2428\">army:</span> for his <span class=\"wl wl-kjv\" data-code=\"H4264\">camp</span> is <span class=\"wl wl-kjv\" data-code=\"H3966\">very</span> <span class=\"wl wl-kjv\" data-code=\"H7227\">great:</span> for he is <span class=\"wl wl-kjv\" data-code=\"H6099\">strong</span> that <span class=\"wl wl-kjv\" data-code=\"H6213\">executeth</span> his <span class=\"wl wl-kjv\" data-code=\"H1697\">word:</span> for the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> is <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> and <span class=\"wl wl-kjv\" data-code=\"H3966\">very</span> <span class=\"wl wl-kjv\" data-code=\"H3372\">terrible;</span> and who can abide", "12": "Therefore also now, <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">turn</span> ye even to me with all your <span class=\"wl wl-kjv\" data-code=\"H3824\">heart,</span> and with <span class=\"wl wl-kjv\" data-code=\"H6685\">fasting,</span> and with <span class=\"wl wl-kjv\" data-code=\"H1065\">weeping,</span> and with mourning:", "13": "And <span class=\"wl wl-kjv\" data-code=\"H7167\">rend</span> your <span class=\"wl wl-kjv\" data-code=\"H3824\">heart,</span> and not your <span class=\"wl wl-kjv\" data-code=\"H899\">garments,</span> and <span class=\"wl wl-kjv\" data-code=\"H7725\">turn</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> your <span class=\"wl wl-kjv\" data-code=\"H430\">God:</span> for he is <span class=\"wl wl-kjv\" data-code=\"H2587\">gracious</span> and <span class=\"wl wl-kjv\" data-code=\"H7349\">merciful,</span> <span class=\"wl wl-kjv\" data-code=\"H750\">slow</span> to <span class=\"wl wl-kjv\" data-code=\"H639\">anger,</span> and of <span class=\"wl wl-kjv\" data-code=\"H7227\">great</span> <span class=\"wl wl-kjv\" data-code=\"H2617\">kindness,</span> and <span class=\"wl wl-kjv\" data-code=\"H5162\">repenteth</span> him of the evil.", "14": "Who <span class=\"wl wl-kjv\" data-code=\"H3045\">knoweth</span> if he will <span class=\"wl wl-kjv\" data-code=\"H7725\">return</span> and <span class=\"wl wl-kjv\" data-code=\"H5162\">repent,</span> and <span class=\"wl wl-kjv\" data-code=\"H7604\">leave</span> a <span class=\"wl wl-kjv\" data-code=\"H1293\">blessing</span> <span class=\"wl wl-kjv\" data-code=\"H310\">behind</span> him; even a meat <span class=\"wl wl-kjv\" data-code=\"H4503\">offering</span> and a drink <span class=\"wl wl-kjv\" data-code=\"H5262\">offering</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> your God?", "15": "<span class=\"wl wl-kjv\" data-code=\"H8628\">Blow</span> the <span class=\"wl wl-kjv\" data-code=\"H7782\">trumpet</span> in <span class=\"wl wl-kjv\" data-code=\"H6726\">Zion,</span> <span class=\"wl wl-kjv\" data-code=\"H6942\">sanctify</span> a <span class=\"wl wl-kjv\" data-code=\"H6685\">fast,</span> <span class=\"wl wl-kjv\" data-code=\"H7121\">call</span> a solemn assembly:", "16": "<span class=\"wl wl-kjv\" data-code=\"H622\">Gather</span> the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> <span class=\"wl wl-kjv\" data-code=\"H6942\">sanctify</span> the <span class=\"wl wl-kjv\" data-code=\"H6951\">congregation,</span> <span class=\"wl wl-kjv\" data-code=\"H6908\">assemble</span> the <span class=\"wl wl-kjv\" data-code=\"H2205\">elders,</span> <span class=\"wl wl-kjv\" data-code=\"H622\">gather</span> the <span class=\"wl wl-kjv\" data-code=\"H5768\">children,</span> and those that <span class=\"wl wl-kjv\" data-code=\"H3243\">suck</span> the <span class=\"wl wl-kjv\" data-code=\"H7699\">breasts:</span> let the <span class=\"wl wl-kjv\" data-code=\"H2860\">bridegroom</span> go <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> of his <span class=\"wl wl-kjv\" data-code=\"H2315\">chamber,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3618\">bride</span> out of her closet.", "17": "Let the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests,</span> the <span class=\"wl wl-kjv\" data-code=\"H8334\">ministers</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> <span class=\"wl wl-kjv\" data-code=\"H1058\">weep</span> between the <span class=\"wl wl-kjv\" data-code=\"H197\">porch</span> and the <span class=\"wl wl-kjv\" data-code=\"H4196\">altar,</span> and let them <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> <span class=\"wl wl-kjv\" data-code=\"H2347\">Spare</span> thy <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> O <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> not thine <span class=\"wl wl-kjv\" data-code=\"H5159\">heritage</span> to <span class=\"wl wl-kjv\" data-code=\"H2781\">reproach,</span> that the <span class=\"wl wl-kjv\" data-code=\"H1471\">heathen</span> should rule <span class=\"wl wl-kjv\" data-code=\"H4910\">over</span> them: wherefore should they <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> among the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> Where is their God?", "18": "Then will the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> be <span class=\"wl wl-kjv\" data-code=\"H7065\">jealous</span> for his <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> and <span class=\"wl wl-kjv\" data-code=\"H2550\">pity</span> his people.", "19": "Yea, the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> will <span class=\"wl wl-kjv\" data-code=\"H6030\">answer</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> unto his <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> Behold, I will <span class=\"wl wl-kjv\" data-code=\" lass=\"wl wl-kjv\" data-code=\"H3342\">fats</span> shall <span class=\"wl wl-kjv\" data-code=\"H7783\">overflow</span> with <span class=\"wl wl-kjv\" data-code=\"H8492\">wine</span> and oil.", "25": "And I will <span class=\"wl wl-kjv\" data-code=\"H7999\">restore</span> to you the <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> that the <span class=\"wl wl-kjv\" data-code=\"H697\">locust</span> hath <span class=\"wl wl-kjv\" data-code=\"H398\">eaten,</span> the <span class=\"wl wl-kjv\" data-code=\"H3218\">cankerworm,</span> and the <span class=\"wl wl-kjv\" data-code=\"H2625\">caterpiller,</span> and the <span class=\"wl wl-kjv\" data-code=\"H1501\">palmerworm,</span> my <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H2428\">army</span> which I sent", "26": "And ye shall <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> in <span class=\"wl wl-kjv\" data-code=\"H398\">plenty,</span> and be <span class=\"wl wl-kjv\" data-code=\"H7646\">satisfied,</span> and <span class=\"wl wl-kjv\" data-code=\"H1984\">praise</span> the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> your <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> that hath <span class=\"wl wl-kjv\" data-code=\"H6213\">dealt</span> <span class=\"wl wl-kjv\" data-code=\"H6381\">wondrously</span> with you: and my <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> shall <span class=\"wl wl-kjv\" data-code=\"H5769\">never</span> be ashamed.", "27": "And ye shall <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> that I am in the <span class=\"wl wl-kjv\" data-code=\"H7130\">midst</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> and that I am the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> your <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> and none else: and my <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> shall <span class=\"wl wl-kjv\" data-code=\"H5769\">never</span> be ashamed.", "28": "And it shall come to pass <span class=\"wl wl-kjv\" data-code=\"H310\">afterward,</span> that I will pour <span class=\"wl wl-kjv\" data-code=\"H8210\">out</span> my <span class=\"wl wl-kjv\" data-code=\"H7307\">spirit</span> upon all <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh;</span> and your <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> and your <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters</span> shall <span class=\"wl wl-kjv\" data-code=\"H5012\">prophesy,</span> your old <span class=\"wl wl-kjv\" data-code=\"H2205\">men</span> shall <span class=\"wl wl-kjv\" data-code=\"H2492\">dream</span> <span class=\"wl wl-kjv\" data-code=\"H2472\">dreams,</span> your young <span class=\"wl wl-kjv\" data-code=\"H970\">men</span> shall <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> visions:", "29": "And also upon the <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> and upon the <span class=\"wl wl-kjv\" data-code=\"H8198\">handmaids</span> in those <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> will I pour <span class=\"wl wl-kjv\" data-code=\"H8210\">out</span> my spirit.", "30": "And I will <span class=\"wl wl-kjv\" data-code=\"H5414\">shew</span> <span class=\"wl wl-kjv\" data-code=\"H4159\">wonders</span> in the <span class=\"wl wl-kjv\" data-code=\"H8064\">heavens</span> and in the <span class=\"wl wl-kjv\" data-code=\"H776\">earth,</span> <span class=\"wl wl-kjv\" data-code=\"H1818\">blood,</span> and <span class=\"wl wl-kjv\" data-code=\"H784\">fire,</span> and <span class=\"wl wl-kjv\" data-code=\"H8490\">pillars</span> of smoke.", "31": "The <span class=\"wl wl-kjv\" data-code=\"H8121\">sun</span> shall be <span class=\"wl wl-kjv\" data-code=\"H2015\">turned</span> into <span class=\"wl wl-kjv\" data-code=\"H2822\">darkness,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3394\">moon</span> into <span class=\"wl wl-kjv\" data-code=\"H1818\">blood,</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> and the <span class=\"wl wl-kjv\" data-code=\"H3372\">terrible</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> come.", "32": "And it shall come to pass, that whosoever shall <span class=\"wl wl-kjv\" data-code=\"H7121\">call</span> on the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall be <span class=\"wl wl-kjv\" data-code=\"H4422\">delivered:</span> for in <span class=\"wl wl-kjv\" data-code=\"H2022\">mount</span> <span class=\"wl wl-kjv\" data-code=\"H6726\">Zion</span> and in <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> shall be <span class=\"wl wl-kjv\" data-code=\"H6413\">deliverance,</span> as the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> and in the <span class=\"wl wl-kjv\" data-code=\"H8300\">remnant</span> whom the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall call."}};
const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"
const ZELF = D.meta.zelf_abbr;      // afkorting binnen dit hoofdstuk, bv. "Joh 3"
const BASIS_URL = D.meta.basis_url;
const PARALLEL_VOLGORDE = ['Berea', 'SV', 'KJV'];
let vertaling = 'Berea';
let openVers = null;

const bijbel = document.getElementById('bijbel');
const popup = document.getElementById('popup');
const toast = document.getElementById('toast');
const nummers = Object.keys(D.vertalingen.Berea);

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden"><select id="boekkies">${boekOpties}</select> ` +
    `<select id="hfdkies">${hfdOpties}</select></span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.Berea[n] || '—');
}

/* ---------- vertaling-keuze (dropdown) + studie-dropdown ---------- */
(function bouwVertaalkies() {
  const sel = document.getElementById('vertaalkies');
  sel.innerHTML = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  sel.onchange = e => { vertaling = e.target.value; bouwRijen(); };
})();
document.getElementById('studiekies').onchange = e => { if (e.target.value) location.href = e.target.value; };

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.Berea[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (Berea)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function paneelInhoud(n, tab) {
  if (tab === 'grondwoorden') {
    const heeftB = D.koppeling && D.koppeling[n];
    const heeftK = D.koppeling_kjv && D.koppeling_kjv[n];
    if (!heeftB && !heeftK) return '<em>Nog geen woordkoppeling voor dit vers.</em>';
    let h = '';
    if (heeftB) h += `<div class="tsk-kop">Berea</div>` +
      `<div class="gw-tekst" style="font-family:Georgia,serif;line-height:1.8">${D.koppeling[n]}</div>` +
      `<div class="gw-detail" style="margin-top:.5rem"></div>`;
    if (heeftK) h += `<div class="tsk-kop" style="margin-top:.9rem">KJV</div>` +
      `<div class="gw-tekst" style="font-family:Georgia,serif;line-height:1.8">${D.koppeling_kjv[n]}</div>` +
      `<div class="gw-detail" style="margin-top:.5rem"></div>`;
    return h + '<div class="bronregel">Klik op een onderstreept woord voor de vindplaatsen.</div>';
  }
  if (tab === 'vertalingen') {
    return PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
  }
  if (tab === 'verwijzingen') {
    const berea = D.tsk[n], engels = D.tsk_kjv[n];
    if ((!berea || !berea.length) && (!engels || !engels.length)) return '<em>Geen verwijzingen bij dit vers.</em>';
    let h = '';
    if (berea && berea.length) {
      h += '<div class="tsk-kop">Treasury of Scripture Knowledge | Berea</div>';
      h += berea.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r}">${r}</a>`).join('') + '</div>').join('');
    }
    if (engels && engels.length) {
      h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.subs && it.subs.length ? `<ul class="ond-subs">${it.subs.map(s=>`<li>${s}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.tsk[n] && D.tsk[n].length), heeftO = !!D.onderwerpen[n];
  const heeftG = !!((D.koppeling && D.koppeling[n]) || (D.koppeling_kjv && D.koppeling_kjv[n]));
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : (heeftG ? 'grondwoorden' : 'vertalingen'));
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'grondwoorden' ? 'actief' : ''} ${heeftG ? '' : 'leeg'}" data-tab="grondwoorden" data-n="${n}">Grondwoorden</div>
    <div class="ntab" data-tab="vertalingen" data-n="${n}">Vertalingen</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.Berea[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · Berea</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}
</script>
</body>
</html>
