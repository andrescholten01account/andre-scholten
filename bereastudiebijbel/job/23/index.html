/d/", "subs": ["A characteristic of saints"]}, {"topic": "Scriptures, The", "href": "../../torrey/s/", "subs": ["Saints › Esteem, above all things"]}]}, "13": {"nave": [{"topic": "God", "href": "../../nave/g/", "subs": ["Immutable", "Power Of"]}, {"topic": "Predestination", "href": "../../nave/p/", "subs": ["General scriptures concerning"]}]}, "14": {"nave": [{"topic": "God", "href": "../../nave/g/", "subs": ["Power Of"]}, {"topic": "Predestination", "href": "../../nave/p/", "subs": ["General scriptures concerning"]}]}, "15": {"nave": [{"topic": "Doubting", "href": "../../nave/d/", "subs": ["General scriptures concerning"]}]}, "16": {"nave": [{"topic": "Afflictions And Adversities", "href": "../../nave/a/", "subs": ["Dispensation Of God"]}, {"topic": "Heart", "href": "../../nave/h/", "subs": ["Renewed › Tender"]}]}, "17": {"torrey": [{"topic": "Darkness", "href": "../../torrey/d/", "subs": ["Illustrative Of › Heavy afflictions"]}]}}, "extern": {"Jes 8:17": "Daarom zal ik de HEERE verwachten, Die Zijn aangezicht verbergt voor het huis van Jakob, en ik zal Hem verwachten.", "Job 13:23": "Hoeveel misdaden en zonden heb ik? Maak mij mijn overtreding en mijn zonden bekend.", "Ps 17:3": "U hebt mijn hart geproefd, 's nachts bezocht, U hebt mij getoetst. U vindt niets; wat ik gedacht heb, overtreedt mijn mond niet.", "Hand 14:22": "en versterkten de harten van de discipelen, en vermaanden hen om te blijven in het geloof, en dat wij door veel verdrukkingen het Koninkrijk van God moeten binnengaan.", "Jes 40:28": "Weet u het niet? Hebt u niet gehoord, dat de eeuwige God, de HEERE, de Schepper van de einden van de aarde, noch moede noch mat wordt? Er is geen doorgronding van Zijn verstand.", "Hand 20:18": "En toen zij bij hem gekomen waren, zei hij tegen hen: U weet, van de eerste dag af dat ik in Azië ben aangekomen, hoe ik de hele tijd bij u geweest ben;", "Jes 40:27": "Waarom zegt u dan, o Jakob! en spreekt, o Israël! mijn weg is voor de HEERE verborgen, en mijn recht gaat aan mijn God voorbij?", "Job 22:11": "Of u ziet de duisternis niet, en een overvloed van water bedekt u.", "Jes 27:4": "Grimmigheid is bij Mij niet; wie zou Mij als een doorn en distel in oorlog willen zetten, zodat Ik tegen hem zou aanvallen, en hem tegelijk zou verbranden?", "Job 6:2": "Och, of mijn verdriet grondig gewogen werd, en men mijn ellende samen in een weegschaal ophief!", "Jes 55:6": "Zoek de HEERE, terwijl Hij te vinden is; roep Hem aan, terwijl Hij nabij is.", "1 Tess 3:3": "opdat niemand bewogen wordt door deze verdrukkingen; want u weet zelf dat wij hiertoe gesteld zijn.", "Ruth 1:20": "Maar zij zei tegen hen: Noem mij niet Naomi, noem mij Mara; want de Almachtige heeft mij grote bitterheid aangedaan.", "Pred 1:15": "Het kromme kan niet recht gemaakt worden; en wat ontbreekt, kan niet geteld worden.", "Jes 27:8": "Met mate hebt U met hem getwist, toen U hem wegstootte; toen Hij hem wegnam door Zijn harde wind, op de dag van de oostenwind.", "Jes 43:26": "Herinnert Mij, laten wij samen richten, vertelt u uw redenen, opdat u gerechtvaardigd mag worden.", "Ps 119:103": "Hoe zoet zijn Uw redenen voor mijn gehemelte geweest, meer dan honing voor mijn mond!", "Job 13:22": "Roep dan, en ik zal antwoorden; of ik zal spreken, en geef mij antwoord.", "2 Kon 20:3": "Och, HEERE, gedenk toch dat ik voor Uw aangezicht in waarheid en met een volkomen hart gewandeld heb, en gedaan heb wat goed is in Uw ogen. En Hizkia huilde erg veel.", "Hebr 11:17": "Door het geloof heeft Abraham, toen hij beproefd werd, Izak geofferd, en hij die de beloften ontvangen had, heeft zijn enige zoon geofferd,", "Jes 57:1": "De rechtvaardige komt om, en er is niemand die het ter harte neemt; en de goede mensen worden weggenomen, zonder dat iemand erop let dat de rechtvaardige weggenomen wordt vóór het kwaad komt.", "1 Kor 4:3": "Maar voor mij is het van het minste belang, dat ik door u geoordeeld word, of door een menselijk oordeel; ja, ik oordeel ook mijzelf niet.", "Joël 1:15": "Ach, die dag! Want de dag van de HEERE is nabij, en zal als een verwoesting komen van de Almachtige.", "Hand 20:19": "Terwijl ik de Heere diende met alle nederigheid, en veel tranen, en beproevingen, die mij overkwamen door de aanslagen van de Joden;", "Job 13:21": "Doe Uw hand ver van mij weg, en laat Uw verschrikking mij niet verbaasd maken.", "Job 37:19": "Onderricht ons, wat wij Hem zeggen zullen; want wij zullen niets ordentelijk kunnen voorstellen vanwege de duisternis.", "Job 9:34": "Laat Hij Zijn roede van op mij wegdoen, en laat Zijn verschrikking mij niet angstig maken;", "Joh 8:31": "Jezus zei dan tegen de Joden die in Hem geloofden: Als u in Mijn woord blijft, bent u werkelijk Mijn discipelen;", "Jes 6:5": "Toen zei ik: Wee mij, want ik ga ten onder! Omdat ik een man van onreine lippen ben, en ik woon te midden van een volk dat onrein van lippen is; want mijn ogen hebben de Koning, de HEERE van de heerscharen, gezien.", "Dan 4:35": "En alle inwoners van de aarde worden als niets geacht, en Hij doet naar Zijn wil met het leger van de hemel en de inwoners van de aarde, en er is niemand die Zijn hand kan tegenhouden, of tegen Hem kan zeggen: Wat doet U?", "2 Tim 2:19": "Toch staat het vaste fundament van God, met dit zegel: De Heere kent hen die van Hem zijn; en: Ieder die de Naam van Christus noemt, moet afstand nemen van ongerechtigheid.", "Jes 46:10": "Die vanaf het begin aan verkondigt het einde, en van oudsher af die dingen, die nog niet gebeurd zijn; Die zegt: Mijn raad zal standhouden, en Ik zal al Mijn welbehagen doen.", "Job 16:21": "Och, mocht men rechtspreken voor een man bij God, zoals een kind van een mens voor zijn vriend.", "Job 13:3": "Maar ik wil tot de Almachtige spreken, en ik ben erop belust mij te verdedigen voor God.", "Job 13:18": "Zie toch, ik heb de zaak ordelijk gesteld; ik weet dat ik rechtvaardig verklaard zal worden.", "Rom 8:33": "Wie zal een beschuldiging inbrengen tegen de uitverkorenen van God? God is het Die rechtvaardigt.", "Zef 1:6": "En hen die terugkeren van achter de HEERE; en die de HEERE niet zoeken, en niet naar Hem vragen.", "Mal 3:2": "Maar wie zal de dag van Zijn komst verdragen, en wie zal standhouden als Hij verschijnt? Want Hij zal zijn als het vuur van een goudsmid, en als zeep van de blekers.", "1 Joh 2:19": "Zij zijn uit ons weggegaan, maar zij waren niet uit ons; want als zij uit ons geweest waren, dan zouden zij bij ons gebleven zijn; maar dit is gebeurd, opdat zij openbaar zouden worden, dat zij niet allen uit ons zijn.", "Rom 8:34": "Wie is het die veroordeelt? Christus is het Die gestorven is; ja, meer nog, Die ook opgewekt is, Die ook aan de rechterhand van God is, Die ook voor ons bidt.", "Ps 119:11": "Ik heb Uw rede in mijn hart verborgen, opdat ik tegen U niet zondigen zou.", "Mal 3:3": "En Hij zal zitten, louterend, en het zilver reinigend, en Hij zal de kinderen van Levi reinigen, en Hij zal ze doorlouteren als goud en als zilver; dan zullen zij de HEERE spijsoffer toebrengen in gerechtigheid.", "Dan 9:19": "O Heere, hoor! o Heere, vergeef! o Heere, merk op en doe het, wacht er niet mee! Om Uzelf, o mijn God! Want Uw stad, en Uw volk is naar Uw Naam genoemd.", "Ezech 20:33": "Zo waarachtig als Ik leef, spreekt de Heere HEERE: Voorzeker zal Ik met een sterke hand, en een uitgestrekte arm, en met een uitgegoten grimmigheid over u regeren!", "1 Petr 2:8": "En een steen des aanstoots, en een rots der ergernis; namelijk voor hen die zich aan het Woord stoten, ongehoorzaam als zij zijn, waartoe zij ook bestemd zijn.", "Ps 115:3": "Onze God is toch in de hemel, Hij doet al wat Hem behaagt.", "1 Tess 2:10": "U bent getuigen, en God ook, hoe heilig, en rechtvaardig, en onberispelijk wij ons onder u, die gelooft, gedragen hebben.", "Rom 9:19": "U zult dan tegen mij zeggen: Wat heeft Hij dan nog aan te klagen? Want wie heeft Zijn wil weerstaan?", "Gen 32:12": "Zeker, U hebt gezegd: Ik zal zeker goed voor u zijn, en Ik zal uw nageslacht maken als het zand van de zee, dat vanwege de hoeveelheid niet geteld kan worden!", "Dan 9:18": "Neig Uw oor, mijn God! en hoor, doe Uw ogen open, en zie onze verwoestingen, en de stad die naar Uw Naam genoemd is; want wij leggen onze smekingen niet voor Uw aangezicht neer om onze gerechtigheden, maar om Uw barmhartigheden, die groot zijn.", "2 Kor 12:9": "En Hij heeft tegen mij gezegd: Mijn genade is u genoeg; want Mijn kracht wordt in zwakheid volbracht. Zo zal ik dan veel liever roemen in mijn zwakheden, opdat de kracht van Christus in mij woont.", "Ps 19:11": "Zij zijn begeerlijker dan goud, ja, dan veel fijn goud; en zoeter dan honing en honingzeem.", "1 Petr 2:2": "En verlang als pasgeboren kinderen naar de zuivere melk van het Woord, opdat u daardoor mag groeien;", "Job 9:13": "God zal Zijn toorn niet afkeren; onder Hem worden de hoogmoedige helpers gebogen.", "Job 15:22": "Hij gelooft niet uit de duisternis terug te keren, maar dat hij beloerd wordt voor het zwaard.", "Luk 12:46": "dan zal de heer van die dienstknecht komen op een dag dat hij hem niet verwacht, en op een moment dat hij het niet weet; en hij zal hem in stukken houwen, en hem zijn deel geven met de ontrouwen.", "Jer 14:7": "Hoewel onze ongerechtigheden tegen ons getuigen, o HEERE, doe het om Uw Naams wil; want onze afdwalingen zijn talrijk, wij hebben tegen U gezondigd.", "Ps 89:47": "Hoe lang, o HEERE! zult Gij U steeds verbergen, zal Uw grimmigheid branden als een vuur?", "Hebr 10:38": "Maar de rechtvaardige zal uit het geloof leven; en als iemand zich terugtrekt, heeft Mijn ziel in hem geen behagen.", "Job 2:5": "Strek toch Uw hand uit, en tast zijn gebeente en zijn vlees aan; dan zal hij U beslist in Uw aangezicht vervloeken!", "Job 18:18": "Men zal hem stoten van het licht in de duisternis, en men zal hem uit de wereld verjagen.", "Ps 138:3": "Ten dage, als ik riep, hebt Gij mij verhoord; Gij hebt mij versterkt met kracht in mijn ziel.", "Gen 18:19": "Want Ik heb hem gekend, opdat hij zijn kinderen en zijn huis na hem zou opdragen, en zij de weg van de HEERE zouden bewaren, om gerechtigheid en recht te doen; opdat de HEERE over Abraham brengt wat Hij over hem gesproken heeft.", "Jes 26:8": "Wij hebben ook op de weg van Uw oordelen, U, o HEERE, verwacht; naar Uw Naam en naar Uw gedachtenis gaat het verlangen van onze ziel uit.", "Jer 3:5": "Zal Hij voor eeuwig Zijn toorn behouden? Zal Hij die voortdurend bewaren? Zie, u spreekt en doet die slechte dingen, en u zet door zoveel u kunt.", "Job 34:29": "Als Hij stilt, wie zal dan beroeren? Als Hij het aangezicht verbergt, wie zal Hem dan aanschouwen, zowel voor een volk, als voor een mens alleen?", "Micha 6:9": "De stem van de HEERE roept tot de stad (want Uw Naam ziet het wezen): Hoor de roede, en wie haar besteld heeft!", "Ex 32:13": "Denk aan Abraham, aan Izak en aan Israël, Uw dienaren, aan wie Gij bij Uzelf gezworen hebt, en tot wie Gij gesproken hebt: Ik zal uw nageslacht vermenigvuldigen als de sterren van de hemel; en dit hele land, waarvan Ik gezegd heb dat Ik het aan uw nageslacht zal geven, zullen zij voor eeuwig in erfelijk bezit hebben.", "Joh 21:17": "Hij zei tegen hem voor de derde keer: Simon, zoon van Jonas, hebt u Mij lief? Petrus werd bedroefd, omdat Hij voor de derde keer tegen hem zei: Hebt u Mij lief? en hij zei tegen Hem: Heere! U weet alle dingen, U weet dat ik U liefheb. Jezus zei tegen hem: Weid Mijn schapen.", "Ps 135:6": "Al wat de HEERE behaagt, doet Hij, in de hemelen en op de aarde, in de zeeën en alle afgronden.", "Ps 22:15": "Ik ben uitgestort als water, en al mijn beenderen hebben zich vaneen gescheiden; mijn hart is als was, het is gesmolten in het midden van mijn ingewand.", "Job 7:3": "Zo zijn mij maanden van ijdelheid ten erve geworden, en nachten van moeite zijn mij voorbereid.", "Hand 20:34": "En u weet zelf, dat deze handen gediend hebben voor mijn behoeften, en voor die van hen die met mij waren.", "Jer 12:1": "Ú zou rechtvaardig zijn, HEERE, wanneer ik tegen U zou twisten; ik zal echter over Uw oordelen met U spreken; waarom is de weg van de goddelozen voorspoedig, waarom hebben zij rust, allen die trouweloos trouweloosheid bedrijven?", "Job 9:15": "Aan wie ik, ook al was ik rechtvaardig, niet zou antwoorden; mijn Rechter zal ik om genade bidden.", "Rom 11:33": "O diepte van de rijkdom, én van de wijsheid én van de kennis van God, hoe ondoorzoekelijk zijn Zijn oordelen, en onnaspeurlijk Zijn wegen!", "Jes 55:7": "De goddeloze verlaat zijn weg, en de onrechtvaardige man zijn gedachten; en hij bekeert zich tot de HEERE, zo zal Hij Zich over hem ontfermen, en tot onze God, want Hij vergeeft menigvuldig.", "1 Tess 5:9": "Want God heeft ons niet gesteld tot toorn, maar tot verkrijging van de zaligheid, door onze Heere Jezus Christus.", "Job 17:9": "En de rechtvaardige zal zijn weg vasthouden, en wie rein van handen is, zal in sterkte toenemen.", "Job 9:33": "Er is geen scheidsman tussen ons, die zijn hand op ons beiden leggen mocht.", "Ps 88:17": "Uw brandende toorn gaat over mij heen; Uw verschrikkingen doen mij vergaan.", "Job 10:1": "Mijn ziel is de dood moe, wat mijn leven betreft; ik zal mijn klacht over mijzelf de vrije loop laten; ik zal spreken in de bitterheid van mijn ziel.", "Ps 97:2": "Rondom Hem zijn wolken en donkerheid, gerechtigheid en recht zijn de vastigheid van Zijn troon.", "Jak 1:12": "Gelukkig is de man die verzoeking verdraagt; want als hij beproefd zal zijn geweest, zal hij de kroon van het leven ontvangen, die de Heere beloofd heeft aan hen die Hem liefhebben.", "2 Kor 5:20": "Zo zijn wij dan gezanten namens Christus, alsof God door ons bad; wij bidden namens Christus: laat u met God verzoenen.", "Job 19:8": "Hij heeft mijn weg toegemuurd, zodat ik niet door kan gaan, en over mijn paden heeft Hij duisternis gesteld.", "Num 23:19": "God is geen man, dat Hij zou liegen, en ook geen mensenkind, dat het Hem berouwen zou; zou Hij het zeggen, en het niet doen, of spreken, en het niet waarmaken?", "Joh 4:34": "Jezus zei tegen hen: Mijn voedsel is dat Ik de wil doe van Hem die Mij gezonden heeft, en Zijn werk volbreng.", "1 Kor 4:4": "Want ik ben mijzelf van geen ding bewust; toch ben ik daardoor niet gerechtvaardigd; maar Die mij oordeelt, is de Heere.", "Ezech 20:35": "Daartoe zal Ik u brengen in de woestijn van de volken, en Ik zal daar met u rechtspreken, van aangezicht tot aangezicht;", "Hebr 4:6": "Omdat het dan blijft gelden dat sommigen die rust ingaan, en zij aan wie het Evangelie eerst verkondigd was, niet ingegaan zijn vanwege de ongehoorzaamheid,", "Zach 13:9": "En Ik zal dat derde deel in het vuur brengen, en Ik zal het louteren, zoals men zilver loutert, en Ik zal het beproeven, zoals men goud beproeft; het zal Mijn Naam aanroepen, en Ik zal het verhoren; Ik zal zeggen: Het is Mijn volk; en het zal zeggen: De HEERE is mijn God.", "Job 2:6": "En de HEERE zei tegen de satan: Zie, hij is in uw hand, maar spaar zijn leven.", "Ps 25:11": "Lamed. Om Uw Naams wil, HEERE! zo vergeef mijn ongerechtigheid, want die is groot.", "Klaagl 3:19": "Zain. Denk aan mijn ellende en aan mijn ballingschap, aan de alsem en gal.", "Ps 77:20": "Uw weg was in de zee, en Uw pad in het grote water, en Uw voetstappen werden niet bekend.", "Joz 7:9": "Als de Kanaänieten en alle inwoners van het land dit horen, zullen zij ons omsingelen, en onze naam van de aarde uitroeien; wat zult U dan doen voor Uw grote Naam?", "Job 1:11": "Maar strek toch nu Uw hand uit, en tast alles aan wat hij heeft; dan zal hij U beslist in Uw aangezicht vervloeken.", "Job 9:12": "Zie, Hij zal roven, wie zal het Hem doen teruggeven? Wie zal tegen Hem zeggen: Wat doet U?", "Rom 2:7": "Hun die volhardend goeddoen en heerlijkheid, en eer, en onvergankelijkheid zoeken, het eeuwige leven;", "Hebr 10:39": "Maar wij zijn niet van hen die zich terugtrekken tot verderf, maar van hen die geloven tot behoud van de ziel.", "Job 27:2": "Zo waarachtig als God leeft, Die mijn recht weggenomen heeft, en de Almachtige, Die mijn ziel bitterheid heeft aangedaan!", "Job 6:9": "En dat het God beliefde, dat Hij mij verbrijzelde, Zijn hand losliet, en een einde met mij maakte!", "Spr 17:3": "De smeltkroes is voor het zilver, en de oven voor het goud; maar de HEERE toetst de harten.", "Ex 32:12": "Waarom zouden de Egyptenaren zeggen: In kwaadheid heeft Hij hen weggeleid, om hen te doden op de bergen en om hen te vernietigen van de aardbodem? Keer af van de gloed van Uw toorn, en laat het U berouwen over het kwaad tegen Uw volk.", "Ps 66:10": "Want U hebt ons beproefd, o God! U hebt ons gelouterd, zoals men zilver loutert;", "Job 10:2": "Ik zal tegen God zeggen: Verdoem mij niet; laat mij weten, waarom U met mij twist.", "Jer 15:16": "Toen Uw woorden gevonden werden, heb ik ze opgegeten, en Uw woord is mij geweest tot vreugde en tot blijdschap van mijn hart; want ik ben naar Uw Naam genoemd, o HEERE, God van de heerscharen!", "Jes 1:18": "Kom dan, en laten wij samen rechten, zegt de HEERE; al waren uw zonden als scharlaken, zij zullen wit worden als sneeuw, al waren zij rood als karmozijn, zij zullen worden als witte wol.", "Spr 19:21": "In het hart van de man zijn veel gedachten; maar de raad van de HEERE, die zal standhouden.", "Jes 57:16": "Want Ik zal niet eeuwig twisten, en Ik zal niet voortdurend toornig zijn; want de geest zou van voor Mijn aangezicht bezwijken, en de zielen die Ik gemaakt heb.", "Job 1:12": "En de HEERE zei tegen de satan: Zie, alles wat hij heeft, is in uw hand; alleen aan hemzelf mag u uw hand niet slaan. En de satan ging weg van het aangezicht van de HEERE.", "Deut 8:2": "En u zult denken aan heel de weg, die de HEERE, uw God, u deze veertig jaar in de woestijn geleid heeft; opdat Hij u verootmoedigt, om u te beproeven, om te weten wat in uw hart was, of u Zijn geboden zou houden, of niet.", "Jak 1:17": "Elke goede gave en elk volmaakt geschenk is van boven, afkomstig van de Vader der lichten, bij Wie geen verandering is, of schaduw van omkering.", "Luk 12:42": "En de Heere zei: Wie is dan de trouwe en verstandige huisbeheerder, die de heer over zijn dienstpersoneel zal aanstellen, om hun op de juiste tijd het bepaalde deel voedsel te geven?", "Ps 1:6": "Want de HEERE kent de weg van de rechtvaardigen; maar de weg van de goddelozen zal vergaan.", "Ps 36:4": "De woorden van de mond van hem zijn onrecht en bedrog; hij laat na te verstaan tot weldoen.", "Ps 125:5": "Maar die zich neigen tot hun kromme wegen, die zal de HEERE weg doen gaan met de werkers van de ongerechtigheid. Vrede zal over Israël zijn!", "2 Kon 22:20": "Daarom zie, Ik zal u verzamelen bij uw vaderen, en u zult in vrede in uw graf verzameld worden, en uw ogen zullen al het kwaad niet zien dat Ik over deze plaats brengen zal. En zij brachten de koning het antwoord terug.", "Job 18:6": "Het licht zal verduisteren in zijn tent, en zijn lamp zal boven hem uitgeblust worden.", "2 Kor 5:19": "Want God was in Christus de wereld met Zichzelf aan het verzoenen, doordat Hij hun zonden hun niet toerekende; en Hij heeft het woord van de verzoening in ons gelegd.", "Job 22:22": "Ontvang toch de wet uit Zijn mond, en leg Zijn woorden in uw hart.", "Ps 43:1": "Doe mij recht, o God! En voer Zelf mijn rechtszaak tegen een liefdeloos volk; bevrijd mij van de man van het bedrog en van het onrecht.", "Rom 8:1": "Er is dan nu geen veroordeling voor hen die in Christus Jezus zijn, die niet naar het vlees wandelen, maar naar de Geest.", "Job 11:10": "Als Hij voorbijgaat, om af te snijden of te vergaderen, wie zal Hem dan tegenhouden?", "2 Kor 1:12": "Want onze roem is dit: de getuigenis van ons geweten, dat wij in eenvoud en oprechtheid van God, niet in vleselijke wijsheid, maar in de genade van God, in de wereld verkeerd hebben, en allermeest bij u.", "Job 12:14": "Zie, Hij breekt af, en het zal niet herbouwd worden; Hij besluit iemand op, en er zal niet opengedaan worden.", "Ps 119:127": "Daarom heb ik Uw geboden lief, meer dan goud, ja, meer dan het fijnste goud.", "Joh 4:32": "Maar Hij zei tegen hen: Ik heb voedsel om te eten dat u niet kent.", "1 Petr 1:7": "opdat de beproeving van uw geloof — die veel kostbaarder is dan goud, dat vergaat en toch door het vuur beproefd wordt — bevonden wordt te zijn tot lof, eer en heerlijkheid bij de openbaring van Jezus Christus;", "Ps 19:10": "De vreze van de HEERE is rein, en bestaat tot in eeuwigheid; de rechten van de HEERE zijn waarheid, samen zijn zij rechtvaardig.", "Num 23:20": "Zie, ik heb opdracht ontvangen om te zegenen; omdat Hij zegent, zal ik het niet terugdraaien.", "2 Kor 12:10": "Daarom heb ik een welbehagen in zwakheden, in smaadheden, in noden, in vervolgingen, in benauwdheden, om Christus' wil; want als ik zwak ben, dan ben ik machtig.", "Pred 3:14": "Ik weet, dat al wat God doet, dat zal in eeuwigheid zijn, en er is niets aan toe te doen, en er is niets van af te doen; en God doet dat, opdat men vreest voor Zijn aangezicht.", "Klaagl 3:20": "Zain. Mijn ziel denkt er wel terdege aan, en zij buigt zich neer in mij.", "Job 11:6": "En u bekend maakte de verborgenheden van de wijsheid, omdat zij dubbel zijn in wezen! Weet daarom, dat God voor u minder rekent van uw ongerechtigheid dan die verdient.", "Ps 44:19": "Ons hart is niet achterwaarts gekeerd, en onze gang niet geweken van Uw pad.", "Job 9:19": "Als het op kracht aankomt, zie, Hij is sterk; en als het op recht aankomt, wie zal mij dagvaarden?", "Hand 20:33": "Ik heb niemands zilver, of goud, of kleding begeerd.", "Joz 7:8": "Och, Heere! Wat zal ik zeggen, nu Israël voor het aangezicht van zijn vijanden de rug heeft gekeerd?"}, "noten": {}, "koppeling": {"1": "<span class=\"wl\" data-l=\"L1\" data-code=\"H347\">Maar</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H347\">Job</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H6030\">antwoordde</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H559\">en</span> zei:", "2": "<span class=\"wl\" data-l=\"L1\" data-code=\"H1571\">Ook</span> vandaag is <span class=\"wl\" data-l=\"L2\" data-code=\"H7879\">mijn</span> <span /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden"><select id="boekkies">${boekOpties}</select> ` +
    `<select id="hfdkies">${hfdOpties}</select></span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.Berea[n] || '—');
}

/* ---------- vertaling-keuze (dropdown) + studie-dropdown ---------- */
(function bouwVertaalkies() {
  const sel = document.getElementById('vertaalkies');
  sel.innerHTML = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  sel.onchange = e => { vertaling = e.target.value; bouwRijen(); };
})();
document.getElementById('studiekies').onchange = e => { if (e.target.value) location.href = e.target.value; };

function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.Berea[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (Berea)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function paneelInhoud(n, tab) {
  if (tab === 'grondwoorden') {
    const heeftB = D.koppeling && D.koppeling[n];
    const heeftK = D.koppeling_kjv && D.koppeling_kjv[n];
    if (!heeftB && !heeftK) return '<em>Nog geen woordkoppeling voor dit vers.</em>';
    let h = '';
    if (heeftB) h += `<div class="tsk-kop">Berea</div>` +
      `<div class="gw-tekst" style="font-family:Georgia,serif;line-height:1.8">${D.koppeling[n]}</div>` +
      `<div class="gw-detail" style="margin-top:.5rem"></div>`;
    if (heeftK) h += `<div class="tsk-kop" style="margin-top:.9rem">KJV</div>` +
      `<div class="gw-tekst" style="font-family:Georgia,serif;line-height:1.8">${D.koppeling_kjv[n]}</div>` +
      `<div class="gw-detail" style="margin-top:.5rem"></div>`;
    return h + '<div class="bronregel">Klik op een onderstreept woord voor de vindplaatsen.</div>';
  }
  if (tab === 'vertalingen') {
    return PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
  }
  if (tab === 'verwijzingen') {
    const berea = D.tsk[n], engels = D.tsk_kjv[n];
    if ((!berea || !berea.length) && (!engels || !engels.length)) return '<em>Geen verwijzingen bij dit vers.</em>';
    let h = '';
    if (berea && berea.length) {
      h += '<div class="tsk-kop">Treasury of Scripture Knowledge | Berea</div>';
      h += berea.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r}">${r}</a>`).join('') + '</div>').join('');
    }
    if (engels && engels.length) {
      h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.subs && it.subs.length ? `<ul class="ond-subs">${it.subs.map(s=>`<li>${s}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.tsk[n] && D.tsk[n].length), heeftO = !!D.onderwerpen[n];
  const heeftG = !!((D.koppeling && D.koppeling[n]) || (D.koppeling_kjv && D.koppeling_kjv[n]));
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : (heeftG ? 'grondwoorden' : 'vertalingen'));
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'grondwoorden' ? 'actief' : ''} ${heeftG ? '' : 'leeg'}" data-tab="grondwoorden" data-n="${n}">Grondwoorden</div>
    <div class="ntab" data-tab="vertalingen" data-n="${n}">Vertalingen</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.Berea[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · Berea</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}
</script>
</body>
</html>
