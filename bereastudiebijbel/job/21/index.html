 zich niet bekeren tot de Heere, hun God, en Hem ook niet zoeken bij dit alles.", "Ps 113:6": "Die zeer laag ziet, in de hemel en op de aarde.", "Openb 6:16": "En zeiden tot de bergen en tot de steenrotsen: Valt op ons, en verbergt ons van het aangezicht van Hem Die op de troon zit, en van de toorn van het Lam.", "Spr 28:11": "Een rijk man is wijs in zijn eigen ogen; maar de arme, die verstandig is, doorziet hem.", "Matt 25:32": "En voor Hem zullen alle volken verzameld worden, en Hij zal ze van elkaar scheiden, zoals de herder de schapen van de bokken scheidt.", "1 Kron 25:6": "Dezen waren allemaal onder leiding van hun vader gesteld tot het gezang van het huis van de HEERE, op cimbalen, luiten, en harpen, tot de dienst van het huis van God, onder leiding van de koning, van Asaf, Jeduthun, en van Heman.", "Spr 5:23": "Hij zal sterven, omdat hij zonder tucht geweest is, en in de grootheid van zijn dwaasheid zal hij verdwalen.", "Job 10:2": "Ik zal tegen God zeggen: Verdoem mij niet; laat mij weten, waarom U met mij twist.", "1 Kor 15:21": "Want omdat de dood door een mens is, is ook de opstanding van de doden door een Mens.", "Jer 31:30": "Maar ieder zal om zijn eigen ongerechtigheid sterven; ieder mens die de onrijpe druiven eet, zijn tanden zullen stomp worden.", "Spr 16:25": "Er is een weg, die iemand recht lijkt; maar het einde ervan zijn wegen van de dood.", "Ps 50:4": "Hij zal roepen tot de hemel van boven, en tot de aarde, om Zijn volk te oordelen.", "1 Tess 5:4-7": "Maar u, broeders, u bent niet in duisternis, zodat die dag u als een dief zou overvallen. U bent allen kinderen van het licht en kinderen van de dag; wij zijn niet van de nacht, en ook niet van de duisternis. Laten wij dan niet slapen, zoals de anderen, maar laten wij waken en nuchter zijn.", "Spr 6:12": "Een nietsnut, een verdorven man, gaat om met een verkeerde mond;", "Pred 5:18": "Ook: ieder mens aan wie God rijkdom en bezittingen gegeven heeft, en aan wie Hij de macht geeft om daarvan te eten, en om zijn deel te nemen, en om zich te verheugen in zijn arbeid, dat is een gave van God.", "1 Kron 10:13": "Zo stierf Saul in zijn overtreding, waarmee hij overtreden had tegen de HEERE, tegen het woord van de HEERE dat hij niet gehouden had; en ook omdat hij de waarzegster geraadpleegd had, haar zoekende,", "Gal 3:10": "Want zovelen als er uit de werken van de wet zijn, die zijn onder de vloek; want er is geschreven: Vervloekt is ieder die niet blijft in alles wat geschreven is in het boek van de wet, om dat te doen.", "1 Kron 29:17": "En ik weet, mijn God, dat U het hart beproeft, en dat U een welgevallen hebt aan oprechtheid. Ik heb in oprechtheid van mijn hart al deze dingen vrijwillig gegeven, en ik heb nu met vreugde Uw volk, dat hier aanwezig is, gezien, dat het zich tegenover U vrijwillig gedragen heeft.", "Ps 92:8": "Dat de goddelozen groeien als het gras, en al de werkers van de ongerechtigheid bloeien, opdat zij tot in eeuwigheid weggevaagd worden.", "Amos 6:13": "U, die blij bent over een nietig ding; u, die zegt: Hebben wij niet door onze eigen kracht hoorns voor onszelf verkregen?", "Spr 6:12-15": "Een nietsnut, een verdorven man, gaat om met een verkeerde mond; hij knipoogt met zijn ogen, spreekt met zijn voeten, wijst met zijn vingers; in zijn hart zijn verkeerdheden, hij smeedt voortdurend kwaad, hij zaait ruzie.", "Ps 78:1-67": "Een onderwijzing van Asaf. O mijn volk, neem mijn leer ter ore; neig uw oor tot de woorden van mijn mond. Ik zal mijn mond opendoen met spreuken; ik zal geheimen overvloedig uitstorten, van oude tijden af. Die wij gehoord hebben en weten, en onze vaders ons verteld hebben.", "Zef 1:18": "Ook hun zilver, ook hun goud zal hen niet kunnen redden op de dag van de verbolgenheid van de HEERE; maar door het vuur van het ijver van Hem zal dit hele land verteerd worden; want Hij zal een voleinding maken, zeker, een haastige, met alle inwoners van dit land.", "Ezech 30:6": "Zo zegt de HEERE: Ja, zij zullen vallen, die Egypte ondersteunen, en de hoogmoed van zijn sterkte zal neerdalen; van de toren van Syene af zullen zij daarin door het zwaard vallen, spreekt de Heere HEERE.", "Hab 1:16": "Daarom offert hij aan zijn sleepnet, en brandt reukwerk aan zijn net; want daardoor is zijn deel vet geworden, en zijn voedsel smoutig.", "2 Kor 3:15": "Maar tot op de huidige dag, telkens als Mozes gelezen wordt, ligt er een deksel op hun hart.", "1 Kor 15:42": "Zo zal ook de opstanding van de doden zijn. Het lichaam wordt gezaaid in vergankelijkheid, het wordt opgewekt in onvergankelijkheid;", "Job 14:5": "Omdat zijn dagen bepaald zijn, het aantal van zijn maanden bij U bekend is, en U zijn grenzen gesteld hebt, die hij niet zal overschrijden;", "Matt 16:26": "Want wat baat het een mens, als hij de hele wereld wint, en schade lijdt aan zijn ziel? Of wat zal een mens geven, als losprijs voor zijn ziel?", "Jes 14:12-16": "Hoe bent u uit de hemel gevallen, o morgenster, u zoon van het dageraad! hoe bent u ter aarde neergehouwen, u die de heidenvolken verzwakte! En u zei in uw hart: Ik zal ten hemel opklimmen, ik zal mijn troon boven de sterren van God verhogen; en ik zal mij zetten op de berg van de samenkomst aan de zijden van het noorden. Ik zal boven de hoogten van de wolken klimmen, ik zal de Allerhoogste gelijk worden.", "Jes 25:8": "Hij zal de dood verslinden tot overwinning, en de Heere HEERE zal de tranen van alle aangezichten afwissen; en Hij zal de smaad van Zijn volk van de hele aarde wegnemen; want de HEERE heeft het gesproken.", "Deut 32:29": "O, dat zij wijs waren; zij zouden dit vernemen, zij zouden op hun einde letten.", "Spr 3:8": "Het zal een medicijn voor uw navel zijn, en een bevochtiging voor uw beenderen.", "Hos 14:10": "Wie is wijs? die begrijpt deze dingen; wie is verstandig? die bekent ze; want de wegen van de Heere zijn recht, en de rechtvaardigen zullen daarin wandelen, maar de overtreders zullen daarin vallen.", "Job 17:8": "De oprechten zullen hierover verbaasd zijn, en de onschuldige zal zich tegen de huichelaar opmaken;", "Jer 17:15": "Zie, zij zeggen tegen mij: Waar is het woord van de HEERE? Laat het nu komen!", "Spr 4:19": "De weg van de goddelozen is als donkerheid; zij weten niet, waarover zij zullen struikelen.", "Ps 62:4": "Hoelang zult u kwaad aanstichten tegen een man? U zult allen gedood worden; u zult zijn als een ingebogen wand, een aangestoten muur.", "Rom 3:4-6": "Dat zij verre. Maar God is waarachtig, en ieder mens leugenachtig; zoals geschreven is: Opdat U gerechtvaardigd wordt in Uw woorden, en overwint, wanneer U oordeelt. Als nu onze ongerechtigheid de gerechtigheid van God bevestigt, wat zullen wij zeggen? Is God onrechtvaardig, als Hij toorn over ons brengt? (Ik spreek naar de mens.) Dat zij verre, anders hoe zal God de wereld oordelen?", "Matt 6:23": "maar als uw oog slecht is, zal heel uw lichaam duister zijn. Als dan het licht dat in u is duisternis is, hoe groot is dan die duisternis!", "Ps 52:7": "God zal u ook afbreken voor eeuwig; Hij zal u wegrapen en u uit de tent uitrukken; ja, Hij zal u uitwortelen uit het land van de levenden. Sela.", "Jes 51:17": "Word wakker, word wakker, sta op, Jeruzalem! U die gedronken hebt uit de hand van de HEERE de beker van Zijn grimmigheid; de droesem van de beker van de zwijmeling hebt u gedronken, ja, uitgezogen.", "Spr 16:18": "Hoogmoed komt vóór de ondergang, en hoogheid van geest vóór de val.", "Luk 16:15": "En Hij zei tegen hen: U bent het die uzelf rechtvaardigt voor de mensen; maar God kent uw harten; want wat hoog is onder de mensen, is een gruwel voor God.", "Jes 65:3-5": "Een volk dat Mij voortdurend tergt in Mijn aangezicht, terwijl het in de hoven offert en op tichelstenen wierook brandt; Zittend bij de graven, zo overnachten zij bij de bewaarde plaatsen, etend zwijnenvlees, en er is sap van gruwelijke dingen in hun vaten. Die daar zeggen: Houd u tot uzelf, en kom niet bij mij, want ik ben heiliger dan u. Deze zijn een rook in Mijn neus, een vuur, dat de hele dag brandt.", "Job 35:8": "Uw goddeloosheid zou een man treffen, gelijk u bent, en uw gerechtigheid een mensenkind ten goede komen.", "Luk 4:23": "En Hij zei tegen hen: U zult zonder twijfel dit spreekwoord tegen Mij zeggen: Dokter, genees Uzelf; al wat wij gehoord hebben dat in Kapernaüm gebeurd is, doe dat ook hier in Uw vaderland.", "2 Kron 5:12": "en de Levieten, die zangers waren, van hen allen, van Asaf, van Heman, van Jeduthun, en van hun zonen, en van hun broeders, in fijn linnen gekleed, met cimbalen, en met luiten, en harpen, stonden aan de oostzijde van het altaar, en met hen tot honderdtwintig priesters toe, die op trompetten trompetten);", "Spr 24:12": "Wanneer u zegt: Zie, wij wisten dat niet; zal Hij, Die de harten weegt, dat niet merken? En Die uw ziel gadeslaat, zal Hij het niet weten? Want Hij zal de mens vergelden naar zijn werk.", "Job 12:3": "Ik heb ook een hart, net zoals u; ik ben niet minder dan u; en bij wie zijn niet zulke dingen bekend?", "Matt 12:42": "De koningin van het zuiden zal opstaan in het oordeel met dit geslacht, en zal het veroordelen; want zij is gekomen van het einde van de aarde, om de wijsheid van Salomo te horen; en zie, meer dan Salomo is hier!", "Spr 21:17": "Wie blijdschap liefheeft, die zal gebrek lijden; wie wijn en olie liefheeft, zal niet rijk worden.", "2 Tess 2:8-10": "En dan zal de onrechtvaardige geopenbaard worden, die de Heere zal doden door de Geest van Zijn mond, en teniet zal doen door de verschijning van Zijn komst; hem, zeg ik, wiens komst is naar de werking van de satan, met alle kracht en tekenen en wonderen van de leugen; en met alle verleiding van de onrechtvaardigheid in hen die verloren gaan; omdat zij de liefde voor de waarheid niet aangenomen hebben, om behouden te worden.", "Jer 2:34": "Ja, het bloed van de zielen van de onschuldige behoeftigen is in uw zomen gevonden; Ik heb dat niet door opgraven gevonden, maar aan dat alles.", "Spr 21:12": "De rechtvaardige let verstandig op het huis van de goddeloze, als God de goddelozen in het kwaad stort.", "2 Petr 3:10-12": "Maar de dag van de Heere zal komen als een dief in de nacht; op die dag zullen de hemelen met een enorm gedruis voorbijgaan, en de elementen zullen brandend vergaan, en de aarde en de werken die daarop zijn, zullen verbranden. Omdat al deze dingen dan zullen vergaan, wat voor mensen moet u dan wel zijn, in een heilige levenswandel en in godsvrucht! Verwacht en verhaast de komst van de dag van God, waarop de hemelen door vuur zullen vergaan, en de elementen brandend zullen versmelten.", "Ps 146:9": "De HEERE bewaart de vreemdelingen; Hij houdt de wees en de weduwe staande; maar de weg van de goddelozen keert Hij om.", "Job 16:20": "Mijn vrienden bespotten mij; maar mijn oog druipt tot God.", "Ps 136:5": "Hem, Die de hemelen met verstand gemaakt heeft; want Zijn goedertierenheid is voor eeuwig.", "Ps 101:7": "Wie bedrog pleegt, zal binnen mijn huis niet blijven; die leugens spreekt, zal voor mijn ogen niet bevestigd worden.", "Ex 5:2": "Maar Farao zei: Wie is de HEERE, Wiens stem ik gehoorzamen zou, om Israël te laten trekken? Ik ken de HEERE niet, en ik zal ook Israël niet laten trekken.", "Luk 5:22": "Maar Jezus, die hun overdenkingen doorzag, antwoordde en zei tegen hen: Wat overdenkt u in uw harten?", "Jes 5:24": "Daarom, zoals de tong van het vuur de stoppel verteert, en het kaf door de vlam verteerd wordt, zo zal hun wortel als verrotting zijn; en hun bloesem zal als stof opstijgen; omdat zij de wet van de HEERE van de heerscharen verwerpen, en het woord van de Heilige van Israël versmaden.", "Job 5:17": "Zie, gelukzalig is de mens, aan wie God straft; daarom verwerp de kastijding van de Almachtige niet.", "Openb 16:11": "En zij lasterden de God van de hemel vanwege hun pijnen, en vanwege hun gezwellen; en zij bekeerden zich niet van hun werken.", "Jes 65:7": "Uw ongerechtigheden, en de ongerechtigheden van uw vaderen tegelijk, zegt de HEERE, die op de bergen wierook gebrand hebben, en Mij smaad aangedaan hebben op de heuvels; daarom zal Ik hun vorige werkloon weer in hun boezem toemeten.", "Ex 11:1": "(Want de HEERE had tegen Mozes gesproken: Ik zal nog één plaag over Farao en over Egypte brengen, daarna zal hij u van hier laten trekken; als hij u geheel zal laten trekken, dan zal hij u haastig van hier uitdrijven.", "Joh 8:33": "Zij antwoordden Hem: Wij zijn Abrahams nageslacht, en hebben nog nooit iemand gediend; hoe kunt U dan zeggen: U zult vrij worden?", "Ps 11:5": "De HEERE beproeft de rechtvaardige; maar de goddeloze, en wie geweld liefheeft, haat Zijn ziel.", "Spr 28:13": "Wie zijn overtredingen bedekt, zal geen voorspoed hebben; maar wie ze belijdt en laat, zal barmhartigheid ontvangen.", "2 Tim 2:13": "als wij ontrouw zijn, blijft Hij trouw; Hij kan Zichzelf niet verloochenen.", "Klaagl 5:17": "Daarom is ons hart mat, om deze dingen zijn onze ogen duister geworden.", "2 Petr 2:9": "dan weet de Heere hoe Hij de godvruchtigen uit de verzoeking moet verlossen, en de onrechtvaardigen moet bewaren tot de dag van het oordeel om gestraft te worden;", "Ezech 24:14": "Ik, de HEERE, heb het gesproken; het zal komen, en Ik zal het doen; Ik zal er niet van wijken, en Ik zal niet sparen, en geen berouw hebben; naar uw wegen en naar uw daden zullen zij u oordelen, spreekt de Heere HEERE.", "Ps 147:4": "Hij telt het aantal van de sterren; Hij noemt ze allemaal bij hun naam.", "Ezech 25:7": "Daarom, zie, Ik zal Mijn hand tegen u uitstrekken, en u aan de heidenvolken tot buit geven, en Ik zal u uit de volken uitroeien, en u uit de landen doen verdwijnen; Ik zal u verdelgen; en u zult weten dat Ik de HEERE ben.", "Deut 31:17": "Dan zal Mijn toorn op die dag tegen hen ontsteken, en Ik zal hen verlaten, en Mijn aangezicht van hen verbergen, zodat zij verslonden worden, en veel kwaad en benauwdheden hen zullen treffen; zodat het op die dag zal zeggen: Heeft dit kwaad mij niet getroffen, omdat mijn God niet in mijn midden is?", "Rom 1:32": "die, hoewel zij het recht van God kennen, namelijk dat zij die zulke dingen doen de dood waard zijn, deze dingen niet alleen doen, maar ook nog instemming betonen aan hen die ze doen.", "Hos 13:1": "Toen Efraïm sprak, beefde men; hij heeft zich verheven in Israël; maar hij is schuldig geworden aan de Baäl en is gestorven.", "Amos 3:2": "Uit alle geslachten van de aardbodem heb Ik u alleen gekend; daarom zal Ik al uw ongerechtigheden over u bezoeken.", "1 Sam 8:20": "en wij zullen ook zijn zoals alle volken; en onze koning zal ons richten, en hij zal voor ons uit gaan, en hij zal onze oorlogen voeren.", "Job 5:3": "Ik heb een dwaas gezien die wortel schoot; doch meteen vervloekte ik zijn woning.", "Joh 8:15": "U oordeelt naar het vlees; Ik oordeel niemand.", "Mark 14:21": "De Zoon des mensen gaat wel heen, zoals van Hem geschreven is; maar wee die mens, door wie de Zoon des mensen verraden wordt! Het zou beter voor hem zijn, als die mens niet geboren was.", "1 Petr 3:10": "Want wie het leven wil liefhebben en goede dagen wil zien, die moet zijn tong weerhouden van het kwade, en zijn lippen, zodat ze geen bedrog spreken;", "Neh 12:27-31": "Bij de inwijding nu van de muur van Jeruzalem, zochten zij de Levieten op uit al hun plaatsen, om hen naar Jeruzalem te brengen, om de inwijding te doen met vreugde, en met dankzeggingen, en met gezang, cimbalen, luiten, en met harpen. Zo werden de kinderen van de zangers verzameld, zowel uit het vlakke veld rondom Jeruzalem, als uit de dorpen van de Netofathieten; En uit het huis van Gilgal, en uit de velden van Geba en Asmaveth; want de zangers hadden zich dorpen gebouwd rondom Jeruzalem.", "Spr 30:16": "Het graf, de gesloten baarmoeder, de aarde die van water niet verzadigd wordt, en het vuur dat niet zegt: Het is genoeg!", "Job 5:14": "Overdag ontmoeten zij de duisternis, en zoals 's nachts tasten zij rond in de middag.", "Job 31:33": "Als ik, net als Adam, mijn overtredingen bedekt heb, door eigenliefde mijn misdaad verbergende!", "Jer 2:31": "Geslacht, let toch op het woord van de HEERE! Ben Ik Israël een woestijn geweest, of een land van de uiterste donkerheid? Waarom zegt Mijn volk dan: Wij zijn heren, wij zullen niet meer tot U komen?", "Luk 7:31": "En de Heere zei: Waarmee zal Ik dan de mensen van dit geslacht vergelijken, en waaraan zijn zij gelijk?", "Ps 102:11": "Vanwege Uw verstoordheid en Uw grote toorn; want U hebt mij verheven, en mij weer neergeworpen.", "Openb 15:3": "En zij zongen het gezang van Mozes, de dienstknecht van God, en het gezang van het Lam, en zeiden: Groot en wonderlijk zijn Uw werken, Heere, Gij almachtige God, rechtvaardig en waarachtig zijn Uw wegen, Gij Koning der heiligen!", "Jes 14:21": "Maak de slachting voor zijn kinderen gereed, om de ongerechtigheid van hun vaderen; opdat zij niet opstaan, en de aarde erven, en de wereld vervullen met steden;", "Hebr 4:13": "En er is geen schepsel onzichtbaar voor Hem; maar alle dingen zijn naakt en geopend voor de ogen van Hem, met Wie wij te maken hebben.", "Job 27:19": "Rijk ligt hij neder, en wordt niet weggenomen; doet hij zijn ogen open, zo is hij er niet.", "Spr 10:18": "Wie haat bedekt, heeft valse lippen, en wie een kwaad gerucht verspreidt, is een dwaas.", "Hand 23:8": "Want de Sadduceeën zeggen dat er geen opstanding is, en ook geen engel of geest; maar de Farizeeën belijden het beide.", "Hebr 10:27-31": "maar een schrikwekkend uitzicht op het oordeel, en een felle hitte van het vuur, die de tegenstanders zal verslinden. Als iemand de wet van Mozes heeft verworpen, sterft hij zonder ontferming, op het woord van twee of drie getuigen; hoeveel zwaarder straf, denkt u, zal hij waard geacht worden, die de Zoon van God met voeten heeft getreden, en het bloed van het testament, waardoor hij geheiligd was, als onrein heeft beschouwd, en de Geest van de genade smaad heeft aangedaan?", "Pred 7:15": "Dit alles heb ik gezien in de dagen van mijn vluchtige leven; er is een rechtvaardige die in zijn gerechtigheid omkomt; daarentegen is er een goddeloze die in zijn slechtheid zijn dagen verlengt.", "Luk 17:29": "maar op de dag waarop Lot uit Sodom wegging, regende het vuur en zwavel uit de hemel, en dat verdierf hen allen.", "Job 20:28": "De inkomsten van zijn huis zullen weggevoerd worden; het zal allemaal wegvloeien op de dag van Zijn toorn.", "Job 18:6": "Het licht zal verduisteren in zijn tent, en zijn lamp zal boven hem uitgeblust worden.", "Luk 23:39-43": "En een van de kwaaddoeners die daar hingen, lasterde Hem en zei: Als U de Christus bent, verlos Uzelf en ons. Maar de ander antwoordde en bestrafte hem: Vreest u ook God niet, terwijl u in hetzelfde oordeel bent? En wij toch terecht; want wij ontvangen straf die past bij wat wij gedaan hebben; maar Deze heeft niets onbehoorlijks gedaan.", "Gen 6:3": "Toen zei de HEERE: Mijn Geest zal niet in eeuwigheid twisten met de mens, omdat hij ook vlees is; doch zijn dagen zullen honderdtwintig jaren zijn.", "Luk 9:46": "En er ontstond onder hen een discussie over wie van hen de belangrijkste zou zijn.", "Job 15:27": "Omdat hij zijn aangezicht met zijn vet bedekt heeft, en rimpels gemaakt heeft rond de weekdarmen;", "Pred 5:5": "Laat uw mond niet toe dat hij uw lichaam laat zondigen; en zeg niet voor het aangezicht van de engel dat het een vergissing was; waarom zou God erg toornen om wat u zegt, en het werk van uw handen te gronde richten?", "Ps 50:6": "En de hemelen verkondigen Zijn gerechtigheid; want God Zelf is Rechter. Sela.", "Num 15:31": "Want zij heeft het woord van de HEERE veracht en Zijn gebod vernietigd; die ziel zal helemaal uitgeroeid worden; haar ongerechtigheid is op haar.", "Zef 1:15": "Die dag zal een dag van verbolgenheid zijn; een dag van benauwdheid en angst, een dag van woestheid en verwoesting, een dag van duisternis en donkerheid, een dag van wolk en dikke duisternis;", "Hebr 13:14": "Want wij hebben hier geen blijvende stad, maar wij zoeken de toekomstige.", "Deut 28:15-68": "Daarentegen zal het gebeuren, als u niet naar de stem van de HEERE, uw God, luistert, om op te letten dat u al Zijn geboden en Zijn inzettingen doet, die ik u heden gebied; zo zullen al deze vloeken over u komen, en u treffen. Vervloekt zult u zijn in de stad, en vervloekt zult u zijn op het veld. Vervloekt zal zijn uw korf, en uw baktrog.", "Ps 149:3": "Laat hen Zijn Naam loven met dans; laat hen Hem psalmzingen met trommel en harp.", "Job 12:10": "In Wiens hand de ziel is van alles wat leeft, en de geest van alle vlees van de mens.", "2 Tess 1:8": "Met vlammend vuur, wraak oefenend over hen die God niet kennen, en over hen die het Evangelie van onze Heere Jezus Christus niet gehoorzaam zijn.", "Luk 18:9-14": "En Hij vertelde ook aan sommigen, die op zichzelf vertrouwden dat zij rechtvaardig waren en de anderen niets waard achtten, deze gelijkenis: Twee mensen gingen op naar de tempel om te bidden; de een was een Farizeeër en de ander een tollenaar. De Farizeeër stond en bad dit bij zichzelf: O God, ik dank U dat ik niet ben zoals de andere mensen: rovers, onrechtvaardigen, overspelers; of ook zoals deze tollenaar."}, "noten": {}, "koppeling": {"1": "<span class=\"wl\" data-l=\"L1\" data-code=\"H347\">Maar</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H347\">Job</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H6030\">antwoordde</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H559\">en</span> zei:", "2": "Luister met aandacht naar mijn woorden, <span class=\"wl\" data-l=\"L1\" data-code=\"H1961\">en</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H1961\">laat</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H2063\">dit</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H2063\">uw</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H8575\">vertroostingen</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H8575\">zijn</span>.", "3": "<span class=\"wl\" data-l=\"L1\" data-code=\"H5375\">Verdraag</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H595\">mij</span>, <span class=\"wl\" data-l=\"L2\" data -l=\"L3\" data-code=\"H1892\">met</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H1892\">ijdelheid</span>, terwijl in <span class=\"wl\" data-l=\"L4\" data-code=\"H8666\">uw</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H8666\">antwoorden</span> ontrouw <span class=\"wl\" data-l=\"L5\" data-code=\"H4604\">overblijft</span>?"}, "koppeling_kjv": {"1": "But <span class=\"wl wl-kjv\" data-code=\"H347\">Job</span> <span class=\"wl wl-kjv\" data-code=\"H6030\">answered</span> and said,", "2": "<span class=\"wl wl-kjv\" data-code=\"H8085\">Hear</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">diligently</span> my <span class=\"wl wl-kjv\" data-code=\"H4405\">speech,</span> and let this be your consolations.", "3": "<span class=\"wl wl-kjv\" data-code=\"H5375\">Suffer</span> me that I may <span class=\"wl wl-kjv\" data-code=\"H1696\">speak;</span> and <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> that I have <span class=\"wl wl-kjv\" data-code=\"H1696\">spoken,</span> mock on.", "4": "As for me, is my <span class=\"wl wl-kjv\" data-code=\"H7879\">complaint</span> to <span class=\"wl wl-kjv\" data-code=\"H120\">man?</span> and if it were so, why should not my <span class=\"wl wl-kjv\" data-code=\"H7307\">spirit</span> be troubled?", "5": "<span class=\"wl wl-kjv\" data-code=\"H6437\">Mark</span> me, and be <span class=\"wl wl-kjv\" data-code=\"H8074\">astonished,</span> and <span class=\"wl wl-kjv\" data-code=\"H7760\">lay</span> your <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> upon your mouth.", "6": "Even when I <span class=\"wl wl-kjv\" data-code=\"H2142\">remember</span> I am <span class=\"wl wl-kjv\" data-code=\"H926\">afraid,</span> and <span class=\"wl wl-kjv\" data-code=\"H6427\">trembling</span> taketh hold <span class=\"wl wl-kjv\" data-code=\"H270\">on</span> my flesh.", "7": "Wherefore do the <span class=\"wl wl-kjv\" data-code=\"H7563\">wicked</span> <span class=\"wl wl-kjv\" data-code=\"H2421\">live,</span> become <span class=\"wl wl-kjv\" data-code=\"H6275\">old,</span> yea, are <span class=\"wl wl-kjv\" data-code=\"H1396\">mighty</span> in power?", "8": "Their <span class=\"wl wl-kjv\" data-code=\"H2233\">seed</span> is <span class=\"wl wl-kjv\" data-code=\"H3559\">established</span> in their <span class=\"wl wl-kjv\" data-code=\"H6440\">sight</span> with them, and their <span class=\"wl wl-kjv\" data-code=\"H6631\">offspring</span> before their eyes.", "9": "Their <span class=\"wl wl-kjv\" data-code=\"H1004\">houses</span> are <span class=\"wl wl-kjv\" data-code=\"H7965\">safe</span> from <span class=\"wl wl-kjv\" data-code=\"H6343\">fear,</span> neither is the <span class=\"wl wl-kjv\" data-code=\"H7626\">rod</span> of God", "10": "Their <span class=\"wl wl-kjv\" data-code=\"H7794\">bull</span> <span class=\"wl wl-kjv\" data-code=\"H5674\">gendereth,</span> and <span class=\"wl wl-kjv\" data-code=\"H1602\">faileth</span> not; their <span class=\"wl wl-kjv\" data-code=\"H6510\">cow</span> <span class=\"wl wl-kjv\" data-code=\"H6403\">calveth,</span> and casteth not her calf.", "11": "They send <span class=\"wl wl-kjv\" data-code=\"H7971\">forth</span> their little <span class=\"wl wl-kjv\" data-code=\"H5759\">ones</span> like a <span class=\"wl wl-kjv\" data-code=\"H6629\">flock,</span> and their <span class=\"wl wl-kjv\" data-code=\"H3206\">children</span> dance.", "12": "They <span class=\"wl wl-kjv\" data-code=\"H5375\">take</span> the <span class=\"wl wl-kjv\" data-code=\"H8596\">timbrel</span> and <span class=\"wl wl-kjv\" data-code=\"H3658\">harp,</span> and <span class=\"wl wl-kjv\" data-code=\"H8055\">rejoice</span> at the <span class=\"wl wl-kjv\" data-code=\"H6963\">sound</span> of the organ.", "13": "They <span class=\"wl wl-kjv\" data-code=\"H3615\">spend</span> their <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> in <span class=\"wl wl-kjv\" data-code=\"H2896\">wealth,</span> and in a <span class=\"wl wl-kjv\" data-code=\"H7281\">moment</span> go <span class=\"wl wl-kjv\" data-code=\"H2865\">down</span> to the grave.", "14": "Therefore they <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> unto <span class=\"wl wl-kjv\" data-code=\"H410\">God,</span> <span class=\"wl wl-kjv\" data-code=\"H5493\">Depart</span> from us; for we <span class=\"wl wl-kjv\" data-code=\"H2654\">desire</span> not the <span class=\"wl wl-kjv\" data-code=\"H1847\">knowledge</span> of thy ways.", "15": "What is the <span class=\"wl wl-kjv\" data-code=\"H7706\">Almighty,</span> that we should <span class=\"wl wl-kjv\" data-code=\"H5647\">serve</span> him? and what <span class=\"wl wl-kjv\" data-code=\"H3276\">profit</span> should we have, if we pray", "16": "Lo, their <span class=\"wl wl-kjv\" data-code=\"H2898\">good</span> is not in their <span class=\"wl wl-kjv\" data-code=\"H3027\">hand:</span> the <span class=\"wl wl-kjv\" data-code=\"H6098\">counsel</span> of the <span class=\"wl wl-kjv\" data-code=\"H7563\">wicked</span> is far", "17": "How oft is the <span class=\"wl wl-kjv\" data-code=\"H5216\">candle</span> of the <span class=\"wl wl-kjv\" data-code=\"H7563\">wicked</span> put <span class=\"wl wl-kjv\" data-code=\"H1846\">out!</span> and how oft <span class=\"wl wl-kjv\" data-code=\"H935\">cometh</span> their <span class=\"wl wl-kjv\" data-code=\"H343\">destruction</span> upon them! God <span class=\"wl wl-kjv\" data-code=\"H2505\">distributeth</span> <span class=\"wl wl-kjv\" data-code=\"H2256\">sorrows</span> in his anger.", "18": "They are as <span class=\"wl wl-kjv\" data-code=\"H8401\">stubble</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H7307\">wind,</span> and as <span class=\"wl wl-kjv\" data-code=\"H4671\">chaff</span> that the <span class=\"wl wl-kjv\" data-code=\"H5492\">storm</span> carrieth away.", "19": "<span class=\"wl wl-kjv\" data-code=\"H433\">God</span> layeth <span class=\"wl wl-kjv\" data-code=\"H6845\">up</span> his <span class=\"wl wl-kjv\" data-code=\"H205\">iniquity</span> for his <span class=\"wl wl-kjv\" data-code=\"H1121\">children:</span> he <span class=\"wl wl-kjv\" data-code=\"H7999\">rewardeth</span> him, and he shall know", "20": "His <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes</span> shall <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> his <span class=\"wl wl-kjv\" data-code=\"H3589\">destruction,</span> and he shall <span class=\"wl wl-kjv\" data-code=\"H8354\">drink</span> of the <span class=\"wl wl-kjv\" data-code=\"H2534\">wrath</span> of the Almighty.", "21": "For what <span class=\"wl wl-kjv\" data-code=\"H2656\">pleasure</span> hath he in his <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> him, when the <span class=\"wl wl-kjv\" data-code=\"H4557\">number</span> of his <span class=\"wl wl-kjv\" data-code=\"H2320\">months</span> is cut off in the midst?", "22": "Shall any <span class=\"wl wl-kjv\" data-code=\"H3925\">teach</span> <span class=\"wl wl-kjv\" data-code=\"H410\">God</span> <span class=\"wl wl-kjv\" data-code=\"H1847\">knowledge?</span> seeing he <span class=\"wl wl-kjv\" data-code=\"H8199\">judgeth</span> those that are high.", "23": "One <span class=\"wl wl-kjv\" data-code=\"H4191\">dieth</span> in his <span class=\"wl wl-kjv\" data-code=\"H8537\">full</span> <span class=\"wl wl-kjv\" data-code=\"H6106\">strength,</span> being wholly at <span class=\"wl wl-kjv\" data-code=\"H7946\">ease</span> and quiet.", "24": "His <span class=\"wl wl-kjv\" data-code=\"H5845\">breasts</span> are <span class=\"wl wl-kjv\" data-code=\"H4390\">full</span> of <span class=\"wl wl-kjv\" data-code=\"H2461\">milk,</span> and his <span class=\"wl wl-kjv\" data-code=\"H6106\">bones</span> are <span class=\"wl wl-kjv\" data-code=\"H8248\">moistened</span> with marrow.", "25": "And another <span class=\"wl wl-kjv\" data-code=\"H4191\">dieth</span> in the <span class=\"wl wl-kjv\" data-code=\"H4751\">bitterness</span> of his <span class=\"wl wl-kjv\" data-code=\"H5315\">soul,</span> and never <span class=\"wl wl-kjv\" data-code=\"H398\">eateth</span> with pleasure.", "26": "They shall lie <span class=\"wl wl-kjv\" data-code=\"H7901\">down</span> <span class=\"wl wl-kjv\" data-code=\"H3162\">alike</span> in the <span class=\"wl wl-kjv\" data-code=\"H6083\">dust,</span> and the <span class=\"wl wl-kjv\" data-code=\"H7415\">worms</span> shall cover", "27": "Behold, I <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> your <span class=\"wl wl-kjv\" data-code=\"H4284\">thoughts,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4209\">devices</span> which ye wrongfully imagine", "28": "For ye <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> Where is the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H5081\">prince?</span> and where are the <span class=\"wl wl-kjv\" data-code=\"H4908\">dwelling</span> <span class=\"wl wl-kjv\" data-code=\"H168\">places</span> of the wicked?", "29": "Have ye not <span class=\"wl wl-kjv\" data-code=\"H7592\">asked</span> them that <span class=\"wl wl-kjv\" data-code=\"H5674\">go</span> by the <span class=\"wl wl-kjv\" data-code=\"H1870\">way?</span> and do ye not <span class=\"wl wl-kjv\" data-code=\"H5234\">know</span> their tokens,", "30": "That the <span class=\"wl wl-kjv\" data-code=\"H7451\">wicked</span> is <span class=\"wl wl-kjv\" data-code=\"H2820\">reserved</span> to the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of <span class=\"wl wl-kjv\" data-code=\"H343\">destruction?</span> they shall be brought <span class=\"wl wl-kjv\" data-code=\"H2986\">forth</span> to the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of wrath.", "31": "Who shall <span class=\"wl wl-kjv\" data-code=\"H5046\">declare</span> his <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> to his <span class=\"wl wl-kjv\" data-code=\"H6440\">face?</span> and who shall <span class=\"wl wl-kjv\" data-code=\"H7999\">repay</span> him what he hath done?", "32": "Yet shall he be <span class=\"wl wl-kjv\" data-code=\"H2986\">brought</span> to the <span class=\"wl wl-kjv\" data-code=\"H6913\">grave,</span> and shall <span class=\"wl wl-kjv\" data-code=\"H8245\">remain</span> in the tomb.", "33": "The <span class=\"wl wl-kjv\" data-code=\"H7263\">clods</span> of the <span class=\"wl wl-kjv\" data-code=\"H5158\">valley</span> shall be <span class=\"wl wl-kjv\" data-code=\"H4985\">sweet</span> unto him, and every <span class=\"wl wl-kjv\" data-code=\"H120\">man</span> shall <span class=\"wl wl-kjv\" data-code=\"H4900\">draw</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> him, as there are <span class=\"wl wl-kjv\" data-code=\"H4557\">innumerable</span> before", "34": "How then <span class=\"wl wl-kjv\" data-code=\"H5162\">comfort</span> ye me in <span class=\"wl wl-kjv\" data-code=\"H1892\">vain,</span> seeing in your <span class=\"wl wl-kjv\" data-code=\"H8666\">answers</span> there <span class=\"wl wl-kjv\" data-code=\"H7604\">remaineth</span> falsehood?"}};
const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"
const ZELF = D.meta.zelf_abbr;      // afkorting binnen dit hoofdstuk, bv. "Joh 3"
const BASIS_URL = D.meta.basis_url;
const PARALLEL_VOLGORDE = ['Berea', 'SV', 'KJV'];
let vertaling = 'Berea';
let openVers = null;

const bijbel = document.getElementById('bijbel');
const popup = document.getElementById('popup');
const toast = document.getElementById('toast');
const nummers = Object.keys(D.vertalingen.Berea);

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  const studieHtml = document.getElementById('studiepaneel-tpl').innerHTML;
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<div class="studiemenu"><button type="button" id="studieknop" class="navselect">Studie ▾</button>` +
    `<div class="studiepaneel" id="studiepaneel">${studieHtml}</div></div>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
  const studieknop = document.getElementById('studieknop'), studiepaneel = document.getElementById('studiepaneel');
  studieknop.onclick = e => { e.stopPropagation(); studiepaneel.classList.toggle('open'); };
  document.addEventListener('click', e => { if (!e.target.closest('.studiemenu')) studiepaneel.classList.remove('open'); });
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.Berea[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.Berea[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (Berea)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function paneelInhoud(n, tab) {
  if (tab === 'grondwoorden') {
    const heeftB = D.koppeling && D.koppeling[n];
    const heeftK = D.koppeling_kjv && D.koppeling_kjv[n];
    if (!heeftB && !heeftK) return '<em>Nog geen woordkoppeling voor dit vers.</em>';
    let h = '';
    if (heeftB) h += `<div class="tsk-kop">Berea</div>` +
      `<div class="gw-tekst" style="font-family:Georgia,serif;line-height:1.8">${D.koppeling[n]}</div>` +
      `<div class="gw-detail" style="margin-top:.5rem"></div>`;
    if (heeftK) h += `<div class="tsk-kop" style="margin-top:.9rem">KJV</div>` +
      `<div class="gw-tekst" style="font-family:Georgia,serif;line-height:1.8">${D.koppeling_kjv[n]}</div>` +
      `<div class="gw-detail" style="margin-top:.5rem"></div>`;
    return h + '<div class="bronregel">Klik op een onderstreept woord voor de vindplaatsen.</div>';
  }
  if (tab === 'vertalingen') {
    return PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
  }
  if (tab === 'verwijzingen') {
    const berea = D.tsk[n], engels = D.tsk_kjv[n];
    if ((!berea || !berea.length) && (!engels || !engels.length)) return '<em>Geen verwijzingen bij dit vers.</em>';
    let h = '';
    if (berea && berea.length) {
      h += '<div class="tsk-kop">Treasury of Scripture Knowledge | Berea</div>';
      h += berea.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r}">${r}</a>`).join('') + '</div>').join('');
    }
    if (engels && engels.length) {
      h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.tsk[n] && D.tsk[n].length), heeftO = !!D.onderwerpen[n];
  const heeftG = !!((D.koppeling && D.koppeling[n]) || (D.koppeling_kjv && D.koppeling_kjv[n]));
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : (heeftG ? 'grondwoorden' : 'vertalingen'));
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'grondwoorden' ? 'actief' : ''} ${heeftG ? '' : 'leeg'}" data-tab="grondwoorden" data-n="${n}">Grondwoorden</div>
    <div class="ntab" data-tab="vertalingen" data-n="${n}">Vertalingen</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.Berea[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · Berea</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}
</script>
</body>
</html>
