jg te voeren tegen Hem, Die op het paard zat, en tegen Zijn legers.", "1 Kor 8:1": "Wat betreft de dingen die aan de afgoden geofferd zijn: wij weten dat wij allemaal samen kennis hebben. De kennis maakt opgeblazen, maar de liefde sticht.", "Jes 13:11": "Want Ik zal over de wereld de boosheid bezoeken, en over de goddelozen hun ongerechtigheid; en Ik zal de hoogmoed van de trotsen doen ophouden, en de hovaardij van de tirannen zal Ik vernederen.", "Ps 106:18": "En een vuur brandde onder hun groep, een vlam stak de goddelozen in brand.", "Pred 6:6": "Ja, al leefde hij wel tweemaal duizend jaren, en zag hij het goede niet; gaan zij niet allen naar één plaats?", "Matt 6:32": "Want al deze dingen zoeken de heidenen; want uw hemelse Vader weet dat u al deze dingen nodig hebt.", "Pred 9:3": "Dit is een kwaad onder alles wat er onder de zon gebeurt, dat eenzelfde lot allen treft, en dat ook het hart van de mensenkinderen vol boosheid is, en dat er in hun leven onzinnigheden zijn in hun hart; en daarna moeten zij naar de doden toe.", "Job 31:25": "Als ik blijde ben geweest, omdat mijn vermogen groot was, en omdat mijn hand geweldig veel verkregen had;", "Ps 78:19": "En zij spraken tegen God, zij zeiden: Zou God een tafel kunnen aanrichten in de woestijn?", "Luk 12:57": "En waarom oordeelt u ook niet zelf wat recht is?", "Gen 16:5": "Toen zei Sarai tegen Abram: Het onrecht mij aangedaan komt op u neer; ik heb mijn dienstmaagd in uw schoot gegeven; nu zij ziet dat zij zwanger is geworden, ben ik veracht in haar ogen; de HEERE oordele tussen mij en tussen u!", "Job 5:3-5": "Ik heb een dwaas gezien die wortel schoot; doch meteen vervloekte ik zijn woning. Ver waren zijn zonen van heil; en zij werden verbrijzeld in de poort, en er was geen verlosser. Wiens oogst de hongerige verteerde, die hij ook uit de doornen gehaald had; de struikrover slokte hun vermogen in.", "Ezech 33:7-19": "U dan, o mensenkind! Ik heb u tot een wachter gesteld over het huis van Israël; u zult dus het woord uit Mijn mond horen, en hen namens Mij waarschuwen. Als Ik tegen de goddeloze zeg: O goddeloze, u zult zeker sterven! en u spreekt niet, om de goddeloze van zijn weg af te manen, dan zal die goddeloze in zijn ongerechtigheid sterven, maar zijn bloed zal Ik van uw hand eisen. Maar als u de goddeloze van zijn weg afmaant, dat hij zich ervan bekeert, en hij zich van zijn weg niet bekeert, dan zal hij in zijn ongerechtigheid sterven; maar u hebt uw leven bevrijd.", "Ex 20:16": "U zult geen valse getuigenis spreken tegen uw naaste.", "Deut 30:15": "Zie, ik heb u heden voorgesteld het leven en het goede, en de dood en het kwade.", "Matt 3:12": "Zijn wan is in Zijn hand, en Hij zal Zijn dorsvloer helemaal zuiveren, en Zijn tarwe in Zijn schuur samenbrengen, en Hij zal het kaf met onblusbaar vuur verbranden.", "Luk 8:10": "En Hij zei: Aan u is het gegeven de verborgenheden van het Koninkrijk van God te verstaan; maar tot de anderen spreek Ik in gelijkenissen, opdat zij ziende niet zien, en horende niet verstaan.", "Matt 24:39": "en zij merkten het niet, totdat de zondvloed kwam en hen allen wegnam; zo zal ook de komst van de Zoon des mensen zijn.", "Ps 119:29": "Wend van mij de weg van de valsheid, en verleen mij genadig Uw wet.", "Job 34:21": "Want Zijn ogen zijn op ieders wegen, en Hij ziet al zijn treden.", "Deut 4:24": "Want de HEERE, uw God, is een verterend vuur, een na-ijverig God.", "Gen 44:29": "Als u nu deze ook van mijn gezicht wegneemt, en hem een ongeluk overkomt, zult u mijn grijze haren met verdriet naar het graf doen afdalen!", "1 Joh 1:9": "Als wij onze zonden belijden: Hij is getrouw en rechtvaardig, om ons de zonden te vergeven, en ons te reinigen van alle ongerechtigheid.", "Job 27:10": "Zal hij zich verlustigen in de Almachtige? Zal hij God aanroepen te aller tijd?", "2 Tim 3:2-7": "Want de mensen zullen zijn: liefhebbers van zichzelf, geldgierig, grootsprakerig, hoogmoedig, lasteraars, aan hun ouders ongehoorzaam, ondankbaar, onheilig, zonder natuurlijke liefde, onverzoenlijk, kwaadsprekers, onmatig, wreed, zonder liefde tot het goede, verraders, roekeloos, opgeblazen, meer liefhebbers van de wellusten dan liefhebbers van God;", "Joh 9:4": "Ik moet de werken doen van Hem die Mij gezonden heeft, zolang het dag is; de nacht komt, waarin niemand kan werken.", "Jes 45:4": "Om Jakobs, Mijn knechts wil, en Israëls, Mijn uitverkorenen; ja, Ik riep u bij uw naam, Ik noemde u toe, hoewel u Mij niet kende.", "Jak 4:9": "Gedraag u als ellendigen, en treur en ween; laat uw lachen veranderen in treuren, en uw blijdschap in verdriet.", "Ps 107:11": "Omdat zij opstandig waren geweest tegen Gods geboden, en de raad van de Allerhoogste onwaardig verworpen hadden.", "2 Kron 20:28": "En zij kwamen in Jeruzalem, met luiten, en met harpen, en met trompetten, naar het huis van de HEERE.", "Ps 90:15": "Verblijd ons naar de dagen, waarin U ons gedrukt hebt, naar de jaren, waarin wij het kwaad gezien hebben.", "1 Kron 15:28": "Zo bracht heel Israël de ark van het verbond van de HEERE op, met gejuich, en met geluid van de bazuin, en met trompetten, en met cimbalen, en maakte geluid met luiten en met harpen.", "Ps 31:24": "Heb de HEERE lief, u, al Zijn gunstgenoten! Want de HEERE behoedt de gelovigen, en vergeldt overvloedig hem die hoogmoed bedrijft.", "1 Kor 8:2": "En als iemand meent iets te weten, die heeft nog niets gekend, zoals men behoort te kennen.", "Jes 24:9": "Zij zullen geen wijn drinken met gezang; de sterke drank zal bitter zijn voor hen die hem drinken.", "Job 15:4": "Ja, u vernietigt de vreze, en neemt het gebed voor het aangezicht van God weg.", "Matt 13:22": "En die in de doornen bezaaid is, dit is degene die het woord hoort; en de zorgen van deze wereld en de verleiding van de rijkdom verstikken het woord, en het wordt onvruchtbaar.", "Spr 14:8": "De wijsheid van de kloekzinnige is zijn weg te begrijpen; maar dwaasheid van de dwazen is bedrog.", "2 Kor 10:5": "Waarbij wij de overleggingen neerwerpen, en alle hoogte die zich verheft tegen de kennis van God, en elke gedachte gevangennemen tot de gehoorzaamheid van Christus;", "Lev 19:11": "U zult niet stelen, en u zult niet liegen, noch bedrieglijk handelen, ieder tegen zijn naaste.", "Job 27:21": "De oostenwind zal hem wegvoeren, dat hij heengaat, en zal hem wegstormen uit zijn plaats.", "Jes 60:2": "Want zie, de duisternis zal de aarde bedekken, en donkerheid de volken; maar over u zal de HEERE opgaan, en Zijn heerlijkheid zal over u gezien worden.", "Job 35:14": "Dat u ook gezegd hebt: U zult Hem niet aanschouwen; er is toch een oordeel voor Zijn aangezicht, wacht u dan op Hem.", "Ps 89:15": "Gerechtigheid en gericht zijn de vastigheid van Uw troon; goedertierenheid en waarheid gaan voor Uw aangezicht heen.", "Ps 33:13-15": "De HEERE kijkt uit de hemel, en ziet alle mensenkinderen. Hij ziet uit vanaf Zijn vaste woonplaats op alle inwoners van de aarde. Hij vormt hun aller hart; Hij let op al hun werken.", "Jer 8:20-22": "De oogst is voorbij, de zomer is ten einde; nog zijn wij niet verlost. Ik ben gebroken vanwege de breuk van de dochter van mijn volk; ik ga gehuld in het zwart, ontzetting heeft mij aangegrepen. Is er geen balsem in Gilead? Is er geen heelmeester daar? Want waarom is de genezing van de dochter van mijn volk niet gekomen?", "Jer 43:2": "Toen zei Azaria, de zoon van Hosaja, en Johanan, de zoon van Kareah, en alle trotse mannen, tegen Jeremia: U spreekt leugen; de HEERE, onze God, heeft u niet gezonden, om te zeggen: U zult niet naar Egypte gaan, om daar als vreemdelingen te verblijven.", "Job 7:8-10": "Het oog van hem die mij nu ziet, zal mij niet zien; uw ogen zullen op mij zijn; maar ik zal niet meer zijn. Een wolk vergaat en vaart heen; zo zal hij die in het graf daalt, niet weer opkomen. Hij zal niet meer terugkeren naar zijn huis, en zijn plaats zal hem niet meer kennen.", "Jes 45:9": "Wee hem die met zijn Formeerder twist, zoals een potscherf met aarden potscherven! Zal ook het leem tegen zijn formeerder zeggen: Wat maakt u? of zal uw werk zeggen: Hij heeft geen handen?", "Jes 14:20": "U zult niet bij hen gevoegd worden in de begrafenis; want u hebt uw land verdorven, en uw volk gedood; het nageslacht van de boosdoeners zal in eeuwigheid niet genoemd worden.", "Spr 20:20": "Wie zijn vader of zijn moeder vervloekt, diens lamp zal uitgeblust worden in zwarte duisternis.", "Ex 32:33-35": "Toen zei de HEERE tegen Mozes: Wie tegen Mij zondigt, die zal Ik uit Mijn boek delgen. Ga nu heen, leid dit volk naar waar Ik u gezegd heb; zie, Mijn Engel zal voor u uit gaan! Maar op de dag van het bezoeken zal Ik hun zonde over hen bezoeken! Zo trof de HEERE dit volk met een plaag, omdat zij dat kalf gemaakt hadden, dat Aäron gemaakt had.", "Job 20:4-29": "Weet u dit niet? Van oudsher af, van toen God de mens op de wereld gezet heeft, Dat het gejuich van de goddelozen van dichtbij geweest is², en de vreugde van de huichelaar maar voor een ogenblik? Al zou zijn hoogheid tot de hemel toe opklimmen, en zijn hoofd tot aan de wolken raken;", "Job 36:4": "Want voorwaar, mijn woorden zullen geen valsheid zijn; iemand die oprecht van kennis is, is bij u.", "Spr 13:10": "Door hoogmoed maakt men niet dan gekijf; maar bij hen die zich laten raden is wijsheid.", "Spr 10:27-31": "De vreze van de HEERE vermeerdert de dagen; maar de jaren van de goddelozen worden verkort. De hoop van de rechtvaardigen is blijdschap; maar de verwachting van de goddelozen zal vergaan. De weg van de HEERE is sterkte voor de oprechte; maar ondergang voor de werkers van ongerechtigheid.", "Matt 22:29": "Maar Jezus antwoordde en zei tegen hen: U dwaalt, omdat u de Schriften niet kent, noch de kracht van God.", "Spr 28:14": "Gelukkig is de mens, die voortdurend vreest; maar wie zijn hart verhardt, zal in het kwaad vallen.", "Jes 33:22": "Want de HEERE is onze Rechter, de HEERE is onze Wetgever, de HEERE is onze Koning. Hij zal ons redden.", "Ps 34:22": "Thau. De boosheid zal de goddeloze doden; en die de rechtvaardige haten, zullen schuldig verklaard worden.", "Gal 6:8": "Want die in zijn eigen vlees zaait, zal uit het vlees verderf maaien; maar die in de Geest zaait, zal uit de Geest het eeuwige leven maaien.", "1 Sam 1:16": "Beschouw uw dienstmaagd toch niet als een dochter van Belial; want ik heb tot nu toe gesproken uit de veelheid van mijn gedachten en van mijn verdriet.", "Joh 8:12": "Jezus sprak dan weer tegen hen en zei: Ik ben het licht van de wereld; wie Mij volgt, zal in de duisternis niet wandelen, maar zal het licht van het leven hebben.", "Job 37:20": "Zal het Hem verteld worden, als ik zo zou spreken? Denkt iemand dat, zeker, hij zal verslonden worden.", "Spr 13:6": "De gerechtigheid bewaart de oprechte op de weg; maar de goddeloosheid zal de zondaar omkeren.", "1 Joh 1:8": "Als wij zeggen dat wij geen zonde hebben, dan verleiden wij ons zelf, en de waarheid is niet in ons.", "1 Joh 3:1": "Zie, hoe grote liefde de Vader ons gegeven heeft, namelijk dat wij kinderen van God genoemd zouden worden. Daarom kent de wereld ons niet, omdat zij Hem niet kent.", "Pred 1:4": "Het ene geslacht gaat, en het andere geslacht komt; maar de aarde blijft staan in eeuwigheid.", "Spr 6:16": "Deze zes dingen haat de HEERE; ja, zeven zijn een gruwel voor Zijn ziel:", "Jes 31:2": "Toch is Hij ook wijs, en Hij doet het kwaad komen, en trekt Zijn woorden niet terug; maar Hij zal Zich opmaken tegen het huis van de boosdoeners, en tegen de hulp van hen die ongerechtigheid werken.", "Jak 5:1-3": "Welaan nu, u rijken, huil en jammer over uw ellenden, die over u komen. Uw rijkdom is verrot, en uw kleren zijn door de motten opgegeten. Uw goud en zilver is verroest; en hun roest zal tegen u getuigen, en zal uw vlees verteren als een vuur. U hebt schatten verzameld in de laatste dagen.", "Lev 26:14": "Maar als u Mij niet zult horen, en al deze geboden niet zult doen;", "2 Petr 2:3-9": "En zij zullen door hebzucht, met gemaakte woorden, van u een koopwaar maken; over hen is het oordeel van lang geleden niet werkeloos, en hun verderf sluimert niet. Want als God de engelen die gezondigd hebben niet gespaard heeft, maar hen in de hel geworpen heeft en overgegeven heeft aan de ketenen van de duisternis, om tot het oordeel bewaard te worden; en de oude wereld niet gespaard heeft, maar Noach, de prediker van de gerechtigheid, met zeven anderen bewaard heeft, toen Hij de zondvloed over de wereld van de goddelozen bracht;", "Spr 7:7-23": "En ik zag onder de eenvoudigen; ik merkte onder de jonge mannen een verstandeloze jongeling; Die voorbijging op de straat, naast haar hoek, en hij trad op de weg naar haar huis. In de schemering, in de avond van de dag, in de zwarte nacht en de donkerheid;", "Pred 5:14": "Zoals hij voortgekomen is uit de buik van zijn moeder, zo zal hij naakt terugkeren, gaande zoals hij gekomen was; en hij zal niets van zijn arbeid meenemen, dat hij met zijn hand zou kunnen wegdragen.", "Joh 8:21": "Jezus zei dan weer tegen hen: Ik ga heen, en u zult Mij zoeken, en in uw zonden zult u sterven; waar Ik heenga, kunt u niet komen.", "Kol 3:25": "Maar wie onrecht doet, zal het onrecht dragen dat hij gedaan heeft; en er is geen aanneming van het persoon.", "Ezech 33:30": "En u, o mensenkind! De kinderen van uw volk spreken voortdurend over u bij de muren en in de deuren van de huizen; en de een spreekt met de ander, ieder met zijn broeder, en zegt: Kom toch en luister wat het woord is dat van de HEERE komt.", "Matt 22:12": "En hij zei tegen hem: Vriend! Hoe bent u hier binnengekomen zonder een bruiloftskleed aan te hebben? En hij verstomde.", "1 Kor 8:3": "Maar als iemand God liefheeft, die is door Hem gekend.", "Ps 23:4": "Al ging ik ook in een dal van de schaduw van de dood, ik zou geen kwaad vrezen, want U bent met mij; Uw stok en Uw staf, die troosten mij.", "Ps 21:11": "U zult hun vrucht van de aarde verdoen, en hun nageslacht van de kinderen der mensen.", "Ps 28:4": "Geef hun naar hun doen, en naar de boosheid van hun handelingen; geef hun naar het werk van hun handen; laat de vergelding voor hen tot hen terugkeren.", "2 Kron 31:2": "En Hizkia stelde de verdelingen van de priesters en de Levieten in, naar hun verdelingen, ieder naar zijn dienst, de priesters en de Levieten voor het brandoffer en voor de dankoffers, om te dienen, en om te loven, en om te prijzen in de poort van de legerplaatsen van de HEERE;", "Spr 14:25": "Een waarachtig getuige redt zielen; maar wie leugens uitwaait, is een bedrieger.", "Ps 26:1": "Een psalm van David. Doe mij recht, HEERE! Want ik wandel in mijn oprechtheid; en ik vertrouw op de HEERE, ik zal niet wankelen.", "Luk 14:17-24": "En hij stuurde zijn dienstknecht op het uur van het avondmaal om tegen de genodigden te zeggen: Kom, want alles is nu klaar. En zij begonnen allen eensgezind zich te verontschuldigen. De eerste zei tegen hem: Ik heb een akker gekocht, en ik moet er wel op uitgaan om die te bekijken; ik vraag u, houd mij voor verontschuldigd. En een ander zei: Ik heb vijf span ossen gekocht, en ik ga erheen om ze te proberen; ik vraag u, houd mij voor verontschuldigd.", "Job 30:31": "Hierom is mijn harp tot een rouwklacht geworden, en mijn orgel tot een stem van hen die wenen.", "2 Kron 21:6": "En hij ging de weg van de koningen van Israël, zoals het huis van Achab deed; want hij had de dochter van Achab tot vrouw; en hij deed wat slecht was in de ogen van de HEERE.", "Rom 2:12-16": "Want zovelen als er zonder wet gezondigd hebben, zullen ook zonder wet verloren gaan; en zovelen als er onder de wet gezondigd hebben, zullen door de wet geoordeeld worden; (Want de hoorders van de wet zijn niet rechtvaardig voor God, maar de daders van de wet zullen gerechtvaardigd worden; Want wanneer de heidenen, die de wet niet hebben, van nature de dingen doen die van de wet zijn, dan zijn dezen, die de wet niet hebben, zichzelf een wet;", "Spr 1:22": "U eenvoudigen! hoe lang zult u de eenvoudigheid liefhebben, en de spotters voor zichzelf de spotternij begeren, en de dwazen wetenschap haten?", "Hebr 2:3": "hoe zullen wij dan ontvluchten, als wij zo'n grote zaligheid veronachtzamen? Deze is eerst door de Heere Zelf verkondigd, en aan ons bevestigd door hen die Hem gehoord hebben;", "Jes 5:11": "Wee hun die zich vroeg in de morgen opmaken om sterke drank na te jagen, en die doorgaan tot in de schemering, totdat de wijn hen verhit heeft!", "Kol 3:5": "Dood dan uw leden die op de aarde zijn: hoererij, onreinheid, schandelijke beweging, kwade begeerlijkheid, en de hebzucht, die afgodendienst is.", "Ps 121:4": "Zie, de Bewaarder van Israël zal niet sluimeren, ook niet slapen.", "Job 20:5": "Dat het gejuich van de goddelozen van dichtbij geweest is², en de vreugde van de huichelaar maar voor een ogenblik?", "Hab 2:4": "Zie, wie zich verheft, zijn ziel is niet oprecht in hem; maar de rechtvaardige zal door zijn geloof leven.", "Ezech 11:2": "En Hij zei tegen mij: Mensenkind, dit zijn de mannen die onrecht bedenken, en die slechte raad geven in deze stad.", "Ezra 3:10": "Toen nu de bouwers de grond van de tempel van de HEERE legden, stelden zij de priesters op, gekleed in hun ambtskleding, met trompetten, en de Levieten, de zonen van Asaf, met cimbalen, om de HEERE te loven, naar de instelling van David, de koning van Israël.", "Joh 8:44": "U bent uit uw vader de duivel, en u wilt de begeerten van uw vader doen; die was een mensenmoordenaar van het begin af aan, en is niet in de waarheid blijven staan, want er is geen waarheid in hem. Wanneer hij de leugen spreekt, spreekt hij uit wat van hemzelf is; want hij is een leugenaar, en de vader daarvan.", "Ps 73:2-28": "Maar wat mij aangaat, mijn voeten waren bijna uitgegleden; mijn schreden waren bijna weggegleden. Want ik was jaloers op de dwazen, toen ik de vrede van de goddelozen zag. Want er zijn geen boeien tot hun dood toe, en hun kracht is fris.", "2 Tim 2:19": "Toch staat het vaste fundament van God, met dit zegel: De Heere kent hen die van Hem zijn; en: Ieder die de Naam van Christus noemt, moet afstand nemen van ongerechtigheid.", "2 Kron 30:6-10": "De boodschappers dan gingen weg met de brieven uit de hand van de koning en zijn leiders, door heel Israël en Juda, en naar het bevel van de koning, en zeiden: Kinderen van Israël, bekeer u tot de HEERE, de God van Abraham, Izak en Israël, dan zal Hij Zich keren naar wie ontkomen waren, die voor u overgebleven zijn uit de hand van de koningen van Assyrië. En wees niet als uw vaders en als uw broeders, die tegen de HEERE, de God van hun vaderen, ontrouw geweest zijn; daarom heeft Hij hen overgegeven tot verwoesting, zoals u ziet. Verhard nu uw nek niet, zoals uw vaders; geef de HEERE de hand, en kom naar Zijn heiligdom, dat Hij geheiligd heeft tot in eeuwigheid, en dien de HEERE, uw God; dan zal de hitte van Zijn toorn van u afkeren.", "Ps 66:7": "Hij heerst eeuwig met Zijn macht; Zijn ogen houden wacht over de heidenvolken; laat de afvalligen niet verhoogd worden. Sela.", "Matt 15:13": "Maar Hij antwoordde en zei: Elke plant die Mijn hemelse Vader niet geplant heeft, zal uitgeroeid worden.", "Jes 10:18": "Ook zal Hij verteren de heerlijkheid van zijn woud en van zijn vruchtbare veld; van de ziel af, tot het vlees toe; en hij zal zijn, zoals wanneer een vaandeldrager versmelt.", "Matt 6:18": "opdat het niet door de mensen gezien wordt dat u vast, maar door uw Vader, Die in het verborgene is; en uw Vader, Die in het verborgene ziet, zal het u in het openbaar vergelden.", "Rom 1:30": "kwaadsprekers, lasteraars, haters van God, smaders, hoogmoedigen, laatdunkende, vinders van kwade dingen, ongehoorzaam aan hun ouders;", "Jes 33:14": "De zondaars in Sion zijn verschrikt; beving heeft de huichelaars aangegrepen; zij zeggen: Wie onder ons kan bij een verterend vuur wonen? Wie onder ons kan bij een eeuwige gloed wonen?", "Jes 26:10": "Wordt de goddeloze genade bewezen, dan leert hij toch geen gerechtigheid; hij doet onrecht in een geheel rechtvaardig land, en hij ziet de hoogheid van de HEERE niet aan.", "Spr 12:9": "Beter is hij die zich gering acht en een knecht heeft, dan hij die zichzelf eert en gebrek heeft aan het brood.", "Matt 10:29": "Worden niet twee musjes voor een penninkje verkocht? En niet één daarvan zal op de aarde vallen zonder uw Vader.", "1 Kron 25:8": "En zij wierpen de loten over de dienst, tegen elkaar, zowel de kleinen als de groten, de meester met de leerling.", "Ezech 16:56": "Ja, uw zuster Sodom is in uw mond niet genoemd geweest, in de dagen van uw grote hoogmoed,", "Dan 11:45": "En hij zal de tenten van zijn paleis planten tussen de zeeën, bij de berg van het heilige sieraad; en hij zal tot zijn einde komen, en zal geen helper hebben.", "Hand 17:31": "Omdat Hij een dag vastgesteld heeft, waarop Hij de aardbodem rechtvaardig zal oordelen, door een Man Die Hij daartoe aangesteld heeft, en Hij heeft daarvan aan allen zekerheid gegeven doordat Hij Hem uit de doden heeft opgewekt.", "Jes 57:4-11": "Over wie maakt u zich vrolijk, tegen wie sperrt u de mond wijd open en steekt u de tong lang uit? Bent u geen kinderen van de overtreding, een nageslacht van de valsheid? U die verhit bent in de eikenbossen, onder elke groene boom; die de kinderen slacht bij de beken, onder de richels van de rotsen? Aan de gladde stenen van de beek is uw deel; die, die zijn uw lot; ook stort u daarover een drankoffer uit, u offert hun een spijsoffer; zou Ik Mij hierover laten troosten?", "2 Tim 3:2": "Want de mensen zullen zijn: liefhebbers van zichzelf, geldgierig, grootsprakerig, hoogmoedig, lasteraars, aan hun ouders ongehoorzaam, ondankbaar, onheilig,", "Job 13:25-27": "Zult U een heen en weer gedreven blad verbrijzelen, en zult U een droge stoppel vervolgen? Want U schrijft bittere dingen tegen mij, en U doet mij de misdaden van mijn jeugd erven. U legt ook mijn voeten in het blok, en let op al mijn paden; U drukt Uzelf in de hielen van mijn voeten,", "2 Kron 25:18": "Maar Joas, de koning van Israël, zond tot Amazia, de koning van Juda, om te zeggen: De distel die op de Libanon is, zond tot de ceder die op de Libanon is, om te zeggen: Geef uw dochter aan mijn zoon tot vrouw; maar het gedierte van het veld, dat op de Libanon is, kwam voorbij, en vertrapte de distel.", "2 Kron 32:19": "En zij spraken over de God van Jeruzalem zoals over de goden van de volken van de aarde, een werk van mensenhanden.", "Mark 3:22": "En de Schriftgeleerden die van Jeruzalem gekomen waren, zeiden: Hij heeft Beëlzebul, en door de leider van de duivels drijft Hij de duivels uit.", "Ps 77:4-10": "Dacht ik aan God, dan maakte ik misbaar; peinsde ik, dan werd mijn ziel overstelpt. Sela. U hield mijn ogen wakend; ik was verslagen, en sprak niet. Ik overdacht de dagen van vroeger, de jaren van eeuwen her.", "Jona 2:6": "Ik was neergedaald tot de bodem van de bergen; de grendels van de aarde waren voor eeuwig om mij heen; maar U hebt mijn leven uit het verderf opgevoerd, o HEERE, mijn God!", "2 Kron 21:20": "Hij was tweeëndertig jaar oud toen hij koning werd, en regeerde acht jaar in Jeruzalem; en hij ging heen zonder dat men hem miste; en zij begroeven hem in de stad van David, maar niet in de graven van de koningen.", "Jer 50:7": "Allen die hen vonden, aten hen op, en hun tegenstanders zeiden: Wij zullen geen schuld hebben; omdat zij gezondigd hebben tegen de HEERE, in de woning van de gerechtigheid, ja, tegen de HEERE, de Verwachting van hun vaderen.", "Jes 5:13": "Daarom zal mijn volk gevankelijk weggevoerd worden, omdat het geen kennis heeft; en zijn heerlijke mannen zullen honger lijden, en zijn menigte zal verdorren van dorst.", "Gen 32:15": "dertig zogende kamelinnen met haar veulens, veertig koeien en tien stieren, twintig ezelinnen en tien jonge ezels.", "Fil 3:19": "Van wie het einde het verderf is, van wie God de buik is, en van wie de heerlijkheid in hun schande is, die aardse dingen bedenken.", "Rom 11:19-21": "U zult dan zeggen: De takken zijn afgebroken, opdat ik ingeënt zou worden. Het is wel; zij zijn door ongeloof afgebroken, en u staat door het geloof. Wees niet hoogmoedig, maar vrees. Want als God de natuurlijke takken niet gespaard heeft, zie toe, dat Hij ook mogelijk u niet spaart.", "Lev 20:5": "dan zal Ik Mijn aangezicht tegen die man en tegen zijn familie richten, en Ik zal hem, en allen die hem naar de Molech achterna hoereren, uit het midden van hun volk uitroeien.", "Dan 12:2": "En velen van hen die in het stof van de aarde slapen, zullen ontwaken, dezen tot eeuwig leven, en anderen tot versmaadheden en tot eeuwige afgrijzing.", "Job 10:2-7": "Ik zal tegen God zeggen: Verdoem mij niet; laat mij weten, waarom U met mij twist. Is het U goed, dat U verdrukt, dat U het werk van Uw handen verwerpt, en over de raad van de goddelozen schijnsel geeft? Hebt U vleselijke ogen, ziet U zoals een mens ziet?", "Ruth 1:21": "Vol trok ik weg, maar leeg heeft de HEERE mij laten terugkeren; waarom zouden jullie mij Naomi noemen, terwijl de HEERE tegen mij getuigt, en de Almachtige mij kwaad heeft aangedaan?", "Ezech 20:49": "En ik zei: Ach, Heere HEERE, zij zeggen van mij: Spreekt hij niet in gelijkenissen?", "Zef 3:11": "Op die dag zult u niet beschaamd zijn vanwege al uw handelingen, waarmee u tegen Mij overtreden hebt; want dan zal Ik uit uw midden wegnemen wie van vreugde opspringen over uw hoogmoed, en u zult zich voortaan niet meer verheffen om Mijn heilige berg.", "Jes 26:7": "Het pad van de rechtvaardige is geheel effen, de gang van de rechtvaardige weegt U recht.", "Hos 5:4-6": "Zij richten hun daden niet zo in dat zij zich tot hun God bekeren; want de geest van de hoererijen is in hun midden, en de Heere kennen zij niet. Daarom zal Israël hoogmoed in zijn gezicht getuigen; en Israël en Efraïm zullen vallen door hun ongerechtigheid; ook Juda zal met hen vallen. Met hun schapen en met hun runderen zullen zij dan gaan om de Heere te zoeken, maar niet vinden; Hij heeft Zich van hen teruggetrokken.", "2 Petr 3:16": "Zoals hij ook in alle brieven doet, wanneer hij daarin over deze dingen spreekt; waarin sommige dingen moeilijk te begrijpen zijn, die de onkundige en onstandvastige mensen verdraaien, zoals ook de andere Schriften, tot hun eigen verderf.", "1 Kor 14:15": "Wat is het dan? Ik zal wel met de geest bidden, maar ik zal ook met het verstand bidden; ik zal wel met de geest zingen, maar ik zal ook met het verstand zingen.", "Pred 2:14-18": "De ogen van de wijze staan in zijn hoofd, maar de dwaas wandelt in de duisternis. Toen merkte ik ook op dat één en hetzelfde lot hun allen treft. Daarom zei ik in mijn hart: Zoals het de dwaas vergaat, zal het ook mij vergaan; waarom heb ik dan toen meer naar wijsheid gestreefd? Toen sprak ik in mijn hart, dat ook dat ijdelheid was. Want er zal in eeuwigheid niet meer herinnering aan een wijze zijn dan aan een dwaas; aangezien wat nu is, in de toekomstige dagen helemaal vergeten wordt; en hoe sterft de wijze? Net als de dwaas.", "Spr 29:16": "Als de goddelozen talrijk worden, wordt de overtreding groot; maar de rechtvaardigen zullen hun val aanschouwen.", "Matt 25:46": "En dezen zullen weggaan in de eeuwige pijn; maar de rechtvaardigen in het eeuwige leven.", "1 Petr 4:17": "Want het is de tijd dat het oordeel moet beginnen bij het huis van God; en als het eerst bij ons begint, wat zal dan het einde zijn van hen die het Evangelie van God ongehoorzaam zijn?", "Joz 24:19": "Toen zei Jozua tegen het volk: U zult de HEERE niet kunnen dienen, want Hij is een heilig God; Hij is een na-ijverig God; Hij zal uw overtredingen en uw zonden niet vergeven.", "Ezech 26:13": "Zo zal Ik het gedreun van uw liederen doen ophouden, en het geschal van uw harpen zal niet meer gehoord worden.", "Jes 28:17": "En Ik zal het oordeel stellen naar het richtsnoer, en de gerechtigheid naar het paslood; en de hagel zal de toevlucht van de leugen wegvagen, en het water zal de schuilplaats overstromen.", "Joh 12:43": "Want zij hadden de eer van mensen lief, meer dan de eer van God.", "Pred 5:7": "Als u de onderdrukking van de arme, en de beroving van het recht en de gerechtigheid ziet in een landstreek, verwonder u dan niet over zo'n gang van zaken; want wie hoger is dan de hoge, let daarop; en er zijn hogeren boven hen.", "Jes 29:15": "Wee hun die zich diep willen verbergen voor de HEERE, hun raad verbergend; en wier werken in duisternis gebeuren, en zij zeggen: Wie ziet ons, en wie kent ons?", "Lev 19:16": "U zult niet rondgaan als een kwaadspreker onder uw volken; u zult niet opstaan tegen het bloed van uw naaste; Ik ben de HEERE!", "Ps 98:3": "Hij is gedachtig geweest aan Zijn goedertierenheid en Zijn waarheid aan het huis van Israël; en alle einden van de aarde hebben het heil van onze God gezien.", "Ps 37:9": "Want de boosdoeners zullen uitgeroeid worden, maar wie de HEERE verwachten, die zullen de aarde erfelijk bezitten.", "Tit 3:3": "Want ook wij waren vroeger onverstandig, ongehoorzaam, dwalend, en dienden aan allerlei begeerten en genoegens; wij leefden in slechtheid en afgunst, waren hatelijk en haatten elkaar.", "Spr 1:25": "En u al Mijn raad verworpen hebt, en Mijn bestraffing niet gewild hebt;", "Pred 8:8": "Er is geen mens die macht heeft over de geest, om de geest tegen te houden; en hij heeft geen macht over de dag van de dood; er is ook geen vrijstelling in die strijd; en de goddeloosheid zal haar meesters niet redden.", "Matt 23:14": "Wee u, Schriftgeleerden en Farizeeën, huichelaars, want u eet de huizen van de weduwen op, en dat onder de schijn van lang te bidden; daarom zult u des te zwaarder oordeel ontvangen.", "Jes 57:20": "Maar de goddelozen zijn als een voortgejaagde zee, want die kan niet tot rust komen, en haar water werpt slijk en modder op.", "1 Kon 21:20": "En Achab zei tegen Elia: Hebt u mij gevonden, o mijn vijand? En hij zei: Ik heb u gevonden, omdat u uzelf verkocht hebt om te doen wat kwaad is in de ogen van de HEERE.", "Rom 8:13": "Want als u naar het vlees leeft, zult u sterven; maar als u door de Geest de daden van het lichaam doodt, zult u leven.", "Jes 14:15": "Ja, in het rijk van de dood zult u neergestoten worden, aan de zijden van de kuil!", "1 Kron 15:13": "Want omdat u dit de eerste keer niet deed, heeft de HEERE, onze God, onder ons een scheur gemaakt, omdat wij Hem niet gezocht hebben naar het recht.", "Job 9:35": "Dan zal ik spreken en Hem niet vrezen; want zo ben ik niet bij mijzelf.", "Ps 79:6": "Stort Uw grimmigheid uit over de heidenen, die U niet kennen, en over de koninkrijken, die Uw Naam niet aanroepen.", "Spr 21:24": "Wie een hovaardige pocher is, zijn naam is spotter; hij gaat met hovaardige verbolgenheid te werk.", "Gen 5:3": "En Adam leefde honderdendertig jaren, en verwekte een zoon naar zijn gelijkenis, naar zijn evenbeeld, en noemde zijn naam Seth.", "Spr 28:26": "Wie op zijn eigen hart vertrouwt, die is een dwaas; maar wie in wijsheid wandelt, die zal ontkomen.", "Job 37:24": "Daarom vrezen de mensen Hem; Hij ziet geen enkele wijze van hart aan.", "Spr 10:21": "De lippen van de rechtvaardige voeden er velen; maar de dwazen sterven door gebrek aan verstand.", "Ezech 5:8-17": "Daarom zegt de Heere HEERE zo: Zie, Ik wil tegen u, ja Ik, want Ik zal gerichten in het midden van u oefenen, voor de ogen van die heidenvolken. En Ik zal onder u doen, wat Ik niet gedaan heb, en zoals Ik voortaan niet meer doen zal, vanwege al uw gruwelen. Daarom zullen de vaders de kinderen eten in het midden van u, en de kinderen zullen hun vaders eten; en Ik zal gerichten onder u oefenen, en al uw overblijfsel zal Ik naar alle windrichtingen verstrooien.", "Job 20:8": "Hij zal wegvluchten als een droom, zodat men hem niet vinden zal, en hij zal verjaagd worden als een visioen in de nacht.", "Ps 94:10": "Zou Hij, Die de heidenen tuchtigt, niet straffen, Hij, Die de mens wetenschap leert?", "Jona 2:3": "Want U had mij geworpen in de diepte, in het hart van de zeeën, en de stroom omving mij; al Uw baren en Uw golven gingen over mij heen.", "Luk 20:18": "Ieder die op die steen valt, zal verpletterd worden, en op wie hij valt, die zal hij vermorzelen.", "1 Kron 6:31": "Dezen nu zijn het die David heeft aangesteld voor het ambt van het gezang in het huis van de HEERE, nadat de ark tot rust was gekomen.", "Jes 47:8": "Nu dan, hoor dit, weelderige! Die zo zeker woont, die in haar hart zegt: Ik ben het, en niemand meer dan ik: ik zal geen weduwe zitten, en de beroving van kinderen niet kennen.", "Micha 4:12": "Maar zij kennen de gedachten van de HEERE niet, en begrijpen Zijn raadsbesluit niet; dat Hij hen bijeengebracht heeft als schoven op de dorsvloer.", "Hos 12:15": "Efraïm daarentegen heeft Hem zeer bitter vertoornd; daarom zal Hij zijn bloed op hem laten komen, en zijn Heere zal hem zijn smaad vergelden.", "Spr 15:25": "Het huis van de hoogmoedigen zal de HEERE afbreken; maar het gebied van de weduwe zal Hij vastzetten.", "Ps 116:11": "Ik zei in mijn haast: Alle mensen zijn leugenaars.", "1 Petr 1:2": "de uitverkorenen naar de voorkennis van God de Vader, in de heiligmaking van de Geest, tot gehoorzaamheid en besprenging met het bloed van Jezus Christus; genade en vrede worde u vermenigvuldigd.", "Ps 87:7": "En de zangers, evenals de speellieden, alsook al mijn bronnen, zullen binnen u zijn.", "1 Kron 16:42": "Met hen dan waren Heman en Jeduthun, met trompetten en cimbalen voor hen die zich lieten horen, en met instrumenten van de muziek van God; maar de zonen van Jeduthun waren aan de poort.", "Jer 5:21": "Hoor nu dit, dwaas en harteloos volk! die ogen hebben, maar niet zien, die oren hebben, maar niet horen.", "Jer 16:10": "En het zal gebeuren, als u dit volk al deze woorden aanzegt, en zij tegen u zeggen: Waarom spreekt de HEERE al dit grote kwaad over ons, en wat is onze misdaad, en wat is onze zonde, die wij tegen de HEERE, onze God, gezondigd hebben?", "Rom 2:5-16": "Maar naar uw hardheid en onbekeerlijk hart, verzamelt u voor uzelf toorn als een schat, voor de dag van de toorn en de openbaring van het rechtvaardig oordeel van God. Die ieder zal vergelden naar zijn werken: Hun die volhardend goeddoen en heerlijkheid, en eer, en onvergankelijkheid zoeken, het eeuwige leven;", "Jer 2:8": "De priesters zeiden niet: Waar is de HEERE? en die de wet hanteerden, kenden Mij niet; en de herders overtraden tegen Mij; en de profeten profeteerden door Baäl, en wandelden naar dingen die geen nut doen.", "1 Kron 22:3": "En David bereidde ijzer in overvloed, voor de nagelen aan de deuren van de poorten en voor de verbindingen; ook koper in overvloed, zonder gewicht;", "Spr 30:7-9": "Twee dingen heb ik van U gevraagd, onthoud ze mij niet, voordat ik sterf; Ijdelheid en leugentaal, doe die ver van mij; armoede of rijkdom, geef mij niet; voed mij met het brood dat mij toebedeeld is; Opdat ik, als ik verzadigd ben, U dan niet verloochent, en zeg: Wie is de HEERE? of dat ik, als ik arm geworden ben, dan niet steel, en de Naam van mijn God aantast.", "Jes 43:22": "Doch u hebt Mij niet aangeroepen, o Jakob! toen u zich tegen Mij vermoeid hebt, o Israël!", "Joh 6:60": "Velen van Zijn discipelen dan zeiden, toen zij dit hoorden: Dit is een harde uitspraak; wie kan dat aanhoren?", "Jer 50:29": "Laat u horen tegen Babel, u schutters! U allen die de boog spant! Leger u tegen haar rondom, laat niemand van hen ontkomen; vergeld haar naar haar werk, doe haar naar alles wat zij gedaan heeft; want zij heeft trots gehandeld tegen de HEERE, tegen de Heilige van Israël.", "Dan 7:10": "Een vurige rivier vloeide, en ging voor Hem uit, duizendmaal duizenden dienden Hem, en tien duizendmaal tien duizenden stonden voor Hem; het gericht zette zich, en de boeken werden geopend.", "Job 16:11": "God heeft mij overgegeven aan de verkeerde, en heeft mij overgeleverd in de handen van de goddelozen.", "Ps 10:15": "Breek de arm van de goddeloze en de bozen; zoek zijn goddeloosheid, totdat U haar niet meer vindt.", "1 Tim 6:7": "Want wij hebben niets in de wereld meegebracht, het is duidelijk dat wij er ook niets uit kunnen meedragen.", "Joh 3:4": "Nicodemus zei tegen Hem: Hoe kan een mens geboren worden als hij al oud is? Kan hij soms voor de tweede keer in de buik van zijn moeder ingaan en geboren worden?", "Spr 21:6": "Te arbeiden om schatten met een valse tong, is een voortgedreven ijdelheid van hen die de dood zoeken.", "Job 42:2": "Ik weet, dat U alles vermag, en dat geen van Uw gedachten kan afgesneden worden.", "1 Tim 4:2": "door de huichelarij van leugensprekers, die hun eigen geweten als met een brandijzer hebben dichtgeschroeid;", "Jes 6:9": "Toen zei Hij: Ga heen, en zeg tegen dit volk: Blijf horen, maar begrijp het niet, en blijf zien, maar merk het niet op.", "Hebr 6:2": "van de leer van de dopen, en van de handoplegging, en van de opstanding van de doden, en van het eeuwige oordeel.", "Hos 7:13": "Wee hen, want zij zijn van Mij afgezworven; verwoesting over hen, want zij hebben tegen Mij overtreden! Ik zou hen wel verlossen, maar zij spreken leugens tegen Mij.", "Openb 16:2-21": "En de eerste ging heen, en goot zijn schaal uit op de aarde; en er kwam een kwaad en boosaardig gezwel aan de mensen, die het merkteken van het beest hadden, en die zijn beeld aanbaden. En de tweede engel goot zijn schaal uit in de zee, en zij werd bloed als van een dode; en elke levende ziel in de zee stierf. En de derde engel goot zijn schaal uit in de rivieren en in de bronnen van het water; en het water werd bloed.", "Job 24:1": "Waarom zouden voor de Almachtige de tijden niet verborgen zijn, terwijl zij die Hem kennen Zijn dagen niet zien?", "Hab 1:11": "Dan zal hij van geest veranderen, en hij zal doortrekken, en zich schuldig maken, terwijl hij deze zijn kracht aan zijn god toeschrijft.", "Joh 16:24": "Tot nu toe hebt u niets gebeden in Mijn Naam; bid, en u zult ontvangen, opdat uw blijdschap volkomen is.", "Jes 28:13": "Zo zal het woord van de HEERE voor hen zijn: gebod op gebod, gebod op gebod, regel op regel, regel op regel, hier een weinig, daar een weinig; opdat zij heengaan, en achterwaarts vallen, en gebroken, en verstrikt en gevangen worden.", "Ps 5:6": "De onzinnigen zullen voor Uw ogen niet bestaan; U haat alle werkers van de ongerechtigheid.", "Hebr 12:23": "Tot de algemene vergadering en de gemeente van de eerstgeborenen, die in de hemelen opgeschreven zijn, en tot God, de Rechter over allen, en de geesten van de rechtvaardigen die volmaakt gemaakt zijn;", "Rom 3:5": "Als nu onze ongerechtigheid de gerechtigheid van God bevestigt, wat zullen wij zeggen? Is God onrechtvaardig, als Hij toorn over ons brengt? (Ik spreek naar de mens.)", "2 Kron 23:13": "En zij keek toe; en zie, de koning stond bij zijn pilaar, bij de ingang; en de leiders en de trompetten waren bij de koning; en heel het volk van het land was blij, en blies op de trompetten; en de zangers waren er met muzikale instrumenten, en gaven aanwijzingen om lof te zingen; toen scheurde Athalia haar kleren, en riep: Verraad, verraad!", "Ezra 3:11": "En zij zongen bij beurten, om de HEERE te loven en te danken, omdat Hij goed is en Zijn goedertierenheid tot in eeuwigheid is over Israël. En heel het volk juichte met groot gejuich, toen men de HEERE loofde vanwege de grondlegging van het huis van de HEERE.", "1 Sam 2:6": "De HEERE doodt en maakt levend; Hij doet naar het graf neerdalen, en Hij doet weer opkomen.", "Joh 8:27": "Zij begrepen niet dat Hij tot hen over de Vader sprak.", "Num 14:33": "En uw kinderen zullen als herders rondtrekken in deze woestijn, veertig jaar, en zullen uw hoererijen dragen, totdat uw dode lichamen verteerd zijn in deze woestijn.", "Hab 1:2": "HEERE! Hoe lang schreeuw ik, en U hoort niet, hoe lang roep ik: Geweld! tot U, en U verlost niet!", "Hand 5:3-10": "En Petrus zei: Ananias, waarom heeft de satan uw hart vervuld, dat u de Heilige Geest zou liegen, en onttrekken van de prijs van het land? Zolang het bleef, bleef het niet uw eigendom? En verkocht zijnde, was het niet in uw macht? Wat is het, dat u deze daad in uw hart hebt voorgenomen? U hebt niet mensen gelogen, maar God. En Ananias, deze woorden horend, viel neer en gaf de geest. En er kwam grote vrees over allen die dit hoorden.", "Nahum 1:3": "De HEERE is geduldig, maar van grote kracht, en Hij houdt de schuldige zeker niet onschuldig. De weg van de HEERE is in wervelwind en in storm, en de wolken zijn het stof van Zijn voeten.", "Job 31:5": "Als ik met ijdelheid omgegaan heb, en mijn voet gesneld heeft tot bedriegerij;", "Job 35:3": "Want u hebt gezegd: Wat zou het u baten? Wat voor meer voordeel zal ik daarmee doen, dan met mijn zonde?", "2 Kor 1:9": "Ja, wij hadden zelf al in onszelf het vonnis van de dood, opdat wij niet op onszelf zouden vertrouwen, maar op God, Die de doden opwekt;", "1 Kor 3:13": "Ieders werk zal openbaar worden; want de dag zal het aan het licht brengen, omdat het door vuur ontdekt wordt; en hoedanig ieders werk is, zal het vuur beproeven.", "Ex 15:21": "Toen antwoordde Mirjam hun: Zingt de HEERE; want Hij is hoog verheven! Hij heeft het paard met zijn ruiter in de zee gestort!", "1 Sam 21:11": "Doch de knechten van Achis zeiden tegen hem: Is dit niet David, de koning van het land? Zong men niet van hem in de reidansen, en zei: Saul heeft zijn duizenden verslagen, maar David zijn tienduizenden?", "1 Joh 3:14": "Wij weten dat wij overgegaan zijn uit de dood in het leven, omdat wij de broeders liefhebben; wie zijn broeder niet liefheeft, blijft in de dood.", "Hand 2:23": "Deze, door de bepaalde raad en voorkennis van God overgegeven, hebt u genomen en door de handen van onrechtvaardigen aan het kruis gehecht en gedood;", "Job 8:22": "Wie u haten, zullen met schaamte bekleed worden; en de tent van de goddelozen zal er niet meer zijn.", "Ps 68:3": "U zult hen verdrijven, zoals rook verdreven wordt; zoals was voor het vuur smelt, zullen de goddelozen vergaan van Gods aangezicht.", "Ps 5:7": "U zult de leugensprekers verdoen; van de man van het bloed en van het bedrog heeft de HEERE een gruwel.", "Luk 13:24-29": "Strijd om binnen te gaan door de nauwe poort; want velen, zeg Ik u, zullen zoeken binnen te gaan en zullen dat niet kunnen; namelijk nadat de heer des huizes zal zijn opgestaan en de deur zal hebben gesloten, en u buiten zult beginnen te staan en op de deur te kloppen, en zult zeggen: Heere, Heere, doe ons open! en Hij zal antwoorden en tegen u zeggen: Ik weet niet waar u vandaan komt. Dan zult u beginnen te zeggen: Wij hebben in Uw bijzijn gegeten en gedronken, en U hebt op onze straten onderwijs gegeven.", "Openb 14:10": "die zal ook drinken uit de wijn van de toorn van God, die onvermengd ingeschonken is in de drinkbeker van Zijn toorn; en hij zal gepijnigd worden met vuur en zwavel voor de heilige engelen en voor het Lam.", "Job 34:16-19": "Zo er dan verstand bij u is, hoor dit; neig de oren tot de stem van mijn woorden. Zou Hij ook, Die het recht haat, de gewonde verbinden, en zou u de zeer Rechtvaardige veroordelen? Zou men tot een koning zeggen: U bent Belial; tot de vorsten: U bent goddelozen!", "Luk 12:16-21": "En Hij vertelde hun een gelijkenis: Het land van een rijke man had veel opgebracht; en hij overlegde bij zichzelf en zei: Wat zal ik doen, want ik heb geen plaats waar ik mijn vruchten kan verzamelen. En hij zei: Dit zal ik doen: ik zal mijn schuren afbreken en grotere bouwen, en daar zal ik al mijn koren en mijn goederen verzamelen;", "Ps 68:5": "Zingt voor God, zingt psalmen voor Zijn Naam; hoogt de wegen voor Hem, Die in de vlakke velden rijdt, omdat Zijn Naam is HEERE; en springt op van vreugde voor Zijn aangezicht.", "Richt 9:56": "Zo liet God het kwaad van Abimelech, dat hij aan zijn vader gedaan had door zijn zeventig broers te doden, op hem terugkomen.", "Job 9:34": "Laat Hij Zijn roede van op mij wegdoen, en laat Zijn verschrikking mij niet angstig maken;", "Jer 2:13": "Want Mijn volk heeft twee boosheden gedaan; Mij, de Springader van het levende water, hebben zij verlaten, om zichzelf bakken uit te houwen, gebroken bakken, die geen water houden.", "Ezech 22:21": "Ja, Ik zal u bijeenbrengen, en op u blazen in het vuur van Mijn verbolgenheid, zodat u in het midden ervan zult smelten.", "Matt 18:1-4": "Op datzelfde moment kwamen de discipelen naar Jezus en zeiden: Wie is toch de belangrijkste in het Koninkrijk der hemelen? En Jezus riep een kind bij Zich en zette het in hun midden, en zei: Voorwaar, Ik zeg u: als u zich niet verandert en wordt zoals de kinderen, zult u het Koninkrijk der hemelen beslist niet ingaan.", "Deut 31:21": "En het zal gebeuren, wanneer veel kwaad en benauwdheden hen zullen treffen, dan zal dit lied voor hun aangezicht antwoorden tot getuige; want het zal uit de mond van hun nageslacht niet vergeten worden; omdat Ik hun gedachten ken, die het nu al maakt, voordat Ik het breng in het land dat Ik gezworen heb.", "3 Joh 1:1": "De ouderling aan de geliefde Gajus, die ik in waarheid liefheb.", "Ps 120:2-4": "O HEERE! Red mijn ziel van de valse lippen, van de bedrieglijke tong. Wat zal U de bedrieglijke tong geven, of wat zal zij U toevoegen? Scherpe pijlen van een machtige, alsook gloeiende jeneverkolen.", "Richt 11:34": "Toen Jeftha nu bij Mizpa bij zijn huis kwam, zie, zo kwam zijn dochter hem tegemoet, met trommels en met reidansen. Zij was zijn enige kind; hij had verder geen zoon of dochter.", "Ex 15:7": "En door Uw grote hoogheid hebt U hen die tegen U opstonden, omgeworpen; U hebt Uw brandende toorn losgelaten, die hen verteerd heeft als een stoppel.", "Openb 9:15": "En de vier engelen zijn losgemaakt, die gereed waren gehouden tegen het uur, en dag, en maand, en jaar, opdat zij het derde deel van de mensen zouden doden.", "Spr 27:2": "Laat een vreemde u prijzen, en niet uw mond; een onbekende, en niet uw lippen.", "Ps 7:9": "De HEERE zal de volken recht doen; doe mij recht, HEERE, naar mijn gerechtigheid, en naar mijn oprechtheid, die bij mij is.", "Ps 49:11-16": "Want hij ziet dat de wijzen sterven, dat samen een dwaas en een onverstandig mens omkomen, en hun bezit aan anderen nalaten. Hun diepste gedachte is dat hun huizen er voor eeuwig zullen zijn, hun woningen van geslacht tot geslacht; zij noemen de landen naar hun namen. De mens echter, die in aanzien is, blijft niet; hij wordt gelijk aan de dieren, die vergaan.", "Job 13:3": "Maar ik wil tot de Almachtige spreken, en ik ben erop belust mij te verdedigen voor God.", "Jes 42:18-20": "Hoort, u doven! En kijkt toe, u blinden, om te zien. Wie is er blind als Mijn knecht, en doof, zoals Mijn bode, die Ik zend? Wie is blind, zoals de volmaakte, en blind, zoals de knecht van de HEERE? U ziet wel veel dingen, maar u bewaart ze niet; en al doet hij de oren open, toch hoort hij niet.", "2 Kor 5:10": "Want wij moeten allen geopenbaard worden voor de rechterstoel van Christus, opdat ieder ontvangt wat door het lichaam gedaan is, naarmate hij gedaan heeft, hetzij goed, hetzij kwaad.", "Dan 3:4": "En een heraut riep met kracht: Men zegt u aan, u volken, u naties en tongen!", "Luk 11:32": "De mannen van Ninevé zullen opstaan in het oordeel samen met dit geslacht, en het veroordelen; want zij hebben zich bekeerd op de prediking van Jona; en zie, meer dan Jona is hier!", "Amos 9:2-4": "Al groeven zij tot in het graf, dan zal Mijn hand ze vandaar halen, en al klommen zij in de hemel, dan zal Ik ze vandaar doen neerdalen. En al verstopten zij zich op de top van de Karmel, dan zal Ik ze opsporen en vandaar halen; en al verborgen zij zich voor Mijn ogen op de bodem van de zee, dan zal Ik vandaar de slang gebieden, die zal ze bijten. En al gingen zij in gevangenschap voor het aangezicht van hun vijanden, dan zal Ik vandaar het zwaard gebieden, dat het hen doodt; en Ik zal Mijn oog tegen hen richten ten kwade, en niet ten goede.", "Jer 50:36": "Het zwaard zal zijn over de leugenaars, zodat zij dwaas worden; het zwaard zal zijn over haar helden, zodat zij versagen;", "2 Kor 4:4": "In hen heeft de god van deze eeuw de zinnen verblind, namelijk van de ongelovigen, opdat hen niet zou bestralen de verlichting van het Evangelie van de heerlijkheid van Christus, Die het Beeld van God is.", "Deut 8:17-20": "En u in uw hart zegt: Mijn kracht, en de sterkte van mijn hand heeft mij dit vermogen verworven. Maar u zult denken aan de HEERE, uw God, dat Hij het is die u kracht geeft om vermogen te verwerven; opdat Hij Zijn verbond bevestigt, dat Hij aan uw vaderen gezworen heeft, zoals het op deze dag is. Maar als het gebeurt, dat u de HEERE, uw God, helemaal vergeet, en andere goden navolgt, en hen dient, en u voor hen buigt, dan verklaar ik vandaag tegen u, dat u zeker zult omkomen.", "Ezech 4:17": "Opdat zij gebrek hebben aan brood en water, en de een met de ander verbaasd worden, en in hun ongerechtigheid wegkwijnen.", "2 Petr 3:7": "Maar de hemelen die er nu zijn, en de aarde, zijn door datzelfde woord als een schat weggelegd, en worden voor het vuur bewaard tegen de dag van het oordeel en van het verderf van de goddeloze mensen.", "1 Joh 2:4": "Wie zegt: Ik ken Hem, en Zijn geboden niet bewaart, die is een leugenaar, en in hem is de waarheid niet;", "Spr 17:16": "Waarom toch zou de dwaas geld in zijn hand hebben, om wijsheid te kopen, terwijl hij geen verstand heeft?", "Gen 18:21": "Zal Ik nu afgaan en zien of zij naar hun geroep, dat tot Mij gekomen is, het uiterste gedaan hebben, en zo niet, Ik zal het weten.", "Spr 10:6-8": "Zegeningen zijn op het hoofd van de rechtvaardige; maar het geweld bedekt de mond van de goddelozen. De gedachtenis aan de rechtvaardige zal tot zegening zijn; maar de naam van de goddelozen zal wegrotten. Wie wijs van hart is, neemt de geboden aan; maar wie dwaas is van lippen, zal ten val komen.", "Hand 2:13": "En anderen zeiden spottend: Zij zijn vol zoete wijn.", "Jes 47:4-10": "Onze Verlossers Naam is HEERE van de heerscharen, de Heilige van Israël. Zit zwijgend, en ga in de duisternis, dochter van de Chaldeeën! Want u zult niet meer genoemd worden koningin van de koninkrijken. Ik was op Mijn volk zeer toornig, Ik ontheiligde Mijn erfdeel, en Ik gaf hen over in uw hand; toch bewees u hun geen barmhartigheid, ja, zelfs over de oude maakte u uw juk zeer zwaar.", "Ps 10:5": "Zijn wegen brengen altijd smart voort; Uw oordelen zijn een hoogte, ver van hem vandaan; al zijn tegenstanders, die blaast hij weg.", "Joh 1:10": "Hij was in de wereld, en de wereld is door Hem gemaakt; en de wereld heeft Hem niet gekend.", "Jer 5:5": "Ik zal naar de groten gaan, en met hen spreken, want die kennen de weg van de HEERE, het recht van hun God; maar zij hadden samen het juk verbroken, en de banden verscheurd.", "1 Kor 5:5": "Hem over te geven aan de satan, tot verderf van het vlees, opdat de geest behouden mag worden op de dag van de Heere Jezus.", "Jer 9:6": "Uw woning is in het midden van bedrog; door bedrog weigeren zij Mij te kennen, spreekt de HEERE.", "Jes 6:10": "Maak het hart van dit volk vet, en maak hun oren zwaar, en sluit hun ogen, opdat het niet ziet met zijn ogen, of met zijn oren hoort, of met zijn hart begrijpt, of zich bekeert, en Hij het geneest.", "Jes 36:18": "Laat Hizkia u niet verleiden, door te zeggen: De HEERE zal ons redden; hebben de goden van de volken, ieder zijn eigen land, gered uit de hand van de koning van Assyrië?", "Job 10:1": "Mijn ziel is de dood moe, wat mijn leven betreft; ik zal mijn klacht over mijzelf de vrije loop laten; ik zal spreken in de bitterheid van mijn ziel.", "Ps 49:15": "Men zet hen als schapen in het graf, de dood zal hen afweiden; en de oprechten zullen over hen heersen in die morgenstond; en het graf zal hun gedaante verslijten, elk uit zijn woning.", "Ps 119:118": "U vertreedt allen, die van Uw inzettingen afdwalen, want hun bedrog is leugen.", "Matt 16:25": "Want wie zijn leven zal willen behouden, die zal het verliezen; maar wie zijn leven zal verliezen om Mijnentwil, die zal het vinden.", "Ps 68:7": "Een God, Die de eenzamen zet in een gezin, uitleidt wie in boeien gevangen zitten; maar de afvalligen wonen in het dorre land.", "Deut 28:11": "En de HEERE zal u laten overvloeien in het goede, in de vrucht van uw schoot, en in de vrucht van uw vee, en in de vrucht van uw land; in het land dat de HEERE uw vaderen gezworen heeft u te zullen geven.", "Judas 1:13": "Wilde golven van de zee, die hun eigen schande opschuimen; dwalende sterren, aan wie de zwartste duisternis voor eeuwig bewaard wordt.", "Rom 11:22": "Zie dan de goedertierenheid en de strengheid van God; de strengheid wel over hen die gevallen zijn, maar de goedertierenheid over u, als u in de goedertierenheid blijft; anders zult ook u afgehouwen worden.", "Dan 11:37": "En op de goden van zijn vaderen zal hij geen acht geven, noch op de begeerte van de vrouwen; hij zal ook op geen God acht geven, maar hij zal zich boven alles groot maken.", "Jer 48:15": "Moab is verwoest, en uit zijn steden opgetrokken, en de keur van zijn jongemannen is ter slachting afgegaan, spreekt de Koning, Wiens Naam is HEERE van de heerscharen.", "Lev 26:19": "Want Ik zal de hoogmoed van uw kracht verbreken, en zal uw hemel als ijzer maken, en uw aarde als koper.", "Ezech 18:20-28": "De ziel die zondigt, die zal sterven; de zoon zal niet dragen de ongerechtigheid van de vader, en de vader zal niet dragen de ongerechtigheid van de zoon; de gerechtigheid van de rechtvaardige zal op hem zijn, en de goddeloosheid van de goddeloze zal op hem zijn. Maar wanneer de goddeloze zich bekeert van al zijn zonden, die hij gedaan heeft, en al Mijn inzettingen onderhoudt, en recht en gerechtigheid doet, hij zal zeker leven, hij zal niet sterven. Al zijn overtredingen, die hij gedaan heeft, zullen hem niet aangerekend worden; door zijn gerechtigheid, die hij gedaan heeft, zal hij leven.", "Dan 8:10": "En hij werd groot tot aan het leger van de hemel; en hij wierp sommigen van dat leger, namelijk van de sterren, neer ter aarde, en vertrapte ze.", "2 Kron 23:18": "Jojada nu stelde de diensten van het huis van de HEERE aan, onder leiding van de Levitische priesters, die David in het huis van de HEERE ingedeeld had, om de brandoffers van de HEERE te offeren, zoals in de wet van Mozes geschreven staat, met blijdschap en met gezang, naar de instelling van David.", "Matt 25:8": "En de dwazen zeiden tegen de wijzen: Geef ons van uw olie, want onze lampen gaan uit.", "Luk 9:46-48": "En er ontstond onder hen een discussie over wie van hen de belangrijkste zou zijn. Maar Jezus, die de gedachte van hun hart zag, nam een kind en zette dat naast Zich, en zei tegen hen: Wie dit kind ontvangt in Mijn Naam, ontvangt Mij; en wie Mij ontvangt, ontvangt Hem Die Mij gezonden heeft. Want wie de minste is onder u allen, die zal groot zijn.", "Ezech 33:17-20": "Toch zeggen de kinderen van uw volk: De weg van de Heere is niet recht; terwijl het toch hun eigen weg is die niet recht is. Als de rechtvaardige afwijkt van zijn gerechtigheid en onrecht doet, zal hij daarin sterven. En als de goddeloze zich bekeert van zijn goddeloosheid, en recht en gerechtigheid doet, zal hij daardoor leven.", "Pred 7:1": "Beter is een goede naam dan goede olie, en de dag van de dood dan de dag dat iemand geboren wordt.", "Hos 10:10": "Het is Mijn wens, dat Ik hen zal tuchtigen; en volken zullen tegen hen verzameld worden, wanneer Ik hen bind in hun twee voren.", "Rom 11:33": "O diepte van de rijkdom, én van de wijsheid én van de kennis van God, hoe ondoorzoekelijk zijn Zijn oordelen, en onnaspeurlijk Zijn wegen!", "Mal 1:13": "Verder zegt u: Zie, wat een vermoeidheid! maar u zou het kunnen wegblazen, zegt de HEERE van de heerscharen; u brengt ook wat geroofd is, en wat kreupel en krank is; u brengt ook spijsoffer; zou Mij dat aangenaam zijn van uw hand? zegt de HEERE.", "Dan 9:14": "Daarom heeft de HEERE over het kwade gewaakt, en Hij heeft het over ons gebracht; want de HEERE, onze God, is rechtvaardig in al Zijn werken die Hij gedaan heeft, omdat wij Zijn stem niet gehoorzaamden.", "Kol 3:16": "Laat het woord van Christus rijkelijk in u wonen, in alle wijsheid; leer en vermaan elkaar met psalmen en lofzangen en geestelijke liederen, en zing voor de Heere met aangenaamheid in uw hart.", "Jes 24:18": "En het zal gebeuren: wie voor het geluid van de angst vlucht, die zal in de kuil vallen; en wie uit de kuil opklimt, die zal in de strik gevangen worden; want de sluizen in de hoogte zijn opengedaan, en de fundamenten van de aarde zullen beven.", "Joh 3:36": "Wie in de Zoon gelooft, heeft het eeuwige leven; maar wie de Zoon ongehoorzaam is, zal het leven niet zien, maar de toorn van God blijft op hem.", "1 Kor 10:12": "Wie dan meent te staan, laat hij toezien dat hij niet valt.", "Ps 50:3-6": "Onze God zal komen en zal niet zwijgen; een vuur voor Zijn aangezicht zal verteren, en rondom Hem zal het zeer stormen. Hij zal roepen tot de hemel van boven, en tot de aarde, om Zijn volk te oordelen. Verzamelt Mij Mijn gunstgenoten¹, die Mijn verbond maken met een offer!", "Jes 28:15": "Omdat u zegt: Wij hebben een verbond met de dood gemaakt, en met het rijk van de dood hebben wij een voorzichtig verdrag gemaakt; wanneer de overstromende gesel doortrekt, zal hij bij ons niet komen; want wij hebben de leugen ons tot een toevlucht gesteld, en onder de valsheid hebben wij ons verborgen.", "Spr 6:17-19": "hoogmoedige ogen, een valse tong, en handen die onschuldig bloed vergieten; een hart dat verdorven plannen smeedt; voeten die zich haasten om naar het kwaad te lopen; een vals getuige, die leugens uitblaast; en wie ruzie zaait tussen broeders.", "Jes 30:20": "De Heere zal u wel brood van de benauwdheid, en water van de verdrukking geven; maar uw leraars zullen niet meer als met vleugels wegvliegen, maar uw ogen zullen uw leraars zien;", "Jer 25:15": "Want zo heeft de HEERE, de God van Israël, tot mij gezegd: Neem deze beker van de wijn van de grimmigheid van Mijn hand, en geef die te drinken aan alle volken, tot wie Ik u zend;", "1 Kor 15:32": "Als ik, naar de mens gesproken, tegen wilde dieren gevochten heb in Efeze, wat baat het mij, als de doden niet opgewekt worden? Laten wij eten en drinken, want morgen sterven wij.", "1 Kor 10:6": "En deze dingen zijn ons tot voorbeelden gebeurd, opdat wij geen lust tot het kwade zouden hebben, zoals zij ook lust gehad hebben.", "Openb 22:12": "En zie, Ik kom haastig, en Mijn loon is met Mij, om ieder te vergelden zoals zijn werk zal zijn.", "Job 19:20": "Mijn gebeente kleeft aan mijn huid en aan mijn vlees; en ik ben ontkomen met de huid van mijn tanden.", "Jer 9:21": "Want de dood is geklommen in onze vensters, hij is in onze paleizen gekomen, om de kinderen uit te roeien van de wijken, de jongemannen van de straten.", "Ps 75:11": "En ik zal alle hoorns van de goddelozen afhouwen; de hoorns van de rechtvaardige zullen verhoogd worden.", "Matt 9:23": "En toen Jezus in het huis van de leider kwam, en de fluitspelers zag en de rumoerige menigte,", "Spr 14:10": "Het hart kent zijn eigen bittere droefheid; en een vreemde zal zich met zijn blijdschap niet vermengen.", "Openb 2:23": "En haar kinderen zal Ik door de dood ombrengen; en alle gemeenten zullen weten dat Ik het ben Die nieren en harten onderzoek. En Ik zal u geven, ieder naar uw werken.", "Job 34:17": "Zou Hij ook, Die het recht haat, de gewonde verbinden, en zou u de zeer Rechtvaardige veroordelen?", "Jes 10:3": "Maar wat zult u doen op de dag van de bezoeking, en van de verwoesting, die van verre komen zal? Naar wie zult u vluchten om hulp, en waar zult u uw heerlijkheid laten?", "Job 24:23": "Geeft God hem gerustheid, dan steunt hij daarop; toch zijn Zijn ogen op hun wegen.", "Job 34:22": "Er is geen duisternis, en er is geen schaduw van de dood, dat daar de werkers van de ongerechtigheid zich verbergen mochten.", "Job 7:21": "En waarom vergeeft U mijn overtreding niet, en doet U mijn ongerechtigheid niet weg? Want nu zal ik in het stof liggen; en U zult mij vroeg zoeken, maar ik zal niet zijn.", "Ps 144:14": "Dat onze ossen goed beladen zijn; dat er geen inbraak is, geen uitval, geen gejammer op onze straten.", "Micha 2:10": "Maak u dan op en ga heen; want dit land zal de rust niet zijn; omdat het verontreinigd is, zal het u verderven, en dat met een hevige verderving.", "Job 22:17": "Die tegen God zeiden: Wijk van ons! En wat zou de Almachtige voor hen kunnen doen?", "Mark 12:40": "die de huizen van weduwen opeten, en dat onder de schijn van lang te bidden. Dezen zullen een zwaarder oordeel ontvangen.", "Jes 32:9-11": "Staat op, u geruste vrouwen, hoor mijn stem; u dochters, die zo zeker bent, neem mijn woorden ter oor. Vele dagen over het jaar zult u beroerd zijn, u dochters, die zo zeker bent, want de wijnoogst zal voorbij zijn, er zal geen inzameling komen. Beeft, u geruste vrouwen; wees beroerd, dochters, die zo zeker bent; trek u uit, en ontbloot u, en gord zakken om uw middel.", "Jes 22:16": "Wat hebt u hier, of aan wie hebt u hier iets, dat u hier voor uzelf een graf hebt uitgehouwen, zoals iemand die zijn graf in de hoogte uithouwt, die voor zichzelf een woning in een rots laat uithakken?", "Ps 64:9": "En hun tong zal hen doen struikelen tegen zichzelf; ieder, die hen ziet, zal wegvluchten.", "Job 34:6": "Ik moet liegen over mijn recht; mijn pijl is smartelijk zonder overtreding.", "Hebr 10:30": "Want wij kennen Hem, Die gezegd heeft: Aan Mij is de wraak, Ik zal het vergelden, zegt de Heere. En opnieuw: De Heere zal Zijn volk oordelen.", "Ps 49:17": "Vrees niet wanneer een man rijk wordt, wanneer de eer van zijn huis groot wordt;", "Job 27:8": "Want wat is de verwachting van de huichelaar, als hij gierig geweest zal zijn, wanneer God zijn ziel zal uittrekken?", "Jer 31:29": "In die dagen zullen zij niet meer zeggen: De vaders hebben onrijpe druiven gegeten, en de tanden van de kinderen zijn stomp geworden.", "1 Tess 5:3": "Want wanneer zij zullen zeggen: Het is vrede en veilig; dan zal een plotseling verderf hun overkomen, zoals de barensweeën een zwangere vrouw overkomen; en zij zullen het geenszins ontvluchten;", "Luk 18:18-23": "En een zekere leider vroeg Hem: Goede Meester, wat moet ik doen om het eeuwige leven te beërven? En Jezus zei tegen hem: Waarom noemt u Mij goed? Niemand is goed, dan Een, namelijk God. U kent de geboden: U zult geen overspel doen; u zult niet doden; u zult niet stelen; u zult geen valse getuigenis geven; eer uw vader en uw moeder.", "Amos 8:10": "En Ik zal uw feesten in rouw veranderen, en al uw liederen in weeklacht, en op alle lendenen een zak brengen, en op elk hoofd kaalheid; en Ik zal het land in rouw brengen als over een enige zoon, en het einde ervan als een bittere dag.", "Gal 4:9": "en nu u God kent, ja, veelmeer door God gekend bent, hoe keert u zich weer tot de zwakke en arme beginselen, die u weer van voren af aan wilt dienen?", "Matt 6:4": "opdat uw aalmoes in het verborgene is; en uw Vader, Die in het verborgene ziet, Die zal het u in het openbaar vergelden.", "Job 15:28-30": "En heeft verdelgde steden bewoond, en huizen die men niet bewoonde, die gereed waren om een puinhoop te worden. Hij zal niet rijk worden, en zijn vermogen zal niet bestaan; en hun volmaaktheid zal zich niet uitbreiden op de aarde. Hij zal van de duisternis niet ontwijken, de vlam zal zijn scheut verdrogen; hij zal wijken door het geblaas van zijn mond.", "Ezech 20:27": "Daarom, mensenkind, spreek tot het huis van Israël, en zeg tegen hen: Zo zegt de Heere HEERE: Hiermee nog hebben uw vaderen Mij gesmaad, dat zij door overtreding tegen Mij hebben overtreden.", "Ps 28:3": "Trek mij niet weg met de goddelozen, en met de werkers van de ongerechtigheid, die van vrede spreken met hun naasten, maar kwaad is er in hun hart.", "Job 9:17": "Want Hij vermorzelt mij door een onweer, en vermenigvuldigt mijn wonden zonder oorzaak.", "Ps 135:1": "Halleluja! Prijst de Naam van de HEERE, prijst Hem, u knechten van de HEERE!", "Ezech 7:4-6": "En Mijn oog zal u niet verschonen, en Ik zal niet sparen; maar Ik zal uw wegen op u brengen, en uw gruwelen zullen in het midden van u zijn, en u zult weten dat Ik de HEERE ben. Zo zegt de Heere HEERE: Een kwaad, een enig kwaad, zie, is gekomen; Een einde is er gekomen, dat einde is gekomen, het is opgewaakt tegen u; zie, het kwaad is gekomen!", "Ps 63:12": "Maar de koning zal zich in God verblijden; ieder die bij Hem zweert, zal zich beroemen; want de mond van de leugensprekers zal gestopt worden.", "Jes 40:14": "Met wie heeft Hij raad gehouden, die Hem verstand zou geven, en Hem zou leren van het pad van het recht, en Hem wetenschap zou leren, en Hem bekend zou maken de weg van het veelvoudige verstand?", "1 Sam 2:9": "Hij zal de voeten van Zijn gunstgenoten bewaren; maar de goddelozen zullen zwijgen in duisternis; want een man vermag niet door kracht.", "Spr 25:14": "Een man die zichzelf beroemt op een valse gift, is als wolken en wind, waar geen regen bij is.", "Ps 95:10": "Veertig jaren heb Ik verdriet gehad aan dit geslacht, en heb gezegd: Zij zijn een volk dat dwaalt van hart, en zij kennen Mijn wegen niet.", "Gen 4:7": "Is het niet zo: als u goed doet, wordt u aanvaard? En als u niet goed doet, ligt de zonde aan de deur. Naar u gaat zijn begeerte uit, en u zult over hem heersen.", "Jes 28:14": "Daarom, hoor het woord van de HEERE, u bespotters, u die heersen over dit volk, dat in Jeruzalem is!", "Matt 6:25-34": "Daarom zeg Ik u: wees niet bezorgd over uw leven, wat u eten en wat u drinken zult; ook niet over uw lichaam, waarmee u zich kleden zult. Is het leven niet meer dan het voedsel, en het lichaam meer dan de kleding? Kijk naar de vogels van de hemel: zij zaaien niet, maaien niet, en verzamelen niet in schuren; en uw hemelse Vader voedt ze toch. Gaat u ze niet ver te boven? Wie van u kan, door bezorgd te zijn, één el aan zijn lengte toevoegen?", "Job 16:18": "O aarde, bedek mijn bloed niet; en laat er voor mijn geroep geen plaats zijn.", "Num 15:30": "Maar de ziel die iets doet met opgeheven hand, hetzij van inboorlingen of van vreemdelingen, die smaadt de HEERE; en die ziel zal uitgeroeid worden uit het midden van haar volk;", "Job 9:22": "Dat is één ding, daarom zeg ik: De oprechte en de goddeloze verdoet Hij.", "Spr 20:6": "Elk van de menigte van de mensen roept zijn eigen weldadigheid uit; maar wie zal een echt trouwe man vinden?", "Joël 2:2": "Een dag van duisternis en donkerheid, een dag van wolken en dikke duisternis, als de dageraad uitgespreid over de bergen; een groot en machtig volk, zoals er van oude tijden af niet geweest is, en na hen niet meer zal zijn tot in jaren van vele geslachten.", "Mark 12:24": "En Jezus antwoordde en zei tegen hen: Dwaalt u niet daarom, omdat u de Schriften niet kent, en ook de kracht van God niet?", "Jer 2:33-35": "Wat maakt u uw weg goed, terwijl u boelering zoekt? Waarom u ook de boosaardigste hoeren uw wegen geleerd hebt. Ja, het bloed van de zielen van de onschuldige behoeftigen is in uw zomen gevonden; Ik heb dat niet door opgraven gevonden, maar aan dat alles. Nog zegt u: Zeker, ik ben onschuldig; Zijn toorn is immers van mij afgekeerd. Zie, Ik zal met u rechten, omdat u zegt: Ik heb niet gezondigd.", "Jer 5:25": "Uw ongerechtigheden wenden die dingen af, en uw zonden houden dat goede van u tegen.", "Job 39:35": "Is het twisten met de Almachtige onderrichten? Wie God bestraft, die antwoordt daarop.", "Spr 11:31": "Zie, de rechtvaardige wordt vergolden op de aarde, hoeveel te meer de goddeloze en de zondaar!", "Luk 11:52": "Wee u, wetgeleerden, want u hebt de sleutel van de kennis weggenomen; u zelf bent niet naar binnen gegaan, en hen die naar binnen gingen, hebt u tegengehouden.", "Jer 31:4": "Ik zal u weer bouwen, en u zult gebouwd worden, o jonkvrouw Israël! U zult weer versierd zijn met uw tamboerijnen, en uitgaan met de rei van de spelende mensen.", "Jer 13:24": "Daarom zal Ik hen verstrooien als een stoppel die wegwaait door een wind uit de woestijn.", "Ps 52:7-9": "God zal u ook afbreken voor eeuwig; Hij zal u wegrapen en u uit de tent uitrukken; ja, Hij zal u uitwortelen uit het land van de levenden. Sela. En de rechtvaardigen zullen het zien, en vrezen; en zij zullen over hem lachen, en zeggen: Zie de man, die God niet tot Zijn Sterkte stelde, maar vertrouwde op de overvloed van het rijkdom; hij was sterk geworden door zijn beschadigen.", "Ps 147:6": "De HEERE houdt de zachtmoedigen staande; de goddelozen vernedert Hij, tot op de aarde toe.", "Openb 13:6": "En het opende zijn mond tot lastering tegen God, om Zijn Naam te lasteren, en Zijn tabernakel, en hen die in de hemel wonen.", "Ps 129:8": "en zij die voorbijgaan, niet zeggen: De zegen van de HEERE zij bij u! Wij zegenen u in de Naam van de HEERE.", "Spr 26:5": "Antwoord de dwaas naar zijn dwaasheid, opdat hij niet wijs is in zijn eigen ogen.", "Ps 37:34-38": "Koph. Wacht op de HEERE, en houd Zijn weg, en Hij zal u verhogen om de aarde erfelijk te bezitten; u zult zien dat de goddelozen worden uitgeroeid. Resch. Ik heb een geweldenaar gezien, een goddeloze, die zich uitbreidde als een groene inlandse boom. Maar hij ging voorbij, en zie, hij was er niet meer; en ik zocht hem, maar hij werd niet gevonden.", "Joh 4:22": "U aanbidt wat u niet weet; wij aanbidden wat wij weten; want de zaligheid is uit de Joden.", "Ps 1:4-6": "Zo zijn de goddelozen niet, maar als het kaf dat de wind wegdrijft. Daarom zullen de goddelozen niet standhouden in het gericht, noch de zondaars in de vergadering van de rechtvaardigen. Want de HEERE kent de weg van de rechtvaardigen; maar de weg van de goddelozen zal vergaan.", "Gen 31:27": "Waarom bent u heimelijk gevlucht, en hebt u zich aan mij ontstolen? En hebt u het mij niet verteld, zodat ik u had kunnen wegzenden met vreugde, en met gezangen, met tamboerijn en met harp?", "2 Tess 2:1": "En wij vragen u dringend, broeders, met het oog op de komst van onze Heere Jezus Christus, en onze samenkomst met Hem,", "Spr 1:12": "Laat ons hen levend verslinden, als het graf; ja, geheel en al, zoals zij die in de kuil neerdalen;", "1 Joh 3:6": "Ieder die in Hem blijft, zondigt niet; ieder die zondigt, heeft Hem niet gezien en heeft Hem niet gekend.", "1 Kron 15:27": "David nu was gekleed met een mantel van fijn linnen; ook alle Levieten die de ark droegen, en de zangers, en Chenanja, de leider van het opheffen van de zang; ook had David een lijfrok van linnen aan.", "Hoogl 8:6": "Zet mij als een zegel op Uw hart, als een zegel op Uw arm; want de liefde is sterk als de dood; de ijver is hard als het graf; haar kolen zijn vurige kolen, vlammen van de Heere.", "Jes 57:21": "De goddelozen, zegt mijn God, hebben geen vrede.", "Job 2:12": "En toen zij hun ogen van verre opsloegen, herkenden zij hem niet, en zij verhieven hun stem en weenden; daarbij scheurden zij ieder hun mantel, en strooiden stof op hun hoofden, omhoog naar de hemel.", "Spr 18:3": "Als de goddeloze komt, komt ook de verachting, en met schande smaad.", "Ps 146:4": "Zijn geest gaat uit, hij keert terug tot zijn aarde; op diezelfde dag vergaan zijn plannen.", "Joh 7:28": "Jezus riep dan in de tempel, terwijl Hij leerde, en zei: U kent Mij, en u weet van waar Ik ben; en Ik ben niet uit Mijzelf gekomen, maar Hij die Mij gezonden heeft, is waarachtig, Hem kent u niet.", "Luk 19:42": "en zei: Och, had u ook maar geweten, ook nog op deze dag van u, wat tot uw vrede dient! Maar nu is het verborgen voor uw ogen.", "Job 21:23-26": "De één sterft in de kracht van zijn volkomenheid, terwijl hij helemaal stil en gerust was; Zijn melkvaten waren vol melk, en het merg van zijn beenderen was bevochtigd. De ander daarentegen sterft met een bittere ziel, en hij heeft van het goede niet gegeten.", "Matt 6:8": "Word hun dan niet gelijk; want uw Vader weet wat u nodig hebt, voordat u het Hem vraagt.", "Job 10:14": "Als ik zondig, dan zult U mij in het oog houden, en van mijn misdaad zult U mij niet onschuldig houden.", "Joh 12:40": "Hij heeft hun ogen verblind, en hun hart verhard; opdat zij met de ogen niet zien, en met het hart niet verstaan, en zij zich bekeren, en Ik hen genees.", "Rom 9:20": "Maar toch, o mens, wie bent u, die tegen God antwoordt? Zal ook het maaksel tegen hem die het gemaakt heeft zeggen: Waarom hebt u mij zo gemaakt?", "Spr 24:22": "Want hun verderf zal snel ontstaan; en wie weet hun beider ondergang?", "Joh 3:6": "Wat uit het vlees geboren is, dat is vlees; en wat uit de Geest geboren is, dat is geest.", "Ps 9:8": "Maar de HEERE zal in eeuwigheid zitten; Hij heeft Zijn troon bereid ten gerichte.", "Pred 5:19": "Want hij zal niet veel denken aan de dagen van zijn leven, omdat God hem antwoord geeft in de blijdschap van zijn hart.", "Luk 6:49": "Maar wie het gehoord heeft en het niet gedaan heeft, is als een mens die een huis bouwde op de aarde zonder fundament; de waterstroom sloeg ertegen aan, en het viel meteen om, en de val van dat huis was groot.", "Ex 14:3": "Farao dan zal zeggen van de kinderen van Israël: Zij zijn verward in het land; die woestijn heeft hen ingesloten.", "Spr 10:10": "Wie met het oog knipoogt, veroorzaakt smart; en een dwaas van lippen zal ten val komen.", "2 Sam 14:14": "Want wij moeten sterven, en zijn als water dat, uitgestort op de aarde, niet meer verzameld kan worden. God zal echter het leven niet wegnemen, maar Hij zal er middelen op bedenken, dat Hij de verstotene niet van Zich verstoot.", "Deut 8:11-14": "Wacht u ervoor dat u de HEERE, uw God, niet vergeet, door Zijn geboden, en Zijn rechten, en Zijn inzettingen niet te houden, die ik u vandaag gebied; Opdat niet misschien, als u gegeten zult hebben, en verzadigd bent, en goede huizen gebouwd hebt, en die bewoont, En uw runderen en uw schapen meer worden, ook zilver en goud u meer wordt, ja, al wat u hebt meer wordt;", "Pred 9:2": "Alles overkomt iedereen op dezelfde manier: eenzelfde lot treft de rechtvaardige en de goddeloze, de goede en de reine, als de onreine; zowel hem die offert, als hem die niet offert; zoals de goede, zo ook de zondaar, hij die zweert, evenals hij die de eed vreest.", "Rom 12:19": "Wreek uzelf niet, geliefden, maar geef de toorn plaats; want er is geschreven: Mij komt de wraak toe; Ik zal het vergelden, zegt de Heere.", "Ps 18:27": "Bij de reine houdt U Zich rein, maar bij de verkeerde bewijst U Zich een Worstelaar.", "Jes 36:21": "Toch zwegen zij stil, en antwoordden hem geen woord; want het gebod van de koning was: U zult hem niet antwoorden.", "Job 14:2": "Hij komt op als een bloem, en wordt afgesneden; ook vlucht hij als een schaduw, en houdt geen stand.", "Luk 20:34-38": "En Jezus antwoordde en zei tegen hen: De kinderen van deze wereld trouwen, en worden ten huwelijk uitgegeven; maar wie waardig geacht worden om die andere wereld te verwerven en de opstanding uit de doden, zullen niet trouwen, en ook niet ten huwelijk uitgegeven worden; want zij kunnen niet meer sterven, want zij zijn gelijk aan de engelen; en zij zijn kinderen van God, omdat zij kinderen van de opstanding zijn.", "Ezech 11:21": "Maar van hen wier hart het hart van hun verfoeiselen en hun gruwelen navolgt, zal Ik de weg daarvan op hun hoofd geven, spreekt de Heere HEERE.", "Joh 12:48": "Wie Mij verwerpt en Mijn woorden niet ontvangt, heeft iemand die hem oordeelt; het woord dat Ik gesproken heb, dat zal hem oordelen op de laatste dag.", "Lev 19:12": "U zult niet vals bij Mijn Naam zweren; want u zou de Naam van uw God ontheiligen; Ik ben de HEERE.", "Jes 55:2": "Waarom weegt u geld uit voor wat geen brood is, en uw arbeid voor wat niet verzadigen kan? Hoor aandachtig naar Mij, en eet het goede, en laat uw ziel zich verlustigen in vettigheid.", "Deut 4:5-31": "Zie, ik heb u de inzettingen en rechten geleerd, zoals de HEERE, mijn God, mij geboden heeft; opdat u zo doet in het land waar u naar toe gaat om het in bezit te nemen. Bewaar ze dan, en doe ze; want dat zal uw wijsheid en uw verstand zijn voor de ogen van de volken, die al deze inzettingen zullen horen en zeggen: Dit grote volk is werkelijk een wijs en verstandig volk! Want welk groot volk is er, dat de goden zo dichtbij heeft als de HEERE, onze God, bij ons is, zo vaak als wij Hem aanroepen?", "Ps 149:6": "De lofprijzingen van God zullen in hun keel zijn, en een tweesnijdend zwaard in hun hand,", "Ps 97:3": "Een vuur gaat voor Zijn aangezicht heen, en het steekt Zijn tegenstanders rondom in brand.", "Mal 3:15": "En nu, wij achten de hoogmoedigen gelukzalig; ook wie goddeloosheid doen, worden gebouwd; ook verzoeken zij de HEERE, en ontkomen.", "Ps 85:11": "De goedertierenheid en waarheid zullen elkaar ontmoeten; de gerechtigheid en vrede zullen elkaar kussen.", "Jes 40:2": "Spreekt naar het hart van Jeruzalem, en roept haar toe, dat haar strijd vervuld is, dat haar ongerechtigheid verzoend is, dat zij van de hand van de HEERE dubbel ontvangen heeft voor al haar zonden.", "Jes 47:9": "Toch zullen deze beide dingen u in een ogenblik overkomen, op één dag, de beroving van kinderen en weduwschap; volkomen zullen zij u overkomen, vanwege de veelheid van uw toverijen, vanwege de grote menigte van uw bezweringen.", "Jes 30:32": "En overal waar die gegrondveste staf doorgegaan zal zijn (waarop de HEERE hem zal hebben doen rusten), daar zal men met trommels en harpen zijn; want met bewegende bestrijdingen zal Hij tegen hen strijden.", "Ps 35:24": "Doe mij recht naar Uw gerechtigheid, HEERE, mijn God! En laat hen zich over mij niet verblijden.", "1 Kon 8:39": "hoor Ú dan in de hemel, de vaste plaats van Uw woning, en vergeef, en doe, en geef ieder naar al zijn wegen, zoals U zijn hart kent; want U alleen kent het hart van alle kinderen van de mensen;", "Job 34:14": "Als Hij Zijn hart tegen hem zette, Zijn geest en Zijn adem zou Hij tot Zich verzamelen;", "Ps 119:119": "U doet alle goddelozen van de aarde weg als schuim, daarom heb ik Uw getuigenissen lief.", "Gal 5:20": "Afgoderij, toverij, vijandschappen, ruzies, jaloersheden, toorn, twisten, verdeeldheid, afwijkingen in de leer,", "Jes 22:12": "En op die dag zal de Heere, de HEERE van de heerscharen, roepen tot geween, en tot rouwklacht, en tot kaalheid, en tot omgording met de zak.", "Gen 20:6": "En God zei tegen hem in de droom: Ik heb ook geweten dat u dit in oprechtheid van uw hart gedaan hebt, en Ik heb u ook belet om tegen Mij te zondigen; daarom heb Ik u niet toegelaten haar aan te raken.", "Nahum 1:8-10": "En met een doorgaande vloed zal Hij haar plaats volledig vernietigen; en duisternis zal Zijn vijanden vervolgen. Wat bedenkt u tegen de HEERE? Hij zal zelf een einde maken; de benauwdheid zal niet tweemaal opkomen. Omdat zij als doornen ineengevlochten zijn, en dronken zijn zoals zij plegen dronken te zijn, zo worden zij helemaal verteerd, als een dorre stoppel.", "Job 33:11": "Hij legt mijn voeten in de stok; Hij neemt al mijn paden waar.", "Ps 115:17": "De doden zullen de HEERE niet prijzen, evenmin wie in de stilte neergedaald zijn.", "Job 15:20-35": "Al zijn dagen doet de goddeloze zichzelf weedom aan; en weinige jaren in getal zijn voor de tiran weggelegd. Het geluid van verschrikkingen is in zijn oren; in de vrede zelf komt de verwoester hem over. Hij gelooft niet uit de duisternis terug te keren, maar dat hij beloerd wordt voor het zwaard.", "Openb 13:2-7": "En het beest dat ik zag, was een panter gelijk, en zijn poten als de poten van een beer, en zijn mond als de mond van een leeuw; en de draak gaf hem zijn kracht, en zijn troon, en grote macht. En ik zag een van zijn hoofden als tot de dood gewond, en zijn dodelijke wond werd genezen; en de hele aarde verwonderde zich achter het beest aan. En zij aanbaden de draak, die het beest macht gegeven had; en zij aanbaden het beest en zeiden: Wie is aan dit beest gelijk? Wie kan er oorlog tegen voeren?", "Gen 18:25": "Het zij verre van U, zoiets te doen, de rechtvaardige te doden met de goddeloze! zodat de rechtvaardige zou zijn als de goddeloze, verre zij het van U! zou de Rechter van de hele aarde geen recht doen?", "Jes 66:18": "Hun werken en hun gedachten! Het komt, dat Ik alle heidenen en talen zal verzamelen, en zij zullen komen, en zij zullen Mijn heerlijkheid zien.", "Ps 89:39-46": "Maar Gij hebt hem verstoten en verworpen; Gij bent verbolgen geworden tegen Uw gezalfde. Gij hebt het verbond van Uw knecht teniet gedaan; Gij hebt zijn kroon ontheiligd tegen de aarde. Gij hebt al zijn muren
