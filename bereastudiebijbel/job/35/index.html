len te gronde richten, en hij zal opstaan tegen de Vorst der vorsten, maar hij zal gebroken worden, zonder mensenhand.", "Matt 28:5": "Maar de engel antwoordde en zei tegen de vrouwen: Wees u niet bang; want ik weet dat u Jezus zoekt, Die gekruisigd was.", "Deut 4:36": "Vanuit de hemel heeft Hij u Zijn stem laten horen, om u te onderwijzen; en op de aarde heeft Hij u Zijn grote vuur laten zien; en u hebt Zijn woorden uit het midden van het vuur gehoord.", "Ps 103:13": "Zoals een vader zich ontfermt over zijn kinderen, ontfermt de HEERE Zich over hen die Hem vrezen.", "Job 35:10-12": "Maar niemand zegt: Waar is God, mijn Maker, Die de lofzangen geeft in de nacht? Die ons meer leert dan de dieren van de aarde, en ons wijzer maakt dan de vogels van de hemel? Daar roepen zij; maar Hij antwoordt niet, vanwege de hoogmoed van de bozen.", "Joh 17:6": "Ik heb Uw Naam geopenbaard aan de mensen die U Mij uit de wereld gegeven hebt. Zij waren van U, en U hebt Mij hen gegeven; en zij hebben Uw woord bewaard.", "Job 34:17": "Zou Hij ook, Die het recht haat, de gewonde verbinden, en zou u de zeer Rechtvaardige veroordelen?", "Rom 3:26": "tot een betoning van Zijn gerechtigheid in deze tegenwoordige tijd; opdat Hij rechtvaardig is, en rechtvaardigend degene die uit het geloof van Jezus is.", "Joh 8:12": "Jezus sprak dan weer tegen hen en zei: Ik ben het licht van de wereld; wie Mij volgt, zal in de duisternis niet wandelen, maar zal het licht van het leven hebben.", "Jes 43:7": "ieder, die naar Mijn Naam genoemd is, en die Ik geschapen heb tot Mijn eer, die Ik geformeerd heb, die Ik ook gemaakt heb.", "2 Kron 30:6": "De boodschappers dan gingen weg met de brieven uit de hand van de koning en zijn leiders, door heel Israël en Juda, en naar het bevel van de koning, en zeiden: Kinderen van Israël, bekeer u tot de HEERE, de God van Abraham, Izak en Israël, dan zal Hij Zich keren naar wie ontkomen waren, die voor u overgebleven zijn uit de hand van de koningen van Assyrië.", "Ps 41:4": "De HEERE zal hem ondersteunen op het ziekbed; in zijn ziekte verandert U zijn hele leger.", "Ps 37:5": "Gimel. Leg uw weg in de handen van de HEERE, en vertrouw op Hem; Hij zal het maken;", "Job 31:13-15": "Als ik versmaad heb het recht van mijn knecht, of van mijn dienstmaagd, als zij geschil hadden met mij; (Want wat zou ik doen, als God opstond? En als Hij bezoeking deed, wat zou ik Hem antwoorden? Heeft Hij niet, Die mij in de buik maakte, hem ook gemaakt en Een ons in de baarmoeder bereid?)", "Ps 135:14": "Want de HEERE zal Zijn volk recht doen, en het zal Hem berouwen over Zijn knechten.", "Dan 7:10": "Een vurige rivier vloeide, en ging voor Hem uit, duizendmaal duizenden dienden Hem, en tien duizendmaal tien duizenden stonden voor Hem; het gericht zette zich, en de boeken werden geopend.", "Ps 102:17": "Als de HEERE Sion zal opgebouwd hebben, in Zijn heerlijkheid zal verschenen zijn,", "Pred 10:5-7": "Er is nog een kwaad dat ik gezien heb onder de zon, als een dwaling die van het aangezicht van de leider voortkomt. Een dwaas wordt gezet in grote hoogheden, maar de rijken zitten in de laagte. Ik heb knechten te paard gezien, en vorsten die als knechten op de aarde gingen.", "Job 32:22": "Want ik weet geen bijnamen te gebruiken; anders zou mijn Maker mij binnenkort wegnemen.", "Deut 5:24": "en u zei: Zie, de HEERE, onze God, heeft ons Zijn heerlijkheid en Zijn grootheid laten zien, en wij hebben Zijn stem gehoord uit het midden van het vuur; vandaag hebben wij gezien dat God met de mens spreekt, en dat hij levend blijft.", "Job 42:8": "Daarom neemt nu voor u zeven jonge stieren en zeven rammen, en gaat heen naar Mijn knecht Job, en offert een brandoffer voor u, en laat Mijn knecht Job voor u bidden; want zeker, Ik zal zijn aangezicht aannemen, opdat Ik aan u niet doe naar uw dwaasheid; want u hebt niet recht van Mij gesproken, zoals Mijn knecht Job.", "Ps 119:50": "Dit is mijn troost in mijn ellende, want Uw toezegging heeft mij levend gemaakt.", "Amos 6:12": "Zullen paarden ook rennen op een steenrots? Zal men daarop ook met runderen ploegen? Want u hebt het recht in gal veranderd, en de vrucht van de gerechtigheid in alsem.", "Matt 22:12": "En hij zei tegen hem: Vriend! Hoe bent u hier binnengekomen zonder een bruiloftskleed aan te hebben? En hij verstomde.", "Job 23:3": "Och, of ik wist waar ik Hem vinden zou, ik zou tot Zijn troon komen;", "Job 37:1-24": "Ook hierover beeft mijn hart, en springt op uit zijn plaats. Hoort met aandacht naar de beweging van Zijn stem, en het geluid dat uit Zijn mond uitgaat! Dat zendt Hij rechtuit onder de hele hemel, en Zijn licht over de einden der aarde.", "Deut 4:5": "Zie, ik heb u de inzettingen en rechten geleerd, zoals de HEERE, mijn God, mij geboden heeft; opdat u zo doet in het land waar u naar toe gaat om het in bezit te nemen.", "Ps 144:3": "O HEERE, wat is de mens, dat U hem kent, het kind van de mens, dat U op hem let?", "1 Sam 2:3": "Maak het niet te veel, dat u hoog, hoog zou spreken, dat iets hards uit uw mond zou gaan; want de HEERE is een God van wetenschappen, en Zijn daden zijn recht gedaan.", "Jes 59:14": "Daarom is het recht achterwaarts geweken, en de gerechtigheid staat ver weg; want de waarheid struikelt op de straat, en wat recht is, kan er niet ingaan.", "Job 22:17": "Die tegen God zeiden: Wijk van ons! En wat zou de Almachtige voor hen kunnen doen?", "Gen 18:20": "Verder zei de HEERE: Omdat het geroep van Sodom en Gomorra groot is, en omdat hun zonde zeer zwaar is,", "Ezech 18:29": "Toch zegt het huis van Israël: De weg van de Heere is niet recht. Zouden Mijn wegen, o huis van Israël, niet recht zijn? Zijn niet uw wegen onrecht?", "Job 36:29": "Kan iemand ook verstaan de uitbreidingen van de wolken, en de donderslagen van Zijn tent?", "Spr 3:5": "Vertrouw op de HEERE met heel uw hart, en steun op uw eigen verstand niet.", "Luk 12:7": "Ja, ook de haren van uw hoofd zijn allemaal geteld. Wees dan niet bang; u gaat vele musjes te boven.", "Jes 55:9": "Want zoals de hemelen hoger zijn dan de aarde, zo zijn Mijn wegen hoger dan uw wegen, en Mijn gedachten dan uw gedachten.", "Ps 55:4": "Om het geroep van de vijand, vanwege de beangstiging van de goddeloze; want zij schuiven ongerechtigheid op mij, en in toorn haten zij mij.", "Jes 5:18": "Wee hun die de ongerechtigheid trekken met koorden van ijdelheid, en de zonde als met dikke wagentouwen!", "Matt 6:25-34": "Daarom zeg Ik u: wees niet bezorgd over uw leven, wat u eten en wat u drinken zult; ook niet over uw lichaam, waarmee u zich kleden zult. Is het leven niet meer dan het voedsel, en het lichaam meer dan de kleding? Kijk naar de vogels van de hemel: zij zaaien niet, maaien niet, en verzamelen niet in schuren; en uw hemelse Vader voedt ze toch. Gaat u ze niet ver te boven? Wie van u kan, door bezorgd te zijn, één el aan zijn lengte toevoegen?", "Luk 21:15": "Want Ik zal u mond en wijsheid geven, die al uw tegenstanders niet zullen kunnen tegenspreken, noch weerstaan.", "Spr 24:12": "Wanneer u zegt: Zie, wij wisten dat niet; zal Hij, Die de harten weegt, dat niet merken? En Die uw ziel gadeslaat, zal Hij het niet weten? Want Hij zal de mens vergelden naar zijn werk.", "Ex 16:7": "En morgen zult u de heerlijkheid van de HEERE zien, omdat Hij uw gemor tegen de HEERE gehoord heeft; want wat zijn wij, dat u tegen ons mort?", "Jer 24:7": "En Ik zal hun een hart geven om Mij te kennen, dat Ik de HEERE ben; en zij zullen Mij tot een volk zijn, en Ik zal hun tot een God zijn; want zij zullen zich tot Mij bekeren met hun hele hart.", "Jes 61:8": "Want Ik, de HEERE, heb het recht lief, Ik haat de roof bij het brandoffer, en Ik zal ervoor zorgen dat hun werk in waarheid zal zijn; en Ik zal een eeuwig verbond met hen sluiten.", "Jer 12:1": "Ú zou rechtvaardig zijn, HEERE, wanneer ik tegen U zou twisten; ik zal echter over Uw oordelen met U spreken; waarom is de weg van de goddelozen voorspoedig, waarom hebben zij rust, allen die trouweloos trouweloosheid bedrijven?", "Ps 90:8": "U stelt onze ongerechtigheden voor U, onze heimelijke zonden in het licht van uw aangezicht.", "Ps 18:8-16": "Toen daverde en beefde de aarde, en de gronden van de bergen beroerden zich en daverden, omdat Hij ontstoken was. Rook ging op van Zijn neus, en een vuur uit Zijn mond verteerde; kolen werden daarvan aangestoken. En Hij boog de hemel, en daalde neer, en donkerheid was onder Zijn voeten.", "Ex 14:14": "De HEERE zal voor u strijden, en u zult stil zijn.", "Zef 3:18": "De bedroefden, om de bijeenkomst, zal Ik verzamelen, zij zijn uit u; de smaad is een last op haar.", "Job 34:8": "En gaat over weg in gezelschap met de werkers van de ongerechtigheid, en wandelt met goddeloze lieden.", "Ex 20:5": "U zult zich daarvoor niet buigen, en ze niet dienen; want Ik, de HEERE, uw God, ben een ijverig God, Die de misdaad van de vaders bezoek aan de kinderen, aan het derde en aan het vierde geslacht van hen die Mij haten;", "Ps 145:14": "Samech. De HEERE ondersteunt allen die vallen, en Hij richt op alle gebogenen.", "Gal 6:3": "Want als iemand denkt iets te zijn, terwijl hij niets is, bedriegt hij zichzelf in zijn gemoed.", "Job 22:12": "Is God niet in de hoogte van de hemel? Zie toch het opperste van de sterren aan, hoe hoog zij zijn.", "Job 18:2-4": "Hoe lang duurt het nog voordat u een einde maakt aan uw woorden? Let op, en daarna zullen wij spreken. Waarom worden wij beschouwd als beesten, en zijn wij onrein in uw ogen? O u, die uw ziel verscheurt door uw toorn! Zal om uwentwil de aarde verlaten worden, en zal een rots weggenomen worden uit haar plaats?", "Joh 14:7": "Als u Mij gekend had, zou u ook Mijn Vader gekend hebben; en van nu af kent u Hem, en hebt Hem gezien.", "Jes 41:17": "De ellendigen en behoeftigen zoeken water, maar er is geen; hun tong versmacht van dorst; Ik, de HEERE, zal hen verhoren, Ik, de God van Israël, zal hen niet verlaten.", "Ps 67:5": "De natiën zullen zich verblijden en juichen, omdat U de volken zult richten in rechtvaardigheid; en de natiën op de aarde, die zult U leiden. Sela.", "Jes 24:23": "En de maan zal schaamrood worden, en de zon zal beschaamd worden, als de HEERE van de heerscharen regeren zal op de berg Sion en te Jeruzalem, en voor Zijn oudsten zal heerlijkheid zijn.", "Luk 11:15": "Maar sommigen van hen zeiden: Hij drijft de demonen uit door Beëlzebul, de leider van de demonen.", "Hos 7:15": "Ik heb hen wel getuchtigd, en hun armen gesterkt; maar zij denken kwaad tegen Mij.", "Ps 50:15": "En roept Mij aan in de dag van benauwdheid; Ik zal u eruit helpen, en u zult Mij eren.", "Ps 96:10": "Zegt onder de heidenen: De HEERE regeert; ook zal de wereld vaststaan, zij zal niet wankelen; Hij zal de volken oordelen in alle rechtvaardigheid.", "Ps 119:137": "Tsade. HEERE! U bent rechtvaardig, en elk van Uw oordelen is recht.", "Luk 15:25-32": "En zijn oudste zoon was op het veld; en toen hij kwam en het huis naderde, hoorde hij het gezang en het gedans, en hij riep één van de knechten tot zich, en vroeg wat dat te betekenen had. En deze zei tegen hem: Uw broer is gekomen, en uw vader heeft het gemeste kalf geslacht, omdat hij hem gezond en wel heeft teruggekregen.", "Deut 33:26": "Niemand is er gelijk God, o Jeschurun! Die op de hemel vaart tot uw hulp, en met Zijn hoogheid op de bovenste wolken.", "Jak 1:27": "De zuivere en onbevlekte godsdienst voor God en de Vader is deze: wezen en weduwen bezoeken in hun verdrukking, en zichzelf onbesmet bewaren van de wereld.", "Spr 30:12": "Een geslacht dat rein is in zijn eigen ogen, en toch niet gewassen is van zijn vuiligheid;", "Job 34:33": "Zal het van u zijn, hoe Hij iets vergelden zal, omdat u Hem versmaadt? Zou u dan verkiezen, en niet ik? Wat weet u dan? Spreek.", "2 Petr 3:18": "Maar groei op in de genade en kennis van onze Heere en Zaligmaker Jezus Christus. Hem zij de heerlijkheid, zowel nu als tot in de dag van de eeuwigheid. Amen.", "Ps 77:7": "Ik dacht aan mijn snarenspel; in de nacht overlegde ik in mijn hart, en mijn geest onderzocht:", "Spr 24:9": "De gedachte van de dwaasheid is zonde; en een spotter is de mensen een gruwel.", "Job 11:5": "Maar zeker, och, of God sprak, en Zijn lippen tegen u opende;", "Deut 7:17-21": "Als u in uw hart zei: Deze volken zijn groter dan ik; hoe zou ik hen uit hun bezit kunnen verdrijven? — wees niet bevreesd voor hen; denk goed terug aan wat de HEERE, uw God, aan de farao en aan alle Egyptenaren gedaan heeft; de grote verzoekingen die uw ogen gezien hebben, en de tekenen, en de wonderen, en de sterke hand, en de uitgestrekte arm, waardoor de HEERE, uw God, u heeft uitgevoerd; zo zal de HEERE, uw God, doen aan alle volken voor wie u bevreesd bent.", "Jes 33:5": "De HEERE is verheven, want Hij woont in de hoogte; Hij heeft Sion vervuld met recht en gerechtigheid.", "Pred 4:1": "Daarna richtte ik mijn aandacht en zag alle onderdrukkingen die onder de zon gebeuren; en zie, er waren de tranen van de verdrukten, en van hen die geen trooster hadden; en aan de kant van hun verdrukkers was macht, zij daarentegen hadden geen trooster.", "Mal 1:7": "U brengt op Mijn altaar verontreinigd brood, en zegt: Waarmee verontreinigen wij U? Daarmee, dat u zegt: De tafel van de HEERE is verachtelijk.", "Rom 11:22": "Zie dan de goedertierenheid en de strengheid van God; de strengheid wel over hen die gevallen zijn, maar de goedertierenheid over u, als u in de goedertierenheid blijft; anders zult ook u afgehouwen worden.", "Hab 3:4-6": "En er was een glans als van het licht, Hij had hoornen aan Zijn hand, en daar was Zijn sterkte verborgen. Voor Zijn aangezicht ging de pestilentie, en de vurige kool ging voor Zijn voeten uit. Hij stond, en mat het land, Hij zag toe, en maakte de heidenvolken los, en de aloude bergen zijn verstrooid geworden; de heuvels van eeuwigheid hebben zich gebogen; de gangen van eeuwigheid zijn van Hem.", "Ps 112:4": "Zain. Voor de oprechten gaat het licht op in de duisternis; Cheth. Hij is genadig, en barmhartig, en rechtvaardig.", "Job 22:2-5": "Zal een man God voordelig zijn? Maar voor zichzelf zal de verstandige voordelig zijn. Is het voor de Almachtige nuttig, dat u rechtvaardig bent; of is het winst voor Hem, dat u uw wegen volmaakt maakt? Is het om uw vrees dat Hij u bestraft, dat Hij met u in het gericht komt?", "1 Petr 3:7": "U mannen, evenzo, woon bij haar met verstand, en bewijs eer aan het vrouwelijke lichaam, als het zwakste, als medeerfgenamen van de genade van het leven met haar; opdat uw gebeden niet verhinderd worden.", "Ex 20:18": "En al het volk zag de donderslagen, en de bliksemflitsen, en het geluid van de bazuin, en de rokende berg; toen het volk dit zag, weken zij terug en bleven op een afstand staan;", "Hebr 10:29": "hoeveel zwaarder straf, denkt u, zal hij waard geacht worden, die de Zoon van God met voeten heeft getreden, en het bloed van het testament, waardoor hij geheiligd was, als onrein heeft beschouwd, en de Geest van de genade smaad heeft aangedaan?", "Openb 7:14-17": "En ik zei tegen hem: Heere, u weet het. En hij zei tegen mij: Dezen zijn het, die uit de grote verdrukking komen; en zij hebben hun lange kleren gewassen, en hebben hun lange kleren wit gemaakt in het bloed van het Lam. Daarom zijn zij voor de troon van God, en dienen Hem dag en nacht in Zijn tempel; en Die op de troon zit, zal hen overschaduwen. Zij zullen niet meer hongeren, en zullen niet meer dorsten, en de zon zal niet meer op hen vallen, of enige hitte.", "Spr 27:21": "De smeltkroes is voor het zilver, en de oven voor het goud; zo wordt een man beproefd naar zijn lof.", "Job 24:24": "Zij zijn een korte tijd verheven, daarna is er niemand meer van hen; zij worden neergedrukt; net als alle anderen worden zij weggenomen; en net als de top van een aar worden zij afgesneden.", "Ps 25:9": "Jod. Hij zal de zachtmoedigen leiden in het recht, en Hij zal de zachtmoedigen Zijn weg leren.", "2 Kron 16:9": "Want wat de HEERE betreft, Zijn ogen doorlopen de hele aarde, om Zich sterk te bewijzen aan hen wier hart volkomen is tot Hem; hierin heeft u dwaas gedaan; want van nu af zullen er oorlogen tegen u zijn.", "Jes 28:17-22": "En Ik zal het oordeel stellen naar het richtsnoer, en de gerechtigheid naar het paslood; en de hagel zal de toevlucht van de leugen wegvagen, en het water zal de schuilplaats overstromen. En uw verbond met de dood zal teniet gedaan worden, en uw voorzichtig verdrag met het rijk van de dood zal niet standhouden; wanneer de overstromende gesel doortrekt, dan zult u erdoor vertrapt worden. Vanaf de tijd dat hij doortrekt, zal hij u wegnemen, want elke morgen zal hij doortrekken, bij dag en bij nacht; en het zal gebeuren, dat louter het verstaan van het gerucht een verschrikking zal zijn.", "Gen 12:2": "En Ik zal u tot een groot volk maken, en u zegenen, en uw naam groot maken; en wees een zegen!", "Dan 2:20-23": "Daniël antwoordde en zei: De Naam van God zij geloofd van eeuwigheid tot in eeuwigheid, want van Hem is de wijsheid en de kracht. Want Hij verandert de tijden en de tijdperken; Hij zet koningen af en Hij stelt koningen aan; Hij geeft de wijzen wijsheid, en kennis aan hen die verstand hebben. Hij openbaart diepe en verborgen dingen; Hij weet wat in het duister is, want het licht woont bij Hem.", "Micha 7:7-9": "Maar ik zal uitzien naar de HEERE, ik zal wachten op de God van mijn heil; mijn God zal mij horen. Verblijd u niet over mij, o mijn vijandin! Wanneer ik gevallen ben, zal ik weer opstaan; wanneer ik in duisternis gezeten ben, zal de HEERE mij een licht zijn. Ik zal de gramschap van de HEERE dragen, want ik heb tegen Hem gezondigd; totdat Hij mijn twist twist, en mijn recht uitvoert; Hij zal mij naar buiten brengen aan het licht; ik zal met vreugde zien naar Zijn gerechtigheid.", "2 Kor 7:6": "Doch God, Die de nederigen vertroost, heeft ons getroost door de komst van Titus.", "Jak 1:12": "Gelukkig is de man die verzoeking verdraagt; want als hij beproefd zal zijn geweest, zal hij de kroon van het leven ontvangen, die de Heere beloofd heeft aan hen die Hem liefhebben.", "Ps 99:8": "O HEERE, onze God! U hebt hen verhoord, U bent hun geweest een vergevend God, hoewel U wraak deed over hun daden.", "Jer 9:24": "Maar wie zich beroemt, beroemt zich hierin, dat hij begrijpt, en Mij kent, dat Ik de HEERE ben, Die weldadigheid, recht en gerechtigheid doe op de aarde, want in die dingen heb Ik behagen, spreekt de HEERE.", "Hab 1:4": "Daarom wordt de wet losgelaten, en het recht komt nooit meer voort; want de goddeloze omringt de rechtvaardige; daarom komt het recht verdraaid voort.", "2 Kron 19:7": "Nu dan, laat de vrees voor de HEERE op u zijn; wees zorgvuldig, en doe het; want bij de HEERE, onze God, is geen onrecht, geen aanneming van personen, en geen ontvangst van geschenken.", "Mal 2:10": "Hebben wij niet allen één Vader? Heeft niet één God ons geschapen? Waarom handelen wij dan trouweloos, de één tegen de ander, door het verbond van onze vaders te ontheiligen?", "Openb 21:23": "En de stad heeft de zon en de maan niet nodig, om in haar te schijnen; want de heerlijkheid van God heeft haar verlicht, en het Lam is haar lamp.", "Ps 18:26": "Bij de goedertierene houdt U Zich goedertieren, bij de oprechte man houdt U Zich oprecht.", "Ps 143:2": "En ga niet in het gericht met Uw knecht, want niemand die leeft, zal voor Uw aangezicht rechtvaardig zijn.", "Jes 26:15": "U, o HEERE, had dit volk vermeerderd, U had dit volk vermeerderd; U was verheerlijkt; maar U hebt hen tot alle einden van het aardrijk ver weggedaan.", "Openb 18:8": "Daarom zullen haar plagen op één dag komen, namelijk dood, en rouw, en honger, en zij zal met vuur verbrand worden; want sterk is de Heere God, Die haar oordeelt.", "Ps 89:15": "Gerechtigheid en gericht zijn de vastigheid van Uw troon; goedertierenheid en waarheid gaan voor Uw aangezicht heen.", "Job 16:17": "Terwijl er toch geen onrecht in mijn handen is, en mijn gebed zuiver is.", "Job 27:2-6": "Zo waarachtig als God leeft, Die mijn recht weggenomen heeft, en de Almachtige, Die mijn ziel bitterheid heeft aangedaan! Zo lang als mijn adem in mij zal zijn, en het geblaas van God in mijn neus; Indien mijn lippen onrecht zullen spreken, en indien mijn tong bedrog zal uitspreken!", "Ps 29:2-4": "Geef de HEERE de eer van Zijn Naam, aanbid de HEERE in de heerlijkheid van het heiligdom. De stem van de HEERE is op de wateren, de God van de ere dondert; de HEERE is op de grote wateren. De stem van de HEERE is met kracht, de stem van de HEERE is met heerlijkheid.", "Ps 53:3-5": "God heeft uit de hemel neergezien op de mensenkinderen, om te zien of iemand verstandig was, die God zocht. Een ieder van hen is teruggekeerd, samen zijn zij stinkend geworden, er is niemand die goed doet, ook niet één. Hebben dan de werkers van de ongerechtigheid geen kennis, die Mijn volk opeten, alsof zij brood aten? Zij roepen God niet aan.", "Luk 19:27": "Maar breng die vijanden van mij, die niet wilden dat ik koning over hen zou zijn, hier, en dood ze hier voor mij.", "Gen 3:4": "Toen zei de slang tegen de vrouw: U zult zeker niet sterven;", "Jer 17:12": "Een troon van heerlijkheid, een hoogheid van het eerste af aan, is de plaats van ons heiligdom.", "Gen 5:1": "Dit is het boek van Adams geslacht. Op de dag dat God de mens schiep, maakte Hij hem naar de gelijkenis van God.", "Jes 28:10": "Want het is gebod op gebod, gebod op gebod, regel op regel, regel op regel, hier een weinig, daar een weinig.", "Job 10:3": "Is het U goed, dat U verdrukt, dat U het werk van Uw handen verwerpt, en over de raad van de goddelozen schijnsel geeft?", "Jer 27:5": "Ik heb de aarde gemaakt, de mens en het vee die op de aardbodem zijn, door Mijn grote kracht en door Mijn uitgestrekte arm, en Ik geef ze aan wie het goed is in Mijn ogen.", "Joh 6:45": "Er is geschreven in de profeten: En zij zullen allen door God onderwezen zijn. Ieder dan die het van de Vader gehoord en geleerd heeft, komt tot Mij.", "Hebr 2:7": "U hebt hem een weinig minder gemaakt dan de engelen; met heerlijkheid en eer hebt U hem gekroond, en hebt U hem gesteld over de werken van Uw handen;", "Spr 16:2": "Alle wegen van een man zijn zuiver in zijn eigen ogen; maar de HEERE weegt de geesten.", "Jes 29:15": "Wee hun die zich diep willen verbergen voor de HEERE, hun raad verbergend; en wier werken in duisternis gebeuren, en zij zeggen: Wie ziet ons, en wie kent ons?", "Jes 35:2": "Zij zal uitbundig bloeien, en zich verheugen, ja, met verheuging, en juichen; de heerlijkheid van Libanon is haar gegeven, het sieraad van Karmel en Saron; zij zullen de heerlijkheid van de HEERE zien, het sieraad van onze God.", "Jes 29:21": "die een mens schuldig maken om een woord, en die strikken leggen voor hem die bestraft in de poort; en die de rechtvaardige verdrijven met valse argumenten.", "Ps 119:54": "Uw inzettingen zijn mij gezangen geweest, ter plaatse van mijn vreemdelingschap.", "Ex 2:23": "En het gebeurde na vele van deze dagen, toen de koning van Egypte gestorven was, dat de kinderen van Israël zuchtten en schreeuwden vanwege de dienst; en hun geroep vanwege hun dienst kwam op tot God.", "Ezech 28:2": "Mensenkind! Zeg tegen de vorst van Tyrus: Zo zegt de Heere HEERE: Omdat uw hart zich verheft en u zegt: Ik ben God, ik zit in de zetel van God, in het hart van de zeeën! terwijl u een mens bent en geen God, stelt u toch uw hart als het hart van God.", "Jes 50:7-10": "Want de Heere HEERE helpt Mij, daarom word Ik niet te schande; daarom heb Ik Mijn gezicht gemaakt als een keisteen, want Ik weet dat Ik niet beschaamd zal worden. Hij is nabij, Die Mij rechtvaardigt, wie zal met Mij twisten? Laten wij samen staan; wie heeft een rechtszaak tegen Mij? Laat hij hierheen komen tot Mij. Zie, de Heere HEERE helpt Mij, wie is het die Mij zal veroordelen? Zie, zij zullen allemaal verslijten als een kleed, de mot zal hen opeten.", "Ps 43:2": "Want U bent de God van mijn sterkte; waarom verstoot U mij dan? Waarom ga ik steeds in het zwart, vanwege de onderdrukking van de vijand?", "Ps 10:5": "Zijn wegen brengen altijd smart voort; Uw oordelen zijn een hoogte, ver van hem vandaan; al zijn tegenstanders, die blaast hij weg.", "Jes 40:5": "En de heerlijkheid van de HEERE zal geopenbaard worden; en alle vlees tegelijk zal zien, dat de mond van de HEERE het gesproken heeft.", "Jer 31:25": "Want Ik heb de vermoeide ziel dronken gemaakt, en Ik heb elke treurige ziel vervuld.", "Hand 14:17": "hoewel Hij Zichzelf toch niet zonder getuigenis gelaten heeft, doordat Hij goeddeed, ons vanuit de hemel regen en vruchtbare tijden gaf, en onze harten vervulde met voedsel en vreugde.", "Richt 9:57": "Op dezelfde manier liet God al het kwaad van de mensen van Sichem op hun hoofd terugkomen; en de vloek van Jotham, de zoon van Jerubbaäl, kwam over hen.", "Jer 5:12": "Zij verloochenen de HEERE, en zeggen: Hij is het niet, en ons zal geen kwaad overkomen, wij zullen geen zwaard en geen honger zien.", "Job 31:15": "Heeft Hij niet, Die mij in de buik maakte, hem ook gemaakt en Een ons in de baarmoeder bereid?)", "Hebr 2:15": "en zou verlossen allen die door angst voor de dood, heel hun leven lang, aan slavernij onderworpen waren.", "Jak 1:7": "Want laat die mens niet menen dat hij iets ontvangen zal van de Heere.", "Deut 32:4": "Hij is de Rotssteen, Wiens werk volkomen is; want al Zijn wegen zijn recht. God is waarheid, en is geen onrecht; rechtvaardig en recht is Hij.", "Jes 30:19": "Want het volk zal in Sion wonen, te Jeruzalem; u zult helemaal niet wenen; zeker zal Hij u genadig zijn op de stem van uw geroep; zodra Hij het horen zal, zal Hij u antwoorden.", "Openb 11:18": "en de volken waren toornig geworden, en Uw toorn is gekomen, en de tijd van de doden, om geoordeeld te worden, en om het loon te geven aan Uw dienstknechten, de profeten, en de heiligen, en aan hen die Uw Naam vrezen, de kleinen en de groten; en om hen te verderven die de aarde verdierven.", "Jes 33:1": "Wee u, verwoester, die zelf niet verwoest bent, en u, die trouweloos handelt, terwijl men niet trouweloos tegen u gehandeld heeft! Als u het verwoesten volbracht zult hebben, zult u verwoest worden; als u het trouweloos handelen voltooid zult hebben, zal men trouweloos tegen u handelen.", "Ps 94:17-19": "Als de HEERE mij geen Hulp was geweest, had mijn ziel bijna in de stilte gewoond. Toen ik zei: Mijn voet wankelt; Uw goedertierenheid, o HEERE! ondersteunde mij. Toen mijn gedachten in mij talrijk werden, hebben Uw vertroostingen mijn ziel verkwikt.", "Ps 55:3": "Merk op mij, en verhoor mij; ik bedrijf misbaar in mijn klacht, en maak getier;", "Jes 35:4": "Zegt tegen de onbedachtzamen van hart: Wees sterk, en vrees niet; zie, uw God zal ter wrake komen met de vergelding van God. Hij zal komen en u verlossen.", "Openb 15:3": "En zij zongen het gezang van Mozes, de dienstknecht van God, en het gezang van het Lam, en zeiden: Groot en wonderlijk zijn Uw werken, Heere, Gij almachtige God, rechtvaardig en waarachtig zijn Uw wegen, Gij Koning der heiligen!", "Job 22:22-27": "Ontvang toch de wet uit Zijn mond, en leg Zijn woorden in uw hart. Als u zich bekeert tot de Almachtige, zult u gebouwd worden; doe het onrecht ver van uw tenten. Dan zult u het goud op het stof leggen, en het goud van Ofir bij de rotssteen van de beken;", "Spr 19:29": "Gerichten zijn voor de spotters bereid, en slagen voor de rug van de dwazen.", "Mark 6:50": "want zij zagen Hem allen, en werden verschrikt; en meteen sprak Hij met hen, en zei tegen hen: Heb goede moed, Ik ben het; vrees niet.", "Jes 50:11": "Zie, u allen, die een vuur aansteekt, die u met vuurvonken omgordt! Wandel in de vlam van uw vuur, en in de vuurvonken die u ontstoken hebt. Dit overkomt u van Mijn hand: in smart zult u neerliggen.", "Jes 28:20": "Want het bed zal korter zijn dan dat men zich erop kan uitstrekken; en het deksel zal te smal zijn, als men zich eronder wikkelt.", "Ps 3:3": "Velen zeggen van mijn ziel: Hij heeft geen heil bij God. Sela.", "Nahum 1:7": "De HEERE is goed, Hij is een sterkte op de dag van benauwdheid, en Hij kent hen die op Hem vertrouwen.", "Joh 9:34": "Zij antwoordden en zeiden tegen hem: U bent helemaal in zonden geboren, en u leert ons? En zij wierpen hem eruit.", "Jes 22:11": "Ook zult u een gracht maken tussen beide de muren, voor het water van de oude vijver; maar u zult niet omhoogkijken naar Hem, Die dat gedaan heeft, en Hem niet aanmerken, Die dat van verre tijden gevormd heeft.", "Hand 23:11": "En de volgende nacht stond de Heere bij hem en zei: Heb goede moed, Paulus, want zoals u in Jeruzalem van Mij getuigd hebt, zo moet u ook in Rome getuigen.", "Spr 2:7": "Hij legt weg voor de oprechten een bestendig bezit; Hij is een schild voor hen die oprecht wandelen;", "Ps 34:5": "Daleth. Ik heb de HEERE gezocht, en Hij heeft mij geantwoord, en mij uit al mijn angsten gered.", "Zach 12:1": "De last van het woord van de HEERE over Israël. De HEERE spreekt, Die de hemel uitbreidt, en de aarde grondvest, en de geest van de mens in zijn binnenste formeert.", "Jer 32:19": "Groot van raad en machtig van daad; want Uw ogen zijn open over alle wegen van de mensenkinderen, om ieder te geven naar zijn wegen, en naar de vrucht van zijn handelingen.", "Rom 9:21": "Of heeft de pottenbakker geen macht over het leem, om uit dezelfde klomp het ene vat tot eer te maken, en het andere tot oneer?", "Jes 31:1": "Wee hun die naar Egypte om hulp aftrekken, en steunen op paarden, en vertrouwen op wagens, omdat er veel zijn, en op ruiters, omdat die zeer machtig zijn; en niet zien op de Heilige van Israël, en de HEERE niet zoeken.", "Ps 7:10": "Laat toch de slechtheid van de goddelozen een einde nemen, maar bevestig de rechtvaardige, U, Die harten en nieren doorziet, o rechtvaardige God!", "Ps 58:12": "En de mens zal zeggen: Zeker, er is vrucht voor de rechtvaardige; zeker, er is een God, Die op de aarde recht spreekt.", "Ps 27:6": "Ook nu zal mijn hoofd verhoogd worden boven mijn vijanden die rondom mij zijn, en ik zal in Zijn tent offeranden van het geschal offeren; ik zal zingen, ja, psalmzingen voor de HEERE.", "Num 16:3": "En zij verzamelden zich tegen Mozes en tegen Aäron, en zeiden tegen hen: Het is te veel voor u, want deze hele vergadering, zij allen, zijn heilig, en de HEERE is in hun midden; waarom verheft u zich dan boven de gemeente van de HEERE?", "Ex 33:23": "En wanneer Ik Mijn hand zal hebben weggenomen, zult u Mijn achterste delen zien; maar Mijn aangezicht zal niet gezien worden!", "Joh 1:4": "In Hem was het Leven, en het Leven was het Licht van de mensen.", "2 Sam 14:14": "Want wij moeten sterven, en zijn als water dat, uitgestort op de aarde, niet meer verzameld kan worden. God zal echter het leven niet wegnemen, maar Hij zal er middelen op bedenken, dat Hij de verstotene niet van Zich verstoot.", "Ps 89:33": "dan zal Ik hun overtreding met de roede bezoeken, en hun ongerechtigheid met plagen.", "Ef 1:14": "Die het onderpand is van onze erfenis, tot de verkregen verlossing, tot prijs van Zijn heerlijkheid.", "Ex 3:17": "Daarom heb Ik gezegd: Ik zal u uit de verdrukking van Egypte opvoeren, naar het land van de Kanaänieten, en de Hethieten, en de Amorieten, en de Ferezieten, en de Hevieten, en de Jebusieten; naar het land dat overvloeit van melk en honing.", "Ps 119:52": "Ik heb gedacht, o HEERE! aan Uw oordelen van oudsher, en heb mij getroost.", "Ps 10:6": "Hij zegt in zijn hart: Ik zal niet wankelen; want ik zal van geslacht tot geslacht in geen kwaad zijn.", "Amos 3:11": "Daarom, zo zegt de Heere HEERE: De vijand! En dat rondom het land! Die zal uw sterkte van u neerstorten, en uw paleizen zullen uitgeplunderd worden.", "Ps 34:20": "Resch. Veel is de tegenspoed van de rechtvaardige; maar uit dat alles redt de HEERE hem.", "Jes 49:13": "Juicht, hemelen! En verheug u, aarde! En bergen! Maakt gedreun met gejuich; want de HEERE heeft Zijn volk vertroost, en Hij zal Zich over Zijn ellendigen ontfermen.", "Spr 3:6": "Ken Hem in al uw wegen, en Hij zal uw paden recht maken.", "Luk 2:14": "Ere zij God in de hoogste hemelen, en vrede op aarde, in de mensen een welbehagen.", "Ps 31:25": "Wees sterk, en Hij zal uw hart versterken, allen u, die op de HEERE hoopt!", "Ps 76:10": "Toen God opstond ten oordeel, om alle zachtmoedigen van de aarde te verlossen. Sela.", "Jes 10:17": "Want het Licht van Israël zal tot een vuur zijn, en zijn Heilige tot een vlam, die in brand zal steken en verteren zal zijn doornen en zijn distels, op één dag.", "Joz 10:25": "Toen zei Jozua tot hen: Vrees niet en wees niet ontsteld, wees sterk en heb goede moed; want zo zal de HEERE aan al uw vijanden doen, tegen wie u strijdt.", "Num 15:31": "Want zij heeft het woord van de HEERE veracht en Zijn gebod vernietigd; die ziel zal helemaal uitgeroeid worden; haar ongerechtigheid is op haar.", "Spr 28:16": "Een vorst, die alle verstand mist, is ook zeer onderdrukkend; maar wie de hebzucht haat, zal de dagen verlengen.", "Openb 2:10": "Vrees niets van de dingen die u lijden zult. Zie, de duivel zal sommigen van u in de gevangenis werpen, opdat u beproefd wordt; en u zult een verdrukking hebben van tien dagen. Wees getrouw tot de dood, en Ik zal u de kroon des levens geven.", "Hos 7:2-4": "En zij zeggen niet in hun hart dat Ik al hun boosheid onthoud; nu omsingelen hun daden hen, zij zijn voor Mijn aangezicht. Zij verblijden de koning met hun boosheid, en de vorsten met hun leugens. Zij plegen allemaal samen overspel, zij zijn als een bakoven, die heet gemaakt is door de bakker; die ophoudt met opstoken nadat hij het deeg heeft gekneed, totdat het doorgezuurd is.", "Ef 1:12": "Opdat wij zouden zijn tot prijs van Zijn heerlijkheid, wij, die eerst op Christus gehoopt hebben.", "Gen 3:1": "De slang was listiger dan al het gedierte van het veld, dat de HEERE God gemaakt had; en zij zei tegen de vrouw: Is het echt zo dat God gezegd heeft: U zult niet eten van alle bomen in de hof?", "Ps 1:1": "Gelukkig is de man die niet wandelt in de raad van de goddelozen, noch staat op de weg van de zondaars, noch zit op de zetel van de spotters;", "Jer 33:9": "En het zal Mij zijn tot een vreugdevolle naam, tot een roem, en tot een sieraad bij alle heidenvolken van de aarde; die al het goede zullen horen dat Ik hun doe; en zij zullen vrezen en beven over al het goede, en over alle vrede die Ik hun geef.", "Ps 12:5": "Die zeggen: Wij zullen de overhand hebben met onze tong; onze lippen zijn onze! Wie is heer over ons?", "Deut 5:25": "Maar nu, waarom zouden wij sterven? Want dit grote vuur zou ons verteren; als wij nog langer de stem van de HEERE, onze God, blijven horen, zouden wij sterven.", "2 Tim 4:17": "Maar de Heere heeft mij bijgestaan en heeft mij kracht gegeven; opdat door mij de prediking ten volle bekend zou worden, en alle heidenen die zouden horen. En ik ben uit de muil van de leeuw verlost.", "Spr 29:13": "De arme en de bedrieger ontmoeten elkaar; de HEERE verlicht hun beider ogen.", "Mark 1:15": "en zei: De tijd is vervuld, en het Koninkrijk van God is nabijgekomen; bekeer u, en geloof het Evangelie.", "Ps 145:12": "Lamed. Om aan de mensenkinderen bekend te maken Zijn machtige daden, en de eer van de heerlijkheid van Zijn Koninkrijk.", "Ezech 9:10": "Daarom ook, wat Mij aangaat, Mijn oog zal niet verschonen, en Ik zal niet sparen; Ik zal hun weg op hun hoofd geven.", "Ps 129:4": "De HEERE, Die rechtvaardig is, heeft de touwen van de goddelozen afgehakt.", "Job 36:13": "En zij die met het hart huichelachtig zijn, stapelen toorn op; zij roepen niet, wanneer Hij hen gebonden heeft.", "Ps 19:2-7": "De hemelen vertellen Gods eer, en het uitspansel verkondigt het werk van Zijn handen. De dag aan de dag stort overvloedig spraak uit, en de nacht aan de nacht toont wetenschap. Geen spraak, en geen woorden zijn er, waar hun stem niet wordt gehoord.", "Job 32:7": "Ik zei: Laat de dagen spreken, en de veelheid van jaren wijsheid te kennen geven.", "Job 13:19": "Wie is hij die met mij twist? Want als ik nu zweeg, zou ik de geest geven.", "Pred 3:16": "Verder heb ik ook gezien onder de zon, op de plaats van het gericht, daar was goddeloosheid; en op de plaats van de gerechtigheid, daar was goddeloosheid.", "Pred 3:17": "Ik zei in mijn hart: God zal de rechtvaardige en de goddeloze oordelen; want daar is de tijd voor alle voornemen, en over alle werk.", "Job 22:3": "Is het voor de Almachtige nuttig, dat u rechtvaardig bent; of is het winst voor Hem, dat u uw wegen volmaakt maakt?", "Ef 3:21": "Hem, zeg ik, zij de heerlijkheid in de Gemeente, door Christus Jezus, tot in alle geslachten, tot in alle eeuwigheid. Amen.", "Openb 3:18": "Ik raad u aan dat u van Mij goud koopt, gelouterd door het vuur, opdat u rijk mag worden; en witte kleren, opdat u bekleed mag worden, en de schande van uw naaktheid niet openbaar wordt; en zalf uw ogen met ogenzalf, opdat u zien kunt.", "2 Kor 1:9": "Ja, wij hadden zelf al in onszelf het vonnis van de dood, opdat wij niet op onszelf zouden vertrouwen, maar op God, Die de doden opwekt;", "Amos 5:22": "Want al offert u Mij brandoffers, alsook uw spijsoffers, Ik heb er toch geen welgevallen aan; en het dankoffer van uw vette beesten wil Ik niet aanzien.", "Job 4:19": "Hoeveel te meer dan hen die in lemen huizen wonen, waarvan de grondslag in het stof is? Zij worden verbrijzeld voor de mot.", "Jes 1:24": "Daarom spreekt de Heere, HEERE van de heerscharen, de Machtige van Israël: O wee! Ik zal Mij troosten over Mijn tegenstanders. Ik zal Mij wreken op Mijn vijanden.", "Matt 5:10-12": "Zalig zijn zij die vervolgd worden om de gerechtigheid, want hun is het Koninkrijk der hemelen. Zalig bent u, als de mensen u smaden en vervolgen, en liegend allerlei kwaad tegen u spreken, omwille van Mij. Verblijd en verheug u, want uw loon is groot in de hemelen; want zo hebben zij de profeten vervolgd die vóór u geweest zijn.", "Matt 14:27": "Maar meteen sprak Jezus hen aan, en zei: Heb goede moed, Ik ben het, vreest niet.", "Spr 14:6": "De spotter zoekt wijsheid, en vindt niets; maar de kennis is voor de verstandige licht.", "Ps 59:7": "Tegen de avond keren zij terug, zij tieren als een hond, en gaan rond om de stad.", "Ps 26:2": "Proef mij, HEERE, en beproef mij; toets mijn nieren en mijn hart.", "Job 11:16-19": "Want u zult de moeite vergeten, en er aan denken als aan water dat voorbijgegaan is. Ja, uw levenstijd zal helderder dan de middag oprijzen; u zult stralen, als de morgenstond zult u zijn. En u zult vertrouwen, omdat er verwachting zal zijn; en u zult graven, gerust zult u slapen;", "Joh 16:33": "Deze dingen heb Ik tot u gesproken, opdat u in Mij vrede hebt. In de wereld zult u verdrukking hebben, maar heb goede moed, Ik heb de wereld overwonnen.", "Ps 94:2": "Gij, Rechter der aarde! Verhef U; breng vergelding weer over de hoogmoedigen.", "Jes 14:31": "Huil, u poort, schreeuw, u stad! u bent gesmolten, u helemaal Palestina! want van het noorden komt een rook, en er is geen eenzame in zijn samenkomsten.", "Joh 14:1": "Laat uw hart niet ontroerd worden; u gelooft in God, geloof ook in Mij.", "Job 9:28": "Dan schroom ik voor al mijn smarten; ik weet dat U mij niet onschuldig zult houden.", "2 Tim 2:12": "als wij volharden, zullen wij ook met Hem heersen; als wij Hem verloochenen, zal Hij ons ook verloochenen;", "Matt 25:34-36": "Dan zal de Koning zeggen tegen hen die aan Zijn rechterhand zijn: Kom, u gezegenden van Mijn Vader! Beërf het Koninkrijk dat voor u bereid is vanaf de grondlegging van de wereld. Want Ik ben hongerig geweest, en u hebt Mij te eten gegeven; Ik ben dorstig geweest, en u hebt Mij te drinken gegeven; Ik was een vreemdeling, en u hebt Mij een onderkomen gegeven. Ik was naakt, en u hebt Mij gekleed; Ik ben ziek geweest, en u hebt Mij bezocht; Ik was in de gevangenis, en u bent bij Mij gekomen.", "Luk 18:18-23": "En een zekere leider vroeg Hem: Goede Meester, wat moet ik doen om het eeuwige leven te beërven? En Jezus zei tegen hem: Waarom noemt u Mij goed? Niemand is goed, dan Een, namelijk God. U kent de geboden: U zult geen overspel doen; u zult niet doden; u zult niet stelen; u zult geen valse getuigenis geven; eer uw vader en uw moeder.", "Zef 1:8": "En het zal gebeuren in de dag van het slachtoffer van de HEERE, dat Ik bezoeking zal doen over de vorsten, en over de kinderen van de koning, en over allen die zich kleden met vreemde kleding.", "Job 15:25": "Want hij strekt tegen God zijn hand uit, en tegen de Almachtige stelt hij zich geweldig aan.", "Jes 29:23": "want wanneer hij zijn kinderen, het werk van Mijn handen, zal zien in zijn midden, zullen zij Mijn Naam heiligen; en zij zullen de Heilige van Jakob heiligen, en de God van Israël vrezen.", "Jer 8:7": "Zelfs een ooievaar aan de hemel kent zijn vaste tijden, en een tortelduif, en kraanvogel, en zwaluw, nemen de tijd van hun aankomst waar; maar Mijn volk kent het recht van de HEERE niet.", "Matt 19:16-22": "En zie, er kwam iemand naar Hem toe, en zei tegen Hem: Goede Meester! Wat goeds zal ik doen, opdat ik het eeuwige leven heb? En Hij zei tegen hem: Wat noemt u Mij goed? Niemand is goed dan Eén, namelijk God. Maar wilt u het leven ingaan, onderhoud de geboden. Hij zei tegen Hem: Welke? En Jezus zei: Deze: U zult niet doden; u zult geen overspel doen; u zult niet stelen; u zult geen valse getuigenis geven;", "Joh 16:14": "Hij zal Mij verheerlijken; want Hij zal het uit het Mijne nemen, en het u verkondigen.", "Matt 10:29-31": "Worden niet twee musjes voor een penninkje verkocht? En niet één daarvan zal op de aarde vallen zonder uw Vader. En ook uw haren van het hoofd zijn alle geteld. Vreest dan niet; u gaat vele musjes te boven.", "Jer 2:32": "Vergeet ook een jonkvrouw haar versiersel, of een bruid haar bindselen? Toch heeft Mijn volk Mij vergeten, dagen zonder getal.", "Ps 52:9": "Zie de man, die God niet tot Zijn Sterkte stelde, maar vertrouwde op de overvloed van het rijkdom; hij was sterk geworden door zijn beschadigen.", "Spr 29:26": "Velen zoeken de gunst van de heerser; maar ieders recht is van de HEERE.", "Hos 8:2": "Dan zullen zij tot Mij roepen: Mijn God! Wij, Israël, kennen U.", "Jes 14:32": "Wat zal men dan antwoorden aan de boden van het volk? Dat de HEERE Sion gegrond heeft, opdat de bedrukten van Zijn volk daarin een toevlucht zouden hebben.", "1 Kor 1:30": "Maar uit Hem bent u in Christus Jezus, Die voor ons geworden is wijsheid van God, en rechtvaardigheid, en heiligmaking, en verlossing;", "Ps 62:2": "Zeker, mijn ziel is stil bij God; van Hem is mijn heil.", "Jes 17:10": "Want u hebt de God van uw heil vergeten, en niet gedacht aan de Rotssteen van uw sterkte; daarom zult u wel liefelijke planten planten, en die met uitheemse ranken bezetten;", "Jer 48:42": "Want Moab zal verdelgd worden, zodat hij geen volk meer is, omdat hij zich groot gemaakt heeft tegen de HEERE.", "Matt 11:25-27": "In diezelfde tijd antwoordde Jezus en zei: Ik dank U, Vader! Heere van de hemel en van de aarde! Dat U deze dingen voor de wijzen en verstandigen verborgen hebt, en die aan de kinderen geopenbaard hebt. Ja, Vader! Want zo is het welbehagen geweest voor U. Alle dingen zijn Mij overgegeven door Mijn Vader; en niemand kent de Zoon dan de Vader, en niemand kent de Vader dan de Zoon, en wie het de Zoon wil openbaren.", "Jes 5:19": "Die zeggen: Laat Hij haasten, laat Hij Zijn werk bespoedigen, opdat wij het zien; en laat het raadsbesluit van de Heilige van Israël naderen en komen, opdat wij het vernemen!", "Jer 14:12": "Ofschoon zij vasten, zal Ik naar hun geschrei niet horen, en ofschoon zij brandoffer en spijsoffer offeren, zal Ik aan hen geen welgevallen hebben; maar door het zwaard, en door de honger, en door de pest zal Ik hen verteren.", "Ps 145:5": "He. Ik zal uitspreken de heerlijkheid van de eer van Uw majesteit, en Uw wonderlijke daden.", "Jes 41:10": "Vrees niet, want Ik ben met u; wees niet verbaasd, want Ik ben uw God; Ik sterk u, ook help Ik u, ook ondersteun Ik u met de rechterhand van Mijn gerechtigheid.", "Jes 2:10": "Ga in de rotssteen, en verberg u in het stof, vanwege de schrik van de HEERE, en om de heerlijkheid van Zijn majesteit.", "Matt 9:10-13": "En het gebeurde, toen Hij aan tafel lag in het huis van Mattheüs, zie, veel tollenaars en zondaars kwamen en gingen mee aan tafel, met Jezus en Zijn discipelen. En de Farizeeën zagen dit en zeiden tegen Zijn discipelen: Waarom eet uw Meester met de tollenaars en de zondaars? Maar Jezus hoorde dat en zei tegen hen: Wie gezond zijn hebben de dokter niet nodig, maar wie ziek zijn.", "Ps 27:14": "Wacht op de HEERE, wees sterk, en Hij zal uw hart versterken; ja, wacht op de HEERE.", "Jes 60:6": "Een menigte kamelen zal u bedekken, de snelle kamelen van Midian en Hefa; zij allen uit Scheba zullen komen; goud en wierook zullen zij aanbrengen, en zij zullen de overvloedige lof van de HEERE verkondigen.", "Hos 7:5": "Het is de dag van onze koning; de vorsten maken hem ziek door verhitting van de wijn; hij strekt zijn hand uit met de spotters.", "Zef 3:16": "Op die dag zal tegen Jeruzalem gezegd worden: Vrees niet, o Sion! Laat uw handen niet slap worden.", "Joh 14:18": "Ik zal u niet als wezen achterlaten; Ik kom weer naar u toe.", "Ps 113:4": "De HEERE is hoog boven alle heidenvolken, boven de hemelen is Zijn heerlijkheid.", "Hand 17:23-28": "Want toen ik door de stad liep en uw heiligdommen bekeek, vond ik ook een altaar waarop een opschrift stond: AAN DE ONBEKENDE GOD. Hem dan, Die u niet kent en toch dient, verkondig ik u. De God Die de wereld gemaakt heeft en alles wat daarin is; Deze, Die een Heere is van hemel en aarde, woont niet in tempels die met handen gemaakt zijn; En wordt ook niet door mensenhanden gediend, alsof Hij iets nodig zou hebben, omdat Hij Zelf aan allen het leven, en de adem, en alle dingen geeft;", "Luk 6:21-23": "Zalig bent u, die nu honger hebt; want u zult verzadigd worden. Zalig bent u, die nu weent; want u zult lachen. Zalig bent u, wanneer de mensen u haten, en wanneer zij u buitensluiten, en u smaden, en uw naam als kwaad verwerpen, omwille van de Zoon des mensen. Verblijd u op die dag, en wees vrolijk; want zie, uw loon is groot in de hemel; want hun vaders deden hetzelfde met de profeten.", "Hebr 10:30": "Want wij kennen Hem, Die gezegd heeft: Aan Mij is de wraak, Ik zal het vergelden, zegt de Heere. En opnieuw: De Heere zal Zijn volk oordelen.", "Job 8:3": "Zou God dan het recht verdraaien? En zou de Almachtige de gerechtigheid verdraaien?", "Neh 9:20": "En U hebt Uw goede Geest gegeven om hen te onderwijzen; en Uw Manna hebt U niet geweerd van hun mond, en water hebt U hun gegeven voor hun dorst.", "Dan 4:37": "Nu prijs ik, Nebukadnezar, en verhoog, en verheerlijk de Koning van de hemel, omdat al Zijn werken waarheid, en Zijn paden gerechtigheid zijn; en Hij is machtig te vernederen wie in hoogmoed wandelen.", "Amos 5:18": "Wee hen die de dag van de HEERE verlangen! Waartoe toch zal de dag van de HEERE u zijn? Hij zal duisternis zijn en geen licht.", "Klaagl 3:57": "Koph. U bent tot mij genaderd op de dag dat ik U aanriep; U hebt gezegd: Vrees niet!", "Ps 111:7": "Mem. De werken van Zijn handen zijn waarheid en oordeel; Nun. al Zijn bevelen zijn betrouwbaar.", "Job 9:14": "Hoeveel te minder zal ik Hem antwoorden, en mijn woorden uitkiezen tegen Hem?", "Hebr 12:23": "Tot de algemene vergadering en de gemeente van de eerstgeborenen, die in de hemelen opgeschreven zijn, en tot God, de Rechter over allen, en de geesten van de rechtvaardigen die volmaakt gemaakt zijn;", "Spr 29:4": "Een koning houdt het land staande door recht; maar wie tot geschenken geneigd is, verstoort het.", "Job 21:15": "Wat is de Almachtige, dat wij Hem zouden dienen? En wat baat zouden wij hebben, dat wij Hem zouden aanroepen?", "Ps 10:15": "Breek de arm van de goddeloze en de bozen; zoek zijn goddeloosheid, totdat U haar niet meer vindt.", "Spr 20:6": "Elk van de menigte van de mensen roept zijn eigen weldadigheid uit; maar wie zal een echt trouwe man vinden?", "Gal 6:2": "Draag elkaars lasten, en vervul zo de wet van Christus.", "Ps 19:2-5": "De hemelen vertellen Gods eer, en het uitspansel verkondigt het werk van Zijn handen. De dag aan de dag stort overvloedig spraak uit, en de nacht aan de nacht toont wetenschap. Geen spraak, en geen woorden zijn er, waar hun stem niet wordt gehoord.", "Jes 30:9-13": "Want het is een opstandig volk; het zijn leugenachtige kinderen; kinderen die de wet van de HEERE niet willen horen. Die tegen de zieners zeggen: Ziet niet; en tegen de schouwers: Schouwt ons niet wat recht is; spreekt tot ons zachte dingen, schouwt ons bedriegerijen. Wijkt af van de weg, maakt u van het pad; laat de Heilige van Israël van ons ophouden!", "Ps 85:11": "De goedertierenheid en waarheid zullen elkaar ontmoeten; de gerechtigheid en vrede zullen elkaar kussen.", "Openb 4:11": "U, Heere, bent waardig te ontvangen de heerlijkheid, en de eer, en de kracht; want U hebt alle dingen geschapen, en door Uw wil zijn zij, en zijn zij geschapen.", "Klaagl 1:18": "Tsade. De HEERE is rechtvaardig, want ik ben Zijn mond opstandig geweest; hoort toch, alle volken, en ziet mijn smart; mijn jonkvrouwen en mijn jongelingen zijn in de gevangenschap gegaan.", "Hebr 11:7": "Door het geloof heeft Noach, door God gewaarschuwd over de dingen die nog niet gezien werden, en bevreesd geworden, de ark gebouwd tot redding van zijn huisgezin; door dit geloof heeft hij de wereld veroordeeld, en is hij een erfgenaam geworden van de rechtvaardigheid die naar het geloof is.", "Gen 31:42": "Als de God van mijn vader, de God van Abraham, en de Vreze van Izak, niet bij mij was geweest, dan had u mij zeker nu met lege handen weggezonden! God heeft mijn ellende, en de arbeid van mijn handen, gezien, en heeft u gisteravond bestraft.", "Ps 9:9": "En Hij Zelf zal de wereld richten in gerechtigheid, en de volken oordelen in rechtmatigheden.", "Ps 123:4": "Onze ziel is veel te zat van de spot van de weldenkenden, van de verachting van de hoogmoedigen.", "Gen 19:29": "En het gebeurde, toen God de steden van deze vlakte verwoestte, dat God aan Abraham dacht, en Hij leidde Lot weg uit het midden van deze omkering, toen Hij de steden omkeerde waarin Lot gewoond had.", "Zef 3:17": "De HEERE, uw God, is in uw midden, een Held, Die verlossen zal; Hij zal Zich over u verblijden met blijdschap, Hij zal zwijgen in Zijn liefde, Hij zal Zich over u verheugen met gejuich.", "Luk 15:2": "En de Farizeeën en de Schriftgeleerden mopperden en zeiden: Deze man ontvangt de zondaars, en eet met hen.", "Luk 4:23": "En Hij zei tegen hen: U zult zonder twijfel dit spreekwoord tegen Mij zeggen: Dokter, genees Uzelf; al wat wij gehoord hebben dat in Kapernaüm gebeurd is, doe dat ook hier in Uw vaderland.", "Matt 17:18-20": "En Jezus bestrafte hem, en de duivel ging uit hem weg, en het kind werd vanaf dat moment genezen. Toen kwamen de discipelen apart naar Jezus toe en zeiden: Waarom konden wij hem niet uitdrijven? En Jezus zei tegen hen: Vanwege uw ongeloof; want voorwaar, Ik zeg u: als u een geloof had als een mosterdzaad, zou u tegen deze berg zeggen: Ga van hier daarheen, en hij zou gaan; en niets zou voor u onmogelijk zijn.", "Ex 4:12": "En nu ga heen, en Ik zal met uw mond zijn, en zal u leren, wat u spreken zult.", "Ps 88:12-17": "Zal Uw goedertierenheid in het graf verteld worden, Uw trouw in het verderf? Zullen Uw wonderen bekend worden in de duisternis, en Uw gerechtigheid in het land van de vergetelheid? Maar ik, HEERE, roep tot U, en mijn gebed komt U al voor in de morgenstond.", "Job 4:3": "Zie, u hebt velen onderwezen, en u hebt slappe handen gesterkt;", "Joh 13:31": "Toen hij dan naar buiten gegaan was, zei Jezus: Nu is de Zoon des mensen verheerlijkt, en God is in Hem verheerlijkt.", "Ex 40:34": "Toen bedekte de wolk de tent der samenkomst; en de heerlijkheid van de HEERE vervulde de tabernakel.", "Jes 42:3": "Het geknakte riet zal Hij niet breken, en de rokende vlaswiek zal Hij niet uitblussen; met waarheid zal Hij het recht voortbrengen.", "Job 32:8": "Zeker, de geest die in de mens is, en de inblazing van de Almachtige, maakt hen verstandig.", "Matt 22:23": "Diezelfde dag kwamen de Sadduceeën naar Hem toe, die zeggen dat er geen opstanding is, en vroegen Hem,", "Mark 10:17-22": "En toen Hij de weg opging, kwam er iemand aanlopen, en viel voor Hem op de knieën, en vroeg Hem: Goede Meester, wat moet ik doen om het eeuwige leven te beërven? En Jezus zei tegen hem: Waarom noemt u Mij goed? Niemand is goed, dan Eén, namelijk God. U kent de geboden: U zult geen overspel plegen; u zult niet doden; u zult niet stelen; u zult geen vals getuigenis geven; u zult niemand tekortdoen; eer uw vader en uw moeder.", "Mal 3:8": "Zal een mens God beroven? Maar u berooft Mij, en zegt: Waarin beroven wij U? In de tienden en het hefoffer.", "Matt 12:37": "Want uit uw woorden zult u gerechtvaardigd worden, en uit uw woorden zult u veroordeeld worden.", "Zach 7:13": "Daarom is het gebeurd, zoals Hij geroepen had en zij niet gehoord hebben, dat zij ook riepen, maar Ik niet hoorde, zegt de HEERE van de heerscharen;", "Ps 145:17": "Tsade. De HEERE is rechtvaardig in al Zijn wegen, en goedertieren in al Zijn werken.", "Jes 66:1": "Zo zegt de HEERE: De hemel is Mijn troon, en de aarde is de voetbank van Mijn voeten; waar zou dat huis zijn, dat u Mij zou bouwen, en waar is de plaats van Mijn rust?", "Jer 2:23": "Hoe zegt u: Ik ben niet verontreinigd, ik heb de Baäls niet nagewandeld? Zie uw weg in het dal, ken wat u gedaan hebt, u lichte, snelle kemelin, die haar wegen verdraait!", "1 Petr 4:19": "Laten dan ook zij die lijden naar de wil van God, hun zielen aan Hem, als de trouwe Schepper, toevertrouwen door goed te doen.", "Num 14:27-34": "Hoelang zal Ik het bij deze slechte vergadering uithouden, die tegen Mij morren? Ik heb het gemor van de kinderen van Israël gehoord, waarmee zij tegen Mij morren. Zeg tegen hen: Zo waarachtig als Ik leef, spreekt de HEERE, zoals u in Mijn oren gesproken hebt, zo zal Ik u doen! Uw dode lichamen zullen in deze woestijn vallen; en al uw getelden, naar uw hele aantal, van twintig jaar oud en daarboven, u die tegen Mij gemord hebt.", "2 Kon 2:24": "En hij keerde zich achterom, en hij zag hen, en vervloekte hen, in de Naam van de HEERE. Toen kwamen er twee berinnen uit het woud, en verscheurden van hen tweeënveertig kinderen.", "2 Petr 3:3-5": "Dit moet u eerst weten, dat er in de laatste dagen spotters zullen komen, die naar hun eigen begeerten zullen wandelen, En zeggen: Waar is de belofte van Zijn komst? Want vanaf de dag dat de vaders ontslapen zijn, blijven alle dingen zo, net zoals vanaf het begin van de schepping. Want willens en wetens is dit hun onbekend, dat door het woord van God de hemelen er van oudsher geweest zijn, en de aarde ontstaan is uit het water en door het water in stand blijft;", "Ps 50:21": "Deze dingen doet u, en Ik zwijg; u meent dat Ik helemaal ben zoals u; Ik zal u straffen, en zal het ordelijk voor uw ogen op een rij zetten.", "Gen 16:5": "Toen zei Sarai tegen Abram: Het onrecht mij aangedaan komt op u neer; ik heb mijn dienstmaagd in uw schoot gegeven; nu zij ziet dat zij zwanger is geworden, ben ik veracht in haar ogen; de HEERE oordele tussen mij en tussen u!", "Jes 57:15": "Want zo zegt de Hoge en Verhevene, Die in de eeuwigheid woont, en Wiens Naam heilig is: Ik woon in de hoogte en in het heilige, en bij hem die een verbrijzelde en nederige geest heeft, om de geest van de nederigen levend te maken, en om het hart van de verbrijzelden levend te maken.", "Ps 92:16": "Om te verkondigen dat de HEERE recht is; Hij is mijn Rotssteen, en in Hem is geen onrecht.", "Fil 4:19": "Maar mijn God zal naar Zijn rijkdom al wat u nodig hebt vervullen, in heerlijkheid, door Christus Jezus.", "Ps 7:12": "God is een rechtvaardige Rechter, en een God, Die iedere dag toornt.", "Deut 5:5": "(ik stond in die tijd tussen de HEERE en tussen u, om u het woord van de HEERE bekend te maken; want u was bang voor het vuur en klom niet op de berg) en Hij zei:", "Job 9:11": "Zie, Hij zal aan mij voorbijgaan, en ik zal Hem niet zien; en Hij zal voorbijgaan, en ik zal Hem niet merken.", "Jes 64:8": "Doch nu, HEERE! U bent onze Vader; wij zijn leem, en U bent onze pottenbakker, en wij allen zijn het werk van Uw handen.", "Ps 51:6": "Tegen U, U alleen, heb ik gezondigd, en gedaan wat kwaad is in Uw ogen; opdat U rechtvaardig bent in Uw spreken, en rein bent in Uw oordelen.", "Ps 106:30": "Toen stond Pinehas op, en hij voerde het oordeel uit, en de plaag werd opgehouden.", "Ex 3:9": "En nu, zie, het geschrei van de kinderen van Israël is tot Mij gekomen; en ook heb Ik de verdrukking gezien waarmee de Egyptenaren hen verdrukken.", "Job 22:13": "Daarom zegt u: Wat weet God ervan? Zal Hij door de donkere wolk oordelen?", "Ezech 1:26-28": "En boven het uitspansel dat boven hun hoofden was, was de gelijkenis van een troon, als de gedaante van een saffiersteen; en op de gelijkenis van de troon was de gelijkenis als de gedaante van een mens, daarboven op zittend. En ik zag iets als de kleur van amber, als de gedaante van vuur rondom daarbinnen, vanaf de gedaante van Zijn lendenen en opwaarts; en vanaf de gedaante van Zijn lendenen en neerwaarts, zag ik iets als de gedaante van vuur, en een glans rondom Hem. Zoals de gedaante van de boog die in de wolk is op de dag van de regen, zo was de gedaante van de glans rondom; dit was de gedaante van de gelijkenis van de heerlijkheid van de HEERE; en toen ik het zag, viel ik op mijn gezicht, en ik hoorde een stem van Iemand Die sprak.", "Ps 69:21": "De smaad heeft mijn hart gebroken, en ik ben zeer zwak; en ik heb gewacht op medelijden, maar er is geen; en op vertroosters, maar heb ze niet gevonden.", "Jes 63:9": "In al hun benauwdheid was Hij benauwd, en de Engel van Zijn aangezicht heeft hen behouden; door Zijn liefde en door Zijn genade heeft Hij hen verlost; en Hij nam hen op, en Hij droeg hen al de dagen van ouds.", "1 Kon 8:32": "hoor Ú dan in de hemel, en doe, en oordeel Uw dienaren, veroordeel de onrechtvaardige door zijn weg op zijn hoofd te leggen, en verklaar de rechtvaardige rechtvaardig door hem te geven naar zijn gerechtigheid.", "Num 16:41": "Maar de volgende dag morde de hele vergadering van de kinderen van Israël tegen Mozes en tegen Aäron, en zei: U hebt het volk van de HEERE gedood!", "1 Kron 16:25": "Want de HEERE is groot, en zeer te prijzen, en Hij is te vrezen boven alle goden.", "Jes 54:4": "Vrees niet, want u zult niet beschaamd worden, en word niet schaamrood, want u zult niet te schande worden; maar u zult de schaamte van uw jonkheid vergeten, en de smaad van het weduwschap zult u niet meer gedenken.", "Ps 102:18": "Zich gewend zal hebben tot het gebed van hem die geheel ontbloot is, en niet versmaad hebben hun gebed;", "Ps 10:18": "Om de wees en verdrukte recht te doen, opdat een mens van de aarde niet meer voortvaart geweld te bedrijven.", "Joh 9:39-41": "En Jezus zei: Ik ben tot een oordeel in deze wereld gekomen, opdat zij die niet zien, zien mogen, en zij die zien, blind worden. En dit hoorden enkelen van de Farizeeën die bij Hem waren, en zij zeiden tegen Hem: Zijn wij dan ook blind? Jezus zei tegen hen: Als u blind was, zou u geen zonde hebben; maar nu zegt u: Wij zien; daarom blijft uw zonde.", "Rom 8:34": "Wie is het die veroordeelt? Christus is het Die gestorven is; ja, meer nog, Die ook opgewekt is, Die ook aan de rechterhand van God is, Die ook voor ons bidt.", "2 Sam 22:28": "En U verlost het bedrukte volk; maar Uw ogen zijn tegen de hoogmoedigen, U zult hen vernederen.", "Deut 1:45": "Toen u terugkwam en huilde voor het aangezicht van de HEERE, luisterde de HEERE niet naar uw stem, en neigde Zijn oren niet tot u.", "Pred 11:9": "Verblijd u, jongeman, in uw jeugd, en laat uw hart zich vermaken in de dagen van uw jongelingschap, en wandel in de wegen van uw hart, en in wat uw ogen zien; maar weet dat God u, om al deze dingen, voor het gericht zal doen komen.", "Ex 34:29-35": "En het gebeurde, toen Mozes van de berg Sinaï afdaalde (de twee tafelen van de getuigenis nu waren in de hand van Mozes, toen hij van de berg afdaalde), dat Mozes niet wist dat de huid van zijn aangezicht straalde, doordat Hij met hem gesproken had. Toen Aäron nu en al de kinderen van Israël Mozes aanzagen, zie, zo straalde de huid van zijn aangezicht; daarom waren zij bang om naar hem toe te gaan. Toen riep Mozes hen; en Aäron, en al de leiders in de vergadering keerden terug naar hem; en Mozes sprak tot hen.", "Jes 58:10": "En als u uw ziel opent voor de hongerige, en de bedrukte ziel verzadigt; dan zal uw licht in de duisternis opgaan, en uw donkerheid zal zijn als de middag.", "Joh 5:44": "Hoe kunt u geloven, u die eer van elkaar aanneemt, en de eer die van God alleen is, niet zoekt?", "Job 9:19": "Als het op kracht aankomt, zie, Hij is sterk; en als het op recht aankomt, wie zal mij dagvaarden?", "Ps 107:11": "Omdat zij opstandig waren geweest tegen Gods geboden, en de raad van de Allerhoogste onwaardig verworpen hadden.", "Ps 68:25": "O God! Zij hebben Uw gangen gezien, de gangen van mijn God, mijn Koning, in het heiligdom.", "Spr 28:13": "Wie zijn overtredingen bedekt, zal geen voorspoed hebben; maar wie ze belijdt en laat, zal barmhartigheid ontvangen.", "Joh 12:28": "Vader, verheerlijk Uw Naam. Er kwam dan een stem uit de hemel, die zei: En Ik heb Hem verheerlijkt, en Ik zal Hem opnieuw verheerlijken.", "Ps 71:17": "O God! Gij hebt mij geleerd van mijn jeugd af aan, en tot nog toe verkondig ik Uw wonderen.", "Ps 11:5": "De HEERE beproeft de rechtvaardige; maar de goddeloze, en wie geweld liefheeft, haat Zijn ziel.", "Jes 31:2": "Toch is Hij ook wijs, en Hij doet het kwaad komen, en trekt Zijn woorden niet terug; maar Hij zal Zich opmaken tegen het huis van de boosdoeners, en tegen de hulp van hen die ongerechtigheid werken.", "Spr 1:24-28": "Omdat Ik geroepen heb, en u geweigerd hebt; Mijn hand uitgestrekt heb, en er niemand was die opmerkte; En u al Mijn raad verworpen hebt, en Mijn bestraffing niet gewild hebt; Zo zal Ik ook in uw verderf lachen; Ik zal spotten, wanneer uw vrees komt.", "Gen 18:24-33": "Misschien zijn er vijftig rechtvaardigen in de stad; zult U hen ook ombrengen, en de plaats niet sparen, omwille van de vijftig rechtvaardigen die daarin zijn? Het zij verre van U, zoiets te doen, de rechtvaardige te doden met de goddeloze! zodat de rechtvaardige zou zijn als de goddeloze, verre zij het van U! zou de Rechter van de hele aarde geen recht doen? Toen zei de HEERE: Als Ik in Sodom, binnen de stad, vijftig rechtvaardigen zal vinden, dan zal Ik de hele plaats sparen omwille van hen.", "Ef 6:8": "wetende dat ieder, wat goed hij ook zal hebben gedaan, dat hij dat van de Heere zal ontvangen, of hij dienstknecht is of vrije.", "Hebr 2:14": "Omdat nu de kinderen deel hebben aan vlees en bloed, heeft Hij Zelf op dezelfde manier daaraan deelgenomen, opdat Hij door de dood hem teniet zou doen die de macht over de dood had, dat is: de duivel;", "Job 36:19": "Zou Hij uw rijkdom achten, zodat u niet in benauwdheid zou zijn; of alle versterkingen van kracht?", "Ps 96:4": "Want de HEERE is groot, en zeer te prijzen; Hij is ontzagwekkend boven alle goden.", "1 Petr 1:17": "En als u Hem als Vader aanroept, Die zonder aanzien des persoons oordeelt naar ieders werk, leef dan in ontzag gedurende de tijd van uw verblijf hier als vreemdeling;", "Luk 18:3-7": "En er was een zekere weduwe in dezelfde stad, en zij kwam naar hem toe en zei: Doe mij recht tegenover mijn tegenpartij. En hij wilde dat een lange tijd niet; maar daarna zei hij bij zichzelf: Hoewel ik God niet vrees en geen mens ontzie, toch, omdat deze weduwe het mij zo moeilijk maakt, zal ik haar recht doen, zodat ze niet uiteindelijk komt en mij uitput.", "Jes 66:2": "Want Mijn hand heeft al deze dingen gemaakt, en al deze dingen zijn geweest, spreekt de HEERE; maar op deze zal Ik zien, op de arme en verslagene van geest, en die voor Mijn woord beeft.", "Ps 62:6-9": "Maar u, o mijn ziel! zwijg voor God; want van Hem is mijn verwachting. Hij is zeker mijn Rots en mijn Heil, mijn Hoog Vertrek; ik zal niet wankelen. In God is mijn Heil en mijn Eer; de Rots van mijn sterkte, mijn Toevlucht is in God.", "Ezech 21:26": "Zo zegt de Heere HEERE: Doe die hoed weg, en neem die kroon af; deze zal niet dezelfde blijven; Ik zal verhogen wie nederig is, en vernederen wie hoog is.", "Ps 46:11": "Laat af, en weet, dat Ik God ben; Ik zal verhoogd worden onder de heidenen, Ik zal verhoogd worden op de aarde.", "Rom 15:4": "Want al wat vroeger geschreven is, dat is tot onze lering geschreven, opdat wij, door lijdzaamheid en vertroosting van de Schriften, hoop zouden hebben.", "Ps 139:14": "Ik loof U, omdat ik op een heel ontzagwekkende wijze wonderbaarlijk gemaakt ben; wonderlijk zijn Uw werken! Ook weet mijn ziel het zeer goed.", "Job 33:16": "Dan openbaart Hij het voor het oor der mensen, en Hij verzegelt hun kastijding;", "Jes 10:18": "Ook zal Hij verteren de heerlijkheid van zijn woud en van zijn vruchtbare veld; van de ziel af, tot het vlees toe; en hij zal zijn, zoals wanneer een vaandeldrager versmelt.", "Jer 2:22": "Want, al wast u zich met salpeter, en nam u veel zeep, toch is uw ongerechtigheid voor Mijn aangezicht getekend, spreekt de Heere HEERE.", "Joh 1:7-9": "Deze kwam tot een getuigenis, om van het Licht te getuigen, opdat zij allen door hem geloven zouden. Hij was het Licht niet, maar was gezonden, opdat hij van het Licht getuigen zou. Dit was het waarachtige Licht, Dat ieder mens verlicht die in de wereld komt.", "Joh 15:23-25": "Die Mij haat, die haat ook Mijn Vader. Als Ik de werken onder hen niet had gedaan, die niemand anders gedaan heeft, hadden zij geen zonde; maar nu hebben zij ze gezien, en hebben zowel Mij als Mijn Vader gehaat. Maar dit gebeurt, zodat het woord vervuld wordt dat in hun wet geschreven is: Zij hebben Mij zonder oorzaak gehaat.", "Jes 5:25": "Daarom is de toorn van de HEERE ontstoken tegen Zijn volk, en heeft Hij Zijn hand tegen hen uitgestrekt, en heeft Hij hen geslagen, zodat de bergen hebben gebeefd, en hun dode lichamen zijn geworden als vuil in het midden van de straten. Om dit alles keert Zijn toorn zich niet af, maar Zijn hand is nog uitgestrekt.", "Hos 2:14": "En Ik zal haar haar wijngaarden geven van daaraf, en het dal Achor, tot een deur van hoop; en daar zal zij zingen, als in de dagen van haar jeugd, en als op de dag dat zij optrok uit Egypteland.", "Job 15:14": "Wat is de mens, dat hij zuiver zou zijn, en die geboren is van een vrouw, dat hij rechtvaardig zou zijn?", "Job 22:2": "Zal een man God voordelig zijn? Maar voor zichzelf zal de verstandige voordelig zijn.", "Ezech 20:31": "Ja, met het offeren van uw gaven, met het door het vuur laten doorgaan van uw kinderen, bent u verontreinigd met al uw drekgoden tot op deze dag toe; en zou Ik door u gevraagd worden, o huis van Israël? Zo waarachtig als Ik leef, spreekt de Heere HEERE, zo Ik door u gevraagd word!", "Job 13:15": "Zie, al doodde Hij mij, zou ik niet hopen? Toch zal ik mijn wegen voor Zijn aangezicht verdedigen.", "Rom 10:16-18": "Maar zij zijn niet allen het Evangelie gehoorzaam geweest; want Jesaja zegt: Heere, wie heeft onze prediking geloofd? Zo is dan het geloof uit het gehoor, en het gehoor door het Woord van God, Maar ik zeg: Hebben zij het niet gehoord? Zeker wel, hun geluid is over de hele aarde uitgegaan, en hun woorden tot de einden van de wereld.", "Jer 20:12": "Gij dan, o HEERE van de heerscharen, Die de rechtvaardige beproeft, Die de nieren en het hart ziet, laat mij Uw wraak op hen zien, want ik heb U mijn rechtszaak voorgelegd.", "Ps 102:23": "Wanneer de volken samen zullen vergaderd worden, ook de koninkrijken, om de HEERE te dienen.", "Ps 58:3": "Ja, u werkt ongerechtigheden in het hart; u weegt het geweld van uw handen af op de aarde.", "Ps 96:6": "Majesteit en heerlijkheid zijn voor Zijn aangezicht, sterkte en sieraad in Zijn heiligdom.", "Joh 1:17": "Want de wet is door Mozes gegeven, de genade en de waarheid is door Jezus Christus geworden.", "Ps 77:6-11": "Ik overdacht de dagen van vroeger, de jaren van eeuwen her. Ik dacht aan mijn snarenspel; in de nacht overlegde ik in mijn hart, en mijn geest onderzocht: Zal de Heere dan voor eeuwig verstoten, en voortaan niet meer goedgunstig zijn?", "Joh 15:18": "Als de wereld u haat, weet dan, dat zij Mij eerder dan u gehaat heeft.", "Job 37:23": "De Almachtige, Hem kunnen wij niet doorgronden; Hij is groot van kracht; doch door recht en grote gerechtigheid verdrukt Hij niet.", "Deut 4:35": "Aan u is het getoond, opdat u weet dat de HEERE die God is; er is niemand anders dan Hij alleen!", "Ps 78:19-22": "En zij spraken tegen God, zij zeiden: Zou God een tafel kunnen aanrichten in de woestijn? Zie, Hij heeft de rotssteen geslagen, zodat er water uitvloeide, en beken overvloedig uitbraken, zou Hij ook brood kunnen geven? Zou Hij aan Zijn volk vlees toebereiden? Daarom hoorde de HEERE, en werd verbolgen; en een vuur werd ontstoken tegen Jakob, en ook toorn ging op tegen Israël;", "Hebr 4:16": "Laat ons dan met vrijmoedigheid toegaan tot de troon van de genade, opdat wij barmhartigheid mogen verkrijgen en genade vinden om geholpen te worden op de tijd dat wij het nodig hebben.", "Dan 11:36": "En die koning zal doen naar zijn welgevallen, en hij zal zichzelf verheffen, en zich groot maken boven elke god, en hij zal tegen de God der goden wonderlijke dingen spreken; en hij zal voorspoedig zijn, totdat de gramschap voltooid is, want het is vast besloten, het zal gebeuren.", "Spr 17:3": "De smeltkroes is voor het zilver, en de oven voor het goud; maar de HEERE toetst de harten.", "Spr 26:12": "Hebt u een man gezien die wijs is in zijn eigen ogen? Van een dwaas is meer te verwachten dan van hem.", "Amos 6:13": "U, die blij bent over een nietig ding; u, die zegt: Hebben wij niet door onze eigen kracht hoorns voor onszelf verkregen?", "Deut 33:27": "De eeuwige God zij u een woning, en van onder eeuwige armen; en Hij verdrijft de vijand voor uw aangezicht, en zegt: Verdelg!", "Amos 5:12": "Want Ik weet dat uw overtredingen talrijk, en uw zonden machtig veel zijn; zij benauwen de rechtvaardige, nemen steekpenningen aan, en verdringen de behoeftigen in de poort.", "Hand 23:3": "Toen zei Paulus tegen hem: God zal u slaan, u witgepleisterde muur! Zit u daar om mij naar de wet te oordelen, en beveelt u, tegen de wet in, dat men mij zal slaan?", "Hand 16:25": "En omtrent middernacht baden Paulus en Silas en zongen lofzangen voor God; en de gevangenen luisterden naar hen.", "1 Sam 24:16": "Doch de HEERE zal Rechter zijn, en rechtspreken tussen mij en tussen u, en zien daarin, en mijn geschil beslechten, en mij redden uit uw hand.", "Amos 4:1": "Hoor dit woord, koeien van Basan, u die op de berg van Samaria bent, die de armen verdrukt, die de behoeftigen verplettert; u die tegen uw heren zegt: Breng aan, opdat wij drinken.", "Ps 10:17": "HEERE, U hebt de wens van de zachtmoedigen gehoord; U zult hun hart sterken, Uw oor zal opmerken;", "Spr 16:3": "Wentel uw werken op de HEERE, en uw gedachten zullen bevestigd worden.", "Pred 8:9": "Dit alles heb ik gezien, toen ik mijn hart richtte op elk werk dat onder de zon gebeurt: er is een tijd dat de ene mens over de andere heerst, hem tot zijn eigen kwaad.", "Rom 3:27": "Waar is dan de roem? Hij is uitgesloten. Door welke wet? Van de werken? Nee, maar door de wet van het geloof.", "Ezech 18:30": "Daarom zal Ik u richten, o huis van Israël, ieder naar zijn wegen, spreekt de Heere HEERE. Keer terug, en bekeer u van al uw overtredingen, zo zal de ongerechtigheid u niet tot een struikelblok worden.", "Jes 45:19": "Ik heb niet in het verborgene gesproken, op een donkere plaats van de aarde; Ik heb tegen het zaad van Jakob niet gezegd: Zoekt Mij tevergeefs; Ik ben de HEERE, Die gerechtigheid spreekt, Die rechtmatige dingen verkondigt.", "Job 36:22": "Zie, God verhoogt door Zijn kracht; wie is een Leraar zoals Hij?", "Ps 18:42": "Zij riepen, maar er was geen verlosser; tot de HEERE, maar Hij antwoordde hun niet.", "Jes 50:10": "Wie is er onder u, die de HEERE vreest, die naar de stem van Zijn Knecht luistert? Als hij in de duisternis wandelt, en geen licht heeft, laat hij vertrouwen op de Naam van de HEERE en steunen op zijn God.", "Deut 4:6": "Bewaar ze dan, en doe ze; want dat zal uw wijsheid en uw verstand zijn voor de ogen van de volken, die al deze inzettingen zullen horen en zeggen: Dit grote volk is werkelijk een wijs en verstandig volk!", "2 Kor 1:20": "Want zoveel beloften van God er ook zijn, die zijn in Hem ja, en zijn in Hem amen, tot heerlijkheid van God door ons.", "Job 35:2-8": "Houdt u dat voor recht, dat u gezegd hebt: Mijn gerechtigheid is meer dan die van God? Want u hebt gezegd: Wat zou het u baten? Wat voor meer voordeel zal ik daarmee doen, dan met mijn zonde? Ik zal u antwoord geven, en uw vrienden met u.", "Jer 17:15": "Zie, zij zeggen tegen mij: Waar is het woord van de HEERE? Laat het nu komen!", "Luk 21:18": "Toch zal er geen haar van uw hoofd verloren gaan.", "Gen 1:27": "En God schiep de mens naar Zijn beeld; naar het beeld van God schiep Hij hem; man en vrouw schiep Hij hen.", "Ps 68:7": "Een God, Die de eenzamen zet in een gezin, uitleidt wie in boeien gevangen zitten; maar de afvalligen wonen in het dorre land.", "Ps 8:2-10": "O HEERE, onze Heere! Hoe heerlijk is Uw Naam op de hele aarde! U, die Uw majesteit boven de hemelen gesteld hebt. Uit de mond van de kinderen en de zuigelingen hebt U sterkte gegrondvest, omwille van Uw tegenstanders, om de vijand en de wraakgierige te doen ophouden. Als ik Uw hemel aanzie, het werk van Uw vingers, de maan en de sterren, die U bereid hebt;", "Mark 8:15": "En Hij gebood hun: Kijk uit, wees op uw hoede voor het zuurdeeg van de Farizeeën, en voor het zuurdeeg van Herodes.", "Pred 12:14": "Want God zal ieder werk in het gericht brengen, met alles wat verborgen is, hetzij goed, of hetzij kwaad.", "Zef 3:3": "Haar vorsten zijn brullende leeuwen in haar midden; haar rechters zijn avondwolven, die de beenderen niet breken tot aan de morgen.", "Ps 56:2": "Wees mij genadig, o God! Want de mens zoekt mij op te slokken; de hele dag dringt de bestrijder mij.", "Ex 34:5": "De HEERE nu kwam neerwaarts in een wolk, en stelde Zich daar bij hem; en Hij riep de Naam van de HEERE uit.", "Job 9:21": "Ben ik oprecht, dan acht ik toch mijn ziel niet; ik versmaad mijn leven.", "Num 15:30": "Maar de ziel die iets doet met opgeheven hand, hetzij van inboorlingen of van vreemdelingen, die smaadt de HEERE; en die ziel zal uitgeroeid worden uit het midden van haar volk;", "Spr 25:27": "Veel honig eten is niet goed; maar het onderzoeken van de eigen eer is geen eer.", "Ezech 33:30": "En u, o mensenkind! De kinderen van uw volk spreken voortdurend over u bij de muren en in de deuren van de huizen; en de een spreekt met de ander, ieder met zijn broeder, en zegt: Kom toch en luister wat het woord is dat van de HEERE komt.", "Rom 1:32": "die, hoewel zij het recht van God kennen, namelijk dat zij die zulke dingen doen de dood waard zijn, deze dingen niet alleen doen, maar ook nog instemming betonen aan hen die ze doen.", "Job 25:4-6": "Hoe zou dan een mens rechtvaardig zijn bij God, en hoe zou hij zuiver zijn, die van een vrouw geboren is? Zie, zelfs de maan geeft geen schijnsel, en de sterren zijn niet zuiver in Zijn ogen. Hoeveel te minder de mens, die een made is, en het mensenkind, die een worm is!", "2 Tess 2:16": "En onze Heere Jezus Christus Zelf, en onze God en Vader, Die ons heeft liefgehad, en een eeuwige vertroosting en goede hoop gegeven heeft in genade,", "Openb 16:5-7": "En ik hoorde de engel van het water zeggen: U bent rechtvaardig, Heere! Die is, en Die was, en Die zijn zal, dat U dit geoordeeld hebt; Omdat zij het bloed van de heiligen en van de profeten vergoten hebben, hebt U hun ook bloed te drinken gegeven; want zij zijn het waard. En ik hoorde een ander vanaf het altaar zeggen: Ja, Heere, U almachtige God! Uw oordelen zijn waarachtig en rechtvaardig.", "Ps 94:1": "O God van de wraken! O HEERE, God van de wraken! Verschijn blinkend!", "Jes 51:3-13": "Want de HEERE zal Sion troosten, Hij zal al haar woeste plaatsen troosten, en Hij zal haar woestijn maken als Eden, en haar wildernis als de hof van de HEERE; vreugde en blijdschap zal daarin gevonden worden, dankzegging en een stem van het gezang. Luister naar Mij, Mijn volk! En Mijn lieden, neig naar Mij het oor! Want een wet zal van Mij uitgaan, en Ik zal Mijn recht doen rusten tot een licht van de volken. Mijn gerechtigheid is nabij, Mijn heil trekt uit, en Mijn armen zullen de volken richten; op Mij zullen de eilanden wachten, en op Mijn arm zullen zij hopen.", "Job 11:4-6": "Want u hebt gezegd: Mijn leer is zuiver, en ik ben rein in uw ogen. Maar zeker, och, of God sprak, en Zijn lippen tegen u opende; En u bekend maakte de verborgenheden van de wijsheid, omdat zij dubbel zijn in wezen! Weet daarom, dat God voor u minder rekent van uw ongerechtigheid dan die verdient.", "1 Kron 10:14": "en de HEERE niet gezocht had; daarom doodde Hij hem, en keerde het koninkrijk tot David, de zoon van Isaï.", "Mal 3:14": "U zegt: Het is tevergeefs God te dienen; want wat nut heeft het, dat wij Zijn wacht in acht nemen, en dat wij in het zwart gaan, voor het aangezicht van de HEERE van de heerscharen?", "Job 31:2": "Want wat is het deel van God van boven, of de erve van de Almachtige uit de hoogten?", "Job 13:18": "Zie toch, ik heb de zaak ordelijk gesteld; ik weet dat ik rechtvaardig verklaard zal worden.", "Ps 57:12": "Verhef U boven de hemelen, o God! Uw eer zij over de hele aarde.", "1 Kron 16:33": "Dan zullen de bomen van het woud juichen voor het aangezicht van de HEERE, omdat Hij komt om de aarde te richten.", "Spr 21:27": "Het offer van de goddelozen is een gruwel; hoeveel te meer, als zij het met een schandelijk voornemen brengen!", "Matt 11:28": "Komt hier naar Mij toe, allen die vermoeid en belast zijn, en Ik zal u rust geven.", "Jes 54:13": "En al uw kinderen zullen door de HEERE geleerd zijn, en de vrede van uw kinderen zal groot zijn.", "Jona 1:12": "En hij zei tegen hen: Neem mij op, en werp mij in de zee, dan zal de zee stil worden voor u; want ik weet dat deze grote storm om mijnentwil over u komt.", "Jes 37:6": "En Jesaja zei tegen hen: Zo moet u tegen uw heer zeggen: Zo zegt de HEERE: Wees niet bang voor de woorden die u gehoord hebt, waarmee de knechten van de koning van Assyrië Mij gelasterd hebben.", "Joz 7:1-5": "Maar de kinderen van Israël overtraden door overtreding met het verbannene; want Achan, de zoon van Charmi, de zoon van Zabdi, de zoon van Zerah, uit de stam van Juda, nam van het verbannene. Toen ontstak de toorn van de HEERE tegen de kinderen van Israël. Toen Jozua mannen zond van Jericho naar Ai, dat bij Beth-aven ligt, ten oosten van Beth-el, sprak hij tot hen: Trek op en verken het land. Die mannen trokken op en verkenden Ai. Daarna keerden zij terug naar Jozua, en zeiden tegen hem: Laat niet het hele volk optrekken; laat er ongeveer tweeduizend man, of ongeveer drieduizend man, optrekken om Ai te verslaan; vermoei daar niet het hele volk mee, want zij zijn met weinigen.", "Job 34:10-12": "Daarom, u, lieden van verstand, hoor naar mij: Ver zij God van goddeloosheid, en de Almachtige van onrecht! Want naar het werk van de mens vergeldt Hij hem, en naar ieders weg doet Hij het hem vinden. Ook waarlijk, God handelt niet goddeloos, en de Almachtige verkeert het recht niet.", "Matt 20:22": "Maar Jezus antwoordde en zei: U weet niet wat u vraagt; kunt u de drinkbeker drinken die Ik drinken zal, en met de doop gedoopt worden waarmee Ik gedoopt word? Zij zeiden tegen Hem: Wij kunnen dat.", "Jer 48:26": "Maak hem dronken, omdat hij zich groot gemaakt heeft tegen de HEERE; zo zal Moab met de handen klappen in zijn uitspuwsel, en hij zelf zal ook tot bespotting zijn.", "Jes 59:15": "Ja, de waarheid ontbreekt, en wie van het boze wijkt, wordt tot een prooi; en de HEERE zag het, en het was kwaad in Zijn ogen, dat er geen recht was.", "Job 37:22": "Als van het noorden het goud komt; maar bij God is een geweldige majesteit!", "Jes 10:1-3": "Wee hun die onrechtvaardige regels bepalen, en de s
