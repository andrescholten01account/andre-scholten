van de vorsten niet aanneemt, en de rijke voor de arme niet kent? Want zij zijn allen het werk van Zijn handen.", "20": "In een ogenblik sterven zij; zelfs te middernacht wordt een volk geschud, dat het doorgaat; en de machtige wordt weggenomen zonder hand.", "21": "Want Zijn ogen zijn op ieders wegen, en Hij ziet al zijn treden.", "22": "Er is geen duisternis, en er is geen schaduw van de dood, dat daar de werkers van de ongerechtigheid zich verbergen mochten.", "23": "Zeker, Hij legt de mens niet te veel op, dat hij tegen God in het gericht zou mogen treden.", "24": "Hij vermorzelt de geweldigen, dat men het niet doorzoeken kan, en stelt anderen in hun plaats.", "25": "Daarom *dat* Hij hun werken kent, zo keert Hij hen 's nachts om, en zij worden verbrijzeld.", "26": "Hij klopt hen samen als goddelozen, in een plaats, *waar* van het aanschouwer zijn;", "27": "Daarom dat zij van achter Hem afgeweken zijn, en geen van Zijn wegen verstaan hebben;", "28": "Opdat Hij op hem het geroep van de arme brengt, en het geroep van de ellendigen verhoort.", "29": "Als Hij stilt, wie zal dan beroeren? Als Hij het aangezicht verbergt, wie zal Hem dan aanschouwen, zowel voor een volk, als voor een mens alleen?", "30": "Opdat de huichelachtige mens niet meer regeert, *en* geen strikken van het volk zijn.", "31": "Zeker heeft hij tot God gezegd: Ik heb *Uw straf* verdragen, ik zal het niet verderven.", "32": "Behalve *wat* ik zie, leer Gij mij; heb ik onrecht gewrocht, ik zal het niet meer doen.", "33": "Zal het van u zijn, hoe Hij iets vergelden zal, omdat u *Hem* versmaadt? Zou u dan verkiezen, en niet ik? Wat weet u dan? Spreek.", "34": "De lieden van verstand zullen met mij zeggen, en een wijs man zal naar mij horen:", "35": "*Dat* Job niet met wetenschap gesproken heeft, en zijn woorden niet met kloek verstand geweest zijn.", "36": "Mijn Vader, laat Job beproefd worden tot het einde toe, om *zijn* antwoorden wil onder de onrechtvaardige lieden.", "37": "Want tot zijn zonde zou hij nog overtreding bijvoegen; hij zou onder ons in de handen klappen, en hij zou zijn redenen vermenigvuldigen tegen God."}, "SV": {"1": "Verder antwoordde Elihu, en zeide:", "2": "Hoort, gij wijzen, mijn woorden, en gij verstandigen, neigt de oren naar mij.", "3": "Want het oor proeft de woorden, gelijk het gehemelte de spijze smaakt.", "4": "Laat ons kiezen voor ons, wat recht is; laat ons kennen onder ons wat goed is.", "5": "Want Job heeft gezegd: Ik ben rechtvaardig, en God heeft mijn recht weggenomen.", "6": "Ik moet liegen in mijn recht; mijn pijl is smartelijk zonder overtreding.", "7": "Wat man is er, gelijk Job? Hij drinkt de bespotting in als water;", "8": "En gaat over weg in gezelschap met de werkers der ongerechtigheid, en wandelt met goddeloze lieden.", "9": "Want hij heeft gezegd: Het baat een man niet, als hij welbehagen heeft aan God.", "10": "Daarom, gij, lieden van verstand, hoort naar mij: Verre zij God van goddeloosheid, en de Almachtige van onrecht!", "11": "Want *naar* het werk des mensen vergeldt Hij hem, en naar eens ieders weg doet Hij het hem vinden.", "12": "Ook waarlijk, God handelt niet goddelooslijk, en de Almachtige verkeert het recht niet.", "13": "Wie heeft Hem gesteld over de aarde, en wie heeft de ganse wereld geschikt?", "14": "Indien Hij Zijn hart tegen hem zette, Zijn geest en Zijn adem zou Hij tot Zich vergaderen;", "15": "Alle vlees zou tegelijk den geest geven, en de mens zou tot stof wederkeren.", "16": "Zo er dan verstand *bij* *u* is, hoor dit; neig de oren tot de stem mijner woorden.", "17": "Zou Hij ook, Die het recht haat, *den* *gewonde* verbinden, en zoudt gij den zeer Rechtvaardige verdoemen?", "18": "Zou men tot een koning zeggen: Gij Belial; tot de prinsen: Gij goddelozen!", "19": "*Hoe* *dan* *tot* *Dien*, Die het aangezicht der vorsten niet aanneemt, en den rijke voor den arme niet kent? Want zij zijn allen Zijner handen werk.", "20": "In een ogenblik sterven zij; zelfs ter middernacht wordt een volk geschud, dat het doorga; en de machtige wordt weggenomen zonder hand.", "21": "Want Zijn ogen zijn op ieders wegen, en Hij ziet al zijn treden.", "22": "Er is geen duisternis, en er is geen schaduw des doods, dat aldaar de werkers der ongerechtigheid zich verbergen mochten.", "23": "Gewisselijk, Hij legt den mens niet te veel op, dat hij tegen God in het gericht zou mogen treden.", "24": "Hij vermorzelt de geweldigen, dat men het niet doorzoeken kan, en stelt anderen in hun plaats.", "25": "Daarom *dat* Hij hun werken kent, zo keert Hij hen des nachts om, en zij worden verbrijzeld.", "26": "Hij klopt hen samen als goddelozen, in een plaats, *waar* aanschouwers zijn;", "27": "Daarom dat zij van achter Hem afgeweken zijn, en geen Zijner wegen verstaan hebben;", "28": "Opdat Hij op hem het geroep des armen brenge, en het geroep der ellendigen verhore.", "29": "Als Hij stilt, wie zal dan beroeren? Als Hij het aangezicht verbergt, wie zal Hem dan aanschouwen, zowel voor een volk, als voor een mens alleen?", "30": "Opdat de huichelachtige mens niet *meer* regere, *en* geen strikken des volks zijn.", "31": "Zekerlijk heeft hij tot God gezegd: Ik heb *Uw* *straf* verdragen, ik zal het niet verderven.", "32": "Behalve *wat* ik zie, leer Gij mij; heb ik onrecht gewrocht, ik zal het niet meer doen.", "33": "Zal het van u zijn, hoe Hij iets vergelden zal, dewijl gij *Hem* versmaadt? Zoudt gij dan verkiezen, en niet ik? Wat weet gij dan? Spreek.", "34": "De lieden van verstand zullen met mij zeggen, en een wijs man zal naar mij horen:", "35": "*Dat* Job niet met wetenschap gesproken heeft, en zijn woorden niet met kloek verstand geweest zijn.", "36": "Mijn Vader, laat Job beproefd worden tot het einde toe, om *zijner* antwoorden wil onder de ongerechtige lieden.", "37": "Want tot zijn zonde zou hij nog overtreding bijvoegen; hij zou onder ons in de handen klappen, en hij zou zijn redenen vermenigvuldigen tegen God."}, "KJV": {"1": "Furthermore Elihu answered and said,", "2": "Hear my words, O ye wise *men*; and give ear unto me, ye that have knowledge.", "3": "For the ear trieth words, as the mouth tasteth meat.", "4": "Let us choose to us judgment: let us know among ourselves what *is* good.", "5": "For Job hath said, I am righteous: and God hath taken away my judgment.", "6": "Should I lie against my right? my wound *is* incurable without transgression.", "7": "What man *is* like Job, *who* drinketh up scorning like water?", "8": "Which goeth in company with the workers of iniquity, and walketh with wicked men.", "9": "For he hath said, It profiteth a man nothing that he should delight himself with God.", "10": "Therefore hearken unto me, ye men of understanding: far be it from God, *that he should do* wickedness; and *from* the Almighty, *that he should commit* iniquity.", "11": "For the work of a man shall he render unto him, and cause every man to find according to *his* ways.", "12": "Yea, surely God will not do wickedly, neither will the Almighty pervert judgment.", "13": "Who hath given him a charge over the earth? or who hath disposed the whole world?", "14": "If he set his heart upon man, *if* he gather unto himself his spirit and his breath;", "15": "All flesh shall perish together, and man shall turn again unto dust.", "16": "If now *thou hast* understanding, hear this: hearken to the voice of my words.", "17": "Shall even he that hateth right govern? and wilt thou condemn him that is most just?", "18": "*Is it fit* to say to a king, *Thou art* wicked? *and* to princes, *Ye are* ungodly?", "19": "*How much less to him* that accepteth not the persons of princes, nor regardeth the rich more than the poor? for they all *are* the work of his hands.", "20": "In a moment shall they die, and the people shall be troubled at midnight, and pass away: and the mighty shall be taken away without hand.", "21": "For his eyes *are* upon the ways of man, and he seeth all his goings.", "22": "*There is* no darkness, nor shadow of death, where the workers of iniquity may hide", "23": "For he will not lay upon man more *than right*; that he should enter into judgment with God.", "24": "He shall break in pieces mighty men without number, and set others", "25": "Therefore he knoweth their works, and he overturneth *them* in the night, so that they are destroyed.", "26": "He striketh them as wicked men in the open sight", "27": "Because they turned back from him, and would not consider any of his ways:", "28": "So that they cause the cry of the poor to come unto him, and he heareth the cry of the afflicted.", "29": "When he giveth quietness, who then can make trouble? and when he hideth *his* face, who then can behold him? whether *it be done* against a nation, or against a man only:", "30": "That the hypocrite reign not, lest the people be ensnared.", "31": "Surely it is meet to be said unto God, I have borne *chastisement*, I will not offend", "32": "*That which* I see not teach thou me: if I have done iniquity, I will do", "33": "*Should it be* according to thy mind? he will recompense it, whether thou refuse, or whether thou choose; and not I: therefore speak what thou knowest.", "34": "Let men of understanding tell me, and let a wise man hearken", "35": "Job hath spoken without knowledge, and his words *were* without wisdom.", "36": "My desire *is that* Job may be tried unto the end because of *his* answers for wicked men.", "37": "For he addeth rebellion unto his sin, he clappeth *his hands* among us, and multiplieth his words against God."}}, "tsk": {"3": [{"kopje": "het oor", "refs": ["Job 6:30", "Job 12:11", "1 Kor 2:15", "Hebr 5:14"]}, {"kopje": "het gehemelte", "refs": ["Job 31:30", "Job 33:2"]}], "4": [{"kopje": "kiezen", "refs": ["Job 34:36", "Richt 19:30", "Richt 20:7", "1 Kor 6:2-5", "Gal 2:11-14", "1 Tess 5:21"]}, {"kopje": "kennen", "refs": ["Jes 11:2-5", "Joh 7:24", "Rom 12:2"]}], "5": [{"kopje": "Ik", "refs": ["Job 10:7", "Job 11:4", "Job 16:17", "Job 29:14", "Job 32:1", "Job 33:9"]}, {"kopje": "God",  2:21": "Want Hij verandert de tijden en de tijdperken; Hij zet koningen af en Hij stelt koningen aan; Hij geeft de wijzen wijsheid, en kennis aan hen die verstand hebben.", "Ps 17:3": "U hebt mijn hart geproefd, 's nachts bezocht, U hebt mij getoetst. U vindt niets; wat ik gedacht heb, overtreedt mijn mond niet.", "Job 29:14": "Ik bekleedde mij met gerechtigheid, en zij bekleedde mij; mijn oordeel was als een mantel en vorstelijke hoed.", "Job 9:31": "Dan zult U mij in de gracht dompelen, en mijn kleren zullen van mij walgen.", "Ps 25:4": "Daleth. HEERE! maak mij Uw wegen bekend, leer mij Uw paden.", "Ef 4:22": "Namelijk dat u zou afleggen, wat betreft de vorige levenswandel, de oude mens, die verdorven wordt door de begeerten van de verleiding;", "Openb 18:9": "En de koningen van de aarde, die met haar gehoereerd en in weelde geleefd hebben, zullen haar bewenen, en rouw over haar bedrijven, wanneer zij de rook van haar brand zullen zien;", "Job 24:1": "Waarom zouden voor de Almachtige de tijden niet verborgen zijn, terwijl zij die Hem kennen Zijn dagen niet zien?", "Ps 143:7": "Verhoor mij haastig, HEERE, mijn geest bezwijkt; verberg Uw aangezicht niet van mij, want ik zou gelijk worden aan hen die in de kuil neerdalen.", "Job 7:17": "Wat is de mens, dat U hem groot acht, en dat U Uw hart op hem zet?", "Jer 27:8": "En het zal gebeuren: het volk en het koninkrijk dat hem, Nebukadnezar, de koning van Babel, niet zal dienen, en dat zijn hals niet onder het juk van de koning van Babel zal geven, over dat volk zal Ik, spreekt de HEERE, straf brengen door het zwaard, en door de honger, en door de pest, totdat Ik ze door zijn hand zal hebben weggevaagd.", "2 Petr 2:3": "En zij zullen door hebzucht, met gemaakte woorden, van u een koopwaar maken; over hen is het oordeel van lang geleden niet werkeloos, en hun verderf sluimert niet.", "Job 16:13": "Zijn schutters hebben mij omringd; Hij heeft mijn nieren doorkliefd, en niet gespaard; Hij heeft mijn gal op de aarde uitgegoten.", "Job 15:31": "Hij vertrouwt niet op ijdelheid, waardoor hij verleid wordt; want ijdelheid zal zijn vergelding zijn.", "2 Sam 23:3": "De God van Israël heeft gezegd, de Rotssteen van Israël heeft tot mij gesproken: Er zal een Heerser zijn over de mensen, een Rechtvaardige, een Heerser in de vreze van God.", "Job 19:2": "Hoe lang zullen jullie mijn ziel bedroeven, en mij met woorden verbrijzelen?", "Matt 16:27": "Want de Zoon des mensen zal komen in de heerlijkheid van Zijn Vader, met Zijn engelen, en dan zal Hij ieder vergelden naar zijn daden.", "Job 24:12": "Uit de stad zuchten de mensen, en de ziel van de verwonden schreeuwt uit; toch rekent God het niet aan als ongerijmd.", "Job 27:23": "Ieder zal over hem met zijn handen klappen, en over hem fluiten uit zijn plaats.", "1 Kon 14:14": "Doch de HEERE zal Zich een koning verwekken over Israël, die het huis van Jerobeam op diezelfde dag zal uitroeien; maar wat zal het ook nu zijn?", "Ex 2:24": "En God hoorde hun gekerm, en God dacht aan Zijn verbond met Abraham, met Izak, en met Jakob.", "Gal 6:7": "Dwaal niet; God laat Zich niet bespotten; want wat de mens ook zaait, dat zal hij ook maaien.", "Hab 1:13": "U bent te rein van ogen om het kwade te zien, en de kwelling kunt U niet aanschouwen; waarom zou U aanschouwen wie trouweloos handelen? Waarom zou U zwijgen, als de goddeloze verslindt wie rechtvaardiger is dan hij?", "Rom 3:5": "Als nu onze ongerechtigheid de gerechtigheid van God bevestigt, wat zullen wij zeggen? Is God onrechtvaardig, als Hij toorn over ons brengt? (Ik spreek naar de mens.)", "Hebr 11:26": "en achtte hij de smaad van Christus een grotere rijkdom dan de schatten in Egypte; want hij keek uit naar de vergelding van het loon.", "Deut 10:17": "Want de HEERE, uw God, is een God der goden, en een Heere der heren; die grote, die machtige, en die ontzagwekkende God, Die niemand aanziet naar het aangezicht, en geen geschenk aanneemt;", "Jes 66:24": "En zij zullen naar buiten gaan, en zij zullen de dode lichamen zien van de mensen die tegen Mij in opstand zijn gekomen; want hun worm zal niet sterven, en hun vuur zal niet uitgeblust worden, en zij zullen voor alle vlees een afgrijzen zijn.", "Ps 13:2": "Hoe lang, HEERE, zult U mij steeds vergeten? Hoe lang zult U Uw aangezicht voor mij verbergen?", "Job 12:6": "De tenten van de verwoesters hebben rust, en zij die God tergen, hebben zekerheid, om wat God met Zijn hand toebrengt.", "Spr 14:31": "Wie de arme verdrukt, smaadt zijn Maker; maar wie zich over de behoeftige ontfermt, eert Hem.", "Ps 145:17": "Tsade. De HEERE is rechtvaardig in al Zijn wegen, en goedertieren in al Zijn werken.", "2 Kor 5:10": "Want wij moeten allen geopenbaard worden voor de rechterstoel van Christus, opdat ieder ontvangt wat door het lichaam gedaan is, naarmate hij gedaan heeft, hetzij goed, hetzij kwaad.", "Ef 6:9": "En u heren, doe hetzelfde bij hen, en laat het dreigen achterwege; als iemand die weet dat ook uw eigen Heere in de hemelen is, en dat er geen aanneming van het persoon bij Hem is.", "1 Sam 26:10": "Verder zei David: Zo waarachtig als de HEERE leeft, de HEERE zal hem slaan, of zijn dag zal komen dat hij zal sterven, of hij zal in een strijd trekken en daarin omkomen.", "Job 9:32": "Want Hij is geen man zoals ik, die ik antwoorden zou, zodat wij samen voor het gericht zouden komen.", "Ex 14:30": "Zo verloste de HEERE Israël op die dag uit de hand van de Egyptenaren; en Israël zag de Egyptenaren dood aan de oever van de zee.", "Deut 21:21": "Dan zullen alle mannen van zijn stad hem met stenen stenigen, zodat hij sterft; en u zult het kwaad uit uw midden wegdoen; en heel Israël zal het horen en vrezen.", "Ps 58:11": "De rechtvaardige zal zich verblijden, als hij de wraak aanschouwt; hij zal zijn voeten wassen in het bloed van de goddeloze.", "Openb 18:20": "Bedrijf vreugde over haar, u hemel, en u heilige apostelen en profeten, want God heeft uw oordeel aan haar voltrokken.", "Jes 30:13": "Daarom zal deze misdaad voor u zijn als een vallende scheur, uitwaarts gebogen in een hoge muur, waarvan de breuk snel, in een ogenblik, komen zal.", "Ezra 9:13": "En na alles wat over ons gekomen is, om onze slechte werken, en om onze grote schuld, omdat U, o onze God, ons minder gestraft hebt dan onze ongerechtigheid verdient, en ons een ontkoming gegeven hebt, zoals deze is;", "Ps 139:12": "Ook verduistert de duisternis voor U niet; maar de nacht licht als de dag; de duisternis is als het licht.", "Openb 20:12": "En ik zag de doden, klein en groot, staande voor God; en de boeken werden geopend; en een ander boek werd geopend, dat van het leven is; en de doden werden geoordeeld uit wat in de boeken geschreven was, naar hun werken.", "1 Sam 15:23": "Want weerspannigheid is een zonde als toverij, en weerstreven is afgoderij en beeldendienst. Omdat u het woord van de HEERE verworpen hebt, zo heeft Hij u verworpen, dat u geen koning meer zult zijn.", "Job 21:7": "Waarom leven de goddelozen, worden oud, ja, worden geweldig in vermogen?", "Pred 5:7": "Als u de onderdrukking van de arme, en de beroving van het recht en de gerechtigheid ziet in een landstreek, verwonder u dan niet over zo'n gang van zaken; want wie hoger is dan de hoge, let daarop; en er zijn hogeren boven hen.", "Rom 3:4": "Dat zij verre. Maar God is waarachtig, en ieder mens leugenachtig; zoals geschreven is: Opdat U gerechtvaardigd wordt in Uw woorden, en overwint, wanneer U oordeelt.", "Ps 119:137": "Tsade. HEERE! U bent rechtvaardig, en elk van Uw oordelen is recht.", "Dan 2:44": "Maar in de dagen van die koningen zal de God van de hemel een Koninkrijk oprichten, dat in eeuwigheid niet zal worden verwoest; en dat Koninkrijk zal aan geen ander volk worden overgelaten; het zal al die koninkrijken verbrijzelen en tenietdoen, maar zelf zal het in alle eeuwigheid bestaan.", "Spr 22:2": "Rijken en armen ontmoeten elkaar; de HEERE heeft hen allen gemaakt.", "Job 23:9": "Als Hij ter linkerhand werkt, dan aanschouw ik Hem niet; verbergt Hij Zich ter rechterhand, dan zie ik Hem niet.", "Rom 9:20": "Maar toch, o mens, wie bent u, die tegen God antwoordt? Zal ook het maaksel tegen hem die het gemaakt heeft zeggen: Waarom hebt u mij zo gemaakt?", "Job 36:23": "Wie heeft Hem gesteld over Zijn weg? Of wie heeft gezegd: U hebt onrecht gedaan?", "Hebr 4:13": "En er is geen schepsel onzichtbaar voor Hem; maar alle dingen zijn naakt en geopend voor de ogen van Hem, met Wie wij te maken hebben.", "Hab 1:12": "Bent U niet van ouds af de HEERE, mijn God, mijn Heilige? Wij zullen niet sterven; o HEERE! Tot een oordeel hebt U hem gesteld, en o Rots! Om te straffen hebt U hem gegrondvest.", "Openb 6:15": "En de koningen van de aarde, en de groten, en de rijken, en de leiders over duizend, en de machtigen, en alle dienstknechten, en alle vrijen, verborgen zichzelf in de spelonken, en in de steenrotsen van de bergen;", "Job 23:8": "Zie, ga ik voorwaarts, dan is Hij er niet, of achterwaarts, dan merk ik Hem niet op.", "Jes 5:12": "En harp en luit, tamboerijn en fluit, en wijn zijn bij hun feesten; maar zij letten niet op het werk van de HEERE, en zij zien niet op het maaksel van Zijn handen.", "Ps 30:8": "Want, HEERE! U had mijn berg door Uw goedgunstigheid vast doen staan; maar toen U Uw aangezicht verborg, werd ik verschrikt.", "Amos 8:7": "De HEERE heeft gezworen bij de heerlijkheid van Jakob: Zeker zal Ik al hun werken voor altijd niet vergeten!", "Job 33:2": "Zie nu, ik heb mijn mond opengedaan; mijn tong spreekt onder mijn gehemelte.", "Hebr 12:28": "Daarom, omdat wij een onwankelbaar Koninkrijk ontvangen, laten wij de genade vasthouden, waardoor wij God welgevallig mogen dienen, met eerbied en godsvrucht.", "Job 31:15": "Heeft Hij niet, Die mij in de buik maakte, hem ook gemaakt en Een ons in de baarmoeder bereid?)", "Luk 12:20": "Maar God zei tegen hem: Jij dwaas! Nog deze nacht zal men uw ziel van u opeisen; en wat u hebt klaargemaakt, van wie zal het dan zijn?", "1 Kor 10:15": "Ik spreek als tegen verstandige mensen; oordeel u zelf wat ik zeg.", "Rom 2:6": "Die ieder zal vergelden naar zijn werken:", "Dan 4:35": "En alle inwoners van de aarde worden als niets geacht, en Hij doet naar Zijn wil met het leger van de hemel en de inwoners van de aarde, en er is niemand die Zijn hand kan tegenhouden, of tegen Hem kan zeggen: Wat doet U?", "Job 22:9": "De weduwen hebt u met lege handen weggezonden, en de armen van de wezen zijn verbrijzeld.", "Job 33:26": "Hij zal tot God ernstig bidden, Die in hem een welbehagen nemen zal, en zijn aangezicht met gejuich aanzien; want Hij zal de mens zijn gerechtigheid wedergeven.", "Jes 3:14": "De HEERE komt ten gerichte tegen de oudsten van Zijn volk en hun vorsten, want u hebt deze wijngaard verteerd; de roof van de ellendige is in uw huizen.", "Rom 12:2": "En word niet gelijkvormig aan deze wereld, maar word veranderd door de vernieuwing van uw gemoed, opdat u mag beproeven wat de goede, welbehaaglijke en volmaakte wil van God is.", "Ps 2:9": "U zult hen verpletteren met een ijzeren scepter; U zult hen in stukken slaan als een pottenbakkersvat.", "Job 16:21": "Och, mocht men rechtspreken voor een man bij God, zoals een kind van een mens voor zijn vriend.", "Mal 3:14": "U zegt: Het is tevergeefs God te dienen; want wat nut heeft het, dat wij Zijn wacht in acht nemen, en dat wij in het zwart gaan, voor het aangezicht van de HEERE van de heerscharen?", "Job 42:7": "Het gebeurde nu, nadat de HEERE deze woorden tot Job gesproken had, dat de HEERE tegen Elifaz, de Themaniet, zei: Mijn toorn is ontstoken tegen u, en tegen uw twee vrienden, want u hebt niet recht van Mij gesproken, zoals Mijn knecht Job.", "Spr 15:32": "Wie de tucht verwerpt, veracht zijn eigen ziel; maar wie de bestraffing hoort, krijgt verstand.", "Job 35:16": "zo heeft Job in ijdelheid zijn mond geopend, en zonder kennis woorden vermenigvuldigd.", "Spr 24:12": "Wanneer u zegt: Zie, wij wisten dat niet; zal Hij, Die de harten weegt, dat niet merken? En Die uw ziel gadeslaat, zal Hij het niet weten? Want Hij zal de mens vergelden naar zijn werk.", "Jes 15:1": "De last die op Moab rust. Zeker, in de nacht is Ar-Moab verwoest, zij is uitgeroeid; zeker, in de nacht is Kir-Moab verwoest, zij is uitgeroeid!", "Zef 1:6": "En hen die terugkeren van achter de HEERE; en die de HEERE niet zoeken, en niet naar Hem vragen.", "Job 33:32": "Als er redenen zijn, antwoord mij; spreek, want ik heb lust u te rechtvaardigen.", "Ps 19:13": "Wie zou de afdwalingen verstaan? Reinig mij van de verborgen afdwalingen.", "1 Tim 5:20": "Bestraf hen die zondigen in aanwezigheid van allen, opdat ook de anderen ontzag mogen hebben.", "Hebr 5:14": "Maar voor de volwassenen is er het vaste voedsel, voor hen die door de gewoonte hun zintuigen geoefend hebben, om onderscheid te maken tussen goed en kwaad.", "Jak 5:11": "Zie, wij noemen hen gelukkig die volharden; u hebt van de volharding van Job gehoord, en u hebt gezien hoe de Heere het einde bracht, dat de Heere zeer barmhartig is en vol ontferming.", "Richt 19:30": "En het gebeurde, dat ieder die het zag, zei: Zoiets is niet gebeurd of gezien, vanaf de dag dat de kinderen van Israël uit het land Egypte zijn opgetrokken, tot op deze dag; overweeg het, beraadslaag, en spreek uw gedachten uit!", "1 Tess 5:21": "Beproef alle dingen; behoud het goede.", "Ps 113:8": "Om hem te doen zitten bij de vorsten, bij de vorsten van Zijn volk.", "Ex 2:23": "En het gebeurde na vele van deze dagen, toen de koning van Egypte gestorven was, dat de kinderen van Israël zuchtten en schreeuwden vanwege de dienst; en hun geroep vanwege hun dienst kwam op tot God.", "Job 36:19": "Zou Hij uw rijkdom achten, zodat u niet in benauwdheid zou zijn; of alle versterkingen van kracht?", "1 Kor 4:5": "Oordeel dan niets vóór de tijd, totdat de Heere gekomen zal zijn, Die ook in het licht zal brengen wat in de duisternis verborgen is, en de plannen van de harten openbaar zal maken; en dan zal ieder lof van God ontvangen.", "Job 13:8": "Zult u Zijn aangezicht aannemen? Zult u voor God twisten?", "Luk 17:32": "Denk aan de vrouw van Lot.", "Matt 7:23": "En dan zal Ik hun openlijk zeggen: Ik heb u nooit gekend; ga weg van Mij, u die de ongerechtigheid werkt!", "Zach 4:6": "Toen antwoordde Hij en sprak tegen mij: Dit is het woord van de HEERE tot Zerubbabel: Niet door kracht, ook niet door geweld, maar door Mijn Geest zal het gebeuren, zegt de HEERE van de heerscharen.", "1 Kron 29:11": "Van U, o HEERE, is de grootheid, en de macht, en de heerlijkheid, en de overwinning, en de majesteit; want alles wat in de hemel en op aarde is, is van U: van U, o HEERE, is het Koninkrijk, en U hebt Uzelf verhoogd tot een Hoofd boven alles.", "Job 9:22": "Dat is één ding, daarom zeg ik: De oprechte en de goddeloze verdoet Hij.", "Ps 11:7": "Want de HEERE is rechtvaardig, Hij heeft gerechtigheden lief; Zijn aangezicht aanschouwt de oprechte.", "Jes 9:1": "Het volk dat in duisternis wandelt, zal een groot licht zien; wie wonen in het land van de schaduw van de dood, over hen zal een licht schijnen.", "Job 3:5": "Dat de duisternis en de schaduw van de dood hem verontreinigen; dat wolken over hem wonen; dat hem verschrikken de zwarte dampen van de dag!", "Ps 37:4": "En verlustig u in de HEERE, zo zal Hij u geven de verlangens van uw hart.", "Fil 4:7": "En de vrede van God, die alle verstand te boven gaat, zal uw harten en uw gedachten bewaren in Christus Jezus.", "Job 6:30": "Zou onrecht op mijn tong wezen? Zou mijn gehemelte niet de ellenden te verstaan geven?", "2 Tess 1:7": "En aan u, die verdrukt wordt, verkwikking te geven met ons, bij de openbaring van de Heere Jezus vanuit de hemel met de engelen van Zijn kracht;", "Job 9:4": "Hij is wijs van hart en sterk van kracht; wie heeft zich tegen Hem verhard en vrede gehad?", "Jes 32:17": "En het werk van de gerechtigheid zal vrede zijn; en de uitwerking van de gerechtigheid zal rust en zekerheid zijn, tot in eeuwigheid.", "1 Petr 1:17": "En als u Hem als Vader aanroept, Die zonder aanzien des persoons oordeelt naar ieders werk, leef dan in ontzag gedurende de tijd van uw verblijf hier als vreemdeling;", "Job 9:17": "Want Hij vermorzelt mij door een onweer, en vermenigvuldigt mijn wonden zonder oorzaak.", "Ps 33:15": "Hij vormt hun aller hart; Hij let op al hun werken.", "Matt 25:6": "En te middernacht kwam er een geroep: Zie, de bruidegom komt, ga hem tegemoet!", "Jes 1:19": "Als u willig bent en luistert, zult u het goede van dit land eten;", "Job 9:30": "Al zou ik mij wassen met sneeuwwater, en mijn handen zuiveren met zeep;", "Openb 18:10": "Van verre staande uit vrees voor haar pijniging, en zeggen: Wee, wee, de grote stad Babylon, de sterke stad, want uw oordeel is in één uur gekomen.", "Job 22:10": "Daarom zijn er strikken rondom u, en angst heeft u haastig overvallen.", "Ps 104:29": "Verbergt U Uw gezicht, zij worden angstig; neemt U hun adem weg, zij sterven, en zij keren terug tot hun stof.", "Deut 32:4": "Hij is de Rotssteen, Wiens werk volkomen is; want al Zijn wegen zijn recht. God is waarheid, en is geen onrecht; rechtvaardig en recht is Hij.", "Job 21:30": "Dat de boze gespaard wordt op de dag van het verderf; dat zij op de dag van de verbolgenheden weggevoerd worden.", "Jes 40:14": "Met wie heeft Hij raad gehouden, die Hem verstand zou geven, en Hem zou leren van het pad van het recht, en Hem wetenschap zou leren, en Hem bekend zou maken de weg van het veelvoudige verstand?", "Gal 2:6": "En van hen die in aanzien waren, wat zij ook waren — wat zij eertijds waren, verschilt mij niet; God kijkt niet naar de persoon van de mens — want zij die in aanzien waren, hebben mij niets toegevoegd.", "Ps 25:5": "He. Vau. Leid mij in Uw waarheid, en leer mij, want Gij zijt de God van mijn heil; U verwacht ik de hele dag.", "Joh 7:24": "Oordeel niet naar het aanzien, maar oordeel een rechtvaardig oordeel.", "Job 22:17": "Die tegen God zeiden: Wijk van ons! En wat zou de Almachtige voor hen kunnen doen?", "Job 29:13": "De zegen van hem die verloren dreigde te gaan, kwam op mij; en het hart van de weduwe deed ik vrolijk zingen.", "Hos 7:2": "En zij zeggen niet in hun hart dat Ik al hun boosheid onthoud; nu omsingelen hun daden hen, zij zijn voor Mijn aangezicht.", "Amos 9:3": "En al verstopten zij zich op de top van de Karmel, dan zal Ik ze opsporen en vandaar halen; en al verborgen zij zich voor Mijn ogen op de bodem van de zee, dan zal Ik vandaar de slang gebieden, die zal ze bijten.", "Job 8:3": "Zou God dan het recht verdraaien? En zou de Almachtige de gerechtigheid verdraaien?", "Job 23:7": "Daar zou de oprechte met Hem pleiten; en ik zou mij voor eeuwig van mijn Rechter vrijmaken.", "Job 11:3": "Zouden uw leugens de mensen doen zwijgen, en zou u spotten, en zou niemand u beschamen?", "Hand 10:34": "En Petrus opende zijn mond en zei: Ik merk in waarheid dat God niet iemand aanneemt op grond van het persoon;", "Amos 9:2": "Al groeven zij tot in het graf, dan zal Mijn hand ze vandaar halen, en al klommen zij in de hemel, dan zal Ik ze vandaar doen neerdalen.", "Luk 13:27": "En Hij zal zeggen: Ik zeg u, Ik weet niet waar u vandaan komt; ga weg van Mij, allen die ongerechtigheid werken!", "Ps 58:12": "En de mens zal zeggen: Zeker, er is vrucht voor de rechtvaardige; zeker, er is een God, Die op de aarde recht spreekt.", "Ps 135:6": "Al wat de HEERE behaagt, doet Hij, in de hemelen en op de aarde, in de zeeën en alle afgronden.", "2 Tess 1:6": "Aangezien het recht is bij God, verdrukking te vergelden aan hen die u verdrukken;", "Jer 12:1": "Ú zou rechtvaardig zijn, HEERE, wanneer ik tegen U zou twisten; ik zal echter over Uw oordelen met U spreken; waarom is de weg van de goddelozen voorspoedig, waarom hebben zij rust, allen die trouweloos trouweloosheid bedrijven?", "Jes 45:9": "Wee hem die met zijn Formeerder twist, zoals een potscherf met aarden potscherven! Zal ook het leem tegen zijn formeerder zeggen: Wat maakt u? of zal uw werk zeggen: Hij heeft geen handen?", "Jes 24:22": "En zij zullen bijeengebracht worden, zoals gevangenen in een put, en zij zullen opgesloten worden in een gevangenis, maar na veel dagen weer bezocht worden.", "Ps 26:2": "Proef mij, HEERE, en beproef mij; toets mijn nieren en mijn hart.", "Jes 1:3": "Een os kent zijn bezitter, en een ezel de krib van zijn heer; maar Israël heeft geen kennis, Mijn volk begrijpt het niet.", "Hand 15:38": "Maar Paulus vond het niet passend hem mee te nemen, omdat hij van Pamfylië af van hen was weggegaan, en niet met hen was meegegaan tot het werk.", "2 Tim 4:10": "Want Demas heeft mij verlaten, omdat hij de tegenwoordige wereld heeft liefgekregen, en is naar Thessalonica gereisd; Krescens naar Galatië, Titus naar Dalmatië.", "Ps 113:7": "Die de arme uit het stof opricht, en de behoeftige uit de vuilnis verhoogt;", "Rom 11:35": "Of wie heeft Hem eerst gegeven, en het zal hem terugbetaald worden?", "Job 37:23": "De Almachtige, Hem kunnen wij niet doorgronden; Hij is groot van kracht; doch door recht en grote gerechtigheid verdrukt Hij niet.", "Job 12:11": "Zal het oor de woorden niet proeven, zoals het gehemelte voor zich het voedsel smaakt?", "Job 40:3": "Zult u ook Mijn oordeel te niet maken? Zult U Mij verdoemen, opdat u rechtvaardig bent?", "Job 9:33": "Er is geen scheidsman tussen ons, die zijn hand op ons beiden leggen mocht.", "Kol 3:25": "Maar wie onrecht doet, zal het onrecht dragen dat hij gedaan heeft; en er is geen aanneming van het persoon.", "Job 31:20": "Als zijn lenden mij niet gezegend hebben, toen hij van de vellen van mijn lammeren verwarmd werd;", "Jes 29:15": "Wee hun die zich diep willen verbergen voor de HEERE, hun raad verbergend; en wier werken in duisternis gebeuren, en zij zeggen: Wie ziet ons, en wie kent ons?", "Job 35:9": "Vanwege de grootheid van hun onderdrukking doen zij de onderdrukten roepen; zij schreeuwen vanwege de arm van de groten.", "Ps 32:8": "Ik zal u onderwijzen, en u de weg leren die u moet gaan; Ik zal raad geven, Mijn oog zal op u zijn.", "Ps 139:24": "En zie, of er bij mij een schadelijke weg is; en leid mij op de eeuwige weg.", "Job 23:16": "Want God heeft mijn hart week gemaakt, en de Almachtige heeft mij ontsteld;", "Ps 28:5": "Omdat zij niet letten op de daden van de HEERE, en ook niet op het werk van Zijn handen, zal Hij hen afbreken en niet meer opbouwen.", "Ps 62:13": "En de goedertierenheid, o Heere! is van U; want U zult ieder vergelden naar zijn werk.", "Ps 27:9": "Verberg Uw aangezicht niet voor mij, keer Uw knecht niet af in toorn; U bent mijn Hulp geweest, verlaat mij niet, en begeef mij niet, o God van mijn heil!", "Ps 49:8": "niemand van hen zal zijn broeder ooit kunnen verlossen; hij zal aan God zijn losprijs niet kunnen geven;", "Ex 12:30": "En Farao stond 's nachts op, hij en al zijn dienaren, en alle Egyptenaren; en er was een groot geschreeuw in Egypte; want er was geen huis waarin niet een dode was.", "2 Sam 12:12": "Want u hebt het in het verborgene gedaan, maar Ik zal deze zaak doen voor heel Israël, en voor de zon.", "Job 33:5": "Als u kunt, antwoord mij; schik u voor mijn aangezicht, stel u op.", "Jer 32:19": "Groot van raad en machtig van daad; want Uw ogen zijn open over alle wegen van de mensenkinderen, om ieder te geven naar zijn wegen, en naar de vrucht van zijn handelingen.", "Ps 139:11": "Als ik zei: De duisternis zal mij zeker bedekken; dan is de nacht een licht om mij heen.", "Jes 5:7": "Want de wijngaard van de HEERE van de heerscharen is het huis van Israël, en de mannen van Juda zijn een plant van Zijn welbehagen; en Hij heeft gewacht op recht, maar zie, het is onderdrukking; op gerechtigheid, maar zie, het is geschreeuw.", "Joh 14:27": "Vrede laat Ik u na, Mijn vrede geef Ik u; niet zoals de wereld die geeft, geef Ik hem u. Laat uw hart niet ontroerd worden en niet bevreesd zijn.", "Ex 12:29": "En het gebeurde te middernacht, dat de HEERE alle eerstgeborenen in Egypteland sloeg, van de eerstgeborene van Farao af, die op zijn troon zou zitten, tot de eerstgeborene van de gevangene, die in de gevangenis was, en alle eerstgeborenen van het vee.", "Dan 2:34": "Dat zag u, totdat er een steen werd afgehouwen zonder handen, die het beeld trof aan zijn voeten van ijzer en leem, en ze verbrijzelde.", "Jer 23:24": "Zou iemand zich in verborgen plaatsen kunnen verbergen, zodat Ik hem niet zou zien? spreekt de HEERE; vervul Ik niet de hemel en de aarde? spreekt de HEERE.", "Hoogl 3:8": "Die allemaal zwaarden vasthouden, geoefend ten oorlog, ieder met zijn zwaard aan zijn heup, vanwege de schrik 's nachts.", "Spr 10:29": "De weg van de HEERE is sterkte voor de oprechte; maar ondergang voor de werkers van ongerechtigheid.", "Ps 107:43": "Wie is wijs? Laat hij op deze dingen letten; en laat men verstandig letten op de blijken van goedertierenheid van de HEERE.", "Gal 6:8": "Want die in zijn eigen vlees zaait, zal uit het vlees verderf maaien; maar die in de Geest zaait, zal uit de Geest het eeuwige leven maaien.", "Job 8:2": "Hoe lang zult u deze dingen nog spreken, en hoe lang zullen de woorden van uw mond een geweldige wind zijn?", "Ps 92:16": "Om te verkondigen dat de HEERE recht is; Hij is mijn Rotssteen, en in Hem is geen onrecht.", "Ps 12:6": "Om de verwoesting van de ellendigen, om het kermen van de behoeftigen, zal Ik nu opstaan, zegt de HEERE; Ik zal in veiligheid zetten wie ernaar snakt.", "Job 35:2": "Houdt u dat voor recht, dat u gezegd hebt: Mijn gerechtigheid is meer dan die van God?", "Luk 17:31": "Op die dag, wie op het dak zal zijn, met zijn huisraad in huis, laat hij niet naar beneden komen om het weg te nemen; en wie op de akker zal zijn, laat hij zich evenmin omkeren naar wat achter hem is.", "Job 9:12": "Zie, Hij zal roven, wie zal het Hem doen teruggeven? Wie zal tegen Hem zeggen: Wat doet U?", "Job 9:23": "Als de gesel haastig doodt, bespot Hij de beproeving van de onschuldigen.", "Job 31:30": "(Ook heb ik mijn gehemelte niet toegelaten te zondigen, door een vloek zijn ziel te begeren).", "Job 1:22": "In dit alles zondigde Job niet, en schreef God niets van het ongerijmd toe.", "Job 27:2": "Zo waarachtig als God leeft, Die mijn recht weggenomen heeft, en de Almachtige, Die mijn ziel bitterheid heeft aangedaan!", "Hebr 10:39": "Maar wij zijn niet van hen die zich terugtrekken tot verderf, maar van hen die geloven tot behoud van de ziel.", "1 Sam 15:28": "Toen zei Samuël tegen hem: De HEERE heeft heden het koninkrijk van Israël van u afgescheurd, en heeft het aan uw naaste gegeven, die beter is dan u.", "Spr 1:30": "Zij hebben in Mijn raad niet toegestemd; al Mijn bestraffingen hebben zij versmaad;", "Job 18:4": "O u, die uw ziel verscheurt door uw toorn! Zal om uwentwil de aarde verlaten worden, en zal een rots weggenomen worden uit haar plaats?", "Job 16:17": "Terwijl er toch geen onrecht in mijn handen is, en mijn gebed zuiver is.", "Ex 3:7": "En de HEERE zei: Ik heb heel goed gezien de verdrukking van Mijn volk dat in Egypte is, en heb hun geschrei gehoord vanwege hun drijvers; want Ik ken hun smarten.", "Ex 3:9": "En nu, zie, het geschrei van de kinderen van Israël is tot Mij gekomen; en ook heb Ik de verdrukking gezien waarmee de Egyptenaren hen verdrukken.", "1 Sam 15:11": "Het berouwt Mij dat Ik Saul tot koning gemaakt heb, omdat hij zich van Mij afgekeerd heeft, en Mijn woorden niet volbracht heeft. Toen ontstak Samuël in toorn, en hij riep tot de HEERE de hele nacht.", "2 Kron 19:7": "Nu dan, laat de vrees voor de HEERE op u zijn; wees zorgvuldig, en doe het; want bij de HEERE, onze God, is geen onrecht, geen aanneming van personen, en geen ontvangst van geschenken.", "Hand 12:23": "En meteen sloeg hem een engel van de Heere, omdat hij God de eer niet gaf; en hij werd door de wormen opgegeten, en gaf de geest.", "Jes 40:13": "Wie heeft de Geest van de HEERE bestierd, en wie heeft Hem als Zijn raadsman onderwezen?", "Richt 20:7": "Zie, u bent allen kinderen van Israël, geef hier voor u woord en raad!", "Dan 2:35": "Toen werden het ijzer, het leem, het koper, het zilver en het goud tegelijk verbrijzeld, en zij werden als kaf van de dorsvloeren in de zomer, en de wind voerde ze weg, zodat er geen plaats meer voor gevonden werd; maar de steen die het beeld verbrijzeld had, werd tot een grote berg, zodat hij de hele aarde vulde.", "2 Sam 12:11": "Zo zegt de HEERE: Zie, Ik zal kwaad over u verwekken uit uw eigen huis, en Ik zal uw vrouwen nemen voor uw ogen, en zal ze aan uw naaste geven; die zal bij uw vrouwen liggen, voor de ogen van deze zon.", "2 Sam 7:1": "En het gebeurde, toen de koning in zijn huis zat, en de HEERE hem rust gegeven had van al zijn vijanden rondom,", "Job 10:2": "Ik zal tegen God zeggen: Verdoem mij niet; laat mij weten, waarom U met mij twist.", "Hebr 2:2": "Want als het woord, dat door de engelen gesproken is, vast is geweest, en elke overtreding en ongehoorzaamheid rechtvaardige vergelding ontvangen heeft,", "Job 35:3": "Want u hebt gezegd: Wat zou het u baten? Wat voor meer voordeel zal ik daarmee doen, dan met mijn zonde?", "Job 31:19": "Als ik iemand heb zien omkomen, omdat hij zonder kleding was, en dat de nooddruftige geen deksel had;", "Gen 18:25": "Het zij verre van U, zoiets te doen, de rechtvaardige te doden met de goddeloze! zodat de rechtvaardige zou zijn als de goddeloze, verre zij het van U! zou de Rechter van de hele aarde geen recht doen?", "Ps 94:5": "O HEERE! Zij verbrijzelen Uw volk, en zij verdrukken Uw erfdeel.", "Job 31:3": "Is niet het verderf voor de verkeerde, ja, wat vreemds voor de werkers van ongerechtigheid?", "Job 11:4": "Want u hebt gezegd: Mijn leer is zuiver, en ik ben rein in uw ogen.", "Job 33:9": "Ik ben rein, zonder overtreding; ik ben zuiver, en heb geen misdaad.", "Dan 2:45": "Daarom hebt u gezien dat uit de berg een steen zonder handen werd afgehouwen, die het ijzer, koper, leem, zilver en goud verbrijzelde; de grote God heeft de koning bekendgemaakt wat hierna gebeuren zal; de droom is dus waar, en de uitleg ervan betrouwbaar.", "Jes 1:20": "Maar als u weigert, en opstandig bent, zult u door het zwaard gegeten worden; want de mond van de HEERE heeft het gesproken.", "Ps 125:5": "Maar die zich neigen tot hun kromme wegen, die zal de HEERE weg doen gaan met de werkers van de ongerechtigheid. Vrede zal over Israël zijn!", "2 Sam 19:21": "Toen antwoordde Abisai, de zoon van Zeruja, en zei: Zou Simeï hiervoor niet gedood moeten worden? Hij heeft toch de gezalfde van de HEERE vervloekt?", "Job 12:21": "Hij giet verachting uit over de prinsen, en Hij verslapt de riem van de geweldigen.", "1 Tim 5:24": "Van sommige mensen zijn de zonden al vooraf openbaar, en gaan vooruit tot hun veroordeling; en bij sommigen komen zij later aan het licht.", "Spr 28:13": "Wie zijn overtredingen bedekt, zal geen voorspoed hebben; maar wie ze belijdt en laat, zal barmhartigheid ontvangen.", "Job 10:7": "Het is Uw wetenschap, dat ik niet goddeloos ben; nochtans is er niemand, die uit Uw hand verlost.", "Job 11:2": "Zou de veelheid van woorden niet beantwoord worden, en zou een klapachtig man gelijk hebben?", "Jak 5:4": "Zie, het loon van de arbeiders die uw landen gemaaid hebben, dat door u is achtergehouden, roept; en het geschrei van hen die geoogst hebben, is gekomen tot in de oren van de Heere Sebaoth.", "Jak 2:5": "Luister, mijn geliefde broeders, heeft God niet de armen van deze wereld uitverkoren, om rijk te zijn in het geloof, en erfgenamen van het Koninkrijk, dat Hij belooft aan hen die Hem liefhebben?", "Dan 5:30": "In diezelfde nacht werd Belsazar, de koning van de Chaldeeën, gedood.", "Job 23:13": "Maar is Hij tegen iemand, wie zal Hem dan afkeren? Wat Zijn ziel begeert, dat zal Hij doen.", "Jes 66:18": "Hun werken en hun gedachten! Het komt, dat Ik alle heidenen en talen zal verzamelen, en zij zullen komen, en zij zullen Mijn heerlijkheid zien.", "Job 6:4": "Want de pijlen van de Almachtige zijn in mij, waarvan het vurige venijn mijn geest uitdrinkt; de verschrikkingen van God rusten zich tegen mij.", "Job 29:12": "Want ik bevrijdde de ellendige die riep, en de wees die geen helper had.", "1 Kon 14:8": "en het koninkrijk van het huis van David weggescheurd heb, en dat aan u gegeven heb, en u niet geweest bent zoals Mijn dienaar David, die Mijn geboden hield, en Mij met heel zijn hart navolgde, om alleen te doen wat recht is in Mijn ogen;", "Ps 139:23": "Doorgrond mij, o God! En ken mijn hart; beproef mij, en ken mijn gedachten.", "Jes 42:3": "Het geknakte riet zal Hij niet breken, en de rokende vlaswiek zal Hij niet uitblussen; met waarheid zal Hij het recht voortbrengen.", "Job 12:14": "Zie, Hij breekt af, en het zal niet herbouwd worden; Hij besluit iemand op, en er zal niet opengedaan worden.", "Jak 1:13": "Niemand moet, als hij verzocht wordt, zeggen: Ik word door God verzocht; want God kan niet verzocht worden met het kwade, en Hij Zelf verzoekt niemand.", "Ps 5:6": "De onzinnigen zullen voor Uw ogen niet bestaan; U haat alle werkers van de ongerechtigheid.", "Openb 22:12": "En zie, Ik kom haastig, en Mijn loon is met Mij, om ieder te vergelden zoals zijn werk zal zijn.", "Job 24:17": "Want de morgenstond is voor hen allemaal de schaduw van de dood; want kent men hen, dan verkeren zij in de verschrikkingen van de schaduw van de dood.", "Jes 37:36": "Toen ging de engel van de HEERE uit, en sloeg in het leger van Assyrië honderdvijfentachtigduizend man. En toen zij zich 's morgens vroeg opmaakten, zie, dat waren allemaal dode lichamen.", "Rom 9:14": "Wat zullen wij dan zeggen? Is er onrechtvaardigheid bij God? Dat zij verre.", "Openb 6:16": "En zeiden tot de bergen en tot de steenrotsen: Valt op ons, en verbergt ons van het aangezicht van Hem Die op de troon zit, en van de toorn van het Lam.", "1 Kor 2:15": "Maar de geestelijke mens beoordeelt wel alle dingen, maar hijzelf wordt door niemand beoordeeld.", "Spr 6:32": "Maar wie met een vrouw overspel doet, mist verstand; hij die dat doet, richt zichzelf te gronde;", "Jer 2:5": "Zo zegt de HEERE: Wat voor onrecht hebben uw vaders aan Mij gevonden, dat zij ver van Mij zijn geweken, en de ijdelheid hebben nagewandeld, en zelf ijdel zijn geworden?", "Spr 1:29": "Omdat zij de wetenschap gehaat hebben, en de vrees van de HEERE niet hebben verkozen.", "Jes 26:3": "Het is een vast voornemen: U zult allerlei vrede bewaren, want men heeft op U vertrouwd.", "Ps 49:7": "Aangaande hen die op hun bezit vertrouwen, en op de overvloed van hun rijkdom roemen;", "Job 11:6": "En u bekend maakte de verborgenheden van de wijsheid, omdat zij dubbel zijn in wezen! Weet daarom, dat God voor u minder rekent van uw ongerechtigheid dan die verdient.", "Rom 2:11": "Want er is geen aanneming van het persoon bij God.", "1 Kon 14:7": "Ga heen, zeg tegen Jerobeam: Zo zegt de HEERE, de God van Israël: Omdat Ik u verheven heb uit het midden van het volk, en u tot een leider over Mijn volk Israël gesteld heb;", "Ps 72:4": "Hij zal de ellendigen van het volk richten; hij zal de kinderen van de behoeftige verlossen, en de verdrukker verbrijzelen.", "1 Tess 5:2": "Want u weet zelf zeer goed dat de dag van de Heere zo zal komen, zoals een dief in de nacht.", "Jes 37:38": "Het gebeurde nu, toen hij zich in het huis van Nisroch, zijn god, neerboog, dat Adramelech en Sarezer, zijn zonen, hem met het zwaard versloegen; maar zij ontkwamen naar het land van Ararat; en Esar-haddon, zijn zoon, werd koning in zijn plaats.", "Spr 1:31": "Zo zullen zij eten van de vrucht van hun weg, en zich verzadigen met hun eigen plannen.", "Job 27:10": "Zal hij zich verlustigen in de Almachtige? Zal hij God aanroepen te aller tijd?", "Ps 73:19": "Hoe worden zij als in een ogenblik tot verwoesting, komen zij aan hun einde, gaan zij te niet van verschrikkingen!", "Job 32:1": "Toen hielden de drie mannen op Job te antwoorden, omdat hij in zijn eigen ogen rechtvaardig was.", "Job 12:19": "Hij voert de leiders beroofd weg, en de machtigen keert Hij om."}, "noten": {"1": "D.i.: nietswaardig, verderfelijk mens (SV: Belial)"}, "koppeling": {"1": "<span class=\"wl\" data-l=\"L1\" data-code=\"H6030\">Verder</span> <span class= ata-code=\"H2403\">zonde</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H2403\">zou</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H561\">hij</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H6588\">nog</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H6588\">overtreding</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H3254\">bijvoegen</span>; <span class=\"wl\" data-l=\"L3\" data-code=\"H6588\">hij</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H6588\">zou</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H996\">onder</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H5606\">ons</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H5606\">in</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H5606\">de</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H5606\">handen</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H5606\">klappen</span>, <span class=\"wl\" data-l=\"L7\" data-code=\"H561\">en</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H996\">hij</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H996\">zou</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H561\">zijn</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H561\">redenen</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H7235\">vermenigvuldigen</span> <span class=\"wl\" data-l=\"L9\" data-code=\"H410\">tegen</span> <span class=\"wl\" data-l=\"L9\" data-code=\"H410\">God</span>."}, "koppeling_kjv": {"1": "Furthermore <span class=\"wl wl-kjv\" data-code=\"H453\">Elihu</span> <span class=\"wl wl-kjv\" data-code=\"H6030\">answered</span> and said,", "2": "<span class=\"wl wl-kjv\" data-code=\"H8085\">Hear</span> my <span class=\"wl wl-kjv\" data-code=\"H4405\">words,</span> O ye <span class=\"wl wl-kjv\" data-code=\"H2450\">wise</span> men; and give <span class=\"wl wl-kjv\" data-code=\"H238\">ear</span> unto me, ye that have knowledge.", "3": "For the <span class=\"wl wl-kjv\" data-code=\"H241\">ear</span> <span class=\"wl wl-kjv\" data-code=\"H974\">trieth</span> <span class=\"wl wl-kjv\" data-code=\"H4405\">words,</span> as the <span class=\"wl wl-kjv\" data-code=\"H2441\">mouth</span> <span class=\"wl wl-kjv\" data-code=\"H2938\">tasteth</span> meat.", "4": "Let us <span class=\"wl wl-kjv\" data-code=\"H977\">choose</span> to us <span class=\"wl wl-kjv\" data-code=\"H4941\">judgment:</span> let us <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> among ourselves what is good.", "5": "For <span class=\"wl wl-kjv\" data-code=\"H347\">Job</span> hath <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> I am <span class=\"wl wl-kjv\" data-code=\"H6663\">righteous:</span> and <span class=\"wl wl-kjv\" data-code=\"H410\">God</span> hath taken <span class=\"wl wl-kjv\" data-code=\"H5493\">away</span> my judgment.", "6": "Should I <span class=\"wl wl-kjv\" data-code=\"H3576\">lie</span> against my <span class=\"wl wl-kjv\" data-code=\"H4941\">right?</span> my <span class=\"wl wl-kjv\" data-code=\"H2671\">wound</span> is <span class=\"wl wl-kjv\" data-code=\"H605\">incurable</span> without transgression.", "7": "What <span class=\"wl wl-kjv\" data-code=\"H1397\">man</span> is like <span class=\"wl wl-kjv\" data-code=\"H347\">Job,</span> who drinketh <span class=\"wl wl-kjv\" data-code=\"H8354\">up</span> <span class=\"wl wl-kjv\" data-code=\"H3933\">scorning</span> like water?", "8": "Which <span class=\"wl wl-kjv\" data-code=\"H732\">goeth</span> in <span class=\"wl wl-kjv\" data-code=\"H2274\">company</span> with the <span class=\"wl wl-kjv\" data-code=\"H6466\">workers</span> of <span class=\"wl wl-kjv\" data-code=\"H205\">iniquity,</span> and <span class=\"wl wl-kjv\" data-code=\"H3212\">walketh</span> with <span class=\"wl wl-kjv\" data-code=\"H7562\">wicked</span> men.", "9": "For he hath <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> It <span class=\"wl wl-kjv\" data-code=\"H5532\">profiteth</span> a <span class=\"wl wl-kjv\" data-code=\"H1397\">man</span> nothing that he should <span class=\"wl wl-kjv\" data-code=\"H7521\">delight</span> himself with God.", "10": "Therefore <span class=\"wl wl-kjv\" data-code=\"H8085\">hearken</span> unto me, ye <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H3824\">understanding:</span> far be <span class=\"wl wl-kjv\" data-code=\"H2486\">it</span> from <span class=\"wl wl-kjv\" data-code=\"H410\">God,</span> that he should do <span class=\"wl wl-kjv\" data-code=\"H7562\">wickedness;</span> and from the <span class=\"wl wl-kjv\" data-code=\"H7706\">Almighty,</span> that he should commit iniquity.", "11": "For the <span class=\"wl wl-kjv\" data-code=\"H6467\">work</span> of a <span class=\"wl wl-kjv\" data-code=\"H120\">man</span> shall he <span class=\"wl wl-kjv\" data-code=\"H7999\">render</span> unto him, and cause every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> to <span class=\"wl wl-kjv\" data-code=\"H4672\">find</span> according to his ways.", "12": "Yea, <span class=\"wl wl-kjv\" data-code=\"H551\">surely</span> <span class=\"wl wl-kjv\" data-code=\"H410\">God</span> will not do <span class=\"wl wl-kjv\" data-code=\"H7561\">wickedly,</span> neither will the <span class=\"wl wl-kjv\" data-code=\"H7706\">Almighty</span> <span class=\"wl wl-kjv\" data-code=\"H5791\">pervert</span> judgment.", "13": "Who hath given him a <span class=\"wl wl-kjv\" data-code=\"H6485\">charge</span> over the <span class=\"wl wl-kjv\" data-code=\"H776\">earth?</span> or who hath <span class=\"wl wl-kjv\" data-code=\"H7760\">disposed</span> the whole world?", "14": "If he <span class=\"wl wl-kjv\" data-code=\"H7760\">set</span> his <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> upon man, if he <span class=\"wl wl-kjv\" data-code=\"H622\">gather</span> unto himself his <span class=\"wl wl-kjv\" data-code=\"H7307\">spirit</span> and his breath;", "15": "All <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh</span> shall <span class=\"wl wl-kjv\" data-code=\"H1478\">perish</span> <span class=\"wl wl-kjv\" data-code=\"H3162\">together,</span> and <span class=\"wl wl-kjv\" data-code=\"H120\">man</span> shall turn <span class=\"wl wl-kjv\" data-code=\"H7725\">again</span> unto dust.", "16": "If now thou hast <span class=\"wl wl-kjv\" data-code=\"H998\">understanding,</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">hear</span> this: <span class=\"wl wl-kjv\" data-code=\"H238\">hearken</span> to the <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> of my words.", "17": "Shall even he that <span class=\"wl wl-kjv\" data-code=\"H8130\">hateth</span> <span class=\"wl wl-kjv\" data-code=\"H4941\">right</span> <span class=\"wl wl-kjv\" data-code=\"H2280\">govern?</span> and wilt thou <span class=\"wl wl-kjv\" data-code=\"H7561\">condemn</span> him that is <span class=\"wl wl-kjv\" data-code=\"H3524\">most</span> just?", "18": "Is it fit to <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> to a <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> Thou art <span class=\"wl wl-kjv\" data-code=\"H1100\">wicked?</span> and to <span class=\"wl wl-kjv\" data-code=\"H5081\">princes,</span> Ye are ungodly?", "19": "How much less to him that <span class=\"wl wl-kjv\" data-code=\"H5375\">accepteth</span> not the <span class=\"wl wl-kjv\" data-code=\"H6440\">persons</span> of <span class=\"wl wl-kjv\" data-code=\"H8269\">princes,</span> nor <span class=\"wl wl-kjv\" data-code=\"H5234\">regardeth</span> the <span class=\"wl wl-kjv\" data-code=\"H7771\">rich</span> more <span class=\"wl wl-kjv\" data-code=\"H6440\">than</span> the <span class=\"wl wl-kjv\" data-code=\"H1800\">poor?</span> for they all are the <span class=\"wl wl-kjv\" data-code=\"H4639\">work</span> of his hands.", "20": "In a <span class=\"wl wl-kjv\" data-code=\"H7281\">moment</span> shall they <span class=\"wl wl-kjv\" data-code=\"H4191\">die,</span> and the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> shall be <span class=\"wl wl-kjv\" data-code=\"H1607\">troubled</span> at <span class=\"wl wl-kjv\" data-code=\"H2676\">midnight,</span> and pass <span class=\"wl wl-kjv\" data-code=\"H5674\">away:</span> and the <span class=\"wl wl-kjv\" data-code=\"H47\">mighty</span> shall be taken <span class=\"wl wl-kjv\" data-code=\"H5493\">away</span> without hand.", "21": "For his <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes</span> are upon the <span class=\"wl wl-kjv\" data-code=\"H1870\">ways</span> of <span class=\"wl wl-kjv\" data-code=\"H376\">man,</span> and he <span class=\"wl wl-kjv\" data-code=\"H7200\">seeth</span> all his goings.", "22": "There is no <span class=\"wl wl-kjv\" data-code=\"H2822\">darkness,</span> nor shadow of <span class=\"wl wl-kjv\" data-code=\"H6757\">death,</span> where the <span class=\"wl wl-kjv\" data-code=\"H6466\">workers</span> of <span class=\"wl wl-kjv\" data-code=\"H205\">iniquity</span> may hide", "23": "For he will not <span class=\"wl wl-kjv\" data-code=\"H7760\">lay</span> upon <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> more than right; that he should <span class=\"wl wl-kjv\" data-code=\"H1980\">enter</span> into <span class=\"wl wl-kjv\" data-code=\"H4941\">judgment</span> with God.", "24": "He shall break in <span class=\"wl wl-kjv\" data-code=\"H7489\">pieces</span> mighty <span class=\"wl wl-kjv\" data-code=\"H3524\">men</span> without <span class=\"wl wl-kjv\" data-code=\"H2714\">number,</span> and <span class=\"wl wl-kjv\" data-code=\"H5975\">set</span> others", "25": "Therefore he <span class=\"wl wl-kjv\" data-code=\"H5234\">knoweth</span> their <span class=\"wl wl-kjv\" data-code=\"H4566\">works,</span> and he <span class=\"wl wl-kjv\" data-code=\"H2015\">overturneth</span> them in the <span class=\"wl wl-kjv\" data-code=\"H3915\">night,</span> so that they are destroyed.", "26": "He <span class=\"wl wl-kjv\" data-code=\"H5606\">striketh</span> them <span class=\"wl wl-kjv\" data-code=\"H8478\">as</span> wicked <span class=\"wl wl-kjv\" data-code=\"H7563\">men</span> in the <span class=\"wl wl-kjv\" data-code=\"H4725\">open</span> sight", "27": "Because they turned <span class=\"wl wl-kjv\" data-code=\"H5493\">back</span> from <span class=\"wl wl-kjv\" data-code=\"H310\">him,</span> and would not <span class=\"wl wl-kjv\" data-code=\"H7919\">consider</span> any of his ways:", "28": "So that they cause the <span class=\"wl wl-kjv\" data-code=\"H6818\">cry</span> of the <span class=\"wl wl-kjv\" data-code=\"H1800\">poor</span> to <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> unto him, and he <span class=\"wl wl-kjv\" data-code=\"H8085\">heareth</span> the <span class=\"wl wl-kjv\" data-code=\"H6818\">cry</span> of the afflicted.", "29": "When he giveth <span class=\"wl wl-kjv\" data-code=\"H8252\">quietness,</span> who then can make <span class=\"wl wl-kjv\" data-code=\"H7561\">trouble?</span> and when he <span class=\"wl wl-kjv\" data-code=\"H5641\">hideth</span> his <span class=\"wl wl-kjv\" data-code=\"H6440\">face,</span> who then can <span class=\"wl wl-kjv\" data-code=\"H7789\">behold</span> him? whether it be done against a <span class=\"wl wl-kjv\" data-code=\"H1471\">nation,</span> or against a <span class=\"wl wl-kjv\" data-code=\"H120\">man</span> only:", "30": "That the <span class=\"wl wl-kjv\" data-code=\"H120\">hypocrite</span> <span class=\"wl wl-kjv\" data-code=\"H4427\">reign</span> not, lest the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> be ensnared.", "31": "Surely it is meet to be <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H410\">God,</span> I have <span class=\"wl wl-kjv\" data-code=\"H5375\">borne</span> chastisement, I will not offend", "32": "That which I <span class=\"wl wl-kjv\" data-code=\"H2372\">see</span> <span class=\"wl wl-kjv\" data-code=\"H1107\">not</span> <span class=\"wl wl-kjv\" data-code=\"H3384\">teach</span> thou me: if I have <span class=\"wl wl-kjv\" data-code=\"H6466\">done</span> <span class=\"wl wl-kjv\" data-code=\"H5766\">iniquity,</span> I will do", "33": "Should it be according to thy mind? he will <span class=\"wl wl-kjv\" data-code=\"H7999\">recompense</span> it, whether thou <span class=\"wl wl-kjv\" data-code=\"H3588\">refuse,</span> or whether thou <span class=\"wl wl-kjv\" data-code=\"H977\">choose;</span> and not I: therefore <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> what thou knowest.", "34": "Let <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H3824\">understanding</span> <span class=\"wl wl-kjv\" data-code=\"H559\">tell</span> me, and let a <span class=\"wl wl-kjv\" data-code=\"H2450\">wise</span> <span class=\"wl wl-kjv\" data-code=\"H1397\">man</span> hearken", "35": "<span class=\"wl wl-kjv\" data-code=\"H347\">Job</span> hath <span class=\"wl wl-kjv\" data-code=\"H1696\">spoken</span> without <span class=\"wl wl-kjv\" data-code=\"H1847\">knowledge,</span> and his <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> were without wisdom.", "36": "My <span class=\"wl wl-kjv\" data-code=\"H15\">desire</span> is that <span class=\"wl wl-kjv\" data-code=\"H347\">Job</span> may be <span class=\"wl wl-kjv\" data-code=\"H974\">tried</span> unto the <span class=\"wl wl-kjv\" data-code=\"H5331\">end</span> because of his <span class=\"wl wl-kjv\" data-code=\"H8666\">answers</span> for <span class=\"wl wl-kjv\" data-code=\"H205\">wicked</span> men.", "37": "For he <span class=\"wl wl-kjv\" data-code=\"H3254\">addeth</span> <span class=\"wl wl-kjv\" data-code=\"H6588\">rebellion</span> unto his <span class=\"wl wl-kjv\" data-code=\"H2403\">sin,</span> he <span class=\"wl wl-kjv\" data-code=\"H5606\">clappeth</span> his hands among us, and <span class=\"wl wl-kjv\" data-code=\"H7235\">multiplieth</span> his <span class=\"wl wl-kjv\" data-code=\"H561\">words</span> against God."}};

(function bouwHfdnav() {
  const m = D.meta;
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden"><select id="boekkies">${boekOpties}</select> ` +
    `<select id="hfdkies">${hfdOpties}</select></span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.Berea[n] || '—');
}

/* ---------- vertaling-keuze (dropdown) + studie-dropdown ---------- */
(function bouwVertaalkies() {
  const sel = document.getElementById('vertaalkies');
  sel.innerHTML = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  sel.onchange = e => { vertaling = e.target.value; bouwRijen(); };
})();
document.getElementById('studiekies').onchange = e => { if (e.target.value) location.href = e.target.value; };

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.Berea[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (Berea)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function paneelInhoud(n, tab) {
  if (tab === 'grondwoorden') {
    const heeftB = D.koppeling && D.koppeling[n];
    const heeftK = D.koppeling_kjv && D.koppeling_kjv[n];
    if (!heeftB && !heeftK) return '<em>Nog geen woordkoppeling voor dit vers.</em>';
    let h = '';
    if (heeftB) h += `<div class="tsk-kop">Berea</div>` +
      `<div class="gw-tekst" style="font-family:Georgia,serif;line-height:1.8">${D.koppeling[n]}</div>` +
      `<div class="gw-detail" style="margin-top:.5rem"></div>`;
    if (heeftK) h += `<div class="tsk-kop" style="margin-top:.9rem">KJV</div>` +
      `<div class="gw-tekst" style="font-family:Georgia,serif;line-height:1.8">${D.koppeling_kjv[n]}</div>` +
      `<div class="gw-detail" style="margin-top:.5rem"></div>`;
    return h + '<div class="bronregel">Klik op een onderstreept woord voor de vindplaatsen.</div>';
  }
  if (tab === 'vertalingen') {
    return PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
  }
  if (tab === 'verwijzingen') {
    const berea = D.tsk[n], engels = D.tsk_kjv[n];
    if ((!berea || !berea.length) && (!engels || !engels.length)) return '<em>Geen verwijzingen bij dit vers.</em>';
    let h = '';
    if (berea && berea.length) {
      h += '<div class="tsk-kop">Treasury of Scripture Knowledge | Berea</div>';
      h += berea.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r}">${r}</a>`).join('') + '</div>').join('');
    }
    if (engels && engels.length) {
      h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.subs && it.subs.length ? `<ul class="ond-subs">${it.subs.map(s=>`<li>${s}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.tsk[n] && D.tsk[n].length), heeftO = !!D.onderwerpen[n];
  const heeftG = !!((D.koppeling && D.koppeling[n]) || (D.koppeling_kjv && D.koppeling_kjv[n]));
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : (heeftG ? 'grondwoorden' : 'vertalingen'));
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'grondwoorden' ? 'actief' : ''} ${heeftG ? '' : 'leeg'}" data-tab="grondwoorden" data-n="${n}">Grondwoorden</div>
    <div class="ntab" data-tab="vertalingen" data-n="${n}">Vertalingen</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.Berea[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · Berea</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}
</script>
</body>
