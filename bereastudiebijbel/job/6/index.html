ats.", "18": "De gangen van haar weg wenden zich ter zijde af; zij lopen op in het woeste, en vergaan.", "19": "De reizigers van Thema zien ze, de wandelaars van Scheba wachten op haar.", "20": "Zij worden beschaamd, omdat elkeen vertrouwde; als zij daartoe komen, zo worden zij schaamrood.", "21": "Voorwaar, *zo* bent u *mij* nu niets geworden; u hebt de ontzetting gezien, en u hebt gevreesd.", "22": "Heb ik gezegd: Brengt mij, en geeft geschenken voor mij van uw vermogen?", "23": "Of bevrijdt mij van de hand van de verdrukker, en verlost mij van de hand van de tirannen?", "24": "Leert mij, en ik zal zwijgen, en geeft mij te verstaan, waarin ik gedwaald heb.", "25": "O, hoe krachtig zijn de rechte redenen! Maar wat bestraft het bestraffen, *dat* van u is?", "26": "Zult u, om te bestraffen, woorden bedenken, en zullen de redenen van de mismoedige voor wind zijn?", "27": "Ook werpt u zich op een wees; en u graaft tegen uw vriend.", "28": "Maar nu, belieft het u, wendt u tot mij, en het zal voor uw aangezicht zijn, of ik liegt.", "29": "Keert toch weder, laat er geen onrecht zijn, ja, keert weder; nog zal mijn gerechtigheid daarin zijn.", "30": "Zou onrecht op mijn tong wezen? Zou mijn gehemelte niet de ellenden te verstaan geven?"}, "SV": {"1": "Maar Job antwoordde en zeide:", "2": "Och, of mijn verdriet recht gewogen wierd, en men mijn ellende samen in een weegschaal ophief!", "3": "Want het zou nu zwaarder zijn dan het zand der zeeën; daarom worden mijn woorden opgezwolgen.", "4": "Want de pijlen des Almachtigen zijn in mij, welker vurig venijn mijn geest uitdrinkt; de verschrikkingen Gods rusten zich tegen mij.", "5": "Rochelt ook de woudezel bij het jonge gras? Loeit de os bij zijn voeder?", "6": "Wordt ook het onsmakelijke gegeten zonder zout? Is er smaak in het witte des dooiers?", "7": "Mijn ziel weigert *uw* *woorden* aan te roeren; die zijn als mijn laffe spijze.", "8": "Och, of mijn begeerte kwame, en dat God mijn verwachting gave;", "9": "En dat het Gode beliefde, dat Hij mij verbrijzelde, Zijn hand losliet, en een einde met mij maakte!", "10": "Dat zou nog mijn troost zijn, en zou mij verkwikken in den weedom, *zo* Hij niet spaarde; want ik heb de redenen des Heiligen niet verborgen gehouden.", "11": "Wat is mijn kracht, dat ik hopen zou? Of welk is mijn einde, dat ik mijn leven verlengen zou?", "12": "Is mijn kracht stenen kracht? Is mijn vlees staal?", "13": "Is dan mijn hulp niet in mij, en is de wijsheid uit mij verdreven?", "14": "Aan hem, die versmolten is, zou van zijn vriend weldadigheid geschieden; of hij zou de vreze des Almachtigen verlaten.", "15": "Mijn broeders hebben trouwelooslijk gehandeld als een beek; als de storting der beken gaan zij door;", "16": "Die verdonkerd zijn van het ijs, *en* in dewelke de sneeuw zich verbergt.", "17": "Ten tijde, als zij van hitte vervlieten, worden zij uitgedelgd; als zij warm worden, verdwijnen zij uit haar plaats.", "18": "De gangen haars wegs wenden zich ter zijde af; zij lopen op in het woeste, en vergaan.", "19": "De reizigers van Thema zien ze, de wandelaars van Scheba wachten op haar.", "20": "Zij worden beschaamd, omdat elkeen vertrouwde; als zij daartoe komen, zo worden zij schaamrood.", "21": "Voorwaar, *alzo* zijt gijlieden *mij* nu niets geworden; gij hebt gezien de ontzetting, en gij hebt gevreesd.", "22": "Heb ik gezegd: Brengt mij, en geeft geschenken voor mij van uw vermogen?", "23": "Of bevrijdt mij van de hand des verdrukkers, en verlost mij van de hand der tirannen?", "24": "Leert mij, en ik zal zwijgen, en geeft mij te verstaan, waarin ik gedwaald heb.", "25": "O, hoe krachtig zijn de rechte redenen! Maar wat bestraft het bestraffen, *dat* van ulieden is?", "26": "Zult gij, om te bestraffen, woorden bedenken, en zullen de redenen des mismoedigen voor wind zijn?", "27": "Ook werpt gij u op een wees; en gij graaft tegen uw vriend.", "28": "Maar nu, belieft het u, wendt u tot mij, en het zal voor ulieder aangezicht zijn, of ik liege.", "29": "Keert toch weder, laat er geen onrecht wezen, ja, keert weder; nog zal mijn gerechtigheid daarin zijn.", "30": "Zou onrecht op mijn tong wezen? Zou mijn gehemelte niet de ellenden te verstaan geven?"}, "KJV": {"1": "But Job answered and said,", "2": "Oh that my grief were throughly weighed, and my calamity laid in the balances together!", "3": "For now it would be heavier than the sand of the sea: therefore my words are swallowed up.", "4": "For the arrows of the Almighty *are* within me, the poison whereof drinketh up my spirit: the terrors of God do set themselves in array", "5": "Doth the wild ass bray when he hath grass? or loweth the ox over his fodder?", "6": "Can that which is unsavoury be eaten without salt? or is there *any* taste in the white of an egg?", "7": "The things *that* my soul refused to touch *are* as my sorrowful meat.", "8": "Oh that I might have my request; and that God would grant *me* the thing that I long for!", "9": "Even that it would please God to destroy me; that he would let loose his hand, and cut me off!", "10": "Then should I yet have comfort; yea, I would harden myself in sorrow: let him not spare; for I have not concealed the words of the Holy One.", "11": "What *is* my strength, that I should hope? and what *is* mine end, that I should prolong my life?", "12": "*Is* my strength the strength of stones? or *is* my flesh of brass?", "13": "*Is* not my help in me? and is wisdom driven quite", "14": "To him that is afflicted pity *should be shewed* from his friend; but he forsaketh the fear of the Almighty.", "15": "My brethren have dealt deceitfully as a brook, *and* as the stream of brooks they pass away;", "16": "Which are blackish by reason of the ice, *and* wherein the snow is hid:", "17": "What time they wax warm, they vanish: when it is hot, they are consumed out of their place.", "18": "The paths of their way are turned aside; they go to nothing, and perish.", "19": "The troops of Tema looked, the companies of Sheba waited", "20": "They were confounded because they had hoped; they came thither, and were ashamed.", "21": "For now ye are nothing; ye see *my* casting down, and are afraid.", "22": "Did I say, Bring unto me? or, Give a reward for me of your substance?", "23": "Or, Deliver me from the enemy's hand? or, Redeem me from the hand of the mighty?", "24": "Teach me, and I will hold my tongue: and cause me to understand wherein I have erred.", "25": "How forcible are right words! but what doth your arguing reprove?", "26": "Do ye imagine to reprove words, and the speeches of one that is desperate, *which are* as wind?", "27": "Yea, ye overwhelm the fatherless, and ye dig *a pit* for your friend.", "28": "Now therefore be content, look upon me; for *it is* evident unto you if I lie.", "29": "Return, I pray you, let it not be iniquity; yea, return again, my righteousness", "30": "Is there iniquity in my tongue? cannot my taste discern perverse things?"}}, "tsk": {"1": [{"kopje": "antwoordde", "refs": ["Job 4:1"]}], "2": [{"kopje": "grondig", "refs": ["Job 4:5", "Job 23:2"]}], "3": [{"kopje": "zwaarder", "refs": ["Spr 27:3", "Matt 11:28"]}, {"kopje": "mijn woorden opgezwolgen", "refs": ["Job 37:19", "Job 37:20", "Ps 40:6", "Ps 77:5"]}], "4": [{"kopje": "de pijlen", "refs": ["Job 16:12-14", "Deut 32:23", "Deut 32:42", "Ps 7:14", "Ps 18:15", "Ps 21:13", "Ps 38:3", "Ps 45:6", "Klaagl 3:12", "Klaagl 3:13"]}, {"kopje": "uitdrinkt", "refs": ["Deut 32:24", "Ps 143:7", "Spr 18:14", "Mark 14:33", "Mark 14:34", "Mark 15:34"]}, {"kopje": "de verschrikkingen", "refs": ["Job 9:17", "Job 30:15", "Job 31:23", "Ps 88:16", "Ps 88:17", "2 Kor 5:11"]}], "5": [{"kopje": "bij zijn voeder", "refs": ["Ps 104:14"]}, {"kopje": "loeit", "refs": ["Ps 42:2", "Jer 14:6", "Joël 1:18-20"]}], "6": [{"kopje": "het onsmakelijke", "refs": ["Job 6:25", "Job 16:2", "Lev 2:13", "Luk 14:34", "Kol 4:6"]}, {"kopje": "smaak", "refs": ["Job 6:30", "Job 12:11", "Job 34:3", "Ps 119:103", "Hebr 6:4", "Hebr 6:5"]}], "7": [{"kopje": "als mij  "../../jeremia/22/#v3", "ref": "Jer 22:3", "svLabel": null}, {"disp": "Jer 49:11", "href": "../../jeremia/49/#v11", "ref": "Jer 49:11", "svLabel": null}, {"disp": "Hos 14:3", "href": "../../hosea/14/#v4", "ref": "Hos 14:4", "svLabel": "SV 4"}, {"disp": "Mal 3:5", "href": "../../maleachi/3/#v5", "ref": "Mal 3:5", "svLabel": null}, {"disp": "Jak 1:27", "href": "../../jakobus/1/#v27", "ref": "Jak 1:27", "svLabel": null}], "kinderen": []}]}], "torrey": [{"topic": "Fatherless", "href": "../../torrey/f/#t-fatherless", "kinderen": [{"label": "The Wicked", "href": "../../torrey/f/?hl=Job.6.27#i6374", "refs": [], "kinderen": [{"label": "Overwhelm", "href": "../../torrey/f/?hl=Job.6.27#i6376", "refs": [{"disp": "Job 6:27", "href": "../../job/6/#v27", "ref": "Job 6:27", "svLabel": null}], "kinderen": []}]}]}]}}, "extern": {"Num 11:14": "Ik alleen kan al dit volk niet dragen; want het is mij te zwaar!", "Openb 3:7": "En schrijf aan de engel van de gemeente die in Filadelfia is: Dit zegt de Heilige, de Waarachtige, Die de sleutel van David heeft; Die opent, en niemand sluit, en Hij sluit, en niemand opent:", "Ps 41:10": "Zelfs de man van mijn vrede, op wie ik vertrouwde, die mijn brood at, heeft zijn hiel tegen mij groot gemaakt.", "Hos 12:2": "Efraïm weidt zich met wind, en jaagt de oostenwind na; de hele dag vermenigvuldigt hij leugen en verwoesting; en zij maken een verbond met Assur, en de olie wordt naar Egypte gevoerd.", "Jer 7:6": "de vreemdeling, de wees en de weduwe niet zult verdrukken, en geen onschuldig bloed in deze plaats zult vergieten, en andere goden niet zult nawandelen, u zelf tot kwaad;", "Deut 9:19": "Want ik vreesde vanwege de toorn en de grimmigheid waarmee de HEERE zeer op u vertoornd was, om u te verdelgen; toch verhoorde de HEERE mij ook op dat moment.", "Job 2:11-13": "Toen de drie vrienden van Job al dit kwaad hoorden dat over hem gekomen was, kwamen zij, ieder uit zijn eigen plaats: Elifaz, de Themaniet, en Bildad, de Suhiet, en Zofar, de Naämathiet; en zij waren het samen eens geworden dat zij zouden komen om hem te beklagen en om hem te troosten. En toen zij hun ogen van verre opsloegen, herkenden zij hem niet, en zij verhieven hun stem en weenden; daarbij scheurden zij ieder hun mantel, en strooiden stof op hun hoofden, omhoog naar de hemel. Zo zaten zij met hem op de grond, zeven dagen en zeven nachten; en niemand sprak een woord tegen hem, want zij zagen dat de smart zeer groot was.", "Spr 11:13": "Wie als een achterklapper rondgaat, openbaart het geheime; maar wie trouw is van geest, bedekt de zaak.", "Ps 88:16": "Van jongs af aan ben ik bedrukt en aan het sterven; ik draag Uw verschrikkingen, ik ben radeloos.", "Spr 16:21-24": "Wie wijs van hart is, zal verstandig genoemd worden; en zoetheid van de lippen zal de lering vermeerderen. Het verstand van hen die het bezitten is een bron van leven; maar de tucht van de dwazen is dwaasheid. Het hart van een wijze maakt zijn mond verstandig, en zal op zijn lippen de lering vermeerderen.", "Job 5:6": "Want uit het stof komt het verdriet niet voort, en de moeite spruit niet uit de aarde;", "Ezech 5:16": "Wanneer Ik de boze pijlen van de honger tegen hen uitzenden zal, die tot verderf zullen zijn, die Ik uitzenden zal om u te verderven; zo zal Ik de honger over u vermeerderen, en u de staf van het brood breken.", "Job 13:23": "Hoeveel misdaden en zonden heb ik? Maak mij mijn overtreding en mijn zonden bekend.", "Matt 7:22": "Velen zullen op die dag tegen Mij zeggen: Heere, Heere! Hebben wij niet in Uw Naam geprofeteerd, en in Uw Naam demonen uitgeworpen, en in Uw Naam veel krachten gedaan?", "Matt 7:23": "En dan zal Ik hun openlijk zeggen: Ik heb u nooit gekend; ga weg van Mij, u die de ongerechtigheid werkt!", "Job 33:31-33": "Merk op, o Job! Hoor naar mij; zwijg, en ik zal spreken. Als er redenen zijn, antwoord mij; spreek, want ik heb lust u te rechtvaardigen. Zo niet, hoor naar mij; zwijg, en ik zal u wijsheid leren.", "Jes 26:16": "HEERE, in benauwdheid hebben zij U bezocht; zij hebben hun stil gebed uitgestort, toen Uw tuchtiging over hen was.", "Jer 2:24": "Zij is een woudezelin, gewend aan de woestijn, naar de lust van haar ziel schept zij de wind; wie zou haar ontmoeting kunnen afkeren? Allen die haar zoeken, zullen niet moe worden, in haar maand zullen zij haar vinden.", "Ps 119:142": "Uw gerechtigheid is gerechtigheid in eeuwigheid, en Uw wet is de waarheid.", "Jes 2:3": "En veel volken zullen heengaan en zeggen: Kom, laat ons opgaan tot de berg van de HEERE, tot het huis van de God van Jakob, opdat Hij ons leert van Zijn wegen, en dat wij wandelen in Zijn paden; want uit Sion zal de wet uitgaan, en het woord van de HEERE uit Jeruzalem.", "Spr 28:26": "Wie op zijn eigen hart vertrouwt, die is een dwaas; maar wie in wijsheid wandelt, die zal ontkomen.", "Rom 8:20": "Want de schepping is aan de zinloosheid onderworpen, niet vrijwillig, maar om hem die haar daaraan onderworpen heeft,", "Ps 27:10": "Want mijn vader en mijn moeder hebben mij verlaten, maar de HEERE zal mij aannemen.", "Openb 3:19": "Ieder die Ik liefheb, die bestraf en tuchtig Ik; wees dan ijverig, en bekeer u.", "Job 40:3": "Zult u ook Mijn oordeel te niet maken? Zult U Mij verdoemen, opdat u rechtvaardig bent?", "Ps 40:6": "Gij, o HEERE, mijn God! hebt Uw wonderen en Uw gedachten aan ons vele gemaakt, men kan ze niet in orde bij U verhalen; zal ik ze verkondigen en uitspreken, dan zijn ze menigvuldiger dan dat ik ze zou kunnen vertellen.", "Job 33:8-12": "Zeker, u hebt gezegd voor mijn oren, en ik heb de stem der woorden gehoord; Ik ben rein, zonder overtreding; ik ben zuiver, en heb geen misdaad. Zie, Hij vindt oorzaken tegen mij, Hij houdt mij voor Zijn vijand.", "Job 23:10": "Toch kent Hij de weg die bij mij is; Hij beproeft mij; als goud zal ik uitkomen.", "Job 16:2": "Ik heb veel van zulke dingen gehoord; u bent allemaal moeilijke vertroosters.", "Dan 4:24-26": "Dit is de uitleg, o koning, en dit is een besluit van de Allerhoogste, dat over mijn heer de koning komen zal: Namelijk, men zal u van de mensen verstoten, en met het gedierte van het veld zal uw woning zijn, en men zal u gras te eten geven, zoals de ossen; en u zult door de dauw van de hemel nat gemaakt worden, en er zullen zeven tijden over u voorbijgaan, totdat u weet dat de Allerhoogste heerschappij heeft over de koninkrijken van de mensen, en ze geeft aan wie Hij wil. Dat er ook gezegd is dat men de stronk met de wortels van die boom zou laten staan; uw koninkrijk zal u zeker blijven, nadat u zult hebben erkend dat de Hemel heerst.", "Job 18:2-4": "Hoe lang duurt het nog voordat u een einde maakt aan uw woorden? Let op, en daarna zullen wij spreken. Waarom worden wij beschouwd als beesten, en zijn wij onrein in uw ogen? O u, die uw ziel verscheurt door uw toorn! Zal om uwentwil de aarde verlaten worden, en zal een rots weggenomen worden uit haar plaats?", "Ps 88:8": "Uw grimmigheid ligt op mij; U hebt mij neergedrukt met al Uw baren. Sela.", "Jer 2:35": "Nog zegt u: Zeker, ik ben onschuldig; Zijn toorn is immers van mij afgekeerd. Zie, Ik zal met u rechten, omdat u zegt: Ik heb niet gezondigd.", "Job 13:18": "Zie toch, ik heb de zaak ordelijk gesteld; ik weet dat ik rechtvaardig verklaard zal worden.", "1 Sam 15:14": "Toen zei Samuël: Wat is dan dit voor een geluid van schapen in mijn oren, en een geluid van runderen dat ik hoor?", "Job 5:17": "Zie, gelukzalig is de mens, aan wie God straft; daarom verwerp de kastijding van de Almachtige niet.", "Job 9:18": "Hij laat mij niet toe mijn adem te halen, maar Hij verzadigt mij met bitterheden.", "Ps 7:14": "En heeft dodelijke wapens voor hem gereedgemaakt; Hij zal Zijn pijlen tegen de felle vervolgers inzetten.", "Jes 30:11": "Wijkt af van de weg, maakt u van het pad; laat de Heilige van Israël van ons ophouden!", "Job 24:5": "Zie, zij zijn woudezels in de woestijn; zij gaan uit tot hun werk, maken zich vroeg op om te roven; het vlakke veld is voedsel voor hem en voor de jongeren.", "Ps 42:8": "De afgrond roept tot de afgrond, bij het gedruis van uw watergoten; al uw baren en uw golven zijn over mij heen gegaan.", "Ezech 39:7": "En Ik zal Mijn heilige Naam bekendmaken te midden van Mijn volk Israël, en Ik zal Mijn heilige Naam niet meer laten ontheiligen; en de heidenen zullen weten dat Ik de HEERE ben, de Heilige in Israël.", "Job 17:14-16": "Tot de groeve roep ik: U bent mijn vader! Tot het gewormte: Mijn moeder, en mijn zuster! Waar zou dan nu mijn verwachting wezen? Ja, mijn verwachting, wie zal ze aanschouwen? Zij zullen mee naar beneden gaan met de grendels van het graf, als er rust samen in het stof zal zijn.", "Jes 21:13": "De last tegen Arabië. In het woud van Arabië zult u overnachten, o reizende karavanen van Dedanieten!", "Job 33:1": "En zeker, o Job! Hoor toch mijn redenen, en neem al mijn woorden ter oor.", "Jes 58:6": "Is dit niet het vasten dat Ik verkies: dat u de knopen van de goddeloosheid losmaakt, dat u de banden van het juk ontdoet, en dat u de verpletterden vrij loslaat, en elk juk verscheurt?", "Deut 14:29": "Zo zal de Leviet komen – omdat hij geen deel noch erfdeel met u heeft – en de vreemdeling, en de wees en de weduwe die in uw poorten zijn, en zij zullen eten en verzadigd worden; opdat de HEERE, uw God, u zegent in al het werk van uw hand, dat u doen zult.", "Deut 32:4": "Hij is de Rotssteen, Wiens werk volkomen is; want al Zijn wegen zijn recht. God is waarheid, en is geen onrecht; rechtvaardig en recht is Hij.", "Ps 82:3": "Doe recht aan de arme en de wees; geef recht aan de verdrukte en de arme.", "Ps 98:1": "Een psalm. Zingt de HEERE een nieuw lied; want Hij heeft wonderen gedaan; Zijn rechterhand, en de arm van Zijn heiligheid, heeft Hem heil gegeven.", "Hebr 6:4": "Want het is onmogelijk om hen die eens verlicht zijn geweest, en de hemelse gave geproefd hebben, en deelgenoot geworden zijn van de Heilige Geest,", "2 Kor 12:21": "opdat mijn God mij niet opnieuw vernedert bij u, als ik gekomen zal zijn, en ik verdriet heb over velen, die eerder gezondigd hebben, en die zich niet bekeerd zullen hebben van de onreinheid, en hoererij, en losbandigheid, die zij bedreven hebben.", "1 Tim 5:10": "Met getuigenis van goede werken: als zij kinderen opgevoed heeft, als zij gastvrij is geweest, als zij de voeten van de heiligen heeft gewassen, als zij verdrukten voldoende hulp heeft gegeven, als zij elk goed werk heeft nagestreefd.", "Jer 18:20": "Zal dan kwaad voor goed vergolden worden? want zij hebben mijn ziel een kuil gegraven; gedenk dat ik voor Uw aangezicht gestaan heb om goed voor hen te spreken, om Uw grimmigheid van hen af te wenden.", "Ruth 1:20": "Maar zij zei tegen hen: Noem mij niet Naomi, noem mij Mara; want de Almachtige heeft mij grote bitterheid aangedaan.", "Jes 2:22": "Laat u dan af van de mens, wiens adem in zijn neus is, want waarin is hij te achten?", "Deut 4:5-31": "Zie, ik heb u de inzettingen en rechten geleerd, zoals de HEERE, mijn God, mij geboden heeft; opdat u zo doet in het land waar u naar toe gaat om het in bezit te nemen. Bewaar ze dan, en doe ze; want dat zal uw wijsheid en uw verstand zijn voor de ogen van de volken, die al deze inzettingen zullen horen en zeggen: Dit grote volk is werkelijk een wijs en verstandig volk! Want welk groot volk is er, dat de goden zo dichtbij heeft als de HEERE, onze God, bij ons is, zo vaak als wij Hem aanroepen?", "Micha 7:2": "De goedertierene is verdwenen uit het land, en er is niemand oprecht onder de mensen; zij loeren allemaal op bloed, zij jagen, ieder op zijn broeder, met een jachtnet.", "Jes 62:1": "Om Sion zal Ik niet zwijgen, en om Jeruzalem zal Ik niet stil zijn; totdat haar gerechtigheid voortkomt als een glans, en haar heil als een fakkel, die brandt.", "Spr 14:13": "Het hart zal ook bij het lachen verdriet hebben; en het einde van die blijdschap is droefheid.", "Jes 1:23": "Uw vorsten zijn afvalligen, en metgezellen van dieven, ieder van hen heeft geschenken lief, en zij jagen de vergeldingen na; de wezen doen zij geen recht, en de rechtszaak van de weduwen komt voor hen niet.", "Ps 71:17": "O God! Gij hebt mij geleerd van mijn jeugd af aan, en tot nog toe verkondig ik Uw wonderen.", "Matt 19:16-22": "En zie, er kwam iemand naar Hem toe, en zei tegen Hem: Goede Meester! Wat goeds zal ik doen, opdat ik het eeuwige leven heb? En Hij zei tegen hem: Wat noemt u Mij goed? Niemand is goed dan Eén, namelijk God. Maar wilt u het leven ingaan, onderhoud de geboden. Hij zei tegen Hem: Welke? En Jezus zei: Deze: U zult niet doden; u zult geen overspel doen; u zult niet stelen; u zult geen valse getuigenis geven;", "Ps 92:16": "Om te verkondigen dat de HEERE recht is; Hij is mijn Rotssteen, en in Hem is geen onrecht.", "Ps 51:15": "Zo zal ik de overtreders Uw wegen leren; en de zondaars zullen zich tot U bekeren.", "Hand 4:31": "En toen zij gebeden hadden, werd de plaats waarin zij bijeen waren, geschud. En zij werden allen vervuld met de Heilige Geest, en spraken het Woord van God met vrijmoedigheid.", "Spr 27:2": "Laat een vreemde u prijzen, en niet uw mond; een onbekende, en niet uw lippen.", "Job 42:11": "Ook kwamen tot hem al zijn broers, en al zijn zusters, en allen, die hem tevoren gekend hadden, en aten brood met hem in zijn huis, en beklaagden hem, en vertroostten hem over al het kwaad, dat de HEERE over hem gebracht had; en zij gaven hem ieder een stuk van het geld, ieder ook een gouden voorhoofdsieraad.", "Ps 39:2": "Ik zei: Ik zal op mijn wegen letten, dat ik niet zondig met mijn tong; ik zal mijn mond met een breidel in toom houden, terwijl de goddeloze nog tegenover mij is.", "Job 24:9": "Zij rukken het weesje van de borst, en wat de arme toebehoort, nemen zij te pand.", "Dan 4:8": "Totdat ten laatste Daniël bij mij binnenkwam, wiens naam Beltsazar is, naar de naam van mijn god, in wie ook de geest van de heilige goden is; en ik vertelde de droom aan hem en zei:", "Hebr 13:3": "Denk aan de gevangenen, alsof u mee gevangen was; en aan hen die kwalijk behandeld worden, alsof u ook zelf in het lichaam kwalijk behandeld was.", "Ezech 12:19": "En u zult tegen het volk van het land zeggen: Zo zegt de Heere HEERE, over de inwoners van Jeruzalem, in het land Israël: Zij zullen hun brood met bezorgdheid eten, en hun water zullen zij met ontzetting drinken, omdat hun land woest zal worden en zijn overvloed zal verliezen, vanwege het geweld van allen die daarin wonen;", "Ezech 4:14": "Toen zei ik: Ach, Heere HEERE, zie, mijn ziel is niet verontreinigd geweest; want ik heb van mijn jeugd af tot nu toe geen dood aas gegeten, of wat verscheurd is, en geen verfoeilijk vlees is in mijn mond gekomen.", "1 Sam 2:6": "De HEERE doodt en maakt levend; Hij doet naar het graf neerdalen, en Hij doet weer opkomen.", "Deut 9:4-6": "Wanneer de HEERE, uw God, hen nu voor uw aangezicht zal hebben uitgestoten, spreek dan niet in uw hart en zeg: De HEERE heeft mij om mijn gerechtigheid ingebracht, om dit land te erven; want om de goddeloosheid van deze volken verdrijft de HEERE hen voor uw aangezicht uit de bezitting. Niet om uw gerechtigheid, noch om de oprechtheid van uw hart, komt u daar binnen om hun land te erven; maar om de goddeloosheid van deze volken verdrijft de HEERE, uw God, hen voor uw aangezicht uit de bezitting: en om het woord te bevestigen dat de HEERE, uw God, aan uw vaderen, Abraham, Izak en Jakob, gezworen heeft. Weet dan, dat de HEERE, uw God, u niet om uw gerechtigheid dit goede land geeft om dat te erven; want u bent een hardnekkig volk.", "Jes 28:17": "En Ik zal het oordeel stellen naar het richtsnoer, en de gerechtigheid naar het paslood; en de hagel zal de toevlucht van de leugen wegvagen, en het water zal de schuilplaats overstromen.", "Jer 22:3": "Zo zegt de HEERE: Doe recht en gerechtigheid, en red de beroofde uit de hand van de verdrukker; en onderdruk de vreemdeling niet, de wees, noch de weduwe; doe geen geweld en vergiet geen onschuldig bloed op deze plaats.", "Job 12:3": "Ik heb ook een hart, net zoals u; ik ben niet minder dan u; en bij wie zijn niet zulke dingen bekend?", "Matt 16:6": "En Jezus zei tegen hen: Kijk uit, en wacht u voor de zuurdesem van de Farizeeën en Sadduceeën.", "Mark 9:49": "Want ieder zal met vuur gezouten worden, en elk offer zal met zout gezouten worden.", "Ps 99:3": "Laat men Uw grote en ontzagwekkende Naam loven, die heilig is;", "Ps 143:7": "Verhoor mij haastig, HEERE, mijn geest bezwijkt; verberg Uw aangezicht niet van mij, want ik zou gelijk worden aan hen die in de kuil neerdalen.", "Job 3:22": "Die blij zijn tot het opspringen toe, en zich verheugen, als zij het graf vinden;", "Ps 107:10": "Die in duisternis en de schaduw van de dood zaten, gebonden met verdrukking en ijzer;", "Luk 16:14": "En al deze dingen hoorden ook de Farizeeën, die geldgierig waren, en zij beschimpten Hem.", "Luk 10:30-37": "En Jezus antwoordde en zei: Een zeker mens ging van Jeruzalem naar Jericho, en viel in handen van rovers, die hem uitkleedden en daarbij zware slagen gaven, en weggingen en hem halfdood lieten liggen. En bij toeval kwam er een priester langs diezelfde weg; en toen hij hem zag, liep hij aan de overkant voorbij. En eveneens kwam er ook een Leviet bij die plaats, en toen hij hem zag, liep hij aan de overkant voorbij.", "Num 11:15": "En als U zo met mij doet, dood mij dan toch maar meteen, als ik genade in Uw ogen gevonden heb; en laat mij mijn ongeluk niet aanzien!", "Hand 4:2": "Zeer ontevreden, omdat zij het volk leerden en in Jezus de opstanding uit de doden verkondigden.", "Dan 10:3": "Smakelijk voedsel at ik niet, en vlees of wijn kwam niet in mijn mond; ook zalfde ik mij helemaal niet, totdat die drie volle weken vervuld waren.", "Ps 88:17": "Uw brandende toorn gaat over mij heen; Uw verschrikkingen doen mij vergaan.", "Lev 19:2": "Spreek tot de hele vergadering van de kinderen van Israël, en zeg tegen hen: U zult heilig zijn, want Ik, de HEERE, uw God, ben heilig!", "Fil 2:2": "Maak dan mijn blijdschap volkomen, dat u eensgezind bent, dezelfde liefde hebt, één van gemoed en één van gevoelen bent.", "Spr 25:17": "Spaar uw voet voor het huis van uw naaste, opdat hij niet zat van u wordt, en u haat.", "Ps 146:9": "De HEERE bewaart de vreemdelingen; Hij houdt de wees en de weduwe staande; maar de weg van de goddelozen keert Hij om.", "Ps 11:2": "Want zie, de goddelozen spannen de boog, zij leggen hun pijlen op de pees, om in het donker te schieten op de oprechten van hart.", "1 Kron 16:10": "Roemt u in de Naam van Zijn heiligheid; laat het hart van hen die de HEERE zoeken zich verblijden.", "Spr 15:13": "Een vrolijk hart maakt het gezicht blij; maar door verdriet in het hart wordt de geest verslagen.", "Jes 29:19": "En de zachtmoedigen zullen vreugde op vreugde hebben in de HEERE; en de behoeftigen onder de mensen zullen zich in de Heilige van Israël verheugen.", "Spr 17:22": "Een blij hart zal goed doen als een medicijn; maar een verslagen geest zal het gebeente doen verdrogen.", "Spr 12:25": "Bekommernis in het hart van de mens buigt het neer; maar een goed woord verblijdt het.", "2 Kor 10:18": "Want niet wie zichzelf prijst, die is beproefd, maar wie de Heere prijst.", "Ef 6:21": "En opdat ook u mag weten hoe het met mij gaat; en wat ik doe, dat alles zal Tychikus u bekendmaken, de geliefde broeder en trouwe dienaar in de Heere;", "Jes 26:17": "Zoals een zwangere vrouw, als zij nadert tot het baren, smarten heeft en schreeuwt in haar weeën, zo zijn wij geweest, o HEERE, vanwege Uw aangezicht.", "Deut 16:11": "En u zult vrolijk zijn voor het aangezicht van de HEERE, uw God, u, en uw zoon, en uw dochter, en uw dienstknecht, en uw dienstmaagd, en de Leviet die in uw poorten is, en de vreemdeling, en de wees, en de weduwe die in uw midden zijn; in de plaats die de HEERE, uw God, zal uitkiezen om Zijn Naam daar te doen wonen.", "Ps 71:18": "Daarom ook, terwijl het ouderdom en de grijsheid daar zijn, verlaat mij niet, o God, totdat ik aan dit geslacht Uw arm verkondig, aan alle nakomelingen Uw macht.", "Joz 5:15": "Toen zei de Vorst van het leger van de HEERE tegen Jozua: Trek uw schoenen uit van uw voeten; want de plaats waarop u staat, is heilig. En Jozua deed zo.", "Deut 28:15-68": "Daarentegen zal het gebeuren, als u niet naar de stem van de HEERE, uw God, luistert, om op te letten dat u al Zijn geboden en Zijn inzettingen doet, die ik u heden gebied; zo zullen al deze vloeken over u komen, en u treffen. Vervloekt zult u zijn in de stad, en vervloekt zult u zijn op het veld. Vervloekt zal zijn uw korf, en uw baktrog.", "Rom 5:5": "En de hoop beschaamt niet, omdat de liefde van God in onze harten uitgestort is door de Heilige Geest, Die ons gegeven is.", "Jes 5:21": "Wee hun die in hun eigen ogen wijs, en naar hun eigen oordeel verstandig zijn!", "Jes 21:14": "Komt de dorstige tegemoet met water; de inwoners van het land Thema zijn de vluchtende met hun brood tegemoetgekomen.", "Ps 33:4": "Want het woord van de HEERE is recht, en al Zijn werk is trouw.", "Joh 4:35": "Zegt u niet: Het zijn nog vier maanden, en dan komt de oogst? Zie, Ik zeg u: Sla uw ogen op en bekijk de velden; want ze zijn al wit om te oogsten.", "Ps 10:6": "Hij zegt in zijn hart: Ik zal niet wankelen; want ik zal van geslacht tot geslacht in geen kwaad zijn.", "Rom 12:15": "Verblijd u met de blijden, en ween met de wenende.", "Jer 2:22": "Want, al wast u zich met salpeter, en nam u veel zeep, toch is uw ongerechtigheid voor Mijn aangezicht getekend, spreekt de Heere HEERE.", "Job 13:28": "En hij vergaat als een verrotting, als een kleed dat de mot opeet.", "Rom 3:27": "Waar is dan de roem? Hij is uitgesloten. Door welke wet? Van de werken? Nee, maar door de wet van het geloof.", "Amos 3:3": "Zullen twee samen wandelen, tenzij zij bijeengekomen zijn?", "Job 17:1": "Mijn geest is verdorven, mijn dagen worden uitgeblust, de graven zijn voor mij.", "Job 41:15": "Zijn hart is vast als een steen; ja, vast als een deel van de onderste molensteen.", "Gen 25:3": "En Joksan verwekte Seba en Dedan; en de zonen van Dedan waren de Assurieten, en Letusieten, en Leummieten.", "Ps 90:7": "Want wij vergaan door Uw toorn; en door Uw grimmigheid worden wij verschrikt.", "Fil 2:26": "Omdat hij zeer begerig was naar u allen, en zeer beangst was, omdat u had gehoord dat hij ziek was geweest.", "Job 19:19": "Alle mensen van mijn heimelijke raad hebben een afkeer van mij; en degenen die ik liefhad, zijn tegen mij gekeerd.", "Job 12:14-25": "Zie, Hij breekt af, en het zal niet herbouwd worden; Hij besluit iemand op, en er zal niet opengedaan worden. Zie, Hij houdt de wateren tegen, en zij drogen uit; ook laat Hij ze los, en zij keren de aarde om. Bij Hem is kracht en wijsheid; van Hem is hij die dwaalt, en hij die doet dwalen.", "Ps 39:3": "Ik was verstomd door stilzwijgen, ik zweeg over het goede; maar mijn smart werd zwaarder.", "Ps 6:8": "Mijn oog is doorknaagd van verdriet, is verouderd, vanwege al mijn tegenstanders.", "Ps 36:7": "Uw gerechtigheid is als de bergen van God, Uw oordelen zijn een grote afgrond; HEERE! U behoudt mensen en beesten.", "Jer 2:5": "Zo zegt de HEERE: Wat voor onrecht hebben uw vaders aan Mij gevonden, dat zij ver van Mij zijn geweken, en de ijdelheid hebben nagewandeld, en zelf ijdel zijn geworden?", "Hand 20:33": "Ik heb niemands zilver, of goud, of kleding begeerd.", "Luk 1:49": "Want grote dingen heeft Hij, Die machtig is, aan mij gedaan, en heilig is Zijn Naam.", "Spr 25:14": "Een man die zichzelf beroemt op een valse gift, is als wolken en wind, waar geen regen bij is.", "Deut 16:14": "En u zult vrolijk zijn op uw feest, u, en uw zoon, en uw dochter, en uw dienstknecht, en uw dienstmaagd, en de Leviet, en de vreemdeling, en de wees, en de weduwe, die in uw poorten zijn.", "Job 5:18": "Want Hij doet smart aan, en Hij verbindt; Hij doorwondt, en Zijn handen helen.", "Ps 55:5-9": "Mijn hart doet mij pijn in mijn binnenste, en verschrikkingen van de dood zijn op mij gevallen. Vrees en beving komen over mij, en gruwen overdekt mij; Zodat ik zeg: Och, kreeg ik maar vleugels als een duif! ik zou wegvliegen, waar ik blijven mocht.", "1 Tess 3:1": "Daarom hebben wij, omdat we het verlangen niet langer konden verdragen, het goed gevonden om alleen in Athene achtergelaten te worden;", "Spr 17:3": "De smeltkroes is voor het zilver, en de oven voor het goud; maar de HEERE toetst de harten.", "Spr 3:12": "Want de HEERE kastijdt hem die Hij liefheeft, ja, zoals een vader de zoon in wie hij een welbehagen heeft.", "Ps 89:33": "dan zal Ik hun overtreding met de roede bezoeken, en hun ongerechtigheid met plagen.", "Ezech 22:7": "Vader en moeder hebben zij in u licht geacht; met de vreemdeling hebben zij in uw midden door verdrukking gehandeld; zij hebben in u de wees en de weduwe verdrukt.", "Jer 18:22": "Laat er een geschrei uit hun huizen gehoord worden, wanneer U snel een bende over hen brengt; omdat zij een kuil gegraven hebben om mij te vangen, en strikken verborgen hebben voor mijn voeten.", "Fil 2:1": "Als er dan enige vertroosting is in Christus, als er enige troost van de liefde is, als er enige gemeenschap van de Geest is, als er enige innerlijke bewegingen en ontfermingen zijn;", "Jak 3:2": "Want wij struikelen allen in veel dingen. Als iemand in woorden niet struikelt, die is een volmaakt man, in staat om ook het hele lichaam in toom te houden.", "Ps 143:4": "Daarom wordt mijn geest overstelpt in mij, mijn hart is verbaasd in het midden van mij.", "Micha 7:5": "Geloof een vriend niet, vertrouw niet op een boezemvriend; bewaar de deuren van uw mond voor haar die in uw schoot ligt.", "Ps 32:4": "Want Uw hand was dag en nacht zwaar op mij; mijn sap veranderde in zomerdroogte. Sela.", "Job 16:4": "Zou ik ook, net als u, kunnen spreken, als uw ziel in de plaats van mijn ziel was? Zou ik woorden tegen u kunnen samenhopen, en zou ik met mijn hoofd over u kunnen schudden?", "Ps 89:39-46": "Maar Gij hebt hem verstoten en verworpen; Gij bent verbolgen geworden tegen Uw gezalfde. Gij hebt het verbond van Uw knecht teniet gedaan; Gij hebt zijn kroon ontheiligd tegen de aarde. Gij hebt al zijn muren doorgebroken; Gij hebt zijn vestingen neergeworpen.", "Job 4:17-19": "Zou een mens rechtvaardiger zijn dan God? Zou een man reiner zijn dan zijn Maker? Zie, op Zijn knechten zou Hij niet vertrouwen; ook Zijn engelen heeft Hij van dwaasheid beschuldigd. Hoeveel te meer dan hen die in lemen huizen wonen, waarvan de grondslag in het stof is? Zij worden verbrijzeld voor de mot.", "2 Kron 7:12-22": "En de HEERE verscheen aan Salomo 's nachts, en Hij zei tegen hem: Ik heb uw gebed verhoord, en heb Mij deze plaats uitgekozen tot een offerhuis. Als Ik de hemel toesluit, zodat er geen regen is, of als Ik de sprinkhaan gebied het land te verteren, of als Ik pest onder Mijn volk zend; En Mijn volk, over wie Mijn Naam genoemd wordt, zich verootmoedigt en bidt, en zij Mijn aangezicht zoeken, en zich bekeren van hun slechte wegen; dan zal Ik uit de hemel horen, en hun zonden vergeven, en hun land genezen.", "Jes 45:7": "Ik vorm het licht, en schep de duisternis; Ik maak de vrede en schep het kwaad, Ik, de HEERE, doe al deze dingen.", "Job 14:1": "De mens, uit een vrouw geboren, leeft maar kort en is vol onrust.", "Luk 18:9-14": "En Hij vertelde ook aan sommigen, die op zichzelf vertrouwden dat zij rechtvaardig waren en de anderen niets waard achtten, deze gelijkenis: Twee mensen gingen op naar de tempel om te bidden; de een was een Farizeeër en de ander een tollenaar. De Farizeeër stond en bad dit bij zichzelf: O God, ik dank U dat ik niet ben zoals de andere mensen: rovers, onrechtvaardigen, overspelers; of ook zoals deze tollenaar.", "Job 15:15": "Zie, op Zijn heiligen zou Hij niet vertrouwen, en de hemelen zijn niet zuiver in Zijn ogen.", "Deut 8:5": "Erken dan in uw hart, dat de HEERE, uw God, u opvoedt, zoals een man zijn zoon opvoedt.", "Spr 27:17": "IJzer scherpt men met ijzer; zo scherpt een man het gezicht van zijn naaste.", "Job 23:2": "Ook vandaag is mijn klacht bitter; mijn plaag is zwaarder dan mijn zuchten.", "Deut 27:19": "Vervloekt is hij die het recht van de vreemdeling, van de wees en van de weduwe buigt! En heel het volk zal zeggen: Amen.", "Matt 26:56": "maar dit alles is gebeurd, opdat de Schriften van de profeten vervuld zouden worden. Toen vluchtten alle discipelen en lieten Hem in de steek.", "Hand 5:21": "Toen zij dit gehoord hadden, gingen zij tegen de vroege morgen de tempel in, en leerden. Maar de hogepriester kwam, en die met hem waren, en riepen de raad samen, en alle oudsten van de kinderen van Israël, en zonden naar de kerker om hen te halen.", "2 Petr 1:12": "Daarom zal ik niet nalaten u er altijd aan te herinneren, hoewel u het weet en versterkt bent in de waarheid die u nu hebt.", "Mark 10:17-22": "En toen Hij de weg opging, kwam er iemand aanlopen, en viel voor Hem op de knieën, en vroeg Hem: Goede Meester, wat moet ik doen om het eeuwige leven te beërven? En Jezus zei tegen hem: Waarom noemt u Mij goed? Niemand is goed, dan Eén, namelijk God. U kent de geboden: U zult geen overspel plegen; u zult niet doden; u zult niet stelen; u zult geen vals getuigenis geven; u zult niemand tekortdoen; eer uw vader en uw moeder.", "1 Sam 2:7": "De HEERE maakt arm en maakt rijk; Hij vernedert, ook verhoogt Hij.", "Job 37:20": "Zal het Hem verteld worden, als ik zo zou spreken? Denkt iemand dat, zeker, hij zal verslonden worden.", "Job 37:19": "Onderricht ons, wat wij Hem zeggen zullen; want wij zullen niets ordentelijk kunnen voorstellen vanwege de duisternis.", "Judas 1:12": "Deze mensen zijn vlekken in uw liefdemaaltijden, en als zij met u aan de maaltijd zijn, weiden zij zichzelf zonder vrees; zij zijn wolken zonder water, die door de winden rondgedreven worden; zij zijn als bomen aan het einde van de herfst, zonder vrucht, tweemaal gestorven, en ontworteld;", "Gal 6:4": "Maar ieder moet zijn eigen werk beproeven; en dan zal hij aan zichzelf alleen roem hebben, en niet aan een ander.", "Ps 19:13": "Wie zou de afdwalingen verstaan? Reinig mij van de verborgen afdwalingen.", "Ps 119:81": "Caph. Mijn ziel is bezweken van verlangen naar Uw heil; op Uw woord heb ik gehoopt.", "Job 39:38": "Eenmaal heb ik gesproken, maar zal niet antwoorden; of tweemaal, maar zal niet voortvaren.", "Job 36:23": "Wie heeft Hem gesteld over Zijn weg? Of wie heeft gezegd: U hebt onrecht gedaan?", "Ps 115:1": "Niet ons, o HEERE, niet ons, maar geef aan Uw Naam eer, om Uw goedertierenheid, om Uw waarheid.", "2 Petr 1:15": "Maar ik zal er ook mijn best voor doen, dat u bij elke gelegenheid, na mijn heengaan, hieraan kunt terugdenken.", "Zach 13:9": "En Ik zal dat derde deel in het vuur brengen, en Ik zal het louteren, zoals men zilver loutert, en Ik zal het beproeven, zoals men goud beproeft; het zal Mijn Naam aanroepen, en Ik zal het verhoren; Ik zal zeggen: Het is Mijn volk; en het zal zeggen: De HEERE is mijn God.", "Fil 2:30": "Want om het werk van Christus is hij dicht bij de dood gekomen, terwijl hij zijn leven niet ontzag, opdat hij het gebrek van uw bediening aan mij zou aanvullen.", "Spr 25:27": "Veel honig eten is niet goed; maar het onderzoeken van de eigen eer is geen eer.", "Gen 22:17": "Voorzeker zal Ik u rijk zegenen, en uw nageslacht zeer talrijk maken, als de sterren van de hemel, en als het zand dat aan de oever van de zee is; en uw nageslacht zal de poort van zijn vijanden erfelijk bezitten.", "Job 22:9": "De weduwen hebt u met lege handen weggezonden, en de armen van de wezen zijn verbrijzeld.", "Job 38:29": "Uit wiens buik komt het ijs voort, en wie baart de rijm van de hemel?", "Ezech 9:4": "En de HEERE zei tot hem: Ga door, door het midden van de stad, door het midden van Jeruzalem, en zet een teken op de voorhoofden van de mensen die zuchten en uitroepen over al die gruwelen die in haar midden gedaan worden.", "Rom 1:23": "en hebben de heerlijkheid van de onvergankelijke God veranderd in de gelijkenis van het beeld van een vergankelijk mens, en van vogels, en van viervoetige en kruipende dieren.", "Openb 18:17": "En alle stuurlieden, en al het volk op de schepen, en scheepslui, en allen die op zee handel drijven, stonden van verre;", "Micha 7:6": "Want de zoon veracht de vader, de dochter staat op tegen haar moeder, de schoondochter tegen haar schoonmoeder; iemands vijanden zijn zijn huisgenoten.", "Spr 15:15": "Al de dagen van de bedrukte zijn kwaad; maar een vrolijk hart is een voortdurende maaltijd.", "2 Kor 4:16": "Daarom worden wij niet moedeloos; maar hoewel onze uitwendige mens verdorven wordt, wordt toch de inwendige vernieuwd van dag tot dag.", "Joh 17:11": "En Ik ben niet meer in de wereld, maar dezen zijn in de wereld, en Ik kom tot U, Heilige Vader, bewaar hen in Uw Naam, die U Mij gegeven hebt, opdat zij één zijn, zoals Wij.", "Mark 14:33": "En Hij nam Petrus, en Jakobus, en Johannes met Zich mee, en begon zeer ontsteld en angstig te worden;", "Ex 4:11": "En de HEERE zei tegen hem: Wie heeft de mens de mond gemaakt, of wie maakt de stomme, of dove, of ziende, of blinde? Ben Ik het niet, de HEERE?", "Micha 3:8": "Maar waarlijk, ik ben vol van de kracht van de Geest van de HEERE; en vol van gericht en dapperheid, om Jakob zijn overtreding te verkondigen, en Israël zijn zonde.", "Jes 47:7": "En u zei: Ik zal koningin zijn in eeuwigheid; tot nog toe hebt u deze dingen niet in uw hart genomen, u hebt aan het einde daarvan niet gedacht.", "Jona 4:8": "En het gebeurde, toen de zon opkwam, dat God een hete oostenwind liet waaien; en de zon stak op het hoofd van Jona, zodat hij bijna bezweek; en hij wenste dat hij mocht sterven, en zei: Het is beter voor mij te sterven dan te leven.", "Spr 18:14": "De geest van een man zal zijn ziekte dragen; maar een verslagen geest, wie zal die opheffen?", "Gen 3:16": "Tegen de vrouw zei Hij: Ik zal uw smart zeer vermeerderen, namelijk de smart van uw zwangerschap; met smart zult u kinderen baren; en naar uw man zal uw begeerte uitgaan, en hij zal over u heersen.", "Hebr 12:7": "Als u de kastijding verdraagt, gedraagt God Zich tegenover u als tegenover zonen; want welke zoon is er, die de vader niet kastijdt?", "Job 13:3": "Maar ik wil tot de Almachtige spreken, en ik ben erop belust mij te verdedigen voor God.", "Spr 13:12": "De uitgestelde hoop maakt het hart ziek; maar de begeerte die komt, is een boom des levens.", "Jes 41:14": "Vrees niet, wormpje Jakob, volkje Israël! Ik help u, spreekt de HEERE, en uw Verlosser is de Heilige van Israël!", "Spr 23:11": "Want hun Verlosser is sterk; Die zal hun rechtszaak tegen u voeren.", "Spr 14:12": "Er is een weg die iemand recht schijnt; maar het einde ervan is de weg van de dood.", "Ps 104:14": "Hij doet het gras uitspruiten voor de dieren, en het gewas tot dienst van de mens, zodat brood uit de aarde voortkomt.", "Ps 42:7": "O mijn God! Mijn ziel buigt zich neer in mij, daarom denk ik aan U vanuit het land van de Jordaan en de Hermon, vanuit het kleine gebergte.", "Ps 62:10": "Zeker, de gewone mensen zijn nietigheid, de aanzienlijke mensen zijn leugen; in de weegschaal gewogen, zouden zij samen lichter zijn dan de nietigheid.", "Hebr 6:5": "en het goede woord van God geproefd hebben, en de krachten van de toekomende eeuw,", "1 Kor 12:26": "En hetzij dat één lid lijdt, alle leden lijden mee; hetzij dat één lid geëerd wordt, alle leden verblijden zich mee.", "Spr 26:12": "Hebt u een man gezien die wijs is in zijn eigen ogen? Van een dwaas is meer te verwachten dan van hem.", "Joh 16:33": "Deze dingen heb Ik tot u gesproken, opdat u in Mij vrede hebt. In de wereld zult u verdrukking hebben, maar heb goede moed, Ik heb de wereld overwonnen.", "Job 33:8": "Zeker, u hebt gezegd voor mijn oren, en ik heb de stem der woorden gehoord;", "Hand 11:26": "en toen hij hem gevonden had, bracht hij hem naar Antiochië. En het gebeurde dat zij een heel jaar samenkwamen in de gemeente en een grote menigte onderwezen; en dat de discipelen voor het eerst in Antiochië Christenen genoemd werden.", "Job 13:2": "Zoals u het weet, weet ik het ook; ik zwicht niet voor u.", "Jer 20:9": "Daarom zei ik: Ik zal Hem niet meer noemen, en niet meer in Zijn Naam spreken; maar het werd in mijn hart als een brandend vuur, opgesloten in mijn beenderen; en ik werd moe van het verdragen, maar ik kon het niet.", "Jona 4:3": "Nu dan, HEERE, neem toch mijn leven van mij weg; want het is beter voor mij te sterven dan te leven.", "Job 10:1": "Mijn ziel is de dood moe, wat mijn leven betreft; ik zal mijn klacht over mijzelf de vrije loop laten; ik zal spreken in de bitterheid van mijn ziel.", "Jer 17:5": "Zo zegt de HEERE: Vervloekt is de man die op een mens vertrouwt, en vlees tot zijn arm stelt, en wiens hart van de HEERE afwijkt!", "Num 11:29": "Maar Mozes zei tegen hem: Bent u ijverzuchtig voor mij? Och, was al het volk van de HEERE maar profeten, zodat de HEERE Zijn Geest over hen zou geven!", "Hand 18:24-28": "En een zekere Jood, met de naam Apollos, van geboorte een Alexandriër, een welsprekend man, kwam naar Efeze, machtig zoals hij was in de Schriften. Deze was onderwezen in de weg van de Heere; en omdat hij vurig was van geest, sprak en leerde hij nauwkeurig de zaken van de Heere, al kende hij alleen de doop van Johannes. En hij begon vrijmoedig te spreken in de synagoge. En toen Aquila en Priscilla hem gehoord hadden, namen zij hem tot zich, en legden hem de weg van God nauwkeuriger uit.", "Ps 38:4": "Er is niets heels in mijn vlees, vanwege Uw gramschap; er is geen vrede in mijn beenderen, vanwege mijn zonde.", "2 Kor 12:20": "Want ik vrees dat ik, als ik gekomen zal zijn, u niet zal vinden zoals ik wil, en dat ik door u gevonden zal worden zoals u niet wilt; dat er niet op enigerlei wijze twisten, jaloezie, toorn, ruzie, kwaadsprekerij, gefluister, opgeblazenheid, wanordelijkheden zijn;", "Judas 1:1": "Judas, een dienstknecht van Jezus Christus, en broeder van Jakobus, aan de geroepenen, die door God de Vader geheiligd zijn, en door Jezus Christus bewaard:", "Luk 16:15": "En Hij zei tegen hen: U bent het die uzelf rechtvaardigt voor de mensen; maar God kent uw harten; want wat hoog is onder de mensen, is een gruwel voor God.", "Ps 88:19": "U hebt vriend en metgezel ver van mij weggedaan; mijn bekenden zijn in duisternis.", "Hebr 1:8": "Maar tot de Zoon zegt Hij: Uw troon, o God, is er in alle eeuwigheid; de scepter van Uw koninkrijk is een rechte scepter.", "Ps 99:9": "Verhef de HEERE, onze God, en buig u voor de berg van Zijn heiligheid; want de HEERE, onze God, is heilig.", "Job 14:22": "Maar zijn vlees, dat nog aan hem is, heeft smart; en zijn ziel, die nog in hem is, heeft rouw.", "Openb 15:4": "Wie zou U niet vrezen, Heere, en Uw Naam niet verheerlijken? Want Gij alleen zijt heilig; want alle volken zullen komen, en voor U aanbidden; want Uw oordelen zijn openbaar geworden.", "Ps 31:10-14": "Wees mij genadig, HEERE! Want ik heb het benauwd; van verdriet is mijn oog doorknaagd, mijn ziel en mijn buik. Want mijn leven is verteerd van droefenis, en mijn jaren van zuchten; mijn kracht is vervallen door mijn ongerechtigheid, en mijn beenderen zijn doorknaagd. Vanwege al mijn wederpartijders ben ik, ook voor mijn buren, zeer tot een smaad geworden, en voor mijn bekenden tot een schrik; die mij op de straten zien, vluchten van mij weg.", "Deut 24:17-22": "U zult het recht van de vreemdeling en van de wees niet buigen, en u zult het kleed van de weduwe niet te pand nemen. Maar u zult gedenken dat u een knecht in Egypte geweest bent, en de HEERE, uw God, heeft u van daar verlost; daarom gebied ik u deze zaak te doen. Wanneer u uw oogst op uw akker afgeoogst hebt, en een garf op de akker vergeten bent, zult u niet terugkeren om die op te halen; voor de vreemdeling, voor de wees en voor de weduwe zal die zijn; opdat de HEERE, uw God, u zegent in al het werk van uw handen.", "Klaagl 1:5": "He. Haar tegenstanders zijn tot hoofd geworden, haar vijanden hebben rust; omdat de HEERE haar bedroefd heeft, vanwege de veelheid van haar overtredingen; haar kinderen gaan heen in de gevangenschap voor het aangezicht van de tegenstander.", "Jes 65:3-5": "Een volk dat Mij voortdurend tergt in Mijn aangezicht, terwijl het in de hoven offert en op tichelstenen wierook brandt; Zittend bij de graven, zo overnachten zij bij de bewaarde plaatsen, etend zwijnenvlees, en er is sap van gruwelijke dingen in hun vaten. Die daar zeggen: Houd u tot uzelf, en kom niet bij mij, want ik ben heiliger dan u. Deze zijn een rook in Mijn neus, een vuur, dat de hele dag brandt.", "Mark 8:15": "En Hij gebood hun: Kijk uit, wees op uw hoede voor het zuurdeeg van de Farizeeën, en voor het zuurdeeg van Herodes.", "Gal 6:3": "Want als iemand denkt iets te zijn, terwijl hij niets is, bedriegt hij zichzelf in zijn gemoed.", "Deut 9:18": "En ik wierp mij neer voor het aangezicht van de HEERE, zoals de eerste keer, veertig dagen en veertig nachten; ik at geen brood, en dronk geen water; om al uw zonde, die u had gezondigd door te doen wat kwaad is in de ogen van de HEERE, om Hem tot toorn te verwekken.", "Ps 45:6": "Uw pijlen zijn scherp; volken zullen onder U vallen; zij treffen in het hart van de vijanden van de Koning.", "Ps 58:8": "Laat hen wegsmelten als water, laat hen wegstromen; als hij zijn pijlen aanlegt, laat hen zijn alsof zij afgesneden waren.", "2 Kron 6:33": "Hoor U dan uit de hemel, uit de vaste plaats van Uw woning, en doe naar alles waarom die vreemdeling tot U roepen zal; opdat alle volken der aarde Uw Naam kennen, om U te vrezen, zoals Uw volk Israël, en om te weten dat Uw Naam genoemd wordt over dit huis, dat ik gebouwd heb.", "Hand 8:40": "Maar Filippus werd gevonden te Azote; en terwijl hij het land doortrok, verkondigde hij het Evangelie in alle steden, totdat hij in Cesarea kwam.", "Klaagl 1:12": "Lamed. Gaat het u niet aan, u allen, die over de weg gaat? Schouwt het aan en ziet, of er een smart is gelijk mijn smart, die mij aangedaan is, waarmee de HEERE mij bedroefd heeft ten dage van de gloed van Zijn toorn.", "Ps 102:24": "Hij heeft mijn kracht op de weg neergedrukt; mijn dagen heeft Hij verkort.", "Spr 27:14": "Wie zijn vriend zegent met luide stem, terwijl hij zich 's morgens vroeg opmaakt, het zal hem tot een vloek gerekend worden.", "Job 25:5": "Zie, zelfs de maan geeft geen schijnsel, en de sterren zijn niet zuiver in Zijn ogen.", "Jer 2:13": "Want Mijn volk heeft twee boosheden gedaan; Mij, de Springader van het levende water, hebben zij verlaten, om zichzelf bakken uit te houwen, gebroken bakken, die geen water houden.", "Klaagl 3:12": "Daleth. Hij heeft Zijn boog gespannen, en Hij heeft mij als doel voor de pijl gesteld.", "1 Petr 3:8": "En tenslotte, wees allen eensgezind, meelevend, heb de broeders lief, wees met innerlijke barmhartigheid bewogen, vriendelijk;", "Jak 1:27": "De zuivere en onbevlekte godsdienst voor God en de Vader is deze: wezen en weduwen bezoeken in hun verdrukking, en zichzelf onbesmet bewaren van de wereld.", "Hebr 5:14": "Maar voor de volwassenen is er het vaste voedsel, voor hen die door de gewoonte hun zintuigen geoefend hebben, om onderscheid te maken tussen goed en kwaad.", "Job 27:2": "Zo waarachtig als God leeft, Die mijn recht weggenomen heeft, en de Almachtige, Die mijn ziel bitterheid heeft aangedaan!", "Jes 30:12": "Daarom, zo zegt de Heilige van Israël: Omdat u dit woord verwerpt, en vertrouwt op onderdrukking en verkeerdheid, en daarop steunt:", "Spr 25:12": "Een wijze bestraffer bij een luisterend oor, is een gouden oorsieraad, en een halssieraad van het fijnste goud.", "Job 24:25": "Als het nu niet zo is, wie zal mij dan leugenachtig maken, en mijn woorden tot niets maken?", "Dan 3:18": "Maar als dat niet zo is, laat het u bekend zijn, o koning, dat wij uw goden niet zullen eren, en ook het gouden beeld, dat u hebt opgericht, niet zullen aanbidden.", "Job 31:21": "Als ik mijn hand tegen de wees bewogen heb, omdat ik in de poort mijn hulp zag;", "Mark 6:6": "En Hij verwonderde Zich over hun ongeloof, en trok rond door de dorpen daar in de omgeving, terwijl Hij onderwees.", "2 Kor 1:12": "Want onze roem is dit: de getuigenis van ons geweten, dat wij in eenvoud en oprechtheid van God, niet in vleselijke wijsheid, maar in de genade van God, in de wereld verkeerd hebben, en allermeest bij u.", "Lev 11:44": "Want Ik ben de HEERE, uw God; daarom zult u uzelf heiligen, en heilig zijn, omdat Ik heilig ben; en u zult uw ziel niet verontreinigen aan enig kruipend gedierte dat zich op de aarde beweegt.", "Job 32:11": "Zie, ik heb gewacht op uw woorden; ik heb het oor gewend tot uw overwegingen, totdat u redenen had uitgezocht.", "Hand 8:4": "Zij dan nu, die verstrooid waren, trokken het land door en verkondigden het Woord.", "Jes 48:10": "Zie, Ik heb u gelouterd, doch niet als zilver, Ik heb u gekeurd in de smeltkroes van de ellende.", "Rom 15:18-21": "Want ik zou niet durven iets zeggen dat Christus niet door mij gewerkt heeft, tot gehoorzaamheid van de heidenen, met woorden en werken; door kracht van tekenen en wonderen, en door de kracht van de Geest van God, zodat ik, van Jeruzalem af en rondom, tot Illyricum toe, het Evangelie van Christus vervuld heb. En zo zeer begerig geweest ben om het Evangelie te verkondigen, niet waar Christus genoemd was, opdat ik niet op eens anders fundament zou bouwen;", "1 Kon 17:1": "En Elia, de Thisbiet, van de inwoners van Gilead, zei tegen Achab: Zo waarachtig als de HEERE, de God van Israël, leeft, voor Wiens aangezicht ik sta, indien deze jaren dauw of regen zijn zal, tenzij dan naar mijn woord!", "Ps 119:13": "Ik heb met mijn lippen verteld al de rechten van Uw mond.", "Luk 19:42": "en zei: Och, had u ook maar geweten, ook nog op deze dag van u, wat tot uw vrede dient! Maar nu is het verborgen voor uw ogen.", "Ps 35:14": "Ik ging steeds als een vriend, als was hij mij een broeder geweest; ik ging gebukt in het zwart, als iemand die over zijn moeder treurt.", "Klaagl 3:38": "Mem. Gaat niet uit de mond van de Allerhoogste het kwade en het goede?", "Spr 9:9": "Leer de wijze, dan zal hij nog wijzer worden; onderwijs de rechtvaardige, dan zal hij toenemen in kennis.", "Job 13:5": "Och, wilde u toch helemaal zwijgen! Dat zou voor u wijsheid wezen.", "Ps 107:2": "Laat dat de bevrijden van de HEERE zeggen, die Hij uit de hand van de tegenstander bevrijd heeft.", "Hand 4:33": "En de apostelen gaven met grote kracht getuigenis van de opstanding van de Heere Jezus; en er was grote genade over hen allen.", "Ps 66:11": "U had ons in het net gebracht; U had een engs band om onze lenden gelegd;", "Ps 102:4-12": "Want mijn dagen zijn vergaan als rook, en mijn beenderen zijn uitgebrand als een haard. Mijn hart is geslagen en verdord als gras, zodat ik vergeten heb mijn brood te eten. Mijn beenderen kleven aan mijn vlees, vanwege de stem van het zuchten.", "1 Tess 3:2": "en wij hebben Timotheüs gezonden, onze broeder en Gods dienaar en onze medearbeider in het Evangelie van Christus, om u te versterken en u te vermanen aangaande uw geloof;", "Spr 22:24-27": "Ga geen vriendschap aan met een driftig man, en ga niet om met een zeer grimmig man; opdat u zijn paden niet leert, en een strik over uw ziel haalt. Wees niet onder hen die in de hand klappen, onder hen die borg staan voor schulden.", "Luk 14:34": "Het zout is goed; maar als het zout smakeloos geworden is, waarmee zal het smakelijk gemaakt worden?", "Jes 5:16": "Doch de HEERE van de heerscharen zal verhoogd worden door het recht; en God, die Heilige, zal geheiligd worden door gerechtigheid.", "Luk 23:40": "Maar de ander antwoordde en bestrafte hem: Vreest u ook God niet, terwijl u in hetzelfde oordeel bent?", "Job 42:3": "Wie is hij, zegt U, die de raad verbergt zonder wetenschap? Zo heb ik dan verteld, wat ik niet begreep, dingen, die voor mij te wonderbaar waren, die ik niet wist.", "Job 10:8": "Uw handen doen mij pijn aan, hoewel zij mij gemaakt hebben, samen rondom mij zijn zij, en U verslindt mij.", "Kol 4:7-11": "Al mijn zaken zal Tychikus u bekendmaken, de geliefde broeder, en trouwe dienaar, en mededienstknecht in de Heere; hem heb ik met dit doel naar u toe gestuurd, opdat hij weet hoe het met u gaat, en uw harten troost; samen met Onesimus, de trouwe en geliefde broeder, die één van u is; zij zullen u alles bekendmaken wat hier gebeurt.", "Matt 11:28": "Komt hier naar Mij toe, allen die vermoeid en belast zijn, en Ik zal u rust geven.", "Hos 11:9": "Ik zal de gloed van Mijn toorn niet uitvoeren; Ik zal niet terugkeren om Efraïm te verderven; want Ik ben God en geen mens, de Heilige in uw midden, en Ik zal niet in de stad komen.", "Spr 12:15": "De weg van de dwaas is recht in zijn eigen ogen; maar wie naar raad hoort, is wijs.", "Job 4:5": "maar nu komt het aan bij u, en u bent verdrietig; het raakt tot u, en u wordt beroerd.", "Deut 13:6-9": "Wanneer uw broer, de zoon van uw moeder, of uw zoon, of uw dochter, of de vrouw van uw schoot, of uw vriend, die als uw eigen ziel is, u heimelijk zal aanporren, en zegt: Laat ons gaan, en andere goden dienen, die u niet gekend hebt, u noch uw vaders; van de goden van de volken die rondom u zijn, dichtbij u, of ver van u, van het ene einde van de aarde tot aan het andere einde van de aarde; dan zult u hem niet ter wille zijn, en niet naar hem horen; ook zal uw oog hem niet ontzien, en u zult zich niet ontfermen, hem ook niet verbergen;", "Jona 2:3": "Want U had mij geworpen in de diepte, in het hart van de zeeën, en de stroom omving mij; al Uw baren en Uw golven gingen over mij heen.", "Matt 22:13": "Toen zei de koning tegen de dienaars: Bind zijn handen en voeten, neem hem mee en werp hem in de buitenste duisternis; daar zal het huilen zijn en het geknars van de tanden.", "2 Kor 11:29": "Wie is er zwak, dat ik niet zwak ben? Wie wordt er in de val gebracht, dat ik niet brand?", "Gen 3:17": "En tegen Adam zei Hij: Omdat u geluisterd hebt naar de stem van uw vrouw, en van die boom hebt gegeten waarvan Ik u geboden had: Daarvan zult u niet eten; is het aardrijk vervloekt om u; en met smart zult u daarvan eten, alle dagen van uw leven.", "Rom 8:32": "Hij Die zelfs Zijn eigen Zoon niet gespaard heeft, maar Hem voor ons allen overgegeven heeft, hoe zal Hij ons ook met Hem niet alle dingen schenken?", "Ps 48:2": "De HEERE is groot en zeer te prijzen, in de stad van onze God, op de berg van Zijn heiligheid.", "Ps 99:5": "Verhef de HEERE, onze God, en buig u neer voor de voetbank van Zijn voeten; Hij is heilig!", "Job 19:28": "Voorwaar, u zou zeggen: Waarom vervolgen wij hem? Nu de wortel van de zaak in mij gevonden wordt.", "Job 22:2": "Zal een man God voordelig zijn? Maar voor zichzelf zal de verstandige voordelig zijn.", "Jes 57:15": "Want zo zegt de Hoge en Verhevene, Die in de eeuwigheid woont, en Wiens Naam heilig is: Ik woon in de hoogte en in het heilige, en bij hem die een verbrijzelde en nederige geest heeft, om de geest van de nederigen levend te maken, en om het hart van de verbrijzelden levend te maken.", "1 Kon 8:42": "(want zij zullen horen van Uw grote Naam, en van Uw sterke hand, en van Uw uitgestrekte arm) wanneer hij komen en bidden zal in dit huis;", "Ps 73:10": "Daarom keert Zijn volk zich hierheen, als hun water uit een volle beker wordt uitgedrukt,", "Ps 111:9": "Pe. Hij heeft Zijn volk verlossing gezonden; Tsade. Hij heeft Zijn verbond in eeuwigheid geboden; Koph. Zijn Naam is heilig en ontzagwekkend.", "Hand 4:18-20": "En zij riepen hen en zeiden hun aan, dat zij helemaal niet meer zouden spreken, noch leren, in de Naam van Jezus. Maar Petrus en Johannes antwoordden hun: Oordeelt u zelf, of het recht is voor God, meer naar u te luisteren dan naar God. Want wij kunnen niet nalaten te spreken over wat wij gezien en gehoord hebben.", "Ps 33:5": "Hij heeft gerechtigheid en recht lief; de aarde is vol van de goedertierenheid van de HEERE.", "Job 35:7": "Als u rechtvaardig bent, wat geeft u Hem, of wat ontvangt Hij uit uw hand?", "Gen 10:7": "En de zonen van Cusch zijn: Seba en Havila, en Sabta, en Raema, en Sabtecha. En de zonen van Raema zijn: Scheba en Dedan.", "1 Petr 5:9": "Weersta hem, vast staand in het geloof, in de wetenschap dat hetzelfde lijden wordt volbracht aan uw broederschap die in de wereld is.", "Jes 59:17": "Want Hij trok gerechtigheid aan als een pantser, en de helm van het heil zette Hij op Zijn hoofd, en de kleren van de wraak trok Hij aan als kleding, en Hij deed de ijver aan als een mantel.", "Hab 2:4": "Zie, wie zich verheft, zijn ziel is niet oprecht in hem; maar de rechtvaardige zal door zijn geloof leven.", "Job 19:21": "Ontferm u over mij, ontferm u over mij, o mijn vrienden! want de hand van God heeft mij aangeraakt.", "Rom 11:19-21": "U zult dan zeggen: De takken zijn afgebroken, opdat ik ingeënt zou worden. Het is wel; zij zijn door ongeloof afgebroken, en u staat door het geloof. Wees niet hoogmoedig, maar vrees. Want als God de natuurlijke takken niet gespaard heeft, zie toe, dat Hij ook mogelijk u niet spaart.", "Lev 25:48": "Nadat hij zich verkocht zal hebben, zal er lossing voor hem gelden; een van zijn broeders zal hem lossen;", "Rom 10:3": "Want omdat zij de rechtvaardigheid van God niet kennen en hun eigen gerechtigheid proberen op te richten, hebben zij zich aan de rechtvaardigheid van God niet onderworpen.", "Ps 55:13-15": "Want het is geen vijand die mij hoont, anders zou ik het hebben gedragen; het is mijn hater niet die zich tegen mij groot maakt, anders zou ik mij voor hem verborgen hebben. Maar u bent het, o mens, als van mijn eigen stand, mijn leidsman en mijn bekende! Wij die samen in zoetheid heimelijk raadpleegden; wij wandelden in gezelschap naar het huis van God.", "Job 11:4-6": "Want u hebt gezegd: Mijn leer is zuiver, en ik ben rein in uw ogen. Maar zeker, och, of God sprak, en Zijn lippen tegen u opende; En u bekend maakte de verborgenheden van de wijsheid, omdat zij dubbel zijn in wezen! Weet daarom, dat God voor u minder rekent van uw ongerechtigheid dan die verdient.", "Spr 28:4": "Wie de wet verlaten, prijzen de goddelozen; maar wie de wet bewaren, gaan de strijd met hen aan.", "Jer 51:9": "Wij hebben Babel gemeesterd, maar zij is niet genezen; verlaat haar dan, en laat ons ieder naar zijn land trekken; want haar oordeel reikt tot aan de hemel, en is verheven tot aan de bovenste wolken.", "Job 30:15": "Men heeft zich met verschrikkingen tegen mij gekeerd; ieder vervolgt als een wind mijn edele ziel, en mijn heil is als een wolk voorbijgegaan.", "Ps 103:14-16": "Want Hij weet wat voor maaksel wij zijn, en Hij denkt eraan dat wij stof zijn. De dagen van de mens zijn als het gras, zoals een bloem van het veld, zo bloeit hij. Als de wind daarover gegaan is, is hij er niet meer, en zijn plaats kent hem niet meer.", "Hebr 12:10": "Want zij hebben ons wel voor een korte tijd gekastijd, zoals het hun goeddacht; maar Hij kastijdt ons tot ons nut, opdat wij Zijn heiligheid deelachtig zouden worden.", "Lev 21:8": "Daarom zult u hem heiligen, omdat hij het voedsel van uw God offert; hij zal u heilig zijn, want Ik ben heilig; Ik ben de HEERE, die u heiligt!", "Ezech 27:22": "De kooplieden van Scheba en Raëma waren uw kooplieden; met alle hoofdspecerij, en met alle kostbaar gesteente en goud, handelden zij op uw markten.", "Ps 57:7": "Zij hebben een net klaargezet voor mijn voeten, mijn ziel was neergebukt; zij hebben een kuil voor mij gegraven; zij zijn er zelf middenin gevallen. Sela.", "Job 16:12-14": "Ik had rust, maar Hij heeft mij verbroken, en mij bij mijn nek gegrepen, en mij verpletterd; en Hij heeft mij Zich tot een doelwit opgericht. Zijn schutters hebben mij omringd; Hij heeft mijn nieren doorkliefd, en niet gespaard; Hij heeft mijn gal op de aarde uitgegoten. Hij heeft mij gebroken met breuk op breuk; Hij is tegen mij aangelopen als een geweldige.", "Jer 25:23": "Dedan, en Tema, en Buz, en allen, die aan de hoeken kortgeschoren zijn;", "Ps 88:7": "U hebt mij in de onderste kuil gelegd, in duisternissen, in diepten.", "Jer 9:5": "En zij bedriegen, ieder zijn vriend, en spreken de waarheid niet; zij leren hun tong leugen spreken, zij maken zich moe met verkeerd te handelen.", "Ps 77:3-5": "Ten dage van mijn benauwdheid zocht ik de Heere; mijn hand was 's nachts uitgestrekt, en liet niet af; mijn ziel weigerde getroost te worden. Dacht ik aan God, dan maakte ik misbaar; peinsde ik, dan werd mijn ziel overstelpt. Sela. U hield mijn ogen wakend; ik was verslagen, en sprak niet.", "Openb 6:10": "En zij riepen met grote stem, en zeiden: Hoelang, o heilige en waarachtige Heerser, oordeelt en wreekt U ons bloed niet van hen, die op de aarde wonen?", "Job 12:5": "Hij is een verachte fakkel, naar de mening van hem die gerust is; hij is gereed om met de voet te struikelen.", "Mal 3:5": "En Ik zal tot u naderen ten oordeel; en Ik zal een snel Getuige zijn tegen de tovenaars, en tegen de overspelers, en tegen hen die vals zweren, en tegen hen die het loon van de dagloner met geweld inhouden, die de weduwe, en de wees, en de vreemdeling het recht verdraaien, en Mij niet vrezen, zegt de HEERE van de heerscharen.", "Ps 38:12": "Mijn liefhebbers en mijn vrienden blijven staan tegenover mijn plaag, en mijn naaste familie blijft ver weg staan.", "Ps 94:6": "De weduwe en de vreemdeling doden zij, en zij vermoorden de wezen.", "Ps 145:17": "Tsade. De HEERE is rechtvaardig in al Zijn wegen, en goedertieren in al Zijn werken.", "Job 9:17": "Want Hij vermorzelt mij door een onweer, en vermenigvuldigt mijn wonden zonder oorzaak.", "Mark 14:34": "en Hij zei tegen hen: Mijn ziel is zeer bedroefd, tot de dood toe; blijf hier, en waak.", "Job 33:19-22": "Ook wordt hij gestraft met smart op zijn leger, en de sterke menigte van zijn beenderen; Zodat zijn leven het brood zelf verfoeit, en zijn ziel het begeerlijke voedsel; Dat zijn vlees verdwijnt uit het gezicht, en zijn beenderen, die niet gezien werden, uitsteken;", "Hand 8:25": "Zij dan nu, toen zij het Woord van de Heere betuigd en gesproken hadden, keerden terug naar Jeruzalem, en verkondigden het Evangelie in veel dorpen van de Samaritanen.", "Job 3:1-26": "Daarna opende Job zijn mond, en vervloekte zijn dag. Want Job antwoordde en zei: De dag verga, waarop ik geboren ben, en de nacht waarin men zei: Een knechtje is ontvangen.", "Job 36:8-12": "En als zij, gebonden met boeien, vastgehouden worden met banden van ellende; Dan maakt Hij hun hun daden bekend, en hun overtredingen, omdat zij de overhand genomen hebben; En Hij opent hun oor voor de tucht, en zegt dat zij zich van de ongerechtigheid moeten bekeren.", "Jes 29:23": "want wanneer hij zijn kinderen, het werk van Mijn handen, zal zien in zijn midden, zullen zij Mijn Naam heiligen; en zij zullen de Heilige van Jakob heiligen, en de God van Israël vrezen.", "Jes 6:3": "En de een riep tot de ander en zei: Heilig, heilig, heilig is de HEERE van de heerscharen! De hele aarde is vol van Zijn heerlijkheid!", "Job 19:13-22": "Mijn broeders heeft Hij ver van mij gedaan; en die mij kennen, zeker, zij zijn van mij vervreemd. Mijn nabestaanden houden op, en mijn bekenden vergeten mij. Mijn huisgenoten en mijn dienstmaagden achten mij als een vreemde; een buitenlander ben ik in hun ogen.", "Ps 40:11": "Uw gerechtigheid bedek ik niet in het midden van mijn hart; Uw waarheid en Uw heil spreek ik uit; Uw weldadigheid en Uw trouw verheel ik niet in de grote gemeente.", "1 Sam 2:9": "Hij zal de voeten van Zijn gunstgenoten bewaren; maar de goddelozen zullen zwijgen in duisternis; want een man vermag niet door kracht.", "Luk 18:19": "En Jezus zei tegen hem: Waarom noemt u Mij goed? Niemand is goed, dan Een, namelijk God.", "Ps 88:9": "Mijn bekenden hebt U ver van mij weggedaan, U hebt mij hun tot een grote gruwel gesteld; ik ben opgesloten en kan niet uitkomen.", "Jes 50:11": "Zie, u allen, die een vuur aansteekt, die u met vuurvonken omgordt! Wandel in de vlam van uw vuur, en in de vuurvonken die u ontstoken hebt. Dit overkomt u van Mijn hand: in smart zult u neerliggen.", "Spr 25:19": "Het vertrouwen op een trouweloze, op de dag van benauwdheid, is als een gebroken tand en een verstuikte voet.", "Job 19:6": "Weet dan, dat God mij heeft omgekeerd, en mij met Zijn net omsingeld heeft.", "Hand 4:8-13": "Toen zei Petrus, vervuld met de Heilige Geest, tegen hen: Leiders van het volk, en oudsten van Israël! Als wij vandaag ondervraagd worden over de weldaad aan een zieke mens gedaan, waardoor hij gezond geworden is; Laat het u allen bekend zijn, en het hele volk van Israël, dat door de Naam van Jezus Christus, de Nazarener, Die u gekruisigd hebt, Die God uit de doden heeft opgewekt, door Hem, zeg ik, staat deze man hier gezond voor u.", "Ex 15:11": "O HEERE! Wie is als U onder de goden? Wie is als U, verheerlijkt in heiligheid, ontzagwekkend in lofzangen, die wonderen doet?", "Ps 32:8": "Ik zal u onderwijzen, en u de weg leren die u moet gaan; Ik zal raad geven, Mijn oog zal op u zijn.", "Hand 20:20": "Hoe ik niets heb achtergehouden van wat nuttig was, zodat ik het u niet zou verkondigd en u geleerd hebben, in het openbaar en in de huizen;", "Job 21:17": "Hoe vaak gebeurt het, dat de lamp van de goddelozen wordt uitgeblust, en hun ondergang over hen komt; dat God hun smarten uitdeelt in Zijn toorn!", "Mal 3:18": "Dan zult u opnieuw zien het onderscheid tussen de rechtvaardige en de goddeloze, tussen wie God dient, en wie Hem niet dient.", "Job 32:15": "Zij zijn ontzet, zij antwoorden niet meer; zij hebben geen woorden meer.", "Joh 13:18": "Ik zeg dit niet van u allen: Ik weet wie Ik uitverkoren heb; maar dit gebeurt, opdat de Schrift vervuld wordt: Die met Mij het brood eet, heeft tegen Mij zijn hiel opgeheven.", "Jer 5:28": "Zij zijn vet, zij zijn glad, zelfs de daden van de bozen gaan zij te boven; de rechtszaak richten zij niet, zelfs de rechtszaak van de wees niet, toch is het hun voorspoedig; ook oordelen zij het recht van de behoeftigen niet.", "Pred 12:11": "De woorden van de wijzen zijn als prikkels, en als spijkers, diep ingeslagen door de meesters van de verzamelingen, die gegeven zijn door de ene Herder.", "Ps 42:2": "Zoals een hert schreeuwt naar de waterstromen, zo schreeuwt mijn ziel tot U, o God!", "Job 2:10": "Maar hij zei tegen haar: U spreekt zoals een van de dwaze vrouwen spreekt; zouden wij dan het goede van God ontvangen, en het kwade niet ontvangen? In dit alles zondigde Job niet met zijn lippen.", "Job 30:11": "Want Hij heeft mijn koord losgemaakt en mij bedrukt; daarom hebben zij de teugel voor mijn aangezicht afgeworpen.", "Ps 10:17": "HEERE, U hebt de wens van de zachtmoedigen gehoord; U zult hun hart sterken, Uw oor zal opmerken;", "1 Kon 22:27": "En u zult zeggen: Zo zegt de koning: Zet deze man in de gevangenis, en geef hem brood van benauwdheid en water van benauwdheid, totdat ik in vrede terugkom.", "Spr 27:9": "Olie en reukwerk verblijden het hart; zo doet de zoetheid van iemands vriend, vanwege hartelijke raad.", "Amos 3:6": "Zal de bazuin in de stad geblazen worden, zonder dat het volk sidddert? Zal er een kwaad in de stad zijn, dat de HEERE niet doet?", "1 Joh 1:5": "En dit is de verkondiging die wij van Hem gehoord hebben, en wij verkondigen u, dat God een Licht is, en dat er in Hem helemaal geen duisternis is.", "Ps 48:11": "Zoals Uw Naam is, o God! zo is Uw roem tot aan de einden van de aarde; Uw rechterhand is vol van gerechtigheid.", "Spr 21:2": "Elke weg van een mens is recht in zijn eigen ogen; maar de HEERE weegt de harten.", "Ezech 4:16": "Daarna zei Hij tegen mij: Mensenkind, zie, Ik breek de staf van het brood in Jeruzalem, en zij zullen het brood met gewicht en met kommer eten, en het water met een bepaalde maat en met verbaasdheid drinken;", "Ps 107:17-19": "De zotten worden geplaagd om de weg van hun overtreding, en om hun ongerechtigheden; Hun ziel gruwde van alle voedsel, en zij waren tot aan de poorten van de dood gekomen. Toen riepen zij tot de HEERE in de benauwdheid die zij hadden, en Hij verloste hen uit hun angsten.", "Jer 17:16": "Ik heb toch niet aangedrongen, meer dan een herder achter U betaamde; ook heb ik de dodelijke dag niet begeerd, Gij weet het; wat uit mijn lippen is gegaan, is voor Uw aangezicht geweest.", "3 Joh 1:1": "De ouderling aan de geliefde Gajus, die ik in waarheid liefheb.", "Jer 45:3": "U zegt: Wee mij nu, want de HEERE heeft droefheid aan mijn smart toegevoegd; ik ben moe van mijn zuchten, en vind geen rust!", "Jer 9:4": "Wacht u, ieder voor zijn vriend, en vertrouw niet op enige broeder; want elke broeder doet niet dan bedriegen, en elke vriend gaat om met achterklap.", "Klaagl 3:1-36": "Aleph. Ik ben de man die ellende gezien heeft door de roede van Zijn verbolgenheid. Aleph. Hij heeft mij geleid en gevoerd in de duisternis, en niet in het licht. Aleph. Hij heeft Zich zeker tegen mij gewend, Hij heeft Zijn hand de hele dag veranderd.", "Jes 28:20": "Want het bed zal korter zijn dan dat men zich erop kan uitstrekken; en het deksel zal te smal zijn, als men zich eronder wikkelt.", "Gen 20:11": "En Abraham zei: Want ik dacht: er is beslist geen vreze van God in deze plaats, zodat zij mij zullen doden vanwege mijn vrouw.", "Joh 1:46": "Filippus vond Nathanaël en zei tegen hem: Wij hebben Hem gevonden, van Wie Mozes in de wet geschreven heeft, en de profeten, namelijk Jezus, de zoon van Jozef, van Nazareth.", "Ps 141:7": "Onze beenderen zijn verstrooid bij de mond van het graf, zoals wanneer iemand op de aarde iets kloofde en verdeelde.", "1 Kor 11:32": "Maar als wij geoordeeld worden, worden wij door de Heere getuchtigd, opdat wij niet met de wereld veroordeeld zouden worden.", "Jer 14:6": "En de wilde ezels staan op de hoge plaatsen, zij scheppen de wind als de jakhalzen; hun ogen bezwijken, omdat er geen kruid is.", "Jes 43:15": "Ik ben de HEERE, uw Heilige; de Schepper van Israël, uw Koning.", "Job 16:17": "Terwijl er toch geen onrecht in mijn handen is, en mijn gebed zuiver is.", "Jes 10:2": "om de armen van het recht af te wenden, en om het recht van de ellendigen van Mijn volk te roven, opdat de weduwen hun buit worden, en opdat zij de wezen mogen plunderen!", "Ps 66:10-12": "Want U hebt ons beproefd, o God! U hebt ons gelouterd, zoals men zilver loutert; U had ons in het net gebracht; U had een engs band om onze lenden gelegd; U had de mens over ons hoofd laten rijden; wij waren in het vuur en in het water gekomen; maar U hebt ons uitgevoerd naar een overvloeiende verversing.", "Hand 5:29-32": "Maar Petrus en de apostelen antwoordden, en zeiden: Men moet God meer gehoorzaam zijn dan de mensen. De God van onze vaderen heeft Jezus opgewekt, Die u omgebracht hebt, door Hem aan het hout te hangen. Deze heeft God door Zijn rechterhand verhoogd tot een Vorst en Zaligmaker, om Israël bekering en vergeving van zonden te geven.", "Job 34:32": "Behalve wat ik zie, leer Gij mij; heb ik onrecht gewrocht, ik zal het niet meer doen.", "Job 34:10": "Daarom, u, lieden van verstand, hoor naar mij: Ver zij God van goddeloosheid, en de Almachtige van onrecht!", "Deut 10:18": "Die het recht van de wees en van de weduwe doet; en de vreemdeling liefheeft, door hem brood en kleding te geven.", "2 Kor 11:23-30": "Zijn zij dienaars van Christus? (ik spreek als een onwijze) ik ben boven hen; in arbeid overvloediger, in slagen voortreffelijker, in gevangenissen overvloediger, in doodsgevaar menigmaal. Van de Joden heb ik veertig slagen min één, vijfmaal ontvangen. Driemaal ben ik met roeden gegeseld geweest, eens ben ik gestenigd, driemaal heb ik schipbreuk geleden, een hele nacht en dag heb ik in de diepte doorgebracht.", "Hab 3:3": "God kwam van Theman, en de Heilige van de berg Paran. Sela. Zijn heerlijkheid bedekte de hemelen, en het aardrijk was vol van Zijn lof.", "Ps 39:6": "Zie, U hebt mijn dagen een handbreed lang gemaakt, en mijn levensduur is als niets voor U; zeker, ieder mens, hoe vast hij ook staat, is enkel ijdelheid. Sela.", "Deut 32:24": "Uitgeteerd zullen zij zijn van honger, opgegeten door de karbonkel en bitter verderf; en Ik zal de tanden van de beesten onder hen sturen, met vurig venijn van slangen van het stof.", "Job 9:30": "Al zou ik mij wassen met sneeuwwater, en mijn handen zuiveren met zeep;", "Ps 88:4-19": "Want mijn ziel is verzadigd van tegenspoed, en mijn leven raakt tot aan het graf. Ik word gerekend bij hen die in de kuil neerdalen; ik ben geworden als een man die geen kracht heeft; Afgezonderd onder de doden, zoals de verslagenen die in het graf liggen, die U niet meer gedenkt, en zij zijn afgesneden van Uw hand.", "Job 10:20": "Zijn mijn dagen niet weinig? Houd op, laat van mij af, dat ik mij een weinig verkwikt;", "Spr 16:2": "Alle wegen van een man zijn zuiver in zijn eigen ogen; maar de HEERE weegt de geesten.", "2 Petr 2:5": "en de oude wereld niet gespaard heeft, maar Noach, de prediker van de gerechtigheid, met zeven anderen bewaard heeft, toen Hij de zondvloed over de wereld van de goddelozen bracht;", "Jes 43:14": "Zo zegt de HEERE, uw Verlosser, de Heilige van Israël: Om uw wil heb Ik naar Babel gezonden, en heb hen allen als vluchtelingen doen neerdalen, te weten de Chaldeeën, in de schepen, waarop zij juichten.", "Pred 2:22": "Wat heeft die mens toch van al zijn arbeid en van de kwellingen van zijn hart, waarmee hij zich aftobt onder de zon?", "Deut 29:20": "De HEERE zal hem niet willen vergeven; maar dan zal de toorn van de HEERE en Zijn ijver roken over die man, en de hele vloek, die in dit boek geschreven is, zal op hem liggen; en de HEERE zal zijn naam van onder de hemel uitwissen.", "Neh 5:8": "En ik zei tegen hen: Wij hebben onze broeders, de Joden, die aan de heidenen verkocht waren, naar ons vermogen teruggekocht; en zouden u ook uw broeders verkopen, of zouden zij aan ons verkocht worden? Toen zwegen zij en vonden geen antwoord.", "Ps 49:16": "Maar God zal mijn ziel uit de macht van het graf verlossen, want Hij zal mij opnemen. Sela.", "Openb 4:8": "En de vier dieren hadden ieder voor zichzelf zes vleugels rondom, en waren van binnen vol ogen; en zij hebben geen rust, dag en nacht, en zeggen: Heilig, heilig, heilig is de Heere God, de Almachtige, Die was, en Die is, en Die komen zal.", "Matt 5:48": "Wees dan volmaakt, zoals uw Vader, Die in de hemelen is, volmaakt is.", "Ps 119:126": "Het is tijd voor de HEERE, dat Hij werkt, want zij hebben Uw wet verbroken.", "Deut 32:23": "Ik zal kwaad over hen ophopen; Mijn pijlen zal Ik op hen verschieten.", "Hebr 12:9": "Verder, wij hebben de vaders van ons vlees wel als kastijders gehad, en wij hadden ontzag voor hen; zullen wij dan niet veel meer onderworpen zijn aan de Vader van de geesten, en leven?", "Pred 4:9-12": "Twee zijn beter dan een; want zij hebben een goede beloning voor hun moeite; Want als zij vallen, richt de een zijn metgezel op; maar wee de ene die gevallen is, want er is geen tweede om hem op te helpen. Ook, als twee samen liggen, hebben zij warmte; maar hoe zou iemand alleen warm worden?", "Ps 107:4": "Die in de woestijn dwaalden, op een weg door de wildernis, die geen stad vonden om in te wonen;", "Ezech 12:18": "Mensenkind, u zult uw brood eten met beven, en uw water zult u met angst en bezorgdheid drinken.", "Jes 1:17": "Leer goed te doen, zoek het recht, help de verdrukte, doe de wees recht, voer de rechtszaak van de weduwe.", "Openb 3:17": "Want u zegt: Ik ben rijk, en verrijkt geworden, en heb aan niets gebrek; en u weet niet dat u ellendig bent, en jammerlijk, en arm, en blind, en naakt.", "Ps 102:10": "Want ik eet as als brood, en vermeng mijn drank met tranen.", "Job 34:3": "Want het oor proeft de woorden, zoals het gehemelte het voedsel smaakt.", "2 Sam 7:14": "Ik zal hem tot een Vader zijn, en hij zal Mij tot een zoon zijn; wanneer hij misdoet, zal Ik hem straffen met een mensenroede en met plagen van de mensenkinderen.", "Ps 144:6": "Bliksem met bliksem, en verstrooi hen; zend Uw pijlen uit, en vernietig hen.", "Jes 47:4": "Onze Verlossers Naam is HEERE van de heerscharen, de Heilige van Israël.", "Hand 11:20": "En er waren enige mannen uit Cyprus en Cyrene onder hen, die naar Antiochië gekomen waren en tot de Grieken spraken, terwijl zij de Heere Jezus verkondigden.", "Job 21:34": "Hoe troost u mij dan met ijdelheid, terwijl in uw antwoorden ontrouw ov
