kracht aankomt, zie, Hij is sterk; en als het op recht aankomt, wie zal mij dagvaarden?", "20": "Al zou ik mijzelf rechtvaardigen, mijn mond zal mij verdoemen; ben ik oprecht, Hij zal mij toch verkeerd verklaren.", "21": "Ben ik oprecht, dan acht ik toch mijn ziel niet; ik versmaad mijn leven.", "22": "Dat is één ding, daarom zeg ik: De oprechte en de goddeloze verdoet Hij.", "23": "Als de gesel haastig doodt, bespot Hij de beproeving van de onschuldigen.", "24": "De aarde wordt gegeven in de hand van de goddeloze; Hij overdekt het aangezicht van haar rechters; is het niet zo, wie is het dan?", "25": "En mijn dagen zijn sneller geweest dan een loper; zij zijn weggevlucht, zij hebben het goede niet gezien.", "26": "Zij zijn voorbijgevaren met jachtschepen; zoals een arend naar het aas toevliegt.", "27": "Als ik zeg: Ik zal mijn klacht vergeten, en ik zal mijn treurige gezicht laten varen, en mij verkwikken;", "28": "Dan schroom ik voor al mijn smarten; ik weet dat U mij niet onschuldig zult houden.", "29": "Ik zal toch goddeloos verklaard worden; waarom dan zal ik zonder nut zwoegen?", "30": "Al zou ik mij wassen met sneeuwwater, en mijn handen zuiveren met zeep;", "31": "Dan zult U mij in de gracht dompelen, en mijn kleren zullen van mij walgen.", "32": "Want Hij is geen man zoals ik, die ik antwoorden zou, zodat wij samen voor het gericht zouden komen.", "33": "Er is geen scheidsman tussen ons, die zijn hand op ons beiden leggen mocht.", "34": "Laat Hij Zijn roede van op mij wegdoen, en laat Zijn verschrikking mij niet angstig maken;", "35": "Dan zal ik spreken en Hem niet vrezen; want zo ben ik niet bij mijzelf."}, "SV": {"1": "Maar Job antwoordde en zeide:", "2": "Waarlijk, ik weet, dat het zo is; want hoe zou de mens rechtvaardig zijn bij God?", "3": "Zo Hij lust heeft, om met hem te twisten, niet een uit duizend zal hij Hem beantwoorden.", "4": "Hij is wijs van hart, en sterk van kracht; wie heeft zich tegen Hem verhard, en vrede gehad?", "5": "Die de bergen verzet, dat zij het niet gewaar worden, Die ze omkeert in Zijn toorn;", "6": "Die de aarde beweegt uit haar plaats, dat haar pilaren schudden;", "7": "Die de zon gebiedt, en zij gaat niet op; en verzegelt de sterren;", "8": "Die alleen de hemelen uitbreidt, en treedt op de hoogten der zee;", "9": "Die den Wagen maakt, den Orion, en het Zevengesternte, en de binnenkameren van het Zuiden;", "10": "Die grote dingen doet, die men niet doorzoeken kan; en wonderen, die men niet tellen kan.", "11": "Zie, Hij zal voor mij henengaan, en ik zal Hem niet zien; en Hij zal voorbijgaan, en ik zal Hem niet merken.", "12": "Zie, Hij zal roven, wie zal het Hem doen wedergeven? Wie zal tot Hem zeggen: Wat doet Gij?", "13": "God zal Zijn toorn niet afkeren; onder Hem worden gebogen de hovaardige helpers.", "14": "Hoeveel te min zal ik Hem antwoorden, *en* mijn woorden uitkiezen tegen Hem?", "15": "Denwelken ik, zo ik rechtvaardig ware, niet zou antwoorden; mijn Rechter zal ik om genade bidden.", "16": "Indien ik roep, en Hij mij antwoordt; ik zal niet geloven, dat Hij mijn stem ter ore genomen heeft.", "17": "Want Hij vermorzelt mij door een onweder, en vermenigvuldigt mijn wonden zonder oorzaak.", "18": "Hij laat mij niet toe mijn adem te verhalen; maar Hij verzadigt mij met bitterheden.", "19": "Zo het aan de kracht *komt*, zie, Hij is sterk; en zo het aan het recht *komt*, wie zal mij dagvaarden?", "20": "Zo ik mij rechtvaardig, mijn mond zal mij verdoemen; ben ik oprecht, Hij zal mij toch verkeerd verklaren.", "21": "Ben ik oprecht, zo acht ik *toch* mijn ziel niet; ik versmaad mijn leven.", "22": "Dat is een ding, daarom zeg ik: Den oprechte en den goddeloze verdoet Hij.", "23": "Als de gesel haastelijk doodt, bespot Hij de verzoeking der onschuldigen.", "24": "De aarde wordt gegeven in de hand des goddelozen; Hij overdekt het aangezicht harer rechteren; zo niet, wie is Hij dan?", "25": "En mijn dagen zijn lichter geweest dan een loper; zij zijn weggevloden, zij hebben het goede niet gezien.", "26": "Zij zijn voorbijgevaren met jachtschepen; gelijk een arend naar het aas toevliegt.", "27": "Indien mijn zeggen is: Ik zal mijn klacht vergeten, en ik zal mijn gebaar laten varen, en mij verkwikken;", "28": "Zo schroom ik voor al mijn smarten; ik weet, dat Gij mij niet onschuldig zult houden.", "29": "Ik zal *toch* goddeloos zijn; waarom dan zal ik ijdellijk arbeiden?", "30": "Indien ik mij wasse met sneeuwwater, en mijn handen zuivere met zeep;", "31": "Dan zult Gij mij in de gracht induiken, en mijn klederen zullen van mij gruwen.", "32": "Want Hij is niet een man, als ik, dien ik antwoorden zou, zo wij te zamen in het gericht kwamen.", "33": "Er is geen scheidsman tussen ons, *die* zijn hand op ons beiden leggen mocht.", "34": "Dat Hij van op mij Zijn roede wegdoe, en dat Zijn verschrikking mij niet verbaasd make;", "35": "Zo zal ik spreken, en Hem niet vrezen; want zodanig ben ik niet bij mij."}, "KJV": {"1": "Then Job answered and said,", "2": "I know *it is* so of a truth: but how should man be just with God?", "3": "If he will contend with him, he cannot answer him one of a thousand.", "4": "*He is* wise in heart, and mighty in strength: who hath hardened *himself* against him, and hath prospered?", "5": "Which removeth the mountains, and they know not: which overturneth them in his anger.", "6": "Which shaketh the earth out of her place, and the pillars thereof tremble.", "7": "Which commandeth the sun, and it riseth not; and sealeth up the stars.", "8": "Which alone spreadeth out the heavens, and treadeth upon the waves of the sea.", "9": "Which maketh Arcturus, Orion, and Pleiades, and the chambers of the south.", "10": "Which doeth great things past finding out; yea, and wonders without number.", "11": "Lo, he goeth by me, and I see *him* not: he passeth on also, but I perceive", "12": "Behold, he taketh away, who can hinder him? who will say unto him, What doest", "13": "*If* God will not withdraw his anger, the proud helpers do stoop", "14": "How much less shall I answer him, *and* choose out my words", "15": "Whom, though I were righteous, *yet* would I not answer, *but* I would make supplication to my judge.", "16": "If I had called, and he had answered me; *yet* would I not believe that he had hearkened unto my voice.", "17": "For he breaketh me with a tempest, and multiplieth my wounds without cause.", "18": "He will not suffer me to take my breath, but filleth me with bitterness.", "19": "If *I speak* of strength, lo, *he is* strong: and if of judgment, who shall set", "20": "If I justify myself, mine own mouth shall condemn me: *if I say*, I *am* perfect, it shall also prove me perverse.", "21": "*Though* I *were* perfect, *yet* would I not know my soul: I would despise my life.", "22": "This *is* one *thing*, therefore I said *it*, He destroyeth the perfect and the wicked.", "23": "If the scourge slay suddenly, he will laugh at the trial of the innocent.", "24": "The earth is given into the hand of the wicked: he covereth the faces of the judges thereof; if not, where,", "25": "Now my days are swifter than a post: they flee away, they see no good.", "26": "They are passed away as the swift ships: as the eagle *that* hasteth to the prey.", "27": "If I say, I will forget my complaint, I will leave off my heaviness, and comfort", "28": "I am afraid of all my sorrows, I know that thou wilt not hold me innocent.", "29": "*If* I be wicked, why then labour I in vain?", "30": "If I wash myself with snow water, and make my hands never so clean;", "31": "Yet shalt thou plunge me in the ditch, and mine own clothes shall abhor", "32": "For *he is* not a man, as I *am, that* I should answer him, *and* we should come together in judgment.", "33": "Neither is there any daysman betwixt us, *that* might lay his hand upon us both.", "34": "Let him take his rod away from me, and let not his fear terrify", "35": "*Then* would I speak, and not fear"}}, "tsk": {"2": [{"kopje": "hoe", "refs": ["Job 4:17", "Job ures concerning"]}, {"topic": "Snow", "href": "../../nave/s/", "subs": ["In Uz"]}], "torrey": [{"topic": "Pardon", "href": "../../torrey/p/", "subs": ["Outward purifications, ineffectual for"]}, {"topic": "Purifications Or Baptisms", "href": "../../torrey/p/", "subs": ["Insufficient for spiritual purification"]}, {"topic": "Self-righteousness", "href": "../../torrey/s/", "subs": ["Is Vain Because Our Righteousness Is › Ineffectual for salvation"]}, {"topic": "Sin", "href": "../../torrey/s/", "subs": ["No man can cleanse himself from"]}]}, "31": {"torrey": [{"topic": "Pardon", "href": "../../torrey/p/", "subs": ["Outward purifications, ineffectual for"]}, {"topic": "Purifications Or Baptisms", "href": "../../torrey/p/", "subs": ["Insufficient for spiritual purification"]}, {"topic": "Self-righteousness", "href": "../../torrey/s/", "subs": ["Is Vain Because Our Righteousness Is › Ineffectual for salvation"]}, {"topic": "Sin", "href": "../../torrey/s/", "subs": ["No man can cleanse himself from"]}]}, "32": {"nave": [{"topic": "God", "href": "../../nave/g/", "subs": ["Glory Of"]}, {"topic": "Intercession", "href": "../../nave/i/", "subs": ["Of Man With God"]}]}, "33": {"nave": [{"topic": "Daysman", "href": "../../nave/d/", "subs": ["A mediator"]}, {"topic": "God", "href": "../../nave/g/", "subs": ["Glory Of"]}, {"topic": "Intercession", "href": "../../nave/i/", "subs": ["Of Man With God"]}, {"topic": "Jesus, The Christ", "href": "../../nave/j/", "subs": ["Names, Appellations, And Titles Of › Daysman"]}]}, "34": {"nave": [{"topic": "Blasphemy", "href": "../../nave/b/", "subs": ["General scriptures concerning"]}]}, "35": {"nave": [{"topic": "Blasphemy", "href": "../../nave/b/", "subs": ["General scriptures concerning"]}]}}, "extern": {"Hab 3:10": "De bergen zagen U, en leden smart; de waterstroom ging erdoorheen, de afgrond gaf zijn stem, hij hief zijn handen op in de hoogte.", "Ex 10:21": "Toen zei de HEERE tegen Mozes: Strek uw hand uit naar de hemel, en er zal duisternis komen over Egypteland, zodat men de duisternis tasten kan.", "Ps 71:15": "Mijn mond zal Uw gerechtigheid vertellen, de hele dag Uw heil; hoewel ik de getallen ervan niet weet.", "Hebr 11:37": "zij zijn gestenigd, in stukken gezaagd, beproefd, met het zwaard gedood; zij hebben rondgezworven in schapenvellen en geitenvellen; berooid, verdrukt, mishandeld;", "Matt 11:26": "Ja, Vader! Want zo is het welbehagen geweest voor U.", "Job 4:19": "Hoeveel te meer dan hen die in lemen huizen wonen, waarvan de grondslag in het stof is? Zij worden verbrijzeld voor de mot.", "1 Sam 2:8": "Hij verheft de geringe uit het stof, en de nooddruftige verhoogt Hij uit de vuilnis, om hen te doen zitten bij de vorsten, dat Hij hen de stoel van de eer laat beërven; want de fundamenten van het aardrijk zijn van de HEERE, en Hij heeft de wereld daarop gezet.", "Job 34:32": "Behalve wat ik zie, leer Gij mij; heb ik onrecht gewrocht, ik zal het niet meer doen.", "Pred 3:11": "Hij heeft ieder ding mooi gemaakt op zijn tijd; ook heeft Hij de eeuw in hun hart gelegd, zonder dat een mens het werk, dat God gemaakt heeft, kan doorgronden, van het begin tot het einde toe.", "Ex 10:22": "Toen Mozes zijn hand uitstrekte naar de hemel, kwam er een dikke duisternis in het hele Egypteland, drie dagen lang.", "Ef 3:10": "opdat nu, door de Gemeente, aan de overheden en de machten in de hemel de veelvuldige wijsheid van God bekendgemaakt wordt;", "1 Tim 6:5": "verkeerde twistgesprekken van mensen die een verdorven verstand hebben en van de waarheid beroofd zijn, en die menen dat de godsvrucht een bron van winst is. Blijf uit de buurt van zulke mensen.", "Ps 90:9": "Want al onze dagen gaan henen door Uw verbolgenheid; wij brengen onze jaren door als een gedachte.", "Fil 3:8": "Ja, zeker, ik beschouw ook alle dingen als schade vanwege de uitnemendheid van de kennis van Christus Jezus, mijn Heere; om Wiens wil ik al die dingen als schade heb gerekend, en ze beschouw als vuil, opdat ik Christus mag winnen,", "Job 37:1": "Ook hierover beeft mijn hart, en springt op uit zijn plaats.", "Spr 29:1": "Een man die, vaak bestraft, zijn nek verhardt, zal plotseling verbroken worden, zodat er geen genezing meer mogelijk is.", "Ps 104:2": "Hij bedekt Zich met het licht, als met een kleed; Hij spant de hemel uit als een gordijn.", "1 Kon 8:39": "hoor Ú dan in de hemel, de vaste plaats van Uw woning, en vergeef, en doe, en geef ieder naar al zijn wegen, zoals U zijn hart kent; want U alleen kent het hart van alle kinderen van de mensen;", "Jes 40:12": "Wie heeft het water met Zijn vuist gemeten, en van de hemel met de span de maat genomen, en heeft met een drieling het stof van de aarde begrepen, en de bergen gewogen in een waag, en de heuvels in een weegschaal?", "Ps 114:7": "Beef, aarde, voor het aangezicht van de Heere, voor het aangezicht van de God van Jakob;", "Ps 40:13": "Want kwaden, tot zonder getal toe, hebben mij omgeven; mijn ongerechtigheden hebben mij aangegrepen, zodat ik niet heb kunnen zien; ze zijn menigvuldiger dan de haren van mijn hoofd, en mijn hart heeft mij verlaten.", "Zach 14:4": "En Zijn voeten zullen op die dag staan op de Olijfberg, die voor Jeruzalem ligt, tegen het oosten; en de Olijfberg zal in tweeën gespleten worden naar het oosten en naar het westen, zodat er een zeer grote vallei zal zijn; en de ene helft van de berg zal wijken naar het noorden, en de helft daarvan naar het zuiden.", "Openb 11:13": "En op datzelfde uur gebeurde er een grote aardbeving, en het tiende deel van de stad viel, en er werden in de aardbeving zevenduizend namen van mensen gedood, en de overigen werden zeer bevreesd, en gaven de God van de hemel heerlijkheid.", "Matt 20:15": "Of mag ik met het mijne niet doen wat ik wil? Of is uw oog boos, omdat ik goed ben?", "Matt 7:27": "En de slagregen is neergevallen, en de waterstromen zijn gekomen, en de winden hebben gewaaid en zijn tegen dat huis aangeslagen, en het is gevallen, en zijn val was groot.", "Ps 19:13": "Wie zou de afdwalingen verstaan? Reinig mij van de verborgen afdwalingen.", "Amos 5:8": "Die het Zevengesternte en de Orion maakt, en de doodsschaduw in de morgen verandert, en de dag als de nacht verduistert; Die de wateren van de zee roept, en ze uitgiet over de aardbodem, HEERE is Zijn Naam.", "Job 34:14": "Als Hij Zijn hart tegen hem zette, Zijn geest en Zijn adem zou Hij tot Zich verzamelen;", "Jer 31:9": "Zij zullen komen met geween, en met smekingen zal Ik hen leiden; Ik zal hen leiden aan de waterbeken, op een rechte weg, waarop zij zich niet zullen stoten; want Ik ben Israël tot een Vader, en Efraïm is Mijn eerstgeborene.", "1 Tim 6:16": "Die als enige onsterfelijkheid heeft, en een ontoegankelijk licht bewoont; aan Wie geen mens gezien heeft, en ook niet zien kan; aan Wie eer en eeuwige kracht zij. Amen.", "Jes 28:17": "En Ik zal het oordeel stellen naar het richtsnoer, en de gerechtigheid naar het paslood; en de hagel zal de toevlucht van de leugen wegvagen, en het water zal de schuilplaats overstromen.", "Jer 12:2": "U hebt hen geplant, zij zijn ook ingeworteld, zij groeien, ook dragen zij vrucht; U bent wel nabij in hun mond, maar ver van hun nieren.", "2 Sam 14:15": "Nu dan, dat ik gekomen ben om dit woord tot de koning, mijn heer, te spreken, is omdat het volk mij bang gemaakt heeft; zo zei uw dienares: Ik zal nu tot de koning spreken; misschien zal de koning doen wat zijn dienares vraagt.", "Matt 24:29": "En meteen na de verdrukking van die dagen zal de zon verduisterd worden, en de maan zal haar licht niet geven, en de sterren zullen van de hemel vallen, en de krachten van de hemelen zullen beven.", "Jes 59:6": "Hun webben deugen niet tot kleding, en zij zullen zichzelf niet kunnen bedekken met hun werken; hun werken zijn werken van ongerechtigheid, en een daad van geweld is in hun handen.", "Job 25:4": "Hoe zou dan een mens rechtvaardig zijn bij God, en hoe zou hij zuiver zijn, die van een vrouw geboren is?", "Gen 1:16": "God maakte dan die twee grote lichten: dat grote licht om te heersen over de dag, en dat kleine licht om te heersen over de nacht; en ook de sterren.", "Jer 49:19": "Zie, gelijk een leeuw uit de verheffing van de Jordaan zal hij opkomen tegen de sterke woning; want Ik zal hem in een ogenblik daaruit doen wegrennen; en wie daartoe uitverkoren is, hem zal Ik tegen haar aanstellen; want wie is Mij gelijk, en wie zou Mij dagvaarden, en wie is die herder die voor Mijn aangezicht bestaan zou?", "Ps 18:7": "Toen het mij bang was, riep ik de HEERE aan, en riep tot mijn God; Hij hoorde mijn stem uit Zijn paleis, en mijn geroep voor Zijn aangezicht kwam in Zijn oren.", "Job 23:15": "Hierom word ik voor Zijn aangezicht ontsteld; als ik het aanmerk, vrees ik voor Hem;", "Rom 11:33": "O diepte van de rijkdom, én van de wijsheid én van de kennis van God, hoe ondoorzoekelijk zijn Zijn oordelen, en onnaspeurlijk Zijn wegen!", "Ps 143:2": "En ga niet in het gericht met Uw knecht, want niemand die leeft, zal voor Uw aangezicht rechtvaardig zijn.", "Ex 20:7": "U zult de naam van de HEERE, uw God, niet ijdel gebruiken; want de HEERE zal niet onschuldig houden wie Zijn naam ijdel gebruikt.", "Matt 27:51": "En zie, het voorhangsel van de tempel scheurde in tweeën, van boven tot beneden; en de aarde beefde, en de rotsen scheurden.", "Ps 88:17": "Uw brandende toorn gaat over mij heen; Uw verschrikkingen doen mij vergaan.", "Jer 4:24": "Ik keek naar de bergen, en zie, zij beefden; en alle heuvels schudden.", "Job 36:5": "Zie, God is machtig, toch veracht Hij niemand; machtig is Hij in kracht van hart.", "Ezech 21:13": "Als er beproeving was, wat was het dan? Zou er dan ook geen roede zijn die alles omzet, spreekt de Heere HEERE.", "Job 4:7": "Bedenk toch, wie is de onschuldige die is omgekomen; en waar zijn de oprechten verdelgd?", "Dan 4:3": "Hoe groot zijn Zijn tekenen! En hoe machtig Zijn wonderen! Zijn Rijk is een eeuwig Rijk, en Zijn heerschappij is van geslacht tot geslacht.", "Ps 68:9": "Daverde de aarde, ook dropen de hemelen voor Gods aanschijn; zelfs deze Sinaï, voor het aanschijn van God, de God van Israël.", "Ex 6:8": "En Mozes sprak zo tot de kinderen van Israël; doch zij luisterden niet naar Mozes, vanwege de benauwdheid van de geest, en vanwege de harde dienstbaarheid.", "Job 26:11": "De pilaren van de hemel sidderen, en schrikken op van Zijn bestraffing.", "Job 7:19": "Hoe lang keert U zich niet van mij af, en laat U niet van mij af, totdat ik mijn speeksel inzwelg?", "Ef 3:20": "Hem nu, Die machtig is oneindig veel meer te doen dan wij bidden of denken, naar de kracht die in ons werkt,", "Zach 12:1": "De last van het woord van de HEERE over Israël. De HEERE spreekt, Die de hemel uitbreidt, en de aarde grondvest, en de geest van de mens in zijn binnenste formeert.", "Jes 24:19": "De aarde zal helemaal verbroken worden, de aarde zal helemaal uiteengescheurd worden, de aarde zal helemaal in beweging gebracht worden.", "Job 31:35": "Och, had ik er maar een die mij hoorde! Zie, mijn oogmerk is, dat de Almachtige mij antwoordt, en dat mijn tegenpartij een boek schrijft.", "Job 4:17": "Zou een mens rechtvaardiger zijn dan God? Zou een man reiner zijn dan zijn Maker?", "Ex 15:11": "O HEERE! Wie is als U onder de goden? Wie is als U, verheerlijkt in heiligheid, ontzagwekkend in lofzangen, die wonderen doet?", "Job 32:1": "Toen hielden de drie mannen op Job te antwoorden, omdat hij in zijn eigen ogen rechtvaardig was.", "Job 14:4": "Wie kan een reine geven uit een onreine? Niemand.", "Ps 39:6": "Zie, U hebt mijn dagen een handbreed lang gemaakt, en mijn levensduur is als niets voor U; zeker, ieder mens, hoe vast hij ook staat, is enkel ijdelheid. Sela.", "Job 35:14": "Dat u ook gezegd hebt: U zult Hem niet aanschouwen; er is toch een oordeel voor Zijn aangezicht, wacht u dan op Hem.", "Hab 3:6": "Hij stond, en mat het land, Hij zag toe, en maakte de heidenvolken los, en de aloude bergen zijn verstrooid geworden; de heuvels van eeuwigheid hebben zich gebogen; de gangen van eeuwigheid zijn van Hem.", "Jak 4:7": "Onderwerp u dan aan God; weerstaat de duivel, en hij zal van u wegvluchten.", "Spr 23:5": "Zult u uw ogen laten vliegen op iets wat er niet is? Want het maakt zich zeker vleugels, als een arend, die naar de hemel vliegt.", "Jes 40:22": "Hij is het, Die daar zit boven de kring van de aarde, en haar inwoners zijn als sprinkhanen; Hij is het, Die de hemel uitspant als een dunne doek, en breidt hem uit als een tent, om te bewonen;", "Ef 1:19": "En wat de uitnemende grootheid is van Zijn kracht aan ons, die geloven, naar de werking van de sterkte van Zijn macht,", "Luk 10:29": "Maar hij wilde zichzelf rechtvaardigen en zei tegen Jezus: En wie is mijn naaste?", "Job 24:25": "Als het nu niet zo is, wie zal mij dan leugenachtig maken, en mijn woorden tot niets maken?", "1 Joh 3:20": "Want als ons hart ons veroordeelt, God is meer dan ons hart, en Hij kent alle dingen.", "Job 5:8": "Doch ik zou God zoeken, en tot God mijn aanspraak richten;", "Luk 21:11": "En er zullen grote aardbevingen zijn op verscheidene plaatsen, en hongersnoden, en pestilentiën; er zullen ook schrikwekkende dingen, en grote tekenen van de hemel gebeuren.", "Rom 3:20": "Daarom zal uit de werken van de wet geen vlees gerechtvaardigd worden, voor Hem; want door de wet is de kennis van de zonde.", "Job 39:35": "Is het twisten met de Almachtige onderrichten? Wie God bestraft, die antwoordt daarop.", "Ps 104:24": "Hoe groot zijn Uw werken, o HEERE! U hebt ze allemaal met wijsheid gemaakt; het aardrijk is vol van Uw rijkdom.", "Ef 1:11": "In Hem, in Wie wij ook een erfdeel geworden zijn, wij, die van tevoren voorbestemd waren naar het voornemen van Hem die alle dingen werkt naar de raad van Zijn wil;", "Ex 14:18": "En de Egyptenaren zullen weten dat Ik de HEERE ben, wanneer Ik verheerlijkt zal worden aan Farao, aan zijn wagens en aan zijn ruiters.", "Job 23:8": "Zie, ga ik voorwaarts, dan is Hij er niet, of achterwaarts, dan merk ik Hem niet op.", "Ezech 21:4": "Omdat Ik dan van u zal uitroeien de rechtvaardige en de goddeloze, daarom zal Mijn zwaard uit zijn schede uitgaan tegen alle vlees, van het zuiden tot het noorden.", "Ps 130:3": "Als U, HEERE, op de ongerechtigheden let, Heere, wie zal dan bestaan?", "Hagg 2:7": "Want zo zegt de HEERE van de heerscharen: Nog eenmaal, over een korte tijd, zal het zover zijn; en Ik zal de hemel, en de aarde, en de zee, en het droge doen beven.", "Ps 114:6": "Bergen, dat u opsprong als rammen? Heuvels, als lammeren?", "Job 13:11": "Zal Zijn hoogheid u niet verschrikken, en Zijn schrik over u vallen?", "Jer 10:11": "(Zo zult u tegen hen zeggen: De goden, die de hemel en de aarde niet gemaakt hebben, zullen vergaan van de aarde, en van onder deze hemel.)", "Job 8:20": "Zie, God zal de oprechte niet verwerpen; Hij zal ook de boosdoeners niet bij de hand vatten;", "1 Joh 2:1": "Mijn kinderen, ik schrijf u deze dingen, opdat u niet zondigt. En als iemand gezondigd heeft, hebben wij een Voorspraak bij de Vader, Jezus Christus, de Rechtvaardige;", "Matt 21:21": "Maar Jezus antwoordde en zei tegen hen: Voorwaar, Ik zeg u: Als u geloof hebt en niet twijfelt, zult u niet alleen doen wat er met de vijgenboom gebeurd is, maar ook, als u tegen deze berg zegt: Word opgeheven en in de zee geworpen! zal het gebeuren.", "2 Kron 33:13": "En bad tot Hem; en Hij liet Zich door hem verbidden, en hoorde zijn smeking, en Hij bracht hem terug naar Jeruzalem, in zijn koninkrijk. Toen erkende Manasse, dat de HEERE God is.", "Ps 39:14": "Wend U van mij af, dat ik verkwikt word, voordat ik heenga, en er niet meer ben.", "Amos 8:9": "En het zal op die dag gebeuren, spreekt de Heere HEERE, dat Ik de zon op de middag zal doen ondergaan, en het land op klaarlichte dag zal verduisteren.", "Job 7:7": "Bedenk, dat mijn leven een wind is; mijn oog zal niet terugkomen, om het goede te zien.", "Job 23:7": "Daar zou de oprechte met Hem pleiten; en ik zou mij voor eeuwig van mijn Rechter vrijmaken.", "Jes 45:9": "Wee hem die met zijn Formeerder twist, zoals een potscherf met aarden potscherven! Zal ook het leem tegen zijn formeerder zeggen: Wat maakt u? of zal uw werk zeggen: Hij heeft geen handen?", "Jer 12:1": "Ú zou rechtvaardig zijn, HEERE, wanneer ik tegen U zou twisten; ik zal echter over Uw oordelen met U spreken; waarom is de weg van de goddelozen voorspoedig, waarom hebben zij rust, allen die trouweloos trouweloosheid bedrijven?", "Job 34:5": "Want Job heeft gezegd: Ik ben rechtvaardig, en God heeft mijn recht weggenomen.", "Job 37:23": "De Almachtige, Hem kunnen wij niet doorgronden; Hij is groot van kracht; doch door recht en grote gerechtigheid verdrukt Hij niet.", "Job 7:16": "Ik versmaad ze, ik zal toch in eeuwigheid niet leven; houd op met mij, want mijn dagen zijn ijdelheid.", "Job 38:19": "Waar is de weg, daar het licht woont? En de duisternis, waar is haar plaats?", "Job 23:4": "Ik zou het recht voor Zijn aangezicht ordentelijk voorstellen, en mijn mond zou ik met verdedigingen vullen.", "Ps 39:12": "Kastijdt U iemand met straffen om de ongerechtigheid, dan doet U zijn schoonheid wegteren als door een mot; zeker, ieder mens is ijdelheid. Sela.", "Ps 139:24": "En zie, of er bij mij een schadelijke weg is; en leid mij op de eeuwige weg.", "Hebr 11:36": "En anderen hebben bespottingen en geselingen ondervonden, en ook boeien en gevangenschap;", "Jak 4:6": "Ja, Hij geeft meer genade. Daarom zegt de Schrift: God weerstaat de hoogmoedigen, maar de nederigen geeft Hij genade.", "Klaagl 3:18": "Vau. Toen zei ik: Mijn sterkte is vergaan, en mijn hoop van de HEERE.", "Job 33:5": "Als u kunt, antwoord mij; schik u voor mijn aangezicht, stel u op.", "Job 2:13": "Zo zaten zij met hem op de grond, zeven dagen en zeven nachten; en niemand sprak een woord tegen hem, want zij zagen dat de smart zeer groot was.", "Num 23:19": "God is geen man, dat Hij zou liegen, en ook geen mensenkind, dat het Hem berouwen zou; zou Hij het zeggen, en het niet doen, of spreken, en het niet waarmaken?", "Job 28:9": "Hij legt zijn hand aan de keiachtige rots, hij keert de bergen vanaf de wortel om.", "1 Kor 4:4": "Want ik ben mijzelf van geen ding bewust; toch ben ik daardoor niet gerechtvaardigd; maar Die mij oordeelt, is de Heere.", "Job 26:12": "Door Zijn kracht klieft Hij de zee, en door Zijn verstand verslaat Hij haar trots.", "Spr 28:14": "Gelukkig is de mens, die voortdurend vreest; maar wie zijn hart verhardt, zal in het kwaad vallen.", "Ps 116:2": "want Hij neigt Zijn oor tot mij; daarom zal ik Hem in mijn dagen aanroepen.", "Job 3:20": "Waarom geeft Hij de ellendigen het licht, en het leven de bitterlijk bedroefden van gemoed?", "Hab 1:8": "Want zijn paarden zijn lichter dan de luipaarden, en zij zijn scherper dan de avondwolven, en zijn ruiters verspreiden zich; ja, zijn ruiters zullen van verre komen, zij zullen vliegen als een arend, die zich haast om te eten.", "Job 34:6": "Ik moet liegen over mijn recht; mijn pijl is smartelijk zonder overtreding.", "Job 33:7": "Zie, mijn verschrikking zal u niet beroeren, en mijn hand zal over u niet zwaar zijn.", "Job 11:5": "Maar zeker, och, of God sprak, en Zijn lippen tegen u opende;", "Jes 57:16": "Want Ik zal niet eeuwig twisten, en Ik zal niet voortdurend toornig zijn; want de geest zou van voor Mijn aangezicht bezwijken, en de zielen die Ik gemaakt heb.", "Job 22:27": "U zult ernstig tot Hem bidden, en Hij zal u verhoren; en u zult uw geloften betalen.", "Ezech 21:3": "En zeg tegen het land van Israël: Zo zegt de HEERE: Zie, Ik zál tegen u, en Ik zal Mijn zwaard uit zijn schede trekken; en Ik zal van u uitroeien de rechtvaardige en de goddeloze.", "Ps 46:3": "Daarom zullen wij niet vrezen, al veranderde de aarde haar plaats, en al werden de bergen verzet in het hart van de zeeën;", "Job 5:9": "Die grote dingen doet, die men niet doorzoeken kan; wonderen, die men niet tellen kan;", "Ps 147:4": "Hij telt het aantal van de sterren; Hij noemt ze allemaal bij hun naam.", "Ps 139:23": "Doorgrond mij, o God! En ken mijn hart; beproef mij, en ken mijn gedachten.", "1 Kon 8:27": "Maar zou God werkelijk op de aarde wonen? Zie, de hemelen, ja, de hemel der hemelen kunnen U niet bevatten, hoeveel te minder dit huis, dat ik gebouwd heb!", "Rom 11:34": "Want wie heeft de zin van de Heere gekend? Of wie is Zijn raadsman geweest?", "Job 34:35": "Dat Job niet met wetenschap gesproken heeft, en zijn woorden niet met kloek verstand geweest zijn.", "Job 7:21": "En waarom vergeeft U mijn overtreding niet, en doet U mijn ongerechtigheid niet weg? Want nu zal ik in het stof liggen; en U zult mij vroeg zoeken, maar ik zal niet zijn.", "Openb 20:11": "En ik zag een grote witte troon, en Hem Die daarop zat, van Wiens aangezicht de aarde en de hemel wegvloden, en er werd geen plaats voor hen gevonden.", "Ps 136:4": "Hem, Die alleen grote wonderen doet; want Zijn goedertierenheid is voor eeuwig.", "1 Kor 13:2": "En al zou het zo zijn dat ik de gave van de profetie had, en al de verborgenheden en al de wetenschap wist; en al zou het zo zijn dat ik al het geloof had, zodat ik bergen verzette, en de liefde niet had, dan zou ik niets zijn.", "Ps 39:11": "Neem Uw plaag van mij weg; ik ben bezweken door de slagen van Uw hand.", "Job 32:2": "Toen ontstak de toorn van Elihu, de zoon van Baracheël, de Buziet, uit het geslacht van Ram; tegen Job werd zijn toorn ontstoken, omdat hij zichzelf meer rechtvaardigde dan God.", "Judas 1:25": "Aan de enige, wijze God, onze Zaligmaker, zij heerlijkheid en majesteit, kracht en macht, zowel nu als in alle eeuwigheid. Amen.", "Est 7:8": "Toen de koning terugkwam uit de tuin van het paleis in het huis van het maaltijd van de wijn, was Haman gevallen op het bed waarop Esther was. Toen zei de koning: Zou hij ook wel de koningin verkrachten bij mij in het huis? Het woord ging uit van de mond van de koning, en zij bedekten Hamans aangezicht.", "1 Sam 2:25": "Wanneer een mens tegen een mens zondigt, zullen de goden hem oordelen; maar wanneer een mens tegen de HEERE zondigt, wie zal voor hem bidden? Maar zij luisterden niet naar de stem van hun vader, want de HEERE wilde hen doden.", "Matt 6:13": "En leid ons niet in verzoeking, maar verlos ons van de boze. Want van U is het Koninkrijk, en de kracht, en de heerlijkheid, tot in eeuwigheid. Amen.", "Est 8:14": "De lopers, die op snelle kamelen reden en op muildieren, trokken snel uit, aangedreven door het woord van de koning. Deze wet nu werd gegeven op de burg Susan.", "Ps 25:3": "Gimel. Ja, allen die U verwachten, zullen niet beschaamd worden; zij zullen beschaamd worden, die trouweloos handelen zonder oorzaak.", "Ezech 32:7": "En als Ik u zal uitblussen, zal Ik de hemel bedekken en zijn sterren zwart maken; Ik zal de zon met wolken bedekken, en de maan zal haar licht niet laten schijnen.", "Jes 13:13": "Daarom zal Ik de hemel beroeren, en de aarde zal bewogen worden van haar plaats, vanwege de verbolgenheid van de HEERE van de heerscharen, en vanwege de dag van Zijn hevige toorn.", "Hebr 12:11": "En alle kastijding schijnt, terwijl zij aan de gang is, geen zaak van vreugde te zijn, maar van droefheid; maar daarna geeft zij aan hen die erdoor geoefend zijn een vreedzame vrucht van gerechtigheid.", "Richt 6:13": "Maar Gideon zei tegen Hem: Och, mijn heer! Als de HEERE met ons is, waarom is ons dan dit alles overkomen? En waar zijn al Zijn wonderen, die onze vaders ons verteld hebben en zeiden: Heeft de HEERE ons niet uit Egypte opgevoerd? Maar nu heeft de HEERE ons verlaten, en heeft ons in de hand van de Midianieten gegeven.", "Ps 106:23": "Daarom zei Hij dat Hij hen zou verdelgen, ware het niet dat Mozes, Zijn uitverkorene, in de scheur voor Zijn aangezicht gestaan had, om Zijn grimmigheid af te keren, zodat Hij hen niet verdierf.", "Jes 6:5": "Toen zei ik: Wee mij, want ik ga ten onder! Omdat ik een man van onreine lippen ben, en ik woon te midden van een volk dat onrein van lippen is; want mijn ogen hebben de Koning, de HEERE van de heerscharen, gezien.", "Job 8:5": "Maar als u God vroeg zoekt, en tot de Almachtige om genade bidt;", "Ps 126:1": "Een lied Hammaäloth. Toen de HEERE de gevangenen van Sion terugbracht, waren wij als mensen die dromen.", "Job 40:5": "Versier u nu met voortreffelijkheid en hoogheid, en bekleed u met majesteit en heerlijkheid!", "Jer 17:10": "Ik, de HEERE, doorgrond het hart, en proef de nieren; en dat, om ieder te geven naar zijn wegen, naar de vrucht van zijn handelingen.", "Job 40:4": "Hebt u een arm gelijk God? En kunt u, gelijk Hij, met de stem donderen?", "Luk 21:25": "En er zullen tekenen zijn in de zon, en maan, en sterren, en op de aarde benauwdheid van de volken met radeloosheid, wanneer de zee en de watergolven groot geluid zullen geven;", "Job 35:16": "zo heeft Job in ijdelheid zijn mond geopend, en zonder kennis woorden vermenigvuldigd.", "Joh 15:25": "Maar dit gebeurt, zodat het woord vervuld wordt dat in hun wet geschreven is: Zij hebben Mij zonder oorzaak gehaat.", "Luk 21:26": "En de mensen zal het hart bezwijken van vrees en verwachting van de dingen die het aardrijk zullen overkomen; want de krachten van de hemelen zullen bewogen worden.", "Gen 1:7": "En God maakte dat uitspansel, en maakte scheiding tussen de wateren die onder het uitspansel zijn, en de wateren die boven het uitspansel zijn. En het was zo.", "Job 1:1": "Er was een man in het land Uz, zijn naam was Job; en die man was oprecht en vroom, en godvrezend, en week af van het kwaad.", "Matt 12:36": "Maar Ik zeg u, dat van elk nutteloos woord dat de mensen zullen hebben gesproken, zij daarvan rekenschap zullen geven op de dag van het oordeel.", "Ps 119:120": "Het haar van mijn vlees is te berge gerezen van verschrikking voor U, en ik heb gevreesd voor Uw oordelen.", "Jes 64:6": "Doch wij allen zijn als een onreine, en al onze gerechtigheden zijn als een wegwerpkleed; en wij allen vallen af als een blad, en onze misdaden voeren ons weg als een wind.", "Job 16:14": "Hij heeft mij gebroken met breuk op breuk; Hij is tegen mij aangelopen als een geweldige.", "Matt 12:37": "Want uit uw woorden zult u gerechtvaardigd worden, en uit uw woorden zult u veroordeeld worden.", "Joh 9:3": "Jezus antwoordde: Deze man heeft niet gezondigd, en zijn ouders ook niet, maar dit is gebeurd, opdat de werken van God in hem openbaar zouden worden.", "Klaagl 3:3": "Aleph. Hij heeft Zich zeker tegen mij gewend, Hij heeft Zijn hand de hele dag veranderd.", "Job 37:18": "Hebt u met Hem de hemelen uitgespannen, die vast zijn, als een gegoten spiegel?", "Job 6:10": "Dat zou nog mijn troost zijn, en zou mij verkwikken in de weedom, zo Hij niet spaarde; want ik heb de redenen van de Heilige niet verborgen gehouden.", "Dan 4:17": "Deze zaak is bij besluit van de wachters, en dit verlangen is bij het woord van de heiligen; opdat de levenden weten dat de Allerhoogste heerschappij heeft over de koninkrijken van de mensen, en ze geeft aan wie Hij wil, ja, zelfs de laagste onder de mensen daarover aanstelt.", "Job 14:3": "Toch houdt U Uw ogen op zo iemand gericht, en U betrekt mij in het gericht met U.", "Job 38:31": "Kunt u de liefelijkheden van het Zevengesternte binden, of de strengen van de Orion losmaken?", "Jer 14:4": "Omdat het aardrijk gescheurd is, doordat er geen regen op de aarde is; de akkerlieden zijn beschaamd, zij bedekken hun hoofd.", "1 Kon 8:46": "Wanneer zij tegen U gezondigd zullen hebben (want er is geen mens die niet zondigt), en U tegen hen vertoornd zult zijn, en hen leveren zult voor het aangezicht van de vijand, zodat hun overwinnaars hen gevankelijk wegvoeren naar het land van de vijand, veraf of nabij;", "Hebr 12:26": "Wiens stem toen de aarde deed beven; maar nu heeft Hij verkondigd en gezegd: Nog eenmaal zal Ik niet alleen de aarde doen beven, maar ook de hemel.", "Num 1:6": "Van Simeon, Selumiël, de zoon van Zurisaddai.", "1 Joh 2:2": "En Hij is een verzoening voor onze zonden; en niet alleen voor de onze, maar ook voor de zonden van de hele wereld.", "Jes 31:3": "Want de Egyptenaren zijn mensen, en geen God, en hun paarden zijn vlees, en geen geest; en de HEERE zal Zijn hand uitstrekken, zodat de helper struikelen zal, en die geholpen wordt, zal neervallen, en zij zullen allemaal samen te niet komen.", "Ef 1:8": "Waarmee Hij overvloedig is geweest over ons in alle wijsheid en voorzichtigheid;", "Joz 10:12": "Toen sprak Jozua tot de HEERE, op de dag toen de HEERE de Amorieten voor het aangezicht van de kinderen van Israël overgaf, en hij zei voor de ogen van de Israëlieten: Zon, sta stil te Gibeon, en u, maan, in het dal van Ajalon!", "Ps 90:11": "Wie kent de sterkte van de toorn van U, en Uw verbolgenheid, naarmate U te vrezen bent?", "Dan 4:2": "Het behaagt mij te verkondigen de tekenen en wonderen, die de allerhoogste God aan mij gedaan heeft.", "2 Sam 19:4": "De koning nu had zijn gezicht bedekt, en de koning riep met luide stem: Mijn zoon Absalom, Absalom, mijn zoon, mijn zoon!", "Ps 104:13": "Hij drenkt de bergen uit Zijn opperzalen; de aarde wordt verzadigd van de vrucht van Uw werken.", "Klaagl 3:19": "Zain. Denk aan mijn ellende en aan mijn ballingschap, aan de alsem en gal.", "Ps 77:20": "Uw weg was in de zee, en Uw pad in het grote water, en Uw voetstappen werden niet bekend.", "Jes 2:19": "Dan zullen zij in de spelonken van de rotsstenen gaan, en in de holen van de aarde, vanwege de schrik van de HEERE, en vanwege de heerlijkheid van Zijn majesteit, wanneer Hij Zich zal opmaken, om de aarde te verschrikken.", "Klaagl 3:15": "He. Hij heeft mij met bitterheden verzadigd, Hij heeft mij met alsem dronken gemaakt.", "Jer 17:9": "Arglistig is het hart, meer dan enig ding, ja, dodelijk is het; wie zal het kennen?", "Zach 14:5": "Dan zult u vluchten door de vallei van Mijn bergen (want deze vallei van de bergen zal reiken tot Azal), en u zult vluchten, zoals u vluchtte voor de aardbeving in de dagen van Uzzia, de koning van Juda; dan zal de HEERE, mijn God, komen, en al de heiligen met U, o Heere!", "Job 16:17": "Terwijl er toch geen onrecht in mijn handen is, en mijn gebed zuiver is.", "Job 7:6": "Mijn dagen zijn lichter geweest dan een weversspoel, en zijn vergaan zonder verwachting.", "Ex 14:17": "En Ik, zie, Ik zal het hart van de Egyptenaren verstokken, zodat zij achter hen aan daarin gaan; en Ik zal verheerlijkt worden aan Farao en aan zijn hele leger, aan zijn wagens en aan zijn ruiters.", "Hagg 2:22": "Spreek tot Zerubbabel, de vorst van Juda: Ik zal de hemel en de aarde doen beven.", "1 Petr 2:23": "Die, toen Hij uitgescholden werd, niet terugschold, en toen Hij leed, niet dreigde; maar het overgaf aan Hem Die rechtvaardig oordeelt;", "Job 11:4": "Want u hebt gezegd: Mijn leer is zuiver, en ik ben rein in uw ogen.", "Job 33:9": "Ik ben rein, zonder overtreding; ik ben zuiver, en heb geen misdaad.", "Job 34:15": "Alle vlees zou tegelijk de geest geven, en de mens zou tot stof terugkeren.", "Job 2:7": "Toen ging de satan weg van het aangezicht van de HEERE, en sloeg Job met kwaadaardige zweren, van zijn voetzool af tot zijn schedel toe.", "Jer 18:6": "Zal Ik u niet kunnen doen, gelijk deze pottenbakker, o huis van Israël? spreekt de HEERE; zie, gelijk leem in de hand van de pottenbakker, zo bent u in Mijn hand, o huis van Israël!", "Hand 28:13": "Vandaar voeren wij verder en kwamen aan in Regium; en toen er na één dag zuidenwind opstak, kwamen wij de tweede dag in Puteoli;", "Job 15:6": "Uw mond verdoemt u, en niet ik; en uw lippen getuigen tegen u.", "Job 38:20": "Dat u dat brengen zou tot zijn grens, en dat u de paden van zijn huis merken zou?", "Job 23:13": "Maar is Hij tegen iemand, wie zal Hem dan afkeren? Wat Zijn ziel begeert, dat zal Hij doen.", "Jer 23:19": "Zie, een onweer van de HEERE, een grimmigheid is uitgegaan, ja, een pijnlijk onweer, het zal blijven op het hoofd van de goddelozen.", "Job 11:10": "Als Hij voorbijgaat, om af te snijden of te vergaderen, wie zal Hem dan tegenhouden?", "Ps 83:16": "vervolg hen zo met Uw onweer, en verschrik hen met Uw storm.", "Jes 24:1": "Zie, de HEERE maakt het land leeg, en Hij maakt het woest; en Hij keert de gestalte ervan om, en Hij verstrooit zijn inwoners.", "Openb 6:14": "En de hemel is weggeweken, als een boek, dat opgerold wordt; en alle bergen en eilanden zijn bewogen uit hun plaatsen.", "1 Sam 16:7": "Doch de HEERE zei tegen Samuël: Kijk niet naar zijn gestalte, en ook niet naar zijn lange lengte, want Ik heb hem verworpen; want het is niet zoals de mens ziet; want de mens kijkt naar wat voor ogen is, maar de HEERE kijkt naar het hart.", "Ps 62:12": "God heeft één ding gesproken, dit heb ik tweemaal gehoord: dat de sterkte van God is.", "Job 25:6": "Hoeveel te minder de mens, die een made is, en het mensenkind, die een worm is!", "Amos 4:13": "Want zie, Die de bergen vormt, en de wind schept, en de mens bekendmaakt wat Zijn gedachte is, Die de dageraad duisternis maakt, en op de hoogten van de aarde treedt, HEERE, God van de heerscharen, is Zijn Naam.", "Jak 4:14": "U weet niet wat morgen gebeuren zal, want hoe is uw leven? Het is immers een damp, die voor een korte tijd zichtbaar is, en daarna verdwijnt.", "Job 37:7": "Dan zegelt Hij de hand van ieder mens toe, opdat elk mens het werk van Hem kent.", "Gen 1:6": "En God zei: Laat er een uitspansel zijn in het midden van de wateren, en laat dat scheiding maken tussen wateren en wateren!", "Spr 28:26": "Wie op zijn eigen hart vertrouwt, die is een dwaas; maar wie in wijsheid wandelt, die zal ontkomen.", "Spr 10:19": "In de veelheid van woorden ontbreekt de overtreding niet; maar wie zijn lippen bedwingt, is verstandig.", "Num 1:5": "Dit zijn nu de namen van de mannen die bij u zullen staan: van Ruben, Elizur, de zoon van Sedeur.", "Job 33:13": "Waarom hebt u tegen Hem getwist? Want Hij antwoordt niet van al Zijn daden.", "Ps 89:48": "Gedenk wat voor eeuw ik ben; waarom zou Gij alle mensenkinderen tevergeefs geschapen hebben?", "Jak 3:2": "Want wij struikelen allen in veel dingen. Als iemand in woorden niet struikelt, die is een volmaakt man, in staat om ook het hele lichaam in toom te houden.", "Luk 24:41": "En toen zij het van blijdschap nog niet geloofden, en zich verwonderden, zei Hij tegen hen: Hebt u hier iets te eten?", "Job 31:23": "Want het verderf van God was bij mij een schrik, en ik vermocht niet vanwege Zijn hoogheid.", "Jes 2:21": "Gaande in de reten van de rotsen, en in de kloven van de steenrotsen, vanwege de schrik van de HEERE, en vanwege de heerlijkheid van Zijn majesteit, wanneer Hij Zich zal opmaken, om de aarde geweldig te verschrikken.", "Jes 57:15": "Want zo zegt de Hoge en Verhevene, Die in de eeuwigheid woont, en Wiens Naam heilig is: Ik woon in de hoogte en in het heilige, en bij hem die een verbrijzelde en nederige geest heeft, om de geest van de nederigen levend te maken, en om het hart van de verbrijzelden levend te maken.", "Job 23:9": "Als Hij ter linkerhand werkt, dan aanschouw ik Hem niet; verbergt Hij Zich ter rechterhand, dan zie ik Hem niet.", "Rom 9:20": "Maar toch, o mens, wie bent u, die tegen God antwoordt? Zal ook het maaksel tegen hem die het gemaakt heeft zeggen: Waarom hebt u mij zo gemaakt?", "Job 15:5": "Want uw mond leert uw ongerechtigheid, en u hebt de tong van de arglistigen gekozen.", "Dan 4:35": "En alle inwoners van de aarde worden als niets geacht, en Hij doet naar Zijn wil met het leger van de hemel en de inwoners van de aarde, en er is niemand die Zijn hand kan tegenhouden, of tegen Hem kan zeggen: Wat doet U?", "Ps 44:23": "Maar om Uwentwil worden wij de hele dag gedood; wij worden geacht als slachtschapen.", "1 Kor 1:25": "Want het dwaze van God is wijzer dan de mensen; en het zwakke van God is sterker dan de mensen.", "Job 10:15": "Ben ik goddeloos, wee mij! En ben ik rechtvaardig, ik zal mijn hoofd niet opheffen; ik ben verzadigd van schande, maar zie mijn ellende aan.", "Ps 88:8": "Uw grimmigheid ligt op mij; U hebt mij neergedrukt met al Uw baren. Sela.", "Job 38:11": "En zei: Tot hiertoe zult u komen, en niet verder, en hier zal hij zich stellen tegen de hoogmoed van uw golven.", "Ps 88:16": "Van jongs af aan ben ik bedrukt en aan het sterven; ik draag Uw verschrikkingen, ik ben radeloos.", "Joël 2:10": "De aarde is beroerd voor hun aangezicht, de hemel beeft; de zon en maan worden zwart, en de sterren trekken hun glans in.", "Ps 136:5": "Hem, Die de hemelen met verstand gemaakt heeft; want Zijn goedertierenheid is voor eeuwig.", "Ps 93:3": "De rivieren verheffen, o HEERE! de rivieren verheffen hun bruisen; de rivieren verheffen hun golfslag.", "Jes 13:14": "En ieder zal zijn als een verjaagde ree, en als een schaap dat niemand bijeenbrengt; ieder zal naar zijn volk omzien, en ieder zal naar zijn land vluchten.", "Ps 104:3": "Die Zijn opperzalen bouwt op de wateren, Die van de wolken Zijn wagen maakt, Die op de vleugels van de wind wandelt.", "Jes 30:7": "Want Egypte zal nutteloos en tevergeefs helpen; daarom heb Ik hierover geroepen: Stilzitten zal hun sterkte zijn.", "Jes 42:5": "Zo zegt God, de HEERE, Die de hemelen geschapen en ze uitgebreid heeft, Die de aarde uitgespannen heeft, en wat daaruit voortkomt; Die aan het volk dat daarop is, de adem geeft, en de geest aan hen die daarop wandelen:", "Judas 1:24": "Aan Hem nu, Die machtig is u voor struikelen te bewaren, en onstraffelijk te stellen voor Zijn heerlijkheid, in vreugde,", "Jer 4:13": "Zie, hij komt op als wolken, en zijn wagens zijn als een wervelwind, zijn paarden zijn sneller dan arenden; wee ons, want wij zijn verwoest!", "Dan 9:18": "Neig Uw oor, mijn God! en hoor, doe Uw ogen open, en zie onze verwoestingen, en de stad die naar Uw Naam genoemd is; want wij leggen onze smekingen niet voor Uw aangezicht neer om onze gerechtigheden, maar om Uw barmhartigheden, die groot zijn.", "Ps 72:18": "Geloofd zij de HEERE God, de God van Israël, Die alleen wonderen doet.", "Jes 13:10": "Want de sterren van de hemel en zijn sterrenbeelden zullen hun licht niet laten schijnen; de zon zal verduisterd worden wanneer zij opgaat, en de maan zal haar licht niet laten schijnen.", "Jes 24:20": "De aarde zal helemaal waggelen, zoals een dronkaard, en zij zal heen en weer bewogen worden, zoals een nachthut; en haar overtreding zal zwaar op haar zijn, en zij zal vallen, en niet meer opstaan.", "Job 34:29": "Als Hij stilt, wie zal dan beroeren? Als Hij het aangezicht verbergt, wie zal Hem dan aanschouwen, zowel voor een volk, als voor een mens alleen?", "Job 34:31": "Zeker heeft hij tot God gezegd: Ik heb Uw straf verdragen, ik zal het niet verderven.", "Jes 44:24": "Zo zegt de HEERE, uw Verlosser, en Die u geformeerd heeft van de buik af aan: Ik ben de HEERE, Die alles doet, Die de hemel uitbreidt, Ik alleen, en Die de aarde uitspant door Mijzelf;", "Zach 4:7": "Wie bent u, o grote berg? Voor het aangezicht van Zerubbabel zult u worden tot een vlak veld; want hij zal de hoofdsteen naar voren brengen onder toeroepingen: Genade, genade zij hem!", "1 Joh 1:8": "Als wij zeggen dat wij geen zonde hebben, dan verleiden wij ons zelf, en de waarheid is niet in ons.", "Ps 29:5": "De stem van de HEERE breekt de ceders; ja, de HEERE verbreekt de ceders van Libanon.", "Spr 17:20": "Wie verdraaid is van hart, zal het goede niet vinden; en die verkeerd is met zijn tong, zal in het kwaad vallen.", "Ps 93:4": "Maar de HEERE in de hoogte is machtiger dan het bruisen van veel water, dan de machtige golven van de zee.", "Job 29:24": "Lachte ik hun toe, zij geloofden het niet; en het licht van mijn aangezicht deden zij niet neervallen.", "Ps 90:10": "Aangaande de dagen van onze jaren, daarin zijn zeventig jaren, of, als wij zeer sterk zijn, tachtig jaren; en het voortreffelijkste van die is moeite en verdriet; want het wordt snel afgesneden, en wij vliegen daarheen.", "Joh 6:19": "Toen zij dan ongeveer vijfentwintig of dertig stadiën gevaren hadden, zagen zij Jezus lopen op de zee en dicht bij het schip komen; en zij werden bang.", "Est 6:12": "Daarna keerde Mordechai terug naar de poort van de koning; maar Haman ging haastig naar zijn huis, treurig en met bedekt hoofd.", "2 Sam 15:30": "En David ging op door de opgang van de olijven, terwijl hij opging en weende, en zijn hoofd was bedekt; en hij zelf ging blootsvoets; ook had heel het volk dat bij hem was, ieder zijn hoofd bedekt, en zij gingen op, terwijl zij opgingen en weenden.", "Dan 2:20": "Daniël antwoordde en zei: De Naam van God zij geloofd van eeuwigheid tot in eeuwigheid, want van Hem is de wijsheid en de kracht.", "2 Sam 14:17": "Verder zei uw dienares: Het woord van mijn heer de koning zij toch tot rust; want zoals een Engel van God, zo is mijn heer de koning, om het goede en het kwade te onderscheiden; en de HEERE, uw God, zal met u zijn.", "Job 10:2": "Ik zal tegen God zeggen: Verdoem mij niet; laat mij weten, waarom U met mij twist.", "Ps 17:14": "Met Uw hand van de mensen, o HEERE! Van de mensen, die van de wereld zijn, wier deel in dit leven is, wier buik U vult met Uw verborgen schat; de kinderen worden verzadigd, en zij laten hun overschot achter aan hun kinderen.", "Ps 33:6": "Door het Woord van de HEERE zijn de hemelen gemaakt, en door de Geest van Zijn mond heel hun leger.", "Fil 3:9": "En in Hem gevonden word, niet met mijn eigen rechtvaardigheid, die uit de wet is, maar met de rechtvaardigheid die door het geloof van Christus is, namelijk de rechtvaardigheid die uit God is door het geloof;", "Job 2:3": "En de HEERE zei tegen de satan: Hebt u ook acht geslagen op Mijn knecht Job? Want niemand is op de aarde zoals hij, een man, oprecht en vroom, godvrezend en wijkend van het kwaad; en hij houdt nog steeds vast aan zijn oprechtheid, hoewel u Mij tegen hem hebt opgehitst, om hem zonder reden te verslinden.", "Job 21:6": "Ja, wanneer ik daaraan denk, word ik verschrikt, en huivering grijpt mijn lichaam aan.", "Job 33:12": "Zie, hierin bent u niet rechtvaardig, antwoord ik u; want God is meerder dan een mens.", "Ps 42:8": "De afgrond roept tot de afgrond, bij het gedruis van uw watergoten; al uw baren en uw golven zijn over mij heen gegaan.", "Ezech 13:13": "Daarom zegt de Heere HEERE zo: Ja, Ik zal hem door een grote stormwind in Mijn grimmigheid splijten, en er zal een overstelpende plasregen zijn in Mijn toorn, en grote hagelstenen in Mijn grimmigheid, om hem te verdoen.", "Job 7:15": "Zodat mijn ziel de verworging kiest; de dood meer dan mijn beenderen.", "Dan 9:3": "En ik richtte mijn gezicht tot God, de HEERE, om Hem te zoeken met gebed en smekingen, met vasten, en een zak, en as.", "1 Kon 8:38": "elk gebed, elke smeking, die door enig mens, door al Uw volk Israël gebeuren zal; wanneer zij erkennen, ieder de plaag van zijn eigen hart, en ieder zijn handen in dit huis uitbreiden zal;", "Ps 116:1": "Ik heb Hem lief, want de HEERE hoort mijn stem, mijn smekingen;", "Job 14:16": "Maar nu telt U mijn stappen; U let toch wel op vanwege mijn zonden?", "Pred 6:10": "Wat iemand ook is, allang is zijn naam genoemd, en het is bekend dat hij een mens is; en dat hij niet kan rechten met wie sterker is dan hij.", "1 Kor 10:22": "Of willen wij de Heere tot jaloersheid tergen? Zijn wij soms sterker dan Hij?", "Klaagl 4:19": "Koph. Onze vervolgers waren sneller dan de arenden van de hemel; zij hebben ons op de bergen fel vervolgd, in de woestijn hebben zij ons een hinderlaag gelegd.", "Matt 12:20": "Het geknakte riet zal Hij niet breken, en de walmende vlaspit zal Hij niet uitblussen, totdat Hij het oordeel tot overwinning zal uitbrengen.", "Jes 31:2": "Toch is Hij ook wijs, en Hij doet het kwaad komen, en trekt Zijn woorden niet terug; maar Hij zal Zich opmaken tegen het huis van de boosdoeners, en tegen de hulp van hen die ongerechtigheid werken.", "Luk 16:15": "En Hij zei tegen hen: U bent het die uzelf rechtvaardigt voor de mensen; maar God kent uw harten; want wat hoog is onder de mensen, is een gruwel voor God.", "Ps 75:4": "Het land en al zijn inwoners waren versmolten; maar ik heb zijn pilaren vastgemaakt. Sela.", "2 Sam 1:23": "Saul en Jonathan, die geliefd waren, en die liefelijke mensen in hun leven, zijn ook in hun dood niet gescheiden; zij wa "L2\" data-code=\"H3808\">niet</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H3808\">bij</span> mijzelf."}, "koppeling_kjv": {"1": "Then <span class=\"wl wl-kjv\" data-code=\"H347\">Job</span> <span class=\"wl wl-kjv\" data-code=\"H6030\">answered</span> and said,", "2": "I <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> it is so of a <span class=\"wl wl-kjv\" data-code=\"H551\">truth:</span> but how should <span class=\"wl wl-kjv\" data-code=\"H582\">man</span> be <span class=\"wl wl-kjv\" data-code=\"H6663\">just</span> with God?", "3": "If he <span class=\"wl wl-kjv\" data-code=\"H2654\">will</span> <span class=\"wl wl-kjv\" data-code=\"H7378\">contend</span> with him, he cannot <span class=\"wl wl-kjv\" data-code=\"H6030\">answer</span> him <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> of a thousand.", "4": "He is <span class=\"wl wl-kjv\" data-code=\"H2450\">wise</span> in <span class=\"wl wl-kjv\" data-code=\"H3824\">heart,</span> and <span class=\"wl wl-kjv\" data-code=\"H533\">mighty</span> in <span class=\"wl wl-kjv\" data-code=\"H3581\">strength:</span> who hath <span class=\"wl wl-kjv\" data-code=\"H7185\">hardened</span> himself against him, and hath prospered?", "5": "Which <span class=\"wl wl-kjv\" data-code=\"H6275\">removeth</span> the <span class=\"wl wl-kjv\" data-code=\"H2022\">mountains,</span> and they <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> not: which <span class=\"wl wl-kjv\" data-code=\"H2015\">overturneth</span> them in his anger.", "6": "Which <span class=\"wl wl-kjv\" data-code=\"H7264\">shaketh</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> out of her <span class=\"wl wl-kjv\" data-code=\"H4725\">place,</span> and the <span class=\"wl wl-kjv\" data-code=\"H5982\">pillars</span> thereof tremble.", "7": "Which <span class=\"wl wl-kjv\" data-code=\"H559\">commandeth</span> the <span class=\"wl wl-kjv\" data-code=\"H2775\">sun,</span> and it <span class=\"wl wl-kjv\" data-code=\"H2224\">riseth</span> not; and sealeth <span class=\"wl wl-kjv\" data-code=\"H2856\">up</span> the stars.", "8": "Which alone spreadeth <span class=\"wl wl-kjv\" data-code=\"H5186\">out</span> the <span class=\"wl wl-kjv\" data-code=\"H8064\">heavens,</span> and <span class=\"wl wl-kjv\" data-code=\"H1869\">treadeth</span> upon the <span class=\"wl wl-kjv\" data-code=\"H1116\">waves</span> of the sea.", "9": "Which <span class=\"wl wl-kjv\" data-code=\"H6213\">maketh</span> <span class=\"wl wl-kjv\" data-code=\"H5906\">Arcturus,</span> <span class=\"wl wl-kjv\" data-code=\"H3685\">Orion,</span> and <span class=\"wl wl-kjv\" data-code=\"H3598\">Pleiades,</span> and the <span class=\"wl wl-kjv\" data-code=\"H2315\">chambers</span> of the south.", "10": "Which <span class=\"wl wl-kjv\" data-code=\"H6213\">doeth</span> great <span class=\"wl wl-kjv\" data-code=\"H1419\">things</span> <span class=\"wl wl-kjv\" data-code=\"H369\">past</span> finding <span class=\"wl wl-kjv\" data-code=\"H2714\">out;</span> yea, and <span class=\"wl wl-kjv\" data-code=\"H6381\">wonders</span> without number.", "11": "Lo, he <span class=\"wl wl-kjv\" data-code=\"H5674\">goeth</span> by me, and I <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> him not: he passeth <span class=\"wl wl-kjv\" data-code=\"H2498\">on</span> also, but I perceive", "12": "Behold, he taketh <span class=\"wl wl-kjv\" data-code=\"H2862\">away,</span> who can <span class=\"wl wl-kjv\" data-code=\"H7725\">hinder</span> him? who will <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> unto him, What doest", "13": "If <span class=\"wl wl-kjv\" data-code=\"H433\">God</span> will not <span class=\"wl wl-kjv\" data-code=\"H7725\">withdraw</span> his <span class=\"wl wl-kjv\" data-code=\"H639\">anger,</span> the <span class=\"wl wl-kjv\" data-code=\"H7293\">proud</span> <span class=\"wl wl-kjv\" data-code=\"H5826\">helpers</span> do stoop", "14": "How much less shall I <span class=\"wl wl-kjv\" data-code=\"H6030\">answer</span> him, and choose <span class=\"wl wl-kjv\" data-code=\"H977\">out</span> my words", "15": "Whom, though I were <span class=\"wl wl-kjv\" data-code=\"H6663\">righteous,</span> yet would I not <span class=\"wl wl-kjv\" data-code=\"H6030\">answer,</span> but I would make <span class=\"wl wl-kjv\" data-code=\"H2603\">supplication</span> to my judge.", "16": "If I had <span class=\"wl wl-kjv\" data-code=\"H7121\">called,</span> and he had <span class=\"wl wl-kjv\" data-code=\"H6030\">answered</span> me; yet would I not <span class=\"wl wl-kjv\" data-code=\"H539\">believe</span> that he had <span class=\"wl wl-kjv\" data-code=\"H238\">hearkened</span> unto my voice.", "17": "For he <span class=\"wl wl-kjv\" data-code=\"H7779\">breaketh</span> me with a <span class=\"wl wl-kjv\" data-code=\"H8183\">tempest,</span> and <span class=\"wl wl-kjv\" data-code=\"H7235\">multiplieth</span> my <span class=\"wl wl-kjv\" data-code=\"H6482\">wounds</span> without cause.", "18": "He will not <span class=\"wl wl-kjv\" data-code=\"H5414\">suffer</span> me to <span class=\"wl wl-kjv\" data-code=\"H7725\">take</span> my <span class=\"wl wl-kjv\" data-code=\"H7307\">breath,</span> but <span class=\"wl wl-kjv\" data-code=\"H7646\">filleth</span> me with bitterness.", "19": "If I speak of <span class=\"wl wl-kjv\" data-code=\"H3581\">strength,</span> lo, he is <span class=\"wl wl-kjv\" data-code=\"H533\">strong:</span> and if of <span class=\"wl wl-kjv\" data-code=\"H4941\">judgment,</span> who shall set", "20": "If I <span class=\"wl wl-kjv\" data-code=\"H6663\">justify</span> myself, mine own <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth</span> shall <span class=\"wl wl-kjv\" data-code=\"H7561\">condemn</span> me: if I say, I am <span class=\"wl wl-kjv\" data-code=\"H8535\">perfect,</span> it shall also prove me perverse.", "21": "Though I were <span class=\"wl wl-kjv\" data-code=\"H8535\">perfect,</span> yet would I not <span class=\"wl wl-kjv\" data-code=\"H3045\">kn ode=\"H3027\">hand</span> upon us both.", "34": "Let him <span class=\"wl wl-kjv\" data-code=\"H5493\">take</span> his <span class=\"wl wl-kjv\" data-code=\"H7626\">rod</span> <span class=\"wl wl-kjv\" data-code=\"H5493\">away</span> from me, and let not his <span class=\"wl wl-kjv\" data-code=\"H367\">fear</span> terrify", "35": "Then would I <span class=\"wl wl-kjv\" data-code=\"H1696\">speak,</span> and not fear"}};
const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"
const ZELF = D.meta.zelf_abbr;      // afkorting binnen dit hoofdstuk, bv. "Joh 3"

const PARALLEL_VOLGORDE = ['Berea', 'SV', 'KJV'];
let vertaling = 'Berea';

const bijbel = document.getElementById('bijbel');
const popup = document.getElementById('popup');

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden"><select id="boekkies">${boekOpties}</select> ` +
    `<select id="hfdkies">${hfdOpties}</select></span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.Berea[n] || '—');
}

/* ---------- vertaling-keuze (dropdown) + studie-dropdown ---------- */
(function bouwVertaalkies() {
  const sel = document.getElementById('vertaalkies');
  sel.innerHTML = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  sel.onchange = e => { vertaling = e.target.value; bouwRijen(); };
})();
document.getElementById('studiekies').onchange = e => { if (e.target.value) location.href = e.target.value; };

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.Berea[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (Berea)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function paneelInhoud(n, tab) {
  if (tab === 'grondwoorden') {
    const heeftB = D.koppeling && D.koppeling[n];
    const heeftK = D.koppeling_kjv && D.koppeling_kjv[n];
    if (!heeftB && !heeftK) return '<em>Nog geen woordkoppeling voor dit vers.</em>';
    let h = '';
    if (heeftB) h += `<div class="tsk-kop">Berea</div>` +
      `<div class="gw-tekst" style="font-family:Georgia,serif;line-height:1.8">${D.koppeling[n]}</div>` +
      `<div class="gw-detail" style="margin-top:.5rem"></div>`;
    if (heeftK) h += `<div class="tsk-kop" style="margin-top:.9rem">KJV</div>` +
      `<div class="gw-tekst" style="font-family:Georgia,serif;line-height:1.8">${D.koppeling_kjv[n]}</div>` +
      `<div class="gw-detail" style="margin-top:.5rem"></div>`;
    return h + '<div class="bronregel">Klik op een onderstreept woord voor de vindplaatsen.</div>';
  }
  if (tab === 'vertalingen') {
    return PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
  }
  if (tab === 'verwijzingen') {
    const berea = D.tsk[n], engels = D.tsk_kjv[n];
    if ((!berea || !berea.length) && (!engels || !engels.length)) return '<em>Geen verwijzingen bij dit vers.</em>';
    let h = '';
    if (berea && berea.length) {
      h += '<div class="tsk-kop">Treasury of Scripture Knowledge | Berea</div>';
      h += berea.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r}">${r}</a>`).join('') + '</div>').join('');
    }
    if (engels && engels.length) {
      h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.subs && it.subs.length ? `<ul class="ond-subs">${it.subs.map(s=>`<li>${s}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.tsk[n] && D.tsk[n].length), heeftO = !!D.onderwerpen[n];
  const heeftG = !!((D.koppeling && D.koppeling[n]) || (D.koppeling_kjv && D.koppeling_kjv[n]));
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : (heeftG ? 'grondwoorden' : 'vertalingen'));
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'grondwoorden' ? 'actief' : ''} ${heeftG ? '' : 'leeg'}" data-tab="grondwoorden" data-n="${n}">Grondwoorden</div>
    <div class="ntab" data-tab="vertalingen" data-n="${n}">Vertalingen</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.Berea[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · Berea</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}
</script>
</body>
