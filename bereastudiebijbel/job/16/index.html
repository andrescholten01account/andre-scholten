jn gezicht is helemaal bemodderd van het wenen, en op mijn oogleden ligt de schaduw van de dood.", "17": "Terwijl er toch geen onrecht in mijn handen is, en mijn gebed zuiver is.", "18": "O aarde, bedek mijn bloed niet; en laat er voor mijn geroep geen plaats zijn.", "19": "Ook nu, zie, in de hemel is mijn Getuige, en mijn Getuige in de hoogten.", "20": "Mijn vrienden bespotten mij; maar mijn oog druipt tot God.", "21": "Och, mocht men rechtspreken voor een man bij God, zoals een kind van een mens voor zijn vriend.", "22": "Want er zullen nog maar weinige jaren in aantal aankomen, en ik zal het pad heengaan waardoor ik niet zal terugkeren."}, "SV": {"1": "Maar Job antwoordde en zeide:", "2": "Ik heb vele dergelijke dingen gehoord; gij allen zijt moeilijke vertroosters.", "3": "Zal er een einde zijn aan de winderige woorden? Of wat stijft u, dat gij *alzo* antwoordt?", "4": "Zou ik ook, als gijlieden, spreken, indien uw ziel ware in mijner ziele plaats? Zou ik woorden tegen u samenhopen, en zou ik over u met mijn hoofd schudden?", "5": "Ik zou u versterken met mijn mond, en de beweging mijner lippen zou zich inhouden.", "6": "Zo ik spreek, mijn smart wordt niet ingehouden; en houd ik op, wat gaat er van mij weg?", "7": "Gewisselijk, Hij heeft mij nu vermoeid; Gij hebt mijn ganse vergadering verwoest.", "8": "Dat Gij mij rimpelachtig gemaakt hebt, is tot een getuige; en mijn magerheid staat tegen mij op, zij getuigt in mijn aangezicht.", "9": "Zijn toorn verscheurt, en Hij haat mij; Hij knerst over mij met Zijn tanden; mijn wederpartijder scherpt zijn ogen tegen mij.", "10": "Zij gapen met hun mond tegen mij; zij slaan met smaadheid op mijn kinnebakken; zij vervullen zich te zamen aan mij.", "11": "God heeft mij den verkeerde overgegeven, en heeft mij afgewend in de handen der goddelozen.", "12": "Ik had rust, maar Hij heeft mij verbroken, en bij mijn nek gegrepen, en mij verpletterd; en Hij heeft mij Zich tot een doelwit opgericht.", "13": "Zijn schutters hebben mij an; ik zal nu al zoetjes voortgaan al mijn jaren, vanwege de bitterheid van mijn ziel. Heere, door deze dingen leeft men, en in dit alles is het leven van mijn geest; want Gij hebt mij gezond gemaakt en mij genezen.", "Ps 80:2": "O Herder van Israël! Neem het ter oor, U Die Jozef als schapen leidde; U Die tussen de cherubs zit, verschijn blinkend.", "Neh 9:32": "Nu dan, o onze God, U grote, U machtige, en U ontzagwekkende God, Die het verbond en de weldadigheid houdt; laat voor Uw aangezicht niet gering zijn al de moeite, die ons getroffen heeft, onze koningen, onze vorsten, en onze priesters; en onze profeten, en onze vaderen, en Uw hele volk, vanaf de dagen van de koningen van Assur tot op deze dag.", "Amos 5:11": "Daarom, omdat u de arme vertreedt en een last koren van hem neemt, hebt u wel huizen gebouwd van gehouwen steen, maar u zult daarin niet wonen; u hebt heerlijke wijngaarden geplant, maar u zult de wijn daarvan niet drinken.", "Ps 1:6": "Want de HEERE kent de weg van de rechtvaardigen; maar de weg van de goddelozen zal vergaan.", "Lev 19:15": "U zult geen onrecht doen in het gericht; u zult het aangezicht van de geringe niet aannemen, noch het aangezicht van de grote voortrekken; in gerechtigheid zult u uw naaste rechtspreken.", "Ps 62:2": "Zeker, mijn ziel is stil bij God; van Hem is mijn heil.", "Ps 116:7": "Mijn ziel, keer terug tot uw rust, want de HEERE heeft u goedgedaan.", "Rom 11:19-21": "U zult dan zeggen: De takken zijn afgebroken, opdat ik ingeënt zou worden. Het is wel; zij zijn door ongeloof afgebroken, en u staat door het geloof. Wees niet hoogmoedig, maar vrees. Want als God de natuurlijke takken niet gespaard heeft, zie toe, dat Hij ook mogelijk u niet spaart.", "Num 14:8": "Als de HEERE een welgevallen aan ons heeft, zal Hij ons in dat land brengen, en zal het ons geven; een land dat overvloeit van melk en honing.", "Ps 119:121-123": "Ain. Ik heb recht en gerechtigheid gedaan; geef mij niet over aan mijn onderdrukkers. Wees borg voor Uw knecht ten goede; laat de hoogmoedigen mij niet onderdrukken. Mijn ogen zijn bezweken van verlangen naar Uw heil, en naar de toezegging van Uw rechtvaardigheid.", "Zach 8:16": "Dit zijn de dingen die u doen zult: spreek de waarheid, ieder met zijn naaste; oordeel de waarheid en een oordeel van vrede in uw poorten.", "Pred 12:9-11": "En verder, omdat de prediker wijs geweest is, leerde hij het volk nog kennis, en lette hij op, en onderzocht hij; hij bracht veel spreuken in orde. De prediker zocht aangename woorden te vinden, en wat er geschreven is, is recht: woorden van de waarheid. De woorden van de wijzen zijn als prikkels, en als spijkers, diep ingeslagen door de meesters van de verzamelingen, die gegeven zijn door de ene Herder.", "Ex 18:21": "Doch zoek u onder al het volk uit naar bekwame mannen, die God vrezen, betrouwbare mannen, die hebzucht haten; stel hen aan over hen als leiders over duizend, leiders over honderd, leiders over vijftig, en leiders over tien.", "2 Tim 1:14": "Bewaar het goede pand, dat u toevertrouwd is, door de Heilige Geest, Die in ons woont.", "Ps 77:13": "En ik zal al Uw werken overdenken, en van Uw daden spreken.", "Ps 119:74": "Die U vrezen, zullen mij aanzien, en zich verblijden, omdat ik op Uw woord gehoopt heb.", "Job 6:6": "Wordt ook het onsmakelijke gegeten zonder zout? Is er smaak in het wit van de dooier?", "Ef 5:4": "ook geen oneerbaarheid, geen zot geklap of grappenmakerij, wat niet betaamt; maar veelmeer dankzegging.", "Jes 38:3": "En hij zei: Och HEERE, denk er toch aan dat ik voor Uw gezicht in waarheid en met een volkomen hart gewandeld heb, en dat ik gedaan heb wat goed is in Uw ogen. En Hizkia huilde erg hard.", "Matt 28:19": "Ga dan heen, onderwijs alle volken, en doop hen in de Naam van de Vader, en van de Zoon, en van de Heilige Geest;", "Ps 56:12": "Ik vertrouw op God, ik zal niet vrezen; wat zou de mens mij doen?", "Spr 10:19-21": "In de veelheid van woorden ontbreekt de overtreding niet; maar wie zijn lippen bedwingt, is verstandig. De tong van de rechtvaardige is uitgelezen zilver; het hart van de goddelozen is weinig waard. De lippen van de rechtvaardige voeden er velen; maar de dwazen sterven door gebrek aan verstand.", "Jer 32:16-25": "Vervolgens, nadat ik de koopbrief aan Baruch, de zoon van Nerija, gegeven had, bad ik tot de HEERE: Ach, Heere HEERE! Zie, U hebt de hemel en de aarde gemaakt, door Uw grote kracht en door Uw uitgestrekte arm; niets is voor U te wonderlijk. U, Die goedertierenheid bewijst aan duizenden, en de ongerechtigheid van de vaders vergeldt in de schoot van hun kinderen na hen; U grote, U geweldige God, Wiens Naam is HEERE van de heerscharen!", "Ps 144:10": "U, Die de koningen overwinning geeft, Die Zijn dienaar David bevrijdt van het boze zwaard;", "Ps 54:3-5": "O God! Verlos mij door Uw Naam, en doe mij recht door Uw macht. O God! Hoor mijn gebed; neig Uw oren tot de woorden van mijn mond. Want vreemden staan tegen mij op, en tirannen zoeken mijn ziel; zij stellen God niet voor hun ogen. Sela.", "Ps 71:1": "Op U, o HEERE! vertrouw ik; laat mij niet beschaamd worden in eeuwigheid.", "Neh 4:9": "Maar wij baden tot onze God, en zetten wacht tegen hen, dag en nacht, vanwege hen.", "Jer 17:5": "Zo zegt de HEERE: Vervloekt is de man die op een mens vertrouwt, en vlees tot zijn arm stelt, en wiens hart van de HEERE afwijkt!", "Job 26:2": "Hoe hebt u hem geholpen die geen kracht heeft, en de arm gered die geen sterkte heeft?", "Job 11:16-19": "Want u zult de moeite vergeten, en er aan denken als aan water dat voorbijgegaan is. Ja, uw levenstijd zal helderder dan de middag oprijzen; u zult stralen, als de morgenstond zult u zijn. En u zult vertrouwen, omdat er verwachting zal zijn; en u zult graven, gerust zult u slapen;", "2 Sam 23:5": "Hoewel mijn huis zo niet is bij God, heeft Hij mij toch een eeuwig verbond gesteld, dat in alles goed geordend en bewaard is; zeker is daarin al mijn heil, en alle lust, hoewel Hij het nog niet laat uitspruiten.", "Mark 4:21": "En Hij zei tegen hen: Wordt de lamp soms binnengebracht om onder de korenmaat of onder het bed gezet te worden? Is het niet om op de standaard gezet te worden?", "Jes 49:13": "Juicht, hemelen! En verheug u, aarde! En bergen! Maakt gedreun met gejuich; want de HEERE heeft Zijn volk vertroost, en Hij zal Zich over Zijn ellendigen ontfermen.", "Ezech 8:12": "Toen zei Hij tegen mij: Hebt u gezien, mensenkind, wat de oudsten van het huis van Israël doen in de duisternis, ieder in zijn kamer vol afbeeldingen? Want zij zeggen: De HEERE ziet ons niet, de HEERE heeft het land verlaten.", "Ps 27:5": "Want Hij verbergt mij in Zijn hut, op de dag van het kwaad; Hij verbergt mij in het verborgene van Zijn tent; Hij verhoogt mij op een rotssteen.", "1 Kon 15:14": "De hoogten werden wel niet weggenomen; toch was het hart van Asa volkomen met de HEERE, al zijn dagen.", "Ps 25:16-19": "Pe. Wend U tot mij, en wees mij genadig, want ik ben eenzaam en ellendig. Tsade. De benauwdheden van mijn hart hebben zich wijd uitgestrekt; voer mij uit mijn noden. Resch. Zie mijn ellende, en mijn moeite, en neem al mijn zonden weg.", "Ps 7:11": "Mijn schild is bij God, Die de oprechten van hart behoudt.", "Joh 15:26": "Maar wanneer de Trooster gekomen zal zijn, Die Ik u zenden zal van de Vader, namelijk de Geest van de waarheid, Die van de Vader uitgaat, Die zal van Mij getuigen.", "1 Tess 4:7": "Want God heeft ons niet geroepen tot onreinheid, maar tot heiliging.", "Jer 18:16": "Om hun land te maken tot een verschrikking, tot eeuwige aanfluitingen; ieder die daar voorbijgaat, zal ontzet zijn, en met zijn hoofd schudden.", "Hos 12:6": "Namelijk, de Heere, de God van de heerscharen; Heere is Zijn gedenknaam.", "Job 15:25": "Want hij strekt tegen God zijn hand uit, en tegen de Almachtige stelt hij zich geweldig aan.", "Ps 120:2": "O HEERE! Red mijn ziel van de valse lippen, van de bedrieglijke tong.", "Ps 44:9": "In God roemen wij de hele dag, en Uw Naam zullen wij loven tot in eeuwigheid. Sela.", "Ps 118:7": "De HEERE is bij mij onder degenen die mij helpen; daarom zal ik mijn lust zien aan degenen die mij haten.", "Ps 57:2-4": "Wees mij genadig, o God! Wees mij genadig, want mijn ziel vertrouwt op U, en ik neem mijn toevlucht onder de schaduw van Uw vleugels, totdat de verdervingen voorbij zijn gegaan. Ik zal roepen tot God, de Allerhoogste, tot God, Die het voor mij zal voltooien. Hij zal vanuit de hemel zenden, en mij verlossen, en te schande maken hem die mij zoekt te verslinden. Sela. God zal Zijn goedertierenheid en Zijn waarheid zenden.", "Luk 3:13": "En hij zei tegen hen: Eis niet meer dan wat u opgelegd is.", "Jer 2:22": "Want, al wast u zich met salpeter, en nam u veel zeep, toch is uw ongerechtigheid voor Mijn aangezicht getekend, spreekt de Heere HEERE.", "Jes 66:18": "Hun werken en hun gedachten! Het komt, dat Ik alle heidenen en talen zal verzamelen, en zij zullen komen, en zij zullen Mijn heerlijkheid zien.", "Job 19:2": "Hoe lang zullen jullie mijn ziel bedroeven, en mij met woorden verbrijzelen?", "Spr 20:7": "De rechtvaardige wandelt steeds in zijn oprechtheid; gelukkig zijn zijn kinderen na hem.", "Klaagl 3:12": "Daleth. Hij heeft Zijn boog gespannen, en Hij heeft mij als doel voor de pijl gesteld.", "Rom 15:13": "De God nu van de hoop vervult u met alle blijdschap en vrede in het geloven, opdat u overvloedig mag zijn in de hoop, door de kracht van de Heilige Geest.", "2 Kon 19:19": "Nu dan, HEERE, onze God, verlos ons toch uit zijn hand; zo zullen alle koninkrijken van de aarde weten dat U, HEERE, alleen God bent.", "Hab 2:4": "Zie, wie zich verheft, zijn ziel is niet oprecht in hem; maar de rechtvaardige zal door zijn geloof leven.", "2 Kor 1:10": "Die ons uit zo’n grote dood verlost heeft, en nog verlost; op Wie wij hopen dat Hij ons ook nog verlossen zal.", "Ps 46:2-4": "God is ons een Toevlucht en Sterkte; Hij is met kracht bevonden een Hulp in benauwdheden. Daarom zullen wij niet vrezen, al veranderde de aarde haar plaats, en al werden de bergen verzet in het hart van de zeeën; Laat haar water bruisen, laat het beroerd worden; laat de bergen daveren, door de verheffing daarvan! Sela.", "Spr 12:13": "In de overtreding van de lippen is de strik van de boze; maar de rechtvaardige zal uit de benauwdheid komen.", "Job 36:18": "Omdat er grimmigheid is, pas op, dat Hij u niet misschien met een klap wegstoot; zodat u een groot rantsoen er niet af zou kunnen brengen.", "Job 22:12-14": "Is God niet in de hoogte van de hemel? Zie toch het opperste van de sterren aan, hoe hoog zij zijn. Daarom zegt u: Wat weet God ervan? Zal Hij door de donkere wolk oordelen? De wolken zijn voor Hem een verberging, zodat Hij niet ziet; en Hij wandelt op de omgang van de hemel.", "Hand 1:8": "maar u zult de kracht van de Heilige Geest ontvangen, Die over u komen zal; en u zult Mijn getuigen zijn, zowel in Jeruzalem als in heel Judea en Samaria, en tot aan het uiterste van de aarde.", "Ezech 29:7": "Toen zij u bij uw hand grepen, werd u gebroken, en spleet u al hun zijden; en toen zij op u leunden, werd u verbroken, en liet u al hun lenden stilstaan.", "Hand 4:8": "Toen zei Petrus, vervuld met de Heilige Geest, tegen hen: Leiders van het volk, en oudsten van Israël!", "2 Kor 3:17": "De Heere nu is de Geest; en waar de Geest van de Heere is, daar is vrijheid.", "Ps 4:4": "Weet toch, dat de HEERE Zich een gunstgenoot heeft afgezonderd; de HEERE zal horen, als ik tot Hem roep.", "Matt 3:11": "Ik doop u wel met water tot bekering; maar Hij Die na mij komt, is sterker dan ik, van Wie ik niet waardig ben Zijn schoenen te dragen; Hij zal u met de Heilige Geest en met vuur dopen.", "Ps 42:10": "Ik zal zeggen tot God: Mijn Steenrots! Waarom vergeet U mij? Waarom ga ik in het zwart, vanwege de onderdrukking van de vijand?", "Job 13:27": "U legt ook mijn voeten in het blok, en let op al mijn paden; U drukt Uzelf in de hielen van mijn voeten,", "2 Petr 2:5": "en de oude wereld niet gespaard heeft, maar Noach, de prediker van de gerechtigheid, met zeven anderen bewaard heeft, toen Hij de zondvloed over de wereld van de goddelozen bracht;", "Ps 26:1-3": "Een psalm van David. Doe mij recht, HEERE! Want ik wandel in mijn oprechtheid; en ik vertrouw op de HEERE, ik zal niet wankelen. Proef mij, HEERE, en beproef mij; toets mijn nieren en mijn hart. Want Uw goedertierenheid is voor mijn ogen, en ik wandel in Uw waarheid.", "Luk 18:1": "Hij vertelde hen ook een gelijkenis, met de bedoeling dat men altijd moet bidden en niet moet opgeven,", "Job 35:10": "Maar niemand zegt: Waar is God, mijn Maker, Die de lofzangen geeft in de nacht?", "Jes 62:6": "O Jeruzalem! Ik heb wachters op uw muren aangesteld, die voortdurend, de hele dag en de hele nacht, niet zullen zwijgen. U die de HEERE doet gedenken, laat geen stilzwijgen bij u zijn!", "Jes 14:31": "Huil, u poort, schreeuw, u stad! u bent gesmolten, u helemaal Palestina! want van het noorden komt een rook, en er is geen eenzame in zijn samenkomsten.", "Spr 13:3": "Die zijn mond bewaart, behoudt zijn ziel; maar voor hem is verstoring, die zijn lippen wijd opendoet.", "Amos 6:13": "U, die blij bent over een nietig ding; u, die zegt: Hebben wij niet door onze eigen kracht hoorns voor onszelf verkregen?", "Hand 24:15": "Terwijl ik hoop heb op God, welke ook zijzelf verwachten, dat er een opstanding van de doden zal zijn, van de rechtvaardigen zowel als van de onrechtvaardigen.", "Ef 6:18": "Met alle bidden en smeken, terwijl u altijd bidt in de Geest, en daartoe waakt met alle volharding en smeking voor al de heiligen;", "Spr 18:24": "Een man die vrienden heeft, moet zich vriendelijk gedragen; want er is een vriend die meer aankleeft dan een broeder.", "Ps 142:4": "Toen mijn geest in mij overweldigd was, kende U mijn pad. Zij hebben in het geheim een strik voor mij verborgen op de weg die ik zou gaan.", "Micha 7:7-9": "Maar ik zal uitzien naar de HEERE, ik zal wachten op de God van mijn heil; mijn God zal mij horen. Verblijd u niet over mij, o mijn vijandin! Wanneer ik gevallen ben, zal ik weer opstaan; wanneer ik in duisternis gezeten ben, zal de HEERE mij een licht zijn. Ik zal de gramschap van de HEERE dragen, want ik heb tegen Hem gezondigd; totdat Hij mijn twist twist, en mijn recht uitvoert; Hij zal mij naar buiten brengen aan het licht; ik zal met vreugde zien naar Zijn gerechtigheid.", "Ps 24:3-5": "Wie zal klimmen op de berg van de HEERE, en wie zal staan in de plaats van Zijn heiligheid? Die rein van handen, en zuiver van hart is, die zijn ziel niet opheft tot ijdelheid, en die niet bedrieglijk zweert; die zal de zegen ontvangen van de HEERE, en gerechtigheid van de God van zijn heil.", "1 Kon 21:27": "Het gebeurde nu, toen Achab deze woorden hoorde, dat hij zijn kleren scheurde, en een zak om zijn lichaam legde, en vastte; hij lag ook neer in de zak, en ging langzaam.", "Ex 3:17": "Daarom heb Ik gezegd: Ik zal u uit de verdrukking van Egypte opvoeren, naar het land van de Kanaänieten, en de Hethieten, en de Amorieten, en de Ferezieten, en de Hevieten, en de Jebusieten; naar het land dat overvloeit van melk en honing.", "Ps 31:16": "Mijn tijden zijn in Uw hand; red mij van de hand van mijn vijanden, en van mijn vervolgers.", "Ps 39:11": "Neem Uw plaag van mij weg; ik ben bezweken door de slagen van Uw hand.", "Ps 66:18": "Had ik naar ongerechtigheid met mijn hart gezien, de Heere zou niet gehoord hebben.", "Ps 77:11-13": "Daarna zei ik: Dit krenkt mij; maar de rechterhand van de Allerhoogste verandert. Ik zal de daden van de HEERE gedenken; ja, ik zal Uw wonderen van vroeger gedenken; En ik zal al Uw werken overdenken, en van Uw daden spreken.", "Openb 7:14-17": "En ik zei tegen hem: Heere, u weet het. En hij zei tegen mij: Dezen zijn het, die uit de grote verdrukking komen; en zij hebben hun lange kleren gewassen, en hebben hun lange kleren wit gemaakt in het bloed van het Lam. Daarom zijn zij voor de troon van God, en dienen Hem dag en nacht in Zijn tempel; en Die op de troon zit, zal hen overschaduwen. Zij zullen niet meer hongeren, en zullen niet meer dorsten, en de zon zal niet meer op hen vallen, of enige hitte.", "Zef 3:12": "Maar Ik zal in uw midden doen overblijven een ellendig en arm volk; die zullen op de Naam van de HEERE vertrouwen.", "Fil 1:27": "Alleen, leef op een wijze die het Evangelie van Christus waardig is, opdat, hetzij ik kom en u zie, hetzij ik afwezig ben, ik van uw zaken mag horen, dat u staat in één geest, met één gemoed gezamenlijk strijdend door het geloof van het Evangelie;", "Hand 10:44-47": "Terwijl Petrus deze woorden nog sprak, viel de Heilige Geest op allen die het Woord hoorden. En de gelovigen die uit de besnijdenis waren, zovelen als er met Petrus meegekomen waren, waren buiten zichzelf, omdat de gave van de Heilige Geest ook op de heidenen uitgestort werd. Want zij hoorden hen spreken in vreemde talen, en God groot maken. Toen antwoordde Petrus:", "Jona 1:14": "Toen riepen zij tot de HEERE, en zeiden: Och HEERE, laat ons toch niet vergaan om het leven van deze man, en leg geen onschuldig bloed op ons; want U, HEERE, hebt gedaan zoals het U heeft behaagd.", "Hand 24:16": "En hierin oefen ik mijzelf, om altijd een onberispelijk geweten te hebben bij God en de mensen.", "Joël 2:28": "En daarna zal het gebeuren, dat Ik Mijn Geest zal uitgieten over alle vlees, en uw zonen en uw dochters zullen profeteren; uw ouden zullen dromen dromen, uw jongelingen zullen gezichten zien;", "Ps 7:4-6": "HEERE, mijn God, als ik dat gedaan heb, als er onrecht in mijn handen is; Als ik kwaad vergolden heb aan hem die vrede met mij had; (ja, ik heb hem gered, die mij zonder reden benauwde!) Laat dan de vijand mijn ziel vervolgen, en achterhaalt haar, en vertreedt mijn leven ter aarde, en mijn eer in het stof doet wonen! Sela.", "Deut 32:39": "Zie nu, dat Ik, Ik DIE ben, en geen God met Mij; Ik dood en maak levend; Ik versla en Ik heel; en er is niemand die uit Mijn hand redt!", "Hand 19:2-6": "zei hij tegen hen: Hebt u de Heilige Geest ontvangen, toen u tot geloof kwam? En zij zeiden tegen hem: Wij hebben zelfs niet gehoord of er een Heilige Geest is. En hij zei tegen hen: Waarin bent u dan gedoopt? En zij zeiden: In de doop van Johannes. Maar Paulus zei: Johannes heeft wel gedoopt met de doop van bekering, en zei tegen het volk dat zij geloven zouden in Hem Die na hem kwam, dat is, in Christus Jezus.", "Jes 36:18": "Laat Hizkia u niet verleiden, door te zeggen: De HEERE zal ons redden; hebben de goden van de volken, ieder zijn eigen land, gered uit de hand van de koning van Assyrië?", "Spr 26:12": "Hebt u een man gezien die wijs is in zijn eigen ogen? Van een dwaas is meer te verwachten dan van hem.", "2 Kor 13:14": "De genade van de Heere Jezus Christus, en de liefde van God, en de gemeenschap van de Heilige Geest, zij met u allen. Amen. De tweede brief aan de Korinthiërs werd door Titus en Lukas geschreven vanuit Filippi, een stad in Macedonië.", "Ps 30:10": "Wat gewin is er in mijn bloed, in mijn neerdalen tot de groeve? Zal het stof U loven? Zal het Uw waarheid verkondigen?", "Klaagl 2:15": "Samech. Allen die voorbijgaan, klappen met de handen over u, zij fluiten en schudden hun hoofd over de dochter van Jeruzalem, en zeggen: Is dit die stad, waarvan men zei, dat zij volkomen was van schoonheid, een vreugde van de hele aarde?", "Matt 25:30": "En werp de nutteloze dienstknecht buiten, in de uiterste duisternis; daar zal geween zijn en het geknars van de tanden.", "Ps 107:17-19": "De zotten worden geplaagd om de weg van hun overtreding, en om hun ongerechtigheden; Hun ziel gruwde van alle voedsel, en zij waren tot aan de poorten van de dood gekomen. Toen riepen zij tot de HEERE in de benauwdheid die zij hadden, en Hij verloste hen uit hun angsten.", "Ps 5:9": "HEERE! Leid mij in Uw gerechtigheid, om mijn verspieders wil; richt Uw weg voor mijn aangezicht.", "Tit 1:7": "Want een opziener moet onberispelijk zijn, als een huisverzorger van God, niet eigenzinnig, niet gauw driftig, niet verzot op wijn, geen vechter, niet uit op oneerlijke winst;", "Spr 2:5": "Dan zult u de vreze des HEEREN verstaan, en zult de kennis van God vinden.", "Gen 16:13": "En zij noemde de Naam van de HEERE, Die tot haar sprak: U bent de God van het aanzien! want zij zei: Heb ik ook hier gezien naar Hem, Die mij aanziet?", "Ps 13:6": "Maar ik vertrouw op Uw goedertierenheid; mijn hart zal zich verheugen in Uw heil; ik zal de HEERE zingen, omdat Hij mij goedgedaan heeft.", "Jes 33:15": "Wie in gerechtigheid wandelt, en wat recht is spreekt; wie de winst van onderdrukking verwerpt; wie zijn handen uitschudt, zodat zij geen geschenken vasthouden; wie zijn oor dichtstopt, zodat hij geen bloedschuld hoort, en zijn ogen dichtdoet; zodat hij het kwade niet aanziet;", "Ps 38:2-23": "O HEERE! Straf mij niet in Uw grote toorn, en straf mij niet in Uw grimmigheid. Want Uw pijlen zijn in mij gedaald, en Uw hand is op mij neergedaald. Er is niets heels in mijn vlees, vanwege Uw gramschap; er is geen vrede in mijn beenderen, vanwege mijn zonde.", "Ps 119:172": "Mijn tong zal spraak houden van Uw rede, want al Uw geboden zijn rechtvaardigheid.", "Spr 21:3": "Gerechtigheid en recht te doen is bij de HEERE uitgelezener dan offer.", "Ef 4:22": "Namelijk dat u zou afleggen, wat betreft de vorige levenswandel, de oude mens, die verdorven wordt door de begeerten van de verleiding;", "1 Tess 1:6": "En u bent navolgers geworden van ons en van de Heere, doordat u het Woord aannam onder veel verdrukking, met blijdschap van de Heilige Geest;", "2 Sam 22:28": "En U verlost het bedrukte volk; maar Uw ogen zijn tegen de hoogmoedigen, U zult hen vernederen.", "Ps 143:4": "Daarom wordt mijn geest overstelpt in mij, mijn hart is verbaasd in het midden van mij.", "2 Kor 4:17": "Want onze lichte verdrukking, die zeer haast voorbijgaat, brengt ons een geheel bijzonder groot en eeuwig gewicht van heerlijkheid;", "1 Sam 12:5": "Toen zei hij tegen hen: De HEERE is Getuige tegen u, en Zijn gezalfde is vandaag getuige, dat u in mijn hand niets gevonden hebt! En het volk zei: Hij is Getuige!", "Ps 7:3": "Anders zou hij mijn ziel roven als een leeuw, die verscheurt, terwijl er geen redder is.", "Hos 12:5": "Ja, hij gedroeg zich vorstelijk tegen de Engel, en kreeg de overhand op Hem; hij weende en smeekte Hem. Te Bethel vond hij Hem, en daar sprak Hij met ons;", "Hebr 11:16-39": "maar nu verlangen zij naar een beter vaderland, dat is, naar het hemelse. Daarom schaamt God Zich niet voor hen om hun God genoemd te worden; want Hij had voor hen een stad klaargemaakt. Door het geloof heeft Abraham, toen hij beproefd werd, Izak geofferd, en hij die de beloften ontvangen had, heeft zijn enige zoon geofferd, (tegen wie gezegd was: In Izak zal uw nageslacht genoemd worden),", "Ps 119:173": "Laat Uw hand mij te hulp komen, want ik heb Uw bevelen gekozen.", "Jes 25:8": "Hij zal de dood verslinden tot overwinning, en de Heere HEERE zal de tranen van alle aangezichten afwissen; en Hij zal de smaad van Zijn volk van de hele aarde wegnemen; want de HEERE heeft het gesproken.", "Job 29:19": "Mijn wortel was uitgebreid tot aan het water, en dauw vernachtte op mijn tak.", "2 Petr 3:4": "En zeggen: Waar is de belofte van Zijn komst? Want vanaf de dag dat de vaders ontslapen zijn, blijven alle dingen zo, net zoals vanaf het begin van de schepping.", "Joh 16:20": "Voorwaar, voorwaar, Ik zeg u: u zult huilen en klagen, maar de wereld zal zich verblijden; en u zult bedroefd zijn, maar uw droefheid zal tot blijdschap worden.", "Ps 77:3": "Ten dage van mijn benauwdheid zocht ik de Heere; mijn hand was 's nachts uitgestrekt, en liet niet af; mijn ziel weigerde getroost te worden.", "Jes 26:21": "Want zie, de HEERE zal uit Zijn plaats uitgaan, om de ongerechtigheid van de inwoners van de aarde over hen te bezoeken; en de aarde zal haar bloed onthullen, en zal haar gedoden niet langer bedekt houden.", "Ef 6:17": "En neem de helm van de zaligheid, en het zwaard van de Geest, dat is het Woord van God.", "Mark 10:17-22": "En toen Hij de weg opging, kwam er iemand aanlopen, en viel voor Hem op de knieën, en vroeg Hem: Goede Meester, wat moet ik doen om het eeuwige leven te beërven? En Jezus zei tegen hem: Waarom noemt u Mij goed? Niemand is goed, dan Eén, namelijk God. U kent de geboden: U zult geen overspel plegen; u zult niet doden; u zult niet stelen; u zult geen vals getuigenis geven; u zult niemand tekortdoen; eer uw vader en uw moeder.", "Luk 1:67": "En Zacharias, zijn vader, werd vervuld met de Heilige Geest, en profeteerde, en zei:", "Jes 48:16": "Kom nader tot Mij, hoor dit: Ik heb van het begin af niet in het verborgene gesproken, maar van de tijd af, dat het gebeurd is, ben Ik daar; en nu, de Heere HEERE, en Zijn Geest heeft Mij gezonden.", "Gal 5:17": "Want het vlees begeert tegen de Geest, en de Geest tegen het vlees; en die staan tegenover elkaar, zodat u niet doet wat u zou willen.", "Ps 88:9": "Mijn bekenden hebt U ver van mij weggedaan, U hebt mij hun tot een grote gruwel gesteld; ik ben opgesloten en kan niet uitkomen.", "Job 21:13": "In het goede verslijten zij hun dagen; en in een ogenblik dalen zij af in het graf.", "Jak 5:12": "Maar voor alle dingen, mijn broeders, zweer niet, noch bij de hemel, noch bij de aarde, noch bij enige andere eed; maar laat uw ja, ja zijn, en het nee, nee; opdat u niet onder het oordeel valt.", "Spr 14:13": "Het hart zal ook bij het lachen verdriet hebben; en het einde van die blijdschap is droefheid.", "Ps 74:3": "Hef Uw voeten op naar de eeuwige verwoestingen; de vijand heeft alles in het heiligdom verdorven.", "Fil 3:20": "Maar onze wandel is in de hemelen, waaruit wij ook de Zaligmaker verwachten, namelijk de Heere Jezus Christus;", "Ps 25:1": "Een psalm van David. Aleph. Tot U, o HEERE! hef ik mijn ziel op.", "Ps 71:21": "Gij zult mijn grootheid vermeerderen, en mij rondom vertroosten.", "Spr 22:11": "Wie de reinheid van het hart liefheeft, wiens lippen aangenaam zijn, diens vriend is de koning.", "Gen 20:7": "Geef dan nu de vrouw van deze man terug, want hij is een profeet, en hij zal voor u bidden, zodat u blijft leven; maar als u haar niet teruggeeft, weet dan dat u zeker sterven zult, u en al wat van u is!", "Ps 78:20": "Zie, Hij heeft de rotssteen geslagen, zodat er water uitvloeide, en beken overvloedig uitbraken, zou Hij ook brood kunnen geven? Zou Hij aan Zijn volk vlees toebereiden?", "Ps 15:1-5": "Een psalm van David. HEERE, wie zal verblijven in Uw tent? Wie zal wonen op de berg van Uw heiligheid? Die oprecht wandelt, en gerechtigheid doet, en die met zijn hart de waarheid spreekt; Die met zijn tong niet lastert, zijn metgezellen geen kwaad doet, en geen smaad uit over zijn naaste;", "Ps 31:4-7": "Want U bent mijn Steenrots en mijn Burg; leid mij dan, en voer mij, omwille van Uw Naam. Doe mij uitgaan uit het net, dat zij voor mij verborgen hebben, want U bent mijn Sterkte. In Uw hand beveel ik mijn geest; U hebt mij verlost, HEERE, U, God van de waarheid!", "Spr 31:26": "Pe. Zij doet haar mond open met wijsheid; en op haar tong is onderwijs van goedheid.", "Ps 61:8": "Hij zal eeuwig voor Gods aangezicht zitten; bereid goedertierenheid en waarheid, dat zij hem behoeden.", "Job 16:7-16": "Zeker, Hij heeft mij nu vermoeid; U hebt mijn hele vergadering verwoest. Dat U mij rimpelig gemaakt hebt, is tot een getuige; en mijn magerheid staat tegen mij op, zij getuigt in mijn gezicht. Zijn toorn verscheurt, en Hij haat mij; Hij knerst over mij met Zijn tanden; mijn tegenstander scherpt zijn ogen tegen mij.", "Joh 9:34": "Zij antwoordden en zeiden tegen hem: U bent helemaal in zonden geboren, en u leert ons? En zij wierpen hem eruit.", "Ps 73:26": "Bezwijkt mijn vlees en mijn hart, dan is God de Rotssteen van mijn hart, en mijn Deel in eeuwigheid.", "Ps 42:9": "Maar de HEERE zal overdag Zijn goedertierenheid gebieden, en 's nachts zal Zijn lied bij mij zijn: het gebed tot de God van mijn leven.", "Job 2:7": "Toen ging de satan weg van het aangezicht van de HEERE, en sloeg Job met kwaadaardige zweren, van zijn voetzool af tot zijn schedel toe.", "2 Kron 6:24-39": "En wanneer Uw volk Israël voor het aangezicht van de vijand geslagen zal worden, omdat zij tegen U gezondigd zullen hebben, en zich bekeren, en Uw Naam belijden, en voor Uw aangezicht in dit huis bidden en smeken zullen, Hoor U dan uit de hemel, en vergeef de zonden van Uw volk Israël, en breng hen terug in het land dat U hun en hun vaders gegeven hebt. Als de hemel gesloten zal zijn, zodat er geen regen is, omdat zij tegen U gezondigd zullen hebben, en zij in deze plaats bidden, en Uw Naam belijden, en zich van hun zonden bekeren zullen, wanneer U hen geplaagd zult hebben;", "Klaagl 3:34-36": "Lamed. Dat men al de gevangenen van de aarde onder Zijn voeten verbrijzelt; Lamed. Dat men het recht van een man buigt voor het aangezicht van de Allerhoogste; Lamed. Dat men een mens verongelijkt in zijn rechtszaak; zou de Heere dat niet zien?", "Tit 2:8": "Het woord gezond en onberispelijk, opdat hij die daartegen is, beschaamd wordt, en niets kwaads heeft te zeggen van u.", "Ps 119:52": "Ik heb gedacht, o HEERE! aan Uw oordelen van oudsher, en heb mij getroost.", "Job 29:18": "En ik zei: Ik zal in mijn nest de geest geven, en ik zal de dagen vermenigvuldigen als het zand.", "Job 21:26": "Zij liggen samen neer in het stof, en het gewormte overdekt hen.", "2 Kor 5:7": "(Want wij wandelen door geloof en niet door aanschouwen.)", "Job 34:16-19": "Zo er dan verstand bij u is, hoor dit; neig de oren tot de stem van mijn woorden. Zou Hij ook, Die het recht haat, de gewonde verbinden, en zou u de zeer Rechtvaardige veroordelen? Zou men tot een koning zeggen: U bent Belial; tot de vorsten: U bent goddelozen!", "Ps 130:1-8": "Een lied van de hogere trappen. Uit de diepten roep ik tot U, o HEERE! Heere! Hoor naar mijn stem; laat Uw oren opmerkzaam zijn op de stem van mijn smekingen. Als U, HEERE, op de ongerechtigheden let, Heere, wie zal dan bestaan?", "Jer 49:4": "Wat beroemt u zich op uw dalen? Uw dal is weggevloeid, u afkerige dochter! die op haar schatten vertrouwt en zegt: Wie zou tegen mij komen?", "Num 27:18": "Toen zei de HEERE tegen Mozes: Neem Jozua, de zoon van Nun, een man in wie de Geest is, bij u; en leg uw hand op hem;", "Job 21:14": "Toch zeggen zij tegen God: Ga weg van ons, want in de kennis van Uw wegen hebben wij geen behagen.", "Ps 6:8": "Mijn oog is doorknaagd van verdriet, is verouderd, vanwege al mijn tegenstanders.", "Ps 74:12": "Toch is God mijn Koning van oudsher, Die verlossingen werkt in het midden van de aarde.", "Spr 27:9": "Olie en reukwerk verblijden het hart; zo doet de zoetheid van iemands vriend, vanwege hartelijke raad.", "Spr 26:5": "Antwoord de dwaas naar zijn dwaasheid, opdat hij niet wijs is in zijn eigen ogen.", "Ps 42:2": "Zoals een hert schreeuwt naar de waterstromen, zo schreeuwt mijn ziel tot U, o God!", "Fil 3:4-14": "Hoewel ik ook redenen had om op het vlees te vertrouwen; als iemand anders meent te kunnen vertrouwen op het vlees, ik nog meer. Besneden op de achtste dag, uit het geslacht van Israël, van de stam van Benjamin, een Hebreeër uit de Hebreeën, wat de wet betreft een Farizeeër; Wat de ijver betreft een vervolger van de Gemeente; wat de rechtvaardigheid betreft die in de wet is, onberispelijk.", "Hebr 9:14": "hoeveel te meer zal het bloed van Christus, Die door de eeuwige Geest Zichzelf onberispelijk aan God geofferd heeft, uw geweten reinigen van dode werken, om de levende God te dienen?", "Ps 119:114": "U bent mijn Schuilplaats en mijn Schild; op Uw Woord heb ik gehoopt.", "Spr 18:6": "De lippen van de dwaas komen in twist, en zijn mond roept om slagen.", "Ps 10:12-15": "Sta op, HEERE God! Hef Uw hand op, vergeet de ellendigen niet. Waarom lastert de goddeloze God? Hij zegt in zijn hart: U zult het niet zoeken? U ziet het zeker; want U aanschouwt de moeite en het verdriet, opdat men het in Uw hand geeft; op U verlaat de arme zich, U bent geweest een Helper van de wees.", "Gen 3:17": "En tegen Adam zei Hij: Omdat u geluisterd hebt naar de stem van uw vrouw, en van die boom hebt gegeten waarvan Ik u geboden had: Daarvan zult u niet eten; is het aardrijk vervloekt om u; en met smart zult u daarvan eten, alle dagen van uw leven.", "Deut 7:9": "U zult dan weten dat de HEERE, uw God, dié God is, de getrouwe God, Die het verbond en de goedertierenheid houdt met wie Hem liefhebben en Zijn geboden houden, tot in duizend geslachten.", "Job 6:4": "Want de pijlen van de Almachtige zijn in mij, waarvan het vurige venijn mijn geest uitdrinkt; de verschrikkingen van God rusten zich tegen mij.", "Job 3:1-26": "Daarna opende Job zijn mond, en vervloekte zijn dag. Want Job antwoordde en zei: De dag verga, waarop ik geboren ben, en de nacht waarin men zei: Een knechtje is ontvangen.", "Hand 15:8": "En God, de Kenner van de harten, heeft hun getuigenis gegeven, doordat Hij hun de Heilige Geest gaf, evenals ook aan ons;", "1 Kor 5:8": "Laten we dan feest houden, niet met de oude zuurdesem, ook niet met de zuurdesem van kwaadheid en boosheid, maar met de ongezuurde broden van oprechtheid en waarheid.", "Openb 2:29": "Wie oren heeft, laat hij horen wat de Geest tegen de gemeenten zegt.", "Jes 37:10": "Zo moet u spreken tegen Hizkia, de koning van Juda: Laat uw God u niet bedriegen, op Wie u vertrouwt, door te zeggen: Jeruzalem zal niet in de hand van de koning van Assyrië gegeven worden.", "Zach 13:9": "En Ik zal dat derde deel in het vuur brengen, en Ik zal het louteren, zoals men zilver loutert, en Ik zal het beproeven, zoals men goud beproeft; het zal Mijn Naam aanroepen, en Ik zal het verhoren; Ik zal zeggen: Het is Mijn volk; en het zal zeggen: De HEERE is mijn God.", "Neh 4:4": "Hoor, o onze God, dat wij erg veracht worden, en keer hun smaad terug op hun eigen hoofd, en geef hen over als buit in een land van gevangenschap.", "1 Tess 5:19": "Blus de Geest niet uit.", "Matt 5:4": "Zalig zijn zij die treuren, want zij zullen vertroost worden.", "Zach 5:3": "Toen zei Hij tegen mij: Dit is de vloek die uitgaan zal over heel het land; want ieder die steelt, zal hiervandaan, volgens deze vloek, uitgeroeid worden; en ieder die valselijk zweert, zal hiervandaan, volgens deze vloek, uitgeroeid worden.", "Jak 1:10": "En de rijke in zijn vernedering; want hij zal als een bloem van het gras voorbijgaan.", "Ps 55:13-15": "Want het is geen vijand die mij hoont, anders zou ik het hebben gedragen; het is mijn hater niet die zich tegen mij groot maakt, anders zou ik mij voor hem verborgen hebben. Maar u bent het, o mens, als van mijn eigen stand, mijn leidsman en mijn bekende! Wij die samen in zoetheid heimelijk raadpleegden; wij wandelden in gezelschap naar het huis van God.", "Spr 17:9": "Die de overtreding toedekt, zoekt liefde; maar die de zaak weer ophaalt, brengt scheiding tussen de beste vrienden.", "Job 19:1-5": "Maar Job antwoordde en zei: Hoe lang zullen jullie mijn ziel bedroeven, en mij met woorden verbrijzelen? Nu al tien keer hebben jullie mij schande aangedaan; u schaamt u niet, u verhardt u tegen mij.", "Spr 17:28": "Zelfs een dwaas, die zwijgt, wordt wijs geacht, en die zijn lippen toesluit, verstandig.", "Klaagl 3:13": "He. Hij heeft de pijlen uit Zijn pijlkoker in mijn nieren doen ingaan.", "Hand 5:4": "Zolang het bleef, bleef het niet uw eigendom? En verkocht zijnde, was het niet in uw macht? Wat is het, dat u deze daad in uw hart hebt voorgenomen? U hebt niet mensen gelogen, maar God.", "Mark 3:30": "Want zij zeiden: Hij heeft een onreine geest.", "2 Kron 13:10": "Maar wat ons betreft, de HEERE is onze God, en wij hebben Hem niet verlaten; en de priesters die de HEERE dienen, zijn de zonen van Aäron, en de Levieten zijn bezig met hun werk.", "Dan 7:25": "En het zal woorden spreken tegen de Allerhoogste, en het zal de heiligen van de hoge plaatsen uitputten, en het zal proberen de tijden en de wet te veranderen, en zij zullen in zijn hand overgegeven worden tot een tijd, en tijden, en een deel van een tijd.", "Hand 26:29": "En Paulus zei: Ik zou van God wensen dat, zowel bijna als geheel, niet alleen u, maar ook allen die mij vandaag horen, zulke mensen werden zoals ik ben, uitgezonderd deze boeien.", "Job 7:1": "Heeft de mens niet een strijd op de aarde, en zijn zijn dagen niet als de dagen van de dagloner?", "Ps 35:1-3": "Een psalm van David. Twist, HEERE, met wie tegen mij twisten; strijd tegen wie tegen mij strijden. Grijp het schild en de rondas, en sta op tot mijn hulp. En breng de spies naar voren, en sluit de weg toe voor mijn vervolgers; zeg tegen mijn ziel: Ik ben uw Heil.", "Job 13:3": "Maar ik wil tot de Almachtige spreken, en ik ben erop belust mij te verdedigen voor God.", "Job 39:34-38": "En de HEERE antwoordde Job, en zei: Is het twisten met de Almachtige onderrichten? Wie God bestraft, die antwoordt daarop. Toen antwoordde Job de HEERE, en zei:", "Num 20:16": "Toen riepen wij tot de HEERE, en Hij hoorde onze stem, en Hij zond een Engel, en Hij leidde ons uit Egypte; en zie, wij zijn te Kades, een stad aan de rand van uw gebied.", "Gal 5:22": "Maar de vrucht van de Geest is liefde, blijdschap, vrede, geduld, vriendelijkheid, goedheid, geloof, zachtmoedigheid, zelfbeheersing.", "Hebr 4:16": "Laat ons dan met vrijmoedigheid toegaan tot de troon van de genade, opdat wij barmhartigheid mogen verkrijgen en genade vinden om geholpen te worden op de tijd dat wij het nodig hebben.", "Spr 15:23": "Een man heeft blijdschap in het antwoord van zijn mond; en hoe goed is een woord op zijn tijd!", "Ps 89:19": "Want ons schild is van de HEERE, en onze koning is van de Heilige van Israël.", "Joh 19:16": "Toen gaf hij Hem dan aan hen over, opdat Hij gekruisigd zou worden. En zij namen Jezus, en leidden Hem weg.", "2 Kon 19:16": "HEERE, neig Uw oor en hoor, doe Uw ogen open, HEERE, en zie, en hoor de woorden van Sanherib, die deze man gezonden heeft om de levende God te honen.", "Matt 26:39": "En toen Hij een weinig verder gegaan was, viel Hij op Zijn aangezicht, bad en zei: Mijn Vader, als het mogelijk is, laat deze drinkbeker aan Mij voorbijgaan! Maar toch niet zoals Ik wil, maar zoals U wilt.", "Jes 4:6": "En daar zal een hut zijn tot een schaduw overdag tegen de hitte, en tot een toevlucht, en tot een schuilplaats tegen de vloed en tegen de regen.", "1 Kor 15:21": "Want omdat de dood door een mens is, is ook de opstanding van de doden door een Mens.", "Spr 17:3": "De smeltkroes is voor het zilver, en de oven voor het goud; maar de HEERE toetst de harten.", "Rom 11:32": "Want God heeft hen allen onder de ongehoorzaamheid besloten, opdat Hij hun allen barmhartig zou zijn.", "Jer 15:15": "O HEERE! U weet het, denk aan mij, en bezoek mij, en wreek mij op mijn vervolgers; neem mij niet weg in Uw lankmoedigheid over hen; weet dat ik omwille van U smaad draag.", "Ps 27:6": "Ook nu zal mijn hoofd verhoogd worden boven mijn vijanden die rondom mij zijn, en ik zal in Zijn tent offeranden van het geschal offeren; ik zal zingen, ja, psalmzingen voor de HEERE.", "Ps 69:4": "Ik ben vermoeid van mijn roepen, mijn keel is ontstoken, mijn ogen zijn bezweken, terwijl ik hoop op mijn God.", "Jes 14:32": "Wat zal men dan antwoorden aan de boden van het volk? Dat de HEERE Sion gegrond heeft, opdat de bedrukten van Zijn volk daarin een toevlucht zouden hebben.", "Ps 35:16": "Onder spotachtige tafelbroeders die huichelden, knerste men over mij met de tanden.", "Zach 7:9": "Zo sprak de HEERE van de heerscharen: Doe een waarachtig recht, en bewijs goedertierenheid en barmhartigheid, de een aan de ander;", "Ps 119:39": "Wend mijn smaad af, die ik vrees, want Uw rechten zijn goed.", "Spr 26:4": "Antwoord de dwaas niet naar zijn dwaasheid, opdat u ook niet aan hem gelijk wordt.", "Joh 3:5": "Jezus antwoordde: Voorwaar, voorwaar, Ik zeg u: Als iemand niet geboren wordt uit water en Geest, kan hij het Koninkrijk van God niet binnengaan.", "Jes 63:11": "Toch dacht Hij aan de dagen van ouds, aan Mozes en Zijn volk; maar nu, waar is Hij, Die hen uit de zee opgebracht heeft, met de herders van Zijn kudde? Waar is Hij, Die Zijn Heilige Geest in het midden van hen stelde?", "1 Kon 8:36-50": "hoor Ú dan in de hemel, en vergeef de zonde van Uw dienaren en van Uw volk Israël, wanneer U hun de goede weg geleerd zult hebben waarin zij wandelen zullen; en geef regen op Uw land, dat U Uw volk tot een erfenis gegeven hebt. Als er honger in het land zal zijn, als er pest zal zijn, als er brandkoren, honingdauw, sprinkhanen, of kevers zullen zijn, als zijn vijand hem in het land van zijn poorten belegeren zal, of welke plaag of welke ziekte er ook zal zijn; elk gebed, elke smeking, die door enig mens, door al Uw volk Israël gebeuren zal; wanneer zij erkennen, ieder de plaag van zijn eigen hart, en ieder zijn handen in dit huis uitbreiden zal;", "Joh 6:27": "Werk niet voor het voedsel dat vergaat, maar voor het voedsel dat blijft tot in het eeuwige leven, dat de Zoon des mensen u geven zal; want Hem heeft God de Vader verzegeld.", "Ps 20:2": "De HEERE verhoort u in de dag van benauwdheid; de Naam van de God van Jakob zet u in een hoog vertrek.", "Jes 40:7": "Het gras verdort, de bloem valt af, als de Geest van de HEERE daarin waait; voorwaar, het volk is gras.", "Job 7:2-6": "Zoals de dienstknecht hijgt naar de schaduw, en zoals de dagloner uitkijkt naar zijn werkloon; Zo zijn mij maanden van ijdelheid ten erve geworden, en nachten van moeite zijn mij voorbereid. Als ik ga liggen om te slapen, dan zeg ik: Wanneer zal ik opstaan, en heeft Hij de avond afgemeten? En ik word verzadigd van woelingen tot aan de schemertijd.", "1 Tess 2:4": "maar zoals wij door God beproefd zijn, zodat ons het Evangelie toevertrouwd zou worden, zo spreken wij, niet om mensen te behagen, maar God, Die onze harten beproeft.", "Ps 44:22": "Zou God dat niet onderzoeken? Want Hij kent de verborgenheden van het hart.", "Job 20:25": "Men zal het zwaard uittrekken, het zal uit zijn lijf komen, en glinsterend uit zijn gal voortkomen; verschrikkingen zullen over hem zijn.", "Jer 20:7": "HEERE! U hebt mij overgehaald, en ik ben overgehaald; U bent mij te sterk geweest, en hebt de overhand gehad; ik ben de hele dag tot een belaching, ieder van hen bespot mij.", "Ps 119:139": "Mijn ijver heeft mij doen vergaan, omdat mijn tegenstanders Uw woorden vergeten hebben.", "1 Tess 1:5": "Want ons Evangelie is bij u niet alleen met woorden gekomen, maar ook met kracht, en met de Heilige Geest, en met veel zekerheid; zoals u weet wat voor mensen wij bij u geweest zijn, ter wille van u.", "Ps 9:5": "Want Gij hebt mijn recht en mijn rechtszaak afgedaan; Gij hebt gezeten op de troon, o Rechter der gerechtigheid.", "Klaagl 3:3-5": "Aleph. Hij heeft Zich zeker tegen mij gewend, Hij heeft Zijn hand de hele dag veranderd. Beth. Hij heeft mijn vlees en mijn huid oud gemaakt, Hij heeft mijn beenderen gebroken. Beth. Hij heeft tegen mij gebouwd, en Hij heeft mij met gal en moeite omringd.", "Klaagl 3:57": "Koph. U bent tot mij genaderd op de dag dat ik U aanriep; U hebt gezegd: Vrees niet!", "Ps 9:11": "En die Uw Naam kennen, zullen op U vertrouwen, omdat Gij, HEERE, niet hebt verlaten degenen, die U zoeken.", "2 Sam 15:31": "Toen liet men David weten, en zei: Achitofel is onder degenen die zich met Absalom hebben verbonden. Toen zei David: HEERE, maak toch de raad van Achitofel tot dwaasheid.", "1 Kon 20:31": "Toen zeiden de knechten tegen hem: Zie toch, wij hebben gehoord, dat de koningen van het huis van Israël goedertierene koningen zijn; laat ons toch rouwgewaad om onze lenden leggen, en koorden om onze hoofden, en uitgaan naar de koning van Israël; misschien zal hij uw leven sparen.", "Jer 14:22": "Zijn er onder de nietige afgoden van de heidenvolken die het kunnen laten regenen, of kan de hemel regenbuien geven? Bent U dat niet, o HEERE, onze God? Daarom zullen wij op U wachten, want U doet al die dingen.", "Joh 14:1": "Laat uw hart niet ontroerd worden; u gelooft in God, geloof ook in Mij.", "Ps 63:7": "Als ik aan U denk op mijn bed, dan peins ik over U in de nachtwaken.", "Ps 140:13": "Ik weet dat de HEERE de rechtszaak van de ellendigen, en het recht van de behoeftigen, zal uitvoeren.", "Ezech 36:26": "En Ik zal u een nieuw hart geven, en zal een nieuwe geest geven in het binnenste van u; en Ik zal het stenen hart uit uw vlees wegnemen, en zal u een vlezen hart geven.", "Hab 3:9": "De naakte grond werd ontbloot door Uw boog, om de eden, aan de stammen gedaan door het woord. Sela. U hebt de rivieren van de aarde gekloofd.", "Joël 1:8": "Kerm, als een jonkvrouw, die met een zak omgord is vanwege de man van haar jeugd.", "Spr 27:6": "De wonden van hem die liefheeft, zijn trouw; maar de kussen van hem die haat, zijn te verafschuwen.", "Ps 119:107": "Ik ben helemaal zeer verdrukt, HEERE! maak mij levend naar Uw woord.", "1 Petr 1:24": "Want alle vlees is als gras, en alle heerlijkheid van de mens is als een bloem van het gras. Het gras verdort, en zijn bloem valt af;", "1 Kor 12:26": "En hetzij dat één lid lijdt, alle leden lijden mee; hetzij dat één lid geëerd wordt, alle leden verblijden zich mee.", "Job 29:12-17": "Want ik bevrijdde de ellendige die riep, en de wees die geen helper had. De zegen van hem die verloren dreigde te gaan, kwam op mij; en het hart van de weduwe deed ik vrolijk zingen. Ik bekleedde mij met gerechtigheid, en zij bekleedde mij; mijn oordeel was als een mantel en vorstelijke hoed.", "Ps 10:1": "HEERE, waarom staat U ver weg? Waarom verbergt U Zich in tijden van benauwdheid?", "Ps 71:12": "O God, wees niet ver van mij; mijn God! haast U tot mijn hulp.", "Ps 143:1-12": "Een psalm van David. O HEERE, hoor mijn gebed, neig de oren tot mijn smekingen; verhoor mij naar Uw waarheid, naar Uw gerechtigheid. En ga niet in het gericht met Uw knecht, want niemand die leeft, zal voor Uw aangezicht rechtvaardig zijn. Want de vijand vervolgt mijn ziel, hij vertreedt mijn leven ter aarde; hij legt mij in duisternissen, als hen die al lang dood zijn.", "Rom 15:16": "opdat ik een dienaar van Jezus Christus zou zijn onder de heidenen, het Evangelie van God bedienend, opdat het offer van de heidenen aangenaam zou worden, geheiligd door de Heilige Geest.", "Rom 1:9": "Want God is mijn Getuige, Die ik dien in mijn geest, in het Evangelie van Zijn Zoon, hoe ik zonder ophouden aan u denk;", "Ps 35:23": "Ontwaak en word wakker tot mijn recht; mijn God en Heere! Tot mijn twistzaak.", "Luk 7:50": "Maar Hij zei tegen de vrouw: Uw geloof heeft u behouden; ga heen in vrede.", "Ps 126:4": "O HEERE, keer onze gevangenschap, zoals waterstromen in het zuiden.", "Klaagl 3:31-33": "Caph. Want de Heere zal niet verstoten in eeuwigheid. Caph. Maar als Hij bedroefd heeft, zo zal Hij Zich ontfermen, naar de grootheid van Zijn blijken van goedertierenheid. Caph. Want Hij plaagt of bedroeft de kinderen van de mensen niet van harte.", "Job 19:21": "Ontferm u over mij, ontferm u over mij, o mijn vrienden! want de hand van God heeft mij aangeraakt.", "2 Kor 11:23-30": "Zijn zij dienaars van Christus? (ik spreek als een onwijze) ik ben boven hen; in arbeid overvloediger, in slagen voortreffelijker, in gevangenissen overvloediger, in doodsgevaar menigmaal. Van de Joden heb ik veertig slagen min één, vijfmaal ontvangen. Driemaal ben ik met roeden gegeseld geweest, eens ben ik gestenigd, driemaal heb ik schipbreuk geleden, een hele nacht en dag heb ik in de diepte doorgebracht.", "2 Kron 15:15": "En heel Juda was verblijd over deze eed; want zij hadden met hun hele hart gezworen, en met hun hele wil Hem gezocht; en Hij werd door hen gevonden, en de HEERE gaf hun rust van rondom.", "Joh 14:18": "Ik zal u niet als wezen achterlaten; Ik kom weer naar u toe.", "Deut 5:11": "U zult de Naam van de HEERE, uw God, niet ijdel gebruiken; want de HEERE zal hem die Zijn Naam ijdel gebruikt, niet onschuldig houden.", "Ps 3:2": "O HEERE, hoe zijn mijn tegenstanders talrijk geworden; velen staan tegen mij op.", "Ps 145:14": "Samech. De HEERE ondersteunt allen die vallen, en Hij richt op alle gebogenen.", "Pred 5:14": "Zoals hij voortgekomen is uit de buik van zijn moeder, zo zal hij naakt terugkeren, gaande zoals hij gekomen was; en hij zal niets van zijn arbeid meenemen, dat hij met zijn hand zou kunnen wegdragen.", "Jer 20:11": "Maar de HEERE is met mij als een verschrikkelijke Held; daarom zullen mijn vervolgers struikelen, en zullen niets bereiken; zij zijn zeer beschaamd geworden, omdat zij niet verstandig gehandeld hebben; het zal een eeuwige schande zijn, ze zal niet vergeten worden.", "Ef 4:4": "Eén lichaam is het, en één Geest, zoals u ook geroepen bent tot één hoop van uw roeping;", "Ps 21:8": "Want de koning vertrouwt op de HEERE, en door de goedertierenheid van de Allerhoogste zal hij niet wankelen.", "Jer 9:21": "Want de dood is geklommen in onze vensters, hij is in onze paleizen gekomen, om de kinderen uit te roeien van de wijken, de jongemannen van de straten.", "Spr 30:12": "Een geslacht dat rein is in zijn eigen ogen, en toch niet gewassen is van zijn vuiligheid;", "1 Tess 4:8": "Wie dan dit verwerpt, verwerpt geen mens, maar God, Die ook Zijn Heilige Geest in ons heeft gegeven.", "Ps 106:47": "Verlos ons, HEERE, onze God! en verzamel ons uit de heidenen, opdat wij de Naam van Uw heiligheid loven, ons beroemend in Uw lof.", "Ex 20:7": "U zult de naam van de HEERE, uw God, niet ijdel gebruiken; want de HEERE zal niet onschuldig houden wie Zijn naam ijdel gebruikt.", "Openb 5:4": "En ik huilde erg, omdat niemand waard bevonden werd om dat boek te openen en te lezen, of erin te zien.", "Hand 27:25": "Daarom, houd moed, mannen, want ik geloof God, dat het zo zal zijn zoals het mij gezegd is.", "Hos 12:9": "Nog zegt Efraïm: Toch ben ik rijk geworden, ik heb voor mij groot goed verkregen; in al mijn arbeid zullen zij mij geen ongerechtigheid vinden, die zonde zou zijn.", "Zach 14:20": "Op die dag zal op de bellen van de paarden staan: DE HEILIGHEID VAN DE HEERE. En de potten in het huis van de HEERE zullen zijn als de sprenkelschalen voor het altaar;", "Job 13:18": "Zie toch, ik heb de zaak ordelijk gesteld; ik weet dat ik rechtvaardig verklaard zal worden.", "Jes 33:2": "HEERE, wees ons genadig, wij hebben op U gewacht; wees hun arm elke morgen, en ook onze redding in tijd van benauwdheid.", "Ps 69:2-4": "Verlos mij, o God! Want de wateren zijn gekomen tot aan mijn ziel. Ik ben gezonken in grondeloze modder, waar men niet kan staan; ik ben gekomen in de diepten van de wateren, en de vloed overstroomt mij. Ik ben vermoeid van mijn roepen, mijn keel is ontstoken, mijn ogen zijn bezweken, terwijl ik hoop op mijn God.", "Hand 8:15-19": "die, toen zij aangekomen waren, voor hen baden, opdat zij de Heilige Geest zouden ontvangen. (Want Hij was nog op niemand van hen gevallen, maar zij waren alleen gedoopt in de Naam van de Heere Jezus.) Toen legden zij hun de handen op, en zij ontvingen de Heilige Geest.", "Job 31:13-15": "Als ik versmaad heb het recht van mijn knecht, of van mijn dienstmaagd, als zij geschil hadden met mij; (Want wat zou ik doen, als God opstond? En als Hij bezoeking deed, wat zou ik Hem antwoorden? Heeft Hij niet, Die mij in de buik maakte, hem ook gemaakt en Een ons in de baarmoeder bereid?)", "Ef 5:15": "Kijk dan goed hoe u voorzichtig wandelt, niet als onwijzen, maar als wijzen,", "Matt 11:28": "Komt hier naar Mij toe, allen die vermoeid en belast zijn, en Ik zal u rust geven.", "Spr 19:1": "De arme, die in zijn oprechtheid wandelt, is beter dan de verkeerde van lippen, en die een dwaas is.", "2 Tim 1:12": "Om deze reden lijd ik ook deze dingen, maar ik word niet beschaamd; want ik weet aan Wie ik geloofd heb, en ik ben verzekerd, dat Hij machtig is mijn pand, bij Hem weggelegd, te bewaren tot die dag.", "Spr 25:27": "Veel honig eten is niet goed; maar het onderzoeken van de eigen eer is geen eer.", "Ps 119:151": "Maar U, HEERE! bent nabij, en al Uw geboden zijn waarheid.", "Joh 14:27": "Vrede laat Ik u na, Mijn vrede geef Ik u; niet zoals de wereld die geeft, geef Ik hem u. Laat uw hart niet ontroerd worden en niet bevreesd zijn.", "Openb 3:19": "Ieder die Ik liefheb, die bestraf en tuchtig Ik; wees dan ijverig, en bekeer u.", "Ps 91:2": "Ik zal tegen de HEERE zeggen: Mijn Toevlucht en mijn Burg! Mijn God, op Wie ik vertrouw!", "Ps 50:15": "En roept Mij aan in de dag van benauwdheid; Ik zal u eruit helpen, en u zult Mij eren.", "Ps 30:11": "Hoor, HEERE! en wees mij genadig; HEERE! wees mij een Helper.", "Luk 7:13": "En de Heere, haar ziende, werd innerlijk met ontferming over haar bewogen, en zei tegen haar: Huil niet.", "Jes 48:10": "Zie, Ik heb u gelouterd, doch niet als zilver, Ik heb u gekeurd in de smeltkroes van de ellende.", "Pred 9:3": "Dit is een kwaad onder alles wat er onder de zon gebeurt, dat eenzelfde lot allen treft, en dat ook het hart van de mensenkinderen vol boosheid is, en dat er in hun leven onzinnigheden zijn in hun hart; en daarna moeten zij naar de doden toe.", "Rom 2:24": "Want de Naam van God wordt om u gelasterd onder de heidenen, zoals geschreven is.", "1 Joh 2:20": "Maar u hebt de zalving van de Heilige, en u weet alle dingen.", "1 Petr 3:16": "en heb een goed geweten, opdat zij die uw goede wandel in Christus belasteren, beschaamd gemaakt worden in datgene waarin zij kwaad van u spreken, alsof u kwaaddoeners bent.", "Spr 15:4": "De medicijn van de tong is een boom van het leven; maar de verkeerdheid daarin is een breuk in de geest.", "Ef 5:9": "(Want de vrucht van de Geest bestaat in alle goedheid, en rechtvaardigheid, en waarheid),", "Jes 51:9": "Ontwaak, ontwaak, trek sterkte aan, Arm van de HEERE! Ontwaak als in de dagen van vroeger, in de geslachten van oude tijden af; bent U het niet, Die Rahab uitgehouwen hebt, Die de zeedraak doorstoken hebt?", "Ezech 5:11": "Daarom, zo waarachtig als Ik leef, spreekt de Heere HEERE (omdat u Mijn heiligdom verontreinigd hebt met al uw verfoeisels, en met al uw gruwelen), zeker zal Ik ook u daarom verminderen, en Mijn oog zal u niet verschonen, en Ik zal ook niet sparen!", "Ps 124:8": "Onze hulp is in de Naam van de HEERE, Die hemel en aarde gemaakt heeft.", "Spr 10:32": "De lippen van de rechtvaardige weten wat welgevallig is; maar de mond van de goddelozen spreekt enkel verkeerdheid.", "Ps 37:32": "Tsade. De goddeloze loert op de rechtvaardige, en zoekt hem te doden.", "Openb 12:18": "En ik stond op het zand van de zee.", "Jes 28:6": "en tot een Geest van het oordeel voor hem die te oordelen zit, en tot een sterkte voor hen die de strijd terugdrijven tot aan de poort toe.", "Matt 12:37": "Want uit uw woorden zult u gerechtvaardigd worden, en uit uw woorden zult u veroordeeld worden.", "Ps 145:5-7": "He. Ik zal uitspreken de heerlijkheid van de eer van Uw majesteit, en Uw wonderlijke daden. Vau. En zij zullen vermelden de kracht van Uw ontzagwekkende daden; en Uw grootheid, die zal ik vertellen. Zain. Zij zullen de gedachtenis van de grootheid van Uw goedheid overvloedig uitstorten, en zij zullen Uw gerechtigheid met gejuich verkondigen.", "Jer 7:4": "Vertrouw niet op valse woorden, en zeg niet: De tempel van de HEERE, de tempel van de HEERE, de tempel van de HEERE, zijn deze!", "1 Sam 16:7": "Doch de HEERE zei tegen Samuël: Kijk niet naar zijn gestalte, en ook niet naar zijn lange lengte, want Ik heb hem verworpen; want het is niet zoals de mens ziet; want de mens kijkt naar wat voor ogen is, maar de HEERE kijkt naar het hart.", "Matt 5:13-16": "U bent het zout der aarde; maar als het zout smakeloos wordt, waarmee zal het gezouten worden? Het deugt nergens meer toe dan om buiten geworpen en door de mensen vertrapt te worden. U bent het licht der wereld; een stad die boven op een berg ligt, kan niet verborgen zijn. Ook steekt men geen kaars aan om die onder een korenmaat te zetten, maar op een kandelaar, en zij schijnt voor allen die in het huis zijn.", "Jes 24:1-16": "Zie, de HEERE maakt het land leeg, en Hij maakt het woest; en Hij keert de gestalte ervan om, en Hij verstrooit zijn inwoners. En zoals het met het volk zal gaan, zo zal het met de priester zijn; zoals met de knecht, zo met zijn heer; zoals met de dienstmaagd, zo met haar vrouw; zoals met de koper, zo met de verkoper; zoals met de lener, zo met de ontlener; zoals met de woekeraar, zo met hem van wie hij woeker ontvangt. Dat land zal helemaal leeg gemaakt worden, en het zal helemaal beroofd worden; want de HEERE heeft dit woord gesproken.", "2 Petr 3:14": "Daarom, geliefden, terwijl u deze dingen verwacht, doe uw best om onbevlekt en onberispelijk door Hem bevonden te worden, in vrede;", "Jes 65:8": "Zo zegt de HEERE: Zoals wanneer men most in een tros druiven vindt, men zegt: Verderf ze niet, want er is een zegen in; zo zal Ik het om Mijn knechten doen, dat Ik hen niet allen verderf.", "1 Petr 5:7": "Werp al uw bekommernis op Hem, want Hij zorgt voor u.", "Jer 17:10": "Ik, de HEERE, doorgrond het hart, en proef de nieren; en dat, om ieder te geven naar zijn wegen, naar de vrucht van zijn handelingen.", "Spr 12:23": "Een schrander mens bedekt de wetenschap; maar het hart van de zotten roept dwaasheid uit.", "Jak 4:3": "U bidt, en u ontvangt niet, omdat u verkeerd bidt, met de bedoeling het in uw lusten door te brengen.", "Spr 25:15": "Een leider wordt door geduld overreed; en een zachte tong breekt het gebeente.", "Hebr 5:7": "Hij heeft, in de dagen van Zijn vlees, gebeden en smekingen geofferd, met sterk geroep en tranen, tot Hem die Hem uit de dood kon verlossen, en Hij is verhoord vanwege Zijn vrees.", "Luk 16:15": "En Hij zei tegen hen: U bent het die uzelf rechtvaardigt voor de mensen; maar God kent uw harten; want wat hoog is onder de mensen, is een gruwel voor God.", "Job 35:2": "Houdt u dat voor recht, dat u gezegd hebt: Mijn gerechtigheid is meer dan die van God?", "Spr 28:20": "Een geheel getrouw man zal overvloedig zijn in zegeningen; maar wie zich haast om rijk te worden, zal niet onschuldig blijven.", "Ps 64:2": "Hoor, o God, mijn stem in mijn geklaag; behoed mijn leven voor de schrik van de vijand.", "Rom 15:18": "Want ik zou niet durven iets zeggen dat Christus niet door mij gewerkt heeft, tot gehoorzaamheid van de heidenen, met woorden en werken;", "Jes 64:8": "Doch nu, HEERE! U bent onze Vader; wij zijn leem, en U bent onze pottenbakker, en wij allen zijn het werk van Uw handen.", "Ps 37:30": "Pe. De mond van de rechtvaardige spreekt wijsheid, en zijn tong spreekt het recht.", "Jes 26:1": "Op die dag zal dit lied gezongen worden in het land Juda: Wij hebben een sterke stad, God stelt heil tot muren en voorschansen.", "Gal 5:23": "Tegen zulke mensen is de wet niet.", "2 Sam 22:2-5": "Hij zei dan: De HEERE is mij mijn Steenrots, en mijn Burg, en mijn Uithelper. God is mijn Rots, ik zal op Hem vertrouwen; mijn Schild en de Hoorn van mijn heil, mijn Hoog Vertrek en mijn Toevlucht, mijn Verlosser! Van geweld hebt U mij verlost! Ik riep de HEERE aan, Die te prijzen is, en ik werd verlost van mijn vijanden.", "Pred 9:17": "De woorden van de wijzen moeten in stilte aangehoord worden, meer dan het geroep van hem die over de dwazen heerst.", "Ps 94:11": "De HEERE kent de gedachten van de mens, dat zij vluchtig zijn.", "Rom 14:17": "Want het Koninkrijk van God is niet eten en drinken, maar rechtvaardigheid, en vrede, en blijdschap, door de Heilige Geest.", "Ps 89:40-52": "Gij hebt het verbond van Uw knecht teniet gedaan; Gij hebt zijn kroon ontheiligd tegen de aarde. Gij hebt al zijn muren doorgebroken; Gij hebt zijn vestingen neergeworpen. Allen die de weg voorbijgingen, hebben hem beroofd; voor zijn naburen is hij tot een smaad geweest.", "Job 19:7": "Zie, ik roep: geweld! maar word niet verhoord; ik schreeuw, maar er is geen recht.", "Dan 11:36": "En die koning zal doen naar zijn welgevallen, en hij zal zichzelf verheffen, en zich groot maken boven elke god, en hij zal tegen de God der goden wonderlijke dingen spreken; en hij zal voorspoedig zijn, totdat de gramschap voltooid is, want het is vast besloten, het zal gebeuren.", "Jes 41:10": "Vrees niet, want Ik ben met u; wees niet verbaasd, want Ik ben uw God; Ik sterk u, ook help Ik u, ook ondersteun Ik u met de rechterhand van Mijn gerechtigheid.", "Openb 3:2": "Wees waakzaam, en versterk het overige, dat dreigde te sterven; want Ik heb uw werken niet vol bevonden voor God.", "Deut 24:18": "Maar u zult gedenken dat u een knecht in Egypte geweest bent, en de HEERE, uw God, heeft u van daar verlost; daarom gebied ik u deze zaak te doen.", "Ex 3:8": "Daarom ben Ik neergekomen, om het te verlossen uit de hand van de Egyptenaren, en het op te voeren uit dit land, naar een goed en ruim land, naar een land dat overvloeit van melk en honing, naar de plaats van de Kanaänieten, en de Hethieten, en de Amorieten, en de Ferezieten, en de Hevieten, en de Jebusieten.", "Ps 25:15": "Ain. Mijn ogen zijn voortdurend op de HEERE, want Hij zal mijn voeten uit het net uitvoeren.", "Ps 85:6-8": "Zult U eeuwig tegen ons toornen? Zult U Uw toorn uitstrekken van geslacht tot geslacht? Zult U ons niet weer levend maken, opdat Uw volk zich in U verblijdt? Toon ons Uw goedertierenheid, o HEERE, en geef ons Uw heil.", "Ps 6:9": "Wijk van mij, alle werkers van de ongerechtigheid; want de HEERE heeft de stem van mijn geween gehoord.", "Ps 108:11-14": "Wie zal mij voeren in een vaste stad? Wie zal mij leiden tot in Edom? Zult U het niet zijn, o God! Die ons verstoten had, en Die niet uittrok, o God! Met onze legers? Geeft U ons hulp uit de benauwdheid; want het heil van de mens is ijdelheid.", "Jes 15:3": "Op hun wegen hebben zij rouwkleding aangegord; op hun daken en op hun pleinen huilen zij allemaal, terwijl zij afdalen met geween.", "Job 29:14": "Ik bekleedde mij met gerechtigheid, en zij bekleedde mij; mijn oordeel was als een mantel en vorstelijke hoed.", "Joh 16:22": "En u hebt dan nu wel droefheid; maar Ik zal u opnieuw zien, en uw hart zal zich verblijden, en niemand zal uw blijdschap van u wegnemen.", "Ps 86:1-17": "Een gebed van David. HEERE! neig Uw oor, verhoor mij; want ik ben ellendig en nooddruftig. Bewaar mijn ziel, want ik ben Uw gunstgenoot, o Gij, mijn God! verlos Uw knecht, die op U vertrouwt. Wees mij genadig, Heere! want ik roep tot U de hele dag.", "Ps 91:1": "Die in de schuilplaats van de Allerhoogste is gezeten, die zal vernachten in de schaduw van de Almachtige.", "Ps 51:14": "Geef mij de vreugde van het heil weer; en de vrijmoedige geest ondersteunt mij.", "Job 16:6-14": "Als ik spreek, wordt mijn smart niet ingehouden; en houd ik op, wat gaat er dan van mij weg? Zeker, Hij heeft mij nu vermoeid; U hebt mijn hele vergadering verwoest. Dat U mij rimpelig gemaakt hebt, is tot een getuige; en mijn magerheid staat tegen mij op, zij getuigt in mijn gezicht.", "Ps 71:16": "Ik zal heengaan in de mogendheden van de Heere HEERE; ik zal Uw gerechtigheid vermelden, de Uwe alleen.", "Micha 6:13": "zo zal Ik u ook slaan met ziekte, u treffend, en u verwoestend om uw zonden.", "Job 4:3": "Zie, u hebt velen onderwezen, en u hebt slappe handen gesterkt;", "Ps 138:3": "Ten dage, als ik riep, hebt Gij mij verhoord; Gij hebt mij versterkt met kracht in mijn ziel.", "Ef 6:14-20": "Sta dan, met uw lenden omgord met de waarheid, en aangedaan met het borstwapen van de gerechtigheid; en de voeten geschoeid met bereidheid van het Evangelie van de vrede; bovenal aangenomen hebbende het schild van het geloof, waarmee u al de vurige pijlen van de boze zult kunnen uitblussen.", "Spr 10:14": "De wijzen leggen kennis weg; maar de mond van de dwaas is de ondergang nabij.", "Ps 119:77": "Laat mij Uw barmhartigheden overkomen, opdat ik leve, want Uw wet is al mijn vermaking.", "Job 11:11": "Want Hij kent de ijdele mensen, en Hij ziet de ondeugd; zou Hij dan niet opmerken?", "Spr 30:7-9": "Twee dingen heb ik van U gevraagd, onthoud ze mij niet, voordat ik sterf; Ijdelheid en leugentaal, doe die ver van mij; armoede of rijkdom, geef mij niet; voed mij met het brood dat mij toebedeeld is; Opdat ik, als ik verzadigd ben, U dan niet verloochent, en zeg: Wie is de HEERE? of dat ik, als ik arm geworden ben, dan niet steel, en de Naam van mijn God aantast.", "Luk 15:2": "En de Farizeeën en de Schriftgeleerden mopperden en zeiden: Deze man ontvangt de zondaars, en eet met hen.", "Ef 1:12-14": "Opdat wij zouden zijn tot prijs van Zijn heerlijkheid, wij, die eerst op Christus gehoopt hebben. In Wie ook u zijt, nadat u het woord der waarheid, namelijk het Evangelie van uw zaligheid, gehoord hebt; in Wie u ook, nadat u geloofd hebt, verzegeld bent geworden met de Heilige Geest der belofte; Die het onderpand is van onze erfenis, tot de verkregen verlossing, tot prijs van Zijn heerlijkheid.", "2 Kor 1:4": "Die ons vertroost in al onze verdrukking, opdat wij zouden kunnen vertroosten degenen die in allerlei verdrukking zijn, door de vertroosting waarmee wij zelf door God vertroost worden.", "Job 35:7": "Als u rechtvaardig bent, wat geeft u Hem, of wat ontvangt Hij uit uw hand?", "Gen 2:17": "Maar van de boom van de kennis van goed en kwaad, daarvan mag u niet eten; want op de dag dat u daarvan eet, zult u de dood sterven.", "1 Petr 1:12": "Aan hen is geopenbaard dat zij niet zichzelf, maar ons dienden met deze dingen, die u nu aangekondigd zijn door hen die u het Evangelie verkondigd hebben door de Heilige Geest, Die van de hemel gezonden is; dingen waar de engelen graag een blik in willen werpen.", "Ps 22:2-22": "Mijn God, mijn God! Waarom hebt U mij verlaten, ver zijnde van mijn verlossing, van de woorden van mijn brullen? Mijn God! Ik roep overdag, maar U antwoordt niet; en 's nachts, en ik heb geen stilte. Doch U bent heilig, wonende onder de lofzangen van Israël.", "Pred 3:7": "Een tijd om te scheuren, en een tijd om toe te naaien; een tijd om te zwijgen, en een tijd om te spreken;", "Hos 13:14": "Toch zal Ik hen verlossen van de macht van het graf, Ik zal hen vrijmaken van de dood: o dood, waar zijn uw pestilentiën? Graf, waar is uw verderf? Berouw zal voor Mijn ogen verborgen zijn,", "1 Tim 1:5": "Maar het doel van het gebod is liefde uit een rein hart, en uit een goed geweten, en uit een ongeveinsd geloof.", "2 Kor 11:20": "Want u verdraagt het, als iemand u dienstbaar maakt, als iemand u opeet, als iemand van u neemt, als iemand zich verheft, als iemand u in het gezicht slaat.", "Matt 1:18": "De geboorte van Jezus Christus was nu als volgt. Toen Maria, Zijn moeder, met Jozef in ondertrouw was, bleek zij, voordat zij samengekomen waren, zwanger te zijn uit de Heilige Geest.", "Jak 4:4": "Overspelers en overspeleressen, weet u niet dat de vriendschap met de wereld vijandschap tegen God is? Wie dan ook een vriend van de wereld wil zijn, wordt daarmee een vijand van God.", "Spr 21:23": "Wie zijn mond en zijn tong bewaart, bewaart zijn ziel van benauwdheden.", "1 Tim 2:1": "Ik vermaan dan voor alle dingen, dat er smekingen, gebeden, voorbiddingen en dankzeggingen gedaan worden voor alle mensen;", "1 Tim 3:9": "mensen die de verborgenheid van het geloof vasthouden in een rein geweten.", "Ex 17:4": "Toen riep Mozes tot de HEERE en zei: Wat moet ik met dit volk doen? Het scheelt niet veel, of zij zullen mij stenigen.", "Ps 115:12-14": "De HEERE is aan ons indachtig geweest, Hij zal zegenen; Hij zal het huis van Israël zegenen, Hij zal het huis van Aäron zegenen. Hij zal zegenen wie de HEERE vrezen, de kleinen met de groten. De HEERE zal de zegen over u vermeerderen, over u en over uw kinderen.", "1 Kor 15:58": "Daarom, mijn geliefde broeders! Wees standvastig, onwankelbaar, altijd overvloedig in het werk van de Heere, in de wetenschap dat uw arbeid niet tevergeefs is in de Heere.", "1 Sam 15:24-26": "Toen zei Saul tegen Samuël: Ik heb gezondigd, omdat ik het bevel van de HEERE en uw woorden overtreden heb; want ik heb het volk gevreesd en naar hun stem geluisterd. Nu dan, vergeef mij toch mijn zonde, en keer met mij terug, dat ik de HEERE aanbid. Doch Samuël zei tegen Saul: Ik zal niet met u terugkeren; omdat u het woord van de HEERE verworpen hebt, zo heeft de HEERE u verworpen, dat u geen koning over Israël meer zult zijn.", "Ef 5:16": "en koop de tijd uit, omdat de dagen slecht zijn.", "2 Kron 14:11": "En Asa riep tot de HEERE, zijn God, en zei: HEERE, het is voor U niets, te helpen hetzij de machtige, hetzij de krachteloze; help ons, o HEERE, onze God! Want wij steunen op U, en in Uw Naam zijn wij gekomen tegen deze menigte; o HEERE! U bent onze God; laat een sterfelijk mens tegen U niets vermogen.", "Ps 59:11": "De God van mijn goedertierenheid zal mij voor zijn; God zal mij op mijn verspieders doen zien.", "Jes 38:10-13": "Ik zei: Vanwege het afsnijden van mijn dagen zal ik naar de poorten van het graf gaan, ik word beroofd van wat er nog over is van mijn jaren. Ik zei: Ik zal de HEERE niet meer zien, de HEERE, in het land van de levenden; ik zal de mensen niet meer aanschouwen met de inwoners van de wereld. Mijn levenstijd is weggetrokken, en van mij weggevoerd als de tent van een herder; ik heb mijn leven afgesneden, zoals een wever zijn weefsel; Hij zal mij afsnijden, als van de drom; van de dag tot de nacht zult U mij ten einde gebracht hebben.", "Pred 7:1": "Beter is een goede naam dan goede olie, en de dag van de dood dan de dag dat iemand geboren wordt.", "1 Sam 7:5-8": "Verder zei Samuël: Verzamel heel Israël naar Mizpa, en ik zal de HEERE voor u bidden. En zij werden verzameld te Mizpa, en zij schepten water en goten het uit voor het aangezicht van de HEERE; en zij vastten die dag, en zeiden daar: Wij hebben tegen de HEERE gezondigd. Zo richtte Samuël de kinderen van Israël te Mizpa. Toen de Filistijnen hoorden dat de kinderen van Israël zich verzameld hadden te Mizpa, kwamen de leiders van de Filistijnen op tegen Israël. Toen de kinderen van Israël dat hoorden, werden zij bang voor de Filistijnen.", "Joz 24:15": "Doch als het kwaad is in uw ogen om de HEERE te dienen, kies heden wie u dienen zult; hetzij de goden die uw vaders, die aan de andere kant van de rivier waren, gediend hebben, of de goden van de Amorieten, in wiens land u woont; maar wat mij en mijn huis aangaat, wij zullen de HEERE dienen!", "Jes 40:1": "Troost, troost Mijn volk, zal uw God zeggen.", "Ps 7:6": "Laat dan de vijand mijn ziel vervolgen, en achterhaalt haar, en vertreedt mijn leven ter aarde, en mijn eer in het stof doet wonen! Sela.", "Ps 44:18-22": "Dit alles is ons overkomen, toch hebben wij U niet vergeten, en niet vals gehandeld tegen Uw verbond. Ons hart is niet achterwaarts gekeerd, en onze gang niet geweken van Uw pad. Hoewel U ons verpletterd hebt in een plaats van de draken, en ons met een doodsschaduw bedekt hebt.", "1 Petr 2:21-24": "Want hiertoe bent u geroepen, omdat ook Christus voor ons geleden heeft, ons een voorbeeld nalatend, opdat u Zijn voetstappen zou navolgen; Die geen zonde gedaan heeft, en in Zijn mond is geen bedrog gevonden; Die, toen Hij uitgescholden werd, niet terugschold, en toen Hij leed, niet dreigde; maar het overgaf aan Hem Die rechtvaardig oordeelt;", "Job 33:8": "Zeker, u hebt gezegd voor mijn oren, en ik heb de stem der woorden gehoord;", "Ezech 33:24-26": "Mensenkind! De inwoners van die verwoeste plaatsen in het land van Israël zeggen: Abraham was maar één man, en bezat dit land erfelijk; maar wij zijn met velen; het land is ons gegeven tot erfelijk bezit. Daarom, zeg tegen hen: Zo zegt de Heere HEERE: U eet vlees met het bloed, en heft uw ogen op naar uw drekgoden, en vergiet bloed; en zou u het land dan erfelijk bezitten? U vertrouwt op uw zwaard; u doet gruwelijke dingen, en ieder van u verontreinigt de vrouw van zijn naaste; en zou u het land dan erfelijk bezitten?", "1 Kor 3:20": "En opnieuw: De Heere kent de overleggingen van de wijzen, dat zij nutteloos zijn.", "Rom 8:35-39": "Wie zal ons scheiden van de liefde van Christus? Verdrukking, of benauwdheid, of vervolging, of honger, of naaktheid, of gevaar, of het zwaard? (Zoals geschreven is: Want om Uwentwil worden wij de hele dag gedood; wij worden gerekend als schapen die geslacht worden.) Maar in dit alles zijn wij meer dan overwinnaars, door Hem Die ons heeft liefgehad.", "Openb 16:21": "En een grote hagel, elke hagelsteen ongeveer een talent zwaar, viel neer uit de hemel op de mensen; en de mensen lasterden God vanwege de plaag van de hagel; want die plaag was zeer groot.", "Hab 2:2": "Toen antwoordde de HEERE mij, en zei: Schrijf het visioen op, en zet het duidelijk op tafels, zodat wie voorbijloopt het kan lezen.", "Ps 119:27": "Geef mij de weg van Uw bevelen te verstaan, opdat ik Uw wonderen betracht.", "Openb 11:11": "En na die drie dagen en een halve is een geest van leven uit God in hen gegaan; en zij stonden op op hun voeten; en er is grote vrees gevallen op hen die hen aanschouwden.", "Ps 39:8": "En nu, wat verwacht ik, Heere? Mijn hoop is op U.", "1 Joh 5:16": "Als iemand zijn broeder een zonde ziet doen die niet tot de dood is, die zal God bidden en Hij zal hem het leven geven, aan hen namelijk die zondigen niet tot de dood. Er is een zonde tot de dood; voor die zonde zeg ik niet dat hij moet bidden.", "2 Kor 4:2": "Maar wij hebben de bedekselen der schande verworpen, en wandelen niet in arglistigheid, en vervalsen ook het Woord van God niet, maar door openbaring van de waarheid maken wij onszelf aangenaam bij ieder geweten van de mensen, in de tegenwoordigheid van God.", "Job 32:8": "Zeker, de geest die in de mens is, en de inblazing van de Almachtige, maakt hen verstandig.", "Jes 52:5": "En nu, wat heb Ik hier te doen? spreekt de HEERE, omdat Mijn volk voor niets is weggenomen, en degenen die over hen heersen, hen laten huilen, spreekt de HEERE, en Mijn Naam voortdurend de hele dag gelasterd wordt;", "2 Kron 33:12": "En toen hij in nood verkeerde, zocht hij het aangezicht van de HEERE, zijn God, met ernst, en vernederde zich zeer voor het aangezicht van de God van zijn vaderen,", "Ps 7:7": "Sta op, HEERE, in Uw toorn, verhef U om de woede van hen die mij benauwen, en ontwaak tot mij; U hebt het oordeel bevolen.", "Job 20:3": "Ik heb een bestraffing gehoord die mij tot schande maakt; maar de geest uit mijn verstand zal voor mij antwoorden.", "Mark 6:56": "En waar Hij ook kwam, in dorpen, of steden, of gehuchten, daar legden zij de zieken op de markten, en smeekten Hem dat zij slechts de zoom van Zijn kleed mochten aanraken; en zovelen als Hem aanraakten, werden gezond.", "Ps 145:12": "Lamed. Om aan de mensenkinderen bekend te maken Zijn machtige daden, en de eer van de heerlijkheid van Zijn Koninkrijk.", "Tit 2:14": "Die Zichzelf voor ons gegeven heeft, opdat Hij ons zou verlossen van alle ongerechtigheid, en Zichzelf een eigen volk zou reinigen, ijverig in goede werken.", "2 Tim 1:7": "Want God heeft ons niet een geest van vreesachtigheid gegeven, maar van kracht, en van liefde, en van gematigdheid.", "Job 11:4-6": "Want u hebt gezegd: Mijn leer is zuiver, en ik ben rein in uw ogen. Maar zeker, och, of God sprak, en Zijn lippen tegen u opende; En u bekend maakte de verborgenheden van de wijsheid, omdat zij dubbel zijn in wezen! Weet daarom, dat God voor u minder rekent van uw ongerechtigheid dan die verdient.", "Ps 82:2": "Hoelang zult u onrecht oordelen, en het aangezicht van de goddelozen aannemen? Sela.", "Ps 35:21": "En zij sperren hun mond wijd open tegen mij; zij zeggen: Ha, ha, ons oog heeft het gezien!", "Jes 40:2": "Spreekt naar het hart van Jeruzalem, en roept haar toe, dat haar strijd vervuld is, dat haar ongerechtigheid verzoend is, dat zij van de hand van de HEERE dubbel ontvangen heeft voor al haar zonden.", "Jes 32:15": "Totdat over ons de Geest uit de hoogte uitgegoten wordt; dan zal de woestijn tot een vruchtbaar veld worden, en het vruchtbare veld zal voor een woud gerekend worden.", "Job 32:1": "Toen hielden de drie mannen op Job te antwoorden, omdat hij in zijn eigen ogen rechtvaardig was.", "2 Sam 22:21": "De HEERE vergold mij naar mijn gerechtigheid; Hij gaf mij weer naar de reinheid van mijn handen.", "Spr 28:26": "Wie op zijn eigen hart vertrouwt, die is een dwaas; maar wie in wijsheid wandelt, die zal ontkomen.", "Spr 15:28": "Het hart van de rechtvaardige bedenkt zich, om te antwoorden; maar de mond van de goddelozen stort overvloedig kwade dingen uit.", "2 Tim 4:16": "Bij mijn eerste verantwoording is niemand bij mij geweest, maar allen hebben mij verlaten. Het moet hun niet worden toegerekend.", "Zef 1:12": "En het zal gebeuren in die tijd, Ik zal Jeruzalem met lantaarns doorzoeken; en Ik zal bezoeking doen over de mannen die star geworden zijn op hun droesem, die in hun hart zeggen: De HEERE doet geen goed, en Hij doet geen kwaad.", "Joh 6:63": "De Geest is het Die levend maakt; het vlees heeft geen nut. De woorden die Ik tot u spreek, zijn geest en zijn leven.", "Rom 15:19": "door kracht van tekenen en wonderen, en door de kracht van de Geest van God, zodat ik, van Jeruzalem af en rondom, tot Illyricum toe, het Evangelie van Christus vervuld heb.", "Ef 5:18": "En word niet dronken van wijn, waarin overdaad is, maar word vervuld met de Geest,", "Job 11:3": "Zouden uw leugens de mensen doen zwijgen, en zou u spotten, en zou niemand u beschamen?", "2 Tim 1:10": "Doch nu geopenbaard is door de verschijning van onze Zaligmaker Jezus Christus, Die de dood tenietgedaan heeft, en het leven en de onvergankelijkheid aan het licht gebracht heeft door het Evangelie;", "Deut 5:5": "(ik stond in die tijd tussen de HEERE en tussen u, om u het woord van de HEERE bekend te maken; want u was bang voor het vuur en klom niet op de berg) en Hij zei:", "Ps 102:10": "Want ik eet as als brood, en vermeng mijn drank met tranen.", "Pred 3:16": "Verder heb ik ook gezien onder de zon, op de plaats van het gericht, daar was goddeloosheid; en op de plaats van de gerechtigheid, daar was goddeloosheid.", "Ps 112:4": "Zain. Voor de oprechten gaat het licht op in de duisternis; Cheth. Hij is genadig, en barmhartig, en rechtvaardig.", "Ps 69:5": "Die mij zonder oorzaak haten, zijn meer dan de haren van mijn hoofd; die mij zoeken te vernielen, die mij om valse oorzaken vijand zijn, zijn machtig geworden; wat ik niet geroofd heb, moet ik dan teruggeven.", "Job 1:2": "En hem werden zeven zonen en drie dochters
