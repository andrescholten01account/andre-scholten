nt opgevaren in de hoogte; U hebt de gevangenis gevankelijk weggevoerd; U hebt gaven genomen om uit te delen onder de mensen; ja, ook de opstandigen, om bij U te wonen, o HEERE God!", "Zach 5:4": "Ik breng deze vloek naar buiten, spreekt de HEERE van de heerscharen, dat hij komt in het huis van de dief, en in het huis van hem die bij Mijn Naam vals zweert; en hij zal midden in zijn huis overnachten, en hij zal het verteren, met zijn hout en zijn stenen.", "Jes 33:12": "En de volken zullen zijn als de verbrandingen van het kalk; als afgehouwen doornen zullen zij met het vuur verbrand worden.", "Ps 88:9": "Mijn bekenden hebt U ver van mij weggedaan, U hebt mij hun tot een grote gruwel gesteld; ik ben opgesloten en kan niet uitkomen.", "Ps 9:6": "Gij hebt de heidenen gescholden, de goddeloze verdaan, hun naam uitgedelgd, tot in eeuwigheid en altoos.", "Ps 119:151": "Maar U, HEERE! bent nabij, en al Uw geboden zijn waarheid.", "Deut 28:25-68": "De HEERE zal geven dat u verslagen wordt voor uw vijanden; door één weg zult u tegen hem uittrekken, en door zeven wegen zult u voor hem vluchten; en u zult heen en weer gedreven worden onder alle koninkrijken van de aarde. En uw dode lichaam zal voedsel zijn voor alle vogels van de hemel, en voor de dieren van de aarde; en niemand zal ze verjagen. De HEERE zal u slaan met zweren van Egypte, en met gezwellen, en met droge schurft, en met huiduitslag, waarvan u niet zult kunnen genezen.", "Openb 19:17-21": "En ik zag een engel, staande in de zon; en hij riep met een grote stem, en zei tegen alle vogels, die in het midden van de hemel vlogen: Kom hierheen, en verzamel u tot het avondmaal van de grote God; Opdat u eet het vlees van de koningen, en het vlees van de aanvoerders over duizend, en het vlees van de sterken, en het vlees van de paarden en van hen die daarop zitten; en het vlees van alle vrijen en dienstknechten, en kleinen en groten. En ik zag het beest, en de koningen van de aarde, en hun legers verzameld, om krijg te voeren tegen Hem, Die op het paard zat, en tegen Zijn legers.", "Jer 44:23": "Vanwege dat u wierook gebrand hebt, en dat u tegen de HEERE gezondigd hebt, en de stem van de HEERE niet gehoorzaam bent geweest, en in Zijn wet en in Zijn inzettingen, en in Zijn getuigenissen niet hebt gewandeld; daarom is u dit kwaad overkomen, zoals het is op deze dag.", "Jes 59:16-18": "Omdat Hij zag dat er niemand was, ontzette Hij Zich, omdat er geen voorbidder was; daarom bracht Zijn arm Hem heil, en Zijn gerechtigheid ondersteunde Hem. Want Hij trok gerechtigheid aan als een pantser, en de helm van het heil zette Hij op Zijn hoofd, en de kleren van de wraak trok Hij aan als kleding, en Hij deed de ijver aan als een mantel. Naar de werken, daarnaar zal Hij vergelden: grimmigheid aan Zijn tegenstanders, vergelding aan Zijn vijanden; aan de eilanden zal Hij het loon vergelden.", "Ps 58:11": "De rechtvaardige zal zich verblijden, als hij de wraak aanschouwt; hij zal zijn voeten wassen in het bloed van de goddeloze.", "Matt 8:9": "Want ik ben ook een mens onder het gezag van anderen, en heb soldaten onder mij; en ik zeg tegen deze: Ga! en hij gaat; en tegen de ander: Kom! en hij komt; en tegen mijn dienstknecht: Doe dit! en hij doet het.", "Ps 1:4-6": "Zo zijn de goddelozen niet, maar als het kaf dat de wind wegdrijft. Daarom zullen de goddelozen niet standhouden in het gericht, noch de zondaars in de vergadering van de rechtvaardigen. Want de HEERE kent de weg van de rechtvaardigen; maar de weg van de goddelozen zal vergaan.", "Hand 17:32": "Toen zij nu van de opstanding van de doden hoorden, spotten sommigen daarmee; en sommigen zeiden: Wij zullen u hierover een andere keer horen.", "Spr 16:5": "Ieder die hoog van hart is, is de HEERE een gruwel; al slaat hij de handen ineen, hij zal niet onschuldig blijven.", "Jak 3:6-8": "De tong is ook een vuur, een wereld van ongerechtigheid; zo is de tong onder onze leden gesteld, die het hele lichaam besmet, en de loop van ons leven in vuur zet, en zelf vanuit de hel in vuur gezet wordt. Want elke soort dieren, zowel van de wilde dieren als van de vogels, zowel van de kruipende dieren als van de zeedieren, wordt getemd en is getemd door de menselijke natuur. Maar de tong kan geen mens temmen; zij is een onbedwingbaar kwaad, vol dodelijk gif.", "Jer 32:30": "Want de kinderen van Israël en de kinderen van Juda hebben van hun jeugd af alleen maar gedaan wat kwaad was in Mijn ogen; want de kinderen van Israël hebben Mij door het werk van hun handen alleen maar vertoornd, spreekt de HEERE.", "Spr 25:17": "Spaar uw voet voor het huis van uw naaste, opdat hij niet zat van u wordt, en u haat.", "Job 39:35": "Is het twisten met de Almachtige onderrichten? Wie God bestraft, die antwoordt daarop.", "Joh 7:34": "U zult Mij zoeken en u zult Mij niet vinden; en waar Ik ben, kunt u niet komen.", "Job 42:2": "Ik weet, dat U alles vermag, en dat geen van Uw gedachten kan afgesneden worden.", "Nahum 1:2": "Een ijverig God en een wreker is de HEERE, een wreker is de HEERE, en zeer grimmig; een wreker is de HEERE aan Zijn tegenstanders, en Hij bewaart de toorn voor Zijn vijanden.", "Micha 7:6": "Want de zoon veracht de vader, de dochter staat op tegen haar moeder, de schoondochter tegen haar schoonmoeder; iemands vijanden zijn zijn huisgenoten.", "Ps 73:24": "U zult mij leiden door Uw raad; en daarna zult U mij in heerlijkheid opnemen.", "Deut 11:28": "Maar de vloek, als u niet zult horen naar de geboden van de HEERE, uw God, en afwijkt van de weg, die ik u heden gebied, om andere goden na te wandelen, die u niet gekend hebt.", "Tit 2:9": "Vermaan de dienstknechten dat zij hun eigen heren onderdanig zijn, dat zij in alles welgevallig zijn, niet tegensprekend;", "Jak 5:20": "Laat die weten, dat wie een zondaar van de dwaling van zijn weg bekeert, een ziel van de dood zal behouden, en een menigte van zonden zal bedekken.", "Matt 5:37": "maar laat uw woord zijn: ja, ja; nee, nee; wat meer is dan dit, is uit de boze.", "Ps 38:12": "Mijn liefhebbers en mijn vrienden blijven staan tegenover mijn plaag, en mijn naaste familie blijft ver weg staan.", "Ps 104:35": "De zondaars zullen van de aarde weggevaagd worden, en de goddelozen zullen niet meer zijn. Loof de HEERE, mijn ziel! Hallelujah!", "Job 13:26": "Want U schrijft bittere dingen tegen mij, en U doet mij de misdaden van mijn jeugd erven.", "Jes 9:17": "Want de goddeloosheid brandt als vuur, doornen en distels zal zij verteren, en zal aansteken de verwarde struiken van het woud, die zich verheven hebben als de verheffing van de rook.", "Job 3:1-26": "Daarna opende Job zijn mond, en vervloekte zijn dag. Want Job antwoordde en zei: De dag verga, waarop ik geboren ben, en de nacht waarin men zei: Een knechtje is ontvangen.", "Job 34:9": "Want hij heeft gezegd: Het baat een man niet, als hij welbehagen heeft aan God.", "Job 13:7-11": "Zult u voor God onrecht spreken, en zult u voor Hem bedriegerij spreken? Zult u Zijn aangezicht aannemen? Zult u voor God twisten? Zal het goed zijn, als Hij u zal onderzoeken? Zult u met Hem spotten, zoals men met een mens spot?", "Klaagl 1:7": "Zain. Jeruzalem is, in de dagen van haar ellende en haar veelvuldige ballingschap, indachtig geworden aan al haar gewenste dingen, die zij van oude dagen af gehad heeft; omdat haar volk door de hand van de tegenstander valt, en zij geen helper heeft; de tegenstanders zien haar aan, zij spotten met haar rustdagen.", "Job 31:14": "(Want wat zou ik doen, als God opstond? En als Hij bezoeking deed, wat zou ik Hem antwoorden?", "Klaagl 3:8": "Gimel. Ook wanneer ik roep en schreeuw, sluit Hij Zijn oren voor mijn gebed.", "Ps 39:8": "En nu, wat verwacht ik, Heere? Mijn hoop is op U.", "Jes 26:21": "Want zie, de HEERE zal uit Zijn plaats uitgaan, om de ongerechtigheid van de inwoners van de aarde over hen te bezoeken; en de aarde zal haar bloed onthullen, en zal haar gedoden niet langer bedekt houden.", "Matt 26:24": "De Zoon des mensen gaat wel heen, zoals over Hem geschreven is eg u, wees bang voor Hem!", "Job 31:32": "De vreemdeling overnachtte niet op de straat; mijn deuren opende ik naar de weg;", "Pred 10:20": "Vloek de koning niet, zelfs niet in uw gedachten, en vloek de rijke niet in het binnenste van uw slaapkamer; want het gevogelte des hemels zou de stem wegvoeren, en het gevleugelde zou het woord bekendmaken.", "Ps 32:10": "De goddeloze heeft veel smarten, maar wie op de HEERE vertrouwt, die zal de goedertierenheid omringen.", "Hand 27:25": "Daarom, houd moed, mannen, want ik geloof God, dat het zo zal zijn zoals het mij gezegd is.", "Ps 71:1": "Op U, o HEERE! vertrouw ik; laat mij niet beschaamd worden in eeuwigheid.", "Ps 11:6": "Hij zal op de goddelozen strikken doen regenen, vuur en zwavel; en een geweldige stormwind zal het deel van hun beker zijn.", "Ps 144:11": "Bevrijd mij en red mij van de hand van vreemden, wier mond leugens spreekt, en wier rechterhand een rechterhand van bedrog is;", "Ps 69:13": "Die in de poort zitten, praten over mij; en ik ben een lied voor hen die sterke drank drinken.", "Ps 46:8": "De HEERE van de heerscharen is met ons; de God van Jakob is ons een Hoog Vertrek. Sela.", "Matt 25:33": "En Hij zal de schapen aan Zijn rechterhand zetten, maar de bokken aan Zijn linkerhand.", "Ps 90:15": "Verblijd ons naar de dagen, waarin U ons gedrukt hebt, naar de jaren, waarin wij het kwaad gezien hebben.", "Job 30:30": "Mijn huid is zwart geworden over mij, en mijn gebeente is ontstoken van dorheid.", "Matt 23:33": "Slangen, addergebroed! Hoe zou u de helse verdoemenis ontvluchten?", "Ps 35:7": "Want zij hebben zonder oorzaak de groeve van hun net voor mij verborgen; zij hebben zonder oorzaak gegraven voor mijn ziel.", "Openb 18:5": "Want haar zonden zijn de een na de ander gevolgd tot aan de hemel toe, en God is haar ongerechtigheden gaan gedenken.", "Ps 5:6": "De onzinnigen zullen voor Uw ogen niet bestaan; U haat alle werkers van de ongerechtigheid.", "Ps 10:11": "Hij zegt in zijn hart: God heeft het vergeten  "Ex 32:16": "En diezelfde tafelen waren het werk van God; het schrift was ook het schrift van God zelf, in de tafelen gegraveerd.", "Rom 3:13": "Hun keel is een geopend graf; met hun tongen plegen zij bedrog; slangenvenijn is onder hun lippen.", "Job 36:8-12": "En als zij, gebonden met boeien, vastgehouden worden met banden van ellende; Dan maakt Hij hun hun daden bekend, en hun overtredingen, omdat zij de overhand genomen hebben; En Hij opent hun oor voor de tucht, en zegt dat zij zich van de ongerechtigheid moeten bekeren.", "2 Kron 13:11": "En zij steken voor de HEERE brandoffers aan, op elke morgen en op elke avond, ook reukwerk van welriekende specerijen, met de bereiding van het brood op de reine tafel, en de gouden kandelaar en zijn lampen, om die elke avond te laten branden; want wij nemen de wacht van de HEERE, onze God, waar; maar u hebt Hem verlaten.", "Joh 5:14": "Daarna vond Jezus hem in de tempel, en zei tegen hem: Zie, u bent gezond geworden; zondig niet meer, opdat u niet iets ergers overkomt.", "Job 19:25-27": "Want ik weet: mijn Verlosser leeft, en Hij zal als de laatste over het stof opstaan; En als zij na mijn huid dit doorknaagd zullen hebben, zal ik uit mijn vlees God aanschouwen; Aan Wie ik voor mij aanschouwen zal, en mijn ogen zien zullen, en niet een vreemde; mijn nieren verlangen zeer in mijn schoot.", "Lev 26:16-39": "Dan zal Ik u dit ook doen: Ik zal over u schrik stellen, tering en koorts, die de ogen verteren en de ziel pijnigen; u zult ook uw zaad tevergeefs zaaien, en uw vijanden zullen dat opeten. Daartoe zal Ik Mijn aangezicht tegen u zetten, zodat u geslagen zult worden voor het aangezicht van uw vijanden; en uw haters zullen over u heersen, en u zult vluchten, ook al vervolgt u niemand. En als u Mij ook na deze dingen niet zult horen, zal Ik nog daaraan toedoen, om u zevenvoudig over uw zonden te tuchtigen.", "Ps 119:119": "U doet alle goddelozen van de aarde weg als schuim, daarom heb ik Uw getuigenissen lief.", "Job 7:2-6": "Zoals de dienstknecht hijgt naar de schaduw, en zoals de dagloner uitkijkt naar zijn werkloon; Zo zijn mij maanden van ijdelheid ten erve geworden, en nachten van moeite zijn mij voorbereid. Als ik ga liggen om te slapen, dan zeg ik: Wanneer zal ik opstaan, en heeft Hij de avond afgemeten? En ik word verzadigd van woelingen tot aan de schemertijd.", "Job 29:20": "Mijn heerlijkheid was nieuw bij mij, en mijn boog vernieuwde zich in mijn hand.", "Jes 56:1": "Zo zegt de HEERE: Bewaar het recht en doe gerechtigheid; want Mijn heil is nabij om te komen, en Mijn gerechtigheid om geopenbaard te worden.", "Ps 42:7": "O mijn God! Mijn ziel buigt zich neer in mij, daarom denk ik aan U vanuit het land van de Jordaan en de Hermon, vanuit het kleine gebergte.", "Zach 5:3": "Toen zei Hij tegen mij: Dit is de vloek die uitgaan zal over heel het land; want ieder die steelt, zal hiervandaan, volgens deze vloek, uitgeroeid worden; en ieder die valselijk zweert, zal hiervandaan, volgens deze vloek, uitgeroeid worden.", "Spr 25:19": "Het vertrouwen op een trouweloze, op de dag van benauwdheid, is als een gebroken tand en een verstuikte voet.", "2 Kon 2:23": "En hij ging vandaar op naar Beth-el. Toen hij nu de weg opging, kwamen er kleine jongens uit de stad; die bespotten hem, en zeiden tegen hem: Kaalkop, ga op, kaalkop, ga op!", "Ps 35:14": "Ik ging steeds als een vriend, als was hij mij een broeder geweest; ik ging gebukt in het zwart, als iemand die over zijn moeder treurt.", "Rom 1:30": "kwaadsprekers, lasteraars, haters van God, smaders, hoogmoedigen, laatdunkende, vinders van kwade dingen, ongehoorzaam aan hun ouders;", "Ps 31:12": "Vanwege al mijn wederpartijders ben ik, ook voor mijn buren, zeer tot een smaad geworden, en voor mijn bekenden tot een schrik; die mij op de straten zien, vluchten van mij weg.", "Jes 57:21": "De goddelozen, zegt mijn God, hebben geen vrede.", "Rom 1:3": "over Zijn Zoon, Die geworden is uit het geslacht van David, naar het vlees;", "Spr 3:12": "Want de HEERE kastijdt hem die Hij liefheeft, ja, zoals een vader de zoon in wie hij een welbehagen heeft.", "Jes 26:17": "Zoals een zwangere vrouw, als zij nadert tot het baren, smarten heeft en schreeuwt in haar weeën, zo zijn wij geweest, o HEERE, vanwege Uw aangezicht.", "Ezech 22:7": "Vader en moeder hebben zij in u licht geacht; met de vreemdeling hebben zij in uw midden door verdrukking gehandeld; zij hebben in u de wees en de weduwe verdrukt.", "Pred 7:17": "Wees niet al te goddeloos, en wees ook niet al te dwaas; waarom zou u sterven vóór uw tijd?", "Spr 15:4": "De medicijn van de tong is een boom van het leven; maar de verkeerdheid daarin is een breuk in de geest.", "Tit 2:10": "Niet ontvreemdend, maar alle goede trouw bewijzend; opdat zij de leer van God, onze Zaligmaker, in alles sieren.", "2 Kor 4:7-12": "Maar wij hebben deze schat in aarden vaten, opdat de uitnemendheid van de kracht van God zou zijn, en niet uit ons; Als mensen die in alles verdrukt worden, maar niet benauwd; twijfelmoedig, maar niet mismoedig; Vervolgd, maar daarin niet verlaten; neergeworpen, maar niet verdorven;", "Pred 4:9-12": "Twee zijn beter dan een; want zij hebben een goede beloning voor hun moeite; Want als zij vallen, richt de een zijn metgezel op; maar wee de ene die gevallen is, want er is geen tweede om hem op te helpen. Ook, als twee samen liggen, hebben zij warmte; maar hoe zou iemand alleen warm worden?", "Pred 7:2-4": "Het is beter te gaan in het klaaghuis, dan te gaan in het huis van het maaltijd; want daarin is het einde van alle mensen, en de levende legt het in zijn hart. Het treuren is beter dan het lachen; want door de droefheid van het aangezicht wordt het hart gebeterd. Het hart van de wijzen is in het klaaghuis; maar het hart van de dwazen in het huis van de vreugde.", "Ezech 11:21": "Maar van hen wier hart het hart van hun verfoeiselen en hun gruwelen navolgt, zal Ik de weg daarvan op hun hoofd geven, spreekt de Heere HEERE.", "Ps 70:4": "Laat hen terugkeren tot het Leven is geopenbaard, en wij hebben het gezien, en wij getuigen, en verkondigen u dat eeuwige Leven, Dat bij de Vader was, en ons geopenbaard is.) Wat wij dan gezien en gehoord hebben, dat verkondigen wij u, opdat ook u met ons gemeenschap zou hebben, en deze onze gemeenschap ook is met de Vader, en met Zijn Zoon Jezus Christus.", "Ezech 33:17-20": "Toch zeggen de kinderen van uw volk: De weg van de Heere is niet recht; terwijl het toch hun eigen weg is die niet recht is. Als de rechtvaardige afwijkt van zijn gerechtigheid en onrecht doet, zal hij daarin sterven. En als de goddeloze zich bekeert van zijn goddeloosheid, en recht en gerechtigheid doet, zal hij daardoor leven.", "Luk 14:14": "en u zult gelukkig zijn, omdat zij niets hebben om u te vergelden; want het zal u vergolden worden bij de opstanding van de rechtvaardigen.", "Hebr 11:19": "terwijl hij overwoog dat God machtig was om hem zelfs uit de doden op te wekken; vandaar dat hij hem ook bij wijze van beeld weergekregen heeft.", "1 Kron 5:26": "Zo verwekte de God van Israël de geest van Pul, de koning van Assyrië, en de geest van Tiglath-Pilneser, de koning van Assyrië, die voerde hen gevankelijk weg, te weten de Rubenieten, en de Gadieten, en de halve stam van Manasse; en hij bracht hen naar Halah, en Habor, en Hara, en aan de rivier Gozan, tot op deze dag.", "Job 33:19-22": "Ook wordt hij gestraft met smart op zijn leger, en de sterke menigte van zijn beenderen; Zodat zijn leven het brood zelf verfoeit, en zijn ziel het begeerlijke voedsel; Dat zijn vlees verdwijnt uit het gezicht, en zijn beenderen, die niet gezien werden, uitsteken;", "Job 6:14": "Aan hem die versmolten is, zou van zijn vriend weldadigheid gebeuren; of hij zou de vreze van de Almachtige verlaten.", "2 Kon 15:37": "In die dagen begon de HEERE tegen Juda te zenden Rezin, de koning van Syrië, en Pekah, de zoon van Remalia.", "Jak 4:12": "Er is één Wetgever, Die kan behouden en verderven. Maar wie bent u, dat u een ander veroordeelt?", "Ps 64:8": "Maar God zal hen haastig met een pijl schieten; hun plagen zijn er.", "Spr 28:24": "Wie zijn vader of zijn moeder berooft, en zegt: Het is geen overtreding; die is de metgezel van een verwoestend man.", "Openb 20:10": "En de duivel, die hen verleidde, werd geworpen in de poel van het vuur en sulfer, waar het beest en de valse profeet zijn; en zij zullen gepijnigd worden dag en nacht in alle eeuwigheid.", "Gen 6:7": "En de HEERE zei: Ik zal de mens, die Ik geschapen heb, wegvagen van de aardbodem, van de mens tot het vee, tot het kruipend gedierte, en tot het gevogelte van de hemel toe; want het berouwt Mij dat Ik hen gemaakt heb.", "Jes 52:3": "Want zo zegt de HEERE: U bent voor niets verkocht, u zult ook zonder geld vrijgekocht worden.", "Ps 78:31-34": "Toen Gods toorn tegen hen opging, zodat Hij van hun vetste doodde, en de uitgelezen mannen van Israël neervelde. Boven dit alles zondigden zij nog, en geloofden niet, ondanks Zijn wonderen. Daarom liet Hij hun dagen vergaan in ijdelheid, en hun jaren in verschrikking.", "Matt 12:34-37": "Adderengebroed! Hoe kunt u goede dingen spreken, terwijl u slecht bent? Want uit de overvloed van het hart spreekt de mond. De goede mens brengt goede dingen voort uit de goede schat van het hart, en de slechte mens brengt slechte dingen voort uit de slechte schat. Maar Ik zeg u, dat van elk nutteloos woord dat de mensen zullen hebben gesproken, zij daarvan rekenschap zullen geven op de dag van het oordeel.", "Spr 30:10": "Belaster een knecht niet bij zijn heer, opdat hij u niet vloekt, en u schuldig wordt.", "Luk 2:34": "En Simeon zegende hen, en zei tegen Maria, Zijn moeder: Zie, Deze wordt gezet tot een val en opstanding van velen in Israël, en tot een teken dat weersproken zal worden.", "Ps 27:10": "Want mijn vader en mijn moeder hebben mij verlaten, maar de HEERE zal mij aannemen.", "2 Kron 7:12-22": "En de HEERE verscheen aan Salomo 's nachts, en Hij zei tegen hem: Ik heb uw gebed verhoord, en heb Mij deze plaats uitgekozen tot een offerhuis. Als Ik de hemel toesluit, zodat er geen regen is, of als Ik de sprinkhaan gebied het land te verteren, of als Ik pest onder Mijn volk zend; En Mijn volk, over wie Mijn Naam genoemd wordt, zich verootmoedigt en bidt, en zij Mijn aangezicht zoeken, en zich bekeren van hun slechte wegen; dan zal Ik uit de hemel horen, en hun zonden vergeven, en hun land genezen.", "Ezech 35:13": "Zo hebt u zich met uw mond tegen Mij groot gemaakt, en uw woorden tegen Mij vermenigvuldigd; Ik heb het gehoord.", "Amos 9:10": "Alle zondaars van Mijn volk zullen door het zwaard sterven; zij die zeggen: Het kwaad zal ons niet naderen, en ons niet treffen.", "Luk 13:24": "Strijd om binnen te gaan door de nauwe poort; want velen, zeg Ik u, zullen zoeken binnen te gaan en zullen dat niet kunnen;", "Ps 52:4-6": "Uw tong denkt enkel schade uit, als een geslepen scheermes, en werkt bedrog. U hebt het kwade liever dan het goede, de leugen liever dan gerechtigheid te spreken. Sela. U hebt alle woorden van verslinding lief, en een tong van het bedrog.", "Ps 140:7": "Ik heb tegen de HEERE gezegd: U bent mijn God; neem ter ore, HEERE, de stem van mijn smekingen.", "Luk 17:1": "En Hij zei tegen de discipelen: Het kan niet anders, dan dat er ergernissen komen; maar wee hem, door wie ze komen.", "Ps 94:22": "Doch de HEERE is mij geweest tot een Hoog Vertrek, en mijn God tot een Steenrots van mijn toevlucht.", "Spr 13:1": "Een wijze zoon hoort de tucht van de vader; maar een spotter hoort de bestraffing niet.", "Luk 9:26": "Want wie zich voor Mij en Mijn woorden zal schamen, voor hem zal de Zoon des mensen Zich schamen wanneer Hij komt in Zijn heerlijkheid, en die van de Vader, en van de heilige engelen.", "1 Tess 5:3": "Want wanneer zij zullen zeggen: Het is vrede en veilig; dan zal een plotseling verderf hun overkomen, zoals de barensweeën een zwangere vrouw overkomen; en zij zullen het geenszins ontvluchten;", "Ps 50:22": "Verstaat dit toch, u die God vergeet! opdat Ik niet verscheur en niemand redt.", "Jer 20:8": "Want zo vaak ik spreek, roep ik uit, roep ik geweld en verwoesting; omdat het woord van de HEERE mij de hele dag tot smaad en spot is.", "Gen 4:7": "Is het niet zo: als u goed doet, wordt u aanvaard? En als u niet goed doet, ligt de zonde aan de deur. Naar u gaat zijn begeerte uit, en u zult over hem heersen.", "Job 27:8-23": "Want wat is de verwachting van de huichelaar, als hij gierig geweest zal zijn, wanneer God zijn ziel zal uittrekken? Zal God zijn geroep horen, als benauwdheid over hem komt? Zal hij zich verlustigen in de Almachtige? Zal hij God aanroepen te aller tijd?", "Ps 31:15": "Maar ik vertrouw op U, o HEERE! Ik zeg: U bent mijn God.", "Openb 16:11": "En zij lasterden de God van de hemel vanwege hun pijnen, en vanwege hun gezwellen; en zij bekeerden zich niet van hun werken.", "Ps 18:29": "Want U doet mijn lamp lichten; de HEERE, mijn God, doet mijn duisternis opklaren.", "Ps 119:57": "Cheth. De HEERE is mijn deel, ik heb gezegd, dat ik Uw woorden zal bewaren.", "Ps 68:2": "God zal opstaan, Zijn vijanden zullen verstrooid worden, en Zij die Hem haten zullen van Zijn aangezicht vluchten.", "Ps 86:2": "Bewaar mijn ziel, want ik ben Uw gunstgenoot, o Gij, mijn God! verlos Uw knecht, die op U vertrouwt.", "Ps 145:10-12": "Jod. Al Uw werken, HEERE, zullen U loven, en Uw gunstgenoten zullen U zegenen. Caph. Zij zullen de heerlijkheid van Uw Koninkrijk vermelden, en Uw macht zullen zij uitspreken. Lamed. Om aan de mensenkinderen bekend te maken Zijn machtige daden, en de eer van de heerlijkheid van Zijn Koninkrijk.", "Klaagl 1:5": "He. Haar tegenstanders zijn tot hoofd geworden, haar vijanden hebben rust; omdat de HEERE haar bedroefd heeft, vanwege de veelheid van haar overtredingen; haar kinderen gaan heen in de gevangenschap voor het aangezicht van de tegenstander.", "Job 29:7-14": "Toen ik uitging naar de poort door de stad, toen ik mijn stoel op de straat liet klaarzetten. De jongens zagen mij en verstopten zich, en de stokouden stonden op en bleven staan. De leiders hielden hun woorden in, en legden de hand op hun mond.", "Matt 5:19-30": "Wie dan een van deze minste geboden afschaft, en de mensen zo leert, die zal de minste genoemd worden in het Koninkrijk der hemelen; maar wie ze doet en leert, die zal groot genoemd worden in het Koninkrijk der hemelen. Want Ik zeg u: als uw gerechtigheid niet overvloediger is dan die van de Schriftgeleerden en de Farizeeën, zult u het Koninkrijk der hemelen beslist niet binnengaan. U hebt gehoord dat tot de ouden gezegd is: U zult niet doden; en wie doodt, die zal strafbaar zijn voor het gericht.", "Matt 7:27": "En de slagregen is neergevallen, en de waterstromen zijn gekomen, en de winden hebben gewaaid en zijn tegen dat huis aangeslagen, en het is gevallen, en zijn val was groot.", "Ps 108:11-14": "Wie zal mij voeren in een vaste stad? Wie zal mij leiden tot in Edom? Zult U het niet zijn, o God! Die ons verstoten had, en Die niet uittrok, o God! Met onze legers? Geeft U ons hulp uit de benauwdheid; want het heil van de mens is ijdelheid.", "Hebr 13:14": "Want wij hebben hier geen blijvende stad, maar wij zoeken de toekomstige.", "Ezech 37:1-14": "De hand van de HEERE was op mij, en de HEERE voerde mij uit in de geest, en zette mij neer in het midden van een vallei; die was nu vol beenderen. En Hij deed mij daar helemaal omheen voorbijgaan; en zie, er waren er zeer veel op de grond van de vallei; en zie, ze waren zeer dor. En Hij zei tot mij: Mensenkind! Zullen deze beenderen levend worden? En ik zei: Heere HEERE, U weet het!", "Ps 22:23": "Zo zal ik Uw Naam aan mijn broeders vertellen; in het midden van de gemeente zal ik U prijzen.", "Luk 21:5-36": "En toen sommigen spraken over de tempel, dat hij met mooie stenen en geschenken versierd was, zei Hij: Wat deze dingen aangaat, die u aanschouwt: er zullen dagen komen waarin geen steen op de andere steen gelaten zal worden, die niet zal worden afgebroken. En zij vroegen Hem: Meester, wanneer zullen deze dingen dan gebeuren, en wat is het teken wanneer deze dingen zullen gebeuren?", "Ex 32:33-35": "Toen zei de HEERE tegen Mozes: Wie tegen Mij zondigt, die zal Ik uit Mijn boek delgen. Ga nu heen, leid dit volk naar waar Ik u gezegd heb; zie, Mijn Engel zal voor u uit gaan! Maar op de dag van het bezoeken zal Ik hun zonde over hen bezoeken! Zo trof de HEERE dit volk met een plaag, omdat zij dat kalf gemaakt hadden, dat Aäron gemaakt had.", "Ps 31:16": "Mijn tijden zijn in Uw hand; red mij van de hand van mijn vijanden, en van mijn vervolgers.", "Joh 8:12": "Jezus sprak dan weer tegen hen en zei: Ik ben het licht van de wereld; wie Mij volgt, zal in de duisternis niet wandelen, maar zal het licht van het leven hebben.", "Spr 16:27": "Een nietswaardig man graaft kwaad op; en op zijn lippen is als brandend vuur.", "Job 18:2": "Hoe lang duurt het nog voordat u een einde maakt aan uw woorden? Let op, en daarna zullen wij spreken.", "Ps 71:14": "Doch ik zal voortdurend hopen, en zal al Uw lof nog groter maken.", "Rom 4:16-21": "Daarom is zij uit het geloof, opdat zij naar genade is; opdat de belofte vaststaat voor heel het nageslacht, niet alleen voor wie uit de wet is, maar ook voor wie uit het geloof van Abraham is, die een vader is van ons allen; (Zoals geschreven staat: Ik heb u tot een vader van veel volken gesteld) voor Hem, aan Wie hij geloofd heeft, namelijk God, Die de doden levend maakt, en de dingen die niet zijn roept alsof zij waren; Hij heeft tegen hoop op hoop geloofd, dat hij een vader van veel volken zou worden, volgens wat gezegd was: Zo zal uw nageslacht zijn.", "Amos 3:2": "Uit alle geslachten van de aardbodem heb Ik u alleen gekend; daarom zal Ik al uw ongerechtigheden over u bezoeken.", "Job 36:15": "Hij zal de ellendige in zijn ellende bevrijden, en in de onderdrukking zal Hij voor hun oor openbaren.", "Jes 63:16": "U bent toch onze Vader, want Abraham weet van ons niet, en Israël kent ons niet; U, o HEERE, bent onze Vader, onze Verlosser van ouds af is Uw Naam.", "Openb 6:10": "En zij riepen met grote stem, en zeiden: Hoelang, o heilige en waarachtige Heerser, oordeelt en wreekt U ons bloed niet van hen, die op de aarde wonen?", "Spr 16:32": "Wie geduldig is, is beter dan de sterke; en wie heerst over zijn geest, dan wie een stad inneemt.", "Ps 3:4": "Maar U, HEERE, bent een Schild voor mij, mijn eer, en Die mijn hoofd opheft.", "Hand 5:32": "En wij zijn Zijn getuigen van deze dingen; en ook de Heilige Geest, Die God gegeven heeft hun die Hem gehoorzaam zijn.", "Jer 8:12-14": "Zijn zij beschaamd, omdat zij gruwel bedreven hebben? Nee, zij schamen zich in het geheel niet, en weten niet hoe ze schaamrood moeten worden; daarom zullen zij vallen onder de vallende; ten tijde van hun bezoeking zullen zij struikelen, zegt de HEERE. Ik zal hen voorzeker wegrapen, spreekt de HEERE; er zijn geen druiven aan de wijnstok, en geen vijgen aan de vijgenboom, ja, het blad is afgevallen; en de geboden die Ik hun gegeven heb, die overtreden zij. Waarom blijven wij zitten? Verzamel u, en laat ons ingaan in de versterkte steden, en daar stilzwijgen; zeker heeft de HEERE, onze God, ons doen stilzwijgen, en ons met gallewater gedrenkt, omdat wij tegen de HEERE gezondigd hebben.", "Spr 26:6": "Hij snijdt zichzelf de voeten af, en drinkt geweld, wie boodschappen laat overbrengen door de hand van een dwaas.", "Job 30:11": "Want Hij heeft mijn koord losgemaakt en mij bedrukt; daarom hebben zij de teugel voor mijn aangezicht afgeworpen.", "Ex 20:5": "U zult zich daarvoor niet buigen, en ze niet dienen; want Ik, de HEERE, uw God, ben een ijverig God, Die de misdaad van de vaders bezoek aan de kinderen, aan het derde en aan het vierde geslacht van hen die Mij haten;", "Ps 102:24": "Hij heeft mijn kracht op de weg neergedrukt; mijn dagen heeft Hij verkort.", "1 Kor 1:7": "Zodat het u aan geen enkele gave ontbreekt, terwijl u de openbaring van onze Heere Jezus Christus verwacht.", "Hand 26:6-8": "En nu sta ik en word geoordeeld over de hoop van de belofte die door God aan de vaderen gedaan is; Waarnaar onze twaalf stammen, voortdurend nacht en dag God dienend, hopen te komen; over die hoop, o koning Agrippa, word ik door de Joden beschuldigd. Wat? Wordt het bij u ongelooflijk geoordeeld dat God de doden opwekt?", "Hebr 12:10": "Want zij hebben ons wel voor een korte tijd gekastijd, zoals het hun goeddacht; maar Hij kastijdt ons tot ons nut, opdat wij Zijn heiligheid deelachtig zouden worden.", "Hos 13:1": "Toen Efraïm sprak, beefde men; hij heeft zich verheven in Israël; maar hij is schuldig geworden aan de Baäl en is gestorven.", "Ps 91:9": "Want U, HEERE, bent mijn Toevlucht! De Allerhoogste hebt u gesteld tot uw Vertrek;", "Tit 1:7": "Want een opziener moet onberispelijk zijn, als een huisverzorger van God, niet eigenzinnig, niet gauw driftig, niet verzot op wijn, geen vechter, niet uit op oneerlijke winst;", "Ps 66:11": "U had ons in het net gebracht; U had een engs band om onze lenden gelegd;", "Hebr 10:29": "hoeveel zwaarder straf, denkt u, zal hij waard geacht worden, die de Zoon van God met voeten heeft getreden, en het bloed van het testament, waardoor hij geheiligd was, als onrein heeft beschouwd, en de Geest van de genade smaad heeft aangedaan?", "Ps 34:9": "Teth. Proeft en ziet dat de HEERE goed is; gelukkig is de man die op Hem vertrouwt.", "Ex 20:7": "U zult de naam van de HEERE, uw God, niet ijdel gebruiken; want de HEERE zal niet onschuldig houden wie Zijn naam ijdel gebruikt.", "Pred 8:13": "Maar de goddeloze zal het niet goed gaan, en hij zal zijn dagen niet verlengen; hij zal zijn als een schaduw, omdat hij niet vreest voor het aangezicht van God.", "Gen 24:40": "En hij zei tegen mij: De HEERE, voor Wiens aangezicht ik gewandeld heb, zal Zijn Engel met u zenden, en Hij zal uw weg voorspoedig maken, zodat u voor mijn zoon een vrouw neemt, uit mijn geslacht en uit het huis van mijn vader.", "Joël 2:1": "Waait op de bazuin te Sion, en roept luide op de berg van Mijn heiligheid; laat alle inwoners van het land beroerd zijn, want de dag van de HEERE komt, want hij is nabij.", "2 Tess 1:7-10": "En aan u, die verdrukt wordt, verkwikking te geven met ons, bij de openbaring van de Heere Jezus vanuit de hemel met de engelen van Zijn kracht; Met vlammend vuur, wraak oefenend over hen die God niet kennen, en over hen die het Evangelie van onze Heere Jezus Christus niet gehoorzaam zijn. Die zullen tot straf het eeuwige verderf ondergaan, weg van het aangezicht van de Heere, en van de heerlijkheid van Zijn sterkte,", "Spr 15:5": "Een dwaas zal de tucht van zijn vader versmaden; maar wie de bestraffing ter harte neemt, zal kloekzinnig handelen.", "Joh 14:19": "Nog een korte tijd, en de wereld zal Mij niet meer zien; maar u zult Mij zien; want Ik leef, en u zult leven.", "Luk 19:27": "Maar breng die vijanden van mij, die niet wilden dat ik koning over hen zou zijn, hier, en dood ze hier voor mij.", "Spr 28:7": "Wie de wet bewaart, is een verstandige zoon; maar wie een metgezel van vraten is, beschaamt zijn vader.", "Spr 30:11": "Er is een geslacht dat zijn vader vervloekt, en zijn moeder niet zegent;", "Ps 9:16": "De heidenen zijn gezonken in de groeve, die zij gemaakt hadden; hun voet is gevangen in het net, dat zij verborgen hadden.", "Joh 14:2": "In het huis van Mijn Vader zijn veel woningen; anders zou Ik het u gezegd hebben. Ik ga heen om u plaats te bereiden.", "Job 14:12-15": "Zo ligt de mens neer, en staat niet meer op; totdat de hemelen er niet meer zijn, zullen zij niet ontwaken, noch uit hun slaap opgewekt worden. Och, wilde U mij toch in het graf verbergen, mij verstoppen, totdat Uw toorn zich afkeerde; dat U mij een vaste tijd stelde, en aan mij zou denken! Als een man gestorven is, zal hij dan weer leven? Ik zou al de dagen van het strijd hopen, totdat mijn verandering zou komen.", "1 Sam 12:25": "Maar als u toch kwaad blijft doen, zult u, evengoed als uw koning, omkomen.", "Matt 27:53": "en nadat zij na Zijn opstanding uit de graven weggegaan waren, kwamen zij in de heilige stad, en zijn aan velen verschenen.", "Ps 116:1-14": "Ik heb Hem lief, want de HEERE hoort mijn stem, mijn smekingen; want Hij neigt Zijn oor tot mij; daarom zal ik Hem in mijn dagen aanroepen. De banden van de dood hadden mij omvangen, en de angsten van het graf hadden mij getroffen; ik vond benauwdheid en droefenis.", "Spr 14:10": "Het hart kent zijn eigen bittere droefheid; en een vreemde zal zich met zijn blijdschap niet vermengen.", "Spr 17:25": "Een dwaze zoon is een verdriet voor zijn vader, en bittere droefheid voor haar die hem gebaard heeft.", "Ps 59:18": "Van U, o mijn Sterkte, zal ik psalmzingen; want God is mijn Hoog Vertrek, de God van mijn goedertierenheid.", "Deut 4:5-31": "Zie, ik heb u de inzettingen en rechten geleerd, zoals de HEERE, mijn God, mij geboden heeft; opdat u zo doet in het land waar u naar toe gaat om het in bezit te nemen. Bewaar ze dan, en doe ze; want dat zal uw wijsheid en uw verstand zijn voor de ogen van de volken, die al deze inzettingen zullen horen en zeggen: Dit grote volk is werkelijk een wijs en verstandig volk! Want welk groot volk is er, dat de goden zo dichtbij heeft als de HEERE, onze God, bij ons is, zo vaak als wij Hem aanroepen?", "Ezra 8:22": "Want ik schaamde mij om van de koning een leger en ruiters te vragen om ons te helpen tegen de vijand, op de weg; omdat wij tegen de koning gesproken hadden en gezegd: De hand van onze God is ten goede over allen die Hem zoeken, maar Zijn sterkte en Zijn toorn over allen die Hem verlaten.", "Joh 3:15": "Opdat ieder die in Hem gelooft, niet verloren gaat, maar het eeuwige leven heeft.", "Ps 7:11": "Mijn schild is bij God, Die de oprechten van hart behoudt.", "Hos 5:9": "Efraïm zal tot verwoesting worden, op de dag van de straf; onder de stammen van Israël heb Ik bekendgemaakt wat zeker is.", "Matt 26:56": "maar dit alles is gebeurd, opdat de Schriften van de profeten vervuld zouden worden. Toen vluchtten alle discipelen en lieten Hem in de steek.", "1 Joh 3:15": "Ieder die zijn broeder haat, is een moordenaar; en u weet dat geen moordenaar het eeuwige leven in zich heeft blijven.", "Ps 25:1": "Een psalm van David. Aleph. Tot U, o HEERE! hef ik mijn ziel op.", "2 Tim 1:12": "Om deze reden lijd ik ook deze dingen, maar ik word niet beschaamd; want ik weet aan Wie ik geloofd heb, en ik ben verzekerd, dat Hij machtig is mijn pand, bij Hem weggelegd, te bewaren tot die dag.", "Matt 10:33": "Maar wie Mij verloochend zal hebben voor de mensen, die zal Ik ook verloochenen voor Mijn Vader, Die in de hemelen is.", "Ps 56:9": "U hebt mijn omzwerven geteld; leg mijn tranen in Uw fles; staan zij niet in Uw register?", "Jer 20:10": "Want ik heb de kwaadsprekerij van velen gehoord, schrik van alle kanten. \"Geef ons te kennen,\" zeggen ze, \"en wij zullen het bekendmaken\"; al mijn vertrouwde vrienden letten op mijn struikelen; ze zeggen: \"Misschien laat hij zich overhalen, dan zullen wij de overhand over hem krijgen, en onze wraak op hem nemen.\"", "Ps 12:5": "Die zeggen: Wij zullen de overhand hebben met onze tong; onze lippen zijn onze! Wie is heer over ons?", "Num 14:8": "Als de HEERE een welgevallen aan ons heeft, zal Hij ons in dat land brengen, en zal het ons geven; een land dat overvloeit van melk en honing.", "Ex 28:11": "naar steensnijderswerk, zoals men de zegels graveert, zult u deze twee stenen graveren, met de namen van de zonen van Israël; u zult ze maken, zodat zij omvat zijn in gouden kastjes.", "Ezech 9:10": "Daarom ook, wat Mij aangaat, Mijn oog zal niet verschonen, en Ik zal niet sparen; Ik zal hun weg op hun hoofd geven.", "Jak 3:8-10": "Maar de tong kan geen mens temmen; zij is een onbedwingbaar kwaad, vol dodelijk gif. Door haar loven wij God en de Vader, en door haar vervloeken wij de mensen, die naar de gelijkenis van God gemaakt zijn. Uit dezelfde mond komt voort zegening en vervloeking. Dit moet, mijn broeders, zo niet gebeuren.", "Ps 63:8": "Want U bent mij een hulp geweest; en in de schaduw van Uw vleugels zal ik vrolijk zingen.", "1 Tim 6:1": "Alle dienstknechten die onder het juk zijn, moeten hun eigen heren alle eer waardig achten, opdat de Naam van God en de leer niet gelasterd wordt.", "Ps 10:9": "Hij legt lagen in een verborgen plaats, zoals een leeuw in zijn hol; hij legt lagen om de ellendige te roven; hij rooft de ellendige als hij hem trekt in zijn net.", "Ps 71:3": "Wees mij tot een Rotssteen, om daarin te wonen, om voortdurend daarin te gaan; Gij hebt bevel gegeven, om mij te verlossen, want Gij zijt mijn Steenrots en mijn Burg.", "Job 5:18": "Want Hij doet smart aan, en Hij verbindt; Hij doorwondt, en Zijn handen helen.", "Jes 1:6": "Van de voetzool af tot het hoofd toe is er niets van het geheel gaaf aan hem; maar wonden, en striemen, en etterbuilen, die niet uitgedrukt noch verbonden zijn, en geen daarvan is met olie verzacht.", "Ps 144:2": "Mijn Goedertierenheid en mijn Burg, mijn Hoog Vertrek en mijn Bevrijder voor mij, mijn Schild, en op Wie ik vertrouw; Die mijn volk aan mij onderwerpt!", "Ps 2:9": "U zult hen verpletteren met een ijzeren scepter; U zult hen in stukken slaan als een pottenbakkersvat.", "Klaagl 3:9": "Gimel. Hij heeft mijn wegen toegemuurd met uitgehouwen stenen, Hij heeft mijn paden krom gemaakt.", "Ps 119:155": "Het heil is ver van de goddelozen, want zij zoeken Uw inzettingen niet.", "2 Petr 2:8": "(want deze rechtvaardige man, die onder hen woonde, heeft dag na dag zijn rechtvaardige ziel gekweld door het zien en horen van hun onrechtvaardige daden);", "Ps 109:5": "En zij hebben mij kwaad voor goed opgelegd, en haat voor mijn liefde.", "Ps 55:18": "'s Avonds, en 's morgens, en 's middags zal ik klagen en getier maken; en Hij zal mijn stem horen.", "Spr 27:9": "Olie en reukwerk verblijden het hart; zo doet de zoetheid van iemands vriend, vanwege hartelijke raad.", "Ps 140:12": "Een man van kwade tong zal op de aarde niet bevestigd worden; een boos man van geweld, die zal men jagen, totdat hij helemaal verdreven is.", "Job 34:6": "Ik moet liegen over mijn recht; mijn pijl is smartelijk zonder overtreding.", "2 Kor 5:1": "Want wij weten dat als ons aardse huis, deze tent, afgebroken wordt, wij een gebouw van God hebben, een huis niet met handen gemaakt, maar eeuwig, in de hemelen.", "Job 18:5-21": "Ja, het licht van de goddelozen zal uitgeblust worden, en de vonk van zijn vuur zal niet glinsteren. Het licht zal verduisteren in zijn tent, en zijn lamp zal boven hem uitgeblust worden. De stappen van zijn kracht zullen beperkt worden, en zijn eigen plan zal hem neerwerpen.", "Luk 17:7-9": "En wie van u die een dienstknecht heeft die ploegt of de dieren hoedt, zal tegen hem zeggen, als hij van de akker komt: Kom meteen aan tafel? Maar zal hij niet tegen hem zeggen: Maak klaar wat ik vanavond zal eten, omgord u en dien mij, totdat ik gegeten en gedronken heb; en daarna kunt u eten en drinken? Dankt hij die dienstknecht ervoor dat hij gedaan heeft wat hem bevolen was? Ik denk het niet.", "Matt 18:35": "Zo zal ook Mijn hemelse Vader met u doen, als u niet ieder van harte uw broeder zijn misdaden vergeeft.", "Ps 21:6-8": "Groot is zijn eer door Uw heil; majesteit en heerlijkheid hebt U hem toegevoegd. Want U zet hem tot zegeningen in eeuwigheid; U vervrolijkt hem door vreugde met Uw aangezicht. Want de koning vertrouwt op de HEERE, en door de goedertierenheid van de Allerhoogste zal hij niet wankelen.", "Ex 28:21": "En deze stenen zullen zijn met de twaalf namen van de zonen van Israël, met hun namen; zij zullen als zegels gegraveerd worden, elk met zijn naam; voor de twaalf stammen zullen zij zijn.", "Luk 1:26-37": "En in de zesde maand werd de engel Gabriël door God gezonden naar een stad in Galilea, genaamd Nazareth, naar een maagd die ondertrouwd was met een man wiens naam Jozef was, uit het huis van David; en de naam van de maagd was Maria. En de engel kwam bij haar binnen, en zei: Wees gegroet, begenadigde; de Heere is met u; u bent gezegend onder de vrouwen.", "Ps 102:11": "Vanwege Uw verstoordheid en Uw grote toorn; want U hebt mij verheven, en mij weer neergeworpen.", "Spr 30:33": "Want het karnen van melk brengt boter voort, en het knijpen van de neus brengt bloed voort, en het opjagen van de toorn brengt twist voort.", "Spr 13:17": "Een goddeloze bode zal in het kwaad vallen; maar een trouwe gezant is medicijn.", "Hand 1:11": "die ook zeiden: Galilese mannen, wat staat u naar de hemel te kijken? Deze Jezus, Die van u opgenomen is in de hemel, zal op dezelfde manier komen als u Hem naar de hemel hebt zien gaan.", "Jes 24:17": "De angst, en de kuil, en de strik over u, o inwoners van het land!", "Fil 3:18": "Want velen wandelen anders; over wie ik u dikwijls gezegd heb, en nu ook wenend zeg, dat zij vijanden zijn van het kruis van Christus;", "Spr 15:13": "Een vrolijk hart maakt het gezicht blij; maar door verdriet in het hart wordt de geest verslagen.", "Pred 8:12": "Hoewel een zondaar honderd maal kwaad doet, en God zijn dagen verlengt, weet ik toch zeker, dat het hun goed zal gaan die God vrezen, die voor Zijn aangezicht vrezen.", "Matt 23:14": "Wee u, Schriftgeleerden en Farizeeën, huichelaars, want u eet de huizen van de weduwen op, en dat onder de schijn van lang te bidden; daarom zult u des te zwaarder oordeel ontvangen.", "Matt 25:30": "En werp de nutteloze dienstknecht buiten, in de uiterste duisternis; daar zal geween zijn en het geknars van de tanden.", "Luk 19:26": "Want ik zeg u dat ieder die heeft, gegeven zal worden; maar van hem die niet heeft, zal ook wat hij heeft afgenomen worden.", "Ps 48:15": "Want deze God is onze God eeuwig en altoos; Hij zal ons geleiden tot de dood toe.", "Ps 92:16": "Om te verkondigen dat de HEERE recht is; Hij is mijn Rotssteen, en in Hem is geen onrecht.", "Jes 19:8": "En de vissers zullen treuren, en allen die de angel in de stromen werpen, zullen rouw bedrijven; en zij die het werpnet uitspreiden op het water, zullen kwijnen.", "Jes 64:8": "Doch nu, HEERE! U bent onze Vader; wij zijn leem, en U bent onze pottenbakker, en wij allen zijn het werk van Uw handen.", "Joz 14:12": "En nu, geef mij dit gebergte, waarvan de HEERE op die dag gesproken heeft; want u hebt op diezelfde dag gehoord dat de Enakieten daar waren, en dat er grote versterkte steden waren; misschien is de HEERE met mij, zodat ik hen verdrijf, zoals de HEERE gesproken heeft.", "Ps 38:3": "Want Uw pijlen zijn in mij gedaald, en Uw hand is op mij neergedaald.", "Jes 25:8": "Hij zal de dood verslinden tot overwinning, en de Heere HEERE zal de tranen van alle aangezichten afwissen; en Hij zal de smaad van Zijn volk van de hele aarde wegnemen; want de HEERE heeft het gesproken.", "Job 1:11": "Maar strek toch nu Uw hand uit, en tast alles aan wat hij heeft; dan zal hij U beslist in Uw aangezicht vervloeken.", "Hand 2:26-31": "Daarom is mijn hart verblijd, en mijn tong verheugt zich; ja, ook mijn vlees zal rusten in hoop; Want U zult mijn ziel niet verlaten in het rijk van de dood, en Uw Heilige zult U niet overgeven om verderving te zien. U hebt mij de wegen van het leven bekendgemaakt; U zult mij vervullen met vreugde door Uw aangezicht.", "Spr 26:20-23": "Als er geen hout is, gaat het vuur uit; en als er geen roddelaar is, wordt het gekijf gestild. De dode kool is voor de vurige kool, en het hout voor het vuur; zo is een twistzieke man om ruzie aan te wakkeren. De woorden van de roddelaar zijn als klappen die aankomen, en die diep in het binnenste van de buik dalen.", "Micha 2:3": "Daarom, zo zegt de HEERE: Zie, Ik bedenk een kwaad over dit geslacht, waaruit u uw halzen niet zult uittrekken, en zo rechtop niet zult gaan; want het zal een boze tijd zijn.", "Rom 8:21-23": "In de hoop dat ook de schepping zelf zal worden vrijgemaakt van de slavernij van het verderf, tot de vrijheid van de heerlijkheid van de kinderen van God. Want wij weten dat de hele schepping samen zucht en samen als in barensnood is, tot nu toe. En niet alleen dit, maar ook wijzelf, die de eerstelingen van de Geest hebben, ook wijzelf, zeg ik, zuchten in onszelf, terwijl wij de aanneming tot kinderen verwachten, namelijk de verlossing van ons lichaam.", "2 Kor 12:20": "Want ik vrees dat ik, als ik gekomen zal zijn, u niet zal vinden zoals ik wil, en dat ik door u gevonden zal worden zoals u niet wilt; dat er niet op enigerlei wijze twisten, jaloezie, toorn, ruzie, kwaadsprekerij, gefluister, opgeblazenheid, wanordelijkheden zijn;", "Zach 13:1": "Op die dag zal er een bron geopend zijn voor het huis van David en voor de inwoners van Jeruzalem, tegen de zonde en tegen de onreinheid.", "Ef 4:31": "Alle bitterheid, en toorn, en gramschap, en geroep, en lastering worde van u geweerd, met alle boosheid;", "2 Tim 4:7": "Ik heb de goede strijd gestreden, ik heb de loop tot een einde gebracht, ik heb het geloof behouden;", "Ps 119:118": "U vertreedt allen, die van Uw inzettingen afdwalen, want hun bedrog is leugen.", "Job 21:7-33": "Waarom leven de goddelozen, worden oud, ja, worden geweldig in vermogen? Hun nakomelingen zijn bestendig bij hen voor hun ogen, en hun spruiten voor hun aangezicht. Hun huizen hebben vrede zonder vrees, en de roede van God is niet op hen.", "Ps 34:10": "Jod. Vreest de HEERE, u, Zijn heiligen! Want die Hem vrezen hebben geen gebrek.", "Ps 88:14-19": "Maar ik, HEERE, roep tot U, en mijn gebed komt U al voor in de morgenstond. HEERE, waarom verstoot U mijn ziel, en verbergt U Uw aangezicht voor mij? Van jongs af aan ben ik bedrukt en aan het sterven; ik draag Uw verschrikkingen, ik ben radeloos.", "Job 16:19": "Ook nu, zie, in de hemel is mijn Getuige, en mijn Getuige in de hoogten.", "Spr 27:14": "Wie zijn vriend zegent met luide stem, terwijl hij zich 's morgens vroeg opmaakt, het zal hem tot een vloek gerekend worden.", "Jer 49:12": "Want zo zegt de HEERE: Zie, van hen wier oordeel het niet is de beker te drinken, zullen er helemaal drinken; en zou u dan enigszins ongestraft blijven? U zult niet ongestraft blijven, maar u zult helemaal drinken.", "Openb 22:12": "En zie, Ik kom haastig, en Mijn loon is met Mij, om ieder te vergelden zoals zijn werk zal zijn.", "Job 14:22": "Maar zijn vlees, dat nog aan hem is, heeft smart; en zijn ziel, die nog in hem is, heeft rouw.", "Jes 26:1": "Op die dag zal dit lied gezongen worden in het land Juda: Wij hebben een sterke stad, God stelt heil tot muren en voorschansen.", "Pred 9:12": "Want ook de mens kent zijn tijd niet: zoals de vissen die gevangen worden met een kwaadaardig net, en zoals de vogels die gevangen worden met de strik, zo worden de mensenkinderen verstrikt, op een kwade tijd, wanneer die plotseling over hen valt.", "Ps 27:1-6": "Een psalm van David. De HEERE is mijn Licht en mijn Heil, voor wie zou ik vrezen? De HEERE is de kracht van mijn leven, voor wie zou ik bang zijn? Toen de bozen, mijn tegenpartijen en mijn vijanden, tegen mij naar mij toe kwamen om mijn vlees te eten, stieten zij zelf aan en vielen. Ofschoon een leger mij belegerde, mijn hart zou niet vrezen; ofschoon een oorlog tegen mij opstond, toch vertrouw ik hierop.", "Ps 66:9": "Die onze zielen in het leven houdt, en niet toelaat dat onze voet wankelt.", "Ps 49:18": "want hij zal bij zijn sterven niets meenemen, zijn eer zal hem niet achterna dalen.", "Ps 26:12": "Mijn voet staat op effen grond; ik zal de HEERE loven in de samenkomsten.", "Ps 92:8": "Dat de goddelozen groeien als het gras, en al de werkers van de ongerechtigheid bloeien, opdat zij tot in eeuwigheid weggevaagd worden.", "Spr 21:24": "Wie een hovaardige pocher is, zijn naam is spotter; hij gaat met hovaardige verbolgenheid te werk.", "Ps 16:2": "O mijn ziel, u hebt tegen de HEERE gezegd: U bent de Heere, mijn goedheid raakt niet tot U;", "Jona 2:3": "Want U had mij geworpen in de diepte, in het hart van de zeeën, en de stroom omving mij; al Uw baren en Uw golven gingen over mij heen.", "Jes 50:10": "Wie is er onder u, die de HEERE vreest, die naar de stem van Zijn Knecht luistert? Als hij in de duisternis wandelt, en geen licht heeft, laat hij vertrouwen op de Naam van de HEERE en steunen op zijn God.", "Jer 17:15": "Zie, zij zeggen tegen mij: Waar is het woord van de HEERE? Laat het nu komen!", "Matt 10:24": "De discipel staat niet boven de meester, en de dienstknecht niet boven zijn heer.", "Spr 14:17": "Wie haastig is tot toorn, zal dwaasheid doen; en een man met schandelijke plannen zal gehaat worden.", "Job 17:7-16": "Daarom is mijn oog door verdriet verdonkerd, en al mijn ledematen zijn als een schaduw. De oprechten zullen hierover verbaasd zijn, en de onschuldige zal zich tegen de huichelaar opmaken; En de rechtvaardige zal zijn weg vasthouden, en wie rein van handen is, zal in sterkte toenemen.", "1 Kron 10:14": "en de HEERE niet gezocht had; daarom doodde Hij hem, en keerde het koninkrijk tot David, de zoon van Isaï.", "Hos 7:16": "Zij keren zich om, maar niet naar de Allerhoogste, zij zijn als een bedrieglijke boog; hun vorsten vallen door het zwaard, vanwege de woede van hun tong; dit zal hun bespotting zijn in het land Egypte.", "Jes 24:18": "En het zal gebeuren: wie voor het geluid van de angst vlucht, die zal in de kuil vallen; en wie uit de kuil opklimt, die zal in de strik gevangen worden; want de sluizen in de hoogte zijn opengedaan, en de fundamenten van de aarde zullen beven.", "Hebr 9:28": "zo is ook Christus, eenmaal geofferd, om de zonden van velen weg te nemen, en zal ten tweeden male zonder zonde gezien worden door hen die Hem verwachten tot zaligheid.", "Ps 146:9": "De HEERE bewaart de vreemdelingen; Hij houdt de wees en de weduwe staande; maar de weg van de goddelozen keert Hij om.", "Ezech 5:4": "En nog zult u daarvan nemen, en dat werpen in het midden van het vuur, en zult ze verbranden met vuur; daaruit zal een vuur voortkomen tegen het hele huis van Israël.", "Ps 119:23": "Als zelfs de vorsten zittend tegen mij gesproken hebben, heeft Uw knecht Uw inzettingen betracht.", "Matt 26:64": "Jezus zei tegen hem: U hebt het gezegd. Maar Ik zeg u: van nu af aan zult u de Zoon des mensen zien zitten aan de rechterhand van de kracht van God, en komen op de wolken van de hemel.", "1 Tim 6:2": "En zij die gelovige heren hebben, moeten hen niet verachten, omdat zij broeders zijn; maar moeten hen des te meer dienen, omdat zij gelovig en geliefd zijn, als mensen die deze weldaad samen ontvangen. Leer en vermaan deze dingen.", "Rom 5:12": "Daarom, zoals door één mens de zonde in de wereld ingekomen is, en door de zonde de dood; en zo de dood tot alle mensen doorgegaan is, doordat allen gezondigd hebben.", "Ps 94:14": "Want de HEERE zal Zijn volk niet verlaten, en Hij zal Zijn erfdeel niet in de steek laten.", "Job 30:15-19": "Men heeft zich met verschrikkingen tegen mij gekeerd; ieder vervolgt als een wind mijn edele ziel, en mijn heil is als een wolk voorbijgegaan. Daarom stort mijn ziel zich nu in mij uit; de dagen van het druk grijpen mij aan. 's Nachts doorboort Hij mijn beenderen in mij, en mijn polsaderen rusten niet.", "Jes 25:9": "En men zal op die dag zeggen: Zie, Deze is onze God; wij hebben Hem verwacht, en Hij zal ons zalig maken. Deze is de HEERE, wij hebben Hem verwacht, wij zullen ons verheugen en verblijden in Zijn zaligheid.", "Spr 26:28": "Een valse tong haat hen die zij verbrijzelt; en een gladde mond veroorzaakt val.", "Ps 102:4": "Want mijn dagen zijn vergaan als rook, en mijn beenderen zijn uitgebrand als een haard.", "2 Kron 28:9": "Daar nu was een profeet van de HEERE, wiens naam Oded was; die ging naar buiten, het leger tegemoet dat naar Samaria kwam, en zei tegen hen: Zie, door de grimmigheid van de HEERE, de God van uw vaderen, over Juda, heeft Hij hen in uw hand gegeven, en u hebt hen doodgeslagen in een toorn die tot aan de hemel raakt.", "1 Kor 15:15": "En dan blijken wij ook valse getuigen van God te zijn; want wij hebben van God getuigd dat Hij Christus opgewekt heeft, Die Hij niet opgewekt heeft, als namelijk de doden niet opgewekt worden.", "Hos 9:9": "Zij hebben zich zeer diep verdorven, zoals in de dagen van Gibea; Hij zal aan hun ongerechtigheid denken, Hij zal hun zonden straffen.", "2 Kor 5:7": "(Want wij wandelen door geloof en niet door aanschouwen.)", "Ps 10:7": "Zijn mond is vol vloek, bedrog en list; onder zijn tong is moeite en onrecht.", "Ps 73:11": "Zodat zij zeggen: Hoe zou God het weten, en zou er kennis zijn bij de Allerhoogste?", "Job 30:21": "U bent veranderd in een wrede tegen mij; door de sterkte van Uw hand weerstaat U mij hatelijk.", "Openb 19:15": "En uit Zijn mond ging een scherp zwaard, opdat Hij daarmee de heidenen slaan zou. En Hij zal hen hoeden met een ijzeren staf; en Hij treedt de wijnpersbak van de wijn van de toorn en van de gramschap van de Almachtige God.", "Ezech 18:25": "Nog zegt u: De weg van de Heere is niet recht; hoor nu, o huis van Israël! Is Mijn weg niet recht? Zijn niet uw wegen onrecht?", "1 Tess 2:19": "Want wat is onze hoop, of blijdschap, of kroon van het roem? Bent u dat niet, voor onze Heere Jezus Christus bij Zijn komst?", "Hos 7:13": "Wee hen, want zij zijn van Mij afgezworven; verwoesting over hen, want zij hebben tegen Mij overtreden! Ik zou hen wel verlossen, maar zij spreken leugens tegen Mij.", "2 Kron 32:7": "Weest sterk, en houd goede moed, weest niet bevreesd en niet ontsteld voor het aangezicht van de koning van Assyrië, noch voor het aangezicht van de hele menigte die met hem is; want met ons is er meer dan met hem.", "Ps 139:20": "Zij die schandelijk over U spreken, en Uw vijanden zinloos verheffen.", "1 Joh 3:14": "Wij weten dat wij overgegaan zijn uit de dood in het leven, omdat wij de broeders liefhebben; wie zijn broeder niet liefheeft, blijft in de dood.", "Klaagl 2:6": "Vau. En Hij heeft Zijn hut met geweld afgerukt, als een hof, Hij heeft Zijn vergaderplaats verdorven; de HEERE heeft in Sion doen vergeten het hoogtijd en de sabbat, en Hij heeft in de gramschap van Zijn toorn de koning en de priester smadelijk verworpen.", "Spr 27:27": "Daarbij zult u genoeg geitenmelk hebben tot uw voedsel, tot voedsel van uw huis, en levensonderhoud van uw dienstmeisjes.", "1 Kor 12:26": "En hetzij dat één lid lijdt, alle leden lijden mee; hetzij dat één lid geëerd wordt, alle leden verblijden zich mee.", "Matt 5:22": "Maar Ik zeg u: ieder die zonder reden toornig is op zijn broeder, die zal strafbaar zijn voor het gericht; en wie tegen zijn broeder zegt: Raka! die zal strafbaar zijn voor de grote raad; maar wie zegt: Dwaas! die zal strafbaar zijn voor het helse vuur.", "Dan 11:37": "En op de goden van zijn vaderen zal hij geen acht geven, noch op de begeerte van de vrouwen; hij zal ook op geen God acht geven, maar hij zal zich boven alles groot maken.", "Luk 1:25": "Zo heeft de Heere mij gedaan, in de dagen waarin Hij naar mij omzag, om mijn smaad onder de mensen weg te nemen.", "Job 15:28-30": "En heeft verdelgde steden bewoond, en huizen die men niet bewoonde, die gereed waren om een puinhoop te worden. Hij zal niet rijk worden, en zijn vermogen zal niet bestaan; en hun volmaaktheid zal zich niet uitbreiden op de aarde. Hij zal van de duisternis niet ontwijken, de vlam zal zijn scheut verdrogen; hij zal wijken door het geblaas van zijn mond.", "Rom 12:15": "Verblijd u met de blijden, en ween met de wenende.", "Gen 48:15": "En hij zegende Jozef, en zei: De God, voor Wiens aangezicht mijn vaders, Abraham en Izak, gewandeld hebben, die God, Die mij gevoed heeft, van mijn jeugd af tot op deze dag;", "Rom 15:12": "En opnieuw zegt Jesaja: Er zal de wortel van Isaï zijn, en Die opstaat om over de heidenen te heersen; op Hem zullen de heidenen hopen.", "Ps 35:26": "Laat hen beschaamd worden en samen schaamrood, die zich in mijn kwaad verblijden; laat hen met schaamte en schande bekleed worden, die zich tegen mij groot maken.", "Spr 3:33": "De vloek van de HEERE is in het huis van de goddeloze; maar de woning van de rechtvaardigen zal Hij zegenen.", "Ps 37:9": "Want de boosdoeners zullen uitgeroeid worden, maar wie de HEERE verwachten, die zullen de aarde erfelijk bezitten.", "Hos 7:12": "Wanneer zij zullen heengaan, zal Ik Mijn net over hen uitspreiden, Ik zal ze als vogels van de hemel doen neerdalen. Ik zal ze tuchtigen, zoals gehoord is in hun samenkomst.", "Joh 5:21": "Want zoals de Vader de doden opwekt en levend maakt, zo maakt ook de Zoon levend wie Hij wil.", "Spr 19:11": "Het verstand van de mens vertraagt zijn toorn; en zijn sieraad is een overtreding voorbij te gaan.", "Ps 18:36": "Ook hebt U mij het schild van Uw heil gegeven, en Uw rechterhand heeft mij ondersteund, en Uw zachtmoedigheid heeft mij groot gemaakt.", "2 Kron 24:23": "Daarom gebeurde het bij de jaarwisseling, dat het leger van Syrië tegen hem optrok, en zij kwamen tot Juda en Jeruzalem, en verdierven uit het volk alle leiders van het volk; en zij zonden al hun buit naar de koning van Damaskus.", "Ps 68:3": "U zult hen verdrijven, zoals rook verdreven wordt; zoals was voor het vuur smelt, zullen de goddelozen vergaan van Gods aangezicht.", "Spr 22:24": "Ga geen vriendschap aan met een driftig man, en ga niet om met een zeer grimmig man;", "Ps 71:5-7": "Want Gij zijt mijn Verwachting, Heere HEERE! mijn Vertrouwen van mijn jeugd af aan. Op U heb ik gesteund van de buik af aan; van de ingewanden van mijn moeder af aan zijt Gij mijn Uithelper; mijn lof is voortdurend van U. Ik ben voor velen als een wonder geweest; doch Gij zijt mijn sterke Toevlucht.", "Ps 34:17": "Pe. Het aangezicht van de HEERE is tegen hen die kwaad doen, om hun gedachtenis van de aarde uit te roeien.", "Ps 16:8": "Ik stel de HEERE voortdurend voor mij, omdat Hij aan mijn rechterhand is, zal ik niet wankelen.", "Pred 7:22": "Want uw hart heeft ook veel keren erkend, dat u ook anderen vervloekt hebt.", "Gen 49:10": "De scepter zal van Juda niet wijken, evenmin de wetgever van tussen zijn voeten, totdat Silo komt, en Hem zullen de volken gehoorzaam zijn.", "Hos 2:5": "Daarom, zie, Ik zal uw weg met doornen omtuinen, en Ik zal een omheiningsmuur maken, zodat zij haar paden niet zal vinden.", "Gen 22:18": "En in uw nageslacht zullen alle volken van de aarde gezegend worden, omdat u Mijn stem gehoorzaam bent geweest.", "Ps 94:23": "En Hij zal hun ongerechtigheid op hen doen terugkeren, en Hij zal hen in hun boosheid verdelgen; de HEERE, onze God, zal hen verdelgen.", "Jes 36:15": "Bovendien, laat Hizkia u niet doen vertrouwen op de HEERE, door te zeggen: De HEERE zal ons zeker redden; deze stad zal niet in de hand van de koning van Assyrië gegeven worden.", "Jes 30:8": "Nu dan, ga heen, schrijf het voor hen op een tafel, en teken het op in een boek, opdat het blijft tot de laatste dag, voor altijd, tot in eeuwigheid.", "Ps 44:10-15": "Maar nu hebt U ons verstoten en te schande gemaakt, omdat U met onze legers niet uittrekt. U doet ons achterwaarts keren van de tegenstander; en onze haters beroven ons voor zichzelf. U geeft ons over als schapen ten voedsel, en U verstrooit ons onder de heidenvolken.", "Jes 40:27": "Waarom zegt u dan, o Jakob! en spreekt, o Israël! mijn weg is voor de HEERE verborgen, en mijn recht gaat aan mijn God voorbij?", "Jes 59:21": "Wat Mij aangaat, dit is Mijn Verbond met hen, zegt de HEERE: Mijn Geest, Die op u is, en Mijn woorden, die Ik in uw mond gelegd heb, die zullen van uw mond niet wijken, ook niet van de mond van uw zaad, ook niet van de mond van het zaad van uw zaad, zegt de HEERE, van nu af tot in eeuwigheid toe.", "Spr 17:17": "Een vriend heeft te allen tijde lief; en een broeder wordt geboren voor de tijd van benauwdheid.", "Job 21:14": "Toch zeggen zij tegen God: Ga weg van ons, want in de kennis van Uw wegen hebben wij geen behagen.", "Amos 3:3": "Zullen twee samen wandelen, tenzij zij bijeengekomen zijn?", "Spr 27:17": "IJzer scherpt men met ijzer; zo scherpt een man het gezicht van zijn naaste.", "Joh 5:22-29": "Want ook de Vader oordeelt niemand, maar heeft heel het oordeel aan de Zoon gegeven, opdat allen de Zoon eren, zoals zij de Vader eren. Wie de Zoon niet eert, eert de Vader niet, Die Hem gezonden heeft. Voorwaar, voorwaar, Ik zeg u: Wie Mijn woord hoort en Hem gelooft Die Mij gezonden heeft, die heeft het eeuwige leven, en komt niet in het oordeel, maar is overgegaan uit de dood in het leven.", "Jes 12:2": "Zie, God is mijn Heil, ik zal vertrouwen en niet vrezen; want de HEERE HEERE is mijn Sterkte en mijn Psalm, en Hij is mij tot Heil geworden.", "Jes 52:5": "En nu, wat heb Ik hier te doen? spreekt de HEERE, omdat Mijn volk voor niets is weggenomen, en degenen die over hen heersen, hen laten huilen, spreekt de HEERE, en Mijn Naam voortdurend de hele dag gelasterd wordt;", "Pred 7:21": "Geef ook uw hart niet aan alle woorden die men spreekt, opdat u niet hoort dat uw knecht u vervloekt.", "Hand 3:23": "En het zal gebeuren dat iedere ziel die niet naar deze Profeet zal hebben geluisterd, uitgeroeid zal worden uit het volk.", "Spr 12:9": "Beter is hij die zich gering acht en een knecht heeft, dan hij die zichzelf eert en gebrek heeft aan het brood.", "Ps 31:4-7": "Want U bent mijn Steenrots en mijn Burg; leid mij dan, en voer mij, omwille van Uw Naam. Doe mij uitgaan uit het net, dat zij voor mij verborgen hebben, want U bent mijn Sterkte. In Uw hand beveel ik mijn geest; U hebt mij verlost, HEERE, U, God van de waarheid!", "Spr 12:17-19": "Wie waarheid voortbrengt, maakt gerechtigheid bekend; maar een getuige van leugens maakt bedrog bekend. Er is een die woorden als steken van een zwaard onbedacht uitspreekt; maar de tong van de wijzen is medicijn. Een waarachtige lip zal voor altijd bevestigd worden; maar een valse tong is maar voor een ogenblik.", "Luk 16:22-28": "En het gebeurde dat de bedelaar stierf, en door de engelen gedragen werd in de schoot van Abraham; en de rijke stierf ook, en werd begraven. En toen hij in de hel zijn ogen ophief, terwijl hij in de pijn was, zag hij Abraham van verre, en Lazarus in zijn schoot. En hij riep en zei: Vader Abraham, ontferm u over mij, en zend Lazarus, dat hij het uiterste puntje van zijn vinger in het water dompelt, en mijn tong verkoelt; want ik lijd pijn in deze vlam.", "Rom 6:16": "Weet u niet dat aan wie u uzelf ter beschikking stelt als dienstknechten tot gehoorzaamheid, u dienstknechten bent van hem die u gehoorzaamt, óf van de zonde tot de dood, óf van de gehoorzaamheid tot gerechtigheid?", "Matt 7:23": "En dan zal Ik hun openlijk zeggen: Ik heb u nooit gekend; ga weg van Mij, u die de ongerechtigheid werkt!", "Ps 66:10-12": "Want U hebt ons beproefd, o God! U hebt ons gelouterd, zoals men zilver loutert; U had ons in het net gebracht; U had een engs band om onze lenden gelegd; U had de mens over ons hoofd laten rijden; wij waren in het vuur en in het water gekomen; maar U hebt ons uitgevoerd naar een overvloeiende verversing.", "Job 13:24": "Waarom verbergt U Uw aangezicht, en houdt U mij voor Uw vijand?", "1 Sam 17:37": "Verder zei David: De HEERE, Die mij gered heeft uit de klauw van de leeuw en uit de klauw van de beer, Die zal mij redden uit de hand van deze Filistijn. Toen zei Saul tegen David: Ga heen, en de HEERE zij met u!", "Ps 71:16": "Ik zal heengaan in de mogendheden van de Heere HEERE; ik zal Uw gerechtigheid vermelden, de Uwe alleen.", "Spr 14:12": "Er is een weg die iemand recht schijnt; maar het einde ervan is de weg van de dood.", "Hos 13:3": "Daarom zullen zij zijn als een morgenwolk, en als een vroege dauw, die heengaat; als kaf van de dorsvloer, en als rook uit de schoorsteen, weggejaagd door de wind.", "1 Tim 6:15": "die op Zijn tijd zal laten zien de gelukkige en enige machtige Heerser, de Koning der koningen en Heere der heren;", "Ps 44:6": "Door U zullen wij onze tegenstanders met hoorns stoten; in Uw Naam zullen wij vertrappen die tegen ons opstaan.", "Job 13:25-27": "Zult U een heen en weer gedreven blad verbrijzelen, en zult U een droge stoppel vervolgen? Want U schrijft bittere dingen tegen mij, en U doet mij de misdaden van mijn jeugd erven. U legt ook mijn voeten in het blok, en let op al mijn paden; U drukt Uzelf in de hielen van mijn voeten,", "Luk 17:22-37": "En Hij zei tegen de discipelen: Er zullen dagen komen, waarin u zult verlangen één van de dagen van de Zoon des mensen te zien, en u zult die niet zien. En zij zullen tegen u zeggen: Zie hier, of zie daar is Hij; ga niet heen en volg niet. Want zoals de bliksem, die van het ene einde onder de hemel bliksemt, tot het andere einde onder de hemel schijnt, zo zal ook de Zoon des mensen zijn in Zijn dag.", "Matt 27:52": "En de graven werden geopend, en veel lichamen van de heiligen die ontslapen waren, werden opgewekt;", "Mal 3:13": "Uw woorden zijn tegen Mij te sterk geworden, zegt de HEERE; maar u zegt: Wat hebben wij tegen U gesproken?", "Ps 25:5": "He. Vau. Leid mij in Uw waarheid, en leer mij, want Gij zijt de God van mijn heil; U verwacht ik de hele dag.", "Job 15:13": "Dat u uw geest keert tegen God, en zulke redenen uit uw mond laat uitgaan.", "Jes 51:23": "Maar Ik zal hem, die u bedroefd hebben, in de hand geven, die tegen uw ziel zeiden: Buig u neer, dat wij over u heen gaan; en u legde uw rug neer als aarde, en als een straat van hen die daarover gaan.", "Ps 116:3": "De banden van de dood hadden mij omvangen, en de angsten van het graf hadden mij getroffen; ik vond benauwdheid en droefenis.", "Ps 55:22": "Zijn mond is gladder dan boter, maar zijn hart is oorlog; zijn woorden zijn zachter dan olie, maar ze zijn blote zwaarden.", "Ps 36:13": "Daar zijn de werkers van de ongerechtigheid gevallen; zij zijn neergestoten, en kunnen niet weer opstaan.", "1 Kor 4:2": "En verder wordt van de uitdelers vereist, dat ieder getrouw bevonden wordt.", "2 Sam 16:10": "Maar de koning zei: Wat heb ik met u te doen, zonen van Zeruja? Ja, laat hem vloeken; want de HEERE heeft immers tegen hem gezegd: Vloek David; wie zou dan zeggen: Waarom hebt u dat gedaan?", "Jer 45:3": "U zegt: Wee mij nu, want de HEERE heeft droefheid aan mijn smart toegevoegd; ik ben moe van mijn zuchten, en vind geen rust!", "Job 18:8": "Want met zijn voeten zal hij in het net geworpen worden, en hij zal wandelen over het wargaren.", "Job 36:17": "Maar u hebt het oordeel van de goddeloze vervuld; het oordeel en het recht houden u vast.", "Ex 34:7": "Die de goedertierenheid bewaart aan vele duizenden, Die de ongerechtigheid, en overtreding, en zonde vergeeft; Die de schuldige geenszins onschuldig houdt, en de ongerechtigheid van de vaders bezoekt aan de kinderen, en aan de kindskinderen, tot in het derde en vierde geslacht.", "Ps 73:10": "Daarom keert Zijn volk zich hierheen, als hun water uit een volle beker wordt uitgedrukt,", "Spr 20:20": "Wie zijn vader of zijn moeder vervloekt, diens lamp zal uitgeblust worden in zwarte duisternis.", "Ps 71:20": "Gij, Die mij veel benauwdheden en kwaden hebt doen zien, zult mij weer levend maken, en zult mij weer ophalen uit de afgronden van de aarde.", "Spr 27:4": "Grimmigheid en overloping van toorn is wreedheid; maar wie zal voor jaloezie standhouden?", "Klaagl 2:5": "He. De Heere is geworden als een vijand; Hij heeft Israël verslonden, Hij heeft al haar paleizen verslonden. Hij heeft haar vestingen verdorven; en Hij heeft bij de dochter van Juda het klagen en kermen vermenigvuldigd.", "Hand 2:4-11": "En zij werden allen vervuld met de Heilige Geest, en begonnen te spreken met andere talen, zoals de Geest hun gaf uit te spreken. En er waren Joden die in Jeruzalem woonden, godvruchtige mannen, uit alle volken die er onder de hemel zijn. En toen deze stem gebeurd was, kwam de menigte samen en raakte in verwarring, want ieder hoorde hen in zijn eigen taal spreken.", "Ps 7:2": "HEERE, mijn God, op U vertrouw ik; verlos mij van al mijn vervolgers, en red mij.", "Ps 21:10": "U zult hen zetten als een vurige oven ter tijd van uw toornige aangezicht; de HEERE zal hen in Zijn toorn verslinden, en het vuur zal hen verteren.", "1 Petr 3:9": "vergeld geen kwaad met kwaad, of schelden met schelden, maar zegen daarentegen; want u weet dat u daartoe geroepen bent, opdat u zegening zou beërven.", "Jes 45:9": "Wee hem die met zijn Formeerder twist, zoals een potscherf met aarden potscherven! Zal ook het leem tegen zijn formeerder zeggen: Wat maakt u? of zal uw werk zeggen: Hij heeft geen handen?", "Ps 119:67": "Eer ik verdrukt werd, dwaalde ik, maar nu onderhoud ik Uw woord.", "Spr 27:6": "De wonden van hem die liefheeft, zijn trouw; maar de kussen van hem die haat, zijn te verafschuwen.", "Ps 31:6": "In Uw hand beveel ik mijn geest; U hebt mij verlost, HEERE, U, God van de waarheid!", "Jer 7:18": "De kinderen rapen hout, en de vaders steken het vuur aan, en de vrouwen kneden het deeg, om koeken te maken voor de koningin van de hemel, en drankoffers te offeren aan andere goden, om Mij verdriet aan te doen.", "Zach 13:9": "En Ik zal dat derde deel in het vuur brengen, en Ik zal het louteren, zoals men zilver loutert, en Ik zal het beproeven, zoals men goud beproeft; het zal Mijn Naam aanroepen, en Ik zal het verhoren; Ik zal zeggen: Het is Mijn volk; en het zal zeggen: De HEERE is mijn God.", "2 Kron 32:8": "Met hem is een arm van vlees, maar met ons is de HEERE, onze God, om ons te helpen en om onze oorlogen te voeren. En het volk steunde op de woorden van Jehizkia, de koning van Juda.", "Spr 12:2": "De goede zal een welgevallen krijgen van de HEERE; maar een man van schandelijke verdichtsels zal Hij verdoemen.", "1 Kor 7:21-24": "Bent u als dienstknecht geroepen, laat u dat niet bekommeren; maar als u ook vrij kunt worden, gebruik dat dan liever. Want wie in de Heere geroepen is als dienstknecht, is een vrijgelatene van de Heere; net zo ook, wie vrij zijnde geroepen is, is een dienstknecht van Christus. U bent duur gekocht, word geen dienstknechten van mensen.", "Ps 119:166": "O HEERE! ik hoop op Uw heil, en doe Uw geboden.", "Spr 29:5": "Een man die zijn naaste vleit, spreidt een net uit voor diens voeten.", "Hebr 11:4": "Door het geloof heeft Abel een beter offer aan God gebracht dan Kaïn, en daardoor heeft hij het getuigenis gekregen dat hij rechtvaardig was, doordat God over zijn gave getuigenis gaf; en door dit geloof spreekt hij nog, hoewel hij gestorven is.", "Job 40:3": "Zult u ook Mijn oordeel te niet maken? Zult U Mij verdoemen, opdat u rechtvaardig bent?", "Ps 4:4": "Weet toch, dat de HEERE Zich een gunstgenoot heeft afgezonderd; de HEERE zal horen, als ik tot Hem roep.", "Gal 2:20": "Ik ben met Christus gekruisigd; en ik leef, maar niet meer ik, maar Christus leeft in mij; en wat ik nu in het vlees leef, dat leef ik door het geloof van de Zoon van God, Die mij heeft liefgehad, en Zichzelf voor mij heeft overgegeven.", "Ps 37:36": "Maar hij ging voorbij, en zie, hij was er niet meer; en ik zocht hem, maar hij werd niet gevonden.", "Ps 73:26": "Bezwijkt mijn vlees en mijn hart, dan is God de Rotssteen van mijn hart, en mijn Deel in eeuwigheid.", "Rom 8:13": "Want als u naar het vlees leeft, zult u sterven; maar als u door de Geest de daden van het lichaam doodt, zult u leven.", "Luk 8:18": "Let er dan op hoe u hoort; want wie heeft, aan hem zal gegeven worden; en wie niet heeft, ook wat hij meent te hebben zal van hem afgenomen worden.", "Joh 5:28": "Verwonder u hier niet over, want de tijd komt waarin allen die in de graven zijn Zijn stem zullen horen;", "Ps 49:16": "Maar God zal mijn ziel uit de macht van het graf verlossen, want Hij zal mij opnemen. Sela.", "1 Kor 6:14": "En God heeft ook de Heere opgewekt, en zal ons opwekken door Zijn kracht.", "Luk 12:4": "En Ik zeg u, Mijn vrienden: wees niet bang voor hen die het lichaam doden, en daarna niets meer kunnen doen.", "Ps 43:5": "Wat buigt u zich neer, o mijn ziel! En wat bent u onrustig in mij? Hoop op God, want ik zal Hem nog loven; Hij is de rijke Verlossing van mijn aangezicht, en mijn God.", "Matt 12:34": "Adderengebroed! Hoe kunt u goede dingen spreken, terwijl u slecht bent? Want uit de overvloed van het hart spreekt de mond.", "Job 33:23": "Is er dan bij Hem een Gezant, een Uitlegger, een uit duizend, om de mens zijn rechte plicht te verkondigen;", "Hos 2:8-12": "Daarom zal Ik terugkomen, en Mijn koren wegnemen op zijn tijd, en Mijn nieuwe wijn op zijn vastgestelde tijd; en Ik zal Mijn wol en Mijn vlas wegrukken, dat diende om haar naaktheid te bedekken. En nu zal Ik haar schaamteloosheid ontdekken voor de ogen van haar minnaars; en niemand zal haar uit Mijn hand redden. En Ik zal al haar vrolijkheid doen ophouden, haar feesten, haar nieuwe maanden, en haar sabbatten, ja, al haar vastgestelde hoogtijden.", "1 Kor 15:22": "Want zoals zij allen in Adam sterven, zo zullen zij ook in Christus allen levend gemaakt worden.", "Ex 4:11": "En de HEERE zei tegen hem: Wie heeft de mens de mond gemaakt, of wie maakt de stomme, of dove, of ziende, of blinde? Ben Ik het niet, de HEERE?", "Job 13:15-23": "Zie, al doodde Hij mij, zou ik niet hopen? Toch zal ik mijn wegen voor Zijn aangezicht verdedigen. Ook zal Hij mij tot heil zijn; maar een huichelaar zal voor Zijn aangezicht niet komen. Hoor aandachtig mijn woord, en mijn uitleg met uw oren.", "Jes 32:6": "Want een dwaas spreekt dwaasheid, en zijn hart doet ongerechtigheid, om huichelarij te plegen, en om dwaling te spreken tegen de HEERE, om de ziel van de hongerige leeg te laten, en de dorstige drank te doen ontbreken.", "Ps 138:7": "Als ik wandel in het midden van de benauwdheid, maakt Gij mij levend; Uw hand strekt Gij uit tegen de toorn van mijn vijanden, en Uw rechterhand behoudt mij.", "1 Kron 21:12": "Of drie jaren honger, of drie maanden verteerd te worden voor het aangezicht van uw tegenstanders, en dat het zwaard van uw vijanden u achterhaalt; of drie dagen het zwaard van de HEERE, dat is, de pestilentie in het land, en een verdervende engel van de HEERE in al de gebieden van Israël? Zo bezie nu goed, wat antwoord ik Hem zal teruggeven, Die mij gezonden heeft.", "Job 1:16": "Terwijl deze nog sprak, kwam er een ander en zei: Het vuur van God viel uit de hemel en stak de schapen en de knechten in brand en verteerde ze; en ik ben maar alleen ontkomen om het u te vertellen.", "Spr 18:14": "De geest van een man zal zijn ziekte dragen; maar een verslagen geest, wie zal die opheffen?", "Spr 18:8": "De woorden van de kwaadspreker zijn als klappen, en dalen af tot in het binnenste van de buik.", "Hand 24:15": "Terwijl ik hoop heb op God, welke ook zijzelf verwachten, dat er een opstanding van de doden zal zijn, van de rechtvaardigen zowel als van de onrechtvaardigen.", "Job 9:12": "Zie, Hij zal roven, wie zal het Hem doen teruggeven? Wie zal tegen Hem zeggen: Wat doet U?", "Rom 6:21": "Wat voor vrucht had u toen van die dingen waarover u zich nu schaamt? Want het einde daarvan is de dood.", "Hand 3:22-24": "Want Mozes heeft tegen de vaderen gezegd: De Heere, uw God, zal u een Profeet doen opstaan uit uw broeders, zoals mij; naar Hem moet u luisteren, in alles wat Hij tegen u zal zeggen. En het zal gebeuren dat iedere ziel die niet naar deze Profeet zal hebben geluisterd, uitgeroeid zal worden uit het volk. En ook al de profeten, van Samuel af, en die daarna gevolgd zijn, zovelen als er gesproken hebben, hebben ook deze dagen van tevoren verkondigd.", "Job 11:14": "Als er ondeugd in uw hand is, doe die ver weg; en laat het onrecht in uw tenten niet wonen.", "Spr 19:28": "Een getuige van Belial bespot het recht; en de mond van de goddelozen slokt de ongerechtigheid in.", "1 Sam 17:45-47": "David daarentegen zei tegen de Filistijn: U komt naar mij toe met een zwaard, en met een speer, en met een schild; maar ik kom naar u toe in de Naam van de HEERE van de heerscharen, de God van de slagorden van Israël, Die u gehoond hebt. Vandaag zal de HEERE u overleveren in mijn hand, en ik zal u verslaan, en ik zal uw hoofd van u wegnemen, en ik zal de dode lichamen van het leger van de Filistijnen vandaag aan de vogels van de hemel en aan de dieren van het veld geven; en heel de aarde zal weten dat Israël een God heeft. En heel deze verzameling zal weten dat de HEERE niet door zwaard of door speer verlost; want de strijd is van de HEERE, Die zal u in onze hand geven.", "Mark 12:18-27": "En de Sadduceeën kwamen naar Hem toe, die zeggen dat er geen opstanding is, en zij vroegen Hem: Meester, Mozes heeft ons geschreven: Als iemands broer sterft, en een vrouw achterlaat, en geen kinderen nalaat, dat zijn broer diens vrouw moet nemen en voor zijn broer nageslacht moet verwekken. Nu waren er zeven broers, en de eerste nam een vrouw, en stervend liet hij geen nageslacht na.", "Job 14:15": "Dat U zou roepen, en ik U zou antwoorden, dat U naar het werk van Uw handen zou verlangen.", "Mark 9:43": "En als uw hand u doet struikelen, hak hem af; het is beter voor u verminkt het leven in te gaan, dan met twee handen naar de hel te gaan, in het onblusbare vuur;", "Ps 49:17": "Vrees niet wanneer een man rijk wordt, wanneer de eer van zijn huis groot wordt;", "2 Sam 12:14": "Toch, omdat u door deze daad de vijanden van de HEERE ernstig hebt doen lasteren, zal ook de zoon die u geboren is, zeker sterven.", "Job 36:12": "Maar als zij niet horen, dan gaan zij door het zwaard om, en geven zij de geest zonder kennis.", "2 Sam 7:28": "Nu dan, Heere HEERE! U bent die God, en Uw woorden zullen waarheid zijn, en U hebt dit goede tot Uw knecht gesproken.", "Ezech 22:21": "Ja, Ik zal u bijeenbrengen, en op u blazen in het vuur van Mijn verbolgenheid, zodat u in het midden ervan zult smelten.", "Ps 119:26": "Ik heb U mijn wegen verteld, en U hebt mij verhoord; leer mij Uw inzettingen.", "Job 5:14": "Overdag ontmoeten zij de duisternis, en zoals 's nachts tasten zij rond in de middag.", "Lev 24:10-16": "En de zoon van een Israëlitische vrouw ging naar buiten – hij was, te midden van de Israëlieten, de zoon van een Egyptische man – en de zoon van deze Israëlitische vrouw en een Israëlitische man kregen ruzie in het kamp. Toen lasterde de zoon van de Israëlitische vrouw uitdrukkelijk de NAAM, en vloekte; daarom brachten zij hem tot Mozes; de naam van zijn moeder nu was Selomith, de dochter van Dibri, van de stam Dan. En zij zetten hem in bewaring, totdat hun, naar de mond van de
