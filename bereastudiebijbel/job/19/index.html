n> <span class=\"wl\" data-l=\"L7\" data-code=\"H4672\">wordt</span>.", "29": "<span class=\"wl\" data-l=\"L1\" data-code=\"H1481\">Schroom</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H1481\">voor</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H2719\">het</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H2719\">zwaard</span>; <span class=\"wl\" data-l=\"L3\" data-code=\"H3588\">want</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H3588\">de</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H2534\">grimmigheid</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H2534\">is</span> over <span class=\"wl\" data-l=\"L5\" data-code=\"H5771\">de</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H5771\">misdaden</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H5771\">van</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H2719\">het</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H2719\">zwaard</span>; <span class=\"wl\" data-l=\"L7\" data-code=\"H4616\">opdat</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H1481\">u</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H3045\">weet</span>, <span class=\"wl\" data-l=\"L9\" data-code=\"H1779\">dat</span> <span class=\"wl\" data-l=\"L9\" data-code=\"H1779\">er</span> <span class=\"wl\" data-l=\"L9\" data-code=\"H1779\">een</span> <span class=\"wl\" data-l=\"L9\" data-code=\"H1779\">gericht</span> <span class=\"wl\" data-l=\"L9\" data-code=\"H1779\">is</span>."}, "koppeling_kjv": {"1": "Then <span class=\"wl wl-kjv\" data-code=\"H347\">Job</span> <span class=\"wl wl-kjv\" data-code=\"H6030\">answered</span> and said,", "2": "How long will ye <span class=\"wl wl-kjv\" data-code=\"H3013\">vex</span> my <span class=\"wl wl-kjv\" data-code=\"H5315\">soul,</span> and <span class=\"wl wl-kjv\" data-code=\"H1792\">break</span> me in pieces with words?", "3": "These <span class=\"wl wl-kjv\" data-code=\"H6235\">ten</span> <span class=\"wl wl-kjv\" data-code=\"H6471\">times</span> have ye <span class=\"wl wl-kjv\" data-code=\"H3637\">reproached</span> me: ye are not <span class=\"wl wl-kjv\" data-code=\"H954\">ashamed</span> that ye make yourselves strange", "4": "And be it <span class=\"wl wl-kjv\" data-code=\"H551\">indeed</span> that I have <span class=\"wl wl-kjv\" data-code=\"H7686\">erred,</span> mine <span class=\"wl wl-kjv\" data-code=\"H4879\">error</span> remaineth", "5": "If <span class=\"wl wl-kjv\" data-code=\"H551\">indeed</span> ye will <span class=\"wl wl-kjv\" data-code=\"H1431\">magnify</span> yourselves against me, and <span class=\"wl wl-kjv\" data-code=\"H3198\">plead</span> against me my reproach:", "6": "<span class=\"wl wl-kjv\" data-code=\"H3045\">Know</span> <span class=\"wl wl-kjv\" data-code=\"H645\">now</span> that <span class=\"wl wl-kjv\" data-code=\"H433\">God</span> hath <span class=\"wl wl-kjv\" data-code=\"H5791\">overthrown</span> me, and hath <span class=\"wl wl-kjv\" data-code=\"H5362\">compassed</span> me with his net.", "7": "Behold, I cry <span class=\"wl wl-kjv\" data-code=\"H6817\">out</span> of <span class=\"wl wl-kjv\" data-code=\"H2555\">wrong,</span> but I am not <span class=\"wl wl-kjv\" data-code=\"H6030\">heard:</span> I cry <span class=\"wl wl-kjv\" data-code=\"H7768\">aloud,</span> but there is no judgment.", "8": "He hath fenced <span class=\"wl wl-kjv\" data-code=\"H1443\">up</span> my <span class=\"wl wl-kjv\" data-code=\"H734\">way</span> that I cannot <span class=\"wl wl-kjv\" data-code=\"H5674\">pass,</span> and he hath <span class=\"wl wl-kjv\" data-code=\"H7760\">set</span> <span class=\"wl wl-kjv\" data-code=\"H2822\">darkness</span> in my paths.", "9": "He hath <span class=\"wl wl-kjv\" data-code=\"H6584\">stripped</span> me of my <span class=\"wl wl-kjv\" data-code=\"H3519\">glory,</span> and <span class=\"wl wl-kjv\" data-code=\"H5493\">taken</span> the <span class=\"wl wl-kjv\" data-code=\"H5850\">crown</span> from my head.", "10": "He hath <span class=\"wl wl-kjv\" data-code=\"H5422\">destroyed</span> me on every <span class=\"wl wl-kjv\" data-code=\"H5439\">side,</span> and I am <span class=\"wl wl-kjv\" data-code=\"H3212\">gone:</span> and mine <span class=\"wl wl-kjv\" data-code=\"H8615\">hope</span> hath he <span class=\"wl wl-kjv\" data-code=\"H5265\">removed</span> like a tree.", "11": "He hath also <span class=\"wl wl-kjv\" data-code=\"H2734\">kindled</span> his <span class=\"wl wl-kjv\" data-code=\"H639\">wrath</span> against me, and he <span class=\"wl wl-kjv\" data-code=\"H2803\">counteth</span> me unto him as one of his enemies.", "12": "His <span class=\"wl wl-kjv\" data-code=\"H1416\">troops</span> <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> <span class=\"wl wl-kjv\" data-code=\"H3162\">together,</span> and raise <span class=\"wl wl-kjv\" data-code=\"H5549\">up</span> their <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> against me, and <span class=\"wl wl-kjv\" data-code=\"H2583\">encamp</span> round <span class=\"wl wl-kjv\" data-code=\"H5439\">about</span> my tabernacle.", "13": "He hath <span class=\"wl wl-kjv\" data-code=\"H7368\">put</span> my <span class=\"wl wl-kjv\" data-code=\"H251\">brethren</span> <span class=\"wl wl-kjv\" data-code=\"H7368\">far</span> from me, and mine <span class=\"wl wl-kjv\" data-code=\"H3045\">acquaintance</span> are verily estranged", "14": "My <span class=\"wl wl-kjv\" data-code=\"H7138\">kinsfolk</span> have <span class=\"wl wl-kjv\" data-code=\"H2308\">failed,</span> and my familiar <span class=\"wl wl-kjv\" data-code=\"H3045\">friends</span> have forgotten", "15": "They that <span class=\"wl wl-kjv\" data-code=\"H1481\">dwell</span> in mine <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> and my <span class=\"wl wl-kjv\" data-code=\"H519\">maids,</span> <span class=\"wl wl-kjv\" data-code=\"H2803\">count</span> me for a <span class=\"wl wl-kjv\" data-code=\"H2114\">stranger:</span> I am an <span class=\"wl wl-kjv\" data-code=\"H5237\">alien</span> in their sight.", "16": "I <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> my <span class=\"wl wl-kjv\" data-code=\"H5650\">servant,</span> and he gave me no <span class=\"wl wl-kjv\" data-code=\"H6030\">answer;</span> I <span class=\"wl wl-kjv\" data-code=\"H2603\">intreated</span> him <span class=\"wl wl-kjv\" data-code=\"H1119\">with</span> my mouth.", "17": "My <span class=\"wl wl-kjv\" data-code=\"H7307\">breath</span> is <span class=\"wl wl-kjv\" data-code=\"H2114\">strange</span> to my <span class=\"wl wl-kjv\" data-code=\"H802\">wife,</span> though I <span class=\"wl wl-kjv\" data-code=\"H2589\">intreated</span> for the <span class=\"wl wl-kjv\" data-code=\"H1121\">children's</span> sake of mine own body.", "18": "Yea, young <span class=\"wl wl-kjv\" data-code=\"H5759\">children</span> <span class=\"wl wl-kjv\" data-code=\"H3988\">despised</span> me; I <span class=\"wl wl-kjv\" data-code=\"H6965\">arose,</span> and they spake", "19": "All my <span class=\"wl wl-kjv\" data-code=\"H5475\">inward</span> <span class=\"wl wl-kjv\" data-code=\"H4962\">friends</span> <span class=\"wl wl-kjv\" data-code=\"H8581\">abhorred</span> me: and they whom I <span class=\"wl wl-kjv\" data-code=\"H157\">loved</span> are turned", "20": "My <span class=\"wl wl-kjv\" data-code=\"H6106\">bone</span> <span class=\"wl wl-kjv\" data-code=\"H1692\">cleaveth</span> to my <span class=\"wl wl-kjv\" data-code=\"H5785\">skin</span> and to my <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh,</span> and I am <span class=\"wl wl-kjv\" data-code=\"H4422\">escaped</span> with the <span class=\"wl wl-kjv\" data-code=\"H5785\">skin</span> of my teeth.", "21": "Have <span class=\"wl wl-kjv\" data-code=\"H2603\">pity</span> upon me, have <span class=\"wl wl-kjv\" data-code=\"H2603\">pity</span> upon me, O ye my <span class=\"wl wl-kjv\" data-code=\"H7453\">friends;</span> for the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of <span class=\"wl wl-kjv\" data-code=\"H433\">God</span> hath touched", "22": "Why do ye <span class=\"wl wl-kjv\" data-code=\"H7291\">persecute</span> me as <span class=\"wl wl-kjv\" data-code=\"H410\">God,</span> and are not <span class=\"wl wl-kjv\" data-code=\"H7646\">satisfied</span> with my flesh?", "23": "Oh <span class=\"wl wl-kjv\" data-code=\"H5414\">that</span> my <span class=\"wl wl-kjv\" data-code=\"H4405\">words</span> were <span class=\"wl wl-kjv\" data-code=\"H645\">now</span> <span class=\"wl wl-kjv\" data-code=\"H3789\">written!</span> oh <span class=\"wl wl-kjv\" data-code=\"H5414\">that</span> they were <span class=\"wl wl-kjv\" data-code=\"H2710\">printed</span> in a book!", "24": "That they were <span class=\"wl wl-kjv\" data-code=\"H2672\">graven</span> with an <span class=\"wl wl-kjv\" data-code=\"H1270\">iron</span> <span class=\"wl wl-kjv\" data-code=\"H5842\">pen</span> and <span class=\"wl wl-kjv\" data-code=\"H5777\">lead</span> in the <span class=\"wl wl-kjv\" data-code=\"H6697\">rock</span> for ever!", "25": "For I <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> that my <span class=\"wl wl-kjv\" data-code=\"H1350\">redeemer</span> <span class=\"wl wl-kjv\" data-code=\"H2416\">liveth,</span> and that he shall <span class=\"wl wl-kjv\" data-code=\"H6965\">stand</span> at the <span class=\"wl wl-kjv\" data-code=\"H314\">latter</span> day upon the earth:", "26": "And though <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> my <span class=\"wl wl-kjv\" data-code=\"H5785\">skin</span> worms <span class=\"wl wl-kjv\" data-code=\"H5362\">destroy</span> this body, yet in my <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh</span> shall I <span class=\"wl wl-kjv\" data-code=\"H2372\">see</span> God:", "27": "Whom I shall <span class=\"wl wl-kjv\" data-code=\"H2372\">see</span> for myself, and mine <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes</span> shall <span class=\"wl wl-kjv\" data-code=\"H7200\">behold,</span> and not <span class=\"wl wl-kjv\" data-code=\"H2114\">another;</span> though my <span class=\"wl wl-kjv\" data-code=\"H3629\">reins</span> be <span class=\"wl wl-kjv\" data-code=\"H3615\">consumed</span> within", "28": "But ye should <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> Why <span class=\"wl wl-kjv\" data-code=\"H7291\">persecute</span> we him, seeing the <span class=\"wl wl-kjv\" data-code=\"H8328\">root</span> of the <span class=\"wl wl-kjv\" data-code=\"H1697\">matter</span> is found", "29": "Be ye <span class=\"wl wl-kjv\" data-code=\"H1481\">afraid</span> of the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword:</span> for <span class=\"wl wl-kjv\" data-code=\"H2534\">wrath</span> bringeth the <span class=\"wl wl-kjv\" data-code=\"H5771\">punishments</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">of</span> the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword,</span> that ye may <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> there is a <span class=\"wl wl-kjv\" data-code=\"H1779\">judgment.</span>"}};

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.Berea[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.Berea[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (Berea)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling', 'Matthew Henry-verklaring']],
  ['Geloofsbelijdenissen', ['1689 Baptist Confession', 'Westminster Confession']],
  ['Boeken', ['Institutie — Calvijn', 'A Body of Divinity — Watson']],
  ['Preken', ['Spurgeon']],
  ['Devotionals', ['Spurgeon']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    const heeftB = D.koppeling && D.koppeling[n];
    const heeftK = D.koppeling_kjv && D.koppeling_kjv[n];
    let h = '<div class="verg-kop">Grondwoorden</div>';
    if (!heeftB && !heeftK) {
      h += '<em>Nog geen woordkoppeling voor dit vers.</em>';
    } else {
      if (heeftB) h += `<div class="tsk-kop">Berea</div>` +
        `<div class="gw-tekst" style="font-family:Georgia,serif;line-height:1.8">${D.koppeling[n]}</div>` +
        `<div class="gw-detail" style="margin-top:.5rem"></div>`;
      if (heeftK) h += `<div class="tsk-kop" style="margin-top:.9rem">KJV</div>` +
        `<div class="gw-tekst" style="font-family:Georgia,serif;line-height:1.8">${D.koppeling_kjv[n]}</div>` +
        `<div class="gw-detail" style="margin-top:.5rem"></div>`;
      h += '<div class="bronregel">Klik op een onderstreept woord voor de vindplaatsen.</div>';
    }
    h += '<div class="verg-kop" style="margin-top:1.4rem">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const berea = D.tsk[n], engels = D.tsk_kjv[n];
    if ((!berea || !berea.length) && (!engels || !engels.length)) return '<em>Geen verwijzingen bij dit vers.</em>';
    let h = '';
    if (berea && berea.length) {
      h += '<div class="tsk-kop">Treasury of Scripture Knowledge | Berea</div>';
      h += berea.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r}">${r}</a>`).join('') + '</div>').join('');
    }
    if (engels && engels.length) {
      h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.tsk[n] && D.tsk[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vergelijk</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.Berea[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · Berea</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}
</script>
</body>
</html>
