n spreken zij mij tegen.", "19": "Alle mensen van mijn heimelijke raad hebben een afkeer van mij; en degenen die ik liefhad, zijn tegen mij gekeerd.", "20": "Mijn gebeente kleeft aan mijn huid en aan mijn vlees; en ik ben ontkomen met de huid van mijn tanden.", "21": "Ontferm u over mij, ontferm u over mij, o mijn vrienden! want de hand van God heeft mij aangeraakt.", "22": "Waarom vervolgt u mij als God, en wordt u niet verzadigd van mijn vlees?", "23": "Och, of nu mijn woorden toch opgeschreven werden. Och, of zij ook in een boek werden ingetekend!", "24": "Dat zij met een ijzeren griffie en lood voor eeuwig in een rots gehouwen werden!", "25": "Want ik weet: mijn Verlosser leeft, en Hij zal als de laatste over het stof opstaan;", "26": "En als zij na mijn huid dit doorknaagd zullen hebben, zal ik uit mijn vlees God aanschouwen;", "27": "Aan Wie ik voor mij aanschouwen zal, en mijn ogen zien zullen, en niet een vreemde; mijn nieren verlangen zeer in mijn schoot.", "28": "Voorwaar, u zou zeggen: Waarom vervolgen wij hem? Nu de wortel van de zaak in mij gevonden wordt.", "29": "Schroom voor het zwaard; want de grimmigheid is over de misdaden van het zwaard; opdat u weet, dat er een gericht is."}, "SV": {"1": "Maar Job antwoordde en zeide:", "2": "Hoe lang zult gijlieden mijn ziel bedroeven, en mij met woorden verbrijzelen?", "3": "Gij hebt nu tienmaal mij schande aangedaan; gij schaamt u niet, gij verhardt u tegen mij.", "4": "Maar ook het zij waarlijk, dat ik gedwaald heb, mijn dwaling zal bij mij vernachten.", "5": "Indien gijlieden waarlijk u verheft tegen mij, en mijn smaad tegen mij drijft;", "6": "Weet nu, dat God mij heeft omgekeerd, en mij *met* Zijn net omsingeld.", "7": "Ziet, ik roep, geweld! doch word niet verhoord; ik schreeuw, doch er is geen recht.", "8": "Hij heeft mijn weg toegemuurd, dat ik niet doorgaan kan, en over mijn paden heeft Hij duisternis gesteld.", "9": "Mijn eer heeft Hij van mij afgetrokken, en de kroon mijns hoofds heeft Hij weggenomen.", "10": "Hij heeft mij rondom afgebroken, zodat ik henenga, en heeft mijn verwachting als een boom weggerukt.", "11": "Daartoe heeft Hij Zijn toorn tegen mij ontstoken, en mij bij Zich geacht als Zijn vijanden.", "12": "Zijn benden zijn te zamen aangekomen, en hebben tegen mij haar weg gebaand, en hebben zich gelegerd rondom mijn tent.", "13": "Mijn broeders heeft Hij verre van mij gedaan; en die mij kennen, zekerlijk, zij zijn van mij vervreemd.", "14": "Mijn nabestaanden houden op, en mijn bekenden vergeten mij.", "15": "Mijn huisgenoten en mijn dienstmaagden achten mij voor een vreemde; een uitlander ben ik in hun ogen.", "16": "Ik riep mijn knecht, en hij antwoordde niet; ik smeekte met mijn mond tot hem.", "17": "Mijn adem is mijn huisvrouw vreemd; en ik smeek om der kinderen mijns buiks wil.", "18": "Ook versmaden mij de jonge kinderen; sta ik op, zo spreken zij mij tegen.", "19": "Alle mensen mijns heimelijken raads hebben een gruwel aan mij; en die ik liefhad, zijn tegen mij gekeerd.", "20": "Mijn gebeente kleeft aan mijn huid en aan mijn vlees; en ik ben ontkomen met de huid mijner tanden.", "21": "Ontfermt u mijner, ontfermt u mijner, o gij, mijn vrienden! want de hand Gods heeft mij aangeraakt.", "22": "Waarom vervolgt gij mij als God, en wordt niet verzadigd van mijn vlees?", "23": "Och, of nu mijn woorden toch opgeschreven wierden. Och, of zij in een boek ook wierden ingetekend!", "24": "Dat zij met een ijzeren griffie en lood voor eeuwig in een rots gehouwen wierden!", "25": "Want ik weet: mijn Verlosser leeft, en Hij zal de laatste over het stof opstaan;", "26": "En als zij na mijn huid dit doorknaagd zullen hebben, zal ik uit mijn vlees God aanschouwen;", "27": "Denwelken ik voor mij aanschouwen zal, en mijn ogen zien zullen, en niet een vreemde; mijn nieren verlangen zeer in mijn schoot.", "28": "Voorwaar, gij zoudt zeggen: Waarom vervolgen wij hem? Nademaal de wortel der zaak in mij gevonden wordt.", "29": "Schroomt u vanwege het zwaard; want de grimmigheid is *over* de misdaden des zwaards; opdat gij weet, dat er een gericht zij."}, "KJV": {"1": "Then Job answered and said,", "2": "How long will ye vex my soul, and break me in pieces with words?", "3": "These ten times have ye reproached me: ye are not ashamed *that* ye make yourselves strange", "4": "And be it indeed *that* I have erred, mine error remaineth", "5": "If indeed ye will magnify *yourselves* against me, and plead against me my reproach:", "6": "Know now that God hath overthrown me, and hath compassed me with his net.", "7": "Behold, I cry out of wrong, but I am not heard: I cry aloud, but *there is* no judgment.", "8": "He hath fenced up my way that I cannot pass, and he hath set darkness in my paths.", "9": "He hath stripped me of my glory, and taken the crown *from* my head.", "10": "He hath destroyed me on every side, and I am gone: and mine hope hath he removed like a tree.", "11": "He hath also kindled his wrath against me, and he counteth me unto him as *one of* his enemies.", "12": "His troops come together, and raise up their way against me, and encamp round about my tabernacle.", "13": "He hath put my brethren far from me, and mine acquaintance are verily estranged", "14": "My kinsfolk have failed, and my familiar friends have forgotten", "15": "They that dwell in mine house, and my maids, count me for a stranger: I am an alien in their sight.", "16": "I called my servant, and he gave *me* no answer; I intreated him with my mouth.", "17": "My breath is strange to my wife, though I intreated for the children's *sake* of mine own body.", "18": "Yea, young children despised me; I arose, and they spake", "19": "All my inward friends abhorred me: and they whom I loved are turned", "20": "My bone cleaveth to my skin and to my flesh, and I am escaped with the skin of my teeth.", "21": "Have pity upon me, have pity upon me, O ye my friends; for the hand of God hath touched", "22": "Why do ye persecute me as God, and are not satisfied with my flesh?", "23": "Oh that my words were now written! oh that they were printed in a book!", "24": "That they were graven with an iron pen and lead in the rock for ever!", "25": "For I know *that* my redeemer liveth, and *that* he shall stand at the latter *day* upon the earth:", "26": "And *though* after my skin *worms* destroy this *body*, yet in my flesh shall I see God:", "27": "Whom I shall see for myself, and mine eyes shall behold, and not another; *though* my reins be consumed within", "28": "But ye should say, Why persecute we him, seeing the root of the matter is found", "29": "Be ye afraid of the sword: for wrath *bringeth* the punishments of the sword, that ye may know *there is* a judgment."}}, "tsk": {"2": [{"kopje": "Hoe lang", "refs": ["Job 8:2", "Job 18:2", "Ps 13:2", "Openb 6:10"]}, {"kopje": "bedroeven", "refs": ["Job 27:2", "Richt 16:16", "Ps 6:3", "Ps 6:4", "Ps 42:11", "2 Petr 2:7", "2 Petr 2:8"]}, {"kopje": "verbrijzelen", "refs": ["Ps 55:22", "Ps 59:8", "Ps 64:4", "Spr 12:18", "Spr 18:21", "Jak 3:6-8"]}], "3": [{"kopje": "Nu al tien keer", "refs": ["Gen 31:7", "Lev 26:26", "Num 14:22", "Neh 4:12", "Dan 1:20"]}, {"kopje": "schande aangedaan", "refs": ["Job 4:6-11", "Job 5:3", "Job 5:4", "Job 8:4-6", "Job 11:3", "Job 11:14", "Job 15:4-6", "Job 15:11", "Job 15:12", "Job 18:4-21"]}, {"kopje": "verhardt u tegen mij", "refs": ["Job 19:17", "Gen 42:7", "Ps 69:9"]}], "4": [{"kopje": "ik gedwaald heb", "refs": ["Job 11:3-6"]}, {"kopje": "mijn", "refs": ["2 Sam 24:17", "Spr 9:12", "Ezech 18:4", "2 Kor 5:10", "Gal 6:5"]}], "5": [{"kopje": "verheft", "refs": ["Ps 35:26", "Ps 38:17", "Ps 41:12", "Ps 55:13", "Micha 7:8", "Zef 2:10", "Zach 12:7"]}, {"kopje": "aanvoert", "refs": ["1 Sam 1:6", "Neh 1:3", "Jes 4:1", "Luk 1:25", "Luk 13:2-4", "Joh 9:2", "Joh 9:34"]}], "6": [{"kopje": "God", "refs": ["Job 7:20", "Job 16:11-14", "Ps 44:10-15", "Ps 66:10-12"]}, {"kopje": "omsingeld", "refs": ["Job 18:8-10", "Klaagl 1:12", "Klaagl 1:13", "Ezech 12:13", "Ezech 32:3", ked (people)", "href": "../../nave/w/", "subs": ["Punishment Of"]}]}}, "extern": {"Job 30:30": "Mijn huid is zwart geworden over mij, en mijn gebeente is ontstoken van dorheid.", "Rom 12:15": "Verblijd u met de blijden, en ween met de wenende.", "Luk 22:48": "En Jezus zei tegen hem: Judas, verraadt u de Zoon des mensen met een kus?", "Dan 1:20": "En in alle zaken van verstandige wijsheid, die de koning hun voorlegde, vond hij hen tien keer beter dan al de tovenaars en sterrenkijkers die in zijn hele koninkrijk waren.", "Hos 2:5": "Daarom, zie, Ik zal uw weg met doornen omtuinen, en Ik zal een omheiningsmuur maken, zodat zij haar paden niet zal vinden.", "1 Kon 14:13": "En heel Israël zal hem beklagen en hem begraven; want deze alleen van Jerobeam zal in het graf komen, omdat in hem iets goeds gevonden is voor de HEERE, de God van Israël, in het huis van Jerobeam.", "Hos 7:12": "Wanneer zij zullen heengaan, zal Ik Mijn net over hen uitspreiden, Ik zal ze als vogels van de hemel doen neerdalen. Ik zal ze tuchtigen, zoals gehoord is in hun samenkomst.", "Matt 5:8": "Zalig zijn de reinen van hart, want zij zullen God zien.", "Micha 7:8": "Verblijd u niet over mij, o mijn vijandin! Wanneer ik gevallen ben, zal ik weer opstaan; wanneer ik in duisternis gezeten ben, zal de HEERE mij een licht zijn.", "Ps 31:12": "Vanwege al mijn wederpartijders ben ik, ook voor mijn buren, zeer tot een smaad geworden, en voor mijn bekenden tot een schrik; die mij op de straten zien, vluchten van mij weg.", "Job 16:13": "Zijn schutters hebben mij omringd; Hij heeft mijn nieren doorkliefd, en niet gespaard; Hij heeft mijn gal op de aarde uitgegoten.", "Jer 20:8": "Want zo vaak ik spreek, roep ik uit, roep ik geweld en verwoesting; omdat het woord van de HEERE mij de hele dag tot smaad en spot is.", "Job 6:14": "Aan hem die versmolten is, zou van zijn vriend weldadigheid gebeuren; of hij zou de vreze van de Almachtige verlaten.", "Fil 3:21": "Die ons vernederde lichaam veranderen zal, opdat het gelijkvormig wordt aan Zijn heerlijk lichaam, naar de werking waardoor Hij ook alle dingen aan Zichzelf kan onderwerpen.", "Klaagl 5:10": "Onze huid is zwart geworden als een oven, vanwege de verzengende hitte van de honger.", "Ex 32:16": "En diezelfde tafelen waren het werk van God; het schrift was ook het schrift van God zelf, in de tafelen gegraveerd.", "Spr 9:12": "Als u wijs bent, bent u wijs voor uzelf; en bent u een spotter, dan zult u het alleen dragen.", "2 Tim 4:16": "Bij mijn eerste verantwoording is niemand bij mij geweest, maar allen hebben mij verlaten. Het moet hun niet worden toegerekend.", "Job 17:15": "Waar zou dan nu mijn verwachting wezen? Ja, mijn verwachting, wie zal ze aanschouwen?", "Ps 13:2": "Hoe lang, HEERE, zult U mij steeds vergeten? Hoe lang zult U Uw aangezicht voor mij verbergen?", "Job 16:11": "God heeft mij overgegeven aan de verkeerde, en heeft mij overgeleverd in de handen van de goddelozen.", "Klaagl 3:4": "Beth. Hij heeft mijn vlees en mijn huid oud gemaakt, Hij heeft mijn beenderen gebroken.", "Job 13:24": "Waarom verbergt U Uw aangezicht, en houdt U mij voor Uw vijand?", "2 Kor 5:10": "Want wij moeten allen geopenbaard worden voor de rechterstoel van Christus, opdat ieder ontvangt wat door het lichaam gedaan is, naarmate hij gedaan heeft, hetzij goed, hetzij kwaad.", "Job 9:32": "Want Hij is geen man zoals ik, die ik antwoorden zou, zodat wij samen voor het gericht zouden komen.", "Openb 1:7": "Zie, Hij komt met de wolken en elk oog zal Hem zien, ook zij die Hem doorstoken hebben; en alle geslachten van de aarde zullen over Hem rouw bedrijven; ja, amen.", "Ps 58:11": "De rechtvaardige zal zich verblijden, als hij de wraak aanschouwt; hij zal zijn voeten wassen in het bloed van de goddeloze.", "Jes 10:6": "Ik zal hem zenden tegen een huichelachtig volk, en Ik zal hem bevel geven tegen het volk van Mijn verbolgenheid; opdat hij de roof rooft, en plundert de plundering, en het stelt ter vertreding, als het slijk van de straten.", "Job 1:16": "Terwijl deze nog sprak, kwam er een ander en zei: Het vuur van God viel uit de hemel en stak de schapen en de knechten in brand en verteerde ze; en ik ben maar alleen ontkomen om het u te vertellen.", "Ps 16:11": "U zult mij het pad van het leven bekendmaken; overvloed van vreugde is bij Uw aangezicht; liefelijkheden zijn in Uw rechterhand, eeuwig.", "Ps 123:3": "Wees ons genadig, HEERE! Wees ons genadig, want wij zijn de verachting veel te zat.", "Job 33:24": "Zo zal Hij hem genadig zijn, en zeggen: Verlos hem, dat hij in het verderf niet nederdaalt, Ik heb verzoening gevonden.", "Ex 28:12": "En u zult de twee stenen aan de schouderbanden van de efod zetten, als stenen ter gedachtenis voor de kinderen van Israël; en Aäron zal hun namen op zijn beide schouders dragen, ter gedachtenis, voor het aangezicht van de HEERE.", "Klaagl 3:8": "Gimel. Ook wanneer ik roep en schreeuw, sluit Hij Zijn oren voor mijn gebed.", "Hab 1:2": "HEERE! Hoe lang schreeuw ik, en U hoort niet, hoe lang roep ik: Geweld! tot U, en U verlost niet!", "1 Joh 3:2": "Geliefden, nu zijn wij kinderen van God, en het is nog niet openbaar geworden wat wij zijn zullen. Maar wij weten dat, als Hij geopenbaard zal zijn, wij Hem gelijk zullen zijn; want wij zullen Hem zien zoals Hij is.", "Jes 10:5": "Wee de Assyriër, die de roede van Mijn toorn is, en Mijn grimmigheid is een stok in hun hand!", "2 Kon 2:23": "En hij ging vandaar op naar Beth-el. Toen hij nu de weg opging, kwamen er kleine jongens uit de stad; die bespotten hem, en zeiden tegen hem: Kaalkop, ga op, kaalkop, ga op!", "Ps 42:11": "Met een doodsteek in mijn beenderen honen mij mijn tegenstanders, als zij de hele dag tegen mij zeggen: Waar is uw God?", "Job 11:14": "Als er ondeugd in uw hand is, doe die ver weg; en laat het onrecht in uw tenten niet wonen.", "Jak 4:12": "Er is één Wetgever, Die kan behouden en verderven. Maar wie bent u, dat u een ander veroordeelt?", "Ps 37:36": "Maar hij ging voorbij, en zie, hij was er niet meer; en ik zocht hem, maar hij werd niet gevonden.", "Ps 109:5": "En zij hebben mij kwaad voor goed opgelegd, en haat voor mijn liefde.", "1 Sam 1:6": "En haar tegenpartij tergde haar ook met terging, om haar te ergeren, omdat de HEERE haar baarmoeder toegesloten had.", "Gen 22:18": "En in uw nageslacht zullen alle volken van de aarde gezegend worden, omdat u Mijn stem gehoorzaam bent geweest.", "Num 14:22": "Want al de mannen die Mijn heerlijkheid gezien hebben, en Mijn tekenen, die Ik in Egypte en in de woestijn gedaan heb, en Mij nu tien keer beproefd hebben, en niet gehoorzaam zijn geweest aan Mijn stem;", "Job 33:23": "Is er dan bij Hem een Gezant, een Uitlegger, een uit duizend, om de mens zijn rechte plicht te verkondigen;", "Gal 6:5": "Want ieder zal zijn eigen pak dragen.", "Neh 1:3": "En zij zeiden tegen mij: De overgeblevenen, die van de gevangenschap daar in het gebied zijn overgebleven, zijn in grote ellende en in smaad; en de muur van Jeruzalem is afgebroken, en haar poorten zijn met vuur verbrand.", "Ex 28:21": "En deze stenen zullen zijn met de twaalf namen van de zonen van Israël, met hun namen; zij zullen als zegels gegraveerd worden, elk met zijn naam; voor de twaalf stammen zullen zij zijn.", "Jak 4:11": "Broeders, spreek niet kwaad van elkaar. Wie kwaad spreekt van zijn broeder en zijn broeder veroordeelt, die spreekt kwaad van de wet en veroordeelt de wet. Als u nu de wet veroordeelt, bent u geen dader van de wet, maar een rechter.", "Jes 50:10": "Wie is er onder u, die de HEERE vreest, die naar de stem van Zijn Knecht luistert? Als hij in de duisternis wandelt, en geen licht heeft, laat hij vertrouwen op de Naam van de HEERE en steunen op zijn God.", "Job 7:20": "Heb ik gezondigd, wat zal ik U doen, o Mensenhoeder? Waarom hebt U mij tot een mikpunt voor Uzelf gesteld, dat ik mijzelf tot een last ben?", "Hos 9:11": "Wat Efraïm aangaat, hun heerlijkheid zal wegvluchten als een vogel; vanaf de geboorte, en vanaf de moederschoot, en vanaf de ontvangenis af.", "Job 31:32": "De vreemdeling overnachtte niet op de straat; mijn deuren opende ik naar de weg;", "Ps 102:4": "Want mijn dagen zijn vergaan als rook, en mijn beenderen zijn uitgebrand als een haard.", "1 Kor 13:12": "Want wij zien nu door een spiegel in een duistere afspiegeling, maar dan zullen wij zien van aangezicht tot aangezicht; nu ken ik ten dele, maar dan zal ik kennen, zoals ik ook gekend ben.", "Job 18:2": "Hoe lang duurt het nog voordat u een einde maakt aan uw woorden? Let op, en daarna zullen wij spreken.", "Lev 26:26": "Als Ik u de staf van het brood zal hebben gebroken, dan zullen tien vrouwen uw brood in één oven bakken, en zullen uw brood bij het gewicht teruggeven; en u zult eten, maar niet verzadigd worden.", "Ps 41:10": "Zelfs de man van mijn vrede, op wie ik vertrouwde, die mijn brood at, heeft zijn hiel tegen mij groot gemaakt.", "Hab 1:3": "Waarom laat U mij ongerechtigheid zien, en aanschouwt U de kwelling? Want verwoesting en geweld is tegen mij, en er is twist, en men neemt gekijf op.", "Job 16:21": "Och, mocht men rechtspreken voor een man bij God, zoals een kind van een mens voor zijn vriend.", "Job 3:23": "Aan de man, wiens weg verborgen is, en die God overdekt heeft?", "Ps 35:26": "Laat hen beschaamd worden en samen schaamrood, die zich in mijn kwaad verblijden; laat hen met schaamte en schande bekleed worden, die zich tegen mij groot maken.", "Job 15:12": "Waarom rukt uw hart u weg, en waarom wenken uw ogen?", "Ps 55:13": "Want het is geen vijand die mij hoont, anders zou ik het hebben gedragen; het is mijn hater niet die zich tegen mij groot maakt, anders zou ik mij voor hem verborgen hebben.", "2 Kor 4:9": "Vervolgd, maar daarin niet verlaten; neergeworpen, maar niet verdorven;", "Job 16:9": "Zijn toorn verscheurt, en Hij haat mij; Hij knerst over mij met Zijn tanden; mijn tegenstander scherpt zijn ogen tegen mij.", "Job 33:10": "Zie, Hij vindt oorzaken tegen mij, Hij houdt mij voor Zijn vijand.", "Job 21:27": "Zie, ik ken uw gedachten, en de boze plannen, waarmee u tegen mij geweld doet.", "Job 6:11": "Wat is mijn kracht, dat ik hopen zou? Of welk is mijn einde, dat ik mijn leven verlengen zou?", "Job 1:19": "En zie, een grote wind kwam van over de woestijn, en stootte tegen de vier hoeken van het huis, en het viel op de jongemannen, zodat zij stierven; en ik ben maar alleen ontkomen om het u te vertellen.", "Ps 88:9": "Mijn bekenden hebt U ver van mij weggedaan, U hebt mij hun tot een grote gruwel gesteld; ik ben opgesloten en kan niet uitkomen.", "Klaagl 1:12": "Lamed. Gaat het u niet aan, u allen, die over de weg gaat? Schouwt het aan en ziet, of er een smart is gelijk mijn smart, die mij aangedaan is, waarmee de HEERE mij bedroefd heeft ten dage van de gloed van Zijn toorn.", "Job 29:21": "Zij hoorden mij aan, en wachtten, en zwegen op mijn raad.", "Job 17:11": "Mijn dagen zijn voorbijgegaan; uitgerukt zijn mijn gedachten, de bezittingen van mijn hart.", "Ps 32:4": "Want Uw hand was dag en nacht zwaar op mij; mijn sap veranderde in zomerdroogte. Sela.", "Job 1:17": "Terwijl deze nog sprak, kwam er een ander en zei: De Chaldeeën stelden drie groepen op, en vielen de kamelen aan, en namen ze mee, en sloegen de knechten met de scherpte van het zwaard; en ik ben maar alleen ontkomen om het u te vertellen.", "Gen 42:7": "Toen Jozef zijn broers zag, herkende hij hen; maar hij hield zich vreemd tegenover hen, en sprak hard met hen, en zei tegen hen: Waar komt u vandaan? En zij zeiden: Uit het land Kanaän; om voedsel te kopen.", "Ps 49:17": "Vrees niet wanneer een man rijk wordt, wanneer de eer van zijn huis groot wordt;", "Ezech 18:4": "Zie, alle zielen zijn van Mij; zoals de ziel van de vader, zo is ook de ziel van de zoon van Mij; de ziel die zondigt, die zal sterven.", "Jer 23:12": "Daarom zal hun weg voor hen zijn als zeer gladde plaatsen in de duisternis; zij zullen voortgedreven worden en daarin vallen; want Ik zal een kwaad over hen brengen in het jaar van hun bezoeking, spreekt de HEERE.", "Job 16:14": "Hij heeft mij gebroken met breuk op breuk; Hij is tegen mij aangelopen als een geweldige.", "Ps 64:4": "Die hun tong scherpen als een zwaard, een bitter woord richten als hun pijl;", "Joh 8:12": "Jezus sprak dan weer tegen hen en zei: Ik ben het licht van de wereld; wie Mij volgt, zal in de duisternis niet wandelen, maar zal het licht van het leven hebben.", "Jes 61:6": "Maar u zult priesters van de HEERE heten, men zal u dienaren van onze God noemen; u zult het vermogen van de heidenvolken eten, en op hun heerlijkheid zult u zich beroemen.", "Job 30:12": "Ter rechterhand staat de jeugd op, stoten mijn voeten weg, en banen tegen mij hun verderfelijke wegen.", "Job 15:11": "Zijn de vertroostingen van God u te klein, en schuilt er een geheime zaak bij u?", "Job 2:10": "Maar hij zei tegen haar: U spreekt zoals een van de dwaze vrouwen spreekt; zouden wij dan het goede van God ontvangen, en het kwade niet ontvangen? In dit alles zondigde Job niet met zijn lippen.", "Micha 7:6": "Want de zoon veracht de vader, de dochter staat op tegen haar moeder, de schoondochter tegen haar schoonmoeder; iemands vijanden zijn zijn huisgenoten.", "Ps 102:6": "Mijn beenderen kleven aan mijn vlees, vanwege de stem van het zuchten.", "1 Kor 15:53": "Want dit vergankelijke moet onvergankelijkheid aandoen, en dit sterfelijke moet onsterfelijkheid aandoen.", "Ps 89:47": "Hoe lang, o HEERE! zult Gij U steeds verbergen, zal Uw grimmigheid branden als een vuur?", "Klaagl 2:5": "He. De Heere is geworden als een vijand; Hij heeft Israël verslonden, Hij heeft al haar paleizen verslonden. Hij heeft haar vestingen verdorven; en Hij heeft bij de dochter van Juda het klagen en kermen vermenigvuldigd.", "Job 2:5": "Strek toch Uw hand uit, en tast zijn gebeente en zijn vlees aan; dan zal hij U beslist in Uw aangezicht vervloeken!", "Ps 69:27": "Want zij vervolgen hem die U geslagen hebt; en maken een praat van de smart van Uw verwonden.", "2 Kor 4:8": "Als mensen die in alles verdrukt worden, maar niet benauwd; twijfelmoedig, maar niet mismoedig;", "Deut 27:8": "En u zult op deze stenen alle woorden van deze wet schrijven, die goed uitdrukkend.", "Ezech 32:3": "Zo zegt de Heere HEERE: Ik zal daarom Mijn net over u uitspreiden door een vergadering van veel volken; die zullen u optrekken in Mijn garen.", "Klaagl 2:6": "Vau. En Hij heeft Zijn hut met geweld afgerukt, als een hof, Hij heeft Zijn vergaderplaats verdorven; de HEERE heeft in Sion doen vergeten het hoogtijd en de sabbat, en Hij heeft in de gramschap van Zijn toorn de koning en de priester smadelijk verworpen.", "Spr 18:24": "Een man die vrienden heeft, moet zich vriendelijk gedragen; want er is een vriend die meer aankleeft dan een broeder.", "Ps 32:3": "Toen ik zweeg, verouderden mijn beenderen, in mijn brullen de hele dag.", "Job 17:1": "Mijn geest is verdorven, mijn dagen worden uitgeblust, de graven zijn voor mij.", "Ezech 12:13": "Ik zal ook Mijn net over hem uitspreiden, zodat hij in Mijn jachtnet gegrepen wordt; en Ik zal hem brengen naar Babylonië, het land van de Chaldeeën; ook zal hij dat niet zien, hoewel hij daar zal sterven.", "Job 11:3": "Zouden uw leugens de mensen doen zwijgen, en zou u spotten, en zou niemand u beschamen?", "Luk 1:25": "Zo heeft de Heere mij gedaan, in de dagen waarin Hij naar mij omzag, om mijn smaad onder de mensen weg te nemen.", "Jer 20:10": "Want ik heb de kwaadsprekerij van velen gehoord, schrik van alle kanten. \"Geef ons te kennen,\" zeggen ze, \"en wij zullen het bekendmaken\"; al mijn vertrouwde vrienden letten op mijn struikelen; ze zeggen: \"Misschien laat hij zich overhalen, dan zullen wij de overhand over hem krijgen, en onze wraak op hem nemen.\"", "Job 31:31": "Als de lieden van mijn tent niet hebben gezegd: Och, hadden wij van zijn vlees maar, wij zouden niet verzadigd worden;", "Ps 38:3": "Want Uw pijlen zijn in mij gedaald, en Uw hand is op mij neergedaald.", "2 Sam 24:17": "En David, toen hij de engel zag die het volk sloeg, sprak tot de HEERE, en zei: Zie, ik, ik heb gezondigd, en ik, ik heb onrecht gehandeld, maar wat hebben deze schapen gedaan? Laat toch Uw hand tegen mij zijn en tegen het huis van mijn vader.", "Ps 59:8": "Zie, zij storten overvloedig uit met hun mond; zwaarden zijn op hun lippen; want wie hoort het?", "Joh 13:18": "Ik zeg dit niet van u allen: Ik weet wie Ik uitverkoren heb; maar dit gebeurt, opdat de Schrift vervuld wordt: Die met Mij het brood eet, heeft tegen Mij zijn hiel opgeheven.", "Job 2:9": "Toen zei zijn vrouw tegen hem: Houdt u nog steeds vast aan uw oprechtheid? Vervloek God en sterf.", "Ps 58:12": "En de mens zal zeggen: Zeker, er is vrucht voor de rechtvaardige; zeker, er is een God, Die op de aarde recht spreekt.", "Pred 11:9": "Verblijd u, jongeman, in uw jeugd, en laat uw hart zich vermaken in de dagen van uw jongelingschap, en wandel in de wegen van uw hart, en in wat uw ogen zien; maar weet dat God u, om al deze dingen, voor het gericht zal doen komen.", "Ps 69:9": "Ik ben mijn broeders vreemd geworden, en onbekend aan de kinderen van mijn moeder.", "Jes 54:5": "Want uw Maker is uw Man, HEERE van de heerscharen is Zijn Naam; en de Heilige van Israël is uw Verlosser; Hij zal de God van de hele aardbodem genoemd worden.", "Ps 6:4": "Ja, mijn ziel is zeer verschrikt; en U, HEERE, hoe lang nog?", "Zef 2:10": "Dat zullen zij hebben in plaats van hun hoogmoed; want zij hebben beschimpt, en zich groot gemaakt tegen het volk van de HEERE van de heerscharen.", "Jer 17:1": "De zonde van Juda is geschreven met een ijzeren griffie, met de punt van een diamant; gegraven in de tafel van hun hart, en aan de hoornen van uw altaren;", "Ps 119:81": "Caph. Mijn ziel is bezweken van verlangen naar Uw heil; op Uw woord heb ik gehoopt.", "Job 34:5": "Want Job heeft gezegd: Ik ben rechtvaardig, en God heeft mijn recht weggenomen.", "Job 7:5": "Mijn vlees is met het gewormte en met het gruis van het stof bekleed; mijn huid is gekliefd en verachtelijk geworden.", "Jer 13:16": "Geeft eer aan de HEERE, uw God, voor Hij het duister maakt, en voor uw voeten zich stoten aan de schemerende bergen; terwijl u naar licht uitkijkt, en Hij dat tot een schaduw van de dood maakt, en tot diepe duisternis zet.", "Ps 37:35": "Resch. Ik heb een geweldenaar gezien, een goddeloze, die zich uitbreidde als een groene inlandse boom.", "Richt 16:16": "En het gebeurde, toen zij hem alle dagen met haar woorden onder druk zette, en hem lastigviel, dat zijn ziel verdrietig werd tot de dood toe;", "Zach 12:7": "En de HEERE zal de tenten van Juda het eerst redden, opdat de heerlijkheid van het huis van David, en de heerlijkheid van de inwoners van Jeruzalem, zich niet verheft tegen Juda.", "Joh 9:34": "Zij antwoordden en zeiden tegen hem: U bent helemaal in zonden geboren, en u leert ons? En zij wierpen hem eruit.", "Ps 38:12": "Mijn liefhebbers en mijn vrienden blijven staan tegenover mijn plaag, en mijn naaste familie blijft ver weg staan.", "Ps 19:15": "Laat de redenen van mijn mond, en de overdenking van mijn hart welgevallig zijn voor Uw aangezicht, o HEERE, mijn Rotssteen en mijn Verlosser!", "Klaagl 3:7": "Gimel. Hij heeft mij toegemuurd, zodat ik er niet uit kan gaan; Hij heeft mijn koperen boeien verzwaard.", "Job 40:3": "Zult u ook Mijn oordeel te niet maken? Zult U Mij verdoemen, opdat u rechtvaardig bent?", "Job 10:3": "Is het U goed, dat U verdrukt, dat U het werk van Uw handen verwerpt, en over de raad van de goddelozen schijnsel geeft?", "2 Sam 16:23": "In die dagen was de raad die Achitofel gaf, als had men naar het woord van God gevraagd; zo was alle raad van Achitofel, zowel bij David als bij Absalom.", "Jes 26:19": "Uw doden zullen leven, ook mijn dode lichaam, zij zullen opstaan; waak op en juich, u die in het stof woont! Want uw dauw zal zijn als een dauw van de moeskruiden, en het land zal de overledenen uitwerpen.", "Hebr 13:3": "Denk aan de gevangenen, alsof u mee gevangen was; en aan hen die kwalijk behandeld worden, alsof u ook zelf in het lichaam kwalijk behandeld was.", "Ps 22:3": "Mijn God! Ik roep overdag, maar U antwoordt niet; en 's nachts, en ik heb geen stilte.", "Ps 38:17": "Want ik zei: Laat hen zich toch over mij niet verblijden! Wanneer mijn voet zou wankelen, zouden zij zich tegen mij groot maken.", "Num 24:17": "Ik zal hem zien, maar nu niet; ik zal hem aanschouwen, maar niet van dichtbij. Er zal een ster voortkomen uit Jakob, en er zal een scepter uit Israël opkomen; die zal de gebieden van de Moabieten verslaan, en al de kinderen van Seth verstoren.", "Ps 41:12": "Hierbij weet ik, dat U lust aan mij hebt, dat mijn vijand over mij niet zal juichen.", "Joh 9:2": "En Zijn discipelen vroegen Hem: Rabbi, wie heeft er gezondigd, deze man of zijn ouders, dat hij blind geboren zou worden?", "Ps 90:7": "Want wij vergaan door Uw toorn; en door Uw grimmigheid worden wij verschrikt.", "Ps 49:18": "want hij zal bij zijn sterven niets meenemen, zijn eer zal hem niet achterna dalen.", "Ps 6:3": "Wees mij genadig, HEERE, want ik ben verzwakt; genees mij, HEERE, want mijn beenderen zijn verschrikt.", "Klaagl 4:8": "Cheth. Maar nu is hun gedaante donkerder dan roet, men herkent hen niet op de straten; hun huid kleeft aan hun beenderen, zij is verdord, zij is geworden als hout.", "Deut 27:2": "Het zal dan gebeuren, op de dag dat u de Jordaan overgestoken bent naar het land dat de HEERE, uw God, u geven zal, dat u grote stenen zult oprichten en ze met kalk bestrijken;", "Joz 24:7": "Zij nu riepen tot de HEERE, en Hij bracht duisternis tussen u en de Egyptenaars, en Hij liet de zee over hen komen en bedekte hen; en uw ogen hebben gezien wat Ik in Egypte gedaan heb. Daarna hebt u lange tijd in de woestijn gewoond.", "Micha 3:3": "Ja, zij zijn het, die het vlees van mijn volk eten, en hun huid afstropen, en hun beenderen verbreken; en uiteen leggen, zoals in een pot, en als vlees in het midden van een ketel.", "Ps 88:19": "U hebt vriend en metgezel ver van mij weggedaan; mijn bekenden zijn in duisternis.", "Job 8:2": "Hoe lang zult u deze dingen nog spreken, en hoe lang zullen de woorden van uw mond een geweldige wind zijn?", "2 Petr 2:8": "(want deze rechtvaardige man, die onder hen woonde, heeft dag na dag zijn rechtvaardige ziel gekweld door het zien en horen van hun onrechtvaardige daden);", "Openb 6:10": "En zij riepen met grote stem, en zeiden: Hoelang, o heilige en waarachtige Heerser, oordeelt en wreekt U ons bloed niet van hen, die op de aarde wonen?", "Spr 4:19": "De weg van de goddelozen is als donkerheid; zij weten niet, waarover zij zullen struikelen.", "Job 5:3": "Ik heb een dwaas gezien die wortel schoot; doch meteen vervloekte ik zijn woning.", "Job 1:11": "Maar strek toch nu Uw hand uit, en tast alles aan wat hij heeft; dan zal hij U beslist in Uw aangezicht vervloeken.", "Job 27:2": "Zo waarachtig als God leeft, Die mijn recht weggenomen heeft, en de Almachtige, Die mijn ziel bitterheid heeft aangedaan!", "Ps 69:21": "De smaad heeft mijn hart gebroken, en ik ben zeer zwak; en ik heb gewacht op medelijden, maar er is geen; en op vertroosters, maar heb ze niet gevonden.", "2 Petr 2:7": "en de rechtvaardige Lot, die vermoeid was door de losbandige levenswijze van de goddeloze mensen, daaruit verlost heeft;", "Ps 109:4": "Voor mijn liefde staan zij mij tegen; maar ik was steeds in het gebed.", "Matt 10:21": "En de ene broer zal de andere broer overleveren tot de dood, en de vader het kind, en de kinderen zullen opstaan tegen de ouders, en hen doden.", "Jes 59:21": "Wat Mij aangaat, dit is Mijn Verbond met hen, zegt de HEERE: Mijn Geest, Die op u is, en Mijn woorden, die Ik in uw mond gelegd heb, die zullen van uw mond niet wijken, ook niet van de mond van uw zaad, ook niet van de mond van het zaad van uw zaad, zegt de HEERE, van nu af tot in eeuwigheid toe.", "Job 5:4": "Ver waren zijn zonen van heil; en zij werden verbrijzeld in de poort, en er was geen verlosser.", "Spr 18:21": "Dood en leven zijn in de macht van de tong; en ieder die haar liefheeft, zal haar vrucht eten.", "Gen 3:15": "En Ik zal vijandschap zetten tussen u en de vrouw, en tussen uw nageslacht en haar Nageslacht; Dat zal u de kop vermorzelen, en u zult Het de hiel vermorzelen.", "Klaagl 3:9": "Gimel. Hij heeft mijn wegen toegemuurd met uitgehouwen stenen, Hij heeft mijn paden krom gemaakt.", "Klaagl 1:13": "Mem. Van de hoogte heeft Hij een vuur in mijn beenderen gezonden, waarover Hij geheerst heeft; Hij heeft voor mijn voeten een net uitgebreid, Hij heeft mij achterwaarts doen keren, Hij heeft mij woest en ziek gemaakt de hele dag.", "Job 24:20": "De baarmoeder vergeet hem, het gewormte vindt hem zoet, aan hem wordt niet meer gedacht; en het onrecht wordt gebroken als een stuk hout.", "Ps 38:4": "Er is niets heels in mijn vlees, vanwege Uw gramschap; er is geen vrede in mijn beenderen, vanwege mijn zonde.", "Spr 12:18": "Er is een die woorden als steken van een zwaard onbedacht uitspreekt; maar de tong van de wijzen is medicijn.", "1 Kor 12:26": "En hetzij dat één lid lijdt, alle leden lijden mee; hetzij dat één lid geëerd wordt, alle leden verblijden zich mee.", "Ps 102:12": "Mijn dagen zijn als een afgaande schaduw, en ik verdor als gras.", "Matt 7:2": "Want met het oordeel waarmee u oordeelt, zult u geoordeeld worden; en met de maat waarmee u meet, zal u weer gemeten worden.", "Micha 7:5": "Geloof een vriend niet, vertrouw niet op een boezemvriend; bewaar de deuren van uw mond voor haar die in uw schoot ligt.", "Job 1:15": "Doch de Sabeeërs deden een inval, en namen ze mee, en sloegen de knechten met de scherpte van het zwaard; en ik ben maar alleen ontkomen om het u te vertellen.", "Job 10:16": "Want het verheft zich; als een felle leeuw jaagt U mij; U keert weer en stelt U wonderlijk tegen mij.", "Gen 31:7": "Maar uw vader heeft mij bedrogen, en heeft mijn loon tien keer veranderd; maar God heeft hem niet toegelaten mij kwaad te doen.", "Jes 8:1": "Verder zei de HEERE tegen mij: Neem u een grote rol, en schrijf daarop met een gewone schrijfstift: Haastende tot de roof, is hij spoedig tot de buit!", "Ps 55:21": "Hij slaat zijn handen aan hen die vrede met Hem hadden; hij ontheiligt Zijn verbond.", "Job 2:7": "Toen ging de satan weg van het aangezicht van de HEERE, en sloeg Job met kwaadaardige zweren, van zijn voetzool af tot zijn schedel toe.", "Job 6:15": "Mijn broeders hebben trouweloos gehandeld als een beek; als de storting der beken gaan zij door;", "Fil 1:23": "Want ik word door deze twee gedrongen: ik heb het verlangen om heen te gaan en met Christus te zijn, want dat is verreweg het beste;", "Matt 26:56": "maar dit alles is gebeurd, opdat de Schriften van de profeten vervuld zouden worden. Toen vluchtten alle discipelen en lieten Hem in de steek.", "Jes 4:1": "En op die dag zullen zeven vrouwen één man vastgrijpen en zeggen: Ons eigen brood zullen wij eten, en met onze eigen kleren zullen wij bekleed zijn; laat ons alleen naar uw naam genoemd worden, neem onze smaad weg.", "Ps 55:22": "Zijn mond is gladder dan boter, maar zijn hart is oorlog; zijn woorden zijn zachter dan olie, maar ze zijn blote zwaarden.", "Jes 51:23": "Maar Ik zal hem, die u bedroefd hebben, in de hand geven, die tegen uw ziel zeiden: Buig u neer, dat wij over u heen gaan; en u legde uw rug neer als aarde, en als een straat van hen die daarover gaan.", "Matt 7:1": "Oordeel niet, opdat u niet geoordeeld wordt.", "Job 6:4": "Want de pijlen van de Almachtige zijn in mij, waarvan het vurige venijn mijn geest uitdrinkt; de verschrikkingen van God rusten zich tegen mij.", "Jes 3:5": "En het volk zal gedrongen worden, de een zal zijn tegen de ander, en ieder tegen zijn naaste; de jongeling zal zich brutaal gedragen tegen de oude, de verachte tegen de eerlijke.", "Neh 4:12": "En het gebeurde, toen de Joden die bij hen woonden kwamen, dat zij het ons wel tien keer zeiden, vanuit alle plaatsen vanwaar zij naar ons terugkwamen.", "Job 31:35": "Och, had ik er maar een die mij hoorde! Zie, mijn oogmerk is, dat de Almachtige mij antwoordt, en dat mijn tegenpartij een boek schrijft.", "Deut 27:3": "en u zult daarop alle woorden van deze wet schrijven, wanneer u overgestoken bent; opdat u komt in het land dat de HEERE, uw God, u geven zal, een land dat overvloeit van melk en honing, zoals de HEERE, de God van uw vaderen, u beloofd heeft.", "Ps 89:45": "Gij hebt zijn schoonheid doen ophouden; en Gij hebt zijn troon ter aarde neergestoten.", "Deut 32:22": "Want een vuur is aangestoken in Mijn toorn, en zal branden tot in de onderste hel, en zal het land met zijn opbrengst verteren, en de gronden van de bergen in vlam zetten.", "Jes 30:8": "Nu dan, ga heen, schrijf het voor hen op een tafel, en teken het op in een boek, opdat het blijft tot de laatste dag, voor altijd, tot in eeuwigheid.", "Ef 1:7": "In Wie wij de verlossing hebben door Zijn bloed, namelijk de vergeving van de misdaden, naar de rijkdom van Zijn genade,", "Ps 16:9": "Daarom is mijn hart blij, en mijn eer verheugt zich; ook zal mijn lichaam met zekerheid rusten.", "Jes 59:20": "En er zal een Verlosser tot Sion komen, namelijk voor hen die zich bekeren van de overtreding in Jakob, spreekt de HEERE.", "Job 31:36": "Zou ik het niet op mijn schouder dragen? Ik zou het op mij binden als een kroon.", "Job 30:1": "Maar nu lachen zij die jonger zijn dan ik, om mij, van wie ik hun vaderen versmaad zou hebben, om ze bij de honden van mijn kudde te zetten.", "Judas 1:14": "En van deze mensen heeft ook Enoch, de zevende vanaf Adam, geprofeteerd, en gezegd: Zie, de Heere is gekomen met Zijn vele duizenden heiligen;", "Ps 17:15": "Maar ik zal Uw aangezicht in gerechtigheid aanschouwen, ik zal verzadigd worden met Uw beeld, als ik zal ontwaken.", "Ex 28:11": "naar steensnijderswerk, zoals men de zegels graveert, zult u deze twee stenen graveren, met de namen van de zonen van Israël; u zult ze maken, zodat zij omvat zijn in gouden kastjes.", "Job 29:20": "Mijn heerlijkheid was nieuw bij mij, en mijn boog vernieuwde zich in mijn hand."}, "noten": ta-code=\"H5315\">soul,</span> and <span class=\"wl wl-kjv\" data-code=\"H1792\">break</span> me in pieces with words?", "3": "These <span class=\"wl wl-kjv\" data-code=\"H6235\">ten</span> <span class=\"wl wl-kjv\" data-code=\"H6471\">times</span> have ye <span class=\"wl wl-kjv\" data-code=\"H3637\">reproached</span> me: ye are not <span class=\"wl wl-kjv\" data-code=\"H954\">ashamed</span> that ye make yourselves strange", "4": "And be it <span class=\"wl wl-kjv\" data-code=\"H551\">indeed</span> that I have <span class=\"wl wl-kjv\" data-code=\"H7686\">erred,</span> mine <span class=\"wl wl-kjv\" data-code=\"H4879\">error</span> remaineth", "5": "If <span class=\"wl wl-kjv\" data-code=\"H551\">indeed</span> ye will <span class=\"wl wl-kjv\" data-code=\"H1431\">magnify</span> yourselves against me, and <span class=\"wl wl-kjv\" data-code=\"H3198\">plead</span> against me my reproach:", "6": "<span class=\"wl wl-kjv\" data-code=\"H3045\">Know</span> <span class=\"wl wl-kjv\" data-code=\"H645\">now</span> that <span class=\"wl wl-kjv\" data-code=\"H433\">God</span> hath <span class=\"wl wl-kjv\" data-code=\"H5791\">overthrown</span> me, and hath <span class=\"wl wl-kjv\" data-code=\"H5362\">compassed</span> me with his net.", "7": "Behold, I cry <span class=\"wl wl-kjv\" data-code=\"H6817\">out</span> of <span class=\"wl wl-kjv\" data-code=\"H2555\">wrong,</span> but I am not <span class=\"wl wl-kjv\" data-code=\"H6030\">heard:</span> I cry <span class=\"wl wl-kjv\" data-code=\"H7768\">aloud,</span> but there is no judgment.", "8": "He hath fenced <span class=\"wl wl-kjv\" data-code=\"H1443\">up</span> my <span class=\"wl wl-kjv\" data-code=\"H734\">way</span> that I cannot <span class=\"wl wl-kjv\" data-code=\"H5674\">pass,</span> and he hath <span class=\"wl wl-kjv\" data-code=\"H7760\">set</span> <span class=\"wl wl-kjv\" data-code=\"H2822\">darkness</span> in my paths.", "9": "He hath <span class=\"wl wl-kjv\" data-code=\"H6584\">stripped</span> me of my <span class=\"wl wl-kjv\" data-code=\"H3519\">glory,</span> and <span class=\"wl wl-kjv\" data-code=\"H5493\">taken</span> the <span class=\"wl wl-kjv\" data-code=\"H5850\">crown</span> from my head.", "10": "He hath <span class=\"wl wl-kjv\" data-code=\"H5422\">destroyed</span> me on every <span class=\"wl wl-kjv\" data-code=\"H5439\">side,</span> and I am <span class=\"wl wl-kjv\" data-code=\"H3212\">gone:</span> and mine <span class=\"wl wl-kjv\" data-code=\"H8615\">hope</span> hath he <span class=\"wl wl-kjv\" data-code=\"H5265\">removed</span> like a tree.", "11": "He hath also <span class=\"wl wl-kjv\" data-code=\"H2734\">kindled</span> his <span class=\"wl wl-kjv\" data-code=\"H639\">wrath</span> against me, and he <span class=\"wl wl-kjv\" data-code=\"H2803\">counteth</span> me unto him as one of his enemies.", "12": "His <span class=\"wl wl-kjv\" data-code=\"H1416\">troops</span> <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> <span class=\"wl wl-kjv\" data-code=\"H3162\">together,</span> and raise <span class=\"wl wl-kjv\" data-code=\"H5549\">up</span> their <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> against me, and <span class=\"wl wl-kjv\" data-code=\"H2583\">encamp</span> round <span class=\"wl wl-kjv\" data-code=\"H5439\">about</span> my tabernacle.", "13": "He hath <span class=\"wl wl-kjv\" data-code=\"H7368\">put</span> my <span class=\"wl wl-kjv\" data-code=\"H251\">brethren</span> <span class=\"wl wl-kjv\" data-code=\"H7368\">far</span> from me, and mine <span class=\"wl wl-kjv\" data-code=\"H3045\">acquaintance</span> are verily estranged", "14": "My <span class=\"wl wl-kjv\" data-code=\"H7138\">kinsfolk</span> have <span class=\"wl wl-kjv\" data-code=\"H2308\">failed,</span> and my familiar <span class=\"wl wl-kjv\" data-code=\"H3045\">friends</span> have forgotten", "15": "They that <span class=\"wl wl-kjv\" data-code=\"H1481\">dwell</span> in mine <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> and my <span class=\"wl wl-kjv\" data-code=\"H519\">maids,</span> <span class=\"wl wl-kjv\" data-code=\"H2803\">count</span> me for a <span class=\"wl wl-kjv\" data-code=\"H2114\">stranger:</span> I am an <span class=\"wl wl-kjv\" data-code=\"H5237\">alien</span> in their sight.", "16": "I <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> my <span class=\"wl wl-kjv\" data-code=\"H5650\">servant,</span> and he gave me no <span class=\"wl wl-kjv\" data-code=\"H6030\">answer;</span> I <span class=\"wl wl-kjv\" data-code=\"H2603\">intreated</span> him <span class=\"wl wl-kjv\" data-code=\"H1119\">with</span> my mouth.", "17": "My <span class=\"wl wl-kjv\" data-code=\"H7307\">breath</span> is <span class=\"wl wl-kjv\" data-code=\"H2114\">strange</span> to my <span class=\"wl wl-kjv\" data-code=\"H802\">wife,</span> though I <span class=\"wl wl-kjv\" data-code=\"H2589\">intreated</span> for the <span class=\"wl wl-kjv\" data-code=\"H1121\">children's</span> sake of mine own body.", "18": "Yea, young <span class=\"wl wl-kjv\" data-code=\"H5759\">children</span> <span class=\"wl wl-kjv\" data-code=\"H3988\">despised</span> me; I <span class=\"wl wl-kjv\" data-code=\"H6965\">arose,</span> and they spake", "19": "All my <span class=\"wl wl-kjv\" data-code=\"H5475\">inward</span> <span class=\"wl wl-kjv\" data-code=\"H4962\">friends</span> <span class=\"wl wl-kjv\" data-code=\"H8581\">abhorred</span> me: and they whom I <span class=\"wl wl-kjv\" data-code=\"H157\">loved</span> are turned", "20": "My <span class=\"wl wl-kjv\" data-code=\"H6106\">bone</span> <span class=\"wl wl-kjv\" data-code=\"H1692\">cleaveth</span> to my <span class=\"wl wl-kjv\" data-code=\"H5785\">skin</span> and to my <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh,</span> and I am <span class=\"wl wl-kjv\" data-code=\"H4422\">escaped</span> with the <span class=\"wl wl-kjv\" data-code=\"H5785\">skin</span> of my teeth.", "21": "Have <span class=\"wl wl-kjv\" data-code=\"H2603\">pity</span> upon me, have <span class=\"wl wl-kjv\" data-code=\"H2603\">pity</span> upon me, O ye my <span class=\"wl wl-kjv\" data-code=\"H7453\">friends;</span> for the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of <span class=\"wl wl-kjv\" data-code=\"H433\">God</span> hath touched", "22": "Why do ye <span class=\"wl wl-kjv\" data-code=\"H7291\">persecute</span> me as <span class=\"wl wl-kjv\" data-code=\"H410\">God,</span> and are not <span class=\"wl wl-kjv\" data-code=\"H7646\">satisfied</span> with my flesh?", "23": "Oh <span class=\"wl wl-kjv\" data-code=\"H5414\">that</span> my <span class=\"wl wl-kjv\" data-code=\"H4405\">words</span> were <span class=\"wl wl-kjv\" data-code=\"H645\">now</span> <span class=\"wl wl-kjv\" data-code=\"H3789\">written!</span> oh <span class=\"wl wl-kjv\" data-code=\"H5414\">that</span> they were <span class=\"wl wl-kjv\" data-code=\"H2710\">printed</span> in a book!", "24": "That they were <span class=\"wl wl-kjv\" data-code=\"H2672\">graven</span> with an <span class=\"wl wl-kjv\" data-code=\"H1270\">iron</span> <span class=\"wl wl-kjv\" data-code=\"H5842\">pen</span> and <span class=\"wl wl-kjv\" data-code=\"H5777\">lead</span> in the <span class=\"wl wl-kjv\" data-code=\"H6697\">rock</span> for ever!", "25": "For I <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> that my <span class=\"wl wl-kjv\" data-code=\"H1350\">redeemer</span> <span class=\"wl wl-kjv\" data-code=\"H2416\">liveth,</span> and that he shall <span class=\"wl wl-kjv\" data-code=\"H6965\">stand</span> at the <span class=\"wl wl-kjv\" data-code=\"H314\">latter</span> day upon the earth:", "26": "And though <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> my <span class=\"wl wl-kjv\" data-code=\"H5785\">skin</span> worms <span class=\"wl wl-kjv\" data-code=\"H5362\">destroy</span> this body, yet in my <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh</span> shall I <span class=\"wl wl-kjv\" data-code=\"H2372\">see</span> God:", "27": "Whom I shall <span class=\"wl wl-kjv\" data-code=\"H2372\">see</span> for myself, and mine <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes</span> shall <span class=\"wl wl-kjv\" data-code=\"H7200\">behold,</span> and not <span class=\"wl wl-kjv\" data-code=\"H2114\">another;</span> though my <span class=\"wl wl-kjv\" data-code=\"H3629\">reins</span> be <span class=\"wl wl-kjv\" data-code=\"H3615\">consumed</span> within", "28": "But ye should <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> Why <span class=\"wl wl-kjv\" data-code=\"H7291\">persecute</span> we him, seeing the <span class=\"wl wl-kjv\" data-code=\"H8328\">root</span> of the <span class=\"wl wl-kjv\" data-code=\"H1697\">matter</span> is found", "29": "Be ye <span class=\"wl wl-kjv\" data-code=\"H1481\">afraid</span> of the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword:</span> for <span class=\"wl wl-kjv\" data-code=\"H2534\">wrath</span> bringeth the <span class=\"wl wl-kjv\" data-code=\"H5771\">punishments</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">of</span> the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword,</span> that ye may <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> there is a <span class=\"wl wl-kjv\" data-code=\"H1779\">judgment.</span>"}};
const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"

const BASIS_URL = D.meta.basis_url;
const PARALLEL_VOLGORDE = ['Berea', 'SV', 'KJV'];
let vertaling = 'Berea';
let openVers = null;

const bijbel = document.getElementById('bijbel');
const popup = document.getElementById('popup');
const toast = document.getElementById('toast');
const nummers = Object.keys(D.vertalingen.Berea);

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden"><select id="boekkies">${boekOpties}</select> ` +
    `<select id="hfdkies">${hfdOpties}</select></span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.Berea[n] || '—');
}

/* ---------- vertaling-keuze (dropdown) + studie-dropdown ---------- */
(function bouwVertaalkies() {
  const sel = document.getElementById('vertaalkies');
  sel.innerHTML = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  sel.onchange = e => { vertaling = e.target.value; bouwRijen(); };
})();
document.getElementById('studiekies').onchange = e => { if (e.target.value) location.href = e.target.value; };

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.Berea[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (Berea)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function paneelInhoud(n, tab) {
  if (tab === 'grondwoorden') {
    const heeftB = D.koppeling && D.koppeling[n];
    const heeftK = D.koppeling_kjv && D.koppeling_kjv[n];
    if (!heeftB && !heeftK) return '<em>Nog geen woordkoppeling voor dit vers.</em>';
    let h = '';
    if (heeftB) h += `<div class="tsk-kop">Berea</div>` +
      `<div class="gw-tekst" style="font-family:Georgia,serif;line-height:1.8">${D.koppeling[n]}</div>` +
      `<div class="gw-detail" style="margin-top:.5rem"></div>`;
    if (heeftK) h += `<div class="tsk-kop" style="margin-top:.9rem">KJV</div>` +
      `<div class="gw-tekst" style="font-family:Georgia,serif;line-height:1.8">${D.koppeling_kjv[n]}</div>` +
      `<div class="gw-detail" style="margin-top:.5rem"></div>`;
    return h + '<div class="bronregel">Klik op een onderstreept woord voor de vindplaatsen.</div>';
  }
  if (tab === 'vertalingen') {
    return PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
  }
  if (tab === 'verwijzingen') {
    const berea = D.tsk[n], engels = D.tsk_kjv[n];
    if ((!berea || !berea.length) && (!engels || !engels.length)) return '<em>Geen verwijzingen bij dit vers.</em>';
    let h = '';
    if (berea && berea.length) {
      h += '<div class="tsk-kop">Treasury of Scripture Knowledge | Berea</div>';
      h += berea.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r}">${r}</a>`).join('') + '</div>').join('');
    }
    if (engels && engels.length) {
      h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.subs && it.subs.length ? `<ul class="ond-subs">${it.subs.map(s=>`<li>${s}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.tsk[n] && D.tsk[n].length), heeftO = !!D.onderwerpen[n];
  const heeftG = !!((D.koppeling && D.koppeling[n]) || (D.koppeling_kjv && D.koppeling_kjv[n]));
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : (heeftG ? 'grondwoorden' : 'vertalingen'));
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'grondwoorden' ? 'actief' : ''} ${heeftG ? '' : 'leeg'}" data-tab="grondwoorden" data-n="${n}">Grondwoorden</div>
    <div class="ntab" data-tab="vertalingen" data-n="${n}">Vertalingen</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.Berea[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · Berea</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}
</script>
</body>
