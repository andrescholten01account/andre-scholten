ie drukken kan, en de dieren van het veld die vertrappen kunnen?", "19": "Zij verhardt zich tegen haar jongen, alsof zij de hare niet waren; haar arbeid is tevergeefs, *omdat* zij zonder vrees is.", "20": "Want God heeft haar van wijsheid ontbloot, en heeft haar van het verstand niet meegedeeld.", "21": "Als het tijd is, verheft zij zich in de hoogte; zij belacht het paard en zijn rijder.", "22": "Zult u het paard sterkte geven? Kunt u zijn hals met donder bekleden?", "23": "Zult u het beroeren als een sprinkhaan? De pracht van zijn gesnuif is een verschrikking.", "24": "Het graaft in de grond, en het is vrolijk in zijn kracht; en trekt uit, de geharnaste tegemoet.", "25": "Het belacht de vrees, en wordt niet ontsteld, en keert niet weerom vanwege het zwaard.", "26": "Tegen hem ratelt de pijlkoker, het vlammig ijzer van de speer en van de lans.", "27": "Met schudding en beroering slokt het de aarde op, en gelooft niet, dat het is het geluid van de bazuin.", "28": "In het volle geschal van de bazuin, zegt het: Heah! en ruikt de krijg van verre, de donder van de vorsten en het gejuich.", "29": "Vliegt de sperwer door uw verstand, *en* breidt hij zijn vleugels uit naar het zuiden?", "30": "Is het naar uw bevel, dat de arend zich omhoog verheft, en dat hij zijn nest in de hoogte maakt?", "31": "Hij woont en vernacht in de steenrots, op de scherpte van de steenrots en van de vaste plaats.", "32": "Van daar speurt hij het voedsel op; zijn ogen zien van verre af.", "33": "Ook zuipen zijn jongen bloed; en waar verslagenen zijn, daar is hij.", "34": "En de HEERE antwoordde Job, en zei:", "35": "Is het twisten met de Almachtige onderrichten? Wie God bestraft, die antwoordt daarop.", "36": "Toen antwoordde Job de HEERE, en zei:", "37": "Zie, ik ben te gering; wat zou ik U antwoorden? Ik leg mijn hand op mijn mond.", "38": "Eenmaal heb ik gesproken, maar zal niet antwoorden; of tweemaal, maar zal niet voortvaren."}, "SV": {"1": "Zult gij voor den ouden leeuw roof jagen, of de g 22": "Zult gij het paard sterkte geven? Kunt gij zijn hals met donder bekleden?", "23": "Zult gij het beroeren als een sprinkhaan? De pracht van zijn gesnuif is een verschrikking.", "24": "Het graaft in den grond, en het is vrolijk in zijn kracht; en trekt uit, den geharnaste tegemoet.", "25": "Het belacht de vreze, en wordt niet ontsteld, en keert niet wederom vanwege het zwaard.", "26": "Tegen hem ratelt de pijlkoker, het vlammig ijzer des spies en der lans.", "27": "Met schudding en beroering slokt het de aarde op, en gelooft niet, dat het is het geluid der bazuin.", "28": "In het volle geklank der bazuin, zegt het: Heah! en ruikt den krijg van verre, den donder der vorsten en het gejuich.", "29": "Vliegt de sperwer door uw verstand, *en* breidt hij zijn vleugelen uit naar het zuiden?", "30": "Is het naar uw bevel, dat de arend zich omhoog verheft, en dat hij zijn nest in de hoogte maakt?", "31": "Hij woont en vernacht in de steenrots, op de scherpte der steenrots en der vaste plaats.", "32": "Van daar speurt hij de spijze op; zijn ogen zien van verre af.", "33": "Ook zuipen zijn jongen bloed; en waar verslagenen zijn, daar is hij.", "34": "En de HEERE antwoordde Job, en zeide:", "35": "Is het twisten met den Almachtige onderrichten? Wie God bestraft, die antwoorde daarop.", "36": "Toen antwoordde Job den HEERE, en zeide:", "37": "Zie, ik ben te gering; wat zou ik U antwoorden? Ik leg mijn hand op mijn mond.", "38": "Eenmaal heb ik gesproken, maar zal niet antwoorden; of tweemaal, maar zal niet voortvaren."}, "KJV": {"1": "Knowest thou the time when the wild goats of the rock bring forth? *or* canst thou mark when the hinds do calve?", "2": "Canst thou number the months *that* they fulfil? or knowest thou the time when they bring forth?", "3": "They bow themselves, they bring forth their young ones, they cast out their sorrows.", "4": "Their young ones are in good liking, they grow up with corn; they go forth, and return", "5": "Who hath sent out the wild ass free? or who hath loosed the bands of the wild ass?", "6": "Whose house I have made the wilderness, and the barren land his dwellings.", "7": "He scorneth the multitude of the city, neither regardeth he the crying of the driver.", "8": "The range of the mountains *is* his pasture, and he searcheth after every green thing.", "9": "Will the unicorn be willing to serve thee, or abide by thy crib?", "10": "Canst thou bind the unicorn with his band in the furrow? or will he harrow the valleys after", "11": "Wilt thou trust him, because his strength *is* great? or wilt thou leave thy labour", "12": "Wilt thou believe him, that he will bring home thy seed, and gather *it into* thy barn?", "13": "*Gavest thou* the goodly wings unto the peacocks? or wings and feathers unto the ostrich?", "14": "Which leaveth her eggs in the earth, and warmeth them in dust,", "15": "And forgetteth that the foot may crush them, or that the wild beast may break", "16": "She is hardened against her young ones, as though *they were* not hers: her labour is in vain without fear;", "17": "Because God hath deprived her of wisdom, neither hath he imparted to her understanding.", "18": "What time she lifteth up herself on high, she scorneth the horse and his rider.", "19": "Hast thou given the horse strength? hast thou clothed his neck with thunder?", "20": "Canst thou make him afraid as a grasshopper? the glory of his nostrils *is* terrible.", "21": "He paweth in the valley, and rejoiceth in *his* strength: he goeth on to meet the armed men.", "22": "He mocketh at fear, and is not affrighted; neither turneth he back from the sword.", "23": "The quiver rattleth against him, the glittering spear and the shield.", "24": "He swalloweth the ground with fierceness and rage: neither believeth he that *it is* the sound of the trumpet.", "25": "He saith among the trumpets, Ha, ha; and he smelleth the battle afar off, the thunder of the captains, and the shouting.", "26": "Doth the hawk fly by thy wisdom, *and* s  "href": "../../nave/r/", "subs": ["Exemplified"]}], "torrey": [{"topic": "Humility", "href": "../../torrey/h/", "subs": ["Exemplified › Job"]}]}, "38": {"nave": [{"topic": "Conviction", "href": "../../nave/c/", "subs": ["Of Sin"]}, {"topic": "Humility", "href": "../../nave/h/", "subs": ["Exemplified"]}, {"topic": "Prayer", "href": "../../nave/p/", "subs": ["Confession In"]}]}}, "extern": {"Hos 8:1": "De bazuin aan uw mond; hij komt als een arend tegen het huis van de Heere; omdat zij Mijn verbond hebben overtreden, en tegen Mijn wet in opstand zijn gekomen.", "Jer 2:24": "Zij is een woudezelin, gewend aan de woestijn, naar de lust van haar ziel schept zij de wind; wie zou haar ontmoeting kunnen afkeren? Allen die haar zoeken, zullen niet moe worden, in haar maand zullen zij haar vinden.", "Ezra 9:15": "O HEERE, God van Israël! U bent rechtvaardig; want wij zijn overgelaten ter ontkoming, zoals het is op deze dag. Zie, wij zijn voor Uw aangezicht in onze schuld; want er is niemand die voor Uw aangezicht zou kunnen bestaan, om hiervan.", "Spr 23:5": "Zult u uw ogen laten vliegen op iets wat er niet is? Want het maakt zich zeker vleugels, als een arend, die naar de hemel vliegt.", "Spr 21:31": "Het paard wordt bereid tegen de dag van het strijd; maar de overwinning is van de HEERE.", "Ex 5:18": "Ga dan nu heen, werk; doch stro zal u niet gegeven worden, evenwel zult u het aantal tichelstenen leveren.", "Spr 3:16": "Lengte van dagen is in haar rechterhand, in haar linkerhand rijkdom en eer.", "Job 21:5": "Kijk mij aan, en word verbaasd, en leg de hand op de mond.", "Lev 16:11": "Aäron dan zal de stier van het zondoffer, die voor hemzelf zal zijn, brengen, en voor zichzelf en voor zijn huis verzoening doen, en zal de stier van het zondoffer, die voor hemzelf zal zijn, slachten.", "Jes 30:16": "En u zegt: Nee, maar op paarden zullen wij vluchten; daarom zult u vluchten! En: Op snelle paarden zullen wij rijden; daarom zullen uw vervolgers ook snel zijn!", "2 Kon 6:10": "Daarom zond de koning van Israël bericht naar die plaats, waarover de man van God hem gezegd en gewaarschuwd had, en hij wachtte zich daar, niet één keer, en niet twee keer.", "Ps 145:15": "Ain. Aller ogen wachten op U; en U geeft hun hun voedsel op de juiste tijd.", "Ps 145:16": "Pe. U doet Uw hand open, en verzadigt alles wat leeft, naar Uw welbehagen.", "Ezra 9:6": "En ik zei: Mijn God, ik ben beschaamd en schaamrood om mijn aangezicht tot U op te heffen, mijn God; want onze ongerechtigheden zijn vermenigvuldigd tot boven ons hoofd, en onze schuld is groot geworden tot aan de hemel.", "Job 33:13": "Waarom hebt u tegen Hem getwist? Want Hij antwoordt niet van al Zijn daden.", "Ps 51:7": "Zie, ik ben in ongerechtigheid geboren, en in zonde heeft mijn moeder mij ontvangen.", "Mark 3:17": "En Jakobus, de zoon van Zebedeüs, en Johannes, de broer van Jakobus; en Hij gaf hun de bijnamen Boanerges, dat wil zeggen: zonen van de donder;", "Gen 32:10": "Ik ben geringer dan al de weldaden en al de trouw die U aan Uw knecht bewezen hebt; want met mijn staf ben ik deze Jordaan overgestoken, en nu ben ik tot twee legers geworden!", "Ezech 47:11": "Maar de modderige plaatsen en moerassen ervan zullen niet gezond worden, ze zijn aan het zout overgegeven.", "Luk 24:41": "En toen zij het van blijdschap nog niet geloofden, en zich verwonderden, zei Hij tegen hen: Hebt u hier iets te eten?", "Job 34:32": "Behalve wat ik zie, leer Gij mij; heb ik onrecht gewrocht, ik zal het niet meer doen.", "Jes 58:3": "En zeggen: Waarom vasten wij, en ziet U het niet aan, waarom kwellen wij onze ziel, en weet U het niet? Zie, op de dag waarop u vast, vindt u uw genoegen, en u eist streng al uw arbeid.", "Ps 20:8": "Dezen vermelden van wagens, en die van paarden; maar wij zullen vermelden van de Naam van de HEERE, onze God.", "Dan 9:5": "Wij hebben gezondigd, en onrecht gedaan, en goddeloos gehandeld, en gerebelleerd, door af te wijken van Uw geboden en van Uw rechten.", "Ps 33:17": "Het paard schiet tekort voor de overwinning, en bevrijdt niet door zijn grote sterkte.", "Hab 2:13": "Zie, is het niet van de HEERE van de heerscharen, dat de volken arbeiden voor het vuur, en de mensen zich vermoeien voor niets?", "Deut 28:56": "Wat betreft de tedere en verwende vrouw onder u, die niet vertrouwd was met haar voetzool op de aarde te zetten, vanwege haar verwendheid en tederheid; haar oog zal boosaardig zijn tegen de man van haar schoot, en tegen haar zoon, en tegen haar dochter;", "1 Kon 3:26": "Maar de vrouw wier zoon de levende was, sprak tot de koning (want haar ingewanden ontstaken vanwege haar zoon), en zei: Och, mijn heer! Geef haar dat levende kind, en dood het geenszins; de andere zei daarentegen: Het zal noch van u noch van mij zijn, snijd het doormidden.", "Deut 14:15": "En de struisvogel, en de nachtuil, en de koekoek, en de sperwer naar zijn soort;", "Job 7:12": "Ben ik dan een zee, of een walvis, dat U een wacht bij mij zet?", "Luk 17:37": "En zij antwoordden en zeiden tegen Hem: Waar, Heere? En Hij zei tegen hen: Waar het lichaam is, daar zullen de arenden zich verzamelen.", "2 Kon 6:28": "Verder zei de koning tegen haar: Wat is er met u? En zij zei: Deze vrouw heeft tegen mij gezegd: Geef uw zoon, dat wij hem vandaag eten, en morgen zullen wij mijn zoon eten.", "Jes 53:6": "Wij dwaalden allen als schapen, wij keerden ons ieder naar zijn eigen weg; maar de HEERE heeft de ongerechtigheid van ons allen op Hem doen neerkomen.", "Job 31:37": "Het getal van mijn treden zou ik hem aanwijzen; als een vorst zou ik tot hem naderen.", "Zach 2:13": "Zwijg, alle vlees, voor het aangezicht van de HEERE! want Hij is ontwaakt uit Zijn heilige woning.", "Hoogl 2:12": "De bloemen worden gezien in het land, de zangtijd komt dichtbij, en de stem van de tortelduif wordt gehoord in ons land.", "Ps 29:9": "De stem van de HEERE doet de hinden jongen werpen, en ontbloot de wouden; maar in Zijn tempel zegt ieder Hem eer aan.", "Job 4:11": "De oude leeuw vergaat, omdat er geen prooi is, en de jongen van een oude leeuwin worden verstrooid.", "Job 9:16": "Al zou ik roepen en Hij mij antwoorden, ik zou niet geloven dat Hij mijn stem ter ore genomen heeft.", "Jes 6:5": "Toen zei ik: Wee mij, want ik ga ten onder! Omdat ik een man van onreine lippen ben, en ik woon te midden van een volk dat onrein van lippen is; want mijn ogen hebben de Koning, de HEERE van de heerscharen, gezien.", "Gen 1:28": "En God zegende hen, en God zei tegen hen: Wees vruchtbaar en word talrijk, en vervul de aarde en onderwerp haar, en heers over de vissen van de zee, en over het gevogelte van de hemel, en over al de dieren die op de aarde kruipen!", "Job 3:12": "Waarom zijn mij de knieën voorgekomen, en waartoe de borsten, opdat ik zuigen zou?", "Rom 1:31": "onverstandigen, verbondbrekers, zonder natuurlijke liefde, onverzoenlijken, onbarmhartigen;", "Jes 30:6": "De last van de dieren, van het zuiden, naar het land van angst en van benauwdheid, waar de sterke leeuw en de oude leeuw is, de basilisk en de vurige vliegende draak; hun goederen zullen zij voeren op de rug van de veulens, en hun schatten op de bulten van de kamelen, naar het volk dat hun geen nut zal doen.", "Ps 107:34": "Het vruchtbare land tot zoute grond, om de boosheid van hen die daarin wonen.", "Jer 8:6": "Ik heb geluisterd en toegehoord, zij spreken wat niet recht is, er is niemand die berouw heeft over zijn slechtheid, en zegt: Wat heb ik gedaan? Ieder keert zich om in zijn eigen loop, zoals een onbesuisd paard zich stort in de strijd.", "Zach 5:9": "En ik hief mijn ogen op, en ik keek; en zie, twee vrouwen kwamen tevoorschijn, en er was wind in hun vleugels, en zij hadden vleugels, als de vleugels van een ooievaar; en zij droegen de efa tussen de aarde en de hemel.", "Jes 40:31": "Maar wie de HEERE verwachten, zullen de kracht vernieuwen; zij zullen opvaren met vleugels, gelijk de arenden; zij zullen lopen, en niet moede worden; zij zullen wandelen, en niet mat worden.", "Job 41:12": "Zijn adem zou kolen doen vlammen, en een vlam komt uit zijn mond voort.", "Job 16:21": "Och, mocht men rechtspreken voor een man bij God, zoals een kind van een mens voor zijn vriend.", "Job 3:23": "Aan de man, wiens weg verborgen is, en die God overdekt heeft?", "Job 41:11": "Uit zijn neusgaten komt rook voort, als uit een ziedende pot en een ruime ketel.", "Hagg 2:20": "Is er nog zaad in de schuur? Zelfs de wijnstok, en de vijgenboom, en de granaatappelboom, en de olijfboom, die niet gedragen hebben, die zal Ik vanaf deze dag zegenen.", "Spr 30:32": "Als u dwaas gehandeld hebt door uzelf te verheffen, en als u kwaad bedacht hebt: de hand op de mond!", "Jer 14:6": "En de wilde ezels staan op de hoge plaatsen, zij scheppen de wind als de jakhalzen; hun ogen bezwijken, omdat er geen kruid is.", "Job 3:11": "Waarom ben ik niet gestorven vanaf de baarmoeder, en heb de geest gegeven, toen ik uit de buik voortkwam?", "Neh 13:15": "In diezelfde dagen zag ik in Juda mensen die persen traden op de sabbat, en die garven binnenbrachten, die zij op ezels laadden; alsook wijn, druiven en vijgen, en allerlei last, die zij op de sabbatdag naar Jeruzalem binnenbrachten; en ik waarschuwde hen op de dag dat zij eetwaren verkochten.", "Num 23:22": "God heeft hen uit Egypte geleid; zijn krachten zijn als die van een eenhoorn.", "Ps 19:6": "En die is als een bruidegom, die uitgaat uit zijn slaapkamer; zij is vrolijk als een held, om het pad te lopen.", "Luk 5:8": "Toen Simon Petrus dat zag, viel hij neer aan de knieën van Jezus en zei: Heere, ga weg van mij, want ik ben een zondig mens.", "Job 9:26": "Zij zijn voorbijgevaren met jachtschepen; zoals een arend naar het aas toevliegt.", "2 Kron 9:21": "Want de schepen van de koning voeren naar Tharsis, met de knechten van Huram; eens in de drie jaar kwamen de schepen van Tharsis binnen, met goud, en zilver, ivoor, en apen, en pauwen.", "Job 9:18": "Hij laat mij niet toe mijn adem te halen, maar Hij verzadigt mij met bitterheden.", "Job 33:14": "Maar God spreekt eens of tweemaal; doch men let daar niet op.", "Jer 31:19": "Zeker, nadat ik bekeerd ben, heb ik berouw gehad, en nadat ik mijzelf ben bekendgemaakt, heb ik op de heup geklopt, ik ben beschaamd, ja, ook schaamrood geworden, omdat ik de smaad van mijn jeugd gedragen heb.", "Ps 39:10": "Ik ben verstomd, ik zal mijn mond niet opendoen, want U hebt het gedaan.", "Ps 22:22": "Verlos mij uit de muil van de leeuw; en verhoor mij van de hoornen van de eenhoorns.", "1 Kor 2:16": "Want wie heeft de gedachte van de Heere gekend, dat hij Hem zou onderrichten? Maar wij hebben de gedachte van Christus.", "Job 11:12": "Dan zal een verstandeloos man verstandig worden; hoewel de mens als het veulen van een woudezel geboren is.", "Jes 64:6": "Doch wij allen zijn als een onreine, en al onze gerechtigheden zijn als een wegwerpkleed; en wij allen vallen af als een blad, en onze misdaden voeren ons weg als een wind.", "1 Sam 14:4": "Nu was er tussen de doorgangen, waar Jonathan door probeerde te gaan naar de bezetting van de Filistijnen, een scherpe rots aan deze kant en een scherpe rots aan de andere kant; en de naam van de ene was Bozes en de naam van de andere Sene.", "Luk 15:18": "Ik zal opstaan en naar mijn vader gaan, en ik zal tegen hem zeggen: Vader, ik heb gezondigd tegen de hemel, en tegenover u;", "Jes 31:4": "Want zo heeft de HEERE tegen mij gezegd: Zoals een leeuw, en een jonge leeuw over zijn prooi brult, wanneer ook een volle menigte herders tegen hem samengeroepen wordt, verschrikt hij voor hun stem niet, en vernedert zich niet vanwege hun grote aantal; zo zal de HEERE van de heerscharen neerdalen, om te strijden voor de berg Sion en voor haar heuvel.", "Ps 104:1": "Loof de HEERE, mijn ziel! O HEERE, mijn God! U bent zeer groot, U bent bekleed met majesteit en heerlijkheid.", "Ps 33:16": "Een koning wordt niet gered door een groot leger; een held wordt niet gered door grote kracht;", "Gen 18:27": "En Abraham antwoordde en zei: Zie toch, ik heb het aangedurfd te spreken tot de Heere, hoewel ik stof en as ben!", "Jer 31:18": "Ik heb wel gehoord dat Efraïm zich beklaagt, en zegt: U hebt mij getuchtigd, en ik ben getuchtigd zoals een ongewend kalf. Bekeer mij, dan zal ik bekeerd zijn, want U bent de HEERE, mijn God!", "Ps 104:18": "De hoge bergen zijn voor de steenbokken; de rotsen zijn een schuilplaats voor de klipdassen.", "Ps 147:10": "Hij heeft geen behagen in de sterkte van het paard; Hij schept geen vreugde in de benen van de man.", "Job 9:17": "Want Hij vermorzelt mij door een onweer, en vermenigvuldigt mijn wonden zonder oorzaak.", "Job 42:6": "Daarom verfoei ik mij, en ik heb berouw in stof en as.", "Ezech 26:2": "Mensenkind! Omdat Tyrus van Jeruzalem gezegd heeft: Heah! Zij is verbroken, de poort van de volken; zij is tot mij omgewend; ik zal vervuld worden, zij is verwoest!", "1 Kon 10:22": "Want de koning had op zee schepen van Tharsis, samen met de schepen van Hiram; deze schepen van Tharsis kwamen eens in de drie jaar binnen, met goud, en zilver, ivoor, en apen, en pauwen.", "Jes 40:14": "Met wie heeft Hij raad gehouden, die Hem verstand zou geven, en Hem zou leren van het pad van het recht, en Hem wetenschap zou leren, en Hem bekend zou maken de weg van het veelvoudige verstand?", "Job 4:10": "Het gebrul van de leeuw, en de stem van de felle leeuw, en de tanden van de jonge leeuwen worden verbroken.", "Obadja 1:4": "Al verheft u zich als de arend, en al zet u uw nest tussen de sterren, toch zal Ik u vandaar neerstoten, spreekt de HEERE.", "Jer 17:6": "Want hij zal zijn als de heide in de wildernis, die het niet merkt wanneer het goede komt; maar blijft in dorre plaatsen in de woestijn, in zout en onbewoond land.", "Hos 8:9": "Want zij zijn opgetrokken naar Assur, als een wilde ezel die alleen voor zichzelf leeft; die van Efraïm hebben minnaars gehuurd voor hoerenloon.", "Job 34:31": "Zeker heeft hij tot God gezegd: Ik heb Uw straf verdragen, ik zal het niet verderven.", "Rom 3:19": "Wij weten nu, dat alles wat de wet zegt, zij dat spreekt tot hen die onder de wet zijn; opdat elke mond gestopt wordt en de hele wereld voor God schuldig staat.", "Ex 15:1": "Toen zongen Mozes en de kinderen van Israël de HEERE dit lied, en zeiden: Ik zal de HEERE zingen; want Hij is hoog verheven! Het paard en zijn ruiter heeft Hij in de zee geworpen.", "Jer 9:23": "Zo zegt de HEERE: Een wijze beroemt zich niet op zijn wijsheid, en de sterke beroemt zich niet op zijn sterkte; een rijke beroemt zich niet op zijn rijkdom;", "Spr 14:4": "Als er geen ossen zijn, is de krib rein; maar door de kracht van de os is er veel inkomen.", "Job 9:3": "Als Hij lust heeft om met hem te twisten, zal hij Hem niet één op de duizend beantwoorden.", "Luk 15:19": "en ik ben niet meer waard uw zoon genoemd te worden; maak mij als één van uw dagloners.", "Jes 1:3": "Een os kent zijn bezitter, en een ezel de krib van zijn heer; maar Israël heeft geen kennis, Mijn volk begrijpt het niet.", "Job 29:24": "Lachte ik hun toe, zij geloofden het niet; en het licht van mijn aangezicht deden zij niet neervallen.", "Job 3:18": "Daar zijn de gebondenen samen in rust; zij horen de stem van de drijver niet.", "1 Sam 24:3": "Toen nam Saul drieduizend uitgelezen mannen uit heel Israël, en hij trok op om David en zijn mannen te zoeken boven op de rotsen van de steenbokken.", "Klaagl 4:3": "Gimel. Zelfs laten de zeekalveren de borst zien, zij zogen hun jongen; maar de dochter van mijn volk is wreed geworden, gelijk de struisvogels in de woestijn.", "Klaagl 2:20": "Resch. Zie, HEERE, aanschouw toch, aan wie Gij zo gedaan hebt; zullen dan de vrouwen haar vrucht eten, de kinderen die men op de handen draagt? Zullen dan de profeet en de priester in het heiligdom van de Heere gedood worden?", "Pred 10:15": "De arbeid van de dwazen maakt ieder van hen moe, omdat zij niet weten hoe naar de stad te gaan.", "Richt 5:22": "Toen werden de paardenhoeven verpletterd, van het rennen, het rennen van zijn machtigen.", "Gen 49:14": "Issaschar is een sterk gebeende ezel, neerliggende tussen twee pakken.", "Ps 104:11": "Zij drenken al het gedierte van het veld; de wilde ezels lessen er hun dorst mee.", "Ps 34:11": "Caph. De jonge leeuwen lijden armoede en honger; maar die de HEERE zoeken hebben geen gebrek aan enig goed.", "1 Sam 17:42": "Toen de Filistijn opkeek en David zag, verachtte hij hem; want hij was een jongeman, roodachtig, en daarbij mooi om te zien.", "Ps 103:5": "Die uw mond verzadigt met het goede, uw jeugd vernieuwt als die van een arend.", "Neh 9:33": "Doch U bent rechtvaardig, in alles wat ons overkomen is; want U hebt trouw gehandeld, maar wij hebben goddeloos gehandeld.", "Job 30:21": "U bent veranderd in een wrede tegen mij; door de sterkte van Uw hand weerstaat U mij hatelijk.", "Job 14:17": "Mijn overtreding is in een bundeltje verzegeld, en U pakt mijn ongerechtigheid opeen.", "Job 29:9": "De leiders hielden hun woorden in, en legden de hand op hun mond.", "Dan 5:21": "En hij werd van de mensenkinderen verstoten, en zijn hart werd gelijk gemaakt aan de dieren, en zijn woning was bij de woudezels; men gaf hem gras te eten zoals de ossen; en zijn lichaam werd nat gemaakt door de dauw van de hemel, totdat hij erkende dat God, de Allerhoogste, Heerser is over de koninkrijken van de mensen, en daarover stelt wie Hij wil.", "1 Tim 1:15": "Dit is een betrouwbaar woord, en alle aanneming waard, dat Christus Jezus in de wereld gekomen is om de zondaars zalig te maken, van wie ik de voornaamste ben.", "Jer 14:5": "Want ook de hinden in het veld werpen jongen, en verlaten die, omdat er geen jong gras is.", "Ex 19:4": "U hebt gezien wat Ik de Egyptenaren gedaan heb; hoe Ik u op vleugels van arenden gedragen heb, en u tot Mij gebracht heb.", "Matt 20:11": "En toen zij die ontvangen hadden, morden zij tegen de heer des huizes,", "Jer 8:7": "Zelfs een ooievaar aan de hemel kent zijn vaste tijden, en een tortelduif, en kraanvogel, en zwaluw, nemen de tijd van hun aankomst waar; maar Mijn volk kent het recht van de HEERE niet.", "Job 6:5": "Balkt ook de woudezel bij het jonge gras? Loeit de os bij zijn voeder?", "Job 3:20": "Waarom geeft Hij de ellendigen het licht, en het leven de bitterlijk bedroefden van gemoed?", "Gen 16:12": "En hij zal een woudezel van een mens zijn; zijn hand zal tegen allen zijn, en de hand van allen tegen hem; en hij zal wonen voor het aangezicht van al zijn broeders.", "Ezech 18:2": "Wat is er met u, dat u dit spreekwoord gebruikt over het land Israël, en zegt: De vaders hebben onrijpe druiven gegeten, en de tanden van de kinderen zijn stomp geworden?", "Hab 2:20": "Maar de HEERE is in Zijn heilige tempel. Zwijg voor Zijn aangezicht, heel de aarde!", "Job 37:20": "Zal het Hem verteld worden, als ik zo zou spreken? Denkt iemand dat, zeker, hij zal verslonden worden.", "Job 27:2": "Zo waarachtig als God leeft, Die mijn recht weggenomen heeft, en de Almachtige, Die mijn ziel bitterheid heeft aangedaan!", "Hab 1:8": "Want zijn paarden zijn lichter dan de luipaarden, en zij zijn scherper dan de avondwolven, en zijn ruiters verspreiden zich; ja, zijn ruiters zullen van verre komen, zij zullen vliegen als een arend, die zich haast om te eten.", "Gen 42:26": "En zij laadden hun koren op hun ezels, en trokken vandaar weg.", "Ps 104:21": "De jonge leeuwen brullen om een prooi, en om hun voedsel van God te zoeken.", "Ps 144:14": "Dat onze ossen goed beladen zijn; dat er geen inbraak is, geen uitval, geen gejammer op onze straten.", "Ps 70:4": "Laat hen terugkeren tot loon van hun beschaming, die daar zeggen: Ha, ha!", "1 Kon 3:27": "Toen antwoordde de koning en zei: Geef haar het levende kind, en dood het geenszins; zij is zijn moeder.", "Lev 11:13": "En van het gevogelte zult u deze verafschuwen, zij zullen niet gegeten worden, zij zijn een gruwel: de arend, en de lammergier, en de zeearend,", "2 Sam 24:10": "En het hart van David sloeg hem, nadat hij het volk geteld had; en David zei tegen de HEERE: Ik heb zwaar gezondigd in wat ik gedaan heb; maar neem nu toch, o HEERE, de misdaad van uw knecht weg, want ik heb heel dwaas gedaan.", "Matt 24:28": "Want waar het dode lichaam ook zal zijn, daar zullen de arenden verzameld worden.", "Ps 92:11": "Maar U zult mijn hoorn verhogen, zoals de hoorn van een eenhoorn; ik ben met verse olie overgoten.", "Deut 33:17": "Hij heeft de heerlijkheid van de eerstgeborene van zijn os, en zijn horens zijn horens van de eenhoorn; daarmee zal hij de volken samen stoten tot aan de einden van het land. Dezen nu zijn de tienduizenden van Efraïm, en dezen zijn de duizenden van Manasse!", "Ps 93:1": "De HEERE regeert, Hij is met majesteit bekleed; de HEERE is bekleed met sterkte, Hij heeft Zich omgord. Ook is de wereld bevestigd, zij zal niet wankelen.", "Ps 51:6": "Tegen U, U alleen, heb ik gezondigd, en gedaan wat kwaad is in Uw ogen; opdat U rechtvaardig bent in Uw spreken, en rein bent in Uw oordelen.", "Luk 18:13": "En de tollenaar, die op een afstand stond, wilde zelfs zijn ogen niet opheffen naar de hemel, maar sloeg op zijn borst en zei: O God, wees mij, zondaar, genadig!", "Gen 1:26": "En God zei: Laat Ons mensen maken, naar Ons beeld, naar Onze gelijkenis; en laten zij heersen over de vissen van de zee, en over het gevogelte van de hemel, en over het vee, en over de hele aarde, en over al de kruipende dieren die op de aarde kruipen.", "Gen 9:2": "En vrees en angst voor u zal er zijn over al het gedierte van de aarde, en over al het gevogelte van de hemel; over alles wat zich op de aardbodem beweegt, en over alle vissen van de zee; zij zijn in uw hand overgegeven.", "Amos 2:13": "Zie, Ik zal uw plaatsen drukken, zoals een wagen drukt, die vol garven is.", "Jes 32:14": "Want het paleis zal verlaten zijn, het gewoel van de stad zal ophouden; Ofel en de wachttorens zullen tot spelonken zijn, tot in eeuwigheid, een vreugde van de woudezels, een weide voor de kudden.", "Jer 49:16": "Uw verschrikkelijkheid heeft u bedrogen, en de trots van uw hart, u die woont in de kloven van de steenrotsen, die de hoogte van de heuvels vasthoudt! Al zou u uw nest zo hoog maken als de arend, toch zal Ik u vandaar neerstoten, spreekt de HEERE.", "Job 24:5": "Zie, zij zijn woudezels in de woestijn; zij gaan uit tot hun werk, maken zich vroeg op om te roven; het vlakke veld is voedsel voor hem en voor de jongeren.", "Deut 28:57": "Namelijk vanwege haar nageboorte, die van tussen haar voeten uitgegaan zal zijn, en vanwege haar zonen die zij gebaard zal hebben; want zij zal hen in het verborgene eten, wegens gebrek aan alles; in de belegering en in de benauwdheid waarmee uw vijand u zal benauwen in uw poorten.", "Job 30:29": "Ik ben de jakhalzen een broeder geworden, en een metgezel van de jonge struisvogels.", "Richt 18:19": "En zij zeiden tegen hem: Zwijg, leg uw hand op uw mond, en ga met ons mee, en wees ons tot een vader en tot een priester! Is het beter dat u priester bent voor het huis van één man, of dat u priester bent voor een stam en een geslacht in Israël?", "Matt 13:30": "Laat ze beide samen opgroeien tot de oogst, en in de tijd van de oogst zal ik tegen de maaiers zeggen: Verzamel eerst het onkruid, en bind het in bundels om het te verbranden; maar breng de tarwe samen in mijn schuur.", "Hab 1:9": "Het zal geheel tot geweld komen, wat zij inslorpen zullen met hun gezichten naar het oosten gericht; en het zal de gevangenen verzamelen als zand.", "2 Kon 6:29": "Zo hebben wij mijn zoon gekookt, en hebben hem gegeten; maar toen ik de volgende dag tegen haar zei: Geef uw zoon, dat wij hem eten, toen heeft zij haar zoon verstopt.", "Jer 8:16": "Vanuit Dan wordt het gesnuif van zijn paarden gehoord; het hele land beeft van het geluid van het gebries van zijn sterke dieren; en zij komen daarheen om het land op te eten en al wat het bevat, de stad en wie daarin wonen.", "Jes 50:8": "Hij is nabij, Die Mij rechtvaardigt, wie zal met Mij twisten? Laten wij samen staan; wie heeft een rechtszaak tegen Mij? Laat hij hierheen komen tot Mij.", "Job 14:16": "Maar nu telt U mijn stappen; U let toch wel op vanwege mijn zonden?", "Dan 9:7": "Bij U, o Heere! is de gerechtigheid, maar bij ons de schaamte van het gezicht, zoals het is op deze dag; bij de mannen van Juda, en de inwoners van Jeruzalem, en heel Israël, die dichtbij en die ver weg zijn, in alle landen waarheen U hen verdreven hebt, om hun overtreding waarmee zij tegen U overtreden hebben.", "Matt 3:2": "en zei: Bekeer u; want het Koninkrijk der hemelen is nabij gekomen.", "Lev 11:19": "En de ooievaar, de reiger naar zijn soort, en de hop, en de vleermuis.", "Jes 46:1": "Bel is gekromd, Nebo wordt neergebogen, hun afgoden zijn geworden voor de dieren en voor de beesten; uw opgeladen pakken zijn een last voor de vermoeide beesten.", "Pred 6:10": "Wat iemand ook is, allang is zijn naam genoemd, en het is bekend dat hij een mens is; en dat hij niet kan rechten met wie sterker is dan hij.", "Ps 62:12": "God heeft één ding gesproken, dit heb ik tweemaal gehoord: dat de sterkte van God is.", "1 Kon 19:4": "Maar hijzelf ging een dagreis de woestijn in, en kwam en ging zitten onder een jeneverboom; en bad dat hij mocht sterven, en zei: Het is genoeg; neem nu, HEERE, mijn leven, want ik ben niet beter dan mijn vaderen.", "Micha 7:16": "De heidenen zullen het zien, en beschaamd zijn, vanwege al hun macht; zij zullen de hand op de mond leggen; hun oren zullen doof worden.", "Ps 104:17": "Waar de vogeltjes nestelen; het huis van de ooievaar zijn de dennenbomen.", "1 Kor 10:22": "Of willen wij de Heere tot jaloersheid tergen? Zijn wij soms sterker dan Hij?", "Ezech 36:2": "Zo zegt de Heere HEERE: Omdat de vijand van u zegt: Heah! Zelfs de eeuwige hoogten zijn ons ten erve geworden!", "Deut 29:23": "Dat zijn hele aarde zwavel en zout is van de verbranding; die niet bezaaid zal zijn, en geen spruit zal voortgebracht hebben, en geen kruid daarin zal opgekomen zijn; zoals de omkering van Sodom en Gomorra, Adama en Zeboïm, die de HEERE heeft omgekeerd in Zijn toorn en in Zijn grimmigheid;"}, -code=\"H4147\">bands</span> of the wild ass?", "6": "Whose <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> I have <span class=\"wl wl-kjv\" data-code=\"H7760\">made</span> the <span class=\"wl wl-kjv\" data-code=\"H6160\">wilderness,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4420\">barren</span> land his dwellings.", "7": "He <span class=\"wl wl-kjv\" data-code=\"H7832\">scorneth</span> the <span class=\"wl wl-kjv\" data-code=\"H1995\">multitude</span> of the <span class=\"wl wl-kjv\" data-code=\"H7151\">city,</span> neither <span class=\"wl wl-kjv\" data-code=\"H8085\">regardeth</span> he the <span class=\"wl wl-kjv\" data-code=\"H8663\">crying</span> of the driver.", "8": "The <span class=\"wl wl-kjv\" data-code=\"H3491\">range</span> of the <span class=\"wl wl-kjv\" data-code=\"H2022\">mountains</span> is his <span class=\"wl wl-kjv\" data-code=\"H4829\">pasture,</span> and he <span class=\"wl wl-kjv\" data-code=\"H1875\">searcheth</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> every green thing.", "9": "Will the <span class=\"wl wl-kjv\" data-code=\"H7214\">unicorn</span> be <span class=\"wl wl-kjv\" data-code=\"H14\">willing</span> to <span class=\"wl wl-kjv\" data-code=\"H5647\">serve</span> thee, or <span class=\"wl wl-kjv\" data-code=\"H3885\">abide</span> by thy crib?", "10": "Canst thou <span class=\"wl wl-kjv\" data-code=\"H7194\">bind</span> the <span class=\"wl wl-kjv\" data-code=\"H7214\">unicorn</span> with his <span class=\"wl wl-kjv\" data-code=\"H5688\">band</span> in the <span class=\"wl wl-kjv\" data-code=\"H8525\">furrow?</span> or will he <span class=\"wl wl-kjv\" data-code=\"H7702\">harrow</span> the <span class=\"wl wl-kjv\" data-code=\"H6010\">valleys</span> after", "11": "Wilt thou <span class=\"wl wl-kjv\" data-code=\"H982\">trust</span> him, because his <span class=\"wl wl-kjv\" data-code=\"H3581\">strength</span> is <span class=\"wl wl-kjv\" data-code=\"H7227\">great?</span> or wilt thou <span class=\"wl wl-kjv\" data-code=\"H5800\">leave</span> thy labour", "12": "Wilt thou <span class=\"wl wl-kjv\" data-code=\"H539\">believe</span> him, that he will bring <span class=\"wl wl-kjv\" data-code=\"H7725\">home</span> thy <span class=\"wl wl-kjv\" data-code=\"H2233\">seed,</span> and <span class=\"wl wl-kjv\" data-code=\"H622\">gather</span> it into thy barn?", "13": "Gavest thou the <span class=\"wl wl-kjv\" data-code=\"H7443\">goodly</span> <span class=\"wl wl-kjv\" data-code=\"H3671\">wings</span> unto the <span class=\"wl wl-kjv\" data-code=\"H5965\">peacocks?</span> or <span class=\"wl wl-kjv\" data-code=\"H84\">wings</span> and <span class=\"wl wl-kjv\" data-code=\"H2624\">feathers</span> unto the ostrich?", "14": "Which <span class=\"wl wl-kjv\" data-code=\"H5800\">leaveth</span> her <span class=\"wl wl-kjv\" data-code=\"H1000\">eggs</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">earth,</span> and <span class=\"wl wl-kjv\" data-code=\"H2552\">warmeth</span> them in dust,", "15": "And <span class=\"wl wl-kjv\" data-code=\"H7911\">forgetteth</span> that the <span class=\"wl wl-kjv\" data-code=\"H7272\">foot</span> may <span class=\"wl wl-kjv\" data-code=\"H2115\">crush</span> them, or that the <span class=\"wl wl-kjv\" data-code=\"H7704\">wild</span> <span class=\"wl wl-kjv\" data-code=\"H2416\">beast</span> may break", "16": "She is <span class=\"wl wl-kjv\" data-code=\"H7188\">hardened</span> against her young <span class=\"wl wl-kjv\" data-code=\"H1121\">ones,</span> as though they were <span class=\"wl wl-kjv\" data-code=\"H3808\">not</span> hers: her <span class=\"wl wl-kjv\" data-code=\"H3018\">labour</span> is in <span class=\"wl wl-kjv\" data-code=\"H7385\">vain</span> without fear;", "17": "Because <span class=\"wl wl-kjv\" data-code=\"H433\">God</span> hath <span class=\"wl wl-kjv\" data-code=\"H5382\">deprived</span> her of <span class=\"wl wl-kjv\" data-code=\"H2451\">wisdom,</span> neither hath he <span class=\"wl wl-kjv\" data-code=\"H2505\">imparted</span> to her understanding.", "18": "What <span class=\"wl wl-kjv\" data-code=\"H6256\">time</span> she lifteth <span class=\"wl wl-kjv\" data-code=\"H4754\">up</span> herself on <span class=\"wl wl-kjv\" data-code=\"H4791\">high,</span> she <span class=\"wl wl-kjv\" data-code=\"H7832\">scorneth</span> the <span class=\"wl wl-kjv\" data-code=\"H5483\">horse</span> and his rider.", "19": "Hast thou <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> the <span class=\"wl wl-kjv\" data-code=\"H5483\">horse</span> <span class=\"wl wl-kjv\" data-code=\"H1369\">strength?</span> hast thou <span class=\"wl wl-kjv\" data-code=\"H3847\">clothed</span> his <span class=\"wl wl-kjv\" data-code=\"H6677\">neck</span> with thunder?", "20": "Canst thou make him <span class=\"wl wl-kjv\" data-code=\"H7493\">afraid</span> as a <span class=\"wl wl-kjv\" data-code=\"H697\">grasshopper?</span> the <span class=\"wl wl-kjv\" data-code=\"H1935\">glory</span> of his <span class=\"wl wl-kjv\" data-code=\"H5170\">nostrils</span> is terrible.", "21": "He <span class=\"wl wl-kjv\" data-code=\"H2658\">paweth</span> in the <span class=\"wl wl-kjv\" data-code=\"H6010\">valley,</span> and <span class=\"wl wl-kjv\" data-code=\"H7797\">rejoiceth</span> in his <span class=\"wl wl-kjv\" data-code=\"H3581\">strength:</span> he goeth <span class=\"wl wl-kjv\" data-code=\"H3318\">on</span> to <span class=\"wl wl-kjv\" data-code=\"H7125\">meet</span> the armed men.", "22": "He <span class=\"wl wl-kjv\" data-code=\"H7832\">mocketh</span> at <span class=\"wl wl-kjv\" data-code=\"H6343\">fear,</span> and is not <span class=\"wl wl-kjv\" data-code=\"H2865\">affrighted;</span> neither turneth he <span class=\"wl wl-kjv\" data-code=\"H7725\">back</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">from</span> the sword.", "23": "The <span class=\"wl wl-kjv\" data-code=\"H827\">quiver</span> <span class=\"wl wl-kjv\" data-code=\"H7439\">rattleth</span> against him, the <span class=\"wl wl-kjv\" data-code=\"H3851\">glittering</span> <span class=\"wl wl-kjv\" data-code=\"H2595\">spear</span> and the shield.", "24": "He <span class=\"wl wl-kjv\" data-code=\"H1572\">swalloweth</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">ground</span> with <span class=\"wl wl-kjv\" data-code=\"H7494\">fierceness</span> and <span class=\"wl wl-kjv\" data-code=\"H7267\">rage:</span> neither <span class=\"wl wl-kjv\" data-code=\"H539\">believeth</span> he that it is the <span class=\"wl wl-kjv\" data-code=\"H6963\">sound</span> of the trumpet.", "25": "He <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> <span class=\"wl wl-kjv\" data-code=\"H1767\">among</span> the <span class=\"wl wl-kjv\" data-code=\"H7782\">trumpets,</span> <span class=\"wl wl-kjv\" data-code=\"H1889\">Ha,</span> <span class=\"wl wl-kjv\" data-code=\"H1889\">ha;</span> and he <span class=\"wl wl-kjv\" data-code=\"H7306\">smelleth</span> the <span class=\"wl wl-kjv\" data-code=\"H4421\">battle</span> afar <span class=\"wl wl-kjv\" data-code=\"H7350\">off,</span> the <span class=\"wl wl-kjv\" data-code=\"H7482\">thunder</span> of the <span class=\"wl wl-kjv\" data-code=\"H8269\">captains,</span> and the shouting.", "26": "Doth the <span class=\"wl wl-kjv\" data-code=\"H5322\">hawk</span> <span class=\"wl wl-kjv\" data-code=\"H82\">fly</span> by thy <span class=\"wl wl-kjv\" data-code=\"H998\">wisdom,</span> and <span class=\"wl wl-kjv\" data-code=\"H6566\">stretch</span> her <span class=\"wl wl-kjv\" data-code=\"H3671\">wings</span> toward the south?", "27": "Doth the <span class=\"wl wl-kjv\" data-code=\"H5404\">eagle</span> mount <span class=\"wl wl-kjv\" data-code=\"H1361\">up</span> at thy <span class=\"wl wl-kjv\" data-code=\"H6310\">command,</span> and <span class=\"wl wl-kjv\" data-code=\"H7311\">make</span> her <span class=\"wl wl-kjv\" data-code=\"H7064\">nest</span> on high?", "28": "She <span class=\"wl wl-kjv\" data-code=\"H7931\">dwelleth</span> and <span class=\"wl wl-kjv\" data-code=\"H3885\">abideth</span> on the <span class=\"wl wl-kjv\" data-code=\"H5553\">rock,</span> upon the <span class=\"wl wl-kjv\" data-code=\"H8127\">crag</span> of the <span class=\"wl wl-kjv\" data-code=\"H5553\">rock,</span> and the strong place.", "29": "From thence she <span class=\"wl wl-kjv\" data-code=\"H2658\">seeketh</span> the <span class=\"wl wl-kjv\" data-code=\"H400\">prey,</span> and her <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes</span> <span class=\"wl wl-kjv\" data-code=\"H5027\">behold</span> afar off.", "30": "Her young <span class=\"wl wl-kjv\" data-code=\"H667\">ones</span> also suck <span class=\"wl wl-kjv\" data-code=\"H5966\">up</span> <span class=\"wl wl-kjv\" data-code=\"H1818\">blood:</span> and where the <span class=\"wl wl-kjv\" data-code=\"H2491\">slain</span> are, there is she."}};
const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"
const ZELF = D.meta.zelf_abbr;      // afkorting binnen dit hoofdstuk, bv. "Joh 3"
const BASIS_URL = D.meta.basis_url;
const PARALLEL_VOLGORDE = ['Berea', 'SV', 'KJV'];
let vertaling = 'Berea';
let openVers = null;

const bijbel = document.getElementById('bijbel');
const popup = document.getElementById('popup');
const toast = document.getElementById('toast');
const nummers = Object.keys(D.vertalingen.Berea);

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden"><select id="boekkies">${boekOpties}</select> ` +
    `<select id="hfdkies">${hfdOpties}</select></span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.Berea[n] || '—');
}

/* ---------- vertaling-keuze (dropdown) + studie-dropdown ---------- */
(function bouwVertaalkies() {
  const sel = document.getElementById('vertaalkies');
  sel.innerHTML = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  sel.onchange = e => { vertaling = e.target.value; bouwRijen(); };
})();
document.getElementById('studiekies').onchange = e => { if (e.target.value) location.href = e.target.value; };

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.Berea[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (Berea)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function paneelInhoud(n, tab) {
  if (tab === 'grondwoorden') {
    const heeftB = D.koppeling && D.koppeling[n];
    const heeftK = D.koppeling_kjv && D.koppeling_kjv[n];
    if (!heeftB && !heeftK) return '<em>Nog geen woordkoppeling voor dit vers.</em>';
    let h = '';
    if (heeftB) h += `<div class="tsk-kop">Berea</div>` +
      `<div class="gw-tekst" style="font-family:Georgia,serif;line-height:1.8">${D.koppeling[n]}</div>` +
      `<div class="gw-detail" style="margin-top:.5rem"></div>`;
    if (heeftK) h += `<div class="tsk-kop" style="margin-top:.9rem">KJV</div>` +
      `<div class="gw-tekst" style="font-family:Georgia,serif;line-height:1.8">${D.koppeling_kjv[n]}</div>` +
      `<div class="gw-detail" style="margin-top:.5rem"></div>`;
    return h + '<div class="bronregel">Klik op een onderstreept woord voor de vindplaatsen.</div>';
  }
  if (tab === 'vertalingen') {
    return PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
  }
  if (tab === 'verwijzingen') {
    const berea = D.tsk[n], engels = D.tsk_kjv[n];
    if ((!berea || !berea.length) && (!engels || !engels.length)) return '<em>Geen verwijzingen bij dit vers.</em>';
    let h = '';
    if (berea && berea.length) {
      h += '<div class="tsk-kop">Treasury of Scripture Knowledge | Berea</div>';
      h += berea.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r}">${r}</a>`).join('') + '</div>').join('');
    }
    if (engels && engels.length) {
      h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.subs && it.subs.length ? `<ul class="ond-subs">${it.subs.map(s=>`<li>${s}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.tsk[n] && D.tsk[n].length), heeftO = !!D.onderwerpen[n];
  const heeftG = !!((D.koppeling && D.koppeling[n]) || (D.koppeling_kjv && D.koppeling_kjv[n]));
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : (heeftG ? 'grondwoorden' : 'vertalingen'));
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'grondwoorden' ? 'actief' : ''} ${heeftG ? '' : 'leeg'}" data-tab="grondwoorden" data-n="${n}">Grondwoorden</div>
    <div class="ntab" data-tab="vertalingen" data-n="${n}">Vertalingen</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.Berea[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · Berea</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}
</script>
</body>
</html>
