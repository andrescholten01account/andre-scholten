s over het grote water, de oogst van de rivier; en zij was de markt van de heidenvolken.", "Hab 3:15": "U betrad met Uw paarden de zee; het geweldige water werd een hoop.", "Spr 10:12": "Haat verwekt ruzies; maar de liefde bedekt alle overtredingen.", "Job 19:3": "Nu al tien keer hebben jullie mij schande aangedaan; u schaamt u niet, u verhardt u tegen mij.", "Spr 21:30": "Er is geen wijsheid, en er is geen verstand, en er is geen raad tegen de HEERE.", "Deut 32:35": "Aan Mij is de wraak en de vergelding, op de tijd dat hun voet zal wankelen; want de dag van hun ondergang is nabij, en de dingen die hun zullen gebeuren, haasten zich.", "Ps 37:8": "He. Laat af van toorn, en verlaat de woede; wind u niet op, zeker niet, om kwaad te doen.", "Ps 148:5": "Laat hen de Naam van de HEERE loven; want toen Hij het beval, werden zij geschapen.", "Deut 23:3": "Geen Ammoniet, noch Moabiet zal in de vergadering van de HEERE komen; zelfs hun tiende geslacht zal in eeuwigheid niet in de vergadering van de HEERE komen.", "Spr 10:6": "Zegeningen zijn op het hoofd van de rechtvaardige; maar het geweld bedekt de mond van de goddelozen.", "Jer 27:9": "U dan, luister niet naar uw profeten, en naar uw waarzeggers, en naar uw dromers, en naar uw guichelaars, en naar uw tovenaars, die tegen u spreken en zeggen: U zult de koning van Babel niet dienen.", "Jer 27:5": "Ik heb de aarde gemaakt, de mens en het vee die op de aardbodem zijn, door Mijn grote kracht en door Mijn uitgestrekte arm, en Ik geef ze aan wie het goed is in Mijn ogen.", "Ezech 25:7": "Daarom, zie, Ik zal Mijn hand tegen u uitstrekken, en u aan de heidenvolken tot buit geven, en Ik zal u uit de volken uitroeien, en u uit de landen doen verdwijnen; Ik zal u verdelgen; en u zult weten dat Ik de HEERE ben.", "2 Kon 24:2": "En de HEERE zond tegen hem de benden van de Chaldeeën, en de benden van de Syriërs, en de benden van de Moabieten, en de benden van de kinderen van Ammon, en zond hen tegen Juda, om dat te verwoesten, naar het woord van de HEERE, dat Hij gesproken had door de dienst van Zijn dienaren, de profeten.", "Matt 3:9": "En denk niet bij uzelf te zeggen: Wij hebben Abraham als vader; want ik zeg u dat God zelfs uit deze stenen voor Abraham kinderen kan verwekken.", "Matt 22:29": "Maar Jezus antwoordde en zei tegen hen: U dwaalt, omdat u de Schriften niet kent, noch de kracht van God.", "Ps 89:24": "Maar Ik zal zijn wederpartijders verpletteren voor zijn aangezicht, en die hem haten, zal Ik plagen.", "Ps 77:17": "De wateren zagen U, o God! De wateren zagen U, zij beefden; ook waren de afgronden beroerd.", "Amos 4:8": "En twee, drie steden trokken rond naar één stad, opdat zij water zouden kunnen drinken, maar werden niet verzadigd; toch hebt u zich niet bekeerd tot Mij, spreekt de HEERE.", "1 Sam 15:33": "Maar Samuël zei: Zoals uw zwaard vrouwen van hun kinderen beroofd heeft, zo zal uw moeder van haar kinderen beroofd worden onder de vrouwen. Toen hieuw Samuël Agag in stukken, voor het aangezicht van de HEERE te Gilgal.", "Amos 7:15": "Maar de HEERE nam mij van achter de kudde vandaan; en de HEERE zei tegen mij: Ga heen, profeteer tegen Mijn volk Israël.", "Zach 7:10": "en verdruk de weduwe niet, evenmin de wees, de vreemdeling of de arme; en bedenk in uw hart niet de een tegen de ander iets kwaads.", "Joël 2:2-10": "Een dag van duisternis en donkerheid, een dag van wolken en dikke duisternis, als de dageraad uitgespreid over de bergen; een groot en machtig volk, zoals er van oude tijden af niet geweest is, en na hen niet meer zal zijn tot in jaren van vele geslachten. Voor hen verteert een vuur, en achter hen brandt een vlam; het land is voor hen als een lusthof, maar achter hen een woeste wildernis, en ook is er geen ontkomen aan hen. Hun gedaante is als de gedaante van paarden, en als ruiters, zo zullen zij lopen.", "Ps 74:13": "U hebt door Uw sterkte de zee gespleten; U hebt de koppen van de draken in het water verbroken.", "Zach 9:1": "De last van het woord van de HEERE over het land Chadrach en Damaskus, zijn rustplaats; want de HEERE heeft een oog op de mens, zoals op alle stammen van Israël.", "Ezech 25:17": "En Ik zal grote wraak met grimmige straffen onder hen voltrekken; en zij zullen weten dat Ik de HEERE ben, wanneer Ik Mijn wraak aan hen zal hebben voltrokken.", "Jes 9:4": "Toen de hele strijd van hen die streden, met gedruis gebeurde, en de kleren in het bloed gewenteld en verbrand werden, tot een voedsel van het vuur.", "Gen 36:11": "En de zonen van Elifaz waren: Teman, Omar, Zefo, en Gaetam, en Kenaz.", "Ps 81:15": "In korte tijd zou Ik hun vijanden onderworpen hebben, en Mijn hand gewend hebben tegen hun tegenstanders.", "Job 9:12": "Zie, Hij zal roven, wie zal het Hem doen teruggeven? Wie zal tegen Hem zeggen: Wat doet U?", "Jes 59:1": "Zie, de hand van de HEERE is niet te kort om te kunnen verlossen, en Zijn oor is niet zwaar geworden om te kunnen horen.", "Joh 18:22": "En toen Hij dit zei, gaf een van de dienaars die daarbij stond Jezus een klap in het gezicht en zei: Antwoordt U zo de hogepriester?", "Job 40:4": "Hebt u een arm gelijk God? En kunt u, gelijk Hij, met de stem donderen?", "Ezech 21:20": "U zult een weg voorstellen, waardoor het zwaard zal binnenkomen tegen Rabba van de kinderen van Ammon, of tegen Juda, tot de versterkte stad Jeruzalem.", "Ps 118:16": "De rechterhand van de HEERE is verhoogd; de rechterhand van de HEERE doet krachtige daden.", "1 Sam 11:2": "Maar Nahas, de Ammoniet, zei tegen hen: Op deze voorwaarde zal ik een verbond met u sluiten, dat ik bij u allen het rechteroog uitsteek, en dat ik deze schande op heel Israël leg.", "2 Kron 26:1-23": "Toen nam heel het volk van Juda Uzzia (die nu zestien jaar oud was), en maakte hem koning in de plaats van zijn vader Amazia. Hij bouwde Eloth, en bracht het weer terug aan Juda, nadat de koning met zijn vaderen ontslapen was. Zestien jaar was Uzzia oud, toen hij koning werd, en hij regeerde tweeënvijftig jaar te Jeruzalem; en de naam van zijn moeder was Jecholia, van Jeruzalem.", "Jes 9:18-20": "Vanwege de verbolgenheid van de HEERE van de heerscharen, zal het land verduisterd worden; en het volk zal zijn als een voedsel van het vuur: de een zal de ander niet ontzien. Als hij ter rechterhand snijdt, zal hij toch hongeren, en als hij ter linkerhand eet, zal hij toch niet verzadigd worden; ieder zal het vlees van zijn eigen arm eten; Manasse Efraïm, en Efraïm Manasse, en zij zullen samen tegen Juda zijn. Om dit alles keert Zijn toorn zich niet af, maar Zijn hand is nog uitgestrekt.", "Jes 5:30": "En zij zullen op die dag tegen hen bruisen, als het bruisen van de zee. Als men dan naar het land kijkt, zie, dan is er duisternis en benauwdheid, en het licht zal verduisterd worden in de wolken erboven.", "Spr 14:17": "Wie haastig is tot toorn, zal dwaasheid doen; en een man met schandelijke plannen zal gehaat worden.", "Obadja 1:9": "Ook zullen uw helden, o Theman, wanhopig worden; opdat ieder uit het gebergte van Ezau door de moord wordt uitgeroeid.", "Jer 25:17-20": "En ik nam de beker uit de hand van de HEERE, en ik gaf te drinken aan alle volken, tot wie de HEERE mij gezonden had; Namelijk Jeruzalem en de steden van Juda, en haar koningen, en haar vorsten; om die te stellen tot een woestheid, tot een ontzetting, tot een aanfluiting en tot een vloek, zoals het is op deze dag; Farao, de koning van Egypte, en zijn dienstknechten, en zijn vorsten, en al zijn volk;", "Nahum 1:4": "Hij bestraft de zee, en maakt haar droog, en Hij droogt alle rivieren uit; Basan en Karmel kwijnen weg, ook kwijnt de bloem van Libanon weg.", "2 Kron 21:16": "Zo wekte de HEERE tegen Joram de geest op van de Filistijnen en de Arabieren, die aan de zijde van de Moren wonen.", "Ps 93:4": "Maar de HEERE in de hoogte is machtiger dan het bruisen van veel water, dan de machtige golven van de zee.", "Job 36:27-33": "Want Hij trekt de druppels van het water op, die als regen neerdruppelen door zijn damp; Die de wolken uitgieten, en over de mens overvloedig afdruipen. Kan iemand ook verstaan de uitbreidingen van de wolken, en de donderslagen van Zijn tent?", "Ps 89:9": "O HEERE, God van de heerscharen! Wie is als Gij, grootmachtig, o HEERE! en Uw getrouwheid is rondom U.", "Spr 30:4": "Wie is naar de hemel opgeklommen, en neergedaald? Wie heeft de wind in Zijn vuisten verzameld? Wie heeft de wateren in een kleed gebonden? Wie heeft alle einden van de aarde vastgesteld? Hoe is Zijn Naam, en hoe is de Naam van Zijn Zoon, als u het weet?", "Openb 19:1": "En hierna hoorde ik als een grote stem van een grote menigte in de hemel, die zei: Halleluja, de zaligheid, en de heerlijkheid, en de eer, en de kracht zij de Heere, onze God.", "Ps 38:17": "Want ik zei: Laat hen zich toch over mij niet verblijden! Wanneer mijn voet zou wankelen, zouden zij zich tegen mij groot maken.", "Klaagl 4:4": "Daleth. De tong van het zuigeling kleeft aan zijn gehemelte van dorst; de kinderen vragen om brood, er is niemand die het hun uitdeelt.", "Mal 3:2": "Maar wie zal de dag van Zijn komst verdragen, en wie zal standhouden als Hij verschijnt? Want Hij zal zijn als het vuur van een goudsmid, en als zeep van de blekers.", "2 Kon 10:32": "In die dagen begon de HEERE Israël in te korten, want Hazaël sloeg hen in alle grensgebieden van Israël:", "Gen 49:7": "Vervloekt is hun toorn, want hij is heftig; en hun verbolgenheid, want zij is hard! Ik zal hen verdelen onder Jakob, en zal hen verstrooien onder Israël.", "Zach 9:5": "Askelon zal het zien, en zal vrezen; evenzo Gaza, en zal grote smart hebben, alsook Ekron, omdat hetgeen waar zij op zagen, hen te schande heeft gemaakt; en de koning van Gaza zal vergaan, en Askelon zal niet bewoond worden.", "Ezech 25:12-14": "Zo zegt de Heere HEERE: Omdat Edom met louter wraakgierigheid gehandeld heeft tegen het huis van Juda, en zij zich zeer schuldig gemaakt hebben doordat zij zich op hen gewroken hebben: Daarom, zo zegt de Heere HEERE: Ik zal ook Mijn hand uitstrekken tegen Edom, en Ik zal mens en dier uit haar uitroeien; en Ik zal haar tot een woestenij maken, vanaf Teman; en zij zullen tot Dedan toe door het zwaard vallen. En Ik zal Mijn wraak brengen over Edom, door de hand van Mijn volk Israël; en zij zullen tegen Edom handelen naar Mijn toorn en naar Mijn grimmigheid; zo zullen zij Mijn wraak leren kennen, spreekt de Heere HEERE.", "2 Kon 25:7": "En zij slachtten de zonen van Zedekia voor zijn ogen, en men verblindde Zedekia's ogen, en zij bonden hem met twee koperen ketenen, en voerden hem naar Babel.", "Jes 8:4": "Want voordat dat jongetje kan roepen: Mijn vader! of: mijn moeder!, zal men de rijkdom van Damaskus en de buit van Samaria wegdragen voor de koning van Assur.", "2 Kron 14:11": "En Asa riep tot de HEERE, zijn God, en zei: HEERE, het is voor U niets, te helpen hetzij de machtige, hetzij de krachteloze; help ons, o HEERE, onze God! Want wij steunen op U, en in Uw Naam zijn wij gekomen tegen deze menigte; o HEERE! U bent onze God; laat een sterfelijk mens tegen U niets vermogen.", "Ps 78:12-16": "Voor hun vaderen had Hij wonder gedaan, in Egypteland, in het veld van Zoan. Hij kliefde de zee, en liet hen erdoorheen gaan; en de wateren liet Hij staan als een hoop. En Hij leidde hen overdag met een wolk, en de hele nacht met een licht van het vuur.", "Spr 6:18": "een hart dat verdorven plannen smeedt; voeten die zich haasten om naar het kwaad te lopen;", "Hos 10:14": "Daarom zal er een groot rumoer ontstaan onder uw volken, en al uw vestingen zullen verwoest worden, zoals Salman Beth-arbel verwoestte op de dag van de strijd; de moeder werd verpletterd met de zonen.", "Jes 50:3": "Ik bekleed de hemel met zwartheid, en maak een zak tot zijn bedekking.", "Job 38:37": "Wie kan de wolken met wijsheid tellen, en wie kan de flessen van de hemel neerleggen?", "Ps 56:7": "Zij rotten samen, zij versteken zich, zij letten op mijn hielen, zoals zij die op mijn ziel wachten.", "Amos 4:13": "Want zie, Die de bergen vormt, en de wind schept, en de mens bekendmaakt wat Zijn gedachte is, Die de dageraad duisternis maakt, en op de hoogten van de aarde treedt, HEERE, God van de heerscharen, is Zijn Naam.", "Ezech 32:30": "Daar zijn de geweldigen van het noorden, zij allen, en alle Sidoniërs, die met de verslagenen zijn neergedaald, beschaamd vanwege hun schrik die uit hun macht voortkwam, en zij liggen onbesneden bij de verslagenen van het zwaard, en dragen hun schande met hen die in het kuil zijn neergedaald.", "Klaagl 5:11-13": "Zij hebben de vrouwen in Sion verkracht, en de jonge dochters in de steden van Juda. De vorsten zijn door hun hand opgehangen; de gezichten van de oudsten zijn niet geëerd geweest. Zij hebben de jongemannen weggenomen om te malen, en de jongens struikelden onder het hout.", "Dan 6:28": "Hij verlost en redt, en Hij doet tekenen en wonderen in de hemel en op de aarde; Hij heeft Daniël uit de macht van de leeuwen verlost.", "Lev 19:18": "U zult niet wreken, noch toorn koesteren tegen de kinderen van uw volk; maar u zult uw naaste liefhebben als uzelf; Ik ben de HEERE!", "2 Kon 16:9": "Zo luisterde de koning van Assyrië naar hem; want de koning van Assyrië trok op tegen Damaskus, en nam het in, en voerde de bevolking gevankelijk weg naar Kir, en hij doodde Rezin.", "Ps 136:10-22": "Hem, Die de Egyptenaren geslagen heeft in hun eerstgeborenen; want Zijn goedertierenheid is voor eeuwig. En Israël uit hun midden heeft uitgebracht; want Zijn goedertierenheid is voor eeuwig. Met een sterke hand, en met een uitgestrekte arm; want Zijn goedertierenheid is voor eeuwig.", "Ps 109:16-18": "Omdat hij niet gedacht heeft weldadigheid te doen, maar de ellendige en de behoeftige man heeft vervolgd, en de verslagene van hart, om hem te doden. Omdat hij de vloek heeft liefgehad, laat die hem overkomen, en heeft geen lust gehad tot de zegen, laat die dan ver van hem zijn. En laat hij bekleed zijn met de vloek, als met zijn kleed, en laat die gaan tot in zijn binnenste als het water, en als de olie in zijn beenderen.", "Jes 5:29": "Hun gebrul zal zijn als van een oude leeuw, en zij zullen brullen als de jonge leeuwen, en zij zullen grommen, en de prooi grijpen en wegvoeren; en er zal niemand zijn die redt.", "Jer 51:30": "Babels helden hebben opgehouden te strijden, zij zijn gebleven in de vestingen, hun kracht is bezweken, zij zijn tot vrouwen geworden; zij hebben hun woningen aangestoken, hun grendels zijn verbroken.", "Hand 8:26": "En een engel van de Heere sprak tot Filippus en zei: Sta op, en ga naar het zuiden, op de weg die van Jeruzalem afdaalt naar Gaza, die woest is.", "Ps 89:10": "Gij heerst over de opgeblazenheid van de zee; wanneer haar baren zich verheffen, dan stilt Gij ze.", "Gen 27:29": "Volken zullen u dienen, en volken zullen zich voor u neerbuigen; wees heer over uw broers, en de zonen van uw moeder zullen zich voor u neerbuigen! Vervloekt moet hij zijn, wie u vervloekt; en wie u zegent, zij gezegend!", "Zef 2:8": "Ik heb de beschimping van Moab gehoord, en de scheldwoorden van de kinderen van Ammon, waarmee zij Mijn volk beschimpt hebben, en zich groot gemaakt hebben tegen hun grondgebied.", "Amos 9:5": "Want de Heere HEERE van de heerscharen is het, Die het land aanraakt, zodat het versmelt, en allen die daarin wonen treuren; en heel het land stijgt op als een rivier, en wordt verdronken als door de rivier van Egypte.", "Gen 27:41": "En Ezau haatte Jakob om die zegen, waarmee zijn vader hem gezegend had; en Ezau zei in zijn hart: De dagen van rouw om mijn vader komen dichterbij, en ik zal mijn broer Jakob doden.", "2 Kon 8:7-15": "Daarna kwam Elisa in Damaskus, toen Benhadad, de koning van Syrië, ziek was; en men vertelde hem: De man Gods is hierheen gekomen. Toen zei de koning tegen Hazaël: Neem een geschenk mee, en ga de man Gods tegemoet, en vraag door hem de HEERE: Zal ik van deze ziekte genezen? Zo ging Hazaël hem tegemoet, en nam een geschenk mee, namelijk al het goede van Damaskus, een last van veertig kamelen; en hij kwam, en stond voor hem, en zei: Uw zoon Benhadad, de koning van Syrië, heeft mij naar u gezonden om te vragen: Zal ik van deze ziekte genezen?", "Jes 40:24": "Ja, zij worden niet geplant, ja, zij worden niet gezaaid, ja, hun afgehouwen stam wortelt niet in de aarde; ook als Hij op hen waait, zullen zij verdorren, en een stormwind zal hen als een stoppel wegnemen.", "Ps 137:9": "Gelukkig zal hij zijn, die uw kinderen grijpt, en tegen de steenrots verpletteren zal.", "Ezech 35:6": "Daarom, zo waarachtig als Ik leef, spreekt de Heere HEERE; Ik zal u voorzeker tot bloed bestemmen, en het bloed zal u achtervolgen; omdat u het bloed niet hebt gehaat, zal het bloed u ook achtervolgen.", "2 Kron 20:20": "En zij stonden 's morgens vroeg op en trokken naar de woestijn van Thekoa; en toen zij optrokken, stond Josafat en zei: Hoor mij, o Juda, en u, inwoners van Jeruzalem! Geloof in de HEERE, uw God, dan zult u standhouden; geloof Zijn profeten, dan zult u voorspoedig zijn.", "Job 9:10": "Die grote dingen doet, die men niet doorzoeken kan; en wonderen, die men niet tellen kan.", "Zach 7:14": "Maar Ik heb hen weggestormd onder alle heidenvolken die zij niet kenden; en het land werd achter hen verwoest, zodat niemand er doorheen trok of terugkeerde; want zij maakten het begerenswaardige land tot een verwoesting.", "Richt 11:15-28": "En hij zei tegen hem: Zo zegt Jeftha: Israël heeft het land van de Moabieten, en het land van de kinderen van Ammon, niet afgenomen; want toen zij uit Egypte optrokken, wandelde Israël door de woestijn tot aan de Schelfzee, en kwam bij Kades. En Israël zond boden naar de koning van de Edomieten, en zei: Laat mij toch door uw land trekken; maar de koning van de Edomieten wilde niet luisteren. En hij zond ook naar de koning van de Moabieten, die ook niet wilde. Zo bleef Israël in Kades.", "Spr 16:14": "De woede van de koning is als de boden van de dood; maar een wijs man zal die verzoenen.", "Nahum 3:13": "Zie, uw volk zal in het midden van u tot vrouwen worden; de poorten van uw land zullen wijd geopend worden voor uw vijanden; het vuur zal uw grendels verteren.", "Hoogl 7:5": "Uw hoofd op u is als Karmel, en het haar van uw hoofd als purper; de koning is als gebonden op de galerijen.", "Ps 104:32": "Als Hij de aarde aanschouwt, dan beeft zij; als Hij de bergen aanraakt, dan roken zij.", "Nahum 1:3-6": "De HEERE is geduldig, maar van grote kracht, en Hij houdt de schuldige zeker niet onschuldig. De weg van de HEERE is in wervelwind en in storm, en de wolken zijn het stof van Zijn voeten. Hij bestraft de zee, en maakt haar droog, en Hij droogt alle rivieren uit; Basan en Karmel kwijnen weg, ook kwijnt de bloem van Libanon weg. De bergen beven voor Hem, en de heuvels smelten; en de aarde licht zich op voor Zijn aangezicht, ja de wereld, en allen die daarin wonen.", "Jer 25:30": "U zult dan al deze woorden tot hen profeteren, en u zult tot hen zeggen: De HEERE zal brullen uit de hoogte, en Zijn stem verheffen uit de woning van Zijn heiligheid; Hij zal geweldig brullen over Zijn woonstede; Hij zal een vreugdegeroep, als de druiventreders, uitroepen tegen alle inwoners van de aarde.", "Jer 1:15": "Want zie, Ik roep alle geslachten van de koninkrijken van het noorden, spreekt de HEERE; en zij zullen komen, en ieder zal zijn troon zetten voor de deur van de poorten van Jeruzalem, en tegen al haar muren rondom, en tegen alle steden van Juda.", "Hab 2:5": "En ook omdat hij trouweloos handelt bij de wijn, een trots man is, en niet in zijn woning blijft; die zijn ziel wijd opendoet als het graf, en is als de dood, die niet verzadigd wordt, en tot zich verzamelt alle heidenvolken, en tot zich bijeenbrengt alle volken.", "Klaagl 4:3": "Gimel. Zelfs laten de zeekalveren de borst zien, zij zogen hun jongen; maar de dochter van mijn volk is wreed geworden, gelijk de struisvogels in de woestijn.", "Ps 135:8-12": "Die de eerstgeborenen van Egypte sloeg, van de mens af tot het vee toe. Hij zond tekenen en wonderen in het midden van u, o Egypte! tegen Farao en tegen al zijn knechten. Die veel volken sloeg, en machtige koningen doodde;", "Richt 9:57": "Op dezelfde manier liet God al het kwaad van de mensen van Sichem op hun hoofd terugkomen; en de vloek van Jotham, de zoon van Jerubbaäl, kwam over hen.", "2 Sam 22:13": "Van de glans voor Hem heen werden kolen van het vuur aangestoken.", "Jes 6:11": "Toen zei ik: Hoe lang, Heere? En Hij zei: Totdat de steden verwoest worden, zodat er geen inwoner meer is, en de huizen, zodat er geen mens meer is, en het land met verwoesting verstrooid wordt.", "Zach 9:2-4": "En ook zal Hij Hamath ermee grenzen; Tyrus en Sidon, hoewel zij zeer wijs is; En Tyrus heeft zich sterkten gebouwd, en zilver verzameld als stof, en fijn goud als slijk van de straten; Zie, de Heere zal haar uit het bezit stoten, en Hij zal haar vesting in de zee verslaan; en zij zal met vuur verteerd worden.", "Ps 109:2-5": "Want de mond van de goddeloze en de mond van het bedrog zijn tegen mij opengedaan; zij hebben tegen mij gesproken met een valse tong. En met hatelijke woorden hebben zij mij omsingeld; ja, zij hebben mij bestreden zonder oorzaak. Voor mijn liefde staan zij mij tegen; maar ik was steeds in het gebed.", "Jer 9:10-21": "Ik zal een geween en een klaagzang aanheffen over de bergen, en een klaaglied over de herdershutten van de woestijn; want zij zijn afgebrand, zodat er niemand doorgaat, en men hoort er geen stem van vee; van de vogels van de hemel tot de dieren toe zijn zij weggevlucht, weggegaan! En Ik zal Jeruzalem stellen tot steenhopen, tot een woning voor jakhalzen; en de steden van Juda zal Ik stellen tot een verwoesting, zonder inwoner. Wie is de wijze man, die dit begrijpt? En tot wie heeft de mond van de HEERE gesproken, dat hij het verkondigt, waarom het land vergaat en afgebrand is als een woestijn, zodat er niemand doorgaat?", "Spr 26:2": "Zoals de mus wegzweeft, zoals een zwaluw wegvliegt, zo zal een vloek die zonder oorzaak is, niet komen.", "Ps 106:8": "Toch verloste Hij hen om Zijn Naams wil, opdat Hij Zijn macht bekend maakte.", "Ps 147:16": "Hij geeft sneeuw als wol; Hij strooit de rijp als as.", "Jer 23:29": "Is Mijn woord niet zo, als een vuur? spreekt de HEERE, en als een hamer, die een steenrots verbrijzelt?", "Spr 22:25": "opdat u zijn paden niet leert, en een strik over uw ziel haalt.", "Jes 22:6": "Want Elam heeft de pijlkoker genomen, de man is op de wagen, er zijn ruiters; en Kir ontbloot het schild.", "Ps 35:16": "Onder spotachtige tafelbroeders die huichelden, knerste men over mij met de tanden.", "1 Petr 3:9": "vergeld geen kwaad met kwaad, of schelden met schelden, maar zegen daarentegen; want u weet dat u daartoe geroepen bent, opdat u zegening zou beërven.", "Klaagl 4:21": "Schin. Wees vrolijk, en verblijd u, dochter van Edom, die in het land Uz woont! toch zal de beker ook naar u toe komen, u zult dronken worden, en zich ontbloten.", "Jer 10:6": "Omdat niemand U gelijk is, o HEERE! zo bent U groot, en groot is Uw Naam in macht.", "Spr 11:17": "Een goedertieren mens doet zijn eigen ziel goed; maar wie wreed is, brengt zijn eigen vlees in beroering.", "1 Kon 19:15": "En de HEERE zei tegen hem: Ga, keer terug op uw weg, naar de woestijn van Damaskus; en als u daar aankomt, zalf dan Hazaël tot koning over Syrië.", "Amos 3:7": "Zeker, de Heere HEERE zal niets doen, tenzij Hij Zijn verborgenheid aan Zijn dienaren, de profeten, geopenbaard heeft.", "Amos 2:6": "Zo zegt de HEERE: Om drie overtredingen van Israël, en om vier zal Ik dat niet afwenden; omdat zij de rechtvaardige voor geld verkopen, en de arme om een paar schoenen.", "Jer 15:9": "Zij die zeven kinderen baarde, is zwak geworden; zij heeft haar ziel uitgeblazen, haar zon is ondergegaan, toen het nog dag was; zij is beschaamd en te schande geworden; en hun overblijfsel zal Ik aan het zwaard overgeven, voor het aangezicht van hun vijanden, spreekt de HEERE.", "Joël 1:16-18": "Is niet het voedsel voor onze ogen afgesneden? Blijdschap en verheuging van het huis van onze God? De granen zijn onder hun kluiten verrot, de schathuizen zijn verwoest, de schuren zijn afgebroken, want het koren is verdord. O, hoe zucht het vee, de runderkudden zijn bedwelmd, want zij hebben geen weide, ook zijn de schaapskudden verwoest.", "Ps 83:4-9": "Zij maken listig een heimelijk plan tegen Uw volk, en spannen samen tegen wie U verborgen houdt. Zij hebben gezegd: Kom, laten we hen uitroeien, zodat zij geen volk meer zijn, en aan de naam van Israël niet meer gedacht wordt. Want zij hebben in hun hart samen een plan beraamd; tegen U hebben zij een verbond gesloten;", "1 Kor 5:8": "Laten we dan feest houden, niet met de oude zuurdesem, ook niet met de zuurdesem van kwaadheid en boosheid, maar met de ongezuurde broden van oprechtheid en waarheid.", "Zach 9:14": "En de HEERE zal over hen verschijnen, en Zijn pijlen zullen uitgaan als een bliksem; en de Heere HEERE zal met de bazuin blazen, en Hij zal voorttrekken met stormen uit het zuiden.", "Rom 1:29-32": "vervuld met alle ongerechtigheid, hoererij, boosheid, hebzucht, kwaadaardigheid; vol afgunst, moord, twist, bedrog, kwaadwilligheid; kwaadsprekers, lasteraars, haters van God, smaders, hoogmoedigen, laatdunkende, vinders van kwade dingen, ongehoorzaam aan hun ouders; onverstandigen, verbondbrekers, zonder natuurlijke liefde, onverzoenlijken, onbarmhartigen;", "Jes 41:15": "Zie, Ik heb u gemaakt tot een scherpe nieuwe dorsslede, die scherpe punten heeft; u zult bergen dorsen en verpulveren, en heuvels zult u maken als kaf.", "Dan 2:20": "Daniël antwoordde en zei: De Naam van God zij geloofd van eeuwigheid tot in eeuwigheid, want van Hem is de wijsheid en de kracht.", "Jes 63:1": "Wie is Deze, Die van Edom komt met bespatte kleren, van Bozra? Deze, Die praalt in Zijn gewaad? Die voorttrekt in Zijn grote kracht? Ik ben het, Die in gerechtigheid spreek, Die machtig ben om te verlossen.", "2 Kon 14:21": "En het hele volk van Juda nam Azaria (die toen zestien jaar oud was), en maakte hem koning in de plaats van zijn vader Amazia.", "2 Kron 28:9": "Daar nu was een profeet van de HEERE, wiens naam Oded was; die ging naar buiten, het leger tegemoet dat naar Samaria kwam, en zei tegen hen: Zie, door de grimmigheid van de HEERE, de God van uw vaderen, over Juda, heeft Hij hen in uw hand gegeven, en u hebt hen doodgeslagen in een toorn die tot aan de hemel raakt.", "Jes 34:6": "Het zwaard van de HEERE is vol bloed, het is vet geworden van vet, van het bloed van de lammeren en de bokken, van het vet van de nieren van de rammen; want de HEERE heeft een offer in Bozra, en een grote slachting in het land van de Edomieten.", "Openb 19:17": "En ik zag een engel, staande in de zon; en hij riep met een grote stem, en zei tegen alle vogels, die in het midden van de hemel vlogen: Kom hierheen, en verzamel u tot het avondmaal van de grote God;", "Jes 27:4": "Grimmigheid is bij Mij niet; wie zou Mij als een doorn en distel in oorlog willen zetten, zodat Ik tegen hem zou aanvallen, en hem tegelijk zou verbranden?", "Luk 6:29": "Wie u op de ene wang slaat, biedt hem ook de andere aan; en wie u de mantel afneemt, weerhoud hem niet ook uw hemd te nemen.", "Jes 18:6": "Zij zullen samen overgelaten worden aan de roofvogels van de bergen, en aan de dieren van de aarde; en de roofvogels zullen op hen overzomeren, en alle dieren van de aarde zullen daarop overwinteren.", "Ps 74:20": "Zie naar het verbond; want de duistere plaatsen van het land zijn vol woningen van geweld.", "Ps 33:9": "Want Hij spreekt, en het is er; Hij gebiedt, en het staat er.", "Jer 27:3": "En stuur ze naar de koning van Edom, en naar de koning van Moab, en naar de koning van de kinderen van Ammon, en naar de koning van Tyrus, en naar de koning van Sidon; door de hand van de boden die naar Jeruzalem komen, naar Zedekia, de koning van Juda.", "Jer 7:27": "Ook zult u al deze woorden tot hen spreken, maar zij zullen naar u niet horen; u zult wel tot hen roepen, maar zij zullen u niet antwoorden.", "Jes 40:22": "Hij is het, Die daar zit boven de kring van de aarde, en haar inwoners zijn als sprinkhanen; Hij is het, Die de hemel uitspant als een dunne doek, en breidt hem uit als een tent, om te bewonen;", "Amos 2:1": "Zo zegt de HEERE: Om drie overtredingen van Moab, en om vier zal Ik dat niet afwenden; omdat hij de beenderen van de koning van Edom tot kalk verbrand heeft.", "2 Kon 10:33": "Vanaf de Jordaan, tegen de opgang van de zon, het gehele land van Gilead, van de Gadieten, en van de Rubenieten, en van de Manassieten; van Aroër, dat aan de beek van Arnon is, en Gilead, en Basan.", "Ps 46:7": "De heidenen raasden, de koninkrijken bewogen zich; Hij verhief Zijn stem, de aarde versmolt.", "Matt 19:26": "En Jezus keek hen aan, en zei tegen hen: Bij de mensen is dat onmogelijk, maar bij God zijn alle dingen mogelijk.", "Jer 5:17": "En het zal uw oogst en uw brood opeten, dat uw zonen en uw dochters zouden eten; het zal uw schapen en uw runderen opeten; het zal uw wijnstok en uw vijgenboom opeten; uw vaste steden, waarop u vertrouwt, zal het arm maken door het zwaard.", "Job 31:30": "(Ook heb ik mijn gehemelte niet toegelaten te zondigen, door een vloek zijn ziel te begeren).", "Luk 21:20-26": "Maar wanneer u zult zien dat Jeruzalem door legers omsingeld wordt, weet dan, dat haar verwoesting nabij gekomen is. Laten dan zij die in Judea zijn, vluchten naar de bergen; en zij die in het midden ervan zijn, daaruit trekken; en zij die op de velden zijn, daar niet in komen. Want dit zijn dagen van wraak, opdat alles vervuld wordt wat geschreven is.", "Jer 1:1": "De woorden van Jeremia, de zoon van Hilkia, uit de priesters die te Anathoth waren, in het land van Benjamin;", "Jes 14:27": "Want de HEERE van de heerscharen heeft het in Zijn raad besloten, wie zal het dan verbreken? en Zijn hand is uitgestrekt, wie zal die dan keren?", "Ps 65:8": "Die het bruisen van de zeeën stilt, het bruisen van haar golven, en het rumoer van de volken.", "Spr 14:29": "Wie lankmoedig is, is groot van verstand; maar wie haastig is van gemoed, verheft de dwaasheid.", "Gen 25:23": "En de HEERE zei tegen haar: Twee volken zijn in uw buik, en twee naties zullen zich uit uw ingewand van elkaar scheiden; en het ene volk zal sterker zijn dan het andere volk; en de oudste zal de jongste dienen.", "Ps 89:14": "Gij hebt een arm met macht; Uw hand is sterk, Uw rechterhand is hoog.", "Hos 13:8": "Ik ontmoette hen als een berin die van haar jongen beroofd is, en scheurde het omhulsel van hun hart open; en Ik verslond hen daar als een leeuw; het wilde dier van het veld verscheurde hen.", "Ef 3:20": "Hem nu, Die machtig is oneindig veel meer te doen dan wij bidden of denken, naar de kracht die in ons werkt,", "Jer 49:27": "En Ik zal een vuur aansteken in de muur van Damaskus, en het zal Benhadads paleizen verteren.", "Joël 3:4-8": "En ook, wat hebt u met Mij te maken, Tyrus en Sidon, en alle gebieden van Palestina! Wilt u Mij iets vergelden? Maar als u Mij iets wilt vergelden, zal Ik zeer snel, heel haastig, uw vergelding op uw eigen hoofd terugbrengen. Omdat u Mijn zilver en Mijn goud hebt weggenomen, en Mijn beste kostbaarheden in uw tempels hebt gebracht. En u hebt de kinderen van Juda en de kinderen van Jeruzalem verkocht aan de kinderen van de Grieken, om hen ver van hun grondgebied te brengen.", "Ef 1:20": "Die Hij gewrocht heeft in Christus, toen Hij Hem uit de doden heeft opgewekt; en Hem heeft gezet aan Zijn rechterhand in de hemel;", "Ezech 25:3": "En zeg tegen de kinderen van Ammon: Hoor het woord van de Heere HEERE: Zo zegt de Heere HEERE: Omdat u gezegd hebt: Ha! over Mijn heiligdom, toen het ontheiligd werd, en over het land van Israël, toen het verwoest werd, en over het huis van Juda, toen zij in gevangenschap gingen;", "Ezech 26:2": "Mensenkind! Omdat Tyrus van Jeruzalem gezegd heeft: Heah! Zij is verbroken, de poort van de volken; zij is tot mij omgewend; ik zal vervuld worden, zij is verwoest!", "1 Joh 2:9": "Wie zegt, dat hij in het licht is, en zijn broeder haat, die is tot nu toe in de duisternis.", "Deut 2:19": "En u zult naderen tegenover de kinderen van Ammon; beangstig hen niet, en meng u niet met hen; want Ik zal u van het land van de kinderen van Ammon geen erfenis geven, omdat Ik het aan de kinderen van Lot tot erfenis gegeven heb.", "Ps 22:9": "Hij heeft het op de HEERE gewenteld, dat Hij hem nu uithelpt, dat Hij hem redt, omdat Hij lust aan hem heeft!", "Gen 4:6": "En de HEERE zei tegen Kaïn: Waarom bent u ontstoken, en waarom is uw gezicht betrokken?", "Ps 57:7": "Zij hebben een net klaargezet voor mijn voeten, mijn ziel was neergebukt; zij hebben een kuil voor mij gegraven; zij zijn er zelf middenin gevallen. Sela.", "Ps 78:43-51": "Hoe Hij Zijn tekenen stelde in Egypte, en Zijn wonderen in het veld van Zoan; En hun stromen in bloed veranderde, en hun waterlopen, zodat zij niet konden drinken. Hij zond een vermenging van ongedierte onder hen, dat hen verteerde, en vorsen, die hen verdierven.", "Spr 29:9": "Een wijs man, die met een dwaas man een geschil voert, wordt of boos of belachen, en toch komt er geen rust.", "Ps 62:12": "God heeft één ding gesproken, dit heb ik tweemaal gehoord: dat de sterkte van God is.", "Hebr 12:29": "Want onze God is een verterend vuur.", "Jes 63:12": "Die de arm van Zijn heerlijkheid heeft laten gaan aan de rechterhand van Mozes; Die de wateren voor hun aangezicht kliefde, opdat Hij Zich een eeuwige Naam maakte?", "Ps 29:3-9": "De stem van de HEERE is op de wateren, de God van de ere dondert; de HEERE is op de grote wateren. De stem van de HEERE is met kracht, de stem van de HEERE is met heerlijkheid. De stem van de HEERE breekt de ceders; ja, de HEERE verbreekt de ceders van Libanon.", "Zach 14:2": "Want Ik zal alle heidenen tegen Jeruzalem ten strijde verzamelen; en de stad zal ingenomen worden, en de huizen zullen geplunderd worden, en de vrouwen zullen geschonden worden; en de helft van de stad zal uitgaan in de gevangenis, maar het overige van het volk zal uit de stad niet uitgeroeid worden.", "Jes 16:10": "zodat de blijdschap en vrolijkheid weggenomen is van het vruchtbare veld, en in de wijngaarden wordt niet gezongen, en er wordt geen gejuich gemaakt; de druiventreder treedt geen wijn uit in de wijnbakken, ik heb het vreugdegeroep doen ophouden.", "Ps 65:7": "Die de bergen vastzet door Zijn kracht, omgord met macht.", "Jer 17:27": "Maar als u naar Mij niet zult horen, om de sabbatdag te heiligen, en om geen last te dragen als u op de sabbatdag door de poorten van Jeruzalem ingaat; zo zal Ik een vuur in haar poorten aansteken, dat de paleizen van Jeruzalem zal verteren, en niet uitgeblust worden.", "Spr 6:34": "Want jaloezie is de woede van een man; en op de dag van de wraak zal hij niet sparen.", "2 Kon 13:7": "Want hij had Joahaz geen volk laten overblijven dan vijftig ruiters en tien wagens, en tienduizend van het voetvolk; want de koning van Syrië had hen omgebracht, en had hen gemaakt als stof door ze te dorsen.", "Deut 23:4": "Vanwege dat zij u onderweg niet tegemoet gekomen zijn met brood en met water, toen u uit Egypte wegtrok; en omdat hij tegen u Bileam gehuurd heeft, de zoon van Beor, uit Pethor in Mesopotamië, om u te vloeken.", "Jes 33:14": "De zondaars in Sion zijn verschrikt; beving heeft de huichelaars aangegrepen; zij zeggen: Wie onder ons kan bij een verterend vuur wonen? Wie onder ons kan bij een eeuwige gloed wonen?", "Richt 10:7-9": "Toen ontstak de toorn van de HEERE tegen Israël; en Hij verkocht hen in de hand van de Filistijnen en in de hand van de Ammonieten. Die verdrukten en vertrapten de Israëlieten in datzelfde jaar; achttien jaar lang onderdrukten zij alle Israëlieten die aan de overkant van de Jordaan waren, in het land van de Amorieten, dat in Gilead ligt. Daarbij trokken de Ammonieten de Jordaan over om te strijden, ook tegen Juda, tegen Benjamin en tegen het huis van Efraïm, zodat Israël erg in het nauw kwam.", "Jes 33:9": "Het land treurt, het kwijnt weg; de Libanon schaamt zich, hij verwelkt; Saron is geworden als een woestijn; zo zijn Basan en Karmel geschud.", "Ezech 39:6": "En Ik zal een vuur zenden in Magog, en onder hen die veilig op de eilanden wonen; en zij zullen weten dat Ik de HEERE ben.", "Jer 14:2": "Juda treurt en haar poorten zijn verzwakt; zij zijn in het zwart gekleed tot op de grond, en Jeruzalems geschrei klimt op.", "Ex 15:6-8": "O HEERE! Uw rechterhand is verheerlijkt in macht; Uw rechterhand, o HEERE, heeft de vijand verbroken! En door Uw grote hoogheid hebt U hen die tegen U opstonden, omgeworpen; U hebt Uw brandende toorn losgelaten, die hen verteerd heeft als een stoppel. En door het geblaas van Uw neus zijn de wateren opgehoopt; de stromen hebben overeind gestaan als een hoop; de afgronden zijn stijf geworden in het hart van de zee.", "Jes 21:12": "De wachter zei: De morgenstond is gekomen, en het is nog nacht; als u wilt vragen, vraag; keer terug, kom.", "Rom 12:19": "Wreek uzelf niet, geliefden, maar geef de toorn plaats; want er is geschreven: Mij komt de wraak toe; Ik zal het vergelden, zegt de Heere.", "Jer 47:4": "Vanwege de dag die eraan komt om alle Filistijnen te verstoren, om Tyrus en Sidon alle overgebleven helper af te snijden; want de HEERE zal de Filistijnen, het overblijfsel van het eiland Kafthor, verstoren.", "Joh 18:23": "Jezus antwoordde hem: Als Ik verkeerd gesproken heb, getuig dan van het kwade; en als Ik goed gesproken heb, waarom slaat u Mij?", "Richt 9:19": "als u dan vandaag werkelijk en oprecht gehandeld hebt met Jerubbaäl en zijn huis, wees dan vrolijk over Abimelech, en laat hij ook vrolijk zijn over u.", "Ps 104:29": "Verbergt U Uw gezicht, zij worden angstig; neemt U hun adem weg, zij sterven, en zij keren terug tot hun stof.", "2 Sam 10:1-8": "En het gebeurde daarna, dat de koning van de kinderen Ammons stierf, en zijn zoon Hanun werd koning in zijn plaats. Toen zei David: Ik zal weldadigheid doen aan Hanun, de zoon van Nahas, zoals zijn vader weldadigheid aan mij gedaan heeft. Zo zond David heen, om hem door de dienst van zijn knechten te troosten over zijn vader. En de knechten van David kwamen in het land van de kinderen Ammons. Toen zeiden de vorsten van de kinderen Ammons tegen hun heer Hanun: Eert u David uw vader in uw ogen, omdat hij troosters tot u gezonden heeft? Heeft David zijn knechten niet daarom tot u gezonden, dat hij deze stad doorzoekt, en die verspiedt, en die omkeert?", "Jer 20:11": "Maar de HEERE is met mij als een verschrikkelijke Held; daarom zullen mijn vervolgers struikelen, en zullen niets bereiken; zij zijn zeer beschaamd geworden, omdat zij niet verstandig gehandeld hebben; het zal een eeuwige schande zijn, ze zal niet vergeten worden.", "1 Kon 19:17": "En het zal gebeuren dat Jehu hem, die aan het zwaard van Hazaël ontkomt, zal doden; en die aan het zwaard van Jehu ontkomt, die zal Elisa doden.", "Ezech 18:18": "Zijn vader, omdat hij met onderdrukking onderdrukt heeft, het goed van zijn broeder geroofd heeft, en gedaan heeft wat niet goed was te midden van zijn volk; zie, hij zal sterven in zijn ongerechtigheid.", "Jes 33:8": "De gebaande wegen zijn verwoest, wie over de paden gaat, houdt op; hij vernietigt het verbond, hij veracht de steden, hij telt geen mens.", "Jes 1:25": "En Ik zal Mijn hand tegen u keren, en Ik zal uw schuim tot het allerreinste afzuiveren, en Ik zal al uw tin wegnemen.", "1 Sam 11:1": "Toen trok Nahas, de Ammoniet, op en belegerde Jabes in Gilead. En alle mannen van Jabes zeiden tegen Nahas: Sluit een verbond met ons, en wij zullen u dienen.", "Openb 5:13": "En elk schepsel dat in de hemel is, en op de aarde, en onder de aarde, en die in de zee zijn, en alles wat daarin is, hoorde ik zeggen: Hem Die op de troon zit, en het Lam, zij de dankzegging, en de eer, en de heerlijkheid, en de kracht, tot in alle eeuwigheid.", "Ezech 25:12": "Zo zegt de Heere HEERE: Omdat Edom met louter wraakgierigheid gehandeld heeft tegen het huis van Juda, en zij zich zeer schuldig gemaakt hebben doordat zij zich op hen gewroken hebben:", "Ef 4:31": "Alle bitterheid, en toorn, en gramschap, en geroep, en lastering worde van u geweerd, met alle boosheid;", "Jer 9:26": "Over Egypte, en over Juda, en over Edom, en over de kinderen van Ammon, en over Moab, en over allen die aan de hoeken kortgeknipt zijn, die in de woestijn wonen; want alle heidenen hebben de voorhuid, maar het hele huis van Israël heeft de voorhuid van het hart.", "Jes 29:20": "Wanneer de tiran een einde zal hebben, en het met de spotter voorbij zal zijn, en allen die op ongerechtigheid loeren, uitgeroeid zullen zijn;", "Ezech 25:6": "Want zo zegt de Heere HEERE: Omdat u met de hand geklapt, en met de voet gestampt hebt, en van harte verheugd bent geweest over al uw plundering, over het land van Israël;", "Jes 35:2": "Zij zal uitbundig bloeien, en zich verheugen, ja, met verheuging, en juichen; de heerlijkheid van Libanon is haar gegeven, het sieraad van Karmel en Saron; zij zullen de heerlijkheid van de HEERE zien, het sieraad van onze God.", "Jes 23:11": "Hij heeft Zijn hand uitgestrekt over de zee, Hij heeft de koninkrijken doen beven; de HEERE heeft bevel gegeven tegen Kanaän, om haar vestingen te vernietigen.", "Jer 27:1-11": "In het begin van het koningschap van Jojakim, zoon van Josia, koning van Juda, kwam dit woord van de HEERE tot Jeremia: Zo zei de HEERE tegen mij: Maak u banden en jukken, en doe die om uw hals. En stuur ze naar de koning van Edom, en naar de koning van Moab, en naar de koning van de kinderen van Ammon, en naar de koning van Tyrus, en naar de koning van Sidon; door de hand van de boden die naar Jeruzalem komen, naar Zedekia, de koning van Juda.", "Ps 115:3": "Onze God is toch in de hemel, Hij doet al wat Hem behaagt.", "Matt 6:13": "En leid ons niet in verzoeking, maar verlos ons van de boze. Want van U is het Koninkrijk, en de kracht, en de heerlijkheid, tot in eeuwigheid. Amen.", "Job 36:5": "Zie, God is machtig, toch veracht Hij niemand; machtig is Hij in kracht van hart.", "Obadja 1:10": "Om het geweld, gepleegd tegen uw broeder Jakob, zal schaamte u bedekken; en u zult voor eeuwig worden uitgeroeid.", "Spr 24:29": "Zeg niet: Zoals hij mij gedaan heeft, zo zal ik hem doen; ik zal ieder vergelden naar zijn werk.", "1 Petr 1:5": "Die in de kracht van God bewaard wordt door het geloof tot de zaligheid, die klaarligt om geopenbaard te worden in de laatste tijd.", "Ps 69:11-13": "En ik heb geweend in het vasten van mijn ziel; maar het is mij tot allerlei smaad geworden. En ik heb een zak tot mijn kleed aangedaan; maar ik ben hun tot een spreekwoord geworden. Die in de poort zitten, praten over mij; en ik ben een lied voor hen die sterke drank drinken.", "Jer 10:20": "Mijn tent is verstoord, en al mijn touwen zijn verscheurd; mijn kinderen zijn van mij uitgegaan, en zij zijn er niet; er is niemand meer, die mijn tent uitspant, en mijn gordijnen opricht.", "Dan 11:41": "En hij zal komen in het land van het sieraad, en veel landen zullen neergeworpen worden; doch deze zullen aan zijn hand ontkomen: Edom en Moab, en de voornaamsten van de kinderen van Ammon.", "Spr 12:16": "De toorn van de dwaas wordt op diezelfde dag bekend; maar wie schrander is, bedekt de schande.", "Zef 2:4-7": "Want Gaza zal verlaten zijn, en Askelon zal tot een verwoesting worden; Asdod zal men op de middag verdrijven, en Ekron zal uitgeworteld worden. Wee de inwoners van de kuststreek van de zee, het volk van de Cheretieten! Het woord van de HEERE zal tegen u zijn, gij Kanaän, land van de Filistijnen! En Ik zal u verdoen, zodat er geen inwoner zal zijn. En de kuststreek van de zee zal worden tot weiden, uitgegraven putten voor herders, en kooien voor kudden.", "Deut 3:24": "Heere HEERE! U bent begonnen Uw dienaar Uw grootheid en Uw sterke hand te tonen; want welke God is er in de hemel of op de aarde, die kan doen naar Uw werken en naar Uw machtige daden!", "Spr 15:17": "Beter is een gerecht van groente, waar ook liefde is, dan een vetgemeste os met haat erbij.", "Jes 3:5": "En het volk zal gedrongen worden, de een zal zijn tegen de ander, en ieder tegen zijn naaste; de jongeling zal zich brutaal gedragen tegen de oude, de verachte tegen de eerlijke.", "1 Sam 14:6": "Jonathan nu zei tegen de jongen die zijn wapens droeg: Kom, laten we naar de bezetting van deze onbesnedenen oversteken; misschien zal de HEERE voor ons werken, want bij de HEERE is geen belemmering om te verlossen door velen of door weinigen.", "2 Kron 26:6": "Want hij trok uit, en streed tegen de Filistijnen, en brak de muur van Gath af, en de muur van Jabne, en de muur van Asdod; daartoe bouwde hij steden in Asdod, en onder de Filistijnen.", "Jes 19:2-16": "Want Ik zal de Egyptenaren tegen de Egyptenaren verwarren, zodat zij zullen strijden, ieder tegen zijn broeder, en ieder tegen zijn naaste, stad tegen stad, koninkrijk tegen koninkrijk. En de geest van de Egyptenaren zal uitgeledigd worden in hun binnenste, en hun raad zal Ik verslinden; dan zullen zij hun afgoden vragen, en de bezweerders, en de waarzeggers, en de duivelskunstenaars. En Ik zal de Egyptenaars overleveren in de hand van harde heren, en een strenge koning zal over hen heersen, spreekt de Heere HEERE van de heerscharen.", "Deut 27:18": "Vervloekt is hij die een blinde op de weg laat dwalen! En heel het volk zal zeggen: Amen.", "Jes 34:7-15": "En de eenhoorns zullen met hen neerdalen, en de jonge stieren met de stieren; en hun land zal doordrenkt worden van het bloed, en hun stof zal van het vet vet gemaakt worden. Want het zal zijn de dag van de wraak van de HEERE, een jaar van vergeldingen, om de rechtszaak van Sion. En hun beken zullen in pek veranderd worden, en hun stof in zwavel; ja, hun land zal tot brandend pek worden.", "2 Kron 21:17": "Zij trokken op tegen Juda, braken erin door en voerden al het bezit weg dat in het huis van de koning gevonden werd, zelfs ook zijn kinderen en zijn vrouwen; zodat hem geen zoon overbleef, behalve Joahaz, de jongste van zijn zonen.", "Job 38:8": "Of wie heeft de zee met deuren toegesloten, toen zij uitbrak, en uit de baarmoeder voortkwam?", "Jes 3:26": "En haar poorten zullen treuren, en leed dragen, en zij zal, leeggemaakt, op de aarde zitten.", "Ps 94:1-5": "O God van de wraken! O HEERE, God van de wraken! Verschijn blinkend! Gij, Rechter der aarde! Verhef U; breng vergelding weer over de hoogmoedigen. Hoe lang zullen de goddelozen, o HEERE! hoe lang zullen de goddelozen van vreugde opspringen?", "Ps 69:27": "Want zij vervolgen hem die U geslagen hebt; en maken een praat van de smart van Uw verwonden.", "Jes 13:15": "Al wie gevonden wordt, zal doorstoken worden, en al wie daarbij gegrepen wordt, zal door het zwaard vallen.", "1 Tim 2:8": "Ik wil dan dat de mannen bidden op alle plaatsen, met het opheffen van heilige handen, zonder toorn en twist.", "Amos 1:13-15": "Zo zegt de HEERE: Om drie overtredingen van de kinderen van Ammon, en om vier zal Ik dat niet afwenden; omdat zij de zwangere vrouwen van Gilead hebben opengesneden, om hun grondgebied te vergroten. Daarom zal Ik een vuur aansteken in de muur van Rabba, dat zal haar paleizen verteren; met gejuich op de dag van de strijd, met een storm op de dag van de wervelwind. En hun koning zal in gevangenschap gaan, hij en zijn vorsten samen, zegt de HEERE.", "Spr 30:33": "Want het karnen van melk brengt boter voort, en het knijpen van de neus brengt bloed voort, en het opjagen van de toorn brengt twist voort.", "Joël 3:16": "En de HEERE zal uit Sion brullen, en uit Jeruzalem Zijn stem geven, zodat hemel en aarde beven zullen; maar de HEERE zal de toevlucht van Zijn volk, en de sterkte van de kinderen van Israël zijn.", "1 Kor 6:14": "En God heeft ook de Heere opgewekt, en zal ons opwekken door Zijn kracht.", "Jer 12:4": "Hoe lang zal het land treuren, en het gewas van het hele veld verdorren? Vanwege de boosheid van hen die daarin wonen, vergaan de dieren en het gevogelte; omdat zij zeggen: Hij ziet ons einde niet.", "Job 41:1": "Niemand is zo dapper, dat hij hem opwekken zou; wie is dan hij, die zich voor Mijn aangezicht stellen zou?", "Pred 11:2": "Geef een deel aan zeven, ja, ook aan acht; want u weet niet wat voor kwaad er op de aarde zal zijn.", "Ps 119:78": "Laat de hoogmoedigen beschaamd worden, omdat zij mij met leugen neergestoten hebben; doch ik betracht Uw geboden.", "Jes 37:12": "Hebben de goden van de volken die mijn vaders vernietigd hebben, die gered — Gozan, en Haran, en Rezef, en de kinderen van Eden, die in Telassar waren?", "Jer 32:27": "Zie, Ik ben de HEERE, de God van alle vlees; zou voor Mij iets te wonderlijk zijn?", "Hab 2:6": "Zouden die allen dan niet een spreekwoord over hem opnemen, en een spottende uitlegging over hem? En men zal zeggen: Wee hem die vermeerdert wat het zijne niet is (hoe lang nog!), en hem die op zich laadt dik slijk!", "Ps 83:8": "Gebal, en Ammon, en Amalek, Palestina met de inwoners van Tyrus.", "2 Kon 8:12": "Toen zei Hazaël: Waarom weent mijn heer? En hij zei: Omdat ik weet welk kwaad u de Israëlieten aan zult doen; u zult hun vestingen in vuur laten opgaan, en hun jonge mannen met het zwaard doden, en hun kleine kinderen verpletteren, en hun zwangere vrouwen opensnijden.", "Deut 11:2": "En u zult heden weten, dat ik niet spreek met uw kinderen, die het niet weten, en de vermaning van de HEERE, uw God, niet gezien hebben. Zijn grootheid, Zijn sterke hand en Zijn uitgestrekte arm;", "Fil 1:16": "Dezen verkondigen Christus wel uit eigenbelang, niet zuiver, en menen aan mijn banden verdrukking toe te brengen;", "2 Kron 28:17": "Bovendien waren ook de Edomieten gekomen, en hadden Juda geslagen en gevangenen weggevoerd.", "Ezech 26:1": "En het gebeurde in het elfde jaar, op de eerste van de maand, dat het woord van de HEERE tot mij kwam en zei:", "1 Sam 27:11": "En David liet geen man en geen vrouw in leven om naar Gath te brengen, en hij zei: Anders zouden zij misschien over ons vertellen en zeggen: Zo heeft David gedaan! En zo was zijn gewoonte, al de dagen dat hij in het land van de Filistijnen gewoond heeft.", "Jona 4:4": "En de HEERE zei: Is het terecht dat uw woede oplaait?", "Jer 46:18": "Zo waarachtig als Ik leef, spreekt de Koning, Wiens Naam is HEERE van de heerscharen; hij zal voorzeker, als Thabor onder de bergen, en als Karmel bij de zee, aankomen!", "Jer 50:36": "Het zwaard zal zijn over de leugenaars, zodat zij dwaas worden; het zwaard zal zijn over haar helden, zodat zij versagen;", "Ps 41:6-9": "Mijn vijanden spreken kwaad van mij, en zeggen: Wanneer zal hij sterven, en zijn naam vergaan? En als iemand van hen komt om mij te zien, spreekt hij valsheid; zijn hart verzamelt onrecht; gaat hij naar buiten, dan spreekt hij ervan. Al mijn haters mompelen samen tegen mij; ze bedenken tegen mij wat mij kwaad doet, en zeggen:", "Jes 43:16": "Zo zegt de HEERE, Die in de zee een weg, en in de sterke wateren een pad maakte;", "Jes 19:1": "De last van Egypte. Zie, de HEERE rijdt op een snelle wolk, en Hij zal in Egypte komen; en de afgoden van Egypte zullen bewogen worden vanwege Zijn aangezicht, en het hart van de Egyptenaren zal smelten in hun binnenste.", "Jes 9:10": "Want de HEERE zal Rezins tegenstanders tegen hem opheffen, en Hij zal zijn vijanden samen verenigen:", "Ezech 33:27": "Zo zult u tegen hen zeggen: Zo zegt de Heere HEERE: Zo waarachtig als Ik leef, wie in die verwoeste plaatsen zijn, zullen door het zwaard vallen, en wie op het open veld is, die zal Ik aan het wilde gedierte overgeven om hem te verslinden, en wie in de vestingen en in de holen zijn, zullen door de pest sterven!", "Ps 102:9": "Mijn vijanden smaden mij de hele dag; die tegen mij razen, zweren bij mij.", "Hab 3:6": "Hij stond, en mat het land, Hij zag toe, en maakte de heidenvolken los, en de aloude bergen zijn verstrooid geworden; de heuvels van eeuwigheid hebben zich gebogen; de gangen van eeuwigheid zijn van Hem.", "Ps 76:11": "Want de grimmigheid van de mens zal U loffelijk maken; het overblijfsel van de grimmigheden zult U opbinden.", "Jes 6:12": "Want de HEERE zal die mensen ver wegdoen, en de verlating zal groot zijn in het binnenste van het land.", "Ezra 8:22": "Want ik schaamde mij om van de koning een leger en ruiters te vragen om ons te helpen tegen de vijand, op de weg; omdat wij tegen de koning gesproken hadden en gezegd: De hand van onze God is ten goede over allen die Hem zoeken, maar Zijn sterkte en Zijn toorn over allen die Hem verlaten.", "Ps 76:7": "Van Uw schelden, o God van Jakob! zijn samen wagen en paard in slaap gezonken.", "Jes 63:1-4": "Wie is Deze, Die van Edom komt met bespatte kleren, van Bozra? Deze, Die praalt in Zijn gewaad? Die voorttrekt in Zijn grote kracht? Ik ben het, Die in gerechtigheid spreek, Die machtig ben om te verlossen. Waarom bent U rood aan Uw gewaad, en Uw kleren als van iemand die in de wijnpers treedt? Ik heb de pers alleen getreden, en er was niemand van de volken met Mij; en Ik heb hen getreden in Mijn toorn, en heb hen vertrapt in Mijn grimmigheid; en hun bloed is gesprenkeld op Mijn kleren, en heel Mijn gewaad heb Ik bezoedeld.", "Jes 7:8-16": "Maar Damaskus zal het hoofd van Syrië zijn, en Rezin het hoofd van Damaskus; en over nog vijfenzestig jaar zal Efraïm verbroken worden, zodat het geen volk meer is. Ondertussen zal Samaria het hoofd van Efraïm zijn, en de zoon van Remalia het hoofd van Samaria. Als u niet gelooft, zult u zeker niet standhouden. En de HEERE ging verder met spreken tegen Achaz, en zei:", "Jes 11:14": "Maar zij zullen op de schouder van de Filistijnen vliegen naar het westen, en zij zullen samen die van het oosten beroven; aan Edom en Moab zullen zij hun handen slaan, en de kinderen van Ammon zullen hun gehoorzaam zijn.", "Jer 14:18": "Als ik uitga naar het veld, zie ik daar de verslagenen van het zwaard, en als ik in de stad kom, zie ik daar de zieken van honger! Ja, zowel de profeten als de priesters trekken rond in het land, en weten geen raad.", "Ps 59:7": "Tegen de avond keren zij terug, zij tieren als een hond, en gaan rond om de stad.", "Jes 1:1": "Het visioen van Jesaja, de zoon van Amoz, dat hij zag over Juda en Jeruzalem, in de dagen van Uzzia, Jotham, Achaz en Hizkia, de koningen van Juda.", "Ps 90:3": "U doet de mens wederkeren tot verbrijzeling, en zegt: Keer weder, mensenkinderen!", "Openb 19:18": "Opdat u eet het vlees van de koningen, en het vlees van de aanvoerders over duizend, en het vlees van de sterken, en het vlees van de paarden en van hen die daarop zitten; en het vlees van alle vrijen en dienstknechten, en kleinen en groten.", "Jes 33:3": "Van het geluid van het rumoer zullen de volken wegvluchten; van Uw verhoging zullen de heidenvolken verstrooid worden.", "Ps 59:8": "Zie, zij storten overvloedig uit met hun mond; zwaarden zijn op hun lippen; want wie hoort het?", "Jer 25:20": "En de hele gemengde volksmassa, en alle koningen van het land van Uz; en alle koningen van het land van de Filistijnen, en Askelon, en Gaza, en Ekron, en het overblijfsel van Asdod;", "Job 31:29": "Als ik verblijd ben geweest in de verdrukking van mijn haters, en mij opgewekt heb, als het kwaad hem vond;", "Spr 19:11": "Het verstand van de mens vertraagt zijn toorn; en zijn sieraad is een overtreding voorbij te gaan.", "Jer 32:17": "Ach, Heere HEERE! Zie, U hebt de hemel en de aarde gemaakt, door Uw grote kracht en door Uw uitgestrekte arm; niets is voor U te wonderlijk.", "Spr 27:4": "Grimmigheid en overloping van toorn is wreedheid; maar wie zal voor jaloezie standhouden?", "Jer 49:23-27": "Tegen Damaskus. Beschaamd is Hamath en Arpad; omdat zij een slecht gerucht gehoord hebben, zijn zij gesmolten; bij de zee is bekommernis, men kan er niet rusten. Damaskus is slap geworden, zij heeft zich omgekeerd om te vluchten, en siddering heeft haar aangegrepen; benauwdheid en smarten als van een barende vrouw hebben haar bevangen; Hoe is de beroemde stad niet gelaten, de stad van mijn vrolijkheid!", "Spr 16:29": "Een man van geweld verlokt zijn naaste, en hij leidt hem op een weg die niet goed is.", "Ps 2:4": "Die in de hemel woont, zal lachen; de Heere zal hen bespotten.", "Job 15:35": "Zij ontvangen moeite, en baren ijdelheid, en hun buik richt bedrog aan.", "Jer 19:7-9": "Want Ik zal de raad van Juda en Jeruzalem in deze plaats verijdelen, en zal hen voor het aangezicht van hun vijanden doen vallen door het zwaard, en door de hand van hen die hun ziel zoeken; en Ik zal hun dode lichamen aan het gevogelte van de hemel en het gedierte van de aarde tot voedsel geven. En Ik zal deze stad zetten tot een ontzetting en tot een aanfluiting; ieder die haar voorbijgaat, zal zich ontzetten en fluiten over al haar plagen. En Ik zal hun het vlees van hun zonen en het vlees van hun dochters doen eten, en zij zullen eten, ieder het vlees van zijn naaste, in de belegering en in de benauwing, waarmee hun vijanden, en zij die hun ziel zoeken, hen benauwen zullen.", "Ezech 25:14": "En Ik zal Mijn wraak brengen over Edom, door de hand van Mijn volk Israël; en zij zullen tegen Edom handelen naar Mijn toorn en naar Mijn grimmigheid; zo zullen zij Mijn wraak leren kennen, spreekt de Heere HEERE.", "Neh 4:7-23": "En het gebeurde, toen Sanballat, Tobia, de Arabieren, de Ammonieten en de Asdodieten hoorden dat het herstel van de muren van Jeruzalem vorderde, dat de scheuren begonnen dichtgemaakt te worden, dat zij erg boos werden. En zij maakten allen samen een verbond om te komen strijden tegen Jeruzalem en er verwarring te stichten. Maar wij baden tot onze God, en zetten wacht tegen hen, dag en nacht, vanwege hen.", "Ef 4:26": "Word toornig, en zondig niet; laat de zon niet ondergaan over uw toorn;", "Ps 83:16": "vervolg hen zo met Uw onweer, en verschrik hen met Uw storm.", "Matt 6:15": "Maar als u de mensen hun misdaden niet vergeeft, zal ook uw Vader uw misdaden niet vergeven.", "Ps 148:8": "Vuur en hagel, sneeuw en damp; stormwind, die Zijn woord doet!", "Spr 25:28": "Een man die zijn geest niet weerhouden kan, is een opengebroken stad zonder muur.", "1 Kron 20:3": "Hij bracht ook al het volk dat daarin was naar buiten, en hij zaagde hen met de zaag, en met ijzeren dorswagens, en met bijlen; en zo deed David met al de steden van de kinderen Ammons. Toen keerde David met al het volk terug naar Jeruzalem.", "2 Sam 2:26": "Toen riep Abner naar Joab en zei: Zal het zwaard dan eeuwig verslinden? Weet u niet, dat het uiteindelijk bitterheid zal zijn? En hoe lang zal het duren voordat u het volk zegt dat zij terugkeren van hun broeders te vervolgen?", "Jer 47:1": "Het woord van de HEERE dat gebeurde tot de profeet Jeremia, tegen de Filistijnen; voordat Farao Gaza sloeg.", "Nahum 2:10": "Zij is geledigd, ja, uitgeledigd, uitgeput, en haar hart smelt weg, en de knieën schudden, en in alle lenden is smart, en aller aangezichten worden bleek, als een pot.", "Jer 5:22": "Zult u Mij niet vrezen? spreekt de HEERE; zult u voor Mijn aangezicht niet beven? Ik heb het zand tot een grens voor de zee gesteld, met een eeuwige verordening, zodat zij daar niet overheen zal gaan; al bewegen haar golven zich, toch zullen zij niets vermogen, al bruisen zij, toch zullen zij daar niet overheen gaan.", "Spr 19:19": "Die groot is van grimmigheid, zal straf dragen; want als u hem redt, zult u het nog moeten herhalen.", "Jer 49:7-22": "Tegen Edom zegt de HEERE van de heerscharen zo: Is er dan geen wijsheid meer te Theman? Is de raad vergaan van de verstandigen? Is hun wijsheid onnut geworden? Vlucht, keer u om, woon in diepe plaatsen, inwoners van Dedan! want Ik heb Ezaus verderf over hem gebracht, de tijd waarop Ik hem bezocht heb. Als er wijnoogsters tot u gekomen waren, zouden zij niet een nalezing hebben overgelaten? Als er dieven bij nacht gekomen waren, zouden zij niet verwoest hebben zoveel hun genoeg was?", "Ezech 25:5": "En Ik zal Rabba tot een kameelstal maken, en de kinderen van Ammon tot een schaapskooi; en u zult weten dat Ik de HEERE ben.", "Ps 137:7": "HEERE! Gedenkt aan de kinderen van Edom, aan de dag van Jeruzalem; die zeiden: Maak het met de grond gelijk, maak het met de grond gelijk, tot aan haar fundament toe!", "2 Kon 6:24": "En het gebeurde daarna, dat Benhadad, de koning van Syrië, zijn hele leger verzamelde, en optrok, en Samaria belegerde.", "2 Kron 16:9": "Want wat de HEERE betreft, Zijn ogen doorlopen de hele aarde, om Zich sterk te bewijzen aan hen wier hart volkomen is tot Hem; hierin heeft u dwaas gedaan; want van nu af zullen er oorlogen tegen u zijn.", "Ps 74:15": "U hebt een bron en beek gekliefd; U hebt sterke rivieren uitgedroogd.", "Job 11:10": "Als Hij voorbijgaat, om af te snijden of te vergaderen, wie zal Hem dan tegenhouden?", "Amos 7:14": "Toen antwoordde Amos, en zei tegen Amazia: Ik was geen profeet, en ik was geen profetenzoon; maar ik was een ossenherder, en verzamelde wilde vijgen.", "Matt 10:28": "En weest niet bang voor hen die het lichaam doden, en de ziel niet kunnen doden; maar vreest veel meer Hem, Die zowel ziel als lichaam kan verderven in de hel.", "Gen 3:15": "En Ik zal vijandschap zetten tussen u en de vrouw, en tussen uw nageslacht en haar Nageslacht; Dat zal u de kop vermorzelen, en u zult Het de hiel vermorzelen.", "Ex 3:1": "Mozes hoedde de kudde van Jethro, zijn schoonvader, de priester in Midian; en hij leidde de kudde tot voorbij de woestijn, en hij kwam aan de berg van God, aan Horeb.", "Job 36:22": "Zie, God verhoogt door Zijn kracht; wie is een Leraar zoals Hij?", "Jer 46:3-12": "Rust het schild en de rondas toe, en nadert tot de strijd! Spant de paarden aan, en klimt op, ruiters! En stelt u op met helmen; veegt de speren, trekt de pantsers aan! Waarom zie Ik, dat zij versaagd en achterwaarts gedreven zijn? Zelfs hun helden zijn verslagen, en nemen de vlucht, en zien niet om; er is schrik van rondom, spreekt de HEERE.", "Spr 29:22": "Een toornig man verwekt ruzie; en de driftige is overvloedig in overtreding.", "Mark 15:10": "(Want hij wist dat de overpriesters Hem uit afgunst overgeleverd hadden.)", "Matt 1:8": "en Asa verwekte Josafat, en Josafat verwekte Joram, en Joram verwekte Uzzia;", "Obadja 1:11": "Op de dag dat u tegenover hem stond, op de dag dat vreemden zijn leger gevangen wegvoerden, en buitenlanders zijn poorten binnentrokken, en over Jeruzalem het lot wierpen, was u ook als een van hen.", "2 Kron 25:8": "Maar als u toch gaat, doe het dan, wees sterk voor de strijd; God zal u laten vallen voor de vijand; want in God is kracht om te helpen en om te doen vallen.", "1 Kor 1:27": "Maar het dwaze van de wereld heeft God uitverkoren, opdat Hij de wijzen beschamen zou; en het zwakke van de wereld heeft God uitverkoren, opdat Hij het sterke zou beschamen;", "Ef 4:27": "En geef de duivel geen plaats.", "Jes 44:27": "Die tot de diepte zegt: Verdroog, en uw rivieren zal Ik doen verdrogen.", "Obadja 1:15": "Want de dag van de HEERE is nabij, over alle heidenvolken; zoals u gedaan hebt, zal u gedaan worden; uw vergelding zal op uw eigen hoofd terugkeren.", "Ezech 25:1-11": "En het woord van de HEERE gebeurde tot mij, en Hij zei: Mensenkind! Zet uw gezicht tegen de kinderen van Ammon, en profeteer tegen hen; En zeg tegen de kinderen van Ammon: Hoor het woord van de Heere HEERE: Zo zegt de Heere HEERE: Omdat u gezegd hebt: Ha! over Mijn heiligdom, toen het ontheiligd werd, en over het land van Israël, toen het verwoest werd, en over het huis van Juda, toen zij in gevangenschap gingen;", "Ps 64:3-7": "Verberg mij voor de heimelijke afspraken van de boosdoeners, voor het oproer van de werkers van ongerechtigheid. Die hun tong scherpen als een zwaard, een bitter woord richten als hun pijl; Om in verborgen plaatsen de oprechte te schieten; haastig schieten zij naar hem, en vrezen niet.", "Jes 59:4-7": "Er is niemand die om gerechtigheid roept, en niemand die zich voor de waarheid in het gericht begeeft; zij vertrouwen op ijdelheid en spreken leugen; met moeite zijn zij zwanger, en zij baren ongerechtigheid. Zij broeden basiliskuseieren uit, en zij weven spinnenwebben; wie van hun eieren eet, moet sterven, en als het in stukken gedrukt wordt, barst er een adder uit. Hun webben deugen niet tot kleding, en zij zullen zichzelf niet kunnen bedekken met hun werken; hun werken zijn werken van ongerechtigheid, en een daad van geweld is in hun handen.", "Ps 77:19": "Het geluid van uw donder was rondom; de bliksemen verlichtten de wereld; de aarde werd beroerd en daverde.", "Luk 1:49": "Want grote dingen heeft Hij, Die machtig is, aan mij gedaan, en heilig is Zijn Naam.", "Num 23:20": "Zie, ik heb opdracht ontvangen om te zegenen; omdat Hij zegent, zal ik het niet terugdraaien.", "Spr 17:14": "Het begin van het krakeel is als iemand die het water opening geeft; laat daarom de twist varen, voordat hij losbarst.", "2 Kon 13:25": "Joas nu, de zoon van Joahaz, nam de steden weer in, uit de hand van Benhadad, de zoon van Hazaël, die hij uit de hand van Joahaz, zijn vader, in de oorlog genomen had; Joas sloeg hem driemaal, en bracht de steden aan Israël weer terug.", "Zach 8:17": "En denk niet, de een over de ander, kwaad in uw hart; en heb een valse eed niet lief; want al deze dingen zijn wat Ik haat, spreekt de HEERE.", "1 Kron 29:12": "En rijkdom en eer komen van Uw aangezicht, en U heerst over alles; en in Uw hand is kracht en macht; ook staat het in Uw hand om alles groot te maken en sterk te maken.", "1 Kron 29:11": "Van U, o HEERE, is de grootheid, en de macht, en de heerlijkheid, en de overwinning, en de majesteit; want alles wat in de hemel en op aarde is, is van U: van U, o HEERE, is het Koninkrijk, en U hebt Uzelf verhoogd tot een Hoofd boven alles.", "Spr 30:14": "Een geslacht wiens tanden zwaarden zijn, en wiens baktanden messen zijn, om de ellendigen van de aarde en de behoeftigen onder de mensen te verslinden.", "Ps 97:3-5": "Een vuur gaat voor Zijn aangezicht heen, en het steekt Zijn tegenstanders rondom in brand. Zijn bliksems verlichten de wereld; het aardrijk ziet ze en het beeft. De bergen smelten als was voor het aangezicht van de HEERE, voor het aangezicht van de Heere van de hele aarde.", "Amos 1:3-5": "Zo zegt de HEERE: Om drie overtredingen van Damaskus, en om vier zal Ik dat niet afwenden; omdat zij Gilead met ijzeren dorswagens hebben gedorst. Daarom zal Ik een vuur in het huis van Hazaël zenden, dat zal de paleizen van Benhadad verteren. En Ik zal de grendel van Damaskus verbreken, en zal de inwoner uitroeien uit Bikeat-aven, en hem die de scepter houdt, uit Beth-eden; en het volk van Syrië zal als gevangenen worden weggevoerd naar Kir, zegt de HEERE.", "Klaagl 4:22": "Thau. Uw ongerechtigheid heeft een einde, o dochter van Sion! Hij zal u niet meer gevangen laten wegvoeren; maar uw ongerechtigheid, o dochter van Edom! zal Hij bezoeken; Hij zal uw zonden aan het licht brengen.", "Hos 14:1": "Samaria zal woest worden, want zij is opstandig geweest tegen haar God; zij zullen door het zwaard vallen, hun kinderen zullen verpletterd, en hun zwangere vrouwen zullen opengesneden worden.", "Amos 1:6-8": "Zo zegt de HEERE: Om drie overtredingen van Gaza, en om vier zal Ik dat niet afwenden; omdat zij Mijn volk als gevangenen hebben weggevoerd, met een volledige wegvoering, om aan Edom over te leveren. Daarom zal Ik een vuur zenden in de muur van Gaza, dat zal haar paleizen verteren. En Ik zal de inwoner uitroeien uit Asdod, en hem die de scepter houdt, uit Askelon; en Ik zal Mijn hand keren tegen Ekron, en het overblijfsel van de Filistijnen zal vergaan, zegt de Heere HEERE.", "Jer 49:7": "Tegen Edom zegt de HEERE van de heerscharen zo: Is er dan geen wijsheid meer te Theman? Is de raad vergaan van de verstandigen? Is hun wijsheid onnut geworden?", "Ps 104:7": "Van Uw dreigen vluchtten zij, zij haastten zich weg voor de stem van uw donder.", "Obadja 1:10-14": "Om het geweld, gepleegd tegen uw broeder Jakob, zal schaamte u bedekken; en u zult voor eeuwig worden uitgeroeid. Op de dag dat u tegenover hem stond, op de dag dat vreemden zijn leger gevangen wegvoerden, en buitenlanders zijn poorten binnentrokken, en over Jeruzalem het lot wierpen, was u ook als een van hen. U had niet moeten kijken naar de dag van uw broeder, de dag van zijn vervreemding; en u had zich niet moeten verblijden over de kinderen van Juda, op de dag van hun ondergang; en u had uw mond niet groot moeten maken, op de dag van de benauwdheid;", "Jes 46:10": "Die vanaf het begin aan verkondigt het einde, en van oudsher af die dingen, die nog niet gebeurd zijn; Die zegt: Mijn raad zal standhouden, en Ik zal al Mijn welbehagen doen.", "Job 5:19": "In zes benauwdheden zal Hij u verlossen, en in de zevende zal het kwaad u niet aanraken.", "Ezech 28:26": "En zij zullen daarin zeker wonen, en huizen bouwen, en wijngaarden planten; ja, zij zullen zeker wonen; wanneer Ik gerichten zal hebben geoefend tegen allen die hen beroofd hebben, van degenen die rondom hen zijn; en zij zullen weten dat Ik, de HEERE, hun God ben.", "2 Kon 15:16": "Toen sloeg Menahem Tifsah, met allen die daarin waren, ook haar gebied vanaf Thirza af; omdat men niet voor hem had opengedaan, sloeg hij hen; al haar zwangere vrouwen sneed hij open.", "Jes 17:13": "De naties zullen wel ruisen, zoals grote wateren ruisen; maar Hij zal het bestraffen, zo zal het ver wegvluchten, ja, het zal opgejaagd worden als het kaf van de bergen voor de wind, en als een bal voor de wervelwind.", "Ps 66:3": "Zegt tot God: Hoe ontzagwekkend bent U in Uw werken! Om de grootheid van Uw sterkte zullen Uw vijanden zich geveinsd aan U onderwerpen.", "Gen 27:37-40": "Toen antwoordde Izak, en zei tegen Ezau: Zie, ik heb hem tot een heer over u gesteld, en al zijn broers heb ik hem tot knechten gegeven; en ik heb hem met koren en most ondersteund; wat zal ik dan nu voor u doen, mijn zoon? En Ezau zei tegen zijn vader: Hebt u maar deze ene zegen, mijn vader? Zegen mij, ook mij, mijn vader! En Ezau verhief zijn stem, en weende. Toen antwoordde zijn vader Izak en zei tegen hem: Zie, de vettigheden van de aarde zullen uw woningen zijn, en van de dauw van de hemel van boven af zult u gezegend zijn.", "Rom 4:21": "En was ten volle verzekerd, dat wat beloofd was, Hij ook machtig was te doen.", "Spr 29:8": "Spotters brengen een stad in vuur en vlam; maar de wijzen keren de toorn af.", "1 Sam 25:2": "En er was een man te Maon, en zijn bedrijf was te Karmel; en die man was zeer groot, en hij had drieduizend schapen, en duizend geiten; en hij was bezig met het scheren van zijn schapen te Karmel.", "Jer 47:3": "Vanwege het geluid van het geklater van de hoeven van zijn sterke paarden, vanwege het geraas van zijn wagens, en het bulderen van zijn raderen; de vaders zien niet om naar de kinderen, vanwege de slapheid van de handen;", "2 Sam 5:11": "En Hiram, de koning van Tyrus, zond boden naar David, en cederhout, en timmerlieden, en metselaars; en zij bouwden David een huis.", "Job 26:14": "Zie, dit zijn nog maar de uiterste randen van Zijn wegen; en wat een klein stukje van de zaak hebben wij van Hem gehoord? Wie zou dan de donder van Zijn machtige daden kunnen begrijpen?", "2 Kor 12:20": "Want ik vrees dat ik, als ik gekomen zal zijn, u niet zal vinden zoals ik wil, en dat ik door u gevonden zal worden zoals u niet wilt; dat er niet op enigerlei wijze twisten, jaloezie, toorn, ruzie, kwaadsprekerij, gefluister, opgeblazenheid, wanordelijkheden zijn;", "Joz 10:16-27": "Maar die vijf koningen waren gevlucht, en hadden zich verborgen in de grot bij Makkeda. En aan Jozua werd gemeld: Die vijf koningen zijn gevonden, verborgen in de grot bij Makkeda. Toen zei Jozua: Rol grote stenen voor de opening van de grot, en zet mannen ervoor om hen te bewaken."}, "noten": {}, "koppeling": {"1": "<span class=\"wl\" data-l=\"L1\" data-code=\"H1697\">De</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H1697\">woorden</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H1697\">van</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H5986\">Amos</span>, <span class=\"wl\" data-l=\"L3\" data-code=\"H834\">die</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H5349\">onder</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H5349\">de</span> <span class=\"wl\" data-l=\"L4\ // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.Berea[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.Berea[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (Berea)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);

    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function paneelInhoud(n, tab) {

    if (!heeftB && !heeftK) return '<em>Nog geen woordkoppeling voor dit vers.</em>';
    let h = '';
    if (heeftB) h += `<div class="tsk-kop">Berea</div>` +
      `<div class="gw-tekst" style="font-family:Georgia,serif;line-height:1.8">${D.koppeling[n]}</div>` +
      `<div class="gw-detail" style="margin-top:.5rem"></div>`;
    if (heeftK) h += `<div class="tsk-kop" style="margin-top:.9rem">KJV</div>` +
      `<div class="gw-tekst" style="font-family:Georgia,serif;line-height:1.8">${D.koppeling_kjv[n]}</div>` +
      `<div class="gw-detail" style="margin-top:.5rem"></div>`;
    return h + '<div class="bronregel">Klik op een onderstreept woord voor de vindplaatsen.</div>';
  }
  if (tab === 'vertalingen') {
    return PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>

        i.refs.map(r => `<a class="refchip" data-ref="${r}">${r}</a>`).join('') + '</div>').join('');
    }
    if (engels && engels.length) {
      h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    }
    return h;
  }

    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;

    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;

}
function renderPaneel(n) {

  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>

function toggle(n) {

  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.Berea[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · Berea</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}
</script>
</body>
</html>
