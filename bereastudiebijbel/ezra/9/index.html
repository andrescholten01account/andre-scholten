en ik ingewijd, zowel verzadigd te zijn als honger te lijden, zowel overvloed te hebben als gebrek te lijden.", "Lev 10:17": "Waarom hebt u dat zondoffer niet gegeten in de heilige plaats? Want het is allerheiligst, en Hij heeft het u gegeven, opdat u de ongerechtigheid van de gemeenschap zou dragen, om voor hen verzoening te doen voor het aangezicht van de HEERE.", "Neh 13:26": "Heeft Salomo, de koning van Israël, daarin niet gezondigd, hoewel er onder veel heidenvolken geen koning was zoals hij, en hij door zijn God bemind was, en God hem tot koning over heel Israël gesteld had? Ook hem lieten de vreemde vrouwen zondigen.", "2 Kon 18:1": "Het gebeurde nu in het derde jaar van Hosea, de zoon van Ela, de koning van Israël, dat Hizkia koning werd, de zoon van Achaz, koning van Juda.", "Matt 6:14": "Want als u de mensen hun misdaden vergeeft, zal uw hemelse Vader ook u vergeven.", "Ps 121:4": "Zie, de Bewaarder van Israël zal niet sluimeren, ook niet slapen.", "1 Joh 3:10": "Hierin zijn de kinderen van God en de kinderen van de duivel openbaar. Ieder die de rechtvaardigheid niet doet, is niet uit God; en ook wie zijn broeder niet liefheeft,", "1 Kor 10:13": "U heeft geen verzoeking overvallen dan een menselijke; en God is getrouw, Die niet zal toelaten dat u verzocht wordt boven wat u kunt dragen; maar Hij zal met de verzoeking ook de uitkomst geven, zodat u het kunt verdragen.", "Dan 9:16-19": "O Heere! naar al Uw gerechtigheden, laat toch Uw toorn en Uw grimmigheid afgekeerd worden van Uw stad Jeruzalem, Uw heilige berg; want om onze zonden en om de ongerechtigheden van onze vaderen zijn Jeruzalem en Uw volk tot smaad bij allen die rondom ons zijn. En nu, o onze God! hoor naar het gebed van Uw knecht, en naar zijn smekingen; en doe Uw aangezicht lichten over Uw heiligdom, dat verwoest is; om de Heere zelf. Neig Uw oor, mijn God! en hoor, doe Uw ogen open, en zie onze verwoestingen, en de stad die naar Uw Naam genoemd is; want wij leggen onze smekingen niet voor Uw aangezicht neer om onze gerechtigheden, maar om Uw barmhartigheden, die groot zijn.", "Spr 4:16": "Want zij slapen niet, als zij geen kwaad gedaan hebben; en hun slaap wordt weggenomen, als zij niemand hebben doen struikelen.", "2 Kon 21:11": "Omdat Manasse, de koning van Juda, deze gruwelen gedaan heeft, erger doend dan alles wat de Amorieten gedaan hebben die vóór hem geweest zijn, ja, ook Juda door zijn drekgoden heeft doen zondigen;", "1 Kron 21:17": "En David zei tegen God: Ben ik het niet, die gezegd heb, dat men het volk tellen zou? Ja, ik zelf ben het, die gezondigd en zeer kwalijk gehandeld heb; maar deze schapen, wat hebben die gedaan? O HEERE, mijn God, laat toch Uw hand tegen mij zijn, en tegen het huis van mijn vader, maar niet tegen Uw volk ter plaag.", "Lev 26:41": "Dat Ik ook tegen hen in gewandeld heb, en hen in het land van hun vijanden gebracht heb. Als dan hun onbesneden hart gebogen wordt, en zij dan de straf voor hun ongerechtigheid aanvaarden;", "Hand 8:23": "Want ik zie dat u bent in een geheel bittere gal en in de samenknoping van ongerechtigheid.", "Rom 11:29": "Want de genadegiften en de roeping van God zijn onberouwelijk.", "Kol 1:21": "En u, die eertijds vervreemd was en vijanden door het verstand in de boze werken, heeft Hij nu ook verzoend,", "Deut 32:15": "Toen Jeschurun vet werd, sloeg hij achteruit (u bent vet geworden, u bent dik geworden, ja, met vet overdekt geworden!); en hij liet God varen, Die hem gemaakt heeft, en versmaadde de Rotssteen van zijn heil.", "2 Sam 23:7": "maar ieder die ze zal aantasten, voorziet zich met ijzer en het hout van een speer; en zij zullen helemaal met vuur verbrand worden, op dezelfde plaats.", "Jer 2:31": "Geslacht, let toch op het woord van de HEERE! Ben Ik Israël een woestijn geweest, of een land van de uiterste donkerheid? Waarom zegt Mijn volk dan: Wij zijn heren, wij zullen niet meer tot U komen?", "Jes 64:12": "HEERE! zou U Zich hierover inhouden, zou U zwijgen, en ons zozeer bedrukken?", "Jer 29:17-19": "Zo zegt de HEERE van de heerscharen: Ziet, Ik zal het zwaard, de honger en de pest onder hen zenden; en Ik zal hen maken als de afschuwelijke vijgen, die vanwege hun slechtheid niet gegeten kunnen worden. En Ik zal hen achtervolgen met het zwaard, met de honger en met de pest; en Ik zal hen overgeven aan een verschrikking, in al de koninkrijken van de aarde, tot een vloek, en tot een schrik, en tot een aanfluiting, en tot een smaad, onder al de volken waarheen Ik hen zal hebben verdreven; Omdat zij naar Mijn woorden niet geluisterd hebben, spreekt de HEERE, toen Ik Mijn knechten, de profeten, tot hen zond, vroeg opstaand en zendend; maar u hebt niet geluisterd, spreekt de HEERE.", "Jes 12:1": "En diezelfde dag zult u zeggen: Ik dank U, HEERE! Dat U toornig op mij geweest bent, maar Uw toorn is afgekeerd, en U troost mij.", "Zach 3:4": "Toen antwoordde Hij, en sprak tot hen die voor Zijn aangezicht stonden: Doe deze vuile kleren van hem weg. Daarna sprak Hij tot hem: Zie, Ik heb uw ongerechtigheid van u weggenomen, en Ik zal u stellen (extra) kleren aandoen.", "Ps 143:4": "Daarom wordt mijn geest overstelpt in mij, mijn hart is verbaasd in het midden van mij.", "Jer 14:17": "Daarom zult u dit woord tegen hen zeggen: Mijn ogen zullen van tranen neerdalen, nacht en dag, en niet ophouden; want de jonkvrouw, de dochter van Mijn volk, is gebroken met een grote breuk, een plaag die zeer smartelijk is.", "Spr 13:22": "De goede zal zijn kindskinderen doen erven; maar het vermogen van de zondaar is voor de rechtvaardige weggelegd.", "Openb 15:3": "En zij zongen het gezang van Mozes, de dienstknecht van God, en het gezang van het Lam, en zeiden: Groot en wonderlijk zijn Uw werken, Heere, Gij almachtige God, rechtvaardig en waarachtig zijn Uw wegen, Gij Koning der heiligen!", "Jer 2:19": "Uw boosheid zal u kastijden, en uw afkeringen zullen u straffen; weet dan en zie, dat het kwaad en bitter is, dat u de HEERE, uw God, verlaat, en Mijn vreze niet bij u is, spreekt de Heere, de HEERE van de heerscharen.", "Joh 3:18-20": "Wie in Hem gelooft, wordt niet veroordeeld, maar wie niet gelooft, is al veroordeeld, omdat hij niet geloofd heeft in de Naam van de eniggeboren Zoon van God. En dit is het oordeel: dat het licht in de wereld gekomen is, en de mensen hebben de duisternis liever gehad dan het licht; want hun werken waren slecht. Want ieder die kwaad doet, haat het licht en komt niet tot het licht, opdat zijn werken niet bestraft worden.", "Job 7:20": "Heb ik gezondigd, wat zal ik U doen, o Mensenhoeder? Waarom hebt U mij tot een mikpunt voor Uzelf gesteld, dat ik mijzelf tot een last ben?", "Deut 12:31": "Zo zult u niet doen voor de HEERE, uw God; want alles wat de HEERE een gruwel is, dat Hij haat, hebben zij voor hun goden gedaan; want zij hebben zelfs hun zonen en hun dochters met vuur verbrand voor hun goden.", "Ps 58:4-6": "De goddelozen zijn vervreemd van de moederschoot af; de leugensprekers dolen van de moederbuik af. Zij hebben vurig gif, gelijk vurig slangengif; zij zijn als een dove adder, die zijn oren toestopt, opdat hij niet hoort naar de stem van de bezweerders, van hem die ervaren is in het uitvoeren van bezweringen.", "Ps 85:7": "Zult U ons niet weer levend maken, opdat Uw volk zich in U verblijdt?", "1 Kon 11:39": "En Ik zal om die reden het nageslacht van David vernederen; maar niet voor altijd.", "Ex 4:10": "Toen zei Mozes tegen de HEERE: Och Heere! ik ben geen man die goed kan spreken, niet van gisteren, niet van eergisteren, en ook niet van toen af, toen U tot Uw knecht gesproken hebt; want ik ben zwaar van mond, en zwaar van tong.", "2 Sam 24:16": "Toen nu de engel zijn hand uitstrekte over Jeruzalem om haar te verderven, kreeg de HEERE berouw over dat kwaad, en Hij zei tegen de engel die het verderf onder het volk aanrichtte: Het is genoeg, trek uw hand nu terug. De engel van de HEERE was nu bij de dorsvloer van Arauna, de Jebusiet.", "Ps 131:1": "Een lied Hammaaloth, van David. HEERE, mijn hart is niet hoogmoedig, en mijn ogen zijn niet trots; ook heb ik niet gestreefd naar dingen die mij te groot en te wonderlijk zijn.", "Ps 66:10-12": "Want U hebt ons beproefd, o God! U hebt ons gelouterd, zoals men zilver loutert; U had ons in het net gebracht; U had een engs band om onze lenden gelegd; U had de mens over ons hoofd laten rijden; wij waren in het vuur en in het water gekomen; maar U hebt ons uitgevoerd naar een overvloeiende verversing.", "Ps 111:3": "He. Zijn doen is majesteit en heerlijkheid; Vau. en Zijn gerechtigheid bestaat in eeuwigheid.", "Jer 12:1": "Ú zou rechtvaardig zijn, HEERE, wanneer ik tegen U zou twisten; ik zal echter over Uw oordelen met U spreken; waarom is de weg van de goddelozen voorspoedig, waarom hebben zij rust, allen die trouweloos trouweloosheid bedrijven?", "Matt 24:15": "Wanneer u dan de gruwel van de verwoesting zal zien, waarvan gesproken is door Daniël de profeet, staande op de heilige plaats (die het leest, laat hij daarop letten!),", "Spr 22:10": "Jaag de spotter weg, en het gekijf zal weggaan, en het geschil met de schande zal ophouden.", "Ex 22:27": "want dat is zijn enige bedekking, het is zijn kleding voor zijn huid; waarin zou hij anders slapen? Het zal dan gebeuren, wanneer hij tot Mij roept, dat Ik hem zal horen; want Ik ben genadig!", "Jer 5:10": "Beklim haar muren, en verwoest ze (maar maak er geen einde aan); haal haar tinnen weg, want zij zijn niet van de HEERE.", "Jer 33:26": "Dan zou Ik ook het nageslacht van Jakob en van Mijn knecht David verwerpen, zodat Ik van zijn nageslacht niemand zou nemen die heerst over het nageslacht van Abraham, Izak en Jakob; want Ik zal hun gevangenschap wenden en Mij over hen ontfermen.", "Zach 10:6": "En Ik zal het huis van Juda versterken, en het huis van Jozef zal Ik behouden, en Ik zal hen weer terugzetten; want Ik heb Mij over hen ontfermd, en zij zullen zijn alsof Ik hen niet verstoten had; want Ik ben de HEERE, hun God, en Ik zal hen verhoren.", "Deut 18:12": "Want ieder die zulke dingen doet, is de HEERE een gruwel; en om deze gruwelen verdrijft de HEERE, uw God, hen voor uw aangezicht uit hun bezit.", "Matt 24:12": "En omdat de ongerechtigheid zal toenemen, zal de liefde van velen verkillen.", "Spr 20:7": "De rechtvaardige wandelt steeds in zijn oprechtheid; gelukkig zijn zijn kinderen na hem.", "Deut 20:17": "Maar u zult ze helemaal verbannen: de Hethieten, en de Amorieten, en de Kanaänieten, en de Ferezieten, de Hevieten, en de Jebusieten, zoals de HEERE, uw God, u geboden heeft;", "Jer 4:2": "Maar zweer: Zo waarachtig als de HEERE leeft! in waarheid, in recht en in gerechtigheid; dan zullen de heidenvolken zich in Hem zegenen, en zich in Hem beroemen.", "Joh 8:24": "Ik heb u dan gezegd, dat u in uw zonden zult sterven; want als u niet gelooft dat Ik Die ben, zult u in uw zonden sterven.", "Ezech 6:9": "Dan zullen wie van u ontkomen waren aan Mij denken onder de heidenvolken, waarheen zij gevankelijk zullen worden weggevoerd, omdat Ik verbroken ben door hun hoerachtige hart, dat van Mij afgeweken is, en door hun ogen, die hun drekgoden nahoereren; en zij zullen een walging aan zichzelf hebben over de slechte daden, die zij in al hun gruwelen gedaan hebben.", "Rom 9:27": "En Jesaja roept over Israël: Al zou het aantal kinderen van Israël zijn als het zand van de zee, toch zal het overblijfsel behouden worden.", "Jes 15:2": "Hij trekt op naar Baith en Dibon, naar de hoogten, om te wenen; over Nebo en over Medeba zal Moab huilen; op al hun hoofden is kaalheid, ieders baard is afgesneden.", "Jes 22:23": "En Ik zal hem als een nagel inslaan op een vaste plaats; en hij zal een stoel van eer zijn voor het huis van zijn vader.", "Luk 1:72": "om barmhartigheid te bewijzen aan onze vaderen, en Zijn heilig verbond te gedenken;", "Klaagl 3:20": "Zain. Mijn ziel denkt er wel terdege aan, en zij buigt zich neer in mij.", "Jes 26:11": "HEERE, is Uw hand verhoogd, zij zien het niet; maar zij zullen het zien, en beschaamd worden, vanwege de ijver over Uw volk, ook zal het vuur Uw tegenstanders verteren.", "Deut 13:8": "dan zult u hem niet ter wille zijn, en niet naar hem horen; ook zal uw oog hem niet ontzien, en u zult zich niet ontfermen, hem ook niet verbergen;", "Ps 61:3": "Van het einde van het land roep ik tot U als mijn hart overstelpt is; leid mij op een rotssteen, die mij te hoog zou zijn.", "Joh 1:27": "Hij is het, Die na mij komt, Die voor mij geworden is, aan Wie ik niet waardig ben Zijn schoenriem te ontbinden.", "Ps 55:18": "'s Avonds, en 's morgens, en 's middags zal ik klagen en getier maken; en Hij zal mijn stem horen.", "Richt 3:6": "namen zij zich van hun dochters tot vrouwen, en gaven hun eigen dochters aan hun zonen; en zij dienden hun goden.", "Micha 6:16": "Want de inzettingen van Omri worden onderhouden, en al het werk van het huis van Achab; en u wandelt in hun raadslagen; opdat Ik u stel tot verwoesting, en haar inwoners tot aanfluiting; zo zult u de smaad van Mijn volk dragen.", "Jes 54:10": "Want bergen zullen wijken, en heuvels wankelen; maar Mijn goedertierenheid zal van u niet wijken, en het verbond van Mijn vrede zal niet wankelen, zegt de HEERE, uw Ontfermer.", "Job 39:38": "Eenmaal heb ik gesproken, maar zal niet antwoorden; of tweemaal, maar zal niet voortvaren.", "Spr 16:6": "Door goedertierenheid en trouw wordt de misdaad verzoend; en door de vreze van de HEERE wijkt men af van het kwade.", "1 Kron 29:14": "Want wie ben ik, en wat is mijn volk, dat wij de macht zouden hebben gekregen om zo vrijwillig te geven als dit? Want het is alles van U, en wij geven het U uit Uw hand.", "Jes 66:2": "Want Mijn hand heeft al deze dingen gemaakt, en al deze dingen zijn geweest, spreekt de HEERE; maar op deze zal Ik zien, op de arme en verslagene van geest, en die voor Mijn woord beeft.", "Hand 17:30": "God dan, Die de tijden van de onwetendheid door de vingers gezien heeft, verkondigt nu aan alle mensen, overal, dat zij zich bekeren.", "Hand 3:12": "En Petrus, die dit zag, antwoordde het volk: Israëlieten, wat verbaast u zich hierover, of wat kijkt u zo strak naar ons, alsof wij door onze eigen kracht of vroomheid deze man hebben laten lopen?", "Ezech 37:11-14": "Toen zei Hij tot mij: Mensenkind! Deze beenderen zijn het gehele huis van Israël; zie, zij zeggen: Onze beenderen zijn verdord, en onze verwachting is verloren, wij zijn afgesneden. Daarom, profeteer en zeg tot hen: Zo zegt de Heere HEERE: Zie, Ik zal uw graven openen en zal u uit uw graven laten opkomen, o Mijn volk! En Ik zal u brengen in het land van Israël. En u zult weten dat Ik de HEERE ben, als Ik uw graven zal hebben geopend, en als Ik u uit uw graven zal hebben laten opkomen, o Mijn volk!", "Jes 1:4-7": "Wee het zondige volk, het volk van zware ongerechtigheid, het nageslacht van de boosdoeners, de verdervende kinderen! Zij hebben de HEERE verlaten, zij hebben de Heilige van Israël gelasterd, zij hebben zich vervreemd, wijkende achterwaarts. Waartoe zou u nog meer geslagen worden? U zou van het afval des te meer maken; het hele hoofd is ziek, en het hele hart is mat. Van de voetzool af tot het hoofd toe is er niets van het geheel gaaf aan hem; maar wonden, en striemen, en etterbuilen, die niet uitgedrukt noch verbonden zijn, en geen daarvan is met olie verzacht.", "Jer 32:30": "Want de kinderen van Israël en de kinderen van Juda hebben van hun jeugd af alleen maar gedaan wat kwaad was in Mijn ogen; want de kinderen van Israël hebben Mij door het werk van hun handen alleen maar vertoornd, spreekt de HEERE.", "Joz 5:15": "Toen zei de Vorst van het leger van de HEERE tegen Jozua: Trek uw schoenen uit van uw voeten; want de plaats waarop u staat, is heilig. En Jozua deed zo.", "Klaagl 5:7": "Onze vaders hebben gezondigd, en zijn er niet meer, en wij dragen hun ongerechtigheden.", "Zach 3:9": "Want zie, aangaande die steen, die Ik gelegd heb voor het aangezicht van Jozua, op die ene steen zullen zeven ogen zijn; zie, Ik zal zijn graveersel graveren, spreekt de HEERE van de heerscharen, en Ik zal de ongerechtigheid van dit land op één dag wegnemen.", "Jer 31:18": "Ik heb wel gehoord dat Efraïm zich beklaagt, en zegt: U hebt mij getuchtigd, en ik ben getuchtigd zoals een ongewend kalf. Bekeer mij, dan zal ik bekeerd zijn, want U bent de HEERE, mijn God!", "Lev 26:44": "En hierboven is dit ook: als zij in het land van hun vijanden zullen zijn, zal Ik hen niet verwerpen, en ook niet van hen walgen, om een einde aan hen te maken en Mijn verbond met hen te vernietigen; want Ik ben de HEERE, hun God!", "Rom 1:17": "Want de rechtvaardigheid van God wordt daarin geopenbaard uit geloof tot geloof; zoals geschreven is: Maar de rechtvaardige zal uit het geloof leven.", "Neh 9:32-34": "Nu dan, o onze God, U grote, U machtige, en U ontzagwekkende God, Die het verbond en de weldadigheid houdt; laat voor Uw aangezicht niet gering zijn al de moeite, die ons getroffen heeft, onze koningen, onze vorsten, en onze priesters; en onze profeten, en onze vaderen, en Uw hele volk, vanaf de dagen van de koningen van Assur tot op deze dag. Doch U bent rechtvaardig, in alles wat ons overkomen is; want U hebt trouw gehandeld, maar wij hebben goddeloos gehandeld. En onze koningen, onze vorsten, onze priesters en onze vaders hebben Uw wet niet gedaan; en zij hebben niet geluisterd naar Uw geboden, en naar Uw getuigenissen, waarmee U tegen hen getuigde.", "Ex 12:31-33": "Toen riep hij Mozes en Aäron in de nacht, en zei: Maakt u op, trekt uit het midden van mijn volk, u en de kinderen van Israël; en gaat heen, dient de HEERE, zoals u gesproken hebt. Neemt ook met u uw schapen en uw runderen, zoals u gesproken hebt, en gaat heen, en zegent mij ook. En de Egyptenaren drongen sterk aan bij het volk, om ze snel uit het land te drijven; want zij zeiden: Wij zijn allen dood!", "Ex 34:13-16": "Maar hun altaren zult u omverwerpen, en hun opgerichte beelden zult u verbreken, en hun gewijde palen zult u afhouwen. (Want u zult zich niet buigen voor een andere god; want de Naam van de HEERE is IJveraar! Een ijverig God is Hij!) Zodat u misschien geen verbond maakt met de inwoner van dat land; en zij hun goden niet nahoereren, noch hun goden offers brengen, en hij u uitnodigt, en u van zijn offer eet.", "Ps 15:4": "In wiens ogen de verworpene veracht is, maar hij eert hen die de HEERE vrezen; heeft hij gezworen tot zijn eigen schade, toch verandert hij niet;", "Deut 32:32": "Want hun wijnstok is uit de wijnstok van Sodom, en uit de velden van Gomorra; hun wijndruiven zijn vergiftige wijndruiven; zij hebben bittere druiventrossen.", "2 Petr 2:19": "zij beloven hun vrijheid, terwijl zijzelf slaven zijn van de verdorvenheid; want door wie iemand overwonnen is, daarvan is hij ook tot een slaaf gemaakt.", "Luk 22:41": "En Hij trok Zich van hen terug, ongeveer een steenworp ver, en knielde neer en bad,", "Jes 56:5": "Ik zal hun ook in Mijn huis en binnen Mijn muren een plaats en een naam geven, beter dan van zonen en dan van dochters; een eeuwige naam zal Ik ieder van hen geven, die niet uitgeroeid zal worden.", "Jes 65:2": "Ik heb Mijn handen uitgebreid, de hele dag, tot een opstandig volk, dat wandelt op een weg die niet goed is, naar hun eigen gedachten.", "Jer 44:14": "Zodat het overblijfsel van Juda, dat in Egypteland gekomen is om daar als vreemdelingen te verblijven, niemand zal hebben die ontkomt of overblijft; namelijk om terug te keren in het land van Juda, waarnaar hun ziel verlangt terug te keren, om daar te wonen; maar zij zullen er niet terugkeren, behalve wie ontkomen zullen.", "Spr 10:23": "Het is voor de dwaas als een spel om iets schandelijks te doen; maar voor een man van verstand, om wijsheid te plegen.", "Hebr 10:37": "want: Nog een heel klein tijdje en Hij, Die komen zal, zal komen, en niet uitblijven.", "Klaagl 1:3-5": "Gimel. Juda is in gevangenschap gegaan vanwege de ellende, en vanwege de veelheid van de dienstbaarheid; zij woont onder de heidenen, zij vindt geen rust; al haar vervolgers achterhalen haar tussen de engten. Daleth. De wegen van Sion treuren, omdat niemand op het feest komt; al haar poorten zijn woest, haar priesters zuchten: haar jonkvrouwen zijn bedroefd, en zij zelf is in bitterheid. He. Haar tegenstanders zijn tot hoofd geworden, haar vijanden hebben rust; omdat de HEERE haar bedroefd heeft, vanwege de veelheid van haar overtredingen; haar kinderen gaan heen in de gevangenschap voor het aangezicht van de tegenstander.", "Ps 89:35": "Ik zal Mijn verbond niet ontheiligen, en wat uit Mijn lippen gegaan is, zal Ik niet veranderen.", "Ps 139:21": "Zou ik niet haten, HEERE, wie U haten? En verdriet hebben over wie tegen U opstaan?", "Micha 7:19": "Hij zal Zich weer over ons ontfermen; Hij zal onze ongerechtigheden dempen; ja, U zult al hun zonden in de diepten van de zee werpen.", "Spr 22:5": "Doornen en strikken liggen op de weg van de verkeerde; wie zijn ziel bewaart, zal zich ver daarvan houden.", "2 Kron 7:14": "En Mijn volk, over wie Mijn Naam genoemd wordt, zich verootmoedigt en bidt, en zij Mijn aangezicht zoeken, en zich bekeren van hun slechte wegen; dan zal Ik uit de hemel horen, en hun zonden vergeven, en hun land genezen.", "Jer 31:37": "Zo zegt de HEERE: Als de hemelen daarboven gemeten, en de fundamenten van de aarde beneden doorgrond kunnen worden, dan zal Ik ook het hele nageslacht van Israël verwerpen, om alles wat zij gedaan hebben, spreekt de HEERE.", "Richt 3:9": "Toen riepen de kinderen van Israël tot de HEERE; en de HEERE verwekte de kinderen van Israël een verlosser, die hen verloste, Othniël, zoon van Kenaz, broer van Kaleb, die jonger was dan hij.", "Num 21:7": "Daarom kwam het volk tot Mozes, en zij zeiden: Wij hebben gezondigd, omdat wij tegen de HEERE en tegen u gesproken hebben; bid tot de HEERE, dat Hij deze slangen van ons wegneemt. Toen bad Mozes voor het volk.", "Jer 4:22": "Zeker, Mijn volk is dwaas, Mij kennen zij niet; het zijn zotte kinderen, en zij hebben geen inzicht; wijs zijn zij om kwaad te doen, maar goed te doen weten zij niet.", "Lev 6:16": "En wat daarvan overblijft, zullen Aäron en zijn zonen eten; ongezuurd zal het gegeten worden, in de heilige plaats; in de voorhof van de tent der samenkomst zullen zij dat eten.", "Ezra 9:1-3": "Toen deze dingen voltooid waren, kwamen de vorsten naar mij toe en zeiden: Het volk van Israël, en de priesters, en de Levieten, hebben zich niet afgezonderd van de volken van deze landen, naar hun gruwelen, namelijk van de Kanaänieten, de Hethieten, de Ferezieten, de Jebusieten, de Ammonieten, de Moabieten, de Egyptenaren en de Amorieten. Want zij hebben van hun dochters genomen voor zichzelf en voor hun zonen, zodat het heilig zaad zich vermengd heeft met de volken van deze landen; ja, de hand van de vorsten en overheden is de eerste geweest in deze overtreding. Toen ik deze zaak hoorde, scheurde ik mijn kleed en mijn mantel; en ik trok het haar van mijn hoofd en van mijn baard uit, en zat verbaasd neer.", "Ps 78:34": "Toen Hij hen doodde, zochten zij Hem, en keerden weer, en zochten God vroeg;", "Ezra 10:18-22": "En er werden gevonden van de zonen van de priesters die vreemde vrouwen bij zich hadden laten wonen: van de zonen van Jesua, de zoon van Jozadak, en zijn broers, Maaseja, en Eliëzer, en Jarib, en Gedalja. En zij gaven hun hand, dat zij hun vrouwen zouden wegsturen; en omdat zij schuldig waren, offerden zij een ram uit de kudde voor hun schuld. En van de kinderen van Immer: Hanani en Zebadja.", "Ps 86:6": "HEERE! neem mijn gebed ter ore, en let op de stem van mijn smekingen.", "2 Kor 12:7": "En opdat ik mij door de overvloed van de openbaringen niet zou verheffen, is mij een scherpe doorn in het vlees gegeven, namelijk een engel van de satan, om mij met vuisten te slaan, opdat ik mij niet zou verheffen.", "Zach 4:6-10": "Toen antwoordde Hij en sprak tegen mij: Dit is het woord van de HEERE tot Zerubbabel: Niet door kracht, ook niet door geweld, maar door Mijn Geest zal het gebeuren, zegt de HEERE van de heerscharen. Wie bent u, o grote berg? Voor het aangezicht van Zerubbabel zult u worden tot een vlak veld; want hij zal de hoofdsteen naar voren brengen onder toeroepingen: Genade, genade zij hem! Het woord van de HEERE kwam verder tot mij:", "Ps 86:13": "Want Uw goedertierenheid is groot over mij; en Gij hebt mijn ziel uit het onderste van het graf gered.", "Joh 8:26": "Ik heb veel te zeggen en te oordelen over u; maar Die Mij gezonden heeft, is waar; en wat Ik van Hem gehoord heb, dat spreek Ik tot de wereld.", "Ps 28:2": "Hoor de stem van mijn smekingen, als ik tot U roep, als ik mijn handen ophef naar het binnenste heiligdom van Uw heiligheid.", "Ps 24:3": "Wie zal klimmen op de berg van de HEERE, en wie zal staan in de plaats van Zijn heiligheid?", "Ps 26:9": "Raap mijn ziel niet weg met de zondaars, en mijn leven niet met de mannen van het bloed;", "Jes 1:23": "Uw vorsten zijn afvalligen, en metgezellen van dieven, ieder van hen heeft geschenken lief, en zij jagen de vergeldingen na; de wezen doen zij geen recht, en de rechtszaak van de weduwen komt voor hen niet.", "Ezech 3:15": "En ik kwam tot de weggevoerden te Tel-Abib, die aan de rivier Chebar woonden, en ik bleef daar zij woonden; ja, ik bleef daar verbaasd in het midden van hen zeven dagen.", "Dan 9:9": "Bij de Heere, onze God, zijn de barmhartigheden en vergevingen, hoewel wij tegen Hem gerebelleerd hebben.", "Ezra 1:1-4": "In het eerste jaar nu van Kores, koning van Perzië, opdat het woord van de HEERE, uit de mond van Jeremia, volbracht werd, wekte de HEERE de geest van Kores, koning van Perzië, op, zodat hij een boodschap liet doorgeven door heel zijn koninkrijk, zelfs ook op schrift, en zei: Zo zegt Kores, koning van Perzië: De HEERE, de God van de hemel, heeft mij alle koninkrijken van de aarde gegeven; en Hij heeft mij opgedragen Hem een huis te bouwen te Jeruzalem, dat in Juda is. Wie is er onder u van al Zijn volk? Zijn God zij met hem, en hij trekt op naar Jeruzalem, dat in Juda is, en hij bouwt het huis van de HEERE, de God van Israël; Hij is de God, Die te Jeruzalem woont.", "Ps 106:42": "En hun vijanden hebben hen verdrukt, en zij zijn vernederd onder hun hand.", "1 Tim 1:10": "De hoereerders, mannen die met mannen omgang hebben, de mensenrovers, de leugenaars, de meinedigen, en al wat verder tegen de gezonde leer ingaat;", "2 Petr 2:21": "Want het zou beter voor hen geweest zijn de weg van de gerechtigheid niet gekend te hebben, dan die gekend te hebben en zich weer af te keren van het heilige gebod dat hun overgeleverd was.", "Ezra 7:6": "Deze Ezra trok op uit Babel; en hij was een vaardig schriftgeleerde in de wet van Mozes, die de HEERE, de God van Israël, gegeven heeft; en de koning gaf hem, naar de hand van de HEERE, zijn God, over hem, al zijn verzoek.", "Jes 52:11": "Vertrek, vertrek, ga daarvandaan weg, raak het onreine niet aan; ga weg uit hun midden, reinig u, u die de voorwerpen van de HEERE draagt!", "Ps 105:42": "Want Hij dacht aan Zijn heilig woord, aan Abraham, Zijn knecht.", "Neh 1:7": "Wij hebben het helemaal tegen U verdorven; en wij hebben niet gehouden de geboden, noch de inzettingen, noch de rechten, die U Uw dienaar Mozes geboden hebt.", "2 Petr 3:9": "De Heere stelt Zijn belofte niet uit (zoals sommigen dat als uitstel zien), maar Hij is geduldig voor ons, omdat Hij niet wil dat er iemand verloren gaat, maar dat allen tot bekering komen.", "Joz 7:8": "Och, Heere! Wat zal ik zeggen, nu Israël voor het aangezicht van zijn vijanden de rug heeft gekeerd?", "Spr 23:20": "Wees niet onder de wijnzuipers, ook niet onder de vleesvreters;", "Openb 18:5": "Want haar zonden zijn de een na de ander gevolgd tot aan de hemel toe, en God is haar ongerechtigheden gaan gedenken.", "1 Kron 23:22": "En Eleazar stierf, en hij had geen zonen, maar dochters; en de kinderen van Kis, hun broeders, namen hen tot vrouw.", "2 Kron 15:4": "Maar toen zij zich in hun nood bekeerden tot de HEERE, de God van Israël, en Hem zochten, werd Hij door hen gevonden.", "Neh 4:3": "En Tobia, de Ammoniet, was bij hem, en zei: Al is het dat zij bouwen, als er een vos opklom, dan zou hij hun stenen muur al kunnen omverhalen.", "Ps 49:21": "De mens, die in aanzien is, en geen verstand heeft, wordt gelijk aan de dieren, die vergaan.", "Num 14:6": "En Jozua, de zoon van Nun, en Kaleb, de zoon van Jefunne, die bij hen waren die dat land verspied hadden, scheurden hun kleren.", "Ps 85:11": "De goedertierenheid en waarheid zullen elkaar ontmoeten; de gerechtigheid en vrede zullen elkaar kussen.", "2 Petr 2:10": "maar vooral hen, die naar het vlees wandelen in onreine begeerte, en het gezag verachten; die vermetel zijn, zichzelf behagen, en die er niet voor terugschrikken de heerlijkheden te lasteren;", "Neh 13:13": "En ik stelde tot schatmeesters over de schatten Selemja, de priester, en Zadok, de schrijver, en Pedaja, uit de Levieten; en aan hun zijde Hanan, de zoon van Zakkur, de zoon van Matthanja; want zij werden betrouwbaar geacht, en hun werd opgelegd het aan hun broeders uit te delen.", "Deut 7:6": "Want u bent een heilig volk voor de HEERE, uw God; u heeft de HEERE, uw God, uitgekozen om Hem een volk van het eigendom te zijn, uit alle volken die op de aardbodem zijn.", "Hab 1:2": "HEERE! Hoe lang schreeuw ik, en U hoort niet, hoe lang roep ik: Geweld! tot U, en U verlost niet!", "Jer 10:24": "Kastijd mij, HEERE! doch met mate; niet in Uw toorn, opdat U mij niet te niet maakt.", "Deut 32:10": "Hij vond hem in een land van de woestijn, en in een woeste huilende wildernis; Hij voerde hem rondom, Hij onderwees hem, Hij bewaarde hem als Zijn oogappel.", "1 Kron 8:8": "En Saharaim verwekte kinderen in het land van Moab (nadat hij zijn vrouwen weggezonden had) uit Husim en Baara, zijn vrouwen;", "Nahum 1:3": "De HEERE is geduldig, maar van grote kracht, en Hij houdt de schuldige zeker niet onschuldig. De weg van de HEERE is in wervelwind en in storm, en de wolken zijn het stof van Zijn voeten.", "2 Kron 30:7": "En wees niet als uw vaders en als uw broeders, die tegen de HEERE, de God van hun vaderen, ontrouw geweest zijn; daarom heeft Hij hen overgegeven tot verwoesting, zoals u ziet.", "Lev 26:40": "Dan zullen zij hun ongerechtigheid belijden, en de ongerechtigheid van hun vaderen met hun overtredingen, waarmee zij tegen Mij overtreden hebben, en ook dat zij tegen Mij in gewandeld hebben.", "Deut 9:13": "Verder sprak de HEERE tot mij en zei: Ik heb dit volk aangemerkt, en zie, het is een hardnekkig volk.", "Ps 106:14": "Maar zij werden belust met begeerte in de woestijn, en zij verzochten God in de wildernis.", "1 Kron 17:17": "En dit is nog klein geweest in Uw ogen, o God! Daarom hebt U over het huis van Uw knecht ook gesproken voor een verre toekomst, en U hebt mij naar menselijke maatstaf voorzien met deze verhoging, o HEERE God!", "Luk 7:3": "En toen hij over Jezus gehoord had, zond hij de oudsten van de Joden naar Hem toe, en vroeg Hem dringend of Hij wilde komen om zijn dienstknecht gezond te maken.", "Spr 6:12-15": "Een nietsnut, een verdorven man, gaat om met een verkeerde mond; hij knipoogt met zijn ogen, spreekt met zijn voeten, wijst met zijn vingers; in zijn hart zijn verkeerdheden, hij smeedt voortdurend kwaad, hij zaait ruzie.", "Hos 2:19": "En Ik zal u aan Mij verloven in geloof; en u zult de Heere kennen.", "Luk 22:44": "En omdat Hij in zware strijd was, bad Hij des te ernstiger. En Zijn zweet werd als grote druppels bloed, die op de aarde afliepen.", "Ps 57:3": "Ik zal roepen tot God, de Allerhoogste, tot God, Die het voor mij zal voltooien.", "2 Kon 18:9-12": "Het gebeurde nu in het vierde jaar van koning Hizkia (dat was het zevende jaar van Hosea, de zoon van Ela, de koning van Israël) dat Salmaneser, de koning van Assyrië, optrok tegen Samaria, en het belegerde. En zij namen het in na drie jaar, in het zesde jaar van Hizkia; dat was het negende jaar van Hosea, de koning van Israël, toen Samaria ingenomen werd. En de koning van Assyrië voerde Israël weg naar Assyrië, en liet hen wonen in Halah, en in Habor, bij de rivier Gozan, en in de steden der Meden.", "Ps 139:22": "Ik haat hen met volkomen haat, tot vijanden zijn zij mij.", "Ezra 10:6": "En Ezra stond op van voor het huis van God, en ging naar de kamer van Johanan, de zoon van Eljasib; toen hij daar kwam, at hij geen brood en dronk geen water, want hij bedreef rouw over de overtreding van de weggevoerden.", "2 Joh 1:10": "Als iemand tot u komt en deze leer niet brengt, ontvang hem niet in huis, en zeg tegen hem niet: wees gegroet.", "Jes 65:3": "Een volk dat Mij voortdurend tergt in Mijn aangezicht, terwijl het in de hoven offert en op tichelstenen wierook brandt;", "Spr 13:20": "Die met de wijzen omgaat, zal wijs worden; maar die de metgezel van de dwazen is, zal verbroken worden.", "1 Tess 5:24": "Hij, Die u roept, is getrouw, Die het ook doen zal.", "Hos 6:1": "Kom, laten wij terugkeren tot de Heere, want Hij heeft verscheurd, en Hij zal ons genezen; Hij heeft geslagen, en Hij zal ons verbinden.", "Zach 10:4": "Uit hem zal de hoeksteen voortkomen, uit hem de nagel, uit hem de strijdboog, samen zullen uit hem alle drijvers voortkomen.", "Hos 6:4-11": "Wat zal Ik u doen, o Efraïm! Wat zal Ik u doen, o Juda! Want uw liefde is als een morgenwolk, en als de dauw die vroeg komt en weer heengaat. Daarom heb Ik hen gehakt door de profeten; Ik heb hen gedood door de woorden van Mijn mond; en uw oordelen zullen voortkomen als het licht. Want Ik heb lust tot liefde, en niet tot offer; en tot de kennis van God, meer dan tot brandoffers.", "Jes 43:22": "Doch u hebt Mij niet aangeroepen, o Jakob! toen u zich tegen Mij vermoeid hebt, o Israël!", "Ps 28:1": "Een psalm van David. Tot U roep ik, HEERE! Mijn Rotssteen, houd U niet als doof van mij af; anders, als U zich stil houdt voor mij, word ik gelijk aan degenen die in de kuil neerdalen.", "Rom 11:32": "Want God heeft hen allen onder de ongehoorzaamheid besloten, opdat Hij hun allen barmhartig zou zijn.", "2 Kon 21:16": "Daartoe vergoot Manasse ook zeer veel onschuldig bloed, totdat hij Jeruzalem van het ene eind tot het andere ermee gevuld had; behalve zijn zonde waarmee hij Juda deed zondigen, door te doen wat kwaad was in de ogen van de HEERE.", "Hos 9:10": "Ik vond Israël als druiven in de woestijn, Ik zag uw vaders als de eerste vrucht aan de vijgenboom in haar begintijd; maar zij gingen naar Baäl-peor, en zonderden zich af tot die schande, en werden helemaal verfoeilijk, net als datgene wat zij liefhadden.", "1 Kon 11:1": "En koning Salomo had, behalve de dochter van Farao, veel vreemde vrouwen lief: Moabitische, Ammonitische, Edomitische, Sidonische en Hethitische vrouwen;", "Ps 89:34": "Maar Mijn goedertierenheid zal Ik van hem niet wegnemen, en in Mijn getrouwheid niet feilen.", "Luk 1:68-70": "Geloofd zij de Heere, de God van Israël, want Hij heeft naar Zijn volk omgezien en verlossing tot stand gebracht; en heeft een hoorn van heil voor ons opgericht, in het huis van David, Zijn knecht; zoals Hij gesproken heeft door de mond van Zijn heilige profeten, die er van oudsher geweest zijn;", "Ps 102:3": "Verberg Uw aangezicht niet voor mij, neig Uw oor tot mij ten dage van mijn benauwdheid; ten dage als ik roep, verhoor mij haastig.", "Jes 22:23-25": "En Ik zal hem als een nagel inslaan op een vaste plaats; en hij zal een stoel van eer zijn voor het huis van zijn vader. En men zal aan hem alle heerlijkheid van het huis van zijn vader hangen, van de nakomelingen en de afstammelingen, ook alle kleine vaten, van de bekers af, tot alle kannen toe. Op die dag, spreekt de HEERE van de heerscharen, zal die nagel, die op een vaste plaats gestoken was, weggenomen worden; en hij zal afgehouwen worden, en hij zal vallen, en de last die daaraan hangt, zal afgesneden worden; want de HEERE heeft het gesproken.", "Hebr 9:25": "ook niet opdat Hij Zichzelf dikwijls zou opofferen, zoals de hogepriester elk jaar het heiligdom binnengaat met vreemd bloed;", "Hand 7:52": "Wie van de profeten hebben uw vaders niet vervolgd? En zij hebben degenen gedood die van tevoren de komst van de Rechtvaardige verkondigd hebben, van Wie u nu verraders en moordenaars geworden bent.", "Neh 9:27-31": "Daarom hebt U hen gegeven in de hand van hun belagers, die hen benauwd hebben; maar toen zij in de tijd van hun benauwdheid tot U riepen, hebt U vanuit de hemel gehoord, en hun naar Uw grote barmhartigheden verlossers gegeven, die hen uit de hand van hun belagers verlosten. Maar toen zij rust hadden, keerden zij weer terug om kwaad te doen voor Uw aangezicht; toen verliet U hen in de hand van hun vijanden, zodat zij over hen heersten; en toen zij zich dan bekeerden, en U aanriepen, hebt U hen vanuit de hemel gehoord, en hebt hen naar Uw barmhartigheden vele malen uitgered. En U hebt tegen hen getuigd, om hen te doen terugkeren tot Uw wet; maar zij hebben trots gehandeld, en niet geluisterd naar Uw geboden, en tegen Uw rechten gezondigd, waardoor een mens, als hij ze doet, zal leven; en zij hebben hun schouder teruggetrokken, en hun nek verhard, en niet geluisterd.", "Ps 119:40": "Zie, ik heb een begeerte tot Uw bevelen; maak mij levend door Uw gerechtigheid.", "1 Kor 15:17": "En als Christus niet opgewekt is, dan is uw geloof zinloos, dan bent u nog in uw zonden.", "Gen 21:1": "En de HEERE bezocht Sara, zoals Hij gezegd had; en de HEERE deed aan Sara, zoals Hij gesproken had.", "Ps 72:1": "Voor Salomo. O God! Geef de koning Uw rechten, en Uw gerechtigheid de zoon van de koning.", "Hand 13:33": "dat God die vervuld heeft aan ons, hun kinderen, doordat Hij Jezus verwekt heeft. Zoals ook in de tweede psalm geschreven staat: U bent Mijn Zoon, heden heb Ik U verwekt.", "Jes 51:8": "Want de mot zal ze opeten als een kleed, en het schietwormpje zal ze opeten als wol; maar Mijn gerechtigheid zal in eeuwigheid zijn, en Mijn heil van geslacht tot geslacht.", "Ps 118:29": "Loof de HEERE, want Hij is goed; want Zijn goedertierenheid is voor eeuwig.", "Ps 106:1": "Halleluja! Loof de HEERE, want Hij is goed, want Zijn goedertierenheid is voor eeuwig.", "Ps 119:67": "Eer ik verdrukt werd, dwaalde ik, maar nu onderhoud ik Uw woord.", "Ps 88:13": "Zullen Uw wonderen bekend worden in de duisternis, en Uw gerechtigheid in het land van de vergetelheid?", "Jes 22:25": "Op die dag, spreekt de HEERE van de heerscharen, zal die nagel, die op een vaste plaats gestoken was, weggenomen worden; en hij zal afgehouwen worden, en hij zal vallen, en de last die daaraan hangt, zal afgesneden worden; want de HEERE heeft het gesproken.", "Ps 105:8": "Hij gedenkt Zijn verbond tot in eeuwigheid, het woord dat Hij ingesteld heeft, tot in duizend geslachten;", "Ex 6:3": "En ook heb Ik Mijn verbond met hen opgericht, dat Ik hun het land Kanaän geven zou, het land van hun vreemdelingschap, waarin zij vreemdelingen zijn geweest.", "2 Kon 2:12": "En Elisa zag het, en hij riep: Mijn vader, mijn vader, wagen van Israël en zijn ruiters! En hij zag hem niet meer; en hij greep zijn klederen en scheurde ze in twee stukken.", "Spr 2:19": "Allen die tot haar ingaan, zullen niet terugkomen, en zullen de paden van het leven niet bereiken;", "Ps 119:65": "Teth. U hebt bij Uw knecht goed gedaan, HEERE, naar Uw woord.", "Jes 63:19": "Wij zijn geworden als zij over wie U van ouds niet hebt geheerst, en die naar Uw Naam niet genoemd zijn.", "Jer 26:10": "Toen nu de vorsten van Juda deze woorden hoorden, gingen zij op uit het huis van de koning naar het huis van de HEERE; en zij zetten zich bij de deur van de nieuwe poort van de HEERE.", "Ps 130:2": "Heere! Hoor naar mijn stem; laat Uw oren opmerkzaam zijn op de stem van mijn smekingen.", "Deut 20:18": "Opdat zij u niet leren te doen naar al hun gruwelen, die zij hun goden gedaan hebben, en u zondigt tegen de HEERE, uw God.", "Rom 8:7": "Daarom dat het bedenken van het vlees vijandschap is tegen God; want het onderwerpt zich niet aan de wet van God, want het kan ook niet.", "Ex 9:29": "Toen zei Mozes tegen hem: Zodra ik de stad uitgegaan ben, zal ik mijn handen uitspreiden voor de HEERE; de donder zal ophouden, en de hagel zal niet meer zijn; zodat u weet dat de aarde van de HEERE is!", "2 Kron 7:6": "Ook stonden de priesters op hun posten, en de Levieten met de muzikale instrumenten van de HEERE, die de koning David gemaakt had, om de HEERE te loven, dat Zijn goedertierenheid in eeuwigheid is, wanneer David door hun dienst Hem prees; en de priesters bliezen de trompetten tegenover hen, en heel Israël stond.", "2 Kor 4:15": "Want al deze dingen zijn om uw wil, opdat de vermenigvuldigde genade, door de dankzegging van velen, overvloedig wordt tot heerlijkheid van God.", "Jer 26:16": "Toen zeiden de vorsten en al het volk tot de priesters en tot de profeten: Deze man verdient de dood niet, want hij heeft tot ons gesproken in de Naam van de HEERE, onze God.", "Rom 9:15": "Want Hij zegt tegen Mozes: Ik zal Mij ontfermen over wie Ik Mij ontferm, en zal barmhartig zijn voor wie Ik barmhartig ben.", "Neh 13:25": "Zo twistte ik met hen, en vloekte hen, en sloeg sommige mannen van hen, en trok hun het haar uit; en ik liet hen zweren bij God: U zult uw dochters niet aan hun zonen geven, en van hun dochters niet nemen voor uw zonen of voor uzelf!", "1 Kon 8:8": "Daarna schoven zij de draagstokken verder naar buiten, zodat de uiteinden van de draagstokken gezien werden vanuit het heiligdom, vóór het binnenste heiligdom, maar buiten werden zij niet gezien; en zij zijn daar tot op deze dag.", "Micha 3:2": "Zij haten het goede, en hebben het kwade lief; zij roven hun huid van hen af, en hun vlees van hun beenderen.", "Ex 10:17": "En nu, vergeef mij toch mijn zonde alleen deze keer, en bid vurig tot de HEERE, uw God, dat Hij alleen deze dood van mij wegneemt.", "Spr 1:10-15": "Mijn zoon! als de zondaars u aanlokken, stem er niet mee in; Als zij zeggen: Ga met ons, laat ons loeren op bloed, ons verstoppen tegen de onschuldige, zonder oorzaak; Laat ons hen levend verslinden, als het graf; ja, geheel en al, zoals zij die in de kuil neerdalen;", "Ex 28:29": "Zo zal Aäron de namen van de zonen van Israël dragen aan de borstlap van het gericht, op zijn hart, als hij in het heilige zal gaan, ter gedachtenis voor het aangezicht van de HEERE, voortdurend.", "Richt 6:36-40": "En Gideon zei tegen God: Als U Israël door mijn hand zult verlossen, zoals U gesproken hebt, zie, ik zal een wollen vlies op de dorsvloer leggen; als er dauw op het vlies alleen zal zijn, en droogte op de hele aarde, dan zal ik weten dat U Israël door mijn hand zult verlossen, zoals U gesproken hebt. En het gebeurde zo; want hij stond de volgende morgen vroeg op, en kneep het vlies uit, en hij wrong de dauw uit het vlies, een schaal vol water.", "Hebr 9:12": "ook niet door het bloed van bokken en kalveren, maar door Zijn eigen bloed, eenmaal ingegaan in het heiligdom, en heeft een eeuwige verlossing verworven.", "2 Kon 22:11": "Het gebeurde nu, toen de koning de woorden van het wetboek hoorde, dat hij zijn kleren scheurde.", "Joh 3:29": "Wie de bruid heeft, is de bruidegom, maar de vriend van de bruidegom, die staat en hem hoort, verblijdt zich zeer over de stem van de bruidegom. Deze blijdschap van mij is dan vervuld geworden.", "Ps 32:5": "Mijn zonde maakte ik U bekend, en mijn ongerechtigheid bedekte ik niet. Ik zei: Ik zal belijdenis van mijn overtredingen doen voor de HEERE; en U vergaf de ongerechtigheid van mijn zonde. Sela.", "1 Petr 4:19": "Laten dan ook zij die lijden naar de wil van God, hun zielen aan Hem, als de trouwe Schepper, toevertrouwen door goed te doen.", "Openb 3:18": "Ik raad u aan dat u van Mij goud koopt, gelouterd door het vuur, opdat u rijk mag worden; en witte kleren, opdat u bekleed mag worden, en de schande van uw naaktheid niet openbaar wordt; en zalf uw ogen met ogenzalf, opdat u zien kunt.", "2 Sam 7:19": "Daarbij is dit in Uw ogen nog klein geweest, Heere HEERE, maar U hebt ook over het huis van uw knecht gesproken tot ver in de toekomst; en dit naar de wet van de mensen, Heere HEERE!", "Ps 111:7-9": "Mem. De werken van Zijn handen zijn waarheid en oordeel; Nun. al Zijn bevelen zijn betrouwbaar. Samech. Ze zijn ondersteund voor altijd en in eeuwigheid; Ain. gedaan in waarheid en oprechtheid. Pe. Hij heeft Zijn volk verlossing gezonden; Tsade. Hij heeft Zijn verbond in eeuwigheid geboden; Koph. Zijn Naam is heilig en ontzagwekkend.", "Ezech 39:24": "Naar hun onreinheid en naar hun overtredingen heb Ik met hen gehandeld, en Ik heb Mijn aangezicht voor hen verborgen.", "Ps 68:18": "Gods wagens zijn tweemaal tienduizend, de duizenden verdubbeld. De Heere is onder hen, een Sinaï in heiligheid!", "1 Kron 15:27": "David nu was gekleed met een mantel van fijn linnen; ook alle Levieten die de ark droegen, en de zangers, en Chenanja, de leider van het opheffen van de zang; ook had David een lijfrok van linnen aan.", "Ps 40:11": "Uw gerechtigheid bedek ik niet in het midden van mijn hart; Uw waarheid en Uw heil spreek ik uit; Uw weldadigheid en Uw trouw verheel ik niet in de grote gemeente.", "2 Kon 14:27": "En de HEERE had niet gesproken dat Hij de naam van Israël van onder de hemel zou uitwissen; maar Hij verloste hen door de hand van Jerobeam, de zoon van Joas.", "Spr 23:6": "Eet niet het brood van hem die boos is van oog, en wees niet belust op zijn smakelijke gerechten;", "Zach 7:5": "Spreek tot heel het volk van dit land, en tot de priesters: Toen u vastte en rouwklaagde, in de vijfde en in de zevende maand, namelijk nu zeventig jaren, hebt u dan voor Mij, voor Mij, werkelijk gevast?", "2 Kon 18:37": "Toen kwam Eljakim, de zoon van Hilkia, de hofmeester, en Sebna, de schrijver, en Joah, de zoon van Asaf, de kanselier, tot Hizkia, met gescheurde kleren; en zij maakten hem de woorden van Rabsake bekend.", "Ezech 2:3-8": "En Hij zei tegen mij: Mensenkind! Ik zend u tot de kinderen van Israël, tot de rebellerende volken, die tegen Mij gerebelleerd hebben; zij en hun vaderen hebben tegen Mij overtreden tot op deze huidige dag. En deze kinderen zijn hard van gezicht, en stijf van hart; Ik zend u tot hen, en u zult tegen hen zeggen: Zo zegt de Heere HEERE! En zij, hetzij dat zij het horen zullen, of hetzij dat zij het laten zullen (want zij zijn een opstandig huis), zo zullen zij weten, dat er een profeet in hun midden geweest is.", "Spr 14:9": "Elke dwaas maakt de schuld belachelijk; maar onder de oprechten is goedwilligheid.", "Richt 3:5-8": "Toen de kinderen van Israël nu woonden te midden van de Kanaänieten, de Hethieten, en de Amorieten, en de Ferezieten, en de Hevieten, en de Jebusieten, namen zij zich van hun dochters tot vrouwen, en gaven hun eigen dochters aan hun zonen; en zij dienden hun goden. En de kinderen van Israël deden wat kwaad was in de ogen van de HEERE, en vergaten de HEERE, hun God, en zij dienden de Baäls en de gewijde palen.", "Pred 3:18": "Ik zei in mijn hart over de toestand van de mensenkinderen, dat God hen zal aantonen, en dat zij zullen zien, dat zij als de dieren zijn aan zichzelf.", "2 Kon 13:23": "Doch de HEERE was hun genadig, en ontfermde Zich over hen, en wendde Zich tot hen, omwille van Zijn verbond met Abraham, Izak en Jakob; en Hij wilde hen niet verderven, en heeft hen niet verworpen van Zijn aangezicht, tot nu toe.", "Richt 2:3": "Daarom heb Ik ook gezegd: Ik zal hen voor uw aangezicht niet verdrijven; maar zij zullen u aan de zijden zijn, en hun goden zullen u tot een strik zijn.", "Spr 28:13": "Wie zijn overtredingen bedekt, zal geen voorspoed hebben; maar wie ze belijdt en laat, zal barmhartigheid ontvangen.", "Jer 14:20": "HEERE, wij kennen onze goddeloosheid, en de ongerechtigheid van onze vaderen, want wij hebben tegen U gezondigd.", "Hebr 10:23": "Laten wij de onwankelbare belijdenis van de hoop vasthouden (want Die het beloofd heeft, is trouw);", "Ps 69:17": "Verhoor mij, o HEERE, want Uw goedertierenheid is goed; zie mij aan naar de grootheid van Uw barmhartigheden.", "Jer 29:10": "Want zo zegt de HEERE: Zeker, als er zeventig jaren te Babel vervuld zullen zijn, zal Ik u bezoeken, en Ik zal Mijn goede woord over u waarmaken, door u terug te brengen naar deze plaats.", "Neh 10:28": "En de rest van het volk, de priesters, de Levieten, de poortwachters, de zangers, de Nethinim, en iedereen die zich van de volken van de landen had afgescheiden voor de wet van God, hun vrouwen, hun zonen en hun dochters, iedereen die kennis en verstand had;", "Jes 32:7": "En het hele gereedschap van een gierigaard is kwaad; hij bedenkt schandelijke plannen, om de ellendigen te gronde te richten met valse woorden, ook als de arme spreekt wat recht is.", "Jes 56:1": "Zo zegt de HEERE: Bewaar het recht en doe gerechtigheid; want Mijn heil is nabij om te komen, en Mijn gerechtigheid om geopenbaard te worden.", "Rom 16:17": "En ik bid u, broeders, let op degenen die tweedracht en ergernissen veroorzaken, tegen de leer die u geleerd hebt; en blijf bij hen vandaan.", "Dan 9:21": "terwijl ik nog sprak in het gebed, kwam de man Gabriël, die ik in het begin in een visioen gezien had, snel gevlogen, en raakte mij aan, omtrent de tijd van het avondoffer.", "Ezra 2:61": "En van de kinderen van de priesters, de kinderen van Habaja, de kinderen van Koz, de kinderen van Barzillai, die een vrouw genomen had van de dochters van Barzillai, de Gileadiet, en naar hun naam genoemd was.", "Ezra 7:8": "En hij kwam in Jeruzalem in de vijfde maand; dat was het zevende jaar van deze koning.", "1 Kon 8:54": "En het gebeurde, toen Salomo dit hele gebed en deze smeking tot de HEERE geëindigd had te bidden, dat hij opstond van voor het altaar van de HEERE, van het knielen op zijn knieën, met zijn handen uitgebreid naar de hemel;", "Job 9:14": "Hoeveel te minder zal ik Hem antwoorden, en mijn woorden uitkiezen tegen Hem?", "Matt 26:65": "Toen scheurde de hogepriester zijn kleren en zei: Hij heeft God gelasterd, waarom hebben wij nog getuigen nodig? Zie, nu hebt u Zijn godslastering gehoord.", "Job 34:32": "Behalve wat ik zie, leer Gij mij; heb ik onrecht gewrocht, ik zal het niet meer doen.", "Neh 9:31": "Doch door Uw grote barmhartigheden hebt U hen niet volledig vernietigd, noch hen verlaten; want U bent een genadig en barmhartig God.", "Ex 23:2": "U zult de menigte niet volgen tot boze zaken; en u zult niet spreken in een geschil om u naar de menigte te neigen, om het recht te buigen.", "Ps 106:43-46": "Hij heeft hen dikwijls gered; maar zij verbitterden Hem door hun raad, en werden uitgeteerd door hun ongerechtigheid. Toch zag Hij hun benauwdheid aan, toen Hij hun geschrei hoorde. En Hij dacht tot hun voordeel aan Zijn verbond, en het berouwde Hem naar de veelheid van Zijn blijken van goedertierenheid.", "Ps 19:10": "De vreze van de HEERE is rein, en bestaat tot in eeuwigheid; de rechten van de HEERE zijn waarheid, samen zijn zij rechtvaardig.", "Ps 88:2": "O HEERE, God van mijn heil! Bij dag, bij nacht roep ik voor U.", "Jer 32:31": "Want tot Mijn toorn en tot Mijn grimmigheid is Mij deze stad geweest, vanaf de dag dat zij haar gebouwd hebben tot op deze dag toe; zodat Ik haar van Mijn aangezicht wegdeed;", "1 Kor 15:9": "Want ik ben de minste van de apostelen, die niet waardig ben een apostel genoemd te worden, omdat ik de Gemeente van God vervolgd heb.", "Ps 130:4": "Maar bij U is vergeving, opdat U gevreesd wordt.", "Hos 11:2": "Maar net zoals zij hen riepen, zo gingen zij van hun aangezicht weg; zij offerden aan de Baäls, en brandden reukwerk voor de gesneden beelden.", "Richt 10:6-8": "Toen gingen de Israëlieten opnieuw doen wat slecht was in de ogen van de HEERE: zij dienden de Baäls en de Astartes, de goden van Syrië, de goden van Sidon, de goden van Moab, de goden van de Ammonieten, alsook de goden van de Filistijnen; zij verlieten de HEERE en dienden Hem niet meer. Toen ontstak de toorn van de HEERE tegen Israël; en Hij verkocht hen in de hand van de Filistijnen en in de hand van de Ammonieten. Die verdrukten en vertrapten de Israëlieten in datzelfde jaar; achttien jaar lang onderdrukten zij alle Israëlieten die aan de overkant van de Jordaan waren, in het land van de Amorieten, dat in Gilead ligt.", "Jer 15:17": "Ik heb in de raad van de spotters niet gezeten, en ben ook niet van vreugde opgesprongen; vanwege Uw hand heb ik alleen gezeten, want U hebt mij met gramschap vervuld.", "Neh 13:23-28": "Ook zag ik in die dagen Joden die Asdodische, Ammonietische en Moabietische vrouwen bij zich hadden laten wonen. En hun kinderen spraken half Asdodisch, en zij konden geen Joods spreken, maar naar de taal van ieder volk. Zo twistte ik met hen, en vloekte hen, en sloeg sommige mannen van hen, en trok hun het haar uit; en ik liet hen zweren bij God: U zult uw dochters niet aan hun zonen geven, en van hun dochters niet nemen voor uw zonen of voor uzelf!", "Ps 106:45": "En Hij dacht tot hun voordeel aan Zijn verbond, en het berouwde Hem naar de veelheid van Zijn blijken van goedertierenheid.", "Jer 5:5": "Ik zal naar de groten gaan, en met hen spreken, want die kennen de weg van de HEERE, het recht van hun God; maar zij hadden samen het juk verbroken, en de banden verscheurd.", "1 Sam 14:27": "Maar Jonathan had het niet gehoord, toen zijn vader het volk bezworen had, en hij stak het uiteinde van de staf die in zijn hand was uit, en doopte die in een honigraat; en toen hij zijn hand naar zijn mond bracht, werden zijn ogen weer helder.", "Dan 9:5-7": "Wij hebben gezondigd, en onrecht gedaan, en goddeloos gehandeld, en gerebelleerd, door af te wijken van Uw geboden en van Uw rechten. En wij hebben niet geluisterd naar Uw dienstknechten, de profeten, die in Uw Naam spraken tot onze koningen, onze vorsten en onze vaders, en tot heel het volk van het land. Bij U, o Heere! is de gerechtigheid, maar bij ons de schaamte van het gezicht, zoals het is op deze dag; bij de mannen van Juda, en de inwoners van Jeruzalem, en heel Israël, die dichtbij en die ver weg zijn, in alle landen waarheen U hen verdreven hebt, om hun overtreding waarmee zij tegen U overtreden hebben.", "Jes 1:22": "Uw zilver is geworden tot schuim; uw wijn is vermengd met water.", "Job 33:6": "Zie, ik ben Gods, net als u; uit het leem ben ik ook afgesneden.", "Gen 24:27": "en hij zei: Geloofd zij de HEERE, de God van mijn heer Abraham, Die Zijn weldadigheid en trouw niet onthouden heeft aan mijn heer; wat mij betreft, de HEERE heeft mij op deze weg geleid, naar het huis van de broers van mijn heer.", "Joël 2:18": "Zo zal de HEERE ijveren over Zijn land, en Hij zal Zijn volk verschonen.", "Ex 9:27": "Toen stuurde Farao mensen, en riep Mozes en Aäron, en zei tegen hen: Ik heb ditmaal gezondigd; de HEERE is rechtvaardig; ik daarentegen en mijn volk zijn goddelozen!", "Richt 10:10": "Toen riepen de Israëlieten tot de HEERE en zeiden: Wij hebben tegen U gezondigd, omdat wij onze God hebben verlaten en de Baäls gediend hebben.", "Ps 38:4": "Er is niets heels in mijn vlees, vanwege Uw gramschap; er is geen vrede in mijn beenderen, vanwege mijn zonde.", "Neh 9:37": "En het vermeerdert zijn opbrengst voor de koningen, die U over ons gesteld hebt, om onze zonden; en zij heersen over onze lichamen en over onze dieren, naar hun welgevallen; zo zijn wij in grote benauwdheid.", "Jes 1:15": "En als u uw handen uitspreidt, verberg Ik Mijn ogen voor u; ook wanneer u het gebed vermenigvuldigt, hoor Ik niet; want uw handen zijn vol bloed.", "Neh 1:4-6": "En het gebeurde, toen ik deze woorden hoorde, dat ik neerzat, en huilde, en rouw bedreef, enkele dagen; en ik vastte en bad voor het aangezicht van de God van de hemel. En ik zei: Och, HEERE, God van de hemel, U, grote en ontzagwekkende God! Die het verbond en de goedertierenheid houdt voor hen die Hem liefhebben en Zijn geboden houden. Laat toch Uw oor opmerkzaam, en Uw ogen open zijn, om te horen naar het gebed van Uw dienaar, dat ik vandaag voor Uw aangezicht bid, dag en nacht, voor de kinderen van Israël, Uw dienaren; en ik doe belijdenis over de zonden van de kinderen van Israël, die wij tegen U gezondigd hebben; ook ik en het huis van mijn vader, wij hebben gezondigd.", "1 Kon 8:23": "en hij zei: HEERE, God van Israël, er is geen God zoals U, boven in de hemel, noch beneden op de aarde, Die het verbond en de goedertierenheid houdt aan Uw dienaren, die voor Uw aangezicht met hun hele hart wandelen;", "Ezra 10:18-44": "En er werden gevonden van de zonen van de priesters die vreemde vrouwen bij zich hadden laten wonen: van de zonen van Jesua, de zoon van Jozadak, en zijn broers, Maaseja, en Eliëzer, en Jarib, en Gedalja. En zij gaven hun hand, dat zij hun vrouwen zouden wegsturen; en omdat zij schuldig waren, offerden zij een ram uit de kudde voor hun schuld. En van de kinderen van Immer: Hanani en Zebadja.", "Klaagl 3:42": "Nun. Wij hebben overtreden, en wij zijn opstandig geweest, daarom hebt U niet gespaard.", "Job 9:3": "Als Hij lust heeft om met hem te twisten, zal hij Hem niet één op de duizend beantwoorden.", "Jes 57:20": "Maar de goddelozen zijn als een voortgejaagde zee, want die kan niet tot rust komen, en haar water werpt slijk en modder op.", "Ps 141:1": "Een psalm van David. HEERE, ik roep U aan, haast U tot mij; luister naar mijn stem, als ik tot U roep.", "Jes 31:6": "Bekeer u tot Hem, van Wie de kinderen van Israël diep afgeweken zijn.", "Rom 3:21": "Maar nu is de gerechtigheid van God geopenbaard, zonder de wet, met getuigenis van de wet en de profeten:", "2 Kor 12:8": "Hierover heb ik de Heere driemaal gebeden, dat hij van mij zou wijken.", "Dan 2:30": "Aan mij nu is dit geheim geopenbaard, niet door wijsheid die in mij meer zou zijn dan in alle levenden, maar opdat men de koning de uitleg bekend zou maken, en opdat u de gedachten van uw hart zou kennen.", "Ps 69:11": "En ik heb geweend in het vasten van mijn ziel; maar het is mij tot allerlei smaad geworden.", "Ps 52:3-6": "Wat beroemt u zich in het kwaad, o u geweldige? Gods goedertierenheid duurt toch de hele dag. Uw tong denkt enkel schade uit, als een geslepen scheermes, en werkt bedrog. U hebt het kwade liever dan het goede, de leugen liever dan gerechtigheid te spreken. Sela.", "Hagg 1:9": "U ziet uit naar veel, maar zie, u bekomt weinig; en als u het in huis gebracht hebt, dan blaas Ik erin. Waarom dat? spreekt de HEERE van de heerscharen; om de wil van Mijn huis, dat woest is, en dat u loopt, ieder voor zijn eigen huis.", "1 Tim 1:15": "Dit is een betrouwbaar woord, en alle aanneming waard, dat Christus Jezus in de wereld gekomen is om de zondaars zalig te maken, van wie ik de voornaamste ben.", "Zef 2:7": "En dat gebied zal zijn voor het overblijfsel van het huis van Juda, zodat zij daarin weiden; 's avonds zullen zij in de huizen van Askelon liggen, want de HEERE, hun God, zal hen bezoeken, en Hij zal hun gevangenschap wenden.", "2 Kron 24:20": "En de Geest van God bekleedde Zacharia, de zoon van Jojada, de priester, die boven het volk stond, en hij zei tegen hen: Zo zegt God: Waarom overtreedt u de geboden van de HEERE? Daarom zult u niet voorspoedig zijn; omdat u de HEERE verlaten hebt, zo zal Hij u verlaten.", "Jer 5:1-31": "Ga rond door de wijken van Jeruzalem, en kijk nu goed, en onderzoek, en zoek op haar straten, of u iemand vindt, of er iemand is die recht doet, die waarheid zoekt; dan zal Ik haar genadig zijn. En al zeggen zij: Zo waarachtig als de HEERE leeft! toch zweren zij vals. HEERE, zien Uw ogen niet naar waarheid? U hebt hen geslagen, maar zij hebben geen pijn gevoeld; U hebt hen verteerd, maar zij hebben geweigerd de tucht aan te nemen; zij hebben hun gezicht harder gemaakt dan een steenrots, zij hebben geweigerd zich te bekeren.", "Ps 50:18": "Als u een dief ziet, dan loopt u met hem mee; en uw deel is met de overspelers.", "Joh 3:30": "Hij moet meer worden, maar ik minder.", "1 Tim 1:13": "Ik was voorheen een godslasteraar, en een vervolger, en een geweldenaar; maar mij is barmhartigheid overkomen, omdat ik het onwetend gedaan heb in mijn ongeloof.", "Ps 107:1": "Loof de HEERE, want Hij is goed; want Zijn goedertierenheid is voor eeuwig.", "2 Kon 19:31": "Want uit Jeruzalem zal het overblijfsel uitgaan, en wie ontkomen is uit de berg Sion; de na-ijver van de HEERE van de heerscharen² zal dit doen.", "Ps 65:4": "Onrechtvaardige dingen hadden de overhand over mij; maar onze overtredingen, die verzoent U.", "Ps 50:6": "En de hemelen verkondigen Zijn gerechtigheid; want God Zelf is Rechter. Sela.", "2 Kron 28:22": "Ja, in de tijd toen men hem benauwde, ging hij nog meer overtreden tegen de HEERE; dit was koning Achaz.", "Ps 18:31": "Gods weg is volmaakt; de rede van de HEERE is doorlouterd; Hij is een Schild voor allen die op Hem vertrouwen.", "Ps 143:1": "Een psalm van David. O HEERE, hoor mijn gebed, neig de oren tot mijn smekingen; verhoor mij naar Uw waarheid, naar Uw gerechtigheid.", "Deut 32:4": "Hij is de Rotssteen, Wiens werk volkomen is; want al Zijn wegen zijn recht. God is waarheid, en is geen onrecht; rechtvaardig en recht is Hij.", "Ps 106:41": "En Hij gaf hen in de hand van de heidenen, en hun haters heersten over hen.", "Ps 94:3-8": "Hoe lang zullen de goddelozen, o HEERE! hoe lang zullen de goddelozen van vreugde opspringen? Uitgieten? Hard spreken? Zullen alle werkers van de ongerechtigheid zich beroemen? O HEERE! Zij verbrijzelen Uw volk, en zij verdrukken Uw erfdeel.", "Ps 70:6": "Doch ik ben ellendig en nooddruftig; o God, haast U tot mij; Gij zijt mijn Hulp en mijn Bevrijder; HEERE, vertoef niet!", "Ezech 16:61": "Dan zult u aan uw wegen denken en beschaamd zijn, wanneer u uw zusters, die groter zijn dan u, samen met hen die kleiner zijn dan u, aannemen zult; want Ik zal ze u geven tot dochters, maar niet op grond van uw verbond.", "1 Kon 8:56": "Geloofd zij de HEERE, Die aan Zijn volk Israël rust gegeven heeft, naar alles wat Hij gesproken heeft! Niet één woord is er gevallen van al Zijn goede woorden, die Hij gesproken heeft door de dienst van Mozes, Zijn dienaar.", "Deut 32:43": "Juich, heidenen, met Zijn volk! want Hij zal het bloed van Zijn knechten wreken; en Hij zal de wraak op Zijn tegenpartijen doen wederkeren, en verzoenen Zijn land en Zijn volk.", "Jes 57:15": "Want zo zegt de Hoge en Verhevene, Die in de eeuwigheid woont, en Wiens Naam heilig is: Ik woon in de hoogte en in het heilige, en bij hem die een verbrijzelde en nederige geest heeft, om de geest van de nederigen levend te maken, en om het hart van de verbrijzelden levend te maken.", "1 Kon 8:47": "en zij in het land, waar zij gevankelijk weggevoerd zijn, weer tot inkeer komen, en zich bekeren, en tot U smeken in het land van hen die ze gevankelijk hebben weggevoerd, en zeggen: Wij hebben gezondigd, en verkeerd gedaan, wij hebben goddeloos gehandeld;", "Spr 15:10": "De tucht is onaangenaam voor hem die het pad verlaat; en wie de bestraffing haat, zal sterven.", "Ezra 10:11": "Nu dan, doe de HEERE, de God van uw vaderen, belijdenis en doe Zijn wil, en scheid u af van de volken van het land, en van de vreemde vrouwen.", "Jer 8:1-22": "In die tijd, spreekt de HEERE, zullen ze de beenderen van de koningen van Juda, en de beenderen van hun vorsten, en de beenderen van de priesters, en de beenderen van de profeten, en de beenderen van de inwoners van Jeruzalem, uit hun graven halen. En zij zullen ze uitspreiden voor de zon, en voor de maan, en voor het hele heerleger van de hemel, die zij liefgehad hebben, en die zij gediend hebben, en die zij nagevolgd hebben, en die zij gezocht hebben, en voor wie zij zich neergebogen hebben; zij zullen niet verzameld noch begraven worden; tot mest op de aardbodem zullen zij zijn. En de dood zal boven het leven verkozen worden, door heel het overblijfsel van hen die overgebleven zijn uit dit boze geslacht, in al de plaatsen van de overgeblevenen, waarheen Ik hen verdreven zal hebben, spreekt de HEERE van de heerscharen.", "Matt 4:16": "het volk dat in duisternis zat, heeft een groot licht gezien; en over hen die zaten in het land en de schaduw van de dood, is een licht opgegaan.", "Deut 32:6": "Zult u dit de HEERE vergelden, u, dwaas en onwijs volk! Is Hij niet uw Vader, Die u verkregen heeft, Die u gemaakt en u bevestigd heeft?", "1 Petr 2:25": "Want u was als dwalende schapen; maar u bent nu bekeerd tot de Herder en Opziener van uw zielen.", "Ps 95:6": "Komt, laat ons aanbidden en neerbukken; laat ons knielen voor de HEERE, Die ons gemaakt heeft.", "Richt 3:5-7": "Toen de kinderen van Israël nu woonden te midden van de Kanaänieten, de Hethieten, en de Amorieten, en de Ferezieten, en de Hevieten, en de Jebusieten, namen zij zich van hun dochters tot vrouwen, en gaven hun eigen dochters aan hun zonen; en zij dienden hun goden. En de kinderen van Israël deden wat kwaad was in de ogen van de HEERE, en vergaten de HEERE, hun God, en zij dienden de Baäls en de gewijde palen.", "Ps 101:4": "Het verkeerde hart zal van mij wijken; de boze zal ik niet kennen.", "Jer 8:6": "Ik heb geluisterd en toegehoord, zij spreken wat niet recht is, er is niemand die berouw heeft over zijn slechtheid, en zegt: Wat heb ik gedaan? Ieder keert zich om in zijn eigen loop, zoals een onbesuisd paard zich stort in de strijd.", "Job 39:37": "Zie, ik ben te gering; wat zou ik U antwoorden? Ik leg mijn hand op mijn mond.", "Ezech 16:63": "opdat u eraan denkt, en zich schaamt, en niet meer uw mond opendoet vanwege uw schande, wanneer Ik verzoening voor u zal doen over alles wat u gedaan hebt, spreekt de Heere HEERE.", "Ps 41:5": "Ik zei: O HEERE! wees mij genadig; genees mijn ziel, want ik heb tegen U gezondigd.", "Tit 3:5": "Heeft Hij ons zalig gemaakt, niet uit de werken van de rechtvaardigheid die wij gedaan hadden, maar naar Zijn barmhartigheid, door het bad van de wedergeboorte en de vernieuwing door de Heilige Geest;", "Num 14:18-20": "De HEERE is geduldig en groot van goedertierenheid, Hij vergeeft de ongerechtigheid en overtreding, maar houdt de schuldige geenszins onschuldig, en bezoekt de ongerechtigheid van de vaderen aan de kinderen, tot het derde en vierde geslacht. Vergeef toch de ongerechtigheid van dit volk, naar de grootte van Uw goedertierenheid, en zoals U dit volk vergeven hebt, van Egypteland af tot hiertoe! En de HEERE zei: Ik heb hun vergeven naar uw woord.", "Gen 9:16": "Als deze boog in de wolken zal zijn, dan zal Ik hem aanzien, om te gedenken aan het eeuwige verbond tussen God en tussen alle levende ziel, van alle vlees, dat op de aarde is.", "Spr 2:11": "Zo zal de bedachtzaamheid over u de wacht houden, de verstandigheid zal u behoeden;", "Ps 99:8": "O HEERE, onze God! U hebt hen verhoord, U bent hun geweest een vergevend God, hoewel U wraak deed over hun daden.", "Joël 2:13": "En scheurt uw hart en niet uw kleren, en bekeert u tot de HEERE, uw God; want Hij is genadig en barmhartig, geduldig en groot van goedertierenheid, en Hij heeft berouw over het kwade.", "Spr 13:19": "De begeerte die vervuld wordt, is zoet voor de ziel; maar het is de dwazen een gruwel om van het kwade af te wijken.", "Lev 16:2-24": "De HEERE dan zei tegen Mozes: Spreek tot uw broeder Aäron, dat hij niet op elk tijdstip het heilige binnengaat, binnen het voorhangsel, voor het verzoendeksel dat op de ark is, opdat hij niet sterft; want Ik verschijn in een wolk op het verzoendeksel. Hiermee zal Aäron het heilige binnengaan: met een jonge stier als zondoffer, en een ram als brandoffer. Hij zal de heilige linnen rok aandoen, en een linnen onderbroek zal om zijn lichaam zijn, en met een linnen gordel zal hij zich omgorden, en met een linnen hoofddoek zich bedekken; dit zijn heilige klederen; daarom zal hij zijn lichaam met water baden, als hij ze zal aandoen.", "Neh 9:34": "En onze koningen, onze vorsten, onze priesters en onze vaders hebben Uw wet niet gedaan; en zij hebben niet geluisterd naar Uw geboden, en naar Uw getuigenissen, waarmee U tegen hen getuigde.", "Spr 2:12-19": "Om u te redden van de kwade weg, van de man die verkeerdheden spreekt; Van hen die de paden van de oprechtheid verlaten, om te gaan in de wegen van de duisternis; Die blij zijn met het doen van kwaad, zich verheugen in de verkeerdheden van de kwade;", "Fil 2:15": "Opdat u onberispelijk en oprecht mag zijn, kinderen van God, onstraffelijk te midden van een krom en verdraaid geslacht, onder wie u schijnt als lichten in de wereld;", "Jes 8:11": "Want zo heeft de HEERE tegen mij gezegd, met een sterke hand, en Hij onderwees mij om niet te wandelen op de weg van dit volk, en zei:", "Neh 13:4-9": "Eljasib nu, de priester, die gesteld was over de kamer van het huis van onze God, was voor deze tijd een nabestaande van Tobia geworden. En hij had hem een grote kamer gemaakt, waar zij tevoren het spijsoffer, de wierook en de vaten heenleidden, en de tienden van koren, van most en van olie, die bevolen waren voor de Levieten, en de zangers, en de poortwachters, alsook het hefoffer van de priesters. Doch bij dit alles was ik niet in Jeruzalem; want in het tweeëndertigste jaar van Arthahsasta, koning van Babel, kwam ik naar de koning; maar na verloop van enige dagen kreeg ik opnieuw verlof van de koning.", "2 Kon 6:30": "En het gebeurde, toen de koning de woorden van deze vrouw gehoord had, dat hij zijn kleren scheurde, terwijl hij over de muur voortging; en het volk zag dat er, zie, een zak van binnen over zijn vlees was.", "Mark 4:11": "En Hij zei tegen hen: Aan u is het gegeven het geheimenis van het Koninkrijk van God te verstaan; maar aan hen die buiten zijn, gebeurt dit alles door gelijkenissen;", "Ps 136:23": "Die aan ons gedacht heeft toen wij vernederd waren; want Zijn goedertierenheid is voor eeuwig.", "Jes 42:16": "En Ik zal de blinden leiden door de weg die zij niet gekend hebben, Ik zal ze doen gaan door de paden die zij niet gekend hebben; Ik zal de duisternis voor hun ogen tot licht maken, en het kromme tot recht; deze dingen zal Ik hun doen, en Ik zal hen niet verlaten.", "Zach 1:5": "Uw vaderen, waar zijn die? En de profeten, zullen zij eeuwig leven?", "2 Kon 11:14": "En zij zag toe, en zie, de koning stond bij de pilaar, naar de gewoonte, en de leiders en de trompetten bij de koning; en al het volk van het land was blij en blies op trompetten. Toen scheurde Athalia haar kleren en riep: Verraad, verraad!", "Gen 15:19-21": "De Kenieten, en de Kenizzieten, en de Kadmonieten, En de Hethieten, en de Ferezieten, en de Refaïeten, En de Amorieten, en de Kanaänieten, en de Girgazieten, en de Jebusieten.", "Jer 31:19": "Zeker, nadat ik bekeerd ben, heb ik berouw gehad, en nadat ik mijzelf ben bekendgemaakt, heb ik op de heup geklopt, ik ben beschaamd, ja, ook schaamrood geworden, omdat ik de smaad van mijn jeugd gedragen heb.", "Ezra 9:5-15": "En rond het avondoffer stond ik op uit mijn bedruktheid, nadat ik mijn kleed en mijn mantel gescheurd had; en ik boog mij op mijn knieën, en breidde mijn handen uit tot de HEERE, mijn God; En ik zei: Mijn God, ik ben beschaamd en schaamrood om mijn aangezicht tot U op te heffen, mijn God; want onze ongerechtigheden zijn vermenigvuldigd tot boven ons hoofd, en onze schuld is groot geworden tot aan de hemel. Vanaf de dagen van onze vaderen zijn wij in grote schuld tot op deze dag; en wij zijn om onze ongerechtigheden overgegeven, wij, onze koningen en onze priesters, in de hand van de koningen van de landen, aan het zwaard, aan gevangenschap, en aan roof, en aan schaamte van het aangezicht, zoals het is op deze dag.", "Gen 42:21": "Toen zeiden zij de één tegen de ander: Voorwaar, wij zijn schuldig aan onze broer, wiens angst van zijn ziel wij zagen, toen hij ons om genade smeekte; maar wij luisterden niet! Daarom komt deze benauwdheid over ons.", "Zach 9:11": "U ook aangaande, o Sion! Door het bloed van het verbond met u, heb Ik uw gebondenen uit de kuil, waar geen water in is, uitgelaten.", "Ps 30:6": "Want een ogenblik is er in Zijn toorn, maar een leven in Zijn goedgunstigheid; 's avonds vernacht het geween, maar 's morgens is er gejuich.", "Num 5:5-7": "Verder sprak de HEERE tot Mozes en zei: Spreek tot de kinderen van Israël: Wanneer een man of een vrouw iets van enige menselijke zonden gedaan zal hebben, door overtreding tegen de HEERE overtreden hebbend, dan is die ziel schuldig. En zij zullen hun zonde die zij gedaan hebben belijden; daarna zal hij zijn schuld weer uitkeren, naar de hoofdsom daarvan, en het vijfde deel daarvan zal hij daarboven toevoegen, en zal het geven aan degene aan wie hij zich schuldig gemaakt heeft.", "Luk 1:55": "zoals Hij gesproken heeft tot onze vaderen, tot Abraham en zijn nageslacht, tot in eeuwigheid.", "1 Petr 1:3": "Geloofd zij de God en Vader van onze Heere Jezus Christus, Die naar Zijn grote barmhartigheid ons opnieuw geboren heeft doen worden tot een levende hoop, door de opstanding van Jezus Christus uit de doden.", "1 Kor 7:14": "Want de ongelovige man is geheiligd door de vrouw, en de ongelovige vrouw is geheiligd door de man; want anders waren uw kinderen onrein, maar nu zijn zij heilig.", "Job 34:31": "Zeker heeft hij tot God gezegd: Ik heb Uw straf verdragen, ik zal het niet verderven.", "Zef 3:7": "Ik zei: Zeker zult u Mij vrezen, u zult de tucht aannemen, opdat haar woning niet uitgeroeid zou worden; alles waarmee Ik haar bezocht heb¹, waarlijk, zij hebben zich vroeg opgemaakt, zij hebben al hun handelingen verdorven.", "Jer 33:25": "Zo zegt de HEERE: Als Mijn verbond niet zou bestaan met dag en nacht, als Ik de ordeningen van de hemel en de aarde niet had vastgesteld;", "Ps 5:9": "HEERE! Leid mij in Uw gerechtigheid, om mijn verspieders wil; richt Uw weg voor mijn aangezicht.", "Ps 119:71": "Het is mij goed, dat ik verdrukt ben geweest, opdat ik Uw inzettingen leerde.", "Ezra 10:10": "Toen stond Ezra, de priester, op en zei tegen hen: U hebt overtreden, en vreemde vrouwen bij u laten wonen, om de schuld van Israël te vermeerderen.", "Fil 3:12": "Niet dat ik het al gekregen heb, of al volmaakt ben; maar ik jaag ernaar, of ik het ook grijpen mag, waartoe ik ook door Christus Jezus gegrepen ben.", "Lev 20:23": "En wandel niet in de gewoonten van het volk, dat Ik voor uw aangezicht wegjaag; want al deze dingen hebben zij gedaan; daarom ben Ik verdrietig op hen geworden.", "1 Kron 16:34": "Looft de HEERE, want Hij is goed, want Zijn goedertierenheid is tot in eeuwigheid.", "Jes 57:19": "Ik schep de vrucht van de lippen: vrede, vrede voor hen die ver weg zijn, en voor hen die dichtbij zijn, zegt de HEERE, en Ik zal hen genezen.", "Jes 49:7": "Zo zegt de HEERE, de Verlosser van Israël, Zijn Heilige, tegen de veracht ziel, tegen Hem aan Wie het volk een gruwel heeft, tegen de Knecht van hen die heersen: Koningen zullen het zien en opstaan, ook vorsten, en zij zullen zich voor U buigen; om de wil van de HEERE, Die getrouw is, om de Heilige van Israël, Die U verkozen heeft.", "2 Kron 5:13": "het gebeurde dan, toen zij eenparig trompetten en zongen, om één stem te laten horen, terwijl zij de HEERE prezen en loofden; en toen zij de stem verhieven met trompetten, en met cimbalen, en andere muzikale instrumenten, en toen zij de HEERE prezen, omdat Hij goed is, omdat Zijn goedertierenheid tot in eeuwigheid is; dat het huis met een wolk vervuld werd, namelijk het huis van de HEERE.", "Tit 1:15": "Alle dingen zijn wel rein voor de reinen, maar voor de bevlekten en ongelovigen is niets rein, maar zowel hun verstand als hun geweten zijn bevlekt.", "Jer 2:17": "Doet u dit niet zelf, doordat u de HEERE, uw God, verlaat, ten tijde als Hij u op de weg leidt?", "Jer 2:22-25": "Want, al wast u zich met salpeter, en nam u veel zeep, toch is uw ongerechtigheid voor Mijn aangezicht getekend, spreekt de Heere HEERE. Hoe zegt u: Ik ben niet verontreinigd, ik heb de Baäls niet nagewandeld? Zie uw weg in het dal, ken wat u gedaan hebt, u lichte, snelle kemelin, die haar wegen verdraait! Zij is een woudezelin, gewend aan de woestijn, naar de lust van haar ziel schept zij de wind; wie zou haar ontmoeting kunnen afkeren? Allen die haar zoeken, zullen niet moe worden, in haar maand zullen zij haar vinden.", "Gen 44:13": "Toen scheurden zij hun kleren, en ieder man laadde zijn ezel weer op, en zij keerden terug naar de stad.", "Jes 5:13": "Daarom zal mijn volk gevankelijk weggevoerd worden, omdat het geen kennis heeft; en zijn heerlijke mannen zullen honger lijden, en zijn menigte zal verdorren van dorst.", "Jer 14:10": "Zo zegt de HEERE van dit volk: Zij hebben zo liefgehad om te zwerven, zij hebben hun voeten niet bedwongen; daarom heeft de HEERE geen welgevallen aan hen, nu zal Hij aan hun ongerechtigheden denken, en hun zonden bezoeken.", "Hab 3:2": "HEERE! Toen ik Uw rede gehoord heb, ben ik bevreesd geworden; Uw werk, o HEERE! Behoud dat in het leven in het midden van de jaren, maak het bekend in het midden van de jaren; gedenk in de toorn aan het ontfermen.", "Dan 9:4-16": "Ik bad dan tot de HEERE, mijn God, en deed belijdenis, en zei: Och Heere! U grote en ontzagwekkende God, Die het verbond en de goedertierenheid houdt voor hen die Hem liefhebben en Zijn geboden houden. Wij hebben gezondigd, en onrecht gedaan, en goddeloos gehandeld, en gerebelleerd, door af te wijken van Uw geboden en van Uw rechten. En wij hebben niet geluisterd naar Uw dienstknechten, de profeten, die in Uw Naam spraken tot onze koningen, onze vorsten en onze vaders, en tot heel het volk van het land.", "Ex 2:24": "En God hoorde hun gekerm, en God dacht aan Zijn verbond met Abraham, met Izak, en met Jakob.", "Ps 89:15": "Gerechtigheid en gericht zijn de vastigheid van Uw troon; goedertierenheid en waarheid gaan voor Uw aangezicht heen.", "Joh 8:34": "Jezus antwoordde hun: Voorwaar, voorwaar, Ik zeg u: Ieder die de zonde doet, is een dienstknecht van de zonde.", "2 Kron 33:2": "En hij deed wat kwaad was in de ogen van de HEERE, naar de gruwelen van de heidenen, die de HEERE voor het aangezicht van de kinderen van Israël uit de bezitting verdreven had.", "Hand 3:19": "Kom dus tot inkeer en bekeer u, opdat uw zonden uitgewist worden, wanneer de tijden van verkwikking gekomen zijn van het aangezicht van de Heere,", "Ps 146:8": "De HEERE opent de ogen van de blinden; de HEERE richt de gebogenen op; de HEERE heeft de rechtvaardigen lief.", "Ps 119:89": "Lamed. O HEERE! Uw woord bestaat in de eeuwigheid in de hemelen.", "Gen 18:23-32": "En Abraham trad naar voren en zei: Zult U ook de rechtvaardige met de goddeloze ombrengen? Misschien zijn er vijftig rechtvaardigen in de stad; zult U hen ook ombrengen, en de plaats niet sparen, omwille van de vijftig rechtvaardigen die daarin zijn? Het zij verre van U, zoiets te doen, de rechtvaardige te doden met de goddeloze! zodat de rechtvaardige zou zijn als de goddeloze, verre zij het van U! zou de Rechter van de hele aarde geen recht doen?", "1 Sam 12:15": "Maar als u naar de stem van de HEERE niet zult luisteren, maar tegen het bevel van de HEERE opstandig bent, dan zal de hand van de HEERE tegen u zijn, zoals tegen uw vaders.", "2 Tess 3:6": "En wij bevelen u, broeders, in de Naam van onze Heere Jezus Christus, dat u zich onttrekt van iedere broeder die ongeregeld wandelt, en niet naar de overlevering die hij van ons ontvangen heeft.", "Jer 2:11-13": "Heeft ook een volk de goden veranderd, hoewel die geen goden zijn? Toch heeft Mijn volk zijn Eer veranderd in iets dat geen nut doet. Ontzet u hierover, hemelen, en wees verschrikt, word zeer woest, spreekt de HEERE. Want Mijn volk heeft twee boosheden gedaan; Mij, de Springader van het levende water, hebben zij verlaten, om zichzelf bakken uit te houwen, gebroken bakken, die geen water houden.", "Hos 14:9": "Efraïm! wat heb Ik meer met de afgoden te doen? Ik heb hem verhoord, en zal op hem zien; Ik zal hem zijn als een denneboom die groent; uw vrucht is uit Mij gevonden.", "Neh 9:33-35": "Doch U bent rechtvaardig, in alles wat ons overkomen is; want U hebt trouw gehandeld, maar wij hebben goddeloos gehandeld. En onze koningen, onze vorsten, onze priesters en onze vaders hebben Uw wet niet gedaan; en zij hebben niet geluisterd naar Uw geboden, en naar Uw getuigenissen, waarmee U tegen hen getuigde. Want zij hebben U niet gediend in hun koninkrijk, en in Uw overvloedige goed, dat U hun gaf, en in dat wijde en dat vette land, dat U voor hun aangezicht gegeven had; en zij hebben zich niet bekeerd van hun slechte werken.", "Mal 2:
