: {"Gen": "genesis", "Ex": "exodus", "Lev": "leviticus", "Num": "numeri", "Deut": "deuteronomium", "Joz": "jozua", "Richt": "richteren", "Ruth": "ruth", "1 Sam": "1-samuel", "2 Sam": "2-samuel", "1 Kon": "1-koningen", "2 Kon": "2-koningen", "1 Kron": "1-kronieken", "2 Kron": "2-kronieken", "Ezra": "ezra", "Neh": "nehemia", "Est": "esther", "Job": "job", "Ps": "psalmen", "Spr": "spreuken", "Pred": "prediker", "Hoogl": "hooglied", "Jes": "jesaja", "Jer": "jeremia", "Klaagl": "klaagliederen", "Ezech": "ezechiel", "Dan": "daniel", "Hos": "hosea", "Joël": "joel", "Amos": "amos", "Obadja": "obadja", "Jona": "jona", "Micha": "micha", "Nahum": "nahum", "Hab": "habakuk", "Zef": "zefanja", "Hagg": "haggai", "Zach": "zacharia", "Mal": "maleachi", "Matt": "mattheus", "Mark": "markus", "Luk": "lukas", "Joh": "johannes", "Hand": "handelingen", "Rom": "romeinen", "1 Kor": "1-korinthe", "2 Kor": "2-korinthe", "Gal": "galaten", "Ef": "efeze", "Fil": "filippenzen", "Kol": "kolossenzen", "1 Tess": "1-thessalonicenzen", "2 Tess": "2-thessalonicenzen", "1 Tim": "1-timotheus", "2 Tim": "2-timotheus", "Tit": "titus", "Filem": "filemon", "Hebr": "hebreeen", "Jak": "jakobus", "1 Petr": "1-petrus", "2 Petr": "2-petrus", "1 Joh": "1-johannes", "2 Joh": "2-johannes", "3 Joh": "3-johannes", "Judas": "judas", "Openb": "openbaring"}}, "vertalingen": {"Berea": {"1": "Dit zijn nu de hoofden van hun vaderen, met hun geslachtsrekening, die met mij uit Babel optrokken, onder het koninkrijk van koning Arthahsasta.", "2": "Van de kinderen van Pinehas, Gersom; van de kinderen van Ithamar, Daniël; van de kinderen van David, Hattus.", "3": "Van de kinderen van Sechanja, van de kinderen van Paros, Zacharja; en met hem werden bij geslachtsregisters gerekend, aan mannen, honderdvijftig.", "4": "Van de kinderen van Pahath-moab, Eljehoenai, de zoon van Zerahja; en met hem tweehonderd mannen.", "5": "Van de kinderen van Sechanja, de zoon van Jahaziël; en met hem driehonderd mannen.", "6": "En van de kinderen van Adin, Ebed, de zoon van Jonathan; en met hem vijftig mannen.", "7": "En van de kinderen van Elam, Jesaja, de zoon van Athalja; en met hem zeventig mannen.", "8": "En van de kinderen van Sefatja, Zebadja, de zoon van Michaël; en met hem tachtig mannen.", "9": "En van de kinderen van Joab, Obadja, de zoon van Jehiël; en met hem tweehonderdachttien mannen.", "10": "En van de kinderen van Selomith, de zoon van Josifja; en met hem honderdzestig mannen.", "11": "En van de kinderen van Babai, Zacharja, de zoon van Bebai; en met hem achtentwintig mannen.", "12": "En van de kinderen van Azgad, Johanan, de zoon van Katan; en met hem honderdtien mannen.", "13": "En van de laatste kinderen van Adonikam, van wie de namen deze waren: Elifelet, Jehiël, en Semaja; en met hen zestig mannen.", "14": "En van de kinderen van Bigvai, Uthai en Zabbud; en met hen zeventig mannen.", "15": "En ik verzamelde hen bij de rivier die naar Ahava gaat, en wij legerden ons daar drie dagen; toen lette ik op het volk en de priesters, en vond daar niemand van de kinderen van Levi.", "16": "Toen zond ik naar Eliëzer, naar Ariël, naar Semaja, en naar Elnathan, en naar Jarib, en naar Elnathan, en naar Nathan, en naar Zacharja, en naar Mesullam, de hoofden; en naar Jojarib en naar Elnathan, de leraars,", "17": "en ik gaf hun bevel aan Iddo, het hoofd in de plaats Chasifja; en ik legde de woorden in hun mond om te zeggen tegen Iddo, zijn broeder, *en* de Nethinim, in de plaats Chasifja, dat zij ons dienaars zouden brengen voor het huis van onze God.", "18": "En zij brachten ons, naar de goede hand van onze God over ons, een man van verstand, van de kinderen van Mahli, de zoon van Levi, de zoon van Israël; namelijk Serebja, met zijn zonen en broeders, achttien;", "19": "en Hasabja, en met hem Jesaja, van de kinderen van Merari, *met* zijn broeders, en hun zonen, twintig;", "20": "en van de Nethinim, die David en de vorsten ten dienste van de Levieten gegeven hadden, tweehonderdtwintig Nethinim, die allen bij naam genoemd werden.", "21": "Toen riep ik daar een vasten uit bij de rivier Ahava, opdat wij ons zouden verootmoedigen voor het aangezicht van onze God, om van Hem te verzoeken een rechte weg, voor ons, en voor onze kinderen, en voor al onze have.", "22": "Want ik schaamde mij om van de koning een leger en ruiters te vragen om ons te helpen tegen de vijand, op de weg; omdat wij tegen de koning gesproken hadden en gezegd: De hand van onze God is ten goede over allen die Hem zoeken, maar Zijn sterkte en Zijn toorn over allen die Hem verlaten.", "23": "Zo vastten wij en verzochten dat van onze God; en Hij liet Zich door ons verbidden.", "24": "Toen scheidde ik twaalf uit van de leiders van de priesters: Serebja, Hasabja, en tien van hun broeders met hen.", "25": "En ik woog hun toe het zilver, en het goud, en de vaten, zijnde de offering van het huis van onze God die de koning en zijn raadsheren, en zijn vorsten, en heel Israël, die daar gevonden werden, geofferd hadden;", "26": "ik woog dan aan hun hand zeshonderdvijftig talenten van het zilver, en honderd zilveren vaten in talenten; aan goud, honderd talenten;", "27": "en twintig gouden bekers, tot duizend drachmen; en twee vaten van blinkend goed koper, begeerlijk als goud.", "28": "En ik zei tegen hen: U bent heilig voor de HEERE, en deze vaten zijn heilig; ook dit zilver en dit goud, de vrijwillige gave, voor de HEERE, de God van uw vaderen.", "29": "Waak en bewaar het, totdat u het opweegt, in tegenwoordigheid van de leiders van de priesters en Levieten, en van de vorsten van de vaderen van Israël, te Jeruzalem, in de kamers van het huis van de HEERE.", "30": "Toen ontvingen de priesters en de Levieten het gewicht van het zilver en van het goud, en van de vaten, om ze te brengen te Jeruzalem, naar het huis van onze God.", "31": "Zo braken wij op van de rivier Ahava, op de twaalfde van de eerste maand, om te gaan naar Jeruzalem; en de hand van onze God was over ons, en redde ons uit de hand van de vijand, en van hen die ons op de weg opwachtten om te overvallen.", "32": "En wij kwamen te Jeruzalem; en wij bleven daar drie dagen.", "33": "Op de vierde dag nu werd het zilver, en het goud, en de vaten, gewogen in het huis van onze God, aan de hand van Meremoth, de zoon van Uria, de priester, en met hem Eleazar, de zoon van Pinehas; en met hen Jozabad, de zoon van Jesua, en Noadja, de zoon van Binnui, de Levieten.", "34": "Naar het getal en naar het gewicht van dat alles; en het hele gewicht werd op datzelfde moment opgeschreven.", "35": "*En* de weggevoerden, die uit de gevangenschap gekomen waren, offerden aan de God van Israël brandoffers; twaalf jonge stieren voor heel Israël, zesennegentig rammen, zevenenzeventig lammeren, twaalf bokken tot zondoffer; alles tot brandoffer voor de HEERE.", "36": "Daarna gaven zij de wetten van de koning aan de stadhouders van de koning en landvoogden aan deze kant van de rivier; en zij bevorderden het volk en het huis van God."}, "SV": {"1": "Dit nu zijn de hoofden hunner vaderen, met hun geslachtsrekening, die met mij uit Babel optogen, onder het koninkrijk van den koning Arthahsasta.", "2": "Van de kinderen van Pinehas, Gersom; van de kinderen van Ithamar, Daniël; van de kinderen van David, Hattus.", "3": "Van de kinderen van Sechanja, van de kinderen van Paros, Zacharja; en met hem werden bij geslachtsregisters gerekend, aan manspersonen, honderd en vijftig.", "4": "Van de kinderen van Pahath-moab, Eljehoenai, de zoon van Zerahja; en met hem tweehonderd manspersonen.", "5": "Van de kinderen van Sechanja, de zoon van Jahaziel; en met hem driehonderd manspersonen.", "6": "En van de kinderen van Adin, Ebed, de zoon van Jonathan; en met hem vijftig manspersonen.", "7": "En van de kinderen van Elam, Jesaja, de zoon van Athalja; en met hem zeventig manspersonen.", "8": "En van de kinderen van Sefatja, Zebadja, de zoon van Michaël; en met hem tachtig manspersonen.", "9": "En van de kinderen van Joab, Obadja, de zoon van Jehiel; en met hem tweehonderd en achttien manspersonen.", "10": "En van de kinderen van Selomith, de zoon van Josifja; en met hem honderd en zestig manspersonen.", "11": "En van de kinderen van Babai, Zacharja, de zoon van Bebai; en met hem acht en twintig manspersonen.", "12": "En van de kinderen van Azgad, Johanan, de zoon van Katan; en met hem honderd en tien manspersonen.", "13": "En van de laatste kinderen van Adonikam, welker namen deze waren: Elifelet, Jehiel, en Semaja; en met hen zestig manspersonen.", "14": "En van de kinderen van Bigvai, Uthai en Zabbud; en met hen zeventig manspersonen.", "15": "En ik vergaderde hen aan de rivier, gaande naar Ahava, en wij legerden ons aldaar drie dagen; toen lette ik op het volk en de priesteren, en vond aldaar geen van de kinderen van Levi.", "16": "Zo zond ik tot Eliëzer, tot Ariël, tot Semaja, en tot Elnathan, en tot Jarib, en tot Elnathan, en tot Nathan, en tot Zacharja, en tot Mesullam, de hoofden; en tot Jojarib en tot Elnathan, de leraars;", "17": "En ik gaf hun bevel aan Iddo, het hoofd in de plaats Chasifja; en ik leide de woorden in hun mond, om te zeggen tot Iddo, zijn broeder, *en* de Nethinim, in de plaats Chasifja, dat zij ons brachten dienaars voor het huis onzes Gods.", "18": "En zij brachten ons, naar de goede hand onzes Gods over ons, een man van verstand, van de kinderen van Mahli, den zoon van Levi, den zoon van Israël; namelijk Serebja, met zijn zonen en broederen, achttien;", "19": "En Hasabja, en met hem Jesaja, van de kinderen van Merari, *met* zijn broederen, en hun zonen, twintig;", "20": "En van Nethinim, die David en de vorsten ten dienste der Levieten gegeven hadden, tweehonderd en twintig Nethinim, die allen bij namen genoemd werden.", "21": "Toen riep ik aldaar een vasten uit aan de rivier Ahava, opdat wij ons verootmoedigden voor het aangezicht onzes Gods, om van Hem te verzoeken een rechten weg, voor ons, en voor onze kinderkens, en voor al onze have.", "22": "Want ik schaamde mij van den koning een heir en ruiters te begeren, om ons te helpen van den vijand, op den weg; omdat wij tot den koning hadden gesproken, zeggende: De hand onzes Gods is ten goede over allen, die Hem zoeken, maar Zijn sterkte en Zijn toorn over allen, die Hem verlaten.", "23": "Alzo vastten wij; en verzochten zulks van onzen God; en Hij liet zich van ons verbidden.", "24": "Toen scheidde ik twaalf uit van de oversten der priesteren: Serebja, Hasabja, en tien van hun broederen met hen.", "25": "En ik woog hun toe het zilver, en het goud, en de vaten, zijnde de offering van het huis onzes Gods die de koning en zijn raadsheren, en zijn vorsten, en gans Israël, die er gevonden werden, geofferd hadden;", "26": "Ik woog dan aan hun hand zeshonderd en vijftig talenten zilvers, en honderd zilveren vaten in talenten; aan goud, honderd talenten;", "27": "En twintig gouden bekers, tot duizend drachmen; en twee vaten van blinkend goed koper, begeerlijk als goud.", "28": "En ik zeide tot hen: Gij zijt heilig den HEERE, en deze vaten zijn heilig; ook dit zilver en dit goud, de vrijwillige gave, den HEERE, den God uwer vaderen.", "29": "Waakt en bewaart het, totdat gij het opweegt, in tegenwoordigheid van de oversten der priesteren en Levieten, en der vorsten der vaderen van Israël, te Jeruzalem, in de kameren van des HEEREN huis.", "30": "Toen ontvingen de priesters en de Levieten het gewicht des zilvers en des gouds, en der vaten, om te brengen te Jeruzalem, ten huize onzes Gods.", "31": "Alzo verreisden wij van de rivier Ahava, op den twaalfden der eerste maand, om te gaan naar Jeruzalem; en de hand onzes Gods was over ons, en redde ons van de hand des vijands, en desgenen, die *ons* lagen leide op den weg.", "32": "En wij kwamen te Jeruzalem; en wij bleven aldaar drie dagen.", "33": "Op den vierden dag nu werd gewogen het zilver, en het goud, en de vaten, in het huis onzes Gods, aan de hand van Meremoth, den zoon van Uria, den priester, en met hem Eleazar, de zoon van Pinehas; en met hen Jozabad, de zoon van Jesua, en Noadja, de zoon van Binnui, de Levieten.", "34": "Naar het getal en naar het gewicht van dat alles; en het ganse gewicht werd ter zelfder tijd opgeschreven.", "35": "*En* de weggevoerden, die uit de gevangenis gekomen waren, offerden den God Israëls brandofferen; twaalf varren voor gans Israël, zes en negentig rammen, zeven en zeventig lammeren, twaalf bokken ten zondoffer; alles ten brandoffer den HEERE.", "36": "Daarna gaven zij de wetten des konings aan des konings stadhouders en landvoogden aan deze zijde der rivier; en zij bevorderden het volk en het huis Gods."}, "KJV": {"1": "These *are* now the chief of their fathers, and *this is* the genealogy of them that went up with me from Babylon, in the reign of Artaxerxes the king.", "2": "Of the sons of Phinehas; Gershom: of the sons of Ithamar; Daniel: of the sons of David; Hattush.", "3": "Of the sons of Shechaniah, of the sons of Pharosh; Zechariah: and with him were reckoned by genealogy of the males an hundred and fifty.", "4": "Of the sons of Pahathmoab; Elihoenai the son of Zerahiah, and with him two hundred males.", "5": "Of the sons of Shechaniah; the son of Jahaziel, and with him three hundred males.", "6": "Of the sons also of Adin; Ebed the son of Jonathan, and with him fifty males.", "7": "And of the sons of Elam; Jeshaiah the son of Athaliah, and with him seventy males.", "8": "And of the sons of Shephatiah; Zebadiah the son of Michael, and with him fourscore males.", "9": "Of the sons of Joab; Obadiah the son of Jehiel, and with him two hundred and eighteen males.", "10": "And of the sons of Shelomith; the son of Josiphiah, and with him an hundred and threescore males.", "11": "And of the sons of Bebai; Zechariah the son of Bebai, and with him twenty and eight males.", "12": "And of the sons of Azgad; Johanan the son of Hakkatan, and with him an hundred and ten males.", "13": "And of the last sons of Adonikam, whose names *are* these, Eliphelet, Jeiel, and Shemaiah, and with them threescore males.", "14": "Of the sons also of Bigvai; Uthai, and Zabbud, and with them seventy males.", "15": "And I gathered them together to the river that runneth to Ahava; and there abode we in tents three days: and I viewed the people, and the priests, and found there none of the sons of Levi.", "16": "Then sent I for Eliezer, for Ariel, for Shemaiah, and for Elnathan, and for Jarib, and for Elnathan, and for Nathan, and for Zechariah, and for Meshullam, chief men; also for Joiarib, and for Elnathan, men of understanding.", "17": "And I sent them with commandment unto Iddo the chief at the place Casiphia, and I told them what they should say unto Iddo, *and* to his brethren the Nethinims, at the place Casiphia, that they should bring unto us ministers for the house of our God.", "18": "And by the good hand of our God upon us they brought us a man of understanding, of the sons of Mahli, the son of Levi, the son of Israel; and Sherebiah, with his sons and his brethren, eighteen;", "19": "And Hashabiah, and with him Jeshaiah of the sons of Merari, his brethren and their sons, twenty;", "20": "Also of the Nethinims, whom David and the princes had appointed for the service of the Levites, two hundred and twenty Nethinims: all of them were expressed by name.", "21": "Then I proclaimed a fast there, at the river of Ahava, that we might afflict ourselves before our God, to seek of him a right way for us, and for our little ones, and for all our substance.", "22": "For I was ashamed to require of the king a band of soldiers and horsemen to help us against the enemy in the way: because we had spoken unto the king, saying, The hand of our God *is* upon all them for good that seek him; but his power and his wrath *is* against all them that forsake", "23": "So we fasted and besought our God for this: and he was intreated", "24": "Then I separated twelve of the chief of the priests, Sherebiah, Hashabiah, and ten of their brethren", "25": "And weighed unto them the silver, and the gold, and the vessels, *even* the offering of the house of our God, which the king, and his counsellors, and his lords, and all Israel *there* present, had offered:", "26": "I even weighed unto their hand six hundred and fifty talents of silver, and silver vessels an hundred talents, *and* of gold an hundred talents;", "27": "Also twenty basons of gold, of a thousand drams; and two vessels of fine copper, precious as gold.", "28": "And I said unto them, Ye *are* holy unto the LORD; the vessels *are* holy also; and the silver and the gold *are* a freewill offering unto the LORD God of your fathers.", "29": "Watch ye, and keep *them*, until ye weigh *them* before the chief of the priests and the Levites, and chief of the fathers of Israel, at Jerusalem, in the chambers of the house of the LORD.", "30": "So took the priests and the Levites the weight of the silver, and the gold, and the vessels, to bring *them* to Jerusalem unto the house of our God.", "31": "Then we departed from the river of Ahava on the twelfth *day* of the first month, to go unto Jerusalem: and the hand of our God was upon us, and he delivered us from the hand of the enemy, and of such as lay in wait by the way.", "32": "And we came to Jerusalem, and abode there three days.", "33": "Now on the fourth day was the silver and the gold and the vessels weighed in the house of our God by the hand of Meremoth the son of Uriah the priest; and with him *was* Eleazar the son of Phinehas; and with them *was* Jozabad the son of Jeshua, and Noadiah the son of Binnui, Levites;", "34": "By number *and* by weight of every one: and all the weight was written at that time.", "35": "*Also* the children of those that had been carried away, which were come out of the captivity, offered burnt offerings unto the God of Israel, twelve bullocks for all Israel, ninety and six rams, seventy and seven lambs, twelve he goats *for* a sin offering: all *this was* a burnt offering unto the LORD.", "36": "And they delivered the k ertrek, vertrek, ga daarvandaan weg, raak het onreine niet aan; ga weg uit hun midden, reinig u, u die de voorwerpen van de HEERE draagt!", "Dan 1:20": "En in alle zaken van verstandige wijsheid, die de koning hun voorlegde, vond hij hen tien keer beter dan al de tovenaars en sterrenkijkers die in zijn hele koninkrijk waren.", "Num 14:31": "En uw kinderen, van wie u zei: Zij zullen tot roof worden! die zal Ik daarin brengen, en zij zullen dat land kennen dat u smadelijk verworpen hebt.", "Jer 3:15": "En Ik zal u herders geven naar Mijn hart; die zullen u weiden met kennis en verstand.", "Ezra 1:8": "En Kores, de koning van Perzië, liet ze uitgeven door de hand van Mithredath, de schatmeester, die ze overhandigde aan Sesbazar, de vorst van Juda, na ze geteld te hebben.", "Spr 20:5": "De raad in het hart van een man is als diepe wateren; maar een man van verstand zal die naar boven halen.", "Jes 42:16": "En Ik zal de blinden leiden door de weg die zij niet gekend hebben, Ik zal ze doen gaan door de paden die zij niet gekend hebben; Ik zal de duisternis voor hun ogen tot licht maken, en het kromme tot recht; deze dingen zal Ik hun doen, en Ik zal hen niet verlaten.", "Num 4:19": "Maar dit zult u voor hen doen, opdat zij leven en niet sterven, wanneer zij tot het allerheiligste naderen: Aäron en zijn zonen zullen komen, en hen ieder aanstellen over zijn dienst en zijn last.", "Ezra 7:28": "En heeft mij goedertierenheid bewezen, voor het aangezicht van de koning en zijn raadsheren, en van alle machtige vorsten van de koning! Zo heb ik mij gesterkt, naar de hand van de HEERE, mijn God, over mij, en de hoofden uit Israël vergaderd, om met mij op te trekken.", "Hand 20:31": "Daarom, waak, en bedenk dat ik drie jaar lang, nacht en dag, niet heb opgehouden ieder met tranen te vermanen.", "Hand 18:27": "En toen hij naar Achaje wilde reizen, spoorden de broeders hem aan en schreven aan de discipelen dat zij hem moesten ontvangen; en toen hij daar aangekomen was, heeft hij veel bijgedragen aan hen die door de genade geloofden.", "Spr 28:2": "Om de overtreding van het land zijn zijn vorsten met velen; maar door een verstandig en wetend mens zal het insgelijks lang blijven bestaan.", "Spr 24:3": "Door wijsheid wordt een huis gebouwd, en door verstandigheid bevestigd;", "Hand 25:3": "En vroegen hem een gunst tegen Paulus, namelijk dat hij hem zou laten overbrengen naar Jeruzalem; want zij hadden een hinderlaag gelegd om hem onderweg om te brengen.", "Jes 3:11": "Wee de goddeloze, het zal hem kwalijk gaan, want de vergelding van zijn handen zal hem overkomen.", "Ezra 2:6": "De kinderen van Pahath-moab, van de kinderen van Jesua-joab, tweeduizend achthonderdtwaalf.", "Openb 12:16": "En de aarde kwam de vrouw te hulp, en de aarde opende haar mond, en verzwolg de rivier, die de draak uit zijn mond had geworpen.", "Fil 4:3": "En ik bid ook u, mijn oprechte metgezel, wees deze vrouwen behulpzaam, die met mij gestreden hebben in het Evangelie, ook met Clemens, en de andere medearbeiders van mij, van wie de namen in het boek van het leven staan.", "Jer 29:12": "Dan zult u Mij aanroepen, en heengaan, en tot Mij bidden; en Ik zal naar u horen.", "Neh 2:8": "ook een brief aan Asaf, de bewaarder van het park van de koning, om mij hout te geven om er balken van te maken voor de poorten van het paleis dat bij het huis behoort, en voor de stadsmuur, en voor het huis waar ik zal intrekken. En de koning gaf ze mij, naar de goede hand van mijn God over mij.", "Spr 3:6": "Ken Hem in al uw wegen, en Hij zal uw paden recht maken.", "1 Kron 9:1": "Heel Israël werd in geslachtsregisters geteld, en zie, zij zijn geschreven in het boek van de koningen van Israël. En die van Juda waren weggevoerd naar Babel, vanwege hun overtredingen.", "Ps 137:1": "Aan de rivieren van Babel, daar zaten wij, ook weenden wij, als wij dachten aan Sion.", "2 Kron 24:14": "Toen zij het nu klaar hadden, brachten zij voor de koning en Jojada het overige van het geld, waarvan hij vaten maakte voor het huis van de HEERE, vaten om te dienen en te offeren, en rookschalen, en gouden en zilveren vaten; en zij offerden voortdurend brandoffers in het huis van de HEERE, al de dagen van Jojada.", "Num 18:6": "Want Ik, zie, Ik heb uw broeders, de Levieten, uit het midden van de kinderen van Israël genomen; zij zijn u een gave, gegeven aan de HEERE, om de dienst van de tent der samenkomst te bedienen.", "1 Kron 26:32": "En zijn broers waren dappere mannen, tweeduizend zevenhonderd hoofden van de families; en koning David stelde hen aan over de Rubenieten, en Gadieten, en de halve stam van de Manassieten, voor alle zaken van God en de zaken van de koning.", "Ezra 2:43": "De Nethinim. De kinderen van Ziha, de kinderen van Hasufa, de kinderen van Tabbaoth;", "Jes 58:3": "En zeggen: Waarom vasten wij, en ziet U het niet aan, waarom kwellen wij onze ziel, en weet U het niet? Zie, op de dag waarop u vast, vindt u uw genoegen, en u eist streng al uw arbeid.", "Jer 29:13": "En u zult Mij zoeken en vinden, wanneer u naar Mij zult vragen met heel uw hart.", "Ezra 2:4": "De kinderen van Sefatja, driehonderdtweeënzeventig.", "1 Kron 28:9": "En u, mijn zoon Salomo, ken de God van uw vader, en dien Hem met een volkomen hart en met een gewillige ziel; want de HEERE doorzoekt alle harten, en Hij doorziet elk bedenksel van de gedachten; als u Hem zoekt, zal Hij door u gevonden worden; maar als u Hem verlaat, zal Hij u voor altijd verstoten.", "Jer 33:3": "Roep tot Mij, en Ik zal u antwoorden, en Ik zal u grote en vaste dingen bekendmaken, die u niet weet.", "Fil 4:8": "Verder, broeders, alles wat waar is, alles wat eerbaar is, alles wat rechtvaardig is, alles wat rein is, alles wat lieflijk is, alles wat goed klinkt, als er enige deugd is, en als er enige lof is, denk daaraan;", "Num 7:27": "Een jonge stier, een ram, een lam dat eenjarig was, als brandoffer;", "Ezra 2:15": "De kinderen van Adin, vierhonderdvierenvijftig.", "Neh 11:4": "Te Jeruzalem dan woonden sommigen van de kinderen van Juda, en van de kinderen van Benjamin. Van de kinderen van Juda: Athaja, de zoon van Uzzia, de zoon van Zacharja, de zoon van Amarja, de zoon van Sefatja, de zoon van Mahalaleël, van de kinderen van Perez;", "Lev 16:31": "Dat zal voor u een sabbat van rust zijn, opdat u uzelf verootmoedigt; het is een eeuwige inzetting.", "2 Tim 4:5": "Maar u, wees waakzaam in alles, verdraag verdrukkingen, doe het werk van een evangelist, vervul uw dienst ten volle.", "Ps 5:9": "HEERE! Leid mij in Uw gerechtigheid, om mijn verspieders wil; richt Uw weg voor mijn aangezicht.", "Neh 7:9": "De kinderen van Sefatja, driehonderdtweeënzeventig;", "1 Kron 9:34": "Dit zijn de hoofden van de vaderen onder de Levieten, hoofden in hun geslachten; dezen woonden te Jeruzalem.", "Ps 34:17": "Pe. Het aangezicht van de HEERE is tegen hen die kwaad doen, om hun gedachtenis van de aarde uit te roeien.", "Ezech 1:1": "In het dertigste jaar, in de vierde maand, op de vijfde dag van die maand, toen ik te midden van de weggevoerden was bij de rivier Chebar, gebeurde het dat de hemelen werden geopend, en ik zag visioenen van God.", "Ezra 2:12": "De kinderen van Azgad, duizend tweehonderdtweeëntwintig.", "Ezra 7:16": "alsook al het zilver en goud, dat u vinden zult in het hele landschap van Babel, met de vrijwillige gave van het volk en van de priesters, die vrijwillig geven, voor het huis van hun God, dat te Jeruzalem is;", "2 Kron 26:12": "Het gehele getal van de hoofden van de vaderen, van de strijdbare helden, was tweeduizend zeshonderd.", "1 Sam 7:6": "En zij werden verzameld te Mizpa, en zij schepten water en goten het uit voor het aangezicht van de HEERE; en zij vastten die dag, en zeiden daar: Wij hebben tegen de HEERE gezondigd. Zo richtte Samuël de kinderen van Israël te Mizpa.", "Jer 10:23": "Ik weet, o HEERE! dat bij de mens zijn weg niet is; het is niet bij een man die wandelt, dat hij zijn gang oordeelt.", "Ezra 7:15": "en om het zilver en goud daarheen te brengen, dat de koning en zijn raadsheren vrijwillig gegeven hebben aan de God van Israël, Wiens woning te Jeruzalem is;", "1 Kron 24:31": "En zij wierpen ook loten, samen met hun broeders, de zonen van Aäron, voor het aangezicht van koning David, en Zadok, en Achimelech, en van de familiehoofden onder de priesters en onder de Levieten; het familiehoofd tegenover zijn jongste broer.", "Jer 50:4": "In die dagen en op die tijd, spreekt de HEERE, zullen de kinderen van Israël komen, zij en de kinderen van Juda samen; wandelend en wenend zullen zij heengaan, en de HEERE, hun God, zoeken.", "2 Kor 8:20": "Dit voorkomend, dat ons niemand zou kunnen belasteren in deze overvloed, die door ons wordt bediend;", "Ezra 6:13": "Toen deden Thathnai, de landvoogd aan de overkant van de rivier, Sthar-boznai, en hun gezelschap, spoedig zo, naar wat koning Darius gezonden had.", "1 Kron 29:2": "Ik heb nu uit al mijn kracht klaargemaakt voor het huis van mijn God: goud voor de gouden dingen, en zilver voor de zilveren, en koper voor de koperen, ijzer voor de ijzeren, en hout voor de houten werken; sardonyxstenen en stenen om in te zetten, glanzende stenen en stenen van verschillende kleuren, en allerlei kostbare stenen, en marmerstenen in overvloed.", "1 Kron 6:19": "De kinderen van Merari waren Maheli en Musi. En dit zijn de families van de Levieten, naar hun vaderen.", "Neh 3:4": "En aan hun hand verbeterde Meremoth, de zoon van Uria, de zoon van Koz; en aan hun hand verbeterde Mesullam, de zoon van Berechja, de zoon van Mesezabeël; en aan hun hand verbeterde Zadok, zoon van Baëna.", "Klaagl 3:25": "Teth. De HEERE is goed voor hen die Hem verwachten, voor de ziel die Hem zoekt.", "Neh 9:1": "Verder, op de vierentwintigste dag van deze maand verzamelden de kinderen van Israël zich met vasten en met zakken, en aarde was op hen.", "Ezra 7:13": "Van mij wordt bevel gegeven dat ieder die vrijwillig is in mijn koninkrijk, van het volk van Israël, en van diens priesters en Levieten, om te gaan naar Jeruzalem, dat hij met u gaat.", "Hand 16:13": "En op de dag van de sabbat gingen wij de stad uit, naar de rivier, waar men gewoonlijk bad; en wij gingen zitten en spraken tot de vrouwen die daar samengekomen waren.", "Neh 10:9": "En de Levieten, namelijk: Jesua, zoon van Azanja, Binnui; van de zonen van Henadad, Kadmiel;", "Jes 56:6": "En de vreemdelingen, die zich bij de HEERE voegen om Hem te dienen, en om de Naam van de HEERE lief te hebben, om Hem tot knechten te zijn; ieder die de sabbat houdt, zodat hij die niet ontheiligt, en die aan Mijn verbond vasthouden;", "Neh 9:4": "Jesua nu, en Bani, Kadmiel, Sebanja, Bunni, Serebja, Bani en Chenani, stonden op het hoge gestoelte van de Levieten, en riepen met luide stem tot de HEERE, hun God;", "Jer 31:9": "Zij zullen komen met geween, en met smekingen zal Ik hen leiden; Ik zal hen leiden aan de waterbeken, op een rechte weg, waarop zij zich niet zullen stoten; want Ik ben Israël tot een Vader, en Efraïm is Mijn eerstgeborene.", "Num 4:20": "Maar zij zullen niet binnenkomen om te kijken wanneer men het heiligdom inpakt, opdat zij niet sterven.", "Lev 1:1": "En de HEERE riep Mozes, en sprak tot hem uit de tent van de samenkomst, en zei:", "Ezra 7:9": "Want op de eerste dag van de eerste maand was het begin van het optocht uit Babel, en op de eerste dag van de vijfde maand kwam hij in Jeruzalem, naar de goede hand van zijn God over hem.", "2 Kor 7:14": "Want als ik iets bij hem over u geroemd heb, ben ik daarmee niet beschaamd geworden; maar zoals wij alles met waarheid tot u gesproken hebben, zo is ook onze roem, waarmee ik bij Titus geroemd heb, waarheid geworden.", "Jes 58:5": "Zou dit zulk een vasten zijn dat Ik verkiezen zou, dat de mens zijn ziel een dag kwelt, dat hij zijn hoofd kromt zoals een bieze, en een zak en as onder zich spreidt? Zou u dat een vasten noemen, en een dag die de HEERE aangenaam is?", "Neh 3:17": "Na hem verbeterden de Levieten, Rehum, de zoon van Bani; aan zijn hand verbeterde Hasabja, de leider van het halve deel van Kehila, in zijn deel.", "Ps 34:23": "De HEERE verlost de ziel van Zijn knechten; en allen die op Hem vertrouwen, zullen niet schuldig verklaard worden.", "Neh 9:5": "En de Levieten, Jesua, en Kadmiel, Bani, Hasabneja; Serebja, Hodia, Sebanja, Petahja, zeiden: Sta op, loof de HEERE, uw God, van eeuwigheid tot in eeuwigheid; en men love de Naam van Uw heerlijkheid, die verhoogd is boven alle lof en prijs!", "Ezra 10:28": "En van de kinderen van Bebai: Johanan, Hananja, Sabbai, en Athlai.", "Lev 22:3": "Zeg tegen hen: Elke man onder uw geslachten, uit uw hele nageslacht, die tot de heilige dingen zal naderen die de kinderen van Israël de HEERE heiligen, terwijl zijn onreinheid op hem is; die mens zal van voor Mijn aangezicht uitgeroeid worden; Ik ben de HEERE!", "1 Joh 5:20": "Maar wij weten dat de Zoon van God gekomen is, en ons het verstand gegeven heeft, opdat wij de Waarachtige kennen; en wij zijn in de Waarachtige, namelijk in Zijn Zoon Jezus Christus. Deze is de waarachtige God, en het eeuwige Leven.", "Num 3:20": "En de zonen van Merari, naar hun geslachten: Maheli en Musi; dit zijn de geslachten van de Levieten, naar het huis van hun vaderen.", "1 Kron 12:32": "En van de kinderen van Issaschar, die verstand hadden van de tijden, om te weten wat Israël moest doen; hun hoofden waren tweehonderd, en al hun broeders volgden hun woord;", "Mark 13:35": "Waak dan (want u weet niet wanneer de heer des huizes zal komen, laat in de avond, of te middernacht, of bij het hanengekraai, of in de ochtend);", "1 Kron 26:14": "Het lot nu voor het oosten viel op Salemja; maar voor zijn zoon Zecharja, die een verstandig raadsman was, wierp men het lot, en zijn lot kwam uit voor het noorden;", "Ps 122:9": "Om het huis van de HEERE, onze God, zal ik het goede voor u zoeken.", "Tit 1:5": "Om die reden heb ik u op Kreta gelaten, opdat u, wat nog ontbrak, verder zou regelen, en dat u van stad tot stad oudsten zou aanstellen, zoals ik u bevolen heb:", "Lev 16:29": "En dit zal voor u een eeuwige inzetting zijn: u zult in de zevende maand, op de tiende van de maand, uzelf verootmoedigen, en geen enkel werk doen, of het nu een geboren Israëliet is of een vreemdeling die te midden van u verblijft.", "2 Kron 33:13": "En bad tot Hem; en Hij liet Zich door hem verbidden, en hoorde zijn smeking, en Hij bracht hem terug naar Jeruzalem, in zijn koninkrijk. Toen erkende Manasse, dat de HEERE God is.", "Lev 23:29": "Want elke ziel, die op diezelfde dag niet verootmoedigd zal zijn geweest, die zal uitgeroeid worden uit haar volk.", "Ps 21:9": "Uw hand zal alle vijanden vinden; uw rechterhand zal uw haters vinden.", "Hebr 10:38": "Maar de rechtvaardige zal uit het geloof leven; en als iemand zich terugtrekt, heeft Mijn ziel in hem geen behagen.", "Neh 7:17": "De kinderen van Azgad, tweeduizend driehonderdtweeëntwintig;", "Ezra 10:21": "En van de kinderen van Harim: Maaseja, en Elia, en Semaja, en Jehiel, en Uzia,", "Ps 34:16": "Ain. De ogen van de HEERE zijn op de rechtvaardigen, en Zijn oren gericht op hun geroep.", "Neh 10:16": "Adonia, Bigvai, Adin,", "Rom 8:28": "En wij weten dat voor hen die God liefhebben, alle dingen meewerken ten goede, namelijk voor hen die naar Zijn voornemen geroepen zijn.", "Jer 15:19": "Daarom zegt de HEERE zo: Als u zult terugkeren, zal Ik u laten terugkeren; u zult voor Mijn aangezicht staan; en als u het kostbare van het waardeloze scheidt, zult u als Mijn mond zijn; laat hen naar u terugkeren, maar u zult niet naar hen terugkeren.", "Matt 7:8": "Want ieder die bidt, ontvangt; en wie zoekt, vindt; en wie klopt, voor hem zal opengedaan worden.", "Ezra 2:11": "De kinderen van Bebai, zeshonderddrieëntwintig.", "Jes 35:8": "En daar zal een verheven baan, en een weg zijn, die de heilige weg genoemd zal worden; de onreine zal er niet doorgaan, maar hij zal voor deze zijn; wie deze weg gaat, zelfs de dwazen zullen niet dwalen.", "Neh 12:24": "De hoofden dan van de Levieten waren Hasabja, Serebja, en Jesua, de zoon van Kadmiel, en hun broeders tegenover hen, om te prijzen en te danken, naar het gebod van David, de man van God, wacht tegenover wacht.", "Deut 4:29": "Dan zult u vandaar de HEERE, uw God, zoeken, en vinden; als u Hem zoekt met heel uw hart en met heel uw ziel.", "Ezra 2:62": "Dezen zochten hun register, onder hen die in het geslachtsregister opgenomen waren, maar zij werden niet gevonden; daarom werden zij als onreinen van het priesterschap geweerd.", "Ezra 2:3": "De kinderen van Paros, tweeduizend honderdtweeënzeventig.", "1 Kron 29:3": "En daarbij, uit mijn genegenheid voor het huis van mijn God, geef ik mijn eigen goud en zilver, dat ik heb, aan het huis van mijn God, boven op alles wat ik al voor het heilige huis klaargemaakt heb;", "Ps 33:18": "Zie, het oog van de HEERE is over hen die Hem vrezen, op hen die op Zijn goedertierenheid hopen.", "Ezra 2:14": "De kinderen van Bigvai, tweeduizend zesenvijftig.", "Ezra 7:6": "Deze Ezra trok op uit Babel; en hij was een vaardig schriftgeleerde in de wet van Mozes, die de HEERE, de God van Israël, gegeven heeft; en de koning gaf hem, naar de hand van de HEERE, zijn God, over hem, al zijn verzoek.", "Lev 22:2": "Spreek tot Aäron en tot zijn zonen, dat zij zich afzonderen van de heilige dingen van de kinderen van Israël, die zij Mij heiligen, opdat zij de Naam van Mijn heiligheid niet ontheiligen; Ik ben de HEERE!", "Jes 60:13": "De heerlijkheid van Libanon zal tot u komen, de dennenboom, de beukenboom en de busboom tegelijk, om de plaats van Mijn heiligdom te versieren, en Ik zal de plaats van Mijn voeten heerlijk maken.", "1 Kron 6:3": "En de kinderen van Amram waren Aäron, en Mozes en Mirjam; en de kinderen van Aäron waren Nadab en Abihu, Eleazar en Ithamar.", "Jes 3:10": "Zegt de rechtvaardige, dat het hem goed zal gaan; dat zij de vrucht van hun werken zullen eten.", "Neh 7:18": "De kinderen van Adonikam, zeshonderdzevenenzestig;", "Jer 1:9": "En de HEERE stak Zijn hand uit, en raakte mijn mond aan; en de HEERE zei tegen mij: Zie, Ik geef Mijn woorden in uw mond.", "Jes 19:22": "En de HEERE zal de Egyptenaars krachtig slaan, en genezen; en zij zullen zich tot de HEERE bekeren, en Hij zal Zich door hen laten verbidden, en Hij zal hen genezen.", "Spr 2:6": "Want de HEERE geeft wijsheid; uit Zijn mond komt kennis en verstand.", "Neh 7:19": "De kinderen van Bigvai, tweeduizend zevenenzestig;", "Ps 21:10": "U zult hen zetten als een vurige oven ter tijd van uw toornige aangezicht; de HEERE zal hen in Zijn toorn verslinden, en het vuur zal hen verteren.", "2 Kron 29:31": "En Hizkia antwoordde en zei: Nu hebt u uw handen aan de HEERE toegewijd, treed toe, en breng slachtoffers en lofoffers naar het huis van de HEERE; en de gemeente bracht slachtoffers en lofoffers, en ieder die vrijwillig van harte wilde, brandoffers.", "1 Kron 3:22": "De kinderen nu van Sechanja waren Semaja; en de kinderen van Semaja waren Hattus, en Jigeal, en Bariah, en Nearja, en Safat; zes.", "Neh 7:70": "Een deel nu van de hoofden van de vaderen gaf tot het werk. De Hattirsatha gaf tot de schat, aan goud, duizend drachmen, vijftig sprenkelschalen, vijfhonderddertig priesterrokken.", "Neh 7:11": "De kinderen van Pahath-Moab, van de kinderen van Jesua en Joab, tweeduizend achthonderdachttien;", "2 Tim 2:7": "Bedenk wat ik zeg; en de Heere geeft u inzicht in alle dingen.", "Neh 7:34": "De kinderen van de andere Elam, duizendtweehonderdvierenvijftig;", "Ezra 7:24": "Ook laten wij u weten, aangaande alle priesters en Levieten, zangers, poortwachters, Nethinim en dienaars van het huis van deze God, dat men de cijns, oude belasting en tol hun niet zal mogen opleggen.", "Hand 2:39": "Want voor u is de belofte, en voor uw kinderen, en voor allen die ver weg zijn, zoveel als de Heere, onze God, ertoe roepen zal.", "Ezra 7:7": "Ook sommigen van de kinderen van Israël, en van de priesters en de Levieten, en de zangers, en de poortwachters, en de Nethinim, trokken op naar Jeruzalem, in het zevende jaar van koning Arthahsasta.", "2 Kron 2:12": "Verder zei Huram: Geloofd zij de HEERE, de God van Israël, Die de hemel en de aarde gemaakt heeft, dat Hij aan de koning David een wijze zoon gegeven heeft, kloek in voorzichtigheid en verstand, die een huis voor de HEERE, en een huis voor zijn koninkrijk zal bouwen!", "Joz 23:16": "Wanneer u het verbond van de HEERE, uw God, overtreedt, dat Hij u geboden heeft, en u heengaat en dient andere goden, en u voor hen neerbuigt, zo zal de toorn van de HEERE over u ontsteken, en u zult haastig omkomen van het goede land, dat Hij u gegeven heeft.", "1 Kor 9:15": "Maar ik heb geen van deze dingen gebruikt. En ik heb dit niet geschreven, opdat het zo bij mij zou gebeuren; want het zou beter voor mij zijn te sterven, dan dat iemand deze mijn roem zou ijdel maken.", "Num 7:13": "En zijn offergave was: een zilveren schotel, waarvan het gewicht honderddertig sikkels was; een zilveren sprenkelschaal van zeventig sikkels, naar de sikkel van het heiligdom; beide vol meelbloem gemengd met olie, als spijsoffer;", "Ps 90:11": "Wie kent de sterkte van de toorn van U, en Uw verbolgenheid, naarmate U te vrezen bent?", "2 Kron 20:3": "Josafat nu werd bevreesd, en richtte zich erop om de HEERE te zoeken; en hij riep een vasten uit in heel Juda.", "1 Kor 14:20": "Broeders, word geen kinderen in het verstand, maar wees kinderen in de boosheid, en word in het verstand volwassen.", "1 Kron 6:16": "Zo zijn dan de kinderen van Levi: Gerson, Kahath en Merari.", "2 Kron 33:12": "En toen hij in nood verkeerde, zocht hij het aangezicht van de HEERE, zijn God, met ernst, en vernederde zich zeer voor het aangezicht van de God van zijn vaderen,", "Deut 18:18": "Een Profeet zal Ik hun doen opstaan uit hun broeders, zoals u; en Ik zal Mijn woorden in Zijn mond leggen, en Hij zal tot hen spreken alles wat Ik Hem gebieden zal.", "Ezra 2:58": "Al de Nethinim, en de kinderen van de knechten van Salomo, waren driehonderdtweeënnegentig.", "Richt 20:26": "Toen trokken alle kinderen van Israël en heel het volk op, en kwamen bij het huis van God, en weenden, en bleven daar voor het aangezicht van de HEERE, en vastten die dag tot de avond; en zij offerden brandoffers en dankoffers voor het aangezicht van de HEERE.", "1 Kron 6:1": "De kinderen van Levi waren Gerson, Kahath en Merari.", "Jona 3:5": "En de mensen van Nineve geloofden God; en zij riepen een vasten uit, en bekleedden zich met zakken, van hun grootste tot hun kleinste toe.", "Luk 1:74": "dat wij, verlost uit de hand van onze vijanden, Hem zonder vrees zouden dienen,", "Ezra 10:39": "En Selemja, en Nathan, en Adaja,", "Deut 33:8": "En van Levi zei hij: Uw Tummim en Uw Urim zijn bij de man, Uw gunstgenoot, die Gij beproefd hebt in Massa, met wie Gij getwist hebt aan de wateren van Meriba.", "Hand 26:22": "Nu, hulp van God ontvangen hebbende, sta ik tot op deze dag en getuig zowel tegen klein als groot; en zeg niets anders dan wat de profeten en Mozes gesproken hebben dat zou gebeuren;", "1 Kron 3:1": "Dit waren de kinderen van David die hem in Hebron geboren zijn: de eerstgeborene Amnon, van Ahinoam, de Jizreëlietische; de tweede Daniël, van Abigaïl, de Karmelietische;", "Neh 10:12": "Zakkur, Serebja, Sebanja,", "Ezra 2:7": "De kinderen van Elam, duizend tweehonderdvierenvijftig.", "Neh 7:8": "De kinderen van Parhos waren tweeduizend, honderdtweeënzeventig;", "Ezra 2:13": "De kinderen van Adonikam, zeshonderdzesenzestig.", "Ezech 3:15": "En ik kwam tot de weggevoerden te Tel-Abib, die aan de rivier Chebar woonden, en ik bleef daar zij woonden; ja, ik bleef daar verbaasd in het midden van hen zeven dagen.", "Ex 4:15": "U dan zult tot hem spreken, en de woorden in zijn mond leggen; en Ik zal met uw mond, en met zijn mond zijn; en Ik zal u leren, wat u doen zult.", "1 Kron 4:33": "En al hun dorpen, die rondom deze steden lagen, tot Baäl toe. Dit zijn hun woonplaatsen en hun geslachtsregister voor hen.", "Neh 7:20": "De kinderen van Adin, zeshonderdvijfenvijftig;", "Neh 8:8": "Jesua, Bani, Serebja, Jamin, Akkub, Sabbethai, Hodia, Maaseja, Kelita, Azaria, Jozabad, Hanan, Pelaja, en de Levieten onderwezen het volk in de wet. En het volk bleef op zijn plaats staan.", "Joël 1:14": "Heilig een vasten, roep een verbodsdag uit, verzamel de oudsten, en alle inwoners van dit land, naar het huis van de HEERE, uw God, en roep tot de HEERE.", "2 Kron 15:2": "En hij ging Asa tegemoet, en hij zei tegen hem: Hoor mij, Asa, en heel Juda en Benjamin! De HEERE is met u, zolang u met Hem bent; en als u Hem zoekt, zal Hij door u gevonden worden; maar als u Hem verlaat, zal Hij u verlaten.", "Klaagl 4:2": "Beth. De kostbare kinderen van Sion, tegen fijn goud geschat, hoe worden zij nu gelijkgesteld aan de aarden kruiken, het werk van de handen van een pottenbakker!", "Neh 10:5": "Harim, Meremoth, Obadja,", "2 Sam 14:19": "En de koning zei: Is de hand van Joab hierin met u? En de vrouw antwoordde en zei: Zo waarachtig als uw ziel leeft, mijn heer koning, niemand zou naar rechts of naar links kunnen afwijken van alles wat mijn heer de koning gesproken heeft; want uw dienaar Joab, hij heeft het mij opgedragen, en hij heeft al deze woorden in de mond van uw dienares gelegd;", "2 Kron 29:32": "En het aantal brandoffers, dat de gemeente bracht, was zeventig runderen, honderd rammen, tweehonderd lammeren; deze alle voor de HEERE tot brandoffer.", "1 Kron 9:2": "De eerste inwoners nu, die in hun bezitting, in hun steden kwamen, waren de Israëlieten, de priesters, de Levieten en de Nethinim.", "Lev 7:38": "die de HEERE Mozes geboden heeft op de berg Sinaï, op de dag dat Hij de kinderen van Israël gebood hun offergaven aan de HEERE te offeren, in de woestijn van Sinaï.", "Num 14:3": "En waarom brengt de HEERE ons naar dat land, om door het zwaard te vallen, en onze vrouwen en onze kinderen tot roof te worden? Zou het voor ons niet beter zijn om naar Egypte terug te keren?", "2 Kron 16:9": "Want wat de HEERE betreft, Zijn ogen doorlopen de hele aarde, om Zich sterk te bewijzen aan hen wier hart volkomen is tot Hem; hierin heeft u dwaas gedaan; want van nu af zullen er oorlogen tegen u zijn.", "Jes 49:10": "Zij zullen niet hongeren, noch dorsten, en de hitte en de zon zal hen niet steken; want hun Ontfermer zal ze leiden, en Hij zal hen bij de springaders van het water zachtjes leiden.", "Est 4:16": "Ga, verzamel alle Joden die te Susan gevonden worden, en vast voor mij, en eet of drink niet, drie dagen lang, nacht noch dag; ik en mijn jonge dochters zullen ook zo vasten, en zo zal ik tot de koning ingaan, wat niet naar de wet is. Wanneer ik dan omkom, dan kom ik om.", "Jer 50:5": "Zij zullen naar Sion vragen; op de weg hierheen zullen hun gezichten gericht zijn; zij zullen komen en zich bij de HEERE aansluiten, met een eeuwig verbond, dat niet zal worden vergeten.", "Jer 31:8": "Zie, Ik zal ze aanbrengen uit het land van het noorden, en zal hen verzamelen van de einden van de aarde; onder hen zullen blinden en lammen zijn, zwangere vrouwen en barenden samen; met een grote menigte zullen zij hierheen terugkomen.", "Neh 10:11": "Micha, Rehob, Hasabja,", "Dan 9:3": "En ik richtte mijn gezicht tot God, de HEERE, om Hem te zoeken met gebed en smekingen, met vasten, en een zak, en as.", "Luk 2:37": "En zij was een weduwe van ongeveer vierentachtig jaar, die niet week uit de tempel, maar God diende met vasten en bidden, nacht en dag.", "Luk 1:75": "in heiligheid en gerechtigheid voor Hem, al de dagen van ons leven.", "1 Kon 3:11": "En God zei tegen hem: Omdat u deze zaak gevraagd hebt, en niet voor uzelf een lang leven gevraagd hebt, en ook geen rijkdom voor uzelf gevraagd hebt, en ook niet het leven van uw vijanden gevraagd hebt, maar verstand gevraagd hebt voor uzelf om rechtszaken te kunnen beoordelen,", "Matt 7:7": "Bid, en u zal gegeven worden; zoek, en u zult vinden; klop, en u zal opengedaan worden.", "Ezra 1:5": "Toen maakten de hoofden van de families van Juda en Benjamin zich klaar, en de priesters en de Levieten, met ieder wiens geest God opwekte, om op te trekken en het huis van de HEERE te bouwen, dat te Jeruzalem woont.", "1 Kron 5:20": "Maar zij werden tegen hen geholpen, en de Hagarenen werden in hun hand gegeven, en allen die met hen waren; omdat zij tot God riepen in de strijd, liet Hij Zich door hen verbidden, omdat zij op Hem vertrouwden.", "2 Kor 8:21": "Als mensen die zorgen voor wat eerlijk is, niet alleen voor het oog van de Heere, maar ook voor het oog van de mensen.", "Neh 7:16": "De kinderen van Bebai, zeshonderdachtentwintig;", "Neh 7:12": "De kinderen van Elam, duizendtweehonderdvierenvijftig;", "1 Petr 3:12": "Want de ogen van de Heere zijn over de rechtvaardigen, en Zijn oren gericht op hun gebed; maar het aangezicht van de Heere is tegen hen die kwaad doen.", "Jes 56:7": "Die zal Ik ook brengen naar Mijn heilige berg, en Ik zal hen verheugen in Mijn huis van gebed; hun brandoffers en hun slachtoffers zullen aangenaam zijn op Mijn altaar; want Mijn huis zal een huis van gebed genoemd worden voor alle volken.", "Neh 10:14": "De hoofden van het volk: Parhos, Pahath-Moab, Elam, Zatthu, Bani,", "Ezra 2:31": "De kinderen van de andere Elam, duizend tweehonderdvierenvijftig.", "Ps 8:3": "Uit de mond van de kinderen en de zuigelingen hebt U sterkte gegrondvest, omwille van Uw tegenstanders, om de vijand en de wraakgierige te doen ophouden.", "2 Sam 14:3": "En ga naar de koning, en spreek tot hem naar dit woord. En Joab legde de woorden in haar mond.", "Ezra 6:17": "En zij offerden, ter inwijding van dit huis van God, honderd runderen, tweehonderd rammen, vierhonderd lammeren en twaalf geitenbokken, tot zondoffer voor heel Israël, naar het getal van de stammen van Israël.", "Jes 30:21": "En uw oren zullen het woord horen van hem die achter u is, die zegt: Dit is de weg, wandelt daarin; als u zou afwijken naar rechts of naar links.", "Hand 10:30": "En Cornelius zei: Vier dagen geleden was ik aan het vasten tot dit uur toe, en op het negende uur bad ik in mijn huis,", "Neh 7:71": "En anderen van de hoofden van de vaderen gaven tot de schat van het werk, aan goud, twintigduizend drachmen, en aan zilver, tweeduizend tweehonderd ponden.", "Ps 33:19": "Om hun ziel van de dood te redden, en om hen bij het leven te houden in de honger.", "Mark 13:34": "Zoals een man die naar het buitenland reisde, zijn huis verliet, en zijn dienaren macht gaf, en ieder zijn werk, en de deurwachter gebood dat hij zou waken;"}, "noten": {}, "koppeling": {"1": "<span class=\"wl\" data-l=\"L1\" data-code=\"H428\">Dit</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H428\">zijn</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H7218\">nu</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H7218\">de</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H7218\">hoofden</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H7218\">van</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H1\">hun</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H1\">vaderen</span>, <span class=\"wl\" data-l=\"L3\" data-code=\"H1\">met</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H3187\">hun</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H3187\">geslachtsrekening</span>, <span class=\"wl\" data-l=\"L5\" data-code=\"H5973\">die</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H5973\">met</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H4480\">mij</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H4480\">uit</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H894\">Babel</span> optrokken, <span class=\"wl\" data-l=\"L8\" data-code=\"H4438\">onder</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H4438\">het</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H4438\">koninkrijk</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H4438\">van</span> <span class=\"wl\" data-l=\"L9\" data-code=\"H4428\">koning</span> <span class=\"wl\" data-l=\"L10\" data-code=\"H783\">Arthahsasta</span>.", "2": "<span class=\"wl\" data-l=\"L1\" data-code=\"H4480\">Van</span> <span class=\"wl\" data-l=\"L1\" da /span> males.", "15": "And I gathered them <span class=\"wl wl-kjv\" data-code=\"H6908\">together</span> to the <span class=\"wl wl-kjv\" data-code=\"H5104\">river</span> that <span class=\"wl wl-kjv\" data-code=\"H935\">runneth</span> to <span class=\"wl wl-kjv\" data-code=\"H163\">Ahava;</span> and there abode we in <span class=\"wl wl-kjv\" data-code=\"H2583\">tents</span> <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days:</span> and I <span class=\"wl wl-kjv\" data-code=\"H995\">viewed</span> the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests,</span> and <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> there none of the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of Levi.", "16": "Then <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> I for <span class=\"wl wl-kjv\" data-code=\"H461\">Eliezer,</span> for <span class=\"wl wl-kjv\" data-code=\"H740\">Ariel,</span> for <span class=\"wl wl-kjv\" data-code=\"H8098\">Shemaiah,</span> and for <span class=\"wl wl-kjv\" data-code=\"H494\">Elnathan,</span> and for <span class=\"wl wl-kjv\" data-code=\"H3402\">Jarib,</span> and for <span class=\"wl wl-kjv\" data-code=\"H494\">Elnathan,</span> and for <span class=\"wl wl-kjv\" data-code=\"H5416\">Nathan,</span> and for <span class=\"wl wl-kjv\" data-code=\"H2148\">Zechariah,</span> and for <span class=\"wl wl-kjv\" data-code=\"H4918\">Meshullam,</span> chief <span class=\"wl wl-kjv\" data-code=\"H7218\">men;</span> also for <span class=\"wl wl-kjv\" data-code=\"H3114\">Joiarib,</span> and for <span class=\"wl wl-kjv\" data-code=\"H494\">Elnathan,</span> men of understanding.", "17": "And I <span class=\"wl wl-kjv\" data-code=\"H6680\">sent</span> them with <span class=\"wl wl-kjv\" data-code=\"H3318\">commandment</span> unto <span class=\"wl wl-kjv\" data-code=\"H112\">Iddo</span> the <span class=\"wl wl-kjv\" data-code=\"H7218\">chief</span> at the <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> <span class=\"wl wl-kjv\" data-code=\"H3703\">Casiphia,</span> and I <span class=\"wl wl-kjv\" data-code=\"H7760\">told</span> them <span class=\"wl wl-kjv\" data-code=\"H1697\">what</span> they should <span class=\"wl wl-kjv\" data-code=\"H1696\">say</span> unto <span class=\"wl wl-kjv\" data-code=\"H112\">Iddo,</span> and to his <span class=\"wl wl-kjv\" data-code=\"H251\">brethren</span> the <span class=\"wl wl-kjv\" data-code=\"H5411\">Nethinims,</span> at the <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> <span class=\"wl wl-kjv\" data-code=\"H3703\">Casiphia,</span> that they should <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> unto us <span class=\"wl wl-kjv\" data-code=\"H8334\">ministers</span> for the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of our God.", "18": "And by the <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of our <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> upon us they <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> us a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H7922\">understanding,</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H4249\">Mahli,</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H3878\">Levi,</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel;</span> and <span class=\"wl wl-kjv\" data-code=\"H8274\">Sherebiah,</span> with his <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> and his <span class=\"wl wl-kjv\" data-code=\"H251\">brethren,</span> <span class=\"wl wl-kjv\" data-code=\"H8083\">eighteen;</span>", "19": "And <span class=\"wl wl-kjv\" data-code=\"H2811\">Hashabiah,</span> and with him <span class=\"wl wl-kjv\" data-code=\"H3470\">Jeshaiah</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H4847\">Merari,</span> his <span class=\"wl wl-kjv\" data-code=\"H251\">brethren</span> and their <span class=\"wl wl-kjv\" data-code=\"H1121\">sons,</span> twenty;", "20": "Also of the <span class=\"wl wl-kjv\" data-code=\"H5411\">Nethinims,</span> whom <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> and the <span class=\"wl wl-kjv\" data-code=\"H8269\">princes</span> had <span class=\"wl wl-kjv\" data-code=\"H5414\">appointed</span> for the <span class=\"wl wl-kjv\" data-code=\"H5656\">service</span> of the <span class=\"wl wl-kjv\" data-code=\"H3881\">Levites,</span> two <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> and <span class=\"wl wl-kjv\" data-code=\"H6242\">twenty</span> <span class=\"wl wl-kjv\" data-code=\"H5411\">Nethinims:</span> all of them were <span class=\"wl wl-kjv\" data-code=\"H5344\">expressed</span> by name.", "21": "Then I <span class=\"wl wl-kjv\" data-code=\"H7121\">proclaimed</span> a <span class=\"wl wl-kjv\" data-code=\"H6685\">fast</span> there, at the <span class=\"wl wl-kjv\" data-code=\"H5104\">river</span> of <span class=\"wl wl-kjv\" data-code=\"H163\">Ahava,</span> that we might <span class=\"wl wl-kjv\" data-code=\"H6031\">afflict</span> ourselves <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> our <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> to <span class=\"wl wl-kjv\" data-code=\"H1245\">seek</span> of him a <span class=\"wl wl-kjv\" data-code=\"H3477\">right</span> <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> for us, and for our little <span class=\"wl wl-kjv\" data-code=\"H2945\">ones,</span> and for all our substance.", "22": "For I was <span class=\"wl wl-kjv\" data-code=\"H954\">ashamed</span> to <span class=\"wl wl-kjv\" data-code=\"H7592\">require</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> a band of <span class=\"wl wl-kjv\" data-code=\"H2428\">soldiers</span> and <span class=\"wl wl-kjv\" data-code=\"H6571\">horsemen</span> to <span class=\"wl wl-kjv\" data-code=\"H5826\">help</span> us against the <span class=\"wl wl-kjv\" data-code=\"H341\">enemy</span> in the <span class=\"wl wl-kjv\" data-code=\"H1870\">way:</span> because we had <span class=\"wl wl-kjv\" data-code=\"H559\">spoken</span> unto the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> The <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of our <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> is upon all them for <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> that <span class=\"wl wl-kjv\" data-code=\"H1245\">seek</span> him; but his <span class=\"wl wl-kjv\" data-code=\"H5797\">power</span> and his <span class=\"wl wl-kjv\" data-code=\"H639\">wrath</span> is against all them that forsake", "23": "So we <span class=\"wl wl-kjv\" data-code=\"H6684\">fasted</span> and <span class=\"wl wl-kjv\" data-code=\"H1245\">besought</span> our <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> for this: and he was intreated", "24": "Then I <span class=\"wl wl-kjv\" data-code=\"H914\">separated</span> <span class=\"wl wl-kjv\" data-code=\"H8147\">twelve</span> of the <span class=\"wl wl-kjv\" data-code=\"H8269\">chief</span> of the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests,</span> <span class=\"wl wl-kjv\" data-code=\"H8274\">Sherebiah,</span> <span class=\"wl wl-kjv\" data-code=\"H2811\">Hashabiah,</span> and <span class=\"wl wl-kjv\" data-code=\"H6235\">ten</span> of their brethren", "25": "And <span class=\"wl wl-kjv\" data-code=\"H8254\">weighed</span> unto them the <span class=\"wl wl-kjv\" data-code=\"H3701\">silver,</span> and the <span class=\"wl wl-kjv\" data-code=\"H2091\">gold,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3627\">vessels,</span> even the <span class=\"wl wl-kjv\" data-code=\"H8641\">offering</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of our <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> which the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> and his <span class=\"wl wl-kjv\" data-code=\"H3289\">counsellors,</span> and his <span class=\"wl wl-kjv\" data-code=\"H8269\">lords,</span> and all <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> there <span class=\"wl wl-kjv\" data-code=\"H4672\">present,</span> had offered:", "26": "I even <span class=\"wl wl-kjv\" data-code=\"H8254\">weighed</span> unto their <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> <span class=\"wl wl-kjv\" data-code=\"H8337\">six</span> <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> and <span class=\"wl wl-kjv\" data-code=\"H2572\">fifty</span> <span class=\"wl wl-kjv\" data-code=\"H3603\">talents</span> of <span class=\"wl wl-kjv\" data-code=\"H3701\">silver,</span> and <span class=\"wl wl-kjv\" data-code=\"H3701\">silver</span> <span class=\"wl wl-kjv\" data-code=\"H3627\">vessels</span> an <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> <span class=\"wl wl-kjv\" data-code=\"H3603\">talents,</span> and of <span class=\"wl wl-kjv\" data-code=\"H2091\">gold</span> an <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> talents;", "27": "Also <span class=\"wl wl-kjv\" data-code=\"H6242\">twenty</span> <span class=\"wl wl-kjv\" data-code=\"H3713\">basons</span> of <span class=\"wl wl-kjv\" data-code=\"H2091\">gold,</span> of a <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> <span class=\"wl wl-kjv\" data-code=\"H150\">drams;</span> and <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H3627\">vessels</span> of <span class=\"wl wl-kjv\" data-code=\"H2896\">fine</span> <span class=\"wl wl-kjv\" data-code=\"H5178\">copper,</span> <span class=\"wl wl-kjv\" data-code=\"H2532\">precious</span> as gold.", "28": "And I <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto them, Ye are <span class=\"wl wl-kjv\" data-code=\"H6944\">holy</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD;</span> the <span class=\"wl wl-kjv\" data-code=\"H3627\">vessels</span> are <span class=\"wl wl-kjv\" data-code=\"H6944\">holy</span> also; and the <span class=\"wl wl-kjv\" data-code=\"H3701\">silver</span> and the <span class=\"wl wl-kjv\" data-code=\"H2091\">gold</span> are a freewill <span class=\"wl wl-kjv\" data-code=\"H5071\">offering</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of your fathers.", "29": "<span class=\"wl wl-kjv\" data-code=\"H8245\">Watch</span> ye, and <span class=\"wl wl-kjv\" data-code=\"H8104\">keep</span> them, until ye <span class=\"wl wl-kjv\" data-code=\"H8254\">weigh</span> them <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H8269\">chief</span> of the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests</span> and the <span class=\"wl wl-kjv\" data-code=\"H3881\">Levites,</span> and <span class=\"wl wl-kjv\" data-code=\"H8269\">chief</span> of the <span class=\"wl wl-kjv\" data-code=\"H1\">fathers</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> at <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> in the <span class=\"wl wl-kjv\" data-code=\"H3957\">chambers</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the LORD.", "30": "So <span class=\"wl wl-kjv\" data-code=\"H6901\">took</span> the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests</span> and the <span class=\"wl wl-kjv\" data-code=\"H3881\">Levites</span> the <span class=\"wl wl-kjv\" data-code=\"H4948\">weight</span> of the <span class=\"wl wl-kjv\" data-code=\"H3701\">silver,</span> and the <span class=\"wl wl-kjv\" data-code=\"H2091\">gold,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3627\">vessels,</span> to <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> them to <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> unto the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of our God.", "31": "Then we <span class=\"wl wl-kjv\" data-code=\"H5265\">departed</span> from the <span class=\"wl wl-kjv\" data-code=\"H5104\">river</span> of <span class=\"wl wl-kjv\" data-code=\"H163\">Ahava</span> on the <span class=\"wl wl-kjv\" data-code=\"H8147\">twelfth</span> day of the <span class=\"wl wl-kjv\" data-code=\"H7223\">first</span> <span class=\"wl wl-kjv\" data-code=\"H2320\">month,</span> to <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> unto <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem:</span> and the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of our <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> was upon us, and he <span class=\"wl wl-kjv\" data-code=\"H5337\">delivered</span> us from the <span class=\"wl wl-kjv\" data-code=\"H3709\">hand</span> of the <span class=\"wl wl-kjv\" data-code=\"H341\">enemy,</span> and of such as lay in <span class=\"wl wl-kjv\" data-code=\"H693\">wait</span> by the way.", "32": "And we <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> and <span class=\"wl wl-kjv\" data-code=\"H3427\">abode</span> there <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> days.", "33": "Now on the <span class=\"wl wl-kjv\" data-code=\"H7243\">fourth</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> was the <span class=\"wl wl-kjv\" data-code=\"H3701\">silver</span> and the <span class=\"wl wl-kjv\" data-code=\"H2091\">gold</span> and the <span class=\"wl wl-kjv\" data-code=\"H3627\">vessels</span> <span class=\"wl wl-kjv\" data-code=\"H8254\">weighed</span> in the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of our <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> by the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of <span class=\"wl wl-kjv\" data-code=\"H4822\">Meremoth</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H223\">Uriah</span> the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest;</span> and with him was <span class=\"wl wl-kjv\" data-code=\"H499\">Eleazar</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H6372\">Phinehas;</span> and with them was <span class=\"wl wl-kjv\" data-code=\"H3107\">Jozabad</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H3442\">Jeshua,</span> and <span class=\"wl wl-kjv\" data-code=\"H5129\">Noadiah</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H1131\">Binnui,</span> Levites;", "34": "By <span class=\"wl wl-kjv\" data-code=\"H4557\">number</span> and by <span class=\"wl wl-kjv\" data-code=\"H4948\">weight</span> of every one: and all the <span class=\"wl wl-kjv\" data-code=\"H4948\">weight</span> was <span class=\"wl wl-kjv\" data-code=\"H3789\">written</span> at that time.", "35": "Also the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of those that had been carried <span class=\"wl wl-kjv\" data-code=\"H1473\">away,</span> which were come <span class=\"wl wl-kjv\" data-code=\"H935\">out</span> of the <span class=\"wl wl-kjv\" data-code=\"H7628\">captivity,</span> <span class=\"wl wl-kjv\" data-code=\"H7126\">offered</span> burnt <span class=\"wl wl-kjv\" data-code=\"H5930\">offerings</span> unto the <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> <span class=\"wl wl-kjv\" data-code=\"H8147\">twelve</span> <span class=\"wl wl-kjv\" data-code=\"H6499\">bullocks</span> for all <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> <span class=\"wl wl-kjv\" data-code=\"H8673\">ninety</span> and <span class=\"wl wl-kjv\" data-code=\"H8337\">six</span> <span class=\"wl wl-kjv\" data-code=\"H352\">rams,</span> <span class=\"wl wl-kjv\" data-code=\"H7657\">seventy</span> and <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H3532\">lambs,</span> <span class=\"wl wl-kjv\" data-code=\"H8147\">twelve</span> he <span class=\"wl wl-kjv\" data-code=\"H6842\">goats</span> for a sin <span class=\"wl wl-kjv\" data-code=\"H2403\">offering:</span> all this was a burnt <span class=\"wl wl-kjv\" data-code=\"H5930\">offering</span> unto the LORD.", "36": "And they <span class=\"wl wl-kjv\" data-code=\"H5414\">delivered</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H1881\">commissions</span> unto the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H323\">lieutenants,</span> and to the <span class=\"wl wl-kjv\" data-code=\"H6346\">governors</span> on this <span class=\"wl wl-kjv\" data-code=\"H5676\">side</span> the <span class=\"wl wl-kjv\" data-code=\"H5104\">river:</span> and they <span class=\"wl wl-kjv\" data-code=\"H5375\">furthered</span> the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> and the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of God."}};
