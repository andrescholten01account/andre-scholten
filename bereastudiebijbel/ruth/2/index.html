Sam": "2-samuel", "1 Kon": "1-koningen", "2 Kon": "2-koningen", "1 Kron": "1-kronieken", "2 Kron": "2-kronieken", "Ezra": "ezra", "Neh": "nehemia", "Est": "esther", "Job": "job", "Ps": "psalmen", "Spr": "spreuken", "Pred": "prediker", "Hoogl": "hooglied", "Jes": "jesaja", "Jer": "jeremia", "Klaagl": "klaagliederen", "Ezech": "ezechiel", "Dan": "daniel", "Hos": "hosea", "Joël": "joel", "Amos": "amos", "Obadja": "obadja", "Jona": "jona", "Micha": "micha", "Nahum": "nahum", "Hab": "habakuk", "Zef": "zefanja", "Hagg": "haggai", "Zach": "zacharia", "Mal": "maleachi", "Matt": "mattheus", "Mark": "markus", "Luk": "lukas", "Joh": "johannes", "Hand": "handelingen", "Rom": "romeinen", "1 Kor": "1-korinthe", "2 Kor": "2-korinthe", "Gal": "galaten", "Ef": "efeze", "Fil": "filippenzen", "Kol": "kolossenzen", "1 Tess": "1-thessalonicenzen", "2 Tess": "2-thessalonicenzen", "1 Tim": "1-timotheus", "2 Tim": "2-timotheus", "Tit": "titus", "Filem": "filemon", "Hebr": "hebreeen", "Jak": "jakobus", "1 Petr": "1-petrus", "2 Petr": "2-petrus", "1 Joh": "1-johannes", "2 Joh": "2-johannes", "3 Joh": "3-johannes", "Judas": "judas", "Openb": "openbaring"}}, "vertalingen": {"Berea": {"1": "Naomi had een bloedverwant van haar man, een man, machtig van vermogen, uit het geslacht van Elimelech; en zijn naam was Boaz.", "2": "En Ruth, de Moabitische, zei tegen Naomi: Laat mij toch naar het veld gaan, en aren oplezen achter hem in wiens ogen ik genade zal vinden. En zij zei tegen haar: Ga, mijn dochter!", "3": "Zo ging zij heen, en kwam en las op in het veld, achter de maaiers; en het overkwam haar bij toeval dat zij terechtkwam op een deel van het veld van Boaz, die uit het geslacht van Elimelech was.", "4": "En zie, Boaz kwam van Bethlehem, en zei tegen de maaiers: De HEERE zij met u! En zij zeiden tegen hem: De HEERE zegent u!", "5": "Daarna zei Boaz tegen zijn knecht, die over de maaiers gezet was: Van wie is deze jonge vrouw?", "6": "En de knecht, die over de maaiers gezet was, antwoordde en zei: Dit is de Moabitische jonge vrouw, die met Naomi teruggekomen is uit de velden van Moab;", "7": "en zij heeft gezegd: Laat mij toch oplezen en *aren* bij de schoven verzamelen, achter de maaiers; zo is zij gekomen en heeft gestaan vanaf de morgen tot nu toe; alleen is zij een beetje in huis gebleven.", "8": "Toen zei Boaz tegen Ruth: Hoort u niet, mijn dochter? Ga niet om in een ander veld op te lezen; ook zult u van hier niet weggaan, maar hier zult u zich bij mijn meiden houden.", "9": "Uw ogen zullen op dit veld zijn, dat zij zullen maaien, en u zult achter hen aan gaan; heb ik de knechten niet geboden dat men u niet aanraakt? Als u dorst hebt, ga dan naar de vaten, en drink van wat de knechten geschept zullen hebben.", "10": "Toen viel zij op haar gezicht, en boog zich ter aarde, en zei tegen hem: Waarom heb ik genade gevonden in uw ogen, dat u mij kent, terwijl ik een vreemde ben?", "11": "En Boaz antwoordde en zei tegen haar: Het is mij goed verteld, alles wat u bij uw schoonmoeder gedaan hebt, na de dood van uw man, en dat u uw vader en uw moeder, en het land van uw geboorte verlaten hebt, en heengegaan bent naar een volk dat u vroeger niet kende.", "12": "De HEERE vergeldt u uw daad, en uw loon zij volkomen, vanwege de HEERE, de God van Israël, onder Wiens vleugels u gekomen bent om toevlucht te nemen!", "13": "En zij zei: Laat mij genade vinden in uw ogen, mijn heer, omdat u mij getroost hebt, en omdat u naar het hart van uw dienstmaagd gesproken hebt, hoewel ik niet ben als een van uw dienstmaagden.", "14": "Toen het etenstijd was, zei Boaz tegen haar: Kom hierbij, en eet van het brood, en doop uw stukje in de azijn. Zo zat zij neer aan de zijde van de maaiers, en hij reikte haar geroost koren aan, en zij at, en werd verzadigd, en hield over.", "15": "Toen zij opstond om op te lezen, gebood Boaz zijn knechten: Laat haar ook tussen de schoven oplezen, en beschaamt haar niet.", "16": "Ja, laat ook opzettelijk wat van de handvollen voor haar vallen, en laat het liggen, zodat zij het opleest, en berispt haar niet.", "17": "Zo las zij op in dat veld, tot aan de avond; en zij sloeg uit wat zij opgelezen had, en het was ongeveer een efa[1] gerst.", "18": "En zij nam het op, en kwam in de stad; en haar schoonmoeder zag wat zij opgelezen had; ook bracht zij tevoorschijn wat zij van haar verzadiging overgehouden had, en gaf het haar.", "19": "Toen zei haar schoonmoeder tegen haar: Waar hebt u vandaag opgelezen, en waar hebt u gewerkt? Gezegend zij hij die u gekend heeft! En zij vertelde haar schoonmoeder bij wie zij gewerkt had, en zei: De naam van de man bij wie ik vandaag gewerkt heb, is Boaz.", "20": "Toen zei Naomi tegen haar schoondochter: Gezegend zij hij door de HEERE, Die Zijn goedertierenheid niet nagelaten heeft aan de levenden en aan de doden! Verder zei Naomi tegen haar: Die man is onze nabestaande; hij is een van onze lossers.", "21": "En Ruth, de Moabitische, zei: Ook heeft hij tegen mij gezegd: U zult zich bij de knechten houden die ik heb, totdat zij de hele oogst die ik heb, zullen hebben voltooid.", "22": "En Naomi zei tegen haar schoondochter Ruth: Het is goed, mijn dochter, dat u met zijn meiden uitgaat, opdat zij u niet lastigvallen in een ander veld.", "23": "Zo hield zij zich bij de meiden van Boaz, om op te lezen, totdat de gerste-oogst en de tarwe-oogst voltooid waren; en zij bleef bij haar schoonmoeder."}, "SV": {"1": "Naomi nu had een bloedvriend van haar man, een man, geweldig van vermogen, van het geslacht van Elimelech; en zijn naam was Boaz.", "2": "En Ruth, de Moabietische, zeide tot Naomi: Laat mij toch in het veld gaan, en van de aren oplezen, achter dien, in wiens ogen ik genade zal vinden. En zij zeide tot haar: Ga heen, mijn dochter!", "3": "Zo ging zij heen, en kwam en las op in het veld, achter de maaiers; en haar viel bij geval voor, een deel van het veld van Boaz, die van het geslacht van Elimelech was.", "4": "En ziet, Boaz kwam van Bethlehem, en zeide tot de maaiers: De HEERE zij met ulieden! En zij zeiden tot hem: De HEERE zegene u!", "5": "Daarna zeide Boaz tot zijn jongen, die over de maaiers gezet was: Wiens is deze jonge vrouw?", "6": "En de jongen, die over de maaiers gezet was, antwoordde en zeide: Deze is de Moabietische jonge vrouw, die met Naomi wedergekomen is uit de velden Moabs;", "7": "En zij heeft gezegd: Laat mij toch oplezen en *aren* bij de garven verzamelen, achter de maaiers; zo is zij gekomen en heeft gestaan van des morgens af tot nu toe; nu is haar te huis blijven weinig.", "8": "Toen zeide Boaz tot Ruth: Hoort gij niet, mijn dochter? Ga niet, om in een ander veld op te lezen; ook zult gij van hier niet weggaan, maar hier zult gij u houden bij mijn maagden.", "9": "Uw ogen zullen zijn op dit veld, dat zij maaien zullen, en gij zult achter haarlieden gaan; heb ik den jongens niet geboden, dat men u niet aanroere? Als u dorst, zo ga tot de vaten, en drink van hetgeen de jongens zullen geschept hebben.", "10": "Toen viel zij op haar aangezicht, en boog zich ter aarde, en zij zeide tot hem: Waarom heb ik genade gevonden in uw ogen, dat gij mij kent, daar ik een vreemde ben?", "11": "En Boaz antwoordde en zeide tot haar: Het is mij wel aangezegd alles, wat gij bij uw schoonmoeder gedaan hebt, na den dood uws mans, en hebt uw vader en uw moeder, en het land uwer geboorte verlaten, en zijt heengegaan tot een volk, dat gij van te voren niet kendet.", "12": "De HEERE vergelde u uw daad en uw loon zij volkomen, van den HEERE, den God Israëls, onder Wiens vleugelen gij gekomen zijt om toevlucht te nemen!", "13": "En zij zeide: Laat mij genade vinden in uw ogen, mijn heer, dewijl gij mij getroost hebt, en dewijl gij naar het hart uwer dienstmaagd gesproken hebt, hoewel ik niet ben, gelijk een uwer dienstmaagden.", "14": "Als het nu etenstijd was, zeide Boaz tot haar: Kom hier bij, en eet van het brood, en doop uw bete in den azijn. Zo zat zij neder aan de zijde van de maaiers, en hij langde haar geroost *koren*, en zij at, en werd verzadigd, en hield over.", "15": "Als zij nu opstond, om op te lezen, zo gebood Boaz zijn jongens, zeggende: Laat haar ook tussen de garven oplezen, en beschaamt haar niet.", "16": "Ja, laat ook allengskens van de handvollen voor haar wat vallen, en laat het liggen, dat zij het opleze, en bestraft haar niet.", "17": "Alzo las zij op in dat veld, tot aan den avond; en zij sloeg uit, wat zij opgelezen had, en het was omtrent een efa gerst.", "18": "En zij nam het op, en kwam in de stad; en haar schoonmoeder zag, wat zij opgelezen had; ook bracht zij voort, en gaf haar, wat zij van haar verzadiging overgehouden had.", "19": "Toen zeide haar schoonmoeder tot haar: Waar hebt gij heden opgelezen, en waar hebt gij gewrocht? Gezegend zij, die u gekend heeft! En zij verhaalde haar schoonmoeder, bij wien zij gewrocht had, en zeide: De naam des mans, bij welken ik heden gewrocht heb, is Boaz.", "20": "Toen zeide Naomi tot haar schoondochter: Gezegend zij hij den HEERE, Die Zijn weldadigheid niet heeft nagelaten aan de levenden en aan de doden! Voorts zeide Naomi tot haar: Die man is ons nabestaande; hij is een van onze lossers.", "21": "En Ruth, de Moabietische, zeide: Ook, omdat hij tot mij gezegd heeft: Gij zult u houden bij de jongens, die ik heb, totdat zij den gansen oogst, die ik heb, zullen hebben voleindigd.", "22": "En Naomi zeide tot haar schoondochter Ruth: Het is goed, mijn dochter, dat gij met zijn maagden uitgaat, opdat zij u niet tegenvallen in een ander veld.", "23": "Alzo hield zij zich bij de maagden van Boaz, om op te lezen, totdat de gersteoogst en tarweoogst voleindigd waren; en zij bleef bij haar schoonmoeder."}, "KJV": {"1": "And Naomi had a kinsman of her husband's, a mighty man of wealth, of the family of Elimelech; and his name *was* Boaz.", "2": "And Ruth the Moabitess said unto Naomi, Let me now go to the field, and glean ears of corn after *him* in whose sight I shall find grace. And she said unto her, Go, my daughter.", "3": "And she went, and came, and gleaned in the field after the reapers: and her hap was to light on a part of the field *belonging* unto Boaz, who *was* of the kindred of Elimelech.", "4": "And, behold, Boaz came from Bethlehem, and said unto the reapers, The LORD *be* with you. And they answered him, The LORD bless", "5": "Then said Boaz unto his servant that was set over the reapers, Whose damsel", "6": "And the servant that was set over the reapers answered and said, It *is* the Moabitish damsel that came back with Naomi out of the country of Moab:", "7": "And she said, I pray you, let me glean and gather after the reapers among the sheaves: so she came, and hath continued even from the morning until now, that she tarried a little in the house.", "8": "Then said Boaz unto Ruth, Hearest thou not, my daughter? Go not to glean in another field, neither go from hence, but abide here fast by my maidens:", "9": "*Let* thine eyes *be* on the field that they do reap, and go thou after them: have I not charged the young men that they shall not touch thee? and when thou art athirst, go unto the vessels, and drink of *that* which the young men have drawn.", "10": "Then she fell on her face, and bowed herself to the ground, and said unto him, Why have I found grace in thine eyes, that thou shouldest take knowledge of me, seeing I *am* a stranger?", "11": "And Boaz answered and said unto her, It hath fully been shewed me, all that thou hast done unto thy mother in law since the death of thine husband: and *how* thou hast left thy father and thy mother, and the land of thy nativity, and art come unto a people which thou knewest not heretofore.", "12": "The LORD recompense thy work, and a full reward be given thee of the LORD God of Israel, under whose wings thou art come to trust.", "13": "Then she said, Let me find favour in thy sight, my lord; for that thou hast comforted me, and for that thou hast spoken friendly unto thine handmaid, though I be not like unto one of thine handmaidens.", "14": "And Boaz said unto her, At mealtime come thou hither, and eat of the bread, and dip thy morsel in the vinegar. And she sat beside the reapers: and he reached her parched *corn*, and she did eat, and was sufficed, and left.", "15": "And when she was risen up to glean, Boaz commanded his young men, saying, Let her glean even among the sheaves, and reproach", "16": "And let fall also *some* of the handfuls of purpose for her, and leave *them*, that she may glean *them*, and rebuke", "17": "So she gleaned in the field until even, and beat out that she had gleaned: and it was about an ephah of barley.", "18": "And she took *it* up, and went into the city: and her mother in law saw what she had gleaned: and she brought forth, and gave to her that she had reserved after she was sufficed.", "19": "And her mother in law said unto her, Where hast thou gleaned to day? and where wroughtest thou? blessed be he that did take knowledge of thee. And she shewed her mother in law with whom she had wrought, and said, The man's name with whom I wrought to day *is* Boaz.", "20": "And Naomi said unto her daughter in law, Blessed *be* he of the LORD, who hath not left off his kindness to the living and to the dead. And Naomi said unto her, The man *is* near of kin unto us, one of our next kinsmen.", "21": "And Ruth the Moabitess said, He said unto me also, Thou shalt keep fast by my young men, until they have ended all my harvest.", "22": "And Naomi said unto Ruth her daughter in law, *It is* good, my daughter, that thou go out with his maidens, that they meet thee not in any other field.", "23": "So she kept fast by the maidens of Boaz to glean unto the end of barley harvest and of wheat harvest; and dwelt with her mother in law."}}, "tsk": {"1": [{"kopje": "bloedverwant", "refs": ["Ruth 3:2", "Ruth 3:12"]}, {"kopje": "machtig", "refs": ["Deut 8:17", "Deut 8:18", "Job 1:3", "Job 31:25"]}, {"kopje": "Boaz", "refs": ["Ruth 4:21", "Richt 12:8-10", "1 Kron 2:10-12", "Matt 1:5", "Luk 3:32"]}], {"disp": "Ruth 2:17", "href": "../../ruth/2/#v17", "ref": "Ruth 2:17", "svLabel": null}], "kinderen": []}]}]}, {"topic": "Evening, The", "href": "../../torrey/e/#t-evening-the", "kinderen": [{"label": "Man ceases from labour in", "href": "../../torrey/e/?hl=Ruth.2.17#i5885", "refs": [{"disp": "Ruth 2:17", "href": "../../ruth/2/#v17", "ref": "Ruth 2:17", "svLabel": null}, {"disp": "Ps 104:23", "href": "../../psalmen/104/#v23", "ref": "Ps 104:23", "svLabel": null}], "kinderen": []}]}]}, "19": {"nave": [{"topic": "Thankfulness", "href": "../../nave/t/#t-thankfulness", "kinderen": [{"label": "Of Man To Man", "href": "../../nave/t/?hl=Ruth.2.19#i20463", "refs": [], "kinderen": [{"label": "Naomi, to Boaz", "href": "../../nave/t/?hl=Ruth.2.19#i20467", "refs": [{"disp": "Ruth 2:19", "href": "../../ruth/2/#v19", "ref": "Ruth 2:19", "svLabel": null}, {"disp": "Ruth 2:20", "href": "../../ruth/2/#v20", "ref": "Ruth 2:20", "svLabel": null}], "kinderen": []}]}]}]}, "20": {"nave": [{"topic": "Joy", "href": "../../nave/j/#t-joy", "kinderen": [{"label": "Instances Of", "href": "../../nave/j/?hl=Ruth.2.20#i11845", "refs": [], "kinderen": [{"label": "Of Naomi, when Boaz showed kindness to Ruth", "href": "../../nave/j/?hl=Ruth.2.20#i11849", "refs": [{"disp": "Ruth 2:20", "href": "../../ruth/2/#v20", "ref": "Ruth 2:20", "svLabel": null}, {"disp": "Ruth 4:14", "href": "../../ruth/4/#v14", "ref": "Ruth 4:14", "svLabel": null}], "kinderen": []}]}]}, {"topic": "Thankfulness", "href": "../../nave/t/#t-thankfulness", "kinderen": [{"label": "Of Man To Man", "href": "../../nave/t/?hl=Ruth.2.20#i20463", "refs": [], "kinderen": [{"label": "Naomi, to Boaz", "href": "../../nave/t/?hl=Ruth.2.20#i20467", "refs": [{"disp": "Ruth 2:19", "href": "../../ruth/2/#v19", "ref": "Ruth 2:19", "svLabel": null}, {"disp": "Ruth 2:20", "href": "../../ruth/2/#v20", "ref": "Ruth 2:20", "svLabel": null}], "kinderen": []}]}]}]}, "23": {"nave": [{"topic": "Poor", "href": "../../nave/p/#t-poor", "kinderen": [{"label": "Kindness To", "href": "../../nave/p/?hl=Ruth.2.23#i15928", "refs": [], "kinderen": [{"label": "To Ruth", "href": "../../nave/p/?hl=Ruth.2.23#i15929", "refs": [{"disp": "Ruth 2:23", "href": "../../ruth/2/#v23", "ref": "Ruth 2:23", "svLabel": null}], "kinderen": []}]}]}]}}, "extern": {"Ps 80:2": "O Herder van Israël! Neem het ter oor, U Die Jozef als schapen leidde; U Die tussen de cherubs zit, verschijn blinkend.", "Spr 31:27": "Tsade. Zij houdt toezicht op de gangen van haar huis; en het brood van de luiheid eet zij niet.", "Ruth 3:9": "En hij zei: Wie bent u? En zij zei: Ik ben Ruth, uw dienstmaagd, breid dan uw vleugel uit over uw dienstmaagd, want u bent de losser.", "1 Kor 1:3": "Genade zij u en vrede van God onze Vader, en van de Heere Jezus Christus.", "Dan 9:3-19": "En ik richtte mijn gezicht tot God, de HEERE, om Hem te zoeken met gebed en smekingen, met vasten, en een zak, en as. Ik bad dan tot de HEERE, mijn God, en deed belijdenis, en zei: Och Heere! U grote en ontzagwekkende God, Die het verbond en de goedertierenheid houdt voor hen die Hem liefhebben en Zijn geboden houden. Wij hebben gezondigd, en onrecht gedaan, en goddeloos gehandeld, en gerebelleerd, door af te wijken van Uw geboden en van Uw rechten.", "1 Sam 1:17": "Toen antwoordde Eli en zei: Ga heen in vrede, en de God van Israël geeft u wat u van Hem gebeden hebt.", "Lev 23:22": "Als u nu de oogst van uw land zult inoogsten, zult u, bij uw inoogsten, de hoek van het veld niet helemaal afmaaien, en de opzameling van uw oogst niet opzamelen; voor de arme en voor de vreemdeling zult u ze laten liggen; Ik ben de HEERE, uw God!", "2 Sam 19:28": "Want heel mijn vaders huis was voor mijn heer de koning niets anders dan mensen die de dood verdienen; toch hebt u uw knecht een plaats gegeven onder hen die aan uw tafel eten; wat recht heb ik dan nog om verder te klagen bij de koning?", "Gen 33:10": "Toen zei Jakob: Nee toch! Als ik nu genade in uw ogen gevonden heb, neem dan mijn geschenk uit mijn hand aan; want ik heb daarom uw gezicht gezien alsof ik Gods gezicht gezien had, en u hebt mij welwillend ontvangen.", "Luk 15:19": "en ik ben niet meer waard uw zoon genoemd te worden; maak mij als één van uw dagloners.", "Luk 10:31": "En bij toeval kwam er een priester langs diezelfde weg; en toen hij hem zag, liep hij aan de overkant voorbij.", "2 Tess 1:11": "Daarom bidden wij ook altijd voor u, dat onze God u waardig acht voor deze roeping, en al het welbehagen van Zijn goedheid vervult, en het werk van het geloof met kracht.", "Ruth 4:9": "Toen zei Boaz tegen de oudsten en al het volk: U bent heden getuigen, dat ik alles gekocht heb wat van Elimelech geweest is, en alles wat van Chiljon en Machlon geweest is, van de hand van Naomi.", "Hebr 11:9": "Door het geloof is hij een inwoner geweest in het land van de belofte, als in een vreemd land, en heeft hij in tenten gewoond met Izak en Jakob, die medeerfgenamen waren van dezelfde belofte.", "Ef 5:21": "en wees elkaar onderdanig in de vreze van God.", "1 Tess 4:11": "En dat u zich beijvert om stil te zijn, en uw eigen zaken te doen, en te werken met uw eigen handen, zoals wij u bevolen hebben;", "Gen 18:19": "Want Ik heb hem gekend, opdat hij zijn kinderen en zijn huis na hem zou opdragen, en zij de weg van de HEERE zouden bewaren, om gerechtigheid en recht te doen; opdat de HEERE over Abraham brengt wat Hij over hem gesproken heeft.", "Num 28:5": "En een tiende deel van een efa meelbloem als spijsoffer, gemengd met het vierendeel van een hin gestoten olie.", "Ps 58:12": "En de mens zal zeggen: Zeker, er is vrucht voor de rechtvaardige; zeker, er is een God, Die op de aarde recht spreekt.", "Matt 15:22-28": "En zie, een Kananese vrouw, die uit die omgeving kwam, riep tot Hem en zei: Heere! U Zoon van David, ontferm U over mij! mijn dochter is ernstig door de duivel bezeten. Maar Hij antwoordde haar geen woord. En Zijn discipelen kwamen tot Hem en baden Hem: Laat haar gaan; want zij roept ons na. Maar Hij antwoordde en zei: Ik ben niet gezonden dan naar de verloren schapen van het huis van Israël.", "Kol 4:12": "U groet Epafras, die één van u is, een dienstknecht van Christus, die altijd voor u strijdt in de gebeden, opdat u volmaakt en volkomen mag staan in heel de wil van God.", "Luk 1:48": "omdat Hij de nederigheid van Zijn dienstmaagd heeft aangezien; want zie, van nu af aan zullen alle geslachten mij zalig spreken.", "Hoogl 1:8": "Als u het niet weet, o schoonste onder de vrouwen! ga dan uit op de voetstappen van de schapen, en weid uw geiten bij de woningen van de herders.", "Ruth 1:11": "Maar Naomi zei: Keer terug, mijn dochters! Waarom zouden jullie met mij meegaan? Heb ik nog zonen in mijn schoot, die jullie tot mannen zouden kunnen zijn?", "Ps 129:7": "waarmee de maaier zijn hand niet vult, en ook de garvenbinder zijn arm niet;", "Ef 3:14-19": "Om deze reden buig ik mijn knieën voor de Vader van onze Heere Jezus Christus, uit Wie heel het geslacht in de hemelen en op de aarde genoemd wordt, opdat Hij u geeft, naar de rijkdom van Zijn heerlijkheid, met kracht versterkt te worden door Zijn Geest in de innerlijke mens;", "Luk 5:11": "En toen zij de schepen aan land gebracht hadden, verlieten zij alles en volgden Hem.", "Jes 58:7": "Is het niet dit, dat u de hongerige uw brood meedeelt, en de armen, verdrevenen, in huis brengt? Als u een naakte ziet, dat u hem dekt, en dat u zich voor uw eigen vlees niet verbergt?", "Lev 19:9": "Als u ook de oogst van uw land inoogst, zult u de hoek van uw veld niet helemaal afoogsten, en wat van uw oogst is blijven liggen, niet opzamelen.", "Ps 80:18": "Uw hand zij over de man van Uw rechterhand, over de zoon van de mens, die U voor Uzelf gesterkt hebt.", "Joël 2:17": "Laat de priesters, de dienaars van de HEERE, wenen tussen het voorhuis en het altaar, en laat hen zeggen: Spaar Uw volk, o HEERE! en geef Uw erfenis niet over tot een smaad, dat de heidenen over hen zouden heersen; waarom zouden zij onder de volken zeggen: Waar is hun God?", "Spr 6:29": "Zo vergaat het hem die bij de vrouw van zijn naaste komt; wie haar aanraakt, zal niet onschuldig blijven.", "Hebr 11:24-26": "Door het geloof heeft Mozes, toen hij groot geworden was, geweigerd een zoon van de dochter van Farao genoemd te worden; en verkoos hij liever met het volk van God slecht behandeld te worden, dan voor een tijd van de genietingen van de zonde te hebben; en achtte hij de smaad van Christus een grotere rijkdom dan de schatten in Egypte; want hij keek uit naar de vergelding van het loon.", "2 Kor 13:7": "En ik verlang van God, dat u geen kwaad doet; niet opdat wij beproefd bevonden zouden worden, maar opdat u het goede zou doen, ook al zouden wij als verwerpelijk zijn.", "Hoogl 1:6": "Kijk niet naar mij, omdat ik zwartachtig ben, omdat de zon op mij heeft geschenen; de kinderen van mijn moeder waren tegen mij ontstoken, zij hebben mij aangesteld tot een hoedster van de wijngaarden. Mijn eigen wijngaard heb ik niet gehoed.", "2 Tim 1:18": "De Heere geve hem, dat hij barmhartigheid vindt bij de Heere, op die dag; en hoezeer hij mij in Efeze gediend heeft, weet u zeer goed.", "Matt 6:10": "Laat Uw Koninkrijk komen. Laat Uw wil gebeuren, zoals in de hemel, zo ook op de aarde.", "1 Sam 1:24": "Daarna, toen zij hem gespeend had, bracht zij hem met zich mee, met drie stieren, en een efa van het meel, en een fles met wijn; en zij bracht hem in het huis van de HEERE te Silo; en het jongetje was nog zeer jong.", "Ps 37:5": "Gimel. Leg uw weg in de handen van de HEERE, en vertrouw op Hem; Hij zal het maken;", "Job 19:25": "Want ik weet: mijn Verlosser leeft, en Hij zal als de laatste over het stof opstaan;", "Matt 14:20": "En zij aten allen en werden verzadigd, en zij namen het overschot van de brokken op, twaalf volle korven.", "1 Sam 3:6": "Toen riep de HEERE Samuël opnieuw; en Samuël stond op en ging naar Eli, en zei: Hier ben ik, want u hebt mij geroepen. Hij dan zei: Ik heb u niet geroepen, mijn zoon; keer terug, ga liggen.", "Spr 23:18": "Want zeker, er is een beloning; en uw verwachting zal niet afgesneden worden.", "Micha 7:14": "Weid Ú dan Uw volk met Uw staf, de kudde van Uw erfenis, die alleen woont, in het woud, midden in een vruchtbaar land; laat ze weiden in Basan en Gilead, als in de dagen van ouds.", "Rom 12:10": "Heb elkaar hartelijk lief met broederlijke liefde; in eerbetoon de een de ander voorgaand.", "Ps 61:5": "Ik zal in Uw hut verkeren in eeuwigheden; ik zal mijn toevlucht nemen in het verborgene van Uw vleugels. Sela.", "Lev 19:36": "U zult een eerlijke weegschaal hebben, eerlijke gewichten, een eerlijke efa, en een eerlijke hin; Ik ben de HEERE, uw God, Die u uit Egypteland uitgevoerd heb!", "1 Tess 1:2": "Wij danken God altijd voor u allen, terwijl wij aan u denken in onze gebeden;", "Ruth 1:14-22": "Toen huilden zij weer luid; en Orpa kuste haar schoonmoeder, maar Ruth bleef bij haar. Daarom zei zij: Zie, uw schoonzuster is teruggekeerd naar haar volk en naar haar goden; keer ook u terug, uw schoonzuster achterna. Maar Ruth zei: Dring er bij mij niet op aan om u te verlaten, om van achter u terug te keren; want waar u heen zult gaan, zal ik ook heen gaan, en waar u zult overnachten, zal ik overnachten; uw volk is mijn volk, en uw God mijn God.", "Jer 18:20": "Zal dan kwaad voor goed vergolden worden? want zij hebben mijn ziel een kuil gegraven; gedenk dat ik voor Uw aangezicht gestaan heb om goed voor hen te spreken, om Uw grimmigheid van hen af te wenden.", "Spr 11:24": "Er is er een die uitstrooit, aan wie nog meer toegevoegd wordt; en een die meer inhoudt dan recht is, maar het leidt tot gebrek.", "1 Sam 3:16": "Toen riep Eli Samuël, en zei: Mijn zoon Samuël! Hij dan zei: Hier ben ik.", "Luk 18:29": "En Hij zei tegen hen: Voorwaar, Ik zeg u, er is niemand die huis, of ouders, of broers, of vrouw, of kinderen heeft verlaten om het Koninkrijk van God,", "Ps 104:23": "De mens gaat dan uit tot zijn werk, en naar zijn arbeid tot de avond toe.", "Spr 13:4": "De ziel van de luiaard is begerig, doch er is niets; maar de ziel van de vlijtigen zal vet gemaakt worden.", "2 Kron 6:40": "Nu, mijn God, laat toch Uw ogen open zijn en Uw oren opmerkzaam op het gebed van deze plaats.", "Matt 5:3": "Zalig zijn de armen van geest, want hun is het Koninkrijk der hemelen.", "Gen 20:6": "En God zei tegen hem in de droom: Ik heb ook geweten dat u dit in oprechtheid van uw hart gedaan hebt, en Ik heb u ook belet om tegen Mij te zondigen; daarom heb Ik u niet toegelaten haar aan te raken.", "Ruth 4:14": "Toen zeiden de vrouwen tegen Naomi: Geloofd zij de HEERE, Die niet heeft nagelaten u heden een losser te geven; en zijn naam worde vermaard in Israël!", "2 Kon 8:5": "En het gebeurde, terwijl hij de koning vertelde hoe hij een dode levend gemaakt had, zie, dat de vrouw, van wie hij de zoon levend gemaakt had, tot de koning smeekte voor haar huis en voor haar akker. Toen zei Gehazi: Mijn heer koning! Dit is de vrouw, en dit is haar zoon, die Elisa levend gemaakt heeft.", "Ruth 2:4-17": "En zie, Boaz kwam van Bethlehem, en zei tegen de maaiers: De HEERE zij met u! En zij zeiden tegen hem: De HEERE zegent u! Daarna zei Boaz tegen zijn knecht, die over de maaiers gezet was: Van wie is deze jonge vrouw? En de knecht, die over de maaiers gezet was, antwoordde en zei: Dit is de Moabitische jonge vrouw, die met Naomi teruggekomen is uit de velden van Moab;", "Deut 25:5-7": "Wanneer broeders samenwonen, en één van hen sterft zonder zoon, dan mag de vrouw van de gestorvene niet trouwen met een vreemde man van buiten; haar zwager zal tot haar ingaan, en haar tot vrouw nemen, en zo de plicht van een zwager aan haar vervullen. En het zal gebeuren, dat de eerstgeborene die zij baart, de naam van zijn overleden broer zal dragen; opdat zijn naam niet uitgewist wordt uit Israël. Maar als die man geen zin heeft om de vrouw van zijn broer te nemen, dan zal de vrouw van zijn broer naar de poort gaan, naar de oudsten, en zeggen: Mijn zwager weigert voor zijn broer een naam te doen voortbestaan in Israël; hij wil de plicht van een zwager niet aan mij vervullen.", "Jes 32:8": "Maar een milddadige bedenkt milddadige dingen, en staat op door milddadige dingen.", "Ruth 3:10": "En hij zei: Gezegend bent u door de HEERE, mijn dochter! U hebt deze laatste blijk van uw goedheid beter gemaakt dan de eerste, omdat u geen jonge mannen bent nagegaan, hetzij arm of rijk.", "Fil 4:10": "En ik ben zeer verblijd geweest in de Heere, dat u nu eindelijk opnieuw bent opgebloeid om aan mij te denken; waaraan u ook gedacht hebt, maar u hebt de gelegenheid niet gehad.", "Ps 51:20": "Doe goed bij Sion naar Uw welbehagen; bouw de muren van Jeruzalem op.", "Matt 10:42": "En wie een van deze kleinen slechts een beker koud water te drinken geeft, in de naam van een discipel, voorwaar, Ik zeg u, hij zal zijn loon geenszins verliezen.", "Rom 12:11": "Wees niet traag in het benaarstigen. Wees vurig van geest. Dien de Heere.", "2 Kor 9:13-15": "Omdat zij door de beproeving van deze bediening God verheerlijken over de onderwerping van uw belijdenis aan het Evangelie van Christus, en over de goeddadigheid van de mededeling aan hen en aan allen; En door hun gebed voor u, die naar u verlangen, om de uitnemende genade van God over u. Doch God zij dank voor Zijn onuitsprekelijke gave.", "Richt 12:8-10": "En na hem richtte Ebzan uit Bethlehem Israël. En hij had dertig zonen; en hij zond dertig dochters naar buiten, en bracht dertig dochters van buiten binnen voor zijn zonen; en hij richtte Israël zeven jaren. Toen stierf Ebzan, en werd begraven te Bethlehem.", "Luk 7:7": "Daarom heb ik ook mijzelf niet waard geacht om naar U toe te komen; maar spreek slechts een woord, en mijn knecht zal genezen worden.", "Matt 5:12": "Verblijd en verheug u, want uw loon is groot in de hemelen; want zo hebben zij de profeten vervolgd die vóór u geweest zijn.", "Fil 1:10": "Opdat u beproeft wat het beste is, opdat u oprecht bent, en zonder aanstoot te geven, tot de dag van Christus;", "Gen 24:2": "Zo zei Abraham tegen zijn knecht, de oudste van zijn huis, die over alles regeerde wat hij had: Leg toch uw hand onder mijn heup,", "1 Kron 29:19": "En geef mijn zoon Salomo een volkomen hart, om Uw geboden, Uw getuigenissen en Uw inzettingen te houden; en om alles te doen, en om dit paleis te bouwen, dat ik klaargemaakt heb.", "Luk 6:35": "Maar heb uw vijanden lief, en doe goed, en leen, zonder iets terug te hopen; en uw loon zal groot zijn, en u zult kinderen van de Allerhoogste zijn; want Hij is goedertieren over de ondankbaren en de bozen.", "Gen 33:15": "En Ezau zei: Laat mij toch een deel van dit volk dat bij mij is, bij u achterlaten. En hij zei: Waarom zou dat nodig zijn? Laat mij genade vinden in de ogen van mijn heer!", "Job 29:12": "Want ik bevrijdde de ellendige die riep, en de wees die geen helper had.", "2 Sam 16:4": "Zo zei de koning tegen Ziba: Zie, alles wat Mefiboseth heeft, zal van u zijn. En Ziba zei: Ik buig mij neer, laat mij genade vinden in uw ogen, mijn heer koning!", "Spr 27:10": "Verlaat uw vriend, en ook de vriend van uw vader niet; en ga op de dag van uw tegenspoed niet naar het huis van uw broer. Beter is een buur die dichtbij is, dan een broer die ver weg is.", "Ex 32:32": "Nu dan, als Gij hun zonde wilt vergeven! Maar zo niet, delg mij dan nu uit Uw boek, dat Gij geschreven hebt.", "Matt 23:37": "Jeruzalem, Jeruzalem! U die de profeten doodt, en stenigt hen die tot u gezonden zijn! Hoe vaak heb Ik uw kinderen bijeen willen brengen, zoals een hen haar kuikens bijeenbrengt onder de vleugels; en u hebt niet gewild.", "2 Sam 17:28": "Beddengoed, en schalen, en aarden vaten, en tarwe, en gerst, en meel, en geroosterd koren, en bonen, en linzen, ook geroosterd,", "Fil 4:8": "Verder, broeders, alles wat waar is, alles wat eerbaar is, alles wat rechtvaardig is, alles wat rein is, alles wat lieflijk is, alles wat goed klinkt, als er enige deugd is, en als er enige lof is, denk daaraan;", "Gen 24:18-20": "En zij zei: Drink, mijn heer! En zij haastte zich en liet haar kruik neer op haar hand, en gaf hem te drinken. Toen zij klaar was met hem te drinken te geven, zei zij: Ik zal ook voor uw kamelen putten, totdat zij klaar zijn met drinken. En zij haastte zich, en goot haar kruik leeg in de drinkbak, en liep weer naar de put om te putten, en zij putte voor al zijn kamelen.", "Ezech 45:10": "Een eerlijke weegschaal, en een eerlijke efa, en een eerlijke bath zult u hebben.", "Ps 80:20": "HEERE, God van de heerscharen! Breng ons terug; laat Uw aanschijn lichten, zo zullen wij verlost worden.", "2 Sam 24:17": "En David, toen hij de engel zag die het volk sloeg, sprak tot de HEERE, en zei: Zie, ik, ik heb gezondigd, en ik, ik heb onrecht gehandeld, maar wat hebben deze schapen gedaan? Laat toch Uw hand tegen mij zijn en tegen het huis van mijn vader.", "Jes 64:8-12": "Doch nu, HEERE! U bent onze Vader; wij zijn leem, en U bent onze pottenbakker, en wij allen zijn het werk van Uw handen. HEERE! wees niet zo zeer verbolgen, en denk niet eeuwig aan de ongerechtigheid; zie, aanschouw toch, wij allen zijn Uw volk. Uw heilige steden zijn een woestijn geworden, Sion is een woestijn geworden, Jeruzalem een verwoesting.", "Jes 56:3-8": "En de vreemdeling, die zich bij de HEERE gevoegd heeft, moet niet zeggen: De HEERE heeft mij helemaal van Zijn volk gescheiden; en de ontmande moet niet zeggen: Zie, ik ben een dorre boom. Want zo zegt de HEERE van de ontmanden, die Mijn sabbatten houden, en verkiezen wat Mij behaagt, en vasthouden aan Mijn verbond; Ik zal hun ook in Mijn huis en binnen Mijn muren een plaats en een naam geven, beter dan van zonen en dan van dochters; een eeuwige naam zal Ik ieder van hen geven, die niet uitgeroeid zal worden.", "2 Kon 5:13": "Toen kwamen zijn knechten dichterbij, en spraken tegen hem, en zeiden: Mijn vader, als die profeet u een grote zaak opgedragen had, zou u het dan niet gedaan hebben? Hoeveel te meer dan, nu hij tegen u gezegd heeft: Was u, en u zult rein zijn?", "Ruth 3:2": "Nu dan, is Boaz, met wiens dienstmeisjes u geweest bent, niet van onze bloedverwantschap? Zie, hij zal deze nacht gerst wannen op de dorsvloer.", "Ezech 45:12": "En de sikkel zal zijn van twintig gera; twintig sikkels, vijfentwintig sikkels en vijftien sikkels, zal u een pond zijn.", "Lev 19:16": "U zult niet rondgaan als een kwaadspreker onder uw volken; u zult niet opstaan tegen het bloed van uw naaste; Ik ben de HEERE!", "Ps 36:8": "Hoe dierbaar is Uw goedertierenheid, o God! Daarom nemen de mensenkinderen onder de schaduw van Uw vleugels toevlucht.", "Matt 9:22": "En Jezus keerde Zich om, en toen Hij haar zag, zei Hij: Houd moed, dochter! Uw geloof heeft u behouden. En de vrouw werd op dat moment gezond.)", "Deut 24:19-21": "Wanneer u uw oogst op uw akker afgeoogst hebt, en een garf op de akker vergeten bent, zult u niet terugkeren om die op te halen; voor de vreemdeling, voor de wees en voor de weduwe zal die zijn; opdat de HEERE, uw God, u zegent in al het werk van uw handen. Wanneer u uw olijfboom geschud hebt, zult u de takken daarna niet nauwkeurig doorzoeken; voor de vreemdeling, voor de wees en voor de weduwe zal het zijn. Wanneer u uw wijngaard hebt afgeplukt, zult u de druiven daarna niet nalezen; voor de vreemdeling, voor de wees en voor de weduwe zal het zijn.", "Fil 1:9": "En dit bid ik God, dat uw liefde nog meer en meer overvloedig wordt in kennis en alle inzicht;", "Hebr 11:26": "en achtte hij de smaad van Christus een grotere rijkdom dan de schatten in Egypte; want hij keek uit naar de vergelding van het loon.", "Est 6:2": "En men vond geschreven dat Mordechai had bekendgemaakt dat Bigthana en Theres, twee kamerlingen van de koning, uit de dorpelwachters, van plan waren de hand te leggen aan koning Ahasveros.", "2 Tim 1:3": "Ik dank God, aan Wie ik dien vanaf mijn voorouders met een rein geweten, zoals ik zonder ophouden aan u denk in mijn gebeden, nacht en dag;", "Num 27:16": "Laat de HEERE, de God van de geesten van alle vlees, een man aanstellen over deze vergadering,", "Gen 39:4": "vond Jozef genade in zijn ogen, en diende hem; en hij stelde hem aan over zijn huis, en alles wat hij had, gaf hij in zijn hand.", "1 Kron 2:10-12": "Ram nu verwekte Amminadab, en Amminadab verwekte Nahesson, de vorst van de kinderen van Juda; En Nahesson verwekte Salma, en Salma verwekte Boaz, En Boaz verwekte Obed, en Obed verwekte Isaï,", "2 Tim 2:7": "Bedenk wat ik zeg; en de Heere geeft u inzicht in alle dingen.", "1 Tess 3:12": "En moge de Heere u doen toenemen en overvloedig maken in de liefde tot elkaar en tot allen, zoals wij ook zijn tot u,", "Hand 7:60": "En terwijl hij op de knieën viel, riep hij met luide stem: Heere, reken hun deze zonde niet toe! En toen hij dat gezegd had, ontsliep hij.", "Joh 6:12": "En toen zij verzadigd waren, zei Hij tegen Zijn discipelen: Verzamel de overgebleven brokken, zodat er niets verloren gaat.", "Ps 63:8": "Want U bent mij een hulp geweest; en in de schaduw van Uw vleugels zal ik vrolijk zingen.", "Luk 17:16-18": "En hij viel op zijn gezicht voor Zijn voeten en dankte Hem; en dat was een Samaritaan. En Jezus antwoordde en zei: Zijn niet de tien gereinigd? Maar waar zijn de negen? En is er niemand gevonden die terugkeert om God eer te geven, dan deze vreemdeling?", "Fil 1:3-5": "Ik dank mijn God, zo dikwijls als ik aan u denk. (In elk gebed van mij voor u allen doe ik dat gebed altijd met blijdschap) Vanwege uw gemeenschap aan het Evangelie, vanaf de eerste dag tot nu toe;", "1 Tim 6:2": "En zij die gelovige heren hebben, moeten hen niet verachten, omdat zij broeders zijn; maar moeten hen des te meer dienen, omdat zij gelovig en geliefd zijn, als mensen die deze weldaad samen ontvangen. Leer en vermaan deze dingen.", "1 Kon 8:39": "hoor Ú dan in de hemel, de vaste plaats van Uw woning, en vergeef, en doe, en geef ieder naar al zijn wegen, zoals U zijn hart kent; want U alleen kent het hart van alle kinderen van de mensen;", "Ezech 45:13": "Dit is het hefoffer dat u brengen zult: het zesde deel van een efa van een homer tarwe; ook zult u het zesde deel van een efa geven van een homer gerst.", "Kol 1:3": "Wij danken de God en Vader van onze Heere Jezus Christus, terwijl wij altijd voor u bidden,", "Amos 8:5": "En zegt: Wanneer is de nieuwe maan voorbij, zodat wij koren mogen verkopen? en de sabbat, zodat wij graan mogen aanbieden? terwijl u de efa verkleint en de sikkel vergroot, en verkeerd handelt met bedrieglijke weegschalen;", "Ps 125:4": "HEERE! doe het goede aan hen die goed zijn, en aan hen die oprecht zijn in hun hart.", "1 Petr 5:6": "Verneder u dan onder de krachtige hand van God, opdat Hij u verhoogt op Zijn tijd.", "Ps 37:6": "En Hij zal uw gerechtigheid doen voortkomen als het licht, en uw recht als de middag.", "Spr 11:18": "De goddeloze doet een vals werk; maar hem die gerechtigheid zaait, is een trouw loon toegezegd.", "Ruth 3:12": "Nu dan, het is waar dat ik een losser ben; maar er is nog een losser, die nader is dan ik.", "Ruth 3:15": "Vervolgens zei hij: Breng de sluier die u om hebt, en houd die vast; en zij hield hem vast; en hij mat zes maten gerst, en legde ze op haar; daarna ging hij de stad in.", "Pred 9:10": "Alles wat uw hand vindt om te doen, doe dat met al uw kracht; want er is geen werk, geen overleg, geen kennis en geen wijsheid in het graf, waar u heengaat.", "Spr 22:29": "Hebt u een man gezien die vaardig is in zijn werk? Hij zal voor koningen komen te staan; hij zal niet voor onaanzienlijke mensen staan.", "Gen 33:8": "En hij zei: Voor wie is heel dit leger dat ik ontmoet heb? En hij zei: Om genade te vinden in de ogen van mijn heer!", "Gen 43:14": "En God, de Almachtige, geve u barmhartigheid bij die man, dat hij uw andere broer en Benjamin met u laat teruggaan! En wat mij aangaat, als ik van mijn kinderen beroofd word, dan ben ik maar beroofd!", "Ps 57:2": "Wees mij genadig, o God! Wees mij genadig, want mijn ziel vertrouwt op U, en ik neem mijn toevlucht onder de schaduw van Uw vleugels, totdat de verdervingen voorbij zijn gegaan.", "Luk 14:12-14": "En Hij zei ook tegen hem die Hem genodigd had: Wanneer u een middagmaal of avondmaal houdt, roep dan niet uw vrienden, of uw broers, of uw familie, of uw rijke buren; anders zouden zij u ook op hun beurt weer kunnen uitnodigen, en zou u vergelding gebeuren. Maar wanneer u een maaltijd houdt, nodig dan armen, verminkten, kreupelen en blinden uit; en u zult gelukkig zijn, omdat zij niets hebben om u te vergelden; want het zal u vergolden worden bij de opstanding van de rechtvaardigen.", "Hebr 13:20": "De God nu van de vrede, Die de grote Herder van de schapen, door het bloed van het eeuwige testament, uit de doden heeft teruggebracht, namelijk onze Heere Jezus Christus,", "Hand 8:15": "die, toen zij aangekomen waren, voor hen baden, opdat zij de Heilige Geest zouden ontvangen.", "Matt 6:1": "Let op dat u uw aalmoes niet doet voor de mensen, om door hen gezien te worden; anders hebt u geen loon bij uw Vader, Die in de hemelen is.", "Hebr 11:6": "Maar zonder geloof is het onmogelijk God te behagen. Want wie tot God komt, moet geloven dat Hij bestaat, en dat Hij Beloner is van hen die Hem zoeken.", "Ef 1:15-19": "Daarom ook ik, nadat ik gehoord heb van het geloof in de Heere Jezus, dat onder u is, en de liefde tot al de heiligen, Houd niet op voor u te danken, en u te gedenken in mijn gebeden; Opdat de God van onze Heere Jezus Christus, de Vader der heerlijkheid, u de Geest van wijsheid en van openbaring geeft in de kennis van Hem;", "Ruth 1:19": "Zo gingen die twee verder, totdat zij in Bethlehem aankwamen; en het gebeurde, toen zij in Bethlehem aankwamen, dat de hele stad over hen in opschudding raakte, en zij zeiden: Is dit Naomi?", "Hebr 13:21": "Hij volmaakt u in alle goed werk, opdat u Zijn wil mag doen; terwijl Hij in u werkt wat voor Hem welgevallig is, door Jezus Christus; aan Wie de heerlijkheid is, tot in alle eeuwigheid. Amen.", "Jes 58:10": "En als u uw ziel opent voor de hongerige, en de bedrukte ziel verzadigt; dan zal uw licht in de duisternis opgaan, en uw donkerheid zal zijn als de middag.", "Ps 80:16": "en de stam die Uw rechterhand geplant heeft, en dat om de zoon die U voor Uzelf gesterkt hebt!", "2 Tim 4:8": "Verder ligt voor mij de kroon van de rechtvaardigheid klaar, die de Heere, de rechtvaardige Rechter, mij op die dag geven zal; en niet alleen mij, maar ook allen die Zijn verschijning hebben liefgehad.", "Ps 25:22": "O God! verlos Israël uit al zijn benauwdheden.", "Matt 5:44": "Maar Ik zeg u: heb uw vijanden lief; zegen hen die u vervloeken; doe goed aan hen die u haten; en bid voor hen die u geweld aandoen en die u vervolgen;", "Joh 4:7-11": "Er kwam een vrouw uit Samaria om water te putten. Jezus zei tegen haar: Geef Mij te drinken. (Want Zijn discipelen waren naar de stad gegaan om voedsel te kopen.) Toen zei de Samaritaanse vrouw tegen Hem: Hoe kunt U, die een Jood bent, van mij te drinken vragen, die een Samaritaanse vrouw ben? Want de Joden gaan niet met de Samaritanen om.", "Gen 34:3": "En zijn ziel hechtte zich aan Dina, Jakobs dochter; en hij had de jonge vrouw lief, en sprak naar het hart van de jonge vrouw.", "Ezech 46:11": "Verder, op de feesten en op de vastgestelde hoogtijden zal het spijsoffer zijn: een efa bij een var, en een efa bij een ram; maar bij de lammeren, een gave van zijn hand; en olie, een hin bij een efa.", "Ruth 4:21": "En Salmon verwekte Boaz, en Boaz verwekte Obed;", "Ruth 1:1": "In de dagen dat de rechters rechtspraken, gebeurde het dat er honger in het land was; daarom trok een man van Bethlehem-juda weg om als vreemdeling te wonen in de velden van Moab, hij, en zijn vrouw, en zijn twee zonen.", "Ruth 1:3": "En Elimelech, de man van Naomi, stierf; maar zij bleef achter met haar twee zonen.", "Ps 23:5": "U richt de tafel voor mij aan, tegenover mijn tegenstanders; U maakt mijn hoofd vet met olie, mijn beker vloeit over.", "1 Petr 5:10": "En de God van alle genade, Die ons geroepen heeft tot Zijn eeuwige heerlijkheid in Christus Jezus, nadat u een tijdlang geleden zult hebben, Hij zal u volmaken, bevestigen, versterken en funderen.", "2 Joh 1:10": "Als iemand tot u komt en deze leer niet brengt, ontvang hem niet in huis, en zeg tegen hem niet: wees gegroet.", "Ps 141:5": "Laat de rechtvaardige mij slaan, het zal weldadigheid zijn; en laat hij mij bestraffen, het zal olie van het hoofd zijn, het zal mijn hoofd niet breken; want ook dan zal mijn gebed voor hen zijn in hun tegenspoeden.", "Luk 15:17": "En tot zichzelf gekomen, zei hij: Hoeveel dagloners van mijn vader hebben brood in overvloed, en ik kom om van honger!", "2 Tim 1:16-18": "De Heere geve het huis van Onesiforus barmhartigheid; want hij heeft mij dikwijls verkwikt, en heeft zich niet geschaamd voor mijn keten. Maar toen hij in Rome gekomen was, heeft hij mij zeer ijverig gezocht, en heeft mij gevonden. De Heere geve hem, dat hij barmhartigheid vindt bij de Heere, op die dag; en hoezeer hij mij in Efeze gediend heeft, weet u zeer goed.", "Spr 17:17": "Een vriend heeft te allen tijde lief; en een broeder wordt geboren voor de tijd van benauwdheid.", "Ezech 46:14": "En u zult als spijsoffer daarbij doen, elke morgen een zesde deel van een efa, en olie een derde deel van een hin, om de meelbloem te bevochtigen; als een spijsoffer voor de HEERE, als eeuwige inzettingen, voortdurend.", "Hoogl 1:7": "Zeg mij aan, U, Die mijn ziel liefheeft, waar U weidt, waar U de kudde legert in de middag; want waarom zou ik zijn als iemand die zich afwendt bij de kudden van uw metgezellen?", "Jes 63:17-19": "HEERE! Waarom laat U ons van Uw wegen dwalen, waarom verstokt U ons hart, zodat wij U niet vrezen? Keer terug om Uw dienaren wil, de stammen van Uw erfdeel. Uw heilig volk heeft het maar een korte tijd bezeten; onze tegenstanders hebben Uw heiligdom vertreden. Wij zijn geworden als zij over wie U van ouds niet hebt geheerst, en die naar Uw Naam niet genoemd zijn.", "Job 31:25": "Als ik blijde ben geweest, omdat mijn vermogen groot was, en omdat mijn hand geweldig veel verkregen had;", "2 Tess 3:12": "Doch zulke mensen bevelen en vermanen wij door onze Heere Jezus Christus, dat zij met rust werkend hun eigen brood eten.", "Kol 1:9": "Daarom houden ook wij, vanaf de dag dat wij het gehoord hebben, niet op voor u te bidden en te vragen dat u vervuld mag worden met de kennis van Zijn wil, in alle wijsheid en geestelijk verstand;", "Jes 58:11": "En de HEERE zal u voortdurend leiden, en Hij zal uw ziel verzadigen in grote droogte, en uw beenderen sterk maken; en u zult zijn als een gewaterde hof, en als een springader van water, waarvan het water niet ontbreekt.", "1 Sam 25:23": "Toen Abigaïl nu David zag, haastte zij zich, en kwam van de ezel af, en zij viel voor het aangezicht van David op haar aangezicht, en zij boog zich ter aarde.", "Ps 17:8": "Bewaar mij als het zwart van de oogappel, verberg mij onder de schaduw van Uw vleugels,", "Rom 1:9": "Want God is mijn Getuige, Die ik dien in mijn geest, in het Evangelie van Zijn Zoon, hoe ik zonder ophouden aan u denk;", "Ruth 2:14-16": "Toen het etenstijd was, zei Boaz tegen haar: Kom hierbij, en eet van het brood, en doop uw stukje in de azijn. Zo zat zij neer aan de zijde van de maaiers, en hij reikte haar geroost koren aan, en zij at, en werd verzadigd, en hield over. Toen zij opstond om op te lezen, gebood Boaz zijn knechten: Laat haar ook tussen de schoven oplezen, en beschaamt haar niet. Ja, laat ook opzettelijk wat van de handvollen voor haar vallen, en laat het liggen, zodat zij het opleest, en berispt haar niet.", "Ruth 4:11": "En al het volk dat in de poort was, alsook de oudsten, zeiden: Wij zijn getuigen; de HEERE make deze vrouw, die in uw huis komt, als Rachel en als Lea, die beiden het huis van Israël gebouwd hebben; en handel kloek in Efratha, en maak uw naam vermaard in Bethlehem!", "Gen 12:3": "En Ik zal zegenen wie u zegenen, en vervloeken wie u vervloekt; en in u zullen alle geslachten van de aarde gezegend worden.", "Job 19:21": "Ontferm u over mij, ontferm u over mij, o mijn vrienden! want de hand van God heeft mij aangeraakt.", "Matt 20:8": "Toen het nu avond geworden was, zei de heer van de wijngaard tegen zijn rentmeester: Roep de arbeiders, en geef hun het loon, te beginnen bij de laatsten tot de eersten.", "Gen 48:15-20": "En hij zegende Jozef, en zei: De God, voor Wiens aangezicht mijn vaders, Abraham en Izak, gewandeld hebben, die God, Die mij gevoed heeft, van mijn jeugd af tot op deze dag; Die Engel, Die mij verlost heeft van alle kwaad, zegent deze jongens, en laat in hen mijn naam genoemd worden, en de naam van mijn vaders Abraham en Izak, en laat hen vermenigvuldigen als vissen in menigte, midden in het land! Toen Jozef zag dat zijn vader zijn rechterhand op het hoofd van Efraïm legde, was dat niet goed in zijn ogen, en hij greep de hand van zijn vader vast, om die van het hoofd van Efraïm naar het hoofd van Manasse te brengen.", "Spr 15:17": "Beter is een gerecht van groente, waar ook liefde is, dan een vetgemeste os met haat erbij.", "Luk 5:23": "Wat is gemakkelijker te zeggen: Uw zonden zijn u vergeven, of te zeggen: Sta op en loop?", "Lev 6:20": "Dit is de offerande van Aäron en van zijn zonen, die zij de HEERE offeren zullen op de dag dat hij gezalfd wordt: het tiende deel van een efa meelbloem, een voortdurend spijsoffer; de helft daarvan op de morgen, en de helft daarvan op de avond.", "Num 10:36": "En als zij rustte, zei hij: Kom terug, HEERE, tot de tienduizenden van de duizenden van Israël!", "Ps 122:8": "Om mijn broeders en mijn vrienden zal ik nu zeggen: Vrede zij in u!", "2 Sam 9:1": "En David zei: Is er nog iemand die overgebleven is van het huis van Saul, zodat ik hem goedheid kan bewijzen, omwille van Jonathan?", "Job 1:3": "Daartoe had hij zeven duizend schapen, en drie duizend kamelen, en vijfhonderd juk ossen, en vijfhonderd ezelinnen; ook had hij zeer veel dienstvolk; zodat deze man groter was dan al die van het oosten.", "Spr 18:23": "De arme spreekt smekingen; maar de rijke antwoordt harde dingen.", "2 Tess 2:16": "En onze Heere Jezus Christus Zelf, en onze God en Vader, Die ons heeft liefgehad, en een eeuwige vertroosting en goede hoop gegeven heeft in genade,", "Matt 10:29": "Worden niet twee musjes voor een penninkje verkocht? En niet één daarvan zal op de aarde vallen zonder uw Vader.", "1 Kon 8:45": "hoor dan in de hemel hun gebed en hun smeking, en voer hun recht uit.", "Spr 10:26": "Zoals azijn is voor de tanden, en zoals rook voor de ogen, zo is de luiaard voor hen die hem uitzenden.", "Matt 10:41": "Wie een profeet ontvangt in de naam van een profeet, zal het loon van een profeet ontvangen; en wie een rechtvaardige ontvangt in de naam van een rechtvaardige, zal het loon van een rechtvaardige ontvangen.", "Ezech 11:13": "Het gebeurde nu, toen ik profeteerde, dat Pelatja, de zoon van Benaja, stierf. Toen viel ik neer op mijn gezicht, en riep met luide stem, en zei: Ach, Heere HEERE! Zult U een volledig einde maken met het overblijfsel van Israël?", "1 Kor 7:1": "Wat betreft de dingen waarover u mij geschreven hebt: het is goed voor een mens geen vrouw aan te raken.", "Ps 7:10": "Laat toch de slechtheid van de goddelozen een einde nemen, maar bevestig de rechtvaardige, U, Die harten en nieren doorziet, o rechtvaardige God!", "1 Kon 7:21": "Daarna richtte hij de pilaren op in het voorhuis van de tempel; en toen hij de rechterpilaar had opgericht, noemde hij die Jachin, en toen hij de linkerpilaar had opgericht, noemde hij die Boaz.", "Gal 6:9": "Laten we bij het goeddoen niet moe worden; want op zijn tijd zullen we maaien, als we niet verslappen.", "Num 27:17": "Die voor hen uitgaat, en die voor hen ingaat, en die hen uitleidt, en die hen inleidt; opdat de vergadering van de HEERE niet is als schapen die geen herder hebben.", "Ps 91:4": "Hij zal u dekken met Zijn vlerken, en onder Zijn vleugels zult u vertrouwen; Zijn waarheid is een schild en beukelaar.", "Ezech 46:7": "En als spijsoffer zal hij bereiden een efa bij de var, en een efa bij de ram; maar bij de lammeren, naar wat zijn hand kan opbrengen; en een hin olie bij een efa.", "1 Tess 3:10": "Nacht en dag zeer overvloedig biddend, om uw gezicht te mogen zien en te volmaken wat er aan uw geloof ontbreekt.", "Luk 7:6": "En Jezus ging met hen mee. En toen Hij al niet ver meer van het huis was, zond de hoofdman over honderd enkele vrienden naar Hem toe, en zei tegen Hem: Heere, doe geen moeite; want ik ben het niet waard dat U onder mijn dak komt.", "Lev 25:25": "Wanneer uw broeder verarmd zal zijn, en iets van zijn bezitting verkocht zal hebben, dan zal zijn losser, die hem het naast bestaat, komen, en zal het verkochte van zijn broeder lossen.", "Ps 45:11": "Hoor, o Dochter! en zie, en neig uw oor; en vergeet uw volk en het huis van uw vader.", "Gen 15:2": "Toen zei Abram: Heere HEERE, wat zult U mij geven, terwijl ik zonder kinderen heenga en de bezorger van mijn huis deze Damascener Eliëzer is?", "Kol 2:2": "Opdat hun harten getroost worden, en zij samengevoegd zijn in de liefde, en tot alle rijkdom van de volle verzekerdheid van het verstand, tot kennis van de verborgenheid van God en de Vader, en van Christus;", "Ps 41:2": "Gelukkig is hij, die zich verstandig gedraagt tegenover een ellendige; de HEERE zal hem bevrijden ten dage des kwaads.", "Ex 34:9": "En hij zei: Heere! Als ik nu genade gevonden heb in Uw ogen, ga dan nu de Heere in ons midden, want dit is een hardnekkig volk; maar vergeef onze ongerechtigheid en onze zonde, en neem ons aan tot een erfdeel!", "Ezech 45:24": "Ook zal hij een spijsoffer klaarmaken, een efa bij een var, en een efa bij een ram; en een hin olie bij een efa.", "Ps 12:2": "Behoud, o HEERE; want de goedertierene ontbreekt, want de getrouwen zijn weinig geworden onder de mensenkinderen.", "Ruth 4:6": "Toen zei die losser: Ik zal het voor mijzelf niet kunnen lossen, want anders verderf ik mijn eigen erfdeel; los u mijn lossingsrecht voor uzelf; want ik zal het niet kunnen lossen.", "Jak 1:5": "En als iemand van u wijsheid ontbreekt, laat hij die van God vragen, Die ieder mild geeft en niet verwijt; en ze zal hem gegeven worden.", "Deut 8:18": "Maar u zult denken aan de HEERE, uw God, dat Hij het is die u kracht geeft om vermogen te verwerven; opdat Hij Zijn verbond bevestigt, dat Hij aan uw vaderen gezworen heeft, zoals het op deze dag is.", "Num 10:35": "Het gebeurde nu bij het optrekken van de ark, dat Mozes zei: Sta op, HEERE! En laat Uw vijanden verstrooid worden, en laat Uw haters van Uw aangezicht vluchten!", "Ps 80:3": "Wek Uw macht op voor het aangezicht van Efraïm, en Benjamin, en Manasse, en kom tot onze verlossing.", "2 Kon 4:18": "Toen het kind groter werd, gebeurde het op een dag, dat het uitging naar zijn vader, naar de maaiers.", "Richt 5:31": "Zo moeten omkomen al Uw vijanden, o HEERE! Die Hem daarentegen liefhebben, moeten zijn, als wanneer de zon opgaat in haar kracht. En het land was stil, veertig jaren.", "Matt 25:35": "Want Ik ben hongerig geweest, en u hebt Mij te eten gegeven; Ik ben dorstig geweest, en u hebt Mij te drinken gegeven; Ik was een vreemdeling, en u hebt Mij een onderkomen gegeven.", "Jes 5:10": "Ja, tien bunders wijngaard zullen maar één bath geven, en een homer zaad zal een efa geven.", "Ex 16:36": "Een gomer nu is het tiende deel van een efa.", "1 Sam 17:17": "En Isaï zei tegen zijn zoon David: Neem toch voor uw broers een efa van dit geroosterde koren, en deze tien broden, en breng ze snel naar het leger, naar uw broers.", "Deut 8:10": "Als u dan gegeten zult hebben, en verzadigd bent, dan zult u de HEERE, uw God, loven, om dat goede land dat Hij u gegeven zal hebben.", "Ruth 1:2": "De naam van deze man was Elimelech, en de naam van zijn vrouw Naomi, en de naam van zijn twee zonen Machlon en Chiljon, Efrathieten, uit Bethlehem-juda; en zij kwamen in de velden van Moab, en bleven daar.", "2 Tim 4:22": "De Heere Jezus Christus zij met uw geest. De genade zij met u. Amen. De tweede brief aan Timotheüs, aangesteld als eerste opziener van de gemeente van Efeze, werd vanuit Rome geschreven, toen Paulus voor de tweede keer voorgeleid werd voor Nero.", "Ps 122:7": "Vrede zij binnen uw vesting, welvaart in uw paleizen.", "Ps 133:1-3": "Een lied Hammaäloth, van David. Zie, hoe goed en hoe fijn is het, dat broeders ook samenwonen! Het is als de kostelijke olie op het hoofd, die neerdaalt op de baard, de baard van Aäron, die neerdaalt tot op de zoom van zijn kleren. Het is als de dauw van Hermon, en die neerdaalt op de bergen van Sion, want de HEERE gebiedt daar de zegen en het leven tot in eeuwigheid.", "Est 6:1": "Diezelfde nacht kon de koning niet slapen, en hij zei dat men het boek van de gedenkwaardigheden, de kronieken, moest brengen; en die werden voorgelezen in de tegenwoordigheid van de koning.", "Ps 36:11": "Strek Uw goedertierenheid uit over degenen, die U kennen, en Uw gerechtigheid over de oprechten van hart.", "2 Kon 4:44": "Zo zette hij het hun voor, en zij aten, en zij hielden over, naar het woord van de HEERE.", "Spr 25:20": "Wie liederen zingt bij een treurig hart, is als iemand die een kleed aflegt op de dag van de koude, en als azijn op salpeter.", "Num 6:3": "Van wijn en sterke drank zal hij zich afzonderen; wijnazijn en azijn van sterke drank zal hij niet drinken, ook geen vocht van druiven zal hij drinken, en geen verse of gedroogde druiven eten.", "Luk 18:30": "die niet veel meer terug zal ontvangen in deze tijd, en in de toekomende eeuw het eeuwige leven.", "2 Kon 4:43": "Doch zijn dienaar zei: Wat, zou ik dit aan honderd mannen voorzetten? En hij zei: Geef aan het volk, zodat zij eten; want zo zegt de HEERE: Men zal eten en overhouden.", "Matt 24:45": "Wie is dan de trouwe en verstandige dienstknecht, aan wie zijn heer het gezag over zijn huisbedienden gegeven heeft, om hun op de juiste tijd voedsel te geven?", "Luk 3:32": "de zoon van Isaï, de zoon van Obed, de zoon van Boaz, de zoon van Salmon, de zoon van Nahasson,", "1 Sam 24:20": "Wanneer iemand zijn vijand gevonden heeft, zal hij hem dan ongedeerd zijn weg laten gaan? De HEERE nu vergeldt u het goede, voor deze dag die u mij heden aangedaan hebt.", "Kol 2:1": "Want ik wil dat u weet hoe zware strijd ik voor u heb, en voor hen die in Laodicea zijn, en voor allen die mijn gezicht in het vlees niet gezien hebben;", "Hebr 6:10": "Want God is niet onrechtvaardig, dat Hij uw werk zou vergeten, en de inzet van de liefde die u aan Zijn Naam bewezen hebt, doordat u de heiligen gediend hebt en nog dient.", "2 Joh 1:11": "Want die tegen hem zegt: wees gegroet, die heeft gemeenschap aan zijn slechte werken.", "Ex 32:31": "Zo keerde Mozes terug tot de HEERE, en zei: Och, dit volk heeft een grote zonde gezondigd, doordat zij zich gouden goden gemaakt hebben.", "Zach 5:6-10": "En ik zei: Wat is dat? En Hij zei: Dit is een efa die tevoorschijn komt. Verder zei Hij: Dit is het beeld van hen in het hele land. En zie, een plaat van lood werd opgeheven, en er was een vrouw, zittend midden in de efa. En Hij zei: Dit is de goddeloosheid; en Hij wierp haar midden in de efa; en Hij wierp het loden gewicht op de mond daarvan.", "2 Kor 9:14": "En door hun gebed voor u, die naar u verlangen, om de uitnemende genade van God over u.", "Joz 7:7-26": "En Jozua zei: Ach, Heere HEERE! Waarom hebt U dit volk ooit de Jordaan laten oversteken, om ons te geven in de hand van de Amorieten, om ons te vernietigen? Was het toch maar zo dat wij tevreden waren geweest en gebleven waren aan de overkant van de Jordaan! Och, Heere! Wat zal ik zeggen, nu Israël voor het aangezicht van zijn vijanden de rug heeft gekeerd? Als de Kanaänieten en alle inwoners van het land dit horen, zullen zij ons omsingelen, en onze naam van de aarde uitroeien; wat zult U dan doen voor Uw grote Naam?", "Luk 1:43": "En waar heb ik dit aan te danken, dat de moeder van mijn Heere naar mij toe komt?", "Ezech 45:11": "Een efa en een bath zullen van dezelfde maat zijn, zodat een bath het tiende deel van een homer bevat; ook een efa het tiende deel van een homer; de maat daarvan zal zijn naar de homer.", "1 Kon 8:44": "Wanneer Uw volk in de oorlog tegen zijn vijand uittrekken zal, langs de weg die U hen zenden zult, en tot de HEERE bidden zullen in de richting van deze stad, die U verkoren hebt, en van dit huis, dat ik voor Uw Naam gebouwd heb;", "Kol 1:4": "sinds wij van uw geloof in Christus Jezus gehoord hebben, en van de liefde die u hebt tot alle heiligen.", "Ps 80:15": "O God van de heerscharen! Keer toch terug; kijk uit de hemel, en zie, en zoek dan om te helpen deze wijnstok,", "Ezech 46:5": "En het spijsoffer, een efa bij de ram, maar bij de lammeren zal het spijsoffer een gave van zijn hand zijn; en olie, een hin bij een efa.", "1 Tim 5:4": "Maar als een weduwe kinderen heeft, of kleinkinderen, moeten die eerst leren om aan hun eigen huis godsvrucht te bewijzen, en hun voorouders wederdienst te doen; want dat is goed en welgevallig voor God.", "Joh 6:13": "Zij verzamelden ze dan, en vulden twaalf korven met brokken van de vijf gerstebroden, die overgebleven waren bij hen die gegeten hadden.", "Job 31:16-22": "Als ik de armen hun begeerte onthouden heb, of de ogen van de weduwe laten versmachten; En mijn bete alleen gegeten heb, zodat de wees daarvan niet gegeten heeft; (Want van mijn jonkheid af is hij bij mij opgetogen, als bij een vader, en van mijner moeders buik af heb ik haar geleid;)", "2 Sam 2:5": "Toen zond David boden naar de mannen van Jabes in Gilead, en hij zei tegen hen: Gezegend bent u door de HEERE, dat u deze weldadigheid gedaan hebt aan uw heer, aan Saul, en hem begraven hebt.", "Matt 9:2": "En Jezus zag hun geloof en zei tegen de verlamde man: Zoon, houd moed; uw zonden zijn u vergeven.", "1 Tess 5:23": "En de God van de vrede Zelf heilige u geheel en al; en uw geheel oprechte geest, en ziel, en lichaam moeten onberispelijk bewaard worden bij de komst van onze Heere Jezus Christus.", "Ps 28:9": "Verlos Uw volk, en zegen Uw erfdeel, en weid hen, en verhef hen tot in eeuwigheid.", "Matt 10:7-11": "En terwijl u heengaat, predikt en zeg: Het Koninkrijk der hemelen is nabijgekomen. Geneest de zieken; reinigt de melaatsen; wekt de doden op; drijft de duivelen uit. U hebt het voor niets ontvangen, geeft het voor niets. Verkrijgt u geen goud, geen zilver, geen koperen geld in uw gordels;", "1 Sam 25:18": "Toen haastte Abigaïl zich, en nam tweehonderd broden, en twee lederzakken wijn, en vijf toebereide schapen, en vijf maten geroosterd koren, en honderd stukken rozijnen, en tweehonderd klompen vijgen, en legde die op ezels.", "Fil 2:3": "Doe niets uit twist of ijdele eer, maar acht door ootmoedigheid de een de ander voortreffelijker dan uzelf.", "2 Sam 9:8": "Toen boog hij zich neer, en zei: Wat is uw knecht, dat u omgezien hebt naar een dode hond, zoals ik ben?", "Ezech 9:8": "Het gebeurde nu, toen zij hen geslagen hadden en ik overgebleven was, dat ik op mijn aangezicht viel, en riep, en zei: Ach, Heere HEERE, zult U het hele overblijfsel van Israël verderven, door Uw grimmigheid uit te gieten over Jeruzalem?", "1 Joh 5:18": "Wij weten dat ieder die uit God geboren is, niet zondigt; maar wie uit God geboren is, bewaart zichzelf, en de boze krijgt geen vat op hem.", "Spr 11:25": "De zegenende ziel zal vet gemaakt worden; en wie bevochtigt, zal ook zelf verkwikt worden.", "Jes 62:1": "Om Sion zal Ik niet zwijgen, en om Jeruzalem zal Ik niet stil zijn; totdat haar gerechtigheid voortkomt als een glans, en haar heil als een fakkel, die brandt.", "Luk 1:28": "En de engel kwam bij haar binnen, en zei: Wees gegroet, begenadigde; de Heere is met u; u bent gezegend onder de vrouwen.", "Rom 10:1": "Broeders, de toegenegenheid van mijn hart en het gebed dat ik tot God doe voor Israël, is tot hun zaligheid.", "Gal 1:3": "Genade zij u en vrede van God de Vader, en onze Heere Jezus Christus;", "Ps 118:26": "Gezegend is hij die daar komt in de Naam van de HEERE! Wij zegenen u uit het huis van de HEERE.", "Ps 105:15": "Raak Mijn gezalfden niet aan, en doe Mijn profeten geen kwaad.", "Deut 8:17": "En u in uw hart zegt: Mijn kracht, en de sterkte van mijn hand heeft mij dit vermogen verworven.", "Richt 6:19": "En Gideon ging naar binnen, en maakte een geitenbokje klaar, en ongezuurde koeken van een efa meel; het vlees legde hij in een mand, en het vleesnat deed hij in een pot; en hij bracht het naar Hem toe, onder de eik, en zette het neer.", "2 Kron 30:18": "Want een menigte van het volk, velen uit Efraïm en Manasse, Issaschar en Zebulon, hadden zich niet gereinigd, maar aten het pascha, niet zoals geschreven is. Doch Hizkia bad voor hen, en zei: De HEERE, die goed is, doe verzoening voor ieder,", "Ps 129:8": "en zij die voorbijgaan, niet zeggen: De zegen van de HEERE zij bij u! Wij zegenen u in de Naam van de HEERE.", "Num 5:15": "Dan zal die man zijn huisvrouw tot de priester brengen, en zal haar offerande voor haar meebrengen, een tiende deel van een efa gerstemeel; hij zal geen olie daarop gieten, en geen wierook daarop leggen, omdat het een spijsoffer van de ijveringen is, een spijsoffer van de gedachtenis, dat de ongerechtigheid in gedachtenis brengt.", "Luk 14:26": "Als iemand bij Mij komt en niet zijn vader, en moeder, en vrouw, en kinderen, en broers, en zussen, ja, zelfs ook zijn eigen leven haat, die kan Mijn discipel niet zijn.", "1 Sam 25:41": "Toen stond zij op, en boog zich met het aangezicht ter aarde, en zij zei: Zie, uw dienstmaagd zij een dienares, om de voeten van de knechten van mijn heer te wassen.", "1 Petr 5:5": "Evenzo, u jongeren, wees de ouderen onderdanig; en wees allen elkaar onderdanig; bekleed u met nederigheid; want God weerstaat de hoogmoedigen, maar aan de nederigen geeft Hij genade.", "Ruth 1:22": "Zo kwam Naomi terug, en Ruth, de Moabitische, haar schoondochter, met haar, die uit de velden van Moab terugkeerde; en zij kwamen in Bethlehem aan het begin van de gersteoogst.", "Deut 11:15": "En Ik zal gras geven op uw veld voor uw dieren; en u zult eten en verzadigd worden.", "Joz 24:15": "Doch als het kwaad is in uw ogen om de HEERE te dienen, kies heden wie u dienen zult; hetzij de goden die uw vaders, die aan de andere kant van de rivier waren, gediend hebben, of de goden van de Amorieten, in wiens land u woont; maar wat mij en mijn huis aangaat, wij zullen de HEERE dienen!", "Job 29:13": "De zegen van hem die verloren dreigde te gaan, kwam op mij; en het hart van de weduwe deed ik vrolijk zingen.", "Kol 2:18": "Laat dan niemand u de prijs ontnemen door het eigenzinnig verlangen naar nederigheid en verering van engelen, terwijl hij zich verdiept in dingen die hij niet gezien heeft, zonder reden opgeblazen door het denken van zijn vlees;", "Ps 20:2-5": "De HEERE verhoort u in de dag van benauwdheid; de Naam van de God van Jakob zet u in een hoog vertrek. Hij zendt uw hulp uit het heiligdom, en ondersteunt u uit Sion. Hij gedenkt al uw spijsoffers, en maakt uw brandoffer tot as. Sela.", "2 Tess 3:5": "Doch de Heere richte uw harten op de liefde van God, en op de lijdzaamheid van Christus.", "Luk 14:33": "Zo kan dan ieder van u die niet alles opgeeft wat hij heeft, Mijn discipel niet zijn.", "2 Tess 2:17": "moge uw harten vertroosten, en u versterken in alle goed woord en werk.", "Ruth 4:3": "Toen zei hij tegen die losser: Het stuk land dat van onze broeder Elimelech was, heeft Naomi, die uit het land van de Moabieten teruggekomen is, verkocht.", "Ps 19:12": "Ook wordt Uw knecht daardoor klaar vermaand; in het houden ervan is grote loon.", "Ps 134:3": "De HEERE zegent u uit Sion, Hij, Die de hemel en de aarde gemaakt heeft.", "1 Kon 8:29": "Dat Uw ogen open zijn, nacht en dag, over dit huis, over deze plaats, waarvan U gezegd hebt: Mijn Naam zal daar zijn; om te horen naar het gebed, dat Uw dienaar bidden zal op deze plaats.", "1 Tess 3:13": "opdat Hij uw harten versterkt, om onberispelijk te zijn in heiligmaking, voor onze God en Vader, bij de komst van onze Heere Jezus Christus met al Zijn heiligen.", "1 Kon 8:38": "elk gebed, elke smeking, die door enig mens, door al Uw volk Israël gebeuren zal; wanneer zij erkennen, ieder de plaag van zijn eigen hart, en ieder zijn handen in dit huis uitbreiden zal;", "Spr 15:33": "De vreze van de HEERE is de tucht van de wijsheid; en de nederigheid gaat vooraf aan de eer.", "Richt 19:3": "En haar man maakte zich op, en trok haar achterna, om vriendelijk tegen haar te spreken, om haar terug te halen; en zijn knecht was bij hem, en een paar ezels. En zij bracht hem in het huis van haar vader. En toen de vader van de jonge vrouw hem zag, werd hij blij dat hij hem ontmoette.", "Gal 6:16": "En zovelen als er naar deze regel zullen wandelen, over hen zij vrede en barmhartigheid, en over het Israël van God.", "Ps 132:8-10": "Sta op, HEERE, tot Uw rust, U en de ark van Uw sterkte! Dat Uw priesters bekleed worden met gerechtigheid, en dat Uw gunstgenoten juichen. Wend het gezicht van Uw gezalfde niet af, om Davids wil, Uw dienaar.", "2 Kron 6:41": "En nu, HEERE God, maak U op tot Uw rust, U en de ark van Uw kracht; laat Uw priesters, HEERE God, met heil bekleed worden, en laat Uw gunstgenoten¹ over het goede blijde zijn.", "Hebr 11:8": "Door het geloof is Abraham, toen hij geroepen werd, gehoorzaam geweest om uit te gaan naar de plaats die hij tot een erfdeel zou ontvangen; en hij is uitgegaan zonder te weten waar hij komen zou.", "1 Tess 4:12": "Opdat u eerlijk wandelt bij hen die buiten zijn, en niets nodig hebt.", "1 Sam 12:23": "Wat mij aangaat, het zij verre van mij, dat ik tegen de HEERE zou zondigen door op te houden voor u te bidden; maar ik zal u de goede en rechte weg leren.", "2 Kor 9:10": "Doch Die het zaad aan de zaaier verleent, Die verleent ook brood tot voedsel, en vermenigvuldigt uw gezaaisel, en vermeerdert de vruchten van uw gerechtigheid;", "2 Tess 3:16": "De Heere nu van de vrede Zelf geeft u vrede te allen tijde, op allerlei wijze. De Heere zij met u allen.", "2 Tim 4:16": "Bij mijn eerste verantwoording is niemand bij mij geweest, maar allen hebben mij verlaten. Het moet hun niet worden toegerekend.", "1 Sam 1:18": "En zij zei: Laat uw dienstmaagd genade vinden in uw ogen! Zo ging die vrouw haars weegs; en zij at, en haar gezicht was niet meer zo bedroefd.", "2 Kron 30:19": "die zijn hele hart erop gericht heeft, om God, de HEERE, de God van zijn vaderen, te zoeken, ook al is dat niet naar de reinheid van het heiligdom.", "Matt 1:5": "en Salmon verwekte Boaz bij Rachab, en Boaz verwekte Obed bij Ruth, en Obed verwekte Isaï;", "Gen 18:2": "En hij hief zijn ogen op en keek; en zie, daar stonden drie mannen tegenover hem; toen hij hen zag, liep hij hun tegemoet vanuit de deur van de tent, en boog zich tot op de grond.", "Lev 5:11": "Maar als zijn hand niet twee tortelduiven of twee jonge duiven kan bereiken, dan zal hij die gezondigd heeft, als zijn offergave het tiende deel van een efa meelbloem brengen als zondoffer; hij zal er geen olie overheen doen, en er ook geen wierook op leggen; want het is een zondoffer.", "1 Kron 29:18": "O HEERE, God van onze vaders, Abraham, Izak en Israël, bewaar dit voor eeuwig in de gedachten van het hart van Uw volk, en richt hun hart op U.", "Filem 1:1": "Paulus, een gevangene van Christus Jezus, en Timotheüs, de broeder, aan Filemon, de geliefde, en onze medearbeider,", "Ps 69:22": "Ja, zij hebben mij gal tot mijn spijs gegeven; en in mijn dorst hebben zij mij azijn te drinken gegeven.", "Ruth 1:16": "Maar Ruth zei: Dring er bij mij niet op aan om u te verlaten, om van achter u terug te keren; want waar u heen zult gaan, zal ik ook heen gaan, en waar u zult overnachten, zal ik overnachten; uw volk is mijn volk, en uw God mijn God."}, "noten": {"1": "D.i. korenmaat (ca. 22 liter)."}, "koppeling": {"1": "<span class=\"wl\" data-l=\"L1\" data-code=\"H5281\">Naomi</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H5281\">had</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H4129\">een</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H4129\">bloedverwant</span> <span class=\"wl\" data-l=\"L2\" data-cod
