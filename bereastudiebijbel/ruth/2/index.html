kjv\" data-code=\"H7641\">corn</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> him in whose <span class=\"wl wl-kjv\" data-code=\"H5869\">sight</span> I shall <span class=\"wl wl-kjv\" data-code=\"H4672\">find</span> <span class=\"wl wl-kjv\" data-code=\"H2580\">grace.</span> And she <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto her, <span class=\"wl wl-kjv\" data-code=\"H3212\">Go,</span> my daughter.", "3": "And she <span class=\"wl wl-kjv\" data-code=\"H3212\">went,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">came,</span> and <span class=\"wl wl-kjv\" data-code=\"H3950\">gleaned</span> in the <span class=\"wl wl-kjv\" data-code=\"H7704\">field</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> the <span class=\"wl wl-kjv\" data-code=\"H7114\">reapers:</span> and her <span class=\"wl wl-kjv\" data-code=\"H4745\">hap</span> was to <span class=\"wl wl-kjv\" data-code=\"H7136\">light</span> on a <span class=\"wl wl-kjv\" data-code=\"H2513\">part</span> of the <span class=\"wl wl-kjv\" data-code=\"H7704\">field</span> belonging unto <span class=\"wl wl-kjv\" data-code=\"H1162\">Boaz,</span> who was of the <span class=\"wl wl-kjv\" data-code=\"H4940\">kindred</span> of Elimelech.", "4": "And, behold, <span class=\"wl wl-kjv\" data-code=\"H1162\">Boaz</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> from <span class=\"wl wl-kjv\" data-code=\"H1035\">Bethlehem,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto the <span class=\"wl wl-kjv\" data-code=\"H7114\">reapers,</span> The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> be with you. And they <span class=\"wl wl-kjv\" data-code=\"H559\">answered</span> him, The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> bless", "5": "Then <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> <span class=\"wl wl-kjv\" data-code=\"H1162\">Boaz</span> unto his <span class=\"wl wl-kjv\" data-code=\"H5288\">servant</span> that was <span class=\"wl wl-kjv\" data-code=\"H5324\">set</span> over the <span class=\"wl wl-kjv\" data-code=\"H7114\">reapers,</span> Whose damsel", "6": "And the <span class=\"wl wl-kjv\" data-code=\"H5288\">servant</span> that was <span class=\"wl wl-kjv\" data-code=\"H5324\">set</span> over the <span class=\"wl wl-kjv\" data-code=\"H7114\">reapers</span> <span class=\"wl wl-kjv\" data-code=\"H6030\">answered</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> It is the <span class=\"wl wl-kjv\" data-code=\"H4125\">Moabitish</span> <span class=\"wl wl-kjv\" data-code=\"H5291\">damsel</span> that came <span class=\"wl wl-kjv\" data-code=\"H7725\">back</span> with <span class=\"wl wl-kjv\" data-code=\"H5281\">Naomi</span> out of the <span class=\"wl wl-kjv\" data-code=\"H7704\">country</span> of Moab:", "7": "And she <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> I pray you, let me <span class=\"wl wl-kjv\" data-code=\"H3950\">glean</span> and <span class=\"wl wl-kjv\" data-code=\"H622\">gather</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> the <span class=\"wl wl-kjv\" data-code=\"H7114\">reapers</span> among the <span class=\"wl wl-kjv\" data-code=\"H6016\">sheaves:</span> so she <span class=\"wl wl-kjv\" data-code=\"H935\">came,</span> and hath <span class=\"wl wl-kjv\" data-code=\"H5975\">continued</span> <span class=\"wl wl-kjv\" data-code=\"H227\">even</span> from the <span class=\"wl wl-kjv\" data-code=\"H1242\">morning</span> until now, that she <span class=\"wl wl-kjv\" data-code=\"H3427\">tarried</span> a <span class=\"wl wl-kjv\" data-code=\"H4592\">little</span> in the house.", "8": "Then <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> <span class=\"wl wl-kjv\" data-code=\"H1162\">Boaz</span> unto <span class=\"wl wl-kjv\" data-code=\"H7327\">Ruth,</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">Hearest</span> thou not, my <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter?</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">Go</span> not to <span class=\"wl wl-kjv\" data-code=\"H3950\">glean</span> in <span class=\"wl wl-kjv\" data-code=\"H312\">another</span> <span class=\"wl wl-kjv\" data-code=\"H7704\">field,</span> neither <span class=\"wl wl-kjv\" data-code=\"H5674\">go</span> from hence, but <span class=\"wl wl-kjv\" data-code=\"H1692\">abide</span> here fast by my maidens:", "9": "Let thine <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes</span> be on the <span class=\"wl wl-kjv\" data-code=\"H7704\">field</span> that they do <span class=\"wl wl-kjv\" data-code=\"H7114\">reap,</span> and <span class=\"wl wl-kjv\" data-code=\"H1980\">go</span> thou <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> them: have I not <span class=\"wl wl-kjv\" data-code=\"H6680\">charged</span> the young <span class=\"wl wl-kjv\" data-code=\"H5288\">men</span> that they shall not <span class=\"wl wl-kjv\" data-code=\"H5060\">touch</span> thee? and when thou art <span class=\"wl wl-kjv\" data-code=\"H6770\">athirst,</span> <span class=\"wl wl-kjv\" data-code=\"H1980\">go</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3627\">vessels,</span> and <span class=\"wl wl-kjv\" data-code=\"H8354\">drink</span> of that which the young <span class=\"wl wl-kjv\" data-code=\"H5288\">men</span> have drawn.", "10": "Then she <span class=\"wl wl-kjv\" data-code=\"H5307\">fell</span> on her <span class=\"wl wl-kjv\" data-code=\"H6440\">face,</span> and <span class=\"wl wl-kjv\" data-code=\"H7812\">bowed</span> herself to the <span class=\"wl wl-kjv\" data-code=\"H776\">ground,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, Why have I <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> <span class=\"wl wl-kjv\" data-code=\"H2580\">grace</span> in thine <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes,</span> that thou shouldest take <span class=\"wl wl-kjv\" data-code=\"H5234\">knowledge</span> of me, seeing I am a stranger?", "11": "And <span class=\"wl wl-kjv\" data-code=\"H1162\">Boaz</span> <span class=\"wl wl-kjv\" data-code=\"H6030\">answered</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto her, It hath <span class=\"wl wl-kjv\" data-code=\"H5046\">fully</span> been <span class=\"wl wl-kjv\" data-code=\"H5046\">shewed</span> me, all that thou hast <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> unto thy mother in <span class=\"wl wl-kjv\" data-code=\"H2545\">law</span> <span class=\"wl wl-kjv\" data-code=\"H310\">since</span> the <span class=\"wl wl-kjv\" data-code=\"H4194\">death</span> of thine <span class=\"wl wl-kjv\" data-code=\"H376\">husband:</span> and how thou hast <span class=\"wl wl-kjv\" data-code=\"H5800\">left</span> thy <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> and thy <span class=\"wl wl-kjv\" data-code=\"H517\">mother,</span> and the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of thy <span class=\"wl wl-kjv\" data-code=\"H4138\">nativity,</span> and art <span class=\"wl wl-kjv\" data-code=\"H3212\">come</span> unto a <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> which thou <span class=\"wl wl-kjv\" data-code=\"H3045\">knewest</span> not <span class=\"wl wl-kjv\" data-code=\"H8543\">heretofore.</span>", "12": "The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H7999\">recompense</span> thy <span class=\"wl wl-kjv\" data-code=\"H6467\">work,</span> and a <span class=\"wl wl-kjv\" data-code=\"H8003\">full</span> <span class=\"wl wl-kjv\" data-code=\"H4909\">reward</span> be given thee of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> under whose <span class=\"wl wl-kjv\" data-code=\"H3671\">wings</span> thou art <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> to trust.", "13": "Then she <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Let me <span class=\"wl wl-kjv\" data-code=\"H4672\">find</span> <span class=\"wl wl-kjv\" data-code=\"H2580\">favour</span> in thy <span class=\"wl wl-kjv\" data-code=\"H5869\">sight,</span> my <span class=\"wl wl-kjv\" data-code=\"H113\">lord;</span> for that thou hast <span class=\"wl wl-kjv\" data-code=\"H5162\">comforted</span> me, and for that thou hast <span class=\"wl wl-kjv\" data-code=\"H1696\">spoken</span> <span class=\"wl wl-kjv\" data-code=\"H3820\">friendly</span> unto thine <span class=\"wl wl-kjv\" data-code=\"H8198\">handmaid,</span> though I be not like unto <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> of thine handmaidens.", "14": "And <span class=\"wl wl-kjv\" data-code=\"H1162\">Boaz</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto her, At <span class=\"wl wl-kjv\" data-code=\"H6256\">mealtime</span> <span class=\"wl wl-kjv\" data-code=\"H5066\">come</span> thou <span class=\"wl wl-kjv\" data-code=\"H1988\">hither,</span> and <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> of the <span class=\"wl wl-kjv\" data-code=\"H3899\">bread,</span> and <span class=\"wl wl-kjv\" data-code=\"H2881\">dip</span> thy <span class=\"wl wl-kjv\" data-code=\"H6595\">morsel</span> in the <span class=\"wl wl-kjv\" data-code=\"H2558\">vinegar.</span> And she <span class=\"wl wl-kjv\" data-code=\"H3427\">sat</span> <span class=\"wl wl-kjv\" data-code=\"H6654\">beside</span> the <span class=\"wl wl-kjv\" data-code=\"H7114\">reapers:</span> and he <span class=\"wl wl-kjv\" data-code=\"H6642\">reached</span> her <span class=\"wl wl-kjv\" data-code=\"H7039\">parched</span> corn, and she did <span class=\"wl wl-kjv\" data-code=\"H398\">eat,</span> and was <span class=\"wl wl-kjv\" data-code=\"H7646\">sufficed,</span> and left.", "15": "And when she was risen <span class=\"wl wl-kjv\" data-code=\"H6965\">up</span> to <span class=\"wl wl-kjv\" data-code=\"H3950\">glean,</span> <span class=\"wl wl-kjv\" data-code=\"H1162\">Boaz</span> <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> his young <span class=\"wl wl-kjv\" data-code=\"H5288\">men,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Let her <span class=\"wl wl-kjv\" data-code=\"H3950\">glean</span> even among the <span class=\"wl wl-kjv\" data-code=\"H6016\">sheaves,</span> and reproach", "16": "And let <span class=\"wl wl-kjv\" data-code=\"H7997\">fall</span> also some of the <span class=\"wl wl-kjv\" data-code=\"H6653\">handfuls</span> of <span class=\"wl wl-kjv\" data-code=\"H7997\">purpose</span> for her, and <span class=\"wl wl-kjv\" data-code=\"H5800\">leave</span> them, that she may <span class=\"wl wl-kjv\" data-code=\"H3950\">glean</span> them, and rebuke", "17": "So she <span class=\"wl wl-kjv\" data-code=\"H3950\">gleaned</span> in the <span class=\"wl wl-kjv\" data-code=\"H7704\">field</span> until <span class=\"wl wl-kjv\" data-code=\"H6153\">even,</span> and beat <span class=\"wl wl-kjv\" data-code=\"H2251\">out</span> that she had <span class=\"wl wl-kjv\" data-code=\"H3950\">gleaned:</span> and it was about an <span class=\"wl wl-kjv\" data-code=\"H374\">ephah</span> of barley.", "18": "And she took it <span class=\"wl wl-kjv\" data-code=\"H5375\">up,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">went</span> into the <span class=\"wl wl-kjv\" data-code=\"H5892\">city:</span> and her mother in <span class=\"wl wl-kjv\" data-code=\"H2545\">law</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> what she had <span class=\"wl wl-kjv\" data-code=\"H3950\">gleaned:</span> and she brought <span class=\"wl wl-kjv\" data-code=\"H3318\">forth,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> to her that she had <span class=\"wl wl-kjv\" data-code=\"H3498\">reserved</span> after she was sufficed.", "19": "And her mother in <span class=\"wl wl-kjv\" data-code=\"H2545\">law</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto her, Where hast thou <span class=\"wl wl-kjv\" data-code=\"H3950\">gleaned</span> to <span class=\"wl wl-kjv\" data-code=\"H3117\">day?</span> and <span class=\"wl wl-kjv\" data-code=\"H375\">where</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">wroughtest</span> thou? <span class=\"wl wl-kjv\" data-code=\"H1288\">blessed</span> be he that did take <span class=\"wl wl-kjv\" data-code=\"H5234\">knowledge</span> of thee. And she <span class=\"wl wl-kjv\" data-code=\"H5046\">shewed</span> her mother in <span class=\"wl wl-kjv\" data-code=\"H2545\">law</span> with whom she had <span class=\"wl wl-kjv\" data-code=\"H6213\">wrought,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> The <span class=\"wl wl-kjv\" data-code=\"H376\">man's</span> <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> with whom I <span class=\"wl wl-kjv\" data-code=\"H6213\">wrought</span> to <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> is Boaz.", "20": "And <span class=\"wl wl-kjv\" data-code=\"H5281\">Naomi</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto her daughter in <span class=\"wl wl-kjv\" data-code=\"H3618\">law,</span> <span class=\"wl wl-kjv\" data-code=\"H1288\">Blessed</span> be he of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> who hath not left <span class=\"wl wl-kjv\" data-code=\"H5800\">off</span> his <span class=\"wl wl-kjv\" data-code=\"H2617\">kindness</span> to the <span class=\"wl wl-kjv\" data-code=\"H2416\">living</span> and to the <span class=\"wl wl-kjv\" data-code=\"H4191\">dead.</span> And <span class=\"wl wl-kjv\" data-code=\"H5281\">Naomi</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto her, The <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> is near of <span class=\"wl wl-kjv\" data-code=\"H7138\">kin</span> unto us, one of our next kinsmen.", "21": "And <span class=\"wl wl-kjv\" data-code=\"H7327\">Ruth</span> the <span class=\"wl wl-kjv\" data-code=\"H4125\">Moabitess</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> He <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto me also, Thou shalt keep <span class=\"wl wl-kjv\" data-code=\"H1692\">fast</span> by my young <span class=\"wl wl-kjv\" data-code=\"H5288\">men,</span> until they have <span class=\"wl wl-kjv\" data-code=\"H3615\">ended</span> all my harvest.", "22": "And <span class=\"wl wl-kjv\" data-code=\"H5281\">Naomi</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H7327\">Ruth</span> her daughter in <span class=\"wl wl-kjv\" data-code=\"H3618\">law,</span> It is <span class=\"wl wl-kjv\" data-code=\"H2896\">good,</span> my <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter,</span> that thou go <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> with his <span class=\"wl wl-kjv\" data-code=\"H5291\">maidens,</span> that they <span class=\"wl wl-kjv\" data-code=\"H6293\">meet</span> thee not in any <span class=\"wl wl-kjv\" data-code=\"H312\">other</span> field.", "23": "So she kept <span class=\"wl wl-kjv\" data-code=\"H1692\">fast</span> by the <span class=\"wl wl-kjv\" data-code=\"H5291\">maidens</span> of <span class=\"wl wl-kjv\" data-code=\"H1162\">Boaz</span> to <span class=\"wl wl-kjv\" data-code=\"H3950\">glean</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3615\">end</span> of <span class=\"wl wl-kjv\" data-code=\"H8184\">barley</span> <span class=\"wl wl-kjv\" data-code=\"H7105\">harvest</span> and of <span class=\"wl wl-kjv\" data-code=\"H2406\">wheat</span> <span class=\"wl wl-kjv\" data-code=\"H7105\">harvest;</span> and <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelt</span> with her mother in law."}};

    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  const studieHtml = document.getElementById('studiepaneel-tpl').innerHTML;
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<div class="studiemenu"><button type="button" id="studieknop" class="navselect" title="Studie">💡</button>` +
    `<div class="studiepaneel" id="studiepaneel">${studieHtml}</div></div>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
  const studieknop = document.getElementById('studieknop'), studiepaneel = document.getElementById('studiepaneel');
  studieknop.onclick = e => { e.stopPropagation(); studiepaneel.classList.toggle('open'); };
  document.addEventListener('click', e => { if (!e.target.closest('.studiemenu')) studiepaneel.classList.remove('open'); });
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.Berea[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.Berea[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (Berea)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function paneelInhoud(n, tab) {
  if (tab === 'grondwoorden') {
    const heeftB = D.koppeling && D.koppeling[n];
    const heeftK = D.koppeling_kjv && D.koppeling_kjv[n];
    if (!heeftB && !heeftK) return '<em>Nog geen woordkoppeling voor dit vers.</em>';
    let h = '';
    if (heeftB) h += `<div class="tsk-kop">Berea</div>` +
      `<div class="gw-tekst" style="font-family:Georgia,serif;line-height:1.8">${D.koppeling[n]}</div>` +
      `<div class="gw-detail" style="margin-top:.5rem"></div>`;
    if (heeftK) h += `<div class="tsk-kop" style="margin-top:.9rem">KJV</div>` +
      `<div class="gw-tekst" style="font-family:Georgia,serif;line-height:1.8">${D.koppeling_kjv[n]}</div>` +
      `<div class="gw-detail" style="margin-top:.5rem"></div>`;
    return h + '<div class="bronregel">Klik op een onderstreept woord voor de vindplaatsen.</div>';
  }
  if (tab === 'vertalingen') {
    return PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
  }
  if (tab === 'verwijzingen') {
    const berea = D.tsk[n], engels = D.tsk_kjv[n];
    if ((!berea || !berea.length) && (!engels || !engels.length)) return '<em>Geen verwijzingen bij dit vers.</em>';
    let h = '';
    if (berea && berea.length) {
      h += '<div class="tsk-kop">Treasury of Scripture Knowledge | Berea</div>';
      h += berea.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r}">${r}</a>`).join('') + '</div>').join('');
    }
    if (engels && engels.length) {
      h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.tsk[n] && D.tsk[n].length), heeftO = !!D.onderwerpen[n];
  const heeftG = !!((D.koppeling && D.koppeling[n]) || (D.koppeling_kjv && D.koppeling_kjv[n]));
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : (heeftG ? 'grondwoorden' : 'vertalingen'));
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'grondwoorden' ? 'actief' : ''} ${heeftG ? '' : 'leeg'}" data-tab="grondwoorden" data-n="${n}">Grondwoorden</div>
    <div class="ntab" data-tab="vertalingen" data-n="${n}">Vertalingen</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.Berea[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · Berea</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}
</script>
</body>
