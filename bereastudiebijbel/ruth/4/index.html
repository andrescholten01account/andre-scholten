Toen zei hij: Ik zal het lossen.", "5": "Maar Boaz zei: Op de dag dat u het land aanvaardt van de hand van Naomi, zult u het ook aanvaarden van Ruth, de Moabitische, de vrouw van de gestorvene, om de naam van de gestorvene te doen voortbestaan over zijn erfdeel.", "6": "Toen zei die losser: Ik zal het voor mijzelf niet kunnen lossen, want anders verderf ik mijn eigen erfdeel; los u mijn lossingsrecht voor uzelf; want ik zal het niet kunnen lossen.", "7": "Nu was dit van oude tijden af een gewoonte in Israël, bij de lossing en bij de ruil, om de hele zaak te bevestigen: de man trok zijn schoen uit en gaf die aan zijn naaste; en dit was een getuigenis in Israël.", "8": "Zo zei de losser tegen Boaz: Koop het voor uzelf; en hij trok zijn schoen uit.", "9": "Toen zei Boaz tegen de oudsten en al het volk: U bent heden getuigen, dat ik alles gekocht heb wat van Elimelech geweest is, en alles wat van Chiljon en Machlon geweest is, van de hand van Naomi.", "10": "Daarbij koop ik ook Ruth, de Moabitische, de vrouw van Machlon, tot vrouw, om de naam van de gestorvene te doen voortbestaan over zijn erfdeel, opdat de naam van de gestorvene niet wordt uitgeroeid onder zijn broeders en uit de poort van zijn woonplaats; u bent heden getuigen.", "11": "En al het volk dat in de poort was, alsook de oudsten, zeiden: Wij zijn getuigen; de HEERE make deze vrouw, die in uw huis komt, als Rachel en als Lea, die beiden het huis van Israël gebouwd hebben; en handel kloek in Efratha, en maak *uw* naam vermaard in Bethlehem!", "12": "En uw huis zij als het huis van Perez (die Thamar aan Juda baarde), door het nageslacht dat de HEERE u geven zal uit deze jonge vrouw.", "13": "Zo nam Boaz Ruth, en zij werd hem tot vrouw, en hij ging tot haar in; en de HEERE gaf haar dat zij zwanger werd en een zoon baarde.", "14": "Toen zeiden de vrouwen tegen Naomi: Geloofd zij de HEERE, Die niet heeft nagelaten u heden een losser te geven; en zijn naam worde vermaard in Israël!", "15": "Die zal u zijn tot een verkwikker van de ziel, en om uw ouderdom te onderhouden; want uw schoondochter, die u liefheeft, heeft hem gebaard, en zij is u beter dan zeven zonen.", "16": "En Naomi nam dat kind en zette het op haar schoot, en werd zijn voedster.", "17": "En de buurvrouwen gaven hem een naam en zeiden: Aan Naomi is een zoon geboren; en zij noemden zijn naam Obed; deze is de vader van Isaï, Davids vader.", "18": "Dit nu zijn de geboorten van Perez: Perez verwekte Hezron;", "19": "En Hezron verwekte Ram; en Ram verwekte Amminadab;", "20": "En Amminadab verwekte Nahesson; en Nahesson verwekte Salma;", "21": "En Salmon verwekte Boaz, en Boaz verwekte Obed;", "22": "En Obed verwekte Isaï; en Isaï verwekte David."}, "SV": {"1": "En Boaz ging op in de poort, en zette zich aldaar en ziet, de losser, van welken Boaz gesproken had, ging voorbij; zo zeide hij: Wijk herwaarts, zet u hier, gij, zulk een! En hij week derwaarts, en zette zich.", "2": "En hij nam tien mannen van de oudsten der stad, en zeide: Zet u hier; en zij zetten zich.", "3": "Toen zeide hij tot dien losser: Het stuk lands, dat van onzen broeder Elimelech was, heeft Naomi, die uit der Moabieten land wedergekomen is, verkocht;", "4": "En ik heb gezegd: Ik zal het *voor* uw oor openbaren, zeggende: Aanvaard het in tegenwoordigheid der inwoners, en in tegenwoordigheid der oudsten mijns volks; zo gij het zult lossen, los het; en zo men het ook niet zou lossen, verklaar het mij, dat ik het wete; want er is niemand, behalve gij, die het losse, en ik na u. Toen zeide hij: Ik zal het lossen.", "5": "Maar Boaz zeide: Ten dage, als gij het land aanvaardt van de hand van Naomi, zo zult gij het ook aanvaarden van Ruth, de Moabietische, de huisvrouw des verstorvenen, om den naam des verstorvenen te verwekken over zijn erfdeel.", "6": "Toen zeide die losser: Ik zal het voor mij niet kunnen lossen, opdat ik mijn erfdeel niet misschien verderve; los gij mijn lossing voor u; want ik zal niet kunnen lossen.", "7": "Nu was dit van ouds *een* *gewoonheid* in Israël, bij de lossing en bij de verwisseling, om de ganse zaak te bevestigen, zo trok de man zijn schoen uit en gaf die aan zijn naaste; en dit was tot een getuigenis in Israël.", "8": "Zo zeide de losser tot Boaz: Aanvaard gij het voor u; en hij trok zijn schoen uit.", "9": "Toen zeide Boaz tot de oudsten en al het volk: Gijlieden zijt heden getuigen, dat ik aanvaard heb alles, wat van Elimelech geweest is, en alles, wat van Chiljon en Machlon geweest is, van de hand van Naomi.", "10": "Daartoe aanvaard ik mij ook Ruth, de Moabietische, de huisvrouw van Machlon, tot een vrouw, om den naam des verstorvenen over zijn erfdeel te verwekken, opdat de naam des verstorvenen niet worde uitgeroeid van zijn broederen, en van de poort zijner plaats; gijlieden zijt heden getuigen.", "11": "En al het volk, dat in de poort was, mitsgaders de oudsten zeiden: Wij zijn getuigen; de HEERE make deze vrouw, die in uw huis komt, als Rachel en als Lea, die beiden het huis van Israël gebouwd hebben; en handel kloekelijk in Efratha, en maak *uw* naam vermaard in Bethlehem!", "12": "En uw huis zij, als het huis van Perez ( die Thamar aan Juda baarde), van het zaad, dat de HEERE u geven zal uit deze jonge vrouw.", "13": "Alzo nam Boaz Ruth, en zij werd hem ter vrouwe, en hij ging tot haar in; en de HEERE gaf haar, dat zij zwanger werd en een zoon baarde.", "14": "Toen zeiden de vrouwen tot Naomi: Geloofd zij de HEERE, Die niet heeft nagelaten u heden een losser te geven; en zijn naam worde vermaard in Israël!", "15": "Die zal u zijn tot een verkwikker der ziel, en om uw ouderdom te onderhouden; want uw schoondochter, die u liefheeft, heeft hem gebaard, dewelke u beter is dan zeven zonen.", "16": "En Naomi nam dat kind, en zette het op haar schoot, en werd zijn voedster.", "17": "En de naburinnen gaven hem een naam, zeggende: Aan Naomi is een zoon geboren; en zij noemden zijn naam Obed; deze is de vader van Isaï, Davids vader.", "18": "Dit nu zijn de geboorten van Perez: Perez gewon Hezron;", "19": "En Hezron gewon Ram; en Ram gewon Amminadab;", "20": "En Amminadab gewon Nahesson; en Nahesson gewon Salma;", "21": "En Salmon gewon Boaz, en Boaz gewon Obed;", "22": "En Obed gewon Isaï; en Isaï gewon David."}, "KJV": {"1": "Then went Boaz up to the gate, and sat him down there: and, behold, the kinsman of whom Boaz spake came by; unto whom he said, Ho, such a one! turn aside, sit down here. And he turned aside, and sat down.", "2": "And he took ten men of the elders of the city, and said, Sit ye down here. And they sat down.", "3": "And he said unto the kinsman, Naomi, that is come again out of the country of Moab, selleth a parcel of land, which *was* our brother Elimelech's:", "4": "And I thought to advertise thee, saying, Buy *it* before the inhabitants, and before the elders of my people. If thou wilt redeem *it*, redeem *it*: but if thou wilt not redeem *it, then* tell me, that I may know: for *there is* none to redeem *it* beside thee; and I *am* after thee. And he said, I will redeem", "5": "Then said Boaz, What day thou buyest the field of the hand of Naomi, thou must buy *it* also of Ruth the Moabitess, the wife of the dead, to raise up the name of the dead upon his inheritance.", "6": "And the kinsman said, I cannot redeem *it* for myself, lest I mar mine own inheritance: redeem thou my right to thyself; for I cannot redeem", "7": "Now this *was the manner* in former time in Israel concerning redeeming and concerning changing, for to confirm all things; a man plucked off his shoe, and gave *it* to his neighbour: and this *was* a testimony in Israel.", "8": "Therefore the kinsman said unto Boaz, Buy *it* for thee. So he drew off his shoe.", "9": "And Boaz said unto the elders, and *unto* all the people, Ye *are* witnesses this day, that I have bought all that *was* Elimelech's, and all that *was* Chilion's and Mahlon's, of the hand of Naomi.", "10": "Moreover Ruth the Moabitess, the wife of Mahlon, have I purchased to be my wife, to raise up the name of the dead upon his inheritance, that the name of the dead be not cut off from among his brethren, and from the gate of his place: ye *are* witnesses this day.", "11": "And all the people that *were* in the gate, and the elders, said, *We are* witnesses. The LORD make the woman that is come into thine house like Rachel and like Leah, which two did build the house of Israel: and do thou worthily in Ephratah, and be famous in Bethlehem:", "12": "And let thy house be like the house of Pharez, whom Tamar bare unto Judah, of the seed which the LORD shall give thee of this young woman.", "13": "So Boaz took Ruth, and she was his wife: and when he went in unto her, the LORD gave her conception, and she bare a son.", "14": "And the women said unto Naomi, Blessed *be* the LORD, which hath not left thee this day without a kinsman, that his name may be famous in Israel.", "15": "And he shall be unto thee a restorer of *thy* life, and a nourisher of thine old age: for thy daughter in law, which loveth thee, which is better to thee than seven sons, hath born", "16": "And Naomi took the child, and laid it in her bosom, and became nurse", "17": "And the women her neighbours gave it a name, saying, There is a son born to Naomi; and they called his name Obed: he *is* the father of Jesse, the father of David.", "18": "Now these *are* the generations of Pharez: Pharez begat Hezron,", "19": "And Hezron begat Ram, and Ram begat Amminadab,", "20": "And Amminadab begat Nahshon, and Nahshon begat Salmon,", "21": "And Salmon begat Boaz, and Boaz begat Obed,", "22": "And Obed begat Jesse, and Jesse begat David."}}, "tsk": {"1": [{"kopje": "naar de poort", "refs": ["Deut 16:18", "Deut 17:5", "Deut 21:19", "Deut 25:7", "Job 29:7", "Job 31:21", "Amos 5:10-12", "Amos 5:15"]}, {"kopje": "de losser", "refs": ["Ruth 3:12"]}, {"kopje": "u daar", "refs": ["Jes 55:1", "Zach 2:6"]}], "2": [{"kopje": "de oudsten", "refs": ["Ex 18:21", "Ex 18:22", "Ex 21:8", "Deut 29:10", "Deut  waarde gaat ver boven de robijnen.", "Jes 8:3": "En ik was tot de profetes genaderd, die werd zwanger en baarde een zoon; en de HEERE zei tegen mij: Noem zijn naam Maher-Schalal, Chazbaz.", "Job 29:7": "Toen ik uitging naar de poort door de stad, toen ik mijn stoel op de straat liet klaarzetten.", "Gen 35:16": "En zij reisden verder van Bethel; en er was nog een kleine afstand om tot Efrath te komen; en Rachel baarde, en zij had het zwaar bij haar bevalling.", "Mal 2:14": "U zegt nu: Waarom? Omdat de HEERE een Getuige geweest is tussen u en de vrouw van uw jeugd, met wie u trouweloos handelt; terwijl zij toch uw metgezellin is, en de vrouw van uw verbond.", "Ruth 3:11": "En nu, mijn dochter, wees niet bang; alles wat u gezegd hebt, zal ik voor u doen; want de hele stad van mijn volk weet dat u een deugdzame vrouw bent.", "Ps 113:9": "Die de onvruchtbare vrouw doet wonen als moeder in een huisgezin, een blijde moeder van kinderen. Halleluja!", "Jer 32:25": "Evenwel hebt U tegen mij gezegd, Heere HEERE: koop voor uzelf dat veld voor geld, en laat het door getuigen bevestigen; terwijl de stad in de hand van de Chaldeeën gegeven is.", "1 Sam 1:8": "Toen zei Elkana, haar man: Hanna, waarom weent u, en waarom eet u niet, en waarom is uw hart bedroefd? Ben ik u niet beter dan tien zonen?", "Jes 48:19": "Ook zou uw nageslacht geweest zijn als het zand, en die uit uw ingewanden voortkomen als de steentjes ervan; wiens naam niet zou worden afgehouwen, noch verdelgd van voor Mijn aangezicht.", "Gen 47:12": "En Jozef verzorgde zijn vader en zijn broers en het hele huis van zijn vader met brood, tot aan de kleinste kinderen toe.", "Ps 112:5": "Teth. Goed gaat het die man, die zich ontfermt en uitleent; Jod. hij regelt zijn zaken met recht.", "Fil 4:8": "Verder, broeders, alles wat waar is, alles wat eerbaar is, alles wat rechtvaardig is, alles wat rein is, alles wat lieflijk is, alles wat goed klinkt, als er enige deugd is, en als er enige lof is, denk daaraan;", "Luk 20:28": "Meester, Mozes heeft ons geschreven: Als iemands broer sterft, die een vrouw heeft, en zonder kinderen sterft, dat zijn broer de vrouw moet nemen, en voor zijn broer nakomelingen moet verwekken.", "Spr 31:23": "Nun. Haar man is bekend in de poorten, als hij zit met de oudsten van het land.", "Ex 21:8": "Als zij niet bevalt in de ogen van haar heer, die haar tot vrouw beloofd heeft, zal hij haar laten vrijkopen; aan een vreemd volk mag hij haar niet verkopen, omdat hij trouweloos met haar gehandeld heeft.", "1 Sam 2:20": "En Eli zegende Elkana en zijn vrouw, en zei: De HEERE geeft u nageslacht uit deze vrouw, voor de bede die zij aan de HEERE heeft afgebeden. En zij gingen naar hun eigen plaats.", "Ruth 1:2": "De naam van deze man was Elimelech, en de naam van zijn vrouw Naomi, en de naam van zijn twee zonen Machlon en Chiljon, Efrathieten, uit Bethlehem-juda; en zij kwamen in de velden van Moab, en bleven daar.", "Ps 55:23": "Werp uw zorg op de HEERE, en Hij zal u onderhouden; Hij zal in eeuwigheid niet toelaten dat de rechtvaardige wankelt.", "Gen 24:27": "en hij zei: Geloofd zij de HEERE, de God van mijn heer Abraham, Die Zijn weldadigheid en trouw niet onthouden heeft aan mijn heer; wat mij betreft, de HEERE heeft mij op deze weg geleid, naar het huis van de broers van mijn heer.", "Job 31:21": "Als ik mijn hand tegen de wees bewogen heb, omdat ik in de poort mijn hulp zag;", "Jes 46:4": "En tot de ouderdom toe zal Ik Dezelfde zijn, ja, tot de grijsheid toe zal Ik u dragen; Ik heb het gedaan, en Ik zal u opnemen, en Ik zal dragen en redden.", "Hos 12:13": "Jakob vluchtte toch naar het veld van Syrië, en Israël diende om een vrouw, en hoedde de kudde om een vrouw.", "Ps 34:17": "Pe. Het aangezicht van de HEERE is tegen hen die kwaad doen, om hun gedachtenis van de aarde uit te roeien.", "Luk 3:33": "de zoon van Aminadab, de zoon van Aram, de zoon van Esrom, de zoon van Fares, de zoon van Juda,", "1 Kron 4:1": "De kinderen van Juda waren Perez, Hezron en Charmi, en Hur, en Sobal.", "1 Kon 21:8": "Zij schreef dan brieven in de naam van Achab, en verzegelde ze met zijn zegel; en zond de brieven aan de oudsten en aan de edelen, die in zijn stad waren, wonend bij Naboth.", "Hebr 13:4": "Het huwelijk is eerbaar onder allen, en het huwelijksbed onbevlekt; maar hoereerders en overspelers zal God oordelen.", "Hos 3:2": "En ik kocht haar voor mij voor vijftien zilverstukken, en een homer gerst, en een halve homer gerst.", "Gen 29:19": "Toen zei Laban: Het is beter dat ik haar aan u geef, dan dat ik haar aan een andere man geef; blijf bij mij.", "Spr 31:11": "Beth. Het hart van haar man vertrouwt op haar, zodat het hem aan geen goed zal ontbreken.", "Zach 13:2": "En het zal op die dag gebeuren, spreekt de HEERE van de heerscharen, dat Ik de namen van de afgoden uit het land zal uitroeien, zodat er niet meer aan gedacht wordt; en ook de profeten en de onreine geest zal Ik uit het land wegdoen.", "Ps 127:3": "Zie, de kinderen zijn een erfdeel van de HEERE; de vrucht van de buik is een beloning.", "Rom 12:17": "Vergeld niemand kwaad voor kwaad. Zorg voor wat eerlijk is voor alle mensen.", "Gen 30:22": "God dacht ook aan Rachel; en God verhoorde haar, en opende haar baarmoeder.", "Gen 24:60": "En zij zegenden Rebekka, en zeiden tegen haar: O, onze zuster! Word u tot duizenden miljoenen, en laat uw nageslacht de poort van hun haters bezitten!", "Amos 5:15": "Haat het kwade, en heb het goede lief, en zorg voor recht in de poort; misschien zal de HEERE, de God van de heerscharen, aan het overblijfsel van Jozef genadig zijn.", "Deut 25:6": "En het zal gebeuren, dat de eerstgeborene die zij baart, de naam van zijn overleden broer zal dragen; opdat zijn naam niet uitgewist wordt uit Israël.", "Gen 29:27": "Maak de week van deze vol; dan zullen wij u ook die geven, voor de dienst die u nog zeven andere jaren bij mij dienen zult.", "Jes 11:1": "Want er zal een Rijsje voortkomen uit de afgehouwen tronk van Isaï, en een Scheut uit zijn wortels zal vrucht voortbrengen.", "Matt 1:6": "en Isaï verwekte David, de koning; en David, de koning, verwekte Salomo bij haar die de vrouw van Uria geweest was;", "Deut 17:5": "Dan moet u die man of die vrouw, die dit boze stuk gedaan hebben, naar uw poorten brengen, die man of die vrouw, zeg ik, en u moet hen met stenen stenigen, totdat zij sterven.", "Deut 16:18": "Rechters en opzichters zult u voor uzelf aanstellen in al uw poorten die de HEERE, uw God, u geven zal, onder uw stammen; opdat zij het volk richten met een rechtvaardig oordeel.", "Micha 5:1": "En u, Bethlehem Efratha, bent u klein om te zijn onder de duizenden van Juda? Uit u zal Mij Iemand voortkomen, Die een Heerser zal zijn in Israël, en Wiens uitgangen zijn van oudsher, van de dagen van de eeuwigheid.", "Klaagl 5:14": "De oudsten houden op met zitten in de poort, de jongemannen met hun snarenspel.", "Spr 18:22": "Wie een vrouw gevonden heeft, heeft iets goeds gevonden, en hij heeft welgevallen verkregen van de HEERE.", "Spr 18:24": "Een man die vrienden heeft, moet zich vriendelijk gedragen; want er is een vriend die meer aankleeft dan een broeder.", "Ruth 3:12": "Nu dan, het is waar dat ik een losser ben; maar er is nog een losser, die nader is dan ik.", "Jes 8:2": "Toen nam ik mij betrouwbare getuigen, Uria, de priester, en Zacharia, de zoon van Jeberechja.", "Ex 18:22": "Laat hen dit volk te allen tijde oordelen; doch laat het zo zijn dat zij alle grote zaken bij u brengen, maar dat zij alle kleine zaken zelf oordelen; verlicht zo uzelf, en laat hen met u meedragen.", "Matt 1:4": "en Aram verwekte Aminadab, en Aminadab verwekte Nahasson, en Nahasson verwekte Salmon;", "Spr 19:14": "Huis en bezit zijn een erfdeel van de vaderen; maar een verstandige vrouw is van de HEERE.", "Ruth 2:5": "Daarna zei Boaz tegen zijn knecht, die over de maaiers gezet was: Van wie is deze jonge vrouw?", "Matt 1:5": "en Salmon verwekte Boaz bij Rachab, en Boaz verwekte Obed bij Ruth, en Obed verwekte Isaï;", "Gen 29:31": "Toen de HEERE nu zag dat Lea gehaat was, opende Hij haar baarmoeder; maar Rachel was onvruchtbaar.", "2 Tess 1:3": "Wij moeten God altijd danken over u, broeders, zoals het behoort, omdat uw geloof zeer meer wordt, en de liefde van elk van u allen jegens elkaar overvloedig wordt;", "Matt 1:3": "en Juda verwekte Fares en Zara bij Thamar; en Fares verwekte Esrom, en Esrom verwekte Aram;", "Luk 1:58": "En zij die daar rondom woonden, en haar verwanten, hoorden dat de Heere Zijn barmhartigheid overvloedig aan haar bewezen had, en zij verblijdden zich met haar.", "Gen 30:23": "En zij werd zwanger, en baarde een zoon; en zij zei: God heeft mijn smaad weggenomen!", "Deut 25:7": "Maar als die man geen zin heeft om de vrouw van zijn broer te nemen, dan zal de vrouw van zijn broer naar de poort gaan, naar de oudsten, en zeggen: Mijn zwager weigert voor zijn broer een naam te doen voortbestaan in Israël; hij wil de plicht van een zwager niet aan mij vervullen.", "Deut 29:10": "U staat heden allen voor het aangezicht van de HEERE, uw God: uw hoofden van uw stammen, uw oudsten, en uw opzichters, alle mannen van Israël;", "Gen 23:18": "Tot een bezitting, voor de ogen van de zonen van Heth, bij allen die de poort van zijn stad binnengingen.", "1 Kron 2:12": "En Boaz verwekte Obed, en Obed verwekte Isaï,", "Spr 13:10": "Door hoogmoed maakt men niet dan gekijf; maar bij hen die zich laten raden is wijsheid.", "Jes 55:1": "O, alle dorstigen, kom tot de wateren, en u die geen geld heeft, kom, koop en eet, ja kom, koop zonder geld en zonder prijs, wijn en melk!", "Luk 3:31": "de zoon van Meleas, de zoon van Mainan, de zoon van Mattatha, de zoon van Nathan, de zoon van David,", "Gen 20:17": "En Abraham bad tot God; en God genas Abimelech, en zijn vrouw, en zijn dienstmaagden, zodat zij weer kinderen kregen.", "Joz 7:9": "Als de Kanaänieten en alle inwoners van het land dit horen, zullen zij ons omsingelen, en onze naam van de aarde uitroeien; wat zult U dan doen voor Uw grote Naam?", "Luk 3:32": "de zoon van Isaï, de zoon van Obed, de zoon van Boaz, de zoon van Salmon, de zoon van Nahasson,", "1 Tess 5:18": "Dank God in alles; want dit is de wil van God in Christus Jezus over u.", "1 Kron 2:10": "Ram nu verwekte Amminadab, en Amminadab verwekte Nahesson, de vorst van de kinderen van Juda;", "Gen 33:5": "Daarna sloeg hij zijn ogen op en zag die vrouwen en die kinderen, en zei: Wie zijn dit bij u? En hij zei: De kinderen die God aan uw knecht genadig gegeven heeft.", "1 Kor 12:26": "En hetzij dat één lid lijdt, alle leden lijden mee; hetzij dat één lid geëerd wordt, alle leden verblijden zich mee.", "Gen 25:21": "En Izak bad de HEERE vurig voor zijn vrouw; want zij was onvruchtbaar; en de HEERE liet Zich door hem verbidden, zodat Rebekka, zijn vrouw, zwanger werd.", "Gen 29:18": "En Jakob had Rachel lief; en hij zei: Ik zal u zeven jaar dienen, voor Rachel, uw jongste dochter.", "Deut 21:19": "Dan zullen zijn vader en zijn moeder hem grijpen, en hem brengen naar de oudsten van zijn stad, en naar de poort van zijn plaats.", "Gen 38:8": "Toen zei Juda tegen Onan: Ga naar de vrouw van uw broer, en trouw met haar volgens het zwagerrecht, en verwek voor uw broer nageslacht.", "Ps 103:1": "Een psalm van David. Loof de HEERE, mijn ziel, en al wat binnen in mij is, Zijn heilige Naam.", "1 Kron 2:11": "En Nahesson verwekte Salma, en Salma verwekte Boaz,", "Deut 31:28": "Verzamel bij mij alle oudsten van uw stammen, en uw opzichters; opdat ik ten aanhoren van hen deze woorden spreek, en tegen hen de hemel en de aarde tot getuigen neem.", "Matt 2:6": "En u, Bethlehem, land van Juda! U bent geenszins de minste onder de vorsten van Juda; want uit u zal de Leidsman voortkomen, Die Mijn volk Israël weiden zal.", "Gen 20:18": "Want de HEERE had al de baarmoeders van het huis van Abimelech helemaal gesloten, vanwege Sara, Abrahams vrouw.", "Gen 35:19": "Zo stierf Rachel; en zij werd begraven aan de weg naar Efrath, dat is Bethlehem.", "1 Sam 1:27": "Ik bad om dit kind, en de HEERE heeft mij gegeven wat ik van Hem gebeden heb.", "Gen 12:2": "En Ik zal u tot een groot volk maken, en u zegenen, en uw naam groot maken; en wees een zegen!", "Num 1:7": "Van Juda, Nahesson, de zoon van Amminadab.", "Ps 103:2": "Loof de HEERE, mijn ziel, en vergeet geen van Zijn weldaden;", "Matt 22:24": "En zeiden: Meester! Mozes heeft gezegd: Als iemand sterft zonder kinderen te hebben, zal zijn broer met zijn vrouw trouwen en voor zijn broer nakomelingen verwekken.", "Gen 29:35": "En zij werd opnieuw zwanger, en baarde een zoon, en zei: Ditmaal zal ik de HEERE loven; daarom noemde zij zijn naam Juda. En zij hield op met baren.", "1 Sam 16:1": "Toen zei de HEERE tegen Samuël: Hoe lang draagt u leed om Saul, die Ik toch verworpen heb, dat hij geen koning meer zal zijn over Israël? Vul uw hoorn met olie, en ga op weg; Ik zal u zenden naar Isaï, de Bethlehemiet; want Ik heb Mij een koning uitgekozen onder zijn zonen.", "Zach 2:6": "Hoi, hoi, vlucht toch uit het Noorderland, spreekt de HEERE; want Ik heb u uitgebreid naar de vier winden van de hemel, spreekt de HEERE.", "2 Kor 8:21": "Als mensen die zorgen voor wat eerlijk is, niet alleen voor het oog van de Heere, maar ook voor het oog van de mensen.", "Gen 45:11": "En ik zal u daar onderhouden; want er zullen nog vijf jaren van de honger zijn, opdat u niet verarmt, u en uw huis, en alles wat u hebt!", "Deut 25:5": "Wanneer broeders samenwonen, en één van hen sterft zonder zoon, dan mag de vrouw van de gestorvene niet trouwen met een vreemde man van buiten; haar zwager zal tot haar ingaan, en haar tot vrouw nemen, en zo de plicht van een zwager aan haar vervullen.", "Ps 109:15": "Laat ze voortdurend voor de HEERE zijn; en Hij roeit hun gedachtenis uit van de aarde.", "1 Kron 2:9": "En de kinderen van Hezron, die hem geboren zijn, waren Jerahmeel, en Ram, en Chelubai.", "1 Kron 2:4": "Maar Thamar, zijn schoondochter, baarde hem Perez en Zerah. Al de zonen van Juda waren vijf.", "Hand 6:12": "En zij hitsten h ata-code=\"H3427\">inhabitants,</span> and before the <span class=\"wl wl-kjv\" data-code=\"H2205\">elders</span> of my <span class=\"wl wl-kjv\" data-code=\"H5971\">people.</span> If thou wilt <span class=\"wl wl-kjv\" data-code=\"H1350\">redeem</span> it, <span class=\"wl wl-kjv\" data-code=\"H1350\">redeem</span> it: but if thou wilt not <span class=\"wl wl-kjv\" data-code=\"H1350\">redeem</span> it, then <span class=\"wl wl-kjv\" data-code=\"H5046\">tell</span> me, that I may <span class=\"wl wl-kjv\" data-code=\"H3045\">know:</span> for there is none to <span class=\"wl wl-kjv\" data-code=\"H1350\">redeem</span> it <span class=\"wl wl-kjv\" data-code=\"H2108\">beside</span> thee; and I am <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> thee. And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> I will redeem", "5": "Then <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> <span class=\"wl wl-kjv\" data-code=\"H1162\">Boaz,</span> What <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> thou <span class=\"wl wl-kjv\" data-code=\"H7069\">buyest</span> the <span class=\"wl wl-kjv\" data-code=\"H7704\">field</span> of the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of <span class=\"wl wl-kjv\" data-code=\"H5281\">Naomi,</span> thou must <span class=\"wl wl-kjv\" data-code=\"H7069\">buy</span> it also of <span class=\"wl wl-kjv\" data-code=\"H7327\">Ruth</span> the <span class=\"wl wl-kjv\" data-code=\"H4125\">Moabitess,</span> the <span class=\"wl wl-kjv\" data-code=\"H802\">wife</span> of the <span class=\"wl wl-kjv\" data-code=\"H4191\">dead,</span> to raise <span class=\"wl wl-kjv\" data-code=\"H6965\">up</span> the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of the <span class=\"wl wl-kjv\" data-code=\"H4191\">dead</span> upon his inheritance.", "6": "And the <span class=\"wl wl-kjv\" data-code=\"H1350\">kinsman</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> I <span class=\"wl wl-kjv\" data-code=\"H3201\">cannot</span> <span class=\"wl wl-kjv\" data-code=\"H1350\">redeem</span> it for myself, lest I <span class=\"wl wl-kjv\" data-code=\"H7843\">mar</span> mine own <span class=\"wl wl-kjv\" data-code=\"H5159\">inheritance:</span> <span class=\"wl wl-kjv\" data-code=\"H1350\">redeem</span> thou my <span class=\"wl wl-kjv\" data-code=\"H1353\">right</span> to thyself; for I <span class=\"wl wl-kjv\" data-code=\"H3201\">cannot</span> redeem", "7": "Now this was the manner in former <span class=\"wl wl-kjv\" data-code=\"H6440\">time</span> in <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> concerning <span class=\"wl wl-kjv\" data-code=\"H1353\">redeeming</span> and concerning <span class=\"wl wl-kjv\" data-code=\"H8545\">changing,</span> for to <span class=\"wl wl-kjv\" data-code=\"H6965\">confirm</span> all <span class=\"wl wl-kjv\" data-code=\"H1697\">things;</span> a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> plucked <span class=\"wl wl-kjv\" data-code=\"H8025\">off</span> his <span class=\"wl wl-kjv\" data-code=\"H5275\">shoe,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> it to his <span class=\"wl wl-kjv\" data-code=\"H7453\">neighbour:</span> and this was a <span class=\"wl wl-kjv\" data-code=\"H8584\">testimony</span> in Israel.", "8": "Therefore the <span class=\"wl wl-kjv\" data-code=\"H1350\">kinsman</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H1162\">Boaz,</span> <span class=\"wl wl-kjv\" data-code=\"H7069\">Buy</span> it for thee. So he drew <span class=\"wl wl-kjv\" data-code=\"H8025\">off</span> his shoe.", "9": "And <span class=\"wl wl-kjv\" data-code=\"H1162\">Boaz</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto the <span class=\"wl wl-kjv\" data-code=\"H2205\">elders,</span> and unto all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> Ye are <span class=\"wl wl-kjv\" data-code=\"H5707\">witnesses</span> this <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> that I have <span class=\"wl wl-kjv\" data-code=\"H7069\">bought</span> all that was <span class=\"wl wl-kjv\" data-code=\"H458\">Elimelech's,</span> and all that was <span class=\"wl wl-kjv\" data-code=\"H3630\">Chilion's</span> and <span class=\"wl wl-kjv\" data-code=\"H4248\">Mahlon's,</span> of the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of Naomi.", "10": "Moreover <span class=\"wl wl-kjv\" data-code=\"H7327\">Ruth</span> the <span class=\"wl wl-kjv\" data-code=\"H4125\">Moabitess,</span> the <span class=\"wl wl-kjv\" data-code=\"H802\">wife</span> of <span class=\"wl wl-kjv\" data-code=\"H4248\">Mahlon,</span> have I <span class=\"wl wl-kjv\" data-code=\"H7069\">purchased</span> to be my <span class=\"wl wl-kjv\" data-code=\"H802\">wife,</span> to raise <span class=\"wl wl-kjv\" data-code=\"H6965\">up</span> the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of the <span class=\"wl wl-kjv\" data-code=\"H4191\">dead</span> upon his <span class=\"wl wl-kjv\" data-code=\"H5159\">inheritance,</span> that the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of the <span class=\"wl wl-kjv\" data-code=\"H4191\">dead</span> be not cut <span class=\"wl wl-kjv\" data-code=\"H3772\">off</span> from <span class=\"wl wl-kjv\" data-code=\"H5973\">among</span> his <span class=\"wl wl-kjv\" data-code=\"H251\">brethren,</span> and from the <span class=\"wl wl-kjv\" data-code=\"H8179\">gate</span> of his <span class=\"wl wl-kjv\" data-code=\"H4725\">place:</span> ye are <span class=\"wl wl-kjv\" data-code=\"H5707\">witnesses</span> this day.", "11": "And all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> that were in the <span class=\"wl wl-kjv\" data-code=\"H8179\">gate,</span> and the <span class=\"wl wl-kjv\" data-code=\"H2205\">elders,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> We are <span class=\"wl wl-kjv\" data-code=\"H5707\">witnesses.</span> The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">make</span> the <span class=\"wl wl-kjv\" data-code=\"H802\">woman</span> that is <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> into thine <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> like <span class=\"wl wl-kjv\" data-code=\"H7354\">Rachel</span> and like <span class=\"wl wl-kjv\" data-code=\"H3812\">Leah,</span> which <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> did <span class=\"wl wl-kjv\" data-code=\"H1129\">build</span> the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel:</span> and <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> thou <span class=\"wl wl-kjv\" data-code=\"H2428\">worthily</span> in <span class=\"wl wl-kjv\" data-code=\"H672\">Ephratah,</span> and be <span class=\"wl wl-kjv\" data-code=\"H7121\">famous</span> in Bethlehem:", "12": "And let thy <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> be like the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H6557\">Pharez,</span> whom <span class=\"wl wl-kjv\" data-code=\"H8559\">Tamar</span> <span class=\"wl wl-kjv\" data-code=\"H3205\">bare</span> unto <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> of the <span class=\"wl wl-kjv\" data-code=\"H2233\">seed</span> which the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> thee of this young woman.", "13": "So <span class=\"wl wl-kjv\" data-code=\"H1162\">Boaz</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> <span class=\"wl wl-kjv\" data-code=\"H7327\">Ruth,</span> and she was his <span class=\"wl wl-kjv\" data-code=\"H802\">wife:</span> and when he went <span class=\"wl wl-kjv\" data-code=\"H935\">in</span> unto her, the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> her <span class=\"wl wl-kjv\" data-code=\"H2032\">conception,</span> and she <span class=\"wl wl-kjv\" data-code=\"H3205\">bare</span> a son.", "14": "And the <span class=\"wl wl-kjv\" data-code=\"H802\">women</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H5281\">Naomi,</span> <span class=\"wl wl-kjv\" data-code=\"H1288\">Blessed</span> be the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> which hath not <span class=\"wl wl-kjv\" data-code=\"H7673\">left</span> thee this <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> without a <span class=\"wl wl-kjv\" data-code=\"H1350\">kinsman,</span> that his <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> may be <span class=\"wl wl-kjv\" data-code=\"H7121\">famous</span> in Israel.", "15": "And he shall be unto thee a <span class=\"wl wl-kjv\" data-code=\"H7725\">restorer</span> of thy <span class=\"wl wl-kjv\" data-code=\"H5315\">life,</span> and a <span class=\"wl wl-kjv\" data-code=\"H3557\">nourisher</span> of thine old <span class=\"wl wl-kjv\" data-code=\"H7872\">age:</span> for thy daughter in <span class=\"wl wl-kjv\" data-code=\"H3618\">law,</span> which <span class=\"wl wl-kjv\" data-code=\"H157\">loveth</span> thee, which is <span class=\"wl wl-kjv\" data-code=\"H2896\">better</span> to thee than <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">sons,</span> hath born", "16": "And <span class=\"wl wl-kjv\" data-code=\"H5281\">Naomi</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> the <span class=\"wl wl-kjv\" data-code=\"H3206\">child,</span> and <span class=\"wl wl-kjv\" data-code=\"H7896\">laid</span> it in her <span class=\"wl wl-kjv\" data-code=\"H2436\">bosom,</span> and became nurse", "17": "And the women her <span class=\"wl wl-kjv\" data-code=\"H7934\">neighbours</span> <span class=\"wl wl-kjv\" data-code=\"H7121\">gave</span> it a <span class=\"wl wl-kjv\" data-code=\"H8034\">name,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> There is a <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> <span class=\"wl wl-kjv\" data-code=\"H3205\">born</span> to <span class=\"wl wl-kjv\" data-code=\"H5281\">Naomi;</span> and they <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> his <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> <span class=\"wl wl-kjv\" data-code=\"H5744\">Obed:</span> he is the <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> of <span class=\"wl wl-kjv\" data-code=\"H3448\">Jesse,</span> the <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> of David.", "18": "Now these are the <span class=\"wl wl-kjv\" data-code=\"H8435\">generations</span> of <span class=\"wl wl-kjv\" data-code=\"H6557\">Pharez:</span> <span class=\"wl wl-kjv\" data-code=\"H6557\">Pharez</span> <span class=\"wl wl-kjv\" data-code=\"H3205\">begat</span> Hezron,", "19": "And <span class=\"wl wl-kjv\" data-code=\"H2696\">Hezron</span> <span class=\"wl wl-kjv\" data-code=\"H3205\">begat</span> <span class=\"wl wl-kjv\" data-code=\"H7410\">Ram,</span> and <span class=\"wl wl-kjv\" data-code=\"H7410\">Ram</span> <span class=\"wl wl-kjv\" data-code=\"H3205\">begat</span> Amminadab,", "20": "And <span class=\"wl wl-kjv\" data-code=\"H5992\">Amminadab</span> <span class=\"wl wl-kjv\" data-code=\"H3205\">begat</span> <span class=\"wl wl-kjv\" data-code=\"H5177\">Nahshon,</span> and <span class=\"wl wl-kjv\" data-code=\"H5177\">Nahshon</span> <span class=\"wl wl-kjv\" data-code=\"H3205\">begat</span> Salmon,", "21": "And <span class=\"wl wl-kjv\" data-code=\"H8012\">Salmon</span> <span class=\"wl wl-kjv\" data-code=\"H3205\">begat</span> <span class=\"wl wl-kjv\" data-code=\"H1162\">Boaz,</span> and <span class=\"wl wl-kjv\" data-code=\"H1162\">Boaz</span> <span class=\"wl wl-kjv\" data-code=\"H3205\">begat</span> Obed,", "22": "And <span class=\"wl wl-kjv\" data-code=\"H5744\">Obed</span> <span class=\"wl wl-kjv\" data-code=\"H3205\">begat</span> <span class=\"wl wl-kjv\" data-code=\"H3448\">Jesse,</span> and <span class=\"wl wl-kjv\" data-code=\"H3448\">Jesse</span> <span class=\"wl wl-kjv\" data-code=\"H3205\">begat</span> David."}};
const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"
const ZELF = D.meta.zelf_abbr;      // afkorting binnen dit hoofdstuk, bv. "Joh 3"
const BASIS_URL = D.meta.basis_url;
const PARALLEL_VOLGORDE = ['Berea', 'SV', 'KJV'];
let vertaling = 'Berea';
let openVers = null;

const bijbel = document.getElementById('bijbel');
const popup = document.getElementById('popup');
const toast = document.getElementById('toast');
const nummers = Object.keys(D.vertalingen.Berea);

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden"><select id="boekkies">${boekOpties}</select> ` +
    `<select id="hfdkies">${hfdOpties}</select></span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.Berea[n] || '—');
}

/* ---------- vertaling-keuze (dropdown) + studie-dropdown ---------- */
(function bouwVertaalkies() {
  const sel = document.getElementById('vertaalkies');
  sel.innerHTML = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  sel.onchange = e => { vertaling = e.target.value; bouwRijen(); };
})();
document.getElementById('studiekies').onchange = e => { if (e.target.value) location.href = e.target.value; };

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.Berea[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (Berea)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function paneelInhoud(n, tab) {
  if (tab === 'grondwoorden') {
    const heeftB = D.koppeling && D.koppeling[n];
    const heeftK = D.koppeling_kjv && D.koppeling_kjv[n];
    if (!heeftB && !heeftK) return '<em>Nog geen woordkoppeling voor dit vers.</em>';
    let h = '';
    if (heeftB) h += `<div class="tsk-kop">Berea</div>` +
      `<div class="gw-tekst" style="font-family:Georgia,serif;line-height:1.8">${D.koppeling[n]}</div>` +
      `<div class="gw-detail" style="margin-top:.5rem"></div>`;
    if (heeftK) h += `<div class="tsk-kop" style="margin-top:.9rem">KJV</div>` +
      `<div class="gw-tekst" style="font-family:Georgia,serif;line-height:1.8">${D.koppeling_kjv[n]}</div>` +
      `<div class="gw-detail" style="margin-top:.5rem"></div>`;
    return h + '<div class="bronregel">Klik op een onderstreept woord voor de vindplaatsen.</div>';
  }
  if (tab === 'vertalingen') {
    return PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
  }
  if (tab === 'verwijzingen') {
    const berea = D.tsk[n], engels = D.tsk_kjv[n];
    if ((!berea || !berea.length) && (!engels || !engels.length)) return '<em>Geen verwijzingen bij dit vers.</em>';
    let h = '';
    if (berea && berea.length) {
      h += '<div class="tsk-kop">Treasury of Scripture Knowledge | Berea</div>';
      h += berea.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r}">${r}</a>`).join('') + '</div>').join('');
    }
    if (engels && engels.length) {
      h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.subs && it.subs.length ? `<ul class="ond-subs">${it.subs.map(s=>`<li>${s}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.tsk[n] && D.tsk[n].length), heeftO = !!D.onderwerpen[n];
  const heeftG = !!((D.koppeling && D.koppeling[n]) || (D.koppeling_kjv && D.koppeling_kjv[n]));
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : (heeftG ? 'grondwoorden' : 'vertalingen'));
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'grondwoorden' ? 'actief' : ''} ${heeftG ? '' : 'leeg'}" data-tab="grondwoorden" data-n="${n}">Grondwoorden</div>
    <div class="ntab" data-tab="vertalingen" data-n="${n}">Vertalingen</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.Berea[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · Berea</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}
</script>
</body>
