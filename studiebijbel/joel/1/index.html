", "Jer 9:10": "Ik zal een geween en een klaagzang aanheffen over de bergen, en een klaaglied over de herdershutten van de woestijn; want zij zijn afgebrand, zodat er niemand doorgaat, en men hoort er geen stem van vee; van de vogels van de hemel tot de dieren toe zijn zij weggevlucht, weggegaan!", "Jer 25:27": "U zult dan tot hen zeggen: Zo zegt de HEERE van de heerscharen, de God van Israël: Drink, en word dronken, en spuw, en val neer, zodat u niet weer opstaat, vanwege het zwaard, dat Ik onder u zal zenden.", "2 Kron 20:4-13": "En Juda kwam bijeen om hulp te zoeken bij de HEERE; ook kwamen zij uit alle steden van Juda om de HEERE te zoeken. En Josafat stond in de samenkomst van Juda en Jeruzalem, in het huis van de HEERE, voor het nieuwe voorhof. En hij zei: HEERE, God van onze vaderen, bent U niet de God in de hemel? Ja, U heerst over alle koninkrijken van de heidenvolken; en in Uw hand is kracht en sterkte, zodat niemand tegen U stand kan houden.", "Ps 126:4": "O HEERE, keer onze gevangenschap, zoals waterstromen in het zuiden.", "Zach 12:10": "Doch over het huis van David, en over de inwoners van Jeruzalem, zal Ik uitstorten de Geest van de genade en van de gebeden; en zij zullen Mij aanschouwen, Die zij doorstoken hebben, en zij zullen over Hem rouwklagen, zoals met de rouwklacht over een enige zoon; en zij zullen over Hem bitter kermen, zoals men bitter kermt over een eerstgeborene.", "2 Kon 19:16": "HEERE, neig Uw oor en hoor, doe Uw ogen open, HEERE, en zie, en hoor de woorden van Sanherib, die deze man gezonden heeft om de levende God te honen.", "Deut 29:19-21": "En het gebeurt, als hij de woorden van deze vloek hoort, dat hij zichzelf zegent in zijn hart, en zegt: Ik zal vrede hebben, ook al zal ik naar mijn eigen hart wandelen, om de dronkenschap toe te voegen aan de dorst. De HEERE zal hem niet willen vergeven; maar dan zal de toorn van de HEERE en Zijn ijver roken over die man, en de hele vloek, die in dit boek geschreven is, zal op hem liggen; en de HEERE zal zijn naam van onder de hemel uitwissen. En de HEERE zal hem ten kwade afscheiden van al de stammen van Israël, naar alle vloeken van het verbond, dat in het boek van deze wet geschreven is.", "Ezech 3:8-10": "Zie, Ik heb uw gezicht stijf gemaakt tegen hun gezichten, en uw voorhoofd stijf tegen hun voorhoofd. Uw voorhoofd heb Ik gemaakt als een diamant, harder dan een rots; vrees hen niet, en wees niet ontzet voor hun gezichten, omdat zij een opstandig huis zijn. Verder zei Hij tot mij: Mensenkind, vat al Mijn woorden, die Ik tot u spreken zal, in uw hart, en hoor ze met uw oren.", "Amos 5:6": "Zoek de HEERE, en leef; anders doorbreekt Hij in het huis van Jozef als een vuur, dat verteert, zodat er niemand is die het blust in Beth-el;", "Richt 20:18": "En de kinderen van Israël maakten zich op, en trokken op naar het huis van God, en vroegen God om raad, en zeiden: Wie zal onder ons als eerste optrekken ten strijde tegen de kinderen van Benjamin? En de HEERE zei: Juda als eerste.", "Luk 11:11-13": "En welke vader onder u zal, als de zoon hem om brood vraagt, hem een steen geven? Of ook, als hij om een vis vraagt, zal hij hem in plaats van een vis een slang geven? Of ook, als hij om een ei zou vragen, zal hij hem een schorpioen geven? Als u dan, die slecht bent, weet uw kinderen goede gaven te geven, hoeveel te meer zal de hemelse Vader de Heilige Geest geven aan hen die Hem daarom bidden?", "Ezech 18:21-23": "Maar wanneer de goddeloze zich bekeert van al zijn zonden, die hij gedaan heeft, en al Mijn inzettingen onderhoudt, en recht en gerechtigheid doet, hij zal zeker leven, hij zal niet sterven. Al zijn overtredingen, die hij gedaan heeft, zullen hem niet aangerekend worden; door zijn gerechtigheid, die hij gedaan heeft, zal hij leven. Zou Ik enigszins lust hebben aan de dood van de goddeloze, spreekt de Heere HEERE; is het niet zo, dat als hij zich bekeert van zijn wegen, hij zal leven?", "Ps 143:1-12": "Een psalm van David. O HEERE, hoor mijn gebed, neig de oren tot mijn smekingen; verhoor mij naar Uw waarheid, naar Uw gerechtigheid. En ga niet in het gericht met Uw knecht, want niemand die leeft, zal voor Uw aangezicht rechtvaardig zijn. Want de vijand vervolgt mijn ziel, hij vertreedt mijn leven ter aarde; hij legt mij in duisternissen, als hen die al lang dood zijn.", "Joz 1:8": "Laat het boek van deze wet niet wijken van uw mond, maar overleg het dag en nacht, opdat u waarneemt te doen naar alles wat daarin geschreven is; want dan zult u uw wegen voorspoedig maken, en dan zult u verstandig handelen.", "Ps 147:9": "Die het vee zijn voer geeft; aan de jonge raven, als zij roepen.", "Jak 5:13-16": "Is iemand onder u in lijden? Laat hij bidden. Is iemand goedsmoeds? Laat hij psalmen zingen. Is iemand ziek onder u? Laat hij de oudsten van de gemeente bij zich roepen, en laten zij over hem bidden, hem met olie zalvend in de Naam van de Heere. En het gebed van het geloof zal de zieke behouden, en de Heere zal hem oprichten; en als hij zonden gedaan heeft, zal het hem vergeven worden.", "Ezech 33:1-9": "En het woord van de HEERE kwam tot mij: Mensenkind! Spreek tot de kinderen van uw volk, en zeg tegen hen: Wanneer Ik het zwaard over een land breng, en het volk van het land een man uit hun gebied neemt en hem voor zichzelf tot een wachter stelt; En hij het zwaard over het land ziet komen, en op de bazuin blaast en het volk waarschuwt;", "Luk 10:13": "Wee u, Chorazin, wee u, Bethsaïda, want als in Tyrus en Sidon de krachten waren gebeurd die in u gebeurd zijn, zouden zij zich allang, in zak en as zittend, bekeerd hebben.", "Matt 24:21": "Want dan zal er grote verdrukking zijn, wat voor verdrukking er niet geweest is vanaf het begin van de wereld tot nu toe, en er ook nooit meer zal zijn.", "Ps 103:13": "Zoals een vader zich ontfermt over zijn kinderen, ontfermt de HEERE Zich over hen die Hem vrezen.", "Ps 25:2": "Beth. Mijn God! op U vertrouw ik; laat mij niet beschaamd worden; laat mijn vijanden niet van vreugde opspringen over mij.", "Deut 6:6-9": "En deze woorden, die ik u heden gebied, zullen in uw hart zijn. En u zult ze uw kinderen inscherpen, en daarover spreken, als u in uw huis zit, en als u onderweg bent, en als u neerligt, en als u opstaat. Ook zult u ze als een teken op uw hand binden, en zij zullen u tot voorhoofdsbanden zijn tussen uw ogen.", "Ezech 4:16": "Daarna zei Hij tegen mij: Mensenkind, zie, Ik breek de staf van het brood in Jeruzalem, en zij zullen het brood met gewicht en met kommer eten, en het water met een bepaalde maat en met verbaasdheid drinken;", "Ezech 3:17-21": "Mensenkind! Ik heb u tot een wachter gesteld over het huis Israëls; zo zult u het woord uit Mijn mond horen, en hen namens Mij waarschuwen. Als Ik tot de goddeloze zeg: U zult zeker sterven, en u waarschuwt hem niet, en spreekt niet, om de goddeloze van zijn goddeloze weg te waarschuwen, opdat u hem in het leven behoudt; die goddeloze zal in zijn ongerechtigheid sterven, maar zijn bloed zal Ik van uw hand eisen. Doch als u de goddeloze waarschuwt, en hij zich van zijn goddeloosheid en van zijn goddeloze weg niet bekeert, zal hij in zijn ongerechtigheid sterven; maar u hebt uw ziel bevrijd.", "Ps 119:173": "Laat Uw hand mij te hulp komen, want ik heb Uw bevelen gekozen.", "Matt 4:17": "Van toen af aan begon Jezus te prediken en te zeggen: Bekeer u; want het Koninkrijk der hemelen is nabijgekomen.", "Hoogl 7:7-9": "Deze uw lengte is te vergelijken bij een palmboom, en uw borsten bij druiventrossen. Ik zei: Ik zal in de palmboom klimmen, ik zal zijn takken grijpen; zo zullen dan uw borsten zijn als druiventrossen aan de wijnstok, en de geur van uw neus als appels. En uw gehemelte als goede wijn, die vlot naar mijn Beminde toe gaat, en de lippen van de slapende doet spreken.", "Job 39:3": "Wie bereidt de raaf haar kost, als haar jongen tot God schreeuwen, als zij dwalen, omdat er geen eten is?", "Hand 17:30": "God dan, Die de tijden van de onwetendheid door de vingers gezien heeft, verkondigt nu aan alle mensen, overal, dat zij zich bekeren.", "Jer 6:27": "Ik heb u onder Mijn volk gesteld, tot een wachttoren, tot een vesting; opdat u hun weg zou weten en beproeven.", "Lev 26:40-42": "Dan zullen zij hun ongerechtigheid belijden, en de ongerechtigheid van hun vaderen met hun overtredingen, waarmee zij tegen Mij overtreden hebben, en ook dat zij tegen Mij in gewandeld hebben. Dat Ik ook tegen hen in gewandeld heb, en hen in het land van hun vijanden gebracht heb. Als dan hun onbesneden hart gebogen wordt, en zij dan de straf voor hun ongerechtigheid aanvaarden; Dan zal Ik denken aan Mijn verbond met Jakob, en ook aan Mijn verbond met Izak, en ook aan Mijn verbond met Abraham zal Ik denken, en aan het land zal Ik denken;", "1 Tim 6:10-14": "Want de geldzucht is een wortel van alle kwaad; sommigen hebben daarnaar verlangd en zijn van het geloof afgedwaald, en hebben zichzelf met veel smarten doorstoken. Maar u, mens van God, vlucht voor deze dingen; en jaag naar gerechtigheid, godsvrucht, geloof, liefde, volharding, zachtmoedigheid. Strijd de goede strijd van het geloof, grijp naar het eeuwige leven, waartoe u ook geroepen bent en waarvoor u de goede belijdenis afgelegd hebt voor veel getuigen.", "Klaagl 2:18": "Tsade. Hun hart schreeuwde tot de Heere: O muur van de dochter van Sion, laat dag en nacht tranen afvlieten als een beek; geef uzelf geen rust, uw oogappel houdt niet op!", "Jes 58:3-7": "En zeggen: Waarom vasten wij, en ziet U het niet aan, waarom kwellen wij onze ziel, en weet U het niet? Zie, op de dag waarop u vast, vindt u uw genoegen, en u eist streng al uw arbeid. Zie, tot twist en gekijf vast u, en om goddeloos met de vuist te slaan; vast niet zoals vandaag, om uw stem te doen horen in de hoogte. Zou dit zulk een vasten zijn dat Ik verkiezen zou, dat de mens zijn ziel een dag kwelt, dat hij zijn hoofd kromt zoals een bieze, en een zak en as onder zich spreidt? Zou u dat een vasten noemen, en een dag die de HEERE aangenaam is?", "Kol 4:17": "En zeg tegen Archippus: Let op de bediening die u hebt aangenomen in de Heere, dat u die vervult.", "Jes 28:7": "Maar ook dezen dwalen door de wijn, en zij dolen door de sterke drank; de priester en de profeet dwalen door de sterke drank; zij zijn verslonden door de wijn, zij dolen door sterke drank; zij dwalen in het zien van visioenen; zij waggelen in het rechtspreken.", "Klaagl 1:16": "Ain. Om deze dingen ween ik; mijn oog, mijn oog vliet af van water, omdat de trooster, die mijn ziel zou verkwikken, ver van mij is; mijn kinderen zijn verwoest, omdat de vijand de overhand heeft.", "Num 13:23": "Daarna kwamen zij tot het dal Eskol, en sneden daar een rank af met één tros wijndruiven, die zij met zijn tweeën droegen, op een draagstok; ook van de granaatappels en van de vijgen.", "Ps 96:8": "Geeft de HEERE de eer van Zijn Naam; brengt een offer, en komt in Zijn voorhoven.", "Jes 2:3": "En veel volken zullen heengaan en zeggen: Kom, laat ons opgaan tot de berg van de HEERE, tot het huis van de God van Jakob, opdat Hij ons leert van Zijn wegen, en dat wij wandelen in Zijn paden; want uit Sion zal de wet uitgaan, en het woord van de HEERE uit Jeruzalem.", "Hand 2:40": "En met veel meer andere woorden getuigde hij, en vermaande hen, en zei: Laat u behouden van dit verkeerde geslacht!", "Ps 22:2-22": "Mijn God, mijn God! Waarom hebt U mij verlaten, ver zijnde van mijn verlossing, van de woorden van mijn brullen? Mijn God! Ik roep overdag, maar U antwoordt niet; en 's nachts, en ik heb geen stilte. Doch U bent heilig, wonende onder de lofzangen van Israël.", "Ps 56:2-14": "Wees mij genadig, o God! Want de mens zoekt mij op te slokken; de hele dag dringt de bestrijder mij. Mijn verspieders zoeken mij de hele dag op te slokken; want ik heb veel bestrijders, o Allerhoogste! Ten dage dat ik zal vrezen, zal ik op U vertrouwen.", "Jes 5:6": "En Ik zal hem tot een woestenij maken; hij zal niet gesnoeid, noch omgespit worden, maar distels en doornen zullen erin opkomen; en Ik zal de wolken gebieden dat zij er geen regen op laten regenen.", "Amos 7:4": "Verder liet de Heere HEERE mij dit zien: zie, de Heere HEERE riep, dat Hij wilde twisten met vuur; en het verteerde een grote afgrond, ook verteerde het een stuk land.", "Ps 43:1-5": "Doe mij recht, o God! En voer Zelf mijn rechtszaak tegen een liefdeloos volk; bevrijd mij van de man van het bedrog en van het onrecht. Want U bent de God van mijn sterkte; waarom verstoot U mij dan? Waarom ga ik steeds in het zwart, vanwege de onderdrukking van de vijand? Zend Uw licht en Uw waarheid, dat die mij leiden; dat zij mij brengen tot de berg van Uw heiligheid, en tot Uw woningen;", "Hos 4:11": "Hoererij, en wijn, en jonge wijn neemt het hart weg.", "Spr 21:17": "Wie blijdschap liefheeft, die zal gebrek lijden; wie wijn en olie liefheeft, zal niet rijk worden.", "Ef 5:14": "Daarom zegt Hij: Ontwaak, u die slaapt, en sta op uit de doden; en Christus zal over u lichten.", "Jer 14:2-6": "Juda treurt en haar poorten zijn verzwakt; zij zijn in het zwart gekleed tot op de grond, en Jeruzalems geschrei klimt op. En hun voortreffelijken zenden hun kleinen naar water; zij komen bij de putten, zij vinden geen water, zij komen met hun vaten leeg terug; zij zijn beschaamd, ja, worden schaamrood, en bedekken hun hoofd. Omdat het aardrijk gescheurd is, doordat er geen regen op de aarde is; de akkerlieden zijn beschaamd, zij bedekken hun hoofd.", "1 Kor 6:9": "Of weet u niet, dat de onrechtvaardigen het Koninkrijk van God niet zullen beërven?", "Ezech 12:22-28": "Mensenkind, wat is dit voor een spreekwoord dat u hebt in het land Israël, namelijk: de dagen worden verlengd, en elk visioen vervalt? Daarom, zeg tegen hen: Zo zegt de Heere HEERE: Ik zal dit spreekwoord doen ophouden, zodat zij het niet meer als spreekwoord zullen gebruiken in Israël. Maar spreek tot hen: De dagen zijn nabijgekomen, en het woord van elk visioen. Want er zal geen leeg visioen meer zijn, noch vleiende waarzegging, in het midden van het huis van Israël.", "Jer 31:9": "Zij zullen komen met geween, en met smekingen zal Ik hen leiden; Ik zal hen leiden aan de waterbeken, op een rechte weg, waarop zij zich niet zullen stoten; want Ik ben Israël tot een Vader, en Efraïm is Mijn eerstgeborene.", "Jer 24:7": "En Ik zal hun een hart geven om Mij te kennen, dat Ik de HEERE ben; en zij zullen Mij tot een volk zijn, en Ik zal hun tot een God zijn; want zij zullen zich tot Mij bekeren met hun hele hart.", "Lev 26:19-29": "Want Ik zal de hoogmoed van uw kracht verbreken, en zal uw hemel als ijzer maken, en uw aarde als koper. En uw macht zal voor niets verbruikt worden; en uw land zal zijn opbrengst niet geven, en het geboomte van het land zal zijn vrucht niet geven. En als u tegen Mij in blijft ingaan, en Mij niet wilt horen, zal Ik over u, naar uw zonden, zevenvoudig slagen toedoen.", "Deut 28:38-42": "U zult veel zaad naar de akker uitbrengen, maar u zult weinig inzamelen; want de sprinkhaan zal het opeten. Wijngaarden zult u planten en bewerken, maar u zult geen wijn drinken, noch iets vergaren; want de worm zal het opeten. Olijfbomen zult u hebben binnen al uw grondgebied, maar u zult u met olie niet zalven; want uw olijfboom zal zijn vrucht afwerpen.", "Hand 7:60": "En terwijl hij op de knieën viel, riep hij met luide stem: Heere, reken hun deze zonde niet toe! En toen hij dat gezegd had, ontsliep hij.", "Amos 5:16": "Daarom, zo zegt de HEERE, de God van de heerscharen, de Heere: Op alle straten zal rouwklacht zijn, en in alle wijken zullen zij zeggen: Och! Och! en zij zullen de landbouwer roepen om te treuren, en rouwklacht zal zijn bij hen die verstand van klagen hebben.", "Jak 5:1": "Welaan nu, u rijken, huil en jammer over uw ellenden, die over u komen.", "Amos 4:6-9": "Daarom heb Ik u ook reinheid van de tanden gegeven in al uw steden, en gebrek aan brood in al uw plaatsen; toch hebt u zich niet bekeerd tot Mij, spreekt de HEERE. Daarbij heb Ik ook de regen van u geweerd, toen er nog drie maanden waren tot de oogst, en heb doen regenen over de ene stad, maar over de andere stad niet doen regenen; het ene stuk land werd beregend, maar het andere stuk land, waar het niet op regende, verdorde. En twee, drie steden trokken rond naar één stad, opdat zij water zouden kunnen drinken, maar werden niet verzadigd; toch hebt u zich niet bekeerd tot Mij, spreekt de HEERE.", "Ps 35:19": "Laat hen zich niet verblijden over mij, die mij om valse oorzaken vijand zijn; laat hen ook niet wenken met de ogen, die mij zonder oorzaak haten.", "Jer 12:11": "Men heeft het gesteld tot een woestenij, verwoest zijnde treurt het tot Mij; het hele land is verwoest, omdat er niemand is die het ter harte neemt.", "Jes 22:12": "En op die dag zal de Heere, de HEERE van de heerscharen, roepen tot geween, en tot rouwklacht, en tot kaalheid, en tot omgording met de zak.", "Ezech 34:2-31": "Mensenkind! Profeteer tegen de herders van Israël; profeteer en zeg tot hen, tot de herders: Zo zegt de Heere HEERE: Wee de herders van Israël, die zichzelf weiden! Zullen niet de herders de schapen weiden? U eet het vette, en bekleedt u met de wol, u slacht het gemeste, maar de schapen weidt u niet. De zwakke sterkt u niet, en het zieke heelt u niet, en het gebrokene verbindt u niet, en het weggedrevene brengt u niet terug, en het verlorene zoekt u niet; maar u heerst over hen met strengheid en met hardheid.", "Jer 18:8": "Maar als datzelfde volk, over wie Ik dat gesproken heb, zich van zijn boosheid bekeert, dan zal Ik berouw hebben over het kwaad dat Ik dacht hen aan te doen.", "Ps 34:12": "Lamed. Komt, kinderen! Hoort naar mij! Ik zal u de vreze van de HEERE leren.", "Ex 20:5": "U zult zich daarvoor niet buigen, en ze niet dienen; want Ik, de HEERE, uw God, ben een ijverig God, Die de misdaad van de vaders bezoek aan de kinderen, aan het derde en aan het vierde geslacht van hen die Mij haten;", "Joël 2:16": "Verzamelt het volk, heiligt de gemeente, vergadert de oudsten, verzamelt de kinderen, en wie de borsten zuigen; de bruidegom ga uit zijn binnenkamer, en de bruid uit haar slaapkamer.", "Jes 8:8": "en hij zal doortrekken in Juda, hij zal het overstromen en er doorgaan, hij zal tot aan de hals reiken; en de uitgestrektheid van zijn vleugels zal de breedte van uw land vullen, o Immanuël!", "Nahum 1:10": "Omdat zij als doornen ineengevlochten zijn, en dronken zijn zoals zij plegen dronken te zijn, zo worden zij helemaal verteerd, als een dorre stoppel.", "Deut 6:20-24": "Wanneer uw zoon u morgen zal vragen: Wat zijn dat voor getuigenissen, en inzettingen, en rechten, die de HEERE, onze God, u geboden heeft? Dan zult u tegen uw zoon zeggen: Wij waren dienstknechten van Farao in Egypte; maar de HEERE heeft ons door een sterke hand uit Egypte uitgeleid. En de HEERE gaf tekenen, en grote en kwade wonderen, in Egypte, aan Farao en aan zijn hele huis, voor onze ogen;", "Ps 50:15": "En roept Mij aan in de dag van benauwdheid; Ik zal u eruit helpen, en u zult Mij eren.", "Ps 17:6-9": "Ik roep U aan, omdat U mij verhoort; o God! Neig Uw oor tot mij; hoor mijn woorden. Maak Uw weldadigheden wonderbaar, U, die verlost wie op U vertrouwen, van hen die tegen Uw rechterhand opstaan! Bewaar mij als het zwart van de oogappel, verberg mij onder de schaduw van Uw vleugels,", "Ps 108:7": "Opdat Uw beminden bevrijd worden; geef heil door Uw rechterhand, en verhoor ons.", "Ezra 5:15": "En hij zei tegen hem: Neem deze vaten, ga ze afvoeren naar de tempel die te Jeruzalem is, en laat het huis van God gebouwd worden op zijn plaats.", "2 Kor 4:5": "Want wij prediken niet onszelf, maar Christus Jezus, de Heere; en onszelf als uw dienaars, om Jezus' wil.", "Ezech 14:17": "Of als Ik het zwaard breng over datzelfde land, en zeg: Zwaard! ga door dat land, zodat Ik daaruit mensen en beesten uitroei;", "Ps 4:2": "Als ik roep, verhoor mij, o God van mijn gerechtigheid! In benauwdheid hebt U mij ruimte gemaakt; wees mij genadig, en hoor mijn gebed.", "Nahum 3:15-17": "Het vuur zal u daar verteren; het zwaard zal u uitroeien, het zal u opeten, als de kevers; vermeerder u als kevers, vermeerder u als sprinkhanen. U hebt meer handelaars dan er sterren aan de hemel zijn; de kevers zullen invallen, en ervandaan vliegen. Uw gekroonde zijn als de sprinkhanen, en uw krijgsoversten als de grote kevers, die zich in de heiningmuren legeren in de koude van de dagen; wanneer de zon opgaat, zo vliegen zij weg, zodat hun plaats onbekend is, waar zij geweest zijn.", "Spr 22:6": "Leer de jongen de eerste beginselen naar de eis van zijn weg; ook als hij oud geworden is, zal hij daar niet van afwijken.", "Jer 14:15-22": "Daarom zegt de HEERE zo: Aangaande de profeten, die in Mijn Naam profeteren, terwijl Ik hen niet gezonden heb, en zij toch nog zeggen: Er zal geen zwaard noch honger in dit land zijn; diezelfde profeten zullen door het zwaard en door de honger verteerd worden. En het volk, tot wie zij profeteren, zal op de straten van Jeruzalem weggeworpen zijn vanwege de honger en het zwaard; en er zal niemand zijn die hen kan begraven, hen, hun vrouwen, en hun zonen, en hun dochters; zo zal Ik hun slechtheid over hen uitstorten. Daarom zult u dit woord tegen hen zeggen: Mijn ogen zullen van tranen neerdalen, nacht en dag, en niet ophouden; want de jonkvrouw, de dochter van Mijn volk, is gebroken met een grote breuk, een plaag die zeer smartelijk is.", "1 Tim 3:15": "maar als ik langer wegblijf, opdat u weet hoe men zich moet gedragen in het huis van God, dat is de Gemeente van de levende God, een pilaar en fundament van de waarheid.", "Jes 62:9": "Maar wie het inzamelen, zullen het eten, en zij zullen de HEERE prijzen; en wie het bijeenbrengen, zullen het drinken in de voorhoven van Mijn heiligdom.", "Jer 23:28": "De profeet, bij wie een droom is, vertelt de droom; en bij wie Mijn woord is, spreekt Mijn woord waarachtig; wat heeft het stro met het koren te maken? spreekt de HEERE.", "1 Tim 4:12-16": "Laat niemand uw jeugdige leeftijd verachten, maar wees een voorbeeld voor de gelovigen in woord, in levenswandel, in liefde, in geest, in geloof, in reinheid. Houd aan met het voorlezen, met het vermanen, met het onderwijzen, totdat ik kom. Verwaarloos de gave niet die in u is, die u gegeven is door de profetie, met oplegging van de handen van het ouderlingschap.", "Ps 3:8": "Sta op, HEERE, verlos mij, mijn God; want U hebt al mijn vijanden op het kinnebakken geslagen; de tanden van de goddelozen hebt U verbrijzeld.", "Jer 48:3": "Er is een stem van geroep uit Horonaïm; verwoesting en een grote breuk!", "Luk 24:48": "En u bent getuigen van deze dingen.", "Jona 1:14": "Toen riepen zij tot de HEERE, en zeiden: Och HEERE, laat ons toch niet vergaan om het leven van deze man, en leg geen onschuldig bloed op ons; want U, HEERE, hebt gedaan zoals het U heeft behaagd.", "Klaagl 2:11-22": "Caph. Mijn ogen zijn verteerd door tranen, mijn ingewand wordt beroerd; mijn lever is ter aarde uitgeschud, vanwege de breuk van de dochter van mijn volk; omdat het kind en de zuigeling op de straten van de stad in onmacht zinken; Lamed. Als zij tegen hun moeders zeggen: Waar is koren en wijn, als zij op de straten van de stad in onmacht zinken, als de verslagenen; als hun ziel zich uitschudt in de schoot van hun moeders. Mem. Wat getuigen zal ik u brengen, wat zal ik bij u vergelijken, u dochter van Jeruzalem? Wat zal ik bij u vergelijken, dat ik u zou troosten, u jonkvrouw, dochter van Sion, want uw breuk is zo groot als de zee, wie kan u helen?", "Job 21:7": "Waarom leven de goddelozen, worden oud, ja, worden geweldig in vermogen?", "Hos 1:1": "Het woord van de Heere, dat gebeurd is tot Hosea, de zoon van Beëri, in de dagen van Uzzia, Jotham, Achaz, Hizkia, koningen van Juda, en in de dagen van Jerobeam, zoon van Joas, koning van Israël.", "Jes 13:6-9": "Huil, want de dag van de HEERE is nabij; hij komt als een verwoesting van de Almachtige. Daarom zullen alle handen slap worden, en het hart van elk mens zal versmelten; en zij zullen verschrikt worden, smarten en weeën zullen hen aangrijpen, zij zullen bang zijn als een barende vrouw; ieder zal over zijn naaste verbaasd zijn; hun gezichten zullen vlammende gezichten zijn.", "Ps 30:10": "Wat gewin is er in mijn bloed, in mijn neerdalen tot de groeve? Zal het stof U loven? Zal het Uw waarheid verkondigen?", "Hand 2:38": "En Petrus zei tegen hen: Bekeer u, en ieder van u moet gedoopt worden in de Naam van Jezus Christus, tot vergeving van de zonden; en u zult de gave van de Heilige Geest ontvangen.", "Jer 23:4": "En Ik zal herders over hen doen opstaan, die ze weiden zullen; en zij zullen niet meer vrezen, noch verschrikt worden, noch gemist worden, spreekt de HEERE.", "Deut 33:19": "Zij zullen de volken tot de berg roepen; daar zullen zij offeranden van gerechtigheid offeren; want zij zullen de overvloed van de zeeën zuigen, en de bedekte verborgen dingen van het zand.", "Matt 8:25": "En Zijn discipelen kwamen bij Hem en maakten Hem wakker, en zeiden: Heere, red ons, wij vergaan!", "1 Kor 4:1": "Zo houdt men ons voor, ieder mens: als dienaars van Christus, en uitdelers van de verborgenheden van God.", "Matt 24:49-51": "en zou beginnen zijn mededienstknechten te slaan, en te eten en te drinken met de dronkaards, dan zal de heer van die dienstknecht komen op een dag waarop hij hem niet verwacht, en op een uur dat hij niet weet; en hij zal hem in stukken houwen, en hem zijn deel geven met de huichelaars; daar zal geween zijn en het geknars van de tanden.", "Ps 64:3": "Verberg mij voor de heimelijke afspraken van de boosdoeners, voor het oproer van de werkers van ongerechtigheid.", "Mark 15:34": "En op het negende uur riep Jezus met luide stem: ELOÏ, ELOÏ, LAMMA SABACHTANI, dat vertaald betekent: Mijn God, Mijn God, waarom hebt U Mij verlaten?", "2 Tim 2:25": "met zachtmoedigheid onderwijzend hen die tegenstand bieden; of God hun misschien op enig moment bekering zou geven tot erkenning van de waarheid;", "Joël 2:1": "Waait op de bazuin te Sion, en roept luide op de berg van Mijn heiligheid; laat alle inwoners van het land beroerd zijn, want de dag van de HEERE komt, want hij is nabij.", "2 Kor 7:4-9": "Ik heb veel vrijmoedigheid in het spreken tegen u, ik heb veel roem over u; ik ben vervuld met vertroosting; ik ben zeer overvloedig van blijdschap in al onze verdrukking. Want ook toen wij in Macedonië gekomen waren, had ons vlees geen rust, maar wij werden in alles verdrukt; van buiten was strijd, van binnen vrees. Doch God, Die de nederigen vertroost, heeft ons getroost door de komst van Titus.", "1 Tim 5:1-3": "Bestraf een oudere man niet hard, maar vermaan hem als een vader; de jongeren als broeders; De oudere vrouwen als moeders; de jongeren als zusters, in alle reinheid. Eer de weduwen, die echt weduwen zijn.", "Jes 64:1": "Och, dat U de hemelen scheurde, dat U neerkwam, dat de bergen van Uw aangezicht wegsmolten;", "Ef 6:4": "En u vaders, verwek uw kinderen niet tot toorn, maar voed hen op in de lering en vermaning van de Heere.", "Hand 16:4": "En terwijl zij de steden doorreisden, gaven zij hun de verordeningen door die door de apostelen en de oudsten in Jeruzalem waren vastgesteld, om die te onderhouden.", "1 Tim 6:17-21": "Beveel de rijken in deze tegenwoordige wereld dat zij niet hoogmoedig zijn, en ook niet hun hoop stellen op de onzekerheid van de rijkdom, maar op de levende God, Die ons alle dingen rijkelijk verleent om ervan te genieten; dat zij goed doen, rijk worden in goede werken, vrijgevig zijn en bereid om te delen; en zo voor zichzelf een schat wegleggen, een goed fundament voor de toekomst, opdat zij het eeuwige leven verkrijgen mogen.", "Ps 25:22": "O God! verlos Israël uit al zijn benauwdheden.", "1 Tim 4:7": "Maar wijs de ongoddelijke en oudwijfse verzinsels af; oefen uzelf in plaats daarvan in godvruchtigheid.", "Ps 34:19": "Koph. De HEERE is nabij de gebrokenen van hart, en Hij behoudt de verslagenen van geest.", "Ex 13:14": "Wanneer het zal gebeuren dat uw zoon u later zal vragen en zegt: Wat is dat, dan moet u tegen hem zeggen: De HEERE heeft ons door een sterke hand uit Egypte, uit het diensthuis, uitgevoerd.", "Jes 38:13": "Ik stelde mij gerust tot de morgenstond toe; zoals een leeuw, zo zal Hij al mijn beenderen breken; van de dag tot de nacht zult U mij ten einde gebracht hebben.", "Micha 3:1": "Verder zei ik: Hoor nu, hoofden van Jakob, en leiders van het huis van Israël! Betaamt het u niet om het recht te weten?", "Jes 28:10": "Want het is gebod op gebod, gebod op gebod, regel op regel, regel op regel, hier een weinig, daar een weinig.", "Matt 7:6": "Geef het heilige niet aan de honden, en gooi uw parels niet voor de zwijnen; anders vertrappen ze die met hun poten, en verscheuren u nadat ze zich hebben omgekeerd.", "Joh 4:35-38": "Zegt u niet: Het zijn nog vier maanden, en dan komt de oogst? Zie, Ik zeg u: Sla uw ogen op en bekijk de velden; want ze zijn al wit om te oogsten. En wie maait, ontvangt loon, en verzamelt vrucht voor het eeuwige leven; opdat zij zich samen verblijden, zowel wie zaait als wie maait. Want hierin is dat gezegde waar: De één is het die zaait, en de ander die maait.", "Rom 2:4": "Of veracht u de rijkdom van Zijn goedertierenheid, en verdraagzaamheid, en geduld, zonder te weten dat de goedertierenheid van God u tot bekering leidt?", "Klaagl 2:19": "Koph. Maak u op, maak geschrei 's nachts, in het begin van de nachtwaken, stort uw hart uit voor het aangezicht van de Heere als water; hef uw handen tot Hem op voor de ziel van uw kinderen, die in onmacht gevallen zijn van honger, vooraan op alle straten.", "1 Petr 5:1-4": "De oudsten die onder u zijn, vermaan ik, die een medeoudste en getuige van het lijden van Christus ben, en deelachtig aan de heerlijkheid die geopenbaard zal worden: Weid de kudde van God die onder u is, en houd daar toezicht op, niet uit dwang, maar gewillig; ook niet om vuil gewin, maar met een bereidwillig gemoed; ook niet als heersers over het erfdeel van de Heere, maar als voorbeelden voor de kudde.", "Ps 6:7": "Ik ben moe van mijn zuchten; ik laat mijn bed de hele nacht zwemmen; ik doornat mijn bedstede met mijn tranen.", "Matt 3:8": "Breng dan vruchten voort die bij de bekering passen.", "2 Kron 5:14": "En de priesters konden, vanwege die wolk, niet staan om te dienen; want de heerlijkheid van de HEERE had het huis van God vervuld.", "Neh 6:10": "Toen ik in het huis kwam van Semaja, de zoon van Delaja, de zoon van Mehetabeel — hij was namelijk opgesloten — zei hij: Laten wij samenkomen in het huis van God, binnen in de tempel, en laten wij de deuren van de tempel sluiten; want zij zullen komen om u te doden, ja, 's nachts zullen zij komen om u te doden.", "Neh 4:4": "Hoor, o onze God, dat wij erg veracht worden, en keer hun smaad terug op hun eigen hoofd, en geef hen over als buit in een land van gevangenschap.", "Ps 70:2": "Haast U, o God, om mij te verlossen, o HEERE, tot mijn hulp.", "Ps 74:1": "Een onderwijzing, voor Asaf. O God! Waarom verstoot U ons voor eeuwig? Waarom zou Uw toorn roken tegen de schapen van Uw weide?", "1 Tim 3:12": "Laat de diakenen mannen van één vrouw zijn, die hun kinderen en hun eigen huizen goed besturen.", "1 Kon 8:37": "Als er honger in het land zal zijn, als er pest zal zijn, als er brandkoren, honingdauw, sprinkhanen, of kevers zullen zijn, als zijn vijand hem in het land van zijn poorten belegeren zal, of welke plaag of welke ziekte er ook zal zijn;", "Ex 20:10": "maar de zevende dag is de sabbat van de HEERE, uw God; dan zult u geen werk doen, u, noch uw zoon, noch uw dochter, noch uw dienstknecht, noch uw dienstmaagd, noch uw vee, noch uw vreemdeling die in uw poorten is;", "2 Kor 1:24": "Niet dat wij heerschappij voeren over uw geloof, maar wij zijn medewerkers van uw blijdschap; want u staat door het geloof.", "Jes 46:8": "Denk hieraan, en wees kloek, breng het weer in het hart, o overtreders!", "Hos 10:12": "Zaai voor uzelf tot gerechtigheid, maai tot goedertierenheid; ontgin voor uzelf braakland; want het is tijd om de Heere te zoeken, totdat Hij komt en over u de gerechtigheid laat regenen.", "Jes 24:4": "Het land treurt, het verwelkt; het aardrijk kwijnt weg, het verwelkt; de hoogsten van het volk van het land kwijnen weg.", "Hand 3:19": "Kom dus tot inkeer en bekeer u, opdat uw zonden uitgewist worden, wanneer de tijden van verkwikking gekomen zijn van het aangezicht van de Heere,", "Hos 2:8": "Daarom zal Ik terugkomen, en Mijn koren wegnemen op zijn tijd, en Mijn nieuwe wijn op zijn vastgestelde tijd; en Ik zal Mijn wol en Mijn vlas wegrukken, dat diende om haar naaktheid te bedekken.", "Ezech 16:61-63": "Dan zult u aan uw wegen denken en beschaamd zijn, wanneer u uw zusters, die groter zijn dan u, samen met hen die kleiner zijn dan u, aannemen zult; want Ik zal ze u geven tot dochters, maar niet op grond van uw verbond. Want Ik zal Mijn verbond met u oprichten, en u zult weten dat Ik de HEERE ben; opdat u eraan denkt, en zich schaamt, en niet meer uw mond opendoet vanwege uw schande, wanneer Ik verzoening voor u zal doen over alles wat u gedaan hebt, spreekt de Heere HEERE.", "Matt 26:42": "Opnieuw, voor de tweede keer, ging Hij heen en bad, en zei: Mijn Vader! Als deze drinkbeker niet aan Mij voorbij kan gaan zonder dat Ik hem drink, laat Uw wil dan gebeuren!", "Hand 4:30": "Doordat U Uw hand uitstrekt tot genezing, en doordat er tekenen en wonderen gebeuren door de Naam van Uw heilig Kind Jezus.", "Klaagl 5:4": "Ons water moeten wij voor geld drinken; ons hout komt ons op prijs te staan.", "Gen 23:16": "En Abraham luisterde naar Efron; en Abraham woog Efron het geld af, waarover hij gesproken had ten aanhoren van de zonen van Heth, vierhonderd sikkel van het zilver, gangbaar bij de koopman.", "Job 34:32": "Behalve wat ik zie, leer Gij mij; heb ik onrecht gewrocht, ik zal het niet meer doen.", "Ps 61:2": "O God! hoor mijn geschrei, merk op mijn gebed.", "Spr 20:1": "De wijn is een spotter, de sterke drank is woelachtig; al wie daarin dwaalt, zal niet wijs zijn.", "2 Kor 5:20": "Zo zijn wij dan gezanten namens Christus, alsof God door ons bad; wij bidden namens Christus: laat u met God verzoenen.", "Jes 40:11": "Hij zal Zijn kudde weiden gelijk een herder; Hij zal de lammeren in Zijn armen bijeenbrengen, en in Zijn schoot dragen; de zogende dieren zal Hij zachtjes leiden.", "Joël 2:12": "Nu dan ook, spreekt de HEERE, bekeert u tot Mij met uw hele hart, en dat met vasten en met geween, en met rouwklagen.", "Klaagl 5:10": "Onze huid is zwart geworden als een oven, vanwege de verzengende hitte van de honger.", "Ps 44:24-27": "Waak op, waarom zou U slapen, Heere! Ontwaak, verstoot niet tot in eeuwigheid. Waarom zou U Uw aangezicht verbergen, onze ellende en onze onderdrukking vergeten? Want onze ziel is in het stof neergebogen; onze buik kleeft aan de aarde.", "Jes 24:7": "De most treurt, de wijnstok kwijnt weg, allen die blijhartig waren, zuchten.", "Amos 2:8": "En zij leggen zich neer bij elk altaar op de verpande klederen, en drinken de wijn van de beboeten in het huis van hun goden.", "Jer 48:33": "Zodat de blijdschap en vreugde uit het vruchtbare veld, namelijk uit Moabs land, weggenomen is; want Ik heb de wijn doen ophouden uit de kuipen; men zal geen druiven treden met vreugdegeroep; het vreugdegeroep zal geen vreugdegeroep zijn.", "Jer 18:11": "Nu dan, spreek nu tot de mannen van Juda en tot de inwoners van Jeruzalem, en zeg: Zo zegt de HEERE: Zie, Ik formeer een kwaad tegen u, en denk tegen u een gedachte; bekeer u dan nu, ieder van zijn boze weg, en maak uw wegen en uw daden goed.", "Ps 3:3": "Velen zeggen van mijn ziel: Hij heeft geen heil bij God. Sela.", "Ps 7:7": "Sta op, HEERE, in Uw toorn, verhef U om de woede van hen die mij benauwen, en ontwaak tot mij; U hebt het oordeel bevolen.", "2 Kor 5:18": "En dit alles is uit God, Die ons met Zichzelf verzoend heeft door Jezus Christus, en ons de bediening van de verzoening gegeven heeft.", "Dan 9:3": "En ik richtte mijn gezicht tot God, de HEERE, om Hem te zoeken met gebed en smekingen, met vasten, en een zak, en as.", "Jes 32:13": "Op het land van mijn volk zal de doorn en de distel opgaan; ja, op alle vreugdehuizen, in de vrolijk huppelende stad.", "Luk 21:11": "En er zullen grote aardbevingen zijn op verscheidene plaatsen, en hongersnoden, en pestilentiën; er zullen ook schrikwekkende dingen, en grote tekenen van de hemel gebeuren.", "Ps 3:2": "O HEERE, hoe zijn mijn tegenstanders talrijk geworden; velen staan tegen mij op.", "Joz 8:35": "Er was geen woord van alles wat Mozes geboden had, dat Jozua niet hardop voorlas voor de hele gemeente van Israël, en de vrouwen, en de kleine kinderen, en de vreemdelingen die in hun midden woonden.", "Ezra 7:20": "Het overige nu, dat nodig zal zijn voor het huis van uw God, dat u zult moeten uitgeven, zult u geven uit het schathuis van de koning.", "Spr 29:15": "De roede en de bestraffing geven wijsheid; maar een kind dat aan zichzelf overgelaten wordt, brengt zijn moeder schande.", "Spr 1:1": "De spreuken van Salomo, de zoon van David, de koning van Israël,", "Amos 3:1": "Hoort dit woord, dat de HEERE tegen u spreekt, kinderen van Israël! Namelijk tegen het gehele geslacht, dat Ik uit Egypteland heb opgevoerd, en Hij zei:", "Ps 4:8": "U hebt vreugde in mijn hart gegeven, meer dan ten tijde dat hun koren en hun most vermenigvuldigd waren.", "Neh 11:11": "Seraja, de zoon van Hilkia, de zoon van Mesullam, de zoon van Zadok, de zoon van Merajoth, de zoon van Ahitub, was voorganger van Gods huis;", "Ezech 11:18-20": "En zij zullen daarheen komen, en al de verfoeiselen daarvan en al de gruwelen daarvan van daar wegdoen. En Ik zal hun één hart geven, en Ik zal een nieuwe geest in uw binnenste geven; en Ik zal het stenen hart uit hun vlees wegnemen, en zal hun een hart van vlees geven; Opdat zij wandelen in Mijn inzettingen, en Mijn rechten bewaren en die doen; en zij zullen Mij tot een volk zijn, en Ik zal hun tot een God zijn.", "Jer 32:16-25": "Vervolgens, nadat ik de koopbrief aan Baruch, de zoon van Nerija, gegeven had, bad ik tot de HEERE: Ach, Heere HEERE! Zie, U hebt de hemel en de aarde gemaakt, door Uw grote kracht en door Uw uitgestrekte arm; niets is voor U te wonderlijk. U, Die goedertierenheid bewijst aan duizenden, en de ongerechtigheid van de vaders vergeldt in de schoot van hun kinderen na hen; U grote, U geweldige God, Wiens Naam is HEERE van de heerscharen!", "Jes 32:11": "Beeft, u geruste vrouwen; wees beroerd, dochters, die zo zeker bent; trek u uit, en ontbloot u, en gord zakken om uw middel.", "Ps 91:15": "Hij zal Mij aanroepen, en Ik zal hem verhoren; in de benauwdheid zal Ik bij hem zijn. Ik zal hem eruit trekken, en zal hem verheerlijken.", "Ps 95:7": "Want Hij is onze God, en wij zijn het volk van Zijn weide, en de schapen van Zijn hand. Heden, als u Zijn stem hoort,", "Neh 4:9": "Maar wij baden tot onze God, en zetten wacht tegen hen, dag en nacht, vanwege hen.", "Spr 23:21": "Want een zuiper en een vraat zullen arm worden; en de sluimering doet iemand versleten kleren dragen.", "Ex 10:2": "En opdat u voor de oren van uw kinderen en uw kleinkinderen kunt vertellen wat Ik in Egypte gedaan heb, en Mijn tekenen, die Ik onder hen gedaan heb; opdat u weet dat Ik de HEERE ben.", "Gen 28:17": "En hij vreesde, en zei: Hoe ontzagwekkend is deze plaats! Dit is niets anders dan een huis van God, en dit is de poort van de hemel!", "Mark 1:15": "en zei: De tijd is vervuld, en het Koninkrijk van God is nabijgekomen; bekeer u, en geloof het Evangelie.", "Ps 119:76": "Laat toch Uw goedertierenheid zijn om mij te troosten, naar Uw toezegging aan Uw knecht.", "Ps 105:34": "Hij sprak, en er kwamen sprinkhanen en kevers, en dat zonder getal;", "Rom 1:14": "Aan Grieken en barbaren, aan wijzen en onwijzen ben ik een schuldenaar.", "Neh 10:39": "Want de kinderen van Israël en de kinderen van Levi moeten hefoffer van koren, most en olie in die kamers brengen, omdat daar de voorwerpen van het heiligdom zijn, en de priesters, die dienen, en de poortwachters, en de zangers; zodat wij het huis van onze God niet zouden verlaten.", "Ps 39:11": "Neem Uw plaag van mij weg; ik ben bezweken door de slagen van Uw hand.", "Ps 130:1-8": "Een lied van de hogere trappen. Uit de diepten roep ik tot U, o HEERE! Heere! Hoor naar mijn stem; laat Uw oren opmerkzaam zijn op de stem van mijn smekingen. Als U, HEERE, op de ongerechtigheden let, Heere, wie zal dan bestaan?", "2 Kon 17:27": "Toen gaf de koning van Assyrië bevel en zei: Breng een van de priesters daarheen, die u vandaar weggevoerd hebt, laat hen heentrekken, en daar wonen; en laat hij hun de wijze van de God van het land leren.", "Ef 6:20": "waarvoor ik een gezant ben in een keten, opdat ik daarin vrijmoedig mag spreken, zoals het mij past te spreken.", "Ps 64:2": "Hoor, o God, mijn stem in mijn geklaag; behoed mijn leven voor de schrik van de vijand.", "Ps 105:3": "Roemt in de Naam van Zijn heiligheid; het hart van hen die de HEERE zoeken, verblijde zich.", "2 Tim 1:6-8": "Om deze reden herinner ik u eraan, dat u de gave van God opwekt, die in u is door de oplegging van mijn handen. Want God heeft ons niet een geest van vreesachtigheid gegeven, maar van kracht, en van liefde, en van gematigdheid. Schaam u dan niet voor de getuigenis van onze Heere, en ook niet voor mij die Zijn gevangene ben; maar lijd verdrukkingen mee met het Evangelie, naar de kracht van God;", "Jak 5:9": "Zucht niet tegen elkaar, broeders, opdat u niet veroordeeld wordt; zie, de Rechter staat voor de deur.", "Jer 14:4": "Omdat het aardrijk gescheurd is, doordat er geen regen op de aarde is; de akkerlieden zijn beschaamd, zij bedekken hun hoofd.", "Klaagl 1:9-11": "Teth. Haar onreinheid is in haar zomen, zij heeft niet gedacht aan haar einde, daarom is zij wonderbaarlijk omlaag gedaald; zij heeft geen trooster. HEERE, zie mijn ellende aan, want de vijand maakt zich groot. Jod. De tegenstander heeft zijn hand aan al haar gewenste dingen uitgebreid; zeker heeft zij aangezien, dat de heidenen in haar heiligdom gingen, waarvan Gij geboden had, dat zij in Uw gemeente niet komen zouden. Caph. Al haar volk zucht, brood zoekend, zij hebben hun gewenste dingen voor voedsel gegeven, om de ziel te verkwikken. Zie, HEERE, en aanschouw, dat ik onwaard geworden ben.", "2 Kron 20:3": "Josafat nu werd bevreesd, en richtte zich erop om de HEERE te zoeken; en hij riep een vasten uit in heel Juda.", "Jer 25:5": "En Hij zei: Bekeer u toch, ieder van zijn boze weg, en van de boosheid van uw daden, en woon in het land, dat de HEERE u en uw vaderen gegeven heeft, van eeuw tot in eeuw;", "2 Kor 7:15": "En zijn innerlijke bewegingen zijn des te overvloediger jegens u, wanneer hij denkt aan de gehoorzaamheid van u allen, hoe u hem met vrees en beven hebt ontvangen.", "Gal 5:19-21": "De werken van het vlees nu zijn openbaar; dat zijn: overspel, hoererij, onreinheid, losbandigheid, Afgoderij, toverij, vijandschappen, ruzies, jaloersheden, toorn, twisten, verdeeldheid, afwijkingen in de leer, Afgunst, moord, dronkenschappen, uitspattingen, en dergelijke; waarvan ik u van tevoren zeg, zoals ik ook eerder gezegd heb, dat wie zulke dingen doen, het Koninkrijk van God niet zullen beërven.", "Matt 9:14": "Toen kwamen de discipelen van Johannes bij Hem en zeiden: Waarom vasten wij en de Farizeeën veel, en Uw discipelen vasten niet?", "Ps 35:23": "Ontwaak en word wakker tot mijn recht; mijn God en Heere! Tot mijn twistzaak.", "Hab 1:13": "U bent te rein van ogen om het kwade te zien, en de kwelling kunt U niet aanschouwen; waarom zou U aanschouwen wie trouweloos handelen? Waarom zou U zwijgen, als de goddeloze verslindt wie rechtvaardiger is dan hij?", "Hos 5:15": "Ik zal heengaan en terugkeren naar Mijn plaats, totdat zij zichzelf schuldig weten en Mijn aangezicht zoeken; als het hun bang te moede is, zullen zij Mij vroeg zoeken.", "Ezech 14:13": "Mensenkind, als een land tegen Mij zondigt door zwaar te overtreden, dan zal Ik Mijn hand daartegen uitstrekken, en de staf van het brood daarvan breken, en een honger daarin zenden, zodat Ik daaruit mensen en beesten uitroei;", "Zach 9:17": "Want hoe groot zal zijn goed wezen en hoe groot zal zijn schoonheid wezen! Het koren zal de jongelingen, en de most zal de jonkvrouwen sprekend maken.", "Jes 49:15": "Kan ook een vrouw haar zuigeling vergeten, dat zij zich niet ontfermt over de zoon van haar buik? Ofschoon deze zou vergeten, zo zal Ik u toch niet vergeten.", "Jes 38:14-19": "Zoals een kraanvogel of zwaluw, zo piepte ik; ik kirde als een duif; mijn ogen keken smachtend omhoog; o HEERE! ik word onderdrukt, wees Gij mijn Borg. Wat zal ik spreken? Zoals Hij het mij heeft toegezegd, zo heeft Hij het gedaan; ik zal nu al zoetjes voortgaan al mijn jaren, vanwege de bitterheid van mijn ziel. Heere, door deze dingen leeft men, en in dit alles is het leven van mijn geest; want Gij hebt mij gezond gemaakt en mij genezen.", "2 Kor 12:19": "Denkt u opnieuw dat wij ons bij u verontschuldigen? Wij spreken in de tegenwoordigheid van God in Christus; en dit alles, geliefden, tot uw opbouw.", "Hand 1:22": "beginnend vanaf de doop van Johannes, tot de dag toe waarop Hij van ons opgenomen is, één van hen met ons getuige wordt van Zijn opstanding.", "Jer 12:13": "Zij hebben tarwe gezaaid, maar doornen gemaaid; zij hebben zich gepijnigd, maar niet gevorderd; word zo beschaamd vanwege uw inkomsten, vanwege de gloed van de toorn van de HEERE.", "Ps 49:2": "Hoort dit, alle volken! Neemt het ter oor, alle inwoners van de wereld,", "2 Kron 32:28": "Ook opslagplaatsen voor de opbrengst van koren, en wijn, en olie; en stallen voor allerlei beesten, en kooien voor de kudden.", "Ex 10:15": "Want zij bedekten het oppervlak van het hele land, zodat het land verduisterd werd; en zij aten al het groen van het land op, en alle vruchten van de bomen die de hagel had overgelaten; en er bleef niets groens over aan de bomen, noch aan het groen van het veld, in het hele Egypteland.", "Ps 84:11": "Want een dag in Uw voorhoven is beter dan duizend elders; ik koos liever aan de drempel in het huis van mijn God te zijn, dan lang te wonen in de tenten van de goddeloosheid.", "1 Sam 1:11": "En zij deed een gelofte, en zei: HEERE van de heerscharen, als U werkelijk de ellende van Uw dienstmaagd aanziet, en aan mij denkt, en Uw dienstmaagd niet vergeet, maar aan Uw dienstmaagd een zoon geeft, dan zal ik hem aan de HEERE geven al de dagen van zijn leven, en er zal geen scheermes op zijn hoofd komen.", "Ps 9:14": "Wees mij genadig, HEERE, zie mijn ellende aan, die mijn haters mij aandoen, Gij, Die mij verhoogt uit de poorten van de dood;", "Mal 2:15": "Heeft Hij niet maar één gemaakt, hoewel Hij van de Geest overvloed had? En waarom die ene? Hij zocht een zaad van God. Daarom, wees op uw hoede met uw geest, en laat niemand trouweloos handelen tegen de vrouw van zijn jeugd.", "Joh 3:34": "Want Hij Die God gezonden heeft, spreekt de woorden van God; want God geeft Hem de Geest niet met mate.", "1 Tim 1:18": "Dit gebod beveel ik u, mijn zoon Timotheüs, dat u naar de profetieën die eerder over u uitgesproken zijn, daarmee de goede strijd strijdt;", "Jer 14:12": "Ofschoon zij vasten, zal Ik naar hun geschrei niet horen, en ofschoon zij brandoffer en spijsoffer offeren, zal Ik aan hen geen welgevallen hebben; maar door het zwaard, en door de honger, en door de pest zal Ik hen verteren.", "Klaagl 5:19-22": "U, o HEERE, zit in eeuwigheid, Uw troon is van geslacht tot geslacht. Waarom zou U ons voor altijd vergeten? Waarom zou U ons zo lange tijd verlaten? HEERE, bekeer ons tot U, dan zullen wij bekeerd zijn; vernieuw onze dagen als vanouds.", "Jes 16:10": "zodat de blijdschap en vrolijkheid weggenomen is van het vruchtbare veld, en in de wijngaarden wordt niet gezongen, en er wordt geen gejuich gemaakt; de druiventreder treedt geen wijn uit in de wijnbakken, ik heb het vreugdegeroep doen ophouden.", "Ps 79:5": "Hoe lang, HEERE? Zult U eeuwig toornen? Zal Uw ijver als vuur branden?", "2 Kron 7:14": "En Mijn volk, over wie Mijn Naam genoemd wordt, zich verootmoedigt en bidt, en zij Mijn aangezicht zoeken, en zich bekeren van hun slechte wegen; dan zal Ik uit de hemel horen, en hun zonden vergeven, en hun land genezen.", "Joël 2:2-9": "Een dag van duisternis en donkerheid, een dag van wolken en dikke duisternis, als de dageraad uitgespreid over de bergen; een groot en machtig volk, zoals er van oude tijden af niet geweest is, en na hen niet meer zal zijn tot in jaren van vele geslachten. Voor hen verteert een vuur, en achter hen brandt een vlam; het land is voor hen als een lusthof, maar achter hen een woeste wildernis, en ook is er geen ontkomen aan hen. Hun gedaante is als de gedaante van paarden, en als ruiters, zo zullen zij lopen.", "1 Kor 4:21": "Wat wilt u? Zal ik met de roede naar u toe komen, of in liefde en in de geest van zachtmoedigheid?", "Jer 4:14": "Was uw hart van slechtheid, o Jeruzalem! opdat u behouden wordt; hoe lang zult u de gedachten van uw ijdelheid in uw binnenste laten overnachten?", "Hos 7:5": "Het is de dag van onze koning; de vorsten maken hem ziek door verhitting van de wijn; hij strekt zijn hand uit met de spotters.", "Ps 95:8": "Verhard uw hart niet, zoals te Meriba, zoals ten dage van Massa in de woestijn;", "Joël 2:15": "Waait op de bazuin te Sion, heiligt een vasten, roept een verbodsdag uit.", "Ps 86:1-17": "Een gebed van David. HEERE! neig Uw oor, verhoor mij; want ik ben ellendig en nooddruftig. Bewaar mijn ziel, want ik ben Uw gunstgenoot, o Gij, mijn God! verlos Uw knecht, die op U vertrouwt. Wees mij genadig, Heere! want ik roep tot U de hele dag.", "Jer 4:15": "Want een stem verkondigt vanaf Dan, en laat ellende horen vanaf het gebergte van Efraïm.", "1 Kor 1:16": "Overigens heb ik ook het huisgezin van Stefanus gedoopt; verder weet ik niet, of ik iemand anders gedoopt heb.", "Ezech 5:17": "Ja, honger en boos gedierte, die u van kinderen zullen beroven, zal Ik over u zenden; ook zal pest en bloed onder u omgaan; en het zwaard zal Ik over u brengen; Ik, de HEERE, heb het gesproken!", "Neh 1:9": "Maar als u zich tot Mij bekeert, en Mijn geboden houdt, en die doet; al waren uw verdrevenen aan het einde van de hemel, Ik zal hen vandaar verzamelen, en zal ze brengen naar de plaats die Ik gekozen heb om Mijn Naam daar te doen wonen.", "Micha 7:7": "Maar ik zal uitzien naar de HEERE, ik zal wachten op de God van mijn heil; mijn God zal mij horen.", "Deut 28:42": "Al uw geboomte, en de vrucht van uw land, zal het schadelijke gewormte in bezit nemen.", "Hand 10:42": "En Hij heeft ons geboden aan het volk te prediken, en te betuigen dat Hij Degene is Die door God aangesteld is tot een Rechter van levenden en doden.", "Ps 96:9": "Aanbidt de HEERE in de heerlijkheid van het heiligdom; beeft voor Zijn aangezicht, heel de aarde.", "Deut 31:12": "verzamel het volk, de mannen, en de vrouwen, en de kinderen, en uw vreemdelingen die in uw poorten zijn; opdat zij horen, en opdat zij leren, en de HEERE, uw God, vrezen, en nauwlettend doen alle woorden van deze wet.", "Spr 1:4": "Om de eenvoudigen kloekzinnigheid te geven, de jongeling wetenschap en bedachtzaamheid.", "Job 15:30": "Hij zal van de duisternis niet ontwijken, de vlam zal zijn scheut verdrogen; hij zal wijken door het geblaas van zijn mond.", "1 Tim 5:19-22": "Neem tegen een ouderling geen beschuldiging aan, dan alleen op grond van twee of drie getuigen. Bestraf hen die zondigen in aanwezigheid van allen, opdat ook de anderen ontzag mogen hebben. Ik roep als getuige God aan, en de Heere Jezus Christus, en de uitverkoren engelen, dat u deze dingen bewaart, zonder vooroordeel, niets doend uit partijdigheid.", "Matt 3:7": "Toen hij dan velen van de Farizeeën en Sadduceeën naar zijn doop zag komen, zei hij tegen hen: Adderengebroed! Wie heeft u laten weten dat u moet vluchten voor de komende toorn?", "Ps 74:21-23": "Laat de verdrukte niet beschaamd terugkeren; laat de ellendige en de arme Uw Naam prijzen. Sta op, o God! Voer Uw eigen rechtszaak; denk aan de smaad die U de hele dag door de dwaas aangedaan wordt. Vergeet het geroep van Uw tegenstanders niet; het rumoer van hen die tegen U opstaan, klimt voortdurend op.", "Ps 7:3": "Anders zou hij mijn ziel roven als een leeuw, die verscheurt, terwijl er geen redder is.", "Ps 123:4": "Onze ziel is veel te zat van de spot van de weldenkenden, van de verachting van de hoogmoedigen.", "Jer 15:19-21": "Daarom zegt de HEERE zo: Als u zult terugkeren, zal Ik u laten terugkeren; u zult voor Mijn aangezicht staan; en als u het kostbare van het waardeloze scheidt, zult u als Mijn mond zijn; laat hen naar u terugkeren, maar u zult niet naar hen terugkeren. Want Ik heb u tegen dit volk gesteld tot een koperen versterkte muur; zij zullen wel tegen u strijden, maar u niet overwinnen; want Ik ben met u, om u te behouden en om u te redden, spreekt de HEERE. Ja, Ik zal u redden uit de hand van de bozen, en Ik zal u verlossen uit de greep van de tirannen.", "Ex 4:12": "En nu ga heen, en Ik zal met uw mond zijn, en zal u leren, wat u spreken zult.", "Openb 2:7": "Wie oren heeft, laat hij horen wat de Geest tegen de gemeenten zegt. Wie overwint, hem zal Ik geven te eten van de boom des levens, die in het midden van het paradijs van God is.", "1 Kor 7:5": "Onttrek u niet aan elkaar, tenzij met wederzijdse instemming voor een tijd, opdat u zich aan vasten en bidden kunt wijden; en kom weer bijeen, opdat de satan u niet verzoekt, omdat u zich niet kunt onthouden.", "Klaagl 1:11": "Caph. Al haar volk zucht, brood zoekend, zij hebben hun gewenste dingen voor voedsel gegeven, om de ziel te verkwikken. Zie, HEERE, en aanschouw, dat ik onwaard geworden ben.", "Hand 18:10": "Want Ik ben met u, en niemand zal de hand aan u leggen om u kwaad te doen; want Ik heb veel volk in deze stad.", "Hos 5:1": "Hoor dit, priesters! En let op, huis van Israël! En neem ter ore, huis van de koning! Want u geldt dit oordeel, omdat u een strik bent geworden bij Mizpa, en een uitgespannen net op Thabor.", "Ps 35:13": "Mij aangaande daarentegen, toen zij ziek waren, was een zak mijn kleed; ik kwelde mijn ziel met vasten, en mijn gebed keerde weer in mijn boezem.", "2 Kron 36:19": "En zij verbrandden het huis van God, en zij braken de muur van Jeruzalem af, en al de paleizen daarvan verbrandden zij met vuur, en vernietigden ook alle kostbare voorwerpen daarvan.", "Jes 9:2": "U hebt dit volk vermenigvuldigd, maar U hebt de blijdschap niet groot gemaakt; zij zullen toch blij zijn voor Uw aangezicht, zoals men zich verblijdt bij de oogst, zoals men zich verheugt wanneer men de buit uitdeelt.", "2 Tim 4:2": "Predik het woord; blijf aandringen, gelegen en ongelegen; weerleg, bestraf, vermaan, met alle geduld en onderwijs.", "Jes 38:19": "De levende, de levende, die zal U loven, zoals ik heden doe; de vader zal aan de kinderen Uw waarheid bekendmaken.", "Deut 12:7": "En daar zult u voor het aangezicht van de HEERE, uw God, eten en vrolijk zijn, u en uw huizen, over alles waaraan u uw hand geslagen hebt, waarin de HEERE, uw God, u gezegend heeft.", "Jes 5:22": "Wee hun die helden zijn om wijn te drinken, en die dappere mannen zijn om sterke drank te mengen!", "Ezech 7:16": "En hun ontkomenen zullen wel ontkomen, maar zij zullen op de bergen zijn, zij allen zullen zijn als duiven van de dalen, kermend, ieder om zijn ongerechtigheid.", "1 Kron 24:5": "En zij deelden hen in door loten, dezen met genen, want de leiders van het heiligdom en de leiders van God waren uit de kinderen van Eleazar en van de kinderen van Ithamar.", "Jes 38:3": "En hij zei: Och HEERE, denk er toch aan dat ik voor Uw gezicht in waarheid en met een volkomen hart gewandeld heb, en dat ik gedaan heb wat goed is in Uw ogen. En Hizkia huilde erg hard.", "Jes 57:15": "Want zo zegt de Hoge en Verhevene, Die in de eeuwigheid woont, en Wiens Naam heilig is: Ik woon in de hoogte en in het heilige, en bij hem die een verbrijzelde en nederige geest heeft, om de geest van de nederigen levend te maken, en om het hart van de verbrijzelden levend te maken.", "Jer 4:8": "Hierom, doe zakken aan, bedrijf misbaar en huil; want de gloed van de toorn van de HEERE is niet van ons afgekeerd.", "Deut 33:28": "Israël dan zal zeker alleen wonen, en Jakobs oog zal zijn op een land van koren en most; ja, zijn hemel zal van dauw druipen.", "Matt 3:2": "en zei: Bekeer u; want het Koninkrijk der hemelen is nabij gekomen.", "Hebr 7:13": "Want Hij, over Wie deze dingen gezegd worden, behoort tot een andere stam, waarvan niemand zich tot het altaar begeven heeft.", "Hos 14:3": "Neem deze woorden met u, en bekeer u tot de Heere; zeg tegen Hem: Neem weg alle ongerechtigheid, en geef het goede, zo zullen wij betalen de stieren van onze lippen.", "Ezech 33:10-12": "Daarom, mensenkind! Zeg tegen het huis van Israël: U spreekt zo en zegt: Omdat onze overtredingen en onze zonden op ons zijn, en wij daarin wegkwijnen, hoe zouden wij dan leven? Zeg tegen hen: Zo waarachtig als Ik leef, spreekt de Heere HEERE, Ik heb geen behagen in de dood van de goddeloze! Maar hierin heb Ik behagen, dat de goddeloze zich bekeert van zijn weg en leeft. Bekeert u, bekeert u van uw slechte wegen, want waarom zou u sterven, o huis van Israël? U dan, o mensenkind! Zeg tegen de kinderen van uw volk: De gerechtigheid van de rechtvaardige zal hem niet redden op de dag van zijn overtreding; en wat de goddeloosheid van de goddeloze betreft, hij zal er niet om vallen op de dag dat hij zich van zijn goddeloosheid bekeert; en de rechtvaardige zal niet kunnen leven door zijn gerechtigheid, op de dag dat hij zondigt.", "Ps 42:10": "Ik zal zeggen tot God: Mijn Steenrots! Waarom vergeet U mij? Waarom ga ik in het zwart, vanwege de onderdrukking van de vijand?", "Joël 2:14": "Wie weet, Hij mocht Zich wenden en berouw hebben; en Hij mocht een zegen achter Zich overlaten tot spijsoffer en drankoffer voor de HEERE, uw God.", "Hos 9:4": "Zij zullen de Heere geen drankoffers doen van wijn, en die zouden Hem ook niet aangenaam zijn; hun offers zouden voor hen zijn als treurbrood; allen die daarvan zouden eten, zouden onrein worden; want hun brood zal voor henzelf zijn, het zal niet in het huis van de Heere komen.", "2 Kron 33:13": "En bad tot Hem; en Hij liet Zich door hem verbidden, en hoorde zijn smeking, en Hij bracht hem terug naar Jeruzalem, in zijn koninkrijk. Toen erkende Manasse, dat de HEERE God is.", "Matt 9:15": "En Jezus zei tegen hen: Kunnen de bruiloftsgasten treuren, zolang de Bruidegom bij hen is? Maar de dagen zullen komen, wanneer de Bruidegom van hen weggenomen zal zijn, en dan zullen zij vasten.", "Richt 21:2": "Zo kwam het volk naar het huis van God, en zij bleven daar tot de avond, voor het aangezicht van God; en zij hieven hun stem op en weenden met groot geween.", "Hand 27:33": "En terwijl het dag zou worden, vermaande Paulus hen allen om voedsel te nemen, en zei: Het is vandaag de veertiende dag dat u wachtend blijft zonder eten, en niets hebt genomen.", "Ps 104:14": "Hij doet het gras uitspruiten voor de dieren, en het gewas tot dienst van de mens, zodat brood uit de aarde voortkomt.", "Hand 1:21": "Het is dan nodig dat van de mannen die met ons omgegaan hebben al de tijd waarin de Heere Jezus onder ons in- en uitgegaan is,", "Jer 18:19": "HEERE, luister naar mij, en hoor naar de stem van hen die met mij twisten.", "1 Tim 5:23": "Drink niet langer alleen water, maar gebruik een beetje wijn, voor uw maag en uw veelvuldige zwakheden.", "Jer 21:6": "En Ik zal de inwoners van deze stad slaan, zowel de mensen als de dieren; door een grote pest zullen zij sterven.", "Jes 28:8": "Want alle tafels zijn vol uitspuwsel en drek, zodat er geen schone plaats is.", "Spr 28:13": "Wie zijn overtredingen bedekt, zal geen voorspoed hebben; maar wie ze belijdt en laat, zal barmhartigheid ontvangen.", "Ps 77:8-10": "Zal de Heere dan voor eeuwig verstoten, en voortaan niet meer goedgunstig zijn? Houdt Zijn goedertierenheid voor eeuwig op? Heeft de toezegging een einde, van geslacht tot geslacht? Heeft God vergeten genadig te zijn? Heeft Hij Zijn barmhartigheden door toorn toegesloten? Sela.", "Deut 31:11-13": "wanneer heel Israël zal komen om te verschijnen voor het aangezicht van de HEERE, uw God, op de plaats die Hij zal uitkiezen, zult u deze wet voorlezen voor heel Israël, ten aanhoren van hen; verzamel het volk, de mannen, en de vrouwen, en de kinderen, en uw vreemdelingen die in uw poorten zijn; opdat zij horen, en opdat zij leren, en de HEERE, uw God, vrezen, en nauwlettend doen alle woorden van deze wet. En opdat hun kinderen, die het niet geweten hebben, horen en leren, om de HEERE, uw God, te vrezen, alle dagen dat u leeft op het land waarheen u de Jordaan overtrekt om het te erven.", "Ps 119:84": "Hoeveel zullen de dagen van Uw knecht zijn? Wanneer zult U recht doen over mijn vervolgers?", "2 Kor 12:15": "En ik zal zeer graag de kosten dragen, en voor uw zielen ten koste gegeven worden; hoewel ik, terwijl ik u overvloediger liefheb, minder bemind word.", "Job 22:23": "Als u zich bekeert tot de Almachtige, zult u gebouwd worden; doe het onrecht ver van uw tenten.", "Jer 5:17": "En het zal uw oogst en uw brood opeten, dat uw zonen en uw dochters zouden eten; het zal uw schapen en uw runderen opeten; het zal uw wijnstok en uw vijgenboom opeten; uw vaste steden, waarop u vertrouwt, zal het arm maken door het zwaard.", "Jer 6:26": "O dochter van Mijn volk! Gord een zak aan, en wentel u in de as, bedrijf rouw als om een enige zoon, een zeer bitter misbaar; want de verstoorder zal ons snel overkomen.", "Hand 2:16": "Maar dit is wat gesproken is door de profeet Joël:", "Jes 14:27": "Want de HEERE van de heerscharen heeft het in Zijn raad besloten, wie zal het dan verbreken? en Zijn hand is uitgestrekt, wie zal die dan keren?", "Openb 6:5-8": "En toen Het het derde zegel geopend had, hoorde ik het derde dier zeggen: Kom en zie! En ik zag, en zie, een zwart paard, en die daarop zat, had een weegschaal in zijn hand. En ik hoorde een stem in het midden van de vier dieren, die zei: Een maatje tarwe voor een penning, en drie maatjes gerst voor een penning; en beschadig de olie en de wijn niet. En toen Het het vierde zegel geopend had, hoorde ik een stem van het vierde dier, die zei: Kom en zie!", "Matt 6:26": "Kijk naar de vogels van de hemel: zij zaaien niet, maaien niet, en verzamelen niet in schuren; en uw hemelse Vader voedt ze toch. Gaat u ze niet ver te boven?", "2 Petr 1:21": "Want de profetie is vroeger nooit voortgebracht door de wil van een mens, maar de heilige mensen van God hebben gesproken, gedreven door de Heilige Geest.", "Ezech 33:19": "En als de goddeloze zich bekeert van zijn goddeloosheid, en recht en gerechtigheid doet, zal hij daardoor leven.", "Ps 89:40-52": "Gij hebt het verbond van Uw knecht teniet gedaan; Gij hebt zijn kroon ontheiligd tegen de aarde. Gij hebt al zijn muren doorgebroken; Gij hebt zijn vestingen neergeworpen. Allen die de weg voorbijgingen, hebben hem beroofd; voor zijn naburen is hij tot een smaad geweest.", "2 Kron 6:36-39": "Wanneer zij tegen U gezondigd zullen hebben (want er is geen mens die niet zondigt), en U tegen hen vertoornd zult zijn, en hen zult overleveren aan de vijand, zodat degenen die hen gevangen hebben, hen gevankelijk wegvoeren naar een land dat ver weg of nabij is; En zij in het land waar zij gevankelijk weggevoerd zijn, tot inkeer komen, en zich bekeren, en tot U smeken in het land van hun gevangenschap, en zeggen: Wij hebben gezondigd, verkeerd gedaan, en goddeloos gehandeld; En zij zich tot U bekeren, met hun gehele hart en met hun gehele ziel, in het land van hun gevangenschap, waarheen zij hen gevankelijk weggevoerd hebben, en bidden zullen in de richting van hun land, dat U hun vaderen gegeven hebt, en naar deze stad die U verkoren hebt, en naar dit huis dat ik voor Uw Naam gebouwd heb;", "Matt 10:7": "En terwijl u heengaat, predikt en zeg: Het Koninkrijk der hemelen is nabijgekomen.", "1 Tess 2:4-8": "maar zoals wij door God beproefd zijn, zodat ons het Evangelie toevertrouwd zou worden, zo spreken wij, niet om mensen te behagen, maar God, Die onze harten beproeft. Want wij hebben nooit met woorden gepluimstrijkt, zoals u weet, en ook niet met enig voorwendsel van hebzucht; God is getuige! Wij hebben ook geen eer gezocht bij mensen, niet bij u, en ook niet bij anderen; hoewel wij u tot last hadden kunnen zijn als apostelen van Christus;", "Nahum 1:15": "Zie op de bergen de voeten van hem die het goede nieuws brengt, die vrede laat horen; vier uw feestdagen, o Juda! Betaal uw geloften; want de man van Belial zal voortaan niet meer door u heen gaan, hij is helemaal uitgeroeid.", "2 Sam 21:10": "Toen nam Rizpa, de dochter van Aja, een rouwkleed, en spande dit voor zich uit op een rotssteen, vanaf het begin van de oogst, totdat er water op hen drupte uit de hemel; en zij liet het gevogelte van de hemel overdag niet op hen rusten, en het gedierte van het veld 's nachts ook niet.", "2 Kor 8:23": "Hetzij dan Titus, hij is mijn metgezel en medearbeider bij u; hetzij onze broeders, zij zijn afgezanten van de gemeenten, en een eer van Christus.", "2 Kor 4:2": "Maar wij hebben de bedekselen der schande verworpen, en wandelen niet in arglistigheid, en vervalsen ook het Woord van God niet, maar door openbaring van de waarheid maken wij onszelf aangenaam bij ieder geweten van de mensen, in de tegenwoordigheid van God.", "Luk 24:47": "En in Zijn Naam moesten bekering en vergeving van de zonden gepredikt worden onder alle volken, te beginnen bij Jeruzalem.", "Jes 16:9": "Daarom beween ik, met de wening over Jaezer, de wijnstok van Sibma; ik maak u doornat met mijn tranen, o Hesbon en Eleale! Want het vreugdegeroep over uw zomervruchten en over uw oogst is verstomd;", "2 Kron 20:4": "En Juda kwam bijeen om hulp te zoeken bij de HEERE; ook kwamen zij uit alle steden van Juda om de HEERE te zoeken.", "Ps 40:14": "Het behaagt U, HEERE! mij te verlossen; HEERE! haast U tot mijn hulp.", "Ps 52:10": "Maar ik zal zijn als een groene olijfboom in Gods huis; ik vertrouw op Gods goedertierenheid eeuwig en altijd.", "Luk 19:41-44": "En toen Hij dichtbij kwam en de stad zag, weende Hij over haar, en zei: Och, had u ook maar geweten, ook nog op deze dag van u, wat tot uw vrede dient! Maar nu is het verborgen voor uw ogen. Want er zullen dagen over u komen, dat uw vijanden een wal rondom u zullen opwerpen, en u zullen omsingelen, en u van alle kanten in het nauw drijven;", "Hagg 2:20": "Is er nog zaad in de schuur? Zelfs de wijnstok, en de vijgenboom, en de granaatappelboom, en de olijfboom, die niet gedragen hebben, die zal Ik vanaf deze dag zegenen.", "Ef 3:8-10": "Aan mij, de allerminste van al de heiligen, is deze genade gegeven, om onder de heidenen door het Evangelie de onnaspeurlijke rijkdom van Christus te verkondigen, en allen te verlichten, zodat zij mogen verstaan wat de gemeenschap van de verborgenheid is, die vanaf alle eeuwen verborgen is geweest in God, Die alle dingen geschapen heeft door Jezus Christus; opdat nu, door de Gemeente, aan de overheden en de machten in de hemel de veelvuldige wijsheid van God bekendgemaakt wordt;", "Mark 6:12": "En zij gingen uit, en predikten dat de mensen zich moesten bekeren.", "Amos 5:16-18": "Daarom, zo zegt de HEERE, de God van de heerscharen, de Heere: Op alle straten zal rouwklacht zijn, en in alle wijken zullen zij zeggen: Och! Och! en zij zullen de landbouwer roepen om te treuren, en rouwklacht zal zijn bij hen die verstand van klagen hebben. Ja, in alle wijngaarden zal rouwklacht zijn; want Ik zal door uw midden trekken, zegt de HEERE. Wee hen die de dag van de HEERE verlangen! Waartoe toch zal de dag van de HEERE u zijn? Hij zal duisternis zijn en geen licht.", "Jer 4:1-4": "Als u zich zult bekeren, Israël! spreekt de HEERE, bekeer u tot Mij; en als u uw afschuwelijke afgoden van Mijn aangezicht zult wegdoen, dwaal dan niet meer rond. Maar zweer: Zo waarachtig als de HEERE leeft! in waarheid, in recht en in gerechtigheid; dan zullen de heidenvolken zich in Hem zegenen, en zich in Hem beroemen. Want zo zegt de HEERE tegen de mannen van Juda en tegen Jeruzalem: Braak voor uzelf een braakland, en zaai niet onder de doornen.", "Deut 21:20": "En zij zullen tegen de oudsten van zijn stad zeggen: Deze zoon van ons is koppig en opstandig, hij wil niet naar ons luisteren; hij is een brasser en een dronkaard.", "Neh 4:5": "Dek hun ongerechtigheid niet toe, en laat hun zonde niet uitgewist worden van voor Uw aangezicht, want zij hebben U getergd, tegenover de bouwers.", "Ps 83:2-19": "O God! Zwijg niet, houd U niet doof, en blijf niet stil, o God! Want zie, Uw vijanden maken misbaar, en Uw haters steken het hoofd op. Zij maken listig een heimelijk plan tegen Uw volk, en spannen samen tegen wie U verborgen houdt.", "1 Petr 4:17": "Want het is de tijd dat het oordeel moet beginnen bij het huis van God; en als het eerst bij ons begint, wat zal dan het einde zijn van hen die het Evangelie van God ongehoorzaam zijn?", "Jer 9:17-19": "Zo zegt de HEERE van de heerscharen: Let hierop, en roept klaagvrouwen, dat zij komen; en zendt heen naar de wijze vrouwen, dat zij komen. En zich haasten, en een klaagzang over ons aanheffen, zodat onze ogen van tranen neerdalen, en onze oogleden van water druipen. Want er is een stem van weeklacht gehoord uit Sion: Hoe zijn wij verwoest! Wij zijn zeer beschaamd, omdat wij het land hebben verlaten, omdat zij onze woningen hebben omgeworpen.", "Ps 119:77": "Laat mij Uw barmhartigheden overkomen, opdat ik leve, want Uw wet is al mijn vermaking.", "Tit 1:6": "Als iemand onberispelijk is, de man van één vrouw, gelovige kinderen heeft, die niet te beschuldigen zijn van overdaad, of ongehoorzaam zijn.", "Joël 3:3": "En zij hebben het lot geworpen over Mijn volk, en een jongetje gegeven voor een hoer, en een meisje verkocht voor wijn, om die te drinken.", "Jer 1:2": "Tot wie het woord van de HEERE kwam, in de dagen van Josia, zoon van Amon, koning van Juda, in het dertiende jaar van zijn regering.", "Ps 27:12": "Geef mij niet over in de begeerte van mijn tegenstanders; want valse getuigen zijn tegen mij opgestaan, alsook wie geweld uitblaast.", "Dan 6:11": "Toen Daniël nu begreep dat dit geschrift ondertekend was, ging hij naar zijn huis (hij had namelijk in zijn bovenzaal open vensters in de richting van Jeruzalem), en hij knielde drie keer per dag op zijn knieën, en hij bad, en dankte voor het aangezicht van zijn God, geheel zoals hij hiervoor gedaan had.", "Deut 11:18-21": "Leg dan deze mijn woorden in uw hart, en in uw ziel, en bind ze tot een teken op uw hand, dat zij tot voorhoofdsbanden zijn tussen uw ogen; En leer ze uw kinderen, en spreek erover, als u in uw huis zit, en als u onderweg gaat, en als u neerligt, en als u opstaat; En schrijf ze op de posten van uw huis, en aan uw poorten;", "Jer 26:3": "Misschien zullen zij horen, en zich bekeren, ieder van zijn boze weg; zo zou Ik berouw hebben over het kwaad dat Ik hun denk te doen vanwege de boosheid van hun daden.", "Joël 1:17-20": "De granen zijn onder hun kluiten verrot, de schathuizen zijn verwoest, de schuren zijn afgebroken, want het koren is verdord. O, hoe zucht het vee, de runderkudden zijn bedwelmd, want zij hebben geen weide, ook zijn de schaapskudden verwoest. Tot U, HEERE, roep ik; want een vuur heeft de weiden van de woestijn verteerd, en een vlam heeft alle bomen van het veld aangestoken.", "Joël 1:5-9": "Word wakker, dronkaards! En huil, en jammer, alle wijnzuipers! Om de nieuwe wijn, omdat hij van uw mond is afgesneden. Want een volk is opgekomen over mijn land, machtig en zonder getal; zijn tanden zijn leeuwentanden, en het heeft baktanden van een oude leeuw. Het heeft mijn wijnstok gesteld tot een verwoesting, en mijn vijgenboom tot schuim; het heeft hem helemaal ontbloot en neergeworpen, zijn ranken zijn wit geworden.", "Joh 21:15-17": "Toen zij dan de maaltijd gehouden hadden, zei Jezus tegen Simon Petrus: Simon, zoon van Jonas, hebt u Mij meer lief dan dezen? Hij zei tegen Hem: Ja, Heere! U weet dat ik U liefheb. Hij zei tegen hem: Weid Mijn lammeren. Hij zei opnieuw tegen hem, voor de tweede keer: Simon, zoon van Jonas, hebt u Mij lief? Hij zei tegen Hem: Ja, Heere, U weet dat ik U liefheb. Hij zei tegen hem: Hoed Mijn schapen. Hij zei tegen hem voor de derde keer: Simon, zoon van Jonas, hebt u Mij lief? Petrus werd bedroefd, omdat Hij voor de derde keer tegen hem zei: Hebt u Mij lief? en hij zei tegen Hem: Heere! U weet alle dingen, U weet dat ik U liefheb. Jezus zei tegen hem: Weid Mijn schapen.", "Luk 15:1-10": "En alle tollenaars en zondaars kwamen naar Hem toe, om Hem te horen. En de Farizeeën en de Schriftgeleerden mopperden en zeiden: Deze man ontvangt de zondaars, en eet met hen. En Hij sprak deze gelijkenis tegen hen, en zei:", "Ezech 30:2": "Mensenkind! Profeteer, en zeg: Zo zegt de Heere HEERE: Huil: Ach, die dag!", "Amos 4:1": "Hoor dit woord, koeien van Basan, u die op de berg van Samaria bent, die de armen verdrukt, die de behoeftigen verplettert; u die tegen uw heren zegt: Breng aan, opdat wij drinken.", "Jer 9:12": "Wie is de wijze man, die dit begrijpt? En tot wie heeft de mond van de HEERE gesproken, dat hij het verkondigt, waarom het land vergaat en afgebrand is als een woestijn, zodat er niemand doorgaat?", "Joël 2:24": "En de dorsvloeren zullen vol koren zijn, en de perskuipen zullen overlopen van most en olie.", "Matt 9:13": "Ga heen en leer wat dit betekent: Ik wil barmhartigheid, en geen offerande; want Ik ben niet gekomen om rechtvaardigen te roepen, maar zondaars, tot bekering.", "1 Kon 20:32": "Toen gordden zij rouwgewaad om hun lenden, en koorden om hun hoofden, en kwamen naar de koning van Israël, en zeiden: Uw knecht Benhadad zegt: Laat toch mijn leven gespaard blijven. En hij zei: Leeft hij dan nog? Hij is mijn broeder.", "Ps 40:18": "Ik ben wel ellendig en nooddruftig, maar de Heere denkt aan mij; Gij zijt mijn Hulp en mijn Bevrijder; o mijn God! wacht niet langer.", "Ps 142:3": "Ik stortte mijn klacht uit voor Zijn aangezicht; ik maakte voor Zijn aangezicht mijn benauwdheid bekend.", "Ex 13:8-10": "En u moet uw zoon op die dag laten weten en zeggen: Dit doe ik om wat de HEERE mij gedaan heeft, toen ik uit Egypte uittrok. En het zal u zijn tot een teken op uw hand, en tot een gedachtenis tussen uw ogen, opdat de wet van de HEERE in uw mond is, omdat de HEERE u door een sterke hand uit Egypte uitgevoerd heeft. Houd daarom deze inzetting op de vastgestelde tijd, van jaar tot jaar.", "Mal 4:6": "En hij zal het hart van de vaders terugbrengen tot de kinderen, en het hart van de kinderen tot hun vaders, zodat Ik niet hoef te komen en de aarde met de ban sla.", "Spr 3:10": "Zo zullen uw schuren met overvloed gevuld worden, en uw perskuipen van most overlopen.", "Ps 43:4": "En dat ik inga tot Gods altaar, tot de God van de blijdschap van mijn verheuging, en U met de harp loof, o God, mijn God!", "Job 13:21": "Doe Uw hand ver van mij weg, en laat Uw verschrikking mij niet verbaasd maken.", "Ps 35:22": "HEERE! U hebt het gezien, zwijg niet; Heere! Wees niet ver van mij.", "Jer 13:16": "Geeft eer aan de HEERE, uw God, voor Hij het duister maakt, en voor uw voeten zich stoten aan de schemerende bergen; terwijl u naar licht uitkijkt, en Hij dat tot een schaduw van de dood maakt, en tot diepe duisternis zet.", "Ps 77:2": "Mijn stem is tot God, en ik roep; mijn stem is tot God, en Hij zal het oor tot mij neigen.", "2 Sam 12:16": "En David zocht God voor dat jongetje; en David vastte een vasten, en ging naar binnen, en lag heel de nacht op de aarde.", "Spr 9:6": "Verlaat de dwaasheden, en leef; en treed in de weg van het verstand.", "Ps 39:14": "Wend U van mij af, dat ik verkwikt word, voordat ik heenga, en er niet meer ben.", "Ps 106:47": "Verlos ons, HEERE, onze God! en verzamel ons uit de heidenen, opdat wij de Naam van Uw heiligheid loven, ons beroemend in Uw lof.", "Zach 1:3": "Daarom zeg tegen hen: Zo zegt de HEERE van de heerscharen: Keer terug tot Mij, spreekt de HEERE van de heerscharen, zo zal Ik weer tot u terugkeren, zegt de HEERE van de heerscharen.", "Deut 4:32-35": "Want vraag toch naar de vorige dagen, die vóór u geweest zijn, vanaf de dag dat God de mens op de aarde geschapen heeft, van het ene einde van de hemel tot aan het andere einde van de hemel, of er ooit zo'n groot ding gebeurd of gehoord is als dit: Of een volk ooit de stem van God gehoord heeft, sprekend uit het midden van het vuur, zoals u gehoord hebt, en in leven is gebleven? Of: of God ooit beproefd heeft te gaan om Zich een volk uit het midden van een ander volk aan te nemen, door beproevingen, door tekenen, en door wonderen, en door strijd, en door een sterke hand, en door een uitgestrekte arm, en met grote verschrikkingen; naar alles wat de HEERE, uw God, voor u in Egypte voor uw ogen gedaan heeft?", "Matt 28:19": "Ga dan heen, onderwijs alle volken, en doop hen in de Naam van de Vader, en van de Zoon, en van de Heilige Geest;", "Ezra 7:23": "Alles wat naar het bevel van de God van de hemel is, dat dat vlijtig gedaan wordt, voor het huis van de God van de hemel; want waartoe zou er grote toorn zijn over het koninkrijk van de koning en zijn kinderen?", "Deut 30:1-3": "Verder zal het gebeuren, wanneer al deze dingen over u gekomen zijn, deze zegen of deze vloek, die ik u voorgesteld heb; zo zult u het weer ter harte nemen, onder alle volken, waarheen de HEERE, uw God, u gedreven heeft; En u zult zich bekeren tot de HEERE, uw God, en Zijn stem gehoorzaam zijn, naar alles wat ik u heden gebied, u en uw kinderen, met uw ganse hart en met uw ganse ziel. En de HEERE, uw God, zal uw gevangenschap wenden, en Zich over u ontfermen; en Hij zal u weer bijeenbrengen uit al de volken waarheen de HEERE, uw God, u verstrooid had.", "Hos 4:3": "Daarom zal het land treuren, en ieder die daarin woont, kwijnen weg, met de dieren van het veld, en met de vogels van de hemel; ja, ook de vissen van de zee zullen weggeraapt worden.", "Matt 17:21": "Maar dit soort gaat niet weg dan door bidden en vasten.", "Ps 6:2-8": "O HEERE, straf mij niet in Uw toorn, en tuchtig mij niet in Uw grimmigheid! Wees mij genadig, HEERE, want ik ben verzwakt; genees mij, HEERE, want mijn beenderen zijn verschrikt. Ja, mijn ziel is zeer verschrikt; en U, HEERE, hoe lang nog?", "Rom 12:3-8": "Want door de genade die mij gegeven is, zeg ik ieder die onder u is, dat hij niet meer van zichzelf moet denken dan hij behoort te denken; maar dat hij bescheiden moet denken, zoals God ieder de mate van het geloof heeft toebedeeld. Want zoals wij in één lichaam veel leden hebben, en de leden niet allemaal dezelfde functie hebben, zo zijn wij, hoewel velen, één lichaam in Christus, maar ieder afzonderlijk zijn wij elkaars leden.", "Jes 14:26": "Dit is de raadslag, die beraadslaagd is over dat hele land; en dit is de hand, die uitgestrekt is over alle volken.", "Joël 1:13-15": "Omgord u, en rouwklaag, priesters! Huil, dienaars van het altaar! Ga naar binnen, overnacht in zakken, dienaars van mijn God! Want spijsoffer en drankoffer is geweerd van het huis van uw God. Heilig een vasten, roep een verbodsdag uit, verzamel de oudsten, en alle inwoners van dit land, naar het huis van de HEERE, uw God, en roep tot de HEERE. Ach, die dag! Want de dag van de HEERE is nabij, en zal als een verwoesting komen van de Almachtige.", "Ps 80:2": "O Herder van Israël! Neem het ter oor, U Die Jozef als schapen leidde; U Die tussen de cherubs zit, verschijn blinkend.", "Matt 24:7": "Want het ene volk zal tegen het andere volk opstaan, en het ene koninkrijk tegen het andere koninkrijk; en er zullen hongersnoden zijn, en pestilentiën, en aardbevingen op verschillende plaatsen.", "Ps 107:34": "Het vruchtbare land tot zoute grond, om de boosheid van hen die daarin wonen.", "Jer 10:24": "Kastijd mij, HEERE! doch met mate; niet in Uw toorn, opdat U mij niet te niet maakt.", "Ps 119:154": "Twist mijn twistzaak, en verlos mij, maak mij levend, naar Uw toezegging.", "Deut 29:10": "U staat heden allen voor het aangezicht van de HEERE, uw God: uw hoofden van uw stammen, uw oudsten, en uw
