 is uitgeput.","11":"De akkerlieden zijn beschaamd, de wijngaardeniers huilen, om de tarwe en om de gerst, want de oogst van het veld is vergaan.","12":"De wijnstok is verdord, de vijgenboom is uitgeput; de granaatappelboom, ook de palmboom en appelboom; alle bomen van het veld zijn verdord; ja, de vrolijkheid is verdord van de mensenkinderen.","13":"Omgord u, en rouwklaag, priesters! Huil, dienaars van het altaar! Ga naar binnen, overnacht in zakken, dienaars van mijn God! Want spijsoffer en drankoffer is geweerd van het huis van uw God.","14":"Heilig een vasten, roep een verbodsdag uit, verzamel de oudsten, en alle inwoners van dit land, *naar* het huis van de HEERE, uw God, en roep tot de HEERE.","15":"Ach, die dag! Want de dag van de HEERE is nabij, en zal als een verwoesting komen van de Almachtige.","16":"Is niet het voedsel voor onze ogen afgesneden? Blijdschap en verheuging van het huis van onze God?","17":"De granen zijn onder hun kluiten verrot, de schathuizen zijn verwoest, de schuren zijn afgebroken, want het koren is verdord.","18":"O, hoe zucht het vee, de runderkudden zijn bedwelmd, want zij hebben geen weide, ook zijn de schaapskudden verwoest.","19":"Tot U, HEERE, roep ik; want een vuur heeft de weiden van de woestijn verteerd, en een vlam heeft alle bomen van het veld aangestoken.","20":"Ook schreeuwt elk beest van het veld tot U; want de waterstromen zijn uitgedroogd, en een vuur heeft de weiden van de woestijn verteerd."},"SV":{"1":"Het woord des HEEREN, dat geschied is tot Joël, den zoon van Pethuël:","2":"Hoort dit, gij oudsten! en neemt ter oren, alle inwoners des lands! Is dit geschied in uw dagen, of ook in de dagen uwer vaderen?","3":"Vertelt uw kinderen daarvan, en *laat* *het* uw kinderen hun kinderen *vertellen*, en derzelver kinderen aan een ander geslacht.","4":"Wat de rups heeft overgelaten, heeft de sprinkhaan afgegeten, en wat de sprinkhaan heeft overgelaten, heeft de kever afgegeten, en wat de kever heeft overgelaten, heeft de kruidworm afgegeten.","5":"Waakt op, gij dronkenen! en weent, en huilt, alle gij wijnzuipers! om den nieuwen wijn, dewijl hij van uw mond is afgesneden.","6":"Want een volk is opgekomen over mijn land, machtig en zonder getal; zijn tanden zijn leeuwentanden, en het heeft baktanden eens ouden leeuws.","7":"Het heeft mijn wijnstok gesteld tot een verwoesting, en mijn vijgeboom tot schuim; het heeft hem ganselijk ontbloot en nedergeworpen, zijn ranken zijn wit geworden.","8":"Kermt, als een jonkvrouw, die met een zak omgord is vanwege den man van haar jeugd.","9":"Spijsoffer en drankoffer is van het huis des HEEREN afgesneden; de priesters, des HEEREN dienaars, treuren.","10":"Het veld is verwoest, het land treurt; want het koren is verwoest, de most is verdroogd, de olie is flauw.","11":"De akkerlieden zijn beschaamd, de wijngaardeniers huilen, om de tarwe en om de gerst, want de oogst des velds is vergaan.","12":"De wijnstok is verdord, de vijgeboom is flauw; de granaatappelboom, ook de palmboom en appelboom; alle bomen des velds zijn verdord; ja de vrolijkheid is verdord van de mensenkinderen.","13":"Omgordt u, en rouwklaagt, gij priesters! huilt, gij dienaars des altaars! gaat in, vernacht in zakken, gij dienaars mijns Gods! want spijsoffer en drankoffer is geweerd van het huis uws Gods.","14":"Heiligt een vasten, roept een verbodsdag uit, verzamelt de oudsten, en alle inwoners dezes lands, *ten* huize des HEEREN, uws Gods, en roept tot den HEERE.","15":"Ach, die dag! want de dag des HEEREN is nabij, en zal als een verwoesting komen van den Almachtige.","16":"Is niet de spijze voor onze ogen afgesneden? Blijdschap en verheuging van het huis onzes Gods?","17":"De granen zijn onder hun kluiten verrot, de schathuizen zijn verwoest, de schuren zijn afgebroken, want het koren is verdord.","18":"O, hoe zucht het vee, de runderkudden zijn bedwelmd, want zij hebben geen weide, ook zijn de schaapskudden verwoest.","19":"Tot U, o HEERE! roep ik; want een vuur heeft de weiden der woestijn verteerd, en een vlam heeft alle bomen des velds aangestoken.","20":"Ook schreeuwt elk beest des velds tot U; want de waterstromen zijn uitgedroogd, en een vuur heeft de weiden der woestijn verteerd."},"KJV":{"1":"The word of the LORD that came to Joel the son of Pethuel.","2":"Hear this, ye old men, and give ear, all ye inhabitants of the land. Hath this been in your days, or even in the days of your fathers?","3":"Tell ye your children of it, and *let* your children *tell* their children, and their children another generation.","4":"That which the palmerworm hath left hath the locust eaten; and that which the locust hath left hath the cankerworm eaten; and that which the cankerworm hath left hath the caterpiller eaten.","5":"Awake, ye drunkards, and weep; and howl, all ye drinkers of wine, because of the new wine; for it is cut off from your mouth.","6":"For a nation is come up upon my land, strong, and without number, whose teeth *are* the teeth of a lion, and he hath the cheek teeth of a great lion.","7":"He hath laid my vine waste, and barked my fig tree: he hath made it clean bare, and cast *it* away; the branches thereof are made white.","8":"Lament like a virgin girded with sackcloth for the husband of her youth.","9":"The meat offering and the drink offering is cut off from the house of the LORD; the priests, the LORD'S ministers, mourn.","10":"The field is wasted, the land mourneth; for the corn is wasted: the new wine is dried up, the oil languisheth.","11":"Be ye ashamed, O ye husbandmen; howl, O ye vinedressers, for the wheat and for the barley; because the harvest of the field is perished.","12":"The vine is dried up, and the fig tree languisheth; the pomegranate tree, the palm tree also, and the apple tree, *even* all the trees of the field, are withered: because joy is withered away from the sons of men.","13":"Gird yourselves, and lament, ye priests: howl, ye ministers of the altar: come, lie all night in sackcloth, ye ministers of my God: for the meat offering and the drink offering is withholden from the house of your God.","14":"Sanctify ye a fast, call a solemn assembly, gather the elders *and* all the inhabitants of the land *into* the house of the LORD your God, and cry unto the LORD,","15":"Alas for the day! for the day of the LORD *is* at hand, and as a destruction from the Almighty shall it come.","16":"Is not the meat cut off before our eyes, *yea*, joy and gladness from the house of our God?","17":"The seed is rotten under their clods, the garners are laid desolate, the barns are broken down; for the corn is withered.","18":"How do the beasts groan! the herds of cattle are perplexed, because they have no pasture; yea, the flocks of sheep are made desolate.","19":"O LORD, to thee will I cry: for the fire hath devoured the pastures of the wilderness, and the flame hath burned all the trees of the field.","20":"The beasts of the field cry also unto thee: for the rivers of waters are dried up, and the fire hath devoured the pastures of the wilderness."}},"tsk":{"1":[{"kopje":"woord","refs":["Jer 1:2","Ezech 1:3","Hos 1:1","2 Petr 1:21"]},{"kopje":"tot","refs":["Hand 2:16"]}],"2":[{"kopje":"Hoor","refs":["Ps 49:2","Jes 34:1","Jer 5:21","Hos 5:1","Amos 3:1","Amos 4:1","Amos 5:1","Micha 1:2","Micha 3:1","Micha 3:9","Matt 13:9","Openb 2:7"]},{"kopje":"oudsten","refs":["Job 8:8","Job 12:12","Job 15:10","Job 21:7"]},{"kopje":"Is","refs":["Joël 2:2","Deut 4:32-35","Jes 7:17","Jer 30:7","Dan 12:1","Matt 24:21"]}],"4":[{"kopje":"Wat de rups heeft overgelaten","refs":["Joël 2:25","Amos 4:9","Ex 10:4"]},{"kopje":"de sprinkhaan afgegeten","refs":["Ex 10:12-15","Deut 28:38","Deut 28:42","1 Kon 8:37","2 Kron 6:28","2 Kron 7:13","Ps 78:46","Ps 105:34","Amos 7:1","Openb 9:3-7"]},{"kopje":"de kever afgegeten","refs":["Nahum 3:15-17"]},{"kopje":"de kruidworm","refs":["Jes 33:4","Jer 51:14","Jer 51:27"]}],"5":[{"kopje":"Word wakker","refs":["Jes 24:7-11","Amos 6:3-7","Luk 21:34-36","Rom 13:11-14"]},{"kopje":"hui e LORD,","15":"<span class=\"wl wl-kjv\" data-code=\"H162\">Alas</span> for the <span class=\"wl wl-kjv\" data-code=\"H3117\">day!</span> for the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> is at <span class=\"wl wl-kjv\" data-code=\"H7138\">hand,</span> and as a <span class=\"wl wl-kjv\" data-code=\"H7701\">destruction</span> from the <span class=\"wl wl-kjv\" data-code=\"H7706\">Almighty</span> shall it come.","16":"Is not the <span class=\"wl wl-kjv\" data-code=\"H400\">meat</span> cut <span class=\"wl wl-kjv\" data-code=\"H3772\">off</span> before our <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes,</span> yea, <span class=\"wl wl-kjv\" data-code=\"H8057\">joy</span> and <span class=\"wl wl-kjv\" data-code=\"H1524\">gladness</span> from the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of our God?","17":"The <span class=\"wl wl-kjv\" data-code=\"H6507\">seed</span> is <span class=\"wl wl-kjv\" data-code=\"H5685\">rotten</span> under their <span class=\"wl wl-kjv\" data-code=\"H4053\">clods,</span> the <span class=\"wl wl-kjv\" data-code=\"H214\">garners</span> are laid <span class=\"wl wl-kjv\" data-code=\"H8074\">desolate,</span> the <span class=\"wl wl-kjv\" data-code=\"H4460\">barns</span> are broken <span class=\"wl wl-kjv\" data-code=\"H2040\">down;</span> for the <span class=\"wl wl-kjv\" data-code=\"H1715\">corn</span> is withered.","18":"How do the <span class=\"wl wl-kjv\" data-code=\"H929\">beasts</span> <span class=\"wl wl-kjv\" data-code=\"H584\">groan!</span> the <span class=\"wl wl-kjv\" data-code=\"H5739\">herds</span> of <span class=\"wl wl-kjv\" data-code=\"H1241\">cattle</span> are <span class=\"wl wl-kjv\" data-code=\"H943\">perplexed,</span> because they have no <span class=\"wl wl-kjv\" data-code=\"H4829\">pasture;</span> yea, the <span class=\"wl wl-kjv\" data-code=\"H5739\">flocks</span> of <span class=\"wl wl-kjv\" data-code=\"H6629\">sheep</span> are made desolate.","19":"O <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> to thee will I <span class=\"wl wl-kjv\" data-code=\"H7121\">cry:</span> for the <span class=\"wl wl-kjv\" data-code=\"H784\">fire</span> hath <span class=\"wl wl-kjv\" data-code=\"H398\">devoured</span> the <span class=\"wl wl-kjv\" data-code=\"H4999\">pastures</span> of the <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3852\">flame</span> hath <span class=\"wl wl-kjv\" data-code=\"H3857\">burned</span> all the <span class=\"wl wl-kjv\" data-code=\"H6086\">trees</span> of the field.","20":"The <span class=\"wl wl-kjv\" data-code=\"H929\">beasts</span> of the <span class=\"wl wl-kjv\" data-code=\"H7704\">field</span> <span class=\"wl wl-kjv\" data-code=\"H6165\">cry</span> also unto thee: for the <span class=\"wl wl-kjv\" data-code=\"H650\">rivers</span> of <span class=\"wl wl-kjv\" data-code=\"H4325\">waters</span> are dried <span class=\"wl wl-kjv\" data-code=\"H3001\">up,</span> and the <span class=\"wl wl-kjv\" data-code=\"H784\">fire</span> hath <span class=\"wl wl-kjv\" data-code=\"H398\">devoured</span> the <span class=\"wl wl-kjv\" data-code=\"H4999\">pastures</span> of the wilderness."},"bijbeluitleg":{"kanttekeningen_nl":{"2":[{"catchword":"oudsten","tekst":"Die in Juda de regering hebt en ervarenheid van zaken en tijden; zie Exo 3:16 , en Lev 14:15 , met de aantekening. Of slechts, gij ouden van jaren, die meer beleefd hebt dan jongen of die van middelmatigen ouderdom zijn."},{"catchword":"dit geschied in uw dagen,","tekst":"Weet gij, gedenkt u, van zulk ene plaag, als in het volgende verhaald wordt?"},{"catchword":"vaderen?","tekst":"Exo 10:4-6 , Exo 10:14-15 , wordt ook van een gruwelijke plaag der sprinkhanen over de Egyptenaars verhaald, maar die duurde zo lang niet, en er waren zoveel soorten niet van dat vernielend gedierte als hier in het land van Juda, het een achter het ander; hoewel de verstoktheid van het volk zo groot was, dat zij weinig gevoel daarvan hadden tot bekering; waarom God hen door dezen profeet zoekt op te wekken, gelijk het volgende uitwijst."}],"3":[{"catchword":"Vertelt uw kinderen daarvan,","tekst":"Verg. Exo 10:2 ; Psa 78:4 , Psa 78:6 ."},{"catchword":"ander geslacht","tekst":"Dat is, het navolgende geslacht, of hunnen nakomelingen."}],"4":[{"catchword":"rups heeft overgelaten,","tekst":"Hebr. het ovurige der rups; en zo in het volgende. Wanneer deze verschrikkelijke en langdurige plagen van het ongedierte, vergezelschapt met grote droogte, Juda zijn overkomen, is onzeker. Eenigen passen het op den tijd van Elia en Elisa, of als Joram in Israël en Josafat in Juda regeerden. Zie 1Ki 17:1 , enz., en 2Ki 4:38 . Anderen vergelijken het met Jer 14:1 ; idem Amo 1:2 , en Amo 4:6-9 , enz. Sommigen menen dat door deze schadelijke dieren figuurlijk verstaan worden de Assyriërs en Chaldeën, die het land in de uiterste verwoesting zouden stellen. De profeet spreekt eensdeels in den verleden en tegenwoordigen tijd, anderdeels in den toekomenden; zie onder vs.15, en Joe 2:1 , enz., omdat deze plaag enige jaren geduurd heeft, onder Joe 2:25 . Doch sommigen menen dat dit oordeel nog toekomstig was, en dat de profeet profetischerwijze daarvan spreekt alsof het voor ogen ware."}],"5":[{"catchword":"hij van uw mond","tekst":"Doordien alle wijnstokken van het voorzeide gedierten ten enenmale bedorven waren, gelijk volgt in vs.7; verg. Amo 4:9 ."}],"6":[{"catchword":"volk is opgekomen","tekst":"Versta, de ontallijke menigte van de voorzeide gedierten, die God, om des volks zonden vertoornd zijnde, op zijn eigen heilig land zou laten komen, die oneigenlijk een volk, of natie genoemd worden; zie onder Joe 2:2 , en verg. Pro 30:25-26 , en zie de aantekening aldaar. Van Kanaän, dat God zijn land noemt, zie Hos 9:3 , met de aantekening, alzo ook Joe 2:18 ."},{"catchword":"tanden zijn leeuwentanden,","tekst":"Dit betekent dezer dieren gretigheid, vratigheid en sterkte. Verg. Rev 9:8-10 ."}],"7":[{"catchword":"Het heeft","tekst":"Voorts volk; dat is, dat boos gedierte."},{"catchword":"mijn wijnstok gesteld","tekst":"Verg. Hos 2:8 . Aldus spreekt God om te tonen dat Hij ook zijn eigen creaturen en gaven niet verschoont om de zonden der mensen te straffen."},{"catchword":"schuim;","tekst":"Dat is, hij vergaat, verdwijnt. Of, zwam. Anders: ontpelling, ontschorsing, zodat de schorsen of schellen afgegeten zijn, waardoor de vijgeboom als naakt en bloot en bleek wordt; verg. Isa 24:7 ."},{"catchword":"wit geworden","tekst":"Of, bleek; waar integendeel de sappige ranken groen en schoon zijn."}],"8":[{"catchword":"Kermt,","tekst":"O Jeruzalem."},{"catchword":"zak omgord is","tekst":"Zie Gen 37:34 ."},{"catchword":"man van haar jeugd","tekst":"Dat is, haren bruidegom, of jongen man [gelijk sommigen], die gestorven is terwijl zij met hem in ondertrouw stond, of kort daarna; dat is, rouwt, bitterlijk. Verg. Mal 2:14-15 ."}],"9":[{"catchword":"Spijsoffer en drankoffer","tekst":"Zie Exo 29:40 , en Lev 2:1 ; Num 15:5 , Num 15:7 , Num 15:10 , en Num 28:7 . De zin is: dat zulke offeranden zeer weinig gebracht werden ten huize des Heeren door gebrek van spijs en drank. Alzo ook in vs.13."},{"catchword":"treuren","tekst":"Omdat de godsdienst verlaten werd, en zij dienvolgens gebrek aan onderhoud hadden."}],"10":[{"catchword":"verdroogd,","tekst":"Dewijl de wijnstokken verdord en bedorven zijn. Anders: beschaamd, omdat hij zijne vrucht niet voortbrengt. Figuurlijk gesproken."},{"catchword":"flauw","tekst":"Gelijk de bomen gezegd worden flauw, krank, ziek te zijn, als zij niet dragen."}],"11":[{"catchword":"De akkerlieden zijn beschaamd,","tekst":"Of, zijt beschaamd, gij akkerlieden, huilt, gij wijngaardeniers."},{"catchword":"tarwe en om de gerst,","tekst":"Dit ziet op de akkerlieden, gelijk het volgende, van den wijnstok op de wijngaardeniers."}],"12":[{"catchword":"verdord,","tekst":"Of, beschaamd, gelijk vs.10."},{"catchword":"vrolijkheid","tekst":"Die er placht te wezen ten tijde van een goeden oogst. Zie Psa 4:8 ; Isa 16:10 ; Jer 48:33 ; Hos 9:1 , met de aantekening."},{"catchword":"verdord van de mensenkinderen","tekst":"Of, beschaamd onder, enz., als in het begin van dit vers. Dat is, gelijk het land gesteld is, alzo is het ook het hart der mensen, alles is droevig, droog en verward. De vrolijkheid durft [om zo te spreken] niet tevoorschijn komen, omdat het overal vol treuren is."}],"13":[{"catchword":"Omgordt u,","tekst":"Te weten, met zakken, tot teken van rouw, gelijk boven in vs.8, en hier terstond in de volgende woorden."},{"catchword":"spijsoffer en drankoffer","tekst":"Gelijk boven in vs.9."}],"14":[{"catchword":"Heiligt een vasten,","tekst":"Dat is, voorbereidende door een heilige betrachting van dit zwaar oordeel Gods, zo verordineert en stelt zekeren tijd aan, in welken gij samenkomende en u uitwendig en inwendig voor den Heere vernedert, uwe boetvaardigheid openlijk betuigt en hem om genade bidt. Alzo onder Joe 2:12 , Joe 2:15 ."},{"catchword":"verbodsdag uit,","tekst":"Zie Lev 23:36 ."},{"catchword":"oudsten,","tekst":"Dat is, regeerders; zie in vs.2."}],"15":[{"catchword":"Ach, die dag","tekst":"Deze en volgende woorden tot aan het einde van dit hoofdstuk, nemen sommigen als een voorschrift [het volk van God door den profeet voorgesteld] van een boetvaardige weeklacht tot God over de voorgemelde zware straf, in het einde van het voorgaande vers bijvoegende het woord [zeggende;]. Anderen houden het voor woorden van den profeet zelf, die met deze zijne klacht het volk voorgaat, om hen met zijn voorbeeld op te wekken en te bewegen tot hartelijke betrachting van dit oordeel Gods; beide in een goeden zin."},{"catchword":"dag des HEEREN","tekst":"Dat is, de bestemde tijd, waarin de Heere zijn volk wil straffen. Alzo in Joe 2:1-2 . Zie Psa 37:13 , en Eze 30:2 ."},{"catchword":"nabij,","tekst":"Uit deze woorden leiden sommigen af dat de voren beschreven straf nog toekomstig of aanstaande was /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');

    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');

  document.getElementById('hfdnav').innerHTML =

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers) => {

function bereaHtml(n) {

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
