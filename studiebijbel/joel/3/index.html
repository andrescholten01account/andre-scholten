t het gesproken.","9":"Roept dit uit onder de heidenvolken, wijdt een oorlog; wekt de helden op, laat ze naderen, laat alle krijgslieden optrekken.","10":"Smeedt uw ploegscharen tot zwaarden, en uw snoeimessen tot speren; laat de zwakke zeggen: Ik ben een held.","11":"Verzamel u en kom aan, alle volken van rondom, en verzamel u! (O HEERE, laat Uw helden daarheen neerdalen!)","12":"De heidenvolken zullen zich opmaken en optrekken naar het dal van Josafat; want daar zal Ik zitten om te richten alle heidenvolken van rondom.","13":"Sla de sikkel erin, want de oogst is rijp geworden; kom, daal af, want de pers is vol, en de perskuipen lopen over; want hun slechtheid is groot.","14":"Menigten, menigten in het dal van de beslissing; want de dag van de HEERE is nabij, in het dal van de beslissing.","15":"De zon en de maan zijn zwart geworden, en de sterren hebben hun glans ingetrokken.","16":"En de HEERE zal uit Sion brullen, en uit Jeruzalem Zijn stem geven, zodat hemel en aarde beven zullen; maar de HEERE zal de toevlucht van Zijn volk, en de sterkte van de kinderen van Israël zijn.","17":"En u zult weten dat Ik de HEERE, uw God, ben, die op Sion woont, Mijn heilige berg; en Jeruzalem zal heilig zijn, en vreemden zullen er niet meer doorheen trekken.","18":"En het zal op die dag gebeuren dat de bergen zullen druipen van zoete wijn, en de heuvels zullen stromen van melk, en alle stromen van Juda vol water zullen gaan; en er zal een bron uit het huis van de HEERE uitgaan, en die zal het dal van Sittim bewateren.","19":"Egypte zal tot een verwoesting worden, en Edom zal worden tot een woeste wildernis, om het geweld, gedaan aan de kinderen van Juda, in wier land zij onschuldig bloed vergoten hebben.","20":"Maar Juda zal blijven tot in eeuwigheid, en Jeruzalem van geslacht tot geslacht.","21":"En Ik zal hun bloed reinigen, dat Ik niet gereinigd had; en de HEERE zal wonen op Sion."},"SV":{"1":"Want ziet, in die dagen en te dier tijd, als Ik de gevangenis van Juda en Jeruzalem zal wenden ;","2":"Dan zal Ik alle heidenen vergaderen, en zal hen afvoeren in het dal van Josafat; en Ik zal met hen aldaar richten, vanwege Mijn volk en Mijn erfdeel Israël, dat zij onder de heidenen hebben verstrooid, en Mijn land gedeeld;","3":"En hebben het lot over Mijn volk geworpen en een knechtje gegeven om een hoer, en een meisje verkocht om wijn, dat zij mochten drinken.","4":"En ook, wat hebt gij met Mij te doen, gij Tyrus en Sidon, en alle grenzen van Palestina! Zoudt gij Mij een vergelding wedergeven? Maar zo gij Mij wilt vergelden, lichtelijk, haastelijk, zal Ik uw vergelding op uw hoofd wederbrengen.","5":"Omdat gij Mijn zilver en Mijn goud hebt weggenomen, en hebt Mijn beste kleinodiën in uw tempels gebracht.","6":"En gij hebt de kinderen van Juda en de kinderen van Jeruzalem verkocht aan de kinderen der Grieken, opdat gij hen verre van hun landpale mocht brengen.","7":"Ziet, Ik zal ze opwekken uit de plaats, waarhenen gij ze hebt verkocht; en Ik zal uw vergelding wederbrengen op uw hoofd.","8":"En Ik zal uw zonen en uw dochteren verkopen in de hand der kinderen van Juda, die ze verkopen zullen aan die van Scheba, aan een vergelegen volk; want de HEERE heeft het gesproken.","9":"Roept dit uit onder de heidenen, heiligt een krijg; wekt de helden op, laat naderen, laat optrekken alle krijgslieden.","10":"Slaat uw spaden tot zwaarden, en uw sikkelen tot spiesen; de zwakke zegge: Ik ben een held.","11":"Rot te hoop, en komt aan, alle gij volken van rondom, en vergadert u! (O HEERE, doe Uw helden derwaarts nederdalen!)","12":"De heidenen zullen zich opmaken, en optrekken naar het dal van Josafat; maar aldaar zal Ik zitten, om te richten alle heidenen van rondom.","13":"Slaat de sikkel aan, want de oogst is rijp geworden; komt aan, daalt henen af, want de pers is vol, en de perskuipen lopen over; want hunlieder boosheid is groot.","14":"Menigten, menigten in het dal des dorswagens; want de dag des HEEREN is nabij, in het dal des dorswagens.","15":"De zon en maan zijn zwart geworden, en de sterren hebben haar glans ingetrokken.","16":"En de HEERE zal uit Sion brullen, en uit Jeruzalem Zijn stem geven, dat hemel en aarde beven zullen; maar de HEERE zal de Toevlucht Zijns volks, en de Sterkte der kinderen Israëls zijn.","17":"En gijlieden zult weten, dat Ik de HEERE, uw God ben, wonende op Sion, den berg Mijner heiligheid; en Jeruzalem zal een heiligheid zijn, en vreemden zullen niet meer door haar doorgaan.","18":"En het zal te dien dage geschieden dat de bergen van zoeten wijn zullen druipen, en de heuvelen van melk vlieten, en alle stromen van Juda *vol* van water gaan; en er zal een fontein uit het huis des HEEREN uitgaan, en zal het dal van Sittim bewateren.","19":"Egypte zal tot verwoesting worden, en Edom zal worden tot een woeste wildernis, om het geweld, gedaan aan de kinderen van Juda, in welker land zij onschuldig bloed vergoten hebben.","20":"Maar Juda zal blijven in eeuwigheid, en Jeruzalem van geslacht tot geslacht.","21":"En Ik zal hunlieder bloed reinigen, *dat* Ik niet gereinigd had; en de HEERE zal wonen op Sion."},"KJV":{"1":"For, behold, in those days, and in that time, when I shall bring again the captivity of Judah and Jerusalem,","2":"I will also gather all nations, and will bring them down into the valley of Jehoshaphat, and will plead with them there for my people and *for* my heritage Israel, whom they have scattered among the nations, and parted my land.","3":"And they have cast lots for my people; and have given a boy for an harlot, and sold a girl for wine, that they might drink.","4":"Yea, and what have ye to do with me, O Tyre, and Zidon, and all the coasts of Palestine? will ye render me a recompence? and if ye recompense me, swiftly *and* speedily will I return your recompence upon your own head;","5":"Because ye have taken my silver and my gold, and have carried into your temples my goodly pleasant things:","6":"The children also of Judah and the children of Jerusalem have ye sold unto the Grecians, that ye might remove them far from their border.","7":"Behold, I will raise them out of the place whither ye have sold them, and will return your recompence upon your own head:","8":"And I will sell your sons and your daughters into the hand of the children of Judah, and they shall sell them to the Sabeans, to a people far off: for the LORD hath spoken","9":"Proclaim ye this among the Gentiles; Prepare war, wake up the mighty men, let all the men of war draw near; let them come up:","10":"Beat your plowshares into swords, and your pruninghooks into spears: let the weak say, I *am* strong.","11":"Assemble yourselves, and come, all ye heathen, and gather yourselves together round about: thither cause thy mighty ones to come down, O LORD.","12":"Let the heathen be wakened, and come up to the valley of Jehoshaphat: for there will I sit to judge all the heathen round about.","13":"Put ye in the sickle, for the harvest is ripe: come, get you down; for the press is full, the fats overflow; for their wickedness *is* great.","14":"Multitudes, multitudes in the valley of decision: for the day of the LORD *is* near in the valley of decision.","15":"The sun and the moon shall be darkened, and the stars shall withdraw their shining.","16":"The LORD also shall roar out of Zion, and utter his voice from Jerusalem; and the heavens and the earth shall shake: but the LORD *will be* the hope of his people, and the strength of the children of Israel.","17":"So shall ye know that I *am* the LORD your God dwelling in Zion, my holy mountain: then shall Jerusalem be holy, and there shall no strangers pass through","18":"And it shall come to pass in that day, *that* the mountains shall drop down new wine, and the hills shall flow with milk, and all the rivers of Judah shall flow with waters, and a fountain shall come forth of the house of the LORD, and shall water the valley of Shittim.","19":"Egypt shall be a desolation, and Edom shall be a desolate wilderness, for the violence *against* the children of Judah, because they have shed innocent blood in their land.","20":"But Judah shall dwell for ever, and Jerusalem from generation to generation.","21":"For I will cleanse their blood *that* I have not cleansed: for the LORD dwelleth in Zion."}},"tsk":{"1":[{"kopje":"in die dagen","refs":["Joël 2:29","Dan 12:1","Zef 3:19","Zef 3:20"]},{"kopje":"als","refs":["Deut 30:3","2 Kron 6:37","2 Kron 6:38","Ps 14:7","Ps 85:2","Jes 11:11-16","Jer 16:15","Jer 23:3-8","Jer 29:14","Jer 30:3","Jer 30:18","Ezech 16:53","Ezech 37:21","Ezech 37:22","Ezech 38:14-18","Ezech 39:25","Ezech 39:28","Ezech 39:29","Amos 9:14"]}],"2":[{"kopje":"alle","refs":["Zef 3:8","Zach 14:2-4","Openb 16:14","Openb 16:16","Openb 19:19-21","Openb 20:8"]},{"kopje":"het dal","refs":["Joël 3:12","2 Kron 20:26","Ezech 39:11","Zach 14:4"]},{"kopje":"richten","refs":["Jes 66:16","Ezech 38:22","Amos 1:11","Obadja 1:10-16","Zach 12:3","Zach 12:4","Openb 11:18","Openb 16:6","Openb 18:20","Openb 18:21"]},{"kopje":"en verdeeld","refs":["Jer 12:14","Jer 49:1","Ezech 25:8","Ezech 35:10","Zef 2:8-10"]}],"4":[{"kopje":"wat hebt u","refs":["Richt 11:12","2 Kron 21:16","2 Kron 28:17","2 Kron 28:18","Hand 9:4"]},{"kopje":"Tyrus","refs":["Amos 1:6-10","Amos 1:12-14","Zach 9:2-8"]},{"kopje":"wilt u","refs":["Ezech 25:12-17"]},{"kopje":"zeer snel","refs":["Deut 32:35","Jes 34:8","Jes 59:18","Jer 51:6","Luk 18:7","2 Tess 1:6"]}],"5":[{"kopje":"u","refs":["2 Kon 12:18","2 Kon 16:8","2 Kon 18:15","2 Kon 18:16","2 Kon 24:13","2 Kon 25:13-17","Jer 50:28","Jer 51:11","Dan 5:2","Dan 5:3"]},{"kopje":"in","refs":["1 Sam 5:2-5"]},{"kopje":"beste","refs":["Dan 11:38"]}],"6":[{"kopje":"verkocht","refs":["Joël 3:3","Joël 3:8","Deut 28:32","Deut 28:68","Ezech 27:13"]}],"7":[{"kopje":"Ik zal","refs":["Jes 11:12","Jes 43:5","Jes 43:6","Jes 49:12","Jer 23:8","Jer 30:10","Jer 30:16","Jer 31:8","Jer 32:37","Ezech 34:12","Ezech 34:13","Ezech 36:24","Ezech 38:8","Zach 10:6-10"]},{"kopje":"en Ik zal","refs":["Joël 3:4"," wl-kjv\" data-code=\"H3068\">LORD,</span> and shall <span class=\"wl wl-kjv\" data-code=\"H8248\">water</span> the <span class=\"wl wl-kjv\" data-code=\"H5158\">valley</span> of Shittim.","19":"<span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt</span> shall be a <span class=\"wl wl-kjv\" data-code=\"H8077\">desolation,</span> and <span class=\"wl wl-kjv\" data-code=\"H123\">Edom</span> shall be a <span class=\"wl wl-kjv\" data-code=\"H8077\">desolate</span> <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness,</span> for the <span class=\"wl wl-kjv\" data-code=\"H2555\">violence</span> against the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> because they have <span class=\"wl wl-kjv\" data-code=\"H8210\">shed</span> <span class=\"wl wl-kjv\" data-code=\"H5355\">innocent</span> <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> in their land.","20":"But <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> shall <span class=\"wl wl-kjv\" data-code=\"H3427\">dwell</span> for <span class=\"wl wl-kjv\" data-code=\"H5769\">ever,</span> and <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> from <span class=\"wl wl-kjv\" data-code=\"H1755\">generation</span> to generation.","21":"For I will <span class=\"wl wl-kjv\" data-code=\"H5352\">cleanse</span> their <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> that I have not <span class=\"wl wl-kjv\" data-code=\"H5352\">cleansed:</span> for the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H7931\">dwelleth</span> in Zion."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"ziet,","tekst":"Hieruit is af te nemen dat deze profetie ook behoort tot den staat van het Nieuwe Testament, waarvan in het einde van het voorgaande hoofdstuk gesproken is, beide [naar der profeten wijze] met manieren van spreken, die genomen zijn van den staat van het Oude Testament, gelijk te zien is in Joe 2:28 , Joe 2:32 , en hier in dit vers en de volgende."},{"catchword":"als Ik de gevangenis van Juda en Jeruzalem zal wenden;","tekst":"Dat is, Messias Gods kerk Zie onder vs.9-12, Joden Babel, Gods"}],"2":[{"catchword":"heidenen vergaderen,","tekst":"Dat is, Joden Joden Christus Nieuwe Testament Psa 2:1 ; Act 4:25-27 , en Act 6:12-13 , enz."},{"catchword":"dal van Jósafat;","tekst":"Dat is, aardse dal, God Christus Vaders, vs.11. Doch 2Ch 20 alwaar God Josafat, dal Beracha, lofs, God Zie 2Ch 20:12 , 2Ch 20:16 , 2Ch 20:22 , 2Ch 20:26 , met de aantekening. Alzo [wil de Heere zeggen] zal Ik De Hebr. naam Jehosafat betekent des HEEREN oordeel;, of gericht, of de HEERE oordeelt; en schijnt Ik zal aldaar met hen rechten; waarin sommigen het woord Josafat dal van het oordeel des Heeren. Anderen Jeruzalem Olijfberg, Zaligmaker Josafats; Zie Zec 14:4-5 ."},{"catchword":"erfdeel","tekst":"Zie Deu 32:9 ."},{"catchword":"Israël,","tekst":"Dat is, van mijne kerk, van het geestelijke Israël, bestaande uit gelovige Joden en heidenen; Gal 6:16 ."},{"catchword":"Mijn land","tekst":"Zie Joe 1:6 ."},{"catchword":"gedeeld;","tekst":"Te weten, onder elkander, als een roof; Dan 11:39 ."}],"3":[{"catchword":"lot over Mijn volk geworpen","tekst":"De overheerden en gevangenen van mijn volk door het lot elkander toegedeeld, en tot voldoening van hun goddeloze wellusten, zo onwaardig en snodelijk geacht en behandeld, gelijk volgt."},{"catchword":"hoer,","tekst":"Sommigen menen dat het Hebr. woord hier betekent spijs."}],"4":[{"catchword":"wat hebt gij met Mij te doen,","tekst":"Dat gij mijn volk, heiligdom en land zo vijandelijk hebt behandeld? Hebben Ik of zij u iets misdaan, dat gij zoudt mogen voorgeven zulks te willen wreken? In jet minste niet, wil God zeggen, het is louter goddeloze haat en vijandschap, die gij hebt en voert tegen mij, wien het kwaad raakt en aangaat; dat men mijne kerk aandoet. Anders: watzijt gij bij mij? of wat wilt gij tegen mij? dat is, wat zoudt gij dan ook bij mij gelden, dewijl gij mijn volk zo snood en schandelijk behandelt? of, wat zoudt gij toch tegen mij vermogen? Hebr. wat gij lieden mij, of met, bij, tegen mij?"},{"catchword":"Tyrus en Sidon,","tekst":"Verg. Amo 1:7-9 . De Tyriërs, Sidoniërs en Filistijnen waren het naast gelegen aan het Joodse land, langs de kusten van de Middellandse zee, en zeer bittere vijanden van Gods volk. Doch onder dezen moet men alle vijanden der kerk verstaan, gelijk ook de straf, die hun voorzegd wordt, den vijanden in het algemeen is rakende; alzo worden door Moab alle andere vijanden der kerk verstaan, Isa 25:10 , en in vs.19, door Egypte en Edom, en door Edom alleen. Zie Obadja enz."}],"5":[{"catchword":"Mijn zilver en Mijn goud hebt weggenomen,","tekst":"Van mijnen tempel, of ook [gelijk sommigen] van mijn volk en van mijn land, gelijk God gewoon is te spreken."},{"catchword":"beste kleinodiën","tekst":"De vaten van mijnen tempel of kleinodiën van mijn volk. Dit alles wordt gesproken naar den stijl van het Oude Testament, waardoor afgebeeld wordt allerlei smaad en overlast, die de vijanden Gods kerk, om zijn reinen godsdienst, zouden aandoen; zie vs.1."},{"catchword":"tempels gebracht","tekst":"Der afgoden, om die met mijn goed te vereren, en mij alzo te beschimpen."}],"6":[{"catchword":"Grieken,","tekst":"Hebr. Jevanim, van Javan. zie Gen 10:2 ."}],"7":[{"catchword":"opwekken uit de plaats,","tekst":"Gelijk Ik mijn volk uit Babel en andere plaatsen, waar zij verstrooid zullen zijn, zal verlossen, alzo zal Ik met mijne kerk in het algemeen alsdan handelen, en hare vijanden straffen."}],"8":[{"catchword":"verkopen","tekst":"Ik zal beschikken dat hun dit alles overkome, om mijns volks wil, alsof zij het zelf deden; en voorts in het algemeen mijner kerk hare vijanden overgeven, dat zij hen richtte en oordele. Zie vs.11, en Psa 50:6 ."},{"catchword":"Scheba,","tekst":"Zie Gen 10:7 ."},{"catchword":"aan een vergelegen volk;","tekst":"Anders: [om te voeren] tot een, enz."},{"catchword":"want de HEERE heeft het gesproken","tekst":"Verg. Joe 2:32 ."}],"9":[{"catchword":"Roept dit uit onder de heidenen,","tekst":"Dit spreekt God [spottenderwijze] tot alle vijanden zijner kerk, alsof Hij zeide: Doet vrij al wat gij kunt; brengt al uwe macht bijeen, gedraagt u als helden, gij zult mede ervaren gelijk volgt; verg. Isa 8:9-10 ; Jer 46:3-4 ; Eze 38:7 , Eze 38:9 , enz."},{"catchword":"heiligt een krijg;","tekst":"Zie Jer 6:4 ."}],"10":[{"catchword":"Slaat uw spaden tot zwaarden,","tekst":"Opdat het u toch aan gene krijgswapenen ontbreke, die gij tegen mijne kerk zoudt mogen gebruiken. Zie de belofte van het tegendeel, in Gods kerk, Isa 2:4 ; Mic 4:3 ."}],"11":[{"catchword":"O HEERE,","tekst":"Een vurig gebed van den profeet uit bekommernis over dit grote geweld aller vijanden, waartegen hij geen troost vindt dan bij God. Verg. Joe 1:19 , en zie een dergelijke tussengevoegde aanspraak tot God, Zec 14:5 ; Isa 63:14 ; Hos 11:3 , enz."},{"catchword":"helden derwaarts nederdalen","tekst":"De heilige engelen, die ook alzo genoemd en vanwege hunne macht genoemd worden, Psa 78:25 , en Psa 103:20 , en welker dienst God placht te gebruiken in het beschermen zijner kerk en het verdelgen harer vijanden; verg. 2Ch 20:22 , met de aantekening aldaar. Sommigen verstaan, om God in het oordeel, nevens zijne heiligen, te helpen. Verg. Psa 50:6 ; beide is der engelen plicht. Dit stelt de profeet tegen de helden der vijanden, zie vs.9, alsof hij zeide: Heere, als de vijanden doen alles wat zij kunnen, doe Gij dan ook wat Gij kunt. Anders: aldaar zal de HEERE uwe [een ieder van al deze vijandelijke volken] helden nederleggen, dat is nedervellen."}],"12":[{"catchword":"De heidenen zullen zich opmaken,","tekst":"Of, laat de volken zich, enz. want enz. of de volken zullen worden opgewekt, en opkomen, of opklimmen, enz."},{"catchword":"dal van Jósafat;","tekst":"Zie vs.2."},{"catchword":"zitten,","tekst":"Als Koning en Rechter der wereld; zie Psa 9:5 , en Psa 29:10 , en Psa 55:20 . Door mijnen Zoon Jezus Christus; Joh 5:22 ; Act 17:31 ."}],"13":[{"catchword":"Slaat de sikkel aan,","tekst":"Maait af en dorst, dat is, verdelgt hen, werpt hen in het vuur. Dit zijn Gods woorden tot zijne helden, van wie in vs.11. Verg. Mat 13:30 , Mat 13:39 ; Rev 14:15 , Rev 14:19 ."},{"catchword":"rijp geworden;","tekst":"Hunne zonden zijn rijp ter straf, de maat is vol [verg. Gen 15:16 , en Gen 18:21 , met de aantekening] de bestemde dag en tijd van mijn oordeel is daar."},{"catchword":"vol,","tekst":"Van druiven, om getreden en geperst te worden; dat is, de grote pers van God stoornis vol, waarin alle goddelozen zullen geworpen worden; zie Rev 14:19 , en verg. Isa 63:3 ."},{"catchword":"groot","tekst":"Of, veelvoudig, dit verklaart de voorgaande gelijkenissen."}],"14":[{"catchword":"Menigten, menigten","tekst":"Dat is, [als met verwondering uitroepende] o hoezeer grote menigten van mensen zullen er komen, of zich verzamelen! of, hoe vol zal het overal zijn van verslagen, nedergevelde vijanden, ziende op het voorgaande vers, verg. 2Ch 20:24 , enz.; Isa 66:24 , en zie van zulk ene verdubbeling der woorden Gen 14:10 ; Deu 16:20 ; Eze 13:10 , in de aantekening. Anders: rumoeren, rumoeren, of gedruis, gedruis, gewoel, gewoel."},{"catchword":"dal des dorswagens;","tekst":"Versta, het gemelde dal van Josafat, alzo genoemd omdat de vijanden van Gods volk aldaar zouden gedorst, dat is verbroken en vertreden worden. Dit past wel op het voorgaande vers waar God zegt: Slaat de sikkel aan, want de oogst is rijp, waarop het dorsen volgt; en alzo wordt het Hebr. woord Charuts gebruikt voor den dorswagen, te dien tijde gebruikelijk; Isa 28:27 ; Amo 1:3 , en in een gelijke zaak als hier Isa 41:15 . Verg. ook hiermede Isa 25:10 ; Jer 51:33 ; Hab 3:12 . Doch alzo het voorschreven woord ook betekent, versneden, en voorts beslist [gelijk men nu ook spreekt] of juist bestemd, besloten aangenomen, wordt het van sommigen hier overgezet, het dal der versnijding; dat is, der uitroeiing, of het dal van het precies bestemd, bescheiden, oordeel, alsof men zeide, van het arrest, van het juiste vonnis; ook in de goede zin. Zie deze betekenis van het Hebr. woord Job 14:5 ; Isa 10:22-23 ; Dan 9:26-27 , en Dan 11:36 ."},{"catchword":"nabij,","tekst":"Profetischerwijze, en ten aanzien van God gesproken, alsof de zaak voor de deur was. Verg. Rev 1:1 , en 2Pe 3:8-9 ."}],"15":[{"catchword":"zon en maan zijn zwart geworden,","tekst":"Gelijk in Joe 2:10 ; zie aldaar. Alle tekenen [wil de profeet zeggen] zijn er, die voor den dag des Heeren zullen voorgaan."}],"16":[{"catchword":"Sion brullen,","tekst":"Uit zijne kerk zijn heilig Evangelie door de ganse wereld laten horen, met verkondiging van zijn verschrikkelijke oordelen over alle ongehoorzamen, hetwelk niet zal geschieden zonder beroerte van de ganse wereld. Verg. de manier van spreken met Isa 31:4-5 ; Hos 11:10 , met de aantekening; idem Hag 2:6-7 ; Heb 12:26 ."},{"catchword":"Toevlucht Zijns volks,","tekst":"In al de voorzegde verschrikkelijke beroerten en oordelen Gods."},{"catchword":"kinderen Israëls zijn","tekst":"Dat is, zijner kerk."}],"17":[{"catchword":"gijlieden zult weten,","tekst":"Dat is, mijne kerk [waarvan de gelovigen te dien tijde medeleden waren] zal bevinden, ervaren; verg. Joe 2:27 ."},{"catchword":"Sion,","tekst":"Gelijk Joe 2:32 , en in vs.21."},{"catchword":"heiligheid zijn,","tekst":"Dat is, gans heilig, volkomenlijk alsdan geheiligd; zie onder vs.21; Rev 21:2 , en ook gezuiverd van het lastig gezelschap aller onheilige bokken en huichelaars, die van Christus niet zijn en zijnen Geest niet hebben, gelijk volgt."},{"catchword":"en vreemden zullen niet meer door haar doorgaan","tekst":"Zie Zec 14:21 ; Mat 7:23 , en Mat 13:30 , en Mat 25:32 , Mat 25:46 ; Rev 21:27 ; voorts zal zij ook van gene vijanden meer geplaagd zijn."}],"18":[{"catchword":"bergen","tekst":"Door deze en de volgende lieflijke en figuurlijke redenen wordt afgebeeld de zeer gelukzalige stand der kerk onder het koninkrijk van Christus, inzonderheid der triomferende kerk in het koninkrijk der heerlijkheid, wanneer God zijn genadewerk, in dit leven aangevangen, volkomenlijk zal voltrekken, en alles in allen zijn. Verg. Amo 9:13 ."},{"catchword":"fontein uit het huis des HEEREN uitgaan,","tekst":"Zie Isa 49:10 ; Eze 47:1 , enz.; Zec 14:8 , met de aantekening, idem Rev 22:1 ."},{"catchword":"Sittim bewateren","tekst":"Gelegen aan de oostzijde van de Jordaan, in de vlakke velden der Moabieten, tegenover Jericho, nabij de Zoutzee, of Dode zee, [zie Gen 14:3 ] , welker wateren dodelijk waren, en volgens dien de aanliggende omstreken droog en onvruchtbaar. Verg. Eze 47:1-3 , alwaar gezegd wordt dat de wateren uit des Heeren huis mede liepen oostwaarts; en zie van de plaats Sittim, [ Hebr. ] Schittim Num 22:1 , verg. met Num 25:1 , en Num 33:49 ; Jos 2:1 ; Mic 6:5 . Anders: het dal der uitgelezen cederen; dat is, der kerk. Verg. Psa 92:13-14 , en zie Exo 25:5 ; Isa 41:19 ."}],"19":[{"catchword":"Egypte","tekst":"Zie vs.4."},{"catchword":"woeste wildernis,","tekst":"Gelijk in Joe 2:3 ."},{"catchword":"om het geweld,","tekst":"Hebr. om den wrevel, of het geweld der kinderen van Juda; dat is, dien zij aan Juda bewezen hebben. Verg. de manier van spreken met Jer 2:2 , en zie de aantekening aldaar."}],"20":[{"catchword":"blijven in eeuwigheid,","tekst":"Of, bewoond worden. Zie Jer 17:6 . Door Juda, Jeruzalem en Zion, versta Gods kerk. Verg. Joe 2:32 ."},{"catchword":"van geslacht tot geslacht","tekst":"Hebr. tot, of in geslacht en geslacht."}],"21":[{"catchword":"bloed reinigen,","tekst":"Dat is, Ik zal hen volkomenlijk heiligen, hen zuiverende van alle zondige onreinheid, dat Ik tevoren [in dit leven] niet volkomenlijk had gedaan. Verg. Eze 16:6 , Eze 16:9 ; Hos 12:15 , met de aantekening, en zie vs.17. Sommigen duiden het op Gods genade aan de heidenen, die tevoren van Gods verbond vervreemd waren, Eph 2:12 . Anders: Ik zal hun bloed onschuldig verklaren, [dat] Ik niet onschuldig verklaard had; dat is, Ik zal alsdan door mijn oordeel doen blijken dat zij onschuldig om het leven zijn gebracht, die om mijnentwil gedood zijn, waar Ik tevoren mijn toorn opgeschort en mij dan stilgehouden had. Verg. Rev 6:10 , en zie vs.19."},{"catchword":"wonen op Sion","tekst":"Verg. Eze 48:35 ; Zec 2:10-11 ; Rev 21:3 , Rev 21:22 , en Rev 22:3 ."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"For behold in those days and at that time [hence appears that this prophecy likewise appertaineth to the state of the New Testament spoken of in the latter end of the foregoing chapter in both place4s according to the manner of the prophets by the expression borrowed from the state of the old testament as many may be seen above chap 2verse 28 .32 and here in this verse and the sequel ] when I shall turn the captivity of Juda and Jerusalem ;[that is when I shall deliver my church by the Messiah and punish her enemies especially and perfectly towards the end of the world when the enemies shall raise and bring up all their forces to destroy her see below 9.10,11,12 &c this being typified and represented and delivered by the Jews out of Babel and gods vengeans against their enemies .]"}],"2":[{"catchword":null,"tekst":"Then I will gather all the heathens [that is their enemies of my church counted as heathens whether Jews or Gentiles for the Jews proved the first and the bitterest enemies of Christ and the church of the New-testament see Psa 2:1 Act 25:5,26,27. and chapter 6.12,13c.] and I will lead them down into the valley of Josaphat [that is into the place of my judgment which may be called a valley in regard to the heavens as we are wont to say this carthly vale of misery c where God is said to inhabit and Christ doth sit in glory at the right hand of his father and whence he sendeth down his Angels for the destruction of his enemies below verse11 but this seems altogether to have respect to the history 2 Chronicles 20 when God in the time of the pious king Josaphat upon the prayer of that king and his people even before their eyes and his assistance or cooperation of theirs by his own power or ministry of his Angels judged and destroyed that great multitude of his enemies which came marching on against Juda in the valley of Beracha or of praise ;so called from the praise and thanks which then and thee was offered up to God by the by the church for that great and wonderful defeat of their enemies see 2 Chronicles 20.12,16,22,26 with the annotate thus the Lord implies shall I likewise in the last times judge and punish all the enemies of my church before her own eyes for which she shall give me her own praise ,and thanks .The Hebrew name Josaphat doth signified the Lords doom or judgment or the Lord judgeth and it seems to be explained here by the word subjoined there I will plead with them which is the reason why some take the word Josaphat here to be no proper name but read thus the valley of the Lords judgment other conceive that between Jerusalem and mount Oliver whence our saviour ascended up to heaven there was a certain valley of Josaphat but of that there is no certainty see Zach 14.4,5.] and there I will plead with them because of my people and mine inheritance [see Deut 32on verse 9] Israel [that is my church the spiritual Israel consisting of believing Jews and Gentiles see Galatians 6.16 ]which they scattered among the heathens and divided [viz among themselves as a prey compare Dan 11:39] my land [see above chapter 1 on verse 6]"}],"3":[{"catchword":null,"tekst":"And have cast the lot over my people [by lot dividing the conquered and captives of my people among themselves and to make up he full measure of their wicked lusts and appetite ,valued and entreated them as vilely as followeth ]and given a lad for a whore [some think that the Hebrew word doth signifie meat in this place ]and sold a lass for wine to drink ."}],"4":[{"catchword":null,"tekst":"And also what have ye to do with me ye Tyre and Zidon // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {

  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}

function kopieerVers(n) {
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n})`).then(() => {

    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);

}

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {

     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +

  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  // slug -> volledige boeknaam (voor citaten met de volle boeknaam i.p.v. de afkorting)
  const boeknaamPerSlug = {};
  (D.meta.boeken || []).forEach(b => {
    const m = b.href.match(/^\.\.\/\.\.\/([^/]+)\//);
    if (m) boeknaamPerSlug[m[1]] = b.naam;
  });
  // dubbele rechtsklik (binnen 500ms, zelfde verwijzing) kopieert het vers
  // i.p.v. de vertalingen-popup te tonen (enkele rechtsklik blijft bestaand gedrag)
  function kopieerVerwijzing(chip, ref) {
    haalVert('versteksten', ref).then(data => {
      const tekst = data && data[ref.vers];
      if (!tekst) return;
      const url = location.origin + '/studiebijbel/' + ref.slug + '/' + ref.hfd + '#v' + ref.vers;
      const naam = boeknaamPerSlug[ref.slug] || chip.textContent.replace(/\s+\d+:\d+.*$/, '');
      const kopie = tekst.replace(/\*/g, '') + `\n~ [${naam} ${ref.hfd}:${ref.vers}](${url})`;
      navigator.clipboard.writeText(kopie).then(() => {
        toast.classList.add('zichtbaar');
        setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
      });
    });
  }
  let laatsteRechtsklik = { sleutel: null, tijd: 0 };
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    const sleutel = chip.dataset.ref;
    const nu = Date.now();
    const isDubbelklik = laatsteRechtsklik.sleutel === sleutel && (nu - laatsteRechtsklik.tijd) < 500;
    laatsteRechtsklik = isDubbelklik ? { sleutel: null, tijd: 0 } : { sleutel, tijd: nu };
    if (isDubbelklik) {
      popup.style.display = 'none';
      vpopup.style.display = 'none';
      kopieerVerwijzing(chip, ref);
      return;
    }
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
