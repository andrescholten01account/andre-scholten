os","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Waait op de bazuin te Sion, en roept luide op de berg van Mijn heiligheid; laat alle inwoners van het land beroerd zijn, want de dag van de HEERE komt, want hij is nabij.","2":"Een dag van duisternis en donkerheid, een dag van wolken en dikke duisternis, als de dageraad uitgespreid over de bergen; een groot en machtig volk, zoals er van oude tijden af niet geweest is, en na hen niet meer zal zijn tot in jaren van vele geslachten.","3":"Voor hen verteert een vuur, en achter hen brandt een vlam; het land is voor hen als een lusthof*, maar achter hen een woeste wildernis, en ook is er geen ontkomen aan hen.","4":"Hun gedaante is als de gedaante van paarden, en als ruiters, zo zullen zij lopen.","5":"Zij zullen daarheen springen als een gedruis van wagens, op de toppen van de bergen; als het gedruis van een vuurvlam, die stoppels verteert; als een machtig volk, dat in slagorde opgesteld is.","6":"Voor hun aangezicht zullen de volken pijn lijden; alle gezichten zullen bleek wegtrekken*.","7":"Als helden zullen zij lopen, als krijgslieden zullen zij de muren beklimmen; en zij zullen daarheen trekken, ieder in zijn eigen weg, en zullen hun paden niet verdraaien.","8":"Ook zullen zij de een de ander niet verdringen; zij zullen daarheen trekken elk in zijn eigen baan; en al vielen zij op een wapen, zij zouden niet verwond worden.","9":"Zij zullen door de stad heen en weer lopen, zij zullen lopen op de muren, zij zullen klimmen in de huizen; zij zullen door de vensters binnenkomen als een dief.","10":"De aarde is beroerd voor hun aangezicht, de hemel beeft; de zon en maan worden zwart, en de sterren trekken hun glans in.","11":"En de HEERE verheft Zijn stem voor Zijn leger uit; want Zijn leger is zeer groot, want Hij is machtig, Hij die Zijn woord uitvoert; want de dag van de HEERE is groot en zeer vreselijk, en wie zal hem kunnen verdragen?","12":"Nu dan ook, spreekt de HEERE, bekeert u tot Mij met uw hele hart, en dat met vasten en met geween, en met rouwklagen.","13":"En scheurt uw hart en niet uw kleren, en bekeert u tot de HEERE, uw God; want Hij is genadig en barmhartig, geduldig en groot van goedertierenheid, en Hij heeft berouw over het kwade.","14":"Wie weet, Hij mocht Zich wenden en berouw hebben; en Hij mocht een zegen achter Zich overlaten tot spijsoffer en drankoffer voor de HEERE, uw God.","15":"Waait op de bazuin te Sion, heiligt een vasten, roept een verbodsdag uit.","16":"Verzamelt het volk, heiligt de gemeente, vergadert de oudsten, verzamelt de kinderen, en wie de borsten zuigen; de bruidegom ga uit zijn binnenkamer, en de bruid uit haar slaapkamer.","17":"Laat de priesters, de dienaars van de HEERE, wenen tussen het voorhuis en het altaar, en laat hen zeggen: Spaar Uw volk, o HEERE! en geef Uw erfenis niet over tot een smaad, dat de heidenen over hen zouden heersen; waarom zouden zij onder de volken zeggen: Waar is hun God?","18":"Zo zal de HEERE ijveren over Zijn land, en Hij zal Zijn volk verschonen.","19":"En de HEERE zal antwoorden en tegen Zijn volk zeggen: Ziet, Ik zend u het koren, en de most, en de olie, zodat u daarvan verzadigd zult worden; en Ik zal u niet meer overgeven tot een smaad onder de heidenen.","20":"En Ik zal hem die uit het noorden komt ver van u doen vertrekken, en hem wegdrijven in een dor en woest land, zijn voorkant naar de Oostzee, en zijn achterkant naar de verste zee; en zijn stank zal opgaan, en zijn vuiligheid zal opgaan; want hij heeft grote dingen gedaan.","21":"Vrees niet, o land! verheug u, en wees blijde; want de HEERE heeft grote dingen gedaan.","22":"Vreest niet, dieren van het veld! want de weiden van de woestijn zullen weer jong gras voortbrengen; want het geboomte zal zijn vrucht dragen, de wijnstok en vijgenboom zullen hun vermogen geven.","23":"En u, kinderen van Sion! verheugt u en weest blijde in de HEERE, uw God; want Hij zal u die Leraar ter gerechtigheid geven; en Hij zal u de regen doen neerdalen, de vroege regen en de late regen in de eerste maand.","24":"En de dorsvloeren zullen vol koren zijn, en de perskuipen zullen overlopen van most en olie.","25":"Zo zal Ik u de jaren vergelden, die de sprinkhaan, de kever, en de kruidworm, en de rups heeft afgegeten; Mijn grote leger, dat Ik onder u gezonden heb.","26":"En u zult overvloedig en tot verzadiging eten, en de Naam van de HEERE, uw God, prijzen, Die wonderlijk bij u gehandeld heeft; en Mijn volk zal niet beschaamd worden tot in eeuwigheid.","27":"En u zult weten, dat Ik in het midden van Israël ben, en dat Ik de HEERE, uw God, ben, en niemand anders meer; en Mijn volk zal niet beschaamd worden in eeuwigheid.","28":"En daarna zal het gebeuren, dat Ik Mijn Geest zal uitgieten over alle vlees, en uw zonen en uw dochters zullen profeteren; uw ouden zullen dromen dromen, uw jongelingen zullen gezichten zien;","29":"Ja, ook over de dienstknechten, en over de dienstmaagden, zal Ik in die dagen Mijn Geest uitgieten.","30":"En Ik zal wondertekenen geven in de hemel en op de aarde: bloed, en vuur, en rookpilaren.","31":"De zon zal veranderd worden in duisternis, en de maan in bloed, voordat die grote en vreselijke dag van de HEERE komt.","32":"En het zal gebeuren, dat ieder die de Naam van de HEERE zal aanroepen, behouden zal worden; want op de berg Sion en te Jeruzalem zal ontkoming zijn, zoals de HEERE gezegd heeft; en dat, bij de overgeblevenen, die de HEERE zal roepen."},"SV":{"1":"Blaast de bazuin te Sion, en roept luide op den berg Mijner heiligheid; laat alle inwoners des lands beroerd zijn, want de dag des HEEREN komt, want hij is nabij.","2":"Een dag van duisternis en donkerheid, een dag van wolken en dikke duisterheid, als de dageraad uitgespreid over de bergen; een groot en machtig volk, desgelijks van ouds niet geweest is, en na hetzelve niet meer zal zijn tot in jaren van vele geslachten.","3":"Voor hetzelve verteert een vuur, en achter hetzelve brandt een vlam; het land is voor hetzelve als een lusthof, maar achter hetzelve een woeste wildernis, en ook is er geen ontkomen van hetzelve.","4":"De gedaante deszelven is als de gedaante van paarden, en als ruiters zo zullen zij lopen.","5":"Zij zullen daarhenen springen als een gedruis van wagenen, op de hoogten der bergen; als het gedruis ener vuurvlam, die stoppelen verteert; als een machtig volk, dat in slagorde gesteld is.","6":"Van deszelfs aangezicht zullen de volken in pijn zijn; alle aangezichten zullen betrekken *als* een pot.","7":"Als helden zullen zij lopen, als krijgslieden zullen zij de muren beklimmen; en zij zullen daarhenen trekken, een iegelijk in zijn wegen, en zullen hun paden niet verdraaien.","8":"Ook zullen zij de een den ander niet dringen; zij zullen daarhenen trekken elk in zijn baan; en al vielen zij op een geweer, zij zouden niet verwond worden.","9":"Zij zullen in de stad omlopen, zij zullen lopen op de muren, zij zullen klimmen in de huizen; zij zullen door de vensteren inkomen als een dief.","10":"De aarde is beroerd voor deszelfs aangezicht, de hemel beeft; de zon en maan worden zwart, en de sterren trekken haar glans in.","11":"En de HEERE verheft Zijn stem voor Zijn heir henen; want Zijn leger is zeer groot, want Hij is machtig, doende Zijn woord; want de dag des HEEREN is groot en zeer vreselijk, en wie zal hem verdragen?","12":"Nu dan ook, spreekt de HEERE, bekeert u tot Mij met uw ganse hart, en dat met vasten en met geween, en met rouwklage.","13":"En scheurt uw hart en niet uw klederen, en bekeert u tot den HEERE, uw God; want Hij is genadig en barmhartig, lankmoedig en groot van goedertierenheid, en berouw hebbende over het kwade.","14":"Wie weet, Hij mocht Zich wenden en berouw hebben; en Hij mocht een zegen achter Zich overlaten *tot* spijsoffer en drankoffer voor den HEERE, uw God.","15":"Blaast de bazuin te Sion, heiligt een vasten, roept een verbodsdag uit.","16":"Verzamelt het volk, heiligt de gemeente, vergadert de oudsten, verzamelt de kinderkens, en die de borsten zuigen; de bruidegom ga uit zijn binnenkamer, en de bruid uit haar slaapkamer.","17":"Laat de priesters, des HEEREN dienaars, wenen tussen het voorhuis en het altaar, en laat hen zeggen: Spaar Uw volk, o HEERE! en geef Uw erfenis niet over tot een smaadheid, dat de heidenen over hen zouden heersen; waarom zouden zij onder de volken zeggen: Waar is hunlieder God?","18":"Zo zal de HEERE ijveren over Zijn land, en Hij zal Zijn volk verschonen.","19":"En de HEERE zal antwoorden en tot Zijn volk zeggen: Ziet, Ik zend ulieden het koren, en den most, en de olie, dat gij daarvan verzadigd zult worden; en Ik zal u niet meer overgeven *tot* een smaadheid onder de heidenen.","20":"En Ik zal dien van het noorden verre van ulieden doen vertrekken, en hem wegdrijven in een dor en woest land, zijn aangezicht naar de Oostzee, en zijn einde naar de achterste zee; en zijn stank zal opgaan, en zijn vuiligheid zal opgaan; want hij heeft grote dingen gedaan.","21":"Vrees niet, o land! verheug u, en wees blijde; want de HEERE heeft grote dingen gedaan.","22":"Vreest niet, gij beesten des velds! want de weiden der woestijn zullen *weder* jong gras voortbrengen; want het geboomte zal zijn vrucht dragen, de wijnstok en vijgeboom zullen hun vermogen geven.","23":"En gij, kinderen van Sion! verheugt u en zijt blijde in den HEERE, uw God; want Hij zal u geven dien Leraar ter gerechtigheid; en Hij zal u den regen doen nederdalen, den vroegen regen en den spaden regen in de eerste *maand*.","24":"En de dorsvloeren zullen vol koren zijn, en de perskuipen van most en olie overlopen.","25":"Alzo zal Ik ulieden de jaren vergelden, die de sprinkhaan, de kever, en de kruidworm, en de rups heeft afgegeten; Mijn groot heir, dat Ik onder u gezonden heb.","26":"En gij zult overvloediglijk en tot verzadiging eten, en prijzen den Naam des HEEREN, uw Gods, Die wonderlijk bij u gehandeld heeft; en Mijn volk zal niet beschaamd worden tot in eeuwigheid.","27":"En gij zult weten, dat Ik in het midden van Israël ben, en *dat* Ik de HEERE, uw God, ben, en niemand meer; en Mijn volk zal niet beschaamd worden in eeuwigheid.","28":"En daarna zal het geschieden, dat Ik Mijn Geest zal uitgieten over alle vlees, en uw zonen en uw dochteren zullen profeteren; uw ouden zullen dromen dromen, uw jongelingen zullen gezichten zien;","29":"Ja, ook over de dienstknechten, en over de dienstmaagden, zal Ik in die dagen Mijn Geest uitgieten.","30":"En Ik zal wondertekenen geven in den hemel en op de aarde: bloed, en vuur, en rookpilaren.","31":"De zon zal veranderd worden in duisternis, en de maan in bloed, eer dat die grote en vreselijke dag des HEEREN komt.","32":"En het zal geschieden, al wie den Naam des HEEREN zal aanroepen, zal behouden worden; want op den berg Sions en te Jeruzalem zal ontkoming zijn, gelijk als834 de HEERE gezegd heeft; en dat, bij de overgeblevenen, die de HEERE zal roepen."},"KJV":{"1":"Blow ye the trumpet in Zion, and sound an alarm in my holy mountain: let all the inhabitants of the land tremble: for the day of the LORD cometh, for *it is* nigh at hand;","2":"A day of darkness and of gloominess, a day of clouds and of thick darkness, as the morning spread upon the mountains: a great people and a strong; there hath not been ever the like, neither shall be any more after it, *even* to the years of many generations.","3":"A fire devoureth before them; and behind them a flame burneth: the land *is* as the garden of Eden before them, and behind them a desolate wilderness; yea, and nothing shall escape","4":"The appearance of them *is* as the appearance of horses; and as horsemen, so shall they run.","5":"Like the noise of chariots on the tops of mountains shall they leap, like the noise of a flame of fire that devoureth the stubble, as a strong people set in battle array.","6":"Before their face the people shall be much pained: all faces shall gather blackness.","7":"They shall run like mighty men; they shall climb the wall like men of war; and they shall march every one on his ways, and they shall not break their ranks:","8":"Neither shall one thrust another; they shall walk every one in his path: and *when* they fall upon the sword, they shall not be wounded.","9":"They shall run to and fro in the city; they shall run upon the wall, they shall climb up upon the houses; they shall enter in at the windows like a thief.","10":"The earth shall quake before them; the heavens shall tremble: the sun and the moon shall be dark, and the stars shall withdraw their shining:","11":"And the LORD shall utter his voice before his army: for his camp *is* very great: for *he is* strong that executeth his word: for the day of the LORD *is* great and very terrible; and who can abide","12":"Therefore also now, saith the LORD, turn ye *even* to me with all your heart, and with fasting, and with weeping, and with mourning:","13":"And rend your heart, and not your garments, and turn unto the LORD your God: for he *is* gracious and merciful, slow to anger, and of great kindness, and repenteth him of the evil.","14":"Who knoweth *if* he will return and repent, and leave a blessing behind him; *even* a meat offering and a drink offering unto the LORD your God?","15":"Blow the trumpet in Zion, sanctify a fast, call a solemn assembly:","16":"Gather the people, sanctify the congregation, assemble the elders, gather the children, and those that suck the breasts: let the bridegroom go forth of his chamber, and the bride out of her closet.","17":"Let the priests, the ministers of the LORD, weep between the porch and the altar, and let them say, Spare thy people, O LORD, and give not thine heritage to reproach, that the heathen should rule over them: wherefore should they say among the people, Where *is* their God?","18":"Then will the LORD be jealous for his land, and pity his people.","19":"Yea, the LORD will answer and say unto his people, Behold, I will send you corn, and wine, and oil, and ye shall be satisfied therewith: and I will no more make you a reproach among the heathen:","20":"But I will remove far off from you the northern *army*, and will drive him into a land barren and desolate, with his face toward the east sea, and his hinder part toward the utmost sea, and his stink shall come up, and his ill savour shall come up, because he hath done great things.","21":"Fear not, O land; be glad and rejoice: for the LORD will do great things.","22":"Be not afraid, ye beasts of the field: for the pastures of the wilderness do spring, for the tree beareth her fruit, the fig tree and the vine do yield their strength.","23":"Be glad then, ye children of Zion, and rejoice in the LORD your God: for he hath given you the former rain moderately, and he will cause to come down for you the rain, the former rain, and the latter rain in the first","24":"And the floors shall be full of wheat, and the fats shall overflow with wine and oil.","25":"And I will restore to you the years that the locust hath eaten, the cankerworm, and the caterpiller, and the palmerworm, my great army which I sent","26":"And ye shall eat in plenty, and be satisfied, and praise the name of the LORD your God, that hath dealt wondrously with you: and my people shall never be ashamed.","27":"And ye shall know that I *am* in the midst of Israel, and *that* I *am* the LORD your God, and none else: and my people shall never be ashamed.","28":"And it shall come to pass afterward, *that* I will pour out my spirit upon all flesh; and your sons and your daughters shall prophesy, your old men shall dream dreams, your young men shall see visions:","29":"And also upon the servants and upon the handmaids in those days will I pour out my spirit.","30":"And I will shew wonders in the heavens and in the earth, blood, and fire, and pillars of smoke.","31":"The sun shall be turned into darkness, and the moon into blood, before the great and the terrible day of the LORD come.","32":"And it shall come to pass, *that* whosoever shall call on the name of the LORD shall be delivered: for in mount Zion and in Jerusalem shall be deliverance, as the LORD hath said, and in the remnant whom the LORD shall call."}},"tsk":{"1":[{"kopje":"Waait","refs":["Joël 2:15","Num 10:3","Num 10:8","Jer 4:5","Hos 8:1"]},{"kopje":"bazuin","refs":["1 Kron 15:28","Hos 5:8"]},{"kopje":"en roept luide","refs":["Num 10:5-7","Num 10:9","Ezech 33:3","Ezech 33:6","Amos 3:6","Zef 1:16"]},{"kopje":"van Mijn heiligheid","refs":["Joël 3:17","Ps 87:1","Dan 9:16","Dan 9:20","Zef 3:11","Zach 8:3"]},{"kopje":"laat","refs":["Ezra 9:3","Ezra 9:4","Ps 119:120","Jes 66:2","Jes 66:5","Jer 5:22","Jer 16:7","Jer 16:10","Dan 6:27","Fil 2:12"]},{"kopje":"want de","refs":["Joël 1:15","Jes 2:12","Ezech 7:5-7","Ezech 7:10","Ezech 7:12","Ezech 12:23","Amos 8:2","Obadja 1:15","Mal 4:1","1 Tess 5:2","Jak 5:8","1 Petr 4:7"]}],"2":[{"kopje":"Een dag van duisternis","refs":["Joël 2:10","Joël 2:31","Joël 3:14","Joël 3:15","Ex 20:21","Ps 97:2","Jes 5:30","Jes 8:22","Jer 13:16","Amos 5:18-20","Zef 1:14","Zef 1:15","Hebr 12:18","Judas 1:13"]},{"kopje":"als","refs":["Amos 4:13"]},{"kopje":"een groot","refs":["Joël 2:5","Joël 2:11","Joël 2:25","Joël 1:6"]},{"kopje":"er","refs":["Joël 1:2","Joël 1:3","Ex 10:6","Ex 10:14","Dan 12:1","Mark 13:19"]},{"kopje":"vele geslachten","refs":["Deut 32:7","Ps 10:6"]}],"3":[{"kopje":"vuur","refs":["Joël 1:19","Joël 1:20","Ps 50:3","Amos 7:4"]} pan class=\"wl wl-kjv\" data-code=\"H4758\">appearance</span> of them is as the <span class=\"wl wl-kjv\" data-code=\"H4758\">appearance</span> of <span class=\"wl wl-kjv\" data-code=\"H5483\">horses;</span> and as <span class=\"wl wl-kjv\" data-code=\"H6571\">horsemen,</span> so shall they run.","5":"Like the <span class=\"wl wl-kjv\" data-code=\"H6963\">noise</span> of <span class=\"wl wl-kjv\" data-code=\"H4818\">chariots</span> on the <span class=\"wl wl-kjv\" data-code=\"H7218\">tops</span> of <span class=\"wl wl-kjv\" data-code=\"H2022\">mountains</span> shall they <span class=\"wl wl-kjv\" data-code=\"H7540\">leap,</span> like the <span class=\"wl wl-kjv\" data-code=\"H6963\">noise</span> of a <span class=\"wl wl-kjv\" data-code=\"H3851\">flame</span> of <span class=\"wl wl-kjv\" data-code=\"H784\">fire</span> that <span class=\"wl wl-kjv\" data-code=\"H398\">devoureth</span> the <span class=\"wl wl-kjv\" data-code=\"H7179\">stubble,</span> as a <span class=\"wl wl-kjv\" data-code=\"H6099\">strong</span> <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> set in <span class=\"wl wl-kjv\" data-code=\"H4421\">battle</span> array.","6":"Before their <span class=\"wl wl-kjv\" data-code=\"H6440\">face</span> the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> shall be much <span class=\"wl wl-kjv\" data-code=\"H2342\">pained:</span> all <span class=\"wl wl-kjv\" data-code=\"H6440\">faces</span> shall <span class=\"wl wl-kjv\" data-code=\"H6908\">gather</span> blackness.","7":"They shall <span class=\"wl wl-kjv\" data-code=\"H7323\">run</span> like mighty <span class=\"wl wl-kjv\" data-code=\"H1368\">men;</span> they shall <span class=\"wl wl-kjv\" data-code=\"H5927\">climb</span> the <span class=\"wl wl-kjv\" data-code=\"H2346\">wall</span> like <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H4421\">war;</span> and they shall <span class=\"wl wl-kjv\" data-code=\"H3212\">march</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">one</span> on his <span class=\"wl wl-kjv\" data-code=\"H1870\">ways,</span> and they shall not <span class=\"wl wl-kjv\" data-code=\"H5670\">break</span> their ranks:","8":"Neither shall <span class=\"wl wl-kjv\" data-code=\"H376\">one</span> <span class=\"wl wl-kjv\" data-code=\"H1766\">thrust</span> <span class=\"wl wl-kjv\" data-code=\"H251\">another;</span> they shall <span class=\"wl wl-kjv\" data-code=\"H3212\">walk</span> every <span class=\"wl wl-kjv\" data-code=\"H1397\">one</span> in his <span class=\"wl wl-kjv\" data-code=\"H4546\">path:</span> and when they <span class=\"wl wl-kjv\" data-code=\"H5307\">fall</span> upon the <span class=\"wl wl-kjv\" data-code=\"H7973\">sword,</span> they shall not be wounded.","9":"They shall run to and <span class=\"wl wl-kjv\" data-code=\"H8264\">fro</span> in the <span class=\"wl wl-kjv\" data-code=\"H5892\">city;</span> they shall <span class=\"wl wl-kjv\" data-code=\"H7323\">run</span> upon the <span class=\"wl wl-kjv\" data-code=\"H2346\">wall,</span> they shall climb <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> upon the <span class=\"wl wl-kjv\" data-code=\"H1004\">houses;</span> they shall enter <span class=\"wl wl-kjv\" data-code=\"H935\">in</span> at the <span class=\"wl wl-kjv\" data-code=\"H2474\">windows</span> like a thief.","10":"The <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> shall <span class=\"wl wl-kjv\" data-code=\"H7264\">quake</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> them; the <span class=\"wl wl-kjv\" data-code=\"H8064\">heavens</span> shall <span class=\"wl wl-kjv\" data-code=\"H7493\">tremble:</span> the <span class=\"wl wl-kjv\" data-code=\"H8121\">sun</span> and the <span class=\"wl wl-kjv\" data-code=\"H3394\">moon</span> shall be <span class=\"wl wl-kjv\" data-code=\"H6937\">dark,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3556\">stars</span> shall <span class=\"wl wl-kjv\" data-code=\"H622\">withdraw</span> their shining:","11":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall <span class=\"wl wl-kjv\" data-code=\"H5414\">utter</span> his <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> his <span class=\"wl wl-kjv\" data-code=\"H2428\">army:</span> for his <span class=\"wl wl-kjv\" data-code=\"H4264\">camp</span> is <span class=\"wl wl-kjv\" data-code=\"H3966\">very</span> <span class=\"wl wl-kjv\" data-code=\"H7227\">great:</span> for he is <span class=\"wl wl-kjv\" data-code=\"H6099\">strong</span> that <span class=\"wl wl-kjv\" data-code=\"H6213\">executeth</span> his <span class=\"wl wl-kjv\" data-code=\"H1697\">word:</span> for the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> is <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> and <span class=\"wl wl-kjv\" data-code=\"H3966\">very</span> <span class=\"wl wl-kjv\" data-code=\"H3372\">terrible;</span> and who can abide","12":"Therefore also now, <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">turn</span> ye even to me with all your <span class=\"wl wl-kjv\" data-code=\"H3824\">heart,</span> and with <span class=\"wl wl-kjv\" data-code=\"H6685\">fasting,</span> and with <span class=\"wl wl-kjv\" data-code=\"H1065\">weeping,</span> and with mourning:","13":"And <span class=\"wl wl-kjv\" data-code=\"H7167\">rend</span> your <span class=\"wl wl-kjv\" data-code=\"H3824\">heart,</span> and not your <span class=\"wl wl-kjv\" data-code=\"H899\">garments,</span> and <span class=\"wl wl-kjv\" data-code=\"H7725\">turn</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> your <span class=\"wl wl-kjv\" data-code=\"H430\">God:</span> for he is <span class=\"wl wl-kjv\" data-code=\"H2587\">gracious</span> and <span class=\"wl wl-kjv\" data-code=\"H7349\">merciful,</span> <span class=\"wl wl-kjv\" data-code=\"H750\">slow</span> to <span class=\"wl wl-kjv\" data-code=\"H639\">anger,</span> and of <span class=\"wl wl-kjv\" data-code=\"H7227\">great</span> <span class=\"wl wl-kjv\" data-code=\"H2617\">kindness,</span> and <span class=\"wl wl-kjv\" data-code=\"H5162\">repenteth</span> him of the evil.","14":"Who <span class=\"wl wl-kjv\" data-code=\"H3045\">knoweth</span> if he will <span class=\"wl wl-kjv\" data-code=\"H7725\">return</span> and <span class=\"wl wl-kjv\" data-code=\"H5162\">repent,</span> and <span class=\"wl wl-kjv\" data-code=\"H7604\">leave</span> a <span class=\"wl wl-kjv\" data-code=\"H1293\">blessing</span> <span class=\"wl wl-kjv\" data-code=\"H310\">behind</span> him; even a meat <span class=\"wl wl-kjv\" data-code=\"H4503\">offering</span> and a drink <span class=\"wl wl-kjv\" data-code=\"H5262\">offering</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> your God?","15":"<span class=\"wl wl-kjv\" data-code=\"H8628\">Blow</span> the <span class=\"wl wl-kjv\" data-code=\"H7782\">trumpet</span> in <span class=\"wl wl-kjv\" data-code=\"H6726\">Zion,</span> <span class=\"wl wl-kjv\" data-code=\"H6942\">sanctify</span> a <span class=\"wl wl-kjv\" data-code=\"H6685\">fast,</span> <span class=\"wl wl-kjv\" data-code=\"H7121\">call</span> a solemn assembly:","16":"<span class=\"wl wl-kjv\" data-code=\"H622\">Gather</span> the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> <span class=\"wl wl-kjv\" data-code=\"H6942\">sanctify</span> the <span class=\"wl wl-kjv\" data-code=\"H6951\">congregation,</span> <span class=\"wl wl-kjv\" data-code=\"H6908\">assemble</span> the <span class=\"wl wl-kjv\" data-code=\"H2205\">elders,</span> <span class=\"wl wl-kjv\" data-code=\"H622\">gather</span> the <span class=\"wl wl-kjv\" data-code=\"H5768\">children,</span> and those that <span class=\"wl wl-kjv\" data-code=\"H3243\">suck</span> the <span class=\"wl wl-kjv\" data-code=\"H7699\">breasts:</span> let the <span class=\"wl wl-kjv\" data-code=\"H2860\">bridegroom</span> go <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> of his <span class=\"wl wl-kjv\" data-code=\"H2315\">chamber,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3618\">bride</span> out of her closet.","17":"Let the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests,</span> the <span class=\"wl wl-kjv\" data-code=\"H8334\">ministers</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> <span class=\"wl wl-kjv\" data-code=\"H1058\">weep</span> between the <span class=\"wl wl-kjv\" data-code=\"H197\">porch</span> and the <span class=\"wl wl-kjv\" data-code=\"H4196\">altar,</span> and let them <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> <span class=\"wl wl-kjv\" data-code=\"H2347\">Spare</span> thy <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> O <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> not thine <span class=\"wl wl-kjv\" data-code=\"H5159\">heritage</span> to <span class=\"wl wl-kjv\" data-code=\"H2781\">reproach,</span> that the <span class=\"wl wl-kjv\" data-code=\"H1471\">heathen</span> should rule <span class=\"wl wl-kjv\" data-code=\"H4910\">over</span> them: wherefore should they <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> among the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> Where is their God?","18":"Then will the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> be <span class=\"wl wl-kjv\" data-code=\"H7065\">jealous</span> for his <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> and <span class=\"wl wl-kjv\" data-code=\"H2550\">pity</span> his people.","19":"Yea, the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> will <span class=\"wl wl-kjv\" data-code=\"H6030\">answer</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> unto his <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> Behold, I will <span class=\"wl wl-kjv\" data-code=\"H7971\">send</span> you <span class=\"wl wl-kjv\" data-code=\"H1715\">corn,</span> and <span class=\"wl wl-kjv\" data-code=\"H8492\">wine,</span> and <span class=\"wl wl-kjv\" data-code=\"H3323\">oil,</span> and ye shall be <span class=\"wl wl-kjv\" data-code=\"H7646\">satisfied</span> therewith: and I will no more <span class=\"wl wl-kjv\" data-code=\"H5414\">make</span> you a <span class=\"wl wl-kjv\" data-code=\"H2781\">reproach</span> among the heathen:","20":"But I will remove far <span class=\"wl wl-kjv\" data-code=\"H7368\">off</span> from you the <span class=\"wl wl-kjv\" data-code=\"H6830\">northern</span> army, and will <span class=\"wl wl-kjv\" data-code=\"H5080\">drive</span> him into a <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> <span class=\"wl wl-kjv\" data-code=\"H6723\">barren</span> and <span class=\"wl wl-kjv\" data-code=\"H8077\">desolate,</span> with his <span class=\"wl wl-kjv\" data-code=\"H6440\">face</span> toward the <span class=\"wl wl-kjv\" data-code=\"H6931\">east</span> <span class=\"wl wl-kjv\" data-code=\"H3220\">sea,</span> and his hinder <span class=\"wl wl-kjv\" data-code=\"H5490\">part</span> toward the <span class=\"wl wl-kjv\" data-code=\"H314\">utmost</span> <span class=\"wl wl-kjv\" data-code=\"H3220\">sea,</span> and his <span class=\"wl wl-kjv\" data-code=\"H889\">stink</span> shall come <span class=\"wl wl-kjv\" data-code=\"H5927\">up,</span> and his ill <span class=\"wl wl-kjv\" data-code=\"H6709\">savour</span> shall come <span class=\"wl wl-kjv\" data-code=\"H5927\">up,</span> because he hath <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> great things.","21":"<span class=\"wl wl-kjv\" data-code=\"H3372\">Fear</span> not, O <span class=\"wl wl-kjv\" data-code=\"H127\">land;</span> be <span class=\"wl wl-kjv\" data-code=\"H1523\">glad</span> and <span class=\"wl wl-kjv\" data-code=\"H8055\">rejoice:</span> for the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> will <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> great things.","22":"Be not <span class=\"wl wl-kjv\" data-code=\"H3372\">afraid,</span> ye <span class=\"wl wl-kjv\" data-code=\"H929\">beasts</span> of the <span class=\"wl wl-kjv\" data-code=\"H7704\">field:</span> for the <span class=\"wl wl-kjv\" data-code=\"H4999\">pastures</span> of the <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness</span> do <span class=\"wl wl-kjv\" data-code=\"H1876\">spring,</span> for the <span class=\"wl wl-kjv\" data-code=\"H6086\">tree</span> <span class=\"wl wl-kjv\" data-code=\"H5375\">beareth</span> her <span class=\"wl wl-kjv\" data-code=\"H6529\">fruit,</span> the fig <span class=\"wl wl-kjv\" data-code=\"H8384\">tree</span> and the <span class=\"wl wl-kjv\" data-code=\"H1612\">vine</span> do <span class=\"wl wl-kjv\" data-code=\"H5414\">yield</span> their strength.","23":"Be <span class=\"wl wl-kjv\" data-code=\"H1523\">glad</span> then, ye <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H6726\">Zion,</span> and <span class=\"wl wl-kjv\" data-code=\"H8055\">rejoice</span> in the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> your <span class=\"wl wl-kjv\" data-code=\"H430\">God:</span> for he hath <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> you the former <span class=\"wl wl-kjv\" data-code=\"H4175\">rain</span> <span class=\"wl wl-kjv\" data-code=\"H6666\">moderately,</span> and he will cause to come <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> for you the <span class=\"wl wl-kjv\" data-code=\"H1653\">rain,</span> the former <span class=\"wl wl-kjv\" data-code=\"H4175\">rain,</span> and the latter <span class=\"wl wl-kjv\" data-code=\"H4456\">rain</span> in the first","24":"And the <span class=\"wl wl-kjv\" data-code=\"H1637\">floors</span> shall be <span class=\"wl wl-kjv\" data-code=\"H4390\">full</span> of <span class=\"wl wl-kjv\" data-code=\"H1250\">wheat,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3342\">fats</span> shall <span class=\"wl wl-kjv\" data-code=\"H7783\">overflow</span> with <span class=\"wl wl-kjv\" data-code=\"H8492\">wine</span> and oil.","25":"And I will <span class=\"wl wl-kjv\" data-code=\"H7999\">restore</span> to you the <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> that the <span class=\"wl wl-kjv\" data-code=\"H697\">locust</span> hath <span class=\"wl wl-kjv\" data-code=\"H398\">eaten,</span> the <span class=\"wl wl-kjv\" data-code=\"H3218\">cankerworm,</span> and the <span class=\"wl wl-kjv\" data-code=\"H2625\">caterpiller,</span> and the <span class=\"wl wl-kjv\" data-code=\"H1501\">palmerworm,</span> my <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H2428\">army</span> which I sent","26":"And ye shall <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> in <span class=\"wl wl-kjv\" data-code=\"H398\">plenty,</span> and be <span class=\"wl wl-kjv\" data-code=\"H7646\">satisfied,</span> and <span class=\"wl wl-kjv\" data-code=\"H1984\">praise</span> the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> your <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> that hath <span class=\"wl wl-kjv\" data-code=\"H6213\">dealt</span> <span class=\"wl wl-kjv\" data-code=\"H6381\">wondrously</span> with you: and my <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> shall <span class=\"wl wl-kjv\" data-code=\"H5769\">never</span> be ashamed.","27":"And ye shall <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> that I am in the <span class=\"wl wl-kjv\" data-code=\"H7130\">midst</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> and that I am the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> your <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> and none else: and my <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> shall <span class=\"wl wl-kjv\" data-code=\"H5769\">never</span> be ashamed.","28":"And it shall come to pass <span class=\"wl wl-kjv\" data-code=\"H310\">afterward,</span> that I will pour <span class=\"wl wl-kjv\" data-code=\"H8210\">out</span> my <span class=\"wl wl-kjv\" data-code=\"H7307\">spirit</span> upon all <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh;</span> and your <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> and your <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters</span> shall <span class=\"wl wl-kjv\" data-code=\"H5012\">prophesy,</span> your old <span class=\"wl wl-kjv\" data-code=\"H2205\">men</span> shall <span class=\"wl wl-kjv\" data-code=\"H2492\">dream</span> <span class=\"wl wl-kjv\" data-code=\"H2472\">dreams,</span> your young <span class=\"wl wl-kjv\" data-code=\"H970\">men</span> shall <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> visions:","29":"And also upon the <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> and upon the <span class=\"wl wl-kjv\" data-code=\"H8198\">handmaids</span> in those <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> will I pour <span class=\"wl wl-kjv\" data-code=\"H8210\">out</span> my spirit.","30":"And I will <span class=\"wl wl-kjv\" data-code=\"H5414\">shew</span> <span class=\"wl wl-kjv\" data-code=\"H4159\">wonders</span> in the <span class=\"wl wl-kjv\" data-code=\"H8064\">heavens</span> and in the <span class=\"wl wl-kjv\" data-code=\"H776\">earth,</span> <span class=\"wl wl-kjv\" data-code=\"H1818\">blood,</span> and <span class=\"wl wl-kjv\" data-code=\"H784\">fire,</span> and <span class=\"wl wl-kjv\" data-code=\"H8490\">pillars</span> of smoke.","31":"The <span class=\"wl wl-kjv\" data-code=\"H8121\">sun</span> shall be <span class=\"wl wl-kjv\" data-code=\"H2015\">turned</span> into <span class=\"wl wl-kjv\" data-code=\"H2822\">darkness,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3394\">moon</span> into <span class=\"wl wl-kjv\" data-code=\"H1818\">blood,</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> and the <span class=\"wl wl-kjv\" data-code=\"H3372\">terrible</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> come.","32":"And it shall come to pass, that whosoever shall <span class=\"wl wl-kjv\" data-code=\"H7121\">call</span> on the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall be <span class=\"wl wl-kjv\" data-code=\"H4422\">delivered:</span> for in <span class=\"wl wl-kjv\" data-code=\"H2022\">mount</span> <span class=\"wl wl-kjv\" data-code=\"H6726\">Zion</span> and in <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> shall be <span class=\"wl wl-kjv\" data-code=\"H6413\">deliverance,</span> as the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> and in the <span class=\"wl wl-kjv\" data-code=\"H8300\">remnant</span> whom the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall call."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"de bazuin te Sion,","tekst":"Om de gemeente bijeen te roepen ten huize des Heeren, tot een vasten en biddag; zie in vs.15, en Lev 23:2 , Lev 23:24 ."},{"catchword":"roept luide op den berg","tekst":"Anders: maakt een gebroken geklank, blaast alarm; [zie Num 10:5 ] , als wanneer de vijand ophanden is."},{"catchword":"Mijner heiligheid;","tekst":"Dat is, mijn heiligen berg; zie Psa 2:6 ."},{"catchword":"beroerd zijn,","tekst":"Of, alle inwoners des lands zullen berord zijn, of beven."},{"catchword":"dag des HEEREN komt,","tekst":"Gelijk in Joe 1:15 , zie aldaar."}],"2":[{"catchword":"duisternis en donkerheid,","tekst":"Dat is, een tijd van grote droefenis, benauwdheid, ellende en jammer, die dikwijls in de Schriftuur door duisternis worden betekend; zie Gen 15:12 ; hierdoor verstaat de profeet den verschrikkelijken en langdurigen honger, veroorzaakt door het ongedierte, waarvan in het voorgaande hoofdstuk en hier wederom in het volgende, gesproken wordt, om het volk door levedige voorstelling van de gruwelijkheid dezer plaag te bewegen tot betrachting van Gods toorn en oprechte boetvaardigheid."},{"catchword":"dageraad uitgespreid over de bergen;","tekst":"Deze straf zal het ganse land alzo haastelijk overkomen, gelijk het morgenrood zich uitspreidt over de hoogten der bergen; verg Hos 10:15 , met de aantekening."},{"catchword":"volk,","tekst":"Zie boven 1:6. Sommigen verstaan de Assyriërs, of Babyloniërs, maar het voorgaande en volgende spreekt klaarlijk van deze boze gedierten, die uit drukkelijk bij ruiters en krijgslieden worden vergeleken, onder vs.4,5, 7; zie wijders onder vs.20. Doch het kan wel zijn dat deze plagen voorboden en afbeeldingen geweest zijn van de verwoestingen der Assyriërs en Babyloniërs, gelijk God voort gaat te straffen als de mensen in zonden."},{"catchword":"van ouds niet geweest is,","tekst":"Of, in voortijden. Van zulk een betekenis is het Hebr. woord Olan; zie Jer 2:20 ; en verg. wijders de aanteek. Boven 1:2 de aantekening aldaar."},{"catchword":"hetzelve","tekst":"Te weten, na dat voorgeschreven volk."},{"catchword":"niet meer zal zijn","tekst":"Hebr. nietzal toedoen, of voortvaren."},{"catchword":"vele geslachten","tekst":"Hebr. geslacht en geslacht; dat is, in lange tijd, of [gelijk sommigen] nimmermeer."}],"3":[{"catchword":"vuur,","tekst":"Zie boven 1:19 met de aantekening."},{"catchword":"voor hetzelve","tekst":"Voor de aankomst, of als dit boze gedierte aankwam, zo stond het voor hetzelve als, enz."},{"catchword":"lusthof,","tekst":"Hebr. een, de hof van Eden. Zie Gen 2:8 , met de aantekening."},{"catchword":"woeste wildernis,","tekst":"Hebr. woestijn der wildernis; of der woeligheid, of ontzetting, [gelijk sommigen] waar men van gruwt en schrikt. Alzo onder 3:19."},{"catchword":"van hetzelve","tekst":"Dat is, niets, of [gelijk anderen] niemand zal dit voorschreven volk, dat is, dit ongedierte, dezen vijand, ontkomen."}],"4":[{"catchword":"gedaante deszelven is","tekst":"Of, het aanzien; dat is, zij zien er uit, lopen en rennen of het paarden en ruiters waren. Het schijnt dat zij van een buitengewone schrikkelijke grootte geweest zijn."}],"5":[{"catchword":"wagenen,","tekst":"Dat is, met zulk gedruis, alsof men een hoop, wagens hoorde op de bergen, waar zij zulk een bulderen en rammelen maken, dat men het verre van daar kan horen."},{"catchword":"hoogten der bergen;","tekst":"Hebr. hoofden"},{"catchword":"verteert;","tekst":"Dat een groot geruisch en gekraak veroorzaakt."},{"catchword":"slagorde gesteld is","tekst":"Zie onder 2:7-8."}],"6":[{"catchword":"in pijn zijn;","tekst":"Uit ontzetting en verslagenheid over deze ongewone schrikkelijke plaag en vrees van hongersnood."},{"catchword":"betrekken als een pot","tekst":"Hebr. vergaderen, of hebben vergaderd; te weten, de verf van een pot, die te vuur gaat en door vlam en rook misverwig is. Anders: hebben de schoonheid ingetrokken, samengetrokken, gelijk de vrees en bangheid der mensen de sierlijke kleur uit het aangezicht doet vergaan, zodat zij bleek, paars, enz., er uitzien."}],"7":[{"catchword":"muren beklimmen;","tekst":"Hebr. muur, gelijk vs.9."},{"catchword":"wegen,","tekst":"Als soldaten, oprukkende onder het beleid van hun overste."},{"catchword":"verdraaien","tekst":"Of, hunne tochten niet verachteren; gelijk soldaten wel doen, die uit hun gelid of de tochtorde afwijken, of in verwarring geraken."}],"8":[{"catchword":"de een den ander niet dringen;","tekst":"Hebr. de man, of een ieder zijnen broeder."},{"catchword":"elk in zijn baan;","tekst":"Hebr. de man."},{"catchword":"geweer,","tekst":"Of, een lang, bloot zwaard; zie 2Ch 23:10 , en Neh 4:17 . De zin is: dat zij met geen tegenweer, al ware het nog zo scherp, zullen kunnen worden afgekeerd, zij zouden [om zo te spreken] door blote zwaarden onbeschadigd doordringen."}],"9":[{"catchword":"omlopen,","tekst":"Of, huppelen, springen."}],"10":[{"catchword":"De aarde is beroerd","tekst":"Dit zijn figuurlijke manieren van spreken,betekenende algemene en verschrikkelijke verwoestingen en zware oordelen Gods, voor welke zich hemel en aarde [om zo te spreken] ontzetten; zie Isa 13:10 ; Eze 32:7 , en onder 3:15."},{"catchword":"deszelfs aangezicht,","tekst":"Dat is, vanwege de aankomst en tegenwoordigheid van het voorschreven heir."},{"catchword":"zwart,","tekst":"Dat is, verdonkerd, gevende geen licht."},{"catchword":"trekken haar glans in","tekst":"Hebr. eigenlijk, hebben verzameld; dat is, ingetrokken, verhouden, zodat zij geen schijnsel geven. Alzo onder 3:15."}],"11":[{"catchword":"stem voor Zijn heir henen;","tekst":"Gebiedende en moed gevende aan dit zijn leger [gelijk onder vs.25] als krijgsoverste, of dondert voor dit zijn heirleger henen; zie Psa 29 ."},{"catchword":"Hij is machtig,","tekst":"De Heere. Anders: het, te weten, heirleger."},{"catchword":"woord;","tekst":"Dat is, uitvoerende wat Hij gesproken en voorzegd heeft; of, het [voorzegde leger des Heeren] is machtig, verrichtende zijn [des Heeren] bevel."},{"catchword":"dag des HEEREN is groot","tekst":"Gelijk boven 1:15."}],"12":[{"catchword":"tot Mij met uw ganse hart,","tekst":"Hebr. tot mij toe; gelijk enigen dit nemen. Alzo wordt het Hebr. woord in deze zaak ook gebruikt; Deu 4:30 ; Lam 3:40 ; Hos 14:2 ; Amo 4:6 , Amo 4:8-9 , Amo 4:11 , betekenende [gelijk sommigen verstaan] dat God niet tevreden is met een schijn, of vliegende gedachte en een los opzet, of half hart, maar dat Hij wil hebben een oprechte afkering van het kwade en bekering tot Hem en het goede, geenzins tot afgoden of andere ijdelheden. En alzo zouden de volgende woorden, idem het scheuren der harten, en met uw ganse hart, dienen tot verklaring van den nadruk van dit woord; verg. Hos 6:4 , en Hos 7:16 met de aantekening. Doch anderen nemen het slechts voor een woord tot."},{"catchword":"en dat met vasten en met geween, en met rouwklage","tekst":"Alzo wordt de Hebr. letter Vau ook elders gebruikt, voor en dat, of zelfs. Zie Jer 17:10 , en onder 2:32."}],"13":[{"catchword":"scheurt uw hart","tekst":"Verg. Psa 34:19 , en Psa 51:19 ."},{"catchword":"niet uw klederen,","tekst":"Dat is, niet alleen, zonder de harten te scheuren, niet zozeer, niet voornamelijk; zie Hos 6:6 ."},{"catchword":"lankmoedig","tekst":"Zie Lev 14:18 ."},{"catchword":"groot van goedertierenheid,","tekst":"Of, veelvoudig, overvloedig."},{"catchword":"kwade","tekst":"Versta, het kwaad der straf, dat God afwendt, matigt, enz., wanneer Hij menselijk gezegd wordt berouw te hebben, zie Gen 6:6 , alzo in het volgende vers."}],"14":[{"catchword":"Wie weet,","tekst":"Hiermede trekt de profeet geenszins in twijfel of God de oprecht boetvaardige zondaars in genade wil ontvangen, de zonden vergeven en de zaligheid schenken, [dat de Schriftuur overal buiten twijfel stelt] maar Hij geeft met deze manier van spreken te kennen dat Hij de hoop heeft en wenst dat zij zich mogen bekeren, en dat God alsdan deze zware tijdelijke plaag zal afwenden, verachten, matigen, enz., gelijk het volgende uitwijst; waarin God met de zijnen handelt naar Zijn Vaderlijk welbehagen, zoals Hij verstaat te dienen tot zijne eer en de zaligheid der boetvaardigen. Ook gaat de profeet met deze grove zondaars bij trappen, eerst hun hoop gevende van vermindering der straffen, daarna op het voltrekken van de daad der boetvaardigheid, hen daarvan verzekerende, vs.18,19, enz., welke voorzienigheid Gods dienstknechten in zulk een geval navolgen. Verg. Jos 14:12 ; Est 4:14 ; Lam 3:29 ; Amo 5:15 ; Jon 3:9 ; Zep 2:3 ."},{"catchword":"zegen","tekst":"Van gewas en landvruchten, dat niet alles bedorven worde. Alzo worden tijdelijke gaven een zegen des Heeren genoemd, Gen 39:5 ; Lev 25:21 ; Isa 65:8 ; Hag 2:20 ; zie ook Gen 12:2 , en Gen 33:11 ; 2Ki 18:31 ."},{"catchword":"Zich overlaten","tekst":"Als hij door het land met zijn oordeel zal doortrekken; verg. Exo 12:12 ; Amo 5:17 ; idem Psa 65:12 , met de aantekening. Anders: achter hetzelce, te weten, heirleger, of tevoren beschreven volk, dat ongedierte, dat door het land doortrekken zal, zulks dat er nog wat overblijve, waarvan men spijsoffer enz. kan offeren."},{"catchword":"spijsoffer en drankoffer","tekst":"Zie boven 1:9."}],"15":[{"catchword":"Blaast de bazuin te Sion,","tekst":"Zie vs.1."},{"catchword":"heiligt een vasten,","tekst":"Zie boven 1:14."},{"catchword":"verbodsdag uit","tekst":"Gelijk boven 1:14."}],"16":[{"catchword":"heiligt de gemeente,","tekst":"Zie Exo 19:10 ."},{"catchword":"oudsten,","tekst":"Die met hun goed voorbeeld den jongen behoren voor te gaan, en anders doende en gedaan hebbende, de oorzaak worden van een algemeen verderf."},{"catchword":"kinderkens,","tekst":"Zie Psa 8:3 . Dit diende om de ouders door het aanschouwen van hun jonge kinderen [die ook leden der gemeente en Gods bondgenoten waren] te krachtiger van hunne schuld te overtuigen en tot deernis en boetvaardigheid bewegen, dewijl de onmondige kindertjes, in deze algemene landplaag, door der ouders zware zonden veroorzaakt, mede moesten lijden, zelfs ook de beesten, zie Joe 1:18 ; idem, om God den algemenen nood en ellende der jongen en ouden, alle leden van zijn volk, met boetvaardige bewegingen als voor zijne ogen in zijn huis, te tomen; verg. 2Ch 20:13 , en Jon 3:7 ; alwaar ook de beesten in dezen tot dergelijk einde betrokken worden."},{"catchword":"bruidegom","tekst":"Stelt alle ook anderzins geoorloofde, vreugde en vermaak ter zijde, en begeeft u tot vasten en bidden. Verg. 1Co 7:5 ."},{"catchword":"slaapkamer","tekst":"Of, bruidkamer, verdek, vertrek."}],"17":[{"catchword":"voorhuis en het altaar,","tekst":"Zie 1Ki 6:3 ; Joh 10:23 ; Act 3:11 en Act 5:12 ."},{"catchword":"geef Uw erfenis","tekst":"Of, stel uwe erfenis niet tot, enz. alzo in vs.19."},{"catchword":"heersen;","tekst":"Gelijk ene stad haast gewonnen wordt, die met geen lijftocht is voorzien, alzo konden de omliggende heidenen het Joodse volk lichtelijk overmeesteren, wanneer zij in zulk een langdurigen hongersnood en gebrek aan alles zouden blijven en vergaan. Anders: dat de heidenen spreekwoorden van hen zouden gebruiken; omdat het Hebr. woord ook alzo elders gebruikt wordt; zie Eze 17:2 , en Eze 18:2 , enz.; omdat de spreekwoorden en spreuken in de redenen uitsteken, en als heerschappij hebben; zie 1Ki 4:32 ."}],"18":[{"catchword":"zal de HEERE","tekst":"Anders, en de Heere ijverde, enz. en verschoonde, enz., en antwoordde, enz., of heeft geijverd, en zo voorts; dat is, Hij heeft alrede verhoord en mij belast zijn boetvaardig volk aan te zeggen hetgeen volgt; of profetischerwijze, Hij heeft, enz., dat is, Hij zal alsdan gewisselijk, enz."},{"catchword":"ijveren","tekst":"In medelijden, liefde en weldadigheid aan zijn boetvaardig volk, en wraak over de goddeloze vijanden, om de eer van zijn heiligen naam, die bij de vijanden vanwege deze plaag van zijn land en van zijn volk, gelasterd is; gelijk Hij tevoren ijverde over zijne eer, straffende de zonden van zijn volk; zie Deu 4:24 , en Eze 39:25 , enz."},{"catchword":"Zijn land,","tekst":"Gelijk in Joe 1:6 , zie aldaar."}],"19":[{"catchword":"zend ulieden","tekst":"Dat is, zal haast geven, beschikken, maken dat gij het hebben zult."},{"catchword":"daarvan verzadigd zult worden;","tekst":"Dat is, van elk genoeg zult hebben, tot uw levensonderhoud en verkwikking, of vrolijk gebruik."},{"catchword":"niet meer overgeven","tekst":"Versta onder voorwaarde van gehoorzaamheid. Of, wijders, voortaan niet stellen, enz. Dat is, Ik zal niet voortvaren aldus te plagen. Verg. dit antwoord van God met het gebed in vs.17."},{"catchword":"smaadheid onder de heidenen","tekst":"Waarvan vs.17. Verg. Eze 36:29-30 ."}],"20":[{"catchword":"dien","tekst":"Te weten, dat voorzegde heir van sprinkhanen, enz., die van het noorden in Juda gekomen waren, en voorts wel mogen gehouden worden voor afbeeldingen en voorboden der Assyriërs en Babyloniërs, die van het noorden ook zouden komen, en hier van sommigen door die van het noorden verstaan worden, gelijk in Joe 1:4 is aangetekend."},{"catchword":"dor en woest land,","tekst":"Hebr. een land der dorheid en woestheid. Zie Deu 1:19 , en Deu 8:15 ."},{"catchword":"aangezicht","tekst":"Dat is, het ene of voorste deel van dit ongedierte, de voortocht."},{"catchword":"Oostzee,","tekst":"De Dode zee, in het zuidoosten van Kanaän. De plaats waar Sodom en Gomorra, enz., vergaan zijn; of de zee Cinnereth, of Genesareth, in het noordoosten. Verg. de profetie van Gog, Eze 39:11 ."},{"catchword":"einde","tekst":"Dat is, achterste deel, achtertocht."},{"catchword":"achterste zee;","tekst":"Dat is, in de Middellandse zee. Zie Deu 11:24 , en Zec 14:8 ."},{"catchword":"zijn stank zal opgaan,","tekst":"Versta, den vuilen stank van dit heirleger der sprinkhanen, enz., wanneer zij van God weder zullen vernield worden, en alsdan vergaan en vervuilen, als een stinkend aas. Verg. Isa 34:3 ."},{"catchword":"vuiligheid zal opgaan;","tekst":"Of, zware, vuile sterke reuk."},{"catchword":"hij heeft grote dingen gedaan","tekst":"Te weten, die van het noorden, dat voorzegde heir, Hebr. hij heeft groot gemaakt, of zich groot gemaakt, of hij heeft het groot gemaakt met, of in doen, of handelen; dat is, hij zal stoutelijk gehandeld, Juda als bespot en grote ellende veroorzaakt hebben, waartegen in het volgende gesteld wordt, dat God ook integendeel recht grote dingen zal doen; vernielende dit groot en machtig heir, dat Hij zelf tevoren in zijnen toorn over Juda gezonden had. Men kan hiermede enigzins vergelijken Psa 35:26-27 ; alwaar ook tegen elkander gesteld worden, dat de vijanden zich tegen David groot maakten, en de vromen daartegen zeggen: De Heere zij groot gemaakt, of worde groot, zij groot; dat is, als groot geroemd. Zie aldaar. Sommigen duiden dit, zowel als het volgende in vs.21, ook op den Heere."}],"21":[{"catchword":"o land","tekst":"Gij inwoners van het land Juda; of, het is ene aanspraak aan het land, gelijk in het volgende aan de beesten, gelijk elders dikwijls. Verg. Deu 32:1 , en Joe 1:10 ; Eze 21:16 , met de aantekening."},{"catchword":"heeft grote dingen gedaan","tekst":"Dat is, zal waarlijk grote dingen doen, die eensdeels in het voorgaande, doch meest in het volgende verhaald zijn. Hebr. gelijk in het voorgaande vs.20. Verg. Isa 28:29 ."}],"22":[{"catchword":"beesten des velds","tekst":"Verg. Joe 1:18-20 . Dit is als een antwoord op het schreeuwen der beesten tot God."},{"catchword":"zullen weder","tekst":"Hebr. eigenlijk, hebben voortgebracht; en zo in het volgende, dat is, zullen zo zekerlijk voortbrengen, alsof het voor ogen ware."},{"catchword":"wijnstok en vijgeboom","tekst":"Verg. Joe 1:7 , Joe 1:11-12 , en Lev 26:4 , Lev 26:20 ."}],"23":[{"catchword":"zal u geven","tekst":"Hebr. heeft u gegeven dien leraar ter gerechtigheid, of der gerechtigheid; of dien leraar [te weten, den leraar] der gerechtigheid; dat is, Hij zal u zekerlijk geven den beloofden Messias, Jezus Christus den oppersten profeet en herder der zielen, die uitwendig zal leren door het Woord van het Evangelie, en inwendig door zijne Geest, krachtiglijk werkende het rechtvaardigmakende geloof in Hem, die alleen onze gerechtigheid is voor God, Jer 23:6 . Aldus stelt God de belofte van den Messias vooraan, als zijnde het fondament van Zions vreugde en van alle verbondszegeningen die in het volgende verhaald worden. Doch alzo het Hebr. woord, [tweemalen in dit vers gebruikt] niet allen een leraar betekent, maar ook den vroegen regen, [omdat Gods heilzame weldaden en zijne lering, en de regen in lieflijkheid en nuttigheid elkander zeer gelijk zijn; zie Deu 32:2 ; Hos 6:3 , en Hos 10:12 , met de aantekening] gelijk hier terstond in ditzelfde vers; zo nemen sommigen dit woord hier in enerlei betekenis, aldus: Hij zal ulieden geven den vroegen regen; ja Hij zal u doen nederdalen den vroegen regen, en spaden regen recht, of juist te pas, of mildelijk. Verstaande dat de geestelijke beloften eerst beginnen in Joel 2:28. Verg. met deze plaats Psa 85:11-14 ; Isa 30:19-21 ,Isa 30:23 , en Isa 45:8 ; Eze 34:24-26 , enz., en Eze 36:24-25 , enz., alwaar geestelijke beloften onder de lichamelijke worden vermengd; gelijk zij elders dikwijls door de lichamelijke worden afgebeeld en daarbij vergeleken, zie Psa 22:27 , Psa 22:30 , en Psa 36:9 ; Hos 2:21 , enz., en Hos 6:3 ; Amo 9:13 ; idem onder Joël. 3:18 met de aantekening, waarop de aandachtige lezer in het volgende kan letten. Ook wordt wel somtijds een woord, in een vers in tweeërlei betekenis genoemn, gelijk Jdg 10:4 . Aijarim, voor ezelsveulens en voor steden. Psa 74:19 , shaijah, voor een wilden hoop, of wild gedierte, dat is de vijanden, en voor een hoop ellendige en vromen lieden; dat is, Gods kerk, Ecc 7:6 . Sir, voor een doorn en een pot, Eze 21:22 . Carim, [naar velen gevoelen] voor hoplieden, en voor stormrammen, idem, aardiglijk, dood, in verscheidene betekenis, Mat 8:22 , enz. Voorts staat het woord Moreh in het tweed lid van dit vers wat anders, en met bijvoeging van geschem, [dat] regen, plasregen, stortregen [betekent] daar het in het eerste lid alleen staat. Dit kan den Heiligen Geest alzo beliefd hebben, om de betekenis van het eerste Moreh te onderscheiden van het tweede."},{"catchword":"eerste maand","tekst":"Namelijk Nisan, of Abib, verstaande dit van den spaden regen, dien God vóór den oogst gaf; zie Exo 34:18 . Of, [gelijk sommigen] in het eerste met den eersten; dat is, vroeg, tijdelijk, terrechter of bekwamer tijd, met den eersten, als het tijd zal zijn."}],"25":[{"catchword":"jaren","tekst":"Dat is, de vrucht der jaren, gelijk het volgende uitwijst. Hier blijkt klaarlijk dat deze verschrikkelijke plaag enige jaren geduurd heeft."},{"catchword":"vergelden,","tekst":"Gevende u zulk een overvloed van landvruchten in den volgenden tijd, dat de geleden schade vervuld of vergoed zal zijn."},{"catchword":"Mijn groot heir,","tekst":"Gelijk in vs.11."}],"26":[{"catchword":"overvloediglijk","tekst":"Hebr. eten etende en verzadigd wordende."},{"catchword":"Die","tekst":"Of, omdat Hij, dat Hij, enz."},{"catchword":"wonderlijk","tekst":"Hebr. met, of bij u gedaan, of gehandeld heeft wonderlijk doende, of handelende."},{"catchword":"zal niet beschaamd worden","tekst":"Hebr. zullen, enz.; alzo in het volgende vers, dat is, Ik zal hen verlossen van deze beschaamdheid, die zij bij de omliggende heidenen, om deze mijne plaag, geleden zullen hebben, en voorts in het algemeen [volgens mijne verbondsbeloften in den] Messias bezorgen dat mijne kerk nimmermeer in haar boetvaardige gebeden en vertrouwen op mij zal bedrogen worden. Verg. Isa 29:22 , enz."}],"27":[{"catchword":"weten,","tekst":"Of, bekennen; dat is ervaren, ondervinden, door de tegenwoordigheid van den Messias onder u, en de zegeningen die gij in Hem genoten hebt en genieten zult; verg. Zep 3:14-17 ; Joh 1:14 ; op wiens komst en tegenwoordigheid de uitzending van den Heilige Geest zal volgen, waarvan in vs.28."},{"catchword":"uw God, ben,","tekst":"Zie Gen 17:7 ."}],"28":[{"catchword":"zal het geschieden,","tekst":"In de laatste dagen, na de komst en verschijning van den Messias in het vlees; zie Act 2:17 ."},{"catchword":"Geest","tekst":"Dat is, de gaven van mijn Heiligen Geest; verg. Psa 68:19 ; Eph 4:8 ."},{"catchword":"uitgieten","tekst":"Met veel groter overvloed en meerdere verscheidenheid van gaven dan vóór de komst van den Heere Christus en zijne hemelvaart geschied was. Zie Joh 7:39 ; Act 2:33 ."},{"catchword":"alle vlees,","tekst":"Dat is, allerlei vlees, mensen van allerlei stand of rang, gelijk in het volgende verklaard wordt, idem van allerlei natiën. Verg. Psa 65:3 , met de aantekening aldaar."},{"catchword":"profeteren;","tekst":"Dat is, zij zullen de verborgenheden van het heilige Evangelie door de werking en openbaring van den Heiligen Geest verstaan en verklaren. Zie Hos 12:11 met de aantekening. Deze manieren van spreken zijn genomen van den staat van het Oude Testament, alwaar God zich aan de pofeten openbaarde door dromen en gezichten; zie Num 12:6 ."}],"30":[{"catchword":"wondertekenen geven","tekst":"De manieren van spreken, die in deze twee verzen gebruikt worden, betekenen de vreemde, verschrikkelijke algemene beroerten, ellenden, verwoestingen en benauwdheden, die de wereld zullen overkomen tot op de toekomst van den Heere Christus om te oordelen de levenden en de doden. Verg. vs.10, en Joe 3:15 ; Mat 24:29 ; Mar 13:24-25 ; Luk 21:25-26 , en Rev 6 :tot Rev 20 :toe."},{"catchword":"in den hemel en op de aarde","tekst":"Of, aan."}],"32":[{"catchword":"geschieden,","tekst":"Onder al de voorzegde beroerten."},{"catchword":"al","tekst":"Hetzij Joden of heidenen; Rom 10:12-13 ."},{"catchword":"Naam des HEEREN zal aanroepen,","tekst":"Dat is, die den Heere recht dient, en in al deze zwarigheden zijn toevlucht tot Hem neemt door gelovige gebeden."},{"catchword":"behouden worden;","tekst":"Of, uitgered, bevrijd, en vervolgens behouden worden, van zonde, duivel en dood; en, ofschoon hij in lichamelijke ellenden mocht worden betrokken, of om Christus' naam lijden en sterven, zal hij toch hier een genadigen God in den Messias en een bestendigen troost in leven en sterven, en hierna de eeuwige zaligheid hebben."},{"catchword":"Sions","tekst":"Dat is, daar zal behoudenis en zaligheid zijn alleen in de ware kerk, die te dien tijde binnen Jeruzalem op den berg Zion tot den godsdienst placht te vergaderen. Zie Psa 2:6 ."},{"catchword":"gezegd heeft;","tekst":"Tot of door mij en andere zijne profeten; [alzo in Joe 3:8 ] , en dienvolgens zal het zekerlijk alzo geschieden, ofschoon het ten aanzien van des mensen verdiensten en krachten gans onmogelijk is."},{"catchword":"en dat,","tekst":"Of, te weten,. Zie van zu  and unto true repentance] Spread forth upon the mountains as the day breaks [this punishment was to surprise the whole land all over as suddenly, as the day-break overspreads the tops of the mountains all at once. Compare Hos. 10.15 with annotate. ] a great and mighty people, [ some do understand the Assyrians and Babylonians hereby ( See ch.1. on v. 6.) but that which both goeth before and followeth, doth plainly speak of these vermin, or devouring creatures, which are expresly compared to horsemen and soldiers, below, v.4, 5, 7. See further bel. Vers. 20. yet it may well be, that these plagues were the fore-runners and tokens of the desolations to come by the Assyrians and Babylonians, according to Gods method, of going on to punish as men go on in sin] such as was not of old, [ or, in former times of the Heb. word Olam, thus taken see Jer. 2. on verse 20. and compare further the annot. Above chap. 1. on verse 2.] and shall be no more [ Heb. generation and generation i.e in a very long time, or according to some, never more.]"}],"3":[{"catchword":null,"tekst":"Before the same a fire doth consume, and after the same a flame burneth; [ See above chap. 1. 19. with the annotate.] the land before the same [i.e. before their approach ]is a garden of pleasure ,[Heb. a, or, the garden of Eden see Genesis .8 with the annotate i.e before this judgment came the land was like a paradise ,]but after the same a waste wilderness ,Heb desert of wilderness or of desolation or loathsomeness as some which one abhorreth and is frighhted with and so below chap.3.19.[ neither is there any escaping of them .]that is nothing ,or as others nobody shall escape his aforesaid people ,i.e. this vermine this enemy .]"}],"4":[{"catchword":null,"tekst":"The shape of them is as the shape of the horses :[Or the regard i.e. they look runne and transport themselves about , as if they were so many horses and riders .it should seem they were of a more and ordinary greatness] and they shall run like horsemen ."}],"5":[{"catchword":null,"tekst":"They shall leap on like a noise of charets ,on the heights or heads of the mountains ;[i.e. they shall make such a noise with their coming ,as if one heard a great number of chariots running and rumbling upon the hills ,which is heard a great way off ]as the noise of the fiery flame, that consumeth the fiubble :[ which like wise make a great noise ,and is heard a far off ]as a mighty people ,tat is set in battle-aray .[ see below verse 7.8.]"}],"6":[{"catchword":null,"tekst":"From the face of the nations shall be in pain ;[terrible and perplexed at this unusual plague ,and the famine threatened thereby ] all faces shall draw on like a pot [Heb shall gather or have gathered ,to wit ,the color of a pot ,used at the fire ,and by the flame and smoke attracting a sad color .others have drawn in ,or, contracted the beauty ,according as we see fear and anguish doth dull and sadden the lively hue and color of the face ,and makes man look wan and pale .]"}],"7":[{"catchword":null,"tekst":"They shall run as champions ,as men of war shall they climb the wall :[Heb wall as verse 9.] and they march on ,everyone is in his ways ,[as soldiers ,marching under the conduct of their commanders ]and shall not turn their paths [or not slacken their march as soldiers used to do sometimes ,by breaking their orders ,or ,quitting their ranks and files ,or otherwise getting in confusion .]"}],"8":[{"catchword":null,"tekst":"Neither shall they throng one another; [Heb the man or everyone his brother] they shall march on, each one in his path :[Heb the man in his ] and though they should fall upon a weapon ,[or, a long naked sword .[See 2 Chron23 on verse 10 and Neh 4 on verse 17 .]they shall not be wounded the meaning is that they shall not be diverted or kept by any weapon be it never so sharp they should pass as it were through the midst of pikes and naked swords without being hurt .]"}],"9":[{"catchword":null,"tekst":"They shall run about [or leap skip] in the city they shall run upon the walls, they shall into the houses; they shall come in through the windows like a thief."}],"10":[{"catchword":null,"tekst":"The earth is troubled before the face thereof. [i.e. because of the approach and the presence of the aforesaid host]The sun and moon grow black [i.e. they shine obscurely ,or give but little light ] and the stars draw in their splendour ,[Heb properly have gathered ,c. i.e. kept back ,withdrawn ,withheld and so below chap 3.15 these are figurative expression signifying the general and earful desolations and heavy judgments of God ,at which even heaven and earth shall stand amazed and astonished in a manner .see Isiah 13.10 Eze 32:7 and below here chap 3.15.]"}],"11":[{"catchword":null,"tekst":"And the Lord raiseth his voice along before his host ,changing and encouraging the same as below verse 25like their commander in chief ;or thrundreth along before his host see Psalms 29.] for his camp is very great :for he is mighty [He ,viz the Lord ;or it to wit, that the host doing his word ;[executing that which he spake or foretold or referring it to the host of the Lord executing his command ] the day of the Lord [as above chap 1.15 Jeremiah30.7 Amos 5.18 Zeph1.15.] is great and very dreadful, and who shall endure it ?"}],"12":[{"catchword":null,"tekst":"Now then also saith the Lord ,convert your yourselves to me with all your heart :[Heb even unto me ;as some take this ,thus the Hebrew particle is likewise taken in this matter ,Deut 4.30 Lam 3:40. Amos 4.6,8,9,11. Hos. 14.1 implying as some do understand that God is not pleased with a shew ,or flying thought ,and a lose purpose or half a heart ,but requireth an upright turning away from evil and conversion to himself and that which is good in no wise to idols or any other vanities whatsoever and thus the following words and the rending of the heart ,and with all the heart, should serve to explain the emphasis or force of this particle .Compare Hosiah 6.4 /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL',

  ];
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    const inhoud = lijst.map(it => it.catchword
      ? `<div class="uitleg-item"><span class="uitleg-cw">${md(it.catchword)}</span>${md(it.tekst)}</div>`
      : `<div class="uitleg-item">${md(it.tekst)}</div>`
    ).join('');
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
