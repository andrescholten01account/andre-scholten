adja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Op de vierentwintigste dag van de maand, in de zesde *maand*, in het tweede jaar van koning Darius.","2":"In de zevende *maand*, op de eenentwintigste van de maand, kwam het woord van de HEERE door de dienst van de profeet Haggai. Hij zei:","3":"Spreek nu tot Zerubbabel, de zoon van Sealthiël, de vorst van Juda, en tot Josua, de zoon van Jozadak, de hogepriester, en tot het overblijfsel van het volk. Zeg:","4":"Wie is er onder u overgebleven die dit huis in zijn eerste heerlijkheid gezien heeft? En hoe ziet u het nu? Is dit niet als niets in uw ogen?","5":"Toch nu, wees sterk, Zerubbabel! spreekt de HEERE; en wees sterk, Josua, zoon van Jozadak, hogepriester! en wees sterk, al u volk van het land! spreekt de HEERE; en werk, want Ik ben met u, spreekt de HEERE van de heerscharen[1];","6":"Met het woord, waarmee Ik met u *een verbond* gemaakt heb, toen u uit Egypte trok, en met Mijn Geest, die in uw midden staat: wees niet bevreesd!","7":"Want zo zegt de HEERE van de heerscharen: Nog eenmaal, over een korte *tijd*, zal het zover zijn; en Ik zal de hemel, en de aarde, en de zee, en het droge doen beven.","8":"Ja, Ik zal alle heidenvolken doen beven, en zij zullen komen *tot* de Wens van alle heidenvolken, en Ik zal dit huis met heerlijkheid vervullen, zegt de HEERE van de heerscharen.","9":"Mijn is het zilver, en Mijn is het goud, spreekt de HEERE van de heerscharen.","10":"De heerlijkheid van dit laatste huis zal groter worden dan die van het eerste, zegt de HEERE van de heerscharen; en in deze plaats zal Ik vrede geven, spreekt de HEERE van de heerscharen.","11":"Op de vierentwintigste *dag* van de negende *maand*, in het tweede jaar van Darius, kwam het woord van de HEERE door de dienst van de profeet Haggai. Hij zei:","12":"Zo zegt de HEERE van de heerscharen: Vraag nu de priesters naar de wet. Zeg:","13":"Zie, iemand draagt heilig vlees in de slip van zijn kleed, en hij raakt met zijn slip het brood aan, of het moes, of de wijn, of de olie, of enig voedsel, zal dat heilig worden? En de priesters antwoordden en zeiden: Nee.","14":"En Haggai zei: Als iemand die onrein is door een dood lichaam iets van die dingen aanraakt, zal het onrein worden? En de priesters antwoordden en zeiden: Het zal onrein worden.","15":"Toen antwoordde Haggai en zei: Zo is dit volk, en zo is deze natie voor Mijn aangezicht, spreekt de HEERE, en zo is al het werk van hun handen; en wat zij daar offeren, dat is onrein.","16":"En nu, zet er toch uw hart op, vanaf deze dag en verder, voordat er steen op steen gelegd werd aan de tempel van de HEERE;","17":"Voordat die *dingen* gebeurden, kwam iemand bij de *koren*hoop van twintig *maten*, en er waren er maar tien; kwam iemand bij de wijnbak om vijftig *maten* uit de pers te putten, en er waren er maar twintig.","18":"Ik sloeg u met brandkoren, met honingdauw en met hagel, al het werk van uw handen; en u *keerde* u niet tot Mij, spreekt de HEERE.","19":"Zet er toch uw hart op, vanaf deze dag en verder; vanaf de vierentwintigste dag van de negende *maand*, vanaf de dag waarop het fundament van de tempel van de HEERE gelegd is, zet er uw hart op.","20":"Is er nog zaad in de schuur? Zelfs de wijnstok, en de vijgenboom, en de granaatappelboom, en de olijfboom, die niet gedragen hebben, die zal Ik vanaf deze dag zegenen.","21":"Het woord van de HEERE nu kwam voor de tweede maal tot Haggai, op de vierentwintigste van de maand. Hij zei:","22":"Spreek tot Zerubbabel, de vorst van Juda: Ik zal de hemel en de aarde doen beven.","23":"En Ik zal de troon van de koninkrijken omkeren, en de vastigheid van de koninkrijken van de heidenvolken verdelgen; en Ik zal de wagen omkeren, en degenen die daarop rijden; en de paarden, en degenen die daarop rijden, zullen neerstorten, ieder door het zwaard van de ander.","24":"Op die dag, spreekt de HEERE van de heerscharen, zal Ik u nemen, Zerubbabel, zoon van Sealthiël, Mijn dienstknecht! spreekt de HEERE, en Ik zal u stellen als een zegelring; want Ik heb u verkozen, spreekt de HEERE van de heerscharen."},"SV":{"1":"Op den vier en twintigsten dag der maand, in de zesde *maand*, in het tweede jaar van den koning Darius.","2":"In de zevende *maand*, op den een en twintigsten der maand, geschiedde het woord des HEEREN door den dienst van den profeet Haggai, zeggende:","3":"Spreek nu tot Zerubbabel, den zoon van Sealthiël, den vorst van Juda, en tot Josua, den zoon van Jozadak, den hogepriester, en tot het overblijfsel des volks, zeggende:","4":"Wie is onder ulieden overgebleven, die, dit huis in zijn eerste heerlijkheid gezien heeft, en hoedanig ziet gij hetzelve nu? Is dit niet als niets in uw ogen?","5":"Doch nu, wees sterk, gij Zerubbabel! spreekt de HEERE; en wees sterk, gij Josua, zoon van Jozadak, hogepriester! en wees sterk, al gij volk des lands! spreekt de HEERE; en werkt, want Ik ben met u, spreekt de HEERE der heirscharen;","6":"Met het woord, in hetwelk Ik met ulieden *een* *verbond* gemaakt heb, als gij uit Egypte uittrokt, en Mijn Geest, staande in het midden van u; vreest niet!","7":"Want alzo zegt de HEERE der heirscharen: Nog eens, een weinig *tijds* zal het zijn; en Ik zal de hemelen, en de aarde, en de zee, en het droge doen beven.","8":"Ja, Ik zal al de heidenen doen beven, en zij zullen komen *tot* den Wens aller heidenen, en Ik zal, dit huis met heerlijkheid vervullen, zegt de HEERE der heirscharen.","9":"Mijn is het zilver, en Mijn is het goud, spreekt de HEERE der heirscharen.","10":"De heerlijkheid van dit laatste huis zal groter worden, dan van het eerste, zegt de HEERE der heirscharen; en in deze plaats zal Ik vrede geven, spreekt de HEERE der heirscharen.","11":"Op den vier en twintigsten *dag* der negende *maand*, in het tweede jaar van Darius, geschiedde het woord des HEEREN door den dienst van den profeet Haggai, zeggende:","12":"Alzo zegt de HEERE der heirscharen: Vraag nu den priesters de wet, zeggende:","13":"Ziet, iemand draagt heilig vlees in de slip van zijn kleed, en hij raakt met zijn slip aan het brood, of aan het moes, of aan den wijn, of aan de olie, of aan enige spijze, zal het heilig worden? En de priesters antwoordden, en zeiden: Neen.","14":"En Haggai zeide: Indien iemand, die onrein is van een dood lichaam, iets van die dingen aanroert, zal het onrein worden? En de priesters antwoordden, en zeiden: Het zal onrein worden.","15":"Toen antwoordde Haggai, en zeide: Alzo is dit volk, en alzo is deze natie voor Mijn aangezicht, spreekt de HEERE, en alzo is al het werk hunner handen; en wat zij daar offeren, dat is onrein.","16":"En nu, stelt er toch ulieder hart op, van dezen dag af en opwaarts, eer er steen op steen gelegd werd aan den tempel des HEEREN;","17":"Eer die *dingen* geschiedden, kwam iemand tot den *koren* hoop van twintig *maten*, zo waren er *maar* tien; komende tot den wijnbak, om vijftig *maten* van de pers te scheppen, zo waren er *maar* twintig.","18":"Ik sloeg ulieden met brandkoren, met honigdauw en met hagel, al het werk uwer handen; en gij *keerdet* u niet tot Mij, spreekt de HEERE.","19":"Stelt er toch uw hart op, van dezen dag af en opwaarts; van den vier en twintigsten dag der negende *maand* af, van den dag af, als het fondament aan den tempel des HEEREN is gelegd geworden, stelt er uw hart op.","20":"Is er nog zaad in de schuur? Zelfs tot den wijnstok, en den vijgeboom, en den granaatappelboom, en den olijfboom, *die* niet gedragen heeft, *die* zal Ik van dezen dag af zegenen.","21":"Het woord des HEEREN nu geschiedde ten tweeden male tot Haggai, op den vier en twintigsten der maand, zeggende:","22":"Spreek tot Zerubbabel, den vorst van Juda, zeggende: Ik zal de hemelen en de aarde bewegen.","23":"En Ik zal den troon der koninkrijken omkeren, en verdelgen de vastigheid van de koninkrijken der heidenen; en Ik zal den wagen omkeren, en die daarop rijden; en de paarden, en die daarop rijden, zullen nederstorten, een iegelijk in des anderen zwaard.","24":"Te dien dage, spreekt de HEERE der heirscharen, zal Ik u nemen, o Zerubbabel, gij zoon van Sealthiël, Mijn knecht! spreekt de HEERE, en Ik zal u stellen, als een zegelring; want u heb Ik verkoren, spreekt de HEERE der heirscharen."},"KJV":{"1":"In the four and twentieth day of the sixth month, in the second year of Darius the king.","2":"In the seventh *month*, in the one and twentieth *day* of the month, came the word of the LORD by the prophet Haggai, saying,","3":"Speak now to Zerubbabel the son of Shealtiel, governor of Judah, and to Joshua the son of Josedech, the high priest, and to the residue of the people, saying,","4":"Who *is* left among you that saw this house in her first glory? and how do ye see it now? *is it* not in your eyes in comparison","5":"Yet now be strong, O Zerubbabel, saith the LORD; and be strong, O Joshua, son of Josedech, the high priest; and be strong, all ye people of the land, saith the LORD, and work: for I *am* with you, saith the LORD of hosts:","6":"*According to* the word that I covenanted with you when ye came out of Egypt, so my spirit remaineth among you: fear","7":"For thus saith the LORD of hosts; Yet once, it *is* a little while, and I will shake the heavens, and the earth, and the sea, and the dry","8":"And I will shake all nations, and the desire of all nations shall come: and I will fill this house with glory, saith the LORD of hosts.","9":"The silver *is* mine, and the gold *is* mine, saith the LORD of hosts.","10":"The glory of this latter house shall be greater than of the former, saith the LORD of hosts: and in this place will I give peace, saith the LORD of hosts.","11":"In the four and twentieth *day* of the ninth *month*, in the second year of Darius, came the word of the LORD by Haggai the prophet, saying,","12":"Thus saith the LORD of hosts; Ask now the priests *concerning* the law, saying,","13":"If one bear holy flesh in the skirt of his garment, and with his skirt do touch bread, or pottage, or wine, or oil, or any meat, shall it be holy? And the priests answered and said,","14":"Then said Haggai, If *one that is* unclean by a dead body touch any of these, shall it be unclean? And the priests answered and said, It shall be unclean.","15":"Then answered Haggai, and said, So *is* this people, and so *is* this nation before me, saith the LORD; and so *is* every work of their hands; and that which they offer there *is* unclean.","16":"And now, I pray you, consider from this day and upward, from before a stone was laid upon a stone in the temple of the LORD:","17":"Since those *days* were, when *one* came to an heap of twenty *measures*, there were *but* ten: when *one* came to the pressfat for to draw out fifty *vessels* out of the press, there were *but* twenty.","18":"I smote you with blasting and with mildew and with hail in all the labours of your hands; yet ye *turned* not to me, saith the LORD.","19":"Consider now from this day and upward, from the four and twentieth day of the ninth *month, even* from the day that the foundation of the LORD'S temple was laid, consider","20":"Is the seed yet in the barn? yea, as yet the vine, and the fig tree, and the pomegranate, and the olive tree, hath not brought forth: from this day will I bless","21":"And again the word of the LORD came unto Haggai in the four and twentieth *day* of the month, saying,","22":"Speak to Zerubbabel, governor of Judah, saying, I will shake the heavens and the earth;","23":"And I will overthrow the throne of kingdoms, and I will destroy the strength of the kingdoms of the heathen; and I will overthrow the chariots, and those that ride in them; and the horses and their riders shall come down, every one by the sword of his brother.","24":"In that day, saith the LORD of hosts, will I take thee, O Zerubbabel, my servant, the son of Shealtiel, saith the LORD, and will make thee as a signet: for I have chosen thee, saith the LORD of hosts."}},"tsk":{"2":[{"kopje":"de zevende","refs":["Hagg 2:11","Hagg 2:21","Hagg 2:1"]},{"kopje":"de profeet","refs":["Hagg 1:1","2 Petr 1:21"]}],"3":[{"kopje":"vorst","refs":["Hagg 1:14","Ezra 1:8","Ezra 2:63","Neh 8:10"]}],"4":[{"kopje":"overgebleven","refs":["Ezra 3:12","Zach 4:9","Zach 4:10"]},{"kopje":"heerlijkheid","refs":["Ezech 7:20","Luk 21:5","Luk 21:6"]}],"5":[{"kopje":"nu","refs":["Deut 31:23","Joz 1:6","Joz 1:9","1 Kron 22:13","1 Kron 28:20","Zach 8:9","1 Kor 16:13","Ef 6:10","2 Tim 2:1"]},{"kopje":"want","refs":["Hagg 1:13","Ex 3:12","Richt 2:18","1 Sam 16:18","2 Sam 5:10","Mark 16:20","Hand 7:9","2 Tim 4:17"]}],"6":[{"kopje":"waarmee","refs":["Ex 29:45","Ex 29:46","Ex 33:12-14","Ex 34:8","Ex 34:10"]},{"kopje":"toen","refs":["Num 11:25-29","Neh 9:20","Neh 9:30","Ps 51:13","Ps 51:14","Jes 63:11-14","Zach 4:6","Joh 14:16","Joh 14:17"]},{"kopje":"bevreesd","refs":["Joz 8:1","2 Kron 20:17","Jes 41:10","Jes 41:13","Zach 8:13","Zach 8:15","Matt 28:5","Hand 27:24","Openb 1:17"]}],"7":[{"kopje":"Nog eenmaal","refs":["Hagg 2:22","Hagg 2:23","Hebr 12:26-28"]},{"kopje":"zal het zover zijn","refs":["Ps 37:10","Jes 10:25","Jes 29:17","Jer 51:33","Hebr 10:37"]},{"kopje":"en Ik","refs":["Jes 34:4","Jer 4:23-26","Ezech 38:20","Joël 2:30-32","Joël 3:16","Matt 24:29","Matt 24:30","Mark 13:24-26","Luk 21:25-27","Hand 2:19","Hebr 12:26","Openb 6:12-17","Openb 8:5-12","Openb 11:9","Openb 6:2-17"]}],"8":[{"kopje":"zal ... doen beven","refs":["Ezec =\"H2132\">olive</span> <span class=\"wl wl-kjv\" data-code=\"H6086\">tree,</span> hath not brought <span class=\"wl wl-kjv\" data-code=\"H5375\">forth:</span> from this <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> will I bless","21":"And <span class=\"wl wl-kjv\" data-code=\"H8145\">again</span> the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> came unto <span class=\"wl wl-kjv\" data-code=\"H2292\">Haggai</span> in the <span class=\"wl wl-kjv\" data-code=\"H702\">four</span> and <span class=\"wl wl-kjv\" data-code=\"H6242\">twentieth</span> day of the <span class=\"wl wl-kjv\" data-code=\"H2320\">month,</span> saying,","22":"<span class=\"wl wl-kjv\" data-code=\"H559\">Speak</span> to <span class=\"wl wl-kjv\" data-code=\"H2216\">Zerubbabel,</span> <span class=\"wl wl-kjv\" data-code=\"H6346\">governor</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> I will <span class=\"wl wl-kjv\" data-code=\"H7493\">shake</span> the <span class=\"wl wl-kjv\" data-code=\"H8064\">heavens</span> and the earth;","23":"And I will <span class=\"wl wl-kjv\" data-code=\"H2015\">overthrow</span> the <span class=\"wl wl-kjv\" data-code=\"H3678\">throne</span> of <span class=\"wl wl-kjv\" data-code=\"H4467\">kingdoms,</span> and I will <span class=\"wl wl-kjv\" data-code=\"H8045\">destroy</span> the <span class=\"wl wl-kjv\" data-code=\"H2392\">strength</span> of the <span class=\"wl wl-kjv\" data-code=\"H4467\">kingdoms</span> of the <span class=\"wl wl-kjv\" data-code=\"H1471\">heathen;</span> and I will <span class=\"wl wl-kjv\" data-code=\"H2015\">overthrow</span> the <span class=\"wl wl-kjv\" data-code=\"H4818\">chariots,</span> and those that <span class=\"wl wl-kjv\" data-code=\"H7392\">ride</span> in them; and the <span class=\"wl wl-kjv\" data-code=\"H5483\">horses</span> and their <span class=\"wl wl-kjv\" data-code=\"H7392\">riders</span> shall come <span class=\"wl wl-kjv\" data-code=\"H3381\">down,</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">one</span> by the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword</span> of his brother.","24":"In that <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts,</span> will I <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> thee, O <span class=\"wl wl-kjv\" data-code=\"H2216\">Zerubbabel,</span> my <span class=\"wl wl-kjv\" data-code=\"H5650\">servant,</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H7597\">Shealtiel,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and will <span class=\"wl wl-kjv\" data-code=\"H7760\">make</span> thee as a <span class=\"wl wl-kjv\" data-code=\"H2368\">signet:</span> for I have <span class=\"wl wl-kjv\" data-code=\"H977\">chosen</span> thee, <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of hosts."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"den vier en twintigsten dag der maand,","tekst":"Verscheidene overzetters voegen dit eerste vers aan het einde van het eerste hoofdstuk, en daar schijnt het toe te behoren."}],"2":[{"catchword":"In de zevende maand,","tekst":"Te weten, van het jaar, waarvan in vers een gesproken is."},{"catchword":"geschiedde het woord des HEEREN","tekst":"Te weten, tot het Joodse volk en de voornaamsten onder dezelve. Alzo ook onder vs.11."},{"catchword":"door den dienst van den profeet Haggaï,","tekst":"Hebr. door de hand van Haggaë, enz. Alzo ook in vs.11."}],"4":[{"catchword":"in zijn eerste heerlijkheid gezien heeft,","tekst":"Te weten, in die heerlijkheid, waar het in was eer het van de Chaldeën is verwoest geworden."},{"catchword":"als niets in uw ogen?","tekst":"Namelijk vergeleken bij dien tempel, welken Salomo gebouwd heeft; zie Ezr 3:12 . David had gaandeweg een groten schat van goud, zilver, koper en andere bouwstoffen tot den bouw van den tempel vergaderd, en Salomo deed daar nog een groten schat bij, als hij dien tempel bouwde; maar de Joden, die eerst uit de Babylonische gevangenschap kwamen, waren arm en hadden geen grote macht om dezen nieuwen tempel kostelijk op te bouwen. Anders: is [dit] niet bij dat als niets, enz."}],"5":[{"catchword":"al gij volk des lands","tekst":"Dit spreekt hij tot den gemenen onder de Joden."},{"catchword":"werkt,","tekst":"Dat is, gaat voort in het bouwen. Zie van het woord werken, Rth 2:19 ; Pro 31:13 ."}],"6":[{"catchword":"het woord,","tekst":"Te weten, met dat woord, door hetwelk de hemelen gemaakt zijn, Psa 33:6 , Psa 33:9 ; dat is, met Christus, in welken Ik; dat is, in en door welken Christus Ik een verbond met ulieden gemaakt heb, waarom Christus Mal 3:1 , de engel des verbonds genoemd wordt, en de apostel zegt 2Co 1:20 , dat de belofte in Christus alleen ja en amen is. Anders: naar het woord, doe Ik met ulieden, enz.; dat is, naar de beloften, die Ik uwen vaderen en ulieden gedaan heb, dat Ik wilde zijn hun God en huns zaads God na hen; Gen 15:18 ."},{"catchword":"gij uit Egypte uittrokt,","tekst":"Te weten, besloten zijnde in de lenden uwers vaderen. Zie gelijke manier van spreken Act 7:53 ."},{"catchword":"Mijn Geest,","tekst":"Versta, den Heilige Geest, die onze zwakheid mede te hulp komt, Rom 8:26 . Dit vers heeft een klaar bewijs van de drie personen der Heilige Drievuldigheid."},{"catchword":"staande in het midden van u;","tekst":"Dat is, bij u tegenwoordig zijnde met zijn krachtige werking. Anders: en mijn Geest zal in het midden van u blijven; dat is, Hij zal ulieden in het uitvoeren van het werk van dit gebouw kracht verlenen; derhalve vreest niet, de zaak zal een goeden voortgang hebben."}],"7":[{"catchword":"Nog eens,","tekst":"Dat is, het zal in korten tijd geschieden, dat Ik hemel en aarde wederom, of ten tweede male bewegen zal. Zie Heb 12:26 ; dat ons lang dunkt te wezen, is bij God maar als een ogenblik; Psa 90:4 , en 2Pe 3:8 ."},{"catchword":"de hemelen,","tekst":"Met de engelen, inwoners des hemels."},{"catchword":"de aarde,","tekst":"Met de mensen op de aarde."},{"catchword":"de zee,","tekst":"Met die in de eilanden wonen."},{"catchword":"het droge","tekst":"Met de mensen, die op het hoge droge land wonen."},{"catchword":"doen beven","tekst":"Al deze schepselen zullen bewogen worden, ten tijde der geboorte, van het lijden en sterven, van de opstanding en hemelvaart van Christus, en als zijne apostelen dit alles door de ganse wereld zullen gaan prediken."}],"8":[{"catchword":"Ik zal al de heidenen","tekst":"Dit is ene profetie van de beroeping der heidenen, als het Evangelie door de ganse wereld zou gepredikt worden."},{"catchword":"doen beven,","tekst":"Of, doen schudden, te weten, alzo dat zij tot den Heere komen. Verg. Hos 3:5 , en Hos 11:10-11 met de aantekening."},{"catchword":"Wens aller heidenen,","tekst":"Te weten, Christus, dien alle heidenen of natiën zouden wensen te omhelzen, zich tot zijne kerk begevende. Verg. Gen 49:10 . Anders aldus: En de wens der heidenen zal komen. Verstaande zulks van de komst van de Messias. Anders: Dan zullen komen de gewenschten aller heidenen; dat is, mijne uitverkorenen, mijn lieve en aangenamen kinderen uit alle volken en natiën, zullen tot mij komen en in mij geloven. Zie Isa 2:3 ."},{"catchword":"dit huis","tekst":"Dat is, dezen tempel."},{"catchword":"met heerlijkheid vervullen,","tekst":"Want Christus, de koning der ere. [ Psa 24:7-8 ] , de Zaligmaker der heidenen, [die groter is dan Salomo, Mat 12:42 ] , zou in eigen persoon lichamelijk verschijnen, prediken en wonderen doen, [gelijk Maleachi dit duidelijk voorzegt in Mal 3:1 ] , en Hij zal voorts in zijn gemeente wonen met zijn Geest en genade. Verg. Eze 43:5 , Eze 43:7 ."}],"9":[{"catchword":"Mijn is het zilver, en Mijn is het goud,","tekst":"Alsof de Heere zeide: Indien Ik dezen nieuwen tempel uitwendig heerlijker hebben wilde van zilver en goud, dat ware mij licht om te doen, want al het zilver en goud der wereld komt mij toe, en Ik kon het u haast doen hebben, maar Ik wil dezen tempel versieren met een veel grotere heerlijkheid, namelijk met de tegenwoordigheid van den Messias, den Koning aller koningen, en met vele geestelijke gaven, waarmede Ik de kerk van het Nieuwe Testament versieren zal."}],"10":[{"catchword":"vrede geven,","tekst":"Namelijk door, of in Christus Jezus, den Vredevorst. Zie Rom 5:1 , en Rom 14:17 ; Phi 4:7 . Zie ook Isa 11:6 , en Joh 14:27 ."}],"11":[{"catchword":"der negende maand,","tekst":"Deze maand word Chisleu genoemd, Zec 7:1 ; ten dele met onze December overeenkomende."}],"12":[{"catchword":"den priesters de wet,","tekst":"Welken het toekomt de wet te verklaren. Zie Lev 10:10-11 ; Deu 33:10 , en Mal 2:7 ."}],"13":[{"catchword":"iemand draagt","tekst":"In dit 13e vers stelt de profeet twee vragen voor bij gelijkenis, lerende vooreerst dat de gelijkenis, lerende vooreerst dat de mens uit het aanroeren van iets, dat heilig is, gene heiligheid verkrijgt. In vers vers 14 leert hij dat een mens, die onrein is, niet alleen gene heiligheid daarvan krijgt, maar integendeel, met zijn aanroeren verontreiningt hij hetgeen heilig is; met welke gelijkenissen de Heere te verstaan geeft de oorzaken waarom Hij nu een geruimen tijd de Joden gekastijd had, en waarom hunne offeranden Gode niet aangenaam geweest waren, namelijk omdat zij zo onrein van hart waren als degenen uiterlijk, die door het aanroeren van een dood lichaam zich verontreining hadden. Zie Lev 21:1 ; Num 5:2 ."},{"catchword":"heilig vlees","tekst":"Hebr. vlees der heiligheid; te weten, vlees, hetwelk de Heere is geheiligd geworden door de offerande. Zie Lev 7:15 ."},{"catchword":"slip van zijn kleed,","tekst":"Hebr. vleugel."},{"catchword":"het heilig worden?","tekst":"Anders: hij. Die zin is: Zal er iets anders, dat hij aanroert, door hem geheiligd worden?"},{"catchword":"Neen","tekst":"Want het kleed wordt wel door zulke aanroering geheiligd, Lev 6:27 ; maar niet hetgeen van dat kleed werd aangeraakt."}],"14":[{"catchword":"van een dood lichaam,","tekst":"Hebr. van ene ziel; zie Lev 19:28 de aantekening aldaar, en Num 19:11 ."},{"catchword":"iets van die dingen aanroert,","tekst":"Van welke gesproken is in vs.13."},{"catchword":"het onrein worden?","tekst":"Te weten, hetwelk het aangeroerd heeft."},{"catchword":"Het zal onrein worden","tekst":"Zie de wet, Lev 11:24-25 , enz., en Lev 15:4 , enz., Num 9:10 , en Num 19:11 , Num 19:13 ."}],"15":[{"catchword":"Alzo is dit volk,","tekst":"De zin is: Evenzoo is het met deze natie of met dit volk gesteld, hetwelk alles ontreinigt waar het bij of aan komt, dewijl het onrein van consientie is, blijkende daaruit dat zij mijn bevel, aangaande het opbouwen van den tempel verachten. Verg. Tit 1:15 ."},{"catchword":"voor Mijn aangezicht,","tekst":"De Joden waren wel heilige lieden in hun eigen oordeel, maar niet in de ogen van God."},{"catchword":"daar offeren,","tekst":"Te weten, op het brandofferaltaar, dat vele jaren was opgebouwd geweest eer de tempel volbouwd is geworden, Ezr 3:2 . God de Heere had wel de offeranden strengelijk bevolen te doen, maar hier verklaart Hij door zijnen profeet, dat gelijk al hun andere werken onrein waren, alzo ook hunne offeranden, [vanwege welke zij meenden Gode aangenaam te zijn] zolang zij nalieten des Heeren huis te bouwen, en omdat zij zelf onrein, dat is goddeloos en huichelachtig waren, en zonder geloof, want alles wat zonder geloof geschiedt, dat is zonde; Rom 14:23 ."}],"16":[{"catchword":"stelt er toch ulieder hart op,","tekst":"De zin schijnt hier te zijn: Vóór dezen, toen gij versloft hebt de opbouwing van den tempel, zijt gij van God gestraft geweest met dure tijden, zie vs.18, maar nu gij aan het werk kloekelijk gegaan zijt, hebt gij den zegen des Heeren gevoeld; derhalve neemt ter harte hetgeen in vorige tijden geschied is, opdat gij verstaande de oorzaak van den tegenspoed, die u tevoren geperst heeft, nu ook moogt verstaan de oorzaak van den zegen Gods, dien gij nu gevoelt, en hierna gevoelen zult en vaart derhalve kloekelijk voort in het opbouwen van het huis des Heeren. Eenige overzetters verlichten de duisterheid van dit vers met enige ingevoegde woorden, aldus: En nu, stelt er toch ulieder hart op [hoe het ulieden gegaan is,] van dezen dag af, enz. Zie Hag 1:5 , en vs.19."},{"catchword":"opwaarts,","tekst":"Dat is, op de dagen, die vóór dezen tijd geweest zijn."},{"catchword":"eer er steen op steen gelegd werd","tekst":"Dat is, eer de opbouwing van den tempel haar voortgang nam, en gijlieden op het fondament [hetwelk vóór vele jaren gelegd was] voortgegaan zijt, en op hetzelve verder gebouwd hebt. Ten tijde van den koning Cyrus hadden zij de fondamenten van den tempel gelegd, maar niet voortgebouwd tot op het tweede jaar van Darius, zie vs.11. Zie ook Ezr 4:5 , Ezr 4:24 ."}],"17":[{"catchword":"Eer die dingen geschiedden,","tekst":"Dat is, eer men met den bouw des tempels voortvoer."},{"catchword":"van twintig maten,","tekst":"Dat is, die men meende dat twintig mudden, of schepels, of zakken uitgeven zou, of behoorde uit te geven, naar evenredigheid van het gezaaide."},{"catchword":"maten van de pers te scheppen,","tekst":"Hetzij voeder, of amen, of andere vaten, groot of klein."},{"catchword":"zo waren er maar twintig","tekst":"De zin is: De oogst van het koren en den wijn was zeer sober en klein, dewijl de Heere u zijnen zegen onttrokken had, vertoornd zijnde over ulieder slordigheid in het bouwen van zijn huis."}],"18":[{"catchword":"Ik sloeg","tekst":"Dit is een breder verhaal der plagen, die God hun heeft toegezonden vanwege hunne slordigheid in het bouwen van den tempel. Verg. Deu 28:22 , enz. Zie ook 1Ki 8:37 , en inzonderheid Amo 4:6-9 ; en Hag 1:11 , en Psa 78:47 ."},{"catchword":"ulieden met brandkoren,","tekst":"Dat is, uwe vruchten."},{"catchword":"en gij keerdet u niet tot Mij,","tekst":"Anders: daar is niemand bij ulieden die tot mij, spreekt de Heere, met verzwijging van het woord keert."}],"19":[{"catchword":"Stelt er toch uw hart op,","tekst":"Of, stelt nu uw hart, enz. Alsof hij zeide: Totdat men is begonnen wederom te bouwen aan den tempel, zijn het ellendige bedroefde tijden geweest, maar let er nu eens op, hoe het nu toegaat, nu gij kloekelijk aan het bouwen zijt."},{"catchword":"en opwaarts;","tekst":"Dat is, die vóór dezen tijd geweest zijn."},{"catchword":"als het fondament","tekst":"Dat is, als men is begonnen te bouwen op het fondament, hetwelk gelegd is geworden in het tweede jaar na de wederkomst uit de Babylonische gevangenschap, als het altaar werd gebouwd. Zie Ezr 3:11 . Doch sommigen nemen deze woorden naar de letter, zijnde in die mening, dat de fondamenten van den tempel, die gelegd waren straks na de wederkomst van het volk uit Babylonië, van de vijanden van dit werk uitgeroeid waren, alzo dat men nieuwe fondamenten heeft moeten leggen."}],"20":[{"catchword":"Is er nog zaad in de schuur?","tekst":"De zin is: Is er nog zaad overig in de schuur om te zaaien, Ik zal het van dezen dag af zegenen, ja tot de bomen toe, die nu in langen tijd geen vruchten gedragen hebben, zal Ik mijnen zegen geven."},{"catchword":"den wijnstok,","tekst":"Al de bomen en vruchten, die hier genoemd staan, plachten overvloedig in het Joodse land te groeien; zie Deu 8:8 ."},{"catchword":"zegenen","tekst":"Dat is, vruchtbaar maken."}],"21":[{"catchword":"der maand,","tekst":"Namelijk der negende maand, te weten, op denzelfden dag als tevoren het woord des Heeren tot Gaggaï geschied is; zie ook vs.11."}],"22":[{"catchword":"Ik zal de hemelen en de aarde bewegen","tekst":"Zie vs.7."}],"23":[{"catchword":"En Ik zal den troon der koninkrijken omkeren,","tekst":"De zin is: Ik const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers) => {
    const afk = REFBOEK2AFK[boek];
    return afk ? `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${heel}</a>` : heel;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
