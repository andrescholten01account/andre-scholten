levende wezens was in de raderen.", "Hand 5:31": "Deze heeft God door Zijn rechterhand verhoogd tot een Vorst en Zaligmaker, om Israël bekering en vergeving van zonden te geven.", "Jer 17:26": "En zij zullen komen uit de steden van Juda, en uit de plaatsen rondom Jeruzalem, en uit het land van Benjamin, en uit de laagte, en van het gebergte, en van het zuiden, en brandoffer aanbrengen, en slachtoffer, en spijsoffer, en wierook, en lofoffer aanbrengen, ten huize van de HEERE.", "Spr 27:1": "Beroem u niet over de dag van morgen; want u weet niet, wat de dag zal baren.", "2 Sam 7:2": "Dat de koning zei tegen de profeet Nathan: Zie toch, ik woon in een huis van cederhout, en de ark van God woont in het midden van de tentkleden.", "Mal 3:9-11": "Met een vloek bent u vervloekt, omdat u Mij berooft, zelfs het hele volk. Breng al de tienden in het schathuis, opdat er voedsel is in Mijn huis; en beproef Mij nu daarin, zegt de HEERE van de heerscharen, of Ik u dan niet zal opendoen de vensters van de hemel, en u zegen zal uitgieten, zodat er geen schuren genoeg zullen zijn. En Ik zal om uwentwil de opeter bestraffen, zodat hij u de vrucht van het land niet verderft; en de wijnstok op het veld zal u geen misdracht voortbrengen, zegt de HEERE van de heerscharen.", "Klaagl 2:7": "Zain. De Heere heeft Zijn altaar verstoten. Hij heeft Zijn heiligdom te niet gedaan, Hij heeft de muren van haar paleizen in de hand van de vijand overgegeven; zij hebben in het huis van de HEERE een stem verheven als op de dag van een gezet hoogtijd.", "Hab 2:5": "En ook omdat hij trouweloos handelt bij de wijn, een trots man is, en niet in zijn woning blijft; die zijn ziel wijd opendoet als het graf, en is als de dood, die niet verzadigd wordt, en tot zich verzamelt alle heidenvolken, en tot zich bijeenbrengt alle volken.", "Joz 1:5": "Niemand zal voor uw aangezicht standhouden al de dagen van uw leven; zoals Ik met Mozes geweest ben, zal Ik met u zijn; Ik zal u niet begeven, en zal u niet verlaten.", "Pred 1:8": "Al deze dingen maken zo moe, dat niemand het zou kunnen uitspreken; het oog wordt niet verzadigd van zien, en het oor wordt niet vervuld van horen.", "Ps 119:36": "Neig mijn hart tot Uw getuigenissen, en niet tot gierigheid.", "Joël 2:15-18": "Waait op de bazuin te Sion, heiligt een vasten, roept een verbodsdag uit. Verzamelt het volk, heiligt de gemeente, vergadert de oudsten, verzamelt de kinderen, en wie de borsten zuigen; de bruidegom ga uit zijn binnenkamer, en de bruid uit haar slaapkamer. Laat de priesters, de dienaars van de HEERE, wenen tussen het voorhuis en het altaar, en laat hen zeggen: Spaar Uw volk, o HEERE! en geef Uw erfenis niet over tot een smaad, dat de heidenen over hen zouden heersen; waarom zouden zij onder de volken zeggen: Waar is hun God?", "Ps 105:16": "Hij riep ook een honger over het land; Hij brak elke staf van het brood.", "Pred 12:13": "Van alles wat gehoord is, is dit de slotsom: Vrees God, en houd Zijn geboden, want dit is de hele plicht van de mens.", "Matt 1:13": "en Zerubbabel verwekte Abiud, en Abiud verwekte Eljakim, en Eljakim verwekte Azor;", "Openb 20:4-6": "En ik zag tronen, en zij zaten daarop; en het oordeel werd hun gegeven; en ik zag de zielen van hen die onthoofd waren om de getuigenis van Jezus, en om het Woord van God, en die het beest, en zijn beeld niet aangebeden hadden, en die het merkteken niet ontvangen hadden aan hun voorhoofd en aan hun hand; en zij leefden en heersten als koningen met Christus, de duizend jaar. Maar de overigen van de doden werden niet weer levend, totdat de duizend jaar geëindigd waren. Dit is de eerste opstanding. Gelukkig en heilig is hij, die deel heeft in de eerste opstanding; over hen heeft de tweede dood geen macht, maar zij zullen priesters van God en Christus zijn, en zij zullen met Hem als koningen heersen, duizend jaar.", "Ezech 34:11-17": "Want zo zegt de Heere HEERE: Zie, Ik, ja, Ik zal naar Mijn schapen vragen, en zal ze opzoeken. Zoals een herder zijn kudde opzoekt, op de dag dat hij te midden van zijn verspreide schapen is, zo zal Ik Mijn schapen opzoeken; en Ik zal ze redden uit al de plaatsen, waarheen zij verstrooid zijn, op de dag van de wolk en de donkerheid. En Ik zal ze uitvoeren van de volken, en zal ze verzamelen uit de landen, en ze in hun land brengen; en Ik zal ze weiden op de bergen van Israël, bij de stromen en in alle bewoonbare plaatsen van het land.", "Ps 33:18": "Zie, het oog van de HEERE is over hen die Hem vrezen, op hen die op Zijn goedertierenheid hopen.", "Ezra 1:6": "Allen nu die rondom hen waren, ondersteunden hen met zilveren voorwerpen, met goud, met bezit, en met vee, en met kostbaarheden; behalve alles wat vrijwillig gegeven werd.", "2 Kon 3:12": "En Josafat zei: Het woord van de HEERE is bij hem. Zo trokken naar hem toe de koning van Israël, en Josafat, en de koning van Edom.", "Jes 61:2": "Om uit te roepen het jaar van het welbehagen van de HEERE, en de dag van de wraak van onze God; om alle treurenden te troosten;", "Ps 119:59": "Ik heb mijn wegen bedacht, en heb mijn voeten gekeerd tot Uw getuigenissen.", "Gen 22:12": "Toen zei Hij: Strek uw hand niet uit naar de jongen, en doe hem niets! Want nu weet Ik dat u God vrezend bent, en uw zoon, uw enige, niet van Mij hebt onthouden.", "Deut 24:15": "Op zijn dag zult u hem zijn loon geven, en de zon zal daarover niet ondergaan; want hij is arm, en zijn ziel verlangt daarnaar; zodat hij tegen u niet roept tot de HEERE, en er zonde in u is.", "Ps 51:19": "De offeranden van God zijn een gebroken geest; een gebroken en verslagen hart zult U, o God! niet verachten.", "Ps 139:23": "Doorgrond mij, o God! En ken mijn hart; beproef mij, en ken mijn gedachten.", "Gen 6:8": "Maar Noach vond genade in de ogen van de HEERE.", "Jes 28:5": "Op die dag zal de HEERE van de heerscharen tot een heerlijke kroon en tot een sierlijke krans zijn voor het overblijfsel van Zijn volk;", "2 Petr 2:14-16": "zij hebben ogen vol overspel, die niet ophouden met zondigen; zij verleiden onvaste zielen, hebben een hart geoefend in hebzucht, en zijn kinderen van de vervloeking; zij hebben de rechte weg verlaten en zijn verdwaald, en volgen de weg van Bileam, de zoon van Bosor, die het loon van de onrechtvaardigheid heeft liefgehad; maar hij kreeg een terechtwijzing voor zijn onrechtvaardigheid; want het jukdragende, stomme dier sprak met mensenstem en verhinderde de dwaasheid van de profeet.", "Lev 26:26": "Als Ik u de staf van het brood zal hebben gebroken, dan zullen tien vrouwen uw brood in één oven bakken, en zullen uw brood bij het gewicht teruggeven; en u zult eten, maar niet verzadigd worden.", "Pred 8:5": "Wie het gebod onderhoudt, zal niets kwaads ervaren; en het hart van een wijze weet tijd en wijze.", "Job 11:13-15": "Als u uw hart klaargemaakt hebt, breid dan uw handen tot Hem uit. Als er ondeugd in uw hand is, doe die ver weg; en laat het onrecht in uw tenten niet wonen. Want dan zult u uw gezicht opheffen zonder smet, en zult vast staan, en niet vrezen.", "Amos 8:10": "En Ik zal uw feesten in rouw veranderen, en al uw liederen in weeklacht, en op alle lendenen een zak brengen, en op elk hoofd kaalheid; en Ik zal het land in rouw brengen als over een enige zoon, en het einde ervan als een bittere dag.", "Dan 12:1-3": "En in die tijd zal Michaël opstaan, die grote vorst, die voor de kinderen van uw volk staat, als het zo'n tijd van benauwdheid zal zijn, als er niet geweest is sinds er een volk geweest is, tot op die tijd toe; en in die tijd zal uw volk verlost worden, ieder die gevonden wordt geschreven te zijn in het boek. En velen van hen die in het stof van de aarde slapen, zullen ontwaken, dezen tot eeuwig leven, en anderen tot versmaadheden en tot eeuwige afgrijzing. De leraars nu zullen blinken als de glans van het uitspansel, en zij die er velen rechtvaardigen, gelijk de sterren, voor altijd en eeuwig.", "1 Sam 9:15-20": "Want de HEERE had het aan Samuël geopenbaard, een dag voordat Saul kwam, en had gezegd: Morgen omstreeks deze tijd zal Ik naar u een man sturen uit het land van Benjamin, die zult u tot voorganger zalven over Mijn volk Israël; en hij zal Mijn volk verlossen uit de hand van de Filistijnen, want Ik heb naar Mijn volk omgezien, omdat hun geroep tot Mij gekomen is. Toen Samuel Saul zag, antwoordde de HEERE hem: Zie, dit is de man, van wie Ik u gezegd heb: Deze zal over Mijn volk heersen.", "2 Tim 3:2": "Want de mensen zullen zijn: liefhebbers van zichzelf, geldgierig, grootsprakerig, hoogmoedig, lasteraars, aan hun ouders ongehoorzaam, ondankbaar, onheilig,", "Pred 8:15-17": "Daarom prees ik de blijdschap, omdat de mens niets beters heeft onder de zon, dan te eten, en te drinken, en blijde te zijn; want dat zal hem bijblijven van zijn arbeid, de dagen van zijn leven, die God hem geeft onder de zon. Toen ik mijn hart erop richtte om wijsheid te kennen, en om de bezigheid te zien die op de aarde gebeurt, dat men zelfs overdag of 's nachts geen slaap ziet met zijn ogen; toen zag ik al het werk van God, dat de mens niet kan doorgronden, het werk dat onder de zon gebeurt, waarnaar een mens zoekt met inspanning, maar hij zal het niet doorgronden; ja, zelfs al zou een wijze zeggen dat hij het zou kennen, dan nog zal hij het niet kunnen doorgronden.", "2 Kron 2:8-10": "Zend mij ook cederen, dennen, en algummimhout uit Libanon; want ik weet dat uw knechten het hout van Libanon weten te houwen; en zie, mijn knechten zullen met uw knechten zijn. En dat om voor mij hout in overvloed te bereiden; want het huis dat ik zal bouwen, zal groot en wonderlijk zijn. En zie, ik zal uw knechten, de houwers die het hout houwen, twintigduizend kor uitgeslagen tarwe geven, en twintigduizend kor gerst; daartoe twintigduizend bath wijn, en twintigduizend bath olie.", "Jer 26:7": "En de priesters, en de profeten, en al het volk, hoorden Jeremia deze woorden spreken in het huis van de HEERE.", "2 Kor 4:17": "Want onze lichte verdrukking, die zeer haast voorbijgaat, brengt ons een geheel bijzonder groot en eeuwig gewicht van heerlijkheid;", "Rom 11:23": "Maar ook zij, als zij in het ongeloof niet blijven, zullen ingeënt worden; want God is machtig om hen weer in te enten.", "2 Kon 25:9": "En hij verbrandde het huis van de HEERE, en het huis van de koning, alsook alle huizen van Jeruzalem; en alle huizen van de groten verbrandde hij met vuur.", "Amos 3:7": "Zeker, de Heere HEERE zal niets doen, tenzij Hij Zijn verborgenheid aan Zijn dienaren, de profeten, geopenbaard heeft.", "Ps 75:11": "En ik zal alle hoorns van de goddelozen afhouwen; de hoorns van de rechtvaardige zullen verhoogd worden.", "Ex 23:22": "Maar als u Zijn stem echt gehoorzaamt, en doet al wat Ik zeggen zal, dan zal Ik de vijand van uw vijanden zijn, en de tegenstander van wie u tegenstaat.", "Hab 3:16": "Toen ik het hoorde, werd mijn buik beroerd; voor de stem hebben mijn lippen gebeefd; verrotting kwam in mijn beenderen, en ik werd beroerd op mijn plaats. Zeker, ik zal rusten op de dag van de benauwdheid, wanneer hij zal optrekken tegen het volk, om het met troepen aan te vallen.", "Ps 49:17-19": "Vrees niet wanneer een man rijk wordt, wanneer de eer van zijn huis groot wordt; want hij zal bij zijn sterven niets meenemen, zijn eer zal hem niet achterna dalen. Hoewel hij zijn ziel in zijn leven zegent, en zij u loven, omdat u uzelf goed doet;", "Joël 1:10-13": "Het veld is verwoest, het land treurt; want het koren is verwoest, de most is verdroogd, de olie is uitgeput. De akkerlieden zijn beschaamd, de wijngaardeniers huilen, om de tarwe en om de gerst, want de oogst van het veld is vergaan. De wijnstok is verdord, de vijgenboom is uitgeput; de granaatappelboom, ook de palmboom en appelboom; alle bomen van het veld zijn verdord; ja, de vrolijkheid is verdord van de mensenkinderen.", "Openb 19:10": "En ik viel neer voor zijn voeten, om hem te aanbidden, en hij zei tegen mij: Zie toe dat u dat niet doet; ik ben uw mededienstknecht, en uw broeder, die de getuigenis van Jezus hebben; aanbid God. Want de getuigenis van Jezus is de geest van de profetie.", "Openb 22:5": "En daar zal geen nacht zijn, en zij zullen geen kaars noch licht van de zon nodig hebben; want de Heere God verlicht hen; en zij zullen als koningen heersen tot in alle eeuwigheid.", "Jes 17:11": "Op de dag dat u ze plant, zult u ze doen groeien, en in de morgenstond zult u uw zaad doen bloeien; maar het zal maar een hoop zijn van het gemaaide, op de dag van ziekte en van pijnlijke smart.", "2 Petr 2:9": "dan weet de Heere hoe Hij de godvruchtigen uit de verzoeking moet verlossen, en de onrechtvaardigen moet bewaren tot de dag van het oordeel om gestraft te worden;", "2 Kon 1:12": "En Elia antwoordde en sprak tot hem: Ben ik een man van God, laat er dan vuur uit de hemel neerdalen, dat u en uw vijftigtal verteert. Toen daalde het vuur van God uit de hemel neer en verteerde hem en zijn vijftigtal.", "1 Kon 8:33-50": "Wanneer Uw volk Israël verslagen wordt voor het aangezicht van de vijand, omdat zij tegen U gezondigd zullen hebben, en zich tot U bekeren, en Uw Naam belijden, en tot U in dit huis bidden en smeken zullen; hoor Ú dan in de hemel, en vergeef de zonde van Uw volk Israël, en breng hen terug in het land, dat U hun vaderen gegeven hebt. Als de hemel gesloten zal zijn, zodat er geen regen is, omdat zij tegen U gezondigd zullen hebben; en zij op deze plaats bidden, en Uw Naam belijden, en zich van hun zonden bekeren zullen, wanneer U hen geplaagd zult hebben;", "Jer 16:1": "En het woord van de HEERE kwam tot mij, en Hij zei:", "Num 32:6": "Maar Mozes zei tegen de kinderen van Gad en tegen de kinderen van Ruben: Zullen uw broeders ten strijde gaan, en zullen u hier blijven?", "Joël 2:26": "En u zult overvloedig en tot verzadiging eten, en de Naam van de HEERE, uw God, prijzen, Die wonderlijk bij u gehandeld heeft; en Mijn volk zal niet beschaamd worden tot in eeuwigheid.", "Rom 12:2": "En word niet gelijkvormig aan deze wereld, maar word veranderd door de vernieuwing van uw gemoed, opdat u mag beproeven wat de goede, welbehaaglijke en volmaakte wil van God is.", "Luk 18:24": "Toen Jezus zag dat hij erg verdrietig geworden was, zei Hij: Hoe moeilijk zullen zij die rijkdom hebben, het Koninkrijk van God ingaan!", "Luk 5:14": "En Hij gebood hem het aan niemand te vertellen, maar: Ga heen, zei Hij, laat uzelf aan de priester zien, en offer voor uw reiniging, zoals Mozes geboden heeft, hun tot een getuigenis.", "Ex 6:12": "Evenwel sprak de HEERE tot Mozes en tot Aäron, en gaf hun bevel aan de kinderen van Israël, en aan Farao, de koning van Egypte, om de kinderen van Israël uit Egypteland te leiden.", "Jes 33:16": "Die zal in de hoogten wonen, de sterkten van de steenrotsen zullen zijn hoge schuilplaats zijn; zijn brood wordt hem gegeven, zijn water is gewis.", "Hagg 2:2": "In de zevende maand, op de eenentwintigste van de maand, kwam het woord van de HEERE door de dienst van de profeet Haggai. Hij zei:", "Joël 1:15": "Ach, die dag! Want de dag van de HEERE is nabij, en zal als een verwoesting komen van de Almachtige.", "Joh 14:16-21": "En Ik zal de Vader bidden, en Hij zal u een andere Trooster geven, opdat Hij bij u blijft tot in eeuwigheid; Namelijk de Geest van de waarheid, Die de wereld niet kan ontvangen, want zij ziet Hem niet, en kent Hem niet; maar u kent Hem, want Hij blijft bij u, en zal in u zijn. Ik zal u niet als wezen achterlaten; Ik kom weer naar u toe.", "Jes 65:14": "Zie, Mijn knechten zullen juichen van een goed hart, maar u zult schreeuwen van harteleed, en van verbreking van de geest zult u huilen.", "Jes 66:11": "Opdat u mag zuigen, en verzadigd worden van de borsten van haar vertroostingen; opdat u mag uitzuigen, en u verlustigen aan de glans van haar heerlijkheid.", "Ps 15:2-5": "Die oprecht wandelt, en gerechtigheid doet, en die met zijn hart de waarheid spreekt; Die met zijn tong niet lastert, zijn metgezellen geen kwaad doet, en geen smaad uit over zijn naaste; In wiens ogen de verworpene veracht is, maar hij eert hen die de HEERE vrezen; heeft hij gezworen tot zijn eigen schade, toch verandert hij niet;", "Rom 14:11": "Want er is geschreven: Ik leef, zegt de Heere, voor Mij zal elke knie zich buigen, en elke tong zal God belijden.", "Ex 20:17": "U zult niet begeren het huis van uw naaste; u zult niet begeren de vrouw van uw naaste, of zijn dienstknecht, of zijn dienstmaagd, of zijn os, of zijn ezel, of iets dat van uw naaste is.", "Gal 6:8": "Want die in zijn eigen vlees zaait, zal uit het vlees verderf maaien; maar die in de Geest zaait, zal uit de Geest het eeuwige leven maaien.", "Spr 3:35": "De wijzen zullen eer beërven; maar de dwazen dragen schande.", "Neh 12:26": "Dezen waren er in de dagen van Jojakim, de zoon van Jesua, de zoon van Jozadak, en in de dagen van Nehemia, de landvoogd, en van de priester Ezra, de schriftgeleerde.", "Num 23:26": "Maar Bileam antwoordde en zei tegen Balak: Heb ik u niet gezegd: Alles wat de HEERE zal spreken, dat zal ik doen?", "Jer 2:1": "En het woord van de HEERE gebeurde tot mij, en Hij zei:", "Hagg 2:19": "Zet er toch uw hart op, vanaf deze dag en verder; vanaf de vierentwintigste dag van de negende maand, vanaf de dag waarop het fundament van de tempel van de HEERE gelegd is, zet er uw hart op.", "Matt 24:21": "Want dan zal er grote verdrukking zijn, wat voor verdrukking er niet geweest is vanaf het begin van de wereld tot nu toe, en er ook nooit meer zal zijn.", "Matt 6:24": "Niemand kan twee heren dienen; want of hij zal de één haten en de ander liefhebben, of hij zal de één aanhangen en de ander verachten. U kunt niet God dienen en de Mammon.", "Ezra 3:2-9": "En Jesua, de zoon van Jozadak, maakte zich op, en zijn broeders, de priesters, en Zerubbabel, de zoon van Sealthiël, en zijn broeders, en zij bouwden het altaar van de God van Israël, om daarop brandoffers te offeren, zoals geschreven is in de wet van Mozes, de man Gods. En zij zetten het altaar vast op zijn stelling, hoewel er verschrikking over hen was vanwege de volken van de landen; en zij offerden daarop brandoffers aan de HEERE, brandoffers 's morgens en 's avonds. En zij hielden het feest van de loofhutten, zoals geschreven is; en zij offerden brandoffers dag bij dag in getal, naar het voorschrift, zoals elke dag vereiste.", "Matt 4:17": "Van toen af aan begon Jezus te prediken en te zeggen: Bekeer u; want het Koninkrijk der hemelen is nabijgekomen.", "Ex 4:15": "U dan zult tot hem spreken, en de woorden in zijn mond leggen; en Ik zal met uw mond, en met zijn mond zijn; en Ik zal u leren, wat u doen zult.", "1 Tess 3:13": "opdat Hij uw harten versterkt, om onberispelijk te zijn in heiligmaking, voor onze God en Vader, bij de komst van onze Heere Jezus Christus met al Zijn heiligen.", "Hebr 6:16-20": "Want mensen zweren wel bij iemand die groter is dan zij, en de eed tot bevestiging is voor hen een einde van alle tegenspraak; waarbij God, omdat Hij aan de erfgenamen van de belofte overvloediger de onveranderlijkheid van Zijn raad wilde tonen, er een eed tussen heeft gebracht; opdat wij, door twee onveranderlijke dingen, waarin het onmogelijk is dat God liegt, een sterke troost zouden hebben, wij namelijk, die de toevlucht genomen hebben om de hoop die ons voorgesteld is vast te houden;", "Job 31:24": "Als ik het goud tot mijn hoop gezet heb, of tot het fijn goud gezegd heb: U bent mijn vertrouwen;", "Jak 5:4": "Zie, het loon van de arbeiders die uw landen gemaaid hebben, dat door u is achtergehouden, roept; en het geschrei van hen die geoogst hebben, is gekomen tot in de oren van de Heere Sebaoth.", "Spr 21:26": "De hele dag begeert hij begeerlijke dingen; maar de rechtvaardige zal geven, en niet inhouden.", "Ezra 7:28": "En heeft mij goedertierenheid bewezen, voor het aangezicht van de koning en zijn raadsheren, en van alle machtige vorsten van de koning! Zo heb ik mij gesterkt, naar de hand van de HEERE, mijn God, over mij, en de hoofden uit Israël vergaderd, om met mij op te trekken.", "Luk 12:7": "Ja, ook de haren van uw hoofd zijn allemaal geteld. Wees dan niet bang; u gaat vele musjes te boven.", "Amos 4:6-9": "Daarom heb Ik u ook reinheid van de tanden gegeven in al uw steden, en gebrek aan brood in al uw plaatsen; toch hebt u zich niet bekeerd tot Mij, spreekt de HEERE. Daarbij heb Ik ook de regen van u geweerd, toen er nog drie maanden waren tot de oogst, en heb doen regenen over de ene stad, maar over de andere stad niet doen regenen; het ene stuk land werd beregend, maar het andere stuk land, waar het niet op regende, verdorde. En twee, drie steden trokken rond naar één stad, opdat zij water zouden kunnen drinken, maar werden niet verzadigd; toch hebt u zich niet bekeerd tot Mij, spreekt de HEERE.", "Jes 22:12": "En op die dag zal de Heere, de HEERE van de heerscharen, roepen tot geween, en tot rouwklacht, en tot kaalheid, en tot omgording met de zak.", "Jer 18:8": "Maar als datzelfde volk, over wie Ik dat gesproken heb, zich van zijn boosheid bekeert, dan zal Ik berouw hebben over het kwaad dat Ik dacht hen aan te doen.", "Ex 4:27": "De HEERE zei ook tegen Aäron: Ga Mozes tegemoet in de woestijn. En hij ging, en ontmoette hem bij de berg van God, en kuste hem.", "Luk 16:22-25": "En het gebeurde dat de bedelaar stierf, en door de engelen gedragen werd in de schoot van Abraham; en de rijke stierf ook, en werd begraven. En toen hij in de hel zijn ogen ophief, terwijl hij in de pijn was, zag hij Abraham van verre, en Lazarus in zijn schoot. En hij riep en zei: Vader Abraham, ontferm u over mij, en zend Lazarus, dat hij het uiterste puntje van zijn vinger in het water dompelt, en mijn tong verkoelt; want ik lijd pijn in deze vlam.", "Kol 3:24": "want u weet dat u van de Heere de vergelding van de erfenis zult ontvangen; want u dient de Heere Christus.", "2 Kor 8:16": "Doch God zij dank, Die dezelfde naarstigheid voor u in het hart van Titus gegeven heeft;", "Dan 9:1-22": "In het eerste jaar van Darius, de zoon van Ahasveros, uit het nageslacht van de Meden, die koning gemaakt was over het koninkrijk van de Chaldeeën; in het eerste jaar van zijn regering, merkte ik, Daniël, in de boeken dat het getal van de jaren waarover het woord van de HEERE tot de profeet Jeremia gekomen was, in het vervullen van de verwoestingen van Jeruzalem, zeventig jaren was. En ik richtte mijn gezicht tot God, de HEERE, om Hem te zoeken met gebed en smekingen, met vasten, en een zak, en as.", "Pred 11:1": "Werp uw brood uit op het water, want u zult het vinden na veel dagen.", "Lev 26:10": "En u zult het oude, dat verouderd is, eten; en het oude zult u wegdoen vanwege het nieuwe.", "Ezra 1:8": "En Kores, de koning van Perzië, liet ze uitgeven door de hand van Mithredath, de schatmeester, die ze overhandigde aan Sesbazar, de vorst van Juda, na ze geteld te hebben.", "Fil 3:19": "Van wie het einde het verderf is, van wie God de buik is, en van wie de heerlijkheid in hun schande is, die aardse dingen bedenken.", "Luk 17:33": "Wie zijn leven zal zoeken te behouden, zal het verliezen; en wie het zal verliezen, zal het in het leven behouden.", "Spr 22:16": "Wie de arme verdrukt om zijn eigen bezit te vermeerderen, en wie aan de rijke geeft, komt zeker tot gebrek.", "Num 13:31": "Maar de mannen die met hem opgetrokken waren, zeiden: Wij zullen tegen dat volk niet kunnen optrekken, want het is sterker dan wij.", "Deut 33:19": "Zij zullen de volken tot de berg roepen; daar zullen zij offeranden van gerechtigheid offeren; want zij zullen de overvloed van de zeeën zuigen, en de bedekte verborgen dingen van het zand.", "Jer 26:12": "Maar Jeremia sprak tot al de vorsten en tot al het volk, en zei: De HEERE heeft mij gezonden, om tegen dit huis en tegen deze stad te profeteren al de woorden die u gehoord hebt;", "Ex 7:2": "U zult alles spreken wat Ik u gebieden zal; en Aäron, uw broer, zal tegen Farao spreken, dat hij de kinderen van Israël uit zijn land laat trekken.", "Num 23:12": "Hij antwoordde en zei: Moet ik er niet op letten te spreken wat de HEERE in mijn mond gelegd heeft?", "Jer 28:1": "Verder gebeurde het in datzelfde jaar, in het begin van het koninkrijk van Zedekia, koning van Juda, in het vierde jaar, in de vijfde maand, dat Hananja, zoon van Azur, de profeet, die van Gibeon was, tegen mij sprak, in het huis van de HEERE, voor de ogen van de priesters en van het hele volk, en zei:", "Hand 3:18": "Maar God heeft zo vervuld wat Hij door de mond van al Zijn profeten van tevoren had verkondigd, dat de Christus zou lijden.", "Pred 6:11": "Voorwaar, er zijn veel dingen die de ijdelheid vermeerderen; wat heeft de mens daar meer aan?", "Rom 2:4": "Of veracht u de rijkdom van Zijn goedertierenheid, en verdraagzaamheid, en geduld, zonder te weten dat de goedertierenheid van God u tot bekering leidt?", "Rom 2:29": "Maar die is een Jood, die het in het verborgen is, en de besnijdenis van het hart, in de geest, niet in de letter, dat is de besnijdenis; wiens lof niet is uit de mensen, maar uit God.", "Jona 3:2": "Maak u op, ga naar de grote stad Nineve, en predik tegen haar de prediking, die Ik tot u spreek.", "2 Tess 2:14": "waartoe Hij u geroepen heeft door ons Evangelie, tot verkrijging van de heerlijkheid van onze Heere Jezus Christus.", "Hebr 2:10": "Want het paste Hem, om Wie alle dingen zijn, en door Wie alle dingen zijn, dat Hij, veel kinderen naar de heerlijkheid leidend, de leidsman van hun zaligheid door lijden zou volmaken.", "Hos 2:8": "Daarom zal Ik terugkomen, en Mijn koren wegnemen op zijn tijd, en Mijn nieuwe wijn op zijn vastgestelde tijd; en Ik zal Mijn wol en Mijn vlas wegrukken, dat diende om haar naaktheid te bedekken.", "2 Kor 5:20": "Zo zijn wij dan gezanten namens Christus, alsof God door ons bad; wij bidden namens Christus: laat u met God verzoenen.", "Jer 26:1": "In het begin van het koningschap van Jojakim, de zoon van Josia, koning van Juda, kwam dit woord van de HEERE, en Hij zei:", "Klaagl 5:10": "Onze huid is zwart geworden als een oven, vanwege de verzengende hitte van de honger.", "Jes 40:11": "Hij zal Zijn kudde weiden gelijk een herder; Hij zal de lammeren in Zijn armen bijeenbrengen, en in Zijn schoot dragen; de zogende dieren zal Hij zachtjes leiden.", "Hebr 13:21": "Hij volmaakt u in alle goed werk, opdat u Zijn wil mag doen; terwijl Hij in u werkt wat voor Hem welgevallig is, door Jezus Christus; aan Wie de heerlijkheid is, tot in alle eeuwigheid. Amen.", "Jes 24:7": "De most treurt, de wijnstok kwijnt weg, allen die blijhartig waren, zuchten.", "Openb 7:4": "En ik hoorde het getal van hen die verzegeld waren: honderdvierenveertigduizend waren verzegeld uit alle geslachten van de kinderen van Israël.", "Jer 22:14": "Die zegt: Ik zal mij een zeer hoog huis bouwen, en ruime bovenzalen; en hij houwt er zich vensters in uit, en het is bedekt met ceder, en aangestreken met menie.", "Joël 3:21": "En Ik zal hun bloed reinigen, dat Ik niet gereinigd had; en de HEERE zal wonen op Sion.", "Ps 58:12": "En de mens zal zeggen: Zeker, er is vrucht voor de rechtvaardige; zeker, er is een God, Die op de aarde recht spreekt.", "Spr 24:11": "Red hen die ter dood gegrepen zijn; want zij wankelen ter doding, als u zich onthoudt.", "Dan 9:26": "En na die tweeënzestig weken zal de Messias uitgeroeid worden, maar het zal niet voor Hemzelf zijn; en een volk van de vorst die komen zal, zal de stad en het heiligdom verderven, en zijn einde zal zijn met een overstromende vloed, en tot het einde toe zal er oorlog zijn, en vast besloten verwoestingen.", "Spr 10:3": "De HEERE laat de ziel van de rechtvaardige niet hongeren; maar de have van de goddelozen stoot Hij weg.", "Ps 4:8": "U hebt vreugde in mijn hart gegeven, meer dan ten tijde dat hun koren en hun most vermenigvuldigd waren.", "Hagg 1:12-14": "Toen luisterden Zerubbabel, de zoon van Sealthiël, en Josua, de zoon van Jozadak, de hogepriester, en heel het overblijfsel van het volk, naar de stem van de HEERE, hun God, en naar de woorden van de profeet Haggai, zoals de HEERE, hun God, hem gezonden had; en het volk vreesde voor het aangezicht van de HEERE. Toen sprak Haggai, de bode van de HEERE, in de boodschap van de HEERE, tot het volk, en hij zei: Ik ben met u, spreekt de HEERE. En de HEERE wekte de geest op van Zerubbabel, de zoon van Sealthiël, de vorst van Juda, en de geest van Josua, de zoon van Jozadak, de hogepriester, en de geest van heel het overblijfsel van het volk; en zij kwamen en gingen aan het werk in het huis van de HEERE van de heerscharen, hun God,", "Deut 23:18": "U zult geen hoerenloon noch hondenprijs in het huis van de HEERE, uw God, brengen, voor enige gelofte; want ook die beide zijn de HEERE, uw God, een gruwel.", "Joh 12:25": "Wie zijn leven liefheeft, zal het verliezen; en wie zijn leven haat in deze wereld, zal het bewaren tot het eeuwige leven.", "Hagg 1:9-11": "U ziet uit naar veel, maar zie, u bekomt weinig; en als u het in huis gebracht hebt, dan blaas Ik erin. Waarom dat? spreekt de HEERE van de heerscharen; om de wil van Mijn huis, dat woest is, en dat u loopt, ieder voor zijn eigen huis. Daarom onthouden de hemelen zich boven u van dauw, en het land onthoudt zijn vruchten. Want Ik heb een droogte geroepen over het land, en over de bergen, en over het koren, en over de most, en over de olie, en over wat de aardbodem zou voortbrengen; ook over de mensen, en over de dieren, en over alle arbeid van de handen.", "Hand 2:2-4": "En er kwam plotseling uit de hemel een geluid, als van een geweldige, gedreven wind, en het vervulde het hele huis waar zij zaten. En er werden door hen verdeelde tongen gezien, als van vuur, en het zat op ieder van hen. En zij werden allen vervuld met de Heilige Geest, en begonnen te spreken met andere talen, zoals de Geest hun gaf uit te spreken.", "Joh 5:29": "en zij zullen uitgaan, zij die het goede gedaan hebben tot de opstanding van het leven, en zij die het kwade gedaan hebben tot de opstanding van het oordeel.", "2 Kor 5:15": "Omdat wij dit oordelen: dat als Eén voor allen gestorven is, zij dan allen gestorven zijn. En Hij is voor allen gestorven, opdat zij die leven niet meer voor zichzelf zouden leven, maar voor Hem Die voor hen gestorven en opgewekt is.", "Spr 3:9": "Vereer de HEERE met uw goed, en met de eerstelingen van al uw inkomsten;", "Jes 30:26": "En het licht van de maan zal zijn als het licht van de zon, en het licht van de zon zal zevenvoudig zijn als het licht van zeven dagen; op de dag dat de HEERE de breuk van Zijn volk zal verbinden, en de wond waarmee het geslagen is, genezen.", "Luk 23:43": "En Jezus zei tegen hem: Voorwaar, Ik zeg u: Vandaag zult u met Mij in het Paradijs zijn.", "Deut 33:23": "En van Naftali zei hij: O Naftali! wees verzadigd van de goedgunstigheid, en vol van de zegen van de HEERE; bezit erfelijk het westen en het zuiden.", "Hos 5:15": "Ik zal heengaan en terugkeren naar Mijn plaats, totdat zij zichzelf schuldig weten en Mijn aangezicht zoeken; als het hun bang te moede is, zullen zij Mij vroeg zoeken.", "Ezech 14:13": "Mensenkind, als een land tegen Mij zondigt door zwaar te overtreden, dan zal Ik Mijn hand daartegen uitstrekken, en de staf van het brood daarvan breken, en een honger daarin zenden, zodat Ik daaruit mensen en beesten uitroei;", "Zach 9:16": "En de HEERE, hun God, zal hen op die dag behouden, als de kudde van Zijn volk; want gekroonde stenen zullen in Zijn land, als een banier, opgericht worden.", "Matt 16:26": "Want wat baat het een mens, als hij de hele wereld wint, en schade lijdt aan zijn ziel? Of wat zal een mens geven, als losprijs voor zijn ziel?", "Joël 2:28": "En daarna zal het gebeuren, dat Ik Mijn Geest zal uitgieten over alle vlees, en uw zonen en uw dochters zullen profeteren; uw ouden zullen dromen dromen, uw jongelingen zullen gezichten zien;", "1 Sam 10:10": "Toen zij daar bij de heuvel kwamen, zie, toen kwam hem een groep profeten tegemoet; en de Geest van de HEERE werd vaardig over hem, en hij profeteerde in hun midden.", "Jer 4:14": "Was uw hart van slechtheid, o Jeruzalem! opdat u behouden wordt; hoe lang zult u de gedachten van uw ijdelheid in uw binnenste laten overnachten?", "Spr 11:20": "De verkeerden van hart zijn de HEERE een gruwel; maar de oprechten van weg zijn Zijn welgevallen.", "Zach 1:1": "In de achtste maand, in het tweede jaar van Darius, kwam het woord van de HEERE tot Zacharia, de zoon van Berechja, de zoon van Iddo, de profeet, en hij zei:", "Num 9:8-10": "En Mozes zei tot hen: Blijf staan, dat ik hoor wat de HEERE u gebieden zal. Toen sprak de HEERE tot Mozes en zei: Spreek tot de kinderen van Israël en zeg: Wanneer iemand onder u, of onder uw geslachten, onrein is door een dood lichaam, of op een verre reis zal zijn, dan zal hij toch de HEERE het pascha houden.", "2 Kon 5:8": "Maar het gebeurde, toen Elisa, de man van God, gehoord had dat de koning van Israël zijn kleren had gescheurd, dat hij naar de koning stuurde, om te zeggen: Waarom hebt u uw kleren gescheurd? Laat hem nu naar mij toe komen, dan zal hij weten dat er een profeet in Israël is.", "Gen 41:38": "Toen zei Farao tegen zijn dienaars: Zouden wij wel een man vinden zoals deze, in wie de Geest van God is?", "Ps 19:13": "Wie zou de afdwalingen verstaan? Reinig mij van de verborgen afdwalingen.", "1 Kor 13:3": "En al zou het zo zijn dat ik al mijn goederen uitdeelde tot onderhoud van de armen, en al zou het zo zijn dat ik mijn lichaam overgaf om verbrand te worden, en de liefde niet had, dan zou het mij niets baten.", "Ps 41:2-4": "Gelukkig is hij, die zich verstandig gedraagt tegenover een ellendige; de HEERE zal hem bevrijden ten dage des kwaads. De HEERE zal hem bewaren, en zal hem bij het leven behouden; hij zal op aarde gelukkig gemaakt worden. Geef hem ook niet over in de begeerte van zijn vijanden. De HEERE zal hem ondersteunen op het ziekbed; in zijn ziekte verandert U zijn hele leger.", "Matt 3:7": "Toen hij dan velen van de Farizeeën en Sadduceeën naar zijn doop zag komen, zei hij tegen hen: Adderengebroed! Wie heeft u laten weten dat u moet vluchten voor de komende toorn?", "Mark 10:30": "of hij ontvangt honderdvoud, nu in deze tijd, huizen, en broers, en zusters, en moeders, en kinderen, en akkers, met vervolgingen, en in de toekomende tijd het eeuwige leven.", "Luk 6:20-23": "En Hij sloeg Zijn ogen op naar Zijn discipelen, en zei: Zalig bent u, armen, want van u is het Koninkrijk van God. Zalig bent u, die nu honger hebt; want u zult verzadigd worden. Zalig bent u, die nu weent; want u zult lachen. Zalig bent u, wanneer de mensen u haten, en wanneer zij u buitensluiten, en u smaden, en uw naam als kwaad verwerpen, omwille van de Zoon des mensen.", "Hos 10:1": "Israël is een uitgeledigde wijnstok, hij brengt weer vrucht voort voor zichzelf; maar naar de veelheid van zijn vrucht heeft hij de altaren vermeerderd; naar de goedheid van zijn land hebben zij de opgerichte beelden mooi gemaakt.", "Hagg 2:24": "Op die dag, spreekt de HEERE van de heerscharen, zal Ik u nemen, Zerubbabel, zoon van Sealthiël, Mijn dienstknecht! spreekt de HEERE, en Ik zal u stellen als een zegelring; want Ik heb u verkozen, spreekt de HEERE van de heerscharen.", "Hand 11:28": "En een van hen, met de naam Agabus, stond op en maakte door de Geest bekend dat er een grote hongersnood zou komen over de hele wereld; die is ook gekomen onder keizer Claudius.", "Ps 97:10": "U die de HEERE liefhebt: haat het kwade; Hij bewaart de zielen van Zijn gunstgenoten; Hij redt hen uit de hand van de goddelozen.", "Ps 91:1": "Die in de schuilplaats van de Allerhoogste is gezeten, die zal vernachten in de schaduw van de Almachtige.", "Spr 1:19": "Zo zijn de paden van ieder die hebzucht pleegt; zij zal het leven van haar meester wegnemen.", "Num 22:12": "Toen zei God tegen Bileam: U mag niet met hen meegaan; u mag dat volk niet vervloeken, want het is gezegend.", "Jer 42:7": "En het gebeurde na tien dagen, dat het woord van de HEERE tot Jeremia kwam.", "Ps 81:11": "Ik ben de HEERE, uw God, Die u heb opgevoerd uit het land van Egypte; doe uw mond wijd open, en Ik zal hem vullen.", "Matt 5:3-12": "Zalig zijn de armen van geest, want hun is het Koninkrijk der hemelen. Zalig zijn zij die treuren, want zij zullen vertroost worden. Zalig zijn de zachtmoedigen, want zij zullen het aardrijk beërven.", "Spr 8:35": "Want die Mij vindt, vindt het leven, en verkrijgt een welgevallen van de HEERE.", "Hos 14:3": "Neem deze woorden met u, en bekeer u tot de Heere; zeg tegen Hem: Neem weg alle ongerechtigheid, en geef het goede, zo zullen wij betalen de stieren van onze lippen.", "Hebr 13:16": "En vergeet de weldadigheid en de mededeelzaamheid niet; want aan zulke offers heeft God een welgevallen.", "Ps 29:11": "De HEERE zal Zijn volk sterkte geven; de HEERE zal Zijn volk zegenen met vrede.", "Pred 11:9": "Verblijd u, jongeman, in uw jeugd, en laat uw hart zich vermaken in de dagen van uw jongelingschap, en wandel in de wegen van uw hart, en in wat uw ogen zien; maar weet dat God u, om al deze dingen, voor het gericht zal doen komen.", "Jak 4:13-17": "Kom nu, u die zegt: Wij zullen vandaag of morgen naar die en die stad reizen, en daar een jaar doorbrengen, en handel drijven, en winst maken. U weet niet wat morgen gebeuren zal, want hoe is uw leven? Het is immers een damp, die voor een korte tijd zichtbaar is, en daarna verdwijnt. In plaats daarvan zou u moeten zeggen: Als de Heere het wil, en wij leven, zullen wij dit of dat doen.", "Ps 104:14": "Hij doet het gras uitspruiten voor de dieren, en het gewas tot dienst van de mens, zodat brood uit de aarde voortkomt.", "Joh 5:44": "Hoe kunt u geloven, u die eer van elkaar aanneemt, en de eer die van God alleen is, niet zoekt?", "Fil 2:13": "Want het is God, Die in u werkt, zowel het willen als het werken, naar Zijn welbehagen.", "Mal 2:2": "Als u niet zult horen, en als u het niet ter harte zult nemen om Mijn Naam eer te geven, zegt de HEERE van de heerscharen, dan zal Ik de vloek onder u zenden, en Ik zal uw zegeningen vervloeken; ja, Ik heb ook al elk daarvan vervloekt, omdat u het niet ter harte neemt.", "Spr 28:13": "Wie zijn overtredingen bedekt, zal geen voorspoed hebben; maar wie ze belijdt en laat, zal barmhartigheid ontvangen.", "Ps 37:3-5": "Beth. Vertrouw op de HEERE, en doe het goede; bewoon de aarde, en voed u met trouw. En verlustig u in de HEERE, zo zal Hij u geven de verlangens van uw hart. Gimel. Leg uw weg in de handen van de HEERE, en vertrouw op Hem; Hij zal het maken;", "Luk 22:29": "En Ik ken u het Koninkrijk toe, zoals Mijn Vader dat Mij toegekend heeft;", "Jes 33:17": "Uw ogen zullen de Koning zien in Zijn schoonheid; zij zullen een ver gelegen land zien.", "Job 22:23": "Als u zich bekeert tot de Almachtige, zult u gebouwd worden; doe het onrecht ver van uw tenten.", "Ezra 8:25-35": "En ik woog hun toe het zilver, en het goud, en de vaten, zijnde de offering van het huis van onze God die de koning en zijn raadsheren, en zijn vorsten, en heel Israël, die daar gevonden werden, geofferd hadden; ik woog dan aan hun hand zeshonderdvijftig talenten van het zilver, en honderd zilveren vaten in talenten; aan goud, honderd talenten; en twintig gouden bekers, tot duizend drachmen; en twee vaten van blinkend goed koper, begeerlijk als goud.", "Joh 6:40": "En dit is de wil van Hem die Mij gezonden heeft: dat ieder die de Zoon aanschouwt en in Hem gelooft, het eeuwige leven heeft; en Ik zal hem opwekken op de laatste dag.", "Openb 6:5-8": "En toen Het het derde zegel geopend had, hoorde ik het derde dier zeggen: Kom en zie! En ik zag, en zie, een zwart paard, en die daarop zat, had een weegschaal in zijn hand. En ik hoorde een stem in het midden van de vier dieren, die zei: Een maatje tarwe voor een penning, en drie maatjes gerst voor een penning; en beschadig de olie en de wijn niet. En toen Het het vierde zegel geopend had, hoorde ik een stem van het vierde dier, die zei: Kom en zie!", "Ezech 33:19": "En als de goddeloze zich bekeert van zijn goddeloosheid, en recht en gerechtigheid doet, zal hij daardoor leven.", "1 Tim 1:16": "Maar juist daarom is mij barmhartigheid overkomen, opdat Jezus Christus in mij, die de voornaamste ben, al Zijn geduld zou tonen, tot een voorbeeld voor hen die later in Hem geloven zullen tot het eeuwige leven.", "Dan 10:7-9": "En ik, Daniël, zag alleen dat gezicht, maar de mannen die bij mij waren, zagen dat gezicht niet; maar er viel een grote schrik op hen, en zij vluchtten om zich te verbergen. Ik dan bleef alleen achter, en zag dit grote gezicht, en er bleef in mij geen kracht over; en mijn schoonheid veranderde in verval, zodat ik geen kracht behield. En ik hoorde de stem van Zijn woorden; en toen ik de stem van Zijn woorden hoorde, viel ik in een diepe slaap op mijn gezicht, met mijn gezicht op de grond.", "2 Kron 29:15": "En zij verzamelden hun broeders, en heiligden zich, en kwamen, volgens het gebod van de koning, door de woorden van de HEERE, om het huis van de HEERE te reinigen.", "Hagg 2:1": "Op de vierentwintigste dag van de maand, in de zesde maand, in het tweede jaar van koning Darius.", "Nahum 1:15": "Zie op de bergen de voeten van hem die het goede nieuws brengt, die vrede laat horen; vier uw feestdagen, o Juda! Betaal uw geloften; want de man van Belial zal voortaan niet meer door u heen gaan, hij is helemaal uitgeroeid.", "Gen 22:17": "Voorzeker zal Ik u rijk zegenen, en uw nageslacht zeer talrijk maken, als de sterren van de hemel, en als het zand dat aan de oever van de zee is; en uw nageslacht zal de poort van zijn vijanden erfelijk bezitten.", "Hand 10:4": "En hij hield de ogen op hem gericht, en werd zeer bevreesd, en zei: Wat is er, Heere? En Hij zei tegen hem: Uw gebeden en uw aalmoezen zijn als gedachtenis opgekomen voor God.", "Hebr 4:16": "Laat ons dan met vrijmoedigheid toegaan tot de troon van de genade, opdat wij barmhartigheid mogen verkrijgen en genade vinden om geholpen te worden op de tijd dat wij het nodig hebben.", "Neh 5:14": "Ook heb ik, van de dag af dat hij mij bevolen heeft hun landvoogd te zijn in het land Juda, van het twintigste jaar af tot het tweeëndertigste jaar van koning Arthahsasta, dat is twaalf jaar, samen met mijn broeders het brood van het landvoogdschap niet gegeten.", "Luk 15:1-10": "En alle tollenaars en zondaars kwamen naar Hem toe, om Hem te horen. En de Farizeeën en de Schriftgeleerden mopperden en zeiden: Deze man ontvangt de zondaars, en eet met hen. En Hij sprak deze gelijkenis tegen hen, en zei:", "Hand 21:10": "En toen wij daar veel dagen gebleven waren, kwam er een zekere profeet uit Judea aan, met de naam Agabus.", "Ex 33:9": "En het gebeurde, als Mozes de tent binnengegaan was, dat de wolkkolom neerdaalde en bleef staan in de deur van de tent, en Hij sprak met Mozes.", "Spr 3:10": "Zo zullen uw schuren met overvloed gevuld worden, en uw perskuipen van most overlopen.", "Ps 41:3": "De HEERE zal hem bewaren, en zal hem bij het leven behouden; hij zal op aarde gelukkig gemaakt worden. Geef hem ook niet over in de begeerte van zijn vijanden.", "Ps 118:26": "Gezegend is hij die daar komt in de Naam van de HEERE! Wij zegenen u uit het huis van de HEERE.", "Pred 10:19": "Men maakt maaltijden om te lachen, en de wijn verheugt de levenden, en het geld verschaft alles.", "Luk 21:18": "Toch zal er geen haar van uw hoofd verloren gaan.", "Ex 25:1-8": "Toen sprak de HEERE tot Mozes en zei: Spreek tot de kinderen van Israël, dat zij voor Mij een hefoffer nemen. Van elke man wiens hart zich vrijwillig bewegen zal, zult u Mijn hefoffer nemen. Dit nu is het hefoffer, dat u van hen nemen zult: goud, zilver en koper;", "Ex 9:21": "maar wie zijn hart niet richtte op het woord van de HEERE, die liet zijn dienaren en zijn vee op het veld.", "Deut 12:17-19": "U zult in uw poorten niet mogen eten de tienden van uw koren, en van uw most, en van uw olie, noch de eerstgeboorte van uw runderen en van uw schapen, noch enige van uw geloften die u zult hebben beloofd, noch uw vrijwillige offers, noch het hefoffer van uw hand. Maar u zult dat eten voor het aangezicht van de HEERE, uw God, in de plaats die de HEERE, uw God, zal uitkiezen, u, en uw zoon, en uw dochter, en uw dienstknecht, en uw dienstmaagd, en de Leviet die in uw poorten is; en u zult vrolijk zijn voor het aangezicht van de HEERE, uw God, over alles waaraan u uw handen geslagen hebt. Wacht u ervoor dat u de Leviet niet verlaat, al uw dagen in uw land.", "Pred 4:8": "Daar is er een, en geen tweede; hij heeft ook geen kind, noch broer; toch komt aan al zijn moeite geen einde; ook wordt zijn oog niet verzadigd van de rijkdom, en hij zegt niet: Voor wie zwoeg ik toch, en laat ik mijn ziel gebrek lijden aan het goede? Dit is ook vluchtigheid, en het is een moeilijke bezigheid.", "Kol 3:2": "Bedenk de dingen die boven zijn, niet die op de aarde zijn.", "Openb 2:26-28": "En wie overwint, en Mijn werken tot het einde toe bewaart, hem zal Ik macht geven over de heidenen; En hij zal hen hoeden met een ijzeren staf; zij zullen als pottenbakkersvaten vermorzeld worden; zoals ook Ik van Mijn Vader ontvangen heb. En Ik zal hem de morgenster geven.", "Rom 10:11-13": "Want de Schrift zegt: Ieder die in Hem gelooft, zal niet beschaamd worden. Want er is geen onderscheid tussen Jood en Griek; want eenzelfde Heere is Heere van allen, rijk over allen die Hem aanroepen. Want ieder die de Naam van de Heere zal aanroepen, zal zalig worden.", "1 Tim 6:17-19": "Beveel de rijken in deze tegenwoordige wereld dat zij niet hoogmoedig zijn, en ook niet hun hoop stellen op de onzekerheid van de rijkdom, maar op de levende God, Die ons alle dingen rijkelijk verleent om ervan te genieten; dat zij goed doen, rijk worden in goede werken, vrijgevig zijn en bereid om te delen; en zo voor zichzelf een schat wegleggen, een goed fundament voor de toekomst, opdat zij het eeuwige leven verkrijgen mogen.", "Joël 1:16": "Is niet het voedsel voor onze ogen afgesneden? Blijdschap en verheuging van het huis van onze God?", "Spr 14:13": "Het hart zal ook bij het lachen verdriet hebben; en het einde van die blijdschap is droefheid.", "Gal 3:29": "En als u van Christus bent, dan bent u Abrahams nageslacht, en naar de belofte erfgenamen.", "Ef 5:5": "Want dit weet u, dat geen hoereerder, of onreine, of hebzuchtige, die een afgodendienaar is, erfenis heeft in het Koninkrijk van Christus en van God.", "1 Kron 22:1": "En David zei: Hier zal het huis van God, de HEERE, zijn, en hier zal het altaar van het brandoffer voor Israël zijn.", "Micha 1:1": "Het woord van de HEERE, dat gebeurd is tot Micha, de Morastiet, in de dagen van Jotham, Achaz en Jehizkia, koningen van Juda; dat hij gezien heeft over Samaria en Jeruzalem.", "Ezech 16:30": "Hoe zwak is uw hart (spreekt de Heere HEERE) dat u al deze dingen doet, het werk van een heersende hoerachtige vrouw!", "1 Kon 6:13": "En Ik zal in het midden van de kinderen van Israël wonen; en Ik zal Mijn volk Israël niet verlaten.", "Luk 12:34": "Want waar uw schat is, daar zal ook uw hart zijn.", "Jes 66:14": "En u zult het zien, en uw hart zal vrolijk zijn, en uw beenderen zullen groeien als het tedere gras; dan zal de hand van de HEERE bekend worden aan Zijn knechten, en Hij zal boos worden op Zijn vijanden.", "Pred 11:4": "Wie op de wind let, die zal niet zaaien, en wie op de wolken ziet, die zal niet maaien.", "Joh 13:36": "Simon Petrus zei tegen Hem: Heere, waar gaat U heen? Jezus antwoordde hem: Waar Ik heenga, kunt u Mij nu niet volgen; maar u zult Mij later volgen.", "Deut 28:22": "De HEERE zal u slaan met tering, en met koorts, en met ontsteking, en met hitte, en met droogte, en met korenbrand, en met meeldauw, die u zullen achtervolgen totdat u omkomt.", "Ezech 18:28": "Omdat hij toeziet, en zich bekeert van al zijn overtredingen, die hij gedaan heeft, zal hij zeker leven, hij zal niet sterven.", "1 Kon 14:18": "En zij begroeven hem, en heel Israël beklaagde hem; naar het woord van de HEERE, dat Hij gesproken had door de dienst van Zijn dienaar Ahia, de profeet.", "Ex 3:12": "Hij dan zei: Ik zal zeker met u zijn, en dit zal u een teken zijn dat Ik u gezonden heb: wanneer u dit volk uit Egypte geleid hebt, zult u God dienen op deze berg.", "Rom 12:13": "Deel mee in de behoeften van de heiligen. Streef naar gastvrijheid.", "Jes 28:4": "En de verwelkende bloem van zijn heerlijke sieraad, die op het hoofd van de zeer vruchtbare vallei is, zal zijn als een vroegrijpe vrucht vóór de zomer, die, wanneer iemand ze ziet, terwijl zij nog in zijn hand is, hij opslokt.", "Hand 7:55": "Maar hij, vol van de Heilige Geest, hield de ogen gericht naar de hemel, en zag de heerlijkheid van God, en Jezus, staande aan de rechterhand van God.", "Deut 14:26": "En geef dat geld voor alles wat uw ziel verlangt, voor runderen en voor schapen, en voor wijn, en voor sterke drank, en voor alles wat uw ziel van u begeren zal, en eet daar voor het aangezicht van de HEERE, uw God, en wees vrolijk, u en uw huis.", "2 Kon 6:8-12": "En de koning van Syrië voerde oorlog tegen Israël, en overlegde met zijn knechten, en zei: Mijn legerplaats zal zijn bij die en die plaats. Maar de man van God zond bericht aan de koning van Israël, en zei: Wacht u ervoor dat u door die plaats trekt, want de Syriërs zijn daarheen afgekomen. Daarom zond de koning van Israël bericht naar die plaats, waarover de man van God hem gezegd en gewaarschuwd had, en hij wachtte zich daar, niet één keer, en niet twee keer.", "Matt 18:10": "Kijk uit dat u niet één van deze kleinen veracht. Want Ik zeg u dat hun engelen in de hemelen altijd het aangezicht zien van Mijn Vader, Die in de hemelen is.", "Hand 21:4": "En wij vonden de discipelen en bleven daar zeven dagen; die zeiden door de Geest tegen Paulus dat hij niet naar Jeruzalem moest gaan.", "Matt 6:31-33": "Wees daarom niet bezorgd en zeg niet: Wat zullen wij eten, of wat zullen wij drinken, of waarmee zullen wij ons kleden? Want al deze dingen zoeken de heidenen; want uw hemelse Vader weet dat u al deze dingen nodig hebt. Maar zoek eerst het Koninkrijk van God en Zijn gerechtigheid, en al deze dingen zullen u erbij gegeven worden.", "Pred 11:10": "Doe dan de toorn wijken uit uw hart, en doe het kwade weg van uw lichaam, want de jeugd en de jonge jaren zijn vergankelijk.", "1 Kon 22:28": "En Micha zei: Als u ooit in vrede terugkomt, dan heeft de HEERE niet door mij gesproken! Verder zei hij: Hoor, alle volken!", "Ps 41:12": "Hierbij weet ik, dat U lust aan mij hebt, dat mijn vijand over mij niet zal juichen.", "Jer 6:13": "Want van hun kleinste aan tot hun grootste toe pleegt ieder van hen gierigheid, en van de profeet aan tot de priester toe bedrijft ieder van hen valsheid.", "Job 11:15-20": "Want dan zult u uw gezicht opheffen zonder smet, en zult vast staan, en niet vrezen. Want u zult de moeite vergeten, en er aan denken als aan water dat voorbijgegaan is. Ja, uw levenstijd zal helderder dan de middag oprijzen; u zult stralen, als de morgenstond zult u zijn.", "Mark 2:17": "En Jezus hoorde dat, en zei tegen hen: Wie gezond zijn, hebben de dokter niet nodig, maar wie ziek zijn. Ik ben niet gekomen om rechtvaardigen te roepen, maar zondaars tot bekering.", "Ps 102:15": "Want Uw knechten hebben een welgevallen aan haar stenen, en hebben medelijden met haar gruis.", "Job 8:21": "totdat Hij uw mond met gelach vervult, en uw lippen met gejuich.", "Ps 45:12": "Zo zal de Koning verlangen naar uw schoonheid; omdat Hij uw Heere is, buig u voor Hem neer.", "Spr 3:32": "Want de afwijker is de HEERE een gruwel; maar Zijn verborgenheid is met de oprechte.", "Deut 16:6-8": "Maar in de plaats die de HEERE, uw God, zal uitkiezen om Zijn Naam daar te doen wonen, daar zult u het pascha slachten, aan de avond, als de zon ondergaat, op de vastgestelde tijd van uw uittrekken uit Egypte. Dan zult u het koken en eten in de plaats die de HEERE, uw God, zal uitkiezen; daarna zult u zich 's morgens omkeren en teruggaan naar uw tenten. Zes dagen zult u ongezuurde broden eten, en op de zevende dag is het een dag van het verbod voor de HEERE, uw God; dan zult u geen werk doen.", "Ps 25:14": "Samech. De verborgenheid van de HEERE is voor hen die Hem vrezen; en Zijn verbond, om het hun bekend te maken.", "1 Kon 3:1": "En Salomo verzwagerde zich met Farao, de koning van Egypte; hij nam de dochter van Farao en bracht haar naar de stad van David, totdat hij klaar zou zijn met het bouwen van zijn huis en het huis van de HEERE, en de muur van Jeruzalem rondom.", "Luk 22:30": "opdat u eet en drinkt aan Mijn tafel in Mijn Koninkrijk, en zit op tronen, en de twaalf stammen van Israël oordeelt.", "1 Joh 3:2": "Geliefden, nu zijn wij kinderen van God, en het is nog niet openbaar geworden wat wij zijn zullen. Maar wij weten dat, als Hij geopenbaard zal zijn, wij Hem gelijk zullen zijn; want wij zullen Hem zien zoals Hij is.", "Hebr 12:22": "Maar u bent gekomen tot de berg Sion, en de stad van de levende God, tot het hemelse Jeruzalem, en de vele duizenden engelen;", "1 Joh 3:22": "en wat wij ook bidden, ontvangen wij van Hem, omdat wij Zijn geboden bewaren en doen wat welgevallig is voor Hem.", "Num 11:17": "Dan zal Ik neerkomen en daar met u spreken; en van de Geest die op u is, zal Ik afnemen, en op hen leggen; en zij zullen met u de last van dit volk dragen, opdat u die niet alleen draagt.", "Jer 3:19": "Ik zei wel: Hoe zal Ik u onder de kinderen plaatsen, en u het begeerlijke land geven, de sierlijke erfenis van de heerscharen van de heidenvolken? Maar Ik zei: U zult tot Mij roepen: Mijn Vader! en u zult van achter Mij niet afkeren.", "Ps 37:23": "Mem. De gangen van deze man worden door de HEERE bevestigd; en Hij heeft vreugde in zijn weg.", "Jer 36:7": "Misschien zal hun smeking voor het aangezicht van de HEERE neervallen, en zullen zij zich bekeren, ieder van zijn boze weg; want groot is de toorn en de grimmigheid die de HEERE tegen dit volk heeft uitgesproken.", "Hagg 1:2-9": "Zo spreekt de HEERE van de heerscharen: Dit volk zegt: De tijd is niet gekomen, de tijd dat het huis van de HEERE gebouwd moet worden. En het woord van de HEERE kwam door de dienst van de profeet Haggai, en Hij zei: Is het voor u wel de tijd om te wonen in uw gewelfde huizen, terwijl dit huis woest zal zijn?", "Gen 6:9": "Dit zijn de afstammelingen van Noach. Noach was een rechtvaardig, oprecht man onder zijn tijdgenoten. Noach wandelde met God.", "Jes 33:21": "Maar de HEERE zal daar bij ons heerlijk zijn, het zal een plaats zijn van rivieren, van wijde stromen; geen roeischuit zal daar doorvaren, en geen praalschip zal daar overvaren.", "1 Kon 7:40": "Daartoe maakte Hiram de wasvaten, de scheppen, en de sprenkelschalen; en Hiram maakte al het werk af dat hij voor koning Salomo maakte voor het huis van de HEERE:", "2 Kon 11:15": "Maar de priester Jojada gebood aan de leiders van honderd, die over het leger gesteld waren, en zei tegen hen: Breng haar naar buiten, tot buiten de gelederen, en dood wie haar volgt, met het zwaard; want de priester had gezegd: Laat haar niet in het huis van de HEERE gedood worden.", "Matt 19:24": "En verder zeg Ik u: Het is gemakkelijker dat een kameel door het oog van een naald gaat, dan dat een rijke ingaat in het Koninkrijk van God.", "Luk 3:17": "Zijn wan is in Zijn hand, en Hij zal Zijn dorsvloer grondig reinigen, en de tarwe zal Hij in Zijn schuur samenbrengen; maar het kaf zal Hij met onblusbaar vuur verbranden.", "Dan 8:16": "En ik hoorde tussen de oevers van de Ulai een mensenstem, die riep en zei: Gabriël! leg deze man het gezicht uit.", "Kol 3:6": "Om deze dingen komt de toorn van God over de kinderen van de ongehoorzaamheid.", "1 Joh 2:28": "En nu, kinderen, blijft in Hem; opdat, wanneer Hij geopenbaard zal zijn, wij vrijmoedigheid hebben, en wij bij Zijn komst niet beschaamd worden voor Hem.", "2 Kor 13:5": "Onderzoek uzelf, of u in het geloof bent, beproef uzelf. Of weet u zelf niet, dat Jezus Christus in u is? Tenzij u op de een of andere manier verwerpelijk bent.", "1 Tess 1:6": "En u bent navolgers geworden van ons en van de Heere, doordat u het Woord aannam onder veel verdrukking, met blijdschap van de Heilige Geest;", "Jer 7:5": "Maar als u uw wegen en uw handelingen werkelijk goed maakt, als u werkelijk recht doet tussen de man en zijn naaste;", "Hebr 10:25": "en laten wij onze onderlinge bijeenkomst niet nalaten, zoals sommigen dat gewend zijn, maar elkaar vermanen; en dat des te meer, naarmate u ziet dat de dag nadert.", "Jak 1:25": "Maar wie zich verdiept in de volmaakte wet, die van de vrijheid is, en daarbij blijft, die is geen vergeetachtige hoorder geworden, maar een dader van het werk, die zal, zeg ik, gelukzalig zijn in dit zijn doen.", "Klaagl 1:21": "Schin. Zij horen, dat ik zucht, maar ik heb geen trooster; al mijn vijanden horen mijn kwaad; en zij zijn vrolijk, dat Gij het gedaan hebt; als Gij de dag zult hebben voortgebracht, die Gij uitgeroepen hebt, dan zullen zij zijn, gelijk ik ben.", "Hos 2:6": "En zij zal haar minnaars nalopen, maar hen niet aantreffen; en zij zal hen zoeken, maar niet vinden; dan zal zij zeggen: Ik zal heengaan, en terugkeren naar mijn vorige Man, want toen ging het mij beter dan nu.", "Luk 21:28": "Wanneer nu deze dingen beginnen te gebeuren, kijk dan omhoog, en hef uw hoofden opwaarts, omdat uw verlossing nabij is.", "Ex 20:21": "En het volk bleef op een afstand staan; maar Mozes naderde tot de donkerheid waar God was.", "Zach 3:7": "Zo zegt de HEERE van de heerscharen: Als u in Mijn wegen wandelt, en als u Mijn wacht waarneemt, dan zult u ook Mijn huis richten, en ook Mijn voorhoven bewaren; en Ik zal u wandelingen geven onder dezen, die hier staan.", "2 Kor 8:11-15": "Maar voleindig nu ook het doen; opdat, zoals er geweest is de bereidheid van het gemoed om te willen, er ook zo het voleindigen zij uit wat u hebt. Want als de bereidheid van het gemoed er eerst is, dan is iemand aangenaam naar wat hij heeft, niet naar wat hij niet heeft. Want dit zeg ik niet, opdat anderen verlichting zouden hebben, en u verdrukking;", "Jer 30:11": "Want Ik ben met u, spreekt de HEERE, om u te verlossen; want Ik zal een voleinding maken met al de heidenen, waarheen Ik u verstrooid heb; maar met u zal Ik geen voleinding maken; maar Ik zal u kastijden met mate, en u niet helemaal ongestraft laten.", "Matt 1:23": "Zie, de maagd zal zwanger worden en een Zoon baren, en u zult Hem de naam Emmanuel geven; dat betekent, vertaald: God met ons.", "Openb 3:16": "Zo dan, omdat u lauw bent, en noch koud noch heet, zal Ik u uit Mijn mond spuwen.", "Joël 2:15-17": "Waait op de bazuin te Sion, heiligt een vasten, roept een verbodsdag uit. Verzamelt het volk, heiligt de gemeente, vergadert de oudsten, verzamelt de kinderen, en wie de borsten zuigen; de bruidegom ga uit zijn binnenkamer, en de bruid uit haar slaapkamer. Laat de priesters, de dienaars van de HEERE, wenen tussen het voorhuis en het altaar, en laat hen zeggen: Spaar Uw volk, o HEERE! en geef Uw erfenis niet over tot een smaad, dat de heidenen over hen zouden heersen; waarom zouden zij onder de volken zeggen: Waar is hun God?", "1 Petr 4:3": "Want het is ons genoeg dat wij in de voorgaande tijd van ons leven de wil van de heidenen volbracht hebben, en geleefd hebben in losbandigheid, begeerten, dronkenschap, zwelgpartijen, drinkgelagen en gruwelijke afgoderij;", "2 Kor 4:15": "Want al deze dingen zijn om uw wil, opdat de vermenigvuldigde genade, door de dankzegging van velen, overvloedig wordt tot heerlijkheid van God.", "1 Kron 3:17": "En de kinderen van Jechonia waren Assir; zijn zoon was Sealthiël;", "Ezra 3:7": "Zo gaven zij geld aan de houwers en werkmeesters, ook eten en drinken, en olie aan de Sidoniërs en aan de Tyriërs, om cederhout van de Libanon te brengen naar de zee bij Jafo, naar de vergunning die Kores, koning van Perzië, hun gegeven had.", "Ezra 5:2": "Toen maakten Zerubbabel, de zoon van Sealthiël, en Jesua, de zoon van Jozadak, zich op en begonnen het huis van God te bouwen, Dat te Jeruzalem woont; en met hen de profeten van God, die hen ondersteunden.", "Ezech 5:16": "Wanneer Ik de boze pijlen van de honger tegen hen uitzenden zal, die tot verderf zullen zijn, die Ik uitzenden zal om u te verderven; zo zal Ik de honger over u vermeerderen, en u de staf van het brood breken.", "Luk 20:36": "want zij kunnen niet meer sterven, want zij zijn gelijk aan de engelen; en zij zijn kinderen van God, omdat zij kinderen van de opstanding zijn.", "Ex 18:21": "Doch zoek u onder al het volk uit naar bekwame mannen, die God vrezen, betrouwbare mannen, die hebzucht haten; stel hen aan over hen als leiders over duizend, leiders over honderd, leiders over vijftig, en leiders over tien.", "Openb 2:5": "Bedenk dan waarvan u uitgevallen bent, en bekeer u, en doe de eerste werken; en zo niet, Ik zal u haastig bij komen, en zal uw kandelaar van zijn plaats wegnemen, als u zich niet bekeert.", "Jes 4:6": "En daar zal een hut zijn tot een schaduw overdag tegen de hitte, en tot een toevlucht, en tot een schuilplaats tegen de vloed en tegen de regen.", "Rom 1:1": "Paulus, een dienstknecht van Jezus Christus, een geroepen apostel, afgezonderd tot het Evangelie van God,", "Jona 3:8": "Maar mens en dier zullen met zakken bedekt zijn, en zullen sterk tot God roepen; en zij zullen zich bekeren, ieder van zijn boze weg, en van het geweld dat in hun handen is.", "Joh 17:24": "Vader, Ik wil dat waar Ik ben, ook zij die bij Mij zijn, die U Mij gegeven hebt; opdat zij Mijn heerlijkheid mogen aanschouwen, die U Mij gegeven hebt; want U hebt Mij liefgehad, voor de grondlegging van de wereld.", "Matt 24:39": "en zij merkten het niet, totdat de zondvloed kwam en hen allen wegnam; zo zal ook de komst van de Zoon des mensen zijn.", "Zach 10:7": "En zij zullen zijn als een held van Efraïm, en hun hart zal zich verblijden als door de wijn; en hun kinderen zullen het zien en zich verblijden, hun hart zal zich verheugen in de HEERE.", "Ps 3:9": "Het heil is van de HEERE; Uw zegen is over Uw volk. Sela.", "Ex 24:16": "En de heerlijkheid van de HEERE woonde op de berg Sinaï, en de wolk bedekte hem zes dagen, en op de zevende dag riep Hij Mozes uit het midden van de wolk.", "Job 13:23": "Hoeveel misdaden en zonden heb ik? Maak mij mijn overtreding en mijn zonden bekend.", "1 Sam 16:13": "Toen nam Samuël de oliehoorn, en zalfde hem te midden van zijn broers. En de Geest van de HEERE kwam vanaf die dag over David, en bleef. Daarna stond Samuël op, en ging naar Rama.", "Luk 7:27": "Deze is het, over wie geschreven is: Zie, Ik zend Mijn engel voor Uw aangezicht uit, die Uw weg voor U klaar zal maken.", "Ps 97:7": "Beschaamd moeten worden allen die de beelden dienen, die zich op afgoden beroemen; buig u neer voor Hem, alle goden!", "Luk 14:17-24": "En hij stuurde zijn dienstknecht op het uur van het avondmaal om tegen de genodigden te zeggen: Kom, want alles is nu klaar. En zij begonnen allen eensgezind zich te verontschuldigen. De eerste zei tegen hem: Ik heb een akker gekocht, en ik moet er wel op uitgaan om die te bekijken; ik vraag u, houd mij voor verontschuldigd. En een ander zei: Ik heb vijf span ossen gekocht, en ik ga erheen om ze te proberen; ik vraag u, houd mij voor verontschuldigd.", "Ezech 4:17": "Opdat zij gebrek hebben aan brood en water, en de een met de ander verbaasd worden, en in hun ongerechtigheid wegkwijnen.", "Hand 10:31": "en zie, een man stond voor mij, in een blinkend kleed, en zei: Cornelius! Uw gebed is verhoord, en uw aalmoezen zijn voor God in gedachtenis gekomen.", "Jes 5:8": "Wee hun die huis aan huis trekken, akker aan akker brengen, totdat er geen plaats meer is, en u alleen wonend achterblijft in het midden van het land!", "Ps 32:6-8": "Hierom zal iedere heilige U aanbidden in de tijd dat U te vinden bent; ja, in een overstroming van grote wateren zullen zij hem niet aanraken. U bent mij een schuilplaats; U behoedt mij voor benauwdheid; U omringt mij met vrolijke gezangen van bevrijding. Sela. Ik zal u onderwijzen, en u de weg leren die u moet gaan; Ik zal raad geven, Mijn oog zal op u zijn.", "Ezech 33:22": "Nu was de hand van de HEERE 's avonds op mij geweest, voordat wie ontkomen was kwam, en Hij had mijn mond geopend, totdat hij 's morgens tot mij kwam. Zo werd mijn mond geopend, en ik was niet meer stom.", "Ezech 3:24": "Toen kwam de Geest in mij, en stelde mij op mijn voeten, en Hij sprak met mij, en zei tot mij: Ga, sluit u binnen in uw huis.", "Jes 32:9-11": "Staat op, u geruste vrouwen, hoor mijn stem; u dochters, die zo zeker bent, neem mijn woorden ter oor. Vele dagen over het jaar zult u beroerd zijn, u dochters, die zo zeker bent, want de wijnoogst zal voorbij zijn, er zal geen inzameling komen. Beeft, u geruste vrouwen; wees beroerd, dochters, die zo zeker bent; trek u uit, en ontbloot u, en gord zakken om uw middel.", "Ps 91:3-7": "Want Hij zal u redden van de strik van de vogelvanger, van de zeer verderfelijke pestilentie. Hij zal u dekken met Zijn vlerken, en onder Zijn vleugels zult u vertrouwen; Zijn waarheid is een schild en beukelaar. U zult niet vrezen voor de schrik van de nacht, voor de pijl die overdag vliegt;", "Openb 3:3": "Bedenk dan hoe u het ontvangen en gehoord hebt, en bewaar het, en bekeer u. Als u dan niet waakt, zal Ik over u komen als een dief, en u zult niet weten op welk uur Ik over u komen zal.", "Rom 8:28": "En wij weten dat voor hen die God liefhebben, alle dingen meewerken ten goede, namelijk voor hen die naar Zijn voornemen geroepen zijn.", "1 Kor 6:10": "Vergis u niet; hoereerders, afgodendienaars, overspelers, ontuchtigen, mannen die bij mannen liggen, dieven, hebzuchtigen, dronkaards, geen lasteraars, geen rovers, zullen het Koninkrijk van God beërven.", "Jes 50:7-9": "Want de Heere HEERE helpt Mij, daarom word Ik niet te schande; daarom heb Ik Mijn gezicht gemaakt als een keisteen, want Ik weet dat Ik niet beschaamd zal worden. Hij is nabij, Die Mij rechtvaardigt, wie zal met Mij twisten? Laten wij samen staan; wie heeft een rechtszaak tegen Mij? Laat hij hierheen komen tot Mij. Zie, de Heere HEERE helpt Mij, wie is het die Mij zal veroordelen? Zie, zij zullen allemaal verslijten als een kleed, de mot zal hen opeten.", "Hebr 11:24-26": "Door het geloof heeft Mozes, toen hij groot geworden was, geweigerd een zoon van de dochter van Farao genoemd te worden; en verkoos hij liever met het volk van God slecht behandeld te worden, dan voor een tijd van de genietingen van de zonde te hebben; en achtte hij de smaad van Christus een grotere rijkdom dan de schatten in Egypte; want hij keek uit naar de vergelding van het loon.", "Ezech 20:43": "Daar zult u dan denken aan uw wegen, en aan al uw handelingen waarmee u zich verontreinigd hebt, en u zult van uzelf een afkeer hebben over al uw slechte daden die u gedaan hebt.", "Ps 94:18": "Toen ik zei: Mijn voet wankelt; Uw goedertierenheid, o HEERE! ondersteunde mij.", "Matt 5:4": "Zalig zijn zij die treuren, want zij zullen vertroost worden.", "Klaagl 5:5": "Wij worden vervolgd, met een juk op onze nek; zijn wij moe, men laat ons geen rust.", "Richt 19:18": "En hij zei tegen hem: Wij trekken door van Bethlehem-Juda tot aan de zijden van het gebergte van Efraïm, vandaar kom ik; en ik was naar Bethlehem-Juda gegaan, maar ik ga nu naar het huis van de HEERE; en er is niemand die mij in huis neemt.", "Ex 33:17": "Toen zei de HEERE tegen Mozes: Ook deze zaak, die u gesproken hebt, zal Ik doen, omdat u genade gevonden hebt in Mijn ogen, en Ik u bij naam ken.", "Jes 61:1": "De Geest van de Heere HEERE is op Mij, omdat de HEERE Mij gezalfd heeft, om een blijde boodschap te brengen aan de zachtmoedigen; Hij heeft Mij gezonden om te verbinden de gebrokenen van hart, om de gevangenen vrijheid uit te roepen, en de gebondenen opening van de gevangenis;", "Ezech 37:27": "En Mijn tabernakel zal bij hen zijn, en Ik zal hun tot een God zijn, en zij zullen Mij tot een volk zijn.", "Hos 4:10": "En zij zullen eten, maar niet verzadigd worden, zullen hoereren, maar niet toenemen in aantal; want zij hebben nagelaten de Heere in acht te nemen.", "Luk 12:19": "en ik zal tegen mijn ziel zeggen: Ziel, je hebt veel goederen liggen, voor vele jaren; neem rust, eet, drink, wees vrolijk.", "Ps 68:17": "Waarom springt u op, u bultige bergen? Deze berg heeft God begeerd tot Zijn woning; ook zal de HEERE er wonen in eeuwigheid.", "2 Kon 20:8": "Hizkia nu had tegen Jesaja gezegd: Wat is het teken dat de HEERE mij gezond zal maken, en dat ik op de derde dag naar het huis van de HEERE zal opgaan?", "Ezra 4:2": "kwamen zij naar Zerubbabel en naar de hoofden van de families toe en zeiden tegen hen: Laat ons met u bouwen, want wij zoeken uw God net als u; ook offeren wij aan Hem sinds de dagen van Esar-Haddon, de koning van Assur, die ons hierheen heeft laten optrekken.", "Num 24:15": "Toen hief hij zijn spreuk op en zei: Bileam, de zoon van Beor, spreekt, en die man wiens ogen geopend zijn, spreekt!", "Matt 25:34-40": "Dan zal de Koning zeggen tegen hen die aan Zijn rechterhand zijn: Kom, u gezegenden van Mijn Vader! Beërf het Koninkrijk dat voor u bereid is vanaf de grondlegging van de wereld. Want Ik ben hongerig geweest, en u hebt Mij te eten gegeven; Ik ben dorstig geweest, en u hebt Mij te drinken gegeven; Ik was een vreemdeling, en u hebt Mij een onderkomen gegeven. Ik was naakt, en u hebt Mij gekleed; Ik ben ziek geweest, en u hebt Mij bezocht; Ik was in de gevangenis, en u bent bij Mij gekomen.", "Job 10:12": "Naast het leven hebt U goedertierenheid aan mij bewezen, en Uw zorg heeft mijn geest bewaard.", "Lev 22:29": "En als u een lofoffer aan de HEERE zult slachten, zult u het naar uw wil slachten.", "Amos 5:17": "Ja, in alle wijngaarden zal rouwklacht zijn; want Ik zal door uw midden trekken, zegt de HEERE.", "2 Tim 3:2-4": "Want de mensen zullen zijn: liefhebbers van zichzelf, geldgierig, grootsprakerig, hoogmoedig, lasteraars, aan hun ouders ongehoorzaam, ondankbaar, onheilig, zonder natuurlijke liefde, onverzoenlijk, kwaadsprekers, onmatig, wreed, zonder liefde tot het goede, verraders, roekeloos, opgeblazen, meer liefhebbers van de wellusten dan liefhebbers van God;", "Ps 94:17": "Als de HEERE mij geen Hulp was geweest, had mijn ziel bijna in de stilte gewoond.", "Num 6:27": "Zo zullen ,</span> came the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H3027\">by</span> <span class=\"wl wl-kjv\" data-code=\"H2292\">Haggai</span> the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophet</span> unto <span class=\"wl wl-kjv\" data-code=\"H2216\">Zerubbabel</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H7597\">Shealtiel,</span> <span class=\"wl wl-kjv\" data-code=\"H6346\">governor</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> and to <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H3087\">Josedech,</span> the <span class=\"wl wl-kjv\" data-code=\"H1419\">high</span> <span class=\"wl wl-kjv\" data-code=\"H3548\">priest,</span> saying,", "2": "Thus <span class=\"wl wl-kjv\" data-code=\"H559\">speaketh</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> This <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> The <span class=\"wl wl-kjv\" data-code=\"H6256\">time</span> is not <span class=\"wl wl-kjv\" data-code=\"H935\">come,</span> the <span class=\"wl wl-kjv\" data-code=\"H6256\">time</span> that the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD'S</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> should be built.", "3": "Then came the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H3027\">by</span> <span class=\"wl wl-kjv\" data-code=\"H2292\">Haggai</span> the <span class=\"wl wl-kjv\" data-code=\"H5030\">proph (function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');

    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'

  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +

    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');

  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };

})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,

// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}

      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;

}
