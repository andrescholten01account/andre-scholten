 en dat u loopt, ieder voor zijn eigen huis.","10":"Daarom onthouden de hemelen zich boven u van dauw, en het land onthoudt zijn vruchten.","11":"Want Ik heb een droogte geroepen over het land, en over de bergen, en over het koren, en over de most, en over de olie, en over wat de aardbodem zou voortbrengen; ook over de mensen, en over de dieren, en over alle arbeid van de handen.","12":"Toen luisterden Zerubbabel, de zoon van Sealthiël, en Josua, de zoon van Jozadak, de hogepriester, en heel het overblijfsel van het volk, naar de stem van de HEERE, hun God, en naar de woorden van de profeet Haggai, zoals de HEERE, hun God, hem gezonden had; en het volk vreesde voor het aangezicht van de HEERE.","13":"Toen sprak Haggai, de bode van de HEERE, in de boodschap van de HEERE, tot het volk, en hij zei: Ik ben met u, spreekt de HEERE.","14":"En de HEERE wekte de geest op van Zerubbabel, de zoon van Sealthiël, de vorst van Juda, en de geest van Josua, de zoon van Jozadak, de hogepriester, en de geest van heel het overblijfsel van het volk; en zij kwamen en gingen aan het werk in het huis van de HEERE van de heerscharen, hun God,"},"SV":{"1":"In het tweede jaar van den koning Darius, in de zesde maand, op den eersten dag der maand, geschiedde het woord des HEEREN, door den dienst van Haggai, den profeet, tot Zerubbabel, den zoon van Sealthiël, den vorst van Juda, en tot Josua, den zoon van Jozadak, den hogepriester, zeggende:","2":"Alzo spreekt de HEERE der heirscharen zeggende: Dit volk zegt: De tijd is niet gekomen, de tijd, dat des HEEREN huis gebouwd worde.","3":"En het woord des HEEREN geschiedde door den dienst van den profeet Haggai, zeggende:","4":"Is het voor ulieden wel de tijd, dat gij woont in uw gewelfde huizen, en zal dit huis woest zijn?","5":"Nu dan, alzo zegt de HEERE der heirscharen: Stelt uw hart op uw wegen.","6":"Gij zaait veel, en gij brengt weinig in; gij eet, maar niet tot verzadiging; gij drinkt, maar niet tot dronken worden toe; gij kleedt u, maar niet tot uw verwarming, en wie loon ontvangt, die ontvangt dat loon in een doorgeboorden buidel.","7":"Alzo zegt de HEERE der heirscharen: Stelt uw hart op uw wegen.","8":"Klimt op het gebergte, en brengt hout aan, en bouwt dit huis, en Ik zal een welgevallen daaraan hebben, en verheerlijkt worden, zegt de HEERE.","9":"Gij ziet om naar veel, maar ziet, gij bekomt weinig; en als gij het in huis gebracht hebt, zo blaas Ik daarin. Waarom dat? spreekt de HEERE der heirscharen; om Mijns huizes wil, hetwelk woest is, en dat gij loopt elk voor zijn eigen huis.","10":"Daarom onthouden zich de hemelen over u, dat er geen dauw is, en het land onthoudt zijn vruchten.","11":"Want Ik heb een droogte geroepen over het land, en over de bergen, en over het koren, en over den most, en over de olie, en over hetgeen de aardbodem zou voortbrengen; ook over de mensen, en over de beesten, en over allen arbeid der handen.","12":"Toen hoorde Zerubbabel, de zoon van Sealthiël, en Josua, de zoon van Jozadak, de hogepriester, en al het overblijfsel des volks, naar de stem van den HEERE, hun God, en naar de woorden van den profeet Haggai, gelijk als hem de HEERE, hun God, gezonden had; en het volk vreesde voor het aangezicht des HEEREN.","13":"Toen sprak Haggai, de bode des HEEREN, in de boodschap des HEEREN, tot het volk, zeggende: Ik ben met ulieden, spreekt de HEERE.","14":"En de HEERE verwekte den geest van Zerubbabel, den zoon van Sealthiël, den vorst van Juda, en den geest van Josua, den zoon van Jozadak, den hogepriester, en den geest van het ganse overblijfsel des volks; en zij kwamen en maakten het werk in het huis van den HEERE der heirscharen, hun God."},"KJV":{"1":"In the second year of Darius the king, in the sixth month, in the first day of the month, came the word of the LORD by Haggai the prophet unto Zerubbabel the son of Shealtiel, governor of Judah, and to Joshua the son of Josedech, the high priest, saying,","2":"Thus speaketh the LORD of hosts, saying, This people say, The time is not come, the time that the LORD'S house should be built.","3":"Then came the word of the LORD by Haggai the prophet, saying,","4":"*Is it* time for you, O ye, to dwell in your cieled houses, and this house *lie* waste?","5":"Now therefore thus saith the LORD of hosts; Consider your ways.","6":"Ye have sown much, and bring in little; ye eat, but ye have not enough; ye drink, but ye are not filled with drink; ye clothe you, but there is none warm; and he that earneth wages earneth wages *to put it* into a bag with holes.","7":"Thus saith the LORD of hosts; Consider your ways.","8":"Go up to the mountain, and bring wood, and build the house; and I will take pleasure in it, and I will be glorified, saith the LORD.","9":"Ye looked for much, and, lo, *it came* to little; and when ye brought *it* home, I did blow upon it. Why? saith the LORD of hosts. Because of mine house that *is* waste, and ye run every man unto his own house.","10":"Therefore the heaven over you is stayed from dew, and the earth is stayed *from* her fruit.","11":"And I called for a drought upon the land, and upon the mountains, and upon the corn, and upon the new wine, and upon the oil, and upon *that* which the ground bringeth forth, and upon men, and upon cattle, and upon all the labour of the hands.","12":"Then Zerubbabel the son of Shealtiel, and Joshua the son of Josedech, the high priest, with all the remnant of the people, obeyed the voice of the LORD their God, and the words of Haggai the prophet, as the LORD their God had sent him, and the people did fear before the LORD.","13":"Then spake Haggai the LORD'S messenger in the LORD'S message unto the people, saying, I *am* with you, saith the LORD.","14":"And the LORD stirred up the spirit of Zerubbabel the son of Shealtiel, governor of Judah, and the spirit of Joshua the son of Josedech, the high priest, and the spirit of all the remnant of the people; and they came and did work in the house of the LORD of hosts, their God,","15":"In the four and twentieth day of the sixth month, in the second year of Darius the king."}},"tsk":{"1":[{"kopje":"tweede","refs":["Hagg 2:2","Hagg 2:11","Hagg 2:21","Ezra 4:24","Ezra 5:1","Ezra 5:2","Zach 1:1"]},{"kopje":"door de dienst van Haggai","refs":["Ex 4:13","1 Kon 14:18","2 Kon 14:25","Ezra 6:14"]},{"kopje":"tot","refs":["Hagg 1:12","Hagg 1:14","Hagg 2:3","Hagg 2:5","Hagg 2:22-24","1 Kron 3:17","1 Kron 3:19","Ezra 2:2","Ezra 3:2","Ezra 3:8","Ezra 4:2","Ezra 5:2","Neh 7:7","Zach 4:6-10","Matt 1:12","Matt 1:13","Luk 3:27"]},{"kopje":"vorst","refs":["Ezra 1:8","Ezra 2:63","Neh 5:14","Neh 8:10"]},{"kopje":"Josua","refs":["Ezra 2:2","Ezra 3:8","Ezra 5:2","Neh 12:1","Neh 12:10"]},{"kopje":"Jozadak","refs":["1 Kron 6:14","1 Kron 6:15"]}],"2":[{"kopje":"Dit","refs":["Num 13:31","Ezra 4:23","Ezra 4:24","Ezra 5:1","Ezra 5:2","Neh 4:10","Spr 22:13","Spr 26:13-16","Spr 29:25","Pred 9:10","Pred 11:4","Hoogl 5:2","Hoogl 5:3"]}],"3":[{"kopje":"door de dienst van de profeet Haggai","refs":["Ezra 5:1","Zach 1:1"]}],"4":[{"kopje":"om","refs":["2 Sam 7:2","Ps 132:3-5","Matt 6:33","Fil 2:21"]},{"kopje":"terwijl","refs":["Ps 74:7","Ps 102:15","Jer 26:6","Jer 26:18","Jer 52:13","Klaagl 2:7","Klaagl 4:1","Ezech 24:21","Dan 9:17","Dan 9:18","Dan 9:26","Dan 9:27","Micha 3:12","Matt 24:1","Matt 24:2"]}],"5":[{"kopje":"zo","refs":["Hagg 1:7","Hagg 2:16-19","Klaagl 3:40","Ezech 18:28","Luk 15:17","2 Kor 13:5","Gal 6:4"]},{"kopje":"Let goed op uw wegen","refs":["Ex 7:23","Ex 9:21","Ps 48:14","Ezech 40:4","Dan 6:15","Dan 10:12"]}],"6":[{"kopje":"brengt","refs":["Hagg 1:9","Hagg 2:17","Lev 26:20","Deut 28:38-40","2 Sam 21:1","Ps 107:34","Jes 5:10","Jer 14:4","Hos 4:10","Hos 8:7","Joël 1:10-13","Amos 4:6-9","Micha 6:14","Micha 6:15","Zach 8:10","Mal 2:2","Mal 3:9-11"]},{"kopje":"eet","refs":["Lev 26:26","1 Kon 17:12","Job 20:22","Jer 44:18","Ezech 4:16","Ezech 4:17"]},{"kopje":"doorgeboorde","refs":["Job 20:28","Zach 5:4"]}],"8":[{"kopje":"op","refs":["2 Kron 2:8-10","Ezra 3:7","Ezra 6:4","Zach t":"Anders: een woestheid; zie 2Ki 8:1 ; Jer 25:29 . Zie ook Deu 28:22 ; Joe 1:10 ; Amo 1:2 , en Amo 4:7-9 ."},{"catchword":"over allen arbeid der handen","tekst":"Dat is, over al de vruchten, die de aarde door den arbeid der mensen voortbrengt."}],"12":[{"catchword":"Toen hoorde Zerubbábel,","tekst":"Zie Ezr 5:2 ."},{"catchword":"al het overblijfsel des volks,","tekst":"Dat is, al die van den krijg waren overgebleven, [gedurende welken velen om hals gekomen waren] en die wedergekomen waren, uit de Babylonische gevangenschap, waar er ook velen gestorven waren."},{"catchword":"en naar de woorden van den profeet Haggaï,","tekst":"Anders: dat is."},{"catchword":"gelijk als hem de HEERE,","tekst":"Aangezien zij wisten dat hem de HEERE gezonden had."}],"13":[{"catchword":"de bode des HEEREN,","tekst":"Of, gezant, ambassadeur."},{"catchword":"in de boodschap des HEEREN,","tekst":"Dat is, in de boodschap, die hij in den naam en uit het bevel des Heeren deed aan het volk; of uit kracht der boodschap, achtervolgens het bevel, dat hij van God ontvangen had."},{"catchword":"Ik ben met ulieden,","tekst":"Of, Ik zal zijn. Derhalve hebt goeden moed, en vaart kloekelijk voort in het opbouwen van mijn huis. Verg. Psa 56:10 ; Mat 28:18 , Mat 28:20 ; Rom 8:31 ."}],"14":[{"catchword":"de HEERE verwekte den geest van Zerubbábel,","tekst":"Dat is, de Heere heeft door deze vermaning van ijn profeet de harten der genoemden personen dagelijks meer en meer verwekt en aangepord om in het aangevangen bouwen voort te varen, totdat het geheel zou voltrokken wezen. Het was ganselijk van node dat dit volk zou versterkt worden, overmits Tathnaï en andere vijanden van het volk Gods, naar hun uiterste vermogen, dit werk zouden te verhinderen. Zie Ezr 5:3 ."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"In the second year [see the annotation Ezra 4 on verse 24 and chapter 5.1.] of the king Darius, [heb. Darjavesch,] in the sixth moneth, on the first day of the moneth, the word of the Lord came, by the ministery [Heb. Hand. See annotate. Exodus 9 on verse 35. Act 11:30 and chapter 7.35.] of Haggai, [otherwise commonly called Aggeus, Heb. Chaggai] the prophet to Zerubbabel, the son of Sealtiel, [some put, the nephew; for to speak properly, he was the son of Pedaja, who was the son of Sealtiel. See 1 Chro. 3.17,18,19. Zerubbabel nevertheless is called the son of Sealtiel also. Ezra 5.2. Mat. 1.12. Some conceive Zerubbabel Sealtiel adopted son from Luk 3:27.] the prince of juda; [i.e. the prince out of and over the tribe of Juda] and to Josua, the son of Jozadak, the hig-priest, [Heb. The great (or greatest) priest] saying:"}],"2":[{"catchword":null,"tekst":"Thus speaketh the LORD of hosts, saying; this people saith, [the Lord doth not say here, my people, but this people, shewing thereby his displeasure at their great neglect of his worship, and their daily endeavour and eagerness to advance their own honour and profit] the time is not to come, [this was the excuse which the slothfull self-seeking posessours pretended then, why they delayed the building of the temple thus] the time that the Lord&acirc;&euro;&trade;s house should be built. [Heb. The time of the house of the LORD, for to be built.]"}],"3":[{"catchword":null,"tekst":"And the word of the LORD came by the ministery of the prophet Haggai, saying;"}],"4":[{"catchword":null,"tekst":"is this the time indeed for you, that ye dwell in your vaulted houses, [hereby is intimated, that they had built houses for themselves, not onely such as necessity required, but stately and sumptuous ones, for pleasure and delight, before they built the Lord&acirc;&euro;&trade;s house] and shall this house be desolate? [David was quiet of another minde. See 2 Samuel 7.2 and Psa 132:3,4,5.]"}],"5":[{"catchword":null,"tekst":"Now then, thus saith the LORD of hosts, set your hearts upon your wayes. [i.e. observe and consider well, how it fares with you, by reason of your sinnes. Compare 1 cor. 11.30,31. see of this phrase. Exo 9:21. 2 sam. 18.3. job 1.8. and chapter 2.3 and chap. 22.22 and chap. 34.14. and here below verse 7.]"}],"6":[{"catchword":null,"tekst":"Ye sow much and ye bring in little; Deut 28.38. Mich. 6.14,15.] ye eat, but not to satisfie; ye drink, but not unto drunkenness; [i.e. ye do not enjoy the efficacie of wine, to be made cheereful with it. See Gen. 43 on verse 34. Cant. 5.1. Job 2:20.] ye cloth yourselves, but not your warming; [Heb. For to warm ones self. i.e. to get warmth by it. Comp. Zeph. 2.12 with the annot.] and he that recieveth wages, recieveth those wages in a purse bored through. [or, in a purse that hath no bottom; or, that is hallow; meaning; it vanisheth all what you receive, that ye are nothing the better for it, according to what is threatned, deut. 28.15,&c. Amos 4.9. Mich. 6.14.]"}],"7":[{"catchword":null,"tekst":"Thus saith the LORD of hostes; set your hearts on your wayes. [as before verse 5 . which the prophet repeates here, to make them atke the better heed of it.]"}],"8":[{"catchword":null,"tekst":"get upon the mountain, and bring on wood, and build this house, andi will take pleasure in it, [i.e. in this temple. It seems the prophet hath an eye here to the prayer of Solomon and promise God made upon it. 1 kings 8.18,19,c.] and be glorified, saith the LORD."}],"9":[{"catchword":null,"tekst":"Ye look about for much, [or, turn your face toward much. i.e. ye look for a plentifull harvest] but lo ye get little, [Heb. (it becomes) to little] and when it is brought home by you, then I blow into it. [so that it turns to dust and chaff, and ye have no benefit by it] wherefore that? Saith the LORD of hosts; because of mine house, which is waste, and tha ye run every one for his own house. [namely to build and set out that. See above verse 4.]"}],"10":[{"catchword":null,"tekst":"Therefore the heavens withhold themselves from you, that there is no dew, [understand, and no rain neither in sit and due season, this is that which God threateneth Lev. 26.19. Deut. 28.23,24,38. Amos 4.7.] and the land withholds its fruits."}],"11":[{"catchword":null,"tekst":"For I have called for a drought [Oth. A desolation. See 1 kings 8.1 and Jer. 25 on verse 29. see also Deut. 28.22. Joel 1.14. Amos 1.2. and chap 4.7.19.] upon the land, and upon the mountains and upon the corn, and upon the new wine, and upon the oyl, and upon that which the earth would bring forth upon the men, and upon the beasts, and upon all the labour of the hands [i.e. upon the fruits and crops of the earth, brought forth by the labour of men.]"}],"12":[{"catchword":null,"tekst":"Then did Zerubbabel [see Ezra 5.2.] the son of Sealtiel and Josua the son of Jozadak, the high priest, and all the remnant of the people, [i.e. all those that escaped from the war, (during which many perished) and those that returned out of the Babylonian Captivity, where likewise many were consumed and dead] hearken to the voice of the LORD their God, and [Oth. That is] to the word of the prophet Haggai, according as the LORD their God had sent him; [which they knew to be so] and the people feared before the face of the LORD."}],"13":[{"catchword":null,"tekst":"Then spake Haggai, the messenger [Or, envoy, ambassadour] of the Lord, in the message of the LORD, [viz. that which he charged to deliver to the people, in the name of the Lord: or by virtue of the message, according to the instruction or commission, which he had received at God&acirc;&euro;&trade;s hand and commanded] unto the people, saying; I am with you, saith the LORD. [or, I shall be c. therefore be of good cheer, and go on courageously in the building of my house. Compare Psa 56:11. Mat 28:18, 20. Rom 8:31.]"}],"14":[{"catchword":null,"tekst":"And the Lord stirred up the spirit of Zerubbabel the son of Sealtiel the prince of Juda, and the spirit of Josua, the son of Jozadak, the high-priest, and the spirit of all the remnant of the people: and they came and made the work in the house of the LORD of the hosts their /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
