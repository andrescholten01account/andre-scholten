, ontvangt dat loon in een doorgeboorde buidel.", "7": "Zo zegt de HEERE van de heerscharen: Let goed op uw wegen.", "8": "Klim het gebergte op, breng hout aan, en bouw dit huis, en Ik zal er welgevallen aan hebben en verheerlijkt worden, zegt de HEERE.", "9": "U ziet uit naar veel, maar zie, u bekomt weinig; en als u het in huis gebracht hebt, dan blaas Ik erin. Waarom dat? spreekt de HEERE van de heerscharen; om de wil van Mijn huis, dat woest is, en dat u loopt, ieder voor zijn eigen huis.", "10": "Daarom onthouden de hemelen zich boven u van dauw, en het land onthoudt zijn vruchten.", "11": "Want Ik heb een droogte geroepen over het land, en over de bergen, en over het koren, en over de most, en over de olie, en over wat de aardbodem zou voortbrengen; ook over de mensen, en over de dieren, en over alle arbeid van de handen.", "12": "Toen luisterden Zerubbabel, de zoon van Sealthiël, en Josua, de zoon van Jozadak, de hogepriester, en heel het overblijfsel van het volk, naar de stem van de HEERE, hun God, en naar de woorden van de profeet Haggai, zoals de HEERE, hun God, hem gezonden had; en het volk vreesde voor het aangezicht van de HEERE.", "13": "Toen sprak Haggai, de bode van de HEERE, in de boodschap van de HEERE, tot het volk, en hij zei: Ik ben met u, spreekt de HEERE.", "14": "En de HEERE wekte de geest op van Zerubbabel, de zoon van Sealthiël, de vorst van Juda, en de geest van Josua, de zoon van Jozadak, de hogepriester, en de geest van heel het overblijfsel van het volk; en zij kwamen en gingen aan het werk in het huis van de HEERE van de heerscharen, hun God,"}, "SV": {"1": "In het tweede jaar van den koning Darius, in de zesde maand, op den eersten dag der maand, geschiedde het woord des HEEREN, door den dienst van Haggai, den profeet, tot Zerubbabel, den zoon van Sealthiël, den vorst van Juda, en tot Josua, den zoon van Jozadak, den hogepriester, zeggende:", "2": "Alzo spreekt de HEERE der heirscharen zeggende: Dit volk zegt: De tijd is niet gekomen, de tijd, dat des HEEREN huis gebouwd worde.", "3": "En het woord des HEEREN geschiedde door den dienst van den profeet Haggai, zeggende:", "4": "Is het voor ulieden wel de tijd, dat gij woont in uw gewelfde huizen, en zal dit huis woest zijn?", "5": "Nu dan, alzo zegt de HEERE der heirscharen: Stelt uw hart op uw wegen.", "6": "Gij zaait veel, en gij brengt weinig in; gij eet, maar niet tot verzadiging; gij drinkt, maar niet tot dronken worden toe; gij kleedt u, maar niet tot uw verwarming, en wie loon ontvangt, die ontvangt dat loon in een doorgeboorden buidel.", "7": "Alzo zegt de HEERE der heirscharen: Stelt uw hart op uw wegen.", "8": "Klimt op het gebergte, en brengt hout aan, en bouwt dit huis, en Ik zal een welgevallen daaraan hebben, en verheerlijkt worden, zegt de HEERE.", "9": "Gij ziet om naar veel, maar ziet, gij bekomt weinig; en als gij het in huis gebracht hebt, zo blaas Ik daarin. Waarom dat? spreekt de HEERE der heirscharen; om Mijns huizes wil, hetwelk woest is, en dat gij loopt elk voor zijn eigen huis.", "10": "Daarom onthouden zich de hemelen over u, dat er geen dauw is, en het land onthoudt zijn vruchten.", "11": "Want Ik heb een droogte geroepen over het land, en over de bergen, en over het koren, en over den most, en over de olie, en over hetgeen de aardbodem zou voortbrengen; ook over de mensen, en over de beesten, en over allen arbeid der handen.", "12": "Toen hoorde Zerubbabel, de zoon van Sealthiël, en Josua, de zoon van Jozadak, de hogepriester, en al het overblijfsel des volks, naar de stem van den HEERE, hun God, en naar de woorden van den profeet Haggai, gelijk als hem de HEERE, hun God, gezonden had; en het volk vreesde voor het aangezicht des HEEREN.", "13": "Toen sprak Haggai, de bode des HEEREN, in de boodschap des HEEREN, tot het volk, zeggende: Ik ben met ulieden, spreekt de HEERE.", "14": "En de HEERE verwekte den geest van Zerubbabel, den zoon van Sealthiël, den vorst van Juda, en den geest van Josua, den zoon van Jozadak, den hogepriester, en den geest van het ganse overblijfsel des volks; en zij kwamen en maakten het werk in het huis van den HEERE der heirscharen, hun God."}, "KJV": {"1": "In the second year of Darius the king, in the sixth month, in the first day of the month, came the word of the LORD by Haggai the prophet unto Zerubbabel the son of Shealtiel, governor of Judah, and to Joshua the son of Josedech, the high priest, saying,", "2": "Thus speaketh the LORD of hosts, saying, This people say, The time is not come, the time that the LORD'S house should be built.", "3": "Then came the word of the LORD by Haggai the prophet, saying,", "4": "*Is it* time for you, O ye, to dwell in your cieled houses, and this house *lie* waste?", "5": "Now therefore thus saith the LORD of hosts; Consider your ways.", "6": "Ye have sown much, and bring in little; ye eat, but ye have not enough; ye drink, but ye are not filled with drink; ye clothe you, but there is none warm; and he that earneth wages earneth wages *to put it* into a bag with holes.", "7": "Thus saith the LORD of hosts; Consider your ways.", "8": "Go up to the mountain, and bring wood, and build the house; and I will take pleasure in it, and I will be glorified, saith the LORD.", "9": "Ye looked for much, and, lo, *it came* to little; and when ye brought *it* home, I did blow upon it. Why? saith the LORD of hosts. Because of mine house that *is* waste, and ye run every man unto his own house.", "10": "Therefore the heaven over you is stayed from dew, and the earth is stayed *from* her fruit.", "11": "And I called for a drought upon the land, and upon the mountains, and upon the corn, and upon the new wine, and upon the oil, and upon *that* which the ground bringeth forth, and upon men, and upon cattle, and upon all the labour of the hands.", "12": "Then Zerubbabel the son of Shealtiel, and Joshua the son of Josedech, the high priest, with all the remnant of the people, obeyed the voice of the LORD their God, and the words of Haggai the prophet, as the LORD their God had sent him, and the people did fear before the LORD.", "13": "Then spake Haggai the LORD'S messenger in the LORD'S message unto the people, saying, I *am* with you, saith the LORD.", "14": "And the LORD stirred up the spirit of Zerubbabel the son of Shealtiel, governor of Judah, and the spirit of Joshua the son of Josedech, the high priest, and the spirit of all the remnant of the people; and they came and did work in the house of the LORD of hosts, their God,", "15": "In the four and twentieth day of the sixth month, in the second year of Darius the king."}}, "tsk": {"1": [{"kopje": "tweede", "refs": ["Hagg 2:2", "Hagg 2:11", "Hagg 2:21", "Ezra 4:24", "Ezra 5:1", "Ezra 5:2", "Zach 1:1"]}, {"kopje": "door de dienst van Haggai", "refs": ["Ex 4:13", "1 Kon 14:18", "2 Kon 14:25", "Ezra 6:14"]}, {"kopje": "tot", "refs": ["Hagg 1:12", "Hagg 1:14", "Hagg 2:3", "Hagg 2:5", "Hagg 2:22-24", "1 Kron 3:17", "1 Kron 3:19", "Ezra 2:2", "Ezra 3:2", "Ezra 3:8", "Ezra 4:2", "Ezra 5:2", "Neh 7:7", "Zach 4:6-10", "Matt 1:12", "Matt 1:13", "Luk 3:27"]}, {"kopje": "vorst", "refs": ["Ezra 1:8", "Ezra 2:63", "Neh 5:14", "Neh 8:10"]}, {"kopje": "Josua", "refs": ["Ezra 2:2", "Ezra 3:8", "Ezra 5:2", "Neh 12:1", "Neh 12:10"]}, {"kopje": "Jozadak", "refs": ["1 Kron 6:14", "1 Kron 6:15"]}], "2": [{"kopje": "Dit", "refs": ["Num 13:31", "Ezra 4:23", "Ezra 4:24", "Ezra 5:1", "Ezra 5:2", "Neh 4:10", "Spr 22:13", "Spr 26:13-16", "Spr 29:25", "Pred 9:10", "Pred 11:4", "Hoogl 5:2", "Hoogl 5:3"]}], "3": [{"kopje": "door de dienst van de profeet Haggai", "refs": ["Ezra 5:1", "Zach 1:1"]}], "4": [{"kopje": "om", "refs": ["2 Sam 7:2", "Ps 132:3-5", "Matt 6:33", "Fil 2:21"]}, {"kopje": "terwijl", "refs": ["Ps 74:7", "Ps 102:15", "Jer 26:6", "Jer 26:18", "Jer 52:13", "Klaagl 2:7", "Klaagl 4:1", "Ezech 24:21", "Dan 9:17", "Dan 9:18", "Dan 9:26", "Dan 9:27", "Micha 3:12", "Matt 24:1", "Matt 24:2"]}], "5": [{"kopje": "zo", "refs": ["Hagg 1:7", "Hagg 2:16-19", "Klaagl 1.14#i14165", "refs": [], "kinderen": [{"label": "The temple built in", "href": "../../nave/m/?hl=Hag.1.14#i14167", "refs": [{"disp": "Hagg 1:14", "href": "../../haggai/1/#v14", "ref": "Hagg 1:14", "svLabel": null}, {"disp": "Hagg 1:15", "href": "../../haggai/2/#v1", "ref": "Hagg 2:1", "svLabel": "SV 2:1"}], "kinderen": []}]}]}, {"topic": "Shealtiel", "href": "../../nave/s/#t-shealtiel", "kinderen": [{"label": "Father of Zerubbabel and an ancestor of Jesus", "href": "../../nave/s/?hl=Hag.1.14#i18583", "refs": [{"disp": "1 Kron 3:17", "href": "../../1-kronieken/3/#v17", "ref": "1 Kron 3:17", "svLabel": null}, {"disp": "Ezra 3:2", "href": "../../ezra/3/#v2", "ref": "Ezra 3:2", "svLabel": null}, {"disp": "Ezra 3:8", "href": "../../ezra/3/#v8", "ref": "Ezra 3:8", "svLabel": null}, {"disp": "Ezra 5:2", "href": "../../ezra/5/#v2", "ref": "Ezra 5:2", "svLabel": null}, {"disp": "Neh 12:1", "href": "../../nehemia/12/#v1", "ref": "Neh 12:1", "svLabel": null}, {"disp": "Hagg 1:1", "href": "../../haggai/1/#v1", "ref": "Hagg 1:1", "svLabel": null}, {"disp": "Hagg 1:12", "href": "../../haggai/1/#v12", "ref": "Hagg 1:12", "svLabel": null}, {"disp": "Hagg 1:14", "href": "../../haggai/1/#v14", "ref": "Hagg 1:14", "svLabel": null}, {"disp": "Hagg 2:2", "href": "../../haggai/2/#v3", "ref": "Hagg 2:3", "svLabel": "SV 3"}, {"disp": "Hagg 2:23", "href": "../../haggai/2/#v24", "ref": "Hagg 2:24", "svLabel": "SV 24"}, {"disp": "Matt 1:12", "href": "../../mattheus/1/#v12", "ref": "Matt 1:12", "svLabel": null}, {"disp": "Luk 3:27", "href": "../../lukas/3/#v27", "ref": "Luk 3:27", "svLabel": null}], "kinderen": []}]}]}}, "extern": {"Jes 55:11": "Zo zal Mijn woord, dat uit Mijn mond uitgaat, ook zijn, het zal niet leeg naar Mij terugkeren; maar het zal doen wat Mij behaagt, en het zal voorspoedig zijn in wat, waartoe Ik het zend.", "Jer 50:5": "Zij zullen naar Sion vragen; op de weg hierheen zullen hun gezichten gericht zijn; zij zullen komen en zich bij de HEERE aansluiten, met een eeuwig verbond, dat niet zal worden vergeten.", "Ex 13:12": "dat u alles wat de baarmoeder opent voor de HEERE zult afzonderen; ook alles wat de baarmoeder opent van het jong van de dieren die u zult hebben; de mannetjes zullen van de HEERE zijn.", "Richt 11:29": "Toen kwam de Geest van de HEERE op Jeftha, zodat hij Gilead en Manasse doortrok; want hij trok door tot Mizpa in Gilead, en van Mizpa in Gilead trok hij door naar de kinderen van Ammon.", "Kol 1:6": "dat tot u gekomen is, zoals ook in de hele wereld, en het brengt vruchten voort, zoals ook onder u, vanaf de dag dat u het gehoord hebt en de genade van God in waarheid hebt leren kennen.", "Openb 1:6": "En Die ons gemaakt heeft tot koningen en priesters voor God en Zijn Vader; Hem, zeg ik, zij de heerlijkheid en de kracht tot in alle eeuwigheid. Amen.", "Num 16:29": "Als dezen sterven zoals alle mensen sterven, en over hen een straf voltrokken wordt zoals over alle mensen, dan heeft de HEERE mij niet gezonden.", "Fil 2:20": "Want ik heb niemand die zo eender gezind is, die oprecht voor uw zaken zal zorgen.", "Ezech 3:16": "Het gebeurde nu aan het einde van zeven dagen, dat het woord van de HEERE tot mij kwam, en zei:", "Luk 1:41": "En het gebeurde, toen Elizabet de groet van Maria hoorde, dat het kindje opsprong in haar buik; en Elizabet werd vervuld met de Heilige Geest;", "2 Sam 7:3-7": "En Nathan zei tegen de koning: Ga heen, doe alles wat in uw hart is, want de HEERE is met u. Maar het gebeurde in diezelfde nacht, dat het woord van de HEERE tot Nathan kwam, en Hij zei: Ga, en zeg tegen Mijn knecht, tegen David: Zo zegt de HEERE: Zou u Mij een huis bouwen om in te wonen?", "Job 10:2": "Ik zal tegen God zeggen: Verdoem mij niet; laat mij weten, waarom U met mij twist.", "Ex 3:14": "En God zei tegen Mozes: IK ZAL ZIJN, DIE IK ZIJN ZAL! Ook zei Hij: Zo zult u tegen de kinderen van Israël zeggen: IK ZAL ZIJN heeft mij tot u gezonden!", "Ps 23:6": "Zeker, het goede en de weldadigheid zullen mij volgen al de dagen van mijn leven; en ik zal in het huis van de HEERE blijven, tot in lengte van dagen.", "Luk 17:26-29": "En zoals het gebeurde in de dagen van Noach, zo zal het ook zijn in de dagen van de Zoon des mensen. Zij aten, zij dronken, zij namen ten huwelijk, zij werden ten huwelijk gegeven, tot de dag waarop Noach in de ark ging, en de zondvloed kwam en hen allen verdierf. Evenzo ook, zoals het gebeurde in de dagen van Lot: zij aten, zij dronken, zij kochten, zij verkochten, zij plantten, zij bouwden;", "Hos 14:2": "Bekeer u, o Israël! tot de Heere, uw God, toe; want u bent gevallen om uw ongerechtigheid.", "Gen 46:4": "Ik zal met u aftrekken naar Egypte, en Ik zal u ook weer laten optrekken; en Jozef zal zijn hand op uw ogen leggen.", "Zach 2:5": "En Ik zal haar wezen, spreekt de HEERE, een vurige muur rondom; en Ik zal tot heerlijkheid wezen in het midden van haar.", "Joh 15:15": "Ik noem u niet meer dienstknechten; want de dienstknecht weet niet wat zijn heer doet; maar Ik heb u vrienden genoemd; want alles wat Ik van Mijn Vader gehoord heb, dat heb Ik u bekendgemaakt.", "Ps 121:3-8": "Hij zal uw voet niet laten wankelen; uw Bewaarder zal niet sluimeren. Zie, de Bewaarder van Israël zal niet sluimeren, ook niet slapen. De HEERE is uw Bewaarder, de HEERE is uw Schaduw, aan uw rechterhand.", "2 Kon 12:10": "Het gebeurde nu, toen zij zagen dat er veel geld in de kist was, dat de schrijver van de koning met de hogepriester opkwam, en zij bonden het samen en telden het geld dat in het huis van de HEERE gevonden werd.", "Rom 15:1-3": "Maar wij, die sterk zijn, zijn schuldig de zwakheden van de onsterken te dragen, en niet onszelf te behagen. Laat dan ieder van ons zijn naaste behagen ten goede, tot opbouw. Want ook Christus heeft Zichzelf niet behaagd, maar zoals geschreven is: De smadingen van hen die U smaden, zijn op Mij gevallen.", "Ex 33:11": "En de HEERE sprak tot Mozes van aangezicht tot aangezicht, zoals een man met zijn vriend spreekt; daarna keerde hij terug naar het kamp; maar zijn dienaar Jozua, de zoon van Nun, de jongeman, week niet uit het midden van de tent.", "Jak 4:8": "Kom dicht bij God, en Hij zal dicht bij u komen. Reinig de handen, zondaars, en zuiver de harten, dubbelhartigen!", "Jer 36:5": "En Jeremia gebood Baruch: Ik word tegengehouden, ik zal niet in het huis van de HEERE kunnen gaan.", "Hebr 4:9": "Er blijft dan een rust over voor het volk van God.", "Micha 6:14": "U zult eten, maar niet verzadigd worden, en uw neergedrukte honger zal in uw midden blijven; en u zult aangrijpen, maar niet wegbrengen, en wat u zult wegbrengen, zal Ik aan het zwaard overgeven.", "Jes 57:1": "De rechtvaardige komt om, en er is niemand die het ter harte neemt; en de goede mensen worden weggenomen, zonder dat iemand erop let dat de rechtvaardige weggenomen wordt vóór het kwaad komt.", "Jes 49:9-12": "Om te zeggen tegen de gebondenen: Gaat uit; tegen hen die in duisternis zijn: Komt te voorschijn; zij zullen op de wegen weiden, en op alle hoge plaatsen zal hun weide zijn. Zij zullen niet hongeren, noch dorsten, en de hitte en de zon zal hen niet steken; want hun Ontfermer zal ze leiden, en Hij zal hen bij de springaders van het water zachtjes leiden. En Ik zal al Mijn bergen tot een weg maken, en Mijn banen zullen verhoogd zijn.", "Matt 18:1-4": "Op datzelfde moment kwamen de discipelen naar Jezus en zeiden: Wie is toch de belangrijkste in het Koninkrijk der hemelen? En Jezus riep een kind bij Zich en zette het in hun midden, en zei: Voorwaar, Ik zeg u: als u zich niet verandert en wordt zoals de kinderen, zult u het Koninkrijk der hemelen beslist niet ingaan.", "Hos 9:13": "Efraïm is, zoals Ik Tyrus aanzag, geplant in een aangename woonplaats; maar Efraïm zal zijn kinderen moeten uitbrengen naar de moordenaar.", "Dan 9:27": "En hij zal voor velen het verbond versterken, één week; en in de helft van de week zal hij het slachtoffer en het spijsoffer doen ophouden, en over de gruwelijke vleugel zal een verwoester zijn, ook tot de voleinding toe, die vast besloten is, zal uitgestort worden over de verwoeste.", "Ps 122:9": "Om het huis van de HEERE, onze God, zal ik het goede voor u zoeken.", "Jer 13:15": "Hoort en neemt het ter ore, verhef u niet; want de HEERE heeft het gesproken.", "Zach 4:6-10": "Toen antwoordde Hij en sprak tegen mij: Dit is het woord van de HEERE tot Zerubbabel: Niet door kracht, ook niet door geweld, maar door Mijn Geest zal het gebeuren, zegt de HEERE van de heerscharen. Wie bent u, o grote berg? Voor het aangezicht van Zerubbabel zult u worden tot een vlak veld; want hij zal de hoofdsteen naar voren brengen onder toeroepingen: Genade, genade zij hem! Het woord van de HEERE kwam verder tot mij:", "1 Joh 1:3": "Wat wij dan gezien en gehoord hebben, dat verkondigen wij u, opdat ook u met ons gemeenschap zou hebben, en deze onze gemeenschap ook is met de Vader, en met Zijn Zoon Jezus Christus.", "Luk 18:10-14": "Twee mensen gingen op naar de tempel om te bidden; de een was een Farizeeër en de ander een tollenaar. De Farizeeër stond en bad dit bij zichzelf: O God, ik dank U dat ik niet ben zoals de andere mensen: rovers, onrechtvaardigen, overspelers; of ook zoals deze tollenaar. Ik vast tweemaal per week; ik geef tienden van alles wat ik bezit.", "Hand 10:35": "maar in ieder volk is hij die Hem vreest en gerechtigheid doet, Hem aangenaam.", "Jer 20:1": "Toen Pashur, de zoon van Immer, de priester (deze was aangesteld als voorganger in het huis van de HEERE), Jeremia hoorde deze woorden profeteren,", "Jak 2:16": "en iemand van u zou tegen hen zeggen: Ga heen in vrede, word warm en word verzadigd; maar u zou hun niet geven wat nodig is voor het lichaam, wat voor nut is dat?", "Lev 19:13": "U zult uw naaste niet bedriegen of verdrukken, noch beroven; het arbeidsloon van de dagloner zal bij u niet blijven overnachten tot de morgen.", "Luk 3:2": "onder de hogepriesters Annas en Kajafas, kwam het woord van God tot Johannes, de zoon van Zacharias, in de woestijn.", "Matt 5:42": "Geef aan hem die iets van u vraagt, en keer u niet af van hem die van u wil lenen.", "Ex 33:22": "En het zal gebeuren, wanneer Mijn heerlijkheid voorbijgaat, dat Ik u in een kloof van de steenrots zal zetten; en Ik zal u met Mijn hand overdekken, totdat Ik voorbijgegaan zal zijn.", "1 Tim 5:6": "Maar wie haar lust volgt, die is levend gestorven.", "Jer 17:7": "Gezegend daarentegen is de man die op de HEERE vertrouwt, en wiens vertrouwen de HEERE is!", "Ezech 18:5-9": "Wanneer nu iemand rechtvaardig is, en recht en gerechtigheid doet; Niet eet op de bergen, en zijn ogen niet opheft tot de drekgoden van het huis van Israël; noch de vrouw van zijn naaste onteert, noch tot een vrouw tijdens haar menstruatie nadert; En niemand verdrukt, de schuldenaar zijn pand teruggeeft, geen roof pleegt, de hongerige zijn brood geeft, en de naakte met kleding bedekt;", "Ps 85:10": "Zeker, Zijn heil is nabij hen die Hem vrezen, opdat in ons land eer woont.", "Hagg 1:4-11": "Is het voor u wel de tijd om te wonen in uw gewelfde huizen, terwijl dit huis woest zal zijn? Nu dan, zo zegt de HEERE van de heerscharen: Let goed op uw wegen. U zaait veel, maar brengt weinig binnen; u eet, maar niet tot verzadiging; u drinkt, maar wordt niet dronken; u kleedt u, maar niet tot uw verwarming, en wie loon ontvangt, ontvangt dat loon in een doorgeboorde buidel.", "2 Kon 12:9": "Maar de priester Jojada nam een kist, en boorde een gat in het deksel ervan, en zette die bij het altaar aan de rechterkant, waar iemand het huis van de HEERE binnenkwam; en de priesters die de drempel bewaakten, staken daarin al het geld dat naar het huis van de HEERE gebracht werd.", "Mal 3:7": "Vanaf de dag van uw vaderen af zijn jullie afgeweken van Mijn inzettingen, en hebben ze niet bewaard; keer terug tot Mij, en Ik zal tot u terugkeren, zegt de HEERE van de heerscharen; maar u zegt: Waarin zullen wij terugkeren?", "Luk 13:1-5": "En er waren in diezelfde tijd enigen aanwezig, die Hem vertelden van de Galileeërs, van wie Pilatus het bloed met hun offers gemengd had. En Jezus antwoordde en zei tegen hen: Denkt u dat deze Galileeërs meer zondaars zijn geweest dan alle andere Galileeërs, omdat zij zulke dingen hebben geleden? Ik zeg u: Nee; maar als u zich niet bekeert, zult u allen net zo omkomen.", "Jes 43:21": "Dit volk heb Ik Mij geformeerd, zij zullen Mijn lof vertellen.", "Ps 36:10": "Want bij U is de fontein van het leven; in Uw licht zien wij het licht.", "Hebr 10:34-36": "Want u hebt ook medelijden gehad met mij in mijn boeien, en de beroving van uw bezittingen met blijdschap aanvaard, wetende dat u voor uzelf een beter en blijvend bezit hebt in de hemelen. Werp dan uw vrijmoedigheid niet weg, die een grote beloning van loon heeft. Want u hebt volharding nodig, opdat u, wanneer u de wil van God gedaan hebt, de belofte moogt ontvangen;", "Openb 14:7": "en hij zei met een luide stem: Vrees God, en geef Hem eer, want het uur van Zijn oordeel is gekomen; en aanbid Hem, Die de hemel, en de aarde, en de zee, en de bronnen van het water gemaakt heeft.", "1 Petr 1:24": "Want alle vlees is als gras, en alle heerlijkheid van de mens is als een bloem van het gras. Het gras verdort, en zijn bloem valt af;", "Ezech 1:3": "Kwam het woord van de HEERE uitdrukkelijk tot Ezechiël, de zoon van Buzi, de priester, in het land van de Chaldeeën, bij de rivier Chebar; en de hand van de HEERE was daar op hem.", "Num 22:38": "Toen zei Bileam tegen Balak: Zie, ik ben tot u gekomen; kan ik nu wel iets zeggen? Het woord dat God in mijn mond leggen zal, dat zal ik spreken.", "1 Petr 1:14": "Als gehoorzame kinderen, vorm u niet naar de begeerten die u vroeger, in uw onwetendheid, had;", "Jes 33:24": "En geen inwoner zal zeggen: Ik ben ziek, want het volk, dat daarin woont, zal vergeving van ongerechtigheid ontvangen.", "Luk 20:35": "maar wie waardig geacht worden om die andere wereld te verwerven en de opstanding uit de doden, zullen niet trouwen, en ook niet ten huwelijk uitgegeven worden;", "Mal 4:2": "Voor u echter, die Mijn Naam vreest, zal de Zon der gerechtigheid opgaan, met genezing onder Haar vleugels; en u zult uitgaan en toenemen als mestkalveren.", "1 Kron 22:11": "Nu, mijn zoon, de HEERE zal met u zijn, en u zult voorspoedig zijn, en u zult het huis van de HEERE, van uw God, bouwen, zoals Hij van u gesproken heeft.", "Ps 18:20": "En Hij voerde mij uit in de ruimte, Hij rukte mij eruit, want Hij had lust aan mij.", "1 Kon 8:10": "En het gebeurde, toen de priesters uit het heilige naar buiten gingen, dat een wolk het huis van de HEERE vervulde.", "Amos 9:6": "Die Zijn bovenzalen in de hemel bouwt, en Zijn gewelf heeft Hij op de aarde gegrondvest; Die de wateren van de zee roept, en giet ze uit over de aardbodem; HEERE is Zijn Naam.", "2 Kor 4:14": "Wetend dat Hij, Die de Heere Jezus opgewekt heeft, ook ons door Jezus zal opwekken, en met u daar zal stellen.", "Tit 3:3": "Want ook wij waren vroeger onverstandig, ongehoorzaam, dwalend, en dienden aan allerlei begeerten en genoegens; wij leefden in slechtheid en afgunst, waren hatelijk en haatten elkaar.", "Hand 7:56": "En hij zei: Zie, ik zie de hemelen geopend, en de Zoon des mensen, staande aan de rechterhand van God.", "Ps 104:15": "En de wijn, die het hart van de mens verheugt, zodat het gezicht blinkt van olie; en het brood, dat het hart van de mens sterkt.", "Neh 12:1": "Dit zijn de priesters en de Levieten die met Zerubbabel, de zoon van Sealthiël, en Jesua optrokken: Seraja, Jeremia, Ezra,", "Matt 13:22": "En die in de doornen bezaaid is, dit is degene die het woord hoort; en de zorgen van deze wereld en de verleiding van de rijkdom verstikken het woord, en het wordt onvruchtbaar.", "Ezech 2:5": "En zij, hetzij dat zij het horen zullen, of hetzij dat zij het laten zullen (want zij zijn een opstandig huis), zo zullen zij weten, dat er een profeet in hun midden geweest is.", "Ps 55:23": "Werp uw zorg op de HEERE, en Hij zal u onderhouden; Hij zal in eeuwigheid niet toelaten dat de rechtvaardige wankelt.", "Jes 66:13": "Zoals iemand die zijn moeder troost, zo zal Ik u troosten; ja, u zult in Jeruzalem getroost worden.", "Fil 4:7": "En de vrede van God, die alle verstand te boven gaat, zal uw harten en uw gedachten bewaren in Christus Jezus.", "2 Kor 8:7-9": "Zo dan, zoals u in alles overvloedig bent, in geloof, en in woord, en in kennis, en in alle naarstigheid, en in uw liefde tot ons, zorg ervoor, dat u ook in deze gave overvloedig bent. Ik zeg dit niet als een gebod, maar om door de naarstigheid van anderen ook de oprechtheid van uw liefde te beproeven. Want u kent de genade van onze Heere Jezus Christus, dat Hij om uwentwil arm geworden is, terwijl Hij rijk was, opdat u door Zijn armoede rijk zou worden.", "Spr 15:21": "De dwaasheid is voor de verstandeloze een blijdschap; maar een man van verstand gaat recht zijn weg.", "Spr 31:20": "Caph. Zij breidt haar handpalm uit naar de ellendige; en zij steekt haar handen uit naar de arme.", "1 Kon 17:1": "En Elia, de Thisbiet, van de inwoners van Gilead, zei tegen Achab: Zo waarachtig als de HEERE, de God van Israël, leeft, voor Wiens aangezicht ik sta, indien deze jaren dauw of regen zijn zal, tenzij dan naar mijn woord!", "Ex 19:9": "En de HEERE zei tot Mozes: Zie, Ik zal tot u komen in een dikke wolk, opdat het volk het hoort als Ik met u spreek, en dat zij ook eeuwig aan u geloven. Want Mozes had de HEERE de woorden van het volk verkondigd.", "2 Sam 23:2": "De Geest van de HEERE heeft door mij gesproken, en Zijn woord is op mijn tong geweest.", "Kol 4:1": "Heren, doe uw dienstknechten recht en gelijk, in de wetenschap dat ook u een Heere hebt in de hemelen.", "Matt 25:46": "En dezen zullen weggaan in de eeuwige pijn; maar de rechtvaardigen in het eeuwige leven.", "Ef 2:18": "Want door Hem hebben wij beiden de toegang door één Geest tot de Vader.", "Hebr 11:16": "maar nu verlangen zij naar een beter vaderland, dat is, naar het hemelse. Daarom schaamt God Zich niet voor hen om hun God genoemd te worden; want Hij had voor hen een stad klaargemaakt.", "Mark 3:35": "Want wie de wil van God doet, die is Mijn broer, en Mijn zuster, en moeder.", "Rom 5:9-11": "Veelmeer dan zullen wij, nu gerechtvaardigd door Zijn bloed, door Hem behouden worden van de toorn. Want als wij, toen wij nog vijanden waren, met God verzoend zijn door de dood van Zijn Zoon, zullen wij des te meer, nu wij verzoend zijn, behouden worden door Zijn leven. En niet alleen dit, maar wij roemen ook in God, door onze Heere Jezus Christus, door Wie wij nu de verzoening gekregen hebben.", "2 Kron 24:20": "En de Geest van God bekleedde Zacharia, de zoon van Jojada, de priester, die boven het volk stond, en hij zei tegen hen: Zo zegt God: Waarom overtreedt u de geboden van de HEERE? Daarom zult u niet voorspoedig zijn; omdat u de HEERE verlaten hebt, zo zal Hij u verlaten.", "Ezech 3:17": "Mensenkind! Ik heb u tot een wachter gesteld over het huis Israëls; zo zult u het woord uit Mijn mond horen, en hen namens Mij waarschuwen.", "Job 33:26-28": "Hij zal tot God ernstig bidden, Die in hem een welbehagen nemen zal, en zijn aangezicht met gejuich aanzien; want Hij zal de mens zijn gerechtigheid wedergeven. Hij zal de mensen aanschouwen, en zeggen: Ik heb gezondigd, en het recht verkeerd, wat mij niet heeft gebaat; Maar God heeft mijn ziel verlost, dat zij niet voert in het verderf, zodat mijn leven het licht aanziet.", "Rom 8:14-18": "Want zovelen als er door de Geest van God geleid worden, die zijn kinderen van God. Want u hebt niet de geest van slavernij ontvangen, om opnieuw te vrezen, maar u hebt de Geest van aanneming tot kinderen ontvangen, door Wie wij roepen: Abba, Vader! Diezelfde Geest getuigt met onze geest, dat wij kinderen van God zijn.", "1 Sam 2:9": "Hij zal de voeten van Zijn gunstgenoten bewaren; maar de goddelozen zullen zwijgen in duisternis; want een man vermag niet door kracht.", "Gen 4:9": "En de HEERE zei tegen Kaïn: Waar is Abel, uw broeder? En hij zei: Ik weet het niet; ben ik de hoeder van mijn broeder?", "Neh 13:12": "Toen bracht heel Juda de tienden van het koren, en van de most, en van de olie, naar de schatkamers.", "Dan 9:18": "Neig Uw oor, mijn God! en hoor, doe Uw ogen open, en zie onze verwoestingen, en de stad die naar Uw Naam genoemd is; want wij leggen onze smekingen niet voor Uw aangezicht neer om onze gerechtigheden, maar om Uw barmhartigheden, die groot zijn.", "Ps 94:19": "Toen mijn gedachten in mij talrijk werden, hebben Uw vertroostingen mijn ziel verkwikt.", "2 Kon 19:7": "Zie, Ik zal een geest in hem geven, zodat hij een gerucht zal horen en weer naar zijn land zal terugkeren; en Ik zal hem door het zwaard vellen in zijn land.", "Neh 4:6": "Wij bouwden dan verder aan de muur, zodat de hele muur tot de helft toe aaneengesloten werd; want het hart van het volk was erop gericht om te werken.", "Micha 7:3": "Om met beide handen goed hun best te doen om kwaad te doen, zo eist de vorst, en de rechter oordeelt om vergelding; en de grote spreekt de verderving van zijn ziel uit, en zij draaien het samen dicht ineen.", "Lev 26:11": "En Ik zal Mijn tabernakel in uw midden zetten; en Mijn ziel zal van u niet walgen.", "Ezra 5:1": "De profeten Haggai, de profeet, en Zacharia, de zoon van Iddo, profeteerden tot de Joden die in Juda en te Jeruzalem waren; in de naam van de God van Israël profeteerden zij tot hen.", "Jes 43:2": "Wanneer u door het water zult gaan, Ik zal bij u zijn, en door de rivieren, zij zullen u niet overstromen; wanneer u door het vuur zult gaan, zult u niet verbranden, en de vlam zal u niet aansteken.", "Mark 7:21-23": "Want van binnenuit, uit het hart van de mensen, komen voort kwade gedachten, overspel, hoererijen, moorden, diefstal, hebzucht, slechtheid, bedrog, losbandigheid, een boos oog, lastering, hoogmoed, dwaasheid. Al deze boze dingen komen van binnenuit voort, en verontreinigen de mens.", "Ezra 1:2-4": "Zo zegt Kores, koning van Perzië: De HEERE, de God van de hemel, heeft mij alle koninkrijken van de aarde gegeven; en Hij heeft mij opgedragen Hem een huis te bouwen te Jeruzalem, dat in Juda is. Wie is er onder u van al Zijn volk? Zijn God zij met hem, en hij trekt op naar Jeruzalem, dat in Juda is, en hij bouwt het huis van de HEERE, de God van Israël; Hij is de God, Die te Jeruzalem woont. En ieder die achterblijft in een van de plaatsen waar hij als vreemdeling verblijft, die zullen de mensen van zijn plaats bijstaan met zilver, en met goud, en met bezit, en met vee; benevens een vrijwillige gave, voor het huis van God, Die te Jeruzalem woont.", "Amos 6:3-7": "U, die de kwade dag ver weg zet, en de zetel van het geweld dichtbij brengt. Die daar liggen op ivoren bedsteden, en weelderig zijn op hun rustbanken, en de lammeren van de kudde eten, en de kalveren uit het midden van de meststal. Die bij het geschal van de luit kwinkeleren, en zichzelf instrumenten van muziek bedenken, zoals David;", "Ex 23:17": "Drie keer per jaar zullen al uw mannen voor het aangezicht van de Heere HEERE verschijnen.", "2 Kron 15:2": "En hij ging Asa tegemoet, en hij zei tegen hem: Hoor mij, Asa, en heel Juda en Benjamin! De HEERE is met u, zolang u met Hem bent; en als u Hem zoekt, zal Hij door u gevonden worden; maar als u Hem verlaat, zal Hij u verlaten.", "Zach 8:9": "Zo zegt de HEERE van de heerscharen: Laat uw handen sterk zijn, u die in deze dagen deze woorden gehoord hebt uit de mond van de profeten, die er geweest zijn op de dag dat de grond van het huis van de HEERE van de heerscharen gelegd is, zodat de tempel gebouwd zou worden.", "Ezech 40:4": "En die man sprak tot mij: Mensenkind! zie met uw ogen, en hoor met uw oren, en zet uw hart op alles wat ik u zal laten zien; want om u dit te laten zien, bent u hierheen gebracht; verkondig daarna aan het huis van Israël alles wat u ziet.", "Ezech 18:19": "Maar u zegt: Waarom draagt de zoon niet de ongerechtigheid van de vader? Zeker zal de zoon, die recht en gerechtigheid gedaan heeft, en al Mijn inzettingen onderhouden heeft, en die gedaan heeft, zeker leven.", "1 Kron 22:14": "Zie, ik heb in mijn verdrukking voor het huis van de HEERE honderdduizend talenten van het goud bereid, en duizend maal duizend talenten van het zilver; en van het koper en van het ijzer is er geen gewicht, want het is er in overvloed; ik heb ook hout en stenen bereid; voegt u er nog meer aan toe.", "Amos 6:6": "Die wijn uit schalen drinken, en zich zalven met de beste olie, maar zich niet bekommeren over de verbreking van Jozef.", "Mark 11:24": "Daarom zeg Ik u: Alle dingen die u in het gebed vraagt, geloof dat u ze ontvangen zult, en ze zullen u gegeven worden.", "Hoogl 5:3": "Ik heb mijn rok uitgetrokken, hoe zal ik hem weer aantrekken? Ik heb mijn voeten gewassen, hoe zal ik ze weer bezoedelen?", "Joh 13:32": "Als God in Hem verheerlijkt is, zal God Hem ook in Zichzelf verheerlijken, en Hij zal Hem meteen verheerlijken.", "Deut 18:1-8": "De Levitische priesters, de hele stam van Levi, zullen geen deel of erfdeel hebben met Israël; de vuuroffers van de HEERE en Zijn erfdeel zullen zij eten. Daarom zal hij geen erfdeel hebben tussen zijn broeders; de HEERE is zijn Erfdeel, zoals Hij tot hem gesproken heeft. Dit nu zal het recht van de priesters zijn van het volk, van hen die een offerande offeren, hetzij een os of klein vee: dat hij de priester de schouder zal geven, en beide kaken, en de pens.", "Spr 27:7": "Een verzadigde ziel vertrapt de honingraat; maar voor een hongerige ziel is alles wat bitter is, zoet.", "Matt 28:20": "en leer hen om alles te onderhouden wat Ik u geboden heb. En zie, Ik ben met u al de dagen, tot de voleinding van de wereld. Amen.", "Zach 11:2": "Huil, u dennen! Omdat de ceders gevallen zijn, omdat die heerlijke bomen verwoest zijn; huil, u eiken van Basan! Omdat het sterke woud neergevallen is.", "Joz 6:24": "De stad nu verbrandden zij met vuur, en alles wat daarin was; alleen het zilver en goud, alsook de koperen en ijzeren voorwerpen, gaven zij bij de schat van het huis van de HEERE.", "Ex 25:9": "Naar alles wat Ik u tot een voorbeeld van deze tabernakel, en een voorbeeld van al zijn gereedschap wijzen zal, precies zo zult u dat maken.", "Jer 3:4": "Zult u niet van nu af aan tot Mij roepen: Mijn Vader! U bent de leidsman van mijn jeugd!", "Jer 27:1": "In het begin van het koningschap van Jojakim, zoon van Josia, koning van Juda, kwam dit woord van de HEERE tot Jeremia:", "1 Kron 28:11": "En David gaf zijn zoon Salomo een bereiding van het voorhuis, met zijn gebouwen, en zijn schatkamers, en zijn bovenzalen, en zijn binnenkamers, en van het huis van het verzoendeksel;", "Ezra 6:4": "Met drie rijen grote steen, en een rij nieuw hout; en de onkosten moeten uit het huis van de koning gegeven worden.", "1 Petr 1:10": "Naar deze zaligheid hebben de profeten gezocht en onderzoek gedaan, zij die geprofeteerd hebben van de genade die voor u bestemd was;", "Amos 5:6": "Zoek de HEERE, en leef; anders doorbreekt Hij in het huis van Jozef als een vuur, dat verteert, zodat er niemand is die het blust in Beth-el;", "Ex 19:19": "Toen het geluid van de bazuin aanhield en zeer sterk werd, sprak Mozes; en God antwoordde hem met een stem.", "Ps 73:2-22": "Maar wat mij aangaat, mijn voeten waren bijna uitgegleden; mijn schreden waren bijna weggegleden. Want ik was jaloers op de dwazen, toen ik de vrede van de goddelozen zag. Want er zijn geen boeien tot hun dood toe, en hun kracht is fris.", "Jer 25:3": "Vanaf het dertiende jaar van Josia, de zoon van Amon, de koning van Juda, tot op deze dag toe (dit is het drieëntwintigste jaar) is het woord van de HEERE tot mij gebeurd; en ik heb tot u gesproken, vroeg opstaand en sprekend, maar u hebt niet gehoord.", "Jer 7:25": "Vanaf de dag dat uw vaders uit het land Egypte zijn uitgegaan, tot op deze dag, heb Ik tot u gezonden al Mijn knechten, de profeten, dagelijks vroeg opgestaan en hen zendend.", "Ps 84:12": "Want God, de HEERE, is een Zon en Schild; de HEERE zal genade en eer geven; Hij zal het goede niet onthouden aan hen die in oprechtheid wandelen.", "Jes 22:13": "Maar zie, er is vreugde en blijdschap met runderen te doden, en schapen te slachten, vlees te eten, en wijn te drinken, en te zeggen: Laten we eten en drinken, want morgen zullen we sterven.", "2 Kron 26:5": "Want hij begaf zich om God te zoeken, in de dagen van Zacharia, die verstandig was in de gezichten van God; en in de dagen dat hij de HEERE zocht, maakte God hem voorspoedig.", "Lev 26:40-42": "Dan zullen zij hun ongerechtigheid belijden, en de ongerechtigheid van hun vaderen met hun overtredingen, waarmee zij tegen Mij overtreden hebben, en ook dat zij tegen Mij in gewandeld hebben. Dat Ik ook tegen hen in gewandeld heb, en hen in het land van hun vijanden gebracht heb. Als dan hun onbesneden hart gebogen wordt, en zij dan de straf voor hun ongerechtigheid aanvaarden; Dan zal Ik denken aan Mijn verbond met Jakob, en ook aan Mijn verbond met Izak, en ook aan Mijn verbond met Abraham zal Ik denken, en aan het land zal Ik denken;", "Joh 3:15-18": "Opdat ieder die in Hem gelooft, niet verloren gaat, maar het eeuwige leven heeft. Want zo lief heeft God de wereld gehad, dat Hij Zijn eniggeboren Zoon gegeven heeft, opdat ieder die in Hem gelooft, niet verloren gaat, maar het eeuwige leven heeft. Want God heeft Zijn Zoon niet in de wereld gezonden opdat Hij de wereld zou veroordelen, maar opdat de wereld door Hem behouden zou worden.", "Matt 19:21": "Jezus zei tegen hem: Als u volmaakt wilt zijn, ga heen, verkoop wat u hebt, en geef het aan de armen, en u zult een schat hebben in de hemel; en kom hier, volg Mij.", "Mark 8:35": "Want wie zijn leven zal willen behouden, die zal het verliezen; maar wie zijn leven zal verliezen, omwille van Mij, en omwille van het Evangelie, die zal het behouden.", "Joël 1:5": "Word wakker, dronkaards! En huil, en jammer, alle wijnzuipers! Om de nieuwe wijn, omdat hij van uw mond is afgesneden.", "Spr 11:26": "Wie koren inhoudt, hem vervloekt het volk; maar zegening zal zijn over het hoofd van de verkoper.", "Jer 9:3": "En zij spannen hun tong als hun boog voor leugen; zij worden geweldig in het land, maar niet voor waarheid; want zij gaan voort van slechtheid tot slechtheid, maar Mij kennen zij niet, spreekt de HEERE.", "Spr 21:17": "Wie blijdschap liefheeft, die zal gebrek lijden; wie wijn en olie liefheeft, zal niet rijk worden.", "1 Petr 2:10": "U, die vroeger geen volk was, maar nu het volk van God bent; die vroeger niet ontfermd was, maar nu ontfermd bent geworden.", "Jes 44:26": "Die het woord van Zijn knecht bevestigt, en de raad van Zijn boden volbrengt; Die tot Jeruzalem zegt: U zult bewoond worden; en tot de steden van Juda: U zult herbouwd worden, en Ik zal haar verwoeste plaatsen oprichten.", "Job 8:20": "Zie, God zal de oprechte niet verwerpen; Hij zal ook de boosdoeners niet bij de hand vatten;", "Openb 16:15": "Zie, Ik kom als een dief. Zalig is hij die waakt en zijn kleren bewaart, zodat hij niet naakt hoeft te wandelen, en men zijn schaamte niet ziet.", "Deut 28:38-42": "U zult veel zaad naar de akker uitbrengen, maar u zult weinig inzamelen; want de sprinkhaan zal het opeten. Wijngaarden zult u planten en bewerken, maar u zult geen wijn drinken, noch iets vergaren; want de worm zal het opeten. Olijfbomen zult u hebben binnen al uw grondgebied, maar u zult u met olie niet zalven; want uw olijfboom zal zijn vrucht afwerpen.", "Jes 60:17": "Voor koper zal Ik goud brengen, en voor ijzer zal Ik zilver brengen, en voor hout koper, en voor stenen ijzer; en Ik zal uw opzieners vreedzaam maken, en uw drijvers rechtvaardig.", "Spr 11:27": "Wie het goede vroeg nazoekt, zoekt welgevalligheid; maar wie het kwade natracht, hem zal het overkomen.", "1 Kron 6:31": "Dezen nu zijn het die David heeft aangesteld voor het ambt van het gezang in het huis van de HEERE, nadat de ark tot rust was gekomen.", "Hagg 1:2-4": "Zo spreekt de HEERE van de heerscharen: Dit volk zegt: De tijd is niet gekomen, de tijd dat het huis van de HEERE gebouwd moet worden. En het woord van de HEERE kwam door de dienst van de profeet Haggai, en Hij zei: Is het voor u wel de tijd om te wonen in uw gewelfde huizen, terwijl dit huis woest zal zijn?", "Mark 1:2": "Zoals geschreven is in de profeten: Zie, Ik zend Mijn engel voor Uw aangezicht, die Uw weg voor U heen bereiden zal.", "Deut 15:7-18": "Wanneer er onder u een arme zal zijn, iemand van uw broeders, in een van uw poorten, in uw land dat de HEERE, uw God, u geven zal, dan zult u uw hart niet verharden, en uw hand niet toesluiten voor uw broeder die arm is; Maar u zult uw hand mild voor hem opendoen, en u zult hem rijkelijk lenen, genoeg voor zijn gebrek, wat hem ontbreekt. Wacht ervoor dat er in uw hart geen verdorven gedachte is, om te zeggen: Het zevende jaar, het jaar van de vrijlating, komt dichtbij; zodat uw oog kwaadaardig is tegen uw broeder die arm is, en dat u hem niets geeft; en hij over u roept tot de HEERE, en er zonde in u is.", "1 Kron 21:18": "Toen zei de engel van de HEERE tegen Gad, dat hij tegen David zou zeggen, dat David zou opgaan, om voor de HEERE een altaar op te richten op de dorsvloer van Ornan, de Jebusiet.", "Rom 2:7": "Hun die volhardend goeddoen en heerlijkheid, en eer, en onvergankelijkheid zoeken, het eeuwige leven;", "1 Kor 7:29-31": "Maar dit zeg ik, broeders: dat de tijd voortaan kort is; opdat ook zij die vrouwen hebben, zouden zijn alsof zij ze niet hadden; en zij die wenen, alsof zij niet weenden; en zij die blij zijn, alsof zij niet blij waren; en zij die kopen, alsof zij niet bezaten; en zij die deze wereld gebruiken, alsof zij die niet misbruikten; want de gedaante van deze wereld gaat voorbij.", "Jer 14:15-22": "Daarom zegt de HEERE zo: Aangaande de profeten, die in Mijn Naam profeteren, terwijl Ik hen niet gezonden heb, en zij toch nog zeggen: Er zal geen zwaard noch honger in dit land zijn; diezelfde profeten zullen door het zwaard en door de honger verteerd worden. En het volk, tot wie zij profeteren, zal op de straten van Jeruzalem weggeworpen zijn vanwege de honger en het zwaard; en er zal niemand zijn die hen kan begraven, hen, hun vrouwen, en hun zonen, en hun dochters; zo zal Ik hun slechtheid over hen uitstorten. Daarom zult u dit woord tegen hen zeggen: Mijn ogen zullen van tranen neerdalen, nacht en dag, en niet ophouden; want de jonkvrouw, de dochter van Mijn volk, is gebroken met een grote breuk, een plaag die zeer smartelijk is.", "Rom 6:23": "Want het loon van de zonde is de dood, maar de genadegift van God is het eeuwige leven, door Jezus Christus, onze Heere.", "2 Kron 16:9": "Want wat de HEERE betreft, Zijn ogen doorlopen de hele aarde, om Zich sterk te bewijzen aan hen wier hart volkomen is tot Hem; hierin heeft u dwaas gedaan; want van nu af zullen er oorlogen tegen u zijn.", "Hos 1:1": "Het woord van de Heere, dat gebeurd is tot Hosea, de zoon van Beëri, in de dagen van Uzzia, Jotham, Achaz, Hizkia, koningen van Juda, en in de dagen van Jerobeam, zoon van Joas, koning van Israël.", "Hand 2:38": "En Petrus zei tegen hen: Bekeer u, en ieder van u moet gedoopt worden in de Naam van Jezus Christus, tot vergeving van de zonden; en u zult de gave van de Heilige Geest ontvangen.", "Spr 3:26": "Want de HEERE zal uw vertrouwen zijn, en Hij zal uw voet bewaren voor gevangenschap.", "Jak 1:12": "Gelukkig is de man die verzoeking verdraagt; want als hij beproefd zal zijn geweest, zal hij de kroon van het leven ontvangen, die de Heere beloofd heeft aan hen die Hem liefhebben.", "Ps 34:16": "Ain. De ogen van de HEERE zijn op de rechtvaardigen, en Zijn oren gericht op hun geroep.", "Neh 5:7": "En mijn hart beraadslaagde in mij; daarna berispte ik de edelen en de overheden, en zei tegen hen: U vordert een last, ieder van zijn broeder. Vervolgens riep ik een grote vergadering tegen hen bijeen.", "Hagg 2:8": "Ja, Ik zal alle heidenvolken doen beven, en zij zullen komen tot de Wens van alle heidenvolken, en Ik zal dit huis met heerlijkheid vervullen, zegt de HEERE van de heerscharen.", "Joh 15:19": "Als u van de wereld was, zou de wereld het hare liefhebben; maar omdat u van de wereld niet bent, maar Ik u uit de wereld heb uitverkoren, daarom haat de wereld u.", "Ezech 40:1": "In het vijfentwintigste jaar van onze wegvoering, in het begin van het jaar, op de tiende van de maand, in het veertiende jaar nadat de stad was ingenomen, op diezelfde dag was de hand van de HEERE op mij, en Hij bracht mij daarheen.", "Matt 3:8": "Breng dan vruchten voort die bij de bekering passen.", "Ps 24:5": "die zal de zegen ontvangen van de HEERE, en gerechtigheid van de God van zijn heil.", "Joh 8:51": "Voorwaar, voorwaar, Ik zeg u: Als iemand Mijn woord bewaart, zal hij de dood in eeuwigheid niet zien.", "Jes 60:13": "De heerlijkheid van Libanon zal tot u komen, de dennenboom, de beukenboom en de busboom tegelijk, om de plaats van Mijn heiligdom te versieren, en Ik zal de plaats van Mijn voeten heerlijk maken.", "Spr 28:27": "Wie de arme geeft, zal geen gebrek hebben; maar wie zijn ogen verbergt, zal veel vervloekt worden.", "Ps 147:11": "De HEERE schept vreugde in hen die Hem vrezen, die op Zijn goedertierenheid hopen.", "Joël 3:20": "Maar Juda zal blijven tot in eeuwigheid, en Jeruzalem van geslacht tot geslacht.", "Luk 1:66": "En allen die het hoorden namen het ter harte, en zeiden: Wat zal er toch van dit kind worden? En de hand van de Heere was met hem.", "1 Tim 6:17": "Beveel de rijken in deze tegenwoordige wereld dat zij niet hoogmoedig zijn, en ook niet hun hoop stellen op de onzekerheid van de rijkdom, maar op de levende God, Die ons alle dingen rijkelijk verleent om ervan te genieten;", "Openb 11:18": "en de volken waren toornig geworden, en Uw toorn is gekomen, en de tijd van de doden, om geoordeeld te worden, en om het loon te geven aan Uw dienstknechten, de profeten, en de heiligen, en aan hen die Uw Naam vrezen, de kleinen en de groten; en om hen te verderven die de aarde verdierven.", "Deut 16:17": "Ieder naar de gave van zijn hand, naar de zegen van de HEERE, uw God, die Hij u gegeven heeft.", "Nahum 1:7": "De HEERE is goed, Hij is een sterkte op de dag van benauwdheid, en Hij kent hen die op Hem vertrouwen.", "Luk 21:11": "En er zullen grote aardbevingen zijn op verscheidene plaatsen, en hongersnoden, en pestilentiën; er zullen ook schrikwekkende dingen, en grote tekenen van de hemel gebeuren.", "Ps 132:3-5": "Zeker, ik zal in de tent van mijn huis niet ingaan, ik zal op de koets van mijn bed niet klimmen! Ik zal mijn ogen geen slaap geven, mijn oogleden geen sluimering, totdat ik voor de HEERE een plaats gevonden zal hebben, woningen voor de Machtige van Jakob!", "Ezech 2:2": "Zo kwam in mij, toen Hij tot mij sprak, de Geest, Die mij op mijn voeten zette; en ik hoorde Hem, Die tot mij sprak.", "Joh 17:22": "En Ik heb hun de heerlijkheid gegeven die U Mij gegeven hebt; opdat zij één zijn, zoals Wij Eén zijn;", "Spr 3:23": "Dan zult u uw weg zeker gaan, en u zult uw voet niet stoten.", "Ps 95:7": "Want Hij is onze God, en wij zijn het volk van Zijn weide, en de schapen van Zijn hand. Heden, als u Zijn stem hoort,", "Num 1:1": "Verder sprak de HEERE tot Mozes, in de woestijn van Sinaï, in de tent van de samenkomst, op de eerste dag van de tweede maand, in het tweede jaar nadat zij uit het land Egypte vertrokken waren, en Hij zei:", "Amos 5:8": "Die het Zevengesternte en de Orion maakt, en de doodsschaduw in de morgen verandert, en de dag als de nacht verduistert; Die de wateren van de zee roept, en ze uitgiet over de aardbodem, HEERE is Zijn Naam.", "Ps 115:13": "Hij zal zegenen wie de HEERE vrezen, de kleinen met de groten.", "Hebr 12:28": "Daarom, omdat wij een onwankelbaar Koninkrijk ontvangen, laten wij de genade vasthouden, waardoor wij God welgevallig mogen dienen, met eerbied en godsvrucht.", "Spr 23:21": "Want een zuiper en een vraat zullen arm worden; en de sluimering doet iemand versleten kleren dragen.", "Mark 1:15": "en zei: De tijd is vervuld, en het Koninkrijk van God is nabijgekomen; bekeer u, en geloof het Evangelie.", "Pred 2:1-12": "Ik zei in mijn hart: Nu, welaan, ik zal u beproeven door vreugde; laat daarom het goede genieten; maar zie, ook dat was ijdelheid. Tot het lachen zei ik: U bent onzinnig, en tot de vreugde: Wat maakt deze? Ik heb in mijn hart nagespeurd om mijn vlees op te houden in de wijn, (en toch mijn hart leidend in wijsheid) en om de dwaasheid vast te houden, totdat ik zou zien wat voor de kinderen van de mensen het beste zou zijn om te doen onder de hemel, gedurende het aantal dagen van hun leven.", "Ef 2:19": "Zo bent u dan niet meer vreemdelingen en bijwoners, maar medeburgers van de heiligen, en huisgenoten van God;", "1 Sam 19:23": "Toen ging hij daarheen naar Najoth bij Rama; en dezelfde Geest van God kwam ook op hem, en al voortgaande profeteerde hij, totdat hij in Najoth in Rama aankwam.", "Joh 16:33": "Deze dingen heb Ik tot u gesproken, opdat u in Mij vrede hebt. In de wereld zult u verdrukking hebben, maar heb goede moed, Ik heb de wereld overwonnen.", "Richt 14:6": "Toen kwam de Geest van de HEERE machtig over hem, zodat hij hem uiteenscheurde, zoals men een bokje uiteenscheurt, en er was niets in zijn hand; maar hij vertelde zijn vader en zijn moeder niet wat hij gedaan had.", "Joh 12:43": "Want zij hadden de eer van mensen lief, meer dan de eer van God.", "Hand 2:30": "Omdat hij dan een profeet was, en wist dat God hem met een eed gezworen had dat Hij uit de vrucht van zijn lichaam, wat het vlees betreft, de Christus zou verwekken om Hem op zijn troon te zetten;", "Openb 7:3": "en hij zei: Breng de aarde geen schade toe, of de zee, of de bomen, totdat wij de dienstknechten van onze God verzegeld hebben aan hun voorhoofden.", "Jes 17:10": "Want u hebt de God van uw heil vergeten, en niet gedacht aan de Rotssteen van uw sterkte; daarom zult u wel liefelijke planten planten, en die met uitheemse ranken bezetten;", "2 Kron 7:14": "En Mijn volk, over wie Mijn Naam genoemd wordt, zich verootmoedigt en bidt, en zij Mijn aangezicht zoeken, en zich bekeren van hun slechte wegen; dan zal Ik uit de hemel horen, en hun zonden vergeven, en hun land genezen.", "Jes 41:10": "Vrees niet, want Ik ben met u; wees niet verbaasd, want Ik ben uw God; Ik sterk u, ook help Ik u, ook ondersteun Ik u met de rechterhand van Mijn gerechtigheid.", "Ps 103:7": "Hij heeft Mozes Zijn wegen bekendgemaakt, aan de kinderen van Israël Zijn daden.", "Hebr 12:23": "Tot de algemene vergadering en de gemeente van de eerstgeborenen, die in de hemelen opgeschreven zijn, en tot God, de Rechter over allen, en de geesten van de rechtvaardigen die volmaakt gemaakt zijn;", "2 Tim 4:8": "Verder ligt voor mij de kroon van de rechtvaardigheid klaar, die de Heere, de rechtvaardige Rechter, mij op die dag geven zal; en niet alleen mij, maar ook allen die Zijn verschijning hebben liefgehad.", "1 Tess 2:5": "Want wij hebben nooit met woorden gepluimstrijkt, zoals u weet, en ook niet met enig voorwendsel van hebzucht; God is getuige!", "Gal 6:2": "Draag elkaars lasten, en vervul zo de wet van Christus.", "Ps 96:9": "Aanbidt de HEERE in de heerlijkheid van het heiligdom; beeft voor Zijn aangezicht, heel de aarde.", "Openb 22:7": "Zie, Ik kom haastig; zalig is hij die de woorden van de profetie van dit boek bewaart.", "Ezra 4:1-6": "Toen nu de tegenstanders van Juda en Benjamin hoorden dat de teruggekeerde ballingen de tempel bouwden voor de HEERE, de God van Israël, kwamen zij naar Zerubbabel en naar de hoofden van de families toe en zeiden tegen hen: Laat ons met u bouwen, want wij zoeken uw God net als u; ook offeren wij aan Hem sinds de dagen van Esar-Haddon, de koning van Assur, die ons hierheen heeft laten optrekken. Maar Zerubbabel, Jesua en de overige hoofden van de families van Israël zeiden tegen hen: Het past niet dat u en wij samen een huis bouwen voor onze God; maar wij alleen zullen het bouwen voor de HEERE, de God van Israël, zoals koning Kores, de koning van Perzië, ons geboden heeft.", "Luk 12:33": "Verkoop wat u hebt, en geef aalmoezen. Maak uzelf beurzen die niet verslijten, een schat die niet afneemt, in de hemelen, waar de dief niet bijkomt en de mot niet verteert.", "Hebr 1:1": "Nadat God voortijds veelmaal en op velerlei wijze tot de vaderen gesproken heeft door de profeten, heeft Hij in deze laatste dagen tot ons gesproken door de Zoon;", "Richt 6:7-10": "En het gebeurde, toen de Israëlieten tot de HEERE riepen vanwege de Midianieten, dat de HEERE een man zond, die een profeet was, naar de Israëlieten; die zei tegen hen: Zo zegt de HEERE, de God van Israël: Ik heb u uit Egypte doen optrekken, en u uit het slavenhuis uitgeleid; en Ik heb u verlost uit de hand van de Egyptenaren, en uit de hand van allen die u onderdrukten; en Ik heb hen voor uw ogen verdreven, en u hun land gegeven;", "Matt 22:1-14": "En Jezus antwoordde en sprak opnieuw in gelijkenissen tot hen, en zei: Het Koninkrijk der hemelen is gelijk aan een zeker koning, die voor zijn zoon een bruiloft bereid had; En hij zond zijn dienstknechten uit om de genode gasten naar de bruiloft te roepen; en zij wilden niet komen.", "Ex 33:12": "En Mozes zei tegen de HEERE: Zie, U zegt tegen mij: Voer dit volk op! maar U laat mij niet weten aan wie U met mij zult zenden; terwijl U gezegd hebt: Ik ken u bij naam! en ook: U hebt genade gevonden in Mijn ogen!", "Hand 28:25": "En omdat zij het onderling oneens waren, gingen zij uiteen, nadat Paulus dit ene woord gezegd had, namelijk: Terecht heeft de Heilige Geest gesproken door de profeet Jesaja tot onze voorvaders,", "Openb 2:7": "Wie oren heeft, laat hij horen wat de Geest tegen de gemeenten zegt. Wie overwint, hem zal Ik geven te eten van de boom des levens, die in het midden van het paradijs van God is.", "2 Kon 23:7": "Daartoe brak hij de huizen van de schandjongens af, die bij het huis van de HEERE waren, waar de vrouwen huisjes voor het beeld van het bos weefden.", "1 Kron 28:10": "Zie nu toe, want de HEERE heeft u verkoren om een huis te bouwen tot heiligdom; wees sterk en doe het.", "Jer 17:11": "Zoals een veldhoen eieren verzamelt, maar ze niet uitbroedt, zo is hij die rijkdom verzamelt, maar niet met recht; in de helft van zijn dagen zal hij die moeten verlaten, en in zijn laatste dagen een dwaas zijn.", "Hebr 11:5": "Door het geloof is Henoch weggenomen, zodat hij de dood niet zou zien; en hij werd niet gevonden, omdat God hem weggenomen had; want vóór zijn wegneming had hij het getuigenis dat hij God behaagde.", "Mal 3:1": "Zie, Ik zend Mijn engel, die voor Mijn aangezicht de weg bereiden zal; en snel zal die Heere, Die u zoekt, tot Zijn tempel komen, namelijk de Engel van het verbond, aan Wie u lust hebt; zie, Hij komt, zegt de HEERE van de heerscharen.", "Spr 15:27": "Wie hebzucht najaagt, brengt zijn huis in beroering; maar wie geschenken haat, zal leven.", "Fil 4:19": "Maar mijn God zal naar Zijn rijkdom al wat u nodig hebt vervullen, in heerlijkheid, door Christus Jezus.", "Jer 18:1": "Het woord dat van de HEERE tot Jeremia gebeurde, en Hij zei:", "1 Petr 1:2-5": "de uitverkorenen naar de voorkennis van God de Vader, in de heiligmaking van de Geest, tot gehoorzaamheid en besprenging met het bloed van Jezus Christus; genade en vrede worde u vermenigvuldigd. Geloofd zij de God en Vader van onze Heere Jezus Christus, Die naar Zijn grote barmhartigheid ons opnieuw geboren heeft doen worden tot een levende hoop, door de opstanding van Jezus Christus uit de doden. Tot een onvergankelijke, onbevlekte en onverwelkbare erfenis, die in de hemelen bewaard is voor u.", "1 Petr 2:11": "Geliefden, ik roep u dringend op, als inwoners en vreemdelingen, dat u zich onthoudt van de vleselijke begeerten, die strijd voeren tegen de ziel;", "Spr 22:9": "Wie goed van oog is, zal gezegend worden; want hij heeft van zijn brood aan de arme gegeven.", "1 Kron 6:14": "En Azarja verwekte Seraja, en Seraja verwekte Jozadak;", "1 Kron 28:20": "En David zei tegen zijn zoon Salomo: Wees sterk en houd goede moed, en doe het; wees niet bevreesd en wees niet verslagen; want de HEERE God, mijn God, zal met u zijn; Hij zal u niet begeven en Hij zal u niet verlaten, totdat u al het werk voor de dienst van het huis van de HEERE hebt voltooid.", "Rom 12:8": "hetzij wie vermaant, in het vermanen; wie uitdeelt, in eenvoud; wie leiding geeft, met ijver; wie barmhartigheid bewijst, met blijmoedigheid.", "Neh 7:70-72": "Een deel nu van de hoofden van de vaderen gaf tot het werk. De Hattirsatha gaf tot de schat, aan goud, duizend drachmen, vijftig sprenkelschalen, vijfhonderddertig priesterrokken. En anderen van de hoofden van de vaderen gaven tot de schat van het werk, aan goud, twintigduizend drachmen, en aan zilver, tweeduizend tweehonderd ponden. En wat de overigen van het volk gaven, was aan goud, twintigduizend drachmen, en aan zilver, tweeduizend mijnen, en zevenenzestig priesterrokken.", "Deut 31:11-13": "wanneer heel Israël zal komen om te verschijnen voor het aangezicht van de HEERE, uw God, op de plaats die Hij zal uitkiezen, zult u deze wet voorlezen voor heel Israël, ten aanhoren van hen; verzamel het volk, de mannen, en de vrouwen, en de kinderen, en uw vreemdelingen die in uw poorten zijn; opdat zij horen, en opdat zij leren, en de HEERE, uw God, vrezen, en nauwlettend doen alle woorden van deze wet. En opdat hun kinderen, die het niet geweten hebben, horen en leren, om de HEERE, uw God, te vrezen, alle dagen dat u leeft op het land waarheen u de Jordaan overtrekt om het te erven.", "Ps 41:13": "Want mij aangaande, U onderhoudt mij in mijn oprechtheid, en U stelt mij voor Uw aangezicht in eeuwigheid.", "Ef 6:8": "wetende dat ieder, wat goed hij ook zal hebben gedaan, dat hij dat van de Heere zal ontvangen, of hij dienstknecht is of vrije.", "Hagg 2:5": "Toch nu, wees sterk, Zerubbabel! spreekt de HEERE; en wees sterk, Josua, zoon van Jozadak, hogepriester! en wees sterk, al u volk van het land! spreekt de HEERE; en werk, want Ik ben met u, spreekt de HEERE van de heerscharen;", "2 Kron 36:22": "Maar in het eerste jaar van Kores, koning van Perzië, opdat het woord van de HEERE volbracht werd, door de mond van Jeremia, wekte de HEERE de geest op van Kores, koning van Perzië, zodat hij een stem liet doorgaan door zijn hele koninkrijk, ook zelfs op schrift, en hij zei:", "Spr 10:22": "De zegen van de HEERE, die maakt rijk; en Hij voegt er geen smart aan toe.", "2 Kron 20:14": "Toen kwam de Geest van de HEERE in het midden van de samenkomst, op Jahaziël, de zoon van Zecharja, de zoon van Benaja, de zoon van Jehiël, de zoon van Matthanja, de Leviet, uit de zonen van Asaf;", "2 Petr 1:21": "Want de profetie is vroeger nooit voortgebracht door de wil van een mens, maar de heilige mensen van God hebben gesproken, gedreven door de Heilige Geest.", "Spr 21:21": "Wie rechtvaardigheid en weldadigheid najaagt, zal het leven, rechtvaardigheid en eer vinden.", "Jes 56:2-8": "Gelukkig is de mens die dit doet, en het mensenkind dat daaraan vasthoudt; die de sabbat houdt, zodat hij die niet ontheiligt, en die zijn hand bewaart om geen enkel kwaad te doen. En de vreemdeling, die zich bij de HEERE gevoegd heeft, moet niet zeggen: De HEERE heeft mij helemaal van Zijn volk gescheiden; en de ontmande moet niet zeggen: Zie, ik ben een dorre boom. Want zo zegt de HEERE van de ontmanden, die Mijn sabbatten houden, en verkiezen wat Mij behaagt, en vasthouden aan Mijn verbond;", "Luk 18:29": "En Hij zei tegen hen: Voorwaar, Ik zeg u, er is niemand die huis, of ouders, of broers, of vrouw, of kinderen heeft verlaten om het Koninkrijk van God,", "Mark 6:12": "En zij gingen uit, en predikten dat de mensen zich moesten bekeren.", "Hagg 2:20": "Is er nog zaad in de schuur? Zelfs de wijnstok, en de vijgenboom, en de granaatappelboom, en de olijfboom, die niet gedragen hebben, die zal Ik vanaf deze dag zegenen.", "Joh 3:36": "Wie in de Zoon gelooft, heeft het eeuwige leven; maar wie de Zoon ongehoorzaam is, zal het leven niet zien, maar de toorn van God blijft op hem.", "Ps 27:4": "Eén ding heb ik van de HEERE gevraagd, dat zal ik zoeken: dat ik alle dagen van mijn leven mag wonen in het huis van de HEERE, om de liefelijkheid van de HEERE te aanschouwen, en te onderzoeken in Zijn tempel.", "Jer 1:2": "Tot wie het woord van de HEERE kwam, in de dagen van Josia, zoon van Amon, koning van Juda, in het dertiende jaar van zijn regering.", "Jer 26:3": "Misschien zullen zij horen, en zich bekeren, ieder van zijn boze weg; zo zou Ik berouw hebben over het kwaad dat Ik hun denk te doen vanwege de boosheid van hun daden.", "Ef 3:12": "door wie wij de vrijmoedigheid hebben, en de toegang met vertrouwen, door het geloof aan Hem.", "Ps 4:5": "Wees beroerd, en zondig niet; spreek in uw hart op uw bed, en wees stil. Sela.", "Mal 4:6": "En hij zal het hart van de vaders terugbrengen tot de kinderen, en het hart van de kinderen tot hun vaders, zodat Ik niet hoef te komen en de aarde met de ban sla.", "Spr 9:6": "Verlaat de dwaasheden, en leef; en treed in de weg van het verstand.", "Richt 2:1": "En een Engel van de HEERE kwam op van Gilgal naar Bochim, en Hij zei: Ik heb u uit Egypte opgevoerd, en u gebracht in het land dat Ik uw vaderen gezworen heb, en gezegd: Ik zal Mijn verbond met u niet verbreken in eeuwigheid.", "Job 8:4-7": "Als uw kinderen tegen Hem gezondigd hebben, dan heeft Hij hen ook overgegeven aan de macht van hun overtreding. Maar als u God vroeg zoekt, en tot de Almachtige om genade bidt; als u zuiver en oprecht bent, zeker zal Hij dan nu ontwaken om uwentwil, en Hij zal de woning van uw gerechtigheid herstellen.", "Matt 24:7": "Want het ene volk zal tegen het andere volk opstaan, en het ene koninkrijk tegen het andere koninkrijk; en er zullen hongersnoden zijn, en pestilentiën, en aardbevingen op verschillende plaatsen.", "Lev 26:12": "En Ik zal in uw midden wandelen, en zal u tot een God zijn, en u zult Mij tot een volk zijn.", "Ps 112:9": "Pe. Hij strooit uit, hij geeft aan de arme; Tsade. zijn gerechtigheid houdt stand tot in eeuwigheid; Koph. zijn hoorn zal verhoogd worden in eer.", "Job 36:7-12": "Hij trekt Zijn ogen niet terug van de rechtvaardige, maar met de koningen zijn zij op de troon; daar zet Hij hen voor altijd, en zij worden verheven. En als zij, gebonden met boeien, vastgehouden worden met banden van ellende; Dan maakt Hij hun hun daden bekend, en hun overtredingen, omdat zij de overhand genomen hebben;", "Hagg 2:17": "Voordat die dingen gebeurden, kwam iemand bij de korenhoop van twintig maten, en er waren er maar tien; kwam iemand bij de wijnbak om vijftig maten uit de pers te putten, en er waren er maar twintig.", "2 Sam 24:24": "Doch de koning zei tegen Arauna: Nee, maar ik zal het zeker van u kopen voor de prijs; want ik zal de HEERE, mijn God, geen brandoffers offeren die mij niets kosten. Zo kocht David de dorsvloer en de runderen voor vijftig zilveren sikkels.", "Jer 6:8": "Laat u tuchtigen, Jeruzalem! Opdat Mijn ziel niet van u afgetrokken wordt, opdat Ik u niet stel tot een woestheid, tot een onbewoond land.", "2 Kron 36:12": "En hij deed wat slecht was in de ogen van de HEERE, zijn God; hij verootmoedigde zich niet voor het aangezicht van de profeet Jeremia, die sprak uit de mond van de HEERE.", "Luk 7:14": "En Hij kwam erbij en raakte de baar aan; (de dragers stonden toen stil) en Hij zei: Jongeman, Ik zeg u: sta op!", "1 Kron 3:19": "De kinderen van Pedaja nu waren Zerubbabel en Simeï; en de kinderen van Zerubbabel waren Mesullam en Hananja; en Selomith was hun zuster;", "Ps 11:7": "Want de HEERE is rechtvaardig, Hij heeft gerechtigheden lief; Zijn aangezicht aanschouwt de oprechte.", "2 Kon 10:10": "Weet nu, dat niets van het woord van de HEERE, dat de HEERE tegen het huis van Achab gesproken heeft, op de aarde zal vallen; want de HEERE heeft gedaan, wat Hij door de dienst van Zijn knecht Elia gesproken heeft.", "1 Kor 14:32": "En de geesten der profeten zijn aan de profeten onderworpen.", "2 Kron 33:18": "Het overige nu van de geschiedenissen van Manasse, en zijn gebed tot zijn God, ook de woorden van de zieners, die tot hem gesproken hebben in de Naam van de HEERE, de God van Israël, zie, die staan in de geschiedenissen van de koningen van Israël;", "Klaagl 3:24": "Cheth. De HEERE is mijn deel, zegt mijn ziel, daarom zal ik op Hem hopen.", "1 Kron 29:5": "Goud voor de gouden voorwerpen, en zilver voor de zilveren voorwerpen, en voor al het werk dat door de hand van de werkmeesters gemaakt moet worden. En wie is er bereid om zich vandaag vrijwillig aan de HEERE te wijden?", "Joh 14:1-3": "Laat uw hart niet ontroerd worden; u gelooft in God, geloof ook in Mij. In het huis van Mijn Vader zijn veel woningen; anders zou Ik het u gezegd hebben. Ik ga heen om u plaats te bereiden. En wanneer Ik heen zal zijn gegaan en u plaats zal hebben bereid, kom Ik terug en zal u tot Mij nemen, opdat u ook mag zijn waar Ik ben.", "Hand 4:33": "En de apostelen gaven met grote kracht getuigenis van de opstanding van de Heere Jezus; en er was grote genade over hen allen.", "Jer 20:9": "Daarom zei ik: Ik zal Hem niet meer noemen, en niet meer in Zijn Naam spreken; maar het werd in mijn hart als een brandend vuur, opgesloten in mijn beenderen; en ik werd moe van het verdragen, maar ik kon het niet.", "Ps 132:14": "Dit is Mijn rust tot in eeuwigheid, hier zal Ik wonen, want Ik heb het begeerd.", "Zach 11:1": "Doe uw deuren open, o Libanon! Opdat het vuur uw ceders verteert.", "1 Tess 3:12": "En moge de Heere u doen toenemen en overvloedig maken in de liefde tot elkaar en tot allen, zoals wij ook zijn tot u,", "1 Kor 15:32": "Als ik, naar de mens gesproken, tegen wilde dieren gevochten heb in Efeze, wat baat het mij, als de doden niet opgewekt worden? Laten wij eten en drinken, want morgen sterven wij.", "2 Kon 12:4": "En Joas zei tegen de priesters: Al het geld van de geheiligde dingen, dat gebracht zal worden in het huis van de HEERE, te weten het geld van hem die overgaat tot de getelden, het geld van ieder man naar zijn schatting, en al het geld, dat in het hart van ieder komt, om dat te brengen in het huis van de HEERE,", "Ps 139:24": "En zie, of er bij mij een schadelijke weg is; en leid mij op de eeuwige weg.", "Hand 26:18": "Om hun ogen te openen en hen te bekeren van de duisternis tot het licht, en van de macht van de satan tot God; opdat zij vergeving van de zonden ontvangen, en een erfdeel onder de geheiligden, door het geloof in Mij.", "1 Kor 6:3": "Weet u niet, dat wij de engelen zullen oordelen? Hoeveel te meer de zaken die dit leven aangaan?", "2 Kon 14:25": "Hij bracht ook het gebied van Israël terug, vanaf de ingang van Hamath tot aan de zee van het vlakke veld; naar het woord van de HEERE, de God van Israël, dat Hij gesproken had door de dienst van Zijn dienaar Jona, de zoon van Amitthai, de profeet, die uit Gath-Hefer was.", "2 Kor 7:1": "Omdat wij dan deze beloften hebben, geliefden, laten wij onszelf reinigen van alle besmetting van het vlees en van de geest, en zo de heiligmaking volbrengen in de vreze van God.", "1 Kon 18:36": "En het gebeurde, toen men het spijsoffer offerde, dat de profeet Elia naderde en zei: HEERE, God van Abraham, Izak en Israël, laat het vandaag bekend worden, dat U God bent in Israël, en ik Uw knecht; en dat ik al deze dingen naar Uw woord gedaan heb.", "Job 22:21-30": "Gewen u toch aan Hem, en heb vrede; daardoor zal het goede u overkomen. Ontvang toch de wet uit Zijn mond, en leg Zijn woorden in uw hart. Als u zich bekeert tot de Almachtige, zult u gebouwd worden; doe het onrecht ver van uw tenten.", "1 Kon 9:3": "En de HEERE zei tegen hem: Ik heb uw gebed en uw smeking gehoord, die u voor Mijn aangezicht smekend gedaan hebt; Ik heb dit huis geheiligd, dat u gebouwd hebt, om Mijn Naam daar tot in eeuwigheid te vestigen; en Mijn ogen en Mijn hart zullen daar alle dagen zijn.", "Jes 59:20": "En er zal een Verlosser tot Sion komen, namelijk voor hen die zich bekeren van de overtreding in Jakob, spreekt de HEERE.", "Ps 125:1-3": "Een lied Hammaaloth. Wie op de HEERE vertrouwen, zijn als de berg Sion, die niet wankelt, maar blijft in eeuwigheid. Rondom Jeruzalem zijn bergen; zo is de HEERE rondom Zijn volk, van nu aan tot in eeuwigheid. Want de scepter van de goddeloosheid zal niet rusten op het lot van de rechtvaardigen; opdat de rechtvaardigen hun handen niet uitstrekken tot onrecht.", "Matt 8:4": "En Jezus zei tegen hem: Zie dat u dit aan niemand zegt; maar ga heen, toon uzelf aan de priester, en offer de gave die Mozes geboden heeft, hun tot een getuigenis.", "Hand 21:11": "En hij kwam naar ons toe, nam de gordel van Paulus, bond daarmee zijn eigen handen en voeten, en zei: Dit zegt de Heilige Geest: De man van wie deze gordel is, zullen de Joden zo te Jeruzalem binden en overleveren in de handen van de heidenen.", "1 Joh 2:15-17": "Heb de wereld niet lief, en ook niet wat in de wereld is; als iemand de wereld liefheeft, is de liefde van de Vader niet in hem. Want al wat in de wereld is, namelijk de begeerte van het vlees, en de begeerte van de ogen, en de hoogmoed van het leven, is niet uit de Vader, maar is uit de wereld. En de wereld gaat voorbij, en haar begeerte; maar wie de wil van God doet, blijft tot in eeuwigheid.", "Ps 97:11": "Het licht is gezaaid voor de rechtvaardige, en vrolijkheid voor de oprechten van hart.", "Matt 6:1-4": "Let op dat u uw aalmoes niet doet voor de mensen, om door hen gezien te worden; anders hebt u geen loon bij uw Vader, Die in de hemelen is. Wanneer u dan aalmoes doet, laat het dan niet voor u uittrompetten, zoals de geveinsden doen in de synagogen en op de straten, opdat zij door de mensen geëerd worden. Voorwaar, Ik zeg u: zij hebben hun loon al ontvangen. Maar als u aalmoes doet, laat uw linkerhand dan niet weten wat uw rechterhand doet;", "Job 20:4-29": "Weet u dit niet? Van oudsher af, van toen God de mens op de wereld gezet heeft, Dat het gejuich van de goddelozen van dichtbij geweest is², en de vreugde van de huichelaar maar voor een ogenblik? Al zou zijn hoogheid tot de hemel toe opklimmen, en zijn hoofd tot aan de wolken raken;", "Ex 36:3-6": "Zij namen dan van voor Mozes het hele hefoffer, dat de kinderen van Israël gebracht hadden voor het werk van de dienst van het heiligdom, om dat te maken; maar zij brachten hem nog elke morgen vrijwillig offer. Daarom kwamen alle wijzen, die al het werk van het heiligdom maakten, ieder man van zijn werk, dat zij maakten, en zij spraken tot Mozes en zeiden: Het volk brengt te veel, meer dan genoeg is voor de dienst van het werk dat de HEERE geboden heeft te maken.", "Neh 4:10": "Toen zei Juda: De kracht van de dragers is uitgeput, en er is veel puin, zodat wij niet aan de muur zullen kunnen bouwen.", "Deut 4:7": "Want welk groot volk is er, dat de goden zo dichtbij heeft als de HEERE, onze God, bij ons is, zo vaak als wij Hem aanroepen?", "2 Kron 33:15": "En hij nam de vreemde goden en die gelijkenis weg uit het huis van de HEERE, alsook alle altaren die hij gebouwd had op de berg van het huis van de HEERE, en te Jeruzalem; en hij wierp ze buiten de stad.", "2 Kron 26:21": "Zo was de koning Uzzia melaats tot aan de dag van zijn dood; en melaats zijnde, woonde hij in een afgezonderd huis, want hij was van het huis van de HEERE afgesneden; Jotham nu, zijn zoon, was over het huis van de koning, en oordeelde het volk van het land.", "Jer 29:26": "De HEERE heeft u tot priester gesteld, in plaats van de priester Jojada, opdat u opzichters zou zijn in het huis van de HEERE over iedere man die onzinnig is en zich voor een profeet uitgeeft, om die te stellen in de gevangenis en in het blok.", "Zach 2:9": "Want zie, Ik zal Mijn hand over hen bewegen, en zij zullen hun knechten een roof wezen. Zo zult u weten, dat de HEERE van de heerscharen mij gezonden heeft.", "Rom 2:10": "Maar heerlijkheid, en eer, en vrede voor ieder die het goede doet, eerst de Jood, en ook de Griek.", "Jer 6:16": "Zo zegt de HEERE: Staat op de wegen, en ziet toe, en vraagt naar de oude paden, waar toch de goede weg is, en wandelt daarin; zo zult u rust vinden voor uw ziel; maar zij zeggen: Wij zullen daarin niet wandelen.", "Matt 3:9": "En denk niet bij uzelf te zeggen: Wij hebben Abraham als vader; want ik zeg u dat God zelfs uit deze stenen voor Abraham kinderen kan verwekken.", "Ezech 18:27": "Maar als de goddeloze zich bekeert van zijn goddeloosheid, die hij gedaan heeft, en recht en gerechtigheid doet, die zal zijn ziel in het leven behouden;", "Lev 26:20": "En uw macht zal voor niets verbruikt worden; en uw land zal zijn opbrengst niet geven, en het geboomte van het land zal zijn vrucht niet geven.", "1 Petr 4:13": "maar zoals u gemeenschap hebt aan het lijden van Christus, zo verblijdt u; opdat u ook in de openbaring van Zijn heerlijkheid u mag verblijden en verheugen.", "Deut 12:5-7": "Maar naar de plaats die de HEERE, uw God, uit al uw stammen zal uitkiezen om Zijn Naam daar te vestigen, naar Zijn woning zult u vragen, en daarheen zult u komen; En daarheen zult u brengen uw brandoffers, en uw slachtoffers, en uw tienden, en het hefoffer van uw hand, en uw geloften, en uw vrijwillige offers, en de eerstgeboorte van uw runderen en van uw schapen. En daar zult u voor het aangezicht van de HEERE, uw God, eten en vrolijk zijn, u en uw huizen, over alles waaraan u uw hand geslagen hebt, waarin de HEERE, uw God, u gezegend heeft.", "Jer 8:10": "Daarom zal Ik hun vrouwen aan anderen geven, hun akkers aan andere bezitters; want van de kleinste tot de grootste toe pleegt ieder van hen gierigheid; van de profeet tot de priester toe bedrijft ieder van hen valsheid.", "Neh 9:30": "Doch U hebt geduld met hen gehad, vele jaren lang, en tegen hen getuigd door Uw Geest, door de dienst van Uw profeten, maar zij neigden hun oor niet; daarom hebt U hen gegeven in de hand van de volken van de landen.", "Spr 13:7": "Er is iemand die zichzelf rijk maakt, en toch niets heeft, en iemand die zichzelf arm maakt, en toch veel goed heeft.", "Ps 41:2": "Gelukkig is hij, die zich verstandig gedraagt tegenover een ellendige; de HEERE zal hem bevrijden ten dage des kwaads.", "Spr 10:24": "Wat de goddeloze vreest, dat zal hem overkomen; maar wat de rechtvaardigen verlangen, zal God geven.", "Ezech 37:23": "En zij zullen zich niet meer verontreinigen met hun drekgoden, en met hun afschuwelijkheden, en met al hun overtredingen; en Ik zal ze verlossen uit al hun woonplaatsen, waarin zij gezondigd hebben, en zal ze reinigen; zo zullen zij Mij tot een volk zijn, en Ik zal hun tot een God zijn.", "Job 31:28": "Dat ware ook een misdaad bij de rechter; want ik zou de God van boven verzaakt hebben.", "1 Kon 13:20": "En het gebeurde, terwijl zij aan tafel zaten, dat het woord van de HEERE kwam tot de profeet die hem had laten terugkeren;", "2 Kon 11:3": "En hij was met haar verborgen in het huis van de HEERE, zes jaar; en Athalia regeerde over het land.", "Matt 13:43": "Dan zullen de rechtvaardigen stralen als de zon, in het Koninkrijk van hun Vader. Wie oren heeft om te horen, laat hij horen.", "Luk 1:67": "En Zacharias, zijn vader, werd vervuld met de Heilige Geest, en profeteerde, en zei:", "Joël 2:29": "Ja, ook over de dienstknechten, en over de dienstmaagden, zal Ik in die dagen Mijn Geest uitgieten.", "Hand 8:22": "Bekeer u dan van deze slechtheid van u, en bid tot God, of misschien deze overweging van uw hart u vergeven wordt.", "Ps 134:1": "Een lied Hammaaloth. Zie, loof de HEERE, alle knechten van de HEERE! U die iedere nacht in het huis van de HEERE staat!", "Ps 34:15": "Samech. Wijk af van het kwaad, en doe het goede; zoek de vrede, en jaag die na.", "2 Sam 22:20": "En Hij voerde mij uit in de ruimte, en rukte mij eruit, want Hij had lust aan mij.", "Job 34:29": "Als Hij stilt, wie zal dan beroeren? Als Hij het aangezicht verbergt, wie zal Hem dan aanschouwen, zowel voor een volk, als voor een mens alleen?", "1 Petr 3:9-12": "vergeld geen kwaad met kwaad, of schelden met schelden, maar zegen daarentegen; want u weet dat u daartoe geroepen bent, opdat u zegening zou beërven. Want wie het leven wil liefhebben en goede dagen wil zien, die moet zijn tong weerhouden van het kwade, en zijn lippen, zodat ze geen bedrog spreken; hij moet wijken van het kwade en het goede doen; hij moet vrede zoeken en die najagen.", "Jer 1:4-10": "Het woord van de HEERE dan kwam tot mij, en zei: Voordat Ik u in moeders buik vormde, heb Ik u gekend, en voordat u uit de baarmoeder voortkwam, heb Ik u geheiligd; Ik heb u de volken tot een profeet gesteld. Toen zei ik: Ach, Heere HEERE! zie, ik kan niet spreken, want ik ben jong.", "Num 23:21": "Hij ziet geen ongerechtigheid in Jakob; ook ziet Hij geen boosheid in Israël. De HEERE, zijn God, is met hem, en het geschal van de Koning is bij hem.", "Joël 1:18": "O, hoe zucht het vee, de runderkudden zijn bedwelmd, want zij hebben geen weide, ook zijn de schaapskudden verwoest.", "Deut 5:21": "En u zult niet begeren de vrouw van uw naaste; en u zult zich niet laten gelusten naar het huis van uw naaste, zijn akker, noch zijn dienstknecht, noch zijn dienstmaagd, zijn os, noch zijn ezel, noch iets dat van uw naaste is.", "2 Kon 2:9": "Het gebeurde nu, toen zij overgekomen waren, dat Elia zei tegen Elisa: Vraag wat ik voor u doen zal, voordat ik van bij u weggenomen word. En Elisa zei: Laat toch een dubbel deel van uw geest op mij zijn!", "Zach 8:10": "Want vóór die dagen kwam het loon van de mens tot niets, en het loon van het vee was er niet; en de uitgaande en de inkomende hadden geen vrede vanwege de vijand, want Ik zond alle mensen, ieder tegen zijn naaste.", "Luk 9:46-48": "En er ontstond onder hen een discussie over wie van hen de belangrijkste zou zijn. Maar Jezus, die de gedachte van hun hart zag, nam een kind en zette dat naast Zich, en zei tegen hen: Wie dit kind ontvangt in Mijn Naam, ontvangt Mij; en wie Mij ontvangt, ontvangt Hem Die Mij gezonden heeft. Want wie de minste is onder u allen, die zal groot zijn.", "Klaagl 3:40": "Nun. Laat ons onze wegen onderzoeken en doorzoeken, en laat ons terugkeren tot de HEERE.", "Ef 5:3": "Maar hoererij en alle onreinheid, of hebzucht, laat onder u zelfs niet genoemd worden, zoals het de heiligen betaamt,", "Ps 65:5": "Gelukkig is hij, die U verkiest, en doet naderen, dat hij woont in Uw voorhoven; wij zullen verzadigd worden met het goed van Uw huis, met het heilige van Uw paleis.", "Matt 26:41": "Waakt en bidt, opdat u niet in verzoeking komt; de geest is wel gewillig, maar het vlees is zwak.", "Dan 6:15": "Toen de koning dit hoorde, was hij zeer bedroefd bij zichzelf, en hij zette zijn hart op Daniël om hem te verlossen; ja, tot aan zonsondergang toe deed hij moeite om hem te redden.", "Ps 110:3": "Uw volk zal zeer gewillig zijn op de dag van Uw heirkracht, in heilig sieraad; uit de baarmoeder van het dageraad zal U de dauw van Uw jeugd zijn.", "2 Kon 6:17": "En Elisa bad, en zei: HEERE, open toch zijn ogen, dat hij ziet! En de HEERE opende de ogen van de knecht, dat hij zag; en zie, de berg was vol vurige paarden en wagens rondom Elisa.", "Ps 24:4": "Die rein van handen, en zuiver van hart is, die zijn ziel niet opheft tot ijdelheid, en die niet bedrieglijk zweert;", "Gen 40:8": "En zij zeiden tegen hem: Wij hebben een droom gehad, en er is niemand die hem uitlegt. En Jozef zei tegen hen: Zijn de uitleggingen niet van God? Vertel ze mij toch.", "Mark 1:44": "en zei tegen hem: Zie erop toe dat u het niemand zegt; maar ga heen en laat uzelf aan de priester zien, en offer voor uw reiniging wat Mozes geboden heeft, hun tot een getuigenis.", "1 Sam 8:20": "en wij zullen ook zijn zoals alle volken; en onze koning zal ons richten, en hij zal voor ons uit gaan, en hij zal onze oorlogen voeren.", "Luk 6:21": "Zalig bent u, die nu honger hebt; want u zult verzadigd worden. Zalig bent u, die nu weent; want u zult lachen.", "Luk 10:7": "En blijf in dat huis, etend en drinkend wat zij u geven; want de arbeider is zijn loon waard. Ga niet van het ene huis naar het andere.", "Hand 20:21": "Terwijl ik zowel Joden als Grieken heb betuigd de bekering tot God en het geloof in onze Heere Jezus Christus.", "Jes 31:6": "Bekeer u tot Hem, van Wie
