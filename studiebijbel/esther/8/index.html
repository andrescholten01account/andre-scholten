,"Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Op dezelfde dag gaf de koning Ahasveros aan koningin Esther het huis van Haman, de vijand van de Joden; en Mordechai kwam voor de koning, want Esther had bekendgemaakt wat hij voor haar was.","2":"En de koning trok zijn ring af, die hij van Haman had afgenomen, en gaf hem aan Mordechai; en Esther stelde Mordechai aan over het huis van Haman.","3":"En Esther sprak verder voor de koning, en zij viel voor zijn voeten, en zij weende, en zij smeekte hem, dat hij de boosheid van Haman, de Agagiet, en zijn plan, dat hij tegen de Joden bedacht had, zou wegnemen.","4":"De koning nu reikte de gouden scepter naar Esther uit. Toen stond Esther op, en zij bleef staan voor de koning.","5":"En zij zei: Als het de koning goeddunkt, en als ik genade voor zijn ogen gevonden heb, en deze zaak voor de koning juist is, en ik in zijn ogen aangenaam ben, laat er dan geschreven worden dat de brieven en het plan van Haman, de zoon van Hammedatha, de Agagiet, teruggeroepen worden, welke hij geschreven heeft om de Joden om te brengen, die in alle landschappen van de koning zijn.","6":"Want hoe zou ik het kunnen verdragen dat ik het kwaad aanzie, dat mijn volk zal treffen? En hoe zou ik het kunnen verdragen dat ik het verderf van mijn geslacht aanzie?","7":"Toen zei de koning Ahasveros tegen koningin Esther en tegen Mordechai, de Jood: Zie, het huis van Haman heb ik aan Esther gegeven, en hem heeft men aan de galg gehangen, omdat hij zijn hand tegen de Joden had opgeheven.","8":"Schrijft u dan voor de Joden, zoals het goed is in uw ogen, in de naam van de koning, en verzegelt het met de ring van de koning; want het geschrift, dat in de naam van de koning geschreven, en met de ring van de koning verzegeld is, kan door niemand teruggeroepen worden.","9":"Toen werden de schrijvers van de koning geroepen, op datzelfde moment, in de derde maand (dat is de maand Sivan), op de drieëntwintigste daarvan, en er werd geschreven naar alles wat Mordechai gebood, aan de Joden, en aan de stadhouders, en landvoogden, en leiders van de landschappen, die van Indië af tot aan Morenland reiken, honderdzevenentwintig landschappen, ieder landschap naar zijn eigen schrift, ieder volk naar zijn eigen taal; ook aan de Joden naar hun schrift en naar hun taal.","10":"En men schreef in de naam van koning Ahasveros, en men verzegelde het met de ring van de koning; en men zond de brieven door de hand van de lopers te paard, die reden op snelle kamelen, op muildieren, geteeld uit merries;","11":"Dat de koning aan de Joden, die in elke stad waren, toestond zich te verzamelen, en op te komen voor hun leven, om te verdelgen, om te doden en om om te brengen alle macht van het volk en van het landschap, die hen benauwen zou, de kleine kinderen en de vrouwen, en hun buit te roven;","12":"Op één dag in alle landschappen van koning Ahasveros, op de dertiende van de twaalfde maand; dat is de maand Adar.","13":"De inhoud van dit geschrift was: dat er een wet zou worden gegeven in alle landschappen, openbaar bekendgemaakt aan alle volken; en dat de Joden gereed zouden zijn tegen die dag, om zich te wreken op hun vijanden.","14":"De lopers, die op snelle kamelen reden *en* op muildieren, trokken snel uit, aangedreven door het woord van de koning. Deze wet nu werd gegeven op de burg Susan.","15":"En Mordechai ging weg van voor de koning in een hemelsblauw en wit koninklijk kleed, en met een grote gouden kroon, en met een overkleed van fijn linnen en purper; en de stad Susan juichte en was vrolijk.","16":"Bij de Joden was licht, en blijdschap, en vreugde, en eer;","17":"Ook in elk landschap, en in elke stad, op elke plaats waar het woord van de koning en zijn wet aankwam, daar was bij de Joden blijdschap en vreugde, maaltijden en vrolijke dagen; en velen uit de volken van het land werden Joden, want de vreze voor de Joden was op hen gevallen."},"SV":{"1":"Te dienzelfden dage gaf de koning Ahasveros aan de koningin Esther het huis van Haman, den vijand der Joden; en Mordechai kwam voor het aangezicht des konings, want Esther had te kennen gegeven, wat hij voor haar was.","2":"En de koning toog zijn ring af, dien hij van Haman genomen had, en gaf hem aan Mordechai; en Esther stelde Mordechai over het huis van Haman.","3":"En Esther sprak verder voor het aangezicht des konings, en zij viel voor zijn voeten, en zij weende, en zij smeekte hem, dat hij de boosheid van Haman, den Agagiet, en zijn gedachte, die hij tegen de Joden gedacht had, zou wegnemen.","4":"De koning nu reikte den gouden scepter Esther toe. Toen rees Esther op, en zij stond voor het aangezicht des konings.","5":"En zij zeide: Indien het den koning goeddunkt, en indien ik genade voor zijn aangezicht gevonden heb, en deze zaak voor den koning recht is, en ik in zijn ogen aangenaam ben, dat er geschreven worde, dat de brieven en de gedachte van Haman, den zoon van Hammedatha, den Agagiet, wederroepen worden, welke hij geschreven heeft, om de Joden om te brengen, die in al de landschappen des konings zijn.","6":"Want hoe zal ik vermogen, dat ik aanzie het kwaad, dat mijn volk treffen zal? En hoe zal ik vermogen, dat ik aanzie het verderf van mijn geslacht?","7":"Toen zeide de koning Ahasveros tot de koningin Esther en tot Mordechai, den Jood: Ziet, het huis van Haman heb ik Esther gegeven, en hem heeft men aan de galg gehangen, omdat hij zijn hand aan de Joden geslagen had.","8":"Schrijft dan gijlieden voor de Joden, zoals het goed is in uw ogen, in des konings naam, en verzegelt het met des konings ring; want het schrift, dat in des konings naam geschreven, en met des konings ring verzegeld is, is niet te wederroepen.","9":"Toen werden des konings schrijvers geroepen, ter zelfder tijd, in de derde maand ( zij is de maand Sivan), op den drie en twintigsten derzelve, en er werd geschreven naar alles, wat Mordechai gebood, aan de Joden, en aan de stadhouders, en landvoogden, en oversten der landschappen, die van Indië af tot aan Morenland *strekken*, honderd zeven en twintig landschappen, een ieder landschap naar zijn schrift, een ieder volk naar zijn spraak; ook aan de Joden naar hun schrift en naar hun spraak.","10":"En men schreef in den naam van den koning Ahasveros, en men verzegelde het met des konings ring; en men zond de brieven door de hand der lopers te paard, rijdende op snelle kemelen, op muildieren, van merrien geteeld;","11":"Dat de koning den Joden toeliet, die in elke stad waren, zich te vergaderen, en voor hun leven te staan, om te verdelgen, om te doden en om om te brengen alle macht des volks en des landschaps, die hen benauwen zou, de kleine kinderen en de vrouwen, en hun buit te roven;","12":"Op een dag in al de landschappen van den koning Ahasveros, op den dertienden der twaalfde maand; deze is de maand Adar.","13":"De inhoud van dit geschrift was: dat een wet zou gegeven worden in alle landschappen, openbaar aan alle volken; en dat de Joden gereed zouden zijn tegen dien dag, om zich te wreken aan hun vijanden.","14":"De lopers, die op snelle kemelen reden *en* op muildieren, togen snellijk uit, aangedreven zijnde door het woord des konings. Deze wet nu werd gegeven op den burg Susan.","15":"En Mordechai ging uit van voor het aangezicht des konings in een hemelsblauw en wit koninklijk kleed, en met een grote gouden kroon, en met een opperkleed van fijn linnen en purper; en de stad Susan juichte en was vrolijk.","16":"Bij de Joden was licht, en blijdschap, en vreugde, en eer;","17":"Ook in alle en een ieder landschap, en in alle en een iedere stad, ter plaatse, waar des konings woord en zijn wet aankwam, daar was bij de Joden blijdschap en vreugde, maaltijden en vrolijke dagen; en velen uit de volken des lands werden Joden, want de vreze der Joden was op hen gevallen."},"KJV":{"1":"On that day did the king Ahasuerus give the house of Haman the Jews' enemy unto Esther the queen. And Mordecai came before the king; for Esther had told","2":"And the king took off his ring, which he had taken from Haman, and gave it unto Mordecai. And Esther set Mordecai over the house of Haman.","3":"And Esther spake yet again before the king, and fell down at his feet, and besought him with tears to put away the mischief of Haman the Agagite, and his device that he had devised against the Jews.","4":"Then the king held out the golden sceptre toward Esther. So Esther arose, and stood before the king,","5":"And said, If it please the king, and if I have found favour in his sight, and the thing *seem* right before the king, and I *be* pleasing in his eyes, let it be written to reverse the letters devised by Haman the son of Hammedatha the Agagite, which he wrote to destroy the Jews which *are* in all the king's provinces:","6":"For how can I endure to see the evil that shall come unto my people? or how can I endure to see the destruction of my kindred?","7":"Then the king Ahasuerus said unto Esther the queen and to Mordecai the Jew, Behold, I have given Esther the house of Haman, and him they have hanged upon the gallows, because he laid his hand upon the Jews.","8":"Write ye also for the Jews, as it liketh you, in the king's name, and seal *it* with the king's ring: for the writing which is written in the king's name, and sealed with the king's ring, may no man reverse.","9":"Then were the king's scribes called at that time in the third month, that *is*, the month Sivan, on the three and twentieth *day* thereof; and it was written according to all that Mordecai commanded unto the Jews, and to the lieutenants, and the deputies and rulers of the provinces which *are* from India unto Ethiopia, an hundred twenty and seven provinces, unto every province according to the writing thereof, and unto every people after their language, and to the Jews according to their writing, and according to their language.","10":"And he wrote in the king Ahasuerus' name, and sealed *it* with the king's ring, and sent letters by posts on horseback, *and* riders on mules, camels, *and* young dromedaries:","11":"Wherein the king granted the Jews which *were* in every city to gather themselves together, and to stand for their life, to destroy, to slay, and to cause to perish, all the power of the people and province that would assault them, *both* little ones and women, and *to take* the spoil of them for a prey,","12":"Upon one day in all the provinces of king Ahasuerus, *namely*, upon the thirteenth *day* of the twelfth month, which *is* the month Adar.","13":"The copy of the writing for a commandment to be given in every province *was* published unto all people, and that the Jews should be ready against that day to avenge themselves on their enemies.","14":"*So* the posts that rode upon mules *and* camels went out, being hastened and pressed on by the king's commandment. And the decree was given at Shushan the palace.","15":"And Mordecai went out from the presence of the king in royal apparel of blue and white, and with a great crown of gold, and with a garment of fine linen and purple: and the city of Shushan rejoiced and was glad.","16":"The Jews had light, and gladness, and joy, and honour.","17":"And in every province, and in every city, whithersoever the king's commandment and his decree came, the Jews had joy and gladness, a feast and a good day. And many of the people of the land became Jews; for the fear of the Jews fell"}},"tsk":{"1":[{"kopje":"gaf het huis","refs":["Job 27:16","Job 27:17","Ps 39:7","Ps 49:7-14","Spr 13:22","Spr 28:8","Pred 2:18","Pred 2:19","Luk 12:20"]},{"kopje":"kwam voor","refs":["Est 1:14","Est 2:7","Est 2:15"]}],"2":[{"kopje":"zijn ring","refs":["Est 3:10","Gen 41:42","Jes 22:19-22","Luk 15:22"]},{"kopje":"stelde","refs":["2 Sam 9:7-10","Ps 37:34","Pred 2:18","Pred 2:19-26","Pred 5:12","Pred 5:13","Dan 2:48"]}],"3":[{"kopje":"viel","refs":["1 Sam 25:24","2 Kon 4:27"]},{"kopje":"weende, en zij smeekte hem","refs":["Jes 38:2","Hos 12:5","Hebr 5:7"]},{"kopje":"boosheid","refs":["Est 3:8-15","Est 7:4"]}],"4":[{"kopje":"reikte uit","refs":["Est 4:11","Est 5:2"]}],"5":[{"kopje":"als ik","refs":["Est 7:3","Ex 33:13","Ex 33:16","1 Sam 20:29"]},{"kopje":"aangenaam ben","refs":["Est 2:4","Est 2:17"]},{"kopje":"brieven","refs":["Est 3:12","Est 3:13"]}],"6":[{"kopje":"Want hoe","refs":["Gen 44:34","Jer 4:19","Jer 9:1","Luk 19:41","Luk 19:42","Rom 9:2","Rom 9:3","Rom 10:1"]},{"kopje":"het kwaad","refs":["Est 7:4","Neh 2:3"]}],"7":[{"kopje":"Zie","refs":["Est 8:1","Spr 13:22"]},{"kopje":"heeft men aan de galg gehangen","refs":["Est 7:10","Gal 3:13"]}],"8":[{"kopje":"in de naam van de koning","refs":["Est 3:12","1 Kon 21:8"]},{"kopje":"kan door niemand teruggeroepen worden","refs":["Est 8:5","Est 1:19","Dan 6:9","Dan 6:13-16","2 Tim 2:19","Hebr 6:17","Hebr 6:18"]}],"9":[{"kopje":"van de koning","refs":["Est 3:12"]},{"kopje":"en landvoogden","refs":["Est 1:1","Est 1:22","Est 3:12","Est 3:13","Dan 6:2"]},{"kopje":"en naar","refs":["Est 1:22","Est 3:12","2 Kon 18:26","Dan 4:1","1 Kor 14:9-11"]}],"10":[{"kopje":"in de naam van koning Ahasveros","refs":["1 Kon 21:8","Pred 8:4","Dan 4:1"]},{"kopje":"door de hand van de lopers","refs":["Est 3:13","2 Kron 30:6","Job 9:25","Jer 51:21"]},{"k " data-code=\"H6242\">twentieth</span> day thereof; and it was <span class=\"wl wl-kjv\" data-code=\"H3789\">written</span> according to all that <span class=\"wl wl-kjv\" data-code=\"H4782\">Mordecai</span> <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3064\">Jews,</span> and to the <span class=\"wl wl-kjv\" data-code=\"H323\">lieutenants,</span> and the <span class=\"wl wl-kjv\" data-code=\"H6346\">deputies</span> and <span class=\"wl wl-kjv\" data-code=\"H8269\">rulers</span> of the <span class=\"wl wl-kjv\" data-code=\"H4082\">provinces</span> which are from <span class=\"wl wl-kjv\" data-code=\"H1912\">India</span> unto <span class=\"wl wl-kjv\" data-code=\"H3568\">Ethiopia,</span> an <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> <span class=\"wl wl-kjv\" data-code=\"H6242\">twenty</span> and <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H4082\">provinces,</span> unto every <span class=\"wl wl-kjv\" data-code=\"H4082\">province</span> according to the <span class=\"wl wl-kjv\" data-code=\"H3791\">writing</span> thereof, and unto every <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> after their <span class=\"wl wl-kjv\" data-code=\"H3956\">language,</span> and to the <span class=\"wl wl-kjv\" data-code=\"H3064\">Jews</span> according to their <span class=\"wl wl-kjv\" data-code=\"H3791\">writing,</span> and according to their language.","10":"And he <span class=\"wl wl-kjv\" data-code=\"H3789\">wrote</span> in the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H325\">Ahasuerus'</span> <span class=\"wl wl-kjv\" data-code=\"H8034\">name,</span> and <span class=\"wl wl-kjv\" data-code=\"H2856\">sealed</span> it with the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H2885\">ring,</span> and <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> <span class=\"wl wl-kjv\" data-code=\"H5612\">letters</span> <span class=\"wl wl-kjv\" data-code=\"H3027\">by</span> <span class=\"wl wl-kjv\" data-code=\"H7323\">posts</span> on <span class=\"wl wl-kjv\" data-code=\"H5483\">horseback,</span> and <span class=\"wl wl-kjv\" data-code=\"H7392\">riders</span> on <span class=\"wl wl-kjv\" data-code=\"H7409\">mules,</span> <span class=\"wl wl-kjv\" data-code=\"H327\">camels,</span> and <span class=\"wl wl-kjv\" data-code=\"H1121\">young</span> dromedaries:","11":"Wherein the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">granted</span> the <span class=\"wl wl-kjv\" data-code=\"H3064\">Jews</span> which were in every <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> to gather themselves <span class=\"wl wl-kjv\" data-code=\"H6950\">together,</span> and to <span class=\"wl wl-kjv\" data-code=\"H5975\">stand</span> for their <span class=\"wl wl-kjv\" data-code=\"H5315\">life,</span> to <span class=\"wl wl-kjv\" data-code=\"H8045\">destroy,</span> to <span class=\"wl wl-kjv\" data-code=\"H2026\">slay,</span> and to cause to <span class=\"wl wl-kjv\" data-code=\"H6\">perish,</span> all the <span class=\"wl wl-kjv\" data-code=\"H2428\">power</span> of the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> and <span class=\"wl wl-kjv\" data-code=\"H4082\">province</span> that would <span class=\"wl wl-kjv\" data-code=\"H6696\">assault</span> them, both little <span class=\"wl wl-kjv\" data-code=\"H2945\">ones</span> and <span class=\"wl wl-kjv\" data-code=\"H802\">women,</span> and to take the <span class=\"wl wl-kjv\" data-code=\"H7998\">spoil</span> of them for a prey,","12":"Upon <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> in all the <span class=\"wl wl-kjv\" data-code=\"H4082\">provinces</span> of <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H325\">Ahasuerus,</span> namely, upon the <span class=\"wl wl-kjv\" data-code=\"H7969\">thirteenth</span> day of the <span class=\"wl wl-kjv\" data-code=\"H8147\">twelfth</span> <span class=\"wl wl-kjv\" data-code=\"H2320\">month,</span> which is the <span class=\"wl wl-kjv\" data-code=\"H2320\">month</span> Adar.","13":"The <span class=\"wl wl-kjv\" data-code=\"H6572\">copy</span> of the <span class=\"wl wl-kjv\" data-code=\"H3791\">writing</span> for a <span class=\"wl wl-kjv\" data-code=\"H1881\">commandment</span> to be <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> in every <span class=\"wl wl-kjv\" data-code=\"H4082\">province</span> was <span class=\"wl wl-kjv\" data-code=\"H1540\">published</span> unto all <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> and that the <span class=\"wl wl-kjv\" data-code=\"H3064\">Jews</span> should be <span class=\"wl wl-kjv\" data-code=\"H6264\">ready</span> against that <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> to <span class=\"wl wl-kjv\" data-code=\"H5358\">avenge</span> themselves on their enemies.","14":"So the <span class=\"wl wl-kjv\" data-code=\"H7323\">posts</span> that <span class=\"wl wl-kjv\" data-code=\"H7392\">rode</span> upon <span class=\"wl wl-kjv\" data-code=\"H7409\">mules</span> and <span class=\"wl wl-kjv\" data-code=\"H327\">camels</span> went <span class=\"wl wl-kjv\" data-code=\"H3318\">out,</span> being <span class=\"wl wl-kjv\" data-code=\"H926\">hastened</span> and pressed <span class=\"wl wl-kjv\" data-code=\"H1765\">on</span> by the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H1697\">commandment.</span> And the <span class=\"wl wl-kjv\" data-code=\"H1881\">decree</span> was <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> at <span class=\"wl wl-kjv\" data-code=\"H7800\">Shushan</span> the palace.","15":"And <span class=\"wl wl-kjv\" data-code=\"H4782\">Mordecai</span> went <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> from the <span class=\"wl wl-kjv\" data-code=\"H6440\">presence</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> in <span class=\"wl wl-kjv\" data-code=\"H4438\">royal</span> <span class=\"wl wl-kjv\" data-code=\"H3830\">apparel</span> of <span class=\"wl wl-kjv\" data-code=\"H8504\">blue</span> and <span class=\"wl wl-kjv\" data-code=\"H2353\">white,</span> and with a <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H5850\">crown</span> of <span class=\"wl wl-kjv\" data-code=\"H2091\">gold,</span> and with a <span class=\"wl wl-kjv\" data-code=\"H8509\">garment</span> of fine <span class=\"wl wl-kjv\" data-code=\"H948\">linen</span> and <span class=\"wl wl-kjv\" data-code=\"H713\">purple:</span> and the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> of <span class=\"wl wl-kjv\" data-code=\"H7800\">Shushan</span> <span class=\"wl wl-kjv\" data-code=\"H6670\">rejoiced</span> and was glad.","16":"The <span class=\"wl wl-kjv\" data-code=\"H3064\">Jews</span> had <span class=\"wl wl-kjv\" data-code=\"H219\">light,</span> and <span class=\"wl wl-kjv\" data-code=\"H8057\">gladness,</span> and <span class=\"wl wl-kjv\" data-code=\"H8342\">joy,</span> and honour.","17":"And in every <span class=\"wl wl-kjv\" data-code=\"H4082\">province,</span> and in every <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> <span class=\"wl wl-kjv\" data-code=\"H4725\">whithersoever</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H1697\">commandment</span> and his <span class=\"wl wl-kjv\" data-code=\"H1881\">decree</span> <span class=\"wl wl-kjv\" data-code=\"H5060\">came,</span> the <span class=\"wl wl-kjv\" data-code=\"H3064\">Jews</span> had <span class=\"wl wl-kjv\" data-code=\"H8057\">joy</span> and <span class=\"wl wl-kjv\" data-code=\"H8342\">gladness,</span> a <span class=\"wl wl-kjv\" data-code=\"H4960\">feast</span> and a <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day.</span> And <span class=\"wl wl-kjv\" data-code=\"H7227\">many</span> of the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> became <span class=\"wl wl-kjv\" data-code=\"H3054\">Jews;</span> for the <span class=\"wl wl-kjv\" data-code=\"H6343\">fear</span> of the <span class=\"wl wl-kjv\" data-code=\"H3064\">Jews</span> fell"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"dienzelfden dage","tekst":"Te weten, toen Haman gehangen was."},{"catchword":"het huis van Haman,","tekst":"Te weten, met zijn toebehoren."},{"catchword":"kwam voor het aangezicht des konings,","tekst":"Dat is, hij werd aangenomen in het getal der vorsten, die dagelijks bij den konig kwamen en zijn aangezicht mocht aangeschouwen. Zie boven, Est 1:14 ."},{"catchword":"had te kennen gegeven,","tekst":"Te weten, den koning."},{"catchword":"wat hij voor haar was","tekst":"Dat is, hoe na zij elkander bestonden. Zie Est 2:7 ."}],"2":[{"catchword":"dien hij","tekst":"Zie boven, Est 3:10 , en de aantekening Gen 41:42 ."},{"catchword":"gaf hem aan Mórdechaï;","tekst":"Indachtig zijnde wat getrouwheid Mordechai aan hem bewezen had. Zie boven, Est 6:2 ."}],"3":[{"catchword":"sprak verder","tekst":"Te weten, toen nu Haman gehangen was. Zie boven, Est 7:9 ."},{"catchword":"voor zijn voeten,","tekst":"Hebreeuws, voor het aangezicht zijner voeten."},{"catchword":"de boosheid van Haman,","tekst":"Dat is, het plakkaat van het uitroeien der Joden, hetwelk op raad en boos ingeven van Haman gepubliceerd was."}],"4":[{"catchword":"reikte","tekst":"Daarmede te kennen gevende zijn genade en gunst tot haar. Zie boven, Est 4:11 , en Est 5:2 . Het schijnt dat de koning tegelijk Esther te kennen gaf dat zij zou opstaan en zeggen wat haar begeerte was."}],"5":[{"catchword":"deze zaak","tekst":"Of, dit woord."},{"catchword":"voor den koning recht is,","tekst":"Hebreeuws, voor het aangezicht des konings."},{"catchword":"aangenaam ben,","tekst":"Hebreeuws, goed."},{"catchword":"dat er geschreven worde,","tekst":"Te weten, aan de vorsten en oversten."},{"catchword":"en de gedachte van Haman,","tekst":"Dat is, het boos voornemen van Haman. Zie vs.3."}],"6":[{"catchword":"hoe zal ik vermogen,","tekst":"Hebreeuws, hoe zal ik kunnen en zien in het kwaad, en alzo straks weder. Alsof hij zeide: Ik zal het van hartzeer niet kunnen zien."},{"catchword":"treffen zal?","tekst":"Hebreeuws, vinden."}],"7":[{"catchword":"het huis van Haman","tekst":"Zie boven, vs.1,2."},{"catchword":"de galg gehangen,","tekst":"Te weten, aan die galg, die hij had doen oprichten om Mordechai daaraan te hangen."},{"catchword":"geslagen had","tekst":"Dat is, meende te leggen; de wil wordt genomen voor de daad."}],"8":[{"catchword":"Schrijft dan","tekst":"Te weten, aan de oversten en aan de vorsten der landschappen."},{"catchword":"in des konings naam,","tekst":"Dat is, in mijn naam."},{"catchword":"met des konings ring;","tekst":"Dat is, met mijn ring."},{"catchword":"want het schrift,","tekst":"Anders, maar."},{"catchword":"is niet te wederroepen","tekst":"Vergelijk Dan 6:9 , Dan 6:13 , Dan 6:16 ."}],"9":[{"catchword":"de maand Sivan","tekst":"Deze maand komt overeen ten dele met onze Mei, ten dele met Juni."}],"10":[{"catchword":"lopers te paard,","tekst":"Hebreeuws, der lopers op paarden."},{"catchword":"op snelle kemelen,","tekst":"Of op dromedarissen, een soort van zeer snelle kamelen. Zie 1Ki 4:28 ."},{"catchword":"op muildieren,","tekst":"Anders, [namelijk] de Koninklijke postboden, die van postboden geboren waren. Het schijnt da het postambt van de ouders op de kinderen erfde."}],"11":[{"catchword":"toeliet,","tekst":"Hebreeuws, gaf; dat is, toeliet, gelijk Psa 16:10 ."},{"catchword":"in elke stad waren,","tekst":"Hebreeuws, in alle stad en stad; alzo ook vs.17."},{"catchword":"voor hun leven te staan,","tekst":"Dat is, hun leven te verdedigen en voor hun leven te strijden; gelijk Psa 94:16 ."},{"catchword":"benauwen zou,","tekst":"Of, vijandiglijk aanvallen zouden."},{"catchword":"hun buit te roven;","tekst":"Dat is, hun goederen, welke den Joden tot buit gegeven werden. Zie boven, Est 3:13 ."}],"12":[{"catchword":"Op een dag","tekst":"Te weten, op denzelfden dag, op welken Haman had voorgenomen de Joden uit te roeien. Zie boven, Est 3:13 ."},{"catchword":"de maand Adar","tekst":"Zie boven, Est 3:7 ."}],"13":[{"catchword":"De inhoud van dit schrift was","tekst":"Of, copie."},{"catchword":"gereed zouden zijn","tekst":"Of, toegerust en vaardig zijn zouden."}],"14":[{"catchword":"De lopers,","tekst":"Te weten, de koninklijke postboden."},{"catchword":"werd gegeven","tekst":"Dat is, aangeslagen, of gepubliceerd."}],"15":[{"catchword":"een grote gouden kroon,","tekst":"Gelijk de grote heren bij de Perzen gewoon waren te dragen."},{"catchword":"de stad Susan juichte","tekst":"Versta hier, voornamelijk de Joden, die te Susan waren; doch ook wel verscheidenen onder de Perzen en Meden, die geen welgevallen hadden aan die gruwelijke bloedstorting, die Haman voorhad."}],"16":[{"catchword":"licht,","tekst":"Gelijk het licht der zon de ogen der mensen verklaart en hun hart verlicht, verheugt en verblijdt; alzo verlichtte en verheugde dat plakkaat des konings de harten der Joden. Zie Job 18:5-6 , en Psa 27:1 ."}],"17":[{"catchword":"in alle en een ieder landschap,","tekst":"Hebreeuws, in alle landschap en landschap, en in alle stad en stad."},{"catchword":"vrolijke dagen;","tekst":"Hebreeuws, goede."},{"catchword":"uit de volken des lands","tekst":"Dat is, uit het gemene volk."},{"catchword":"werden Joden,","tekst":"Dat is, zij namen de Joodse religie aan, zich latende besnijden, en zij vervoegden zich bij de Joden, wordende alzo Jodengenoten."},{"catchword":"de vreze der Joden","tekst":"Dit is, zij waren voor de Joden bevreesd."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"On that day [To wit, when Haman was hanged] did the king Ahasueros give the house of Haman, [to wit, with its appurtenances] the Jews Enemy, unto Esther the Queen: And Mordechai came before face of the king, [that is, he was assumed in to the number of the Princes, that daily came before the King, and might behold his face. See above chap.1.14.] for Esther had made known [to wit, to the King] what he was unto her. [that is, how near of kin they were one to another. See ch.2.7.]"}],"2":[{"catchword":null,"tekst":"And the king pluck off his ring, which he had taken from Haman, [See above chap.3.10. and the annotate. On Gen 41:42.] and gave it unto Mordechai: [calling to mind what faithfulness Mordechai had shewed unto him. See above chap.6.2.] and Esther set Mordechai over the house of Haman."}],"3":[{"catchword":null,"tekst":"And Esther spake further before the face of the king, [To wit, when Haman was hanged] and she fell (down) before his feet: [Hebr. before the face of his feet] and she wept, and she besought him, to put away the malice of Haman the Agagite [that is, the decree concerning the destroying of the Jews, which was published by the advice and wicked motion of Haman] and his device, that he had devised against the Jews."}],"4":[{"catchword":null,"tekst":"Now the king reached forth the golden sceptre towards Esther: [Intimating thereby, his grace and favour toward her. See above cha.4.1. and 5.2.] then Esther rose up, and she stood before the face of the king, [it seemeth that the king did likewise intimate unto Esther, that she should rise up, and tell what her desire was.]"}],"5":[{"catchword":null,"tekst":"And she said, if it seem good unto the king, and if I have found grace before his face, and this thing [Or, this word] be right before the king, [Hebr. before the face of the king] and I be acceptable [Hebr. good] in his eyes: Let it be written, [to wit, to the Princes and chief Commanders] that the letters and the device of Haman, [that is, the wicked plot of Haman. See verse 3.] the son of Hamedatha the Agagite, may be reversed, which he wrote, to destroy the Jews, which are in all the kings countries."}],"6":[{"catchword":null,"tekst":"For how shall I be able to see the evil [Hebr. how shall I be able to see into the evil; and so forthwith again. As if she had said, I shall not be able to see it for grief of heart] that shall hit [Hebr. find] my people? And how shall I be able to see the destruction of my kindred?"}],"7":[{"catchword":null,"tekst":"Then the king Ahasueros said unto Esther the Queen and to Mordechai the Jew; behold, I have given Esther the house of Haman, [See above v.1. and v.2.] and him they have hanged upon the gallowes, [to wit, on the gallowes which he had caused to be set up, to hang Mordechai thereon] because he had laid his hand [that is, intended to lay his hand: the will is here taken for the deed] upon the Jews."}],"8":[{"catchword":null,"tekst":"Write ye then [To wit, unto the Rulers, and to the Princes of the countries] for the Jews, so as it is good in your eyes, in the kings name, [that is, in my name] and sealt it with the kings ring: [that is, with my ring] for [oth. but] the writing which is writ in the kings name, and sealed with the kings ring, is not to be reversed. [compare Dan.6.8,12,15.]"}],"9":[{"catchword":null,"tekst":"Then were the kings Scribes called at that time in the third month (it is the month Sivan) [This month agreeth partly with our May, and partly with our June] on the three and twentieth (day) thereof, and there was written, according to as all that Mordechai commanded, unto the Jews, and to the Lieutenants, and Governors of the Countries, [as above Chapter 3. Verse 12.] which (reach) from India unto Ethiopia, [see above chapter 1.1.] an hundred and seven and twenty countries, every country [Hebr. country and country] according to the writing thereof, and every people [Hebr. people and people] after their langu const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"
const ZELF = D.meta.zelf_abbr;      // afkorting binnen dit hoofdstuk, bv. "Joh 3"
const BASIS_URL = D.meta.basis_url;
const PARALLEL_VOLGORDE = ['SVnu', 'SV', 'KJV'];
let vertaling = 'SVnu';
let openVers = null;

const bijbel = document.getElementById('bijbel');
const popup = document.getElementById('popup');
const toast = document.getElementById('toast');
const nummers = Object.keys(D.vertalingen.SVnu);

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    const inhoud = lijst.map(it => it.catchword
      ? `<div class="uitleg-item"><span class="uitleg-cw">${md(it.catchword)}</span>${md(it.tekst)}</div>`
      : `<div class="uitleg-item">${md(it.tekst)}</div>`
    ).join('');
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
