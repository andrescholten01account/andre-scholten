: {"Gen": "genesis", "Ex": "exodus", "Lev": "leviticus", "Num": "numeri", "Deut": "deuteronomium", "Joz": "jozua", "Richt": "richteren", "Ruth": "ruth", "1 Sam": "1-samuel", "2 Sam": "2-samuel", "1 Kon": "1-koningen", "2 Kon": "2-koningen", "1 Kron": "1-kronieken", "2 Kron": "2-kronieken", "Ezra": "ezra", "Neh": "nehemia", "Est": "esther", "Job": "job", "Ps": "psalmen", "Spr": "spreuken", "Pred": "prediker", "Hoogl": "hooglied", "Jes": "jesaja", "Jer": "jeremia", "Klaagl": "klaagliederen", "Ezech": "ezechiel", "Dan": "daniel", "Hos": "hosea", "Joël": "joel", "Amos": "amos", "Obadja": "obadja", "Jona": "jona", "Micha": "micha", "Nahum": "nahum", "Hab": "habakuk", "Zef": "zefanja", "Hagg": "haggai", "Zach": "zacharia", "Mal": "maleachi", "Matt": "mattheus", "Mark": "markus", "Luk": "lukas", "Joh": "johannes", "Hand": "handelingen", "Rom": "romeinen", "1 Kor": "1-korinthe", "2 Kor": "2-korinthe", "Gal": "galaten", "Ef": "efeze", "Fil": "filippenzen", "Kol": "kolossenzen", "1 Tess": "1-thessalonicenzen", "2 Tess": "2-thessalonicenzen", "1 Tim": "1-timotheus", "2 Tim": "2-timotheus", "Tit": "titus", "Filem": "filemon", "Hebr": "hebreeen", "Jak": "jakobus", "1 Petr": "1-petrus", "2 Petr": "2-petrus", "1 Joh": "1-johannes", "2 Joh": "2-johannes", "3 Joh": "3-johannes", "Judas": "judas", "Openb": "openbaring"}}, "vertalingen": {"SVnu": {"1": "Op dezelfde dag gaf de koning Ahasveros aan koningin Esther het huis van Haman, de vijand van de Joden; en Mordechai kwam voor de koning, want Esther had bekendgemaakt wat hij voor haar was.", "2": "En de koning trok zijn ring af, die hij van Haman had afgenomen, en gaf hem aan Mordechai; en Esther stelde Mordechai aan over het huis van Haman.", "3": "En Esther sprak verder voor de koning, en zij viel voor zijn voeten, en zij weende, en zij smeekte hem, dat hij de boosheid van Haman, de Agagiet, en zijn plan, dat hij tegen de Joden bedacht had, zou wegnemen.", "4": "De koning nu reikte de gouden scepter naar Esther uit. Toen stond Esther op, en zij bleef staan voor de koning.", "5": "En zij zei: Als het de koning goeddunkt, en als ik genade voor zijn ogen gevonden heb, en deze zaak voor de koning juist is, en ik in zijn ogen aangenaam ben, laat er dan geschreven worden dat de brieven en het plan van Haman, de zoon van Hammedatha, de Agagiet, teruggeroepen worden, welke hij geschreven heeft om de Joden om te brengen, die in alle landschappen van de koning zijn.", "6": "Want hoe zou ik het kunnen verdragen dat ik het kwaad aanzie, dat mijn volk zal treffen? En hoe zou ik het kunnen verdragen dat ik het verderf van mijn geslacht aanzie?", "7": "Toen zei de koning Ahasveros tegen koningin Esther en tegen Mordechai, de Jood: Zie, het huis van Haman heb ik aan Esther gegeven, en hem heeft men aan de galg gehangen, omdat hij zijn hand tegen de Joden had opgeheven.", "8": "Schrijft u dan voor de Joden, zoals het goed is in uw ogen, in de naam van de koning, en verzegelt het met de ring van de koning; want het geschrift, dat in de naam van de koning geschreven, en met de ring van de koning verzegeld is, kan door niemand teruggeroepen worden.", "9": "Toen werden de schrijvers van de koning geroepen, op datzelfde moment, in de derde maand (dat is de maand Sivan), op de drieëntwintigste daarvan, en er werd geschreven naar alles wat Mordechai gebood, aan de Joden, en aan de stadhouders, en landvoogden, en leiders van de landschappen, die van Indië af tot aan Morenland reiken, honderdzevenentwintig landschappen, ieder landschap naar zijn eigen schrift, ieder volk naar zijn eigen taal; ook aan de Joden naar hun schrift en naar hun taal.", "10": "En men schreef in de naam van koning Ahasveros, en men verzegelde het met de ring van de koning; en men zond de brieven door de hand van de lopers te paard, die reden op snelle kamelen, op muildieren, geteeld uit merries;", "11": "Dat de koning aan de Joden, die in elke stad waren, toestond zich te verzamelen, en op te komen voor hun leven, om te verdelgen, om te doden en om om te brengen alle macht van het volk en van het landschap, die hen benauwen zou, de kleine kinderen en de vrouwen, en hun buit te roven;", "12": "Op één dag in alle landschappen van koning Ahasveros, op de dertiende van de twaalfde maand; dat is de maand Adar.", "13": "De inhoud van dit geschrift was: dat er een wet zou worden gegeven in alle landschappen, openbaar bekendgemaakt aan alle volken; en dat de Joden gereed zouden zijn tegen die dag, om zich te wreken op hun vijanden.", "14": "De lopers, die op snelle kamelen reden *en* op muildieren, trokken snel uit, aangedreven door het woord van de koning. Deze wet nu werd gegeven op de burg Susan.", "15": "En Mordechai ging weg van voor de koning in een hemelsblauw en wit koninklijk kleed, en met een grote gouden kroon, en met een overkleed van fijn linnen en purper; en de stad Susan juichte en was vrolijk.", "16": "Bij de Joden was licht, en blijdschap, en vreugde, en eer;", "17": "Ook in elk landschap, en in elke stad, op elke plaats waar het woord van de koning en zijn wet aankwam, daar was bij de Joden blijdschap en vreugde, maaltijden en vrolijke dagen; en velen uit de volken van het land werden Joden, want de vreze voor de Joden was op hen gevallen."}, "SV": {"1": "Te dienzelfden dage gaf de koning Ahasveros aan de koningin Esther het huis van Haman, den vijand der Joden; en Mordechai kwam voor het aangezicht des konings, want Esther had te kennen gegeven, wat hij voor haar was.", "2": "En de koning toog zijn ring af, dien hij van Haman genomen had, en gaf hem aan Mordechai; en Esther stelde Mordechai over het huis van Haman.", "3": "En Esther sprak verder voor het aangezicht des konings, en zij viel voor zijn voeten, en zij weende, en zij smeekte hem, dat hij de boosheid van Haman, den Agagiet, en zijn gedachte, die hij tegen de Joden gedacht had, zou wegnemen.", "4": "De koning nu reikte den gouden scepter Esther toe. Toen rees Esther op, en zij stond voor het aangezicht des konings.", "5": "En zij zeide: Indien het den koning goeddunkt, en indien ik genade voor zijn aangezicht gevonden heb, en deze zaak voor den koning recht is, en ik in zijn ogen aangenaam ben, dat er geschreven worde, dat de brieven en de gedachte van Haman, den zoon van Hammedatha, den Agagiet, wederroepen worden, welke hij geschreven heeft, om de Joden om te brengen, die in al de landschappen des konings zijn.", "6": "Want hoe zal ik vermogen, dat ik aanzie het kwaad, dat mijn volk treffen zal? En hoe zal ik vermogen, dat ik aanzie het verderf van mijn geslacht?", "7": "Toen zeide de koning Ahasveros tot de koningin Esther en tot Mordechai, den Jood: Ziet, het huis van Haman heb ik Esther gegeven, en hem heeft men aan de galg gehangen, omdat hij zijn hand aan de Joden geslagen had.", "8": "Schrijft dan gijlieden voor de Joden, zoals het goed is in uw ogen, in des konings naam, en verzegelt het met des konings ring; want het schrift, dat in des konings naam geschreven, en met des konings ring verzegeld is, is niet te wederroepen.", "9": "Toen werden des konings schrijvers geroepen, ter zelfder tijd, in de derde maand ( zij is de maand Sivan), op den drie en twintigsten derzelve, en er werd geschreven naar alles, wat Mordechai gebood, aan de Joden, en aan de stadhouders, en landvoogden, en oversten der landschappen, die van Indië af tot aan Morenland *strekken*, honderd zeven en twintig landschappen, een ieder landschap naar zijn schrift, een ieder volk naar zijn spraak; ook aan de Joden naar hun schrift en naar hun spraak.", "10": "En men schreef in den naam van den koning Ahasveros, en men verzegelde het met des konings ring; en men zond de brieven door de hand der lopers te paard, rijdende op snelle kemelen, op muildieren, van merrien geteeld;", "11": "Dat de koning den Joden toeliet, die in elke stad waren, zich te vergaderen, en voor hun leven te staan, om te verdelgen, om te doden en om om te brengen alle macht des volks en des landschaps, die hen benauwen zou, de kleine kinderen en de vrouwen, en hun buit te roven;", "12": "Op een dag in al de landschappen van den koning Ahasveros, op den dertienden der twaalfde maand; deze is de maand Adar.", "13": "De inhoud van dit geschrift was: dat een wet zou gegeven worden in alle landschappen, openbaar aan alle volken; en dat de Joden gereed zouden zijn tegen dien dag, om zich te wreken aan hun vijanden.", "14": "De lopers, die op snelle kemelen reden *en* op muildieren, togen snellijk uit, aangedreven zijnde door het woord des konings. Deze wet nu werd gegeven op den burg Susan.", "15": "En Mordechai ging uit van voor het aangezicht des konings in een hemelsblauw en wit koninklijk kleed, en met een grote gouden kroon, en met een opperkleed van fijn linnen en purper; en de stad Susan juichte en was vrolijk.", "16": "Bij de Joden was licht, en blijdschap, en vreugde, en eer;", "17": "Ook in alle en een ieder landschap, en in alle en een iedere stad, ter plaatse, waar des konings woord en zijn wet aankwam, daar was bij de Joden blijdschap en vreugde, maaltijden en vrolijke dagen; en velen uit de volken des lands werden Joden, want de vreze der Joden was op hen gevallen."}, "KJV": {"1": "On that day did the king Ahasuerus give the house of Haman the Jews' enemy unto Esther the queen. And Mordecai came before the king; for Esther had told", "2": "And the king took off his ring, which he had taken from Haman, and gave it unto Mordecai. And Esther set Mordecai over the house of Haman.", "3": "And Esther spake yet again before the king, and fell down at his feet, and besought him with tears to put away the mischief of Haman the Agagite, and his device that he had devised against the Jews.", "4": "Then the king held out the golden sceptre toward Esther. So Esther arose, and stood before the king,", "5": "And said, If it please the king, and if I have found favour in his sight, and the thing *seem* right before the king, and I *be* pleasing in his eyes, let it be written to reverse the letters devised by Haman the son of Hammedatha the Agagite, which he wrote to destroy the Jews which *are* in all the king's provinces:", "6": "For how can I endure to see the evil that shall come unto my people? or how can I endure to see the destruction of my kindred?", "7": "Then the king Ahasuerus said unto Esther the queen and to Mordecai the Jew, Behold, I have given Esther the house of Haman, and him they have hanged upon the gallows, because he laid his hand upon the Jews.", "8": "Write ye also for the Jews, as it liketh you, in the king's name, and seal *it* with the king's ring: for the writing which is written in the king's name, and sealed with the king's ring, may no man reverse.", "9": "Then were the king's scribes called at that time in the third month, that *is*, the month Sivan, on the three and twentieth *day* thereof; and it was written according to all that Mordecai commanded unto the Jews, and to the lieutenants, and the deputies and rulers of the provinces which *are* from India unto Ethiopia, an hundred twenty and seven provinces, unto every province according to the writing thereof, and unto every people after their language, and to the Jews according to their writing, and according to their language.", "10": "And he wrote in the king Ahasuerus' name, and sealed *it* with the king's ring, and sent letters by posts on horseback, *and* riders on mules, camels, *and* young dromedaries:", "11": "Wherein the king granted the Jews which *were* in every city to gather themselves together, and to stand for their life, to destroy, to slay, and to cause to perish, all the power of the people and province that would assault them, *both* little ones and women, and *to take* the spoil of them for a prey,", "12": "Upon one day in all the provinces of king Ahasuerus, *namely*, upon the thirteenth *day* of the twelfth month, which *is* the month Adar.", "13": "The copy of the writing for a commandment to be given in every province *was* published unto all people, and that the Jews should be ready against that day to avenge themselves on their enemies.", "14": "*So* the posts that rode upon mules *and* camels went out, being hastened and pressed on by the king's commandment. And the decree was given at Shushan the palace.", "15": "And Mordecai went out from the presence of the king in royal apparel of blue and white, and with a great crown of gold, and with a garment of fine linen and purple: and the city of Shushan rejoiced and was glad.", "16": "The Jews had light, and gladness, and joy, and honour.", "17": "And in every province, and in every city, whithersoever the king's commandment and his decree came, the Jews had joy and gladness, a feast and a good day. And many of the people of the land became Jews; for the fear of the Jews fell"}}, "tsk": {"1": [{"kopje": "gaf het huis", "refs": ["Job 27:16", "Job 27:17", "Ps 39:7", "Ps 49:7-14", "Spr 13:22", "Spr 28:8", "Pred 2:18", "Pred 2:19", "Luk 12:20"]}, {"kopje": "kwam voor", "refs": ["Est 1:14", "Est 2:7", "Est 2:15"]}], "2": [{"kopje": "zijn ring", "refs": ["Est 3:10", "Gen 41:42", "Jes 22:19-22", "Luk 15:22"]}, {"kopje": "stelde", "refs": ["2 Sam 9:7-10", "Ps 37:34", "Pred 2:18", "Pred 2:19-26", "Pred 5:12", "Pred 5:13", "Dan 2:48"]}], "3": [{"kopje": "viel", "refs": ["1 Sam 25:24", "2 Kon 4:27"]}, {"kopje": "weende, en zij smeekte hem", "refs": ["Jes 38:2", "Hos 12:5", "Hebr 5:7"]}, {"kopje": "boosheid", "refs": ["Est 3:8-15", "Est 7:4"]}], "4": [{"kopje": "reikte uit", "refs": ["Est 4:11", "Est 5:2"]}], "5": [{"kopje": "als ik", "refs": ["Est 7:3", "Ex 33:13", "Ex 33:16", "1 Sam 20:29"]}, {"kopje": "aangenaam ben", "refs": ["Est 2:4", "Est 2:17"]}, {"kopje": "brieven", "refs": ["Est 3:12", "Est 3:13"]}], "6": [{"kopje": "Want hoe", "refs": ["Gen 44:34", "Jer 4:19", "Jer 9:1", "Luk 19:41", "Luk 19:42", "Rom 9:2", "Rom 9:3", "Rom 10:1"]}, {"kopje": "het kwaad", "refs": ["Est 7:4", "Neh 2:3"]}], "7": [{"kopje": "Zie", "refs": ["Est 8:1", "Spr 13:22"]}, {"kopje": "heeft men aan de galg gehangen" 8:17", "svLabel": null}, {"disp": "Est 9:17-19", "href": "../../esther/9/#v17", "ref": "Est 9:17-19", "svLabel": null}], "kinderen": []}]}]}, {"topic": "Proselytes", "href": "../../torrey/p/#t-proselytes", "kinderen": [{"label": "Described", "href": "../../torrey/p/?hl=Esth.8.17#i16587", "refs": [{"disp": "Est 8:17", "href": "../../esther/8/#v17", "ref": "Est 8:17", "svLabel": null}, {"disp": "Jes 56:3", "href": "../../jesaja/56/#v3", "ref": "Jes 56:3", "svLabel": null}], "kinderen": []}]}]}}, "extern": {"Pred 9:10": "Alles wat uw hand vindt om te doen, doe dat met al uw kracht; want er is geen werk, geen overleg, geen kennis en geen wijsheid in het graf, waar u heengaat.", "2 Tim 2:19": "Toch staat het vaste fundament van God, met dit zegel: De Heere kent hen die van Hem zijn; en: Ieder die de Naam van Christus noemt, moet afstand nemen van ongerechtigheid.", "Est 9:22": "naar de dagen waarop de Joden tot rust gekomen waren van hun vijanden, en de maand die voor hen veranderd was van droefheid in blijdschap, en van rouw in een vrolijke dag; dat zij die dagen zouden maken tot dagen van maaltijden en vreugde, en van het zenden van gedeelten aan elkaar, en van gaven aan de armen.", "Est 1:5": "Toen die dagen voorbij waren, gaf de koning een maaltijd voor heel het volk dat zich op de burcht Susan bevond, van de grootste tot de kleinste, zeven dagen lang, in het voorhof van de tuin van het koninklijk paleis.", "1 Kon 1:16": "En Bathseba boog haar hoofd en boog zich neer voor de koning; en de koning zei: Wat wilt u?", "Est 2:3": "En de koning stelt toezieners aan in alle landschappen van zijn koninkrijk, dat zij alle jonge dochters, maagden, mooi van uiterlijk, bijeenbrengen naar de burg Susan, naar het huis van de vrouwen, onder de hand van Hegai, de kamerling van de koning, bewaarder van de vrouwen; en men geeft haar haar schoonheidsmiddelen.", "Pred 2:19": "Want wie weet of hij wijs zal zijn of dwaas? Toch zal hij heersen over al mijn arbeid, die ik met inspanning verricht heb en waarin ik mij wijs heb betoond onder de zon. Dat is ook ijdelheid.", "Luk 12:20": "Maar God zei tegen hem: Jij dwaas! Nog deze nacht zal men uw ziel van u opeisen; en wat u hebt klaargemaakt, van wie zal het dan zijn?", "Est 3:8-15": "Want Haman had tegen de koning Ahasveros gezegd: Er is een volk, verstrooid en verspreid onder de volken in alle landschappen van uw koninkrijk; en hun wetten zijn anders dan die van alle volken; ook houden zij zich niet aan de wetten van de koning; daarom is het voor de koning niet goed hen te laten blijven. Als het de koning goeddunkt, laat er geschreven worden dat men hen ombrengt; dan zal ik tienduizend talenten zilver opwegen in de handen van hen die het werk doen, om het in de schatten van de koning te brengen. Toen trok de koning zijn ring van zijn hand, en hij gaf hem aan Haman, de zoon van Hammedatha, de Agagiet, de tegenstander van de Joden.", "Ps 92:12": "En mijn oog zal mijn belagers aanschouwen; mijn oren zullen het horen, aangaande de boosdoeners die tegen mij opstaan.", "Spr 11:10": "Een stad springt op van vreugde over het welvaren van de rechtvaardigen; en als de goddelozen vergaan, is er gejuich.", "1 Kor 14:9-11": "Zo ook u: als u niet door de taal een duidelijk woord spreekt, hoe zal verstaan worden wat gesproken wordt? Want u zult zijn als iemand die in de lucht spreekt. Er zijn, naar het voorvalt, zoveel soorten van stemmen in de wereld, en geen daarvan is zonder betekenis. Als ik dan de betekenis van de stem niet ken, zal ik voor hem die spreekt een vreemdeling zijn; en hij die spreekt, zal voor mij een vreemdeling zijn.", "Gen 18:2": "En hij hief zijn ogen op en keek; en zie, daar stonden drie mannen tegenover hem; toen hij hen zag, liep hij hun tegemoet vanuit de deur van de tent, en boog zich tot op de grond.", "Luk 16:19": "En er was een zeker rijk mens, en die was gekleed met purper en zeer fijn linnen, en leefde elke dag vrolijk en overvloedig.", "Luk 8:41": "En zie, er kwam een man, van wie de naam Jaïrus was, en hij was een leider van de synagoge; en hij viel aan de voeten van Jezus en smeekte Hem naar zijn huis te komen.", "Zach 6:11": "Namelijk, neem zilver en goud, en maak kronen; en zet ze op het hoofd van Jozua, de zoon van Jozadak, de hogepriester.", "Est 1:3": "in het derde jaar van zijn regering, dat hij een maaltijd gaf voor al zijn vorsten en zijn knechten; de machthebbers van Perzië en Medië, de grootste heren en de leiders van de landschappen waren voor hem aanwezig.", "Richt 16:28": "Toen riep Simson tot de HEERE, en zei: Heere, HEERE! gedenk mij toch, en sterk mij toch alleen ditmaal, o God! dat ik mij met één wraak voor mijn twee ogen op de Filistijnen kan wreken.", "Est 10:3": "Want de Jood Mordechai was de tweede bij de koning Ahasveros, en groot bij de Joden, en aangenaam bij de menigte van zijn broeders, zoekend naar het beste voor zijn volk, en sprekend voor het welzijn van al zijn nageslacht.", "Pred 5:12": "Er is een kwaad dat ziekte veroorzaakt, dat ik heb gezien onder de zon: rijkdom die door zijn bezitters bewaard wordt tot hun eigen kwaad.", "Job 27:17": "Hij zal ze bereiden, maar de rechtvaardige zal ze aantrekken, en de onschuldige zal het zilver delen.", "Jes 38:2": "Toen keerde Hizkia zijn gezicht om naar de wand, en hij bad tot de HEERE.", "Ex 39:27": "Zij maakten ook de rokken van fijn linnen, van geweven werk, voor Aäron en voor zijn zonen;", "Ex 39:30": "Zij maakten ook de plaat van de heilige kroon van zuiver goud, en zij schreven daarop een schrift, gegraveerd zoals een zegel gegraveerd wordt: HEILIGHEID VAN DE HEERE.", "Deut 11:25": "Niemand zal voor uw aangezicht standhouden; de HEERE, uw God, zal de schrik en de vrees voor u geven over heel het land, waarop u treden zult, zoals Hij tot u gesproken heeft.", "Rom 9:2": "dat het mij een grote droefheid en mijn hart een aanhoudend verdriet is.", "Dan 8:2": "En ik zag een gezicht, (het gebeurde nu, toen ik het zag, dat ik in de burcht Susan was, die in het landschap Elam is) ik zag dan in een gezicht dat ik aan de rivier de Ulai was.", "Est 1:6": "Er waren witte, groene en hemelsblauwe behangsels, bevestigd met koorden van fijn linnen en purperen banden, aan zilveren ringen en aan marmeren pilaren; de bedsteden waren van goud en zilver, op een vloer van rode, en witte, en zwarte marmer, en albast, en kostbare stenen.", "Gal 3:13": "Christus heeft ons verlost van de vloek van de wet, doordat Hij voor ons een vloek geworden is; want er is geschreven: Vervloekt is ieder die aan het hout hangt.", "Gen 33:3": "En hij ging voor hen uit heen, en boog zich zeven keer ter aarde, totdat hij bij zijn broer kwam.", "2 Kon 4:37": "Zo kwam zij, en viel voor zijn voeten neer, en boog zich ter aarde, en zij nam haar zoon op, en ging naar buiten.", "Est 10:1-3": "Daarna legde de koning Ahasveros schatting op het land, en de eilanden van de zee. Al de daden van zijn macht en van zijn geweld, en de verklaring van de grootheid van Mordechai, aan wie de koning hem groot gemaakt heeft, zijn die niet geschreven in het boek van de kronieken van de koningen van Medië en Perzië? Want de Jood Mordechai was de tweede bij de koning Ahasveros, en groot bij de Joden, en aangenaam bij de menigte van zijn broeders, zoekend naar het beste voor zijn volk, en sprekend voor het welzijn van al zijn nageslacht.", "Est 1:19": "Als het de koning goeddunkt, laat er dan een koninklijk bevel van hem uitgaan, dat wordt opgeschreven in de wetten van de Perzen en de Meden, en dat niet overtreden mag worden: dat Vasthi niet meer voor het aangezicht van de koning Ahasveros mag komen, en dat de koning haar koningschap geeft aan haar naaste, die beter is dan zij.", "Ps 37:15": "Maar hun zwaard zal in hun eigen hart gaan; en hun bogen zullen verbroken worden.", "Est 1:2": "in die dagen, toen de koning Ahasveros op de troon van zijn koninkrijk zat, die op de burcht Susan was,", "Jes 60:6": "Een menigte kamelen zal u bedekken, de snelle kamelen van Midian en Hefa; zij allen uit Scheba zullen komen; goud en wierook zullen zij aanbrengen, en zij zullen de overvloedige lof van de HEERE verkondigen.", "Ps 97:11": "Het licht is gezaaid voor de rechtvaardige, en vrolijkheid voor de oprechten van hart.", "Pred 2:18": "Ik haatte ook al mijn arbeid die ik onder de zon verricht had, omdat ik die zou moeten achterlaten aan een mens die na mij komen zal.", "Ps 39:7": "Zeker, de mens wandelt als in een beeld, zeker, zij maken zich druk voor niets; men brengt bijeen, en men weet niet, wie het naar zich toe zal halen.", "Est 9:30": "En hij zond de brieven aan alle Joden, in de honderdzevenentwintig landschappen van het koninkrijk van Ahasveros, met woorden van vrede en trouw;", "2 Sam 20:26": "En ook was Ira, de Jaïriet, Davids opperofficier.", "Est 9:11": "Op diezelfde dag kwam het aantal gedoden op de burcht Susan bij de koning.", "Spr 13:22": "De goede zal zijn kindskinderen doen erven; maar het vermogen van de zondaar is voor de rechtvaardige weggelegd.", "Gen 35:5": "En zij reisden verder; en er kwam een schrik van God over de steden die rondom hen waren, zodat zij de zonen van Jakob niet achterna joegen.", "Ps 68:4": "Maar de rechtvaardigen zullen zich verblijden; zij zullen van vreugde opspringen voor Gods aangezicht, en van blijdschap vrolijk zijn.", "1 Kon 4:28": "De gerst nu en het stro voor de paarden, en voor de snelle kamelen, brachten zij naar de plaats waar hij was, ieder naar zijn taak.", "Est 3:10": "Toen trok de koning zijn ring van zijn hand, en hij gaf hem aan Haman, de zoon van Hammedatha, de Agagiet, de tegenstander van de Joden.", "Est 5:2": "En het gebeurde, toen de koning koningin Esther zag staan in het voorhof, dat zij genade vond in zijn ogen, zodat de koning de gouden scepter die in zijn hand was naar Esther uitstrekte; en Esther kwam dichterbij, en raakte de top van de scepter aan.", "Jes 35:10": "En de vrijgekochte van de HEERE zullen terugkeren, en naar Sion komen met gejuich, en eeuwige blijdschap zal op hun hoofd zijn; vrolijkheid en blijdschap zullen zij verkrijgen, maar droefenis en zuchten zullen wegvluchten.", "Ps 49:7-14": "Aangaande hen die op hun bezit vertrouwen, en op de overvloed van hun rijkdom roemen; niemand van hen zal zijn broeder ooit kunnen verlossen; hij zal aan God zijn losprijs niet kunnen geven; (want de verlossing van hun ziel is te kostbaar, en zal voor eeuwig ophouden);", "Est 3:13": "De brieven nu werden gezonden door de hand van de lopers naar alle landschappen van de koning, dat men zou uitroeien, doden en ombrengen alle Joden, van jong tot oud toe, de kleine kinderen en de vrouwen, op één dag, op de dertiende van de twaalfde maand (dat is de maand Adar), en dat men hun buit zou roven.", "Neh 2:3": "en ik zei tegen de koning: De koning leve in eeuwigheid! Hoe zou mijn gezicht niet treurig zijn, terwijl de stad, de plaats van de graven van mijn vaderen, verwoest is, en haar poorten met vuur verteerd zijn?", "Gen 41:43": "En hij liet hem rijden op de tweede wagen die hij had; en zij riepen voor hem uit: Kniel! Zo stelde hij hem over heel Egypteland.", "Richt 1:7": "Toen zei Adoni-bezek: Zeventig koningen, van wie de duimen van hun handen en voeten waren afgehouwen, verzamelden de kruimen onder mijn tafel; zoals ik gedaan heb, zo heeft God mij vergolden! En zij brachten hem naar Jeruzalem, en hij stierf daar.", "Est 9:2-16": "De Joden verzamelden zich in hun steden, in alle landschappen van koning Ahasveros, om de hand te slaan aan hen die hun verderf zochten; en niemand hield stand voor hen, want de schrik voor hen was op alle volken gevallen. En alle leiders van de landschappen, en de stadhouders, en de landvoogden, en zij die het werk van de koning deden, hielpen de Joden; want de vrees voor Mordechai was op hen gevallen. Want Mordechai was groot in het huis van de koning, en zijn faam ging uit door alle landschappen; want die man, Mordechai, werd steeds groter.", "Spr 4:18": "Maar het pad van de rechtvaardigen is als een schijnend licht, dat voortgaat en meer licht geeft tot de volle dag toe.", "Rom 10:1": "Broeders, de toegenegenheid van mijn hart en het gebed dat ik tot God doe voor Israël, is tot hun zaligheid.", "Est 6:11": "En Haman nam dat kleed en dat paard, en trok Mordechai het kleed aan, en liet hem rijden door de straten van de stad, en hij riep vóór hem uit: Zo zal men doen met de man aan wie de koning graag eer wil bewijzen!", "Est 3:15": "De lopers gingen uit, aangespoord door het woord van de koning, en de wet werd uitgegeven in de burcht Susan. En de koning en Haman gingen zitten om te drinken, doch de stad Susan was in verwarring.", "2 Sam 18:28": "Ahimaäz dan riep en zei tegen de koning: Vrede! En hij boog zich voor de koning met het gezicht ter aarde, en zei: Geloofd zij de HEERE, uw God, Die de mannen heeft overgegeven die hun hand tegen mijn heer de koning ophieven.", "Jes 66:20": "En zij zullen al uw broeders uit alle heidenen naar de HEERE brengen als spijsoffer, op paarden, en op wagens, en op draagstoelen, en op muildieren, en op snelle lopers, naar Mijn heilige berg toe, naar Jeruzalem, zegt de HEERE, zoals de kinderen van Israël het spijsoffer in een rein vat brengen naar het huis van de HEERE.", "Pred 2:19-26": "Want wie weet of hij wijs zal zijn of dwaas? Toch zal hij heersen over al mijn arbeid, die ik met inspanning verricht heb en waarin ik mij wijs heb betoond onder de zon. Dat is ook ijdelheid. Daarom keerde ik mij om, om mijn hart te laten wanhopen over al de arbeid die ik onder de zon verricht heb. Want er is een mens wiens arbeid in wijsheid, in kennis en in bekwaamheid bestaat; en toch zal hij die overdragen als zijn deel aan een mens die daar niet aan gewerkt heeft. Dit is ook ijdelheid en een groot kwaad.", "2 Kon 18:26": "Toen zei Eljakim, de zoon van Hilkia, en Sebna, en Joah tot Rabsake: Spreek toch tot uw knechten in het Syrisch, want wij verstaan het wel; en spreek met ons niet in het Joods, voor de oren van het volk, dat op de muur is.", "Ps 18:29": "Want U doet mijn lamp lichten; de HEERE, mijn God, doet mijn duisternis opklaren.", "2 Kon 9:17-19": "De wachter nu stond op de toren te Jizreël, en zag de troep van Jehu, toen hij aankwam, en zei: Ik zie een troep. Toen zei Joram: Neem een ruiter, en stuur die hun tegemoet, en laat hij zeggen: Is het vrede? En de ruiter te paard ging hem tegemoet, en zei: Zo zegt de koning: Is het vrede? En Jehu zei: Wat hebt u met de vrede te maken? Kom achter mij. En de wachter meldde het, en zei: De bode is bij hen gekomen, maar hij komt niet terug. Toen stuurde hij een tweede ruiter te paard; en toen deze bij hen gekomen was, zei hij: Zo zegt de koning: Is het vrede? En Jehu zei: Wat hebt u met de vrede te maken? Kom achter mij.", "Est 9:17-19": "Dit gebeurde op de dertiende dag van de maand Adar; en op de veertiende daarvan rustten zij, en zij maakten die tot een dag van maaltijden en vreugde. En de Joden die in Susan waren, verzamelden zich op de dertiende daarvan, en op de veertiende daarvan; en zij rustten op de vijftiende daarvan, en zij maakten die tot een dag van maaltijden en vreugde. Daarom maakten de Joden van de dorpen, die in de dorpsteden woonden, van de veertiende dag van de maand Adar een dag van vreugde en maaltijden, en een vrolijke dag, en van het zenden van gedeelten aan elkaar.", "Est 9:1": "In de twaalfde maand nu (dat is de maand Adar), op de dertiende dag daarvan, toen het woord en de wet van de koning nabij gekomen waren om uitgevoerd te worden, op de dag dat de vijanden van de Joden hoopten over hen te heersen, gebeurde het omgekeerde: de Joden zelf heersten over hun haters.", "Luk 19:41": "En toen Hij dichtbij kwam en de stad zag, weende Hij over haar,", "Est 9:15": "En de Joden die in Susan waren, verzamelden zich ook op de veertiende dag van de maand Adar, en zij doodden in Susan driehonderd mannen; maar zij sloegen hun hand niet aan de roof.", "Est 1:14": "de naaste bij hem waren Carsena, Sethar, Admatha, Tharsis, Meres, Marsena, Memuchan, zeven vorsten van de Perzen en de Meden, die het aangezicht van de koning zagen, die vooraan zaten in het koninkrijk),", "Est 9:16": "De overige Joden nu, die in de landschappen van de koning waren, verzamelden zich om op te komen voor hun leven, en rust te hebben van hun vijanden; en zij doodden onder hun haters vijfenzeventigduizend; maar zij sloegen hun hand niet aan de roof.", "Est 3:2": "En alle knechten van de koning die in de poort van de koning waren, knielden en bogen zich neer voor Haman; want de koning had zo over hem bevolen; maar Mordechai knielde niet, en boog zich niet neer.", "Pred 5:13": "Of die rijkdom zelf gaat verloren door een moeilijke bezigheid; en hij verwekt een zoon, en er is helemaal niets in zijn hand.", "Est 9:17": "Dit gebeurde op de dertiende dag van de maand Adar; en op de veertiende daarvan rustten zij, en zij maakten die tot een dag van maaltijden en vreugde.", "Spr 4:19": "De weg van de goddelozen is als donkerheid; zij weten niet, waarover zij zullen struikelen.", "Dan 4:1": "Koning Nebukadnezar aan alle volken, natiën en talen, die op de hele aardbodem wonen: uw vrede moet vermenigvuldigd worden!", "2 Kron 30:1-10": "Daarna stuurde Hizkia boodschappers naar heel Israël en Juda, en schreef ook brieven aan Efraïm en Manasse, dat zij zouden komen naar het huis van de HEERE te Jeruzalem, om de HEERE, de God van Israël, pascha te houden. Want de koning had overlegd met zijn leiders en de hele gemeente te Jeruzalem, om het pascha te houden in de tweede maand. Zeker, zij hadden het niet kunnen houden op diezelfde tijd, omdat de priesters zich niet genoeg geheiligd hadden, en het volk zich niet verzameld had te Jeruzalem.", "Mark 5:22": "En zie, er kwam een van de leiders van de synagoge, van wie de naam Jaïrus was; en toen hij Hem zag, viel hij aan Zijn voeten,", "Pred 8:4": "Waar het woord van de koning is, daar is macht; en wie zal tegen hem zeggen: Wat doet u?", "Est 2:8": "Het gebeurde nu, toen het woord van de koning en zijn wet bekend was geworden, en toen veel jonge dochters bijeengebracht werden op de burg Susan, onder de hand van Hegai, dat Esther ook genomen werd in het huis van de koning, onder de hand van Hegai, de bewaarder van de vrouwen.", "Jer 2:23": "Hoe zegt u: Ik ben niet verontreinigd, ik heb de Baäls niet nagewandeld? Zie uw weg in het dal, ken wat u gedaan hebt, u lichte, snelle kemelin, die haar wegen verdraait!", "2 Sam 8:17": "En Zadok, zoon van Ahitub, en Achimelech, zoon van Abjathar, waren priesters; en Seraja was schrijver.", "Gen 43:26": "Toen Jozef nu thuisgekomen was, brachten zij hem het geschenk, dat in hun hand was, in het huis, en zij bogen zich voor hem ter aarde.", "Est 9:10": "de tien zonen van Haman, de zoon van Hammedatha, de vijand van de Joden, doodden zij; maar zij sloegen hun handen niet aan de roof.", "Job 9:25": "En mijn dagen zijn sneller geweest dan een loper; zij zijn weggevlucht, zij hebben het goede niet gezien.", "Jes 56:3": "En de vreemdeling, die zich bij de HEERE gevoegd heeft, moet niet zeggen: De HEERE heeft mij helemaal van Zijn volk gescheiden; en de ontmande moet niet zeggen: Zie, ik ben een dorre boom.", "Ex 15:9": "De vijand zei: Ik zal vervolgen, ik zal achterhalen, ik zal de buit delen, mijn ziel zal van hen vervuld worden, ik zal mijn zwaard trekken, mijn hand zal hen uitroeien.", "Spr 29:2": "Als de rechtvaardigen groot worden, verblijdt het volk zich; maar als de goddeloze heerst, zucht het volk.", "Richt 1:6": "Maar Adoni-bezek vluchtte; en zij achtervolgden hem, en grepen hem, en hieuwen de duimen van zijn handen en zijn voeten af.", "Ex 15:16": "Verschrikking en vrees zal op hen vallen; door de grootheid van Uw arm zullen zij verstommen als een steen, totdat Uw volk, HEERE, erdoor is getrokken; totdat dit volk erdoor is getrokken, dat U verworven hebt.", "Hebr 6:18": "opdat wij, door twee onveranderlijke dingen, waarin het onmogelijk is dat God liegt, een sterke troost zouden hebben, wij namelijk, die de toevlucht genomen hebben om de hoop die ons voorgesteld is vast te houden;", "Luk 15:22": "Maar de vader zei tegen zijn dienaren: Breng hier het beste kleed, en trek het hem aan, en geef hem een ring aan zijn hand, en schoenen aan zijn voeten;", "2 Kron 30:6": "De boodschappers dan gingen weg met de brieven uit de hand van de koning en zijn leiders, door heel Israël en Juda, en naar het bevel van de koning, en zeiden: Kinderen van Israël, bekeer u tot de HEERE, de God van Abraham, Izak en Israël, dan zal Hij Zich keren naar wie ontkomen waren, die voor u overgebleven zijn uit de hand van de koningen van Assyrië.", "Lev 6:10": "En de priester zal zijn linnen kleed aantrekken, en de linnen onderbroek over zijn vlees aantrekken, en zal de as opnemen als het vuur het brandoffer op het altaar verteerd zal hebben, en zal die bij het altaar leggen.", "Ps 37:34": "Koph. Wacht op de HEERE, en houd Zijn weg, en Hij zal u verhogen om de aarde erfelijk te bezitten; u zult zien dat de goddelozen worden uitgeroeid.", "Openb 6:10": "En zij riepen met grote stem, en zeiden: Hoelang, o heilige en waarachtige Heerser, oordeelt en wreekt U ons bloed niet van hen, die op de aarde wonen?", "1 Sam 21:8": "En David zei tegen Achimelech: Is hier onder uw hand geen speer of zwaard? Want ik heb mijn zwaard noch mijn wapens in mijn hand meegenomen, omdat de zaak van de koning haastig was.", "Ex 25:25": "U zult ook een lijst rondom daaraan maken, een hand breed; en u zult een gouden krans rondom die lijst maken.", "Dan 6:9": "Nu, o koning! zult u een gebod bevestigen, en een geschrift ondertekenen, dat niet veranderd mag worden, naar de wet van de Meden en de Perzen, die niet teruggeroepen mag worden.", "Est 9:19": "Daarom maakten de Joden van de dorpen, die in de dorpsteden woonden, van de veertiende dag van de maand Adar een dag van vreugde en maaltijden, en een vrolijke dag, en van het zenden van gedeelten aan elkaar.", "Ps 146:6-9": "Die de hemel en de aarde gemaakt heeft, de zee en alles wat daarin is; Die trouw houdt in eeuwigheid. Die de verdrukte recht doet, Die de hongerige brood geeft; de HEERE maakt de gevangenen los. De HEERE opent de ogen van de blinden; de HEERE richt de gebogenen op; de HEERE heeft de rechtvaardigen lief.", "1 Sam 20:29": "En hij zei: Laat mij toch gaan; want ons geslacht heeft een offer in de stad, en mijn broer heeft het mij zelf opgedragen; heb ik nu genade in uw ogen gevonden, laat mij toch wegkomen, dat ik mijn broers zie; hierom is hij niet aan de tafel van de koning gekomen.", "Est 3:1": "Na deze gebeurtenissen maakte de koning Ahasveros Haman groot, de zoon van Hammedatha, de Agagiet, en hij verhoogde hem, en hij zette zijn stoel boven alle vorsten die bij hem waren.", "Spr 28:8": "Wie zijn bezit vermeerdert met woeker en met overwinst, verzamelt dat voor hem die zich over de arme ontfermt.", "Jer 51:21": "En door u zal Ik in stukken slaan het paard en zijn ruiter; en door u zal Ik in stukken slaan de wagen en zijn ruiter.", "Jes 22:19-22": "En Ik zal u wegstoten van uw positie, en van uw plaats zal Hij u neerhalen. En het zal op die dag gebeuren, dat Ik Mijn knecht, Eljakim, de zoon van Hilkia, roepen zal. En Ik zal hem met uw gewaad bekleden, en Ik zal hem met uw gordel sterken, en uw heerschappij zal Ik in zijn hand geven; en hij zal voor de inwoners van Jeruzalem en voor het huis van Juda tot een vader zijn.", "1 Kron 27:32": "En Jonathan, de oom van David, was raadsman, een verstandig man; hij was ook schrijver; Jehiël nu, de zoon van Hachmoni, was bij de zonen van de koning.", "Est 1:11": "dat zij Vasthi, de koningin, voor het aangezicht van de koning zouden brengen, met de koninklijke kroon, om aan de volken en de vorsten haar schoonheid te tonen; want zij was mooi om te zien.", "2 Kon 18:18": "En zij riepen naar de koning; toen ging tot hen uit Eljakim, de zoon van Hilkia, de hofmeester, en Sebna, de schrijver, en Joah, de zoon van Asaf, de kanselier.", "Jes 40:3": "Een stem van iemand die roept in de woestijn: Bereidt de weg van de HEERE, maakt recht in de wildernis een baan voor onze God!", "Ps 30:6-12": "Want een ogenblik is er in Zijn toorn, maar een leven in Zijn goedgunstigheid; 's avonds vernacht het geween, maar 's morgens is er gejuich. Ik zei wel in mijn voorspoed: Ik zal nooit wankelen. Want, HEERE! U had mijn berg door Uw goedgunstigheid vast doen staan; maar toen U Uw aangezicht verborg, werd ik verschrikt.", "Est 4:11": "Alle knechten van de koning en het volk van de landschappen van de koning weten wel dat ieder die tot de koning ingaat in het binnenste voorhof, zonder geroepen te zijn, of het nu een man of een vrouw is, één vonnis geldt: dat men hem doodt, tenzij de koning hem de gouden scepter toereikt, zodat hij levend blijft; ik nu ben deze dertig dagen niet geroepen om bij de koning te komen.", "Ex 15:10": "U hebt met Uw wind geblazen; de zee heeft hen gedekt, zij zonken onder als lood in geweldige wateren!", "Hebr 6:17": "waarbij God, omdat Hij aan de erfgenamen van de belofte overvloediger de onveranderlijkheid van Zijn raad wilde tonen, er een eed tussen heeft gebracht;", "Ezra 6:15": "En dit huis werd voltooid op de derde dag van de maand Adar; dat was in het zesde jaar van het koninkrijk van koning Darius.", "Est 2:4": "En de jonge dochter, die in de ogen van de koning mooi zal zijn, wordt koningin in de plaats van Vasthi. Deze zaak nu was goed in de ogen van de koning, en hij deed zo.", "Neh 1:1": "De geschiedenissen van Nehemia, zoon van Hachalja. En het gebeurde in de maand Chisleu, in het twintigste jaar, toen ik in de burcht Susan was,", "2 Kon 22:1-14": "Josia was acht jaar oud, toen hij koning werd, en regeerde eenendertig jaar te Jeruzalem; en de naam van zijn moeder was Jedida, een dochter van Adaja, uit Bozkath. En hij deed wat recht was in de ogen van de HEERE; en hij wandelde in heel de weg van zijn vader David, en week niet af naar rechts of naar links. Het gebeurde nu in het achttiende jaar van koning Josia, dat de koning de schrijver Safan, de zoon van Azalia, de zoon van Mesullam, zond naar het huis van de HEERE, en zei:", "Gen 49:8": "Juda! U bent het, u zullen uw broers loven; uw hand zal zijn op de nek van uw vijanden; voor u zullen de zonen van uw vader zich neerbuigen.", "Ps 18:44": "U hebt mij uitgeholpen van de twisten van het volk; U hebt mij gesteld tot een hoofd van de heidenen; het volk dat ik niet kende, heeft mij gediend.", "Ezech 39:10": "zodat zij geen hout van het veld zullen dragen, en ook niet in de wouden zullen hakken, maar van de wapens vuur zullen stoken; en zij zullen beroven wie hen beroofd hadden, en plunderen wie hen geplunderd hadden, spreekt de Heere HEERE.", "1 Sam 25:24": "En zij viel aan zijn voeten en zei: Och, mijn heer, laat de misdaad op mij zijn, en laat toch uw dienstmaagd voor uw oren spreken, en hoor de woorden van uw dienstmaagd.", "Est 6:8": "laat men het koninklijke kleed brengen dat de koning gewoonlijk draagt, en het paard waarop de koning gewoonlijk rijdt, en laat de koninklijke kroon op zijn hoofd gezet worden.", "Gen 37:10": "En toen hij het aan zijn vader en aan zijn broers vertelde, bestrafte zijn vader hem en zei tegen hem: Wat is dit voor een droom die u gedroomd hebt? Zullen wij dan werkelijk komen, ik, en uw moeder, en uw broers, om ons voor u ter aarde te buigen?", "Hos 12:5": "Ja, hij gedroeg zich vorstelijk tegen de Engel, en kreeg de overhand op Hem; hij weende en smeekte Hem. Te Bethel vond hij Hem, en daar sprak Hij met ons;", "Jes 10:6": "Ik zal hem zenden tegen een huichelachtig volk, en Ik zal hem bevel geven tegen het volk van Mijn verbolgenheid; opdat hij de roof rooft, en plundert de plundering, en het stelt ter vertreding, als het slijk van de straten.", "Est 4:8": "En hij gaf hem het afschrift van de geschreven wet, die te Susan gegeven was om hen te verdelgen, opdat hij het Esther zou laten zien, en het haar te kennen zou geven, en haar zou gebieden dat zij naar de koning zou gaan om hem te smeken, en van hem te verzoeken voor haar volk.", "Neh 8:11": "Verder zei hij tegen hen: Ga, eet het vette, en drink het zoete, en stuur delen aan hen voor wie niets bereid is, want deze dag is heilig voor onze Heere; wees dus niet bedroefd, want de blijdschap van de HEERE, die is uw sterkte.", "Ex 25:4": "En hemelsblauw, purper, scharlaken, fijn linnen, en geitenhaar.", "Jes 30:30": "En de HEERE zal Zijn heerlijke stem doen horen, en de nederlating van Zijn arm doen zien, met grimmigheid van toorn, en een vlam van verterend vuur, stralen, en een vloed, en hagelstenen.", "Deut 2:25": "Op deze dag zal Ik beginnen uw schrik en uw vrees te geven over het aangezicht van de volken onder de hele hemel; die van u zullen horen, zullen sidderen en bang zijn vanwege u.", "Jes 40:9": "O Sion, u die goede boodschap verkondigt, klim op een hoge berg; o Jeruzalem, u die goede boodschap verkondigt, hef uw stem op met macht, hef ze op, vrees niet, zeg tegen de steden van Juda: Zie, hier is uw God!", "Ex 33:13": "Nu dan, ik bid U, als ik genade gevonden heb in Uw ogen, laat mij dan nu Uw weg weten, en ik zal U kennen, opdat ik genade vind in Uw ogen; en zie aan dat dit volk Uw volk is!", "Est 1:1": "Dit gebeurde in de dagen van Ahasveros (dit is de Ahasveros die regeerde van Indië tot aan Morenland toe, honderdzevenentwintig landschappen),", "Est 1:13-19": "Toen zei de koning tegen de wijzen, die de tijden verstonden (want zo moest de zaak van de koning gebeuren, voor het aangezicht van allen die de wet en het recht kenden; de naaste bij hem waren Carsena, Sethar, Admatha, Tharsis, Meres, Marsena, Memuchan, zeven vorsten van de Perzen en de Meden, die het aangezicht van de koning zagen, die vooraan zaten in het koninkrijk), wat men volgens de wet met de koningin Vasthi zou moeten doen, omdat zij het woord van de koning Ahasveros, dat door de kamerlingen was overgebracht, niet had gedaan?", "2 Kon 18:37": "Toen kwam Eljakim, de zoon van Hilkia, de hofmeester, en Sebna, de schrijver, en Joah, de zoon van Asaf, de kanselier, tot Hizkia, met gescheurde kleren; en zij maakten hem de woorden van Rabsake bekend.", "Hebr 5:7": "Hij heeft, in de dagen van Zijn vlees, gebeden en smekingen geofferd, met sterk geroep en tranen, tot Hem die Hem uit de dood kon verlossen, en Hij is verhoord vanwege Zijn vrees.", "Jes 30:29": "Er zal een lofzang bij u zijn, zoals in de nacht wanneer het feest geheiligd wordt; en blijdschap van het hart, zoals van iemand die met pijpen wandelt, om te komen tot de berg van de HEERE, tot de Rotssteen van Israël.", "Gen 27:29": "Volken zullen u dienen, en volken zullen zich voor u neerbuigen; wees heer over uw broers, en de zonen van uw moeder zullen zich voor u neerbuigen! Vervloekt moet hij zijn, wie u vervloekt; en wie u zegent, zij gezegend!", "Gen 23:7": "Toen stond Abraham op, en boog zich neer voor het volk van het land, voor de zonen van Heth;", "Dan 6:15": "Toen de koning dit hoorde, was hij zeer bedroefd bij zichzelf, en hij zette zijn hart op Daniël om hem te verlossen; ja, tot aan zonsondergang toe deed hij moeite om hem te redden.", "Est 1:22": "En hij zond brieven aan alle landschappen van de koning, aan ieder landschap in zijn eigen schrift, en aan elk volk in zijn eigen taal, dat elke man heerser in zijn eigen huis zou zijn, en zou spreken in de taal van zijn volk.", "Zach 8:20-23": "Zo zegt de HEERE van de heerscharen: Nog zal het gebeuren, dat de volken, en de inwoners van veel steden, komen zullen; En de inwoners van de ene stad zullen gaan naar de inwoners van de andere, en zeggen: Laten wij vlijtig heengaan om het aangezicht van de HEERE te smeken, en om de HEERE van de heerscharen te zoeken; ik zal ook heengaan. Zo zullen veel volken, en machtige heidenvolken komen, om de HEERE van de heerscharen te Jeruzalem te zoeken, en om het aangezicht van de HEERE te smeken.", "Est 9:2": "De Joden verzamelden zich in hun steden, in alle landschappen van koning Ahasveros, om de hand te slaan aan hen die hun verderf zochten; en niemand hield stand voor hen, want de schrik voor hen was op alle volken gevallen.", "Est 2:5": "Er was een Joodse man op de burg Susan, wiens naam was Mordechai, een zoon van Jaïr, de zoon van Simeï, de zoon van Kis, een man van Jemini;", "1 Sam 25:8": "Vraag het uw jongemannen, en zij zullen het u vertellen. Laat dan deze jongemannen genade vinden in uw ogen, want wij zijn op een goede dag gekomen; geef toch uw knechten, en uw zoon David, wat uw hand vinden zal.", "Rom 9:3": "Want ik zou zelf wel wensen verbannen te zijn van Christus, voor mijn broeders, die mijn verwanten zijn naar het vlees;", "Gen 41:42": "En Farao haalde zijn ring van zijn hand af, en deed hem aan Jozefs hand, en liet hem kleren van fijn linnen aantrekken, en legde hem een gouden keten om zijn hals;", "2 Kon 12:10-12": "Het gebeurde nu, toen zij zagen dat er veel geld in de kist was, dat de schrijver van de koning met de hogepriester opkwam, en zij bonden het samen en telden het geld dat in het huis van de HEERE gevonden werd. En zij gaven het geld, goed gewogen, in handen van hen die het werk verzorgden en die aangesteld waren over het huis van de HEERE; en zij betaalden daarmee de timmerlieden en de bouwlieden die het huis van de HEERE herstelden; En de metselaars en de steenhouwers, en om hout en gehouwen stenen te kopen, om de breuken van het huis van de HEERE te herstellen, en voor alles wat uitgegeven werd voor het huis, om dat te herstellen.", "Est 7:3": "Toen antwoordde de koningin Esther, en zei: Als ik, o koning, genade in uw ogen gevonden heb, en als het de koning goeddunkt, geve men mij mijn leven, om mijn bede, en mijn volk, om mijn verzoek.", "Est 7:4": "Want wij zijn verkocht, ik en mijn volk, om ons te verdelgen, te doden en om te brengen. Als wij nog tot knechten en tot dienstmaagden waren verkocht, zou ik gezwegen hebben, ofschoon de onderdrukker de schade van de koning geenszins zou kunnen vergoeden.", "Ps 137:8": "O dochter van Babel! die verwoest zal worden, gelukkig zal hij zijn, die u uw misdaad vergelden zal, die u aan ons misdaan hebt.", "Est 7:10": "Zo hingen zij Haman aan de galg, die hij voor Mordechai had laten maken; en de grimmigheid van de koning werd gestild.", "2 Kon 4:27": "Toen zij nu bij de man Gods op de berg kwam, greep zij zijn voeten vast. Maar Gehazi kwam dichterbij om haar weg te duwen. Maar de man Gods zei: Laat haar begaan; want haar ziel is in haar bitter bedroefd, en de HEERE heeft het voor mij verborgen, en het mij niet verteld.", "Est 3:13-15": "De brieven nu werden gezonden door de hand van de lopers naar alle landschappen van de koning, dat men zou uitroeien, doden en ombrengen alle Joden, van jong tot oud toe, de kleine kinderen en de vrouwen, op één dag, op de dertiende van de twaalfde maand (dat is de maand Adar), en dat men hun buit zou roven. De inhoud van het schrift was, dat er een wet zou worden gegeven in alle landschappen, openbaar gemaakt aan alle volken, dat zij tegen dezelfde dag gereed zouden zijn. De lopers gingen uit, aangespoord door het woord van de koning, en de wet werd uitgegeven in de burcht Susan. En de koning en Haman gingen zitten om te drinken, doch de stad Susan was in verwarring.", "Matt 2:11": "En toen zij in het huis gekomen waren, vonden zij het Kindje met Maria, Zijn moeder, en zij vielen neer en aanbaden Het; en na hun schatten geopend te hebben, brachten zij Hem geschenken: goud, wierook en mirre.", "Est 8:10-14": "En men schreef in de naam van koning Ahasveros, en men verzegelde het met de ring van de koning; en men zond de brieven door de hand van de lopers te paard, die reden op snelle kamelen, op muildieren, geteeld uit merries; Dat de koning aan de Joden, die in elke stad waren, toestond zich te verzamelen, en op te komen voor hun leven, om te verdelgen, om te doden en om om te brengen alle macht van het volk en van het landschap, die hen benauwen zou, de kleine kinderen en de vrouwen, en hun buit te roven; Op één dag in alle landschappen van koning Ahasveros, op de dertiende van de twaalfde maand; dat is de maand Adar.", "Dan 5:29": "Toen beval Belsazar, en zij bekleedden Daniël met purper, met een gouden keten om zijn hals, en zij riepen luid over hem, dat hij de derde heerser in dat koninkrijk was.", "Est 2:7": "En hij was het die Hadassa opvoedde (dit is Esther, de dochter van zijn oom); want zij had geen vader noch moeder; en zij was een jonge dochter, mooi van gestalte, en mooi van uiterlijk; en toen haar vader en haar moeder stierven, had Mordechai haar tot een dochter aangenomen.", "Hand 10:25": "En toen het gebeurde dat Petrus binnenkwam, ging Cornelius hem tegemoet, en viel voor zijn voeten neer, en aanbad hem.", "2 Sam 20:24": "En Adoram was over de schatting; en Josafat, de zoon van Ahilud, was kanselier;", "Ps 21:4": "Want U komt hem voor met zegeningen van het goede; op zijn hoofd zet U een kroon van fijn goud.", "Ps 92:11": "Maar U zult mijn hoorn verhogen, zoals de hoorn van een eenhoorn; ik ben met verse olie overgoten.", "Est 5:1": "Op de derde dag gebeurde het dat Esther een koninklijk kleed aantrok, en ging staan in het binnenste voorhof van het huis van de koning, tegenover het huis van de koning; de koning nu zat op zijn koninklijke troon, in het koninklijke huis, tegenover de deur van het huis.", "Gen 19:2": "En hij zei: Zie toch, mijn heren! Keert u toch af naar het huis van uw knecht, en overnacht daar, en wast uw voeten; dan kunt u vroeg opstaan en verder gaan op uw weg. En zij zeiden: Nee, maar wij zullen op straat overnachten.", "Dan 3:4-7": "En een heraut riep met kracht: Men zegt u aan, u volken, u naties en tongen! Op het moment dat u het geluid zult horen van de hoorn, de pijp, de citer, de vedel, de psalters, het akkoordgezang, en allerlei soorten muziek, dan zult u neervallen en aanbidden het gouden beeld, dat de koning Nebukadnezar heeft opgericht; En wie niet neervalt en aanbidt, die zal op datzelfde moment in het midden van de brandende vuuroven geworpen worden.", "Est 9:24": "Omdat Haman, de zoon van Hammedatha, de Agagiet, de vijand van alle Joden, tegen de Joden bedacht had hen om te brengen; en omdat hij het Pur, dat is het lot, geworpen had om hen te verslaan en om hen om te brengen.", "Ps 149:6-9": "De lofprijzingen van God zullen in hun keel zijn, en een tweesnijdend zwaard in hun hand, om wraak te doen over de heidenvolken, en bestraffingen over de volken, om hun koningen te binden met ketenen, en hun aanzienlijken met ijzeren boeien,", "Jer 4:19": "O mijn binnenste, mijn binnenste! ik heb weeën, o wanden van mijn hart! Mijn hart maakt getier in mij, ik kan niet zwijgen; want u, mijn ziel! hoort het geluid van de bazuin en het krijgsgeschreeuw.", "Ex 33:16": "Want waaraan zou nu bekend worden dat ik genade gevonden heb in Uw ogen, ik en Uw volk? Is het niet daaraan, dat U met ons meegaat? Zo zullen wij afgezonderd worden, ik en Uw volk, van alle volk dat op de aardbodem is.", "Est 3:7": "In de eerste maand (dat is de maand Nisan), in het twaalfde jaar van de koning Ahasveros, wierp men het Pur, dat is het lot, voor het aangezicht van Haman, van dag tot dag, en van maand tot maand, tot de twaalfde maand toe; dat is de maand Adar.", "Gen 44:34": "Want hoe zou ik optrekken naar mijn vader, als de jongen niet bij mij was, zodat ik het verdriet niet hoef te zien dat mijn vader zou overkomen.", "Matt 6:29": "en Ik zeg u, dat zelfs Salomo, in al zijn heerlijkheid, niet gekleed was zoals één van deze.", "Est 2:17": "En de koning beminde Esther boven alle vrouwen, en zij verkreeg genade en gunst bij hem, boven alle maagden; en hij zette de koninklijke kroon op haar hoofd, en hij maakte haar koningin in de plaats van Vasthi.", "1 Kon 4:5": "En Azaria, de zoon van Nathan, was over de bestelmeesters; en Zabud, de zoon van Nathan, was overambtman, de vriend van de koning.", "Est 2:15": "Toen de beurt van Esther, de dochter van Abichaïl, de oom van Mordechai (die hij tot dochter had aangenomen), naderde, zodat zij bij de koning zou komen, verlangde zij niets, behalve wat Hegai, de kamerling van de koning, de bewaarder van de vrouwen, zei; en Esther verkreeg genade in de ogen van allen die haar zagen.", "Dan 6:18": "En er werd een steen gebracht, en op de opening van de kuil gelegd; en de koning verzegelde die met zijn eigen ring, en met de ring van zijn machthebbers, opdat de beslissing over Daniël niet veranderd zou worden.", "Ps 68:24": "Opdat u uw voet, ja, de tong van uw honden, mag steken in het bloed van de vijanden, van ieder van hen.", "Dan 6:9-13": "Nu, o koning! zult u een gebod bevestigen, en een geschrift ondertekenen, dat niet veranderd mag worden, naar de wet van de Meden en de Perzen, die niet teruggeroepen mag worden. Daarom ondertekende de koning Darius dat geschrift en gebod. Toen Daniël nu begreep dat dit geschrift ondertekend was, ging hij naar zijn huis (hij had namelijk in zijn bovenzaal open vensters in de richting van Jeruzalem), en hij knielde drie keer per dag op zijn knieën, en hij bad, en dankte voor het aangezicht van zijn God, geheel zoals hij hiervoor gedaan had.", "Est 6:9": "En men moet dat kleed en dat paard geven in de hand van een van de vorsten van de koning, van de aanzienlijkste heren, en men moet het die man aantrekken aan wie de koning graag eer wil bewijzen; en men moet hem op dat paard laten rijden door de straten van de stad, en men moet vóór hem uit roepen: Zo zal men doen met de man aan wie de koning graag eer wil bewijzen!", "Dan 6:2": "En het leek Darius goed dat hij over het koninkrijk honderdtwintig stadhouders aanstelde, die over het hele koninkrijk zouden zijn;", "Gen 19:1": "En die twee engelen kwamen 's avonds in Sodom aan; en Lot zat in de poort van Sodom; en toen Lot hen zag, stond hij op om hun tegemoet te gaan, en boog zich met het gezicht ter aarde.", "Est 4:16": "Ga, verzamel alle Joden die te Susan gevonden worden, en vast voor mij, en eet of drink niet, drie dagen lang, nacht noch dag; ik en mijn jonge dochters zullen ook zo vasten, en zo zal ik tot de koning ingaan, wat niet naar de wet is. Wanneer ik dan omkom, dan kom ik om.", "1 Sam 25:23": "Toen Abigaïl nu David zag, haastte zij zich, en kwam van de ezel af, en zij viel voor het aangezicht van David op haar aangezicht, en zij boog zich ter aarde.", "1 Kon 21:8": "Zij schreef dan brieven in de naam van Achab, en verzegelde ze met zijn zegel; en zond de brieven aan de oudsten en aan de edelen, die in zijn stad waren, wonend bij Naboth.", "Est 3:12": "Toen werden de schrijvers van de koning geroepen, in de eerste maand, op de dertiende dag daarvan, en er werd geschreven naar alles wat Haman beval, aan de stadhouders van de koning, en aan de landvoogden die over elk landschap waren, en aan de vorsten van elk volk, elk landschap naar zijn schrift, en elk volk naar zijn taal; er werd geschreven in de naam van de koning Ahasveros, en het werd met de ring van de koning verzegeld.", "Dan 6:10": "Daarom ondertekende de koning Darius dat geschrift en gebod.", "Job 27:16": "Zo hij zilver opgehoopt zal hebben als stof, en kleding bereid als leem;", "Jer 9:1": "Och, dat mijn hoofd water was, en mijn oog een springader van tranen! Dan zou ik dag en nacht bewenen de verslagenen van de dochter van mijn volk.", "Luk 19:42": "en zei: Och, had u ook maar geweten, ook nog op deze dag van u, wat tot uw vrede dient! Maar nu is het verborgen voor uw ogen.", "Gen 43:28": "En zij zeiden: Het gaat goed met uw dienaar, onze vader, hij leeft nog; en zij neigden het hoofd en bogen zich neer.", "2 Sam 9:7-10": "En David zei tegen hem: Wees niet bang, want ik zal zeker goedheid aan u bewijzen, omwille van uw vader Jonathan; en ik zal u alle akkers van uw vader Saul teruggeven; en u zult voortdurend brood eten aan mijn tafel. Toen boog hij zich neer, en zei: Wat is uw knecht, dat u omgezien hebt naar een dode hond, zoals ik ben? Toen riep de koning Ziba, de jongen van Saul, en zei tegen hem: Alles wat van Saul geweest is, en zijn hele huis, heb ik aan de zoon van uw heer gegeven.", "1 Kon 4:3": "Elihoref en Ahia, de zoon van Sisa, waren schrijvers; Josafat, de zoon van Ahilud, was kanselier.", "Dan 6:13-16": "Toen kwamen zij dichterbij, en spraken voor de koning over het gebod van de koning: Hebt u niet een gebod ondertekend, dat ieder mens die in dertig dagen iets zou verzoeken van enige god of mens, behalve van u, o koning, in de kuil van de leeuwen geworpen zou worden? De koning antwoordde en zei: Dat is een vaste zaak, naar de wet van de Meden en Perzen, die niet herroepen mag worden. Toen antwoordden zij, en zeiden voor de koning: Daniël, een van de gevankelijk weggevoerden uit Juda, heeft, o koning, geen acht op u geslagen, noch op het gebod dat u ondertekend hebt; maar hij bidt drie keer per dag zijn gebed. Toen de koning dit hoorde, was hij zeer bedroefd bij zichzelf, en hij zette zijn hart op Daniël om hem te verlossen; ja, tot aan zonsondergang toe deed hij moeite om hem te redden.", "Ezech 23:6": "Bekleed met hemelsblauw, vorsten en machthebbers, allemaal aantrekkelijke jonge mannen, ruiters, rijdend op paarden.", "Luk 18:7": "Zal God dan geen recht doen aan Zijn uitverkorenen, die dag en nacht tot Hem roepen, hoewel Hij geduldig is met hen?", "Est 8:2-10": "En de koning trok zijn ring af, die hij van Haman had afgenomen, en gaf hem aan Mordechai; en Esther stelde Mordechai aan over het huis van Haman. En Esther sprak verder voor de koning, en zij viel voor zijn voeten, en zij weende, en zij smeekte hem, dat hij de boosheid van Haman, de Agagiet, en zijn plan, dat hij tegen de Joden bedacht had, zou wegnemen. De koning nu reikte de gouden scepter naar Esther uit. Toen stond Esther op, en zij bleef staan voor de koning.", "Est 4:1-3": "Toen Mordechai wist wat er allemaal gebeurd was, verscheurde hij zijn kleren en trok een zak met as aan; en hij ging door het midden van de stad, en riep met een luid en bitter geroep. En hij kwam tot vóór de poort van de koning; want niemand mocht bij de poort van de koning naar binnen gaan, gekleed in een zak. En in elk landschap en elke plaats, waar het woord van de koning en zijn wet aankwam, was er grote rouw onder de Joden, met vasten, geween en misbaar; velen lagen in zakken en as.", "Dan 2:48": "Toen maakte de koning Daniël groot, en gaf hem vele grote geschenken, en hij stelde hem aan als heerser over het hele landschap van Babel, en als hoofd der bestuurders over alle wijzen van Babel.", "Ps 37:14": "Cheth. De goddelozen hebben het zwaard getrokken, en hun boog gespannen, om de ellendige en de arme neer te vellen, om te slachten wie oprecht van weg zijn.", "Matt 11:8": "Maar wat bent u uitgegaan te zien? Een mens, met zachte klederen bekleed? Zie, wie zachte klederen dragen, zijn in de huizen van koningen.", "Ex 37:2-11": "En hij overtrok haar met zuiver goud, van binnen en van buiten; en hij maakte er een gouden krans omheen. En hij goot er vier gouden ringen voor, aan haar vier hoeken, zodat er twee ringen aan de ene zijde waren, en twee ringen aan de andere zijde. En hij maakte handbomen van acaciahout, en hij overtrok ze met goud."}, "noten": {}, "koppeling": {"1": "Op dezelfde dag <span class=\"wl\" data-l=\"L2\" data-code=\"H5414\">gaf</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H5414\">de</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H4428\">koning</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H325\">Ahasveros</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H325\">aan</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H4436\">koningin</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H635\">Esther</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H635\">het</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H1004\">huis</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H1004\">van</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H2001\">Haman</span>, <span class=\"wl\" data-l=\"L8\" data-code=\"H2001\">de</span> <span class=\"wl\" data-l=\"L9\" data-code=\"H6887\">vijand</span> <span class=\"wl\" data-l=\"L9\" data-code=\"H6887\">van</span> <span class=\"wl\" data-l=\"L10\" data-code=\"H3064\">de</spa " data-code=\"H4782\">Mordecai.</span> And <span class=\"wl wl-kjv\" data-code=\"H635\">Esther</span> <span class=\"wl wl-kjv\" data-code=\"H7760\">set</span> <span class=\"wl wl-kjv\" data-code=\"H4782\">Mordecai</span> over the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of Haman.", "3": "And <span class=\"wl wl-kjv\" data-code=\"H635\">Esther</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> yet <span class=\"wl wl-kjv\" data-code=\"H3254\">again</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> and fell <span class=\"wl wl-kjv\" data-code=\"H5307\">down</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">at</span> his <span class=\"wl wl-kjv\" data-code=\"H7272\">feet,</span> and <span class=\"wl wl-kjv\" data-code=\"H2603\">besought</span> him with <span class=\"wl wl-kjv\" data-code=\"H1058\">tears</span> to put <span class=\"wl wl-kjv\" data-code=\"H5674\">away</span> the <span class=\"wl wl-kjv\" data-code=\"H7451\">mischief</span> of <span class=\"wl wl-kjv\" data-code=\"H2001\">Haman</span> the <span class=\"wl wl-kjv\" data-code=\"H91\">Agagite,</span> and his <span class=\"wl wl-kjv\" data-code=\"H4284\">device</span> that he had <span class=\"wl wl-kjv\" data-code=\"H2803\">devised</span> against the Jews.", "4": "Then the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> held <span class=\"wl wl-kjv\" data-code=\"H3447\">out</span> the <span class=\"wl wl-kjv\" data-code=\"H2091\">golden</span> <span class=\"wl wl-kjv\" data-code=\"H8275\">sceptre</span> toward <span class=\"wl wl-kjv\" data-code=\"H635\">Esther.</span> So <span class=\"wl wl-kjv\" data-code=\"H635\">Esther</span> <span class=\"wl wl-kjv\" data-code=\"H6965\">arose,</span> and <span class=\"wl wl-kjv\" data-code=\"H5975\">stood</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the king,", "5": "And <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> If it <span class=\"wl wl-kjv\" data-code=\"H2896\">please</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> and if I have <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> <span class=\"wl wl-kjv\" data-code=\"H2580\">favour</span> in his <span class=\"wl wl-kjv\" data-code=\"H6440\">sight,</span> and the <span class=\"wl wl-kjv\" data-code=\"H1697\">thing</span> seem <span class=\"wl wl-kjv\" data-code=\"H3787\">right</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> and I be <span class=\"wl wl-kjv\" data-code=\"H2896\">pleasing</span> in his <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes,</span> let it be <span class=\"wl wl-kjv\" data-code=\"H3789\">written</span> to <span class=\"wl wl-kjv\" data-code=\"H7725\">reverse</span> the <span class=\"wl wl-kjv\" data-code=\"H5612\">letters</span> <span class=\"wl wl-kjv\" data-code=\"H4284\">devised</span> by <span class=\"wl wl-kjv\" data-code=\"H2001\">Haman</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H4099\">Hammedatha</span> the <span class=\"wl wl-kjv\" data-code=\"H91\">Agagite,</span> which he <span class=\"wl wl-kjv\" data-code=\"H3789\">wrote</span> to <span class=\"wl wl-kjv\" data-code=\"H6\">destroy</span> the <span class=\"wl wl-kjv\" data-code=\"H3064\">Jews</span> which are in all the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> provinces:", "6": "For <span class=\"wl wl-kjv\" data-code=\"H349\">how</span> can I <span class=\"wl wl-kjv\" data-code=\"H3201\">endure</span> to <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> the <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> that shall <span class=\"wl wl-kjv\" data-code=\"H4672\">come</span> unto my <span class=\"wl wl-kjv\" data-code=\"H5971\">people?</span> or <span class=\"wl wl-kjv\" data-code=\"H349\">how</span> can I <span class=\"wl wl-kjv\" data-code=\"H3201\">endure</span> to <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> the <span class=\"wl wl-kjv\" data-code=\"H13\">destruction</span> of my kindred?", "7": "Then the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H325\">Ahasuerus</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H635\">Esther</span> the <span class=\"wl wl-kjv\" data-code=\"H4436\">queen</span> and to <span class=\"wl wl-kjv\" data-code=\"H4782\">Mordecai</span> the <span class=\"wl wl-kjv\" data-code=\"H3064\">Jew,</span> Behold, I have <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> <span class=\"wl wl-kjv\" data-code=\"H635\">Esther</span> the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H2001\">Haman,</span> and him they have <span class=\"wl wl-kjv\" data-code=\"H8518\">hanged</span> upon the <span class=\"wl wl-kjv\" data-code=\"H6086\">gallows,</span> because he <span class=\"wl wl-kjv\" data-code=\"H7971\">laid</span> his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> upon the Jews.", "8": "<span class=\"wl wl-kjv\" data-code=\"H3789\">Write</span> ye also for the <span class=\"wl wl-kjv\" data-code=\"H3064\">Jews,</span> as it <span class=\"wl wl-kjv\" data-code=\"H2896\">liketh</span> <span class=\"wl wl-kjv\" data-code=\"H5869\">you,</span> in the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H8034\">name,</span> and <span class=\"wl wl-kjv\" data-code=\"H2856\">seal</span> it with the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H2885\">ring:</span> for the <span class=\"wl wl-kjv\" data-code=\"H3791\">writing</span> which is <span class=\"wl wl-kjv\" data-code=\"H3789\">written</span> in the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H8034\">name,</span> and <span class=\"wl wl-kjv\" data-code=\"H2856\">sealed</span> with the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H2885\">ring,</span> may no man reverse.", "9": "Then were the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H5608\">scribes</span> <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> at that <span class=\"wl wl-kjv\" data-code=\"H6256\">time</span> in the <span class=\"wl wl-kjv\" data-code=\"H7992\">third</span> <span class=\"wl wl-kjv\" data-code=\"H2320\">month,</span> that is, the <span class=\"wl wl-kjv\" data-code=\"H2320\">month</span> <span class=\"wl wl-kjv\" data-code=\"H5510\">Sivan,</span> on the <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> and <span class=\"wl wl-kjv\" data-code=\"H6242\">twentieth</span> day thereof; and it was <span class=\"wl wl-kjv\" data-code=\"H3789\">written</span> according to all that <span class=\"wl wl-kjv\" data-code=\"H4782\">Mordecai</span> <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3064\">Jews,</span> and to the <span class=\"wl wl-kjv\" data-code=\"H323\">lieutenants,</span> and the <span class=\"wl wl-kjv\" data-code=\"H6346\">deputies</span> and <span class=\"wl wl-kjv\" data-code=\"H8269\">rulers</span> of the <span class=\"wl wl-kjv\" data-code=\"H4082\">provinces</span> which are from <span class=\"wl wl-kjv\" data-code=\"H1912\">India</span> unto <span class=\"wl wl-kjv\" data-code=\"H3568\">Ethiopia,</span> an <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> <span class=\"wl wl-kjv\" data-code=\"H6242\">twenty</span> and <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H4082\">provinces,</span> unto every <span class=\"wl wl-kjv\" data-code=\"H4082\">province</span> according to the <span class=\"wl wl-kjv\" data-code=\"H3791\">writing</span> thereof, and unto every <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> after their <span class=\"wl wl-kjv\" data-code=\"H3956\">language,</span> and to the <span class=\"wl wl-kjv\" data-code=\"H3064\">Jews</span> according to their <span class=\"wl wl-kjv\" data-code=\"H3791\">writing,</span> and according to their language.", "10": "And he <span class=\"wl wl-kjv\" data-code=\"H3789\">wrote</span> in the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H325\">Ahasuerus'</span> <span class=\"wl wl-kjv\" data-code=\"H8034\">name,</span> and <span class=\"wl wl-kjv\" data-code=\"H2856\">sealed</span> it with the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H2885\">ring,</span> and <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> <span class=\"wl wl-kjv\" data-code=\"H5612\">letters</span> <span class=\"wl wl-kjv\" data-code=\"H3027\">by</span> <span class=\"wl wl-kjv\" data-code=\"H7323\">posts</span> on <span class=\"wl wl-kjv\" data-code=\"H5483\">horseback,</span> and <span class=\"wl wl-kjv\" data-code=\"H7392\">riders</span> on <span class=\"wl wl-kjv\" data-code=\"H7409\">mules,</span> <span class=\"wl wl-kjv\" data-code=\"H327\">camels,</span> and <span class=\"wl wl-kjv\" data-code=\"H1121\">young</span> dromedaries:", "11": "Wherein the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">granted</span> the <span class=\"wl wl-kjv\" data-code=\"H3064\">Jews</span> which were in every <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> to gather themselves <span class=\"wl wl-kjv\" data-code=\"H6950\">together,</span> and to <span class=\"wl wl-kjv\" data-code=\"H5975\">stand</span> for their <span class=\"wl wl-kjv\" data-code=\"H5315\">life,</span> to <span class=\"wl wl-kjv\" data-code=\"H8045\">destroy,</span> to <span class=\"wl wl-kjv\" data-code=\"H2026\">slay,</span> and to cause to <span class=\"wl wl-kjv\" data-code=\"H6\">perish,</span> all the <span class=\"wl wl-kjv\" data-code=\"H2428\">power</span> of the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> and <span class=\"wl wl-kjv\" data-code=\"H4082\">province</span> that would <span class=\"wl wl-kjv\" data-code=\"H6696\">assault</span> them, both little <span class=\"wl wl-kjv\" data-code=\"H2945\">ones</span> and <span class=\"wl wl-kjv\" data-code=\"H802\">women,</span> and to take the <span class=\"wl wl-kjv\" data-code=\"H7998\">spoil</span> of them for a prey,", "12": "Upon <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> in all the <span class=\"wl wl-kjv\" data-code=\"H4082\">provinces</span> of <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H325\">Ahasuerus,</span> namely, upon the <span class=\"wl wl-kjv\" data-code=\"H7969\">thirteenth</span> day of the <span class=\"wl wl-kjv\" data-code=\"H8147\">twelfth</span> <span class=\"wl wl-kjv\" data-code=\"H2320\">month,</span> which is the <span class=\"wl wl-kjv\" data-code=\"H2320\">month</span> Adar.", "13": "The <span class=\"wl wl-kjv\" data-code=\"H6572\">copy</span> of the <span class=\"wl wl-kjv\" data-code=\"H3791\">writing</span> for a <span class=\"wl wl-kjv\" data-code=\"H1881\">commandment</span> to be <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> in every <span class=\"wl wl-kjv\" data-code=\"H4082\">province</span> was <span class=\"wl wl-kjv\" data-code=\"H1540\">published</span> unto all <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> and that the <span class=\"wl wl-kjv\" data-code=\"H3064\">Jews</span> should be <span class=\"wl wl-kjv\" data-code=\"H6264\">ready</span> against that <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> to <span class=\"wl wl-kjv\" data-code=\"H5358\">avenge</span> themselves on their enemies.", "14": "So the <span class=\"wl wl-kjv\" data-code=\"H7323\">posts</span> that <span class=\"wl wl-kjv\" data-code=\"H7392\">rode</span> upon <span class=\"wl wl-kjv\" data-code=\"H7409\">mules</span> and <span class=\"wl wl-kjv\" data-code=\"H327\">camels</span> went <span class=\"wl wl-kjv\" data-code=\"H3318\">out,</span> being <span class=\"wl wl-kjv\" data-code=\"H926\">hastened</span> and pressed <span class=\"wl wl-kjv\" data-code=\"H1765\">on</span> by the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H1697\">commandment.</span> And the <span class=\"wl wl-kjv\" data-code=\"H1881\">decree</span> was <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> at <span class=\"wl wl-kjv\" data-code=\"H7800\">Shushan</span> the palace.", "15": "And <span class=\"wl wl-kjv\" data-code=\"H4782\">Mordecai</span> went <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> from the <span class=\"wl wl-kjv\" data-code=\"H6440\">presence</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> in <span class=\"wl wl-kjv\" data-code=\"H4438\">royal</span> <span class=\"wl wl-kjv\" data-code=\"H3830\">apparel</span> of <span class=\"wl wl-kjv\" data-code=\"H8504\">blue</span> and <span class=\"wl wl-kjv\" data-code=\"H2353\">white,</span> and with a <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H5850\">crown</span> of <span class=\"wl wl-kjv\" data-code=\"H2091\">gold,</span> and with a <span class=\"wl wl-kjv\" data-code=\"H8509\">garment</span> of fine <span class=\"wl wl-kjv\" data-code=\"H948\">linen</span> and <span class=\"wl wl-kjv\" data-code=\"H713\">purple:</span> and the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> of <span class=\"wl wl-kjv\" data-code=\"H7800\">Shushan</span> <span class=\"wl wl-kjv\" data-code=\"H6670\">rejoiced</span> and was glad.", "16": "The <span class=\"wl wl-kjv\" data-code=\"H3064\">Jews</span> had <span class=\"wl wl-kjv\" data-code=\"H219\">light,</span> and <span class=\"wl wl-kjv\" data-code=\"H8057\">gladness,</span> and <span class=\"wl wl-kjv\" data-code=\"H8342\">joy,</span> and honour.", "17": "And in every <span class=\"wl wl-kjv\" data-code=\"H4082\">province,</span> and in every <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> <span class=\"wl wl-kjv\" data-code=\"H4725\">whithersoever</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H1697\">commandment</span> and his <span class=\"wl wl-kjv\" data-code=\"H1881\">decree</span> <span class=\"wl wl-kjv\" data-code=\"H5060\">came,</span> the <span class=\"wl wl-kjv\" data-code=\"H3064\">Jews</span> had <span class=\"wl wl-kjv\" data-code=\"H8057\">joy</span> and <span class=\"wl wl-kjv\" data-code=\"H8342\">gladness,</span> a <span class=\"wl wl-kjv\" data-code=\"H4960\">feast</span> and a <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day.</span> And <span class=\"wl wl-kjv\" data-code=\"H7227\">many</span> of the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> became <span class=\"wl wl-kjv\" data-code=\"H3054\">Jews;</span> for the <span class=\"wl wl-kjv\" data-code=\"H6343\">fear</span> of the <span class=\"wl wl-kjv\" data-code=\"H3064\">Jews</span> fell"}};
