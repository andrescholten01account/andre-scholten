","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"In de twaalfde maand nu (dat is de maand Adar), op de dertiende dag daarvan, toen het woord en de wet van de koning nabij gekomen waren om uitgevoerd te worden, op de dag dat de vijanden van de Joden hoopten over hen te heersen, gebeurde het omgekeerde: de Joden zelf heersten over hun haters.","2":"De Joden verzamelden zich in hun steden, in alle landschappen van koning Ahasveros, om de hand te slaan aan hen die hun verderf zochten; en niemand hield stand voor hen, want de schrik voor hen was op alle volken gevallen.","3":"En alle leiders van de landschappen, en de stadhouders, en de landvoogden, en zij die het werk van de koning deden, hielpen de Joden; want de vrees voor Mordechai was op hen gevallen.","4":"Want Mordechai was groot in het huis van de koning, en zijn faam ging uit door alle landschappen; want die man, Mordechai, werd steeds groter.","5":"De Joden nu sloegen op al hun vijanden, met de slag van het zwaard, en met doding, en met verderving; en zij deden met hun haters naar hun eigen goeddunken.","6":"En in de burcht Susan hebben de Joden vijfhonderd mannen gedood en omgebracht.","7":"En Parsandatha, en Dalfon, en Asfata,","8":"en Poratha, en Adalia, en Aridatha,","9":"en Parmastha, en Arisai, en Aridai, en Vaizatha,","10":"de tien zonen van Haman, de zoon van Hammedatha, de vijand van de Joden, doodden zij; maar zij sloegen hun handen niet aan de roof.","11":"Op diezelfde dag kwam het aantal gedoden op de burcht Susan bij de koning.","12":"En de koning zei tegen koningin Esther: In Susan, op de burcht, hebben de Joden vijfhonderd mannen en de tien zonen van Haman gedood en omgebracht; wat hebben ze dan in de rest van de landschappen van de koning gedaan? Wat is nu uw verzoek? Het zal u gegeven worden; of wat is verder uw wens? Het zal gebeuren.","13":"Toen zei Esther: Als het de koning goeddunkt, laat men ook morgen aan de Joden die in Susan zijn, toestaan te doen naar het gebod van vandaag; en laat men de tien zonen van Haman aan de galg hangen.","14":"Toen zei de koning dat men dat zou doen; en er werd een gebod gegeven in Susan, en men hing de tien zonen van Haman op.","15":"En de Joden die in Susan waren, verzamelden zich ook op de veertiende dag van de maand Adar, en zij doodden in Susan driehonderd mannen; maar zij sloegen hun hand niet aan de roof.","16":"De overige Joden nu, die in de landschappen van de koning waren, verzamelden zich om op te komen voor hun leven, en rust te hebben van hun vijanden; en zij doodden onder hun haters vijfenzeventigduizend; maar zij sloegen hun hand niet aan de roof.","17":"Dit gebeurde op de dertiende dag van de maand Adar; en op de veertiende daarvan rustten zij, en zij maakten die tot een dag van maaltijden en vreugde.","18":"En de Joden die in Susan waren, verzamelden zich op de dertiende daarvan, en op de veertiende daarvan; en zij rustten op de vijftiende daarvan, en zij maakten die tot een dag van maaltijden en vreugde.","19":"Daarom maakten de Joden van de dorpen, die in de dorpsteden woonden, van de veertiende dag van de maand Adar een dag van vreugde en maaltijden, en een vrolijke dag, en van het zenden van gedeelten aan elkaar.","20":"En Mordechai schreef deze gebeurtenissen op; en hij zond brieven aan alle Joden die in alle landschappen van koning Ahasveros waren, aan hen die dichtbij, en aan hen die ver weg waren,","21":"om onder hen vast te leggen dat zij de veertiende dag van de maand Adar zouden houden, en de vijftiende dag daarvan, elk jaar opnieuw;","22":"naar de dagen waarop de Joden tot rust gekomen waren van hun vijanden, en de maand die voor hen veranderd was van droefheid in blijdschap, en van rouw in een vrolijke dag; dat zij die dagen zouden maken tot dagen van maaltijden en vreugde, en van het zenden van gedeelten aan elkaar, en van gaven aan de armen.","23":"En de Joden namen aan te doen wat zij begonnen waren, en wat Mordechai aan hen geschreven had.","24":"Omdat Haman, de zoon van Hammedatha, de Agagiet, de vijand van alle Joden, tegen de Joden bedacht had hen om te brengen; en omdat hij het Pur, dat is het lot, geworpen had om hen te verslaan en om hen om te brengen.","25":"Maar toen zij voor de koning gekomen was, heeft hij door brieven bevolen dat zijn boze plan, dat hij bedacht had tegen de Joden, op zijn eigen hoofd zou terugkeren; en men heeft hem en zijn zonen aan de galg gehangen.","26":"Daarom noemt men die dagen Purim, naar de naam van dat Pur. Hierom, vanwege alle woorden van die brief, en wat zij zelf daarvan gezien hadden, en wat hun overkomen was,","27":"legden de Joden vast, en namen op zich en op hun nageslacht, en op allen die zich bij hen zouden aansluiten, dat men het niet zou overtreden, dat zij deze twee dagen zouden houden, naar het voorschrift ervan, en naar de vastgestelde tijd ervan, elk jaar opnieuw;","28":"dat deze dagen herdacht en gehouden zouden worden, in elk geslacht, elk huisgezin, elk landschap en elke stad; en dat deze dagen van Purim niet overtreden zouden worden onder de Joden, en dat de herinnering eraan geen einde zou nemen bij hun nageslacht.","29":"Daarna schreef koningin Esther, de dochter van Abichaïl, en Mordechai, de Jood, met alle macht, om deze brief van Purim voor de tweede maal te bevestigen.","30":"En hij zond de brieven aan alle Joden, in de honderdzevenentwintig landschappen van het koninkrijk van Ahasveros, met woorden van vrede en trouw;","31":"dat zij deze dagen van Purim zouden bevestigen op hun vastgestelde tijden, zoals Mordechai, de Jood, over hen bevestigd had, en Esther, de koningin, en zoals zij het bevestigd hadden voor zichzelf en voor hun nageslacht; de zaken van het vasten en hun geroep.","32":"En het bevel van Esther bevestigde de gebeurtenissen van deze Purim, en het werd in een boek geschreven."},"SV":{"1":"In de twaalfde maand nu ( dezelve is de maand Adar), op den dertienden dag derzelve, toen des konings woord en zijn wet nabij gekomen was, dat men het doen zou, ten dage, als de vijanden der Joden hoopten over hen te heersen, zo is het omgekeerd, want de Joden heersten zelven over hun haters.","2":"*Want* de Joden vergaderden zich in hun steden, in al de landschappen van den koning Ahasveros, om de hand te slaan aan degenen, die hun verderf zochten; en niemand bestond voor hen, want hunlieder schrik was op al die volken gevallen.","3":"En al de oversten der landschappen, en de stadhouders, en landvoogden, en die het werk des konings deden, verhieven de Joden; want de vreze van Mordechai was op hen gevallen.","4":"Want Mordechai was groot in het huis des konings, en zijn gerucht ging uit door alle landschappen; want die man, Mordechai, werd doorgaans groter.","5":"De Joden nu sloegen op al hun vijanden, met den slag des zwaards, en der doding, en der verderving; en zij deden met hun haters naar hun welbehagen.","6":"En in den burg Susan hebben de Joden gedood en omgebracht vijfhonderd mannen.","7":"En Parsandatha, en Dalfon, en Asfata,","8":"En Poratha, en Adalia, en Aridatha,","9":"En Parmastha, en Arisai, en Aridai, en Vaizatha,","10":"De tien zonen van Haman, den zoon van Hammedatha, den vijand der Joden, doodden zij; maar zij sloegen hun handen niet aan den roof.","11":"Ten zelfden dage kwam voor den koning het getal der gedoden op den burg Susan.","12":"En de koning zeide tot de koningin Esther: Te Susan op den burg hebben de Joden gedood en omgebracht vijfhonderd mannen en de tien zonen van Haman; wat hebben zij in al de andere landschappen des konings gedaan? Wat is nu uw bede? en het zal u gegeven worden; of wat is verder uw verzoek? het zal geschieden.","13":"Toen zeide Esther: Dunkt het den koning goed, men late ook morgen den Joden, die te Susan zijn, toe, te doen naar het gebod van heden; en men hange de tien zonen van Haman aan de galg.","14":"Toen zeide de koning, dat men alzo doen zou; en er werd een gebod gegeven te Susan, en men hing de tien zonen van Haman op.","15":"En de Joden, die te Susan waren, vergaderden ook op den veertienden dag der maand Adar, en zij doodden te Susan driehonderd mannen; maar zij sloegen hun hand niet aan den roof.","16":"De overige Joden nu, die in de landschappen des konings waren, vergaderden, opdat zij stonden voor hun leven, en rust hadden van hun vijanden, en zij doodden onder hun haters vijf en zeventig duizend; maar zij sloegen hun hand niet aan den roof.","17":"*Dit* *geschiedde* op den dertienden dag der maand Adar; en op den veertienden derzelve rustten zij, en zij maakten denzelven een dag der maaltijden en der vreugde.","18":"En de Joden, die te Susan waren, vergaderden op den dertienden derzelve, en op den veertienden derzelve; en zij rustten op den vijftienden derzelve, en zij maakten denzelven een dag der maaltijden en der vreugde.","19":"Daarom maakten de Joden van de dorpen, die in de dorpsteden woonden, den veertienden dag der maand Adar ter vreugde en maaltijden, en een vrolijken dag, en der zending van delen aan elkander.","20":"En Mordechai beschreef deze geschiedenissen; en hij zond brieven aan al de Joden, die in al de landschappen van den koning Ahasveros waren, dien, die nabij, en dien, die verre waren,","21":"Om over hen te bevestigen, dat zij zouden onderhouden den veertienden dag der maand Adar, en den vijftienden dag derzelve, in alle en in ieder jaar;","22":"Naar de dagen, in dewelke de Joden tot rust gekomen waren van hun vijanden, en de maand, die hun veranderd was van droefenis in blijdschap, en van rouw in een vrolijken dag; dat zij dezelve *dagen* maken zouden *tot* dagen der maaltijden, en der vreugde, en der zending van delen aan elkander, en der gaven aan de armen.","23":"En de Joden namen aan te doen, wat zij begonnen hadden, en dat Mordechai aan hen geschreven had.","24":"Omdat Haman, de zoon van Hammedatha, den Agagiet, aller Joden vijand, tegen de Joden gedacht had hen om te brengen; en dat hij het Pur, dat is, het lot had geworpen, om hen te verslaan, en om hen om te brengen.","25":"Maar als zij voor den koning gekomen was, heeft hij door brieven bevolen, dat zijn boze gedachte, die hij gedacht had over de Joden, op zijn hoofd zou wederkeren; en men heeft hem en zijn zonen aan de galg gehangen.","26":"Daarom noemt men die dagen Purim, van den naam van dat Pur. Hierom, vanwege al de woorden van dien brief, en hetgeen zij zelven daarvan gezien hadden, en wat tot hen overgekomen was,","27":"Bevestigden de Joden, en namen op zich en op hun zaad, en op allen, die zich tot hen vervoegen zouden, dat men het niet overtrade, dat zij deze twee dagen zouden houden, naar het voorschrift derzelve, en naar den bestemden tijd derzelve, in alle en ieder jaar;","28":"Dat deze dagen gedacht zouden worden en onderhouden, in alle en elk geslacht, elk huisgezin, elk landschap en elke stad; en dat deze dagen van Purim niet zouden overtreden worden onder de Joden, en dat de gedachtenis derzelve geen einde nemen zou bij hun zaad.","29":"Daarna schreef de koningin Esther, de dochter van Abichaïl, en Mordechai, de Jood, met alle macht, om dezen brief van Purim ten tweeden male te bevestigen.","30":"En hij zond de brieven aan al de Joden, in de honderd zeven en twintig landschappen van het koninkrijk van Ahasveros, met woorden van vrede en trouw;","31":"Dat zij deze dagen van Purim bevestigen zouden op hun bestemde tijden, gelijk als Mordechai, de Jood, over hen bevestigd had, en Esther, de koningin, en gelijk als zij het bevestigd hadden voor zichzelven en voor hun zaad; de zaken van het vasten en hunlieder geroep.","32":"En het bevel van Esther bevestigde de geschiedenissen van deze Purim, en het werd in een boek geschreven."},"KJV":{"1":"Now in the twelfth month, that *is*, the month Adar, on the thirteenth day of the same, when the king's commandment and his decree drew near to be put in execution, in the day that the enemies of the Jews hoped to have power over them, (though it was turned to the contrary, that the Jews had rule over them that hated","2":"The Jews gathered themselves together in their cities throughout all the provinces of the king Ahasuerus, to lay hand on such as sought their hurt: and no man could withstand them; for the fear of them fell upon all people.","3":"And all the rulers of the provinces, and the lieutenants, and the deputies, and officers of the king, helped the Jews; because the fear of Mordecai fell","4":"For Mordecai *was* great in the king's house, and his fame went out throughout all the provinces: for this man Mordecai waxed greater and greater.","5":"Thus the Jews smote all their enemies with the stroke of the sword, and slaughter, and destruction, and did what they would unto those that hated","6":"And in Shushan the palace the Jews slew and destroyed five hundred men.","7":"And Parshandatha, and Dalphon, and Aspatha,","8":"And Poratha, and Adalia, and Aridatha,","9":"And Parmashta, and Arisai, and Aridai, and Vajezatha,","10":"The ten sons of Haman the son of Hammedatha, the enemy of the Jews, slew they; but on the spoil laid they not their hand.","11":"On that day the number of those that were slain in Shushan the palace was brought before the king.","12":"And the king said unto Esther the queen, The Jews have slain and destroyed five hundred men in Shushan the palace, and the ten sons of Haman; what have they done in the rest of the king's provinces? now what *is* thy petition? and it shall be granted thee: or what *is* thy request further? and it shall be done.","13":"Then said Esther, If it please the king, let it be granted to the Jews which *are* in Shushan to do to morrow also according unto this day's decree, and let Haman's ten sons be hanged upon the gallows.","14":"And the king commanded it so to be done: and the decree was given at Shushan; and they hanged Haman's ten sons.","15":"For the Jews that *were* in Shushan gathered themselves together on the fourteenth day also of the month Adar, and slew three hundred men at Shushan; but on the prey they laid not their hand.","16":"But the other Jews that *were* in the king's provinces gathered themselves together, and stood for their lives, and had rest from their enemies, and slew of their foes seventy and five thousand, but they laid not their hands on the prey,","17":"On the thirteenth day of the month Adar; and on the fourteenth day of the same rested they, and made it a day of feasting and gladness.","18":"But the Jews that *were* at Shushan assembled together on the thirteenth *day* thereof, and on the fourteenth thereof; and on the fifteenth *day* of the same they rested, and made it a day of feasting and gladness.","19":"Therefore the Jews of the villages, that dwelt in the unwalled towns, made the fourteenth day of the month Adar *a day of* gladness and feasting, and a good day, and of sending portions one to another.","20":"And Mordecai wrote these things, and sent letters unto all the Jews that *were* in all the provinces of the king Ahasuerus, *both* nigh and far,","21":"To stablish *this* among them, that they should keep the fourteenth day of the month Adar, and the fifteenth day of the same, yearly,","22":"As the days wherein the Jews rested from their enemies, and the month which was turned unto them from sorrow to joy, and from mourning into a good day: that they should make them days of feasting and joy, and of sending portions one to another, and gifts to the poor.","23":"And the Jews undertook to do as they had begun, and as Mordecai had written","24":"Because Haman the son of Hammedatha, the Agagite, the enemy of all the Jews, had devised against the Jews to destroy them, and had cast Pur, that *is*, the lot, to consume them, and to destroy","25":"But when *Esther* came before the king, he commanded by letters that his wicked device, which he devised against the Jews, should return upon his own head, and that he and his sons should be hanged on the gallows.","26":"Wherefore they called these days Purim after the name of Pur. Therefore for all the words of this letter, and *of that* which they had seen concerning this matter, and which had come","27":"The Jews ordained, and took upon them, and upon their seed, and upon all such as joined themselves unto them, so as it should not fail, that they would keep these two days according to their writing, and according to their *appointed* time every year;","28":"And *that* these days *should be* remembered and kept throughout every generation, every family, every province, and every city; and *that* these days of Purim should not fail from among the Jews, nor the memorial of them perish from their seed.","29":"Then Esther the queen, the daughter of Abihail, and Mordecai the Jew, wrote with all authority, to confirm this second letter of Purim.","30":"And he sent the letters unto all the Jews, to the hundred twenty and seven provinces of the kingdom of Ahasuerus, *with* words of peace and truth,","31":"To confirm these days of Purim in their times *appointed*, according as Mordecai the Jew and Esther the queen had enjoined them, and as they had decreed for themselves and for their seed, the matters of the fastings and their cry.","32":"And the decree of Esther confirmed these matters of Purim; and it was writ l-kjv\" data-code=\"H6950\">together</span> in their <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> throughout all the <span class=\"wl wl-kjv\" data-code=\"H4082\">provinces</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H325\">Ahasuerus,</span> to <span class=\"wl wl-kjv\" data-code=\"H7971\">lay</span> <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> on such as <span class=\"wl wl-kjv\" data-code=\"H1245\">sought</span> their <span class=\"wl wl-kjv\" data-code=\"H7451\">hurt:</span> and no <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> could <span class=\"wl wl-kjv\" data-code=\"H5975\">withstand</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">them;</span> for the <span class=\"wl wl-kjv\" data-code=\"H6343\">fear</span> of them <span class=\"wl wl-kjv\" data-code=\"H5307\">fell</span> upon all people.","3":"And all the <span class=\"wl wl-kjv\" data-code=\"H8269\">rulers</span> of the <span class=\"wl wl-kjv\" data-code=\"H4082\">provinces,</span> and the <span class=\"wl wl-kjv\" data-code=\"H323\">lieutenants,</span> and the <span class=\"wl wl-kjv\" data-code=\"H6346\">deputies,</span> and <span class=\"wl wl-kjv\" data-code=\"H6213\">officers</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> <span class=\"wl wl-kjv\" data-code=\"H5375\">helped</span> the <span class=\"wl wl-kjv\" data-code=\"H3064\">Jews;</span> because the <span class=\"wl wl-kjv\" data-code=\"H6343\">fear</span> of <span class=\"wl wl-kjv\" data-code=\"H4782\">Mordecai</span> fell","4":"For <span class=\"wl wl-kjv\" data-code=\"H4782\">Mordecai</span> was <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> in the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> and his <span class=\"wl wl-kjv\" data-code=\"H8089\">fame</span> went <span class=\"wl wl-kjv\" data-code=\"H1980\">out</span> throu span> of <span class=\"wl wl-kjv\" data-code=\"H2001\">Haman</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H4099\">Hammedatha,</span> the <span class=\"wl wl-kjv\" data-code=\"H6887\">enemy</span> of the <span class=\"wl wl-kjv\" data-code=\"H3064\">Jews,</span> <span class=\"wl wl-kjv\" data-code=\"H2026\">slew</span> they; but on the <span class=\"wl wl-kjv\" data-code=\"H961\">spoil</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">laid</span> they not their hand.","11":"On that <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> the <span class=\"wl wl-kjv\" data-code=\"H4557\">number</span> of those that were <span class=\"wl wl-kjv\" data-code=\"H2026\">slain</span> in <span class=\"wl wl-kjv\" data-code=\"H7800\">Shushan</span> the <span class=\"wl wl-kjv\" data-code=\"H1002\">palace</span> was <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the king.","12":"And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H635\">Esther</span> the <span class=\"wl wl-kjv\" data-code=\"H4436\">queen,</span> The <span class=\"wl wl-kjv\" data-code=\"H3064\">Jews</span> have <span class=\"wl wl-kjv\" data-code=\"H2026\">slain</span> and <span class=\"wl wl-kjv\" data-code=\"H6\">destroyed</span> <span class=\"wl wl-kjv\" data-code=\"H2568\">five</span> <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> <span class=\"wl wl-kjv\" data-code=\"H376\">men</span> in <span class=\"wl wl-kjv\" data-code=\"H7800\">Shushan</span> the <span class=\"wl wl-kjv\" data-code=\"H1002\">palace,</span> and the <span class=\"wl wl-kjv\" data-code=\"H6235\">ten</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H2001\">Haman;</span> what have they <span class=\"wl wl-kjv\" data-co hword":null,"tekst":"For Mordecai was great [That is, in great respect and authority] in the kings house, and his fame went out throughout all the countries: for that man Mordecai waxed still greater (and greater) [that is, he waxed every day greater and greater. See this phrase Gen 26:13. with the annotate. Hebr. going and waxing great.]"}],"5":[{"catchword":null,"tekst":"Now the Jews smote upon all their enemies, with the stroke of the sword, and of slaughter, and of destruction: [That is, they smote, and slew, and destroyed with the sword all their enemies] and they did with their haters according to their pleasure."}],"6":[{"catchword":null,"tekst":"And in the Castle of Susan the Jews slew and destroyed five hundred men. [Some conceive that these five hundred men were friends and allies of Haman, wherefore the king regarded their deaths the less, as suspecting that they might attempt something against him, to revenge Hamans death.]"}],"7":[{"catchword":null,"tekst":"And Pharshandatha, and Dalphon, and Asphatha,"}],"8":[{"catchword":null,"tekst":"And Pocatha, and Adalia, and Aridatha,"}],"9":[{"catchword":null,"tekst":"And Pharmastha, and Aridai, and Vaizatha,"}],"10":[{"catchword":null,"tekst":"The ten sons of Haman, [See Exo 17:14. and Duet.25.17. where command is given to destroy Amalek] the son of Hammedatha, the Jews enemy, slew they: [not onely in regard of the wicked plot of their father; but also in regard of the commandment of God, Exo 17:14] but they laid not their hands on the spoil. [that is, they took not the goods of the slain unto themselves (although the king had given them leave to do so): why? Because they would not wrong or diminish the kings treasury: as also that they might make it appear, that they had not slain their enemies, for filthy lucres sake, and for their own profit; but onely to defend their lives and estate, and because necessity required it; for otherwise the kings decree would not have been reversed.]"}],"11":[{"catchword":null,     `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');

    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');

    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'

    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };

})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:"Lora";font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
