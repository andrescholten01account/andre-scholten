deden, hielpen de Joden; want de vrees voor Mordechai was op hen gevallen.", "4": "Want Mordechai was groot in het huis van de koning, en zijn faam ging uit door alle landschappen; want die man, Mordechai, werd steeds groter.", "5": "De Joden nu sloegen op al hun vijanden, met de slag van het zwaard, en met doding, en met verderving; en zij deden met hun haters naar hun eigen goeddunken.", "6": "En in de burcht Susan hebben de Joden vijfhonderd mannen gedood en omgebracht.", "7": "En Parsandatha, en Dalfon, en Asfata,", "8": "en Poratha, en Adalia, en Aridatha,", "9": "en Parmastha, en Arisai, en Aridai, en Vaizatha,", "10": "de tien zonen van Haman, de zoon van Hammedatha, de vijand van de Joden, doodden zij; maar zij sloegen hun handen niet aan de roof.", "11": "Op diezelfde dag kwam het aantal gedoden op de burcht Susan bij de koning.", "12": "En de koning zei tegen koningin Esther: In Susan, op de burcht, hebben de Joden vijfhonderd mannen en de tien zonen van Haman gedood en omgebracht; wat hebben ze dan in de rest van de landschappen van de koning gedaan? Wat is nu uw verzoek? Het zal u gegeven worden; of wat is verder uw wens? Het zal gebeuren.", "13": "Toen zei Esther: Als het de koning goeddunkt, laat men ook morgen aan de Joden die in Susan zijn, toestaan te doen naar het gebod van vandaag; en laat men de tien zonen van Haman aan de galg hangen.", "14": "Toen zei de koning dat men dat zou doen; en er werd een gebod gegeven in Susan, en men hing de tien zonen van Haman op.", "15": "En de Joden die in Susan waren, verzamelden zich ook op de veertiende dag van de maand Adar, en zij doodden in Susan driehonderd mannen; maar zij sloegen hun hand niet aan de roof.", "16": "De overige Joden nu, die in de landschappen van de koning waren, verzamelden zich om op te komen voor hun leven, en rust te hebben van hun vijanden; en zij doodden onder hun haters vijfenzeventigduizend; maar zij sloegen hun hand niet aan de roof.", "17": "Dit gebeurde op de dertiende dag van de maand Adar; en op de veertiende daarvan rustten zij, en zij maakten die tot een dag van maaltijden en vreugde.", "18": "En de Joden die in Susan waren, verzamelden zich op de dertiende daarvan, en op de veertiende daarvan; en zij rustten op de vijftiende daarvan, en zij maakten die tot een dag van maaltijden en vreugde.", "19": "Daarom maakten de Joden van de dorpen, die in de dorpsteden woonden, van de veertiende dag van de maand Adar een dag van vreugde en maaltijden, en een vrolijke dag, en van het zenden van gedeelten aan elkaar.", "20": "En Mordechai schreef deze gebeurtenissen op; en hij zond brieven aan alle Joden die in alle landschappen van koning Ahasveros waren, aan hen die dichtbij, en aan hen die ver weg waren,", "21": "om onder hen vast te leggen dat zij de veertiende dag van de maand Adar zouden houden, en de vijftiende dag daarvan, elk jaar opnieuw;", "22": "naar de dagen waarop de Joden tot rust gekomen waren van hun vijanden, en de maand die voor hen veranderd was van droefheid in blijdschap, en van rouw in een vrolijke dag; dat zij die dagen zouden maken tot dagen van maaltijden en vreugde, en van het zenden van gedeelten aan elkaar, en van gaven aan de armen.", "23": "En de Joden namen aan te doen wat zij begonnen waren, en wat Mordechai aan hen geschreven had.", "24": "Omdat Haman, de zoon van Hammedatha, de Agagiet, de vijand van alle Joden, tegen de Joden bedacht had hen om te brengen; en omdat hij het Pur, dat is het lot, geworpen had om hen te verslaan en om hen om te brengen.", "25": "Maar toen zij voor de koning gekomen was, heeft hij door brieven bevolen dat zijn boze plan, dat hij bedacht had tegen de Joden, op zijn eigen hoofd zou terugkeren; en men heeft hem en zijn zonen aan de galg gehangen.", "26": "Daarom noemt men die dagen Purim, naar de naam van dat Pur. Hierom, vanwege alle woorden van die brief, en wat zij zelf daarvan gezien hadden, en wat hun overkomen was,", "27": "legden de Joden vast, en namen op zich en op hun nageslacht, en op allen die zich bij hen zouden aansluiten, dat men het niet zou overtreden, dat zij deze twee dagen zouden houden, naar het voorschrift ervan, en naar de vastgestelde tijd ervan, elk jaar opnieuw;", "28": "dat deze dagen herdacht en gehouden zouden worden, in elk geslacht, elk huisgezin, elk landschap en elke stad; en dat deze dagen van Purim niet overtreden zouden worden onder de Joden, en dat de herinnering eraan geen einde zou nemen bij hun nageslacht.", "29": "Daarna schreef koningin Esther, de dochter van Abichaïl, en Mordechai, de Jood, met alle macht, om deze brief van Purim voor de tweede maal te bevestigen.", "30": "En hij zond de brieven aan alle Joden, in de honderdzevenentwintig landschappen van het koninkrijk van Ahasveros, met woorden van vrede en trouw;", "31": "dat zij deze dagen van Purim zouden bevestigen op hun vastgestelde tijden, zoals Mordechai, de Jood, over hen bevestigd had, en Esther, de koningin, en zoals zij het bevestigd hadden voor zichzelf en voor hun nageslacht; de zaken van het vasten en hun geroep.", "32": "En het bevel van Esther bevestigde de gebeurtenissen van deze Purim, en het werd in een boek geschreven."}, "SV": {"1": "In de twaalfde maand nu ( dezelve is de maand Adar), op den dertienden dag derzelve, toen des konings woord en zijn wet nabij gekomen was, dat men het doen zou, ten dage, als de vijanden der Joden hoopten over hen te heersen, zo is het omgekeerd, want de Joden heersten zelven over hun haters.", "2": "*Want* de Joden vergaderden zich in hun steden, in al de landschappen van den koning Ahasveros, om de hand te slaan aan degenen, die hun verderf zochten; en niemand bestond voor hen, want hunlieder schrik was op al die volken gevallen.", "3": "En al de oversten der landschappen, en de stadhouders, en landvoogden, en die het werk des konings deden, verhieven de Joden; want de vreze van Mordechai was op hen gevallen.", "4": "Want Mordechai was groot in het huis des konings, en zijn gerucht ging uit door alle landschappen; want die man, Mordechai, werd doorgaans groter.", "5": "De Joden nu sloegen op al hun vijanden, met den slag des zwaards, en der doding, en der verderving; en zij deden met hun haters naar hun welbehagen.", "6": "En in den burg Susan hebben de Joden gedood en omgebracht vijfhonderd mannen.", "7": "En Parsandatha, en Dalfon, en Asfata,", "8": "En Poratha, en Adalia, en Aridatha,", "9": "En Parmastha, en Arisai, en Aridai, en Vaizatha,", "10": "De tien zonen van Haman, den zoon van Hammedatha, den vijand der Joden, doodden zij; maar zij sloegen hun handen niet aan den roof.", "11": "Ten zelfden dage kwam voor den koning het getal der gedoden op den burg Susan.", "12": "En de koning zeide tot de koningin Esther: Te Susan op den burg hebben de Joden gedood en omgebracht vijfhonderd mannen en de tien zonen van Haman; wat hebben zij in al de andere landschappen des konings gedaan? Wat is nu uw bede? en het zal u gegeven worden; of wat is verder uw verzoek? het zal geschieden.", "13": "Toen zeide Esther: Dunkt het den koning goed, men late ook morgen den Joden, die te Susan zijn, toe, te doen naar het gebod van heden; en men hange de tien zonen van Haman aan de galg.", "14": "Toen zeide de koning, dat men alzo doen zou; en er werd een gebod gegeven te Susan, en men hing de tien zonen van Haman op.", "15": "En de Joden, die te Susan waren, vergaderden ook op den veertienden dag der maand Adar, en zij doodden te Susan driehonderd mannen; maar zij sloegen hun hand niet aan den roof.", "16": "De overige Joden nu, die in de landschappen des konings waren, vergaderden, opdat zij stonden voor hun leven, en rust hadden van hun vijanden, en zij doodden onder hun haters vijf en zeventig duizend; maar zij sloegen hun hand niet aan den roof.", "17": "*Dit* *geschiedde* op den dertienden dag der maand Adar; en op den veertienden derzelve rustten zij, en zij maakten denzelven een dag der maaltijden en der vreugde.", "18": "En de Joden, die te Susan waren, vergaderden op den dertienden derzelve, en op den veertienden derzelve; en zij rustten op den vijftienden derzelve, en zij maakten denzelven een dag der maaltijden en der vreugde.", "19": "Daarom maakten de Joden van de dorpen, die in de dorpsteden woonden, den veertienden dag der maand Adar ter vreugde en maaltijden, en een vrolijken dag, en der zending van delen aan elkander.", "20": "En Mordechai beschreef deze geschiedenissen; en hij zond brieven aan al de Joden, die in al de landschappen van den koning Ahasveros waren, dien, die nabij, en dien, die verre waren,", "21": "Om over hen te bevestigen, dat zij zouden onderhouden den veertienden dag der maand Adar, en den vijftienden dag derzelve, in alle en in ieder jaar;", "22": "Naar de dagen, in dewelke de Joden tot rust gekomen waren van hun vijanden, en de maand, die hun veranderd was van droefenis in blijdschap, en van rouw in een vrolijken dag; dat zij dezelve *dagen* maken zouden *tot* dagen der maaltijden, en der vreugde, en der zending van delen aan elkander, en der gaven aan de armen.", "23": "En de Joden namen aan te doen, wat zij begonnen hadden, en dat Mordechai aan hen geschreven had.", "24": "Omdat Haman, de zoon van Hammedatha, den Agagiet, aller Joden vijand, tegen de Joden gedacht had hen om te brengen; en dat hij het Pur, dat is, het lot had geworpen, om hen te verslaan, en om hen om te brengen.", "25": "Maar als zij voor den koning gekomen was, heeft hij door brieven bevolen, dat zijn boze gedachte, die hij gedacht had over de Joden, op zijn hoofd zou wederkeren; en men heeft hem en zijn zonen aan de galg gehangen.", "26": "Daarom noemt men die dagen Purim, van den naam van dat Pur. Hierom, vanwege al de woorden van dien brief, en hetgeen zij zelven daarvan gezien hadden, en wat tot hen overgekomen was,", "27": "Bevestigden de Joden, en namen op zich en op hun zaad, en op allen, die zich tot hen vervoegen zouden, dat men het niet overtrade, dat zij deze twee dagen zouden houden, naar het voorschrift derzelve, en naar den bestemden tijd derzelve, in alle en ieder jaar;", "28": "Dat deze dagen gedacht zouden worden en onderhouden, in alle en elk geslacht, elk huisgezin, elk landschap en elke stad; en dat deze dagen van Purim niet zouden overtreden worden onder de Joden, en dat de gedachtenis derzelve geen einde nemen zou bij hun zaad.", "29": "Daarna schreef de koningin Esther, de dochter van Abichaïl, en Mordechai, de Jood, met alle macht, om dezen brief van Purim ten tweeden male te bevestigen.", "30": "En hij zond de brieven aan al de Joden, in de honderd zeven en twintig landschappen van het koninkrijk van Ahasveros, met woorden van vrede en trouw;", "31": "Dat zij deze dagen van Purim bevestigen zouden op hun bestemde tijden, gelijk als Mordechai, de Jood, over hen bevestigd had, en Esther, de koningin, en gelijk als zij het bevestigd hadden voor zichzelven en voor hun zaad; de zaken van het vasten en hunlieder geroep.", "32": "En het bevel van Esther bevestigde de geschiedenissen van deze Purim, en het werd in een boek geschreven."}, "KJV": {"1": "Now in the twelfth month, that *is*, the month Adar, on the thirteenth day of the same, when the king's commandment and his decree drew near to be put in execution, in the day that the enemies of the Jews hoped to have power over them, (though it was turned to the contrary, that the Jews had rule over them that hated", "2": "The Jews gathered themselves together in their cities throughout all the provinces of the king Ahasuerus, to lay hand on such as sought their hurt: and no man could withstand them; for the fear of them fell upon all people.", "3": "And all the rulers of the provinces, and the lieutenants, and the deputies, and officers of the king, helped the Jews; because the fear of Mordecai fell", "4": "For Mordecai *was* great in the king's house, and his fame went out throughout all the provinces: for this man Mordecai waxed greater and greater.", "5": "Thus the Jews smote all their enemies with the stroke of the sword, and slaughter, and destruction, and did what they would unto those that hated", "6": "And in Shushan the palace the Jews slew and destroyed five hundred men.", "7": "And Parshandatha, and Dalphon, and Aspatha,", "8": "And Poratha, and Adalia, and Aridatha,", "9": "And Parmashta, and Arisai, and Aridai, and Vajezatha,", "10": "The ten sons of Haman the son of Hammedatha, the enemy of the Jews, slew they; but on the spoil laid they not their hand.", "11": "On that day the number of those that were slain in Shushan the palace was brought before the king.", "12": "And the king said unto Esther the queen, The Jews have slain and destroyed five hundred men in Shushan the palace, and the ten sons of Haman; what have they done in the rest of the king's provinces? now what *is* thy petition? and it shall be granted thee: or what *is* thy request further? and it shall be done.", "13": "Then said Esther, If it please the king, let it be granted to the Jews which *are* in Shushan to do to morrow also according unto this day's decree, and let Haman's ten sons be hanged upon the gallows.", "14": "And the king commanded it so to be done: and the decree was given at Shushan; and they hanged Haman's ten sons.", "15": "For the Jews that *were* in Shushan gathered themselves together on the fourteenth day also of the month Adar, and slew three hundred men at Shushan; but on the prey they laid not their hand.", "16": "But the other Jews that *were* in the king's provinces gathered themselves together, and stood for their lives, and had rest from their enemies, and slew of their foes seventy and five thousand, but they laid not their hands on the prey,", "17": "On the thirteenth day of the month Adar; and on the fourteenth day of the same rested they, and made it a day of feasting and gladness.", "18": "But the Jews that *were* at Shushan assembled together on the thirteenth *day* thereof, and on the fourteenth thereof; and on the fifteenth *day* of the same they rested, and made it a day of feasting and gladness.", "19": "Therefore the Jews of the villages, that dwelt in the unwalled towns, made the fourteenth day of the month Adar *a day of* gladness and feasting, and a good day, and of sending portions one to another.", "20": "And Mordecai wrote these things, and sent letters unto all the Jews that *were* in all the provinces of the king Ahasuerus, *both* nigh and far,", "21": "To stablish *this* among them, that they should keep the fourteenth day of the month Adar, and the fifteenth day of the same, yearly,", "22": "As the days wherein the Jews rested from their enemies, and the month which was turned unto them from sorrow to joy, and from mourning into a good day: that they should make them days of feasting and joy, and of sending portions one to another, and gifts to the poor.", "23": "And the Jews undertook to do as they had begun, and as Mordecai had written", "24": "Because Haman the son of Hammedatha, the Agagite, the enemy of all the Jews, had devised against the Jews to destroy them, and had cast Pur, that *is*, the lot, to consume them, and to destroy", "25": "But when *Esther* came before the king, he commanded by letters that his wicked device, which he devised against the Jews, should return upon his own head, and that he and his sons should be hanged on the gallows.", "26": "Wherefore they called these days Purim after the name of Pur. Therefore for all the words of this letter, and *of that* which they had seen concerning this matter, and which had come", "27": "The Jews ordained, and took upon them, and upon their seed, and upon all such as joined themselves unto them, so as it should not fail, that they would keep these two days according to their writing, and according to their *appointed* time every year;", "28": "And *that* these days *should be* remembered and kept throughout every generation, every family, every province, and every city; and *that* these days of Purim should not fail from among the Jews, nor the memo /?hl=Esth.9.30#i1953", "refs": [], "kinderen": [{"label": "At the time of Ahasuerus", "href": "../../nave/b/?hl=Esth.9.30#i1959", "refs": [{"disp": "Est 1:1", "href": "../../esther/1/#v1", "ref": "Est 1:1", "svLabel": null}, {"disp": "Est 8:9", "href": "../../esther/8/#v9", "ref": "Est 8:9", "svLabel": null}, {"disp": "Est 9:30", "href": "../../esther/9/#v30", "ref": "Est 9:30", "svLabel": null}], "kinderen": []}]}]}]}}, "extern": {"Est 1:5": "Toen die dagen voorbij waren, gaf de koning een maaltijd voor heel het volk dat zich op de burcht Susan bevond, van de grootste tot de kleinste, zeven dagen lang, in het voorhof van de tuin van het koninklijk paleis.", "Ps 7:17": "Zijn moeite zal op zijn eigen hoofd terugkeren, en zijn geweld op zijn eigen schedel neerdalen.", "Ps 18:35-41": "Hij leert mijn handen ten strijde, zodat een stalen boog met mijn armen verbroken is. Ook hebt U mij het schild van Uw heil gegeven, en Uw rechterhand heeft mij ondersteund, en Uw zachtmoedigheid heeft mij groot gemaakt. U hebt mijn voetstap ruim gemaakt onder mij, en mijn enkels hebben niet gewankeld.", "Ps 109:17": "Omdat hij de vloek heeft liefgehad, laat die hem overkomen, en heeft geen lust gehad tot de zegen, laat die dan ver van hem zijn.", "Jes 12:1": "En diezelfde dag zult u zeggen: Ik dank U, HEERE! Dat U toornig op mij geweest bent, maar Uw toorn is afgekeerd, en U troost mij.", "Est 5:14": "Toen zei zijn vrouw Zeres tegen hem, alsook al zijn vrienden: Laat men een galg maken, vijftig el hoog, en zeg morgen tegen de koning dat men Mordechai daaraan laat hangen; ga dan vrolijk met de koning naar die maaltijd. Dit voorstel nu leek Haman goed, en hij liet de galg maken.", "Jes 48:15": "Ik, Ik heb het gesproken, ook heb Ik hem geroepen; Ik zal hem doen komen, en hij zal voorspoedig zijn op zijn weg.", "Jes 54:17": "Elk instrument dat tegen u gemaakt wordt, zal niet gelukken, en elke tong, die in het gericht tegen u opstaat, zult u verdoemen; dit is het erfdeel van de knechten van de HEERE, en hun gerechtigheid is uit Mij, spreekt de HEERE.", "Richt 9:24": "opdat het geweld, gedaan aan de zeventig zonen van Jerubbaäl, tot uiting zou komen, en opdat hun bloed gelegd zou worden op Abimelech, hun broer, die hen gedood had, en op de burgers van Sichem, die zijn handen gesterkt hadden om zijn broers te doden.", "Joz 4:7": "Zo zult u tegen hen zeggen: Omdat de wateren van de Jordaan zijn afgesneden geweest voor de ark van het verbond van de HEERE; toen zij door de Jordaan trok, werden de wateren van de Jordaan afgesneden; zo zullen deze stenen de kinderen van Israël tot een gedachtenis zijn tot in eeuwigheid.", "Dan 3:2": "En de koning Nebukadnezar stuurde erop uit om te verzamelen: de stadhouders, de overheden, de landvoogden, de wethouders, de schatmeesters, de raadsheren, de opzichters, en alle heersers van de landschappen, dat zij zouden komen tot de inwijding van het beeld, dat de koning Nebukadnezar had opgericht.", "Est 5:11": "En Haman vertelde hun over de heerlijkheid van zijn rijkdom, en de veelheid van zijn zonen, en alles waarin de koning hem groot gemaakt had, en waarin hij hem verheven had boven de vorsten en dienaren van de koning.", "Jes 14:3": "En het zal gebeuren op de dag, wanneer de HEERE u rust zal geven van uw smart, en van uw onrust, en van de harde dienstbaarheid waarin men u heeft laten dienen,", "Hand 3:17": "En nu, broeders, ik weet dat u het door onwetendheid hebt gedaan, zoals ook uw leiders.", "1 Sam 2:30": "Daarom spreekt de HEERE, de God van Israël: Ik had wel duidelijk gezegd: Uw huis en het huis van uw vader zouden voor Mijn aangezicht wandelen tot in eeuwigheid; maar nu spreekt de HEERE: Dat zij verre van Mij; want die Mij eren, zal Ik eren, maar die Mij versmaden, zullen licht geacht worden.", "Jes 14:1": "Want de HEERE zal Zich over Jakob ontfermen, en Hij zal Israël nog verkiezen, en Hij zal hen in hun land zetten; en de vreemdeling zal zich bij hen voegen, en zij zullen het huis van Jakob aanhangen.", "2 Sam 3:1": "Er was een lange oorlog tussen het huis van Saul en het huis van David. Maar David werd steeds sterker, terwijl het huis van Saul steeds zwakker werd.", "Est 5:6": "zei de koning tegen Esther bij de maaltijd van de wijn: Wat is uw bede? En zij zal u gegeven worden; en wat is uw verzoek? Het zal gebeuren, ook tot de helft van het koninkrijk.", "Ps 20:8": "Dezen vermelden van wagens, en die van paarden; maar wij zullen vermelden van de Naam van de HEERE, onze God.", "Gal 3:13": "Christus heeft ons verlost van de vloek van de wet, doordat Hij voor ons een vloek geworden is; want er is geschreven: Vervloekt is ieder die aan het hout hangt.", "Ex 14:4": "En Ik zal het hart van Farao verstokken, dat hij hen najaagt; en Ik zal aan Farao en aan zijn hele leger verheerlijkt worden, zodat de Egyptenaren zullen weten dat Ik de HEERE ben. En zij deden zo.", "Jes 14:2": "En de volken zullen hen aannemen, en naar hun plaats brengen; en het huis van Israël zal hen erfelijk bezitten in het land van de HEERE tot knechten en tot dienstmeisjes; en zij zullen gevangen houden wie hen gevangen hielden, en zij zullen heersen over hun onderdrukkers.", "Ps 145:4-12": "Daleth. Geslacht aan geslacht zal Uw werken roemen; en zij zullen Uw machtige daden verkondigen. He. Ik zal uitspreken de heerlijkheid van de eer van Uw majesteit, en Uw wonderlijke daden. Vau. En zij zullen vermelden de kracht van Uw ontzagwekkende daden; en Uw grootheid, die zal ik vertellen.", "Deut 29:14": "En niet met u alleen maak ik dit verbond en deze vloek;", "Jes 10:5-7": "Wee de Assyriër, die de roede van Mijn toorn is, en Mijn grimmigheid is een stok in hun hand! Ik zal hem zenden tegen een huichelachtig volk, en Ik zal hem bevel geven tegen het volk van Mijn verbolgenheid; opdat hij de roof rooft, en plundert de plundering, en het stelt ter vertreding, als het slijk van de straten. Hoewel hij het zo niet meent, en zijn hart zo niet denkt, maar hij zal in zijn hart hebben te verdelgen, en niet weinige volken uit te roeien.", "Est 9:1-26": "In de twaalfde maand nu (dat is de maand Adar), op de dertiende dag daarvan, toen het woord en de wet van de koning nabij gekomen waren om uitgevoerd te worden, op de dag dat de vijanden van de Joden hoopten over hen te heersen, gebeurde het omgekeerde: de Joden zelf heersten over hun haters. De Joden verzamelden zich in hun steden, in alle landschappen van koning Ahasveros, om de hand te slaan aan hen die hun verderf zochten; en niemand hield stand voor hen, want de schrik voor hen was op alle volken gevallen. En alle leiders van de landschappen, en de stadhouders, en de landvoogden, en zij die het werk van de koning deden, hielpen de Joden; want de vrees voor Mordechai was op hen gevallen.", "2 Sam 21:2": "Toen riep de koning de Gibeonieten, en zei tegen hen: (De Gibeonieten nu waren niet van de kinderen van Israël, maar van het overblijfsel van de Amorieten; en de kinderen van Israël hadden hun gezworen, maar Saul zocht hen te doden in zijn ijver voor de kinderen van Israël en Juda.)", "Neh 8:13": "Toen ging heel het volk weg om te eten en te drinken en delen te sturen en grote blijdschap te bedrijven; want zij hadden de woorden begrepen die men hun bekendgemaakt had.", "Est 7:6": "En Esther zei: De man, de onderdrukker en vijand, is deze boze Haman! Toen schrok Haman voor het aangezicht van de koning en de koningin.", "Est 1:2": "in die dagen, toen de koning Ahasveros op de troon van zijn koninkrijk zat, die op de burcht Susan was,", "Jes 41:4": "Wie heeft dit gedaan en tot stand gebracht, terwijl Hij de geslachten riep van het begin af? Ik, de HEERE, Die de Eerste ben, en met de Laatste ben Ik Dezelfde.", "Ps 20:9": "Zij hebben zich gekromd, en zijn gevallen; maar wij zijn opgestaan en staande gebleven.", "Gen 45:5-7": "Maar nu, weest niet bekommerd, en de toorn ontsteekt niet in uw ogen, omdat u mij hierheen verkocht hebt; want God heeft mij voor uw aangezicht gezonden, tot behoud van het leven. Want het zijn nu twee jaren van de honger in het midden van het land; en er zijn nog vijf jaren, waarin geen ploeging noch oogst zal zijn. Doch God heeft mij voor uw aangezicht heen gezonden, om u een overblijfsel te stellen op de aarde, en om u bij het leven te behouden, door een grote verlossing.", "Ezra 5:5": "Doch het oog van hun God was over de oudsten van de Joden, zodat men hen niet kon tegenhouden, totdat de zaak bij Darius kwam, en zij daarna daarover een brief terugbrachten.", "Ps 75:8": "Maar God is Rechter; Hij vernedert deze, en verhoogt die.", "Ex 17:16": "En hij zei: Omdat de hand op de troon van de HEERE is, zal er oorlog van de HEERE tegen Amalek zijn, van geslacht tot geslacht!", "Lev 26:7": "En u zult uw vijanden vervolgen; en zij zullen voor uw aangezicht door het zwaard vallen.", "Ps 71:24": "Ook zal mijn tong Uw gerechtigheid de hele dag uitspreken, want zij zijn beschaamd, want zij zijn schaamrood geworden, die mijn kwaad zoeken.", "Gen 35:5": "En zij reisden verder; en er kwam een schrik van God over de steden die rondom hen waren, zodat zij de zonen van Jakob niet achterna joegen.", "Zef 3:19": "Zie, Ik zal in die tijd al uw verdrukkers verdoen; en Ik zal de hinkende behoeden, en de uitgestotenen verzamelen; en Ik zal ze stellen tot een lof, en tot een naam, in het gehele land, waar zij beschaamd zijn geweest.", "Spr 13:22": "De goede zal zijn kindskinderen doen erven; maar het vermogen van de zondaar is voor de rechtvaardige weggelegd.", "Est 8:11": "Dat de koning aan de Joden, die in elke stad waren, toestond zich te verzamelen, en op te komen voor hun leven, om te verdelgen, om te doden en om om te brengen alle macht van het volk en van het landschap, die hen benauwen zou, de kleine kinderen en de vrouwen, en hun buit te roven;", "Spr 21:18": "De goddeloze is een rantsoen voor de rechtvaardigen, en de trouweloze voor de oprechten.", "1 Kron 16:12": "Gedenkt Zijn wonderwerken, die Hij gedaan heeft, Zijn wondertekenen, en de oordelen van Zijn mond;", "Est 3:10": "Toen trok de koning zijn ring van zijn hand, en hij gaf hem aan Haman, de zoon van Hammedatha, de Agagiet, de tegenstander van de Joden.", "1 Kon 11:14-40": "Zo verwekte de HEERE tegen Salomo een tegenstander, Hadad de Edomiet; hij was van het koninklijk geslacht in Edom. Want het was gebeurd, toen David in Edom was, en Joab, de legeraanvoerder, optrok om de gesneuvelden te begraven, dat hij alles wat mannelijk was in Edom versloeg; want Joab bleef daar zes maanden met heel Israël, totdat hij alles wat mannelijk was in Edom had uitgeroeid.", "Est 7:9": "En Charbona, een van de kamerlingen, die voor het aanschijn van de koning stond, zei: Ook zie, de galg, die Haman gemaakt heeft voor Mordechai, die goed voor de koning gesproken heeft, staat bij Hamans huis, vijftig el hoog. Toen zei de koning: Hang hem daaraan.", "1 Kor 4:19": "Maar ik zal spoedig naar u toe komen, als de Heere het wil, en dan zal ik niet de woorden leren kennen van hen die opgeblazen zijn, maar de kracht.", "2 Tess 1:6": "Aangezien het recht is bij God, verdrukking te vergelden aan hen die u verdrukken;", "Ps 109:12": "Laat hij niemand hebben die weldadigheid over hem uitstrekt, en laat er niemand zijn die zijn wezen genadig is.", "Est 3:13": "De brieven nu werden gezonden door de hand van de lopers naar alle landschappen van de koning, dat men zou uitroeien, doden en ombrengen alle Joden, van jong tot oud toe, de kleine kinderen en de vrouwen, op één dag, op de dertiende van de twaalfde maand (dat is de maand Adar), en dat men hun buit zou roven.", "2 Sam 21:1": "Er was in de dagen van David een hongersnood, drie jaren lang, jaar na jaar; en David zocht het aangezicht van de HEERE. En de HEERE zei: Het is om Saul en om zijn bloedhuis, omdat hij de Gibeonieten gedood heeft.", "Joz 9:15": "En Jozua sloot vrede met hen, en hij sloot een verbond met hen, dat hij hen in leven zou laten; en de leiders van de vergadering zwoeren het hun.", "Jes 9:6": "De grootheid van deze heerschappij en van de vrede zal geen einde hebben op de troon van David en in zijn koninkrijk, om dat te bevestigen en te sterken met recht en met gerechtigheid, van nu af tot in eeuwigheid toe. De ijver van de HEERE van de heerscharen zal dit doen.", "Spr 19:21": "In het hart van de man zijn veel gedachten; maar de raad van de HEERE, die zal standhouden.", "Ps 123:3": "Wees ons genadig, HEERE! Wees ons genadig, want wij zijn de verachting veel te zat.", "Jes 8:10": "Beraadslaag een plan, toch zal het vernietigd worden; spreek een woord, toch zal het niet standhouden; want God is met ons!", "Spr 4:18": "Maar het pad van de rechtvaardigen is als een schijnend licht, dat voortgaat en meer licht geeft tot de volle dag toe.", "Deut 32:36": "Want de HEERE zal Zijn volk recht doen, en het zal Hem berouwen over Zijn knechten; want Hij zal zien, dat de hand is weggegaan, en er niemand meer over is, gebonden of vrij.", "Jes 48:14": "Verzamel u, u allen, en hoor; wie onder hen heeft deze dingen verkondigd? De HEERE heeft hem lief, Hij zal Zijn welbehagen tegen Babel doen, en Zijn arm zal tegen de Chaldeeën zijn.", "Openb 11:10": "En zij die op de aarde wonen, die zullen zich verblijden over hen, en zullen vreugde bedrijven, en zullen elkaar geschenken zenden; omdat deze twee profeten hen die op de aarde wonen, gepijnigd hadden.", "1 Kron 5:26": "Zo verwekte de God van Israël de geest van Pul, de koning van Assyrië, en de geest van Tiglath-Pilneser, de koning van Assyrië, die voerde hen gevankelijk weg, te weten de Rubenieten, en de Gadieten, en de halve stam van Manasse; en hij bracht hen naar Halah, en Habor, en Hara, en aan de rivier Gozan, tot op deze dag.", "Est 3:15": "De lopers gingen uit, aangespoord door het woord van de koning, en de wet werd uitgegeven in de burcht Susan. En de koning en Haman gingen zitten om te drinken, doch de stad Susan was in verwarring.", "Ezech 29:19": "Daarom, zo zegt de Heere HEERE: Zie, Ik zal Nebukadrezar, de koning van Babel, Egypteland geven; en hij zal haar menigte wegvoeren, en haar buit buitmaken, en haar roof roven, en het zal het loon zijn voor zijn leger.", "2 Kor 1:11": "Terwijl u ook meewerkt voor ons door het gebed, opdat over de gave, die door velen aan ons teweeggebracht is, ook door velen dank gegeven wordt voor ons.", "Ps 18:49": "Die mij uithelpt van mijn vijanden; ja, U verhoogt mij boven hen die tegen mij opstaan; U redt mij van de man van het geweld.", "Ex 12:17": "Zo moet u de ongezuurde broden in acht nemen, omdat Ik op diezelfde dag uw legers uit Egypteland geleid zal hebben; daarom moet u deze dag houden, onder uw geslachten, als een eeuwige inzetting.", "2 Kron 10:15": "Zo luisterde de koning niet naar het volk; want deze ommekeer kwam van God, opdat de HEERE Zijn woord zou bevestigen, dat Hij door de dienst van Ahia, de Siloniet, gesproken had tot Jerobeam, de zoon van Nebat.", "2 Sam 11:8": "Daarna zei David tegen Uria: Ga naar uw huis, en was uw voeten. En toen Uria uit het huis van de koning wegging, volgde hem een gerecht van de koning achterna.", "Ps 141:10": "Laat de goddelozen ieder in zijn eigen net vallen, samen, totdat ik voorbijgegaan zal zijn.", "Ps 17:14": "Met Uw hand van de mensen, o HEERE! Van de mensen, die van de wereld zijn, wier deel in dit leven is, wier buik U vult met Uw verborgen schat; de kinderen worden verzadigd, en zij laten hun overschot achter aan hun kinderen.", "Deut 16:14": "En u zult vrolijk zijn op uw feest, u, en uw zoon, en uw dochter, en uw dienstknecht, en uw dienstmaagd, en de Leviet, en de vreemdeling, en de wees, en de weduwe, die in uw poorten zijn.", "Est 9:17-19": "Dit gebeurde op de dertiende dag van de maand Adar; en op de veertiende daarvan rustten zij, en zij maakten die tot een dag van maaltijden en vreugde. En de Joden die in Susan waren, verzamelden zich op de dertiende daarvan, en op de veertiende daarvan; en zij rustten op de vijftiende daarvan, en zij maakten die tot een dag van maaltijden en vreugde. Daarom maakten de Joden van de dorpen, die in de dorpsteden woonden, van de veertiende dag van de maand Adar een dag van vreugde en maaltijden, en een vrolijke dag, en van het zenden van gedeelten aan elkaar.", "2 Sam 17:14": "Toen zeiden Absalom en alle mannen van Israël: De raad van Husai, de Archiet, is beter dan de raad van Achitofel. Doch de HEERE had het zo bepaald, om de goede raad van Achitofel te vernietigen, opdat de HEERE het kwaad over Absalom zou brengen.", "2 Kor 1:10": "Die ons uit zo’n grote dood verlost heeft, en nog verlost; op Wie wij hopen dat Hij ons ook nog verlossen zal.", "Est 8:17": "Ook in elk landschap, en in elke stad, op elke plaats waar het woord van de koning en zijn wet aankwam, daar was bij de Joden blijdschap en vreugde, maaltijden en vrolijke dagen; en velen uit de volken van het land werden Joden, want de vreze voor de Joden was op hen gevallen.", "Joz 2:9": "En zij sprak tot die mannen: Ik weet dat de HEERE u dit land gegeven heeft, en dat de schrik voor u op ons gevallen is, en dat alle inwoners van dit land voor u vergaan zijn van angst.", "Ps 103:2": "Loof de HEERE, mijn ziel, en vergeet geen van Zijn weldaden;", "Ps 124:1-3": "Een lied Hammaäloth, van David. Als de HEERE niet bij ons geweest was, laat Israël dat nu zeggen: Als de HEERE niet bij ons geweest was, toen de mensen tegen ons opstonden, dan zouden zij ons levend verslonden hebben, toen hun toorn tegen ons ontstak.", "Ezra 1:1": "In het eerste jaar nu van Kores, koning van Perzië, opdat het woord van de HEERE, uit de mond van Jeremia, volbracht werd, wekte de HEERE de geest van Kores, koning van Perzië, op, zodat hij een boodschap liet doorgeven door heel zijn koninkrijk, zelfs ook op schrift, en zei:", "Spr 16:7": "Als iemands wegen de HEERE behagen, zo zal Hij ook zijn vijanden met hem verzoenen.", "Jer 52:3": "Want het gebeurde vanwege de toorn van de HEERE tegen Jeruzalem en Juda, totdat Hij hen van Zijn aangezicht weggeworpen had; en Zedekia kwam in opstand tegen de koning van Babel.", "Est 2:8": "Het gebeurde nu, toen het woord van de koning en zijn wet bekend was geworden, en toen veel jonge dochters bijeengebracht werden op de burg Susan, onder de hand van Hegai, dat Esther ook genomen werd in het huis van de koning, onder de hand van Hegai, de bewaarder van de vrouwen.", "Jes 56:3": "En de vreemdeling, die zich bij de HEERE gevoegd heeft, moet niet zeggen: De HEERE heeft mij helemaal van Zijn volk gescheiden; en de ontmande moet niet zeggen: Zie, ik ben een dorre boom.", "Ps 44:14": "U stelt ons tot smaad voor onze naburen, tot spot en schimp voor hen die rondom ons zijn.", "Ex 13:9": "En het zal u zijn tot een teken op uw hand, en tot een gedachtenis tussen uw ogen, opdat de wet van de HEERE in uw mond is, omdat de HEERE u door een sterke hand uit Egypte uitgevoerd heeft.", "Luk 11:41": "Geef liever als aalmoes wat erin is; en zie, dan is alles voor u rein.", "Deut 23:5": "Doch de HEERE, uw God, heeft niet naar Bileam willen horen; maar de HEERE, uw God, heeft de vloek voor u in een zegen veranderd, omdat de HEERE, uw God, u liefhad.", "Ps 71:13": "Laat hen beschaamd worden, laat hen verteerd worden, die mijn ziel tegenstaan; laat hen met smaad en schande overdekt worden, die mijn kwaad zoeken.", "2 Sam 21:6": "Laat ons zeven mannen van zijn zonen gegeven worden, zodat wij hen voor de HEERE ophangen te Gibea van Saul, o, u verkorene van de HEERE! En de koning zei: Ik zal hen geven.", "Deut 5:3": "Met onze vaderen heeft de HEERE dit verbond niet gemaakt, maar met ons, wij die hier vandaag allemaal levend zijn.", "Neh 8:11-13": "Verder zei hij tegen hen: Ga, eet het vette, en drink het zoete, en stuur delen aan hen voor wie niets bereid is, want deze dag is heilig voor onze Heere; wees dus niet bedroefd, want de blijdschap van de HEERE, die is uw sterkte. En de Levieten stilden heel het volk, en zeiden: Wees stil, want deze dag is heilig, dus wees niet bedroefd. Toen ging heel het volk weg om te eten en te drinken en delen te sturen en grote blijdschap te bedrijven; want zij hadden de woorden begrepen die men hun bekendgemaakt had.", "Gen 50:20": "U wel, u hebt kwaad tegen mij gedacht; doch God heeft dat ten goede gedacht; opdat Hij deed, zoals het op deze dag is, om een groot volk in het leven te behouden.", "Rom 12:17": "Vergeld niemand kwaad voor kwaad. Zorg voor wat eerlijk is voor alle mensen.", "Joh 16:20-22": "Voorwaar, voorwaar, Ik zeg u: u zult huilen en klagen, maar de wereld zal zich verblijden; en u zult bedroefd zijn, maar uw droefheid zal tot blijdschap worden. Een vrouw heeft droefheid wanneer zij baart, omdat haar tijd gekomen is; maar wanneer zij het kind gebaard heeft, denkt zij niet meer aan de benauwdheid, vanwege de blijdschap dat er een mens ter wereld geboren is. En u hebt dan nu wel droefheid; maar Ik zal u opnieuw zien, en uw hart zal zich verblijden, en niemand zal uw blijdschap van u wegnemen.", "Ps 118:11-16": "Zij hadden mij omringd, ja, zij hadden mij omringd; het is in de Naam van de HEERE, dat ik hen verslagen heb. Zij hadden mij omringd als bijen; zij zijn uitgeblust als een doornenvuur; het is in de Naam van de HEERE, dat ik hen verslagen heb. U had mij zeer hard gestoten, tot vallen toe, maar de HEERE heeft mij geholpen.", "Est 4:3": "En in elk landschap en elke plaats, waar het woord van de koning en zijn wet aankwam, was er grote rouw onder de Joden, met vasten, geween en misbaar; velen lagen in zakken en as.", "2 Kron 36:23": "Zo zegt Kores, koning van Perzië: De HEERE, de God van de hemel, heeft mij alle koninkrijken van de aarde gegeven; en Hij heeft mij bevolen Hem een huis te bouwen te Jeruzalem, dat in Juda is; wie is er onder u van al Zijn volk? De HEERE, zijn God, zij met hem, en hij trekt op.", "Pred 2:26": "Want Hij geeft wijsheid, kennis en vreugde aan de mens die goed is voor Zijn aangezicht; maar aan de zondaar geeft Hij de bezigheid om te verzamelen en te vergaderen, opdat Hij het geeft aan wie goed is voor Gods aangezicht. Dit is ook ijdelheid en kwelling van de geest.", "Est 3:5-13": "Toen Haman zag dat Mordechai niet knielde, en zich niet voor hem neerboog, werd Haman vervuld met woede. Doch hij vond het beneden zich om alleen aan Mordechai de hand te slaan (want men had hem het volk van Mordechai aangewezen); maar Haman zocht alle Joden die in het hele koninkrijk van Ahasveros waren, namelijk het volk van Mordechai, uit te roeien. In de eerste maand (dat is de maand Nisan), in het twaalfde jaar van de koning Ahasveros, wierp men het Pur, dat is het lot, voor het aangezicht van Haman, van dag tot dag, en van maand tot maand, tot de twaalfde maand toe; dat is de maand Adar.", "1 Kron 11:9": "En David werd voortdurend groter, want de HEERE van de heerscharen was met hem.", "Matt 4:24": "En het nieuws over Hem verspreidde zich door heel Syrië; en men bracht bij Hem allen die er slecht aan toe waren, met allerlei ziekten en pijnen bevangen, en van de duivel bezetenen, en maanzieken en verlamden; en Hij genas hen.", "Fil 4:8": "Verder, broeders, alles wat waar is, alles wat eerbaar is, alles wat rechtvaardig is, alles wat rein is, alles wat lieflijk is, alles wat goed klinkt, als er enige deugd is, en als er enige lof is, denk daaraan;", "Deut 29:15": "Maar met hem die heden hier bij ons voor het aangezicht van de HEERE, onze God, staat; en met hem die hier heden bij ons niet is.", "Est 8:1-14": "Op dezelfde dag gaf de koning Ahasveros aan koningin Esther het huis van Haman, de vijand van de Joden; en Mordechai kwam voor de koning, want Esther had bekendgemaakt wat hij voor haar was. En de koning trok zijn ring af, die hij van Haman had afgenomen, en gaf hem aan Mordechai; en Esther stelde Mordechai aan over het huis van Haman. En Esther sprak verder voor de koning, en zij viel voor zijn voeten, en zij weende, en zij smeekte hem, dat hij de boosheid van Haman, de Agagiet, en zijn plan, dat hij tegen de Joden bedacht had, zou wegnemen.", "Richt 9:23": "zond God een boze geest tussen Abimelech en de burgers van Sichem; en de burgers van Sichem handelden trouweloos tegen Abimelech;", "Dan 6:3": "en boven hen drie vorsten, van wie Daniël de eerste zou zijn, aan wie die stadhouders zelf rekenschap moesten geven, zodat de koning geen schade leed.", "Est 3:1": "Na deze gebeurtenissen maakte de koning Ahasveros Haman groot, de zoon van Hammedatha, de Agagiet, en hij verhoogde hem, en hij zette zijn stoel boven alle vorsten die bij hem waren.", "Spr 28:8": "Wie zijn bezit vermeerdert met woeker en met overwinst, verzamelt dat voor hem die zich over de arme ontfermt.", "Ezech 35:6": "Daarom, zo waarachtig als Ik leef, spreekt de Heere HEERE; Ik zal u voorzeker tot bloed bestemmen, en het bloed zal u achtervolgen; omdat u het bloed niet hebt gehaat, zal het bloed u ook achtervolgen.", "Est 7:5-10": "Toen sprak de koning Ahasveros, en zei tegen de koningin Esther: Wie is die, en waar is diezelfde, die zijn hart vervuld heeft, om zo te doen? En Esther zei: De man, de onderdrukker en vijand, is deze boze Haman! Toen schrok Haman voor het aangezicht van de koning en de koningin. En de koning stond op in zijn grimmigheid van het maaltijd van de wijn, en ging naar de tuin van het paleis. En Haman bleef staan, om bij de koningin Esther aangaande zijn leven verzoek te doen; want hij zag dat het kwaad van de koning over hem ten volle besloten was.", "Jer 51:21": "En door u zal Ik in stukken slaan het paard en zijn ruiter; en door u zal Ik in stukken slaan de wagen en zijn ruiter.", "Est 9:20-32": "En Mordechai schreef deze gebeurtenissen op; en hij zond brieven aan alle Joden die in alle landschappen van koning Ahasveros waren, aan hen die dichtbij, en aan hen die ver weg waren, om onder hen vast te leggen dat zij de veertiende dag van de maand Adar zouden houden, en de vijftiende dag daarvan, elk jaar opnieuw; naar de dagen waarop de Joden tot rust gekomen waren van hun vijanden, en de maand die voor hen veranderd was van droefheid in blijdschap, en van rouw in een vrolijke dag; dat zij die dagen zouden maken tot dagen van maaltijden en vreugde, en van het zenden van gedeelten aan elkaar, en van gaven aan de armen.", "Jer 51:20": "U bent Mij een voorhamer, en oorlogswapens; en door u zal Ik volken in stukken slaan, en door u zal Ik koninkrijken verderven.", "Jes 12:2": "Zie, God is mijn Heil, ik zal vertrouwen en niet vrezen; want de HEERE HEERE is mijn Sterkte en mijn Psalm, en Hij is mij tot Heil geworden.", "Ps 105:17": "Hij zond een man voor hun aangezicht heen; Jozef werd verkocht tot een slaaf.", "Jak 4:15": "In plaats daarvan zou u moeten zeggen: Als de Heere het wil, en wij leven, zullen wij dit of dat doen.", "Fil 1:19": "Want ik weet dat dit mij ter zaligheid zal gedijen, door uw gebed en de toebrenging van de Geest van Jezus Christus.", "Ps 109:18": "En laat hij bekleed zijn met de vloek, als met zijn kleed, en laat die gaan tot in zijn binnenste als het water, en als de olie in zijn beenderen.", "Filem 1:1": "Paulus, een gevangene van Christus Jezus, en Timotheüs, de broeder, aan Filemon, de geliefde, en onze medearbeider,", "1 Tess 5:22": "Onthoud u van elke schijn van het kwaad.", "Spr 14:19": "De kwaden buigen neer voor de goeden, en de goddelozen voor de poorten van de rechtvaardige.", "Num 24:10-13": "Toen ontstak de toorn van Balak tegen Bileam, en hij sloeg zijn handen samen; en Balak zei tegen Bileam: Ik heb u geroepen om mijn vijanden te vervloeken; maar zie, u hebt hen nu al driemaal gezegend! En nu, pak u weg naar uw plaats! Ik had gezegd dat ik u hoog zou eren; maar zie, de HEERE heeft u die eer onthouden! Toen zei Bileam tegen Balak: Heb ik ook niet tegen uw boden, die u naar mij gezonden hebt, gesproken en gezegd:", "Jes 60:14-16": "Ook zullen, zich buigend, tot u komen de kinderen van hen die u onderdrukt hebben, en allen die u gelasterd hebben zullen zich neerbuigen aan de zolen van uw voeten; en zij zullen u noemen: de stad van de HEERE, het Sion van de Heilige van Israël. In plaats dat u verlaten en gehaat bent geweest, zodat niemand door u heen ging, zo zal Ik u stellen tot een eeuwige heerlijkheid, tot een vreugde van geslacht tot geslacht. En u zult de melk van de heidenen zuigen, en u zult de borsten van de koningen zuigen; en u zult weten dat Ik de HEERE ben, uw Heiland, en uw Verlosser, de Machtige van Jakob.", "Spr 16:33": "Het lot wordt in de schoot geworpen; maar de hele beschikking daarover is van de HEERE.", "Hand 7:10": "en verloste hem uit al zijn verdrukkingen, en gaf hem genade en wijsheid voor Farao, de koning van Egypteland; en hij stelde hem aan als leider over Egypte en zijn hele huis.", "Ezra 6:22": "En zij hielden het feest van de ongezuurde broden zeven dagen, met blijdschap; want de HEERE had hen verblijd, en het hart van de koning van Assur naar hen toe gewend, om hun handen te sterken in het werk van het huis van God, de God van Israël.", "Est 8:10": "En men schreef in de naam van koning Ahasveros, en men verzegelde het met de ring van de koning; en men zond de brieven door de hand van de lopers te paard, die reden op snelle kamelen, op muildieren, geteeld uit merries;", "2 Kron 36:22": "Maar in het eerste jaar van Kores, koning van Perzië, opdat het woord van de HEERE volbracht werd, door de mond van Jeremia, wekte de HEERE de geest op van Kores, koning van Perzië, zodat hij een stem liet doorgaan door zijn hele koninkrijk, ook zelfs op schrift, en hij zei:", "Ezra 6:15": "En dit huis werd voltooid op de derde dag van de maand Adar; dat was in het zesde jaar van het koninkrijk van koning Darius.", "Ex 20:5": "U zult zich daarvoor niet buigen, en ze niet dienen; want Ik, de HEERE, uw God, ben een ijverig God, Die de misdaad van de vaders bezoek aan de kinderen, aan het derde en aan het vierde geslacht van hen die Mij haten;", "2 Sam 21:9": "En hij gaf hen in de hand van de Gibeonieten, die hen ophingen op de berg voor het aangezicht van de HEERE; en die zeven vielen tegelijk; en zij werden gedood in de dagen van de oogst, in de eerste dagen, in het begin van de gersteoogst.", "Neh 1:1": "De geschiedenissen van Nehemia, zoon van Hachalja. En het gebeurde in de maand Chisleu, in het twintigste jaar, toen ik in de burcht Susan was,", "Hebr 13:5": "Laat uw wandel zonder geldgierigheid zijn, en wees tevreden met wat u hebt; want Hij heeft gezegd: Ik zal u niet begeven, en Ik zal u niet verlaten.", "Ps 78:5-7": "Want Hij heeft een getuigenis opgericht in Jakob, en een wet gesteld in Israël, die Hij onze vaders geboden heeft, dat zij die aan hun kinderen bekend zouden maken; Opdat het navolgende geslacht ze zou weten, de kinderen die geboren zouden worden; en zouden opstaan en ze vertellen aan hun kinderen; En dat zij hun hoop op God zouden stellen, en Gods daden niet vergeten, maar Zijn geboden bewaren;", "Ezech 21:26": "Zo zegt de Heere HEERE: Doe die hoed weg, en neem die kroon af; deze zal niet dezelfde blijven; Ik zal verhogen wie nederig is, en vernederen wie hoog is.", "Num 23:1-30": "Toen zei Bileam tegen Balak: Bouw hier zeven altaren voor mij, en maak hier zeven stieren en zeven rammen voor mij klaar. Balak deed wat Bileam had gezegd; en Balak en Bileam offerden een stier en een ram op elk altaar. Toen zei Bileam tegen Balak: Blijf bij uw brandoffer staan, en ik zal weggaan; misschien zal de HEERE mij tegemoetkomen; en wat Hij mij laat zien, dat zal ik u bekendmaken. Toen ging hij naar de hoogte.", "Est 7:2": "Zei de koning tegen Esther, ook op de tweede dag, op het maaltijd van de wijn: Wat is uw bede, koningin Esther? En zij zal u gegeven worden; en wat is uw verzoek? Het zal gebeuren, ook tot de helft van het koninkrijk.", "Est 3:7-15": "In de eerste maand (dat is de maand Nisan), in het twaalfde jaar van de koning Ahasveros, wierp men het Pur, dat is het lot, voor het aangezicht van Haman, van dag tot dag, en van maand tot maand, tot de twaalfde maand toe; dat is de maand Adar. Want Haman had tegen de koning Ahasveros gezegd: Er is een volk, verstrooid en verspreid onder de volken in alle landschappen van uw koninkrijk; en hun wetten zijn anders dan die van alle volken; ook houden zij zich niet aan de wetten van de koning; daarom is het voor de koning niet goed hen te laten blijven. Als het de koning goeddunkt, laat er geschreven worden dat men hen ombrengt; dan zal ik tienduizend talenten zilver opwegen in de handen van hen die het werk doen, om het in de schatten van de koning te brengen.", "Ps 18:44": "U hebt mij uitgeholpen van de twisten van het volk; U hebt mij gesteld tot een hoofd van de heidenen; het volk dat ik niet kende, heeft mij gediend.", "Hand 5:39": "maar als het uit God is, dan kunt u dat niet breken; anders zou u misschien bevonden worden ook tegen God te strijden.", "Jes 43:14": "Zo zegt de HEERE, uw Verlosser, de Heilige van Israël: Om uw wil heb Ik naar Babel gezonden, en heb hen allen als vluchtelingen doen neerdalen, te weten de Chaldeeën, in de schepen, waarop zij juichten.", "Deut 23:4": "Vanwege dat zij u onderweg niet tegemoet gekomen zijn met brood en met water, toen u uit Egypte wegtrok; en omdat hij tegen u Bileam gehuurd heeft, de zoon van Beor, uit Pethor in Mesopotamië, om u te vloeken.", "Jes 45:13": "Ik heb hem verwekt in gerechtigheid, en al zijn wegen zal Ik recht maken; hij zal Mijn stad bouwen, en hij zal Mijn gevangenen loslaten, niet voor prijs, en ook niet voor geschenk, zegt de HEERE van de heerscharen.", "Est 4:8": "En hij gaf hem het afschrift van de geschreven wet, die te Susan gegeven was om hen te verdelgen, opdat hij het Esther zou laten zien, en het haar te kennen zou geven, en haar zou gebieden dat zij naar de koning zou gaan om hem te smeken, en van hem te verzoeken voor haar volk.", "Hand 12:11": "En Petrus, tot zichzelf gekomen, zei: Nu weet ik waarachtig dat de Heere Zijn engel gestuurd heeft, en mij verlost heeft uit de hand van Herodes, en van heel de verwachting van het volk van de Joden.", "Ex 13:8": "En u moet uw zoon op die dag laten weten en zeggen: Dit doe ik om wat de HEERE mij gedaan heeft, toen ik uit Egypte uittrok.", "Rom 1:10": "altijd in mijn gebeden biddend, of het mij misschien nog op een gegeven moment door de wil van God gegeven zou worden om naar u te komen.", "Neh 8:11": "Verder zei hij tegen hen: Ga, eet het vette, en drink het zoete, en stuur delen aan hen voor wie niets bereid is, want deze dag is heilig voor onze Heere; wees dus niet bedroefd, want de blijdschap van de HEERE, die is uw sterkte.", "Jer 18:21": "Daarom, geef hun zonen over aan de honger, en doe hen wegvloeien door het geweld van het zwaard, en laat hun vrouwen van kinderen beroofd en weduwe worden, en laat hun mannen door de dood omgebracht worden, en hun jongemannen met het zwaard geslagen worden in de strijd.", "Deut 2:30": "Maar Sihon, de koning van Hesbon, wilde ons daar niet doorheen laten trekken; want de HEERE, uw God, verhardde zijn geest en verstokte zijn hart, opdat Hij hem in uw hand zou geven, zoals het is op deze dag.", "Deut 16:11": "En u zult vrolijk zijn voor het aangezicht van de HEERE, uw God, u, en uw zoon, en uw dochter, en uw dienstknecht, en uw dienstmaagd, en de Leviet die in uw poorten is, en de vreemdeling, en de wees, en de weduwe die in uw midden zijn; in de plaats die de HEERE, uw God, zal uitkiezen om Zijn Naam daar te doen wonen.", "Est 8:14": "De lopers, die op snelle kamelen reden en op muildieren, trokken snel uit, aangedreven door het woord van de koning. Deze wet nu werd gegeven op de burg Susan.", "1 Sam 2:6-9": "De HEERE doodt en maakt levend; Hij doet naar het graf neerdalen, en Hij doet weer opkomen. De HEERE maakt arm en maakt rijk; Hij vernedert, ook verhoogt Hij. Hij verheft de geringe uit het stof, en de nooddruftige verhoogt Hij uit de vuilnis, om hen te doen zitten bij de vorsten, dat Hij hen de stoel van de eer laat beërven; want de fundamenten van het aardrijk zijn van de HEERE, en Hij heeft de wereld daarop gezet.", "Ex 23:27": "Ik zal Mijn schrik voor uw aangezicht zenden, en al het volk waar u bij komt, angstig maken; en Ik zal maken dat al uw vijanden u de rug toekeren.", "Jes 39:8": "Maar Hizkia zei tegen Jesaja: Het woord van de HEERE dat u gesproken hebt, is goed. Ook zei hij: Er zal immers vrede en waarheid zijn in mijn dagen!", "Est 1:1": "Dit gebeurde in de dagen van Ahasveros (dit is de Ahasveros die regeerde van Indië tot aan Morenland toe, honderdzevenentwintig landschappen),", "Ps 127:2": "Het is tevergeefs dat u vroeg opstaat, laat opblijft, brood eet met zorgen erbij; het is zo, dat Hij het aan hen die Hij liefheeft, geeft als in de slaap.", "Jes 54:16": "Zie, Ik heb de smid geschapen, die de kolen in het vuur opblaast, en die het instrument voortbrengt tot zijn werk; ook heb Ik de verderver geschapen om te vernielen.", "Jona 3:2-9": "Maak u op, ga naar de grote stad Nineve, en predik tegen haar de prediking, die Ik tot u spreek. Toen maakte Jona zich op, en ging naar Nineve, naar het woord van de HEERE. Nineve nu was een grote stad van God, van drie dagreizen. En Jona begon in de stad te gaan, een dagreis; en hij predikte, en zei: Nog veertig dagen, dan zal Nineve worden omgekeerd.", "Neh 6:16": "En het gebeurde, toen al onze vijanden dit hoorden, dat alle heidenvolken die rondom ons waren, bevreesd werden en zeer in aanzien daalden in hun eigen ogen; want zij begrepen dat dit werk door onze God tot stand gebracht was.", "Pred 3:1": "Alles heeft een vastgestelde tijd, en alle voornemen onder de hemel heeft zijn tijd.", "Dan 11:27": "En het hart van beide koningen zal erop gericht zijn kwaad te doen, en aan één tafel zullen zij leugen spreken; en het zal niet lukken, want het zal nog een einde hebben op de vastgestelde tijd.", "Est 1:22": "En hij zond brieven aan alle landschappen van de koning, aan ieder landschap in zijn eigen schrift, en aan elk volk in zijn eigen taal, dat elke man heerser in zijn eigen huis zou zijn, en zou spreken in de taal van zijn volk.", "Ps 109:13": "Laat zijn nakomelingen uitgeroeid worden; hun naam moet uitgedelgd worden in het volgende geslacht.", "Jes 8:9": "Verzamel u samen, volken! Toch zult u verbroken worden; en neem het ter ore, allen die in verre landen bent, omgord u, toch zult u verbroken worden; omgord u, toch zult u verbroken worden!", "Gen 14:23": "dat ik van een draad tot een schoenriem toe, ja, dat ik van alles wat het uwe is, niets zal nemen! Opdat u niet zegt: Ik heb Abram rijk gemaakt!", "Est 2:5": "Er was een Joodse man op de burg Susan, wiens naam was Mordechai, een zoon van Jaïr, de zoon van Simeï, de zoon van Kis, een man van Jemini;", "Est 8:12": "Op één dag in alle landschappen van koning Ahasveros, op de dertiende van de twaalfde maand; dat is de maand Adar.", "Lev 26:8": "Vijf uit u zullen honderd vervolgen, en honderd uit u zullen tienduizend vervolgen; en uw vijanden zullen voor uw aangezicht door het zwaard vallen.", "Fil 1:12": "En ik wil dat u weet, broeders, dat wat er met mij gebeurd is, meer tot bevordering van het Evangelie gekomen is;", "Ps 44:15": "U stelt ons tot een spreekwoord onder de heidenvolken, tot een hoofdschudden onder de volken.", "Ps 118:7-12": "De HEERE is bij mij onder degenen die mij helpen; daarom zal ik mijn lust zien aan degenen die mij haten. Het is beter tot de HEERE toevlucht te nemen, dan op de mens te vertrouwen. Het is beter tot de HEERE toevlucht te nemen, dan op prinsen te vertrouwen.", "Ex 17:14": "Toen zei de HEERE tegen Mozes: Schrijf dit ter gedachtenis in een boek, en prent het in de oren van Jozua, dat Ik de gedachtenis van Amalek geheel zal uitwissen van onder de hemel.", "Est 8:15": "En Mordechai ging weg van voor de koning in een hemelsblauw en wit koninklijk kleed, en met een grote gouden kroon, en met een overkleed van fijn linnen en purper; en de stad Susan juichte en was vrolijk.", "Ezech 39:11": "En op die dag zal het gebeuren dat Ik aan Gog daar een graf zal geven in Israël, het dal van de doorgangers ten oosten van de zee; en dat zal de doorgangers de neus stoppen; en daar zullen zij Gog begraven en zijn hele menigte, en zij zullen het noemen: Het dal van Gogs menigte.", "Gen 25:7": "Dit nu zijn de dagen van de jaren van het leven van Abraham, die hij geleefd heeft: honderdvijfenzeventig jaar.", "Jes 56:6": "En de vreemdelingen, die zich bij de HEERE voegen om Hem te dienen, en om de Naam van de HEERE lief te hebben, om Hem tot knechten te zijn; ieder die de sabbat houdt, zodat hij die niet ontheiligt, en die aan Mijn verbond vasthouden;", "Ps 17:13": "Sta op, HEERE, kom hem voor, werp hem neer; bevrijd mijn ziel met Uw zwaard van de goddeloze;", "Hand 3:18": "Maar God heeft zo vervuld wat Hij door de mond van al Zijn profeten van tevoren had verkondigd, dat de Christus zou lijden.", "Ps 30:12": "U hebt mijn weeklagen veranderd in een reidans; U hebt mijn rouwkleed losgemaakt, en mij met blijdschap omgord;", "Deut 21:23": "Dan zal zijn dode lichaam niet aan het hout overnachten; maar u zult hem beslist diezelfde dag begraven; want een opgehangene is door God vervloekt. Zo zult u uw land niet verontreinigen, dat de HEERE, uw God, u als erfdeel geeft.", "Est 7:4": "Want wij zijn verkocht, ik en mijn volk, om ons te verdelgen, te doden en om te brengen. Als wij nog tot knechten en tot dienstmaagden waren verkocht, zou ik gezwegen hebben, ofschoon de onderdrukker de schade van de koning geenszins zou kunnen vergoeden.", "Ps 127:1": "Een lied Hammaaloth¹, van Salomo. Als de HEERE het huis niet bouwt, werken de bouwers eraan tevergeefs; als de HEERE de stad niet bewaart, waakt de wachter tevergeefs.", "Est 7:10": "Zo hingen zij Haman aan de galg, die hij voor Mordechai had laten maken; en de grimmigheid van de koning werd gestild.", "Gal 2:10": "alleen dat wij de armen zouden gedenken; wat ik ook ijverig gedaan heb.", "Job 18:19": "Hij zal geen zoon, noch nakomeling hebben onder zijn volk; en niemand zal in zijn woningen overblijven.", "Zach 6:14": "En die kronen zullen zijn voor Chelem, en voor Tobia, en voor Jedaja, en voor Chen, de zoon van Zefanja, tot een gedachtenis in de tempel van de HEERE.", "2 Sam 22:41": "En U gaf mij de nek van mijn vijanden, van mijn haters, en ik vernielde hen.", "Ezra 8:36": "Daarna gaven zij de wetten van de koning aan de stadhouders van de koning en landvoogden aan deze kant van de rivier; en zij bevorderden het volk en het huis van God.", "Est 2:23": "Toen men de zaak onderzocht, werd het zo bevonden, en zij beiden werden aan een galg gehangen; en het werd in de kronieken geschreven voor het aangezicht van de koning.", "Ps 18:48": "De God, Die mij volkomen wraak geeft, en de volken onder mij brengt;", "Est 9:29-32": "Daarna schreef koningin Esther, de dochter van Abichaïl, en Mordechai, de Jood, met alle macht, om deze brief van Purim voor de tweede maal te bevestigen. En hij zond de brieven aan alle Joden, in de honderdzevenentwintig landschappen van het koninkrijk van Ahasveros, met woorden van vrede en trouw; dat zij deze dagen van Purim zouden bevestigen op hun vastgestelde tijden, zoals Mordechai, de Jood, over hen bevestigd had, en Esther, de koningin, en zoals zij het bevestigd hadden voor zichzelf en voor hun nageslacht; de zaken van het vasten en hun geroep.", "Rom 8:28": "En wij weten dat voor hen die God liefhebben, alle dingen meewerken ten goede, namelijk voor hen die naar Zijn voornemen geroepen zijn.", "Joz 11:20": "Want het was van de HEERE om hun harten te verharden, zodat zij Israël in de strijd tegemoet gingen, opdat Hij hen met de ban zou treffen, zodat hun geen genade te beurt viel, maar opdat Hij hen zou vernietigen, zoals de HEERE Mozes geboden had.", "Est 8:9": "Toen werden de schrijvers van de koning geroepen, op datzelfde moment, in de derde maand (dat is de maand Sivan), op de drieëntwintigste daarvan, en er werd geschreven naar alles wat Mordechai gebood, aan de Joden, en aan de stadhouders, en landvoogden, en leiders van de landschappen, die van Indië af tot aan Morenland reiken, honderdzevenentwintig landschappen, ieder landschap naar zijn eigen schrift, ieder volk naar zijn eigen taal; ook aan de Joden naar hun schrift en naar hun taal.", "Ps 33:10": "De HEERE vernietigt de raad van de heidenen; Hij breekt de gedachten van de volken.", "1 Sam 30:25": "En dit is vanaf die dag en voortaan zo geweest; want hij heeft het tot een verordening en tot een recht gesteld in Israël, tot op deze dag.", "Est 9:24-26": "Omdat Haman, de zoon van Hammedatha, de Agagiet, de vijand van alle Joden, tegen de Joden bedacht had hen om te brengen; en omdat hij het Pur, dat is het lot, geworpen had om hen te verslaan en om hen om te brengen. Maar toen zij voor de koning gekomen was, heeft hij door brieven bevolen dat zijn boze plan, dat hij bedacht had tegen de Joden, op zijn eigen hoofd zou terugkeren; en men heeft hem en zijn zonen aan de galg gehangen. Daarom noemt men die dagen Purim, naar de naam van dat Pur. Hierom, vanwege alle woorden van die brief, en wat zij zelf daarvan gezien hadden, en wat hun overkomen was,", "Job 27:13-15": "Dit is het deel van de goddeloze mens bij God, en de erve van de tirannen, die zij van de Almachtige ontvangen zullen. Indien zijn kinderen zich vermenigvuldigen, het is voor het zwaard; en zijn spruiten zullen van brood niet verzadigd worden. Zijn overgeblevenen zullen in de dood begraven worden, en zijn weduwen zullen niet wenen.", "Ps 149:6-9": "De lofprijzingen van God zullen in hun keel zijn, en een tweesnijdend zwaard in hun hand, om wraak te doen over de heidenvolken, en bestraffingen over de volken, om hun koningen te binden met ketenen, en hun aanzienlijken met ijzeren boeien,", "Openb 11:18": "en de volken waren toornig geworden, en Uw toorn is gekomen, en de tijd van de doden, om geoordeeld te worden, en om het loon te geven aan Uw dienstknechten, de profeten, en de heiligen, en aan hen die Uw Naam vrezen, de kleinen en de groten; en om hen te verderven die de aarde verdierven.", "Jes 13:3-5": "Ik heb Mijn geheiligden bevel gegeven; ook heb Ik tot Mijn toorn geroepen Mijn helden, hen die zich verheugen in Mijn hoogheid. Er is een ruisende stem op de bergen, gelijk aan een groot volk; een stem van gedruis van de koninkrijken, van de verzamelde heidenvolken; de HEERE van de heerscharen monstert het krijgsleger. Zij komen uit een ver land, van het einde van de hemel; de HEERE en de instrumenten van Zijn gramschap, om dat hele land te verderven.", "Ps 21:11": "U zult hun vrucht van de aarde verdoen, en hun nageslacht van de kinderen der mensen.", "Zach 8:23": "Zo zegt de HEERE van de heerscharen: Het zal in die dagen gebeuren, dat tien mannen, uit allerlei talen van de heidenvolken, grijpen zullen, ja, de slip grijpen zullen van een Joodse man, en zeggen: Wij zullen met u gaan, want wij hebben gehoord dat God met u is.", "Est 3:7": "In de eerste maand (dat is de maand Nisan), in het twaalfde jaar van de koning Ahasveros, wierp men het Pur, dat is het lot, voor het aangezicht van Haman, van dag tot dag, en van maand tot maand, tot de twaalfde maand toe; dat is de maand Adar.", "Matt 5:4": "Zalig zijn zij die treuren, want zij zullen vertroost worden.", "Zach 8:19": "Zo zegt de HEERE van de heerscharen: Het vasten van de vierde, en het vasten van de vijfde, en het vasten van de zevende, en het vasten van de tiende maand, zal voor het huis van Juda tot vreugde, en tot blijdschap, en tot vrolijke hoogtijden wezen; heb dan de waarheid en de vrede lief.", "Ezech 29:20": "Als zijn arbeidsloon, omdat hij tegen haar gediend heeft, heb Ik hem Egypteland gegeven, omdat zij voor Mij gewerkt hebben, spreekt de Heere HEERE.", "Num 22:12-18": "Toen zei God tegen Bileam: U mag niet met hen meegaan; u mag dat volk niet vervloeken, want het is gezegend. Toen stond Bileam 's morgens op, en zei tegen de vorsten van Balak: Ga naar uw land; want de HEERE weigert mij toe te staan met u mee te gaan. Toen stonden de vorsten van Moab op, en kwamen bij Balak, en zij zeiden: Bileam heeft geweigerd met ons mee te gaan.", "1 Kron 14:17": "Zo ging Davids naam uit in alle landen; en de HEERE bracht de schrik voor hem over alle heidenvolken.", "Deut 31:19-22": "En nu, schrijf u dit lied, en leer het de kinderen van Israël; leg het in hun mond; opdat dit lied Mij tot getuige zij tegen de kinderen van Israël. Want Ik zal dit volk brengen in het land, dat Ik hun vaderen gezworen heb, vloeiend van melk en honing, en het zal eten, en verzadigd, en vet worden; dan zal het zich wenden tot andere goden, en hen dienen, en zij zullen Mij tergen, en Mijn verbond vernietigen. En het zal gebeuren, wanneer veel kwaad en benauwdheden hen zullen treffen, dan zal dit lied voor hun aangezicht antwoorden tot getuige; want het zal uit de mond van hun nageslacht niet vergeten worden; omdat Ik hun gedachten ken, die het nu al maakt, voordat Ik het breng in het land dat Ik gezworen heb.", "Openb 17:17": "Want God heeft hun in hun hart gegeven dat zij Zijn plan uitvoeren, en dat zij één en dezelfde gezindheid uitvoeren, en dat zij hun koninkrijk aan het beest geven, totdat de woorden van God vervuld zullen zijn.", "Spr 21:1": "Het hart van de koning is in de hand van de HEERE als waterbeken. Hij neigt het tot alles wat Hij wil.", "Dan 6:2": "En het leek Darius goed dat hij over het koninkrijk honderdtwintig stadhouders aanstelde, die over het hele koninkrijk zouden zijn;", "Est 4:16": "Ga, verzamel alle Joden die te Susan gevonden worden, en vast voor mij, en eet of drink niet, drie dagen lang, nacht noch dag; ik en mijn jonge dochters zullen ook zo vasten, en zo zal ik tot de koning ingaan, wat niet naar de wet is. Wanneer ik dan omkom, dan kom ik om.", "Jes 44:28": "Die van Kores zegt: Hij is Mijn herder, en hij zal al Mijn welbehagen volbrengen; en zegt ook tot Jeruzalem: Word gebouwd; en tot de tempel: Word gegrondvest.", "Job 5:12": "Hij maakt teniet de gedachten van de arglistigen; zodat hun handen niets uitrichten.", "Zach 2:11": "En veel heidenen zullen op die dag aan de HEERE toegevoegd worden, en zij zullen Mij tot een volk wezen; en Ik zal in het midden van u wonen; en u zult weten, dat de HEERE van de heerscharen mij tot u gezonden heeft.", "Ex 13:3-8": "Verder zei Mozes tegen het volk: Denk aan deze dag, waarop u uit Egypte, uit het diensthuis, gegaan bent; want de HEERE heeft u door een sterke hand van hier uitgevoerd; daarom mag het gedesemde niet gegeten worden. Vandaag gaat u uit, in de maand Abib. En het zal gebeuren, als de HEERE u in het land van de Kanaänieten, de Hethieten, de Amorieten, de Hevieten en de Jebusieten gebracht zal hebben, dat Hij uw vaderen gezworen heeft u te geven, een land dat overvloeit van melk en honing; dan moet u deze dienst houden in deze maand.", "Est 3:12": "Toen werden de schrijvers van de koning geroepen, in de eerste maand, op de dertiende dag daarvan, en er werd geschreven naar alles wat Haman beval, aan de stadhouders van de koning, en aan de landvoogden die over elk landschap waren, en aan de vorsten van elk volk, elk landschap naar zijn schrift, en elk volk naar zijn taal; er werd geschreven in de naam van de koning Ahasveros, en het werd met de ring van de koning verzegeld.", "Est 3:2-6": "En alle knechten van de koning die in de poort van de koning waren, knielden en bogen zich neer voor Haman; want de koning had zo over hem bevolen; maar Mordechai knielde niet, en boog zich niet neer. Toen zeiden de knechten van de koning die in de poort van de koning waren, tegen Mordechai: Waarom overtreedt u het gebod van de koning? Het gebeurde nu, toen zij dit van dag tot dag tegen hem zeiden, en hij niet naar hen luisterde, dat zij het aan Haman lieten weten, om te zien of de woorden van Mordechai stand zouden houden; want hij had hun laten weten dat hij een Jood was.", "Num 16:40": "Ter herinnering voor de kinderen van Israël, opdat geen vreemdeling, die niet uit het nageslacht van Aäron is, nadert om reukwerk aan te steken voor het aangezicht van de HEERE; opdat hij niet wordt als Korach en zijn vergadering, zoals de HEERE hem door de hand van Mozes gezegd had.", "Hand 5:38": "En nu zeg ik u: Houd u afzijdig van deze mensen, en laat hen gaan; want als deze raad of dit werk uit mensen is, zal het gebroken worden;", "Job 18:18": "Men zal hem stoten van het licht in de duisternis, en men zal hem uit de wereld verjagen.", "1 Kon 12:15": "Zo hoorde de koning niet naar het volk; want deze ommekeer kwam van de HEERE, opdat Hij Zijn woord zou bevestigen, dat de HEERE door de dienst van Ahia, de Siloniet, gesproken had tot Jerobeam, de zoon van Nebat.", "Ps 140:10": "Wat het hoofd betreft van hen die mij omringen, de overlast van hun lippen overdekt hen.", "Est 6:1-12": "Diezelfde nacht kon de koning niet slapen, en hij zei dat men het boek van de gedenkwaardigheden, de kronieken, moest brengen; en die werden voorgelezen in de tegenwoordigheid van de koning. En men vond geschreven dat Mordechai had bekendgemaakt dat Bigthana en Theres, twee kamerlingen van de koning, uit de dorpelwachters, van plan waren de hand te leggen aan koning Ahasveros. Toen zei de koning: Welke eer en verhoging is Mordechai hiervoor gegeven? En de knechten van de koning, zijn dienaars, zeiden: Aan hem is niets gegeven.", "Ps 76:11": "Want de grimmigheid van de mens zal U loffelijk maken; het overblijfsel van de grimmigheden zult U opbinden.", "Jes 41:2": "Wie heeft van de opgang die rechtvaardige verwekt? Heeft hem geroepen om hem op zijn voet te doen staan? De heidenvolken voor zijn aangezicht gegeven, en gemaakt dat hij over koningen heerste? Heeft hun zijn zwaard gegeven als stof, zijn boog als een voortgedreven stoppel?", "Ezech 21:27": "Ik zal die kroon omgekeerd, omgekeerd, omgekeerd neerzetten; ja, zij zal er niet zijn, totdat hij komt die daartoe recht heeft, en aan wie Ik hem geven zal.", "Est 6:4": "Toen zei de koning: Wie is er in het voorhof? (Haman was namelijk gekomen in het buitenste voorhof van het huis van de koning, om tegen de koning te zeggen dat men Mordechai moest hangen aan de galg die hij voor hem had laten klaarmaken.)", "Hand 7:9": "En de aartsvaders, jaloers geworden, verkochten Jozef om naar Egypte gebracht te worden; maar God was met hem,", "Ps 1:3": "Want hij zal zijn als een boom, geplant aan waterbeken, die zijn vrucht geeft op zijn tijd, en waarvan het blad niet afvalt; en alles wat hij doet, zal goed gelukken.", "Joz 6:27": "Zo was de HEERE met Jozua; en zijn faam ging door heel het land.", "Pred 3:10": "Ik heb de bezigheid gezien, die God aan de kinderen van de mensen gegeven heeft, om zichzelf daarmee te bekommeren.", "Jes 45:1-6": "Zo zegt de HEERE tegen Zijn gezalfde, tegen Kores, wiens rechterhand Ik vastheb, om de volken voor zijn aangezicht neer te werpen; en Ik zal de lendenen van de koningen ontbinden, om voor zijn aangezicht de deuren te openen, en de poorten zullen niet gesloten worden: Ik zal voor uw aangezicht gaan, en Ik zal de kromme wegen recht maken; de koperen deuren zal Ik verbreken, en de ijzeren grendels zal Ik in stukken slaan. En Ik zal u de schatten geven die in de duisternissen zijn, en de verborgen rijkdommen; opdat u weet dat Ik de HEERE ben, Die u bij uw naam roept, de God van Israël;", "Matt 21:44": "En wie op deze steen valt, zal verpletterd worden; en op wie hij valt, die zal hij vermorzelen.", "Ezech 35:5": "Omdat u een eeuwige vijandschap hebt, en de kinderen van Israël hebt laten omkomen door het geweld van het zwaard, ten tijde van hun ondergang, ten tijde van hun uiterste ongerechtigheid;", "Est 8:5": "En zij zei: Als het de koning goeddunkt, en als ik genade voor zijn ogen gevonden heb, en deze zaak voor de koning juist is, en ik in zijn ogen aangenaam ben, laat er dan geschreven worden dat de brieven en het plan van Haman, de zoon van Hammedatha, de Agagiet, teruggeroepen worden, welke hij geschreven heeft om de Joden om te brengen, die in alle landschappen van de koning zijn.", "Hand 2:44-46": "En allen die geloofden, waren bijeen, en hadden alle dingen gemeenschappelijk; En zij verkochten hun bezittingen en have, en verdeelden die onder allen, naar dat ieder nodig had. En zij bleven dagelijks eendrachtig in de tempel volharden, en braken van huis tot huis brood, en aten samen met vreugde en eenvoud van hart;", "1 Kor 16:7": "Want ik wil u nu niet zien terwijl ik onderweg ben, maar ik hoop enige tijd bij u te blijven, als de Heere het zal toelaten."}, "noten": {}, "koppeling": {"1": "In <span class=\"wl\" data-l=\"L1\" data-code=\"H8147\">de</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H8147\">twaalfde</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H2320\">maand</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H1931\">nu</span> (dat is <span class=\"wl\" data-l=\"L2\" data-code=\"H2320\">de</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H2320\">maand</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H143\">Adar</span>), <span class=\"wl\" data-l=\"L4\" data-code=\"H143\">op</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H7969\">de</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H7969\">dertiende</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H3117\">dag</span> daarvan, <span class=\"wl\" data-l=\"L7\" data-code=\"H834\">toen</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H834\">het</span> <span class=\"wl\" data-l=\"L9\" data-code=\"H1697\">woord</span> <span class=\"wl\" data-l=\"L10\" data-code=\"H1881\">en</span> <span class=\"wl\" data-l=\"L10\" data-code=\"H1881\">de</span> <span class=\"wl\" data-l=\"L10\" data-code=\"H1881\">wet</span> <span class=\"wl\" data-l=\"L10\" data-code=\"H1881\">van</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H4428\">de</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H4428\">koning</span> <span class=\"wl\" data-l=\"L11\" data-code=\"H5060\">nabij</span> <span class=\"wl\" data-l=\"L11\" data-code=\"H5060\">gekomen</span> waren om uitgevoerd te worden, op de dag <span class=\"wl\" data-l=\"L12\" data-code=\"H6213\">dat</span> <span class=\"wl\" data-l=\"L12\" data-code=\"H6213\">de</span> <span class=\"wl\" data-l=\"L13\" data-code=\"H341\">vijanden</span> <span class=\"wl\" data-l=\"L13\" data-code=\"H341\">van</span> <span class=\"wl\
