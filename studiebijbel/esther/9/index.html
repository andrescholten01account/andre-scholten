n class=\"wl\" data-l=\"L15\" data-code=\"H2201\">en</span> <span class=\"wl\" data-l=\"L15\" data-code=\"H2201\">hun</span> <span class=\"wl\" data-l=\"L15\" data-code=\"H2201\">geroep</span>.", "32": "<span class=\"wl\" data-l=\"L1\" data-code=\"H3982\">En</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H3982\">het</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H3982\">bevel</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H3982\">van</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H635\">Esther</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H6965\">bevestigde</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H6965\">de</span> gebeurtenissen <span class=\"wl\" data-l=\"L4\" data-code=\"H428\">van</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H428\">deze</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H6332\">Purim</span>, <span class=\"wl\" data-l=\"L6\" data-code=\"H5612\">en</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H5612\">het</span> werd in <span class=\"wl\" data-l=\"L6\" data-code=\"H5612\">een</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H5612\">boek</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H3789\">geschreven</span>."}, "koppeling_kjv": {"1": "Now in the <span class=\"wl wl-kjv\" data-code=\"H8147\">twelfth</span> <span class=\"wl wl-kjv\" data-code=\"H2320\">month,</span> that is, the <span class=\"wl wl-kjv\" data-code=\"H2320\">month</span> <span class=\"wl wl-kjv\" data-code=\"H143\">Adar,</span> on the <span class=\"wl wl-kjv\" data-code=\"H7969\">thirteenth</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of the same, when the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H1697\">commandment</span> and his <span class=\"wl wl-kjv\" data-code=\"H1881\">decree</span> drew <span class=\"wl wl-kjv\" data-code=\"H5060\">near</span> to be put in <span class=\"wl wl-kjv\" data-code=\"H6213\">execution,</span> in the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> that the <span class=\"wl wl-kjv\" data-code=\"H341\">enemies</span> of the <span class=\"wl wl-kjv\" data-code=\"H3064\">Jews</span> <span class=\"wl wl-kjv\" data-code=\"H7663\">hoped</span> to have <span class=\"wl wl-kjv\" data-code=\"H7980\">power</span> over them, (though it was <span class=\"wl wl-kjv\" data-code=\"H2015\">turned</span> to the contrary, that the <span class=\"wl wl-kjv\" data-code=\"H3064\">Jews</span> had <span class=\"wl wl-kjv\" data-code=\"H7980\">rule</span> over them that hated", "2": "The <span class=\"wl wl-kjv\" data-code=\"H3064\">Jews</span> gathered themselves <span class=\"wl wl-kjv\" data-code=\"H6950\">together</span> in their <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> throughout all the <span class=\"wl wl-kjv\" data-code=\"H4082\">provinces</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H325\">Ahasuerus,</span> to <span class=\"wl wl-kjv\" data-code=\"H7971\">lay</span> <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> on such as <span class=\"wl wl-kjv\" data-code=\"H1245\">sought</span> their <span class=\"wl wl-kjv\" data-code=\"H7451\">hurt:</span> and no <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> could <span class=\"wl wl-kjv\" data-code=\"H5975\">withstand</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">them;</span> for the <span class=\"wl wl-kjv\" data-code=\"H6343\">fear</span> of them <span class=\"wl wl-kjv\" data-code=\"H5307\">fell</span> upon all people.", "3": "And all the <span class=\"wl wl-kjv\" data-code=\"H8269\">rulers</span> of the <span class=\"wl wl-kjv\" data-code=\"H4082\">provinces,</span> and the <span class=\"wl wl-kjv\" data-code=\"H323\">lieutenants,</span> and the <span class=\"wl wl-kjv\" data-code=\"H6346\">deputies,</span> and <span class=\"wl wl-kjv\" data-code=\"H6213\">officers</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> <span class=\"wl wl-kjv\" data-code=\"H5375\">helped</span> the <span class=\"wl wl-kjv\" data-code=\"H3064\">Jews;</span> because the <span class=\"wl wl-kjv\" data-code=\"H6343\">fear</span> of <span class=\"wl wl-kjv\" data-code=\"H4782\">Mordecai</span> fell", "4": "For <span class=\"wl wl-kjv\" data-code=\"H4782\">Mordecai</span> was <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> in the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> and his <span class=\"wl wl-kjv\" data-code=\"H8089\">fame</span> went <span class=\"wl wl-kjv\" data-code=\"H1980\">out</span> throughout all the <span class=\"wl wl-kjv\" data-code=\"H4082\">provinces:</span> for this <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> <span class=\"wl wl-kjv\" data-code=\"H4782\">Mordecai</span> <span class=\"wl wl-kjv\" data-code=\"H1980\">waxed</span> greater and greater.", "5": "Thus the <span class=\"wl wl-kjv\" data-code=\"H3064\">Jews</span> <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> all their <span class=\"wl wl-kjv\" data-code=\"H341\">enemies</span> with the <span class=\"wl wl-kjv\" data-code=\"H4347\">stroke</span> of the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword,</span> and <span class=\"wl wl-kjv\" data-code=\"H2027\">slaughter,</span> and <span class=\"wl wl-kjv\" data-code=\"H12\">destruction,</span> and <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> what they <span class=\"wl wl-kjv\" data-code=\"H7522\">would</span> unto those that hated", "6": "And in <span class=\"wl wl-kjv\" data-code=\"H7800\">Shushan</span> the <span class=\"wl wl-kjv\" data-code=\"H1002\">palace</span> the <span class=\"wl wl-kjv\" data-code=\"H3064\">Jews</span> <span class=\"wl wl-kjv\" data-code=\"H2026\">slew</span> and <span class=\"wl wl-kjv\" data-code=\"H6\">destroyed</span> <span class=\"wl wl-kjv\" data-code=\"H2568\">five</span> <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> men.", "7": "And <span class=\"wl wl-kjv\" data-code=\"H6577\">Parshandatha,</span> and <span class=\"wl wl-kjv\" data-code=\"H1813\">Dalphon,</span> and Aspatha,", "8": "And <span class=\"wl wl-kjv\" data-code=\"H6334\">Poratha,</span> and <span class=\"wl wl-kjv\" data-code=\"H118\">Adalia,</span> and Aridatha,", "9": "And <span class=\"wl wl-kjv\" data-code=\"H6534\">Parmashta,</span> and <span class=\"wl wl-kjv\" data-code=\"H747\">Arisai,</span> and <span class=\"wl wl-kjv\" data-code=\"H742\">Aridai,</span> and Vajezatha,", "10": "The <span class=\"wl wl-kjv\" data-code=\"H6235\">ten</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H2001\">Haman</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H4099\">Hammedatha,</span> the <span class=\"wl wl-kjv\" data-code=\"H6887\">enemy</span> of the <span class=\"wl wl-kjv\" data-code=\"H3064\">Jews,</span> <span class=\"wl wl-kjv\" data-code=\"H2026\">slew</span> they; but on the <span class=\"wl wl-kjv\" data-code=\"H961\">spoil</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">laid</span> they not their hand.", "11": "On that <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> the <span class=\"wl wl-kjv\" data-code=\"H4557\">number</span> of those that were <span class=\"wl wl-kjv\" data-code=\"H2026\">slain</span> in <span class=\"wl wl-kjv\" data-code=\"H7800\">Shushan</span> the <span class=\"wl wl-kjv\" data-code=\"H1002\">palace</span> was <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the king.", "12": "And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H635\">Esther</span> the <span class=\"wl wl-kjv\" data-code=\"H4436\">queen,</span> The <span class=\"wl wl-kjv\" data-code=\"H3064\">Jews</span> have <span class=\"wl wl-kjv\" data-code=\"H2026\">slain</span> and <span class=\"wl wl-kjv\" data-code=\"H6\">destroyed</span> <span class=\"wl wl-kjv\" data-code=\"H2568\">five</span> <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> <span class=\"wl wl-kjv\" data-code=\"H376\">men</span> in <span class=\"wl wl-kjv\" data-code=\"H7800\">Shushan</span> the <span class=\"wl wl-kjv\" data-code=\"H1002\">palace,</span> and the <span class=\"wl wl-kjv\" data-code=\"H6235\">ten</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H2001\">Haman;</span> what have they <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> in the <span class=\"wl wl-kjv\" data-code=\"H7605\">rest</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H4082\">provinces?</span> now what is thy <span class=\"wl wl-kjv\" data-code=\"H7596\">petition?</span> and it shall be <span class=\"wl wl-kjv\" data-code=\"H5414\">granted</span> thee: or what is thy <span class=\"wl wl-kjv\" data-code=\"H1246\">request</span> <span class=\"wl wl-kjv\" data-code=\"H5750\">further?</span> and it shall be done.", "13": "Then <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> <span class=\"wl wl-kjv\" data-code=\"H635\">Esther,</span> If it <span class=\"wl wl-kjv\" data-code=\"H2896\">please</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> let it be <span class=\"wl wl-kjv\" data-code=\"H5414\">granted</span> to the <span class=\"wl wl-kjv\" data-code=\"H3064\">Jews</span> which are in <span class=\"wl wl-kjv\" data-code=\"H7800\">Shushan</span> to <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> to <span class=\"wl wl-kjv\" data-code=\"H4279\">morrow</span> also according unto this <span class=\"wl wl-kjv\" data-code=\"H3117\">day's</span> <span class=\"wl wl-kjv\" data-code=\"H1881\">decree,</span> and let <span class=\"wl wl-kjv\" data-code=\"H2001\">Haman's</span> <span class=\"wl wl-kjv\" data-code=\"H6235\">ten</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> be <span class=\"wl wl-kjv\" data-code=\"H8518\">hanged</span> upon the gallows.", "14": "And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H559\">commanded</span> it so to be <span class=\"wl wl-kjv\" data-code=\"H6213\">done:</span> and the <span class=\"wl wl-kjv\" data-code=\"H1881\">decree</span> was <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> at <span class=\"wl wl-kjv\" data-code=\"H7800\">Shushan;</span> and they <span class=\"wl wl-kjv\" data-code=\"H8518\">hanged</span> <span class=\"wl wl-kjv\" data-code=\"H2001\">Haman's</span> <span class=\"wl wl-kjv\" data-code=\"H6235\">ten</span> sons.", "15": "For the <span class=\"wl wl-kjv\" data-code=\"H3064\">Jews</span> that were in <span class=\"wl wl-kjv\" data-code=\"H7800\">Shushan</span> gathered themselves <span class=\"wl wl-kjv\" data-code=\"H6950\">together</span> on the <span class=\"wl wl-kjv\" data-code=\"H702\">fourteenth</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> also of the <span class=\"wl wl-kjv\" data-code=\"H2320\">month</span> <span class=\"wl wl-kjv\" data-code=\"H143\">Adar,</span> and <span class=\"wl wl-kjv\" data-code=\"H2026\">slew</span> <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> <span class=\"wl wl-kjv\" data-code=\"H376\">men</span> at <span class=\"wl wl-kjv\" data-code=\"H7800\">Shushan;</span> but on the <span class=\"wl wl-kjv\" data-code=\"H961\">prey</span> they <span class=\"wl wl-kjv\" data-code=\"H7971\">laid</span> not their hand.", "16": "But the <span class=\"wl wl-kjv\" data-code=\"H7605\">other</span> <span class=\"wl wl-kjv\" data-code=\"H3064\">Jews</span> that were in the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H4082\">provinces</span> gathered themselves <span class=\"wl wl-kjv\" data-code=\"H6950\">together,</span> and <span class=\"wl wl-kjv\" data-code=\"H5975\">stood</span> for their <span class=\"wl wl-kjv\" data-code=\"H5315\">lives,</span> and had <span class=\"wl wl-kjv\" data-code=\"H5118\">rest</span> from their <span class=\"wl wl-kjv\" data-code=\"H341\">enemies,</span> and <span class=\"wl wl-kjv\" data-code=\"H2026\">slew</span> of their <span class=\"wl wl-kjv\" data-code=\"H8130\">foes</span> <span class=\"wl wl-kjv\" data-code=\"H7657\">seventy</span> and <span class=\"wl wl-kjv\" data-code=\"H2568\">five</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand,</span> but they <span class=\"wl wl-kjv\" data-code=\"H7971\">laid</span> not their <span class=\"wl wl-kjv\" data-code=\"H3027\">hands</span> on the prey,", "17": "On the <span class=\"wl wl-kjv\" data-code=\"H7969\">thirteenth</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of the <span class=\"wl wl-kjv\" data-code=\"H2320\">month</span> <span class=\"wl wl-kjv\" data-code=\"H143\">Adar;</span> and on the <span class=\"wl wl-kjv\" data-code=\"H702\">fourteenth</span> day of the same <span class=\"wl wl-kjv\" data-code=\"H5118\">rested</span> they, and <span class=\"wl wl-kjv\" data-code=\"H6213\">made</span> it a <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of <span class=\"wl wl-kjv\" data-code=\"H4960\">feasting</span> and gladness.", "18": "But the <span class=\"wl wl-kjv\" data-code=\"H3064\">Jews</span> that were at <span class=\"wl wl-kjv\" data-code=\"H7800\">Shushan</span> assembled <span class=\"wl wl-kjv\" data-code=\"H6950\">together</span> on the <span class=\"wl wl-kjv\" data-code=\"H7969\">thirteenth</span> day thereof, and on the <span class=\"wl wl-kjv\" data-code=\"H702\">fourteenth</span> thereof; and on the <span class=\"wl wl-kjv\" data-code=\"H2568\">fifteenth</span> day of the same they <span class=\"wl wl-kjv\" data-code=\"H5118\">rested,</span> and <span class=\"wl wl-kjv\" data-code=\"H6213\">made</span> it a <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of <span class=\"wl wl-kjv\" data-code=\"H4960\">feasting</span> and gladness.", "19": "Therefore the <span class=\"wl wl-kjv\" data-code=\"H3064\">Jews</span> of the <span class=\"wl wl-kjv\" data-code=\"H6521\">villages,</span> that <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelt</span> in the <span class=\"wl wl-kjv\" data-code=\"H6519\">unwalled</span> <span class=\"wl wl-kjv\" data-code=\"H5892\">towns,</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">made</span> the <span class=\"wl wl-kjv\" data-code=\"H702\">fourteenth</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of the <span class=\"wl wl-kjv\" data-code=\"H2320\">month</span> <span class=\"wl wl-kjv\" data-code=\"H143\">Adar</span> a day of <span class=\"wl wl-kjv\" data-code=\"H8057\">gladness</span> and <span class=\"wl wl-kjv\" data-code=\"H4960\">feasting,</span> and a <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> and of <span class=\"wl wl-kjv\" data-code=\"H4916\">sending</span> <span class=\"wl wl-kjv\" data-code=\"H4490\">portions</span> <span class=\"wl wl-kjv\" data-code=\"H376\">one</span> to another.", "20": "And <span class=\"wl wl-kjv\" data-code=\"H4782\">Mordecai</span> <span class=\"wl wl-kjv\" data-code=\"H3789\">wrote</span> these <span class=\"wl wl-kjv\" data-code=\"H1697\">things,</span> and <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> <span class=\"wl wl-kjv\" data-code=\"H5612\">letters</span> unto all the <span class=\"wl wl-kjv\" data-code=\"H3064\">Jews</span> that were in all the <span class=\"wl wl-kjv\" data-code=\"H4082\">provinces</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H325\">Ahasuerus,</span> both <span class=\"wl wl-kjv\" data-code=\"H7138\">nigh</span> and /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [

).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    const heeftB = D.koppeling && D.koppeling[n];
    const heeftK = D.koppeling_kjv && D.koppeling_kjv[n];
    let h = '<div class="verg-kop">Grondwoorden</div>';
    if (!heeftB && !heeftK) {
      h += '<em>Nog geen woordkoppeling voor dit vers.</em>';
    } else {
      if (heeftB) h += `<div class="tsk-kop">SVnu</div>` +
        `<div class="gw-tekst" style="font-family:Georgia,serif;line-height:1.8">${D.koppeling[n]}</div>` +
        `<div class="gw-detail" style="margin-top:.5rem"></div>`;
      if (heeftK) h += `<div class="tsk-kop" style="margin-top:.9rem">KJV</div>` +
        `<div class="gw-tekst" style="font-family:Georgia,serif;line-height:1.8">${D.koppeling_kjv[n]}</div>` +
        `<div class="gw-detail" style="margin-top:.5rem"></div>`;
      h += '<div class="bronregel">Klik op een onderstreept woord voor de vindplaatsen.</div>';
    }
    h += '<div class="verg-kop" style="margin-top:1.4rem">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const berea = D.tsk[n], engels = D.tsk_kjv[n];
    if ((!berea || !berea.length) && (!engels || !engels.length)) return '<em>Geen verwijzingen bij dit vers.</em>';
    let h = '';
    if (berea && berea.length) {
      h += '<div class="tsk-kop">Treasury of Scripture Knowledge | SVnu</div>';
      h += berea.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r}">${r}</a>`).join('') + '</div>').join('');
    }
    if (engels && engels.length) {
      h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.tsk[n] && D.tsk[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vergelijk</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een vers: snel wisselen van vertaling ---------- */
(function () {
  const menu = document.createElement('div');
  menu.id = 'vertmenu';
  menu.style.cssText = 'position:absolute;display:none;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.3rem;font-family:sans-serif;font-size:.85rem;z-index:30;min-width:7rem;';
  document.body.appendChild(menu);
  function toon(x, y) {
    menu.innerHTML = Object.keys(D.vertalingen).map(naam =>
      `<div class="vm-optie" data-v="${naam}" style="padding:.35rem .6rem;border-radius:5px;cursor:pointer;${naam === vertaling ? 'font-weight:700;color:var(--accent-donker)' : ''}">${naam}</div>`
    ).join('');
    const breedte = document.documentElement.clientWidth;
    menu.style.left = Math.max(4, Math.min(x, breedte - 130)) + 'px';
    menu.style.top = y + 'px';
    menu.style.display = 'block';
  }
  document.addEventListener('contextmenu', e => {
    const rij = e.target.closest('.vers');
    if (!rij) return;
    e.preventDefault();
    toon(e.pageX, e.pageY);
  });
  menu.addEventListener('mouseover', e => {
    const o = e.target.closest('.vm-optie');
    if (o) o.style.background = 'var(--bg-soft)';
  });
  menu.addEventListener('mouseout', e => {
    const o = e.target.closest('.vm-optie');
    if (o) o.style.background = '';
  });
  menu.addEventListener('click', e => {
    const o = e.target.closest('.vm-optie');
    if (!o) return;
    vertaling = o.dataset.v;
    const kies = document.getElementById('vertaalkies');
    if (kies) kies.value = vertaling;
    bouwRijen();
    menu.style.display = 'none';
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#vertmenu')) menu.style.display = 'none';
  });
  document.addEventListener('scroll', () => { menu.style.display = 'none'; }, true);
})();
</script>
