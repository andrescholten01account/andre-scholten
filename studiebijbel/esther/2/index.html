,"7":"En hij was het die Hadassa opvoedde (dit is Esther, de dochter van zijn oom); want zij had geen vader noch moeder; en zij was een jonge dochter, mooi van gestalte, en mooi van uiterlijk; en toen haar vader en haar moeder stierven, had Mordechai haar tot een dochter aangenomen.","8":"Het gebeurde nu, toen het woord van de koning en zijn wet bekend was geworden, en toen veel jonge dochters bijeengebracht werden op de burg Susan, onder de hand van Hegai, dat Esther ook genomen werd in het huis van de koning, onder de hand van Hegai, de bewaarder van de vrouwen.","9":"En die jonge dochter was mooi in zijn ogen, en zij verkreeg gunst bij hem; daarom haastte hij zich om haar haar schoonheidsmiddelen en haar deel te geven, en om haar zeven aanzienlijke jonge dochters te geven uit het huis van de koning; en hij verplaatste haar en haar jonge dochters naar het beste deel van het huis van de vrouwen.","10":"Esther had haar volk en haar afkomst niet bekendgemaakt; want Mordechai had haar geboden dat zij het niet zou bekendmaken.","11":"Mordechai nu liep elke dag voor het voorhof van het huis van de vrouwen, om te vernemen naar het welzijn van Esther, en wat er met haar zou gebeuren.","12":"Toen nu de beurt van elke jonge dochter naderde om bij koning Ahasveros te komen, nadat haar twaalf maanden lang naar de wet van de vrouwen gebeurd was; want zo werden vervuld de dagen van haar schoonheidsverzorging, zes maanden met mirreolie, en zes maanden met specerijen, en met andere schoonheidsmiddelen van de vrouwen;","13":"daarmee kwam dan de jonge dochter bij de koning; alles wat zij zei, werd haar gegeven, zodat zij daarmee ging uit het huis van de vrouwen naar het huis van de koning.","14":"'s Avonds ging zij daarin, en 's morgens ging zij weer terug naar het tweede huis van de vrouwen, onder de hand van Saasgaz, de kamerling van de koning, bewaarder van de bijvrouwen; zij kwam niet meer bij de koning, behalve als de koning lust naar haar had, en zij bij naam geroepen werd.","15":"Toen de beurt van Esther, de dochter van Abichaïl, de oom van Mordechai (die hij tot dochter had aangenomen), naderde, zodat zij bij de koning zou komen, verlangde zij niets, behalve wat Hegai, de kamerling van de koning, de bewaarder van de vrouwen, zei; en Esther verkreeg genade in de ogen van allen die haar zagen.","16":"Zo werd Esther genomen naar koning Ahasveros, naar zijn koninklijk huis, in de tiende maand, dat is de maand Tebeth, in het zevende jaar van zijn regering.","17":"En de koning beminde Esther boven alle vrouwen, en zij verkreeg genade en gunst bij hem, boven alle maagden; en hij zette de koninklijke kroon op haar hoofd, en hij maakte haar koningin in de plaats van Vasthi.","18":"Toen maakte de koning een grote maaltijd voor al zijn vorsten en zijn knechten, de maaltijd van Esther; en hij gaf de landschappen rust, en hij gaf geschenken naar het vermogen van de koning.","19":"Toen voor de tweede maal maagden bijeengebracht werden, zat Mordechai in de poort van de koning.","20":"Esther had haar afkomst en haar volk nog niet bekendgemaakt, zoals Mordechai haar geboden had; want Esther deed het bevel van Mordechai, zoals toen zij bij hem opgevoed werd.","21":"In die dagen, toen Mordechai in de poort van de koning zat, werden Bigthan en Theres, twee kamerlingen van de koning, van de dorpelwachters, zeer toornig, en zij zochten de hand te slaan aan koning Ahasveros.","22":"En deze zaak werd Mordechai bekendgemaakt, en hij maakte het aan koningin Esther bekend; en Esther zei het de koning, in de naam van Mordechai.","23":"Toen men de zaak onderzocht, werd het zo bevonden, en zij beiden werden aan een galg gehangen; en het werd in de kronieken geschreven voor het aangezicht van de koning."},"SV":{"1":"Na deze geschiedenissen, toen de grimmigheid van den koning Ahasveros gestild was, gedacht hij aan Vasthi, en wat zij gedaan had, en wat over haar besloten was.","2":"Toen zeiden de jongelingen des konings, die hem dienden: Men zoeke voor den koning jonge dochters, maagden, schoon van aangezicht.","3":"En de koning bestelle toezieners in al de landschappen zijns koninkrijks, dat zij vergaderen alle jonge dochters, maagden, schoon van aangezicht, tot den burg Susan, tot het huis der vrouwen, onder de hand van Hegai, des konings kamerling, bewaarder der vrouwen; en men geve haar haar versierselen.","4":"En de jonge dochter, die in des konings oog schoon wezen zal, worde koningin in stede van Vasthi. Deze zaak nu was goed in de ogen des konings, en hij deed alzo.","5":"Er was een Joods man op den burg Susan, wiens naam was Mordechai, een zoon van Jaïr, den zoon van Simeï, den zoon van Kis, een man van Jemini;","6":"Die weggevoerd was van Jeruzalem met de weggevoerden, die weggevoerd waren met Jechonia, den koning van Juda, denwelken Nebukadnezar, de koning van Babel, had weggevoerd.","7":"En hij was het, die opvoedde Hadassa ( deze is Esther, de dochter zijns ooms); want zij had geen vader noch moeder; en zij was een jonge dochter, schoon van gedaante, en schoon van aangezicht; en als haar vader en haar moeder stierven, had Mordechai ze zich tot een dochter aangenomen.","8":"Het geschiedde nu, toen het woord des konings en zijn wet ruchtbaar was, en toen vele jonge dochters samenvergaderd werden op den burg Susan, onder de hand van Hegai, werd Esther ook genomen in des konings huis, onder de hand van Hegai, den bewaarder der vrouwen.","9":"En die jonge dochter was schoon in zijn ogen, en zij verkreeg gunst voor zijn aangezicht; daarom haastte hij met haar versierselen en met haar delen haar te geven, en zeven aanzienlijke jonge dochters haar te geven uit het huis des konings; en hij verplaatste haar en haar jonge dochters naar het beste van het huis der vrouwen.","10":"Esther had haar volk en haar maagschap niet te kennen gegeven; want Mordechai had haar geboden, dat zij het niet zou te kennen geven.","11":"Mordechai nu wandelde allen dag voor het voorhof van het huis der vrouwen, om te vernemen naar den welstand van Esther, en wat met haar geschieden zou.","12":"Als nu de beurt van elke jonge dochter naakte, om tot den koning Ahasveros te komen, nadat haar twaalf maanden lang naar de wet der vrouwen geschied was; want alzo werden vervuld de dagen harer versieringen, zes maanden met mirreolie, en zes maanden met specerijen, en met *andere* versierselen der vrouwen;","13":"Daarmede kwam dan de jonge dochter tot den koning; al wat zij zeide, werd haar gegeven, dat zij daarmede ging uit het huis der vrouwen tot het huis des konings.","14":"Des avonds ging zij daarin, en des morgens ging zij weder naar het tweede huis der vrouwen, onder de hand van Saasgaz, den kamerling des konings, bewaarder der bijwijven, zij kwam niet weder tot den koning, ten ware de koning lust tot haar had, en zij bij name geroepen werd.","15":"Als de beurt van Esther, de dochter van Abichaïl, den oom van Mordechai, ( die hij zich ter dochter genomen had) naakte, dat zij tot den koning komen zou, begeerde zij niet met al, dan wat Hegai, des konings kamerling, de bewaarder der vrouwen, zeide; en Esther verkreeg genade in de ogen van allen, die haar zagen.","16":"Alzo werd Esther genomen tot den koning Ahasveros, tot zijn koninklijk huis, in de tiende maand, welke is de maand Tebeth, in het zevende jaar zijns rijks.","17":"En de koning beminde Esther boven alle vrouwen, en zij verkreeg genade en gunst voor zijn aangezicht, boven alle maagden; en hij zette de koninklijke kroon op haar hoofd, en hij maakte haar koningin in de plaats van Vasthi.","18":"Toen maakte de koning een groten maaltijd al zijn vorsten en zijn knechten, den maaltijd van Esther; en hij gaf den landschappen rust, en hij gaf geschenken naar des konings vermogen.","19":"Toen ten anderen male maagden vergaderd werden, zo zat Mordechai in de poort des konings.","20":"Esther *nu* had haar maagschap en haar volk niet te kennen gegeven, gelijk als Mordechai haar geboden had; want Esther deed het bevel van Mordechai, gelijk als toen zij bij hem opgevoed werd.","21":"In die dagen, als Mordechai in de poort des konings zat, werden Bigthan en Theres, twee kamerlingen des konings van de dorpelwachters, zeer toornig, en zij zochten de hand te slaan aan den koning Ahasveros.","22":"En deze zaak werd Mordechai bekend gemaakt, en hij gaf ze de koningin Esther te kennen; en Esther zeide het den koning in Mordechai’s naam.","23":"Als men de zaak onderzocht, is het zo bevonden, en zij beiden werden aan een galg gehangen; en het werd in de kronieken geschreven voor het aangezicht des konings."},"KJV":{"1":"After these things, when the wrath of king Ahasuerus was appeased, he remembered Vashti, and what she had done, and what was decreed","2":"Then said the king's servants that ministered unto him, Let there be fair young virgins sought for the king:","3":"And let the king appoint officers in all the provinces of his kingdom, that they may gather together all the fair young virgins unto Shushan the palace, to the house of the women, unto the custody of Hege the king's chamberlain, keeper of the women; and let their things for purification be given","4":"And let the maiden which pleaseth the king be queen instead of Vashti. And the thing pleased the king; and he did so.","5":"*Now* in Shushan the palace there was a certain Jew, whose name *was* Mordecai, the son of Jair, the son of Shimei, the son of Kish, a Benjamite;","6":"Who had been carried away from Jerusalem with the captivity which had been carried away with Jeconiah king of Judah, whom Nebuchadnezzar the king of Babylon had carried away.","7":"And he brought up Hadassah, that *is*, Esther, his uncle's daughter: for she had neither father nor mother, and the maid *was* fair and beautiful; whom Mordecai, when her father and mother were dead, took for his own daughter.","8":"So it came to pass, when the king's commandment and his decree was heard, and when many maidens were gathered together unto Shushan the palace, to the custody of Hegai, that Esther was brought also unto the king's house, to the custody of Hegai, keeper of the women.","9":"And the maiden pleased him, and she obtained kindness of him; and he speedily gave her her things for purification, with such things as belonged to her, and seven maidens, *which were* meet to be given her, out of the king's house: and he preferred her and her maids unto the best *place* of the house of the women.","10":"Esther had not shewed her people nor her kindred: for Mordecai had charged her that she should not shew","11":"And Mordecai walked every day before the court of the women's house, to know how Esther did, and what should become","12":"Now when every maid's turn was come to go in to king Ahasuerus, after that she had been twelve months, according to the manner of the women, (for so were the days of their purifications accomplished, *to wit*, six months with oil of myrrh, and six months with sweet odours, and with *other* things for the purifying of the women;)","13":"Then thus came *every* maiden unto the king; whatsoever she desired was given her to go with her out of the house of the women unto the king's house.","14":"In the evening she went, and on the morrow she returned into the second house of the women, to the custody of Shaashgaz, the king's chamberlain, which kept the concubines: she came in unto the king no more, except the king delighted in her, and that she were called by name.","15":"Now when the turn of Esther, the daughter of Abihail the uncle of Mordecai, who had taken her for his daughter, was come to go in unto the king, she required nothing but what Hegai the king's chamberlain, the keeper of the women, appointed. And Esther obtained favour in the sight of all them that looked","16":"So Esther was taken unto king Ahasuerus into his house royal in the tenth month, which *is* the month Tebeth, in the seventh year of his reign.","17":"And the king loved Esther above all the women, and she obtained grace and favour in his sight more than all the virgins; so that he set the royal crown upon her head, and made her queen instead of Vashti.","18":"Then the king made a great feast unto all his princes and his servants, *even* Esther's feast; and he made a release to the provinces, and gave gifts, according to the state of the king.","19":"And when the virgins were gathered together the second time, then Mordecai sat in the king's gate.","20":"Esther had not *yet* shewed her kindred nor her people; as Mordecai had charged her: for Esther did the commandment of Mordecai, like as when she was brought up","21":"In those days, while Mordecai sat in the king's gate, two of the king's chamberlains, Bigthan and Teresh, of those which kept the door, were wroth, and sought to lay hand on the king Ahasuerus.","22":"And the thing was known to Mordecai, who told *it* unto Esther the queen; and Esther certified the king *thereof* in Mordecai's name.","23":"And when inquisition was made of the matter, it was found out; therefore they were both hanged on a tree: and it was written in the book of the chronicles before the king."}},"tsk":{"1":[{"kopje":"dacht hij","refs":["Dan 6:15-19"]},{"kopje":"besloten was","refs":["Est 1:12-21"]}],"2":[{"kopje":"die hem dienden","refs":["Est 1:10","Est 1:14","Est 6:14"]},{"kopje":"Men zoekt","refs":["Gen 12:14","1 Kon 1:2"]}],"3":[{"kopje":"in alle landschappen","refs":["Est 1:1","Est 1:2"]},{"kopje":"Hegai","refs":["Est 2:8"]},{"kopje":"haar schoonheidsmiddelen","refs":["Est 2:12-14","Jes 3:18-23"]}],"4":[{"kopje":"de jonge dochter","refs":["Matt 20:16","Matt 22:14"]},{"kopje":"deze zaak","refs":["Est 1:21","Est 3:9","Est 3:10","2 Sam 13:4-6","2 Sam 16:21-23","2 Sam 17:4","Matt 14:6"]}],"5":[{"kopje":"Susan","refs":["Est 2:3","Est 1:2","Est 5:1"]},{"kopje":"een Joodse man","refs":["Est 3:2-6","Est 10:3"]},{"kopje":"de zoon van Simeï","refs":["1 Sam 9:1","2 Sam 16:5"]}],"6":[{"kopje":"Jechonia","refs":["2 Kon 24:6","2 Kon 24:14","2 Kon 24:15","2 Kron 36:9","2 Kron 36:10","2 Kron 36:20","Jer 22:24","Jer 22 wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H325\">Ahasuerus</span> was <span class=\"wl wl-kjv\" data-code=\"H7918\">appeased,</span> he <span class=\"wl wl-kjv\" data-code=\"H2142\">remembered</span> <span class=\"wl wl-kjv\" data-code=\"H2060\">Vashti,</span> and what she had <span class=\"wl wl-kjv\" data-code=\"H6213\">done,</span> and what was decreed","2":"Then <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H5288\">servants</span> that <span class=\"wl wl-kjv\" data-code=\"H8334\">ministered</span> unto him, Let there be <span class=\"wl wl-kjv\" data-code=\"H2896\">fair</span> <span class=\"wl wl-kjv\" data-code=\"H5291\">young</span> <span class=\"wl wl-kjv\" data-code=\"H1330\">virgins</span> <span class=\"wl wl-kjv\" data-code=\"H1245\">sought</span> for the king:","3":"And let the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H6485\">appoint</span> <span class=\"wl wl-kjv\" data-code=\"H6496\">officers</span> in all the <span class=\"wl wl-kjv\" data-code=\"H4082\">provinces</span> of his <span class=\"wl wl-kjv\" data-code=\"H4438\">kingdom,</span> that they may gather <span class=\"wl wl-kjv\" data-code=\"H6908\">together</span> all the <span class=\"wl wl-kjv\" data-code=\"H2896\">fair</span> <span class=\"wl wl-kjv\" data-code=\"H5291\">young</span> <span class=\"wl wl-kjv\" data-code=\"H1330\">virgins</span> unto <span class=\"wl wl-kjv\" data-code=\"H7800\">Shushan</span> the <span class=\"wl wl-kjv\" data-code=\"H1002\">palace,</span> to the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H802\">women,</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3027\">custody</span> of <span class=\"wl wl-kjv\" data-code=\"H1896\">Hege</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H5631\">chamberlain,</span> <span class=\"wl wl-kjv\" data-code=\"H8104\">keeper</span> of the <span class=\"wl wl-kjv\" data-code=\"H802\">women;</span> and let their things for <span class=\"wl wl-kjv\" data-code=\"H8562\">purification</span> be given","4":"And let the <span class=\"wl wl-kjv\" data-code=\"H5291\">maiden</span> which <span class=\"wl wl-kjv\" data-code=\"H3190\">pleaseth</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> be <span class=\"wl wl-kjv\" data-code=\"H4427\">queen</span> instead of <span class=\"wl wl-kjv\" data-code=\"H2060\">Vashti.</span> And the <span class=\"wl wl-kjv\" data-code=\"H1697\">thing</span> <span class=\"wl wl-kjv\" data-code=\"H3190\">pleased</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king;</span> and he did so.","5":"Now in <span class=\"wl wl-kjv\" data-code=\"H7800\">Shushan</span> the <span class=\"wl wl-kjv\" data-code=\"H1002\">palace</span> there was a <span class=\"wl wl-kjv\" data-code=\"H376\">certain</span> <span class=\"wl wl-kjv\" data-code=\"H3064\">Jew,</span> whose <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> was <span class=\"wl wl-kjv\" data-code=\"H4782\">Mordecai,</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H2971\">Jair,</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H8096\">Shimei,</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H7027\">Kish,</span> a Benjamite;","6":"Who had been carried <span class=\"wl wl-kjv\" data-code=\"H1540\">away</span> from <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> with the <span class=\"wl wl-kjv\" data-code=\"H1473\">captivity</span> which had been carried <span class=\"wl wl-kjv\" data-code=\"H1540\">away</span> with <span class=\"wl wl-kjv\" data-code=\"H3204\">Jeconiah</span> /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +

  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };

})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
