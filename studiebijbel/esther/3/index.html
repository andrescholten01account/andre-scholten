,"Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Na deze gebeurtenissen maakte de koning Ahasveros Haman groot, de zoon van Hammedatha, de Agagiet, en hij verhoogde hem, en hij zette zijn stoel boven alle vorsten die bij hem waren.","2":"En alle knechten van de koning die in de poort van de koning waren, knielden en bogen zich neer voor Haman; want de koning had zo over hem bevolen; maar Mordechai knielde niet, en boog zich niet neer.","3":"Toen zeiden de knechten van de koning die in de poort van de koning waren, tegen Mordechai: Waarom overtreedt u het gebod van de koning?","4":"Het gebeurde nu, toen zij *dit* van dag tot dag tegen hem zeiden, en hij niet naar hen luisterde, dat zij het aan Haman lieten weten, om te zien of de woorden van Mordechai stand zouden houden; want hij had hun laten weten dat hij een Jood was.","5":"Toen Haman zag dat Mordechai niet knielde, en zich niet voor hem neerboog, werd Haman vervuld met woede.","6":"Doch hij vond het beneden zich om alleen aan Mordechai de hand te slaan (want men had hem het volk van Mordechai aangewezen); maar Haman zocht alle Joden die in het hele koninkrijk van Ahasveros waren, *namelijk* het volk van Mordechai, uit te roeien.","7":"In de eerste maand (dat is de maand Nisan), in het twaalfde jaar van de koning Ahasveros, wierp men het Pur, dat is het lot, voor het aangezicht van Haman, van dag tot dag, en van maand tot maand, tot de twaalfde maand toe; dat is de maand Adar.","8":"Want Haman had tegen de koning Ahasveros gezegd: Er is een volk, verstrooid en verspreid onder de volken in alle landschappen van uw koninkrijk; en hun wetten zijn anders dan die van alle volken; ook houden zij zich niet aan de wetten van de koning; daarom is het voor de koning niet goed hen te laten blijven.","9":"Als het de koning goeddunkt, laat er geschreven worden dat men hen ombrengt; dan zal ik tienduizend talenten zilver opwegen in de handen van hen die het werk doen, om het in de schatten van de koning te brengen.","10":"Toen trok de koning zijn ring van zijn hand, en hij gaf hem aan Haman, de zoon van Hammedatha, de Agagiet, de tegenstander van de Joden.","11":"En de koning zei tegen Haman: Dat zilver is aan u geschonken, ook dat volk, om daarmee te doen zoals het goed is in uw ogen.","12":"Toen werden de schrijvers van de koning geroepen, in de eerste maand, op de dertiende dag daarvan, en er werd geschreven naar alles wat Haman beval, aan de stadhouders van de koning, en aan de landvoogden die over elk landschap waren, en aan de vorsten van elk volk, elk landschap naar zijn schrift, en elk volk naar zijn taal; er werd geschreven in de naam van de koning Ahasveros, en het werd met de ring van de koning verzegeld.","13":"De brieven nu werden gezonden door de hand van de lopers naar alle landschappen van de koning, dat men zou uitroeien, doden en ombrengen alle Joden, van jong tot oud toe, de kleine kinderen en de vrouwen, op één dag, op de dertiende van de twaalfde maand (dat is de maand Adar), en dat men hun buit zou roven.","14":"De inhoud van het schrift was, dat er een wet zou worden gegeven in alle landschappen, openbaar gemaakt aan alle volken, dat zij tegen dezelfde dag gereed zouden zijn.","15":"De lopers gingen uit, aangespoord door het woord van de koning, en de wet werd uitgegeven in de burcht Susan. En de koning en Haman gingen zitten om te drinken, doch de stad Susan was in verwarring."},"SV":{"1":"Na deze geschiedenissen maakte de koning Ahasveros Haman groot, den zoon van Hammedatha, den Agagiet, en hij verhoogde hem, en hij zette zijn stoel boven al de vorsten, die bij hem waren.","2":"En al de knechten des konings, die in de poort des konings waren, neigden en bogen zich neder voor Haman; want de koning had alzo van hem bevolen; maar Mordechai neigde zich niet, en boog zich niet neder.","3":"Toen zeiden de knechten des konings, die in de poort des konings waren, tot Mordechai: Waarom overtreedt gij des konings gebod?","4":"Het geschiedde nu, toen zij *dit* van dag tot dag tot hem zeiden, en hij naar hen niet hoorde, zo gaven zij het Haman te kennen, opdat zij zagen, of de woorden van Mordechai bestaan zouden; want hij had hun te kennen gegeven, dat hij een Jood was.","5":"Toen Haman zag, dat Mordechai zich niet neigde, noch zich voor hem nederboog, zo werd Haman vervuld met grimmigheid.","6":"Doch hij verachtte in zijn ogen, dat hij aan Mordechai alleen de hand zou slaan ( want men had hem het volk van Mordechai aangewezen); maar Haman zocht al de Joden, die in het ganse koninkrijk van Ahasveros waren, *namelijk* het volk van Mordechai, te verdelgen.","7":"In de eerste maand ( deze is de maand Nisan) in het twaalfde jaar van den koning Ahasveros, wierp men het Pur, dat is, het lot, voor Hamans aangezicht, van dag tot dag, en van maand *tot* *maand*, tot de twaalfde maand toe; deze is de maand Adar.","8":"Want Haman had tot den koning Ahasveros gezegd: Er is een volk, verstrooid en verdeeld onder de volken in al de landschappen uws koninkrijks; en hun wetten zijn verscheiden van *de* *wetten* aller volken; ook doen zij des konings wetten niet; daarom is het den koning niet oorbaar hen te laten blijven.","9":"Indien het den koning goeddunkt, laat er geschreven worden, dat men hen verdoe; zo zal ik tien duizend talenten zilvers opwegen in de handen dergenen, die het werk doen, om in des konings schatten te brengen.","10":"Toen trok de koning zijn ring van zijn hand, en hij gaf hem aan Haman, den zoon van Hammedatha, den Agagiet, der Joden tegenpartijder.","11":"En de koning zeide tot Haman: Dat zilver zij u geschonken, ook dat volk, om daarmede te doen, naar dat het goed is in uw ogen.","12":"Toen werden de schrijvers des konings geroepen, in de eerste maand, op den dertienden dag derzelve, en er werd geschreven naar alles, wat Haman beval, aan de stadhouders des konings, en aan de landvoogden, die over elk landschap waren, en aan de vorsten van elk volk, elk landschap naar zijn schrift, en elk volk naar zijn spraak; er werd geschreven in den naam van den koning Ahasveros, en het werd met des konings ring verzegeld.","13":"De brieven nu werden gezonden door de hand der lopers tot al de landschappen des konings, dat men zou verdelgen, doden en verdoen al de Joden, van den jonge tot den oude toe, de kleine kinderen en de vrouwen, op een dag, op den dertienden der twaalfde maand ( deze is de maand Adar), en dat men hun buit zou roven.","14":"De inhoud van het schrift was, dat er een wet zou gegeven worden in alle landschappen, openbaar aan alle volken, dat zij tegen denzelfden dag zouden gereed zijn.","15":"De lopers gingen uit, voortgedrongen zijnde door het woord des konings, en de wet werd uitgegeven in den burg Susan. En de koning en Haman zaten en dronken, doch de stad Susan was verward."},"KJV":{"1":"After these things did king Ahasuerus promote Haman the son of Hammedatha the Agagite, and advanced him, and set his seat above all the princes","2":"And all the king's servants, that *were* in the king's gate, bowed, and reverenced Haman: for the king had so commanded concerning him. But Mordecai bowed not, nor did *him* reverence.","3":"Then the king's servants, which *were* in the king's gate, said unto Mordecai, Why transgressest thou the king's commandment?","4":"Now it came to pass, when they spake daily unto him, and he hearkened not unto them, that they told Haman, to see whether Mordecai's matters would stand: for he had told them that he *was* a Jew.","5":"And when Haman saw that Mordecai bowed not, nor did him reverence, then was Haman full of wrath.","6":"And he thought scorn to lay hands on Mordecai alone; for they had shewed him the people of Mordecai: wherefore Haman sought to destroy all the Jews that *were* throughout the whole kingdom of Ahasuerus, *even* the people of Mordecai.","7":"In the first month, that *is*, the month Nisan, in the twelfth year of king Ahasuerus, they cast Pur, that *is*, the lot, before Haman from day to day, and from month to month, *to* the twelfth *month*, that *is*, the month Adar.","8":"And Haman said unto king Ahasuerus, There is a certain people scattered abroad and dispersed among the people in all the provinces of thy kingdom; and their laws *are* diverse from all people; neither keep they the king's laws: therefore it *is* not for the king's profit to suffer","9":"If it please the king, let it be written that they may be destroyed: and I will pay ten thousand talents of silver to the hands of those that have the charge of the business, to bring *it* into the king's treasuries.","10":"And the king took his ring from his hand, and gave it unto Haman the son of Hammedatha the Agagite, the Jews' enemy.","11":"And the king said unto Haman, The silver *is* given to thee, the people also, to do with them as it seemeth good","12":"Then were the king's scribes called on the thirteenth day of the first month, and there was written according to all that Haman had commanded unto the king's lieutenants, and to the governors that *were* over every province, and to the rulers of every people of every province according to the writing thereof, and *to* every people after their language; in the name of king Ahasuerus was it written, and sealed with the king's ring.","13":"And the letters were sent by posts into all the king's provinces, to destroy, to kill, and to cause to perish, all Jews, both young and old, little children and women, in one day, *even* upon the thirteenth *day* of the twelfth month, which is the month Adar, and *to take* the spoil of them for a prey.","14":"The copy of the writing for a commandment to be given in every province was published unto all people, that they should be ready against that day.","15":"The posts went out, being hastened by the king's commandment, and the decree was given in Shushan the palace. And the king and Haman sat down to drink; but the city Shushan was perplexed."}},"tsk":{"1":[{"kopje":"Haman groot","refs":["Est 7:6","Ps 12:9","Spr 29:2"]},{"kopje":"Agagiet","refs":["Num 24:7","1 Sam 15:8","1 Sam 15:33"]},{"kopje":"boven alle vorsten","refs":["Est 1:14","Gen 41:40","Gen 41:55","Ezra 7:14","Dan 6:3"]}],"2":[{"kopje":"knechten van de koning","refs":["Est 2:19","Est 2:21"]},{"kopje":"bogen zich neer","refs":["Gen 41:43","Fil 2:10"]},{"kopje":"boog zich niet neer","refs":["Est 3:1","Est 3:5","Ex 17:14","Ex 17:16","Deut 25:19","1 Sam 15:3","Ps 15:4"]}],"3":[{"kopje":"Waarom","refs":["Est 3:2","Ex 1:17","Matt 15:2","Matt 15:3"]}],"4":[{"kopje":"toen zij dit tegen hem zeiden","refs":["Gen 39:10"]},{"kopje":"dat zij het aan Haman lieten weten","refs":["Dan 3:8","Dan 3:9","Dan 6:14"]},{"kopje":"hij had hun laten weten","refs":["Ezra 1:3","Dan 3:12","Dan 3:16-18","Dan 3:23-30","Dan 6:21-29","Jona 1:9"]}],"5":[{"kopje":"dat Mordechai","refs":["Est 3:2","Est 5:9"]},{"kopje":"vervuld met woede","refs":["Est 1:12","Gen 4:5","Gen 4:6","Job 5:2","Spr 12:16","Spr 19:19","Spr 21:24","Spr 27:3","Spr 27:4","Dan 3:19"]}],"6":[{"kopje":"zocht","refs":["Ps 83:5","Openb 12:12"]}],"7":[{"kopje":"de eerste maand","refs":["Neh 2:1"]},{"kopje":"in het twaalfde","refs":["Est 1:3","Est 2:16"]},{"kopje":"wierp men het Pur","refs":["Est 9: 3117\">daily</span> unto him, and he <span class=\"wl wl-kjv\" data-code=\"H8085\">hearkened</span> not unto them, that they <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> <span class=\"wl wl-kjv\" data-code=\"H2001\">Haman,</span> to <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> whether <span class=\"wl wl-kjv\" data-code=\"H4782\">Mordecai's</span> <span class=\"wl wl-kjv\" data-code=\"H1697\">matters</span> would <span class=\"wl wl-kjv\" data-code=\"H5975\">stand:</span> for he had <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> them that he was a Jew.","5":"And when <span class=\"wl wl-kjv\" data-code=\"H2001\">Haman</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> that <span class=\"wl wl-kjv\" data-code=\"H4782\">Mordecai</span> <span class=\"wl wl-kjv\" data-code=\"H3766\">bowed</span> not, nor did him <span class=\"wl wl-kjv\" data-code=\"H7812\">reverence,</span> then was <span class=\"wl wl-kjv\" data-code=\"H2001\">Haman</span> <span class=\"wl wl-kjv\" data-code=\"H4390\">full</span> of wrath.","6":"And he <span class=\"wl wl-kjv\" data-code=\"H5869\">thought</span> <span class=\"wl wl-kjv\" data-code=\"H959\">scorn</span> to <span class=\"wl wl-kjv\" data-code=\"H7971\">lay</span> <span class=\"wl wl-kjv\" data-code=\"H3027\">hands</span> on <span class=\"wl wl-kjv\" data-code=\"H4782\">Mordecai</span> alone; for they had <span class=\"wl wl-kjv\" data-code=\"H5046\">shewed</span> him the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> of <span class=\"wl wl-kjv\" data-code=\"H4782\">Mordecai:</span> wherefore <span class=\"wl wl-kjv\" data-code=\"H2001\">Haman</span> <span class=\"wl wl-kjv\" data-code=\"H1245\">sought</span> to <span class=\"wl wl-kjv\" data-code=\"H8045\">destroy</span> all the <span class=\"wl wl-kjv\" data-code=\"H3064\">Jews</span> that were throughout the whole <span class=\"wl wl-kjv\" data-code=\"H4438\">kingdom</span> of <span class=\"wl wl-kjv\" data-code=\"H325\">Ahasuerus,</span> even the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> of Mordecai.","7":"In the <span class=\"wl wl-kjv\" data-code=\"H7223\">first</span> <span class=\"wl wl-kjv\" data-code=\"H2320\">month,</span> that is, the <span class=\"wl wl-kjv\" data-code=\"H2320\">month</span> <span class=\"wl wl-kjv\" data-code=\"H5212\">Nisan,</span> in the <span class=\"wl wl-kjv\" data-code=\"H8147\">twelfth</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">year</span> of <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H325\">Ahasuerus,</span> they <span class=\"wl wl-kjv\" data-code=\"H5307\">cast</span> <span class=\"wl wl-kjv\" data-code=\"H6332\">Pur,</span> that is, the <span class=\"wl wl-kjv\" data-code=\"H1486\">lot,</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> <span class=\"wl wl-kjv\" data-code=\"H2001\">Haman</span> from <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> to <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> and from <span class=\"wl wl-kjv\" data-code=\"H2320\">month</span> to <span class=\"wl wl-kjv\" data-code=\"H2320\">month,</span> to the <span class=\"wl wl-kjv\" data-code=\"H8147\">twelfth</span> month, that is, the <span class=\"wl wl-kjv\" data-code=\"H2320\">month</span> Adar.","8":"And <span class=\"wl wl-kjv\" data-code=\"H2001\">Haman</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H325\">Ahasuerus,</span> There <span class=\"wl wl-kjv\" data-code=\"H3426\">is</span> a <span class=\"wl wl-kjv\" data-code=\"H259\">certain</span> <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> scattered <span class=\"wl wl-kjv\" data-code=\"H6340\">abroad</span> and <span class=\"wl wl-kjv\" data-code=\"H6504\">dispersed</span> among the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> in all the <span class=\"wl wl-kjv\" data-code=\"H4082\">provinces</span> of thy <span class=\"wl wl-kjv\" data-code=\"H4438\">kingdom;</span> and their <span class=\"wl wl-kjv\" data-code=\"H1881\">laws</span> are <span class=\"wl wl-kjv\" data-code=\"H8138\">diverse</span> from all <span class=\"wl wl-kjv\" data-code=\"H5971\">people;</span> neither <span class=\"wl wl-kjv\" data-code=\"H6213\">keep</span> they the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H1881\">laws:</span> therefore it is not for the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H7737\">profit</span> to suffer","9":"If it <span class=\"wl wl-kjv\" data-code=\"H2895\">please</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> let it be <span class=\"wl wl-kjv\" data-code=\"H3789\">written</span> that they may be <span class=\"wl wl-kjv\" data-code=\"H6\">destroyed:</span> and I will <span class=\"wl wl-kjv\" data-code=\"H8254\">pay</span> <span class=\"wl wl-kjv\" data-code=\"H6235\">ten</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> <span class=\"wl wl-kjv\" data-code=\"H3603\">talents</span> of <span class=\"wl wl-kjv\" data-code=\"H3701\">silver</span> to the <span class=\"wl wl-kjv\" data-code=\"H3027\">hands</span> of those that have the <span class=\"wl wl-kjv\" data-code=\"H6213\">charge</span> of the <span class=\"wl wl-kjv\" data-code=\"H4399\">business,</span> to <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> it into the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> treasuries.","10":"And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H5493\">took</span> his <span class=\"wl wl-kjv\" data-code=\"H2885\">ring</span> from his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> it unto <span class=\"wl wl-kjv\" data-code=\"H2001\">Haman</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H4099\">Hammedatha</span> the <span class=\"wl wl-kjv\" data-code=\"H91\">Agagite,</span> the <span class=\"wl wl-kjv\" data-code=\"H3064\">Jews'</span> enemy.","11":"And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H2001\">Haman,</span> The <span class=\"wl wl-kjv\" data-code=\"H3701\">silver</span> is <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> to thee, the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> also, to <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> with them as it <span class=\"wl wl-kjv\" data-code=\"H5869\">seemeth</span> good","12":"Then were the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H5608\">scribes</span> <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> on the <span class=\"wl wl-kjv\" data-code=\"H7969\">thirteenth</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of the <span class=\"wl wl-kjv\" data-code=\"H7223\">first</span> <span class=\"wl wl-kjv\" data-code=\"H2320\">month,</span> and there was <span class=\"wl wl-kjv\" data-code=\"H3789\">written</span> according to all that <span class=\"wl wl-kjv\" data-code=\"H2001\">Haman</span> had <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> unto the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H323\">lieutenants,</span> and to the <span class=\"wl wl-kjv\" data-code=\"H6346\">governors</span> that were over every <span class=\"wl wl-kjv\" data-code=\"H4082\">province,</span> and to the <span class=\"wl wl-kjv\" data-code=\"H8269\">rulers</span> of every <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> of every <span class=\"wl wl-kjv\" data-code=\"H4082\">province</span> according to the <span class=\"wl wl-kjv\" data-code=\"H3791\">writing</span> thereof, and to every <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> after their <span class=\"wl wl-kjv\" data-code=\"H3956\">language;</span> in the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H325\">Ahasuerus</span> was it <span class=\"wl wl-kjv\" data-code=\"H3789\">written,</span> and <span class=\"wl wl-kjv\" data-code=\"H2856\">sealed</span> with the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> ring.","13":"And the <span class=\"wl wl-kjv\" data-code=\"H5612\">letters</span> were <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> <span class=\"wl wl-kjv\" data-code=\"H3027\">by</span> <span class=\"wl wl-kjv\" data-code=\"H7323\">posts</span> into all the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H4082\">provinces,</span> to <span class=\"wl wl-kjv\" data-code=\"H8045\">destroy,</span> to <span class=\"wl wl-kjv\" data-code=\"H2026\">kill,</span> and to cause to <span class=\"wl wl-kjv\" data-code=\"H6\">perish,</span> all <span class=\"wl wl-kjv\" data-code=\"H3064\">Jews,</span> both <span class=\"wl wl-kjv\" data-code=\"H5288\">young</span> and <span class=\"wl wl-kjv\" data-code=\"H2205\">old,</span> little <span class=\"wl wl-kjv\" data-code=\"H2945\">children</span> and <span class=\"wl wl-kjv\" data-code=\"H802\">women,</span> in <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> even upon the <span class=\"wl wl-kjv\" data-code=\"H7969\">thirteenth</span> day of the <span class=\"wl wl-kjv\" data-code=\"H8147\">twelfth</span> <span class=\"wl wl-kjv\" data-code=\"H2320\">month,</span> which is the <span class=\"wl wl-kjv\" data-code=\"H2320\">month</span> <span class=\"wl wl-kjv\" data-code=\"H143\">Adar,</span> and to take the <span class=\"wl wl-kjv\" data-code=\"H7998\">spoil</span> of them for a prey.","14":"The <span class=\"wl wl-kjv\" data-code=\"H6572\">copy</span> of the <span class=\"wl wl-kjv\" data-code=\"H3791\">writing</span> for a <span class=\"wl wl-kjv\" data-code=\"H1881\">commandment</span> to be <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> in every <span class=\"wl wl-kjv\" data-code=\"H4082\">province</span> was <span class=\"wl wl-kjv\" data-code=\"H1540\">published</span> unto all <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> that they should be <span class=\"wl wl-kjv\" data-code=\"H6264\">ready</span> against that day.","15":"The <span class=\"wl wl-kjv\" data-code=\"H7323\">posts</span> went <span class=\"wl wl-kjv\" data-code=\"H3318\">out,</span> being <span class=\"wl wl-kjv\" data-code=\"H1765\">hastened</span> by the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H1697\">commandment,</span> and the <span class=\"wl wl-kjv\" data-code=\"H1881\">decree</span> was <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> in <span class=\"wl wl-kjv\" data-code=\"H7800\">Shushan</span> the <span class=\"wl wl-kjv\" data-code=\"H1002\">palace.</span> And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> and <span class=\"wl wl-kjv\" data-code=\"H2001\">Haman</span> sat <span class=\"wl wl-kjv\" data-code=\"H3427\">down</span> to <span class=\"wl wl-kjv\" data-code=\"H8354\">drink;</span> but the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> <span class=\"wl wl-kjv\" data-code=\"H7800\">Shushan</span> was perplexed."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"maakte de koning","tekst":"Dat is, hij verhief hem boven al de andere vorsten en groten zijns rijks."},{"catchword":"Agagiet,","tekst":"Eenigen menen dat Haman is afkomstig geweest van Agag den koning der Amalekieten, van welken te lezen is 1Sa 15:8 . Zie ook Exo 17:14 ; Num 24:7 ."},{"catchword":"boven al de vorsten,","tekst":"Dat is, boven de stoelen van al de vorsten; 2Ki 25:28 ."}],"2":[{"catchword":"al de knechten des konings,","tekst":"Versta hier, al de hovelingen, of die van des konings lijfwacht waren."},{"catchword":"neigden","tekst":"Hem een onbetamelijken, ongeoorloofden Perzischen eerbied bewijzende, waarin Mordechai gewetensbezwaar maakte hen na te volgen; te meer, naar sommiger gevoelen, omdat hem bekend was dat deze Haman een Amalekiet was."},{"catchword":"van hem bevolen;","tekst":"Dat is, hem aangaande."}],"3":[{"catchword":"Waarom overtreedt","tekst":"Zie boven, vs.2."}],"4":[{"catchword":"naar hen niet hoorde,","tekst":"Dat is, hun niet gehoorzaamde en zich niet liet bewegen door hun aanspraak en vermaning."},{"catchword":"of de woorden van Mórdechaï","tekst":"Dat is, of hij standvastig zou blijven in zijn religie en of hij derhalve voortaan weigeren zou voor Haman zich te neigen."},{"catchword":"hij had hun te kennen gegeven,","tekst":"Te weten, als zij hem vraagden, waarom hij des konings gebod niet gehoorzaamde, mist zich voor Haman buigende."},{"catchword":"dat hij een Jood was","tekst":"Welken het niet geoorloofd was enen mens te aanbidden, want God heeft verboden de creaturen aan te bidden; Deu 6:13 , en Deu 10:12 , Deu 10:20 , en Deu 17:3 ; Mat 4:10 ; Luk 4:8 ."}],"6":[{"catchword":"hij verachtte","tekst":"Dat is, hij achtte het te gering en de moeite niet waard te zijn, dat hij Mordechai alleen zou doden."},{"catchword":"de hand zou slaan","tekst":"Te weten, om hem te doden. Alzo ook boven, Est 2:21 ."},{"catchword":"volk van Mórdechaï","tekst":"Dat is, de landslieden; of van welk volk en natie Mordechai gesproten was."}],"7":[{"catchword":"Nisan","tekst":"Overeenkomende ten dele met onzen Maart, ten dele met onzen April."},{"catchword":"het Pur,","tekst":"Pur, of phur is een Perzisch woord, betekenende het lot, onder, Est 9:24 ."},{"catchword":"van dag tot dag,","tekst":"De zin dezer woorden is, dat men volgens het heidens Perzische bijgeloof, het lot wierp, om te weten op welken dag en maand, dat het bekwaamst zou wezen, de Joden alom op een en denzelfden dag te verdelgen."},{"catchword":"tot de twaalfde maand toe;","tekst":"Dat is, in de twaalfde maand kwam eerst het lot uit, hetwelk den dag aanwees, op welken men de Joden zou ombrengen."},{"catchword":"Adar","tekst":"Dit is een Syrisch of Chaldeeuws woord, gelijk er geschreven staat 2 Macc.15:37. En deze maand viel ten dele in onzen Februari, ten dele in Maart."}],"8":[{"catchword":"had tot den koning","tekst":"Te weten, eer hij het lot wierp; want dit zou vergeefse moeite geweest zijn, ten ware dat hij eerst consent van den koning gehad had om de Joden uit te roeien."},{"catchword":"doen zij des konings wetten niet;","tekst":"Dit zegt hij daarom, omdat Mordechai den koning niet gehoorzaamde in Haman te aanbidden. En hetgeen Mordechai tegen hem alleen misdaan had, dat legt Haman hier al den Joden ten last, en beschuldigt hen, alsof zij altegaar al de wetten des konings verachttten."},{"catchword":"hen te laten blijven","tekst":"Te weten, in het koninkrijk, of in het leven, maar zij dienen uitgeroeid te wezen."}],"9":[{"catchword":"dat men hen","tekst":"Te weten, al de Joden, die in des konings gebied te vinden zijn."},{"catchword":"zo zal ik","tekst":"Dezen groten schat belooft hij den koning te leveren, opdat hij hem ter eer bewege toe te laten, dat hij de Joden zou mogen ombrengen."},{"catchword":"dergenen,","tekst":"Hij verstaat de thesauriers des konings, die last zouden hebben dit geld te ontvangen."},{"catchword":"schatten te brengen","tekst":"Of, schatkisten, of schatkamers."}],"10":[{"catchword":"zijn ring","tekst":"Te weten, zijn zegelring, gelijk af te nemen is uit Est 8:8 . Dit deed de koning tot een teken der macht, die hij Haman gaf. Zie de aantekening Gen 41:42 , en hier onder, vs.12."}],"11":[{"catchword":"zilver","tekst":"Te weten, die tien duizend talenten, die gij gepresenteerd hebt in mijn schatkamer te leveren."},{"catchword":"ook dat volk,","tekst":"Te weten, de Joden, die gij wilt laten ombrengen."}],"12":[{"catchword":"in de eerste maand,","tekst":"Genoemd, Nisan, vs.7."},{"catchword":"naar alles,","tekst":"Dit was, dat men op zulk een dag, als het Haman zou goeddunken, het gebod des konings, belangende het ombrengen aller Joden, zou in het werk stellen."},{"catchword":"die over elk landschap","tekst":"Hebreeuws, die over landschap en landschap, en volk en volk waren. Alzo ook meermalen hierna."}],"13":[{"catchword":"hun buit zou roven","tekst":"Dat is, hun goederen, die hier genoemd worden de buit der Joden; hetwelk zo niet te verstaan is, alsof zij denzelven anderen hadden afgenomen of geroofd; maar omdat anderen [te weten, Haman en de zijnen] hun dien wilden afnemen en hen daarvan beroven."}],"14":[{"catchword":"inhoud","tekst":"Of, copie."},{"catchword":"zou gegeven worden","tekst":"Te weten, van de vorsten en landvoogden, elk in zijn gebied."},{"catchword":"in alle landschappen,","tekst":"Hebreeuws, in alle landschap en landschap."},{"catchword":"tegen denzelfden dag","tekst":"Te weten, op den dertienden dag der twaalfde maand."},{"catchword":"zouden gereed zijn","tekst":"Te weten, om de Joden te overvallen, te doden en te verdoen, en hun goederen te roven, vs.13."}],"15":[{"catchword":"door het woord","tekst":"Dat is, door des konings plakkaat, dat van het ombrengen der Joden op den burg Susan eerst aangeslagen was."},{"catchword":"zaten en dronken,","tekst":"Hebreeuws, zaten om te drinken, of drinkende."},{"catchword":"de stad Susan","tekst":"Dat is, de inwoners der stad Susan; maar inzonderheid de Joden, die in dezelve woonden, wier goed en bloed daaraan gelegen was. Zie onder, Est 8:15 ."},{"catchword":"verward","tekst":"Of, perplex, gelijk men nu spreekt."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"After these things did king Ahasuerus make Haman the son of Hammedatha the Agagite [Some conceive that Haman came of the race of Agag King of the Amalekites, of whom we may read, 1 Sam.15.8. See likewise Exo 14:17. and Num 24:7. and 2 Kings. 25.28.] great, [that is, he promoted him above all the Princes and Peers of his Realm, as is shewed in the following words of the verse] and he advanced him: And he set his seat above all the Princes that were with him. [That is, above the seats of all the Princes.]"}],"2":[{"catchword":null,"tekst":"And all the kings servants [Understand here, all the Courtiers, or those that were of the Kings life-guard] that were in the kings gate, bended and bowed themselves down before Haman, [giving undecent and unlawful Persian honor unto him] for the king had so commanded of him: [That is, concerning him] but Mordechai bended himself not, nor bowed himself down before him. [Merdochai made conscience of imitating Ahasuerus his Courtiers in giving unmet and unlawful Persian honor Haman. And the rather, because (as some conceive) he knew that this Haman was an Amalekite.]"}],"3":[{"catchword":null,"tekst":"Then the kings servants, which were in the kings gate, said unto Mordechai; why transgresses thou the kings commandment? [See above v.2.]"}],"4":[{"catchword":null,"tekst":"Now it came to pass, when they spake (this) to him from day to day, and he hearkened not unto them: [that is, obeyed them not, nor was any whit moved by their speaking to him, or admonishing of him] then they made it known unto Haman, to see whether the words of Mordechai would stand, [that is, whether he would continue stedfast in his Religion, and whether he would hence forward refuse to how before Haman] for he had told them [to wit, when they asked him why he obeyed not the Kings commandment, in bowing down before Haman] that he was a Jew. [to whom it was unlawful to worship a man; for God had forbidden to worship the creature, Deut.6.13. and 10.v.12,20. And 17.v.3. Mat 4:10. Luk 4:8.]"}],"5":[{"catchword":null,"tekst":"When Haman saw that Mordechai bowed not himself, nor stooped down before him: then was Haman filled with wrath."}],"6":[{"catchword":null,"tekst":"Howbeit, he disdained in his eyes, to lay hand on Mordechai alone, [ To wit, to kill him. So above ch.22.vers. 21. That is, he thought it too mean and contemptible a thing, and not worth the labour to take away only Mordechai&acirc;&euro;&trade;s life] (for they had shewed him the people of Mordechai) [That is, his countrymen: Or, of what people and nation Mordechai was descended] but Haman sought to destroy all the Jews, that were in all the kingdom of Ahasuerus, (namely) the people of Mordechai."}],"7":[{"catchword":null,"tekst":"In the first month (this if the month Nisan) [Agreeing partly with our March, & partly with our April] in the twelfth year of king Ahasuerus, they cast pur, that is, the lot, [pur, or, phur is a Persian word, signifying a lot, below cha.9.24.] before the face of Haman, from day to day, and from month to month, [the meaning or these words is, that they cast the lot, according to the heathenish Persian superstition, know what day and what month would be the sittest time and season, to destroy and kill all the Jews every where upon one and the same day] to the twelfth month, [in the twelfth month came the lot forth, which pointed at the day on which they were to kill and murder the Jews] this is the month Adar. [this is a Syrian or Chaldean word, it is written, 2 Mac.15.37. And this month fell partly in our February, and partly in our March.]"}],"8":[{"catchword":null,"tekst":"For Haman had said unto king Ahasuerus, [To wit, before he cast the lot: For this would have been labour in vain, unless he had first got leave of the King to destroy the Jews] there is a people scattered ad divided among the nations in all the countries of thy kingdom: and their laws are different from (the laws) of all nations: neither keep they the kings laws; [He saith this, because Mordechai obeyed not the king in worshipping of Haman. And that wherein Mordechai alone had offended against him, the same doth Haman here lay to the charge of all the Jews, and accuseth them as if all of them together did despise and contemn the Kings laws] therefore it is not profitable for the king to suffer them to remain. [to wit, in the kingdom, or live, but they ought to be destroyed.]"}],"9":[{"catchword":null,"tekst":"If it seem good unto the king, let it be written, that they [To wit, all the Jews that may be found within the Kings dominion] may be destroyed: Then I will weigh out ten thousand talents of silver into the hands of those that do the work, [he meaneth the Kings Treasurers, that should have the charge to receive the money] to bring (it) into the kings Treasures [or, offers of treasures, or, treasures. He promiseth to give or deliver this great treasure unto the King, that he may the sooner move him, to give way, that he may destroy the Jews.]"}],"10":[{"catchword":null,"tekst":"Then the King pulled (off) his ring, [To wit, his seal-ring, as may be gathered from chap.8.v.8.] from his hand, and gave it unto Haman the son of Hammedatha the Agagite, the Jews adversary. [the king did this, to declareand manifest the power which he gave unto Haman. See Gen.41. the annotate.on verse 42. And here below verse.12.]"}],"11":[{"catchword":null,"tekst":"And the king said unto Haman, Let that silver, [To wit, those ten thousand talents, which thou hast proffered to deliver into my treasury] be given unto thee: also that people, [to wit, the Jews, whom thou purposest to destroy, or hast a mind to cause them to be destroyed] to do with them according as it is good in thine eyes."}],"12":[{"catchword":null,"tekst":"Then were the Kings Scribes called, in the first month, [Called Nisan, Verse 7.] on the thirteenth day of the same (month) and there was written according to all that Haman commanded, [this was, that on such a day when Haman thought good, they should perform the kings commandment concerning the destroying of all the Jews] unto the kings Lieutenants, and to the Governors that were over every country, and to the princes of each people, [Hebr. that were over country and country, people and people: so likewise frequently hereafter,] (to) each country according to the writing thereof, and (to) each people after their language; it was written in the name of king Ahasuerus, and it was sealed with the kings ring."}],"13":[{"catchword":null,"tekst":"Now the letters were sent by the hand of the runners unto all the kings countrys, to destroy, kill, and cut off all the Jews, from the young to the old, the little children and the woman in one day, upon the thirteenth (day) of the twelfth month (this is the month Adar) and to taste the spoil of them for a prey. [That is, to take away their goods, which are here called the spoil, or prey, or the Jews, which is not so to be understood, as if they had stolen, and or taken them away from others; But because others (to wit, Haman with his crew) would take them away from them, and rob them of them.]"}],"14":[{"catchword":null,"tekst":"The contents [Or, copy] of the writing was, that there should be a law given [To wit, by the Princes and Governors, every one in all countries [Hebr. in all (or every) country and country] manifest unto all nations that they should be ready [to wit, to fall upon the Jews, to kill and destroy them, and to rob and plunder their goods, verse 13.] against that day. [to wit, the thirteenth day of the twelfth month.]"}],"15":[{"catchword":null,"tekst":"The runners went out, being by the word of the king [That is, by the kings decree concerning the destroying of the Jews, which decree or proclaimation was first in Castle of Susan, as the following words declare] and the law the was given out in the Castle of Susan, And the king and Haman sat and drank, [Hebr. sat to drink, or drinking] but the city of Susan [that is the inhabitants of the city of Susan: but especially the Jews that dwelt it, whose stake. See below. Chap.8.on verse 15.] was troubled. [or perplexed, as we use to say.]"}]}}};

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');

});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:Lora;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
