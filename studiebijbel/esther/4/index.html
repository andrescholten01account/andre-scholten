pgave van het zilver dat Haman gezegd had te zullen wegen in de schatten van de koning, voor de Joden, om hen om te brengen.","8":"En hij gaf hem het afschrift van de geschreven wet, die te Susan gegeven was om hen te verdelgen, opdat hij het Esther zou laten zien, en het haar te kennen zou geven, en haar zou gebieden dat zij naar de koning zou gaan om hem te smeken, en van hem te verzoeken voor haar volk.","9":"Hatach nu kwam, en gaf Esther de woorden van Mordechai te kennen.","10":"Toen zei Esther tegen Hatach, en gaf hem opdracht aan Mordechai:","11":"Alle knechten van de koning en het volk van de landschappen van de koning weten wel dat ieder die tot de koning ingaat in het binnenste voorhof, zonder geroepen te zijn, of het nu een man of een vrouw is, één vonnis geldt: dat men hem doodt, tenzij de koning hem de gouden scepter toereikt, zodat hij levend blijft; ik nu ben deze dertig dagen niet geroepen om bij de koning te komen.","12":"En zij gaven de woorden van Esther aan Mordechai te kennen.","13":"Toen zei Mordechai dat men Esther terug zou laten zeggen: Beeld u niet in, in uw ziel, dat u zult ontkomen in het huis van de koning, meer dan alle andere Joden.","14":"Want als u nu volstrekt blijft zwijgen, zal er voor de Joden verkwikking en verlossing vanuit een andere plaats ontstaan; maar u en het huis van uw vader zullen omkomen; en wie weet of u niet juist om zo'n tijd als deze tot dit koninkrijk gekomen bent.","15":"Toen zei Esther dat men Mordechai weer zou laten weten:","16":"Ga, verzamel alle Joden die te Susan gevonden worden, en vast voor mij, en eet of drink niet, drie dagen lang, nacht noch dag; ik en mijn jonge dochters zullen ook zo vasten, en zo zal ik tot de koning ingaan, wat niet naar de wet is. Wanneer ik dan omkom, dan kom ik om.","17":"Toen ging Mordechai weg, en hij deed naar alles wat Esther hem geboden had."},"SV":{"1":"Als Mordechai wist al wat er geschied was, zo verscheurde Mordechai zijn klederen, en hij trok een zak aan met as; en hij ging uit door het midden der stad, en hij riep *met* een groot en bitter geroep.","2":"En hij kwam tot voor de poort des konings; want niemand mocht in des konings poort inkomen, bekleed met een zak.","3":"En in alle en een ieder landschap *en* plaats, waar het woord des konings en zijn wet aankwam, was een grote rouw onder de Joden, met vasten, en geween, en misbaar; vele lagen in zakken en as.","4":"Toen kwamen Esthers jonge dochters en haar kamerlingen, en zij gaven het haar te kennen; en het deed de koningin zeer wee; en zij zond klederen om Mordechai aan te doen, en zijn zak van hem af te doen; maar hij nam ze niet aan.","5":"Toen riep Esther Hatach, *een* van de kamerlingen des konings, welke hij voor haar gesteld had, en zij gaf hem bevel aan Mordechai, om te weten wat dit, en waarom dit ware.","6":"Als Hatach uitging tot Mordechai, op de straat der stad, die voor de poort des konings was,","7":"Zo gaf Mordechai hem te kennen al wat hem wedervaren was, en de verklaring van het zilver, hetwelk Haman gezegd had te zullen wegen in de schatten des konings, voor de Joden, om dezelve om te brengen.","8":"En hij gaf hem het afschrift der geschrevene wet, die te Susan gegeven was, om hen te verdelgen, dat hij het Esther liet zien, en haar te kennen gaf, en haar gebood, dat zij tot den koning ging, om hem te smeken, en van hem te verzoeken voor haar volk.","9":"Hatach nu kwam, en gaf Esther de woorden van Mordechai te kennen.","10":"Toen zeide Esther tot Hatach, en gaf hem bevel aan Mordechai:","11":"Alle knechten des konings, en het volk, der landschappen des konings, weten wel dat al wie tot den koning ingaat in het binnenste voorhof, die niet geroepen is, hij zij man of vrouw, zijn enig vonnis zij, dat men *hem* dode, tenzij dat de koning den gouden scepter hem toereike, opdat hij levend blijve; ik nu ben deze dertig dagen niet geroepen om tot den koning in te komen.","12":"En zij gaven de woorden van Esther aan Mordechai te kennen.","13":"Zo zeide Mordechai, dat men Esther wederom zeggen zou: Beeld u niet in, in uw ziel, dat gij zult ontkomen in het huis des konings, meer dan al de *andere* Joden.","14":"Want indien gij enigszins zwijgen zult te dezer tijd, zo zal den Joden verkwikking en verlossing uit een andere plaats ontstaan; maar gij en uws vaders huis zult omkomen; en wie weet, of gij *niet* om zulken tijd als deze is, tot dit koninkrijk geraakt zijt.","15":"Toen zeide Esther, dat men Mordechai weder aanzeggen zou:","16":"Ga, vergader al de Joden, die te Susan gevonden worden, en vast voor mij, en eet of drinkt niet, in drie dagen, nacht noch dag; ik en mijn jonge dochters zullen ook alzo vasten, en alzo zal ik tot den koning ingaan, hetwelk niet naar de wet is. Wanneer ik dan omkome, zo kom ik om.","17":"Toen ging Mordechai henen, en hij deed naar alles, wat Esther aan hem geboden had."},"KJV":{"1":"When Mordecai perceived all that was done, Mordecai rent his clothes, and put on sackcloth with ashes, and went out into the midst of the city, and cried with a loud and a bitter cry;","2":"And came even before the king's gate: for none *might* enter into the king's gate clothed with sackcloth.","3":"And in every province, whithersoever the king's commandment and his decree came, *there was* great mourning among the Jews, and fasting, and weeping, and wailing; and many lay in sackcloth and ashes.","4":"So Esther's maids and her chamberlains came and told *it* her. Then was the queen exceedingly grieved; and she sent raiment to clothe Mordecai, and to take away his sackcloth from him: but he received","5":"Then called Esther for Hatach, *one* of the king's chamberlains, whom he had appointed to attend upon her, and gave him a commandment to Mordecai, to know","6":"So Hatach went forth to Mordecai unto the street of the city, which *was* before the king's gate.","7":"And Mordecai told him of all that had happened unto him, and of the sum of the money that Haman had promised to pay to the king's treasuries for the Jews, to destroy","8":"Also he gave him the copy of the writing of the decree that was given at Shushan to destroy them, to shew *it* unto Esther, and to declare *it* unto her, and to charge her that she should go in unto the king, to make supplication unto him, and to make request before him for her people.","9":"And Hatach came and told Esther the words of Mordecai.","10":"Again Esther spake unto Hatach, and gave him commandment unto Mordecai;","11":"All the king's servants, and the people of the king's provinces, do know, that whosoever, whether man or woman, shall come unto the king into the inner court, who is not called, *there is* one law of his to put *him* to death, except such to whom the king shall hold out the golden sceptre, that he may live: but I have not been called to come in unto the king these thirty days.","12":"And they told to Mordecai Esther's words.","13":"Then Mordecai commanded to answer Esther, Think not with thyself that thou shalt escape in the king's house, more than all the Jews.","14":"For if thou altogether holdest thy peace at this time, *then* shall there enlargement and deliverance arise to the Jews from another place; but thou and thy father's house shall be destroyed: and who knoweth whether thou art come to the kingdom for *such* a time","15":"Then Esther bade *them* return Mordecai","16":"Go, gather together all the Jews that are present in Shushan, and fast ye for me, and neither eat nor drink three days, night or day: I also and my maidens will fast likewise; and so will I go in unto the king, which *is* not according to the law: and if I perish, I perish.","17":"So Mordecai went his way, and did according to all that Esther had commanded"}},"tsk":{"1":[{"kopje":"wat er allemaal gebeurd was","refs":["Est 3:8-13"]},{"kopje":"verscheurde","refs":["2 Sam 1:11","Job 1:20","Jona 3:4-9","Hand 14:14"]},{"kopje":"met as","refs":["Est 4:3","Joz 7:6","2 Sam 13:19","Job 2:8","Job 42:6","Jes 58:5","Ezech 27:30","Dan 9:3","Jona 3:6","Matt 11:21" lass=\"wl wl-kjv\" data-code=\"H3847\">clothe</span> <span class=\"wl wl-kjv\" data-code=\"H4782\">Mordecai,</span> and to take <span class=\"wl wl-kjv\" data-code=\"H5493\">away</span> his <span class=\"wl wl-kjv\" data-code=\"H8242\">sackcloth</span> from him: but he received","5":"Then <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> <span class=\"wl wl-kjv\" data-code=\"H635\">Esther</span> for <span class=\"wl wl-kjv\" data-code=\"H2047\">Hatach,</span> one of the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H5631\">chamberlains,</span> whom he had <span class=\"wl wl-kjv\" data-code=\"H5975\">appointed</span> to <span class=\"wl wl-kjv\" data-code=\"H6440\">attend</span> upon her, and gave him a <span class=\"wl wl-kjv\" data-code=\"H6680\">commandment</span> to <span class=\"wl wl-kjv\" data-code=\"H4782\">Mordecai,</span> to know","6":"So <span class=\"wl wl-kjv\" data-code=\"H2047\">Hatach</span> went <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> to <span class=\"wl wl-kjv\" data-code=\"H4782\">Mordecai</span> unto the <span class=\"wl wl-kjv\" data-code=\"H7339\">street</span> of the <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> which was <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> gate.","7":"And <span class=\"wl wl-kjv\" data-code=\"H4782\">Mordecai</span> <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> him of all that had <span class=\"wl wl-kjv\" data-code=\"H7136\">happened</span> unto him, and of the <span class=\"wl wl-kjv\" data-code=\"H6575\">sum</span> of the <span class=\"wl wl-kjv\" data-code=\"H3701\">money</span> that <span class=\"wl wl-kjv\" data-code=\"H2001\">Haman</span> had <span class=\"wl wl-kjv\" data-code=\"H559\">promised</span> to <span class=\"wl wl-kjv\" data-code=\"H8254\">pay</span> to the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> < \"H5650\">servants,</span> and the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H4082\">provinces,</span> do <span class=\"wl wl-kjv\" data-code=\"H3045\">know,</span> that whosoever, whether <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> or <span class=\"wl wl-kjv\" data-code=\"H802\">woman,</span> shall <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> unto the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> into the <span class=\"wl wl-kjv\" data-code=\"H6442\">inner</span> <span class=\"wl wl-kjv\" data-code=\"H2691\">court,</span> who is not <span class=\"wl wl-kjv\" data-code=\"H7121\">called,</span> there is <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H1881\">law</span> of his to put him to <span class=\"wl wl-kjv\" data-code=\"H4191\">death,</span> <span class=\"wl wl-kjv\" data-code=\"H905\">except</span> such to whom the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> shall hold <span class=\"wl wl-kjv\" data-code=\"H3447\">out</span> the <span class=\"wl wl-kjv\" data-code=\"H2091\">golden</span> <span class=\"wl wl-kjv\" data-code=\"H8275\">sceptre,</span> that he may <span class=\"wl wl-kjv\" data-code=\"H2421\">live:</span> but I have not been <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> to come <span class=\"wl wl-kjv\" data-code=\"H935\">in</span> unto the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> these <span class=\"wl wl-kjv\" data-code=\"H7970\">thirty</span> days.","12":"And they <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> to <span class=\"wl wl-kjv\" data-code=\"H4782\">Mordecai</span> <span class=\"wl wl-kjv\" data-code=\"H635\">Esther's</span> words.","13":"Then <span class=\"wl wl-kjv\" data-code=\"H4782\">Mordecai</span> <span class=\"wl wl-kjv\" data-code=\"H559\">commanded</span> to <span clas class=\"wl wl-kjv\" data-code=\"H7800\">Shushan,</span> and <span class=\"wl wl-kjv\" data-code=\"H6684\">fast</span> ye for me, and neither <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> nor <span class=\"wl wl-kjv\" data-code=\"H8354\">drink</span> <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days,</span> <span class=\"wl wl-kjv\" data-code=\"H3915\">night</span> or <span class=\"wl wl-kjv\" data-code=\"H3117\">day:</span> I also and my <span class=\"wl wl-kjv\" data-code=\"H5291\">maidens</span> will <span class=\"wl wl-kjv\" data-code=\"H6684\">fast</span> likewise; and <span class=\"wl wl-kjv\" data-code=\"H3651\">so</span> will I <span class=\"wl wl-kjv\" data-code=\"H935\">go</span> in unto the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> which is not according to the <span class=\"wl wl-kjv\" data-code=\"H1881\">law:</span> and if I <span class=\"wl wl-kjv\" data-code=\"H6\">perish,</span> I perish.","17":"So <span class=\"wl wl-kjv\" data-code=\"H4782\">Mordecai</span> went his <span class=\"wl wl-kjv\" data-code=\"H5674\">way,</span> and <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> according to all that <span class=\"wl wl-kjv\" data-code=\"H635\">Esther</span> had commanded"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"wist","tekst":"Uit de aangeslagen plakkaten des konings; zie vs.8."},{"catchword":"al wat er geschied was,","tekst":"Te weten, belangende het ombrengen der Joden."},{"catchword":"een zak aan","tekst":"Dat is, een treurkleed, hetwelk hij met as bestrooide. Zie Jos 7:6 ."},{"catchword":"der stad,","tekst":"Te weten, Susan."}],"2":[{"catchword":"tot voor de poort","tekst":"Dat is, in de straat, die voor de poort van des konings paleis was; gelijk onder, vs.6."},{"catchword":"bekleed met een zak","tekst":"Hebreeuws, in een kleed des zaks."}],"3":[{"catchword":"in alle","tekst":"Hebreeuws, en in alle landschap en landschap."},{"catchword":"het woord des konings","tekst":"Dat is, het plakkaat."},{"catchword":"vele lagen in zakken en as","tekst":"Hebreeuws, zak en as was velen onderleid, of onderspreid; dat is, velen die een zak aanhadden, lagen in de as, gelijk Jon 3:6 ."}],"4":[{"catchword":"jonge dochters","tekst":"Versta hier, staatsjonkvrouwen."},{"catchword":"te kennen;","tekst":"Te weten, hoe zich Mordechai aanstelde, vs.1,2."},{"catchword":"en zijn zak","tekst":"Te weten, opdat hij weder ten hove mocht komen en zij des te gevoegelijker met hem van alles spreken en zich beraden mocht."}],"5":[{"catchword":"kamerlingen","tekst":"Hebreeuws, gesnedenen. Anders, ontmanden."},{"catchword":"welke hij","tekst":"Of, welken."},{"catchword":"voor haar gesteld had,","tekst":"Hebreeuws, voor haar aangezicht gesteld had; dat is, die op haar dienst passen zouden."},{"catchword":"wat dit,","tekst":"Dat is, zij vraagde waarom hij dus bedroefd was en een zak aangetrokken had. 16. waarom dit ware. Dat is, zij vraagde waarom hij dus bedroefd was en een zak aangetrokken had."}],"7":[{"catchword":"al wat hem wedervaren was,","tekst":"Te weten, hetgeen Est 3 beschreven staat."},{"catchword":"verklaring van het zilver,","tekst":"Zie boven, Est 3:9 ."},{"catchword":"voor de Joden,","tekst":"Of, tegen de Joden; dat is, opdat het hem zou geoorloofd wezen de Joden te verdelgen, gelijk hier volgt."}],"8":[{"catchword":"het afschrift","tekst":"Of, afschrift, of copie."},{"catchword":"gegeven was,","tekst":"Dat is, gepubliceerd, aangeslagen, of aangeplakt was."},{"catchword":"haar gebood,","tekst":"Te weten, in Modechia's haars opvoeders, naam, die te dien aanzien nog enige autoriteit over haar behouden had, ofschoon Esther nu koningin was. Zie boven, Est 2:20 ."},{"catchword":"van hem te verzoeken","tekst":"Hebreeuws, van zijn aangezicht; dat is, dat hijzelf in eigen persoon zulks deed, zonder iemand anders daartoe te gebruiken."}],"10":[{"catchword":"gaf hem bevel","tekst":"Dat is, zij gaf hem antwoord, dat zij hem belastte /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers) => {
    const afk = REFBOEK2AFK[boek];
    return afk ? `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${heel}</a>` : heel;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);

});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
