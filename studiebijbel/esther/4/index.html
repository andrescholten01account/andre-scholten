rdriet; en zij stuurde kleren om Mordechai aan te doen, en zijn zak van hem af te doen; maar hij nam ze niet aan.", "5": "Toen riep Esther Hatach, een van de kamerlingen van de koning, die hij voor haar aangesteld had, en zij gaf hem opdracht aan Mordechai, om te weten wat dit was, en waarom dit was.", "6": "Toen Hatach naar Mordechai uitging, op het plein van de stad, dat vóór de poort van de koning was,", "7": "gaf Mordechai hem te kennen alles wat hem overkomen was, en de opgave van het zilver dat Haman gezegd had te zullen wegen in de schatten van de koning, voor de Joden, om hen om te brengen.", "8": "En hij gaf hem het afschrift van de geschreven wet, die te Susan gegeven was om hen te verdelgen, opdat hij het Esther zou laten zien, en het haar te kennen zou geven, en haar zou gebieden dat zij naar de koning zou gaan om hem te smeken, en van hem te verzoeken voor haar volk.", "9": "Hatach nu kwam, en gaf Esther de woorden van Mordechai te kennen.", "10": "Toen zei Esther tegen Hatach, en gaf hem opdracht aan Mordechai:", "11": "Alle knechten van de koning en het volk van de landschappen van de koning weten wel dat ieder die tot de koning ingaat in het binnenste voorhof, zonder geroepen te zijn, of het nu een man of een vrouw is, één vonnis geldt: dat men hem doodt, tenzij de koning hem de gouden scepter toereikt, zodat hij levend blijft; ik nu ben deze dertig dagen niet geroepen om bij de koning te komen.", "12": "En zij gaven de woorden van Esther aan Mordechai te kennen.", "13": "Toen zei Mordechai dat men Esther terug zou laten zeggen: Beeld u niet in, in uw ziel, dat u zult ontkomen in het huis van de koning, meer dan alle andere Joden.", "14": "Want als u nu volstrekt blijft zwijgen, zal er voor de Joden verkwikking en verlossing vanuit een andere plaats ontstaan; maar u en het huis van uw vader zullen omkomen; en wie weet of u niet juist om zo'n tijd als deze tot dit koninkrijk gekomen bent.", "15": "Toen zei Esther dat men Mordechai weer zou laten weten:", "16": "Ga, verzamel alle Joden die te Susan gevonden worden, en vast voor mij, en eet of drink niet, drie dagen lang, nacht noch dag; ik en mijn jonge dochters zullen ook zo vasten, en zo zal ik tot de koning ingaan, wat niet naar de wet is. Wanneer ik dan omkom, dan kom ik om.", "17": "Toen ging Mordechai weg, en hij deed naar alles wat Esther hem geboden had."}, "SV": {"1": "Als Mordechai wist al wat er geschied was, zo verscheurde Mordechai zijn klederen, en hij trok een zak aan met as; en hij ging uit door het midden der stad, en hij riep *met* een groot en bitter geroep.", "2": "En hij kwam tot voor de poort des konings; want niemand mocht in des konings poort inkomen, bekleed met een zak.", "3": "En in alle en een ieder landschap *en* plaats, waar het woord des konings en zijn wet aankwam, was een grote rouw onder de Joden, met vasten, en geween, en misbaar; vele lagen in zakken en as.", "4": "Toen kwamen Esthers jonge dochters en haar kamerlingen, en zij gaven het haar te kennen; en het deed de koningin zeer wee; en zij zond klederen om Mordechai aan te doen, en zijn zak van hem af te doen; maar hij nam ze niet aan.", "5": "Toen riep Esther Hatach, *een* van de kamerlingen des konings, welke hij voor haar gesteld had, en zij gaf hem bevel aan Mordechai, om te weten wat dit, en waarom dit ware.", "6": "Als Hatach uitging tot Mordechai, op de straat der stad, die voor de poort des konings was,", "7": "Zo gaf Mordechai hem te kennen al wat hem wedervaren was, en de verklaring van het zilver, hetwelk Haman gezegd had te zullen wegen in de schatten des konings, voor de Joden, om dezelve om te brengen.", "8": "En hij gaf hem het afschrift der geschrevene wet, die te Susan gegeven was, om hen te verdelgen, dat hij het Esther liet zien, en haar te kennen gaf, en haar gebood, dat zij tot den koning ging, om hem te smeken, en van hem te verzoeken voor haar volk.", "9": "Hatach nu kwam, en gaf Esther de woorden van Mordechai te kennen.", "10": "Toen zeide Esther tot Hatach, en gaf hem bevel aan Mordechai:", "11": "Alle knechten des konings, en het volk, der landschappen des konings, weten wel dat al wie tot den koning ingaat in het binnenste voorhof, die niet geroepen is, hij zij man of vrouw, zijn enig vonnis zij, dat men *hem* dode, tenzij dat de koning den gouden scepter hem toereike, opdat hij levend blijve; ik nu ben deze dertig dagen niet geroepen om tot den koning in te komen.", "12": "En zij gaven de woorden van Esther aan Mordechai te kennen.", "13": "Zo zeide Mordechai, dat men Esther wederom zeggen zou: Beeld u niet in, in uw ziel, dat gij zult ontkomen in het huis des konings, meer dan al de *andere* Joden.", "14": "Want indien gij enigszins zwijgen zult te dezer tijd, zo zal den Joden verkwikking en verlossing uit een andere plaats ontstaan; maar gij en uws vaders huis zult omkomen; en wie weet, of gij *niet* om zulken tijd als deze is, tot dit koninkrijk geraakt zijt.", "15": "Toen zeide Esther, dat men Mordechai weder aanzeggen zou:", "16": "Ga, vergader al de Joden, die te Susan gevonden worden, en vast voor mij, en eet of drinkt niet, in drie dagen, nacht noch dag; ik en mijn jonge dochters zullen ook alzo vasten, en alzo zal ik tot den koning ingaan, hetwelk niet naar de wet is. Wanneer ik dan omkome, zo kom ik om.", "17": "Toen ging Mordechai henen, en hij deed naar alles, wat Esther aan hem geboden had."}, "KJV": {"1": "When Mordecai perceived all that was done, Mordecai rent his clothes, and put on sackcloth with ashes, and went out into the midst of the city, and cried with a loud and a bitter cry;", "2": "And came even before the king's gate: for none *might* enter into the king's gate clothed with sackcloth.", "3": "And in every province, whithersoever the king's commandment and his decree came, *there was* great mourning among the Jews, and fasting, and weeping, and wailing; and many lay in sackcloth and ashes.", "4": "So Esther's maids and her chamberlains came and told *it* her. Then was the queen exceedingly grieved; and she sent raiment to clothe Mordecai, and to take away his sackcloth from him: but he received", "5": "Then called Esther for Hatach, *one* of the king's chamberlains, whom he had appointed to attend upon her, and gave him a commandment to Mordecai, to know", "6": "So Hatach went forth to Mordecai unto the street of the city, which *was* before the king's gate.", "7": "And Mordecai told him of all that had happened unto him, and of the sum of the money that Haman had promised to pay to the king's treasuries for the Jews, to destroy", "8": "Also he gave him the copy of the writing of the decree that was given at Shushan to destroy them, to shew *it* unto Esther, and to declare *it* unto her, and to charge her that she should go in unto the king, to make supplication unto him, and to make request before him for her people.", "9": "And Hatach came and told Esther the words of Mordecai.", "10": "Again Esther spake unto Hatach, and gave him commandment unto Mordecai;", "11": "All the king's servants, and the people of the king's provinces, do know, that whosoever, whether man or woman, shall come unto the king into the inner court, who is not called, *there is* one law of his to put *him* to death, except such to whom the king shall hold out the golden sceptre, that he may live: but I have not been called to come in unto the king these thirty days.", "12": "And they told to Mordecai Esther's words.", "13": "Then Mordecai commanded to answer Esther, Think not with thyself that thou shalt escape in the king's house, more than all the Jews.", "14": "For if thou altogether holdest thy peace at this time, *then* shall there enlargement and deliverance arise to the Jews from another place; but thou and thy father's house shall be destroyed: and who knoweth whether thou art come to the kingdom for *such* a time", "15": "Then Esther bade *them* return Mordecai", "16": "Go, gather together all the Jews that are present in Shushan, and fast ye for me, and neither eat nor drink three days, night or day: I also and my maidens will fast likewise; and so will I go in unto the king, which *is* not according to the law: and if I perish, I perish.", "17": "So Mordecai went his way, and did according to all that Esther had commanded"}}, "tsk": {"1": [{"kopje": "wat er allemaal gebeurd was", "refs": ["Est 3:8-13"]}, {"kopje": "verscheurde", "refs": ["2 Sam 1:11", "Job 1:20", "Jona 3:4-9", "Hand 14:14"]}, {"kopje": "met as", "refs": ["Est 4:3", "Joz 7:6", "2 Sam 13:19", "Job 2:8", "Job 42:6", "Jes 58:5", "Ezech 27:30", "Dan 9:3", "Jona 3:6", "Matt 11:21"]}, {"kopje": "en riep", "refs": ["Gen 27:34", "Jes 15:4", "Jes 22:4", "Ezech 21:6", "Ezech 27:31", "Micha 1:8", "Zef 1:14", "Openb 18:17-19"]}], "3": [{"kopje": "in elk landschap", "refs": ["Est 1:1", "Est 3:12"]}, {"kopje": "grote rouw", "refs": ["1 Sam 4:13", "1 Sam 4:14", "1 Sam 11:4", "Jes 22:4", "Jes 22:12", "Jes 37:1-3"]}, {"kopje": "geween", "refs": ["Matt 13:42", "Matt 22:13", "Matt 25:30"]}, {"kopje": "velen lagen in zakken en as", "refs": ["Jes 58:5", "Dan 9:3"]}], "4": [{"kopje": "kamerlingen", "refs": ["Est 1:12", "1 Sam 8:15", "2 Kon 9:32", "Jes 56:3", "Hand 8:27"]}, {"kopje": "maar hij nam ze niet aan", "refs": ["Gen 37:35", "Ps 77:3", "Jer 31:15"]}], "5": [{"kopje": "die hij voor haar aangesteld had", "refs": ["Est 1:10", "Est 1:12"]}, {"kopje": "om te weten", "refs": ["Rom 12:15", "1 Kor 12:26", "Fil 2:4", "Hebr 4:15"]}], "6": [{"kopje": "van de koning", "refs": ["Est 4:3", "Est 7:2", "Est 9:12"]}], "7": [{"kopje": "alles wat hem overkomen was", "refs": ["Est 3:2-15"]}], "8": [{"kopje": "het afschrift", "refs": ["Est 3:14", "Est 3:15"]}, {"kopje": "te kennen zou geven", "refs": ["Est 2:20", "1 Tim 6:13", "1 Tim 6:17"]}, {"kopje": "te smeken", "refs": ["Job 9:15", "Spr 16:14", "Spr 16:15", "Pred 10:4", "Hand 12:20"]}, {"kopje": "verzoeken", "refs": ["Est 7:3", "Est 7:4", "Est 8:6", "Neh 2:3-5", "Spr 21:1"]}], "11": [{"kopje": "het binnenste voorhof", "refs": ["Est : "Est 4:3", "href": "../../esther/4/#v3", "ref": "Est 4:3", "svLabel": null}, {"disp": "Est 4:16", "href": "../../esther/4/#v16", "ref": "Est 4:16", "svLabel": null}, {"disp": "Jer 36:9", "href": "../../jeremia/36/#v9", "ref": "Jer 36:9", "svLabel": null}], "kinderen": []}]}, {"label": "Of Saints Exemplified", "href": "../../torrey/f/?hl=Esth.4.16#i6342", "refs": [], "kinderen": [{"label": "Esther", "href": "../../torrey/f/?hl=Esth.4.16#i6345", "refs": [{"disp": "Est 4:16", "href": "../../esther/4/#v16", "ref": "Est 4:16", "svLabel": null}], "kinderen": []}]}]}, {"topic": "Medo-persian Kingdom", "href": "../../torrey/m/#t-medo-persian-kingdom", "kinderen": [{"label": "Kings Of", "href": "../../torrey/m/?hl=Esth.4.16#i12675", "refs": [], "kinderen": [{"label": "Put to death all who approached them without permission", "href": "../../torrey/m/?hl=Esth.4.16#i12683", "refs": [{"disp": "Est 4:11", "href": "../../esther/4/#v11", "ref": "Est 4:11", "svLabel": null}, {"disp": "Est 4:16", "href": "../../esther/4/#v16", "ref": "Est 4:16", "svLabel": null}], "kinderen": []}]}]}, {"topic": "Self-denial", "href": "../../torrey/s/#t-self-denial", "kinderen": [{"label": "Exemplified", "href": "../../torrey/s/?hl=Esth.4.16#i19162", "refs": [], "kinderen": [{"label": "Esther", "href": "../../torrey/s/?hl=Esth.4.16#i19165", "refs": [{"disp": "Est 4:16", "href": "../../esther/4/#v16", "ref": "Est 4:16", "svLabel": null}], "kinderen": []}]}]}, {"topic": "Time", "href": "../../torrey/t/#t-time", "kinderen": [{"label": "Part of a period of, usually counted as the whole", "href": "../../torrey/t/?hl=Esth.4.16#i21152", "refs": [{"disp": "1 Sam 13:1", "href": "../../1-samuel/13/#v1", "ref": "1 Sam 13:1", "svLabel": null}, {"disp": "Est 4:16", "href": "../../esther/4/#v16", "ref": "Est 4:16", "svLabel": null}, {"disp": "Est 5:1", "href": "../../esther/5/#v1", "ref": "Est 5:1", "svLabel": null}], "kinderen": []}]}]}}, "extern": {"Hebr 4:15": "Want wij hebben geen Hogepriester Die geen medelijden kan hebben met onze zwakheden, maar Die in alle dingen, net als wij, beproefd is geweest, doch zonder zonde.", "Gen 17:12": "Een zoontje van acht dagen zal bij u besneden worden, alles wat mannelijk is in uw geslachten: degene die in het huis geboren is, en degene die met geld gekocht is van elke vreemdeling die niet van uw nageslacht is;", "Est 1:5": "Toen die dagen voorbij waren, gaf de koning een maaltijd voor heel het volk dat zich op de burcht Susan bevond, van de grootste tot de kleinste, zeven dagen lang, in het voorhof van de tuin van het koninklijk paleis.", "Micha 7:9": "Ik zal de gramschap van de HEERE dragen, want ik heb tegen Hem gezondigd; totdat Hij mijn twist twist, en mijn recht uitvoert; Hij zal mij naar buiten brengen aan het licht; ik zal met vreugde zien naar Zijn gerechtigheid.", "1 Tim 6:13": "Ik beveel u voor het aangezicht van God, Die alles levend maakt, en van Christus Jezus, Die onder Pontius Pilatus de goede belijdenis heeft afgelegd,", "Spr 16:14": "De woede van de koning is als de boden van de dood; maar een wijs man zal die verzoenen.", "Deut 14:26": "En geef dat geld voor alles wat uw ziel verlangt, voor runderen en voor schapen, en voor wijn, en voor sterke drank, en voor alles wat uw ziel van u begeren zal, en eet daar voor het aangezicht van de HEERE, uw God, en wees vrolijk, u en uw huis.", "Jona 3:6": "Want dit woord bereikte de koning van Nineve, en hij stond op van zijn troon, en deed zijn heerlijke overkleed van zich af; en hij bedekte zich met een zak, en zat neer in de as.", "Matt 16:24": "Toen zei Jezus tegen Zijn discipelen: Als iemand achter Mij aan wil komen, laat hij zichzelf verloochenen, en zijn kruis opnemen, en Mij volgen.", "Gen 45:4-8": "En Jozef zei tegen zijn broers: Kom toch dichter bij mij! En zij kwamen dichterbij. Toen zei hij: Ik ben Jozef, uw broer, die u naar Egypte verkocht hebt. Maar nu, weest niet bekommerd, en de toorn ontsteekt niet in uw ogen, omdat u mij hierheen verkocht hebt; want God heeft mij voor uw aangezicht gezonden, tot behoud van het leven. Want het zijn nu twee jaren van de honger in het midden van het land; en er zijn nog vijf jaren, waarin geen ploeging noch oogst zal zijn.", "2 Kron 20:3": "Josafat nu werd bevreesd, en richtte zich erop om de HEERE te zoeken; en hij riep een vasten uit in heel Juda.", "Lev 22:11": "Maar wanneer de priester een mens met zijn geld gekocht zal hebben, die zal daarvan eten; en wie in zijn huis geboren is, die zullen van zijn voedsel eten.", "2 Kon 12:4": "En Joas zei tegen de priesters: Al het geld van de geheiligde dingen, dat gebracht zal worden in het huis van de HEERE, te weten het geld van hem die overgaat tot de getelden, het geld van ieder man naar zijn schatting, en al het geld, dat in het hart van ieder komt, om dat te brengen in het huis van de HEERE,", "Spr 7:20": "Hij heeft een bundel van het geld in zijn hand genomen; op de vastgestelde dag zal hij naar zijn huis komen.", "Richt 10:15": "Maar de Israëlieten zeiden tegen de HEERE: Wij hebben gezondigd; doe met ons naar alles wat goed is in Uw ogen; verlos ons toch alleen op deze dag!", "Jes 54:17": "Elk instrument dat tegen u gemaakt wordt, zal niet gelukken, en elke tong, die in het gericht tegen u opstaat, zult u verdoemen; dit is het erfdeel van de knechten van de HEERE, en hun gerechtigheid is uit Mij, spreekt de HEERE.", "Jer 32:44": "Velden zal men voor geld kopen, en de brieven ondertekenen en verzegelen, en getuigen doen bevestigen, in het land van Benjamin, en in de plaatsen rondom Jeruzalem, en in de steden van Juda, en in de steden van het gebergte, en in de steden van de laagvlakte, en in de steden van het zuiden; want Ik zal hun gevangenschap ten goede keren, spreekt de HEERE.", "Gen 22:14": "En Abraham noemde de naam van die plaats: De Heere zal het voorzien! Waarom tot op deze dag gezegd wordt: Op de berg van de HEERE zal het voorzien worden!", "Neh 5:11": "Geeft hun toch, nog vandaag, hun akkers, hun wijngaarden, hun olijfgaarden en hun huizen terug; en het honderdste deel van het geld en van het koren, de most en de olie, die u van hen gevorderd hebt.", "2 Sam 24:14": "Toen zei David tegen Gad: Het is mij zeer bang te moede; laat ons toch in de hand van de HEERE vallen, want Zijn barmhartigheden zijn groot, maar laat mij niet in de hand van mensen vallen.", "Spr 16:15": "In het licht van het gezicht van de koning is leven; en zijn welbehagen is als een wolk van de late regen.", "1 Sam 11:4": "Toen de boden in Gibea-Sauls kwamen, spraken zij deze woorden ten aanhoren van het volk. Toen verhief heel het volk zijn stem, en zij weenden.", "Ezra 9:9": "Want wij zijn knechten; maar in onze dienstbaarheid heeft onze God ons niet verlaten; maar Hij heeft weldadigheid tot ons geneigd voor het aangezicht van de koningen van Perzië, dat Hij ons een weinig leven zou geven, om het huis van onze God te verhogen, en de woestenijen ervan op te richten, en om ons een muur te geven in Juda en te Jeruzalem.", "Jes 45:1-5": "Zo zegt de HEERE tegen Zijn gezalfde, tegen Kores, wiens rechterhand Ik vastheb, om de volken voor zijn aangezicht neer te werpen; en Ik zal de lendenen van de koningen ontbinden, om voor zijn aangezicht de deuren te openen, en de poorten zullen niet gesloten worden: Ik zal voor uw aangezicht gaan, en Ik zal de kromme wegen recht maken; de koperen deuren zal Ik verbreken, en de ijzeren grendels zal Ik in stukken slaan. En Ik zal u de schatten geven die in de duisternissen zijn, en de verborgen rijkdommen; opdat u weet dat Ik de HEERE ben, Die u bij uw naam roept, de God van Israël;", "2 Kon 9:32": "En hij hief zijn gezicht op naar het venster, en zei: Wie is met mij? Wie? Toen keken er twee, drie kamerlingen naar hem.", "Jer 36:9": "Want het gebeurde in het vijfde jaar van Jojakim, de zoon van Josia, de koning van Juda, in de negende maand, dat zij een vasten voor het aangezicht van de HEERE uitriepen, voor het hele volk in Jeruzalem, alsook voor het hele volk dat uit de steden van Juda naar Jeruzalem kwam.", "Job 31:39": "Als ik zijn vermogen gegeten heb zonder geld, en de ziel van zijn akkerlieden heb doen hijgen;", "Est 1:19": "Als het de koning goeddunkt, laat er dan een koninklijk bevel van hem uitgaan, dat wordt opgeschreven in de wetten van de Perzen en de Meden, en dat niet overtreden mag worden: dat Vasthi niet meer voor het aangezicht van de koning Ahasveros mag komen, en dat de koning haar koningschap geeft aan haar naaste, die beter is dan zij.", "Deut 21:14": "En het zal gebeuren, als u geen behagen meer in haar hebt, dat u haar zult laten gaan waarheen zij wil; maar u zult haar beslist niet voor geld verkopen, u zult geen handel met haar drijven, omdat u haar vernederd hebt.", "Num 3:48-51": "En u zult dat geld aan Aäron en zijn zonen geven, het geld van de gelosten die onder hen overschieten. Toen nam Mozes dat losgeld van degenen, die overschoten boven de gelosten door de Levieten. Van de eerstgeborenen van de kinderen van Israël nam hij dat geld, duizend driehonderdvijfenzestig sikkels, naar de sikkel van het heiligdom.", "1 Kor 12:26": "En hetzij dat één lid lijdt, alle leden lijden mee; hetzij dat één lid geëerd wordt, alle leden verblijden zich mee.", "Neh 5:10": "Ik, mijn broeders en mijn knechten, vorderen wij ook geld en koren van hen? Laten wij toch deze last nalaten.", "Jes 52:3": "Want zo zegt de HEERE: U bent voor niets verkocht, u zult ook zonder geld vrijgekocht worden.", "Joz 24:15": "Doch als het kwaad is in uw ogen om de HEERE te dienen, kies heden wie u dienen zult; hetzij de goden die uw vaders, die aan de andere kant van de rivier waren, gediend hebben, of de goden van de Amorieten, in wiens land u woont; maar wat mij en mijn huis aangaat, wij zullen de HEERE dienen!", "Est 2:14": "'s Avonds ging zij daarin, en 's morgens ging zij weer terug naar het tweede huis van de vrouwen, onder de hand van Saasgaz, de kamerling van de koning, bewaarder van de bijvrouwen; zij kwam niet meer bij de koning, behalve als de koning lust naar haar had, en zij bij naam geroepen werd.", "Est 1:2": "in die dagen, toen de koning Ahasveros op de troon van zijn koninkrijk zat, die op de burcht Susan was,", "Mark 14:36": "En Hij zei: Abba, Vader! Alle dingen zijn U mogelijk; neem deze drinkbeker van Mij weg; maar niet wat Ik wil, maar wat U wilt.", "Gen 23:9": "Dat hij mij de spelonk van Machpela geeft, die hij heeft, die aan het eind van zijn akker is; dat hij die mij voor het volle geld geeft, tot een eigen graf in het midden van u.", "2 Kon 22:9": "Daarna kwam Safan, de schrijver, bij de koning, en bracht de koning verslag terug, en hij zei: Uw dienaren hebben het geld dat in het huis gevonden was bij elkaar gebracht, en hebben het gegeven in de hand van de opzichters van het werk, die aangesteld waren over het huis van de HEERE.", "Est 2:20": "Esther had haar afkomst en haar volk nog niet bekendgemaakt, zoals Mordechai haar geboden had; want Esther deed het bevel van Mordechai, zoals toen zij bij hem opgevoed werd.", "Gen 17:13": "Degene die in uw huis geboren is, en degene die met uw geld gekocht is, zal zeker besneden worden; en Mijn verbond zal in uw vlees zijn, tot een eeuwig verbond.", "2 Sam 13:19": "Toen nam Thamar as en strooide die op haar hoofd, en scheurde de veelkleurige mantel die zij aanhad; en zij legde haar hand op haar hoofd, en liep luid schreiend weg.", "1 Sam 17:29": "Toen zei David: Wat heb ik nu gedaan? Is er geen reden voor?", "Ex 21:11": "En als hij haar deze drie dingen niet doet, zal zij om niet uitgaan, zonder geld.", "Mark 14:11": "En zij, die dit hoorden, waren verblijd, en beloofden hem geld te geven; en hij zocht hoe hij Hem op een geschikt moment kon overleveren.", "Est 9:11": "Op diezelfde dag kwam het aantal gedoden op de burcht Susan bij de koning.", "Rom 12:15": "Verblijd u met de blijden, en ween met de wenende.", "Hand 10:7": "En toen de engel die tot Cornelius sprak, weggegaan was, riep hij twee van zijn huisknechten, en een godvruchtige soldaat van hen die voortdurend bij hem waren;", "Ps 119:75": "Ik weet, HEERE! dat Uw gerichten de gerechtigheid zijn, en dat U mij uit getrouwheid verdrukt hebt.", "Joël 1:14": "Heilig een vasten, roep een verbodsdag uit, verzamel de oudsten, en alle inwoners van dit land, naar het huis van de HEERE, uw God, en roep tot de HEERE.", "Joël 1:15": "Ach, die dag! Want de dag van de HEERE is nabij, en zal als een verwoesting komen van de Almachtige.", "1 Sam 8:15": "En van uw zaad en uw wijngaarden zal hij het tiende deel nemen, en dat aan zijn hovelingen en aan zijn knechten geven.", "Fil 1:20-24": "Overeenkomstig mijn oprechte verwachting en hoop, dat ik in geen enkele zaak beschaamd zal worden; maar dat, met alle vrijmoedigheid, zoals altijd, zo ook nu, Christus groot gemaakt zal worden in mijn lichaam, hetzij door het leven, hetzij door de dood. Want het leven is voor mij Christus, en het sterven is winst. Maar of ik in het vlees zal leven, dat is voor mij een vruchtbare arbeid, en wat ik zal kiezen, weet ik niet.", "Lev 27:15": "En als hij die het geheiligd heeft, zijn huis wil afkopen, dan zal hij een vijfde deel van het geld van uw schatting daarboven toevoegen, en het zal zijn eigendom zijn.", "Luk 9:3": "En Hij zei tegen hen: Neem niets mee voor onderweg, geen stok, geen reistas, geen brood, geen geld; en niemand van u mag twee stel kleren hebben.", "Est 5:2": "En het gebeurde, toen de koning koningin Esther zag staan in het voorhof, dat zij genade vond in zijn ogen, zodat de koning de gouden scepter die in zijn hand was naar Esther uitstrekte; en Esther kwam dichterbij, en raakte de top van de scepter aan.", "Luk 19:23": "Waarom hebt u dan mijn geld niet bij de bank gebracht, zodat ik het bij mijn komst met rente had kunnen opeisen?", "Hand 21:14": "En toen hij zich niet liet overtuigen, hielden wij ons tevreden en zeiden: Laat de wil van de Heere gebeuren.", "Luk 9:24": "Want wie zijn leven wil behouden, zal het verliezen; maar wie zijn leven verliest om Mij, die zal het behouden.", "1 Sam 19:5": "Want hij heeft zijn leven gewaagd, en hij heeft de Filistijn geslagen, en de HEERE heeft een grote overwinning aan heel Israël gegeven; u hebt het gezien, en u bent verblijd geweest; waarom zou u dan tegen onschuldig bloed zondigen, David zonder reden doden?", "Luk 22:42": "en zei: Vader, als U wilt, neem deze drinkbeker van Mij weg; maar niet Mijn wil, maar de Uwe geschiede.", "Lev 25:37": "Uw geld zult u hem niet op rente geven, en uw voedsel zult u niet op overwinst geven.", "Est 3:2-15": "En alle knechten van de koning die in de poort van de koning waren, knielden en bogen zich neer voor Haman; want de koning had zo over hem bevolen; maar Mordechai knielde niet, en boog zich niet neer. Toen zeiden de knechten van de koning die in de poort van de koning waren, tegen Mordechai: Waarom overtreedt u het gebod van de koning? Het gebeurde nu, toen zij dit van dag tot dag tegen hem zeiden, en hij niet naar hen luisterde, dat zij het aan Haman lieten weten, om te zien of de woorden van Mordechai stand zouden houden; want hij had hun laten weten dat hij een Jood was.", "Ex 21:34": "dan zal de eigenaar van de kuil het vergoeden; hij zal aan de eigenaar van het dier het geld teruggeven; maar het dode dier zal hem toebehoren.", "Klaagl 1:18": "Tsade. De HEERE is rechtvaardig, want ik ben Zijn mond opstandig geweest; hoort toch, alle volken, en ziet mijn smart; mijn jonkvrouwen en mijn jongelingen zijn in de gevangenschap gegaan.", "Hand 21:13": "Maar Paulus antwoordde: Wat doet u, dat u weent en mijn hart week maakt? Want ik ben bereid niet alleen gebonden te worden, maar ook te sterven te Jeruzalem, voor de Naam van de Heere Jezus.", "2 Kor 7:4": "Ik heb veel vrijmoedigheid in het spreken tegen u, ik heb veel roem over u; ik ben vervuld met vertroosting; ik ben zeer overvloedig van blijdschap in al onze verdrukking.", "Deut 32:36": "Want de HEERE zal Zijn volk recht doen, en het zal Hem berouwen over Zijn knechten; want Hij zal zien, dat de hand is weggegaan, en er niemand meer over is, gebonden of vrij.", "Hand 9:9": "En hij was drie dagen zonder te zien, en at niet en dronk niet.", "Ps 77:3": "Ten dage van mijn benauwdheid zocht ik de Heere; mijn hand was 's nachts uitgestrekt, en liet niet af; mijn ziel weigerde getroost te worden.", "Gen 20:16": "En tegen Sara zei hij: Zie, ik heb uw broeder duizend zilverlingen gegeven; zie, dat moet voor u een bedekking van de ogen zijn, voor allen die bij u zijn, ja, tegenover allen, en wees terechtgewezen.", "Est 3:15": "De lopers gingen uit, aangespoord door het woord van de koning, en de wet werd uitgegeven in de burcht Susan. En de koning en Haman gingen zitten om te drinken, doch de stad Susan was in verwarring.", "Ps 39:10": "Ik ben verstomd, ik zal mijn mond niet opendoen, want U hebt het gedaan.", "2 Sam 10:12": "Wees sterk, en laten wij sterk zijn voor ons volk, en voor de steden van onze God; de HEERE nu doet, wat goed is in Zijn ogen.", "Richt 17:4": "Maar hij gaf dat geld aan zijn moeder terug. En zijn moeder nam tweehonderd zilverlingen, en gaf ze aan de goudsmid, die maakte daarvan een gesneden beeld en een gegoten beeld; dat was in het huis van Micha.", "Hand 14:14": "Maar toen de apostelen Barnabas en Paulus dit hoorden, scheurden zij hun kleren, en sprongen onder de menigte, en riepen:", "Matt 26:39": "En toen Hij een weinig verder gegaan was, viel Hij op Zijn aangezicht, bad en zei: Mijn Vader, als het mogelijk is, laat deze drinkbeker aan Mij voorbijgaan! Maar toch niet zoals Ik wil, maar zoals U wilt.", "Deut 14:25": "Zo maak het tot geld, en bind het geld in uw hand, en ga naar de plaats die de HEERE, uw God, zal uitkiezen;", "Est 2:3-21": "En de koning stelt toezieners aan in alle landschappen van zijn koninkrijk, dat zij alle jonge dochters, maagden, mooi van uiterlijk, bijeenbrengen naar de burg Susan, naar het huis van de vrouwen, onder de hand van Hegai, de kamerling van de koning, bewaarder van de vrouwen; en men geeft haar haar schoonheidsmiddelen. En de jonge dochter, die in de ogen van de koning mooi zal zijn, wordt koningin in de plaats van Vasthi. Deze zaak nu was goed in de ogen van de koning, en hij deed zo. Er was een Joodse man op de burg Susan, wiens naam was Mordechai, een zoon van Jaïr, de zoon van Simeï, de zoon van Kis, een man van Jemini;", "Gen 44:1-8": "En hij gebood degene die over zijn huis ging, en zei: Vul de zakken van deze mannen met voedsel, zoveel als zij kunnen dragen, en leg ieders geld in de mond van zijn zak; En mijn beker, de zilveren beker, moet u leggen in de mond van de zak van de jongste, met het geld van zijn koren. En hij deed naar Jozefs woord, dat hij gesproken had. 's Morgens, toen het licht werd, liet men deze mannen vertrekken, hen en hun ezels.", "Joz 7:6": "Toen scheurde Jozua zijn kleren, en viel op zijn gezicht ter aarde, voor de ark van de HEERE, tot de avond toe, hij en de oudsten van Israël; en zij wierpen stof op hun hoofd.", "Jer 33:24-26": "Hebt u niet gezien wat dit volk zegt: De twee geslachten die de HEERE verkozen had, die heeft Hij nu verworpen? Ja, zij versmaden Mijn volk, zodat het geen volk meer is voor hun aangezicht. Zo zegt de HEERE: Als Mijn verbond niet zou bestaan met dag en nacht, als Ik de ordeningen van de hemel en de aarde niet had vastgesteld; Dan zou Ik ook het nageslacht van Jakob en van Mijn knecht David verwerpen, zodat Ik van zijn nageslacht niemand zou nemen die heerst over het nageslacht van Abraham, Izak en Jakob; want Ik zal hun gevangenschap wenden en Mij over hen ontfermen.", "Matt 25:30": "En werp de nutteloze dienstknecht buiten, in de uiterste duisternis; daar zal geween zijn en het geknars van de tanden.", "Jes 22:4": "Daarom zeg ik: Wend uw blik van mij af; laat mij bitter wenen; dring er niet op aan om mij te troosten over de verwoesting van de dochters van mijn volk.", "Luk 19:15": "En het gebeurde, toen hij terugkwam nadat hij het koninkrijk ontvangen had, dat hij zei dat die dienstknechten aan wie hij het geld gegeven had bij hem geroepen moesten worden, opdat hij zou weten wat ieder met handel verdiend had.", "Est 9:15": "En de Joden die in Susan waren, verzamelden zich ook op de veertiende dag van de maand Adar, en zij doodden in Susan driehonderd mannen; maar zij sloegen hun hand niet aan de roof.", "Ex 30:16": "U dan moet het geld van de verzoeningen van de kinderen van Israël nemen, en het bestemmen voor de dienst van de tent van de samenkomst; en het zal voor de kinderen van Israël een gedachtenis zijn, voor het aangezicht van de HEERE, om voor uw zielen verzoening te doen.", "Hand 12:20": "En Herodes was zeer verbolgen op de Tyriërs en Sidoniërs; maar zij kwamen eensgezind naar hem toe, en nadat zij Blastus, de kamerheer van de koning, hadden overreed, vroegen zij om vrede, omdat hun land werd bevoorraad vanuit het land van de koning.", "Rom 5:3": "En niet alleen dit, maar wij roemen ook in de verdrukkingen, wetende dat de verdrukking lijdzaamheid werkt;", "Joh 18:11": "Jezus dan zei tegen Petrus: Steek uw zwaard in de schede. Zou Ik de drinkbeker die de Vader Mij gegeven heeft, niet drinken?", "Fil 2:30": "Want om het werk van Christus is hij dicht bij de dood gekomen, terwijl hij zijn leven niet ontzag, opdat hij het gebrek van uw bediening aan mij zou aanvullen.", "Jes 37:1-3": "Het gebeurde nu, toen koning Hizkia dat hoorde, dat hij zijn kleren scheurde, en zich met een zak bedekte, en het huis van de HEERE inging. Daarna zond hij Eljakim, de hofmeester, en Sebna, de schrijver, en de oudsten van de priesters, met zakken bedekt, naar Jesaja, de profeet, de zoon van Amoz; En zij zeiden tegen hem: Zo zegt Hizkia: Deze dag is een dag van benauwdheid, en van bestraffing, en van smaad; want de kinderen zijn gekomen tot aan de geboorte, en er is geen kracht om te baren.", "Ezech 21:6": "Maar u, mensenkind, zucht; zucht voor hun ogen met verbreking van de lenden en met bitterheid.", "Hebr 12:3": "Want let op Hem, Die zo'n tegenspreken van de zondaren tegen Zich heeft verdragen, opdat u niet verflauwt en bezwijkt in uw zielen.", "Gen 43:12-23": "En neem dubbel geld in uw hand; en breng het geld, dat in de opening van uw zakken teruggekeerd is, weer terug in uw hand; misschien is het een vergissing. Neem ook uw broer mee, en maak u op, ga terug naar die man. En God, de Almachtige, geve u barmhartigheid bij die man, dat hij uw andere broer en Benjamin met u laat teruggaan! En wat mij aangaat, als ik van mijn kinderen beroofd word, dan ben ik maar beroofd!", "Job 14:14": "Als een man gestorven is, zal hij dan weer leven? Ik zou al de dagen van het strijd hopen, totdat mijn verandering zou komen.", "Jer 32:9": "Dus kocht ik van Hanameel, de zoon van mijn oom, het veld dat bij Anathoth is; en ik woog hem het geld toe, zeventien zilveren sikkels.", "Est 2:8": "Het gebeurde nu, toen het woord van de koning en zijn wet bekend was geworden, en toen veel jonge dochters bijeengebracht werden op de burg Susan, onder de hand van Hegai, dat Esther ook genomen werd in het huis van de koning, onder de hand van Hegai, de bewaarder van de vrouwen.", "Jes 56:3": "En de vreemdeling, die zich bij de HEERE gevoegd heeft, moet niet zeggen: De HEERE heeft mij helemaal van Zijn volk gescheiden; en de ontmande moet niet zeggen: Zie, ik ben een dorre boom.", "2 Kron 24:14": "Toen zij het nu klaar hadden, brachten zij voor de koning en Jojada het overige van het geld, waarvan hij vaten maakte voor het huis van de HEERE, vaten om te dienen en te offeren, en rookschalen, en gouden en zilveren vaten; en zij offerden voortdurend brandoffers in het huis van de HEERE, al de dagen van Jojada.", "Jer 30:11": "Want Ik ben met u, spreekt de HEERE, om u te verlossen; want Ik zal een voleinding maken met al de heidenen, waarheen Ik u verstrooid heb; maar met u zal Ik geen voleinding maken; maar Ik zal u kastijden met mate, en u niet helemaal ongestraft laten.", "Dan 2:9": "Als u mij die droom niet bekendmaakt, is uw vonnis eender; want u hebt afgesproken een leugenachtig en verzonnen woord voor mij te zeggen, totdat de tijd verandert; vertel mij daarom de droom, dan zal ik weten dat u mij ook de uitleg ervan kunt bekendmaken.", "Amos 9:8": "Zie, de ogen van de Heere HEERE zijn tegen dit zondige koninkrijk, zodat Ik het van de aardbodem verdelg; behalve dat Ik het huis van Jakob niet helemaal zal verdelgen, spreekt de HEERE.", "1 Sam 3:18": "Toen maakte Samuël hem al die woorden bekend, en verborg ze niet voor hem. En hij zei: Hij is de HEERE; laat Hij doen wat goed is in Zijn ogen!", "Job 2:10": "Maar hij zei tegen haar: U spreekt zoals een van de dwaze vrouwen spreekt; zouden wij dan het goede van God ontvangen, en het kwade niet ontvangen? In dit alles zondigde Job niet met zijn lippen.", "2 Kor 6:4-10": "Maar wij maken onszelf in alles aangenaam als dienaars van God, in veel verdraagzaamheid, in verdrukkingen, in noden, in benauwdheden, in slagen, in gevangenissen, in opschudding, in arbeid, in waken, in vasten, in reinheid, in kennis, in geduld, in vriendelijkheid, in de Heilige Geest, in ongeveinsde liefde,", "Jes 55:1": "O, alle dorstigen, kom tot de wateren, en u die geen geld heeft, kom, koop en eet, ja kom, koop zonder geld en zonder prijs, wijn en melk!", "Pred 7:12": "Want de wijsheid is tot een schaduw, en het geld is tot een schaduw; maar de uitnemendheid van de wetenschap is, dat de wijsheid haar bezitters het leven geeft.", "2 Sam 16:11": "Verder zei David tegen Abisai en tegen al zijn knechten: Zie, mijn zoon, die uit mijn lijf is voortgekomen, zoekt mijn leven; hoeveel te meer dan nu deze zoon van Jemini? Laat hem begaan, laat hij vloeken, want de HEERE heeft het hem gezegd.", "Ezech 27:30": "En zij zullen hun stem over u laten horen, en bitter schreeuwen; en zij zullen stof op hun hoofden werpen, zij zullen zich wentelen in de as.", "2 Kon 23:11": "En hij schafte de paarden af, die de koningen van Juda voor de zon gesteld hadden, bij de ingang van het huis van de HEERE, tot de kamer van Nathan-melech, de hoveling, die in Parvarim was; en de wagens van de zon verbrandde hij met vuur.", "Matt 12:40": "Want zoals Jona drie dagen en drie nachten in de buik van de walvis was, zo zal de Zoon des mensen drie dagen en drie nachten in het hart van de aarde zijn.", "Ezra 8:21": "Toen riep ik daar een vasten uit bij de rivier Ahava, opdat wij ons zouden verootmoedigen voor het aangezicht van onze God, om van Hem te verzoeken een rechte weg, voor ons, en voor onze kinderen, en voor al onze have.", "2 Sam 12:23": "Maar nu is het dood, waarom zou ik nu vasten? Zal ik het nog kunnen terughalen? Ik zal wel naar hem toe gaan, maar hij zal niet naar mij terugkomen.", "Job 1:13-22": "Er was nu een dag, dat zijn zonen en zijn dochters aten en wijn dronken in het huis van hun broer, de eerstgeborene. Dat er een bode tot Job kwam en zei: De runderen waren aan het ploegen, en de ezelinnen weidden aan hun zijden. Doch de Sabeeërs deden een inval, en namen ze mee, en sloegen de knechten met de scherpte van het zwaard; en ik ben maar alleen ontkomen om het u te vertellen.", "Ex 22:17": "Als haar vader hardnekkig weigert haar aan hem te geven, dan moet hij geld betalen overeenkomstig de bruidsprijs voor maagden.", "2 Kon 5:26": "Maar hij zei tegen hem: Ging mijn hart niet mee, toen die man zich van zijn wagen omkeerde, u tegemoet? Was dit het moment om dat zilver aan te nemen, en om kleren aan te nemen, en olijfbomen, en wijngaarden, en schapen, en runderen, en knechten, en dienstmaagden?", "Ezra 3:7": "Zo gaven zij geld aan de houwers en werkmeesters, ook eten en drinken, en olie aan de Sidoniërs en aan de Tyriërs, om cederhout van de Libanon te brengen naar de zee bij Jafo, naar de vergunning die Kores, koning van Perzië, hun gegeven had.", "Job 9:15": "Aan wie ik, ook al was ik rechtvaardig, niet zou antwoorden; mijn Rechter zal ik om genade bidden.", "Ezra 7:17": "opdat u spoedig voor dat geld runderen, rammen, lammeren koopt, met hun spijsoffers, en hun drankoffers, en die offert op het altaar van het huis van uw God, dat te Jeruzalem is.", "Est 7:1-10": "Toen de koning met Haman gekomen was, om te drinken met de koningin Esther; Zei de koning tegen Esther, ook op de tweede dag, op het maaltijd van de wijn: Wat is uw bede, koningin Esther? En zij zal u gegeven worden; en wat is uw verzoek? Het zal gebeuren, ook tot de helft van het koninkrijk. Toen antwoordde de koningin Esther, en zei: Als ik, o koning, genade in uw ogen gevonden heb, en als het de koning goeddunkt, geve men mij mijn leven, om mijn bede, en mijn volk, om mijn verzoek.", "Dan 9:14": "Daarom heeft de HEERE over het kwade gewaakt, en Hij heeft het over ons gebracht; want de HEERE, onze God, is rechtvaardig in al Zijn werken die Hij gedaan heeft, omdat wij Zijn stem niet gehoorzaamden.", "Hand 27:33": "En terwijl het dag zou worden, vermaande Paulus hen allen om voedsel te nemen, en zei: Het is vandaag de veertiende dag dat u wachtend blijft zonder eten, en niets hebt genomen.", "Num 23:22-24": "God heeft hen uit Egypte geleid; zijn krachten zijn als die van een eenhoorn. Want er is geen toverij tegen Jakob, en geen waarzeggerij tegen Israël. Op dit moment zal van Jakob gezegd worden, en van Israël, wat God tot stand gebracht heeft. Zie, het volk zal opstaan als een oude leeuw, en het zal zich verheffen als een leeuw; het zal niet neerliggen, totdat het de roof gegeten en het bloed van de gedoden gedronken zal hebben!", "Job 2:8": "En hij nam zich een potscherf om zich daarmee te schrapen, en hij zat neer in het midden van de as.", "1 Kon 21:15": "Het gebeurde nu, toen Izebel hoorde dat Naboth gestenigd en dood was, dat Izebel tegen Achab zei: Sta op, neem de wijngaard van Naboth, de Jizreëliet, in bezit, die hij u weigerde voor geld te geven; want Naboth leeft niet meer, maar is dood.", "Est 8:6": "Want hoe zou ik het kunnen verdragen dat ik het kwaad aanzie, dat mijn volk zal treffen? En hoe zou ik het kunnen verdragen dat ik het verderf van mijn geslacht aanzie?", "Jes 58:5": "Zou dit zulk een vasten zijn dat Ik verkiezen zou, dat de mens zijn ziel een dag kwelt, dat hij zijn hoofd kromt zoals een bieze, en een zak en as onder zich spreidt? Zou u dat een vasten noemen, en een dag die de HEERE aangenaam is?", "Jona 3:4-9": "En Jona begon in de stad te gaan, een dagreis; en hij predikte, en zei: Nog veertig dagen, dan zal Nineve worden omgekeerd. En de mensen van Nineve geloofden God; en zij riepen een vasten uit, en bekleedden zich met zakken, van hun grootste tot hun kleinste toe. Want dit woord bereikte de koning van Nineve, en hij stond op van zijn troon, en deed zijn heerlijke overkleed van zich af; en hij bedekte zich met een zak, en zat neer in de as.", "Micha 1:8": "Hierom zal ik misbaar bedrijven en huilen; ik zal beroofd en naakt gaan; ik zal misbaar maken als de draken, en treuren als de jonge struisen.", "Luk 22:5": "En zij waren blij, en zijn het eens geworden dat zij hem geld zouden geven.", "Est 9:12": "En de koning zei tegen koningin Esther: In Susan, op de burcht, hebben de Joden vijfhonderd mannen en de tien zonen van Haman gedood en omgebracht; wat hebben ze dan in de rest van de landschappen van de koning gedaan? Wat is nu uw verzoek? Het zal u gegeven worden; of wat is verder uw wens? Het zal gebeuren.", "Neh 5:4": "Evenzo waren er die zeiden: Wij hebben geld geleend voor de belasting van de koning, op onze akkers en onze wijngaarden.", "Job 1:22": "In dit alles zondigde Job niet, en schreef God niets van het ongerijmd toe.", "Micha 3:11": "Haar hoofden rechtspreken om geschenken, en haar priesters leren om loon, en haar profeten waarzeggen om geld; nog steunen zij op de HEERE, en zeggen: Is de HEERE niet in ons midden? Ons zal geen kwaad overkomen.", "2 Kon 23:35": "En Jojakim gaf dat zilver en dat goud aan Farao; doch hij belastte het land, om dat geld naar het bevel van Farao te geven; ieder naar zijn aanslag eiste hij het zilver en goud af van het volk van het land, om aan Farao Necho te geven.", "2 Kon 15:20": "Menahem nu bracht dit geld op van Israël, van alle vermogende mannen, om aan de koning van Assyrië te geven, voor elke man vijftig zilveren sikkels; zo keerde de koning van Assyrië terug, en bleef daar niet in het land.", "Rom 16:4": "die voor mijn leven hun hals gesteld hebben; hun dank ik niet alleen, maar ook alle Gemeenten van de heidenen.", "Deut 23:19": "U zult uw broeder geen rente laten betalen, rente van geld, rente van voedsel, rente van enig ding waarover men rente vraagt.", "Luk 23:41": "En wij toch terecht; want wij ontvangen straf die past bij wat wij gedaan hebben; maar Deze heeft niets onbehoorlijks gedaan.", "Jak 5:11": "Zie, wij noemen hen gelukkig die volharden; u hebt van de volharding van Job gehoord, en u hebt gezien hoe de Heere het einde bracht, dat de Heere zeer barmhartig is en vol ontferming.", "2 Kon 19:3": "En zij zeiden tegen hem: Zo zegt Hizkia: Deze dag is een dag van benauwdheid, en van bestraffing, en van smaad; want de kinderen zijn tot aan de geboorte gekomen, en er is geen kracht om te baren.", "2 Kron 34:9": "En zij kwamen bij Hilkia, de hogepriester, en zij gaven hem het geld dat naar het huis van God gebracht was, dat de Levieten die de drempel bewaakten, verzameld hadden uit de hand van Manasse en Efraïm, en uit heel het overblijfsel van Israël, en uit heel Juda en Benjamin, en waarmee zij naar Jeruzalem waren teruggekomen.", "Hand 7:60": "En terwijl hij op de knieën viel, riep hij met luide stem: Heere, reken hun deze zonde niet toe! En toen hij dat gezegd had, ontsliep hij.", "Job 9:18": "Hij laat mij niet toe mijn adem te halen, maar Hij verzadigt mij met bitterheden.", "Matt 24:22": "En als die dagen niet verkort werden, zou geen vlees behouden worden; maar omwille van de uitverkorenen zullen die dagen verkort worden.", "Jes 22:12": "En op die dag zal de Heere, de HEERE van de heerscharen, roepen tot geween, en tot rouwklacht, en tot kaalheid, en tot omgording met de zak.", "Luk 23:40": "Maar de ander antwoordde en bestrafte hem: Vreest u ook God niet, terwijl u in hetzelfde oordeel bent?", "Rom 5:4": "En de lijdzaamheid werkt bevinding, en de bevinding werkt hoop;", "Gen 47:14-18": "Toen verzamelde Jozef al het geld dat in Egypteland en in het land Kanaän gevonden werd, voor het koren dat zij kochten; en Jozef bracht dat geld in het huis van Farao. Toen het geld uit Egypteland en uit het land Kanaän op was, kwamen alle Egyptenaren naar Jozef en zeiden: Geef ons brood; want waarom zouden wij in uw bijzijn sterven? Want het geld is op. En Jozef zei: Geef uw vee, dan zal ik u brood geven voor uw vee, als het geld op is.", "Openb 18:17-19": "En alle stuurlieden, en al het volk op de schepen, en scheepslui, en allen die op zee handel drijven, stonden van verre; En riepen, toen zij de rook van haar brand zagen, en zeiden: Wat stad was aan deze grote stad gelijk? En zij wierpen stof op hun hoofden, en riepen, wenend en rouw bedrijvend, en zeiden: Wee, wee, de grote stad, waarin allen die schepen op de zee hadden, rijk geworden zijn van haar kostbaarheid; want zij is in één uur verwoest.", "Neh 1:1": "De geschiedenissen van Nehemia, zoon van Hachalja. En het gebeurde in de maand Chisleu, in het twintigste jaar, toen ik in de burcht Susan was,", "Hand 8:27": "En hij stond op en ging heen; en zie, een Moorman, een kamerling, een machtige heer van Candacé, de koningin van de Moren, die over al haar schat ging, was gekomen om te aanbidden in Jeruzalem;", "1 Kon 21:2": "Achab sprak tot Naboth en zei: Geef mij uw wijngaard, opdat hij mij tot een kruidhof zij, omdat hij dicht bij mijn huis is; en ik zal u ervoor een wijngaard geven die beter is dan die; of, als het goed is in uw ogen, zal ik u de waarde ervan in geld geven.", "2 Kon 4:26": "Loop haar nu toch tegemoet, en zeg tegen haar: Is het goed met u? Is het goed met uw man? Is het goed met uw kind? En zij zei: Het is goed.", "Est 7:2": "Zei de koning tegen Esther, ook op de tweede dag, op het maaltijd van de wijn: Wat is uw bede, koningin Esther? En zij zal u gegeven worden; en wat is uw verzoek? Het zal gebeuren, ook tot de helft van het koninkrijk.", "Gen 37:28": "Toen nu de Midianitische kooplieden voorbijtrokken, trokken en hesen zij Jozef op uit de kuil, en verkochten Jozef aan deze Ismaëlieten voor twintig zilverstukken; die brachten Jozef naar Egypte.", "Jes 55:2": "Waarom weegt u geld uit voor wat geen brood is, en uw arbeid voor wat niet verzadigen kan? Hoor aandachtig naar Mij, en eet het goede, en laat uw ziel zich verlustigen in vettigheid.", "Job 1:20": "Toen stond Job op, en scheurde zijn mantel, en schoor zijn hoofd, en viel op de aarde, en boog zich neer;", "2 Kron 34:17": "En zij hebben het geld dat in het huis van de HEERE gevonden is, samengevoegd, en hebben het gegeven in de hand van de opzichters, en in de hand van hen die het werk verrichtten.", "Ps 103:10": "Hij doet ons niet naar onze zonden, en vergeldt ons niet naar onze ongerechtigheden.", "Matt 28:15": "En zij namen het geld, en deden zoals hun geleerd was. En dit verhaal is onder de Joden verspreid geraakt tot op deze huidige dag.", "Est 8:4": "De koning nu reikte de gouden scepter naar Esther uit. Toen stond Esther op, en zij bleef staan voor de koning.", "2 Tess 1:4": "Zodat wij zelf over u roemen in de Gemeenten van God, over uw volharding en geloof in al uw vervolgingen en verdrukkingen, die u verdraagt;", "Ex 22:7": "Wanneer iemand aan zijn naaste geld of voorwerpen geeft om te bewaren, en het wordt uit het huis van die man gestolen, en de dief wordt gevonden, dan moet hij het dubbel teruggeven.", "1 Sam 4:13": "En toen hij aankwam, zie, daar zat Eli op een stoel bij de kant van de weg, uit te kijken; want zijn hart beefde vanwege de ark van God. Toen de man de stad binnenkwam om het te vertellen, schreeuwde de hele stad het uit.", "Richt 15:6": "Toen zeiden de Filistijnen: Wie heeft dit gedaan? En men zei: Simson, de schoonzoon van de Thimniet, omdat hij zijn vrouw heeft weggenomen, en haar aan zijn metgezel heeft gegeven. Toen kwamen de Filistijnen op, en verbrandden haar en haar vader met vuur.", "Ezech 27:31": "En zij zullen zich over u helemaal kaal maken, en zakken aangorden; en zullen over u wenen met bitterheid van ziel, en bitter rouwklaagt.", "Num 18:16": "Wie hiervan gelost zullen worden, zult u van een maand oud lossen, naar uw schatting, voor het geld van vijf sikkels, naar de sikkel van het heiligdom, die is twintig gera.", "Richt 5:19": "De koningen kwamen, zij streden; toen streden de koningen van Kanaän, te Thaanach aan het water van Megiddo; zij brachten geen winst van het zilver daarvan.", "1 Petr 3:7": "U mannen, evenzo, woon bij haar met verstand, en bewijs eer aan het vrouwelijke lichaam, als het zwakste, als medeerfgenamen van de genade van het leven met haar; opdat uw gebeden niet verhinderd worden.", "Est 8:14": "De lopers, die op snelle kamelen reden en op muildieren, trokken snel uit, aangedreven door het woord van de koning. Deze wet nu werd gegeven op de burg Susan.", "Job 13:15": "Zie, al doodde Hij mij, zou ik niet hopen? Toch zal ik mijn wegen voor Zijn aangezicht verdedigen.", "Hand 7:59": "En zij stenigden Stefanus, terwijl hij aanriep en zei: Heere Jezus, ontvang mijn geest.", "Rom 5:3-5": "En niet alleen dit, maar wij roemen ook in de verdrukkingen, wetende dat de verdrukking lijdzaamheid werkt; En de lijdzaamheid werkt bevinding, en de bevinding werkt hoop; En de hoop beschaamt niet, omdat de liefde van God in onze harten uitgestort is door de Heilige Geest, Die ons gegeven is.", "Jes 39:8": "Maar Hizkia zei tegen Jesaja: Het woord van de HEERE dat u gesproken hebt, is goed. Ook zei hij: Er zal immers vrede en waarheid zijn in mijn dagen!", "Est 1:1": "Dit gebeurde in de dagen van Ahasveros (dit is de Ahasveros die regeerde van Indië tot aan Morenland toe, honderdzevenentwintig landschappen),", "1 Sam 4:14": "Toen Eli het geluid van het geroep hoorde, zei hij: Wat betekent dit geluid van deze opschudding? Toen haastte die man zich, en hij kwam en vertelde het aan Eli.", "Est 1:10-15": "Op de zevende dag, toen het hart van de koning vrolijk was van de wijn, zei hij tegen Mehuman, Biztha, Charbona, Bigtha en Abagtha, Zethar en Charchas, de zeven kamerlingen die dienden voor het aangezicht van de koning Ahasveros, dat zij Vasthi, de koningin, voor het aangezicht van de koning zouden brengen, met de koninklijke kroon, om aan de volken en de vorsten haar schoonheid te tonen; want zij was mooi om te zien. Maar de koningin Vasthi weigerde te komen op het woord van de koning, dat door de kamerlingen aan haar was overgebracht. Toen werd de koning zeer boos, en zijn woede laaide in hem op.", "Ex 22:25": "Als u Mijn volk, dat arm is onder u, geld leent, mag u zich niet als een woekeraar tegenover hen gedragen; u mag geen rente van hen vragen.", "Hand 7:16": "En zij werden overgebracht naar Sichem, en gelegd in het graf, dat Abraham gekocht had voor een som geld, van de zonen van Hemor, de vader van Sichem.", "2 Sam 1:11": "Toen greep David zijn kleren en scheurde ze; evenzo ook al de mannen die met hem waren.", "Job 2:9": "Toen zei zijn vrouw tegen hem: Houdt u nog steeds vast aan uw oprechtheid? Vervloek God en sterf.", "Pred 10:4": "Als de geest van de heerser tegen u oprijst, verlaat uw plaats niet; want het is medicijn, het stilt grote zonden.", "Jes 15:4": "Zowel Hesbon als Eleale schreeuwt, hun stem wordt gehoord tot Jahaz toe; daarom roepen de toegeruste soldaten van Moab luid, ieders ziel is in hem bang gemaakt.", "2 Kron 34:14": "En toen zij het geld uithaalden dat naar het huis van de HEERE gebracht was, vond de priester Hilkia het wetboek van de HEERE, dat door de hand van Mozes gegeven was.", "Est 2:5": "Er was een Joodse man op de burg Susan, wiens naam was Mordechai, een zoon van Jaïr, de zoon van Simeï, de zoon van Kis, een man van Jemini;", "Job 1:21": "En hij zei: Naakt ben ik uit mijn moeders buik gekomen, en naakt zal ik daarheen terugkeren. De HEERE heeft gegeven, en de HEERE heeft genomen; de Naam van de HEERE zij geloofd!", "2 Kron 24:11": "Het gebeurde nu ter tijd, als hij de kist, naar het bevel van de koning, door de hand van de Levieten inbracht, en als zij zagen dat er veel van het geld was, dat de schrijver van de koning kwam, en de gestelde van de hoofdpriester, en de kist leegmaakten, en die opnamen, en die terugbrachten naar haar plaats; zo deden zij van dag tot dag, en verzamelden geld in overvloed;", "Est 8:15": "En Mordechai ging weg van voor de koning in een hemelsblauw en wit koninklijk kleed, en met een grote gouden kroon, en met een overkleed van fijn linnen en purper; en de stad Susan juichte en was vrolijk.", "2 Kor 6:3-11": "Wij geven nergens aanstoot in, opdat de bediening niet gelasterd wordt. Maar wij maken onszelf in alles aangenaam als dienaars van God, in veel verdraagzaamheid, in verdrukkingen, in noden, in benauwdheden, in slagen, in gevangenissen, in opschudding, in arbeid, in waken, in vasten,", "Gen 37:35": "En al zijn zonen en al zijn dochters maakten zich op om hem te troosten; maar hij weigerde zich te laten troosten en zei: Want ik zal, rouw bedrijvend, tot mijn zoon in het graf neerdalen. Zo beweende zijn vader hem.", "Spr 24:10-12": "Toont u zich slap ten dage van de benauwdheid, dan is uw kracht nauw. Red hen die ter dood gegrepen zijn; want zij wankelen ter doding, als u zich onthoudt. Wanneer u zegt: Zie, wij wisten dat niet; zal Hij, Die de harten weegt, dat niet merken? En Die uw ziel gadeslaat, zal Hij het niet weten? Want Hij zal de mens vergelden naar zijn werk.", "Hand 20:24": "Maar ik geef niets om mijn leven, en houd het niet dierbaar voor mijzelf, als ik mijn loop maar met blijdschap mag volbrengen, en de dienst die ik van de Heere Jezus ontvangen heb, om het Evangelie van de genade van God te betuigen.", "Jer 46:28": "U dan, Mijn knecht Jakob! Vrees niet, spreekt de HEERE; want Ik ben met u; want Ik zal een voleinding maken met al de heidenen, waarheen Ik u gedreven zal hebben, doch met u zal Ik geen voleinding maken, maar u kastijden met mate, en u niet geheel onschuldig houden.", "Est 7:3": "Toen antwoordde de koningin Esther, en zei: Als ik, o koning, genade in uw ogen gevonden heb, en als het de koning goeddunkt, geve men mij mijn leven, om mijn bede, en mijn volk, om mijn verzoek.", "Gen 17:27": "En alle mannen van zijn huis, degenen die in het huis geboren waren, en degenen die met geld gekocht waren, van de vreemdeling af, werden met hem besneden.", "Gen 27:34": "Toen Ezau de woorden van zijn vader hoorde, schreeuwde hij met een grote en bittere schreeuw, geheel en al; en hij zei tegen zijn vader: Zegen mij, ook mij, mijn vader!", "1 Kon 21:6": "En hij zei tegen haar: Omdat ik tot Naboth, de Jizreëliet, gesproken heb en tegen hem gezegd heb: Geef mij uw wijngaard voor geld, of, als het u zint, zal ik u een andere wijngaard in zijn plaats geven; maar hij heeft gezegd: Ik zal u mijn wijngaard niet geven.", "Deut 32:26": "Ik zei: In alle hoeken zou Ik hen verstrooien; Ik zou hun gedachtenis van onder de mensen doen ophouden;", "Est 7:4": "Want wij zijn verkocht, ik en mijn volk, om ons te verdelgen, te doden en om te brengen. Als wij nog tot knechten en tot dienstmaagden waren verkocht, zou ik gezwegen hebben, ofschoon de onderdrukker de schade van de koning geenszins zou kunnen vergoeden.", "Gen 18:19": "Want Ik heb hem gekend, opdat hij zijn kinderen en zijn huis na hem zou opdragen, en zij de weg van de HEERE zouden bewaren, om gerechtigheid en recht te doen; opdat de HEERE over Abraham brengt wat Hij over hem gesproken heeft.", "Gen 43:14": "En God, de Almachtige, geve u barmhartigheid bij die man, dat hij uw andere broer en Benjamin met u laat teruggaan! En wat mij aangaat, als ik van mijn kinderen beroofd word, dan ben ik maar beroofd!", "Matt 11:21": "Wee u, Chorazin! Wee u, Bethsaïda! Want als in Tyrus en Sidon de krachten gebeurd waren die in u gebeurd zijn, zouden zij zich lang geleden in zak en as bekeerd hebben.", "Richt 20:26": "Toen trokken alle kinderen van Israël en heel het volk op, en kwamen bij het huis van God, en weenden, en bleven daar voor het aangezicht van de HEERE, en vastten die dag tot de avond; en zij offerden brandoffers en dankoffers voor het aangezicht van de HEERE.", "Rom 16:23": "U groet Gajus, de huiswaard van mij en van de hele Gemeente. U groet Erastus, de rentmeester van de stad, en de broeder Quartus.", "2 Kon 12:7-16": "Toen riep koning Joas de priester Jojada en de andere priesters, en zei tegen hen: Waarom herstelt u niet de breuken van het huis? Nu dan, neem geen geld van uw bekenden aan, tenzij u het geeft voor de breuken van het huis. En de priesters stemden erin toe geen geld van het volk aan te nemen, noch de breuken van het huis te herstellen. Maar de priester Jojada nam een kist, en boorde een gat in het deksel ervan, en zette die bij het altaar aan de rechterkant, waar iemand het huis van de HEERE binnenkwam; en de priesters die de drempel bewaakten, staken daarin al het geld dat naar het huis van de HEERE gebracht werd.", "Pred 10:19": "Men maakt maaltijden om te lachen, en de wijn verheugt de levenden, en het geld verschaft alles.", "Hand 7:20-25": "In die tijd werd Mozes geboren, en hij was buitengewoon mooi; hij werd drie maanden opgevoed in het huis van zijn vader. En toen hij te vondeling gelegd was, nam de dochter van Farao hem op, en voedde hem voor zichzelf op als een zoon. En Mozes werd onderwezen in alle wijsheid van de Egyptenaren; en hij was machtig in woorden en in werken.", "Neh 1:4": "En het gebeurde, toen ik deze woorden hoorde, dat ik neerzat, en huilde, en rouw bedreef, enkele dagen; en ik vastte en bad voor het aangezicht van de God van de hemel.", "Deut 2:28": "Verkoop mij voedsel voor geld, dat ik eet, en geef mij water voor geld, dat ik drink; laat mij alleen te voet doortrekken;", "Joël 2:12-17": "Nu dan ook, spreekt de HEERE, bekeert u tot Mij met uw hele hart, en dat met vasten en met geween, en met rouwklagen. En scheurt uw hart en niet uw kleren, en bekeert u tot de HEERE, uw God; want Hij is genadig en barmhartig, geduldig en groot van goedertierenheid, en Hij heeft berouw over het kwade. Wie weet, Hij mocht Zich wenden en berouw hebben; en Hij mocht een zegen achter Zich overlaten tot spijsoffer en drankoffer voor de HEERE, uw God.", "1 Sam 13:1": "Saul was een jaar koning geweest, en in het tweede jaar dat hij over Israël regeerde,", "Est 2:7": "En hij was het die Hadassa opvoedde (dit is Esther, de dochter van zijn oom); want zij had geen vader noch moeder; en zij was een jonge dochter, mooi van gestalte, en mooi van uiterlijk; en toen haar vader en haar moeder stierven, had Mordechai haar tot een dochter aangenomen.", "Jer 10:19": "O, wee mij over mijn breuk! mijn plaag is smartelijk; en ik had gezegd: Dit is zeker een ziekte, die ik wel dragen zal!", "Gen 42:25-35": "En Jozef gebood dat men hun zakken met koren vullen zou, en dat men hun geld terug zou geven, ieder in zijn zak, en dat men hun proviand zou geven voor onderweg; en men deed hun zo. En zij laadden hun koren op hun ezels, en trokken vandaar weg. Toen één zijn zak opendeed om zijn ezel voer te geven in de herberg, zag hij zijn geld; want zie, het was in de opening van zijn zak.", "Est 3:14": "De inhoud van het schrift was, dat er een wet zou worden gegeven in alle landschappen, openbaar gemaakt aan alle volken, dat zij tegen dezelfde dag gereed zouden zijn.", "Est 5:1": "Op de derde dag gebeurde het dat Esther een koninklijk kleed aantrok, en ging staan in het binnenste voorhof van het huis van de koning, tegenover het huis van de koning; de koning nu zat op zijn koninklijke troon, in het koninklijke huis, tegenover de deur van het huis.", "Matt 16:18": "En Ik zeg u ook, dat u Petrus bent, en op deze petra zal Ik Mijn gemeente bouwen, en de poorten van de hel zullen haar niet overweldigen.", "Matt 25:18": "Maar hij die het ene ontvangen had, ging weg en groef in de aarde, en verborg het geld van zijn heer.", "2 Sam 16:10": "Maar de koning zei: Wat heb ik met u te doen, zonen van Zeruja? Ja, laat hem vloeken; want de HEERE heeft immers tegen hem gezegd: Vloek David; wie zou dan zeggen: Waarom hebt u dat gedaan?", "2 Sam 16:12": "Misschien zal de HEERE naar mijn ellende omzien; en de HEERE zal mij goed vergelden voor zijn vloek van vandaag.", "Klaagl 5:4": "Ons water moeten wij voor geld drinken; ons hout komt ons op prijs te staan.", "1 Tim 6:17": "Beveel de rijken in deze tegenwoordige wereld dat zij niet hoogmoedig zijn, en ook niet hun hoop stellen op de onzekerheid van de rijkdom, maar op de levende God, Die ons alle dingen rijkelijk verleent om ervan te genieten;", "Ex 21:21": "Als hij echter een dag of twee dagen overeind blijft, zal hij niet gewroken worden; want hij is zijn eigen geld waard.", "Richt 14:15-18": "Daarna gebeurde het op de zevende dag, dat zij tegen de vrouw van Simson zeiden: Overreed uw man, dat hij ons dat raadsel verklaart, opdat wij niet misschien u en het huis van uw vader met vuur verbranden. Hebt u ons genodigd om ons van ons bezit te beroven? Is het zo niet? En de vrouw van Simson weende voor hem en zei: U haat mij maar, en hebt mij niet lief; u hebt de kinderen van mijn volk een raadsel te raden gegeven, en hebt het mij niet verklaard. En hij zei tegen haar: Zie, ik heb het mijn vader en mijn moeder niet verklaard, zou ik het u dan verklaren? En zij weende voor hem, de zeven dagen dat zij deze bruiloft hadden; zo gebeurde het op de zevende dag, dat hij het haar verklaarde, want zij drong hem sterk aan; en zij verklaarde dat raadsel aan de kinderen van haar volk.", "Matt 13:42": "En zij zullen hen in de vurige oven werpen; daar zal geween zijn en het geknars van de tanden.", "Est 4:1-17": "Toen Mordechai wist wat er allemaal gebeurd was, verscheurde hij zijn kleren en trok een zak met as aan; en hij ging door het midden van de stad, en riep met een luid en bitter geroep. En hij kwam tot vóór de poort van de koning; want niemand mocht bij de poort van de koning naar binnen gaan, gekleed in een zak. En in elk landschap en elke plaats, waar het woord van de koning en zijn wet aankwam, was er grote rouw onder de Joden, met vasten, geween en misbaar; velen lagen in zakken en as.", "Gen 23:13": "En hij sprak tot Efron, ten aanhoren van het volk van het land, en zei: Trouwens, als u het toch wilt geven, hoor mij dan alstublieft; ik zal het geld van de akker geven; neem het van mij aan, dan zal ik mijn dode daar begraven.", "2 Kon 20:19": "Maar Hizkia zei tegen Jesaja: Het woord van de HEERE, dat u gesproken hebt, is goed. Ook zei hij: Zou het niet goed zijn, als er vrede en waarheid in mijn dagen zal zijn?", "2 Tim 4:6": "Want ik word al als een drankoffer geofferd, en de tijd van mijn heengaan is nabij.", "Deut 2:6": "Voedsel zult u voor geld van hen kopen, dat u eet; en ook zult u water voor geld van hen kopen, dat u drinkt.", "Neh 6:11": "Maar ik zei: Zou een man als ik vluchten? En wie zou, in mijn positie, de tempel ingaan om zijn leven te redden? Ik ga er niet in.", "Ps 71:20": "Gij, Die mij veel benauwdheden en kwaden hebt doen zien, zult mij weer levend maken, en zult mij weer ophalen uit de afgronden van de aarde.", "Est 1:10": "Op de zevende dag, toen het hart van de koning vrolijk was van de wijn, zei hij tegen Mehuman, Biztha, Charbona, Bigtha en Abagtha, Zethar en Charchas, de zeven kamerlingen die dienden voor het aangezicht van de koning Ahasveros,", "Job 42:6": "Daarom verfoei ik mij, en ik heb berouw in stof en as.", "Dan 9:3": "En ik richtte mijn gezicht tot God, de HEERE, om Hem te zoeken met gebed en smekingen, met vasten, en een zak, en as.", "Matt 28:12": "En zij kwamen samen met de oudsten, en namen samen een besluit, en gaven de soldaten veel geld,", "2 Sam 15:26": "Maar als Hij zo zal zeggen: Ik heb geen behagen in u; zie, hier ben ik, laat Hij met mij doen zoals het goed is in Zijn ogen.", "Ex 12:44": "Doch elke knecht van iemand, die voor geld gekocht is, nadat u hem besneden zult hebben, dan mag hij daarvan eten.", "Est 2:15": "Toen de beurt van Esther, de dochter van Abichaïl, de oom van Mordechai (die hij tot dochter had aangenomen), naderde, zodat zij bij de koning zou komen, verlangde zij niets, behalve wat Hegai, de kamerling van de koning, de bewaarder van de vrouwen, zei; en Esther verkreeg genade in de ogen van allen die haar zagen.", "Hand 8:20": "Maar Petrus zei tegen hem: Laat uw geld met u verloren gaan, omdat u gemeend hebt dat de gave van God door geld verkregen wordt!", "Est 4:15-17": "Toen zei Esther dat men Mordechai weer zou laten weten: Ga, verzamel alle Joden die te Susan gevonden worden, en vast voor mij, en eet of drink niet, drie dagen lang, nacht noch dag; ik en mijn jonge dochters zullen ook zo vasten, en zo zal ik tot de koning ingaan, wat niet naar de wet is. Wanneer ik dan omkom, dan kom ik om. Toen ging Mordechai weg, en hij deed naar alles wat Esther hem geboden had.", "Spr 21:1": "Het hart van de koning is in de hand van de HEERE als waterbeken. Hij neigt het tot alles wat Hij wil.", "Fil 2:4": "Laat ieder niet alleen op zijn eigen zaken zien, maar ieder ook op wat van de anderen is.", "Neh 2:3-5": "en ik zei tegen de koning: De koning leve in eeuwigheid! Hoe zou mijn gezicht niet treurig zijn, terwijl de stad, de plaats van de graven van mijn vaderen, verwoest is, en haar poorten met vuur verteerd zijn? En de koning zei tegen mij: Wat verzoekt u nu? Toen bad ik tot de God van de hemel. En ik zei tegen de koning: Als het de koning goeddunkt, en als uw dienaar u aangenaam is, dat u mij zendt naar Juda, naar de stad van de graven van mijn vaderen, om die te herbouwen.", "Lev 27:18": "Maar als hij zijn akker na het jubeljaar geheiligd heeft, dan zal de priester hem het geld berekenen naar de jaren die nog overblijven tot het jubeljaar, en het zal van uw schatting afgetrokken worden.", "Deut 32:27": "Ware het niet, dat Ik de toorn van de vijand vreesde, dat hun tegenpartijen zich niet vreemd zouden houden; dat zij niet zouden zeggen: Onze hand is hoog geweest; de HEERE heeft dit alles niet gedaan.", "Est 3:12": "Toen werden de schrijvers van de koning geroepen, in de eerste maand, op de dertiende dag daarvan, en er werd geschreven naar alles wat Haman beval, aan de stadhouders van de koning, en aan de landvoogden die over elk landschap waren, en aan de vorsten van elk volk, elk landschap naar zijn schrift, en elk volk naar zijn taal; er werd geschreven in de naam van de koning Ahasveros, en het werd met de ring van de koning verzegeld.", "2 Kron 24:5": "Zo verzamelde hij de priesters en de Levieten, en zei tegen hen: Trek uit naar de steden van Juda, en verzamel geld van heel Israël, om het huis van uw God te herstellen van jaar tot jaar; en u, haast u met deze zaak; maar de Levieten haastten zich niet.", "Jes 49:23": "En koningen zullen uw voedsterheren zijn, hun vorstinnen uw zoogvrouwen; zij zullen zich voor u buigen met het aangezicht ter aarde, en zij zullen het stof van uw voeten likken; en u zult weten, dat Ik de HEERE ben, dat zij niet beschaamd zullen worden die Mij verwachten.", "Lev 10:1-3": "En de zonen van Aäron, Nadab en Abihu, namen ieder zijn wierookvat en deden er vuur in, en legden er reukwerk op, en brachten vreemd vuur voor het aangezicht van de HEERE, wat Hij hun niet geboden had. Toen ging er een vuur uit van het aangezicht van de HEERE, en verteerde hen; en zij stierven voor het aangezicht van de HEERE. En Mozes zei tegen Aäron: Dit is het wat de HEERE gesproken heeft: In hen die tot Mij naderen zal Ik geheiligd worden, en voor het aangezicht van heel het volk zal Ik verheerlijkt worden. Maar Aäron zweeg stil.", "Gen 17:23": "Toen nam Abraham zijn zoon Ismaël, en alle mannen die in zijn huis geboren waren, en alle die met zijn geld gekocht waren, alles wat mannelijk was onder de mensen van het huis van Abraham, en hij besneed het vlees van hun voorhuid, op diezelfde dag, zoals God met hem gesproken had.", "Ps 15:5": "Die zijn geld niet uitleent tegen woeker, en geen geschenk aanneemt tegen de onschuldige. Wie deze dingen doet, zal niet wankelen in eeuwigheid.", "Amos 9:9": "Want zie, Ik geef bevel, en Ik zal het huis van Israël onder alle heidenvolken schudden, zoals graan geschud wordt in een zeef; en niet één steentje zal er op de aarde vallen.", "Matt 16:25": "Want wie zijn leven zal willen behouden, die zal het verliezen; maar wie zijn leven zal verliezen om Mijnentwil, die zal het vinden.", "Lev 25:51": "Als er nog veel van die jaren zijn, zal hij naar verhouding daarvan tot zijn lossing van het geld waarvoor hij gekocht is, teruggeven.", "Ex 21:35": "Wanneer nu iemands os de os van zijn naaste zo kwetst, dat hij sterft, dan zal men de levende os verkopen en het geld daarvan gelijk delen, en het dode dier zal men ook gelijk delen.", "Zef 1:14": "De grote dag van de HEERE is nabij; hij is nabij, en zeer haastende; de stem van de dag van de HEERE; de held zal daar bitter schreeuwen.", "Richt 16:18": "Toen Delila nu zag, dat hij haar zijn hele hart bekend had gemaakt, zond zij mensen weg, en riep de vorsten van de Filistijnen, en zei: Komt ditmaal, want hij heeft mij zijn hele hart bekendgemaakt. En de vorsten van de Filistijnen kwamen naar haar toe, en brachten dat geld in hun hand.", "Klaagl 3:39": "Mem. Wat klaagt dan een levend mens? Ieder klaagt vanwege zijn zonden.", "Jer 31:15": "Zo zegt de HEERE: Er is een stem gehoord in Rama, een geklaag, een zeer bitter geween; Rachel weent over haar kinderen; zij weigert zich te laten troosten over haar kinderen, omdat zij er niet meer zijn.", "Gen 31:15": "Worden wij niet door hem als vreemden beschouwd? Want hij heeft ons verkocht, en hij heeft ook steeds ons geld verteerd.", "2 Kon 22:7": "Doch er werd met hen geen rekening gehouden van het geld dat in hun hand geleverd was, want zij handelden trouw.", "Matt 22:13": "Toen zei de koning tegen de dienaars: Bind zijn handen en voeten, neem hem mee en werp hem in de buitenste duisternis; daar zal het huilen zijn en het geknars van de tanden.", "Est 1:12": "Maar de koningin Vasthi weigerde te komen op het woord van de koning, dat door de kamerlingen aan haar was overgebracht. Toen werd de koning zeer boos, en zijn woede laaide in hem op.", "Joh 12:25": "Wie zijn leven liefheeft, zal het verliezen; en wie zijn leven haat in deze wereld, zal het bewaren tot het eeuwige leven.", "Neh 9:33": "Doch U bent rechtvaardig, in alles wat ons overkomen is; want U hebt trouw gehandeld, maar wij hebben goddeloos gehandeld.", "Jer 32:25": "Evenwel hebt U tegen mij gezegd, Heere HEERE: koop voor uzelf dat veld voor geld, en laat het door getuigen bevestigen; terwijl de stad in de hand van de Chaldeeën gegeven is.", "1 Sam 12:22": "Want de HEERE zal Zijn volk niet verlaten, omwille van Zijn grote Naam, omdat het de HEERE behaagd heeft, u tot een volk voor Zichzelf te maken.", "Jes 43:24": "Mij hebt u geen kalmoes voor geld gekocht, en met het vet van uw slachtoffers hebt u Mij niet gedrenkt; maar u hebt Mij arbeid gemaakt met uw zonden, u hebt Mij vermoeid met uw ongerechtigheden.", "Est 3:8-13": "Want Haman had tegen de koning Ahasveros gezegd: Er is een volk, verstrooid en verspreid onder de volken in alle landschappen van uw koninkrijk; en hun wetten zijn anders dan die van alle volken; ook houden zij zich niet aan de wetten van de koning; daarom is het voor de koning niet goed hen te laten blijven. Als het de koning goeddunkt, laat er geschreven worden dat men hen ombrengt; dan zal ik tienduizend talenten zilver opwegen in de handen van hen die het werk doen, om het in de schatten van de koning te brengen. Toen trok de koning zijn ring van zijn hand, en hij gaf hem aan Haman, de zoon van Hammedatha, de Agagiet, de tegenstander van de Joden.", "Jer 32:10": "En ik ondertekende de brief en verzegelde hem, en liet het door getuigen bevestigen, toen ik het geld op de weegschaal gewogen had.", "Matt 25:27": "Dan had u mijn geld naar de wisselaars moeten brengen, en zou ik bij mijn komst het mijne met rente teruggekregen hebben."}, "noten": {}, "koppeling": /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +

  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };

})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

const concordCache = {};

  if (!code) return null;

  } catch (e) { cache[code] = null; }

}

}
