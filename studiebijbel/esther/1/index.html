s":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Dit gebeurde in de dagen van Ahasveros (dit is de Ahasveros die regeerde van Indië tot aan Morenland toe, honderdzevenentwintig landschappen),","2":"in die dagen, toen de koning Ahasveros op de troon van zijn koninkrijk zat, die op de burcht Susan was,","3":"in het derde jaar van zijn regering, dat hij een maaltijd gaf voor al zijn vorsten en zijn knechten; de machthebbers van Perzië en Medië, de grootste heren en de leiders van de landschappen waren voor hem aanwezig.","4":"Hij liet daarbij de rijkdom van de heerlijkheid van zijn koninkrijk zien, en de kostbaarheid van het sieraad van zijn grootheid, vele dagen lang: honderdtachtig dagen.","5":"Toen die dagen voorbij waren, gaf de koning een maaltijd voor heel het volk dat zich op de burcht Susan bevond, van de grootste tot de kleinste, zeven dagen lang, in het voorhof van de tuin van het koninklijk paleis.","6":"Er waren witte, groene en hemelsblauwe behangsels, bevestigd met koorden van fijn linnen en purperen banden, aan zilveren ringen en aan marmeren pilaren; de bedsteden waren van goud en zilver, op een vloer van rode, en witte, en zwarte marmer, en albast, en kostbare stenen.","7":"En men gaf te drinken in gouden vaten, en het ene vat was anders dan het andere; en er was veel koninklijke wijn, naar het vermogen van de koning.","8":"En het drinken gebeurde volgens de regel, dat niemand dwong; want zo had de koning het vast bevolen aan alle leiders van zijn huis, dat zij zouden doen naar de wil van ieder.","9":"De koningin Vasthi gaf ook een maaltijd voor de vrouwen in het koninklijk huis van de koning Ahasveros.","10":"Op de zevende dag, toen het hart van de koning vrolijk was van de wijn, zei hij tegen Mehuman, Biztha, Charbona, Bigtha en Abagtha, Zethar en Charchas, de zeven kamerlingen die dienden voor het aangezicht van de koning Ahasveros,","11":"dat zij Vasthi, de koningin, voor het aangezicht van de koning zouden brengen, met de koninklijke kroon, om aan de volken en de vorsten haar schoonheid te tonen; want zij was mooi om te zien.","12":"Maar de koningin Vasthi weigerde te komen op het woord van de koning, dat door de kamerlingen aan haar was overgebracht. Toen werd de koning zeer boos, en zijn woede laaide in hem op.","13":"Toen zei de koning tegen de wijzen, die de tijden verstonden (want zo moest de zaak van de koning gebeuren, voor het aangezicht van allen die de wet en het recht kenden;","14":"de naaste bij hem waren Carsena, Sethar, Admatha, Tharsis, Meres, Marsena, Memuchan, zeven vorsten van de Perzen en de Meden, die het aangezicht van de koning zagen, die vooraan zaten in het koninkrijk),","15":"wat men volgens de wet met de koningin Vasthi zou moeten doen, omdat zij het woord van de koning Ahasveros, dat door de kamerlingen was overgebracht, niet had gedaan?","16":"Toen zei Memuchan voor het aangezicht van de koning en de vorsten: De koningin Vasthi heeft niet alleen tegen de koning misdaan, maar ook tegen alle vorsten, en tegen alle volken die in alle landschappen van de koning Ahasveros zijn.","17":"Want deze daad van de koningin zal bekend worden bij alle vrouwen, zodat zij hun mannen in hun ogen zullen verachten, wanneer men zal zeggen: De koning Ahasveros zei dat men de koningin Vasthi voor zijn aangezicht zou brengen, maar zij kwam niet.","18":"Op deze zelfde dag zullen de vorstinnen van Perzië en Medië hetzelfde zeggen tegen alle vorsten van de koning, zodra zij deze daad van de koningin horen, en er zal verachten en toorn genoeg zijn.","19":"Als het de koning goeddunkt, laat er dan een koninklijk bevel van hem uitgaan, dat wordt opgeschreven in de wetten van de Perzen en de Meden, en dat niet overtreden mag worden: dat Vasthi niet meer voor het aangezicht van de koning Ahasveros mag komen, en dat de koning haar koningschap geeft aan haar naaste, die beter is dan zij.","20":"Wanneer het bevel van de koning, dat hij zal geven in zijn hele koninkrijk (want het is groot), bekend wordt gemaakt, dan zullen alle vrouwen aan hun mannen eer geven, van de grootste tot de kleinste toe.","21":"Dit woord nu vond de koning en de vorsten goed; en de koning deed naar het woord van Memuchan.","22":"En hij zond brieven aan alle landschappen van de koning, aan ieder landschap in zijn eigen schrift, en aan elk volk in zijn eigen taal, dat elke man heerser in zijn eigen huis zou zijn, en zou spreken in de taal van zijn volk."},"SV":{"1":"Het geschiedde nu in de dagen van Ahasveros, ( hij is die Ahasveros, dewelke regeerde van Indië af tot aan Morenland toe, honderd zeven en twintig landschappen).","2":"In die dagen, als de koning Ahasveros op den troon zijns koninkrijks zat, die op den burg Susan was;","3":"In het derde jaar zijner regering maakte hij een maaltijd al zijn vorsten en zijn knechten; de macht van Perzië en Medië, de grootste heren en de oversten der landschappen waren voor zijn aangezicht;","4":"Als hij vertoonde den rijkdom der heerlijkheid zijns rijks, en de kostelijkheid des sieraads zijner grootheid, vele dagen lang, honderd en tachtig dagen.","5":"Toen nu die dagen vervuld waren, maakte de koning een maaltijd al den volke, dat gevonden werd op den burg Susan, van den grootste tot den kleinste, zeven dagen lang, in het voorhof van den hof van het koninklijk paleis.","6":"Er waren witte, groene en hemelsblauwe *behangselen*, gevat aan fijn linnen en purperen banden, in zilveren ringen, en *aan* marmeren pilaren; de bedsteden waren van goud en zilver, op een vloer van porfier *steen*, en van marmer, en albast, en kostelijke stenen.","7":"En men gaf te drinken in vaten van goud, en het ene vat was anders dan het andere vat; en er was veel koninklijke wijn, naar des konings vermogen.","8":"En het drinken geschiedde naar de wet, dat niemand dwong; want alzo had de koning vastelijk bevolen aan alle groten zijns huizes, dat zij doen zouden naar den wil van een iegelijk.","9":"De koningin Vasthi maakte ook een maaltijd voor de vrouwen in het koninklijk huis, hetwelk de koning Ahasveros had.","10":"Op den zevenden dag, toen des konings hart vrolijk was van den wijn, zeide hij tot Mehuman, Biztha, Charbona, Bigtha en Abagtha, Zethar en Charchas, de zeven kamerlingen, dienende voor het aangezicht van den koning Ahasveros,","11":"Dat zij Vasthi, de koningin, zouden brengen voor het aangezicht des konings, met de koninklijke kroon, om den volken en den vorsten haar schoonheid te tonen; want zij was schoon van aangezicht.","12":"Doch de koningin Vasthi weigerde te komen op het woord des konings, hetwelk door den dienst der kamerlingen *haar* *aangezegd* *was*. Toen werd de koning zeer verbolgen, en zijn grimmigheid ontstak in hem.","13":"Toen zeide de koning tot de wijzen, die de tijden verstonden ( want alzo moest des konings zaak geschieden, in de tegenwoordigheid van al degenen, die de wet en het recht wisten;","14":"De naasten nu bij hem waren Carsena, Sethar, Admatha, Tharsis, Meres, Marsena, Memuchan, zeven vorsten der Perzen en der Meden, die het aangezicht des konings zagen, die vooraan zaten in het koninkrijk),","15":"Wat men naar de wet met de koningin Vasthi doen zou, omdat zij niet gedaan had het woord van den koning Ahasveros, door den dienst der kamerlingen?","16":"Toen zeide Memuchan voor het aangezicht des konings en der vorsten: De koningin Vasthi heeft niet alleen tegen den koning misdaan, maar *ook* tegen al de vorsten, en tegen al de volken, die in al de landschappen van den koning Ahasveros zijn.","17":"Want deze daad der koningin zal uitkomen tot alle vrouwen, zodat zij haar mannen verachten zullen in haar ogen, als men zeggen zal: De koning Ahasveros zeide, dat men de koningin Vasthi voor zijn aangezicht brengen zou; maar zij kwam niet.","18":"Te dezen zelfden dage zullen de vorstinnen van Perzië en Medië ook *alzo* zeggen tot al de vorsten des konings, als zij deze daad der koningin zullen horen, en er zal verachtens en toorns genoeg wezen.","19":"Indien het den koning goeddunkt, dat een koninklijk gebod van hem uitga, hetwelk geschreven worde in de wetten der Perzen en Meden, en dat men het niet overtrede: dat Vasthi niet inga voor het aangezicht van den koning Ahasveros, en de koning geve haar koninkrijk aan haar naaste, die beter is dan zij.","20":"Als het bevel des konings, hetwelk hij doen zal in zijn ganse koninkrijk, ( want het is groot) gehoord zal worden, zo zullen alle vrouwen aan haar mannen eer geven, van de grootste tot de kleinste toe.","21":"Dit woord nu was goed in de ogen des konings en der vorsten; en de koning deed naar het woord van Memuchan.","22":"En hij zond brieven aan al de landschappen des konings, aan een iegelijk landschap naar zijn schrift, en aan elk volk naar zijn spraak, dat elk man overheer in zijn huis wezen zou, en spreken naar de spraak zijns volks."},"KJV":{"1":"Now it came to pass in the days of Ahasuerus, (this *is* Ahasuerus which reigned, from India even unto Ethiopia, *over* an hundred and seven and twenty provinces:)","2":"*That* in those days, when the king Ahasuerus sat on the throne of his kingdom, which *was* in Shushan the palace,","3":"In the third year of his reign, he made a feast unto all his princes and his servants; the power of Persia and Media, the nobles and princes of the provinces, *being* before","4":"When he shewed the riches of his glorious kingdom and the honour of his excellent majesty many days, *even* an hundred and fourscore days.","5":"And when these days were expired, the king made a feast unto all the people that were present in Shushan the palace, both unto great and small, seven days, in the court of the garden of the king's palace;","6":"*Where were* white, green, and blue, *hangings*, fastened with cords of fine linen and purple to silver rings and pillars of marble: the beds *were of* gold and silver, upon a pavement of red, and blue, and white, and black, marble.","7":"And they gave *them* drink in vessels of gold, (the vessels being diverse one from another,) and royal wine in abundance, according to the state of the king.","8":"And the drinking *was* according to the law; none did compel: for so the king had appointed to all the officers of his house, that they should do according to every man's pleasure.","9":"Also Vashti the queen made a feast for the women *in* the royal house which *belonged* to king Ahasuerus.","10":"On the seventh day, when the heart of the king was merry with wine, he commanded Mehuman, Biztha, Harbona, Bigtha, and Abagtha, Zethar, and Carcas, the seven chamberlains that served in the presence of Ahasuerus the king,","11":"To bring Vashti the queen before the king with the crown royal, to shew the people and the princes her beauty: for she *was* fair to look on.","12":"But the queen Vashti refused to come at the king's commandment by *his* chamberlains: therefore was the king very wroth, and his anger burned","13":"Then the king said to the wise men, which knew the times, (for so *was* the king's manner toward all that knew law and judgment:","14":"And the next unto him *was* Carshena, Shethar, Admatha, Tarshish, Meres, Marsena, *and* Memucan, the seven princes of Persia and Media, which saw the king's face, *and* which sat the first in the kingdom;)","15":"What shall we do unto the queen Vashti according to law, because she hath not performed the commandment of the king Ahasuerus by the chamberlains?","16":"And Memucan answered before the king and the princes, Vashti the queen hath not done wrong to the king only, but also to all the princes, and to all the people that *are* in all the provinces of the king Ahasuerus.","17":"For *this* deed of the queen shall come abroad unto all women, so that they shall despise their husbands in their eyes, when it shall be reported, The king Ahasuerus commanded Vashti the queen to be brought in before him, but she came","18":"*Likewise* shall the ladies of Persia and Media say this day unto all the king's princes, which have heard of the deed of the queen. Thus *shall there arise* too much contempt and wrath.","19":"If it please the king, let there go a royal commandment from him, and let it be written among the laws of the Persians and the Medes, that it be not altered, That Vashti come no more before king Ahasuerus; and let the king give her royal estate unto another that is better","20":"And when the king's decree which he shall make shall be published throughout all his empire, (for it is great,) all the wives shall give to their husbands honour, both to great and small.","21":"And the saying pleased the king and the princes; and the king did according to the word of Memucan:","22":"For he sent letters into all the king's provinces, into every province according to the writing thereof, and to every people after their language, that every man should bear rule in his own house, and that *it* should be published according to the language of every people."}},"tsk":{"1":[{"kopje":"Ahasveros","refs":["Ezra 6:14","Ezra 4:6","Dan 9:1"]},{"kopje":"van Indië","refs":["Est 8:9","Jes 18:1","Jes 37:9"]},{"kopje":"honderdzevenentwintig","refs":["Dan 6:2"]}],"2":[{"kopje":"zat","refs":["2 Sam 7:1","1 Kon 1:46","Dan 4:4"]},{"kopje" 462\">Memucan</span> <span class=\"wl wl-kjv\" data-code=\"H559\">answered</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> and the <span class=\"wl wl-kjv\" data-code=\"H8269\">princes,</span> <span class=\"wl wl-kjv\" data-code=\"H2060\">Vashti</span> the <span class=\"wl wl-kjv\" data-code=\"H4436\">queen</span> hath not done <span class=\"wl wl-kjv\" data-code=\"H5753\">wrong</span> to the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> only, but also to all the <span class=\"wl wl-kjv\" data-code=\"H8269\">princes,</span> and to all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> that are in all the <span class=\"wl wl-kjv\" data-code=\"H4082\">provinces</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> Ahasuerus.","17":"For this <span class=\"wl wl-kjv\" data-code=\"H1697\">deed</span> of the <span class=\"wl wl-kjv\" data-code=\"H4436\">queen</span> shall come <span class=\"wl wl-kjv\" data-code=\"H3318\">abroad</span> unto all <span class=\"wl wl-kjv\" data-code=\"H802\">women,</span> so that they shall <span class=\"wl wl-kjv\" data-code=\"H959\">despise</span> their <span class=\"wl wl-kjv\" data-code=\"H1167\">husbands</span> in their <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes,</span> when it shall be <span class=\"wl wl-kjv\" data-code=\"H559\">reported,</span> The <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H325\">Ahasuerus</span> <span class=\"wl wl-kjv\" data-code=\"H559\">commanded</span> <span class=\"wl wl-kjv\" data-code=\"H2060\">Vashti</span> the <span class=\"wl wl-kjv\" data-code=\"H4436\">queen</span> to be brought <span class=\"wl wl-kjv\" data-code=\"H935\">in</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> him, but she came","18":"Likewise shall the <span class=\"wl wl-kjv\" data-code=\"H8282\">ladies</span> of <span class=\"wl wl-kjv\" ken laten, zoveel als het een iegelijk geliefde."},{"catchword":"vastelijk bevolen","tekst":"Hebreeuws, gefondeerd, gegrondvest."},{"catchword":"aan alle groten zijns huizes,","tekst":"Hebreeuws, aan allen meester, of overste zijns huizes."},{"catchword":"van een iegelijk","tekst":"Hebreeuws, des mans en des mans. De zin is dat men een iegelijk zou inschenken en laten drinken zoveel wijn als hij begeerde, en niet meer."}],"9":[{"catchword":"een maaltijd","tekst":"Hebreeuws, een maaltijd der vrouwen; te weten, voor die vrouwen, wier mannen bij den koning aten. Het was bij de Perzen niet gebruikelijk dat de vrouwen op gasterijen bij de mannen zaten en aten."},{"catchword":"in het koninklijk huis,","tekst":"Hebreeuws, in het huis des koninkrijks."}],"10":[{"catchword":"den zevenden dag,","tekst":"Dit was de laatste dag van dien treffelijken maaltijd."},{"catchword":"vrolijk was","tekst":"Hebreeuws, goed."},{"catchword":"zeide hij","tekst":"Dat is, hij beval, of hij belastte."},{"catchword":"kamerlingen,","tekst":"Of, hovelingen; en zo in het volgende; zie Gen 37:36 ."}],"11":[{"catchword":"Dat zij Vasthi,","tekst":"Om dit te bevelen, is de koning meer door dronkenschap bewogen geworden dan door verstandige redenen."},{"catchword":"met de koninklijke kroon,","tekst":"Hebreeuws, met de kroon des koninkrijks."},{"catchword":"den volken","tekst":"Te weten, die te Susan waren."},{"catchword":"schoon van aangezicht","tekst":"Hebreeuws, goed."}],"12":[{"catchword":"den dienst","tekst":"Hebreeuws, door de hand; dat is, door den dienst, gelijk Exo 9:35 ; zie de aantekening aldaar."}],"13":[{"catchword":"wijzen,","tekst":"Dat is, die in de historiën van de oude tijden en het beleid van zaken wel ervaren waren. Vergelijk 1Ch 12:32 ."},{"catchword":"(want alzo moest des konings zaak","tekst":"Hij wil zeggen dat de koningen in Perzië in grootwichtige zaken niets deden dan met raad en goedvinden der vorsten van het rijk."},{"catchword":"geschieden,","tekst":"Dat is, beraadslaagd worden."}],"14":[{"catchword":"naasten nu","tekst":"Anders, te weten, tot de naasten bij hem Carsena, enz. Versta, dat deze vorsten naast bij een koning zaten, of dat zij de grootgeachtsten bij den koning waren."},{"catchword":"zeven vorsten","tekst":"Ezr 7:14 worden zij genoemd zeven raadsheren des konings."},{"catchword":"die het aangezicht des konings zagen,","tekst":"Dat is, die dagelijks bij en omtrent den koning waren; zie de aantekening 2Ki 25:19 , en Ezr 7:14 . Als de koning op iemand vertoornd was, die mocht zijn aangezicht niet zien, gelijk blijkt, onder, Est 7:8 ."},{"catchword":"vooraan zaten","tekst":"Of, boven aan."}],"15":[{"catchword":"naar de wet","tekst":"Te weten, naar de wetten der Perzen en der Meden."},{"catchword":"omdat zij niet","tekst":"Dat is, daarom, dat zij geroepen zijnde niet kwam."},{"catchword":"het woord van den koning","tekst":"Dat is, mijn woord en bevel; hij spreekt van zichzelven in den derden persoon."}],"16":[{"catchword":"Toen zeide Memúchan","tekst":"Het schijnt dat Memuchan nog aan tafel zijnde, met den koning dit oordeel geveld heeft. Want de Perzen, dronken zijnde, plachten dikwijls met elkander over grootwichtige zaken te beraadslagen."},{"catchword":"tegen den koning misdaan,","tekst":"Memuchan wil zeggen dat Vasthi tegen den koning gezondigd had metterdaad, tegen de vorsten en het volk met kwaad exempel."}],"17":[{"catchword":"deze daad der koningin","tekst":"Of, dit woord; dat is het antwoord der koninin. Hij wil zeggen: het gerucht dezer daad, of van dit antwoord, zal voortlopen en alle vrouwen ter ore komen; zie vs.18."},{"catchword":"zodat zij haar","tekst":"Memuchan wil zeggen: Het zal een oorzaak zijn, dat ook onze en andere vrouwen haar mannen verachten zullen."}],"18":[{"catchword":"deze daad der koningin","tekst":"Zie vs.17."},{"catchword":"daar zal verachtens","tekst":"Hij wil zeggen: Hieruit zal dit ontstaan dat de vrouwen haar mannen zullen verachten, waarover dan de mannen zich tegen hunn vrouwen vertoornen z // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {

    } else {
      h += '<em>Geen verwijzingen</em>';

  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:"Lora";font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
