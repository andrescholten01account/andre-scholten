zijn broeder haat, die is tot nu toe in de duisternis.", "Lev 19:33": "En wanneer een vreemdeling bij u in uw land als vreemdeling verblijft, zult u hem niet verdrukken.", "Ex 22:21": "U mag de vreemdeling geen onrecht aandoen, en hem ook niet onderdrukken; want u bent zelf vreemdeling geweest in het land Egypte.", "Jes 58:6-14": "Is dit niet het vasten dat Ik verkies: dat u de knopen van de goddeloosheid losmaakt, dat u de banden van het juk ontdoet, en dat u de verpletterden vrij loslaat, en elk juk verscheurt? Is het niet dit, dat u de hongerige uw brood meedeelt, en de armen, verdrevenen, in huis brengt? Als u een naakte ziet, dat u hem dekt, en dat u zich voor uw eigen vlees niet verbergt? Dan zal uw licht voortbreken als de dageraad, en uw genezing zal snel uitspruiten; en uw gerechtigheid zal voor uw aangezicht heengaan, en de heerlijkheid van de HEERE zal uw achterhoede zijn.", "Amos 9:10": "Alle zondaars van Mijn volk zullen door het zwaard sterven; zij die zeggen: Het kwaad zal ons niet naderen, en ons niet treffen.", "Kol 3:5": "Dood dan uw leden die op de aarde zijn: hoererij, onreinheid, schandelijke beweging, kwade begeerlijkheid, en de hebzucht, die afgodendienst is.", "Ps 94:16": "Wie zal voor mij opstaan tegen de kwaaddoeners? Wie zal zich voor mij stellen tegen de werkers van de ongerechtigheid?", "Ps 106:3": "Gelukkig zijn zij die het recht onderhouden, die te allen tijde gerechtigheid doen.", "Gen 4:7": "Is het niet zo: als u goed doet, wordt u aanvaard? En als u niet goed doet, ligt de zonde aan de deur. Naar u gaat zijn begeerte uit, en u zult over hem heersen.", "1 Tim 5:1": "Bestraf een oudere man niet hard, maar vermaan hem als een vader; de jongeren als broeders;", "Ezech 22:26": "Haar priesters doen Mijn wet geweld aan, en zij ontheiligen Mijn heilige dingen; tussen het heilige en het onheilige maken zij geen onderscheid, en het verschil tussen het onreine en het reine geven zij niet te kennen; daarbij verbergen zij hun ogen voor Mijn sabbatten; ja, Ik word in hun midden ontheiligd.", "Luk 21:8": "En Hij zei: Kijkt uit, dat u niet verleid wordt; want velen zullen komen onder Mijn Naam, en zeggen: Ik ben de Christus; en de tijd is nabij gekomen. Ga hen dan niet na.", "Luk 19:41": "En toen Hij dichtbij kwam en de stad zag, weende Hij over haar,", "Deut 18:1": "De Levitische priesters, de hele stam van Levi, zullen geen deel of erfdeel hebben met Israël; de vuuroffers van de HEERE en Zijn erfdeel zullen zij eten.", "Fil 2:30": "Want om het werk van Christus is hij dicht bij de dood gekomen, terwijl hij zijn leven niet ontzag, opdat hij het gebrek van uw bediening aan mij zou aanvullen.", "Ps 69:8-10": "Want om Uwentwil draag ik smaad; schande heeft mijn gezicht bedekt. Ik ben mijn broeders vreemd geworden, en onbekend aan de kinderen van mijn moeder. Want de ijver voor Uw huis heeft mij verteerd; en de smaad van hen die U smaden, is op mij gevallen.", "Openb 2:14": "Maar Ik heb enkele weinige dingen tegen u, dat u daar mensen hebt die de leer van Balaäm vasthouden, die Balak leerde de kinderen van Israël een aanstoot voor te werpen, opdat zij afgodenoffer zouden eten en hoereren.", "Ps 126:5": "Die met tranen zaaien, zullen met gejuich maaien.", "Gen 28:21": "en ik in vrede naar het huis van mijn vader terugkeer, dan zal de HEERE mij tot een God zijn!", "Ezech 26:2": "Mensenkind! Omdat Tyrus van Jeruzalem gezegd heeft: Heah! Zij is verbroken, de poort van de volken; zij is tot mij omgewend; ik zal vervuld worden, zij is verwoest!", "Jer 50:6": "Mijn volk waren verloren schapen, hun herders hadden hen verleid, zij hadden hen naar de bergen gevoerd, zij gingen van berg tot heuvel, zij vergaten hun rustplaats.", "Matt 7:15": "Maar wacht u voor de valse profeten, die in schaapskleren naar u toe komen, maar van binnen zijn het roofzuchtige wolven.", "1 Tim 2:10": "maar (wat past bij vrouwen die de godsvrucht belijden) door goede werken.", "Joh 8:12": "Jezus sprak dan weer tegen hen en zei: Ik ben het licht van de wereld; wie Mij volgt, zal in de duisternis niet wandelen, maar zal het licht van het leven hebben.", "1 Joh 2:18": "Kinderen, het is het laatste uur; en zoals u gehoord hebt, dat de antichrist komt, zo zijn er nu ook al veel antichristen gekomen; waaraan wij weten, dat het het laatste uur is.", "1 Tim 3:2": "Een opziener moet dan onberispelijk zijn, de man van één vrouw, waakzaam, matig, eerbaar, gastvrij, bekwaam om te leren;", "Rom 12:9": "De liefde moet ongeveinsd zijn. Heb een afkeer van het kwade, en houd vast aan het goede.", "2 Tim 3:17": "opdat de mens van God volmaakt is, tot alle goed werk volmaakt toegerust.", "Spr 16:32": "Wie geduldig is, is beter dan de sterke; en wie heerst over zijn geest, dan wie een stad inneemt.", "Ps 119:139": "Mijn ijver heeft mij doen vergaan, omdat mijn tegenstanders Uw woorden vergeten hebben.", "Zach 8:3": "Zo zegt de HEERE: Ik ben teruggekeerd naar Sion, en Ik zal in het midden van Jeruzalem wonen; en Jeruzalem zal genoemd worden een stad van de waarheid, en de berg van de HEERE van de heerscharen, een berg van heiligheid.", "Micha 3:11": "Haar hoofden rechtspreken om geschenken, en haar priesters leren om loon, en haar profeten waarzeggen om geld; nog steunen zij op de HEERE, en zeggen: Is de HEERE niet in ons midden? Ons zal geen kwaad overkomen.", "Spr 10:6": "Zegeningen zijn op het hoofd van de rechtvaardige; maar het geweld bedekt de mond van de goddelozen.", "1 Joh 3:6-10": "Ieder die in Hem blijft, zondigt niet; ieder die zondigt, heeft Hem niet gezien en heeft Hem niet gekend. Kinderen, laat niemand u verleiden. Die de rechtvaardigheid doet, is rechtvaardig, zoals Hij rechtvaardig is. Die de zonde doet, is uit de duivel; want de duivel zondigt vanaf het begin. Hiertoe is de Zoon van God geopenbaard, opdat Hij de werken van de duivel zou verbreken.", "Jes 44:20": "Hij voedt zich met as, het bedrogen hart heeft hem terzijde afgeleid; zodat hij zijn ziel niet redden kan, en ook niet kan zeggen: Is er niet een leugen in mijn rechterhand?", "Gal 6:7": "Dwaal niet; God laat Zich niet bespotten; want wat de mens ook zaait, dat zal hij ook maaien.", "Gal 5:10": "Ik vertrouw van u in de Heere, dat u niet anders zult denken; maar wie u in verwarring brengt, zal het oordeel dragen, wie hij ook is.", "Jes 26:11": "HEERE, is Uw hand verhoogd, zij zien het niet; maar zij zullen het zien, en beschaamd worden, vanwege de ijver over Uw volk, ook zal het vuur Uw tegenstanders verteren.", "Jes 26:10": "Wordt de goddeloze genade bewezen, dan leert hij toch geen gerechtigheid; hij doet onrecht in een geheel rechtvaardig land, en hij ziet de hoogheid van de HEERE niet aan.", "Jak 1:27": "De zuivere en onbevlekte godsdienst voor God en de Vader is deze: wezen en weduwen bezoeken in hun verdrukking, en zichzelf onbesmet bewaren van de wereld.", "Hebr 12:10": "Want zij hebben ons wel voor een korte tijd gekastijd, zoals het hun goeddacht; maar Hij kastijdt ons tot ons nut, opdat wij Zijn heiligheid deelachtig zouden worden.", "Hand 20:22-24": "En nu, zie, ik, gebonden door de Geest, reis naar Jeruzalem, zonder te weten wat mij daar zal overkomen; Behalve dat de Heilige Geest van stad tot stad betuigt en zegt dat mij boeien en verdrukkingen te wachten staan. Maar ik geef niets om mijn leven, en houd het niet dierbaar voor mijzelf, als ik mijn loop maar met blijdschap mag volbrengen, en de dienst die ik van de Heere Jezus ontvangen heb, om het Evangelie van de genade van God te betuigen.", "Tit 1:7": "Want een opziener moet onberispelijk zijn, als een huisverzorger van God, niet eigenzinnig, niet gauw driftig, niet verzot op wijn, geen vechter, niet uit op oneerlijke winst;", "Ef 5:9": "(Want de vrucht van de Geest bestaat in alle goedheid, en rechtvaardigheid, en waarheid),", "1 Joh 3:10": "Hierin zijn de kinderen van God en de kinderen van de duivel openbaar. Ieder die de rechtvaardigheid niet doet, is niet uit God; en ook wie zijn broeder niet liefheeft,", "Mark 12:44": "Want zij allen hebben van hun overvloed daarin geworpen; maar deze heeft van haar armoede, alles wat zij had, daarin geworpen, haar hele levensonderhoud.", "Joh 8:43": "Waarom begrijpt u Mijn spraak niet? Het is omdat u Mijn woord niet kunt horen.", "Spr 30:8": "Ijdelheid en leugentaal, doe die ver van mij; armoede of rijkdom, geef mij niet; voed mij met het brood dat mij toebedeeld is;", "Gal 6:14": "Maar laat het ver van mij zijn dat ik zou roemen, anders dan in het kruis van onze Heere Jezus Christus; door Wie de wereld mij gekruisigd is, en ik de wereld.", "Mark 13:21": "En dan, als iemand tegen u zal zeggen: Zie, hier is de Christus; of: Zie, Hij is daar; geloof het niet.", "2 Kon 20:3": "Och, HEERE, gedenk toch dat ik voor Uw aangezicht in waarheid en met een volkomen hart gewandeld heb, en gedaan heb wat goed is in Uw ogen. En Hizkia huilde erg veel.", "Hand 21:18": "En de volgende dag ging Paulus met ons naar Jakobus; en alle oudsten waren daar gekomen.", "1 Tim 4:7": "Maar wijs de ongoddelijke en oudwijfse verzinsels af; oefen uzelf in plaats daarvan in godvruchtigheid.", "2 Kor 2:2-11": "Want als ik u bedroef, wie is het dan die mij vrolijk maakt, dan degene die door mij bedroefd is geworden? En dat heb ik u geschreven, opdat ik, als ik daar kom, niet de droefheid zou hebben van hen door wie ik juist verblijd zou moeten worden; en ik vertrouw van u allen dat mijn blijdschap ook de blijdschap van u allen is. Want ik heb u vanuit veel verdrukking en benauwdheid van hart, met veel tranen geschreven, niet opdat u bedroefd zou worden, maar opdat u de liefde zou leren kennen die ik overvloedig voor u heb.", "1 Joh 4:21": "En dit gebod hebben wij van Hem, namelijk dat wie God liefheeft, ook zijn broeder liefhebt.", "2 Petr 2:4": "Want als God de engelen die gezondigd hebben niet gespaard heeft, maar hen in de hel geworpen heeft en overgegeven heeft aan de ketenen van de duisternis, om tot het oordeel bewaard te worden;", "Joz 13:14": "Alleen aan de stam Levi gaf hij geen erfenis. De vuuroffers van God, de HEERE van Israël, zijn zijn erfenis, zoals Hij tot hem gesproken had.", "1 Kor 9:12-15": "Als anderen deze macht over u deelachtig zijn, waarom wij dan niet veel meer? Toch hebben wij deze macht niet gebruikt, maar wij verdragen alles, opdat wij geen enkele verhindering geven aan het Evangelie van Christus. Weet u niet, dat wie de heilige dingen bedienen, van het heilige eten? En wie steeds bij het altaar zijn, met het altaar meedelen? Zo heeft ook de Heere geordend voor hen die het Evangelie verkondigen, dat zij van het Evangelie leven.", "Fil 2:4": "Laat ieder niet alleen op zijn eigen zaken zien, maar ieder ook op wat van de anderen is.", "Hand 13:3": "Toen vastten en baden zij, en nadat zij hun de handen opgelegd hadden, lieten zij hen gaan.", "1 Kor 5:8": "Laten we dan feest houden, niet met de oude zuurdesem, ook niet met de zuurdesem van kwaadheid en boosheid, maar met de ongezuurde broden van oprechtheid en waarheid.", "Deut 13:1-5": "Wanneer een profeet, of iemand die dromen droomt, in uw midden opstaat, en u een teken of wonder geeft; en dat teken of dat wonder komt uit, waarover hij tot u gesproken had, en zei: Laat ons andere goden, die u niet gekend hebt, navolgen en hen dienen; dan zult u naar de woorden van die profeet, of naar die dromen-dromer, niet horen; want de HEERE, uw God, beproeft u, om te weten of u de HEERE, uw God, liefhebt met heel uw hart en met heel uw ziel.", "Jer 20:10": "Want ik heb de kwaadsprekerij van velen gehoord, schrik van alle kanten. \"Geef ons te kennen,\" zeggen ze, \"en wij zullen het bekendmaken\"; al mijn vertrouwde vrienden letten op mijn struikelen; ze zeggen: \"Misschien laat hij zich overhalen, dan zullen wij de overhand over hem krijgen, en onze wraak op hem nemen.\"", "2 Kron 29:34": "Doch van de priesters waren er te weinig, en zij konden niet van al de brandoffers de huid aftrekken; daarom hielpen hun broeders, de Levieten, hen, totdat het werk beëindigd was, en totdat de andere priesters zich geheiligd hadden; want de Levieten waren oprechter van hart om zich te heiligen, dan de priesters.", "Jer 5:4": "Toch zei ik: Zeker, dit zijn de armen; zij handelen dwaas, omdat zij de weg van de HEERE, het recht van hun God, niet kennen.", "Ps 38:20": "Maar mijn vijanden leven, worden machtig; en die mij om valse redenen haten, worden groot in aantal.", "Joh 8:57": "De Joden zeiden dan tegen Hem: U bent nog geen vijftig jaar, en hebt U Abraham gezien?", "Ezech 18:18": "Zijn vader, omdat hij met onderdrukking onderdrukt heeft, het goed van zijn broeder geroofd heeft, en gedaan heeft wat niet goed was te midden van zijn volk; zie, hij zal sterven in zijn ongerechtigheid.", "Ezech 25:3": "En zeg tegen de kinderen van Ammon: Hoor het woord van de Heere HEERE: Zo zegt de Heere HEERE: Omdat u gezegd hebt: Ha! over Mijn heiligdom, toen het ontheiligd werd, en over het land van Israël, toen het verwoest werd, en over het huis van Juda, toen zij in gevangenschap gingen;", "2 Tim 3:6-9": "Want tot hen behoren zij die de huizen binnensluipen en de vrouwtjes gevangen nemen die met zonden beladen zijn en door allerlei begeerten gedreven worden, vrouwtjes die altijd leren, en nooit tot kennis van de waarheid kunnen komen. Zoals Jannes en Jambres Mozes tegenstonden, zo staan ook dezen de waarheid tegen; mensen, verdorven van verstand, verwerpelijk wat het geloof betreft.", "Jes 9:13-15": "Daarom zal de HEERE uit Israël afhouwen de kop en de staart, de tak en de biezen, op één dag. (De oude en aanzienlijke, die is de kop; maar de profeet die valsheid leert, die is de staart.) Want de leiders van dit volk zijn verleiders, en die door hen geleid worden, worden ingeslokt.", "Joh 15:5": "Ik ben de Wijnstok, en u de ranken; die in Mij blijft, en Ik in hem, die draagt veel vrucht; want zonder Mij kunt u niets doen.", "Spr 1:7": "De vrees van de HEERE is het beginsel van de wetenschap; de dwazen verachten wijsheid en tucht.", "Jer 2:8": "De priesters zeiden niet: Waar is de HEERE? en die de wet hanteerden, kenden Mij niet; en de herders overtraden tegen Mij; en de profeten profeteerden door Baäl, en wandelden naar dingen die geen nut doen.", "Tit 1:8": "maar iemand die graag herbergt, die de goeden liefheeft, bezonnen, rechtvaardig, heilig, ingetogen;", "Openb 2:1": "Schrijf aan de engel van de gemeente van Efeze: Dit zegt Hij, Die de zeven sterren in Zijn rechterhand houdt, Die in het midden van de zeven gouden kandelaren wandelt:", "1 Joh 2:10": "Wie zijn broeder liefheeft, blijft in het licht, en er is geen struikelblok in hem.", "2 Kor 3:15": "Maar tot op de huidige dag, telkens als Mozes gelezen wordt, ligt er een deksel op hun hart.", "Deut 32:28": "Want zij zijn een volk, dat door raadslagen verloren gaat, en er is geen verstand in hen.", "Matt 12:50": "Want ieder die de wil doet van Mijn Vader, Die in de hemelen is, die is Mijn broeder, en zuster, en moeder.", "Matt 10:10": "Ook geen reistas voor onderweg, geen twee stel kleren, geen schoenen, geen staf; want de arbeider is zijn voedsel waard.", "1 Petr 5:1-5": "De oudsten die onder u zijn, vermaan ik, die een medeoudste en getuige van het lijden van Christus ben, en deelachtig aan de heerlijkheid die geopenbaard zal worden: Weid de kudde van God die onder u is, en houd daar toezicht op, niet uit dwang, maar gewillig; ook niet om vuil gewin, maar met een bereidwillig gemoed; ook niet als heersers over het erfdeel van de Heere, maar als voorbeelden voor de kudde.", "Rom 6:1-23": "Wat zullen wij dan zeggen? Zullen wij in de zonde blijven, opdat de genade des te meer wordt? Dat zij verre. Wij die aan de zonde gestorven zijn, hoe zullen wij nog daarin leven? Of weet u niet dat allen die wij in Christus Jezus gedoopt zijn, wij in Zijn dood gedoopt zijn?", "1 Petr 2:5": "Dan wordt u ook zelf, als levende stenen, gebouwd tot een geestelijk huis, tot een heilig priesterschap, om geestelijke offers te brengen die God aangenaam zijn door Jezus Christus.", "Hand 5:42": "En zij hielden niet op, elke dag, in de tempel en bij de huizen, te leren, en Jezus Christus te verkondigen.", "2 Kor 12:20": "Want ik vrees dat ik, als ik gekomen zal zijn, u niet zal vinden zoals ik wil, en dat ik door u gevonden zal worden zoals u niet wilt; dat er niet op enigerlei wijze twisten, jaloezie, toorn, ruzie, kwaadsprekerij, gefluister, opgeblazenheid, wanordelijkheden zijn;", "Ef 4:31": "Alle bitterheid, en toorn, en gramschap, en geroep, en lastering worde van u geweerd, met alle boosheid;", "2 Petr 3:12": "Verwacht en verhaast de komst van de dag van God, waarop de hemelen door vuur zullen vergaan, en de elementen brandend zullen versmelten.", "Jak 2:14-26": "Wat voor nut heeft het, mijn broeders, als iemand zegt dat hij het geloof heeft, maar hij heeft de werken niet? Kan dat geloof hem zaligmaken? Als er nu een broeder of zuster naakt zouden zijn, en gebrek zouden hebben aan dagelijks voedsel; en iemand van u zou tegen hen zeggen: Ga heen in vrede, word warm en word verzadigd; maar u zou hun niet geven wat nodig is voor het lichaam, wat voor nut is dat?", "Joh 1:46": "Filippus vond Nathanaël en zei tegen hem: Wij hebben Hem gevonden, van Wie Mozes in de wet geschreven heeft, en de profeten, namelijk Jezus, de zoon van Jozef, van Nazareth.", "Ps 37:27": "Samech. Wijk af van het kwade, en doe het goede, en woon in eeuwigheid.", "Deut 33:11": "Zegen, HEERE! zijn vermogen, en laat U het werk van zijn handen goed bevallen; versla de lenden van hen die tegen hem opstaan en hem haten, zodat zij niet weer opstaan!", "2 Kor 8:23": "Hetzij dan Titus, hij is mijn metgezel en medearbeider bij u; hetzij onze broeders, zij zijn afgezanten van de gemeenten, en een eer van Christus.", "Spr 24:18": "Opdat de HEERE het niet ziet, en het kwaad is in Zijn ogen en Hij Zijn toorn van hem afkeert.", "1 Joh 5:13": "Deze dingen heb ik u geschreven, die gelooft in de Naam van de Zoon van God; opdat u weet dat u het eeuwige leven hebt, en opdat u gelooft in de Naam van de Zoon van God.", "Jer 17:9": "Arglistig is het hart, meer dan enig ding, ja, dodelijk is het; wie zal het kennen?", "Luk 5:27": "En hierna ging Hij naar buiten en zag een tollenaar, genaamd Levi, in het tolhuis zitten, en Hij zei tegen hem: Volg Mij.", "Lev 20:23": "En wandel niet in de gewoonten van het volk, dat Ik voor uw aangezicht wegjaag; want al deze dingen hebben zij gedaan; daarom ben Ik verdrietig op hen geworden.", "Kol 1:13": "Die ons getrokken heeft uit de macht van de duisternis, en overgezet heeft in het Koninkrijk van de Zoon van Zijn liefde;", "2 Kon 5:16": "Maar hij zei: Zo waarachtig als de HEERE leeft, voor Wiens aangezicht ik sta: ik zal het niet aannemen! En hij drong bij hem aan opdat hij het zou aannemen, maar hij weigerde het.", "2 Kor 8:16-18": "Doch God zij dank, Die dezelfde naarstigheid voor u in het hart van Titus gegeven heeft; Dat hij de vermaning heeft aangenomen, en zeer naarstig zijnde, gewillig naar u toe gereisd is. En wij hebben ook met hem gezonden de broeder, die lof heeft in het Evangelie door alle gemeenten;", "Matt 10:40-42": "Wie u ontvangt, ontvangt Mij; en wie Mij ontvangt, ontvangt Hem, Die Mij gezonden heeft. Wie een profeet ontvangt in de naam van een profeet, zal het loon van een profeet ontvangen; en wie een rechtvaardige ontvangt in de naam van een rechtvaardige, zal het loon van een rechtvaardige ontvangen. En wie een van deze kleinen slechts een beker koud water te drinken geeft, in de naam van een discipel, voorwaar, Ik zeg u, hij zal zijn loon geenszins verliezen.", "Spr 14:17": "Wie haastig is tot toorn, zal dwaasheid doen; en een man met schandelijke plannen zal gehaat worden.", "Joh 8:49": "Jezus antwoordde: Ik heb de duivel niet; maar Ik eer Mijn Vader, en u onteert Mij.", "Joh 4:10": "Jezus antwoordde en zei tegen haar: Als u de gave van God kende, en Wie Hij is, Die tegen u zegt: Geef Mij te drinken, dan zou u van Hem hebben gevraagd, en Hij zou u levend water gegeven hebben.", "2 Kor 12:13-18": "Want wat is er, waarin u minder geweest bent dan de andere gemeenten, behalve dan dat ikzelf u niet lastig ben geweest? Vergeef mij dit onrecht. Zie, ik ben voor de derde keer gereed om naar u toe te komen, en zal u niet lastig zijn; want ik zoek niet het uwe, maar u; want de kinderen moeten niet schatten vergaderen voor de ouders, maar de ouders voor de kinderen. En ik zal zeer graag de kosten dragen, en voor uw zielen ten koste gegeven worden; hoewel ik, terwijl ik u overvloediger liefheb, minder bemind word.", "Amos 2:12": "Maar u hebt aan de nazireeërs wijn te drinken gegeven, en u hebt de profeten geboden en gezegd: U zult niet profeteren.", "Openb 22:17": "En de Geest en de Bruid zeggen: Kom! En laat hij die het hoort, zeggen: Kom! En laat hij die dorst heeft, komen; en laat hij die wil, het water des levens nemen, voor niets.", "Jak 1:21": "Daarom, nadat u alle vuiligheid en overvloed van slechtheid hebt afgelegd, ontvang met zachtmoedigheid het Woord dat in u geplant wordt, dat uw zielen zalig kan maken.", "Zach 7:10": "en verdruk de weduwe niet, evenmin de wees, de vreemdeling of de arme; en bedenk in uw hart niet de een tegen de ander iets kwaads.", "Lev 24:22": "Eén recht zult u hebben; zo zal het gelden voor de vreemdeling als voor de geboren Israëliet; want Ik ben de HEERE, uw God!", "1 Tim 6:21": "waarmee sommigen, terwijl zij die beleden, van het geloof zijn afgeweken. De genade zij met u. Amen. De eerste brief aan Timotheüs werd geschreven vanuit Laodicea, de voornaamste stad in Frygië Pacatania.", "1 Kor 12:5": "en er is verscheidenheid van bedieningen, en het is dezelfde Heere;", "Rom 1:19-22": "Omdat wat van God gekend kan worden, in hen openbaar is; want God heeft het hun geopenbaard. Want Zijn onzichtbare dingen worden, vanaf de schepping van de wereld, uit de schepselen begrepen en doorzien, namelijk Zijn eeuwige kracht en Goddelijkheid, opdat zij niet te verontschuldigen zouden zijn. Omdat zij, hoewel zij God kenden, Hem niet als God verheerlijkt of gedankt hebben; maar in hun overleggingen zijn zij verijdeld geworden, en hun onverstandig hart is verduisterd geworden;", "Hand 19:29": "En de gehele stad werd vol verwarring; en zij liepen eendrachtig met een geroep naar de schouwplaats, en sleepten Gajus en Aristarchus mee, Macedoniërs, reisgenoten van Paulus.", "Luk 12:45": "Maar als die dienstknecht in zijn hart zou zeggen: Mijn heer blijft nog lang weg voor hij komt; en zou beginnen de knechten en de dienstmeisjes te slaan, en te eten en te drinken en dronken te worden;", "Matt 16:25": "Want wie zijn leven zal willen behouden, die zal het verliezen; maar wie zijn leven zal verliezen om Mijnentwil, die zal het vinden.", "Luk 21:2-4": "En Hij zag ook een zekere arme weduwe twee kleine penningen daarin werpen. En Hij zei: Waarlijk, Ik zeg u, dat deze arme weduwe meer dan allen heeft ingeworpen. Want die allen hebben van hun overvloed geworpen tot de gaven van God; maar deze heeft van haar gebrek, alle middelen van bestaan die zij had, daarin geworpen.", "Job 31:30": "(Ook heb ik mijn gehemelte niet toegelaten te zondigen, door een vloek zijn ziel te begeren).", "Luk 8:10": "En Hij zei: Aan u is het gegeven de verborgenheden van het Koninkrijk van God te verstaan; maar tot de anderen spreek Ik in gelijkenissen, opdat zij ziende niet zien, en horende niet verstaan.", "Joh 4:15": "De vrouw zei tegen Hem: Heere, geef mij dat water, zodat ik geen dorst meer krijg, en hier niet meer hoef te komen om te putten.", "Luk 12:57": "En waarom oordeelt u ook niet zelf wat recht is?", "Zef 3:4": "Haar profeten zijn lichtvaardig, geheel trouweloze mannen; haar priesters verontreinigen het heilige, zij doen de wet geweld aan.", "Joh 4:35": "Zegt u niet: Het zijn nog vier maanden, en dan komt de oogst? Zie, Ik zeg u: Sla uw ogen op en bekijk de velden; want ze zijn al wit om te oogsten.", "2 Petr 1:15": "Maar ik zal er ook mijn best voor doen, dat u bij elke gelegenheid, na mijn heengaan, hieraan kunt terugdenken.", "Luk 22:24-27": "En er ontstond ook twist onder hen, wie van hen scheen de meeste te zijn. En Hij zei tegen hen: De koningen van de volken heersen over hen; en zij die macht over hen hebben, worden weldoeners genoemd. Maar u niet zo; maar de meeste onder u moet worden als de minste, en wie voorganger is, als iemand die dient.", "3 Joh 1:5-8": "Geliefde, u handelt trouw in alles wat u doet aan de broeders en aan de vreemdelingen, die van uw liefde getuigd hebben voor de gemeente; als u hen op weg helpt zoals God waardig is, zult u daarmee goed doen. Want zij zijn voor Zijn Naam uitgegaan, zonder iets aan te nemen van de heidenen.", "Spr 21:8": "De weg van de mens is hele verkeerd en vreemd; maar het werk van de zuivere is recht.", "1 Tess 2:19": "Want wat is onze hoop, of blijdschap, of kroon van het roem? Bent u dat niet, voor onze Heere Jezus Christus bij Zijn komst?", "1 Joh 3:14": "Wij weten dat wij overgegaan zijn uit de dood in het leven, omdat wij de broeders liefhebben; wie zijn broeder niet liefheeft, blijft in de dood.", "Joh 6:35": "En Jezus zei tegen hen: Ik ben het Brood des levens; wie tot Mij komt, zal beslist geen honger hebben, en wie in Mij gelooft, zal nooit meer dorst hebben.", "Joh 8:42": "Jezus zei dan tegen hen: Als God uw Vader was, zou u Mij liefhebben; want Ik ben van God uitgegaan, en Ik kom van Hem. Want Ik ben ook niet uit Mijzelf gekomen, maar Hij heeft Mij gezonden.", "Openb 2:9": "Ik weet uw werken, en verdrukking, en armoede (maar u bent rijk), en de lastering van hen die zeggen dat zij Joden zijn, en zijn het niet, maar zijn een synagoge van de satan.", "Rom 6:6": "Terwijl wij dit weten, dat onze oude mens met Hem gekruisigd is, opdat het lichaam van de zonde tenietgedaan wordt, opdat wij niet meer de zonde dienen.", "1 Kor 16:16": "dat u zich ook aan zulke mensen onderwerpt, en aan ieder die meewerkt en arbeidt.", "Ps 56:7": "Zij rotten samen, zij versteken zich, zij letten op mijn hielen, zoals zij die op mijn ziel wachten.", "Rom 13:14": "Maar doe de Heere Jezus Christus aan, en verzorg het vlees niet met het oog op begeerten.", "Openb 14:4": "Dezen zijn het, die met vrouwen niet bevlekt zijn, want zij zijn maagden; dezen zijn het, die het Lam volgen, waar Het ook heengaat; dezen zijn gekocht uit de mensen, tot eerstelingen voor God en het Lam.", "Jak 5:7-12": "Wees dan geduldig, broeders, tot de komst van de Heere. Zie, de boer verwacht de kostbare vrucht van het land, en is daarover geduldig, totdat het de vroege en late regen zal hebben ontvangen. Wees ook u geduldig, versterk uw harten; want de komst van de Heere is nabij. Zucht niet tegen elkaar, broeders, opdat u niet veroordeeld wordt; zie, de Rechter staat voor de deur.", "Mark 3:33-35": "En Hij antwoordde hun: Wie is Mijn moeder, of Mijn broers? En terwijl Hij rondkeek naar hen die om Hem heen zaten, zei Hij: Zie, Mijn moeder en Mijn broers. Want wie de wil van God doet, die is Mijn broer, en Mijn zuster, en moeder.", "Tit 2:2": "Dat de oude mannen nuchter zijn, stemmig, bezonnen, gezond in het geloof, in de liefde, in de volharding.", "Ps 115:2": "Waarom zouden de heidenen zeggen: Waar is nu hun God?", "Ps 74:10": "Hoe lang, o God, zal de tegenstander smaden? Zal de vijand Uw Naam voor eeuwig lasteren?", "Lev 19:2": "Spreek tot de hele vergadering van de kinderen van Israël, en zeg tegen hen: U zult heilig zijn, want Ik, de HEERE, uw God, ben heilig!", "Jes 32:16-18": "En het recht zal in de woestijn wonen, en de gerechtigheid zal op het vruchtbare veld verblijven. En het werk van de gerechtigheid zal vrede zijn; en de uitwerking van de gerechtigheid zal rust en zekerheid zijn, tot in eeuwigheid. En mijn volk zal in een woonplaats van vrede wonen, en in welverzekerde woningen, en in stille geruste plaatsen.", "Spr 22:24": "Ga geen vriendschap aan met een driftig man, en ga niet om met een zeer grimmig man;", "1 Joh 5:4": "Want al wat uit God geboren is, overwint de wereld; en dit is de overwinning die de wereld overwint, namelijk ons geloof.", "Dan 4:1": "Koning Nebukadnezar aan alle volken, natiën en talen, die op de hele aardbodem wonen: uw vrede moet vermenigvuldigd worden!", "2 Petr 2:1-22": "Maar er zijn ook valse profeten onder het volk geweest, zoals er ook onder u valse leraars zullen zijn, die verderfelijke ketterijen in het geheim zullen invoeren, en zelfs de Heere, Die hen gekocht heeft, verloochenen, en zo een snel verderf over zichzelf brengen; En velen zullen hun verderfelijke wegen navolgen, waardoor de weg van de waarheid belasterd zal worden. En zij zullen door hebzucht, met gemaakte woorden, van u een koopwaar maken; over hen is het oordeel van lang geleden niet werkeloos, en hun verderf sluimert niet.", "1 Petr 2:9": "Maar u bent een uitverkoren geslacht, een koninklijk priesterschap, een heilig volk, een volk dat God Zich verworven heeft; opdat u de deugden zou verkondigen van Hem Die u uit de duisternis geroepen heeft tot Zijn wonderbaar licht;", "Ps 55:12": "Enkel verderf is binnen in haar; en list en bedrog wijkt niet van haar straat.", "Hos 7:11": "Want Efraïm is als een domme duif, zonder verstand; zij roepen Egypte aan, zij gaan heen tot Assur.", "Ezech 22:25": "De samenzwering van haar profeten heerst in haar midden als een brullende leeuw die een prooi rooft; zij eten de zielen op, de schat en het kostbare nemen zij weg; haar weduwen vermenigvuldigen zij in haar midden.", "Jes 40:27": "Waarom zegt u dan, o Jakob! en spreekt, o Israël! mijn weg is voor de HEERE verborgen, en mijn recht gaat aan mijn God voorbij?", "Joh 16:3": "En deze dingen zullen zij u doen, omdat zij de Vader niet gekend hebben, en Mij ook niet.", "Deut 26:12": "Wanneer u klaar bent met het vertienen van alle tienden van uw inkomen, in het derde jaar, het jaar van de tienden; dan zult u aan de Leviet, aan de vreemdeling, aan de wees en aan de weduwe geven, opdat zij in uw poorten eten en verzadigd worden.", "Ezech 33:15": "Geeft de goddeloze het pand terug, betaalt hij het geroofde terug, wandelt hij in de inzettingen van het leven, zodat hij geen onrecht doet; dan zal hij zeker leven, hij zal niet sterven.", "Job 21:14": "Toch zeggen zij tegen God: Ga weg van ons, want in de kennis van Uw wegen hebben wij geen behagen.", "Rom 14:17": "Want het Koninkrijk van God is niet eten en drinken, maar rechtvaardigheid, en vrede, en blijdschap, door de Heilige Geest.", "Jes 55:13": "Voor een doorn zal een dennenboom opgaan, voor een distel zal een mirteboom opgaan; en het zal de HEERE wezen tot een naam, tot een eeuwig teken, dat niet uitgeroeid zal worden.", "Jak 3:11-18": "Welt er ook uit een fontein, uit een en dezelfde ader, het zoete en het bittere? Kan ook, mijn broeders, een vijgenboom olijven voortbrengen, of een wijnstok vijgen? Zo kan ook geen fontein zout en zoet water voortbrengen. Wie is wijs en verstandig onder u? Laat hij door zijn goede levenswandel zijn werken tonen, in zachtmoedige wijsheid.", "Hebr 13:13": "Laten wij dan naar Hem uitgaan, buiten de legerplaats, terwijl wij Zijn smaad dragen.", "Deut 27:19": "Vervloekt is hij die het recht van de vreemdeling, van de wees en van de weduwe buigt! En heel het volk zal zeggen: Amen.", "Matt 23:3": "daarom, alles wat zij u zeggen dat u houden moet, houd dat en doe het; maar doe niet naar hun werken, want zij zeggen het, en doen het niet.", "1 Tim 4:1-3": "De Geest zegt uitdrukkelijk dat in de laatste tijden sommigen zullen afvallen van het geloof, doordat zij zich gaan richten op verleidende geesten en leringen van demonen, door de huichelarij van leugensprekers, die hun eigen geweten als met een brandijzer hebben dichtgeschroeid; die verbieden te trouwen, en gebieden dat men zich onthoudt van voedsel dat God geschapen heeft om met dankzegging genuttigd te worden door de gelovigen, die de waarheid hebben leren kennen.", "2 Tim 1:6": "Om deze reden herinner ik u eraan, dat u de gave van God opwekt, die in u is door de oplegging van mijn handen.", "1 Kor 16:3": "En wanneer ik daar gekomen zal zijn, zal ik hen die u bekwaam zult achten door brieven zenden, om uw gave naar Jeruzalem over te dragen.", "1 Tess 5:5": "U bent allen kinderen van het licht en kinderen van de dag; wij zijn niet van de nacht, en ook niet van de duisternis.", "Fil 3:7-9": "Maar wat mij winst was, dat heb ik om Christus' wil als schade beschouwd. Ja, zeker, ik beschouw ook alle dingen als schade vanwege de uitnemendheid van de kennis van Christus Jezus, mijn Heere; om Wiens wil ik al die dingen als schade heb gerekend, en ze beschouw als vuil, opdat ik Christus mag winnen, En in Hem gevonden word, niet met mijn eigen rechtvaardigheid, die uit de wet is, maar met de rechtvaardigheid die door het geloof van Christus is, namelijk de rechtvaardigheid die uit God is door het geloof;", "Luk 4:18": "De Geest van de Heere is op Mij, daarom heeft Hij Mij gezalfd; Hij heeft Mij gezonden om aan de armen het Evangelie te verkondigen, om te genezen wie gebroken zijn van hart;", "Joh 10:8": "Allen die vóór Mij zijn gekomen, zijn dieven en rovers; maar de schapen hebben hen niet gehoord.", "Matt 7:23": "En dan zal Ik hun openlijk zeggen: Ik heb u nooit gekend; ga weg van Mij, u die de ongerechtigheid werkt!", "Jak 4:7-11": "Onderwerp u dan aan God; weerstaat de duivel, en hij zal van u wegvluchten. Kom dicht bij God, en Hij zal dicht bij u komen. Reinig de handen, zondaars, en zuiver de harten, dubbelhartigen! Gedraag u als ellendigen, en treur en ween; laat uw lachen veranderen in treuren, en uw blijdschap in verdriet.", "Tit 3:13": "Help Zenas, de wetgeleerde, en Apollos zorgvuldig op weg, zodat het hun aan niets ontbreekt.", "1 Sam 17:26": "Toen zei David tegen de mannen die bij hem stonden: Wat zal men de man doen die deze Filistijn verslaat en de smaad van Israël wegneemt? Want wie is deze onbesneden Filistijn, dat hij de slagorden van de levende God zou honen?", "Spr 14:12": "Er is een weg die iemand recht schijnt; maar het einde ervan is de weg van de dood.", "Hand 11:24": "Want hij was een goed man, en vol van de Heilige Geest en van het geloof; en er werd een grote menigte aan de Heere toegevoegd.", "Joz 22:31": "En Pinehas, de zoon van de priester Eleazar, zei tegen de kinderen van Ruben, en tegen de kinderen van Gad, en tegen de kinderen van Manasse: Vandaag weten wij, dat de HEERE in het midden van ons is, omdat u deze overtreding tegen de HEERE niet begaan hebt; nu hebt u de kinderen van Israël verlost uit de hand van de HEERE.", "Matt 5:30": "En als uw rechterhand u ergert, hak hem af en werp hem van u; want het is beter voor u dat een van uw lichaamsdelen verloren gaat, en niet uw hele lichaam in de hel geworpen wordt.", "Joh 6:60": "Velen van Zijn discipelen dan zeiden, toen zij dit hoorden: Dit is een harde uitspraak; wie kan dat aanhoren?", "Joh 13:35": "Hieraan zullen allen weten dat u Mijn discipelen bent, als u liefde hebt onder elkaar.", "Ps 86:14": "O God! de hoogmoedigen staan tegen mij op, en de bijeenkomsten van de tirannen zoeken mijn ziel; en zij houden U niet voor ogen.", "1 Tim 4:8": "Want de lichamelijke oefening is van weinig nut; maar de godvruchtigheid is nuttig voor alles, omdat zij de belofte heeft van het tegenwoordige en van het toekomende leven.", "Rom 16:2": "opdat u haar ontvangt in de Heere, zoals het de heiligen betaamt, en haar bijstaat in welke zaak zij u ook nodig zou hebben; want zij is een voorstandster geweest van velen, ook van mijzelf.", "Spr 21:29": "Een goddeloze man sterkt zich in zijn aangezicht; maar de oprechte, die maakt zijn weg vast.", "Hos 4:9": "Daarom, zoals het volk, zo zal de priester zijn; en Ik zal zijn wegen aan hem bezoeken¹, en zijn daden hem vergelden.", "Jer 8:8": "Hoe zegt u dan: Wij zijn wijs en de wet van de HEERE is bij ons! Zie, waarlijk, tevergeefs werkt de valse pen van de schriftgeleerden.", "Hand 1:23-26": "En zij stelden er twee voor: Jozef, genaamd Barsabas, die bijgenaamd was Justus, en Matthias. En zij baden en zeiden: U, Heere! U, Kenner van de harten van allen, wijs van deze twee er één aan, die U uitverkoren hebt, om te ontvangen het lot van deze bediening en van het apostelschap, waarvan Judas afgeweken is om heen te gaan naar zijn eigen plaats.", "Jes 5:20": "Wee hun die het kwade goed noemen, en het goede kwaad; die duisternis tot licht stellen, en het licht tot duisternis; die het bittere tot zoet stellen, en het zoete tot bitterheid!", "Joh 12:26": "Als iemand Mij dient, laat hij Mij volgen; en waar Ik ben, daar zal ook Mijn dienaar zijn. En als iemand Mij dient, zal de Vader hem eren.", "1 Tim 6:20": "O Timotheüs, bewaar het pand dat u toevertrouwd is, en keer u af van het ongoddelijk zinloos gepraat en van de tegenstellingen van de ten onrechte zo genoemde wetenschap;", "Joh 15:21": "Maar al deze dingen zullen zij u doen om Mijn Naam, omdat zij Hem niet kennen, Die Mij gezonden heeft.", "Gen 35:2": "Toen zei Jakob tegen zijn huisgezin en tegen allen die bij hem waren: Doe de vreemde goden weg die in uw midden zijn, reinig u, en verander uw kleren;", "Ps 35:15": "Maar toen ik hinkte, waren zij verblijd, en verzamelden zich; zij verzamelden zich tegen mij als geslagenen, en ik merkte niets; zij scheurden hun kleren, en zwegen niet stil.", "2 Kor 12:21": "opdat mijn God mij niet opnieuw vernedert bij u, als ik gekomen zal zijn, en ik verdriet heb over velen, die eerder gezondigd hebben, en die zich niet bekeerd zullen hebben van de onreinheid, en hoererij, en losbandigheid, die zij bedreven hebben.", "Jes 33:15-17": "Wie in gerechtigheid wandelt, en wat recht is spreekt; wie de winst van onderdrukking verwerpt; wie zijn handen uitschudt, zodat zij geen geschenken vasthouden; wie zijn oor dichtstopt, zodat hij geen bloedschuld hoort, en zijn ogen dichtdoet; zodat hij het kwade niet aanziet; Die zal in de hoogten wonen, de sterkten van de steenrotsen zullen zijn hoge schuilplaats zijn; zijn brood wordt hem gegeven, zijn water is gewis. Uw ogen zullen de Koning zien in Zijn schoonheid; zij zullen een ver gelegen land zien.", "Jes 60:1": "Maak u op, word verlicht, want uw licht komt, en de heerlijkheid van de HEERE gaat over u op.", "1 Kor 3:16": "Weet u niet, dat u de tempel van God bent, en dat de Geest van God in u woont?", "Zach 10:3": "Tegen de herders was Mijn toorn ontstoken, en over de bokken heb Ik bezoeking gedaan; maar de HEERE van de heerscharen³ zal Zijn kudde bezoeken, het huis van Juda, en Hij zal hen stellen als het paard van Zijn majesteit in de strijd.", "Rom 16:17": "En ik bid u, broeders, let op degenen die tweedracht en ergernissen veroorzaken, tegen de leer die u geleerd hebt; en blijf bij hen vandaan.", "1 Petr 3:9": "vergeld geen kwaad met kwaad, of schelden met schelden, maar zegen daarentegen; want u weet dat u daartoe geroepen bent, opdat u zegening zou beërven.", "1 Petr 5:14": "Groet elkaar met een kus van liefde. Vrede zij u allen die in Christus Jezus bent. Amen.", "Ps 73:2-28": "Maar wat mij aangaat, mijn voeten waren bijna uitgegleden; mijn schreden waren bijna weggegleden. Want ik was jaloers op de dwazen, toen ik de vrede van de goddelozen zag. Want er zijn geen boeien tot hun dood toe, en hun kracht is fris.", "2 Tess 2:13": "Maar wij zijn verplicht altijd God te danken voor u, broeders, die door de Heere bemind bent, dat God u van het begin af verkoren heeft tot zaligheid, in heiliging door de Geest, en geloof in de waarheid;", "2 Kron 30:7": "En wees niet als uw vaders en als uw broeders, die tegen de HEERE, de God van hun vaderen, ontrouw geweest zijn; daarom heeft Hij hen overgegeven tot verwoesting, zoals u ziet.", "Hebr 5:12": "Want u, terwijl u vanwege de tijd leraars zou moeten zijn, hebt weer nodig dat men u de eerste beginselen leert van de woorden van God; en u bent geworden als mensen die melk nodig hebben, en geen vast voedsel.", "Ps 115:1": "Niet ons, o HEERE, niet ons, maar geef aan Uw Naam eer, om Uw goedertierenheid, om Uw waarheid.", "1 Tim 5:10": "Met getuigenis van goede werken: als zij kinderen opgevoed heeft, als zij gastvrij is geweest, als zij de voeten van de heiligen heeft gewassen, als zij verdrukten voldoende hulp heeft gegeven, als zij elk goed werk heeft nagestreefd.", "Gal 2:20": "Ik ben met Christus gekruisigd; en ik leef, maar niet meer ik, maar Christus leeft in mij; en wat ik nu in het vlees leef, dat leef ik door het geloof van de Zoon van God, Die mij heeft liefgehad, en Zichzelf voor mij heeft overgegeven.", "Deut 14:27": "Maar de Leviet die in uw poorten is, zult u niet verlaten; want hij heeft geen deel noch erfdeel met u.", "Rom 8:13": "Want als u naar het vlees leeft, zult u sterven; maar als u door de Geest de daden van het lichaam doodt, zult u leven.", "Ps 26:1-3": "Een psalm van David. Doe mij recht, HEERE! Want ik wandel in mijn oprechtheid; en ik vertrouw op de HEERE, ik zal niet wankelen. Proef mij, HEERE, en beproef mij; toets mijn nieren en mijn hart. Want Uw goedertierenheid is voor mijn ogen, en ik wandel in Uw waarheid.", "Luk 14:12-14": "En Hij zei ook tegen hem die Hem genodigd had: Wanneer u een middagmaal of avondmaal houdt, roep dan niet uw vrienden, of uw broers, of uw familie, of uw rijke buren; anders zouden zij u ook op hun beurt weer kunnen uitnodigen, en zou u vergelding gebeuren. Maar wanneer u een maaltijd houdt, nodig dan armen, verminkten, kreupelen en blinden uit; en u zult gelukkig zijn, omdat zij niets hebben om u te vergelden; want het zal u vergolden worden bij de opstanding van de rechtvaardigen.", "Ps 51:15": "Zo zal ik de overtreders Uw wegen leren; en de zondaars zullen zich tot U bekeren.", "Spr 14:34": "Gerechtigheid verhoogt een volk, maar de zonde is een schandvlek voor de naties.", "Luk 12:12": "Want de Heilige Geest zal u op datzelfde moment leren wat u moet spreken.", "Hand 19:2": "zei hij tegen hen: Hebt u de Heilige Geest ontvangen, toen u tot geloof kwam? En zij zeiden tegen hem: Wij hebben zelfs niet gehoord of er een Heilige Geest is.", "1 Kor 8:12": "Maar u, die zo tegen de broeders zondigt en hun zwakke geweten kwetst, zondigt tegen Christus.", "Jes 32:6": "Want een dwaas spreekt dwaasheid, en zijn hart doet ongerechtigheid, om huichelarij te plegen, en om dwaling te spreken tegen de HEERE, om de ziel van de hongerige leeg te laten, en de dorstige drank te doen ontbreken.", "1 Kor 11:18": "Want eerst, als u samenkomt in de Gemeente, hoor ik dat er scheuringen onder u zijn; en ik geloof het ten dele;", "1 Joh 4:12": "Niemand heeft ooit God gezien; als wij elkaar liefhebben, blijft God in ons, en Zijn liefde is in ons volmaakt.", "Luk 3:10-14": "En de menigten vroegen hem: Wat zullen wij dan doen? En hij antwoordde en zei tegen hen: Wie twee stukken kleding heeft, moet delen met wie er geen heeft; en wie voedsel heeft, moet hetzelfde doen. En er kwamen ook tollenaars om gedoopt te worden, en zeiden tegen hem: Meester, wat zullen wij doen?", "Jer 23:1": "Wee de herders, die de schapen van Mijn weide ombrengen en verstrooien! spreekt de HEERE.", "Hand 5:29-32": "Maar Petrus en de apostelen antwoordden, en zeiden: Men moet God meer gehoorzaam zijn dan de mensen. De God van onze vaderen heeft Jezus opgewekt, Die u omgebracht hebt, door Hem aan het hout te hangen. Deze heeft God door Zijn rechterhand verhoogd tot een Vorst en Zaligmaker, om Israël bekering en vergeving van zonden te geven.", "Hebr 13:17": "Wees uw voorgangers gehoorzaam en wees hun onderdanig; want zij waken over uw zielen, als degenen die rekenschap moeten geven, opdat zij dit met vreugde mogen doen en niet al zuchtend; want dat is voor u niet nuttig.", "Ps 62:5": "Zij overleggen slechts om hem van zijn hoogheid te verstoten; zij hebben behagen in leugen; met hun mond zegenen zij, maar met hun binnenste vloeken zij. Sela.", "Openb 2:3": "En u hebt verdragen, en hebt geduld; en u hebt om Mijn Naam gearbeid, en bent niet moe geworden.", "Ps 35:19-21": "Laat hen zich niet verblijden over mij, die mij om valse oorzaken vijand zijn; laat hen ook niet wenken met de ogen, die mij zonder oorzaak haten. Want zij spreken niet van vrede, maar zij bedenken bedrieglijke zaken tegen de stillen in het land. En zij sperren hun mond wijd open tegen mij; zij zeggen: Ha, ha, ons oog heeft het gezien!", "Matt 10:9": "Verkrijgt u geen goud, geen zilver, geen koperen geld in uw gordels;", "Jak 2:13": "Want een onbarmhartig oordeel zal komen over hem die geen barmhartigheid bewezen heeft; en de barmhartigheid triomfeert over het oordeel.", "Joz 7:12": "Daarom zullen de kinderen van Israël niet kunnen standhouden voor het aangezicht van hun vijanden; zij zullen de rug keren voor het aangezicht van hun vijanden; want zij zijn in de ban. Ik zal voortaan niet meer met u zijn, tenzij u de ban uit uw midden verdelgt.", "Spr 6:19": "een vals getuige, die leugens uitblaast; en wie ruzie zaait tussen broeders.", "Hand 6:5": "En dit voorstel beviel de hele menigte; en zij kozen Stefanus, een man vol van het geloof en van de Heilige Geest, en Filippus, en Prochorus, en Nicanor, en Timon, en Parmenas, en Nicolaus, een proseliet uit Antiochië;", "Rom 13:12-14": "De nacht is voorbijgegaan, en de dag is nabij gekomen. Laten wij dan de werken van de duisternis afleggen, en de wapens van het licht aandoen. Laten wij, als bij daglicht, eerbaar wandelen; niet in bras­partijen en dronkenschappen, niet in ontucht en losbandigheid, niet in twist en jaloezie; Maar doe de Heere Jezus Christus aan, en verzorg het vlees niet met het oog op begeerten.", "Mal 2:9": "Daarom heb Ik u ook verachtelijk en onwaard gemaakt voor heel het volk, omdat u Mijn wegen niet houdt, maar partijdig bent in de wet.", "Tit 1:7-16": "Want een opziener moet onberispelijk zijn, als een huisverzorger van God, niet eigenzinnig, niet gauw driftig, niet verzot op wijn, geen vechter, niet uit op oneerlijke winst; maar iemand die graag herbergt, die de goeden liefheeft, bezonnen, rechtvaardig, heilig, ingetogen; die vasthoudt aan het betrouwbare woord, zoals hem geleerd is, opdat hij in staat is om zowel te vermanen door de gezonde leer, als om de tegensprekers te weerleggen.", "Rom 15:24": "zal ik, wanneer ik naar Spanje reis, tot u komen; want ik hoop u te zien terwijl ik onderweg ben, en door u daarheen op weg geholpen te worden, als ik eerst voor een deel verzadigd zal zijn van uw gezelschap.", "Jes 29:20": "Wanneer de tiran een einde zal hebben, en het met de spotter voorbij zal zijn, en allen die op ongerechtigheid loeren, uitgeroeid zullen zijn;", "1 Tim 5:18": "Want de Schrift zegt: Een dorsende os zult u niet muilbanden; en: De arbeider is zijn loon waard.", "Mark 9:43": "En als uw hand u doet struikelen, hak hem af; het is beter voor u verminkt het leven in te gaan, dan met twee handen naar de hel te gaan, in het onblusbare vuur;", "Ps 71:18": "Daarom ook, terwijl het ouderdom en de grijsheid daar zijn, verlaat mij niet, o God, totdat ik aan dit geslacht Uw arm verkondig, aan alle nakomelingen Uw macht.", "Deut 9:19": "Want ik vreesde vanwege de toorn en de grimmigheid waarmee de HEERE zeer op u vertoornd was, om u te verdelgen; toch verhoorde de HEERE mij ook op dat moment.", "2 Tess 1:3": "Wij moeten God altijd danken over u, broeders, zoals het behoort, omdat uw geloof zeer meer wordt, en de liefde van elk van u allen jegens elkaar overvloedig wordt;", "Deut 29:4": "Maar de HEERE heeft u geen hart gegeven om te verstaan, geen ogen om te zien, en geen oren om te horen, tot op deze dag.", "Jes 6:10": "Maak het hart van dit volk vet, en maak hun oren zwaar, en sluit hun ogen, opdat het niet ziet met zijn ogen, of met zijn oren hoort, of met zijn hart begrijpt, of zich bekeert, en Hij het geneest.", "Matt 18:9": "En als uw oog u doet struikelen, trek het uit en werp het van u weg. Het is beter voor u om met één oog het leven in te gaan, dan met twee ogen in het helse vuur geworpen te worden.", "1 Kon 8:42": "(want zij zullen horen van Uw grote Naam, en van Uw sterke hand, en van Uw uitgestrekte arm) wanneer hij komen en bidden zal in dit huis;", "Ef 1:15": "Daarom ook ik, nadat ik gehoord heb van het geloof in de Heere Jezus, dat onder u is, en de liefde tot al de heiligen,", "Joh 17:23": "Ik in hen, en U in Mij; opdat zij volmaakt zijn tot één, en opdat de wereld erkent dat U Mij gezonden hebt, en hen liefgehad hebt, zoals U Mij liefgehad hebt.", "Joh 4:36": "En wie maait, ontvangt loon, en verzamelt vrucht voor het eeuwige leven; opdat zij zich samen verblijden, zowel wie zaait als wie maait.", "1 Tim 2:9": "Evenzo ook, dat de vrouwen, in eerbaar gewaad, zichzelf sieren met schaamte en ingetogenheid, niet met vlechtingen van het haar, of goud, of parels, of kostbare kleding;", "Hand 19:19": "Velen ook van hen die toverkunsten hadden beoefend, brachten de boeken bijeen en verbrandden ze voor het oog van allen; en zij berekenden de waarde daarvan, en kwamen tot vijftigduizend zilveren penningen.", "Hand 10:22": "En zij zeiden: Cornelius, een hoofdman over honderd, een rechtvaardig man, en godvrezend, en die goede getuigenis heeft van heel het volk van de Joden, is door een Goddelijke openbaring gewaarschuwd door een heilige engel om u te ontbieden in zijn huis, en om woorden van u te horen.", "2 Petr 3:16": "Zoals hij ook in alle brieven doet, wanneer hij daarin over deze dingen spreekt; waarin sommige dingen moeilijk te begrijpen zijn, die de onkundige en onstandvastige mensen verdraaien, zoals ook de andere Schriften, tot hun eigen verderf.", "Ps 20:2-6": "De HEERE verhoort u in de dag van benauwdheid; de Naam van de God van Jakob zet u in een hoog vertrek. Hij zendt uw hulp uit het heiligdom, en ondersteunt u uit Sion. Hij gedenkt al uw spijsoffers, en maakt uw brandoffer tot as. Sela.", "Ps 21:12": "Want zij hebben kwaad tegen U aangelegd; zij hebben een schandelijke daad bedacht, doch zullen niets vermogen.", "Mark 10:29": "En Jezus antwoordde en zei: Voorwaar, Ik zeg u: Er is niemand die huis, of broers, of zusters, of vader, of moeder, of vrouw, of kinderen, of akkers verlaten heeft, omwille van Mij en omwille van het Evangelie,", "Ps 7:15-17": "Zie, hij is zwanger van onrecht, en heeft moeite ontvangen, hij zal leugen baren. Hij heeft een kuil gegraven, en hem uitgegraven, maar hij is gevallen in de groeve, die hij gemaakt heeft. Zijn moeite zal op zijn eigen hoofd terugkeren, en zijn geweld op zijn eigen schedel neerdalen.", "Micha 3:8": "Maar waarlijk, ik ben vol van de kracht van de Geest van de HEERE; en vol van gericht en dapperheid, om Jakob zijn overtreding te verkondigen, en Israël zijn zonde.", "Filem 1:1": "Paulus, een gevangene van Christus Jezus, en Timotheüs, de broeder, aan Filemon, de geliefde, en onze medearbeider,", "Ef 4:12": "Tot de volmaking van de heiligen, tot het werk van de bediening, tot opbouw van het lichaam van Christus;", "Deut 33:24": "En van Aser zei hij: Aser zij gezegend met zonen; hij zij zijn broeders aangenaam, en dope zijn voet in olie.", "1 Tim 4:12": "Laat niemand uw jeugdige leeftijd verachten, maar wees een voorbeeld voor de gelovigen in woord, in levenswandel, in liefde, in geest, in geloof, in reinheid.", "Ps 40:8-11": "Toen zei ik: Zie, ik kom; in de rol van het boek is van mij geschreven. Ik heb lust, o mijn God! om Uw welbehagen te doen; en Uw wet is in het midden van mijn ingewand. Ik verkondig de gerechtigheid in de grote gemeente; zie, mijn lippen bedwing ik niet; HEERE! Gij weet het.", "Luk 11:35": "Kijk dan uit, dat niet het licht dat in u is, duisternis is.", "Klaagl 2:14": "Nun. Uw profeten hebben u ijdelheid en ongerijmdheid gezien, en zij hebben u uw ongerechtigheid niet geopenbaard, om uw gevangenschap af te wenden, maar zij hebben voor u gezien ijdele lasten en uitstotingen.", "Hand 6:2": "En de twaalf riepen de menigte van de discipelen bij zich en zeiden: Het is niet passend dat wij het Woord van God verwaarlozen om de tafels te bedienen.", "Hand 11:30": "En dat deden zij ook, en zonden het naar de oudsten, door de hand van Barnabas en Saulus.", "Matt 20:20-27": "Toen kwam de moeder van de zonen van Zebedeüs met haar zonen naar Hem toe, boog zich voor Hem neer, en vroeg Hem iets. En Hij zei tegen haar: Wat wilt u? Zij zei tegen Hem: Zeg dat deze twee zonen van mij mogen zitten, de een aan Uw rechterhand en de ander aan Uw linkerhand in Uw Koninkrijk. Maar Jezus antwoordde en zei: U weet niet wat u vraagt; kunt u de drinkbeker drinken die Ik drinken zal, en met de doop gedoopt worden waarmee Ik gedoopt word? Zij zeiden tegen Hem: Wij kunnen dat.", "Gal 1:6-8": "Ik verwonder mij dat u zo snel, wijkend van hem die u in de genade van Christus geroepen heeft, overgebracht wordt naar een ander evangelie; terwijl er geen ander is; maar er zijn sommigen die u in verwarring brengen, en het Evangelie van Christus willen verdraaien. Maar al zouden wij, of een engel uit de hemel, u een evangelie verkondigen naast wat wij u verkondigd hebben, laat hij vervloekt zijn.", "Ef 2:21": "op Wie het hele gebouw, bekwaam samengevoegd, opgroeit tot een heilige tempel in de Heere;", "Spr 9:1-5": "De opperste Wijsheid heeft haar huis gebouwd; zij heeft haar zeven pilaren gehouwen. Zij heeft haar slachtvee geslacht. Zij heeft haar wijn gemengd; ook heeft zij haar tafel klaargemaakt. Zij heeft haar dienstmeisjes uitgezonden; zij nodigt uit op de tinnen van de hoogten van de stad:", "2 Kor 13:7": "En ik verlang van God, dat u geen kwaad doet; niet opdat wij beproefd bevonden zouden worden, maar opdat u het goede zou doen, ook al zouden wij als verwerpelijk zijn.", "Ps 59:4": "Want zie, zij leggen mijn ziel lagen; sterken rotten samen tegen mij; zonder mijn overtreding en zonder mijn zonde, o HEERE!", "Ezech 44:8": "En u hebt de wacht van Mijn heilige dingen niet in acht genomen; maar u hebt uzelf enigen tot wachters van Mijn wacht gesteld in Mijn heiligdom.", "Ps 4:3": "U, mannen, hoe lang zal mijn eer tot schande zijn? Hoe lang zult u de ijdelheid liefhebben, de leugen zoeken? Sela.", "Ps 45:2": "Mijn hart geeft een goede rede op; ik spreek mijn gedichten uit van een Koning; mijn tong is een pen van een vaardige schrijver.", "Jer 48:10": "Vervloekt is hij die het werk van de HEERE bedrieglijk doet; ja, vervloekt is hij die zijn zwaard van het bloed onthoudt!", "Spr 10:8": "Wie wijs van hart is, neemt de geboden aan; maar wie dwaas is van lippen, zal ten val komen.", "Tit 3:14": "En laat ook de onzen leren goede werken voor te staan, voor de dingen die nodig zijn, opdat zij niet onvruchtbaar zijn.", "Kol 4:18": "De groet met mijn eigen hand, van Paulus. Denk aan mijn boeien. De genade zij met u. Amen. Geschreven vanuit Rome aan de Kolossenzen door bemiddeling van Tychikus en Onesimus.", "Matt 25:34-46": "Dan zal de Koning zeggen tegen hen die aan Zijn rechterhand zijn: Kom, u gezegenden van Mijn Vader! Beërf het Koninkrijk dat voor u bereid is vanaf de grondlegging van de wereld. Want Ik ben hongerig geweest, en u hebt Mij te eten gegeven; Ik ben dorstig geweest, en u hebt Mij te drinken gegeven; Ik was een vreemdeling, en u hebt Mij een onderkomen gegeven. Ik was naakt, en u hebt Mij gekleed; Ik ben ziek geweest, en u hebt Mij bezocht; Ik was in de gevangenis, en u bent bij Mij gekomen.", "1 Kor 7:17": "Verder, zoals God aan ieder heeft toebedeeld, zoals de Heere ieder geroepen heeft, zo moet hij wandelen; en zo verordent ik het in alle gemeenten.", "Filem 1:10": "Ik vraag u dan voor mijn zoon, aan wie ik in mijn boeien het leven gaf, namelijk Onesimus;", "1 Joh 4:11": "Geliefden, als God ons zo lief heeft gehad, dan zijn ook wij verplicht elkaar lief te hebben.", "1 Kron 17:27": "Nu dan, het heeft U behaagd het huis van Uw knecht te zegenen, zodat het in eeuwigheid voor Uw aangezicht zal zijn; want U, HEERE, hebt het gezegend, en het zal gezegend zijn in eeuwigheid.", "1 Kor 11:33": "Zo dan, mijn broeders, als u samenkomt om te eten, wacht op elkaar.", "Job 15:35": "Zij ontvangen moeite, en baren ijdelheid, en hun buik richt bedrog aan.", "Joh 3:19": "En dit is het oordeel: dat het licht in de wereld gekomen is, en de mensen hebben de duisternis liever gehad dan het licht; want hun werken waren slecht.", "Hand 4:8-13": "Toen zei Petrus, vervuld met de Heilige Geest, tegen hen: Leiders van het volk, en oudsten van Israël! Als wij vandaag ondervraagd worden over de weldaad aan een zieke mens gedaan, waardoor hij gezond geworden is; Laat het u allen bekend zijn, en het hele volk van Israël, dat door de Naam van Jezus Christus, de Nazarener, Die u gekruisigd hebt, Die God uit de doden heeft opgewekt, door Hem, zeg ik, staat deze man hier gezond voor u.", "Luk 6:22": "Zalig bent u, wanneer de mensen u haten, en wanneer zij u buitensluiten, en u smaden, en uw naam als kwaad verwerpen, omwille van de Zoon des mensen.", "Jes 55:12": "Want in blijdschap zult u uittrekken, en met vrede voortgeleid worden; de bergen en heuvelen zullen geschal maken met vrolijk gezang voor uw aangezicht, en alle bomen van het veld zullen de handen samenklappen.", "Deut 17:8-13": "Wanneer een zaak voor het gericht u te zwaar zal zijn, tussen bloed en bloed, tussen rechtszaak en rechtszaak, tussen de ene plaag en de andere plaag, geschillen in uw poorten, dan moet u opstaan en gaan naar de plaats die de HEERE, uw God, zal uitkiezen; En u moet komen bij de Levitische priesters en bij de rechter die er in die dagen is; en u moet vragen, en zij zullen u de rechterlijke uitspraak bekendmaken. En u moet doen naar het bevel van het woord dat zij u bekend zullen maken, vanaf die plaats die de HEERE zal uitkiezen, en u moet erop letten te doen naar alles wat zij u zullen leren.", "Jer 5:21": "Hoor nu dit, dwaas en harteloos volk! die ogen hebben, maar niet zien, die oren hebben, maar niet horen.", "Spr 10:10": "Wie met het oog knipoogt, veroorzaakt smart; en een dwaas van lippen zal ten val komen.", "Luk 19:42": "en zei: Och, had u ook maar geweten, ook nog op deze dag van u, wat tot uw vrede dient! Maar nu is het verborgen voor uw ogen.", "Joh 4:22": "U aanbidt wat u niet weet; wij aanbidden wat wij weten; want de zaligheid is uit de Joden.", "Spr 26:27": "Wie een kuil graaft, zal erin vallen, en wie een steen wentelt, op hem zal die terugkeren.", "1 Tess 3:11": "Moge nu onze God en Vader Zelf, en onze Heere Jezus Christus, onze weg naar u richten.", "Deut 18:13": "Oprecht zult u zijn met de HEERE, uw God.", "Hab 1:2-4": "HEERE! Hoe lang schreeuw ik, en U hoort niet, hoe lang roep ik: Geweld! tot U, en U verlost niet! Waarom laat U mij ongerechtigheid zien, en aanschouwt U de kwelling? Want verwoesting en geweld is tegen mij, en er is twist, en men neemt gekijf op. Daarom wordt de wet losgelaten, en het recht komt nooit meer voort; want de goddeloze omringt de rechtvaardige; daarom komt het recht verdraaid voort.", "Zach 11:17": "Wee de nietige herder, die de kudde verlaat! Het zwaard zal over zijn arm zijn, en over zijn rechteroog; zijn arm zal helemaal verdorren, en zijn rechteroog zal helemaal donker worden.", "Joh 12:38-41": "Opdat het woord van Jesaja, de profeet, vervuld werd, dat hij gesproken heeft: Heere, wie heeft onze prediking geloofd, en aan wie is de arm van de Heere geopenbaard? Daarom konden zij niet geloven, omdat Jesaja opnieuw gezegd heeft: Hij heeft hun ogen verblind, en hun hart verhard; opdat zij met de ogen niet zien, en met het hart niet verstaan, en zij zich bekeren, en Ik hen genees.", "Spr 24:29": "Zeg niet: Zoals hij mij gedaan heeft, zo zal ik hem doen; ik zal ieder vergelden naar zijn werk.", "Jer 23:2": "Daarom zegt de HEERE, de God van Israël, zo van de herders, die Mijn volk weiden: U hebt Mijn schapen verstrooid, en hebt ze verdreven, en hebt niet naar hen omgezien; zie, Ik zal over u de boosheid van uw handelingen bezoeken, spreekt de HEERE.", "Rom 6:19-22": "Ik spreek op menselijke wijze, vanwege de zwakheid van uw vlees; want zoals u uw leden gesteld hebt om dienstbaar te zijn aan de onreinheid en de ongerechtigheid, tot ongerechtigheid, zo stel nu uw leden om dienstbaar te zijn aan de gerechtigheid, tot heiliging. Want toen u dienstknechten was van de zonde, was u vrij van de gerechtigheid. Wat voor vrucht had u toen van die dingen waarover u zich nu schaamt? Want het einde daarvan is de dood.", "Jer 1:17-19": "U dan, omgord uw lendenen, en maak u op, en spreek tot hen alles wat Ik u gebieden zal; wees niet verslagen voor hun aangezicht, opdat Ik u niet versla voor hun aangezicht. Want zie, Ik stel u vandaag tot een vaste stad, en tot een ijzeren pilaar, en tot koperen muren tegen het hele land; tegen de koningen van Juda, tegen haar vorsten, tegen haar priesters, en tegen het volk van het land. En zij zullen tegen u strijden, maar tegen u niets vermogen; want Ik ben met u, spreekt de HEERE, om u eruit te helpen.", "Jes 8:1": "Verder zei de HEERE tegen mij: Neem u een grote rol, en schrijf daarop met een gewone schrijfstift: Haastende tot de roof, is hij spoedig tot de buit!", "Ps 94:8": "Let op, u onverstandigen onder het volk! En u dwazen! Wanneer zult u verstandig worden?", "Rom 12:2": "En word niet gelijkvormig aan deze wereld, maar word veranderd door de vernieuwing van uw gemoed, opdat u mag beproeven wat de goede, welbehaaglijke en volmaakte wil van God is.", "Matt 24:24": "Want er zullen valse christussen en valse profeten opstaan, en zij zullen grote tekenen en wonderen doen, zodat zij, als het mogelijk was, ook de uitverkorenen zouden misleiden.", "Dan 10:3": "Smakelijk voedsel at ik niet, en vlees of wijn kwam niet in mijn mond; ook zalfde ik mij helemaal niet, totdat die drie volle weken vervuld waren.", "Ezech 22:28": "Haar profeten nu pleisteren hen met loze kalk; zij zien ijdelheid en voorzeggen hun leugen, en zeggen: Zo zegt de Heere HEERE! terwijl de HEERE niet gesproken heeft.", "Luk 9:57-60": "En het gebeurde onderweg, terwijl zij reisden, dat iemand tegen Hem zei: Heere, ik zal U volgen waar U ook heengaat. En Jezus zei tegen hem: De vossen hebben holen, en de vogels onder de hemel nesten; maar de Zoon des mensen heeft geen plaats om het hoofd neer te leggen. En Hij zei tegen een ander: Volg Mij. Maar hij zei: Heere, sta mij toe dat ik eerst wegga om mijn vader te begraven.", "Hand 8:35": "En Filippus deed zijn mond open en begon vanaf datzelfde Schriftgedeelte, en verkondigde hem Jezus.", "2 Kor 2:17": "Want wij verkopen niet, zoals velen, het Woord van God, maar wij spreken het in Christus als uit oprechtheid, als uit God, in de tegenwoordigheid van God.", "Joh 12:35": "Jezus dan zei tegen hen: Nog een korte tijd is het Licht bij u; wandel zolang u het Licht hebt, opdat de duisternis u niet overvalt. En wie in de duisternis wandelt, weet niet waar hij heengaat.", "Ps 14:1": "Een psalm van David, voor de koorleider. De dwaas zegt in zijn hart: Er is geen God. Zij verderven het, zij maken het gruwelijk met hun werk; er is niemand die goed doet.", "1 Kor 9:12": "Als anderen deze macht over u deelachtig zijn, waarom wij dan niet veel meer? Toch hebben wij deze macht niet gebruikt, maar wij verdragen alles, opdat wij geen enkele verhindering geven aan het Evangelie van Christus.", "1 Joh 3:13-15": "Verwonder u niet, mijn broeders, als de wereld u haat. Wij weten dat wij overgegaan zijn uit de dood in het leven, omdat wij de broeders liefhebben; wie zijn broeder niet liefheeft, blijft in de dood. Ieder die zijn broeder haat, is een moordenaar; en u weet dat geen moordenaar het eeuwige leven in zich heeft blijven.", "Ps 22:8": "Allen die mij zien, bespotten mij; zij steken de lip uit, zij schudden het hoofd en zeggen:", "Ps 119:11": "Ik heb Uw rede in mijn hart verborgen, opdat ik tegen U niet zondigen zou.", "Ps 28:9": "Verlos Uw volk, en zegen Uw erfdeel, en weid hen, en verhef hen tot in eeuwigheid.", "Joh 17:25": "Rechtvaardige Vader, de wereld heeft U niet gekend; maar Ik heb U gekend, en dezen hebben erkend dat U Mij gezonden hebt.", "Fil 2:22": "En u kent zijn beproefdheid, dat hij, zoals een kind zijn vader dient, met mij gediend heeft in het Evangelie.", "Gal 6:8": "Want die in zijn eigen vlees zaait, zal uit het vlees verderf maaien; maar die in de Geest zaait, zal uit de Geest het eeuwige leven maaien.", "Deut 9:18": "En ik wierp mij neer voor het aangezicht van de HEERE, zoals de eerste keer, veertig dagen en veertig nachten; ik at geen brood, en dronk geen water; om al uw zonde, die u had gezondigd door te doen wat kwaad is in de ogen van de HEERE, om Hem tot toorn te verwekken.", "Spr 13:6": "De gerechtigheid bewaart de oprechte op de weg; maar de goddeloosheid zal de zondaar omkeren.", "Spr 20:22": "Zeg niet: Ik zal het kwaad vergelden; wacht op de HEERE, en Hij zal u verlossen.", "Joh 15:8": "Hierin is Mijn Vader verheerlijkt, dat u veel vrucht draagt; en u zult Mijn discipelen zijn.", "Joh 1:48": "Jezus zag Nathanaël naar Zich toe komen, en zei van hem: Zie, waarlijk een Israëliet, in wie geen bedrog is.", "Fil 2:16": "Doordat u vasthoudt aan het woord van het leven, mij tot een roem tegen de dag van Christus, dat ik niet tevergeefs gelopen heb, en ook niet tevergeefs gearbeid heb.", "1 Kor 3:5-9": "Wie is dan Paulus, en wie is Apollos, anders dan dienaars, door wie u geloofd hebt, en dat, zoals de Heere aan ieder gegeven heeft? Ik heb geplant, Apollos heeft nat gemaakt; maar God heeft de groei gegeven. Zo is dan noch hij die plant iets, noch hij die nat maakt, maar God, Die de groei geeft.", "Gen 22:1-12": "Het gebeurde na deze dingen dat God Abraham beproefde; en Hij zei tegen hem: Abraham! En hij zei: Zie, hier ben ik! En Hij zei: Neem toch uw zoon, uw enige, die u liefhebt, Izak, en ga naar het land Moria, en offer hem daar tot een brandoffer, op een van de bergen die Ik u zeggen zal. Toen stond Abraham 's morgens vroeg op, en zadelde zijn ezel, en nam twee van zijn knechten met zich, en Izak zijn zoon; en hij kloofde hout voor het brandoffer, en maakte zich op, en ging naar de plaats die God hem gezegd had.", "1 Joh 2:26": "Dit heb ik u geschreven over hen, die u verleiden.", "1 Tess 3:13": "opdat Hij uw harten versterkt, om onberispelijk te zijn in heiligmaking, voor onze God en Vader, bij de komst van onze Heere Jezus Christus met al Zijn heiligen.", "Matt 8:19-22": "En er kwam een schriftgeleerde naar Hem toe, die tegen Hem zei: Meester, ik zal U volgen, waar U ook heengaat. En Jezus zei tegen hem: De vossen hebben holen, en de vogels van de hemel nesten; maar de Zoon des mensen heeft niets waar Hij het hoofd kan neerleggen. En een ander van Zijn discipelen zei tegen Hem: Heere, laat mij toe dat ik eerst heenga en mijn vader kan begraven.", "Gal 5:22": "Maar de vrucht van de Geest is liefde, blijdschap, vrede, geduld, vriendelijkheid, goedheid, geloof, zachtmoedigheid, zelfbeheersing.", "Jes 43:27": "Uw eerste vader heeft gezondigd, en uw uitleggers hebben tegen Mij overtreden.", "Matt 24:48-51": "Maar als die slechte dienstknecht in zijn hart zou zeggen: Mijn heer blijft nog lang weg, en zou beginnen zijn mededienstknechten te slaan, en te eten en te drinken met de dronkaards, dan zal de heer van die dienstknecht komen op een dag waarop hij hem niet verwacht, en op een uur dat hij niet weet;", "Ps 95:10": "Veertig jaren heb Ik verdriet gehad aan dit geslacht, en heb gezegd: Zij zijn een volk dat dwaalt van hart, en zij kennen Mijn wegen niet.", "1 Tess 5:22": "Onthoud u van elke schijn van het kwaad.", "2 Petr 1:9": "Want bij wie deze dingen niet aanwezig zijn, die is blind, kan niet ver zien, en is vergeten dat hij gereinigd is van zijn vroegere zonden.", "Ef 4:32": "Maar wees jegens elkaar goedertieren, barmhartig, en vergeef elkaar, zoals ook God in Christus u vergeven heeft.", "1 Petr 2:11-16": "Geliefden, ik roep u dringend op, als inwoners en vreemdelingen, dat u zich onthoudt van de vleselijke begeerten, die strijd voeren tegen de ziel; En houd uw levenswandel eerlijk onder de heidenen; opdat, waar zij nu kwaad van u spreken als van kwaaddoeners, zij door de goede werken die zij van u zien, God mogen verheerlijken op de dag dat Hij naar hen omziet. Wees dan onderdanig aan alle menselijke instelling, om de Heere; hetzij aan de koning, als hebbende het hoogste gezag;", "Jes 26:9": "Met mijn ziel heb ik U begeerd in de nacht, ook zal ik met mijn geest, die in mijn binnenste is, U vroeg zoeken; want wanneer Uw oordelen op de aarde zijn, leren de inwoners van de wereld gerechtigheid.", "2 Kor 4:5": "Want wij prediken niet onszelf, maar Christus Jezus, de Heere; en onszelf als uw dienaars, om Jezus' wil.", "1 Tim 6:12": "Strijd de goede strijd van het geloof, grijp naar het eeuwige leven, waartoe u ook geroepen bent en waarvoor u de goede belijdenis afgelegd hebt voor veel getuigen.", "Hand 11:26": "en toen hij hem gevonden had, bracht hij hem naar Antiochië. En het gebeurde dat zij een heel jaar samenkwamen in de gemeente en een grote menigte onderwezen; en dat de discipelen voor het eerst in Antiochië Christenen genoemd werden.", "Hebr 13:9": "Laat u niet meeslepen door allerlei vreemde leringen; want het is goed dat het hart gesterkt wordt door genade, niet door spijzen, waarmee zij die daarin gewandeld hebben, geen nuttigheid hebben verkregen.", "Ps 62:4": "Hoelang zult u kwaad aanstichten tegen een man? U zult allen gedood worden; u zult zijn als een ingebogen wand, een aangestoten muur.", "2 Kor 5:9": "Daarom stellen wij er ook alles aan, hetzij wij thuis zijn, hetzij afwezig, om Hem welgevallig te zijn.", "2 Kor 7:11": "Want zie, ditzelfde, dat u naar God bedroefd bent geworden, hoe grote naarstigheid heeft dat in u gewerkt? Ja, verantwoording, ja, onlust, ja, vrees, ja, verlangen, ja, ijver, ja, wraak; in alles hebt u uzelf bewezen rein te zijn in deze zaak.", "Hand 16:4": "En terwijl zij de steden doorreisden, gaven zij hun de verordeningen door die door de apostelen en de oudsten in Jeruzalem waren vastgesteld, om die te onderhouden.", "Matt 5:6": "Zalig zijn zij die hongeren en dorsten naar de gerechtigheid, want zij zullen verzadigd worden.", "Tit 2:11": "Want de genade van God die zaligmakend is, is verschenen aan alle mensen.", "Gen 3:15": "En Ik zal vijandschap zetten tussen u en de vrouw, en tussen uw nageslacht en haar Nageslacht; Dat zal u de kop vermorzelen, en u zult Het de hiel vermorzelen.", "Gal 2:10": "alleen dat wij de armen zouden gedenken; wat ik ook ijverig gedaan heb.", "Ezech 25:15": "Zo zegt de Heere HEERE: Omdat de Filistijnen uit wraak gehandeld hebben, en van harte wraak geoefend hebben door plundering, om te vernielen vanuit een eeuwige vijandschap;", "Rom 2:4": "Of veracht u de rijkdom van Zijn goedertierenheid, en verdraagzaamheid, en geduld, zonder te weten dat de goedertierenheid van God u tot bekering leidt?", "Spr 19:2": "Ook is het niet goed als de ziel zonder kennis is; en die met de voeten haastig is, zondigt.", "Jes 1:16": "Was u, reinig u, doe de boosheid van uw handelingen van voor Mijn ogen weg, houd op met kwaad te doen.", "2 Kor 3:3": "omdat u openbaar geworden bent als een brief van Christus, door onze bediening opgesteld, geschreven niet met inkt, maar door de Geest van de levende God, niet op stenen tafels, maar op tafels van vlees, van het hart.", "Kol 3:5-10": "Dood dan uw leden die op de aarde zijn: hoererij, onreinheid, schandelijke beweging, kwade begeerlijkheid, en de hebzucht, die afgodendienst is. Om deze dingen komt de toorn van God over de kinderen van de ongehoorzaamheid. Daarin hebt ook u eertijds gewandeld, toen u daarin leefde.", "Jes 29:21": "die een mens schuldig maken om een woord, en die strikken leggen voor hem die bestraft in de poort; en die de rechtvaardige verdrijven met valse argumenten.", "Joh 9:29-39": "Wij weten dat God tot Mozes gesproken heeft; maar van Deze weten wij niet vanwaar Hij is. De man antwoordde en zei tegen hen: Hierin zit toch iets wonderlijks, dat u niet weet vanwaar Hij is, en Hij heeft toch mijn ogen geopend. En wij weten dat God de zondaars niet hoort; maar als iemand godvruchtig is en Zijn wil doet, die hoort Hij.", "Fil 4:10-18": "En ik ben zeer verblijd geweest in de Heere, dat u nu eindelijk opnieuw bent opgebloeid om aan mij te denken; waaraan u ook gedacht hebt, maar u hebt de gelegenheid niet gehad. Niet dat ik dit zeg vanwege gebrek; want ik heb geleerd tevreden te zijn in de omstandigheden waarin ik ben. En ik weet vernederd te worden, ik weet ook overvloed te hebben; in alle opzichten en in alles ben ik ingewijd, zowel verzadigd te zijn als honger te lijden, zowel overvloed te hebben als gebrek te lijden.", "Rom 2:29": "Maar die is een Jood, die het in het verborgen is, en de besnijdenis van het hart, in de geest, niet in de letter, dat is de besnijdenis; wiens lof niet is uit de mensen, maar uit God.", "1 Kor 16:11": "Laat hem dan niemand verachten, maar helpt hem op weg in vrede, opdat hij tot mij komt; want ik verwacht hem met de broeders.", "Tit 3:11": "Wetend dat zo iemand verkeerd is, en zondigt, terwijl hij zichzelf veroordeelt.", "Joh 9:34": "Zij antwoordden en zeiden tegen hem: U bent helemaal in zonden geboren, en u leert ons? En zij wierpen hem eruit.", "1 Petr 4:1-16": "Omdat Christus dan voor ons in het vlees geleden heeft, wapent u zich ook met dezelfde gedachte, namelijk dat wie in het vlees geleden heeft, opgehouden heeft met de zonde; om niet meer naar de begeerten van de mensen, maar naar de wil van God de tijd te leven die nog over is in het vlees. Want het is ons genoeg dat wij in de voorgaande tijd van ons leven de wil van de heidenen volbracht hebben, en geleefd hebben in losbandigheid, begeerten, dronkenschap, zwelgpartijen, drinkgelagen en gruwelijke afgoderij;", "Fil 1:4": "(In elk gebed van mij voor u allen doe ik dat gebed altijd met blijdschap)", "1 Joh 2:24": "Wat u dan vanaf het begin gehoord hebt, laat dat in u blijven. Als in u blijft, wat u vanaf het begin gehoord hebt, dan zult u ook in de Zoon en in de Vader blijven.", "Hand 13:1": "In Antiochië waren, in de gemeente die daar was, enkele profeten en leraars, namelijk Barnabas, en Simeon, genaamd Niger, en Lucius van Cyrene, en Manahen, die met Herodes de viervorst opgevoed was, en Saulus.", "Ps 10:6": "Hij zegt in zijn hart: Ik zal niet wankelen; want ik zal van geslacht tot geslacht in geen kwaad zijn.", "Mark 6:52": "Want zij hadden het wonder van de broden niet begrepen; want hun hart was verhard.", "Rom 16:11": "Groet Herodion, die van mijn verwantschap is. Groet hen, die van het huisgezin van Narcissus zijn, degenen namelijk, die in de Heere zijn.", "Micha 6:8": "Hij heeft u bekendgemaakt, o mens, wat goed is; en wat eist de HEERE van u, dan recht te doen, en weldadigheid lief te hebben, en ootmoedig te wandelen met uw God?", "Joh 12:25": "Wie zijn leven liefheeft, zal het verliezen; en wie zijn leven haat in deze wereld, zal het bewaren tot het eeuwige leven.", "1 Kor 1:20": "Waar is de wijze? Waar is de schriftgeleerde? Waar is de onderzoeker van deze eeuw? Heeft God de wijsheid van deze wereld niet dwaas gemaakt?", "Lev 19:18": "U zult niet wreken, noch toorn koesteren tegen de kinderen van uw volk; maar u zult uw naaste liefhebben als uzelf; Ik ben de HEERE!", "1 Joh 4:20": "Als iemand zegt: Ik heb God lief, en haat zijn broeder, die is een leugenaar; want die zijn broeder niet liefheeft, die hij gezien heeft, hoe kan hij God liefhebben, Die hij niet gezien heeft?", "Openb 3:18": "Ik raad u aan dat u van Mij goud koopt, gelouterd door het vuur, opdat u rijk mag worden; en witte kleren, opdat u bekleed mag worden, en de schande van uw naaktheid niet openbaar wordt; en zalf uw ogen met ogenzalf, opdat u zien kunt.", "Spr 11:6": "De gerechtigheid van de vromen zal hen redden; maar de trouwelozen worden gevangen in hun eigen verkeerdheid.", "Filem 1:24": "Markus, Aristarchus, Demas, Lukas, mijn medearbeiders.", "1 Joh 4:5": "Zij zijn uit de wereld; daarom spreken zij uit de wereld, en de wereld hoort hen.", "Ex 32:31": "Zo keerde Mozes terug tot de HEERE, en zei: Och, dit volk heeft een grote zonde gezondigd, doordat zij zich gouden goden gemaakt hebben.", "Gal 5:19-21": "De werken van het vlees nu zijn openbaar; dat zijn: overspel, hoererij, onreinheid, losbandigheid, Afgoderij, toverij, vijandschappen, ruzies, jaloersheden, toorn, twisten, verdeeldheid, afwijkingen in de leer, Afgunst, moord, dronkenschappen, uitspattingen, en dergelijke; waarvan ik u van tevoren zeg, zoals ik ook eerder gezegd heb, dat wie zulke dingen doen, het Koninkrijk van God niet zullen beërven.", "2 Kor 8:1-5": "Verder maken wij u bekend, broeders, de genade van God, die in de gemeenten van Macedonië gegeven is. Dat in veel beproeving van de verdrukking de overvloed van hun blijdschap, en hun zeer diepe armoede overvloedig geweest is tot de rijkdom van hun goeddadigheid. Want zij zijn naar vermogen (ik betuig het), ja, boven vermogen gewillig geweest;", "Rom 1:29-32": "vervuld met alle ongerechtigheid, hoererij, boosheid, hebzucht, kwaadaardigheid; vol afgunst, moord, twist, bedrog, kwaadwilligheid; kwaadsprekers, lasteraars, haters van God, smaders, hoogmoedigen, laatdunkende, vinders van kwade dingen, ongehoorzaam aan hun ouders; onverstandigen, verbondbrekers, zonder natuurlijke liefde, onverzoenlijken, onbarmhartigen;", "Tit 1:10-14": "Want er zijn ook veel ongeregelde mensen, mensen die zinloze praat verkondigen en misleiden, vooral zij die uit de besnijdenis zijn; hun moet men de mond snoeren, want zij brengen hele huizen in verwarring, en leren wat niet behoort, om het schandelijke gewin. Iemand uit hen, hun eigen profeet, heeft gezegd: De Kretenzers zijn altijd leugenachtig, kwade beesten, luie buiken.", "Gal 2:17": "Maar als wij, die in Christus zoeken gerechtvaardigd te worden, ook zelf zondaars blijken te zijn, is Christus dan een dienaar van de zonde? Dat zij verre.", "Kol 1:4-6": "sinds wij van uw geloof in Christus Jezus gehoord hebben, en van de liefde die u hebt tot alle heiligen. Vanwege de hoop die voor u weggelegd is in de hemelen, waarvan u eerder gehoord hebt door het Woord van de waarheid, namelijk van het Evangelie; dat tot u gekomen is, zoals ook in de hele wereld, en het brengt vruchten voort, zoals ook onder u, vanaf de dag dat u het gehoord hebt en de genade van God in waarheid hebt leren kennen.", "Ef 5:8-11": "Want u was eertijds duisternis, maar nu bent u licht in de Heere; wandel als kinderen van het licht. (Want de vrucht van de Geest bestaat in alle goedheid, en rechtvaardigheid, en waarheid), terwijl u beproeft wat de Heere welgevallig is.", "1 Tim 5:17-19": "De oudsten die goed leiding geven, moeten dubbele eer waardig geacht worden, vooral wie arbeiden in het Woord en de leer. Want de Schrift zegt: Een dorsende os zult u niet muilbanden; en: De arbeider is zijn loon waard. Neem tegen een ouderling geen beschuldiging aan, dan alleen op grond van twee of drie getuigen.", "Spr 24:17": "Verblijd u niet, als uw vijand valt; en als hij neerstruikelt, laat uw hart zich niet verheugen;", "1 Kor 4:20": "Want het Koninkrijk van God bestaat niet in woorden, maar in kracht.", "Hand 20:29": "Want dit weet ik, dat na mijn vertrek zware wolven onder u zullen komen, die de kudde niet sparen.", "Hand 24:16": "En hierin oefen ik mijzelf, om altijd een onberispelijk geweten te hebben bij God en de mensen.", "Ps 97:10": "U die de HEERE liefhebt: haat het kwade; Hij bewaart de zielen van Zijn gunstgenoten; Hij redt hen uit de hand van de goddelozen.", "Matt 5:16": "Laat uw licht zo schijnen voor de mensen, dat zij uw goede werken mogen zien en uw Vader, Die in de hemelen is, verheerlijken.", "1 Kor 4:16": "Daarom vermaan ik u: wees mijn navolgers.", "Mark 9:33-35": "En Hij kwam in Kapernaüm, en toen Hij in huis was, vroeg Hij hun: Waarover had u het onderweg met elkaar? Maar zij zwegen; want zij hadden onderweg met elkaar getwist over wie de belangrijkste zou zijn. En Hij ging zitten, riep de twaalf, en zei tegen hen: Als iemand de eerste wil zijn, die zal de laatste van allen zijn, en de dienaar van allen.", "Jer 23:14-16": "Maar in de profeten van Jeruzalem zie Ik afschuwelijkheid; zij plegen overspel, en gaan om met valsheid, en sterken de handen van de boosdoeners, zodat zij zich niet bekeren, ieder van zijn boosheid; zij zijn Mij allen als Sodom, en haar inwoners als Gomorra. Daarom zegt de HEERE van de heerscharen van deze profeten zo: Zie, Ik zal hen met alsem spijzigen,
