oet, heeft God niet gezien.","12":"Aan Demetrius wordt door allen goed getuigenis gegeven, en door de waarheid zelf; en wij getuigen ook, en u weet dat onze getuigenis waar is.","13":"Ik had veel te schrijven, maar ik wil u niet schrijven met inkt en pen;","14":"maar ik hoop u spoedig te zien, en dan zullen wij van mond tot mond spreken.","15":"Vrede zij u. De vrienden groeten u. Groet de vrienden bij naam."},"SV":{"1":"De ouderling aan den geliefden Gajus, welken ik in waarheid liefheb.","2":"Geliefde, voor alle dingen wens ik, dat gij welvaart en gezond zijt, gelijk uw ziel welvaart.","3":"Want ik ben zeer verblijd geweest, als de broeders kwamen, en getuigden van uw waarheid, gelijk gij in de waarheid wandelt.","4":"Ik heb geen meerdere blijdschap dan hierin, dat ik hoor, dat mijn kinderen in de waarheid wandelen.","5":"Geliefde, gij doet trouwelijk, in al hetgeen gij doet aan de broederen en aan de vreemdelingen,","6":"Die getuigd hebben van uw liefde, in de tegenwoordigheid der Gemeente; welken indien gij geleide doet, gelijk het Gode waardig is, zo zult gij weldoen.","7":"Want zij zijn voor Zijn Naam uitgegaan, niets nemende van de heidenen.","8":"Wij dan zijn schuldig de zodanigen te ontvangen, opdat wij medearbeiders mogen worden der waarheid.","9":"Ik heb aan de Gemeente geschreven; maar Diotrefes, die onder hen zoekt de eerste te zijn, neemt ons niet aan.","10":"Daarom, indien ik kom, zo zal ik in gedachtenis brengen zijn werken, die hij doet, met boze woorden snaterende tegen ons; en hiermede niet vergenoegd zijnde, zo ontvangt hij zelf de broeders niet, en verhindert degenen, die het willen *doen*, en werpt ze uit de Gemeente.","11":"Geliefde, volgt het kwade niet na, maar het goede. Die goed doet, is uit God; maar die kwaad doet, heeft God niet gezien.","12":"Aan Demetrius wordt getuigenis gegeven van allen, en van de waarheid zelve; en wij getuigen ook, en gij weet, dat onze getuigenis waarachtig is.","13":"Ik had veel te schrijven, maar ik wil u niet schrijven met inkt en pen;","14":"Maar ik hoop u haast te zien, en wij zullen mond tot mond spreken.","15":"Vrede zij u. De vrienden groeten u. Groet de vrienden met name."},"KJV":{"1":"The elder unto the wellbeloved Gaius, whom I love in the truth.","2":"Beloved, I wish above all things that thou mayest prosper and be in health, even as thy soul prospereth.","3":"For I rejoiced greatly, when the brethren came and testified of the truth that is in thee, even as thou walkest in the truth.","4":"I have no greater joy than to hear that my children walk in truth.","5":"Beloved, thou doest faithfully whatsoever thou doest to the brethren, and to strangers;","6":"Which have borne witness of thy charity before the church: whom if thou bring forward on their journey after ➔ a godly sort, thou shalt do well:","7":"Because that for ➔ his name's sake they went forth, taking nothing of the Gentiles.","8":"We therefore ought to receive such, that we might be fellowhelpers to the truth.","9":"I wrote unto the church: but Diotrephes, who loveth to have the preeminence among them, receiveth us not.","10":"Wherefore, if I come, I will remember his deeds which he doeth, prating against us with malicious words: and not content therewith, neither doth ➔ he himself receive the brethren, and forbiddeth them that would, and casteth them out of the church.","11":"Beloved, follow not that which is evil, but that which is good. He that doeth good is of God: but he that doeth evil hath ➔ not seen God.","12":"Demetrius hath good report of all men, and of the truth itself: yea, and we also bear record; and ye know that our record is true.","13":"I had many things to write, but I will not with ink and pen write unto thee:","14":"But I trust I shall ➔ shortly see thee, and we shall speak face to face. Peace be to thee. Our friends salute thee. Greet the friends by name.","15":"But I trust I shall ➔ shortly see thee, and we shall speak face to face. Peace be to thee. Our friends salute thee. Greet the friends by name."}},"tsk":{"1":[{"kopje":"ouderling","refs":["2 Joh 1:1"]},{"kopje":"de geliefde","refs":["Hand 19:29","Hand 20:4","Rom 16:23","1 Kor 1:14"]},{"kopje":"die","refs":["1 Joh 3:18","2 Joh 1:1"]}],"2":[{"kopje":"voor alle dingen","refs":["Jak 5:12","1 Petr 4:8"]},{"kopje":"dat","refs":["Ps 20:2-6","Fil 2:4","Fil 2:27"]},{"kopje":"zoals","refs":["3 Joh 1:3-6","Kol 1:4-6","1 Tess 1:3-10","1 Tess 2:13","1 Tess 2:14","1 Tess 2:19","1 Tess 2:20","1 Tess 3:6-9","2 Tess 1:3","2 Tess 2:13","Filem 1:5-7","2 Petr 1:3-9","2 Petr 3:18","Openb 2:9"]}],"3":[{"kopje":"ik","refs":["3 Joh 1:4","2 Joh 1:4","Fil 1:4","1 Tess 2:19","1 Tess 2:20"]},{"kopje":"toen","refs":["Rom 1:8","Rom 1:9","2 Kor 7:6","2 Kor 7:7","Ef 1:15","Ef 1:16","Kol 1:7","Kol 1:8","1 Tess 3:6-9"]},{"kopje":"de waarheid","refs":["2 Joh 1:2","2 Joh 1:4","Ps 119:11"]}],"4":[{"kopje":"heb","refs":["Spr 23:24"]},{"kopje":"dat","refs":["Jes 8:18","1 Kor 4:15","Gal 4:19","Filem 1:10"]},{"kopje":"wandelen","refs":["1 Kon 2:4","1 Kon 3:6","2 Kon 20:3","Ps 26:1-3","Jes 38:3","Joh 12:35","Joh 12:36","Gal 2:14"]}],"6":[{"kopje":"getuigd hebben voor de gemeente","refs":["3 Joh 1:12","Filem 1:5-7"]},{"kopje":"hen","refs":["Hand 15:3","Hand 21:5","Rom 15:24","2 Kor 1:16","Tit 3:13"]},{"kopje":"zoals God waardig is","refs":["1 Tess 2:12"]},{"kopje":"goed doen","refs":["Gen 4:7","Jona 4:4","Matt 25:21-23","Hand 15:29","Fil 4:14","1 Petr 2:20"]}],"7":[{"kopje":"zij","refs":["Hand 8:4","Hand 9:16","2 Kor 4:5","Kol 1:24","Openb 2:3"]},{"kopje":"aan te nemen","refs":["2 Kon 5:15","2 Kon 5:16","2 Kon 5:20-27","1 Kor 9:12-15","1 Kor 9:18","2 Kor 11:7-9","2 Kor 12:13"]}],"8":[{"kopje":"te ontvangen","refs":["3 Joh 1:10","Matt 10:14","Matt 10:40","Luk 11:7","2 Kor 7:2","2 Kor 7:3"]},{"kopje":"medearbeiders","refs":["1 Kor 3:5-9","1 Kor 16:10","1 Kor 16:11","2 Kor 6:1","2 Kor 8:23","Fil 4:3","Kol 4:11","1 Tess 3:2","Filem 1:2","Filem 1:24"]}],"9":[{"kopje":"die onder hen de eerste wil zijn","refs":["Matt 20:20-28","Matt 2 wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G2249\">we</span> also bear <span class=\"wl wl-kjv\" data-code=\"G3140\">record;</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> ye <span class=\"wl wl-kjv\" data-code=\"G1492\">know</span> <span class=\"wl wl-kjv\" data-code=\"G3754\">that</span> <span class=\"wl wl-kjv\" data-code=\"G2257\">our</span> <span class=\"wl wl-kjv\" data-code=\"G3141\">record</span> <span class=\"wl wl-kjv\" data-code=\"G2076\">is</span> <span class=\"wl wl-kjv\" data-code=\"G227\">true.</span>","13":"I <span class=\"wl wl-kjv\" data-code=\"G2192\">had</span> many <span class=\"wl wl-kjv\" data-code=\"G4183\">things</span> to <span class=\"wl wl-kjv\" data-code=\"G1125\">write,</span> <span class=\"wl wl-kjv\" data-code=\"G235\">but</span> I <span class=\"wl wl-kjv\" data-code=\"G2309\">will</span> <span class=\"wl wl-kjv\" data-code=\"G3756\">not</span> <span class=\"wl wl-kjv\" data-code=\"G1223\">with</span> <span class=\"wl wl-kjv\" data-code=\"G3188\">ink</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G2563\">pen</span> <span class=\"wl wl-kjv\" data-code=\"G1125\">write</span> unto <span class=\"wl wl-kjv\" data-code=\"G4671\">thee:</span>","14":"<span class=\"wl wl-kjv\" data-code=\"G1161\">But</span> I <span class=\"wl wl-kjv\" data-code=\"G1679\">trust</span> I <span class=\"wl wl-kjv\" data-code=\"G1492\">shall</span> ➔ <span class=\"wl wl-kjv\" data-code=\"G2112\">shortly</span> <span class=\"wl wl-kjv\" data-code=\"G1492\">see</span> <span class=\"wl wl-kjv\" data-code=\"G4571\">thee,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> we shall <span class=\"wl wl-kjv\" data-code=\"G2980\">speak</span> <span class=\"wl wl-kjv\" data-code=\"G4750\">face</span> <span class=\"wl wl-kjv\" data-code=\"G4314\">to</span> <span class=\"wl wl-kjv\" data-code=\"G4750\">face.</span> <span class=\"wl wl-kjv\" data-code=\"G1515\">Peace</span> be to <span class=\"wl wl-kjv\" data-code=\"G4671\">thee.</span> Our <span class=\"wl wl-kjv\" data-code=\"G5384\">friends</span> <span class=\"wl wl-kjv\" data-code=\"G782\">salute</span> <span class=\"wl wl-kjv\" data-code=\"G4571\">thee.</span> <span class=\"wl wl-kjv\" data-code=\"G782\">Greet</span> the <span class=\"wl wl-kjv\" data-code=\"G5384\">friends</span> <span class=\"wl wl-kjv\" data-code=\"G2596\">by</span> <span class=\"wl wl-kjv\" data-code=\"G3686\">name.</span>","15":"<span class=\"wl wl-kjv\" data-code=\"G1161\">But</span> I <span class=\"wl wl-kjv\" data-code=\"G1679\">trust</span> I <span class=\"wl wl-kjv\" data-code=\"G1492\">shall</span> ➔ <span class=\"wl wl-kjv\" data-code=\"G2112\">shortly</span> <span class=\"wl wl-kjv\" data-code=\"G1492\">see</span> <span class=\"wl wl-kjv\" data-code=\"G4571\">thee,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> we shall <span class=\"wl wl-kjv\" data-code=\"G2980\">speak</span> <span class=\"wl wl-kjv\" data-code=\"G4750\">face</span> <span class=\"wl wl-kjv\" data-code=\"G4314\">to</span> <span class=\"wl wl-kjv\" data-code=\"G4750\">face.</span> <span class=\"wl wl-kjv\" data-code=\"G1515\">Peace</span> be to <span class=\"wl wl-kjv\" data-code=\"G4671\">thee.</span> Our <span class=\"wl wl-kjv\" data-code=\"G5384\">friends</span> <span class=\"wl wl-kjv\" data-code=\"G782\">salute</span> <span class=\"wl wl-kjv\" data-code=\"G4571\">thee.</span> <span class=\"wl wl-kjv\" data-code=\"G782\">Greet</span> the <span class=\"wl wl-kjv\" data-code=\"G5384\">friends</span> <span class=\"wl wl-kjv\" data-code=\"G2596\">by</span> <span class=\"wl wl-kjv\" data-code=\"G3686\">name.</span>"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"ouderling","tekst":"Waarom Johannes zichzelf zo noemt, zie 2Jo 1:1."},{"catchword":"Gajus,","tekst":"Wie deze Gajus geweest is wordt nergens elders verklaard tenzij hij een van die is geweest waarvan men leest Act 19:29, en Act 20:4; Rom 16:23; 1Co 1:14."},{"catchword":"welken ik in","tekst":"Zie 2Jo 1:1."}],"2":[{"catchword":"voor alle dingen","tekst":"Of in alles."},{"catchword":"gelijk uw ziel welvaart","tekst":"Namelijk daar zij begaafd is met de kennis der zaligmakende en gezonde leer, en met velerlei christelijke deugden; dat, gelijk gij ene gezonde ziel hebt, gij zo ook een gezond lichaam moogt hebben."}],"3":[{"catchword":"waarheid, gelijk","tekst":"Dat is, oprechtheid; 1Jo 3:18."},{"catchword":"in de waarheid wandelt","tekst":"Zie 2Jo 1:4."}],"4":[{"catchword":"mijn kinderen in","tekst":"Dat is, discipelen, die ik door de prediking van het Evangelie heb geboren, gelijk Paulus spreekt van de Corinthiërs, 1Co 4:15."}],"5":[{"catchword":"trouwelijk,","tekst":"Dat is, gelijk een getrouw uitdeler der goederen, die u de Heere daartoe verleend heeft, betaamt. Zie Luk 12:42; 1Co 4:2."},{"catchword":"in al hetgeen","tekst":"Dat is, dat gij hen in uw huis ontvangt, herbergt en onderhoudt."},{"catchword":"de vreemdelingen,","tekst":"Dat is, die behalve dat zij broeders en gelovigen zijn, ook om des Evangelies wil in vreemde landen zich moeten ophouden."}],"6":[{"catchword":"uw liefde,","tekst":"Dat is, uw milddadigheid, die gij uit liefde aan hen betoond hebt."},{"catchword":"in de tegenwoordigheid","tekst":"Dat is, openlijk in de vergadering der gemeente, waarin ik mij nu ophoud; welke vele oude leraars menen geweest te zijn de gemeente van Efeze."},{"catchword":"geleide doet,","tekst":"Dat is, niet alleen hen uitgeleide doet, een eind van den weg met hen gaande, maar hen ook verzorgende van hetgeen hun tot de reis zal nodig zijn. Zie Act 27:3, en Act 28:10."},{"catchword":"gelijk het Gode","tekst":"Grieks Gode waardig. Zie Col 1:10; 1Th 2:12."}],"7":[{"catchword":"voor Zijn Naam","tekst":"Dit kan verstaan worden, òf dat deze broeders uit hun vaderland gegaan zijn in vreemde landen, om daar het Evangelie te prediken onder de heidenen; òf, dat zij om den dienst van God en de belijdenis der christelijke leer, uit hun vaderland hebben moeten gaan en vluchten in vreemde landen. Het eerste is het waarschijnlijkst, naar het volgende vs.8."},{"catchword":"niets nemende","tekst":"Namelijk voor hun dienst, maar voor niet het Evangelie predikende, om geen verhindering te geven aan het Evangelie van Christus, gelijk Paulus ook gedaan heeft; 1Co 9:12."}],"8":[{"catchword":"de zodanigen","tekst":"Namelijk gelijk in het voorgaande vers vs.7 beschreven worden."},{"catchword":"te ontvangen,","tekst":"Namelijk in onze huizen, te herbergen en verzorgen van hun lichamelijke nooddruft."},{"catchword":"medearbeiders mogen","tekst":"Daarmee ook mogen helpen bevorderen de verbreiding der ware leer van het Evangelie."}],"9":[{"catchword":"aan de Gemeente","tekst":"Namelijk waarvan Gajus òf een leraar, òf een voortreffelijk lidmaat was. Wie deze gemeente geweest is, wordt nergens aangewezen."},{"catchword":"geschreven;","tekst":"Namelijk aangaande deze zaak, om deze broeders aan hun aan te bevelen. Hoewel wij dezen brief niet hebben, daaruit kan niet besloten worden, dat er iets zou ontbreken aan de volmaaktheid der heilige Schrift; dewijl het maar een brief is geweest van aanbeveling, en zo er iets in dien brief geschreven is geweest ter zaligheid nodig, dat wordt in andere boeken der heilige Schrift genoeg gevonden; en Johannes zelft getuigt dat zijn Evangelie genoegzaam is, om te geloven en zalig te worden; Joh 20:31."},{"catchword":"zoekt de eerste","tekst":"Dat is, die uit eergierigheid boven zijn medebroeders zich verheffende, tracht om deze te overheersen en al het gezag aan zich alleen te trekken."},{"catchword":"neemt ons niet aan","tekst":"Dat is, acht mij, noch mijn schrijven en voorspreken niet."}],"10":[{"catchword":"indien ik kom,","tekst":"Namelijk tot u, gelijk ik hoop dat haast geschieden zal, vs.14."},{"catchword":"in gedachtenis brengen","tekst":"Dat is, hemzelf voor ogen stellen en de gemeente bekend maken, dat zij het moge weten en bedenken."},{"catchword":"zijn werken, die","tekst":"Namelijk die hij hier beschrijft."},{"catchword":"boze woorden","tekst":"Dat is, lasterlijke."},{"catchword":"snaterende tegen","tekst":"Dat is, beuzelingen voortbrengende."},{"catchword":"ons; en hiermede","tekst":"Dat is, mij, gelijk ook in het voorgaande vers, vs.9."},{"catchword":"de broeders niet,","tekst":"Namelijk die beschreven worden, vs.7."},{"catchword":"verhindert degenen,","tekst":"Of verbiedt."},{"catchword":"die het willen doen,","tekst":"Dat is, die deze broeders willen ontvangen."},{"catchword":"werpt ze uit de Gemeente","tekst":"Namelijk door den kerkelijken ban."}],"11":[{"catchword":"kwade niet na,","tekst":"Dat is, zo in het algemeen allerlei kwaad als in het bijzonder dit kwaad voorbeeld van Diotrefes."},{"catchword":"goed doet, is","tekst":"Dit kan ook verstaan worden zo in het algemeen van allerlei goed als in het bijzonder van het goede der weldadigheid jegens de broeders, dat hij hierin Gajus prijst."},{"catchword":"die kwaad doet,","tekst":"Dat is, die zijn werk maakt van kwaaddoen. Want anderszins doen de wedergeborenen ook soms wel iets dat kwaad is, uit zwakheid."},{"catchword":"niet gezien","tekst":"Namelijk met de ogen van het ware geloof, of Hem niet recht gekend. Zie 1Jo 3:6."}],"12":[{"catchword":"wordt getuigenis","tekst":"Namelijk van bijzondere godzaligheid, liefde en getrouwheid."},{"catchword":"van allen, en","tekst":"Namelijk gelovigen die hem kennen."},{"catchword":"van de waarheid","tekst":"Dat is, deze getuigenis is gans waarachtig, daar hij het ook met de daad en waarheid dagelijks betoont."},{"catchword":"wij getuigen ook,","tekst":"Dat is, ik Johannes; gelijk ook vs.9,10."},{"catchword":"dat onze getuigenis","tekst":"Dat is, dat ik niet placht te getuigen dan wat waarachtig is; Joh 19:35."}],"13":[{"catchword":"veel te schrijven,","tekst":"Namelijk aangaande deze zaken. Zie 2Jo 1:12."}],"14":[{"catchword":"u haast te zien,","tekst":"Dat is, haast bij u te zijn of tot u te komen."},{"catchword":"mond tot mond spreken","tekst":"Zie de aantekeningen 2Jo 1:12."},{"catchword":"Vrede zij u","tekst":"Dit was de gewone wijze van groeten onder de Joden of Hebreën. Zie hiervan Joh 20:19."},{"catchword":"De vrienden","tekst":"Dat is, de gelovigen die hier zijn."},{"catchword":"de vrienden","tekst":"Dat is, de gelovigen die bij u zijn."},{"catchword":"met name.","tekst":"Dat is, elk in het bijzonder."}],"15":[{"catchword":"u haast te zien,","tekst":"Dat is, haast bij u te zijn of tot u te komen."},{"catchword":"mond tot mond spreken","tekst":"Zie de aantekeningen 2Jo 1:12."},{"catchword":"Vrede zij u","tekst":"Dit was de gewone wijze van groeten onder de Joden of Hebreën. Zie hiervan Joh 20:19."},{"catchword":"De vrienden","tekst":"Dat is, de gelovigen die hier zijn."},{"catchword":"de vrienden","tekst":"Dat is, de gelovigen die bij u zijn."},{"catchword":"met name.","tekst":"Dat is, elk in het bijzonder."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"The Elder [Why John so calls himself , see 2 Joh. 1.] to the beloved Gaius, [who this Gaius was, is no where else declared, except he were one of them of whom we read, Acts 19. 29. And 20. 4. Rom. 16. 23. 1 Cor. 1. 14.] whom I love in truth. [See 2 Joh. 1.]"}],"2":[{"catchword":null,"tekst":"Beloved, before all things, [Or in all things] I wish that thou mayest fare well, and be in health, even as thy soul fareth well; [namely, foreasmuch as it is endued with the knowledge of the saving and sound doctrine, and with manifold Christian virtues: that as thou hast an healthful soul, so also mayest have an healthful body.]"}],"3":[{"catchword":null,"tekst":"For I rejoiced greatly, when the Brethren came, and testified of thy truth, [That is, uprightness, 1 John 3. 18. ] even as thou walkest in the truth. [See 2 John ver. 4.]"}],"4":[{"catchword":null,"tekst":"I have no greater joy than in this, that I hear that my children [That is, disciples, which I have begotten by the preaching of the Gospel, as Paul speaketh of the Corinthians, 1 Cor. 4. 15. Walk in the truth."}],"5":[{"catchword":null,"tekst":"Beloved, thou doest faithfully [That is, as it becometh a faithful dispenser of the goods, which the Lord hath afforded thee to this end. See Luke 12. 42. 1 Cor. 4. 2.] in all that thou dost to the brethren, [that is, that thou receives them into thy house, lodgest and sustainest them] and to strangers, [that is, who besides that they are brethren and believers, are also constrained to abide in strange Countries for the Gospel&acirc;&euro;&trade;s sake.]"}],"6":[{"catchword":null,"tekst":"Who have testified of thy love, [That is, thy liberality, which out of love thou hast showed unto them] in the presence of the Church, [that is, openly in the assembly of the Church, where I now remain: which many ancient Teachers think to have been the Church of Ephesus] whom thou if set in the way [that is, not only bring them going by guiding them a part of the way, but also providing them with what they shall need on their journey. See Acts 27. 3. And 28. 10.] as is worthy of God, [Gr. Worthily of God. See Col. 1. 10. 1 Thes. 2. 12.] thou shalt do well."}],"7":[{"catchword":null,"tekst":"For they went forth for his name, [This may be understood two ways, either that these brethren went out of their own Country into strange Lands, to preach the Gospel there among the Gentiles, or that they were constrained to go out of their own Country, and flee into the strange Lands, for the service of God and profession of the Christian doctrine. But the first is most probable out of the following verse] taking nothing of the Gentiles. [Namely, for that service, but Preaching the Gospel for nothing, to bring no hindrance to the Gospel of Christ, as Paul also did, 1 Cor. 9. 12.]"}],"8":[{"catchword":null,"tekst":"We ought therefore to receive such, [Namely, into our houses, to lodge them and provide necessaries for their body: such, namely, as are described in the former verse] that we may be fellow labourers of the truth. [That is, that thereby we may also help to further the spreading abroad of the true doctrine of the Gospel.]"}],"9":[{"catchword":null,"tekst":"I wrote [namely, concerning this business, to recommend these Brethren: although then we have not this Epistle, it cannot be concluded thence, that there wanteth any thing of the perfection of the holy Scripture; seeing it was but an Epistle necessary to salvation, the same is sufficiently found in other books of Scripture, and John himself testifieth, that his Gospel is sufficient for to believe and be saved, John 20. 31.] to the church, [namely, of which Gaius was either a Teacher, or an eminent member. What Church this was, is no where showed] but Diotrephes, who seeketh to be the first among them, [that is, who out of ambition exalting himself his fellow brethren, seeketh after this, to lord it over them, and to draw all the respect to himself alone] receiveth us not. [that is, esteemeth neither me, nor my writing and intercession.]"}],"10":[{"catchword":null,"tekst":"Therefore if I come, [Namely, unto you, as I hope shall shortly come to pass, ver. 14.] I will bring to rememberance [that is, set before his own eyes, and make known to the Church, that they may know and consider for it] his works which he doth, [namely, those which he here sets down] prating [that is, bringing forth false and lying reports] against us [that is, me, as also in the former verse] with evil words: [that is, reproachful] and not being satisfied herewith, he receiveth not the brethren [namely, described above ver. 7.] himself, and hindereth [or forbiddeth] them who would (do) it, [that is, who would receive these brethren] and casteth them out of the Church. [Namely, by excommunication.]"}],"11":[{"catchword":null,"tekst":"Beloved, imitate not that which is evil, [Namely, as well all manner of evil in general, as in special this evil example of Diotrephes] but that which is good: he that doth good [this may also be understood as well in general of all manner of good, as in special of the good of liberality towards the brethren, which he here commendeth in Gaius] is of God, but he that doth evil [that is, he that maketh it his practice to do evil: for otherwise the very regenerate also do eftsoon commit that which is evil, out of infirmity] hath not seen God. [Namely, with the eyes of true faith, or not rightly know him. See 1 John 3. 6.]"}],"12":[{"catchword":null,"tekst":"To Demetrius testimony is given [Namely, of special godliness, love, and fidelity] by all [namely, believers who know him] and by the truth itself; [that is, this testimony is altogether true, seeing he also daily shows the same indeed and in truth] and we also testify, [that is, 1 John, as also ver. 9. 10.] and ye know that our testimony is true. [That is, that I am not wont to testify but that which is true, John 19. 35.]"}],"13":[{"catchword":null,"tekst":"I had much to write, [Namely, concerning these things. See 2 John 12.] but I will not write to thee with ink and pen:"}],"14":[{"catchword":null,"tekst":"But I hope to see thee speedily, [That is, speedily to be with thee, or to come unto thee] and we shall speak mouth to mouth. [See the annot. On 2 John 12.] (1:15) Peace be to thee, [This was the usual manner of salutation among the Jews, or Hebrews. See hereof Joh. 20. 19.] the friends salute thee: [that is, faithful which are here] salute the friends [that is, the faithful which are with thee] by name. [That is, every one in particular.]"}],"15":[{"catchword":null,"tekst":"But I hope to see thee speedily, [That is, speedily to be with thee, or to come unto thee] and we shall speak mouth to mouth. [See the annot. On 2 John 12.] (1:15) Peace be to thee, [This was the usual manner of salutation among the Jews, or Hebrews. See hereof Joh. 20. 19.] the friends salute thee: [that is, faithful which are here] salute the friends [that is, the faithful which are with thee] by name. [That is, every one in particular.]"}]}}};

(function bouwHfdnav() {

function popupVerzenHtml(bron, start, eind) {

  const aantal = Math.min(totaal, 3);

  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }

  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  // dubbele rechtsklik (binnen 500ms, zelfde verwijzing) kopieert het vers
  // i.p.v. de vertalingen-popup te tonen (enkele rechtsklik blijft bestaand gedrag)
  function kopieerVerwijzing(chip, ref) {
    haalVert('versteksten', ref).then(data => {
      const tekst = data && data[ref.vers];
      if (!tekst) return;
      const url = location.origin + '/studiebijbel/' + ref.slug + '/' + ref.hfd + '#v' + ref.vers;
      const kopie = tekst.replace(/\*/g, '') + `\n~ [${chip.textContent}](${url})`;
      navigator.clipboard.writeText(kopie).then(() => {
        toast.classList.add('zichtbaar');
        setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
      });
    });
  }
  let laatsteRechtsklik = { sleutel: null, tijd: 0 };
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    const sleutel = chip.dataset.ref;
    const nu = Date.now();
    const isDubbelklik = laatsteRechtsklik.sleutel === sleutel && (nu - laatsteRechtsklik.tijd) < 500;
    laatsteRechtsklik = isDubbelklik ? { sleutel: null, tijd: 0 } : { sleutel, tijd: nu };
    if (isDubbelklik) {
      popup.style.display = 'none';
      vpopup.style.display = 'none';
      kopieerVerwijzing(chip, ref);
      return;
    }
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
<script src="/studiebijbel/zoekbalk.js"></script></body>
</html>
