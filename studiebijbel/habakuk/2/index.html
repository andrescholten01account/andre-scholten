idenvolken beroofd hebt, zo zullen alle overgebleven volken u beroven; vanwege het bloed van de mensen, en het geweld aan het land, de stad, en alle inwoners daarvan.","9":"Wee hem die met kwade hebzucht rijkdom vergaart voor zijn huis, om zijn nest in de hoogte te zetten, om bevrijd te zijn uit de hand van het kwaad.","10":"U hebt schande beraamd voor uw huis; door veel volken uit te roeien hebt u tegen uw eigen ziel gezondigd.","11":"Want de steen uit de muur roept, en de balk uit het hout antwoordt hem.","12":"Wee hem die de stad met bloed bouwt, en die de stad met onrecht bevestigt!","13":"Zie, is het niet van de HEERE van de heerscharen[1], dat de volken arbeiden voor het vuur, en de mensen zich vermoeien voor niets?","14":"Want de aarde zal vervuld worden met de kennis van de heerlijkheid van de HEERE, zoals het water de bodem van de zee bedekt.","15":"Wee hem die zijn naaste te drinken geeft, u die uw wijnfles daarbij voegt, en hem ook dronken maakt, om hun naaktheid te aanschouwen.","16":"U zult ook verzadigd worden met schande, in plaats van eer; drink ook zelf, en laat uw voorhuid ontbloot worden; de beker van de rechterhand van de HEERE zal zich tot u wenden, en er zal een schandelijk uitbraaksel over uw heerlijkheid zijn.","17":"Want het geweld dat tegen Libanon begaan is, zal u bedekken, en de verwoesting van de dieren zal u verschrikken, vanwege het bloed van de mensen, en het geweld in het land, de stad, en aan alle inwoners daarvan.","18":"Wat zal het gesneden beeld baten, dat zijn maker het gesneden heeft? Of het gegoten beeld, dat een leraar van leugens is, dat de maker op zijn maaksel vertrouwt, wanneer hij stomme afgoden gemaakt heeft?","19":"Wee hem die tegen het hout zegt: Word wakker! en: Ontwaak! tegen de zwijgende steen. Zou die kunnen leren? Zie, het is met goud en zilver overtrokken, en er is helemaal geen geest in het midden ervan.","20":"Maar de HEERE is in Zijn heilige tempel. Zwijg voor Zijn aangezicht, heel de aarde!"},"SV":{"1":"Ik stond op mijn wacht, en ik stelde mij op de sterkte, en ik hield wacht om te zien, wat Hij in mij spreken zou, en wat ik antwoorden zou op mijn bestraffing.","2":"Toen antwoordde mij de HEERE, en zeide: Schrijf het gezicht, en stel het duidelijk op tafelen, opdat daarin leze die voorbijloopt.","3":"Want het gezicht zal nog tot een bestemden tijd zijn, dan zal Hij het op het einde voortbrengen, en niet liegen; zo Hij vertoeft, verbeid Hem, want Hij zal gewisselijk komen, Hij zal niet achterblijven.","4":"Ziet, zijn ziel verheft zich, zij is niet recht in hem; maar de rechtvaardige zal door zijn geloof leven.","5":"En ook dewijl hij trouwelooslijk handelt bij den wijn, een trots man is, en in zijn woning niet blijft; die zijn ziel wijd opendoet als het graf, en gelijk de dood is, die niet zat wordt, en tot zich verzamelt al de heidenen, en vergadert tot zich alle volken.","6":"Zouden *dan* niet al dezelve van hem een spreekwoord opnemen, en een uitlegging der raadselen van hem? En men zal zeggen: Wee dien, die vermeerdert hetgeen het zijne niet is ( hoe lange!), en dien, die op zich laadt dik slijk.","7":"Zullen niet onvoorziens opstaan, die u bijten zullen, en ontwaken, die u zullen bewegen, en zult gij hun niet tot plundering worden?","8":"Omdat gij vele heidenen beroofd hebt, zo zullen alle overgeblevene volken u beroven; om het bloed der mensen, en het geweld aan het land, de stad, en alle inwoners derzelve.","9":"Wee dien, die met kwade gierigheid giert voor zijn huis, opdat hij in de hoogte zijn nest stelle, om bevrijd te zijn uit de hand des kwaads.","10":"Gij hebt schaamte beraadslaagd voor uw huis; uitroeiende vele volken, zo hebt gij gezondigd *tegen* uw ziel.","11":"Want de steen uit den muur roept, en de balk uit het hout antwoordt dien.","12":"Wee dien, die de stad met bloed bouwt, en die de stad met onrecht bevestigt!","13":"Ziet, is het niet van den HEERE der heirscharen, dat de volken arbeiden ten vure, en de lieden zich vermoeien tevergeefs?","14":"Want de aarde zal vervuld worden, dat zij de heerlijkheid des HEEREN bekennen, gelijk de wateren *den* *bodem* *der* zee bedekken.","15":"Wee dien, die zijn naaste te drinken geeft, gij, die uw wijnfles daarbij voegt, en ook dronken maakt, opdat gij hun naaktheden aanschouwt.","16":"Gij zult *ook* verzadigd worden met schande, voor eer; drinkt gij ook, en ontbloot de voorhuid; de beker der rechterhand des HEEREN zal zich tot u wenden, en er zal een schandelijk uitbraaksel over uw heerlijkheid zijn.","17":"Want het geweld, dat tegen Libanon begaan is, zal u bedekken, en de verwoesting der beesten zal ze verschrikken, om des bloeds wil der mensen, en des gewelds in het land, de stad en aan alle inwoners derzelve.","18":"Wat zal het gesneden beeld baten, dat zijn formeerder het gesneden heeft? *of* het gegoten beeld, hetwelk een leugenleraar is, dat de formeerder op zijn formeersel vertrouwt, als hij stomme afgoden gemaakt heeft?","19":"Wee dien, die tot het hout zegt: Word wakker! *en*: Ontwaak! tot den zwijgenden steen. Zou het leren? Ziet, het is *met* goud en zilver overtrokken, en er is gans geen geest in het midden van hetzelve.","20":"Maar de HEERE is in Zijn heiligen tempel. Zwijg voor Zijn aangezicht, gij ganse aarde!"},"KJV":{"1":"I will stand upon my watch, and set me upon the tower, and will watch to see what he will say unto me, and what I shall answer when I am reproved.","2":"And the LORD answered me, and said, Write the vision, and make *it* plain upon tables, that he may run that readeth","3":"For the vision *is* yet for an appointed time, but at the end it shall speak, and not lie: though it tarry, wait for it; because it will surely come, it will not tarry.","4":"Behold, his soul *which* is lifted up is not upright in him: but the just shall live by his faith.","5":"Yea also, because he transgresseth by wine, *he is* a proud man, neither keepeth at home, who enlargeth his desire as hell, and *is* as death, and cannot be satisfied, but gathereth unto him all nations, and heapeth unto him all people:","6":"Shall not all these take up a parable against him, and a taunting proverb against him, and say, Woe to him that increaseth *that which is* not his! how long? and to him that ladeth himself with thick clay!","7":"Shall they not rise up suddenly that shall bite thee, and awake that shall vex thee, and thou shalt be for booties","8":"Because thou hast spoiled many nations, all the remnant of the people shall spoil thee; because of men's blood, and *for* the violence of the land, of the city, and of all that dwell","9":"Woe to him that coveteth an evil covetousness to his house, that he may set his nest on high, that he may be delivered from the power of evil!","10":"Thou hast consulted shame to thy house by cutting off many people, and hast sinned *against* thy soul.","11":"For the stone shall cry out of the wall, and the beam out of the timber shall answer","12":"Woe to him that buildeth a town with blood, and stablisheth a city by iniquity!","13":"Behold, *is it* not of the LORD of hosts that the people shall labour in the very fire, and the people shall weary themselves for very vanity?","14":"For the earth shall be filled with the knowledge of the glory of the LORD, as the waters cover the sea.","15":"Woe unto him that giveth his neighbour drink, that puttest thy bottle to *him*, and makest *him* drunken also, that thou mayest look on their nakedness!","16":"Thou art filled with shame for glory: drink thou also, and let thy foreskin be uncovered: the cup of the LORD'S right hand shall be turned unto thee, and shameful spewing *shall be* on thy glory.","17":"For the violence of Lebanon shall cover thee, and the spoil of beasts, *which* made them afraid, because of men's blood, and for the violence of the land, of the city, and of all that dwell","18":"What profiteth the graven image that the maker thereof hath graven it; the molten image, and a teacher of lies, that the maker of his work trusteth therein, to make dumb idols?","19":"Woe unto him that saith to the wood, Awake; to the dumb stone, Arise, it shall teach! Behold, it *is* laid over with gold and silver, and *there is* no breath at all in the midst","20":"But the LORD *is* in his holy temple: let all the earth keep silence before"}},"tsk":{"1":[{"kopje":"stond","refs":["Ps 73:16","Ps 73:17","Jes 21:8","Jes 21:11","Jes 21:12"]},{"kopje":"vestingmuur","refs":["2 Sam 18:24","2 Kon 9:17","2 Kon 17:9","Jes 21:5","Jes 62:6"]},{"kopje":"en wat","refs":["Hab 1:12-17","Ps 85:9"]},{"kopje":"tot mij","refs":["2 Kor 13:3","Gal 1:16"]},{"kopje":"op mijn bestraffing","refs":["Job 23:5-7","Job 31:35","Job 31:37","Jer 12:1"]}],"2":[{"kopje":"Schrijf","refs":["Deut 27:8","Deut 31:19","Deut 31:22","Jes 8:1","Jes 30:8","Jer 36:2-4","Jer 36:27-32","Dan 12:4","Openb 1:18","Openb 1:19","Openb 14:13","Openb 19:9","Openb 21:5-8"]},{"kopje":"zet","refs":["Joh 11:28","Joh 11:29","1 Kor 14:19","2 Kor 3:12"]}],"3":[{"kopje":"het visioen","refs":["Jer 27:7","Dan 8:19","Dan 9:24-27","Dan 10:1","Dan 10:14","Dan 11:27","Dan 11:35","Hand 1:7","Hand 17:26","Gal 4:2","2 Tess 2:6-8"]},{"kopje":"maar","refs":["Ex 12:41","Ps 102:14","Jer 25:12-14","Hebr 10:36"]},{"kopje":"verwacht","refs":["2 Kon 6:33","Ps 27:14","Ps 130:5","Ps 130:6","Jes 30:18","Klaagl 3:25","Klaagl 3:26","Micha 7:7","Luk 2:25","Jak 5:7","Jak 5:8"]},{"kopje":"het zal zeker","refs":["Luk 18:7","Luk 18:8","2 Petr 2:3"]}],"4":[{"kopje":"zijn","refs":["Job 40:6","Job 40:7","Dan 4:30","Dan 4:37","Dan 5:20-23","Luk 18:14","2 Tess 2:4","1 Petr 5:5"]},{"kopje":"maar","refs":["Joh 3:36","Rom 1:17","Gal 2:16","Gal 3:11","Gal 3:12","Hebr 10:38","1 Joh 5:10-12"]}],"5":[{"kopje":"hij trouweloos handelt","refs":["Spr 20:1","Spr 23:29-33","Spr 31:4","Spr 31:5","Jes 5:11","Jes 5:12","Jes 5:22","Jes 5:23","Jes 21:5","Jer 51:39","Dan 5:1-4","Dan 5:23","Nahum 1:9","Nahum 1:10"]},{"kopje":"een trots man","refs":["Hab 2:4","Ps 138:6","Spr 30:13","Spr 30:14","Jes 2:11","Jes 2:12","Jes 2:17","Jes 16:6","Jer \"H3474\">upright</span> in him: but the <span class=\"wl wl-kjv\" data-code=\"H6662\">just</span> shall <span class=\"wl wl-kjv\" data-code=\"H2421\">live</span> by his faith.","5":"Yea also, because he <span class=\"wl wl-kjv\" data-code=\"H898\">transgresseth</span> by <span class=\"wl wl-kjv\" data-code=\"H3196\">wine,</span> he is a <span class=\"wl wl-kjv\" data-code=\"H3093\">proud</span> <span class=\"wl wl-kjv\" data-code=\"H1397\">man,</span> neither keepeth at <span class=\"wl wl-kjv\" data-code=\"H5115\">home,</span> who <span class=\"wl wl-kjv\" data-code=\"H7337\">enlargeth</span> his <span class=\"wl wl-kjv\" data-code=\"H5315\">desire</span> as <span class=\"wl wl-kjv\" data-code=\"H7585\">hell,</span> and is as <span class=\"wl wl-kjv\" data-code=\"H4194\">death,</span> and cannot be <span class=\"wl wl-kjv\" data-code=\"H7646\">satisfied,</span> but <span class=\"wl wl-kjv\" data-code=\"H622\">gathereth</span> unto him all <span class=\"wl wl-kjv\" data-code=\"H1471\">nations,</span> and <span class=\"wl wl-kjv\" data-code=\"H6908\">heapeth</span> unto him all people:","6":"Shall not all these take <span class=\"wl wl-kjv\" data-code=\"H5375\">up</span> a <span class=\"wl wl-kjv\" data-code=\"H4912\">parable</span> against him, and a <span class=\"wl wl-kjv\" data-code=\"H4426\">taunting</span> <span class=\"wl wl-kjv\" data-code=\"H2420\">proverb</span> against him, and <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> <span class=\"wl wl-kjv\" data-code=\"H1945\">Woe</span> to him that <span class=\"wl wl-kjv\" data-code=\"H7235\">increaseth</span> that which is not his! how long? and to him that <span class=\"wl wl-kjv\" data-code=\"H3513\">ladeth</span> himself with thick clay!","7":"Shall they not rise <span class=\"wl wl-kjv\" data-code=\"H6965\">up</span> <span class=\"wl wl-kjv\" data-code=\"H6621\">suddenly</span> that shall <span class=\"wl wl-kjv\" data-code=\"H5391\">bite</span> thee, and <span class=\"wl wl-kjv\" data-code=\"H3364\">awake</span> that shall <span class=\"wl wl-kjv\" data-code=\"H2111\">vex</span> thee, and thou shalt be for booties","8":"Because thou hast <span class=\"wl wl-kjv\" data-code=\"H7997\">spoiled</span> <span class=\"wl wl-kjv\" data-code=\"H7227\">many</span> <span class=\"wl wl-kjv\" data-code=\"H1471\">nations,</span> all the <span class=\"wl wl-kjv\" data-code=\"H3499\">remnant</span> of the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> shall <span class=\"wl wl-kjv\" data-code=\"H7997\">spoil</span> thee; because of <span class=\"wl wl-kjv\" data-code=\"H120\">men's</span> <span class=\"wl wl-kjv\" data-code=\"H1818\">blood,</span> and for the <span class=\"wl wl-kjv\" data-code=\"H2555\">violence</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> of the <span class=\"wl wl-kjv\" data-code=\"H7151\">city,</span> and of all that dwell","9":"<span class=\"wl wl-kjv\" data-code=\"H1945\">Woe</span> to him that <span class=\"wl wl-kjv\" data-code=\"H1214\">coveteth</span> an <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> <span class=\"wl wl-kjv\" data-code=\"H1215\">covetousness</span> to his <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> that he may <span class=\"wl wl-kjv\" data-code=\"H7760\">set</span> his <span class=\"wl wl-kjv\" data-code=\"H7064\">nest</span> on <span class=\"wl wl-kjv\" data-code=\"H4791\">high,</span> that he may be <span class=\"wl wl-kjv\" data-code=\"H5337\">delivered</span> from the <span class=\"wl wl-kjv\" data-code=\"H3709\">power</span> of evil!","10":"Thou hast <span class=\"wl wl-kjv\" data-code=\"H3289\">consulted</span> <span class=\"wl wl-kjv\" data-code=\"H1322\">shame</span> to thy <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> by cutting <span class=\"wl wl-kjv\" data-code=\"H7096\">off</span> <span class=\"wl wl-kjv\" data-code=\"H7227\">many</span> <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> and hast <span class=\"wl wl-kjv\" data-code=\"H2398\">sinned</span> against thy soul.","11":"For the <span class=\"wl wl-kjv\" data-code=\"H68\">stone</span> shall cry <span class=\"wl wl-kjv\" data-code=\"H2199\">out</span> of the <span class=\"wl wl-kjv\" data-code=\"H7023\">wall,</span> and the beam <span class=\"wl wl-kjv\" data-code=\"H3714\">out</span> of the <span class=\"wl wl-kjv\" data-code=\"H6086\">timber</span> shall answer","12":"<span class=\"wl wl-kjv\" data-code=\"H1945\">Woe</span> to him that <span class=\"wl wl-kjv\" data-code=\"H1129\">buildeth</span> a <span class=\"wl wl-kjv\" data-code=\"H5892\">town</span> with <span class=\"wl wl-kjv\" data-code=\"H1818\">blood,</span> and <span class=\"wl wl-kjv\" data-code=\"H3559\">stablisheth</span> a <span class=\"wl wl-kjv\" data-code=\"H7151\">city</span> by iniquity!","13":"Behold, is it not of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts</span> that the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> shall <span class=\"wl wl-kjv\" data-code=\"H3021\">labour</span> in the <span class=\"wl wl-kjv\" data-code=\"H1767\">very</span> <span class=\"wl wl-kjv\" data-code=\"H784\">fire,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3816\">people</span> shall <span class=\"wl wl-kjv\" data-code=\"H3286\">weary</span> themselves for <span class=\"wl wl-kjv\" data-code=\"H1767\">very</span> vanity?","14":"For the <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> shall be <span class=\"wl wl-kjv\" data-code=\"H4390\">filled</span> with the <span class=\"wl wl-kjv\" data-code=\"H3045\">knowledge</span> of the <span class=\"wl wl-kjv\" data-code=\"H3519\">glory</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> as the <span class=\"wl wl-kjv\" data-code=\"H4325\">waters</span> <span class=\"wl wl-kjv\" data-code=\"H3680\">cover</span> the sea.","15":"<span class=\"wl wl-kjv\" data-code=\"H1945\">Woe</span> unto him that giveth his <span class=\"wl wl-kjv\" data-code=\"H7453\">neighbour</span> <span class=\"wl wl-kjv\" data-code=\"H8248\">drink,</span> that <span class=\"wl wl-kjv\" data-code=\"H5596\">puttest</span> thy <span class=\"wl wl-kjv\" data-code=\"H2573\">bottle</span> to him, and makest him <span class=\"wl wl-kjv\" data-code=\"H7937\">drunken</span> also, that thou mayest <span class=\"wl wl-kjv\" data-code=\"H5027\">look</span> on their nakedness!","16":"Thou art <span class=\"wl wl-kjv\" data-code=\"H7646\">filled</span> with <span class=\"wl wl-kjv\" data-code=\"H7036\">shame</span> for <span class=\"wl wl-kjv\" data-code=\"H3519\">glory:</span> <span class=\"wl wl-kjv\" data-code=\"H8354\">drink</span> thou also, and let thy foreskin be <span class=\"wl wl-kjv\" data-code=\"H6188\">uncovered:</span> the <span class=\"wl wl-kjv\" data-code=\"H3563\">cup</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD'S</span> right <span class=\"wl wl-kjv\" data-code=\"H3225\">hand</span> shall be <span class=\"wl wl-kjv\" data-code=\"H5437\">turned</span> unto thee, and shameful <span class=\"wl wl-kjv\" data-code=\"H7022\">spewing</span> shall be on thy glory.","17":"For the <span class=\"wl wl-kjv\" data-code=\"H2555\">violence</span> of <span class=\"wl wl-kjv\" data-code=\"H3844\">Lebanon</span> shall <span class=\"wl wl-kjv\" data-code=\"H3680\">cover</span> thee, and the <span class=\"wl wl-kjv\" data-code=\"H7701\">spoil</span> of <span class=\"wl wl-kjv\" data-code=\"H929\">beasts,</span> which made them <span class=\"wl wl-kjv\" data-code=\"H2865\">afraid,</span> because of <span class=\"wl wl-kjv\" data-code=\"H120\">men's</span> <span class=\"wl wl-kjv\" data-code=\"H1818\">blood,</span> and for the <span class=\"wl wl-kjv\" data-code=\"H2555\">violence</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> of the <span class=\"wl wl-kjv\" data-code=\"H7151\">city,</span> and of all that dwell","18":"What <span class=\"wl wl-kjv\" data-code=\"H3276\">profiteth</span> the graven <span class=\"wl wl-kjv\" data-code=\"H6459\">image</span> that the <span class=\"wl wl-kjv\" data-code=\"H3335\">maker</span> thereof hath <span class=\"wl wl-kjv\" data-code=\"H6458\">graven</span> it; the molten <span class=\"wl wl-kjv\" data-code=\"H4541\">image,</span> and a <span class=\"wl wl-kjv\" data-code=\"H3384\">teacher</span> of <span class=\"wl wl-kjv\" data-code=\"H8267\">lies,</span> that the <span class=\"wl wl-kjv\" data-code=\"H3335\">maker</span> of his <span class=\"wl wl-kjv\" data-code=\"H3336\">work</span> <span class=\"wl wl-kjv\" data-code=\"H982\">trusteth</span> therein, to <span class=\"wl wl-kjv\" data-code=\"H6213\">make</span> <span class=\"wl wl-kjv\" data-code=\"H483\">dumb</span> idols?","19":"<span class=\"wl wl-kjv\" data-code=\"H1945\">Woe</span> unto him that <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> to the <span class=\"wl wl-kjv\" data-code=\"H6086\">wood,</span> <span class=\"wl wl-kjv\" data-code=\"H6974\">Awake;</span> to the <span class=\"wl wl-kjv\" data-code=\"H1748\">dumb</span> <span class=\"wl wl-kjv\" data-code=\"H68\">stone,</span> <span class=\"wl wl-kjv\" data-code=\"H5782\">Arise,</span> it shall <span class=\"wl wl-kjv\" data-code=\"H3384\">teach!</span> Behold, it is <span class=\"wl wl-kjv\" data-code=\"H8610\">laid</span> over with <span class=\"wl wl-kjv\" data-code=\"H2091\">gold</span> and <span class=\"wl wl-kjv\" data-code=\"H3701\">silver,</span> and there is no <span class=\"wl wl-kjv\" data-code=\"H7307\">breath</span> at all in the midst","20":"But the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> is in his <span class=\"wl wl-kjv\" data-code=\"H6944\">holy</span> <span class=\"wl wl-kjv\" data-code=\"H1964\">temple:</span> let all the <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> keep <span class=\"wl wl-kjv\" data-code=\"H2013\">silence</span> before"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"stond op mijne","tekst":"Dat is bij gelijkenis, als van een soldaat of wachter, die op zijn post staat, gesproken, en is dit de zin: Ik heb met verlangen gewacht om te vernemen wat het God den Heere believen zou mij te openbaren en te antwoorden op mijn voorgaande klacht,zie Hab 1 ."},{"catchword":"Hij","tekst":"Te weten de Heere."},{"catchword":"in mij","tekst":"Of, door mij, gelijk 2Sa 23:2 . Dat is, wat mij de Heere openbaren zou."},{"catchword":"spreken zou,","tekst":"Dat is, wat Hij mij door een inwendige openbaring zou te kennen geven en bevelen; verg Hos 1:2 ."},{"catchword":"wat ik","tekst":"Te weten wat ik het volk Gods antwoorden zou op de klacht, die ik in zijn naam gedaan heb, Hab 1:2 , enz., waar de profeet als in twist komt met den Heere, klagende over zijn regering, overmits het den vromen zo kwalijk gaande was, en den goddelozen zo wel."}],"2":[{"catchword":"het gezicht","tekst":"Dat is, de profetie van den ondergang der Babyloniërs, waarvan in de volgende verzen gesproken wordt."},{"catchword":"opdat daarin","tekst":"Hebr. opdat hij lope die daarin leest; di, schrijf het met zo grote letters, dat hij die maar voorbijloopt, het kan lezen. Verg. Deu 27:8 ."}],"3":[{"catchword":"het gezicht","tekst":"Dat is, hetgeen door deze profetie te kennen wordt gegeven zal nog een tijdlang uitblijven."},{"catchword":"Hij","tekst":"Te weten de Heere."},{"catchword":"het","tekst":"Te weten het gezicht."},{"catchword":"op het einde","tekst":"Dat is, ten laatste. Welk einde bij God besloten is."},{"catchword":"voortbrengen","tekst":"Hebr. uitblazen; dat is, zijne oordelen uitgieten tot straf der goddelozen. Verg. Eze 21:31 , en zijn beloften volbrengen tot troost en verlossing der vromen."},{"catchword":"niet liegen;","tekst":"Hij zal metterdaad bewijzen en doen blijken dat hij niet gelogen heeft."},{"catchword":"Hij vertoeft,","tekst":"Indien de Heere deze profetie niet straks uitvoert, noch zo haast als gij wel wilt. Anders: zo het vertoeft, te weten dit gezicht, of die volvoering van hetzelve; zie Heb 10:37 ."},{"catchword":"Hem,","tekst":"Te weten den Heere. Of het, te weten het gezicht"},{"catchword":"Hij zal","tekst":"Te weten om de vijanden en vervolgers van zijn volk te straffen en zijn volk te redden."},{"catchword":"gewisselijk","tekst":"Hebr. komende komen; Heb 10:37 ."},{"catchword":"Hij zal niet","tekst":"Te weten de Heere; of [ zij ] te weten de profetie."},{"catchword":"achterblijven","tekst":"Of, vertragen, uitblijven, te weten boven den dag van God bestemd."}],"4":[{"catchword":"zijne","tekst":"Te weten de ziel van den Chaldeër, en onder zijn naam elke ongelovige. Anders: [wiens ziel] zich onttrekt, Zijne [te weten Gods] ziel is niet recht met [of tegen] hem, [te weten den afwijkende] verg. Heb 10:38 , alwaar de apostel den zin dezer woorden verklaart."},{"catchword":"ziel","tekst":"Dat is, hart, gemoed."},{"catchword":"verheft zich,","tekst":"Anders: bobbelt op Al schijnt de goddeloze wat groots te zijn, zo is hij maar als een bobbel, die wel wat schijnt te wezen, maar inderdaad is hij niets, hij verdwijnt haast."},{"catchword":"niet recht","tekst":"Maar snood en verkeerd: Alzo staat er: Het aangezicht in het gericht te kennen is niet goed; Pro 24:23 ; dat is, het is zeer kwaad."},{"catchword":"de rechtvaardige","tekst":"Dat is, die voor God rechtvaardig is door Jezus Christus"},{"catchword":"door","tekst":"Of, uit zijn geloof, namelijk zover hij door het geloof zich toepast de beloften Gods, aangaande de gerechtigheid van Christus, Joh 3:36 , Rom 1:17 ; Gal 3:11 ; Heb 10:38 ."},{"catchword":"leven","tekst":"Dat is, hij zal, verzoend zijnde met God, troost en blijdschap door den Heiligen Geest gevoelen hier in dit tijdelijke leven, en hij zal hiernamaals het eeuwige leven erven."}],"5":[{"catchword":"hij","tekst":"Te weten de Chaldeër; het Nebukadnezar of Belsazar."},{"catchword":"trouwelooslijk","tekst":"Of, [door] den wijn trouwelooslijk wordt Hebr. de wijn is trouweloos; dat is, dronkenschap maakt hen trouweloos."},{"catchword":"een trots man","tekst":"Of hovaardig."},{"catchword":"niet blijft;","tekst":"Of, niet blijven kan. Hebr. woont niet; dat is, die zich niet laat genoegen aan de koninkrijken en landen, die hij alrede heeft, maar hij zoekt verder te gaan, nimmermeer land genoeg hebbende; zie Dan 4:22 . Anders: daarom zal hij in zijne woonplaats niet blijven; dat is, daarom zal hij zelf uitgestoten worden uit zijne woning, hij zal in rust en vrede niet blijven."},{"catchword":"als het graf,","tekst":"Of, als de hel, die nimmermeer verzadigd noch vervuld is; verg. Isa 5:14 ."},{"catchword":"tot zich","tekst":"Door heerszucht daartoe aangepord zijnde; zie boven Hab 1:9 ."},{"catchword":"*","tekst":"De profeet wil uit het voorgaande besluiten, dewijl al deze grote ondeugden tezamen in den koning zijn, zo is er niet aan te twijfelen, of God zal hem in het kort zwaarlijk straffen en nederstoten."}],"6":[{"catchword":"Zouden","tekst":"Of, zullen niet allen."},{"catchword":"alle dezen","tekst":"Te weten al die heidenen en volken die de koning Nebukadnezar overweldigd en onder zijn gebied gebracht heeft, vs.5."},{"catchword":"van hem een","tekst":"Dat is, hem belachen en bespotten; te weten als hem God te schande zal gebracht hebben."},{"catchword":"een uitlegging","tekst":"Dat is, hetgeen zij eerst bedektelijk en als met verbloemde woorden hem verweten hebben, dat zullen zij daarna met klare en duidelijke woorden doen; verg. Isa 14:9-10 ."},{"catchword":"men zal","tekst":"Te weten een iegelijk onder de godzaligen, van wien vs.4, gesproken is."},{"catchword":"die vermeerdert","tekst":"Dat is, die zich verrijkt met hetgeen het zijne niet is. berovende andere heren en lieden van hunnen landen en goederen."},{"catchword":"(hoelang?),","tekst":"Te weten zal het duren, o Heere, dat Gij hem hierover niet straffen zoudt? De zin is: Gij zijt zo rechtvaardig, dat Gij deze goddeloosheid niet lang ongestraft zult kunnen laten. Anders: hoe lang, te weten zal deze zijn onverdragelijke land en geldroverij duren?"},{"catchword":"dik slijk","tekst":"Alzo noemt de profeet het zilver en goud, mitsgaders alle andere aardse goederen, die deze koning samengeschraapt en vergaderd had."}],"7":[{"catchword":"Zullen niet","tekst":"Deze vraag bevestigt sterkelijk, en is zoveel alsof hij zeide: Zekerlijk er zullen er opstaan, die; enz."},{"catchword":"onvoorziens","tekst":"Of, haastelijk."},{"catchword":"u bijten","tekst":"O koning te Babel; verstaat men dit van Nebukadnezar, zo is het te zeggen, dat hij haast sterven zou, en dat zijn lichaam in het graf van de wormen zou gebeten en gegeten worden. Maar verstaat men dit van Belsazar, zo is dit de zin, dat de vijanden in het kort komen zouden, die het rijk van hem nemen zouden, want hij is haastelijk in een nacht omgekomen en het rijk is hem en de zijnen benomen. Zie Dan 5 . Zie ook Isa 13 , 14 en Isa 21:2 ; Jer. 50, 51. Zodat bijten hier te zeggen is vijandelijk overvallen en aangrijpen, gelijk de leeuwen en andere wrede beesten doen."},{"catchword":"bewegen?","tekst":"Of, wegstoten, of verstoten; te weten uit, of van uw troon. Anders, die u schudden zullen."},{"catchword":"plundering worden?","tekst":"Of, enkel plundering, beroving."}],"8":[{"catchword":"u beroven,","tekst":"Zich vervoegende bij de Perzen en Meden, en versta hier al die overgebleven volken, of [zoals de Hebreeuwse woorden luiden] al het overblijfsel dier volken, die nog overgebleven zouden zijn van de volken, die hij beroofd had, of die nog in vrees stonden door hem beroofd te zullen worden."},{"catchword":"der mensen,","tekst":"Te weten hetwelk gij zonder reden of oorzaak vergoten hebt. Zie onder vs.17 en Isa 33:1 ."},{"catchword":"het land,","tekst":"Het zij vast overal aan verscheidene landen, of bij name aan het Joodse land gedaan."},{"catchword":"de stad","tekst":"Te weten Jeruzalem"},{"catchword":"al hare inwoners","tekst":"Verg. Jer 50:9-11 , Jer 50:17 en Jer 51:2 , Jer 51:24 ."}],"9":[{"catchword":"die met kwade","tekst":"Dat is, die schandelijk gewin drijft of zoekt, opdat hij zijne vrouw en kinderen rijk make, en ook zijne nakomelingen; verg. Pro 1 en zie de aantekening 19 aldaar, en Jer 22:13 ."},{"catchword":"opdat hij in","tekst":"Dat is, opdat hij en zijn geslacht hier in deze wereld groot en hoog mogen geacht worden en zekerlijk wonen. Het is ene gelijkenis, genomen van de vogels, die hunne nesten in de hoogte maken; verg. Oba 1:4 ."},{"catchword":"om bevrijd","tekst":"Dit was wel zijn oogmerk, maar hij is in zijne mening bedrogen geweest."},{"catchword":"uit de hand","tekst":"Hebr. uit de palm des kwaads; dat is, van het geweld van het kwaad; zie Job 5:20 ."}],"10":[{"catchword":"Gij hebt","tekst":"Di, gij hebt, alle eer bezijden zettende, rijkdom bijeengeschraapt, en hebt daar grote paleizen mede gebouwd, en die met kostelijk huisraad versierd. Doch alles gereikende tot uw eigen schande; zie vs.11."},{"catchword":"uitroeiende vele","tekst":"Om u met hun goed te verrijken."},{"catchword":"tegen uwe ziel","tekst":"Dat is, tegen uzelven."}],"11":[{"catchword":"de steen","tekst":"Dat is, de stenen waar uwe paleizen mede gebouwd zijn."},{"catchword":"roept, en","tekst":"Dat is, getuigt tegen u, te weten dat gij uwe paleizen met gestolen en onrechtvaardig goed gebouwd hebt, hij roept wraak voor God."},{"catchword":"de balk uit het","tekst":"Of, knoop, of knoest, die in het hout is, of uit het houten verwelfsel. Het Hebreeuwse woord wordt nergens elders dan hier gevonden, daarom kan men niet zekerlijk weten wat het betekent."},{"catchword":"dien","tekst":"Te weten steen; dat is, roept en getuigt zowel tegen den Babyloniër, als de stenen doen."}],"12":[{"catchword":"met bloed","tekst":"Hebr. met bloeden; dat is, met doodslag, of met het goed der gedoden of vermoorden; of, met het zweet en bloed der onderzaten, Eze 24:9 ; Nah 3:1 ."},{"catchword":"met onrecht","tekst":"Dat is, met goederen, die onrechtvaardig door roof en geweld bijeengeraapt zijn. Verg. Mic 3:10 ."},{"catchword":"bevestigt","tekst":"Of, grondvestigt, of fondeert."}],"13":[{"catchword":"is het niet","tekst":"Dat is, geschiedt het niet door den verborgen raad Gods?"},{"catchword":"arbeiden","tekst":"Te weten in het bouwen van huizen en steden."},{"catchword":"ten vure,","tekst":"Of, voor het vuur; dat is, opdat de huizen en steden die zij bouwen, van het vuur verbrand worden. Zie Jer 51:58 ."},{"catchword":"tevergeefs vermoeien?","tekst":"Of, tot, voor de ijdelheid; dat is tevergeefs, overmits het haast teniet en ten verderve komt wat zij bouwen."}],"14":[{"catchword":"de heerlijkheid","tekst":"Die de Heere bewijzen zal in het straffen der Chaldeën. Zie Jer 11:9 ."},{"catchword":"gelijk","tekst":"Dat is, zo overvloediglijk gelijk de wateren den bodem of grond der zee bedekken. Zie de aantekening Isa 11:9 ."}],"15":[{"catchword":"zijnen naaste","tekst":"Zijnen metgezel, zijnen vriend."},{"catchword":"te drinken","tekst":"Namelijk tot dronkenschap toe."},{"catchword":"wijnfles","tekst":"Dat is, de ene fles wijn op de andere ten beste geeft. Anders: die uw vergif daarbij voegt, of daaronder mengt."},{"catchword":"opdat gij","tekst":"Versta hierbij, en opdat gij dan hen tot een spot stelt, als gij hen hebt bedrogen en van al hunne macht en middelen ontbloot. Het is ene gelijkenis, genomen van onkuische daden der dronkaards."}],"16":[{"catchword":"Gij zult","tekst":"De zin is: O gij Babyloniër, vanwege deze en dergelijke schandelijke stukken, zult gij veel meer schande hebben, dan gij eer gehad hebt vanwege uw macht en rijkdom."},{"catchword":"drink gij ook","tekst":"Gaat zo maar voort in uw schandelijke daden, maar verwacht hetgeen er op volgen zal."},{"catchword":"de beker","tekst":"Dat is, de straf des Heeren; zie Jer 25 , de aant. vs.15, 27."},{"catchword":"der rechterhand","tekst":"Dat is, die in de rechterhand des Heeren is."},{"catchword":"zal zich tot u","tekst":"Dat is, de tijd is nu gekomen, dat de beker van den toorn Gods, vast omgegaam hebbende, nu tot u gekomen is, gij zult nu ook uwe beurt hebben en uw aandeel daaruit drinken; ja gij zult er zoveel moeten uitdrinken, dat daarop volgen zal een schandelijk uitbraaksel, in plaats uwer heerlijkheid."},{"catchword":"er zal een","tekst":"Dat is, gij zult tot zulke schande en oneer vervallen, dat elkeen een gruwel en afkeer zal hebben van uwe voortreffelijkheid, gelijk men heeft van een dronkaard, die zich zo volgezopen heeft, dat hij moet overgeven."}],"17":[{"catchword":"dat tegen","tekst":"Dat gij tegen Libanon begaan hebt. Libanon betekent hiet het Joodse volk, hetwelk aan den berg Libanon woonde. gelijk Isa 14:8 , en Isa 37:24 ; zie ook de aant. Eze 17:3 . Doch enigen verstaan hier door Libanon den tempel, die van hout uit Libanon gebouwd was."},{"catchword":"zal u bedekken,","tekst":"Dat is, overvallen, op het lijf vallen; gelijk gij den Joden en anderen gedaan hebt, zal u ook geschieden. Zie breder boven vs.8, en de aanteek. aldaar."},{"catchword":"de verwoesting","tekst":"De verwoesting der beesten op den berg Libanon zal de Chaldeën verschrikken; versta door de beesten of wilde dieren, de Joden, die van de Chaldeën niet meer geacht zijn geweest dan beesten, welke zij gevankelijk weggevoerd en gedood, somtijds in hunnen toorn, somtijds om hunne vreugde. Anderen verstaan door de verwoesting der beesten de verwoestingen door de grote beesten, [hetwelk tirannen kan betekenen] aangericht."},{"catchword":"hare inwoners","tekst":"Te weten zal u, o Chaldeër, dit overkomen."}],"18":[{"catchword":"Wat zal het","tekst":"Hier bestraft de profeet de afgoderij der Chaldeën, die zich op hunne afgoden en beelden verlieten. Van de beelden en afgoden wordt breder gesproken Jes. 40, 44, 46; Jer 2:8 , Jer 2:11 en Jer 16:19 , en elders meer."},{"catchword":"hetwelk een","tekst":"Of, dat is de leugenleraar, of leraar der leugens, Jer 10:8 , Jer 10:14 ; Zec 10:2 ."},{"catchword":"dat de formeerder","tekst":"Dat is, dat hij zo gek is, dat hij hetgeen hij zelf gemaakt heeft, waar leven noch spraak in is, voor zijnen god houdt en zijn vertrouwen daarop stelt."}],"19":[{"catchword":"tot het hout","tekst":"Dat is, tot het beeld van hout gemaakt. De zin is: Wee dengene, die de afgoden of hunne beelden aanroept."},{"catchword":"Word wakker!","tekst":"Dat is, sta op om ons te helpen in dezen onzen nood."},{"catchword":"Ontwaak!","tekst":"Alzo spreekt David tot den waren God; Psa 35:23 ."},{"catchword":"tot den zwijgenden steen","tekst":"Dat is, tot het beeld van steen gemaakt hetwelk stom is."},{"catchword":"het","tekst":"Te weten het houten of stenen beeld; Isa 44:9 ."},{"catchword":"leren?","tekst":"Iemand iets goeds kunnen leren?"},{"catchword":"geen geest in","tekst":"Of, geen adem, noch der mensen, ja ook niet der beesten, veel minder van enige godheid."}],"20":[{"catchword":"de HEERE is","tekst":"De ware levende en eeuwige God."},{"catchword":"in zijn heiligen","tekst":"Hebr. in den tempel zijner heiligheid; dat is, in den hemel, gelijk Psa 11:4 , vanwaar Hij alle dingen ziet; of in zijne gemeente, die Hij door Zijne tegenwoordigheid heiligt door de mededeling van zijnen Geest in Christus, en welke is de geestelijke tempel des Heeren. Sommigen verstaan hier ook den tempel te Jeruzalem, dien de Heere tot zijne woning had uitverkoren, om aldaar naar zijne wet geëerd en gediend te worden."},{"catchword":"zwijg voor zijn","tekst":"Dat is, onderwerp u hem in allen deemoed en nederigheid, en beken de gerech tigheid zijner goddelijke oordelen. Verg. Job 29:9 , en Job 21:5 , en Job 39:37 ; Amo 6:10 , en Amo 8:3 ; Zep 1:7 ; Zec 2:13."},{"catchword":"gij ganse aarde","tekst":"Dat is, al gij inwoners des aardrijks."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"I stood upon my guard, and I put myself upon the fort, and I kept watch for to see, [that is spoken by way of similitude, as of a souldier or centiel, standing upon his guard and watching; the sense being this I have been waiting and longing a great while, to know what God should be pleased to reveal and answer me upon the complaint addressed to him chap. 1] what he [to wit, the LORD] would speak in me, [or, by me, as 1 Sam 24.2. that is, what it would please the LORD to reveal unto and command one by inward revelation. Compare Hos. 1.2.] and what I should answer I should return to the people of God, upon the complaint, which I made in their behalf, chap. 1 verse 2,&c. where the prophet in a manner argued with God, and complained of his government, in regard it went so ill with the godly and so well with the wicked.]"}],"2":[{"catchword":null,"tekst":"Then the LORD answered me and said; write the vision, [i.e. the prophecie of the destruction of the Babylonians, spoken of in the following verses] and set it plainly (down) upon tables, that he may read therein that runneth by. [ Hebr. That he may run, that reads therein. i.e write it in such large characters, that he, which doth but run by, may take notice of and read it as he runs. Compare Deut. 27.8.]"}],"3":[{"catchword":null,"tekst":"For the vision shall be for set yet, [i.e. that which is made known by his prophecie, shall be delayed for a good while yet] upon he [viz. The LORD] shall bring it forth [it viz. this vision. Heb. shall blow it forth, i.e. God shall pour out his judgements, for to punish the wicked. Compare Eze 21:31. and perform his promises to the comfort and deliverance of the godly] at the end, [i.e. finally, at length, or last: which is determined by God] and not lie [he shall make it appear and shew, that he did not lie] if he tarries, [if the LORD doth not execute this propphecie forthwith, nor so soon as ye do wish for, Oth. If it tarry, to wit, this vision, or the execution of it. See Heb. 10.37.] Wait for him; [i.e. for the LORD, Or, for it. Viz. the vision] for he shall surely come, [Heb. Coming come, Heb. 10.37. namely, for to punish the enemies and persecutors of his people, and to deliver them out of their hand] he [viz. the LORD, or I viz. the prophecie] will not behinde. [Or, foreflow, stay out, viz. beyond the day, by God appointed.]"}],"4":[{"catchword":null,"tekst":"Behold, his soul [i.e. heart, mind: understand that of the Chaldeans, and under that name, every unbeliever] exhorts himself, [Oth, Bubbleth up: though the wicked seems to be very stout and dating, yet he is but like a bubble, which seems indeed to be something, but is nothing in effect, and soon perished] it is not right in him: [but evil, base and perverse: thus we read, to know the face in judgement, it not good. Proverb 24.23. i.e. it is very evil, or ill done. Oth. Read thus here: (whose soul) withdrawers it self, his (viz. Gods) soul is not right with or, towards him, to wit, that is withdrawn of falling off thus. Compare Heb. 10.30. where the Apostle explains the sense of these words] but the righteous, [i.e. he that is righteous, [i.e. he that is righteous before God through Jesus Christ] shall live [i.e. he shall, being reconciled with God, find and feel comfort and joy through the holy ghost, here in this life, and inherit everlasting life hereafter] by his faith. [Or. Out of his faith: namely by faith applying to himself the promised of God, concerning Christ&acirc;&euro;&trade;s righteousness. Joh 1:36. Rom. 1.17. Gal. 33.11. Heb 10.38.]"}],"5":[{"catchword":null,"tekst":"And also because he [viz, the Chaldean, whether Nebuchadnezzar, or, Belsazar] deals perfidiously by the wine [or, growes perfidious (through) the wine. Hebr. The wine is unfaithful, or perfidious, i.e. drunkenness renders him persideous] is an insolent man, [or, proud] and stayes not in his habitation, [or, cannot stay, or, abide, at home. Heb. Inhabits not, dwells not. i.e. doth not content himself with the kingdoms and countries he hath already, but seeks for more still, and is never satisfied with any. See Dan. 4.19. Oth. Therefore he shall not abide in his place; that is, therefore shall he himself be thrust out of his own habitation, and shall enjoy no rest nor peace at all] that openeth his soul wide as the grave, [or, as the hell, which is never filled nor satisfied. Compare Isa. 5.14.] and is like death, which is not satiated: and gathers unto himself all the heathen, and getteth in to him all nations: [instigated thereunto by his unsatiableness of domineering. See above chap. 1.9. the prophet seems to infer from what goeth before, that seeing this King hath so many grand enormities in him, there was no doubt to be made, but God would shortly and most serverly punish and ruine him.]"}],"6":[{"catchword":null,"tekst":"Should [Or, shall] not (then) all those [to wit, all those heathen and Nations, whom king Nebuchadnezzar subdued and brought under his power verse 5.] take up a proverb of him, [i.e. mock and scoff at him, namely, when God shall have brought him to confusion] and an interpretation of riddles concerning him? [i.e. that which formerly they upbraided him with, in a covert manner in borrowed works, the same they shall afterwards do in plain and right language. Compare Isa. 14.9, 10.] and they shall say [to wit, every one among the godly, spoken of verse of verse 4.] wo to him that multiplyeth that which is not his own: [i.e. that enricheth himself with other mens goods, that enlargeth his Dominions and possessions with that which belongeth to others] (how long!) [to wit, shall this last, how long wilt thou, O LORD, forbear to punish this? The sense is, thou art so righteous that thou shalt not be able to let this so long unpunished: other; how long? Viz. shall this unsufferable taking, taking and ransacking of goods and countries endure?] and him that loadeth himself with thick mire: [thus the prophet calleth the silver and gold, together with all other earthly riches, which this King had raked and gathered together.]"}],"7":[{"catchword":null,"tekst":"Shall there not [this question doth strongly affirm, as if the prophet had said, surely there shall] arise unawares [or, suddenly] such as will bite thee? [to wit, O King of Babel; if this be understood of Nebuchadnezar, it implies, that he shall soon die, and his dead body be bitten and eaten of worms in the grave: but if it be understood of Belsazar, then the meaning is, the enemies shall suddenly come upon, and bereave him of his and Kingdom; which all in one night. See Dan. 5. as also Isa. 13.14. and 21.2. and Jer. 50.51. so that to bite is here as much as to surprise and seize upon suddenly, even as lion and other fierce beasts do] and awake, such as shall move thee? [or, remove frm, thrust out of; viz. thy throne. Oth. That shall shake thee] and shalt not thou become plundering to them? [or, meer plundering, prey, bereaving.]"}],"8":[{"catchword":null,"tekst":"Because thou hast bereaved many heathens therefore shall the remaining Nations bereave thee; [joining themselves with the Medes and Persians, and understand here all those remaining Nations, or (as the Heb. Words run) all the remainder of Nations, which shall be left of the nations, whom he had bereaved, or that stood yet in fear to be bereaved by him] for the blood of men, [to wit, which thou hast spilt any cause or reason. See below verse 7 and Isa. 33.1.] and the violence on the land, [committed on either any of the various countries he sudued, or in particular, the land of Juda] the city, [viz. Jerusalem] and all the inhabitants of the same. [Compare Jer. 50.9, 10, 11.17 and 51.2.24.]"}],"9":[{"catchword":null,"tekst":"Wo to him, that covets with evil coveteousness for his house, [i.e. that seeks and practiseth by all manner of base wayes to enrich himself, his wise, children and posteritie. Compare Prov. 1 and see the annotate. There on verse 19 and Jer. 22.13.] that he may put his nest on high, [i.e. that he and his family may rife, and become great and famous in the world and live secure and safe multitude taken from such birds, as love to build their nests in the high places. Compare Obad. Verse 4.] for to be freed [this was indeed his aym, but his hopes deceived him] out of the hand of evil. [Heb. the palm of &c i.e. from the power thereof. See Job 5 on verse 20.]"}],"10":[{"catchword":null,"tekst":"Thou hast consulted shame for thine house: [i.e. thou hast, setting all honour and honesty aside, racked much riches together and raised great and stately palaces by them, and adorned the same with all manner of precious furniture, yet all this speaks but thy own shame and imfamy. See verse 11.] destroying many nations [viz. by their great wealth to enrich thy self] thus thou sinnedth against thine own soul. [i.e. thine own self.]"}],"11":[{"catchword":null,"tekst":"For the stone out of the wall [i.e. the stones wherewith thy palaces are built] cryeth: [i.e. testifieth against thee, namely, that thou hast built those palaces with stolen and unrighteous goods, which call to God for vengeance on thee] and the beam out of the wood [or bution, knub, or knot of the tree, that is in the wood, or out of the wooden ceiling. The Hebr. Word is no where but here; therefore it cannot be exactly said, what is signifieth] answereth to the same. [i.e. to the stone aforesaid, that is to say, the wood crieth and testifieth as well against the Babylonians, as the stones do.]"}],"12":[{"catchword":null,"tekst":"Wo to him that build the city with blood, [Heb. bloods, i.e. with murder, or with the good of him or them that are slain or murdered, or with the sweat and blood of the subjects, Eze 24:9. Nahum 3.1.] and to him that fortifieth [or, layeth the foundation of] the city with wrong. [i.e. with goods wrongfully raked together by rapine and violence. Compare Mich. 3.10.]"}],"13":[{"catchword":null,"tekst":"Behold, is it not from the LORD of hosts, [i.e. doth it come not into pass, by the secret councel of God] that the nations labour [viz. in the building of houses and cties] to the fire, [or, for the fire, so that the houses and cities, which they build, come to be consumed by fire. See Jer. 51.58.] and people weary themselves in vain? [or, unto, for vanity i.e. in vain, to no purpose, seeing it come // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}

document.addEventListener('click', e => {

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {

  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';

      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start) {
  const nummers = [];
  for (let i = 0; i < 3; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
  if (m) {
    const start = parseInt(m[1], 10);
    const html = popupVerzenHtml(D.vertalingen.SVnu, start);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const html = popupVerzenHtml(data, start);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
