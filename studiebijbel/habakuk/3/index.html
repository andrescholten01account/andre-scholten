smart; de waterstroom ging erdoorheen, de afgrond gaf zijn stem, hij hief zijn handen op *in* de hoogte.","11":"De zon en de maan stonden stil in *hun* woning; met het licht gingen Uw pijlen daarheen, met glans Uw bliksemende speer.","12":"Met gramschap trad U *door* het land, met toorn dorste U de heidenvolken.","13":"U trok uit tot verlossing van Uw volk, tot verlossing met Uw Gezalfde; U doorwondde het hoofd van het huis van de goddeloze, en ontblootte de fundering tot aan de hals toe. Sela.","14":"U doorboorde met zijn eigen staven het hoofd van zijn dorpsbewoners; zij stormden aan, om mij te verstrooien; zij verheugden zich, alsof zij de ellendigen in het verborgen zouden opeten.","15":"U betrad *met* Uw paarden de zee; het geweldige water werd een hoop.","16":"Toen ik het hoorde, werd mijn buik beroerd; voor de stem hebben mijn lippen gebeefd; verrotting kwam in mijn beenderen, en ik werd beroerd op mijn plaats. Zeker, ik zal rusten op de dag van de benauwdheid, wanneer hij zal optrekken tegen het volk, om het met troepen aan te vallen.","17":"Alhoewel de vijgenboom niet bloeien zal, en er geen vrucht aan de wijnstok zal zijn, dat het werk van de olijfboom liegen zal, en de velden geen voedsel voortbrengen; dat men de kudde uit de kooi zal wegscheuren, en dat er geen rund in de stallen zal zijn;","18":"Zo zal ik toch in de HEERE van vreugde opspringen, ik zal mij verheugen in de God van mijn heil.","19":"De HEERE Heere is mijn Sterkte; en Hij zal mijn voeten maken als die van de hinden, en Hij zal mij doen treden op mijn hoogten. Voor de koorleider, op mijn Neginoth."},"SV":{"1":"Een gebed van Habakuk, den profeet, op Sjigjonoth.","2":"HEERE! als ik Uw rede gehoord heb, heb ik gevreesd; Uw werk, o HEERE! behoud dat in het leven in het midden der jaren, maak het bekend in het midden der jaren; in den toorn gedenk des ontfermens.","3":"God kwam van Theman, en de Heilige van den berg Paran. Sela. Zijn heerlijkheid bedekte de hemelen, en het aardrijk was vol van Zijn lof.","4":"En er was een glans als des lichts, Hij had hoornen aan Zijn hand, en aldaar was Zijn sterkte verborgen.","5":"Voor Zijn aangezicht ging de pestilentie, en de vurige kool ging voor Zijn voeten henen.","6":"Hij stond, en mat het land, Hij zag toe, en maakte de heidenen los, en de gedurige bergen zijn verstrooid geworden; de heuvelen der eeuwigheid hebben zich gebogen; de gangen der eeuw zijn Zijne.","7":"Ik zag de tenten van Kusan onder de ijdelheid; de gordijnen des lands van Midian schudden.","8":"Was de HEERE ontstoken tegen de rivieren? Was Uw toorn tegen de rivieren, was Uw verbolgenheid tegen de zee, toen Gij op Uw paarden reedt? Uw wagens waren heil.","9":"De naakte grond werd ontbloot *door* Uw boog, *om* de eden, aan de stammen gedaan *door* het woord. Sela. Gij hebt de rivieren der aarde gekloofd.","10":"De bergen zagen U, *en* leden smart; de waterstroom ging door, de afgrond gaf zijn stem, hij hief zijn zijden op *in* de hoogte.","11":"De zon en de maan stonden stil in *haar* woning; met het licht gingen Uw pijlen daarhenen, met glans Uw bliksemende spies.","12":"Met gramschap tradt Gij *door* het land, met toorn dorstet Gij de heidenen.","13":"Gij toogt uit tot verlossing Uws volks, tot verlossing met Uw Gezalfde; Gij doorwonddet het hoofd van het huis des goddelozen, ontblotende den grond tot den hals toe. Sela.","14":"Gij doorboordet met zijn staven het hoofd zijner dorplieden; zij hebben gestormd, om mij te verstrooien; die zich verheugden, alsof zij de ellendigen in het verborgen zouden opeten.","15":"Gij betradt *met* Uw paarden de zee; de geweldige wateren werden een hoop.","16":"Als ik het hoorde, zo werd mijn buik beroerd; voor de stem hebben mijn lippen gebeefd; verrotting kwam in mijn gebeente, en ik werd beroerd in mijn plaats. Zekerlijk, ik zal rusten ten dage der benauwdheid, als hij optrekken zal tegen het volk, dat hij het met benden aanvalle.","17":"Alhoewel de vijgeboom niet bloeien zal, en geen vrucht aan den wijnstok zijn zal, dat het werk des olijfbooms liegen zal, en de velden geen spijze voortbrengen; dat men de kudde uit de kooi afscheuren zal, en dat er geen rund in de stallingen wezen zal;","18":"Zo zal ik nochtans in den HEERE van vreugde opspringen, ik zal mij verheugen in den God mijns heils.","19":"De HEERE Heere is mijn Sterkte; en Hij zal mijn voeten maken als der hinden, en Hij zal mij doen treden op mijn hoogten. Voor den opperzangmeester op mijn Neginoth."},"KJV":{"1":"A prayer of Habakkuk the prophet upon Shigionoth.","2":"O LORD, I have heard thy speech, *and* was afraid: O LORD, revive thy work in the midst of the years, in the midst of the years make known; in wrath remember mercy.","3":"God came from Teman, and the Holy One from mount Paran. Selah. His glory covered the heavens, and the earth was full of his praise.","4":"And *his* brightness was as the light; he had horns *coming* out of his hand: and there *was* the hiding of his power.","5":"Before him went the pestilence, and burning coals went forth at his feet.","6":"He stood, and measured the earth: he beheld, and drove asunder the nations; and the everlasting mountains were scattered, the perpetual hills did bow: his ways *are* everlasting.","7":"I saw the tents of Cushan in affliction: *and* the curtains of the land of Midian did tremble.","8":"Was the LORD displeased against the rivers? *was* thine anger against the rivers? *was* thy wrath against the sea, that thou didst ride upon thine horses *and* thy chariots of salvation?","9":"Thy bow was made quite naked, *according* to the oaths of the tribes, *even thy* word. Selah. Thou didst cleave the earth with rivers.","10":"The mountains saw thee, *and* they trembled: the overflowing of the water passed by: the deep uttered his voice, *and* lifted up his hands on high.","11":"The sun *and* moon stood still in their habitation: at the light of thine arrows they went, *and* at the shining of thy glittering spear.","12":"Thou didst march through the land in indignation, thou didst thresh the heathen in anger.","13":"Thou wentest forth for the salvation of thy people, *even* for salvation with thine anointed; thou woundedst the head out of the house of the wicked, by discovering the foundation unto the neck. Selah.","14":"Thou didst strike through with his staves the head of his villages: they came out as a whirlwind to scatter me: their rejoicing *was* as to devour the poor secretly.","15":"Thou didst walk through the sea with thine horses, *through* the heap of great waters.","16":"When I heard, my belly trembled; my lips quivered at the voice: rottenness entered into my bones, and I trembled in myself, that I might rest in the day of trouble: when he cometh up unto the people, he will invade them with his troops.","17":"Although the fig tree shall not blossom, neither *shall* fruit *be* in the vines; the labour of the olive shall fail, and the fields shall yield no meat; the flock shall be cut off from the fold, and *there shall be* no herd in the stalls:","18":"Yet I will rejoice in the LORD, I will joy in the God of my salvation.","19":"The LORD God *is* my strength, and he will make my feet like hinds' *feet*, and he will make me to walk upon mine high places. To the chief singer on my stringed instruments."}},"tsk":{"1":[{"kopje":"Een gebed","refs":["Ps 86:1-17","Ps 90:1-17"]},{"kopje":"op Sjigjonoth","refs":["Ps 7:2-18"]}],"2":[{"kopje":"ik gehoord heb","refs":["Hab 3:16","Hab 1:5-10","Ex 9:20","Ex 9:21","2 Kron 34:27","2 Kron 34:28","Job 4:12-21","Ps 119:120","Jes 66:2","Jer 36:21-24","Dan 8:17","Hebr 11:7","Hebr 12:21","Openb 15:4"]},{"kopje":"rede","refs":["Jes 53:1","Rom 10:16"]},{"kopje":"o HEERE","refs":["Ezra 9:8","Ps 85:7","Ps 90:13-17","Ps 138:7","Ps 138:8","Jes 51:9-11","Jes 63:15-19","Jes 64:1-4","Hos 6:2","Hos 6:3","Joh 10:10","Fil 1:6"]},{"kopje":"in het midden","refs":["Jer 25:11","Jer 25:12","Jer 52:31-34","Dan 9:2"]},{"kopje":"in de toorn","refs":["Ex 32:10-12","Num 14:10-23","Num 16:46","Num 16 lass=\"wl wl-kjv\" data-code=\"H2671\">arrows</span> they <span class=\"wl wl-kjv\" data-code=\"H1980\">went,</span> and at the <span class=\"wl wl-kjv\" data-code=\"H5051\">shining</span> of thy <span class=\"wl wl-kjv\" data-code=\"H1300\">glittering</span> spear.","12":"Thou didst march <span class=\"wl wl-kjv\" data-code=\"H6805\">through</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> in <span class=\"wl wl-kjv\" data-code=\"H2195\">indignation,</span> thou didst <span class=\"wl wl-kjv\" data-code=\"H1758\">thresh</span> the <span class=\"wl wl-kjv\" data-code=\"H1471\">heathen</span> in anger.","13":"Thou wentest <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> for the <span class=\"wl wl-kjv\" data-code=\"H3468\">salvation</span> of thy <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> even for <span class=\"wl wl-kjv\" data-code=\"H3468\">salvation</span> with thine <span class=\"wl wl-kjv\" data-code=\"H4899\">anointed;</span> thou <span class=\"wl wl-kjv\" data-code=\"H4272\">woundedst</span> the <span class=\"wl wl-kjv\" data-code=\"H7218\">head</span> out of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H7563\">wicked,</span> by <span class=\"wl wl-kjv\" data-code=\"H6168\">discovering</span> the <span class=\"wl wl-kjv\" data-code=\"H3247\">foundation</span> unto the <span class=\"wl wl-kjv\" data-code=\"H6677\">neck.</span> Selah.","14":"Thou didst strike <span class=\"wl wl-kjv\" data-code=\"H5344\">through</span> with his <span class=\"wl wl-kjv\" data-code=\"H4294\">staves</span> the <span class=\"wl wl-kjv\" data-code=\"H7218\">head</span> of his <span class=\"wl wl-kjv\" data-code=\"H6518\">villages:</span> they came out as a <span class=\"wl wl-kjv\" data-code=\"H5590\">whirlwind</span> to <span class=\"wl wl-kjv\" data-code=\"H6327\">scatter</span> me: their <span class=\"wl wl-kjv\" data-code=\"H5951\">rejoicing</span> was as to <span class=\"wl wl-kjv\" data-code=\"H398\">devour</span> the <span class=\"wl wl-kjv\" data-code=\"H6041\">poor</span> secretly.","15":"Thou didst <span class=\"wl wl-kjv\" data-code=\"H1869\">walk</span> through the <span class=\"wl wl-kjv\" data-code=\"H3220\">sea</span> with thine <span class=\"wl wl-kjv\" data-code=\"H5483\">horses,</span> through the <span class=\"wl wl-kjv\" data-code=\"H2563\">heap</span> of <span class=\"wl wl-kjv\" data-code=\"H7227\">great</span> waters.","16":"When I <span class=\"wl wl-kjv\" data-code=\"H8085\">heard,</span> my <span class=\"wl wl-kjv\" data-code=\"H990\">belly</span> <span class=\"wl wl-kjv\" data-code=\"H7264\">trembled;</span> my <span class=\"wl wl-kjv\" data-code=\"H8193\">lips</span> <span class=\"wl wl-kjv\" data-code=\"H6750\">quivered</span> at the <span class=\"wl wl-kjv\" data-code=\"H6963\">voice:</span> <span class=\"wl wl-kjv\" data-code=\"H7538\">rottenness</span> <span class=\"wl wl-kjv\" data-code=\"H935\">entered</span> into my <span class=\"wl wl-kjv\" data-code=\"H6106\">bones,</span> and I <span class=\"wl wl-kjv\" data-code=\"H7264\">trembled</span> in myself, that I might <span class=\"wl wl-kjv\" data-code=\"H5117\">rest</span> in the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of <span class=\"wl wl-kjv\" data-code=\"H6869\">trouble:</span> when he cometh <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> unto the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> he will invade them with his troops.","17":"Although the fig <span class=\"wl wl-kjv\" data-code=\"H8384\">tree</span> shall not <span class=\"wl wl-kjv\" data-code=\"H6524\">blossom,</span> neither shall <span class=\"wl wl-kjv\" data-code=\"H2981\">fruit</span> be in the <span class=\"wl wl-kjv\" data-code=\"H1612\">vines;</span> the <span class=\"wl wl-kjv\" data-code=\"H4639\">labour</span> of the <span class=\"wl wl-kjv\" data-code=\"H2132\">olive</span> shall <span class=\"wl wl-kjv\" data-code=\"H3584\">fail,</span> and the <span class=\"wl wl-kjv\" data-code=\"H7709\">fields</span> shall <span class=\"wl wl-kjv\" data-code=\"H6213\">yield</span> no <span class=\"wl wl-kjv\" data-code=\"H400\">meat;</span> the <span class=\"wl wl-kjv\" data-code=\"H6629\">flock</span> shall be cut <span class=\"wl wl-kjv\" data-code=\"H1504\">off</span> from the <span class=\"wl wl-kjv\" data-code=\"H4356\">fold,</span> and there shall be no <span class=\"wl wl-kjv\" data-code=\"H1241\">herd</span> in the stalls:","18":"Yet I will <span class=\"wl wl-kjv\" data-code=\"H5937\">rejoice</span> in the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> I will <span class=\"wl wl-kjv\" data-code=\"H1523\">joy</span> in the <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of my salvation.","19":"The <span class=\"wl wl-kjv\" data-code=\"H3069\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H136\">God</span> is my <span class=\"wl wl-kjv\" data-code=\"H2428\">strength,</span> and he will <span class=\"wl wl-kjv\" data-code=\"H7760\">make</span> my <span class=\"wl wl-kjv\" data-code=\"H7272\">feet</span> like <span class=\"wl wl-kjv\" data-code=\"H355\">hinds'</span> feet, and he will make me to <span class=\"wl wl-kjv\" data-code=\"H1869\">walk</span> upon mine high <span class=\"wl wl-kjv\" data-code=\"H1116\">places.</span> To the chief <span class=\"wl wl-kjv\" data-code=\"H5329\">singer</span> on my stringed instruments."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"op schigjónòth","tekst":"Dat is, op menigerlei rijmen aard gesteld. De zin is, om te zingen op de wijze der zangen, die men schigjonoth noemt; zie Psa 7:1 . Eenigen zetten het over voor de onbekende, of onwetende, dat is, om vergiffenis van God te verzoeken voor de zonden van het volk, welke het door onwetendheid begaan heeft. Maar dit behaagt anderen niet, omdat zulks in dezen psalm niet verhandeld wordt."}],"2":[{"catchword":"uwe rede","tekst":"Hebr. uw gehoor gehoord hebt; dat is, als ik gehoord heb hetgeen het U beliefd heeft mij te openbaren, namelijk de verschrikkelijke oordelen, waarmede Gij uw volk zijt dreigende. Zie boven Hab 1:5 enz."},{"catchword":"uw werk,","tekst":"Sommigen verstaan hier door het werk het volk en de kerk Gods, welke is het voornaamste werk onder al de werken Gods, gelijk Psa 100:3 ; Jer 29:23 , en Isa 45:11 . Anderen verstaan het aldus: Heere, houd in wezen en in eer hetgeen Gij onder uw volk gedaan hebt, hetwelk Gij krachtig en wonderbaar hebt beschut en beschermd, Het komt vast opeen uit."},{"catchword":"in het midden der jaren,","tekst":"Dat is, gedurende de zeventig jaren der Babylonische gevangenschap van uw volk."},{"catchword":"maak het bekend","tekst":"De zin is, maak door uw woord en predikatie dat uw volk dat wete en versta, en doe het metterdaad blijken onder de heidenen, dat Gij U over uw volk ontfermt."},{"catchword":"gedenk des","tekst":"Menselijkerwijze van god gesproken. Zie Gen 8:1 , en Gen 9:15 , en Gen 30:22 ; Exo 6:4 ; dat nu God in zijn toorn indachtig is zijner barmhartigheid, blijkt uit vele plaatsen der Heilige Schrift, gelijk Exo 32:11 , Exo 32:12 ; Num 14:17 ; Psa 6:5 en Psa 9:10-11 ; en Psa 25:6-7 , en Psa 51:3 en Psa 103:6 , Psa 103:7-9 ; Isa 12:1 ; Jer 14:7"}],"3":[{"catchword":"God","tekst":"In dit vers en enige navolgende beschrijft de profeet de majesteit en macht van God, die Hij betoond heeft als Hij zijne wet gegeven heeft; willende daarmede bewijzen dat het dien machtigen God licht is, zijn volk, als het Hem belieft, uit de Babylonische gevangenschap te verlossen."},{"catchword":"kwam","tekst":"Dat is, Hij verscheen zijn volk, te weten ten tijde van Mozes, toen Hij zijne wet hun gaf. Hebr. zal komen. Zie Deu 33:2 ."},{"catchword":"van Theman,","tekst":"Door Theman verstaan sommigen den berg, die anders Seïr genoemd wordt. Zie Amo 1:12 , en Oba 1:9 . Anders: van het zuiden."},{"catchword":"de Heilige","tekst":"Te weten de heilige Israëls."},{"catchword":"Paran","tekst":"Zie van Paran Gen 14:6 . Het is een berg gelegen nabij den berg Sinaï, die in de woestijn Paran gelegen is. Zie Num 10:12 , en Num 12:16 , en Num 13:26 ."},{"catchword":"Sela","tekst":"Dat woord vindt men nergens dan in dit lied van Habakuk en in de psalmen van David. Zie Psa 3:3 ."},{"catchword":"heerlijkheid","tekst":"Of, zijne majesteit."},{"catchword":"bedekte de","tekst":"Dat is te verstaan te dien aanzien, dat de Heere zijn volk, als Hij hun zijne wet faf, in grote heerlijkheid verschenen is, met donder en bliksem. enz. Zie Exo 19:16 , en 2Co 3:7 ."}],"4":[{"catchword":"als des lichts,","tekst":"Dat is, als van de zon. De zon wordt het het licht genoemd, omdat zij het grootste licht is, hetwelk God geschapen heeft. Zie Job 31:26 , en Job 37:21 . Hier is door den glans als van het licht te verstaan het schijnsel van de vuurkolom, die de Israëlieten lichtte in de woestijn."},{"catchword":"Hij had hoornen","tekst":"Te weten tot een teken zijner macht. Want door de hoornen wordt dikwijls macht betekend in de Heilige Schrift. Anderen verstaan hier door hoornen zulke stralen, als de klaarschijnende zon uitgeeft, of zulke, als uit het aangezicht van Mozes voortgingen, nadat hij met God gesproken had; zie Exo 34:29 ."},{"catchword":"aan zijne hand,","tekst":"Dat is, aan zijne zijde. Zie Neh 3:2 ; 2Sa 18:4 ; Pro 8:3 . De zin is: Aan elke zijde was een hoorn gelijk de hoornbeesten aan elke zijde een hoorn hebben. Anders: daar waren twee hoornen aan zijne zijde."},{"catchword":"aldaar was zijne","tekst":"Hebr. de verberging zijner sterkte. De zin is: Door zulk een glans gaf wel de Heere zijn goddelijke macht te kennen, [verg. Psa 18:12-13 , enz.] alzo nochtans dat Hij den gehelen glans zijner majesteit en sterkte niet liet schijnen voor zijn volk, naar Hij liet ze slechts blijken door enige stralen, opdat het volk niet ganselijk zou verbaasd en verslagen worden door het aanschouwen van de majesteit des Heeren."}],"5":[{"catchword":"Voor zijn","tekst":"Dat is, Hij verdelgde de natiën, die zich tegen zijn volk verhieven, met allerlei plagen, te weten de Amorieten, Sihon en Og. enz. Het is ene manier van spreken, genomen van de koningen en prinsen dezer wereld, gelijk voor dezen veel knechten en lakeien gaan, alzo zijn er bij God, als hij toornig is en straffen wil, pestilentiën en vele anders ziekten en plagen. Zie Exo 9:3 , Exo 9:6 , Exo 9:23-24 ; Num 14:12 ."},{"catchword":"de vurige kool","tekst":"Of, karbonkel. Zie Deu 32:24 , en Psa 78:48 ."}],"6":[{"catchword":"Hij stond","tekst":"Te weten God de Heere, vertegenwoordigd door de ark, die veertien jaar lang te Gilgal bleef, totdat de Joden het land van belofte onder zich hadden verdeeld."},{"catchword":"mat","tekst":"Hetgeen uit Gods bevel geschied is, dat schrijft hij God zelven toe, want het land is, door Gods bevel, den Israëlieten door het lot uitgedeeld geworden; Num 32 , Num 34 , Jos 1 , Jos 5 , Jos 11 , Jos 12 , en Psa 78:55 ."},{"catchword":"het land,","tekst":"Te weten het land Kanaän."},{"catchword":"Hij zag toe","tekst":"Door een stuurs gezicht heeft God die natiën kunnen verdrijven, hoe vast zij in dat land geworteld zaten."},{"catchword":"maakte de heidenen","tekst":"Dat is, Hij verstrooide de heidenen en wierp hen uit, te weten de Kanaänieten, die te voren in het land gewoond hadden."},{"catchword":"de gedurige","tekst":"Aldus worden de bergen en heuvelen genoemd, omdat zij altijd vast staande blijven. Zie Eze 36:2 ."},{"catchword":"hebben zich","tekst":"Als Hem eerbieding doende."},{"catchword":"de gangen der","tekst":"Of, Hij had eeuwige gangen; Dat is, zijne wegen zijn eeuwigdurende, of de Heere richt uit wat Hij van eeuwigheid besloten had; Hij is alleen eeuwig, en zijne besluiten, naar welke Hij de wereld regeert, zijn van eeuwigheid af."},{"catchword":"zijn zijne","tekst":"Of, komen Hem toe."}],"7":[{"catchword":"Ik","tekst":"Te weten ik, het volk van Israël. Zie hiervan Exo 15:14 . Of, [ik zag] dat is, ik houd het zo zeker, alsof ik het zelf zag."},{"catchword":"Kuschan","tekst":"Of, der Moren. Versta hierbij, en andere volken rondom gelegen; zie Jdg 3:8 ."},{"catchword":"onder","tekst":"Of, in moeite, of in druk, of tot ijdelheid begeven zijnde; dat is ijdel en tevergeefs het volk Gods vervolgende."},{"catchword":"de gordijnen","tekst":"Dat is, de tenten, van gordijnen gemaakt. Zie de geschiedenis Jdg 7:21 ."},{"catchword":"schudden","tekst":"Of, werden bewogen, of bevende. Het schijnt dat de profeet hier ziet op de nederlaag van Cuschan-Rischataïm, Jdg 3:10 , en der Midianieten, Richt. 6, 7."}],"8":[{"catchword":"tegen de rivieren?","tekst":"Te weten tegen de Rode zee en de Jordaan, die Hij kliefde. De zin is: Het scheen wel dat de Heere tegen de rivieren verstoord was, maar het was Hem te doen om zijn volk daar door te laten gaan."},{"catchword":"uw paarden","tekst":"Versta hier door de paarden de wolken en vuurkolom, die als paarden des Heeren zijn, die Hij beweegt waarheen het Hem belieft, gelijk een ruiter zijn paard doet. Of, op paarden rijden kan hier betekenen spoediglijk voortvaren."},{"catchword":"Uw wagens","tekst":"Te weten door welke Gij uw volk verlossing hebt aangebracht. Het schijnt dat hij ziet op de historie, die geschreven staat Exo 13:21 , en Exo 14:14 ."}],"9":[{"catchword":"De naakte grond","tekst":"Of, de naaktheid [der zee], te weten der Rode zee en der Jordaan, ontnaakte, of werd naakt, door uwen boog. Zie Isa 63:12 ; Psa 114:5 . Anders: naakt is uw boog ontwaakt, om uwer eden wil [gedaan in het] woord, enz."},{"catchword":"door uwen boog,","tekst":"Of, met uwen boog; dat is, door uw kracht en bevel. Anders: uw boog werd ontbloot."},{"catchword":"de eden","tekst":"Versta, de eden en beloften, die de Heere Abraham, Gen 15:14 , Gen 15:18 en Gen 17:8 , en den anderen patriarchen gedaan heeft. Daarom staat hier eden, niet eed, omdat God de Heere den eed meermalen vernieuwd heeft."},{"catchword":"Gij hebt de","tekst":"Of: Gij kliefdet de aarde met de rivieren. Zie Num 20:10-11 en Num 21:16 ; Psa 78:15-16 en Psa 114:5 , en 1Co 10:4 . Anders: Gij kliefdet de rivieren [tot op] de aarde, opdat het volk van Israel daar zou kunnen doorgaan."}],"10":[{"catchword":"De bergen","tekst":"Of, als U de bergen zagen, werden zij bang. Dit verstaan sommigen geschied te zijn toen de wet verkondigd werd, Exo 19:18 , Zie Psa 114:4 , Psa 114:6 ."},{"catchword":"leden smart;","tekst":"Te weten vanwege de vrees, die zij voor U hadden."},{"catchword":"de waterstroom","tekst":"Te weten de Jordaan. Anders: de overloping der wateren."},{"catchword":"ging door,","tekst":"Dat is, vlood daarheen, dewijl het water dat van boven nederwaarts kwam staande bleef, maar het water, dat naar beneden liep, nam af en vervlood. Zie Jos 3:16 ."},{"catchword":"de afgrond gaf","tekst":"De afgrond of diepte der Rode zee werd gehoord, te weten met geweld en met gedruis nederwaarts lopende, en het ene deel zich van het andere afscheurende."},{"catchword":"zijn zijden op","tekst":"Hebr. zijne handen; dat is, de hopen der wateren, die overeind staande, water als handen aan een lichaam. Doch dit is hier te verstaan alleen van de ene zijde, die als een muur, onbewegelijk overeind bleef staan, totdat er de Israelieten waren doorgegaan, de andere zijde liep, nederwaarts, makende alzo een droge baan. Anders: de diepte hief hare handen op. Hare handen, dat is, haar grote bergen van water aan de ene en de andere zijde overeind verheven staande, U, o Heere, op hunnen wijze eerbied en gehoorzaamheid bewijzende."}],"11":[{"catchword":"stonden stil","tekst":"Te weten terwijl Jozua tegen de Amorieten streed, Jos 10:12 ."},{"catchword":"in hare","tekst":"Dat is, in den hemel."},{"catchword":"met het licht","tekst":"Versta hier door het licht den bliksem."},{"catchword":"uw pijlen","tekst":"Pijlen is hier te zeggen hagelstenen. Zie Jos 10:11 ."},{"catchword":"uw bliksemende spies","tekst":"Dat is, de gruwelijke donderslagen met schrikkelijke bliksemen en hagelstenen vermengd, kwetsende en doodslaande als scherpe spiesen. Anders, en met den glans van uwe spiesen."}],"12":[{"catchword":"Met gramschap","tekst":"Of, in gramschap."},{"catchword":"door het land,","tekst":"Te weten door het land Kanaän, toen Gij de Kanaänieten uitdreeft om uw volk daarin te planten."},{"catchword":"dorstet Gij","tekst":"Zie deze manier van spreken en straffen Amo 1:3 , en Mic 4:13 ."},{"catchword":"de heidenen","tekst":"Te weten die in het land Kanaän woonden, zijnde zeven in getal."}],"13":[{"catchword":"tot verlossing met","tekst":"Dat is, om te helpen met of door uwen gezalfde, dat is, met Christus, wiens voorbeeld Jozua geweest is. Anderen verstaan hier David door den gezalfde, die ook een voorbeeld van Christus was, wiens overwinningen beschreven staan 2Sa 5"},{"catchword":"het hoofd van","tekst":"Dat is, de vorsten en heren des volks, hetwelk zich krachtiglijk tegen de Israelieten stelde, gelijk waren de Filistijnen, Moabieten, Ammonieten, Syriëers, Edomieten enz."},{"catchword":"den grond tot","tekst":"Versta hier door den grond het land zelf, hetwelk de Heere van onder tot boven gezuiverd heeft van de vijanden van zijn volk, aangezien zij het alzo bedekt hadden en alzo daarin geworteld waren, dat het scheen onmogelijk te zijn hen daaruit te roeien; zie boven vs.6. Of de zin is: Gij hebt uws volk vijanden te schande gemaakt van het hoofd tot de voeten toe, dat is, van den grootste tot den kleinste."},{"catchword":"Sela","tekst":"Zie boven vs.3, 9."}],"14":[{"catchword":"zijn staven","tekst":"Te weten van den gezalfde, of met uws volks staven of stokken. De zin is: Gij hebt degenen, die op de dorpen en omliggende plaatsen overig waren en uw volk kwelden, door uwen gezalfde zo te schande gemaakt, alsof Gij hen het hoofd met een boor doorboord hadt. Anders: met hunne, te weten met hun eigen staven, dat is, met dezelfde middelen, door welke zij uw volk dachten te verdelgen."},{"catchword":"mij te verstrooien;","tekst":"Te weten mijn volk, de Israëlieten."},{"catchword":"die zich verheugden","tekst":"Hebr. hunlieder verheuging was, enz."},{"catchword":"de ellendigen","tekst":"Te weten de ellendige bedrukte, ja, schier verdrukte Israëlieten, die dikwijls uit vrees der vijanden zich moesten versteken in holen en spelonken ten tijde der richters, want het scheen dat zij hen met huid en met haar zouden opeten en verslinden."}],"15":[{"catchword":"met uw paarden","tekst":"Zie boven vs.8."},{"catchword":"de geweldige","tekst":"Of, door, of op, den hoop van vele [of grote] wateren. Versta dit van de grote hopen wateren der Rode zee, die als muren overeind stonden, als de Israelieten daardoor gingen. Verg. Jos 3:13 ."}],"16":[{"catchword":"Als ik het","tekst":"Als ik hoorde het oordeel Gods van de verstoring der stad Jeruzalem door de Chaldeën, boven vs.2."},{"catchword":"mijn buik beroerd;","tekst":"Dat is, al wat in mij was; of mijn hart; gelijk Pro 20:27 ; verg. Isa 16:11 . Anders: zo beefde mijn buik."},{"catchword":"voor de stem","tekst":"Dat is, als ik die profetie van de verstoring van Jerzalem van den Heere hoorde; zie boven Hab 1:6 ."},{"catchword":"verrotting kwam","tekst":"Dat is, het deed mij zeer wee, ja zo wee alsof mijne benen vervuild en vol etter waren geworden."},{"catchword":"mijn plaats","tekst":"Dat is, in de plaats waar ik tegenwoordig sta, of stond, toen ik die stem hoorde."},{"catchword":"Zekerlijk, ik zal","tekst":"Of, immers. Zie van zulke ene betekenis van het Hebr. woord, Hos 14:4 . Of, ik die rusten zal, of opdat ik ruste. Hier richt zich de profeet weder op door betrachting van Gods genadige regering."},{"catchword":"hij optrekken zal","tekst":"Te weten de koning van Babel."},{"catchword":"tegen het volk,","tekst":"Te weten tegen het volk van Juda. Zie de historie 2Ki 25 ."}],"17":[{"catchword":"Alhoewel de","tekst":"De zin is: Alhoewel het Joodse land door de Chaldeën zeer jammerlijk aan alle kanten zal verwoest worden."},{"catchword":"dat het werk","tekst":"Dat is, de vrucht"},{"catchword":"liegen zal,","tekst":"Dat is, niet te voorschijn komen zal, maar den landman in zijne hoop bedriegen zal. Zie dergelijke manier van spreken. Job 40:28 , en Isa 58:11 ."},{"catchword":"spijs","tekst":"Dat is, gene vruchten tot spijs en voedsel der mensen en der beesten."},{"catchword":"voortbrengen;","tekst":"Hebr. maken."},{"catchword":"kudde uit de","tekst":"Of, het vee, versta, klein vee, als schapen en geiten."},{"catchword":"geen rund","tekst":"Dat is, geen grote beesten, als ossen en koeien."}],"18":[{"catchword":"ik nochtans","tekst":"Ik Habakuk, en alle gelovigen."},{"catchword":"van vreugde","tekst":"Vanwege den troost, dien de Heere mij toegesproken heeft, van de verlossing van zijn volk. Zie boven Hab 2 , Hab 3 ."},{"catchword":"in den God","tekst":"Of, vanwege God mijnen Heiland, of in den God mijns heils; dat is, die mij heil en zaligheid heeft teweeggebracht,. Het Hebr. woord, te weten zaligmaking, of zaligheid, heil en het woord Jezus, hebben een wortel of oorsprong, zodat dit bekwamelijk op Christus gepast wordt."}],"19":[{"catchword":"is mijne sterkte;","tekst":"Dat is, die mij sterkte geeft, zijne macht wordt in mijne onmacht volbracht."},{"catchword":"Hij zal mijn voeten","tekst":"Dat is, Hij zal maken dat ik allen nood en gevaar zal kunnen ontlopen, mitsgaders alle zwarigheid gelukkiglijk zal kunnen overwinnen. Dit staat ook 2Sa 22:34 ; zie aldaar de aantekening en verg. het met 2Sa 1:23 ."},{"catchword":"als der hinden,","tekst":"Te weten, zo snel en zo gauw als de hinden of herten. Zie 2Sa 22:34 , en verg. dit met Psa 18:34 ."},{"catchword":"Hij zal mij doen","tekst":"Dat is, Hij zal mij wederbrengen in mijn land te weten in het land van Juda, hetwelk hoog en bergachtig is. Of versta hier door hoogten vast sloten en sterkten."},{"catchword":"Voor den opperzangmeester","tekst":"De zin is, dit gebed van Habakuk den opperzangmeester overgegeven, om te zingen in de verzameling der gemeente op neginoth, of op neginothai. Anderen zetten het over op mijne snarenspel, of op mijn instrument met snaren. Zie hiervan breder Psa 4:1 . Dit laatste lid zou men ook alleen mogen schrijven, na de woorden op mijne hoogte een nieuwen regel beginnende, als eigenlijk tot den psalm niet behoorden, maar aldus: op mijne hoogten. Voor den opperzangmeester op mijn neginoth."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"A prayer of Habakuk, the prophet, on Sigjonoth. [i.e. set in various meter. The meaning is that it was to be sung after the manner of the songs which are called Sigjonoth. See Psalms 7 on verse 1. some render it, for the unknown, or, the unknowing, ignorant (ones) i.e. to crave pardon at God&acirc;&euro;&trade;s hand, for the sins of the people, which they committed ignorantly; but this is not so well liked by others, there being no such matter treated of in this Psalms.]"}],"2":[{"catchword":null,"tekst":"LORD, when I heard thy saying, [Heb. Heard thy hearing i.e. that thou wast pleased to reveal unto me, viz the fearfull judgements, threatened to thy people. See above chapter 1.5, c.] I was afraid, thy work O LORD keep that alive [some by the work here understand the people and the church of God, that being the very chiefest of all the works of God, as Psa 100:3. Isa. 29.23. and 45.11. others understand it thus: keep that up in good state and condition, which thou hast wrought among the people, whom thou hast so mightily and wonderfully kept and protected hitherto; much to the same sense, as the former] in the midst of the yeares, [i.e. during the 70 years captivity in Babylon] make it known in the midst of the years: [the sense is: cause thy people to know and understand this, by the word and the preaching thereof, and make it effectually appear among the heathen, that thou art mindefull of, and wilt have mercy on, thy people] in the wrath remember mercy. [spoken of God after the manner of men. See Gen. 8.1. and 9.15 and 30.22. Ex. 6.4. Now that God in his anger is mindefull of companion, the same appears by many places of scripture, as Ex. 32.11,12. Num. 14.17. Isa. 12.1. Jer. 14.7. Lam. 3.55. Dan. 3.89,90 and chap. 9.6,16. Psa 6:5 and 9.10,11 and 25.6,7 and 51.3 and 103.6.7,8,9. and elsewhere.]"}],"3":[{"catchword":null,"tekst":"God [in this and some of the following verses the prophet describes the majesty and power of God, which he shewed at the promulgation of his law, intimating thereby, that it is an easy thing for that puissant god, to deliver his people again out of the Babylonian captivity, whenever it shall please him] came, [i.e. he appeared to his people, viz. in Mosehs time, at the giving of his law to them. Heb. Shall come, see Deut. 33.2.] from Theman, [whereby some understand the mountain otherwise called Seir. See Amos 1.12 and Obad. 9. Oth. From the south] and the holy one [viz. of Israel] from the mountain of paran. [see of Gen. 14.6. a mountain lying near that of Sanai, which lay in the wilderness of paran. See Num. 10.11,12. and 12.1. and 13.27. Sela! [this word is found no where but in this song of Habakkuk and in the Psalms of David. See Psa 3:3.] his glory [or, majesty] covered the heavens, and the earth was full of his praise. [this is to be understood in regard of the glorious appearance of God unto his people, when he gave them his law with thunder and lightnings, c. see Ex. 19.16 & 2 Cor. 3.7.]"}],"4":[{"catchword":null,"tekst":"And there was a splendour as of the light, [i.e. as of the sun is called the light, as being the greatest body of light that god created. See Job 21. on verse 26 and 37.21. and hereby the splendour as of the light is to be understood the splendour of fire, which shone to the Israelites in the wilderness] he had horns at his hand, [i.e. at his side. See Neh. 3.2. 2 Sam. 18.4. Prov. 8.3. the meaning is; on each side there was a horn; as the horned beasts have on each Oth. There were two horns on his side. This is said, to be token his power, for by horns is frequently in scripture understood power. Oth. Understand here by horns, such beams as the bright shinning sun casts forth, or, such as went forth from the face of Moseh, after that he had spoken with God. See Ex. 24.29.] and there his strength was hid. [Heb. The hiding of his strength. The meaning is, that by the splendour here spoken of, God made indeed his power known, (Compare Psa 18:12,13, c. yet so nevertheless, that he did not let people see his power and glory, but some rayes onely of the same, left the people should be too much dismayed and terrified, by beholding all the majesty of the LORD.]"}],"5":[{"catchword":null,"tekst":"Before his face (there) went the pestilence [i.e. he destroyed the nations which rose up against his people with all manner of plagues, viz. the Amorites, Sihon, and Og, c. the phrase is borrowed from the kings and prince of this world. As they use to have many servants and officers march before them, so when God is wroth, and will proceed to judgement, he sends forth before his face, as it were all manner of plagues and diseases, and other miseries and calamities. See Ex. 9.3,6,24. Num. 14.12.] and the fiery cole [or, carbuncle. See Deut. 32.24. and Psalms 78 on verse 48.] went on before his feet."}],"6":[{"catchword":null,"tekst":"He stood [the LORD namely, represented by the ark, which remained fourteen years at Gilgal, until the Jews had divided the land of Canaan among themselves] and measured [that which was done at Gods command, God attributes unto himself; for the land was divided and meted out of the Israelites at God&acirc;&euro;&trade;s own command, by lot, Num. 32 and 34. Jos. 1.5,11,12. Psa 78:55.] the land, [viz. of Canaan.] he looked on and made the heathen loose, [or, dissolved them i.e. his stern or severe countenance was enough to dislodge and drive out all these nations though never so firmly rooted in that land, that is, he dispossessed and expelled the Canaanites, which formerly inhabited those countries] and the lasting mountains were destroyed; the hills of eternity bowed themselves. [thus the hills and mountains are set out, because of their firm and stedfast abode. See Ezekiel 36. on verse 2. they are said to bow themselves as shewing submission and reverence to him] the courses of age are his. [or, belong to him; or, he had everlasting wayes, or courses, walks; i.e. his wayes are everlasting, or, the LORD did bring to pass what he had decreed from everlasting. He is alone eternal and his determinations, whereby he governeth the world are from all eternity.]"}],"7":[{"catchword":null,"tekst":"I saw [speaking in the name of all the people of Israel; whereof see Exo. 15.14. or, I saw, that is, I am as sure of it, as if I beheld it with my own eyes] the tents of Cusan [or, of the Moors of Ethiopians, understand withal and of all the other adjacent nations. See Jud. 3.8.] under the vanity: [or in toyl, or, pressure or, given up to vanity, that is vainly and to no purpose persecuting the people of God] the curtains [i.e. the tents made of curtains; see the history Jud. 7.21.] of the land of Midian shaked, [or, were moved, or, trembling. It seemes the prophet hath respect here to the defeat of Cusehan-Rifehataim. Jud. 3.10 and of the Midianites, Juda 6 and 7.]"}],"8":[{"catchword":null,"tekst":"Was the LORD incensed against the rivers? [viz. against the red sea, and the Jordan, which he clave asunder as it were, the sense is, seemed indeed, that the LORD was wroth against the rivers, but that was not the cause of his striking them, but onely that his people might pass&Atilde;&copy; through them] was the wrath against the rivers, was thine indignation against the sea, that thou rodest upon thine horses; [i.e. upon the clouds, and the fiery piller, which are as the horses of the LORD, he moving and running them whithersoever he pleaseth, as th rider his horse under him; or, to ride upon horses may here signifie, speedily to advance and execute] thy charets were salvation: [as whereby thou didst bring salvation and deliverance to thy people: it seems that this hath regard to the history desribed Exo. 13.21 and 14.14.]"}],"9":[{"catchword":null,"tekst":"The naked ground was discovered [Or, the nakedness of the sea, to wit, of the red sea and of Jordan, made it self, or, was made, naked] (through) thy bowe, [or, with thy bowe, i.r. by thy power and command. Oth. Thy bowe was made bare and naked. See Isa. 63.22. Psa 114:5] (because) of the oaths, made to the tribes (by) the word, [understand the oaths and promises which the LORD made to Abraham. Gen. 15.14,15 and 17.8. and unto the rest of the Patriarchs; therefore it is said here oaths in the plural, because of the renewing of his oath. Some read thus; naked is thy bowe, awaked for thy oaths sake (made) in the word &c.] sela; thou hast cleft the Rivers of the earth. [Or, thou hast cleft the earth with the rivers. See Num. 20.10,11 and 21.16. Psa 78:15,16. and 114.15 and 1 Cor. 10.4. Oth. Thou clavest the Rivers unto the (very) ground, that the people of Israel might go through it.]"}],"10":[{"catchword":null,"tekst":"The mountains saw thee, and suffered pain: [viz. for fear and aw of thee; or, when the mountains saw thee, they were affrighted: this some refer to the time of the promulgation of the law. Exo. 19.17. see Psalms 114. on verse 4,6.] the water stream [to wit of Jordan. Oth. The overstowing of water] past away [i.e. run quite away, because the waters from above stood still encreasing, whiles the lower decreased ran away. See Jos. 3.16.] the abysse gave up his voice [or, the bottom, or depth of the red sea was heard, to wit, running downwards with a great noise and force, the one part tearing or building away from the other] he lifted up his sides (in) the height. [Heb. His hands i.e. those heaps of water which standing upright from both shores, were as hands to the body. This is to be understood only of the one part of those waters, which stood in as a well unmoveable, until the Israelites were quite past thorow: the other part ran downward, all away, making thus a drie and commodious passage for them. Oth. The de // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {

  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;

      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;

    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }

}

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
