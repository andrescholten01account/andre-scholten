eschreven is: Er is niemand rechtvaardig, ook niet één; er is niemand die verstandig is, er is niemand die God zoekt.", "Spr 1:7": "De vrees van de HEERE is het beginsel van de wetenschap; de dwazen verachten wijsheid en tucht.", "Spr 11:12-14": "Wie zonder verstand is, veracht zijn naaste; maar een man van groot verstand zwijgt stil. Wie als een achterklapper rondgaat, openbaart het geheime; maar wie trouw is van geest, bedekt de zaak. Als er geen wijs beleid is, valt het volk; maar de behoudenis is in de veelheid van raadslieden.", "Jes 30:13": "Daarom zal deze misdaad voor u zijn als een vallende scheur, uitwaarts gebogen in een hoge muur, waarvan de breuk snel, in een ogenblik, komen zal.", "Deut 32:8": "Toen de Allerhoogste aan de volken de erfenis uitdeelde, toen Hij Adams kinderen van elkaar scheidde, heeft Hij de grenzen van de volken vastgesteld naar het getal van de kinderen van Israël.", "Spr 14:31": "Wie de arme verdrukt, smaadt zijn Maker; maar wie zich over de behoeftige ontfermt, eert Hem.", "Spr 16:16": "Hoeveel beter is het wijsheid te verkrijgen dan goud, en voortreffelijker: verstand te verkrijgen dan zilver!", "Spr 15:13": "Een vrolijk hart maakt het gezicht blij; maar door verdriet in het hart wordt de geest verslagen.", "Ps 6:6": "Want in de dood is aan U geen gedachtenis; wie zal U loven in het graf?", "Spr 29:6": "In de overtreding van een boze man is een valstrik; maar de rechtvaardige juicht en is blij.", "Spr 12:24": "De hand van de vlijtigen zal heersen; maar de bedriegers zullen onder cijns wezen.", "Amos 3:5": "Zal een vogel in de strik op de aarde vallen, als er geen strik voor hem is? Zal men de strik van de aardbodem opnemen, als men helemaal niets gevangen heeft?", "Job 9:2": "Waarlijk, ik weet dat het zo is; want hoe zou de mens rechtvaardig zijn bij God?", "Jes 19:8": "En de vissers zullen treuren, en allen die de angel in de stromen werpen, zullen rouw bedrijven; en zij die het werpnet uitspreiden op het water, zullen kwijnen.", "Luk 11:41": "Geef liever als aalmoes wat erin is; en zie, dan is alles voor u rein.", "1 Kor 14:12": "Zo ook u: omdat u ijverig bent naar geestelijke gaven, zoek dan dat u overvloedig mag zijn tot stichting van de Gemeente.", "Neh 8:11-13": "Verder zei hij tegen hen: Ga, eet het vette, en drink het zoete, en stuur delen aan hen voor wie niets bereid is, want deze dag is heilig voor onze Heere; wees dus niet bedroefd, want de blijdschap van de HEERE, die is uw sterkte. En de Levieten stilden heel het volk, en zeiden: Wees stil, want deze dag is heilig, dus wees niet bedroefd. Toen ging heel het volk weg om te eten en te drinken en delen te sturen en grote blijdschap te bedrijven; want zij hadden de woorden begrepen die men hun bekendgemaakt had.", "2 Kron 30:23-27": "Toen de hele gemeente overlegd had, om nog zeven andere dagen te houden, hielden zij nog zeven dagen met blijdschap. Want Hizkia, de koning van Juda, gaf de gemeente duizend stieren en zevenduizend schapen; en de leiders gaven de gemeente duizend stieren en tienduizend schapen; de priesters nu hadden zich in groten getale geheiligd. En de hele gemeente van Juda verblijdde zich, alsook de priesters en de Levieten, en de hele gemeente van hen die uit Israël gekomen waren; ook de vreemdelingen, die uit het land van Israël gekomen waren, en die in Juda woonden.", "Luk 14:31": "Of welke koning die ten strijde trekt om tegen een andere koning te vechten, gaat niet eerst zitten om te overleggen of hij wel in staat is om met tienduizend man degene te ontmoeten die met twintigduizend man tegen hem optrekt?", "Ex 24:8-11": "Toen nam Mozes dat bloed, en sprengde het op het volk; en hij zei: Zie, dit is het bloed van het verbond, dat de HEERE met u gemaakt heeft over al die woorden. Mozes nu en Aäron klommen omhoog, ook Nadab en Abihu, en zeventig van de oudsten van Israël. En zij zagen de God van Israël, en onder Zijn voeten als een werk van saffierstenen, en als de gestalte van de hemel in Zijn klaarheid.", "Spr 10:5": "Wie in de zomer verzamelt, is een verstandig zoon; maar wie in de oogst vast slaapt, is een zoon die beschaamd maakt.", "Ps 73:12-17": "Zie, dezen zijn goddeloos; toch hebben zij rust in de wereld; zij vermeerderen hun vermogen. Zeker heb ik tevergeefs mijn hart gezuiverd, en mijn handen in onschuld gewassen. Want ik ben de hele dag geplaagd, en mijn straf is er elke morgen.", "Openb 1:14": "En Zijn hoofd en haar was wit, als witte wol, als sneeuw; en Zijn ogen als een vlam van het vuur;", "Jes 25:8": "Hij zal de dood verslinden tot overwinning, en de Heere HEERE zal de tranen van alle aangezichten afwissen; en Hij zal de smaad van Zijn volk van de hele aarde wegnemen; want de HEERE heeft het gesproken.", "Mark 10:7": "Daarom zal een man zijn vader en zijn moeder verlaten, en zich aan zijn vrouw hechten;", "Ps 96:2": "Zingt de HEERE, looft Zijn Naam; verkondigt Zijn heil van dag tot dag.", "Pred 4:2": "Daarom prees ik de doden, die al gestorven waren, boven de levenden, die tot nu toe levend zijn.", "Spr 10:14": "De wijzen leggen kennis weg; maar de mond van de dwaas is de ondergang nabij.", "Matt 26:11": "Want de armen hebt u altijd bij u, maar Mij hebt u niet altijd.", "Dan 4:17": "Deze zaak is bij besluit van de wachters, en dit verlangen is bij het woord van de heiligen; opdat de levenden weten dat de Allerhoogste heerschappij heeft over de koninkrijken van de mensen, en ze geeft aan wie Hij wil, ja, zelfs de laagste onder de mensen daarover aanstelt.", "Job 36:19": "Zou Hij uw rijkdom achten, zodat u niet in benauwdheid zou zijn; of alle versterkingen van kracht?", "Hebr 2:14": "Omdat nu de kinderen deel hebben aan vlees en bloed, heeft Hij Zelf op dezelfde manier daaraan deelgenomen, opdat Hij door de dood hem teniet zou doen die de macht over de dood had, dat is: de duivel;", "Rom 7:13-15": "Is dan het goede voor mij de dood geworden? Volstrekt niet. Maar de zonde is mij de dood geworden; opdat zij openbaar zou worden als zonde, doordat zij door het goede de dood in mij bewerkte; opdat de zonde bovenmate zou blijken te zondigen door het gebod. Want wij weten dat de wet geestelijk is, maar ik ben vleselijk, verkocht onder de zonde. Want wat ik doe, dat begrijp ik niet; want wat ik wil, dat doe ik niet, maar wat ik haat, dat doe ik.", "1 Petr 1:17": "En als u Hem als Vader aanroept, Die zonder aanzien des persoons oordeelt naar ieders werk, leef dan in ontzag gedurende de tijd van uw verblijf hier als vreemdeling;", "Jer 2:22": "Want, al wast u zich met salpeter, en nam u veel zeep, toch is uw ongerechtigheid voor Mijn aangezicht getekend, spreekt de Heere HEERE.", "2 Sam 22:6": "Banden van het graf omringden mij; strikken van de dood bejegenden mij.", "Job 16:19": "Ook nu, zie, in de hemel is mijn Getuige, en mijn Getuige in de hoogten.", "Joh 12:6": "En dit zei hij niet omdat hij bezorgd was om de armen, maar omdat hij een dief was, en de beurs had, en droeg wat erin gedaan werd.", "Pred 10:12": "De woorden van de mond van een wijze zijn aangenaam; maar de lippen van een dwaas verslinden hemzelf.", "Spr 15:7": "De lippen van de wijzen zullen de wetenschap uitstrooien; maar het hart van de zotten niet zo.", "Jer 17:9": "Arglistig is het hart, meer dan enig ding, ja, dodelijk is het; wie zal het kennen?", "Spr 21:23": "Wie zijn mond en zijn tong bewaart, bewaart zijn ziel van benauwdheden.", "Spr 7:23": "Totdat de pijl zijn lever doorsneed; zoals een vogel zich haast naar de strik, en niet weet dat die tegen zijn leven is.", "Gen 37:35": "En al zijn zonen en al zijn dochters maakten zich op om hem te troosten; maar hij weigerde zich te laten troosten en zei: Want ik zal, rouw bedrijvend, tot mijn zoon in het graf neerdalen. Zo beweende zijn vader hem.", "Lev 20:23": "En wandel niet in de gewoonten van het volk, dat Ik voor uw aangezicht wegjaag; want al deze dingen hebben zij gedaan; daarom ben Ik verdrietig op hen geworden.", "Spr 1:15": "Mijn zoon! wandel niet met hen op de weg; weer uw voet van hun pad.", "Deut 28:40": "Olijfbomen zult u hebben binnen al uw grondgebied, maar u zult u met olie niet zalven; want uw olijfboom zal zijn vrucht afwerpen.", "Joh 6:27": "Werk niet voor het voedsel dat vergaat, maar voor het voedsel dat blijft tot in het eeuwige leven, dat de Zoon des mensen u geven zal; want Hem heeft God de Vader verzegeld.", "Kol 1:13": "Die ons getrokken heeft uit de macht van de duisternis, en overgezet heeft in het Koninkrijk van de Zoon van Zijn liefde;", "Mal 3:15": "En nu, wij achten de hoogmoedigen gelukzalig; ook wie goddeloosheid doen, worden gebouwd; ook verzoeken zij de HEERE, en ontkomen.", "Joh 13:7": "Jezus antwoordde en zei tegen hem: Wat Ik doe, weet u nu niet, maar u zult het hierna verstaan.", "Ezra 7:23": "Alles wat naar het bevel van de God van de hemel is, dat dat vlijtig gedaan wordt, voor het huis van de God van de hemel; want waartoe zou er grote toorn zijn over het koninkrijk van de koning en zijn kinderen?", "Spr 18:15": "Het hart van de verstandigen verwerft kennis, en het oor van de wijzen zoekt kennis.", "Jes 1:5": "Waartoe zou u nog meer geslagen worden? U zou van het afval des te meer maken; het hele hoofd is ziek, en het hele hart is mat.", "Job 25:4-6": "Hoe zou dan een mens rechtvaardig zijn bij God, en hoe zou hij zuiver zijn, die van een vrouw geboren is? Zie, zelfs de maan geeft geen schijnsel, en de sterren zijn niet zuiver in Zijn ogen. Hoeveel te minder de mens, die een made is, en het mensenkind, die een worm is!", "Job 34:24": "Hij vermorzelt de geweldigen, dat men het niet doorzoeken kan, en stelt anderen in hun plaats.", "Joh 10:29": "Mijn Vader, die ze Mij gegeven heeft, is meer dan allen; en niemand kan ze rukken uit de hand van Mijn Vader.", "Luk 17:26-31": "En zoals het gebeurde in de dagen van Noach, zo zal het ook zijn in de dagen van de Zoon des mensen. Zij aten, zij dronken, zij namen ten huwelijk, zij werden ten huwelijk gegeven, tot de dag waarop Noach in de ark ging, en de zondvloed kwam en hen allen verdierf. Evenzo ook, zoals het gebeurde in de dagen van Lot: zij aten, zij dronken, zij kochten, zij verkochten, zij plantten, zij bouwden;", "Pred 12:7": "En het stof terugkeert tot de aarde, zoals het geweest is; en de geest terugkeert tot God, Die hem gegeven heeft.", "2 Tess 3:13": "En u, broeders, wordt niet moe in het goede te doen.", "Openb 22:17": "En de Geest en de Bruid zeggen: Kom! En laat hij die het hoort, zeggen: Kom! En laat hij die dorst heeft, komen; en laat hij die wil, het water des levens nemen, voor niets.", "1 Sam 14:36-46": "Daarna zei Saul: Laten we de Filistijnen achterna trekken, bij nacht, en hen beroven totdat het morgen licht wordt, en laten we niet één man van hen overlaten. Zij nu zeiden: Doe alles wat goed is in uw ogen; maar de priester zei: Laten we hier tot God naderen. Toen vroeg Saul God: Zal ik de Filistijnen achterna trekken? Zult U ze in de hand van Israël overgeven? Maar Hij antwoordde hem die dag niet. Toen zei Saul: Kom hierheen, alle hoofden van het volk, en onderzoek en kijk waarin deze zonde vandaag gebeurd is.", "Mal 2:14-16": "U zegt nu: Waarom? Omdat de HEERE een Getuige geweest is tussen u en de vrouw van uw jeugd, met wie u trouweloos handelt; terwijl zij toch uw metgezellin is, en de vrouw van uw verbond. Heeft Hij niet maar één gemaakt, hoewel Hij van de Geest overvloed had? En waarom die ene? Hij zocht een zaad van God. Daarom, wees op uw hoede met uw geest, en laat niemand trouweloos handelen tegen de vrouw van zijn jeugd. Want de HEERE, de God van Israël, zegt dat Hij het wegzenden haat, hoewel hij het geweld bedekt met zijn kleed, zegt de HEERE van de heerscharen; daarom wees op uw hoede met uw geest, dat u niet trouweloos handelt.", "Openb 19:14": "En de legers in de hemel volgden Hem op witte paarden, gekleed met wit en rein fijn linnen.", "Pred 8:15": "Daarom prees ik de blijdschap, omdat de mens niets beters heeft onder de zon, dan te eten, en te drinken, en blijde te zijn; want dat zal hem bijblijven van zijn arbeid, de dagen van zijn leven, die God hem geeft onder de zon.", "Ef 5:15-17": "Kijk dan goed hoe u voorzichtig wandelt, niet als onwijzen, maar als wijzen, en koop de tijd uit, omdat de dagen slecht zijn. Wees daarom niet onverstandig, maar begrijp wat de wil van de Heere is.", "Jes 45:23": "Ik heb bij Mijzelf gezworen, er is een woord van gerechtigheid uit Mijn mond gegaan, en het zal niet terugkeren: dat voor Mij alle knie zich zal buigen, alle tong Mij zal zweren.", "Rom 5:12": "Daarom, zoals door één mens de zonde in de wereld ingekomen is, en door de zonde de dood; en zo de dood tot alle mensen doorgegaan is, doordat allen gezondigd hebben.", "Spr 24:1": "Wees niet jaloers op de slechte mensen, en laat u niet drijven om bij hen te zijn.", "Spr 23:20": "Wees niet onder de wijnzuipers, ook niet onder de vleesvreters;", "Joz 7:5": "En de mannen van Ai versloegen van hen ongeveer zesendertig man, en achtervolgden hen vanaf de poort tot Schebarim toe, en versloegen hen bij de afgang. Toen versmolt het hart van het volk, en het werd tot water.", "Deut 12:12": "En u zult vrolijk zijn voor het aangezicht van de HEERE, uw God, u, en uw zonen, en uw dochters, en uw dienstknechten, en uw dienstmaagden, en de Leviet die in uw poorten is; want hij heeft geen deel noch erfenis met u.", "Spr 14:16": "De wijze vreest, en wijkt van het kwade; maar de dwaas is opvliegend en zorgeloos.", "Spr 14:21": "Wie zijn naaste veracht, zondigt; maar wie zich over de nederigen ontfermt, die is gelukkig.", "Ps 146:4": "Zijn geest gaat uit, hij keert terug tot zijn aarde; op diezelfde dag vergaan zijn plannen.", "1 Sam 20:2": "Hij daarentegen zei tegen hem: Dat zij verre, u zult niet sterven. Zie, mijn vader doet geen grote zaak, en geen kleine zaak, die hij niet aan mij bekendmaakt; waarom zou dan mijn vader deze zaak voor mij verbergen? Dat is niet zo.", "Spr 18:4": "De woorden uit de mond van een man zijn diepe wateren; en de bron van wijsheid is een stromende beek.", "1 Tim 5:8": "Maar als iemand voor de zijnen, en vooral voor zijn huisgenoten, niet zorgt, die heeft het geloof verloochend, en is erger dan een ongelovige.", "Spr 21:8": "De weg van de mens is hele verkeerd en vreemd; maar het werk van de zuivere is recht.", "Dan 7:9": "Dit zag ik, totdat er tronen gezet werden, en de Oude van dagen Zich zette, Wiens kleed wit was als de sneeuw, en het haar van Zijn hoofd als zuivere wol; Zijn troon was vuurvonken, de raderen ervan een brandend vuur.", "Pred 8:7": "Want hij weet niet wat er gebeuren zal; want wie zal het hem bekendmaken, wanneer het zal gebeuren?", "Rom 6:6": "Terwijl wij dit weten, dat onze oude mens met Hem gekruisigd is, opdat het lichaam van de zonde tenietgedaan wordt, opdat wij niet meer de zonde dienen.", "2 Tess 3:10-12": "Want ook toen wij bij u waren, hebben wij u dit bevolen: dat als iemand niet wil werken, hij ook niet moet eten. Want wij horen dat sommigen onder u ongeregeld wandelen, niet werkend, maar bezig met bemoeizucht. Doch zulke mensen bevelen en vermanen wij door onze Heere Jezus Christus, dat zij met rust werkend hun eigen brood eten.", "Mark 6:3": "Is Deze niet de timmerman, de zoon van Maria, en de broer van Jakobus en Joses, en van Judas en Simon? En zijn Zijn zusters niet hier bij ons? En zij namen aanstoot aan Hem.", "Neh 4:2": "Hij sprak in het bijzijn van zijn broeders en van het leger van Samaria, en zei: Wat doen deze zwakke Joden? Zullen zij zichzelf versterken? Zullen zij offeren? Zullen zij het in één dag afmaken? Zullen zij de stenen uit de puinhopen weer levend maken, terwijl die verbrand zijn?", "Gen 24:3": "opdat ik u laat zweren bij de HEERE, de God van de hemel en de God van de aarde, dat u voor mijn zoon geen vrouw zult nemen van de dochters van de Kanaänieten, in het midden van wie ik woon;", "Job 12:3": "Ik heb ook een hart, net zoals u; ik ben niet minder dan u; en bij wie zijn niet zulke dingen bekend?", "Ps 75:7": "Want het verhogen komt niet uit het oosten, noch uit het westen, noch uit de woestijn;", "Job 16:5": "Ik zou u versterken met mijn mond, en de beweging van mijn lippen zou de smart verzachten.", "Spr 5:19": "Een zeer lieflijke hinde, en een aangenaam steengeitje; laat haar borsten u altijd dronken maken; dool voortdurend in haar liefde.", "Hos 7:12": "Wanneer zij zullen heengaan, zal Ik Mijn net over hen uitspreiden, Ik zal ze als vogels van de hemel doen neerdalen. Ik zal ze tuchtigen, zoals gehoord is in hun samenkomst.", "Klaagl 3:52": "Tsade. Zij die mijn vijanden zijn zonder oorzaak, hebben mij als een vogeltje dapper gejaagd.", "Spr 27:23": "Wees ijverig om het gezicht van uw schapen te kennen; richt uw hart op de kudden.", "Job 9:29": "Ik zal toch goddeloos verklaard worden; waarom dan zal ik zonder nut zwoegen?", "Dan 4:25": "Namelijk, men zal u van de mensen verstoten, en met het gedierte van het veld zal uw woning zijn, en men zal u gras te eten geven, zoals de ossen; en u zult door de dauw van de hemel nat gemaakt worden, en er zullen zeven tijden over u voorbijgaan, totdat u weet dat de Allerhoogste heerschappij heeft over de koninkrijken van de mensen, en ze geeft aan wie Hij wil.", "Spr 22:24": "Ga geen vriendschap aan met een driftig man, en ga niet om met een zeer grimmig man;", "Job 30:23": "Want ik weet dat U mij ter dood zult brengen, en tot het huis der samenkomst van alle levenden.", "Joz 24:16": "Toen antwoordde het volk en zei: Het zij verre van ons, dat wij de HEERE zouden verlaten om andere goden te dienen.", "Zach 8:16": "Dit zijn de dingen die u doen zult: spreek de waarheid, ieder met zijn naaste; oordeel de waarheid en een oordeel van vrede in uw poorten.", "Spr 29:24": "Wie met een dief deelt, haat zijn eigen leven; hij hoort een vervloeking, en geeft het niet te kennen.", "Openb 4:4": "En rondom de troon waren vierentwintig tronen; en op de tronen zag ik de vierentwintig oudsten zitten, bekleed met witte kleren, en zij hadden gouden kronen op hun hoofden.", "2 Tim 3:5": "met een schijn van godzaligheid, maar de kracht daarvan verloochenend. Heb ook een afkeer van hen.", "1 Petr 2:9": "Maar u bent een uitverkoren geslacht, een koninklijk priesterschap, een heilig volk, een volk dat God Zich verworven heeft; opdat u de deugden zou verkondigen van Hem Die u uit de duisternis geroepen heeft tot Zijn wonderbaar licht;", "Ruth 3:3": "Was u dan, en zalf u, en trek uw kleren aan, en ga naar de dorsvloer; maar maak u aan de man niet bekend, totdat hij klaar is met eten en drinken.", "Ps 82:3": "Doe recht aan de arme en de wees; geef recht aan de verdrukte en de arme.", "Matt 7:17": "Zo brengt iedere goede boom goede vruchten voort, maar een slechte boom brengt slechte vruchten voort.", "1 Kor 7:33": "maar wie getrouwd is, bekommert zich met de dingen van de wereld, hoe hij de vrouw zal behagen.", "Matt 20:15": "Of mag ik met het mijne niet doen wat ik wil? Of is uw oog boos, omdat ik goed ben?", "Ps 24:10": "Wie is Hij, deze Koning der ere? De HEERE van de heerscharen, Die is de Koning der ere. Sela.", "Luk 3:14": "En ook de soldaten vroegen hem: En wij, wat zullen wij doen? En hij zei tegen hen: Doe niemand geweld aan, en pers niemand af door bedrog, en wees tevreden met uw soldij.", "Hebr 13:5": "Laat uw wandel zonder geldgierigheid zijn, en wees tevreden met wat u hebt; want Hij heeft gezegd: Ik zal u niet begeven, en Ik zal u niet verlaten.", "1 Tess 5:5": "U bent allen kinderen van het licht en kinderen van de dag; wij zijn niet van de nacht, en ook niet van de duisternis.", "Ps 141:9": "Bewaar mij voor het geweld van de strik, die zij mij gelegd hebben, en voor de valstrikken van de werkers van de ongerechtigheid.", "Est 6:2": "En men vond geschreven dat Mordechai had bekendgemaakt dat Bigthana en Theres, twee kamerlingen van de koning, uit de dorpelwachters, van plan waren de hand te leggen aan koning Ahasveros.", "Spr 2:11": "Zo zal de bedachtzaamheid over u de wacht houden, de verstandigheid zal u behoeden;", "Spr 1:12": "Laat ons hen levend verslinden, als het graf; ja, geheel en al, zoals zij die in de kuil neerdalen;", "2 Sam 20:15-22": "En zij kwamen en belegerden hem in Abel Beth-Maächa, en zij wierpen een wal op tegen de stad, zodat hij tegen de buitenmuur stond; en al het volk dat met Joab was, beschadigde de muur, om die neer te vellen. Toen riep een wijze vrouw uit de stad: Hoort, hoort, zeg toch tegen Joab: Kom hierheen, dat ik tot u spreek. Toen hij nu tot haar naderde, zei de vrouw: Bent u Joab? En hij zei: Ik ben het; en zij zei tegen hem: Hoor de woorden van uw dienstmaagd; en hij zei: Ik luister.", "1 Tim 6:15": "die op Zijn tijd zal laten zien de gelukkige en enige machtige Heerser, de Koning der koningen en Heere der heren;", "Dan 11:32": "En hen die goddeloos handelen tegen het verbond, zal hij door vleierijen doen huichelen; maar het volk dat hun God kent, zal standhouden, en zal het doen.", "Gen 27:2": "En hij zei: Zie toch, ik ben oud geworden, ik weet de dag van mijn dood niet.", "Spr 13:20": "Die met de wijzen omgaat, zal wijs worden; maar die de metgezel van de dwazen is, zal verbroken worden.", "2 Kron 15:15": "En heel Juda was verblijd over deze eed; want zij hadden met hun hele hart gezworen, en met hun hele wil Hem gezocht; en Hij werd door hen gevonden, en de HEERE gaf hun rust van rondom.", "Ezech 36:25": "Dan zal Ik rein water op u sprenkelen, en u zult rein worden; van al uw onreinheden en van al uw drekgoden zal Ik u reinigen.", "Ps 105:7": "Hij is de HEERE, onze God; Zijn oordelen zijn over de gehele aarde.", "1 Sam 17:28": "Toen Eliab, zijn oudste broer, hem tegen die mannen hoorde spreken, ontstak de toorn van Eliab tegen David, en hij zei: Waarom bent u nu hierheen gekomen, en bij wie hebt u die paar schapen in de woestijn gelaten? Ik ken uw overmoed en de slechtheid van uw hart wel; want u bent gekomen om de strijd te zien.", "Job 3:13-19": "Want nu zou ik neerliggen, en stil zijn; ik zou slapen, dan zou voor mij rust zijn; Met de koningen en raadsheren van de aarde, die voor zich woeste plaatsen bebouwden; Of met de vorsten, die goud hadden, die hun huizen met zilver vulden.", "Ps 115:17": "De doden zullen de HEERE niet prijzen, evenmin wie in de stilte neergedaald zijn.", "Dan 5:18": "Wat u aangaat, o koning! De allerhoogste God heeft uw vader Nebukadnezar het koninkrijk, en grootheid, en eer, en heerlijkheid gegeven;", "Ps 116:3": "De banden van de dood hadden mij omvangen, en de angsten van het graf hadden mij getroffen; ik vond benauwdheid en droefenis.", "Ps 73:3": "Want ik was jaloers op de dwazen, toen ik de vrede van de goddelozen zag.", "Job 18:8": "Want met zijn voeten zal hij in het net geworpen worden, en hij zal wandelen over het wargaren.", "Job 21:26": "Zij liggen samen neer in het stof, en het gewormte overdekt hen.", "Pred 2:18-23": "Ik haatte ook al mijn arbeid die ik onder de zon verricht had, omdat ik die zou moeten achterlaten aan een mens die na mij komen zal. Want wie weet of hij wijs zal zijn of dwaas? Toch zal hij heersen over al mijn arbeid, die ik met inspanning verricht heb en waarin ik mij wijs heb betoond onder de zon. Dat is ook ijdelheid. Daarom keerde ik mij om, om mijn hart te laten wanhopen over al de arbeid die ik onder de zon verricht heb.", "Deut 4:39": "Zo zult u vandaag weten, en in uw hart overdenken, dat de HEERE die God is, boven in de hemel en beneden op de aarde, niemand anders!", "Jer 2:25": "Bedwing uw voet van ontschoeiing, en uw keel van dorst; maar u zegt: Het is buiten hoop; nee, want ik heb de vreemden lief, en die zal ik nawandelen!", "Deut 10:17": "Want de HEERE, uw God, is een God der goden, en een Heere der heren; die grote, die machtige, en die ontzagwekkende God, Die niemand aanziet naar het aangezicht, en geen geschenk aanneemt;", "Job 9:30": "Al zou ik mij wassen met sneeuwwater, en mijn handen zuiveren met zeep;", "Openb 11:13": "En op datzelfde uur gebeurde er een grote aardbeving, en het tiende deel van de stad viel, en er werden in de aardbeving zevenduizend namen van mensen gedood, en de overigen werden zeer bevreesd, en gaven de God van de hemel heerlijkheid.", "Jak 3:13": "Wie is wijs en verstandig onder u? Laat hij door zijn goede levenswandel zijn werken tonen, in zachtmoedige wijsheid.", "Jes 60:1": "Maak u op, word verlicht, want uw licht komt, en de heerlijkheid van de HEERE gaat over u op.", "2 Sam 20:2": "Toen trok alle man van Israël weg van achter David, Seba, de zoon van Bichri, achterna; maar de mannen van Juda kleefden hun koning aan, van de Jordaan af tot aan Jeruzalem.", "Ps 82:4": "Verlos de arme en de behoeftige, ruk hem uit de hand van de goddelozen.", "Gal 5:7": "U liep goed; wie heeft u verhinderd de waarheid niet gehoorzaam te zijn?", "Joh 8:32": "En u zult de waarheid kennen, en de waarheid zal u vrijmaken.", "2 Kor 6:15": "En welke overeenstemming heeft Christus met Belial, of welk deel heeft de gelovige met de ongelovige?", "Luk 21:34-36": "En let op uzelf, dat uw harten niet op enig moment bezwaard worden met brasserij en dronkenschap, en zorgen van dit leven, en dat die dag u niet onvoorzien overkomt. Want als een strik zal hij komen over allen die op de hele aardbodem gezeten zijn. Waak dan te allen tijde, en bid, dat u waardig geacht mag worden om al deze dingen die gebeuren zullen te ontvluchten, en te staan voor de Zoon des mensen.", "Rom 16:17": "En ik bid u, broeders, let op degenen die tweedracht en ergernissen veroorzaken, tegen de leer die u geleerd hebt; en blijf bij hen vandaan.", "Ps 37:6": "En Hij zal uw gerechtigheid doen voortkomen als het licht, en uw recht als de middag.", "1 Kon 15:14": "De hoogten werden wel niet weggenomen; toch was het hart van Asa volkomen met de HEERE, al zijn dagen.", "Job 8:8": "Want vraag toch aan het vorige geslacht, en stel u open voor het onderzoek van hun vaderen.", "Ps 111:10": "Resch. De vreze van de HEERE is het beginsel van de wijsheid; Schin. allen die ernaar handelen, hebben goed verstand; Thau. Zijn lof bestaat tot in eeuwigheid.", "Ps 31:6": "In Uw hand beveel ik mijn geest; U hebt mij verlost, HEERE, U, God van de waarheid!", "Spr 23:6": "Eet niet het brood van hem die boos is van oog, en wees niet belust op zijn smakelijke gerechten;", "Kol 3:19": "Mannen, heb uw vrouwen lief, en word niet verbitterd tegen haar.", "Ef 6:14-20": "Sta dan, met uw lenden omgord met de waarheid, en aangedaan met het borstwapen van de gerechtigheid; en de voeten geschoeid met bereidheid van het Evangelie van de vrede; bovenal aangenomen hebbende het schild van het geloof, waarmee u al de vurige pijlen van de boze zult kunnen uitblussen.", "Spr 29:5": "Een man die zijn naaste vleit, spreidt een net uit voor diens voeten.", "Openb 11:17": "en zeiden: Wij danken U, Heere God, Almachtige, Die is, en Die was, en Die komen zal! dat U Uw grote kracht hebt aangenomen, en als Koning hebt geheerst;", "Luk 16:21": "En hij verlangde verzadigd te worden van de kruimels die van de tafel van de rijke vielen; maar ook de honden kwamen en likten zijn zweren.", "Spr 15:30": "Het licht van de ogen verblijdt het hart; een goed bericht maakt de beenderen vet.", "Job 9:20": "Al zou ik mijzelf rechtvaardigen, mijn mond zal mij verdoemen; ben ik oprecht, Hij zal mij toch verkeerd verklaren.", "1 Kor 3:18": "Niemand bedriegt zichzelf. Als iemand onder u denkt dat hij wijs is in deze wereld, die moet dwaas worden, opdat hij wijs mag worden.", "Rom 8:13": "Want als u naar het vlees leeft, zult u sterven; maar als u door de Geest de daden van het lichaam doodt, zult u leven.", "Jer 10:10": "Maar de HEERE God is de Waarheid, Hij is de levende God, en een eeuwige Koning; van Zijn verbolgenheid beeft de aarde, en de heidenen kunnen Zijn gramschap niet verdragen.", "Openb 3:4": "Toch hebt u enkele weinige namen ook in Sardis, die hun kleren niet bevlekt hebben, en zij zullen met Mij wandelen in witte kleren, omdat zij het waard zijn.", "Ps 49:16": "Maar God zal mijn ziel uit de macht van het graf verlossen, want Hij zal mij opnemen. Sela.", "Matt 25:42": "Want Ik ben hongerig geweest, en u hebt Mij niet te eten gegeven; Ik ben dorstig geweest, en u hebt Mij niet te drinken gegeven;", "Matt 12:34": "Adderengebroed! Hoe kunt u goede dingen spreken, terwijl u slecht bent? Want uit de overvloed van het hart spreekt de mond.", "1 Kor 15:22": "Want zoals zij allen in Adam sterven, zo zullen zij ook in Christus allen levend gemaakt worden.", "Mark 7:29": "En Hij zei tegen haar: Vanwege dit woord, ga heen; de duivel is uit uw dochter weggegaan.", "Micha 5:6": "En het overblijfsel van Jakob zal zijn in het midden van veel volken, als een dauw van de HEERE, als druppels op het gras, dat naar geen man wacht, en op geen mensenkinderen hoopt.", "Rom 7:18-21": "Want ik weet dat in mij, dat is, in mijn vlees, geen goed woont; want het willen is wel aanwezig bij mij, maar het goede te doen, dat vind ik niet. Want het goede dat ik wil, doe ik niet, maar het kwade dat ik niet wil, dat doe ik. Als ik dan doe wat ik niet wil, dan doe ik dat nu niet meer zelf, maar de zonde die in mij woont.", "Matt 11:19": "De Zoon des mensen is gekomen, etend en drinkend, en zij zeggen: Zie daar, een Mens, Die een vraat en wijnzuiper is, een Vriend van tollenaars en zondaars. Maar de Wijsheid is gerechtvaardigd door haar kinderen.", "Spr 24:6": "Want door wijze raadslagen zult u voor u de oorlog voeren, en in de veelheid van raadgevers is de overwinning.", "Job 12:6": "De tenten van de verwoesters hebben rust, en zij die God tergen, hebben zekerheid, om wat God met Zijn hand toebrengt.", "Hebr 9:27": "En zoals het de mensen beschikt is eenmaal te sterven, en daarna het oordeel;", "Rom 15:18-20": "Want ik zou niet durven iets zeggen dat Christus niet door mij gewerkt heeft, tot gehoorzaamheid van de heidenen, met woorden en werken; door kracht van tekenen en wonderen, en door de kracht van de Geest van God, zodat ik, van Jeruzalem af en rondom, tot Illyricum toe, het Evangelie van Christus vervuld heb. En zo zeer begerig geweest ben om het Evangelie te verkondigen, niet waar Christus genoemd was, opdat ik niet op eens anders fundament zou bouwen;", "Job 36:18": "Omdat er grimmigheid is, pas op, dat Hij u niet misschien met een klap wegstoot; zodat u een groot rantsoen er niet af zou kunnen brengen.", "Joh 9:24-34": "Zij riepen dan voor de tweede maal de man die blind geweest was, en zeiden tegen hem: Geef God de eer; wij weten dat deze Mens een zondaar is. Hij dan antwoordde en zei: Of Hij een zondaar is, weet ik niet; één ding weet ik, dat ik blind was en nu zie. En zij zeiden opnieuw tegen hem: Wat heeft Hij u gedaan? Hoe heeft Hij uw ogen geopend?", "Spr 17:28": "Zelfs een dwaas, die zwijgt, wordt wijs geacht, en die zijn lippen toesluit, verstandig.", "Job 9:12": "Zie, Hij zal roven, wie zal het Hem doen teruggeven? Wie zal tegen Hem zeggen: Wat doet U?", "Joz 7:12": "Daarom zullen de kinderen van Israël niet kunnen standhouden voor het aangezicht van hun vijanden; zij zullen de rug keren voor het aangezicht van hun vijanden; want zij zijn in de ban. Ik zal voortaan niet meer met u zijn, tenzij u de ban uit uw midden verdelgt.", "Gen 49:6": "Mijn ziel, kom niet in hun verborgen raad; mijn eer, wordt niet verenigd met hun vergadering! Want in hun toorn hebben zij de mannen doodgeslagen, en in hun moedwil hebben zij de ossen verlamd.", "Job 8:10": "Zullen zij u niet leren, tot u spreken, en uit hun hart woorden voortbrengen?", "2 Sam 17:14": "Toen zeiden Absalom en alle mannen van Israël: De raad van Husai, de Archiet, is beter dan de raad van Achitofel. Doch de HEERE had het zo bepaald, om de goede raad van Achitofel te vernietigen, opdat de HEERE het kwaad over Absalom zou brengen.", "Kol 3:23": "En alles wat u doet, doe dat van harte, als voor de Heere en niet voor de mensen;", "Job 10:21": "Voordat ik heenga (en niet terugkom) naar een land van duisternis en van de schaduw van de dood;", "1 Tim 6:7": "Want wij hebben niets in de wereld meegebracht, het is duidelijk dat wij er ook niets uit kunnen meedragen.", "1 Kor 5:9-11": "Ik heb u in de brief geschreven dat u zich niet moet inlaten met de hoereerders; Maar niet geheel met de hoereerders van deze wereld, of met de gierigaards, of met de rovers, of met de afgodendienaars; want dan zou u wel uit de wereld moeten gaan. Maar nu heb ik u geschreven dat u zich niet moet inlaten namelijk met iemand die een broeder genoemd wordt, en toch een hoereerder is, of een gierigaard, of een afgodendienaar, of een lasteraar, of een dronkaard, of een rover; met zo iemand moet u zelfs niet eten.", "Dan 11:33": "En de leraren van het volk zullen er velen onderwijzen, en zij zullen vallen door het zwaard en door vlam, door gevangenschap en door beroving, vele dagen lang.", "Ezech 16:6": "Toen Ik bij u voorbijkwam, zag Ik u, vertrapt in uw bloed, en Ik zei tegen u in uw bloed: Leef; ja, Ik zei tegen u in uw bloed: Leef!", "1 Petr 1:5": "Die in de kracht van God bewaard wordt door het geloof tot de zaligheid, die klaarligt om geopenbaard te worden in de laatste tijd.", "Hos 7:8": "Efraïm, die vermengt zich met de volken; Efraïm is een koek die niet is omgekeerd;", "1 Petr 1:18": "want u weet dat u niet met vergankelijke dingen, zilver of goud, verlost bent uit uw zinloze levenswandel, die u van uw voorouders had overgeërfd,", "Pred 2:26": "Want Hij geeft wijsheid, kennis en vreugde aan de mens die goed is voor Zijn aangezicht; maar aan de zondaar geeft Hij de bezigheid om te verzamelen en te vergaderen, opdat Hij het geeft aan wie goed is voor Gods aangezicht. Dit is ook ijdelheid en kwelling van de geest.", "Rom 8:24-26": "Want wij zijn in hoop gered. De hoop nu, die gezien wordt, is geen hoop; want wat iemand ziet, waarom zou hij dat nog hopen? Maar als wij hopen wat wij niet zien, dan verwachten wij het met volharding. En evenzo komt ook de Geest onze zwakheden te hulp; want wij weten niet wat wij bidden moeten zoals het behoort, maar de Geest Zelf bidt voor ons met onuitsprekelijke zuchten.", "Gen 2:23": "Toen zei Adam: Dit is ditmaal been van mijn benen, en vlees van mijn vlees! Men zal haar Manninne noemen, omdat zij uit de man genomen is.", "Luk 6:30-35": "Maar geef ieder die het u vraagt; en van wie het uwe wegneemt, eis het niet terug. En zoals u wilt dat de mensen u doen, doe hun ook hetzelfde. En als u liefhebt wie u liefhebben, wat voor dank hebt u dan? Want ook de zondaars hebben lief wie hen liefhebben.", "2 Kron 31:20": "Zo deed Hizkia in heel Juda; en hij deed wat goed, en recht, en waarachtig was, voor het aangezicht van de HEERE, zijn God.", "2 Tim 3:8": "Zoals Jannes en Jambres Mozes tegenstonden, zo staan ook dezen de waarheid tegen; mensen, verdorven van verstand, verwerpelijk wat het geloof betreft.", "Ezech 36:26": "En Ik zal u een nieuw hart geven, en zal een nieuwe geest geven in het binnenste van u; en Ik zal het stenen hart uit uw vlees wegnemen, en zal u een vlezen hart geven.", "Spr 19:17": "Die zich ontfermt over de arme, leent aan de HEERE, en Hij zal hem zijn weldaad vergelden.", "Ef 1:11": "In Hem, in Wie wij ook een erfdeel geworden zijn, wij, die van tevoren voorbestemd waren naar het voornemen van Hem die alle dingen werkt naar de raad van Zijn wil;", "Ezra 6:15": "En dit huis werd voltooid op de derde dag van de maand Adar; dat was in het zesde jaar van het koninkrijk van koning Darius.", "2 Kon 6:24-33": "En het gebeurde daarna, dat Benhadad, de koning van Syrië, zijn hele leger verzamelde, en optrok, en Samaria belegerde. En er kwam grote honger in Samaria; want zie, zij belegerden de stad, totdat een ezelskop voor tachtig zilverstukken werd verkocht, en een vierde deel van een kab duivenmest voor vijf zilverstukken. En het gebeurde, toen de koning van Israël over de muur voorbijging, dat een vrouw tegen hem riep, en zei: Help mij, heer koning!", "Spr 25:11": "Een woord, op zijn tijd gesproken, is als gouden appels in zilveren gebeelde schalen.", "Spr 5:8": "Maak uw weg ver van haar vandaan, en kom niet bij de deur van haar huis;", "Spr 27:1": "Beroem u niet over de dag van morgen; want u weet niet, wat de dag zal baren.", "Luk 6:11": "Maar zij werden vervuld met woede, en overlegden met elkaar wat zij Jezus zouden aandoen.", "Ef 5:16": "en koop de tijd uit, omdat de dagen slecht zijn.", "Jes 38:18": "Want het graf zal U niet loven, de dood zal U niet prijzen; wie in de kuil neerdalen, zullen op Uw waarheid niet hopen.", "1 Kor 5:6": "Uw roem is niet goed. Weet u niet dat een beetje zuurdesem het hele deeg zuur maakt?", "Deut 5:13": "Zes dagen zult u arbeiden en al uw werk doen;", "Openb 19:6": "En ik hoorde als een stem van een grote menigte, en als een stem van veel water, en als een stem van sterke donderslagen, die zei: Halleluja, want de Heere, de almachtige God, heeft als Koning geheerst.", "Spr 10:32": "De lippen van de rechtvaardige weten wat welgevallig is; maar de mond van de goddelozen spreekt enkel verkeerdheid.", "Spr 10:8": "Wie wijs van hart is, neemt de geboden aan; maar wie dwaas is van lippen, zal ten val komen.", "Hab 2:2": "Toen antwoordde de HEERE mij, en zei: Schrijf het visioen op, en zet het duidelijk op tafels, zodat wie voorbijloopt het kan lezen.", "1 Kor 7:17": "Verder, zoals God aan ieder heeft toebedeeld, zoals de Heere ieder geroepen heeft, zo moet hij wandelen; en zo verordent ik het in alle gemeenten.", "Luk 22:32": "maar Ik heb voor u gebeden, dat uw geloof niet ophoudt; en u, als u eens bekeerd bent, versterk dan uw broeders.", "Luk 23:39-43": "En een van de kwaaddoeners die daar hingen, lasterde Hem en zei: Als U de Christus bent, verlos Uzelf en ons. Maar de ander antwoordde en bestrafte hem: Vreest u ook God niet, terwijl u in hetzelfde oordeel bent? En wij toch terecht; want wij ontvangen straf die past bij wat wij gedaan hebben; maar Deze heeft niets onbehoorlijks gedaan.", "Fil 4:12": "En ik weet vernederd te worden, ik weet ook overvloed te hebben; in alle opzichten en in alles ben ik ingewijd, zowel verzadigd te zijn als honger te lijden, zowel overvloed te hebben als gebrek te lijden.", "Mal 3:18": "Dan zult u opnieuw zien het onderscheid tussen de rechtvaardige en de goddeloze, tussen wie God dient, en wie Hem niet dient.", "Pred 7:29": "Alleen zie, dit heb ik gevonden, dat God de mens recht gemaakt heeft, maar zij hebben veel uitvindingen gezocht.", "Jer 6:7": "Zoals een bornput zijn water opgeeft, zo geeft zij haar boosheid op; geweld en verstoring wordt in haar gehoord, weedom en plaging is voortdurend voor Mijn aangezicht.", "Pred 6:6": "Ja, al leefde hij wel tweemaal duizend jaren, en zag hij het goede niet; gaan zij niet allen naar één plaats?", "1 Petr 2:25": "Want u was als dwalende schapen; maar u bent nu bekeerd tot de Herder en Opziener van uw zielen.", "Ef 2:11": "Denk daarom eraan, dat u, die eertijds heidenen was in het vlees, en die voorhuid genoemd werd door hen die genoemd worden besnijdenis in het vlees, wat met handen gebeurt;", "Pred 8:5": "Wie het gebod onderhoudt, zal niets kwaads ervaren; en het hart van een wijze weet tijd en wijze.", "Joh 3:19": "En dit is het oordeel: dat het licht in de wereld gekomen is, en de mensen hebben de duisternis liever gehad dan het licht; want hun werken waren slecht.", "Job 37:19": "Onderricht ons, wat wij Hem zeggen zullen; want wij zullen niets ordentelijk kunnen voorstellen vanwege de duisternis.", "Job 34:13": "Wie heeft Hem gesteld over de aarde, en wie heeft de hele wereld geschikt?", "Pred 2:16": "Want er zal in eeuwigheid niet meer herinnering aan een wijze zijn dan aan een dwaas; aangezien wat nu is, in de toekomstige dagen helemaal vergeten wordt; en hoe sterft de wijze? Net als de dwaas.", "Matt 6:17": "Maar u, als u vast, zalf dan uw hoofd en was uw gezicht;", "Jes 43:15": "Ik ben de HEERE, uw Heilige; de Schepper van Israël, uw Koning.", "Ps 97:5": "De bergen smelten als was voor het aangezicht van de HEERE, voor het aangezicht van de Heere van de hele aarde.", "Openb 7:13": "En een van de oudsten antwoordde en zei tegen mij: Wie zijn deze mensen die bekleed zijn met de lange witte kleren, en waar zijn zij vandaan gekomen?", "Neh 3:1-16": "En Eljasib, de hogepriester, maakte zich op met zijn broeders, de priesters, en zij bouwden de Schaapspoort; zij heiligden ze, en richtten haar deuren op; ja, zij heiligden ze tot aan de toren Mea, tot aan de toren Hananeel. En aan zijn hand bouwden de mannen van Jericho; ook bouwde aan zijn hand Zakkur, de zoon van Imri. De Vispoort nu bouwden de kinderen van Senaä; zij zolderde die, en richtten haar deuren op, met haar sloten en haar grendelen.", "Spr 12:1": "Wie de tucht liefheeft, heeft de wetenschap lief; maar wie de bestraffing haat, is redeloos.", "Rom 6:20": "Want toen u dienstknechten was van de zonde, was u vrij van de gerechtigheid.", "Ps 53:2-4": "De dwaas zegt in zijn hart: Er is geen God; zij verderven het, en zij bedrijven gruwelijk onrecht; er is niemand die goed doet. God heeft uit de hemel neergezien op de mensenkinderen, om te zien of iemand verstandig was, die God zocht. Een ieder van hen is teruggekeerd, samen zijn zij stinkend geworden, er is niemand die goed doet, ook niet één.", "Spr 13:11": "Goed, dat door ijdelheid gekomen is, zal verminderd worden; maar die met de hand verzamelt, zal het vermeerderen.", "Spr 28:6": "De arme, die in zijn oprechtheid wandelt, is beter dan wie verkeerd is van wegen, al is hij rijk.", "Gen 14:18-20": "En Melchizedek, koning van Salem, bracht brood en wijn; en hij was een priester van de allerhoogste God. En hij zegende hem en zei: Gezegend zij Abram door God, de Allerhoogste, Die hemel en aarde bezit! En gezegend zij de allerhoogste God, Die uw vijanden in uw hand overgeleverd heeft! En hij gaf hem het tiende deel van alles.", "1 Sam 14:29": "Toen zei Jonathan: Mijn vader heeft het land in moeilijkheden gebracht; kijk toch hoe helder mijn ogen zijn geworden, omdat ik een beetje van deze honing geproefd heb.", "Dan 10:3": "Smakelijk voedsel at ik niet, en vlees of wijn kwam niet in mijn mond; ook zalfde ik mij helemaal niet, totdat die drie volle weken vervuld waren.", "Ps 144:4": "De mens lijkt op een ademtocht; zijn dagen zijn als een voorbijgaande schaduw.", "Joz 23:6-13": "Zo weest zeer sterk, om te bewaren en om te doen alles, wat geschreven is in het wetboek van Mozes; opdat u daarvan niet afwijkt naar rechts noch naar links; Dat u niet ingaat tot deze volken: deze, die overgebleven zijn bij u; gedenkt ook niet aan de naam van hun goden, en laat er niet bij zweren, en dient hen niet, en buigt u voor hen niet; Maar de HEERE, uw God, zult u aanhangen, zoals u tot op deze dag gedaan hebt.", "Ps 73:6": "Daarom omringt hen de hoogmoed als een keten; het geweld bedekt hen als een gewaad.", "Job 21:33": "De kluiten van het dal zijn hem zoet, en hij trekt achter zich alle mensen aan; en van hen die vóór hem geweest zijn, is geen getal.", "Spr 15:23": "Een man heeft blijdschap in het antwoord van zijn mond; en hoe goed is een woord op zijn tijd!", "Num 33:55": "Maar als u de inwoners van het land niet voor uw aangezicht uit hun bezit verdrijft, dan zal het gebeuren dat wie u van hen laat overblijven, tot doornen zullen zijn in uw ogen, en tot prikkels in uw zijden, en u zullen benauwen in het land waarin u woont.", "Jes 38:1": "In die dagen werd Hizkia ziek tot de dood toe; en de profeet Jesaja, de zoon van Amoz, kwam bij hem en zei tegen hem: Zo zegt de HEERE: Regel uw zaken; want u zult sterven en niet leven.", "Deut 32:41-43": "Als Ik Mijn glinsterend zwaard scherp, en Mijn hand grijpt naar het gericht, zo zal Ik wraak op Mijn tegenpartijen doen wederkeren, en Mijn haters vergelden. Ik zal Mijn pijlen dronken maken van bloed, en Mijn zwaard zal vlees eten; van het bloed van de verslagene en van de gevangene, vanaf het begin zullen er wraken van de vijand zijn. Juich, heidenen, met Zijn volk! want Hij zal het bloed van Zijn knechten wreken; en Hij zal de wraak op Zijn tegenpartijen doen wederkeren, en verzoenen Zijn land en Zijn volk.", "Ex 1:8": "Daarna kwam er een nieuwe koning over Egypte aan de macht, die Jozef niet gekend had;", "Spr 8:5": "Gij eenvoudigen! versta kloekzinnigheid, en gij dwazen! versta met het hart.", "Joh 17:25": "Rechtvaardige Vader, de wereld heeft U niet gekend; maar Ik heb U gekend, en dezen hebben erkend dat U Mij gezonden hebt.", "Rom 14:11": "Want er is geschreven: Ik leef, zegt de Heere, voor Mij zal elke knie zich buigen, en elke tong zal God belijden.", "Spr 3:35": "De wijzen zullen eer beërven; maar de dwazen dragen schande.", "Spr 14:14": "Wie afvallig van hart is, zal verzadigd worden van zijn eigen wegen; maar een goed man van zichzelf.", "Fil 2:16": "Doordat u vasthoudt aan het woord van het leven, mij tot een roem tegen de dag van Christus, dat ik niet tevergeefs gelopen heb, en ook niet tevergeefs gearbeid heb.", "Job 3:13": "Want nu zou ik neerliggen, en stil zijn; ik zou slapen, dan zou voor mij rust zijn;", "Job 36:1-33": "Elihu ging nog verder, en zei: Wacht op mij nog even, en ik zal u aanwijzen dat er nog redenen voor God zijn. Ik zal mijn kennis van verre ophalen, en mijn Schepper gerechtigheid toewijzen.", "Jak 1:10": "En de rijke in zijn vernedering; want hij zal als een bloem van het gras voorbijgaan.", "2 Kor 12:4": "dat hij opgetrokken is geweest in het paradijs, en onuitsprekelijke woorden gehoord heeft, die het een mens niet geoorloofd is te spreken.", "Fil 3:4-14": "Hoewel ik ook redenen had om op het vlees te vertrouwen; als iemand anders meent te kunnen vertrouwen op het vlees, ik nog meer. Besneden op de achtste dag, uit het geslacht van Israël, van de stam van Benjamin, een Hebreeër uit de Hebreeën, wat de wet betreft een Farizeeër; Wat de ijver betreft een vervolger van de Gemeente; wat de rechtvaardigheid betreft die in de wet is, onberispelijk.", "Spr 23:12": "Richt uw hart op de tucht, en uw oren op de woorden van kennis.", "Ps 135:5": "Want ik weet dat de HEERE groot is, en dat onze Heere boven alle goden is.", "Matt 7:25": "En de slagregen is neergevallen, en de waterstromen zijn gekomen, en de winden hebben gewaaid en zijn tegen dat huis aangevallen, en het is niet gevallen, want het was op de steenrots gegrond.", "2 Petr 1:12-15": "Daarom zal ik niet nalaten u er altijd aan te herinneren, hoewel u het weet en versterkt bent in de waarheid die u nu hebt. En ik acht het juist, zolang ik in deze tent ben, u door herinnering op te wekken; Want ik weet dat het afleggen van mijn tent spoedig zal zijn, zoals ook onze Heere Jezus Christus mij heeft geopenbaard.", "Spr 5:18": "Uw bron zij gezegend; en verblijd u vanwege de vrouw van uw jeugd;", "Jes 49:1-4": "Hoort naar Mij, eilanden! En luistert toe, volken van verre! De HEERE heeft Mij geroepen van de buik af, van het ingewand van Mijn moeder af heeft Hij Mijn Naam vermeld. En Hij heeft Mijn mond gemaakt als een scherp zwaard, onder de schaduw van Zijn hand heeft Hij Mij bedekt; en Hij heeft Mij tot een gezuiverde pijl gesteld, in Zijn pijlkoker heeft Hij Mij verborgen. En Hij heeft tegen Mij gezegd: U bent Mijn Knecht, Israël, door Wie Ik verheerlijkt zal worden.", "Deut 20:20": "Maar het geboomte waarvan u zult weten dat het geen geboomte tot voedsel is, dat zult u verderven en omhakken; en u zult een bolwerk bouwen tegen deze stad, die tegen u oorlog voert, totdat zij valt.", "Ps 119:27": "Geef mij de weg van Uw bevelen te verstaan, opdat ik Uw wonderen betracht.", "Joz 3:11": "Zie, de ark van het verbond van de Heere van de hele aarde gaat voor u door de Jordaan.", "Ps 89:12": "De hemel is van U, ook is de aarde van U; de wereld en haar volheid, die hebt Gij gegrond.", "Gal 4:9": "en nu u God kent, ja, veelmeer door God gekend bent, hoe keert u zich weer tot de zwakke en arme beginselen, die u weer van voren af aan wilt dienen?", "Openb 20:12-14": "En ik zag de doden, klein en groot, staande voor God; en de boeken werden geopend; en een ander boek werd geopend, dat van het leven is; en de doden werden geoordeeld uit wat in de boeken geschreven was, naar hun werken. En de zee gaf de doden, die in haar waren; en de dood en het rijk van de dood gaven de doden, die in hen waren; en zij werden geoordeeld, ieder naar zijn werken. En de dood en het rijk van de dood werden geworpen in de poel van het vuur; dit is de tweede dood.", "Spr 1:14": "U zult uw lot midden onder ons werpen; wij zullen allen één buidel hebben.", "Pred 4:1": "Daarna richtte ik mijn aandacht en zag alle onderdrukkingen die onder de zon gebeuren; en zie, er waren de tranen van de verdrukten, en van hen die geen trooster hadden; en aan de kant van hun verdrukkers was macht, zij daarentegen hadden geen trooster.", "Spr 17:22": "Een blij hart zal goed doen als een medicijn; maar een verslagen geest zal het gebeente doen verdrogen.", "Zef 3:13": "De overgeblevenen van Israël zullen geen onrecht doen, noch leugen spreken, en in hun mond zal geen bedrieglijke tong gevonden worden; maar zij zullen weiden en neerliggen, en niemand zal hen schrik aanjagen.", "Spr 21:5": "De gedachten van de vlijtige zijn alleen tot overschot; maar van ieder die haastig is, alleen tot gebrek.", "2 Sam 20:1": "Toen was daar bij toeval een man van Belial, wiens naam was Seba, een zoon van Bichri, een man van Jemini; die blies op de bazuin, en zei: Wij hebben geen deel aan David, en wij hebben geen erfenis aan de zoon van Isaï, ieder naar zijn tenten, o Israël!", "Mark 6:2": "En toen het sabbat geworden was, begon Hij in de synagoge te onderwijzen; en velen die Hem hoorden, waren verbaasd, en zeiden: Waar komen Deze deze dingen vandaan, en wat is dit voor wijsheid die Hem gegeven is, dat ook zulke krachten door Zijn handen gebeuren?", "Matt 11:25": "In diezelfde tijd antwoordde Jezus en zei: Ik dank U, Vader! Heere van de hemel en van de aarde! Dat U deze dingen voor de wijzen en verstandigen verborgen hebt, en die aan de kinderen geopenbaard hebt.", "Job 27:4": "Indien mijn lippen onrecht zullen spreken, en indien mijn tong bedrog zal uitspreken!", "Spr 6:14": "in zijn hart zijn verkeerdheden, hij smeedt voortdurend kwaad, hij zaait ruzie.", "Ps 30:10": "Wat gewin is er in mijn bloed, in mijn neerdalen tot de groeve? Zal het stof U loven? Zal het Uw waarheid verkondigen?", "Jes 1:18": "Kom dan, en laten wij samen rechten, zegt de HEERE; al waren uw zonden als scharlaken, zij zullen wit worden als sneeuw, al waren zij rood als karmozijn, zij zullen worden als witte wol.", "Spr 19:1": "De arme, die in zijn oprechtheid wandelt, is beter dan de verkeerde van lippen, en die een dwaas is.", "Job 1:21": "En hij zei: Naakt ben ik uit mijn moeders buik gekomen, en naakt zal ik daarheen terugkeren. De HEERE heeft gegeven, en de HEERE heeft genomen; de Naam van de HEERE zij geloofd!", "2 Kor 7:11": "Want zie, ditzelfde, dat u naar God bedroefd bent geworden, hoe grote naarstigheid heeft dat in u gewerkt? Ja, verantwoording, ja, onlust, ja, vrees, ja, verlangen, ja, ijver, ja, wraak; in alles hebt u uzelf bewezen rein te zijn in deze zaak.", "Spr 22:5": "Doornen en strikken liggen op de weg van de verkeerde; wie zijn ziel bewaart, zal zich ver daarvan houden.", "1 Sam 14:28": "Toen antwoordde iemand uit het volk en zei: Uw vader heeft het volk streng bezworen en gezegd: Vervloekt is de man die vandaag brood eet! Daarom bezwijkt het volk.", "Pred 6:11": "Voorwaar, er zijn veel dingen die de ijdelheid vermeerderen; wat heeft de mens daar meer aan?", "Spr 26:5": "Antwoord de dwaas naar zijn dwaasheid, opdat hij niet wijs is in zijn eigen ogen.", "Spr 19:2": "Ook is het niet goed als de ziel zonder kennis is; en die met de voeten haastig is, zondigt.", "Spr 19:7": "Al de broeders van de arme haten hem; hoeveel te meer gaan zijn vrienden ver van hem weg! Hij loopt hen achterna met woorden, die niets zijn.", "Openb 21:4": "En God zal alle tranen van hun ogen afvegen; en de dood zal niet meer zijn; noch rouw, noch geroep, noch moeite zal er meer zijn; want de eerste dingen zijn weggegaan.", "Ps 109:15": "Laat ze voortdurend voor de HEERE zijn; en Hij roeit hun gedachtenis uit van de aarde.", "Hand 1:7": "En Hij zei tegen hen: Het komt u niet toe de tijden of gelegenheden te weten die de Vader in Zijn eigen macht gesteld heeft;", "1 Kor 7:3": "De man zal aan de vrouw geven wat hij haar schuldig is aan genegenheid; en net zo ook de vrouw aan de man.", "Jes 6:5": "Toen zei ik: Wee mij, want ik ga ten onder! Omdat ik een man van onreine lippen ben, en ik woon te midden van een volk dat onrein van lippen is; want mijn ogen hebben de Koning, de HEERE van de heerscharen, gezien.", "Ps 31:18": "HEERE! laat mij niet beschaamd worden, want ik roep U aan; laat de goddelozen beschaamd worden, laat hen zwijgen in het graf.", "Job 7:9": "Een wolk vergaat en vaart heen; zo zal hij die in het graf daalt, niet weer opkomen.", "Job 21:7-34": "Waarom leven de goddelozen, worden oud, ja, worden geweldig in vermogen? Hun nakomelingen zijn bestendig bij hen voor hun ogen, en hun spruiten voor hun aangezicht. Hun huizen hebben vrede zonder vrees, en de roede van God is niet op hen.", "Ps 1:1": "Gelukkig is de man die niet wandelt in de raad van de goddelozen, noch staat op de weg van de zondaars, noch zit op de zetel van de spotters;", "Ps 50:18": "Als u een dief ziet, dan loopt u met hem mee; en uw deel is met de overspelers.", "Jer 29:13": "En u zult Mij zoeken en vinden, wanneer u naar Mij zult vragen met heel uw hart.", "Ps 145:12": "Lamed. Om aan de mensenkinderen bekend te maken Zijn machtige daden, en de eer van de heerlijkheid van Zijn Koninkrijk.", "Spr 13:8": "Het rantsoen van ieders ziel is zijn rijkdom; maar de arme hoort het schelden niet.", "Openb 3:18": "Ik raad u aan dat u van Mij goud koopt, gelouterd door het vuur, opdat u rijk mag worden; en witte kleren, opdat u bekleed mag worden, en de schande van uw naaktheid niet openbaar wordt; en zalf uw ogen met ogenzalf, opdat u zien kunt.", "Luk 23:43": "En Jezus zei tegen hem: Voorwaar, Ik zeg u: Vandaag zult u met Mij in het Paradijs zijn.", "Ps 39:5": "HEERE, maak mij mijn einde bekend, en welke de mate van mijn dagen is; dat ik weet, hoe vergankelijk ik ben.", "Gal 5:19-21": "De werken van het vlees nu zijn openbaar; dat zijn: overspel, hoererij, onreinheid, losbandigheid, Afgoderij, toverij, vijandschappen, ruzies, jaloersheden, toorn, twisten, verdeeldheid, afwijkingen in de leer, Afgunst, moord, dronkenschappen, uitspattingen, en dergelijke; waarvan ik u van tevoren zeg, zoals ik ook eerder gezegd heb, dat wie zulke dingen doen, het Koninkrijk van God niet zullen beërven.", "Spr 13:23": "Het ploegen van de armen geeft overvloed van voedsel; maar er is iemand die verteerd wordt door gebrek aan oordeel.", "Ps 47:4": "Hij brengt de volken onder ons, en de naties onder onze voeten.", "Job 5:8": "Doch ik zou God zoeken, en tot God mijn aanspraak richten;", "Ps 83:19": "opdat zij weten dat U alleen met Uw Naam de HEERE bent, de Allerhoogste over de hele aarde.", "1 Sam 2:6": "De HEERE doodt en maakt levend; Hij doet naar het graf neerdalen, en Hij doet weer opkomen.", "Rom 7:26": "Zo dan, ik zelf dien wel met het gemoed de wet van God, maar met het vlees de wet van de zonde.", "Jer 4:14": "Was uw hart van slechtheid, o Jeruzalem! opdat u behouden wordt; hoe lang zult u de gedachten van uw ijdelheid in uw binnenste laten overnachten?", "Spr 11:20": "De verkeerden van hart zijn de HEERE een gruwel; maar de oprechten van weg zijn Zijn welgevallen.", "Hos 7:5": "Het is de dag van onze koning; de vorsten maken hem ziek door verhitting van de wijn; hij strekt zijn hand uit met de spotters.", "Spr 20:9": "Wie kan zeggen: Ik heb mijn hart gezuiverd, ik ben rein van mijn zonde?", "Gen 3:19": "In het zweet van uw gezicht zult u brood eten, totdat u tot de aarde terugkeert, omdat u daaruit genomen bent; want u bent stof, en u zult tot stof terugkeren.", "1 Kor 13:3": "En al zou het zo zijn dat ik al mijn goederen uitdeelde tot onderhoud van de armen, en al zou het zo zijn dat ik mijn lichaam overgaf om verbrand te worden, en de liefde niet had, dan zou het mij niets baten.", "Spr 12:26": "De rechtvaardige is voortreffelijker dan zijn naaste; maar de weg van de goddelozen doet hen dwalen.", "Ex 19:5": "Nu dan, als u nauwgezet Mijn stem gehoorzaamt en Mijn verbond houdt, zult u Mijn eigendom zijn uit alle volken, want de hele aarde is Mijn;", "1 Kron 29:21-23": "En zij offerden de HEERE slachtoffers; ook brachten zij de HEERE brandoffers, de volgende morgen na die dag: duizend jonge stieren, duizend rammen, duizend lammeren, met hun drankoffers; en slachtoffers in overvloed, voor heel Israël. En zij aten en dronken op die dag voor het aangezicht van de HEERE met grote vreugde; en zij maakten Salomo, de zoon van David, voor de tweede keer koning, en zij zalfden hem voor de HEERE tot voorganger, en Zadok tot priester. Zo zat Salomo op de troon van de HEERE, als koning in de plaats van zijn vader David, en hij was voorspoedig; en heel Israël luisterde naar hem.", "Pred 8:16": "Toen ik mijn hart erop richtte om wijsheid te kennen, en om de bezigheid te zien die op de aarde gebeurt, dat men zelfs overdag of 's nachts geen slaap ziet met zijn ogen;", "Rom 6:19": "Ik spreek op menselijke wijze, vanwege de zwakheid van uw vlees; want zoals u uw leden gesteld hebt om dienstbaar te zijn aan de onreinheid en de ongerechtigheid, tot ongerechtigheid, zo stel nu uw leden om dienstbaar te zijn aan de gerechtigheid, tot heiliging.", "Ps 139:19": "O God! Dat U de goddeloze zou ombrengen! En u, mannen van het bloed, wijkt van mij!", "Jona 2:2": "En hij zei: Ik riep uit mijn benauwdheid tot de HEERE, en Hij antwoordde mij; uit de buik van het graf schreide ik, en U hoorde mijn stem.", "Ezech 18:4": "Zie, alle zielen zijn van Mij; zoals de ziel van de vader, zo is ook de ziel van de zoon van Mij; de ziel die zondigt, die zal sterven.", "2 Kor 6:14": "Trek niet een ander juk aan met de ongelovigen; want wat heeft de gerechtigheid gemeen met de ongerechtigheid, en welke gemeenschap heeft het licht met de duisternis?", "Ps 10:14": "U ziet het zeker; want U aanschouwt de moeite en het verdriet, opdat men het in Uw hand geeft; op U verlaat de arme zich, U bent geweest een Helper van de wees.", "Ps 26:5": "Ik haat de vergadering van de boosdoeners, en bij de goddelozen zit ik niet.", "Jer 18:1-23": "Het woord dat van de HEERE tot Jeremia gebeurde, en Hij zei: Maak u op en ga naar het huis van de pottenbakker, en daar zal Ik u Mijn woorden doen horen. Zo ging ik naar het huis van de pottenbakker; en zie, hij maakte een werk op de schijven.", "Ps 22:29": "Want het koninkrijk is van de HEERE, en Hij heerst onder de heidenen.", "Ps 145:5-7": "He. Ik zal uitspreken de heerlijkheid van de eer van Uw majesteit, en Uw wonderlijke daden. Vau. En zij zullen vermelden de kracht van Uw ontzagwekkende daden; en Uw grootheid, die zal ik vertellen. Zain. Zij zullen de gedachtenis van de grootheid van Uw goedheid overvloedig uitstorten, en zij zullen Uw gerechtigheid met gejuich verkondigen.", "1 Petr 3:15": "maar heilig God, de Heere, in uw harten; en wees altijd bereid tot verantwoording aan ieder die u rekenschap vraagt van de hoop die in u is, met zachtmoedigheid en vreze,", "Pred 12:11": "De woorden van de wijzen zijn als prikkels, en als spijkers, diep ingeslagen door de meesters van de verzamelingen, die gegeven zijn door de ene Herder.", "Ps 15:1-3": "Een psalm van David. HEERE, wie zal verblijven in Uw tent? Wie zal wonen op de berg van Uw heiligheid? Die oprecht wandelt, en gerechtigheid doet, en die met zijn hart de waarheid spreekt; Die met zijn tong niet lastert, zijn metgezellen geen kwaad doet, en geen smaad uit over zijn naaste;", "Pred 2:10": "En al wat mijn ogen begeerden, dat onthield ik hun niet; ik weerhield mijn hart niet van enige blijdschap, maar mijn hart was blij vanwege al mijn arbeid; en dit was mijn deel van al mijn arbeid.", "Luk 10:21": "Op dat moment verheugde Jezus Zich in de geest, en zei: Ik dank U, Vader, Heere van hemel en aarde, dat U deze dingen voor de wijzen en verstandigen verborgen hebt, en ze aan de kinderen geopenbaard hebt; ja, Vader, want zo was het welbehagen voor U.", "Spr 22:29": "Hebt u een man gezien die vaardig is in zijn werk? Hij zal voor koningen komen te staan; hij zal niet voor onaanzienlijke mensen staan.", "Matt 6:10": "Laat Uw Koninkrijk komen. Laat Uw wil gebeuren, zoals in de hemel, zo ook op de aarde.", "Spr 14:6-8": "De spotter zoekt wijsheid, en vindt niets; maar de kennis is voor de verstandige licht. Ga weg van het gezicht van een dwaze man; want u zou bij hem geen lippen van kennis merken. De wijsheid van de kloekzinnige is zijn weg te begrijpen; maar dwaasheid van de dwazen is bedrog.", "Kol 3:18": "Vrouwen, wees uw eigen mannen onderdanig, zoals het betaamt in de Heere.", "Rom 1:9": "Want God is mijn Getuige, Die ik dien in mijn geest, in het Evangelie van Zijn Zoon, hoe ik zonder ophouden aan u denk;", "2 Tim 1:10": "Doch nu geopenbaard is door de verschijning van onze Zaligmaker Jezus Christus, Die de dood tenietgedaan heeft, en het leven en de onvergankelijkheid aan het licht gebracht heeft door het Evangelie;", "Spr 13:14-16": "De leer van de wijze is een springader van het leven, om af te wijken van de strikken van de dood. Goed verstand geeft aangenaamheid; maar de weg van de trouwelozen is streng. Al wie verstandig is, handelt met kennis; maar een dwaas breidt dwaasheid uit.", "Joh 7:17": "Als iemand de wil van Hem wil doen, zal hij van deze leer weten of ze uit God is, of dat Ik uit Mijzelf spreek.", "Ps 25:15": "Ain. Mijn ogen zijn voortdurend op de HEERE, want Hij zal mijn voeten uit het net uitvoeren.", "Pred 10:19": "Men maakt maaltijden om te lachen, en de wijn verheugt de levenden, en het geld verschaft alles.", "Openb 11:4": "Dezen zijn de twee olijfbomen en de twee kandelaars, die voor de God van de aarde staan.", "Hos 4:17": "Efraïm is met de afgoden verbonden; laat hem begaan.", "2 Kor 3:5": "Niet dat wij uit onszelf bekwaam zijn om iets te bedenken, alsof het uit onszelf komt; maar onze bekwaamheid is uit God;", "Pred 7:24": "Wat ver weg is, en zeer diep, wie zal dat vinden?", "Mal 3:14": "U zegt: Het is tevergeefs God te dienen; want wat nut heeft het, dat wij Zijn wacht in acht nemen, en dat wij in het zwart gaan, voor het aangezicht van de HEERE van de heerscharen?", "Job 28:12-28": "Maar de wijsheid, waar zal zij gevonden worden? En waar is de plaats van het verstand? De mens weet haar waarde niet, en zij wordt niet gevonden in het land van de levenden. De afgrond zegt: Zij is niet in mij; en de zee zegt: Zij is niet bij mij.", "Gen 4:5": "maar Kaïn en zijn offer zag Hij niet met welgevallen aan. Toen ontstak Kaïn zeer, en zijn gezicht betrok.", "Ex 35:2": "Zes dagen zal men het werk doen; maar op de zevende dag zal het voor u heiligheid zijn, een sabbat van rust voor de HEERE; ieder die daarop werk doet, zal gedood worden.", "Ps 141:4": "Neig mijn hart niet tot een kwade zaak, om enige handel in goddeloosheid te bedrijven, met mannen die ongerechtigheid bedrijven; en laat mij niet eten van hun lekkernijen.", "Gen 24:9": "Toen legde de knecht zijn hand onder de heup van Abraham, zijn heer, en hij zwoer hem over deze zaak.", "Ps 49:10": "dat hij ook voortaan voor altijd zou leven, en de vergankelijkheid niet zien.", "Ps 31:5": "Doe mij uitgaan uit het net, dat zij voor mij verborgen hebben, want U bent mijn Sterkte.", "Mark 9:3": "En Zijn kleren werden blinkend, zeer wit als sneeuw, zoals geen wolwasser op aarde ze zo wit kan maken.", "Ps 51:9": "Ontzondig mij met hysop, en ik zal rein zijn; was mij, en ik zal witter zijn dan sneeuw.", "Pred 11:4": "Wie op de wind let, die zal niet zaaien, en wie op de wolken ziet, die zal niet maaien.", "Spr 14:18": "De onnozelen erven dwaasheid; maar de kloekzinnigen zullen zich met kennis kronen.", "Hab 1:2": "HEERE! Hoe lang schreeuw ik, en U hoort niet, hoe lang roep ik: Geweld! tot U, en U verlost niet!", "Rom 7:11": "Want de zonde nam de gelegenheid door het gebod, heeft mij verleid, en heeft mij daardoor gedood.", "Tit 3:1": "Herinner hen eraan dat zij aan de overheden en machten onderdanig zijn, dat zij hun gehoorzaam zijn, dat zij tot alle goed werk bereid zijn;", "Spr 10:19-21": "In de veelheid van woorden ontbreekt de overtreding niet; maar wie zijn lippen bedwingt, is verstandig. De tong van de rechtvaardige is uitgelezen zilver; het hart van de goddelozen is weinig waard. De lippen van de rechtvaardige voeden er velen; maar de dwazen sterven door gebrek aan verstand.", "Ps 50:23": "Wie dank offert, die zal Mij eren; en wie zijn weg goed inricht, die zal Ik Gods heil doen zien.", "Joh 4:50": "Jezus zei tegen hem: Ga heen, uw zoon leeft. En de man geloofde het woord dat Jezus tegen hem gezegd had, en ging heen.", "Spr 19:14": "Huis en bezit zijn een erfdeel van de vaderen; maar een verstandige vrouw is van de HEERE.", "Job 11:8": "Zij is als de hoogten van de hemelen, wat kunt u doen? Dieper dan het graf, wat kunt u weten?", "Luk 19:42-44": "en zei: Och, had u ook maar geweten, ook nog op deze dag van u, wat tot uw vrede dient! Maar nu is het verborgen voor uw ogen. Want er zullen dagen over u komen, dat uw vijanden een wal rondom u zullen opwerpen, en u zullen omsingelen, en u van alle kanten in het nauw drijven; en zij zullen u tot de grond toe neerwerpen, en uw kinderen in u; en zij zullen in u geen steen op de andere steen laten liggen, omdat u de tijd waarin u bezocht werd niet hebt herkend.", "Ps 47:9": "God regeert over de heidenen; God zit op de troon van Zijn heiligheid.", "Hoogl 4:10": "Hoe mooi is uw uitnemende liefde, Mijn zuster, o bruid! Hoeveel beter is uw uitnemende liefde dan wijn, en de geur van uw oliën dan alle specerijen!", "Spr 4:18-22": "Maar het pad van de rechtvaardigen is als een schijnend licht, dat voortgaat en meer licht geeft tot de volle dag toe. De weg van de goddelozen is als donkerheid; zij weten niet, waarover zij zullen struikelen. Mijn zoon! Let op mijn woorden, neig uw oor tot mijn woorden.", "Pred 11:7": "Verder, het licht is zoet, en het is de ogen goed de zon te aanschouwen;", "Job 14:21": "Zijn kinderen komen tot eer, en hij weet het niet; of zij worden klein, en hij merkt het niet aan hen.", "Pred 11:3": "Als de wolken vol geworden zijn, storten zij plasregen uit op de aarde; en als de boom naar het zuiden, of als hij naar het noorden valt, op de plaats waar de boom valt, daar zal hij blijven liggen.", "Ps 9:11": "En die Uw Naam kennen, zullen op U vertrouwen, omdat Gij, HEERE, niet hebt verlaten degenen, die U zoeken.", "Ps 115:3": "Onze God is toch in de hemel, Hij doet al wat Hem behaagt.", "Ps 94:11": "De HEERE kent de gedachten van de mens, dat zij vluchtig zijn.", "1 Joh 2:16": "Want al wat in de wereld is, namelijk de begeerte van het vlees, en de begeerte van de ogen, en de hoogmoed van het leven, is niet uit de Vader, maar is uit de wereld.", "Hand 17:23": "Want toen ik door de stad liep en uw heiligdommen bekeek, vond ik ook een altaar waarop een opschrift stond: AAN DE ONBEKENDE GOD. Hem dan, Die u niet kent en toch dient, verkondig ik u.", "Joh 4:34": "Jezus zei tegen hen: Mijn voedsel is dat Ik de wil doe van Hem die Mij gezonden heeft, en Zijn werk volbreng.", "Job 4:17-19": "Zou een mens rechtvaardiger zijn dan God? Zou een man reiner zijn dan zijn Maker? Zie, op Zijn knechten zou Hij niet vertrouwen; ook Zijn engelen heeft Hij van dwaasheid beschuldigd. Hoeveel te meer dan hen die in lemen huizen wonen, waarvan de grondslag in het stof is? Zij worden verbrijzeld voor de mot.", "Ps 141:10": "Laat de goddelozen ieder in zijn eigen net vallen, samen, totdat ik voorbijgegaan zal zijn.", "Pred 8:10": "Zo heb ik ook gezien dat de goddelozen begraven werden, en degenen die kwamen en uit de heilige plaats gingen, werden vergeten in die stad, waarin zij zo gehandeld hadden. Dit is ook vluchtigheid.", "Ps 90:3": "U doet de mens wederkeren tot verbrijzeling, en zegt: Keer weder, mensenkinderen!", "Jes 48:8": "Ook hebt u ze niet gehoord, ook hebt u ze niet geweten, ook van toen af is uw oor niet geopend geweest; want Ik heb geweten, dat u volledig trouweloos zou handelen, en dat u van de buik af een overtreder genoemd bent.", "Jes 29:24": "En zij die dwalend van geest zijn, zullen tot verstand komen, en de mopperaars zullen de lering aannemen.", "Jak 1:6": "Maar laat hij ze vragen in geloof, niet twijfelend; want wie twijfelt, is een golf van de zee gelijk, die door de wind gedreven en heen en weer geworpen wordt.", "Deut 16:15": "Zeven dagen zult u de HEERE, uw God, feest houden, in de plaats die de HEERE zal uitkiezen; want de HEERE, uw God, zal u zegenen in al uw inkomen, en in al het werk van uw handen; daarom zult u zeker vrolijk zijn.", "Pred 12:5": "Ook wanneer zij bang zullen zijn voor de hoogte, en er verschrikkingen zullen zijn op de weg, en de amandelboom zal bloeien, en de sprinkhaan zichzelf een last zal zijn, en het verlangen zal vergaan; want de mens gaat naar zijn eeuwig huis, en de rouwklagers zullen in de straat rondgaan.", "Ex 8:22": "En Ik zal op die dag het land Gosen, waarin Mijn volk woont, afzonderen, zodat daar geen vermenging van ongedierte is, opdat u weet dat Ik, de HEERE, in het midden van dit land ben.", "Pred 4:6": "Een hand vol met rust is beter dan beide de vuisten vol met moeite en najagen van de wind.", "Matt 25:45": "Dan zal Hij hun antwoorden: Voorwaar, Ik zeg u: Voor zoveel u dit voor één van deze minsten niet gedaan hebt, hebt u het Mij ook niet gedaan.", "Luk 1:79": "om te verschijnen aan hen die gezeten zijn in duisternis en schaduw van de dood, om onze voeten te richten op de weg van de vrede.", "Ps 50:10-12": "Want al het gedierte van het woud is Mijn, de dieren op duizend bergen. Ik ken al het gevogelte van de bergen, en het wild van het veld is bij Mij. Zo Mij hongerde, Ik zou het u niet zeggen; want Mijn is de wereld en haar volheid.", "Rom 8:5-8": "Want wie naar het vlees zijn, bedenken de dingen van het vlees; maar wie naar de Geest zijn, bedenken de dingen van de Geest. Want het bedenken van het vlees is de dood, maar het bedenken van de Geest is leven en vrede. Daarom dat het bedenken van het vlees vijandschap is tegen God; want het onderwerpt zich niet aan de wet van God, want het kan ook niet.", "Joz 7:11": "Israël heeft gezondigd; en zij hebben ook Mijn verbond, dat Ik hun geboden had, overtreden; en ook hebben zij van het verbannene genomen, en ook gestolen, en ook gelogen, en hebben het ook onder hun eigen spullen gelegd.", "Spr 30:4": "Wie is naar de hemel opgeklommen, en neergedaald? Wie heeft de wind in Zijn vuisten verzameld? Wie heeft de wateren in een kleed gebonden? Wie heeft alle einden van de aarde vastgesteld? Hoe is Zijn Naam, en hoe is de Naam van Zijn Zoon, als u het weet?", "Pred 2:24-26": "Is het dan niet goed voor de mens dat hij eet en drinkt, en dat hij zijn ziel het goede laat genieten in zijn arbeid? Ik heb ook gezien dat dit uit de hand van God is. (Want wie zou ervan eten, of wie zou zich daartoe haasten, meer dan ikzelf?) Want Hij geeft wijsheid, kennis en vreugde aan de mens die goed is voor Zijn aangezicht; maar aan de zondaar geeft Hij de bezigheid om te verzamelen en te vergaderen, opdat Hij het geeft aan wie goed is voor Gods aangezicht. Dit is ook ijdelheid en kwelling van de geest.", "Ps 96:3": "Vertelt onder de heidenen Zijn eer, onder alle volken Zijn wonderen.", "Ef 2:12": "dat u in die tijd was zonder Christus, vervreemd van het burgerschap van Israël, en vreemdelingen van de verbonden van de belofte, geen hoop hebbend, en zonder God in de wereld.", "Spr 10:23": "Het is voor de dwaas als een spel om iets schandelijks te doen; maar voor een man van verstand, om wijsheid te plegen.", "2 Kon 19:15": "En Hizkia bad voor het aangezicht van de HEERE, en zei: HEERE, God van Israël, Die tussen de cherubs¹ woont! U zelf, U alleen bent de God van alle koninkrijken van de aarde, U hebt de hemel en de aarde gemaakt.", "Jer 46:6": "De snelle ontvliedt niet, en de held ontkomt niet; tegen het noorden, aan de oever van de rivier Frath zijn zij gestruikeld en gevallen.", "2 Kon 20:1": "In die dagen werd Hizkia ziek, tot aan het sterven toe; en de profeet Jesaja, de zoon van Amoz, kwam bij hem en zei tegen hem: Zo zegt de HEERE: Geef bevel aan uw huis, want u zult sterven en niet leven.", "1 Tim 6:16": "Die als enige onsterfelijkheid heeft, en een ontoegankelijk licht bewoont; aan Wie geen mens gezien heeft, en ook niet zien kan; aan Wie eer en eeuwige kracht zij. Amen.", "Luk 20:36": "want zij kunnen niet meer sterven, want zij zijn gelijk aan de engelen; en zij zijn kinderen van God, omdat zij kinderen van de opstanding zijn.", "Zach 14:21": "Ja, al de potten in Jeruzalem en in Juda zullen de HEERE van de heerscharen heilig zijn, zodat allen die willen offeren, zullen komen, en daarvan nemen, en daarin koken; en er zal geen Kanaäniet meer zijn in het huis van de HEERE van de heerscharen, op die dag.", "1 Kon 9:4": "En als u voor Mijn aangezicht wandelt, zoals uw vader David gewandeld heeft, met een volkomen hart, en met oprechtheid, om te doen naar alles wat Ik u geboden heb, en Mijn inzettingen en Mijn rechten houdt;", "Spr 10:31": "De mond van de rechtvaardige brengt overvloedig wijsheid voort; maar de tong van de verkeerdheden zal uitgeroeid worden.", "Ef 4:25": "Daarom, leg de leugen af, en spreek de waarheid, ieder met zijn naaste; want wij zijn elkaars leden.", "Klaagl 3:37": "Mem. Wie zegt iets, en het gebeurt, als de Heere het niet beveelt?", "Spr 21:31": "Het paard wordt bereid tegen de dag van het strijd; maar de overwinning is van de HEERE.", "Job 7:1": "Heeft de mens niet een strijd op de aarde, en zijn zijn dagen niet als de dagen van de dagloner?", "Pred 3:19-21": "Want wat de kinderen van de mensen overkomt, dat overkomt ook de dieren; en hetzelfde overkomt hun beiden; zoals die sterft, zo sterft deze, en zij hebben allen dezelfde adem, en de meerderheid van de mensen boven de dieren is er niet; want allen zijn zij vluchtigheid. Zij gaan allen naar één plaats; zij zijn allen uit het stof, en zij keren allen terug tot het stof. Wie merkt, dat de adem van de kinderen van de mensen opvaart naar boven, en de adem van de dieren naar beneden vaart in de aarde?", "Pred 2:14-18": "De ogen van de wijze staan in zijn hoofd, maar de dwaas wandelt in de duisternis. Toen merkte ik ook op dat één en hetzelfde lot hun allen treft. Daarom zei ik in mijn hart: Zoals het de dwaas vergaat, zal het ook mij vergaan; waarom heb ik dan toen meer naar wijsheid gestreefd? Toen sprak ik in mijn hart, dat ook dat ijdelheid was. Want er zal in eeuwigheid niet meer herinnering aan een wijze zijn dan aan een dwaas; aangezien wat nu is, in de toekomstige dagen helemaal vergeten wordt; en hoe sterft de wijze? Net als de dwaas.", "Job 14:7-12": "Want voor een boom is er, als hij wordt omgehakt, nog verwachting dat hij opnieuw zal uitlopen, en dat zijn scheut niet zal ophouden. Al wordt zijn wortel in de aarde oud, en sterft zijn stam weg in het stof; Toch zal hij door de geur van het water opnieuw uitspruiten, en een tak maken, zoals een jonge plant.", "Ps 26:9": "Raap mijn ziel niet weg met de zondaars, en mijn leven niet met de mannen van het bloed;", "Spr 15:26": "De gedachten van de boze zijn de HEERE een gruwel; maar de woorden van de reinen zijn lieflijke woorden.", "2 Joh 1:1": "De oudste aan de uitverkoren vrouw en aan haar kinderen, die ik in waarheid liefheb, en niet alleen ik, maar ook allen die de waarheid gekend hebben;", "Ps 14:6": "U beschaamt de raad van de ellendige, omdat de HEERE zijn Toevlucht is.", "2 Sam 15:26": "Maar als Hij zo zal zeggen: Ik heb geen behagen in u; zie, hier ben ik, laat Hij met mij doen zoals het goed is in Zijn ogen.", "Spr 1:10": "Mijn zoon! als de zondaars u aanlokken, stem er niet mee in;", "Job 42:5": "Met het gehoor van het oor heb ik U gehoord; maar nu ziet mijn oog U.", "Jak 1:26": "Als iemand onder u denkt dat hij godsdienstig is, en zijn tong niet in toom houdt, maar zijn hart verleidt, diens godsdienst is nutteloos.", "Jer 9:23": "Zo zegt de HEERE: Een wijze beroemt zich niet op zijn wijsheid, en de sterke beroemt zich niet op zijn sterkte; een rijke beroemt zich niet op zijn rijkdom;", "Ps 39:2": "Ik zei: Ik zal op mijn wegen letten, dat ik niet zondig met mijn tong; ik zal mijn mond met een breidel in toom houden, terwijl de goddeloze nog tegenover mij is.", "Lev 18:3": "U zult niet doen naar de werken van het Egyptische land, waarin u gewoond hebt; en naar de werken van het land Kanaän, waarheen Ik u breng, zult u niet doen, en u zult in hun inzettingen niet wandelen.", "Spr 15:2": "De tong van de wijzen maakt de wetenschap goed; maar de mond van de zotten stort overvloedig dwaasheid uit.", "Jes 42:7": "Om de blinde ogen te openen, om de gevangenen uit de gevangenis te leiden, en uit de gevangenis hen die in duisternis zitten.", "Pred 8:1": "Wie is als de wijze, en wie weet de uitleg van de dingen? De wijsheid van de mens verlicht zijn gezicht, en de hardheid van zijn gezicht wordt daardoor veranderd."}, "noten": {}, "koppeling": {"1": "Zeker, <span class=\"wl\" data-l=\"L1\" data-code=\"H3820\">dit</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H3820\">alles</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H3820\">heb</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H3820\">ik</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H3820\">in</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H3820\">mijn</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H3820\">hart</span> overwogen, <span class=\"wl\" data-l=\"L2\" data-code=\"H952\">opdat</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H952\">ik</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H952\">dit</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H952\">alles</span> klaar <span class=\"wl\" data-l=\"L2\" data-code=\"H952\">mocht</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H952\">verstaan</span>: <span class=\"wl\" data-l=\"L3\" data-code=\"H6662\">dat</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H6662\">de</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H6 const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"
