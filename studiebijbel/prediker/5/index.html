ie hoger is dan de hoge, let daarop; en er zijn hogeren boven hen.","8":"Het voordeel van het aardrijk is er voor allen: zelfs de koning wordt door het veld gediend.","9":"Wie het geld liefheeft, wordt van het geld niet verzadigd; en wie de overvloed liefheeft, wordt van het inkomen niet *verzadigd*. Ook dit is nietigheid.","10":"Waar het goed zich vermeerdert, daar vermeerderen ook zij die het opeten; wat nut hebben dan de bezitters ervan, behalve het aanzien ervan met hun ogen?","11":"De slaap van de arbeider is zoet, of hij nu weinig of veel gegeten heeft; maar de overvloed van de rijke laat hem niet slapen.","12":"Er is een kwaad dat ziekte veroorzaakt, dat ik heb gezien onder de zon: rijkdom die door zijn bezitters bewaard wordt tot hun eigen kwaad.","13":"Of die rijkdom zelf gaat verloren door een moeilijke bezigheid; en hij verwekt een zoon, en er is helemaal niets in zijn hand.","14":"Zoals hij voortgekomen is uit de buik van zijn moeder, *zo* zal hij naakt terugkeren, gaande zoals hij gekomen was; en hij zal niets van zijn arbeid meenemen, dat hij met zijn hand zou kunnen wegdragen.","15":"Daarom is ook dit een kwaad dat ziekte veroorzaakt: dat hij op elke manier, zoals hij gekomen is, zo weer heengaat; en welk voordeel heeft hij ervan, dat hij naar de wind gearbeid heeft?","16":"Dat hij ook al zijn dagen in duisternis gegeten heeft; en dat hij veel verdriet gehad heeft, ook zijn ziekte, en heftige toorn?","17":"Zie, wat ik gezien heb: een goede zaak, die mooi is: te eten en te drinken, en het goede te genieten van al zijn arbeid, die hij verricht heeft onder de zon, *gedurende* het aantal dagen van zijn leven, dat God hem geeft; want dat is zijn deel.","18":"Ook: ieder mens aan wie God rijkdom en bezittingen gegeven heeft, en aan wie Hij de macht geeft om daarvan te eten, en om zijn deel te nemen, en om zich te verheugen in zijn arbeid, dat is een gave van God.","19":"Want hij zal niet veel denken aan de dagen van zijn leven, omdat God hem antwoord geeft in de blijdschap van zijn hart."},"SV":{"1":"Wees niet te snel met uw mond, en uw hart haaste niet een woord voort te brengen voor Gods aangezicht; want God is in den hemel, en gij zijt op de aarde; daarom laat uw woorden weinig zijn.","2":"Want *gelijk* de droom komt door veel bezigheid, alzo de stem des zots door de veelheid der woorden.","3":"Wanneer gij een gelofte aan God zult beloofd hebben, stel niet uit dezelve te betalen; want Hij heeft geen lust aan zotten; wat gij zult beloofd hebben, betaal het.","4":"Het is beter, dat gij niet belooft, dan dat gij belooft en niet betaalt.","5":"Laat uw mond niet toe, dat hij uw vlees zou doen zondigen; en zeg niet voor het aangezicht des engels, dat het een dwaling was; waarom zou God grotelijks toornen, om uwer stemme wille, en verderven het werk uwer handen?","6":"Want gelijk in de veelheid der dromen ijdelheden zijn, alzo *in* veel woorden; maar vrees gij God!","7":"Indien gij de onderdrukking des armen, en de beroving des gerichts en der gerechtigheid ziet in een landschap, verwonder u niet over zulk een voornemen; want die hoger is dan de hoge, neemt er acht op; en daar zijn hogen boven henlieden.","8":"Het voordeel des aardrijks is voor allen: de koning zelfs wordt van het veld gediend.","9":"Die het geld liefheeft, wordt van het geld niet zat; en wie den overvloed liefheeft, wordt van het inkomen niet *zat*. Dit is ook ijdelheid.","10":"Waar het goed vermenigvuldigt, daar vermenigvuldigen ook die het eten; wat nuttigheid hebben dan de bezitters daarvan, dan het gezicht hunner ogen?","11":"De slaap des arbeiders is zoet, hij hebbe weinig of veel gegeten; maar de zatheid des rijken laat hem niet slapen.","12":"Er is een kwaad, dat krankheid aanbrengt, *hetwelk* ik zag onder de zon: rijkdom van zijn bezitters bewaard tot hun eigen kwaad.","13":"Of de rijkdom zelf vergaat door een moeilijke bezigheid; en hij gewint een zoon, en er is niet met al in zijn hand.","14":"Gelijk als hij voortgekomen is uit zijner moeders buik, *alzo* zal hij naakt wederkeren, gaande gelijk hij gekomen was; en hij zal niet medenemen van zijn arbeid, dat hij met zijn hand zou wegdragen.","15":"Daarom is dit ook een kwaad, dat krankheid aanbrengt; dat hij in alle manier, gelijk hij gekomen is, alzo heen gaat; en wat voordeel is het hem, dat hij in den wind gearbeid heeft?","16":"Dat hij ook al zijn dagen in duisternis gegeten heeft; en dat hij veel verdriets gehad heeft, ook zijn krankheid, en onstuimigen toorn?","17":"Ziet, wat ik gezien heb, een goede zaak, die schoon is: te eten en te drinken, en te genieten het goede van al zijn arbeid, dien hij bearbeid heeft onder de zon, *gedurende* het getal der dagen zijns levens, hetwelk God hem geeft; want dat is zijn deel.","18":"Ook een iegelijk mens, aan denwelken God rijkdom en goederen gegeven heeft, en Hij geeft hem de macht, om daarvan te eten, en om zijn deel te nemen, en om zich te verheugen van zijn arbeid, datzelve is een gave van God.","19":"Want hij zal niet veel gedenken aan de dagen zijns levens, dewijl *hem* God verhoort in de blijdschap zijns harten."},"KJV":{"1":"Be not rash with thy mouth, and let not thine heart be hasty to utter *any* thing before God: for God *is* in heaven, and thou upon earth: therefore let thy words be few.","2":"For a dream cometh through the multitude of business; and a fool's voice *is known* by multitude of words.","3":"When thou vowest a vow unto God, defer not to pay it; for *he hath* no pleasure in fools: pay that which thou hast vowed.","4":"Better *is it* that thou shouldest not vow, than that thou shouldest vow and not pay.","5":"Suffer not thy mouth to cause thy flesh to sin; neither say thou before the angel, that it *was* an error: wherefore should God be angry at thy voice, and destroy the work of thine hands?","6":"For in the multitude of dreams and many words *there are* also *divers* vanities: but fear thou God.","7":"If thou seest the oppression of the poor, and violent perverting of judgment and justice in a province, marvel not at the matter: for *he that is* higher than the highest regardeth; and *there be* higher than they.","8":"Moreover the profit of the earth is for all: the king *himself* is served by the field.","9":"He that loveth silver shall not be satisfied with silver; nor he that loveth abundance with increase: this *is* also vanity.","10":"When goods increase, they are increased that eat them: and what good *is there* to the owners thereof, saving the beholding *of them* with their eyes?","11":"The sleep of a labouring man *is* sweet, whether he eat little or much: but the abundance of the rich will not suffer him to sleep.","12":"There is a sore evil *which* I have seen under the sun, *namely*, riches kept for the owners thereof to their hurt.","13":"But those riches perish by evil travail: and he begetteth a son, and *there is* nothing in his hand.","14":"As he came forth of his mother's womb, naked shall he return to go as he came, and shall take nothing of his labour, which he may carry away in his hand.","15":"And this also *is* a sore evil, *that* in all points as he came, so shall he go: and what profit hath he that hath laboured for the wind?","16":"All his days also he eateth in darkness, and *he hath* much sorrow and wrath with his sickness.","17":"Behold *that* which I have seen: *it is* good and comely *for one* to eat and to drink, and to enjoy the good of all his labour that he taketh under the sun all the days of his life, which God giveth him: for it *is* his portion.","18":"Every man also to whom God hath given riches and wealth, and hath given him power to eat thereof, and to take his portion, and to rejoice in his labour; this *is* the gift of God.","19":"For he shall not much remember the days of his life; because God answereth *him* in the joy of his heart."}},"tsk":{"1":[{"kopje":"niet te snel","refs":["Gen 18:27","Gen 18:30","Gen 18:32","Gen 28:20","Gen 28:22","Num 30:2-5","Richt 11:30","1 Sam 14:24-45","Mark 6:23"]},{"kopj l-kjv\" data-code=\"H398\">eat</span> <span class=\"wl wl-kjv\" data-code=\"H4592\">little</span> or <span class=\"wl wl-kjv\" data-code=\"H7235\">much:</span> but the <span class=\"wl wl-kjv\" data-code=\"H7647\">abundance</span> of the <span class=\"wl wl-kjv\" data-code=\"H6223\">rich</span> will not <span class=\"wl wl-kjv\" data-code=\"H3240\">suffer</span> him to sleep.","12":"There <span class=\"wl wl-kjv\" data-code=\"H3426\">is</span> a <span class=\"wl wl-kjv\" data-code=\"H2470\">sore</span> <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> which I have <span class=\"wl wl-kjv\" data-code=\"H7200\">seen</span> under the <span class=\"wl wl-kjv\" data-code=\"H8121\">sun,</span> namely, <span class=\"wl wl-kjv\" data-code=\"H6239\">riches</span> <span class=\"wl wl-kjv\" data-code=\"H8104\">kept</span> for the <span class=\"wl wl-kjv\" data-code=\"H1167\">owners</span> thereof to their hurt.","13":"But those <span class=\"wl wl-kjv\" data-code=\"H6239\">riches</span> <span class=\"wl wl-kjv\" data-code=\"H6\">perish</span> by <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> <span class=\"wl wl-kjv\" data-code=\"H6045\">travail:</span> and he <span class=\"wl wl-kjv\" data-code=\"H3205\">begetteth</span> a <span class=\"wl wl-kjv\" data-code=\"H1121\">son,</span> and there is <span class=\"wl wl-kjv\" data-code=\"H3972\">nothing</span> in his hand.","14":"As he came <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> of his <span class=\"wl wl-kjv\" data-code=\"H517\">mother's</span> <span class=\"wl wl-kjv\" data-code=\"H990\">womb,</span> <span class=\"wl wl-kjv\" data-code=\"H6174\">naked</span> shall he <span class=\"wl wl-kjv\" data-code=\"H7725\">return</span> to <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> as he <span class=\"wl wl-kjv\" data-code=\"H935\">came,</span> and shall <span class=\"wl wl-kjv\" data-code=\"H5375\">take</span> <span class=\"wl wl-kjv\" data-code=\"H3972\">nothing</span> of his <span class=\"wl wl-kjv\" data-code=\"H5999\">labour,</span> which he may carry <span class=\"wl wl-kjv\" data-code=\"H3212\">away</span> in his hand.","15":"And <span class=\"wl wl-kjv\" data-code=\"H2090\">this</span> also is a <span class=\"wl wl-kjv\" data-code=\"H2470\">sore</span> <span class=\"wl wl-kjv\" data-code=\"H7451\">evil,</span> that in all <span class=\"wl wl-kjv\" data-code=\"H5980\">points</span> as he <span class=\"wl wl-kjv\" data-code=\"H935\">came,</span> so shall he <span class=\"wl wl-kjv\" data-code=\"H3212\">go:</span> and what <span class=\"wl wl-kjv\" data-code=\"H3504\">profit</span> hath he that hath <span class=\"wl wl-kjv\" data-code=\"H5998\">laboured</span> for the wind?","16":"All his <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> also he <span class=\"wl wl-kjv\" data-code=\"H398\">eateth</span> in <span class=\"wl wl-kjv\" data-code=\"H2822\">darkness,</span> and he hath <span class=\"wl wl-kjv\" data-code=\"H7235\">much</span> <span class=\"wl wl-kjv\" data-code=\"H3707\">sorrow</span> and <span class=\"wl wl-kjv\" data-code=\"H7110\">wrath</span> with his sickness.","17":"Behold that which I have <span class=\"wl wl-kjv\" data-code=\"H7200\">seen:</span> it is <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> and <span class=\"wl wl-kjv\" data-code=\"H3303\">comely</span> for one to <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> and to <span class=\"wl wl-kjv\" data-code=\"H8354\">drink,</span> and to <span class=\"wl wl-kjv\" data-code=\"H7200\">enjoy</span> the <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> of all his <span class=\"wl wl-kjv\" data-code=\"H5999\">labour</span> that he <span class=\"wl wl-kjv\" data-code=\"H5998\">taketh</span> under the <span class=\"wl wl-kjv\" data-code=\"H8121\">sun</span> <span class=\"wl wl-kjv\" data-code=\"H4557\">all</span> the <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> of his <span class=\"wl wl-kjv\" data-code=\"H2416\">life,</span> which <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">giveth</span> him: for it is his portion.","18":"Every <span class=\"wl wl-kjv\" data-code=\"H120\">man</span> also to whom <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> hath <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> <span class=\"wl wl-kjv\" data-code=\"H6239\">riches</span> and <span class=\"wl wl-kjv\" data-code=\"H5233\">wealth,</span> and hath given him <span class=\"wl wl-kjv\" data-code=\"H7980\">power</span> to <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> thereof, and to <span class=\"wl wl-kjv\" data-code=\"H5375\">take</span> his <span class=\"wl wl-kjv\" data-code=\"H2506\">portion,</span> and to <span class=\"wl wl-kjv\" data-code=\"H8055\">rejoice</span> in his <span class=\"wl wl-kjv\" data-code=\"H5999\">labour;</span> <span class=\"wl wl-kjv\" data-code=\"H2090\">this</span> is the <span class=\"wl wl-kjv\" data-code=\"H4991\">gift</span> of God.","19":"For he shall not <span class=\"wl wl-kjv\" data-code=\"H7235\">much</span> <span class=\"wl wl-kjv\" data-code=\"H2142\">remember</span> the <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> of his <span class=\"wl wl-kjv\" data-code=\"H2416\">life;</span> because <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H6031\">answereth</span> him in the <span class=\"wl wl-kjv\" data-code=\"H8057\">joy</span> of his heart."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"niet te snel","tekst":"De zin is: Als gij in het huis des Heeren komt om God te bidden, zo haast u zozeer niet, dat gij Hem zoudt aanbidden zonder aandacht. Anders: wees niet te snel, enz. te weten om den Heere onbedacht enige belofte te doen."},{"catchword":"een woord","tekst":"Of enig ding."},{"catchword":"gij zijt op de aarde","tekst":"Derhalve, wil hij zeggen, moeten wij met die grote hoogverheven God niet spreken alsof men met zijns gelijke te doen had; maar men moet voor zijne hoge majesteit verschijnen in alle nederigheid en ootmoedigheid, gedachtig zijnde dat wij aardwormen zijn."},{"catchword":"laat uw woorden","tekst":"Te weten die gij in het bidden gebruikt. De regel van recht en wel te bidden met weinige woorden, heeft ons de Heere Christus voorgeschreven; Mat 6:7 ."}],"2":[{"catchword":"gelijk","tekst":"Dat is, gelijk het vele dromen spruit uit de veelheid der dingen, waarmede men des daags bekommerd en bezig is, alzo spruit het gesnater der zotten uit de lust en de gewoonte van veel te spreken."}],"3":[{"catchword":"aan zotten;","tekst":"Dat is, aan de geveinsde of lichtvaardige mensen, die in nood zijnde, grote beloften doen; maar als zij daaruit verlost zijn, hunne beloften lichtelijk vergeten."}],"5":[{"catchword":"uw vlees","tekst":"Dat is u, of uw lichaam, uw verdorven vlees."},{"catchword":"zou doen zondigen;","tekst":"Mits weigerende uw belofte te betalen."},{"catchword":"en zeg niet","tekst":"Te weten als hij u komt afeisen hetgeen gij beloofd hebt."},{"catchword":"des engels,","tekst":"Sommigen verstaan hier door den engel onze Heere Christus, die genoemd wordt de engels des verbonds; Mal 3:1 . Zie Exo 23:20 . Anderen den priester, of leraar, die een engel of zendbode Gods is; Mal 2:7 ; 1Co 11:10 ; Rev 2:1 , enz."},{"catchword":"een dwaling was;","tekst":"Of misverstand, fout, onwetendheid, dat is, een fout der onwetendheid. Alsof hij wilde zeggen: Ik heb het alzo niet gemeend, of. ik heb het onvoordachtzaam beloofd en daarom begeer is van die belofte ontslagen te wezen."},{"catchword":"waarom zou God","tekst":"De zin is: Waarom wilt gij het zo maken, dat God zich heftig tegen u vergramme om zulker reden en daden wil? Gij zult voorwaar kwalijk varen, indien gij hierin niet bijtijds voor u ziet; Exo 23:21 ."},{"catchword":"om uwer stemme","tekst":"Dat is, over uw zeggen, vanwege zulke lichtvaardige beloften en onnutte uitvluchten."},{"catchword":"verderven","tekst":"Dat is, dat God zou kwalijk gelukken laten al wat gij ter hand neemt."}],"6":[{"catchword":"gelijk","tekst":"De zin is: De dromen hebben dikwijls niets te beduiden en daar volgt niets na. Zo is het dan ijdelheid. Anders: want gelijk wanneer de dromen vermenigvuldigen, ook de ijdelheden vermenigvuldigen. alzo is het ook met vele woorden."},{"catchword":"in veel woorden;","tekst":"Of, in veel zaken, in veel dingen."},{"catchword":"maar vrees gij God","tekst":"Alsog hij zeide: Het is met veel zeggen niet te doen; maar met de daad en met een ware godvrezendheid, wanneer men voor het aangezicht des Heeren verschijnt. Anders: daarom vrees God, dat is, dewijl Hij de macht heeft u te straffen, zo vrees zijnen toorn."}],"7":[{"catchword":"Indien gij","tekst":"Hij wil zeggen: Is er iemand, die meent dat het tevergeefs is God te vrezen en oprecht te dienen, overmits de goddelozen doen schier wat zij willen, zonder daarover gestraft te worden. Daarop is dit te antwoorden, dat er een God in de hemel is, die op de ongerechtigheden wel nauw let om die te straffen aan de goddelozen hoe hoog zij ook hier in deze wereld verheven zijn."},{"catchword":"verwonder u","tekst":"Te weten, niet al te zeer, alzo dat gij de moed zou laten vallen, of aan de voorzienige regering Gods zou twijfelen, alsof Hij alles in de wereld liet lopen, zo het loopt, zonder zijne besturing en regering."},{"catchword":"voornemen;","tekst":"Anders: bedrijf, opzet, ding, handel. Dat is, over zodanige manier van doen. Men kan het dulden op de boze wil en bedrijf der goddeloze mensen, of op Gods wijze en rechtvaardige regering."},{"catchword":"hoger is dan de hoge,","tekst":"Dat is, God, die de Allerhoogste is veel hoger en machtiger dan de allerhoogsten en machtigsten dezer wereld; al zijn zij keizers, koningen, prinsen, of vorsten, of wat zij wezen mogen. Anders: want de hoogste neemt er acht op van de hoogte."},{"catchword":"neemt er acht op;","tekst":"Te weten op de verdrukkers der armen, enz. en Hij neemt er alzo acht opdat Hij hen te zijner tijd straffen zal."},{"catchword":"hogen","tekst":"Te weten de heilige engelen, die onder niemand dan alleen onder Gods gebied staan; die nemen ook acht op het doen der goddeloze rechters."},{"catchword":"boven henlieden","tekst":"Te weten boven die, die het recht en de gerechtigheid schenden en de armen onderdrukken. Zie Dan 10:20 , en Dan 11:1 ."}],"8":[{"catchword":"Het voordeel des aardrijks","tekst":"Dat is een lof der landbouwerij boven alle handelingen en neringen, tot welke zich de mensen in dit leven begeven."},{"catchword":"voor allen","tekst":"Of, is in alle, dat is, het heeft overal plaats en zijn nut."},{"catchword":"wordt van het veld gediend","tekst":"De zin is: Een koning zelfs is aan de noodzakelijkheid van de landbouw onderworpen, zonder welke hij zichzelven, en zijn hof, en zijn heir, en zijne onderzaten niet kan onderhouden. Zie hiervan voorbeelden in Farao, Gen 41 .gen. 47; en in Saul, 2Sa 9:9-10 Anders: wordt een knecht des velds; dat is, koningen, prinsen, of de groten dezer wereld begeven zich somtijds tot de landbouwerij."}],"9":[{"catchword":"wie den overvloed liefheeft","tekst":"Dit vers spreekt van de onverzadelijkheid der gierigen, naar het algemene spreekwoord: Veel goeds stopt geen gierigheid. Anders: die den overvloed liefheeft zal geen inkomen hebben; dat is, die overdadig is in kostelijke klederen en huisraad. Die een grote menigte van knechts en maagden houdt, en aan andere onnodige dingen zijn geld verspilt, dien kunnen zijne renten en inkomsten niet voeden. Verg. dit met Psa 37:16 ."}],"10":[{"catchword":"waar het goed vermenigvuldigt","tekst":"Dat is, hoe meer goederen iemand bezit, hoe meer hij mensendienst en hulp behoeft, om welke te onderhouden hij grote kosten doen moet. Zo strekt dan het goed ook niet tot gerustheid of gelukzaligheid desgenen, die het in grote overvloed bezit."},{"catchword":"wat nuttigheid","tekst":"Anders: wat genot, welvaren, voordeel."},{"catchword":"hebben dan de","tekst":"Welverstaande van hetgeen zij meer hebben dan hun eigen nooddruft; daarvan hebben zij geen nuttigheid, dan het gezicht hunner ogen; dat is, niet meer dan men van een geschilderd tafereel heeft. Anderen nemen het in dezen zin: De rijken moeten dagelijks voor hun ogen zien dat hun rijkdom van anderen verteerd en opgegeten wordt."},{"catchword":"bezitters daarvan","tekst":"Hebr. heren, meesters, of eigenaars; te weten des goeds."},{"catchword":"dan het gezicht hunner ogen","tekst":"Dat is, dan dat zij het met hunne ogen aanzien."}],"11":[{"catchword":"De slaap des arbeiders","tekst":"Of, wie arbeidt, die is de slaap zoet. Anders: wie akkerwerk doet, die is de slaap zoet; want het Hebreeuwse woord wordt eigenlijk gebruikt van akkerwerk of landbouwerij, gelijk Gen 2:5 , en 2Sa 9:10 ."},{"catchword":"de zatheid des rijken","tekst":"Te weten, niet alleen ten aanzien dat de rijke niet vermoeid is van arbeiden, maar met goede sier maken de maag overlaadt; ook zijn de rijken en machtigen dezer wereld meer gevaren onderworpen dan de armen. Bij de rijke gierigaards is ook een onverzadelijke begeerte om het geld en de schatten te vermeerderen en vrees van dezelve te verliezen, hetwelk hun dikwijls de slaap breekt en verhindert."}],"12":[{"catchword":"kwaad,","tekst":"Hebr. een krank kwaad. Zie onder vs.16."},{"catchword":"rijkdom van","tekst":"De rijkdom wordt met zorg bewaard, dikwijls tot des eigenaars of bezitters eigen ongeluk; want meermalen vervallen de rijken in grote zwarigheid vanwege hun rijkdom; of de rijkdom vergaat door een boos bedrijf, hetzij door een wellustig of overdadig leven, of anderszins; dat strekt dan tot kwelling en onrust huns gemoeds. Zie Ecc 6:2 ."},{"catchword":"zijn bezitters bewaard tot","tekst":"Gelijk boven vs.10."},{"catchword":"hun eigen kwaad","tekst":"Dat is, tot schade dergenen, die het hebben. Hebr. tot zijn kwaad; dat is, tot kwaad van elkeen dergenen, die het hebben of bezitten."}],"13":[{"catchword":"door een moeilijke bezigheid","tekst":"Zie boven Ecc 1:13 ."},{"catchword":"hij gewint een zoon","tekst":"Te weten, de rijke, wiens goederen teniet gekomen zijn."},{"catchword":"er is niet met al in zijn hand","tekst":"Te weten, dat hij zijnen zoon geeft, of dat hij zal hebben aan te tasten; te weten na zijn vaders dood."}],"14":[{"catchword":"hij voortgekomen is","tekst":"Te weten de rijke of des rijken zoon, nu verarmd zijnde; doch deze spreuk is ook waar in het algemeen van alle mensen, hoe rijk zij zijn, want hoe rijk de mensen zijn als zij sterven, zo nemen zij niets mede. Zie Job 1:21 , en 1Ti 6:7 ."},{"catchword":"van zijn arbeid,","tekst":"Dat is, van de goederen, die hij met zijn arbeid gewonnen en samengebracht heeft. Gelijk vs.17,18."}],"15":[{"catchword":"gekomen is,","tekst":"Te weten naakt."},{"catchword":"heengaat;","tekst":"Te weten uit deze wereld."},{"catchword":"in den wind gearbeid","tekst":"Of, voor den wind; dat is, tevergeefs; of om een nietige vergankelijke zaak, zijnde van al zijn arbeid niets meer verbeterd, dan alsof het de wind wegdreef en verdwaalde; zie Job 6:26 ."}],"16":[{"catchword":"in duisternis","tekst":"Dat is, in verdriet en ellende, vermijdende der mensen gezelschap."},{"catchword":"zijn krankheid,","tekst":"Dit is niet zozeer van een lichamelijke krankheid te verstaan, als van een inwendige ongesteldheid, of ziekte des gemoeds, hartzeer en onwil."},{"catchword":"onstuimigen toorn","tekst":"Hebr, eigenlijk: schuimigen toorn."}],"17":[{"catchword":"te eten en te drinken","tekst":"Te weten met vrolijkheid, zich niet te zeer bekommerende met hetgeen hierna geschieden zal; alzo nochtans, dat men nimmermeer vergete God voor ogen te hebben in het genieten zijner goede gaven; want zien betekent hier genieten. Zie de aantekening bij Job 7:7 ."},{"catchword":"genieten het goede","tekst":"Hebr. zien."},{"catchword":"want dat is zijn deel","tekst":"Te weten hetwelk hem in dit leven van zijn tijdelijke goederen is toegelegd, meer heeft hij er niet van te verwachten. Doch de kinderen Gods hebben verre een ander deel dan dit is, want God zels is hun deel, Psa 16:5 , en Psa 73:26 , en Lam 3:24 . Ja zij zijn met Christus medeërfgenamen van een onvergankelijk erfdeel, Rom 8:17 ; 1Pe 1:4 ."}],"18":[{"catchword":"geeft hem de macht,","tekst":"Dat is, hij beweegt zijn hart daartoe, dat hij van hetgeen hem God gegeven heeft zijn portie of deel neme en blijdelijk geniete."}],"19":[{"catchword":"hij zal niet veel gedenken","tekst":"Dat is hij zal zichzelven niet kwellen met veel peinzen op het verdriet, hetwelk hij in zijn leven gehad heeft, noch met de zorg, van het lijden, dat hem nog kan overkomen."},{"catchword":"dewijl hem God","tekst":"Dat is, dewijl God hem de vreugde doet genieten, om welke hij in zijn hart gewenst heeft."},{"catchword":"blijdschap zijns harten","tekst":"Daar is drieerlei blijdschap des harten; vooreerst een natuurlijke, rijzende uit het gevoel van den tijdelijken welstand; ten tweede een burgerlijke, herkomende uit de oefening van enige voortreffelijke burgerlijke deugden, gelijk in de heidenen, die zich in rechtmatige kloekmoedigheid, enz. voortreffelijk hebben gekweten; ten derde is er ook een geestelijke blijdschap des harten rijzende uit het gevoel van onzen vrede met God. Die is de treffelijkste; Rom 5:1 ."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"(1) Be not too rash with thy mouth, and let not thine heart hasten to utter a word, [Or any thing] before the face of God: [the meaning is, when thou comest into the house of the Lord, to call upon God, make not too great hast, that thou mayest not pray unto him without reverence and attention. Oth. Be not too quick, &c. To wit, to make any vow unto the Lord unadvisedly, or undiscreetly] for God is in heaven, and thou art upon earth; [therefore ( as if he should say) we must not speak unto that great and high God, as is we had to do with our equals; but we ought to come before his high and glorious Majesty with all humility and lowliness of heart, remembering that we are poor vile earth-worms] therefore let thy words be few. [to wit, which thou usest in prayer. The rule of praying aright, in few words, is prescribed unto us by our blessed Saviour, Mat 6:7.]"}],"2":[{"catchword":null,"tekst":"(2) For (as) a dream cometh through much business: so a fools voice, by the multitude of words. [That is, as much dreaming issueth from the multitude of affairs, wherewith a man is troubled and busied in day time: so doth the babbling and prating of fools issue and proceed from the desire and custom of speaking much.]"}],"3":[{"catchword":null,"tekst":"(3) When thou shalt vowed a vow unto God; [See Num 30:3. Deut.23.21.] defer not to pay it; for he hath no pleasure in fools; [that is, in hypocritical and vain men, who being in straights make great and large vowes, but when they are delivered out of trouble, they soon forget what they have vowed] whatsoever thou shalt have vowed, pay it."}],"4":[{"catchword":null,"tekst":"(4) Better is thou that shouldest not vow, then that thou shouldest vow, and not pay. [Compare, Deut.23.21,22.]"}],"5":[{"catchword":null,"tekst":"(5) Suffer not thy mouth to cause thy flesh [That is, thy self, or thy body, thy corrupt flesh] to sin; [by refusing to pay thy vow] neither say before the face of the Angel, [to wit, when he cometh to require at thy hand the thing that thou hast vowed. Some do understand here by the Angel, our Saviour Christ, who is called, the Angel of the Covenant, Malach.3.1. see Exod.23 on v.20. oth. The Priest of Teacher, who is an Angel, or Messenger of God, Mal.2.7, 1 Cor.11.10. Revel.2.1,&c.] that it was an error: [or, mistake, fault, ignorance, that is, a fault of ignorance. As if he would say, I did not mean so, or I vowed inconsiderately, not thinking of it afore-hand, and therefore I desire to be excused and freed from the vow] wherefore should God be very wrath, because of thy voice, [that is, at thy saying, by reason of such rash vowes, and idle and unprofitable excuses] and destroy the work of thine hands? [that is, that God should cause the things to proper ill, which thou takest in hand. The meaning is, wilt thou make it so that God be exceedingly provoked to anger against thee, for such kind of speeches and actions of thine? It shall indeed go very ill with thee, if touching this matter thou lookest not well to thy self in thy self in time, Exo 23:21.]"}],"6":[{"catchword":null,"tekst":"(6) For as in the multitude of dreams (there) are vanities: so likewise (in) in many words: [Or, in many matters, in many things. The meaning is, dreams have often times no signification at all, neither doth anything follow upon them, therefore they are meer vanity. Oth. For (as) when dreams are multiplied, vanities (are) also (multiplied) so is it likewise with many words. Compare, Pro 10:19.] but fear thou God. [As if he should say: To use many words is but vain. A must have deeds as well as words: he must have the true fear of God in him, when he cometh before the face of his Majesty. Oth. There fore fear God: that is, in regard he hath power to punish thee, therefore fear his wrath.]"}],"7":[{"catchword":null,"tekst":"(7) If thou seest the oppression of the poor, and the spoiling of judgement and justice in a Province, marvel not [To wit, not too much, so as thou shouldest not despair and grow out of heart, or doubt of Gods Province, as if he suffered all things in the world to run at random, without any guiding or governing by him at all] at such a purpose: [oth. Pretence, intent, thing, matter, dealings; that is, at such kind of dealing. It may be applied either to the evil intention and practice of wicked men, or to Gods wise and righteous providence] for he that is higher that the high ones, [that is, God, who is the most high, much higher and mightier , then the highest and mightiest of this word, be they Emperors, Kings, Princes, or Potentates, or what they may be. Oth. For the highest takes notice of the height] regardeth it: [to wit, the oppression of the poor, etc. And he so regardeth them, as that he shall certainly punish them in his own due time] and there are the high ones [to wit, the holy Angels, who are under the command of none but God alone: they likewise regard and heed the actings of wicked Judged] above them. [to wit, above those that violet judgement and justice, and do oppress the poor. See Dan.10.20. and 11.1, the meaning of the words of this verse seemeth in brief to be any one that thinketh that it is vain for to fear and serve God uprightly, because wicked men do almost whatsoever they lift, without being punished for it: the thereunto is, that there is a God in heaven, that diligently and narrowly heedeth all unrighteous dealings, to punish them in wicked men, how highly soever they maybe exalted here in this world.]"}],"8":[{"catchword":null,"tekst":"(8) The profit of the Earth, that is for all, [Or is in all, ; that is, it is everywhere in use and useful] the King himself is saved by the field, [the meaning is, a King himself is subject to the necessity of tillage or husbandry, without which he can maintain neither himself, nor his Court, nor his Army, nor his Subjects. See hereof examples in Pharaoh, Gen.41.and 47. And in Saul, I Sam.9.11. oth. Becameth a servant of the field. That is, Kings, Princes, or the great ones of the world, do sometimes give themselves to husbandry or tillage. So that in this verse is lively represented unto us the praise and commendation of tillage, above all other trades and occupation, whereunto men do give and apply themselves in this life.]"}],"9":[{"catchword":null,"tekst":"(9) He that loveth money, is not satistified with money; and whose loveth abundance, is not ( satisfied) with increase: This is also vanity. [This verse speaketh of insatiabileness of covetous misers; according to the common proverb, Much treasure stoppeth not a misers mouth. Oth. He that loveth money, shall have no increase; that is, he that exceedeth in costly apparel and household st // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;

  popup.style.display = 'block';

  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }

const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}

      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);

    }).join('');
}

  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  // slug -> volledige boeknaam (voor citaten met de volle boeknaam i.p.v. de afkorting)
  const boeknaamPerSlug = {};
  (D.meta.boeken || []).forEach(b => {
    const m = b.href.match(/^\.\.\/\.\.\/([^/]+)\//);
    if (m) boeknaamPerSlug[m[1]] = b.naam;
  });
  // dubbele rechtsklik (binnen 500ms, zelfde verwijzing) kopieert het vers
  // i.p.v. de vertalingen-popup te tonen (enkele rechtsklik blijft bestaand gedrag)
  function kopieerVerwijzing(chip, ref) {
    haalVert('versteksten', ref).then(data => {
      const tekst = data && data[ref.vers];
      if (!tekst) return;
      const url = location.origin + '/studiebijbel/' + ref.slug + '/' + ref.hfd + '#v' + ref.vers;
      const naam = boeknaamPerSlug[ref.slug] || chip.textContent.replace(/\s+\d+:\d+.*$/, '');
      const kopie = tekst.replace(/\*/g, '') + `\n~ [${naam} ${ref.hfd}:${ref.vers}](${url})`;
      navigator.clipboard.writeText(kopie).then(() => {
        toast.classList.add('zichtbaar');
        setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
      });
    });
  }
  let laatsteRechtsklik = { sleutel: null, tijd: 0 };
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    const sleutel = chip.dataset.ref;
    const nu = Date.now();
    const isDubbelklik = laatsteRechtsklik.sleutel === sleutel && (nu - laatsteRechtsklik.tijd) < 500;
    laatsteRechtsklik = isDubbelklik ? { sleutel: null, tijd: 0 } : { sleutel, tijd: nu };
    if (isDubbelklik) {
      popup.style.display = 'none';
      vpopup.style.display = 'none';
      kopieerVerwijzing(chip, ref);
      return;
    }
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
