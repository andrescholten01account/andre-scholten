hart richtte op elk werk dat onder de zon gebeurt: er is een tijd dat de ene mens over de andere heerst, hem tot zijn eigen kwaad.","10":"Zo heb ik ook gezien dat de goddelozen begraven werden, en degenen die kwamen en uit de heilige plaats gingen, werden vergeten in die stad, waarin zij zo gehandeld hadden. Dit is ook vluchtigheid.","11":"Omdat het oordeel over de boze daad niet snel wordt uitgevoerd, daarom is het hart van de mensenkinderen in hen vol om kwaad te doen.","12":"Hoewel een zondaar honderd maal kwaad doet, en God zijn dagen verlengt, weet ik toch zeker, dat het hun goed zal gaan die God vrezen, die voor Zijn aangezicht vrezen.","13":"Maar de goddeloze zal het niet goed gaan, en hij zal zijn dagen niet verlengen; hij zal zijn als een schaduw, omdat hij niet vreest voor het aangezicht van God.","14":"Er is nog een vluchtigheid, die op aarde gebeurt: dat er rechtvaardigen zijn, die overkomt wat de goddelozen toekomt, en er zijn goddelozen, die overkomt wat de rechtvaardigen toekomt. Ik zeg, dat dit ook vluchtigheid is.","15":"Daarom prees ik de blijdschap, omdat de mens niets beters heeft onder de zon, dan te eten, en te drinken, en blijde te zijn; want dat zal hem bijblijven van zijn arbeid, de dagen van zijn leven, die God hem geeft onder de zon.","16":"Toen ik mijn hart erop richtte om wijsheid te kennen, en om de bezigheid te zien die op de aarde gebeurt, dat men zelfs overdag of 's nachts geen slaap ziet met zijn ogen;","17":"toen zag ik al het werk van God, dat de mens niet kan doorgronden, het werk dat onder de zon gebeurt, waarnaar een mens zoekt met inspanning, maar hij zal het niet doorgronden; ja, zelfs al zou een wijze zeggen dat hij het zou kennen, dan nog zal hij het niet kunnen doorgronden."},"SV":{"1":"Wie is gelijk de wijze, en wie weet de uitlegging der dingen? De wijsheid der mensen verlicht zijn aangezicht, en de stuursheid zijns aangezichts wordt *daardoor* veranderd.","2":"Ik *zeg*: Neem acht op den mond des konings; doch naar de gelegenheid van den eed Gods.","3":"Haast u niet weg te gaan van zijn aangezicht; blijf niet staande in een kwade zaak; want al wat hem lust, doet hij.","4":"Waar het woord des konings is, daar is heerschappij; en wie zal tot hem zeggen: Wat doet gij?","5":"Wie het gebod onderhoudt, zal niets kwaads gewaar worden; en het hart eens wijzen zal tijd en wijze weten.","6":"Want een ieder voornemen heeft tijd en wijze, dewijl het kwaad des mensen veel is over hem.","7":"Want hij weet niet, wat er geschieden zal; want wie zal het hem te kennen geven, wanneer het geschieden zal?","8":"Er is geen mens, die heerschappij heeft over den geest, om den geest in te houden; en hij heeft geen heerschappij over den dag des doods; ook geen geweer in dezen strijd; ook zal de goddeloosheid haar meesters niet verlossen.","9":"Dit alles heb ik gezien, toen ik mijn hart begaf tot alle werk, dat onder de zon geschiedt: er is een tijd, dat de *ene* mens over den *anderen* mens heerst, hem ten kwade.","10":"Alzo heb ik ook gezien de goddelozen, die begraven waren, en *degenen*, *die* kwamen, en uit de plaats des Heiligen gingen, die werden vergeten in die stad, *in* dewelke zij recht gedaan hadden. Dit is ook ijdelheid.","11":"Omdat niet haastelijk het oordeel *over* de boze daad geschiedt, daarom is het hart van de kinderen der mensen in hen vol om kwaad te doen.","12":"Hoewel een zondaar honderd *maal* kwaad doet, en *God* hem *de* *dagen* verlengt; zo weet ik toch, dat het dien zal welgaan, die God vrezen, die voor Zijn aangezicht vrezen.","13":"Maar den goddeloze zal het niet welgaan, en hij zal de dagen niet verlengen; hij zal zijn gelijk een schaduw, omdat hij voor Gods aangezicht niet vreest.","14":"Er is *nog* een ijdelheid, die op aarde geschiedt: dat er zijn rechtvaardigen, dien het wedervaart naar het werk der goddelozen, en er zijn goddelozen, dien het wedervaart naar het werk der rechtvaardigen. Ik zeg, dat dit ook ijdelheid is.","15":"Daarom prees ik de blijdschap, dewijl de mens niets beters heeft onder de zon, dan te eten, en te drinken, en blijde te zijn; want dat zal hem aankleven van zijn arbeid, de dagen zijns levens, die hem God geeft onder de zon.","16":"Als ik mijn hart begaf, om wijsheid te weten, en om aan te zien de bezigheid, die op de aarde geschiedt, dat men ook, des daags of des nachts, den slaap niet ziet met zijne ogen;","17":"Toen zag ik al het werk Gods, dat de mens niet kan uitvinden, het werk, dat onder de zon geschiedt, om hetwelk een mens arbeidt om te zoeken, maar hij zal het niet uitvinden; ja, indien ook een wijze zeide, dat hij het zou weten, zo zal hij het *toch* niet kunnen uitvinden."},"KJV":{"1":"Who *is* as the wise *man*? and who knoweth the interpretation of a thing? a man's wisdom maketh his face to shine, and the boldness of his face shall be changed.","2":"I *counsel thee* to keep the king's commandment, and *that* in regard of the oath of God.","3":"Be not hasty to go out of his sight: stand not in an evil thing; for he doeth whatsoever pleaseth","4":"Where the word of a king *is, there is* power: and who may say unto him, What doest","5":"Whoso keepeth the commandment shall feel no evil thing: and a wise man's heart discerneth both time and judgment.","6":"Because to every purpose there is time and judgment, therefore the misery of man *is* great","7":"For he knoweth not that which shall be: for who can tell","8":"*There is* no man that hath power over the spirit to retain the spirit; neither *hath he* power in the day of death: and *there is* no discharge in *that* war; neither shall wickedness deliver those that are given","9":"All this have I seen, and applied my heart unto every work that is done under the sun: *there is* a time wherein one man ruleth over another to his own hurt.","10":"And so I saw the wicked buried, who had come and gone from the place of the holy, and they were forgotten in the city where they had so done: this *is* also vanity.","11":"Because sentence against an evil work is not executed speedily, therefore the heart of the sons of men is fully set in them to do evil.","12":"Though a sinner do evil an hundred times, and his *days* be prolonged, yet surely I know that it shall be well with them that fear God, which fear before","13":"But it shall not be well with the wicked, neither shall he prolong *his* days, *which are* as a shadow; because he feareth not before God.","14":"There is a vanity which is done upon the earth; that there be just *men*, unto whom it happeneth according to the work of the wicked; again, there be wicked *men*, to whom it happeneth according to the work of the righteous: I said that this also *is* vanity.","15":"Then I commended mirth, because a man hath no better thing under the sun, than to eat, and to drink, and to be merry: for that shall abide with him of his labour the days of his life, which God giveth him under the sun.","16":"When I applied mine heart to know wisdom, and to see the business that is done upon the earth: (for also *there is that* neither day nor night seeth sleep with his eyes:)","17":"Then I beheld all the work of God, that a man cannot find out the work that is done under the sun: because though a man labour to seek *it* out, yet he shall not find *it*; yea further; though a wise *man* think to know *it*, yet shall he not be able to find"}},"tsk":{"1":[{"kopje":"als de","refs":["Pred 2:13","Pred 2:14","1 Kor 2:13-16"]},{"kopje":"wie weet","refs":["Gen 40:8","Gen 41:15","Gen 41:16","Gen 41:38","Gen 41:39","Job 33:23","Spr 1:6","Dan 2:28-30","Dan 2:47","Dan 4:18","Dan 4:19","2 Petr 1:20"]},{"kopje":"van de mens","refs":["Ex 34:29","Ex 34:30","Spr 4:8","Spr 4:9","Spr 17:24","Spr 24:5","Matt 17:2","Hand 6:15"]},{"kopje":"en de","refs":["Deut 28:50","Hand 4:13","Hand 4:29","Ef 6:19"]},{"kopje":"hardheid","refs":["2 Tim 4:17"]}],"2":[{"kopje":"Ik zeg","refs":["Spr 24:21","Rom 13:1-4","Tit 3:1","1 Petr 2:13-17"]},{"kopje":"rekening met","refs":["1 Kon 2:43","1 Kron 29:24","Ezech 17:13-20","Rom  the <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> of the <span class=\"wl wl-kjv\" data-code=\"H6918\">holy,</span> and they were <span class=\"wl wl-kjv\" data-code=\"H7911\">forgotten</span> in the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> where they had so <span class=\"wl wl-kjv\" data-code=\"H6213\">done:</span> this is also vanity.","11":"Because <span class=\"wl wl-kjv\" data-code=\"H6599\">sentence</span> against an <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> <span class=\"wl wl-kjv\" data-code=\"H4639\">work</span> is not <span class=\"wl wl-kjv\" data-code=\"H6213\">executed</span> <span class=\"wl wl-kjv\" data-code=\"H4120\">speedily,</span> therefore the <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H120\">men</span> is fully <span class=\"wl wl-kjv\" data-code=\"H4390\">set</span> in them to <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> evil.","12":"Though a <span class=\"wl wl-kjv\" data-code=\"H2398\">sinner</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> an hundred <span class=\"wl wl-kjv\" data-code=\"H3967\">times,</span> and his days be <span class=\"wl wl-kjv\" data-code=\"H748\">prolonged,</span> yet surely I <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> that it shall be <span class=\"wl wl-kjv\" data-code=\"H2896\">well</span> with them that <span class=\"wl wl-kjv\" data-code=\"H3373\">fear</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> which <span class=\"wl wl-kjv\" data-code=\"H3372\">fear</span> before","13":"But it shall not be <span class=\"wl wl-kjv\" data-code=\"H2896\">well</span> with the <span class=\"wl wl-kjv\" data-code=\"H7563\">wicked,</span> neither shall he <span class=\"wl wl-kjv\" data-code=\"H748\">prolong</span> his <span class=\"wl wl-kjv\" data-code n class=\"wl wl-kjv\" data-code=\"H3117\">days</span> of his <span class=\"wl wl-kjv\" data-code=\"H2416\">life,</span> which <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">giveth</span> him under the sun.","16":"When I <span class=\"wl wl-kjv\" data-code=\"H5414\">applied</span> mine <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> to <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> <span class=\"wl wl-kjv\" data-code=\"H2451\">wisdom,</span> and to <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> the <span class=\"wl wl-kjv\" data-code=\"H6045\">business</span> that is <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> upon the <span class=\"wl wl-kjv\" data-code=\"H776\">earth:</span> (for also there is that neither <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> nor <span class=\"wl wl-kjv\" data-code=\"H3915\">night</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">seeth</span> <span class=\"wl wl-kjv\" data-code=\"H8142\">sleep</span> with his eyes:)","17":"Then I <span class=\"wl wl-kjv\" data-code=\"H7200\">beheld</span> all the <span class=\"wl wl-kjv\" data-code=\"H4639\">work</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> that a <span class=\"wl wl-kjv\" data-code=\"H120\">man</span> <span class=\"wl wl-kjv\" data-code=\"H3201\">cannot</span> find <span class=\"wl wl-kjv\" data-code=\"H4672\">out</span> the <span class=\"wl wl-kjv\" data-code=\"H4639\">work</span> that is <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> under the <span class=\"wl wl-kjv\" data-code=\"H8121\">sun:</span> <span class=\"wl wl-kjv\" data-code=\"H834\">because</span> <span class=\"wl wl-kjv\" data-code=\"H7945\">though</span> a <span class=\"wl wl-kjv\" data-code=\"H120\">man</span> <span class=\"wl wl-kjv\" data-code=\"H5998\">labour</span> to seek it <span class=\"wl wl-kjv\" data-code=\"H1245\">out,</span> yet he shall not <span class=\"wl wl-kjv  a sentence, or words: and signifieth often commands or precepts, as Exo 17:1. compare, Pro 24:21.] but according to the nature of the oath of God. [that is, obey the King or the magistrate so, as that in the mean while thou forsake not, nor forget the duty and oath whereby thou art principally bound and ingaged unto God. Oth. In regard of the oath of God, or because of the oath of God, or the oath of Gods sake.]"}],"3":[{"catchword":null,"tekst":"Make no hast to go away from his [To wit, the Kings] face; [to wit, through impatience, when he enjoyneth thee somewhat that peaseth thee not; bewraying by thy speedy going away, that thou art loth to do that which the King injoineth thee. Oth. To go away, that is, to depart from his service, and to leave him. [Some understand this and that which followeth, of God] persist not in an evil thing; [that is, maintain not a bad cause, stand not out in it, plead not for it. See the annotate. 2 Kings 23. On ver.3. or do not obstinately persist in refusing to obey the Kings command] for he doth whatsoever pleaseth him, [to wit, the King, so that whensoever he pleaseth, he be avenged on thee, and when he is once angered, he will soon punish thee.]"}],"4":[{"catchword":null,"tekst":"Where the word [That is, the command] of a King is, there is dominion; and who shall say unto him, what doest thou? [that is, why doest thou enjoin me this? The meaning is, when once the King commandeth his servants to punish thee, who dare oppose or with-stand his power and swaying authority.]"}],"5":[{"catchword":null,"tekst":"Whoso keepeth the Commandment, [to wit, the commandment or precepts of the King, which is not repugnant to the will and commandment of God] shall feel no evil; [that is, he shall not incure the displeasure and punishment of God, or of the King, or of the Magistrate. Compare Rom. 13.3. Heb. Shall not know (both) time and manner. [that is, a wise man knoweth how to fit and frame himself to every occasion or opportunity he meeteth with, so as not to offend either God or the King.]"}],"6":[{"catchword":null,"tekst":"For every purpose hath time and manner: Because the evil of man is much over him. [that is, man is subject to much misery and infirmity, therefore he ought to be wise and prudent in his affairs.]"}],"7":[{"catchword":null,"tekst":"For he knoweth not what shall cometh to pass&Atilde;&copy;: for who shall certify him, when [Or how] how it shall come to pass? [that is, he knoweth not what God will do to him, as he like wise knoweth not the time when: and therefore he cannot prevent it. Therefore he ought continually to beg to God, an holy prudence, that he may know how to behave himself aright, compare above, ch.6.12.]"}],"8":[{"catchword":null,"tekst":"There is no man that hath dominion over the Spirit, [To wit, when death seizeth upon man] to keep the spirit in; [that is, to keep the breath, or the soul, or the spirit of life in the body, that it should not depart out of it. The Hebrew word signifieth as much as to shut and keep in a prison] neither hath any dominion over the day of death: [or, in the day of death: [or, in the day of death. That is, when death cometh to assault life, and that once the day of death is come, there is no way or means to escape death, compare Job 14:5. and Psal. 39.6.] also (there is) no weapon [that is, carnal weapons. Oth. No discharge] in this battle, [that is, when life and death strive together, or fight one against another] neither shall wickedness deliver its masters. [as we commonly say, iniquity or justice, smiteth its own master. Oth. The disquiet stir; as if he had said, that a man at one time that intendeth this thing, at another time that thing, and is very busy and restless to attain to his intent and purpose, this likewise will not avail or profit him against death.]"}],"9":[{"catchword":null,"tekst":"All these have I seen, when I applied mine heart unto all (or every) work that is under the Sun. There is a time that (one) man ruleth over (another) man, to his (own) hurt. [to wit, either to the hurt of him that ruleth, or of him over whom he ruleth. Or, (I saw also) a time, wherein, &c. To wit, when an unrighteous or unjust man is advanced into the place of authority, and swayeth the sceptre; whereas those that execute that office, ought chiefly and above all to seek the good and welfare of their subjects, Rom. 13.4.]"}],"10":[{"catchword":null,"tekst":"So have I seen the wicked that were buried, [That is, that were put in oblivion] and (those that) came and went out of the place of the holy, they were forgotten in that City (in) which they had done judgment; [understand here by the place of the holy one, the Temple, wherein the holy God dwelleth. To come, or to enter in, and to go forth, is as much here as converse, or to be conversant in the house of God, and to exercise ones self in godlinesse. Others understand here by the holy place the place of Judicature, where the judges sit in Gods room or place, and represent the person of god, God being there present with them, yea bring president in the midst of them. oth. Understand this verse of the wicked, and render it thus; and then I saw the wicked, that they were buried and perished, and went away from the place of the holy, and were forgotten in the City wherein they had done so: that is, had governed wickedly] This [to wit, this inconsistency and unthankfulness of the people] is also vanity."}],"11":[{"catchword":null,"tekst":"Because judgment (concerning) an evil deed is not speedily done, therefore the heart of the children of men is full in them to do evil. [As if he had said, because God often delayeth his righteous judgment concerning the wicked, therefore they conceive that they shall always remain unpunished, and therefore they fall to all manner of wickedness and profaneness, compare Psal.50. on v.21.]"}],"12":[{"catchword":null,"tekst":"Though a sinner do evil an hundred (times), and (God) prolong his (dayes) yet I know surely that it shall go well with those that fear God, [To wit, with a fillal or child-like fear] that fear before his face. [that are said to offend him, see Psal. 37.9,10,11,12,18,19,20. Pro 1:33. Isa 3:10.]"}],"13":[{"catchword":null,"tekst":"But it shall not go well with the wicked, [Understand withal, but he shall be punished at last, either here or hereafter] neither shall he prolong (his) dayes: [that is, he shall not live long, at least in quietnesse, and with a good conscience, which is true life indeed] he shall be as a shadow, [which soon passeth away, see Psa 144:4. oth. He shall not prolong his dayes, as a shadow; which becomes long towards the Sun-setting as the Sun declineth or goeth down] because he feareth not before the face of God."}],"14":[{"catchword":null,"tekst":"There is (yet) a vanity which is done upon the earth: That there are just men unto whom it happeneth, [Heb. Toucheth, hitteth] according to the work of the wicked, [That is, as if they had done the works of wicked men] and there are wicked men unto whom it happeneth, according to the work of righteous. [the meaning is, sometimes it fareth ill with the godly, and well with the wicked. See Psam. 73.11,12,13,14.] I say [or, I said,] that this is also vanity. [to wit, because no man can be assured, that he shall always prosper in this world, because of this virtue and piety. Oth. This is also vanity; that is, this is a vain and absurd thing, according to thing judgment of man.]"}],"15":[{"catchword":null,"tekst":"Therefore I commended mirth, because a man hath nothing better under the Sun, [That is, as much as concerneth this temporal life] then to eat, and drink and to be merry; [but so as that he always have the fear of God before his eyes. See below, chap.12 verse 13. Compare above, chap.2.24. and 3.12,22. And 5.18. and 9.7.] for that shall cleave unto him of his labour, [that is, that shall be his portion] the dayes of his life which God giveth him under the Sun."}],"16":[{"catchword":null,"tekst":"When I applied mine heart to know wisdom, and to consider the business is done upon the earth, that a man neither by day, nor by night seeth sleep with his eyes; [That is, sleepeth not, to wit, by reason of care and trouble, which a man hath and undergoeth, for and about temporal riches. See above. Chap.2.vers.23.24.]"}],"17":[{"catchword":null,"tekst":"Then I beheld all the work of God; that a man cannot find out [To wit, by his own wit or understanding] the work that is done under the Sun: [to wit, gods providence concerning the things that are done in the world, as namely, how this can stand with the righteous government of god, to punish the holy oftentimes so severely, ad on the contrary, to blesse the wicked so exceedingly] to seek which (out0 [that is, to understand which thing; to wit, to know how all things in the world are wisely and prudently governed by God] a man laboureth, but he shall not find it out; yea, if a wise man also should say, [to wit, with himself in his heart] that he knew it, yet (surely) he shall not be able to find it out."}]}}};

    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');

  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'

    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +

    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
