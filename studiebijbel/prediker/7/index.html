 zijn dan deze? Want u zou daar niet uit wijsheid naar vragen.","11":"De wijsheid is goed met een erfdeel; en zij die de zon aanschouwen, hebben daar voordeel van.","12":"Want de wijsheid is tot een schaduw, en het geld is tot een schaduw; maar de uitnemendheid van de wetenschap is, dat de wijsheid haar bezitters het leven geeft.","13":"Aanmerk het werk van God; want wie kan recht maken, wat Hij krom gemaakt heeft?","14":"Geniet het goede op de dag van het voorspoed, maar op de dag van het tegenspoed, zie toe; want God maakt ook de een tegenover de ander, vanwege dat de mens niets zou vinden dat na hem zal zijn.","15":"Dit alles heb ik gezien in de dagen van mijn vluchtige leven; er is een rechtvaardige die in zijn gerechtigheid omkomt; daarentegen is er een goddeloze die in zijn slechtheid zijn dagen verlengt.","16":"Wees niet al te rechtvaardig, en houd uzelf ook niet al te wijs; waarom zou u verwoesting over u brengen?","17":"Wees niet al te goddeloos, en wees ook niet al te dwaas; waarom zou u sterven vóór uw tijd?","18":"Het is goed dat u daaraan vasthoudt, en trek ook uw hand van dit niet af; want wie God vreest, die ontgaat dat allemaal.","19":"De wijsheid versterkt de wijze meer dan tien heersers die in een stad zijn.","20":"Voorwaar, er is geen mens rechtvaardig op aarde, die goed doet en niet zondigt.","21":"Geef ook uw hart niet aan alle woorden die men spreekt, opdat u niet hoort dat uw knecht u vervloekt.","22":"Want uw hart heeft ook veel keren erkend, dat u ook anderen vervloekt hebt.","23":"Dit alles heb ik met wijsheid beproefd; ik zei: Ik zal wijsheid verkrijgen, maar zij was nog ver van mij.","24":"Wat ver weg is, en zeer diep, wie zal dat vinden?","25":"Ik keerde mij om, en mijn hart, om te weten, en om na te sporen, en te zoeken wijsheid en een verklaring; en om te weten de goddeloosheid van de dwaasheid, en de onzinnigheid van de waanzin.","26":"En ik vond iets bitterders dan de dood: een vrouw, wier hart netten en garen, en haar handen boeien zijn; wie goed is voor Gods aangezicht, zal aan haar ontkomen; daarentegen zal de zondaar door haar gevangen worden.","27":"Zie, dit heb ik gevonden, zegt de prediker, het ene bij het andere, om de verklaring te vinden;","28":"Waar mijn ziel nog naar zoekt, maar ik heb haar niet gevonden: één man uit duizend heb ik gevonden; maar een vrouw onder die allen heb ik niet gevonden.","29":"Alleen zie, dit heb ik gevonden, dat God de mens recht gemaakt heeft, maar zij hebben veel uitvindingen gezocht."},"SV":{"1":"Beter is een *goede* naam, dan goede olie, en de dag des doods, dan de dag, dat iemand geboren wordt.","2":"Het is beter te gaan in het klaaghuis, dan te gaan in het huis des maaltijds; *want* in hetzelve is het einde aller mensen, en de levende legt het in zijn hart.","3":"Het treuren is beter dan het lachen; want door de droefheid des aangezichts wordt het hart gebeterd.","4":"Het hart der wijzen is in het klaaghuis; maar het hart der zotten in het huis der vreugde.","5":"Het is beter te horen het bestraffen des wijzen, dan dat iemand hore het gezang der dwazen.","6":"Want gelijk het geluid der doornen onder een pot is, alzo is het lachen eens zots. Dit is ook ijdelheid.","7":"Voorwaar, de onderdrukking zou wel een wijze dol maken; en het geschenk verderft het hart.","8":"Het einde van een ding is beter dan zijn begin; de lankmoedige is beter dan de hoogmoedige.","9":"Zijt niet haastig in uw geest om te toornen; want de toorn rust in den boezem der dwazen.","10":"Zeg niet: Wat is er, dat de vorige dagen beter geweest zijn, dan deze? Want gij zoudt naar zulks niet uit wijsheid vragen.","11":"De wijsheid is goed met een erfdeel; en degenen, die de zon aanschouwen, hebben voordeel *daarvan*.","12":"Want de wijsheid is tot een schaduw, *en* het geld is tot een schaduw; maar de uitnemendheid der wetenschap is, dat de wijsheid haar bezitters het leven geeft.","13":"Aanmerk het werk Gods; want wie kan recht maken, dat Hij krom gemaakt heeft?","14":"Geniet het goede ten dage des voorspoeds, maar ten dage des tegenspoeds, zie toe; *want* God maakt ook den een tegenover den ander, ter oorzake dat de mens niet zou vinden iets, dat na hem zal zijn.","15":"Dit alles heb ik gezien in de dagen mijner ijdelheid; er is een rechtvaardige, die in zijn gerechtigheid omkomt; daarentegen is er een goddeloze, die in zijn boosheid *zijn* *dagen* verlengt.","16":"Wees niet al te rechtvaardig, noch houd uzelven al te wijs; waarom zoudt gij verwoesting over u brengen?","17":"Wees niet al te goddeloos, noch wees *al* te dwaas; waarom zoudt gij sterven buiten uw tijd?","18":"Het is goed, dat gij daaraan vasthoudt, en trek ook uw hand van dit niet af; want die God vreest, dien ontgaat dat al.","19":"De wijsheid versterkt den wijze meer dan tien heerschappers, die in een stad zijn.","20":"Voorwaar, er is geen mens rechtvaardig op aarde, die goed doet, en niet zondigt.","21":"Geef ook uw hart niet tot alle woorden, die men spreekt, opdat gij niet hoort, dat uw knecht u vloekt.","22":"Want uw hart heeft ook veelmalen bekend, dat gij ook anderen gevloekt hebt.","23":"Dit alles heb ik met wijsheid verzocht; ik zeide: Ik zal wijsheid bekomen, maar zij was *nog* verre van mij.","24":"Hetgeen verre af is, en zeer diep, wie zal dat vinden?","25":"Ik keerde mij om, en mijn hart, om te weten, en om na te sporen, en te zoeken wijsheid en een sluitrede; en om te weten de goddeloosheid der zotheid, en de dwaasheid der onzinnigheden.","26":"En ik vond een bitterder ding, dan de dood: een vrouw, welker hart netten en garen, *en* haar handen banden zijn; wie goed is voor Gods aangezicht, zal van haar ontkomen; daarentegen de zondaar zal van haar gevangen worden.","27":"Ziet, dit heb ik gevonden, zegt de prediker, het ene bij het andere, om de sluitrede te vinden;","28":"Dewelke mijn ziel nog zoekt, maar ik heb haar niet gevonden: een man uit duizend heb ik gevonden; maar een vrouw onder die allen heb ik niet gevonden.","29":"Alleenlijk ziet, dit heb ik gevonden, dat God den mens recht gemaakt heeft, maar zij hebben veel vonden gezocht."},"KJV":{"1":"A good name *is* better than precious ointment; and the day of death than the day of one's birth.","2":"*It is* better to go to the house of mourning, than to go to the house of feasting: for that *is* the end of all men; and the living will lay *it* to his heart.","3":"Sorrow *is* better than laughter: for by the sadness of the countenance the heart is made better.","4":"The heart of the wise *is* in the house of mourning; but the heart of fools *is* in the house of mirth.","5":"*It is* better to hear the rebuke of the wise, than for a man to hear the song of fools.","6":"For as the crackling of thorns under a pot, so *is* the laughter of the fool: this also *is* vanity.","7":"Surely oppression maketh a wise man mad; and a gift destroyeth the heart.","8":"Better *is* the end of a thing than the beginning thereof: *and* the patient in spirit *is* better than the proud in spirit.","9":"Be not hasty in thy spirit to be angry: for anger resteth in the bosom of fools.","10":"Say not thou, What is *the cause* that the former days were better than these? for thou dost not enquire wisely","11":"Wisdom *is* good with an inheritance: and *by it there is* profit to them that see the sun.","12":"For wisdom *is* a defence, *and* money *is* a defence: but the excellency of knowledge *is, that* wisdom giveth life to them that have","13":"Consider the work of God: for who can make *that* straight, which he hath made crooked?","14":"In the day of prosperity be joyful, but in the day of adversity consider: God also hath set the one over against the other, to the end that man should find nothing after","15":"All *things* have I seen in the days of my vanity: there is a just *man* that perisheth in his righteousness, and there is a wicked *man* that prolongeth *his life* in his wickedness.","16":"Be not righteous over much; neither make thyself over wise: why shouldest thou destroy","17":"Be not over much wicked, neither be thou foolish: why shouldest thou die before thy time?","18":"*It is* good that thou shouldest take hold of this; yea, also from this withdraw not thine hand: for he that feareth God shall come forth","19":"Wisdom strengtheneth the wise more than ten mighty *men* which are in the city.","20":"For *there is* not a just man upon earth, that doeth good, and sinneth","21":"Also take no heed unto all words that are spoken; lest thou hear thy servant curse","22":"For oftentimes also thine own heart knoweth that thou thyself likewise hast cursed others.","23":"All this have I proved by wisdom: I said, I will be wise; but it *was* far","24":"That which is far off, and exceeding deep, who can find it out?","25":"I applied mine heart to know, and to search, and to seek out wisdom, and the reason *of things*, and to know the wickedness of folly, even of foolishness *and* madness:","26":"And I find more bitter than death the woman, whose heart *is* snares and nets, *and* her hands *as* bands: whoso pleaseth God shall escape from her; but the sinner shall be taken","27":"Behold, this have I found, saith the preacher, *counting* one by one, to find out the account:","28":"Which yet my soul seeketh, but I find not: one man among a thousand have I found; but a woman among all those have I not found.","29":"Lo, this only have I found, that God hath made man upright; but they have sought out many inventions."}},"tsk":{"1":[{"kopje":"naam","refs":["Spr 15:30","Spr 22:1","Jes 56:5","Luk 10:20","Hebr 11:2","Hebr 11:39"]},{"kopje":"goede","refs":["Pred 10:1","Ps 133:2","Spr 27:9","Hoogl 1:3","Hoogl 4:10","Joh 13:2"]},{"kopje":"de dag","refs":["Pred 4:2","Job 3:17","Jes 57:1","Jes 57:2","2 Kor 5:1","2 Kor 5:8","Fil 1:21-23","Openb 14:13"]}],"2":[{"kopje":"beter","refs":["Gen 48:1-22","Gen 49:2-33","Gen 50:15-17","Job 1:4","Job 1:5","Jes 5:11","Jes 5:12","Jes 22:12-14","Amos 6:3-6","Matt 5:4","Matt 14:6-12","1 Petr 4:3","1 Petr 4:4"]},{"kopje":"want daarin","refs":["N \"H7592\">enquire</span> wisely","11":"<span class=\"wl wl-kjv\" data-code=\"H2451\">Wisdom</span> is <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> with an <span class=\"wl wl-kjv\" data-code=\"H5159\">inheritance:</span> and by it there is <span class=\"wl wl-kjv\" data-code=\"H3148\">profit</span> to them that <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> the sun.","12":"For <span class=\"wl wl-kjv\" data-code=\"H2451\">wisdom</span> is a <span class=\"wl wl-kjv\" data-code=\"H6738\">defence,</span> and <span class=\"wl wl-kjv\" data-code=\"H3701\">money</span> is a <span class=\"wl wl-kjv\" data-code=\"H6738\">defence:</span> but the <span class=\"wl wl-kjv\" data-code=\"H3504\">excellency</span> of <span class=\"wl wl-kjv\" data-code=\"H1847\">knowledge</span> is, that <span class=\"wl wl-kjv\" data-code=\"H2451\">wisdom</span> giveth <span class=\"wl wl-kjv\" data-code=\"H2421\">life</span> to them that have","13":"<span class=\"wl wl-kjv\" data-code=\"H7200\">Consider</span> the <span class=\"wl wl-kjv\" data-code=\"H4639\">work</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God:</span> for who <span class=\"wl wl-kjv\" data-code=\"H3201\">can</span> make that <span class=\"wl wl-kjv\" data-code=\"H8626\">straight,</span> which he hath made crooked?","14":"In the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of <span class=\"wl wl-kjv\" data-code=\"H2896\">prosperity</span> be <span class=\"wl wl-kjv\" data-code=\"H2896\">joyful,</span> but in the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of <span class=\"wl wl-kjv\" data-code=\"H7451\">adversity</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">consider:</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> also hath <span class=\"wl wl-kjv\" data-code=\"H6213\">set</span> the one over <span class=\"wl wl-kjv\" data-code=\"H5980\">against</span> the other, to the <span class=\"wl wl-kjv\" data-code=\"H1700\">end</span> that <span class=\"wl wl-kjv\" data-code=\"H120\">man</span> should <span class=\"wl wl-kjv\" data-code=\"H4672\">find</span> <span class=\"wl wl-kjv\" data-code=\"H3972\">nothing</span> after","15":"All things have I <span class=\"wl wl-kjv\" data-code=\"H7200\">seen</span> in the <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> of my <span class=\"wl wl-kjv\" data-code=\"H1892\">vanity:</span> there <span class=\"wl wl-kjv\" data-code=\"H3426\">is</span> a <span class=\"wl wl-kjv\" data-code=\"H6662\">just</span> man that <span class=\"wl wl-kjv\" data-code=\"H6\">perisheth</span> in his <span class=\"wl wl-kjv\" data-code=\"H6664\">righteousness,</span> and there is a <span class=\"wl wl-kjv\" data-code=\"H7563\">wicked</span> man that <span class=\"wl wl-kjv\" data-code=\"H748\">prolongeth</span> his life in his wickedness.","16":"Be not <span class=\"wl wl-kjv\" data-code=\"H6662\">righteous</span> over <span class=\"wl wl-kjv\" data-code=\"H7235\">much;</span> neither make thyself <span class=\"wl wl-kjv\" data-code=\"H3148\">over</span> <span class=\"wl wl-kjv\" data-code=\"H2449\">wise:</span> why shouldest thou destroy","17":"Be not over <span class=\"wl wl-kjv\" data-code=\"H7235\">much</span> <span class=\"wl wl-kjv\" data-code=\"H7561\">wicked,</span> neither be thou <span class=\"wl wl-kjv\" data-code=\"H5530\">foolish:</span> why shouldest thou <span class=\"wl wl-kjv\" data-code=\"H4191\">die</span> before thy time?","18":"It is <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> that thou shouldest take <span class=\"wl wl-kjv\" data-code=\"H270\">hold</span> of this; yea, also from <span class=\"wl wl-kjv\" data-code=\"H2088\">this</span> <span class=\"wl wl-kjv\" data-code=\"H3240\">withdraw</span> not thine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand:</span> for he that <span class=\"wl wl-kjv\" data-code=\"H3373\">feareth</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> shall come forth","19":"<span class=\"wl wl-kjv\" data-code=\"H2451\">Wisdom</span> <span class=\"wl wl-kjv\" data-code=\"H5810\">strengtheneth</span> the <span class=\"wl wl-kjv\" data-code=\"H2450\">wise</span> more than <span class=\"wl wl-kjv\" data-code=\"H6235\">ten</span> <span class=\"wl wl-kjv\" data-code=\"H7989\">mighty</span> men which are in the city.","20":"For there is not a <span class=\"wl wl-kjv\" data-code=\"H6662\">just</span> <span class=\"wl wl-kjv\" data-code=\"H120\">man</span> upon <span class=\"wl wl-kjv\" data-code=\"H776\">earth,</span> that <span class=\"wl wl-kjv\" data-code=\"H6213\">doeth</span> <span class=\"wl wl-kjv\" data-code=\"H2896\">good,</span> and sinneth","21":"Also <span class=\"wl wl-kjv\" data-code=\"H5414\">take</span> no <span class=\"wl wl-kjv\" data-code=\"H3820\">heed</span> unto all <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> that are <span class=\"wl wl-kjv\" data-code=\"H1696\">spoken;</span> lest thou <span class=\"wl wl-kjv\" data-code=\"H8085\">hear</span> thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> curse","22":"For <span class=\"wl wl-kjv\" data-code=\"H6471\">oftentimes</span> also thine own <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> <span class=\"wl wl-kjv\" data-code=\"H3045\">knoweth</span> that thou thyself likewise hast <span class=\"wl wl-kjv\" data-code=\"H7043\">cursed</span> others.","23":"All <span class=\"wl wl-kjv\" data-code=\"H2090\">this</span> have I <span class=\"wl wl-kjv\" data-code=\"H5254\">proved</span> by <span class=\"wl wl-kjv\" data-code=\"H2451\">wisdom:</span> I <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> I will be <span class=\"wl wl-kjv\" data-code=\"H2449\">wise;</span> but it was far","24":"That which is far <span class=\"wl wl-kjv\" data-code=\"H7350\">off,</span> and exceeding <span class=\"wl wl-kjv\" data-code=\"H6013\">deep,</span> who can find it out?","25":"I <span class=\"wl wl-kjv\" data-code=\"H5437\">applied</span> mine <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> to <span class=\"wl wl-kjv\" data-code=\"H3045\">know,</span> and to <span class=\"wl wl-kjv\" data-code=\"H8446\">search,</span> and to seek <span class=\"wl wl-kjv\" data-code=\"H1245\">out</span> <span class=\"wl wl-kjv\" data-code=\"H2451\">wisdom,</span> and the <span class=\"wl wl-kjv\" data-code=\"H2808\">reason</span> of things, and to <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> the <span class=\"wl wl-kjv\" data-code=\"H7562\">wickedness</span> of <span class=\"wl wl-kjv\" data-code=\"H3689\">folly,</span> even of <span class=\"wl wl-kjv\" data-code=\"H5531\">foolishness</span> and madness:","26":"And I <span class=\"wl wl-kjv\" data-code=\"H4672\">find</span> more <span class=\"wl wl-kjv\" data-code=\"H4751\">bitter</span> than <span class=\"wl wl-kjv\" data-code=\"H4194\">death</span> the <span class=\"wl wl-kjv\" data-code=\"H802\">woman,</span> whose <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> is <span class=\"wl wl-kjv\" data-code=\"H4685\">snares</span> and <span class=\"wl wl-kjv\" data-code=\"H2764\">nets,</span> and her <span class=\"wl wl-kjv\" data-code=\"H3027\">hands</span> as <span class=\"wl wl-kjv\" data-code=\"H612\">bands:</span> whoso <span class=\"wl wl-kjv\" data-code=\"H2896\">pleaseth</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> shall <span class=\"wl wl-kjv\" data-code=\"H4422\">escape</span> from her; but the <span class=\"wl wl-kjv\" data-code=\"H2398\">sinner</span> shall be taken","27":"<span class=\"wl wl-kjv\" data-code=\"H7200\">Behold,</span> this have I <span class=\"wl wl-kjv\" data-code=\"H4672\">found,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H6953\">preacher,</span> counting <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> by <span class=\"wl wl-kjv\" data-code=\"H259\">one,</span> to find <span class=\"wl wl-kjv\" data-code=\"H4672\">out</span> the account:","28":"Which yet my <span class=\"wl wl-kjv\" data-code=\"H5315\">soul</span> <span class=\"wl wl-kjv\" data-code=\"H1245\">seeketh,</span> but I <span class=\"wl wl-kjv\" data-code=\"H4672\">find</span> not: <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H120\">man</span> among a <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> have I <span class=\"wl wl-kjv\" data-code=\"H4672\">found;</span> but a <span class=\"wl wl-kjv\" data-code=\"H802\">woman</span> among all those have I not found.","29":"<span class=\"wl wl-kjv\" data-code=\"H7200\">Lo,</span> this <span class=\"wl wl-kjv\" data-code=\"H905\">only</span> have I <span class=\"wl wl-kjv\" data-code=\"H4672\">found,</span> that <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> hath <span class=\"wl wl-kjv\" data-code=\"H6213\">made</span> <span class=\"wl wl-kjv\" data-code=\"H120\">man</span> <span class=\"wl wl-kjv\" data-code=\"H3477\">upright;</span> but they have sought <span class=\"wl wl-kjv\" data-code=\"H1245\">out</span> <span class=\"wl wl-kjv\" data-code=\"H7227\">many</span> inventions."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"is een goede naam,","tekst":"Te weten, bij God en eerlijke mensen vanwege hunne vroomheid en godzaligheid herkomende. Zie Jezus Sirach hfdst.44 tot 49."},{"catchword":"goede olie,","tekst":"Versta hier lieflijke, welriekende zalf of olie, waar de Joden veel van hielden; of kostelijke zalf, om wonden en kwetsuren te genezen. Zie Psa 133:2 . Enigen verstaan door de goede zalf of olie allerlei vermakelijke dingen."},{"catchword":"dag des doods,","tekst":"Te weten als men godzaliglijk sterft. Verg. Rom 7:24 ; Phi 1:23 ; want alsdan verlangt men het eeuwige gelukzalige, inplaats van het ellendige vergankelijke leven."}],"2":[{"catchword":"in hetzelve","tekst":"Te weten in het klaaghuis."},{"catchword":"is het einde aller mensen","tekst":"Dat is, daar ziet men exempelen van de vergankelijkheid des menselijke levens en de macht des doods over alle mensen, wie of van wat staat zij ook zijn."},{"catchword":"legt het in zijn hart","tekst":"Te weten hetgeen hij daar voor ogen ziet, hebbende wel aangemerkt hoedanig het einde van het leven der mensen is en hoe men zich tot het sterven bereiden moet."}],"3":[{"catchword":"Het treuren","tekst":"Of, verdriet. Dat is, het is beter een goddelijke droefheid te hebben en over zijne zonden te treuren, dan wereldse vreugde te hebben; want de goddelijke droefheid is goed voor de ziel: zij werkt een onberouwelijke beterschap ter zaligheid; 2Co 7:10 . Anders: toorn is beter dan lachen, want een straf aangezicht doet het hart blijdschap aan: dat is, het is beter de zondaars met een gram gemoed en straf gezicht te bestraffen, dan hen met lachende woorden te vleien; want de bestraffingen zijn goed om de zondaars tot beterschap te brengen."},{"catchword":"de droefheid","tekst":"Hebr. de kwaadheid, of gestoordheid des aangezichts; zie Gen 40:7 ."},{"catchword":"wordt het hart gebeterd","tekst":"Te weten als het, door voorspoed buiten het spoor geweken zijnde, door droefheid wederom vernederd en in den rechten weg gebracht wordt."}],"4":[{"catchword":"Het hart der wijzen","tekst":"De zin is, de wijzen gaan van harte gaarne in het klaaghuis of treurhuis; en ofschoon zij naar het lichaam in het klaaghuis niet zijn, zo zijn zij nochtans droevig met de droevigen en medelijdend met de verdrukten; in het huis der treuring leert men nederig zijn, maar in het huis der vreugde leert men ongeregeldheid."}],"5":[{"catchword":"Het is beter te horen","tekst":"Hij geeft te kennen dat dit mede een gelukzaligheid is in dit leven, dat men zich gaarne laat bestraffen van de godzaligen en vromen, wanneer men gezondigd heeft, om alzo de verdoemenis te ontvlieden; en dat men een afkeer heeft van de ijdele geneugten en de vleierijen dergenen die God niet vrezen."},{"catchword":"het gezang der dwazen","tekst":"Dat is, de ijdele vreugde en den lof, de liefkozing en vleiing, die velen zo gaarne horen als een lieflijk gezang."}],"6":[{"catchword":"het geluid der doornen","tekst":"Het luide gekraak der doornen onder een pot is niet lieflijk om te horen, en het vuur van doornen duurt niet lang. Alzo horen de vromen zeer ongaarne het pluimstrijken en het luide lachen der zotten, welke blijdschap haast vergaat."},{"catchword":"onder een pot","tekst":"Te weten, die op het vuur hangt en ziedt."},{"catchword":"het lachen eens zots","tekst":"Waarmede hij te kennen geeft dat hij een welgevallen heeft aan dengene, die kwaad doet."}],"7":[{"catchword":"de onderdrukking","tekst":"Dat is, wanneer zelfs een wijs man te hard met vele en harde smarten geslagen wordt, zo doet of spreekt hij wel somtijds hetgeen meer een dwaas dan een wijs mens betaamt; voorbeeld in Job en in David. Anders wanneer men bedrogen wordt, dat doet een wijze de zinnen verliezen; of onderdrukking; dat is goed door onderdrukking bekomen, enz."},{"catchword":"het geschenk verderft het hart","tekst":"Het verduistert het verstand der mensen, te weten als de rechter geschenken neemt van degenen, die voor het recht te doen hebben. Zie Exo 23:8 ; Deu 16:19 ."}],"8":[{"catchword":"Het einde van een ding","tekst":"Te weten het einde van een goede zaak; en daarom ziet een wijs man altoos op het einde der zaken, die hij bij de hand neemt, en ofschoon de middelen, door welke men een goede zaak uitvoert, hard en bitter zijn, zo moet men nochtans acht hebbende op het goede oogmerk, hetwelk men voorheeft met geduld en lankmoedigheid daarin voortgaan; de uitgang is somtijds beter dan het zich in den beginne liet aanzien."},{"catchword":"de lankmoedige","tekst":"Hebr. een die lang van geest is. Verg. Num 14:18 . Alzo in het volgende, hoog van geest."}],"9":[{"catchword":"Zijt niet haastig in uw geest om te toornen","tekst":"Hij spreekt van een onbehoorlijke toorn, die lang duurt en, plaats nemende in het hart van de mens, in haat verandert. Anderszins is er ook een loffelijke toornigheid bij de wijzen, die zich om behoorlijke oorzaken vertoornen, maar geen kwade toorn lang in den boezem of in het hart dragen. Van het woord boezem, of schoot, zie Job 19:27 ."}],"10":[{"catchword":"Zeg niet","tekst":"Wat is er, dat Te weten als murmurerende tegen Gods regering, en als willende zeggen: Waarom regeert God de wereld alzo: wat is de oorzaak hiervan? Anders is het wel geoorloofd de boosheid en ellendigheid onzer tijden te beklagen, van harte bedroefd zijnde dat de wereld hoe langer hoe snoder wordt, en dat derhalve ook de plagen vermeerder worden."},{"catchword":"de vorige dagen","tekst":"De voorbijgegane jaren of tijden."}],"11":[{"catchword":"De wijsheid is goed","tekst":"Hij wil zeggen: Het is een voortreffelijke zaak in dit tijdelijke leven, wijsheid en rijkdom tezamen te hebben."},{"catchword":"met een erfdeel;","tekst":"Dat is, met rijkdom, die men erft of door erfenis verkrijgt."},{"catchword":"degenen, die de zon aanschouwen","tekst":"Dat is, die in deze wereld leven, hebben daar voordeel van, want rijkdom helpt hen niet, die buiten deze wereld zijn."}],"12":[{"catchword":"de wijsheid is tot een schaduw","tekst":"De zin is: De wijsheid en het tijdelijke goed dienen de mens tot een bescherming tegen het leed, dat hem mag overkomen, gelijk een schaduw de mens dient tot een schutsel voor de brandende hitte der zon. Anders: want zij zijn in de schaduw der wijsheid en in de schaduw des gelds."},{"catchword":"uitnemendheid der wetenschap","tekst":"Dat is hierin steekt de wijsheid uit, en zij is veel voortreffelijker dan geld en goed, dat zij het leven geeft; verstaande door de wijsheid de rechte wijsheid, welke is de ware kennis van God en van zijne geboden; deze geeft het leven, te weten het eeuwige leven. Doch anderen verstaan hier door het leven rust, vrede, genoegen in het hart, hetwelk is het rechte leven."}],"13":[{"catchword":"Aanmerk het werk Gods","tekst":"Alsof hij zeide: Wilt gij rust en vrede hebben in uw hart en gemoed, zo stel u daarin tevreden dat gij weet dat het Gods werk is, dat er dagelijks geschiedt, en dat het God alzo belieft; niemand kan verhinderen of veranderen hetgeen God eens besloten of gedaan heeft; Job 12:14 . Derhalve moeten wij ons niet kwellen in de zaken, die wij dagelijks zien en horen, dewijl zij toch door geen raad of doen der mensen kunnen veranderd worden. Zie Job 12:14 , en Ecc 1:15 ."}],"14":[{"catchword":"Geniet het goede ten dage","tekst":"Hebr. wees in het goede; dat is, wees lustig en vrolijk."},{"catchword":"des voorspoeds,","tekst":"Hebr. des goeds; dat is, als het welgaat, als God u zegent met vele goederen."},{"catchword":"des tegenspoeds,","tekst":"Hebr. des kwaads."},{"catchword":"zie toe;","tekst":"Te weten alzo, dat gij gedenkt dat ook het kwaad van de Heere komt, en dat gij derhalve met geduld dragen moet. Anders: merk aan; te weten het werk Gods, waarvan gesproken is vs.13. Anders: merk op; te weten op de oorzaak, welke is de rechtvaardige en wijze regering Gods, die dikwijls de vromen kastijdt en beproeft tot hun best. Anders: merk op den dag des tegenspoeds; dat is, in voorspoed denk aan tegenspoed, die van Gods hand komen kan."},{"catchword":"den een tegenover den ander","tekst":"Hebr. dezen tegenover, of nevens dien; te weten dag. De zin is: De dag des welvarens en de dag des kwalijkvarens zijn beide van God, en deze twee tegenovergestelde tijden heeft Hij tegen elkander geordineerd, zodat het een mens niet altoos wel, ook niet altoos kwalijk gaat; waarom hij in voorspoed alsook in tegenspoed altoos op verandering moet denken, den voorspoed met vrolijkheid doch niet zonder omzien genietende, en den tegenspoed geduldiglijk dragende, met verwachting van een beter."},{"catchword":"na hem zal zijn","tekst":"Te weten na God, dat is, opdat de mens alleen op Gods schikking en regering zou zien, zonder dit of dat buiten God te willen onderzoeken of doorgronden. Anders: na hem; te weten na dien mens, geschieden zal. Anders: op zulke wijze, dat de mens na hem niet zou kunnen vinden; dat is, God heeft alles zo wijselijk geordineerd, dat geen mens na hem iets bekwamers zou kunnen vinden of bedenken."}],"15":[{"catchword":"in de dagen mijner ijdelheid","tekst":"Dat is, gedurende mijn ijdel en vergankelijk leven."},{"catchword":"in zijn gerechtigheid","tekst":"Dat is, als hij zich tot deugd had begeven en dagelijks daarin voortvoer."},{"catchword":"omkomt;","tekst":"Hetzij dat hij van de boze mensen die de vromen niet kunnen verdragen wordt verdrukt; of dat hem God de Heere vroeg uit deze wereld haalt in een beter leven, gelijk Josia geschied is; 2Ch 35:23-24 ."}],"16":[{"catchword":"Wees niet al te rechtvaardig","tekst":"Dat is, wees niet al te streng om uws naasten woorden en werken op het nauwst te onderzoeken en op het hardste te straffen. Anderen nemen het in dezen zin: Doe hetgeen dat u te doen bevolen is, en doe dat getrouwelijk, maar doe ook niet meer dan u bevolen is, of dan uwe beroeping medebrengt."},{"catchword":"houd uzelven al te wijs","tekst":"Dit is gesproken tegen die nieuwsgierige geesten, die Gods verborgenheden met hunne wijsheid menen te doorgronden; Rom 12:3 . Of, die meer willen weten dan ons God in zijn Woord geopenbaard heeft."},{"catchword":"waarom zoudt gij verwoesting over u brengen","tekst":"Dat is, waarom zoudt gij uzelven in schade en schande brengen, willende vromer, kloeker, verstandiger schijnen te zijn dan anderen, mits al te diep doorzoekende de verborgenheden Gods; Pro 3:7 ; Rom 12:3 , Rom 12:16 ."}],"17":[{"catchword":"Wees niet al te goddeloos","tekst":"Dat is, geef u niet over tot grove zonden. Of, laat de zonde geen heerschappij hebben in uw sterflijk lichaam, gelijk de apostel zegt. Rom 6:12 ."},{"catchword":"waarom zoudt gij sterven","tekst":"Alsof hij zeide: Gij zoudt anders gewisselijk door de overheid gestraft en eer de natuurlijke tijd des doods komt van de aarde weggerukt worden. Verg. Job 15:32 , en Psa 37:13 ."}],"18":[{"catchword":"daaraan vasthoudt","tekst":"Te weten aan hetgeen waarvan vs.16 gesproken is."},{"catchword":"van dit niet af;","tekst":"Te weten dat gezegd is vs.17; of dat ik nu nog zeggen zal. Sommigen duiden beide de vermaningen op hetgeen in de twee voorgaande verzen gezegd is in het algemeen."},{"catchword":"dien ontgaat dat al","tekst":"Dat is, hij wijkt van beide de uiterste fouten, van al te rechtvaardig en al te onrechtvaardig te zijn, ontgaande alzo de ellenden, die daarop plegen te volgen en houdende den middenweg, waarin alle deugd bestaat."}],"19":[{"catchword":"tien heerschappers,","tekst":"Dat is, velen. Zie Gen 31:7 ; Pro 21:22 , en Pro 24:5 , en onder Ecc 9:16 ."}],"21":[{"catchword":"Geef ook uw hart","tekst":"Dat is, onderzoek niet te nauw om te weten wat de mensen al van u zeggen, noch trek het u niet te zeer aan; want zoudt ge dat doen, zo kon het lichtelijk geschieden, dat gij tot uw grote onwil zoudt horen dat uw eigen knechts kwalijk van u spreken; men moet veel van wat er gezegd wordt, ongemerkt laten heengaan."}],"22":[{"catchword":"uw hart","tekst":"Dat is, uw eigen conscientie."},{"catchword":"anderen gevloekt","tekst":"Die u onrecht gedaan hebben, of die gij gemeend hebt door het vals aanbrengen van anderen dat u ongelijk deden."}],"23":[{"catchword":"ik zeide","tekst":"Te weten bij mijzelven; dat is, ik dacht, ik liet mij voorstaan, dat ik een volkomen wijsheid bekomen zou."},{"catchword":"zij was nog","tekst":"Want de mens kan nimmermeer komen tot een volkomen wetenschap aller dingen en van de oorzaken derzelve."}],"24":[{"catchword":"Hetgeen verre af is","tekst":"Anders aldus: Het is verre dat er geweest is; dat is, hetgeen lang verleden is, daar hebben de mensen geen grote kennis van. En wat kennis zullen zij hebben van dingen, die ten enenmale diepgrondig en verborgen zijn, gelijk hoe God de wereld regeert met al wat er in is, en inzonderheid wat er in toekomende tijden geschieden zal? Zie in het boek Job 38"}],"25":[{"catchword":"Ik keerde mij om","tekst":"Te weten met mijne gedachten."},{"catchword":"een sluitrede;","tekst":"Het Hebreeuwse woord betekent een slot van rede, hetwelk uit andere voorgestelde redenen besloten en als rekenensgewijze gevonden wordt."},{"catchword":"de dwaasheid","tekst":"Anders: en de dwaasheid,[en] onzinnigheden."}],"26":[{"catchword":"netten en garen","tekst":"Gelijk men voor het gedierte uitspant, om hetzelve daarin te vangen. Hij spreekt van een oneerbare vrouw, die door arglistige en zoete bedriegelijke woorden de mannen in onkuisheid zoekt te verstrikken, in hare netten te vangen en vast te houden. Zie Pro 2:16-17 , en Pro 5:3 , Pro 5:6 en Pro 6:24 en Pro 7:6 , enz. en Pro 9:13 . Dusdanige vrouw is meer te schuwen en te mijden dan de dood zelf."},{"catchword":"wie goed is","tekst":"Alsof hij zeide: Niemand kan zulker boze vrouwen bedrog ontkomen, tenzij God hem bijzonderlijk door zijne genade en hulp daarvan verlosse; gelijk Hij Jozef van de oneerbare huisvrouw van Potifar verlost heeft. Zie Gen 39:9 ; Ecc 2:26 ."},{"catchword":"de zondaar","tekst":"Dat is, zulk een mens, die zich dagelijks tot grote zonden begeeft. Zie Psa 1:1 ."}],"27":[{"catchword":"om de sluitrede","tekst":"Dat is, om tot resolutie en besluit te komen."}],"28":[{"catchword":"Dewelke","tekst":"De zin dezer en der naastvolgende woorden schijnt deze te zijn: Nadat ik al lang gezocht had om den rechten grond van alles te weten, zo heb ik niet anders gevonden dan dat ik nog niets gevonden heb; dat is, ik ben door de ervaring daarin bevestigd, dat de kennis van zeer veel dingen mij ontbreekt. Anders: hetgeen mijne ziel nog zoekt, dat heb ik niet gevonden."},{"catchword":"mijn ziel","tekst":"Dat is, ik."},{"catchword":"een man uit duizend","tekst":"Hebr. Adam; dat is, een man. De tegenstelling wijst uit dat Adam hier een man betekent. Uit duizend; te weten, mensen of mannen."},{"catchword":"een vrouw onder die","tekst":"Anders: maar een vrouw met al die dingen begaafd. Hij wil zeggen dat men zeer weinig mannen vindt, die wijs, goed, voorzichtig en van grote kennis zijn, maar nog veel weiniger zulke vrouwen. Zie Pro 31:10 . De woorden een en geen worden hier genomen voor weinig en weiniger, te weten in vergelijking van de anderen. Dewijl vele godzalige mannen en vrouwen anderszins in het Oude en Nieuwe Testament vermeld zijn."},{"catchword":"allen heb ik niet gevonden","tekst":"Te weten, onder de duizend dat is, vele mensen, of onder de vrouwen."}],"29":[{"catchword":"dit heb ik gevonden,","tekst":"Alsof hij zeide: Doch dit is een zekere zaak, dat het ganse menselijke geslacht, zo mannen als vrouwen, verdorven en zondig zijn, doch dat God, dewijl Hij den mens, goed en naar zijn beeld geschapen heeft, geen schuld daaraan heeft, maar de mens zelf, die zichzelven en al zijne nakomelingen, door het ingeven van den duivel en door moedwillige ongehoorzaamheid daarin gebracht heeft."},{"catchword":"zij hebben veel","tekst":"Te weten de mensen."},{"catchword":"vonden","tekst":"Te weten boze, erge, kwade vonden of streken."},{"catchword":"gezocht","tekst":"En zij zoeken ze nog, dewijl zij van dien heerlijken staat afgevallen zijn, in welken zij geschapen en van God gesteld waren."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"A Good name [to wit, (with God and honest men) raised by reason of their virtue and piety. See Eccl. Chap.ver.44,45,46,47,48,49, etc.] is better then good oil:[understand here pleasant sweet smelling ointment or oil, which the Jews held in great esteem: or precious ointment, to heal wounds and sores. See Psa. 133.2. Some understand by good oil or ointment all manner of pleasant or delightful things. Compare Pro 22:1.] and the day of death then the day that a man is born (on) [to wit, when man dieth godly and piously. Compare Rom 7:24. Php 1:23. For then a man attaineth to everlasting happiness, instead of his wretched transitory life.]"}],"2":[{"catchword":null,"tekst":"It is better to go unto the house of mourning, then to go unto the house of the feasts: (For) in it [To wit, in the house of mourning] is the end of all men; [that is, there we may behold examples and spectacles of the transitoriness of mans life, and the power of death over all men, who, or of what condition soever they be] and the living layeth it in his heart. [to wit, that which he there seeketh before his eyes, having well observed what the end of mans life is, and how man ought to prepare themselves for death.]"}],"3":[{"catchword":null,"tekst":"Mourning is better then laughing: [Or vexing, etc. That is, it is better to have godly sorrow, and to mourn over ones sins, then to have worldly joy; for godly sorrow is good for the soul; it worketh amendment to salvation not to be repented of, 2 Cor.7.10. oth. Anger is better then laughing, for a stern countenance makes the heart cheerful; that is, it is better to reprove sinners sharply, and with a stern countenance, then to flatter them with laughing words; for reproofs are good to bring sinners to amendment] for by the sadness of the countenance [Hebr. The illness, or disturbance of the countenance. See Gen.40. on v.7.] the heart is made better. [to wit, when by prosperity it being departed out of the way, it is humbled and brought unto the right way again by grief and heaviness.]"}],"4":[{"catchword":null,"tekst":"The heart of the wise is in the house of mourning: but the heart of the fools (is) in the house of the mirth. [The meaning is, that the wise were to go into the house of mourning. And though they be not with their bodies as bodily presence in the house of mourning, yet they are sorrowful, and compassionate with the affected. In the house of mourners a man learneth to be humble and lowly, but in the house of mirth a man learneth to be unruly and wanton.]"}],"5":[{"catchword":null,"tekst":"It is better to hear the reproof of the wise, then for a man to hear the song of the fools. [That is, the vain mirth and commendation, or praise, the flattering, sooth-saying, or cogging, which may do more love to hear then a pleasant song. He intimateth, that this is also a kind of happiness in this life, for a man to endure reproof willingly at the hand if pious and virtuous men, whensoever he hath sinned, that he might thereby escape damnation: And for a man to loath and abhor the vain delights and flatteries of those that fear not God. Compare Pro 13:18. and 15.31,32.]"}],"6":[{"catchword":null,"tekst":"For as the sound of thornes under a pot [To wit, that hangeth and boileth on the fire] so is the laughter of a fool: [whereby he bewrayeth, that he taketh delight in him that doth evil. The loud crackling of thornes under a pot, is no pleasant music to the ear, and the fire of thornes lasteth not long. So the Godly take no delight in hearing the flattery and loud laughter of fools, which kind of mirth and jollity also soon vanisheth and decayeth. Compare Psa 58:10.] this is also vanity."}],"7":[{"catchword":null,"tekst":"Verily, the oppression would make a man mad, [That is, when a wise man himself is extremely afflicted with sorrows and miseries, it will make him sometimes do or speak that which befitteth a fool rather then a wise man. Examples see in Job and David. Oth. When a man is deceived, that maketh a wise man to lose his sences: Or oppression; that is, wealth or estate taken from a man by oppression, etc.] and the gift destroyeth the heart, [it corrupteth the understanding of man: to wit, when the Judge taketh gifts of bribes of those that have causes to be tryed before him. See Exo 23:8. Deut.16.19.]"}],"8":[{"catchword":null,"tekst":"Better is the end of a thing then the beginning thereof: [To wit, the end of a good thing is better then the beginning thereof. Therefore a wise man always hath an eye upon the end of the things, which he taketh in hand: and though the means whereby a good business is performed, be hard and bitter, yet (eying the end which man intendeth) he ought to go on and persevere therein with patience and forbearance: the event or issue is sometimes better then it appeareth at first, or in the beginning] the long-suffering (person) [Hebr.one that is long in spirit. Compare Num 14:18. So in the following words, high-spirit] is better then the high minded (person.)"}],"9":[{"catchword":null,"tekst":"Be not hasty in thy spirit to be angry: for anger resteth in the bosome of the fools. [He speaketh of an unjust and unlawful anger which continueth long, and taking place in the heart of man, turneth into hatred. Otherwise, there is also a lawful and commendable anger, namely, in wise men, who are sometimes angry upon good grounds and for just causes, but bear not evil ager long in their bosomes, or in their hearts. Of the word, bosome or lap, see Job 19. On v.27.]"}],"10":[{"catchword":null,"tekst":"Say not, what is (the cause) that the former dayes [The years or times past] were better then these? For thou shouldest inquire wisely after this. [say not, etc. To wit, as murmuring against Gods Providence, and as if you would say, Why doth God govern the World so? What is the cause hereof? Otherwise, it is lawful to lament the wickedness ad misery of the times, being heartily sorrowful, that the world the longer it continueth, the wickeder it growth, and that therefore also plagues and judgments are multiplied.]"}],"11":[{"catchword":null,"tekst":"Wisdom is good with an inheritance; [That is, with riches, which a man inheriteth, or getteth by inheritance. As if he should say, It is an excellent thing for a man to have both wisdom and wealth together in this life] and those that behold the Sun, have benefit (by it0 [that is, those that live in this world, have profit by it, for riches avail not those that are gone out of the world.]"}],"12":[{"catchword":null,"tekst":"For wisdom is for a shadow, (and) money is for a shadow; [The meaning is, that wisdom and temporal wealth serve a man for a defence against hurt or mischief, that may befall him, as a shadow serveth a man for a covering or shelter against the scorching heat of the Sun. Oth. For they are in the shadow of wisdom, and in the shadow of money] but the excellency of knowledge is, that wisdom giveth life to the possessors thereof. [that is, herein exceedeth wisdom, and her excellency is far beyond that of money and wealth, in that she giveth life to those that enjoy her. By wisdom here is to be meant true wisdom, which is the true knowledge of God, and of the laws and commandments; this (to wit, this wisdom) giveth life, to wit, everlasting life. But others understand here by life, rest, peace, contentment of mind or heart, which is true life indeed.]"}],"13":[{"catchword":null,"tekst":"Consider the work of God, for who can make that straight which he hath made crooked? [As if he had said, Wilt thou have rest and peace in thy heart and mind, then be therewith contented, that thou kowest, that is the work of God, even that which daily happeneth, and that it is Gods pleasure it should be so: no man can hinder or alter that which God hath once decreed or done, Job 12:14. Therefore we ought not to vex and trouble ourselves about those things which we daily see and hear, seeing they cannot be altered or changed by any counsel or act of man. See Job. 12.14. and above, ch.1.15.]"}],"14":[{"catchword":null,"tekst":"In the day of prosperity [Heb. of good; that is, when it goeth well with thee, when God blesseth thee with much goods or riches] enjoy the thing that is good, [Heb. Be in thing that is good; that is, be contented and cheerful] but in the day of adversity, [Heb. Of evil] look to; [to wit, for as that thou remembrest, that evil also cometh from God, and that thou oughtest therefore to bear it patiently. Oth. Consider, to wit, the work of God, whereof is spoken, v.13. oth. Heed; to wit, the cause, which is the righteousness and providence of God, who oftentimes chastifieth and trieth the godly for their good. Oth. Consider the day of adversity; that is, in prosperity think of adversity, which may befall thee from the hand of God] (for) God maketh the one ever against the other, [Hebr. this over against, or next to that; to wit, day. The meaning is, the day of prosperity and the day of adversity are both from God, and these two contrary times hath he set and appointed one against another, so that a man is not always in prosperity, neither always in adversity; therefore he ought always, both in prosperity, and in adversity to think of a change, enjoying prosperity cheerfully (yet not without looking about him) and bearing adversity patiently, with expectations of better] because man shall not find anything that shall be after him. [to wit, after God; that is, to end, that man might onely look up to Gods providence and disposing, without desiring to search or inquire into this or that thing, without God, or out of God. Oth. After him, to wit, that shall be after that man. Oth. In such a manner should that man should be able to find nothing after him; that is, God hath ordained all things so wisely, as that no man after him is able to invent or devise any thing better.]"}],"15":[{"catchword":null,"tekst":"All these I seen in the dayes of my vanity: [That is, during my vain and transitory life] There is a righteous man that perisheth in his righteousnesse; [that is, when he gave himself to virtue, and therein daily proceeded. Such an one perisheth in his righteousnesse; to wit, whether he be oppressed by wicked men that cannot indure the godly, or whether God take him soon out of this world into a better life, as happened to Josia, 2 Chron.35.23,24.] or on the contrary, there is a wicked man, that prolongeth (his dayes) in his wickedness."}],"16":[{"catchword":null,"tekst":"Be not too righteous, [That is, be not too strict to search too narrowly into thy neighbours words and actions, and to punish then severely. Others take it in the sence; Do that which thou art commanded to do, and do it faithfully, but do not more then thou art command, or then thy calling requireth] neither count thy self too wise: [this is spoken against curious spirits, that think by their own wisdom to search and find out the deep secrets of God, Rom 12:3. or the desire to know more then God hath revealed to us in his word] why shouldest thou bring desolation upon thy self? [that is, why shouldest thou bring thy self into danger and disgrace, desiring to appear more godly, more virtuous and more wise and understanding then others, by searching and diving too deep into secret mysteries of God, Pro 3:7. Rom 12:3.16.]"}],"17":[{"catchword":null,"tekst":"Be not too wicked, [That is, give not thy self over to gross sins, or let not sin reign in thy mortal body, as the Apostle exhorteth, Rom 6:12.] neither be (too) foolish: why shouldest thou die out of thy time? [As if he should say, thou shouldest else be punished by the Magistrate, and before the natural time of death cometh, be snatcht and taken away from the Earth. Compare Job 15:32. Psal.37.13.]"}],"18":[{"catchword":null,"tekst":"It is good that thou shouldest take hold thereon; To wit, on that, whereof mention is made, v.16.] neither with-draw thine heart from this: [to wit, from that which is, verse 17. Or from that which I shall further say. Some apply both exhortations to that which was spoken in the former verses in general] for he that feareth God, he escapeth all that. [that is, he departeth from both extreams, to wit, from being too righteous, and from being too unrighteous or wicked, (escaping thereby the miseries that are wont to follow thereon) and keepeth the mid-way, wherein all virtue conststeth.]"}],"19":[{"catchword":null,"tekst":"Wisdome strengthened the wise more then ten [That is, many, see Gen 31:7. and Pro 21:22. and24.5. and below chap.9.6. Rulers are in one City."}],"20":[{"catchword":null,"tekst":"Verily, there is not a righteous man upon earth, that doth good, and sineth not. [Compare, 1 Kings 8. Verse 46,47. 2 Chron.6.36. Pro 20:9. 1Jn 1:8.]"}],"21":[{"catchword":null,"tekst":"Also give not thine heart unto all words that are spoken, lest thou he // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';

}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}

document.addEventListener('click', e => {

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};

function concordantieHtml(data) {

    data.weergaven.map(w => {

      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);

}
function bijbeluitlegHtml(n) {

        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {

            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);

    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');

    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>

    } else {

  }

  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;

    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}

  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
