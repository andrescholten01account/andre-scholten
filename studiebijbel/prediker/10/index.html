e snede niet, dan moet hij meer kracht gebruiken; maar de wijsheid is een uitnemende zaak om iets recht te maken.","11":"Als de slang gebeten heeft eer de bezwering gebeurd is, dan heeft de allerwelsprekendste bezweerder geen nut.","12":"De woorden van de mond van een wijze zijn aangenaam; maar de lippen van een dwaas verslinden hemzelf.","13":"Het begin van de woorden van zijn mond is dwaasheid, en het einde van zijn mond is boze dolheid.","14":"De dwaas maakt wel veel woorden; maar de mens weet niet wat er gebeuren zal; en wat na hem gebeuren zal, wie zal het hem bekendmaken?","15":"De arbeid van de dwazen maakt ieder van hen moe, omdat zij niet weten hoe naar de stad te gaan.","16":"Wee u, land, waarvan de koning een kind is, en waarvan de vorsten al in de morgenstond eten!","17":"Gelukkig bent u, land, waarvan de koning een zoon van edelen is, en waarvan de vorsten op de juiste tijd eten, tot sterkte en niet tot drinkerij.","18":"Door grote luiheid verzwakt het gebint, en door slapheid van de handen lekt het huis door.","19":"Men maakt maaltijden om te lachen, en de wijn verheugt de levenden, en het geld verschaft alles.","20":"Vloek de koning niet, zelfs niet in uw gedachten, en vloek de rijke niet in het binnenste van uw slaapkamer; want het gevogelte des hemels zou de stem wegvoeren, en het gevleugelde zou het woord bekendmaken."},"SV":{"1":"Een dode vlieg doet de zalf des apothekers stinken *en* opwellen; *alzo* een weinig dwaasheid een *man*, die kostelijk is van wijsheid *en* van eer.","2":"Het hart des wijzen is tot zijn rechter *hand*, maar het hart eens zots is tot zijn linkerhand.","3":"En ook wanneer de dwaas op den weg wandelt, zijn hart ontbreekt *hem*, en hij zegt tot een iegelijk, dat hij dwaas is.","4":"Als de geest des heersers tegen u oprijst, verlaat uw plaats niet; want het is medicijn, het stilt grote zonden.","5":"Er is *nog* een kwaad, *dat* ik gezien heb onder de zon, als een dwaling, die van het aangezicht des oversten voortkomt.","6":"Een dwaas wordt gezet in grote hoogheden, maar de rijken zitten in de laagte.","7":"Ik heb knechten te paard gezien, en vorsten, gaande als knechten op de aarde.","8":"Wie een kuil graaft, zal daarin vallen; en wie een muur doorbreekt, een slang zal hem bijten.","9":"Wie stenen wegdraagt, zal smart daardoor lijden; wie hout klieft, zal daardoor in gevaar zijn.","10":"Indien hij het ijzer heeft stomp gemaakt, en hij slijpt de snede niet, dan moet hij meerder kracht te werk stellen; maar de wijsheid is een uitnemende zaak, om *iets* recht te maken.","11":"Indien de slang gebeten heeft, eer der bezwering geschied is, dan is er geen nuttigheid voor den allerwelsprekendsten *bezweerder*.","12":"De woorden van een wijzen mond zijn aangenaam; maar de lippen van een zot verslinden hemzelven.","13":"Het begin der woorden zijns monds is dwaasheid, en het einde zijns monds is boze dolligheid.","14":"De dwaas maakt wel veel woorden; *maar* de mens weet niet, wat het zij, dat geschieden zal; en wat na hem geschieden zal, wie zal het hem te kennen geven?","15":"De arbeid der zotten maakt een iegelijk van hen moede; dewijl zij niet weten naar de stad te gaan.","16":"Wee u, land! welks koning een kind is, en welks vorsten tot in den morgenstond eten!","17":"Welgelukzalig zijt gij, land! welks koning een zoon der edelen is, en welks vorsten ter rechter tijd eten, tot sterkte en niet tot drinkerij.","18":"Door grote luiheid verzwakt het gebint, en door slapheid der handen wordt het huis doorlekkende.","19":"Men maakt maaltijden om te lachen, en de wijn verheugt de levenden, en het geld verantwoordt alles.","20":"Vloek den koning niet, zelfs in uw gedachten, en vloek den rijke niet in het binnenste uwer slaapkamer; want het gevogelte des hemels zou de stem wegvoeren, en het gevleugelde zou het woord te kennen geven."},"KJV":{"1":"Dead flies cause the ointment of the apothecary to send forth a stinking savour: *so doth* a little folly him that is in reputation for wisdom *and* honour.","2":"A wise man's heart *is* at his right hand; but a fool's heart at his left.","3":"Yea also, when he that is a fool walketh by the way, his wisdom faileth *him*, and he saith to every one *that* he *is* a fool.","4":"If the spirit of the ruler rise up against thee, leave not thy place; for yielding pacifieth great offences.","5":"There is an evil *which* I have seen under the sun, as an error *which* proceedeth from the ruler:","6":"Folly is set in great dignity, and the rich sit in low place.","7":"I have seen servants upon horses, and princes walking as servants upon the earth.","8":"He that diggeth a pit shall fall into it; and whoso breaketh an hedge, a serpent shall bite","9":"Whoso removeth stones shall be hurt therewith; *and* he that cleaveth wood shall be endangered","10":"If the iron be blunt, and he do not whet the edge, then must he put to more strength: but wisdom *is* profitable to direct.","11":"Surely the serpent will bite without enchantment; and a babbler is no better.","12":"The words of a wise man's mouth *are* gracious; but the lips of a fool will swallow up","13":"The beginning of the words of his mouth *is* foolishness: and the end of his talk *is* mischievous madness.","14":"A fool also is full of words: a man cannot tell what shall be; and what shall be after him, who can tell","15":"The labour of the foolish wearieth every one of them, because he knoweth not how to go to the city.","16":"Woe to thee, O land, when thy king *is* a child, and thy princes eat in the morning!","17":"Blessed *art* thou, O land, when thy king *is* the son of nobles, and thy princes eat in due season, for strength, and not for drunkenness!","18":"By much slothfulness the building decayeth; and through idleness of the hands the house droppeth through.","19":"A feast is made for laughter, and wine maketh merry: but money answereth","20":"Curse not the king, no not in thy thought; and curse not the rich in thy bedchamber: for a bird of the air shall carry the voice, and that which hath wings shall tell the matter."}},"tsk":{"1":[{"kopje":"de zalf","refs":["Ex 30:34","Ex 30:35"]},{"kopje":"een weinig","refs":["2 Kron 19:2","Neh 6:13","Neh 13:26","Matt 5:13-16","Gal 2:12-14"]}],"2":[{"kopje":"wijze","refs":["Pred 9:10","Spr 14:8","Luk 14:28-32"]},{"kopje":"maar","refs":["Pred 10:10","Pred 10:14","Spr 17:16","Luk 12:18-20"]}],"3":[{"kopje":"en hij","refs":["Pred 5:2","Spr 13:16","Spr 18:2","Spr 18:6","1 Petr 4:4"]}],"4":[{"kopje":"verlaat","refs":["Pred 8:3"]},{"kopje":"want","refs":["1 Sam 25:24-44","Spr 25:15"]}],"5":[{"kopje":"Er is nog een kwaad","refs":["Pred 4:7","Pred 5:12","Pred 6:1","Pred 9:3"]},{"kopje":"als een dwaling","refs":["Pred 3:16","Pred 4:1"]}],"6":[{"kopje":"Een dwaas","refs":["Richt 9:14-20","1 Kon 12:13","1 Kon 12:14","Est 3:1","Ps 12:9","Spr 28:12","Spr 28:28"]},{"kopje":"de rijken","refs":["Jak 2:3-5"]}],"8":[{"kopje":"Wie","refs":["Richt 9:5","Richt 9:53-57","2 Sam 17:23","2 Sam 18:15","Est 7:10","Ps 7:16","Ps 7:17","Ps 9:16","Ps 9:17","Spr 26:27"]},{"kopje":"een slang","refs":["Amos 5:19","Amos 9:3"]}],"10":[{"kopje":"de wijsheid","refs":["Pred 10:15","Pred 9:15-17","Gen 41:33-39","Ex 18:19-23","1 Kon 3:9","1 Kron 12:32","2 Kron 23:4-11","Matt 10:16","Hand 6:1-9","Hand 15:2-21","Rom 16:19","1 Kor 14:20","Ef 5:15-17","Kol 4:5","Jak 1:5"]}],"11":[{"kopje":"de slang","refs":["Ps 58:5","Ps 58:6","Jer 8:17"]},{"kopje":"bezweerder","refs":["Ps 52:4","Ps 64:4","Spr 18:21","Jak 3:6"]}],"12":[{"kopje":"woorden","refs":["Job 4:3","Job 4:4","Job 16:5","Ps 37:30","Ps 40:10","Ps 40:11","Ps 71:15-18","Spr 10:13","Spr 10:20","Spr 10:21","Spr 10:31","Spr 10:32","Spr 12:13","Spr 12:14","Spr 12:18","Spr 15:2","Spr 15:23","Spr 16:21-24","Spr 22:17","Spr 22:18","Spr 25:11","Spr 25:12","Spr 31:26","Matt 12:35","Luk 4:22","Ef 4:29","Kol 4:6"]},{"kopje":"maar","refs":["2 Sam 1:16","1 Kon 20:40-42","Ps 64:9","Ps 140:10","Spr 10:8","Spr 10:10","Spr 10:14","Spr 18:6-8","Spr 19:5","Spr 26:9","Luk 19:22"]}],"13":[{"kopje":"begin" table</span> to direct.","11":"Surely the <span class=\"wl wl-kjv\" data-code=\"H5175\">serpent</span> will <span class=\"wl wl-kjv\" data-code=\"H5391\">bite</span> without <span class=\"wl wl-kjv\" data-code=\"H3908\">enchantment;</span> and a <span class=\"wl wl-kjv\" data-code=\"H3956\">babbler</span> is no better.","12":"The <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> of a wise <span class=\"wl wl-kjv\" data-code=\"H2450\">man's</span> <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth</span> are <span class=\"wl wl-kjv\" data-code=\"H2580\">gracious;</span> but the <span class=\"wl wl-kjv\" data-code=\"H8193\">lips</span> of a <span class=\"wl wl-kjv\" data-code=\"H3684\">fool</span> will swallow up","13":"The <span class=\"wl wl-kjv\" data-code=\"H8462\">beginning</span> of the <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> of his <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth</span> is <span class=\"wl wl-kjv\" data-code=\"H5531\">foolishness:</span> and the <span class=\"wl wl-kjv\" data-code=\"H319\">end</span> of his <span class=\"wl wl-kjv\" data-code=\"H6310\">talk</span> is <span class=\"wl wl-kjv\" data-code=\"H7451\">mischievous</span> madness.","14":"A <span class=\"wl wl-kjv\" data-code=\"H5530\">fool</span> also is <span class=\"wl wl-kjv\" data-code=\"H7235\">full</span> of <span class=\"wl wl-kjv\" data-code=\"H1697\">words:</span> a <span class=\"wl wl-kjv\" data-code=\"H120\">man</span> cannot <span class=\"wl wl-kjv\" data-code=\"H3045\">tell</span> what shall be; and what shall be <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> him, who can tell","15":"The <span class=\"wl wl-kjv\" data-code=\"H5999\">labour</span> of the <span class=\"wl wl-kjv\" data-code=\"H3684\">foolish</span> <span class=\"wl wl-kjv\" data-code=\"H3021\">wearieth</span> every one of them, because he <span class=\"wl wl-kjv\" data-code=\"H3045\">knoweth</span> not how to <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> to the city.","16":"<span class=\"wl wl-kjv\" data-code=\"H337\">Woe</span> to thee, O <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> when thy <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> is a <span class=\"wl wl-kjv\" data-code=\"H5288\">child,</span> and thy <span class=\"wl wl-kjv\" data-code=\"H8269\">princes</span> <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> in the morning!","17":"<span class=\"wl wl-kjv\" data-code=\"H835\">Blessed</span> art thou, O <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> when thy <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> is the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H2715\">nobles,</span> and thy <span class=\"wl wl-kjv\" data-code=\"H8269\">princes</span> <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> in due <span class=\"wl wl-kjv\" data-code=\"H6256\">season,</span> for <span class=\"wl wl-kjv\" data-code=\"H1369\">strength,</span> and not for drunkenness!","18":"By much <span class=\"wl wl-kjv\" data-code=\"H6103\">slothfulness</span> the <span class=\"wl wl-kjv\" data-code=\"H4746\">building</span> <span class=\"wl wl-kjv\" data-code=\"H4355\">decayeth;</span> and through <span class=\"wl wl-kjv\" data-code=\"H8220\">idleness</span> of the <span class=\"wl wl-kjv\" data-code=\"H3027\">hands</span> the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> droppeth through.","19":"A <span class=\"wl wl-kjv\" data-code=\"H3899\">feast</span> is <span class=\"wl wl-kjv\" data-code=\"H6213\">made</span> for <span class=\"wl wl-kjv\" data-code=\"H7814\">laughter,</span> and <span class=\"wl wl-kjv\" data-code=\"H3196\">wine</span> maketh <span class=\"wl wl-kjv\" data-code=\"H8055\">merry:</span> but <span class=\"wl wl-kjv\" data-code=\"H3701\">money</span> answereth","20":"<span class=\"wl wl-kjv\" data-code=\"H7043\">Curse</span> not the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> no not in thy <span class=\"wl wl-kjv\" data-code=\"H4093\">thought;</span> and <span class=\"wl wl-kjv\" data-code=\"H7043\">curse</span> not the <span class=\"wl wl-kjv\" data-code=\"H6223\">rich</span> in thy <span class=\"wl wl-kjv\" data-code=\"H2315\">bedchamber:</span> for a <span class=\"wl wl-kjv\" data-code=\"H5775\">bird</span> of the <span class=\"wl wl-kjv\" data-code=\"H8064\">air</span> shall <span class=\"wl wl-kjv\" data-code=\"H3212\">carry</span> the <span class=\"wl wl-kjv\" data-code=\"H6963\">voice,</span> and that which <span class=\"wl wl-kjv\" data-code=\"H1167\">hath</span> <span class=\"wl wl-kjv\" data-code=\"H3671\">wings</span> shall <span class=\"wl wl-kjv\" data-code=\"H5046\">tell</span> the matter."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"dode vlieg","tekst":"Hebr. vliegen des doods doet stinken; dat is, elke dode vlieg doet stinken. De zin is: Ofschoon een vlieg maar een klein beestje is, zo doet het evenwel een welriekende olie of zalf stinken; te weten indien zij daarin valt en blijft liggen."},{"catchword":"de zalf des apothekers","tekst":"Dat is een zalf of olie, die door de apothekers kunstig toebereid en gemaakt wordt."},{"catchword":"alzo","tekst":"De zin is: Alzo is ook een weinig dwaasheid oorzaak dat een treffelijk beroemd man zijn eer en achting verliest."},{"catchword":"van wijsheid","tekst":"Dat is, vanwege zijn wijsheid en eer."}],"2":[{"catchword":"Het hart des wijzen","tekst":"Dat is, een wijs man stelt zijn zaken wijselijk aan, alles tevoren in zijn hart wijselijk en wel overleggende. Men moet geenszins uit deze woorden besluiten dat Salomo hier wil zeggen, dat het hart der wijzen in hun boezem anders ligt dan der dwazen, want zo der wijzen als der dwazen hart ligt in het midden der borst, een weinig naar de linkerzijde aan strekkende. Het is een gelijkenis, genomen van de rechter en linkerhand, in het uitvoeren van enige zaak, hetzij wel of kwalijk. Het grootste deel der mensen gebruikt de rechterhand om iets wel en terdeeg te doen, zodat als iemand iets wel doet en met wijsheid die uit het hart komt zo schijnt het dat hij het hart aan de rechterhand heeft liggende, om zijn zaken wel te verrichten; integendeel, die zijn zaken niet wel, noch bekwamelijk of wijselijk uitricht, schijnt dat hem het hart links ligt."},{"catchword":"is tot zijn linkerhand","tekst":"Dat is, hij stelt zijn zaken dwaaslijk aan."}],"3":[{"catchword":"zijn hart ontbreekt","tekst":"Dat is, zo blijken en openbaren zich de gebreken van zijn hart."},{"catchword":"hij zegt","tekst":"Dat is, hij geeft openlijk genoeg te kennen te weten, door zijn gang, gelaat, kleren en gebaren dat hij niet wijs is."},{"catchword":"tot een iegelijk,","tekst":"Dat is, tot alle man, die hem over straat ziet gaan of wandelen. Anders: van een iegelijke die dwaas is."}],"4":[{"catchword":"de geest des heersers","tekst":"Dat is, de toorn. Zie de aantekening Jdg 8:3 ."},{"catchword":"uw plaats niet;","tekst":"Dat is, uw beroeping, ambt, staat, betrekking. Anders: verlaat uw plaats niet; dat is: betoon en gedraag u gelijk het een onderzaat betaamt, namelijk deemoedig en nederig."},{"catchword":"medicijn,","tekst":"Anders: zachtigheid of zachtzinnigheid, dat is, zachtzinnige toegeving stilt, enz."},{"catchword":"stilt grote zonden","tekst":"Die anders een regent in zijn toorn aan u zou mogen begaan; daarom, zoek liever met zoete woorden zijn toorn te vermurwen of te verzachten. Het kan ook in deze zin genomen worden: zachte en ootmoedige woorden stillen, dat is komen voor, of nemen weg, of bedekken, grote beledegingen of misdaden, die gij aan de prins moogt begaan hebben."}],"5":[{"catchword":"dwaling,","tekst":"Dat is een grote fout, als zijnde fouten, die herkomen van de prinsen of groten des lands. Want hoe groter of hoger iemand verheven is, des te groter en schadelijker zijn ook de fouten die hij begaat."},{"catchword":"voortkomt","tekst":"Dat is, begaan wordt."}],"6":[{"catchword":"Een dwaas","tekst":"Of, de dwazen, dat is lomperds, die geheel onbekwaam zijn om anderen te regeren en ambten te bedienen, worden verheven tot staten en ambten. Het belieft God somtijds dat dusdanige landen en steden zullen regeren, om alzo dezelve te plagen. Hebr. de dwaasheid wordt, enz.; dat is, zulk een mens, die de dwaasheid zelf is."},{"catchword":"in grote hoogheden,","tekst":"Of, in vele hoogheden."},{"catchword":"de rijken zitten","tekst":"Te weten, in wijsheid, of die zinrijk zijn, of die rijk zijn en tegelijk wijs; dat is, die verstand en wetenschap genoeg hebben om de ambten wel te bedienen."},{"catchword":"in de laagte","tekst":"Dat is, in een lage plaats, in nederheid."}],"7":[{"catchword":"knechten te paard","tekst":"Dat is, zulken, die een knechtelijk onwijs gemoed hadden, of die van knechten en slaven afkomstig waren."},{"catchword":"vorsten, gaande als knechten","tekst":"Dat is, kloeke en verstandige mannen die zodanig een gemoed hadden als de prinsen hebben, of behoorden te hebben."},{"catchword":"op de aarde","tekst":"Dat is, te voet gaan, ja zelfs anderen dienen."}],"8":[{"catchword":"Wie een kuil graaft","tekst":"Dat is, wie tegen iemand anders ongelijk berokkent, die zal het kwalijk gaan door Gods rechtvaardig oordeel. Salomo wijst in dit en in het Pro 10:9 , aan, met vier gelijkenissen, hoe schadelijk de onvoorzichtigheid is. Zie Psa 62:4 ."},{"catchword":"een slang zal hem bijten","tekst":"De slangen liggen gemeenlijk in de reten en spleten, of in de gaten der muren; als men de muren afbreekt, zo komen zij te voorschijn en bijten of steken degenen, die zij het eerst vinden. Het schijnt dat Salomo hier wil zeggen dat zij, die de wetten en ordinantien der kerk, of politieke wetten verbreken, niet ongestraft zullen blijven."}],"9":[{"catchword":"stenen","tekst":"Te weten grote stenen, die hem te zwaar zijn om te verroeren. Anders: de stenen die zijn nabuurs landpalen van de zijne onderscheiden om alzo zijn akker te vergroten. Zie Deu 27:17 ."},{"catchword":"wegdraagt,","tekst":"Of, verzet."},{"catchword":"zal smart daardoor lijden","tekst":"De zin is: Gelijk degenen, die zware stenen verheffen of verwentelen, of van de ene plaats tot de andere dragen, zware arbeid doen, alzo hebben alle ambten en bedieningen hun zwarigheid."},{"catchword":"in gevaar zijn","tekst":"Alzo dat hij in het klieven zijn hand of voet of een ander lid van zijn lichaam lichtelijk zal kwetsen of bezeren. Anders: hij zal daardoor warm worden. In deze betekenis wordt het Hebreeuwse woord genomen, 1Ki 1:2 . De zin is: Zwaarwichtige zaken worden niet uitgevoerd dan met grote moeite, veel zweet en zwarigheid."}],"10":[{"catchword":"hij","tekst":"Te weten, die met een stompe bijl hout wil klieven."},{"catchword":"het ijzer","tekst":"Dat is, een ijzer werktuig, hetzij een bijl, of dergelijk instrument."},{"catchword":"de snede niet","tekst":"Hebr. het aangezicht; dat is het voorste deel dat het hout klieft."},{"catchword":"dan moet","tekst":"Hebr. dan moet hij de krachten versterken."},{"catchword":"maar de wijsheid","tekst":"Dat is: maar de wijsheid is de beste hulp om iets terdeegs goed te maken. Anders: maar de wijsheid is een treffelijke beslechting; dat is, als men iets recht en wel verrichten wil, zo is het met geweld niet te doen, gelijk als wanneer men hout klieft, maar met wijsheid en verstand."}],"11":[{"catchword":"eer der bezwering","tekst":"Of, voor de bezwering, eer zij bezworen wordt. Hebr. zonder bezwering."},{"catchword":"is er geen nuttigheid","tekst":"Dat is, alsdan helpt de bezweerder zijn bewerking niet, maar hare steek is dodelijk. Zie Psa 58:5 , en Psa 140:4 . Hebr. zo is er niets overig voor de meester der tong; dat is voor dien die zijne tong tot bezwering gebruikt. Zie dergelijke manier van spreken Gen 14:13 ; Psa 140:12 ."},{"catchword":"bezweerder","tekst":"Versta hierbij: Alzo helpt het een onderzaat niet, dat hij alsdan eerst zijn prins met smekende woorden zoekt te vermurwen, nadat de prins begonnen heeft hem in zijn toorn te straffen. En alzo voorts in het algemeen, dat het tevergeefs is middelen te gebruiken tegen het kwaad als het te laat is. Anders: indien de slang bijt, niet bezworen zijnde, zo is de klapper niet beter."}],"12":[{"catchword":"zijn aangenaam;","tekst":"Hebr. zijne gunst; dat is, zij maken een wijze man aangenaam, en dienvolgens zijn ze hem bevorderlijk en voordelig."},{"catchword":"verslinden hemzelven","tekst":"Dat is, zij brengen hem in verdriet."}],"13":[{"catchword":"zijns monds","tekst":"Dat is, de woorden zijns monds."},{"catchword":"is boze dolligheid","tekst":"Dat is, schadelijke dolligheid, namelijk omdat zijne dolligheid meer en meer toeneemt."}],"14":[{"catchword":"De dwaas","tekst":"Dat is, hij maakt wel veel gepraat van hetgeen hij voorheeft te doen, zeggende tot anderen hoe en wat hij al doen wil, alsof hij kon uitvoeren al wat hij wil of voorneemt. Maar hij zal zich bedrogen vinden in zijn ijdele hoop. Zie Jam 4:13-14 ."},{"catchword":"wat na hem","tekst":"Of, hoe."}],"15":[{"catchword":"een iegelijk van hen moede","tekst":"Hebr. hem; een iegelijk van hen."},{"catchword":"dewijl zij niet weten","tekst":"Dat is, een zot mag vergeleken worden met dengene, die naar een stad willende gaan, de weg niet weet en derhalve met veel moeite door kromme wegen derwaarts gaat. De zin is: Hij weet niet hoe of op wat wijze hij zal uitvoeren hetgeen hij voorgenomen heeft. Anderen nemen de woorden van het vers in deze zin: De zotten, of vele onverstandige mensen, bekommeren zich met veel zware hoogwichtige zaken, waar zij zichzelf zeer in kwellen, daar zij toch gemene dingen niet weten noch verstaan, zijnde zo bekend als de straat, of weg naar een stad toegaande, die de kinderen en slechte lieden zelfs bekend is. Het schijnt een spreekwoord te zijn. Waardoor grote onwetendheid wordt te kennen gegeven."}],"16":[{"catchword":"land, welks koning","tekst":"Dat is, gij inwoners des lands."},{"catchword":"een kind is,","tekst":"Hetzij in jaren, of in verstand."},{"catchword":"vorsten","tekst":"Dat is, raadsheren, ambtlieden, rechters en dergelijke hoge ambtdragende personen."},{"catchword":"tot in den morgenstond","tekst":"Dat is, ter onbekwamer tijd: te weten te dien tijde als zij behoorden terecht te zitten en raad te houden; zie Jer 21:12 ."},{"catchword":"eten","tekst":"Dat is, goede sier maken en banketteren."}],"17":[{"catchword":"een zoon der edelen is,","tekst":"Dat is, die van edele stam en afkomst is. Versta hierbij, en die in godzaligheid, wijsheid en alle deugd is opgevoed. Hebr. een zoon der witten; dat is der edelen, die witte kleren plachten te dragen. Zie Neh 2:16 ; Pro 22:29 worden de onedelen genoemd verduisterden."},{"catchword":"ter rechter tijd eten","tekst":"Dat is, te dien tijde als men gewoon is te eten; te weten nadat men zijn noodwendige zaken heeft uitgericht."},{"catchword":"tot sterkte","tekst":"Dat is, om het lichaam te versterken, niet om dronken te worden."}],"18":[{"catchword":"grote luiheid","tekst":"Hebr. twee luiheden; dat is dubbele luiheid, of luiheid van beide handen."},{"catchword":"verzwakt het gebint","tekst":"Anders: zinken de balken; dat is, gaat het huis teniet, en alles gaat verloren."},{"catchword":"door slapheid der handen","tekst":"Of, nederlating."},{"catchword":"wordt het huis doorlekkende","tekst":"Of, verlekt het huis. Versta hierbij, hoeveel meer zal het land te schande komen, in hetwelk onachtzame en tot alle ongerechtigheid begeven prinsen regeren."}],"19":[{"catchword":"Men maakt","tekst":"Hebr. zij zijn makende."},{"catchword":"maaltijden","tekst":"Hebr. brood, gelijk Dan 5:1 ."},{"catchword":"lachen,","tekst":"Dat is, tot vrolijkheid, om lustig en vrolijk te zijn."},{"catchword":"de levenden,","tekst":"Of, het leven."},{"catchword":"verantwoordt alles","tekst":"Of, het geld doet alles antwoorden; dat is, het maakt dat ieder ding daar is. Elk ding staat onder de gehoorzaamheid des gelds, derhalve behoorde zich een ieder te benaarstigen dat hij door zijn arbeid en door behoorlijke middelen iets mocht vergaderen en in voorraad hebben."}],"20":[{"catchword":"in uw gedachten,","tekst":"Of, in uw geweten of hart. alsof hij zeide: Al gaat het aldus toe in de hoven der koningen en prinsen, denk en spreek evenwel niet kwalijk van hen; ja zelfs niet in het binnenste en geheimste van uw huis."},{"catchword":"want het gevogelte","tekst":"Dat is, het zal niet lang verborgen blijven, al zouden het de vogelen des hemels uitbrengen. De koningen en prinsen hebben vele oren en vele ogen, gelijk zij ook lange handen hebben."},{"catchword":"wegvoeren,","tekst":"Te weten tot de koning, die het wonderbaarlijk zou wijs worden."},{"catchword":"het gevleugelde","tekst":"Hebr. de heer, of de bezitter der vleugelen, of der vederen; dat is die vleugelen hebben; gelijk Pro 1:17 ."},{"catchword":"het woord","tekst":"Of, de zaak."},{"catchword":"te kennen geven","tekst":"Te weten aan de koning, die u straffen zou, vernemende dat gij hem gevloekt hebt."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"A dead Fly causeth the ointment of the Apothecarie, [That is, an ointment or oil, that is prepared and made very artificially and curiously by the skill and art of the Apothecarie] to stink (and) bubble up: [Hebr. Flies of death causeth to stink; that is, every dead fly causeth to stink. The meaning is, though a fly be but a very little creature, yet it causeth a sweet-smelling oil or ointment to stink; to wit, if it fall into it, and continue there] (so doth) a little folly a (man) that is precious in wisdom, (and) in power. [that is, because of his wisdom and honour. The meaning is, so is also a little folly the cause, that a man of note and esteem loseth his reputation and credit.]"}],"2":[{"catchword":null,"tekst":"As wise mans heart is his right (hand) [That is, a wise man manageth and ordereth his affairs well and wisely, pondering all things before-hand in his heart] but a fools heart is at his learnt hand. [that is, he manageth his affairs foolishly. We ought in no wise to conclude from these words, that Salomon here would infer, that the heart of the wise men is or lieth otherwise in their bosom then the hearts of fools doth in theirs; for the heart both of wise men & also of fools lieth in the midst of the breast, tending or declining a little toward the left side. It is a similitude taken from the right hand and left, in the performing of any business, either well or ill. The most and the greatest part of men use the right hand to do a thing well; so that when a man doth a thing well and with wisdom or judgment (which proceedeth from the heart) it seemeth, that he then hath his heart lying at his right hand, to manage his affairs aright; On the contrary, he that manageth his affairs not well, nor conveniently, or wisely, he seemeth to have heart lying at his left hand.]"}],"3":[{"catchword":null,"tekst":"And also when the fool walketh on the way, his heart falleth (him): [That is, then the infirmities of his heart appear and are discovered] and he saith to every one, [that is, to every one that seeth him go or walk in the streets] that he is a fool. [that is, he doth sufficiently bewray (to wit, by his gate, behaviour, apparel and gesture) that he is none of the wisest. Oth. He saith of every one, that he (to wit, that man of whom he speaketh) is a fool]"}],"4":[{"catchword":null,"tekst":"When the spirit [That is, the anger. See the annotate. Judg. 8. On v.3.] of the Ruler riseth up against thee, leave not thy place; [that is, thy calling, office, state and condition of life. Oth. Leave not thy place; that is, behave and carry thy self, as it becometh a subject to do, namely, submissive and humble] for it is necessary, it purifieth great sins. [which otherwise a Ruler in his wrath might commit against thee; therefore seek rather to asswage and soften his anger with sweet and gently words. It may also be taken in this sense, soft and humble words practice, that is, prevent, or remove, or cover great offences or trespasses, which thou mightiest have committed against the Prince. Oth. Softness, or meekness, or mildness, [that is, meek or mild yielding) pacifieth great offences.]"}],"5":[{"catchword":null,"tekst":"There is (yet) an evil (which) I have seen under the Sun, as an error which proceedeth [That is, is committed] from the face of the Ruler: [that is, a great fault, that is, as are the faults that proceed from Princes, or from the great ones of the land; for the greater and higher any man is in his place and authority, the greater and more hurtfull are also the faults that are committed by him.]"}],"6":[{"catchword":null,"tekst":"A fool [or the fool] is set in great [or, in many] dignities: [that is, sots or idiots that are altogether unfit to govern and rule others, and to bear office, are advanced to places of honour and command. It pleaseth God sometimes that such should govern cities and countries, that he might punish them by such kind of governors. Hebr. Folly is, etc. That is, such a man that is folly it self] but the rich, [to wit, in wisdom, or those that are rich in understanding, or those that are both rich and wise; that is, that have knowledge and understanding enough, to be in place of command, or to bear office well] sit in low place. [that is, in low degree, in humility.]"}],"7":[{"catchword":null,"tekst":"I have seen servants [that is, such as had a servile and foolish spirit, or nature, or that were descended from servants and slaves] on hors-back: and Princes [that is, valiant, understanding, wise men, that have such a spirit, or such a courage as Princes have, or at least ought to have] going as servants upon the ground. [that is, going on foot, yea even ministering unto others.]"}],"8":[{"catchword":null,"tekst":"Whoso diggeth a pit, shall fall into it: [That is, he that intendeth mischief to another, it shall fare ill with him, by him just judgement of God. See Pro 26:27. Solomon sheweth in this and in the 9. Verse, by four similitudes, how dangerous and hurtfull imprudence and want of circumspection is. See Psa.62. on. V.4.] and whoso breaketh throw a wall, a Serpent shall bite him. [serpents lie commonly hid in the clifts and chinks, or in the holes of walls, when the walls are broken down, that they appear, and come to light, and bite or sting those whom they first meet with. It seemeth that Solomon here saith that those that break either the Ecclesiastical or Political laws and ordinances, they shall go unpunished.]"}],"9":[{"catchword":null,"tekst":"Whoso carrieth way [Or removeth] stones, [to wit, great stones, that are too heavy for him to remove. Oth. The stones which separate his neighbours landmarks or bounds from his own, thereby to enlarge his own ground. See Deu 27.17.] shall endure grief thereby: [the meaning is, as those that lift up heavy stones, or remove them, or carry them from one place to another, do labour painfully: so all offices and high places have their difficulty] whoso cleaveth wood, shall be in danger thereby. [so as that in cleaving he may easily hurt or wound either his hand, or or foot, or some other member of his body. Oth. He shall grow warm thereby. In this signification is the Hebrew word taken, 1 Kings 1.2. The meaning is, that businesses or great weight and concernment are not performed, with great trouble, much sweat and difficulty.]"}],"10":[{"catchword":null,"tekst":"If he [To wit, that he will cleave wood with a blunt axe] hath made the iron [that is, an iron tool, whether it be an axe or such like too] blunt, and he do not whet the edge, [Heb. The face; that is, the fore most part which cleaveth the wood] then must he [to wit, that he will cleave with a blunt axe] put forth more strength: [Heb. Then must he strengthen the powers] but wisdom is an excellent thing to make (something) straight. [that is, wisdom is the best help or means to make a thing right or straight indeed. Oth. But wisdom is an excellent direction; that is, when a men would do a business concernment well and in a r // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

function plaatsPopup(el, html) {
  popup.innerHTML = html;

  popup.style.display = 'block';

  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle

const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}

    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);

    }).join('');
}

  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  // slug -> volledige boeknaam (voor citaten met de volle boeknaam i.p.v. de afkorting)
  const boeknaamPerSlug = {};
  (D.meta.boeken || []).forEach(b => {
    const m = b.href.match(/^\.\.\/\.\.\/([^/]+)\//);
    if (m) boeknaamPerSlug[m[1]] = b.naam;
  });
  // dubbele rechtsklik (binnen 500ms, zelfde verwijzing) kopieert het vers
  // i.p.v. de vertalingen-popup te tonen (enkele rechtsklik blijft bestaand gedrag)
  function kopieerVerwijzing(chip, ref) {
    haalVert('versteksten', ref).then(data => {
      const tekst = data && data[ref.vers];
      if (!tekst) return;
      const url = location.origin + '/studiebijbel/' + ref.slug + '/' + ref.hfd + '#v' + ref.vers;
      const naam = boeknaamPerSlug[ref.slug] || chip.textContent.replace(/\s+\d+:\d+.*$/, '');
      const kopie = tekst.replace(/\*/g, '') + `\n~ [${naam} ${ref.hfd}:${ref.vers}](${url})`;
      navigator.clipboard.writeText(kopie).then(() => {
        toast.classList.add('zichtbaar');
        setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
      });
    });
  }
  let laatsteRechtsklik = { sleutel: null, tijd: 0 };
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    const sleutel = chip.dataset.ref;
    const nu = Date.now();
    const isDubbelklik = laatsteRechtsklik.sleutel === sleutel && (nu - laatsteRechtsklik.tijd) < 500;
    laatsteRechtsklik = isDubbelklik ? { sleutel: null, tijd: 0 } : { sleutel, tijd: nu };
    if (isDubbelklik) {
      popup.style.display = 'none';
      vpopup.style.display = 'none';
      kopieerVerwijzing(chip, ref);
      return;
    }
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
