 gouden schaal in stukken valt, en de kruik bij de bron breekt, en het rad bij de put in stukken valt;","7":"En het stof terugkeert tot de aarde, zoals het geweest is; en de geest terugkeert tot God, Die hem gegeven heeft.","8":"IJdelheid der ijdelheden, zegt de prediker; het is allemaal ijdelheid!","9":"En verder, omdat de prediker wijs geweest is, leerde hij het volk nog kennis, en lette hij op, en onderzocht hij; hij bracht veel spreuken in orde.","10":"De prediker zocht aangename woorden te vinden, en wat er geschreven is, is recht: woorden van de waarheid.","11":"De woorden van de wijzen zijn als prikkels, en als spijkers, diep ingeslagen door de meesters van de verzamelingen, die gegeven zijn door de ene Herder.","12":"En wat daar bovenuit gaat, mijn zoon, wees gewaarschuwd: van het maken van veel boeken komt geen einde, en veel lezen is vermoeiing voor het lichaam.","13":"Van alles wat gehoord is, is dit de slotsom: Vrees God, en houd Zijn geboden, want dit is de hele plicht van de mens.","14":"Want God zal ieder werk in het gericht brengen, met alles wat verborgen is, hetzij goed, of hetzij kwaad."},"SV":{"1":"En gedenk aan uw Schepper in de dagen uwer jongelingschap, eer dat de kwade dagen komen, en de jaren naderen, van dewelke gij zeggen zult: Ik heb geen lust in dezelve.","2":"Eer dan de zon, en het licht, en de maan, en de sterren verduisterd worden, en de wolken wederkomen na den regen.","3":"In den dag, wanneer de wachters des huizes zullen beven, en de sterke mannen zichzelven zullen krommen, en de maalsters zullen stilstaan, omdat zij minder geworden zijn, en die door de vensteren zien, verduisterd zullen worden;","4":"En de twee deuren naar de straat zullen gesloten worden, als er is een nederig geluid der maling, en hij opstaat op de stem van het vogeltje, en al de zangeressen nedergebogen zullen worden.","5":"Ook *wanneer* zij voor de hoogte zullen vrezen, en dat er verschrikkingen zullen zijn op den weg, en de amandelboom zal bloeien, en dat de sprinkhaan zichzelven een last zal wezen, en dat de lust zal vergaan; want de mens gaat naar zijn eeuwig huis, en de rouwklagers zullen in de straat omgaan.","6":"Eer dat het zilveren koord ontketend wordt , en de gulden schaal in stukken gestoten wordt, en de kruik aan de springader gebroken wordt, en het rad aan den bornput in stukken gestoten wordt;","7":"En dat het stof wederom tot aarde keert, als het geweest is; en de geest weder tot God keert, Die hem gegeven heeft.","8":"Ijdelheid der ijdelheden, zegt de prediker; het is al ijdelheid!","9":"En voorts, dewijl de prediker wijs geweest is, zo leerde hij het volk nog wetenschap, en merkte op, en onderzocht; hij stelde vele spreuken in orde.","10":"De prediker zocht aangename woorden uit te vinden, en het geschrevene is recht, woorden der waarheid.","11":"De woorden der wijzen zijn gelijk prikkelen, en gelijk nagelen, diep ingeslagen *van* de meesters der verzamelingen, *die* gegeven zijn van den enigen Herder.","12":"En wat boven dezelve is, mijn zoon! wees gewaarschuwd; van vele boeken te maken is geen einde, en veel lezens is vermoeiing des vleses.","13":"Van alles, wat gehoord is, is het einde van de zaak: Vrees God, en houd Zijn geboden, want dit *betaamt* allen mensen.","14":"Want God zal ieder werk in het gericht brengen, met al wat verborgen is, hetzij goed, of hetzij kwaad."},"KJV":{"1":"Remember now thy Creator in the days of thy youth, while the evil days come not, nor the years draw nigh, when thou shalt say, I have no pleasure","2":"While the sun, or the light, or the moon, or the stars, be not darkened, nor the clouds return after the rain:","3":"In the day when the keepers of the house shall tremble, and the strong men shall bow themselves, and the grinders cease because they are few, and those that look out of the windows be darkened,","4":"And the doors shall be shut in the streets, when the sound of the grinding is low, and he shall rise up at the voice of the bird, and all the daughters of musick shall be brought low;","5":"Also *when* they shall be afraid of *that which is* high, and fears *shall be* in the way, and the almond tree shall flourish, and the grasshopper shall be a burden, and desire shall fail: because man goeth to his long home, and the mourners go about the streets:","6":"Or ever the silver cord be loosed, or the golden bowl be broken, or the pitcher be broken at the fountain, or the wheel broken at the cistern.","7":"Then shall the dust return to the earth as it was: and the spirit shall return unto God who gave","8":"Vanity of vanities, saith the preacher; all *is* vanity.","9":"And moreover, because the preacher was wise, he still taught the people knowledge; yea, he gave good heed, and sought out, *and* set in order many proverbs.","10":"The preacher sought to find out acceptable words: and *that which was* written *was* upright, *even* words of truth.","11":"The words of the wise *are* as goads, and as nails fastened *by* the masters of assemblies, *which* are given from one shepherd.","12":"And further, by these, my son, be admonished: of making many books *there is* no end; and much study *is* a weariness of the flesh.","13":"Let us hear the conclusion of the whole matter: Fear God, and keep his commandments: for this *is* the whole *duty* of man.","14":"For God shall bring every work into judgment, with every secret thing, whether *it be* good, or whether *it be* evil."}},"tsk":{"1":[{"kopje":"Denk","refs":["Pred 11:10","Gen 39:2","Gen 39:8","Gen 39:9","Gen 39:23","1 Sam 1:28","1 Sam 2:18","1 Sam 2:26","1 Sam 3:19-21","1 Sam 16:7","1 Sam 16:12","1 Sam 16:13","1 Sam 17:36","1 Sam 17:37","1 Kon 3:6-12","1 Kon 14:13","1 Kon 18:12","2 Kron 34:2","2 Kron 34:3","Ps 22:10","Ps 22:11","Ps 34:12","Ps 71:17","Ps 71:18","Spr 8:17","Spr 22:6","Jes 26:8","Klaagl 3:27","Dan 1:8","Dan 1:9","Dan 1:17","Luk 1:15","Luk 2:40-52","Luk 18:16","Ef 6:4","2 Tim 3:15"]},{"kopje":"voordat","refs":["Pred 11:8","Job 30:2","Ps 90:10","Hos 7:9"]},{"kopje":"waa rd":"Eer dan de zon,","tekst":"Dit vers en enige der naastvolgende bevatten een beschrijving des ouderdoms naar de wijze des dichters; en het is een gedurige beeldspraak tot het zevende vers toe."},{"catchword":"verduisterd worden","tekst":"Niet inderdaad, maar de oude halfblinde dunkt het zo te zijn."},{"catchword":"de wolken wederkomen","tekst":"Dat is, de ene ellende na de andere, gelijk het ene onweer na het andere komt."}],"3":[{"catchword":"de wachters des huizes","tekst":"Dat is, de armen met de handen, die het lichaam waarin de ziel als in een huis woont bewaren, dienende om het kwaad af te weren en het goede aan te nemen."},{"catchword":"de sterke mannen","tekst":"Dat is, de benen of schenkels, die het lichaam dragen als twee sterke mannen."},{"catchword":"de maalsters","tekst":"Dat is, de tanden, die de spijs als vermalen, die kauwende en in stukken bijtende."},{"catchword":"stilstaan, omdat","tekst":"Te weten van malen, dat is van kauwen. De zin is: Als de tanden zo gauw niet zijn zullen om de spijs te kauwen."},{"catchword":"minder geworden zijn","tekst":"Te weten minder in getal."},{"catchword":"die door de vensteren zien","tekst":"Dat is, de ogen, die van tussen de oogleden zien."}],"4":[{"catchword":"de twee deuren","tekst":"Dat is, de twee lippen, door welke de spijs doorgaat als tussen twee deuren. Verg. Job 41:5 . Anderen verstaan hier door de deuren de gorgel of strot, waar de spijs en drank door passeren."},{"catchword":"naar de straat","tekst":"Dat is, die men uiterlijk aan het lichaam ziet. Daar zijn ook deuren inwendig, die men niet ziet, als het deksel der keel en het deksel van het blaasje der Gal."},{"catchword":"zullen gesloten worden,","tekst":"Te weten, inplaats van die te openen, als zij harde spijs zouden innemen. Enigen verstaan dit alzo: als de deuren, dat is de lippen, zullen gesloten worden, omdat de oude personen belemmerd spreken, niet zowel hun woorden kunnende vormen of voortbrengen als de jonge lieden."},{"catchword":"als er is een nederig geluid","tekst":"Of, vanwege; dat is, terwijl de tanden zwaarlijk kauwen, alzo dat men er niet tussen of onder hoort kraken noch breken, gelijk men wel hoort als de jonge lieden harden kost kauwen en in stukken bijten, hebbende goed gebit, hetwelk de oude personen zelden of niet hebben."},{"catchword":"der maling","tekst":"Te weten als de tanden de spijs vermalen."},{"catchword":"hij","tekst":"Te weten de oude man."},{"catchword":"opstaat","tekst":"Te weten van zijn bed."},{"catchword":"op de stem van het vogeltje","tekst":"Dat is, des morgens vroeg, als de vogels beginnen te zingen, want slapen kan hij niet."},{"catchword":"de zangeressen","tekst":"Hebr. de dochters des lieds; dat is, de zangeressen. Versta hierbij, ook de zangers of muzikanten. Anders: alle dochters des gezangs; dat is, al de delen of leden van het lichaam, die de stem vormen."},{"catchword":"nedergebogen","tekst":"Of, bukken zullen; dat is vergaan, afnemen, hare kracht verliezen; of klein geacht en van gene waarde zijn zullen, dewijl de oude man daar geen werk van maakt, als geen genoegen meer in de muziek nemende. Zie hiervan een voorbeeld in Barzillai; 2Sa 19:35 ."}],"5":[{"catchword":"zij","tekst":"Te weten de oude personen."},{"catchword":"voor de hoogte","tekst":"Of, voor de hoge plaatsen; dat is, voor hoogverheven of oneffen plaatsen, die de oude personen niet gaarne betreden, vanwege de zwakheid hunner benen, vrezende zich daaraan te stoten, of daarvan te zullen vallen. Of, omdat het hun zuur valt de hoge trappen of heuvels op te klimmen."},{"catchword":"verschrikkingen","tekst":"Of, verslagenheden; te weten grote of vele; vrezende dat zij ergens hun voeten of tenen aan stoten mochten."},{"catchword":"en de amandelboom zal bloeien","tekst":"Als de grijze of grauwe haren daar zijn."},{"catchword":"en dat de sprinkhaan","tekst":"Dat is, de oude man, die zo mager, krom en dor geworden is als een sprinkhaan; anderen: en hem een sprinkhaan; dat is een licht ding als een sprinkhaan, lastig valt."},{"catchword":"de lust zal vergaan","tekst":"Te weten der lichamelijk geneugten en wellusten. Ook de lust tot eten, drinken, enz."},{"catchword":"want de mens","tekst":"Alsof hij zeide: Als de mens al de ongemakken gevoelt, zo mag hij wel denken dat hij nabij de dood is, ja, alreeds de ene voet in het graf heeft."},{"catchword":"naar zijn eeuwig huis,","tekst":"Dat is, naar het graf, want daar zal de mens lang blijven."},{"catchword":"de rouwklagers","tekst":"Dat is, die lieden, die de verstorvene ten grave bestellen, beschreien en beklagen, waartoe men lieden pleegt te huren. Zie de aantekening bij Jer 9:17 ."}],"6":[{"catchword":"Eer dan het zilveren koord","tekst":"Dat is, eer het merg of pit in de ruggestreng los wordt. Dit merg is wit als zilver, en het gaat van de hersenen af langs de ruggestreng, gelijk een zeel of touw. Anderen verstaan hier door het zilveren koord de polsaderen; anders, weggedaan; anders geketend, of gebonden; dat is verdroogd, verstijfd."},{"catchword":"de gulden schaal","tekst":"Dat is, dat dunne huifje of velletje, waar de hersenen in liggen, hetwelk goudverwig is. Anderen verstaan hier door de gouden schaal het bekkeneel waar de hersenen in besloten liggen; hetwelk mede door de dood vergaat en als gebroken wordt."},{"catchword":"de kruik","tekst":"Dat is de voornaamste bloedader aan de lever."},{"catchword":"het rad aan den bornput","tekst":"Dat is de long, die door haar gedurige beweging de adem dan van zich stoot en dan wederom tot zich trekt, gelijk het rad aan een waterput nu de emmer tot zich optrekt dan van zich in de put nederlaat."}],"7":[{"catchword":"het stof wederom","tekst":"Dat is het lichaam, hetwelk in de beginne van aarde genomen en gemaakt is; Gen 3:19 . Zie Job 7:5 ."},{"catchword":"de geest weder","tekst":"Dat is de ziel. Zie Num 16:22 , en Num 27:16 ."},{"catchword":"tot God keert,","tekst":"Te weten in de hemel, verstaande dat Salomo hier het volk Gods alleen aanspreekt. Sommigen verstaan het van de zielen, zowel der ongelovigen als der gelovigen, die beide van God als rechter, terstond als de mens sterft, gewezen worden elk aan hunne plaats: de gelovige ten hemel, de ongelovige ter hel. Verg. Luk 16:22 ."},{"catchword":"Die hem gegeven heeft","tekst":"Zie Gen 2:7 ."}],"8":[{"catchword":"Ijdelheid der ijdelheden,","tekst":"Zie boven Ecc 1:2 ."}],"9":[{"catchword":"zo leerde hij","tekst":"Nadat hij bekeerd was, bekeerde en leerde hij ook anderen."},{"catchword":"wetenschap,","tekst":"Dat is goede leerlingen."},{"catchword":"merkte op,","tekst":"Anders: hij heeft gewogen; te weten met de schaal der wijsheid."},{"catchword":"onderzocht;","tekst":"Anders, ondervraagde."},{"catchword":"hij stelde vele","tekst":"Salomo heeft vele spreuken gesproken 1Ki 4:32 , waarvan alleen het boek der Spreuken en dit boek de Prediker tot ons gekomen zijn; en versta hier, onder de naam van spreuken, deftige, wijze zinspreuken, handelende van het leven en de zeden der mensen en van de loop der wereld; zie de aantekening bij 1Ki 4:32 ."}],"10":[{"catchword":"woorden uit te vinden,","tekst":"Of, zaken."},{"catchword":"recht,","tekst":"Of, rechtmatig; dat is, zodanig, op hetwelk niemand met reden te spreken had."}],"11":[{"catchword":"De woorden der wijzen","tekst":"Hij wil zeggen, dat, gelijk de ossen tot het ploegen met het steken van prikkels of scherpe pennen worden voortgedreven, ook alzo de mensen door scherpe en ernstige vermaningen moeten aangespoord worden tot vroomheid en godzaligheid, en tot afkeer van de wereldse ijdelheid."},{"catchword":"ingeslagen","tekst":"Hebr. ingeplant."},{"catchword":"verzamelingen,","tekst":"Of, der gemeente; dat is van de leraars der gemeente."},{"catchword":"die gegeven zijn","tekst":"Die, of welke; te weten woorden der wijzen, of die; te weten nagelen."},{"catchword":"van den enigen Herder","tekst":"Hebr. van een herder; te weten, van God, die zijns volks herder en hoeder is, Psa 23 en die zijn profeten en dienaren uitzendende, hen met zijn geest verlicht en bekrachtigt. Zie Joh 10:11 ; 1Pe 2:25 , en 1Pe 5:4 Anders: van de eerste herder."}],"12":[{"catchword":"dezelve is,","tekst":"Te weten de woorden der wijzen en des enige herders. Anders: voorts, mijn zoon, wees hieruit vermaand, of gewaarschuwd. Hebr. eigenlijk: wees verlicht; te weten, uit de spreuken, die in dit boek staan, en inzonderheid ook in het boek mijner spreuken en andere boeken meer. Gij hebt hieraan genoeg, bewaar dit maar wel, en wacht u van aan te nemen hetgeen de filosofen of wereldwijzen geschreven hebben van het opperste goed en de gelukzaligheid der mensen; want dezen zijn van de Geest Gods niet geregeerd geweest, daarom zijn zij wijd van de rechten weg afgetreden."},{"catchword":"van vele boeken","tekst":"Te weten, gelijk de wereldwijze filosofen gedaan hebben."},{"catchword":"veel lezens","tekst":"Of, te veel lezen. Anders, te veel studeren."},{"catchword":"is vermoeiing","tekst":"Dat is, het maakt het hoofd en de hersenen moede."},{"catchword":"des vleses","tekst":"Dat is, des mensen."}],"13":[{"catchword":"alles,","tekst":"Dat is, al hetgeen waartoe deze predikatie gericht is, aangaande het opperste goed."},{"catchword":"het einde van de zaak","tekst":"Dat is, het besluit, of de som."},{"catchword":"Vrees God,","tekst":"Vrees God; door wie gij alleen het hoogste goed en zaligheid kunt verkrijgen, maar niet door enig aards of vergankelijk ding."},{"catchword":"dit betaamt","tekst":"Anders; want dit is het ganse werk, of ambt des mensen; dat is, daar behoorde hij zijn ganse werk van te maken, dit is het voornaamste doel van des mensen leven; of dit is het geheel des mensen; dat is de volkomen gelukzaligheid; of hierin bestaat zijn welvaren en zaligheid. Anders: des gehele mensen."}],"14":[{"catchword":"ieder werk","tekst":"Of, elke daad; dat is, alle daden en werken der mensen."},{"catchword":"in het gericht brengen","tekst":"Want ten jongste dage zal God zelf de verborgen gedachten oordelen; Rom 2:16 ; Heb 13:4 ."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"And remember thy Creator [The Hebrew word is used in the plural number. Compare the annotate. Gen.1. on v.26. The meaning is, apply and inure thy self to the fear of God, and to keeping of his commandments] in the dayes od thy youthfulness, before the evil dayes [that is, the dayes of old age, which bring much pain and grief along with them; for old age is as a continual disease or sickness] come, and the years draw nigh, whereof thou shalt say, no pleasure in them."}],"2":[{"catchword":null,"tekst":"Before the Sun, and the light, and the Moon, and the Stars be darkened, [Not that they are darkened indeed, but that they seem to be so unto those that are old, being half blind] and the clouds return after the rain. [that is, one misery cometh after another, as one tempest followeth after another. This verse, and some more that follow, contain a description of old age, after the manner of the Poets, and there is a continual allegory prosecured until seventh verse.]"}],"3":[{"catchword":null,"tekst":"In the day, when the keepers of the house [That is, the arms with the hands, which preserve the body (wherein the soul dwelleth, as in an house) serving to keep off evil, and entertain and imbrace good] shall tremble, and the strong men [that is, the legs or shanks, which bear the body, like two strong men] shall bow themselves, and the grinders [that is, the teeth, which (as it were) grind meat, chewing and biting it in pieces] cease, [to wit, from grinding, that is, from chewing. The meaning is, when the teeth shall not be so nimble to chew meat, as formerly] because they are grown less: [to wit, less number] and those that look out of the windows [that is, the eyes, that see or look from between the eye-lids] shall be darkened."}],"4":[{"catchword":null,"tekst":"And the two doors [That is, the two lips through which the meat passeth, as between two doors. Compare, Job 41:5. Others understand by the doors the throat, or pipe through which the meat and drink do pass] toward the street [That is, which are seen outwardly in the body. There are also inward doors which are not seen, as the covering of the throat, and the covering of the bladder of the gall] shall be shut, [to wit, instead of opening them, when they should receive to take in hard meat. Some understand this thus: when the doors, that is, the lips, shall be shut, because old persons have an impediment in their speech, not being able to frame and utter words so well as young man do] when there is [cry, because of] a low sound of grinding, [to wit, when the teeth doe grind the meat in pieces, or grind it small. The meaning is, because the teeth can hardly chew, so that a man can hear nothing crack nothing or break between or under them, as is heard, when young chew and bite meat in pieces, having good teeth, which old persons seldom or never have] and he [to wit, the old man] riseth up [to wit, from his bed] at the voice of the bird, [that is, in the morning, when the birds begin to sing, for he cannot keep sleep to take rest] and all the singing men [Heb. The daughters of the song; that is, the singing women. Understand withal the singing man also, or the Musicians. Oth. All the daughters of the song, that is, all the parts or members of the body, which frame or form the voice] shall be bowed down. [or, shall bow; that is, shall perish, decrease, lose their strength; or shall be little esteemed, and counted of no value; inasmuch as the old man regardeth it not, as taking no more any delight in music. See the example hereof in Barfillai, 2 Sam.19.35.]"}],"5":[{"catchword":null,"tekst":"Also (when) they [To wit, old persons] shall be afraid of the high place [or, of high places; that is, of high exalted, or uneven places, which old men and women are loth to tread on, by reason of the weaknesses of their legs, fearing to stumble at them, or to fall down from off them, or because it is troublesome and cumbersome to them to climb up high stairs or hills] and (when) there shall be terrors in the way, [or amazements; to wit, great or many: Fearing, that they may hit their feet or toes against something] and the almond tree shall flourish, [when there shall be grey or hoary hairs there] and the grass-hopper shall be a burden to himself, [that is, the old man, who is grown as lean, crooked and withered as grass-hopper. Oth. And a grass-hopper, that is, a thing as light as a grass-hopper] is burden some to him, and the desire [to wit, after bodily pleasures and delights, also appetite to eating, drinking, etc.] shall perish: for man goeth to his everlasting house, [that is, to the grave; for there shall men abide a long while. As he had said, When a man is sensible of all those incommodities and distempers in his body, he may well then imagine, that he is nigh unto death, yea, that he hath one foot already in the grave] and the mourners [that is, those persons that see the dead put into the grave, and which doth bewail and lament them, or mourn over them; for which purpose certain persons in former time were wont to be hired. See the annotate. Jerem.9. on v.17.] shall go about in the street."}],"6":[{"catchword":null,"tekst":"Before the silver cord be inchanted [That is, before the marrow or pith in the back-bone be loosed. This marrow is white like silver, and it is extended from the Bram all along the back-bone, like unto a cord or rope. Others understand here by the silver cord, the arteries. Oth. Removed. Oth. Chained or bound; that is, dried and stiffened] and the golden bowl be beaten in pieces, [by the golden bowl is meant, the same thin membrane or skin, wherein the brain lie, or which is of a gold colour. Others understand here by the golden bowl, the skull, wherein the brains lie shut up. Which likewise perisheth by death, and is as it were broken asunder] and the pitcher be broken at the fountain, [by the pitcher here is meant the chief great hollow vain, at or about the liver, called Vena cava] and the wheel beaten in pieces at the well; [by the wheel here is meant, the lungs, which by their continual motion do at one time thrust out the breath from them, and at another time draw it in again, resemble the wheel of a well, now drawing up the bucket towards it self, anon letting down again into the well.]"}],"7":[{"catchword":null,"tekst":"And the dust returneth to the earth as it was: [By dust here, is meant the body, which in the beginning was taken out of, and made of earth, Gen 3:19. see Job 7.v.5.] and the spirit [that is, the soul. See Num 16:22. and 27.16.] return to God, [to wit, into heaven. It is to be understood, that Salomon here speaketh to the people of God. Some understand it of the souls both of believers and unbelievers, which are both sentenced by God, as supream Judge, immediately when man dieth, every one to their place, the souls of believers to heaven, of unbelievers to hell. Compare, Luk 16:22.] who gave it [see gen 2.7. Num 16:22.]"}],"8":[{"catchword":null,"tekst":"Vanity of vanities, saith the Preacher, it is all vanity [See above, ch.1.2. Psa 62:9. and 144.4.]"}],"9":[{"catchword":null,"tekst":"And moreover, because the Preacher was wise, he still taught the people knowledge, [That is, good doctrines; he being converted, did like wise convert and teach others] and gave good heed, [oth. He pondered or weighed; to wit, in the scales of wisdom] and searched out [oth. Examined] he set in order many proverbs. [Salomon spake many proverbs, 1 kings 4.32. whereof onely the Book of the Proverbs, and the Book called Ecclesiastes, [in Hebrew, Cohelet) is come to our hands. And understand here, under the name of Proverbs, most excellent wise sentences or sayings, treating of the life and manners of men, and of the course of the world, see the annotate. 1 Kings 4. On v.32.]"}],"10":[{"catchword":null,"tekst":"The Preacher sought to find out acceptable words, [or, matters, things] and that which is written, is right, [or rightly constituted, ordered aright; that is, such, against which no man hath any thing to say] (even) words of truth."}],"11":[{"catchword":null,"tekst":"The words of the wise are goods, [Intimating, that as oxen are driven on, or made to plow, by the pricking of the goads or sharp pins, that so likewise men ought to be put on by sharp and earnest exhortations to the practice of virtue and piety, and to the loathing and abhorring of worldly vanity] and as nails knock deep in [Heb. Implanted] (by) the masters of the assembles, [or of the congregation; that is, of the Teachers of the Congregation (that) [or which, to wit, words of the wise; which, to wit, nails] are given by onely Shepherd. [Heb. By one shepherd; to wit, by God, who is the Shepherd and Keeper of his people, Psa.23 and who sending forth his Prophets and Ministers, enlighteneth and enableth them by his spirit, see Joh 10:11. 1 Pet.1.11. and ch.5.4. oth. By the first shepherd.]"}],"12":[{"catchword":null,"tekst":"And whatsoever is above them, my son be warned: [Above them, to wit, the words of the wise, and of the onely shepherd. Oth. Moreover, my son, be thy these admonished or exhorted. Heb. Properly, be enlightened; to wit, by the Proverbs that are contained in this Book, and especially also in the Book of my Proverbs, and others Books besides. Thou hast enough with these, observe these but well, and take heed of receiving and entertaining that which the Philosophers or wise men of the world have written concerning the chief good and happiness of man, for these were not led by the spirit of God, and therefore have step far aside from the right way] of making many Books [to wit, as the Philosophers, the wise men of the world, have done] (there) is no end, and much reading [Or, too much reading. Oth. Too much study] is a wearing of flesh. [that is man. The meaning is, maketh the head and the brains weary.]"}],"13":[{"catchword":null,"tekst":"Of all that hath been heard, [that is, all that, whereunto this Sermon of mine tended, concerning the chief good] the end [that is, the conclusion or summer] of the matter is, Fear God, [by whom alone thou canst obtain the supream good and salvation, but not by any earthly or transitory thing] and keep his Commandment; [compare, Deut.6.2. and 10.12. and Pro 3:7.] for this (becometh) all men. [oth. For this is the whole (work or duty) of man; that is, he ought to make it his whole businesses, or his whole employment: this is the most principal end of mans life: or, this is the whole of man; that is, absolute and perfect happiness: or herein consisteth his welfare and salvation. Oth. Of the whole man.]"}],"14":[{"catchword":null,"tekst":"For God shall bring every work [Or, every deed or action; that is, all mens deeds and works] into judgement, with all that is hidden, whether (it be) good, or whether (it be) evil. [For at the last day will God Judge the very secret thoughts of men, Rom 2.16. Hebr. 1.34. Compare, 1 Corinth.4.5. and 2 Cor.5.10.]"}]}}};

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */

    rij.className = 'vers'; rij.id = 'v' + n;

    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;

    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  // dubbele rechtsklik (binnen 500ms, zelfde verwijzing) kopieert het vers
  // i.p.v. de vertalingen-popup te tonen (enkele rechtsklik blijft bestaand gedrag)
  function kopieerVerwijzing(chip, ref) {
    haalVert('versteksten', ref).then(data => {
      const tekst = data && data[ref.vers];
      if (!tekst) return;
      const url = location.origin + '/studiebijbel/' + ref.slug + '/' + ref.hfd + '#v' + ref.vers;
      const kopie = tekst.replace(/\*/g, '') + `\n~ [${chip.textContent}](${url})`;
      navigator.clipboard.writeText(kopie).then(() => {
        toast.classList.add('zichtbaar');
        setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
      });
    });
  }
  let laatsteRechtsklik = { sleutel: null, tijd: 0 };
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    const sleutel = chip.dataset.ref;
    const nu = Date.now();
    const isDubbelklik = laatsteRechtsklik.sleutel === sleutel && (nu - laatsteRechtsklik.tijd) < 500;
    laatsteRechtsklik = isDubbelklik ? { sleutel: null, tijd: 0 } : { sleutel, tijd: nu };
    if (isDubbelklik) {
      popup.style.display = 'none';
      vpopup.style.display = 'none';
      kopieerVerwijzing(chip, ref);
      return;
    }
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
