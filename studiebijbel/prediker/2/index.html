">give</span> <span class=\"wl wl-kjv\" data-code=\"H1320\">myself</span> unto <span class=\"wl wl-kjv\" data-code=\"H3196\">wine,</span> yet <span class=\"wl wl-kjv\" data-code=\"H5090\">acquainting</span> mine <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> with <span class=\"wl wl-kjv\" data-code=\"H2451\">wisdom;</span> and to lay <span class=\"wl wl-kjv\" data-code=\"H270\">hold</span> on <span class=\"wl wl-kjv\" data-code=\"H5531\">folly,</span> till I might <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> what was that <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> for the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H120\">men,</span> which they should <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> under the <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven</span> <span class=\"wl wl-kjv\" data-code=\"H4557\">all</span> the <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> of their life.", "4": "I made me <span class=\"wl wl-kjv\" data-code=\"H1431\">great</span> <span class=\"wl wl-kjv\" data-code=\"H4639\">works;</span> I <span class=\"wl wl-kjv\" data-code=\"H1129\">builded</span> me <span class=\"wl wl-kjv\" data-code=\"H1004\">houses;</span> I <span class=\"wl wl-kjv\" data-code=\"H5193\">planted</span> me vineyards:", "5": "I <span class=\"wl wl-kjv\" data-code=\"H6213\">made</span> me <span class=\"wl wl-kjv\" data-code=\"H1593\">gardens</span> and <span class=\"wl wl-kjv\" data-code=\"H6508\">orchards,</span> and I <span class=\"wl wl-kjv\" data-code=\"H5193\">planted</span> <span class=\"wl wl-kjv\" data-code=\"H6086\">trees</span> in them of all kind of fruits:", "6": "I <span class=\"wl wl-kjv\" data-code=\"H6213\">made</span> me <span class=\"wl wl-kjv\" data-code=\"H1295\">pools</span> of <span class=\"wl wl-kjv\" data-code=\"H4325\">water,</span> to <span class=\"wl wl-kjv\" data-code=\"H8248\">water</span> therewith the <span class=\"wl wl-kjv\" data-code=\"H3293\">wood</span> that bringeth <span class=\"wl wl-kjv\" data-code=\"H6779\">forth</span> trees:", "7": "I <span class=\"wl wl-kjv\" data-code=\"H7069\">got</span> me <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> and <span class=\"wl wl-kjv\" data-code=\"H8198\">maidens,</span> and had servants <span class=\"wl wl-kjv\" data-code=\"H1121\">born</span> in my <span class=\"wl wl-kjv\" data-code=\"H1004\">house;</span> also I had <span class=\"wl wl-kjv\" data-code=\"H7235\">great</span> <span class=\"wl wl-kjv\" data-code=\"H4735\">possessions</span> of <span class=\"wl wl-kjv\" data-code=\"H1241\">great</span> and small <span class=\"wl wl-kjv\" data-code=\"H6629\">cattle</span> above all that were in <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> before", "8": "I <span class=\"wl wl-kjv\" data-code=\"H3664\">gathered</span> me also <span class=\"wl wl-kjv\" data-code=\"H3701\">silver</span> and <span class=\"wl wl-kjv\" data-code=\"H2091\">gold,</span> and the peculiar <span class=\"wl wl-kjv\" data-code=\"H5459\">treasure</span> of <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> and of the <span class=\"wl wl-kjv\" data-code=\"H4082\">provinces:</span> I <span class=\"wl wl-kjv\" data-code=\"H6213\">gat</span> me men <span class=\"wl wl-kjv\" data-code=\"H7891\">singers</span> and women <span class=\"wl wl-kjv\" data-code=\"H7891\">singers,</span> and the <span class=\"wl wl-kjv\" data-code=\"H8588\">delights</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H120\">men,</span> as musical <span class=\"wl wl-kjv\" data-code=\"H7705\">instruments,</span>", "9": "So I was <span class=\"wl wl-kjv\" data-code=\"H1431\">great,</span> and <span class=\"wl wl-kjv\" data-code=\"H3254\">increased</span> more than all that were <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> me in <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem:</span> also my <span class=\"wl wl-kjv\" data-code=\"H2451\">wisdom</span> remained", "10": "And whatsoever mine <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes</span> <span class=\"wl wl-kjv\" data-code=\"H7592\">desired</span> I <span class=\"wl wl-kjv\" data-code=\"H680\">kept</span> not from them, I <span class=\"wl wl-kjv\" data-code=\"H4513\">withheld</span> not my <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> from any <span class=\"wl wl-kjv\" data-code=\"H8057\">joy;</span> for my <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> <span class=\"wl wl-kjv\" data-code=\"H8056\">rejoiced</span> in all my <span class=\"wl wl-kjv\" data-code=\"H5999\">labour:</span> and this was my <span class=\"wl wl-kjv\" data-code=\"H2506\">portion</span> of all my labour.", "11": "Then I <span class=\"wl wl-kjv\" data-code=\"H6437\">looked</span> on all the <span class=\"wl wl-kjv\" data-code=\"H4639\">works</span> that my <span class=\"wl wl-kjv\" data-code=\"H3027\">hands</span> had <span class=\"wl wl-kjv\" data-code=\"H6213\">wrought,</span> and on the <span class=\"wl wl-kjv\" data-code=\"H5999\">labour</span> that I had <span class=\"wl wl-kjv\" data-code=\"H5998\">laboured</span> to <span class=\"wl wl-kjv\" data-code=\"H6213\">do:</span> and, behold, all was <span class=\"wl wl-kjv\" data-code=\"H1892\">vanity</span> and <span class=\"wl wl-kjv\" data-code=\"H7469\">vexation</span> of <span class=\"wl wl-kjv\" data-code=\"H7307\">spirit,</span> and there was no <span class=\"wl wl-kjv\" data-code=\"H3504\">profit</span> under the sun.", "12": "And I <span class=\"wl wl-kjv\" data-code=\"H6437\">turned</span> myself to <span class=\"wl wl-kjv\" data-code=\"H7200\">behold</span> <span class=\"wl wl-kjv\" data-code=\"H2451\">wisdom,</span> and <span class=\"wl wl-kjv\" data-code=\"H1947\">madness,</span> and <span class=\"wl wl-kjv\" data-code=\"H5531\">folly:</span> for what can the <span class=\"wl wl-kjv\" data-code=\"H120\">man</span> do that <span class=\"wl wl-kjv\" data-code=\"H935\">cometh</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king?</span> even that which hath been <span class=\"wl wl-kjv\" data-code=\"H3528\">already</span> done.", "13": "Then I <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> <span class=\"wl wl-kjv\" data-code=\"H3426\">that</span> <span class=\"wl wl-kjv\" data-code=\"H2451\">wisdom</span> <span class=\"wl wl-kjv\" data-code=\"H3504\">excelleth</span> <span class=\"wl wl-kjv\" data-code=\"H5531\">folly,</span> as far as <span class=\"wl wl-kjv\" data-code=\"H216\">light</span> <span class=\"wl wl-kjv\" data-code=\"H3504\">excelleth</span> darkness.", "14": "The wise <span class=\"wl wl-kjv\" data-code=\"H2450\">man's</span> <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes</span> are in his <span class=\"wl wl-kjv\" data-code=\"H7218\">head;</span> but the <span class=\"wl wl-kjv\" data-code=\"H3684\">fool</span> <span class=\"wl wl-kjv\" data-code=\"H1980\">walketh</span> in <span class=\"wl wl-kjv\" data-code=\"H2822\">darkness:</span> and I myself <span class=\"wl wl-kjv\" data-code=\"H3045\">perceived</span> also that <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H4745\">event</span> happeneth", "15": "<span class=\"wl wl-kjv\" data-code=\"H227\">Then</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> I in my <span class=\"wl wl-kjv\" data-code=\"H3820\">heart,</span> As it <span class=\"wl wl-kjv\" data-code=\"H4745\">happeneth</span> to the <span class=\"wl wl-kjv\" data-code=\"H3684\">fool,</span> so it <span class=\"wl wl-kjv\" data-code=\"H7136\">happeneth</span> even to <span class=\"wl wl-kjv\" data-code=\"H1571\">me;</span> and why was I then <span class=\"wl wl-kjv\" data-code=\"H3148\">more</span> <span class=\"wl wl-kjv\" data-code=\"H2449\">wise?</span> Then I <span class=\"wl wl-kjv\" data-code=\"H1696\">said</span> in my <span class=\"wl wl-kjv\" data-code=\"H3820\">heart,</span> that this also is vanity.", "16": "For there is no <span class=\"wl wl-kjv\" data-code=\"H2146\">remembrance</span> of the <span class=\"wl wl-kjv\" data-code=\"H2450\">wise</span> more <span class=\"wl wl-kjv\" data-code=\"H5973\">than</span> of the <span class=\"wl wl-kjv\" data-code=\"H3684\">fool</span> for <span class=\"wl wl-kjv\" data-code=\"H5769\">ever;</span> seeing that which <span class=\"wl wl-kjv\" data-code=\"H3528\">now</span> is in the <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> to <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> shall all be <span class=\"wl wl-kjv\" data-code=\"H7911\">forgotten.</span> And how <span class=\"wl wl-kjv\" data-code=\"H4191\">dieth</span> the <span class=\"wl wl-kjv\" data-code=\"H2450\">wise</span> man? as the fool.", "17": "Therefore I <span class=\"wl wl-kjv\" data-code=\"H8130\">hated</span> <span class=\"wl wl-kjv\" data-code=\"H2416\">life;</span> because the <span class=\"wl wl-kjv\" data-code=\"H4639\">work</span> that is <span class=\"wl wl-kjv\" data-code=\"H6213\">wrought</span> under the <span class=\"wl wl-kjv\" data-code=\"H8121\">sun</span> is <span class=\"wl wl-kjv\" data-code=\"H7451\">grievous</span> unto me: for all is <span class=\"wl wl-kjv\" data-code=\"H1892\">vanity</span> and <span class=\"wl wl-kjv\" data-code=\"H7469\">vexation</span> of spirit.", "18": "Yea, I <span class=\"wl wl-kjv\" data-code=\"H8130\">hated</span> all my <span class=\"wl wl-kjv\" data-code=\"H5999\">labour</span> which I had <span class=\"wl wl-kjv\" data-code=\"H6001\">taken</span> under the <span class=\"wl wl-kjv\" data-code=\"H8121\">sun:</span> because I should <span class=\"wl wl-kjv\" data-code=\"H3240\">leave</span> it unto the <span class=\"wl wl-kjv\" data-code=\"H120\">man</span> that shall be after", "19": "And who <span class=\"wl wl-kjv\" data-code=\"H3045\">knoweth</span> whether he shall be a <span class=\"wl wl-kjv\" data-code=\"H2450\">wise</span> man or a <span class=\"wl wl-kjv\" data-code=\"H5530\">fool?</span> yet shall he have <span class=\"wl wl-kjv\" data-code=\"H7980\">rule</span> over all my <span class=\"wl wl-kjv\" data-code=\"H5999\">labour</span> wherein I have <span class=\"wl wl-kjv\" data-code=\"H5998\">laboured,</span> and wherein I have shewed myself <span class=\"wl wl-kjv\" data-code=\"H2449\">wise</span> under the <span class=\"wl wl-kjv\" data-code=\"H8121\">sun.</span> This is also vanity.", "20": "Therefore I went <span class=\"wl wl-kjv\" data-code=\"H5437\">about</span> to <span class=\"wl wl-kjv\" data-code=\"H2976\">cause</span> my <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> to <span class=\"wl wl-kjv\" data-code=\"H2976\">despair</span> of all the <span class=\"wl wl-kjv\" data-code=\"H5999\">labour</span> which I <span class=\"wl wl-kjv\" data-code=\"H5998\">took</span> under the sun.", "21": "For there <span class=\"wl wl-kjv\" data-code=\"H3426\">is</span> a <span class=\"wl wl-kjv\" data-code=\"H120\">man</span> whose <span class=\"wl wl-kjv\" data-code=\"H5999\">labour</span> is in <span class=\"wl wl-kjv\" data-code=\"H2451\">wisdom,</span> and in <span class=\"wl wl-kjv\" data-code=\"H1847\">knowledge,</span> and in <span class=\"wl wl-kjv\" data-code=\"H3788\">equity;</span> yet to a <span class=\"wl wl-kjv\" data-code=\"H120\">man</span> that hath not <span class=\"wl wl-kjv\" data-code=\"H5998\">laboured</span> therein shall he <span class=\"wl wl-kjv\" data-code=\"H5414\">leave</span> it for his <span class=\"wl wl-kjv\" data-code=\"H2506\">portion.</span> This also is <span class=\"wl wl-kjv\" data-code=\"H1892\">vanity</span> and a <span class=\"wl wl-kjv\" data-code=\"H7227\">great</span> evil.", "22": "For what <span class=\"wl wl-kjv\" data-code=\"H1933\">hath</span> <span class=\"wl wl-kjv\" data-code=\"H120\">man</span> of all his <span class=\"wl wl-kjv\" data-code=\"H5999\">labour,</span> and of the <span class=\"wl wl-kjv\" data-code=\"H7475\">vexation</span> of his <span class=\"wl wl-kjv\" data-code=\"H3820\">heart,</span> <span class=\"wl wl-kjv\" data-code=\"H1931\">wherein</span> he hath <span class=\"wl wl-kjv\" data-code=\"H6001\">laboured</span> under the sun?", "23": "For all his <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> are <span class=\"wl wl-kjv\" data-code=\"H4341\">sorrows,</span> and his <span class=\"wl wl-kjv\" data-code=\"H6045\">travail</span> <span class=\"wl wl-kjv\" data-code=\"H3708\">grief;</span> yea, his <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> taketh not <span class=\"wl wl-kjv\" data-code=\"H7901\">rest</span> in the <span class=\"wl wl-kjv\" data-code=\"H3915\">night.</span> This is also vanity.", "24": "There is nothing <span class=\"wl wl-kjv\" data-code=\"H2896\">better</span> for a <span class=\"wl wl-kjv\" data-code=\"H120\">man,</span> than that he should <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> and <span class=\"wl wl-kjv\" data-code=\"H8354\">drink,</span> and that he should make his <span class=\"wl wl-kjv\" data-code=\"H5315\">soul</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">enjoy</span> <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> in his <span class=\"wl wl-kjv\" data-code=\"H5999\">labour.</span> <span class=\"wl wl-kjv\" data-code=\"H2090\">This</span> also I <span class=\"wl wl-kjv\" data-code=\"H7200\">saw,</span> that it was from the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of God.", "25": "For who can <span class=\"wl wl-kjv\" data-code=\"H398\">eat,</span> or who else can <span class=\"wl wl-kjv\" data-code=\"H2363\">hasten</span> hereunto, more", "26": "For God <span class=\"wl wl-kjv\" data-code=\"H5414\">giveth</span> to a <span class=\"wl wl-kjv\" data-code=\"H120\">man</span> that is <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> in his <span class=\"wl wl-kjv\" data-code=\"H6440\">sight</span> <span class=\"wl wl-kjv\" data-code=\"H2451\">wisdom,</span> and <span class=\"wl wl-kjv\" data-code=\"H1847\">knowledge,</span> and <span class=\"wl wl-kjv\" data-code=\"H8057\">joy:</span> but to the <span class=\"wl wl-kjv\" data-code=\"H2398\">sinner</span> he <span class=\"wl wl-kjv\" data-code=\"H5414\">giveth</span> <span class=\"wl wl-kjv\" data-code=\"H6045\">travail,</span> to <span class=\"wl wl-kjv\" data-code=\"H622\">gather</span> and to heap <span class=\"wl wl-kjv\" data-code=\"H3664\">up,</span> that he may <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> to him that is <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God.</span> This also is <span class=\"wl wl-kjv\" data-code=\"H1892\">vanity</span> and <span class=\"wl wl-kjv\" data-code=\"H7469\">vexation</span> of spirit."}};
const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"
const ZELF = D.meta.zelf_abbr;      // afkorting binnen dit hoofdstuk, bv. "Joh 3"
const BASIS_URL = D.meta.basis_url;
const PARALLEL_VOLGORDE = ['SVnu', 'SV', 'KJV'];
let vertaling = 'SVnu';
let openVers = null;

const bijbel = document.getElementById('bijbel');
const popup = document.getElementById('popup');
const toast = document.getElementById('toast');
const nummers = Object.keys(D.vertalingen.SVnu);

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const berea = D.tsk[n], engels = D.tsk_kjv[n];
    if ((!berea || !berea.length) && (!engels || !engels.length)) return '<em>Geen verwijzingen bij dit vers.</em>';
    let h = '';
    if (berea && berea.length) {
      h += '<div class="tsk-kop">Treasury of Scripture Knowledge | SVnu</div>';
      h += berea.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r}">${r}</a>`).join('') + '</div>').join('');
    }
    if (engels && engels.length) {
      h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.tsk[n] && D.tsk[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}
</script>
</body>
</html>
