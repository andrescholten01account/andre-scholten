andstreken; ik nam mij zangers en zangeressen aan, en wat mensenkinderen tot lust strekt: allerlei snarenspel.","9":"En ik werd groot, en nam toe, meer dan wie ook vóór mij in Jeruzalem geweest was; ook bleef mijn wijsheid mij bij.","10":"En al wat mijn ogen begeerden, dat onthield ik hun niet; ik weerhield mijn hart niet van enige blijdschap, maar mijn hart was blij vanwege al mijn arbeid; en dit was mijn deel van al mijn arbeid.","11":"Toen wendde ik mij tot al mijn werken die mijn handen gemaakt hadden, en tot de arbeid die ik met inspanning had verricht; zie, het was allemaal ijdelheid en kwelling van de geest, en daarin was geen voordeel onder de zon.","12":"Daarna wendde ik mij om wijsheid te bekijken, ook onzinnigheden en dwaasheid; want wat zou een mens kunnen doen die de koning zal opvolgen? Alleen wat al gedaan is.","13":"Toen zag ik dat de wijsheid uitmunt boven de dwaasheid, zoals het licht uitmunt boven de duisternis.","14":"De ogen van de wijze staan in zijn hoofd, maar de dwaas wandelt in de duisternis. Toen merkte ik ook op dat één en hetzelfde lot hun allen treft.","15":"Daarom zei ik in mijn hart: Zoals het de dwaas vergaat, zal het ook mij vergaan; waarom heb ik dan toen meer naar wijsheid gestreefd? Toen sprak ik in mijn hart, dat ook dat ijdelheid was.","16":"Want er zal in eeuwigheid niet meer herinnering aan een wijze zijn dan aan een dwaas; aangezien wat nu is, in de toekomstige dagen helemaal vergeten wordt; en hoe sterft de wijze? Net als de dwaas.","17":"Daarom haatte ik dit leven, want dit werk dat onder de zon gebeurt, leek mij slecht; want het is allemaal ijdelheid en kwelling van de geest.","18":"Ik haatte ook al mijn arbeid die ik onder de zon verricht had, omdat ik die zou moeten achterlaten aan een mens die na mij komen zal.","19":"Want wie weet of hij wijs zal zijn of dwaas? Toch zal hij heersen over al mijn arbeid, die ik met inspanning verricht heb en waarin ik mij wijs heb betoond onder de zon. Dat is ook ijdelheid.","20":"Daarom keerde ik mij om, om mijn hart te laten wanhopen over al de arbeid die ik onder de zon verricht heb.","21":"Want er is een mens wiens arbeid in wijsheid, in kennis en in bekwaamheid bestaat; en toch zal hij die overdragen als zijn deel aan een mens die daar niet aan gewerkt heeft. Dit is ook ijdelheid en een groot kwaad.","22":"Wat heeft die mens toch van al zijn arbeid en van de kwellingen van zijn hart, waarmee hij zich aftobt onder de zon?","23":"Want al zijn dagen zijn smarten, en zijn bezigheid is verdriet; zelfs 's nachts vindt zijn hart geen rust. Dat is ook ijdelheid.","24":"Is het dan niet goed voor de mens dat hij eet en drinkt, en dat hij zijn ziel het goede laat genieten in zijn arbeid? Ik heb ook gezien dat dit uit de hand van God is.","25":"(Want wie zou ervan eten, of wie zou zich daartoe haasten, meer dan ikzelf?)","26":"Want Hij geeft wijsheid, kennis en vreugde aan de mens die goed is voor Zijn aangezicht; maar aan de zondaar geeft Hij de bezigheid om te verzamelen en te vergaderen, opdat Hij het geeft aan wie goed is voor Gods aangezicht. Dit is ook ijdelheid en kwelling van de geest."},"SV":{"1":"Ik zeide in mijn hart: Nu, welaan, ik zal u beproeven door vreugde; derhalve zie het goede aan; maar zie, ook dat was ijdelheid.","2":"Tot het lachen zeide ik: Gij zijt onzinnig, en tot de vreugde: Wat maakt deze?","3":"Ik heb in mijn hart nagespeurd, om mijn vlees op te houden in den wijn, (nochtans leidende mijn hart in wijsheid) en om de dwaasheid vast te houden, totdat ik zou zien wat den kinderen der mensen het best ware, dat zij doen zouden onder den hemel, *gedurende* het getal der dagen huns levens.","4":"Ik maakte mij grote werken, ik bouwde mij huizen, ik plantte mij wijngaarden.","5":"Ik maakte mij hoven en lusthoven, en ik plantte bomen in dezelve, van allerlei vrucht.","6":"Ik maakte mij vijvers van wateren, om daarmede te bewateren het woud, dat met bomen groende.","7":"Ik kreeg knechten en maagden, en ik had kinderen des huizes; ook had ik een groot bezit van runderen en schapen, meer dan allen, die voor mij te Jeruzalem geweest waren.","8":"Ik vergaderde mij ook zilver en goud, en kleinoden der koningen en der landschappen; ik bestelde mij zangers en zangeressen, en wellustigheden der mensenkinderen, snarenspel, ja, allerlei snarenspel.","9":"En ik werd groot, en nam toe, meer dan iemand, die voor mij te Jeruzalem geweest was; ook bleef mijn wijsheid mij bij.","10":"En al wat mijn ogen begeerden, dat onttrok ik hun niet; ik wederhield mijn hart niet van enige blijdschap, maar mijn hart was verblijd vanwege al mijn arbeid; en dit was mijn deel van al mijn arbeid.","11":"Toen wendde ik mij tot al mijn werken, die mijn handen gemaakt hadden, en tot den arbeid, dien ik werkende gearbeid had; ziet, het was al ijdelheid en kwelling des geestes, en daarin was geen voordeel onder de zon.","12":"Daarna wendde ik mij, om te zien wijsheid, ook onzinnigheden en dwaasheid; want hoe zou een mens, die den koning nakomen zal, *doen* hetgeen alrede gedaan is?","13":"Toen zag ik, dat de wijsheid uitnemendheid heeft boven de dwaasheid, gelijk het licht uitnemendheid heeft boven de duisternis.","14":"De ogen des wijzen zijn in zijn hoofd, maar de zot wandelt in de duisternis. Toen bemerkte ik ook, dat enerlei geval hun allen bejegent.","15":"Dies zeide ik in mijn hart: Gelijk het den dwaze bejegent, zal het ook mijzelven bejegenen; waarom heb ik dan toen meer naar wijsheid gestaan? Toen sprak ik in mijn hart, dat ook hetzelve ijdelheid was.","16":"Want er zal in eeuwigheid niet meer gedachtenis van een wijze, dan van een dwaas zijn; aangezien hetgeen nu is, in de toekomende dagen altemaal vergeten wordt; en hoe sterft de wijze met den zot?","17":"Daarom haatte ik dit leven, want dit werk dacht mij kwaad, dat onder de zon geschiedt; want het is al ijdelheid en kwelling des geestes.","18":"Ik haatte ook al mijn arbeid, dien ik bearbeid had onder de zon, dat ik dien zou achterlaten aan een mens, die na mij wezen zal.","19":"Want wie weet, of hij wijs zal zijn, of dwaas? Evenwel zal hij heersen over al mijn arbeid, dien ik bearbeid heb en dien ik wijselijk beleid heb onder de zon. Dat is ook ijdelheid.","20":"Daarom keerde ik mij om, om mijn hart te doen wanhopen over al den arbeid, dien ik bearbeid heb onder de zon.","21":"Want er is een mens, wiens arbeid in wijsheid, en in wetenschap, en in geschiktheid is; nochtans zal hij dien overgeven tot zijn deel, aan een mens, die daaraan niet gearbeid heeft. Dit is ook ijdelheid en een groot kwaad.","22":"Wat heeft toch die mens van al zijn arbeid, en van de kwellingen zijns harten, dien hij is bearbeidende onder de zon?","23":"Want al zijn dagen zijn smarten, en zijn bezigheid is verdriet; zelfs des nachts rust zijn hart niet. Datzelve is ook ijdelheid.","24":"Is het *dan* niet goed voor den mens, dat hij ete en drinke, en dat hij zijn ziel het goede doe genieten in zijn arbeid? Ik heb ook gezien, dat zulks van de hand Gods is.","25":"(Want wie zou er van eten, of wie zou zich *daartoe* haasten, meer dan ik zelf?)","26":"Want Hij geeft wijsheid, en wetenschap, en vreugde den mens, die goed is voor Zijn aangezicht; maar den zondaar geeft Hij bezigheid om te verzamelen en te vergaderen, opdat Hij het geve dien, die goed is voor Gods aangezicht. Dit is ook ijdelheid en kwelling des geestes."},"KJV":{"1":"I said in mine heart, Go to now, I will prove thee with mirth, therefore enjoy pleasure: and, behold, this also *is* vanity.","2":"I said of laughter, *It is* mad: and of mirth, What doeth","3":"I sought in mine heart to give myself unto wine, yet acquainting mine heart with wisdom; and to lay hold on folly, till I might see what *was* that good for the sons of men, which they should do under the heaven all the days of their life.","4":"I made me great works; I builded me houses; I planted me vineyards:","5":"I made me gardens and orchards, and I planted trees in them of all *kind of* fruits:","6":"I made me pools of water, to water therewith the wood that bringeth forth trees:","7":"I got *me* servants and maidens, and had servants born in my house; also I had great possessions of great and small cattle above all that were in Jerusalem before","8":"I gathered me also silver and gold, and the peculiar treasure of kings and of the provinces: I gat me men singers and women singers, and the delights of the sons of men, *as* musical instruments,","9":"So I was great, and increased more than all that were before me in Jerusalem: also my wisdom remained","10":"And whatsoever mine eyes desired I kept not from them, I withheld not my heart from any joy; for my heart rejoiced in all my labour: and this was my portion of all my labour.","11":"Then I looked on all the works that my hands had wrought, and on the labour that I had laboured to do: and, behold, all *was* vanity and vexation of spirit, and *there was* no profit under the sun.","12":"And I turned myself to behold wisdom, and madness, and folly: for what *can* the man *do* that cometh after the king? *even* that which hath been already done.","13":"Then I saw that wisdom excelleth folly, as far as light excelleth darkness.","14":"The wise man's eyes *are* in his head; but the fool walketh in darkness: and I myself perceived also that one event happeneth","15":"Then said I in my heart, As it happeneth to the fool, so it happeneth even to me; and why was I then more wise? Then I said in my heart, that this also *is* vanity.","16":"For *there is* no remembrance of the wise more than of the fool for ever; seeing that which now *is* in the days to come shall all be forgotten. And how dieth the wise *man*? as the fool.","17":"Therefore I hated life; because the work that is wrought under the sun *is* grievous unto me: for all *is* vanity and vexation of spirit.","18":"Yea, I hated all my labour which I had taken under the sun: because I should leave it unto the man that shall be after","19":"And who knoweth whether he shall be a wise *man* or a fool? yet shall he have rule over all my labour wherein I have laboured, and wherein I have shewed myself wise under the sun. This *is* also vanity.","20":"Therefore I went about to cause my heart to despair of all the labour which I took under the sun.","21":"For there is a man whose labour *is* in wisdom, and in knowledge, and in equity; yet to a man that hath not laboured therein shall he leave it *for* his portion. This also *is* vanity and a great evil.","22":"For what hath man of all his labour, and of the vexation of his heart, wherein he hath laboured under the sun?","23":"For all his days *are* sorrows, and his travail grief; yea, his heart taketh not rest in the night. This is also vanity.","24":"*There is* nothing better for a man, *than* that he should eat and drink, and *that* he should make his soul enjoy good in his labour. This also I saw, that it *was* from the hand of God.","25":"For who can eat, or who else can hasten *hereunto*, more","26":"For *God* giveth to a man that *is* good in his sight wisdom, and knowledge, and joy: but to the sinner he giveth travail, to gather and to heap up, that he may give to *him that is* good before God. This also *is* vanity and vexation of spirit."}},"tsk":{"1":[{"kopje":"zei","refs":["Pred 2:15","Pred 1:16","Pred 1:17","Pred 3:17","Pred 3:18","Ps 10:6","Ps 14:1","Ps 27:8","Ps 30:7","Ps 30:8","Luk 12:19"]},{"kopje":"welaan","refs":["Gen 11:3","Gen 11:4","Gen 11:7","2 Kon 5:5","Jes 5:5","Jak 4:13","Jak 5:1"]},{"kopje":"ik zal","refs":["Pred 8:15","Pred 11:9","Jes 50:5","Jes 50:11","Luk 16:19","Luk 16:23","Jak 5:5","Tit 3:3","Openb 18:7","Openb 18:8"]}],"2":[{"kopje":"U bent","refs":["Pred 7:2-6","Spr 14:13","Jes 22:12","Jes 22:13","Amos 6:3-6","1 Petr 4:2-4"]}],"3":[{"kopje":"nagespeurd","refs":["Pred 1:17","1 Sam 25:36"]},{"kopje":"en toch","refs":["Spr 20:1","Spr 31:4","Spr 31:5","Ef 5:18"]},{"kopje":"om vast te houden","refs":["Pred 7:18","Spr 20:1","Spr 23:29-35","Matt 6:24","2 Kor 6:15-17"]},{"kopje":"totdat","refs":["P ode=\"H2398\">aan</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H2398\">de</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H2398\">zondaar</span> <span class=\"wl\" data-l=\"L9\" data-code=\"H5414\">geeft</span> <span class=\"wl\" data-l=\"L9\" data-code=\"H5414\">Hij</span> <span class=\"wl\" data-l=\"L9\" data-code=\"H5414\">de</span> <span class=\"wl\" data-l=\"L10\" data-code=\"H6045\">bezigheid</span> <span class=\"wl\" data-l=\"L10\" data-code=\"H6045\">om</span> <span class=\"wl\" data-l=\"L11\" data-code=\"H622\">te</span> <span class=\"wl\" data-l=\"L11\" data-code=\"H622\">verzamelen</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H8057\">en</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H8057\">te</span> <span class=\"wl\" data-l=\"L12\" data-code=\"H3664\">vergaderen</span>, <span class=\"wl\" data-l=\"L13\" data-code=\"H5414\">opdat</span> <span class=\"wl\" data-l=\"L13\" data-code=\"H5414\">Hij</span> <span class=\"wl\" data-l=\"L13\" data-code=\"H5414\">het</span> geeft aan wie <span class=\"wl\" data-l=\"L6\" data-code=\"H2896\">goed</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H2896\">is</span> <span class=\"wl\" data-l=\"L14\" data-code=\"H430\">voor</span> <span class=\"wl\" data-l=\"L14\" data-code=\"H430\">Gods</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H6440\">aangezicht</span>. <span class=\"wl\" data-l=\"L15\" data-code=\"H1892\">Dit</span> <span class=\"wl\" data-l=\"L15\" data-code=\"H1892\">is</span> <span class=\"wl\" data-l=\"L15\" data-code=\"H1892\">ook</span> <span class=\"wl\" data-l=\"L15\" data-code=\"H1892\">ijdelheid</span> <span class=\"wl\" data-l=\"L12\" data-code=\"H3664\">en</span> <span class=\"wl\" data-l=\"L16\" data-code=\"H7469\">kwelling</span> <span class=\"wl\" data-l=\"L16\" data-code=\"H7469\">van</span> <span class=\"wl\" data-l=\"L17\" data-code=\"H7307\">de</span> <span class=\"wl\" data-l=\"L17\" data-code=\"H7307\">geest</span>."},"koppeling_kjv":{"1":"I <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> in mine <span class=\"wl wl-kjv\" data-code=\"H3820\">heart,</span> Go to <span class=\"wl wl-kjv\" data-code=\"H3212\">now,</span> I will <span class=\"wl wl-kjv\" data-code=\"H5254\">prove</span> thee with <span class=\"wl wl-kjv\" data-code=\"H8057\">mirth,</span> therefore <span class=\"wl wl-kjv\" data-code=\"H7200\">enjoy</span> <span class=\"wl wl-kjv\" data-code=\"H2896\">pleasure:</span> and, behold, this also is vanity.","2":"I <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> of <span class=\"wl wl-kjv\" data-code=\"H7814\">laughter,</span> It is <span class=\"wl wl-kjv\" data-code=\"H1984\">mad:</span> and of <span class=\"wl wl-kjv\" data-code=\"H8057\">mirth,</span> <span class=\"wl wl-kjv\" data-code=\"H2090\">What</span> doeth","3":"I <span class=\"wl wl-kjv\" data-code=\"H8446\">sought</span> in mine <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> to <span class=\"wl wl-kjv\" data-code=\"H4900\">give</span> <span class=\"wl wl-kjv\" data-code=\"H1320\">myself</span> unto <span class=\"wl wl-kjv\" data-code=\"H3196\">wine,</span> yet <span class=\"wl wl-kjv\" data-code=\"H5090\">acquainting</span> mine <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> with <span class=\"wl wl-kjv\" data-code=\"H2451\">wisdom;</span> and to lay <span class=\"wl wl-kjv\" data-code=\"H270\">hold</span> on <span class=\"wl wl-kjv\" data-code=\"H5531\">folly,</span> till I might <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> what was that <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> for the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H120\">men,</span> which they should <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> under the <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven</span> <span class=\"wl wl-kjv\" data-code=\"H4557\">all</span> the <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> of their life.","4":"I made me <span class=\"wl wl-kjv\" data-code=\"H1431\">great</span> <span class=\"wl wl-kjv\" data-code=\"H4639\">works;</span> I <span class=\"wl wl-kjv\" data-code=\"H1129\">builded</span> me <span class=\"wl wl-kjv\" data-code=\"H1004\">houses;</span> I <span class=\"wl wl-kjv\" data-code=\"H5193\">planted</span> me vineyards:","5":"I <span class=\"wl wl-kjv\" data-code=\"H6213\">made</span> me <span class=\"wl wl-kjv\" data-code=\"H1593\">gardens</span> and <span class=\"wl wl-kjv\" data-code=\"H6508\">orchards,</span> and I <span class=\"wl wl-kjv\" data-code=\"H5193\">planted</span> <span class=\"wl wl-kjv\" data-code=\"H6086\">trees</span> in them of all kind of fruits:","6":"I <span class=\"wl wl-kjv\" data-code=\"H6213\">made</span> me <span class=\"wl wl-kjv\" data-code=\"H1295\">pools</span> of <span class=\"wl wl-kjv\" data-code=\"H4325\">water,</span> to <span class=\"wl wl-kjv\" data-code=\"H8248\">water</span> therewith the <span class=\"wl wl-kjv\" data-code=\"H3293\">wood</span> that bringeth <span class=\"wl wl-kjv\" data-code=\"H6779\">forth</span> trees:","7":"I <span class=\"wl wl-kjv\" data-code=\"H7069\">got</span> me <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> and <span class=\"wl wl-kjv\" data-code=\"H8198\">maidens,</span> and had servants <span class=\"wl wl-kjv\" data-code=\"H1121\">born</span> in my <span class=\"wl wl-kjv\" data-code=\"H1004\">house;</span> also I had <span class=\"wl wl-kjv\" data-code=\"H7235\">great</span> <span class=\"wl wl-kjv\" data-code=\"H4735\">possessions</span> of <span class=\"wl wl-kjv\" data-code=\"H1241\">great</span> and small <span class=\"wl wl-kjv\" data-code=\"H6629\">cattle</span> above all that were in <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> before","8":"I <span class=\"wl wl-kjv\" data-code=\"H3664\">gathered</span> me also <span class=\"wl wl-kjv\" data-code=\"H3701\">silver</span> and <span class=\"wl wl-kjv\" data-code=\"H2091\">gold,</span> and the peculiar <span class=\"wl wl-kjv\" data-code=\"H5459\">treasure</span> of <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> and of the <span class=\"wl wl-kjv\" data-code=\"H4082\">provinces:</span> I <span class=\"wl wl-kjv\" data-code=\"H6213\">gat</span> me men <span class=\"wl wl-kjv\" data-code=\"H7891\">singers</span> and women <span class=\"wl wl-kjv\" data-code=\"H7891\">singers,</span> and the <span class=\"wl wl-kjv\" data-code=\"H8588\">delights</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H120\">men,</span> as musical <span class=\"wl wl-kjv\" data-code=\"H7705\">instruments,</span>","9":"So I was <span class=\"wl wl-kjv\" data-code=\"H1431\">great,</span> and <span class=\"wl wl-kjv\" data-code=\"H3254\">increased</span> more than all that were <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> me in <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem:</span> also my <span class=\"wl wl-kjv\" data-code=\"H2451\">wisdom</span> remained","10":"And whatsoever mine <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes</span> <span class=\"wl wl-kjv\" data-code=\"H7592\">desired</span> I <span class=\"wl wl-kjv\" data-code=\"H680\">kept</span> not from them, I <span class=\"wl wl-kjv\" data-code=\"H4513\">withheld</span> not my <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> from any <span class=\"wl wl-kjv\" data-code=\"H8057\">joy;</span> for my <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> <span class=\"wl wl-kjv\" data-code=\"H8056\">rejoiced</span> in all my <span class=\"wl wl-kjv\" data-code=\"H5999\">labour:</span> and this was my <span class=\"wl wl-kjv\" data-code=\"H2506\">portion</span> of all my labour.","11":"Then I <span class=\"wl wl-kjv\" data-code=\"H6437\">looked</span> on all the <span class=\"wl wl-kjv\" data-code=\"H4639\">works</span> that my <span class=\"wl wl-kjv\" data-code=\"H3027\">hands</span> had <span class=\"wl wl-kjv\" data-code=\"H6213\">wrought,</span> and on the <span class=\"wl wl-kjv\" data-code=\"H5999\">labour</span> that I had <span class=\"wl wl-kjv\" data-code=\"H5998\">laboured</span> to <span class=\"wl wl-kjv\" data-code=\"H6213\">do:</span> and, behold, all was <span class=\"wl wl-kjv\" data-code=\"H1892\">vanity</span> and <span class=\"wl wl-kjv\" data-code=\"H7469\">vexation</span> of <span class=\"wl wl-kjv\" data-code=\"H7307\">spirit,</span> and there was no <span class=\"wl wl-kjv\" data-code=\"H3504\">profit</span> under the sun.","12":"And I <span class=\"wl wl-kjv\" data-code=\"H6437\">turned</span> myself to <span class=\"wl wl-kjv\" data-code=\"H7200\">behold</span> <span class=\"wl wl-kjv\" data-code=\"H2451\">wisdom,</span> and <span class=\"wl wl-kjv\" data-code=\"H1947\">madness,</span> and <span class=\"wl wl-kjv\" data-code=\"H5531\">folly:</span> for what can the <span class=\"wl wl-kjv\" data-code=\"H120\">man</span> do that <span class=\"wl wl-kjv\" data-code=\"H935\">cometh</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king?</span> even that which hath been <span class=\"wl wl-kjv\" data-code=\"H3528\">already</span> done.","13":"Then I <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> <span class=\"wl wl-kjv\" data-code=\"H3426\">that</span> <span class=\"wl wl-kjv\" data-code=\"H2451\">wisdom</span> <span class=\"wl wl-kjv\" data-code=\"H3504\">excelleth</span> <span class=\"wl wl-kjv\" data-code=\"H5531\">folly,</span> as far as <span class=\"wl wl-kjv\" data-code=\"H216\">light</span> <span class=\"wl wl-kjv\" data-code=\"H3504\">excelleth</span> darkness.","14":"The wise <span class=\"wl wl-kjv\" data-code=\"H2450\">man's</span> <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes</span> are in his <span class=\"wl wl-kjv\" data-code=\"H7218\">head;</span> but the <span class=\"wl wl-kjv\" data-code=\"H3684\">fool</span> <span class=\"wl wl-kjv\" data-code=\"H1980\">walketh</span> in <span class=\"wl wl-kjv\" data-code=\"H2822\">darkness:</span> and I myself <span class=\"wl wl-kjv\" data-code=\"H3045\">perceived</span> also that <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H4745\">event</span> happeneth","15":"<span class=\"wl wl-kjv\" data-code=\"H227\">Then</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> I in my <span class=\"wl wl-kjv\" data-code=\"H3820\">heart,</span> As it <span class=\"wl wl-kjv\" data-code=\"H4745\">happeneth</span> to the <span class=\"wl wl-kjv\" data-code=\"H3684\">fool,</span> so it <span class=\"wl wl-kjv\" data-code=\"H7136\">happeneth</span> even to <span class=\"wl wl-kjv\" data-code=\"H1571\">me;</span> and why was I then <span class=\"wl wl-kjv\" data-code=\"H3148\">more</span> <span class=\"wl wl-kjv\" data-code=\"H2449\">wise?</span> Then I <span class=\"wl wl-kjv\" data-code=\"H1696\">said</span> in my <span class=\"wl wl-kjv\" data-code=\"H3820\">heart,</span> that this also is vanity.","16":"For there is no <span class=\"wl wl-kjv\" data-code=\"H2146\">remembrance</span> of the <span class=\"wl wl-kjv\" data-code=\"H2450\">wise</span> more <span class=\"wl wl-kjv\" data-code=\"H5973\">than</span> of the <span class=\"wl wl-kjv\" data-code=\"H3684\">fool</span> for <span class=\"wl wl-kjv\" data-code=\"H5769\">ever;</span> seeing that which <span class=\"wl wl-kjv\" data-code=\"H3528\">now</span> is in the <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> to <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> shall all be <span class=\"wl wl-kjv\" data-code=\"H7911\">forgotten.</span> And how <span class=\"wl wl-kjv\" data-code=\"H4191\">dieth</span> the <span class=\"wl wl-kjv\" data-code=\"H2450\">wise</span> man? as the fool.","17":"Therefore I <span class=\"wl wl-kjv\" data-code=\"H8130\">hated</span> <span class=\"wl wl-kjv\" data-code=\"H2416\">life;</span> because the <span class=\"wl wl-kjv\" data-code=\"H4639\">work</span> that is <span class=\"wl wl-kjv\" data-code=\"H6213\">wrought</span> under the <span class=\"wl wl-kjv\" data-code=\"H8121\">sun</span> is <span class=\"wl wl-kjv\" data-code=\"H7451\">grievous</span> unto me: for all is <span class=\"wl wl-kjv\" data-code=\"H1892\">vanity</span> and <span class=\"wl wl-kjv\" data-code=\"H7469\">vexation</span> of spirit.","18":"Yea, I <span class=\"wl wl-kjv\" data-code=\"H8130\">hated</span> all my <span class=\"wl wl-kjv\" data-code=\"H5999\">labour</span> which I had <span class=\"wl wl-kjv\" data-code=\"H6001\">taken</span> under the <span class=\"wl wl-kjv\" data-code=\"H8121\">sun:</span> because I should <span class=\"wl wl-kjv\" data-code=\"H3240\">leave</span> it unto the <span class=\"wl wl-kjv\" data-code=\"H120\">man</span> that shall be after","19":"And who <span class=\"wl wl-kjv\" data-code=\"H3045\">knoweth</span> whether he shall be a <span class=\"wl wl-kjv\" data-code=\"H2450\">wise</span> man or a <span class=\"wl wl-kjv\" data-code=\"H5530\">fool?</span> yet shall he have <span class=\"wl wl-kjv\" data-code=\"H7980\">rule</span> over all my <span class=\"wl wl-kjv\" data-code=\"H5999\">labour</span> wherein I have <span class=\"wl wl-kjv\" data-code=\"H5998\">laboured,</span> and wherein I have shewed myself <span class=\"wl wl-kjv\" data-code=\"H2449\">wise</span> under the <span class=\"wl wl-kjv\" data-code=\"H8121\">sun.</span> This is also vanity.","20":"Therefore I went <span class=\"wl wl-kjv\" data-code=\"H5437\">about</span> to <span class=\"wl wl-kjv\" data-code=\"H2976\">cause</span> my <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> to <span class=\"wl wl-kjv\" data-code=\"H2976\">despair</span> of all the <span class=\"wl wl-kjv\" data-code=\"H5999\">labour</span> which I <span class=\"wl wl-kjv\" data-code=\"H5998\">took</span> under the sun.","21":"For there <span class=\"wl wl-kjv\" data-code=\"H3426\">is</span> a <span class=\"wl wl-kjv\" data-code=\"H120\">man</span> whose <span class=\"wl wl-kjv\" data-code=\"H5999\">labour</span> is in <span class=\"wl wl-kjv\" data-code=\"H2451\">wisdom,</span> and in <span class=\"wl wl-kjv\" data-code=\"H1847\">knowledge,</span> and in <span class=\"wl wl-kjv\" data-code=\"H3788\">equity;</span> yet to a <span class=\"wl wl-kjv\" data-code=\"H120\">man</span> that hath not <span class=\"wl wl-kjv\" data-code=\"H5998\">laboured</span> therein shall he <span class=\"wl wl-kjv\" data-code=\"H5414\">leave</span> it for his <span class=\"wl wl-kjv\" data-code=\"H2506\">portion.</span> This also is <span class=\"wl wl-kjv\" data-code=\"H1892\">vanity</span> and a <span class=\"wl wl-kjv\" data-code=\"H7227\">great</span> evil.","22":"For what <span class=\"wl wl-kjv\" data-code=\"H1933\">hath</span> <span class=\"wl wl-kjv\" data-code=\"H120\">man</span> of all his <span class=\"wl wl-kjv\" data-code=\"H5999\">labour,</span> and of the <span class=\"wl wl-kjv\" data-code=\"H7475\">vexation</span> of his <span class=\"wl wl-kjv\" data-code=\"H3820\">heart,</span> <span class=\"wl wl-kjv\" data-code=\"H1931\">wherein</span> he hath <span class=\"wl wl-kjv\" data-code=\"H6001\">laboured</span> under the sun?","23":"For all his <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> are <span class=\"wl wl-kjv\" data-code=\"H4341\">sorrows,</span> and his <span class=\"wl wl-kjv\" data-code=\"H6045\">travail</span> <span class=\"wl wl-kjv\" data-code=\"H3708\">grief;</span> yea, his <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> taketh not <span class=\"wl wl-kjv\" data-code=\"H7901\">rest</span> in the <span class=\"wl wl-kjv\" data-code=\"H3915\">night.</span> This is also vanity.","24":"There is nothing <span class=\"wl wl-kjv\" data-code=\"H2896\">better</span> for a <span class=\"wl wl-kjv\" data-code=\"H120\">man,</span> than that he should <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> and <span class=\"wl wl-kjv\" data-code=\"H8354\">drink,</span> and that he should make his <span class=\"wl wl-kjv\" data-code=\"H5315\">soul</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">enjoy</span> <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> in his <span class=\"wl wl-kjv\" data-code=\"H5999\">labour.</span> <span class=\"wl wl-kjv\" data-code=\"H2090\">This</span> also I <span class=\"wl wl-kjv\" data-code=\"H7200\">saw,</span> that it was from the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of God.","25":"For who can <span class=\"wl wl-kjv\" data-code=\"H398\">eat,</span> or who else can <span class=\"wl wl-kjv\" data-code=\"H2363\">hasten</span> hereunto, more","26":"For God <span class=\"wl wl-kjv\" data-code=\"H5414\">giveth</span> to a <span class=\"wl wl-kjv\" data-code=\"H120\">man</span> that is <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> in his <span class=\"wl wl-kjv\" data-code=\"H6440\">sight</span> <span class=\"wl wl-kjv\" data-code=\"H2451\">wisdom,</span> and <span class=\"wl wl-kjv\" data-code=\"H1847\">knowledge,</span> and <span class=\"wl wl-kjv\" data-code=\"H8057\">joy:</span> but to the <span class=\"wl wl-kjv\" data-code=\"H2398\">sinner</span> he <span class=\"wl wl-kjv\" data-code=\"H5414\">giveth</span> <span class=\"wl wl-kjv\" data-code=\"H6045\">travail,</span> to <span class=\"wl wl-kjv\" data-code=\"H622\">gather</span> and to heap <span class=\"wl wl-kjv\" data-code=\"H3664\">up,</span> that he may <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> to him that is <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God.</span> This also is <span class=\"wl wl-kjv\" data-code=\"H1892\">vanity</span> and <span class=\"wl wl-kjv\" data-code=\"H7469\">vexation</span> of spirit."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"Nu, welaan,","tekst":"Hebr. ga nu."},{"catchword":"ik zal u beproeven","tekst":"Hier spreekt Salomo zijn eigen hart aan, alsof hij zeide: Ik wil eens beproeven of de wellusten en wereldse genoegens het ware en het hoogste goed zijn, dat degenen die daarin baden, een recht vergenoegen des geestes en rechte gelukzaligheid zou kunnen aanbrengen."},{"catchword":"zie het goede aan","tekst":"Hebr. zie in het goede; dat is, verzadig u met het goede; dat hier te zeggen is, met lichamelijke geneugten."},{"catchword":"ook dat was ijdelheid","tekst":"Te weten, alzo wel, als hetgeen dat tevoren in Ecc 1 verhaald is, namelijk de onderzoeking van wereldse dingen."}],"2":[{"catchword":"Tot het lachen","tekst":"Versta dit alzo, dat het veel en onmatiglijk lachen en springen meer een gekke en onwijze, dan een wijze en verstandige man betaamt, Pro 20:1 . Maar om zekere oorzaken somtijds matiglijk lachen is niet te berispen."},{"catchword":"vreugde","tekst":"Versta hier, vleselijke of wereldse vreugde."},{"catchword":"Wat maakt deze?","tekst":"Of, waarom doet gij dit? De zin is, wat voordeel brengt deze wereldse vreugde mede? Immers deugt en dient zij niet om de ware gelukzaligheid te erlangen."}],"3":[{"catchword":"in mijn hart","tekst":"Dat is, bij mijzelven."},{"catchword":"nagespeurd,","tekst":"Of, onderzocht, of gezocht, of beraadslaagd."},{"catchword":"mijn vlees","tekst":"Dat is, mijn lichaam. De zin is: Ik heb mij benaarstigd om tegelijk in lichamelijke geneugten en in wijsheid te leven, voegende alzo de wijsheid en de geneugte tezamen; want men moet hier onder den naam van wijn verstaan allerlei lekkere spijs en drank. ja allerlei wellusten."},{"catchword":"op te houden in den wijn","tekst":"Of, te trekken tot den wijn, dat is, tot den wijn gewennen. Anders: mijn vlees den wijn over te geven."},{"catchword":"nochtans leidende mijn hart in wijsheid","tekst":"Hij wil zeggen: ik heb voorgenomen de wijsheid die mij God gegeven heeft, alzo in mijn hart te bewaren, dat ik nochtans uiterlijk de dwaasheid te weten, met lekkerlijk te eten en te drinken, en met wellusten te plegen ook plaats geven wilde, die grijpende en vasthoudende."}],"4":[{"catchword":"Ik maakte mij","tekst":"Hebr. ik maakte mijne werken groot; te weten, niet alleen ter nooddruft, maar ook tot ene betoning van mijne heerlijkheid en tot geneugte."},{"catchword":"werken,","tekst":"Dat is, gebouwen, gelijk straks volgt, en ook vs.5,6."},{"catchword":"wijngaarden","tekst":"Te weten, in Baal-Hamon; Son 8:11 ."}],"5":[{"catchword":"hoven","tekst":"Te weten, waar allerlei kruiden en bloemen in wiessen."},{"catchword":"lusthoven,","tekst":"Hebr. pardesim; dat is, paradijzen. Hetwelk betekent niet alleen gemene hoven van plezier, voornamelijk boomgaarden."},{"catchword":"allerlei vrucht","tekst":"Hebr. alle."}],"6":[{"catchword":"vijvers","tekst":"Versta, zodanige vijvers, in welke steeds water was, zo regenwater als opwellend water."}],"7":[{"catchword":"Ik kreeg knechten en maagden","tekst":"Of, ik bezat, of veroverde."},{"catchword":"kinderen des huizes","tekst":"Dat is, kinderen binnenshuis geboren, te weten van mijne knechten en maagden. Verg. Gen 12:5 , en Gen 14:14 , en Gen 15:3 , en Gen 17:12 ."},{"catchword":"runderen en schapen","tekst":"Onder deze soorten worden ook andere beesten verstaan, zo grote als kleine."}],"8":[{"catchword":"Ik vergaderde","tekst":"Zie 1Ki 9:28 , en 1Ki 10:14 , 1Ki 10:21-22 , 1Ki 10:26 ."},{"catchword":"der koningen","tekst":"Dat is, die men bij enige koningen of in vreemde landschappen kon vinden. Of, hetgeen bij de koningen en in iedere provincie voor het kostelijkste gehouden werd."},{"catchword":"ik bestelde","tekst":"Hebr. ik maakte."},{"catchword":"snarenspel, ja,","tekst":"Of, muzikaal akkoord of verscheidene melodieen van muziekinstrumenten, of karossen, of uitgelezen zeer schone vrouwen, in den krijg gevangen; te weten, om mij te dienen in alle dingen, waartoe de vrouwen bekwaam zijn. Het Hebreeuwse woord wordt nergens anders gevonden dan hier, daarom wordt het zo verscheidenlijk overgezet."}],"9":[{"catchword":"bleef","tekst":"Hebr. stond; dat is bestond, of bleef bestendig bij mij. De zin is: Ofschoon ik al die bovenverhaalde rijkdommen en heerschappijen had, nochtans liet ik daarom de wijsheid niet varen, maar ik volhardde evenwel in mijn wijze regering. Vergelijk boven vs.3."},{"catchword":"mijn wijsheid","tekst":"Dat is de wijsheid met welke mij God boven alle anderen begaafd had."}],"10":[{"catchword":"vanwege al mijn arbeid","tekst":"Dat is, vanwege de goederen, die ik met mijn arbeid teweeggebracht had."},{"catchword":"dit was mijn deel","tekst":"Dat is, al wat ik genoten heb voor al mijne moeite, is geweest een vergankelijke en haast voorbijgaande vreugde. Zie onder Ecc 5:17 ."}],"11":[{"catchword":"kwelling des geestes,","tekst":"Zie boven Ecc 1:14 ."},{"catchword":"onder de zon","tekst":"Dat is, in enige zichtbare en vergankelijke dingen."}],"12":[{"catchword":"Daarna wendde ik mij,","tekst":"Dat is, ik begaf mij tot overlegging van de wijsheid en de dwaasheid, die ik beide beproefd had, om te oordelen bij mijzelven bij welke de uitnemendheid was."},{"catchword":"om te zien","tekst":"Dat is, om terdege te merken op de wijsheid."},{"catchword":"hoe zou een mens,","tekst":"Anders: want wat zou de mens doen, die na de koning komen zal? Even hetzelfde, dat alrede gedaan is. De zin is: Zo er iemand is, die meent dat ik, die zo een machtig en wijs koning ben, alles niet wel verstaan noch ervaren heb, en dat er overzulks enig ander middel zou mogen zijn om tot de gelukzaligheid te komen, die dwaalt grovelijk, hij zal niet anders vinden dan hetgeen ik daarvan verklaar, een ieder mag zich hierin op mijn woord wel verlaten."},{"catchword":"den koning","tekst":"Dat is, mij. Hij wil zeggen: die zou kunnen doen wat ik, die een machtig koning ben, gedaan heb?"}],"13":[{"catchword":"Toen zag ik,","tekst":"De zin is: Ofschoon al ons bedrijf ijdelheid is, nochtans is de wijsheid zoveel te meer dan de dwaasheid te achten als het licht boven de duisternis."}],"14":[{"catchword":"De ogen","tekst":"Dat is, de wijze is welbedacht, en hij gaat voorzichtig in al zijn handel; maar een dwaas mens is onbedachtzaam en onvoorzichtig in al hetgeen hij te doen heeft. Zie onder Ecc 8:1 , en Pro 17:24 ."},{"catchword":"wandelt","tekst":"Dat is, hij weet niet hoe hij zijne zaken zal aanstellen."},{"catchword":"dat enerlei","tekst":"Te weten, zoveel aangaat hetgeen dat hun overkomt in dit tegenwoordige leven, gelijk daar zijn verscheidene ellendigheden, krankheden en smarten des lichaams, alsook de dood zelf. Verg. hiermede Psa 49:11 ."},{"catchword":"hun allen bejegent","tekst":"Dat is, hun beiden, zowel den wijzen als den dwazen."}],"15":[{"catchword":"Dies zeide ik","tekst":"Te weten, oordelende naar de gelegenheid der zaken, die men dagelijks voor ogen ziet gebeuren."},{"catchword":"zal het ook mijzelven","tekst":"Dat is, ik ben zowel allerlei ellenden onderworpen en ik zal zowel sterven, als de dwaas, ja gelijk alle andere mensen."},{"catchword":"waarom heb ik","tekst":"Dat is, waarom heb ik mij dan meer bevlijtigd om wijsheid te verkrijgen dan andere? Of, waarom zou ik dan meer naar wijsheid staan? Alsog hij zeide: Dewijl de dood mij zowel overkomen zal als alle anderen, waartoe zal mij de menselijke wijsheid bevorderlijk zijn?"}],"16":[{"catchword":"Want","tekst":"Hebr. daar is gene gedachtenis van den wijze met den dwaze in eeuwigheid. Dit dient tot bevestiging van hetgeen straks gezegd is. De zin is: Gelijk alle mensen sterflijk zijn, zo vergaat mettertijd de gedachtenis van den een zowel als van den ander in het algemeen. Hoewel de gedachtenis dergenen, welker namen en daden in Gods Woord en geschiedenissen gedacht worden, bij velen overblijft."},{"catchword":"hoe sterft","tekst":"Ene vraag met verwondering. Alsof hij zeide: Het is een droevige zaak, dat een voorteffelijk wijs man zowel en zo haast sterven moet, en dikwijls, naar het oordeel der wereld, gelijke uitkomst heeft als een zot. Anders: En hoe de wijze sterft met den zot."},{"catchword":"met den zot?","tekst":"Dat is, zowel als de zot. Zie Psa 49:11-12 ."}],"17":[{"catchword":"haatte ik dit leven","tekst":"Dat is, het verdroot mij te leven."},{"catchword":"dacht mij kwaad,","tekst":"Hebr. was kwaad in, bij, of over mij."},{"catchword":"dat onder de zon","tekst":"Dat is, al de werken en handteringen der mensen."}],"18":[{"catchword":"Ik haatte ook al","tekst":"Dat is, ik heb er een weerzin in gehad, te weten, lettende op de ijdelheid der rijkdommen en de vergadering der dingen, die men met zo grote moeite verkrijgt, en inzonderheid ten aanzien van de onzekerheid welken erfgenaam men hebben zal."},{"catchword":"mijn arbeid,","tekst":"Dat is, mijn goed, dat ik met mijn arbeid verkregen en samengebracht had."},{"catchword":"die na mij wezen zal","tekst":"Dat is, die mij in het rijk zal navolgen."}],"19":[{"catchword":"wie weet,","tekst":"Rehabeam, de zoon en opvolger van Salomo, heeft door zijne dwaasheid en onvoorzichtigheid het grootste deel van zijn koninkrijk verloren; 1Ki 12 . Men kan enigermate uit dit vers afnemen dat Salomo wel gewerkt heeft, dat zich Rehabeam niet wel zou aanstellen in de regering van het rijk."},{"catchword":"over al mijn arbeid,","tekst":"Dat is, over al de goederen en voortreffelijke grote dingen, die ik met veel moeite verworven en vergaderd heb."}],"20":[{"catchword":"keerde ik mij om,","tekst":"Alsof hij zeide: Ik ben in deze mijne gedachten eindelijk daartoe gekomen, dat ik in het minst geen genoegen heb aan al hetgeen ik door mijn arbeid verworven had. Zie vs.18."}],"21":[{"catchword":"er is een mens,","tekst":"De zin is: Het is geen wonder dat mij dit verdriet, aangezien er niemand zo klein van middelen is, of het zou hem wel verdrieten dat zijne goederen in vreemde handen zouden vervallen."},{"catchword":"die overgeven","tekst":"Te weten, arbeid, dat is, al het goed, dat hij met zijnen arbeid vergaderd en gewonnen heeft."},{"catchword":"kwaad","tekst":"Dat is verdriet, of kwelling, gelijk Mat 6:34 ."}],"22":[{"catchword":"mens","tekst":"Te weten van wien vs.21 gesproken is."}],"23":[{"catchword":"zijn smarten,","tekst":"Dat is, vol droefenis en zwarigheid, Zie Job 14:1 , de aantekening."}],"24":[{"catchword":"Is het dan","tekst":"Anders: daar is dan niet beter voor den mens dan dat hij ete en drinke, enz. Anders: het is niet goed voor den mens dat hij eet en drinkt; dat is, dat hij in eten en drinken al zijn lust en genoegen neemt."},{"catchword":"niet goed","tekst":"Te weten, zoveel het tijdelijke goed en dit vergankelijke leven aangaat."},{"catchword":"dat hij ete","tekst":"De zin is dat hij, alle onnutte zorg en bekommernis bezijden stellende, geniete en gebruikte hetgeen hem God gegeven heeft."},{"catchword":"zijn ziel","tekst":"Dat is, zichzelven."},{"catchword":"het goede doe","tekst":"Hebr. het goede doe zien; dat is, welvare, wat goeds geniete van zijnen arbeid?"},{"catchword":"in zijn arbeid?","tekst":"Of van zijnen arbeid; dat is van zijne goederen."},{"catchword":"dat zulks","tekst":"Dat is dat het een bijzondere gave Gods is, die alle man niet heeft; te weten dat men zich late genoegen en zich vrolijk make met hetgeen men van de milde hand Gods ontvangen heeft."}],"25":[{"catchword":"wie zou er van eten,","tekst":"Alsof hij zeide: Indien er enig ander beter genot uit die tijdelijke dingen te halen ware, wie zou dat lichter en beter kunnen doen dan ik?"},{"catchword":"daartoe","tekst":"Te weten daarvan te nemen, namelijk met vrolijkheid."}],"26":[{"catchword":"Hij geeft wijsheid,","tekst":"Te weten, God."},{"catchword":"goed is voor","tekst":"Dat is, die vroom en godzalig is."},{"catchword":"den zondaar","tekst":"Dat is, den goddeloze, aan wien Hij geen welgevallen heeft. Zie Psa 1:1 , van het woord zondaar."},{"catchword":"te verzamelen","tekst":"Te weten, tijdelijke goederen en rijkdommen."},{"catchword":"voor Gods aangezicht","tekst":"Dat is, voor zijn aangezicht."},{"catchword":"Dit is ook ijdelheid","tekst":"Te weten, zozeer zich te bekommeren om rijkdom te vergaderen, dien gij zelf niet moogt genieten, ook niet nalaten wien gij wilt, en vermoedt dat hij wel zal weten te gebruiken."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"I said in me heart, Go to now, [Heb. Go now] I will prove thee with joy, therefore look on the thing that is good: [Heb. Look into the thing that is good, that is, satisfie thy self with the thing that is good, which in this place is as much as, satisfie thy self with bodily delights, compare Luk 12:19. Here Solomon speaketh to his own heart, as if he had said, I will once try, whether pleasures or worldly delights be true and highest; whether they are able to bring true contentment of mind, and true real happiness, unto those that battle themselves in them] but behold, that also was vanity. [to wit, as well as that which was related before, chap. 1. Namely, the searching out of worldly things.]"}],"2":[{"catchword":null,"tekst":"I said unto laughter, Thou art mad; and unto mirth, [Meaning, carnal and worldly mirth] what maketh this? The meaning is, what benefit or advantage doth this worldly mirth bring? However it is not profitable, or available to teach true happiness. Understand this thus, that much and immoderate laughing, singing, skipping or dancing, is more seemly, for a fool and a frantic person, then for a wise and understanding man, Pro 20:1. but to laugh moderately at sometimes, and for some causes, is a thing not to be reproved.]"}],"3":[{"catchword":null,"tekst":"i inquired [Or, searched, or sought, or advised] in mine heart, [that is, with my self] to sustain my flesh [that is, my body] in wine, [or to draw wine, that is, to accustom and inure my self to drink wine. Oth. To give my flesh over unto wine] (yet leading mine heart in wisdom) and to retain folly, [as if he should say, I have purposed so to keep the wisdom (which God hath given me) in my heart, as that notwithstanding I was also minded to give way into folly , (to wit, by feeding deliciously, and by living in pleasures and delights]laying thereon, and retaining it. The meaning is, I have striven and endeavoured to live both in bodily pleasures and delights, and also in wisdom, uniting both wisdom and pleasure together; for under the name of wine, all kind of dainty, food, meat, and drink, yea, all manner of pleasures and delights must be understood] till i should see what would be best for the children of men, which they should do under the heaven, (during the number of the daises of their life.]"}],"4":[{"catchword":null,"tekst":"I made great works, [That is, structures, buildings, as immediately followeth, and also verse 5,6. Heb. I made my works great; to wit, not onely for necessity, but also to shew my glory, and for delight] I builded my houses, I planted my vineyards. [to wit, in Baal, Hamon, Cant. 8.11.]"}],"5":[{"catchword":null,"tekst":"I made me gardens, [To wit, wherein all sorts of herbs and flowers grew] and gardens of pleasure, [Heb. Pardesim; that is, paradises, which signifieth not ordinary common gardens, but gardens of pleasure and delights, especially Orchards] and I planted trees in them, of all kinds of [Heb. Of all] fruit."}],"6":[{"catchword":null,"tekst":"I made me pools of waters, [Understand such kind of pools, wherein there was always water, both raining water and spring water] to water therewith wood that flourished with trees."}],"7":[{"catchword":null,"tekst":"I got [Or, I possessed, or gained, recovered] servants and maidens, and I had children of (my) house: [that is, children born in my house; to with, of my servants and maidens, compare, Gen. 12.5. and Gen. 14.14. and 15.3. and 17.2.] also I had a great possession of oxen and sheep, [under these kinds are also other beasts understood, both great and small] more than all that had been at Jerusalem before me."}],"8":[{"catchword":null,"tekst":"I gather me also the silver and gold [See 1 Kings 9.28. and 10.14,21,22,26.] and the jewels of the Kings, and of the Provinces: [that is, which might be found with some Kings, and in strange P function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);

  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;

  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }

}

      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
