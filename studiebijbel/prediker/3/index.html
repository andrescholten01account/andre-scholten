ensen gegeven heeft, om zichzelf daarmee te bekommeren.","11":"Hij heeft ieder ding mooi gemaakt op zijn tijd; ook heeft Hij de eeuw in hun hart gelegd, zonder dat een mens het werk, dat God gemaakt heeft, kan doorgronden, van het begin tot het einde toe.","12":"Ik heb gemerkt, dat er niets beters voor hen is, dan zich te verblijden, en goed te doen in zijn leven.","13":"Ja ook, dat ieder mens eet en drinkt, en het goede geniet van al zijn arbeid, *dit* is een gave van God.","14":"Ik weet, dat al wat God doet, dat zal in eeuwigheid zijn, en er is niets aan toe te doen, en er is niets van af te doen; en God doet *dat*, opdat men vreest voor Zijn aangezicht.","15":"Wat geweest is, dat is nu, en wat wezen zal, dat is al geweest; en God zoekt het weggedrevene op.","16":"Verder heb ik ook gezien onder de zon, op de plaats van het gericht, daar was goddeloosheid; en op de plaats van de gerechtigheid, daar was goddeloosheid.","17":"Ik zei in mijn hart: God zal de rechtvaardige en de goddeloze oordelen; want daar is de tijd voor alle voornemen, en over alle werk.","18":"Ik zei in mijn hart over de toestand van de mensenkinderen, dat God hen zal aantonen, en dat zij zullen zien, dat zij *als* de dieren zijn aan zichzelf.","19":"Want wat de kinderen van de mensen overkomt, dat overkomt ook de dieren; en hetzelfde overkomt hun *beiden*; zoals die sterft, zo sterft deze, en zij hebben allen dezelfde adem, en de meerderheid van de mensen boven de dieren is er niet; want allen zijn zij vluchtigheid.","20":"Zij gaan allen naar één plaats; zij zijn allen uit het stof, en zij keren allen terug tot het stof.","21":"Wie merkt, dat de adem van de kinderen van de mensen opvaart naar boven, en de adem van de dieren naar beneden vaart in de aarde?","22":"Daarom heb ik gezien, dat er niets beters is, dan dat de mens zich verblijdt in zijn werken, want dat is zijn deel; want wie zal hem daarheen brengen, dat hij ziet, wat na hem gebeuren zal?"},"SV":{"1":"Alles heeft een bestemden tijd, en alle voornemen onder den hemel heeft zijn tijd.","2":"Er is een tijd om geboren te worden, en een tijd om te sterven; een tijd om te planten, en een tijd om het geplante uit te roeien;","3":"Een tijd om te doden, en een tijd om te genezen; een tijd om af te breken, en een tijd om te bouwen;","4":"Een tijd om te wenen, en een tijd om te lachen; een tijd om te kermen, en een tijd om op te springen;","5":"Een tijd om stenen weg te werpen, en een tijd om stenen te vergaderen; een tijd om te omhelzen, en een tijd om verre te zijn van omhelzen;","6":"Een tijd om te zoeken, en een tijd om verloren te laten gaan; een tijd om te bewaren, en een tijd om weg te werpen;","7":"Een tijd om te scheuren, en een tijd om toe te naaien; een tijd om te zwijgen, en een tijd om te spreken;","8":"Een tijd om lief te hebben, en een tijd om te haten; een tijd van oorlog, en een tijd van vrede.","9":"Wat voordeel heeft hij, die werkt, van hetgeen hij bearbeidt?","10":"Ik heb gezien de bezigheid, die God den kinderen der mensen gegeven heeft, om zichzelven daarmede te bekommeren.","11":"Hij heeft ieder ding schoon gemaakt op zijn tijd; ook heeft Hij de eeuw in hun hart gelegd, zonder dat een mens het werk, dat God gemaakt heeft, kan uitvinden, van het begin tot het einde toe.","12":"Ik heb gemerkt, dat er niets beters voor henlieden is, dan zich te verblijden, en goed te doen in zijn leven.","13":"Ja ook, dat ieder mens ete en drinke, en het goede geniete van al zijn arbeid, *Dit* is een gave Gods.","14":"Ik weet, dat al wat God doet, dat zal in der eeuwigheid zijn, en er is niet toe te doen, noch is er af te doen; en God doet *dat*, opdat men vreze voor Zijn aangezicht.","15":"Hetgeen geweest is, dat is nu, en wat wezen zal, dat is alrede geweest; en God zoekt het weggedrevene;","16":"Verder heb ik ook gezien onder de zon, ter plaatse des gerichts, aldaar was goddeloosheid; en ter plaatse der gerechtigheid, aldaar was goddeloosheid.","17":"Ik zeide in mijn hart: God zal den rechtvaardige en den goddeloze oordelen; want aldaar is de tijd voor alle voornemen, en over alle werk.","18":"Ik zeide in mijn hart van de gelegenheid der mensenkinderen, dat God hen zal verklaren, en dat zij zullen zien, dat zij *als* de beesten zijn aan zichzelven.","19":"Want wat den kinderen der mensen wedervaart, dat wedervaart ook den beesten; en enerlei wedervaart hun *beiden*; gelijk die sterft, alzo sterft deze, en zij allen hebben enerlei adem, en de uitnemendheid der mensen boven de beesten is geen; want allen zijn zij ijdelheid.","20":"Zij gaan allen naar een plaats; zij zijn allen uit het stof, en zij keren allen weder tot het stof.","21":"Wie merkt, dat de adem van de kinderen der mensen opvaart naar boven, en de adem der beesten nederwaarts vaart in de aarde?","22":"Dies heb ik gezien, dat er niets beters is, dan dat de mens zich verblijde in zijn werken, want dat is zijn deel; want wie zal hem daarhenen brengen, dat hij ziet, hetgeen na hem geschieden zal?"},"KJV":{"1":"To every *thing there is* a season, and a time to every purpose under the heaven:","2":"A time to be born, and a time to die; a time to plant, and a time to pluck up *that which is* planted;","3":"A time to kill, and a time to heal; a time to break down, and a time to build up;","4":"A time to weep, and a time to laugh; a time to mourn, and a time to dance;","5":"A time to cast away stones, and a time to gather stones together; a time to embrace, and a time to refrain from embracing;","6":"A time to get, and a time to lose; a time to keep, and a time to cast away;","7":"A time to rend, and a time to sew; a time to keep silence, and a time to speak;","8":"A time to love, and a time to hate; a time of war, and a time of peace.","9":"What profit hath he that worketh in that wherein he laboureth?","10":"I have seen the travail, which God hath given to the sons of men to be exercised","11":"He hath made every *thing* beautiful in his time: also he hath set the world in their heart, so that no man can find out the work that God maketh from the beginning to the end.","12":"I know that *there is* no good in them, but for *a man* to rejoice, and to do good in his life.","13":"And also that every man should eat and drink, and enjoy the good of all his labour, it *is* the gift of God.","14":"I know that, whatsoever God doeth, it shall be for ever: nothing can be put to it, nor any thing taken from it: and God doeth *it*, that *men* should fear before","15":"That which hath been is now; and that which is to be hath already been; and God requireth that which is past.","16":"And moreover I saw under the sun the place of judgment, *that* wickedness *was* there; and the place of righteousness, *that* iniquity","17":"I said in mine heart, God shall judge the righteous and the wicked: for *there is* a time there for every purpose and for every work.","18":"I said in mine heart concerning the estate of the sons of men, that God might manifest them, and that they might see that they themselves are beasts.","19":"For that which befalleth the sons of men befalleth beasts; even one thing befalleth them: as the one dieth, so dieth the other; yea, they have all one breath; so that a man hath no preeminence above a beast: for all *is* vanity.","20":"All go unto one place; all are of the dust, and all turn to dust again.","21":"Who knoweth the spirit of man that goeth upward, and the spirit of the beast that goeth downward to the earth?","22":"Wherefore I perceive that *there is* nothing better, than that a man should rejoice in his own works; for that *is* his portion: for who shall bring him to see what shall be after"}},"tsk":{"1":[{"kopje":"alles","refs":["Pred 3:17","Pred 7:14","Pred 8:5","Pred 8:6","2 Kon 5:26","2 Kron 33:12","Spr 15:23","Matt 16:3"]},{"kopje":"onder","refs":["Pred 1:13","Pred 2:3","Pred 2:17"]}],"2":[{"kopje":"tijd om geboren te worden","refs":["Gen 17:21","Gen 21:1","Gen 21:2","1 Sam 2:5","1 Kon 13:2","2 Kon 4:16","Ps 113:9","Jes 54:1","Luk 1:13","Luk 1:20","Luk s life.","13":"And also that every <span class=\"wl wl-kjv\" data-code=\"H120\">man</span> should <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> and <span class=\"wl wl-kjv\" data-code=\"H8354\">drink,</span> and <span class=\"wl wl-kjv\" data-code=\"H7200\">enjoy</span> the <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> of all his <span class=\"wl wl-kjv\" data-code=\"H5999\">labour,</span> it is the <span class=\"wl wl-kjv\" data-code=\"H4991\">gift</span> of God.","14":"I <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> that, whatsoever <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">doeth,</span> it shall be for <span class=\"wl wl-kjv\" data-code=\"H5769\">ever:</span> <span class=\"wl wl-kjv\" data-code=\"H369\">nothing</span> can be <span class=\"wl wl-kjv\" data-code=\"H3254\">put</span> to it, nor any thing <span class=\"wl wl-kjv\" data-code=\"H1639\">taken</span> from it: and <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">doeth</span> it, that men should <span class=\"wl wl-kjv\" data-code=\"H3372\">fear</span> before","15":"That which hath been is <span class=\"wl wl-kjv\" data-code=\"H3528\">now;</span> and that which is to be hath <span class=\"wl wl-kjv\" data-code=\"H3528\">already</span> been; and <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H1245\">requireth</span> that which is past.","16":"And moreover I <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> under the <span class=\"wl wl-kjv\" data-code=\"H8121\">sun</span> the <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> of <span class=\"wl wl-kjv\" data-code=\"H4941\">judgment,</span> that <span class=\"wl wl-kjv\" data-code=\"H7562\">wickedness</span> was there; and the <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> of <span class=\"wl wl-kjv\" data-code=\"H6664\">righteousness,</span> that iniquity","17":"I <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> in mine <span class=\"wl wl-kjv\" data-code=\"H3820\">heart,</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> shall <span class=\"wl wl-kjv\" data-code=\"H8199\">judge</span> the <span class=\"wl wl-kjv\" data-code=\"H6662\">righteous</span> and the <span class=\"wl wl-kjv\" data-code=\"H7563\">wicked:</span> for there is a <span class=\"wl wl-kjv\" data-code=\"H6256\">time</span> there for every <span class=\"wl wl-kjv\" data-code=\"H2656\">purpose</span> and for every work.","18":"I <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> in mine <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> concerning the <span class=\"wl wl-kjv\" data-code=\"H1700\">estate</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H120\">men,</span> that <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> might <span class=\"wl wl-kjv\" data-code=\"H1305\">manifest</span> them, and that they might <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> that <span class=\"wl wl-kjv\" data-code=\"H1992\">they</span> themselves are beasts.","19":"For that which <span class=\"wl wl-kjv\" data-code=\"H4745\">befalleth</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H120\">men</span> <span class=\"wl wl-kjv\" data-code=\"H4745\">befalleth</span> <span class=\"wl wl-kjv\" data-code=\"H929\">beasts;</span> even one <span class=\"wl wl-kjv\" data-code=\"H259\">thing</span> <span class=\"wl wl-kjv\" data-code=\"H4745\">befalleth</span> them: as the one <span class=\"wl wl-kjv\" data-code=\"H4194\">dieth,</span> so <span class=\"wl wl-kjv\" data-code=\"H4194\">dieth</span> the <span class=\"wl wl-kjv\" data-code=\"H2088\">other;</span> yea, they have all <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H7307\">breath;</span> so that a <span class=\"wl wl-kjv\" data-code=\"H120\">man</span> hath no <span class=\"wl wl-kjv\" data-code=\"H4195\">preeminence</span> above a <span class=\"wl wl-kjv\" data-code=\"H929\">beast:</span> for all is vanity.","20":"All <span class=\"wl wl-kjv\" data-code=\"H1980\">go</span> unto <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H4725\">place;</span> all are of the <span class=\"wl wl-kjv\" data-code=\"H6083\">dust,</span> and all <span class=\"wl wl-kjv\" data-code=\"H7725\">turn</span> to <span class=\"wl wl-kjv\" data-code=\"H6083\">dust</span> again.","21":"Who <span class=\"wl wl-kjv\" data-code=\"H3045\">knoweth</span> the <span class=\"wl wl-kjv\" data-code=\"H7307\">spirit</span> of <span class=\"wl wl-kjv\" data-code=\"H1121\">man</span> that <span class=\"wl wl-kjv\" data-code=\"H5927\">goeth</span> <span class=\"wl wl-kjv\" data-code=\"H4605\">upward,</span> and the <span class=\"wl wl-kjv\" data-code=\"H7307\">spirit</span> of the <span class=\"wl wl-kjv\" data-code=\"H929\">beast</span> that <span class=\"wl wl-kjv\" data-code=\"H3381\">goeth</span> <span class=\"wl wl-kjv\" data-code=\"H4295\">downward</span> to the earth?","22":"Wherefore I <span class=\"wl wl-kjv\" data-code=\"H7200\">perceive</span> that there is nothing <span class=\"wl wl-kjv\" data-code=\"H2896\">better,</span> than that a <span class=\"wl wl-kjv\" data-code=\"H120\">man</span> should <span class=\"wl wl-kjv\" data-code=\"H8055\">rejoice</span> in his own <span class=\"wl wl-kjv\" data-code=\"H4639\">works;</span> for that is his <span class=\"wl wl-kjv\" data-code=\"H2506\">portion:</span> for who shall <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> him to <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> what shall be after"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"heeft een bestemden tijd,","tekst":"Dat is, alle zaken en handelingen dezer wereld zijn veranderlijk en aan verscheidene verwisselingen over en weder onderworpen, die God alleen regeert en die van geen mens vervroegd of verhaast kunnen worden. Uit deze veranderlijkheid blijkt klaarlijk dat men in dit wankelbare leven de ware gelukzaligheid niet zoeken moet."},{"catchword":"voornemen","tekst":"Hebr, behagen, of wil, begeerte, te weten der mensen. Zie Psa 27:12 ."}],"3":[{"catchword":"om te doden,","tekst":"Hetzij door den wil of beschikking Gods. Exo 21:13 , of bij last of bevel der overheid. Anders: om te kwetsen."},{"catchword":"te genezen;","tekst":"Te weten, den gekwetste."},{"catchword":"af te breken,","tekst":"Hebr. in te breken, of te scheuren."}],"4":[{"catchword":"om te lachen;","tekst":"Zie boven Ecc 2:2 ."},{"catchword":"om te kermen,","tekst":"Of, om misbaar te maken, of om leed te dragen."},{"catchword":"om op te springen;","tekst":"Of, om te huppelen, te weten van vreugde en van blijdschap. Zie 1Ch 15:29 , en Act 3:8 ."}],"5":[{"catchword":"om stenen weg te werpen,","tekst":"Te weten, gelijk men den hof of akker zuivert, of een huis afbreekt."},{"catchword":"tijd om stenen te vergaderen;","tekst":"Te weten, als men een huis of ander gebouw maken wil."}],"6":[{"catchword":"om te zoeken,","tekst":"Om te bezorgen, of te behouden. Anders: om te zoeken; te weten, wijsheid of rijkdom, of iets dat men verloren heeft. Versta hierbij, en om te vinden, GELIJK Isa 65:1 ."},{"catchword":"verloren te laten gaan;","tekst":"Anders: om te verliezen; te weten, ten tijde als men daardoor zou komen in gevaar der ziel of des levens."},{"catchword":"weg te werpen;","tekst":"Als bijvoorbeeld, wanneer men is in gevaar van schipbreuk op de zee; Jon 1:5 ; Act 27:18-19 ."}],"7":[{"catchword":"om te scheuren,","tekst":"Te weten, de klederen, gelijk bij de Joden zeer gebruikelijk was, om te betonen de bedroefdheid des harten."}],"9":[{"catchword":"Wat voordeel","tekst":"De zin is, men doe wat men wil, men zal niets kunnen uitrichten."},{"catchword":"hetgeen hij arbeidt?","tekst":"Versta hierbij: Geen."}],"11":[{"catchword":"Hij heeft ieder ding","tekst":"Te weten, God; die maakte alle dingen alzo, dat het schoon en fraai is en alles ter bekwamer tijd geschiedt, alhoewel bij de mensen grote veranderingen vallen."},{"catchword":"schoon gemaakt","tekst":"Of, fijn, hups, fraai, welgemaakt."},{"catchword":"de eeuw","tekst":"Dat is, een natuurlijke genegenheid tot de onderzoeking der eeuwen en tijden en wat daarin geschied is. Anders: de eeuwigheid; dat is een genegenheid, strekkende tot onderzoeking van hetgeen eeuwig en oneindig is; of een genegenheid, strekkende tot de eeuwigheid."},{"catchword":"in hun hart","tekst":"Te weten, in het hart der mensen."},{"catchword":"kan uitvinden,","tekst":"Te weten, volkomenlijk en door ijn eigen vernuft en verstand."},{"catchword":"van het begin","tekst":"Hebr. van het hoofd tot het einde."}],"12":[{"catchword":"voor henlieden is,","tekst":"Te weten, de mensen. Of, in die, te weten, dingen."},{"catchword":"goed te doen","tekst":"Dat is, vroom en godzalig te leven. Zie onder Ecc 12:13 ."}],"13":[{"catchword":"ete en drinke,","tekst":"Te weten, met geneugte en vrolijkheid."},{"catchword":"geniete","tekst":"Hebr. zie."}],"14":[{"catchword":"zijn,","tekst":"Dat is, bestaan; dat is, het zal altijd geschieden gelijk Hij besloten en verordineerd heeft; want het besluit Gods is onveranderlijk. Kon het schepsel de minste verandering maken in hetgeen God doen wil; kon het schepsel den zegen verminderen of vermeerderen, het kruis verlichten of verzwaren; zo zouden de mensen het schepsel eren en vrezen en niet den Schepper; daarom heeft God alles wat Hij over ons wil brengen, of wat Hij van ons wil weren, hetzij goed of kwaad, alzo bepaald, dat de schepselen niet de minste verandering daarin maken kunnen, opdat wij ons alleen voor het aangezicht des Scheppers vrezen en in alle ootmoedigheid alleen aan zijne voorzienigheid hangen zouden."}],"15":[{"catchword":"God zoekt","tekst":"Versta hierbij , en Hij brengt weder tevoorschijn hetgeen gepasseerd of voorbij of vergaan is, vernieuwende door zijne almogendheid en voorzienige regering de soorten der gedierten en andere schepselen; Hij doet lente, zomer, herfst en winter, elk op hun seizoen wederkomen; desgelijks de bloemen, kruiden en vruchten, zo der bomen als des aardrijks; als er mensen en beesten sterven en vergaan, zo laat Hij anderen wederom in derzelver plaats geboren worden en opwassen, enz."}],"16":[{"catchword":"heb ik ook","tekst":"Te weten, een andere ijdelheid."},{"catchword":"ter plaatse","tekst":"Dat is, in het rechthuis, of de rechtbank, waar men het recht en de rechtsoefening behoorde te handhaven, daar ging het geheel tegenovergesteld toe."}],"17":[{"catchword":"den rechtvaardige","tekst":"Dat is, den onschuldige en den schuldige. De zin is: Als ik de ongerechtigheid aanzag, die onder de mensen regeerde om het uitspreken der oordelen, zo troostte ik mij hiermede, gedenke dat God, de opperste en rechtvaardigste Rechter, alle mensen te zijner tijd rechtvaardig zal oordelen, een ieder vergeldende naar zijne werken."},{"catchword":"want","tekst":"Anders, maar; alsof hij zeide: De goddelozen hebben een tijd alhier, maar God zal ook een tijd hebben aldaar."},{"catchword":"aldaar is de tijd","tekst":"Te weten waar God zijn rechterstoel ten jongsten dage zal oprichten, waar alle menselijke daden zullen geoordeeld worden."}],"18":[{"catchword":"van de positie","tekst":"Dat is aangaande of belangende het wezen, de gelegenheid, of staat. handel en wandel der mensen; te weten als ik hetzelve terdeeg aanzie en doorgrond."},{"catchword":"zal verklaren,","tekst":"Of klarigheid geven zal. Hij wil zeggen: Overmits de ijdelheden der mensen zo veel en zo groot zijn, en zulk een menigte en verscheidenheid van bekommeringen, waarin zij zich zo diep en met zulk behagen steken, alsof het met hen eeuwig werk wezen zou, zo heb ik mij laten voorstaan dat God hen klaarlijk en ogenschijnlijk wil te zien en te verstaan geven wat zij in zichzelven en naar de gelegenheid van deze benedenwereld zijn; te weten, als de beesten. Psa 49:13 , Psa 49:21 ."}],"19":[{"catchword":"enerlei wedervaart","tekst":"Te weten wanneer men op niets anders ziet, dan op hetgeen den mensen en den beesten uiterlijk wedervaart; want de mensen ademen, zij eten, drinken, slapen; zij zijn ook aan ziekten en pijnen, ja ook eindelijk den dood zelf onderworpen, niet anders dan de beesten. Maar anderszins is de voortreffelijkheid der mensen groot boven de beesten."},{"catchword":"die sterft,","tekst":"Te weten, beest."},{"catchword":"deze,","tekst":"Te weten, mens."},{"catchword":"zij allen","tekst":"Dat is, zij beiden; te weten zo de mensen als de beesten."},{"catchword":"enerlei adem,","tekst":"Versta hier door den adem den geest des levens."},{"catchword":"is geen;","tekst":"Te weten zoveel men aan het uiterlijke merken kan, of zoveel het sterven aangaat."},{"catchword":"allen zijn zij ijdelheid","tekst":"Te weten zo de mensen als de beesten. Anders: het is al ijdelheid."}],"20":[{"catchword":"naar een plaats;","tekst":"Te weten in de aarde. Dit is te verstaan van het lichaam, gelijk uit het volgende is blijkende. Hebr. een ieder, of alles gaat, enz."},{"catchword":"zij zijn allen uit het stof","tekst":"Zie Gen 1:24 en Gen 2:7 ."}],"21":[{"catchword":"de adem","tekst":"Dat is hier te zeggen de ziel, gelijk Luk 23:46 . De zin is; Wie kan dit merken of weten, uit de gemene uiterlijke toevallige gelegenheden dergenen, die sterven?"},{"catchword":"opvaart naar boven,","tekst":"En volgens dien in wezen blijft, nadat hij uit het lichaam gescheiden is. Zie hiervan breder onder Ecc 12:7 . Daar zegt Salomo duidelijk dat de ziel wederkeert tot God, die haar gegeven heeft. Zodat men Salomo niet kan toedichten dat hij hier wil leren dat de ziel sterflijk is."},{"catchword":"nederwaarts vaart","tekst":"Daar hij tenietgaat, niets meer zijnde, nadat hij uit het lichaam gevaren is."}],"22":[{"catchword":"in zijn werken,","tekst":"Dat is, met hetgeen hij met zijnen arbeid verdient."},{"catchword":"dat is zijn deel;","tekst":"Dat is, zijn aandeel dat hij genieten zal; Ecc 2:24 , en vs.12, en, Ecc 5:18 . Alsof hij zeide: De mens stervende zal niets met zich nemen; hij zal ook na zijnen dood niet weten wat hier op aarde omgaat. Daarom is het best dat hij zichzelf niet kwelle met onnutte zorg, hoe het na hem zal gaan, welken erfgenaam hij hebben zal, of hoe zij het met zijne goederen maken zullen; of hoe zij hun leven aanstellen zullen; maar dat hij met een gerust en vrolijk hart [in de vreze Gods] gebruike hetgeen hij bezit, want hij zal daarvan niets anders hebben. Zie boven Ecc 2:3 ."},{"catchword":"wie zal hem","tekst":"Alsof hij zeide: Niemand."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"All (or every) thing hath an appointed time: all (over) purpose [Hebr. Pleasure, or will, desire; to wit of men. See Psa. 27. On v.12.] under the heaven hath its time. [that is, all affairs and transactions of this world are variable and subject to divers changes and alterations over and again, which God alone ruleth and governeth, and cannot be hastened by any man whatsoever. By this mutability it appeareth plainly, that true happiness is not to be sought (much less so to be found) in this wavering and transitory life.]"}],"2":[{"catchword":null,"tekst":"There is time to be born, and a time to die: a time to plant, and a time to pluck up that which is planted."}],"3":[{"catchword":null,"tekst":"a time to kill, [Whether it be done by the will and appointment of God, Exod. 21.13. or by the authority and the commandment of the Magistrate. Oth. To hurt or wound] and a time to heal, [to wit, him that is wounded or hurt] a time to break down, [Hebr. To break in, or to tear, or rent] and a time to build up."}],"4":[{"catchword":null,"tekst":"a time to weep, and a time to laugh: [See above chap.2.2.] a time to lament, [or to mourn, or to make great moan] and a time to leap up. [or skip, or daunce; to wit, for joy and for gladness. See 1 Chron. 25.29. and Act 13:8.]"}],"5":[{"catchword":null,"tekst":"a time to cast away stones, [To wit, when a garden or field is cleansed, or any house plucked down] and a time to gather stones: [to wit, when they intend, or go about to build an house, or to raise some other structure] a time to embrace, and a time to be far from embrancing. [compare 1 Cor. 7.5.]"}],"6":[{"catchword":null,"tekst":"a time to seek, [That is, to provide, or to keep. Oth, to seek, to wit, wisdom, or wealths, or somewhat that a man hath lost. Understand withal, and to find, as Isa. 65.1.] and time to let ( a thing) perish: [oth. To lose; to wit, when a man should thereby come in danger of soul, of life] a time to keep and a time to cast away. [as for example, when a man is in danger of shipwreck at sea, Jona 1.5. acts 27.18,19.]"}],"7":[{"catchword":null,"tekst":"a time to rent [To wit, garments, as was very usual and customary among the Jews, to shew their sorrow of heart] and a time to sow up: a time to keep silence, and a time to speak."}],"8":[{"catchword":null,"tekst":"a time to love, and a time to hate: a time of war, and a time of peace."}],"9":[{"catchword":null,"tekst":"what advantage hath he that worketh, of that which he laboured? [Understand withal, none. The meaning is, when the hour and time is not come, let a man do what he will, he shall not be able to affect any thing. Compare above chap.1.3.]"}],"10":[{"catchword":null,"tekst":"I have seen the travels which God hath given to the children of men, to trouble themselves therewith."}],"11":[{"catchword":null,"tekst":"he [To wit, God] hath made every thing beautiful [or fair, comely, decent] in his time: [that is, God maketh every thing so, as that is beautiful and excellent, and every thing cometh to pas in due time and season, though with men great changes and alterations to happen] also he hath put the age in theirs [mens] heart: [that is, hath put a natural inclination and proneness to search out the ages and times, and // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

function plaatsPopup(el, html) {
  popup.innerHTML = html;

  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};

function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {

     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {

        if (kortCw) {

            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);

      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';

    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');

    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  // slug -> volledige boeknaam (voor citaten met de volle boeknaam i.p.v. de afkorting)
  const boeknaamPerSlug = {};
  (D.meta.boeken || []).forEach(b => {
    const m = b.href.match(/^\.\.\/\.\.\/([^/]+)\//);
    if (m) boeknaamPerSlug[m[1]] = b.naam;
  });
  // dubbele rechtsklik (binnen 500ms, zelfde verwijzing) kopieert het vers
  // i.p.v. de vertalingen-popup te tonen (enkele rechtsklik blijft bestaand gedrag)
  function kopieerVerwijzing(chip, ref) {
    haalVert('versteksten', ref).then(data => {
      const tekst = data && data[ref.vers];
      if (!tekst) return;
      const url = location.origin + '/studiebijbel/' + ref.slug + '/' + ref.hfd + '#v' + ref.vers;
      const naam = boeknaamPerSlug[ref.slug] || chip.textContent.replace(/\s+\d+:\d+.*$/, '');
      const kopie = tekst.replace(/\*/g, '') + `\n~ [${naam} ${ref.hfd}:${ref.vers}](${url})`;
      navigator.clipboard.writeText(kopie).then(() => {
        toast.classList.add('zichtbaar');
        setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
      });
    });
  }
  let laatsteRechtsklik = { sleutel: null, tijd: 0 };
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    const sleutel = chip.dataset.ref;
    const nu = Date.now();
    const isDubbelklik = laatsteRechtsklik.sleutel === sleutel && (nu - laatsteRechtsklik.tijd) < 500;
    laatsteRechtsklik = isDubbelklik ? { sleutel: null, tijd: 0 } : { sleutel, tijd: nu };
    if (isDubbelklik) {
      popup.style.display = 'none';
      vpopup.style.display = 'none';
      kopieerVerwijzing(chip, ref);
      return;
    }
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
