er; want elke broeder doet niet dan bedriegen, en elke vriend gaat om met achterklap. En zij bedriegen, ieder zijn vriend, en spreken de waarheid niet; zij leren hun tong leugen spreken, zij maken zich moe met verkeerd te handelen.", "Joh 6:39": "En dit is de wil van de Vader, Die Mij gezonden heeft: dat Ik van alles wat Hij Mij gegeven heeft, niets verlies, maar het opwek op de laatste dag.", "1 Kor 15:21": "Want omdat de dood door een mens is, is ook de opstanding van de doden door een Mens.", "Matt 13:30": "Laat ze beide samen opgroeien tot de oogst, en in de tijd van de oogst zal ik tegen de maaiers zeggen: Verzamel eerst het onkruid, en bind het in bundels om het te verbranden; maar breng de tarwe samen in mijn schuur.", "Matt 25:1-46": "Toen zal het Koninkrijk van de hemelen gelijk zijn aan tien maagden, die hun lampen namen, en de bruidegom tegemoet gingen. En vijf van hen waren wijs, en vijf waren dwaas. Zij die dwaas waren, namen hun lampen mee, maar namen geen olie met zich mee.", "Ps 50:6": "En de hemelen verkondigen Zijn gerechtigheid; want God Zelf is Rechter. Sela.", "Job 29:19": "Mijn wortel was uitgebreid tot aan het water, en dauw vernachtte op mijn tak.", "Luk 11:32": "De mannen van Ninevé zullen opstaan in het oordeel samen met dit geslacht, en het veroordelen; want zij hebben zich bekeerd op de prediking van Jona; en zie, meer dan Jona is hier!", "Gen 32:29": "En Jakob vroeg: Vertel mij toch Uw naam. En Hij zei: Waarom vraagt u naar Mijn naam? En Hij zegende hem daar.", "Hand 5:16": "En ook de menigte uit de omliggende steden kwam samen naar Jeruzalem, en brachten zieken, en hen die door onreine geesten gekweld werden; en die werden allen genezen.", "2 Tess 1:4-6": "Zodat wij zelf over u roemen in de Gemeenten van God, over uw volharding en geloof in al uw vervolgingen en verdrukkingen, die u verdraagt; Een bewijs van het rechtvaardige oordeel van God, opdat u waardig geacht wordt voor het Koninkrijk van God, waarvoor u ook lijdt; Aangezien het recht is bij God, verdrukking te vergelden aan hen die u verdrukken;", "Ex 23:1-3": "U zult geen vals gerucht verspreiden; en u zult uw hand niet bij de goddeloze leggen, om een getuige te zijn tot geweld. U zult de menigte niet volgen tot boze zaken; en u zult niet spreken in een geschil om u naar de menigte te neigen, om het recht te buigen. Ook zult u de arme niet voortrekken in zijn geschil.", "Joh 17:2": "Zoals U Hem macht gegeven hebt over alle vlees, opdat Hij aan allen die U Hem gegeven hebt, het eeuwige leven geeft.", "Ps 37:16": "Teth. Het weinige dat de rechtvaardige heeft, is beter dan de overvloed van veel goddelozen.", "2 Kon 4:16": "En hij zei: Op deze vastgestelde tijd, omtrent deze tijd van het jaar, zult u een zoon omhelzen. En zij zei: Nee, mijn heer, u, man Gods, lieg niet tegen uw dienares.", "Joh 5:40": "En u wilt niet tot Mij komen, opdat u het leven zou hebben.", "Luk 20:45-47": "En terwijl al het volk luisterde, zei Hij tegen Zijn discipelen: Wacht u voor de Schriftgeleerden, die graag rondlopen in lange gewaden, en die de begroetingen op de markten graag hebben, en de voorste plaatsen in de synagogen, en de ereplaatsen bij de maaltijden; die de huizen van de weduwen opeten, en voor de schijn lange gebeden uitspreken; zij zullen een des te zwaarder oordeel ontvangen.", "Job 8:6": "als u zuiver en oprecht bent, zeker zal Hij dan nu ontwaken om uwentwil, en Hij zal de woning van uw gerechtigheid herstellen.", "2 Kron 33:12": "En toen hij in nood verkeerde, zocht hij het aangezicht van de HEERE, zijn God, met ernst, en vernederde zich zeer voor het aangezicht van de God van zijn vaderen,", "2 Tess 1:7": "En aan u, die verdrukt wordt, verkwikking te geven met ons, bij de openbaring van de Heere Jezus vanuit de hemel met de engelen van Zijn kracht;", "Deut 5:29": "Och, dat zij zo'n hart hadden om Mij te vrezen, en al Mijn geboden alle dagen te onderhouden, opdat het hun en hun kinderen goed gaat in eeuwigheid!", "Ps 23:5": "U richt de tafel voor mij aan, tegenover mijn tegenstanders; U maakt mijn hoofd vet met olie, mijn beker vloeit over.", "1 Tess 5:23": "En de God van de vrede Zelf heilige u geheel en al; en uw geheel oprechte geest, en ziel, en lichaam moeten onberispelijk bewaard worden bij de komst van onze Heere Jezus Christus.", "Gen 21:2": "En Sara werd zwanger, en baarde Abraham een zoon in zijn ouderdom, op de vastgestelde tijd die God hem gezegd had.", "Num 23:20": "Zie, ik heb opdracht ontvangen om te zegenen; omdat Hij zegent, zal ik het niet terugdraaien.", "Ps 39:3": "Ik was verstomd door stilzwijgen, ik zweeg over het goede; maar mijn smart werd zwaarder.", "Ps 104:1-32": "Loof de HEERE, mijn ziel! O HEERE, mijn God! U bent zeer groot, U bent bekleed met majesteit en heerlijkheid. Hij bedekt Zich met het licht, als met een kleed; Hij spant de hemel uit als een gordijn. Die Zijn opperzalen bouwt op de wateren, Die van de wolken Zijn wagen maakt, Die op de vleugels van de wind wandelt.", "Spr 15:15": "Al de dagen van de bedrukte zijn kwaad; maar een vrolijk hart is een voortdurende maaltijd.", "2 Kron 19:2": "En Jehu, de zoon van Hanani, de ziener, ging naar buiten, hem tegemoet, en zei tegen koning Josafat: Zou u de goddeloze helpen, en hen liefhebben die de HEERE haten? Daarom is er nu van het aangezicht van de HEERE grote toorn over u.", "Richt 9:56": "Zo liet God het kwaad van Abimelech, dat hij aan zijn vader gedaan had door zijn zeventig broers te doden, op hem terugkomen.", "Ps 139:21": "Zou ik niet haten, HEERE, wie U haten? En verdriet hebben over wie tegen U opstaan?", "Rom 8:5": "Want wie naar het vlees zijn, bedenken de dingen van het vlees; maar wie naar de Geest zijn, bedenken de dingen van de Geest.", "2 Kon 2:11": "En het gebeurde, terwijl zij verder gingen, al gaande en sprekende, zie, zo was er een vurige wagen met vurige paarden, die tussen hen beiden scheiding maakten. Zo voer Elia met een storm ten hemel.", "Ps 143:3": "Want de vijand vervolgt mijn ziel, hij vertreedt mijn leven ter aarde; hij legt mij in duisternissen, als hen die al lang dood zijn.", "1 Kor 15:12-55": "Als nu van Christus gepredikt wordt dat Hij uit de doden opgewekt is, hoe zeggen sommigen onder u dat er geen opstanding van de doden is? En als er geen opstanding van de doden is, dan is Christus ook niet opgewekt. En als Christus niet opgewekt is, dan is onze prediking zonder inhoud, en is ook uw geloof zonder inhoud.", "Jes 38:5-20": "Ga heen en zeg tegen Hizkia: Zo zegt de HEERE, de God van uw vader David: Ik heb uw gebed gehoord, Ik heb uw tranen gezien; zie, Ik zal vijftien jaren aan uw dagen toevoegen; En Ik zal u uit de hand van de koning van Assyrië verlossen, alsook deze stad; en Ik zal deze stad beschermen. En dit zal u een teken zijn van de HEERE, dat de HEERE het woord dat Hij gesproken heeft, doen zal:", "Jer 33:21": "Dan zou ook Mijn verbond met Mijn knecht David verbroken kunnen worden, zodat hij geen zoon heeft die op zijn troon regeert, en met de Levieten, de priesters, Mijn dienaren.", "Job 14:4": "Wie kan een reine geven uit een onreine? Niemand.", "Deut 28:8": "De HEERE zal de zegen gebieden, zodat Hij met u is in uw schuren, en in alles waar u uw hand aan slaat; en Hij zal u zegenen in het land dat de HEERE, uw God, u geven zal.", "1 Kron 29:12": "En rijkdom en eer komen van Uw aangezicht, en U heerst over alles; en in Uw hand is kracht en macht; ook staat het in Uw hand om alles groot te maken en sterk te maken.", "Ps 37:34": "Koph. Wacht op de HEERE, en houd Zijn weg, en Hij zal u verhogen om de aarde erfelijk te bezitten; u zult zien dat de goddelozen worden uitgeroeid.", "Job 28:21": "Want zij is verholen voor de ogen van alle levenden, en voor het gevogelte des hemels is zij verborgen.", "Rom 9:23": "en opdat Hij de rijkdom van Zijn heerlijkheid bekend zou maken over de vaten van de barmhartigheid, die Hij van tevoren klaargemaakt heeft tot heerlijkheid?", "Mal 3:10-12": "Breng al de tienden in het schathuis, opdat er voedsel is in Mijn huis; en beproef Mij nu daarin, zegt de HEERE van de heerscharen, of Ik u dan niet zal opendoen de vensters van de hemel, en u zegen zal uitgieten, zodat er geen schuren genoeg zullen zijn. En Ik zal om uwentwil de opeter bestraffen, zodat hij u de vrucht van het land niet verderft; en de wijnstok op het veld zal u geen misdracht voortbrengen, zegt de HEERE van de heerscharen. En alle heidenen zullen u gelukzalig noemen; want u zult een lustig land zijn, zegt de HEERE van de heerscharen.", "Ezech 22:6": "Zie, de vorsten van Israël zijn in u geweest, ieder naar zijn kracht, om bloed te vergieten.", "Jak 4:15": "In plaats daarvan zou u moeten zeggen: Als de Heere het wil, en wij leven, zullen wij dit of dat doen.", "Zef 3:7": "Ik zei: Zeker zult u Mij vrezen, u zult de tucht aannemen, opdat haar woning niet uitgeroeid zou worden; alles waarmee Ik haar bezocht heb¹, waarlijk, zij hebben zich vroeg opgemaakt, zij hebben al hun handelingen verdorven.", "Ezra 6:22": "En zij hielden het feest van de ongezuurde broden zeven dagen, met blijdschap; want de HEERE had hen verblijd, en het hart van de koning van Assur naar hen toe gewend, om hun handen te sterken in het werk van het huis van God, de God van Israël.", "Deut 11:7": "Want het zijn uw ogen, die al dit grote werk van de HEERE gezien hebben, dat Hij gedaan heeft.", "Jak 4:9": "Gedraag u als ellendigen, en treur en ween; laat uw lachen veranderen in treuren, en uw blijdschap in verdriet.", "2 Kor 7:10": "Want de droefheid naar God werkt een onberouwelijke bekering tot zaligheid; maar de droefheid van de wereld werkt de dood.", "2 Kron 28:22": "Ja, in de tijd toen men hem benauwde, ging hij nog meer overtreden tegen de HEERE; dit was koning Achaz.", "Ps 94:10": "Zou Hij, Die de heidenen tuchtigt, niet straffen, Hij, Die de mens wetenschap leert?", "Ps 104:24-30": "Hoe groot zijn Uw werken, o HEERE! U hebt ze allemaal met wijsheid gemaakt; het aardrijk is vol van Uw rijkdom. Deze zee, die groot en wijd van omvang is, daarin is het wemelende gedierte, ontelbaar, kleine dieren met grote. Daar varen de schepen, en de Leviathan, die U gevormd hebt om daarin te spelen.", "Ps 76:9": "U deed een oordeel horen uit de hemel; de aarde vreesde en werd stil,", "Ps 9:5": "Want Gij hebt mijn recht en mijn rechtszaak afgedaan; Gij hebt gezeten op de troon, o Rechter der gerechtigheid.", "1 Joh 1:9": "Als wij onze zonden belijden: Hij is getrouw en rechtvaardig, om ons de zonden te vergeven, en ons te reinigen van alle ongerechtigheid.", "Matt 10:28": "En weest niet bang voor hen die het lichaam doden, en de ziel niet kunnen doden; maar vreest veel meer Hem, Die zowel ziel als lichaam kan verderven in de hel.", "Ps 147:14": "Die uw grondgebied in vrede stelt; Hij verzadigt u met het beste van de tarwe.", "Hand 20:32": "En nu, broeders, ik vertrouw u toe aan God, en aan het woord van Zijn genade, dat machtig is u op te bouwen, en u een erfdeel te geven onder alle geheiligden.", "Job 37:6-24": "Want Hij zegt tot de sneeuw: Val op de aarde; en tot de regenbui: Wees een sterke regenbui. Dan zegelt Hij de hand van ieder mens toe, opdat elk mens het werk van Hem kent. En het gedierte gaat in de holen, en blijft in zijn schuilplaatsen.", "Job 20:12": "Al is het kwaad zoet in zijn mond, al verbergt hij dat onder zijn tong,", "Luk 19:10": "Want de Zoon des mensen is gekomen om te zoeken en zalig te maken wat verloren was.", "Ps 100:3": "Weet dat de HEERE God is; Hij heeft ons gemaakt, en niet wij zelf; wij zijn Zijn volk en de schapen van Zijn weide.", "Ef 5:25": "Mannen, heb uw eigen vrouwen lief, zoals ook Christus de Gemeente liefgehad heeft, en Zichzelf voor haar heeft overgegeven,", "Hand 20:35": "Ik heb u in alles getoond, dat men, zo arbeidend, de zwakken moet opnemen, en zich de woorden van de Heere Jezus herinneren, dat Hij gezegd heeft: Het is zaliger te geven dan te ontvangen.", "Pred 7:23": "Dit alles heb ik met wijsheid beproefd; ik zei: Ik zal wijsheid verkrijgen, maar zij was nog ver van mij.", "Hand 27:38": "En toen zij verzadigd waren van het voedsel, maakten zij het schip lichter door het koren in zee te werpen.", "Ps 118:5": "Uit de benauwdheid heb ik de HEERE aangeroepen; de HEERE heeft mij verhoord en mij in de ruimte gezet.", "Gen 2:1-25": "Zo zijn de hemel en de aarde voltooid, en heel hun leger. Toen God op de zevende dag Zijn werk voltooid had, dat Hij gemaakt had, heeft Hij op de zevende dag gerust van al Zijn werk, dat Hij gemaakt had. En God heeft de zevende dag gezegend, en die geheiligd; omdat Hij daarop gerust heeft van al Zijn werk, dat God geschapen had om te volmaken.", "Spr 12:6": "De woorden van de goddelozen zijn om op bloed te loeren; maar de mond van de oprechten zal ze redden.", "Rom 1:20-32": "Want Zijn onzichtbare dingen worden, vanaf de schepping van de wereld, uit de schepselen begrepen en doorzien, namelijk Zijn eeuwige kracht en Goddelijkheid, opdat zij niet te verontschuldigen zouden zijn. Omdat zij, hoewel zij God kenden, Hem niet als God verheerlijkt of gedankt hebben; maar in hun overleggingen zijn zij verijdeld geworden, en hun onverstandig hart is verduisterd geworden; terwijl zij zich voor wijzen uitgaven, zijn zij dwaas geworden;", "Job 21:23": "De één sterft in de kracht van zijn volkomenheid, terwijl hij helemaal stil en gerust was;", "Spr 18:20": "Van de vrucht van ieders mond zal zijn buik verzadigd worden; hij zal verzadigd worden van de opbrengst van zijn lippen.", "Joz 11:23": "Zo nam Jozua heel dat land in, naar alles wat de HEERE tot Mozes gesproken had; en Jozua gaf het aan Israël als erfdeel, naar hun afdelingen, naar hun stammen. En het land rustte van de oorlog.", "Est 7:10": "Zo hingen zij Haman aan de galg, die hij voor Mordechai had laten maken; en de grimmigheid van de koning werd gestild.", "Gal 4:4": "Maar toen de volheid van de tijd gekomen was, heeft God Zijn Zoon uitgezonden, geboren uit een vrouw, geboren onder de wet;", "Luk 16:22": "En het gebeurde dat de bedelaar stierf, en door de engelen gedragen werd in de schoot van Abraham; en de rijke stierf ook, en werd begraven.", "2 Kron 7:18": "Dan zal Ik de troon van uw koninkrijk bevestigen, zoals Ik een verbond met uw vader David gemaakt heb, en zei: Er zal u geen man afgesneden worden die in Israël heerst.", "Gen 25:17": "En dit zijn de jaren van het leven van Ismaël: honderdzevenendertig jaar; en hij gaf de geest, en stierf, en hij werd verzameld tot zijn volk.", "1 Kor 11:12": "Want zoals de vrouw uit de man is, zo is ook de man door de vrouw; maar alle dingen zijn uit God.", "Mark 10:6": "Maar van het begin van de schepping af heeft God hen man en vrouw gemaakt.", "1 Tess 4:13-18": "Maar, broeders, ik wil niet dat u onwetend bent over hen die ontslapen zijn, opdat u niet bedroefd bent, zoals ook de anderen, die geen hoop hebben. Want als wij geloven dat Jezus gestorven is en opgestaan, zo zal God ook hen die in Jezus ontslapen zijn, met Hem terug brengen. Want dit zeggen wij u door het Woord van de Heere, dat wij, die levend overblijven tot de komst van de Heere, hen die ontslapen zijn niet zullen voorgaan.", "Jes 26:7": "Het pad van de rechtvaardige is geheel effen, de gang van de rechtvaardige weegt U recht.", "Hand 4:28": "Om te doen alles wat Uw hand en Uw raad van tevoren bepaald hadden dat zou gebeuren.", "Mark 12:27": "God is niet een God van de doden, maar een God van de levenden. U dwaalt dus zeer.", "Ps 118:13": "U had mij zeer hard gestoten, tot vallen toe, maar de HEERE heeft mij geholpen.", "Spr 10:13": "In de lippen van de verstandige wordt wijsheid gevonden; maar op de rug van hem die zonder verstand is, de roede.", "Ef 3:16": "opdat Hij u geeft, naar de rijkdom van Zijn heerlijkheid, met kracht versterkt te worden door Zijn Geest in de innerlijke mens;", "Ps 11:4": "De HEERE is in het paleis van Zijn heiligheid, de troon van de HEERE is in de hemel; Zijn ogen aanschouwen, Zijn oogleden beproeven de mensenkinderen.", "Job 34:15": "Alle vlees zou tegelijk de geest geven, en de mens zou tot stof terugkeren.", "Job 17:14": "Tot de groeve roep ik: U bent mijn vader! Tot het gewormte: Mijn moeder, en mijn zuster!", "Gen 49:12": "Hij is roodachtig van ogen door de wijn, en wit van tanden door de melk.", "Deut 13:17": "Ook zal er niets van het verbannene aan uw hand kleven, opdat de HEERE Zich wendt van de hitte van Zijn toorn, en u barmhartigheid geeft, en Zich over u erbarmt, en u vermenigvuldigt, zoals Hij uw vaders gezworen heeft;", "2 Tim 1:9": "Die ons zalig gemaakt heeft, en geroepen heeft met een heilige roeping; niet naar onze werken, maar naar Zijn eigen voornemen en genade, die ons gegeven is in Christus Jezus, vóór de tijden der eeuwen;", "Gen 14:14-17": "Toen Abram hoorde dat zijn broeder gevangen was genomen, wapende hij zijn geoefende mannen, geboren in zijn eigen huis, driehonderd achttien, en hij achtervolgde hen tot Dan toe. En hij verdeelde zich tegen hen 's nachts, hij en zijn knechten, en versloeg hen; en hij achtervolgde hen tot Hoba toe, dat ten noorden van Damaskus ligt. En hij bracht alle bezittingen terug, en ook Lot, zijn broeder, en diens bezittingen bracht hij terug, en ook de vrouwen en het volk.", "2 Kron 6:22": "Wanneer iemand tegen zijn naaste zal gezondigd hebben, en die hem een eed van de vloek opgelegd zal hebben om zichzelf te vervloeken, en de eed van de vloek voor Uw altaar in dit huis komen zal;", "Ex 22:22": "U mag geen weduwe of wees kwaad doen.", "Gen 21:1": "En de HEERE bezocht Sara, zoals Hij gezegd had; en de HEERE deed aan Sara, zoals Hij gesproken had.", "1 Sam 8:10-18": "Samuël nu zei al de woorden van de HEERE aan het volk, dat een koning van hem begeerde. En hij zei: Dit zal de wijze van de koning zijn, die over u regeren zal: hij zal uw zonen nemen, en hen voor zichzelf aanstellen, voor zijn wagen en tot zijn ruiters, zodat zij voor zijn wagen uit zullen lopen; en hij zal hen voor zich aanstellen als leiders over duizend, en als leiders over vijftigtallen; en hij zal hen zijn akker laten ploegen, en zijn oogst laten oogsten, en zijn oorlogswapens laten maken, alsook zijn wagentuig.", "Deut 11:12-15": "Een land, dat de HEERE, uw God, verzorgt; de ogen van de HEERE, uw God, zijn er voortdurend op gericht, van het begin van het jaar tot het einde van het jaar. En het zal gebeuren, als u zorgvuldig zult horen naar Mijn geboden, die Ik u heden gebied, om de HEERE, uw God, lief te hebben, en Hem te dienen, met uw hele hart en met uw hele ziel; Zo zal Ik de regen van uw land geven op zijn tijd, vroege regen en late regen, opdat u uw koren, en uw most, en uw olie inzamelt.", "Ps 37:18": "Jod. De HEERE kent de dagen van de oprechten; en hun erfenis zal in eeuwigheid blijven.", "Pred 2:11": "Toen wendde ik mij tot al mijn werken die mijn handen gemaakt hadden, en tot de arbeid die ik met inspanning had verricht; zie, het was allemaal ijdelheid en kwelling van de geest, en daarin was geen voordeel onder de zon.", "Jes 30:9-11": "Want het is een opstandig volk; het zijn leugenachtige kinderen; kinderen die de wet van de HEERE niet willen horen. Die tegen de zieners zeggen: Ziet niet; en tegen de schouwers: Schouwt ons niet wat recht is; spreekt tot ons zachte dingen, schouwt ons bedriegerijen. Wijkt af van de weg, maakt u van het pad; laat de Heilige van Israël van ons ophouden!", "Job 28:13": "De mens weet haar waarde niet, en zij wordt niet gevonden in het land van de levenden.", "Mark 10:28-30": "En Petrus begon tegen Hem te zeggen: Zie, wij hebben alles verlaten, en zijn U gevolgd. En Jezus antwoordde en zei: Voorwaar, Ik zeg u: Er is niemand die huis, of broers, of zusters, of vader, of moeder, of vrouw, of kinderen, of akkers verlaten heeft, omwille van Mij en omwille van het Evangelie, of hij ontvangt honderdvoud, nu in deze tijd, huizen, en broers, en zusters, en moeders, en kinderen, en akkers, met vervolgingen, en in de toekomende tijd het eeuwige leven.", "Jes 3:15": "Wat bezielt u, dat u Mijn volk verbrijzelt, en de aangezichten van de ellendigen vermaalt? spreekt de Heere, HEERE van de heerscharen.", "Hand 3:17": "En nu, broeders, ik weet dat u het door onwetendheid hebt gedaan, zoals ook uw leiders.", "Num 27:12-14": "Daarna zei de HEERE tegen Mozes: Klim op deze berg Abarim, en zie dat land, dat Ik de kinderen van Israël gegeven heb. Wanneer u dat gezien zult hebben, dan zult u met uw volk verenigd worden, u ook, zoals uw broer Aäron daarmee verenigd is; Omdat u tegen Mijn bevel opstandig bent geweest in de woestijn Zin, bij de twist van de vergadering, toen u Mij bij het water voor hun ogen had moeten heiligen. Dat is het water van Meriba, bij Kades, in de woestijn Zin.", "Job 39:4-33": "Weet u de tijd van het baren van de steengeiten? Hebt u waargenomen de arbeid van de hinden? Zult u de maanden tellen, die zij vervullen, en weet u de tijd van haar baren? Als zij zich krommen, haar jongen met versplijting voortbrengen, haar smarten uitwerpen?", "Openb 19:2": "Want Zijn oordelen zijn waarachtig en rechtvaardig; omdat Hij de grote hoer geoordeeld heeft, die de aarde verdorven heeft met haar hoererij, en Hij het bloed van Zijn dienaren van haar hand gewroken heeft.", "1 Kon 9:5": "Dan zal Ik de troon van uw koninkrijk over Israël bevestigen in eeuwigheid; zoals Ik gesproken heb over uw vader David, en zei: Er zal u geen man afgesneden worden van de troon van Israël.", "Ps 58:4-6": "De goddelozen zijn vervreemd van de moederschoot af; de leugensprekers dolen van de moederbuik af. Zij hebben vurig gif, gelijk vurig slangengif; zij zijn als een dove adder, die zijn oren toestopt, opdat hij niet hoort naar de stem van de bezweerders, van hem die ervaren is in het uitvoeren van bezweringen.", "Job 39:9": "Die Ik de wildernis tot zijn huis besteld heb, en het ziltige tot zijn woningen.", "Hebr 9:15": "En daarom is Hij de Middelaar van het nieuwe testament, opdat, nu de dood daartussen gekomen is, tot verzoening van de overtredingen die er waren onder het eerste testament, degenen die geroepen zijn de belofte van de eeuwige erfenis zouden ontvangen.", "Ps 32:9": "Wees niet als een paard, als een muilezel, dat geen verstand heeft, wiens muil men breidelt met toom en gebit, zodat het niet naar u toe komt.", "Ps 77:20": "Uw weg was in de zee, en Uw pad in het grote water, en Uw voetstappen werden niet bekend.", "Openb 1:7": "Zie, Hij komt met de wolken en elk oog zal Hem zien, ook zij die Hem doorstoken hebben; en alle geslachten van de aarde zullen over Hem rouw bedrijven; ja, amen.", "Ps 145:11": "Caph. Zij zullen de heerlijkheid van Uw Koninkrijk vermelden, en Uw macht zullen zij uitspreken.", "Rom 1:28": "En zoals het hun niet goeddacht God te erkennen, zo heeft God hen overgegeven aan een verkeerd denken, om dingen te doen die niet betamen;", "1 Kon 8:12": "Toen zei Salomo: De HEERE heeft gezegd, dat Hij in donkerheid zou wonen.", "Rom 2:5-9": "Maar naar uw hardheid en onbekeerlijk hart, verzamelt u voor uzelf toorn als een schat, voor de dag van de toorn en de openbaring van het rechtvaardig oordeel van God. Die ieder zal vergelden naar zijn werken: Hun die volhardend goeddoen en heerlijkheid, en eer, en onvergankelijkheid zoeken, het eeuwige leven;", "Job 34:14": "Als Hij Zijn hart tegen hem zette, Zijn geest en Zijn adem zou Hij tot Zich verzamelen;", "Ps 34:11": "Caph. De jonge leeuwen lijden armoede en honger; maar die de HEERE zoeken hebben geen gebrek aan enig goed.", "Deut 5:33": "In heel de weg die de HEERE, uw God, u gebiedt, zult u gaan; opdat u leeft, en opdat het u goed gaat, en u de dagen verlengt in het land dat u erven zult.", "Ps 73:4-12": "Want er zijn geen boeien tot hun dood toe, en hun kracht is fris. Zij zijn niet in de moeite zoals andere mensen, en worden niet met andere mensen geplaagd. Daarom omringt hen de hoogmoed als een keten; het geweld bedekt hen als een gewaad.", "Luk 1:20": "En zie, u zult zwijgen en niet kunnen spreken, tot op de dag dat deze dingen gebeurd zullen zijn; omdat u mijn woorden niet geloofd hebt, die op hun tijd vervuld zullen worden.", "Ps 17:14": "Met Uw hand van de mensen, o HEERE! Van de mensen, die van de wereld zijn, wier deel in dit leven is, wier buik U vult met Uw verborgen schat; de kinderen worden verzadigd, en zij laten hun overschot achter aan hun kinderen.", "Luk 19:12-26": "Hij zei dan: Een man van hoge afkomst reisde naar een ver land om voor zichzelf een koninkrijk te ontvangen, en dan terug te keren. En hij riep zijn tien dienstknechten, gaf hun tien ponden, en zei tegen hen: Doe er zaken mee totdat ik terugkom. Maar zijn burgers haatten hem, en stuurden gezanten achter hem aan, die zeiden: Wij willen niet dat deze man koning over ons wordt.", "Spr 20:24": "De treden van de man zijn van de HEERE; hoe zou een mens dan zijn weg begrijpen?", "Tit 3:7": "Opdat wij, gerechtvaardigd door Zijn genade, erfgenamen zouden worden naar de hoop van het eeuwige leven.", "Jes 40:26": "Hef uw ogen op omhoog, en ziet, Wie deze dingen geschapen heeft; Die in getal hun leger voortbrengt; Die ze alle bij naam roept, vanwege de grootheid van Zijn krachten, en omdat Hij sterk van vermogen is; er wordt er niet één gemist.", "Deut 4:11": "En u kwam dichterbij en stond onder aan die berg (die berg brandde nu van vuur tot aan het midden van de hemel; er was duisternis, wolken en donkerheid).", "Deut 33:29": "Gelukkig bent u, o Israël! wie is u gelijk? u bent een volk, verlost door de HEERE, het Schild van uw hulp, en Die een Zwaard is van uw hoogheid; daarom zullen uw vijanden zich geveinsd aan u onderwerpen, en u zult op hun hoogten treden!", "Job 34:23": "Zeker, Hij legt de mens niet te veel op, dat hij tegen God in het gericht zou mogen treden.", "Joh 6:54": "Wie Mijn vlees eet en Mijn bloed drinkt, heeft het eeuwige leven; en Ik zal hem opwekken op de laatste dag.", "Jes 59:1": "Zie, de hand van de HEERE is niet te kort om te kunnen verlossen, en Zijn oor is niet zwaar geworden om te kunnen horen.", "Hebr 11:3": "Door het geloof begrijpen wij dat de wereld door het woord van God gemaakt is, zodat de dingen die men ziet niet ontstaan zijn uit dingen die zichtbaar zijn.", "Spr 11:7": "Als de goddeloze mens sterft, vergaat zijn verwachting; zelfs de allersterkste hoop is vergaan.", "Gen 50:20": "U wel, u hebt kwaad tegen mij gedacht; doch God heeft dat ten goede gedacht; opdat Hij deed, zoals het op deze dag is, om een groot volk in het leven te behouden.", "Neh 2:6": "Toen zei de koning tegen mij, terwijl de koningin naast hem zat: Hoelang zal uw reis duren, en wanneer zult u terugkomen? En het behaagde de koning om mij te zenden, toen ik hem een bepaalde tijd had opgegeven.", "Hand 8:21": "U hebt geen deel en geen aandeel in dit woord, want uw hart is niet recht voor God.", "Fil 4:4-9": "Verblijd u in de Heere te allen tijd; opnieuw zeg ik: Verblijd u. Uw vriendelijkheid moet bij alle mensen bekend zijn. De Heere is nabij. Wees over niets bezorgd; maar laat in alles, door bidden en smeken, met dankzegging uw verlangens bekend worden bij God;", "Spr 28:8": "Wie zijn bezit vermeerdert met woeker en met overwinst, verzamelt dat voor hem die zich over de arme ontfermt.", "Jona 1:5": "Toen werden de zeelieden bang, en riepen ieder tot zijn god, en wierpen de vaten die in het schip waren in de zee, om het daarvan te verlichten; maar Jona was neergegaan aan de zijkant van het schip, en lag neer, en was in een diepe slaap gevallen.", "Jak 2:9": "maar als u de persoon aanneemt, doet u zonde, en wordt u door de wet als overtreders bestraft.", "2 Kron 31:10": "En Azarja, de hoofdpriester, van het huis van Zadok, sprak tot hem en zei: Sinds men deze heffing is begonnen tot het huis van de HEERE te brengen, is er te eten geweest en genoeg om verzadigd te worden, ja, tot overvloed toe; want de HEERE heeft Zijn volk gezegend, zodat deze grote hoeveelheid overgebleven is.", "2 Kon 6:30": "En het gebeurde, toen de koning de woorden van deze vrouw gehoord had, dat hij zijn kleren scheurde, terwijl hij over de muur voortging; en het volk zag dat er, zie, een zak van binnen over zijn vlees was.", "Ps 105:17": "Hij zond een man voor hun aangezicht heen; Jozef werd verkocht tot een slaaf.", "2 Kron 28:19": "Want de HEERE vernederde Juda, om Achaz, de koning van Israël; want hij had Juda losgelaten van de HEERE, zodat het geheel zwaar overtrad tegen de HEERE.", "Job 36:3": "Ik zal mijn kennis van verre ophalen, en mijn Schepper gerechtigheid toewijzen.", "Jes 5:12": "En harp en luit, tamboerijn en fluit, en wijn zijn bij hun feesten; maar zij letten niet op het werk van de HEERE, en zij zien niet op het maaksel van Zijn handen.", "Job 29:20": "Mijn heerlijkheid was nieuw bij mij, en mijn boog vernieuwde zich in mijn hand.", "Kol 1:5": "Vanwege de hoop die voor u weggelegd is in de hemelen, waarvan u eerder gehoord hebt door het Woord van de waarheid, namelijk van het Evangelie;", "Jes 56:1": "Zo zegt de HEERE: Bewaar het recht en doe gerechtigheid; want Mijn heil is nabij om te komen, en Mijn gerechtigheid om geopenbaard te worden.", "Spr 28:15": "De goddeloze, heersend over een arm volk, is een brullende leeuw, en een beer, die heen en weer rondloopt.", "Ps 149:3": "Laat hen Zijn Naam loven met dans; laat hen Hem psalmzingen met trommel en harp.", "1 Sam 20:3": "Toen zwoer David verder, en zei: Uw vader weet heel goed dat ik genade in uw ogen gevonden heb; daarom heeft hij gezegd: Dat Jonathan dit niet weet, opdat hij zich niet bekommert; en zeker, zo waarachtig als de HEERE leeft, en uw ziel leeft, er is maar als een schrede tussen mij en de dood!", "Jes 40:28": "Weet u het niet? Hebt u niet gehoord, dat de eeuwige God, de HEERE, de Schepper van de einden van de aarde, noch moede noch mat wordt? Er is geen doorgronding van Zijn verstand.", "Ps 24:2": "Want Hij heeft haar gegrond op de zeeën, en heeft haar gevestigd op de rivieren.", "Hand 7:59": "En zij stenigden Stefanus, terwijl hij aanriep en zei: Heere Jezus, ontvang mijn geest.", "Job 23:13": "Maar is Hij tegen iemand, wie zal Hem dan afkeren? Wat Zijn ziel begeert, dat zal Hij doen.", "Kol 1:21": "En u, die eertijds vervreemd was en vijanden door het verstand in de boze werken, heeft Hij nu ook verzoend,", "Spr 30:22": "Om een knecht, als hij regeert; en een dwaas, als hij verzadigd is met brood;", "Ps 97:2": "Rondom Hem zijn wolken en donkerheid, gerechtigheid en recht zijn de vastigheid van Zijn troon.", "Joh 10:28": "En Ik geef hun het eeuwige leven; en zij zullen niet verloren gaan in eeuwigheid, en niemand zal ze uit Mijn hand rukken.", "Ps 35:24": "Doe mij recht naar Uw gerechtigheid, HEERE, mijn God! En laat hen zich over mij niet verblijden.", "Jes 38:5": "Ga heen en zeg tegen Hizkia: Zo zegt de HEERE, de God van uw vader David: Ik heb uw gebed gehoord, Ik heb uw tranen gezien; zie, Ik zal vijftien jaren aan uw dagen toevoegen;", "Ruth 1:6": "Toen maakte zij zich klaar met haar schoondochters, en keerde terug uit de velden van Moab; want zij had in het land van Moab gehoord dat de HEERE naar Zijn volk had omgezien en hun brood gaf.", "1 Tess 4:7": "Want God heeft ons niet geroepen tot onreinheid, maar tot heiliging.", "Spr 18:17": "Wie het eerst zijn zaak bepleit, lijkt rechtvaardig; maar zijn naaste komt, en die onderzoekt hem.", "Jes 57:21": "De goddelozen, zegt mijn God, hebben geen vrede.", "Klaagl 3:28": "Jod. Hij zit eenzaam, en zwijgt stil, omdat Hij het hem opgelegd heeft.", "Jes 55:8": "Want Mijn gedachten zijn niet uw gedachten, en uw wegen zijn niet Mijn wegen, spreekt de HEERE.", "Job 37:16": "Hebt u kennis van de opwegingen van de dikke wolken; de wonderen van Hem die volmaakt is in wetenschappen?", "Ps 146:7-9": "Die de verdrukte recht doet, Die de hongerige brood geeft; de HEERE maakt de gevangenen los. De HEERE opent de ogen van de blinden; de HEERE richt de gebogenen op; de HEERE heeft de rechtvaardigen lief. De HEERE bewaart de vreemdelingen; Hij houdt de wees en de weduwe staande; maar de weg van de goddelozen keert Hij om.", "Hos 2:20": "En het zal op die dag gebeuren, dat Ik verhoren zal, spreekt de Heere; Ik zal de hemel verhoren, en die zal de aarde verhoren.", "Ps 133:3": "Het is als de dauw van Hermon, en die neerdaalt op de bergen van Sion, want de HEERE gebiedt daar de zegen en het leven tot in eeuwigheid.", "Spr 29:11": "Een dwaas laat zijn hele geest de vrije loop, maar de wijze weerhoudt die en houdt hem in.", "2 Kron 6:23": "Hoor U dan uit de hemel, en doe, en richt Uw knechten, door de goddeloze te vergelden en zijn weg op zijn hoofd te leggen, en door de rechtvaardige recht te doen en hem naar zijn gerechtigheid te geven.", "Jes 51:16": "En Ik leg Mijn woorden in uw mond, en bedek u onder de schaduw van Mijn hand; om de hemel te planten, en om de aarde te gronden, en om tegen Sion te zeggen: U bent Mijn volk.", "Pred 5:11": "De slaap van de arbeider is zoet, of hij nu weinig of veel gegeten heeft; maar de overvloed van de rijke laat hem niet slapen.", "Spr 15:4": "De medicijn van de tong is een boom van het leven; maar de verkeerdheid daarin is een breuk in de geest.", "1 Tim 6:6-8": "Maar de godsvrucht is, samen met tevredenheid, een grote winst. Want wij hebben niets in de wereld meegebracht, het is duidelijk dat wij er ook niets uit kunnen meedragen. Maar als wij voedsel en kleding hebben, zullen wij daarmee tevreden zijn.", "Amos 4:13": "Want zie, Die de bergen vormt, en de wind schept, en de mens bekendmaakt wat Zijn gedachte is, Die de dageraad duisternis maakt, en op de hoogten van de aarde treedt, HEERE, God van de heerscharen, is Zijn Naam.", "Jes 1:23": "Uw vorsten zijn afvalligen, en metgezellen van dieven, ieder van hen heeft geschenken lief, en zij jagen de vergeldingen na; de wezen doen zij geen recht, en de rechtszaak van de weduwen komt voor hen niet.", "Jes 40:23": "Die de vorsten teniet maakt; de rechters van de aarde maakt Hij tot ijdelheid.", "Spr 29:27": "Een onrechtvaardig man is voor de rechtvaardige een gruwel; maar wie recht van weg is, is voor de goddeloze een gruwel.", "Pred 7:1": "Beter is een goede naam dan goede olie, en de dag van de dood dan de dag dat iemand geboren wordt.", "Joh 6:50": "Dit is het Brood dat uit de hemel neerdaalt, zodat de mens ervan eet en niet sterft.", "Spr 22:2": "Rijken en armen ontmoeten elkaar; de HEERE heeft hen allen gemaakt.", "Openb 17:17": "Want God heeft hun in hun hart gegeven dat zij Zijn plan uitvoeren, en dat zij één en dezelfde gezindheid uitvoeren, en dat zij hun koninkrijk aan het beest geven, totdat de woorden van God vervuld zullen zijn.", "Pred 7:2": "Het is beter te gaan in het klaaghuis, dan te gaan in het huis van het maaltijd; want daarin is het einde van alle mensen, en de levende legt het in zijn hart.", "Ps 141:3": "HEERE, zet een wacht voor mijn mond, bewaak de deur van mijn lippen.", "Ps 8:4-7": "Als ik Uw hemel aanzie, het werk van Uw vingers, de maan en de sterren, die U bereid hebt; Wat is de mens, dat U aan hem denkt, en de zoon des mensen, dat U hem bezoekt? En hebt U hem een weinig minder gemaakt dan de engelen, en hebt U hem met eer en heerlijkheid gekroond?", "Judas 1:1": "Judas, een dienstknecht van Jezus Christus, en broeder van Jakobus, aan de geroepenen, die door God de Vader geheiligd zijn, en door Jezus Christus bewaard:", "Job 5:12": "Hij maakt teniet de gedachten van de arglistigen; zodat hun handen niets uitrichten.", "1 Kor 15:42": "Zo zal ook de opstanding van de doden zijn. Het lichaam wordt gezaaid in vergankelijkheid, het wordt opgewekt in onvergankelijkheid;", "Jes 40:12": "Wie heeft het water met Zijn vuist gemeten, en van de hemel met de span de maat genomen, en heeft met een drieling het stof van de aarde begrepen, en de bergen gewogen in een waag, en de heuvels in een weegschaal?", "Deut 26:18": "En de HEERE heeft u heden laten zeggen dat u Hem tot een volk van het eigendom zult zijn, zoals Hij u gesproken heeft, en dat u al Zijn geboden zult houden;", "Nahum 1:3-6": "De HEERE is geduldig, maar van grote kracht, en Hij houdt de schuldige zeker niet onschuldig. De weg van de HEERE is in wervelwind en in storm, en de wolken zijn het stof van Zijn voeten. Hij bestraft de zee, en maakt haar droog, en Hij droogt alle rivieren uit; Basan en Karmel kwijnen weg, ook kwijnt de bloem van Libanon weg. De bergen beven voor Hem, en de heuvels smelten; en de aarde licht zich op voor Zijn aangezicht, ja de wereld, en allen die daarin wonen.", "Job 22:5": "Is uw boosheid niet groot, en is er geen einde aan uw ongerechtigheden?", "Ps 59:8": "Zie, zij storten overvloedig uit met hun mond; zwaarden zijn op hun lippen; want wie hoort het?", "Ps 19:5": "Hun richtsnoer gaat uit over de hele aarde, en hun redenen tot het einde van de wereld; Hij heeft daarin een tent gesteld voor de zon.", "Deut 4:4": "U daarentegen, die de HEERE, uw God, aanhing, u bent vandaag allemaal nog in leven.", "Jer 14:10": "Zo zegt de HEERE van dit volk: Zij hebben zo liefgehad om te zwerven, zij hebben hun voeten niet bedwongen; daarom heeft de HEERE geen welgevallen aan hen, nu zal Hij aan hun ongerechtigheden denken, en hun zonden bezoeken.", "Job 22:28": "Als u een zaak besluit, zal zij voor u bestendig zijn; en op uw wegen zal het licht schijnen.", "Ps 19:2": "De hemelen vertellen Gods eer, en het uitspansel verkondigt het werk van Zijn handen.", "Luk 1:14": "En u zult blijdschap en vreugde hebben, en velen zullen zich over zijn geboorte verblijden.", "1 Kron 5:26": "Zo verwekte de God van Israël de geest van Pul, de koning van Assyrië, en de geest van Tiglath-Pilneser, de koning van Assyrië, die voerde hen gevankelijk weg, te weten de Rubenieten, en de Gadieten, en de halve stam van Manasse; en hij bracht hen naar Halah, en Habor, en Hara, en aan de rivier Gozan, tot op deze dag.", "Job 38:25-27": "Wie deelt voor de stortregen een waterloop uit, en een weg voor het weerlicht van de donderen? Om te regenen op het land, waar niemand is, op de woestijn, waarin geen mens is; Om het woeste en het verwoeste te verzadigen, en om het uitspruitsel van de grasscheutjes te doen meer worden.", "Jes 30:1": "Wee de kinderen die afvallen, spreekt de HEERE, om een raadslag te maken, maar niet uit Mij, en om zich met een bedekking te bedekken, maar niet uit Mijn Geest, om zonde tot zonde te doen;", "1 Kor 7:24": "Ieder, broeders, moet blijven bij God in de staat waarin hij geroepen is.", "Ps 71:19": "Ook is Uw gerechtigheid, o God, tot in de hoogte; Gij, Die grote dingen gedaan hebt; o God! wie is U gelijk?", "Jes 46:4": "En tot de ouderdom toe zal Ik Dezelfde zijn, ja, tot de grijsheid toe zal Ik u dragen; Ik heb het gedaan, en Ik zal u opnemen, en Ik zal dragen en redden.", "Ef 3:8": "Aan mij, de allerminste van al de heiligen, is deze genade gegeven, om onder de heidenen door het Evangelie de onnaspeurlijke rijkdom van Christus te verkondigen,", "Jes 54:17": "Elk instrument dat tegen u gemaakt wordt, zal niet gelukken, en elke tong, die in het gericht tegen u opstaat, zult u verdoemen; dit is het erfdeel van de knechten van de HEERE, en hun gerechtigheid is uit Mij, spreekt de HEERE.", "Jer 30:19": "En van hen zal dankzegging uitgaan, en een stem van spelende mensen; en Ik zal hen vermeerderen, en zij zullen niet minder worden, en Ik zal hen verheerlijken, en zij zullen niet gering worden.", "Jer 33:2": "Zo zegt de HEERE, Die het doet, de HEERE, Die dat vormt, opdat Hij het bevestigt, HEERE is Zijn Naam;", "Pred 1:10": "Is er iets waarvan men zou kunnen zeggen: Kijk, dit is nieuw? Het is er al geweest, in de tijden die voor ons geweest zijn.", "Jes 3:12": "De drijvers van Mijn volk zijn kinderen, en vrouwen heersen over hen. O Mijn volk! die u leiden, verleiden u, en de weg van uw paden slokken zij in.", "Ef 2:1-3": "En u heeft Hij mede levend gemaakt, terwijl u dood was door de misdaden en de zonden; waarin u eertijds gewandeld hebt, naar de eeuw van deze wereld, naar de leider van de macht van de lucht, van de geest die nu werkt in de kinderen van de ongehoorzaamheid; onder wie ook wij allen eertijds verkeerd hebben, in de begeerten van ons vlees, terwijl wij deden de wil van het vlees en van de gedachten; en wij waren van nature kinderen van de toorn, net als ook de anderen;", "Spr 17:27": "Wie kennis heeft, houdt zijn woorden in; en een man van verstand is kostbaar van geest.", "Jes 45:12": "Ik heb de aarde gemaakt, en Ik heb de mens daarop geschapen; Ik ben het! Mijn handen hebben de hemelen uitgebreid, en Ik heb heel hun leger bevel gegeven.", "Neh 5:7-9": "En mijn hart beraadslaagde in mij; daarna berispte ik de edelen en de overheden, en zei tegen hen: U vordert een last, ieder van zijn broeder. Vervolgens riep ik een grote vergadering tegen hen bijeen. En ik zei tegen hen: Wij hebben onze broeders, de Joden, die aan de heidenen verkocht waren, naar ons vermogen teruggekocht; en zouden u ook uw broeders verkopen, of zouden zij aan ons verkocht worden? Toen zwegen zij en vonden geen antwoord. Verder zei ik: De zaak die u doet, is niet goed; zou u niet wandelen in de vreze van onze God, om de smaad van de heidenen, onze vijanden?", "Deut 29:9": "Houdt dan de woorden van dit verbond, en doet ze; opdat u verstandig handelt in alles, wat u doen zult.", "Hebr 3:4": "Want ieder huis wordt door iemand gebouwd; maar Die dit alles gebouwd heeft, is God.", "Jes 38:10-13": "Ik zei: Vanwege het afsnijden van mijn dagen zal ik naar de poorten van het graf gaan, ik word beroofd van wat er nog over is van mijn jaren. Ik zei: Ik zal de HEERE niet meer zien, de HEERE, in het land van de levenden; ik zal de mensen niet meer aanschouwen met de inwoners van de wereld. Mijn levenstijd is weggetrokken, en van mij weggevoerd als de tent van een herder; ik heb mijn leven afgesneden, zoals een wever zijn weefsel; Hij zal mij afsnijden, als van de drom; van de dag tot de nacht zult U mij ten einde gebracht hebben.", "Ex 22:21": "U mag de vreemdeling geen onrecht aandoen, en hem ook niet onderdrukken; want u bent zelf vreemdeling geweest in het land Egypte.", "Spr 21:18": "De goddeloze is een rantsoen voor de rechtvaardigen, en de trouweloze voor de oprechten.", "Jer 31:35-37": "Zo zegt de HEERE, Die de zon overdag tot een licht geeft, de ordeningen van de maan en van de sterren tot een licht in de nacht, Die de zee klieft, zodat haar golven bruisen, HEERE van de heerscharen is Zijn Naam: Als deze ordeningen van voor Mijn aangezicht zullen wijken, spreekt de HEERE, dan zal ook het nageslacht van Israël ophouden een volk te zijn voor Mijn aangezicht, alle dagen. Zo zegt de HEERE: Als de hemelen daarboven gemeten, en de fundamenten van de aarde beneden doorgrond kunnen worden, dan zal Ik ook het hele nageslacht van Israël verwerpen, om alles wat zij gedaan hebben, spreekt de HEERE.", "Job 10:10": "Hebt U mij niet als melk uitgegoten, en mij als een kaas laten stremmen?", "Joh 6:47": "Voorwaar, voorwaar, Ik zeg u: wie in Mij gelooft, heeft het eeuwige leven.", "Ps 107:1-43": "Loof de HEERE, want Hij is goed; want Zijn goedertierenheid is voor eeuwig. Laat dat de bevrijden van de HEERE zeggen, die Hij uit de hand van de tegenstander bevrijd heeft. En hen die Hij uit de landen verzameld heeft, van het oosten en van het westen, van het noorden en van de zee.", "Job 26:7-13": "Hij breidt het noorden uit over de leegte; Hij hangt de aarde aan een niets. Hij bindt het water in Zijn wolken; toch scheurt de wolk daaronder niet. Hij houdt het aanzien van het troon vast; Hij spreidt Zijn wolk daarover.", "Gen 49:20": "Van Aser, zijn brood zal vet zijn; en hij zal koninklijke lekkernijen leveren.", "Ps 145:15": "Ain. Aller ogen wachten op U; en U geeft hun hun voedsel op de juiste tijd.", "Hos 2:7": "Zij erkent echter niet dat Ik haar het koren, de nieuwe wijn, en de olie gegeven heb, en haar het zilver en goud vermeerderd heb, dat zij voor de Baäl gebruikt hebben.", "Ps 139:6": "De kennis is mij te wonderbaar, ze is hoog, ik kan er niet bij.", "Spr 3:19": "De HEERE heeft de aarde door wijsheid gegrond, de hemelen door verstandigheid bereid.", "Tit 2:4": "Opdat zij de jonge vrouwen leren bezonnen te zijn, hun mannen lief te hebben, hun kinderen lief te hebben;", "Gen 30:30-43": "Want het weinige dat u voor mij had, is uitgebroken tot een menigte; en de HEERE heeft u gezegend bij mijn komst; nu dan, wanneer zal ik ook voor mijn eigen huis werken? En hij zei: Wat zal ik u geven? Toen zei Jakob: U hoeft mij helemaal niets te geven, als u mij dit wilt doen; ik zal opnieuw uw kudde weiden en bewaren. Ik zal heden door heel uw kudde gaan, en daaruit afzonderen al het gespikkelde en geplekte vee, en al het bruine vee onder de lammeren, en het geplekte en gespikkelde onder de geiten; en dat zal mijn loon zijn.", "Pred 6:12": "Want wie weet wat goed is voor de mens in dit leven, gedurende het aantal dagen van het leven van zijn ijdelheid, dat hij doorbrengt als een schaduw? Want wie kan de mens aanzeggen wat na hem wezen zal onder de zon?", "Ezra 1:1": "In het eerste jaar nu van Kores, koning van Perzië, opdat het woord van de HEERE, uit de mond van Jeremia, volbracht werd, wekte de HEERE de geest van Kores, koning van Perzië, op, zodat hij een boodschap liet doorgeven door heel zijn koninkrijk, zelfs ook op schrift, en zei:", "Hand 13:34-37": "En dat Hij Hem uit de doden heeft opgewekt, zodat Hij niet meer tot verderving zal terugkeren, heeft Hij zo gezegd: Ik zal u de weldaden van David geven, die betrouwbaar zijn; Daarom zegt hij ook in een andere psalm: U zult Uw Heilige geen verderving laten zien. Want David is, nadat hij in zijn tijd de raad van God gediend had, ontslapen, en is bij zijn vaderen gelegd, en heeft wel verderving gezien;", "Lev 25:20-22": "En als u zou zeggen: Wat zullen wij eten in het zevende jaar! Zie, wij zullen niet zaaien, en onze opbrengst niet inzamelen; Dan zal Ik Mijn zegen gebieden over u in het zesde jaar, dat het de opbrengst voor drie jaar zal voortbrengen. Het achtste jaar nu zult u zaaien, en zult van de oude opbrengst eten, tot het negende jaar toe; totdat zijn opbrengst binnengekomen is, zult u het oude eten.", "Ps 126:5": "Die met tranen zaaien, zullen met gejuich maaien.", "Gen 28:21": "en ik in vrede naar het huis van mijn vader terugkeer, dan zal de HEERE mij tot een God zijn!", "Hebr 13:14": "Want wij hebben hier geen blijvende stad, maar wij zoeken de toekomstige.", "Spr 20:15": "Goud is er, en een menigte van robijnen; maar de lippen van de wetenschap zijn een kostbaar kleinood.", "Ps 33:7": "Hij verzamelt de wateren van de zee als op een hoop; Hij legt de diepten in schatkamers.", "Dan 7:10": "Een vurige rivier vloeide, en ging voor Hem uit, duizendmaal duizenden dienden Hem, en tien duizendmaal tien duizenden stonden voor Hem; het gericht zette zich, en de boeken werden geopend.", "Ps 135:7": "Hij doet dampen opklimmen van het einde van de aarde; Hij maakt de bliksemen met de regen; Hij brengt de wind uit Zijn schatkamers voort.", "Amos 6:12": "Zullen paarden ook rennen op een steenrots? Zal men daarop ook met runderen ploegen? Want u hebt het recht in gal veranderd, en de vrucht van de gerechtigheid in alsem.", "Jer 51:21": "En door u zal Ik in stukken slaan het paard en zijn ruiter; en door u zal Ik in stukken slaan de wagen en zijn ruiter.", "Gen 18:20": "Verder zei de HEERE: Omdat het geroep van Sodom en Gomorra groot is, en omdat hun zonde zeer zwaar is,", "Jer 9:24": "Maar wie zich beroemt, beroemt zich hierin, dat hij begrijpt, en Mij kent, dat Ik de HEERE ben, Die weldadigheid, recht en gerechtigheid doe op de aarde, want in die dingen heb Ik behagen, spreekt de HEERE.", "Spr 27:12": "De schrandere ziet het kwaad, en verbergt zich; de eenvoudigen gaan door, en worden gestraft.", "Neh 9:5": "En de Levieten, Jesua, en Kadmiel, Bani, Hasabneja; Serebja, Hodia, Sebanja, Petahja, zeiden: Sta op, loof de HEERE, uw God, van eeuwigheid tot in eeuwigheid; en men love de Naam van Uw heerlijkheid, die verhoogd is boven alle lof en prijs!", "2 Petr 2:7-9": "en de rechtvaardige Lot, die vermoeid was door de losbandige levenswijze van de goddeloze mensen, daaruit verlost heeft; (want deze rechtvaardige man, die onder hen woonde, heeft dag na dag zijn rechtvaardige ziel gekweld door het zien en horen van hun onrechtvaardige daden); dan weet de Heere hoe Hij de godvruchtigen uit de verzoeking moet verlossen, en de onrechtvaardigen moet bewaren tot de dag van het oordeel om gestraft te worden;", "Ps 37:19": "Zij zullen niet beschaamd worden in de kwade tijd, en in de dagen van het honger zullen zij verzadigd worden.", "Ex 20:5": "U zult zich daarvoor niet buigen, en ze niet dienen; want Ik, de HEERE, uw God, ben een ijverig God, Die de misdaad van de vaders bezoek aan de kinderen, aan het derde en aan het vierde geslacht van hen die Mij haten;", "Jer 32:17": "Ach, Heere HEERE! Zie, U hebt de hemel en de aarde gemaakt, door Uw grote kracht en door Uw uitgestrekte arm; niets is voor U te wonderlijk.", "Ps 86:8": "Onder de goden is niemand U gelijk, Heere! en er zijn geen werken gelijk aan Uw werken.", "Job 14:5-12": "Omdat zijn dagen bepaald zijn, het aantal van zijn maanden bij U bekend is, en U zijn grenzen gesteld hebt, die hij niet zal overschrijden; Wend U van hem af, zodat hij rust heeft, totdat hij als een dagloner een welgevallen heeft aan zijn dag. Want voor een boom is er, als hij wordt omgehakt, nog verwachting dat hij opnieuw zal uitlopen, en dat zijn scheut niet zal ophouden.", "Ef 4:22": "Namelijk dat u zou afleggen, wat betreft de vorige levenswandel, de oude mens, die verdorven wordt door de begeerten van de verleiding;", "Jes 26:11": "HEERE, is Uw hand verhoogd, zij zien het niet; maar zij zullen het zien, en beschaamd worden, vanwege de ijver over Uw volk, ook zal het vuur Uw tegenstanders verteren.", "Jer 10:2": "Zo zegt de HEERE: Leert de weg van de heidenen niet, en schrikt niet van de tekenen van de hemel, omdat de heidenen daarvan schrikken.", "Ps 147:15-18": "Hij zendt Zijn bevel over de aarde; Zijn woord loopt zeer snel. Hij geeft sneeuw als wol; Hij strooit de rijp als as. Hij werpt Zijn ijs neer als stukken; wie kan standhouden voor Zijn koude?", "Jes 26:10": "Wordt de goddeloze genade bewezen, dan leert hij toch geen gerechtigheid; hij doet onrecht in een geheel rechtvaardig land, en hij ziet de hoogheid van de HEERE niet aan.", "Jer 31:35": "Zo zegt de HEERE, Die de zon overdag tot een licht geeft, de ordeningen van de maan en van de sterren tot een licht in de nacht, Die de zee klieft, zodat haar golven bruisen, HEERE van de heerscharen is Zijn Naam:", "Ps 52:3-6": "Wat beroemt u zich in het kwaad, o u geweldige? Gods goedertierenheid duurt toch de hele dag. Uw tong denkt enkel schade uit, als een geslepen scheermes, en werkt bedrog. U hebt het kwade liever dan het goede, de leugen liever dan gerechtigheid te spreken. Sela.", "Hos 11:3": "Ik echter leerde Efraïm lopen; Hij nam ze op Zijn armen, maar zij erkenden niet dat Ik ze genas.", "Ps 150:4": "Loof Hem met de trommel en fluit; loof Hem met snarenspel en orgel!", "Job 26:7-14": "Hij breidt het noorden uit over de leegte; Hij hangt de aarde aan een niets. Hij bindt het water in Zijn wolken; toch scheurt de wolk daaronder niet. Hij houdt het aanzien van het troon vast; Hij spreidt Zijn wolk daarover.", "Dan 2:21": "Want Hij verandert de tijden en de tijdperken; Hij zet koningen af en Hij stelt koningen aan; Hij geeft de wijzen wijsheid, en kennis aan hen die verstand hebben.", "1 Sam 21:5": "David antwoordde de priester, en zei tegen hem: Ja zeker, de vrouwen zijn ons onthouden geweest, gisteren en eergisteren, toen ik uitging, en de spullen van de knechten zijn heilig; en het is brood dat op zekere manier gewoon is, temeer omdat er heden ander in de spullen geheiligd zal worden.", "Pred 6:7-9": "Al de arbeid van de mens is voor zijn mond; en toch wordt de begeerte niet vervuld. Want wat heeft de wijze meer dan de dwaas? Wat heeft de arme meer, die weet te wandelen voor het aangezicht van de levenden? Beter is het aanzien van de ogen, dan het rondzwerven van de begeerte. Dit is ook ijdelheid en kwelling van de geest.", "1 Joh 4:17": "Hierin is de liefde bij ons volmaakt, opdat wij vrijmoedigheid mogen hebben in de dag van het oordeel, namelijk dat wij zijn zoals Hij is, in deze wereld.", "Dan 11:27": "En het hart van beide koningen zal erop gericht zijn kwaad te doen, en aan één tafel zullen zij leugen spreken; en het zal niet lukken, want het zal nog een einde hebben op de vastgestelde tijd.", "1 Joh 3:10": "Hierin zijn de kinderen van God en de kinderen van de duivel openbaar. Ieder die de rechtvaardigheid niet doet, is niet uit God; en ook wie zijn broeder niet liefheeft,", "Ps 18:26": "Bij de goedertierene houdt U Zich goedertieren, bij de oprechte man houdt U Zich oprecht.", "Spr 30:8": "Ijdelheid en leugentaal, doe die ver van mij; armoede of rijkdom, geef mij niet; voed mij met het brood dat mij toebedeeld is;", "Openb 18:8": "Daarom zullen haar plagen op één dag komen, namelijk dood, en rouw, en honger, en zij zal met vuur verbrand worden; want sterk is de Heere God, Die haar oordeelt.", "Job 16:17": "Terwijl er toch geen onrecht in mijn handen is, en mijn gebed zuiver is.", "Joh 14:19": "Nog een korte tijd, en de wereld zal Mij niet meer zien; maar u zult Mij zien; want Ik leef, en u zult leven.", "Job 14:1-4": "De mens, uit een vrouw geboren, leeft maar kort en is vol onrust. Hij komt op als een bloem, en wordt afgesneden; ook vlucht hij als een schaduw, en houdt geen stand. Toch houdt U Uw ogen op zo iemand gericht, en U betrekt mij in het gericht met U.", "Gen 5:1": "Dit is het boek van Adams geslacht. Op de dag dat God de mens schiep, maakte Hij hem naar de gelijkenis van God.", "Ps 119:54": "Uw inzettingen zijn mij gezangen geweest, ter plaatse van mijn vreemdelingschap.", "Ps 66:3": "Zegt tot God: Hoe ontzagwekkend bent U in Uw werken! Om de grootheid van Uw sterkte zullen Uw vijanden zich geveinsd aan U onderwerpen.", "Spr 16:2": "Alle wegen van een man zijn zuiver in zijn eigen ogen; maar de HEERE weegt de geesten.", "Pred 8:11": "Omdat het oordeel over de boze daad niet snel wordt uitgevoerd, daarom is het hart van de mensenkinderen in hen vol om kwaad te doen.", "Ex 23:6-8": "U zult het recht van uw arme niet buigen in zijn geschil. Blijf ver van valse zaken; en de onschuldige en rechtvaardige zult u niet doden; want Ik zal de goddeloze niet rechtvaardigen. Ook zult u geen geschenk aannemen; want het geschenk verblindt de zienden, en het verdraait de zaak van de rechtvaardigen.", "2 Petr 2:4": "Want als God de engelen die gezondigd hebben niet gespaard heeft, maar hen in de hel geworpen heeft en overgegeven heeft aan de ketenen van de duisternis, om tot het oordeel bewaard te worden;", "Jes 33:1": "Wee u, verwoester, die zelf niet verwoest bent, en u, die trouweloos handelt, terwijl men niet trouweloos tegen u gehandeld heeft! Als u het verwoesten volbracht zult hebben, zult u verwoest worden; als u het trouweloos handelen voltooid zult hebben, zal men trouweloos tegen u handelen.", "Ps 102:26-29": "U hebt voormaals de aarde gegrond, en de hemelen zijn het werk van Uw handen; Die zullen vergaan, maar U zult staande blijven; en zij alle zullen als een kleed verouderen; U zult ze veranderen als een gewaad, en zij zullen veranderd zijn. Maar U bent Dezelfde, en Uw jaren zullen niet geëindigd worden.", "Job 24:2-24": "Zij verzetten de landpalen; de kudden roven zij, en weiden ze. De ezel van de wezen drijven zij weg; de os van een weduwe nemen zij te pand. Zij doen de behoeftigen wijken van de weg; samen verstoppen zich de ellendigen van het land.", "Luk 16:10": "Wie getrouw is in het minste, die is ook in het grote getrouw; en wie in het minste onrechtvaardig is, die is ook in het grote onrechtvaardig.", "1 Kron 16:26": "Want al de goden van de volken zijn afgoden; maar de HEERE heeft de hemelen gemaakt.", "Spr 14:10": "Het hart kent zijn eigen bittere droefheid; en een vreemde zal zich met zijn blijdschap niet vermengen.", "2 Kor 5:18": "En dit alles is uit God, Die ons met Zichzelf verzoend heeft door Jezus Christus, en ons de bediening van de verzoening gegeven heeft.", "Klaagl 3:35": "Lamed. Dat men het recht van een man buigt voor het aangezicht van de Allerhoogste;", "Ezra 8:22": "Want ik schaamde mij om van de koning een leger en ruiters te vragen om ons te helpen tegen de vijand, op de weg; omdat wij tegen de koning gesproken hadden en gezegd: De hand van onze God is ten goede over allen die Hem zoeken, maar Zijn sterkte en Zijn toorn over allen die Hem verlaten.", "Pred 5:19": "Want hij zal niet veel denken aan de dagen van zijn leven, omdat God hem antwoord geeft in de blijdschap van zijn hart.", "Job 5:10": "Die de regen geeft op de aarde, en water zendt op de straten;", "Deut 1:10": "De HEERE, uw God, heeft u talrijk gemaakt, en zie, u bent vandaag zo talrijk als de sterren aan de hemel.", "1 Joh 3:15": "Ieder die zijn broeder haat, is een moordenaar; en u weet dat geen moordenaar het eeuwige leven in zich heeft blijven.", "Ps 76:10": "Toen God opstond ten oordeel, om alle zachtmoedigen van de aarde te verlossen. Sela.", "Hand 23:9": "En er ontstond een groot geroep; en de schriftgeleerden van de kant van de Farizeeën stonden op en streden, en zeiden: Wij vinden niets kwaads in deze man; en als een geest of een engel tot hem gesproken heeft, laten wij dan niet tegen God strijden.", "Job 32:4": "Doch Elihu had gewacht op Job in het spreken, omdat zij ouder van dagen waren dan hij.", "Gen 1:29": "En God zei: Zie, Ik heb u al het zaadvormende gewas gegeven dat op de hele aarde is, en alle bomen waaraan zaaddragende boomvruchten zitten; het zal u tot voedsel zijn.", "1 Kor 3:13": "Ieders werk zal openbaar worden; want de dag zal het aan het licht brengen, omdat het door vuur ontdekt wordt; en hoedanig ieders werk is, zal het vuur beproeven.", "Spr 28:16": "Een vorst, die alle verstand mist, is ook zeer onderdrukkend; maar wie de hebzucht haat, zal de dagen verlengen.", "Ps 145:16": "Pe. U doet Uw hand open, en verzadigt alles wat leeft, naar Uw welbehagen.", "Spr 22:11": "Wie de reinheid van het hart liefheeft, wiens lippen aangenaam zijn, diens vriend is de koning.", "Luk 1:36": "En zie, Elizabet, uw nicht, is ook zelf zwanger van een zoon, in haar ouderdom; en dit is de zesde maand voor haar, die onvruchtbaar genoemd werd.", "Job 22:25": "Ja, de Almachtige zal uw overvloedige goud zijn, en uw krachtig zilver zijn;", "Pred 6:10": "Wat iemand ook is, allang is zijn naam genoemd, en het is bekend dat hij een mens is; en dat hij niet kan rechten met wie sterker is dan hij.", "Jes 13:13": "Daarom zal Ik de hemel beroeren, en de aarde zal bewogen worden van haar plaats, vanwege de verbolgenheid van de HEERE van de heerscharen, en vanwege de dag van Zijn hevige toorn.", "Job 14:2": "Hij komt op als een bloem, en wordt afgesneden; ook vlucht hij als een schaduw, en houdt geen stand.", "Ps 119:89-91": "Lamed. O HEERE! Uw woord bestaat in de eeuwigheid in de hemelen. Uw trouw is van geslacht tot geslacht; U hebt de aarde vastgemaakt, en zij blijft staan; Naar Uw verordeningen blijven zij nog heden staan, want zij allen zijn Uw knechten.", "Jer 5:4": "Toch zei ik: Zeker, dit zijn de armen; zij handelen dwaas, omdat zij de weg van de HEERE, het recht van hun God, niet kennen.", "Hand 4:20": "Want wij kunnen niet nalaten te spreken over wat wij gezien en gehoord hebben.", "Job 36:11": "Als zij horen, en Hem dienen, dan zullen zij hun dagen eindigen in het goede, en hun jaren in liefelijkheden.", "Ps 68:21": "Die God is voor ons een God van volkomen zaligheid; en bij de HEERE, de Heere, zijn de uitkomsten tegen de dood.", "Ezech 16:47": "Toch hebt u niet in hun wegen gewandeld, noch naar hun gruwelen gedaan; het was iets van het geringe, een verdriet; maar u hebt het meer verdorven dan zij, in al uw wegen.", "2 Kon 8:9": "Zo ging Hazaël hem tegemoet, en nam een geschenk mee, namelijk al het goede van Damaskus, een last van veertig kamelen; en hij kwam, en stond voor hem, en zei: Uw zoon Benhadad, de koning van Syrië, heeft mij naar u gezonden om te vragen: Zal ik van deze ziekte genezen?", "Zach 9:17": "Want hoe groot zal zijn goed wezen en hoe groot zal zijn schoonheid wezen! Het koren zal de jongelingen, en de most zal de jonkvrouwen sprekend maken.", "Zef 1:8": "En het zal gebeuren in de dag van het slachtoffer van de HEERE, dat Ik bezoeking zal doen over de vorsten, en over de kinderen van de koning, en over allen die zich kleden met vreemde kleding.", "Job 14:17": "Mijn overtreding is in een bundeltje verzegeld, en U pakt mijn ongerechtigheid opeen.", "Ps 119:155": "Het heil is ver van de goddelozen, want zij zoeken Uw inzettingen niet.", "Ps 115:16": "Wat de hemel betreft, de hemel is van de HEERE; maar de aarde heeft Hij aan de mensenkinderen gegeven.", "Mark 8:35-37": "Want wie zijn leven zal willen behouden, die zal het verliezen; maar wie zijn leven zal verliezen, omwille van Mij, en omwille van het Evangelie, die zal het behouden. Want wat zou het de mens baten als hij de hele wereld zou winnen, en schade zou lijden aan zijn ziel? Of wat zal een mens geven, als losprijs voor zijn ziel?", "Num 23:19": "God is geen man, dat Hij zou liegen, en ook geen mensenkind, dat het Hem berouwen zou; zou Hij het zeggen, en het niet doen, of spreken, en het niet waarmaken?", "2 Kor 5:1": "Want wij weten dat als ons aardse huis, deze tent, afgebroken wordt, wij een gebouw van God hebben, een huis niet met handen gemaakt, maar eeuwig, in de hemelen.", "Spr 11:12-14": "Wie zonder verstand is, veracht zijn naaste; maar een man van groot verstand zwijgt stil. Wie als een achterklapper rondgaat, openbaart het geheime; maar wie trouw is van geest, bedekt de zaak. Als er geen wijs beleid is, valt het volk; maar de behoudenis is in de veelheid van raadslieden.", "Ps 36:2-5": "De overtreding van de goddeloze spreekt in het binnenste van mijn hart: Er is geen vreze van God voor zijn ogen. Want hij vleit zichzelf in zijn ogen, als men zijn ongerechtigheid bevindt, die te haten is. De woorden van de mond van hem zijn onrecht en bedrog; hij laat na te verstaan tot weldoen.", "Ps 85:11": "De goedertierenheid en waarheid zullen elkaar ontmoeten; de gerechtigheid en vrede zullen elkaar kussen.", "Klaagl 1:18": "Tsade. De HEERE is rechtvaardig, want ik ben Zijn mond opstandig geweest; hoort toch, alle volken, en ziet mijn smart; mijn jonkvrouwen en mijn jongelingen zijn in de gevangenschap gegaan.", "Jer 22:1-4": "Zo zegt de HEERE: Ga naar het huis van de koning van Juda, en spreek daar dit woord. En zeg: Hoor het woord van de HEERE, koning van Juda, u die zit op de troon van David, u, en uw dienaren, en uw volk, die door deze poorten binnengaan! Zo zegt de HEERE: Doe recht en gerechtigheid, en red de beroofde uit de hand van de verdrukker; en onderdruk de vreemdeling niet, de wees, noch de weduwe; doe geen geweld en vergiet geen onschuldig bloed op deze plaats.", "2 Sam 18:18": "Absalom nu had tijdens zijn leven voor zichzelf een gedenkzuil opgericht, die in het koningsdal staat; want hij zei: Ik heb geen zoon om aan mijn naam te doen denken; en hij had die zuil naar zijn eigen naam genoemd; daarom wordt die tot op deze dag Absaloms hand genoemd.", "Ps 9:9": "En Hij Zelf zal de wereld richten in gerechtigheid, en de volken oordelen in rechtmatigheden.", "Ps 82:2-4": "Hoelang zult u onrecht oordelen, en het aangezicht van de goddelozen aannemen? Sela. Doe recht aan de arme en de wees; geef recht aan de verdrukte en de arme. Verlos de arme en de behoeftige, ruk hem uit de hand van de goddelozen.", "1 Tess 5:10": "Die voor ons gestorven is, opdat wij, hetzij dat wij waken, hetzij dat wij slapen, samen met Hem zouden leven.", "Spr 15:13": "Een vrolijk hart maakt het gezicht blij; maar door verdriet in het hart wordt de geest verslagen.", "Matt 23:14": "Wee u, Schriftgeleerden en Farizeeën, huichelaars, want u eet de huizen van de weduwen op, en dat onder de schijn van lang te bidden; daarom zult u des te zwaarder oordeel ontvangen.", "Job 32:8": "Zeker, de geest die in de mens is, en de inblazing van de Almachtige, maakt hen verstandig.", "Ps 6:6": "Want in de dood is aan U geen gedachtenis; wie zal U loven in het graf?", "Job 26:14": "Zie, dit zijn nog maar de uiterste randen van Zijn wegen; en wat een klein stukje van de zaak hebben wij van Hem gehoord? Wie zou dan de donder van Zijn machtige daden kunnen begrijpen?", "Luk 10:25-28": "En zie, een wetgeleerde stond op, om Hem op de proef te stellen, en zei: Meester, wat moet ik doen om het eeuwige leven te beërven? En Hij zei tegen hem: Wat staat er in de wet geschreven? Hoe leest u het? En hij antwoordde: U zult de Heere, uw God, liefhebben met heel uw hart, en met heel uw ziel, en met heel uw kracht, en met heel uw verstand; en uw naaste als uzelf.", "Ps 145:17": "Tsade. De HEERE is rechtvaardig in al Zijn wegen, en goedertieren in al Zijn werken.", "Spr 16:20": "Wie op het woord verstandig let, zal het goede vinden; en wie op de HEERE vertrouwt, is gelukkig.", "Ps 92:16": "Om te verkondigen dat de HEERE recht is; Hij is mijn Rotssteen, en in Hem is geen onrecht.", "Luk 11:41": "Geef liever als aalmoes wat erin is; en zie, dan is alles voor u rein.", "Ps 51:6": "Tegen U, U alleen, heb ik gezondigd, en gedaan wat kwaad is in Uw ogen; opdat U rechtvaardig bent in Uw spreken, en rein bent in Uw oordelen.", "Ps 40:9": "Ik heb lust, o mijn God! om Uw welbehagen te doen; en Uw wet is in het midden van mijn ingewand.", "Deut 15:4": "Alleen zal er geen bedelaar onder u zijn; want de HEERE zal u overvloedig zegenen in het land dat de HEERE, uw God, u als erfdeel zal geven om het erfelijk te bezitten;", "Jes 46:3": "Hoor naar Mij, o huis van Jakob, en het hele overblijfsel van het huis van Israël! Die van Mij gedragen zijn vanaf de buik af, en opgenomen vanaf de baarmoeder af.", "Ps 33:15": "Hij vormt hun aller hart; Hij let op al hun werken.", "Matt 9:15": "En Jezus zei tegen hen: Kunnen de bruiloftsgasten treuren, zolang de Bruidegom bij hen is? Maar de dagen zullen komen, wanneer de Bruidegom van hen weggenomen zal zijn, en dan zullen zij vasten.", "Jes 25:8": "Hij zal de dood verslinden tot overwinning, en de Heere HEERE zal de tranen van alle aangezichten afwissen; en Hij zal de smaad van Zijn volk van de hele aarde wegnemen; want de HEERE heeft het gesproken.", "Gen 49:24": "Maar zijn boog is in stevigheid gebleven, en de armen van zijn handen zijn gesterkt, door de handen van de Machtige van Jakob; vandaar is hij een herder, een steen van Israël;", "Jer 27:6": "En nu, Ik heb al deze landen gegeven in de hand van Nebukadnezar, de koning van Babel, Mijn knecht; zelfs ook de dieren van het veld heb Ik hem gegeven, om hem te dienen.", "Pred 4:2": "Daarom prees ik de doden, die al gestorven waren, boven de levenden, die tot nu toe levend zijn.", "Jes 31:2": "Toch is Hij ook wijs, en Hij doet het kwaad komen, en trekt Zijn woorden niet terug; maar Hij zal Zich opmaken tegen het huis van de boosdoeners, en tegen de hulp van hen die ongerechtigheid werken.", "Hebr 6:17": "waarbij God, omdat Hij aan de erfgenamen van de belofte overvloediger de onveranderlijkheid van Zijn raad wilde tonen, er een eed tussen heeft gebracht;", "Job 36:19": "Zou Hij uw rijkdom achten, zodat u niet in benauwdheid zou zijn; of alle versterkingen van kracht?", "Hebr 2:14": "Omdat nu de kinderen deel hebben aan vlees en bloed, heeft Hij Zelf op dezelfde manier daaraan deelgenomen, opdat Hij door de dood hem teniet zou doen die de macht over de dood had, dat is: de duivel;", "1 Petr 1:17": "En als u Hem als Vader aanroept, Die zonder aanzien des persoons oordeelt naar ieders werk, leef dan in ontzag gedurende de tijd van uw verblijf hier als vreemdeling;", "Jes 66:2": "Want Mijn hand heeft al deze dingen gemaakt, en al deze dingen zijn geweest, spreekt de HEERE; maar op deze zal Ik zien, op de arme en verslagene van geest, en die voor Mijn woord beeft.", "Ps 89:13": "Het noorden en het zuiden, die hebt Gij geschapen; Thabor en Hermon juichen in Uw Naam.", "Ps 34:10": "Jod. Vreest de HEERE, u, Zijn heiligen! Want die Hem vrezen hebben geen gebrek.", "Ps 37:27": "Samech. Wijk af van het kwade, en doe het goede, en woon in eeuwigheid.", "Matt 6:26": "Kijk naar de vogels van de hemel: zij zaaien niet, maaien niet, en verzamelen niet in schuren; en uw hemelse Vader voedt ze toch. Gaat u ze niet ver te boven?", "Pred 9:5": "Want de levenden weten dat zij zullen sterven, maar de doden weten helemaal niets; zij hebben ook geen loon meer, maar hun gedachtenis is vergeten.", "Hand 5:39": "maar als het uit God is, dan kunt u dat niet breken; anders zou u misschien bevonden worden ook tegen God te strijden.", "1 Kor 2:9": "Maar zoals geschreven is: Wat het oog niet heeft gezien, en het oor niet heeft gehoord, en in het hart van de mens niet is opgekomen, dat wat God bereid heeft voor hen die Hem liefhebben.", "Job 33:12-30": "Zie, hierin bent u niet rechtvaardig, antwoord ik u; want God is meerder dan een mens. Waarom hebt u tegen Hem getwist? Want Hij antwoordt niet van al Zijn daden. Maar God spreekt eens of tweemaal; doch men let daar niet op.", "1 Joh 5:13": "Deze dingen heb ik u geschreven, die gelooft in de Naam van de Zoon van God; opdat u weet dat u het eeuwige leven hebt, en opdat u gelooft in de Naam van de Zoon van God.", "Luk 12:22-31": "En Hij zei tegen Zijn discipelen: Daarom zeg Ik u: wees niet bezorgd voor uw leven, wat u eten zult, en ook niet voor het lichaam, waarmee u zich kleden zult. Het leven is meer dan het voedsel, en het lichaam meer dan de kleding. Kijk naar de raven: zij zaaien niet en maaien niet, zij hebben geen voorraadkamer of schuur, en God voedt ze; hoeveel meer bent u dan de vogels waard?", "Deut 15:4-6": "Alleen zal er geen bedelaar onder u zijn; want de HEERE zal u overvloedig zegenen in het land dat de HEERE, uw God, u als erfdeel zal geven om het erfelijk te bezitten; Als u alleen maar de stem van de HEERE, uw God, vlijtig gehoorzaamt, zodat u erop let te doen al deze geboden die ik u vandaag gebied. Want de HEERE, uw God, zal u zegenen, zoals Hij tot u heeft gesproken; zo zult u aan veel volken lenen, maar u zult niet lenen; en u zult over veel volken heersen, maar over u zullen zij niet heersen.", "Jer 20:12": "Gij dan, o HEERE van de heerscharen, Die de rechtvaardige beproeft, Die de nieren en het hart ziet, laat mij Uw wraak op hen zien, want ik heb U mijn rechtszaak voorgelegd.", "Lev 26:4-10": "Dan zal Ik uw regens geven op hun tijd; en het land zal zijn opbrengst geven, en het geboomte van het veld zal zijn vrucht geven; En de dorstijd zal u reiken tot de wijnoogst, en de wijnoogst zal reiken tot de zaaitijd; en u zult uw brood eten tot verzadiging toe, en u zult zeker in uw land wonen. Ook zal Ik vrede geven in het land, zodat u zult gaan slapen, en niemand is er die u verschrikt; en Ik zal het boze gedierte uit het land doen ophouden, en het zwaard zal door uw land niet doorgaan.", "Openb 22:12": "En zie, Ik kom haastig, en Mijn loon is met Mij, om ieder te vergelden zoals zijn werk zal zijn.", "Joh 7:30": "Zij probeerden Hem dan te grijpen; maar niemand sloeg de hand aan Hem, want Zijn uur was nog niet gekomen.", "Pred 10:12": "De woorden van de mond van een wijze zijn aangenaam; maar de lippen van een dwaas verslinden hemzelf.", "1 Kor 7:34": "Een vrouw en een maagd zijn verschillend. De ongetrouwde bekommert zich met de dingen van de Heere, opdat zij heilig is, zowel naar lichaam als naar geest; maar wie getrouwd is, bekommert zich met de dingen van de wereld, hoe zij de man zal behagen.", "Matt 22:11-13": "En toen de koning binnenkwam om de gasten te bekijken die aanzaten, zag hij daar een man die geen bruiloftskleed aanhad; En hij zei tegen hem: Vriend! Hoe bent u hier binnengekomen zonder een bruiloftskleed aan te hebben? En hij verstomde. Toen zei de koning tegen de dienaars: Bind zijn handen en voeten, neem hem mee en werp hem in de buitenste duisternis; daar zal het huilen zijn en het geknars van de tanden.", "Spr 15:7": "De lippen van de wijzen zullen de wetenschap uitstrooien; maar het hart van de zotten niet zo.", "Job 37:18": "Hebt u met Hem de hemelen uitgespannen, die vast zijn, als een gegoten spiegel?", "Pred 9:12": "Want ook de mens kent zijn tijd niet: zoals de vissen die gevangen worden met een kwaadaardig net, en zoals de vogels die gevangen worden met de strik, zo worden de mensenkinderen verstrikt, op een kwade tijd, wanneer die plotseling over hen valt.", "Ps 44:4": "Want zij hebben het land niet geërfd door hun zwaard, en hun arm heeft hun geen heil gegeven; maar Uw rechterhand, en Uw arm, en het licht van Uw aangezicht, omdat U een welbehagen in hen had.", "Jes 8:9": "Verzamel u samen, volken! Toch zult u verbroken worden; en neem het ter ore, allen die in verre landen bent, omgord u, toch zult u verbroken worden; omgord u, toch zult u verbroken worden!", "Ex 20:11": "want in zes dagen heeft de HEERE de hemel en de aarde gemaakt, de zee en alles wat daarin is, en Hij rustte op de zevende dag; daarom zegende de HEERE de sabbatdag en heiligde hem.", "Ps 92:8": "Dat de goddelozen groeien als het gras, en al de werkers van de ongerechtigheid bloeien, opdat zij tot in eeuwigheid weggevaagd worden.", "Spr 21:23": "Wie zijn mond en zijn tong bewaart, bewaart zijn ziel van benauwdheden.", "Amos 5:12": "Want Ik weet dat uw overtredingen talrijk, en uw zonden machtig veel zijn; zij benauwen de rechtvaardige, nemen steekpenningen aan, en verdringen de behoeftigen in de poort.", "1 Sam 24:16": "Doch de HEERE zal Rechter zijn, en rechtspreken tussen mij en tussen u, en zien daarin, en mijn geschil beslechten, en mij redden uit uw hand.", "Amos 4:1": "Hoor dit woord, koeien van Basan, u die op de berg van Samaria bent, die de armen verdrukt, die de behoeftigen verplettert; u die tegen uw heren zegt: Breng aan, opdat wij drinken.", "1 Kon 5:4": "Maar nu heeft de HEERE, mijn God, mij van rondom rust gegeven; er is geen tegenstander, en geen tegenslag van kwaad.", "Hand 26:8": "Wat? Wordt het bij u ongelooflijk geoordeeld dat God de doden opwekt?", "Joh 13:7": "Jezus antwoordde en zei tegen hem: Wat Ik doe, weet u nu niet, maar u zult het hierna verstaan.", "Joz 10:27": "En het gebeurde, ten tijde dat de zon onderging, dat Jozua beval dat men hen van de bomen afnam, en zij wierpen hen in de grot, waar zij verborgen geweest waren; en zij legden grote stenen voor de opening van de grot, die daar zijn tot op deze zelfde dag.", "Neh 8:10-13": "En Nehemia (dat is Hattirsatha) en Ezra, de priester, de schriftgeleerde, en de Levieten die het volk onderwezen, zeiden tegen heel het volk: Deze dag is heilig voor de HEERE, uw God; bedrijf dan geen rouw en huil niet; want heel het volk huilde toen zij de woorden van de wet hoorden. Verder zei hij tegen hen: Ga, eet het vette, en drink het zoete, en stuur delen aan hen voor wie niets bereid is, want deze dag is heilig voor onze Heere; wees dus niet bedroefd, want de blijdschap van de HEERE, die is uw sterkte. En de Levieten stilden heel het volk, en zeiden: Wees stil, want deze dag is heilig, dus wees niet bedroefd.", "Ezech 3:7": "Maar het huis Israëls wil naar u niet horen, omdat zij naar Mij niet willen horen; want het hele huis Israëls is stijf van voorhoofd, en hard van hart zijn zij.", "Ps 40:6": "Gij, o HEERE, mijn God! hebt Uw wonderen en Uw gedachten aan ons vele gemaakt, men kan ze niet in orde bij U verhalen; zal ik ze verkondigen en uitspreken, dan zijn ze menigvuldiger dan dat ik ze zou kunnen vertellen.", "Matt 8:29": "En zie, zij riepen: Jezus, Zoon van God, wat hebben wij met U te maken? Bent U hier gekomen om ons te pijnigen vóór de tijd?", "1 Kron 16:33": "Dan zullen de bomen van het woud juichen voor het aangezicht van de HEERE, omdat Hij komt om de aarde te richten.", "Ps 135:6-12": "Al wat de HEERE behaagt, doet Hij, in de hemelen en op de aarde, in de zeeën en alle afgronden. Hij doet dampen opklimmen van het einde van de aarde; Hij maakt de bliksemen met de regen; Hij brengt de wind uit Zijn schatkamers voort. Die de eerstgeborenen van Egypte sloeg, van de mens af tot het vee toe.", "Pred 12:7": "En het stof terugkeert tot de aarde, zoals het geweest is; en de geest terugkeert tot God, Die hem gegeven heeft.", "Gen 44:34": "Want hoe zou ik optrekken naar mijn vader, als de jongen niet bij mij was, zodat ik het verdriet niet hoef te zien dat mijn vader zou overkomen.", "Pred 8:15": "Daarom prees ik de blijdschap, omdat de mens niets beters heeft onder de zon, dan te eten, en te drinken, en blijde te zijn; want dat zal hem bijblijven van zijn arbeid, de dagen van zijn leven, die God hem geeft onder de zon.", "Jes 59:15": "Ja, de waarheid ontbreekt, en wie van het boze wijkt, wordt tot een prooi; en de HEERE zag het, en het was kwaad in Zijn ogen, dat er geen recht was.", "Jer 51:10": "De HEERE heeft onze gerechtigheden hervoor gebracht; kom en laat ons in Sion het werk van de HEERE, onze God, vertellen!", "Gen 17:21": "Maar Mijn verbond zal Ik met Izak oprichten, die Sara u op deze vastgestelde tijd in het volgende jaar baren zal.", "Rom 5:12": "Daarom, zoals door één mens de zonde in de wereld ingekomen is, en door de zonde de dood; en zo de dood tot alle mensen doorgegaan is, doordat allen gezondigd hebben.", "Matt 16:25": "Want wie zijn leven zal willen behouden, die zal het verliezen; maar wie zijn leven zal verliezen om Mijnentwil, die zal het vinden.", "Pred 10:16": "Wee u, land, waarvan de koning een kind is, en waarvan de vorsten al in de morgenstond eten!", "Jak 2:26": "Want zoals het lichaam zonder geest dood is, zo is ook het geloof zonder de werken dood.", "Ex 15:20": "En Mirjam, de profetes, de zuster van Aäron, nam een trommel in haar hand; en alle vrouwen gingen achter haar aan, met trommels en met reidansen.", "Job 23:7": "Daar zou de oprechte met Hem pleiten; en ik zou mij voor eeuwig van mijn Rechter vrijmaken.", "Jer 11:15": "Wat heeft Mijn beminde in Mijn huis te doen, terwijl zij die schandelijke daad met velen doet, en het heilige vlees van u geweken is? Wanneer u kwaad doet, dan springt u op van vreugde.", "Spr 14:21": "Wie zijn naaste veracht, zondigt; maar wie zich over de nederigen ontfermt, die is gelukkig.", "Ps 33:12": "Gelukkig is het volk wiens God de HEERE is; het volk, dat Hij Zich als erfdeel heeft uitgekozen.", "Ps 146:4": "Zijn geest gaat uit, hij keert terug tot zijn aarde; op diezelfde dag vergaan zijn plannen.", "2 Petr 2:12-19": "Maar dezen, als onredelijke dieren, die de natuur volgen en geboren zijn om gevangen en gedood te worden, lasteren wat zij niet begrijpen, en zullen in hun verdorvenheid ook zelf verdorven worden; en zij zullen het loon van de onrechtvaardigheid ontvangen, omdat zij het als een genot beschouwen dagelijks in weelde te leven; zij zijn vlekken en smetten, en genieten uitbundig van hun eigen bedrog, terwijl zij met u aan de maaltijd zijn; zij hebben ogen vol overspel, die niet ophouden met zondigen; zij verleiden onvaste zielen, hebben een hart geoefend in hebzucht, en zijn kinderen van de vervloeking;", "1 Tim 6:13": "Ik beveel u voor het aangezicht van God, Die alles levend maakt, en van Christus Jezus, Die onder Pontius Pilatus de goede belijdenis heeft afgelegd,", "Ps 33:11": "Maar de raad van de HEERE bestaat in eeuwigheid, de gedachten van Zijn hart van geslacht tot geslacht.", "1 Sam 20:2": "Hij daarentegen zei tegen hem: Dat zij verre, u zult niet sterven. Zie, mijn vader doet geen grote zaak, en geen kleine zaak, die hij niet aan mij bekendmaakt; waarom zou dan mijn vader deze zaak voor mij verbergen? Dat is niet zo.", "Pred 9:3": "Dit is een kwaad onder alles wat er onder de zon gebeurt, dat eenzelfde lot allen treft, en dat ook het hart van de mensenkinderen vol boosheid is, en dat er in hun leven onzinnigheden zijn in hun hart; en daarna moeten zij naar de doden toe.", "Spr 18:4": "De woorden uit de mond van een man zijn diepe wateren; en de bron van wijsheid is een stromende beek.", "2 Kor 9:8-10": "En God is machtig alle genade in u overvloedig te maken; opdat u in alles, te allen tijde, met alle genoegzaamheid, overvloedig kunt zijn tot alle goed werk. Zoals er ge
