<style>

  /* verzen — tabsmodus (één kolom) */

  .vers:hover { background: var(--bg-soft); }
  .vers.open { background: var(--bg-soft); box-shadow: inset 3px 0 0 var(--accent); border-radius: 8px 8px 0 0; }

  @keyframes flits { 0% { background: #e0e0e0; } 100% { background: var(--bg-soft); } }

  .vtekst em, .pcel em { font-style: italic; color: #555; }

  .vers:hover .kopieer { opacity: .75; }
  .kopieer:hover { opacity: 1 !important; }

  #bijbel.parallel .vers { display:grid; gap:.8rem; cursor:pointer; align-items:start; }
  #bijbel.parallel .vnr { grid-row: 1; }
  .kolomkop { display:none; }
  #bijbel.parallel + .kolomkop, .kolomkop.tonen { }
  .pk { font-family:"Lora"; font-size:.72rem; text-transform:uppercase; letter-spacing:.12em; color:var(--accent-donker); font-weight:700; }
  #bijbel.parallel .pcel em { font-style:italic; color:#555; }

e aarde nu was woest en leeg, en duisternis lag op de diepte[1]; en de Geest van God zweefde over de wateren.","3":"En God zei: Laat er licht zijn! En er was licht.","4":"En God zag het licht, dat het goed was; en God maakte scheiding tussen het licht en de duisternis.","5":"En God noemde het licht dag, en de duisternis noemde Hij nacht. Toen was het avond geweest en het was morgen geweest: de eerste dag.","6":"En God zei: Laat er een uitspansel[2] zijn in het midden van de wateren, en laat dat scheiding maken tussen wateren en wateren!","7":"En God maakte dat uitspansel, en maakte scheiding tussen de wateren die onder het uitspansel zijn, en de wateren die boven het uitspansel zijn. En het was zo.","8":"En God noemde het uitspansel hemel. En het was avond geweest en het was morgen geweest: de tweede dag.","9":"En God zei: Laten de wateren van onder de hemel op één plaats samenvloeien, en laat het droge gezien worden! En het was zo.","10":"En God noemde het droge aarde, en het samengevloeide water noemde Hij zeeën; en God zag dat het goed was.","11":"En God zei: Laat de aarde gras voortbrengen, gewas dat zaad voortbrengt, vruchtbomen die vrucht dragen naar hun aard, waarvan het zaad erin zit, op de aarde! En het was zo.","12":"En de aarde bracht grasscheutjes voort, gewas dat zaad voortbrengt naar zijn aard, en vruchtdragende bomen waarvan het zaad erin zit, naar hun aard. En God zag dat het goed was.","13":"Toen was het avond geweest en het was morgen geweest: de derde dag.","14":"En God zei: Laten er lichten zijn aan het uitspansel van de hemel, om scheiding te maken tussen de dag en de nacht; en laten zij zijn tot tekenen en tot vaste tijden, en tot dagen en jaren!","15":"En laten zij tot lichten zijn aan het uitspansel van de hemel, om licht te geven op de aarde! En het was zo.","16":"God maakte dan die twee grote lichten: dat grote licht om te heersen over de dag, en dat kleine licht om te heersen over de nacht; en ook de sterren.","17":"En God stelde ze aan het uitspansel van de hemel, om licht te geven op de aarde,","18":"en om te heersen over de dag en over de nacht, en om scheiding te maken tussen het licht en de duisternis. En God zag dat het goed was.","19":"Toen was het avond geweest en het was morgen geweest: de vierde dag.","20":"En God zei: Laten de wateren wemelen van een overvloed aan levende wezens[3]; en laat het gevogelte boven de aarde vliegen, langs het uitspansel van de hemel!","21":"En God schiep de grote zeedieren[4], en alle levende, wemelende wezens die de wateren in overvloed voortbrachten, naar hun aard; en al het gevleugelde gevogelte naar zijn aard. En God zag dat het goed was.","22":"En God zegende ze en zei: Wees vruchtbaar en word talrijk, en vervul de wateren in de zeeën; en laat het gevogelte talrijk worden op de aarde!","23":"Toen was het avond geweest en het was morgen geweest: de vijfde dag.","24":"En God zei: Laat de aarde levende wezens voortbrengen, naar hun aard: vee, en kruipende dieren, en wilde dieren van de aarde, naar hun aard! En het was zo.","25":"En God maakte de wilde dieren van de aarde naar hun aard, en het vee naar zijn aard, en al de kruipende dieren van de aardbodem naar hun aard. En God zag dat het goed was.","26":"En God zei: Laat Ons mensen maken, naar Ons beeld, naar Onze gelijkenis; en laten zij heersen over de vissen van de zee, en over het gevogelte van de hemel, en over het vee, en over de hele aarde, en over al de kruipende dieren die op de aarde kruipen.","27":"En God schiep de mens naar Zijn beeld; naar het beeld van God schiep Hij hem; man en vrouw schiep Hij hen.","28":"En God zegende hen, en God zei tegen hen: Wees vruchtbaar en word talrijk, en vervul de aarde en onderwerp haar, en heers over de vissen van de zee, en over het gevogelte van de hemel, en over al de dieren die op de aarde kruipen!","29":"En God zei: Zie, Ik heb u al het zaadvormende gewas gegeven dat op de hele aarde is, en alle bomen waaraan zaaddragende boomvruchten zitten; het zal u tot voedsel zijn.","30":"Maar aan al de dieren van de aarde, en aan al het gevogelte van de hemel, en aan al het kruipende gedierte op de aarde, waarin een levende ziel is, heb Ik al het groene gewas tot voedsel gegeven. En het was zo.","31":"En God zag al wat Hij gemaakt had, en zie, het was zeer goed. Toen was het avond geweest en het was morgen geweest: de zesde dag."},"SV":{"1":"In den beginne schiep God den hemel en de aarde.","2":"De aarde nu was woest en ledig, en duisternis *was* op den afgrond; en de Geest Gods zweefde op de wateren.","3":"En God zeide: Daar zij licht! en daar werd licht.","4":"En God zag het licht, dat het goed *was*; en God maakte scheiding tussen het licht en tussen de duisternis.","5":"En God noemde het licht dag, en de duisternis noemde Hij nacht. Toen was het avond geweest, en het was morgen geweest, de eerste dag.","6":"En God zeide: Daar zij een uitspansel in het midden der wateren; en dat make scheiding tussen wateren en wateren!","7":"En God maakte dat uitspansel, en maakte scheiding tussen de wateren, die onder het uitspansel *zijn*, en tussen de wateren, die boven het uitspansel *zijn*. En het was alzo.","8":"En God noemde het uitspansel hemel. Toen was het avond geweest, en het was morgen geweest, de tweede dag.","9":"En God zeide: Dat de wateren van onder den hemel in een plaats vergaderd worden, en dat het droge gezien worde! En het was alzo.","10":"En God noemde het droge aarde, en de vergadering der wateren noemde Hij zeeën; en God zag, dat het goed *was*.","11":"En God zeide: Dat de aarde uitschiete grasscheutjes, kruid zaadzaaiende, vruchtbaar geboomte, dragende vrucht naar zijn aard, welks zaad daarin zij op de aarde! En het was alzo.","12":"En de aarde bracht voort grasscheutjes, kruid zaadzaaiende naar zijn aard, en vruchtdragend geboomte, welks zaad daarin was, naar zijn aard. En God zag, dat het goed *was*.","13":"Toen was het avond geweest, en het was morgen geweest, de derde dag.","14":"En God zeide: Dat er lichten zijn in het uitspansel des hemels, om scheiding te maken tussen den dag en tussen den nacht; en dat zij zijn tot tekenen en tot gezette tijden, en tot dagen en jaren!","15":"En dat zij zijn tot lichten in het uitspansel des hemels, om licht te geven op de aarde! En het was alzo.","16":"God dan maakte die twee grote lichten; dat grote licht tot heerschappij des daags, en dat kleine licht tot heerschappij des nachts; ook de sterren.","17":"En God stelde ze in het uitspansel des hemels, om licht te geven op de aarde.","18":"En om te heersen op den dag, en in den nacht, en om scheiding te maken tussen het licht en tussen de duisternis. En God zag, dat het goed *was*.","19":"Toen was het avond geweest, en het was morgen geweest, de vierde dag.","20":"En God zeide: Dat de wateren overvloediglijk voortbrengen een gewemel van levende zielen; en het gevogelte vliege boven de aarde, in het uitspansel des hemels!","21":"En God schiep de grote walvissen, en alle levende wremelende ziel, welke de wateren overvloediglijk voortbrachten, naar haar aard; en alle gevleugeld gevogelte naar zijn aard. En God zag, dat het goed *was*.","22":"En God zegende ze, zeggende: Zijt vruchtbaar, en vermenigvuldigt, en vervult de wateren in de zeeën; en het gevogelte vermenigvuldige op de aarde!","23":"Toen was het avond geweest, en het was morgen geweest, de vijfde dag.","24":"En God zeide: De aarde brenge levende zielen voort, naar haar aard, vee, en kruipend, en wild gedierte der aarde, naar zijn aard! En het was alzo.","25":"En God maakte het wild gedierte der aarde naar zijn aard, en het vee naar zijn aard, en al het kruipend gedierte des aardbodems naar zijn aard. En God zag, dat het goed *was*.","26":"En God zeide: Laat Ons mensen maken, naar Ons beeld, naar Onze gelijkenis; en dat zij heerschappij hebben over de vissen der zee, en over het gevogelte des hemels, en over het vee, en over de gehele aarde, en over al het kruipend gedierte, dat op de aarde kruipt.","27":"En God schiep den mens naar Zijn beeld; naar het beeld van God schiep Hij hem; man en vrouw schiep Hij ze.","28":"En God zegende hen, en God zeide tot hen: Weest vruchtbaar, en vermenigvuldigt, en vervult de aarde, en onderwerpt haar, en hebt heerschappij over de vissen der zee, en over het gevogelte des hemels, en over al het gedierte, dat op de aarde kruipt!","29":"En God zeide: Ziet, Ik heb ulieden al het zaadzaaiende kruid gegeven, dat op de ganse aarde *is*, en alle geboomte, in hetwelk zaadzaaiende boomvrucht is; het zij u tot spijze!","30":"Maar aan al het gedierte der aarde, en aan al het gevogelte des hemels, en aan al het kruipende gedierte op de aarde, waarin een levende ziel *is*, *heb* *Ik* al het groene kruid tot spijze *gegeven*. En het was alzo.","31":"En God zag al wat Hij gemaakt had, en ziet, *het* *was* zeer goed. Toen was het avond geweest, en het was morgen geweest, de zesde dag."},"KJV":{"1":"In the beginning God created the heaven and the earth.","2":"And the earth was without form, and void; and darkness *was* upon the face of the deep. And the Spirit of God moved upon the face of the waters.","3":"And God said, Let there be light: and there was light.","4":"And God saw the light, that *it was* good: and God divided the light from the darkness.","5":"And God called the light Day, and the darkness he called Night. And the evening and the morning were the first day.","6":"And God said, Let there be a firmament in the midst of the waters, and let it divide the waters from the waters.","7":"And God made the firmament, and divided the waters which *were* under the firmament from the waters which *were* above the firmament: and it was so.","8":"And God called the firmament Heaven. And the evening and the morning were the second day.","9":"And God said, Let the waters under the heaven be gathered together unto one place, and let the dry *land* appear:","10":"And God called the dry *land* Earth; and the gathering together of the waters called he Seas: and God saw that *it was* good.","11":"And God said, Let the earth bring forth grass, the herb yielding seed, *and* the fruit tree yielding fruit after his kind, whose seed *is* in itself, upon the earth:","12":"And the earth brought forth grass, *and* herb yielding seed after his kind, and the tree yielding fruit, whose seed *was* in itself, after his kind: and God saw that *it was* good.","13":"And the evening and the morning were the third day.","14":"And God said, Let there be lights in the firmament of the heaven to divide the day from the night; and let them be for signs, and for seasons, and for days, and years:","15":"And let them be for lights in the firmament of the heaven to give light upon the earth:","16":"And God made two great lights; the greater light to rule the day, and the lesser light to rule the night: *he made* the stars","17":"And God set them in the firmament of the heaven to give light upon the earth,","18":"And to rule over the day and over the night, and to divide the light from the darkness: and God saw that *it was* good.","19":"And the evening and the morning were the fourth day.","20":"And God said, Let the waters bring forth abundantly the moving creature that hath life, and fowl *that* may fly above the earth in the open firmament of heaven.","21":"And God created great whales, and every living creature that moveth, which the waters brought forth abundantly, after their kind, and every winged fowl after his kind: and God saw that *it was* good.","22":"And God blessed them, saying, Be fruitful, and multiply, and fill the waters in the seas, and let fowl multiply in the earth.","23":"And the evening and the morning were the fifth day.","24":"And God said, Let the earth bring forth the living creature after his kind, cattle, and creeping thing, and beast of the earth after his kind:","25":"And God made the beast of the earth after his kind, and cattle after their kind, and every thing that creepeth upon the earth after his kind: and God saw that *it was* good.","26":"And God said, Let us make man in our image, after our likeness: and let them have dominion over the fish of the sea, and over the fowl of the air, and over the cattle, and over all the earth, and over every creeping thing that creepeth upon the earth.","27":"So God created man in his *own* image, in the image of God created he him; male and female created","28":"And God blessed them, and God said unto them, Be fruitful, and multiply, and replenish the earth, and subdue it: and have dominion over the fish of the sea, and over the fowl of the air, and over every living thing that moveth upon the earth.","29":"And God said, Behold, I have given you every herb bearing seed, which *is* upon the face of all the earth, and every tree, in the which *is* the fruit of a tree yielding seed; to you it shall be for meat.","30":"And to every beast of the earth, and to every fowl of the air, and to every thing that creepeth upon the earth, wherein *there is* life, *I have given* every green herb for meat:","31":"And God saw every thing that he had made, and, behold, *it was* very good. And the evening and the morning were the sixth day."}},"tsk":{"1":[{"kopje":"begin","refs":["Spr 8:22-24","Spr 16:4","Mark 13:19","Joh 1:1-3","Hebr 1:10","1 Joh 1:1"]},{"kopje":"vertelde het zijn vader niet","refs":["Ex 20:11","Ex 31:18","1 Kron 16:26","Neh 9:6","Job 26:13","Job 38:4","Ps 8:4","Ps 33:6","Ps 33:9","Ps 89:12","Ps 89:13","Ps 96:5","Ps 102:26","Ps 104:24","Ps 104:30","Ps 115:15","Ps 121:2","Ps 124:8","Ps 134:3","Ps 136:5","Ps 146:6","Ps 148:4","Ps 148:5","Spr 3:19","Spr 8:22-30","Pred 12:1","Jes 37:16","Jes 40:26","Jes 40:28","Jes 42:5","Jes 44:24","Jes 45:18","Jes 51:13","Jes 51:16","Jes 65:17","Jer 10:12","Jer 32:17","Jer 51:15","Zach 12:1","Matt 11:25","Hand 4:24","Hand 14:15","Hand 17:24","Rom 1:19","Rom 1:20","Rom 11:36","1 Kor 8:6","Ef 3:9","Kol 1:16","Kol 1:17","Hebr 1:2","Hebr 3:4","Hebr 11:3","2 Petr 3:5","Openb 3:14","Openb 4:11","Openb 10:6","Openb 14:7","Openb 21:6"," ode=\"H776\">earth,</span> and subdue <span class=\"wl wl-kjv\" data-code=\"H3533\">it:</span> and have <span class=\"wl wl-kjv\" data-code=\"H7287\">dominion</span> over the <span class=\"wl wl-kjv\" data-code=\"H1710\">fish</span> of the <span class=\"wl wl-kjv\" data-code=\"H3220\">sea,</span> and over the <span class=\"wl wl-kjv\" data-code=\"H5775\">fowl</span> of the <span class=\"wl wl-kjv\" data-code=\"H8064\">air,</span> and over every living <span class=\"wl wl-kjv\" data-code=\"H2416\">thing</span> that <span class=\"wl wl-kjv\" data-code=\"H7430\">moveth</span> upon the earth.","29":"And <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H2009\">Behold,</span> I have <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> you every <span class=\"wl wl-kjv\" data-code=\"H6212\">herb</span> <span class=\"wl wl-kjv\" data-code=\"H2232\">bearing</span> <span class=\"wl wl-kjv\" data-code=\"H2233\">seed,</span> which is upon the <span class=\"wl wl-kjv\" data-code=\"H6440\">face</span> of all the <span class=\"wl wl-kjv\" data-code=\"H776\">earth,</span> and every <span class=\"wl wl-kjv\" data-code=\"H6086\">tree,</span> in the which is the <span class=\"wl wl-kjv\" data-code=\"H6529\">fruit</span> of a <span class=\"wl wl-kjv\" data-code=\"H6086\">tree</span> <span class=\"wl wl-kjv\" data-code=\"H2232\">yielding</span> <span class=\"wl wl-kjv\" data-code=\"H2233\">seed;</span> to you it shall <span class=\"wl wl-kjv\" data-code=\"H1961\">be</span> for meat.","30":"And to every <span class=\"wl wl-kjv\" data-code=\"H2416\">beast</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">earth,</span> and to every <span class=\"wl wl-kjv\" data-code=\"H5775\">fowl</span> of the <span class=\"wl wl-kjv\" data-code=\"H8064\">air,</span> and to every thing that <span class=\"wl wl-kjv\" data-code=\"H7430\">creepeth</span> upon the <span class=\"wl wl-kjv\" data-code=\"H776\">earth,</span> wherein there is <span class=\"wl wl-kjv\" data-code=\"H2416\">life,</span> I have given every <span class=\"wl wl-kjv\" data-code=\"H3418\">green</span> <span class=\"wl wl-kjv\" data-code=\"H6212\">herb</span> for meat:","31":"And <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> every thing <span class=\"wl wl-kjv\" data-code=\"H834\">that</span> he had <span class=\"wl wl-kjv\" data-code=\"H6213\">made,</span> and, behold, it was <span class=\"wl wl-kjv\" data-code=\"H3966\">very</span> <span class=\"wl wl-kjv\" data-code=\"H2896\">good.</span> And the <span class=\"wl wl-kjv\" data-code=\"H6153\">evening</span> and the <span class=\"wl wl-kjv\" data-code=\"H1242\">morning</span> were the <span class=\"wl wl-kjv\" data-code=\"H8345\">sixth</span> day."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"beginne","tekst":"Van den tijd der schepping aller creaturen, die door de schepping in het wezen gekomen zijn; dewijl zij tevoren niet geweest waren, maar God alleen, die zonder begin is, Psa 90:2; Pro 8:22-23; Col 1:17. Verg. dit met Joh 1:1."},{"catchword":"schiep","tekst":"Scheppen, is in dit hoofdstuk en elders te zeggen, iets voortreffelijks te maken, hetwelk tevoren niet was, hetzij uit niet, als hier vs.1, of uit wat anders, dat uit niet geschapen was, als vs.21, 27. Van het Hebr. woord Elohim, dat is God, zie hoofdstuk Gen 20:13."},{"catchword":"hemel","tekst":"Door hemel, of (hemelen) [zijnde dit woord bij de Hebreën in het getal van één niet gebruikelijk] en aarde, mag men in dit eerste vers verstaan òf den hemel en de aarde, zoals ze op den eersten dag zijn geschapen, òf de ganse wereld, met alle hemelse en aardse schepselen daaronder begrepen. Verg. Gen 2:1."}],"2":[{"catchword":"aarde","tekst":"Versta hier door dit woord, de aarde die nu is, doch zoals ze in dat begin op den eersten dag geschapen is, en niet zoals ze door het volgende werk der schepping geworden is."},{"catchword":"woest","tekst":"In het Hebr. woestheid, of ongestaltheid en ledigheid, of ijdelheid, hetwelk van de aarde gezegd wordt, omdat ze was zonder zulk een gedaante, orde, onderscheid, sieraad, gebruik, en de inwoners, die naderhand daarin geschapen zijn. Met deze Hebr. woorden wordt elders in de Heilige Schrift uitgedrukt de uiterste woestheid, ongestaltheid, ijdelheid, nietigheid, of ledigheid, die ergens is. Zie Deu 32:10; 1Sa 12:21; Job 12:24; Psa 107:40; Isa 34:11; Isa 44:9; Jer 4:23."},{"catchword":"op den afgrond;","tekst":"Hebr. op het aangezicht des afgronds. Dat is, op het diepe en ondoorgrondelijke water, hetwelk de aarde bedekte als een kleed, en stond boven de bergen, Psa 104:6. Zie 2Pe 3:5."},{"catchword":"Geest Gods","tekst":"Versta hier door het woord Geest den Heiligen Geest, niet den wind, die nog niet geschapen was."},{"catchword":"zweefde","tekst":"Of, bewoog zich. Versta, om het eerste wezen en de gestalte der aarde en wateren, gelijk die toen waren, te onderhouden, opdat alzo de kracht des Geestes daaruit voortgebracht zouden worden. Het schijnt ene gelijkenis, genomen van de vogels, die de eieren broeden om de jongskens daaruit te doen voortkomen, en daarna met hare vleugels over dezelve zweven, om die te koesteren en op te kweken. Zie Deu 32:11."},{"catchword":"op de wateren","tekst":"Hebr. op het aangezicht der wateren: Dat is op het opperste of bovenste der wateren, die de aarde bedekten."}],"3":[{"catchword":"zeide","tekst":"Gods zeggen is zijn wil, zijn bevel en daad, Psa 33:9; Psa 148:5, welken Hij uitgevoerd heeft door zijn wezenlijk Woord, hetwelk van eeuwigheid af God en bij God geweest is, Joh 1:1-2; Psa 33:6."},{"catchword":"licht","tekst":"Een klaar, helder, luchtig wezen, verlichtende den duisteren klomp, en door zijn omloop makende dag en nacht."}],"4":[{"catchword":"zag het","tekst":"Dat is menselijker wijze van God gesproken. De zin is, dat God zijn schepsel voor goed kende."},{"catchword":"goed was;","tekst":"Dàt wordt hier goed genoemd, hetwelk Gode aangenaam, in zichzelven schoon en lieflijk, en den schepselen, voornamelijk den mensen, nuttig en dienstig is."},{"catchword":"maakte scheiding","tekst":"Te weten, alzo dat het licht de duisternis, en de duisternis het licht achtervolgden, om nacht en dag te maken."}],"5":[{"catchword":"avond","tekst":"Dat is nacht en dag makende een natuurlijken dag, welke bij de Hebreën begon met den avond [gelijk de duisternis is voorgegaan] en eindigde met den volgenden avond, begrijpende 24 uren."},{"catchword":"eerste dag","tekst":"Hebr. een dag; maar het is zeer gebruikelijk bij de Hebreën, datzij één voor eerst zetten, gelijk Gen 8:5; Num 29:1; Mat 28:1; 1Co 16:2."}],"6":[{"catchword":"uitspansel","tekst":"Of uitbreidsel. Het woord, dat in den Hebreeuwsen tekst staat, komt van een woord, hetwelk betekent uitspannen, uittrekken enz., en hier wordt er door bedoeld de gehele ruimte tussen de onderste en bovenste wateren."},{"catchword":"dat make","tekst":"Hebr. dat zij scheiding makende."},{"catchword":"wateren en wateren","tekst":"Die in het volgende vs.7. verklaard worden."}],"7":[{"catchword":"die onder het uitspansel","tekst":"Te weten in en op de aarde. Hebr. die van onder, enz. alzo vs.9."},{"catchword":"wateren, die boven","tekst":"Hebr. de wateren, die van boven, enz. Versta de wolken, die boven het onderste deel van dit uitspansel drijven, of enige andere wateren die na de scheiding hunne plaats boven mochten hebben genomen."}],"9":[{"catchword":"en dat het","tekst":"Hieruit blijkt dat tevoren de ganse aardbodem met water is bedekt geweest, ja zelfs de bergen, gelijk boven op vs.2 is aangetekend."}],"10":[{"catchword":"zeeën;","tekst":"Er staat niet: zee, maar: zeeën, omdat door dit woord bij de Hebreën niet alleen verstaan wordt de grote zee, gelijk Ecc 1:7, maar ook andere zeeën, poelen, meren en alle verzamelingen, der wateren. Zie Gen 14:3; Exo 14:23; Num 34:11; Mat 4:18; Joh 21:1, en elders."}],"11":[{"catchword":"k (function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
