l goed op leeftijd; en de HEERE had Abraham in alles gezegend.","2":"Zo zei Abraham tegen zijn knecht, de oudste van zijn huis, die over alles regeerde wat hij had: Leg toch uw hand onder mijn heup,","3":"opdat ik u laat zweren bij de HEERE, de God van de hemel en de God van de aarde, dat u voor mijn zoon geen vrouw zult nemen van de dochters van de Kanaänieten, in het midden van wie ik woon;","4":"maar dat u naar mijn land en naar mijn familie zult gaan, en voor mijn zoon Izak een vrouw zult nemen.","5":"En die knecht zei tegen hem: Misschien wil die vrouw mij niet volgen naar dit land; moet ik dan uw zoon terugbrengen naar het land waar u vandaan getrokken bent?","6":"En Abraham zei tegen hem: Pas op dat u mijn zoon niet weer daarheen terugbrengt!","7":"De HEERE, de God van de hemel, Die mij uit het huis van mijn vader en uit het land van mijn familie genomen heeft, en Die tot mij gesproken heeft, en Die mij gezworen heeft en zei: Aan uw nageslacht zal Ik dit land geven! Die Zelf zal Zijn Engel voor uw aangezicht zenden, zodat u voor mijn zoon van daar een vrouw neemt.","8":"Maar als de vrouw u niet wil volgen, dan zult u vrij zijn van deze eed aan mij; alleen mag u mijn zoon daar niet naartoe terugbrengen.","9":"Toen legde de knecht zijn hand onder de heup van Abraham, zijn heer, en hij zwoer hem over deze zaak.","10":"En die knecht nam tien kamelen van de kamelen van zijn heer, en vertrok; en al het goed van zijn heer had hij bij zich; en hij stond op, en vertrok naar Mesopotamië, naar de stad van Nahor.","11":"En hij liet de kamelen neerknielen buiten de stad, bij een waterput, tegen de avond, op de tijd dat de vrouwen die water putten naar buiten kwamen.","12":"En hij zei: HEERE! God van mijn heer Abraham! Laat mij toch vandaag *haar* ontmoeten, en bewijs weldadigheid aan Abraham, mijn heer.","13":"Zie, ik sta bij de waterbron, en de dochters van de mannen van deze stad komen naar buiten om water te putten;","14":"laat het zo gebeuren, dat het meisje tegen wie ik zal zeggen: Neig toch uw kruik, zodat ik drink; en zij zal zeggen: Drink, en ik zal ook uw kamelen drenken; laat zíj degene zijn die U aan Uw knecht Izak toegewezen hebt, en laat ik daaraan bekennen dat U weldadigheid aan mijn heer bewezen hebt.","15":"En het gebeurde, voordat hij klaar was met spreken, zie, dat Rebekka naar buiten kwam, die geboren was aan Bethuël, de zoon van Milka, de vrouw van Nahor, de broer van Abraham; en zij had haar kruik op haar schouder.","16":"En dat meisje was zeer mooi van aangezicht, een maagd, en geen man had haar bekend; en zij ging naar beneden naar de bron, en vulde haar kruik, en ging weer omhoog.","17":"Toen liep die knecht haar tegemoet, en hij zei: Laat mij toch een beetje water uit uw kruik drinken.","18":"En zij zei: Drink, mijn heer! En zij haastte zich en liet haar kruik neer op haar hand, en gaf hem te drinken.","19":"Toen zij klaar was met hem te drinken te geven, zei zij: Ik zal ook voor uw kamelen putten, totdat zij klaar zijn met drinken.","20":"En zij haastte zich, en goot haar kruik leeg in de drinkbak, en liep weer naar de put om te putten, en zij putte voor al zijn kamelen.","21":"En de man stond er zwijgend verbaasd naar te kijken, om te merken of de HEERE zijn weg voorspoedig gemaakt had, of niet.","22":"En het gebeurde, toen de kamelen klaar waren met drinken, dat die man een gouden voorhoofdsieraad nam, waarvan het gewicht een halve sikkel was, en twee armringen aan haar handen, waarvan het gewicht tien sikkel goud was.","23":"Want hij had gezegd: Van wie bent u de dochter? Vertel het mij toch; is er ook in het huis van uw vader plaats voor ons om te overnachten?","24":"En zij had tegen hem gezegd: Ik ben de dochter van Bethuël, de zoon van Milka, die zij Nahor gebaard heeft.","25":"Verder had zij tegen hem gezegd: Ook is er stro en volop voer bij ons, ook plaats om te overnachten.","26":"Toen boog die man zijn hoofd, en aanbad de HEERE;","27":"en hij zei: Geloofd zij de HEERE, de God van mijn heer Abraham, Die Zijn weldadigheid en trouw niet onthouden heeft aan mijn heer; wat mij betreft, de HEERE heeft mij op deze weg geleid, naar het huis van de broers van mijn heer.","28":"En dat meisje liep, en vertelde in het huis van haar moeder hoe deze zaken waren.","29":"En Rebekka had een broer, wiens naam Laban was; en Laban liep naar buiten naar die man, naar de bron.","30":"En het gebeurde, toen hij dat voorhoofdsieraad gezien had, en de armringen aan de handen van zijn zuster; en toen hij de woorden van zijn zuster Rebekka gehoord had, die zei: Zo heeft die man tot mij gesproken, toen kwam hij naar die man, en zie, hij stond bij de kamelen, bij de bron.","31":"En hij zei: Kom binnen, gezegende van de HEERE! Waarom zou u buiten blijven staan? Want ik heb het huis gereedgemaakt, en de plaats voor de kamelen.","32":"Toen kwam die man het huis binnen, en men maakte de kamelen los, en men gaf de kamelen stro en voer; en water om zijn voeten te wassen, en de voeten van de mannen die bij hem waren.","33":"Daarna werd hem te eten voorgezet; maar hij zei: Ik zal niet eten, totdat ik mijn woorden gesproken heb. En hij zei: Spreek!","34":"Toen zei hij: Ik ben een knecht van Abraham;","35":"en de HEERE heeft mijn heer zeer gezegend, zodat hij groot geworden is; en Hij heeft hem gegeven schapen, en runderen, en zilver, en goud, en knechten, en dienstmeisjes, en kamelen, en ezels.","36":"En Sara, de vrouw van mijn heer, heeft mijn heer een zoon gebaard, nadat zij oud geworden was; en hij heeft hem gegeven alles wat hij heeft.","37":"En mijn heer heeft mij laten zweren en zei: U zult voor mijn zoon geen vrouw nemen van de dochters van de Kanaänieten, in wiens land ik woon;","38":"maar u zult gaan naar het huis van mijn vader, en naar mijn geslacht, en zult voor mijn zoon een vrouw nemen!","39":"Toen zei ik tegen mijn heer: Misschien zal die vrouw mij niet volgen.","40":"En hij zei tegen mij: De HEERE, voor Wiens aangezicht ik gewandeld heb, zal Zijn Engel met u zenden, en Hij zal uw weg voorspoedig maken, zodat u voor mijn zoon een vrouw neemt, uit mijn geslacht en uit het huis van mijn vader.","41":"Dan zult u vrij zijn van mijn eed, wanneer u bij mijn geslacht gekomen bent; en als zij haar u niet geven, dan zult u vrij zijn van mijn eed.","42":"En ik kwam vandaag aan bij de bron; en ik zei: O, HEERE! God van mijn heer Abraham! Als U nu mijn weg voorspoedig wilt maken, waarop ik ga;","43":"zie, ik sta bij de waterbron; laat het zo gebeuren, dat de maagd die naar buiten zal komen om te putten, en tegen wie ik zal zeggen: Geef mij toch een beetje water te drinken uit uw kruik;","44":"en zij tegen mij zal zeggen: Drink u ook, en ik zal ook uw kamelen putten; laat zíj de vrouw zijn, die de HEERE aan de zoon van mijn heer heeft toegewezen.","45":"Voordat ik klaar was met spreken in mijn hart, zie, toen kwam Rebekka naar buiten, en had haar kruik op haar schouder, en zij ging naar beneden naar de bron en putte; en ik zei tegen haar: Geef mij toch te drinken!","46":"Toen haastte zij zich en liet haar kruik van zich af neer, en zei: Drink u, en ik zal ook uw kamelen drenken; en ik dronk, en zij drenkte ook de kamelen.","47":"Toen vroeg ik haar, en zei: Van wie bent u de dochter? En zij zei: De dochter van Bethuël, de zoon van Nahor, die Milka hem gebaard heeft. Toen legde ik het voorhoofdsieraad op haar gezicht, en de armringen aan haar handen;","48":"en ik boog mijn hoofd, en aanbad de HEERE; en ik loofde de HEERE, de God van mijn heer Abraham, Die mij op de juiste weg geleid had, om de dochter van de broer van mijn heer voor zijn zoon te nemen.","49":"Nu dan, als u weldadigheid en trouw aan mijn heer wilt bewijzen, vertel het mij; en zo niet, vertel het mij *ook*, zodat ik mij naar rechts of naar links kan wenden.","50":"Toen antwoordden Laban en Bethuël, en zeiden: Van de HEERE is deze zaak uitgegaan; wij kunnen tot u niets kwaads of goeds zeggen.","51":"Zie, Rebekka staat voor u; neem haar en ga heen; laat zij de vrouw worden van de zoon van uw heer, zoals de HEERE gesproken heeft!","52":"En het gebeurde, toen de knecht van Abraham hun woorden hoorde, dat hij zich ter aarde boog voor de HEERE.","53":"En de knecht haalde zilveren sieraden, en gouden sieraden, en kleren tevoorschijn, en hij gaf die aan Rebekka; hij gaf ook aan haar broer en haar moeder kostbare geschenken.","54":"Toen aten en dronken zij, hij en de mannen die bij hem waren; en zij overnachtten, en zij stonden 's morgens op, en hij zei: Laat mij vertrekken naar mijn heer!","55":"Toen zeiden haar broer en haar moeder: Laat het meisje nog enkele dagen, of tien, bij ons blijven; daarna zult u gaan.","56":"Maar hij zei tegen hen: Houd mij niet op, omdat de HEERE mijn weg voorspoedig gemaakt heeft! Laat mij vertrekken, zodat ik naar mijn heer ga.","57":"Toen zeiden zij: Laten we het meisje roepen, en het haar zelf vragen.","58":"En zij riepen Rebekka, en zeiden tegen haar: Wilt u met deze man meegaan? En zij antwoordde: Ik zal gaan.","59":"Toen lieten zij Rebekka, hun zuster, en haar voedster vertrekken, alsook de knecht van Abraham en zijn mannen.","60":"En zij zegenden Rebekka, en zeiden tegen haar: O, onze zuster! Word u tot duizenden miljoenen, en laat uw nageslacht de poort van hun haters bezitten!","61":"En Rebekka stond op met haar dienstmeisjes, en zij reden op kamelen, en volgden de man; en die knecht nam Rebekka, en vertrok.","62":"Izak nu kwam van de weg naar de put Lachai-Roi; want hij woonde in het zuiderland.","63":"En Izak was naar buiten gegaan om te bidden in het veld, tegen het vallen van de avond; en hij hief zijn ogen op en keek, en zie, de kamelen kwamen eraan!","64":"Rebekka hief ook haar ogen op, en zij zag Izak; en zij liet zich van de kameel af glijden.","65":"En zij zei tegen de knecht: Wie is die man, die ons tegemoet loopt in het veld? En de knecht zei: Dat is mijn heer! Toen nam zij de sluier, en bedekte zich.","66":"En de knecht vertelde aan Izak alle zaken die hij gedaan had.","67":"En Izak bracht haar in de tent van zijn moeder Sara; en hij nam Rebekka, en zij werd hem tot vrouw, en hij had haar lief. Zo werd Izak getroost na de *dood* van zijn moeder."},"SV":{"1":"Abraham nu was oud *en* wel bedaagd; en de HEERE had Abraham in alles gezegend.","2":"Zo sprak Abraham tot zijn knecht, den oudste van zijn huis, regerende over alles, wat hij had: Leg toch uw hand onder mijn heup,","3":"Opdat ik u doe zweren bij den HEERE, den God des hemels, en den God der aarde, dat gij voor mijn zoon geen vrouw nemen zult van de dochteren der Kanaänieten, in het midden van welke ik woon;","4":"Maar dat gij naar mijn land, en naar mijn maagschap trekken, en voor mijn zoon Izak een vrouw nemen zult.","5":"En die knecht zeide tot hem: Misschien zal die vrouw mij niet willen volgen in dit land; zal ik dan uw zoon moeten wederbrengen in het land, waar gij uitgetogen zijt?","6":"En Abraham zeide tot hem: Wacht u, dat gij mijn zoon niet weder daarheen brengt!","7":"De HEERE, de God des hemels, Die mij uit mijns vaders huis en uit het land mijner maagschap genomen heeft, en Die tot mij gesproken heeft, en Die mij gezworen heeft, zeggende: Aan uw zaad zal Ik dit land geven! Die Zelf zal Zijn Engel voor uw aangezicht zenden, dat gij voor mijn zoon van daar een vrouw neemt.","8":"Maar indien de vrouw u niet volgen wil, zo zult gij rein zijn van dezen mijn eed; alleenlijk breng mijn zoon daar niet weder heen.","9":"Toen legde de knecht zijn hand onder de heup van Abraham, zijn heer, en hij zwoer hem over deze zaak.","10":"En die knecht nam tien kemelen van zijns heren kemelen, en toog heen; en al het goed zijns heren was in zijn hand; en hij maakte zich op, en toog heen naar Mesopotamië, naar de stad van Nahor.","11":"En hij deed de kemelen nederknielen buiten de stad, bij een waterput, des avondtijds, ten tijde, als de putsters uitkwamen.","12":"En hij zeide: HEERE! God van mijn heer Abraham! doe *haar* mij toch heden ontmoeten, en doe weldadigheid bij Abraham, mijn heer.","13":"Zie, ik sta bij de waterfontein, en de dochteren der mannen dezer stad zijn uitgaande om water te putten;","14":"Zo geschiede, dat die jonge dochter, tot welke ik zal zeggen: Neig toch uw kruik, dat ik drinke; en zij zal zeggen: Drink, en ik zal ook uw kemelen drenken; diezelve *zij*, die Gij Uw knecht Izak toegewezen hebt, en dat ik daaraan bekenne, dat Gij weldadigheid bij mijn heer gedaan hebt.","15":"En het geschiedde, eer hij geëindigd had te spreken, ziet, zo kwam Rebekka uit, welke aan Bethuël geboren was, de zoon van Milka, de huisvrouw van Nahor, de broeder van Abraham; en zij had haar kruik op haar schouder.","16":"En die jonge dochter was zeer schoon van aangezicht, een maagd, en geen man had haar bekend; en zij ging af naar de fontein, en vulde haar kruik, en ging op.","17":"Toen liep die knecht haar tegemoet, en hij zeide: Laat mij toch een weinig waters uit uw kruik drinken.","18":"En zij zeide: Drink, mijn heer! en zij haastte zich en liet haar kruik neder op haar hand, en gaf hem te drinken.","19":"Als zij nu voleindigd had van hem drinken te geven, zeide zij: Ik zal ook voor uw kemelen putten, totdat zij voleindigd hebben te drinken.","20":"En zij haastte zich, en goot haar kruik uit in de drinkbak, en liep weder naar den put om te putten, en zij putte voor al zijn kemelen.","21":"En de man ontzette zich over haar, stilzwijgende, om te merken, of de HEERE zijn weg voorspoedig gemaakt had, of niet.","22":"En het geschiedde, als de kemelen voleindigd hadden te drinken, dat die man een gouden voorhoofdsiersel nam, welks gewicht was een halve sikkel, en twee armringen aan haar handen, welker gewicht was tien *sikkelen* gouds.","23":"Want hij had gezegd: Wiens dochter *zijt* gij? geef het mij toch te kennen; is er ook ten huize uws vaders plaats voor ons, om te vernachten?","24":"En zij had tot hem gezegd: Ik *ben* de dochter van Bethuël, den zoon van Milka, die zij Nahor gebaard heeft.","25":"Voorts had zij tot hem gezegd: Ook is er stro en veel voeders bij ons, ook plaats om te vernachten.","26":"Toen neigde die man zijn hoofd, en aanbad den HEERE;","27":"En hij zeide: Geloofd *zij* de HEERE, de God van mijn heer Abraham, Die Zijn weldadigheid en waarheid niet nagelaten heeft van mijn heer; aangaande mij, de HEERE heeft mij op dezen weg geleid, ten huize van mijns heren broederen.","28":"En die jonge dochter liep, en gaf ten huize harer moeder te kennen, gelijk deze zaken waren.","29":"En Rebekka had een broeder, wiens naam was Laban; en Laban liep tot dien man naar buiten tot de fontein.","30":"En het geschiedde, als hij dat voorhoofdsiersel gezien had, en de armringen aan de handen zijner zuster; en als hij gehoord had de woorden zijner zuster Rebekka, zeggende: Alzo heeft die man tot mij gesproken, zo kwam hij tot dien man, en ziet, hij stond bij de kemelen, bij de fontein.","31":"En hij zeide: Kom in, gij, gezegende des HEEREN! waarom zoudt gij buiten staan? want ik heb het huis bereid, en de plaats voor de kemelen.","32":"Toen kwam die man naar het huis toe, en men ontgordde de kemelen, en men gaf den kemelen stro en voeder; en water om zijn voeten te wassen, en de voeten der mannen, die bij hem *waren*.","33":"Daarna werd hem te eten voorgezet ; maar hij zeide: Ik zal niet eten, totdat ik mijn woorden gesproken heb. En hij zeide: Spreek!","34":"Toen zeide hij: Ik *ben* een knecht van Abraham;","35":"En de HEERE heeft mijn heer zeer gezegend, zodat hij groot geworden is; en Hij heeft hem gegeven schapen, en runderen, en zilver, en goud, en knechten, en maagden, en kemelen, en ezelen.","36":"En Sara, de huisvrouw van mijn heer, heeft mijn heer een zoon gebaard, nadat zij oud geworden was; en hij heeft hem gegeven, alles, wat hij heeft.","37":"En mijn heer heeft mij doen zweren, zeggende: Gij zult voor mijn zoon geen vrouw nemen van de dochteren der Kanaänieten, in welker land ik wone;","38":"Maar gij zult trekken naar het huis mijns vaders, en naar mijn geslacht, en zult voor mijn zoon een vrouw nemen!","39":"Toen zeide ik tot mijn heer: Misschien zal mij de vrouw niet volgen.","40":"En hij zeide tot mij: De HEERE, voor Wiens aangezicht ik gewandeld heb, zal Zijn Engel met u zenden, en Hij zal uw weg voorspoedig maken, dat gij voor mijn zoon een vrouw neemt, uit mijn geslacht en uit mijns vaders huis.","41":"Dan zult gij van mijn eed rein zijn, wanneer gij tot mijn geslacht zult gegaan zijn; en indien zij haar u niet geven, zo zult gij rein zijn van mijn eed.","42":"En ik kwam heden aan de fontein; en ik zeide: O, HEERE! God van mijn heer Abraham! zo Gij nu mijn weg voorspoedig maken zult, op welke ik ga;","43":"Zie, ik sta bij de waterfontein; zo geschiede, dat de maagd, die uitkomen zal om te putten, en tot welke ik zeggen zal: Geef mij toch een weinig waters te drinken uit uw kruik;","44":"En zij tot mij zal zeggen: Drink gij ook, en ik zal ook uw kemelen putten; dat deze die vrouw *zij*, die de HEERE aan den zoon van mijn heer heeft toegewezen.","45":"Eer ik geëindigd had te spreken in mijn hart, ziet, zo kwam Rebekka uit, en had haar kruik op haar schouder, en zij kwam af tot de fontein en putte; en ik zeide tot haar: Geef mij toch te drinken!","46":"Zo haastte zij zich en liet haar kruik van zich neder, en zeide: Drink gij, en ik zal ook uw kemelen drenken; en ik dronk, en zij drenkte ook de kemelen.","47":"Toen vraagde ik haar, en zeide: Wiens dochter zijt gij? En zij zeide: De dochter van Bethuël, den zoon van Nahor, welken Milka hem gebaard heeft. Zo leide ik het voorhoofdsiersel op haar aangezicht, en de armringen aan haar handen;","48":"En ik neigde mijn hoofd, en aanbad den HEERE; en ik loofde den HEERE, den God van mijn heer Abraham, Die mij op den rechten weg geleid had, om de dochter des broeders van mijn heer voor zijn zoon te nemen.","49":"Nu dan, zo gijlieden weldadigheid en trouw aan mijn heer doen zult, geeft het mij te kennen; en zo niet, geeft het mij *ook* te kennen, opdat ik mij ter rechter *hand* of ter linkerhand wende.","50":"Toen antwoordde Laban, en Bethuël, en zeiden: Van den HEERE is deze zaak voortgekomen; wij kunnen kwaad noch goed tot u spreken.","51":"Zie, Rebekka is voor uw aangezicht; neem haar en trek henen; zij zij de vrouw van den zoon uws heren, gelijk de HEERE gesproken heeft!","52":"En het geschiedde, als Abrahams knecht hun woorden hoorde, zo boog hij zich ter aarde voor den HEERE.","53":"En de knecht langde voort zilveren kleinoden, en gouden kleinoden, en klederen, en hij gaf die aan Rebekka; hij gaf ook aan haar broeder en haar moeder kostelijkheden.","54":"Toen aten en dronken zij, hij en de mannen, die bij hem *waren*; en zij vernachtten, en zij stonden des morgens op, en hij zeide: Laat mij trekken tot mijn heer!","55":"Toen zeide haar broeder, en haar moeder: Laat de jonge dochter *enige* dagen, of tien, bij ons blijven; daarna zult gij gaan.","56":"Maar hij zeide tot hen: Houdt mij niet op, dewijl de HEERE mijn weg voorspoedig gemaakt heeft! laat mij trekken, dat ik tot mijn heer ga.","57":"Toen zeiden zij: Laat ons de jonge dochter roepen, en haar mond vragen.","58":"En zij riepen Rebekka, en zeiden tot haar: Zult gij met dezen man trekken? En zij antwoordde: Ik zal trekken.","59":"Toen lieten zij Rebekka, hun zuster, en haar voedster trekken, mitsgaders Abrahams knecht en zijn mannen.","60":"En zij zegenden Rebekka, en zeiden tot haar: O, onze zuster! wordt gij tot duizenden millioenen, en uw zaad bezitte de poort zijner haters!","61":"En Rebekka maakte zich op met haar jonge dochteren, en zij reden op kemelen, en volgden den man; en die knecht nam Rebekka, en toog heen.","62":"Izak nu kwam, van daar men komt tot den put Lachai-roi; en hij woonde in het zuiderland.","63":"En Izak was uitgegaan om te bidden in het veld, tegen het naken van den avond; en hij hief zijn ogen op en zag toe, en ziet, de kemelen kwamen!","64":"Rebekka hief ook haar ogen op, en zij zag Izak; en zij viel van den kemel af.","65":"En zij zeide tot den knecht: Wie is die man, die ons in het veld tegemoet wandelt? En de knecht zeide: Dat is mijn heer! Toen nam zij den sluier, en bedekte zich.","66":"En de knecht vertelde aan Izak al de zaken, die hij gedaan had.","67":"En Izak bracht haar in de tent van zijn moeder Sara; en hij nam Rebekka, en zij werd hem ter vrouw, en hij had haar lief. Alzo werd Izak getroost na zijner moeders *dood*."},"KJV":{"1":"And Abraham was old, *and* well stricken in age: and the LORD had blessed Abraham","2":"And Abraham said unto his eldest servant of his house, that ruled over all that he had, Put, I pray thee, thy hand under my thigh:","3":"And I will make thee swear by the LORD, the God of heaven, and the God of the earth, that thou shalt not take a wife unto my son of the daughters of the Canaanites, among whom I dwell:","4":"But thou shalt go unto my country, and to my kindred, and take a wife unto my son Isaac.","5":"And the servant said unto him, Peradventure the woman will not be willing to follow me unto this land: must I needs bring thy son again unto the land from whence thou camest?","6":"And Abraham said unto him, Beware thou that thou bring not my son thither again.","7":"The LORD God of heaven, which took me from my father's house, and from the land of my kindred, and which spake unto me, and that sware unto me, saying, Unto thy seed will I give this land; he shall send his angel before thee, and thou shalt take a wife unto my son","8":"And if the woman will not be willing to follow thee, then thou shalt be clear from this my oath: only bring not my son thither again.","9":"And the servant put his hand under the thigh of Abraham his master, and sware to him concerning that matter.","10":"And the servant took ten camels of the camels of his master, and departed; for all the goods of his master *were* in his hand: and he arose, and went to Mesopotamia, unto the city of Nahor.","11":"And he made his camels to kneel down without the city by a well of water at the time of the evening, *even* the time that women go out to draw","12":"And he said, O LORD God of my master Abraham, I pray thee, send me good speed this day, and shew kindness unto my master Abraham.","13":"Behold, I stand *here* by the well of water; and the daughters of the men of the city come out to draw water:","14":"And let it come to pass, that the damsel to whom I shall say, Let down thy pitcher, I pray thee, that I may drink; and she shall say, Drink, and I will give thy camels drink also: *let the same be* she *that* thou hast appointed for thy servant Isaac; and thereby shall I know that thou hast shewed kindness unto my master.","15":"And it came to pass, before he had done speaking, that, behold, Rebekah came out, who was born to Bethuel, son of Milcah, the wife of Nahor, Abraham's brother, with her pitcher upon her shoulder.","16":"And the damsel *was* very fair to look upon, a virgin, neither had any man known her: and she went down to the well, and filled her pitcher, and came up.","17":"And the servant ran to meet her, and said, Let me, I pray thee, drink a little water of thy pitcher.","18":"And she said, Drink, my lord: and she hasted, and let down her pitcher upon her hand, and gave him drink.","19":"And when she had done giving him drink, she said, I will draw *water* for thy camels also, until they have done drinking.","20":"And she hasted, and emptied her pitcher into the trough, and ran again unto the well to draw *water*, and drew for all his camels.","21":"And the man wondering at her held his peace, to wit whether the LORD had made his journey prosperous or","22":"And it came to pass, as the camels had done drinking, that the man took a golden earring of half a shekel weight, and two bracelets for her hands of ten *shekels* weight of gold;","23":"And said, Whose daughter *art* thou? tell me, I pray thee: is there room *in* thy father's house for us to lodge in?","24":"And she said unto him, I *am* the daughter of Bethuel the son of Milcah, which she bare unto Nahor.","25":"She said moreover unto him, We have both straw and provender enough, and room to lodge in.","26":"And the man bowed down his head, and worshipped the LORD.","27":"And he said, Blessed *be* the LORD God of my master Abraham, who hath not left destitute my master of his mercy and his truth: I *being* in the way, the LORD led me to the house of my master's brethren.","28":"And the damsel ran, and told *them of* her mother's house these things.","29":"And Rebekah had a brother, and his name *was* Laban: and Laban ran out unto the man, unto the well.","30":"And it came to pass, when he saw the earring and bracelets upon his sister's hands, and when he heard the words of Rebekah his sister, saying, Thus spake the man unto me; that he came unto the man; and, behold, he stood by the camels at the well.","31":"And he said, Come in, thou blessed of the LORD; wherefore standest thou without? for I have prepared the house, and room for the camels.","32":"And the man came into the house: and he ungirded his camels, and gave straw and provender for the camels, and water to wash his feet, and the men's feet","33":"And there was set *meat* before him to eat: but he said, I will not eat, until I have told mine errand. And he said, Speak on.","34":"And he said, I *am* Abraham's servant.","35":"And the LORD hath blessed my master greatly; and he is become great: and he hath given him flocks, and herds, and silver, and gold, and menservants, and maidservants, and camels, and asses.","36":"And Sarah my master's wife bare a son to my master when she was old: and unto him hath he given","37":"And my master made me swear, saying, Thou shalt not take a wife to my son of the daughters of the Canaanites, in whose land I dwell:","38":"But thou shalt go unto my father's house, and to my kindred, and take a wife unto my son.","39":"And I said unto my master, Peradventure the woman will not follow","40":"And he said unto me, The LORD, before whom I walk, will send his angel with thee, and prosper thy way; and thou shalt take a wife for my son of my kindred, and of my father's house:","41":"Then shalt thou be clear from *this* my oath, when thou comest to my kindred; and if they give not thee *one*, thou shalt be clear from my oath.","42":"And I came this day unto the well, and said, O LORD God of my master Abraham, if now thou do prosper my way which I go:","43":"Behold, I stand by the well of water; and it shall come to pass, that when the virgin cometh forth to draw *water*, and I say to her, Give me, I pray thee, a little water of thy pitcher to drink;","44":"And she say to me, Both drink thou, and I will also draw for thy camels: *let* the same *be* the woman whom the LORD hath appointed out for my master's son.","45":"And before I had done speaking in mine heart, behold, Rebekah came forth with her pitcher on her shoulder; and she went down unto the well, and drew *water*: and I said unto her, Let me drink,","46":"And she made haste, and let down her pitcher from her *shoulder*, and said, Drink, and I will give thy camels drink also: so I drank, and she made the camels drink","47":"And I asked her, and said, Whose daughter *art* thou? And she said, The daughter of Bethuel, Nahor's son, whom Milcah bare unto him: and I put the earring upon her face, and the bracelets upon her hands.","48":"And I bowed down my head, and worshipped the LORD, and blessed the LORD God of my master Abraham, which had led me in the right way to take my master's brother's daughter unto his son.","49":"And now if ye will deal kindly and truly with my master, tell me: and if not, tell me; that I may turn to the right hand, or to the left.","50":"Then Laban and Bethuel answered and said, The thing proceedeth from the LORD: we cannot speak unto thee bad or good.","51":"Behold, Rebekah *is* before thee, take *her*, and go, and let her be thy master's son's wife, as the LORD hath spoken.","52":"And it came to pass, that, when Abraham's servant heard their words, he worshipped the LORD, *bowing himself* to the earth.","53":"And the servant brought forth jewels of silver, and jewels of gold, and raiment, and gave *them* to Rebekah: he gave also to her brother and to her mother precious things.","54":"And they did eat and drink, he and the men that *were* with him, and tarried all night; and they rose up in the morning, and he said, Send me away unto my master.","55":"And her brother and her mother said, Let the damsel abide with us *a few* days, at the least ten; after that she shall go.","56":"And he said unto them, Hinder me not, seeing the LORD hath prospered my way; send me away that I may go to my master.","57":"And they said, We will call the damsel, and enquire at her mouth.","58":"And they called Rebekah, and said unto her, Wilt thou go with this man? And she said, I will go.","59":"And they sent away Rebekah their sister, and her nurse, and Abraham's servant, and his men.","60":"And they blessed Rebekah, and said unto her, Thou *art* our sister, be thou *the mother* of thousands of millions, and let thy seed possess the gate of those which hate","61":"And Rebekah arose, and her damsels, and they rode upon the camels, and followed the man: and the servant took Rebekah, and went his way.","62":"And Isaac came from the way of the well Lahairoi; for he dwelt in the south country.","63":"And Isaac went out to meditate in the field at the eventide: and he lifted up his eyes, and saw, and, behold, the camels *were* coming.","64":"And Rebekah lifted up her eyes, and when she saw Isaac, she lighted off the camel.","65":"For she *had* said unto the servant, What man *is* this that walketh in the field to meet us? And the servant *had* said, It *is* my master: therefore she took a vail, and covered herself.","66":"And the servant told Isaac all things that he had done.","67":"And Isaac brought her into his mother Sarah's tent, and took Rebekah, and she became his wife; and he loved her: and Isaac was comforted after his mother's"}},"tsk":{"1":[{"kopje":"was oud","refs":["Gen 18:11","Gen 21:5","Gen 25:20",
