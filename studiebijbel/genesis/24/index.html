": "mattheus", "Mark": "markus", "Luk": "lukas", "Joh": "johannes", "Hand": "handelingen", "Rom": "romeinen", "1 Kor": "1-korinthe", "2 Kor": "2-korinthe", "Gal": "galaten", "Ef": "efeze", "Fil": "filippenzen", "Kol": "kolossenzen", "1 Tess": "1-thessalonicenzen", "2 Tess": "2-thessalonicenzen", "1 Tim": "1-timotheus", "2 Tim": "2-timotheus", "Tit": "titus", "Filem": "filemon", "Hebr": "hebreeen", "Jak": "jakobus", "1 Petr": "1-petrus", "2 Petr": "2-petrus", "1 Joh": "1-johannes", "2 Joh": "2-johannes", "3 Joh": "3-johannes", "Judas": "judas", "Openb": "openbaring"}}, "vertalingen": {"SVnu": {"1": "Abraham nu was oud en al goed op leeftijd; en de HEERE had Abraham in alles gezegend.", "2": "Zo zei Abraham tegen zijn knecht, de oudste van zijn huis, die over alles regeerde wat hij had: Leg toch uw hand onder mijn heup,", "3": "opdat ik u laat zweren bij de HEERE, de God van de hemel en de God van de aarde, dat u voor mijn zoon geen vrouw zult nemen van de dochters van de Kanaänieten, in het midden van wie ik woon;", "4": "maar dat u naar mijn land en naar mijn familie zult gaan, en voor mijn zoon Izak een vrouw zult nemen.", "5": "En die knecht zei tegen hem: Misschien wil die vrouw mij niet volgen naar dit land; moet ik dan uw zoon terugbrengen naar het land waar u vandaan getrokken bent?", "6": "En Abraham zei tegen hem: Pas op dat u mijn zoon niet weer daarheen terugbrengt!", "7": "De HEERE, de God van de hemel, Die mij uit het huis van mijn vader en uit het land van mijn familie genomen heeft, en Die tot mij gesproken heeft, en Die mij gezworen heeft en zei: Aan uw nageslacht zal Ik dit land geven! Die Zelf zal Zijn Engel voor uw aangezicht zenden, zodat u voor mijn zoon van daar een vrouw neemt.", "8": "Maar als de vrouw u niet wil volgen, dan zult u vrij zijn van deze eed aan mij; alleen mag u mijn zoon daar niet naartoe terugbrengen.", "9": "Toen legde de knecht zijn hand onder de heup van Abraham, zijn heer, en hij zwoer hem over deze zaak.", "10": "En die knecht nam tien kamelen van de kamelen van zijn heer, en vertrok; en al het goed van zijn heer had hij bij zich; en hij stond op, en vertrok naar Mesopotamië, naar de stad van Nahor.", "11": "En hij liet de kamelen neerknielen buiten de stad, bij een waterput, tegen de avond, op de tijd dat de vrouwen die water putten naar buiten kwamen.", "12": "En hij zei: HEERE! God van mijn heer Abraham! Laat mij toch vandaag *haar* ontmoeten, en bewijs weldadigheid aan Abraham, mijn heer.", "13": "Zie, ik sta bij de waterbron, en de dochters van de mannen van deze stad komen naar buiten om water te putten;", "14": "laat het zo gebeuren, dat het meisje tegen wie ik zal zeggen: Neig toch uw kruik, zodat ik drink; en zij zal zeggen: Drink, en ik zal ook uw kamelen drenken; laat zíj degene zijn die U aan Uw knecht Izak toegewezen hebt, en laat ik daaraan bekennen dat U weldadigheid aan mijn heer bewezen hebt.", "15": "En het gebeurde, voordat hij klaar was met spreken, zie, dat Rebekka naar buiten kwam, die geboren was aan Bethuël, de zoon van Milka, de vrouw van Nahor, de broer van Abraham; en zij had haar kruik op haar schouder.", "16": "En dat meisje was zeer mooi van aangezicht, een maagd, en geen man had haar bekend; en zij ging naar beneden naar de bron, en vulde haar kruik, en ging weer omhoog.", "17": "Toen liep die knecht haar tegemoet, en hij zei: Laat mij toch een beetje water uit uw kruik drinken.", "18": "En zij zei: Drink, mijn heer! En zij haastte zich en liet haar kruik neer op haar hand, en gaf hem te drinken.", "19": "Toen zij klaar was met hem te drinken te geven, zei zij: Ik zal ook voor uw kamelen putten, totdat zij klaar zijn met drinken.", "20": "En zij haastte zich, en goot haar kruik leeg in de drinkbak, en liep weer naar de put om te putten, en zij putte voor al zijn kamelen.", "21": "En de man stond er zwijgend verbaasd naar te kijken, om te merken of de HEERE zijn weg voorspoedig gemaakt had, of niet.", "22": "En het gebeurde, toen de kamelen klaar waren met drinken, dat die man een gouden voorhoofdsieraad nam, waarvan het gewicht een halve sikkel was, en twee armringen aan haar handen, waarvan het gewicht tien sikkel goud was.", "23": "Want hij had gezegd: Van wie bent u de dochter? Vertel het mij toch; is er ook in het huis van uw vader plaats voor ons om te overnachten?", "24": "En zij had tegen hem gezegd: Ik ben de dochter van Bethuël, de zoon van Milka, die zij Nahor gebaard heeft.", "25": "Verder had zij tegen hem gezegd: Ook is er stro en volop voer bij ons, ook plaats om te overnachten.", "26": "Toen boog die man zijn hoofd, en aanbad de HEERE;", "27": "en hij zei: Geloofd zij de HEERE, de God van mijn heer Abraham, Die Zijn weldadigheid en trouw niet onthouden heeft aan mijn heer; wat mij betreft, de HEERE heeft mij op deze weg geleid, naar het huis van de broers van mijn heer.", "28": "En dat meisje liep, en vertelde in het huis van haar moeder hoe deze zaken waren.", "29": "En Rebekka had een broer, wiens naam Laban was; en Laban liep naar buiten naar die man, naar de bron.", "30": "En het gebeurde, toen hij dat voorhoofdsieraad gezien had, en de armringen aan de handen van zijn zuster; en toen hij de woorden van zijn zuster Rebekka gehoord had, die zei: Zo heeft die man tot mij gesproken, toen kwam hij naar die man, en zie, hij stond bij de kamelen, bij de bron.", "31": "En hij zei: Kom binnen, gezegende van de HEERE! Waarom zou u buiten blijven staan? Want ik heb het huis gereedgemaakt, en de plaats voor de kamelen.", "32": "Toen kwam die man het huis binnen, en men maakte de kamelen los, en men gaf de kamelen stro en voer; en water om zijn voeten te wassen, en de voeten van de mannen die bij hem waren.", "33": "Daarna werd hem te eten voorgezet; maar hij zei: Ik zal niet eten, totdat ik mijn woorden gesproken heb. En hij zei: Spreek!", "34": "Toen zei hij: Ik ben een knecht van Abraham;", "35": "en de HEERE heeft mijn heer zeer gezegend, zodat hij groot geworden is; en Hij heeft hem gegeven schapen, en runderen, en zilver, en goud, en knechten, en dienstmeisjes, en kamelen, en ezels.", "36": "En Sara, de vrouw van mijn heer, heeft mijn heer een zoon gebaard, nadat zij oud geworden was; en hij heeft hem gegeven alles wat hij heeft.", "37": "En mijn heer heeft mij laten zweren en zei: U zult voor mijn zoon geen vrouw nemen van de dochters van de Kanaänieten, in wiens land ik woon;", "38": "maar u zult gaan naar het huis van mijn vader, en naar mijn geslacht, en zult voor mijn zoon een vrouw nemen!", "39": "Toen zei ik tegen mijn heer: Misschien zal die vrouw mij niet volgen.", "40": "En hij zei tegen mij: De HEERE, voor Wiens aangezicht ik gewandeld heb, zal Zijn Engel met u zenden, en Hij zal uw weg voorspoedig maken, zodat u voor mijn zoon een vrouw neemt, uit mijn geslacht en uit het huis van mijn vader.", "41": "Dan zult u vrij zijn van mijn eed, wanneer u bij mijn geslacht gekomen bent; en als zij haar u niet geven, dan zult u vrij zijn van mijn eed.", "42": "En ik kwam vandaag aan bij de bron; en ik zei: O, HEERE! God van mijn heer Abraham! Als U nu mijn weg voorspoedig wilt maken, waarop ik ga;", "43": "zie, ik sta bij de waterbron; laat het zo gebeuren, dat de maagd die naar buiten zal komen om te putten, en tegen wie ik zal zeggen: Geef mij toch een beetje water te drinken uit uw kruik;", "44": "en zij tegen mij zal zeggen: Drink u ook, en ik zal ook uw kamelen putten; laat zíj de vrouw zijn, die de HEERE aan de zoon van mijn heer heeft toegewezen.", "45": "Voordat ik klaar was met spreken in mijn hart, zie, toen kwam Rebekka naar buiten, en had haar kruik op haar schouder, en zij ging naar beneden naar de bron en putte; en ik zei tegen haar: Geef mij toch te drinken!", "46": "Toen haastte zij zich en liet haar kruik van zich af neer, en zei: Drink u, en ik zal ook uw kamelen drenken; en ik dronk, en zij drenkte ook de kamelen.", "47": "Toen vroeg ik haar, en zei: Van wie bent u de dochter? En zij zei: De dochter van Bethuël, de zoon van Nahor, die Milka hem gebaard heeft. Toen legde ik het voorhoofdsieraad op haar gezicht, en de armringen aan haar handen;", "48": "en ik boog mijn hoofd, en aanbad de HEERE; en ik loofde de HEERE, de God van mijn heer Abraham, Die mij op de juiste weg geleid had, om de dochter van de broer van mijn heer voor zijn zoon te nemen.", "49": "Nu dan, als u weldadigheid en trouw aan mijn heer wilt bewijzen, vertel het mij; en zo niet, vertel het mij *ook*, zodat ik mij naar rechts of naar links kan wenden.", "50": "Toen antwoordden Laban en Bethuël, en zeiden: Van de HEERE is deze zaak uitgegaan; wij kunnen tot u niets kwaads of goeds zeggen.", "51": "Zie, Rebekka staat voor u; neem haar en ga heen; laat zij de vrouw worden van de zoon van uw heer, zoals de HEERE gesproken heeft!", "52": "En het gebeurde, toen de knecht van Abraham hun woorden hoorde, dat hij zich ter aarde boog voor de HEERE.", "53": "En de knecht haalde zilveren sieraden, en gouden sieraden, en kleren tevoorschijn, en hij gaf die aan Rebekka; hij gaf ook aan haar broer en haar moeder kostbare geschenken.", "54": "Toen aten en dronken zij, hij en de mannen die bij hem waren; en zij overnachtten, en zij stonden 's morgens op, en hij zei: Laat mij vertrekken naar mijn heer!", "55": "Toen zeiden haar broer en haar moeder: Laat het meisje nog enkele dagen, of tien, bij ons blijven; daarna zult u gaan.", "56": "Maar hij zei tegen hen: Houd mij niet op, omdat de HEERE mijn weg voorspoedig gemaakt heeft! Laat mij vertrekken, zodat ik naar mijn heer ga.", "57": "Toen zeiden zij: Laten we het meisje roepen, en het haar zelf vragen.", "58": "En zij riepen Rebekka, en zeiden tegen haar: Wilt u met deze man meegaan? En zij antwoordde: Ik zal gaan.", "59": "Toen lieten zij Rebekka, hun zuster, en haar voedster vertrekken, alsook de knecht van Abraham en zijn mannen.", "60": "En zij zegenden Rebekka, en zeiden tegen haar: O, onze zuster! Word u tot duizenden miljoenen, en laat uw nageslacht de poort van hun haters bezitten!", "61": "En Rebekka stond op met haar dienstmeisjes, en zij reden op kamelen, en volgden de man; en die knecht nam Rebekka, en vertrok.", "62": "Izak nu kwam van de weg naar de put Lachai-Roi; want hij woonde in het zuiderland.", "63": "En Izak was naar buiten gegaan om te bidden in het veld, tegen het vallen van de avond; en hij hief zijn ogen op en keek, en zie, de kamelen kwamen eraan!", "64": "Rebekka hief ook haar ogen op, en zij zag Izak; en zij liet zich van de kameel af glijden.", "65": "En zij zei tegen de knecht: Wie is die man, die ons tegemoet loopt in het veld? En de knecht zei: Dat is mijn heer! Toen nam zij de sluier, en bedekte zich.", "66": "En de knecht vertelde aan Izak alle zaken die hij gedaan had.", "67": "En Izak bracht haar in de tent van zijn moeder Sara; en hij nam Rebekka, en zij werd hem tot vrouw, en hij had haar lief. Zo werd Izak getroost na de *dood* van zijn moeder."}, "SV": {"1": "Abraham nu was oud *en* wel bedaagd; en de HEERE had Abraham in alles gezegend.", "2": "Zo sprak Abraham tot zijn knecht, den oudste van zijn huis, regerende over alles, wat hij had: Leg toch uw hand onder mijn heup,", "3": "Opdat ik u doe zweren bij den HEERE, den God des hemels, en den God der aarde, dat gij voor mijn zoon geen vrouw nemen zult van de dochteren der Kanaänieten, in het midden van welke ik woon;", "4": "Maar dat gij naar mijn land, en naar mijn maagschap trekken, en voor mijn zoon Izak een vrouw nemen zult.", "5": "En die knecht zeide tot hem: Misschien zal die vrouw mij niet willen volgen in dit land; zal ik dan uw zoon moeten wederbrengen in het land, waar gij uitgetogen zijt?", "6": "En Abraham zeide tot hem: Wacht u, dat gij mijn zoon niet weder daarheen brengt!", "7": "De HEERE, de God des hemels, Die mij uit mijns vaders huis en uit het land mijner maagschap genomen heeft, en Die tot mij gesproken heeft, en Die mij gezworen heeft, zeggende: Aan uw zaad zal Ik dit land geven! Die Zelf zal Zijn Engel voor uw aangezicht zenden, dat gij voor mijn zoon van daar een vrouw neemt.", "8": "Maar indien de vrouw u niet volgen wil, zo zult gij rein zijn van dezen mijn eed; alleenlijk breng mijn zoon daar niet weder heen.", "9": "Toen legde de knecht zijn hand onder de heup van Abraham, zijn heer, en hij zwoer hem over deze zaak.", "10": "En die knecht nam tien kemelen van zijns heren kemelen, en toog heen; en al het goed zijns heren was in zijn hand; en hij maakte zich op, en toog heen naar Mesopotamië, naar de stad van Nahor.", "11": "En hij deed de kemelen nederknielen buiten de stad, bij een waterput, des avondtijds, ten tijde, als de putsters uitkwamen.", "12": "En hij zeide: HEERE! God van mijn heer Abraham! doe *haar* mij toch heden ontmoeten, en doe weldadigheid bij Abraham, mijn heer.", "13": "Zie, ik sta bij de waterfontein, en de dochteren der mannen dezer stad zijn uitgaande om water te putten;", "14": "Zo geschiede, dat die jonge dochter, tot welke ik zal zeggen: Neig toch uw kruik, dat ik drinke; en zij zal zeggen: Drink, en ik zal ook uw kemelen drenken; diezelve *zij*, die Gij Uw knecht Izak toegewezen hebt, en dat ik daaraan bekenne, dat Gij weldadigheid bij mijn heer gedaan hebt.", "15": "En het geschiedde, eer hij geëindigd had te spreken, ziet, zo kwam Rebekka uit, welke aan Bethuël geboren was, de zoon van Milka, de huisvrouw van Nahor, de broeder van Abraham; en zij had haar kruik op haar schouder.", "16": "En die jonge dochter was zeer schoon van aangezicht, een maagd, en geen man had haar bekend; en zij ging af naar de fontein, en vulde haar kruik, en ging op.", "17": "Toen liep die knecht haar tegemoet, en hij zeide: Laat mij toch een weinig waters uit uw kruik drinken.", "18": "En zij zeide: Drink, mijn heer! en zij haastte zich en liet haar kruik neder op haar hand, en gaf hem te drinken.", "19": "Als zij nu voleindigd had van hem drinken te geven, zeide zij: Ik zal ook voor uw kemelen putten, totdat zij voleindigd hebben te drinken.", "20": "En zij haastte zich, en goot haar kruik uit in de drinkbak, en liep weder naar den put om te putten, en zij putte voor al zijn kemelen.", "21": "En de man ontzette zich over haar, stilzwijgende, om te merken, of de HEERE zijn weg voorspoedig gemaakt had, of niet.", "22": "En het geschiedde, als de kemelen voleindigd hadden te drinken, dat die man een gouden voorhoofdsiersel nam, welks gewicht was een halve sikkel, en twee armringen aan haar handen, welker gewicht was tien *sikkelen* gouds.", "23": "Want hij had gezegd: Wiens dochter *zijt* gij? geef het mij toch te kennen; is er ook ten huize uws vaders plaats voor ons, om te vernachten?", "24": "En zij had tot hem gezegd: Ik *ben* de dochter van Bethuël, den zoon van Milka, die zij Nahor gebaard heeft.", "25": "Voorts had zij tot hem gezegd: Ook is er stro en veel voeders bij ons, ook plaats om te vernachten.", "26": "Toen neigde die man zijn hoofd, en aanbad den HEERE;", "27": "En hij zeide: Geloofd *zij* de HEERE, de God van mijn heer Abraham, Die Zijn weldadigheid en waarheid niet nagelaten heeft van mijn heer; aangaande mij, de HEERE heeft mij op dezen weg geleid, ten huize van mijns heren broederen.", "28": "En die jonge dochter liep, en gaf ten huize harer moeder te kennen, gelijk deze zaken waren.", "29": "En Rebekka had een broeder, wiens naam was Laban; en Laban liep tot dien man naar buiten tot de fontein.", "30": "En het geschiedde, als hij dat voorhoofdsiersel gezien had, en de armringen aan de handen zijner zuster; en als hij gehoord had de woorden zijner zuster Rebekka, zeggende: Alzo heeft die man tot mij gesproken, zo kwam hij tot dien man, en ziet, hij stond bij de kemelen, bij de fontein.", "31": "En hij zeide: Kom in, gij, gezegende des HEEREN! waarom zoudt gij buiten staan? want ik heb het huis bereid, en de plaats voor de kemelen.", "32": "Toen kwam die man naar het huis toe, en men ontgordde de kemelen, en men gaf den kemelen stro en voeder; en water om zijn voeten te wassen, en de voeten der mannen, die bij hem *waren*.", "33": "Daarna werd hem te eten voorgezet ; maar hij zeide: Ik zal niet eten, totdat ik mijn woorden gesproken heb. En hij zeide: Spreek!", "34": "Toen zeide hij: Ik *ben* een knecht van Abraham;", "35": "En de HEERE heeft mijn heer zeer gezegend, zodat hij groot geworden is; en Hij heeft hem gegeven schapen, en runderen, en zilver, en goud, en knechten, en maagden, en kemelen, en ezelen.", "36": "En Sara, de huisvrouw van mijn heer, heeft mijn heer een zoon gebaard, nadat zij oud geworden was; en hij heeft hem gegeven, alles, wat hij heeft.", "37": "En mijn heer heeft mij doen zweren, zeggende: Gij zult voor mijn zoon geen vrouw nemen van de dochteren der Kanaänieten, in welker land ik wone;", "38": "Maar gij zult trekken naar het huis mijns vaders, en naar mijn geslacht, en zult voor mijn zoon een vrouw nemen!", "39": "Toen zeide ik tot mijn heer: Misschien zal mij de vrouw niet volgen.", "40": "En hij zeide tot mij: De HEERE, voor Wiens aangezicht ik gewandeld heb, zal Zijn Engel met u zenden, en Hij zal uw weg voorspoedig maken, dat gij voor mijn zoon een vrouw neemt, uit mijn geslacht en uit mijns vaders huis.", "41": "Dan zult gij van mijn eed rein zijn, wanneer gij tot mijn geslacht zult gegaan zijn; en indien zij haar u niet geven, zo zult gij rein zijn van mijn eed.", "42": "En ik kwam heden aan de fontein; en ik zeide: O, HEERE! God van mijn heer Abraham! zo Gij nu mijn weg voorspoedig maken zult, op welke ik ga;", "43": "Zie, ik sta bij de waterfontein; zo geschiede, dat de maagd, die uitkomen zal om te putten, en tot welke ik zeggen zal: Geef mij toch een weinig waters te drinken uit uw kruik;", "44": "En zij tot mij zal zeggen: Drink gij ook, en ik zal ook uw kemelen putten; dat deze die vrouw *zij*, die de HEERE aan den zoon van mijn heer heeft toegewezen.", "45": "Eer ik geëindigd had te spreken in mijn hart, ziet, zo kwam Rebekka uit, en had haar kruik op haar schouder, en zij kwam af tot de fontein en putte; en ik zeide tot haar: Geef mij toch te drinken!", "46": "Zo haastte zij zich en liet haar kruik van zich neder, en zeide: Drink gij, en ik zal ook uw kemelen drenken; en ik dronk, en zij drenkte ook de kemelen.", "47": "Toen vraagde ik haar, en zeide: Wiens dochter zijt gij? En zij zeide: De dochter van Bethuël, den zoon van Nahor, welken Milka hem gebaard heeft. Zo leide ik het voorhoofdsiersel op haar aangezicht, en de armringen aan haar handen;", "48": "En ik neigde mijn hoofd, en aanbad den HEERE; en ik loofde den HEERE, den God van mijn heer Abraham, Die mij op den rechten weg geleid had, om de dochter des broeders van mijn heer voor zijn zoon te nemen.", "49": "Nu dan, zo gijlieden weldadigheid en trouw aan mijn heer doen zult, geeft het mij te kennen; en zo niet, geeft het mij *ook* te kennen, opdat ik mij ter rechter *hand* of ter linkerhand wende.", "50": "Toen antwoordde Laban, en Bethuël, en zeiden: Van den HEERE is deze zaak voortgekomen; wij kunnen kwaad noch goed tot u spreken.", "51": "Zie, Rebekka is voor uw aangezicht; neem haar en trek henen; zij zij de vrouw van den zoon uws heren, gelijk de HEERE gesproken heeft!", "52": "En het geschiedde, als Abrahams knecht hun woorden hoorde, zo boog hij zich ter aarde voor den HEERE.", "53": "En de knecht langde voort zilveren kleinoden, en gouden kleinoden, en klederen, en hij gaf die aan Rebekka; hij gaf ook aan haar broeder en haar moeder kostelijkheden.", "54": "Toen aten en dronken zij, hij en de mannen, die bij hem *waren*; en zij vernachtten, en zij stonden des morgens op, en hij zeide: Laat mij trekken tot mijn heer!", "55": "Toen zeide haar broeder, en haar moeder: Laat de jonge dochter *enige* dagen, of tien, bij ons blijven; daarna zult gij gaan.", "56": "Maar hij zeide tot hen: Houdt mij niet op, dewijl de HEERE mijn weg voorspoedig gemaakt heeft! laat mij trekken, dat ik tot mijn heer ga.", "57": "Toen zeiden zij: Laat ons de jonge dochter roepen, en haar mond vragen.", "58": "En zij riepen Rebekka, en zeiden tot haar: Zult gij met dezen man trekken? En zij antwoordde: Ik zal trekken.", "59": "Toen lieten zij Rebekka, hun zuster, en haar voedster trekken, mitsgaders Abrahams knecht en zijn mannen.", "60": "En zij zegenden Rebekka, en zeiden tot haar: O, onze zuster! wordt gij tot duizenden millioenen, en uw zaad bezitte de poort zijner haters!", "61": "En Rebekka maakte zich op met haar jonge dochteren, en zij reden op kemelen, en volgden den man; en die knecht nam Rebekka, en toog heen.", "62": "Izak nu kwam, van daar men komt tot den put Lachai-roi; en hij woonde in het zuiderland.", "63": "En Izak was uitgegaan om te bidden in het veld, tegen het naken van den avond; en hij hief zijn ogen op en zag toe, en ziet, de kemelen kwamen!", "64": "Rebekka hief ook haar ogen op, en zij zag Izak; en zij viel van den kemel af.", "65": "En zij zeide tot den knecht: Wie is die man, die ons in het veld tegemoet wandelt? En de knecht zeide: Dat is mijn heer! Toen nam zij den sluier, en bedekte zich.", "66": "En de knecht vertelde aan Izak al de zaken, die hij gedaan had.", "67": "En Izak bracht haar in de tent van zijn moeder Sara; en hij nam Rebekka, en zij werd hem ter vrouw, en hij had haar lief. Alzo werd Izak getroost na zijner moeders *dood*."}, "KJV": {"1": "And Abraham was old, *and* well stricken in age: and the LORD had blessed Abraham", "2": "And Abraham said unto his eldest servant of his house, that ruled over all that he had, Put, I pray thee, thy hand under my thigh:", "3": "And I will make thee swear by the LORD, the God of heaven, and the God of the earth, that thou shalt not take a wife unto my son of the daughters of the Canaanites, among whom I dwell:", "4": "But thou shalt go unto my country, and to my kindred, and take a wife unto my son Isaac.", "5": "And the servant said unto him, Peradventure the woman will not be willing to follow me unto this land: must I needs bring thy son again unto the land from whence thou camest?", "6": "And Abraham said unto him, Beware thou that thou bring not my son thither again.", "7": "The LORD God of heaven, which took me from my father's house, and from the land of my kindred, and which spake unto me, and that sware unto me, saying, Unto thy seed will I give this land; he shall send his angel before thee, and thou shalt take a wife unto my son", "8": "And if the woman will not be willing to follow thee, then thou shalt be clear from this my oath: only bring not my son thither again.", "9": "And the servant put his hand under the thigh of Abraham his master, and sware to him concerning that matter.", "10": "And the servant took ten camels of the camels of his master, and departed; for all the goods of his master *were* in his hand: and he arose, and went to Mesopotamia, unto the city of Nahor.", "11": "And he made his camels to kneel down without the city by a well of water at the time of the evening, *even* the time that women go out to draw", "12": "And he said, O LORD God of my master Abraham, I pray thee, send me good speed this day, and shew kindness unto my master Abraham.", "13": "Behold, I stand *here* by the well of water; and the daughters of the men of the city come out to draw water:", "14": "And let it come to pass, that the damsel to whom I shall say, Let down thy pitcher, I pray thee, that I may drink; and she shall say, Drink, and I will give thy camels drink also: *let the same be* she *that* thou hast appointed for thy servant Isaac; and thereby shall I know that thou hast shewed kindness unto my master.", "15": "And it came to pass, before he had done speaking, that, behold, Rebekah came out, who was born to Bethuel, son of Milcah, the wife of Nahor, Abraham's brother, with her pitcher upon her shoulder.", "16": "And the damsel *was* very fair to look upon, a virgin, neither had any man known her: and she went down to the well, and filled her pitcher, and came up.", "17": "And the servant ran to meet her, and said, Let me, I pray thee, drink a little water of thy pitcher.", "18": "And she said, Drink, my lord: and she hasted, and let down her pitcher upon her hand, and gave him drink.", "19": "And when she had done giving him drink, she said, I will draw *water* for thy camels also, until they have done drinking.", "20": "And she hasted, and emptied her pitcher into the trough, and ran again unto the well to draw *water*, and drew for all his camels.", "21": "And the man wondering at her held his peace, to wit whether the LORD had made his journey prosperous or", "22": "And it came to pass, as the camels had done drinking, that the man took a golden earring of half a shekel weight, and two bracelets for her hands of ten *shekels* weight of gold;", "23": "And said, Whose daughter *art* thou? tell me, I pray thee: is there room *in* thy father's house for us to lodge in?", "24": "And she said unto him, I *am* the daughter of Bethuel the son of Milcah, which she bare unto Nahor.", "25": "She said moreover unto him, We have both straw and provender enough, and room to lodge in.", "26": "And the man bowed down his head, and worshipped the LORD.", "27": "And he said, Blessed *be* the LORD God of my master Abraham, who hath not left destitute my master of his mercy and his truth: I *being* in the way, the LORD led me to the house of my master's brethren.", "28": "And the damsel ran, and told *them of* her mother's house these things.", "29": "And Rebekah had a brother, and his name *was* Laban: and Laban ran out unto the man, unto the well.", "30": "And it came to pass, when he saw the earring and bracelets upon his sister's hands, and when he heard the words of Rebekah his sister, saying, Thus spake the man unto me; that he came unto the man; and, behold, he stood by the camels at the well.", "31": "And he said, Come in, thou blessed of the LORD; wherefore standest thou without? for I have prepared the house, and room for the camels.", "32": "And the man came into the house: and he ungirded his camels, and gave straw and provender for the camels, and water to wash his feet, and the men's feet", "33": "And there was set *meat* before him to eat: but he said, I will not eat, until I have told mine errand. And he said, Speak on.", "34": "And he said, I *am* Abraham's servant.", "35": "And the LORD hath blessed my master greatly; and he is become great: and he hath given him flocks, and herds, and silver, and gold, and menservants, and maidservants, and camels, and asses.", "36": "And Sarah my master's wife bare a son to my master when she was old: and unto him hath he given", "37": "And my master made me swear, saying, Thou shalt not take a wife to my son of the daughters of the Canaanites, in whose land I dwell:", "38": "But thou shalt go unto my father's house, and to my kindred, and take a wife unto my son.", "39": "And I said unto my master, Peradventure the woman will not follow", "40": "And he said unto me, The LORD, before whom I walk, will send his angel with thee, and prosper thy way; and thou shalt take a wife for my son of my kindred, and of my father's house:", "41": "Then shalt thou be clear from *this* my oath, when thou comest to my kindred; and if they give not thee *one*, thou shalt be clear from my oath.", "42": "And I came this day unto the well, and said, O LORD God of my master Abraham, if now thou do prosper my way which I go:", "43": "Behold, I stand by the well of water; and it shall come to pass, that when the virgin cometh forth to draw *water*, and I say to her, Give me, I pray thee, a little water of thy pitcher to drink;", "44": "And she say to me, Both drink thou, and I will also draw for thy camels: *let* the same *be* the woman whom the LORD hath appointed out for my master's son.", "45": "And before I had done speaking in mine heart, behold, Rebekah came forth with her pitcher on her shoulder; and she went down unto the well, and drew *water*: and I said unto her, Let me drink,", "46": "And she made haste, and let down her pitcher from her *shoulder*, and said, Drink, and I will give thy camels drink also: so I drank, and she made the camels drink", "47": "And I asked her, and said, Whose daughter *art* thou? And she said, The daughter of Bethuel, Nahor's son, whom Milcah bare unto him: and I put the earring upon her face, and the bracelets upon her hands.", "48": "And I bowed down my head, and worshipped the LORD, and blessed the LORD God of my master Abraham, which had led me in the right way to take my master's brother's daughter unto his son.", "49": "And now if ye will deal kindly and truly with my master, tell me: and if not, tell me; that I may turn to the right hand, or to the left.", "50": "Then Laban and Bethuel answered and said, The thing proceedeth from the LORD: we cannot speak unto thee bad or good.", "51": "Behold, Rebekah *is* before thee, take *her*, and go, and let her be thy master's son's wife, as the LORD hath spoken.", "52": "And it came to pass, that, when Abraham's servant heard their words, he worshipped the LORD, *bowing himself* to the earth.", "53": "And the servant brought forth jewels of silver, and jewels of gold, and raiment, and gave *them* to Rebekah: he gave also to her brother and to her mother precious things.", "54": "And they did eat and drink, he and the men that *were* with him, and tarried all night; and they rose up in the morning, and he said, Send me away unto my master.", "55": "And her brother and her mother said, Let the damsel abide with us *a few* days, at the least ten; after that she shall go.", "56": "And he said unto them, Hinder me not, seeing the LORD hath prospered my way; send me away that I may go to my master.", "57": "And they said, We will call the damsel, and enquire at her mouth.", "58": "And they called Rebekah, and said unto her, Wilt thou go with this man? And she said, I will go.", "59": "And they sent away Rebekah their sister, and her nurse, and Abraham's servant, and his men.", "60": "And they blessed Rebekah, and said unto her, Thou *art* our sister, be thou *the mother* of thousands of millions, and let thy seed possess the gate of those which hate", "61": "And Rebekah arose, and her damsels, and they rode upon the camels, and followed the man: and the servant took Rebekah, and went his way.", "62": "And Isaac came from the way of the well Lahairoi; for he dwelt in the south country.", "63": "And Isaac went out to meditate in the field at the eventide: and he lifted up his eyes, and saw, and, behold, the camels *were* coming.", "64": "And Rebekah lifted up her eyes, and when she saw Isaac, she lighted off the camel.", "65": "For she *had* said unto the servant, What man *is* this that walketh in the field to meet us? And the servant *had* said, It *is* my master: therefore she took a vail, and covered herself.", "66": "And the servant told Isaac all things that he had done.", "67": "And Isaac brought her into his mother Sarah's tent, and took Rebekah, and she became his wife; and he loved her: and Isaac was comforted after his mother's"}}, "tsk": {"1": [{"kopje": "was oud", "refs": ["Gen 18:11", "Gen 21:5", "Gen 25:20", "1 Kon 1:1", "Luk 1:7"]}, {"kopje": "gezegend", "refs": ["Gen 24:35", "Gen 12:2", "Gen 13:2", "Gen 49:25", "Ps 112:1-3", "Spr 10:22", "Jes 51:2", "Matt 6:33", "Gal 3:9", "Ef 1:3", "1 Tim 4:8"]}], "2": [{"kopje": "oudste", "refs": ["Gen 15:2", "1 Tim 5:17"]}, {"kopje": "regeerde", "refs": ["Gen 24:10", "Gen 39:4-6", "Gen 39:8", "Gen 39:9", "Gen 44:1"]}, {"kopje": "Leg", "refs": ["Gen 24:9", "Gen 47:29", "1 Kron 29:24"]}], "3": [{"kopje": "zweren", "refs": ["Gen 21:23", "Gen 26:28-31", "Gen 31:44-53", "Gen 50:25", "Ex 20:7", "Ex 22:11", "Ex 23:13", "Lev 19:12", "Num 5:21", "Deut 6:13", "Deut 10:20", "Joz 2:12", "1 Sam 20:17", "Neh 13:25", "Jes 45:23", "Jes 48:1", "Jes 65:16", "Jer 4:2", "Jer 12:16", "Zef 1:5", "Hebr 6:16"]}, {"kopje": "de", "refs": ["Gen 14:22", "2 Kon 19:15", "2 Kron 2:12", "Neh 9:6", "Ps 115:15", "Jer 10:11"]}, {"kopje": "dat", "refs": ["Gen 6:2", "Gen 6:4", "Gen 26:34", "Gen 26:35", "Gen 27:46", "Gen 28:1", "Gen 28:2", "Gen 28:8 /../genesis/24/#v67", "ref": "Gen 24:67", "svLabel": null}, {"disp": "Est 2:9", "href": "../../esther/2/#v9", "ref": "Est 2:9", "svLabel": null}, {"disp": "Est 2:11", "href": "../../esther/2/#v11", "ref": "Est 2:11", "svLabel": null}], "kinderen": []}]}]}}, "extern": {"Ps 98:6": "Met trompetten en bazuingeklank; juich voor het aangezicht van de Koning, de HEERE.", "Ps 4:4": "Weet toch, dat de HEERE Zich een gunstgenoot heeft afgezonderd; de HEERE zal horen, als ik tot Hem roep.", "Gen 11:29": "En Abram en Nahor namen voor zichzelf vrouwen; de naam van Abrams vrouw was Sarai, en de naam van Nahors vrouw was Milka, een dochter van Haran, vader van Milka, en vader van Jiska.", "Gen 24:13-20": "Zie, ik sta bij de waterbron, en de dochters van de mannen van deze stad komen naar buiten om water te putten; laat het zo gebeuren, dat het meisje tegen wie ik zal zeggen: Neig toch uw kruik, zodat ik drink; en zij zal zeggen: Drink, en ik zal ook uw kamelen drenken; laat zíj degene zijn die U aan Uw knecht Izak toegewezen hebt, en laat ik daaraan bekennen dat U weldadigheid aan mijn heer bewezen hebt. En het gebeurde, voordat hij klaar was met spreken, zie, dat Rebekka naar buiten kwam, die geboren was aan Bethuël, de zoon van Milka, de vrouw van Nahor, de broer van Abraham; en zij had haar kruik op haar schouder.", "1 Kon 8:56": "Geloofd zij de HEERE, Die aan Zijn volk Israël rust gegeven heeft, naar alles wat Hij gesproken heeft! Niet één woord is er gevallen van al Zijn goede woorden, die Hij gesproken heeft door de dienst van Mozes, Zijn dienaar.", "Ps 73:26": "Bezwijkt mijn vlees en mijn hart, dan is God de Rotssteen van mijn hart, en mijn Deel in eeuwigheid.", "Ex 12:41": "En het gebeurde aan het einde van de vierhonderd en dertig jaren, op diezelfde dag gebeurde het, dat alle legers van de HEERE uit Egypteland gegaan zijn.", "Ps 45:13": "En de dochter van Tyrus, de rijken onder het volk, zullen uw gunst met een geschenk smeken.", "Num 14:30": "U zult in dat land niet komen, waarover Ik Mijn hand opgeheven heb, om u daarin te laten wonen, behalve Kaleb, de zoon van Jefunne, en Jozua, de zoon van Nun.", "Ps 93:1": "De HEERE regeert, Hij is met majesteit bekleed; de HEERE is bekleed met sterkte, Hij heeft Zich omgord. Ook is de wereld bevestigd, zij zal niet wankelen.", "Ps 132:11": "De HEERE heeft David de waarheid gezworen, waarvan Hij niet wijken zal, en zei: Van de vrucht van uw buik zal Ik op uw troon zetten.", "Ps 77:12": "Ik zal de daden van de HEERE gedenken; ja, ik zal Uw wonderen van vroeger gedenken;", "Jer 10:10": "Maar de HEERE God is de Waarheid, Hij is de levende God, en een eeuwige Koning; van Zijn verbolgenheid beeft de aarde, en de heidenen kunnen Zijn gramschap niet verdragen.", "Gen 25:20": "En Izak was veertig jaar oud, toen hij Rebekka, de dochter van Bethuel, de Syriër, uit Paddan-Aram, de zuster van Laban, de Syriër, tot vrouw nam.", "Job 42:15": "En er werden zulke mooie vrouwen niet gevonden in het hele land, als de dochters van Job; en hun vader gaf hun erfdeel onder hun broers.", "Jes 48:17": "Zo zegt de HEERE, uw Verlosser, de Heilige van Israël: Ik ben de HEERE, uw God, Die u leert wat nuttig is, Die u leidt op de weg, die u gaan moet.", "Rom 11:1": "Ik zeg dan: Heeft God Zijn volk verstoten? Dat zij verre. Want ik ben ook een Israëliet, uit het zaad van Abraham, van de stam Benjamin.", "Ps 105:42": "Want Hij dacht aan Zijn heilig woord, aan Abraham, Zijn knecht.", "Openb 1:6": "En Die ons gemaakt heeft tot koningen en priesters voor God en Zijn Vader; Hem, zeg ik, zij de heerlijkheid en de kracht tot in alle eeuwigheid. Amen.", "Ps 43:5": "Wat buigt u zich neer, o mijn ziel! En wat bent u onrustig in mij? Hoop op God, want ik zal Hem nog loven; Hij is de rijke Verlossing van mijn aangezicht, en mijn God.", "Gen 25:21": "En Izak bad de HEERE vurig voor zijn vrouw; want zij was onvruchtbaar; en de HEERE liet Zich door hem verbidden, zodat Rebekka, zijn vrouw, zwanger werd.", "Ps 62:6-8": "Maar u, o mijn ziel! zwijg voor God; want van Hem is mijn verwachting. Hij is zeker mijn Rots en mijn Heil, mijn Hoog Vertrek; ik zal niet wankelen. In God is mijn Heil en mijn Eer; de Rots van mijn sterkte, mijn Toevlucht is in God.", "Ps 70:6": "Doch ik ben ellendig en nooddruftig; o God, haast U tot mij; Gij zijt mijn Hulp en mijn Bevrijder; HEERE, vertoef niet!", "Gen 12:1-7": "De HEERE had tegen Abram gezegd: Ga uit uw land, uit uw familie en uit het huis van uw vader, naar het land dat Ik u wijzen zal. En Ik zal u tot een groot volk maken, en u zegenen, en uw naam groot maken; en wees een zegen! En Ik zal zegenen wie u zegenen, en vervloeken wie u vervloekt; en in u zullen alle geslachten van de aarde gezegend worden.", "Luk 4:11": "En dat zij U op de handen zullen dragen, opdat U uw voet niet ooit aan een steen stoot.", "Gen 16:14": "Daarom noemde men die put: de put Lachai-roi; zie, hij ligt tussen Kades en Bered.", "Ps 42:6": "Wat buigt u zich neer, o mijn ziel! En bent u onrustig in mij? Hoop op God, want ik zal Hem nog loven voor de verlossingen van Zijn aangezicht.", "Ps 39:8": "En nu, wat verwacht ik, Heere? Mijn hoop is op U.", "Ps 94:15": "Want het oordeel zal terugkeren tot de gerechtigheid; en alle oprechten van hart zullen dat navolgen.", "Gen 22:15": "Toen riep de Engel van de HEERE voor de tweede keer tot Abraham vanuit de hemel;", "Gen 18:3-8": "En hij zei: Heere! Als ik nu genade gevonden heb in Uw ogen, ga toch niet aan Uw knecht voorbij. Laat er toch een beetje water gebracht worden, en was Uw voeten, en rust onder deze boom. En ik zal een stuk brood halen, dat U Uw hart sterkt; daarna kunt U verdergaan, want daarom bent U immers naar Uw knecht gekomen. En zij zeiden: Doe zoals u gesproken hebt.", "Spr 25:25": "Een goede tijding uit een ver land is als koud water op een vermoeide ziel.", "Gen 18:10-14": "En Hij zei: Ik zal zeker bij u terugkomen, omstreeks deze tijd volgend jaar; en zie, Sara, uw vrouw, zal een zoon hebben! En Sara hoorde het aan de deur van de tent, die achter Hem was. Abraham nu en Sara waren oud en op leeftijd; het was Sara opgehouden te gaan naar de wijze van de vrouwen. Zo lachte Sara bij zichzelf en zei: Zal ik nog wellust hebben, nu ik oud geworden ben, en mijn heer ook oud is?", "2 Kron 14:11": "En Asa riep tot de HEERE, zijn God, en zei: HEERE, het is voor U niets, te helpen hetzij de machtige, hetzij de krachteloze; help ons, o HEERE, onze God! Want wij steunen op U, en in Uw Naam zijn wij gekomen tegen deze menigte; o HEERE! U bent onze God; laat een sterfelijk mens tegen U niets vermogen.", "Neh 1:5": "En ik zei: Och, HEERE, God van de hemel, U, grote en ontzagwekkende God! Die het verbond en de goedertierenheid houdt voor hen die Hem liefhebben en Zijn geboden houden.", "Ps 138:7": "Als ik wandel in het midden van de benauwdheid, maakt Gij mij levend; Uw hand strekt Gij uit tegen de toorn van mijn vijanden, en Uw rechterhand behoudt mij.", "Ps 17:6": "Ik roep U aan, omdat U mij verhoort; o God! Neig Uw oor tot mij; hoor mijn woorden.", "Ps 75:8": "Maar God is Rechter; Hij vernedert deze, en verhoogt die.", "Ezech 16:50": "En zij verhieven zich, en deden gruwelijkheid voor Mijn aangezicht; daarom deed Ik ze weg, nadat Ik het gezien had.", "2 Sam 23:5": "Hoewel mijn huis zo niet is bij God, heeft Hij mij toch een eeuwig verbond gesteld, dat in alles goed geordend en bewaard is; zeker is daarin al mijn heil, en alle lust, hoewel Hij het nog niet laat uitspruiten.", "Joz 7:21": "Want ik zag onder de buit een mooi, sierlijk Babylonisch overkleed, en tweehonderd sikkelen van het zilver, en een gouden staaf, met een gewicht van vijftig sikkelen; en ik kreeg er lust naar, en ik nam ze; en zie, ze zijn verborgen in de aarde, midden in mijn tent, en het zilver daaronder.", "1 Kron 29:10-13": "Daarom loofde David de HEERE voor de ogen van de hele gemeente; en David zei: Geloofd bent U, HEERE, God van onze vader Israël, van eeuwigheid tot in eeuwigheid! Van U, o HEERE, is de grootheid, en de macht, en de heerlijkheid, en de overwinning, en de majesteit; want alles wat in de hemel en op aarde is, is van U: van U, o HEERE, is het Koninkrijk, en U hebt Uzelf verhoogd tot een Hoofd boven alles. En rijkdom en eer komen van Uw aangezicht, en U heerst over alles; en in Uw hand is kracht en macht; ook staat het in Uw hand om alles groot te maken en sterk te maken.", "Gen 28:5": "Zo zond Izak Jakob weg, zodat hij naar Paddan-aram trok, naar Laban, de zoon van Bethuel, de Syriër, de broer van Rebekka, de moeder van Jakob en Ezau.", "Ps 92:15": "In de grijze ouderdom zullen zij nog vruchten dragen; zij zullen vet en groen zijn,", "Klaagl 3:23": "Cheth. Zij zijn elke morgen nieuw, Uw trouw is groot.", "Jes 60:9": "Want de eilanden zullen Mij verwachten, en de schepen van Tarsis vooreerst, om uw kinderen van verre te brengen, hun zilver en hun goud met hen, tot de Naam van de HEERE, uw God, en tot de Heilige van Israël, omdat Hij u heerlijk gemaakt heeft.", "Jes 54:5": "Want uw Maker is uw Man, HEERE van de heerscharen is Zijn Naam; en de Heilige van Israël is uw Verlosser; Hij zal de God van de hele aardbodem genoemd worden.", "Hand 24:15": "Terwijl ik hoop heb op God, welke ook zijzelf verwachten, dat er een opstanding van de doden zal zijn, van de rechtvaardigen zowel als van de onrechtvaardigen.", "Hagg 2:6": "Met het woord, waarmee Ik met u een verbond gemaakt heb, toen u uit Egypte trok, en met Mijn Geest, die in uw midden staat: wees niet bevreesd!", "Job 31:32": "De vreemdeling overnachtte niet op de straat; mijn deuren opende ik naar de weg;", "Ps 48:9": "Zoals wij gehoord hadden, zo hebben wij gezien in de stad van de HEERE van de heerscharen, in de stad van onze God; God zal haar bevestigen tot in eeuwigheid. Sela.", "Jes 33:22": "Want de HEERE is onze Rechter, de HEERE is onze Wetgever, de HEERE is onze Koning. Hij zal ons redden.", "Jer 33:25": "Zo zegt de HEERE: Als Mijn verbond niet zou bestaan met dag en nacht, als Ik de ordeningen van de hemel en de aarde niet had vastgesteld;", "Jes 8:10": "Beraadslaag een plan, toch zal het vernietigd worden; spreek een woord, toch zal het niet standhouden; want God is met ons!", "Ps 71:1": "Op U, o HEERE! vertrouw ik; laat mij niet beschaamd worden in eeuwigheid.", "Hand 27:25": "Daarom, houd moed, mannen, want ik geloof God, dat het zo zal zijn zoals het mij gezegd is.", "Gen 14:22": "Doch Abram zei tegen de koning van Sodom: Ik heb mijn hand opgeheven tot de HEERE, de allerhoogste God, Die hemel en aarde bezit;", "Job 9:12": "Zie, Hij zal roven, wie zal het Hem doen teruggeven? Wie zal tegen Hem zeggen: Wat doet U?", "Num 27:16": "Laat de HEERE, de God van de geesten van alle vlees, een man aanstellen over deze vergadering,", "Gen 27:46": "En Rebekka zei tegen Izak: Ik heb een afkeer van mijn leven vanwege de dochters van Heth! Als Jakob een vrouw neemt van de dochters van Heth, zoals deze zijn, van de dochters van dit land, waartoe zal mij dan het leven zijn?", "Ex 34:6": "Toen de HEERE nu voor zijn aangezicht voorbijging, riep Hij: HEERE, HEERE, God, barmhartig en genadig, geduldig en groot van goedertierenheid en waarheid.", "Ps 142:6": "Tot U riep ik, o HEERE! Ik zei: U bent mijn Toevlucht, mijn Deel in het land van de levenden.", "Matt 10:9": "Verkrijgt u geen goud, geen zilver, geen koperen geld in uw gordels;", "Gen 12:7": "Toen verscheen de HEERE aan Abram, en zei: Aan uw nageslacht zal Ik dit land geven. Toen bouwde hij daar een altaar voor de HEERE, Die hem verschenen was.", "Ps 118:7": "De HEERE is bij mij onder degenen die mij helpen; daarom zal ik mijn lust zien aan degenen die mij haten.", "2 Sam 11:8": "Daarna zei David tegen Uria: Ga naar uw huis, en was uw voeten. En toen Uria uit het huis van de koning wegging, volgde hem een gerecht van de koning achterna.", "Gen 27:10": "En u zult ze naar uw vader brengen, en hij zal eten, opdat hij u zegent voor zijn dood.", "Job 12:17": "Hij voert de raadsheren beroofd weg, en de rechters maakt Hij uitzinnig,", "Gen 24:12-52": "En hij zei: HEERE! God van mijn heer Abraham! Laat mij toch vandaag haar ontmoeten, en bewijs weldadigheid aan Abraham, mijn heer. Zie, ik sta bij de waterbron, en de dochters van de mannen van deze stad komen naar buiten om water te putten; laat het zo gebeuren, dat het meisje tegen wie ik zal zeggen: Neig toch uw kruik, zodat ik drink; en zij zal zeggen: Drink, en ik zal ook uw kamelen drenken; laat zíj degene zijn die U aan Uw knecht Izak toegewezen hebt, en laat ik daaraan bekennen dat U weldadigheid aan mijn heer bewezen hebt.", "Hos 2:18": "En Ik zal u aan Mij verloven in eeuwigheid; ja, Ik zal u aan Mij verloven in gerechtigheid en in recht, en in goedertierenheid en in barmhartigheden.", "Gen 32:23": "En hij nam ze, en liet hen de beek oversteken; en hij liet oversteken wat hij had.", "Jes 49:7": "Zo zegt de HEERE, de Verlosser van Israël, Zijn Heilige, tegen de veracht ziel, tegen Hem aan Wie het volk een gruwel heeft, tegen de Knecht van hen die heersen: Koningen zullen het zien en opstaan, ook vorsten, en zij zullen zich voor U buigen; om de wil van de HEERE, Die getrouw is, om de Heilige van Israël, Die U verkozen heeft.", "Gen 11:31": "En Terah nam Abram, zijn zoon, en Lot, Harans zoon, de zoon van zijn zoon, en Sarai, zijn schoondochter, de vrouw van zijn zoon Abram, en zij trokken met hen uit Ur der Chaldeeën, om naar het land Kanaän te gaan; en zij kwamen tot Haran, en woonden daar.", "Gen 26:1-35": "Er was honger in dat land, naast de eerste honger, die er in de dagen van Abraham geweest was; daarom ging Izak naar Abimelech, de koning van de Filistijnen, naar Gerar. En de HEERE verscheen hem en zei: Trek niet naar Egypte; woon in het land dat Ik u zeggen zal; Woon als vreemdeling in dat land, en Ik zal met u zijn, en zal u zegenen; want aan u en uw nageslacht zal Ik al deze landen geven, en Ik zal de eed bevestigen die Ik Abraham, uw vader, gezworen heb.", "Job 25:2": "Heerschappij en ontzag zijn bij Hem, Hij maakt vrede in Zijn hoogten.", "Ps 46:8": "De HEERE van de heerscharen is met ons; de God van Jakob is ons een Hoog Vertrek. Sela.", "Ps 107:7": "En Hij leidde hen op een rechte weg, om te gaan naar een stad om in te wonen.", "Gen 17:16": "Want Ik zal haar zegenen, en u ook uit haar een zoon geven; ja, Ik zal haar zegenen, zodat zij tot volken wordt: koningen van volken zullen uit haar voortkomen!", "2 Kron 20:6": "En hij zei: HEERE, God van onze vaderen, bent U niet de God in de hemel? Ja, U heerst over alle koninkrijken van de heidenvolken; en in Uw hand is kracht en sterkte, zodat niemand tegen U stand kan houden.", "1 Tess 5:24": "Hij, Die u roept, is getrouw, Die het ook doen zal.", "Gen 49:25": "Van de God van uw vader, Die u zal helpen, en van de Almachtige, Die u zal zegenen, met zegeningen van de hemel van boven, met zegeningen van het afgrond, dat daaronder ligt, met zegeningen van de borsten en van de baarmoeder!", "Gen 29:24": "En Laban gaf haar Zilpa, zijn dienstmeisje, aan Lea, zijn dochter, tot een dienstmeisje.", "1 Sam 17:45-47": "David daarentegen zei tegen de Filistijn: U komt naar mij toe met een zwaard, en met een speer, en met een schild; maar ik kom naar u toe in de Naam van de HEERE van de heerscharen, de God van de slagorden van Israël, Die u gehoond hebt. Vandaag zal de HEERE u overleveren in mijn hand, en ik zal u verslaan, en ik zal uw hoofd van u wegnemen, en ik zal de dode lichamen van het leger van de Filistijnen vandaag aan de vogels van de hemel en aan de dieren van het veld geven; en heel de aarde zal weten dat Israël een God heeft. En heel deze verzameling zal weten dat de HEERE niet door zwaard of door speer verlost; want de strijd is van de HEERE, Die zal u in onze hand geven.", "Gen 39:8": "Maar hij weigerde het, en zei tegen de vrouw van zijn heer: Zie, mijn heer weet niet, met mij hier, wat er in het huis is; en alles wat hij heeft, heeft hij in mijn hand gegeven.", "Job 14:15": "Dat U zou roepen, en ik U zou antwoorden, dat U naar het werk van Uw handen zou verlangen.", "1 Petr 3:8": "En tenslotte, wees allen eensgezind, meelevend, heb de broeders lief, wees met innerlijke barmhartigheid bewogen, vriendelijk;", "Ps 16:11": "U zult mij het pad van het leven bekendmaken; overvloed van vreugde is bij Uw aangezicht; liefelijkheden zijn in Uw rechterhand, eeuwig.", "Ps 27:1": "Een psalm van David. De HEERE is mijn Licht en mijn Heil, voor wie zou ik vrezen? De HEERE is de kracht van mijn leven, voor wie zou ik bang zijn?", "2 Kor 11:1": "Och, of u mij een weinig verdroeg in de onwijsheid; ja, verdraag mij ook!", "Ps 44:5": "U Zelf bent mijn Koning, o God! Gebied de verlossingen van Jakob.", "Ps 18:2-4": "Hij zei dan: Ik zal U hartelijk liefhebben, HEERE, mijn Sterkte! De HEERE is mijn Steenrots, en mijn Burg, en mijn Uithelper; mijn God, mijn Rots, op Wie ik vertrouw; mijn Schild, en de Hoorn van mijn heil, mijn Hoog Vertrek. Ik riep de HEERE aan, die te prijzen is, en werd verlost van mijn vijanden.", "Ps 16:5": "De HEERE is het deel van mijn erfenis en van mijn beker; U onderhoudt mijn lot.", "Gen 26:4": "En Ik zal uw nageslacht vermenigvuldigen als de sterren van de hemel, en zal aan uw nageslacht al deze landen geven; en in uw nageslacht zullen alle volken van de aarde gezegend worden,", "Hand 7:5": "En Hij gaf hem geen erfdeel daarin, zelfs geen voetstap; maar Hij beloofde dat Hij het hem tot een bezitting geven zou, en aan zijn nageslacht na hem, terwijl hij nog geen kind had.", "Hand 11:17": "Als God hun dan dezelfde gave gegeven heeft als ook ons, die in de Heere Jezus Christus geloofd hebben, wie was ik dan, dat ik God zou kunnen tegenhouden?", "Joz 2:12": "Nu dan, zweer mij toch bij de HEERE, omdat ik goedheid aan u bewezen heb, dat u ook goedheid zult bewijzen aan het huis van mijn vader, en geef mij een betrouwbaar teken,", "Spr 13:16": "Al wie verstandig is, handelt met kennis; maar een dwaas breidt dwaasheid uit.", "Gen 50:20": "U wel, u hebt kwaad tegen mij gedacht; doch God heeft dat ten goede gedacht; opdat Hij deed, zoals het op deze dag is, om een groot volk in het leven te behouden.", "2 Sam 7:28": "Nu dan, Heere HEERE! U bent die God, en Uw woorden zullen waarheid zijn, en U hebt dit goede tot Uw knecht gesproken.", "Luk 1:53": "Hongerigen heeft Hij met goede dingen verzadigd; en rijken heeft Hij met lege handen weggestuurd.", "Luk 24:29": "En zij drongen bij Hem aan en zeiden: Blijf bij ons, want het is bijna avond, en de dag is bijna voorbij. En Hij ging naar binnen om bij hen te blijven.", "Ps 146:6": "Die de hemel en de aarde gemaakt heeft, de zee en alles wat daarin is; Die trouw houdt in eeuwigheid.", "Ps 89:27": "Hij zal Mij noemen: Gij zijt mijn Vader! mijn God, en de Rotssteen van mijn heil!", "1 Petr 1:18": "want u weet dat u niet met vergankelijke dingen, zilver of goud, verlost bent uit uw zinloze levenswandel, die u van uw voorouders had overgeërfd,", "Ps 18:30": "Want met U loop ik door een bende, en met mijn God spring ik over een muur.", "Ps 55:24": "Maar U, o God! zult hen doen neerdalen in de put van het verderf; de mannen van het bloed en het bedrog zullen hun dagen niet tot de helft brengen; ik, daarentegen, zal op U vertrouwen.", "1 Tim 2:9": "Evenzo ook, dat de vrouwen, in eerbaar gewaad, zichzelf sieren met schaamte en ingetogenheid, niet met vlechtingen van het haar, of goud, of parels, of kostbare kleding;", "Ps 116:7": "Mijn ziel, keer terug tot uw rust, want de HEERE heeft u goedgedaan.", "Hebr 11:9": "Door het geloof is hij een inwoner geweest in het land van de belofte, als in een vreemd land, en heeft hij in tenten gewoond met Izak en Jakob, die medeerfgenamen waren van dezelfde belofte.", "Gen 48:21": "Daarna zei Israël tegen Jozef: Zie, ik sterf; maar God zal met u zijn, en Hij zal u terugbrengen naar het land van uw vaders.", "Jer 16:19": "O HEERE! U bent mijn Sterkte, en mijn Sterkheid, en mijn Toevlucht ten dage van de benauwdheid; tot U zullen de heidenen komen van de einden van de aarde, en zeggen: Zeker hebben onze vaders leugen erfelijk bezeten, en ijdelheid, waarin toch niets was, dat nut deed.", "Ex 6:4": "En ook heb Ik het gekerm gehoord van de kinderen van Israël, die de Egyptenaars in dienstbaarheid houden, en Ik heb aan Mijn verbond gedacht.", "2 Kron 2:12": "Verder zei Huram: Geloofd zij de HEERE, de God van Israël, Die de hemel en de aarde gemaakt heeft, dat Hij aan de koning David een wijze zoon gegeven heeft, kloek in voorzichtigheid en verstand, die een huis voor de HEERE, en een huis voor zijn koninkrijk zal bouwen!", "Gen 11:25-32": "En Nahor leefde, nadat hij Terah verwekt had, honderd en negentien jaar; en hij verwekte zonen en dochters. En Terah leefde zeventig jaar, en verwekte Abram, Nahor en Haran. En dit zijn de geboorten van Terah: Terah verwekte Abram, Nahor en Haran; en Haran verwekte Lot.", "Gen 15:1": "Na deze dingen kwam het woord van de HEERE tot Abram in een visioen, en Hij zei: Vrees niet, Abram! Ik ben u een Schild, uw Loon zeer groot.", "Ps 40:11": "Uw gerechtigheid bedek ik niet in het midden van mijn hart; Uw waarheid en Uw heil spreek ik uit; Uw weldadigheid en Uw trouw verheel ik niet in de grote gemeente.", "Gen 21:23": "Zweer mij dan nu hier bij God: als u mij, of mijn zoon, of mijn kleinzoon bedriegen zult! Naar de goedheid die ik bij u gedaan heb, zult u doen bij mij, en bij het land waarin u als vreemdeling verblijft.", "Mal 1:14": "Ja, vervloekt is de bedrieger, die een mannetje in zijn kudde heeft, en de Heere een gelofte doet, en offert wat verdorven is! want Ik ben een groot Koning, zegt de HEERE van de heerscharen, en Mijn Naam is ontzagwekkend onder de heidenen.", "Jes 58:9": "Dan zult u roepen, en de HEERE zal antwoorden; u zult schreeuwen, en Hij zal zeggen: Zie, hier ben Ik. Als u uit uw midden wegdoet het juk, het uitsteken van de vinger, en het spreken van ongerechtigheid;", "2 Kron 20:12": "O, onze God, zult U geen recht over hen oefenen? Want in ons is geen kracht tegen deze grote menigte, die tegen ons optrekt, en wij weten niet wat wij moeten doen; maar onze ogen zijn op U gericht.", "Gen 30:43": "En die man breidde zich zeer sterk uit, en hij had veel kudden, en dienstmaagden, en dienstknechten, en kamelen, en ezels.", "1 Sam 25:32": "Toen zei David tegen Abigaïl: Gezegend zij de HEERE, de God van Israël, Die u vandaag mij tegemoet gezonden heeft!", "Gen 29:1": "Toen brak Jakob op, en ging naar het land van de kinderen van het Oosten.", "Ps 118:23": "Dit is van de HEERE gebeurd, en het is wonderlijk in onze ogen.", "Hand 10:22": "En zij zeiden: Cornelius, een hoofdman over honderd, een rechtvaardig man, en godvrezend, en die goede getuigenis heeft van heel het volk van de Joden, is door een Goddelijke openbaring gewaarschuwd door een heilige engel om u te ontbieden in zijn huis, en om woorden van u te horen.", "Ps 6:9": "Wijk van mij, alle werkers van de ongerechtigheid; want de HEERE heeft de stem van mijn geween gehoord.", "2 Kron 13:11": "En zij steken voor de HEERE brandoffers aan, op elke morgen en op elke avond, ook reukwerk van welriekende specerijen, met de bereiding van het brood op de reine tafel, en de gouden kandelaar en zijn lampen, om die elke avond te laten branden; want wij nemen de wacht van de HEERE, onze God, waar; maar u hebt Hem verlaten.", "1 Kron 29:20": "Daarna zei David tegen de hele gemeente: Looft nu de HEERE, uw God! Toen loofde de hele gemeente de HEERE, de God van hun vaderen; en zij bogen hun hoofd, en zij bogen zich neer voor de HEERE, en voor de koning.", "Ps 95:3-5": "Want de HEERE is een grote God; ja, een groot Koning boven alle goden; In Wiens hand de diepste plaatsen van de aarde zijn, en de hoogten van de bergen zijn van Hem; Van Hem is ook de zee, want Hij heeft ze gemaakt; en Zijn handen hebben het droge gevormd.", "Deut 31:6": "Wees sterk en heb goede moed, en vrees niet, en schrik niet voor hen; want het is de HEERE, uw God, Die met u meegaat; Hij zal u niet loslaten, en u niet verlaten.", "Gen 39:9": "Niemand is groter in dit huis dan ik, en hij heeft mij niets onthouden, behalve u, omdat u zijn vrouw bent; hoe zou ik dan dit zo grote kwaad doen, en zondigen tegen God!", "Rom 11:2": "God heeft Zijn volk niet verstoten, dat Hij van tevoren gekend heeft. Of weet u niet wat de Schrift zegt van Elia, hoe hij God aanspreekt tegen Israël, en zegt:", "Job 19:25-27": "Want ik weet: mijn Verlosser leeft, en Hij zal als de laatste over het stof opstaan; En als zij na mijn huid dit doorknaagd zullen hebben, zal ik uit mijn vlees God aanschouwen; Aan Wie ik voor mij aanschouwen zal, en mijn ogen zien zullen, en niet een vreemde; mijn nieren verlangen zeer in mijn schoot.", "1 Sam 14:9": "Als zij zo tegen ons zeggen: Blijf staan, totdat wij bij u komen, dan zullen wij op onze plaats blijven staan en niet naar hen opklimmen.", "Ps 77:13": "En ik zal al Uw werken overdenken, en van Uw daden spreken.", "Gen 28:2": "Maak u op, ga naar Paddan-aram, naar het huis van Bethuel, de vader van uw moeder, en neem u vandaar een vrouw, van de dochters van Laban, de broer van uw moeder.", "Spr 31:27": "Tsade. Zij houdt toezicht op de gangen van haar huis; en het brood van de luiheid eet zij niet.", "Deut 2:19": "En u zult naderen tegenover de kinderen van Ammon; beangstig hen niet, en meng u niet met hen; want Ik zal u van het land van de kinderen van Ammon geen erfenis geven, omdat Ik het aan de kinderen van Lot tot erfenis gegeven heb.", "Ps 18:31": "Gods weg is volmaakt; de rede van de HEERE is doorlouterd; Hij is een Schild voor allen die op Hem vertrouwen.", "2 Kor 4:16-18": "Daarom worden wij niet moedeloos; maar hoewel onze uitwendige mens verdorven wordt, wordt toch de inwendige vernieuwd van dag tot dag. Want onze lichte verdrukking, die zeer haast voorbijgaat, brengt ons een geheel bijzonder groot en eeuwig gewicht van heerlijkheid; Omdat wij niet letten op de dingen die men ziet, maar op de dingen die men niet ziet; want de dingen die men ziet, zijn tijdelijk, maar de dingen die men niet ziet, zijn eeuwig.", "Est 8:10": "En men schreef in de naam van koning Ahasveros, en men verzegelde het met de ring van de koning; en men zond de brieven door de hand van de lopers te paard, die reden op snelle kamelen, op muildieren, geteeld uit merries;", "Gen 14:20": "En gezegend zij de allerhoogste God, Die uw vijanden in uw hand overgeleverd heeft! En hij gaf hem het tiende deel van alles.", "Ps 130:5": "Ik verwacht de HEERE; mijn ziel verwacht, en ik hoop op Zijn Woord.", "Ex 3:22": "Maar elke vrouw zal van haar buurvrouw, en van de vrouw die in haar huis woont, zilveren voorwerpen eisen, en gouden voorwerpen, en kleren; die zult u op uw zonen en op uw dochters leggen, en u zult Egypte beroven.", "Gen 22:16-18": "En zei: Ik zweer bij Mijzelf, spreekt de HEERE; omdat u dit gedaan hebt, en uw zoon, uw enige, niet onthouden hebt; Voorzeker zal Ik u rijk zegenen, en uw nageslacht zeer talrijk maken, als de sterren van de hemel, en als het zand dat aan de oever van de zee is; en uw nageslacht zal de poort van zijn vijanden erfelijk bezitten. En in uw nageslacht zullen alle volken van de aarde gezegend worden, omdat u Mijn stem gehoorzaam bent geweest.", "Jona 1:9": "En hij zei tegen hen: Ik ben een Hebreeër; en ik vrees de HEERE, de God van de hemel, Die de zee en het droge gemaakt heeft.", "Neh 9:32": "Nu dan, o onze God, U grote, U machtige, en U ontzagwekkende God, Die het verbond en de weldadigheid houdt; laat voor Uw aangezicht niet gering zijn al de moeite, die ons getroffen heeft, onze koningen, onze vorsten, en onze priesters; en onze profeten, en onze vaderen, en Uw hele volk, vanaf de dagen van de koningen van Assur tot op deze dag.", "Jes 13:17": "Zie, Ik zal de Meden tegen hen opwekken, die het zilver niet zullen achten, en aan het goud zullen zij geen lust hebben.", "Ps 143:6": "Ik breid mijn handen uit tot U; mijn ziel is voor U als een dorstig land. Sela.", "Ps 124:8": "Onze hulp is in de Naam van de HEERE, Die hemel en aarde gemaakt heeft.", "Ps 42:7": "O mijn God! Mijn ziel buigt zich neer in mij, daarom denk ik aan U vanuit het land van de Jordaan en de Hermon, vanuit het kleine gebergte.", "Richt 5:11": "Van het gedruis van de schutters, tussen de plaatsen waar men water schept, spreekt men daar samen van de gerechtigheid van de HEERE, van de gerechtigheden, bewezen aan Zijn dorpen in Israël; toen ging het volk van de HEERE af naar de poorten.", "Ps 146:10": "De HEERE zal in eeuwigheid regeren; uw God, o Sion! is van geslacht tot geslacht. Halleluja!", "Ps 115:15": "U bent door de HEERE gezegend, Die de hemel en de aarde gemaakt heeft.", "Jer 14:9": "Waarom zou U zijn als een verschrikte man, als een held die niet kan verlossen? U bent toch in het midden van ons, o HEERE! En wij zijn naar Uw Naam genoemd; verlaat ons niet.", "2 Sam 7:14": "Ik zal hem tot een Vader zijn, en hij zal Mij tot een zoon zijn; wanneer hij misdoet, zal Ik hem straffen met een mensenroede en met plagen van de mensenkinderen.", "Gen 2:24": "Daarom zal de man zijn vader en zijn moeder verlaten, en zich hechten aan zijn vrouw; en zij zullen tot een vlees zijn.", "Hebr 11:14": "Want wie zulke dingen zeggen, laten daarmee duidelijk zien dat zij een vaderland zoeken.", "Gen 45:9-13": "Haast u en trek op naar mijn vader, en zeg het hem: Zo zegt uw zoon Jozef: God heeft mij tot een heer over heel Egypte gesteld; kom af naar mij, en wacht niet. En u zult in het land Gosen wonen, en dicht bij mij zijn, u en uw zonen, en de zonen van uw zonen, en uw schapen, en uw runderen, en alles wat u hebt. En ik zal u daar onderhouden; want er zullen nog vijf jaren van de honger zijn, opdat u niet verarmt, u en uw huis, en alles wat u hebt!", "1 Sam 25:39": "Toen David hoorde dat Nabal dood was, zei hij: Gezegend zij de HEERE, Die de twist om mijn smaad getwist heeft met de hand van Nabal, en Zijn knecht onthouden heeft van het kwade, en dat de HEERE het kwaad van Nabal op zijn eigen hoofd heeft doen wederkeren! En David zond heen, en liet met Abigaïl spreken, om haar tot vrouw te nemen.", "Job 1:17": "Terwijl deze nog sprak, kwam er een ander en zei: De Chaldeeën stelden drie groepen op, en vielen de kamelen aan, en namen ze mee, en sloegen de knechten met de scherpte van het zwaard; en ik ben maar alleen ontkomen om het u te vertellen.", "Ps 56:12": "Ik vertrouw op God, ik zal niet vrezen; wat zou de mens mij doen?", "Matt 4:6": "en zei tegen Hem: Als U Gods Zoon bent, werp Uzelf naar beneden; want er is geschreven dat Hij Zijn engelen bevelen zal U te beschermen, en dat zij U op de handen zullen dragen, opdat U niet op enig moment Uw voet aan een steen stoot.", "Matt 7:7": "Bid, en u zal gegeven worden; zoek, en u zult vinden; klop, en u zal opengedaan worden.", "Gen 24:13-15": "Zie, ik sta bij de waterbron, en de dochters van de mannen van deze stad komen naar buiten om water te putten; laat het zo gebeuren, dat het meisje tegen wie ik zal zeggen: Neig toch uw kruik, zodat ik drink; en zij zal zeggen: Drink, en ik zal ook uw kamelen drenken; laat zíj degene zijn die U aan Uw knecht Izak toegewezen hebt, en laat ik daaraan bekennen dat U weldadigheid aan mijn heer bewezen hebt. En het gebeurde, voordat hij klaar was met spreken, zie, dat Rebekka naar buiten kwam, die geboren was aan Bethuël, de zoon van Milka, de vrouw van Nahor, de broer van Abraham; en zij had haar kruik op haar schouder.", "Klaagl 5:19": "U, o HEERE, zit in eeuwigheid, Uw troon is van geslacht tot geslacht.", "Hoogl 5:2": "Ik sliep, maar mijn hart waakte, de stem van mijn Liefste, Die klopte, was: Doe Mij open, Mijn zuster, Mijn vriendin, Mijn duif, Mijn volmaakte! Want Mijn hoofd is vervuld met dauw, Mijn haarlokken met de druppels van de nacht.", "Num 31:34": "En eenenzestigduizend ezels;", "Lev 26:45": "Maar Ik zal hun ten goede denken aan het verbond van hun voorouders, die Ik uit het land Egypte voor de ogen van de heidenen uitgevoerd heb, opdat Ik hun tot een God zou zijn; Ik ben de HEERE!", "1 Sam 18:25": "Toen zei Saul: Zo zult u tegen David zeggen: De koning heeft geen behoefte aan een bruidsschat, maar aan honderd voorhuiden van de Filistijnen, opdat men zich wreekt op de vijanden van de koning. Want Saul dacht David te doen vallen door de hand van de Filistijnen.", "Klaagl 3:24-32": "Cheth. De HEERE is mijn deel, zegt mijn ziel, daarom zal ik op Hem hopen. Teth. De HEERE is goed voor hen die Hem verwachten, voor de ziel die Hem zoekt. Teth. Het is goed dat men hoopt, en stil is op het heil van de HEERE.", "Ps 97:2": "Rondom Hem zijn wolken en donkerheid, gerechtigheid en recht zijn de vastigheid van Zijn troon.", "Neh 13:25": "Zo twistte ik met hen, en vloekte hen, en sloeg sommige mannen van hen, en trok hun het haar uit; en ik liet hen zweren bij God: U zult uw dochters niet aan hun zonen geven, en van hun dochters niet nemen voor uw zonen of voor uzelf!", "Gen 20:15": "En Abimelech zei: Zie, mijn land ligt voor u open; woon waar het goed is in uw ogen.", "1 Sam 6:7-9": "Neem dan nu en maak een nieuwe wagen, en twee zogende koeien waarop geen juk gekomen is; span de koeien voor de wagen, en breng hun kalveren van achter hen terug naar huis. Neem dan de ark van de HEERE, en zet haar op de wagen, en leg de gouden kleinoden die u Hem als schuldoffer teruggeeft in een koffertje aan haar zijde; en zend haar weg, zodat zij vertrekt. Kijk dan toe: als zij de weg naar haar eigen gebied opgaat naar Beth-Semes, dan heeft Hij ons dit grote kwaad gedaan; maar zo niet, dan zullen wij weten dat Zijn hand ons niet geraakt heeft; het is ons een toeval geweest.", "Jes 54:1-5": "Zing vrolijk, u onvruchtbare, die niet gebaard hebt! Maak geschal met vrolijk gezang, en juich, die geen barensnood gehad hebt! Want de kinderen van de eenzame zijn meer dan de kinderen van de getrouwde, zegt de HEERE. Maak de plaats van uw tenten wijd, en laat men de gordijnen van uw woningen uitbreiden, verhinder het niet; maak uw koorden lang, en steek uw pinnen vast in. Want u zult uitbreken ter rechter hand en ter linkerhand; en uw nageslacht zal de heidenen erven, en zij zullen de verwoeste steden doen bewonen.", "Ef 5:27": "opdat Hij haar Zichzelf heerlijk zou voorstellen, een Gemeente die geen vlek of rimpel heeft, of iets dergelijks, maar die heilig en onberispelijk zou zijn.", "Ps 107:8": "Laat hen de HEERE loven om Zijn goedertierenheid, en om Zijn wonderwerken voor de kinderen der mensen;", "Richt 6:36-40": "En Gideon zei tegen God: Als U Israël door mijn hand zult verlossen, zoals U gesproken hebt, zie, ik zal een wollen vlies op de dorsvloer leggen; als er dauw op het vlies alleen zal zijn, en droogte op de hele aarde, dan zal ik weten dat U Israël door mijn hand zult verlossen, zoals U gesproken hebt. En het gebeurde zo; want hij stond de volgende morgen vroeg op, en kneep het vlies uit, en hij wrong de dauw uit het vlies, een schaal vol water.", "Spr 18:16": "Het geschenk van een mens maakt hem ruimte, en het brengt hem voor het aangezicht van de groten.", "Ps 76:12": "Doe geloften en betaal ze de HEERE, uw God, u allen, die rondom Hem zijn! Laat men Hem, Die te vrezen is, geschenken brengen;", "Richt 6:37": "zie, ik zal een wollen vlies op de dorsvloer leggen; als er dauw op het vlies alleen zal zijn, en droogte op de hele aarde, dan zal ik weten dat U Israël door mijn hand zult verlossen, zoals U gesproken hebt.", "Openb 19:6": "En ik hoorde als een stem van een grote menigte, en als een stem van veel water, en als een stem van sterke donderslagen, die zei: Halleluja, want de Heere, de almachtige God, heeft als Koning geheerst.", "Gen 13:15": "Want al dit land, dat u ziet, zal Ik u geven, en aan uw nageslacht, tot in eeuwigheid.", "Ps 89:6": "Daarom loven de hemelen Uw wonderen, o HEERE! ook is Uw getrouwheid in de gemeente van de heiligen.", "Gen 43:14": "En God, de Almachtige, geve u barmhartigheid bij die man, dat hij uw andere broer en Benjamin met u laat teruggaan! En wat mij aangaat, als ik van mijn kinderen beroofd word, dan ben ik maar beroofd!", "Hab 1:12": "Bent U niet van ouds af de HEERE, mijn God, mijn Heilige? Wij zullen niet sterven; o HEERE! Tot een oordeel hebt U hem gesteld, en o Rots! Om te straffen hebt U hem gegrondvest.", "Ex 23:13": "In alles wat Ik tegen u gezegd heb, zult u op uw hoede zijn; en de naam van andere goden zult u niet noemen; uit uw mond zal hij niet gehoord worden!", "Ps 89:29": "Ik zal hem Mijn goedertierenheid in eeuwigheid bewaren, en Mijn verbond zal hem vast blijven.", "Gen 39:22": "En de leider van de gevangenis gaf alle gevangenen die in de gevangenis waren in Jozefs hand; en alles wat zij daar deden, deed hij.", "Ps 140:8": "HEERE, Heere, sterkte van mijn heil! U hebt mijn hoofd bedekt op de dag van de wapening.", "Luk 8:39": "Keer terug naar uw huis, en vertel wat voor grote dingen God aan u gedaan heeft. En hij ging heen en verkondigde door de hele stad wat voor grote dingen Jezus aan hem gedaan had.", "Lev 25:46": "En u zult u tot bezitters over hen stellen voor uw kinderen na u, opdat zij de bezitting erven; u zult hen voor eeuwig laten dienen; maar over uw broeders, de kinderen van Israël, ieder over zijn broeder, zult u geen heerschappij hebben met wreedheid.", "Pred 7:10": "Zeg niet: Wat is er, dat de vorige dagen beter geweest zijn dan deze? Want u zou daar niet uit wijsheid naar vragen.", "Ps 119:42": "Opdat ik mijn smader wat heb te antwoorden, want ik vertrouw op Uw woord.", "1 Kon 8:15": "En hij zei: Geloofd zij de HEERE, de God van Israël, Die met Zijn mond tot mijn vader David gesproken heeft, en het met Zijn hand vervuld heeft, en zei:", "Luk 13:28": "Daar zal het geween zijn en het geknars van de tanden, wanneer u Abraham, Izak en Jakob en al de profeten zult zien in het Koninkrijk van God, en uzelf eruit gezet.", "Jes 49:16": "Zie, Ik heb u in de beide handpalmen gegraveerd; uw muren zijn steeds voor Mij.", "Ps 89:34": "Maar Mijn goedertierenheid zal Ik van hem niet wegnemen, en in Mijn getrouwheid niet feilen.", "Gen 38:12": "Toen er veel dagen verstreken waren, stierf de dochter van Sua, de vrouw van Juda; daarna vond Juda troost, en hij ging naar zijn schaapscheerders in Timna, hij en Hira, zijn vriend, de Adullamiet.", "Ps 6:10": "De HEERE heeft mijn smeking gehoord; de HEERE zal mijn gebed aannemen.", "Ezra 1:6": "Allen nu die rondom hen waren, ondersteunden hen met zilveren voorwerpen, met goud, met bezit, en met vee, en met kostbaarheden; behalve alles wat vrijwillig gegeven werd.", "Jes 44:21": "Denk aan deze dingen, o Jakob, en Israël! Want u bent Mijn knecht, Ik heb u geformeerd; u bent Mijn knecht, Israël, u zult door Mij niet vergeten worden.", "Jes 40:23": "Die de vorsten teniet maakt; de rechters van de aarde maakt Hij tot ijdelheid.", "Hebr 6:13-19": "Want toen God aan Abraham de belofte deed, zwoer Hij bij Zichzelf, omdat Hij bij niemand groter kon zweren, en zei: Waarlijk, Ik zal u overvloedig zegenen, en Ik zal u overvloedig meer maken. En zo heeft hij, nadat hij geduldig volhard had, de belofte verkregen.", "Ex 3:15": "Toen zei God verder tegen Mozes: Zo zult u tegen de kinderen van Israël zeggen: De HEERE, de God van uw vaderen, de God van Abraham, de God van Izak, en de God van Jakob, heeft mij tot u gezonden; dat is Mijn Naam eeuwig, en dat is Mijn gedachtenis van geslacht tot geslacht.", "Ps 72:18": "Geloofd zij de HEERE God, de God van Israël, Die alleen wonderen doet.", "Spr 22:4": "Het loon van de nederigheid, met de vreze des HEEREN, is rijkdom, en eer, en leven.", "Num 11:12": "Heb ik dan al dit volk ontvangen? Heb ik het gebaard? Dat U tegen mij zou zeggen: Draag het in uw schoot, zoals een voedstervader de zuigeling draagt, naar dat land dat U hun vaderen gezworen hebt?", "2 Sam 22:31": "Gods weg is volmaakt; het woord van de HEERE is doorlouterd; Hij is een Schild voor allen die op Hem vertrouwen.", "Jer 10:23": "Ik weet, o HEERE! dat bij de mens zijn weg niet is; het is niet bij een man die wandelt, dat hij zijn gang oordeelt.", "Gen 4:1": "En Adam had gemeenschap met Eva, zijn vrouw, en zij werd zwanger en baarde Kaïn, en zei: Ik heb een man van de HEERE verkregen!", "Ps 143:5": "Ik denk aan de dagen van vroeger; ik overleg al Uw daden; ik spreek bij mijzelf over de werken van Uw handen.", "Ps 69:20": "U weet mijn smaad, en mijn schaamte, en mijn schande; al mijn belagers zijn voor U.", "1 Kor 7:39": "Een vrouw is door de wet gebonden, zolang haar man leeft; maar als haar man ontslapen is, is zij vrij om te trouwen met wie zij wil, alleen in de Heere.", "Ps 121:2": "Mijn hulp is van de HEERE, Die hemel en aarde gemaakt heeft.", "Ezech 28:4": "Door uw wijsheid en door uw verstand hebt u vermogen voor uzelf verkregen; ja, u hebt goud en zilver verkregen in uw schatten.", "Dan 9:19": "O Heere, hoor! o Heere, vergeef! o Heere, merk op en doe het, wacht er niet mee! Om Uzelf, o mijn God! Want Uw stad, en Uw volk is naar Uw Naam genoemd.", "Ex 32:34": "Ga nu heen, leid dit volk naar waar Ik u gezegd heb; zie, Mijn Engel zal voor u uit gaan! Maar op de dag van het bezoeken zal Ik hun zonde over hen bezoeken!", "Gen 17:15-19": "Verder zei God tegen Abraham: Wat de naam van uw vrouw Sarai betreft, u zult haar niet meer Sarai noemen; maar haar naam zal Sara zijn. Want Ik zal haar zegenen, en u ook uit haar een zoon geven; ja, Ik zal haar zegenen, zodat zij tot volken wordt: koningen van volken zullen uit haar voortkomen! Toen viel Abraham op zijn aangezicht, en hij lachte; en hij zei in zijn hart: Zal aan iemand die honderd jaar oud is een kind geboren worden; en zal Sara, die negentig jaar oud is, baren?", "Gen 26:14": "En hij had bezit aan schapen, en bezit aan runderen, en een groot gezin; zodat de Filistijnen hem benijdden.", "1 Kron 17:27": "Nu dan, het heeft U behaagd het huis van Uw knecht te zegenen, zodat het in eeuwigheid voor Uw aangezicht zal zijn; want U, HEERE, hebt het gezegend, en het zal gezegend zijn in eeuwigheid.", "Gen 34:28": "Hun schapen, en hun runderen, en hun ezels, en wat er in de stad was, en wat er in het veld was, namen zij mee.", "Ps 66:7": "Hij heerst eeuwig met Zijn macht; Zijn ogen houden wacht over de heidenvolken; laat de afvalligen niet verhoogd worden. Sela.", "1 Kor 10:13": "U heeft geen verzoeking overvallen dan een menselijke; en God is getrouw, Die niet zal toelaten dat u verzocht wordt boven wat u kunt dragen; maar Hij zal met de verzoeking ook de uitkomst geven, zodat u het kunt verdragen.", "Ps 61:3": "Van het einde van het land roep ik tot U als mijn hart overstelpt is; leid mij op een rotssteen, die mij te hoog zou zijn.", "Ps 65:6": "Vreselijke dingen zult U ons in gerechtigheid antwoorden, o God van ons heil! o Vertrouwen van alle einden van de aarde, en van de ver weg gelegenen aan de zee!", "Ps 46:6": "God is in het midden van haar, zij zal niet wankelen; God zal haar helpen bij het aanbreken van de morgenstond.", "Job 34:13": "Wie heeft Hem gesteld over de aarde, en wie heeft de hele wereld geschikt?", "Joz 2:11": "Toen wij dat hoorden, versmolt ons hart, en er bleef geen moed meer over in iemand, vanwege uw aanwezigheid; want de HEERE, uw God, is een God boven in de hemel, en beneden op de aarde.", "1 Kon 2:3": "En neem de wacht van de HEERE, uw God, in acht, om te wandelen in Zijn wegen, om Zijn inzettingen te onderhouden, en Zijn geboden, en Zijn rechten, en Zijn getuigenissen, zoals geschreven is in de wet van Mozes; opdat u verstandig handelt in alles wat u doet, en overal waar u zich heen wendt;", "1 Tim 4:10": "Want hiervoor spannen wij ons in en worden wij versmaad, omdat wij onze hoop gevestigd hebben op de levende God, Die een Redder is van alle mensen, maar vooral van de gelovigen.", "Ex 9:2": "Want als u weigert hen te laten gaan, en u hen nog met geweld tegenhoudt,", "Deut 6:13": "U zult de HEERE, uw God, vrezen, en Hem dienen; en u zult bij Zijn Naam zweren.", "Hebr 10:34": "Want u hebt ook medelijden gehad met mij in mijn boeien, en de beroving van uw bezittingen met blijdschap aanvaard, wetende dat u voor uzelf een beter en blijvend bezit hebt in de hemelen.", "Gen 48:20": "Zo zegende hij hen op die dag, en zei: In u zal Israël zegenen, en zeggen: God stelt u als Efraïm en als Manasse! En hij stelde Efraïm voor Manasse.", "Gen 24:1-4": "Abraham nu was oud en al goed op leeftijd; en de HEERE had Abraham in alles gezegend. Zo zei Abraham tegen zijn knecht, de oudste van zijn huis, die over alles regeerde wat hij had: Leg toch uw hand onder mijn heup, opdat ik u laat zweren bij de HEERE, de God van de hemel en de God van de aarde, dat u voor mijn zoon geen vrouw zult nemen van de dochters van de Kanaänieten, in het midden van wie ik woon;", "Job 12:16": "Bij Hem is kracht en wijsheid; van Hem is hij die dwaalt, en hij die doet dwalen.", "Ps 65:3": "U hoort het gebed; tot U zal alle vlees komen.", "Gen 48:22": "En ik heb u één stuk land gegeven, boven uw broers; dat ik met mijn zwaard en met mijn boog uit de hand van de Amorieten genomen heb.", "Richt 6:17": "En hij zei tegen Hem: Als ik nu genade gevonden heb in Uw ogen, doe mij dan een teken, dat U het bent Die met mij spreekt.", "Ps 9:4": "Omdat mijn vijanden achterwaarts gekeerd, gevallen en vergaan zijn van Uw aangezicht.", "Hebr 10:23": "Laten wij de onwankelbare belijdenis van de hoop vasthouden (want Die het beloofd heeft, is trouw);", "Gen 34:6": "En Hemor, de vader van Sichem, ging naar buiten naar Jakob, om met hem te spreken.", "Ps 118:17": "Ik zal niet sterven, maar leven; en ik zal de werken van de HEERE vertellen.", "Matt 6:33": "Maar zoek eerst het Koninkrijk van God en Zijn gerechtigheid, en al deze dingen zullen u erbij gegeven worden.", "Neh 9:6": "U bent die HEERE alleen, U hebt de hemel gemaakt, de hemel der hemelen, en al hun leger, de aarde en alles wat daarop is, de zeeën en alles wat daarin is, en U maakt dat alles levend; en het leger van de hemel aanbidt U.", "Gen 26:7": "En toen de mannen van die plaats hem naar zijn vrouw vroegen, zei hij: Zij is mijn zuster; want hij was bang om te zeggen: mijn vrouw; want, dacht hij, misschien doden de mannen van deze plaats mij om Rebekka, want zij was mooi om te zien.", "1 Tess 3:11": "Moge nu onze God en Vader Zelf, en onze Heere Jezus Christus, onze weg naar u richten.", "Ps 118:10": "Alle heidenen hadden mij omringd; het is in de Naam van de HEERE, dat ik hen verslagen heb.", "Ex 2:24": "En God hoorde hun gekerm, en God dacht aan Zijn verbond met Abraham, met Izak, en met Jakob.", "Ps 60:11": "Wie zal mij brengen in een vaste stad? Wie zal mij leiden tot in Edom?", "Ex 30:21": "Dan moeten zij hun handen en voeten wassen, zodat zij niet sterven; en dit zal voor hen een eeuwige instelling zijn, voor hem en zijn nageslacht, bij hun geslachten.", "Jes 51:6": "Hef uw ogen op naar de hemel, en kijk naar de aarde beneden; want de hemel zal als rook verdwijnen, en de aarde zal als een kleed verouderen, en haar inwoners zullen op dezelfde manier sterven; maar Mijn heil zal in eeuwigheid zijn, Mijn gerechtigheid zal niet verbroken worden.", "Pred 9:1": "Zeker, dit alles heb ik in mijn hart overwogen, opdat ik dit alles klaar mocht verstaan: dat de rechtvaardigen en de wijzen en hun werken in de hand van God zijn; ook liefde, ook haat, weet de mens niet uit al wat voor zijn aangezicht is.", "Rom 8:39": "Noch hoogte, noch diepte, noch enig ander schepsel ons zal kunnen scheiden van de liefde van God, die er is in Christus Jezus, onze Heere.", "Hoogl 4:13": "Uw scheuten zijn een paradijs van granaatappels, met edele vruchten, cyprus met nardus;", "Ps 119:15": "Ik zal Uw bevelen overdenken, en op Uw paden letten.", "Ps 26:1": "Een psalm van David. Doe mij recht, HEERE! Want ik wandel in mijn oprechtheid; en ik vertrouw op de HEERE, ik zal niet wankelen.", "Ps 23:1-6": "Een psalm van David. De HEERE is mijn Herder, mij zal niets ontbreken. Hij laat mij neerliggen in grazige weiden; Hij voert mij zachtjes naar zeer stille wateren. Hij verkwikt mijn ziel; Hij leidt mij in het spoor van de gerechtigheid, omwille van Zijn Naam.", "Jes 43:15": "Ik ben de HEERE, uw Heilige; de Schepper van Israël, uw Koning.", "1 Sam 20:7": "Als hij zo zeg
