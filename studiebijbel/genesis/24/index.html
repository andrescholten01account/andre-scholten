d if the <span class=\"wl wl-kjv\" data-code=\"H802\">woman</span> will not be <span class=\"wl wl-kjv\" data-code=\"H14\">willing</span> to <span class=\"wl wl-kjv\" data-code=\"H3212\">follow</span> <span class=\"wl wl-kjv\" data-code=\"H310\">thee,</span> then thou shalt be <span class=\"wl wl-kjv\" data-code=\"H5352\">clear</span> from this my <span class=\"wl wl-kjv\" data-code=\"H7621\">oath:</span> only <span class=\"wl wl-kjv\" data-code=\"H7725\">bring</span> not my <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> thither again.","9":"And the <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> <span class=\"wl wl-kjv\" data-code=\"H7760\">put</span> his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> under the <span class=\"wl wl-kjv\" data-code=\"H3409\">thigh</span> of <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham</span> his <span class=\"wl wl-kjv\" data-code=\"H113\">master,</span> and <span class=\"wl wl-kjv\" data-code=\"H7650\">sware</span> to him <span class=\"wl wl-kjv\" data-code=\"H5921\">concerning</span> <span class=\"wl wl-kjv\" data-code=\"H2088\">that</span> matter.","10":"And the <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> <span class=\"wl wl-kjv\" data-code=\"H6235\">ten</span> <span class=\"wl wl-kjv\" data-code=\"H1581\">camels</span> of the <span class=\"wl wl-kjv\" data-code=\"H1581\">camels</span> of his <span class=\"wl wl-kjv\" data-code=\"H113\">master,</span> and <span class=\"wl wl-kjv\" data-code=\"H3212\">departed;</span> for all the <span class=\"wl wl-kjv\" data-code=\"H2898\">goods</span> of his <span class=\"wl wl-kjv\" data-code=\"H113\">master</span> were in his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand:</span> and he <span class=\"wl wl-kjv\" data-code=\"H6965\">arose,</span> and <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> to <span class=\"wl wl-kjv\" data-code=\"H763\">Mesopotamia,</span> unto the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> of Nahor.","11":"And he <span class=\"wl wl-kjv\" data-code=\"H1288\">made</span> his <span class=\"wl wl-kjv\" data-code=\"H1581\">camels</span> to kneel <span class=\"wl wl-kjv\" data-code=\"H1288\">down</span> <span class=\"wl wl-kjv\" data-code=\"H2351\">without</span> the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> <span class=\"wl wl-kjv\" data-code=\"H413\">by</span> a <span class=\"wl wl-kjv\" data-code=\"H875\">well</span> of <span class=\"wl wl-kjv\" data-code=\"H4325\">water</span> at the <span class=\"wl wl-kjv\" data-code=\"H6256\">time</span> of the <span class=\"wl wl-kjv\" data-code=\"H6153\">evening,</span> even the <span class=\"wl wl-kjv\" data-code=\"H6256\">time</span> that women go <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> to draw","12":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> O <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of my <span class=\"wl wl-kjv\" data-code=\"H113\">master</span> <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham,</span> I pray thee, send <span class=\"wl wl-kjv\" data-code=\"H6440\">me</span> good <span class=\"wl wl-kjv\" data-code=\"H7136\">speed</span> this <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> and <span class=\"wl wl-kjv\" data-code=\"H6213\">shew</span> <span class=\"wl wl-kjv\" data-code=\"H2617\">kindness</span> <span class=\"wl wl-kjv\" data-code=\"H5973\">unto</span> my <span class=\"wl wl-kjv\" data-code=\"H113\">master</span> Abraham.","13":"Behold, I <span class=\"wl wl-kjv\" data-code=\"H5324\">stand</span> here by the <span class=\"wl wl-kjv\" data-code=\"H5869\">well</span> of <span class=\"wl wl-kjv\" data-code=\"H4325\">water;</span> and the <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters</span> of the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> of the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> come <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> to <span class=\"wl wl-kjv\" data-code=\"H7579\">draw</span> water:","14":"And let it come to pass, that the <span class=\"wl wl-kjv\" data-code=\"H5291\">damsel</span> to whom I shall <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> Let <span class=\"wl wl-kjv\" data-code=\"H5186\">down</span> thy <span class=\"wl wl-kjv\" data-code=\"H3537\">pitcher,</span> I pray thee, that I may <span class=\"wl wl-kjv\" data-code=\"H8354\">drink;</span> and she shall <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> <span class=\"wl wl-kjv\" data-code=\"H8354\">Drink,</span> and I will <span class=\"wl wl-kjv\" data-code=\"H8248\">give</span> thy <span class=\"wl wl-kjv\" data-code=\"H1581\">camels</span> <span class=\"wl wl-kjv\" data-code=\"H8248\">drink</span> also: let the same be she that thou hast <span class=\"wl wl-kjv\" data-code=\"H3198\">appointed</span> for thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> <span class=\"wl wl-kjv\" data-code=\"H3327\">Isaac;</span> and thereby shall I <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> that thou hast <span class=\"wl wl-kjv\" data-code=\"H6213\">shewed</span> <span class=\"wl wl-kjv\" data-code=\"H2617\">kindness</span> unto my master.","15":"And it came to pass, before he had <span class=\"wl wl-kjv\" data-code=\"H3615\">done</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">speaking,</span> that, behold, <span class=\"wl wl-kjv\" data-code=\"H7259\">Rebekah</span> came <span class=\"wl wl-kjv\" data-code=\"H3318\">out,</span> <span class=\"wl wl-kjv\" data-code=\"H834\">who</span> was <span class=\"wl wl-kjv\" data-code=\"H3205\">born</span> to <span class=\"wl wl-kjv\" data-code=\"H1328\">Bethuel,</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H4435\">Milcah,</span> the <span class=\"wl wl-kjv\" data-code=\"H802\">wife</span> of <span class=\"wl wl-kjv\" data-code=\"H5152\">Nahor,</span> <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham's</span> <span class=\"wl wl-kjv\" data-code=\"H251\">brother,</span> with her <span class=\"wl wl-kjv\" data-code=\"H3537\">pitcher</span> upon her shoulder.","16":"And the <span class=\"wl wl-kjv\" data-code=\"H5291\">damsel</span> was <span class=\"wl wl-kjv\" data-code=\"H3966\">very</span> <span class=\"wl wl-kjv\" data-code=\"H2896\">fair</span> to look <span class=\"wl wl-kjv\" data-code=\"H4758\">upon,</span> a <span class=\"wl wl-kjv\" data-code=\"H1330\">virgin,</span> neither had any <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> <span class=\"wl wl-kjv\" data-code=\"H3045\">known</span> her: and she went <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> to the <span class=\"wl wl-kjv\" data-code=\"H5869\">well,</span> and <span class=\"wl wl-kjv\" data-code=\"H4390\">filled</span> her <span class=\"wl wl-kjv\" data-code=\"H3537\">pitcher,</span> and came up.","17":"And the <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> <span class=\"wl wl-kjv\" data-code=\"H7323\">ran</span> to meet <span class=\"wl wl-kjv\" data-code=\"H7125\">her,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Let me, I pray thee, <span class=\"wl wl-kjv\" data-code=\"H1572\">drink</span> a <span class=\"wl wl-kjv\" data-code=\"H4592\">little</span> <span class=\"wl wl-kjv\" data-code=\"H4325\">water</span> of thy pitcher.","18":"And she <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H8354\">Drink,</span> my <span class=\"wl wl-kjv\" data-code=\"H113\">lord:</span> and she <span class=\"wl wl-kjv\" data-code=\"H4116\">hasted,</span> and let <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> her <span class=\"wl wl-kjv\" data-code=\"H3537\">pitcher</span> upon her <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> and gave him drink.","19":"And when she had <span class=\"wl wl-kjv\" data-code=\"H3615\">done</span> giving him <span class=\"wl wl-kjv\" data-code=\"H8248\">drink,</span> she <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> I will <span class=\"wl wl-kjv\" data-code=\"H7579\">draw</span> water for thy <span class=\"wl wl-kjv\" data-code=\"H1581\">camels</span> also, until they have <span class=\"wl wl-kjv\" data-code=\"H3615\">done</span> drinking.","20":"And she <span class=\"wl wl-kjv\" data-code=\"H4116\">hasted,</span> and <span class=\"wl wl-kjv\" data-code=\"H6168\">emptied</span> her <span class=\"wl wl-kjv\" data-code=\"H3537\">pitcher</span> into the <span class=\"wl wl-kjv\" data-code=\"H8268\">trough,</span> and <span class=\"wl wl-kjv\" data-code=\"H7323\">ran</span> again unto the <span class=\"wl wl-kjv\" data-code=\"H875\">well</span> to <span class=\"wl wl-kjv\" data-code=\"H7579\">draw</span> water, and <span class=\"wl wl-kjv\" data-code=\"H7579\">drew</span> for all his camels.","21":"And the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> <span class=\"wl wl-kjv\" data-code=\"H7583\">wondering</span> at her held his <span class=\"wl wl-kjv\" data-code=\"H2790\">peace,</span> to <span class=\"wl wl-kjv\" data-code=\"H3045\">wit</span> whether the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> had <span class=\"wl wl-kjv\" data-code=\"H6743\">made</span> his <span class=\"wl wl-kjv\" data-code=\"H1870\">journey</span> <span class=\"wl wl-kjv\" data-code=\"H6743\">prosperous</span> or","22":"And it came to pass, as the <span class=\"wl wl-kjv\" data-code=\"H1581\">camels</span> had <span class=\"wl wl-kjv\" data-code=\"H3615\">done</span> <span class=\"wl wl-kjv\" data-code=\"H8354\">drinking,</span> that the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> a <span class=\"wl wl-kjv\" data-code=\"H2091\">golden</span> <span class=\"wl wl-kjv\" data-code=\"H5141\">earring</span> of half a <span class=\"wl wl-kjv\" data-code=\"H1235\">shekel</span> <span class=\"wl wl-kjv\" data-code=\"H4948\">weight,</span> and <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H6781\">bracelets</span> for her <span class=\"wl wl-kjv\" data-code=\"H3027\">hands</span> of <span class=\"wl wl-kjv\" data-code=\"H6235\">ten</span> shekels <span class=\"wl wl-kjv\" data-code=\"H4948\">weight</span> of gold;","23":"And <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H4310\">Whose</span> <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> art <span class=\"wl wl-kjv\" data-code=\"H859\">thou?</span> <span class=\"wl wl-kjv\" data-code=\"H5046\">tell</span> me, I pray thee: is <span class=\"wl wl-kjv\" data-code=\"H3426\">there</span> <span class=\"wl wl-kjv\" data-code=\"H4725\">room</span> in thy <span class=\"wl wl-kjv\" data-code=\"H1\">father's</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> for us to lodge in?","24":"And she <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, I am the <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> of <span class=\"wl wl-kjv\" data-code=\"H1328\">Bethuel</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H4435\">Milcah,</span> which she <span class=\"wl wl-kjv\" data-code=\"H3205\">bare</span> unto Nahor.","25":"She <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> moreover unto him, We have <span class=\"wl wl-kjv\" data-code=\"H1571\">both</span> <span class=\"wl wl-kjv\" data-code=\"H8401\">straw</span> and <span class=\"wl wl-kjv\" data-code=\"H4554\">provender</span> <span class=\"wl wl-kjv\" data-code=\"H7227\">enough,</span> <span class=\"wl wl-kjv\" data-code=\"H1571\">and</span> <span class=\"wl wl-kjv\" data-code=\"H4725\">room</span> to lodge in.","26":"And the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> bowed down his <span class=\"wl wl-kjv\" data-code=\"H6915\">head,</span> and <span class=\"wl wl-kjv\" data-code=\"H7812\">worshipped</span> the LORD.","27":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H1288\">Blessed</span> be the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of my <span class=\"wl wl-kjv\" data-code=\"H113\">master</span> <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham,</span> who hath not left <span class=\"wl wl-kjv\" data-code=\"H5800\">destitute</span> my <span class=\"wl wl-kjv\" data-code=\"H113\">master</span> of his <span class=\"wl wl-kjv\" data-code=\"H2617\">mercy</span> and his <span class=\"wl wl-kjv\" data-code=\"H571\">truth:</span> I being in the <span class=\"wl wl-kjv\" data-code=\"H1870\">way,</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> led <span class=\"wl wl-kjv\" data-code=\"H5148\">me</span> to the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of my <span class=\"wl wl-kjv\" data-code=\"H113\">master's</span> brethren.","28":"And the <span class=\"wl wl-kjv\" data-code=\"H5291\">damsel</span> <span class=\"wl wl-kjv\" data-code=\"H7323\">ran,</span> and <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> them of her <span class=\"wl wl-kjv\" data-code=\"H517\">mother's</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> these things.","29":"And <span class=\"wl wl-kjv\" data-code=\"H7259\">Rebekah</span> had a <span class=\"wl wl-kjv\" data-code=\"H251\">brother,</span> and his <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> was <span class=\"wl wl-kjv\" data-code=\"H3837\">Laban:</span> and <span class=\"wl wl-kjv\" data-code=\"H3837\">Laban</span> <span class=\"wl wl-kjv\" data-code=\"H7323\">ran</span> <span class=\"wl wl-kjv\" data-code=\"H2351\">out</span> unto the <span class=\"wl wl-kjv\" data-code=\"H376\">man,</span> unto the well.","30":"And it came to pass, when he <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> the <span class=\"wl wl-kjv\" data-code=\"H5141\">earring</span> and <span class=\"wl wl-kjv\" data-code=\"H6781\">bracelets</span> upon his <span class=\"wl wl-kjv\" data-code=\"H269\">sister's</span> <span class=\"wl wl-kjv\" data-code=\"H3027\">hands,</span> and when he <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> the <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> of <span class=\"wl wl-kjv\" data-code=\"H7259\">Rebekah</span> his <span class=\"wl wl-kjv\" data-code=\"H269\">sister,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H3541\">Thus</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> unto me; that he <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> unto the <span class=\"wl wl-kjv\" data-code=\"H376\">man;</span> and, behold, he <span class=\"wl wl-kjv\" data-code=\"H5975\">stood</span> <span class=\"wl wl-kjv\" data-code=\"H5921\">by</span> the <span class=\"wl wl-kjv\" data-code=\"H1581\">camels</span> at the well.","31":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Come <span class=\"wl wl-kjv\" data-code=\"H935\">in,</span> thou <span class=\"wl wl-kjv\" data-code=\"H1288\">blessed</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD;</span> wherefore <span class=\"wl wl-kjv\" data-code=\"H5975\">standest</span> thou <span class=\"wl wl-kjv\" data-code=\"H2351\">without?</span> for I have <span class=\"wl wl-kjv\" data-code=\"H6437\">prepared</span> the <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> and <span class=\"wl wl-kjv\" data-code=\"H4725\">room</span> for the camels.","32":"And the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> into the <span class=\"wl wl-kjv\" data-code=\"H1004\">house:</span> and he <span class=\"wl wl-kjv\" data-code=\"H6605\">ungirded</span> his <span class=\"wl wl-kjv\" data-code=\"H1581\">camels,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> <span class=\"wl wl-kjv\" data-code=\"H8401\">straw</span> and <span class=\"wl wl-kjv\" data-code=\"H4554\">provender</span> for the <span class=\"wl wl-kjv\" data-code=\"H1581\">camels,</span> and <span class=\"wl wl-kjv\" data-code=\"H4325\">water</span> to <span class=\"wl wl-kjv\" data-code=\"H7364\">wash</span> his <span class=\"wl wl-kjv\" data-code=\"H7272\">feet,</span> and the <span class=\"wl wl-kjv\" data-code=\"H582\">men's</span> feet","33":"And there was <span class=\"wl wl-kjv\" data-code=\"H7760\">set</span> meat before <span class=\"wl wl-kjv\" data-code=\"H6440\">him</span> to <span class=\"wl wl-kjv\" data-code=\"H398\">eat:</span> but he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> I will not <span class=\"wl wl-kjv\" data-code=\"H398\">eat,</span> until I have <span class=\"wl wl-kjv\" data-code=\"H1696\">told</span> mine <span class=\"wl wl-kjv\" data-code=\"H1697\">errand.</span> And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Speak on.","34":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> I am <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham's</span> servant.","35":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H1288\">blessed</span> my <span class=\"wl wl-kjv\" data-code=\"H113\">master</span> <span class=\"wl wl-kjv\" data-code=\"H3966\">greatly;</span> and he is become <span class=\"wl wl-kjv\" data-code=\"H1431\">great:</span> and he hath <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> him <span class=\"wl wl-kjv\" data-code=\"H6629\">flocks,</span> and <span class=\"wl wl-kjv\" data-code=\"H1241\">herds,</span> and <span class=\"wl wl-kjv\" data-code=\"H3701\">silver,</span> and <span class=\"wl wl-kjv\" data-code=\"H2091\">gold,</span> and <span class=\"wl wl-kjv\" data-code=\"H5650\">menservants,</span> and <span class=\"wl wl-kjv\" data-code=\"H8198\">maidservants,</span> and <span class=\"wl wl-kjv\" data-code=\"H1581\">camels,</span> and asses.","36":"And <span class=\"wl wl-kjv\" data-code=\"H8283\">Sarah</span> my <span class=\"wl wl-kjv\" data-code=\"H113\">master's</span> <span class=\"wl wl-kjv\" data-code=\"H802\">wife</span> <span class=\"wl wl-kjv\" data-code=\"H3205\">bare</span> a <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> to my <span class=\"wl wl-kjv\" data-code=\"H113\">master</span> <span class=\"wl wl-kjv\" data-code=\"H310\">when</span> she was <span class=\"wl wl-kjv\" data-code=\"H2209\">old:</span> and unto him hath he given","37":"And my <span class=\"wl wl-kjv\" data-code=\"H113\">master</span> made me <span class=\"wl wl-kjv\" data-code=\"H7650\">swear,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Thou shalt not <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> a <span class=\"wl wl-kjv\" data-code=\"H802\">wife</span> to my <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of the <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters</span> of the <span class=\"wl wl-kjv\" data-code=\"H3669\">Canaanites,</span> in whose <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> I dwell:","38":"<span class=\"wl wl-kjv\" data-code=\"H518\">But</span> thou shalt <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> unto my <span class=\"wl wl-kjv\" data-code=\"H1\">father's</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> and to my <span class=\"wl wl-kjv\" data-code=\"H4940\">kindred,</span> and <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> a <span class=\"wl wl-kjv\" data-code=\"H802\">wife</span> unto my son.","39":"And I <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto my <span class=\"wl wl-kjv\" data-code=\"H113\">master,</span> Peradventure the <span class=\"wl wl-kjv\" data-code=\"H802\">woman</span> will not <span class=\"wl wl-kjv\" data-code=\"H3212\">follow</span>","40":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto me, The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> whom I <span class=\"wl wl-kjv\" data-code=\"H1980\">walk,</span> will <span class=\"wl wl-kjv\" data-code=\"H7971\">send</span> his <span class=\"wl wl-kjv\" data-code=\"H4397\">angel</span> with thee, and <span class=\"wl wl-kjv\" data-code=\"H6743\">prosper</span> thy <span class=\"wl wl-kjv\" data-code=\"H1870\">way;</span> and thou shalt <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> a <span class=\"wl wl-kjv\" data-code=\"H802\">wife</span> for my <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of my <span class=\"wl wl-kjv\" data-code=\"H4940\">kindred,</span> and of my <span class=\"wl wl-kjv\" data-code=\"H1\">father's</span> house:","41":"Then shalt thou be <span class=\"wl wl-kjv\" data-code=\"H5352\">clear</span> from this my <span class=\"wl wl-kjv\" data-code=\"H423\">oath,</span> when thou <span class=\"wl wl-kjv\" data-code=\"H935\">comest</span> to my <span class=\"wl wl-kjv\" data-code=\"H4940\">kindred;</span> and if they <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> not thee one, thou shalt be <span class=\"wl wl-kjv\" data-code=\"H5355\">clear</span> from my oath.","42":"And I <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> this <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> unto the <span class=\"wl wl-kjv\" data-code=\"H5869\">well,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> O <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of my <span class=\"wl wl-kjv\" data-code=\"H113\">master</span> <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham,</span> if now thou <span class=\"wl wl-kjv\" data-code=\"H3426\">do</span> <span class=\"wl wl-kjv\" data-code=\"H6743\">prosper</span> my <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> which I go:","43":"Behold, I <span class=\"wl wl-kjv\" data-code=\"H5324\">stand</span> by the <span class=\"wl wl-kjv\" data-code=\"H5869\">well</span> of <span class=\"wl wl-kjv\" data-code=\"H4325\">water;</span> and it shall come to pass, that when the <span class=\"wl wl-kjv\" data-code=\"H5959\">virgin</span> cometh <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> to <span class=\"wl wl-kjv\" data-code=\"H7579\">draw</span> water, and I <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> to her, Give <span class=\"wl wl-kjv\" data-code=\"H8248\">me,</span> I pray thee, a <span class=\"wl wl-kjv\" data-code=\"H4592\">little</span> <span class=\"wl wl-kjv\" data-code=\"H4325\">water</span> of thy <span class=\"wl wl-kjv\" data-code=\"H3537\">pitcher</span> to drink;","44":"And she <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> to me, Both <span class=\"wl wl-kjv\" data-code=\"H8354\">drink</span> thou, and I will also <span class=\"wl wl-kjv\" data-code=\"H7579\">draw</span> for thy <span class=\"wl wl-kjv\" data-code=\"H1581\">camels:</span> let the same be the <span class=\"wl wl-kjv\" data-code=\"H802\">woman</span> whom the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath appointed <span class=\"wl wl-kjv\" data-code=\"H3198\">out</span> for my <span class=\"wl wl-kjv\" data-code=\"H113\">master's</span> son.","45":"And before I had <span class=\"wl wl-kjv\" data-code=\"H3615\">done</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">speaking</span> in mine <span class=\"wl wl-kjv\" data-code=\"H3820\">heart,</span> behold, <span class=\"wl wl-kjv\" data-code=\"H7259\">Rebekah</span> came <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> with her <span class=\"wl wl-kjv\" data-code=\"H3537\">pitcher</span> on her <span class=\"wl wl-kjv\" data-code=\"H7926\">shoulder;</span> and she went <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> unto the <span class=\"wl wl-kjv\" data-code=\"H5869\">well,</span> and <span class=\"wl wl-kjv\" data-code=\"H7579\">drew</span> water: and I <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto her, Let me drink,","46":"And she made <span class=\"wl wl-kjv\" data-code=\"H4116\">haste,</span> and let <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> her <span class=\"wl wl-kjv\" data-code=\"H3537\">pitcher</span> from her shoulder, and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H8354\">Drink,</span> and I will <span class=\"wl wl-kjv\" data-code=\"H8248\">give</span> thy <span class=\"wl wl-kjv\" data-code=\"H1581\">camels</span> <span class=\"wl wl-kjv\" data-code=\"H8248\">drink</span> also: so I <span class=\"wl wl-kjv\" data-code=\"H8354\">drank,</span> and she <span class=\"wl wl-kjv\" data-code=\"H8248\">made</span> the <span class=\"wl wl-kjv\" data-code=\"H1581\">camels</span> drink","47":"And I <span class=\"wl wl-kjv\" data-code=\"H7592\">asked</span> her, and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Whose <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> art thou? And she <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> The <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> of <span class=\"wl wl-kjv\" data-code=\"H1328\">Bethuel,</span> <span class=\"wl wl-kjv\" data-code=\"H5152\">Nahor's</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">son,</span> whom <span class=\"wl wl-kjv\" data-code=\"H4435\">Milcah</span> <span class=\"wl wl-kjv\" data-code=\"H3205\">bare</span> unto him: and I <span class=\"wl wl-kjv\" data-code=\"H7760\">put</span> the <span class=\"wl wl-kjv\" data-code=\"H5141\">earring</span> upon her <span class=\"wl wl-kjv\" data-code=\"H639\">face,</span> and the <span class=\"wl wl-kjv\" data-code=\"H6781\">bracelets</span> upon her hands.","48":"And I bowed down my <span class=\"wl wl-kjv\" data-code=\"H6915\">head,</span> and <span class=\"wl wl-kjv\" data-code=\"H7812\">worshipped</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and <span class=\"wl wl-kjv\" data-code=\"H1288\">blessed</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of my <span class=\"wl wl-kjv\" data-code=\"H113\">master</span> <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham,</span> which had led <span class=\"wl wl-kjv\" data-code=\"H5148\">me</span> in the <span class=\"wl wl-kjv\" data-code=\"H571\">right</span> <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> to <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> my <span class=\"wl wl-kjv\" data-code=\"H113\">master's</span> <span class=\"wl wl-kjv\" data-code=\"H251\">brother's</span> <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> unto his son.","49":"And now if ye <span class=\"wl wl-kjv\" data-code=\"H3426\">will</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">deal</span> <span class=\"wl wl-kjv\" data-code=\"H2617\">kindly</span> and <span class=\"wl wl-kjv\" data-code=\"H571\">truly</span> with my <span class=\"wl wl-kjv\" data-code=\"H113\">master,</span> <span class=\"wl wl-kjv\" data-code=\"H5046\">tell</span> me: and if not, <span class=\"wl wl-kjv\" data-code=\"H5046\">tell</span> me; that I may <span class=\"wl wl-kjv\" data-code=\"H6437\">turn</span> to the right <span class=\"wl wl-kjv\" data-code=\"H3225\">hand,</span> <span class=\"wl wl-kjv\" data-code=\"H176\">or</span> to the left.","50":"Then <span class=\"wl wl-kjv\" data-code=\"H3837\">Laban</span> and <span class=\"wl wl-kjv\" data-code=\"H1328\">Bethuel</span> <span class=\"wl wl-kjv\" data-code=\"H6030\">answered</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> The <span class=\"wl wl-kjv\" data-code=\"H1697\">thing</span> <span class=\"wl wl-kjv\" data-code=\"H3318\">proceedeth</span> from the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD:</span> we <span class=\"wl wl-kjv\" data-code=\"H3201\">cannot</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> unto thee <span class=\"wl wl-kjv\" data-code=\"H7451\">bad</span> <span class=\"wl wl-kjv\" data-code=\"H176\">or</span> good.","51":"Behold, <span class=\"wl wl-kjv\" data-code=\"H7259\">Rebekah</span> is before <span class=\"wl wl-kjv\" data-code=\"H6440\">thee,</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> her, and <span class=\"wl wl-kjv\" data-code=\"H3212\">go,</span> and let her be thy <span class=\"wl wl-kjv\" data-code=\"H113\">master's</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">son's</span> <span class=\"wl wl-kjv\" data-code=\"H802\">wife,</span> as the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath spoken.","52":"And it came to pass, that, when <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham's</span> <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> their <span class=\"wl wl-kjv\" data-code=\"H1697\">words,</span> he <span class=\"wl wl-kjv\" data-code=\"H7812\">worshipped</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> bowing himself to the earth.","53":"And the <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> brought <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> <span class=\"wl wl-kjv\" data-code=\"H3627\">jewels</span> of <span class=\"wl wl-kjv\" data-code=\"H3701\">silver,</span> and <span class=\"wl wl-kjv\" data-code=\"H3627\">jewels</span> of <span class=\"wl wl-kjv\" data-code=\"H2091\">gold,</span> and <span class=\"wl wl-kjv\" data-code=\"H899\">raiment,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> them to <span class=\"wl wl-kjv\" data-code=\"H7259\">Rebekah:</span> he <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> also to her <span class=\"wl wl-kjv\" data-code=\"H251\">brother</span> and to her <span class=\"wl wl-kjv\" data-code=\"H517\">mother</span> precious things.","54":"And they did <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> and <span class=\"wl wl-kjv\" data-code=\"H8354\">drink,</span> he and the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> that were with him, and tarried all <span class=\"wl wl-kjv\" data-code=\"H3885\">night;</span> and they rose <span class=\"wl wl-kjv\" data-code=\"H6965\">up</span> in the <span class=\"wl wl-kjv\" data-code=\"H1242\">morning,</span> and he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Send me <span class=\"wl wl-kjv\" data-code=\"H7971\">away</span> unto my master.","55":"And her <span class=\"wl wl-kjv\" data-code=\"H251\">brother</span> and her <span class=\"wl wl-kjv\" data-code=\"H517\">mother</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Let the <span class=\"wl wl-kjv\" data-code=\"H5291\">damsel</span> <span class=\"wl wl-kjv\" data-code=\"H3427\">abide</span> with us a few <span class=\"wl wl-kjv\" data-code=\"H3117\">days,</span> at the <span class=\"wl wl-kjv\" data-code=\"H176\">least</span> <span class=\"wl wl-kjv\" data-code=\"H6218\">ten;</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> that she shall go.","56":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto them, Hinder <span class=\"wl wl-kjv\" data-code=\"H309\">me</span> not, seeing the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H6743\">prospered</span> my <span class=\"wl wl-kjv\" data-code=\"H1870\">way;</span> send me <span class=\"wl wl-kjv\" data-code=\"H7971\">away</span> that I may <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> to my master.","57":"And they <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> We will <span class=\"wl wl-kjv\" data-code=\"H7121\">call</span> the <span class=\"wl wl-kjv\" data-code=\"H5291\">damsel,</span> and <span class=\"wl wl-kjv\" data-code=\"H7592\">enquire</span> at her mouth.","58":"And they <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> <span class=\"wl wl-kjv\" data-code=\"H7259\">Rebekah,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto her, Wilt thou <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> with this <span class=\"wl wl-kjv\" data-code=\"H376\">man?</span> And she <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> I will go.","59":"And they sent <span class=\"wl wl-kjv\" data-code=\"H7971\">away</span> <span class=\"wl wl-kjv\" data-code=\"H7259\">Rebekah</span> their <span class=\"wl wl-kjv\" data-code=\"H269\">sister,</span> and her <span class=\"wl wl-kjv\" data-code=\"H3243\">nurse,</span> and <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham's</span> <span class=\"wl wl-kjv\" data-code=\"H5650\">servant,</span> and his men.","60":"And they <span class=\"wl wl-kjv\" data-code=\"H1288\">blessed</span> <span class=\"wl wl-kjv\" data-code=\"H7259\">Rebekah,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto her, <span class=\"wl wl-kjv\" data-code=\"H859\">Thou</span> art our <span class=\"wl wl-kjv\" data-code=\"H269\">sister,</span> be <span class=\"wl wl-kjv\" data-code=\"H1961\">thou</span> the mother of <span class=\"wl wl-kjv\" data-code=\"H505\">thousands</span> of <span class=\"wl wl-kjv\" data-code=\"H7233\">millions,</span> and let thy <span class=\"wl wl-kjv\" data-code=\"H2233\">seed</span> <span class=\"wl wl-kjv\" data-code=\"H3423\">possess</span> the <span class=\"wl wl-kjv\" data-code=\"H8179\">gate</span> of those which hate","61":"And <span class=\"wl wl-kjv\" data-code=\"H7259\">Rebekah</span> <span class=\"wl wl-kjv\" data-code=\"H6965\">arose,</span> and her <span class=\"wl wl-kjv\" data-code=\"H5291\">damsels,</span> and they <span class=\"wl wl-kjv\" data-code=\"H7392\">rode</span> upon the <span class=\"wl wl-kjv\" data-code=\"H1581\">camels,</span> and <span class=\"wl wl-kjv\" data-code=\"H3212\">followed</span> the <span class=\"wl wl-kjv\" data-code=\"H376\">man:</span> and the <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> <span class=\"wl wl-kjv\" data-code=\"H7259\">Rebekah,</span> and went his way.","62":"And <span class=\"wl wl-kjv\" data-code=\"H3327\">Isaac</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> from the <span class=\"wl wl-kjv\" data-code=\"H935\">way</span> of the well <span class=\"wl wl-kjv\" data-code=\"H883\">Lahairoi;</span> for he <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelt</span> in the <span class=\"wl wl-kjv\" data-code=\"H5045\">south</span> country.","63":"And <span class=\"wl wl-kjv\" data-code=\"H3327\">Isaac</span> went <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> to <span class=\"wl wl-kjv\" data-code=\"H7742\">meditate</span> in the <span class=\"wl wl-kjv\" data-code=\"H7704\">field</span> <span class=\"wl wl-kjv\" data-code=\"H6437\">at</span> the <span class=\"wl wl-kjv\" data-code=\"H6153\">eventide:</span> and he lifted <span class=\"wl wl-kjv\" data-code=\"H5375\">up</span> his <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes,</span> and <span class=\"wl wl-kjv\" data-code=\"H7200\">saw,</span> and, behold, the <span class=\"wl wl-kjv\" data-code=\"H1581\">camels</span> were coming.","64":"And <span class=\"wl wl-kjv\" data-code=\"H7259\">Rebekah</span> lifted <span class=\"wl wl-kjv\" data-code=\"H5375\">up</span> her <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes,</span> and when she <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> <span class=\"wl wl-kjv\" data-code=\"H3327\">Isaac,</span> she <span class=\"wl wl-kjv\" data-code=\"H5307\">lighted</span> <span class=\"wl wl-kjv\" data-code=\"H5921\">off</span> the camel.","65":"For she had <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto the <span class=\"wl wl-kjv\" data-code=\"H5650\">servant,</span> <span class=\"wl wl-kjv\" data-code=\"H4310\">What</span> <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> is <span class=\"wl wl-kjv\" data-code=\"H1976\">this</span> that <span class=\"wl wl-kjv\" data-code=\"H1980\">walketh</span> in the <span class=\"wl wl-kjv\" data-code=\"H7704\">field</span> to meet <span class=\"wl wl-kjv\" data-code=\"H7125\">us?</span> And the <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> had <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> It is my <span class=\"wl wl-kjv\" data-code=\"H113\">master:</span> therefore she <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> a <span class=\"wl wl-kjv\" data-code=\"H6809\">vail,</span> and covered herself.","66":"And the <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> <span class=\"wl wl-kjv\" data-code=\"H5608\">told</span> <span class=\"wl wl-kjv\" data-code=\"H3327\">Isaac</span> all <span class=\"wl wl-kjv\" data-code=\"H1697\">things</span> that he had done.","67":"And <span class=\"wl wl-kjv\" data-code=\"H3327\">Isaac</span> brought <span class=\"wl wl-kjv\" data-code=\"H935\">her</span> into his <span class=\"wl wl-kjv\" data-code=\"H517\">mother</span> <span class=\"wl wl-kjv\" data-code=\"H8283\">Sarah's</span> <span class=\"wl wl-kjv\" data-code=\"H168\">tent,</span> and <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> <span class=\"wl wl-kjv\" data-code=\"H7259\">Rebekah,</span> and she became his <span class=\"wl wl-kjv\" data-code=\"H802\">wife;</span> and he <span class=\"wl wl-kjv\" data-code=\"H157\">loved</span> her: and <span class=\"wl wl-kjv\" data-code=\"H3327\">Isaac</span> was <span class=\"wl wl-kjv\" data-code=\"H5162\">comforted</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> his mother's"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"oud","tekst":"Zie boven Gen 18:11. Abraham was in dezen tijd omtrent 140 jaren oud; want hij was honderd jaren oud toen Izak geboren werd, boven, Gen 21:5; en Izak was 40 jaren oud, toen hij Rebekka trouwde; onder Gen 25:20."},{"catchword":"wel","tekst":"Hebr. gaande in dagen; Zie deze manier van spreken boven, Gen 18:11."},{"catchword":"gezegend","tekst":"Zie bov. Gen 12:2."}],"2":[{"catchword":"den","tekst":"Hebr. den ouden. Versta den verzorger en opperknecht zijns huisgezins, genoemd Eliëzer van Damaskus. Zie boven, Gen 15:2."},{"catchword":"Leg","tekst":"Een manier van doen, gebruikelijk in het eedzweren, dat de huisheer van zijn huisvolk vorderde, tot een teken van onderwerping en trouw. Zie ook onder Gen 47:29. Anders heeft men ook in het zweren de handen opgeheven; boven, Gen 14:22; Rev 10:5."}],"3":[{"catchword":"der Kanaänieten,","tekst":"Hebr. des Kanaänieters. Zie van dezen boven Gen 10:15-16, enz.; van dezen wilde Abraham voor zijn zoon een vrouw hebben, omdat zij gans afgodisch, grote zondaren en buiten het verbond Gods waren. Verg. onder Gen 28:1-2; Exo 34:16; Deu 7:3; Jos 23:12; Ezr 9:1-3; Neh 13:23, Neh 13:25, enz.; 2Co 6:14-15. Van dit recht der ouders in de huwelijken der kinderen in het algemeen, zie boven Gen 6:2 en Gen 21:21."}],"4":[{"catchword":"mijn land","tekst":"Abrahams vaderland was Ur der Chaldeën, zijnde een gedeelte des gehelen lands, gelegen tussen de rivieren Eufraat en Tigris, waarin Mesopotamië, alwaar Nahor woonde, mede begrepen was."},{"catchword":"mijn maagschap","tekst":"Van wie hij tijding ontvangen had, boven Gen 22:20. Deze waren wel door de bijwoning der afgodische ingezetenen ook met afgoderij besmet, gelijk blijkt ond. Gen 31:19, Gen 31:30, Gen 31:32, Gen 31:35, en Jos 24:2, maar niet zo gruwelijk vervallen in afgoderij en andere grove zonden, gelijk de verworpen Kanaänieten. Zie Deu 12:30-31."}],"5":[{"catchword":"En die","tekst":"Hier en in het vervolg blijkt de zonderlinge voorzichtigheid en godvruchtigheid van dezen dienstknecht, die vóór het zweren de mening van zijn heer volkomenlijk begeert te verstaan."},{"catchword":"vrouw","tekst":"Versta een jonge dochter, die Izaks vrouw zou worden."},{"catchword":"volgen","tekst":"Hebr. Achter mij gaan. Alzo ond. vs.8."},{"catchword":"moeten","tekst":"Hebr. wederbrengende wederbrengen. Dit wordt gezegd niet ten aanzien van Izak, die daar nimmer geweest was, maar ten aanzien van Abraham, in wiens lenden Izak in dien tijd besloten was."}],"6":[{"catchword":"Wacht u,","tekst":"Eensdeels, omdat God hem en zijn toekomstig zaad in dit land Kanaän, met belofte van dat te erven, uit Chaldeën geroepen had; anderdeels om het perijkel van afgoderij, waartoe Izak had mogen verleid worden. Hebr. wordt bewaard, of behoed voor u,"}],"8":[{"catchword":"rein zijn","tekst":"Dat is, ontslagen en vrij of onschuldig zijn van den eed, dien ik u opleg."}],"10":[{"catchword":"al het","tekst":"Dat is, allerlei nodig en kostbaar goed nam hij met goedvinden van zijn heer mede, zo tot de reis, als tot verering, daar het in deze zaak dienstig zou wezen. Zie vs.54."},{"catchword":"Mesopotámië,","tekst":"Hebr. Syrië der twee rivieren; zo genoemd, omdat het gelegen was tussen twee rivieren, Tigris aan het oosten, en Eufraat aan het westen. Zie dezen naam ook Deu 23:4; Jdg 3:8."},{"catchword":"stad van","tekst":"Dat is, waar Nahor woonde; zie boven Gen 23:10. Versta de stad Haran, gelijk afgenomen wordt uit Gen 28:10, en Gen 29:4."}],"11":[{"catchword":"deed de","tekst":"Om te rusten, of te pleisteren, zoals de gewoonte is van beesten wanneer zij vermoeid zijn."}],"12":[{"catchword":"doe haar","tekst":"Te weten, de jonge dochter, of ook, mijn begeerte"},{"catchword":"mij toch","tekst":"Hebr. voor mijn aangezicht."}],"14":[{"catchword":"Zo","tekst":"Dit teken begeert hij niet uit mistrouwen of vermetelheid, maar uit een bijzonder vertrouwen, dat God in hem wrocht, die door zijn beleid dit alles zo geschikt had, gelijk de uitkomst zulks heeft bewezen, zoals in het volgende blijkt; zie dergelijke exempelen Jdg 6:17, 1Sa 14:9-10."},{"catchword":"toegewezen","tekst":"Anders, toegeschikt, of voorbereid."}],"16":[{"catchword":"schoon","tekst":"Hebr. goed; zie boven, Gen 6:2."},{"catchword":"geen man","tekst":"Zie deze manier van spreken boven, Gen 19:8."}],"21":[{"catchword":"ontzette","tekst":"Te weten, door grote blijdschap en verwondering, ziende dat het teken, hetwelk hij van de Heere verzocht had, zo haastelijk hem voor ogen kwam."},{"catchword":"stilzwijgende,","tekst":"Bedenkende bij zichzelven hoe wonderlijk de genadige voorzienigheid Gods zich hier vertoonde, en willende voortaan wel waarnemen of het volgende met dit begin geheel overeenkomen zou."}],"22":[{"catchword":"voorhoofdsiersel","tekst":"Het Hebr. woord betekent hier voorhoofdsiersel, gelijk blijkt onder vs.47, Isa 3:21; Eze 16:12. Somtijds betekent het ook een oorring of oorsiersel, onder, Gen 35:4, en Exo 32:2-3."},{"catchword":"een halve","tekst":"Het Hebr. woord wordt verklaard een halven sikkel; Exo 38:26."},{"catchword":"sikkel, en","tekst":"Omtrent den zilveren sikkel, zie boven, Gen 20:16. De goudenen de zilveren sikkels hadden beiden een gewicht, de algemene wegende 160 gastkorrels, of een half lood; de heilige nog eens zoveel, namelijk 320 korrels, of een geheel lood. Een lood goud was tienmaal zoveel als een lood zilvers. Een lood zilvers deed een halven rijksdaalder, en bijgevolg een lood gouds vijf rijkdaalders, of twaalf en een halven gulden."},{"catchword":"armringen","tekst":"Die men nu gewoonlijk noemt braceletten."},{"catchword":"aan haar","tekst":"Versta hierbij, hij gaf die, of legde die aan haar handen, gelijk het woord nemen, in dit vs. gesteld, dikwijls gebruikt wordt, hebbende niet alleen zijn eigen betekenis, maar ook een andere daaronder begrijpende; zie boven, Gen 12:15."}],"23":[{"catchword":"Want hij","tekst":"Verg. ond. vs.47."}],"24":[{"catchword":"den zoon","tekst":"Dit wordt hier bijgevoegd, opdat de knecht van Abraham zou weten en verstaan, dat zij echt en recht geboren was, uit de wettelijke en principale vrouw, en niet uit het bijwijf Reüna; zie bov., Gen 22:23-24."}],"26":[{"catchword":"neigde","tekst":"Het Hebr. woord betekent eigenlijk met het hoofd nederwaarts bukken."},{"catchword":"aanbad","tekst":"Het Hebr. woord betekent het nederbukken en krommen des gehelen lichaams; hetwelk hierin zich sluit een religieusen en godsdienstigen eerbied tot God; verenigd met aanbidding; zie ook boven Gen 22:5; idem, Psa 66:4; Neh 9:3, enz."}],"27":[{"catchword":"Geloofd","tekst":"Zie boven Gen 14:20."},{"catchword":"waarheid","tekst":"De getrouwheid in het houden zijner beloften. Alzo ond. Gen 32:10; Psa 143:1; Isa 38:18-19."},{"catchword":"van mijn","tekst":"Hebr. van met, of van bij mijnen heer; versta te bewijzen, of te oefenen."},{"catchword":"aangaande","tekst":"Hebr. ik, dat is, wat mij aangaat; alzo wordt het genomen boven Gen 9:9, en Gen 17:4; 1Ch 28:2; Psa 35:13, en Psa 41:13, en elders."},{"catchword":"broederen","tekst":"Dat is, magen, bloedvrienden. Zie boven, Gen 13:8, en onder vs.48; Mar 3:31-32."}],"31":[{"catchword":"gij gezegende","tekst":"Een voortreffelijke titel, dien de Israelieten aan Gods voortreffelijke vrienden plachten te geven, beduidende dat God hun welgedaan had, en nog met zijn genade en weldadigheid hun steeds nabij was; zie onder, Gen 26:29; Rth 3:10; Psa 115:15."},{"catchword":"bereid,","tekst":"Of, gezuiverd, gereinigd, uitgeruimd, en alles wat in den weg was, weggedaan. Alzo wordt het Hebreeuwse woord genomen Lev 14:36."}],"32":[{"catchword":"om zijn","tekst":"Zie boven, Gen 18:4, en de aanteek."}],"33":[{"catchword":"werd hem","tekst":"Hebr. voor zijn aangezicht werd gezet om te eten."},{"catchword":"hij zeide","tekst":"Te weten Laban."}],"34":[{"catchword":"knecht;","tekst":"Zie boven, vs.2."}],"35":[{"catchword":"groot","tekst":"Dat is, rijk en machtig; alzo onder Gen 26:13; 2Ki 4:8."}],"36":[{"catchword":"nadat zij","tekst":"Hebr. na haar ouderdom; dat is, door een bovennatuurlijke werking des Heeren, waaruit een ongewone zegening, volgens zijn beloftenis, te verwachten is."},{"catchword":"hij heeft","tekst":"Dat is, hij heeft hem erfgenaam van alles gemaakt."}],"37":[{"catchword":"Gij zult","tekst":"Zie boven, vs.3."}],"38":[{"catchword":"Maar gij","tekst":"Anders, zult gij niet trekken? of , zo gij niet trekt, enz; waarop dan verstaan moet worden: wee u of, zo doe u God dit of dat. Zie bov. Gen 14:22-23, en Gen 21:23."}],"40":[{"catchword":"ik gewandeld","tekst":"Zie boven Gen 17:1."}],"41":[{"catchword":"eed rein","tekst":"Anders, vloek, of eed van den vloek; dat is, van de straf die ieder, valselijk zwerende, op zich haald."}],"47":[{"catchword":"op haar","tekst":"Of, op haar neus, zodat het van het voorhoofd nederwaarts hing op den neus."}],"48":[{"catchword":"op den","tekst":"Hebr. den weg der waarheid; dat is, den waren of den rechten weg."},{"catchword":"broeder","tekst":"Dat is, bloedverwant, want Bethuël was de zoon van Nahor, Abrahams broeders. Zie bov. vs.27."}],"49":[{"catchword":"trouw","tekst":"Hebr. waarheid."},{"catchword":"doen zult,","tekst":"Hebr. zo gij zijt doende."},{"catchword":"opdat ik","tekst":"Dat is, opdat ik mij elders op den enen of op den anderen weg begeven mag, om mijns heren last uit te voeren."},{"catchword":"wende","tekst":"Of, omzie ter rechter-, of ter linkerhand."}],"50":[{"catchword":"Laban","tekst":"De zoon wordt hier vóór den vader gesteld, omdat hij, zoals men houdt, van den vader last had het woord te voeren, en het huisbestuur meest bij hem stond, zijnde zijn vader niet alleen dedaasd, maar ook misschien ziekelijk."},{"catchword":"Van den","tekst":"Hier blijkt dat bij deze lieden nog enige kennis en vreze van den waren God geweest is; zie hier en vs.51."},{"catchword":"kwaad","tekst":"Dat is, wij kunnen er niets in tegenspreken; verg. onder, Gen 31:24-25, Gen 31:29; en 2Sa 13:22."}],"51":[{"catchword":"neem haar","tekst":"Zie boven, vs.3."}],"53":[{"catchword":"kleinodiën,","tekst":"Hebr. vaten van zilver, en vaten van goud, dat is, zilverwerk en goudwerk."},{"catchword":"kostelijkheden","tekst":"Het Hebr. woord beduidt alles wat uitgelezen en kostelijk is, en in het bijzonder uitgelezen en kostelijke vruchten des lands. Zie Deu 33:13-15; en 2Ch 21:3, en 2Ch 32:23; Ezr 1:6."}],"55":[{"catchword":"enige","tekst":"Zie boven, Gen 4:3. Sommigen verstaan door dagen of tien, een vol jaar [hetwelk een jaar der dagen genoemd wordt] of tien maanden. Het woord of wordt ook wel eens verstaan als: immers."},{"catchword":"zult gij","tekst":"Anders, zal zij."}],"57":[{"catchword":"Laat ons","tekst":"Dat is, laat ons horen wat zij van dit haastig vertrek zal zeggen; want zij heeft toegestaan het huwelijk, om den wil van haar ouders en vrienden, en tot een teken daarvan de geschenken ontvangen."}],"59":[{"catchword":"hun","tekst":"Versta, hun bloedverwante; want niet alleen Laban haar broeder, maar ook de andere bloedvrienden hebben afscheid van haar genomen, en alzo in het volgende vs."},{"catchword":"haar voedster","tekst":"Genaamd Debora: onder, Gen 35:8."}],"60":[{"catchword":"zij zegenden","tekst":"Zie bov. Gen 14:19."},{"catchword":"word","tekst":"Zij wensen haar dat zij mag worden een moeder van ontelbare mensen; verg. Dan 7:10."},{"catchword":"millioenen,","tekst":"Dat is tienduizenden."},{"catchword":"uw zaad","tekst":"Zie bov., Gen 22:17."}],"61":[{"catchword":"jonge","tekst":"Die de vrienden haar tot gezelschap en dienst medegaven."},{"catchword":"die knecht","tekst":"Te weten, Abrahams knecht."}],"62":[{"catchword":"den put","tekst":"Zie omtrent dezen put boven, Gen 16:14, en Gen 25:11."},{"catchword":"in het","tekst":"In het zuiden van het land Kanaän, omtrent Berseba en Gerar."}],"63":[{"catchword":"te bidden","tekst":"Of, om te denken, om te peinzen, dat is, om zijn zinnen met godzalige gedachten en aanbiddingen voor den Heere te oefenen."},{"catchword":"tegen","tekst":"Hebr. tegen, of met het aanzien van den avond, Alzo ook Exo 14:27, tegen, of met het aanzien van den morgenstond, dat is, tegen het naken, enz."}],"64":[{"catchword":"zij viel","tekst":"Dat is, zij is haastig afgeklommen, uit ontsteltenis en bedenking of die persoon Izak mocht zijn; tegelijk den knecht daarnaar vragende. Anderen menen dat zij niet afgeklommen is, voordat zij van den knecht verstaan had, dat het Izak was; en in dien zin wordt het volgende vers door sommigen overgezet; want zij had gezegd tot den knecht, enz."}],"65":[{"catchword":"bedekte","tekst":"Tot een teken van schaamte en onderwerping."}],"67":[{"catchword":"in de","tekst":"Zie bov. Gen 18:10, en Gen 23:2."},{"catchword":"na zijner","tekst":"Die nu drie jaren dood was. De langdurigheid van dezen rouw was een teken van zijn liefde jegens zijn moeder."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Now Abraham was old [see above chapter 18.11 Abraham was by this time a hundred and forty years old for he was an hundred when Isaac was born above cahpetr 21.1 and Isaac was forty when he married Rebecca below chapter 35. Verse 20] and he well bedayed [Heb. Going in days see of this phrase above chapter 18.11] and the Lord had blessed Abraham in all things [see above chapter 12.2.]"}],"2":[{"catchword":null,"tekst":"Then Abraham spake and his servant the eldest of his house [Heb. The old on understood the Steward or Bailiff and upper-servant of his family by the name Eliezer of Damascus see above chapter 15.2] ruling over all that he had lay the hand I pray under the thigh [a kind of practice used by masters of families in taking an oath from any of their household in token of their subjection and faithfulness see likewise below chapter47.29 otherwise it was also the custom in swearing to lift up the hands see above chapter 14.2 and Rev 10:5.]"}],"3":[{"catchword":null,"tekst":"That I may swear thee by the Lord the God of heaven and the God of earth that thou shalt take no wife for my son of the daughters of Canaanites [Heb. Of the Canaanites of whom see above chapter 10.15, 16&c.Abraham would have none of those to be matched with his son because they were wholly given up to idolatry an doll manner of wickedness and without the covenant of God compare below chapter 28.1,2 Exo 34:16 Deu 7:3 Jos 23:12 Ezra 9.1,2,3 Nehemiah 13.23,25 &c. 2Co 6:14,15 of this right of the parents in general in marrying their children see above chapter 6 on verse and chapter 21.21] in the midst of whom I dwell."}],"4":[{"catchword":null,"tekst":"But that thou shalt go to my country [which was Uz of Chaldea being the whole par of the whole land that lay between the river Euphrates and Tigris wherein Mesopotamia also in which Nahor lived was comprehended ] and to my kindred [of whom he had lately received news above chapter 22 verse 20 those where indeed likewise somewhat tainted with the idolatry of people among whom they lived as appears below chapter 31.19,30,32,35 and Jos 24:2 but yet not so abominably and grosley given up to the same and other grossly given up to the same and other gross sins as reprobate Canaanites were see Deu 12:30,31] and take a wife for my son Isaac."}],"5":[{"catchword":null,"tekst":"and that servant said unto him peradventure [by this and the sequel and the singular prudence and piety of this servant appeareth who before it takes the oath will be first be fully satisfied of his masters intent and purpose ] that woman shall not be willing to follow me [Heb. Go after me so below verse 8] into this land must I then bring thy son into the land out of which thou art gone? [Heb. Shall I bringing back bring back &c. this is said not in regard of Isaac who never was there but of Abraham in whose loins Isaac had been shut up.]"}],"6":[{"catchword":null,"tekst":"Abraham said to him take heed to thy self that thou do not bring my son back thither [partly because God called him and his seed to come out of Chaldea into Canaan with promise that they should inherit the same and partly to avoid the danger of idolatry into which Isaac might have been seduced [Heb. Be regarded or kept or beware thee /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:"Lora";font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
