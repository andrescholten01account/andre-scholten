\"wl wl-kjv\" data-code=\"H776\">land:</span> must I needs <span class=\"wl wl-kjv\" data-code=\"H7725\">bring</span> thy <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">again</span> unto the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> from whence thou camest?", "6": "And <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, <span class=\"wl wl-kjv\" data-code=\"H8104\">Beware</span> thou that thou <span class=\"wl wl-kjv\" data-code=\"H7725\">bring</span> <span class=\"wl wl-kjv\" data-code=\"H6435\">not</span> my <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> thither again.", "7": "The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven,</span> which took <span class=\"wl wl-kjv\" data-code=\"H3947\">me</span> from my <span class=\"wl wl-kjv\" data-code=\"H1\">father's</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> and from the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of my <span class=\"wl wl-kjv\" data-code=\"H4138\">kindred,</span> and which <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> unto me, and that <span class=\"wl wl-kjv\" data-code=\"H7650\">sware</span> unto me, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Unto thy <span class=\"wl wl-kjv\" data-code=\"H2233\">seed</span> will I <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> this <span class=\"wl wl-kjv\" data-code=\"H776\">land;</span> he shall <span class=\"wl wl-kjv\" data-code=\"H7971\">send</span> his <span class=\"wl wl-kjv\" data-code=\"H4397\">angel</span> before <span class=\"wl wl-kjv\" data-code=\"H6440\">thee,</span> and thou shalt <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> a <span class=\"wl wl-kjv\" data-code=\"H802\">wife</span> unto my son", "8": "And if the <span class=\"wl wl-kjv\" data-code=\"H802\">woman</span> will not be <span class=\"wl wl-kjv\" data-code=\"H14\">willing</span> to <span class=\"wl wl-kjv\" data-code=\"H3212\">follow</span> <span class=\"wl wl-kjv\" data-code=\"H310\">thee,</span> then thou shalt be <span class=\"wl wl-kjv\" data-code=\"H5352\">clear</span> from this my <span class=\"wl wl-kjv\" data-code=\"H7621\">oath:</span> only <span class=\"wl wl-kjv\" data-code=\"H7725\">bring</span> not my <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> thither again.", "9": "And the <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> <span class=\"wl wl-kjv\" data-code=\"H7760\">put</span> his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> under the <span class=\"wl wl-kjv\" data-code=\"H3409\">thigh</span> of <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham</span> his <span class=\"wl wl-kjv\" data-code=\"H113\">master,</span> and <span class=\"wl wl-kjv\" data-code=\"H7650\">sware</span> to him <span class=\"wl wl-kjv\" data-code=\"H5921\">concerning</span> <span class=\"wl wl-kjv\" data-code=\"H2088\">that</span> matter.", "10": "And the <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> <span class=\"wl wl-kjv\" data-code=\"H6235\">ten</span> <span class=\"wl wl-kjv\" data-code=\"H1581\">camels</span> of the <span class=\"wl wl-kjv\" data-code=\"H1581\">camels</span> of his <span class=\"wl wl-kjv\" data-code=\"H113\">master,</span> and <span class=\"wl wl-kjv\" data-code=\"H3212\">departed;</span> for all the <span class=\"wl wl-kjv\" data-code=\"H2898\">goods</span> of his <span class=\"wl wl-kjv\" data-code=\"H113\">master</span> were in his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand:</span> and he <span class=\"wl wl-kjv\" data-code=\"H6965\">arose,</span> and <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> to <span class=\"wl wl-kjv\" data-code=\"H763\">Mesopotamia,</span> unto the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> of Nahor.", "11": "And he <span class=\"wl wl-kjv\" data-code=\"H1288\">made</span> his <span class=\"wl wl-kjv\" data-code=\"H1581\">camels</span> to kneel <span class=\"wl wl-kjv\" data-code=\"H1288\">down</span> <span class=\"wl wl-kjv\" data-code=\"H2351\">without</span> the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> <span class=\"wl wl-kjv\" data-code=\"H413\">by</span> a <span class=\"wl wl-kjv\" data-code=\"H875\">well</span> of <span class=\"wl wl-kjv\" data-code=\"H4325\">water</span> at the <span class=\"wl wl-kjv\" data-code=\"H6256\">time</span> of the <span class=\"wl wl-kjv\" data-code=\"H6153\">evening,</span> even the <span class=\"wl wl-kjv\" data-code=\"H6256\">time</span> that women go <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> to draw", "12": "And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> O <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of my <span class=\"wl wl-kjv\" data-code=\"H113\">master</span> <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham,</span> I pray thee, send <span class=\"wl wl-kjv\" data-code=\"H6440\">me</span> good <span class=\"wl wl-kjv\" data-code=\"H7136\">speed</span> this <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> and <span class=\"wl wl-kjv\" data-code=\"H6213\">shew</span> <span class=\"wl wl-kjv\" data-code=\"H2617\">kindness</span> <span class=\"wl wl-kjv\" data-code=\"H5973\">unto</span> my <span class=\"wl wl-kjv\" data-code=\"H113\">master</span> Abraham.", "13": "Behold, I <span class=\"wl wl-kjv\" data-code=\"H5324\">stand</span> here by the <span class=\"wl wl-kjv\" data-code=\"H5869\">well</span> of <span class=\"wl wl-kjv\" data-code=\"H4325\">water;</span> and the <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters</span> of the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> of the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> come <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> to <span class=\"wl wl-kjv\" data-code=\"H7579\">draw</span> water:", "14": "And let it come to pass, that the <span class=\"wl wl-kjv\" data-code=\"H5291\">damsel</span> to whom I shall <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> Let <span class=\"wl wl-kjv\" data-code=\"H5186\">down</span> thy <span class=\"wl wl-kjv\" data-code=\"H3537\">pitcher,</span> I pray thee, that I may <span class=\"wl wl-kjv\" data-code=\"H8354\">drink;</span> and she shall <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> <span class=\"wl wl-kjv\" data-code=\"H8354\">Drink,</span> and I will <span class=\"wl wl-kjv\" data-code=\"H8248\">give</span> thy <span class=\"wl wl-kjv\" data-code=\"H1581\">camels</span> <span class=\"wl wl-kjv\" data-code=\"H8248\">drink</span> also: let the same be she that thou hast <span class=\"wl wl-kjv\" data-code=\"H3198\">appointed</span> for thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> <span class=\"wl wl-kjv\" data-code=\"H3327\">Isaac;</span> and thereby shall I <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> that thou hast <span class=\"wl wl-kjv\" data-code=\"H6213\">shewed</span> <span class=\"wl wl-kjv\" data-code=\"H2617\">kindness</span> unto my master.", "15": "And it came to pass, before he had <span class=\"wl wl-kjv\" data-code=\"H3615\">done</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">speaking,</span> that, behold, <span class=\"wl wl-kjv\" data-code=\"H7259\">Rebekah</span> came <span class=\"wl wl-kjv\" data-code=\"H3318\">out,</span> <span class=\"wl wl-kjv\" data-code=\"H834\">who</span> was <span class=\"wl wl-kjv\" data-code=\"H3205\">born</span> to <span class=\"wl wl-kjv\" data-code=\"H1328\">Bethuel,</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H4435\">Milcah,</span> the <span class=\"wl wl-kjv\" data-code=\"H802\">wife</span> of <span class=\"wl wl-kjv\" data-code=\"H5152\">Nahor,</span> <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham's</span> <span class=\"wl wl-kjv\" data-code=\"H251\">brother,</span> with her <span class=\"wl wl-kjv\" data-code=\"H3537\">pitcher</span> upon her shoulder.", "16": "And the <span class=\"wl wl-kjv\" data-code=\"H5291\">damsel</span> was <span class=\"wl wl-kjv\" data-code=\"H3966\">very</span> <span class=\"wl wl-kjv\" data-code=\"H2896\">fair</span> to look <span class=\"wl wl-kjv\" data-code=\"H4758\">upon,</span> a <span class=\"wl wl-kjv\" data-code=\"H1330\">virgin,</span> neither had any <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> <span class=\"wl wl-kjv\" data-code=\"H3045\">known</span> her: and she went <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> to the <span class=\"wl wl-kjv\" data-code=\"H5869\">well,</span> and <span class=\"wl wl-kjv\" data-code=\"H4390\">filled</span> her <span class=\"wl wl-kjv\" data-code=\"H3537\">pitcher,</span> and came up.", "17": "And the <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> <span class=\"wl wl-kjv\" data-code=\"H7323\">ran</span> to meet <span class=\"wl wl-kjv\" data-code=\"H7125\">her,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Let me, I pray thee, <span class=\"wl wl-kjv\" data-code=\"H1572\">drink</span> a <span class=\"wl wl-kjv\" data-code=\"H4592\">little</span> <span class=\"wl wl-kjv\" data-code=\"H4325\">water</span> of thy pitcher.", "18": "And she <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H8354\">Drink,</span> my <span class=\"wl wl-kjv\" data-code=\"H113\">lord:</span> and she <span class=\"wl wl-kjv\" data-code=\"H4116\">hasted,</span> and let <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> her <span class=\"wl wl-kjv\" data-code=\"H3537\">pitcher</span> upon her <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> and gave him drink.", "19": "And when she had <span class=\"wl wl-kjv\" data-code=\"H3615\">done</span> giving him <span class=\"wl wl-kjv\" data-code=\"H8248\">drink,</span> she <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> I will <span class=\"wl wl-kjv\" data-code=\"H7579\">draw</span> water for thy <span class=\"wl wl-kjv\" data-code=\"H1581\">camels</span> also, until they have <span class=\"wl wl-kjv\" data-code=\"H3615\">done</span> drinking.", "20": "And she <span class=\"wl wl-kjv\" data-code=\"H4116\">hasted,</span> and <span class=\"wl wl-kjv\" data-code=\"H6168\">emptied</span> her <span class=\"wl wl-kjv\" data-code=\"H3537\">pitcher</span> into the <span class=\"wl wl-kjv\" data-code=\"H8268\">trough,</span> and <span class=\"wl wl-kjv\" data-code=\"H7323\">ran</span> again unto the <span class=\"wl wl-kjv\" data-code=\"H875\">well</span> to <span class=\"wl wl-kjv\" data-code=\"H7579\">draw</span> water, and <span class=\"wl wl-kjv\" data-code=\"H7579\">drew</span> for all his camels.", "21": "And the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> <span class=\"wl wl-kjv\" data-code=\"H7583\">wondering</span> at her held his <span class=\"wl wl-kjv\" data-code=\"H2790\">peace,</span> to <span class=\"wl wl-kjv\" data-code=\"H3045\">wit</span> whether the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> had <span class=\"wl wl-kjv\" data-code=\"H6743\">made</span> his <span class=\"wl wl-kjv\" data-code=\"H1870\">journey</span> <span class=\"wl wl-kjv\" data-code=\"H6743\">prosperous</span> or", "22": "And it came to pass, as the <span class=\"wl wl-kjv\" data-code=\"H1581\">camels</span> had <span class=\"wl wl-kjv\" data-code=\"H3615\">done</span> <span class=\"wl wl-kjv\" data-code=\"H8354\">drinking,</span> that the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> a <span class=\"wl wl-kjv\" data-code=\"H2091\">golden</span> <span class=\"wl wl-kjv\" data-code=\"H5141\">earring</span> of half a <span class=\"wl wl-kjv\" data-code=\"H1235\">shekel</span> <span class=\"wl wl-kjv\" data-code=\"H4948\">weight,</span> and <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H6781\">bracelets</span> for her <span class=\"wl wl-kjv\" data-code=\"H3027\">hands</span> of <span class=\"wl wl-kjv\" data-code=\"H6235\">ten</span> shekels <span class=\"wl wl-kjv\" data-code=\"H4948\">weight</span> of gold;", "23": "And <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H4310\">Whose</span> <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> art <span class=\"wl wl-kjv\" data-code=\"H859\">thou?</span> <span class=\"wl wl-kjv\" data-code=\"H5046\">tell</span> me, I pray thee: is <span class=\"wl wl-kjv\" data-code=\"H3426\">there</span> <span class=\"wl wl-kjv\" data-code=\"H4725\">room</span> in thy <span class=\"wl wl-kjv\" data-code=\"H1\">father's</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> for us to lodge in?", "24": "And she <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, I am the <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> of <span class=\"wl wl-kjv\" data-code=\"H1328\">Bethuel</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H4435\">Milcah,</span> which she <span class=\"wl wl-kjv\" data-code=\"H3205\">bare</span> unto Nahor.", "25": "She <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> moreover unto him, We have <span class=\"wl wl-kjv\" data-code=\"H1571\">both</span> <span class=\"wl wl-kjv\" data-code=\"H8401\">straw</span> and <span class=\"wl wl-kjv\" data-code=\"H4554\">provender</span> <span class=\"wl wl-kjv\" data-code=\"H7227\">enough,</span> <span class=\"wl wl-kjv\" data-code=\"H1571\">and</span> <span class=\"wl wl-kjv\" data-code=\"H4725\">room</span> to lodge in.", "26": "And the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> bowed down his <span class=\"wl wl-kjv\" data-code=\"H6915\">head,</span> and <span class=\"wl wl-kjv\" data-code=\"H7812\">worshipped</span> the LORD.", "27": "And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H1288\">Blessed</span> be the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of my <span class=\"wl wl-kjv\" data-code=\"H113\">master</span> <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham,</span> who hath not left <span class=\"wl wl-kjv\" data-code=\"H5800\">destitute</span> my <span class=\"wl wl-kjv\" data-code=\"H113\">master</span> of his <span class=\"wl wl-kjv\" data-code=\"H2617\">mercy</span> and his <span class=\"wl wl-kjv\" data-code=\"H571\">truth:</span> I being in the <span class=\"wl wl-kjv\" data-code=\"H1870\">way,</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> led <span class=\"wl wl-kjv\" data-code=\"H5148\">me</span> to the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of my <span class=\"wl wl-kjv\" data-code=\"H113\">master's</span> brethren.", "28": "And the <span class=\"wl wl-kjv\" data-code=\"H5291\">damsel</span> <span class=\"wl wl-kjv\" data-code=\"H7323\">ran,</span> and <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> them of her <span class=\"wl wl-kjv\" data-code=\"H517\">mother's</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> these things.", "29": "And <span class=\"wl wl-kjv\" data-code=\"H7259\">Rebekah</span> had a <span class=\"wl wl-kjv\" data-code=\"H251\">brother,</span> and his <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> was <span class=\"wl wl-kjv\" data-code=\"H3837\">Laban:</span> and <span class=\"wl wl-kjv\" data-code=\"H3837\">Laban</span> <span class=\"wl wl-kjv\" data-code=\"H7323\">ran</span> <span class=\"wl wl-kjv\" data-code=\"H2351\">out</span> unto the <span class=\"wl wl-kjv\" data-code=\"H376\">man,</span> unto the well.", "30": "And it came to pass, when he <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> the <span class=\"wl wl-kjv\" data-code=\"H5141\">earring</span> and <span class=\"wl wl-kjv\" data-code=\"H6781\">bracelets</span> upon his <span class=\"wl wl-kjv\" data-code=\"H269\">sister's</span> <span class=\"wl wl-kjv\" data-code=\"H3027\">hands,</span> and when he <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> the <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> of <span class=\"wl wl-kjv\" data-code=\"H7259\">Rebekah</span> his <span class=\"wl wl-kjv\" data-code=\"H269\">sister,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H3541\">Thus</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> unto me; that he <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> unto the <span class=\"wl wl-kjv\" data-code=\"H376\">man;</span> and, behold, he <span class=\"wl wl-kjv\" data-code=\"H5975\">stood</span> <span class=\"wl wl-kjv\" data-code=\"H5921\">by</span> the <span class=\"wl wl-kjv\" data-code=\"H1581\">camels</span> at the well.", "31": "And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Come <span class=\"wl wl-kjv\" data-code=\"H935\">in,</span> thou <span class=\"wl wl-kjv\" data-code=\"H1288\">blessed</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD;</span> wherefore <span class=\"wl wl-kjv\" data-code=\"H5975\">standest</span> thou <span class=\"wl wl-kjv\" data-code=\"H2351\">without?</span> for I have <span class=\"wl wl-kjv\" data-code=\"H6437\">prepared</span> the <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> and <span class=\"wl wl-kjv\" data-code=\"H4725\">room</span> for the camels.", "32": "And the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> into the <span class=\"wl wl-kjv\" data-code=\"H1004\">house:</span> and he <span class=\"wl wl-kjv\" data-code=\"H6605\">ungirded</span> his <span class=\"wl wl-kjv\" data-code=\"H1581\">camels,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> <span class=\"wl wl-kjv\" data-code=\"H8401\">straw</span> and <span class=\"wl wl-kjv\" data-code=\"H4554\">provender</span> for the <span class=\"wl wl-kjv\" data-code=\"H1581\">camels,</span> and <span class=\"wl wl-kjv\" data-code=\"H4325\">water</span> to <span class=\"wl wl-kjv\" data-code=\"H7364\">wash</span> his <span class=\"wl wl-kjv\" data-code=\"H7272\">feet,</span> and the <span class=\"wl wl-kjv\" data-code=\"H582\">men's</span> feet", "33": "And there was <span class=\"wl wl-kjv\" data-code=\"H7760\">set</span> meat before <span class=\"wl wl-kjv\" data-code=\"H6440\">him</span> to <span class=\"wl wl-kjv\" data-code=\"H398\">eat:</span> but he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> I will not <span class=\"wl wl-kjv\" data-code=\"H398\">eat,</span> until I have <span class=\"wl wl-kjv\" data-code=\"H1696\">told</span> mine <span class=\"wl wl-kjv\" data-code=\"H1697\">errand.</span> And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Speak on.", "34": "And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> I am <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham's</span> servant.", "35": "And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H1288\">blessed</span> my <span class=\"wl wl-kjv\" data-code=\"H113\">master</span> <span class=\"wl wl-kjv\" data-code=\"H3966\">greatly;</span> and he is become <span class=\"wl wl-kjv\" data-code=\"H1431\">great:</span> and he hath <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> him <span class=\"wl wl-kjv\" data-code=\"H6629\">flocks,</span> and <span class=\"wl wl-kjv\" data-code=\"H1241\">herds,</span> and <span class=\"wl wl-kjv\" data-code=\"H3701\">silver,</span> and <span class=\"wl wl-kjv\" data-code=\"H2091\">gold,</span> and <span class=\"wl wl-kjv\" data-code=\"H5650\">menservants,</span> and <span class=\"wl wl-kjv\" data-code=\"H8198\">maidservants,</span> and <span class=\"wl wl-kjv\" data-code=\"H1581\">camels,</span> and asses.", "36": "And <span class=\"wl wl-kjv\" data-code=\"H8283\">Sarah</span> my <span class=\"wl wl-kjv\" data-code=\"H113\">master's</span> <span class=\"wl wl-kjv\" data-code=\"H802\">wife</span> <span class=\"wl wl-kjv\" data-code=\"H3205\">bare</span> a <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> to my <span class=\"wl wl-kjv\" data-code=\"H113\">master</span> <span class=\"wl wl-kjv\" data-code=\"H310\">when</span> she was <span class=\"wl wl-kjv\" data-code=\"H2209\">old:</span> and unto him hath he given", "37": "And my <span class=\"wl wl-kjv\" data-code=\"H113\">master</span> made me <span class=\"wl wl-kjv\" data-code=\"H7650\">swear,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Thou shalt not <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> a <span class=\"wl wl-kjv\" data-code=\"H802\">wife</span> to my <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of the <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters</span> of the <span class=\"wl wl-kjv\" data-code=\"H3669\">Canaanites,</span> in whose <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> I dwell:", "38": "<span class=\"wl wl-kjv\" data-code=\"H518\">But</span> thou shalt <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> unto my <span class=\"wl wl-kjv\" data-code=\"H1\">father's</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> and to my <span class=\"wl wl-kjv\" data-code=\"H4940\">kindred,</span> and <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> a <span class=\"wl wl-kjv\" data-code=\"H802\">wife</span> unto my son.", "39": "And I <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto my <span class=\"wl wl-kjv\" data-code=\"H113\">master,</span> Peradventure the <span class=\"wl wl-kjv\" data-code=\"H802\">woman</span> will not <span class=\"wl wl-kjv\" data-code=\"H3212\">follow</span>", "40": "And he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto me, The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> whom I <span class=\"wl wl-kjv\" data-code=\"H1980\">walk,</span> will <span class=\"wl wl-kjv\" data-code=\"H7971\">send</span> his <span class=\"wl wl-kjv\" data-code=\"H4397\">angel</span> with thee, and <span class=\"wl wl-kjv\" data-code=\"H6743\">prosper</span> thy <span class=\"wl wl-kjv\" data-code=\"H1870\">way;</span> and thou shalt <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> a <span class=\"wl wl-kjv\" data-code=\"H802\">wife</span> for my <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of my <span class=\"wl wl-kjv\" data-code=\"H4940\">kindred,</span> and of my <span class=\"wl wl-kjv\" data-code=\"H1\">father's</span> house:", "41": "Then shalt thou be <span class=\"wl wl-kjv\" data-code=\"H5352\">clear</span> from this my <span class=\"wl wl-kjv\" data-code=\"H423\">oath,</span> when thou <span class=\"wl wl-kjv\" data-code=\"H935\">comest</span> to my <span class=\"wl wl-kjv\" data-code=\"H4940\">kindred;</span> and if they <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> not thee one, thou shalt be <span class=\"wl wl-kjv\" data-code=\"H5355\">clear</span> from my oath.", "42": "And I <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> this <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> unto the <span class=\"wl wl-kjv\" data-code=\"H5869\">well,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> O <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of my <span class=\"wl wl-kjv\" data-code=\"H113\">master</span> <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham,</span> if now thou <span class=\"wl wl-kjv\" data-code=\"H3426\">do</span> <span class=\"wl wl-kjv\" data-code=\"H6743\">prosper</span> my <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> which I go:", "43": "Behold, I <span class=\"wl wl-kjv\" data-code=\"H5324\">stand</span> by the <span class=\"wl wl-kjv\" data-code=\"H5869\">well</span> of <span class=\"wl wl-kjv\" data-code=\"H4325\">water;</span> and it shall come to pass, that when the <span class=\"wl wl-kjv\" data-code=\"H5959\">virgin</span> cometh <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> to <span class=\"wl wl-kjv\" data-code=\"H7579\">draw</span> water, and I <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> to her, Give <span class=\"wl wl-kjv\" data-code=\"H8248\">me,</span> I pray thee, a <span class=\"wl wl-kjv\" data-code=\"H4592\">little</span> <span class=\"wl wl-kjv\" data-code=\"H4325\">water</span> of thy <span class=\"wl wl-kjv\" data-code=\"H3537\">pitcher</span> to drink;", "44": "And she <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> to me, Both <span class=\"wl wl-kjv\" data-code=\"H8354\">drink</span> thou, and I will also <span class=\"wl wl-kjv\" data-code=\"H7579\">draw</span> for thy <span class=\"wl wl-kjv\" data-code=\"H1581\">camels:</span> let the same be the <span class=\"wl wl-kjv\" data-code=\"H802\">woman</span> whom the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath appointed <span class=\"wl wl-kjv\" data-code=\"H3198\">out</span> for my <span class=\"wl wl-kjv\" data-code=\"H113\">master's</span> son.", "45": "And before I had <span class=\"wl wl-kjv\" data-code=\"H3615\">done</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">speaking</span> in mine <span class=\"wl wl-kjv\" data-code=\"H3820\">heart,</span> behold, <span class=\"wl wl-kjv\" data-code=\"H7259\">Rebekah</span> came <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> with her <span class=\"wl wl-kjv\" data-code=\"H3537\">pitcher</span> on her <span class=\"wl wl-kjv\" data-code=\"H7926\">shoulder;</span> and she went <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> unto the <span class=\"wl wl-kjv\" data-code=\"H5869\">well,</span> and <span class=\"wl wl-kjv\" data-code=\"H7579\">drew</span> water: and I <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto her, Let me drink,", "46": "And she made <span class=\"wl wl-kjv\" data-code=\"H4116\">haste,</span> and let <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> her <span class=\"wl wl-kjv\" data-code=\"H3537\">pitcher</span> from her shoulder, and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H8354\">Drink,</span> and I will <span class=\"wl wl-kjv\" data-code=\"H8248\">give</span> thy <span class=\"wl wl-kjv\" data-code=\"H1581\">camels</span> <span class=\"wl wl-kjv\" data-code=\"H8248\">drink</span> also: so I <span class=\"wl wl-kjv\" data-code=\"H8354\">drank,</span> and she <span class=\"wl wl-kjv\" data-code=\"H8248\">made</span> the <span class=\"wl wl-kjv\" data-code=\"H1581\">camels</span> drink", "47": "And I <span class=\"wl wl-kjv\" data-code=\"H7592\">asked</span> her, and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Whose <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> art thou? And she <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> The <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> of <span class=\"wl wl-kjv\" data-code=\"H1328\">Bethuel,</span> <span class=\"wl wl-kjv\" data-code=\"H5152\">Nahor's</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">son,</span> whom <span class=\"wl wl-kjv\" data-code=\"H4435\">Milcah</span> <span class=\"wl wl-kjv\" data-code=\"H3205\">bare</span> unto him: and I <span class=\"wl wl-kjv\" data-code=\"H7760\">put</span> the <span class=\"wl wl-kjv\" data-code=\"H5141\">earring</span> upon her <span class=\"wl wl-kjv\" data-code=\"H639\">face,</span> and the <span class=\"wl wl-kjv\" data-code=\"H6781\">bracelets</span> upon her hands.", "48": "And I bowed down my <span class=\"wl wl-kjv\" data-code=\"H6915\">head,</span> and <span class=\"wl wl-kjv\" data-code=\"H7812\">worshipped</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and <span class=\"wl wl-kjv\" data-code=\"H1288\">blessed</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of my <span class=\"wl wl-kjv\" data-code=\"H113\">master</span> <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham,</span> which had led <span class=\"wl wl-kjv\" data-code=\"H5148\">me</span> in the <span class=\"wl wl-kjv\" data-code=\"H571\">right</span> <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> to <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> my <span class=\"wl wl-kjv\" data-code=\"H113\">master's</span> <span class=\"wl wl-kjv\" data-code=\"H251\">brother's</span> <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> unto his son.", "49": "And now if ye <span class=\"wl wl-kjv\" data-code=\"H3426\">will</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">deal</span> <span class=\"wl wl-kjv\" data-code=\"H2617\">kindly</span> and <span class=\"wl wl-kjv\" data-code=\"H571\">truly</span> with my <span class=\"wl wl-kjv\" data-code=\"H113\">master,</span> <span class=\"wl wl-kjv\" data-code=\"H5046\">tell</span> me: and if not, <span class=\"wl wl-kjv\" data-code=\"H5046\">tell</span> me; that I may <span class=\"wl wl-kjv\" data-code=\"H6437\">turn</span> to the right <span class=\"wl wl-kjv\" data-code=\"H3225\">hand,</span> <span class=\"wl wl-kjv\" data-code=\"H176\">or</span> to the left.", "50": "Then <span class=\"wl wl-kjv\" data-code=\"H3837\">Laban</span> and <span class=\"wl wl-kjv\" data-code=\"H1328\">Bethuel</span> <span class=\"wl wl-kjv\" data-code=\"H6030\">answered</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> The <span class=\"wl wl-kjv\" data-code=\"H1697\">thing</span> <span class=\"wl wl-kjv\" data-code=\"H3318\">proceedeth</span> from the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD:</span> we <span class=\"wl wl-kjv\" data-code=\"H3201\">cannot</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> unto thee <span class=\"wl wl-kjv\" data-code=\"H7451\">bad</span> <span class=\"wl wl-kjv\" data-code=\"H176\">or</span> good.", "51": "Behold, <span class=\"wl wl-kjv\" data-code=\"H7259\">Rebekah</span> is before <span class=\"wl wl-kjv\" data-code=\"H6440\">thee,</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> her, and <span class=\"wl wl-kjv\" data-code=\"H3212\">go,</span> and let her be thy <span class=\"wl wl-kjv\" data-code=\"H113\">master's</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">son's</span> <span class=\"wl wl-kjv\" data-code=\"H802\">wife,</span> as the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath spoken.", "52": "And it came to pass, that, when <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham's</span> <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> their <span class=\"wl wl-kjv\" data-code=\"H1697\">words,</span> he <span class=\"wl wl-kjv\" data-code=\"H7812\">worshipped</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> bowing himself to the earth.", "53": "And the <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> brought <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> <span class=\"wl wl-kjv\" data-code=\"H3627\">jewels</span> of <span class=\"wl wl-kjv\" data-code=\"H3701\">silver,</span> and <span class=\"wl wl-kjv\" data-code=\"H3627\">jewels</span> of <span class=\"wl wl-kjv\" data-code=\"H2091\">gold,</span> and <span class=\"wl wl-kjv\" data-code=\"H899\">raiment,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> them to <span class=\"wl wl-kjv\" data-code=\"H7259\">Rebekah:</span> he <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> also to her <span class=\"wl wl-kjv\" data-code=\"H251\">brother</span> and to her <span class=\"wl wl-kjv\" data-code=\"H517\">mother</span> precious things.", "54": "And they did <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> and <span class=\"wl wl-kjv\" data-code=\"H8354\">drink,</span> he and the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> that were with him, and tarried all <span class=\"wl wl-kjv\" data-code=\"H3885\">night;</span> and they rose <span class=\"wl wl-kjv\" data-code=\"H6965\">up</span> in the <span class=\"wl wl-kjv\" data-code=\"H1242\">morning,</span> and he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Send me <span class=\"wl wl-kjv\" data-code=\"H7971\">away</span> unto my master.", "55": "And her <span class=\"wl wl-kjv\" data-code=\"H251\">brother</span> and her <span class=\"wl wl-kjv\" data-code=\"H517\">mother</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Let the <span class=\"wl wl-kjv\" data-code=\"H5291\">damsel</span> <span class=\"wl wl-kjv\" data-code=\"H3427\">abide</span> with us a few <span class=\"wl wl-kjv\" data-code=\"H3117\">days,</span> at the <span class=\"wl wl-kjv\" data-code=\"H176\">least</span> <span class=\"wl wl-kjv\" data-code=\"H6218\">ten;</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> that she shall go.", "56": "And he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto them, Hinder <span class=\"wl wl-kjv\" data-code=\"H309\">me</span> not, seeing the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H6743\">prospered</span> my <span class=\"wl wl-kjv\" data-code=\"H1870\">way;</span> send me <span class=\"wl wl-kjv\" data-code=\"H7971\">away</span> that I may <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> to my master.", "57": "And they <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> We will <span class=\"wl wl-kjv\" data-code=\"H7121\">call</span> the <span class=\"wl wl-kjv\" data-code=\"H5291\">damsel,</span> and <span class=\"wl wl-kjv\" data-code=\"H7592\">enquire</span> at her mouth.", "58": "And they <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> <span class=\"wl wl-kjv\" data-code=\"H7259\">Rebekah,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto her, Wilt thou <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> with this <span class=\"wl wl-kjv\" data-code=\"H376\">man?</span> And she <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> I will go.", "59": "And they sent <span class=\"wl wl-kjv\" data-code=\"H7971\">away</span> <span class=\"wl wl-kjv\" data-code=\"H7259\">Rebekah</span> their <span class=\"wl wl-kjv\" data-code=\"H269\">sister,</span> and her <span class=\"wl wl-kjv\" data-code=\"H3243\">nurse,</span> and <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham's</span> <span class=\"wl wl-kjv\" data-code=\"H5650\">servant,</span> and his men.", "60": "And they <span class=\"wl wl-kjv\" data-code=\"H1288\">blessed</span> <span class=\"wl wl-kjv\" data-code=\"H7259\">Rebekah,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto her, <span class=\"wl wl-kjv\" data-code=\"H859\">Thou</span> art our <span class=\"wl wl-kjv\" data-code=\"H269\">sister,</span> be <span class=\"wl wl-kjv\" data-code=\"H1961\">thou</span> the mother of <span class=\"wl wl-kjv\" data-code=\"H505\">thousands</span> of <span class=\"wl wl-kjv\" data-code=\"H7233\">millions,</span> and let thy <span class=\"wl wl-kjv\" data-code=\"H2233\">seed</span> <span class=\"wl wl-kjv\" data-code=\"H3423\">possess</span> the <span class=\"wl wl-kjv\" data-code=\"H8179\">gate</span> of those which hate", "61": "And <span class=\"wl wl-kjv\" data-code=\"H7259\">Rebekah</span> <span class=\"wl wl-kjv\" data-code=\"H6965\">arose,</span> and her <span class= (function bouwHfdnav() {
  const m = D.meta;

    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');

  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

const concordCache = {};

    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }

}

    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}

function renderPaneel(n) {

    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een vers: snel wisselen van vertaling ---------- */
(function () {
  const menu = document.createElement('div');
  menu.id = 'vertmenu';
  menu.style.cssText = 'position:absolute;display:none;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.3rem;font-family:sans-serif;font-size:.85rem;z-index:30;min-width:7rem;';
  document.body.appendChild(menu);
  function toon(x, y) {
    menu.innerHTML = Object.keys(D.vertalingen).map(naam =>
      `<div class="vm-optie" data-v="${naam}" style="padding:.35rem .6rem;border-radius:5px;cursor:pointer;${naam === vertaling ? 'font-weight:700;color:var(--accent-donker)' : ''}">${naam}</div>`
    ).join('');
    const breedte = document.documentElement.clientWidth;
    menu.style.left = Math.max(4, Math.min(x, breedte - 130)) + 'px';
    menu.style.top = y + 'px';
    menu.style.display = 'block';
  }
  document.addEventListener('contextmenu', e => {
    const rij = e.target.closest('.vers');
    if (!rij) return;
    e.preventDefault();
    toon(e.pageX, e.pageY);
  });
  menu.addEventListener('mouseover', e => {
    const o = e.target.closest('.vm-optie');
    if (o) o.style.background = 'var(--bg-soft)';
  });
  menu.addEventListener('mouseout', e => {
    const o = e.target.closest('.vm-optie');
    if (o) o.style.background = '';
  });
  menu.addEventListener('click', e => {
    const o = e.target.closest('.vm-optie');
    if (!o) return;
    vertaling = o.dataset.v;
    const kies = document.getElementById('vertaalkies');
    if (kies) kies.value = vertaling;
    bouwRijen();
    menu.style.display = 'none';
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#vertmenu')) menu.style.display = 'none';
  });
  document.addEventListener('scroll', () => { menu.style.display = 'none'; }, true);
})();
</script>
