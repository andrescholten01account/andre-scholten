es wat hij had, en hij kwam in Berseba, en hij offerde offers aan de God van zijn vader Izak.","2":"En God sprak tot Israël in visioenen in de nacht, en zei: Jakob, Jakob! En hij zei: Zie, hier ben ik!","3":"En Hij zei: Ik ben die God, de God van uw vader; wees niet bang om af te trekken naar Egypte; want Ik zal u daar tot een groot volk maken.","4":"Ik zal met u aftrekken naar Egypte, en Ik zal u ook weer laten optrekken; en Jozef zal zijn hand op uw ogen leggen.","5":"Toen maakte Jakob zich op vanuit Berseba; en de zonen van Israël vervoerden Jakob, hun vader, en hun kinderen, en hun vrouwen, op de wagens die de farao gestuurd had om hem te vervoeren.","6":"En zij namen hun vee en hun bezittingen die zij in het land Kanaän verworven hadden, en zij kwamen in Egypte, Jakob en al zijn nageslacht met hem;","7":"zijn zonen en de zonen van zijn zonen met hem, zijn dochters en de dochters van zijn zonen, en al zijn nageslacht bracht hij met zich mee naar Egypte.","8":"En dit zijn de namen van de zonen van Israël die naar Egypte kwamen: Jakob en zijn zonen. De eerstgeborene van Jakob: Ruben.","9":"En de zonen van Ruben: Hanoch, en Pallu, en Hezron, en Karmi.","10":"En de zonen van Simeon: Jemuël, en Jamin, en Ohad, en Jachin, en Zohar, en Saul, de zoon van een Kanaänitische vrouw.","11":"En de zonen van Levi: Gerson, Kehath en Merari.","12":"En de zonen van Juda: Er, en Onan, en Sela, en Perez, en Zerah. Maar Er en Onan waren gestorven in het land Kanaän; en de zonen van Perez waren Hezron en Hamul.","13":"En de zonen van Issaschar: Tola, en Puwa, en Job, en Simron.","14":"En de zonen van Zebulon: Sered, en Elon, en Jahleel.","15":"Dit zijn de zonen van Lea, die zij Jakob gebaard heeft in Paddan-Aram, samen met Dina, zijn dochter; al de zielen van zijn zonen en zijn dochters waren drieëndertig.","16":"En de zonen van Gad: Zifjon en Haggi, Schuni en Ezbon, Eri en Arodi, en Areli.","17":"En de zonen van Aser: Jimna, en Jisva, en Jisvi, en Berija, en Sera, hun zuster; en de zonen van Berija: Heber en Malchiël.","18":"Dit zijn de zonen van Zilpa, die Laban aan zijn dochter Lea gegeven had; en zij baarde Jakob deze zestien zielen.","19":"De zonen van Rachel, Jakobs vrouw: Jozef en Benjamin.","20":"En voor Jozef werden geboren in het land Egypte, Manasse en Efraïm, die Asnath, de dochter van Potifera, de leider te On, hem baarde.","21":"En de zonen van Benjamin: Bela, Becher en Asbel, Gera en Naäman, Echi en Ros, Muppim en Huppim, en Ard.","22":"Dit zijn de zonen van Rachel, die Jakob geboren zijn, samen veertien zielen.","23":"En de zonen van Dan: Chusim.","24":"En de zonen van Nafthali: Jahzeel, en Guni, en Jezer, en Sillem.","25":"Dit zijn de zonen van Bilha, die Laban aan zijn dochter Rachel gegeven had; en zij baarde deze Jakob, zij waren allen zeven zielen.","26":"Al de zielen die met Jakob naar Egypte kwamen, uit zijn heup voortgekomen, behalve de vrouwen van de zonen van Jakob, waren allen zesenzestig zielen.","27":"En de zonen van Jozef die hem in Egypte geboren zijn, waren twee zielen. Al de zielen van het huis van Jakob die naar Egypte kwamen, waren zeventig.","28":"En hij stuurde Juda voor zich uit naar Jozef, om voor hem uit de weg te wijzen naar Gosen; en zij kwamen in het land Gosen.","29":"Toen spande Jozef zijn wagen aan, en trok op, zijn vader Israël tegemoet naar Gosen; en toen hij zich aan hem vertoonde, viel hij hem om zijn hals, en huilde lang aan zijn hals.","30":"En Israël zei tegen Jozef: Laat mij nu sterven, nadat ik uw gezicht gezien heb, omdat u nog leeft!","31":"Daarna zei Jozef tegen zijn broers en tegen het huis van zijn vader: Ik zal optrekken en de farao berichten, en tegen hem zeggen: Mijn broers en het huis van mijn vader, die in het land Kanaän waren, zijn bij mij gekomen.","32":"En die mannen zijn schaapherders; want het zijn mannen die met vee omgaan; en zij hebben hun schapen, en hun runderen, en alles wat zij hebben, meegebracht.","33":"Wanneer het nu zal gebeuren dat de farao u zal roepen, en zeggen: Wat is uw beroep?","34":"Dan moet u zeggen: Uw knechten zijn mannen die van onze jeugd af tot nu toe met vee omgegaan hebben, zowel wij als onze vaders; opdat u in het land Gosen mag wonen; want elke schaapherder is voor de Egyptenaren een gruwel."},"SV":{"1":"En Israël verreisde met al wat hij had, en hij kwam te Ber-seba, en hij offerde offeranden aan den God van zijn vader Izak.","2":"En God sprak tot Israël in gezichten des nachts, en zeide: Jakob, Jakob! En hij zeide: Zie, *hier* ben ik!","3":"En Hij zeide: Ik ben die God, uws vaders God; vrees niet van af te trekken naar Egypte; want Ik zal u aldaar tot een groot volk zetten.","4":"Ik zal met u aftrekken naar Egypte en Ik zal u doen *weder* optrekken, mede optrekkende; en Jozef zal zijn hand op uw ogen leggen.","5":"Toen maakte zich Jakob op van Ber-seba; en de zonen van Israël voerden Jakob, hun vader, en hun kinderen, en hun vrouwen, op de wagenen, die Farao gezonden had, om hem te voeren.","6":"En zij namen hun vee, en hun have, die zij in het land Kanaän geworven hadden, en zij kwamen in Egypte, Jakob en al zijn zaad met hem;","7":"Zijn zonen, en de zonen zijner zonen met hem; zijn dochteren, en zijner zonen dochteren, en al zijn zaad bracht hij met zich in Egypte.","8":"En dit zijn de namen der zonen van Israël, die in Egypte kwamen: Jakob en zijn zonen. De eerstgeborene van Jakob: Ruben.","9":"En de zonen van Ruben: Hanoch, en Pallu, en Hezron, en Karmi.","10":"En de zonen van Simeon: Jemuël, en Jamin, en Ohad, en Jachin, en Zohar, en Saul, de zoon ener Kanaänietische vrouw.","11":"En de zonen van Levi: Gerson, Kehath en Merari.","12":"En de zonen van Juda: Er, en Onan, en Sela, en Perez, en Zerah. Doch Er en Onan waren gestorven in het land van Kanaän; en de zonen van Perez waren Hezron en Hamul.","13":"En de zonen van Issaschar: Tola, en Puwa, en Job, en Simron.","14":"En de zonen van Zebulon: Sered, en Elon, en Jahleel.","15":"Dit zijn de zonen van Lea, die zij Jakob gebaard heeft in Paddan-aram, met Dina zijn dochter; al de zielen zijner zonen en zijner dochteren waren drie en dertig.","16":"En de zonen van Gad: Zifjon en Haggi, Schuni en Ezbon, Eri en Arodi, en Areli.","17":"En de zonen van Aser: Jimna, en Jisva, en Jisvi, en Berija, en Sera, hun zuster; en de zonen van Berija: Heber en Malchiël.","18":"Dit zijn de zonen van Zilpa, die Laban aan zijn dochter Lea gegeven had; en zij baarde Jakob deze zestien zielen.","19":"De zonen van Rachel, Jakobs huisvrouw: Jozef en Benjamin.","20":"En Jozef werden geboren in Egypteland, Manasse en Efraïm, die hem Asnath, de dochter van Potifera, den overste te On, baarde.","21":"En de zonen van Benjamin: Bela, Becher en Asbel, Gera en Naäman, Echi en Ros, Muppim en Huppim, en Ard.","22":"Dit zijn de zonen van Rachel, die Jakob geboren zijn, al te zamen veertien zielen.","23":"En de zonen van Dan: Chusim.","24":"En de zonen van Nafthali: Jahzeel, en Guni, en Jezer, en Sillem.","25":"Dit zijn de zonen van Bilha, die Laban aan zijn dochter Rachel gegeven had; en zij baarde dezelve Jakob, zij waren allen zeven zielen.","26":"Al de zielen, die met Jakob in Egypte kwamen, uit zijn heup gesproten, uitgenomen de vrouwen van de zonen van Jakob, waren allen zes en zestig zielen.","27":"En de zonen van Jozef, die hem in Egypte geboren zijn, waren twee zielen. Al de zielen van het huis van Jakob, die in Egypte kwamen, waren zeventig.","28":"En hij zond Juda voor zijn aangezicht heen tot Jozef, om voor zijn aangezicht aanwijzing te doen naar Gosen; en zij kwamen in het land Gosen.","29":"Toen spande Jozef zijn wagen aan, en toog op, zijn vader Israël tegemoet naar Gosen; en als hij zich aan hem vertoonde, zo viel hij hem aan zijn hals, en weende lang aan zijn hals.","30":"En Israël zeide tot Jozef: Dat ik nu sterve, nadat ik uw aangezicht gezien heb, dat gij nog leeft!","31":"Daarna zeide Jozef tot zijn broederen, en tot zijns vaders huis: Ik zal optrekken en Farao boodschappen, en tot hem zeggen: Mijn broeders en het huis mijns vaders, die in het land Kanaän waren, zijn tot mij gekomen.","32":"En die mannen zijn schaapherders; want het zijn mannen, die met vee omgaan; en zij hebben hun schapen, en hun runderen, en al wat zij hebben, medegebracht.","33":"Wanneer het nu geschieden zal, dat Farao ulieden zal roepen, en zeggen: Wat is uw hantering?","34":"Zo zult gij zeggen: Uw knechten zijn mannen, die van onze jeugd af tot nu toe met vee omgegaan hebben, zo wij als onze vaders; opdat gij in het land Gosen moogt wonen; want alle schaapherder is den Egyptenaren een gruwel."},"KJV":{"1":"And Israel took his journey with all that he had, and came to Beersheba, and offered sacrifices unto the God of his father Isaac.","2":"And God spake unto Israel in the visions of the night, and said, Jacob, Jacob. And he said,","3":"And he said, I *am* God, the God of thy father: fear not to go down into Egypt; for I will there make of thee a great nation:","4":"I will go down with thee into Egypt; and I will also surely bring thee up *again*: and Joseph shall put his hand upon thine eyes.","5":"And Jacob rose up from Beersheba: and the sons of Israel carried Jacob their father, and their little ones, and their wives, in the wagons which Pharaoh had sent to carry","6":"And they took their cattle, and their goods, which they had gotten in the land of Canaan, and came into Egypt, Jacob, and all his seed","7":"His sons, and his sons' sons with him, his daughters, and his sons' daughters, and all his seed brought he with him into Egypt.","8":"And these *are* the names of the children of Israel, which came into Egypt, Jacob and his sons: Reuben, Jacob's firstborn.","9":"And the sons of Reuben; Hanoch, and Phallu, and Hezron, and Carmi.","10":"And the sons of Simeon; Jemuel, and Jamin, and Ohad, and Jachin, and Zohar, and Shaul the son of a Canaanitish","11":"And the sons of Levi; Gershon, Kohath, and Merari.","12":"And the sons of Judah; Er, and Onan, and Shelah, and Pharez, and Zerah: but Er and Onan died in the land of Canaan. And the sons of Pharez were Hezron and Hamul.","13":"And the sons of Issachar; Tola, and Phuvah, and Job, and Shimron.","14":"And the sons of Zebulun; Sered, and Elon, and Jahleel.","15":"These *be* the sons of Leah, which she bare unto Jacob in Padanaram, with his daughter Dinah: all the souls of his sons and his daughters *were* thirty and three.","16":"And the sons of Gad; Ziphion, and Haggi, Shuni, and Ezbon, Eri, and Arodi, and Areli.","17":"And the sons of Asher; Jimnah, and Ishuah, and Isui, and Beriah, and Serah their sister: and the sons of Beriah; Heber, and Malchiel.","18":"These *are* the sons of Zilpah, whom Laban gave to Leah his daughter, and these she bare unto Jacob, *even* sixteen souls.","19":"The sons of Rachel Jacob's wife; Joseph, and Benjamin.","20":"And unto Joseph in the land of Egypt were born Manasseh and Ephraim, which Asenath the daughter of Potipherah priest of On bare","21":"And the sons of Benjamin *were* Belah, and Becher, and Ashbel, Gera, and Naaman, Ehi, and Rosh, Muppim, and Huppim, and Ard.","22":"These *are* the sons of Rachel, which were born to Jacob: all the souls *were* fourteen.","23":"And the sons of Dan; Hushim.","24":"And the sons of Naphtali; Jahzeel, and Guni, and Jezer, and Shillem.","25":"These *are* the sons of Bilhah, which Laban gave unto Rachel his daughter, and she bare these unto Jacob: all the souls *were* seven.","26":"All the souls that came with Jacob into Egypt, which came out of his loins, besides Jacob's sons' wives, all the souls *were* threescore and six;","27":"And the sons of Joseph, which were born him in Egypt, *were* two souls: all the souls of the house of Jacob, which came into Egypt, *were* threescore and ten.","28":"And he sent Judah before him unto Joseph, to direct his face unto Goshen; and they came into the land of Goshen.","29":"And Joseph made ready his chariot, and went up to meet Israel his father, to Goshen, and presented himself unto him; and he fell on his neck, and wep ome to pass, when <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh</span> shall <span class=\"wl wl-kjv\" data-code=\"H7121\">call</span> you, and shall <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> What is your occupation?","34":"That ye shall <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> Thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servants'</span> <span class=\"wl wl-kjv\" data-code=\"H582\">trade</span> hath been about <span class=\"wl wl-kjv\" data-code=\"H4735\">cattle</span> from our <span class=\"wl wl-kjv\" data-code=\"H5271\">youth</span> even until now, both we, and also our <span class=\"wl wl-kjv\" data-code=\"H1\">fathers:</span> that ye may <span class=\"wl wl-kjv\" data-code=\"H3427\">dwell</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H1657\">Goshen;</span> for every <span class=\"wl wl-kjv\" data-code=\"H7462\">shepherd</span> is an <span class=\"wl wl-kjv\" data-code=\"H8441\">abomination</span> unto the Egyptians."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"verreisde","tekst":"Dit is geschied in het jaar na de schepping der wereld omtrent 2239, tien jaren na Izaks dood, toen Jozef 39 jaren oud was; zie boven, Gen 35:1."},{"catchword":"Ber-séba,","tekst":"Zie boven, Gen 21:31."},{"catchword":"den God van","tekst":"Dat is, dien zijn vader Izak geëerd en aangeroepen had. Hiermede betoonde hij zijn standvastig geloof aan Gods beloften, en zijn dankbaarheid voor Gods weldaden, en bad Hem om raad en hulp op deze reis."}],"2":[{"catchword":"in gezichten","tekst":"De gezichten in het algemeen genomen, waardoor God in die tijden zich aan de mensen openbaarde, zijn geweest somtijds buiten den slaap, door het aanschouwen van enige gedaante, die viel òf in de ogen des lichaams, gelijk boven, Gen 15:1, Gen 15:5, enz., òf in het gezicht des geestes, Zec 3:1, somtijds in den slaap, door manier van dromen, gelijk boven, Gen 20:3; Job 33:15-16. Beiden k (function bouwHfdnav() {

    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');

    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');

    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'

  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |

  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}

    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>

    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {

    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];

    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  // dubbele rechtsklik (binnen 500ms, zelfde verwijzing) kopieert het vers
  // i.p.v. de vertalingen-popup te tonen (enkele rechtsklik blijft bestaand gedrag)
  function kopieerVerwijzing(chip, ref) {
    haalVert('versteksten', ref).then(data => {
      const tekst = data && data[ref.vers];
      if (!tekst) return;
      const url = location.origin + '/studiebijbel/' + ref.slug + '/' + ref.hfd + '#v' + ref.vers;
      const kopie = tekst.replace(/\*/g, '') + `\n~ [${chip.textContent}](${url}) (SVnu)`;
      navigator.clipboard.writeText(kopie).then(() => {
        toast.classList.add('zichtbaar');
        setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
      });
    });
  }
  let laatsteRechtsklik = { sleutel: null, tijd: 0 };
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    const sleutel = chip.dataset.ref;
    const nu = Date.now();
    const isDubbelklik = laatsteRechtsklik.sleutel === sleutel && (nu - laatsteRechtsklik.tijd) < 500;
    laatsteRechtsklik = isDubbelklik ? { sleutel: null, tijd: 0 } : { sleutel, tijd: nu };
    if (isDubbelklik) {

    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';

    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
<script src="/studiebijbel/zoekbalk.js"></script></body>
</html>
