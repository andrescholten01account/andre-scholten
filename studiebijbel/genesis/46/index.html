=\"H3027\">hand</span> upon thine eyes.", "5": "And <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> rose <span class=\"wl wl-kjv\" data-code=\"H6965\">up</span> from <span class=\"wl wl-kjv\" data-code=\"H884\">Beersheba:</span> and the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H5375\">carried</span> <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> their <span class=\"wl wl-kjv\" data-code=\"H1\">father,</span> and their little <span class=\"wl wl-kjv\" data-code=\"H2945\">ones,</span> and their <span class=\"wl wl-kjv\" data-code=\"H802\">wives,</span> in the <span class=\"wl wl-kjv\" data-code=\"H5699\">wagons</span> which <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh</span> had <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> to carry", "6": "And they <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> their <span class=\"wl wl-kjv\" data-code=\"H4735\">cattle,</span> and their <span class=\"wl wl-kjv\" data-code=\"H7399\">goods,</span> which they had <span class=\"wl wl-kjv\" data-code=\"H7408\">gotten</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H3667\">Canaan,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> into <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob,</span> and all his seed", "7": "His <span class=\"wl wl-kjv\" data-code=\"H1121\">sons,</span> and his <span class=\"wl wl-kjv\" data-code=\"H1121\">sons'</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> with him, his <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters,</span> and his <span class=\"wl wl-kjv\" data-code=\"H1121\">sons'</span> <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters,</span> and all his <span class=\"wl wl-kjv\" data-code=\"H2233\">seed</span> brought <span class=\"wl wl-kjv\" data-code=\"H935\">he</span> with him into Egypt.", "8": "And these are the <span class=\"wl wl-kjv\" data-code=\"H8034\">names</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> which <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> into <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> and his <span class=\"wl wl-kjv\" data-code=\"H1121\">sons:</span> <span class=\"wl wl-kjv\" data-code=\"H7205\">Reuben,</span> <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob's</span> firstborn.", "9": "And the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H7205\">Reuben;</span> <span class=\"wl wl-kjv\" data-code=\"H2585\">Hanoch,</span> and <span class=\"wl wl-kjv\" data-code=\"H6396\">Phallu,</span> and <span class=\"wl wl-kjv\" data-code=\"H2696\">Hezron,</span> and Carmi.", "10": "And the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H8095\">Simeon;</span> <span class=\"wl wl-kjv\" data-code=\"H3223\">Jemuel,</span> and <span class=\"wl wl-kjv\" data-code=\"H3226\">Jamin,</span> and <span class=\"wl wl-kjv\" data-code=\"H161\">Ohad,</span> and <span class=\"wl wl-kjv\" data-code=\"H3199\">Jachin,</span> and <span class=\"wl wl-kjv\" data-code=\"H6714\">Zohar,</span> and <span class=\"wl wl-kjv\" data-code=\"H7586\">Shaul</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of a Canaanitish", "11": "And the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H3878\">Levi;</span> <span class=\"wl wl-kjv\" data-code=\"H1648\">Gershon,</span> <span class=\"wl wl-kjv\" data-code=\"H6955\">Kohath,</span> and Merari.", "12": "And the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah;</span> <span class=\"wl wl-kjv\" data-code=\"H6147\">Er,</span> and <span class=\"wl wl-kjv\" data-code=\"H209\">Onan,</span> and <span class=\"wl wl-kjv\" data-code=\"H7956\">Shelah,</span> and <span class=\"wl wl-kjv\" data-code=\"H6557\">Pharez,</span> and <span class=\"wl wl-kjv\" data-code=\"H2226\">Zerah:</span> but <span class=\"wl wl-kjv\" data-code=\"H6147\">Er</span> and <span class=\"wl wl-kjv\" data-code=\"H209\">Onan</span> <span class=\"wl wl-kjv\" data-code=\"H4191\">died</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H3667\">Canaan.</span> And the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H6557\">Pharez</span> were <span class=\"wl wl-kjv\" data-code=\"H2696\">Hezron</span> and Hamul.", "13": "And the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H3485\">Issachar;</span> <span class=\"wl wl-kjv\" data-code=\"H8439\">Tola,</span> and <span class=\"wl wl-kjv\" data-code=\"H6312\">Phuvah,</span> and <span class=\"wl wl-kjv\" data-code=\"H3102\">Job,</span> and Shimron.", "14": "And the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H2074\">Zebulun;</span> <span class=\"wl wl-kjv\" data-code=\"H5624\">Sered,</span> and <span class=\"wl wl-kjv\" data-code=\"H356\">Elon,</span> and Jahleel.", "15": "These be the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H3812\">Leah,</span> which she <span class=\"wl wl-kjv\" data-code=\"H3205\">bare</span> unto <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> in <span class=\"wl wl-kjv\" data-code=\"H6307\">Padanaram,</span> with his <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> <span class=\"wl wl-kjv\" data-code=\"H1783\">Dinah:</span> all the <span class=\"wl wl-kjv\" data-code=\"H5315\">souls</span> of his <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> and his <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters</span> were <span class=\"wl wl-kjv\" data-code=\"H7970\">thirty</span> and three.", "16": "And the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H1410\">Gad;</span> <span class=\"wl wl-kjv\" data-code=\"H6837\">Ziphion,</span> and <span class=\"wl wl-kjv\" data-code=\"H2291\">Haggi,</span> <span class=\"wl wl-kjv\" data-code=\"H7764\">Shuni,</span> and <span class=\"wl wl-kjv\" data-code=\"H675\">Ezbon,</span> <span class=\"wl wl-kjv\" data-code=\"H6179\">Eri,</span> and <span class=\"wl wl-kjv\" data-code=\"H722\">Arodi,</span> and Areli.", "17": "And the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H836\">Asher;</span> <span class=\"wl wl-kjv\" data-code=\"H3232\">Jimnah,</span> and <span class=\"wl wl-kjv\" data-code=\"H3438\">Ishuah,</span> and <span class=\"wl wl-kjv\" data-code=\"H3440\">Isui,</span> and <span class=\"wl wl-kjv\" data-code=\"H1283\">Beriah,</span> and <span class=\"wl wl-kjv\" data-code=\"H8294\">Serah</span> their <span class=\"wl wl-kjv\" data-code=\"H269\">sister:</span> and the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H1283\">Beriah;</span> <span class=\"wl wl-kjv\" data-code=\"H2268\">Heber,</span> and Malchiel.", "18": "These are the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H2153\">Zilpah,</span> whom <span class=\"wl wl-kjv\" data-code=\"H3837\">Laban</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> to <span class=\"wl wl-kjv\" data-code=\"H3812\">Leah</span> his <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter,</span> and these she <span class=\"wl wl-kjv\" data-code=\"H3205\">bare</span> unto <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob,</span> even <span class=\"wl wl-kjv\" data-code=\"H6240\">sixteen</span> souls.", "19": "The <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H7354\">Rachel</span> <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob's</span> <span class=\"wl wl-kjv\" data-code=\"H802\">wife;</span> <span class=\"wl wl-kjv\" data-code=\"H3130\">Joseph,</span> and Benjamin.", "20": "And unto <span class=\"wl wl-kjv\" data-code=\"H3130\">Joseph</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt</span> were <span class=\"wl wl-kjv\" data-code=\"H3205\">born</span> <span class=\"wl wl-kjv\" data-code=\"H4519\">Manasseh</span> and <span class=\"wl wl-kjv\" data-code=\"H669\">Ephraim,</span> which <span class=\"wl wl-kjv\" data-code=\"H621\">Asenath</span> the <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> of <span class=\"wl wl-kjv\" data-code=\"H6319\">Potipherah</span> <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> of <span class=\"wl wl-kjv\" data-code=\"H204\">On</span> bare", "21": "And the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H1144\">Benjamin</span> were <span class=\"wl wl-kjv\" data-code=\"H1106\">Belah,</span> and <span class=\"wl wl-kjv\" data-code=\"H1071\">Becher,</span> and <span class=\"wl wl-kjv\" data-code=\"H788\">Ashbel,</span> <span class=\"wl wl-kjv\" data-code=\"H1617\">Gera,</span> and <span class=\"wl wl-kjv\" data-code=\"H5283\">Naaman,</span> <span class=\"wl wl-kjv\" data-code=\"H278\">Ehi,</span> and <span class=\"wl wl-kjv\" data-code=\"H7220\">Rosh,</span> <span class=\"wl wl-kjv\" data-code=\"H4649\">Muppim,</span> and <span class=\"wl wl-kjv\" data-code=\"H2650\">Huppim,</span> and Ard.", "22": "These are the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H7354\">Rachel,</span> which were <span class=\"wl wl-kjv\" data-code=\"H3205\">born</span> to <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob:</span> all the <span class=\"wl wl-kjv\" data-code=\"H5315\">souls</span> were <span class=\"wl wl-kjv\" data-code=\"H702\">fourteen.</span>", "23": "And the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H1835\">Dan;</span> Hushim.", "24": "And the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H5321\">Naphtali;</span> <span class=\"wl wl-kjv\" data-code=\"H3183\">Jahzeel,</span> and <span class=\"wl wl-kjv\" data-code=\"H1476\">Guni,</span> and <span class=\"wl wl-kjv\" data-code=\"H3337\">Jezer,</span> and Shillem.", "25": "These are the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H1090\">Bilhah,</span> which <span class=\"wl wl-kjv\" data-code=\"H3837\">Laban</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> unto <span class=\"wl wl-kjv\" data-code=\"H7354\">Rachel</span> his <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter,</span> and she <span class=\"wl wl-kjv\" data-code=\"H3205\">bare</span> these unto <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob:</span> all the <span class=\"wl wl-kjv\" data-code=\"H5315\">souls</span> were seven.", "26": "All the <span class=\"wl wl-kjv\" data-code=\"H5315\">souls</span> that <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> with <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> into <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> which came <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> of his <span class=\"wl wl-kjv\" data-code=\"H3409\">loins,</span> besides <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob's</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">sons'</span> <span class=\"wl wl-kjv\" data-code=\"H802\">wives,</span> all the <span class=\"wl wl-kjv\" data-code=\"H5315\">souls</span> were <span class=\"wl wl-kjv\" data-code=\"H8346\">threescore</span> and six;", "27": "And the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H3130\">Joseph,</span> which were <span class=\"wl wl-kjv\" data-code=\"H3205\">born</span> him in <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> were <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H5315\">souls:</span> all the <span class=\"wl wl-kjv\" data-code=\"H5315\">souls</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob,</span> which <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> into <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> were threescore and ten.", "28": "And he <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> before <span class=\"wl wl-kjv\" data-code=\"H6440\">him</span> unto <span class=\"wl wl-kjv\" data-code=\"H3130\">Joseph,</span> to <span class=\"wl wl-kjv\" data-code=\"H3384\">direct</span> his <span class=\"wl wl-kjv\" data-code=\"H6440\">face</span> unto <span class=\"wl wl-kjv\" data-code=\"H1657\">Goshen;</span> and they <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> into the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of Goshen.", "29": "And <span class=\"wl wl-kjv\" data-code=\"H3130\">Joseph</span> made <span class=\"wl wl-kjv\" data-code=\"H631\">ready</span> his <span class=\"wl wl-kjv\" data-code=\"H4818\">chariot,</span> and went <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> to <span class=\"wl wl-kjv\" data-code=\"H7125\">meet</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> his <span class=\"wl wl-kjv\" data-code=\"H1\">father,</span> to <span class=\"wl wl-kjv\" data-code=\"H1657\">Goshen,</span> and <span class=\"wl wl-kjv\" data-code=\"H7200\">presented</span> himself unto him; and he <span class=\"wl wl-kjv\" data-code=\"H5307\">fell</span> on his <span class=\"wl wl-kjv\" data-code=\"H6677\">neck,</span> and <span class=\"wl wl-kjv\" data-code=\"H1058\">wept</span> on his <span class=\"wl wl-kjv\" data-code=\"H6677\">neck</span> a good while.", "30": "And <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H3130\">Joseph,</span> <span class=\"wl wl-kjv\" data-code=\"H6471\">Now</span> let me <span class=\"wl wl-kjv\" data-code=\"H4191\">die,</span> <span class=\"wl wl-kjv\" data-code=\"H310\">since</span> I have <span class=\"wl wl-kjv\" data-code=\"H7200\">seen</span> thy <span class=\"wl wl-kjv\" data-code=\"H6440\">face,</span> because thou art <span class=\"wl wl-kjv\" data-code=\"H5750\">yet</span> alive.", "31": "And <span class=\"wl wl-kjv\" data-code=\"H3130\">Joseph</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto his <span class=\"wl wl-kjv\" data-code=\"H251\">brethren,</span> and unto his <span class=\"wl wl-kjv\" data-code=\"H1\">father's</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> I will go <span class=\"wl wl-kjv\" data-code=\"H5927\">up,</span> and <span class=\"wl wl-kjv\" data-code=\"H5046\">shew</span> <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> unto him, My <span class=\"wl wl-kjv\" data-code=\"H251\">brethren,</span> and my <span class=\"wl wl-kjv\" data-code=\"H1\">father's</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> which were in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H3667\">Canaan,</span> are come", "32": "And the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> are <span class=\"wl wl-kjv\" data-code=\"H7462\">shepherds,</span> for their trade hath been to feed <span class=\"wl wl-kjv\" data-code=\"H4735\">cattle;</span> and they have <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> their <span class=\"wl wl-kjv\" data-code=\"H6629\">flocks,</span> and their herds,", "33": "And it shall come to pass, when <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh</span> shall <span class=\"wl wl-kjv\" data-code=\"H7121\">call</span> you, and shall <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> What is your occupation?", "34": "That ye shall <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> Thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servants'</span> <span class=\"wl wl-kjv\" data-code=\"H582\">trade</span> hath been about <span class=\"wl wl-kjv\" data-code=\"H4735\">cattle</span> from our <span class=\"wl wl-kjv\" data-code=\"H5271\">youth</span> even until now, both we, and also our <span class=\"wl wl-kjv\" data-code=\"H1\">fathers:</span> that ye may <span class=\"wl wl-kjv\" data-code=\"H3427\">dwell</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H1657\">Goshen;</span> for every <span class=\"wl wl-kjv\" data-code=\"H7462\">shepherd</span> is an <span class=\"wl wl-kjv\" data-code=\"H8441\">abomination</span> unto the Egyptians."}};
const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"
const ZELF = D.meta.zelf_abbr;      // afkorting binnen dit hoofdstuk, bv. "Joh 3"
const BASIS_URL = D.meta.basis_url;
const PARALLEL_VOLGORDE = ['SVnu', 'SV', 'KJV'];
let vertaling = 'SVnu';
let openVers = null;

const bijbel = document.getElementById('bijbel');
const popup = document.getElementById('popup');
const toast = document.getElementById('toast');
const nummers = Object.keys(D.vertalingen.SVnu);

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const berea = D.tsk[n], engels = D.tsk_kjv[n];
    if ((!berea || !berea.length) && (!engels || !engels.length)) return '<em>Geen verwijzingen bij dit vers.</em>';
    let h = '';
    if (berea && berea.length) {
      h += '<div class="tsk-kop">Treasury of Scripture Knowledge | SVnu</div>';
      h += berea.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r}">${r}</a>`).join('') + '</div>').join('');
    }
    if (engels && engels.length) {
      h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.tsk[n] && D.tsk[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}
</script>
</body>
