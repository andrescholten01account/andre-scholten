<style>
  :root {
    /* huisstijl overgenomen van andre-scholten.nl (Quartz) */
    --light:#ffffff; --lightgray:#e5e5e5; --gray:#b3b3b3; --darkgray:#333333; --dark:#111111;

    --bg-soft: #f5f5f5; --border: var(--lightgray); --tekst: var(--darkgray);
  }

  body { font-family: var(--bodyFont); background: var(--bg); color: var(--tekst); margin: 0; line-height: 1.7; }

  h2.hfd { color: var(--dark); text-align: center; font-size: 1.75rem; font-weight: 700; margin: 2rem 0 0; }

  .hfdnav { display:flex; justify-content:space-between; align-items:center; gap:.6rem; flex-wrap:wrap; font-family:"Lora"; font-size:.85rem; padding:.5rem 0; margin-bottom:1.1rem; }

  .navknop.uit { color:#ccc; pointer-events:none; }
  .hfdnav .midden { display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:.4rem; color:#777; }
  .hfdnav select { font-family:"Lora"; font-size:.85rem; border:1px solid var(--border); border-radius:999px; padding:.3rem 1.6rem .3rem .8rem; background:#fff; color:var(--accent-donker); cursor:pointer; }

  .navselect { font-family:"Lora"; font-size:.85rem; border:1px solid var(--border); border-radius:999px; padding:.3rem 1.6rem .3rem .8rem; background:#fff; color:var(--accent-donker); cursor:pointer; display:inline-flex; align-items:center; text-decoration:none; }
  #bibliotheekknop { padding:.3rem .7rem; font-size:1rem; line-height:1; }

     wrapt dan als 'boek hoofdstuk' boven / 'vertaling lampje' onder */
  @media (min-width: 641px) {
    #vertaalkies { order: -1; }
  }

  /* verzen — tabsmodus (één kolom) */
  .vers { position: relative; display: flex; gap: .8rem; padding: .45rem 2.4rem .45rem .4rem; border-radius: 8px; cursor: pointer; }
  .vers:hover { background: var(--bg-soft); }
  .vers.open { background: var(--bg-soft); box-shadow: inset 3px 0 0 var(--accent); border-radius: 8px 8px 0 0; }
  .vers.flits { animation: flits 1.6s ease-out; }
  @keyframes flits { 0% { background: #e0e0e0; } 100% { background: var(--bg-soft); } }
  .vnr { color: #999999; font-size: .75rem; min-width: 1.6rem; text-align: right; padding-top: .45rem; font-family: "Lora"; }
  .vtekst em, .pcel em { font-style: italic; color: #555; }
  .wl { border-bottom: 1px dotted var(--accent); }
  .noot { color: var(--accent); cursor: pointer; font-weight: 700; padding: 0 .05rem; }
  .noot:hover { color: var(--accent-donker); }

  #notenlijst h3 { font-size: .78rem; text-transform: uppercase; letter-spacing: .12em; color: var(--accent-donker); margin: 0 0 .5rem; }

  #notenlijst .nootregel .nn { color: var(--accent); font-weight: 700; margin-right: .35rem; }
  .kopieer { position: absolute; right: .4rem; top: .55rem; opacity: 0; border: none; background: none; cursor: pointer; color: var(--accent); font-size: .95rem; padding: .1rem .3rem; transition: opacity .15s; }
  .vers:hover .kopieer { opacity: .75; }
  .kopieer:hover { opacity: 1 !important; }

  /* parallelmodus (kolommen naast elkaar) */
  #bijbel.parallel .vers { display:grid; gap:.8rem; cursor:pointer; align-items:start; }
  #bijbel.parallel .vnr { grid-row: 1; }
  .kolomkop { display:none; }
  #bijbel.parallel + .kolomkop, .kolomkop.tonen { }
  .pk { font-family:"Lora"; font-size:.72rem; text-transform:uppercase; letter-spacing:.12em; color:var(--accent-donker); font-weight:700; }
  #bijbel.parallel .pcel em { font-style:italic; color:#555; }

  /* naslagpaneel */
  .paneel { display: none; margin: 0 0 .6rem 0; background: #fff; box-shadow: inset 3px 0 0 var(--accent); border-radius: 0 0 8px 8px; padding: .9rem 1.1rem 1rem; font-family: "Lora"; font-size: 1rem; }
  .paneel.open { display: block; }
  .ntabs { display: flex; gap: .4rem; margin-bottom: .8rem; }

  .ntab.actief { background: var(--accent); color: #fff; border-color: var(--accent); }
  .ntab.leeg { opacity: .4; cursor: default; }

  .verg-kop { font-family:"Lora"; font-weight: 700; color: var(--accent-donker); font-size: 1.05rem; margin: 0 0 .6rem; padding-bottom: .35rem; border-bottom: 2px solid var(--accent); }

  .site-footer a { color:var(--secondary); text-decoration:underline; }

en op de aardbodem begonnen te vermenigvuldigen, en hun dochters geboren werden,","2":"dat Gods zonen de dochters der mensen aanzagen, dat zij mooi waren, en zij namen zich vrouwen uit allen die zij verkozen hadden.","3":"Toen zei de HEERE: Mijn Geest zal niet in eeuwigheid twisten met de mens, omdat hij ook vlees is; doch zijn dagen zullen honderdtwintig jaren zijn.","4":"In die dagen waren er reuzen op de aarde, en ook daarna, toen Gods zonen tot de dochters der mensen ingegaan waren, en zich *kinderen* verwekt hadden; deze zijn de geweldigen, die van ouds geweest zijn, mannen van naam.","5":"En de HEERE zag dat de slechtheid van de mens groot was op de aarde, en dat elk bedenksel van de gedachten van zijn hart alle dagen alleen maar slecht was.","6":"Toen had de HEERE er berouw van, dat Hij de mens op de aarde gemaakt had, en het smartte Hem aan Zijn hart.","7":"En de HEERE zei: Ik zal de mens, die Ik geschapen heb, wegvagen van de aardbodem, van de mens tot het vee, tot het kruipend gedierte, en tot het gevogelte van de hemel toe; want het berouwt Mij dat Ik hen gemaakt heb.","8":"Maar Noach vond genade in de ogen van de HEERE.","9":"Dit zijn de afstammelingen van Noach. Noach was een rechtvaardig, oprecht man onder zijn tijdgenoten. Noach wandelde met God.","10":"En Noach verwekte drie zonen: Sem, Cham en Jafeth.","11":"Maar de aarde was verdorven voor het aangezicht van God; en de aarde was vervuld met geweld.","12":"Toen zag God de aarde, en zie, zij was verdorven; want alle vlees had zijn weg verdorven op de aarde.","13":"Daarom zei God tegen Noach: Het einde van alle vlees is voor Mijn aangezicht gekomen; want de aarde is door hen vervuld met geweld; en zie, Ik zal hen met de aarde verderven.","14":"Maak u een ark van goferhout; met kamers zult u deze ark maken; en u zult die van binnen en van buiten met pek bepekken.","15":"En zo is het, dat u haar maken zult: driehonderd ellen zij de lengte van de ark, vijftig ellen haar breedte, en dertig ellen haar hoogte.","16":"U zult een venster aan de ark maken, en zult het afwerken tot een el van boven; en de deur van de ark zult u in haar zijde zetten; u zult ze met een onderste, tweede en derde *verdieping* maken.","17":"Want Ik, zie, Ik breng een watervloed over de aarde, om alle vlees waarin een geest van het leven is, van onder de hemel te verderven; alles wat op de aarde is, zal de geest geven.","18":"Maar met u zal Ik Mijn verbond oprichten; en u zult in de ark gaan, u, en uw zonen, en uw vrouw, en de vrouwen van uw zonen met u.","19":"En u zult van al wat leeft, van alle vlees, twee van elk, in de ark laten komen, om met u in het leven te behouden: mannetje en vrouwtje zullen zij zijn;","20":"Van het gevogelte naar zijn soort, en van het vee naar zijn soort, van al het kruipend gedierte van de aardbodem naar zijn soort, twee van elk zullen tot u komen, om die in het leven te behouden.","21":"En u, neem voor u van alle voedsel dat gegeten wordt, en verzamel het bij u, opdat het u en hun tot voedsel zij.","22":"En Noach deed het; naar alles wat God hem geboden had, zo deed hij."},"SV":{"1":"En het geschiedde, als de mensen op den aardbodem begonnen te vermenigvuldigen, en hun dochters geboren werden,","2":"Dat Gods zonen de dochteren der mensen aanzagen, dat zij schoon waren, en zij namen zich vrouwen uit allen, die zij verkozen hadden.","3":"Toen zeide de HEERE: Mijn Geest zal niet in eeuwigheid twisten met den mens, dewijl hij ook vlees is; doch zijn dagen zullen zijn honderd en twintig jaren.","4":"In die dagen waren er reuzen op de aarde, en ook daarna, als Gods zonen tot de dochteren der mensen ingegaan waren, en zich *kinderen* gewonnen hadden; deze zijn de geweldigen, die van ouds geweest zijn, mannen van name.","5":"En de HEERE zag, dat de boosheid des mensen menigvuldig *was* op de aarde, en al het gedichtsel der gedachten zijns harten te allen dage alleenlijk boos was.","6":"Toen berouwde het den HEERE, dat Hij den mens op de aarde gemaakt had, en het smartte Hem aan Zijn hart.","7":"En de HEERE zeide: Ik zal den mens, dien Ik geschapen heb, verdelgen van den aardbodem, van den mens tot het vee, tot het kruipend gedierte, en tot het gevogelte des hemels toe; want het berouwt Mij, dat Ik hen gemaakt heb.","8":"Maar Noach vond genade in de ogen des HEEREN.","9":"Dit *zijn* de geboorten van Noach. Noach was een rechtvaardig, oprecht man in zijn geslachten. Noach wandelde met God.","10":"En Noach gewon drie zonen: Sem, Cham en Jafeth.","11":"Maar de aarde was verdorven voor Gods aangezicht; en de aarde was vervuld met wrevel.","12":"Toen zag God de aarde, en ziet, zij was verdorven; want al het vlees had zijn weg verdorven op de aarde.","13":"Daarom zeide God tot Noach: Het einde van alle vlees is voor Mijn aangezicht gekomen; want de aarde is door hen vervuld met wrevel; en zie, Ik zal hen met de aarde verderven.","14":"Maak u een ark van goferhout; met kameren zult gij deze ark maken; en gij zult die bepekken van binnen en van buiten met pek.","15":"En aldus *is* *het*, dat gij haar maken zult: driehonderd ellen zij de lengte der ark, vijftig ellen haar breedte, en dertig ellen haar hoogte.","16":"Gij zult een venster aan de ark maken, en zult haar volmaken tot een elle van boven; en de deur der ark zult gij in haar zijde zetten; gij zult ze met onderste, tweede en derde *verdiepingen* maken.","17":"Want Ik, zie, Ik breng een watervloed over de aarde, om alle vlees, waarin een geest des levens *is*, van onder den hemel te verderven; al wat op de aarde *is*, zal den geest geven.","18":"Maar met u zal Ik Mijn verbond oprichten; en gij zult in de ark gaan, gij, en uw zonen, en uw huisvrouw, en de vrouwen uwer zonen met u.","19":"En gij zult van al wat leeft, van alle vlees, twee van elk, doen in de ark komen, om met u in het leven te behouden: mannetje en wijfje zullen zij zijn;","20":"Van het gevogelte naar zijn aard, en van het vee naar zijn aard, van al het kruipend gedierte des aardbodems naar zijn aard, twee van elk zullen tot u komen, om *die* in het leven te behouden.","21":"En gij, neem voor u van alle spijze, die gegeten wordt, en verzamel ze tot u, opdat zij u en hun tot spijze zij.","22":"En Noach deed het; naar al wat God hem geboden had, zo deed hij."},"KJV":{"1":"And it came to pass, when men began to multiply on the face of the earth, and daughters were born","2":"That the sons of God saw the daughters of men that they *were* fair; and they took them wives of all which they chose.","3":"And the LORD said, My spirit shall not always strive with man, for that he also *is* flesh: yet his days shall be an hundred and twenty years.","4":"There were giants in the earth in those days; and also after that, when the sons of God came in unto the daughters of men, and they bare *children* to them, the same *became* mighty men which *were* of old, men of renown.","5":"And GOD saw that the wickedness of man *was* great in the earth, and *that* every imagination of the thoughts of his heart *was* only evil continually.","6":"And it repented the LORD that he had made man on the earth, and it grieved him at his heart.","7":"And the LORD said, I will destroy man whom I have created from the face of the earth; both man, and beast, and the creeping thing, and the fowls of the air; for it repenteth me that I have made","8":"But Noah found grace in the eyes of the LORD.","9":"These *are* the generations of Noah: Noah was a just man *and* perfect in his generations, *and* Noah walked with God.","10":"And Noah begat three sons, Shem, Ham, and Japheth.","11":"The earth also was corrupt before God, and the earth was filled with violence.","12":"And God looked upon the earth, and, behold, it was corrupt; for all flesh had corrupted his way upon the earth.","13":"And God said unto Noah, The end of all flesh is come before me; for the earth is filled with violence through them; and, behold, I will destroy them with the earth.","14":"Make thee an ark of gopher wood; rooms shalt thou make in the ark, and shalt pitch it within and without with pitch.","15":"And this *is the fashion* which thou shalt make it *of*: The length of the ark *shall be* three hundred cubits, the breadth of it fifty cubits, and the height of it thirty cubits.","16":"A window shalt thou make to the ark, and in a cubit shalt thou finish it above; and the door of the ark shalt thou set in the side thereof; *with* lower, second, and third *stories* shalt thou make","17":"And, behold, I, even I, do bring a flood of waters upon the earth, to destroy all flesh, wherein *is* the breath of life, from under heaven; *and* every thing that *is* in the earth shall die.","18":"But with thee will I establish my covenant; and thou shalt come into the ark, thou, and thy sons, and thy wife, and thy sons' wives","19":"And of every living thing of all flesh, two of every *sort* shalt thou bring into the ark, to keep *them* alive with thee; they shall be male and female.","20":"Of fowls after their kind, and of cattle after their kind, of every creeping thing of the earth after his kind, two of every *sort* shall come unto thee, to keep *them* alive.","21":"And take thou unto thee of all food that is eaten, and thou shalt gather *it* to thee; and it shall be for food","22":"Thus did Noah; according to all that God commanded him, so did"}},"tsk":{"1":[{"kopje":"vermenigvuldigen","refs":["Gen 1:28"]}],"2":[{"kopje":"zonen","refs":["Gen 4:26","Ex 4:22","Ex 4:23","Deut 14:1","Ps 82:6","Ps 82:7","Jes 63:16","Mal 2:11","Joh 8:41","Joh 8:42","Rom 9:7","Rom 9:8","2 Kor 6:18"]},{"kopje":"aanzagen","refs":["2 Petr 2:14"]},{"kopje":"dat zij","refs":["Gen 3:6","Gen 39:6","Gen 39:7","2 Sam 11:2","Job 31:1","1 Joh 2:16"]},{"kopje":"en zij","refs":["Gen 24:3","Gen 27:46","Ex 34:16","Deut 7:3","Deut 7:4","Joz 23:12","Joz 23:13","Ezra 9:1","Ezra 9:2","Ezra 9:12","Neh 13:24-27","Mal 2:15","1 Kor 7:39","2 Kor 6:14-16"]}],"3":[{"kopje":"Mijn","refs":["Num 11:17","Neh 9:30","Jes 5:4","Jes 63:10","Jer 11:7","Jer 11:11","Hand 7:51" span class=\"wl wl-kjv\" data-code=\"H4390\">with</span> <span class=\"wl wl-kjv\" data-code=\"H2555\">violence</span> through <span class=\"wl wl-kjv\" data-code=\"H6440\">them;</span> and, behold, I will <span class=\"wl wl-kjv\" data-code=\"H7843\">destroy</span> them <span class=\"wl wl-kjv\" data-code=\"H854\">with</span> the earth.","14":"<span class=\"wl wl-kjv\" data-code=\"H6213\">Make</span> thee an <span class=\"wl wl-kjv\" data-code=\"H8392\">ark</span> of <span class=\"wl wl-kjv\" data-code=\"H1613\">gopher</span> <span class=\"wl wl-kjv\" data-code=\"H6086\">wood;</span> <span class=\"wl wl-kjv\" data-code=\"H7064\">rooms</span> shalt thou <span class=\"wl wl-kjv\" data-code=\"H6213\">make</span> <span class=\"wl wl-kjv\" data-code=\"H854\">in</span> the <span class=\"wl wl-kjv\" data-code=\"H8392\">ark,</span> and shalt <span class=\"wl wl-kjv\" data-code=\"H3722\">pitch</span> it <span class=\"wl wl-kjv\" data-code=\"H1004\">within</span> and <span class=\"wl wl-kjv\" data-code=\"H2351\">without</span> with pitch.","15":"And this is the fashion which thou shalt <span class=\"wl wl-kjv\" data-code=\"H6213\">make</span> it of: The <span class=\"wl wl-kjv\" data-code=\"H753\">length</span> of the <span class=\"wl wl-kjv\" data-code=\"H8392\">ark</span> shall be <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> <span class=\"wl wl-kjv\" data-code=\"H520\">cubits,</span> the <span class=\"wl wl-kjv\" data-code=\"H7341\">breadth</span> of it <span class=\"wl wl-kjv\" data-code=\"H2572\">fifty</span> <span class=\"wl wl-kjv\" data-code=\"H520\">cubits,</span> and the <span class=\"wl wl-kjv\" data-code=\"H6967\">height</span> of it <span class=\"wl wl-kjv\" data-code=\"H7970\">thirty</span> cubits.","16":"A <span class=\"wl wl-kjv\" data-code=\"H6672\">window</span> shalt thou <span class=\"wl wl-kjv\" data-code=\"H6213\">make</span> to the <span class=\"wl wl-kjv\" data-code=\"H8392\">ark,</span> and in a <span class=\"wl wl-kjv\" data-code=\"H520\">cubit</span> shalt thou <span class=\"wl wl-kjv\" data-code=\"H3615\">finish</span> it <span class=\"wl wl-kjv\" data-code=\"H4605\">above;</span> and the <span class=\"wl wl-kjv\" data-code=\"H6607\">door</span> of the <span class=\"wl wl-kjv\" data-code=\"H8392\">ark</span> shalt thou <span class=\"wl wl-kjv\" data-code=\"H7760\">set</span> in the side <span class=\"wl wl-kjv\" data-code=\"H6654\">thereof;</span> with <span class=\"wl wl-kjv\" data-code=\"H8482\">lower,</span> <span class=\"wl wl-kjv\" data-code=\"H8145\">second,</span> and <span class=\"wl wl-kjv\" data-code=\"H7992\">third</span> stories shalt thou make","17":"And, <span class=\"wl wl-kjv\" data-code=\"H2009\">behold,</span> <span class=\"wl wl-kjv\" data-code=\"H589\">I,</span> even I, do <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> a <span class=\"wl wl-kjv\" data-code=\"H3999\">flood</span> of <span class=\"wl wl-kjv\" data-code=\"H4325\">waters</span> upon the <span class=\"wl wl-kjv\" data-code=\"H776\">earth,</span> to <span class=\"wl wl-kjv\" data-code=\"H7843\">destroy</span> all <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh,</span> wherein is the <span class=\"wl wl-kjv\" data-code=\"H7307\">breath</span> of <span class=\"wl wl-kjv\" data-code=\"H2416\">life,</span> from <span class=\"wl wl-kjv\" data-code=\"H8478\">under</span> <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven;</span> and every <span class=\"wl wl-kjv\" data-code=\"H3605\">thing</span> that is in the <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> shall die.","18":"But with thee will I <span class=\"wl wl-kjv\" data-code=\"H6965\">establish</span> my <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant;</span> and thou shalt <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> <span class=\"wl wl-kjv\" data-code=\"H413\">into</span> the <span class=\"wl wl-kjv\" data-code=\"H8392\">ark,</span> <span class=\"wl wl-kjv\" data-code=\"H859\">thou,</span> and thy <span class=\"wl wl-kjv\" data-code=\"H1121\">sons,</span> and thy <span class=\"wl wl-kjv\" data-code=\"H802\">wife,</span> and thy <span class=\"wl wl-kjv\" data-code=\"H1121\">sons'</span> wives","19":"And of every living <span class=\"wl wl-kjv\" data-code=\"H2416\">thing</span> of all <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh,</span> <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> of every sort shalt thou <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> into the <span class=\"wl wl-kjv\" data-code=\"H8392\">ark,</span> to keep them <span class=\"wl wl-kjv\" data-code=\"H2421\">alive</span> with thee; they shall be <span class=\"wl wl-kjv\" data-code=\"H2145\">male</span> and female.","20":"Of <span class=\"wl wl-kjv\" data-code=\"H5775\">fowls</span> after their <span class=\"wl wl-kjv\" data-code=\"H4327\">kind,</span> and of <span class=\"wl wl-kjv\" data-code=\"H929\">cattle</span> after their <span class=\"wl wl-kjv\" data-code=\"H4327\">kind,</span> of every creeping <span class=\"wl wl-kjv\" data-code=\"H7431\">thing</span> of the <span class=\"wl wl-kjv\" data-code=\"H127\">earth</span> after his <span class=\"wl wl-kjv\" data-code=\"H4327\">kind,</span> <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> of every sort shall <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> unto thee, to keep them alive.","21":"And <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> thou unto thee of all <span class=\"wl wl-kjv\" data-code=\"H3978\">food</span> that is <span class=\"wl wl-kjv\" data-code=\"H398\">eaten,</span> and thou shalt <span class=\"wl wl-kjv\" data-code=\"H622\">gather</span> it to thee; and it shall be for food","22":"Thus <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> <span class=\"wl wl-kjv\" data-code=\"H5146\">Noah;</span> according to all that <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> him, so did"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"op den aardbodem","tekst":"Hebr. op het aangezicht des aardbodems, dat is op de vlakte des aardbodems."}],"2":[{"catchword":"Gods zonen","tekst":"Dat is, de nakomelingen der gelovige voorvaders, die de ware religie beleden, en met hunne huisgezinnen [als zijnde Gods Kerk] van het ongelovig en vleselijk geslacht der Kaïnieten waren afgescheiden. Gelijk daarentegen door de dochters der mensen meest verstaan worden de nakomelingen van Kaïn, plegende afgoderij, en levende naar het vlees. Zie Deu 14:1; Joh 1:12; Luk 17:27; Jud 1:19."},{"catchword":"schoon waren,","tekst":"Hebr. goed, dat is schoon, alzo onder Gen 24:16, Gen 41:22; Exo 2:2."},{"catchword":"uit allen,","tekst":"Alleenlijk ziende op de uiterlijke schoonheid en wereldse bevalligheid, niet op de ware religie en de vreze des HEEREN, of den wil van hun vrome ouders. Zie onder Gen 26:34-35; Gen 28:8."}],"3":[{"catchword":"Mijn Geest zal niet","tekst":"Dat is, mijn Heilige Geest zal niet langer met deze hardnekkige mensen strijden; te weten, door den mond der overige vromen en bijzonder door Noach. Anders, mijn gemoed [dat is, Ik] zal niet langer beraadslagen [menselijker wijze gezegd] wat Ik met dit boze geslacht zal doen, daar zij zich door geen vermaning noch bestraffing willen verbeteren. Zie 2Pe 2:5."},{"catchword":"in eeuwigheid","tekst":"Dat is, altoos."},{"catchword":"vlees is;","tekst":"Dat is, bedorven; versta niet alleen de kinderen der mensen, maar ook de kinderen Gods. Alzo wordt het woord vlees voor de bedorven natuur des mensen genomen, Joh 3:6; Rom 7:18, Rom 8:7."},{"catchword":"doch zijn dagen","tekst":"Dat is, dezen tijd zal Ik hun nog toestaan tot verbetering, maar daarna mijne straf niet langer uitstellen. Zie 1Pe 3:20."}],"4":[{"catchword":"reuzen","tekst":"Dat is, mensen van langere statuur en meerdere sterkte dan anderen. Zie Num 13:33. Het Hebr. woord komt van vallen, omdat zij, van God afvallig zijnde, de mensen met allerlei wrevel en tirannie overvielen, God noch mensen vrezende; waardoor een ieder, die hen zag, het hart als ontviel. Dit wordt hier ook verhaald als een bijzondere oorzaak van Gods toorn."},{"catchword":"ingegaan","tekst":"Of, gekomen. Hiermede wordt heuselijk en eerbaarlijk bedoeld de bijslaap van man en vrouw. Alzo onder Gen 16:2, Gen 30:3, enz."},{"catchword":"en zich kinderen","tekst":"Of, zo hebben zij hun [te weten haren mannen] kinderen gebaard."},{"catchword":"de geweldigen,","tekst":"Of, machtigen."},{"catchword":"Van ouds","tekst":"Hebr. van eeuwigheid. Zie Jer 2:20."},{"catchword":"mannen van name","tekst":"Dat is, vermaarde, beroemde mannen, die naar het oordeel der wereld grote dingen hadden uitgericht; gelijk integendeel gesproken wordt van mensen van geen naam, Job 30:8."}],"5":[{"catchword":"En de HEERE","tekst":"In dit vs. is begrepen een zeer duidelijke en grondige beschrijving van de erfzonde en derzelver vruchten."}],"6":[{"catchword":"berouwde het den HEERE,","tekst":"Aldus wordt menselijker wijze in de Heilige Schrift van God gesproken, omdat Hij zijn werk of daden verandert, hoewel Hij in zichzelven onveranderlijk blijft; zie het volgende vs. en Num 23:19; 1Sa 15:11, 1Sa 15:29; 2Sa 24:16; Mal 3:6; Jam 1:17; Act 15:18."},{"catchword":"en het smartte Hem aan zijn hart","tekst":"Dit is ook menselijker wijze van God gesproken, om ons te tonen dat God een groot mishagen aan den mens, uit oorzaak zijner boosheid, had. Verg. Isa 63:10; zo wordt ook aan God droefheid toegeschreven, Eph 4:30."}],"7":[{"catchword":"van den aardbodem,","tekst":"Hebr. uitwissen van op het aangezicht des aardbodems."},{"catchword":"het vee,","tekst":"Het Hebr. woord betekent hier niet alleen het tam, maar ook het wild gedierte der aarde. Alzo onder vs.20. Zie boven 1:26."},{"catchword":"het kruipend gedierte,","tekst":"Te weten, wat op de aarde kruipt, en in het water niet leven kan. Zo wordt het Herb.woord genomen boven Gen 1:24-26, Gen 1:28, Gen 1:30."}],"8":[{"catchword":"vond genade","tekst":"Dat is, heeft hem uit genade behaagd, niet uit eigen waardigheid. Zie deze manier van spreken onder Gen 19:19; Exo 33:13, enz."}],"9":[{"catchword":"geboorten van Noach","tekst":"Dat is, geslacht en geschiedenissen, of hetgeen Noach in zijn geslacht wedervaren is; want het Hebr. woord betekent niet alleen afkomst en nakomelingen, maar ook hetgeen dezen bejegent; dat is, inderdaad ene historie of verhaal van iemands zaken. Verg. onder Gen 25:19, Gen 37:2; Num 3:1."},{"catchword":"oprecht","tekst":"Dat is, die in het ware geloof en in de vroomheid des levens, ongeveinsd en zonder valsheid was. Zie onder Gen 17:1, Gen 25:27; Job 1:1."},{"catchword":"geslachten","tekst":"Dat is, onder de mensen, die in zijne eeuw leefden. Alzo onder Gen 7:1."},{"catchword":"wandelde met God","tekst":"Zie boven Gen 5:22."}],"10":[{"catchword":"En Noach gewon","tekst":"Zie boven Gen 5:32."}],"11":[{"catchword":"de aarde was verdorven","tekst":"Versta de mensen, die op de aarde woonden. Zie onder Gen 41:57; 2Sa 15:23; 1Ki 10:24; Eze 14:13."},{"catchword":"voor Gods aangezicht;","tekst":"Dat is, openlijk, stoutelijk, vermetelijk zondigende niet alleen zonder schaamte voor de mensen, maar ook zonder vrees voor God. Zie onder Gen 10:9."}],"12":[{"catchword":"al het vlees","tekst":"Dat is, alle mensen; alzo moet men het woord vlees ook nemen, Isa 40:6; Psa 78:39, en elders."},{"catchword":"zijn weg","tekst":"Dat is, zijn voornemen, zeden, leven en wandel. Alzo Job 23:10; Psa 1:1; Pro 12:25, enz."}],"13":[{"catchword":"Het einde","tekst":"Dat is, de tijd van hun ondergang is aanstaande, gelijk Eze 7:2-3, Eze 7:6; Amo 8:2."},{"catchword":"door hen","tekst":"Hebr. van hun aangezicht, en, met de aarde. Anders, van de aarde."}],"14":[{"catchword":"een ark","tekst":"Een houten overdekt schip, bijna in de gedaante van een kist, bekwaam om te vlotten op het water."},{"catchword":"goferhout;","tekst":"Wat gofer voor een boom of hout geweest is, is onzeker."},{"catchword":"kameren","tekst":"Hebr. nesten."},{"catchword":"pek","tekst":"Het Hebr. woord betekent een zeer taaie, lijmachtige en vasthoudende materie, niet ongelijk aan ons pek."}],"15":[{"catchword":"ellen","tekst":"Of cubieten, of ellebogen. Veler gevoelen is, dat deze maat drieërlei onderscheiden was: De algemene, de heilige, en de geometrische; en dat de algemene zou geweest zijn vijf palmen, houdende elke palm de breedte van vier vingers. De heilige van zes, Eze 40:5 [hoewel enigen menen dat de algemene geweest is zes palmen, de heilige tweemalen zo lang, die gebruikt werd in de heilige gebouwen, als van den tabernakel en van den tempel; maar dat de geometrische zesmalen langer dan de algemene zou geweest zijn, en dat Noach in het timmeren van de ark [zoals enigen menen] de laatste zou gevolgd hebben."}],"16":[{"catchword":"venster","tekst":"Anders, klaar licht, hetwelk door een of meer vensters bekwamelijk in de ark verspreid werd."},{"catchword":"zult haar volmaken","tekst":"Te weten, de ark."},{"catchword":"tot een elle van boven;","tekst":"Sommigen verstaan dit van het deksel der ark, hetwelk aan beide zijden van boven af, op de hoogte van een el, zou afgaan, tot bekwamen afloop van het water."}],"17":[{"catchword":"watervloed","tekst":"Hebr. mabbul, betekende een vallenden en nedervellenden vloed."},{"catchword":"vlees,","tekst":"Der mensen en dieren, uitgenomen de vissen, en al wat in de ark was, zoals volgt."},{"catchword":"geest des levens","tekst":"Anders, levende ziel. Zie boven Gen 1:20."},{"catchword":"den geest geven","tekst":"Hebr. uitademen."}],"18":[{"catchword":"mijn verbond","tekst":"Versta hierdoor, boven het algemene verbond, met alle gelovigen gemaakt, een bijzonder verbond, van Noach te zullen behouden in de ark, mits dat Noach op God zou vertrouwen en hem gehoorzamen."}],"19":[{"catchword":"van al wat leeft,","tekst":"Dat is, van allerlei, levende, aardse dieren."}],"20":[{"catchword":"naar zijn aard","tekst":"Zie boven op vs.7."},{"catc // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};

function concordantieHtml(data) {

    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';

}
function bijbeluitlegHtml(n) {

function paneelInhoud(n, tab) {

  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 2;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
