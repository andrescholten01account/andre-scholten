<style>

oop van twee volle jaren, dat Farao droomde, en zie, hij stond aan de rivier.","2":"En zie, uit de rivier kwamen zeven koeien op, mooi van uiterlijk en vet van vlees, en zij graasden in het gras.","3":"En zie, zeven andere koeien kwamen na die op uit de rivier, lelijk van uiterlijk en mager van vlees; en zij stonden bij de *andere* koeien aan de oever van de rivier.","4":"En die koeien, lelijk van uiterlijk en mager van vlees, aten die zeven koeien op, die mooi van uiterlijk en vet waren. Toen werd Farao wakker.","5":"Daarna sliep hij en droomde opnieuw; en zie, zeven aren kwamen op, aan één halm, vet en goed.","6":"En zie, zeven dunne en door de oostenwind verzengde aren schoten daarna op.","7":"En de dunne aren verslonden de zeven vette en volle aren. Toen werd Farao wakker, en zie, het was een droom.","8":"En het gebeurde 's morgens, dat zijn geest onrustig was, en hij stuurde iemand weg, en riep al de tovenaars van Egypte, en al de wijzen die er waren; en Farao vertelde hun zijn droom; maar er was niemand die hem aan Farao kon uitleggen.","9":"Toen sprak de leider van de schenkers tot Farao: Ik denk vandaag aan mijn zonden.","10":"Farao was zeer toornig op zijn dienaars, en leverde mij in bewaring in het huis van de leider van de lijfwacht, mij en de leider van de bakkers.","11":"En in één nacht droomden wij een droom, ik en hij; wij droomden ieder naar de uitleg van zijn droom.","12":"En daar was bij ons een Hebreeuwse jongeman, een knecht van de leider van de lijfwacht; en wij vertelden ze aan hem, en hij legde ons onze dromen uit; ieder legde hij ze uit, naar zijn droom.","13":"En zoals hij ons uitlegde, zo is het gebeurd; mij heeft hij hersteld in mijn functie, en hem opgehangen.","14":"Toen stuurde Farao iemand en riep Jozef, en zij lieten hem haastig uit de kuil komen; en men schoor hem, en men verwisselde zijn kleren; en hij kwam bij Farao.","15":"En Farao zei tegen Jozef: Ik heb een droom gedroomd, en er is niemand die hem kan uitleggen; maar ik heb van u horen zeggen, dat u een droom kunt horen en die kunt uitleggen.","16":"En Jozef antwoordde Farao: Het is niet aan mij! God zal Farao welzijn aanzeggen.","17":"Toen sprak Farao tot Jozef: Zie, in mijn droom stond ik aan de oever van de rivier;","18":"En zie, uit de rivier kwamen zeven koeien op, vet van vlees en mooi van vorm, en zij graasden in het gras.","19":"En zie, zeven andere koeien kwamen na deze op, mager en zeer lelijk van vorm, schraal van vlees; ik heb zulke lelijkheid nog nooit gezien in heel Egypteland.","20":"En die schrale en lelijke koeien aten die eerste zeven vette koeien op;","21":"Die in hun buik kwamen; maar men merkte niet dat ze in hun buik gekomen waren; want hun uiterlijk was lelijk, net als in het begin. Toen werd ik wakker.","22":"Daarna zag ik in mijn droom, en zie, zeven aren kwamen op, aan één halm, vol en goed.","23":"En zie, zeven verdorde, dunne, en door de oostenwind verzengde aren schoten daarna op;","24":"En de zeven dunne aren verslonden die zeven goede aren. En ik heb het de tovenaars verteld; maar er was niemand die het mij kon verklaren.","25":"Toen zei Jozef tot Farao: De droom van Farao is één; wat God gaat doen, heeft Hij Farao bekendgemaakt.","26":"Die zeven mooie koeien zijn zeven jaren; die zeven mooie aren zijn ook zeven jaren; de droom is één.","27":"En die zeven schrale en lelijke koeien, die daarna opkwamen, zijn zeven jaren; en die zeven lege, door de oostenwind verzengde aren zullen zeven jaren van honger zijn.","28":"Dit is het woord dat ik tot Farao gesproken heb: wat God gaat doen, heeft Hij Farao getoond.","29":"Zie, de zeven aankomende jaren zal er grote overvloed zijn in heel het land van Egypte.","30":"Maar daarna zullen er zeven jaren van honger opstaan; dan zal in het land van Egypte al die overvloed vergeten worden; en de honger zal het land verteren.","31":"Ook zal de overvloed in het land niet gemerkt worden, vanwege die honger die daarna zal komen; want hij zal zeer zwaar zijn.","32":"En dat die droom aan Farao voor de tweede keer herhaald is, komt omdat de zaak door God vast besloten is, en dat God zich haast om dat te doen.","33":"Laat Farao dus nu uitzien naar een verstandig en wijs man, en hem aanstellen over het land van Egypte.","34":"Laat Farao dit doen, en opzieners aanstellen over het land; en het vijfde deel nemen van het land van Egypte in de zeven jaren van overvloed.","35":"En laat men al het voedsel van deze aankomende goede jaren verzamelen, en koren opslaan, onder het gezag van Farao, als voedsel in de steden, en het bewaren.","36":"Zo zal het voedsel als voorraad zijn voor het land, voor de zeven jaren van honger, die in Egypteland zullen zijn; opdat het land niet omkomt door de honger.","37":"En dit woord was goed in de ogen van Farao, en in de ogen van al zijn dienaars.","38":"Toen zei Farao tegen zijn dienaars: Zouden wij wel een man vinden zoals deze, in wie de Geest van God is?","39":"Daarna zei Farao tegen Jozef: Omdat God u dit alles heeft bekendgemaakt, is er niemand zo verstandig en wijs als u.","40":"U zult over mijn huis zijn, en op uw bevel zal heel mijn volk *de* *hand* kussen; alleen door de troon zal ik groter zijn dan u.","41":"Verder zei Farao tegen Jozef: Zie, ik heb u over heel Egypteland gesteld.","42":"En Farao haalde zijn ring van zijn hand af, en deed hem aan Jozefs hand, en liet hem kleren van fijn linnen aantrekken, en legde hem een gouden keten om zijn hals;","43":"En hij liet hem rijden op de tweede wagen die hij had; en zij riepen voor hem uit: Kniel! Zo stelde hij hem over heel Egypteland.","44":"En Farao zei tegen Jozef: Ik ben Farao! Maar zonder u zal niemand zijn hand of zijn voet opheffen in heel Egypteland.","45":"En Farao noemde Jozef Zafnath-Paaneah, en gaf hem Asnath, de dochter van Potifera, priester van On, tot vrouw; en Jozef trok door het land van Egypte.","46":"Jozef nu was dertig jaar oud, toen hij voor Farao, de koning van Egypte, stond; en Jozef ging weg van Farao, en trok door heel Egypteland.","47":"En het land bracht voort, in de zeven jaren van overvloed, bij handenvol.","48":"En hij verzamelde al het voedsel van de zeven jaren die in Egypteland waren, en legde het voedsel op in de steden; het voedsel van het veld rondom elke stad, legde hij daarbinnen op.","49":"Zo bracht Jozef zeer veel koren bijeen, als het zand van de zee, totdat men ophield met tellen; want daarvan was geen getal.","50":"En Jozef werden twee zonen geboren, voordat het jaar van de honger aankwam, die Asnath, de dochter van Potifera, priester van On, hem baarde.","51":"En Jozef noemde de naam van de eerstgeborene Manasse; want, *zei* *hij*, God heeft mij al mijn moeite doen vergeten, en heel het huis van mijn vader.","52":"En de naam van de tweede noemde hij Efraïm; want, *zei* *hij*, God heeft mij vruchtbaar gemaakt in het land van mijn verdrukking.","53":"Toen eindigden de zeven jaren van overvloed, die in Egypte geweest waren.","54":"En de zeven jaren van honger begonnen te komen, zoals Jozef gezegd had. En er was honger in alle landen; maar in heel Egypteland was brood.","55":"Toen heel Egypteland honger had, riep het volk tot Farao om brood; en Farao zei tegen alle Egyptenaren: Ga naar Jozef, doe wat hij u zegt.","56":"Toen er honger was over heel het land, opende Jozef alles waarin *iets* was, en verkocht aan de Egyptenaren; want de honger werd sterk in Egypteland.","57":"En alle landen kwamen naar Egypte, naar Jozef, om te kopen; want de honger was sterk in alle landen."},"SV":{"1":"En het geschiedde ten einde van twee volle jaren, dat Farao droomde, en ziet, hij stond aan de rivier.","2":"En ziet, uit de rivier kwamen op zeven koeien, schoon van aanzien, en vet van vlees, en zij weidden in het gras.","3":"En ziet, zeven andere koeien kwamen na die op uit de rivier, lelijk van aanzien, en dun van vlees; en zij stonden bij *de* *andere* koeien aan den oever der rivier.","4":"En die koeien, lelijk van aanzien, en dun van vlees, aten op die zeven koeien, schoon van aanzien en vet. Toen ontwaakte Farao.","5":"Daarna sliep hij en droomde andermaal; en ziet, zeven aren rezen op, in een halm, vet en goed.","6":"En ziet, zeven dunne en van den oostenwind verzengde aren schoten na dezelve uit.","7":"En de dunne aren verslonden de zeven vette en volle aren. Toen ontwaakte Farao, en ziet, het was een droom.","8":"En het geschiedde in den morgenstond, dat zijn geest verslagen was, en hij zond heen, en riep al de tovenaars van Egypte, en al de wijzen, die daarin waren; en Farao vertelde hun zijn droom; maar er was niemand, die ze aan Farao uitlegde.","9":"Toen sprak de overste der schenkers tot Farao, zeggende: Ik gedenk heden aan mijn zonden.","10":"Farao was zeer vertoornd op zijn dienaars, en leverde mij in bewaring ten huize van den overste der trawanten, mij en den overste der bakkers.","11":"En in een nacht droomden wij een droom, ik en hij; wij droomden elk naar de uitlegging zijns drooms.","12":"En aldaar was bij ons een Hebreeuws jongeling, een knecht van den overste der trawanten; en wij vertelden ze hem, en hij leide ons onze dromen uit; een ieder leide hij ze uit, naar zijn droom.","13":"En gelijk hij ons uitleide, alzo is het geschied; mij heeft hij hersteld in mijn staat, en hem gehangen.","14":"Toen zond Farao en riep Jozef en zij deden hem haastelijk uit den kuil komen; en men schoor hem, en men veranderde zijn klederen; en hij kwam tot Farao.","15":"En Farao sprak tot Jozef: Ik heb een droom gedroomd, en er is niemand, die hem uitlegge; maar ik heb van u horen zeggen, *als* gij een droom hoort, dat gij hem uitlegt.","16":"En Jozef antwoordde Farao, zeggende: Het is buiten mij! God zal Farao’s welstand aanzeggen.","17":"Toen sprak Farao tot Jozef: Zie, in mijn droom stond ik aan den oever der rivier;","18":"En zie, uit de rivier kwamen op zeven koeien, vet van vlees en schoon van gedaante, en zij weidden in het gras.","19":"En zie, zeven andere koeien kwamen op na deze, mager en zeer lelijk van gedaante, rank van vlees; ik heb dergelijke van lelijkheid niet gezien in het ganse Egypteland.","20":"En die ranke en lelijke koeien aten die eerste zeven vette koeien op;","21":"Dewelke in haar buik inkwamen; maar men merkte niet, dat ze in haar buik ingekomen waren; want haar aanzien was lelijk, gelijk als in het begin. Toen ontwaakte ik.","22":"Daarna zag ik in mijn droom, en zie, zeven aren rezen op in een halm, vol en goed.","23":"En zie, zeven dorre, dunne *en* van den oostenwind verzengde aren, schoten na dezelve uit;","24":"En de zeven dunne aren verslonden die zeven goede aren. En ik heb het den tovenaars gezegd; maar er was niemand, die het mij verklaarde.","25":"Toen zeide Jozef tot Farao: De droom van Farao is een; hetgeen God is doende, heeft Hij Farao te kennen gegeven.","26":"Die zeven schone koeien zijn zeven jaren; die zeven schone aren zijn ook zeven jaren; de droom is een.","27":"En die zeven ranke en lelijke koeien, die na gene opkwamen, zijn zeven jaren; en die zeven ranke van den oostenwind verzengde aren zullen zeven jaren des hongers wezen.","28":"Dit is het woord, hetwelk ik tot Farao gesproken heb: hetgeen God is doende, heeft Hij Farao vertoond.","29":"Zie, de zeven aankomende jaren, zal er grote overvloed in het ganse land van Egypte zijn.","30":"Maar na dezelve zullen er opstaan zeven jaren des hongers; dan zal in het land van Egypte al die overvloed vergeten worden; en de honger zal het land verteren.","31":"Ook zal de overvloed in het land niet gemerkt worden, vanwege dienzelven honger, die daarna wezen zal; want hij zal zeer zwaar zijn.","32":"En aangaande, dat die droom aan Farao ten tweeden maal is herhaald, is, omdat de zaak van God vastbesloten is, en dat God haast, om dezelve te doen.","33":"Zo zie nu Farao naar een verstandigen en wijzen man, en zette hem over het land van Egypte.","34":"Farao doe *zo*, en bestelle opzieners over het land; en neme het vijfde deel des lands van Egypte in de zeven jaren des overvloeds.","35":"En dat zij alle spijze van deze aankomende goede jaren verzamelen, en koren opleggen, onder de hand van Farao, tot spijze in de steden, en bewaren het.","36":"Zo zal de spijze zijn tot voorraad voor het land, voor zeven jaren des hongers, die in Egypteland wezen zullen; opdat het land van honger niet verga.","37":"En dit woord was goed in de ogen van Farao, en in de ogen van al zijn knechten.","38":"Zo zeide Farao tot zijn knechten: Zouden wij wel een man vinden als dezen, in welken Gods Geest is?","39":"Daarna zeide Farao tot Jozef: Naardien dat God u dit alles heeft verkondigd, zo is er niemand *zo* verstandig en wijs, als gij.","40":"Gij zult over mijn huis zijn, en op uw bevel zal al mijn volk *de* *hand* kussen; alleen dezen troon zal ik groter zijn dan gij.","41":"Voorts sprak Farao tot Jozef: Zie, ik heb u over gans Egypteland gesteld.","42":"En Farao nam zijn ring van zijn hand af, en deed hem aan Jozefs hand, en liet hem fijne linnen klederen aantrekken, en leide hem een gouden keten aan zijn hals;","43":"En hij deed hem rijden op den tweeden wagen, dien hij had; en zij riepen voor zijn aangezicht: Knielt! Alzo stelde hij hem over gans Egypteland.","44":"En Farao zeide tot Jozef: Ik ben Farao! doch zonder u zal niemand zijn hand of zijn voet opheffen in gans Egypteland.","45":"En Farao noemde Jozefs naam Zafnath Paaneah, en gaf hem Asnath, de dochter van Potifera, overste van On, tot een vrouw; en Jozef toog uit door het land van Egypte.","46":"Jozef nu was dertig jaren oud, als hij stond voor het aangezicht van Farao, koning van Egypte; en Jozef ging uit van Farao’s aangezicht, en hij toog door gans Egypteland.","47":"En het land bracht voort, in de zeven jaren des overvloeds, bij handvollen.","48":"En hij vergaderde alle spijze der zeven jaren, die in Egypteland was, en deed de spijze in de steden; de spijze van het veld van elke stad, hetwelk rondom haar was, deed hij daar binnen.","49":"Alzo bracht Jozef zeer veel koren bijeen, als het zand der zee, totdat men ophield te tellen: want daarvan was geen getal.","50":"En Jozef werden twee zonen geboren, eer er een jaar des hongers aankwam, die Asnath, de dochter van Potifera, overste van On, hem baarde.","51":"En Jozef noemde den naam des eerstgeborenen Manasse; want, *zeide* *hij* God heeft mij doen vergeten al mijn moeite, en het ganse huis mijns vaders.","52":"En den naam des tweeden noemde hij Efraïm; want, *zeide* *hij* God heeft mij doen wassen in het land mijner verdrukking.","53":"Toen eindigden de zeven jaren des overvloeds, die in Egypte geweest was.","54":"En de zeven jaren des hongers begonnen aan te komen, gelijk als Jozef gezegd had. En er was honger in al de landen; maar in gans Egypteland was brood.","55":"Als nu gans Egypteland hongerde, riep het volk tot Farao om brood; en Farao zeide tot alle Egyptenaren: Gaat tot Jozef, doet wat hij u zegt.","56":"Als dan honger over het ganse land was, zo opende Jozef alles, waarin *iets* was, en verkocht aan de Egyptenaren; want de honger werd sterk in Egypteland.","57":"En alle landen kwamen in Egypte tot Jozef, om te kopen; want de honger was sterk in alle landen."},"KJV":{"1":"And it came to pass at the end of two full years, that Pharaoh dreamed: and, behold, he stood by the river.","2":"And, behold, there came up out of the river seven well favoured kine and fatfleshed; and they fed in a meadow.","3":"And, behold, seven other kine came up after them out of the river, ill favoured and leanfleshed; and stood by the *other* kine upon the brink of the river.","4":"And the ill favoured and leanfleshed kine did eat up the seven well favoured and fat kine. So Pharaoh awoke.","5":"And he slept and dreamed the second time: and, behold, seven ears of corn came up upon one stalk, rank and good.","6":"And, behold, seven thin ears and blasted with the east wind sprung up after them.","7":"And the seven thin ears devoured the seven rank and full ears. And Pharaoh awoke, and, behold, *it was* a dream.","8":"And it came to pass in the morning that his spirit was troubled; and he sent and called for all the magicians of Egypt, and all the wise men thereof: and Pharaoh told them his dream; but *there was* none that could interpret them unto Pharaoh.","9":"Then spake the chief butler unto Pharaoh, saying, I do remember my faults this day:","10":"Pharaoh was wroth with his servants, and put me in ward in the captain of the guard's house, *both* me and the chief baker:","11":"And we dreamed a dream in one night, I and he; we dreamed each man according to the interpretation of his dream.","12":"And *there was* there with us a young man, an Hebrew, servant to the captain of the guard; and we told him, and he interpreted to us our dreams; to each man according to his dream he did interpret.","13":"And it came to pass, as he interpreted to us, so it was; me he restored unto mine office, and him he hanged.","14":"Then Pharaoh sent and called Joseph, and they brought him hastily out of the dungeon: and he shaved *himself*, and changed his raiment, and came in unto Pharaoh.","15":"And Pharaoh said unto Joseph, I have dreamed a dream, and *there is* none that can interpret it: and I have heard say of thee, *that* thou canst understand a dream to interpret","16":"And Joseph answered Pharaoh, saying, *It is* not in me: God shall give Pharaoh an answer of peace.","17":"And Pharaoh said unto Joseph, In my dream, behold, I stood upon the bank of the river:","18":"And, behold, there came up out of the river seven kine, fatfleshed and well favoured; and they fed in a meadow:","19":"And, behold, seven other kine came up after them, poor and very ill favoured and leanfleshed, such as I never saw in all the land of Egypt for badness:","20":"And the lean and the ill favoured kine did eat up the first seven fat kine:","21":"And when they had eaten them up, it could not be known that they had eaten them; but they *were* still ill favoured, as at the beginning. So I awoke.","22":"And I saw in my dream, and, behold, seven ears came up in one stalk, full and good:","23":"And, behold, seven ears, withered, thin, *and* blasted with the east wind, sprung up after them:","24":"And the thin ears devoured the seven good ears: and I told *this* unto the magicians; but *there was* none that could declare","25":"And Joseph said unto Pharaoh, The dream of Pharaoh *is* one: God hath shewed Pharaoh what he *is* about to do.","26":"The seven good kine *are* seven years; and the seven good ears *are* seven years: the dream *is* one.","27":"And the seven thin and ill favoured kine that came up after them *are* seven years; and the seven empty ears blasted with the east wind shall be seven years of famine.","28":"This *is* the thing which I have spoken unto Pharaoh: What God *is* about to do he sheweth unto Pharaoh.","29":"Behold, there come seven years of great plenty throughout all the land of Egypt:","30":"And there shall arise after them seven years of famine; and all the plenty shall be forgotten in the land of Egypt; and the famine shall consume the land;","31":"And the plenty shall not be known in the land by reason of that famine following; for it *shall be* very grievous.","32":"And for that the dream was doubled unto Pharaoh twice; *it is* because the thing *is* established by God, and God will shortly bring it to pass.","33":"Now therefore let Pharaoh look out a man discreet and wise, and set him over the land of Egypt.","34":"Let Pharaoh do *this*, and let him appoint officers over the land, and take up the fifth part of the land of Egypt in the seven plenteous years.","35":"And let them gather all the food of those good years that come, and lay up corn under the hand of Pharaoh, and let them keep food in the cities.","36":"And that food shall be for store to the land against the seven years of famine, which shall be in the land of Egypt; that the land perish not through the famine.","37":"And the thing was good in the eyes of Pharaoh, and in the eyes of all his servants.","38":"And Pharaoh said unto his servants, Can we find *such a one* as this *is*, a man in whom the Spirit of God","39":"And Pharaoh said unto Joseph, Forasmuch as God hath shewed thee all this, *there is* none so discreet and wise","40":"Thou shalt be over my house, and according unto thy word shall all my people be ruled: only in the throne will I be greater","41":"And Pharaoh said unto Joseph, See, I have set thee over all the land of Egypt.","42":"And Pharaoh took off his ring from his hand, and put it upon Joseph's hand, and arrayed him in vestures of fine linen, and put a gold chain about his neck;","43":"And he made him to ride in the second chariot which he had; and they cried before him, Bow the knee: and he made him *ruler* over all the land of Egypt.","44":"And Pharaoh said unto Joseph, I *am* Pharaoh, and without thee shall no man lift up his hand or foot in all the land of Egypt.","45":"And Pharaoh called Joseph's name Zaphnathpaaneah; and he gave him to wife Asenath the daughter of Potipherah priest of On. And Joseph went out over *all* the land of Egypt.","46":"And Joseph *was* thirty years old when he stood before Pharaoh king of Egypt. And Joseph went out from the presence of Pharaoh, and went throughout all the land of Egypt.","47":"And in the seven plenteous years the earth brought forth by handfuls.","48":"And he gathered up all the food of the seven years, which were in the land of Egypt, and laid up the food in the cities: the food of the field, which *was* round about every city, laid he up in the same.","49":"And Joseph gathered corn as the sand of the sea, very much, until he left numbering; for *it was* without number.","50":"And unto Joseph were born two sons before the years of famine came, which Asenath the daughter of Potipherah priest of On bare","51":"And Joseph called the name of the firstborn Manasseh: For God, *said he*, hath made me forget all my toil, and all my father's house.","52":"And the name of the second called he Ephraim: For God hath caused me to be fruitful in the land of my affliction.","53":"And the seven years of plenteousness, that was in the land of Egypt, were ended.","54":"And the seven years of dearth began to come, according as Joseph had said: and the dearth was in all lands; but in all the land of Egypt there was bread.","55":"And when all the land of Egypt was famished, the people cried to Pharaoh for bread: and Pharaoh said unto all the Egyptians, Go unto Joseph; what he saith to you, do.","56":"And the famine was over all the face of the earth: And Joseph opened all the storehouses, and sold unto the Egyptians; and the famine waxed sore in the land of Egypt.","57":"And all countries came into Egypt to Joseph for to buy *corn*; because that the famine was *so* sore in all lands."}},"tsk":{"1":[{"kopje":"twee volle jaren","refs":["Gen 29:14"]},{"kopje":"dat Farao","refs":["Gen 20:3","Gen 37:5-10","Gen 40:5","Richt 7:13","Richt 7:14","Est 6:1","Job 33:15","Job 33:16","Dan 2:1-3","Dan 4:5-18","Dan 7:1","Dan 8:27","Matt 27:19"]},{"kopje":"de rivier","refs":["Gen 31:21","Ex 1:22","Ex 4:9","Deut 11:10","Jes 19:5","Ezech 29:3","Ezech 29:9"]}],"2":[{"kopje":"kwamen","refs":["Gen 41:17-27"]},{"kopje":"het gras","refs":["Job 8:11"]}],"3":[{"kopje":"lelijk van uiterlijk","refs":["Gen 41:4","Gen 41:20","Gen 41:21"]}],"4":[{"kopje":"Toen werd Farao wakker","refs":["1 Kon 3:15"]}],"5":[{"kopje":"vet","refs":["Deut 32:14"]}],"6":[{"kopje":"verzengde","refs":["Ezech 17:10","Ezech 19:12","Hos 13:15"]}],"7":[{"kopje":"een droom","refs":["Gen 20:3","Gen 37:5"]}],"8":[{"kopje":"zijn geest","refs":["Gen 40:6","Dan 2:1-3","Dan 4:5","Dan 4:19","Dan 5:6","Dan 7:28","Dan 8:27","Hab 3:16"]},{"kopje":"de tovenaars van Egypte","refs":["Ex 7:11","Ex 7:22","Ex 8:7","Ex 8:18","Ex 8:19","Ex 9:11","Lev 19:31","Lev 20:6","Deut 18:9-14","Jes 8:19","Jes 19:3","Jes 29:14","Jes 47:12","Jes 47:13","Dan 1:20","Dan 2:2","Dan 4:7","Dan 5:7","Dan 5:11","Hand 17:18"]},{"kopje":"de wijzen","refs":["Matt 2:1","Hand 7:22"]},{"kopje":"maar er was niemand","refs":["G nterpreted</span> to us our <span class=\"wl wl-kjv\" data-code=\"H2472\">dreams;</span> to each <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> according to his <span class=\"wl wl-kjv\" data-code=\"H2472\">dream</span> he did interpret.","13":"And it came to pass, as he <span class=\"wl wl-kjv\" data-code=\"H6622\">interpreted</span> to us, so it was; me he <span class=\"wl wl-kjv\" data-code=\"H7725\">restored</span> unto mine <span class=\"wl wl-kjv\" data-code=\"H3653\">office,</span> and him he hanged.","14":"Then <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> and <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> <span class=\"wl wl-kjv\" data-code=\"H3130\">Joseph,</span> and they brought him <span class=\"wl wl-kjv\" data-code=\"H7323\">hastily</span> out of the <span class=\"wl wl-kjv\" data-code=\"H953\">dungeon:</span> and he <span class=\"wl wl-kjv\" data-code=\"H1548\">shaved</span> himself, and <span class=\"wl wl-kjv\" data-code=\"H2498\">changed</span> his <span class=\"wl wl-kjv\" data-code=\"H8071\">raiment,</span> and came <span class=\"wl wl-kjv\" data-code=\"H935\">in</span> unto Pharaoh.","15":"And <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H3130\">Joseph,</span> I have <span class=\"wl wl-kjv\" data-code=\"H2492\">dreamed</span> a <span class=\"wl wl-kjv\" data-code=\"H2472\">dream,</span> and there is none that can <span class=\"wl wl-kjv\" data-code=\"H6622\">interpret</span> it: and I have <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> of thee, that thou canst <span class=\"wl wl-kjv\" data-code=\"H8085\">understand</span> a <span class=\"wl wl-kjv\" data-code=\"H2472\">dream</span> to interpret","16":"And <span class=\"wl wl-kjv\" data-code=\"H3130\">Joseph</span> <span class=\"wl wl-kjv\" data-code=\"H6030\">answered</span> <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> It is not in <span class=\"wl wl-kjv\" data-code=\"H1107\">me:</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> shall <span class=\"wl wl-kjv\" data-code=\"H6030\">give</span> <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh</span> an <span class=\"wl wl-kjv\" data-code=\"H6030\">answer</span> of peace.","17":"And <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H3130\">Joseph,</span> In my <span class=\"wl wl-kjv\" data-code=\"H2472\">dream,</span> behold, I <span class=\"wl wl-kjv\" data-code=\"H5975\">stood</span> upon the <span class=\"wl wl-kjv\" data-code=\"H8193\">bank</span> of the river:","18":"And, behold, there came <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> out of the <span class=\"wl wl-kjv\" data-code=\"H2975\">river</span> <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H6510\">kine,</span> <span class=\"wl wl-kjv\" data-code=\"H1277\">fatfleshed</span> and <span class=\"wl wl-kjv\" data-code=\"H3303\">well</span> <span class=\"wl wl-kjv\" data-code=\"H8389\">favoured;</span> and they <span class=\"wl wl-kjv\" data-code=\"H7462\">fed</span> in a meadow:","19":"And, behold, <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H312\">other</span> <span class=\"wl wl-kjv\" data-code=\"H6510\">kine</span> came <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> after <span class=\"wl wl-kjv\" data-code=\"H310\">them,</span> <span class=\"wl wl-kjv\" data-code=\"H1803\">poor</span> and <span class=\"wl wl-kjv\" data-code=\"H3966\">very</span> <span class=\"wl wl-kjv\" data-code=\"H7451\">ill</span> <span class=\"wl wl-kjv\" data-code=\"H8389\">favoured</span> and <span class=\"wl wl-kjv\" data-code=\"H7534\">leanfleshed,</span> <span class=\"wl wl-kjv\" data-code=\"H2007\">such</span> as I <span class=\"wl wl-kjv\" data-code=\"H3808\">never</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> in all the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt</span> for badness:","20":"And the <span class=\"wl wl-kjv\" data-code=\"H7534\">lean</span> and the ill <span class=\"wl wl-kjv\" data-code=\"H7451\">favoured</span> <span class=\"wl wl-kjv\" data-code=\"H6510\">kine</span> did eat <span class=\"wl wl-kjv\" data-code=\"H398\">up</span> the <span class=\"wl wl-kjv\" data-code=\"H7223\">first</span> <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H1277\">fat</span> kine:","21":"And when they had eaten them <span class=\"wl wl-kjv\" data-code=\"H935\">up,</span> it could not be <span class=\"wl wl-kjv\" data-code=\"H3045\">known</span> that they had eaten <span class=\"wl wl-kjv\" data-code=\"H935\">them;</span> but they were <span class=\"wl wl-kjv\" data-code=\"H4758\">still</span> ill <span class=\"wl wl-kjv\" data-code=\"H7451\">favoured,</span> as at the <span class=\"wl wl-kjv\" data-code=\"H8462\">beginning.</span> So I awoke.","22":"And I <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> in my <span class=\"wl wl-kjv\" data-code=\"H2472\">dream,</span> and, behold, <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H7641\">ears</span> came <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> in <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H7070\">stalk,</span> <span class=\"wl wl-kjv\" data-code=\"H4392\">full</span> and good:","23":"And, behold, <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H7641\">ears,</span> <span class=\"wl wl-kjv\" data-code=\"H6798\">withered,</span> <span class=\"wl wl-kjv\" data-code=\"H1851\">thin,</span> and <span class=\"wl wl-kjv\" data-code=\"H7710\">blasted</span> with the east <span class=\"wl wl-kjv\" data-code=\"H6921\">wind,</span> sprung <span class=\"wl wl-kjv\" data-code=\"H6779\">up</span> after them:","24":"And the <span class=\"wl wl-kjv\" data-code=\"H1851\">thin</span> <span class=\"wl wl-kjv\" data-code=\"H7641\">ears</span> <span class=\"wl wl-kjv\" data-code=\"H1104\">devoured</span> the <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> <span class=\"wl wl-kjv\" data-code=\"H7641\">ears:</span> and I <span class=\"wl wl-kjv\" data-code=\"H559\">told</span> this unto the <span class=\"wl wl-kjv\" data-code=\"H2748\">magicians;</span> but there was none that could declare","25":"And <span class=\"wl wl-kjv\" data-code=\"H3130\">Joseph</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh,</span> The <span class=\"wl wl-kjv\" data-code=\"H2472\">dream</span> of <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh</span> is <span class=\"wl wl-kjv\" data-code=\"H259\">one:</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> hath <span class=\"wl wl-kjv\" data-code=\"H5046\">shewed</span> <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh</span> what he is about to do.","26":"The <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> <span class=\"wl wl-kjv\" data-code=\"H6510\">kine</span> are <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years;</span> and the <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> <span class=\"wl wl-kjv\" data-code=\"H7641\">ears</span> are <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years:</span> the <span class=\"wl wl-kjv\" data-code=\"H2472\">dream</span> is one.","27":"And the <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H7534\">thin</span> and ill <span class=\"wl wl-kjv\" data-code=\"H7451\">favoured</span> <span class=\"wl wl-kjv\" data-code=\"H6510\">kine</span> that came <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> after <span class=\"wl wl-kjv\" data-code=\"H310\">them</span> are <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years;</span> and the <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H7386\">empty</span> <span class=\"wl wl-kjv\" data-code=\"H7641\">ears</span> <span class=\"wl wl-kjv\" data-code=\"H7710\">blasted</span> with the east <span class=\"wl wl-kjv\" data-code=\"H6921\">wind</span> shall be <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> of famine.","28":"This is the <span class=\"wl wl-kjv\" data-code=\"H1697\">thing</span> which I have <span class=\"wl wl-kjv\" data-code=\"H1696\">spoken</span> unto <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh:</span> What <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> is about to <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> he <span class=\"wl wl-kjv\" data-code=\"H7200\">sheweth</span> unto Pharaoh.","29":"Behold, there <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> of <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H7647\">plenty</span> throughout all the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of Egypt:","30":"And there shall <span class=\"wl wl-kjv\" data-code=\"H6965\">arise</span> after <span class=\"wl wl-kjv\" data-code=\"H310\">them</span> <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> of <span class=\"wl wl-kjv\" data-code=\"H7458\">famine;</span> and all the <span class=\"wl wl-kjv\" data-code=\"H7647\">plenty</span> shall be <span class=\"wl wl-kjv\" data-code=\"H7911\">forgotten</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt;</span> and the <span class=\"wl wl-kjv\" data-code=\"H7458\">famine</span> shall <span class=\"wl wl-kjv\" data-code=\"H3615\">consume</span> the land;","31":"And the <span class=\"wl wl-kjv\" data-code=\"H7647\">plenty</span> shall not be <span class=\"wl wl-kjv\" data-code=\"H3045\">known</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> by <span class=\"wl wl-kjv\" data-code=\"H6440\">reason</span> of that <span class=\"wl wl-kjv\" data-code=\"H7458\">famine</span> <span class=\"wl wl-kjv\" data-code=\"H310\">following;</span> for it shall be <span class=\"wl wl-kjv\" data-code=\"H3966\">very</span> grievous.","32":"And for that the <span class=\"wl wl-kjv\" data-code=\"H2472\">dream</span> was <span class=\"wl wl-kjv\" data-code=\"H8138\">doubled</span> unto <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh</span> <span class=\"wl wl-kjv\" data-code=\"H6471\">twice;</span> it is because the <span class=\"wl wl-kjv\" data-code=\"H1697\">thing</span> is <span class=\"wl wl-kjv\" data-code=\"H3559\">established</span> <span class=\"wl wl-kjv\" data-code=\"H5973\">by</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> and <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> will <span class=\"wl wl-kjv\" data-code=\"H4116\">shortly</span> bring it to pass.","33":"Now therefore let <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh</span> look <span class=\"wl wl-kjv\" data-code=\"H7200\">out</span> a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> <span class=\"wl wl-kjv\" data-code=\"H995\">discreet</span> and <span class=\"wl wl-kjv\" data-code=\"H2450\">wise,</span> and <span class=\"wl wl-kjv\" data-code=\"H7896\">set</span> him over the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of Egypt.","34":"Let <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> this, and let him <span class=\"wl wl-kjv\" data-code=\"H6485\">appoint</span> <span class=\"wl wl-kjv\" data-code=\"H6496\">officers</span> over the <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> and take up the fifth <span class=\"wl wl-kjv\" data-code=\"H2567\">part</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt</span> in the <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H7647\">plenteous</span> years.","35":"And let them <span class=\"wl wl-kjv\" data-code=\"H6908\">gather</span> all the <span class=\"wl wl-kjv\" data-code=\"H400\">food</span> of those <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> that <span class=\"wl wl-kjv\" data-code=\"H935\">come,</span> and lay <span class=\"wl wl-kjv\" data-code=\"H6651\">up</span> <span class=\"wl wl-kjv\" data-code=\"H1250\">corn</span> under the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh,</span> and let them <span class=\"wl wl-kjv\" data-code=\"H8104\">keep</span> <span class=\"wl wl-kjv\" data-code=\"H400\">food</span> in the cities.","36":"And that <span class=\"wl wl-kjv\" data-code=\"H400\">food</span> shall be for <span class=\"wl wl-kjv\" data-code=\"H6487\">store</span> to the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> against the <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> of <span class=\"wl wl-kjv\" data-code=\"H7458\">famine,</span> which shall be in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt;</span> that the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> <span class=\"wl wl-kjv\" data-code=\"H3772\">perish</span> not through the famine.","37":"And the <span class=\"wl wl-kjv\" data-code=\"H1697\">thing</span> was <span class=\"wl wl-kjv\" data-code=\"H3190\">good</span> in the <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes</span> of <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh,</span> and in the <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes</span> of all his servants.","38":"And <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto his <span class=\"wl wl-kjv\" data-code=\"H5650\">servants,</span> Can we <span class=\"wl wl-kjv\" data-code=\"H4672\">find</span> such a one as <span class=\"wl wl-kjv\" data-code=\"H2088\">this</span> is, a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> in <span class=\"wl wl-kjv\" data-code=\"H834\">whom</span> the <span class=\"wl wl-kjv\" data-code=\"H7307\">Spirit</span> of God","39":"And <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H3130\">Joseph,</span> <span class=\"wl wl-kjv\" data-code=\"H310\">Forasmuch</span> as <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> hath <span class=\"wl wl-kjv\" data-code=\"H3045\">shewed</span> thee all this, there is none so <span class=\"wl wl-kjv\" data-code=\"H995\">discreet</span> and wise","40":"Thou shalt <span class=\"wl wl-kjv\" data-code=\"H1961\">be</span> over my <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> and according unto thy <span class=\"wl wl-kjv\" data-code=\" =\"H5975\">stood</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt.</span> And <span class=\"wl wl-kjv\" data-code=\"H3130\">Joseph</span> went <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> from the <span class=\"wl wl-kjv\" data-code=\"H6440\">presence</span> of <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh,</span> and went <span class=\"wl wl-kjv\" data-code=\"H5674\">throughout</span> all the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of Egypt.","47":"And in the <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H7647\">plenteous</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> brought <span class=\"wl wl-kjv\" data-code=\"H6213\">forth</span> by handfuls.","48":"And he gathered <span class=\"wl wl-kjv\" data-code=\"H6908\">up</span> all the <span class=\"wl wl-kjv\" data-code=\"H400\">food</span> of the <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years,</span> which were in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> and laid <span class=\"wl wl-kjv\" data-code=\"H5414\">up</span> the <span class=\"wl wl-kjv\" data-code=\"H400\">food</span> in the <span class=\"wl wl-kjv\" data-code=\"H5892\">cities:</span> the <span class=\"wl wl-kjv\" data-code=\"H400\">food</span> of the <span class=\"wl wl-kjv\" data-code=\"H7704\">field,</span> which was round <span class=\"wl wl-kjv\" data-code=\"H5439\">about</span> every <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> laid he <span class=\"wl wl-kjv\" data-code=\"H5414\">up</span> in the same.","49":"And <span class=\"wl wl-kjv\" ata-code=\"H3899\">bread:</span> and <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto all the <span class=\"wl wl-kjv\" data-code=\"H4714\">Egyptians,</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">Go</span> unto <span class=\"wl wl-kjv\" data-code=\"H3130\">Joseph;</span> what he <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> to you, do.","56":"And the <span class=\"wl wl-kjv\" data-code=\"H7458\">famine</span> was over all the <span class=\"wl wl-kjv\" data-code=\"H6440\">face</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">earth:</span> And <span class=\"wl wl-kjv\" data-code=\"H3130\">Joseph</span> <span class=\"wl wl-kjv\" data-code=\"H6605\">opened</span> all the storehouses, and <span class=\"wl wl-kjv\" data-code=\"H7666\">sold</span> unto the <span class=\"wl wl-kjv\" data-code=\"H4714\">Egyptians;</span> and the <span class=\"wl wl-kjv\" data-code=\"H7458\">famine</span> waxed <span class=\"wl wl-kjv\" data-code=\"H2388\">sore</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of Egypt.","57":"And all <span class=\"wl wl-kjv\" data-code=\"H776\">countries</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> into <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt</span> to <span class=\"wl wl-kjv\" data-code=\"H3130\">Joseph</span> for to <span class=\"wl wl-kjv\" data-code=\"H7666\">buy</span> corn; because that the <span class=\"wl wl-kjv\" data-code=\"H7458\">famine</span> was so <span class=\"wl wl-kjv\" data-code=\"H2388\">sore</span> in all lands."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"twee volle","tekst":"Hebr. twee jaren der dagen; dat is, twee volle jaren. Deze manier van spreken wordt ook gevonden 2Sa 14:28, en Jer 28:3. Aldus wordt een maand der dagen genoemd een volle maand; boven, Gen 29:14."},{"catchword":"rivier","tekst":"Versta, de vermaarde rivier, genoemd Nijl, die het land van Egypte door haar jaarlijksen overloop op een bijzondere manier bevochtigt en vruchtbaar maakt. Hierom wordt zij, ten aanzien van haar uitnemendheid, de rivier genoemd, zonder bijvoegsel. Zie Exo 1:22, en Exo 2:3, en Exo 7:24-25; alzo wordt ook de Eufraat, de rivier genoemd zonder bijvoegsel; boven, Gen 31:21."}],"2":[{"catchword":"in het gras","tekst":"Anders, broekland, vochtige weide, meerse."}],"3":[{"catchword":"lelijk van","tekst":"Hebr. kwaad; dat is, ongestalt, mismaakt, van lelijke gedaante, zo ook onder Gen 4:4, Gen 4:20-21. Daarentegen worden de schone, goede genoemd, vs.22, 26."},{"catchword":"aan den oever","tekst":"Hebr. aan de lip."}],"5":[{"catchword":"goed","tekst":"Dat is, schoon, vol, dik."}],"6":[{"catchword":"oostenwind","tekst":"De eigenschap van den oostenwind is de vruchten te verbranden en te verzengen, inzonderheid in die landen. Zie Eze 17:10, en Eze 19:12; Hos 13:15."}],"7":[{"catchword":"volle aren","tekst":"Dat is, vol sap en vochtigheid."},{"catchword":"droom","tekst":"Te weten, niet een natuurlijke, maar een goddelijke droom; van God, en niet uit natuurlijke oorzaken voortkomende. Anders, dit was de droom."}],"8":[{"catchword":"in den","tekst":"Te weten, nadat hij een tijdlang wakker geweest was."},{"catchword":"verslagen was,","tekst":"Zie boven, Gen 40:6."},{"catchword":"de tovenaars","tekst":"Of, sterrenkijkers, tekenbeduiders, of waarzeggers, gelijk zij gewoonlijk ten onrechte genoemd worden. Versta degenen, die met natuurlijke of superstitieuse, ja ook somtijds met duivelse kunsten omgingen, om iets wat verborgen is te voorzeggen of te beduiden, en om wat wonderlijks te bedrijven. Zie van dezen Exo 7:11, en Exo 8:19 en Exo 9:11; Dan 2:2, Dan 2:12."},{"catchword":"de wijzen,","tekst":"Versta, al degenen, die in enige wetenschap of scherpzinnigheid, oordeel of ervarenheid uitstaken; zie Exo 7:11; Dan 2:12."},{"catchword":"Faraö uitlegde.","tekst":"Te weten, de dromen, alhoewel droom voorgaat. Het waren twee dromen, of een dubbele droom."}],"9":[{"catchword":"mijn zonden","tekst":"Die ik tegen den koning voor enigen tijd begaan heb."}],"10":[{"catchword":"Faraö was","tekst":"Dat is de koning; want de naam Faraö is een naam geweest, gemeen aan alle koningen van Egypte; zodat Faraö bij de Egyptenaars zoveel betekende, als wanner wij zeggen de koning, of zijn koninklijke majesteit; of, gelijk men zegt, de keizer, in Duitsland; en Sire, in Frankrijk; zie boven, Gen 12:15."},{"catchword":"overste der trawanten,","tekst":"Zie boven, Gen 37:36."}],"11":[{"catchword":"naar de","tekst":"Zie boven, Gen 40:5."}],"12":[{"catchword":"jongeling,","tekst":"Te weten, van omtrent acht en twintig jaren, gelijk blijkt onder, vs.46."}],"13":[{"catchword":"En gelijk hij","tekst":"Hebr. en het is geschied gelijk hij ons uitgelegd heeft, zo is het geschied."}],"14":[{"catchword":"zij deden","tekst":"Hebr. zij deden hem lopen."},{"catchword":"en men schoor","tekst":"Anders, hij liet zich scheren. Jozef liet zijn haar wassen in de gevangenis tot een teken van droefheid, zie 2Sa 19:24, of naar de gewoonte der gevangenen; maar nu heeft hij zich laten scheren en zijn klederen veranderd, opdat hij niet met een ijselijk en treurig gelaat, met vuile en versleten klederen voor den koning zou verschijnen, hetgeen ongeoorloofd was; zie Est 4:2."}],"16":[{"catchword":"Het is buiten mij","tekst":"Anders, zonder mij zal God enz. of, het is niet in mij. Aldus poogt Jozef met geleefdheid Faraö's ogen, die nu vast op hem zagen, tot God te wenden, van wien de uitlegging der dromen komt. Zie boven, Gen 40:8, en Dan 2:28."},{"catchword":"welstand","tekst":"Hebr. vrede antwoorden; dat is, hetgeen dient tot Faraö's welvaren en rust en dat der zijnen. Zie boven, Gen 37:14."}],"17":[{"catchword":"oever der","tekst":"Hebr. lip."}],"18":[{"catchword":"in het gras","tekst":"Zie boven, vs.2."}],"19":[{"catchword":"lelijk van","tekst":"Hebr. kwaad, alzo in het volgende."},{"catchword":"rank van","tekst":"Anders, ledig, uitgeteerd."}],"21":[{"catchword":"in haar buik inkwamen","tekst":"Hebr. in haar binnenste, of in haar midden."}],"22":[{"catchword":"goed","tekst":"Dat is, schoon, alzo in het volgende."}],"24":[{"catchword":"tovenaars","tekst":"Zie boven, vs.8."}],"25":[{"catchword":"is één","tekst":"Dat is, enerlei, te weten, ten aanzien van de beduiding."},{"catchword":"doende,","tekst":"Dat is, wat Hij doen zal, of, gaat doen. De toekomende dingen worden dikwerf in den tegenwoordigen tijd gesteld, omdat zij bij God zóó zeker zijn, alsof ze reeds geschied waren, gelijk onder, vs.28, en Exo 9:14; Jos 11:6; Mat 24:40, en Mat 26:28."}],"26":[{"catchword":"schone koeien","tekst":"Hebr. goede; zie boven, vs.3."},{"catchword":"zijn zeven jaren;","tekst":"Dat is, betekenen zeven jaren; zie boven, Gen 40:12."}],"27":[{"catchword":"zeven jaren des","tekst":"Dat is, voorbeelden en waartekenen van zeven jaren, waardoor God te verstaan geeft dat Hij in die jaren een duren tijd in het land zenden zal."}],"29":[{"catchword":"overvloed in","tekst":"Hebr. verzaadheid; dat is, van alles, waarmede men zich kan verzadigen en nog veel overhouden."}],"30":[{"catchword":"vergeten worden;","tekst":"Want gewoonlijk, wat uit het oog is, dat gaat ook uit de gedachten des harten; zie vs.31."},{"catchword":"het land verteren","tekst":"Dat is mensen en beesten, die in het land zijn. Zo ook onder, vs.36."}],"31":[{"catchword":"vanwege","tekst":"Hebr. van het aangezicht diens hongers."}],"32":[{"catchword":"ten tweeden","tekst":"Het is aan te merken, dat de herhaling hier betekent de vastigheid van Gods besluit, en de verhaasting der uitvoering."},{"catchword":"van God","tekst":"Hebr. van met, of, bij God. Anders, van Gods wege."},{"catchword":"vast besloten","tekst":"Anders, vastgezet is."}],"34":[{"catchword":"neme het","tekst":"Hebr. hij vijve het land; dat is, hij ontvange het vijfde deel van de vruchten des lands; te weten, voor een billijken prijs, om het naderhand in den tijd des hongers aan de onderdanen weder alzo te verkopen."}],"35":[{"catchword":"alle spijze","tekst":"Dat is, voorraad van landvruchten, die tot spijs konden dienen."},{"catchword":"onder de","tekst":"Op last, macht en beleid; alzo Exo 4:13, en Exo 9:35; Num 7:8, enz."}],"36":[{"catchword":"niet verga","tekst":"Hebr. niet afgesneden, of, uitgeroeid worde."}],"37":[{"catchword":"was goed","tekst":"Dat is, het beviel hem wel; zie boven, Gen 19:8."}],"38":[{"catchword":"Gods geest is?","tekst":"Versta wijsheid en voorzichtigheid, die God door zijn geest dezen man op een bijzondere wijze gegeven heeft. Alzo wrocht God in het hart van Faraö om zijn raad uit te voeren."}],"40":[{"catchword":"mijn huis zijn,","tekst":"Zie boven, Gen 34:19."},{"catchword":"op uw bevel","tekst":"Hebr. op uw, of, naar uw mond. Aldus wordt mond voor bevel genomen; Exo 17:1, en Exo 38:31; Num 3:16, Num 3:39, en Num 4:27, en Num 9:18; Deu 17:10, enz."},{"catchword":"de hand","tekst":"Tot een teken van eerbied en gehoorzaamheid. Het was in dien tijd, als ook nog hedendaags, gebruikelijk, dat de onderdanen de hand aan den mond brachten, of kusten, wanneer enige grote heren hen aanspraken, of hun iets belastten; verg. Job 31:27; Hos 13:2, waar deze manier van spreken voor afgodischen eerbied gebruik wordt; en aldus wordt door kussen ook verstaan een gewillige gehoorzaamheid, gelijk 1Ki 19:18; Psa 2:12. Anders, aan uw mond zal al mijn volk kussen."},{"catchword":"groter zijn","tekst":"Verg. deze manier van spreken met Gen 39:9."}],"41":[{"catchword":"Zie, ik","tekst":"Dat is, merk op en bedenk tot hoe grote eer en macht ik u verheven heb."}],"42":[{"catchword":"deed hem","tekst":"Tot een teken, dat hij hem macht gaf, in zijn naam alles te zegelen."},{"catchword":"fijne linnen","tekst":"Een soort van linnen, of doek, hetwelk bij de Egyptenaars zeer kostelijk, fijn en wit was; zie daarvan Exo 25:4; en Exo 39:27, Exo 39:29; Pro 31:22."}],"43":[{"catchword":"tweeden wagen,","tekst":"De tweede naast den eerste, die van den koning was; tot een teken dat hij naast den koning boven alle heren des lands verheven was; Est 10:3."},{"catchword":"Knielt","tekst":"Sommigen leggen het woord Abrech uit: tedere vader. Tedere, vanwege zijn jonkheid, en vader, vanwege zijn ambt; gelijk de heren des lands worden genoemd vaders des vaderlands."}],"44":[{"catchword":"Ik ben","tekst":"Dat is, ten aanzien van de koninklijke majesteit ben ik boven u. Anderen nemen deze woorden voor een eed, alsof hij zeide: Zo waarachtig als ik koning ben, of, bij mijn koninklijke majesteit zal niemand, enz."},{"catchword":"zijn hand","tekst":"Dat is, iets voornemen of bestaan."}],"45":[{"catchword":"Zafnath Paänéah,","tekst":"Dat is, uitlegger van verborgenheid."},{"catchword":"overste van","tekst":"Het Hebreeuwse woord betekent wel een priester, maar ook in het algemeen een overste in den politieken staat, en een persoon van groot aanzien; zie 2Sa 8:18, en 2Sa 20:26; 1Ch 18:17; Job 12:19. Jozef wordt genoodzaakt door zijn tegenwoordige gelegenheid dit huwelijk te doen, zijnde niettemin de kinderen daarvan door Jakob gerekend voor vaders van twee stammen in Israel; onder Gen 48:16."},{"catchword":"On,","tekst":"De naam van een stad in Egypte."}],"46":[{"catchword":"dertig jaren","tekst":"Hebr. een zoon van dertig jaar."},{"catchword":"hij toog","tekst":"Te weten, om volgens des konings last overal ambtlieden aan te stellen, en korenhuizen te bereiden tegen den aanstaanden duren tijd."}],"47":[{"catchword":"bracht voort,","tekst":"Hebr. maakte."},{"catchword":"bij handvollen","tekst":"Dat is, alsof men van één graan handenvol bekomen had."}],"48":[{"catchword":"alle spijze","tekst":"Dat is, eetbare granen en vruchten; en zo in het volgende. Versta, het vijfde deel; gelijk boven, vs.34."},{"catchword":"daar binnen","tekst":"Hebr. in haar midden."}],"49":[{"catchword":"als het zand","tekst":"Deze manier van spreken betekent een ontallijke hoeveelheid; boven, Gen 22:17; Jdg 7:12; 1Sa 13:5."},{"catchword":"des was","tekst":"Dat is, er was geen tellen aan; zie ook Jdg 6:5; Job 21:33."}],"51":[{"catchword":"Manasse;","tekst":"Hebr. Menasscheh; dat is, die doet vergeten."},{"catchword":"al mijn moeite","tekst":"Dat is, het verdriet en de moeite, die mij zo hier in Egypte, als in mijns vaders huis wedervaren is."}],"52":[{"catchword":"Efraïm;","tekst":"Dat is, dubbele vrucht."},{"catchword":"in het land","tekst":"Dat is, in dit land, waarin ik tevoren verdrukt was."}],"54":[{"catchword":"de landen","tekst":"Te weten, omliggende; zoals Kanaän, Syrië, Arabië; gelijk onder, vs.57."},{"catchword":"brood","tekst":"Dat is, allerlei voorraad van eetbare granen en vruchten."}],"55":[{"catchword":"hongerde,","tekst":"Te weten, wanneer de particuliere voorraad der inwoners op was."}],"56":[{"catchword":"alles waarin","tekst":"Te weten, alle korenhuizen, waarin het koren vergaderd en opgelegd was."}],"57":[{"catchword":"alle landen kwamen","tekst":"Hebr. al het land kwamen; dat is, de inwoners kwamen van alle omliggende landen."},{"catchword":"in alle landen","tekst":"Te weten, die omliggende waren gelijk tevoren."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"And it came to pass, at the end of two full years, [Heb. Two years of days, i.e. two complete years. The same phrase is found likewise 2 Sam. 14. 28. And Jer. 28. 3. So also a month of days doth betoken a full month, above chap. 29. 14.] that Pharao dreamed, and behold he stood by the River. [understand the famous river of Nilus: which moistens and makes fruitful the land of Egypt in a most singular manner, by his yearly over-flowing of it; Therefore in regard of the excellency of it, it is called the River, without any other addition, or apposition. See Exod. 1. 22. And 2. 3. And 7. 24, 25. So also is Euphrates called the River, by way of excellency, without the name added to it, above ch. 31. 21.]"}],"2":[{"catchword":null,"tekst":"And behold , there came up out of the River, seven Cows, fair of aspect, and fat of flesh, and they fed in the grass. [Oth. Brook-land, moist meadow, marshes]"}],"3":[{"catchword":null,"tekst":"And behold, seven other Cows came up after them, out of the River, ugly of aspect, [Heb. Evil, or bad of etc. i.e. ill-favoured, deformed, mishappen; so also below ver. 4. 20, 21. The fair ones on the contrary, are called good, ver. 22. 26.] and thin (or, lean) of flesh; and they stood by (the other) Cows, at the blank [Heb. Lip] of the River."}],"4":[{"catchword":null,"tekst":"And the Cows, ugly of aspect, and thin of flesh, did eaten up the seven Cows, fair of aspect, and fat: then Pharao awaked."}],"5":[{"catchword":null,"tekst":"After that, he slept and dreamt (a) second time, and behold, seven cars arose up in one stalk (or, blade) fat and good [i.e. fair, full, plump]"}],"6":[{"catchword":null,"tekst":"And behold seven thin and by the East-wind blasted (or singed) ears, [the property of the East-wind is, to burn and singe the fruits and grains, especially in those Countries: See Ezech. 17. 10. And 19. 12. Hos. 13. 15.] did shoot forth after them."}],"7":[{"catchword":null,"tekst":"And the thin ears swallowed up the seven fat and full ears: [i.e. full of sap and moisture] then Pharao awaked, and behold, it was a dream. To wit, not a natural, but a divine dream, proceeding from God, and not from any natural causes. Oth. This was the dream.]"}],"8":[{"catchword":null,"tekst":"And it came to pass in the morning, [after he had been roused a while] that his spirit was troubled, [see above ch. 40. On v. 6.] and he sent, and called all the Magicians, [or, Astrologers, Sorcerers, or Sooth-sayers, as commonly they are wrongfully called. Understand such as practiced either meer natural, or superstitious, if not many times Diabolical Arts, to foretell or interpret hidden and abstruse things, and to do several strange seats: of such, see Exod. 7. 11. And 8. 19. & 9. 11. Dan. 2. 2. 10.] of Egypt, and all the wise men, [understand all such, as excelled in any sciences, or a cuteness of wit and Judgement, or much experience. See Exodus 7. 11. Daniel 2. 12.] that were in it: and Pharao told them to Pharao. [them, the dreams namely, though the singular go before; for there were two dreams, or a twofold dream.]"}],"9":[{"catchword":null,"tekst":"Then the chief of the Cup-bearers spoke unto Pharao, saying; I remember my sins too day, [i.e. those which at such a time I committed against the King.]"}],"10":[{"catchword":null,"tekst":"Pharao, [i.e. the King; for the name of Pharao was a name common to all the Kings of Egypt; so that Pharao signified as much with the Egyptians, as when we say, The King, or, his Royal Majesty, or as they say in Germany, The Emperour, and Sire in his Servants, and delivered me into custody, at the house of the chief of the Guard, [See above chap. 37. 36.] me and the chief of the Bakers."}],"11":[{"catchword":null,"tekst":"And in one night we dreamed a dream, I and he: we dreamed, each according to the interpretation of his dream. [See above chap. 40. On verse 5.]"}],"12":[{"catchword":null,"tekst":"And there was with us an Hebrew youth, [viz. of about 28. Years, as appears below, v. 46.] a Servant of the chief of the Guard: and we told them unto him, and he interpreted us our dreams: he interpreted them, unto each according to his dream."}],"13":[{"catchword":null,"tekst":"And even as he interpreted to us, so it came to pass; [Heb. And it came to pass, even as he interpreted unto us, so it came to pass, Psalm 105. 20.] and he hath restored into my estate, and him he hanged."}],"14":[{"catchword":null,"tekst":"Then Pharao sent, and called Joseph, and they made him come hastily [Heb. Run] out of the pit [or, dungeon:] and the cut this hair, [Oth. He caused his hair to be cut. Joseph let his hair grow in prison, in token of sadness. See 2 Sam. 19. 24. Or, after the custom of prisoners; but now he gives way to be trimmed, and to have his apparel changed, not to appear in a ghastly and mournful habit and condition before the King, which was both undecent, and unlawful. See Est. 4. 2.] and they changed his clothes, and he came to Pharao."}],"15":[{"catchword":null,"tekst":"And Pharao spoke to Joseph; I have dreamt a dream, and there is none to interpret it; but I heard say of thee, (when) thou hearest a dream, that thou doest interpret it."}],"16":[{"catchword":null,"tekst":"And Joseph answered Pharao, saying; it is without me: [Oth. Without me God shall, etc. or, it is not in me, Thus Joseph endeavoureth with discretion, to turn away Pharao&acirc;&euro;&trade;s eyes, which now were sixth on him, from thence to God, from whom the interpretation of dreams is to be had. See above chap. 40. 8. And Dan. 2. 28.] God shall declare Pharao&acirc;&euro;&trade;s welfare. [Heb. Answer Pharao&acirc;&euro;&trade;s peace, i.e. that which shall serve to the serve to the peace and welfare of him and his. See above chap. 37. On verse 14.]"}],"17":[{"catchword":null,"tekst":"Then Pharao spoke to Joseph; Behold, in my dream I stood at the bank of the River; [Heb. At the lip, etc.]"}],"18":[{"catchword":null,"tekst":"And behold, there came up out of the River, seven cows, fat of flesh, and fair of feature, and they fed in the grass. [See above verse 2.]"}],"19":[{"catchword":null,"tekst":"And behold , seven other Cows came up after these, lean and very ugly of shape [Heb. ill, or, bad of shape, and so in the sequel.] slender [Oth. Empty, starveling, rascal] of flesh: I have not seen the like for ugliness in all the land of Egypt."}],"20":[{"catchword":null,"tekst":"And those slender and ugly Cows, did eat up the first seven fat Cows."}],"21":[{"catchword":null,"tekst":"Which came into their belly, [Heb. into their inmost, or, into the midst of them] but one perceived not, that they were come into their belly; for their look was ugly, as in the beginning: then I awaked."}],"22":[{"catchword":null,"tekst":"After that, I saw in my dream, and behold, seven ears rose up in one stalk, full and good. [i.e. fair, and so in the sequel.]"}],"23":[{"catchword":null,"tekst":"And behold, seven dry, thin, and of the East-wind blasted (or, singed) ears did shoot up after them:"}],"25":[{"catchword":null,"tekst":"Then said Joseph to Pharao; Pharao&acirc;&euro;&trade;s dream is one; [i.e. of one sort or kind, for matter of interpretation,] that which God is doing, [i.e. that which he shall, or, is about to do. Things to come are often set down in the Present Tense, as now in being, or doing, being as sure with God, as if they were past or done already: as below verse 28. Exod. 9. 14. Jos. 11. 6. Mat. 24. 40. And 26. 28.] he hath made known to Pharao."}],"26":[{"catchword":null,"tekst":"The seven fair [Heb. good, see above on ver. 3.] Cows, are seven years; [i.e. signify seven years. See above chap. 40. On verse 12.] the seven fair ears are likewise seven years; the dream is one."}],"27":[{"catchword":null,"tekst":"And the seven slender and ugly Cows, which came up after those, are seven years; and the seven slender, of the East-wind blasted ears, shall be seven years of famine. [i.e. types and tokens of seven such years to come, whereby God gives us to understand, that in those years he will send a death into the land.]"}],"28":[{"catchword":null,"tekst":"This is the word, which I spoke unto Pharao: that which God is doing, he hath showed to Pharao."}],"29":[{"catchword":null,"tekst":"Behold, for the seven years to come, there shall be great abundance [Heb. satiety, i.e. store of all manner of things, whereby men may satisfy themselves, and much superfluity besides.] in all the land of Egypt."}],"30":[{"catchword":null,"tekst":"But after them, there shall rise up seven years of famine; then all that abundance shall be forgotten in the land of Egypt [for commonly that which is removed from the eye, abides not long in the thoughts of the heart. See ver. 31.] and the famine shall consume the land. [i.e. both men and beasts, that are in the land, so also below ver. 36.]"}],"31":[{"catchword":null,"tekst":"Also the abundance shall not be perceived in the land, by reason of that famine, [Heb. from the face of that famine] that shall be thereafter; for it shall be very grievous."}],"32":[{"catchword":null,"tekst":"And concerning that the same dream is reiterated to Pharao: [it is worth observing, that the Repetition here doth imply and signify the firmness of God&acirc;&euro;&trade;s decree, and Acceleration of the Execution.] it is because the thing is firmly decreed [Oth. For God&acirc;&euro;&trade;s sake, or in God&acirc;&euro;&trade;s behalf] and that God hasteneth to do the same."}],"33":[{"catchword":null,"tekst":"Therefore let Pharao look now for an understanding and wise man: and set him over the land of Egypt."}],"34":[{"catchword":null,"tekst":"Let Pharao do (so), and appoint over-seers over the land; and take the first part of the land of Egypt [Heb. let him five the land, i.e. let him receive the fifth part of the fruit of the land, to wit, at a reasonable rate, to sell it afterwards again to the subjects in the time of death, at a rate proportionable.] in the seven years of abundance."}],"35":[{"catchword":null,"tekst":"And let them gather all food [i.e. all manner of provision the ground affords, which may serve for food] of these approaching good years, and lay up corn, under the hand of Pharao [i.e. by his command, authority, and order. So Exod. 4. 13. And 9. 35. And Num. 7. 8. Etc.] for food in the Cities, and keep it."}],"36":[{"catchword":null,"tekst":"Thus shall the food be for store for the land, for seven years of famine, which shall be in the land of Egypt: that the land perish not of famine. [Heb. be not cut off, or destroyed]"}],"37":[{"catchword":null,"tekst":"And this word was good in the eyes of Pharao, and in the eyes of all his servants. [i.e. they were well pleased with this advise. See above chap. 19. On verse 8.]"}],"38":[{"catchword":null,"tekst":"Then Pharao said to his Servants, should we (be able) to find such a man as this (is) in whom the Spirit of God may be? [i.e. such Wisdom and Providence, as God by his Spirit hath bestowed on this man, in such a singular manner. Thus God wrought and disposed the heart of Pharao, for the executing of his Counsel.]"}],"39":[{"catchword":null,"tekst":"After that, did Pharao say to Joseph; since God hath made all this known unto thee, there is none (so) understanding and wise, as thy self."}],"40":[{"catchword":null,"tekst":"Thou shalt be over my house, [see above chap. 34. On ver. 19.] and on thy command [Heb. on, after, or according to thy mouth. Thus the word mouth is taken for command, Exod. 17. 1. And 38. 21. Num. 3. 16. 39. And chap. 4. 45. And 9. 20. Deut. 17. 10, etc.] all my people shall kiss (the hand;) [in token of reverence and submission. It was the custom then, as it is to this day, in most parts, that the subjects brought the hand to the mouth, or kissed the same, when any great ones spoke unto them, or laid their commands upon them. Compare Job. 31. 27. Hos. 13. 2. Where this phrase is used for an idolatrous exhibition of honour or worship. And thus there is likewise by kissing intimated a willing obedience, as 1 Kings 19. 18. Psalm 2. 12. Oth. At thy mouth shall all my people kiss.] only (in) this Throne shall I be greater than Thou. [Compare this phrase with ch. 36. 9.]"}],"41":[{"catchword":null,"tekst":"Moreover Pharao spoke to Joseph; Behold, I have set thee over all the land of Egypt. [i.e. observe and consider to what dignity and power I have exalted thee]"}],"42":[{"catchword":null,"tekst":"And Pharao took his ring from off his hand, and put it on Joseph&acirc;&euro;&trade;s hand, [in token of empowering him, to seal all things in his name.] and got him to be arrayed in fine linen, [a sort of linen, or cloth, which was very precious among the Egyptians, being very fine and white; see thereof Exod. 25. 4. And 39. 27, 29. Proverbs 31. 22.] and laid a golden chain on his neck."}],"43":[{"catchword":null,"tekst":"And he made him to ride upon the second Chariot which h :[{"catchword":null,"tekst":"And the land brought forth [Heb. made] in the seven years of the abundance, by handfuls. [i.e. as much, as if for one grain, one had gotten whole handfulls.]"}],"48":[{"catchword":null,"tekst":"And he gathered all the food of the seven years, [i.e. all manner of eatable grains and fruits; and so in the sequel. Understand this of the fifth part, as above verse 34.] and put the food into the Cities: the food of the field of every City, which was round about her, he did put within there. [Heb. Into her midst.]"}],"49":[{"catchword":null,"tekst":"Thus Joseph brought together very much Corn, as the sand of the Sea, [this phrase implies an exceeding great quantity, past counting, above chap. 22. 17. Jud. 7. 12. 1 Sam. 13. 5.] until they ceased to tell (or, count); for there was no number. [i.e. it was past numbering. So likewise Jud. 6. 5. Job. 21. 33.]"}],"51":[{"catchword":null,"tekst":"And Joseph called the name of the first-born, Manasse: [Heb. Menasscheh, i.e. making to forget] for, (said he), God hath made me to forget all my toil, and all my fathers house, [ i.e. the vexation and toil and trouble I have been exercised with, as well here in Egypt, as in my father&acirc;&euro;&trade;s house.]"}],"52":[{"catchword":null,"tekst":"And the name of the second, he called Ephraim: [i.e. double fruit.] for, (said he), God hath made me to grow in the land of my oppression. [i.e. in this very land, wherein I have been much opprest before.]"}],"53":[{"catchword":null,"tekst":"Then the seven years of abundance, that had been in the land of Egypt, ended."}],"54":[{"catchword":null,"tekst":"And the seven years of famine began to come on; even as Joseph had said: and there was famine in all countries [viz. lying round about; such as were Canaan, Syria, Arabia, & c. as below verse 57.] but in all the land of Egypt there was bread. [i.e. all manner of eatable grain, and fruits for the food of man.]"}],"55":[{"catchword":null,"tekst":"Now when all the land // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

(function vulNoten() {

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);

});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
