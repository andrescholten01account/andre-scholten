tijd, dat Juda van zijn broers wegtrok, en hij ging naar een man uit Adullam, wiens naam Hira was.","2":"En Juda zag daar de dochter van een Kanaänitische man, wiens naam Sua was; en hij nam haar, en ging tot haar in.","3":"En zij werd zwanger en baarde een zoon, en hij noemde hem Er.","4":"Daarna werd zij opnieuw zwanger, en baarde een zoon, en zij noemde hem Onan.","5":"En zij werd nog een keer zwanger, en baarde een zoon, en noemde hem Sela; en hij was in Chezib, toen zij hem baarde.","6":"Juda nam een vrouw voor Er, zijn eerstgeborene, en haar naam was Thamar.","7":"Maar Er, de eerstgeborene van Juda, was slecht in de ogen van de HEERE; daarom doodde de HEERE hem.","8":"Toen zei Juda tegen Onan: Ga naar de vrouw van uw broer, en trouw met haar volgens het zwagerrecht[1], en verwek voor uw broer nageslacht.","9":"Maar Onan wist dat dit nageslacht niet voor hem zou zijn; en het gebeurde, wanneer hij bij de vrouw van zijn broer inging, dat hij het verspilde op de grond, om zijn broer geen nageslacht te geven.","10":"En het was slecht in de ogen van de HEERE, wat hij deed; daarom doodde Hij ook hem.","11":"Toen zei Juda tegen Thamar, zijn schoondochter: Blijf weduwe in het huis van uw vader, totdat mijn zoon Sela groot wordt; want hij zei: Anders sterft misschien ook deze, net als zijn broers! Zo ging Thamar heen, en bleef in het huis van haar vader.","12":"Toen er veel dagen verstreken waren, stierf de dochter van Sua, de vrouw van Juda; daarna vond Juda troost, en hij ging naar zijn schaapscheerders in Timna, hij en Hira, zijn vriend, de Adullamiet.","13":"En men liet Thamar weten: Zie, uw schoonvader gaat naar Timna om zijn schapen te scheren.","14":"Toen legde zij de kleren van haar weduwschap af, en bedekte zich met een sluier, en wikkelde zich in, en ging bij de ingang van de twee bronnen zitten, die aan de weg naar Timna liggen; want zij had gezien dat Sela groot geworden was, en dat zij hem niet tot vrouw was gegeven.","15":"Toen Juda haar zag, hield hij haar voor een hoer, omdat zij haar gezicht bedekt had.","16":"En hij ging naar haar toe, opzij van de weg, en zei: Kom toch, laat mij bij u ingaan; want hij wist niet dat zij zijn schoondochter was. En zij zei: Wat zult u mij geven, dat u bij mij ingaat?","17":"En hij zei: Ik zal u een geitenbokje uit de kudde sturen. En zij zei: Zult u mij een onderpand geven, totdat u het stuurt?","18":"Toen zei hij: Wat voor onderpand zal ik u geven? En zij zei: Uw zegelring en uw snoer en uw staf, die u in uw hand heeft; dat gaf hij haar, en hij ging bij haar in, en zij werd zwanger van hem.","19":"En zij stond op, en ging weg, en legde haar sluier af, en trok de kleren van haar weduwschap weer aan.","20":"En Juda stuurde het geitenbokje door de hand van zijn vriend, de Adullamiet, om het onderpand uit de hand van de vrouw terug te krijgen; maar hij vond haar niet.","21":"En hij vroeg de mensen van haar plaats: Waar is de hoer, die bij deze twee bronnen aan de weg was? En zij zeiden: Hier is geen hoer geweest.","22":"En hij keerde terug naar Juda, en zei: Ik heb haar niet gevonden; en ook de mensen van die plaats zeiden: Hier is geen hoer geweest.","23":"Toen zei Juda: Laat zij het dan maar houden, anders worden wij misschien nog uitgelachen; zie, ik heb dit bokje gestuurd, maar u hebt haar niet gevonden.","24":"En het gebeurde ongeveer drie maanden later, dat men Juda liet weten: Thamar, uw schoondochter, heeft ontucht bedreven, en zie, zij is zelfs zwanger van die ontucht. Toen zei Juda: Breng haar naar buiten, laat zij verbrand worden!","25":"Toen zij naar buiten werd gebracht, liet zij aan haar schoonvader zeggen: Van de man van wie deze dingen zijn, ben ik zwanger; en zij zei: Herken toch, van wie deze zegelring, en dit snoer, en deze staf zijn.","26":"En Juda herkende ze, en zei: Zij is rechtvaardiger dan ik, omdat ik haar niet aan mijn zoon Sela gegeven heb. En hij had daarna geen gemeenschap meer met haar.","27":"En het gebeurde in de tijd dat zij zou baren, zie, dat er een tweeling in haar buik was.","28":"En het gebeurde, toen zij baarde, dat de één zijn hand naar buiten stak; en de vroedvrouw pakte die, en bond een scharlaken draad om zijn hand, en zei: Deze komt als eerste naar buiten.","29":"Maar het gebeurde, toen hij zijn hand terugtrok, zie, dat zijn broer naar buiten kwam; en zij zei: Hoe bent u doorgebroken? Op u komt de breuk! En men noemde hem Perez.","30":"En daarna kwam zijn broer naar buiten, aan wiens hand de scharlaken draad was; en men noemde hem Zera."},"SV":{"1":"En het geschiedde ten zelven tijde, dat Juda van zijn broederen aftoog, en hij keerde in tot een man van Adullam, wiens naam was Hira.","2":"En Juda zag aldaar de dochter van een Kanaänietisch man, wiens naam was Sua; en hij nam haar, en ging tot haar in.","3":"En zij werd bevrucht, en baarde een zoon, en hij noemde zijn naam Er.","4":"Daarna werd zij weder bevrucht, en baarde een zoon, en zij noemde zijn naam Onan.","5":"En zij voer nog voort, en baarde een zoon, en noemde zijn naam Sela; doch hij was te Chezib, toen zij hem baarde.","6":"Juda nu nam een vrouw voor Er, zijn eerstgeborene, en haar naam was Thamar.","7":"Maar Er, de eerstgeborene van Juda, was kwaad in des HEEREN ogen; daarom doodde hem de HEERE.","8":"Toen zeide Juda tot Onan: Ga in tot uws broeders huisvrouw, en trouw haar in uws broeders naam, en verwek uw broeder zaad.","9":"Doch Onan, wetende, dat dit zaad voor hem niet zoude zijn, zo geschiedde het, als hij tot zijns broeders huisvrouw inging, dat hij het verdierf tegen de aarde, om zijn broeder geen zaad te geven.","10":"En het was kwaad in des HEEREN ogen, wat hij deed; daarom doodde Hij hem ook.","11":"Toen zeide Juda tot Thamar, zijn schoondochter: Blijf weduwe in uws vaders huis, totdat mijn zoon Sela groot wordt; want hij zeide: Dat niet misschien ook deze sterve, gelijk zijn broeders! Zo ging Thamar heen, en bleef in haar vaders huis.","12":"Als nu vele dagen verlopen waren, stierf de dochter van Sua, de huisvrouw van Juda; daarna troostte zich Juda, en ging op tot zijn schaapscheerders naar Timna toe, hij en Hira, zijn vriend, de Adullamiet.","13":"En men gaf Thamar te kennen, zeggende: Zie, uw schoonvader gaat op naar Timna, om zijn schapen te scheren.","14":"Toen leide zij de klederen van haar weduwschap van zich af, en zij bedekte zich met een sluier, en bewond zich, en zette zich aan den ingang der twee fonteinen, die op den weg naar Timna is; want zij zag, dat Sela groot geworden was, en zij hem niet ter vrouw was gegeven.","15":"Als Juda haar zag, zo hield hij haar voor een hoer, overmits zij haar aangezicht bedekt had.","16":"En hij week tot haar naar den weg, en zeide: Kom toch, laat mij tot u ingaan; want hij wist niet, dat zij zijn schoondochter was. En zij zeide: Wat zult gij mij geven, dat gij tot mij ingaat?","17":"En hij zeide: Ik zal u een geitenbok van de kudde zenden. En zij zeide: Zo gij pand zult geven, totdat gij hem zendt.","18":"Toen zeide hij: Wat pand is het, dat ik u geven zal? En zij zeide: Uw zegelring en uw snoer en uw staf, die in uw hand is; hetwelk hij haar gaf, en ging tot haar in; en zij ontving bij hem.","19":"En zij maakte zich op, en ging heen, en leide haar sluier van zich af, en zij trok aan de klederen van haar weduwschap.","20":"En Juda zond den geitenbok door de hand van zijn vriend, den Adullamiet, om het pand uit de hand der vrouw te nemen; maar hij vond haar niet.","21":"En hij vraagde de lieden van haar plaats, zeggende: Waar is de hoer, die bij deze twee fonteinen aan den weg was? En zij zeiden: Hier is geen hoer geweest.","22":"En hij keerde weder tot Juda, en zeide: Ik heb haar niet gevonden; en ook zeiden de lieden van die plaats: Hier is geen hoer geweest.","23":"Toen zeide Juda: Zij neme het voor zich, opdat wij misschien niet tot verachting worden; zie, ik heb dezen bok gezonden; maar gij hebt haar niet gevonden.","24":"En het geschiedde omtrent na drie maanden, dat men Juda te kennen gaf, zeggende: Thamar, uw schoondochter, heeft gehoereerd, en ook zie, zij is zwanger van hoererij. Toen zeide Juda: Breng ze hervoor, dat zij verbrand worde!","25":"Als zij voorgebracht werd, schikte zij tot haar schoonvader, om te zeggen: Bij den man, wiens deze dingen zijn, ben ik zwanger; en zij zeide: Beken toch, wiens deze zegelring, en deze snoeren, en deze staf zijn.","26":"En Juda kende ze, en zeide: Zij is rechtvaardiger dan ik, daarom, omdat ik haar aan mijn zoon Sela niet gegeven heb. En hij bekende haar voortaan niet meer.","27":"En het geschiedde ten tijde, als zij baren zou, ziet, zo waren tweelingen in haar buik.","28":"En het geschiedde, als zij baarde, dat *een* de hand uitgaf; en de vroedvrouw nam dezelve, en zij bond een scharlaken *draad* om zijn hand, zeggende: Deze komt het eerst uit.","29":"Maar het geschiedde, als hij zijn hand weder intoog, ziet, zo kwam zijn broeder uit; en zij zeide: Hoe zijt gij doorgebroken? op u is de breuke! en men noemde zijn naam Perez.","30":"En daarna kwam zijn broeder uit, om wiens hand de scharlaken *draad* was; en men noemde zijn naam Zera."},"KJV":{"1":"And it came to pass at that time, that Judah went down from his brethren, and turned in to a certain Adullamite, whose name *was* Hirah.","2":"And Judah saw there a daughter of a certain Canaanite, whose name *was* Shuah; and he took her, and went in","3":"And she conceived, and bare a son; and he called his name Er.","4":"And she conceived again, and bare a son; and she called his name Onan.","5":"And she yet again conceived, and bare a son; and called his name Shelah: and he was at Chezib, when she bare","6":"And Judah took a wife for Er his firstborn, whose name *was* Tamar.","7":"And Er, Judah's firstborn, was wicked in the sight of the LORD; and the LORD slew","8":"And Judah said unto Onan, Go in unto thy brother's wife, and marry her, and raise up seed to thy brother.","9":"And Onan knew that the seed should not be his; and it came to pass, when he went in unto his brother's wife, that he spilled *it* on the ground, lest that he should give seed to his brother.","10":"And the thing which he did displeased the LORD: wherefore he slew","11":"Then said Judah to Tamar his daughter in law, Remain a widow at thy father's house, till Shelah my son be grown: for he said, Lest peradventure he die also, as his brethren *did*. And Tamar went and dwelt in her father's house.","12":"And in process of time the daughter of Shuah Judah's wife died; and Judah was comforted, and went up unto his sheepshearers to Timnath, he and his friend Hirah the Adullamite.","13":"And it was told Tamar, saying, Behold thy father in law goeth up to Timnath to shear his sheep.","14":"And she put her widow's garments off from her, and covered her with a vail, and wrapped herself, and sat in an open place, which *is* by the way to Timnath; for she saw that Shelah was grown, and she was not given unto him to wife.","15":"When Judah saw her, he thought her *to be* an harlot; because she had covered her face.","16":"And he turned unto her by the way, and said, Go to, I pray thee, let me come in unto thee; (for he knew not that she *was* his daughter in law.) And she said, What wilt thou give me, that thou mayest come in","17":"And he said, I will send *thee* a kid from the flock. And she said, Wilt thou give *me* a pledge, till thou send","18":"And he said, What pledge shall I give thee? And she said, Thy signet, and thy bracelets, and thy staff that *is* in thine hand. And he gave *it* her, and came in unto her, and she conceived","19":"And she arose, and went away, and laid by her vail from her, and put on the garments of her widowhood.","20":"And Judah sent the kid by the hand of his friend the Adullamite, to receive *his* pledge from the woman's hand: but he found her","21":"Then he asked the men of that place, saying, Where *is* the harlot, that *was* openly by the way side? And they said, There was no harlot in this","22":"And he returned to Judah, and said, I cannot find her; and also the men of the place said, *that* there was no harlot","23":"And Judah said, Let her take *it* to her, lest we be shamed: behold, I sent this kid, and thou hast not found","24":"And it came to pass about three months after, that it was told Judah, saying, Tamar thy daughter in law hath played the harlot; and also, behold, she *is* with child by whoredom. And Judah said, Bring her forth, and let her be burnt.","25":"When she *was* brought forth, she sent to her father in law, saying, By the man, whose these *are, am* I with child: and she said, Discern, I pray thee, whose *are* these, the signet, and bracelets, and staff.","26":"And Judah acknowledged *them*, and said, She hath been more righteous than I; because that I gave her not to Shelah my son. And he knew her again","27":"And it came to pass in the time of her travail, that, behold, twins *were* in her womb.","28":"And it came to pass, when she travailed, that *the one* put out *his* hand: and the midwife took and bound upon his hand a scarlet thread, saying, This came out first.","29":"And it came to pass, as he drew back his hand, that, behold, his brother came out: and she said, How hast thou broken forth? *this* breach *be* upon thee: therefore his name was called Pharez.","30":"And afterward came out his brother, that had the scarlet thread upon his hand: and his name was called Zarah."}},"tsk":{"1":[{"kopje":"het gebeurde","refs":["Gen 33:1"]},{"kopje":"wegtrok","refs":["Gen 19:2","Gen 19:3","Richt 4:18","2 Kon 4:8","Spr 9:6","Spr 13:20"]},{"kopje":"Adullam","refs":["Joz 12:15","Joz 15:35","1 Sam 22:1","2 Sam 23:13","Micha 1:15"]}],"2":[{"kopje":"zag","refs":["Gen 3:6","Gen 6:2","Gen 24:3","Gen 34:2","Richt 14:2","Richt 16:1","2 Sam 11:2","2 Kor 6:14"]},{"kopje":"Sua","refs":["Gen 46:12","1 Kron 2:3"]},{"kopje":"nam","refs":["Gen 6:4","Gen 24:3"]}],"3":[{"kopje":"Er","refs":["Gen 46:12","Num 26:19"]}],"4":[{"kopje":"Onan","refs":["Gen 46:12","Num 26:19"]}],"5":[{"kopje":"Sela","refs":["Gen 38:11","Gen 38:26","Gen 46: an> whose these are, am I with <span class=\"wl wl-kjv\" data-code=\"H2030\">child:</span> and she <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H5234\">Discern,</span> I pray thee, whose are these, the <span class=\"wl wl-kjv\" data-code=\"H2858\">signet,</span> and <span class=\"wl wl-kjv\" data-code=\"H6616\">bracelets,</span> and staff.","26":"And <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> <span class=\"wl wl-kjv\" data-code=\"H5234\">acknowledged</span> them, and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> She hath been more <span class=\"wl wl-kjv\" data-code=\"H6663\">righteous</span> than I; because that I <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> her not to <span class=\"wl wl-kjv\" data-code=\"H7956\">Shelah</span> my <span class=\"wl wl-kjv\" data-code=\"H1121\">son.</span> And he knew <span class=\"wl wl-kjv\" data-code=\"H3045\">her</span> again","27":"And it came to pass in the <span class=\"wl wl-kjv\" data-code=\"H6256\">time</span> of her <span class=\"wl wl-kjv\" data-code=\"H3205\">travail,</span> that, behold, <span class=\"wl wl-kjv\" data-code=\"H8380\">twins</span> were in her womb.","28":"And it came to pass, when she <span class=\"wl wl-kjv\" data-code=\"H3205\">travailed,</span> that the one put <span class=\"wl wl-kjv\" data-code=\"H5414\">out</span> his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand:</span> and the <span class=\"wl wl-kjv\" data-code=\"H3205\">midwife</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> and <span class=\"wl wl-kjv\" data-code=\"H7194\">bound</span> upon his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> a scarlet <span class=\"wl wl-kjv\" data-code=\"H8144\">thread,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> This came <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> first.","29":"And it came to pass, as he drew <span class=\"wl wl-kjv\" data-code=\"H7725\">back</span> his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> that, behold, his <span class=\"wl wl-kjv\" data-code=\"H251\">brother</span> came <span class=\"wl wl-kjv\" data-code=\"H3318\">out:</span> and she <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> How hast thou broken <span class=\"wl wl-kjv\" data-code=\"H6555\">forth?</span> this <span class=\"wl wl-kjv\" data-code=\"H6556\">breach</span> be upon thee: therefore his <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> was <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> Pharez.","30":"And <span class=\"wl wl-kjv\" data-code=\"H310\">afterward</span> came <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> his <span class=\"wl wl-kjv\" data-code=\"H251\">brother,</span> that had the scarlet <span class=\"wl wl-kjv\" data-code=\"H8144\">thread</span> upon his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand:</span> and his <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> was <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> Zarah."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"ten zelven","tekst":"Dat is, in dien tijd, toen Jakob uit Mesopotamië wedergekeerd was, en woonde in het land Kanaän. Hier worden vermeld enige dingen, die vóór het verkopen van Jozef, en andere, die daarna geschied zijnp; maar Mozes voegt die tezamen, omdat zij één patriarch aangingen en van zulk een natuur waren, dat zij in één verhaal bekwamelijk konden afgedaan worden."},{"catchword":"Adullam,","tekst":"Adullam was een stadje omtrent Hebron gelegen, dat daarna aan den stam van Juda door het lot gevallen is; Jos 12:15, en Jos 15:35."}],"2":[{"catchword":"hij nam","tekst":"Te weten, tot een vrouw, tegen Gods wil, het goede exempel van zijn voorvaders, en zonder twijfel, buiten, of ook tegen den raad en het goedvinden van zijn vader. Zie dergelijke huwelijken boven, Gen 6:2, Gen 6:4, en Gen 26:34, en Gen 27:46."},{"catchword":"ging tot","tekst":"Zie boven, Gen 6:4."}],"5":[{"catchword":"hij was te","tekst":"Te weten, Juda."},{"catchword":"Chezib","tekst":"De naam van een plaats of stad gelegen in het land Kanaän, en daarna in den stam van Juda, niet ver van Adullam; ok genoemd Aczib; Jos 19:29; Jdg 1:31; Mic 1:14."}],"7":[{"catchword":"kwaad in","tekst":"Dat is, hij mishaagde den Heere; zie boven, Gen 21:11, want hij is genegen geweest en uitgebroken tot grote en grove zonden, die Gods rechtvaardige gramschap tegen hem verwekt hebben; verg. boven, Gen 6:11, en Gen 10:9."},{"catchword":"doodde hem","tekst":"Te weten, op zulk een manier, dat men in zijn dood Gods rechtvaardig oordeel kan opmerken; alzo onder, vs.10."}],"8":[{"catchword":"trouw haar","tekst":"Het Hebr. woord betekent zijns broeders nagelaten vrouw te trouwen, volgens het gebruik van dien tijd, door de wet daarna bevestigd; Deu 25:5-6; Rth 1:11; Mat 22:24, enz."},{"catchword":"verwek uw","tekst":"Want de conditie bij dit huwelijk was, dat de eerstgeboren zoon voor den zoon van den overledene gehouden moest worden."}],"9":[{"catchword":"wetende dat","tekst":"Zie de aantekeningen op het voorgaande vers."},{"catchword":"zaad voor","tekst":"Dat is, zoon. Zie boven, Gen 4:25."},{"catchword":"verdorf","tekst":"Of, schond, stortende dat ter aarde; daar de Hebreeuwse woorden beiden begrijpen. Dit was zoveel alsof hij de vrucht [om zo te spreken] uit het lichaam van de moeder weggerukt en vernield had."}],"10":[{"catchword":"in des HEEREN","tekst":"Dat is, naar Gods oordeel; zie Job 11:4."}],"11":[{"catchword":"Blijf","tekst":"Of, zit, of, blijf zitten; aldus in het volgende."},{"catchword":"totdat mijn","tekst":"Zich gelatende, alsof hij dezen haar dan ten huwelijk wilde geven; maar uit het volgende blijkt dat hij dit niet in den zin had."},{"catchword":"want","tekst":"Anders, maar."},{"catchword":"hij zeide","tekst":"Te weten, bij zichzelven; dat is, hij dacht; zie boven, Gen 20:11."}],"12":[{"catchword":"Als nu","tekst":"Hebr. toen de dagen vermenigvuldigd waren; dat is, toen er een goede tijd gepasseerd en nochtans Sela aan Thamar niet gegeven was."},{"catchword":"troostte","tekst":"Dat is, hij legde zijn rouw af; verg. boven, Gen 37:35."},{"catchword":"zijn schaapscheerders","tekst":"Want in de scheringen was het gebruikelijk gastmalen te houden, en met de vrienden vrolijk te zijn; 1Sa 25:36."},{"catchword":"Timna","tekst":"Een stad niet ver van Adullam gelegen, naderhand aan den stam van Juda ten deel gevallen; Jos 15:57. Men leest ook van een Timna, gelegen in Dan; Jos 19:43."}],"14":[{"catchword":"van haar","tekst":"Want de weduwen waren eenvoudiger en nederiger gekleed dan andere vrouwen."},{"catchword":"bedekte zich","tekst":"Thamar om een oneerbare vrouw te gelijken, versiert zich met een sluier, bewindt en verbergt haar aangezicht, en zit op een algemenen weg, opdat zij, onbekend blijvende, haar schoonvader zou mogen bedriegen; verg. Pro 7:12, en Pro 9:14; Eze 16:24-25."},{"catchword":"twee fonteinen,","tekst":"Of, Enaïm, hetwelk sommigen houden voor den naam van een zekere plaats. Sommigen zetten het over een scheidsweg, genoemd, volgens hun gevoelen: deur der ogen; omdat op een kruisweg de ogen als opengedaan worden, om herwaarts of derwaarts te zien."}],"16":[{"catchword":"weg,","tekst":"Te weten, naar den weg waar zij zat."},{"catchword":"Wat zult","tekst":"Zij eist hoerenloon, niet uit begeerte van gewin, maar om hem namaals daarvan te overtuigen; gelijk blijkt onder, vs.25; en Juda was zo verrukt door de hitte van vleselijken lust, dat hij de stem van zijn schoondochter niet herkende."}],"17":[{"catchword":"Zo gij","tekst":"Versta hierbij: Ik zal u ter wille zijn, indien gij, enz. Anders, zult gij pand geven, totdat gij het zendt?"}],"18":[{"catchword":"snoer","tekst":"Anders, zweetdoek, neusdoek. Het Hebreeuwse woord betekent eigenlijk gedraaid, of, getwijnd garen; en wordt genomen voor snoeren en doeken van zulk garen gemaakt."}],"21":[{"catchword":"haar plaats,","tekst":"Dat is, van de plaats, waaromtrent Thamar gezeten had."},{"catchword":"twee fonteinen","tekst":"Hebr. Enaïm; zie boven, vs.14."}],"23":[{"catchword":"niet tot","tekst":"Dat is, opdat wij naar ons goed te veel vernemende, onze hoererij niet ontdekken, wat ons tot schande zou dienen. Merk dat bij de heidenen en afgodendienaars, zoals de Adullamieten waren, de hoererij voor schande werd gerekend."}],"24":[{"catchword":"Breng ze","tekst":"Te weten, aan de stadspoort, opdat men haar voor de overheid haar proces make als een overspeelster, overmits zij aan mijn zoon Sela beloofd is."},{"catchword":"dat zij","tekst":"Zo was dan het overspel in dien tijd, ook vóór de wet, gehouden voor een doodswaardige misdaad. Zie boven, Gen 20:3, Gen 20:7, Gen 20:9."}],"25":[{"catchword":"zweer","tekst":"Dit is, schoonvader."}],"26":[{"catchword":"Zij is","tekst":"Zijn conscientie wroegt hem, niet alleen omdat hij zijn belofte aan Thamar niet gehouden had [welke reden hier in dit vs. vermeld wordt], maar ook omdat hij met zijn weten hoererij en onwetend bloedschande begaan had."},{"catchword":"hij","tekst":"Hebr. hij voer niet voort om haar te bekennen."},{"catchword":"bekende","tekst":"Zie deze manier van spreken boven, Gen 4:1."}],"28":[{"catchword":"scharlaken","tekst":"Het Hebr. woord betekent eigenlijk zulk een stof, die in de scharlakenrode verf tweemaal ingedoopt is. Zie Exo 25:4, en Lev 14:4, en de aantekeningen."},{"catchword":"Deze komt","tekst":"Omdat zij meende dat deze het eerst zou voortkomen, en alzo de eerstgeborene zijn."}],"29":[{"catchword":"Hoe zijt","tekst":"Dat is, hoe zijt gij vóór uw broeder, die u voor was, doorgedrongen, om ter wereld te komen?"},{"catchword":"op u is","tekst":"Dat is, zij is u toe te schrijven; of, gij hebt ze gemaakt om uw broeder het voordeel der eerstgeboorte, dat hij scheen te hebben, te ontnemen. Anders, hoe hebt gij de scheur over u gescheurd?"},{"catchword":"Perez","tekst":"Hebr. Perets; dat is, doorbreking, scheuring."}],"30":[{"catchword":"Zerah","tekst":"Dat is, opgang, oprijzing. Omdat hij zich het eerst had laten zien, toen hij in de geboorte was."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"And it came to pass at the same time [that is in the time while Jacob returned out of Mesopotamia was dwelling in the land of Canaan for here are mentioned divers things which happened some before some after the selling of Joseph but Moshe joins them together as having relation to one Patriarch and being of that nature that they might conveniently related together ] that Judah went down from his brethren and turned into a man of Adullam [which was a small town about Hebron allotted afterwards the tribe of Judah Jos 12:15 and 15.34 ] whose name was Hira."}],"2":[{"catchword":null,"tekst":"And Judah saw there the daughters of Canaanites man whose name was sua and he look her [viz. to wife against Gods command and the good example of his primogeniture as doubtless also without if not against this fathers advice and consent see of the like matches above chapter 6.2,4 and 26.34 an d27.46] and he went into her [see above chapter 6 on verse 4.]"}],"3":[{"catchword":null,"tekst":"And she conceived and bears a son called Er."}],"4":[{"catchword":null,"tekst":"After that she conceived again and bears a ason called Onan."}],"5":[{"catchword":null,"tekst":"And she continued yet and bear a son and called his name Sela yet he was [viz. Jodah] at Chezib [the name of the place or city in the land of Canaan afterwards in the tribe of Judah not far from Adullam elsewhere called Aczib Jos 19:29 Judah 1.31 Micah 1.14 ] when she bear him."}],"6":[{"catchword":null,"tekst":"Now Judah took a wife for Err his first-born son and her name was Tamar."}],"7":[{"catchword":null,"tekst":"But Err the first born of Judah was evil in the eyes of the LORD [that is he displeased the LORD see above chapter 21 on verse 11 for he was inclined and broke out into very gross and heinous sins which provoked gods just judgment against him compare chapter 6.11 and 10.9] therefore the LORD slew him [viz. in a such manner that by this death the just judgment of God did manifestly appear so below verse 10.]"}],"8":[{"catchword":null,"tekst":"Then said Judah to Onan go to thy own brothers wife and marry her in thy brothers name [the Hebrew word implies to marrty ones deceased brother widow according to the use of that time confirmed afterwards by an express law Deu 25:5,6 Ruth 1.11 Mat 22:24 &c.] and raise seed to thy brother [for the condition of such a marriage was that the first born was to be counted the deceased brothers son.]"}],"9":[{"catchword":null,"tekst":"Yet Onan knowing [ see the notes on the precedent verse ] that this seed [that is son see above chapter 4 on verse 25] should not be for him it happened when he went into his brothers wife that he spoiled it against the ground [or defiled it &c. the Hebrew word signifying both the one and the other this was even as much as if he had in a manner pulled forth the fruit out of the mothers womb and destroyed it ] not to give seed to his brother."}],"10":[{"catchword":null,"tekst":"And it was evil in the eyes of the LORD that did [in the LORDs eyes in the judgment &c. Job 11. On verse 4] therefore the LORD likewise slew him."}],"11":[{"catchword":null,"tekst":"then said Judah to Tamar his brother in-law abide [ or sit or remain sitted or so in the sequel ] widow in thy fathers house until my sons Selah grew up [making shew as if he intended to give her this son also in marriage but what follows it appears he meant no such thing ] for [others but ] he said [viz. by himself that is he thought thus see above chapter 20 verse 11] least perchance this die likewise as his brothers did so Tamar went and abode in her fathers house."}],"12":[{"catchword":null,"tekst":"Now when many days were run by [Heb. When the days were multiplied that is after much time past when nevertheless Selah was not given to Tamar in marriage ] the daughters of Sua Judah&acirc;&euro;&trade;s wife died after that Judah comforted himself [ he gave over his mourning compare above chapter 37 verse 35] and went up to his sheep-shears [for in the sheep shearing time they used to make feasts and to rejoice with friends 1Sa 25:38] untoTimna [a place not far distant from Adullah which fell afterwards to the tribe of Judah Jos 15:57 we read likewise of another Timna in the tribe of Dan Jos 19:43] he and Hira his friend the Adullamite."}],"13":[{"catchword":null,"tekst":"They told Tamar saying behold thy father-in-law goes up to Timna to shear his sheep."}],"14":[{"catchword":null,"tekst":"Then she put off the apparel of the widowhood [for widows went in very sleight and mean habits in comparison of other women and she covered herself with a vial and muffled herself [Tamar the better to resemble a light dishonest woman dresseth distinguisheth and masketh herself in this manner sitting by the high way side that remaining unknown she might allure and beguile her father- in-law compare Prov 7:12 and 9.14 Eze 16:24,25] and sate at the entry of the two fountains [or of Enaim which some do hold for the name of a certain place some render it at the cross way called as they conceived the door of the eyes for that on a cross way called as they conceive the door of the eyes for that on a cross way called as they conceive the door of the eyes for that on a cross way the eyes are opened as it were to look this way and that way [that is upon the way of Timna for she saw that Selah was grown up and she not given to him to wife."}],"15":[{"catchword":null,"tekst":"When Judah saw her and took her and held her for a whore seeing she had covered her face."}],"16":[{"catchword":null,"tekst":"And he turned to her towards the way [viz. where she sates] and said come I pray and let me go unto thee for knew that it was his daughter in law and she said what wilt thou give me to go into me? she demands the hire of the whore not for the gains sake but to have something in hand to conceive him afterwards with as appears below verse 25 and Judah was not transported with the severance of the carnal lust that he knew not the voice of his daughter in law.]"}],"17":[{"catchword":null,"tekst":"And he said I will send thee a kid from the flock and she said if thou wilt give me pledge until you send [understand I shall be ready to yield to thee if so be thou &c. otherwise wilt thou give pledge till thou send?]"}],"18":[{"catchword":null,"tekst":"Then said he what pledge is it that I shall give thee? And she said thy seal ring and thy string [others Kerchief Handkerchief the Hebrew word signifies properly turned or wrested twisted twine yarn and is taken for strings laces and clothes and Kerchiefs made of such twisted threads ] and thy staff that is in thy hands which he gave her and went into her and she conceived by him."}],"19":[{"catchword":null,"tekst":"And she got her up and went her way and put off her vial and she put on the garments of her widowhood."}],"20":[{"catchword":null,"tekst":"And Judah sent the kid by the hand of his friend the Adullamite for to take the pledge out of the woman&acirc;&euro;&trade;s hand but he found her not."}],"21":[{"catchword":null,"tekst":"And he asked the people of her place [that is of the place. place where Tamar sat before] saying; where is the Whore that was by the two fountains, [Heb. By Enaim. See above verse 14. On the way? And they said, Here hath been no whore."}],"22":[{"catchword":null,"tekst":"And he returned to Judah, and said: I have not found her, and also the people of that place said, here hath been no whore."}],"23":[{"catchword":null,"tekst":"Then said Judah, let her take it for herself, lest we perhaps do grow despised. [i.e. lest we being too eager with enquiry for our goods, our committing of whoredom be discovered, which might bring us in disrepute. And it is observable that among the very Heathens and Idolaters, such as were the Adullamites, whoredom was held a vile blemish.] Behold, I have sent this Kid, but thou hast not found her."}],"24":[{"catchword":null,"tekst":"And it fell out about three months after; that they told Judah, Saying; Tamar thy daughter in law hath played the whore; and lo, likewise, she is with child of whoredom: then said Judah; Bring her forth [viz. to the City-gate, to be condemned by the Magistrate there, for an adulteress, as being betrothed to my son Selah.] that she may be burnt. [Then, it seems, Adultery, was even in those times, before the law, held for a transgression worthy of death. See above cha. 20. on verse 3. Item verse 7. And 9.]"}],"25":[{"catchword":null,"tekst":"When she was brought forth, she sent to her father in law, for to say, By the man, whose these things are, am I with child: and she said, acknowledge (I pray) whose this Seal-ring and these strings, and this staff, are."}],"27":[{"catchword":null,"tekst":"and it came to pass on the time when she was in travel; behold, then there were twins in her belly."}],"28":[{"catchword":null,"tekst":"And it happened when she was in delivery, that (one) put forth the hand: and the midwife took it, and she tied a scarlet (thread) [the Hebr. Word properly signifies such stuff, as is twice dip in Scarlet color. See Exod. 25. 4. And Lev. 14. 4. With the Annot.] about his hand, saying; This comes out first. [So she was persuaded he should, and prove the first born.]"}],"29":[{"catchword":null,"tekst":"But it happened, when he drew his hand in again, behold, then this brother came forth: and she said; How didst thou breakthrough? [i.e. how didst thou thrust forward and pass through before thy brother, to come forth into the world?] upon thee the breach is: [i.e. it is to be ascribed or imputed to thee; or, thou hast made it, for to put thy brother back, and to disappoint him of the prerogative of primogeniture, which he seemed to have gotten already. Oth. How didst thou rend the rent over thee?] and they called his name Perez. [Heb. Perets, i.e. a thorow-breach, or rent.]"}],"30":[{"catchword":null,"tekst":"And after that his brother came forth, about whose hand the Scarlet (thread) was: and they called his name, Zerah. [i.e. ascent, or rising up, (as that of the Sun) because he was the first that appeared at their coming forth.]"}]}}};

  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers) => {
    const afk = REFBOEK2AFK[boek];
    return afk ? `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${heel}</a>` : heel;
  });

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
