": "mattheus", "Mark": "markus", "Luk": "lukas", "Joh": "johannes", "Hand": "handelingen", "Rom": "romeinen", "1 Kor": "1-korinthe", "2 Kor": "2-korinthe", "Gal": "galaten", "Ef": "efeze", "Fil": "filippenzen", "Kol": "kolossenzen", "1 Tess": "1-thessalonicenzen", "2 Tess": "2-thessalonicenzen", "1 Tim": "1-timotheus", "2 Tim": "2-timotheus", "Tit": "titus", "Filem": "filemon", "Hebr": "hebreeen", "Jak": "jakobus", "1 Petr": "1-petrus", "2 Petr": "2-petrus", "1 Joh": "1-johannes", "2 Joh": "2-johannes", "3 Joh": "3-johannes", "Judas": "judas", "Openb": "openbaring"}}, "vertalingen": {"SVnu": {"1": "En het gebeurde in die tijd, dat Juda van zijn broers wegtrok, en hij ging naar een man uit Adullam, wiens naam Hira was.", "2": "En Juda zag daar de dochter van een Kanaänitische man, wiens naam Sua was; en hij nam haar, en ging tot haar in.", "3": "En zij werd zwanger en baarde een zoon, en hij noemde hem Er.", "4": "Daarna werd zij opnieuw zwanger, en baarde een zoon, en zij noemde hem Onan.", "5": "En zij werd nog een keer zwanger, en baarde een zoon, en noemde hem Sela; en hij was in Chezib, toen zij hem baarde.", "6": "Juda nam een vrouw voor Er, zijn eerstgeborene, en haar naam was Thamar.", "7": "Maar Er, de eerstgeborene van Juda, was slecht in de ogen van de HEERE; daarom doodde de HEERE hem.", "8": "Toen zei Juda tegen Onan: Ga naar de vrouw van uw broer, en trouw met haar volgens het zwagerrecht[1], en verwek voor uw broer nageslacht.", "9": "Maar Onan wist dat dit nageslacht niet voor hem zou zijn; en het gebeurde, wanneer hij bij de vrouw van zijn broer inging, dat hij het verspilde op de grond, om zijn broer geen nageslacht te geven.", "10": "En het was slecht in de ogen van de HEERE, wat hij deed; daarom doodde Hij ook hem.", "11": "Toen zei Juda tegen Thamar, zijn schoondochter: Blijf weduwe in het huis van uw vader, totdat mijn zoon Sela groot wordt; want hij zei: Anders sterft misschien ook deze, net als zijn broers! Zo ging Thamar heen, en bleef in het huis van haar vader.", "12": "Toen er veel dagen verstreken waren, stierf de dochter van Sua, de vrouw van Juda; daarna vond Juda troost, en hij ging naar zijn schaapscheerders in Timna, hij en Hira, zijn vriend, de Adullamiet.", "13": "En men liet Thamar weten: Zie, uw schoonvader gaat naar Timna om zijn schapen te scheren.", "14": "Toen legde zij de kleren van haar weduwschap af, en bedekte zich met een sluier, en wikkelde zich in, en ging bij de ingang van de twee bronnen zitten, die aan de weg naar Timna liggen; want zij had gezien dat Sela groot geworden was, en dat zij hem niet tot vrouw was gegeven.", "15": "Toen Juda haar zag, hield hij haar voor een hoer, omdat zij haar gezicht bedekt had.", "16": "En hij ging naar haar toe, opzij van de weg, en zei: Kom toch, laat mij bij u ingaan; want hij wist niet dat zij zijn schoondochter was. En zij zei: Wat zult u mij geven, dat u bij mij ingaat?", "17": "En hij zei: Ik zal u een geitenbokje uit de kudde sturen. En zij zei: Zult u mij een onderpand geven, totdat u het stuurt?", "18": "Toen zei hij: Wat voor onderpand zal ik u geven? En zij zei: Uw zegelring en uw snoer en uw staf, die u in uw hand heeft; dat gaf hij haar, en hij ging bij haar in, en zij werd zwanger van hem.", "19": "En zij stond op, en ging weg, en legde haar sluier af, en trok de kleren van haar weduwschap weer aan.", "20": "En Juda stuurde het geitenbokje door de hand van zijn vriend, de Adullamiet, om het onderpand uit de hand van de vrouw terug te krijgen; maar hij vond haar niet.", "21": "En hij vroeg de mensen van haar plaats: Waar is de hoer, die bij deze twee bronnen aan de weg was? En zij zeiden: Hier is geen hoer geweest.", "22": "En hij keerde terug naar Juda, en zei: Ik heb haar niet gevonden; en ook de mensen van die plaats zeiden: Hier is geen hoer geweest.", "23": "Toen zei Juda: Laat zij het dan maar houden, anders worden wij misschien nog uitgelachen; zie, ik heb dit bokje gestuurd, maar u hebt haar niet gevonden.", "24": "En het gebeurde ongeveer drie maanden later, dat men Juda liet weten: Thamar, uw schoondochter, heeft ontucht bedreven, en zie, zij is zelfs zwanger van die ontucht. Toen zei Juda: Breng haar naar buiten, laat zij verbrand worden!", "25": "Toen zij naar buiten werd gebracht, liet zij aan haar schoonvader zeggen: Van de man van wie deze dingen zijn, ben ik zwanger; en zij zei: Herken toch, van wie deze zegelring, en dit snoer, en deze staf zijn.", "26": "En Juda herkende ze, en zei: Zij is rechtvaardiger dan ik, omdat ik haar niet aan mijn zoon Sela gegeven heb. En hij had daarna geen gemeenschap meer met haar.", "27": "En het gebeurde in de tijd dat zij zou baren, zie, dat er een tweeling in haar buik was.", "28": "En het gebeurde, toen zij baarde, dat de één zijn hand naar buiten stak; en de vroedvrouw pakte die, en bond een scharlaken draad om zijn hand, en zei: Deze komt als eerste naar buiten.", "29": "Maar het gebeurde, toen hij zijn hand terugtrok, zie, dat zijn broer naar buiten kwam; en zij zei: Hoe bent u doorgebroken? Op u komt de breuk! En men noemde hem Perez.", "30": "En daarna kwam zijn broer naar buiten, aan wiens hand de scharlaken draad was; en men noemde hem Zera."}, "SV": {"1": "En het geschiedde ten zelven tijde, dat Juda van zijn broederen aftoog, en hij keerde in tot een man van Adullam, wiens naam was Hira.", "2": "En Juda zag aldaar de dochter van een Kanaänietisch man, wiens naam was Sua; en hij nam haar, en ging tot haar in.", "3": "En zij werd bevrucht, en baarde een zoon, en hij noemde zijn naam Er.", "4": "Daarna werd zij weder bevrucht, en baarde een zoon, en zij noemde zijn naam Onan.", "5": "En zij voer nog voort, en baarde een zoon, en noemde zijn naam Sela; doch hij was te Chezib, toen zij hem baarde.", "6": "Juda nu nam een vrouw voor Er, zijn eerstgeborene, en haar naam was Thamar.", "7": "Maar Er, de eerstgeborene van Juda, was kwaad in des HEEREN ogen; daarom doodde hem de HEERE.", "8": "Toen zeide Juda tot Onan: Ga in tot uws broeders huisvrouw, en trouw haar in uws broeders naam, en verwek uw broeder zaad.", "9": "Doch Onan, wetende, dat dit zaad voor hem niet zoude zijn, zo geschiedde het, als hij tot zijns broeders huisvrouw inging, dat hij het verdierf tegen de aarde, om zijn broeder geen zaad te geven.", "10": "En het was kwaad in des HEEREN ogen, wat hij deed; daarom doodde Hij hem ook.", "11": "Toen zeide Juda tot Thamar, zijn schoondochter: Blijf weduwe in uws vaders huis, totdat mijn zoon Sela groot wordt; want hij zeide: Dat niet misschien ook deze sterve, gelijk zijn broeders! Zo ging Thamar heen, en bleef in haar vaders huis.", "12": "Als nu vele dagen verlopen waren, stierf de dochter van Sua, de huisvrouw van Juda; daarna troostte zich Juda, en ging op tot zijn schaapscheerders naar Timna toe, hij en Hira, zijn vriend, de Adullamiet.", "13": "En men gaf Thamar te kennen, zeggende: Zie, uw schoonvader gaat op naar Timna, om zijn schapen te scheren.", "14": "Toen leide zij de klederen van haar weduwschap van zich af, en zij bedekte zich met een sluier, en bewond zich, en zette zich aan den ingang der twee fonteinen, die op den weg naar Timna is; want zij zag, dat Sela groot geworden was, en zij hem niet ter vrouw was gegeven.", "15": "Als Juda haar zag, zo hield hij haar voor een hoer, overmits zij haar aangezicht bedekt had.", "16": "En hij week tot haar naar den weg, en zeide: Kom toch, laat mij tot u ingaan; want hij wist niet, dat zij zijn schoondochter was. En zij zeide: Wat zult gij mij geven, dat gij tot mij ingaat?", "17": "En hij zeide: Ik zal u een geitenbok van de kudde zenden. En zij zeide: Zo gij pand zult geven, totdat gij hem zendt.", "18": "Toen zeide hij: Wat pand is het, dat ik u geven zal? En zij zeide: Uw zegelring en uw snoer en uw staf, die in uw hand is; hetwelk hij haar gaf, en ging tot haar in; en zij ontving bij hem.", "19": "En zij maakte zich op, en ging heen, en leide haar sluier van zich af, en zij trok aan de klederen van haar weduwschap.", "20": "En Juda zond den geitenbok door de hand van zijn vriend, den Adullamiet, om het pand uit de hand der vrouw te nemen; maar hij vond haar niet.", "21": "En hij vraagde de lieden van haar plaats, zeggende: Waar is de hoer, die bij deze twee fonteinen aan den weg was? En zij zeiden: Hier is geen hoer geweest.", "22": "En hij keerde weder tot Juda, en zeide: Ik heb haar niet gevonden; en ook zeiden de lieden van die plaats: Hier is geen hoer geweest.", "23": "Toen zeide Juda: Zij neme het voor zich, opdat wij misschien niet tot verachting worden; zie, ik heb dezen bok gezonden; maar gij hebt haar niet gevonden.", "24": "En het geschiedde omtrent na drie maanden, dat men Juda te kennen gaf, zeggende: Thamar, uw schoondochter, heeft gehoereerd, en ook zie, zij is zwanger van hoererij. Toen zeide Juda: Breng ze hervoor, dat zij verbrand worde!", "25": "Als zij voorgebracht werd, schikte zij tot haar schoonvader, om te zeggen: Bij den man, wiens deze dingen zijn, ben ik zwanger; en zij zeide: Beken toch, wiens deze zegelring, en deze snoeren, en deze staf zijn.", "26": "En Juda kende ze, en zeide: Zij is rechtvaardiger dan ik, daarom, omdat ik haar aan mijn zoon Sela niet gegeven heb. En hij bekende haar voortaan niet meer.", "27": "En het geschiedde ten tijde, als zij baren zou, ziet, zo waren tweelingen in haar buik.", "28": "En het geschiedde, als zij baarde, dat *een* de hand uitgaf; en de vroedvrouw nam dezelve, en zij bond een scharlaken *draad* om zijn hand, zeggende: Deze komt het eerst uit.", "29": "Maar het geschiedde, als hij zijn hand weder intoog, ziet, zo kwam zijn broeder uit; en zij zeide: Hoe zijt gij doorgebroken? op u is de breuke! en men noemde zijn naam Perez.", "30": "En daarna kwam zijn broeder uit, om wiens hand de scharlaken *draad* was; en men noemde zijn naam Zera."}, "KJV": {"1": "And it came to pass at that time, that Judah went down from his brethren, and turned in to a certain Adullamite, whose name *was* Hirah.", "2": "And Judah saw there a daughter of a certain Canaanite, whose name *was* Shuah; and he took her, and went in", "3": "And she conceived, and bare a son; and he called his name Er.", "4": "And she conceived again, and bare a son; and she called his name Onan.", "5": "And she yet again conceived, and bare a son; and called his name Shelah: and he was at Chezib, when she bare", "6": "And Judah took a wife for Er his firstborn, whose name *was* Tamar.", "7": "And Er, Judah's firstborn, was wicked in the sight of the LORD; and the LORD slew", "8": "And Judah said unto Onan, Go in unto thy brother's wife, and marry her, and raise up seed to thy brother.", "9": "And Onan knew that the seed should not be his; and it came to pass, when he went in unto his brother's wife, that he spilled *it* on the ground, lest that he should give seed to his brother.", "10": "And the thing which he did displeased the LORD: wherefore he slew", "11": "Then said Judah to Tamar his daughter in law, Remain a widow at thy father's house, till Shelah my son be grown: for he said, Lest peradventure he die also, as his brethren *did*. And Tamar went and dwelt in her father's house.", "12": "And in process of time the daughter of Shuah Judah's wife died; and Judah was comforted, and went up unto his sheepshearers to Timnath, he and his friend Hirah the Adullamite.", "13": "And it was told Tamar, saying, Behold thy father in law goeth up to Timnath to shear his sheep.", "14": "And she put her widow's garments off from her, and covered her with a vail, and wrapped herself, and sat in an open place, which *is* by the way to Timnath; for she saw that Shelah was grown, and she was not given unto him to wife.", "15": "When Judah saw her, he thought her *to be* an harlot; because she had covered her face.", "16": "And he turned unto her by the way, and said, Go to, I pray thee, let me come in unto thee; (for he knew not that she *was* his daughter in law.) And she said, What wilt thou give me, that thou mayest come in", "17": "And he said, I will send *thee* a kid from the flock. And she said, Wilt thou give *me* a pledge, till thou send", "18": "And he said, What pledge shall I give thee? And she said, Thy signet, and thy bracelets, and thy staff that *is* in thine hand. And he gave *it* her, and came in unto her, and she conceived", "19": "And she arose, and went away, and laid by her vail from her, and put on the garments of her widowhood.", "20": "And Judah sent the kid by the hand of his friend the Adullamite, to receive *his* pledge from the woman's hand: but he found her", "21": "Then he asked the men of that place, saying, Where *is* the harlot, that *was* openly by the way side? And they said, There was no harlot in this", "22": "And he returned to Judah, and said, I cannot find her; and also the men of the place said, *that* there was no harlot", "23": "And Judah said, Let her take *it* to her, lest we be shamed: behold, I sent this kid, and thou hast not found", "24": "And it came to pass about three months after, that it was told Judah, saying, Tamar thy daughter in law hath played the harlot; and also, behold, she *is* with child by whoredom. And Judah said, Bring her forth, and let her be burnt.", "25": "When she *was* brought forth, she sent to her father in law, saying, By the man, whose these *are, am* I with child: and she said, Discern, I pray thee, whose *are* these, the signet, and bracelets, and staff.", "26": "And Judah acknowledged *them*, and said, She hath been more righteous than I; because that I gave her not to Shelah my son. And he knew her again", "27": "And it came to pass in the time of her travail, that, behold, twins *were* in her womb.", "28": "And it came to pass, when she travailed, that *the one* put out *his* hand: and the midwife took and bound upon his hand a scarlet thread, saying, This came out first.", "29": "And it came to pass, as he drew back his hand, that, behold, his brother came out: and she said, How hast thou broken forth? *this* breach *be* upo n 20:3": "Maar God kwam 's nachts in een droom tot Abimelech, en zei tegen hem: Zie, u bent dood vanwege de vrouw die u weggenomen hebt, want zij is met een man getrouwd.", "1 Petr 4:2": "om niet meer naar de begeerten van de mensen, maar naar de wil van God de tijd te leven die nog over is in het vlees.", "Matt 22:24": "En zeiden: Meester! Mozes heeft gezegd: Als iemand sterft zonder kinderen te hebben, zal zijn broer met zijn vrouw trouwen en voor zijn broer nakomelingen verwekken.", "Deut 27:23": "Vervloekt is hij die bij zijn schoonmoeder ligt! En heel het volk zal zeggen: Amen.", "Jak 4:5": "Of denkt u dat de Schrift zomaar zegt: De Geest, Die in ons woont, verlangt vurig naar ons?", "Jer 3:8": "En Ik zag, toen Ik vanwege alles waarin het afgekeerde Israël overspel had gepleegd, haar had weggestuurd en haar een scheidbrief had gegeven, dat de trouweloze Juda, haar zuster, niet vreesde, maar wegging en zelf ook hoereerde.", "Ezech 23:5": "Ohola nu hoereerde, terwijl zij van Mij was; en zij werd verliefd op haar minnaars, op de Assyriërs, die dichtbij waren,", "Gen 38:16-18": "En hij ging naar haar toe, opzij van de weg, en zei: Kom toch, laat mij bij u ingaan; want hij wist niet dat zij zijn schoondochter was. En zij zei: Wat zult u mij geven, dat u bij mij ingaat? En hij zei: Ik zal u een geitenbokje uit de kudde sturen. En zij zei: Zult u mij een onderpand geven, totdat u het stuurt? Toen zei hij: Wat voor onderpand zal ik u geven? En zij zei: Uw zegelring en uw snoer en uw staf, die u in uw hand heeft; dat gaf hij haar, en hij ging bij haar in, en zij werd zwanger van hem.", "1 Tim 6:10": "Want de geldzucht is een wortel van alle kwaad; sommigen hebben daarnaar verlangd en zijn van het geloof afgedwaald, en hebben zichzelf met veel smarten doorstoken.", "Gen 37:32": "En zij zonden de veelkleurige rok en lieten hem naar hun vader brengen, en zeiden: Dit hebben wij gevonden; herken toch of dit de rok van uw zoon is, of niet.", "Hab 1:13": "U bent te rein van ogen om het kwade te zien, en de kwelling kunt U niet aanschouwen; waarom zou U aanschouwen wie trouweloos handelen? Waarom zou U zwijgen, als de goddeloze verslindt wie rechtvaardiger is dan hij?", "Gen 37:33": "En hij herkende hem en zei: Het is de rok van mijn zoon! Een wild dier heeft hem opgegeten! Jozef is voorzeker verscheurd!", "1 Kron 2:6": "En de kinderen van Zerah waren Zimri, en Ethan, en Heman, en Chalcol, en Dara. Deze allen zijn vijf.", "Jer 29:22": "En van hen zal een vloek genomen worden bij al de gevankelijk weggevoerden van Juda die in Babel zijn, zodat men zegt: De HEERE stelt u als Zedekia en als Achab, die de koning van Babel aan het vuur heeft geroosterd;", "Hagg 1:13": "Toen sprak Haggai, de bode van de HEERE, in de boodschap van de HEERE, tot het volk, en hij zei: Ik ben met u, spreekt de HEERE.", "2 Sam 11:2": "Zo gebeurde het tegen de avondtijd, dat David van zijn bed opstond, en wandelde op het dak van het koningshuis, en zag van het dak een vrouw die zich waste; deze vrouw nu was zeer schoon van uiterlijk.", "Gen 38:12-17": "Toen er veel dagen verstreken waren, stierf de dochter van Sua, de vrouw van Juda; daarna vond Juda troost, en hij ging naar zijn schaapscheerders in Timna, hij en Hira, zijn vriend, de Adullamiet. En men liet Thamar weten: Zie, uw schoonvader gaat naar Timna om zijn schapen te scheren. Toen legde zij de kleren van haar weduwschap af, en bedekte zich met een sluier, en wikkelde zich in, en ging bij de ingang van de twee bronnen zitten, die aan de weg naar Timna liggen; want zij had gezien dat Sela groot geworden was, en dat zij hem niet tot vrouw was gegeven.", "Joz 19:43": "En Elon, en Timnatha, en Ekron,", "2 Kron 33:6": "En hij deed zijn zonen door het vuur gaan, in het dal van de zoon van Hinnom, en pleegde toverij, en gaf op vogelgeschrei acht, en toverde, en hij stelde waarzeggers en duivelskunstenaars aan; en hij deed zeer veel kwaads in de ogen van de HEERE, om Hem tot toorn te verwekken.", "Gen 21:21": "En hij woonde in de woestijn Paran; en zijn moeder nam voor hem een vrouw uit Egypteland.", "2 Sam 20:3": "Toen nu David in zijn huis te Jeruzalem kwam, nam de koning de tien vrouwen, zijn bijvrouwen, die hij achtergelaten had om het huis te bewaken, en bracht ze in een huis van bewaring, en onderhield ze, maar ging niet bij hen naar binnen. En zij bleven opgesloten tot de dag van hun dood, levend als weduwen.", "Ezech 23:44": "En men ging tot haar in, zoals men ingaat tot een vrouw die een hoer is; zo gingen zij in tot Ohola en tot Oholiba, die schandelijke vrouwen.", "Ezech 16:25": "Aan elk hoofd van de weg hebt u uw hoge plaatsen gebouwd, en hebt uw schoonheid tot iets afschuwelijks gemaakt, en hebt uw benen gespreid voor ieder die voorbijkwam, en hebt uw hoererijen vermeerderd.", "Gal 5:19": "De werken van het vlees nu zijn openbaar; dat zijn: overspel, hoererij, onreinheid, losbandigheid,", "Richt 14:2": "Zo ging hij naar boven en vertelde het zijn vader en zijn moeder, en zei: Ik heb een vrouw gezien te Thimnath, uit de dochters van de Filistijnen; nu dan, neem die voor mij tot vrouw.", "2 Sam 12:9": "Waarom hebt u dan het woord van de HEERE veracht, door te doen wat kwaad is in Zijn ogen? U hebt Uria, de Hethiet, met het zwaard verslagen, en zijn vrouw hebt u tot uw vrouw genomen; en hem hebt u met het zwaard van de kinderen van Ammon gedood.", "Hos 2:4": "Want hun moeder hoereert, zij die hen ontvangen heeft, handelt schandelijk; want zij zegt: Ik zal mijn minnaars nagaan, die mij mijn brood en mijn water, mijn wol en mijn vlas, mijn olie en mijn drank geven.", "Ruth 1:11": "Maar Naomi zei: Keer terug, mijn dochters! Waarom zouden jullie met mij meegaan? Heb ik nog zonen in mijn schoot, die jullie tot mannen zouden kunnen zijn?", "Gen 38:8-10": "Toen zei Juda tegen Onan: Ga naar de vrouw van uw broer, en trouw met haar volgens het zwagerrecht, en verwek voor uw broer nageslacht. Maar Onan wist dat dit nageslacht niet voor hem zou zijn; en het gebeurde, wanneer hij bij de vrouw van zijn broer inging, dat hij het verspilde op de grond, om zijn broer geen nageslacht te geven. En het was slecht in de ogen van de HEERE, wat hij deed; daarom doodde Hij ook hem.", "2 Sam 13:39": "Toen verlangde de ziel van koning David er zeer naar om naar Absalom uit te gaan; want hij had zich getroost over Amnon, omdat die dood was.", "2 Sam 14:2": "Zo zond Joab iemand naar Thekoa, en liet vandaar een wijze vrouw halen; en hij zei tegen haar: Doe toch alsof u rouw draagt, en trek nu rouwkleren aan, en zalf u niet met olie, en wees als een vrouw die al veel dagen rouw heeft gedragen over een dode;", "Gen 20:7": "Geef dan nu de vrouw van deze man terug, want hij is een profeet, en hij zal voor u bidden, zodat u blijft leven; maar als u haar niet teruggeeft, weet dan dat u zeker sterven zult, u en al wat van u is!", "Gen 24:3": "opdat ik u laat zweren bij de HEERE, de God van de hemel en de God van de aarde, dat u voor mijn zoon geen vrouw zult nemen van de dochters van de Kanaänieten, in het midden van wie ik woon;", "Joz 15:37": "Zenan, en Hadasa, en Migdal-gad,", "1 Kron 21:7": "En deze zaak was kwaad in de ogen van God; daarom sloeg Hij Israël.", "Deut 22:13-29": "Wanneer een man een vrouw genomen heeft, en tot haar ingegaan is, en haar dan haat, En haar oorzaak geeft tot naspraak, en een kwade naam over haar verspreidt, en zegt: Deze vrouw heb ik genomen, en toen ik tot haar naderde, heb ik haar maagdelijkheid niet gevonden; Dan zullen de vader van deze jonge dochter en haar moeder haar meenemen, en naar de oudsten van de stad brengen, bij de poort, met het bewijs van de maagdelijkheid van deze jonge vrouw.", "Spr 6:33": "plaag en schande zal hij vinden, en zijn smaad zal niet uitgewist worden.", "Gen 38:1-6": "En het gebeurde in die tijd, dat Juda van zijn broers wegtrok, en hij ging naar een man uit Adullam, wiens naam Hira was. En Juda zag daar de dochter van een Kanaänitische man, wiens naam Sua was; en hij nam haar, en ging tot haar in. En zij werd zwanger en baarde een zoon, en hij noemde hem Er.", "Jer 3:2": "Sla uw ogen op naar de hoge plaatsen, en zie toe: waar bent u niet beslapen? U hebt voor hen gezeten langs de wegen, als een Arabier in de woestijn; zo hebt u het land ontheiligd met uw hoererijen en met uw slechtheid.", "Gen 38:12-14": "Toen er veel dagen verstreken waren, stierf de dochter van Sua, de vrouw van Juda; daarna vond Juda troost, en hij ging naar zijn schaapscheerders in Timna, hij en Hira, zijn vriend, de Adullamiet. En men liet Thamar weten: Zie, uw schoonvader gaat naar Timna om zijn schapen te scheren. Toen legde zij de kleren van haar weduwschap af, en bedekte zich met een sluier, en wikkelde zich in, en ging bij de ingang van de twee bronnen zitten, die aan de weg naar Timna liggen; want zij had gezien dat Sela groot geworden was, en dat zij hem niet tot vrouw was gegeven.", "2 Sam 13:3": "Maar Amnon had een vriend, wiens naam Jonadab was, een zoon van Simea, Davids broer; en Jonadab was een zeer sluwe man.", "Matt 26:15": "en zei: Wat wilt u mij geven, en ik zal Hem aan u overleveren? En zij hebben hem dertig zilveren munten toegezegd.", "Luk 3:33": "de zoon van Aminadab, de zoon van Aram, de zoon van Esrom, de zoon van Fares, de zoon van Juda,", "Dan 3:6": "En wie niet neervalt en aanbidt, die zal op datzelfde moment in het midden van de brandende vuuroven geworpen worden.", "1 Sam 22:1": "Toen ging David vandaar weg, en ontkwam naar de spelonk van Adullam. En zijn broers hoorden het, en het hele huis van zijn vader, en ze kwamen daarheen naar hem toe.", "Spr 14:32": "De goddeloze zal weggedreven worden in zijn kwaad; maar de rechtvaardige vertrouwt zelfs in zijn dood.", "Gen 26:11": "En Abimelech gebood het hele volk: Wie deze man of zijn vrouw aanraakt, zal zeker gedood worden!", "Gal 5:21": "Afgunst, moord, dronkenschappen, uitspattingen, en dergelijke; waarvan ik u van tevoren zeg, zoals ik ook eerder gezegd heb, dat wie zulke dingen doen, het Koninkrijk van God niet zullen beërven.", "Lev 20:10-12": "Een man ook, die met de vrouw van een ander overspel doet, omdat hij overspel doet met de vrouw van zijn naaste, zal zeker gedood worden, de overspeler en de overspeelster. En een man, die gemeenschap heeft met de vrouw van zijn vader, heeft de schaamte van zijn vader ontdekt; zij beiden zullen zeker gedood worden; hun bloed is op hen! Ook als de man gemeenschap heeft met de vrouw van zijn zoon, zullen zij beiden zeker gedood worden; zij hebben een gruwelijke vermenging gedaan; hun bloed is op hen!", "Ezech 23:47": "En de menigte zal hen met stenen stenigen, en hen met hun zwaarden neerhouwen; hun zonen en hun dochters zullen zij doden, en hun huizen met vuur verbranden.", "Rom 13:12": "De nacht is voorbijgegaan, en de dag is nabij gekomen. Laten wij dan de werken van de duisternis afleggen, en de wapens van het licht aandoen.", "Gen 34:4-10": "Sichem sprak ook tegen zijn vader Hemor en zei: Neem mij deze dochter tot vrouw. Toen Jakob hoorde dat hij zijn dochter Dina verontreinigd had, waren zijn zonen met het vee in het veld; en Jakob zweeg totdat zij kwamen. En Hemor, de vader van Sichem, ging naar buiten naar Jakob, om met hem te spreken.", "Joh 8:5": "En Mozes heeft ons in de wet geboden, dat zulke vrouwen gestenigd moeten worden; Wat zegt U dan?", "Rom 2:1": "Daarom bent u niet te verontschuldigen, o mens, wie u ook bent die anderen oordeelt; want waarin u een ander oordeelt, veroordeelt u uzelf; want u, die anderen oordeelt, doet dezelfde dingen.", "Rom 6:21": "Wat voor vrucht had u toen van die dingen waarover u zich nu schaamt? Want het einde daarvan is de dood.", "2 Sam 23:13": "Ook gingen drie van de dertig hoofden af, en kwamen in de oogsttijd naar David, in de spelonk van Adullam; en de troep Filistijnen had zich gelegerd in het dal Rafaïm.", "Neh 11:6": "Alle kinderen van Perez, die te Jeruzalem woonden, waren vierhonderdachtenzestig dappere mannen.", "Joh 8:4": "En zij zetten haar in het midden, en zeiden tegen Hem: Meester, deze vrouw is op heterdaad betrapt, terwijl zij overspel pleegde.", "2 Sam 13:11": "Toen zij ze naar hem toe bracht om te eten, greep hij haar vast, en zei tegen haar: Kom, lig bij mij, mijn zuster!", "Lev 19:17": "U zult uw broeder in uw hart niet haten; u zult uw naaste zeker berispen, en zult de zonde in hem niet laten voortbestaan.", "Deut 24:16": "De vaders zullen niet gedood worden voor de kinderen, en de kinderen zullen niet gedood worden voor de vaders; ieder zal om zijn eigen zonde gedood worden.", "Ex 22:16": "Wanneer iemand een maagd verleidt die nog niet ondertrouwd is, en hij slaapt met haar, dan moet hij zonder uitstel een bruidsprijs voor haar betalen, zodat zij zijn vrouw wordt.", "Hos 3:3": "En ik zei tegen haar: U zult veel dagen bij mij blijven zitten (u zult niet hoereren, en niet de vrouw van een andere man worden), en ik ook bij u.", "Num 26:20": "Zo waren de zonen van Juda naar hun geslachten: van Sela het geslacht der Selanieten; van Perez het geslacht der Perezieten; van Zerah het geslacht der Zerahieten.", "Deut 22:21-27": "Dan zullen zij deze jonge dochter naar de deur van haar vaders huis brengen, en de mannen van haar stad zullen haar met stenen stenigen, zodat zij sterft, omdat zij een dwaasheid in Israël gedaan heeft door in haars vaders huis te hoereren; zo zult u het kwaad uit uw midden wegdoen. Wanneer een man gevonden wordt, liggend bij de vrouw van een andere man, zo zullen zij beiden sterven, de man die bij de vrouw gelegen heeft, en de vrouw; zo zult u het kwaad uit Israël wegdoen. Wanneer er een jonge dochter is, die een maagd is, verloofd met een man, en een man treft haar in de stad en ligt bij haar;", "Spr 7:12": "Nu buiten, dan op de straten zijnde, en bij alle hoeken loerend;", "Jer 3:1": "Men zegt: Als een man zijn vrouw verlaat, en zij gaat van hem weg en wordt de vrouw van een andere man, zal hij dan nog naar haar terugkeren? Zou dat land niet ernstig ontheiligd worden? U hebt met veel minnaars gehoereerd, en toch zou u weer naar Mij terugkeren, spreekt de HEERE.", "Ezech 16:52": "Draag u dan ook uw schande, u die voor uw zusters geoordeeld hebt door uw zonden, die u gruwelijker gemaakt hebt dan zij; zij zijn rechtvaardiger dan u; wees u dan ook beschaamd, en draag uw schande, omdat u uw zusters gerechtvaardigd hebt.", "Richt 14:1": "En Simson ging af naar Thimnath, en zag daar een vrouw uit de dochters van de Filistijnen,", "Neh 11:30": "Zanoah, Adullam en haar dorpen, Lachis en haar akkers, Azeka en haar onderhorige plaatsen; en zij legerden zich van Berseba af tot aan het dal Hinnom.", "Hebr 13:4": "Het huwelijk is eerbaar onder allen, en het huwelijksbed onbevlekt; maar hoereerders en overspelers zal God oordelen.", "Gen 9:25": "En hij zei: Vervloekt zij Kanaän; een knecht der knechten zal hij zijn voor zijn broers!", "Micha 1:15": "Ik zal u nog een erfgenaam toebrengen, u inwoonster van Maresa! Hij zal komen tot aan Adullam, tot aan de heerlijkheid van Israël.", "1 Sam 25:4-8": "Toen David in de woestijn hoorde dat Nabal zijn schapen schoor, zond David tien jongemannen; en David zei tegen de jongemannen: Ga op naar Karmel, en als u bij Nabal komt, zult u hem in mijn naam naar zijn welstand vragen; en u zult zo zeggen tegen die welvarende man: Vrede zij u, en uw huis zij vrede, en alles wat u hebt, zij vrede!", "2 Sam 11:27": "En toen de rouw voorbij was, stuurde David iemand heen, en nam haar in zijn huis; en zij werd hem tot vrouw, en baarde hem een zoon. Doch deze daad, die David gedaan had, was kwaad in de ogen van de HEERE.", "Richt 19:2": "Maar zijn bijvrouw pleegde ontucht tegen hem, en ging bij hem weg naar het huis van haar vader, naar Bethlehem-Juda; en zij was daar enige dagen, namelijk vier maanden.", "Gen 46:12": "En de zonen van Juda: Er, en Onan, en Sela, en Perez, en Zerah. Maar Er en Onan waren gestorven in het land Kanaän; en de zonen van Perez waren Hezron en Hamul.", "Ps 50:21": "Deze dingen doet u, en Ik zwijg; u meent dat Ik helemaal ben zoals u; Ik zal u straffen, en zal het ordelijk voor uw ogen op een rij zetten.", "Gen 38:1-24": "En het gebeurde in die tijd, dat Juda van zijn broers wegtrok, en hij ging naar een man uit Adullam, wiens naam Hira was. En Juda zag daar de dochter van een Kanaänitische man, wiens naam Sua was; en hij nam haar, en ging tot haar in. En zij werd zwanger en baarde een zoon, en hij noemde hem Er.", "1 Kron 4:21": "De kinderen van Sela, de zoon van Juda, waren Er, de vader van Lecha, en Lada, de vader van Maresa; en de huisgezinnen van het huis van de linnenwerkers in het huis Asbea.", "2 Kron 11:7": "En Beth-zur, en Socho, en Adullam,", "Num 36:6-9": "Dit is het woord dat de HEERE geboden heeft over de dochters van Zelafead: Laat hen trouwen met wie in hun ogen goed is; alleen moeten zij trouwen met iemand uit het geslacht van de stam van hun vader. Zo zal de erfenis van de kinderen van Israël niet overgaan van stam naar stam; want de kinderen van Israël zullen vasthouden, ieder aan de erfenis van de stam van zijn vaderen. Verder zal elke dochter die een erfenis erft, van de stammen van de kinderen van Israël, de vrouw worden van iemand uit het geslacht van de stam van haar vader; opdat de kinderen van Israël erfelijk bezitten, ieder de erfenis van zijn vaderen.", "Gen 38:17-20": "En hij zei: Ik zal u een geitenbokje uit de kudde sturen. En zij zei: Zult u mij een onderpand geven, totdat u het stuurt? Toen zei hij: Wat voor onderpand zal ik u geven? En zij zei: Uw zegelring en uw snoer en uw staf, die u in uw hand heeft; dat gaf hij haar, en hij ging bij haar in, en zij werd zwanger van hem. En zij stond op, en ging weg, en legde haar sluier af, en trok de kleren van haar weduwschap weer aan.", "2 Sam 13:23-29": "En het gebeurde, na twee volle jaren, dat Absalom schaapscheerders had bij Baäl-Hazor, dat bij Efraïm ligt; en Absalom nodigde alle zonen van de koning uit. En Absalom kwam bij de koning, en zei: Zie, uw knecht heeft nu schaapscheerders; laat toch de koning en zijn knechten met uw knecht meegaan. Maar de koning zei tegen Absalom: Nee, mijn zoon, laten we toch niet allemaal samen gaan, opdat wij u niet tot last zijn; en hij drong bij hem aan, doch hij wilde niet gaan, maar zegende hem.", "Luk 23:12": "En op diezelfde dag werden Pilatus en Herodes vrienden met elkaar; want daarvoor waren zij in vijandschap tegen elkaar geweest.", "1 Petr 4:3": "Want het is ons genoeg dat wij in de voorgaande tijd van ons leven de wil van de heidenen volbracht hebben, en geleefd hebben in losbandigheid, begeerten, dronkenschap, zwelgpartijen, drinkgelagen en gruwelijke afgoderij;", "Luk 15:22": "Maar de vader zei tegen zijn dienaren: Breng hier het beste kleed, en trek het hem aan, en geef hem een ring aan zijn hand, en schoenen aan zijn voeten;", "Spr 20:16": "Als iemand borg geworden is voor een vreemde, neem zijn kleed; en pand hem voor de onbekenden.", "Num 22:34": "Toen zei Bileam tegen de Engel van de HEERE: Ik heb gezondigd, want ik heb niet geweten dat U mij tegemoet op deze weg stond; en nu, als het kwaad is in Uw ogen, zal ik terugkeren.", "Ps 55:24": "Maar U, o God! zult hen doen neerdalen in de put van het verderf; de mannen van het bloed en het bedrog zullen hun dagen niet tot de helft brengen; ik, daarentegen, zal op U vertrouwen.", "Ezech 23:48": "Zo zal Ik de schandelijkheid uit het land doen ophouden, opdat alle vrouwen onderwezen worden zodat zij niet naar uw schandelijkheid handelen.", "Ezech 16:15": "Maar u hebt vertrouwd op uw schoonheid, en hebt gehoereerd vanwege uw naam; ja, u hebt uw hoererijen uitgestort over ieder die voorbijkwam; voor hem was u.", "Neh 11:4": "Te Jeruzalem dan woonden sommigen van de kinderen van Juda, en van de kinderen van Benjamin. Van de kinderen van Juda: Athaja, de zoon van Uzzia, de zoon van Zacharja, de zoon van Amarja, de zoon van Sefatja, de zoon van Mahalaleël, van de kinderen van Perez;", "Ex 22:17": "Als haar vader hardnekkig weigert haar aan hem te geven, dan moet hij geld betalen overeenkomstig de bruidsprijs voor maagden.", "Jer 2:20": "Toen Ik van oude tijden af uw juk verbroken, en uw banden verscheurd had, zei u: Ik zal niet dienen; maar op alle hoge heuvels en onder elke groene boom loopt u om, hoererend.", "2 Kor 6:14": "Trek niet een ander juk aan met de ongelovigen; want wat heeft de gerechtigheid gemeen met de ongerechtigheid, en welke gemeenschap heeft het licht met de duisternis?", "Dan 3:19-23": "Toen werd Nebukadnezar vervuld van woede, en de uitdrukking van zijn gezicht veranderde tegen Sadrach, Mesach en Abed-nego; hij antwoordde en zei, dat men de oven zeven keer heter moest maken dan men die gewoonlijk heet maakte. En tegen de sterkste mannen van zijn leger zei hij dat zij Sadrach, Mesach en Abed-nego moesten binden, om hen te werpen in de brandende vuuroven. Toen werden die mannen gebonden in hun mantels, hun broeken, hun hoeden, en hun andere kleren, en zij wierpen hen in het midden van de brandende vuuroven.", "Richt 14:20": "En de vrouw van Simson werd gegeven aan het metgezel van hem, die hem vergezeld had.", "Num 11:1": "En het gebeurde dat het volk zich beklaagde, en dat was kwaad in de oren van de HEERE; want de HEERE hoorde het, zodat Zijn toorn ontstak, en het vuur van de HEERE onder hen ontbrandde en verteerde hen die in het uiterste van het leger waren.", "Joz 15:44": "en Kehila, en Achzib, en Mareza; negen steden en haar dorpen;", "Jer 22:24": "Zo waarachtig als Ik leef, spreekt de HEERE, al was Chonia, de zoon van Jojakim, de koning van Juda, een zegelring aan Mijn rechterhand, toch zal Ik u vandaar wegrukken.", "Hos 4:11": "Hoererij, en wijn, en jonge wijn neemt het hart weg.", "Gen 34:31": "En zij zeiden: Zou hij dan met onze zuster hebben mogen omgaan als met een hoer?", "Gen 38:27-30": "En het gebeurde in de tijd dat zij zou baren, zie, dat er een tweeling in haar buik was. En het gebeurde, toen zij baarde, dat de één zijn hand naar buiten stak; en de vroedvrouw pakte die, en bond een scharlaken draad om zijn hand, en zei: Deze komt als eerste naar buiten. Maar het gebeurde, toen hij zijn hand terugtrok, zie, dat zijn broer naar buiten kwam; en zij zei: Hoe bent u doorgebroken? Op u komt de breuk! En men noemde hem Perez.", "Lev 20:10": "Een man ook, die met de vrouw van een ander overspel doet, omdat hij overspel doet met de vrouw van zijn naaste, zal zeker gedood worden, de overspeler en de overspeelster.", "Gen 34:2": "Sichem nu, de zoon van Hemor de Heviet, de landvorst, zag haar, en hij nam haar, en lag bij haar, en verkrachtte haar.", "Openb 16:15": "Zie, Ik kom als een dief. Zalig is hij die waakt en zijn kleren bewaart, zodat hij niet naakt hoeft te wandelen, en men zijn schaamte niet ziet.", "Rom 3:19": "Wij weten nu, dat alles wat de wet zegt, zij dat spreekt tot hen die onder de wet zijn; opdat elke mond gestopt wordt en de hele wereld voor God schuldig staat.", "Matt 1:3": "en Juda verwekte Fares en Zara bij Thamar; en Fares verwekte Esrom, en Esrom verwekte Aram;", "1 Kor 6:9": "Of weet u niet, dat de onrechtvaardigen het Koninkrijk van God niet zullen beërven?", "Ef 5:6": "Laat niemand u verleiden met loze woorden; want om deze dingen komt de toorn van God over de kinderen van de ongehoorzaamheid.", "Joz 15:10": "Daarna zal deze grens zich omkeren van Baäla tegen het westen, naar het gebergte Seïr, en zal doorgaan aan de kant van de berg Jearim van het noorden; dat is Chesalon; en zij zal afkomen naar Beth-semes, en door Timna gaan.", "Job 34:31": "Zeker heeft hij tot God gezegd: Ik heb Uw straf verdragen, ik zal het niet verderven.", "Gen 9:24": "En Noach ontwaakte uit zijn roes, en merkte wat zijn jongste zoon hem had aangedaan.", "Richt 4:18": "Jaël nu ging naar buiten, Sisera tegemoet, en zei tegen hem: Kom binnen, mijn heer, kom bij mij binnen, wees niet bang! En hij kwam bij haar binnen in de tent, en zij bedekte hem met een deken.", "Ezech 16:38": "Daarbij zal Ik u berechten naar de rechten van overspeelsters en bloedvergietsters; en Ik zal u overgeven aan het bloed van de grimmigheid en van het ijver.", "1 Kron 9:6": "En van de kinderen van Zerah was Jeüel, en van hun broeders waren zeshonderd negentig.", "Ruth 4:12": "En uw huis zij als het huis van Perez (die Thamar aan Juda baarde), door het nageslacht dat de HEERE u geven zal uit deze jonge vrouw.", "Lev 22:13": "Maar als de dochter van de priester een weduwe of een verstotene zal zijn, en geen nageslacht heeft, en naar het huis van haar vader zal zijn teruggekeerd zoals in haar jeugd, dan zal zij van het voedsel van haar vader eten; maar geen vreemde zal daarvan eten.", "1 Kron 2:3": "De kinderen van Juda zijn: Er, en Onan, en Sela; drie zijn hem geboren van de dochter van Sua, de Kanaänietische; en Er, de eerstgeborene van Juda, was slecht in de ogen van de HEERE; daarom doodde Hij hem.", "Lev 20:14": "En wanneer een man een vrouw en haar moeder neemt, is het een schandelijke daad; men zal hem, en hen, met vuur verbranden, zodat er geen schandelijke daad in uw midden is.", "Jes 53:7": "Toen die geëist werd, werd Hij verdrukt; maar Hij deed Zijn mond niet open; als een lam werd Hij ter slachting geleid, en zoals een schaap stom is voor het aangezicht van zijn scheerders, zo deed Hij Zijn mond niet open.", "Jer 2:26": "Zoals een dief beschaamd wordt, wanneer hij gevonden wordt, zo is het huis van Israël beschaamd; zij, hun koningen, hun vorsten, en hun priesters, en hun profeten;", "Gen 13:13": "En de mannen van Sodom waren slecht, en grote zondaars tegen de HEERE.", "Job 5:2": "Want de dwaas brengt de toorn om, en de ijver doodt de eenvoudige.", "1 Kor 10:8": "En laten wij niet hoereren, zoals sommigen van hen gehoereerd hebben, en er vielen op één dag drieëntwintigduizend.", "Openb 21:8": "Maar de bangen, en ongelovigen, en verfoeilijken, en moordenaars, en hoereerders, en tovenaars, en afgodendienaars, en alle leugenaars, hun deel is in de poel die daar brandt van vuur en zwavel; dat is de tweede dood.", "Gen 19:3": "En hij hield sterk bij hen aan, zodat zij bij hem introkken, en in zijn huis kwamen; en hij maakte hun een maaltijd, en bakte ongezuurde koeken, en zij aten.", "Spr 24:18": "Opdat de HEERE het niet ziet, en het kwaad is in Zijn ogen en Hij Zijn toorn van hem afkeert.", "2 Kor 4:2": "Maar wij hebben de bedekselen der schande verworpen, en wandelen niet in arglistigheid, en vervalsen ook het Woord van God niet, maar door openbaring van de waarheid maken wij onszelf aangenaam bij ieder geweten van de mensen, in de tegenwoordigheid van God.", "Jak 3:16": "Want waar afgunst en eigenbelang is, daar is verwarring en allerlei kwade praktijk.", "Gen 6:2": "dat Gods zonen de dochters der mensen aanzagen, dat zij mooi waren, en zij namen zich vrouwen uit allen die zij verkozen hadden.", "Ezech 23:19": "Toch vermenigvuldigde zij haar hoererijen, terwijl zij dacht aan de dagen van haar jeugd, toen zij gehoereerd had in het land Egypte.", "Mal 2:5": "Mijn verbond met hem was het leven en de vrede; en Ik gaf hem die tot een vrees, en hij vreesde Mij, en hij werd om Mijn Naam bevreesd.", "1 Kron 9:4": "Uthai, de zoon van Ammihud, de zoon van Omri, de zoon van Imri, de zoon van Bani, van de kinderen van Perez, de zoon van Juda.", "1 Kor 4:5": "Oordeel dan niets vóór de tijd, totdat de Heere gekomen zal zijn, Die ook in het licht zal brengen wat in de duisternis verborgen is, en de plannen van de harten openbaar zal maken; en dan zal ieder lof van God ontvangen.", "Luk 16:8": "En de heer prees de onrechtvaardige rentmeester, omdat hij voorzichtig gehandeld had; want de kinderen van deze wereld zijn voorzichtiger dan de kinderen van het licht, in hun geslacht.", "Gen 3:6": "En de vrouw zag dat die boom goed was om van te eten, en dat hij een lust was voor de ogen, ja, een boom die begerenswaardig was om er verstandig van te worden; en zij nam van zijn vrucht en at; en zij gaf ook aan haar man, die bij haar was, en hij at.", "2 Sam 12:7": "Toen zei Nathan tegen David: U bent die man! Zo zegt de HEERE, de God van Israël: Ik heb u tot koning gezalfd over Israël, en Ik heb u uit de hand van Saul gered;", "Gen 38:12-26": "Toen er veel dagen verstreken waren, stierf de dochter van Sua, de vrouw van Juda; daarna vond Juda troost, en hij ging naar zijn schaapscheerders in Timna, hij en Hira, zijn vriend, de Adullamiet. En men liet Thamar weten: Zie, uw schoonvader gaat naar Timna om zijn schapen te scheren. Toen legde zij de kleren van haar weduwschap af, en bedekte zich met een sluier, en wikkelde zich in, en ging bij de ingang van de twee bronnen zitten, die aan de weg naar Timna liggen; want zij had gezien dat Sela groot geworden was, en dat zij hem niet tot vrouw was gegeven.", "Lev 19:20-22": "En wanneer een man, door gemeenschap van het zaad, bij een vrouw zal hebben gelegen, die een dienstmaagd is, aan een man verloofd, en geenszins losgekocht is, en haar geen vrijheid is gegeven; die zullen gegeseld worden; zij zullen niet gedood worden; want zij was niet vrijgemaakt. En hij zal zijn schuldoffer de HEERE aan de deur van de tent van de samenkomst brengen, een ram ten schuldoffer. En de priester zal met de ram van het schuldoffer, voor hem over zijn zonde die hij gezondigd heeft, voor het aangezicht van de HEERE verzoening doen; en hem zal vergeving gebeuren van zijn zonde die hij gezondigd heeft.", "Gen 21:14": "Toen stond Abraham 's morgens vroeg op, en nam brood en een fles water, en gaf ze aan Hagar, die hij op haar schouder legde; ook gaf hij haar het kind, en stuurde haar weg. En zij ging op weg, en dwaalde rond in de woestijn Berseba.", "Spr 13:20": "Die met de wijzen omgaat, zal wijs worden; maar die de metgezel van de dwazen is, zal verbroken worden.", "Richt 15:1": "En het gebeurde na enige dagen, in de dagen van de tarweoogst, dat Simson zijn vrouw bezocht met een geitenbokje, en hij zei: Laat mij bij mijn vrouw ingaan, in de kamer; maar haar vader liet hem niet toe naar binnen te gaan.", "Ezech 16:40": "Daarna zullen zij een menigte tegen u laten opkomen, en zij zullen u met stenen stenigen, en u met hun zwaarden doorsteken.", "2 Sam 16:22": "Zo spanden zij voor Absalom een tent op op het dak; en Absalom ging naar de bijvrouwen van zijn vader, voor de ogen van heel Israël.", "Jer 3:6": "Verder zei de HEERE tegen mij, in de dagen van koning Josia: Hebt u gezien wat het afgekeerde Israël gedaan heeft? Zij ging op elke hoge berg en onder elke groene boom, en hoereerde daar.", "Hos 4:15": "Als u, Israël! wilt hoereren, laat Juda dan zeker niet schuldig worden; kom toch niet naar Gilgal, en ga niet op naar Beth-Aven, en zweer niet: Zo waarachtig als de Heere leeft.", "Neh 11:24": "En Petahja, de zoon van Mesezabeel, van de kinderen van Zerah, de zoon van Juda, stond de koning terzijde in alle zaken die het volk betroffen.", "Gen 24:22": "En het gebeurde, toen de kamelen klaar waren met drinken, dat die man een gouden voorhoofdsieraad nam, waarvan het gewicht een halve sikkel was, en twee armringen aan haar handen, waarvan het gewicht tien sikkel goud was.", "Rom 2:16": "Op de dag waarop God de verborgen dingen van de mensen zal oordelen door Jezus Christus, naar mijn Evangelie.", "Mark 12:19-23": "Meester, Mozes heeft ons geschreven: Als iemands broer sterft, en een vrouw achterlaat, en geen kinderen nalaat, dat zijn broer diens vrouw moet nemen en voor zijn broer nageslacht moet verwekken. Nu waren er zeven broers, en de eerste nam een vrouw, en stervend liet hij geen nageslacht na. De tweede nam haar ook, en stierf, en ook deze liet geen nageslacht na; en de derde evenzo.", "Tit 2:11": "Want de genade van God die zaligmakend is, is verschenen aan alle mensen.", "Tit 3:3": "Want ook wij waren vroeger onverstandig, ongehoorzaam, dwalend, en dienden aan allerlei begeerten en genoegens; wij leefden in slechtheid en afgunst, waren hatelijk en haatten elkaar.", "Gen 33:1": "Jakob sloeg zijn ogen op en keek, en zie, Ezau kwam eraan, en vierhonderd man met hem. Toen verdeelde hij de kinderen onder Lea, en onder Rachel, en onder de twee dienstmaagden.", "Spr 9:6": "Verlaat de dwaasheden, en leef; en treed in de weg van het verstand.", "Jak 3:14": "Maar als u bittere afgunst en eigenbelang in uw hart hebt, beroem u dan niet en lieg niet tegen de waarheid.", "Pred 7:26": "En ik vond iets bitterders dan de dood: een vrouw, wier hart netten en garen, en haar handen boeien zijn; wie goed is voor Gods aangezicht, zal aan haar ontkomen; daarentegen zal de zondaar door haar gevangen worden.", "Gen 6:4": "In die dagen waren er reuzen op de aarde, en ook daarna, toen Gods zonen tot de dochters der mensen ingegaan waren, en zich kinderen verwekt hadden; deze zijn de geweldigen, die van ouds geweest zijn, mannen van naam.", "Gen 24:67": "En Izak bracht haar in de tent van zijn moeder Sara; en hij nam Rebekka, en zij werd hem tot vrouw, en hij had haar lief. Zo werd Izak getroost na de dood van zijn moeder.", "Matt 3:8": "Breng dan vruchten voort die bij de bekering passen.", "Luk 20:28": "Meester, Mozes heeft ons geschreven: Als iemands broer sterft, die een vrouw heeft, en zonder kinderen sterft, dat zijn broer de vrouw moet nemen, en voor zijn broer nakomelingen moet verwekken.", "Gen 38:7-11": "Maar Er, de eerstgeborene van Juda, was slecht in de ogen van de HEERE; daarom doodde de HEERE hem. Toen zei Juda tegen Onan: Ga naar de vrouw van uw broer, en trouw met haar volgens het zwagerrecht, en verwek voor uw broer nageslacht. Maar Onan wist dat dit nageslacht niet voor hem zou zijn; en het gebeurde, wanneer hij bij de vrouw van zijn broer inging, dat hij het verspilde op de grond, om zijn broer geen nageslacht te geven.", "Openb 22:15": "Maar buiten zullen zijn de honden, en de tovenaars, en de hoereerders, en de doodslagers, en de afgodendienaars, en ieder die de leugen liefheeft en doet.", "1 Sam 25:36": "Toen Abigaïl nu bij Nabal kwam, zie, zo had hij een maaltijd in zijn huis, als een koningsmaaltijd; en het hart van Nabal was vrolijk in hem, en hij was zeer dronken; daarom vertelde zij hem niets, klein of groot, tot het morgenlicht.", "Jer 44:4": "En Ik heb tot u gezonden al Mijn knechten, de profeten, vroeg opstaand en zendend, om te zeggen: Doe toch deze gruwelijke zaak niet, die Ik haat.", "2 Sam 24:17": "En David, toen hij de engel zag die het volk sloeg, sprak tot de HEERE, en zei: Zie, ik, ik heb gezondigd, en ik, ik heb onrecht gehandeld, maar wat hebben deze schapen gedaan? Laat toch Uw hand tegen mij zijn en tegen het huis van mijn vader.", "2 Sam 12:5": "Toen ontstak Davids woede erg tegen die man, en hij zei tegen Nathan: Zo waar de HEERE leeft, de man die dat gedaan heeft, is een kind des doods!", "1 Kor 6:10": "Vergis u niet; hoereerders, afgodendienaars, overspelers, ontuchtigen, mannen die bij mannen liggen, dieven, hebzuchtigen, dronkaards, geen lasteraars, geen rovers, zullen het Koninkrijk van God beërven.", "Gen 19:2": "En hij zei: Zie toch, mijn heren! Keert u toch af naar het huis van uw knecht, en overnacht daar, en wast uw voeten; dan kunt u vroeg opstaan en verder gaan op uw weg. En zij zeiden: Nee, maar wij zullen op straat overnachten.", "Ezech 23:45": "Rechtvaardige mannen dan, die zullen hen berechten naar het recht van overspeelsters, en naar het recht van vrouwen die bloed vergieten; want zij zijn overspeelsters, en bloed is aan hun handen.", "Gen 20:9": "En Abimelech riep Abraham, en zei tegen hem: Wat hebt u ons aangedaan? En wat heb ik tegen u gezondigd, dat u over mij en over mijn koninkrijk zo'n grote zonde gebracht hebt? U hebt dingen bij mij gedaan die niet gedaan zouden mogen worden.", "Job 34:32": "Behalve wat ik zie, leer Gij mij; heb ik onrecht gewrocht, ik zal het niet meer doen.", "Joz 12:15": "De koning van Libna, één; de koning van Adullam, één;", "Ruth 4:5": "Maar Boaz zei: Op de dag dat u het land aanvaardt van de hand van Naomi, zult u het ook aanvaarden van Ruth, de Moabitische, de vrouw van de gestorvene, om de naam van de gestorvene te doen voortbestaan over zijn erfdeel.", "Gen 38:6-24": "Juda nam een vrouw voor Er, zijn eerstgeborene, en haar naam was Thamar. Maar Er, de eerstgeborene van Juda, was slecht in de ogen van de HEERE; daarom doodde de HEERE hem. Toen zei Juda tegen Onan: Ga naar de vrouw van uw broer, en trouw met haar volgens het zwagerrecht, en verwek voor uw broer nageslacht.", "Deut 27:22": "Vervloekt is hij die bij zijn zuster ligt, de dochter van zijn vader of de dochter van zijn moeder! En heel het volk zal zeggen: Amen.", "Num 26:19": "De zonen van Juda waren Er en Onan; maar Er en Onan stierven in het land Kanaän.", "Job 39:38": "Eenmaal heb ik gesproken, maar zal niet antwoorden; of tweemaal, maar zal niet voortvaren.", "Gen 6:8": "Maar Noach vond genade in de ogen van de HEERE.", "Jer 29:23": "Omdat zij een dwaasheid deden in Israël, en overspel bedreven met de vrouwen van hun naasten, en het woord leugenachtig spraken in Mijn Naam, wat Ik hun niet geboden had; en Ik ben Degene Die het weet, en een getuige daarvan, spreekt de HEERE.", "Gen 4:1": "En Adam had gemeenschap met Eva, zijn vrouw, en zij werd zwanger en baarde Kaïn, en zei: Ik heb een man van de HEERE verkregen!", "Joz 15:34": "en Zanoah, en En-gannim, Tappuah, en Enam,", "Spr 27:4": "Grimmigheid en overloping van toorn is wreedheid; maar wie zal voor jaloezie standhouden?", "Deut 25:5-10": "Wanneer broeders samenwonen, en één van hen sterft zonder zoon, dan mag de vrouw van de gestorvene niet trouwen met een vreemde man van buiten; haar zwager zal tot haar ingaan, en haar tot vrouw nemen, en zo de plicht van een zwager aan haar vervullen. En het zal gebeuren, dat de eerstgeborene die zij baart, de naam van zijn overleden broer zal dragen; opdat zijn naam niet uitgewist wordt uit Israël. Maar als die man geen zin heeft om de vrouw van zijn broer te nemen, dan zal de vrouw van zijn broer naar de poort gaan, naar de oudsten, en zeggen: Mijn zwager weigert voor zijn broer een naam te doen voortbestaan in Israël; hij wil de plicht van een zwager niet aan mij vervullen.", "Ezech 16:28": "Verder hebt u gehoereerd met de zonen van Assur, omdat u onverzadigbaar was; ja, ook toen u met hen gehoereerd had, was u nog niet verzadigd.", "1 Kor 5:1-13": "Men hoort algemeen dat er hoererij onder u is, en wel zodanige hoererij die zelfs onder de heidenen niet genoemd wordt: dat iemand de vrouw van zijn vader heeft. En u bent nog opgeblazen, en hebt niet veel meer verdriet gehad, zodat hij die deze daad begaan heeft, uit uw midden weggedaan zou worden? Want ik, hoewel met het lichaam afwezig, maar aanwezig met de geest, heb al besloten, alsof ik aanwezig was, over hem die dit zo gedaan heeft:", "Joh 8:9": "Maar zij, dit horend, en door hun geweten overtuigd, gingen weg, de een na de ander, te beginnen bij de oudsten tot de laatsten toe; en Jezus bleef alleen achter, met de vrouw die in het midden stond.", "1 Kron 2:4": "Maar Thamar, zijn schoondochter, baarde hem Perez en Zerah. Al de zonen van Juda waren vijf.", "Ef 5:12": "Want wat heimelijk door hen gebeurt, is ook schandelijk om te noemen.", "2 Kon 4:8": "Het gebeurde ook op een dag, toen Elisa naar Sunem doortrok, dat daar een voorname vrouw was, die hem drong om brood te eten. Verder gebeurde het, zo dikwijls hij doortrok, dat hij daar inwijkt om brood te eten.", "Richt 16:1": "Simson ging weg naar Gaza; en hij zag daar een vrouw, die een hoer was; en hij ging naar haar toe.", "Ef 5:5": "Want dit weet u, dat geen hoereerder, of onreine, of hebzuchtige, die een afgodendienaar is, erfenis heeft in het Koninkrijk van Christus en van God.", "2 Sam 12:10-12": "Nu dan, het zwaard zal niet van uw huis wijken tot in eeuwigheid, omdat u Mij veracht hebt, en de vrouw van Uria, de Hethiet, genomen hebt, zodat zij uw vrouw is geworden. Zo zegt de HEERE: Zie, Ik zal kwaad over u verwekken uit uw eigen huis, en Ik zal uw vrouwen nemen voor uw ogen, en zal ze aan uw naaste geven; die zal bij uw vrouwen liggen, voor de ogen van deze zon. Want u hebt het in het verborgene gedaan, maar Ik zal deze zaak doen voor heel Israël, en voor de zon.", "1 Sam 24:18": "En hij zei tegen David: U bent rechtvaardiger dan ik; want u hebt mij goed vergolden, en ik heb u kwaad vergolden.", "Ezech 16:41": "Zij zullen ook uw huizen met vuur verbranden, en oordelen tegen u uitvoeren voor de ogen van veel vrouwen; en Ik zal u doen ophouden een hoer te zijn, en u zult ook geen hoerenloon meer geven.", "Openb 18:10": "Van verre staande uit vrees voor haar pijniging, en zeggen: Wee, wee, de grote stad Babylon, de sterke stad, want uw oordeel is in één uur gekomen.", "Matt 7:1-5": "Oordeel niet, opdat u niet geoordeeld wordt. Want met het oordeel waarmee u oordeelt, zult u geoordeeld worden; en met de maat waarmee u meet, zal u weer gemeten worden. En wat ziet u de splinter die in het oog van uw broeder is, maar merkt u de balk die in uw eigen oog is niet op?", "Job 4:5": "maar nu komt het aan bij u, en u bent verdrietig; het raakt tot u, en u wordt beroerd.", "Tit 2:12": "En onderwijst ons dat wij, doordat we de goddeloosheid en de wereldse begeerten verzaken, matig en rechtvaardig en godvruchtig zouden leven in deze tegenwoordige wereld;", "Openb 20:12": "En ik zag de doden, klein en groot, staande voor God; en de boeken werden geopend; en een ander boek werd geopend, dat van het leven is; en de doden werden geoordeeld uit wat in de boeken geschreven was, naar hun werken.", "Ruth 3:1-8": "Naomi, haar schoonmoeder, zei tegen haar: Mijn dochter! Zou ik geen rust voor u zoeken, opdat het u goed gaat? Nu dan, is Boaz, met wiens dienstmeisjes u geweest bent, niet van onze bloedverwantschap? Zie, hij zal deze nacht gerst wannen op de dorsvloer. Was u dan, en zalf u, en trek uw kleren aan, en ga naar de dorsvloer; maar maak u aan de man niet bekend, totdat hij klaar is met eten en drinken.", "Deut 23:18": "U zult geen hoerenloon noch hondenprijs in het huis van de HEERE, uw God, brengen, voor enige gelofte; want ook die beide zijn de HEERE, uw God, een gruwel.", "Num 5:11-29": "Verder sprak de HEERE tot Mozes en zei: Spreek tot de kinderen van Israël, en zeg tot hen: Wanneer de vrouw van iemand afgeweken zal zijn, en door overtreding tegen hem overtreden zal hebben, Doordat een man gemeenschap met haar gehad heeft, en het voor de ogen van haar man verborgen zal zijn, en zij zich verheeld zal hebben, terwijl zij toch onrein geworden is; en er geen getuige tegen haar is, en zij niet op heterdaad betrapt is;", "Gen 19:13": "want wij gaan deze plaats verwoesten, omdat hun geroep groot geworden is voor het aangezicht van de HEERE, en de HEERE ons uitgezonden heeft om haar te verwoesten.", "Deut 27:20": "Vervloekt is hij die bij de vrouw van zijn vader ligt, omdat hij de slipt van zijn vader ontdekt heeft! En heel het volk zal zeggen: Amen.", "Ruth 4:7-17": "Nu was dit van oude tijden af een gewoonte in Israël, bij de lossing en bij de ruil, om de hele zaak te bevestigen: de man trok zijn schoen uit en gaf die aan zijn naaste; en dit was een getuigenis in Israël. Zo zei de losser tegen Boaz: Koop het voor uzelf; en hij trok zijn schoen uit. Toen zei Boaz tegen de oudsten en al het volk: U bent heden getuigen, dat ik alles gekocht heb wat van Elimelech geweest is, en alles wat van Chiljon en Machlon geweest is, van de hand van Naomi.", "Openb 18:9": "En de koningen van de aarde, die met haar gehoereerd en in weelde geleefd hebben, zullen haar bewenen, en rouw over haar bedrijven, wanneer zij de rook van haar brand zullen zien;", "Ezech 23:25": "En Ik zal Mijn na-ijver tegen u inzetten, zodat zij in grimmigheid met u zullen handelen; zij zullen uw neus en uw oren afsnijden, en wat er van u overblijft zal door het zwaard vallen; zij zullen uw zonen en uw dochters wegnemen, en wat er van u overblijft zal door het vuur verteerd worden.", "Gen 31:19": "Laban nu was gegaan om zijn schapen te scheren; zo stal Rachel de terafim die van haar vader waren.", "Ezech 16:33": "Men geeft loon aan alle hoeren; maar u geeft uw loon aan al uw minnaars, en u beschenkt hen, opdat zij van rondom tot u zouden komen om uw hoererijen.", "Ruth 1:13": "zouden jullie daarop wachten totdat ze groot geworden zijn? Zouden jullie je daarvoor onthouden van een man te nemen? Nee, mijn dochters! Want het is voor mij veel bitterder dan voor u; want de hand van de HEERE is tegen mij uitgegaan.", "Joz 15:35": "Jarmuth, en Adullam, Socho en Azeka,", "2 Sam 14:5": "En de koning zei tegen haar: Wat is er met u? En zij zei: Zeker, ik ben een weduwe, en mijn man is gestorven."}, "noten": {"1": "SV: \"trouw haar in uws broeders naam\". D.i.: het zwagerhuwelijk (leviraatshuwelijk), waarbij de broer van een kinderloos overleden man met de weduwe trouwt om nageslacht voor hem te verwekken."}, "koppeling": {"1": "<span class=\"wl\" data-l=\"L1\" data-code=\"H1961\">En</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H1961\">het</span> gebeurde in die tijd, <span class=\"wl\" data-l=\"L2\" data-code=\"H3063\">dat</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H3063\">Juda</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H3063\">van</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H251\">zijn</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H251\">broers</span> wegtrok, <span class=\"wl\" data-l=\"L4\" data-code=\"H5186\">en</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H5186\">hij</span> ging naar <span class=\"wl\" data-l=\"L5\" data-code=\"H376\">een</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H376\">man</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H376\">uit</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H5726\">Adullam</span>, <span class=\"wl\" data-l=\"L7\" data-code=\"H8034\">wiens</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H8034\">naam</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H2437\">Hira</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H2437\">was</span>.", "2": "<span class=\"wl\" data-l=\"L1\" data-code=\"H3063\">En</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H3063\">Juda</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H7 H559\">saying,</span> This came <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> first.", "29": "And it came to pass, as he drew <span class=\"wl wl-kjv\" data-code=\"H7725\">back</span> his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> that, behold, his <span class=\"wl wl-kjv\" data-code=\"H251\">brother</span> came <span class=\"wl wl-kjv\" data-code=\"H3318\">out:</span> and she <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> How hast thou broken <span class=\"wl wl-kjv\" data-code=\"H6555\">forth?</span> this <span class=\"wl wl-kjv\" data-code=\"H6556\">breach</span> be upon thee: therefore his <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> was <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> Pharez.", "30": "And <span class=\"wl wl-kjv\" data-code=\"H310\">afterward</span> came <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> his <span class=\"wl wl-kjv\" data-code=\"H251\">brother,</span> that had the scarlet <span class=\"wl wl-kjv\" data-code=\"H8144\">thread</span> upon his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand:</span> and his <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> was <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> Zarah."}};

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>

).join('');

function paneelInhoud(n, tab) {

  const knoop = nd => {

  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
