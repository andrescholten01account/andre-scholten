": "mattheus", "Mark": "markus", "Luk": "lukas", "Joh": "johannes", "Hand": "handelingen", "Rom": "romeinen", "1 Kor": "1-korinthe", "2 Kor": "2-korinthe", "Gal": "galaten", "Ef": "efeze", "Fil": "filippenzen", "Kol": "kolossenzen", "1 Tess": "1-thessalonicenzen", "2 Tess": "2-thessalonicenzen", "1 Tim": "1-timotheus", "2 Tim": "2-timotheus", "Tit": "titus", "Filem": "filemon", "Hebr": "hebreeen", "Jak": "jakobus", "1 Petr": "1-petrus", "2 Petr": "2-petrus", "1 Joh": "1-johannes", "2 Joh": "2-johannes", "3 Joh": "3-johannes", "Judas": "judas", "Openb": "openbaring"}}, "vertalingen": {"SVnu": {"1": "Toen brak Jakob op, en ging naar het land van de kinderen van het Oosten.", "2": "En hij keek, en zie, er was een put in het veld; en zie, er waren drie kudden schapen ernaast neerliggend; want uit die put drenkten zij de kudden; en er was een grote steen op de mond van die put.", "3": "En daar werden alle kudden verzameld, en zij wentelden de steen van de mond van de put, en drenkten de schapen, en legden de steen weer op de mond van die put, op zijn plaats.", "4": "Toen zei Jakob tegen hen: Mijn broeders! Waar komt u vandaan? En zij zeiden: Wij komen uit Haran.", "5": "En hij zei tegen hen: Kent u Laban, de zoon van Nahor? En zij zeiden: Wij kennen *hem*.", "6": "Verder zei hij tegen hen: Gaat het goed met hem? En zij zeiden: Het gaat goed; en zie, Rachel, zijn dochter, komt met de schapen.", "7": "En hij zei: Zie, het is nog volop dag, het is geen tijd om het vee te verzamelen; drenk de schapen, en ga heen, weid *ze*.", "8": "Toen zeiden zij: Dat kunnen wij niet, totdat alle kudden samen zijn verzameld, en men de steen van de mond van de put afwentelt, zodat wij de schapen kunnen drenken.", "9": "Terwijl hij nog met hen sprak, kwam Rachel met de schapen die haar vader toebehoorden; want zij was een herderin.", "10": "En het gebeurde, toen Jakob Rachel zag, de dochter van Laban, de broer van zijn moeder, en de schapen van Laban, de broer van zijn moeder, dat Jakob dichterbij kwam, en de steen van de mond van de put wentelde, en de schapen van Laban, de broer van zijn moeder, drenkte.", "11": "En Jakob kuste Rachel; en hij verhief zijn stem en huilde.", "12": "En Jakob liet Rachel weten dat hij een broer van haar vader was, en dat hij de zoon van Rebekka was. Toen liep zij snel weg, en liet het haar vader weten.", "13": "En het gebeurde, toen Laban het bericht hoorde over Jakob, de zoon van zijn zuster, dat hij hem tegemoet snelde, en hem omhelsde, en hem kuste, en hem naar zijn huis bracht. En hij vertelde Laban al deze dingen.", "14": "Toen zei Laban tegen hem: Voorwaar, u bent mijn gebeente en mijn vlees! En hij bleef bij hem een volle maand.", "15": "Daarna zei Laban tegen Jakob: Omdat u mijn broer bent, zou u mij dan voor niets moeten dienen? Vertel mij, wat zal uw loon zijn?", "16": "En Laban had twee dochters: de naam van de oudste was Lea; en de naam van de jongste was Rachel.", "17": "Lea had tere ogen; maar Rachel was mooi van gestalte, en mooi van gezicht.", "18": "En Jakob had Rachel lief; en hij zei: Ik zal u zeven jaar dienen, voor Rachel, uw jongste dochter.", "19": "Toen zei Laban: Het is beter dat ik haar aan u geef, dan dat ik haar aan een andere man geef; blijf bij mij.", "20": "Zo diende Jakob zeven jaar voor Rachel; en die waren in zijn ogen als enkele dagen, omdat hij haar liefhad.", "21": "Toen zei Jakob tegen Laban: Geef mij mijn vrouw, want mijn dagen zijn vervuld, zodat ik bij haar kan komen.", "22": "Zo verzamelde Laban alle mannen van die plaats, en maakte een maaltijd.", "23": "En het gebeurde 's avonds, dat hij zijn dochter Lea nam, en haar bij hem bracht; en hij kwam bij haar.", "24": "En Laban gaf haar Zilpa, zijn dienstmeisje, aan Lea, zijn dochter, *tot* een dienstmeisje.", "25": "En het gebeurde 's morgens, en zie, het was Lea. Daarom zei hij tegen Laban: Wat is dit dat u mij hebt aangedaan? Heb ik niet bij u gediend voor Rachel? Waarom hebt u mij dan bedrogen?", "26": "En Laban zei: Zo doet men het niet in ons land, om de jongste uit te geven vóór de eerstgeborene.", "27": "Maak de week van deze vol; dan zullen wij u ook die geven, voor de dienst die u nog zeven andere jaren bij mij dienen zult.", "28": "En Jakob deed zo; en hij maakte de week van deze vol. Toen gaf hij hem Rachel, zijn dochter, hem tot een vrouw.", "29": "En Laban gaf aan zijn dochter Rachel zijn dienstmeisje Bilha, haar tot een dienstmeisje.", "30": "En hij kwam ook bij Rachel, en had ook Rachel liever dan Lea; en hij diende bij hem nog zeven andere jaren.", "31": "Toen de HEERE nu zag dat Lea gehaat was, opende Hij haar baarmoeder; maar Rachel was onvruchtbaar.", "32": "En Lea werd zwanger, en baarde een zoon, en zij noemde zijn naam Ruben; want zij zei: Zeker, de HEERE heeft mijn verdrukking aangezien; daarom zal mijn man mij nu liefhebben.", "33": "En zij werd opnieuw zwanger, en baarde een zoon, en zei: Omdat de HEERE gehoord heeft dat ik gehaat was, heeft Hij mij ook deze gegeven; en zij noemde zijn naam Simeon.", "34": "En zij werd nog zwanger, en baarde een zoon, en zei: Nu zal mijn man zich ditmaal aan mij hechten, omdat ik hem drie zonen gebaard heb; daarom noemde zij zijn naam Levi.", "35": "En zij werd opnieuw zwanger, en baarde een zoon, en zei: Ditmaal zal ik de HEERE loven; daarom noemde zij zijn naam Juda. En zij hield op met baren."}, "SV": {"1": "Toen hief Jakob zijn voeten op, en ging naar het land der kinderen van het Oosten.", "2": "En hij zag toe, en ziet, er was een put in het veld; en ziet, er waren drie kudden schapen nevens dien nederliggende; want uit dien put drenkten zij de kudden; en er was een grote steen op den mond van dien put.", "3": "En derwaarts werden al de kudden verzameld, en zij wentelden den steen van den mond des puts, en drenkten de schapen, en legden den steen weder op den mond van dien put, op zijn plaats.", "4": "Toen zeide Jakob tot hen: Mijn broeders! van waar zijt gij? En zij zeiden: Wij zijn van Haran.", "5": "En hij zeide tot hen: Kent gij Laban, den zoon van Nahor? En zij zeiden: Wij kennen *hem*.", "6": "Voorts zeide hij tot hen: Is het wel met hem? En zij zeiden: Het is wel; en zie, Rachel, zijn dochter, komt met de schapen.", "7": "En hij zeide: Ziet, het is nog hoog dag, het is geen tijd, dat het vee verzameld worde; drenkt de schapen, en gaat heen, weidt *dezelve*.", "8": "Toen zeiden zij: Wij kunnen niet, totdat al de kudden samen zullen vergaderd zijn, en dat men den steen van den mond des puts afwentele, opdat wij de schapen drenken.", "9": "Als hij nog met hen sprak, zo kwam Rachel met de schapen, die haar vader toebehoorden; want zij was een herderin.", "10": "En het geschiedde, als Jakob Rachel zag, de dochter van Laban, zijner moeders broeder, en de schapen van Laban, zijner moeders broeder, dat Jakob toetrad, en wentelde den steen van den mond des puts, en drenkte de schapen van Laban, zijner moeders broeder.", "11": "En Jakob kuste Rachel; en hij hief zijn stem op en weende.", "12": "En Jakob gaf Rachel te kennen, dat hij een broeder van haar vader, en dat hij de zoon van Rebekka was. Toen liep zij heen, en gaf het aan haar vader te kennen.", "13": "En het geschiedde, als Laban die tijding hoorde van Jakob, zijner zusters zoon, zo liep hij hem tegemoet, en omhelsde hem, en kuste hem, en bracht hem tot zijn huis. En hij vertelde Laban al deze dingen.", "14": "Toen zeide Laban tot hem: Voorwaar, gij zijt mijn gebeente en mijn vlees! En hij bleef bij hem een volle maand.", "15": "Daarna zeide Laban tot Jakob: Omdat gij mijn broeder zijt, zoudt gij mij derhalve om niet dienen? verklaar mij, wat zal uw loon zijn?", "16": "En Laban had twee dochters: de naam der grootste was Lea; en de naam der kleinste was Rachel.", "17": "Doch Lea had tedere ogen; maar Rachel was schoon van gedaante, en schoon van aangezicht.", "18": "En Jakob had Rachel lief; en hij zeide: Ik zal u zeven jaren dienen, om Rachel, uw kleinste dochter.", "19": "Toen zeide Laban: Het is beter, dat ik haar aan u geve, dan dat ik haar aan een anderen man geve; blijf bij mij.", "20": "Alzo diende Jakob om Rachel zeven jaren; en die waren in zijn ogen als enige dagen, omdat hij haar liefhad.", "21": "Toen zeide Jakob tot Laban: Geef mijn huisvrouw, want mijn dagen zijn vervuld, dat ik tot haar inga.", "22": "Zo verzamelde Laban al de mannen dier plaats, en maakte een maaltijd.", "23": "En het geschiedde des avonds, dat hij zijn dochter Lea nam, en bracht haar tot hem; en hij ging tot haar in.", "24": "En Laban gaf haar Zilpa, zijn dienstmaagd, aan Lea, zijn dochter, *tot* een dienstmaagd.", "25": "En het geschiedde des morgens, en ziet, het was Lea. Daarom zeide hij tot Laban: Wat is dit, *dat* gij mij gedaan hebt; heb ik niet bij u gediend om Rachel? waarom hebt gij mij dan bedrogen?", "26": "En Laban zeide: Men doet alzo niet te dezer onzer plaatse, dat men de kleinste uitgeve voor de eerstgeborene.", "27": "Vervul de week van deze; dan zullen wij u ook die geven, voor den dienst, dien gij nog andere zeven jaren bij mij dienen zult.", "28": "En Jakob deed alzo; en hij vervulde de week van deze. Toen gaf hij hem Rachel, zijn dochter, hem tot een vrouw.", "29": "En Laban gaf aan zijn dochter Rachel zijn dienstmaagd Bilha, haar tot een dienstmaagd.", "30": "En hij ging ook in tot Rachel, en had ook Rachel liever dan Lea; en hij diende bij hem nog andere zeven jaren.", "31": "Toen nu de HEERE zag, dat Lea gehaat was, opende Hij haar baarmoeder; maar Rachel was onvruchtbaar.", "32": "En Lea werd bevrucht, en baarde een zoon, en zij noemde zijn naam Ruben; want zij zeide: Omdat de HEERE mijn verdrukking heeft aangezien, daarom zal mijn man mij nu liefhebben.", "33": "En zij werd wederom bevrucht, en baarde een zoon, en zeide: Dewijl de HEERE gehoord heeft, dat ik gehaat was, zo heeft Hij mij ook dezen gegeven; en zij noemde zijn naam Simeon.", "34": "En zij werd nog bevrucht, en baarde een zoon, en zeide: Nu zal zich ditmaal mijn man bij mij voegen, dewijl ik hem drie zonen gebaard heb; daarom noemde zij zijn naam Levi.", "35": "En zij werd wederom bevrucht, en baarde een zoon, en zeide: Ditmaal zal ik den HEERE loven; daarom noemde zij zijn naam Juda. En zij hield op van baren."}, "KJV": {"1": "Then Jacob went on his journey, and came into the land of the people of the east.", "2": "And he looked, and behold a well in the field, and, lo, there *were* three flocks of sheep lying by it; for out of that well they watered the flocks: and a great stone *was* upon the well's mouth.", "3": "And thither were all the flocks gathered: and they rolled the stone from the well's mouth, and watered the sheep, and put the stone again upon the well's mouth in his place.", "4": "And Jacob said unto them, My brethren, whence *be* ye? And they said, Of Haran", "5": "And he said unto them, Know ye Laban the son of Nahor? And they said, We know", "6": "And he said unto them, *Is* he well? And they said, *He is* well: and, behold, Rachel his daughter cometh with the sheep.", "7": "And he said, Lo, *it is* yet high day, neither *is it* time that the cattle should be gathered together: water ye the sheep, and go *and* feed", "8": "And they said, We cannot, until all the flocks be gathered together, and *till* they roll the stone from the well's mouth; then we water the sheep.", "9": "And while he yet spake with them, Rachel came with her father's sheep: for she kept them.", "10": "And it came to pass, when Jacob saw Rachel the daughter of Laban his mother's brother, and the sheep of Laban his mother's brother, that Jacob went near, and rolled the stone from the well's mouth, and watered the flock of Laban his mother's brother.", "11": "And Jacob kissed Rachel, and lifted up his voice, and wept.", "12": "And Jacob told Rachel that he *was* her father's brother, and that he *was* Rebekah's son: and she ran and told her father.", "13": "And it came to pass, when Laban heard the tidings of Jacob his sister's son, that he ran to meet him, and embraced him, and kissed him, and brought him to his house. And he told Laban all these things.", "14": "And Laban said to him, Surely thou *art* my bone and my flesh. And he abode with him the space of a month.", "15": "And Laban said unto Jacob, Because thou *art* my brother, shouldest thou therefore serve me for nought? tell me, what *shall* thy wages", "16": "And Laban had two daughters: the name of the elder *was* Leah, and the name of the younger *was* Rachel.", "17": "Leah *was* tender eyed; but Rachel was beautiful and well favoured.", "18": "And Jacob loved Rachel; and said, I will serve thee seven years for Rachel thy younger daughter.", "19": "And Laban said, *It is* better that I give her to thee, than that I should give her to another man: abide", "20": "And Jacob served seven years for Rachel; and they seemed unto him *but* a few days, for the love he had", "21": "And Jacob said unto Laban, Give *me* my wife, for my days are fulfilled, that I may go in", "22": "And Laban gathered together all the men of the place, and made a feast.", "23": "And it came to pass in the evening, that he took Leah his daughter, and brought her to him; and he went in", "24": "And Laban gave unto his daughter Leah Zilpah his maid *for* an handmaid.", "25": "And it came to pass, that in the morning, behold, it *was* Leah: and he said to Laban, What *is* this thou hast done unto me? did not I serve with thee for Rachel? wherefore then hast thou beguiled", "26": "And Laban said, It must not be so done in our country, to give the younger before the firstborn.", "27": "Fulfil her week, and we will give thee this also for the service which thou shalt serve with me yet seven other years.", "28": "And Jacob did so, and fulfilled her week: and he gave him Rachel his daughter to wife", "29": "And Laban gave to Rachel his daughter Bilhah his handmaid to be her maid.", "30": "And he went in also unto Rachel, and he loved also Rachel more than Leah, and served with him yet seven other years.", "31": "And when the LORD saw tha  zij Nahor gebaard heeft.", "Gen 30:15": "En zij zei tegen haar: Is het weinig dat u mijn man genomen hebt, dat u ook de dudaïm van mijn zoon nemen wilt? Toen zei Rachel: Daarom zal hij deze nacht bij u liggen, voor de dudaïm van uw zoon.", "Richt 14:12": "Simson dan zei tegen hen: Ik zal u nu een raadsel te raden geven; als u het mij in de zeven dagen van deze bruiloft goed kunt verklaren en uitvinden, dan zal ik u dertig stel linnen kleren geven, en dertig stellen (extra) kleren.", "Gen 20:14": "Toen nam Abimelech schapen en runderen, ook dienstknechten en dienstmaagden, en gaf ze aan Abraham; en hij gaf hem Sara, zijn vrouw, terug.", "Gen 24:29": "En Rebekka had een broer, wiens naam Laban was; en Laban liep naar buiten naar die man, naar de bron.", "Gen 25:20": "En Izak was veertig jaar oud, toen hij Rebekka, de dochter van Bethuel, de Syriër, uit Paddan-Aram, de zuster van Laban, de Syriër, tot vrouw nam.", "Hoogl 8:6": "Zet mij als een zegel op Uw hart, als een zegel op Uw arm; want de liefde is sterk als de dood; de ijver is hard als het graf; haar kolen zijn vurige kolen, vlammen van de Heere.", "Gen 30:20": "En Lea zei: God heeft mij, mij heeft Hij begiftigd met een goede gift; deze keer zal mijn man mij bijwonen; want ik heb hem zes zonen gebaard; en zij noemde zijn naam Zebulon.", "Gen 25:21": "En Izak bad de HEERE vurig voor zijn vrouw; want zij was onvruchtbaar; en de HEERE liet Zich door hem verbidden, zodat Rebekka, zijn vrouw, zwanger werd.", "Matt 1:2": "Abraham verwekte Izak, en Izak verwekte Jakob, en Jakob verwekte Juda en zijn broers;", "Gen 42:22": "En Ruben antwoordde hun en zei: Heb ik het niet tegen u gezegd toen ik zei: Zondig niet tegen deze jongen! Maar u hoorde niet; en ook zijn bloed, zie, het wordt opgeëist!", "Richt 13:2": "Er was een man uit Zora, uit het geslacht van een Daniet, wiens naam Manoach was; en zijn vrouw was onvruchtbaar en had geen kinderen gebaard.", "Ex 32:26-29": "bleef Mozes staan in de poort van het kamp en zei: Wie de HEERE toebehoort, kom bij mij! Toen verzamelden alle zonen van Levi zich bij hem. En hij zei tegen hen: Zo zegt de HEERE, de God van Israël: Ieder doe zijn zwaard om zijn heup; ga heen en weer, van poort tot poort in het kamp, en ieder dode zijn broeder, en elk zijn vriend, en elk zijn naaste! En de zonen van Levi deden naar het woord van Mozes; en er vielen van het volk, op die dag, ongeveer drieduizend man.", "Dan 9:25": "Weet dan, en versta: van het uitgaan van het woord om te doen terugkeren en om Jeruzalem te bouwen, tot op de Messias, de Vorst, zijn zeven weken, en tweeënzestig weken; de straten en de grachten zullen weer gebouwd worden, maar in benauwdheid van de tijden.", "Gen 29:21-23": "Toen zei Jakob tegen Laban: Geef mij mijn vrouw, want mijn dagen zijn vervuld, zodat ik bij haar kan komen. Zo verzamelde Laban alle mannen van die plaats, en maakte een maaltijd. En het gebeurde 's avonds, dat hij zijn dochter Lea nam, en haar bij hem bracht; en hij kwam bij haar.", "Hand 20:37": "En er ontstond een groot geween bij hen allen; en zij vielen Paulus om de hals en kusten hem;", "Gen 30:9-12": "Toen Lea nu zag dat zij ophield met baren, nam zij ook haar dienstmaagd Zilpa, en gaf haar aan Jakob tot vrouw. En Zilpa, Lea's dienstmaagd, baarde Jakob een zoon. Toen zei Lea: Er komt een hoop! En zij noemde zijn naam Gad.", "Rom 16:16": "Groet elkaar met een heilige kus. De Gemeenten van Christus groeten u.", "Gen 43:8": "Toen zei Juda tegen Israël, zijn vader: Stuur de jongeman met mij mee, dan zullen wij ons opmaken en op reis gaan, opdat wij leven en niet sterven, wij niet, u niet, en ook onze kinderen niet.", "Num 18:2-4": "En ook zult u uw broeders, de stam van Levi, de stam van uw vader, met u laten naderen, zodat zij u worden bijgevoegd, en u dienen; maar u, en uw zonen met u, zult voor de tent der getuigenis zijn. En zij zullen uw wacht waarnemen, en de wacht van de hele tent; maar tot het gereedschap van het heiligdom en het altaar zullen zij niet naderen, opdat zij niet sterven, zij zowel als u. Maar zij zullen u bijgevoegd worden, en de wacht van de tent der samenkomst waarnemen, in alle dienst van de tent; en een vreemde zal u niet naderen.", "Mark 16:3": "en zeiden tegen elkaar: Wie zal ons de steen van de deur van het graf afwentelen?", "Gen 29:23-26": "En het gebeurde 's avonds, dat hij zijn dochter Lea nam, en haar bij hem bracht; en hij kwam bij haar. En Laban gaf haar Zilpa, zijn dienstmeisje, aan Lea, zijn dochter, tot een dienstmeisje. En het gebeurde 's morgens, en zie, het was Lea. Daarom zei hij tegen Laban: Wat is dit dat u mij hebt aangedaan? Heb ik niet bij u gediend voor Rachel? Waarom hebt u mij dan bedrogen?", "Ex 22:16": "Wanneer iemand een maagd verleidt die nog niet ondertrouwd is, en hij slaapt met haar, dan moet hij zonder uitstel een bruidsprijs voor haar betalen, zodat zij zijn vrouw wordt.", "Gen 11:31": "En Terah nam Abram, zijn zoon, en Lot, Harans zoon, de zoon van zijn zoon, en Sarai, zijn schoondochter, de vrouw van zijn zoon Abram, en zij trokken met hen uit Ur der Chaldeeën, om naar het land Kanaän te gaan; en zij kwamen tot Haran, en woonden daar.", "Gen 30:8": "Toen zei Rachel: Ik heb worstelingen van God met mijn zuster geworsteld; ook heb ik de overhand gehad; en zij noemde zijn naam Nafthali.", "Gen 49:6": "Mijn ziel, kom niet in hun verborgen raad; mijn eer, wordt niet verenigd met hun vergadering! Want in hun toorn hebben zij de mannen doodgeslagen, en in hun moedwil hebben zij de ossen verlamd.", "Gen 29:15-20": "Daarna zei Laban tegen Jakob: Omdat u mijn broer bent, zou u mij dan voor niets moeten dienen? Vertel mij, wat zal uw loon zijn? En Laban had twee dochters: de naam van de oudste was Lea; en de naam van de jongste was Rachel. Lea had tere ogen; maar Rachel was mooi van gestalte, en mooi van gezicht.", "Gen 17:16": "Want Ik zal haar zegenen, en u ook uit haar een zoon geven; ja, Ik zal haar zegenen, zodat zij tot volken wordt: koningen van volken zullen uit haar voortkomen!", "Dan 9:27": "En hij zal voor velen het verbond versterken, één week; en in de helft van de week zal hij het slachtoffer en het spijsoffer doen ophouden, en over de gruwelijke vleugel zal een verwoester zijn, ook tot de voleinding toe, die vast besloten is, zal uitgestort worden over de verwoeste.", "2 Sam 19:13": "En tegen Amasa moet u zeggen: Bent u niet mijn gebeente en mijn vlees? God doe mij zo, en meer dan dat, als u niet legeraanvoerder wordt voor mijn aangezicht, alle dagen, in de plaats van Joab.", "Gen 30:25": "En het gebeurde, toen Rachel Jozef gebaard had, dat Jakob tegen Laban zei: Laat mij vertrekken, dat ik ga naar mijn plaats, en naar mijn land.", "Gen 43:30": "En Jozef haastte zich; want zijn hart werd bewogen om zijn broer, en hij zocht een plek om te wenen; en hij ging een kamer in, en weende daar.", "Gen 37:22": "Ook zei Ruben tegen hen: Vergiet geen bloed; werpt hem in deze kuil die in de woestijn is, en legt de hand niet aan hem; opdat hij hem uit hun hand zou verlossen, om hem tot zijn vader terug te brengen.", "Gen 30:1-25": "Toen Rachel zag dat zij Jakob geen kinderen gaf, benijdde Rachel haar zuster; en zij zei tegen Jakob: Geef mij kinderen! Anders ben ik dood. Toen ontstak Jakobs toorn tegen Rachel, en hij zei: Ben ik dan in de plaats van God, Die de vrucht van uw buik van u geweerd heeft? En zij zei: Zie, daar is mijn dienstmaagd Bilha, ga bij haar; dat zij op mijn knieën baart, en ik ook uit haar gebouwd word.", "Gen 2:23": "Toen zei Adam: Dit is ditmaal been van mijn benen, en vlees van mijn vlees! Men zal haar Manninne noemen, omdat zij uit de man genomen is.", "Gen 29:12-30": "En Jakob liet Rachel weten dat hij een broer van haar vader was, en dat hij de zoon van Rebekka was. Toen liep zij snel weg, en liet het haar vader weten. En het gebeurde, toen Laban het bericht hoorde over Jakob, de zoon van zijn zuster, dat hij hem tegemoet snelde, en hem omhelsde, en hem kuste, en hem naar zijn huis bracht. En hij vertelde Laban al deze dingen. Toen zei Laban tegen hem: Voorwaar, u bent mijn gebeente en mijn vlees! En hij bleef bij hem een volle maand.", "Gen 38:1-30": "En het gebeurde in die tijd, dat Juda van zijn broers wegtrok, en hij ging naar een man uit Adullam, wiens naam Hira was. En Juda zag daar de dochter van een Kanaänitische man, wiens naam Sua was; en hij nam haar, en ging tot haar in. En zij werd zwanger en baarde een zoon, en hij noemde hem Er.", "Gen 37:14": "En hij zei tegen hem: Ga toch heen, zie naar het welzijn van uw broers en naar het welzijn van de kudde, en breng mij een woord terug. Zo zond hij hem uit het dal Hebron, en hij kwam te Sichem.", "Luk 7:45": "U hebt Mij geen kus gegeven; maar deze heeft, vanaf het moment dat zij binnenkwam, niet opgehouden Mijn voeten te kussen.", "Ex 18:7": "Toen ging Mozes naar buiten, zijn schoonvader tegemoet, en hij boog zich, en kuste hem; en zij vroegen elkaar naar hun welstand, en zij gingen naar de tent.", "Gen 8:10-12": "En hij wachtte nog zeven andere dagen; toen liet hij de duif opnieuw uit de ark. En de duif kwam tot hem tegen de avondtijd; en zie, een afgebroken olijfblad was in haar bek; zo merkte Noach dat de wateren van boven de aarde gezakt waren. Toen wachtte hij nog zeven andere dagen; en hij liet de duif uit; maar zij keerde niet meer terug naar hem.", "Ef 5:16": "en koop de tijd uit, omdat de dagen slecht zijn.", "Ex 1:2": "Ruben, Simeon, Levi en Juda;", "Ef 5:30": "Want wij zijn leden van Zijn lichaam, van Zijn vlees en van Zijn benen.", "Gen 33:5": "Daarna sloeg hij zijn ogen op en zag die vrouwen en die kinderen, en zei: Wie zijn dit bij u? En hij zei: De kinderen die God aan uw knecht genadig gegeven heeft.", "Ex 2:21": "En Mozes stemde ermee in bij de man te wonen; en hij gaf Mozes zijn dochter Zippora.", "Gen 42:27": "Toen één zijn zak opendeed om zijn ezel voer te geven in de herberg, zag hij zijn geld; want zie, het was in de opening van zijn zak.", "Gen 31:4": "Toen liet Jakob Rachel en Lea roepen, naar het veld bij zijn kudde;", "Gen 24:59": "Toen lieten zij Rebekka, hun zuster, en haar voedster vertrekken, alsook de knecht van Abraham en zijn mannen.", "Ps 127:3": "Zie, de kinderen zijn een erfdeel van de HEERE; de vrucht van de buik is een beloning.", "Ex 2:17": "Toen kwamen de herders, en zij verjoegen hen; maar Mozes stond op, en hielp hen, en liet hun kudden drinken.", "Gen 24:28": "En dat meisje liep, en vertelde in het huis van haar moeder hoe deze zaken waren.", "1 Sam 1:27": "Ik bad om dit kind, en de HEERE heeft mij gegeven wat ik van Hem gebeden heb.", "Gen 30:19": "En Lea werd opnieuw zwanger, en zij baarde Jakob de zesde zoon.", "Gen 2:3": "En God heeft de zevende dag gezegend, en die geheiligd; omdat Hij daarop gerust heeft van al Zijn werk, dat God geschapen had om te volmaken.", "Luk 14:26": "Als iemand bij Mij komt en niet zijn vader, en moeder, en vrouw, en kinderen, en broers, en zussen, ja, zelfs ook zijn eigen leven haat, die kan Mijn discipel niet zijn.", "Gen 24:20": "En zij haastte zich, en goot haar kruik leeg in de drinkbak, en liep weer naar de put om te putten, en zij putte voor al zijn kamelen.", "Gen 4:1": "En Adam had gemeenschap met Eva, zijn vrouw, en zij werd zwanger en baarde Kaïn, en zei: Ik heb een man van de HEERE verkregen!", "Gen 38:15": "Toen Juda haar zag, hield hij haar voor een hoer, omdat zij haar gezicht bedekt had.", "Richt 13:3": "En een Engel van de HEERE verscheen aan deze vrouw, en Hij zei tegen haar: Zie toch, u bent onvruchtbaar en hebt geen kinderen gebaard; maar u zult zwanger worden en een zoon baren.", "Gen 30:1-3": "Toen Rachel zag dat zij Jakob geen kinderen gaf, benijdde Rachel haar zuster; en zij zei tegen Jakob: Geef mij kinderen! Anders ben ik dood. Toen ontstak Jakobs toorn tegen Rachel, en hij zei: Ben ik dan in de plaats van God, Die de vrucht van uw buik van u geweerd heeft? En zij zei: Zie, daar is mijn dienstmaagd Bilha, ga bij haar; dat zij op mijn knieën baart, en ik ook uit haar gebouwd word.", "Joh 2:1-10": "En op de derde dag was er een bruiloft te Kana in Galilea; en de moeder van Jezus was daar. En Jezus was ook genodigd, en Zijn discipelen, op de bruiloft. En toen de wijn ontbrak, zei de moeder van Jezus tegen Hem: Zij hebben geen wijn.", "Gen 31:15": "Worden wij niet door hem als vreemden beschouwd? Want hij heeft ons verkocht, en hij heeft ook steeds ons geld verteerd.", "Joh 21:17": "Hij zei tegen hem voor de derde keer: Simon, zoon van Jonas, hebt u Mij lief? Petrus werd bedroefd, omdat Hij voor de derde keer tegen hem zei: Hebt u Mij lief? en hij zei tegen Hem: Heere! U weet alle dingen, U weet dat ik U liefheb. Jezus zei tegen hem: Weid Mijn schapen.", "Gen 29:6-12": "Verder zei hij tegen hen: Gaat het goed met hem? En zij zeiden: Het gaat goed; en zie, Rachel, zijn dochter, komt met de schapen. En hij zei: Zie, het is nog volop dag, het is geen tijd om het vee te verzamelen; drenk de schapen, en ga heen, weid ze. Toen zeiden zij: Dat kunnen wij niet, totdat alle kudden samen zijn verzameld, en men de steen van de mond van de put afwentelt, zodat wij de schapen kunnen drenken.", "Gen 35:19": "Zo stierf Rachel; en zij werd begraven aan de weg naar Efrath, dat is Bethlehem.", "Gen 35:26": "En de zonen van Zilpa, Lea's dienstmaagd: Gad en Aser. Dit zijn de zonen van Jakob, die hem geboren zijn in Paddan-Aram.", "Luk 1:7": "En zij hadden geen kind, omdat Elizabet onvruchtbaar was, en zij waren beiden al ver op hun dagen gekomen.", "Gen 20:18": "Want de HEERE had al de baarmoeders van het huis van Abimelech helemaal gesloten, vanwege Sara, Abrahams vrouw.", "Gen 29:31-35": "Toen de HEERE nu zag dat Lea gehaat was, opende Hij haar baarmoeder; maar Rachel was onvruchtbaar. En Lea werd zwanger, en baarde een zoon, en zij noemde zijn naam Ruben; want zij zei: Zeker, de HEERE heeft mijn verdrukking aangezien; daarom zal mijn man mij nu liefhebben. En zij werd opnieuw zwanger, en baarde een zoon, en zei: Omdat de HEERE gehoord heeft dat ik gehaat was, heeft Hij mij ook deze gegeven; en zij noemde zijn naam Simeon.", "1 Kron 2:1": "Dit zijn de kinderen van Israël: Ruben, Simeon, Levi en Juda, Issaschar en Zebulon,", "Openb 3:19": "Ieder die Ik liefheb, die bestraf en tuchtig Ik; wees dan ijverig, en bekeer u.", "2 Sam 20:9": "En Joab zei tegen Amasa: Is het goed met u, mijn broeder? En Joab pakte met de rechterhand de baard van Amasa, om hem te kussen.", "Gen 30:22": "God dacht ook aan Rachel; en God verhoorde haar, en opende haar baarmoeder.", "Gen 29:25-32": "En het gebeurde 's morgens, en zie, het was Lea. Daarom zei hij tegen Laban: Wat is dit dat u mij hebt aangedaan? Heb ik niet bij u gediend voor Rachel? Waarom hebt u mij dan bedrogen? En Laban zei: Zo doet men het niet in ons land, om de jongste uit te geven vóór de eerstgeborene. Maak de week van deze vol; dan zullen wij u ook die geven, voor de dienst die u nog zeven andere jaren bij mij dienen zult.", "1 Sam 1:5": "Maar aan Hanna gaf hij een aanzienlijk deel, want hij had Hanna lief; doch de HEERE had haar baarmoeder toegesloten.", "Gen 49:5-7": "Simeon en Levi zijn broers! Hun wapens zijn werktuigen van geweld! Mijn ziel, kom niet in hun verborgen raad; mijn eer, wordt niet verenigd met hun vergadering! Want in hun toorn hebben zij de mannen doodgeslagen, en in hun moedwil hebben zij de ossen verlamd. Vervloekt is hun toorn, want hij is heftig; en hun verbolgenheid, want zij is hard! Ik zal hen verdelen onder Jakob, en zal hen verstrooien onder Israël.", "Gen 31:39-42": "Het verscheurde heb ik niet naar u toe gebracht; ik heb het zelf vergoed; u eiste het van mijn hand, of het nu overdag gestolen was, of 's nachts gestolen was. Ik ben zo geweest, dat overdag de hitte mij verteerde, en 's nachts de vorst, en dat mijn slaap van mijn ogen week. Ik ben nu twintig jaar in uw huis geweest; ik heb u veertien jaar gediend voor uw beide dochters, en zes jaar voor uw kudde; en u hebt mijn loon tien keer veranderd.", "Gen 38:16": "En hij ging naar haar toe, opzij van de weg, en zei: Kom toch, laat mij bij u ingaan; want hij wist niet dat zij zijn schoondochter was. En zij zei: Wat zult u mij geven, dat u bij mij ingaat?", "Richt 1:7": "Toen zei Adoni-bezek: Zeventig koningen, van wie de duimen van hun handen en voeten waren afgehouwen, verzamelden de kruimen onder mijn tafel; zoals ik gedaan heb, zo heeft God mij vergolden! En zij brachten hem naar Jeruzalem, en hij stierf daar.", "Gen 37:2": "Dit zijn Jakobs geschiedenissen. Jozef, een zoon van zeventien jaren, weidde de kudde met zijn broeders (en hij was een jongeling), met de zonen van Bilha en de zonen van Zilpa, de vrouwen van zijn vader; en Jozef bracht hun kwaad gerucht over aan hun vader.", "Gen 35:25": "En de zonen van Bilha, Rachels dienstmaagd: Dan en Naftali.", "Gen 49:3": "Ruben! U bent mijn eerstgeborene, mijn kracht, en het begin van mijn macht; de voortreffelijkste in hoogheid, en de voortreffelijkste in sterkte!", "Richt 6:3": "Want het gebeurde, als Israël gezaaid had, dan kwamen de Midianieten op, en de Amalekieten, en zij die uit het oosten kwamen, kwamen ook tegen hen op.", "Ex 3:7": "En de HEERE zei: Ik heb heel goed gezien de verdrukking van Mijn volk dat in Egypte is, en heb hun geschrei gehoord vanwege hun drijvers; want Ik ken hun smarten.", "Gen 46:9": "En de zonen van Ruben: Hanoch, en Pallu, en Hezron, en Karmi.", "Gen 29:9-12": "Terwijl hij nog met hen sprak, kwam Rachel met de schapen die haar vader toebehoorden; want zij was een herderin. En het gebeurde, toen Jakob Rachel zag, de dochter van Laban, de broer van zijn moeder, en de schapen van Laban, de broer van zijn moeder, dat Jakob dichterbij kwam, en de steen van de mond van de put wentelde, en de schapen van Laban, de broer van zijn moeder, drenkte. En Jakob kuste Rachel; en hij verhief zijn stem en huilde.", "1 Sam 2:21": "Want de HEERE bezocht Hanna, en zij werd zwanger en baarde drie zonen en twee dochters; en de jongen Samuël werd groot bij de HEERE.", "1 Kron 5:2": "want Juda werd machtig onder zijn broeders, en hij die tot een voorganger was, kwam uit hem; maar het eerstgeboorterecht was van Jozef.)", "Matt 6:24": "Niemand kan twee heren dienen; want of hij zal de één haten en de ander liefhebben, of hij zal de één aanhangen en de ander verachten. U kunt niet God dienen en de Mammon.", "1 Kron 2:9": "En de kinderen van Hezron, die hem geboren zijn, waren Jerahmeel, en Ram, en Chelubai.", "Hos 12:13": "Jakob vluchtte toch naar het veld van Syrië, en Israël diende om een vrouw, en hoedde de kudde om een vrouw.", "Gen 24:14": "laat het zo gebeuren, dat het meisje tegen wie ik zal zeggen: Neig toch uw kruik, zodat ik drink; en zij zal zeggen: Drink, en ik zal ook uw kamelen drenken; laat zíj degene zijn die U aan Uw knecht Izak toegewezen hebt, en laat ik daaraan bekennen dat U weldadigheid aan mijn heer bewezen hebt.", "Gen 24:16": "En dat meisje was zeer mooi van aangezicht, een maagd, en geen man had haar bekend; en zij ging naar beneden naar de bron, en vulde haar kruik, en ging weer omhoog.", "Gen 29:18-30": "En Jakob had Rachel lief; en hij zei: Ik zal u zeven jaar dienen, voor Rachel, uw jongste dochter. Toen zei Laban: Het is beter dat ik haar aan u geef, dan dat ik haar aan een andere man geef; blijf bij mij. Zo diende Jakob zeven jaar voor Rachel; en die waren in zijn ogen als enkele dagen, omdat hij haar liefhad.", "Gen 39:6": "En hij liet alles wat hij had over aan Jozefs hand, zodat hij met hem van geen ding kennis had, behalve van het brood dat hij at. En Jozef was mooi van gestalte, en mooi van gezicht.", "Matt 22:12": "En hij zei tegen hem: Vriend! Hoe bent u hier binnengekomen zonder een bruiloftskleed aan te hebben? En hij verstomde.", "1 Sam 17:22": "David nu liet zijn spullen achter bij de bewaarder van de spullen, en hij liep naar de slagorde toe; en hij kwam en vroeg zijn broers hoe het met hen ging.", "Gen 45:2": "En hij verhief zijn stem met wenen, zodat de Egyptenaren het hoorden, en dat het huis van Farao het hoorde.", "Ex 4:27": "De HEERE zei ook tegen Aäron: Ga Mozes tegemoet in de woestijn. En hij ging, en ontmoette hem bij de berg van God, en kuste hem.", "Gen 24:15": "En het gebeurde, voordat hij klaar was met spreken, zie, dat Rebekka naar buiten kwam, die geboren was aan Bethuël, de zoon van Milka, de vrouw van Nahor, de broer van Abraham; en zij had haar kruik op haar schouder.", "Gen 46:8-27": "En dit zijn de namen van de zonen van Israël die naar Egypte kwamen: Jakob en zijn zonen. De eerstgeborene van Jakob: Ruben. En de zonen van Ruben: Hanoch, en Pallu, en Hezron, en Karmi. En de zonen van Simeon: Jemuël, en Jamin, en Ohad, en Jachin, en Zohar, en Saul, de zoon van een Kanaänitische vrouw.", "Hoogl 1:6": "Kijk niet naar mij, omdat ik zwartachtig ben, omdat de zon op mij heeft geschenen; de kinderen van mijn moeder waren tegen mij ontstoken, zij hebben mij aangesteld tot een hoedster van de wijngaarden. Mijn eigen wijngaard heb ik niet gehoed.", "Gen 43:32": "En zij richtten voor hem apart aan, en voor hen apart; en voor de Egyptenaren, die met hem aten, apart; want de Egyptenaren mogen geen brood eten met de Hebreeën, omdat dat voor de Egyptenaren een gruwel is.", "Richt 6:33": "Alle Midianieten nu, en Amalekieten, en de mensen uit het oosten, waren bijeengebracht, en zij trokken over, en legerden zich in het dal van Jizreël.", "Gen 31:53": "De God van Abraham, en de God van Nahor, de God van hun vader, oordele tussen ons! En Jakob zwoer bij de Vreze van zijn vader Izak.", "Gen 30:1": "Toen Rachel zag dat zij Jakob geen kinderen gaf, benijdde Rachel haar zuster; en zij zei tegen Jakob: Geef mij kinderen! Anders ben ik dood.", "Job 1:21": "En hij zei: Naakt ben ik uit mijn moeders buik gekomen, en naakt zal ik daarheen terugkeren. De HEERE heeft gegeven, en de HEERE heeft genomen; de Naam van de HEERE zij geloofd!", "Gen 30:6": "Toen zei Rachel: God heeft mij recht gedaan, en heeft ook mijn stem verhoord, en heeft mij een zoon gegeven; daarom noemde zij zijn naam Dan.", "Hos 3:2": "En ik kocht haar voor mij voor vijftien zilverstukken, en een homer gerst, en een halve homer gerst.", "1 Sam 18:28": "En Saul zag en merkte dat de HEERE met David was; en Michal, de dochter van Saul, had hem lief.", "Gen 46:8": "En dit zijn de namen van de zonen van Israël die naar Egypte kwamen: Jakob en zijn zonen. De eerstgeborene van Jakob: Ruben.", "Num 23:7": "Toen begon hij zijn spreuk, en zei: Uit Syrië heeft Balak, de koning van de Moabieten, mij laten halen, van het gebergte in het oosten, en zei: Kom, vervloek Jakob voor mij, en kom, scheld Israël uit!", "Hebr 7:10": "want hij was nog in de lenden van zijn vader, toen Melchizedek hem tegemoet ging.", "Gen 24:13": "Zie, ik sta bij de waterbron, en de dochters van de mannen van deze stad komen naar buiten om water te putten;", "Gen 24:10": "En die knecht nam tien kamelen van de kamelen van zijn heer, en vertrok; en al het goed van zijn heer had hij bij zich; en hij stond op, en vertrok naar Mesopotamië, naar de stad van Nahor.", "Openb 19:9": "En hij zei tegen mij: Schrijf, zalig zijn zij die geroepen zijn tot het avondmaal van de bruiloft van het Lam. En hij zei tegen mij: Deze zijn de waarachtige woorden van God.", "Gen 29:8-10": "Toen zeiden zij: Dat kunnen wij niet, totdat alle kudden samen zijn verzameld, en men de steen van de mond van de put afwentelt, zodat wij de schapen kunnen drenken. Terwijl hij nog met hen sprak, kwam Rachel met de schapen die haar vader toebehoorden; want zij was een herderin. En het gebeurde, toen Jakob Rachel zag, de dochter van Laban, de broer van zijn moeder, en de schapen van Laban, de broer van zijn moeder, dat Jakob dichterbij kwam, en de steen van de mond van de put wentelde, en de schapen van Laban, de broer van zijn moeder, drenkte.", "Openb 7:17": "Want het Lam, Dat in het midden van de troon is, zal hen weiden, en zal hun een Leidsman zijn tot levende fonteinen van water; en God zal alle tranen van hun ogen afwissen.", "Gen 35:24": "De zonen van Rachel: Jozef en Benjamin.", "Gen 12:11": "En het gebeurde, toen hij Egypte naderde om daar binnen te gaan, dat hij tegen Sarai, zijn vrouw, zei: Zie toch, ik weet dat u een vrouw bent die knap is om te zien.", "Ef 5:2": "en wandel in de liefde, zoals ook Christus ons liefgehad heeft, en Zichzelf voor ons heeft overgegeven als een offerande en een slachtoffer, God tot een welriekende reuk.", "Gen 30:13": "Toen zei Lea: Tot mijn geluk! Want de dochters zullen mij gelukkig noemen; en zij noemde zijn naam Aser.", "Gen 48:7": "Toen ik nu van Paddan kwam, is Rachel bij mij gestorven in het land Kanaän, op de weg, toen er nog maar een klein stuk land was om tot Efrath te komen; en ik begroef haar daar aan de weg van Efrath, dat is Bethlehem.", "Gen 43:9": "Ik zal borg voor hem zijn; van mijn hand zult u hem eisen; als ik hem niet bij u breng en voor uw gezicht stel, dan heb ik alle dagen tegen u gezondigd!", "Gen 30:3-8": "En zij zei: Zie, daar is mijn dienstmaagd Bilha, ga bij haar; dat zij op mijn knieën baart, en ik ook uit haar gebouwd word. Zo gaf zij hem haar dienstmaagd Bilha tot vrouw; en Jakob ging bij haar. En Bilha werd zwanger, en baarde Jakob een zoon.", "Gen 30:28": "Hij zei dan: Noem mij uitdrukkelijk uw loon, dat ik geven zal.", "Dan 9:24": "Zeventig weken zijn bestemd over uw volk en over uw heilige stad, om de overtreding te sluiten, en om de zonden te verzegelen, en om de ongerechtigheid te verzoenen, en om een eeuwige gerechtigheid aan te brengen, en om het visioen en de profeet te verzegelen, en om het allerheiligst te zalven.", "Joh 4:6": "En daar was de fontein van Jakob. Jezus dan, vermoeid van de reis, ging zo bij de fontein zitten. Het was ongeveer het zesde uur.", "2 Sam 19:39": "Toen nu heel het volk de Jordaan overgegaan was, en de koning ook overgegaan was, kuste de koning Barzillai, en zegende hem; en die keerde terug naar zijn woonplaats.", "1 Kor 3:13": "Ieders werk zal openbaar worden; want de dag zal het aan het licht brengen, omdat het door vuur ontdekt wordt; en hoedanig ieders werk is, zal het vuur beproeven.", "Gen 30:17": "En God verhoorde Lea; en zij werd zwanger, en baarde Jakob de vijfde zoon.", "Ps 107:38": "En Hij zegent hen, zodat zij zeer meer worden, en hun vee vermindert Hij niet.", "Hand 7:4": "Toen ging hij weg uit het land van de Chaldeeën, en woonde in Haran. En vandaar, nadat zijn vader gestorven was, bracht Hij hem over naar dit land, waarin u nu woont.", "Est 2:18": "Toen maakte de koning een grote maaltijd voor al zijn vorsten en zijn knechten, de maaltijd van Esther; en hij gaf de landschappen rust, en hij gaf geschenken naar het vermogen van de koning.", "Gen 44:20": "Toen zeiden wij tegen mijn heer: Wij hebben een oude vader, en een jongen van het ouderdom, de kleinste, wiens broer dood is, en hij is alleen van zijn moeder overgebleven, en zijn vader heeft hem lief.", "Joh 12:25": "Wie zijn leven liefheeft, zal het verliezen; en wie zijn leven haat in deze wereld, zal het bewaren tot het eeuwige leven.", "Ruth 4:10": "Daarbij koop ik ook Ruth, de Moabitische, de vrouw van Machlon, tot vrouw, om de naam van de gestorvene te doen voortbestaan over zijn erfdeel, opdat de naam van de gestorvene niet wordt uitgeroeid onder zijn broeders en uit de poort van zijn woonplaats; u bent heden getuigen.", "Gen 27:43": "Nu dan, mijn zoon! luister naar mijn stem, en maak u op, vlucht naar Haran, naar Laban, mijn broer.", "Gen 17:20": "En wat Ismaël betreft, Ik heb u verhoord; zie, Ik heb hem gezegend, en zal hem vruchtbaar maken, en hem heel erg veel meer maken; twaalf vorsten zal hij voortbrengen, en Ik zal hem tot een groot volk maken;", "Gen 35:20": "En Jakob richtte een gedenkteken op boven haar graf; dit is het gedenkteken van Rachels graf tot op deze dag.", "2 Sam 3:14": "Ook zond David boden naar Isboseth, de zoon van Saul, en zei: Geef mij mijn vrouw Michal, die ik mij met honderd voorhuiden van de Filistijnen ondertrouwd heb.", "Matt 2:18": "Een stem is in Rama gehoord, geklaag, geween en veel gekerm; Rachel beweende haar kinderen, en wilde niet getroost worden, omdat zij er niet meer zijn!", "Matt 22:3": "En hij zond zijn dienstknechten uit om de genode gasten naar de bruiloft te roepen; en zij wilden niet komen.", "Gen 24:61": "En Rebekka stond op met haar dienstmeisjes, en zij reden op kamelen, en volgden de man; en die knecht nam Rebekka, en vertrok.", "Deut 21:15": "Wanneer een man twee vrouwen heeft, een geliefde en een gehate, en de geliefde en de gehate hem zonen gebaard hebben, en de eerstgeboren zoon van de gehate is;", "Gen 34:25": "En het gebeurde op de derde dag, toen zij in pijn waren, dat de twee zonen van Jakob, Simeon en Levi, broers van Dina, ieder zijn zwaard namen, en stout de stad binnenkwamen, en allen doodden die mannelijk waren.", "Deut 26:7": "Toen riepen wij tot de HEERE, de God van onze vaderen; en de HEERE hoorde onze stem en zag onze ellende aan, en onze arbeid, en onze onderdrukking.", "1 Sam 1:11": "En zij deed een gelofte, en zei: HEERE van de heerscharen, als U werkelijk de ellende van Uw dienstmaagd aanziet, en aan mij denkt, en Uw dienstmaagd niet vergeet, maar aan Uw dienstmaagd een zoon geeft, dan zal ik hem aan de HEERE geven al de dagen van zijn leven, en er zal geen scheermes op zijn hoofd komen.", "Gen 34:12": "Vraag gerust een hoge bruidsprijs en geschenk van mij; en ik zal geven zoals u tegen mij zult zeggen; geef mij alleen de jonge vrouw tot vrouw.", "Mal 2:15": "Heeft Hij niet maar één gemaakt, hoewel Hij van de Geest overvloed had? En waarom die ene? Hij zocht een zaad van God. Daarom, wees op uw hoede met uw geest, en laat niemand trouweloos handelen tegen de vrouw van zijn jeugd.", "Gen 46:15": "Dit zijn de zonen van Lea, die zij Jakob gebaard heeft in Paddan-Aram, samen met Dina, zijn dochter; al de zielen van zijn zonen en zijn dochters waren drieëndertig.", "2 Sam 16:12": "Misschien zal de HEERE naar mijn ellende omzien; en de HEERE zal mij goed vergelden voor zijn vloek van vandaag.", "Gen 37:29": "Toen Ruben nu naar de kuil terugkeerde, zie, Jozef was niet meer in de kuil; toen scheurde hij zijn kleren.", "Matt 7:2": "Want met het oordeel waarmee u oordeelt, zult u geoordeeld worden; en met de maat waarmee u meet, zal u weer gemeten worden.", "Gen 35:18": "En het gebeurde, toen haar ziel heenging (want zij stierf), dat zij zijn naam Ben-Oni noemde; maar zijn vader noemde hem Benjamin.", "Gen 16:1": "Sarai, Abrams vrouw, kreeg geen kinderen van hem; en zij had een Egyptische dienstmaagd, wier naam Hagar was.", "Ex 1:1-5": "Dit zijn de namen van de zonen van Israël, die met Jakob in Egypte gekomen zijn; ieder kwam er met zijn huisgezin. Ruben, Simeon, Levi en Juda; Issaschar, Zebulon en Benjamin;", "Gen 43:27": "En hij vroeg hun naar hun welzijn, en zei: Gaat het goed met uw vader, de oude man, over wie u zei? Leeft hij nog?", "Gen 42:24": "Toen wendde hij zich van hen af, en huilde; daarna keerde hij weer naar hen terug, en sprak tegen hen, en nam Simeon van hen weg, en bond hem voor hun ogen.", "1 Kron 5:1": "De kinderen van Ruben nu, de eerstgeborene van Israël; (want hij was de eerstgeborene; maar omdat hij het bed van zijn vader ontheiligd had, werd zijn eerstgeboorterecht gegeven aan de kinderen van Jozef, de zoon van Israël; maar niet zó, dat hij zich in het geslachtsregister naar het eerstgeboorterecht mocht laten rekenen;", "Gen 24:19": "Toen zij klaar was met hem te drinken te geven, zei zij: Ik zal ook voor uw kamelen putten, totdat zij klaar zijn met drinken.", "Micha 7:5": "Geloof een vriend niet, vertrouw niet op een boezemvriend; bewaar de deuren van uw mond voor haar die in uw schoot ligt.", "Joh 4:14": "maar wie gedronken zal hebben van het water dat Ik hem geven zal, die zal in eeuwigheid geen dorst meer krijgen; maar het water dat Ik hem zal geven, zal in hem worden een fontein van water, opwellend tot in het eeuwige leven.", "Gen 4:25": "En Adam had opnieuw gemeenschap met zijn vrouw, en zij baarde een zoon, en zij noemde zijn naam Seth; want God heeft mij, zei zij, een ander nageslacht gegeven in de plaats van Abel; want Kaïn heeft hem doodgeslagen.", "Gen 45:14": "En hij viel om de hals van Benjamin, zijn broer, en weende; en Benjamin weende om zijn hals.", "Richt 14:10": "Toen zijn vader afgekomen was naar die vrouw, maakte Simson daar een bruiloftsfeest, want zo plachten de jongemannen te doen.", "Gen 33:4": "Toen liep Ezau hem tegemoet, en nam hem in zijn armen, en viel hem om de hals, en kuste hem; en zij huilden.", "Ps 23:2": "Hij laat mij neerliggen in grazige weiden; Hij voert mij zachtjes naar zeer stille wateren.", "Gen 46:12": "En de zonen van Juda: Er, en Onan, en Sela, en Perez, en Zerah. Maar Er en Onan waren gestorven in het land Kanaän; en de zonen van Perez waren Hezron en Hamul.", "Gen 31:36-42": "Toen werd Jakob boos, en twistte met Laban; en Jakob antwoordde en zei tegen Laban: Wat is mijn overtreding, wat is mijn zonde, dat u mij zo heftig achterna hebt gejaagd? Nu u al mijn huisraad doorzocht hebt, wat hebt u gevonden van al het huisraad van uw huis! Leg het hier voor mijn broeders en uw broeders, en laat hen oordelen tussen ons beiden. Deze twintig jaar ben ik bij u geweest; uw ooien en uw geiten hebben niet misdragen, en de rammen van uw kudde heb ik niet gegeten.", "Mal 1:3": "en Ezau heb Ik gehaat; en Ik heb zijn bergen gesteld tot een verwoesting, en zijn erfdeel voor de jakhalzen van de woestijn.", "Gen 22:20-23": "En het gebeurde na deze dingen dat men Abraham berichtte: Zie, Milka heeft ook zonen gebaard aan Nahor, uw broer: Uz, zijn eerstgeborene, en Buz, zijn broer, en Kemuël, de vader van Aram, En Chesed, en Hazo, en Pildas, en Jidlaf, en Bethuël;", "Gen 28:10": "Jakob dan trok weg van Ber-Seba, en ging naar Haran.", "Deut 33:8-10": "En van Levi zei hij: Uw Tummim en Uw Urim zijn bij de man, Uw gunstgenoot, die Gij beproefd hebt in Massa, met wie Gij getwist hebt aan de wateren van Meriba. Die tegen zijn vader en tegen zijn moeder zei: Ik zie hem niet; en die zijn broeders niet kende, en zijn zonen niet achtte; want zij onderhielden Uw woord, en bewaarden Uw verbond. Zij zullen Jakob Uw rechten leren, en Israël Uw wet; zij zullen reukwerk voor Uw neus leggen, en dat helemaal verteerd zal worden, op Uw altaar.", "Hoogl 8:7": "Veel water zou deze liefde niet kunnen uitblussen; ja, de rivieren zouden ze niet verdrinken; al gaf iemand al het goed van zijn huis voor deze liefde, men zou hem volkomen verachten.", "Gen 29:2-10": "En hij keek, en zie, er was een put in het veld; en zie, er waren drie kudden schapen ernaast neerliggend; want uit die put drenkten zij de kudden; en er was een grote steen op de mond van die put. En daar werden alle kudden verzameld, en zij wentelden de steen van de mond van de put, en drenkten de schapen, en legden de steen weer op de mond van die put, op zijn plaats. Toen zei Jakob tegen hen: Mijn broeders! Waar komt u vandaan? En zij zeiden: Wij komen uit Haran.", "Gen 30:2": "Toen ontstak Jakobs toorn tegen Rachel, en hij zei: Ben ik dan in de plaats van God, Die de vrucht van uw buik van u geweerd heeft?", "Gen 35:22": "En het gebeurde, toen Israël in dat land woonde, dat Ruben heenging en lag bij Bilha, het bijvrouw van zijn vader; en Israël hoorde het. En de zonen van Jakob waren twaalf.", "Gen 30:27-43": "Toen zei Laban tegen hem: Als ik toch genade gevonden heb in uw ogen; ik heb ondervonden dat de HEERE mij om u gezegend heeft. Hij zei dan: Noem mij uitdrukkelijk uw loon, dat ik geven zal. Toen zei hij tegen hem: U weet hoe ik u gediend heb, en hoe uw vee bij mij geweest is.", "Gen 35:22-26": "En het gebeurde, toen Israël in dat land woonde, dat Ruben heenging en lag bij Bilha, het bijvrouw van zijn vader; en Israël hoorde het. En de zonen van Jakob waren twaalf. De zonen van Lea waren: Ruben, Jakobs eerstgeborene, daarna Simeon, en Levi, en Juda, en Issaschar, en Zebulon. De zonen van Rachel: Jozef en Benjamin.", "Gen 49:8": "Juda! U bent het, u zullen uw broers loven; uw hand zal zijn op de nek van uw vijanden; voor u zullen de zonen van uw vader zich neerbuigen.", "Gen 30:4": "Zo gaf zij hem haar dienstmaagd Bilha tot vrouw; en Jakob ging bij haar.", "Gen 2:2": "Toen God op de zevende dag Zijn werk voltooid had, dat Hij gemaakt had, heeft Hij op de zevende dag gerust van al Zijn werk, dat Hij gemaakt had.", "Gen 34:30": "Toen zei Jakob tegen Simeon en tegen Levi: U hebt mij in het ongeluk gestort, doordat u mij stinkend maakt onder de inwoners van dit land, onder de Kanaänieten en onder de Ferezieten; en ik heb weinig volk in aantal; als zij zich tegen mij verzamelen, zullen zij mij verslaan, en ik zal vernietigd worden, ik en mijn huis.", "Gen 27:35": "En hij zei: Uw broer is gekomen met bedrog, en heeft uw zegen weggenomen.", "Luk 24:2": "En zij vonden de steen afgewenteld van het graf.", "2 Sam 5:1": "Toen kwamen alle stammen van Israël naar David in Hebron, en zij zeiden: Zie, wij zijn uw gebeente en uw vlees.", "Gen 30:22-24": "God dacht ook aan Rachel; en God verhoorde haar, en opende haar baarmoeder. En zij werd zwanger, en baarde een zoon; en zij zei: God heeft mijn smaad weggenomen! En zij noemde zijn naam Jozef, en zei: De HEERE voegt mij nog een andere zoon toe.", "Gen 30:1-24": "Toen Rachel zag dat zij Jakob geen kinderen gaf, benijdde Rachel haar zuster; en zij zei tegen Jakob: Geef mij kinderen! Anders ben ik dood. Toen ontstak Jakobs toorn tegen Rachel, en hij zei: Ben ik dan in de plaats van God, Die de vrucht van uw buik van u geweerd heeft? En zij zei: Zie, daar is mijn dienstmaagd Bilha, ga bij haar; dat zij op mijn knieën baart, en ik ook uit haar gebouwd word.", "Gen 30:1-23": "Toen Rachel zag dat zij Jakob geen kinderen gaf, benijdde Rachel haar zuster; en zij zei tegen Jakob: Geef mij kinderen! Anders ben ik dood. Toen ontstak Jakobs toorn tegen Rachel, en hij zei: Ben ik dan in de plaats van God, Die de vrucht van uw buik van u geweerd heeft? En zij zei: Zie, daar is mijn dienstmaagd Bilha, ga bij haar; dat zij op mijn knieën baart, en ik ook uit haar gebouwd word.", "Matt 1:18": "De geboorte van Jezus Christus was nu als volgt. Toen Maria, Zijn moeder, met Jozef in ondertrouw was, bleek zij, voordat zij samengekomen waren, zwanger te zijn uit de Heilige Geest.", "Gen 34:14": "en zij zeiden tegen hen: Wij kunnen dit niet doen, om onze zuster te geven aan een man die onbesneden is; want dat zou voor ons een schande zijn.", "Gen 27:36": "Toen zei hij: Is het niet omdat men zijn naam Jakob noemt, dat hij mij nu al twee keer bedrogen heeft? mijn eerstgeboorterecht heeft hij genomen, en zie, nu heeft hij mijn zegen genomen! Verder zei hij: Hebt u dan geen zegen voor mij bewaard?", "Richt 9:2": "Spreekt toch ten aanhoren van alle burgers van Sichem: Wat is voor u beter, dat zeventig mannen, allemaal zonen van Jerubbaäl, over u heersen, of dat één man over u heerst? Bedenkt ook dat ik uw eigen vlees en bloed ben.", "Richt 15:1": "En het gebeurde na enige dagen, in de dagen van de tarweoogst, dat Simson zijn vrouw bezocht met een geitenbokje, en hij zei: Laat mij bij mijn vrouw ingaan, in de kamer; maar haar vader liet hem niet toe naar binnen te gaan.", "Gen 49:31": "Daar hebben zij Abraham begraven, en Sara, zijn vrouw; daar hebben zij Izak begraven, en Rebekka, zijn vrouw; en daar heb ik Lea begraven.", "Gen 30:26": "Geef mij mijn vrouwen en mijn kinderen, voor wie ik u gediend heb, dat ik vertrek; want u weet mijn dienst, die ik u gediend heb.", "Pred 9:7": "Ga dan heen, eet uw brood met vreugde, en drink uw wijn met een vrolijk hart; want God heeft al een behagen in uw werken.", "Gen 24:67": "En Izak bracht haar in de tent van zijn moeder Sara; en hij nam Rebekka, en zij werd hem tot vrouw, en hij had haar lief. Zo werd Izak getroost na de dood van zijn moeder.", "Gen 29:27-30": "Maak de week van deze vol; dan zullen wij u ook die geven, voor de dienst die u nog zeven andere jaren bij mij dienen zult. En Jakob deed zo; en hij maakte de week van deze vol. Toen gaf hij hem Rachel, zijn dochter, hem tot een vrouw. En Laban gaf aan zijn dochter Rachel zijn dienstmeisje Bilha, haar tot een dienstmeisje.", "Gen 45:15": "En hij kuste al zijn broers, en hij weende over hen; en daarna spraken zijn broers met hem.", "Ex 1:1": "Dit zijn de namen van de zonen van Israël, die met Jakob in Egypte gekomen zijn; ieder kwam er met zijn huisgezin.", "Gen 44:27": "Toen zei uw knecht, mijn vader, tegen ons: U weet dat mijn vrouw mij twee zonen gebaard heeft.", "Gen 24:11": "En hij liet de kamelen neerknielen buiten de stad, bij een waterput, tegen de avond, op de tijd dat de vrouwen die water putten naar buiten kwamen.", "2 Sam 19:12": "U bent mijn broeders; mijn gebeente en mijn vlees bent u; waarom zouden jullie dan de laatsten zijn om de koning terug te halen?", "Richt 14:10-18": "Toen zijn vader afgekomen was naar die vrouw, maakte Simson daar een bruiloftsfeest, want zo plachten de jongemannen te doen. En het gebeurde, toen zij hem zagen, dat zij dertig metgezellen namen om bij hem te zijn. Simson dan zei tegen hen: Ik zal u nu een raadsel te raden geven; als u het mij in de zeven dagen van deze bruiloft goed kunt verklaren en uitvinden, dan zal ik u dertig stel linnen kleren geven, en dertig stellen (extra) kleren.", "Gen 29:23-27": "En het gebeurde 's avonds, dat hij zijn dochter Lea nam, en haar bij hem bracht; en hij kwam bij haar. En Laban gaf haar Zilpa, zijn dienstmeisje, aan Lea, zijn dochter, tot een dienstmeisje. En het gebeurde 's morgens, en zie, het was Lea. Daarom zei hij tegen Laban: Wat is dit dat u mij hebt aangedaan? Heb ik niet bij u gediend voor Rachel? Waarom hebt u mij dan bedrogen?", "Matt 25:1-10": "Toen zal het Koninkrijk van de hemelen gelijk zijn aan tien maagden, die hun lampen namen, en de bruidegom tegemoet gingen. En vijf van hen waren wijs, en vijf waren dwaas. Zij die dwaas waren, namen hun lampen mee, maar namen geen olie met zich mee.", "Hoogl 1:7": "Zeg mij aan, U, Die mijn ziel liefheeft, waar U weidt, waar U de kudde legert in de middag; want waarom zou ik zijn als iemand die zich afwendt bij de kudden van uw metgezellen?", "1 Sam 17:15": "Doch David ging heen, en keerde terug van Saul, om de schapen van zijn vader te weiden te Bethlehem.", "Gen 30:18": "Toen zei Lea: God heeft mij mijn loon gegeven, omdat ik mijn dienstmaagd aan mijn man gegeven heb; en zij noemde zijn naam Issaschar.", "1 Sam 18:27": "Toen maakte David zich op, en hij en zijn mannen gingen heen, en zij sloegen onder de Filistijnen tweehonderd man, en David bracht hun voorhuiden, en men leverde ze de koning volkomen, opdat hij schoonzoon van de koning zou worden. Toen gaf Saul hem zijn dochter Michal tot vrouw.", "Jer 31:15": "Zo zegt de HEERE: Er is een stem gehoord in Rama, een geklaag, een zeer bitter geween; Rachel weent over haar kinderen; zij weigert zich te laten troosten over haar kinderen, omdat zij er niet meer zijn.", "Lev 18:18": "U zult ook geen vrouw tot haar zuster nemen, om haar te benauwen, en zo haar schaamte naast haar, tijdens haar leven, te ontdekken.", "Kol 4:5": "Wandel met wijsheid bij hen die buiten zijn, en maak gebruik van elke gelegenheid.", "Gen 46:11": "En de zonen van Levi: Gerson, Kehath en Merari.", "Gen 29:21-30": "Toen zei Jakob tegen Laban: Geef mij mijn vrouw, want mijn dagen zijn vervuld, zodat ik bij haar kan komen. Zo verzamelde Laban alle mannen van die plaats, en maakte een maaltijd. En het gebeurde 's avonds, dat hij zijn dochter Lea nam, en haar bij hem bracht; en hij kwam bij haar.", "Gen 29:31-33": "Toen de HEERE nu zag dat Lea gehaat was, opende Hij haar baarmoeder; maar Rachel was onvruchtbaar. En Lea werd zwanger, en baarde een zoon, en zij noemde zijn naam Ruben; want zij zei: Zeker, de HEERE heeft mijn verdrukking aangezien; daarom zal mijn man mij nu liefhebben. En zij werd opnieuw zwanger, en baarde een zoon, en zei: Omdat de HEERE gehoord heeft dat ik gehaat was, heeft Hij mij ook deze gegeven; en zij noemde zijn naam Simeon.", "1 Tim 6:10": "Want de geldzucht is een wortel van alle kwaad; sommigen hebben daarnaar verlangd en zijn van het geloof afgedwaald, en hebben zichzelf met veel smarten doorstoken.", "Spr 31:30": "Schin. De bevalligheid is bedrog, en de schoonheid vergankelijk; maar een vrouw die de HEERE vreest, die zal geprezen worden.", "Ex 2:1": "En een man van het huis van Levi ging heen, en nam een dochter van Levi tot vrouw.", "Gen 14:16": "En hij bracht alle bezittingen terug, en ook Lot, zijn broeder, en diens bezittingen bracht hij terug, en ook de vrouwen en het volk.", "Jes 4:1": "En op die dag zullen zeven vrouwen één man vastgrijpen en zeggen: Ons eigen brood zullen wij eten, en met onze eigen kleren zullen wij bekleed zijn; laat ons alleen naar uw naam genoemd worden, neem onze smaad weg.", "Gen 37:21": "Ruben hoorde dat en verloste hem uit hun hand, en hij zei: Laten wij hem niet aan het leven slaan.", "Gal 6:10": "Zo dan, terwijl we tijd hebben, laten we goeddoen aan allen, maar vooral aan de huisgenoten van het geloof.", "Ruth 4:10-13": "Daarbij koop ik ook Ruth, de Moabitische, de vrouw van Machlon, tot vrouw, om de naam van de gestorvene te doen voortbestaan over zijn erfdeel, opdat de naam van de gestorvene niet wordt uitgeroeid onder zijn broeders en uit de poort van zijn woonplaats; u bent heden getuigen. En al het volk dat in de poort was, alsook de oudsten, zeiden: Wij zijn getuigen; de HEERE make deze vrouw, die in uw huis komt, als Rachel en als Lea, die beiden het huis van Israël gebouwd hebben; en handel kloek in Efratha, en maak uw naam vermaard in Bethlehem! En uw huis zij als het huis van Perez (die Thamar aan Juda baarde), door het nageslacht dat de HEERE u geven zal uit deze jonge vrouw.", "Richt 8:10": "Zebah nu en Tsalmuna waren in Karkor, en hun legers met hen, ongeveer vijftienduizend man, alles wat er over was van het hele leger van de mensen uit het oosten; en de gesneuvelden waren honderdtwintigduizend man, die het zwaard hanteerden.", "Gen 28:3": "En God, de Almachtige, zegent u, en maakt u vruchtbaar, en vermenigvuldigt u, zodat u tot een groep volken wordt.", "Gen 28:5-7": "Zo zond Izak Jakob weg, zodat hij naar Paddan-aram trok, naar Laban, de zoon van Bethuel, de Syriër, de broer van Rebekka, de moeder van Jakob en Ezau. Toen Ezau nu zag dat Izak Jakob gezegend had, en hem naar Paddan-aram weggezonden had om zich vandaar een vrouw te nemen; en dat hij hem, terwijl hij hem zegende, geboden had en gezegd: Neem geen vrouw van de dochters van Kanaän; en dat Jakob zijn vader en zijn moeder gehoorzaam geweest was, en naar Paddan-aram getrokken was;", "Ps 25:18": "Resch. Zie mijn ellende, en mijn moeite, en neem al mijn zonden weg.", "Ps 113:9": "Die de onvruchtbare vrouw doet wonen als moeder in een huisgezin, een blijde moeder van kinderen. Halleluja!", "1 Sam 1:6": "En haar tegenpartij tergde haar ook met terging, om haar te ergeren, omdat de HEERE haar baarmoeder toegesloten had.", "Gen 38:14": "Toen legde zij de kleren van haar weduwschap af, en bedekte zich met een sluier, en wikkelde zich in, en ging bij de ingang van de twee bronnen zitten, die aan de weg naar Timna liggen; want zij had gezien dat Sela groot geworden was, en dat zij hem niet tot vrouw was gegeven.", "Ruth 4:13": "Zo nam Boaz Ruth, en zij werd hem tot vrouw, en hij ging tot haar in; en de HEERE gaf haar dat zij zwanger werd en een zoon baarde.", "Luk 1:25": "Zo heeft de Heere mij gedaan, in de dagen waarin Hij naar mij omzag, om mijn smaad onder de mensen weg te nemen.", "Gen 30:3": "En zij zei: Zie, daar is mijn dienstmaagd Bilha, ga bij haar; dat zij op mijn knieën baart, en ik ook uit haar gebouwd word.", "Gen 31:7": "Maar uw vader heeft mij bedrogen, en heeft mijn loon tien keer veranderd; maar God heeft hem niet toegelaten mij kwaad te doen.", "Gen 33:2": "En hij zette de dienstmaagden en hun kinderen vooraan; en Lea en haar kinderen daarachter; en Rachel en Jozef achteraan.", "Gen 16:2": "En Sarai zei tegen Abram: Zie toch, de HEERE heeft mij belet kinderen te krijgen; ga toch naar mijn dienstmaagd, misschien zal ik uit haar gebouwd worden. En Abram luisterde naar de stem van Sarai.", "Ps 119:32": "Ik zal de weg van Uw geboden lopen, als U mijn hart verwijd zult hebben.", "2 Kor 5:14": "Want de liefde van Christus dringt ons;", "Gen 21:2": "En Sara werd zwanger, en baarde Abraham een zoon in zijn ouderdom, op de vastgestelde tijd die God hem gezegd had.", "Gen 30:9-13": "Toen Lea nu zag dat zij ophield met baren, nam zij ook haar dienstmaagd Zilpa, en gaf haar aan Jakob tot vrouw. En Zilpa, Lea's dienstmaagd, baarde Jakob een zoon. Toen zei Lea: Er komt een hoop! En zij noemde zijn naam Gad.", "Ruth 4:11": "En al het volk dat in de poort was, alsook de oudsten, zeiden: Wij zijn getuigen; de HEERE make deze vrouw, die in uw huis komt, als Rachel en als Lea, die beiden het huis van Israël gebouwd hebben; en handel kloek in Efratha, en maak uw naam vermaard in Bethlehem!", "Ex 2:16": "En de priester in Midian had zeven dochters, die kwamen om water te putten, en de drinkbakken te vullen om de kudde van hun vader te laten drinken.", "Matt 22:11": "En toen de koning binnenkwam om de gasten te bekijken die aanzaten, zag hij daar een man die geen bruiloftskleed aanhad;", "Jes 49:10": "Zij zullen niet hongeren, noch dorsten, en de hitte en de zon zal hen niet steken; want hun Ontfermer zal ze leiden, en Hij zal hen bij de springaders van het water zachtjes leiden.", "Matt 22:2-10": "Het Koninkrijk der hemelen is gelijk aan een zeker koning, die voor zijn zoon een bruiloft bereid had; En hij zond zijn dienstknechten uit om de genode gasten naar de bruiloft te roepen; en zij wilden niet komen. Opnieuw zond hij andere dienstknechten uit, en zei: Zeg tegen de genode gasten: Zie, ik heb mijn middagmaal bereid; mijn ossen en het gemeste vee zijn geslacht, en alles is gereed; kom naar de bruiloft.", "Ex 4:31": "En het volk geloofde, en zij hoorden, dat de HEERE de kinderen van Israël bezocht had, en dat Hij hun verdrukking gezien had, en zij bogen hun hoofden, en aanbaden.", "Matt 10:37": "Wie vader of moeder liefheeft boven Mij, is Mij niet waard; en wie zoon of dochter liefheeft boven Mij, is Mij niet waard.", "Gen 29:15-30": "Daarna zei Laban tegen Jakob: Omdat u mijn broer bent, zou u mij dan voor niets moeten dienen? Vertel mij, wat zal uw loon zijn? En Laban had twee dochters: de naam van de oudste was Lea; en de naam van de jongste was Rachel. Lea had tere ogen; maar Rachel was mooi van gestalte, en mooi van gezicht.", "Gen 46:19-22": "De zonen van Rachel, Jakobs vrouw: Jozef en Benjamin. En voor Jozef werden geboren in het land Egypte, Manasse en Efraïm, die Asnath, de dochter van Potifera, de leider te On, hem baarde. En de zonen van Benjamin: Bela, Becher en Asbel, Gera en Naäman, Echi en Ros, Muppim en Huppim, en Ard.", "Ex 22:17": "Als haar vader hardnekkig weigert haar aan hem te geven, dan moet hij geld betalen overeenkomstig de bruidsprijs voor maagden.", "Gen 29:32-35": "En Lea werd zwanger, en baarde een zoon, en zij noemde zijn naam Ruben; want zij zei: Zeker, de HEERE heeft mijn verdrukking aangezien; daarom zal mijn man mij nu liefhebben. En zij werd opnieuw zwanger, en baarde een zoon, en zei: Omdat de HEERE gehoord heeft dat ik gehaat was, heeft Hij mij ook deze gegeven; en zij noemde zijn naam Simeon. En zij werd nog zwanger, en baarde een zoon, en zei: Nu zal mijn man zich ditmaal aan mij hechten, omdat ik hem drie zonen gebaard heb; daarom noemde zij zijn naam Levi.", "Gen 29:30-34": "En hij kwam ook bij Rachel, en had ook Rachel liever dan Lea; en hij diende bij hem nog zeven andere jaren. Toen de HEERE nu zag dat Lea gehaat was, opende Hij haar baarmoeder; maar Rachel was onvruchtbaar. En Lea werd zwanger, en baarde een zoon, en zij noemde zijn naam Ruben; want zij zei: Zeker, de HEERE heeft mijn verdrukking aangezien; daarom zal mijn man mij nu liefhebben.", "1 Sam 10:2": "Als u vandaag van mij weggaat, zult u twee mannen vinden bij het graf van Rachel, aan de grens van Benjamin, te Zelzah; die zullen tegen u zeggen: De ezelinnen zijn gevonden, die u bent gaan zoeken, en zie, uw vader heeft de zorg om de ezelinnen laten varen, en hij is bekommerd om u, en zegt: Wat zal ik doen voor mijn zoon?", "Gen 49:5": "Simeon en Levi zijn broers! Hun wapens zijn werktuigen van geweld!", "Gen 27:26": "En zijn vader Izak zei tegen hem: Kom toch dichterbij, en kus mij, mijn zoon!", "Hebr 7:9": "En, om zo te spreken, heeft ook Levi, die tienden neemt, door Abraham tienden gegeven;", "Richt 7:12": "En de Midianieten, en Amalekieten, en al de mensen van het oosten, lagen in het dal, als een menigte sprinkhanen, en hun kamelen waren niet te tellen, als het zand dat aan de oever van de zee ligt, in menigte.", "Spr 11:31": "Zie, de rechtvaardige wordt vergolden op de aarde, hoeveel te meer de goddeloze en de zondaar!", "Gen 30:17-21": "En God verhoorde Lea; en zij werd zwanger, en baarde Jakob de vijfde zoon. Toen zei Lea: God heeft mij mijn loon gegeven, omdat ik mijn dienstmaagd aan mijn man gegeven heb; en zij noemde zijn naam Issaschar. En Lea werd opnieuw zwanger, en zij baarde Jakob de zesde zoon.", "Deut 33:7": "En dit is van Juda, dat hij zei: Hoor, HEERE! de stem van Juda! en breng hem terug tot zijn volk; zijn handen moeten hem genoeg zijn, en wees Gij hem een Hulp tegen zijn vijanden!", "Gen 35:23": "De zonen van Lea waren: Ruben, Jakobs eerstgeborene, daarna Simeon, en Levi, en Juda, en Issaschar, en Zebulon.", "Gen 24:65": "En zij zei tegen de knecht: Wie is die man, die ons tegemoet loopt in het veld? En de knecht zei: Dat is mijn heer! Toen nam zij de sluier, en bedekte zich.", "Ps 106:44": "Toch zag Hij hun benauwdheid aan, toen Hij hun geschrei hoorde.", "Gen 27:41": "En Ezau haatte Jakob om die zegen, waarmee zijn vader hem gezegend had; en Ezau zei in zijn hart: De dagen van rouw om mijn vader komen dichterbij, en ik zal mijn broer Jakob doden.", "Gen 14:14-16": "Toen Abram hoorde dat zijn broeder gevangen was genomen, wapende hij zijn geoefende mannen, geboren in zijn eigen huis, driehonderd achttien, en hij achtervolgde hen tot Dan toe. En hij verdeelde zich tegen hen 's nachts, hij en zijn knechten, en versloeg hen; en hij achtervolgde hen tot Hoba toe, dat ten noorden van Damaskus ligt. En hij bracht alle bezittingen terug, en ook Lot, zijn broeder, en diens bezittingen bracht hij terug, en ook de vrouwen en het volk.", "1 Sam 16:11": "Vervolgens zei Samuël tegen Isaï: Zijn dit al de jongens? En hij zei: De jongste is nog over, en zie, hij weidt de schapen. Samuël zei toen tegen Isaï: Stuur iemand en laat hem halen; want wij zullen niet aan tafel gaan totdat hij hier gekomen is.", "Gen 31:41": "Ik ben nu twintig jaar in uw huis geweest; ik heb u veertien jaar gediend voor uw beide dochters, en zes jaar voor uw kudde; en u hebt mijn loon tien keer veranderd.", "Matt 7:12": "Alles dan wat u wilt dat de mensen u doen, doet u hun ook zo; want dat is de wet en de profeten.", "Hoogl 1:8": "Als u het niet weet, o schoonste onder de vrouwen! ga dan uit op de voetstappen van de schapen, en weid uw geiten bij de woningen van de herders.", "Gen 46:18": "Dit zijn de zonen van Zilpa, die Laban aan zijn dochter Lea gegeven had; en zij baarde Jakob deze zestien zielen.", "1 Kor 13:7": "Zij bedekt alle dingen, zij gelooft alle dingen, zij hoopt alle dingen, zij verdraagt alle dingen.", "1 Kon 4:30": "En de wijsheid van Salomo was groter dan de wijsheid van allen uit het oosten, en dan alle wijsheid van de Egyptenaren;", "Hand 7:2": "En hij zei: Mannen, broeders en vaders, luister: de God van de heerlijkheid verscheen aan onze vader Abraham, toen hij nog in Mesopotamië was, voordat hij in Haran woonde,", "Gen 30:28-34": "Hij zei dan: Noem mij uitdrukkelijk uw loon, dat ik geven zal. Toen zei hij tegen hem: U weet hoe ik u gediend heb, en hoe uw vee bij mij geweest is. Want het weinige dat u voor mij had, is uitgebroken tot een menigte; en de HEERE heeft u gezegend bij mijn komst; nu dan, wanneer zal ik ook voor mijn eigen huis werken?", "1 Sam 1:20": "En het gebeurde, na verloop van dagen, dat Hanna zwanger werd, en een zoon baarde, en zij noemde zijn naam Samuël: Want, zei ze, ik heb hem van de HEERE gebeden.", "Gen 49:8-12": "Juda! U bent het, u zullen uw broers loven; uw hand zal zijn op de nek van uw vijanden; voor u zullen de zonen van uw vader zich neerbuigen. Juda is een leeuwenwelp! U bent van de roof opgeklommen, mijn zoon! Hij kromt zich, hij legt zich neer als een leeuw, en als een oude leeuw; wie zal hem doen opstaan? De scepter zal van Juda niet wijken, evenmin de wetgever van tussen zijn voeten, totdat Silo komt, en Hem zullen de volken gehoorzaam zijn.", "Matt 22:2": "Het Koninkrijk der hemelen is gelijk aan een zeker koning, die voor zijn zoon een bruiloft bereid had;", "Ex 2:15": "Toen Farao deze zaak hoorde, zocht hij Mozes te doden; maar Mozes vluchtte voor Farao, en woonde in het land Midian, en hij ging bij een waterput zitten.", "Ps 107:41": "Maar Hij brengt de nooddruftige uit de verdrukking in een veilig verblijf, en maakt de huisgezinnen als kudden.", "Gen 13:8": "En Abram zei tegen Lot: Laat er toch geen twist zijn tussen mij en u, en tussen mijn herders en uw herders; want wij zijn broeders.", "1 Sam 25:5": "zond David tien jongemannen; en David zei tegen de jongemannen: Ga op naar Karmel, en als u bij Nabal komt, zult u hem in mijn naam naar zijn welstand vragen;", "Gen 44:18-34": "Toen kwam Juda dichter bij hem, en zei: Och, mijn heer! Laat toch uw knecht een woord spreken voor de oren van mijn heer, en laat uw toorn tegen uw knecht niet ontsteken; want u bent gelijk aan Farao! Mijn heer vroeg zijn knechten en zei: Hebt u een vader of broer? Toen zeiden wij tegen mijn heer: Wij hebben een oude vader, en een jongen van het ouderdom, de kleinste, wiens broer dood is, en hij is alleen van zijn moeder overgebleven, en zijn vader heeft hem lief.", "Gen 49:4": "Snelle afloop als van water, u zult niet de voortreffelijkste zijn! Want u hebt het bed van uw vader beklommen; toen hebt u het geschonden; hij heeft mijn bed beklommen!", "Gen 30:17-20": "En God verhoorde Lea; en zij werd zwanger, en baarde Jakob de vijfde zoon. Toen zei Lea: God heeft mij mijn loon gegeven, omdat ik mijn dienstmaagd aan mijn man gegeven heb; en zij noemde zijn naam Issaschar. En Lea werd opnieuw zwanger, en zij baarde Jakob de zesde zoon.", "Gal 6:9": "Laten we bij het goeddoen niet moe worden; want op zijn tijd zullen we maaien, als we niet verslappen.", "1 Sam 18:17-27": "Daarom zei Saul tegen David: Zie, mijn oudste dochter Merab zal ik u tot vrouw geven; alleen, wees mij een dapper man en voer de oorlogen van de HEERE. Want Saul zei: Laat mijn hand niet tegen hem zijn, maar laat de hand van de Filistijnen tegen hem zijn. Doch David zei tegen Saul: Wie ben ik, en wat is mijn leven, en het huisgezin van mijn vader in Israël, dat ik de schoonzoon van de koning zou worden? Het gebeurde nu ten tijde dat men Merab, de dochter van Saul, aan David geven zou, dat zij aan Adriël, de Meholathiet, tot vrouw werd gegeven.", "Gen 21:1": "En de HEERE bezocht Sara, zoals Hij gezegd had; en de HEERE deed aan Sara, zoals Hij gesproken had."}, "noten": {}, "koppeling": {"1": "<span class=\"wl\" data-l=\"L1\" data-code=\"H5375\">Toen</span> brak <span class=\"wl\" data-l=\"L2\" data-code=\"H3290\">Jakob</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H3290\">op</span>, <span class=\"wl\" data-l=\"L3\" data-code=\"H3212\">en</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H3212\">ging</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H3212\">naar</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H776\">het</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H776\">land</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H776\">van</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H1121\">de</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H1121\">kinderen</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H1121\">van</span> <span class=
