ging naar het land van de kinderen van het Oosten.","2":"En hij keek, en zie, er was een put in het veld; en zie, er waren drie kudden schapen ernaast neerliggend; want uit die put drenkten zij de kudden; en er was een grote steen op de mond van die put.","3":"En daar werden alle kudden verzameld, en zij wentelden de steen van de mond van de put, en drenkten de schapen, en legden de steen weer op de mond van die put, op zijn plaats.","4":"Toen zei Jakob tegen hen: Mijn broeders! Waar komt u vandaan? En zij zeiden: Wij komen uit Haran.","5":"En hij zei tegen hen: Kent u Laban, de zoon van Nahor? En zij zeiden: Wij kennen *hem*.","6":"Verder zei hij tegen hen: Gaat het goed met hem? En zij zeiden: Het gaat goed; en zie, Rachel, zijn dochter, komt met de schapen.","7":"En hij zei: Zie, het is nog volop dag, het is geen tijd om het vee te verzamelen; drenk de schapen, en ga heen, weid *ze*.","8":"Toen zeiden zij: Dat kunnen wij niet, totdat alle kudden samen zijn verzameld, en men de steen van de mond van de put afwentelt, zodat wij de schapen kunnen drenken.","9":"Terwijl hij nog met hen sprak, kwam Rachel met de schapen die haar vader toebehoorden; want zij was een herderin.","10":"En het gebeurde, toen Jakob Rachel zag, de dochter van Laban, de broer van zijn moeder, en de schapen van Laban, de broer van zijn moeder, dat Jakob dichterbij kwam, en de steen van de mond van de put wentelde, en de schapen van Laban, de broer van zijn moeder, drenkte.","11":"En Jakob kuste Rachel; en hij verhief zijn stem en huilde.","12":"En Jakob liet Rachel weten dat hij een broer van haar vader was, en dat hij de zoon van Rebekka was. Toen liep zij snel weg, en liet het haar vader weten.","13":"En het gebeurde, toen Laban het bericht hoorde over Jakob, de zoon van zijn zuster, dat hij hem tegemoet snelde, en hem omhelsde, en hem kuste, en hem naar zijn huis bracht. En hij vertelde Laban al deze dingen.","14":"Toen zei Laban tegen hem: Voorwaar, u bent mijn gebeente en mijn vlees! En hij bleef bij hem een volle maand.","15":"Daarna zei Laban tegen Jakob: Omdat u mijn broer bent, zou u mij dan voor niets moeten dienen? Vertel mij, wat zal uw loon zijn?","16":"En Laban had twee dochters: de naam van de oudste was Lea; en de naam van de jongste was Rachel.","17":"Lea had tere ogen; maar Rachel was mooi van gestalte, en mooi van gezicht.","18":"En Jakob had Rachel lief; en hij zei: Ik zal u zeven jaar dienen, voor Rachel, uw jongste dochter.","19":"Toen zei Laban: Het is beter dat ik haar aan u geef, dan dat ik haar aan een andere man geef; blijf bij mij.","20":"Zo diende Jakob zeven jaar voor Rachel; en die waren in zijn ogen als enkele dagen, omdat hij haar liefhad.","21":"Toen zei Jakob tegen Laban: Geef mij mijn vrouw, want mijn dagen zijn vervuld, zodat ik bij haar kan komen.","22":"Zo verzamelde Laban alle mannen van die plaats, en maakte een maaltijd.","23":"En het gebeurde 's avonds, dat hij zijn dochter Lea nam, en haar bij hem bracht; en hij kwam bij haar.","24":"En Laban gaf haar Zilpa, zijn dienstmeisje, aan Lea, zijn dochter, *tot* een dienstmeisje.","25":"En het gebeurde 's morgens, en zie, het was Lea. Daarom zei hij tegen Laban: Wat is dit dat u mij hebt aangedaan? Heb ik niet bij u gediend voor Rachel? Waarom hebt u mij dan bedrogen?","26":"En Laban zei: Zo doet men het niet in ons land, om de jongste uit te geven vóór de eerstgeborene.","27":"Maak de week van deze vol; dan zullen wij u ook die geven, voor de dienst die u nog zeven andere jaren bij mij dienen zult.","28":"En Jakob deed zo; en hij maakte de week van deze vol. Toen gaf hij hem Rachel, zijn dochter, hem tot een vrouw.","29":"En Laban gaf aan zijn dochter Rachel zijn dienstmeisje Bilha, haar tot een dienstmeisje.","30":"En hij kwam ook bij Rachel, en had ook Rachel liever dan Lea; en hij diende bij hem nog zeven andere jaren.","31":"Toen de HEERE nu zag dat Lea gehaat was, opende Hij haar baarmoeder; maar Rachel was onvruchtbaar.","32":"En Lea werd zwanger, en baarde een zoon, en zij noemde zijn naam Ruben; want zij zei: Zeker, de HEERE heeft mijn verdrukking aangezien; daarom zal mijn man mij nu liefhebben.","33":"En zij werd opnieuw zwanger, en baarde een zoon, en zei: Omdat de HEERE gehoord heeft dat ik gehaat was, heeft Hij mij ook deze gegeven; en zij noemde zijn naam Simeon.","34":"En zij werd nog zwanger, en baarde een zoon, en zei: Nu zal mijn man zich ditmaal aan mij hechten, omdat ik hem drie zonen gebaard heb; daarom noemde zij zijn naam Levi.","35":"En zij werd opnieuw zwanger, en baarde een zoon, en zei: Ditmaal zal ik de HEERE loven; daarom noemde zij zijn naam Juda. En zij hield op met baren."},"SV":{"1":"Toen hief Jakob zijn voeten op, en ging naar het land der kinderen van het Oosten.","2":"En hij zag toe, en ziet, er was een put in het veld; en ziet, er waren drie kudden schapen nevens dien nederliggende; want uit dien put drenkten zij de kudden; en er was een grote steen op den mond van dien put.","3":"En derwaarts werden al de kudden verzameld, en zij wentelden den steen van den mond des puts, en drenkten de schapen, en legden den steen weder op den mond van dien put, op zijn plaats.","4":"Toen zeide Jakob tot hen: Mijn broeders! van waar zijt gij? En zij zeiden: Wij zijn van Haran.","5":"En hij zeide tot hen: Kent gij Laban, den zoon van Nahor? En zij zeiden: Wij kennen *hem*.","6":"Voorts zeide hij tot hen: Is het wel met hem? En zij zeiden: Het is wel; en zie, Rachel, zijn dochter, komt met de schapen.","7":"En hij zeide: Ziet, het is nog hoog dag, het is geen tijd, dat het vee verzameld worde; drenkt de schapen, en gaat heen, weidt *dezelve*.","8":"Toen zeiden zij: Wij kunnen niet, totdat al de kudden samen zullen vergaderd zijn, en dat men den steen van den mond des puts afwentele, opdat wij de schapen drenken.","9":"Als hij nog met hen sprak, zo kwam Rachel met de schapen, die haar vader toebehoorden; want zij was een herderin.","10":"En het geschiedde, als Jakob Rachel zag, de dochter van Laban, zijner moeders broeder, en de schapen van Laban, zijner moeders broeder, dat Jakob toetrad, en wentelde den steen van den mond des puts, en drenkte de schapen van Laban, zijner moeders broeder.","11":"En Jakob kuste Rachel; en hij hief zijn stem op en weende.","12":"En Jakob gaf Rachel te kennen, dat hij een broeder van haar vader, en dat hij de zoon van Rebekka was. Toen liep zij heen, en gaf het aan haar vader te kennen.","13":"En het geschiedde, als Laban die tijding hoorde van Jakob, zijner zusters zoon, zo liep hij hem tegemoet, en omhelsde hem, en kuste hem, en bracht hem tot zijn huis. En hij vertelde Laban al deze dingen.","14":"Toen zeide Laban tot hem: Voorwaar, gij zijt mijn gebeente en mijn vlees! En hij bleef bij hem een volle maand.","15":"Daarna zeide Laban tot Jakob: Omdat gij mijn broeder zijt, zoudt gij mij derhalve om niet dienen? verklaar mij, wat zal uw loon zijn?","16":"En Laban had twee dochters: de naam der grootste was Lea; en de naam der kleinste was Rachel.","17":"Doch Lea had tedere ogen; maar Rachel was schoon van gedaante, en schoon van aangezicht.","18":"En Jakob had Rachel lief; en hij zeide: Ik zal u zeven jaren dienen, om Rachel, uw kleinste dochter.","19":"Toen zeide Laban: Het is beter, dat ik haar aan u geve, dan dat ik haar aan een anderen man geve; blijf bij mij.","20":"Alzo diende Jakob om Rachel zeven jaren; en die waren in zijn ogen als enige dagen, omdat hij haar liefhad.","21":"Toen zeide Jakob tot Laban: Geef mijn huisvrouw, want mijn dagen zijn vervuld, dat ik tot haar inga.","22":"Zo verzamelde Laban al de mannen dier plaats, en maakte een maaltijd.","23":"En het geschiedde des avonds, dat hij zijn dochter Lea nam, en bracht haar tot hem; en hij ging tot haar in.","24":"En Laban gaf haar Zilpa, zijn dienstmaagd, aan Lea, zijn dochter, *tot* een dienstmaagd.","25":"En het geschiedde des morgens, en ziet, het was Lea. Daarom zeide hij tot Laban: Wat is dit, *dat* gij mij gedaan hebt; heb ik niet bij u gediend om Rachel? waarom hebt gij mij dan bedrogen?","26":"En Laban zeide: Men doet alzo niet te dezer onzer plaatse, dat men de kleinste uitgeve voor de eerstgeborene.","27":"Vervul de week van deze; dan zullen wij u ook die geven, voor den dienst, dien gij nog andere zeven jaren bij mij dienen zult.","28":"En Jakob deed alzo; en hij vervulde de week van deze. Toen gaf hij hem Rachel, zijn dochter, hem tot een vrouw.","29":"En Laban gaf aan zijn dochter Rachel zijn dienstmaagd Bilha, haar tot een dienstmaagd.","30":"En hij ging ook in tot Rachel, en had ook Rachel liever dan Lea; en hij diende bij hem nog andere zeven jaren.","31":"Toen nu de HEERE zag, dat Lea gehaat was, opende Hij haar baarmoeder; maar Rachel was onvruchtbaar.","32":"En Lea werd bevrucht, en baarde een zoon, en zij noemde zijn naam Ruben; want zij zeide: Omdat de HEERE mijn verdrukking heeft aangezien, daarom zal mijn man mij nu liefhebben.","33":"En zij werd wederom bevrucht, en baarde een zoon, en zeide: Dewijl de HEERE gehoord heeft, dat ik gehaat was, zo heeft Hij mij ook dezen gegeven; en zij noemde zijn naam Simeon.","34":"En zij werd nog bevrucht, en baarde een zoon, en zeide: Nu zal zich ditmaal mijn man bij mij voegen, dewijl ik hem drie zonen gebaard heb; daarom noemde zij zijn naam Levi.","35":"En zij werd wederom bevrucht, en baarde een zoon, en zeide: Ditmaal zal ik den HEERE loven; daarom noemde zij zijn naam Juda. En zij hield op van baren."},"KJV":{"1":"Then Jacob went on his journey, and came into the land of the people of the east.","2":"And he looked, and behold a well in the field, and, lo, there *were* three flocks of sheep lying by it; for out of that well they watered the flocks: and a great stone *was* upon the well's mouth.","3":"And thither were all the flocks gathered: and they rolled the stone from the well's mouth, and watered the sheep, and put the stone again upon the well's mouth in his place.","4":"And Jacob said unto them, My brethren, whence *be* ye? And they said, Of Haran","5":"And he said unto them, Know ye Laban the son of Nahor? And they said, We know","6":"And he said unto them, *Is* he well? And they said, *He is* well: and, behold, Rachel his daughter cometh with the sheep.","7":"And he said, Lo, *it is* yet high day, neither *is it* time that the cattle should be gathered together: water ye the sheep, and go *and* feed","8":"And they said, We cannot, until all the flocks be gathered together, and *till* they roll the stone from the well's mouth; then we water the sheep.","9":"And while he yet spake with them, Rachel came with her father's sheep: for she kept them.","10":"And it came to pass, when Jacob saw Rachel the daughter of Laban his mother's brother, and the sheep of Laban his mother's brother, that Jacob went near, and rolled the stone from the well's mouth, and watered the flock of Laban his mother's brother.","11":"And Jacob kissed Rachel, and lifted up his voice, and wept.","12":"And Jacob told Rachel that he *was* her father's brother, and that he *was* Rebekah's son: and she ran and told her father.","13":"And it came to pass, when Laban heard the tidings of Jacob his sister's son, that he ran to meet him, and embraced him, and kissed him, and brought him to his house. And he told Laban all these things.","14":"And Laban said to him, Surely thou *art* my bone and my flesh. And he abode with him the space of a month.","15":"And Laban said unto Jacob, Because thou *art* my brother, shouldest thou therefore serve me for nought? tell me, what *shall* thy wages","16":"And Laban had two daughters: the name of the elder *was* Leah, and the name of the younger *was* Rachel.","17":"Leah *was* tender eyed; but Rachel was beautiful and well favoured.","18":"And Jacob loved Rachel; and said, I will serve thee seven years for Rachel thy younger daughter.","19":"And Laban said, *It is* better that I give her to thee, than that I should give her to another man: abide","20":"And Jacob served seven years for Rachel; and they seemed unto him *but* a few days, for the love he had","21":"And Jacob said unto Laban, Give *me* my wife, for my days are fulfilled, that I may go in","22":"And Laban gathered together all the men of the place, and made a feast.","23":"And it came to pass in the evening, that he took Leah his daughter, and brought her to him; and he went in","24":"And Laban gave unto his daughter Leah Zilpah his maid *for* an handmaid.","25":"And it came to pass, that in the morning, behold, it *was* Leah: and he said to Laban, What *is* this thou hast done unto me? did not I serve with thee for Rachel? wherefore then hast thou beguiled","26":"And Laban said, It must not be so done in our country, to give the younger before the firstborn.","27":"Fulfil her week, and we will give thee this also for the service which thou shalt serve with me yet seven other years.","28":"And Jacob did so, and fulfilled her week: and he gave him Rachel his daughter to wife","29":"And Laban gave to Rachel his daughter Bilhah his handmaid to be her maid.","30":"And he went in also unto Rachel, and he loved also Rachel more than Leah, and served with him yet seven other years.","31":"And when the LORD saw that Leah *was* hated, he opened her womb: but Rachel *was* barren.","32":"And Leah conceived, and bare a son, and she called his name Reuben: for she said, Surely the LORD hath looked upon my affliction; now therefore my husband will love","33":"And she conceived again, and bare a son; and said, Because the LORD hath heard that I *was* hated, he hath therefore given me this *son* also: and she called his name Simeon.","34":"And she conceived again, and bare a son; and said, Now this time will my husband be joined unto me, because I have born him three sons: therefore was his name called Levi.","35":"And she conceived again, and bare a son: and she said, Now will I praise the LORD: therefore she called his name Judah; and left bearing."}},"tsk":{"1":[{"kopje":"Jakob","refs":["Ps 119:32","Ps 119:60","Pred 9:7"]},{"kopje":"g 2\" data-code=\"H3205\">baarde</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H3205\">een</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H1121\">zoon</span>, <span class=\"wl\" data-l=\"L4\" data-code=\"H559\">en</span> zei: <span class=\"wl\" data-l=\"L5\" data-code=\"H6471\">Ditmaal</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H6471\">zal</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H3034\">ik</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H3034\">de</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H3034\">HEERE</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H3034\">loven</span>; <span class=\"wl\" data-l=\"L7\" data-code=\"H5921\">daarom</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H7121\">noemde</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H7121\">zij</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H7121\">zijn</span> <span class=\"wl\" data-l=\"L9\" data-code=\"H8034\">naam</span> <span class=\"wl\" data-l=\"L10\" data-code=\"H3063\">Juda</span>. <span class=\"wl\" data-l=\"L11\" data-code=\"H5975\">En</span> <span class=\"wl\" data-l=\"L11\" data-code=\"H5975\">zij</span> <span class=\"wl\" data-l=\"L11\" data-code=\"H5975\">hield</span> <span class=\"wl\" data-l=\"L11\" data-code=\"H5975\">op</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H3205\">met</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H3205\">baren</span>."},"koppeling_kjv":{"1":"Then <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> went <span class=\"wl wl-kjv\" data-code=\"H5375\">on</span> his <span class=\"wl wl-kjv\" data-code=\"H7272\">journey,</span> and <span class=\"wl wl-kjv\" data-code=\"H3212\">came</span> into the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">people</span> of the east.","2":"And he <span class=\"wl wl-kjv\" data-code=\"H7200\">looked,</span> and behold a <span class=\"wl wl-kjv\" data-code=\"H875\">well</span> in the <span class=\"wl wl-kjv\" data-code=\"H7704\">field,</span> and, lo, there were <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H5739\">flocks</span> of <span class=\"wl wl-kjv\" data-code=\"H6629\">sheep</span> <span class=\"wl wl-kjv\" data-code=\"H7257\">lying</span> by it; for out of that <span class=\"wl wl-kjv\" data-code=\"H875\">well</span> they <span class=\"wl wl-kjv\" data-code=\"H8248\">watered</span> the <span class=\"wl wl-kjv\" data-code=\"H5739\">flocks:</span> and a <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H68\">stone</span> was upon the <span class=\"wl wl-kjv\" data-code=\"H875\">well's</span> mouth.","3":"And thither were all the <span class=\"wl wl-kjv\" data-code=\"H5739\">flocks</span> <span class=\"wl wl-kjv\" data-code=\"H622\">gathered:</span> and they <span class=\"wl wl-kjv\" data-code=\"H1556\">rolled</span> the <span class=\"wl wl-kjv\" data-code=\"H68\">stone</span> from the <span class=\"wl wl-kjv\" data-code=\"H875\">well's</span> <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth,</span> and <span class=\"wl wl-kjv\" data-code=\"H8248\">watered</span> the <span class=\"wl wl-kjv\" data-code=\"H6629\">sheep,</span> and <span class=\"wl wl-kjv\" data-code=\"H7725\">put</span> the <span class=\"wl wl-kjv\" data-code=\"H68\">stone</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">again</span> upon the <span class=\"wl wl-kjv\" data-code=\"H875\">well's</span> <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth</span> in his place.","4":"And <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto them, My <span class=\"wl wl-kjv\" data-code=\"H251\">brethren,</span> <span class=\"wl wl-kjv\" data-code=\"H370\">whence</span> be ye? And they <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Of Haran","5":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto them, <span class=\"wl wl-kjv\" data-code=\"H3045\">Know</span> ye <span class=\"wl wl-kjv\" data-code=\"H3837\">Laban</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H5152\">Nahor?</span> And they <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> We know","6":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto them, Is he <span class=\"wl wl-kjv\" data-code=\"H7965\">well?</span> And they <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> He is <span class=\"wl wl-kjv\" data-code=\"H7965\">well:</span> and, behold, <span class=\"wl wl-kjv\" data-code=\"H7354\">Rachel</span> his <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> <span class=\"wl wl-kjv\" data-code=\"H935\">cometh</span> with the sheep.","7":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H2005\">Lo,</span> it is yet <span class=\"wl wl-kjv\" data-code=\"H1419\">high</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> neither is it <span class=\"wl wl-kjv\" data-code=\"H6256\">time</span> that the <span class=\"wl wl-kjv\" data-code=\"H4735\">cattle</span> should be gathered <span class=\"wl wl-kjv\" data-code=\"H622\">together:</span> <span class=\"wl wl-kjv\" data-code=\"H8248\">water</span> ye the <span class=\"wl wl-kjv\" data-code=\"H6629\">sheep,</span> and <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> and feed","8":"And they <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> We <span class=\"wl wl-kjv\" data-code=\"H3201\">cannot,</span> until all the <span class=\"wl wl-kjv\" data-code=\"H5739\">flocks</span> be gathered <span class=\"wl wl-kjv\" data-code=\"H622\">together,</span> and till they <span class=\"wl wl-kjv\" data-code=\"H1556\">roll</span> the <span class=\"wl wl-kjv\" data-code=\"H68\">stone</span> from the <span class=\"wl wl-kjv\" data-code=\"H875\">well's</span> <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth;</span> then we <span class=\"wl wl-kjv\" data-code=\"H8248\">water</span> the sheep.","9":"And while he <span class=\"wl wl-kjv\" data-code=\"H5750\">yet</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> with them, <span class=\"wl wl-kjv\" data-code=\"H7354\">Rachel</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> with her <span class=\"wl wl-kjv\" data-code=\"H1\">father's</span> <span class=\"wl wl-kjv\" data-code=\"H6629\">sheep:</span> for she kept them.","10":"And it came to pass, when <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> <span class=\"wl wl-kjv\" data-code=\"H7354\">Rachel</span> the <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> of <span class=\"wl wl-kjv\" data-code=\"H3837\">Laban</span> his <span class=\"wl wl-kjv\" data-code=\"H517\">mother's</span> <span class=\"wl wl-kjv\" data-code=\"H251\">brother,</span> and the <span class=\"wl wl-kjv\" data-code=\"H6629\">sheep</span> of <span class=\"wl wl-kjv\" data-code=\"H3837\">Laban</span> his <span class=\"wl wl-kjv\" data-code=\"H517\">mother's</span> <span class=\"wl wl-kjv\" data-code=\"H251\">brother,</span> that <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> went <span class=\"wl wl-kjv\" data-code=\"H5066\">near,</span> and <span class=\"wl wl-kjv\" data-code=\"H1556\">rolled</span> the <span class=\"wl wl-kjv\" data-code=\"H68\">stone</span> from the <span class=\"wl wl-kjv\" data-code=\"H875\">well's</span> <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth,</span> and <span class=\"wl wl-kjv\" data-code=\"H8248\">watered</span> the <span class=\"wl wl-kjv\" data-code=\"H6629\">flock</span> of <span class=\"wl wl-kjv\" data-code=\"H3837\">Laban</span> his <span class=\"wl wl-kjv\" data-code=\"H517\">mother's</span> brother.","11":"And <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> <span class=\"wl wl-kjv\" data-code=\"H5401\">kissed</span> <span class=\"wl wl-kjv\" data-code=\"H7354\">Rachel,</span> and lifted <span class=\"wl wl-kjv\" data-code=\"H5375\">up</span> his <span class=\"wl wl-kjv\" data-code=\"H6963\">voice,</span> and wept.","12":"And <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> <span class=\"wl wl-kjv\" data-code=\"H7354\">Rachel</span> that he was her <span class=\"wl wl-kjv\" data-code=\"H1\">father's</span> <span class=\"wl wl-kjv\" data-code=\"H251\">brother,</span> and that he was <span class=\"wl wl-kjv\" data-code=\"H7259\">Rebekah's</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">son:</span> and she <span class=\"wl wl-kjv\" data-code=\"H7323\">ran</span> and <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> her father.","13":"And it came to pass, when <span class=\"wl wl-kjv\" data-code=\"H3837\">Laban</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> the <span class=\"wl wl-kjv\" data-code=\"H8088\">tidings</span> of <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> his <span class=\"wl wl-kjv\" data-code=\"H269\">sister's</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">son,</span> that he <span class=\"wl wl-kjv\" data-code=\"H7323\">ran</span> to <span class=\"wl wl-kjv\" data-code=\"H7125\">meet</span> him, and <span class=\"wl wl-kjv\" data-code=\"H2263\">embraced</span> him, and <span class=\"wl wl-kjv\" data-code=\"H5401\">kissed</span> him, and <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> him to his <span class=\"wl wl-kjv\" data-code=\"H1004\">house.</span> And he <span class=\"wl wl-kjv\" data-code=\"H5608\">told</span> <span class=\"wl wl-kjv\" data-code=\"H3837\">Laban</span> all these things.","14":"And <span class=\"wl wl-kjv\" data-code=\"H3837\">Laban</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to him, <span class=\"wl wl-kjv\" data-code=\"H389\">Surely</span> thou art my <span class=\"wl wl-kjv\" data-code=\"H6106\">bone</span> and my <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh.</span> And he <span class=\"wl wl-kjv\" data-code=\"H3427\">abode</span> with him the <span class=\"wl wl-kjv\" data-code=\"H3117\">space</span> of a month.","15":"And <span class=\"wl wl-kjv\" data-code=\"H3837\">Laban</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob,</span> Because thou art my <span class=\"wl wl-kjv\" data-code=\"H251\">brother,</span> shouldest thou therefore <span class=\"wl wl-kjv\" data-code=\"H5647\">serve</span> me for <span class=\"wl wl-kjv\" data-code=\"H2600\">nought?</span> <span class=\"wl wl-kjv\" data-code=\"H5046\">tell</span> me, what shall thy wages","16":"And <span class=\"wl wl-kjv\" data-code=\"H3837\">Laban</span> had <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters:</span> the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of the <span class=\"wl wl-kjv\" data-code=\"H1419\">elder</span> was <span class=\"wl wl-kjv\" data-code=\"H3812\">Leah,</span> and the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of the <span class=\"wl wl-kjv\" data-code=\"H6996\">younger</span> was Rachel.","17":"<span class=\"wl wl-kjv\" data-code=\"H3812\">Leah</span> was <span class=\"wl wl-kjv\" data-code=\"H7390\">tender</span> <span class=\"wl wl-kjv\" data-code=\"H5869\">eyed;</span> but <span class=\"wl wl-kjv\" data-code=\"H7354\">Rachel</span> was <span class=\"wl wl-kjv\" data-code=\"H3303\">beautiful</span> and <span class=\"wl wl-kjv\" data-code=\"H3303\">well</span> favoured.","18":"And <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> <span class=\"wl wl-kjv\" data-code=\"H157\">loved</span> <span class=\"wl wl-kjv\" data-code=\"H7354\">Rachel;</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> I will <span class=\"wl wl-kjv\" data-code=\"H5647\">serve</span> thee <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> for <span class=\"wl wl-kjv\" data-code=\"H7354\">Rachel</span> thy <span class=\"wl wl-kjv\" data-code=\"H6996\">younger</span> daughter.","19":"And <span class=\"wl wl-kjv\" data-code=\"H3837\">Laban</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> It is <span class=\"wl wl-kjv\" data-code=\"H2896\">better</span> that I <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> her to thee, than that I should <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> her to <span class=\"wl wl-kjv\" data-code=\"H312\">another</span> <span class=\"wl wl-kjv\" data-code=\"H376\">man:</span> abide","20":"And <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> <span class=\"wl wl-kjv\" data-code=\"H5647\">served</span> <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> for <span class=\"wl wl-kjv\" data-code=\"H7354\">Rachel;</span> and they <span class=\"wl wl-kjv\" data-code=\"H5869\">seemed</span> unto him but a <span class=\"wl wl-kjv\" data-code=\"H259\">few</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days,</span> for the love he had","21":"And <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H3837\">Laban,</span> <span class=\"wl wl-kjv\" data-code=\"H3051\">Give</span> me my <span class=\"wl wl-kjv\" data-code=\"H802\">wife,</span> for my <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> are <span class=\"wl wl-kjv\" data-code=\"H4390\">fulfilled,</span> that I may go in","22":"And <span class=\"wl wl-kjv\" data-code=\"H3837\">Laban</span> gathered <span class=\"wl wl-kjv\" data-code=\"H622\">together</span> all the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> of the <span class=\"wl wl-kjv\" data-code=\"H4725\">place,</span> and <span class=\"wl wl-kjv\" data-code=\"H6213\">made</span> a feast.","23":"And it came to pass in the <span class=\"wl wl-kjv\" data-code=\"H6153\">evening,</span> that he <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> <span class=\"wl wl-kjv\" data-code=\"H3812\">Leah</span> his <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> her to him; and he went in","24":"And <span class=\"wl wl-kjv\" data-code=\"H3837\">Laban</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> unto his <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> <span class=\"wl wl-kjv\" data-code=\"H3812\">Leah</span> <span class=\"wl wl-kjv\" data-code=\"H2153\">Zilpah</span> his <span class=\"wl wl-kjv\" data-code=\"H8198\">maid</span> for an handmaid.","25":"And it came to pass, that in the <span class=\"wl wl-kjv\" data-code=\"H1242\">morning,</span> behold, it was <span class=\"wl wl-kjv\" data-code=\"H3812\">Leah:</span> and he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to <span class=\"wl wl-kjv\" data-code=\"H3837\">Laban,</span> What is this thou hast <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> unto me? did not I <span class=\"wl wl-kjv\" data-code=\"H5647\">serve</span> with thee for <span class=\"wl wl-kjv\" data-code=\"H7354\">Rachel?</span> wherefore then hast thou beguiled","26":"And <span class=\"wl wl-kjv\" data-code=\"H3837\">Laban</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> It must not be so <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> in our <span class=\"wl wl-kjv\" data-code=\"H4725\">country,</span> to <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> the <span class=\"wl wl-kjv\" data-code=\"H6810\">younger</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the firstborn.","27":"<span class=\"wl wl-kjv\" data-code=\"H4390\">Fulfil</span> <span class=\"wl wl-kjv\" data-code=\"H2063\">her</span> <span class=\"wl wl-kjv\" data-code=\"H7620\">week,</span> and we will <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> thee this also for the <span class=\"wl wl-kjv\" data-code=\"H5656\">service</span> which thou shalt <span class=\"wl wl-kjv\" data-code=\"H5647\">serve</span> with me yet <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H312\">other</span> years.","28":"And <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> so, and <span class=\"wl wl-kjv\" data-code=\"H4390\">fulfilled</span> her <span class=\"wl wl-kjv\" data-code=\"H7620\">week:</span> and he <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> him <span class=\"wl wl-kjv\" data-code=\"H7354\">Rachel</span> his <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> to wife","29":"And <span class=\"wl wl-kjv\" data-code=\"H3837\">Laban</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> to <span class=\"wl wl-kjv\" data-code=\"H7354\">Rachel</span> his <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> <span class=\"wl wl-kjv\" data-code=\"H1090\">Bilhah</span> his <span class=\"wl wl-kjv\" data-code=\"H8198\">handmaid</span> to be her maid.","30":"And he went <span class=\"wl wl-kjv\" data-code=\"H935\">in</span> also unto <span class=\"wl wl-kjv\" data-code=\"H7354\">Rachel,</span> and he <span class=\"wl wl-kjv\" data-code=\"H157\">loved</span> also <span class=\"wl wl-kjv\" data-code=\"H7354\">Rachel</span> more than <span class=\"wl wl-kjv\" data-code=\"H3812\">Leah,</span> and <span class=\"wl wl-kjv\" data-code=\"H5647\">served</span> with him yet <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H312\">other</span> years.","31":"And when the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> that <span class=\"wl wl-kjv\" data-code=\"H3812\">Leah</span> was <span class=\"wl wl-kjv\" data-code=\"H8130\">hated,</span> he <span class=\"wl wl-kjv\" data-code=\"H6605\">opened</span> her <span class=\"wl wl-kjv\" data-code=\"H7358\">womb:</span> but <span class=\"wl wl-kjv\" data-code=\"H7354\">Rachel</span> was barren.","32":"And <span class=\"wl wl-kjv\" data-code=\"H3812\">Leah</span> <span class=\"wl wl-kjv\" data-code=\"H2029\">conceived,</span> and <span class=\"wl wl-kjv\" data-code=\"H3205\">bare</span> a <span class=\"wl wl-kjv\" data-code=\"H1121\">son,</span> and she <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> his <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> <span class=\"wl wl-kjv\" data-code=\"H7205\">Reuben:</span> <span class=\"wl wl-kjv\" data-code=\"H3588\">for</span> she <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H3588\">Surely</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H7200\">looked</span> upon my <span class=\"wl wl-kjv\" data-code=\"H6040\">affliction;</span> now <span class=\"wl wl-kjv\" data-code=\"H3588\">therefore</span> my <span class=\"wl wl-kjv\" data-code=\"H376\">husband</span> will love","33":"And she <span class=\"wl wl-kjv\" data-code=\"H2029\">conceived</span> again, and <span class=\"wl wl-kjv\" data-code=\"H3205\">bare</span> a <span class=\"wl wl-kjv\" data-code=\"H1121\">son;</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Because the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> that I was <span class=\"wl wl-kjv\" data-code=\"H8130\">hated,</span> he hath therefore <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> me this son also: and she <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> his <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> Simeon.","34":"And she conceived <span class=\"wl wl-kjv\" data-code=\"H2029\">again,</span> and <span class=\"wl wl-kjv\" data-code=\"H3205\">bare</span> a <span class=\"wl wl-kjv\" data-code=\"H1121\">son;</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Now this <span class=\"wl wl-kjv\" data-code=\"H6471\">time</span> will my <span class=\"wl wl-kjv\" data-code=\"H376\">husband</span> be <span class=\"wl wl-kjv\" data-code=\"H3867\">joined</span> unto me, because I have <span class=\"wl wl-kjv\" data-code=\"H3205\">born</span> him <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">sons:</span> therefore was his <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> Levi.","35":"And she <span class=\"wl wl-kjv\" data-code=\"H2029\">conceived</span> again, and <span class=\"wl wl-kjv\" data-code=\"H3205\">bare</span> a <span class=\"wl wl-kjv\" data-code=\"H1121\">son:</span> and she <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H6471\">Now</span> will I <span class=\"wl wl-kjv\" data-code=\"H3034\">praise</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD:</span> therefore she <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> his <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah;</span> and <span class=\"wl wl-kjv\" data-code=\"H5975\">left</span> bearing."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"hief","tekst":"Door deze manier van spreken wordt te kennen gegeven dat Jakob, door de voorgaande goddelijke toespraak getroost en versterkt zijnde, met lust en vreugde zijn weg reisde."},{"catchword":"der kinderen","tekst":"Dat is, van het volk, dat tegen het oosten van Kanaän woonachtig is. Alzo Jdg 6:33; 1Ki 4:30; Job 1:3; Jer 49:28."}],"4":[{"catchword":"broeders","tekst":"Verg. boven, Gen 19:7."}],"5":[{"catchword":"zoon van","tekst":"Dat is, zoons zoon."}],"6":[{"catchword":"Is het","tekst":"Hebr. is hem vrede? of heeft hij vrede? alzo onder, Gen 43:27; 2Sa 18:32; 2Ki 4:26, enz. Zie van het woord vrede, onder Gen 37:14."}],"7":[{"catchword":"het is","tekst":"Hebr. het is nog grootdag."}],"8":[{"catchword":"Wij kunnen","tekst":"Hebr. wij zullen niet kunnen. Te weten, om de zwaarheid van den steen, dien wij met ons weinigen niet kunnen afnemen, en om de gewoonte die wij hebben, naar elkander te wachten."}],"9":[{"catchword":"zij was","tekst":"Zie dergelijke exempelen Exo 2:16; Son 1:7-8."}],"10":[{"catchword":"wentelde","tekst":"Dat is, hij hielp de herders den steen afwentelen in Rachels plaats. Want alleen kon hij het niet doen. Zie vs.8."}],"11":[{"catchword":"kuste","tekst":"Naar het gebruik van die landen, bij manier van groetenis; zo in het komen, gelijk hier vs.13, en onder Gen 33:4; Exo 4:27, en Exo 18:7; als in het scheiden, Rth 1:14; 1Sa 20:41; 1Ki 19:20."},{"catchword":"weende","tekst":"Te weten, van blijdschap, omdat hij daar zijn nicht zo bekwamelijk en tijdig ontmoette. Zie van dergelijk wenen ook onder, Gen 33:4."}],"12":[{"catchword":"broeder was","tekst":"Zie boven, Gen 13:8."}],"13":[{"catchword":"als Laban","tekst":"Hebr. toen Laban de horing Jakobs hoorde."},{"catchword":"al deze","tekst":"Te weten, de oorzaak van zijn reis, en wat hem op den weg bejegend was, hetwelk alles Laban diende te weten, om voor te komen alle kwaad vermoeden van een zo schielijke en slechte aankomst, in vergelijking van Eliëzers aankomst; boven, Gen 24."}],"14":[{"catchword":"mijn gebeente","tekst":"Dat is, mijn verwant, mijn maagschap. Zie dergelijke manier van spreken boven, Gen 2:23, en Jdg 9:2; 2Sa 19:12-13, en 1Ch 11:1, als ook in het geestelijke, Eph 5:30."},{"catchword":"een volle","tekst":"Hebr. een maand der dagen, dat is, een volle maand, of, zoveel dagen als er in een maand gaan. Alzo is een jaar der dagen, onder Gen 41:1, te zeggen een geheel jaar."}],"16":[{"catchword":"grootste","tekst":"Dat is, der oudste."},{"catchword":"kleinste","tekst":"Dat is, der jongste."}],"17":[{"catchword":"tedere","tekst":"Dat is, zwakke en gebrekkelijke."}],"18":[{"catchword":"zeven","tekst":"Jakob biedt aan, een langen tijd te dienen, zowel omdat de gierigheid van zijn oom hem niet onbekend was; alsook omdat hij, Rachel zeer beminnende, begeerde aldus meteen den bruidsschat te betalen, dien de bruidegoms in dien tijd geven moesten; zoals blijkt uit Exo 22:17, en 1Sa 18:25."}],"19":[{"catchword":"Het is","tekst":"Een twijfelachtig en listig antwoord, gelijk de uitkomst wel geleerd heeft."}],"20":[{"catchword":"als enige","tekst":"Hebr. ene dagen. Zie deze manier van spreken ook boven, Gen 27:44. De zin dezer woorden is dat Jakob deze tijd zeer kort viel."}],"21":[{"catchword":"mijn huisvrouw,","tekst":"Dat is, mijn ondertrouwde vrouw, uit kracht van het verdrag des huwelijks. Zie dergelijke manier van spreken, Mat 1:18-19, en Luk 2:5."},{"catchword":"mijn","tekst":"Te weten, de besproken jaren van mijn dienst."},{"catchword":"dat ik","tekst":"Zie boven, Gen 6:4, en Gen 16:2."}],"22":[{"catchword":"al de","tekst":"Dat is, zeer velen; te weten, al zijn vrienden en goede bekenden, naburen en de aanzienlijksten der stad, volgens de gewoonte; zie Jdg 14:10-11; Joh 2:1-2, enz. en dezen noodde hij in des te meerder getal, opdat Jakob minder zou durven veranderen den snoden vond, dien hij bedacht had om hem te bedriegen."}],"23":[{"catchword":"en bracht","tekst":"Het schijnt uit deze plaats dat het in die tijden gebruikelijk was, dat men de bruid tot den bruidegom in de slaapkamer bracht, bedekt zijnde met een doek of sluier, om haar beschaamdheid; doch onder dezen schijn is Jakob bedrogen."}],"24":[{"catchword":"tot","tekst":"Dit woordje wordt hier ingevoegd uit het volgende vs. (29). Het was in die tijden een gebruik, dat de ouders, hun dochters ten huwelijk uitgevende, een dienstmaagd of andere vrouwelijke persoon medegaven. Zie boven, Gen 24:59."}],"26":[{"catchword":"Men doet","tekst":"Indien dit zo was, zo behoorde Laban dit Jakob tevoren gezegd, en hem zo lelijk niet bedrogen of behandeld te hebben."},{"catchword":"de kleine","tekst":"Hebr. de kleine, dat is, de jongste."}],"27":[{"catchword":"Vervul","tekst":"Dat is, houd deze zeven dagen van het begonnen bruiloftsfeest met Lea uit; zie een dergelijk exempel van een zevendaagse bruiloft, Jdg 14:12, Jdg 14:15, Jdg 14:17. Sommigen nemen deze week voor een jaarweek."},{"catchword":"dan zullen","tekst":"Te weten, na het einde van deze week, zoals volgt, vs.28."}],"28":[{"catchword":"gaf hij","tekst":"Hoewel het schijnt dat deze vrijheid van twee zusters aan één man uit te geven, door menselijke wetten nog niet verboden was; nochtans streed zij tegen de natuur en de wet, daarna door Mozes gegeven, Lev 18:18."}],"30":[{"catchword":"hij ging","tekst":"Jakob laat zich overreden twee vrouwen tegelijk te nemen, dat wel was naar het gebruik van dien tijd, maar niet naar de instelling Gods; boven, Gen 2:24; Mal 2:15. Zie ook de aantekening, Gen 4:19."}],"31":[{"catchword":"gehaat","tekst":"Dat is, dat zij haar man zo lief een aangenaam niet was als Rachel; zie boven, vs.20. Het woord haten wordt somtijds gebruikt voor minder liefhebben. Zie Deu 21:15; Mat 6:24, en Luk 14:26."},{"catchword":"opende","tekst":"Dat is, Hij maakte haar vruchtbaar. Zie boven, Gen 20:18."}],"32":[{"catchword":"Ruben;","tekst":"Dat is, zie een zoon, of een zoon des aanziens, alsof zij zeide: zie hoe mij nu God een zoon gegeven heeft in mijn verdrukking, want haar man had haar zo lief niet als haar zuster."},{"catchword":"liefhebben","tekst":"Dat is, liever dan tevoren."}],"33":[{"catchword":"Simeon","tekst":"Hebr. Schimon. Deze naam komt van een woord, hetwelk betekent horen, of verhoren. Want God verhoorde haar gebed en haar zuchten."}],"34":[{"catchword":"hij zijn","tekst":"Te weten, Jakob."},{"catchword":"Levi","tekst":"Dat is, toegevoegd of bijvoeging, of mijn bijvoeging. De oorzaak voor dezen naam staat in den tekst."}],"35":[{"catchword":"loven;","tekst":"Hiervan komt de naam Jehudah, dat is, lof, dankzegging, belijdenis, bekentenis."},{"catchword":"Juda","tekst":"Hebr. Jehudah."},{"catchword":"hield op","tekst":"Hebr. zij stond van baren; alzo onder, Gen 30:9."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"The Jacob lifted up his feet [hereby is shewed that Jacob being comforted and strengthened thus by the late vision and heavenly oracle he now went cheerfully and courageously in his journey] and went to the land of the children of the east [that is of the people that inhabited the country lying east from Canaan so Jud 6:33 1 Kings 4.30 Job 1:3 Jer 49:28.]"}],"2":[{"catchword":null,"tekst":"And he looked , and behold ,there was a well in the field ,and there were three flocks of sheep lying down by it ;door out of that well they watered the flocks ,and there was a great stone on the mouth of that well ."}],"3":[{"catchword":null,"tekst":"and thitherward all the flocks were gathered and they rolled the stone from, and watered the sheep; and laid the stone again upon the mouth of that well on his place."}],"4":[{"catchword":null,"tekst":"Then said Jacob to them; my brethren [compare above chap19the annotations on verse 7] whence ye? And they said we are Haran."}],"5":[{"catchword":null,"tekst":"And he said to them know ye Laban the son of Nahor? [His grand son] and they said we know him."}],"6":[{"catchword":null,"tekst":"Further he said to them is it well with him? [Heb. Is peace to him? Or hath he peace? So above chapter 27.23 2Sa 18:32 2Ki 4:26 &c. see of this word peace below chapter 37 on verse 14] and they said it is well and Lo Rachel his daughter that comes with the sheep."}],"7":[{"catchword":null,"tekst":"And he said behold it is high day yet [Heb. Great day yet] it is no time that the cattle he gathered water the sheep and go your way and feed them."}],"8":[{"catchword":null,"tekst":"Then they said we cannot [Heb. We shall not be able viz. by reason of the stones heaviness which a few of us cannot remove and because of our custom to wait one for another] till all the flocks shall be gathered together and that the stones be rolled off from the wells mouth that we may water the sheep."}],"9":[{"catchword":null,"tekst":"When he was yet speaking with them there came Rachel with the sheep belonging to her father for she was a shepherdess [see the like example Exo 2:16 Cant 1.7, 8.]"}],"10":[{"catchword":null,"tekst":"And it came to pass when Rachel saw Jacob the daughter of Laban the mothers brother and the sheep of Laban his mothers brother that Jacob slept on and rolled on the stone from the mouth of the well [that is he helped the rest of the shepherds to roll it off in Rachel stead for alone he was not able to do it see backwards verse 8] and watered the sheep of Laban his mothers brother."}],"11":[{"catchword":null,"tekst":"And Jacob kissed Rachel [after the manner of those countries kissing by way of salutation as well at the first meting as here verse 13 and below chapter 33 verse 4 Exo 4:27. and 18.7 as at parting Ruth 1.14 and 1Samuel 20 verse 41 and 1Ki 19:20] and he lifted up his voice and wept [viz. for joy to have met his cousin there so soon and opportunely see of the weeping below chapter 33 verse 4.]"}],"12":[{"catchword":null,"tekst":"And Jacob acquainted Rachel that he was his father&acirc;&euro;&trade;s brother [see above chapter 13 verses 8] and that he was the son of Rebecca then she ran and acquainted her father with it."}],"13":[{"catchword":null,"tekst":"And it came to pass when Laban heard the news [Heb. The hearing] of Jacob his sisters son that he ran to meet him and embraced him and kissed him and brought him to his house and related all things to Laban [to wit the reason and occasion of his journey and what happened to him by the way all which it was fit Laban should understand for the preventing of all sinister surmises as might be occasioned by such an unusual (function bouwHfdnav() {

    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');

  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'

  document.getElementById('hfdnav').innerHTML =

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers) => {
    const afk = REFBOEK2AFK[boek];
    return afk ? `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${heel}</a>` : heel;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
