11\" data-code=\"H5975\">En</span> <span class=\"wl\" data-l=\"L11\" data-code=\"H5975\">zij</span> <span class=\"wl\" data-l=\"L11\" data-code=\"H5975\">hield</span> <span class=\"wl\" data-l=\"L11\" data-code=\"H5975\">op</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H3205\">met</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H3205\">baren</span>."}, "koppeling_kjv": {"1": "Then <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> went <span class=\"wl wl-kjv\" data-code=\"H5375\">on</span> his <span class=\"wl wl-kjv\" data-code=\"H7272\">journey,</span> and <span class=\"wl wl-kjv\" data-code=\"H3212\">came</span> into the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">people</span> of the east.", "2": "And he <span class=\"wl wl-kjv\" data-code=\"H7200\">looked,</span> and behold a <span class=\"wl wl-kjv\" data-code=\"H875\">well</span> in the <span class=\"wl wl-kjv\" data-code=\"H7704\">field,</span> and, lo, there were <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H5739\">flocks</span> of <span class=\"wl wl-kjv\" data-code=\"H6629\">sheep</span> <span class=\"wl wl-kjv\" data-code=\"H7257\">lying</span> by it; for out of that <span class=\"wl wl-kjv\" data-code=\"H875\">well</span> they <span class=\"wl wl-kjv\" data-code=\"H8248\">watered</span> the <span class=\"wl wl-kjv\" data-code=\"H5739\">flocks:</span> and a <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H68\">stone</span> was upon the <span class=\"wl wl-kjv\" data-code=\"H875\">well's</span> mouth.", "3": "And thither were all the <span class=\"wl wl-kjv\" data-code=\"H5739\">flocks</span> <span class=\"wl wl-kjv\" data-code=\"H622\">gathered:</span> and they <span class=\"wl wl-kjv\" data-code=\"H1556\">rolled</span> the <span class=\"wl wl-kjv\" data-code=\"H68\">stone</span> from the <span class=\"wl wl-kjv\" data-code=\"H875\">well's</span> <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth,</span> and <span class=\"wl wl-kjv\" data-code=\"H8248\">watered</span> the <span class=\"wl wl-kjv\" data-code=\"H6629\">sheep,</span> and <span class=\"wl wl-kjv\" data-code=\"H7725\">put</span> the <span class=\"wl wl-kjv\" data-code=\"H68\">stone</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">again</span> upon the <span class=\"wl wl-kjv\" data-code=\"H875\">well's</span> <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth</span> in his place.", "4": "And <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto them, My <span class=\"wl wl-kjv\" data-code=\"H251\">brethren,</span> <span class=\"wl wl-kjv\" data-code=\"H370\">whence</span> be ye? And they <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Of Haran", "5": "And he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto them, <span class=\"wl wl-kjv\" data-code=\"H3045\">Know</span> ye <span class=\"wl wl-kjv\" data-code=\"H3837\">Laban</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H5152\">Nahor?</span> And they <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> We know", "6": "And he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto them, Is he <span class=\"wl wl-kjv\" data-code=\"H7965\">well?</span> And they <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> He is <span class=\"wl wl-kjv\" data-code=\"H7965\">well:</span> and, behold, <span class=\"wl wl-kjv\" data-code=\"H7354\">Rachel</span> his <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> <span class=\"wl wl-kjv\" data-code=\"H935\">cometh</span> with the sheep.", "7": "And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H2005\">Lo,</span> it is yet <span class=\"wl wl-kjv\" data-code=\"H1419\">high</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> neither is it <span class=\"wl wl-kjv\" data-code=\"H6256\">time</span> that the <span class=\"wl wl-kjv\" data-code=\"H4735\">cattle</span> should be gathered <span class=\"wl wl-kjv\" data-code=\"H622\">together:</span> <span class=\"wl wl-kjv\" data-code=\"H8248\">water</span> ye the <span class=\"wl wl-kjv\" data-code=\"H6629\">sheep,</span> and <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> and feed", "8": "And they <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> We <span class=\"wl wl-kjv\" data-code=\"H3201\">cannot,</span> until all the <span class=\"wl wl-kjv\" data-code=\"H5739\">flocks</span> be gathered <span class=\"wl wl-kjv\" data-code=\"H622\">together,</span> and till they <span class=\"wl wl-kjv\" data-code=\"H1556\">roll</span> the <span class=\"wl wl-kjv\" data-code=\"H68\">stone</span> from the <span class=\"wl wl-kjv\" data-code=\"H875\">well's</span> <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth;</span> then we <span class=\"wl wl-kjv\" data-code=\"H8248\">water</span> the sheep.", "9": "And while he <span class=\"wl wl-kjv\" data-code=\"H5750\">yet</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> with them, <span class=\"wl wl-kjv\" data-code=\"H7354\">Rachel</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> with her <span class=\"wl wl-kjv\" data-code=\"H1\">father's</span> <span class=\"wl wl-kjv\" data-code=\"H6629\">sheep:</span> for she kept them.", "10": "And it came to pass, when <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> <span class=\"wl wl-kjv\" data-code=\"H7354\">Rachel</span> the <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> of <span class=\"wl wl-kjv\" data-code=\"H3837\">Laban</span> his <span class=\"wl wl-kjv\" data-code=\"H517\">mother's</span> <span class=\"wl wl-kjv\" data-code=\"H251\">brother,</span> and the <span class=\"wl wl-kjv\" data-code=\"H6629\">sheep</span> of <span class=\"wl wl-kjv\" data-code=\"H3837\">Laban</span> his <span class=\"wl wl-kjv\" data-code=\"H517\">mother's</span> <span class=\"wl wl-kjv\" data-code=\"H251\">brother,</span> that <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> went <span class=\"wl wl-kjv\" data-code=\"H5066\">near,</span> and <span class=\"wl wl-kjv\" data-code=\"H1556\">rolled</span> the <span class=\"wl wl-kjv\" data-code=\"H68\">stone</span> from the <span class=\"wl wl-kjv\" data-code=\"H875\">well's</span> <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth,</span> and <span class=\"wl wl-kjv\" data-code=\"H8248\">watered</span> the <span class=\"wl wl-kjv\" data-code=\"H6629\">flock</span> of <span class=\"wl wl-kjv\" data-code=\"H3837\">Laban</span> his <span class=\"wl wl-kjv\" data-code=\"H517\">mother's</span> brother.", "11": "And <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> <span class=\"wl wl-kjv\" data-code=\"H5401\">kissed</span> <span class=\"wl wl-kjv\" data-code=\"H7354\">Rachel,</span> and lifted <span class=\"wl wl-kjv\" data-code=\"H5375\">up</span> his <span class=\"wl wl-kjv\" data-code=\"H6963\">voice,</span> and wept.", "12": "And <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> <span class=\"wl wl-kjv\" data-code=\"H7354\">Rachel</span> that he was her <span class=\"wl wl-kjv\" data-code=\"H1\">father's</span> <span class=\"wl wl-kjv\" data-code=\"H251\">brother,</span> and that he was <span class=\"wl wl-kjv\" data-code=\"H7259\">Rebekah's</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">son:</span> and she <span class=\"wl wl-kjv\" data-code=\"H7323\">ran</span> and <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> her father.", "13": "And it came to pass, when <span class=\"wl wl-kjv\" data-code=\"H3837\">Laban</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> the <span class=\"wl wl-kjv\" data-code=\"H8088\">tidings</span> of <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> his <span class=\"wl wl-kjv\" data-code=\"H269\">sister's</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">son,</span> that he <span class=\"wl wl-kjv\" data-code=\"H7323\">ran</span> to <span class=\"wl wl-kjv\" data-code=\"H7125\">meet</span> him, and <span class=\"wl wl-kjv\" data-code=\"H2263\">embraced</span> him, and <span class=\"wl wl-kjv\" data-code=\"H5401\">kissed</span> him, and <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> him to his <span class=\"wl wl-kjv\" data-code=\"H1004\">house.</span> And he <span class=\"wl wl-kjv\" data-code=\"H5608\">told</span> <span class=\"wl wl-kjv\" data-code=\"H3837\">Laban</span> all these things.", "14": "And <span class=\"wl wl-kjv\" data-code=\"H3837\">Laban</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to him, <span class=\"wl wl-kjv\" data-code=\"H389\">Surely</span> thou art my <span class=\"wl wl-kjv\" data-code=\"H6106\">bone</span> and my <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh.</span> And he <span class=\"wl wl-kjv\" data-code=\"H3427\">abode</span> with him the <span class=\"wl wl-kjv\" data-code=\"H3117\">space</span> of a month.", "15": "And <span class=\"wl wl-kjv\" data-code=\"H3837\">Laban</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob,</span> Because thou art my <span class=\"wl wl-kjv\" data-code=\"H251\">brother,</span> shouldest thou therefore <span class=\"wl wl-kjv\" data-code=\"H5647\">serve</span> me for <span class=\"wl wl-kjv\" data-code=\"H2600\">nought?</span> <span class=\"wl wl-kjv\" data-code=\"H5046\">tell</span> me, what shall thy wages", "16": "And <span class=\"wl wl-kjv\" data-code=\"H3837\">Laban</span> had <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters:</span> the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of the <span class=\"wl wl-kjv\" data-code=\"H1419\">elder</span> was <span class=\"wl wl-kjv\" data-code=\"H3812\">Leah,</span> and the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of the <span class=\"wl wl-kjv\" data-code=\"H6996\">younger</span> was Rachel.", "17": "<span class=\"wl wl-kjv\" data-code=\"H3812\">Leah</span> was <span class=\"wl wl-kjv\" data-code=\"H7390\">tender</span> <span class=\"wl wl-kjv\" data-code=\"H5869\">eyed;</span> but <span class=\"wl wl-kjv\" data-code=\"H7354\">Rachel</span> was <span class=\"wl wl-kjv\" data-code=\"H3303\">beautiful</span> and <span class=\"wl wl-kjv\" data-code=\"H3303\">well</span> favoured.", "18": "And <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> <span class=\"wl wl-kjv\" data-code=\"H157\">loved</span> <span class=\"wl wl-kjv\" data-code=\"H7354\">Rachel;</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> I will <span class=\"wl wl-kjv\" data-code=\"H5647\">serve</span> thee <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> for <span class=\"wl wl-kjv\" data-code=\"H7354\">Rachel</span> thy <span class=\"wl wl-kjv\" data-code=\"H6996\">younger</span> daughter.", "19": "And <span class=\"wl wl-kjv\" data-code=\"H3837\">Laban</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> It is <span class=\"wl wl-kjv\" data-code=\"H2896\">better</span> that I <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> her to thee, than that I should <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> her to <span class=\"wl wl-kjv\" data-code=\"H312\">another</span> <span class=\"wl wl-kjv\" data-code=\"H376\">man:</span> abide", "20": "And <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> <span class=\"wl wl-kjv\" data-code=\"H5647\">served</span> <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> for <span class=\"wl wl-kjv\" data-code=\"H7354\">Rachel;</span> and they <span class=\"wl wl-kjv\" data-code=\"H5869\">seemed</span> unto him but a <span class=\"wl wl-kjv\" data-code=\"H259\">few</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days,</span> for the love he had", "21": "And <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H3837\">Laban,</span> <span class=\"wl wl-kjv\" data-code=\"H3051\">Give</span> me my <span class=\"wl wl-kjv\" data-code=\"H802\">wife,</span> for my <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> are <span class=\"wl wl-kjv\" data-code=\"H4390\">fulfilled,</span> that I may go in", "22": "And <span class=\"wl wl-kjv\" data-code=\"H3837\">Laban</span> gathered <span class=\"wl wl-kjv\" data-code=\"H622\">together</span> all the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> of the <span class=\"wl wl-kjv\" data-code=\"H4725\">place,</span> and <span class=\"wl wl-kjv\" data-code=\"H6213\">made</span> a feast.", "23": "And it came to pass in the <span class=\"wl wl-kjv\" data-code=\"H6153\">evening,</span> that he <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> <span class=\"wl wl-kjv\" data-code=\"H3812\">Leah</span> his <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> her to him; and he went in", "24": "And <span class=\"wl wl-kjv\" data-code=\"H3837\">Laban</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> unto his <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> <span class=\"wl wl-kjv\" data-code=\"H3812\">Leah</span> <span class=\"wl wl-kjv\" data-code=\"H2153\">Zilpah</span> his <span class=\"wl wl-kjv\" data-code=\"H8198\">maid</span> for an handmaid.", "25": "And it came to pass, that in the <span class=\"wl wl-kjv\" data-code=\"H1242\">morning,</span> behold, it was <span class=\"wl wl-kjv\" data-code=\"H3812\">Leah:</span> and he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to <span class=\"wl wl-kjv\" data-code=\"H3837\">Laban,</span> What is this thou hast <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> unto me? did not I <span class=\"wl wl-kjv\" data-code=\"H5647\">serve</span> with thee for <span class=\"wl wl-kjv\" data-code=\"H7354\">Rachel?</span> wherefore then hast thou beguiled", "26": "And <span class=\"wl wl-kjv\" data-code=\"H3837\">Laban</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> It must not be so <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> in our <span class=\"wl wl-kjv\" data-code=\"H4725\">country,</span> to <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> the <span class=\"wl wl-kjv\" data-code=\"H6810\">younger</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the firstborn.", "27": "<span class=\"wl wl-kjv\" data-code=\"H4390\">Fulfil</span> <span class=\"wl wl-kjv\" data-code=\"H2063\">her</span> <span class=\"wl wl-kjv\" data-code=\"H7620\">week,</span> and we will <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> thee this also for the <span class=\"wl wl-kjv\" data-code=\"H5656\">service</span> which thou shalt <span class=\"wl wl-kjv\" data-code=\"H5647\">serve</span> with me yet <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H312\">other</span> years.", "28": "And <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> so, and <span class=\"wl wl-kjv\" data-code=\"H4390\">fulfilled</span> her <span class=\"wl wl-kjv\" data-code=\"H7620\">week:</span> and he <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> him <span class=\"wl wl-kjv\" data-code=\"H7354\">Rachel</span> his <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> to wife", "29": "And <span class=\"wl wl-kjv\" data-code=\"H3837\">Laban</span> <span class=\"wl (function bouwHfdnav() {
  const m = D.meta;

    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>

  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'

  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +

  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);

    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [

function paneelInhoud(n, tab) {

    let h = '';

    }

      h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');

}
function renderPaneel(n) {

  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een vers: snel wisselen van vertaling ---------- */
(function () {
  const menu = document.createElement('div');
  menu.id = 'vertmenu';
  menu.style.cssText = 'position:absolute;display:none;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.3rem;font-family:sans-serif;font-size:.85rem;z-index:30;min-width:7rem;';
  document.body.appendChild(menu);
  function toon(x, y) {
    menu.innerHTML = Object.keys(D.vertalingen).map(naam =>
      `<div class="vm-optie" data-v="${naam}" style="padding:.35rem .6rem;border-radius:5px;cursor:pointer;${naam === vertaling ? 'font-weight:700;color:var(--accent-donker)' : ''}">${naam}</div>`
    ).join('');
    const breedte = document.documentElement.clientWidth;
    menu.style.left = Math.max(4, Math.min(x, breedte - 130)) + 'px';
    menu.style.top = y + 'px';
    menu.style.display = 'block';
  }
  document.addEventListener('contextmenu', e => {
    const rij = e.target.closest('.vers');
    if (!rij) return;
    e.preventDefault();
    toon(e.pageX, e.pageY);
  });
  menu.addEventListener('mouseover', e => {
    const o = e.target.closest('.vm-optie');
    if (o) o.style.background = 'var(--bg-soft)';
  });
  menu.addEventListener('mouseout', e => {
    const o = e.target.closest('.vm-optie');
    if (o) o.style.background = '';
  });
  menu.addEventListener('click', e => {
    const o = e.target.closest('.vm-optie');
    if (!o) return;
    vertaling = o.dataset.v;
    const kies = document.getElementById('vertaalkies');
    if (kies) kies.value = vertaling;
    bouwRijen();
    menu.style.display = 'none';
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#vertmenu')) menu.style.display = 'none';
  });
  document.addEventListener('scroll', () => { menu.style.display = 'none'; }, true);
})();
</script>
