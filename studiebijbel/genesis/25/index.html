het droge doen beven.", "Obadja 1:1": "Het visioen van Obadja. Zo zegt de Heere HEERE van Edom: Wij hebben een bericht gehoord van de HEERE, en er is een gezant gestuurd onder de heidenvolken: Sta op, en laten wij tegen haar opstaan ten strijde.", "Gen 21:20": "En God was met de jongen; en hij werd groot, en hij woonde in de woestijn, en werd een boogschutter.", "Jes 42:1-4": "Zie, Mijn Knecht, Die Ik ondersteun, Mijn Uitverkorene, in Wie Mijn ziel een welbehagen heeft! Ik heb Mijn Geest op Hem gegeven; Hij zal het recht aan de heidenen voortbrengen. Hij zal niet schreeuwen, noch Zijn stem verheffen, noch Zijn stem op straat horen laten. Het geknakte riet zal Hij niet breken, en de rokende vlaswiek zal Hij niet uitblussen; met waarheid zal Hij het recht voortbrengen.", "Gen 30:9": "Toen Lea nu zag dat zij ophield met baren, nam zij ook haar dienstmaagd Zilpa, en gaf haar aan Jakob tot vrouw.", "Amos 1:11": "Zo zegt de HEERE: Om drie overtredingen van Edom, en om vier zal Ik dat niet afwenden; omdat hij zijn broeders met het zwaard heeft vervolgd, en zijn medelijden heeft verdorven; en dat zijn toorn eeuwig verscheurt, en hij zijn woede altijd blijft koesteren.", "Jer 9:26": "Over Egypte, en over Juda, en over Edom, en over de kinderen van Ammon, en over Moab, en over allen die aan de hoeken kortgeknipt zijn, die in de woestijn wonen; want alle heidenen hebben de voorhuid, maar het hele huis van Israël heeft de voorhuid van het hart.", "Gen 49:30": "In de spelonk die op de akker van Machpela is, die tegenover Mamre is, in het land Kanaän, die Abraham met die akker gekocht heeft van Efron, de Hethiet, tot een erfbegrafenis.", "Ex 21:24": "oog voor oog, tand voor tand, hand voor hand, voet voor voet,", "Ef 4:25": "Daarom, leg de leugen af, en spreek de waarheid, ieder met zijn naaste; want wij zijn elkaars leden.", "Luk 20:17": "Maar Hij keek hen aan en zei: Wat betekent dan wat er geschreven staat: De steen die de bouwers verworpen hebben, die is de hoeksteen geworden?", "Luk 3:34": "de zoon van Jakob, de zoon van Izak, de zoon van Abraham, de zoon van Thara, de zoon van Nachor,", "Jes 28:11": "Daarom zal Hij door belachelijke lippen en door een andere tong tot dit volk spreken;", "Luk 7:27": "Deze is het, over wie geschreven is: Zie, Ik zend Mijn engel voor Uw aangezicht uit, die Uw weg voor U klaar zal maken.", "Ps 97:7": "Beschaamd moeten worden allen die de beelden dienen, die zich op afgoden beroemen; buig u neer voor Hem, alle goden!", "Matt 19:19": "Eer uw vader en moeder; en: U zult uw naaste liefhebben als uzelf.", "Jes 21:11": "De last van Duma. Men roept tot mij uit Seïr: Wachter! wat is er van de nacht? Wachter! wat is er van de nacht?", "2 Kor 4:13": "Omdat wij nu dezelfde Geest van het geloof hebben, zoals er geschreven is: Ik heb geloofd, daarom heb ik gesproken; zo geloven wij ook, daarom spreken wij ook;", "Gen 15:3": "Verder zei Abram: Zie, mij hebt U geen nageslacht gegeven, en zie, de zoon van mijn huis zal mijn erfgenaam zijn!", "Hand 21:34": "En in de menigte riep de één dit, de ander wat anders. En omdat hij vanwege de opschudding niets met zekerheid kon te weten komen, beval hij dat men hem naar de legerplaats zou brengen.", "Zach 11:13": "Doch de HEERE zei tegen mij: Werp ze heen voor de pottenbakker: een heerlijke prijs, die Ik van hen waard geacht ben geweest! En ik nam die dertig zilverlingen, en wierp ze in het huis van de HEERE, voor de pottenbakker.", "Hand 3:25": "U bent kinderen van de profeten, en van het verbond dat God met onze vaderen gesloten heeft, toen Hij tegen Abraham zei: En in uw nageslacht zullen alle geslachten van de aarde gezegend worden.", "Rom 9:26": "En het zal zijn: op de plaats waar tot hen gezegd was: U bent Mijn volk niet, daar zullen zij kinderen van de levende God genoemd worden.", "Gen 24:62": "Izak nu kwam van de weg naar de put Lachai-Roi; want hij woonde in het zuiderland.", "Mark 12:26": "Maar wat de doden betreft, dat zij opgewekt zullen worden: hebt u niet gelezen in het boek van Mozes, hoe God in de doornstruik tot hem gesproken heeft: Ik ben de God van Abraham, en de God van Izak, en de God van Jakob?", "Ps 106:24": "Zij versmaadden ook het gewenste land; zij geloofden Zijn woord niet.", "1 Kron 1:29-31": "Dit zijn hun geboorten: de eerstgeborene van Ismaël was Nebajoth, en Kedar, en Adbeel, en Mibsam, Misma en Duma, Massa, Hadad en Thema, Jetur, Nafis, en Kedma; deze zijn de kinderen van Ismaël.", "Num 36:1-8": "En de familiehoofden van het geslacht van de kinderen van Gilead, de zoon van Machir, de zoon van Manasse, uit de geslachten van de kinderen van Jozef, traden naar voren en spraken voor Mozes en voor de leiders, de familiehoofden van de kinderen van Israël. En zij zeiden: De HEERE heeft mijn heer geboden dat land door het lot aan de kinderen van Israël in erfenis te geven; en mijn heer is door de HEERE geboden de erfenis van onze broeder Zelafead te geven aan zijn dochters. Wanneer zij aan een van de zonen van de andere stammen van de kinderen van Israël tot vrouw zouden worden, dan zou hun erfenis van de erfenis van onze vaderen afgetrokken worden, en toegevoegd worden aan de erfenis van die stam waaraan zij zouden komen; zo zou van het lot van onze erfenis worden afgetrokken.", "Deut 21:23": "Dan zal zijn dode lichaam niet aan het hout overnachten; maar u zult hem beslist diezelfde dag begraven; want een opgehangene is door God vervloekt. Zo zult u uw land niet verontreinigen, dat de HEERE, uw God, u als erfdeel geeft.", "Hand 13:47": "Want zo heeft de Heere ons geboden: Ik heb u gesteld tot een licht voor de heidenen, opdat u tot zaligheid zou zijn, tot aan het uiterste van de aarde.", "Hebr 1:13": "En tegen wie van de engelen heeft Hij ooit gezegd: Zit aan Mijn rechterhand, totdat Ik Uw vijanden tot een voetbank van Uw voeten gezet heb?", "Joh 19:24": "Zij zeiden dan tegen elkaar: Laten wij die niet scheuren, maar erom loten, van wie die zal zijn; opdat de Schrift vervuld wordt, die zegt: Zij hebben Mijn kleren onder elkaar verdeeld, en over Mijn kleding hebben zij het lot geworpen. Dit hebben de soldaten dan gedaan.", "Matt 5:27": "U hebt gehoord dat gezegd is: U zult geen overspel plegen.", "2 Kron 21:3": "En hun vader had hun veel geschenken gegeven van zilver, van goud en van kostbaarheden, alsook versterkte steden in Juda; maar het koninkrijk gaf hij aan Joram, omdat hij de eerstgeborene was.", "Ps 110:1": "Een psalm van David. De HEERE heeft tot mijn Heere gesproken: Zit aan Mijn rechterhand, totdat Ik Uw vijanden gezet zal hebben tot een voetbank van Uw voeten.", "Richt 8:4": "Toen Gideon nu bij de Jordaan gekomen was, ging hij eroverheen, met de driehonderd mannen die bij hem waren, moe, maar toch nog vervolgend.", "Gen 24:60": "En zij zegenden Rebekka, en zeiden tegen haar: O, onze zuster! Word u tot duizenden miljoenen, en laat uw nageslacht de poort van hun haters bezitten!", "Hand 7:2": "En hij zei: Mannen, broeders en vaders, luister: de God van de heerlijkheid verscheen aan onze vader Abraham, toen hij nog in Mesopotamië was, voordat hij in Haran woonde,", "Est 9:27": "legden de Joden vast, en namen op zich en op hun nageslacht, en op allen die zich bij hen zouden aansluiten, dat men het niet zou overtreden, dat zij deze twee dagen zouden houden, naar het voorschrift ervan, en naar de vastgestelde tijd ervan, elk jaar opnieuw;", "Jes 21:17": "En het overgebleven aantal van de schutters, de helden van de Kedarenen, zal minder worden, want de HEERE, de God van Israël, heeft het gesproken.", "1 Kron 5:19-22": "En zij voerden oorlog tegen de Hagarenen, en tegen Jethur, en Nafis, en Nodab. Maar zij werden tegen hen geholpen, en de Hagarenen werden in hun hand gegeven, en allen die met hen waren; omdat zij tot God riepen in de strijd, liet Hij Zich door hen verbidden, omdat zij op Hem vertrouwden. En zij voerden hun vee gevankelijk weg; van hun kamelen vijftigduizend, en tweehonderdvijftigduizend schapen, en tweeduizend ezels, en honderdduizend mensenzielen.", "Ps 22:19": "Zij delen mijn kleren onder zich, en werpen het lot over mijn gewaad.", "Gen 28:9": "toen ging Ezau naar Ismaël, en nam zich, naast zijn andere vrouwen, tot vrouw Mahalath, de dochter van Ismaël, de zoon van Abraham, de zuster van Nebajoth.", "Hand 8:32": "En het gedeelte van de Schrift dat hij las, was dit: Hij is als een schaap naar de slachting geleid; en zoals een lam stemloos is voor wie het scheert, zo doet Hij Zijn mond niet open.", "Mark 10:6": "Maar van het begin van de schepping af heeft God hen man en vrouw gemaakt.", "1 Sam 13:14": "Maar nu zal uw koningschap niet blijven bestaan. De HEERE heeft Zich een man gezocht naar Zijn hart, en de HEERE heeft hem bevolen een voorganger te zijn over Zijn volk, omdat u niet gehouden hebt wat de HEERE u geboden had.", "Jes 40:30": "De jongens zullen moede en mat worden, en de jongemannen zullen zeker vallen;", "Num 27:8-11": "En tegen de kinderen van Israël zult u zeggen: Wanneer iemand sterft, en geen zoon heeft, dan zult u zijn erfenis op zijn dochter laten overgaan. En als hij geen dochter heeft, dan zult u zijn erfenis aan zijn broers geven. Als hij nu geen broers heeft, dan zult u zijn erfenis aan de broers van zijn vader geven.", "Richt 8:32": "En Gideon, de zoon van Joas, stierf op hoge leeftijd; en hij werd begraven in het graf van zijn vader Joas, in Ofra van de Abiëzrieten.", "Num 31:2": "Neem wraak voor de kinderen van Israël op de Midianieten; daarna zult u verzameld worden tot uw volken.", "Deut 5:16": "Eer uw vader en uw moeder, zoals de HEERE, uw God, u geboden heeft, opdat uw dagen verlengd worden, en opdat het u goed gaat in het land dat de HEERE, uw God, u geven zal.", "Matt 5:38": "U hebt gehoord dat gezegd is: Oog om oog, en tand om tand.", "Hand 13:36": "Want David is, nadat hij in zijn tijd de raad van God gediend had, ontslapen, en is bij zijn vaderen gelegd, en heeft wel verderving gezien;", "Gen 37:36": "En de Midianieten verkochten hem in Egypte, aan Potifar, een hoveling van de farao, leider van de lijfwacht.", "Gen 16:15": "En Hagar baarde Abram een zoon; en Abram noemde de naam van zijn zoon, die Hagar gebaard had, Ismaël.", "Jes 63:1-4": "Wie is Deze, Die van Edom komt met bespatte kleren, van Bozra? Deze, Die praalt in Zijn gewaad? Die voorttrekt in Zijn grote kracht? Ik ben het, Die in gerechtigheid spreek, Die machtig ben om te verlossen. Waarom bent U rood aan Uw gewaad, en Uw kleren als van iemand die in de wijnpers treedt? Ik heb de pers alleen getreden, en er was niemand van de volken met Mij; en Ik heb hen getreden in Mijn toorn, en heb hen vertrapt in Mijn grimmigheid; en hun bloed is gesprenkeld op Mijn kleren, en heel Mijn gewaad heb Ik bezoedeld.", "Hand 1:20": "Want er staat geschreven in het boek van de Psalmen: Zijn woonstede moet woest worden, en er mag niemand zijn die erin woont. En: Een ander moet zijn opzienersambt overnemen.", "Lev 11:44": "Want Ik ben de HEERE, uw God; daarom zult u uzelf heiligen, en heilig zijn, omdat Ik heilig ben; en u zult uw ziel niet verontreinigen aan enig kruipend gedierte dat zich op de aarde beweegt.", "Spr 3:11": "Mijn zoon! Verwerp de tucht van de HEERE niet, en word niet verdrietig over Zijn kastijding;", "Hand 7:31": "Toen Mozes dat zag, verwonderde hij zich over het gezicht; en toen hij erheen ging om het van dichtbij te bekijken, kwam er een stem van de Heere tot hem,", "Ex 2:15": "Toen Farao deze zaak hoorde, zocht hij Mozes te doden; maar Mozes vluchtte voor Farao, en woonde in het land Midian, en hij ging bij een waterput zitten.", "Num 25:17": "Handel vijandig met de Midianieten, en versla hen;", "Rom 11:8": "(Zoals geschreven is: God heeft hun een geest van diepe slaap gegeven; ogen om niet te zien, en oren om niet te horen) tot op deze huidige dag.", "Jes 11:14": "Maar zij zullen op de schouder van de Filistijnen vliegen naar het westen, en zij zullen samen die van het oosten beroven; aan Edom en Moab zullen zij hun handen slaan, en de kinderen van Ammon zullen hun gehoorzaam zijn.", "Ps 68:19": "U bent opgevaren in de hoogte; U hebt de gevangenis gevankelijk weggevoerd; U hebt gaven genomen om uit te delen onder de mensen; ja, ook de opstandigen, om bij U te wonen, o HEERE God!", "Jes 61:1": "De Geest van de Heere HEERE is op Mij, omdat de HEERE Mij gezalfd heeft, om een blijde boodschap te brengen aan de zachtmoedigen; Hij heeft Mij gezonden om te verbinden de gebrokenen van hart, om de gevangenen vrijheid uit te roepen, en de gebondenen opening van de gevangenis;", "Jes 27:9": "Daarom zal daardoor de ongerechtigheid van Jakob verzoend worden, en dit is de hele vrucht, dat Hij zijn zonde zal wegdoen: wanneer Hij alle stenen van het altaar maakt als verstrooide kalkstenen, zullen de bossen en de zonnebeelden niet blijven bestaan.", "Jer 6:11": "Daarom ben ik vol van de grimmigheid van de HEERE, ik ben moe geworden van inhouden; ik zal het uitstorten over de kinderen op de straat, en over de vergadering van de jongelingen samen; want zelfs de man met de vrouw zullen gevangen worden, de oude met hem, die vol is van dagen.", "Rom 13:9": "Want dit: u zult geen overspel doen, u zult niet doden, u zult niet stelen, u zult geen valse getuigenis geven, u zult niet begeren; en als er nog enig ander gebod is, wordt het in dit woord samengevat, namelijk in dit: u zult uw naaste liefhebben als uzelf.", "Matt 21:5": "Zeg tegen de dochter van Sion: Zie, uw Koning komt naar u toe, zachtmoedig en gezeten op een ezelin, en een veulen, het jong van een lastdier.", "1 Kor 3:20": "En opnieuw: De Heere kent de overleggingen van de wijzen, dat zij nutteloos zijn.", "Hand 7:8": "En Hij gaf hem het verbond van de besnijdenis; en zo verwekte Abraham Izak, en besneed hem op de achtste dag; en Izak verwekte Jakob, en Jakob de twaalf aartsvaders.", "Jes 40:31": "Maar wie de HEERE verwachten, zullen de kracht vernieuwen; zij zullen opvaren met vleugels, gelijk de arenden; zij zullen lopen, en niet moede worden; zij zullen wandelen, en niet mat worden.", "Gen 31:3": "En de HEERE zei tegen Jakob: Keer terug naar het land van uw vaderen, en naar uw familie, en Ik zal met u zijn.", "Ps 104:4": "Hij maakt Zijn engelen geesten, Zijn dienaars tot een vlammend vuur.", "Gen 23:17-20": "Zo werd de akker van Efron, die in Machpela was, tegenover Mamre lag, de akker en de spelonk die daarin was, en al het geboomte dat op de akker stond, dat rondom in zijn hele gebied lag, aan Abraham toegewezen, Tot een bezitting, voor de ogen van de zonen van Heth, bij allen die de poort van zijn stad binnengingen. En daarna begroef Abraham zijn vrouw Sara in de spelonk van de akker van Machpela, tegenover Mamre, dat is Hebron, in het land Kanaän.", "Mark 6:23": "En hij zwoer haar: Wat u mij ook zult vragen, ik zal het u geven, zelfs tot de helft van mijn koninkrijk!", "Gen 2:11": "De naam van de eerste rivier is Pison; dat is het, dat het hele land van Havila omstroomt, waar het goud is.", "Hand 23:10": "En toen er grote tweedracht ontstond, gaf de aanvoerder, uit vrees dat Paulus door hen verscheurd zou worden, bevel dat het krijgsvolk zou afdalen en hem uit hun midden zou wegrukken en naar de legerplaats brengen.", "Gal 4:2": "maar hij staat onder voogden en verzorgers, tot de tijd die de vader van tevoren heeft vastgesteld.", "Ps 91:11": "Want Hij zal Zijn engelen aangaande u bevelen, dat zij u bewaren op al uw wegen.", "Gen 26:25": "Toen bouwde hij daar een altaar, en riep de Naam van de HEERE aan. En hij sloeg daar zijn tent op; en Izaks knechten groeven daar een put.", "Deut 25:5": "Wanneer broeders samenwonen, en één van hen sterft zonder zoon, dan mag de vrouw van de gestorvene niet trouwen met een vreemde man van buiten; haar zwager zal tot haar ingaan, en haar tot vrouw nemen, en zo de plicht van een zwager aan haar vervullen.", "Gen 15:14": "Maar Ik zal ook het volk rechten dat zij zullen dienen; en daarna zullen zij uittrekken met veel bezit.", "Gen 17:23": "Toen nam Abraham zijn zoon Ismaël, en alle mannen die in zijn huis geboren waren, en alle die met zijn geld gekocht waren, alles wat mannelijk was onder de mensen van het huis van Abraham, en hij besneed het vlees van hun voorhuid, op diezelfde dag, zoals God met hem gesproken had.", "Gen 36:1": "Dit zijn de geboorten van Ezau, dat is Edom.", "Rom 10:20": "En Jesaja durft het aan, en zegt: Ik ben gevonden door hen die Mij niet zochten; Ik ben openbaar geworden aan hen die naar Mij niet vroegen.", "Ps 31:6": "In Uw hand beveel ik mijn geest; U hebt mij verlost, HEERE, U, God van de waarheid!", "Deut 1:8": "Zie, Ik heb dat land aan u gegeven; ga erin, en bezit erfelijk het land, dat de HEERE aan uw vaderen, Abraham, Izak en Jakob, gezworen heeft dat Hij het hun en hun nageslacht na hen geven zou.", "1 Kron 1:32": "De kinderen nu van Ketura, Abrahams bijvrouw: zij baarde Zimram, en Joksan, en Medan, en Midian, en Isbak, en Suah. En de kinderen van Joksan waren Scheba en Dedan.", "Hebr 4:4": "Want Hij heeft ergens over de zevende dag zo gesproken: En God heeft op de zevende dag van al Zijn werken gerust.", "Ps 17:15": "Maar ik zal Uw aangezicht in gerechtigheid aanschouwen, ik zal verzadigd worden met Uw beeld, als ik zal ontwaken.", "Ps 105:11": "En zei: Ik zal u geven het land Kanaän, het snoer van uw erfdeel.", "Gen 23:2": "Sara stierf te Kiriath-arba, dat is Hebron, in het land Kanaän; en Abraham kwam om Sara te beklagen en haar te bewenen.", "Jes 29:13": "Want de Heere heeft gezegd: Omdat dit volk tot Mij nadert met zijn mond, en zij Mij met hun lippen eren, maar hun hart ver van Mij houden; en hun vrees, waarmee zij Mij vrezen, mensengeboden zijn, die hun geleerd zijn;", "1 Petr 5:5": "Evenzo, u jongeren, wees de ouderen onderdanig; en wees allen elkaar onderdanig; bekleed u met nederigheid; want God weerstaat de hoogmoedigen, maar aan de nederigen geeft Hij genade.", "Matt 21:16": "en zeiden tegen Hem: Hoort U wel wat dezen zeggen? En Jezus zei tegen hen: Ja; hebt u nooit gelezen: Uit de mond van de jonge kinderen en de zuigelingen hebt U Zichzel /span> which he <span class=\"wl wl-kjv\" data-code=\"H2425\">lived,</span> an <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> threescore and <span class=\"wl wl-kjv\" data-code=\"H7657\">fifteen</span> years.", "8": "Then <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham</span> gave up the <span class=\"wl wl-kjv\" data-code=\"H1478\">ghost,</span> and <span class=\"wl wl-kjv\" data-code=\"H4191\">died</span> in a <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> old <span class=\"wl wl-kjv\" data-code=\"H7872\">age,</span> an old <span class=\"wl wl-kjv\" data-code=\"H2205\">man,</span> and <span class=\"wl wl-kjv\" data-code=\"H7649\">full</span> of years; and was <span class=\"wl wl-kjv\" data-code=\"H622\">gathered</span> to his people.", "9": "And his <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> <span class=\"wl wl-kjv\" data-code=\"H3327\">Isaac</span> and <span class=\"wl wl-kjv\" data-code=\"H3458\">Ishmael</span> <span class=\"wl wl-kjv\" data-code=\"H6912\">buried</span> him in the <span class=\"wl wl-kjv\" data-code=\"H4631\">cave</span> of <span class=\"wl wl-kjv\" data-code=\"H4375\">Machpelah,</span> in the <span class=\"wl wl-kjv\" data-code=\"H7704\">field</span> of <span class=\"wl wl-kjv\" data-code=\"H6085\">Ephron</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H6714\">Zohar</span> the <span class=\"wl wl-kjv\" data-code=\"H2850\">Hittite,</span> which is <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> Mamre;", "10": "The <span class=\"wl wl-kjv\" data-code=\"H7704\">field</span> which <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham</span> <span class=\"wl wl-kjv\" data-code=\"H7069\">purchased</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H2845\">Heth:</span> there was <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham</span> <span class=\"wl wl-kjv\" data-code=\"H69 /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [

].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    const heeftB = D.koppeling && D.koppeling[n];
    const heeftK = D.koppeling_kjv && D.koppeling_kjv[n];
    let h = '<div class="verg-kop">Grondwoorden</div>';
    if (!heeftB && !heeftK) {
      h += '<em>Nog geen woordkoppeling voor dit vers.</em>';
    } else {
      if (heeftB) h += `<div class="tsk-kop">SVnu</div>` +
        `<div class="gw-tekst" style="font-family:Georgia,serif;line-height:1.8">${D.koppeling[n]}</div>` +
        `<div class="gw-detail" style="margin-top:.5rem"></div>`;
      if (heeftK) h += `<div class="tsk-kop" style="margin-top:.9rem">KJV</div>` +
        `<div class="gw-tekst" style="font-family:Georgia,serif;line-height:1.8">${D.koppeling_kjv[n]}</div>` +
        `<div class="gw-detail" style="margin-top:.5rem"></div>`;
      h += '<div class="bronregel">Klik op een onderstreept woord voor de vindplaatsen.</div>';
    }
    h += '<div class="verg-kop" style="margin-top:1.4rem">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const berea = D.tsk[n], engels = D.tsk_kjv[n];
    if ((!berea || !berea.length) && (!engels || !engels.length)) return '<em>Geen verwijzingen bij dit vers.</em>';
    let h = '';
    if (berea && berea.length) {
      h += '<div class="tsk-kop">Treasury of Scripture Knowledge | SVnu</div>';
      h += berea.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r}">${r}</a>`).join('') + '</div>').join('');
    }
    if (engels && engels.length) {
      h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.tsk[n] && D.tsk[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vergelijk</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een vers: snel wisselen van vertaling ---------- */
(function () {
  const menu = document.createElement('div');
  menu.id = 'vertmenu';
  menu.style.cssText = 'position:absolute;display:none;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.3rem;font-family:sans-serif;font-size:.85rem;z-index:30;min-width:7rem;';
  document.body.appendChild(menu);
  function toon(x, y) {
    menu.innerHTML = Object.keys(D.vertalingen).map(naam =>
      `<div class="vm-optie" data-v="${naam}" style="padding:.35rem .6rem;border-radius:5px;cursor:pointer;${naam === vertaling ? 'font-weight:700;color:var(--accent-donker)' : ''}">${naam}</div>`
    ).join('');
    const breedte = document.documentElement.clientWidth;
    menu.style.left = Math.max(4, Math.min(x, breedte - 130)) + 'px';
    menu.style.top = y + 'px';
    menu.style.display = 'block';
  }
  document.addEventListener('contextmenu', e => {
    const rij = e.target.closest('.vers');
    if (!rij) return;
    e.preventDefault();
    toon(e.pageX, e.pageY);
  });
  menu.addEventListener('mouseover', e => {
    const o = e.target.closest('.vm-optie');
    if (o) o.style.background = 'var(--bg-soft)';
  });
  menu.addEventListener('mouseout', e => {
    const o = e.target.closest('.vm-optie');
    if (o) o.style.background = '';
  });
  menu.addEventListener('click', e => {
    const o = e.target.closest('.vm-optie');
    if (!o) return;
    vertaling = o.dataset.v;
    const kies = document.getElementById('vertaalkies');
    if (kies) kies.value = vertaling;
    bouwRijen();
    menu.style.display = 'none';
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#vertmenu')) menu.style.display = 'none';
  });
  document.addEventListener('scroll', () => { menu.style.display = 'none'; }, true);
})();
</script>
</body>
