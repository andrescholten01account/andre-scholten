 zoals Hij gezegd had; en de HEERE deed aan Sara, zoals Hij gesproken had.","2":"En Sara werd zwanger, en baarde Abraham een zoon in zijn ouderdom, op de vastgestelde tijd die God hem gezegd had.","3":"En Abraham noemde de naam van zijn zoon die hem geboren was, die Sara hem gebaard had, Izak.","4":"En Abraham besneed zijn zoon Izak, toen hij acht dagen oud was, zoals God hem geboden had.","5":"En Abraham was honderd jaar oud, toen zijn zoon Izak hem geboren werd.","6":"En Sara zei: God heeft mij te lachen gemaakt; ieder die het hoort, zal met mij lachen.","7":"Verder zei ze: Wie zou tegen Abraham gezegd hebben dat Sara zonen zou zogen? Want ik heb een zoon gebaard in zijn ouderdom.","8":"En het kind werd groot en werd gespeend; toen maakte Abraham een grote maaltijd op de dag dat Izak gespeend werd.","9":"En Sara zag de zoon van Hagar, de Egyptische, die zij Abraham gebaard had, spotten.","10":"En zij zei tegen Abraham: Jaag deze slavin en haar zoon weg; want de zoon van deze slavin zal niet erven met mijn zoon, met Izak.","11":"En dit woord was zeer kwaad in Abrahams ogen, vanwege zijn zoon.","12":"Maar God zei tegen Abraham: Laat het niet kwaad zijn in uw ogen vanwege de jongen en vanwege uw slavin; alles wat Sara tegen u zegt, luister naar haar stem; want in Izak zal uw nageslacht genoemd worden.","13":"Maar Ik zal ook de zoon van deze slavin tot een volk maken, omdat hij uw nageslacht *is*.","14":"Toen stond Abraham 's morgens vroeg op, en nam brood en een fles water, en gaf ze aan Hagar, die hij op haar schouder legde; ook *gaf* *hij* *haar* het kind, en stuurde haar weg. En zij ging op weg, en dwaalde rond in de woestijn Berseba.","15":"Toen het water uit de fles op was, gooide zij het kind onder een van de struiken.","16":"En zij ging weg en ging tegenover hem zitten, op een afstand zo ver als een boogschot; want zij zei: Laat ik het kind niet zien sterven; en zij zat tegenover hem, en hief haar stem op, en huilde.","17":"En God hoorde de stem van de jongen; en de Engel van God riep Hagar toe uit de hemel, en zei tegen haar: Wat is er met u, Hagar? Wees niet bang; want God heeft naar de stem van de jongen geluisterd, op de plaats waar hij is.","18":"Sta op, til de jongen op, en houd hem vast met uw hand; want Ik zal hem tot een groot volk maken.","19":"En God opende haar ogen, zodat zij een waterput zag; en zij ging erheen, en vulde de fles met water, en gaf de jongen te drinken.","20":"En God was met de jongen; en hij werd groot, en hij woonde in de woestijn, en werd een boogschutter.","21":"En hij woonde in de woestijn Paran; en zijn moeder nam voor hem een vrouw uit Egypteland.","22":"Vervolgens gebeurde het in diezelfde tijd, dat Abimelech, alsook Pichol, zijn legeraanvoerder, tegen Abraham sprak en zei: God is met u in alles wat u doet.","23":"Zweer mij dan nu hier bij God: als u mij, of mijn zoon, of mijn kleinzoon bedriegen zult! Naar de goedheid die ik bij u gedaan heb, zult u doen bij mij, en bij het land waarin u als vreemdeling verblijft.","24":"En Abraham zei: Ik zal zweren.","25":"En Abraham berispte Abimelech vanwege een waterput, die Abimelechs knechten met geweld hadden afgenomen.","26":"Toen zei Abimelech: Ik heb niet geweten wie dit gedaan heeft; en u hebt het mij ook niet verteld, en ik heb er ook niet van gehoord, dan vandaag.","27":"En Abraham nam schapen en runderen, en gaf die aan Abimelech; en zij beiden sloten een verbond.","28":"Doch Abraham zette zeven ooilammeren van de kudde apart.","29":"Toen zei Abimelech tegen Abraham: Wat betekenen hier deze zeven ooilammeren, die u apart gezet hebt?","30":"En hij zei: Deze zeven ooilammeren moet u van mijn hand aannemen, zodat het mij tot een getuigenis is, dat ik deze put gegraven heb.","31":"Daarom noemde men die plaats Berseba, omdat zij daar allebei gezworen hadden.","32":"Zo sloten zij een verbond te Berseba. Daarna stond Abimelech op, en Pichol, zijn legeraanvoerder, en zij keerden terug naar het land van de Filistijnen.","33":"En hij plantte een bos in Berseba, en riep daar de Naam van de HEERE, de eeuwige God, aan.","34":"En Abraham woonde als vreemdeling vele dagen in het land van de Filistijnen."},"SV":{"1":"En de HEERE bezocht Sara, gelijk als Hij gezegd had; en de HEERE deed aan Sara, gelijk als Hij gesproken had.","2":"En Sara werd bevrucht, en baarde Abraham een zoon in zijn ouderdom, ter gezetter tijd, dien hem God gezegd had.","3":"En Abraham noemde den naam zijns zoons, die hem geboren was, dien hem Sara gebaard had, Izak.","4":"En Abraham besneed zijn zoon Izak, zijnde acht dagen oud, gelijk als hem God geboden had.","5":"En Abraham was honderd jaren oud, als hem Izak zijn zoon geboren werd.","6":"En Sara zeide: God heeft mij een lachen gemaakt; al die het hoort, zal met mij lachen.","7":"Voorts zeide zij: Wie zou Abraham gezegd hebben: Sara heeft zonen gezoogd? want ik heb een zoon gebaard in zijn ouderdom.","8":"En het kind werd groot, en werd gespeend; toen maakte Abraham een groten maaltijd op den dag, als Izak gespeend werd.","9":"En Sara zag den zoon van Hagar, de Egyptische, dien zij Abraham gebaard had, spottende.","10":"En zij zeide tot Abraham: Drijf deze dienstmaagd en haar zoon uit; want de zoon dezer dienstmaagd zal met mijn zoon, met Izak, niet erven.","11":"En dit woord was zeer kwaad in Abrahams ogen, ter oorzake van zijn zoon.","12":"Maar God zeide tot Abraham: Laat het niet kwaad zijn in uw ogen, over den jongen, en over uw dienstmaagd; al wat Sara tot u zal zeggen, hoor naar haar stem; want in Izak zal uw zaad genoemd worden.","13":"Doch Ik zal ook den zoon dezer dienstmaagd tot een volk stellen, omdat hij uw zaad *is*.","14":"Toen stond Abraham des morgens vroeg op, en nam brood, en een fles water, en gaf ze aan Hagar, die leggende op haar schouder; ook *gaf* *hij* *haar* het kind, en zond haar weg. En zij ging voort, en dwaalde in de woestijn Ber-seba.","15":"Als nu het water van de fles uit was, zo wierp zij het kind onder een van de struiken.","16":"En zij ging en zette zich tegenover, afgaande zo verre, als die met den boog schieten; want zij zeide: Dat ik het kind niet zie sterven; en zij zat tegenover, en hief haar stem op, en weende.","17":"En God hoorde de stem van den jongen; en de Engel Gods riep Hagar toe uit den hemel, en zeide tot haar: Wat *is* u, Hagar? Vrees niet; want God heeft naar des jongens stem gehoord, ter plaatse, waar hij *is*.","18":"Sta op, hef den jongen op, en houd hem vast met uwe hand; want Ik zal hem tot een groot volk stellen.","19":"En God opende haar ogen, dat zij een waterput zag; en zij ging, en vulde de fles met water, en gaf den jongen te drinken.","20":"En God was met den jongen; en hij werd groot, en hij woonde in de woestijn, en werd een boogschutter.","21":"En hij woonde in de woestijn Paran; en zijn moeder nam hem een vrouw uit Egypteland.","22":"Voorts geschiedde het ter zelfder tijd, dat Abimelech, mitsgaders Pichol, zijn krijgsoverste, tot Abraham sprak, zeggende: God *is* met u in alles, wat gij doet.","23":"Zo zweer mij nu hier bij God: Zo gij mij, of mijn zoon, of mijn neef liegen zult! naar de weldadigheid, die ik bij u gedaan heb, zult gij doen bij mij, en bij het land, waarin gij als vreemdeling verkeert.","24":"En Abraham zeide: Ik zal zweren.","25":"En Abraham berispte Abimelech ter oorzake van een waterput, die Abimelechs knechten met geweld genomen hadden.","26":"Toen zeide Abimelech: Ik heb niet geweten, wie dit stuk gedaan heeft; en ook hebt gij het mij niet aangezegd, en ik heb er ook niet van gehoord, dan heden.","27":"En Abraham nam schapen en runderen, en gaf die aan Abimelech; en die beiden maakten een verbond.","28":"Doch Abraham stelde zeven ooilammeren der kudde bijzonder.","29":"Zo zeide Abimelech tot Abraham: Wat zullen hier deze zeven ooilammeren, die gij bijzonder gesteld hebt?","30":"En hij zeide: Dat gij de zeven ooilammeren van mijn hand nemen zult, opdat het mij tot een getuigenis zij, dat ik dezen put gegraven heb.","31":"Daarom noemde men die plaats Ber-seba, omdat die beiden daar gezworen hadden.","32":"Alzo maakten zij een verbond te Ber-seba. Daarna stond Abimelech op, en Pichol, zijn krijgsoverste, en zij keerden wederom naar het land der Filistijnen.","33":"En hij plantte een bos in Ber-seba, en riep aldaar den Naam des HEEREN, des eeuwigen Gods, aan.","34":"En Abraham woonde als vreemdeling vele dagen in het land der Filistijnen."},"KJV":{"1":"And the LORD visited Sarah as he had said, and the LORD did unto Sarah as he had spoken.","2":"For Sarah conceived, and bare Abraham a son in his old age, at the set time of which God had spoken","3":"And Abraham called the name of his son that was born unto him, whom Sarah bare to him, Isaac.","4":"And Abraham circumcised his son Isaac being eight days old, as God had commanded","5":"And Abraham was an hundred years old, when his son Isaac was born","6":"And Sarah said, God hath made me to laugh, *so that* all that hear will laugh","7":"And she said, Who would have said unto Abraham, that Sarah should have given children suck? for I have born *him* a son in his old age.","8":"And the child grew, and was weaned: and Abraham made a great feast the *same* day that Isaac was weaned.","9":"And Sarah saw the son of Hagar the Egyptian, which she had born unto Abraham, mocking.","10":"Wherefore she said unto Abraham, Cast out this bondwoman and her son: for the son of this bondwoman shall not be heir with my son, *even* with Isaac.","11":"And the thing was very grievous in Abraham's sight because of his son.","12":"And God said unto Abraham, Let it not be grievous in thy sight because of the lad, and because of thy bondwoman; in all that Sarah hath said unto thee, hearken unto her voice; for in Isaac shall thy seed be called.","13":"And also of the son of the bondwoman will I make a nation, because he *is* thy seed.","14":"And Abraham rose up early in the morning, and took bread, and a bottle of water, and gave *it* unto Hagar, putting *it* on her shoulder, and the child, and sent her away: and she departed, and wandered in the wilderness of Beersheba.","15":"And the water was spent in the bottle, and she cast the child under one of the shrubs.","16":"And she went, and sat her down over against *him* a good way off, as it were a bowshot: for she said, Let me not see the death of the child. And she sat over against *him*, and lift up her voice, and wept.","17":"And God heard the voice of the lad; and the angel of God called to Hagar out of heaven, and said unto her, What aileth thee, Hagar? fear not; for God hath heard the voice of the lad","18":"Arise, lift up the lad, and hold him in thine hand; for I will make him a great nation.","19":"And God opened her eyes, and she saw a well of water; and she went, and filled the bottle with water, and gave the lad drink.","20":"And God was with the lad; and he grew, and dwelt in the wilderness, and became an archer.","21":"And he dwelt in the wilderness of Paran: and his mother took him a wife out of the land of Egypt.","22":"And it came to pass at that time, that Abimelech and Phichol the chief captain of his host spake unto Abraham, saying, God *is* with thee in all that thou doest:","23":"Now therefore swear unto me here by God that thou wilt not deal falsely with me, nor with my son, nor with my son's son: *but* according to the kindness that I have done unto thee, thou shalt do unto me, and to the land wherein thou hast sojourned.","24":"And Abraham said, I will swear.","25":"And Abraham reproved Abimelech because of a well of water, which Abimelech's servants had violently taken away.","26":"And Abimelech said, I wot not who hath done this thing: neither didst thou tell me, neither yet heard I *of it*, but to day.","27":"And Abraham took sheep and oxen, and gave them unto Abimelech; and both of them made a covenant.","28":"And Abraham set seven ewe lambs of the flock","29":"And Abimelech said unto Abraham, What *mean* these seven ewe lambs which thou hast set","30":"And he said, For *these* seven ewe lambs shalt thou take of my hand, that they may be a witness unto me, that I have digged this well.","31":"Wherefore he called that place Beersheba; because there they sware both of them.","32":"Thus they made a covenant at Beersheba: then Abimelech rose up, and Phichol the chief captain of his host, and they returned into the land of the Philistines.","33":"And *Abraham* planted a grove in Beersheba, and called there on the name of the LORD, the everlasting God.","34":"And Abraham sojourned in the Philistines' land many days."}},"tsk":{"1":[{"kopje":"bezocht","refs":["Gen 50:24","Ex 3:16","Ex 4:31","Ex 20:5","Ruth 1:6","1 Sam 2:21","Ps 106:4","Luk 1:68","Luk 19:44","Rom 4:17-20"]},{"kopje":"Sara, zoals","refs":["Gen 17:19","Gen 18:10","Gen 18:14","Ps 12:7","Matt 24:35","Gal 4:23","Gal 4:28","Tit 1:2"]}],"2":[{"kopje":"werd zwanger","refs":["2 Kon 4:16","2 Kon 4:17","Luk 1:24","Luk 1:25","Luk 1:36","Hand 7:8","Gal 4:22","Hebr 11:11"]},{"kopje":"op de vastgestelde","refs":["Gen 17:19","Gen 17:21","Gen 18:10","Gen 18:14","Rom 9:9"]}],"6":[{"kopje":"God","refs":["Gen 17:17","Gen 18:12-15","1 Sam 1:26-28","1 Sam 2:1-10","Ps 113:9","Ps 126:2","Jes 49:15","Jes 49:21","Jes 54:1","Luk 1:46-55","Joh 16:21","Joh 16:22","Gal 4:27","Gal 4:28","Hebr 11:11"]},{"kopje":"te lachen","refs":["Gen 18:12"]},{"kopje":"zal lachen","refs":["Luk 1:14","Luk 1:58","Rom 12:15"]}],"7":[{"kopje":"Wie","refs":["Num 23:23","Deut 4:32-34","Ps 86:8","Ps 86:10","Jes 49:21","Jes 66:8","Ef 3:10","2 Tess 1:10"]},{"kopje":"want ik","refs":["Gen 18:11","Gen 18:12"]}],"8":[{"kopje":"en werd","refs":["1 Sam 1:22","Ps 131:2","Hos 1:8"]},{"kopje":"maaltijd","refs":["Gen 19:3","Gen 26:30","Gen 29:22","Gen 40:20","Richt 14:10","Richt 14:12","1 Sam 25:36","2 Sam 3:20","1 Kon 3:15","Est 1:3"]}],"9":[{"kopje":"Sara","refs":["Gen 16:3-6","Gen 16:15","Gen 17:20"]},{"kopje":"Egyptische","refs":["Gen 16:1","Gen 16:15"]},{"kopje":"spotten","refs":["2 Kon 2:23","2 Kon 2:24","2 Kron 30:10","2 Kron 36:16","Neh 4:1-5" pan class=\"wl wl-kjv\" data-code=\"H8141\">years</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">old,</span> when his <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> <span class=\"wl wl-kjv\" data-code=\"H3327\">Isaac</span> was born","6":"And <span class=\"wl wl-kjv\" data-code=\"H8283\">Sarah</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> hath <span class=\"wl wl-kjv\" data-code=\"H6213\">made</span> me to <span class=\"wl wl-kjv\" data-code=\"H6712\">laugh,</span> so that all that <span class=\"wl wl-kjv\" data-code=\"H8085\">hear</span> will laugh","7":"And she <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Who would have <span class=\"wl wl-kjv\" data-code=\"H4448\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham,</span> that <span class=\"wl wl-kjv\" data-code=\"H8283\">Sarah</span> should have given <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> <span class=\"wl wl-kjv\" data-code=\"H3243\">suck?</span> for I have <span class=\"wl wl-kjv\" data-code=\"H3205\">born</span> him a <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> in his old age.","8":"And the <span class=\"wl wl-kjv\" data-code=\"H3206\">child</span> <span class=\"wl wl-kjv\" data-code=\"H1431\">grew,</span> and was <span class=\"wl wl-kjv\" data-code=\"H1580\">weaned:</span> and <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">made</span> a <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H4960\">feast</span> the same <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> that <span class=\"wl wl-kjv\" data-code=\"H3327\">Isaac</span> was weaned.","9":"And <span class=\"wl wl-kjv\" data-code=\"H8283\">Sarah</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H1904\">Hagar</span> the <span class=\"wl wl-kjv\" data-code=\"H4713\">Egyptian,</span> which she had <span class=\"wl wl-kjv\" data-code=\"H3205\">born</span> unto <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham,</span> mocking.","10":"Wherefore she <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham,</span> Cast <span class=\"wl wl-kjv\" data-code=\"H1644\">out</span> this <span class=\"wl wl-kjv\" data-code=\"H519\">bondwoman</span> and her <span class=\"wl wl-kjv\" data-code=\"H1121\">son:</span> for the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of this <span class=\"wl wl-kjv\" data-code=\"H519\">bondwoman</span> shall not be <span class=\"wl wl-kjv\" data-code=\"H3423\">heir</span> with my <span class=\"wl wl-kjv\" data-code=\"H1121\">son,</span> even with Isaac.","11":"And the <span class=\"wl wl-kjv\" data-code=\"H1697\">thing</span> was <span class=\"wl wl-kjv\" data-code=\"H3966\">very</span> <span class=\"wl wl-kjv\" data-code=\"H3415\">grievous</span> in <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham's</span> <span class=\"wl wl-kjv\" data-code=\"H5869\">sight</span> <span class=\"wl wl-kjv\" data-code=\"H182\">because</span> of his son.","12":"And <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham,</span> Let it not be <span class=\"wl wl-kjv\" data-code=\"H3415\">grievous</span> in thy <span class=\"wl wl-kjv\" data-code=\"H5869\">sight</span> because of the <span class=\"wl wl-kjv\" data-code=\"H5288\">lad,</span> and because of thy <span class=\"wl wl-kjv\" data-code=\"H519\">bondwoman;</span> in all that <span class=\"wl wl-kjv\" data-code=\"H8283\">Sarah</span> hath <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto thee, <span class=\"wl wl-kjv\" data-code=\"H8085\">hearken</span> unto her <span class=\"wl wl-kjv\" data-code=\"H6963\">voice;</span> for in <span class=\"wl wl-kjv\" data-code=\"H3327\">Isaac</span> shall thy <span class=\"wl wl-kjv\" data-code=\"H2233\">seed</span> be called.","13":"And also of the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of the <span class=\"wl wl-kjv\" data-code=\"H519\">bondwoman</span> will I <span class=\"wl wl-kjv\" data-code=\"H7760\">make</span> a <span class=\"wl wl-kjv\" data-code=\"H1471\">nation,</span> because he is thy seed.","14":"And <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham</span> rose up <span class=\"wl wl-kjv\" data-code=\"H7925\">early</span> in the <span class=\"wl wl-kjv\" data-code=\"H1242\">morning,</span> and <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> <span class=\"wl wl-kjv\" data-code=\"H3899\">bread,</span> and a <span class=\"wl wl-kjv\" data-code=\"H2573\">bottle</span> of <span class=\"wl wl-kjv\" data-code=\"H4325\">water,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> it unto <span class=\"wl wl-kjv\" data-code=\"H1904\">Hagar,</span> <span class=\"wl wl-kjv\" data-code=\"H7760\">putting</span> it on her <span class=\"wl wl-kjv\" data-code=\"H7926\">shoulder,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3206\">child,</span> and sent her <span class=\"wl wl-kjv\" data-code=\"H7971\">away:</span> and she <span class=\"wl wl-kjv\" data-code=\"H3212\">departed,</span> and <span class=\"wl wl-kjv\" data-code=\"H8582\">wandered</span> in the <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness</span> of Beersheba.","15":"And the <span class=\"wl wl-kjv\" data-code=\"H4325\">water</span> was <span class=\"wl wl-kjv\" data-code=\"H3615\">spent</span> <span class=\"wl wl-kjv\" data-code=\"H4480\">in</span> the <span class=\"wl wl-kjv\" data-code=\"H2573\">bottle,</span> and she <span class=\"wl wl-kjv\" data-code=\"H7993\">cast</span> the <span class=\"wl wl-kjv\" data-code=\"H3206\">child</span> under <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> of the shrubs.","16":"And she <span class=\"wl wl-kjv\" data-code=\"H3212\">went,</span> and sat her <span class=\"wl wl-kjv\" data-code=\"H3427\">down</span> over <span class=\"wl wl-kjv\" data-code=\"H5048\">against</span> him a good way <span class=\"wl wl-kjv\" data-code=\"H7368\">off,</span> as it were a <span class=\"wl wl-kjv\" data-code=\"H2909\">bowshot:</span> for she <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Let me not <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> the <span class=\"wl wl-kjv\" data-code=\"H4194\">death</span> of the <span class=\"wl wl-kjv\" data-code=\"H3206\">child.</span> And she <span class=\"wl wl-kjv\" data-code=\"H3427\">sat</span> over against him, and lift <span class=\"wl wl-kjv\" data-code=\"H5375\">up</span> her <span class=\"wl wl-kjv\" data-code=\"H6963\">voice,</span> and wept.","17":"And <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> the <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> of the <span class=\"wl wl-kjv\" data-code=\"H5288\">lad;</span> and the <span class=\"wl wl-kjv\" data-code=\"H4397\">angel</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> to <span class=\"wl wl-kjv\" data-code=\"H1904\">Hagar</span> out of <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto her, What aileth thee, <span class=\"wl wl-kjv\" data-code=\"H1904\">Hagar?</span> <span class=\"wl wl-kjv\" data-code=\"H3372\">fear</span> not; for <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> hath <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> the <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> of the lad","18":"<span class=\"wl wl-kjv\" data-code=\"H6965\">Arise,</span> lift <span class=\"wl wl-kjv\" data-code=\"H5375\">up</span> the <span class=\"wl wl-kjv\" data-code=\"H5288\">lad,</span> and <span class=\"wl wl-kjv\" data-code=\"H2388\">hold</span> him in thine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand;</span> for I will <span class=\"wl wl-kjv\" data-code=\"H7760\">make</span> him a <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> nation.","19":"And <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H6491\">opened</span> her <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes,</span> and she <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> a <span class=\"wl wl-kjv\" data-code=\"H875\">well</span> of <span class=\"wl wl-kjv\" data-code=\"H4325\">water;</span> and she <span class=\"wl wl-kjv\" data-code=\"H3212\">went,</span> and <span class=\"wl wl-kjv\" data-code=\"H4390\">filled</span> the <span class=\"wl wl-kjv\" data-code=\"H2573\">bottle</span> with <span class=\"wl wl-kjv\" data-code=\"H4325\">water,</span> and <span class=\"wl wl-kjv\" data-code=\"H8248\">gave</span> the <span class=\"wl wl-kjv\" data-code=\"H5288\">lad</span> drink.","20":"And <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> was with the <span class=\"wl wl-kjv\" data-code=\"H5288\">lad;</span> and he <span class=\"wl wl-kjv\" data-code=\"H1431\">grew,</span> and <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelt</span> in the <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness,</span> and became an <span class=\"wl wl-kjv\" data-code=\"H7235\">archer.</span>","21":"And he <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelt</span> in the <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness</span> of <span class=\"wl wl-kjv\" data-code=\"H6290\">Paran:</span> and his <span class=\"wl wl-kjv\" data-code=\"H517\">mother</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> him a <span class=\"wl wl-kjv\" data-code=\"H802\">wife</span> out of the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of Egypt.","22":"And it came to pass at that <span class=\"wl wl-kjv\" data-code=\"H6256\">time,</span> that <span class=\"wl wl-kjv\" data-code=\"H40\">Abimelech</span> and <span class=\"wl wl-kjv\" data-code=\"H6369\">Phichol</span> the chief <span class=\"wl wl-kjv\" data-code=\"H8269\">captain</span> of his <span class=\"wl wl-kjv\" data-code=\"H6635\">host</span> <span class=\"wl wl-kjv\" data-code=\"H559\">spake</span> unto <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> is with thee in all that thou doest:","23":"Now therefore <span class=\"wl wl-kjv\" data-code=\"H7650\">swear</span> unto me <span class=\"wl wl-kjv\" data-code=\"H2008\">here</span> by <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> that thou wilt not deal <span class=\"wl wl-kjv\" data-code=\"H8266\">falsely</span> with me, nor with my <span class=\"wl wl-kjv\" data-code=\"H5209\">son,</span> nor with my son's <span class=\"wl wl-kjv\" data-code=\"H5220\">son:</span> but according to the <span class=\"wl wl-kjv\" data-code=\"H2617\">kindness</span> that I have <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> unto thee, thou shalt <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> unto me, and to the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> wherein thou hast sojourned.","24":"And <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> I will swear.","25":"And <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham</span> <span class=\"wl wl-kjv\" data-code=\"H3198\">reproved</span> <span class=\"wl wl-kjv\" data-code=\"H40\">Abimelech</span> <span class=\"wl wl-kjv\" data-code=\"H182\">because</span> of a <span class=\"wl wl-kjv\" data-code=\"H875\">well</span> of <span class=\"wl wl-kjv\" data-code=\"H4325\">water,</span> which <span class=\"wl wl-kjv\" data-code=\"H40\">Abimelech's</span> <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> had violently taken away.","26":"And <span class=\"wl wl-kjv\" data-code=\"H40\">Abimelech</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> I <span class=\"wl wl-kjv\" data-code=\"H3045\">wot</span> not who hath <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> this <span class=\"wl wl-kjv\" data-code=\"H1697\">thing:</span> <span class=\"wl wl-kjv\" data-code=\"H3808\">neither</span> didst thou <span class=\"wl wl-kjv\" data-code=\"H5046\">tell</span> me, <span class=\"wl wl-kjv\" data-code=\"H3808\">neither</span> yet <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> I of it, <span class=\"wl wl-kjv\" data-code=\"H1115\">but</span> to day.","27":"And <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> <span class=\"wl wl-kjv\" data-code=\"H6629\">sheep</span> and <span class=\"wl wl-kjv\" data-code=\"H1241\">oxen,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> them unto <span class=\"wl wl-kjv\" data-code=\"H40\">Abimelech;</span> and both of <span class=\"wl wl-kjv\" data-code=\"H8147\">them</span> <span class=\"wl wl-kjv\" data-code=\"H3772\">made</span> a covenant.","28":"And <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham</span> <span class=\"wl wl-kjv\" data-code=\"H5324\">set</span> <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> ewe <span class=\"wl wl-kjv\" data-code=\"H3535\">lambs</span> of the flock","29":"And <span class=\"wl wl-kjv\" data-code=\"H40\">Abimelech</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham,</span> <span class=\"wl wl-kjv\" data-code=\"H2008\">What</span> mean these <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> ewe <span class=\"wl wl-kjv\" data-code=\"H3535\">lambs</span> which thou hast set","30":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> For these <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> ewe <span class=\"wl wl-kjv\" data-code=\"H3535\">lambs</span> shalt thou <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> of my <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> <span class=\"wl wl-kjv\" data-code=\"H5668\">that</span> they may be a <span class=\"wl wl-kjv\" data-code=\"H5713\">witness</span> unto me, that I have <span class=\"wl wl-kjv\" data-code=\"H2658\">digged</span> this well.","31":"Wherefore he <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> that <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> <span class=\"wl wl-kjv\" data-code=\"H884\">Beersheba;</span> because there they <span class=\"wl wl-kjv\" data-code=\"H7650\">sware</span> both of them.","32":"Thus they <span class=\"wl wl-kjv\" data-code=\"H3772\">made</span> a <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant</span> at <span class=\"wl wl-kjv\" data-code=\"H884\">Beersheba:</span> then <span class=\"wl wl-kjv\" data-code=\"H40\">Abimelech</span> rose <span class=\"wl wl-kjv\" data-code=\"H6965\">up,</span> and <span class=\"wl wl-kjv\" data-code=\"H6369\">Phichol</span> the chief <span class=\"wl wl-kjv\" data-code=\"H8269\">captain</span> of his <span class=\"wl wl-kjv\" data-code=\"H6635\">host,</span> and they <span class=\"wl wl-kjv\" data-code=\"H7725\">returned</span> into the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of the Philistines.","33":"And Abraham <span class=\"wl wl-kjv\" data-code=\"H5193\">planted</span> a <span class=\"wl wl-kjv\" data-code=\"H815\">grove</span> in <span class=\"wl wl-kjv\" data-code=\"H884\">Beersheba,</span> and <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> there on the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> the <span class=\"wl wl-kjv\" data-code=\"H5769\">everlasting</span> God.","34":"And <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham</span> <span class=\"wl wl-kjv\" data-code=\"H1481\">sojourned</span> in the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines'</span> <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> <span class=\"wl wl-kjv\" data-code=\"H7227\">many</span> days."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"bezocht","tekst":"God bezoekt op tweeërlei wijze: òf met enige bijzondere weldaad en vervulling zijner belofte, als onder Gen 50:24; Exo 4:31; Rth 1:6; Psa 8:5, gelijk het woord hier ook genomen wordt; òf met uivoering van dreigementen en straffen, Exo 20:5; Deu 5:9; Psa 59:6; Isa 27:1."}],"2":[{"catchword":"in zijn","tekst":"And. voor zijn ouderdom, en alzo ook vs.7."},{"catchword":"ter gezetter","tekst":"Zie boven, Gen 18:10, Gen 18:14."}],"3":[{"catchword":"noemde","tekst":"Maar het bevel des Heeren, boven Gen 17:19. Zie aldaar de aant."}],"4":[{"catchword":"zijnde","tekst":"Hebr. een zoon van acht dagen. Alzo in het volgende vs."}],"6":[{"catchword":"lachen gemaakt","tekst":"Eensdeels der verwondering over de zeldzaamheid dezer zaak; anderdeels der vreugde, omdat velen zich over deze weldaad Gods verblijden zullen."},{"catchword":"zal met","tekst":"Dat is, zich met mij verblijden, Luk 1:58."}],"7":[{"catchword":"zonen","tekst":"Dat is, een zoon, zijnde het getal van velen naar het gebruik der Heilige Schrift, voor het getal van een somtijds genomen; zoals onder Gen 46:7, Gen 46:23; Num 20:8."}],"9":[{"catchword":"spottende","tekst":"Zonder twijfel den spot daarmede drijvende, dat men zoveel werk van Izak maakte, die lang na hem geboren was. Deze bespotting is uit zulke bitterheid gesproten, dat de apostel haar noemt vervolging, Gal 4:29."}],"10":[{"catchword":"niet erven","tekst":"Hieruit is af te nemen dat Ismael zonder twijfel door insteking van zijn moeder, mede gewag gemaakt heeft van het recht der eerstgeboorte en beërving der goederen. En hierom is Sara zozeer verstoord geweest, zowel tegen de moeder als tegen den zoon."}],"11":[{"catchword":"was zeer","tekst":"Dat is, misviel hem zeer, om de liefde, die bij zijn zoon Ismael toedroeg, en om de belofte, die hij van God voor hem gekregen had; boven Gen 17:18, Gen 17:20. Kwaad, wordt gezegd, in iemands ogen te zijn, wat hem mishaagt en onaangenaam is; alzo in het volgende vs. en onder Gen 28:8; Exo 21:8; Num 11:10."}],"12":[{"catchword":"God","tekst":"Te weten, des nachts, vs.14"},{"catchword":"al wat","tekst":"Aangaande deze zaak van Ismaël en Hagar."},{"catchword":"Izak","tekst":"Dat is, Gods volk, bij hetwelk het verbond Gods zal berusten, en inzonderheid de Messias, zullen niet voortkomen van Ismael, maar van Izak; mitsgaders die alleen zullen het ware geslacht van Abraham zijn; niet die naar de natuur vleselijk uit hem zullen voortkomen, gelijk Ismael; maar die door de genade en kracht der geestelijke belofte zijn kinderen zullen zijn, gelijk Izak; zie Rom 9:6-8."},{"catchword":"genoemd","tekst":"Anders, geroepen worden."}],"13":[{"catchword":"tot een","tekst":"Zie boven, Gen 16:10, en Gen 17:20"},{"catchword":"omdat hij","tekst":"Dat is, omdat hij uw zoon is, en dat hij van u afkomstig is."}],"14":[{"catchword":"brood,","tekst":"Versta door brood en water, alles wat tot deze reis nodig was."},{"catchword":"kind,","tekst":"Te weten, Ismaël, boven genoemd jongen, vs.12, en ond. vs.17. De geestelijke beduiding van deze gehele zaak, zie Gal 4:23-24, enz."},{"catchword":"in de","tekst":"Gelegen op de zuidelijke grens van Palestina, niet ver van Gerar, en op dezen tijd aldus nog niet genoemd, maar daarna, toen de koning Abimélech omtrent die plaats met Abraham een verbond heeft gemaakt. Zie onder, vs.31."}],"15":[{"catchword":"zo","tekst":"Als hij niet langer kunnende aan haar hand gaan, en te groot zijnde om door Hagar te kunnen gedragen worden; want hij was nu omtrent 17 jaren oud. Zie ond. vs.18."},{"catchword":"onder","tekst":"Te weten, om bevrijd te zijn tegen de hitte van de zon, opdat het in stilte onder de schaduw zijn geest, zoals zij meende, mocht geven."}],"16":[{"catchword":"zo ver,","tekst":"Zover als een boogschutter afgaat van zijn perk; of omtrent een boogschot."},{"catchword":"Dat ik","tekst":"Hebr. dat ik niet zie, als het kind sterft, of het sterven des kinds."}],"17":[{"catchword":"van den","tekst":"Die ontwijfelbaar niet minder dan de moeder, in dezen droevigen staat zijnde, geschreid heeft."},{"catchword":"ter plaatse","tekst":"Hebr. in hetwelk, of in hetgeen waar hij is."}],"19":[{"catchword":"God","tekst":"Niet dat zij tevoren niet zag, maar dat God haar ogen zo bestuurd en gehouden heeft, dat zij dien put niet bemerkte. Verg. Luk 24:31."}],"20":[{"catchword":"God was","tekst":"God was hem gunstig, en zegende hem naar den inhoud zijner belofte, zoveel het tijdelijke betreft. Verg. ond. de aant. op vs.22"},{"catchword":"een boogschutter","tekst":"Hebr. een schietende boogschutter. Dat is, een kloek jager en krijgsman. Zie boven, Gen 16:12."}],"21":[{"catchword":"Paran;","tekst":"Zie bov. Gen 14:6."},{"catchword":"en zijn","tekst":"Merk hier op het recht der ouders over de kinderen in huwelijkszaken, ja zelfs der moeder alleen. Verg. ond. Gen 24:3-4, enz."}],"22":[{"catchword":"terzelfder","tekst":"Dat is, omtrent den tijd van den maaltijd, hier tevoren vermeld, en van de uitzetting van Hagar en haar zoon."},{"catchword":"Abimélech,","tekst":"Konint te Gerar, van wien boven Gen 20:2 gesproken wordt."},{"catchword":"God is","tekst":"God de Heere is met de zijnen niet alleen door lichamelijk, maar ook door geestelijke zegeningen, hoewel Abimélech en Pichol eigenlijk hun ogen op den lichamelijken en tijdelijken zegen geslagen hadden. Zie deze manier van spreken ond. Gen 39:3; Jos 3:7, en Jos 7:12; 2Ch 1:1."}],"23":[{"catchword":"Zo","tekst":"Versta hierdoor: dat u wee of straf wedervaren moet, of God doe u dit of dat. Zie bov. Gen 14:23."},{"catchword":"liegen","tekst":"Of bedriegelijk sprken, of handelen zult met mij."}],"25":[{"catchword":"Abraham","tekst":"Eer Abraham zweert, wil hij alle achterdocht wegnemen."},{"catchword":"ter oorzake","tekst":"Aangezien hij hem gegraven had, en door de dorheid des lands het water zeer moeilijk te bekomen, en daarom hoog nodig en van grote waarde was. Verg. onder, Gen 26:19-21, enz. Jdg 1:15."}],"26":[{"catchword":"stuk","tekst":"Hebr. woord, zaak ding."}],"27":[{"catchword":"Abraham nam","tekst":"Te weten, tot een bewijs, 1, dat hij den koning dankbaar was voor de vriendschap van hem ontvangen; 2. dat hij des konings antwoord aannam, belangende den put; 3. dat hij hem en den zijnen beloofde getrouw te wezen."},{"catchword":"maakten","tekst":"Hebr. sneden, hieuwen. Zie boven Gen 15:18."}],"28":[{"catchword":"bijzonder","tekst":"Hebr. hier alleen; alzo vs.29."}],"30":[{"catchword":"gegraven","tekst":"En dat hij dienvolgens mij en den mijnen wettelijk toekomt. Abrahams zorg is niet tevergeefs geweest. Zie onder Gen 26:15."}],"31":[{"catchword":"Ber-séba,","tekst":"Welke naam hier en boven, vs.14, aan deze plaats en het omliggende land toegeschreven wordt; maar onder, Gen 26:33, een stad in die landstreek gelegen, die daarna den stam van Juda toegeëigend is; Jos 15:28; 1Ki 19:3; doch door den stam van Simeon bewoond; Jos 19:2, en is geweest de zuidpale van het land Kanaän, gelijk Dan de noordpale; 2Sa 17:11, en 2Sa 24:2."}],"32":[{"catchword":"naar der","tekst":"Versta naar Gerar, niet ver van deze plaats gelegen."}],"33":[{"catchword":"hij plantte","tekst":"Te weten, Abraham."},{"catchword":"riep","tekst":"Ontvangen hebbende nieuwe oorzaak tot dankbaarheid, heeft hij den openbaren Godsdienst aldaar gepleegd, zie boven Gen 4:26."},{"catchword":"des eeuwigen","tekst":"Hebr. van den God der eeuwigheid."}],"34":[{"catchword":"vele dagen","tekst":"Dat is, langen tijd, aangezien hem de Heere hier zekerheid en rust verleende."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"And the Lord visited Sarah [ God visiting is twofold either by special mercies and fulfilling of his promises as below chapter 50.24 Exo 4:31 Ruth 1.6 Psa 8:5 and as it is likewise taken in this place or by executing of his threatening and judgment Exo 20:5 Deu 5:9 Psa 59:6 Isa 27:1] according as he had said and the Lord according as he had spoken."}],"2":[{"catchword":null,"tekst":"And Sarah conceived and bare a son to Abraham his old age [ others of his old age and so likewise verse 7] at the appointed time which God hath told him [ see above chapter 18.10 and 14.]"}],"3":[{"catchword":null,"tekst":"And Abraham called the name of his son that was born him whom Sarah bare unto him Isaac [according to Gods command above chapter 17.19 see the annotate there.]"}],"4":[{"catchword":null,"tekst":"And Abraham circumcised his son Isaac being eight days old [Heb. A son of eight days and so in the next verse] according as God commanded him."}],"5":[{"catchword":null,"tekst":"And Abraham was hundred years old when Isaac was born to him."}],"6":[{"catchword":null,"tekst":"Then Sarah said God has made me laugh [partly for wondering as so strange a matter as this and partly for joy because many will rejoice at this mercy of God] everyone that hears it will laugh with me [partake of my rejoicing see Luke 1 verse 58.]"}],"7":[{"catchword":null,"tekst":"Moreover she said who should have told Abraham? Sarah gave suck to the sons [ that is a son to the plural number being sometime in scripture phrase put for the singular as below chapter 46 verse 7,23 and Numbers 26 verse 8] for I have born a son in his old age."}],"8":[{"catchword":null,"tekst":"And the child grew up and was weaned then Abraham made a great feast on that day when Isaac was weaned."}],"9":[{"catchword":null,"tekst":"and Sarah saw the son of Hagar the Egyptian woman whom she had born to Abraham mocking [ doubtless saucily gibing at this that they kept so much a do or busied themselves so much with Isaac born so long after him this mocking proceeded from such a bitterness that the apostle term is a persecution Galatians 4.9.]"}],"10":[{"catchword":null,"tekst":"And she said to Abraham drive out this maid servant and her son for the son of her maidservant shall not inherit with my son Isaac [ hence it appeareth that Ishmael doubtless through the instigation or instructions of his mother and likewise boasted of his right of primogeniture and that he as the first born ought to inherit Abrahams goods and this was the matter that provoked Sarah so much as well against the mother as against the son.]"}],"11":[{"catchword":null,"tekst":"And this word was very evil in Abraham&acirc;&euro;&trade;s eyes because of his son [that is it displeased him exceedingly for the great loves sake which he bore to Ishmael and in regard likewise of promises which God had given him in his behalf above chapter 17.18,20 to be evil in ones eyes is as much as to say displease one and be very unacceptable to him so in thee mext verse also and below chapter 28.8 Exo 21:8 Num 11:10.]"}],"12":[{"catchword":null,"tekst":"But God said to Abraham [ viz. in the night verse 14] let it not be evil in the eyes touching the youth and touching thy maid-servant all that Sarah shall say unto thee [ concerning the business of Ishmael and Hagar ] hearkening after her voice for in Isaac shall thy seed be named [ others called that is the people of God with whom Gods covenant abides and especially the Messiah they shall not issue from Ishmael but from Isaac withal the true posterity and generation of Abraham shall be not they that issue carnally from him according to the course of nature like Ishmael but those that shall be his children through the grace and efficacy of the spiritual promises made to him as Isaac was see Rom 9:6,7,8.]"}],"13":[{"catchword":null,"tekst":"Yet I shall likewise put the son of this maid-servant to be peopling [see above chapter 16.10 and 17.20] for that he is thy seed [that is because he is son and off-spring.]"}],"14":[{"catchword":null,"tekst":"Then Abraham rose up early in the morning and took bread and a bottle of water [ by the bread and water is to be understood all necessary provision for the journey] and gave them to Hagar laying the same upon the shoulder also he gave her the child [ Ishmael namely called a youth above verse 11 and below verse 17 of the spiritual type of the signification of this whole business see Galatians 4.23,24 &c.] and sent her away and she went forth and strayed in the wilderness of Berseba [ lying inn the south-border of Palestine not far from Gerar through at this time not so called yet but afterwards when king Abimelech mad ea covenant with Abraham thereabout see below verse 31.]"}],"15":[{"catchword":null,"tekst":"Now when the water of the bottle was spent then she threw the child [she being not able to lead him further by the hand by reason of this faintness and he too big to carry him as being about seventeen years of the age then see below verse 18.] under one of the bushes [viz. to be sheltered there against the heat of the sun and the more quietly to expire as she thought in the shadow.]"}],"16":[{"catchword":null,"tekst":"And she went and set herself over against going down so far as they that shoot with a bow [that is as far as an Archer goeth off from his mark or about to bow-shot] for she said that I may not see the child die or the dying of the child] and sate ver. against and lifted her voice and wept."}],"17":[{"catchword":null,"tekst":"And god heard the voice of the youth [who doubtless cried no less than the mother in the desolate condition] and the angel of God called upon Hagar out of heaven and said unto her what is or ails thee Hagar? Be not afraid because God have heard the voice of the youth at the place where he is [Heb. In which or in that where he is.]"}],"18":[{"catchword":null,"tekst":"Arise take up the youth and hold him fast by thy hand for I will put him to be a great people."}],"19":[{"catchword":null,"tekst":"And God opened her eyes [ not as if she had not seen before but that God had so ruled and kept her eyes that she took no heed of that well compare Luk 24:31 ] that she saw a well of water and she went and filled the bottle with water and gave the youth to drink."}],"20":[{"catchword":null,"tekst":"And God was with the youth [God was favorable to him and blessed him according to the tenor of his promise in temporal things compare below the annotations on verse 2] and he grew tall and he dwelt in the wilderness and became an Archer [Heb. A shooting bow-shooter that is a valiant hunter and warrior see above chapter 16.12.]"}],"21":[{"catchword":null,"tekst":"and dwelt in the wilderness of Paran [see above chapter 14 on verse 6] and his mother took him a wife out of Egypt [ observe here the right and authority of the parents in bestowing and marrying their children even the mothers alone compare below chapter 24. Verse 3, 4&c.]"}],"22":[{"catchword":null,"tekst":"Further it happened at that time [ that is about the time of Abrahams aforementioned feast and the expelling of Hagar and her son] that Abimelech [ king of Gerar spoken of before chapter 20.2] together with Pichol his chief captain or chieftain of his host spake to Abraham saying god is with thee in all thou doest [ God is with his blessing them not only in outward and temporal but also and chiefly in spiritual concernment though Abimelech and Pichol and their eyes principally fixed upon bodily and temporal blessed which Abraham enjoyed see the like phrase below chapter 39.3 Joshua3.7 and 7.12 2Ch 1:1.]"}],"23":[{"catchword":null,"tekst":"therefore swear now unto me by God if thou shalt lie [ or deceitful speak or deal] to me and my son or my nephew [ understand hereupon that then woe or punishment shall come upon thee or God do thus and thus or this and that unto thee see above chapter 14.23 ] according to the kindness which I have done by thee salt thou do by me an day the land wherein thou doest sojourn as a stranger."}],"24":[{"catchword":null,"tekst":"And Abraham said I will swear."}],"25":[{"catchword":null,"tekst":"Yet Abraham taxed Abimelech [before Abraham swears he will take away all scrupling] because of a water-well [which himself had digged and the water having been having hard to come by otherwise in regard of dry soil of those part and therefore very needful and behoofful and much to be valued compare below chapter 26.19,20,21 &c. Jud 1:15] which Abimelech&acirc;&euro;&trade;s servant had taken by force."}],"26":[{"catchword":null,"tekst":"Then said Abimelechh I wits not who did this feast [Heb. Word thing matter] and also thou hast not made it known to me and I likewise have not heard of it but this day."}],"27":[{"catchword":null,"tekst":"And Abraham took sheep and oxen and gave them to Abimelech [viz. in token of 1. of his gratefulness to the king for the friendship received from him 2. of being satisfied with the king&acirc;&euro;&trade;s answer touching well 3. Of his readiness and promise to be true and faithful to him and his] and those two made [Heb. Cut struck] a covenant [see above chapter 15 verse 18.]"}],"28":[{"catchword":null,"tekst":"Yet Abraham put seven ewe-lambs of the stock apart [Heb. them alone and so verse 29.]"}],"29":[{"catchword":null,"tekst":"Then said Abimelech to Abraham what shall or mean these seven ewe-lamb here which thou hast set apart?"}],"30":[{"catchword":null,"tekst":"And he said that thou shalt take these seven ewe-lambs from thy hand that it may be for witness to me that I have digged this well [ and that consequently the same doth lawfully appertaining to me and mine Abrahams care proved not in vain see below chapter 26.15.]"}],"31":[{"catchword":null,"tekst":"Therefore they called that place Beersheba [ which name both here an above verse 14 is attributed to this place and the territory about it but below chapter 26 verse 33 appropriated to a city lying in that tract which was afterwards allotted to the tribe of Judah Jos 15:8 1Ki 19:3 yet inhabitated by the tribe of Simeon Jos 19:2 and was the south border of the land of Canaan as Dan was the north border 2samuel 17.11 and 24.2] because these two had sworn there."}],"32":[{"catchword":null,"tekst":"Thus made they a covenant at Beersheba after that Abimelech arose and Pichol his chief captain and they returned to the country of the Pilistines [understand to Gerar not far distant from this place.]"}],"33":[{"catchword":null,"tekst":"And he [Viz. Abraham] planted a groove at Beersheba and called thereupon the name of the Lord [having received new cause of thankfulness he there set up and exercised the public worship of God see above chapter 4.26] the eternal God [Heb. The God of eternity.]"}],"34":[{"catchword":null,"tekst":"Then Abraham dwelt as a stranger in the land of the philistines many days [that is for a long time the Lord affording him good security and rest there.]"}]}}};

(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');

  // i.p.v. de vertalingen-popup te tonen (enkele rechtsklik blijft bestaand gedrag)
  function kopieerVerwijzing(chip, ref) {
    haalVert('versteksten', ref).then(data => {
      const tekst = data && data[ref.vers];
      if (!tekst) return;
      const url = location.origin + '/studiebijbel/' + ref.slug + '/' + ref.hfd + '#v' + ref.vers;
      const kopie = tekst.replace(/\*/g, '') + `\n~ [${chip.textContent}](${url}) (SVnu)`;
      navigator.clipboard.writeText(kopie).then(() => {
        toast.classList.add('zichtbaar');
        setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
      });
    });
  }
  let laatsteRechtsklik = { sleutel: null, tijd: 0 };
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    const sleutel = chip.dataset.ref;
    const nu = Date.now();
    const isDubbelklik = laatsteRechtsklik.sleutel === sleutel && (nu - laatsteRechtsklik.tijd) < 500;
    laatsteRechtsklik = isDubbelklik ? { sleutel: null, tijd: 0 } : { sleutel, tijd: nu };
    if (isDubbelklik) {
      popup.style.display = 'none';
      vpopup.style.display = 'none';
      kopieerVerwijzing(chip, ref);
      return;
    }
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
<script src="/studiebijbel/zoekbalk.js"></script></body>
