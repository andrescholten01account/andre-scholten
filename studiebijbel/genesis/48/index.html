 dingen, dat men Jozef vertelde: Zie, uw vader is ziek! Toen nam hij zijn twee zonen met zich, Manasse en Efraïm.","2":"En men vertelde het Jakob, en men zei: Zie, uw zoon Jozef komt naar u toe! Toen verzamelde Israël zijn krachten, en ging op het bed zitten.","3":"Daarna zei Jakob tegen Jozef: God de Almachtige is aan mij verschenen te Luz, in het land Kanaän, en Hij heeft mij gezegend;","4":"en Hij heeft tegen mij gezegd: Zie, Ik zal u vruchtbaar maken, en u vermenigvuldigen, en u tot een menigte van volken maken; en Ik zal aan uw nageslacht na u dit land tot een eeuwig bezit geven.","5":"Nu dan, uw twee zonen, die u in Egypteland geboren zijn, voordat ik naar u toe in Egypte gekomen ben, zijn van mij; Efraïm en Manasse zullen van mij zijn, zoals Ruben en Simeon.","6":"Maar uw nageslacht, dat u na hen zult krijgen, zal van u zijn; zij zullen naar de naam van hun broers genoemd worden in hun erfdeel.","7":"Toen ik nu van Paddan kwam, is Rachel bij mij gestorven in het land Kanaän, op de weg, toen er nog maar een klein stuk land was om tot Efrath te komen; en ik begroef haar daar aan de weg van Efrath, dat is Bethlehem.","8":"En Israël zag de zonen van Jozef, en zei: Wie zijn dit?","9":"En Jozef zei tegen zijn vader: Zij zijn mijn zonen, die God mij hier gegeven heeft. En hij zei: Breng hen toch bij mij, dan zal ik hen zegenen!","10":"Doch de ogen van Israël waren wazig door ouderdom; hij kon niet goed zien; en hij liet hen naar zich toe komen; toen kuste hij hen, en omhelsde hen.","11":"En Israël zei tegen Jozef: Ik had niet gedacht uw gezicht te zien; maar zie, God heeft mij ook uw nageslacht laten zien!","12":"Toen liet Jozef hen van zijn knieën vandaan gaan; en hij boog zich met zijn gezicht neer tot de aarde.","13":"En Jozef nam die beiden, Efraïm met zijn rechterhand tegenover Israëls linkerhand, en Manasse met zijn linkerhand tegenover Israëls rechterhand, en hij bracht hen naar hem toe.","14":"Maar Israël strekte zijn rechterhand uit, en legde die op het hoofd van Efraïm, hoewel hij de jongste was, en zijn linkerhand op het hoofd van Manasse; hij stuurde zijn handen met inzicht; want Manasse was de eerstgeborene.","15":"En hij zegende Jozef, en zei: De God, voor Wiens aangezicht mijn vaders, Abraham en Izak, gewandeld hebben, die God, Die mij gevoed heeft, van mijn jeugd af tot op deze dag;","16":"Die Engel, Die mij verlost heeft van alle kwaad, zegent deze jongens, en laat in hen mijn naam genoemd worden, en de naam van mijn vaders Abraham en Izak, en laat hen vermenigvuldigen als vissen in menigte, midden in het land!","17":"Toen Jozef zag dat zijn vader zijn rechterhand op het hoofd van Efraïm legde, was dat niet goed in zijn ogen, en hij greep de hand van zijn vader vast, om die van het hoofd van Efraïm naar het hoofd van Manasse te brengen.","18":"En Jozef zei tegen zijn vader: Niet zo, mijn vader! Want deze is de eerstgeborene; leg uw rechterhand op zijn hoofd.","19":"Maar zijn vader weigerde het, en zei: Ik weet het, mijn zoon! Ik weet het; hij zal ook tot een volk worden, en hij zal ook groot worden; maar toch zal zijn jongste broer groter worden dan hij, en zijn nageslacht zal een volle menigte van volken worden.","20":"Zo zegende hij hen op die dag, en zei: In u zal Israël zegenen, en zeggen: God stelt u als Efraïm en als Manasse! En hij stelde Efraïm voor Manasse.","21":"Daarna zei Israël tegen Jozef: Zie, ik sterf; maar God zal met u zijn, en Hij zal u terugbrengen naar het land van uw vaders.","22":"En ik heb u één stuk land gegeven, boven uw broers; dat ik met mijn zwaard en met mijn boog uit de hand van de Amorieten genomen heb."},"SV":{"1":"Het geschiedde nu na deze dingen, dat men Jozef zeide: Zie, uw vader is krank! Toen nam hij zijn twee zonen met zich, Manasse en Efraïm!","2":"En men boodschapte Jakob, en men zeide: Zie, uw zoon Jozef komt tot u! Zo versterkte zich Israël, en zat op het bed.","3":"Daarna zeide Jakob tot Jozef: God de Almachtige, is mij verschenen te Luz, in het land Kanaän, en Hij heeft mij gezegend;","4":"En Hij heeft tot mij gezegd: Zie, Ik zal u vruchtbaar maken, en u vermenigvuldigen, en u tot een hoop van volken stellen; en Ik zal aan uw zaad na u dit land tot een eeuwige bezitting geven.","5":"Nu dan, uw twee zonen, die u in Egypteland geboren waren, eer ik in Egypte tot u gekomen ben, zijn mijne; Efraïm en Manasse zullen mijne zijn, als Ruben en Simeon.","6":"Maar uw geslacht, dat gij na hen zult gewinnen, zullen uwe zijn; zij zullen naar hunner broederen naam genoemd worden in hun erfdeel.","7":"Toen ik nu van Paddan kwam, zo is Rachel bij mij gestorven in het land Kanaän, op den weg, als het nog een kleine streek lands was, om tot Efrath te komen; en ik begroef haar aldaar aan den weg van Efrath, welke is Bethlehem.","8":"En Israël zag de zonen van Jozef, en zeide: Wiens zijn deze?","9":"En Jozef zeide tot zijn vader: Zij zijn mijn zonen, die mij God hier gegeven heeft. En hij zeide: Breng hen toch tot mij, dat ik hen zegene!","10":"Doch de ogen van Israël waren zwaar van ouderdom; hij kon niet zien; en hij deed hen naderen tot zich; toen kuste hij hen, en omhelsde hen.","11":"En Israël zeide tot Jozef: Ik had niet gemeend uw aangezicht te zien; maar zie, God heeft mij ook uw zaad doen zien!","12":"Toen deed hen Jozef uitgaan van zijn knieën; en hij boog zich met zijn aangezicht neder ter aarde.","13":"En Jozef nam die beiden, Efraïm met zijn rechterhand, tegenover Israëls linkerhand, en Manasse met zijn linkerhand, tegenover Israëls rechterhand, en hij deed hen naderen tot hem.","14":"Maar Israël strekte zijn rechterhand uit, en leide die op het hoofd van Efraïm, hoewel hij de minste was, en zijn linkerhand op het hoofd van Manasse; hij bestierde zijn handen verstandelijk; want Manasse was de eerstgeborene.","15":"En hij zegende Jozef, en zeide: De God, voor Wiens aangezicht mijn vaders, Abraham en Izak, gewandeld hebben, die God, Die mij gevoed heeft, van dat ik was, tot op dezen dag;","16":"Die Engel, Die mij verlost heeft van alle kwaad, zegene deze jongeren, en dat in hen mijn naam genoemd worde, en de naam mijner vaderen, Abraham en Izak, en dat zij vermenigvuldigen als vissen in menigte, in het midden des lands!","17":"Toen Jozef zag, dat zijn vader zijn rechterhand op het hoofd van Efraïm leide, zo was het kwaad in zijn ogen, en hij ondervatte zijns vaders hand, om die van het hoofd van Efraïm op het hoofd van Manasse af te brengen.","18":"En Jozef zeide tot zijn vader: Niet alzo, mijn vader! want deze is de eerstgeborene; leg uw rechterhand op zijn hoofd.","19":"Maar zijn vader weigerde het, en zeide: Ik weet het, mijn zoon! ik weet het; hij zal ook tot een volk worden, en hij zal ook groot worden; maar nochtans zal zijn kleinste broeder groter worden dan hij, en zijn zaad zal een volle menigte van volkeren worden.","20":"Alzo zegende hij ze te dien dage, zeggende: In u zal Israël zegenen, zeggende: God zette u als Efraïm en als Manasse! En hij zette Efraïm voor Manasse.","21":"Daarna zeide Israël tot Jozef: Zie, ik sterf; maar God zal met ulieden wezen, en Hij zal u wederbrengen in het land uwer vaderen.","22":"En ik heb u een stuk lands gegeven boven uw broederen; hetwelk ik, met mijn zwaard en met mijn boog, uit de hand der Amorieten genomen heb."},"KJV":{"1":"And it came to pass after these things, that *one* told Joseph, Behold, thy father *is* sick: and he took with him his two sons, Manasseh and Ephraim.","2":"And *one* told Jacob, and said, Behold, thy son Joseph cometh unto thee: and Israel strengthened himself, and sat upon the bed.","3":"And Jacob said unto Joseph, God Almighty appeared unto me at Luz in the land of Canaan, and blessed","4":"And said unto me, Behold, I will make thee fruitful, and multiply thee, and I will make of thee a multitude of people; and will give this land to thy seed after thee *for* an everlasting possession.","5":"And now thy two sons, Ephraim and Manasseh, which were born unto thee in the land of Egypt before I came unto thee into Egypt, *are* mine; as Reuben and Simeon,","6":"And thy issue, which thou begettest after them, shall be thine, *and* shall be called after the name of their brethren in their inheritance.","7":"And as for me, when I came from Padan, Rachel died by me in the land of Canaan in the way, when yet *there was* but a little way to come unto Ephrath: and I buried her there in the way of Ephrath; the same *is* Bethlehem.","8":"And Israel beheld Joseph's sons, and said,","9":"And Joseph said unto his father, They *are* my sons, whom God hath given me in this *place*. And he said, Bring them, I pray thee, unto me, and I will bless","10":"Now the eyes of Israel were dim for age, *so that* he could not see. And he brought them near unto him; and he kissed them, and embraced","11":"And Israel said unto Joseph, I had not thought to see thy face: and, lo, God hath shewed me also thy seed.","12":"And Joseph brought them out from between his knees, and he bowed himself with his face to the earth.","13":"And Joseph took them both, Ephraim in his right hand toward Israel's left hand, and Manasseh in his left hand toward Israel's right hand, and brought *them* near","14":"And Israel stretched out his right hand, and laid *it* upon Ephraim's head, who *was* the younger, and his left hand upon Manasseh's head, guiding his hands wittingly; for Manasseh *was* the firstborn.","15":"And he blessed Joseph, and said, God, before whom my fathers Abraham and Isaac did walk, the God which fed me all my life long unto this day,","16":"The Angel which redeemed me from all evil, bless the lads; and let my name be named on them, and the name of my fathers Abraham and Isaac; and let them grow into a multitude in the midst of the earth.","17":"And when Joseph saw that his father laid his right hand upon the head of Ephraim, it displeased him: and he held up his father's hand, to remove it from Ephraim's head unto Manasseh's head.","18":"And Joseph said unto his father, Not so, my father: for this *is* the firstborn; put thy right hand upon his head.","19":"And his father refused, and said, I know *it*, my son, I know *it*: he also shall become a people, and he also shall be great: but truly his younger brother shall be greater than he, and his seed shall become a multitude of nations.","20":"And he blessed them that day, saying, In thee shall Israel bless, saying, God make thee as Ephraim and as Manasseh: and he set Ephraim before Manasseh.","21":"And Israel said unto Joseph, Behold, I die: but God shall be with you, and bring you again unto the land of your fathers.","22":"Moreover I have given to thee one portion above thy brethren, which I took out of the hand of the Amorite with my sword and with my bow."}},"tsk":{"1":[{"kopje":"uw vader","refs":["Joh 11:3"]},{"kopje":"zijn twee zonen","refs":["Gen 41:50-52","Gen 46:20","Gen 50:23","Job 42:16","Ps 128:6"]}],"2":[{"kopje":"verzamelde zijn krachten","refs":["Deut 3:28","1 Sam 23:16","Neh 2:18","Ps 41:4","Spr 23:15","Ef 6:10"]}],"3":[{"kopje":"God de Almachtige","refs":["Gen 17:1","Gen 28:3","Gen 35:11","Ex 6:2","Openb 21:11"]},{"kopje":"verschenen","refs":["Gen 28:12-19","Gen 35:6","Gen 35:7","Gen 35:9","Gen 35:11","Gen 35:12","Hos 12:5"]},{"kopje":"Luz","refs":["Richt 1:23"]}],"4":[{"kopje":"Zie, Ik","refs":["Gen 12:2","Gen 13:15","Gen 13:16","Gen 22:17","Gen 26:4","Gen 28:3","Gen 28:13-15","Gen 32:12","Gen 35:11","Gen 46:3","Gen 47:27","Ex 1:7","Ex 1:11"]},{"kopje":"geven","refs":["Deut 32:8","Amos 9:14","Amos 9:15"]},{"kopje":"eeuwig","refs":["Gen 17:8","Gen 17:13"]}],"5":[{"kopje":"twee zonen","refs":["Gen 41:50-52","Gen 46:20","Joz 13:7","Joz 14:4","Joz 16:1","Joz 17:18"]},{"kopje":"zijn van mij","refs":["Lev 20:26","Num 1:10","Num 1:32-35","Num 26:28-37","Jes 43:1","Ezech 16:8","Mal 3:17","2 Kor 6:18","Ef 1:5"]},{"kopje":"Ruben","refs":["1 Kron 5:1","1 Kron 5:2","Openb 7:6","Openb 7:7"]}],"6":[{"kopje":"genoemd worden","refs":["Joz 14:4"]}],"7":[{"kopje":"Paddan","refs":["Gen 25:20"]},{"kopje":"Rachel","refs":["Gen 35:9" n class=\"wl wl-kjv\" data-code=\"H7230\">multitude</span> in the <span class=\"wl wl-kjv\" data-code=\"H7130\">midst</span> of the earth.","17":"And when <span class=\"wl wl-kjv\" data-code=\"H3130\">Joseph</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> that his <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> <span class=\"wl wl-kjv\" data-code=\"H7896\">laid</span> his <span class=\"wl wl-kjv\" data-code=\"H3225\">right</span> <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> upon the <span class=\"wl wl-kjv\" data-code=\"H7218\">head</span> of <span class=\"wl wl-kjv\" data-code=\"H669\">Ephraim,</span> it <span class=\"wl wl-kjv\" data-code=\"H3415\">displeased</span> him: and he held <span class=\"wl wl-kjv\" data-code=\"H8551\">up</span> his <span class=\"wl wl-kjv\" data-code=\"H1\">father's</span> <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> to <span class=\"wl wl-kjv\" data-code=\"H5493\">remove</span> it from <span class=\"wl wl-kjv\" data-code=\"H669\">Ephraim's</span> <span class=\"wl wl-kjv\" data-code=\"H7218\">head</span> unto <span class=\"wl wl-kjv\" data-code=\"H4519\">Manasseh's</span> head.","18":"And <span class=\"wl wl-kjv\" data-code=\"H3130\">Joseph</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto his <span class=\"wl wl-kjv\" data-code=\"H1\">father,</span> Not so, my <span class=\"wl wl-kjv\" data-code=\"H1\">father:</span> for this is the <span class=\"wl wl-kjv\" data-code=\"H1060\">firstborn;</span> <span class=\"wl wl-kjv\" data-code=\"H7760\">put</span> thy right <span class=\"wl wl-kjv\" data-code=\"H3225\">hand</span> upon his head.","19":"And his <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> <span class=\"wl wl-kjv\" data-code=\"H3985\">refused,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> I <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> it, my <span class=\"wl wl-kjv\" data-code=\"H1121\">son,</span> I <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> it: he also shall become a <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> and he also shall be <span class=\"wl wl-kjv\" data-code=\"H1431\">great:</span> but <span class=\"wl wl-kjv\" data-code=\"H199\">truly</span> his <span class=\"wl wl-kjv\" data-code=\"H6996\">younger</span> <span class=\"wl wl-kjv\" data-code=\"H251\">brother</span> shall be <span class=\"wl wl-kjv\" data-code=\"H1431\">greater</span> than he, and his <span class=\"wl wl-kjv\" data-code=\"H2233\">seed</span> shall become a <span class=\"wl wl-kjv\" data-code=\"H4393\">multitude</span> of nations.","20":"And he <span class=\"wl wl-kjv\" data-code=\"H1288\">blessed</span> them that <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> In thee shall <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H1288\">bless,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H7760\">make</span> thee as <span class=\"wl wl-kjv\" data-code=\"H669\">Ephraim</span> and as <span class=\"wl wl-kjv\" data-code=\"H4519\">Manasseh:</span> and he <span class=\"wl wl-kjv\" data-code=\"H7760\">set</span> <span class=\"wl wl-kjv\" data-code=\"H669\">Ephraim</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> Manasseh.","21":"And <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H3130\">Joseph,</span> Behold, I <span class=\"wl wl-kjv\" data-code=\"H4191\">die:</span> but <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> shall be with you, and bring you <span class=\"wl wl-kjv\" data-code=\"H7725\">again</span> unto the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of your fathers.","22":"Moreover I have <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> to thee <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H7926\">portion</span> above thy <span class=\"wl wl-kjv\" data-code=\"H251\">brethren,</span> which I <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> out of the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of the <span class=\"wl wl-kjv\" data-code=\"H567\">Amorite</span> with my <span class=\"wl wl-kjv\" data-code=\"H2719\">sword</span> and with my bow."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"nam hij zijn","tekst":"Te weten, trekkende naar zijn vader, om hem te bezoeken."}],"3":[{"catchword":"God, de","tekst":"Zie boven, Gen 17:1."},{"catchword":"Luz,","tekst":"Anders, Bethel genaamd. Zie boven, Gen 28:19, en Gen 35:6."},{"catchword":"heeft mij","tekst":"Dat is, Hij heeft de zegeningen aan mijn vader en grootvader beloofd, weder met mij vernieuwd en bevestigd; daar die van hand tot hand aan onze nakomelingen overgeleverd moeten worden."}],"4":[{"catchword":"land","tekst":"Te weten, het land Kanaän."},{"catchword":"tot een","tekst":"Hebr. tot een bezitting der eeuwigheid; namelijk, gedurende den tijd der wet, ten aanzien van dit aardse Kanaän; maar een tijd zonder einde, ten aanzien van het hemelse. Zie boven, Gen 13:15, en Gen 17:7, Gen 17:13, met de aantekeningen."}],"5":[{"catchword":"zijn mijne","tekst":"Dat is, ik wil hebben dat zij in de verdeling mijner goederen en van het land Kanaän, elk voor een staak of stam gehouden worden, alsof zij uit mij geboren waren, en niet uit u; Jos 14:4, en Jos 16:1, en Jos 17:17. Aldus heeft Jozef, die maar één deel der erfenis met zijn broeders moest hebben, een dubbel gehad, hetwelk Ruben toekwam als de eerstgeborene. Zie boven, Gen 29:32, maar is hem ontnomen, en op Jozef overgezet, 1Ch 5:1-2, om de oorzaak vermeld onder, Gen 49:3-4."},{"catchword":"Efraïm","tekst":"Efraïm wordt voor Manasse genoemd, om de reden vermeld vs.19."}],"6":[{"catchword":"uw geslacht,","tekst":"Dat is, uw kinderen, die gij boven Manasse en Efraïm hierna zoudt mogen krijgen."},{"catchword":"zullen uwe","tekst":"Dat is, zij zullen tot uw zonen gerekend worden, en mijn neven uit u."},{"catchword":"zij zullen naar","tekst":"Dat is, zij zullen in het verdelen van het land bij een van deze hun twee broeders gerekend worden, en geen stammen op zichzelven uitmaken, gelijk deze twee. Naar, of, over enigen naam genoemd te worden, is daarnaar te heten, en onder die gerekend te worden, welke van zulk een naam afkomstig zijn. Zie Deu 28:10; Amo 9:12, en verg. onder, vs.16."}],"7":[{"catchword":"Paddan","tekst":"Anders, Paddan-Aram. Zie boven, Gen 25:20, en Gen 35:9."},{"catchword":"bij mij","tekst":"Anders, over mij gestorven; alsof men zeide: op mijn schoot, en tussen mijn armen liggende. Anders, voor mij; dat is, voor mijn ogen."},{"catchword":"als het nog","tekst":"Zie boven, Gen 35:16."},{"catchword":"om tot","tekst":"Zie boven, Gen 35:16, Gen 35:19."}],"8":[{"catchword":"Wiens zijn","tekst":"Jakob zag met een verouderd gezicht, vs.10, zodat hij, op deze zonen van Jozef zijn ogen slaande, hen niet recht, noch onderscheidenlijk kon kennen."}],"9":[{"catchword":"Breng hen toch","tekst":"Hebr. neem hen; dat is, neem hen en breng hen. Het woord nemen wordt dikwijls aldus gebruikt; zie boven, Gen 12:15."},{"catchword":"dat ik hen","tekst":"Dat is, dat ik hun de beloftenissen Gods, hoe Hij hen zegenen wil, verkondig, en met oplegging der handen bevestig, naar de wijze van de zegening der patriarchen; zie boven, Gen 27:4."}],"10":[{"catchword":"zwaar van","tekst":"Dat is, dik en donker, niet bekwaam om onderscheidenlijk te zien."},{"catchword":"hij kon niet","tekst":"Dat is, hij kon niet wel zien; gelijk vs.8."},{"catchword":"toen kuste hij","tekst":"Zie boven, Gen 27:26."},{"catchword":"omhelsde hen","tekst":"Zie boven, Gen 29:13, en Gen 33:4."}],"12":[{"catchword":"van zijn knieën;","tekst":"Te weten, van Jakobs knieën, waartussen hij de jongens hield in het omhelzen; doch Jozef wilde hen nu hem ordentelijk nevens elkanders voorstellen, om op gewone wijze van hem den zegen te ontvangen."},{"catchword":"hij boog","tekst":"Zijnen vader burgerlijke eer bewijzende, en hem bedankende voor de vriendschap en de eer aan hem en zijn kinderen bewezen."}],"14":[{"catchword":"legde die","tekst":"Hebr. stelde haar."},{"catchword":"minste","tekst":"Te weten, van jaren."},{"catchword":"hij bestuurde","tekst":"Hebr. hij maakte zijn handen wijs; dat is, hij deed het niet uit misverstand, maar met goede voorgaande wetenschap, als een profeet, Gods wil volbrengende, zonder acht te geven op de eerstgeboorte. De oplegging der handen, waarvan hier het eerst gesproken wordt, is in deze tijd en naderhand gebruikelijk geweest: &lt;i&gt;I.&lt;/i&gt; in zegeningen, gelijk hier, en Mat 19:15; &lt;i&gt;II.&lt;/i&gt; in offeranden, Lev 1:4; zie de aantekeningen; &lt;i&gt;III.&lt;/i&gt; in veroordelingen en straffen, Lev 24:14; &lt;i&gt;IV.&lt;/i&gt; bij inhuldigingen en bevorderingen tot ambten, Num 8:10; Deu 34:9; Act 6:6; 1Ti 4:14; &lt;i&gt;V.&lt;/i&gt; in het doen van mirakelen, Mar 6:5; Luk 4:40; Act 28:8, enz."},{"catchword":"want Manasse","tekst":"Anders, hoewel."}],"15":[{"catchword":"Jozef","tekst":"Te weten, in zijn kinderen, gelijk blijkt vs.16."}],"16":[{"catchword":"engel, die","tekst":"Dewijl Jakob van dezen engel hetzelfde verzoekt, wat hij, vs.15, van God bidt, zo kan dit van geen geschapen engel verstaan worden, maar moet verstaan zijn van Gods Zoon. Zie boven, Gen 22:11."},{"catchword":"dat in hen","tekst":"Dat is, dat zij in mijn geslacht gerekend, en mijn en mijner vaderen Abrahams en Izaks kinderen genoemd en daarvoor gehouden worden. Dit is aldus geschied; want zij zijn onder de twaalf stammen Israels gesteld geweest, gelijk Jakobs eigen kinderen; verg. boven, de aantekeningen vs.6."}],"17":[{"catchword":"in zijn ogen,","tekst":"Dat is, het beviel hem kwalijk; zie boven, Gen 21:11."}],"19":[{"catchword":"groter","tekst":"Toen de Israelieten het eerst geteld werden in de woestijn, zo werd Efraïm het eerst geteld, en hij had 8300 mannen meer dan Manasse, gelijk te zien is Num 1:32-33, Num 1:35; Num 2:19, Num 2:21."},{"catchword":"volle","tekst":"Hebr. volheid."}],"20":[{"catchword":"In u zal","tekst":"Anders, naar u; dat is, naar uw exempel; alsof hij zeide: De Israelieten, iemand willende zegenen of geluk wensen, zullen u tot een exempel of voorschrift nemen, gelijk de naastvolgende woorden dit klaarlijk aanwijzen. Zie ook dergelijke manier van zegenen, Rth 4:11, en van vloeken, Jer 29:22."},{"catchword":"Israël","tekst":"Dat is, mijn nakomelingen, de Israelieten."}],"21":[{"catchword":"ik sterf;","tekst":"Dat is, ik zal haast sterven; zijnde de tegenwoordige tijd genomen voor den tijd, die haast komen zal en aanstaande is; verg. boven, Gen 19:13, en Gen 20:3; Joh 14:2."},{"catchword":"in het land","tekst":"Dat is, in het land Kanaän."}],"22":[{"catchword":"een stuk lands","tekst":"Het Hebreeuwse woord betekent eigenlijk een schouder, of, rug, gelijk boven, Gen 9:23, en daarnaar bij gelijkenis een stuk, deel, of, streek lands, hoog gelegen, gelijk hier. Maar Jakob, als een profeet, ziet ook op den naam der stad Sichem, die in dat land aan het gebergte gelegen was; zie boven, Gen 12:6, en naderhand den stam van Efraïm toegevallen is, Jos 20:7, waarin ook Jozefs gebeente begraven is geweest, Jos 24:32, als in het land, dat zijn vader Jakob hem op profetische wijze bezet en gegeven had, Joh 4:5; wel verstaande, niet alleen het stuk lands, hetwelk hij voor honderd stukken gelds gekocht had, boven, Gen 33:19, maar ook al het land der stad Sichem, die Simeon en Levi met gewapende hand ingenomen en geplunderd hadden, boven, Gen 34:25-26."},{"catchword":"boven uw","tekst":"Te weten, ten aanzien van het recht der eerstgeboorte, Deu 21:17, hetwelk Ruben verloren had, en op Jozef gebracht was, 1Ch 5:1, [zoveel de dubbele erfenis belangde] als de eerstgeborene der waardigste huisvrouw."},{"catchword":"Amorieten","tekst":"Hebr. des Amorieters. Hij stelde één volksnaam voor al de Kanaänieten, omdat de Amorieten een van de machtigste volken waren in het land Kanaän, gelijk blijkt Amo 2:9, alzo ook boven, Gen 15:16, en Jos 10:5."},{"catchword":"genomen heb","tekst":"Te weten, toen ik na den moord der Sichemieten [vrezende voor de naburige Kanaänieten] met gewapende hand op mijn hoede heb moeten wezen, om niet overvallen te worden. Dewijl nu God deze mijn zorg gezegend heeft, zendende een verschrikking over de omliggende inwoners, zo heb ik daar dat stuk lands behouden, hetwelk ik nu door Gods zegen houd het mijne te zijn in eigendom, gelijk het hierna uwen nakomelingen zal toebehoren in gebruik en bezitting. Of anders, nemen zal door het zwaard en den boog mijner nakomelingen."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Now it happened after they told Joseph behold thy father is sick and they took his two sons with him ] Manasseh and Ephraim."}],"2":[{"catchword":null,"tekst":"And they told Jacob and said behold thy son Joseph comes to thee so Israel strengthen himself and sate up in the bed."}],"3":[{"catchword":null,"tekst":"Then said Jacob to Joseph: God the almighty [see above chapter 17 on verse 1] appeared to me at Luz[otherwise called bethel see above chapter 28.19 and 36.6] in the land of Canaan and he blessed me [that is there renued and confirmed unto me the blessing promised to my father and grand father which is to go on still and t be delivered from hand to hand to our posterities.]"}],"4":[{"catchword":null,"tekst":"And he said to me behold I will make thee fruitful and multiply thee and set and settle thee on a heap of nations and I will give that land [viz. the land of Canaan ] to thy seed after thee for an everlasting possession [Heb. A possession of eternity that is during during all the time of the law as to the earthly Canaan but for times without end in regardof the heavenly see above chapter 13.15 and y of Ephrat which is Bethlehem."}],"8":[{"catchword":null,"tekst":"And Israel saw the sons of Joseph and said whose are these? [Jacobs sight was grown dim verse 10 so that casting his eyes upon his sons of Joseph he could not exactly discern and know who they were.]"}],"9":[{"catchword":null,"tekst":"And Joseph said to his father they are my sons whom god hath given me and he said bring them to me and I pray [Heb. Take them that is take them and bring them the word to take frequently used thus see above chapter 12 verse 15] that I may bless them [that is I may declare unto them the promises of God how he will bless them and confirm it to them [that is I may declare unto them the promises of God how he will bless them and confirm it to them with the laying of the hands upon them according to the manner of the patriarchs blessing see above chapter 27 on verse 4.]"}],"10":[{"catchword":null,"tekst":"Howbeit Israel&acirc;&euro;&trade;s eyes were heavy [that is dull and dim not able to discern distinctly ] of age he could not see[that is not well as verse 8] and he made them approach to him then he kissed them[see above chapter 27 on verse 26and embraced them [see above chapter 29 verse 13 and chapter 33.4.]"}],"11":[{"catchword":null,"tekst":"And Israel said to Joseph I have not thought to have seen your face but behold God hath made me be likewise see thy seed."}],"12":[{"catchword":null,"tekst":"Then Joseph made them go forth from his knees [viz. from Jacobs knees between which he held the youths embracing them but Joseph meant to place them orderly before him one by one that so that they may receive his blessing in the accustomed manner ] and he bowed his face before him down to the ground [shewing civil respect to his father an dreturning him thanks and honor for the affection testified to him and his.]"}],"13":[{"catchword":null,"tekst":"And Joseph took them both Ephraim in his right hand over against Israel&acirc;&euro;&trade;s left hand and Manasseh in his left h // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;

}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

    rij.className = 'vers'; rij.id = 'v' + n;

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle

// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}

function concordantieHtml(data) {

    data.weergaven.map(w => {

      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);

}
function bijbeluitlegHtml(n) {

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {

    return label + refChips(nd.refs) + kids;
  };

    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>

    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
