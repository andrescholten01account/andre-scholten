terrenkijkers, de Chaldeeën en de waarzeggers naar binnen zou brengen; en de koning antwoordde en zei tegen de wijzen van Babel: Elke man die dit schrift kan lezen, en mij de uitleg ervan bekend maakt, die zal met purper gekleed worden, met een gouden keten om zijn hals, en hij zal de derde heerser in dit koninkrijk zijn.", "Jak 4:1": "Waar komen strijd en ruzies onder u vandaan? Komen ze niet hieruit voort, namelijk uit uw lusten, die in uw leden strijd voeren?", "Jes 48:15": "Ik, Ik heb het gesproken, ook heb Ik hem geroepen; Ik zal hem doen komen, en hij zal voorspoedig zijn op zijn weg.", "Gen 31:18": "En hij voerde al zijn vee weg, en alle bezittingen die hij verworven had, het vee dat hij bezat, dat hij in Paddan-Aram verworven had, om te gaan naar Izak, zijn vader, naar het land Kanaän.", "Gen 50:17": "Zo moet u tot Jozef zeggen: Ach, vergeef toch de overtreding van uw broeders, en hun zonde; want zij hebben u kwaad aangedaan; maar nu, vergeef toch de overtreding van de dienaren van de God van uw vader! En Jozef weende toen zij tot hem spraken.", "Jes 40:1": "Troost, troost Mijn volk, zal uw God zeggen.", "Gal 5:15": "Maar als u elkaar bijt en verslindt, kijk dan uit dat u niet door elkaar verteerd wordt.", "Fil 1:16": "Dezen verkondigen Christus wel uit eigenbelang, niet zuiver, en menen aan mijn banden verdrukking toe te brengen;", "Jes 10:5-7": "Wee de Assyriër, die de roede van Mijn toorn is, en Mijn grimmigheid is een stok in hun hand! Ik zal hem zenden tegen een huichelachtig volk, en Ik zal hem bevel geven tegen het volk van Mijn verbolgenheid; opdat hij de roof rooft, en plundert de plundering, en het stelt ter vertreding, als het slijk van de straten. Hoewel hij het zo niet meent, en zijn hart zo niet denkt, maar hij zal in zijn hart hebben te verdelgen, en niet weinige volken uit te roeien.", "2 Sam 1:20": "Verkondigt het niet in Gath, verkondigt het niet op de straten van Askelon; opdat de dochters van de Filistijnen zich niet verblijden, opdat de dochters van de onbesnedenen niet opspringen van vreugde.", "Jes 28:1": "Wee de hoogmoedige kroon van de dronkaards van Efraïm, wiens heerlijke sieraad een verwelkende bloem is, die daar is op het hoofd van de zeer vruchtbare vallei, van hen die door de wijn geveld zijn.", "Joh 16:22": "En u hebt dan nu wel droefheid; maar Ik zal u opnieuw zien, en uw hart zal zich verblijden, en niemand zal uw blijdschap van u wegnemen.", "Job 29:24": "Lachte ik hun toe, zij geloofden het niet; en het licht van mijn aangezicht deden zij niet neervallen.", "Spr 13:22": "De goede zal zijn kindskinderen doen erven; maar het vermogen van de zondaar is voor de rechtvaardige weggelegd.", "Gen 39:23": "De leider van de gevangenis had geen omzien meer naar enig ding dat in zijn hand was, omdat de HEERE met hem was; en wat hij deed, dat deed de HEERE goed gedijen.", "2 Kron 30:4": "En deze zaak was goed in de ogen van de koning, en in de ogen van de hele gemeente.", "Ezech 7:4": "En Mijn oog zal u niet verschonen, en Ik zal niet sparen; maar Ik zal uw wegen op u brengen, en uw gruwelen zullen in het midden van u zijn, en u zult weten dat Ik de HEERE ben.", "Hand 7:13": "En de tweede keer werd Jozef aan zijn broers bekendgemaakt; en de afkomst van Jozef werd aan Farao bekend.", "1 Kor 4:6": "En deze dingen, broeders, heb ik op mijzelf en Apollos bij wijze van voorbeeld toegepast, om uwentwil; opdat u van ons zou leren niet te denken boven wat geschreven is, opdat u niet, de een om de ander, opgeblazen wordt tegen elkaar.", "Gen 16:6": "En Abram zei tegen Sarai: Zie, uw dienstmaagd is in uw hand; doe met haar wat goed is in uw ogen. En Sarai vernederde haar, en zij vluchtte van haar aangezicht.", "Est 1:21": "Dit woord nu vond de koning en de vorsten goed; en de koning deed naar het woord van Memuchan.", "Deut 19:21": "En uw oog zal niet ontzien; leven om leven, oog om oog, tand om tand, hand om hand, voet om voet.", "Richt 15:19": "Toen kloofde God de holle plaats die in Lechi is, en er kwam water uit, en hij dronk. Toen kwam zijn geest weer terug, en hij werd levend. Daarom noemde hij haar naam: De bron van de aanroeper, die in Lechi is, tot op deze dag.", "Fil 2:15": "Opdat u onberispelijk en oprecht mag zijn, kinderen van God, onstraffelijk te midden van een krom en verdraaid geslacht, onder wie u schijnt als lichten in de wereld;", "1 Sam 20:41": "Toen de jongen weg was, stond David op van de zuidzijde, en hij viel op zijn gezicht ter aarde, en boog zich driemaal; en zij kusten elkaar, en weenden met elkaar, totdat David het meest deed.", "Gen 42:25": "En Jozef gebood dat men hun zakken met koren vullen zou, en dat men hun geld terug zou geven, ieder in zijn zak, en dat men hun proviand zou geven voor onderweg; en men deed hun zo.", "Gen 46:28": "En hij stuurde Juda voor zich uit naar Jozef, om voor hem uit de weg te wijzen naar Gosen; en zij kwamen in het land Gosen.", "Ezech 20:17": "Doch Mijn oog spaarde hen, zodat Ik hen niet verdierf, en geen einde met hen maakte in de woestijn.", "Rom 2:8": "Maar hun die twistgierig zijn, en die de waarheid ongehoorzaam zijn, maar de ongerechtigheid gehoorzaam zijn, zal verbolgenheid en toorn vergolden worden;", "Job 5:23": "Want met de stenen van het veld zal uw verbond zijn, en het gedierte van het veld zal met u bevredigd zijn.", "Gen 46:29": "Toen spande Jozef zijn wagen aan, en trok op, zijn vader Israël tegemoet naar Gosen; en toen hij zich aan hem vertoonde, viel hij hem om zijn hals, en huilde lang aan zijn hals.", "Num 18:12": "Al het beste van de olie, en al het beste van de most, en van koren, hun eerstelingen, die zij de HEERE zullen geven, heb Ik u gegeven.", "Spr 26:21": "De dode kool is voor de vurige kool, en het hout voor het vuur; zo is een twistzieke man om ruzie aan te wakkeren.", "1 Sam 18:4": "En Jonathan deed zijn mantel af, die hij aan had, en gaf hem aan David, ook zijn kleren, ja, zelfs zijn zwaard, en zijn boog, en zijn gordel.", "Pred 4:6": "Een hand vol met rust is beter dan beide de vuisten vol met moeite en najagen van de wind.", "Ex 8:22": "En Ik zal op die dag het land Gosen, waarin Mijn volk woont, afzonderen, zodat daar geen vermenging van ongedierte is, opdat u weet dat Ik, de HEERE, in het midden van dit land ben.", "Matt 10:22": "En u zult door allen gehaat worden om Mijn Naam; maar wie volhardt tot het einde, die zal behouden worden.", "1 Kor 3:1": "En ik, broeders, kon tot u niet spreken als tot geestelijken, maar als tot vleselijken, als tot jonge kinderen in Christus.", "Gen 50:19-21": "En Jozef zei tot hen: Vreest niet; want ben ik in de plaats van God? U wel, u hebt kwaad tegen mij gedacht; doch God heeft dat ten goede gedacht; opdat Hij deed, zoals het op deze dag is, om een groot volk in het leven te behouden. Nu dan, vreest niet! Ik zal u en uw kleine kinderen onderhouden. Zo troostte hij hen, en sprak naar hun hart.", "Deut 23:5": "Doch de HEERE, uw God, heeft niet naar Bileam willen horen; maar de HEERE, uw God, heeft de vloek voor u in een zegen veranderd, omdat de HEERE, uw God, u liefhad.", "Matt 10:21": "En de ene broer zal de andere broer overleveren tot de dood, en de vader het kind, en de kinderen zullen opstaan tegen de ouders, en hen doden.", "Joz 7:11": "Israël heeft gezondigd; en zij hebben ook Mijn verbond, dat Ik hun geboden had, overtreden; en ook hebben zij van het verbannene genomen, en ook gestolen, en ook gelogen, en hebben het ook onder hun eigen spullen gelegd.", "2 Kor 13:11": "Verder, broeders, wees blij, wordt volmaakt, wees getroost, wees eensgezind, leef in vrede; en de God van de liefde en van de vrede zal met u zijn.", "Spr 29:22": "Een toornig man verwekt ruzie; en de driftige is overvloedig in overtreding.", "Jona 2:7": "Toen mijn ziel in mij overstelpt was, dacht ik aan de HEERE, en mijn gebed kwam tot U, in de tempel van Uw heiligheid.", "Ex 9:26": "Alleen in het land Gosen, waar de kinderen van Israël waren, daar was geen hagel.", "Richt 17:10": "Toen zei Micha tegen hem: Blijf bij mij, en wees mij tot een vader en tot een priester; en ik zal u jaarlijks tien zilverlingen geven, en een stel kleren, en uw levensonderhoud; zo ging de Leviet met hem mee.", "Gen 50:18": "Daarna kwamen ook zijn broeders, en vielen voor hem neder, en zeiden: Zie, wij zijn u tot knechten!", "Jer 51:20": "U bent Mij een voorhamer, en oorlogswapens; en door u zal Ik volken in stukken slaan, en door u zal Ik koninkrijken verderven.", "Spr 22:10": "Jaag de spotter weg, en het gekijf zal weggaan, en het geschil met de schande zal ophouden.", "Jak 4:15": "In plaats daarvan zou u moeten zeggen: Als de Heere het wil, en wij leven, zullen wij dit of dat doen.", "Gen 39:2": "En de HEERE was met Jozef, zodat hij een voorspoedig man was; en hij was in het huis van zijn heer, de Egyptenaar.", "Ps 34:15": "Samech. Wijk af van het kwaad, en doe het goede; zoek de vrede, en jaag die na.", "Fil 1:19": "Want ik weet dat dit mij ter zaligheid zal gedijen, door uw gebed en de toebrenging van de Geest van Jezus Christus.", "Ezra 6:22": "En zij hielden het feest van de ongezuurde broden zeven dagen, met blijdschap; want de HEERE had hen verblijd, en het hart van de koning van Assur naar hen toe gewend, om hun handen te sterken in het werk van het huis van God, de God van Israël.", "Ex 17:1": "Daarna trok de hele gemeenschap van de kinderen van Israël, volgens hun dagreizen, uit de woestijn Sin, op bevel van de HEERE, en zij legerden zich bij Rafidim. Daar was echter geen water voor het volk om te drinken.", "1 Sam 30:24": "Wie zou u toch in deze zaak horen? Want zoals het deel is van hen die mee de strijd in zijn getrokken, zo zal ook het deel zijn van hen die bij de spullen gebleven zijn; zij zullen gelijk delen.", "Gen 44:1": "En hij gebood degene die over zijn huis ging, en zei: Vul de zakken van deze mannen met voedsel, zoveel als zij kunnen dragen, en leg ieders geld in de mond van zijn zak;", "1 Kor 6:1-7": "Durft iemand van u, die een zaak heeft tegen een ander, voor de onrechtvaardigen naar de rechter gaan, en niet voor de heiligen? Weet u niet, dat de heiligen de wereld zullen oordelen? En als door u de wereld geoordeeld wordt, bent u dan onwaardig de kleinste rechtszaken te oordelen? Weet u niet, dat wij de engelen zullen oordelen? Hoeveel te meer de zaken die dit leven aangaan?", "Ps 105:21": "Hij zette hem tot een heer over zijn huis, en tot een heerser over al zijn goed;", "Est 2:4": "En de jonge dochter, die in de ogen van de koning mooi zal zijn, wordt koningin in de plaats van Vasthi. Deze zaak nu was goed in de ogen van de koning, en hij deed zo.", "Ex 16:3": "En de Israëlieten zeiden tegen hen: Was ons maar in Egypte gestorven door de hand van de HEERE, toen wij bij de vleespotten zaten, toen wij tot verzadiging brood aten! Want u hebt ons naar deze woestijn gebracht, om deze hele gemeente door honger te laten sterven.", "1 Sam 10:1": "Toen nam Samuël een oliekruik, en goot ze uit op zijn hoofd, en kuste hem, en zei: Is het niet zo, dat de HEERE u tot een voorganger over Zijn erfdeel gezalfd heeft?", "Hand 4:24-28": "En toen dezen dat hoorden, hieven zij eensgezind hun stem op tot God, en zeiden: Heere! U bent de God, Die de hemel gemaakt heeft, en de aarde, en de zee, en alle dingen die daarin zijn. Die door de mond van David, Uw knecht, gezegd hebt: Waarom woeden de heidenen, en hebben de volken zinloze dingen bedacht? De koningen van de aarde zijn samen opgestaan, en de leiders zijn bijeengebracht tegen de Heere, en tegen Zijn Gezalfde.", "Luk 12:51-53": "Denkt u dat Ik gekomen ben om vrede te geven op de aarde? Nee, zeg Ik u, maar eerder verdeeldheid. Want van nu af aan zullen er vijf in één huis verdeeld zijn, drie tegen twee, en twee tegen drie. De vader zal tegen de zoon verdeeld zijn, en de zoon tegen de vader; de moeder tegen de dochter, en de dochter tegen de moeder; de schoonmoeder tegen haar schoondochter, en de schoondochter tegen haar schoonmoeder.", "Jes 45:13": "Ik heb hem verwekt in gerechtigheid, en al zijn wegen zal Ik recht maken; hij zal Mijn stad bouwen, en hij zal Mijn gevangenen loslaten, niet voor prijs, en ook niet voor geschenk, zegt de HEERE van de heerscharen.", "Hand 7:26-29": "En de volgende dag liet hij zich aan hen zien, terwijl zij vochten; en hij drong hen tot vrede, en zei: Mannen, u bent broeders; waarom doet u elkaar onrecht aan? Maar die zijn naaste onrecht aandeed, stiet hem weg, en zei: Wie heeft u tot leider en rechter over ons gesteld? Wilt u mij ook ombrengen, zoals u gisteren de Egyptenaar hebt omgebracht?", "Joh 17:24": "Vader, Ik wil dat waar Ik ben, ook zij die bij Mij zijn, die U Mij gegeven hebt; opdat zij Mijn heerlijkheid mogen aanschouwen, die U Mij gegeven hebt; want U hebt Mij liefgehad, voor de grondlegging van de wereld.", "Ps 147:14": "Die uw grondgebied in vrede stelt; Hij verzadigt u met het beste van de tarwe.", "Rom 1:10": "altijd in mijn gebeden biddend, of het mij misschien nog op een gegeven moment door de wil van God gegeven zou worden om naar u te komen.", "Gen 44:2": "En mijn beker, de zilveren beker, moet u leggen in de mond van de zak van de jongste, met het geld van zijn koren. En hij deed naar Jozefs woord, dat hij gesproken had.", "Gen 50:19-25": "En Jozef zei tot hen: Vreest niet; want ben ik in de plaats van God? U wel, u hebt kwaad tegen mij gedacht; doch God heeft dat ten goede gedacht; opdat Hij deed, zoals het op deze dag is, om een groot volk in het leven te behouden. Nu dan, vreest niet! Ik zal u en uw kleine kinderen onderhouden. Zo troostte hij hen, en sprak naar hun hart.", "Ps 127:2": "Het is tevergeefs dat u vroeg opstaat, laat opblijft, brood eet met zorgen erbij; het is zo, dat Hij het aan hen die Hij liefheeft, geeft als in de slaap.", "Jes 54:16": "Zie, Ik heb de smid geschapen, die de kolen in het vuur opblaast, en die het instrument voortbrengt tot zijn werk; ook heb Ik de verderver geschapen om te vernielen.", "Hand 10:41": "niet aan al het volk, maar aan de getuigen die door God van tevoren uitgekozen waren, namelijk aan ons, die met Hem gegeten en gedronken hebben, nadat Hij uit de doden opgestaan was.", "Jes 2:4": "En Hij zal rechtspreken onder de heidenvolken, en bestraffen veel volken; en zij zullen hun zwaarden slaan tot spaden, en hun speren tot snoeimessen; het ene volk zal tegen het andere volk geen zwaard opheffen, en zij zullen geen oorlog meer leren.", "Mark 3:25": "En als een huis tegen zichzelf verdeeld is, kan dat huis niet standhouden.", "Fil 1:12": "En ik wil dat u weet, broeders, dat wat er met mij gebeurd is, meer tot bevordering van het Evangelie gekomen is;", "2 Sam 12:12": "Want u hebt het in het verborgene gedaan, maar Ik zal deze zaak doen voor heel Israël, en voor de zon.", "Joh 13:35": "Hieraan zullen allen weten dat u Mijn discipelen bent, als u liefde hebt onder elkaar.", "Gen 45:1-8": "Toen kon Jozef zich niet bedwingen voor allen die bij hem stonden, en hij riep: Laat iedereen bij mij weggaan! En er stond niemand bij hem, toen Jozef zich aan zijn broers bekend maakte. En hij verhief zijn stem met wenen, zodat de Egyptenaren het hoorden, en dat het huis van Farao het hoorde. En Jozef zei tegen zijn broers: Ik ben Jozef! Leeft mijn vader nog? En zijn broers konden hem niet antwoorden, want zij waren verschrikt voor zijn aangezicht.", "1 Sam 1:19": "En zij stonden 's morgens vroeg op, en zij aanbaden voor het aangezicht van de HEERE, en zij keerden terug, en kwamen bij hun huis te Rama. En Elkana had gemeenschap met zijn vrouw Hanna, en de HEERE dacht aan haar.", "Est 7:10": "Zo hingen zij Haman aan de galg, die hij voor Mordechai had laten maken; en de grimmigheid van de koning werd gestild.", "Rom 8:28": "En wij weten dat voor hen die God liefhebben, alle dingen meewerken ten goede, namelijk voor hen die naar Zijn voornemen geroepen zijn.", "1 Tim 6:20": "O Timotheüs, bewaar het pand dat u toevertrouwd is, en keer u af van het ongoddelijk zinloos gepraat en van de tegenstellingen van de ten onrechte zo genoemde wetenschap;", "Hand 2:24": "Hem heeft God opgewekt, want Hij ontbond de smarten van de dood, omdat het niet mogelijk was dat Hij daardoor vastgehouden zou worden.", "Matt 24:17": "wie op het dak is, moet niet naar beneden komen om iets uit zijn huis weg te nemen;", "Ezech 29:20": "Als zijn arbeidsloon, omdat hij tegen haar gediend heeft, heb Ik hem Egypteland gegeven, omdat zij voor Mij gewerkt hebben, spreekt de Heere HEERE.", "Zach 8:19": "Zo zegt de HEERE van de heerscharen: Het vasten van de vierde, en het vasten van de vijfde, en het vasten van de zevende, en het vasten van de tiende maand, zal voor het huis van Juda tot vreugde, en tot blijdschap, en tot vrolijke hoogtijden wezen; heb dan de waarheid en de vrede lief.", "Spr 21:1": "Het hart van de koning is in de hand van de HEERE als waterbeken. Hij neigt het tot alles wat Hij wil.", "Gen 13:8": "En Abram zei tegen Lot: Laat er toch geen twist zijn tussen mij en u, en tussen mijn herders en uw herders; want wij zijn broeders.", "Hand 7:35": "Deze Mozes, die zij verloochend hadden door te zeggen: Wie heeft u tot leider en rechter gesteld? — deze heeft God tot leider en verlosser gezonden, door de hand van de engel die hem verschenen was in de doornstruik.", "Rom 16:17": "En ik bid u, broeders, let op degenen die tweedracht en ergernissen veroorzaken, tegen de leer die u geleerd hebt; en blijf bij hen vandaan.", "Luk 5:8": "Toen Simon Petrus dat zag, viel hij neer aan de knieën van Jezus en zei: Heere, ga weg van mij, want ik ben een zondig mens.", "Job 4:5": "maar nu komt het aan bij u, en u bent verdrietig; het raakt tot u, en u wordt beroerd.", "Gen 45:1-15": "Toen kon Jozef zich niet bedwingen voor allen die bij hem stonden, en hij riep: Laat iedereen bij mij weggaan! En er stond niemand bij hem, toen Jozef zich aan zijn broers bekend maakte. En hij verhief zijn stem met wenen, zodat de Egyptenaren het hoorden, en dat het huis van Farao het hoorde. En Jozef zei tegen zijn broers: Ik ben Jozef! Leeft mijn vader nog? En zijn broers konden hem niet antwoorden, want zij waren verschrikt voor zijn aangezicht.", "Spr 21:19": "Het is beter te wonen in een woest land, dan bij een zeer kijfachtige en toornige vrouw.", "Ps 133:1-3": "Een lied Hammaäloth, van David. Zie, hoe goed en hoe fijn is het, dat broeders ook samenwonen! Het is als de kostelijke olie op het hoofd, die neerdaalt op de baard, de baard van Aäron, die neerdaalt tot op de zoom van zijn kleren. Het is als de dauw van Hermon, en die neerdaalt op de bergen van Sion, want de HEERE gebiedt daar de zegen en het leven tot in eeuwigheid.", "Jes 45:7": "Ik vorm het licht, en schep de duisternis; Ik maak de vrede en schep het kwaad, Ik, de HEERE, doe al deze dingen.", "Jes 42:14": "Ik heb van oudsher gezwegen, Ik heb Mij stil gehouden en Mij ingehouden; Ik zal uitschreeuwen als een barende vrouw, Ik zal ze verwoesten en tegelijk opslokken.", "Jes 45:1-6": "Zo zegt de HEERE tegen Zijn gezalfde, tegen Kores, wiens rechterhand Ik vastheb, om de volken voor zijn aangezicht neer te werpen; en Ik zal de lendenen van de koningen ontbinden, om voor zijn aangezicht de deuren te openen, en de poorten zullen niet gesloten worden: Ik zal voor uw aangezicht gaan, en Ik zal de kromme wegen recht maken; de koperen deuren zal Ik verbreken, en de ijzeren grendels zal Ik in stukken slaan. En Ik zal u de schatten geven die in de duisternissen zijn, en de verborgen rijkdommen; opdat u weet dat Ik de HEERE ben, Die u bij uw naam roept, de God van Israël;", "Luk 24:38": "En Hij zei tegen hen: Waarom bent u ontsteld, en waarom komen zulke overleggingen op in uw hart?", "Fil 2:14": "Doe alle dingen zonder murmureren en tegenspreken;", "Spr 20:3": "Het is eer voor een man, om van twist af te blijven; maar iedere dwaas zal zich erin mengen."}, "noten": {}, "koppeling": {"1": "<span class=\"wl\" data-l=\"L1\" data-code=\"H3201\">Toen</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H3201\">kon</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H3130\">Jozef</span> <span n> by him; and he <span class=\"wl wl-kjv\" data-code=\"H7121\">cried,</span> <span class=\"wl wl-kjv\" data-code=\"H3318\">Cause</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> to go <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> from me. And there <span class=\"wl wl-kjv\" data-code=\"H5975\">stood</span> no <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> with him, while <span class=\"wl wl-kjv\" data-code=\"H3130\">Joseph</span> made himself <span class=\"wl wl-kjv\" data-code=\"H3045\">known</span> unto his brethren.", "2": "And he <span class=\"wl wl-kjv\" data-code=\"H6963\">wept</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">aloud:</span> and the <span class=\"wl wl-kjv\" data-code=\"H4714\">Egyptians</span> and the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">heard.</span>", "3": "And <span class=\"wl wl-kjv\" data-code=\"H3130\">Joseph</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto his <span class=\"wl wl-kjv\" data-code=\"H251\">brethren,</span> I am <span class=\"wl wl-kjv\" data-code=\"H3130\">Joseph;</span> doth my <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> yet <span class=\"wl wl-kjv\" data-code=\"H2416\">live?</span> And his <span class=\"wl wl-kjv\" data-code=\"H251\">brethren</span> <span class=\"wl wl-kjv\" data-code=\"H3201\">could</span> not <span class=\"wl wl-kjv\" data-code=\"H6030\">answer</span> him; for they were <span class=\"wl wl-kjv\" data-code=\"H926\">troubled</span> at his presence.", "4": "And <span class=\"wl wl-kjv\" data-code=\"H3130\">Joseph</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto his <span class=\"wl wl-kjv\" data-code=\"H251\">brethren,</span> Come <span class=\"wl wl-kjv\" data-code=\"H5066\">near</span> to me, I pray you. And they came <span class=\"wl wl-kjv\" data-code=\"H5066\">near.</span> And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> I am <span class=\"wl wl-kjv\" data-code=\"H3130\">Joseph</span> your <span class=\"wl wl-kjv\" data-code=\"H251\">brother,</span> whom ye <span class=\"wl wl-kjv\" data-code=\"H4376\">sold</span> into Egypt.", "5": "Now therefore be not <span class=\"wl wl-kjv\" data-code=\"H6087\">grieved,</span> nor <span class=\"wl wl-kjv\" data-code=\"H2734\">angry</span> with <span class=\"wl wl-kjv\" data-code=\"H5869\">yourselves,</span> that ye <span class=\"wl wl-kjv\" data-code=\"H4376\">sold</span> me hither: for <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> did <span class=\"wl wl-kjv\" data-code=\"H7971\">send</span> me before <span class=\"wl wl-kjv\" data-code=\"H6440\">you</span> to preserve life.", "6": "For these two <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> hath the <span class=\"wl wl-kjv\" data-code=\"H7458\">famine</span> been <span class=\"wl wl-kjv\" data-code=\"H7130\">in</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">land:</span> and yet there are <span class=\"wl wl-kjv\" data-code=\"H2568\">five</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years,</span> in the which there shall <span class=\"wl wl-kjv\" data-code=\"H369\">neither</span> be <span class=\"wl wl-kjv\" data-code=\"H2758\">earing</span> nor harvest.", "7": "And <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> me before <span class=\"wl wl-kjv\" data-code=\"H6440\">you</span> to <span class=\"wl wl-kjv\" data-code=\"H7760\">preserve</span> you a <span class=\"wl wl-kjv\" data-code=\"H7611\">posterity</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">earth,</span> and to save your <span class=\"wl wl-kjv\" data-code=\"H2421\">lives</span> by a <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> deliverance.", "8": "So now it was not you that <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> me hither, but <span class=\"wl wl-kjv\" data-code=\"H430\">God:</span> and he hath <span class=\"wl wl-kjv\" data-code=\"H7760\">made</span> me a <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> to <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh,</span> and <span class=\"wl wl-kjv\" data-code=\"H113\">lord</span> of all his <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> and a <span class=\"wl wl-kjv\" data-code=\"H4910\">ruler</span> throughout all the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of Egypt.", "9": "<span class=\"wl wl-kjv\" data-code=\"H4116\">Haste</span> ye, and go <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> to my <span class=\"wl wl-kjv\" data-code=\"H1\">father,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> unto him, Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> thy <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> <span class=\"wl wl-kjv\" data-code=\"H3130\">Joseph,</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> hath <span class=\"wl wl-kjv\" data-code=\"H7760\">made</span> me <span class=\"wl wl-kjv\" data-code=\"H113\">lord</span> of all <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt:</span> come <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> unto me, tarry", "10": "And thou shalt <span class=\"wl wl-kjv\" data-code=\"H3427\">dwell</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H1657\">Goshen,</span> and thou shalt be <span class=\"wl wl-kjv\" data-code=\"H7138\">near</span> unto me, thou, and thy <span class=\"wl wl-kjv\" data-code=\"H1121\">children,</span> and thy <span class=\"wl wl-kjv\" data-code=\"H1121\">children's</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">children,</span> and thy <span class=\"wl wl-kjv\" data-code=\"H6629\">flocks,</span> and thy herds,", "11": "And there will I <span class=\"wl wl-kjv\" data-code=\"H3557\">nourish</span> th /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],

).join('');

function paneelInhoud(n, tab) {

    }
    if (engels && engels.length) {

  }

  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.tsk[n] && D.tsk[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vergelijk</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}
</script>
</body>
</html>
