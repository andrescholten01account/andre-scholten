gt uw zoon Jozef: God heeft mij tot een heer over heel Egypte gesteld; kom af naar mij, en wacht niet.", "10": "En u zult in het land Gosen wonen, en dicht bij mij zijn, u en uw zonen, en de zonen van uw zonen, en uw schapen, en uw runderen, en alles wat u hebt.", "11": "En ik zal u daar onderhouden; want er zullen nog vijf jaren van de honger zijn, opdat u niet verarmt, u en uw huis, en alles wat u hebt!", "12": "En zie, uw ogen zien het, en de ogen van mijn broer Benjamin, dat mijn mond tot u spreekt.", "13": "En bericht mijn vader over al mijn heerlijkheid in Egypte, en alles wat u gezien hebt; en haast u, en breng mijn vader hierheen af.", "14": "En hij viel om de hals van Benjamin, zijn broer, en weende; en Benjamin weende om zijn hals.", "15": "En hij kuste al zijn broers, en hij weende over hen; en daarna spraken zijn broers met hem.", "16": "Toen dit gerucht in het huis van Farao gehoord werd, dat men zei: Jozefs broers zijn gekomen! was het goed in de ogen van Farao, en in de ogen van zijn dienaren.", "17": "En Farao zei tegen Jozef: Zeg tegen uw broers: Doe dit, laad uw dieren, en trek heen, ga naar het land Kanaän;", "18": "En neem uw vader en uw huisgezinnen, en kom naar mij, en ik zal u het beste van Egypteland geven, en u zult het vette van dit land eten.", "19": "U bent toch gelast: doe dit, neem u uit Egypteland wagens voor uw kinderen, en voor uw vrouwen, en breng uw vader, en kom.", "20": "En laat uw oog uw huisraad niet verschonen; want het beste van heel Egypteland, dat zal het uwe zijn.", "21": "En de zonen van Israël deden zo. Zo gaf Jozef hun wagens, naar Farao's bevel; ook gaf hij hun voedsel voor onderweg.", "22": "Hij gaf hun allen, ieder een, stellen kleren; maar Benjamin gaf hij driehonderd zilverlingen, en vijf stellen kleren.", "23": "En zijn vader zond hij evenzo tien ezels, dragende van het beste van Egypte, en tien ezelinnen, dragende koren, en brood, en voedsel voor zijn vader op de weg.", "24": "En hij zond zijn broers heen; en zij vertrokken; en hij zei tegen hen: Maak geen ruzie op de weg.", "25": "En zij trokken op uit Egypte, en zij kwamen in het land Kanaän tot hun vader Jakob.", "26": "Toen berichtten zij hem, en zeiden: Jozef leeft nog, ja, hij is ook regeerder in heel Egypteland! Toen bezweek zijn hart, want hij geloofde hen niet.", "27": "Maar toen zij tot hem gesproken hadden al de woorden van Jozef, die hij tot hen gesproken had, en dat hij de wagens zag, die Jozef gezonden had om hem te vervoeren, toen werd de geest van Jakob, hun vader, levendig.", "28": "En Israël zei: Het is genoeg! Mijn zoon Jozef leeft nog! Ik zal gaan, en hem zien, voordat ik sterf!"}, "SV": {"1": "Toen kon zich Jozef niet bedwingen voor allen, die bij hem stonden, en hij riep: Doet alle man van mij uitgaan! En er stond niemand bij hem, als Jozef zich aan zijn broederen bekend maakte.", "2": "En hij verhief zijn stem met wenen, zodat het de Egyptenaren hoorden, en dat het Farao’s huis hoorde.", "3": "En Jozef zeide tot zijn broederen: Ik ben Jozef! leeft mijn vader nog? En zijn broeders konden hem niet antwoorden; want zij waren verschrikt voor zijn aangezicht.", "4": "En Jozef zeide tot zijn broederen: Nadert toch tot mij! En zij naderden. Toen zeide hij: Ik ben Jozef, uw broeder, dien gij naar Egypte verkocht hebt.", "5": "Maar nu, weest niet bekommerd, en *de* *toorn* ontsteke niet in uw ogen, omdat gij mij hierheen verkocht hebt; want God heeft mij voor uw aangezicht gezonden, tot behoudenis des levens.", "6": "Want het zijn nu twee jaren des hongers in het midden des lands; en er zijn nog vijf jaren, in welke geen ploeging noch oogst zijn zal.", "7": "Doch God heeft mij voor uw aangezicht henen gezonden, om u een overblijfsel te stellen op de aarde, en om u bij het leven te behouden, door een grote verlossing.", "8": "Nu dan, gij hebt mij herwaarts niet gezonden, maar God Zelf, Die mij tot Farao’s vader gesteld heeft, en tot een heer over zijn ganse huis, en regeerder in het ganse land van Egypte.", "9": "Haast u en trekt op tot mijn vader, en zegt het hem: Alzo zegt uw zoon Jozef: God heeft mij tot een heer over gans Egypteland gesteld; kom af tot mij, en vertoef niet.", "10": "En gij zult in het land Gosen wonen, en nabij mij wezen, gij en uw zonen, en de zonen uwer zonen, en uw schapen, en uw runderen, en al wat gij hebt.", "11": "En ik zal u aldaar onderhouden; want er zullen nog vijf jaren des hongers zijn, opdat gij niet verarmt, gij en uw huis, en alles wat gij hebt!", "12": "En ziet, uw ogen zien het, en de ogen van mijn broeder Benjamin, dat mijn mond tot u spreekt.", "13": "En boodschapt mijn vader al mijn heerlijkheid in Egypte, en alles wat gij gezien hebt; en haast u, en brengt mijn vader herwaarts af.", "14": "En hij viel aan den hals van Benjamin, zijn broeder, en weende; en Benjamin weende aan zijn hals.", "15": "En hij kuste al zijn broederen, en hij weende over hen; en daarna spraken zijn broeders met hem.", "16": "Als dit gerucht in het huis van Farao gehoord werd, dat men zeide: Jozefs broeders zijn gekomen! was het goed in de ogen van Farao, en in de ogen van zijn knechten.", "17": "En Farao zeide tot Jozef: Zeg tot uw broederen: Doet dit, laadt uw beesten, en trekt heen, gaat naar het land Kanaän;", "18": "En neemt uw vader en uw huisgezinnen, en komt tot mij, en ik zal u het beste van Egypteland geven, en gij zult het vette dezes lands eten.", "19": "Gij zijt toch gelast: doet dit, neemt u uit Egypteland wagenen voor uw kinderkens, en voor uw vrouwen, en voert uw vader, en komt.", "20": "En uw oog verschone uw huisraad niet; want het beste van gans Egypteland, dat zal het uwe zijn.", "21": "En de zonen van Israël deden alzo. Zo gaf Jozef hun wagenen, naar Farao’s bevel; ook gaf hij hun teerkost op den weg.", "22": "Hij gaf hun allen, ieder een, wisselklederen; maar Benjamin gaf hij driehonderd zilverlingen, en vijf wisselklederen.", "23": "En zijn vader desgelijks zond hij tien ezelen, dragende van het beste van Egypte, en tien ezelinnen, dragende koren, en brood, en spijze voor zijn vader op den weg.", "24": "En hij zond zijn broeders heen; en zij vertrokken; en hij zeide tot hen: Verstoort u niet op den weg.", "25": "En zij trokken op uit Egypte, en zij kwamen in het land Kanaän tot hun vader Jakob.", "26": "Toen boodschapten zij hem, zeggende: Jozef leeft nog, ja, ook is hij regeerder in gans Egypteland! Toen bezweek zijn hart, want hij geloofde hen niet.", "27": "Maar als zij tot hem gesproken hadden al de woorden van Jozef, die hij tot hen gesproken had, en dat hij de wagenen zag, die Jozef gezonden had om hem te voeren, zo werd de geest van Jakob hun vader, levendig.", "28": "En Israël zeide: Het is genoeg! mijn zoon Jozef leeft nog! ik zal gaan, en hem zien, eer ik sterve!"}, "KJV": {"1": "Then Joseph could not refrain himself before all them that stood by him; and he cried, Cause every man to go out from me. And there stood no man with him, while Joseph made himself known unto his brethren.", "2": "And he wept aloud: and the Egyptians and the house of Pharaoh heard.", "3": "And Joseph said unto his brethren, I *am* Joseph; doth my father yet live? And his brethren could not answer him; for they were troubled at his presence.", "4": "And Joseph said unto his brethren, Come near to me, I pray you. And they came near. And he said, I *am* Joseph your brother, whom ye sold into Egypt.", "5": "Now therefore be not grieved, nor angry with yourselves, that ye sold me hither: for God did send me before you to preserve life.", "6": "For these two years *hath* the famine *been* in the land: and yet *there are* five years, in the which *there shall* neither *be* earing nor harvest.", "7": "And God sent me before you to preserve you a posterity in the earth, and to save your lives by a great deliverance.", "8": "So now *it was* not you *that* sent me hither, but God: and he hath made me a father to Pharaoh, and lord of all his house, and a ruler throughout all the land of Egypt.", "9": "Haste ye, and go up to my father, and say unto him, Thus saith thy son Joseph, God hath made me lord of all Egypt: come down unto me, tarry", "10": "And thou shalt dwell in the land of Goshen, and thou shalt be near unto me, thou, and thy children, and thy children's children, and thy flocks, and thy herds,", "11": "And there will I nourish thee; for yet *there are* five years of famine; lest thou, and thy household, and all that thou hast, come to poverty.", "12": "And, behold, your eyes see, and the eyes of my brother Benjamin, that *it is* my mouth that speaketh", "13": "And ye shall tell my father of all my glory in Egypt, and of all that ye have seen; and ye shall haste and bring down my father", "14": "And he fell upon his brother Benjamin's neck, and wept; and Benjamin wept upon his neck.", "15": "Moreover he kissed all his brethren, and wept upon them: and after that his brethren talked", "16": "And the fame thereof was heard in Pharaoh's house, saying, Joseph's brethren are come: and it pleased Pharaoh well, and his servants.", "17": "And Pharaoh said unto Joseph, Say unto thy brethren, This do ye; lade your beasts, and go, get you unto the land of Canaan;", "18": "And take your father and your households, and come unto me: and I will give you the good of the land of Egypt, and ye shall eat the fat of the land.", "19": "Now thou art commanded, this do ye; take you wagons out of the land of Egypt for your little ones, and for your wives, and bring your father, and come.", "20": "Also regard not your stuff; for the good of all the land of Egypt", "21": "And the children of Israel did so: and Joseph gave them wagons, according to the commandment of Pharaoh, and gave them provision for the way.", "22": "To all of them he gave each man changes of raiment; but to Benjamin he gave three hundred *pieces* of silver, and five changes of raiment.", "23": "And to his father he sent after this *manner*; ten asses laden with the good things of Egypt, and ten she asses laden with corn and bread and meat for his father by the way.", "24": "So he sent his brethren away, and they departed: and he said unto them, See that ye fall not out by the way.", "25": "And they went up out of Egypt, and came into the land of Canaan unto Jacob their father,", "26": "And told him, saying, Joseph *is* yet alive, and he *is* governor over all the land of Egypt. And Jacob's heart fainted, for he believed", "27": "And they told him all the words of Joseph, which he had said unto them: and when he saw the wagons which Joseph had sent to carry him, the spirit of Jacob their father revived:", "28": "And Israel said, *It is* enough; Joseph my son *is* yet alive: I will go and see him before I die."}}, "tsk": {"1": [{"kopje": "kon niet", "refs": ["Gen 43:30", "Gen 43:31", "Jes 42:14", "Jer 20:9"]}, {"kopje": "Laat", "refs": ["2 Sam 1:20", "Matt 18:15", "Hand 10:41", "1 Kor 13:5"]}], "2": [{"kopje": "verhief zijn stem met wenen", "refs": ["Num 14:1", "Ruth 1:9", "2 Kon 20:3", "Hand 20:37"]}], "3": [{"kopje": "Ik ben Jozef", "refs": ["Matt 14:27", "Hand 7:13", "Hand 9:5"]}, {"kopje": "want zij", "refs": ["Job 4:5", "Job 23:15", "Zach 12:10", "Matt 14:26", "Mark 6:50", "Luk 5:8", "Luk 24:37", "Luk 24:38", "Openb 1:7"]}], "4": [{"kopje": "Ik ben Jozef", "refs": ["Gen 37:28", "Gen 50:18", "Matt 14:27", "Hand 9:5"]}], "5": [{"kopje": "weest niet bekommerd", "refs": ["Jes 40:1", "Jes 40:2", "Luk 23:34", "2 Kor 2:7", "2 Kor 2:11"]}, {"kopje": "God", "refs": ["Gen 45:7", "Gen 45:8", "Gen 47:25", "Gen 50:20", "1 Sam 1:19", "2 Sam 12:12", "2 Sam 16:10-12", "2 Sam 17:14", "Job 1:21", "Ps 105:16", "Ps 105:17", "Hand 2:23", "Hand 2:24", "Hand 4:24-28", "Hand 7:9-15"]}], "6": [{"kopje": "twee jaren", "refs": ["Gen 41:29-31", "Gen 41:54", "Gen 41:56", "Gen 47:18"]}, {"kopje": "ploeging", "refs": ["Gen 47:23", "Ex 34:21", "Deut 21:4", "1 Sam 8:12", "Jes 30:24"]}], "7": [{"kopje": "om u een overblijfsel te stellen", "refs": ["Richt 15:18", "1 Kron 11:14", "Ps 18:51", "Ps 44:5", "Hand 7:35"]}], " "../../nave/w/#t-wagon", "kinderen": [{"label": "General scriptures concerning", "href": "../../nave/w/?hl=Gen.45.27#i21532", "refs": [{"disp": "Gen 45:19", "href": "../../genesis/45/#v19", "ref": "Gen 45:19", "svLabel": null}, {"disp": "Gen 45:27", "href": "../../genesis/45/#v27", "ref": "Gen 45:27", "svLabel": null}, {"disp": "Num 7:3-9", "href": "../../numeri/7/#v3", "ref": "Num 7:3-9", "svLabel": null}], "kinderen": []}]}]}}, "extern": {"Ps 85:7": "Zult U ons niet weer levend maken, opdat Uw volk zich in U verblijdt?", "Jes 49:1": "Hoort naar Mij, eilanden! En luistert toe, volken van verre! De HEERE heeft Mij geroepen van de buik af, van het ingewand van Mijn moeder af heeft Hij Mijn Naam vermeld.", "Richt 14:12": "Simson dan zei tegen hen: Ik zal u nu een raadsel te raden geven; als u het mij in de zeven dagen van deze bruiloft goed kunt verklaren en uitvinden, dan zal ik u dertig stel linnen kleren geven, en dertig stellen (extra) kleren.", "Rom 12:18": "Als het mogelijk is, houd voor zover het van u afhangt vrede met alle mensen.", "Hand 3:17": "En nu, broeders, ik weet dat u het door onwetendheid hebt gedaan, zoals ook uw leiders.", "Luk 24:34": "die zeiden: De Heere is werkelijk opgestaan, en is aan Simon verschenen.", "Gen 42:22": "En Ruben antwoordde hun en zei: Heb ik het niet tegen u gezegd toen ik zei: Zondig niet tegen deze jongen! Maar u hoorde niet; en ook zijn bloed, zie, het wordt opgeëist!", "Ezra 5:5": "Doch het oog van hun God was over de oudsten van de Joden, zodat men hen niet kon tegenhouden, totdat de zaak bij Darius kwam, en zij daarna daarover een brief terugbrachten.", "Jak 3:18": "En de vrucht van de gerechtigheid wordt in vrede gezaaid voor hen die vrede stichten.", "Ps 75:8": "Maar God is Rechter; Hij vernedert deze, en verhoogt die.", "Openb 1:7": "Zie, Hij komt met de wolken en elk oog zal Hem zien, ook zij die Hem doorstoken hebben; en alle geslachten van de aarde zullen over Hem rouw bedrijven; ja, amen.", "Gen 44:28": "En de één is bij mij weggegaan, en ik heb gezegd: Voorzeker, hij is zeker verscheurd! En ik heb hem niet meer gezien tot nu toe.", "Hand 20:37": "En er ontstond een groot geween bij hen allen; en zij vielen Paulus om de hals en kusten hem;", "Jes 8:10": "Beraadslaag een plan, toch zal het vernietigd worden; spreek een woord, toch zal het niet standhouden; want God is met ons!", "Joh 16:21": "Een vrouw heeft droefheid wanneer zij baart, omdat haar tijd gekomen is; maar wanneer zij het kind gebaard heeft, denkt zij niet meer aan de benauwdheid, vanwege de blijdschap dat er een mens ter wereld geboren is.", "Jer 29:7": "En zoekt de vrede van de stad waarheen Ik u gevankelijk heb laten wegvoeren, en bidt voor haar tot de HEERE; want in haar vrede zult u vrede hebben.", "Ezech 29:19": "Daarom, zo zegt de Heere HEERE: Zie, Ik zal Nebukadrezar, de koning van Babel, Egypteland geven; en hij zal haar menigte wegvoeren, en haar buit buitmaken, en haar roof roven, en het zal het loon zijn voor zijn leger.", "Spr 17:1": "Een droge bete brood, en rust daarbij, is beter, dan een huis vol geslachte beesten met twist.", "Hand 6:5": "En dit voorstel beviel de hele menigte; en zij kozen Stefanus, een man vol van het geloof en van de Heilige Geest, en Filippus, en Prochorus, en Nicanor, en Timon, en Parmenas, en Nicolaus, een proseliet uit Antiochië;", "Ps 17:14": "Met Uw hand van de mensen, o HEERE! Van de mensen, die van de wereld zijn, wier deel in dit leven is, wier buik U vult met Uw verborgen schat; de kinderen worden verzadigd, en zij laten hun overschot achter aan hun kinderen.", "Spr 18:6": "De lippen van de dwaas komen in twist, en zijn mond roept om slagen.", "2 Sam 17:14": "Toen zeiden Absalom en alle mannen van Israël: De raad van Husai, de Archiet, is beter dan de raad van Achitofel. Doch de HEERE had het zo bepaald, om de goede raad van Achitofel te vernietigen, opdat de HEERE het kwaad over Absalom zou brengen.", "Gen 34:18": "En hun woorden waren goed in de ogen van Hemor, en in de ogen van Sichem, Hemors zoon.", "Joh 13:34": "Een nieuw gebod geef Ik u, dat u elkaar liefhebt; zoals Ik u liefgehad heb, dat u ook elkaar liefhebt.", "2 Kor 2:11": "opdat de satan geen voordeel over ons krijgt; want zijn gedachten zijn ons niet onbekend.", "Job 9:16": "Al zou ik roepen en Hij mij antwoorden, ik zou niet geloven dat Hij mijn stem ter ore genomen heeft.", "Gen 43:30": "En Jozef haastte zich; want zijn hart werd bewogen om zijn broer, en hij zocht een plek om te wenen; en hij ging een kamer in, en weende daar.", "Ps 55:10": "Verslind hen, Heere! verdeel hun tong; want ik zie geweld en twist in de stad.", "Ps 105:17-22": "Hij zond een man voor hun aangezicht heen; Jozef werd verkocht tot een slaaf. Men drukte zijn voeten in de stok; zijn persoon kwam in de ijzers. Tot de tijd toe dat Zijn woord kwam, heeft de rede van de HEERE hem doorlouterd.", "Ps 44:5": "U Zelf bent mijn Koning, o God! Gebied de verlossingen van Jakob.", "Gen 46:30": "En Israël zei tegen Jozef: Laat mij nu sterven, nadat ik uw gezicht gezien heb, omdat u nog leeft!", "Gen 41:16": "En Jozef antwoordde Farao: Het is niet aan mij! God zal Farao welzijn aanzeggen.", "Gen 50:20": "U wel, u hebt kwaad tegen mij gedacht; doch God heeft dat ten goede gedacht; opdat Hij deed, zoals het op deze dag is, om een groot volk in het leven te behouden.", "2 Kron 36:23": "Zo zegt Kores, koning van Perzië: De HEERE, de God van de hemel, heeft mij alle koninkrijken van de aarde gegeven; en Hij heeft mij bevolen Hem een huis te bouwen te Jeruzalem, dat in Juda is; wie is er onder u van al Zijn volk? De HEERE, zijn God, zij met hem, en hij trekt op.", "Gen 37:22": "Ook zei Ruben tegen hen: Vergiet geen bloed; werpt hem in deze kuil die in de woestijn is, en legt de hand niet aan hem; opdat hij hem uit hun hand zou verlossen, om hem tot zijn vader terug te brengen.", "Gen 27:28": "Zo geeft God u dan van de dauw van de hemel, en van de vettigheid van de aarde, en overvloed van koren en most.", "Rom 16:18": "Want zulke mensen dienen onze Heere Jezus Christus niet, maar hun eigen buik; en zij verleiden door schoonspreken en prijzen de harten van de eenvoudigen.", "Pred 2:26": "Want Hij geeft wijsheid, kennis en vreugde aan de mens die goed is voor Zijn aangezicht; maar aan de zondaar geeft Hij de bezigheid om te verzamelen en te vergaderen, opdat Hij het geeft aan wie goed is voor Gods aangezicht. Dit is ook ijdelheid en kwelling van de geest.", "Deut 32:14": "Boter van koeien, en melk van klein vee, met het vet van de lammeren en van de rammen, die in Basan weiden, en van de bokken, met het vette van de nieren van tarwe; en het druivenbloed, reine wijn, hebt u gedronken.", "Spr 3:20": "Door Zijn kennis zijn de afgronden gekloofd, en de wolken druipen dauw.", "Rom 13:13": "Laten wij, als bij daglicht, eerbaar wandelen; niet in bras­partijen en dronkenschappen, niet in ontucht en losbandigheid, niet in twist en jaloezie;", "Jes 30:24": "En de ossen, en ezelveulens, die het land bewerken, zullen zuiver voeder eten, dat verschud is met de werpschoffel en met de wan.", "Gen 29:11": "En Jakob kuste Rachel; en hij verhief zijn stem en huilde.", "2 Kron 35:16": "Zo werd de hele dienst van de HEERE op dezelfde dag geregeld, om pascha te houden, en brandoffers op het altaar van de HEERE te offeren, naar het gebod van koning Josia.", "Spr 28:8": "Wie zijn bezit vermeerdert met woeker en met overwinst, verzamelt dat voor hem die zich over de arme ontfermt.", "Deut 19:13": "Uw oog zal hem niet ontzien; maar u zult het bloed van de onschuldige uit Israël wegdoen, opdat het u goed gaat.", "Spr 27:15": "Een aanhoudend druppelen op een dag van slagregen en een twistzieke huisvrouw zijn precies gelijk.", "Hand 9:5": "En hij zei: Wie bent U, Heere? En de Heere zei: Ik ben Jezus, Die u vervolgt. Het is u hard, de hielen tegen de prikkels te slaan.", "Gen 47:25": "En zij zeiden: U hebt ons leven gered; laten wij genade vinden in de ogen van mijn heer, en wij zullen knechten van Farao zijn.", "Ps 105:17": "Hij zond een man voor hun aangezicht heen; Jozef werd verkocht tot een slaaf.", "Matt 5:9": "Zalig zijn de vreedzamen, want zij zullen kinderen van God genoemd worden.", "Gen 48:11": "En Israël zei tegen Jozef: Ik had niet gedacht uw gezicht te zien; maar zie, God heeft mij ook uw nageslacht laten zien!", "Filem 1:1": "Paulus, een gevangene van Christus Jezus, en Timotheüs, de broeder, aan Filemon, de geliefde, en onze medearbeider,", "Rom 9:16": "Zo hangt het dan niet af van hem die wil, ook niet van hem die loopt, maar van God Die Zich ontfermt.", "Gen 45:5-11": "Maar nu, weest niet bekommerd, en de toorn ontsteekt niet in uw ogen, omdat u mij hierheen verkocht hebt; want God heeft mij voor uw aangezicht gezonden, tot behoud van het leven. Want het zijn nu twee jaren van de honger in het midden van het land; en er zijn nog vijf jaren, waarin geen ploeging noch oogst zal zijn. Doch God heeft mij voor uw aangezicht heen gezonden, om u een overblijfsel te stellen op de aarde, en om u bij het leven te behouden, door een grote verlossing.", "Matt 5:39-41": "Maar Ik zeg u, dat u de boze niet weerstaat; maar wie u op uw rechterwang slaat, keer hem ook de andere toe; en als iemand met u wil rechtstoetsen en uw onderkleed nemen, laat hem ook de mantel; en wie u zal dwingen één mijl te gaan, ga met hem twee mijl.", "Spr 19:13": "Een dwaze zoon is voor zijn vader een grote ellende; en de kijvingen van een vrouw zijn als een aanhoudend druppelen.", "Jes 43:14": "Zo zegt de HEERE, uw Verlosser, de Heilige van Israël: Om uw wil heb Ik naar Babel gezonden, en heb hen allen als vluchtelingen doen neerdalen, te weten de Chaldeeën, in de schepen, waarop zij juichten.", "2 Kor 2:7": "Zodat u hem daarentegen juist moet vergeven en vertroosten, opdat zo iemand niet door al te overvloedige droefheid verzwolgen wordt.", "Est 6:8": "laat men het koninklijke kleed brengen dat de koning gewoonlijk draagt, en het paard waarop de koning gewoonlijk rijdt, en laat de koninklijke kroon op zijn hoofd gezet worden.", "Spr 17:14": "Het begin van het krakeel is als iemand die het water opening geeft; laat daarom de twist varen, voordat hij losbarst.", "Ex 22:7": "Wanneer iemand aan zijn naaste geld of voorwerpen geeft om te bewaren, en het wordt uit het huis van die man gestolen, en de dief wordt gevonden, dan moet hij het dubbel teruggeven.", "Gen 45:9-11": "Haast u en trek op naar mijn vader, en zeg het hem: Zo zegt uw zoon Jozef: God heeft mij tot een heer over heel Egypte gesteld; kom af naar mij, en wacht niet. En u zult in het land Gosen wonen, en dicht bij mij zijn, u en uw zonen, en de zonen van uw zonen, en uw schapen, en uw runderen, en alles wat u hebt. En ik zal u daar onderhouden; want er zullen nog vijf jaren van de honger zijn, opdat u niet verarmt, u en uw huis, en alles wat u hebt!", "Gen 45:9-13": "Haast u en trek op naar mijn vader, en zeg het hem: Zo zegt uw zoon Jozef: God heeft mij tot een heer over heel Egypte gesteld; kom af naar mij, en wacht niet. En u zult in het land Gosen wonen, en dicht bij mij zijn, u en uw zonen, en de zonen van uw zonen, en uw schapen, en uw runderen, en alles wat u hebt. En ik zal u daar onderhouden; want er zullen nog vijf jaren van de honger zijn, opdat u niet verarmt, u en uw huis, en alles wat u hebt!", "Deut 2:30": "Maar Sihon, de koning van Hesbon, wilde ons daar niet doorheen laten trekken; want de HEERE, uw God, verhardde zijn geest en verstokte zijn hart, opdat Hij hem in uw hand zou geven, zoals het is op deze dag.", "Ruth 1:9": "De HEERE geve u dat u rust vindt, ieder in het huis van haar man! En toen zij hen kuste, huilden zij luid;", "1 Sam 2:6-9": "De HEERE doodt en maakt levend; Hij doet naar het graf neerdalen, en Hij doet weer opkomen. De HEERE maakt arm en maakt rijk; Hij vernedert, ook verhoogt Hij. Hij verheft de geringe uit het stof, en de nooddruftige verhoogt Hij uit de vuilnis, om hen te doen zitten bij de vorsten, dat Hij hen de stoel van de eer laat beërven; want de fundamenten van het aardrijk zijn van de HEERE, en Hij heeft de wereld daarop gezet.", "Jes 13:18": "Maar hun bogen zullen de jongemannen verpletteren, en zij zullen zich niet ontfermen over de vrucht van de buik; hun oog zal de kinderen niet ontzien.", "Richt 14:19": "Toen kwam de Geest van de HEERE machtig over hem, en hij ging af naar de Askelonieten, en sloeg van hen dertig man; en hij nam hun kleren, en gaf de stellen (extra) kleren aan hen die het raadsel verklaard hadden. Maar zijn toorn ontstak, en hij ging naar het huis van zijn vader.", "Neh 6:16": "En het gebeurde, toen al onze vijanden dit hoorden, dat alle heidenvolken die rondom ons waren, bevreesd werden en zeer in aanzien daalden in hun eigen ogen; want zij begrepen dat dit werk door onze God tot stand gebracht was.", "Gen 47:7-12": "En Jozef bracht zijn vader Jakob binnen en stelde hem voor Farao; en Jakob zegende Farao. En Farao zei tegen Jakob: Hoeveel jaren telt u al? En Jakob zei tegen Farao: De jaren van mijn vreemdelingschap zijn honderddertig jaar; weinig en zwaar zijn de jaren van mijn leven geweest, en zij hebben niet gehaald bij de jaren van het leven van mijn vaderen, in de dagen van hun vreemdelingschap.", "Joh 20:27": "Daarna zei Hij tegen Thomas: Breng uw vinger hier, en bekijk Mijn handen, en breng uw hand, en stop hem in Mijn zijde; en wees niet ongelovig, maar gelovig.", "Gen 43:30-34": "En Jozef haastte zich; want zijn hart werd bewogen om zijn broer, en hij zocht een plek om te wenen; en hij ging een kamer in, en weende daar. Daarna waste hij zijn gezicht en kwam naar buiten; en hij bedwong zichzelf, en zei: Zet brood op tafel. En zij richtten voor hem apart aan, en voor hen apart; en voor de Egyptenaren, die met hem aten, apart; want de Egyptenaren mogen geen brood eten met de Hebreeën, omdat dat voor de Egyptenaren een gruwel is.", "Jak 3:17": "Maar de wijsheid die van boven is, is ten eerste zuiver, daarna vreedzaam, welwillend, meegaand, vol barmhartigheid en goede vruchten, onpartijdig, en oprecht.", "Gen 20:15": "En Abimelech zei: Zie, mijn land ligt voor u open; woon waar het goed is in uw ogen.", "Hand 17:7-9": "Jason heeft hen in zijn huis opgenomen; en al dezen handelen tegen de geboden van de keizer, en zeggen dat er een andere koning is, namelijk Jezus. En zij brachten de menigte en de leiders van de stad, die dit hoorden, in opschudding. Maar toen zij van Jason en de anderen een borgsom ontvangen hadden, lieten zij hen gaan.", "Gen 47:6": "Egypteland ligt voor u; laat uw vader en uw broers wonen in het beste deel van het land; laat hen in het land Gosen wonen. En als u weet dat er onder hen bekwame mannen zijn, zet hen dan aan als veemeesters over wat ik heb.", "2 Tim 2:23-25": "En verwerp de dwaze en onverstandige vragen, wetend dat zij twisten voortbrengen. En een dienstknecht van de Heere moet niet twisten, maar vriendelijk zijn tegen allen, bekwaam om te leren, en in staat om kwaad te verdragen; met zachtmoedigheid onderwijzend hen die tegenstand bieden; of God hun misschien op enig moment bekering zou geven tot erkenning van de waarheid;", "Ps 105:16": "Hij riep ook een honger over het land; Hij brak elke staf van het brood.", "Jes 58:4": "Zie, tot twist en gekijf vast u, en om goddeloos met de vuist te slaan; vast niet zoals vandaag, om uw stem te doen horen in de hoogte.", "Gen 46:34": "Dan moet u zeggen: Uw knechten zijn mannen die van onze jeugd af tot nu toe met vee omgegaan hebben, zowel wij als onze vaders; opdat u in het land Gosen mag wonen; want elke schaapherder is voor de Egyptenaren een gruwel.", "Ps 17:13": "Sta op, HEERE, kom hem voor, werp hem neer; bevrijd mijn ziel met Uw zwaard van de goddeloze;", "Tit 3:9": "Maar weersta de dwaze vragen en geslachtsrekeningen, en twistingen, en strijd over de wet; want die zijn nutteloos en zinloos.", "Gen 41:39-48": "Daarna zei Farao tegen Jozef: Omdat God u dit alles heeft bekendgemaakt, is er niemand zo verstandig en wijs als u. U zult over mijn huis zijn, en op uw bevel zal heel mijn volk de hand kussen; alleen door de troon zal ik groter zijn dan u. Verder zei Farao tegen Jozef: Zie, ik heb u over heel Egypteland gesteld.", "Deut 1:12": "Hoe zou ik alleen uw moeite, en uw last, en uw geschillen dragen?", "Gen 43:14": "En God, de Almachtige, geve u barmhartigheid bij die man, dat hij uw andere broer en Benjamin met u laat teruggaan! En wat mij aangaat, als ik van mijn kinderen beroofd word, dan ben ik maar beroofd!", "Gen 42:38": "Maar hij zei: Mijn zoon zal niet met u meegaan; want zijn broer is dood, en hij is alleen overgebleven; als hem een ongeluk zou overkomen op de weg die u zult gaan, dan zou u mijn grijze haren met verdriet naar het graf doen afdalen.", "Mark 3:24": "En als een koninkrijk tegen zichzelf verdeeld is, kan dat koninkrijk niet standhouden.", "1 Kron 11:14": "En zij stelden zich op in het midden van dat stuk, en beschermden het, en zij versloegen de Filistijnen; en de HEERE verloste hen door een grote verlossing.", "Fil 2:2-5": "Maak dan mijn blijdschap volkomen, dat u eensgezind bent, dezelfde liefde hebt, één van gemoed en één van gevoelen bent. Doe niets uit twist of ijdele eer, maar acht door ootmoedigheid de een de ander voortreffelijker dan uzelf. Laat ieder niet alleen op zijn eigen zaken zien, maar ieder ook op wat van de anderen is.", "Matt 18:15": "Maar als uw broeder tegen u gezondigd heeft, ga naar hem toe en wijs hem terecht tussen u en hem alleen; als hij naar u luistert, hebt u uw broeder gewonnen.", "Gen 13:10": "En Lot hief zijn ogen op, en zag de hele vlakte van de Jordaan, dat die overal goed bevochtigd was; voordat de HEERE Sodom en Gomorra verwoest had, was zij als de hof van de HEERE, als het land Egypte, tot waar men bij Zoar komt.", "Openb 17:17": "Want God heeft hun in hun hart gegeven dat zij Zijn plan uitvoeren, en dat zij één en dezelfde gezindheid uitvoeren, en dat zij hun koninkrijk aan het beest geven, totdat de woorden van God vervuld zullen zijn.", "Spr 23:30": "Bij hen die bij de wijn blijven hangen; bij hen die komen om gemengde drank op te zoeken.", "1 Tim 2:8": "Ik wil dan dat de mannen bidden op alle plaatsen, met het opheffen van heilige handen, zonder toorn en twist.", "Luk 23:34": "En Jezus zei: Vader, vergeef het hun; want zij weten niet wat zij doen. En zij verdeelden Zijn kleren en wierpen erom het lot.", "Jes 44:28": "Die van Kores zegt: Hij is Mijn herder, en hij zal al Mijn welbehagen volbrengen; en zegt ook tot Jeruzalem: Word gebouwd; en tot de tempel: Word gegrondvest.", "Job 5:12": "Hij maakt teniet de gedachten van de arglistigen; zodat hun handen niets uitrichten.", "Spr 6:12-14": "Een nietsnut, een verdorven man, gaat om met een verkeerde mond; hij knipoogt met zijn ogen, spreekt met zijn voeten, wijst met zijn vingers; in zijn hart zijn verkeerdheden, hij smeedt voortdurend kwaad, hij zaait ruzie.", "Ezech 21:27": "Ik zal die kroon omgekeerd, omgekeerd, omgekeerd neerzetten; ja, zij zal er niet zijn, totdat hij komt die daartoe recht heeft, en aan wie Ik hem geven zal.", "1 Tess 5:13": "En acht hen zeer veel in liefde, om hun werk. Wees vreedzaam onder elkaar.", "Matt 10:34-36": "Meent niet dat Ik gekomen ben om vrede te brengen op de aarde; Ik ben niet gekomen om vrede te brengen, maar het zwaard. Want Ik ben gekomen om de mens tweedrachtig te maken tegen zijn vader, en de dochter tegen haar moeder, en de schoondochter tegen haar schoonmoeder. En zij zullen de vijanden van de mens worden, die zijn huisgenoten zijn.", "Hand 2:23": "Deze, door de bepaalde raad en voorkennis van God overgegeven, hebt u genomen en door de handen van onrechtvaardigen aan het kruis gehecht en gedood;", "Job 23:15": "Hierom word ik voor Zijn aangezicht ontsteld; als ik het aanmerk, vrees ik voor Hem;", "Openb 6:11": "En aan ieder werden lange witte klederen gegeven, en hun werd gezegd, dat zij nog een kleine tijd rusten zouden, totdat ook hun mededienstknechten en hun broeders zouden vervuld zijn, die gedood zouden worden, zoals ook zij.", "Hand 7:14": "En Jozef stuurde iemand heen, en liet zijn vader Jakob halen, en heel zijn familie, vijfenzeventig zielen in totaal.", "1 Kron 5:26": "Zo verwekte de God van Israël de geest van Pul, de koning van Assyrië, en de geest van Tiglath-Pilneser, de koning van Assyrië, die voerde hen gevankelijk weg, te weten de Rubenieten, en de Gadieten, en de halve stam van Manasse; en hij bracht hen naar Halah, en Habor, en Hara, en aan de rivier Gozan, tot op deze dag.", "1 Sam 9:8": "En de knecht antwoordde Saul verder en zei: Zie, ik heb bij me het vierde deel van een zilveren sikkel; dat zal ik de man van God geven, opdat hij ons onze weg wijst.", "1 Tim 3:3": "niet verzot op wijn, geen vechtersbaas, geen zoeker van vuil gewin; maar geduldig, geen ruziemaker, niet geldzuchtig.", "Jes 40:2": "Spreekt naar het hart van Jeruzalem, en roept haar toe, dat haar strijd vervuld is, dat haar ongerechtigheid verzoend is, dat zij van de hand van de HEERE dubbel ontvangen heeft voor al haar zonden.", "Gen 36:6": "Ezau nu had zijn vrouwen genomen, en zijn zonen, en zijn dochters, en alle mensen van zijn huis, en zijn vee, en al zijn dieren, en al zijn bezit, dat hij in het land Kanaän verworven had, en was vertrokken naar een ander land, weg van zijn broer Jakob.", "Gen 45:5-15": "Maar nu, weest niet bekommerd, en de toorn ontsteekt niet in uw ogen, omdat u mij hierheen verkocht hebt; want God heeft mij voor uw aangezicht gezonden, tot behoud van het leven. Want het zijn nu twee jaren van de honger in het midden van het land; en er zijn nog vijf jaren, waarin geen ploeging noch oogst zal zijn. Doch God heeft mij voor uw aangezicht heen gezonden, om u een overblijfsel te stellen op de aarde, en om u bij het leven te behouden, door een grote verlossing.", "Est 5:14": "Toen zei zijn vrouw Zeres tegen hem, alsook al zijn vrienden: Laat men een galg maken, vijftig el hoog, en zeg morgen tegen de koning dat men Mordechai daaraan laat hangen; ga dan vrolijk met de koning naar die maaltijd. Dit voorstel nu leek Haman goed, en hij liet de galg maken.", "Jer 40:5": "En omdat hij nog niet zal terugkeren, keer u dan terug tot Gedalia, de zoon van Ahikam, de zoon van Safan, die de koning van Babel over de steden van Juda aangesteld heeft; en woon bij hem in het midden van het volk; of ga overal waar het in uw ogen recht is te gaan. En de aanvoerder van de lijfwacht gaf hem reiskost en een geschenk, en liet hem gaan.", "Richt 15:18": "Toen hij nu erge dorst had, riep hij tot de HEERE, en zei: U hebt door de hand van Uw knecht dit grote heil gegeven; zou ik dan nu van dorst sterven, en vallen in de hand van deze onbesnedenen?", "Jes 54:17": "Elk instrument dat tegen u gemaakt wordt, zal niet gelukken, en elke tong, die in het gericht tegen u opstaat, zult u verdoemen; dit is het erfdeel van de knechten van de HEERE, en hun gerechtigheid is uit Mij, spreekt de HEERE.", "Deut 21:4": "En de oudsten van die stad zullen de jonge koe naar beneden brengen in een ruw dal, dat niet bewerkt of bezaaid is; en zij zullen deze jonge koe daar in het dal de nek doorhouwen.", "Matt 14:26": "En de discipelen, die Hem op de zee zagen lopen, werden ontroerd, en zeiden: Het is een spook! En zij schreeuwden van angst.", "Gen 39:3": "Toen zijn heer zag dat de HEERE met hem was, en dat de HEERE alles wat hij deed door zijn hand voorspoedig maakte,", "Pred 8:2": "Ik zeg: let op de mond van de koning; maar houd rekening met de eed van God.", "Num 7:3-9": "En zij brachten hun offergave voor het aangezicht van de HEERE: zes overdekte wagens en twaalf runderen; een wagen voor twee leiders, en een os voor ieder een; en zij brachten ze voor de tabernakel. En de HEERE sprak tot Mozes en zei: Neem ze van hen aan, opdat zij zijn om de dienst van de tent van de samenkomst te verrichten; en u zult ze aan de Levieten geven, ieder naar zijn dienst.", "Spr 15:18": "Een grimmige man verwekt gekijf; maar wie langzaam tot toorn is, doet de twist bedaren.", "Ex 14:4": "En Ik zal het hart van Farao verstokken, dat hij hen najaagt; en Ik zal aan Farao en aan zijn hele leger verheerlijkt worden, zodat de Egyptenaren zullen weten dat Ik de HEERE ben. En zij deden zo.", "Gen 46:5": "Toen maakte Jakob zich op vanuit Berseba; en de zonen van Israël vervoerden Jakob, hun vader, en hun kinderen, en hun vrouwen, op de wagens die de farao gestuurd had om hem te vervoeren.", "Ruth 1:14": "Toen huilden zij weer luid; en Orpa kuste haar schoonmoeder, maar Ruth bleef bij haar.", "Rom 14:21": "Het is goed geen vlees te eten, en geen wijn te drinken, en niets waaraan uw broeder zich stoot, of geërgerd wordt, of waarin hij zwak is.", "Jes 41:4": "Wie heeft dit gedaan en tot stand gebracht, terwijl Hij de geslachten riep van het begin af? Ik, de HEERE, Die de Eerste ben, en met de Laatste ben Ik Dezelfde.", "Spr 6:16-19": "Deze zes dingen haat de HEERE; ja, zeven zijn een gruwel voor Zijn ziel: hoogmoedige ogen, een valse tong, en handen die onschuldig bloed vergieten; een hart dat verdorven plannen smeedt; voeten die zich haasten om naar het kwaad te lopen;", "Lev 26:6": "Ook zal Ik vrede geven in het land, zodat u zult gaan slapen, en niemand is er die u verschrikt; en Ik zal het boze gedierte uit het land doen ophouden, en het zwaard zal door uw land niet doorgaan.", "Spr 26:20": "Als er geen hout is, gaat het vuur uit; en als er geen roddelaar is, wordt het gekijf gestild.", "2 Sam 3:36": "Toen al het volk dit merkte, was het goed in hun ogen; alles wat de koning gedaan had, was goed in de ogen van heel het volk.", "Spr 21:18": "De goddeloze is een rantsoen voor de rechtvaardigen, en de trouweloze voor de oprechten.", "Gen 45:16-20": "Toen dit gerucht in het huis van Farao gehoord werd, dat men zei: Jozefs broers zijn gekomen! was het goed in de ogen van Farao, en in de ogen van zijn dienaren. En Farao zei tegen Jozef: Zeg tegen uw broers: Doe dit, laad uw dieren, en trek heen, ga naar het land Kanaän; En neem uw vader en uw huisgezinnen, en kom naar mij, en ik zal u het beste van Egypteland geven, en u zult het vette van dit land eten.", "Num 18:29": "Van al uw gaven zult u alle hefoffer van de HEERE offeren; van al het beste daarvan, van de heiliging daarvan.", "Gen 42:4": "Maar Benjamin, Jozefs broer, stuurde Jakob niet met zijn broers mee; want hij zei: Anders overkomt hem misschien een ongeluk!", "Gen 49:20": "Van Aser, zijn brood zal vet zijn; en hij zal koninklijke lekkernijen leveren.", "Spr 19:21": "In het hart van de man zijn veel gedachten; maar de raad van de HEERE, die zal standhouden.", "Jes 48:14": "Verzamel u, u allen, en hoor; wie onder hen heeft deze dingen verkondigd? De HEERE heeft hem lief, Hij zal Zijn welbehagen tegen Babel doen, en Zijn arm zal tegen de Chaldeeën zijn.", "Job 5:24": "En u zult bevinden dat uw tent in vrede is; en u zult uw woning verzorgen, en zult niet feilen.", "Hebr 12:14": "Jaag de vrede na met allen, en de heiligmaking, zonder welke niemand de Heere zien zal;", "Luk 24:11": "En hun woorden leken hun als onzinnig gepraat, en zij geloofden hen niet.", "Zach 12:10": "Doch over het huis van David, en over de inwoners van Jeruzalem, zal Ik uitstorten de Geest van de genade en van de gebeden; en zij zullen Mij aanschouwen, Die zij doorstoken hebben, en zij zullen over Hem rouwklagen, zoals met de rouwklacht over een enige zoon; en zij zullen over Hem bitter kermen, zoals men bitter kermt over een eerstgeborene.", "Est 9:1": "In de twaalfde maand nu (dat is de maand Adar), op de dertiende dag daarvan, toen het woord en de wet van de koning nabij gekomen waren om uitgevoerd te worden, op de dag dat de vijanden van de Joden hoopten over hen te heersen, gebeurde het omgekeerde: de Joden zelf heersten over hun haters.", "Gen 42:36": "Toen zei Jakob, hun vader, tegen hen: U berooft mij van kinderen! Jozef is er niet meer, en Simeon is er niet meer; nu wilt u Benjamin wegnemen! Al deze dingen zijn tegen mij!", "Gen 45:5-8": "Maar nu, weest niet bekommerd, en de toorn ontsteekt niet in uw ogen, omdat u mij hierheen verkocht hebt; want God heeft mij voor uw aangezicht gezonden, tot behoud van het leven. Want het zijn nu twee jaren van de honger in het midden van het land; en er zijn nog vijf jaren, waarin geen ploeging noch oogst zal zijn. Doch God heeft mij voor uw aangezicht heen gezonden, om u een overblijfsel te stellen op de aarde, en om u bij het leven te behouden, door een grote verlossing.", "Ezra 1:1": "In het eerste jaar nu van Kores, koning van Perzië, opdat het woord van de HEERE, uit de mond van Jeremia, volbracht werd, wekte de HEERE de geest van Kores, koning van Perzië, op, zodat hij een boodschap liet doorgeven door heel zijn koninkrijk, zelfs ook op schrift, en zei:", "Jer 52:3": "Want het gebeurde vanwege de toorn van de HEERE tegen Jeruzalem en Juda, totdat Hij hen van Zijn aangezicht weggeworpen had; en Zedekia kwam in opstand tegen de koning van Babel.", "1 Petr 3:11": "hij moet wijken van het kwade en het goede doen; hij moet vrede zoeken en die najagen.", "Gen 41:56": "Toen er honger was over heel het land, opende Jozef alles waarin iets was, en verkocht aan de Egyptenaren; want de honger werd sterk in Egypteland.", "Matt 18:15-17": "Maar als uw broeder tegen u gezondigd heeft, ga naar hem toe en wijs hem terecht tussen u en hem alleen; als hij naar u luistert, hebt u uw broeder gewonnen. Maar als hij niet naar u luistert, neem dan nog één of twee mensen met u mee, zodat elk woord vaststaat door de mond van twee of drie getuigen. En als hij naar hen niet luistert, zeg het dan aan de gemeente; en als hij ook naar de gemeente niet luistert, laat hij dan voor u zijn als de heiden en de tollenaar.", "Ex 34:21": "Zes dagen zult u werken, maar op de zevende dag zult u rusten; in de ploegtijd en in de oogst zult u rusten.", "Joh 19:11": "Jezus antwoordde: U zou geen enkele macht tegen Mij hebben, als het u niet van boven gegeven was; daarom heeft hij die Mij aan u heeft overgeleverd, groter zonde.", "Spr 18:19": "Een broeder is moeilijker te winnen dan een sterke stad; en geschillen zijn als de grendel van een paleis.", "Gen 42:26": "En zij laadden hun koren op hun ezels, en trokken vandaar weg.", "Spr 15:17": "Beter is een gerecht van groente, waar ook liefde is, dan een vetgemeste os met haat erbij.", "1 Tim 3:2": "Een opziener moet dan onberispelijk zijn, de man van één vrouw, waakzaam, matig, eerbaar, gastvrij, bekwaam om te leren;", "Tit 3:1-3": "Herinner hen eraan dat zij aan de overheden en machten onderdanig zijn, dat zij hun gehoorzaam zijn, dat zij tot alle goed werk bereid zijn; Dat zij niemand belasteren, geen ruziezoekers zijn, maar vriendelijk zijn, en alle zachtmoedigheid bewijzen tegenover alle mensen. Want ook wij waren vroeger onverstandig, ongehoorzaam, dwalend, en dienden aan allerlei begeerten en genoegens; wij leefden in slechtheid en afgunst, waren hatelijk en haatten elkaar.", "Jer 51:21": "En door u zal Ik in stukken slaan het paard en zijn ruiter; en door u zal Ik in stukken slaan de wagen en zijn ruiter.", "1 Kor 3:4": "Want als de een zegt: Ik ben van Paulus; en een ander: Ik ben van Apollos; bent u niet vleselijk?", "1 Petr 3:10": "Want wie het leven wil liefhebben en goede dagen wil zien, die moet zijn tong weerhouden van het kwade, en zijn lippen, zodat ze geen bedrog spreken;", "Ezech 9:5": "Maar tot die anderen zei Hij voor mijn oren: Ga door de stad achter hem, en sla, uw oog verschoont niet, en spaar niet!", "Num 24:10-13": "Toen ontstak de toorn van Balak tegen Bileam, en hij sloeg zijn handen samen; en Balak zei tegen Bileam: Ik heb u geroepen om mijn vijanden te vervloeken; maar zie, u hebt hen nu al driemaal gezegend! En nu, pak u weg naar uw plaats! Ik had gezegd dat ik u hoog zou eren; maar zie, de HEERE heeft u die eer onthouden! Toen zei Bileam tegen Balak: Heb ik ook niet tegen uw boden, die u naar mij gezonden hebt, gesproken en gezegd:", "Spr 16:33": "Het lot wordt in de schoot geworpen; maar de hele beschikking daarover is van de HEERE.", "Luk 12:58": "Want als u met uw tegenpartij naar de overheid gaat, doe dan onderweg moeite om van hem verlost te worden; anders zou hij u misschien voor de rechter slepen, en de rechter zou u aan de gerechtsdienaar overleveren, en de gerechtsdienaar zou u in de gevangenis werpen.", "Gen 47:1-6": "Toen kwam Jozef en vertelde het aan Farao, en zei: Mijn vader en mijn broers, met hun schapen, hun runderen en alles wat zij hebben, zijn gekomen uit het land Kanaän; en zie, zij zijn in het land Gosen. En hij nam een deel van zijn broers, namelijk vijf mannen, en stelde hen voor Farao. Toen zei Farao tegen zijn broers: Wat is uw beroep? En zij zeiden tegen Farao: Uw knechten zijn schaapherders, zowel wij als onze vaders.", "Ex 4:27": "De HEERE zei ook tegen Aäron: Ga Mozes tegemoet in de woestijn. En hij ging, en ontmoette hem bij de berg van God, en kuste hem.", "2 Tim 2:14": "Breng deze dingen in gedachtenis, en houd hun voor, voor de Heere, dat zij geen woordenstrijd voeren, wat tot niets nut is, dan tot verderf van de toehoorders.", "2 Tim 2:22": "Maar vlucht de begeerten van de jeugd; en jaag naar rechtvaardigheid, geloof, liefde, vrede, samen met hen die de Heere aanroepen uit een rein hart.", "Gen 37:28": "Toen nu de Midianitische kooplieden voorbijtrokken, trokken en hesen zij Jozef op uit de kuil, en verkochten Jozef aan deze Ismaëlieten voor twintig zilverstukken; die brachten Jozef naar Egypte.", "Ef 4:32": "Maar wees jegens elkaar goedertieren, barmhartig, en vergeef elkaar, zoals ook God in Christus u vergeven heeft.", "Gal 5:10": "Ik vertrouw van u in de Heere, dat u niet anders zult denken; maar wie u in verwarring brengt, zal het oordeel dragen, wie hij ook is.", "Num 14:1": "Toen kwam de hele vergadering in opstand, en zij verhieven hun stem, en het volk weende diezelfde nacht.", "Luk 24:41": "En toen zij het van blijdschap nog niet geloofden, en zich verwonderden, zei Hij tegen hen: Hebt u hier iets te eten?", "Deut 23:4": "Vanwege dat zij u onderweg niet tegemoet gekomen zijn met brood en met water, toen u uit Egypte wegtrok; en omdat hij tegen u Bileam gehuurd heeft, de zoon van Beor, uit Pethor in Mesopotamië, om u te vloeken.", "Matt 12:25": "Maar Jezus kende hun gedachten, en zei tegen hen: Elk koninkrijk dat tegen zichzelf verdeeld is, wordt verwoest; en elke stad of elk huis dat tegen zichzelf verdeeld is, zal niet standhouden.", "Est 9:25": "Maar toen zij voor de koning gekomen was, heeft hij door brieven bevolen dat zijn boze plan, dat hij bedacht had tegen de Joden, op zijn eigen hoofd zou terugkeren; en men heeft hem en zijn zonen aan de galg gehangen.", "1 Kor 11:16-19": "Maar als iemand meent twistgierig te moeten zijn: wij hebben zulke gewoonten niet, en de Gemeenten van God ook niet. Dit nu, wat ik u aanzeg, prijs ik niet, namelijk dat u niet tot beter, maar tot erger samenkomt. Want eerst, als u samenkomt in de Gemeente, hoor ik dat er scheuringen onder u zijn; en ik geloof het ten dele;", "Luk 11:17": "Maar Hij, die hun gedachten kende, zei tegen hen: Elk koninkrijk dat tegen zichzelf verdeeld is, wordt verwoest; en een huis dat tegen zichzelf verdeeld is, valt.", "Ps 120:6": "Mijn ziel heeft lang gewoond bij hen die de vrede haten.", "Rom 14:19": "Laten wij dan najagen wat tot de vrede dient, en wat tot de opbouw van elkaar dient.", "Gen 48:12": "Toen liet Jozef hen van zijn knieën vandaan gaan; en hij boog zich met zijn gezicht neer tot de aarde.", "Gen 45:7-9": "Doch God heeft mij voor uw aangezicht heen gezonden, om u een overblijfsel te stellen op de aarde, en om u bij het leven te behouden, door een grote verlossing. Nu dan, u hebt mij hierheen niet gezonden, maar God Zelf, Die mij tot vader van Farao gesteld heeft, en tot een heer over zijn hele huis, en regeerder in het hele land van Egypte. Haast u en trek op naar mijn vader, en zeg het hem: Zo zegt uw zoon Jozef: God heeft mij tot een heer over heel Egypte gesteld; kom af naar mij, en wacht niet.", "Kol 3:12": "Doe dan aan, als uitverkorenen van God, heiligen en geliefden, de innerlijke bewegingen van barmhartigheid, goedertierenheid, ootmoedigheid, zachtmoedigheid, geduld;", "Num 3:16": "En Mozes telde hen naar het bevel van de HEERE, zoals hem geboden was.", "Dan 11:27": "En het hart van beide koningen zal erop gericht zijn kwaad te doen, en aan één tafel zullen zij leugen spreken; en het zal niet lukken, want het zal nog een einde hebben op de vastgestelde tijd.", "Job 1:21": "En hij zei: Naakt ben ik uit mijn moeders buik gekomen, en naakt zal ik daarheen terugkeren. De HEERE heeft gegeven, en de HEERE heeft genomen; de Naam van de HEERE zij geloofd!", "Openb 21:23": "En de stad heeft de zon en de maan niet nodig, om in haar te schijnen; want de heerlijkheid van God heeft haar verlicht, en het Lam is haar lamp.", "Hand 3:18": "Maar God heeft zo vervuld wat Hij door de mond van al Zijn profeten van tevoren had verkondigd, dat de Christus zou lijden.", "Spr 25:24": "Het is beter te wonen op een hoek van het dak, dan met een twistzieke huisvrouw, en dat in een huis vol gezelschap.", "Ps 81:17": "En Hij zou het gevoed hebben met het beste van de tarwe; ja, Ik zou u verzadigd hebben met honing uit de rotsen.", "2 Kon 20:3": "Och, HEERE, gedenk toch dat ik voor Uw aangezicht in waarheid en met een volkomen hart gewandeld heb, en gedaan heb wat goed is in Uw ogen. En Hizkia huilde erg veel.", "Ps 127:1": "Een lied Hammaaloth¹, van Salomo. Als de HEERE het huis niet bouwt, werken de bouwers eraan tevergeefs; als de HEERE de stad niet bewaart, waakt de wachter tevergeefs.", "Gen 42:23": "En zij wisten niet dat Jozef het hoorde; want er was een tolk tussen hen.", "Gen 48:10": "Doch de ogen van Israël waren wazig door ouderdom; hij kon niet goed zien; en hij liet hen naar zich toe komen; toen kuste hij hen, en omhelsde hen.", "Gen 45:26-28": "Toen berichtten zij hem, en zeiden: Jozef leeft nog, ja, hij is ook regeerder in heel Egypteland! Toen bezweek zijn hart, want hij geloofde hen niet. Maar toen zij tot hem gesproken hadden al de woorden van Jozef, die hij tot hen gesproken had, en dat hij de wagens zag, die Jozef gezonden had om hem te vervoeren, toen werd de geest van Jakob, hun vader, levendig. En Israël zei: Het is genoeg! Mijn zoon Jozef leeft nog! Ik zal gaan, en hem zien, voordat ik sterf!", "Gen 43:13": "Neem ook uw broer mee, en maak u op, ga terug naar die man.", "Gen 24:10": "En die knecht nam tien kamelen van de kamelen van zijn heer, en vertrok; en al het goed van zijn heer had hij bij zich; en hij stond op, en vertrok naar Mesopotamië, naar de stad van Nahor.", "2 Kon 5:23": "En Naäman zei: Het is goed, neem twee talenten. En hij drong bij hem aan, en bond twee talenten van het zilver in twee buidels, met twee stellen kleren, en gaf ze aan twee van zijn knechten, die ze voor hem uit droegen.", "Joz 11:20": "Want het was van de HEERE om hun harten te verharden, zodat zij Israël in de strijd tegemoet gingen, opdat Hij hen met de ban zou treffen, zodat hun geen genade te beurt viel, maar opdat Hij hen zou vernietigen, zoals de HEERE Mozes geboden had.", "Ef 4:3": "En u inspant om de eenheid van de Geest te bewaren door de band van de vrede.", "Gen 45:1-5": "Toen kon Jozef zich niet bedwingen voor allen die bij hem stonden, en hij riep: Laat iedereen bij mij weggaan! En er stond niemand bij hem, toen Jozef zich aan zijn broers bekend maakte. En hij verhief zijn stem met wenen, zodat de Egyptenaren het hoorden, en dat het huis van Farao het hoorde. En Jozef zei tegen zijn broers: Ik ben Jozef! Leeft mijn vader nog? En zijn broers konden hem niet antwoorden, want zij waren verschrikt voor zijn aangezicht.", "Spr 17:19": "Die het gekijf liefheeft, heeft de overtreding lief; die zijn deur verhoogt, zoekt zijn ondergang.", "Mark 9:50": "Het zout is goed; maar als het zout smakeloos wordt, waarmee zult u het smakelijk maken? Heb zout in uzelf, en houd vrede met elkaar.", "Joh 14:2": "In het huis van Mijn Vader zijn veel woningen; anders zou Ik het u gezegd hebben. Ik ga heen om u plaats te bereiden.", "1 Kor 14:33": "Want God is geen God van verwarring, maar van vrede, zoals in al de Gemeenten der heiligen.", "Spr 10:12": "Haat verwekt ruzies; maar de liefde bedekt alle overtredingen.", "Ps 37:20": "Caph. Maar de goddelozen zullen vergaan, en de vijanden van de HEERE zullen verdwijnen, als het kostelijkste van de lammeren; met de rook zullen zij verdwijnen.", "Mark 6:50": "want zij zagen Hem allen, en werden verschrikt; en meteen sprak Hij met hen, en zei tegen hen: Heb goede moed, Ik ben het; vrees niet.", "Num 22:12-18": "Toen zei God tegen Bileam: U mag niet met hen meegaan; u mag dat volk niet vervloeken, want het is gezegend. Toen stond Bileam 's morgens op, en zei tegen de vorsten van Balak: Ga naar uw land; want de HEERE weigert mij toe te staan met u mee te gaan. Toen stonden de vorsten van Moab op, en kwamen bij Balak, en zij zeiden: Bileam heeft geweigerd met ons mee te gaan.", "Gen 47:11": "En Jozef zorgde voor woningen voor Jakob en zijn broers, en gaf hun een bezitting in Egypteland, in het beste deel van het land, in het land Rameses, zoals Farao geboden had.", "Jak 3:14-16": "Maar als u bittere afgunst en eigenbelang in uw hart hebt, beroem u dan niet en lieg niet tegen de waarheid. Dat is de wijsheid niet die van boven komt, maar is aards, ongeestelijk, duivels. Want waar afgunst en eigenbelang is, daar is verwarring en allerlei kwade praktijk.", "Job 29:16": "Ik was voor de behoeftigen een vader; en het geschil dat ik niet kende, dat onderzocht ik.", "Gen 43:11": "Toen zei Israël, hun vader, tegen hen: Is het nu zo, doe dan dit; neem van het beste fruit van dit land in uw zakken, en breng die man een geschenk mee: een weinig balsem, en een weinig honing, specerijen en mirre, terpentijnnoten en amandelen.", "Ps 126:1": "Een lied Hammaäloth. Toen de HEERE de gevangenen van Sion terugbracht, waren wij als mensen die dromen.", "2 Kon 5:5": "Toen zei de koning van Syrië: Ga heen, kom, en ik zal een brief aan de koning van Israël sturen. En hij ging heen, en nam in zijn hand tien talenten van het zilver, en zesduizend sikkelen goud, en tien stellen kleren.", "Gen 43:31": "Daarna waste hij zijn gezicht en kwam naar buiten; en hij bedwong zichzelf, en zei: Zet brood op tafel.", "Deut 1:33": "Die voor u uit op de weg ging, om voor u de plaats uit te zoeken waar u zou legeren; 's nachts in het vuur, om u de weg te wijzen waarin u zou gaan, en overdag in de wolk.", "Hand 5:38": "En nu zeg ik u: Houd u afzijdig van deze mensen, en laat hen gaan; want als deze raad of dit werk uit mensen is, zal het gebroken worden;", "Luk 2:14": "Ere zij God in de hoogste hemelen, en vrede op aarde, in de mensen een welbehagen.", "Jes 41:2": "Wie heeft van de opgang die rechtvaardige verwekt? Heeft hem geroepen om hem op zijn voet te doen staan? De heidenvolken voor zijn aangezicht gegeven, en gemaakt dat hij over koningen heerste? Heeft hun zijn zwaard gegeven als stof, zijn boog als een voortgedreven stoppel?", "Est 6:1-12": "Diezelfde nacht kon de koning niet slapen, en hij zei dat men het boek van de gedenkwaardigheden, de kronieken, moest brengen; en die werden voorgelezen in de tegenwoordigheid van de koning. En men vond geschreven dat Mordechai had bekendgemaakt dat Bigthana en Theres, twee kamerlingen van de koning, uit de dorpelwachters, van plan waren de hand te leggen aan koning Ahasveros. Toen zei de koning: Welke eer en verhoging is Mordechai hiervoor gegeven? En de knechten van de koning, zijn dienaars, zeiden: Aan hem is niets gegeven.", "Ezra 9:12": "Zo zult u nu uw dochters niet geven aan hun zonen, en hun dochters niet nemen voor uw zonen, en zult hun vrede en hun welvaart niet zoeken, tot in eeuwigheid; opdat u sterk wordt, en het goede van het land eet, en uw kinderen het laat erven tot in eeuwigheid.", "Ezech 12:4": "U zult dan uw gereedschap bij dag voor hun ogen naar buiten brengen, als het gereedschap van hen die vertrekken; daarna zult u in de avond uitgaan voor hun ogen, zoals zij uitgaan die vertrekken.", "1 Kor 16:7": "Want ik wil u nu niet zien terwijl ik onderweg ben, maar ik hoop enige tijd bij u te blijven, als de Heere het zal toelaten.", "Gen 42:21": "Toen zeiden zij de één tegen de ander: Voorwaar, wij zijn schuldig aan onze broer, wiens angst van zijn ziel wij zagen, toen hij ons om genade smeekte; maar wij luisterden niet! Daarom komt deze benauwdheid over ons.", "Matt 14:27": "Maar meteen sprak Jezus hen aan, en zei: Heb goede moed, Ik ben het, vreest niet.", "Gal 5:19-21": "De werken van het vlees nu zijn openbaar; dat zijn: overspel, hoererij, onreinheid, losbandigheid, Afgoderij, toverij, vijandschappen, ruzies, jaloersheden, toorn, twisten, verdeeldheid, afwijkingen in de leer, Afgunst, moord, dronkenschappen, uitspattingen, en dergelijke; waarvan ik u van tevoren zeg, zoals ik ook eerder gezegd heb, dat wie zulke dingen doen, het Koninkrijk van God niet zullen beërven.", "Gen 29:13": "En het gebeurde, toen Laban het bericht hoorde over Jakob, de zoon van zijn zuster, dat hij hem tegemoet snelde, en hem omhelsde, en hem kuste, en hem naar zijn huis bracht. En hij vertelde Laban al deze dingen.", "Spr 25:8": "Ga niet haastig een geschil aan om te twisten, opdat u misschien aan het einde daarvan niet weet wat u moet doen, wanneer uw naaste u beschaamd zou hebben.", "Richt 9:24": "opdat het geweld, gedaan aan de zeventig zonen van Jerubbaäl, tot uiting zou komen, en opdat hun bloed gelegd zou worden op Abimelech, hun broer, die hen gedood had, en op de burgers van Sichem, die zijn handen gesterkt hadden om zijn broers te doden.", "1 Kor 1:10-13": "Maar ik bid u, broeders, door de Naam van onze Heere Jezus Christus, dat u allen hetzelfde spreekt, en dat er onder u geen scheuringen zijn, maar dat u samengevoegd bent tot eenzelfde zin en tot eenzelfde gevoelen. Want mij is over u bekendgemaakt, mijn broeders, door hen die van het huisgezin van Chloë zijn, dat er twisten onder u zijn. En dit zeg ik, dat ieder van u zegt: Ik ben van Paulus; en ik van Apollos; en ik van Cefas; en ik van Christus.", "Job 42:11": "Ook kwamen tot hem al zijn broers, en al zijn zusters, en allen, die hem tevoren gekend hadden, en aten brood met hem in zijn huis, en beklaagden hem, en vertroostten hem over al het kwaad, dat de HEERE over hem gebracht had; en zij gaven hem ieder een stuk van het geld, ieder ook een gouden voorhoofdsieraad.", "Luk 17:31": "Op die dag, wie op het dak zal zijn, met zijn huisraad in huis, laat hij niet naar beneden komen om het weg te nemen; en wie op de akker zal zijn, laat hij zich evenmin omkeren naar wat achter hem is.", "Jes 41:11": "Zie, zij zullen beschaamd worden en te schande gemaakt, allen die tegen u in woede ontstoken zijn; zij zullen worden als niets, en de mensen die met u twisten, zullen vergaan.", "Luk 24:39": "Zie Mijn handen en Mijn voeten; want Ik ben het Zelf; raak Mij aan, en zie; want een geest heeft geen vlees en beenderen, zoals u ziet dat Ik heb.", "Gen 45:5-7": "Maar nu, weest niet bekommerd, en de toorn ontsteekt niet in uw ogen, omdat u mij hierheen verkocht hebt; want God heeft mij voor uw aangezicht gezonden, tot behoud van het leven. Want het zijn nu twee jaren van de honger in het midden van het land; en er zijn nog vijf jaren, waarin geen ploeging noch oogst zal zijn. Doch God heeft mij voor uw aangezicht heen gezonden, om u een overblijfsel te stellen op de aarde, en om u bij het leven te behouden, door een grote verlossing.", "Ps 80:7": "U hebt ons onze buren tot een twist gesteld, en onze vijanden spotten onder elkaar.", "Ezech 7:9": "En Mijn oog zal niet verschonen, en Ik zal niet sparen; Ik zal u geven naar uw wegen, en uw gruwelen zullen in het midden van u zijn; en u zult weten dat Ik de HEERE ben, Die slaat.", "Gen 42:24": "Toen wendde hij zich van hen af, en huilde; daarna keerde hij weer naar hen terug, en sprak tegen hen, en nam Simeon van hen weg, en bond hem voor hun ogen.", "Gen 45:18-20": "En neem uw vader en uw huisgezinnen, en kom naar mij, en ik zal u het beste van Egypteland geven, en u zult het vette van dit land eten. U bent toch gelast: doe dit, neem u uit Egypteland wagens voor uw kinderen, en voor uw vrouwen, en breng uw vader, en kom. En laat uw oog uw huisraad niet verschonen; want het beste van heel Egypteland, dat zal het uwe zijn.", "2 Kron 8:13": "namelijk naar de eis van elke dag, terwijl hij offerde volgens het gebod van Mozes, op de sabbatten, en op de nieuwe manen, en op de vastgestelde hoogtijden, drie keer per jaar; op het feest van de ongezuurde broden, en op het feest van de weken, en op het feest van de loofhutten.", "1 Kon 11:14-40": "Zo verwekte de HEERE tegen Salomo een tegenstander, Hadad de Edomiet; hij was van het koninklijk geslacht in Edom. Want het was gebeurd, toen David in Edom was, en Joab, de legeraanvoerder, optrok om de gesneuvelden te begraven, dat hij alles wat mannelijk was in Edom versloeg; want Joab bleef daar zes maanden met heel Israël, totdat hij alles wat mannelijk was in Edom had uitgeroeid.", "Gen 47:12": "En Jozef verzorgde zijn vader en zijn broers en het hele huis van zijn vader met brood, tot aan de kleinste kinderen toe.", "1 Kor 4:19": "Maar ik zal spoedig naar u toe komen, als de Heere het wil, en dan zal ik niet de woorden leren kennen van hen die opgeblazen zijn, maar de kracht.", "Jes 1:19": "Als u willig bent en luistert, zult u het goede van dit land eten;", "Klaagl 1:18": "Tsade. De HEERE is rechtvaardig, want ik ben Zijn mond opstandig geweest; hoort toch, alle volken, en ziet mijn smart; mijn jonkvrouwen en mijn jongelingen zijn in de gevangenschap gegaan.", "2 Kon 5:22": "En hij zei: Het is goed; mijn heer heeft mij gestuurd, om te zeggen: Zie, zojuist zijn er twee jonge mannen uit de zonen van de profeten, van het gebergte van Efraïm, bij mij gekomen; geef hun toch een talent van het zilver en twee stellen kleren.", "Spr 30:33": "Want het karnen van melk brengt boter voort, en het knijpen van de neus brengt bloed voort, en het opjagen van de toorn brengt twist voort.", "2 Kron 10:15": "Zo luisterde de koning niet naar het volk; want deze ommekeer kwam van God, opdat de HEERE Zijn woord zou bevestigen, dat Hij door de dienst van Ahia, de Siloniet, gesproken had tot Jerobeam, de zoon van Nebat.", "Spr 13:10": "Door hoogmoed maakt men niet dan gekijf; maar bij hen die zich laten raden is wijsheid.", "1 Kor 13:5": "Zij handelt niet ongeschikt, zij zoekt zichzelf niet, zij wordt niet verbitterd, zij denkt geen kwaad;", "1 Sam 10:22": "Toen vroegen zij verder aan de HEERE, of die man nog daarheen komen zou. De HEERE dan zei: Zie, hij heeft zich tussen de bagage verstopt.", "Spr 26:17": "De voorbijganger die zich opwindt in een twist die hem niet aangaat, is als iemand die een hond bij de oren grijpt.", "Rom 12:20": "Als dan uw vijand honger heeft, geef hem te eten; als hij dorst heeft, geef hem te drinken; want als u dat doet, zult u kolen van het vuur op zijn hoofd hopen.", "Gen 47:18": "Toen dat jaar voorbij was, kwamen zij in het tweede jaar bij hem en zeiden tegen hem: Wij zullen het voor mijn heer niet verbergen: het geld is op, en de bezitting van het vee is bij mijn heer gekomen; er is voor het aangezicht van mijn heer niets anders overgebleven dan ons lichaam en ons land.", "Gen 33:4": "Toen liep Ezau hem tegemoet, en nam hem in zijn armen, en viel hem om de hals, en kuste hem; en zij huilden.", "Spr 16:7": "Als iemands wegen de HEERE behagen, zo zal Hij ook zijn vijanden met hem verzoenen.", "Gen 43:34": "En hij liet hun gerechten brengen die voor hem stonden; maar het gerecht van Benjamin was vijf keer groter dan de gerechten van hen allen. En zij dronken, en zij werden vrolijk met hem.", "Hos 2:17": "En Ik zal op die dag een verbond voor hen sluiten met het wild gedierte van het veld, en met het gevogelte van de hemel, en het kruipend gedierte van de aardbodem; en Ik zal de boog, en het zwaard, en de oorlog van de aarde wegbreken, en Ik zal hen in veiligheid laten neerliggen.", "Gen 41:33": "Laat Farao dus nu uitzien naar een verstandig en wijs man, en hem aanstellen over het land van Egypte.", "Jes 57:15": "Want zo zegt de Hoge en Verhevene, Die in de eeuwigheid woont, en Wiens Naam heilig is: Ik woon in de hoogte en in het heilige, en bij hem die een verbrijzelde en nederige geest heeft, om de geest van de nederigen levend te maken, en om het hart van de verbrijzelden levend te maken.", "Luk 2:28-30": "nam hij Hem in zijn armen, en loofde God, en zei: Nu laat U, Heere, Uw dienstknecht gaan in vrede, naar Uw woord; want mijn ogen hebben Uw zaligheid gezien,", "Rom 14:1": "Neem hem aan die zwak is in het geloof, maar niet tot twistige samensprekingen.", "Gen 50:15-21": "Toen Jozefs broeders zagen dat hun vader dood was, zeiden zij: Misschien zal Jozef ons haten, en zal hij ons zeker vergelden al het kwaad, dat wij hem aangedaan hebben. Daarom stuurden zij een boodschapper naar Jozef, en zeiden: Uw vader heeft voor zijn dood bevolen en gezegd: Zo moet u tot Jozef zeggen: Ach, vergeef toch de overtreding van uw broeders, en hun zonde; want zij hebben u kwaad aangedaan; maar nu, vergeef toch de overtreding van de dienaren van de God van uw vader! En Jozef weende toen zij tot hem spraken.", "Luk 12:59": "Ik zeg u: u zult daar geenszins uitgaan, totdat u ook de laatste penning betaald hebt.", "Spr 23:29": "Bij wie is wee? bij wie ach en wee? bij wie geruzie? bij wie geklaag? bij wie wonden zonder oorzaak? bij wie roodheid van de ogen?", "Richt 9:23": "zond God een boze geest tussen Abimelech en de burgers van Sichem; en de burgers van Sichem handelden trouweloos tegen Abimelech;", "Matt 15:5": "Maar u zegt: Wie tegen vader of moeder zal zeggen: Het is een gave, wat u ook van mij zou kunnen ten nutte komen; en zijn vader of zijn moeder geenszins zal eren, die voldoet.", "Deut 7:16": "U zult dan al die volken verteren, die de HEERE, uw God, u geven zal; uw oog zal hen niet ontzien, en u zult hun goden niet dienen; want dat zou u een valstrik zijn.", "Jes 25:6": "En de HEERE van de heerscharen zal op deze berg voor alle volken een vette maaltijd maken, een maaltijd van reine wijn, van vet vol merg, van reine wijnen, die gezuiverd zijn.", "Ps 120:7": "Ik ben vreedzaam; maar als ik spreek, zijn zij uit op oorlog.", "2 Kor 12:20": "Want ik vrees dat ik, als ik gekomen zal zijn, u niet zal vinden zoals ik wil, en dat ik door u gevonden zal worden zoals u niet wilt; dat er niet op enigerlei wijze twisten, jaloezie, toorn, ruzie, kwaadsprekerij, gefluister, opgeblazenheid, wanordelijkheden zijn;", "Spr 14:19": "De kwaden buigen neer voor de goeden, en de goddelozen voor de poorten van de rechtvaardige.", "Ef 4:31": "Alle bitterheid, en toorn, en gramschap, en geroep, en lastering worde van u geweerd, met alle boosheid;", "Hand 7:10": "en verloste hem uit al zijn verdrukkingen, en gaf hem genade en wijsheid voor Farao, de koning van Egypteland; en hij stelde hem aan als leider over Egypte en zijn hele huis.", "1 Sam 8:12": "en hij zal hen voor zich aanstellen als leiders over duizend, en als leiders over vijftigtallen; en hij zal hen zijn akker laten ploegen, en zijn oogst laten oogsten, en zijn oorlogswapens laten maken, alsook zijn wagentuig.", "2 Kron 36:22": "Maar in het eerste jaar van Kores, koning van Perzië, opdat het woord van de HEERE volbracht werd, door de mond van Jeremia, wekte de HEERE de geest op van Kores, koning van Perzië, zodat hij een stem liet doorgaan door zijn hele koninkrijk, ook zelfs op schrift, en hij zei:", "Luk 24:37": "En zij schrokken en werden zeer bevreesd, en meenden dat zij een geest zagen.", "Ps 31:21": "U verbergt hen in het verborgene van Uw aangezicht voor de hoogmoedigheden van de man; U versteekt hen in een hut voor de twist van de tongen.", "Gen 41:29-31": "Zie, de zeven aankomende jaren zal er grote overvloed zijn in heel het land van Egypte. Maar daarna zullen er zeven jaren van honger opstaan; dan zal in het land van Egypte al die overvloed vergeten worden; en de honger zal het land verteren. Ook zal de overvloed in het land niet gemerkt worden, vanwege die honger die daarna zal komen; want hij zal zeer zwaar zijn.", "Ezech 21:26": "Zo zegt de Heere HEERE: Doe die hoed weg, en neem die kroon af; deze zal niet dezelfde blijven; Ik zal verhogen wie nederig is, en vernederen wie hoog is.", "Num 23:1-30": "Toen zei Bileam tegen Balak: Bouw hier zeven altaren voor mij, en maak hier zeven stieren en zeven rammen voor mij klaar. Balak deed wat Bileam had gezegd; en Balak en Bileam offerden een stier en een ram op elk altaar. Toen zei Bileam tegen Balak: Blijf bij uw brandoffer staan, en ik zal weggaan; misschien zal de HEERE mij tegemoetkomen; en wat Hij mij laat zien, dat zal ik u bekendmaken. Toen ging hij naar de hoogte.", "Hand 5:39": "maar als het uit God is, dan kunt u dat niet breken; anders zou u misschien bevonden worden ook tegen God te strijden.", "Fil 2:3": "Doe niets uit twist of ijdele eer, maar acht door ootmoedigheid de een de ander voortreffelijker dan uzelf.", "Ps 77:5": "U hield mijn ogen wakend; ik was verslagen, en sprak niet.", "Joh 15:16": "U hebt Mij niet uitverkoren, maar Ik heb u uitverkoren, en Ik heb u gesteld, zodat u zou heengaan en vrucht dragen, en dat uw vrucht blijft; zodat, wat u ook van de Vader zal vragen in Mijn Naam, Hij u dat geeft.", "Spr 16:28": "Een verkeerd man zal onenigheid zaaien; en een lasteraar scheidt de beste vrienden.", "Gen 47:5": "Toen sprak Farao tegen Jozef en zei: Uw vader en uw broers zijn tot u gekomen;", "Luk 15:20": "En hij stond op en ging naar zijn vader. En toen hij nog ver van hem verwijderd was, zag zijn vader hem, en werd innerlijk met ontferming bewogen; en hij liep hem tegemoet, viel hem om de hals, en kuste hem.", "Kol 3:13": "verdraag elkaar en vergeef elkaar, als iemand tegen iemand enige klacht heeft; zoals ook Christus u vergeven heeft, doe ook u zo.", "Ps 133:1": "Een lied Hammaäloth, van David. Zie, hoe goed en hoe fijn is het, dat broeders ook samenwonen!", "1 Tim 6:3-5": "Als iemand een andere leer leert en niet overeenkomt met de gezonde woorden van onze Heere Jezus Christus, en met de leer die overeenkomt met de godsvrucht, is hij opgeblazen en weet hij niets, maar hij raakt bezeten van twistvragen en woordenstrijd; daaruit komen nijd, twist, lasteringen, kwade vermoedens, verkeerde twistgesprekken van mensen die een verdorven verstand hebben en van de waarheid beroofd zijn, en die menen dat de godsvrucht een bron van winst is. Blijf uit de buurt van zulke mensen.", "Gen 44:16": "Toen zei Juda: Wat zullen wij tegen mijn heer zeggen, wat zullen wij spreken, en hoe zullen wij ons rechtvaardigen? God heeft de ongerechtigheid van uw knechten aan het licht gebracht; zie, wij zijn slaven van mijn heer, zowel wij als hij bij wie de beker gevonden is.", "Ps 18:51": "Die de verlossingen van Zijn koning groot maakt, en goedertierenheid doet aan Zijn gezalfde, aan David en aan zijn nageslacht tot in eeuwigheid.", "Pred 3:1": "Alles heeft een vastgestelde tijd, en alle voornemen onder de hemel heeft zijn tijd.", "Gen 41:54": "En de zeven jaren van honger begonnen te komen, zoals Jozef gezegd had. En er was honger in alle landen; maar in heel Egypteland was brood.", "Jes 8:9": "Verzamel u samen, volken! Toch zult u verbroken worden; en neem het ter ore, allen die in verre landen bent, omgord u, toch zult u verbroken worden; omgord u, toch zult u verbroken worden!", "1 Kor 4:7": "Want wie maakt onderscheid ten aanzien van u? En wat hebt u, dat u niet hebt ontvangen? En als u het ook ontvangen hebt, waarom roemt u, alsof u het niet ontvangen had?", "Gen 50:1-13": "Toen viel Jozef op het gezicht van zijn vader, en hij weende over hem, en kuste hem. En Jozef gebood zijn knechten, de artsen, dat zij zijn vader balsemen zouden; en de artsen balsemden Israël. En veertig dagen werden aan hem vervuld; want zo worden de dagen vervuld van hen die gebalsemd worden; en de Egyptenaars beweenden hem zeventig dagen.", "Gen 37:35": "En al zijn zonen en al zijn dochters maakten zich op om hem te troosten; maar hij weigerde zich te laten troosten en zei: Want ik zal, rouw bedrijvend, tot mijn zoon in het graf neerdalen. Zo beweende zijn vader hem.", "Gen 31:17": "Toen maakte Jakob zich klaar, en zette zijn zonen en zijn vrouwen op kamelen.", "Gen 37:4": "Toen zijn broeders zagen dat hun vader hem boven al zijn broers liefhad, haatten zij hem, en konden hem niet vredelijk toespreken.", "Spr 28:25": "Wie hoogmoedig van hart is, verwekt ruzie; maar wie op de HEERE vertrouwt, zal welvarend worden.", "Fil 1:15": "Sommigen prediken Christus wel uit afgunst en twist, maar sommigen ook uit goedwilligheid.", "Gen 50:1": "Toen viel Jozef op het gezicht van zijn vader, en hij weende over hem, en kuste hem.", "Jak 4:2": "U begeert, en hebt niet; u benijdt en jaagt naar dingen, en kunt ze niet krijgen; u vecht en voert strijd, maar u hebt niet, omdat u niet bidt.", "Ezech 23:24": "Die zullen tegen u komen met karren, wagens en wielen, en met een menigte van volken, met kleine schilden, grote schilden, en helmen; zij zullen zich rondom tegen u opstellen; en Ik zal voor hun aangezicht het strafgericht neerleggen, en zij zullen u berechten naar hun rechtsregels.", "Ps 33:10": "De HEERE vernietigt de raad van de heidenen; Hij breekt de gedachten van de volken.", "1 Tim 2:2": "voor koningen en allen die in hoge positie zijn, opdat wij een rustig en stil leven kunnen leiden in alle godsvrucht en eerbaarheid.", "Jes 41:12": "U zult hen zoeken, maar zult hen niet vinden, de mensen die met u kijven; zij zullen worden als niets, en de mensen die met u oorlogen, als een nietig ding.", "Gen 47:23": "Toen zei Jozef tegen het volk: Zie, ik heb vandaag u en uw land gekocht voor Farao; zie, hier is zaad voor u, opdat u het land bezaait.", "Jes 13:3-5": "Ik heb Mijn geheiligden bevel gegeven; ook heb Ik tot Mijn toorn geroepen Mijn helden, hen die zich verheugen in Mijn hoogheid. Er is een ruisende stem op de bergen, gelijk aan een groot volk; een stem van gedruis van de koninkrijken, van de verzamelde heidenvolken; de HEERE van de heerscharen monstert het krijgsleger. Zij komen uit een ver land, van het einde van de hemel; de HEERE en de instrumenten van Zijn gramschap, om dat hele land te verderven.", "1 Kor 3:3": "Want u bent nog vleselijk; want omdat er onder u nijd is, en twist, en tweedracht, bent u niet vleselijk, en wandelt u niet naar de mens?", "Gen 37:3": "En Israël had Jozef lief, boven al zijn zonen; want hij was hem een zoon van het ouderdom; en hij maakte hem een veelkleurige rok.", "Spr 12:20": "Bedrog is in het hart van hen die kwaad smeden; maar zij die vrede raden, hebben blijdschap.", "1 Petr 1:10-12": "Naar deze zaligheid hebben de profeten gezocht en onderzoek gedaan, zij die geprofeteerd hebben van de genade die voor u bestemd was; en onderzochten op welke of wat voor tijd de Geest van Christus, Die in hen was, doelde, toen Hij vooraf getuigde van het lijden dat over Christus zou komen, en de heerlijkheid daarna. Aan hen is geopenbaard dat zij niet zichzelf, maar ons dienden met deze dingen, die u nu aangekondigd zijn door hen die u het Evangelie verkondigd hebben door de Heilige Geest, Die van de hemel gezonden is; dingen waar de engelen graag een blik in willen werpen.", "2 Sam 14:33": "Toen ging Joab naar de koning, en vertelde het hem. Toen riep hij Absalom, en hij kwam bij de koning, en boog zich voor hem op zijn gezicht ter aarde, voor het aangezicht van de koning; en de koning kuste Absalom.", "1 Tim 6:21": "waarmee sommigen, terwijl zij die beleden, van het geloof zijn afgeweken. De genade zij met u. Amen. De eerste brief aan Timotheüs werd geschreven vanuit Laodicea, de voornaamste stad in Frygië Pacatania.", "Joh 14:3": "En wanneer Ik heen zal zijn gegaan en u plaats zal hebben bereid, kom Ik terug en zal u tot Mij nemen, opdat u ook mag zijn waar Ik ben.", "1 Sam 25:13": "David dan zei tegen zijn mannen: Ieder gordt zijn zwaard aan. Toen gordde ieder zijn zwaard aan, en David gordde ook zijn zwaard aan; en zij trokken op achter David, ongeveer vierhonderd man, en er bleven er tweehonderd bij het gereedschap.", "1 Tim 1:5-7": "Maar het doel van het gebod is liefde uit een rein hart, en uit een goed geweten, en uit een ongeveinsd geloof. Van wie sommigen afgeweken zijn en zich gewend hebben tot ijdel gepraat; Zij willen leraars van de wet zijn, maar begrijpen niet wat zij zeggen, en ook niet waarover zij zo stellig spreken.", "1 Sam 30:12": "Zij gaven hem ook een stuk van een klomp vijgen, en twee stukken rozijnen; en hij at, en zijn geest kwam weer in hem terug; want hij had drie dagen en drie nachten geen brood gegeten, en geen water gedronken.", "Jes 49:23": "En koningen zullen uw voedsterheren zijn, hun vorstinnen uw zoogvrouwen; zij zullen zich voor u buigen met het aangezicht ter aarde, en zij zullen het stof van uw voeten likken; en u zult weten, dat Ik de HEERE ben, dat zij niet beschaamd zullen worden die Mij verwachten.", "Ps 105:22": "Om zijn vorsten te binden naar zijn lust, en zijn oudsten te onderwijzen.", "Hand 7:9-15": "En de aartsvaders, jaloers geworden, verkochten Jozef om naar Egypte gebracht te worden; maar God was met hem, en verloste hem uit al zijn verdrukkingen, en gaf hem genade en wijsheid voor Farao, de koning van Egypteland; en hij stelde hem aan als leider over Egypte en zijn hele huis. En er kwam een hongersnood over het hele land van Egypte en Kanaän, en grote nood; en onze vaders vonden geen voedsel.", "1 Kon 12:15": "Zo hoorde de koning niet naar het volk; want deze ommekeer kwam van de HEERE, opdat Hij Zijn woord zou bevestigen, dat de HEERE door de dienst van Ahia, de Siloniet, gesproken had tot Jerobeam, de zoon van Nebat.", "Hab 1:3": "Waarom laat U mij ongerechtigheid zien, en aanschouwt U de kwelling? Want verwoesting en geweld is tegen mij, en er is twist, en men neemt gekijf op.", "Ps 76:11": "Want de grimmigheid van de mens zal U loffelijk maken; het overblijfsel van de grimmigheden zult U opbinden.", "Hand 7:9": "En de aartsvaders, jaloers geworden, verkochten Jozef om naar Egypte gebracht te worden; maar God was met hem,", "Pred 3:10": "Ik heb de bezigheid gezien, die God aan de kinderen van de mensen gegeven heeft, om zichzelf daarmee te bekommeren.", "2 Sam 16:10-12": "Maar de koning zei: Wat heb ik met u te doen, zonen van Zeruja? Ja, laat hem vloeken; want de HEERE heeft immers tegen hem gezegd: Vloek David; wie zou dan zeggen: Waarom hebt u dat gedaan? Verder zei David tegen Abisai en tegen al zijn knechten: Zie, mijn zoon, die uit mijn lijf is voortgekomen, zoekt mijn leven; hoeveel te meer dan nu deze zoon van Jemini? Laat hem begaan, laat hij vloeken, want de HEERE heeft het hem gezegd. Misschien zal de HEERE naar mijn ellende omzien; en de HEERE zal mij goed vergelden voor zijn vloek van vandaag.", "Jer 20:9": "Daarom zei ik: Ik zal Hem niet meer noemen, en niet meer in Zijn Naam spreken; maar het werd in mijn hart als een brandend vuur, opgesloten in mijn beenderen; en ik werd moe van het verdragen, maar ik kon het niet.", "Ezech 12:3": "Daarom, mensenkind, maak u gereedschap voor een verhuizing, en vertrek bij dag voor hun ogen; en u zult vertrekken van uw plaats naar een andere plaats voor hun ogen; misschien zullen zij het opmerken, hoewel zij een opstandig huis zijn.", "Jes 28:4": "En de verwelkende bloem van zijn heerlijke sieraad, die op het hoofd van de zeer vruchtbare vallei is, zal zijn als een vroegrijpe vrucht vóór de zomer, die, wanneer iemand ze ziet, terwijl zij nog in zijn hand is, hij opslokt.", "Matt 5:25": "Wees snel welgezind tegenover uw tegenpartij, terwijl u nog met hem onderweg bent, opdat de tegenpartij u misschien niet aan de rechter overlevert, en de rechter u aan de gerechtsdienaar overlevert, en u in de gevangenis geworpen wordt.", "Hos 6:2": "Hij zal ons na twee dagen levend maken; op de derde dag zal Hij ons doen opstaan, en wij zullen voor Zijn aangezicht leven.", "Dan 5:7": "Zodat de koning met kracht riep dat men de s
