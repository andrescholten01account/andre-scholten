den van de zonen van Laban, die zeiden: Jakob heeft alles genomen wat van onze vader was, en van wat van onze vader was heeft hij al deze rijkdom gemaakt.","2":"Jakob zag ook het gezicht van Laban aan, en zie, het was tegenover hem niet als gisteren en eergisteren.","3":"En de HEERE zei tegen Jakob: Keer terug naar het land van uw vaderen, en naar uw familie, en Ik zal met u zijn.","4":"Toen liet Jakob Rachel en Lea roepen, naar het veld bij zijn kudde;","5":"En hij zei tegen haar: Ik zie het gezicht van uw vader, dat het tegenover mij niet is als gisteren en eergisteren; maar de God van mijn vader is bij mij geweest.","6":"En u weet, dat ik met al mijn kracht uw vader gediend heb.","7":"Maar uw vader heeft mij bedrogen, en heeft mijn loon tien keer veranderd; maar God heeft hem niet toegelaten mij kwaad te doen.","8":"Wanneer hij zo zei: De gespikkelde zullen uw loon zijn, dan wierp de hele kudde gespikkelde jongen; en wanneer hij zo zei: De gestreepte zullen uw loon zijn, dan wierp de hele kudde gestreepte jongen.","9":"Zo heeft God het vee van uw vader afgenomen, en aan mij gegeven.","10":"En het gebeurde in de tijd dat de kudde bronstig werd, dat ik mijn ogen opsloeg, en ik zag in een droom; en zie, de bokken die de kudde besprongen, waren gestreept, gespikkeld, en gevlekt.","11":"En de Engel van God zei tegen mij in de droom: Jakob! En ik zei: Zie, hier ben ik!","12":"En Hij zei: Sla toch uw ogen op, en zie! alle bokken die de kudde bespringen, zijn gestreept, gespikkeld, en gevlekt; want Ik heb alles gezien wat Laban u aandoet.","13":"Ik ben die God van Bethel, waar u het opgerichte teken gezalfd hebt, waar u Mij een gelofte beloofd hebt; nu, maak u op, vertrek uit dit land, en keer terug naar het land van uw familie.","14":"Toen antwoordden Rachel en Lea, en zeiden tegen hem: Is er nog een deel of erfenis voor ons, in het huis van onze vader?","15":"Worden wij niet door hem als vreemden beschouwd? Want hij heeft ons verkocht, en hij heeft ook steeds ons geld verteerd.","16":"Want alle rijkdom die God van onze vader heeft afgenomen, die is van ons, en van onze zonen; nu dan, doe alles wat God tegen u gezegd heeft.","17":"Toen maakte Jakob zich klaar, en zette zijn zonen en zijn vrouwen op kamelen.","18":"En hij voerde al zijn vee weg, en alle bezittingen die hij verworven had, het vee dat hij bezat, dat hij in Paddan-Aram verworven had, om te gaan naar Izak, zijn vader, naar het land Kanaän.","19":"Laban nu was gegaan om zijn schapen te scheren; zo stal Rachel de terafim[1] die van haar vader waren.","20":"En Jakob misleidde Laban, de Syriër, doordat hij hem niet liet weten dat hij vluchtte.","21":"En hij vluchtte, met alles wat van hem was, en hij maakte zich op, en trok de rivier over, en hij richtte zich naar het gebergte Gilead.","22":"En op de derde dag werd aan Laban bericht dat Jakob gevlucht was.","23":"Toen nam hij zijn broeders met zich mee, en achtervolgde hem, een reis van zeven dagen, en hij haalde hem in op het gebergte van Gilead.","24":"Doch God kwam tot Laban, de Syriër, in een droom 's nachts, en Hij zei tegen hem: Pas op, dat u met Jakob niet spreekt, noch goed, noch kwaad.","25":"En Laban haalde Jakob in; Jakob nu had zijn tent opgeslagen op dat gebergte; ook sloeg Laban met zijn broeders de zijne op op het gebergte van Gilead.","26":"Toen zei Laban tegen Jakob: Wat hebt u gedaan, dat u mij misleid hebt, en mijn dochters weggevoerd hebt, als gevangenen met het zwaard?","27":"Waarom bent u heimelijk gevlucht, en hebt u zich aan mij ontstolen? En hebt u het mij niet verteld, zodat ik u had kunnen wegzenden met vreugde, en met gezangen, met tamboerijn en met harp?","28":"U hebt mij zelfs niet toegelaten mijn zonen en mijn dochters te kussen; nu hebt u dwaas gehandeld door zo te doen.","29":"Het staat in de macht van mijn hand u kwaad te doen; maar de God van uw vader heeft gisteravond tegen mij gesproken en gezegd: Pas op, dat u met Jakob niet spreekt, noch goed, noch kwaad.","30":"En nu, u hebt zeker willen vertrekken, omdat u zo vurig verlangde naar het huis van uw vader; maar waarom hebt u mijn goden gestolen?","31":"Toen antwoordde Jakob, en zei tegen Laban: Omdat ik bang was; want ik zei: Anders zou u misschien uw dochters met geweld van mij afnemen!","32":"Bij wie u uw goden vindt, laat die niet leven! Onderzoek voor onze broeders wat bij mij is, en neem het tot u. Want Jakob wist niet dat Rachel ze gestolen had.","33":"Toen ging Laban de tent van Jakob binnen, en de tent van Lea, en de tent van de beide dienstmaagden, en hij vond niets; en toen hij uit de tent van Lea gegaan was, kwam hij in de tent van Rachel.","34":"Maar Rachel had de terafim genomen, en had ze in het zadeltuig van de kameel gelegd, en zij zat erop. En Laban doorzocht de hele tent, en hij vond niets.","35":"En zij zei tegen haar vader: Laat mijn heer niet boos worden, omdat ik voor uw ogen niet kan opstaan; want het gaat mij naar de gewoonte van vrouwen; en hij doorzocht alles, maar hij vond de terafim niet.","36":"Toen werd Jakob boos, en twistte met Laban; en Jakob antwoordde en zei tegen Laban: Wat is mijn overtreding, wat is mijn zonde, dat u mij zo heftig achterna hebt gejaagd?","37":"Nu u al mijn huisraad doorzocht hebt, wat hebt u gevonden van al het huisraad van uw huis! Leg het hier voor mijn broeders en uw broeders, en laat hen oordelen tussen ons beiden.","38":"Deze twintig jaar ben ik bij u geweest; uw ooien en uw geiten hebben niet misdragen, en de rammen van uw kudde heb ik niet gegeten.","39":"Het verscheurde heb ik niet naar u toe gebracht; ik heb het zelf vergoed; u eiste het van mijn hand, of het nu overdag gestolen was, of 's nachts gestolen was.","40":"Ik ben zo geweest, dat overdag de hitte mij verteerde, en 's nachts de vorst, en dat mijn slaap van mijn ogen week.","41":"Ik ben nu twintig jaar in uw huis geweest; ik heb u veertien jaar gediend voor uw beide dochters, en zes jaar voor uw kudde; en u hebt mijn loon tien keer veranderd.","42":"Als de God van mijn vader, de God van Abraham, en de Vreze van Izak, niet bij mij was geweest, dan had u mij zeker nu met lege handen weggezonden! God heeft mijn ellende, en de arbeid van mijn handen, gezien, en heeft u gisteravond bestraft.","43":"Toen antwoordde Laban en zei tegen Jakob: Deze dochters zijn mijn dochters, en deze zonen zijn mijn zonen, en deze kudde is mijn kudde, ja, alles wat u ziet, dat is van mij; en wat zou ik vandaag aan deze mijn dochters kunnen doen? Of aan hun zonen, die zij gebaard hebben?","44":"Nu dan, kom, laten wij een verbond sluiten, ik en u, dat het tot een getuigenis zij tussen mij en tussen u!","45":"Toen nam Jakob een steen, en richtte die op als een opgericht teken.","46":"En Jakob zei tegen zijn broeders: Verzamel stenen! En zij namen stenen, en maakten een hoop; en zij aten daar op die hoop.","47":"En Laban noemde hem Jegar-Sahadutha; maar Jakob noemde hem Gilead.","48":"Toen zei Laban: Deze hoop zij vandaag een getuige tussen mij en tussen u! Daarom noemde men zijn naam Gilead,","49":"En Mizpa; omdat hij zei: Laat de HEERE toezicht houden tussen mij en tussen u, wanneer wij van elkaar gescheiden zullen zijn!","50":"Als u mijn dochters slecht behandelt, en als u vrouwen neemt naast mijn dochters, is niemand bij ons; kijk toe, God zal getuige zijn tussen mij en tussen u!","51":"Laban zei verder tegen Jakob: Zie, daar is deze hoop, en zie, daar is dit opgerichte teken, dat ik opgeworpen heb tussen mij en tussen u;","52":"Deze hoop zij getuige, en dit opgerichte teken zij getuige, dat ik voorbij deze hoop niet naar u toe zal komen, en dat u voorbij deze hoop en dit opgerichte teken niet naar mij toe zult komen, met kwade bedoelingen!","53":"De God van Abraham, en de God van Nahor, de God van hun vader, oordele tussen ons! En Jakob zwoer bij de Vreze van zijn vader Izak.","54":"Toen slachtte Jakob een offer op dat gebergte, en hij nodigde zijn broeders om brood te eten; en zij aten brood, en overnachtten op dat gebergte.","55":"En Laban stond 's morgens vroeg op, en kuste zijn zonen, en zijn dochters, en zegende hen; en Laban trok weg, en keerde terug naar zijn plaats."},"SV":{"1":"Toen hoorde hij de woorden der zonen van Laban, zeggende: Jakob heeft genomen alles, wat onzes vaders was, en van hetgeen, dat onzes vaders was, heeft hij al deze heerlijkheid gemaakt.","2":"Jakob zag ook het aangezicht van Laban aan, en ziet, het was jegens hem niet als gisteren *en* eergisteren.","3":"En de HEERE zeide tot Jakob: Keer weder tot het land uwer vaderen, en tot uw maagschap, en Ik zal met u zijn.","4":"Toen zond Jakob heen, en riep Rachel en Lea, op het veld tot zijn kudde;","5":"En hij zeide tot haar: Ik zie het aangezicht uws vaders, dat het jegens mij niet is als gisteren *en* eergisteren; doch de God mijns vaders is bij mij geweest.","6":"En gijlieden weet, dat ik met al mijn macht uw vader gediend heb.","7":"Maar uw vader heeft bedriegelijk met mij gehandeld, en heeft mijn loon tien malen veranderd; doch God heeft hem niet toegelaten, om mij kwaad te doen.","8":"Wanneer hij aldus zeide: De gespikkelde zullen uw loon zijn, zo lammerden al de kudden gespikkelde; en wanneer hij alzo zeide: De gesprenkelde zullen uw loon zijn, zo lammerden al de kudden gesprenkelde.","9":"Alzo heeft God uw vader het vee ontrukt, en aan mij gegeven.","10":"En het geschiedde ten tijde, als de kudde hittig werd, dat ik mijn ogen ophief, en ik zag in den droom; en ziet, de bokken, die de kudden beklommen, waren gesprenkeld, gespikkeld, en hagelvlakkig.","11":"En de Engel Gods zeide tot mij in den droom: Jakob! En ik zeide: Zie, *hier* ben ik!","12":"En Hij zeide: Hef toch uw ogen op, en zie! alle bokken, die de kudde beklimmen, zijn gesprenkeld, gespikkeld, en hagelvlakkig; want Ik heb gezien alles, wat Laban u doet.","13":"Ik ben die God van Beth-el, alwaar gij het opgerichte teken gezalfd hebt, waar gij Mij een gelofte beloofd hebt; nu, maak u op, vertrek uit dit land, en keer weder in het land uwer maagschap.","14":"Toen antwoordden Rachel en Lea, en zeiden tot hem: Is er nog voor ons een deel of erfenis, in het huis onzes vaders?","15":"Zijn wij niet vreemden van hem geacht? Want hij heeft ons verkocht, en hij heeft ook steeds ons geld verteerd.","16":"Want al de rijkdom, welke God onzen vader heeft ontrukt, die is onze, en van onze zonen; nu dan, doe alles, wat God tot u gezegd heeft.","17":"Toen maakte zich Jakob op, en laadde zijn zonen en zijn vrouwen op kemelen.","18":"En hij voerde al zijn vee weg, en al zijn have, die hij gewonnen had, het vee, dat hij bezat, hetwelk hij in Paddan-aram geworven had, om te komen tot Izak, zijn vader, naar het land Kanaän.","19":"Laban nu was gegaan, om zijn schapen te scheren; zo stal Rachel de terafim, die haar vader had.","20":"En Jakob ontstal zich aan het hart van Laban, den Syriër, overmits hij hem niet te kennen gaf, dat hij vlood.","21":"En hij vlood, en al wat het zijne was, en hij maakte zich op, en voer over de rivier, en hij zette zijn aangezicht naar het gebergte Gilead.","22":"En ten derden dage werd aan Laban geboodschapt, dat Jakob gevloden was.","23":"Toen nam hij zijn broeders met zich, en jaagde hem achterna, een weg van zeven dagen, en hij kreeg hem op het gebergte van Gilead.","24":"Doch God kwam tot Laban, den Syriër, in een droom des nachts, en Hij zeide tot hem: Wacht u, dat gij met Jakob spreekt, noch goed, noch kwaad.","25":"En Laban achterhaalde Jakob; Jakob nu had zijn tent geslagen op dat gebergte; ook sloeg Laban met zijn broederen *de* *zijne* op het gebergte van Gilead.","26":"Toen zeide Laban tot Jakob: Wat hebt gij gedaan, dat gij u aan mijn hart ontstolen hebt, en mijn dochteren ontvoerd hebt, als gevangenen met het zwaard?","27":"Waarom zijt gij heimelijk gevloden, en hebt *u* aan mij ontstolen? en hebt het mij niet aangezegd, dat ik u geleid had met vreugde, en met gezangen, met trommel en met harp?","28":"Ook hebt gij mij niet toegelaten mijn zonen en mijn dochteren te kussen; nu, gij hebt dwaselijk gedaan *zo* doende.","29":"Het ware in de macht mijner hand aan ulieden kwaad te doen; maar de God van ulieder vader heeft tot mij gisteren nacht gesproken, zeggende: Wacht u, van met Jakob te spreken, of goed, of kwaad.","30":"En nu, gij hebt immers willen vertrekken, omdat gij zo zeer begerig waart naar uws vaders huis; waarom hebt gij mijn goden gestolen?","31":"Toen antwoordde Jakob, en zeide tot Laban: Omdat ik vreesde; want ik zeide: Opdat gij niet misschien uw dochteren mij ontweldigdet!","32":"Bij wien gij uw goden vinden zult, laat hem niet leven! Onderken gij voor onze broederen, wat bij mij is, en neem het tot u. Want Jakob wist niet, dat Rachel dezelve gestolen had.","33":"Toen ging Laban in de tent van Jakob, en in de tent van Lea, en in de tent van de beide dienstmaagden, en hij vond niets; en als hij uit de tent van Lea gegaan was, kwam hij in de tent van Rachel.","34":"Maar Rachel had de terafim genomen, en zij had die in een kemels zadeltuig gelegd, en zij zat op dezelve. En Laban betastte die ganse tent, en hij vond niets.","35":"En zij zeide tot haar vader: Dat *de* *toorn* niet ontsteke in mijns heren ogen, omdat ik voor uw aangezicht niet kan opstaan; want *het* *gaat* mij naar der vrouwen wijze; en hij doorzocht; maar hij vond de terafim niet.","36":"Toen ontstak Jakob, en twistte met Laban; en Jakob antwoordde en zeide tot Laban: Wat is mijn overtreding, wat is mijn zonde, dat gij mij *zo* hittiglijk hebt nagejaagd?","37":"Als gij al mijn huisraad betast hebt, wat hebt gij gevonden van al het huisraad uws huizes! Leg het hier voor mijn broederen en uw broederen, en laat hen richten tussen ons beiden.","38":"Deze twintig jaren ben ik bij u geweest; uw ooien en uw geiten hebben niet misdragen, en de rammen uwer kudde heb ik niet gegeten.","39":"Het verscheurde heb ik tot u niet gebracht; ik heb het geboet; gij hebt het van mijn hand geëist, het ware des daags gestolen, of des nachts gestolen.","40":"Ik ben geweest, dat mij bij dag de hitte verteerde, en bij nacht de vorst, en dat mijn slaap van mijn ogen week.","41":"Ik ben nu twintig jaren in uw huis geweest; ik heb u veertien jaren gediend om uw beide dochteren, en zes jaren om uw kudde; en gij hebt mijn loon tien malen veranderd.","42":"Ten ware de God van mijn vader, de God van Abraham, en de Vreze van Izak, bij mij geweest was, zekerlijk, gij zoudt mij nu ledig weggezonden hebben! God heeft mijn ellende, en den arbeid mijner handen aangezien, en heeft u gisteren nacht bestraft.","43":"Toen antwoordde Laban en zeide tot Jakob: Deze dochters zijn mijn dochters, en deze zonen zijn mijn zonen, en deze kudde is mijn kudde, ja, al wat gij ziet, dat is mijn; en wat zoude ik aan deze mijn dochteren heden doen? of aan haar zonen, die zij gebaard hebben?","44":"Nu dan, kom, laat ons een verbond maken, ik en gij, dat het tot een getuigenis zij tussen mij en tussen u!","45":"Toen nam Jakob een steen, en hij verhoogde dien *tot* een opgericht teken.","46":"En Jakob zeide tot zijn broederen: Vergadert stenen! En zij namen stenen, en maakten een hoop; en zij aten aldaar op dien hoop.","47":"En Laban noemde hem Jegar-sahadutha; maar Jakob noemde denzelven Gilead.","48":"Toen zeide Laban: Deze hoop zij heden een getuige tussen mij en tussen u! Daarom noemde men zijn naam Gilead,","49":"En Mizpa; omdat hij zeide: Dat de HEERE opzicht neme tussen mij en tussen u, wanneer wij de een van den ander zullen verborgen zijn!","50":"Zo gij mijn dochteren beledigt, en zo gij vrouwen neemt boven mijn dochteren, niemand is bij ons; zie toe, God zal getuige zijn tussen mij en tussen u!","51":"Laban zeide voorts tot Jakob: Zie, daar is deze zelfde hoop, en zie, daar is dit opgericht teken, hetwelk ik opgeworpen heb tussen mij en tussen u;","52":"Deze zelfde hoop zij getuige, en dit opgericht teken zij getuige, dat ik tot u voorbij dezen hoop niet komen zal, en dat gij tot mij, voorbij dezen hoop en dit opgericht teken, niet komen zult ten kwade!","53":"De God van Abraham, en de God van Nahor, de God huns vaders richte tussen ons! En Jakob zwoer bij de Vreze zijn vaders Izaks.","54":"Toen slachtte Jakob een slachting op dat gebergte, en hij nodigde zijn broederen, om brood te eten; en zij aten brood, en vernachtten op dat gebergte.","55":"En Laban stond des morgens vroeg op, en kuste zijn zonen, en zijn dochteren, en zegende hen; en Laban trok heen, en keerde weder tot zijn plaats."},"KJV":{"1":"And he heard the words of Laban's sons, saying, Jacob hath taken away all that *was* our father's; and of *that* which *was* our father's hath he gotten all this glory.","2":"And Jacob beheld the countenance of Laban, and, behold, it *was* not toward him as before.","3":"And the LORD said unto Jacob, Return unto the land of thy fathers, and to thy kindred;","4":"And Jacob sent and called Rachel and Leah to the field unto his flock,","5":"And said unto them, I see your father's countenance, that it *is* not toward me as before; but the God of my father hath been","6":"And ye know that with all my power I have served your father.","7":"And your father hath deceived me, and changed my wages ten times; but God suffered him not to hurt me.","8":"If he said thus, The speckled shall be thy wages; then all the cattle bare speckled: and if he said thus, The ringstraked shall be thy hire; then bare all the cattle ringstraked.","9":"Thus God hath taken away the cattle of your father, and given","10":"And it came to pass at the time that the cattle conceived, that I lifted up mine eyes, and saw in a dream, and, behold, the rams which leaped upon the cattle *were* ringstraked, speckled, and grisled.","11":"And the angel of God spake unto me in a dream, *saying*, Jacob: And I said,","12":"And he said, Lift up now thine eyes, and see, all the rams which leap upon the cattle *are* ringstraked, speckled, and grisled: for I have seen all that Laban doeth","13":"I *am* the God of Bethel, where thou anointedst the pillar, *and* where thou vowedst a vow unto me: now arise, get thee out from this land, and return unto the land of thy kindred.","14":"And Rachel and Leah answered and said unto him, *Is there* yet any portion or inheritance for us in our father's house?","15":"Are we not counted of him strangers? for he hath sold us, and hath quite devoured also our money.","16":"For all the riches which God hath taken from our father, that *is* ours, and our children's: now then, whatsoever God hath said unto thee, do.","17":"Then Jacob rose up, and set his sons and his wives upon camels;","18":"And he carried away all his cattle, and all his goods which he had gotten, the cattle of his getting, which he had gotten in Padanaram, for to go to Isaac his father in the land of Canaan.","19":"And Laban went to shear his sheep: and Rachel had stolen the images that *were* her father's.","20":"And Jacob stole away unawares to Laban the Syrian, in that he told him not that he fled.","21":"So he fled with all that he had; and he rose up, and passed over the river, and set his face *toward* the mount Gilead.","22":"And it was told Laban on the third day that Jacob was fled.","23":"And he took his brethren with him, and pursued after him seven days' journey; and they overtook him in the mount Gilead.","24":"And God came to Laban the Syrian in a dream by night, and said unto him, Take heed that thou speak not to Jacob either good or bad.","25":"Then Laban overtook Jacob. Now Jacob had pitched his tent in the mount: and Laban with his brethren pitched in the mount of Gilead.","26":"And Laban said to Jacob, What hast thou done, that thou hast stolen away unawares to me, and carried away my daughters, as captives *taken* with the sword?","27":"Wherefore didst thou flee away secretly, and steal away from me; and didst not tell me, that I might have sent thee away with mirth, and with songs, with tabret, and with harp?","28":"And hast not suffered me to kiss my sons and my daughters? thou hast now done foolishly in *so* doing.","29":"It is in the power of my hand to do you hurt: but the God of your father spake unto me yesternight, saying, Take thou heed that thou speak not to Jacob either good or bad.","30":"And now, *though* thou wouldest needs be gone, because thou sore longedst after thy father's house, *yet* wherefore hast thou stolen my gods?","31":"And Jacob answered and said to Laban, Because I was afraid: for I said, Peradventure thou wouldest take by force thy daughters","32":"With whomsoever thou findest thy gods, let him not live: before our brethren discern thou what *is* thine with me, and take *it* to thee. For Jacob knew not that Rachel had stolen","33":"And Laban went into Jacob's tent, and into Leah's tent, and into the two maidservants' tents; but he found *them* not. Then went he out of Leah's tent, and entered into Rachel's tent.","34":"Now Rachel had taken the images, and put them in the camel's furniture, and sat upon them. And Laban searched all the tent, but found","35":"And she said to her father, Let it not displease my lord that I cannot rise up before thee; for the custom of women *is* upon me. And he searched, but found not the images.","36":"And Jacob was wroth, and chode with Laban: and Jacob answered and said to Laban, What *is* my trespass? what *is* my sin, that thou hast so hotly pursued after me?","37":"Whereas thou hast searched all my stuff, what hast thou found of all thy household stuff? set *it* here before my brethren and thy brethren, that they may judge betwixt us both.","38":"This twenty years *have* I *been* with thee; thy ewes and thy she goats have not cast their young, and the rams of thy flock have I not eaten.","39":"That which was torn *of beasts* I brought not unto thee; I bare the loss of it; of my hand didst thou require it, *whether* stolen by day, or stolen by night.","40":"*Thus* I was; in the day the drought consumed me, and the frost by night; and my sleep departed from mine eyes.","41":"Thus have I been twenty years in thy house; I served thee fourteen years for thy two daughters, and six years for thy cattle: and thou hast changed my wages ten times.","42":"Except the God of my father, the God of Abraham, and the fear of Isaac, had been with me, surely thou hadst sent me away now empty. God hath seen mine affliction and the labour of my hands, and rebuked *thee* yesternight.","43":"And Laban answered and said unto Jacob, *These* daughters *are* my daughters, and *these* children *are* my children, and *these* cattle *are* my cattle, and all that thou seest *is* mine: and what can I do this day unto these my daughters, or unto their children which they have born?","44":"Now therefore come thou, let us make a covenant, I and thou; and let it be for a witness","45":"And Jacob took a stone, and set it up *for* a pillar.","46":"And Jacob said unto his brethren, Gather stones; and they took stones, and made an heap: and they did eat there upon the heap.","47":"And Laban called it Jegarsahadutha: but Jacob called it Galeed.","48":"And Laban said, This heap *is* a witness between me and thee this day. Therefore was the name of it called Galeed;","49":"And Mizpah; for he said, The LORD watch between me and thee, when we are absent one from another.","50":"If thou shalt afflict my daughters, or if thou shalt take *other* wives beside my daughters, no man *is* with us; see, God *is* witness","51":"And Laban said to Jacob, Behold this heap, and behold *this* pillar, which I have cast","52":"This heap *be* witness, and *this* pillar *be* witness, that I will not pass over this heap to thee, and that thou shalt not pass over this heap and this pillar unto me, for harm.","53":"The God of Abraham, and the God of Nahor, the God of their father, judge betwixt us. And Jacob sware by the fear of his father Isaac.","54":"Then Jacob offered sacrifice upon the mount, and called his brethren to eat bread: and they did eat bread, and tarried all night in the mount.","55":"And early in the morning Laban rose up, and kissed his sons and his daughters, and blessed them: and Laban departed, and returned unto his place."}},"tsk":{"1":[{"kopje":"Jakob","refs":["Gen 31:8","Gen 31:9","Job 31:31","Ps 57:5","Ps 64:4","Ps 64:5","Ps 120:3-5","Spr 14:30","Spr 27:4","Pred 4:4","Ezech 16:44","Tit 3:3"]},{"kopje":"rijkdom","refs":["Gen 45:13","Est 5:11","Job 31:24","Job 31:25","Ps 17:14","Ps 49:17","Ps 49:18","Pred 4:4","Jes 5:14","Jer 9:23","Matt 4:8","1 Tim 6:4","1 Petr 1:24"]}],"2":[{"kopje":"gezicht","refs":["Gen 4:5","Deut 28:54","1 Sam 18:9-11","Dan 3:19"]},{"kopje":"het was","refs":["Gen 30:27"]},{"kopje":"niet als gisteren","refs":["Ex 4:10","Deut 19:4","1 Sam 19:7"]}],"3":[{"kopje":"Keer terug","refs":["Gen 28:15","Gen 28:20","Gen 32:9","Gen 35:1","Gen 46:2","Gen 46:3","Gen 50:24","Ps 46:2","Ps 50:15","Ps 90:15"]},{"kopje":"land","refs":["Gen 31:13","Gen 31:18","Gen 13:15","Gen 26:3-5","Gen 28:4","Gen 28:13","Gen 28:15","Gen 30:25"]},{"kopje":"met u","refs":["Gen 21:22","Gen 26:24","Gen 28:15","Gen 32:9","Jes 41:10","Hebr 13:5"]}],"5":[{"kopje":"Ik zie","refs":["Gen 31:2","Gen 31:3"]},{"kopje":"de God","refs":["Gen 31:3","Gen 31:13","Gen 31:42","Gen 31:53","Gen 32:9","Gen 48:15","Gen 50:17"]}],"7":[{"kopje":"tien keer","refs":["Gen 31:41","Lev 26:26","Num 14:22","Neh 4:12","Job 19:8","Jes 4:1","Zach 8:23"]},{"kopje":"God","refs":["Gen 31:29","Gen 20:6","Job 1:10","Ps 37:28","Ps 105:14","Ps 105:15","Jes 54:17"]}],"10":[{"kopje":"een droom","refs":["Gen 31:24","Gen 20:6","Gen 28:12","Num 12:6","Deut 13:1","1 Kon 3:5"]},{"kopje":"gestreept","refs":["Gen 30:39"]}],"11":[{"kopje":"de Engel","refs":["Gen 31:5","Gen 31:13","Gen 16:7-13","Gen 18:1","Gen 18:17","Gen 48:15","Gen 48:16"]},{"kopje":"Zie, hier ben ik","refs":["Gen 22:1","Ex 3:4","1 Sam 3:4","1 Sam 3:6","1 Sam 3:8","1 Sam 3:16","Jes 58:9"]}],"12":[{"kopje":"Sla toch uw ogen op","refs":["Gen 30:37-43"]},{"kopje":"Ik heb alles gezien","refs":["Gen 31:42","Ex 3:7","Ex 3:9","Lev 19:13","Deut 24:15","Ps 12:6","Ps 139:3","Pred 5:7","Hand 7:34","Ef 6:9"]}],"13":[{"kopje":"die God","ref /span> of <span class=\"wl wl-kjv\" data-code=\"H3837\">Laban's</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">sons,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> hath taken <span class=\"wl wl-kjv\" data-code=\"H3947\">away</span> all that was our <span class=\"wl wl-kjv\" data-code=\"H1\">father's;</span> and of that which was our <span class=\"wl wl-kjv\" data-code=\"H1\">father's</span> hath he <span class=\"wl wl-kjv\" data-code=\"H6213\">gotten</span> all this glory.","2":"And <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">beheld</span> the <span class=\"wl wl-kjv\" data-code=\"H6440\">countenance</span> of <span class=\"wl wl-kjv\" data-code=\"H3837\">Laban,</span> and, behold, it was not toward him <span class=\"wl wl-kjv\" data-code=\"H8543\">as</span> before.","3":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob,</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">Return</span> unto the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of thy <span class=\"wl wl-kjv\" data-code=\"H1\">fathers,</span> and to thy kindred;","4":"And <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> and <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> <span class=\"wl wl-kjv\" data-code=\"H7354\">Rachel</span> and <span class=\"wl wl-kjv\" data-code=\"H3812\">Leah</span> to the <span class=\"wl wl-kjv\" data-code=\"H7704\">field</span> unto his flock,","5":"And <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto them, I <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> your <span class=\"wl wl-kjv\" data-code=\"H1\">father's</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">countenance,</span> that it " data-code=\"H5337\">away</span> the <span class=\"wl wl-kjv\" data-code=\"H4735\">cattle</span> of your <span class=\"wl wl-kjv\" data-code=\"H1\">father,</span> and given","10":"And it came to pass at the <span class=\"wl wl-kjv\" data-code=\"H6256\">time</span> that the <span class=\"wl wl-kjv\" data-code=\"H6629\">cattle</span> <span class=\"wl wl-kjv\" data-code=\"H3179\">conceived,</span> that I lifted <span class=\"wl wl-kjv\" data-code=\"H5375\">up</span> mine <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes,</span> and <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> in a <span class=\"wl wl-kjv\" data-code=\"H2472\">dream,</span> and, behold, the <span class=\"wl wl-kjv\" data-code=\"H6260\">rams</span> which <span class=\"wl wl-kjv\" data-code=\"H5927\">leaped</span> upon the <span class=\"wl wl-kjv\" data-code=\"H6629\">cattle</span> were <span class=\"wl wl-kjv\" data-code=\"H6124\">ringstraked,</span> <span class=\"wl wl-kjv\" data-code=\"H5348\">speckled,</span> and grisled.","11":"And the <span class=\"wl wl-kjv\" data-code=\"H4397\">angel</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H559\">spake</span> unto me in a <span class=\"wl wl-kjv\" data-code=\"H2472\">dream,</span> saying, <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob:</span> And I said,","12":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Lift <span class=\"wl wl-kjv\" data-code=\"H5375\">up</span> now thine <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes,</span> and <span class=\"wl wl-kjv\" data-code=\"H7200\">see,</span> all the <span class=\"wl wl-kjv\" data-code=\"H6260\">rams</span> which <span class=\"wl wl-kjv\" data-code=\"H5927\">leap</span> upon the <span class=\"wl wl-kjv\" data-code=\"H6629\">cattle</span> are <span class=\"wl wl-kjv\" data-code=\"H6124\">ringstraked,</span> <span class=\"wl wl-kjv\" data-code=\"H5348\">speckled,</span> and <span class=\"wl wl-kjv\" data-code=\"H1261\">grisled:</span> for I have <span class=\"wl wl-kjv\" data-code=\"H7200\">seen</span> all that <span class=\"wl wl-kjv\" data-code=\"H3837\">Laban</span> doeth","13":"I am the <span class=\"wl wl-kjv\" data-code=\"H410\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H1008\">Bethel,</span> where thou <span class=\"wl wl-kjv\" data-code=\"H4886\">anointedst</span> the <span class=\"wl wl-kjv\" data-code=\"H4676\">pillar,</span> and where thou <span class=\"wl wl-kjv\" data-code=\"H5087\">vowedst</span> a <span class=\"wl wl-kjv\" data-code=\"H5088\">vow</span> unto me: now <span class=\"wl wl-kjv\" data-code=\"H6965\">arise,</span> get thee <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> from this <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> and <span class=\"wl wl-kjv\" data-code=\"H7725\">return</span> unto the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of thy kindred.","14":"And <span class=\"wl wl-kjv\" data-code=\"H7354\">Rachel</span> and <span class=\"wl wl-kjv\" data-code=\"H3812\">Leah</span> <span class=\"wl wl-kjv\" data-code=\"H6030\">answered</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, Is there yet any <span class=\"wl wl-kjv\" data-code=\"H2506\">portion</span> or <span class=\"wl wl-kjv\" data-code=\"H5159\">inheritance</span> for us in our <span class=\"wl wl-kjv\" data-code=\"H1\">father's</span> house?","15":"Are we not <span class=\"wl wl-kjv\" data-code=\"H2803\">counted</span> of him <span class=\"wl wl-kjv\" data-code=\"H5237\">strangers?</span> for he hath <span class=\"wl wl-kjv\" data-code=\"H4376\">sold</span> us, and hath <span class=\"wl wl-kjv\" data-code=\"H398\">quite</span> <span class=\"wl wl-kjv\" data-code=\"H398\">devoured</span> also our money.","16":"For all the <span class=\"wl wl-kjv\" data-code=\"H6239\">riches</span> which <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> hath <span class=\"wl wl-kjv\" data-code=\"H5337\">taken</span> from our <span class=\"wl wl-kjv\" data-code=\"H1\">father,</span> that is ours, and our <span class=\"wl wl-kjv\" data-code=\"H1121\">children's:</span> now then, whatsoever <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> hath <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto thee, do.","17":"Then <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> rose <span class=\"wl wl-kjv\" data-code=\"H6965\">up,</span> and <span class=\"wl wl-kjv\" data-code=\"H5375\">set</span> his <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> and his <span class=\"wl wl-kjv\" data-code=\"H802\">wives</span> upon camels;","18":"And he carried <span class=\"wl wl-kjv\" data-code=\"H5090\">away</span> all his <span class=\"wl wl-kjv\" data-code=\"H4735\">cattle,</span> and all his <span class=\"wl wl-kjv\" data-code=\"H7399\">goods</span> which he had <span class=\"wl wl-kjv\" data-code=\"H7408\">gotten,</span> the <span class=\"wl wl-kjv\" data-code=\"H4735\">cattle</span> of his <span class=\"wl wl-kjv\" data-code=\"H7075\">getting,</span> which he had <span class=\"wl wl-kjv\" data-code=\"H7408\">gotten</span> in <span class=\"wl wl-kjv\" data-code=\"H6307\">Padanaram,</span> for to <span class=\"wl wl-kjv\" data-code=\"H935\">go</span> to <span class=\"wl wl-kjv\" data-code=\"H3327\">Isaac</span> his <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of Canaan.","19":"And <span class=\"wl wl-kjv\" data-code=\"H3837\">Laban</span> <span class=\"wl wl-kjv\" data-code=\"H1980\">went</span> to <span class=\"wl wl-kjv\" data-code=\"H1494\">shear</span> his <span class=\"wl wl-kjv\" data-code=\"H6629\">sheep:</span> and <span class=\"wl wl-kjv\" data-code=\"H7354\">Rachel</span> had <span class=\"wl wl-kjv\" data-code=\"H1589\">stolen</span> the <span class=\"wl wl-kjv\" data-code=\"H8655\">images</span> that were her father's.","20":"And <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> stole <span class=\"wl wl-kjv\" data-code=\"H1589\">away</span> <span class=\"wl wl-kjv\" data-code=\"H3820\">unawares</span> to <span class=\"wl wl-kjv\" data-code=\"H3837\">Laban</span> the <span class=\"wl wl-kjv\" data-code=\"H761\">Syrian,</span> in <span class=\"wl wl-kjv\" data-code=\"H5921\">that</span> he <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> him <span class=\"wl wl-kjv\" data-code=\"H1097\">not</span> that he fled.","21":"So he <span class=\"wl wl-kjv\" data-code=\"H1272\">fled</span> with all that he had; and he rose <span class=\"wl wl-kjv\" data-code=\"H6965\">up,</span> and passed <span class=\"wl wl-kjv\" data-code=\"H5674\">over</span> the <span class=\"wl wl-kjv\" data-code=\"H5104\">river,</span> and <span class=\"wl wl-kjv\" data-code=\"H7760\">set</span> his <span class=\"wl wl-kjv\" data-code=\"H6440\">face</span> toward the <span class=\"wl wl-kjv\" data-code=\"H2022\">mount</span> Gilead.","22":"And it was <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> <span class=\"wl wl-kjv\" data-code=\"H3837\">Laban</span> on the <span class=\"wl wl-kjv\" data-code=\"H7992\">third</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> that <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> was fled.","23":"And he <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> his <span class=\"wl wl-kjv\" data-code=\"H251\">brethren</span> with him, and <span class=\"wl wl-kjv\" data-code=\"H7291\">pursued</span> after <span class=\"wl wl-kjv\" data-code=\"H310\">him</span> <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days'</span> <span class=\"wl wl-kjv\" data-code=\"H1870\">journey;</span> and they <span class=\"wl wl-kjv\" data-code=\"H1692\">overtook</span> him in the <span class=\"wl wl-kjv\" data-code=\"H2022\">mount</span> Gilead.","24":"And <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to <span class=\"wl wl-kjv\" data-code=\"H3837\">Laban</span> the <span class=\"wl wl-kjv\" data-code=\"H761\">Syrian</span> in a <span class=\"wl wl-kjv\" data-code=\"H2472\">dream</span> by <span class=\"wl wl-kjv\" data-code=\"H3915\">night,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, Take <span class=\"wl wl-kjv\" data-code=\"H8104\">heed</span> that thou <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> not <span class=\"wl wl-kjv\" data-code=\"H5973\">to</span> <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> either <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> <span class=\"wl wl-kjv\" data-code=\"H5704\">or</span> bad.","25":"Then <span class=\"wl wl-kjv\" data-code=\"H3837\">Laban</span> <span class=\"wl wl-kjv\" data-code=\"H5381\">overtook</span> <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob.</span> Now <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> had <span class=\"wl wl-kjv\" data-code=\"H8628\">pitched</span> his <span class=\"wl wl-kjv\" data-code=\"H168\">tent</span> in the <span class=\"wl wl-kjv\" data-code=\"H2022\">mount:</span> and <span class=\"wl wl-kjv\" data-code=\"H3837\">Laban</span> with his <span class=\"wl wl-kjv\" data-code=\"H251\">brethren</span> <span class=\"wl wl-kjv\" data-code=\"H8628\">pitched</span> in the <span class=\"wl wl-kjv\" data-code=\"H2022\">mount</span> of Gilead.","26":"And <span class=\"wl wl-kjv\" data-code=\"H3837\">Laban</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob,</span> What hast thou <span class=\"wl wl-kjv\" data-code=\"H6213\">done,</span> that thou hast stolen <span class=\"wl wl-kjv\" data-code=\"H1589\">away</span> <span class=\"wl wl-kjv\" data-code=\"H3824\">unawares</span> to me, and carried <span class=\"wl wl-kjv\" data-code=\"H5090\">away</span> my <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters,</span> as <span class=\"wl wl-kjv\" data-code=\"H7617\">captives</span> taken with the sword?","27":"Wherefore didst thou flee <span class=\"wl wl-kjv\" data-code=\"H1272\">away</span> <span class=\"wl wl-kjv\" data-code=\"H2244\">secretly,</span> and steal <span class=\"wl wl-kjv\" data-code=\"H1589\">away</span> from me; and didst not <span class=\"wl wl-kjv\" data-code=\"H5046\">tell</span> me, that I might have sent thee <span class=\"wl wl-kjv\" data-code=\"H7971\">away</span> with <span class=\"wl wl-kjv\" data-code=\"H8057\">mirth,</span> and with <span class=\"wl wl-kjv\" data-code=\"H7892\">songs,</span> with <span class=\"wl wl-kjv\" data-code=\"H8596\">tabret,</span> and with harp?","28":"And hast not <span class=\"wl wl-kjv\" data-code=\"H5203\">suffered</span> me to <span class=\"wl wl-kjv\" data-code=\"H5401\">kiss</span> my <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> and my <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters?</span> thou hast now done <span class=\"wl wl-kjv\" data-code=\"H5528\">foolishly</span> in so doing.","29":"It <span class=\"wl wl-kjv\" data-code=\"H3426\">is</span> in the <span class=\"wl wl-kjv\" data-code=\"H410\">power</span> of my <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> to <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> you <span class=\"wl wl-kjv\" data-code=\"H7451\">hurt:</span> but the <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of your <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> <span class=\"wl wl-kjv\" data-code=\"H559\">spake</span> unto me <span class=\"wl wl-kjv\" data-code=\"H570\">yesternight,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Take thou <span class=\"wl wl-kjv\" data-code=\"H8104\">heed</span> that thou speak <span class=\"wl wl-kjv\" data-code=\"H1696\">not</span> to <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> either <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> or bad.","30":"And now, though thou wouldest <span class=\"wl wl-kjv\" data-code=\"H1980\">needs</span> be <span class=\"wl wl-kjv\" data-code=\"H1980\">gone,</span> because thou <span class=\"wl wl-kjv\" data-code=\"H3700\">sore</span> <span class=\"wl wl-kjv\" data-code=\"H3700\">longedst</span> after thy <span class=\"wl wl-kjv\" data-code=\"H1\">father's</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> yet wherefore hast thou <span class=\"wl wl-kjv\" data-code=\"H1589\">stolen</span> my gods?","31":"And <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> <span class=\"wl wl-kjv\" data-code=\"H6030\">answered</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to <span class=\"wl wl-kjv\" data-code=\"H3837\">Laban,</span> Because I was <span class=\"wl wl-kjv\" data-code=\"H3372\">afraid:</span> for I <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H6435\">Peradventure</span> thou wouldest take by <span class=\"wl wl-kjv\" data-code=\"H1497\">force</span> thy daughters","32":"With <span class=\"wl wl-kjv\" data-code=\"H834\">whomsoever</span> thou <span class=\"wl wl-kjv\" data-code=\"H4672\">findest</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">gods,</span> let him not <span class=\"wl wl-kjv\" data-code=\"H2421\">live:</span> <span class=\"wl wl-kjv\" data-code=\"H5048\">before</span> our <span class=\"wl wl-kjv\" data-code=\"H251\">brethren</span> <span class=\"wl wl-kjv\" data-code=\"H5234\">discern</span> thou what is thine with me, and <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> it to thee. For <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> <span class=\"wl wl-kjv\" data-code=\"H3045\">knew</span> not that <span class=\"wl wl-kjv\" data-code=\"H7354\">Rachel</span> had stolen","33":"And <span class=\"wl wl-kjv\" data-code=\"H3837\">Laban</span> <span class=\"wl wl-kjv\" data-code=\"H935\">went</span> into <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob's</span> <span class=\"wl wl-kjv\" data-code=\"H168\">tent,</span> and into <span class=\"wl wl-kjv\" data-code=\"H3812\">Leah's</span> <span class=\"wl wl-kjv\" data-code=\"H168\">tent,</span> and into the <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H519\">maidservants'</span> <span class=\"wl wl-kjv\" data-code=\"H168\">tents;</span> but he <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> them not. Then went he <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> of <span class=\"wl wl-kjv\" data-code=\"H3812\">Leah's</span> <span class=\"wl wl-kjv\" data-code=\"H168\">tent,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">entered</span> into <span class=\"wl wl-kjv\" data-code=\"H7354\">Rachel's</span> tent.","34":"Now <span class=\"wl wl-kjv\" data-code=\"H7354\">Rachel</span> had <span class=\"wl wl-kjv\" data-code=\"H3947\">taken</span> the <span class=\"wl wl-kjv\" data-code=\"H8655\">images,</span> and <span class=\"wl wl-kjv\" data-code=\"H7760\">put</span> them in the <span class=\"wl wl-kjv\" data-code=\"H1581\">camel's</span> <span class=\"wl wl-kjv\" data-code=\"H3733\">furniture,</span> and <span class=\"wl wl-kjv\" data-code=\"H3427\">sat</span> upon them. And <span class=\"wl wl-kjv\" data-code=\"H3837\">Laban</span> <span class=\"wl wl-kjv\" data-code=\"H4959\">searched</span> all the <span class=\"wl wl-kjv\" data-code=\"H168\">tent,</span> but found","35":"And she <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to her <span class=\"wl wl-kjv\" data-code=\"H1\">father,</span> Let it not <span class=\"wl wl-kjv\" data-code=\"H2734\">displease</span> my <span class=\"wl wl-kjv\" data-code=\"H113\">lord</span> that I <span class=\"wl wl-kjv\" data-code=\"H3201\">cannot</span> rise <span class=\"wl wl-kjv\" data-code=\"H6965\">up</span> before <span class=\"wl wl-kjv\" data-code=\"H6440\">thee;</span> for the <span class=\"wl wl-kjv\" data-code=\"H1870\">custom</span> of <span class=\"wl wl-kjv\" ie boven, vs.9."},{"catchword":"zonen;","tekst":"Dat is, kinderen; gelijk elders dikwijls."}],"17":[{"catchword":"zonen en","tekst":"Of, kinderen."}],"18":[{"catchword":"het vee","tekst":"Hebr. het vee zijner bezitting."},{"catchword":"te Paddan-Aram","tekst":"Zie boven, Gen 25:20."}],"19":[{"catchword":"de terafim,","tekst":"Terafim zijn geweest een soort van beelden naar figuur van een mens gemaakt; 1Sa 19:13, 1Sa 19:16, tot afgoden, vs.30, 32, om die van toekomende dingen te vragen; Eze 21:21, en waardoor zij van den duivel antwoord kregen, naar waarheid of naar leugen; Zec 10:2. Van de terafim wordt ook gesproken Jdg 17:5, en Jdg 18:14, Jdg 18:17, Jdg 18:18, Jdg 18:20; 1Sa 15:23; 2Ki 23:24, en Hos 3:4. Deze terafim heeft Laban [hoewel de ware God hem niet onbekend was, boven, Gen 30:27, en in dit hoofdst. vs.24, 29], godsdienstige eer bewezen, willende aldus tezamen God en de afgoden dienen, of de kennis van den waren God gans door afgoderij in ongerechtigheid tenonder houden. Dit is de eerste plaats waar de Heilige Schrift van de afgoden spreekt, alhoewel zij er tevoren lang geweest zijn."}],"20":[{"catchword":"ontstal","tekst":"Dat is, hij ging heimelijk en steelsgewijze buiten Labans weten en kennis weg, gelijk de volgende woorden verklaren; ook vs.26,27. In zulk een zin wordt deze manier van spreken ook gebruikt, 2Sa 19:3, maar in een anderen zin wordt zij gevonden 2Sa 15:6. De reden van dit haastig en stil vertrek schijnt geweest te zijn Gods ingeven en uitdrukkelijk bevel, vs.13."}],"21":[{"catchword":"de rivier,","tekst":"Te weten, Frath of Eufraat, vloeiende tussen Chaldeën en Kanaän, boven, Gen 2:14, en Gen 15:18, zonder bijvoeging van den eigennaam wordt hij de Rivier genaamd, om zijn grootte en vermaardheid, hier en Exo 23:31; Jos 24:2-3, enz."},{"catchword":"zette zijn","tekst":"Of, richtte, of stelde, dat is, hij besloot vastelijk den weg daarheen te nemen; zie Jer 50:5, en Luk 9:51, Luk 9:53."},{"catchword":"Gileads","tekst":"Een gebergte, gelegen achter Fenicië over de Jordaan, en grenzende aan het gebergte Libanon. Beneden dezen berg lag een zeer goed land, ook Gilead, of Galaad, genaamd vruchtbaar, en weiland; onder, Gen 37:25; Deu 34:1; Jer 8:22, en Jer 22:6. Dit land werd naderhand den Amorieten afgenomen, en ten dele gegeven aan de stammen van Gad en Ruben, en den halven stam van Manasse. Zie Num 32:1, enz; Deu 3:12-13, Deu 3:15-16; Jos 13:8-11, enz."}],"22":[{"catchword":"En ten","tekst":"Labans kudde was drie dagreizen van Jakobs kudde gelegen; bov. Gen 30:36."}],"23":[{"catchword":"broederen","tekst":"Dat is, bloedvrienden; en zo in het volgende."},{"catchword":"een weg","tekst":"Dat is, zeven dagreizen. Zie boven, Gen 30:36."}],"24":[{"catchword":"God kwam","tekst":"Te weten, eer hij Jakob achterhaalde, of bij hem kwam."},{"catchword":"in een droom","tekst":"Zie boven, Gen 20:3."},{"catchword":"noch goed,","tekst":"Hebr. van het goede tot het kwade, dat is, noch met goede, noch met kwade woorden zult gij hem van zijn reis afbrengen, maar laten hem in zijn reis voortgaan. Verg. boven, Gen 24:50."}],"25":[{"catchword":"geslagen","tekst":"Hebr. vastgemaakt, gehecht."}],"26":[{"catchword":"u van mijn","tekst":"Zie boven, vs.20."},{"catchword":"als gevangenen","tekst":"Dat is, die met geweld en tegen haar wil weggevoerd worden; hetwelk Laban ten onrechte Jakob verwijt. Zie boven, vs.14-16."}],"27":[{"catchword":"Waarom zijt","tekst":"Hebr. waarom hebt gij u verborgen om te vluchten?"},{"catchword":"hebt u","tekst":"Dat is, waarom zijt gij steelsgewijze, buiten mijn weten, van mij weggetrokken? Verg. dit met vs.20. Anders, aldus: hebt mij bestolen, of mij gestolen, dat is, het mijne gestolen."},{"catchword":"geleid had","tekst":"Zie boven, Gen 18:16."},{"catchword":"harp?","tekst":"Zie Gen 4:21."}],"28":[{"catchword":"te kussen;","tekst":"Zie boven, Gen 29:13."}],"29":[{"catchword":"of goed,","tekst":"Zie boven, vs.24."}],"30":[{"catchword":"gij hebt","tekst":"Hebr. gij zijt gaande gegaan."},{"catchword":"zozeer","tekst":"Hebr. begerende begeert hebt."},{"catchword":"waarom hebt","tekst":"Een grote verblindheid in Laban, dat hij zijn beelden voor goden houdt, die men hem nochtans, naar zijn mening, kon ontstelen; verg. boven, vs.19."}],"31":[{"catchword":"ik zeide","tekst":"Te weten, bij mijzelven, dat is, ik dacht. Zie boven, Gen 20:11. Anders, ik zeide tot mijn huisvrouwen, of tot mijn huisgezin."},{"catchword":"mij ontweldigdet","tekst":"Hebr. van met mij."}],"32":[{"catchword":"onderken","tekst":"Hebr. onderken voor u. Zie boven Gen 12:1."},{"catchword":"wat bij mij","tekst":"Te weten, van uw goederen."}],"34":[{"catchword":"kemelszadeltuig","tekst":"Anders, strooisel."}],"35":[{"catchword":"Dat de toorn","tekst":"Dat is, dat mijn heer niet bevangen worde door gramschap; die zich in de ogen pleegt te openbaren."},{"catchword":"het gaat","tekst":"Hebr. mij is der vrouwen weg."}],"36":[{"catchword":"dat gij mij","tekst":"Hebr. dat gij gebrand hebt achter mij, het woord betekent dikwijls iemand met een brandend, heftig, grimmig en vijandig gemoed vervolgen, gelijk 1Sa 17:53; Psa 10:2, Lam 4:19."}],"37":[{"catchword":"al mijn","tekst":"Hebr. Al mijn vaten, en zo straks, van al de vaten van uw huis."}],"39":[{"catchword":"ik heb het","tekst":"Dat Jakob Laban heeft moeten vergoeden wat de wilde beesten verscheurd hadden, was onbillijk en tegen de wet; Exo 22:13."}],"40":[{"catchword":"week","tekst":"Anders, vluchtte, of vlood, dezelfde manier van spreken vindt men ook Est 6:1."}],"41":[{"catchword":"Ik ben nu","tekst":"Hebr. dit zijn mijn twintig jaren in uw huis."},{"catchword":"om uw kudde;","tekst":"Dat is, om zulk een gedeelte der kudde als mij, volgens ons verdrag, ten loon zou vallen."},{"catchword":"gij hebt","tekst":"Zie boven, vs.7."}],"42":[{"catchword":"de vreze","tekst":"Dat is, God, die mijn vader Izak met groten eerbied en godvruchtigheid dient. Alzo wordt God genoemd onze vreze, Isa 8:13, omdat Hij met een kinderlijke vreze door ons gevreesd moet zijn."},{"catchword":"aangezien,","tekst":"Het zien van God betekent zijn tegenwoordige weldaad, gelijk boven, Gen 16:13, en Gen 29:32; Exo 3:7, Exo 3:9; Psa 31:8, en hier; of zijn straf, boven, Gen 11:5; 1Ch 12:17, enz."}],"43":[{"catchword":"wat zou ik","tekst":"Dat is, hoe zou ik daartoe komen, dat ik haar kwaad zou doen, daar het mijn eigen vlees en bloed is; hij gelaat zich vriendschap te zoeken, ziende dat hij niet vermocht Jakob en de zijnen enig leed aan te doen. Dit was het beleid des Heeren, die Laban tot dat einde verschenen was."},{"catchword":"zonen, die zij","tekst":"Anders, kinderen."}],"44":[{"catchword":"maken, ik","tekst":"Zie boven, Gen 15:18."}],"45":[{"catchword":"Toen nam","tekst":"Daarmede tonende dat hij alle klachten laat varen, en gewillig was het verbond aan te gaan."}],"46":[{"catchword":"zijn broederen","tekst":"Dat is, bloedverwanten, vrienden. Zie boven, vs.32, 37, en onder, vs.54."},{"catchword":"zij aten aldaar","tekst":"Te weten, na het maken en bevestigen van het verbond."}],"47":[{"catchword":"Jegar-Sahadutha;","tekst":"Dat is, in de Syrische taal, die Laban sprak, een hoop van getuigenis, betekenende het verbond, dat zij daar met elkander maakten."},{"catchword":"Gilead","tekst":"Hebr. Gales; deze naam betekent even hetzelfde in het Hebr. wat de voorgaande in het Syrisch betekent; want Jakob, die een Hebreër was, wilde ook in zijn spraak aan dezen steenhoop een naam geven."}],"48":[{"catchword":"Gilead","tekst":"Zodat deze naam, die Jakob in het Hebr. gegeven had, deze berg en het omliggende land bijgebleven is; gelijk hij ook tevoren door Mozes daarom aldus is genoemd; boven, vs.21, 23."}],"49":[{"catchword":"Mispa;","tekst":"Hebr. Mitspah, dat is, opzicht of toezichtplaats, of wachtplaats; omdat God [zoals volgt] de wacht en het toezicht zou hebben over het gemaakte verbond."},{"catchword":"de een van","tekst":"Hebr. de man van zijn naasten, of, vriend; dat is, wanneer wij nu zo ver van elkander zullen gescheiden zijn."}],"50":[{"catchword":"beledigt,","tekst":"Of, verdrukt."},{"catchword":"niemand is","tekst":"Dat is, er is niemand vreemds bij ons, die getuige kan zijn, en den overtreder straffen. Anders, niemand zal bij ons zijn, te weten, als wij van elkander zullen gescheiden zijn, dan God, enz."}],"52":[{"catchword":"dat ik tot","tekst":"Anders, indien ik, te weten, mij verongelijkt mocht houden en voorbij passeren, dat ik het niet doen zal in vijandschap, maar in het vriendelijke; en gij insgelijks. Of anders aldus: indien ik het ben, die hier passeren zal na u, dat ik het niet ten kwade zal doen, noch gij van gelijken."}],"53":[{"catchword":"De God Abrahams,","tekst":"Hij vermengt den God Abrahams, die de enige ware God is, met de afgoden, die Terah, Nahor, en Abraham zelfs vóór zijn bekering, in Chaldea gediend hadden, Jos 24:2; niet alleen om zich wat naar Jakob te voegen, maar ook als een afgodisch huichelaar, aan beide zijden te hinken. Anderen verstaan dat Laban op afgodische wijze aldus gesproken heeft; de goden Abrahams, en de goden Nahors, en de goden huns vaders, enz., met welke woorden Laban aan Jakob verwijt dat hij van de religie zijner voorvaders was afgetreden; en dat hier tegen gesteld wordt Jakobs eed, dien hij doet bij den waren God alleen."},{"catchword":"bij de vreze","tekst":"Zie boven, vs.42."}],"54":[{"catchword":"slachtte Jakob","tekst":"Te weten, slachtbeesten tot een vrolijken maaltijd. Het Hebreeuwse woord betekent wel offeren, maar ook slachten tot een maaltijd; gelijk 1Sa 28:24; 1Ki 1:9; 2Ch 18:2, enz."},{"catchword":"brood te","tekst":"Dat is, om den maaltijd te houden. Zie onder, Gen 37:25; Exo 18:12; 2Ki 6:22, en Luk 14:1, enz."}],"55":[{"catchword":"kuste zijn","tekst":"Zie boven, Gen 29:11."},{"catchword":"zegende hen;","tekst":"Dat is, hij wenste hun in het afscheid alle geluk en welvaart; gelijk dit gebruikelijk was wanneer de mensen elkander groetten, niet alleen bij het vertrekken, maar ook bij het komen. Zie onder, Gen 47:7, Gen 47:10; Rth 2:4; 1Sa 13:10; 2Sa 8:10."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Then heard the words of Labans sons saying Jacob hath taken away all that was our fathers and that of which our fathers he hath made up all his glory [that is all this wealth which usually is attached with honor and glory.]"}],"2":[{"catchword":null,"tekst":"Jacob likewise looked at the face of Laban and behold that was not towards him as yesterday [that is as formerly it was not towards him as yesterday [that I as formerly it was thus the same words are likewise tank below verse 5 and Exo 4:10 and 5.7,8 an 21.29 and Jos 3:4 an d4.18 &c.]"}],"3":[{"catchword":null,"tekst":"And the Lord said to Jacob return to the land of thy fathers [that is the land of Canaan which I promised to thy father Isaac and grandfather Abraham although as yet they possess nothing in it but the field and the cave wherein Sarah was buried] and thy kindred and I will be with thee [see above chapter 21.2 and 6.24item below 32.9 where Jacob doth declare these words.]"}],"5":[{"catchword":null,"tekst":"And he said to them I see your fathers face that it is not towards name as yesterday & ere yesterday yet the God of my fathers [ see above chapter 28.13] hath been with me [that is he appeared to me and commanded me to return into my own country see below verse 13.]"}],"6":[{"catchword":null,"tekst":"And ye know that I have served your father with all my might [as well of the mind with care and forecast as of the body by watching running drudging compare below verse 40 and 42.]"}],"7":[{"catchword":null,"tekst":"But your father hath dealt deceitfully with me [others hath mocked me] and hath changed my wages ten times [that oftentimes thus the word ten is often or frequently below verse 41 Lev 26:26 Num 14:22 and 1Sa 1:8 Job 19:3] yet God hath not permitted him to do me ill."}],"8":[{"catchword":null,"tekst":"whenever h said thus the speckled shall be thy wages then all the flock lambed or brought forth and speckled and whenever he said thus the ring straked shall be thy wages the flock lambed straked ones [observe here that the condition which Jacob made with Laban above chapter 30.32 were often altered through Labans greediness and the alteration long born through Jacobs meekness.]"}],"9":[{"catchword":null,"tekst":"Thus God withdraw all the cattle from your father and gave it to me [hence it appears that all the practice of Jacob did not proceed from any sinister and deceitful device of Jacob but from gods direction.]"}],"10":[{"catchword":null,"tekst":"and it happened at what time the flock was heated that I lifted up my eyes an did swain the dream [see above verse 5] and behold the he-goat [others rams it may be understood of both] which backed the flock were stracked speckled and bail-spotted [that is such a had spots of about the bigness and color of common hailstones distinguished from the speckled which had black stains upon the white skins.]"}],"11":[{"catchword":null,"tekst":"And the angel of God [understand the LORD Jesus Christ as appears above verse 5 and below verse 13] said to me in the dream Jacob and I said see here I am."}],"12":[{"catchword":null,"tekst":"Do but lift up thy eyes and behold the he goats which back the flock are straked and hail-spotted for I have seen all that Laban doth to thee."}],"13":[{"catchword":null,"tekst":"I am the God of Bethel [which did appear to thee at Bethel and promised to be with thee to keep thee and to bring thee back into Canaan] there thou didst set up the monuments where thou vowedst me a vow get thee up depart out of this land and return into the land of thy kindred [see above verse 3 and below verse 18.]"}],"14":[{"catchword":null,"tekst":"Then answered Rachel and Leah and said unto him is there a share yet for us or inheritance in our father&acirc;&euro;&trade;s house? [They imply none at all seeing he doth grudge the conditioned wages having so often changed and altered them.]"}],"15":[{"catchword":null,"tekst":"Are we not counted strangers of him?[ he hath not put us forth like daughters with honest dowries but thrust us forth like servants for hired wages]for he hath sold us [to wit for thy fourteen years service which indeed was a kind of sale] and he hath likewise still consumed or eaten up [Heb. Eating eaten that is continually and all along] our money [by this money they understand the fruit and gain of Jacobs service which Laban not only kept for them but also consumed and spent it for himself without imparting ought of it unto them.]"}],"16":[{"catchword":null,"tekst":"For the riches or wealth God hath withdrawn from our fathers [see above on verse 9] the same is ours and ours sons/ [that is children as frequently] now do all what God hath said unto thee."}],"17":[{"catchword":null,"tekst":"Then Jacob got himself up and put his sons [children] and his wives upon the camels."}],"18":[{"catchword":null,"tekst":"And he led away all his cattle and all his substance that he had gotten the cattle which he possess [Heb. Cattle of his possession ] which he had gotten at Paddan Aram [see above chapter 25.20] for to come to Isaac his father the land of Canaan."}],"19":[{"catchword":null,"tekst":"Laban now was going to share his sheep then Rachel stole his fathers Teraphram which her father had [ the teraphrim were a sort of image of the shape of men 1Sa 19:13,18 for idols Gen 31:30,32 to enquire of them of things to come Ezechiah 21.21 and by whom they were received the devil answer true or false Zachariah 10.2 of the teraphims you may likewise see Jud 17:5 and 18.14,17,18,20 1Sa 15:15 ,23 and 2Ki 23:24 and Hosiah 3.4 these teraphims Laban through otherwise the true God was not unknown to him above chapter 30 verse 7 and in this chapter verse 24 and 9 honored with divine worship endeavoring thus to serve God and the idols together or altogether to keep under the supress the worship of god through idoalatry in unrighteousness this is the first scripture makes mention of idols although they were in use long before.]"}],"20":[{"catchword":null,"tekst":"And Jacob stole himself away from the heart of Laban of Syrian [that is he got away secretly and stealingly as it were without Laban leave and privity as the following words declare and verse 26 and 27 in the sense the like phrase is also used 2Sa 19:3 but in another sense 2Sa 15:6 the reason and ground of his sudden and private withdrawing seemed to have been an instinct and express command from God verse 13] in as much as he had not made it known to him that he fled."}],"21":[{"catchword":null,"tekst":"And he fled and all that was his and he got him up and passed over the river [viz. Phrath or Euphrats running between Chaldea and Canaan above chapter 2.14and 15.18 without opposition of proper name the same is called the river for its greatness and same sake both here and Exo 23:31 Joshua24.2,3&c.] and he set his face [or directed or put that is he purposed and resolved to take away homewards see Jer 50:5 and Luk 19:51 and 53] to mount Gilead [lying behind Phenicia beyond Jordan and bordering on mount Libanus at the bottom of his mount here lay a very precious country likewise called Gilead being very fruitful and full of pasture below chapter 37.25 Deu 34:1 Jer 8:22 and 22.6 this ;land was afterwards taken from the Amorites and did fall in partition to the tribes of Gad and Reuben the tribe of Manasseh see Num 32:1 &c. Deu 3:12,13,15,16 Jos 13:8,9,10,11 &c.]"}],"22":[{"catchword":null,"tekst":"And the third day news was brought to Laban [whose stock was kept at three days from Jacobs above chapter 30.36] that Jacob was fled."}],"23":[{"catchword":null,"tekst":"Then he took his brethren with him [that is some of the kindred and kinsmen and so in the sequel] and pursued after him a way f seven days [that is seven days journey see above chapter 30 verses 36] and he apprehended him on mount Gilead."}],"24":[{"catchword":null,"tekst":"Yet God came to Laban [viz. before he took Jacob or was come up to him ] t /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});
