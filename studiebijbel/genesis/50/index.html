<style>
  :root {
    /* huisstijl overgenomen van andre-scholten.nl (Quartz) */
    --light:#ffffff; --lightgray:#e5e5e5; --gray:#b3b3b3; --darkgray:#333333; --dark:#111111;
    --secondary:#1a1a1a; --tertiary:#757575; --highlight:#1a1a1a1f; --textHighlight:#e0e0e088;
    --bodyFont:"Lora", system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --codeFont:"IBM Plex Mono", ui-monospace, monospace;
    /* aliassen zodat de bestaande regels de nieuwe kleuren gebruiken */
    --accent: var(--secondary); --accent-donker: var(--dark); --bg: var(--light);
    --bg-soft: #f5f5f5; --border: var(--lightgray); --tekst: var(--darkgray);
  }
  * { box-sizing: border-box; }
  body { font-family: var(--bodyFont); background: var(--bg); color: var(--tekst); margin: 0; line-height: 1.7; }
  .omslag { max-width: 900px; margin: 0 auto; padding: 1.2rem 1rem 4rem; }
  .site-header { text-align:center; width:100%; margin:1.4rem 0 .4rem; line-height: normal; }
  @media (min-width: 801px) { .site-header { margin-top: 4.8rem; } }
  .page-title { font-size:1.75rem; font-family:"Lora"; text-align:center; margin:0 0 .4rem; font-weight:700; }
  .page-title a { color:var(--secondary); text-decoration:none; background-color:transparent !important; }
  .page-title a:hover { color:var(--tertiary); }
  .site-subtitle { font-family:"Lora"; color:var(--secondary); letter-spacing:.04em; margin:0 0 1rem; font-size:1.05em; font-style:italic; line-height:1.6rem; }
  .site-nav { font-family:"Lora"; letter-spacing:.18em; text-transform:uppercase; border-top:1px solid var(--lightgray); border-bottom:1px solid var(--lightgray); margin:.8rem 0 2rem; padding:1rem 0; font-size:.82em; text-align:center; }
  .site-nav a { font-weight:500; color:var(--secondary); text-decoration:none; background:transparent !important; }
  .site-nav a:hover { color:var(--tertiary); text-decoration:underline; }
  .nav-sep { color:var(--gray); }
  .kruimel { font-family: "Lora"; font-size: .78rem; color: #999; margin: 1rem 0 .2rem; }
  .kruimel a { color: var(--accent); text-decoration: none; }
  h2.hfd { color: var(--dark); text-align: center; font-size: 1.75rem; font-weight: 700; margin: 2rem 0 0; }
  .ondertitel { text-align: center; color: #666666; font-style: italic; font-size: .95rem; margin-bottom: 1rem; }
  .hfdnav { display:flex; justify-content:space-between; align-items:center; gap:.6rem; flex-wrap:wrap; font-family:"Lora"; font-size:.85rem; padding:.5rem 0; margin-bottom:1.1rem; }
  .navknop { color:var(--accent); text-decoration:none; padding:.25rem .3rem; white-space:nowrap; }
  .navknop:hover { color:var(--accent-donker); text-decoration:underline; }
  .navknop.uit { color:#ccc; pointer-events:none; }
  .hfdnav .midden { display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:.4rem; color:#777; }
  .hfdnav select { font-family:"Lora"; font-size:.85rem; border:1px solid var(--border); border-radius:999px; padding:.3rem 1.6rem .3rem .8rem; background:#fff; color:var(--accent-donker); cursor:pointer; }

  .navselect { font-family:"Lora"; font-size:.85rem; border:1px solid var(--border); border-radius:999px; padding:.3rem 1.6rem .3rem .8rem; background:#fff; color:var(--accent-donker); cursor:pointer; display:inline-flex; align-items:center; text-decoration:none; }
  #bibliotheekknop { padding:.3rem .7rem; font-size:1rem; line-height:1; }
  /* mobiel (smal): natuurlijke DOM-volgorde boek→hoofdstuk→vertaling→lampje,
     wrapt dan als 'boek hoofdstuk' boven / 'vertaling lampje' onder */
  @media (min-width: 641px) {
    #vertaalkies { order: -1; }
  }

  /* verzen — tabsmodus (één kolom) */
  .vers { position: relative; display: flex; gap: .8rem; padding: .45rem 2.4rem .45rem .4rem; border-radius: 8px; cursor: pointer; }
  .vers:hover { background: var(--bg-soft); }
  .vers.open { background: var(--bg-soft); box-shadow: inset 3px 0 0 var(--accent); border-radius: 8px 8px 0 0; }
  .vers.flits { animation: flits 1.6s ease-out; }
  @keyframes flits { 0% { background: #e0e0e0; } 100% { background: var(--bg-soft); } }
  .vnr { color: #999999; font-size: .75rem; min-width: 1.6rem; text-align: right; padding-top: .45rem; font-family: "Lora"; }
  .vtekst em, .pcel em { font-style: italic; color: #555; }
  .wl { border-bottom: 1px dotted var(--accent); }
  .noot { color: var(--accent); cursor: pointer; font-weight: 700; padding: 0 .05rem; }
  .noot:hover { color: var(--accent-donker); }
  #notenlijst { margin: 1.5rem 0 0 2.4rem; font-family: "Lora"; font-size: .82rem; color: #666; border-top: 1px solid var(--border); padding-top: .8rem; }
  #notenlijst h3 { font-size: .78rem; text-transform: uppercase; letter-spacing: .12em; color: var(--accent-donker); margin: 0 0 .5rem; }
  #notenlijst .nootregel { margin: .25rem 0; }
  #notenlijst .nootregel .nn { color: var(--accent); font-weight: 700; margin-right: .35rem; }
  .kopieer { position: absolute; right: .4rem; top: .55rem; opacity: 0; border: none; background: none; cursor: pointer; color: var(--accent); font-size: .95rem; padding: .1rem .3rem; transition: opacity .15s; }
  .vers:hover .kopieer { opacity: .75; }
  .kopieer:hover { opacity: 1 !important; }

  /* parallelmodus (kolommen naast elkaar) */
  #bijbel.parallel .vers { display:grid; gap:.8rem; cursor:pointer; align-items:start; }
  #bijbel.parallel .vnr { grid-row: 1; }
  .kolomkop { display:none; }
  #bijbel.parallel + .kolomkop, .kolomkop.tonen { }
  .pk { font-family:"Lora"; font-size:.72rem; text-transform:uppercase; letter-spacing:.12em; color:var(--accent-donker); font-weight:700; }
  #bijbel.parallel .pcel em { font-style:italic; color:#555; }

  /* naslagpaneel */
  .paneel { display: none; margin: 0 0 .6rem 0; background: #fff; box-shadow: inset 3px 0 0 var(--accent); border-radius: 0 0 8px 8px; padding: .9rem 1.1rem 1rem; font-family: "Lora"; font-size: 1rem; }
  .paneel.open { display: block; }
  .ntabs { display: flex; gap: .4rem; margin-bottom: .8rem; }
  .ntab { border: 1px solid var(--border); background: var(--bg-soft); border-radius: 6px 6px 0 0; padding: .28rem .95rem; cursor: pointer; font-size: .8rem; color: #666; }
  .ntab.actief { background: var(--accent); color: #fff; border-color: var(--accent); }
  .ntab.leeg { opacity: .4; cursor: default; }
  .tsk-kop { font-weight: 700; color: var(--accent-donker); margin: .55rem 0 .3rem; font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; }
  .verg-kop { font-family:"Lora"; font-weight: 700; color: var(--accent-donker); font-size: 1.05rem; margin: 0 0 .6rem; padding-bottom: .35rem; border-bottom: 2px solid var(--accent); }
  .bu-lijst { list-style: disc; margin: .2rem 0 0 1.2rem; padding: 0; }

  .uitleg-bron { border-bottom: 1px solid var(--bg-soft); padding: .3rem 0; }

  .opener { display: block; cursor: pointer; font-weight: 600; color: var(--accent-donker); padding: .2rem 0; }
  .opener:hover { color: var(--accent); }
  .opener::before { content: '▸ '; font-size: .75em; }
  .opener.open::before { content: '▾ '; }
  .smoothOpen { max-height: 0; overflow: hidden; transition: max-height .25s ease; }
  .smoothOpen.open { max-height: 4000px; }
  .uitleg-item { margin: .5rem 0; font-family: Lora, serif; }
  .uitleg-cw { font-weight: 700; color: var(--accent-donker); margin-right: .3rem; }
  .uitleg-brontekst { font-family: Lora, serif; font-style: italic; color: #333333; background: var(--bg-soft); border-left: 3px solid var(--accent); padding: .5rem .8rem; margin: 0 0 .7rem; border-radius: 0 6px 6px 0; }
  .kt-nr { font-style: normal; font-weight: 700; color: var(--accent-donker); }
  .tsk-sub { font-weight: 600; color: #444; margin: .5rem 0 .2rem; }
  .refchip { font-family: "Lora", serif; font-size: .85rem; color: var(--tertiary); text-decoration: none; border-bottom: 1px dotted var(--tertiary); cursor: pointer; }
  .refchip:hover { color: var(--dark); border-bottom-color: var(--dark); }
  .onderwerp { padding:.45rem 0; border-bottom:1px solid var(--bg-soft); }
  .onderwerp .okop { margin-bottom:.25rem; }
  .onderwerp .naam { font-weight: 700; color: var(--accent-donker); }
  a.ondlink { text-decoration: none; background: transparent !important; cursor: pointer; color: var(--accent-donker); font-weight: 400; }
  a.ondlink:hover { text-decoration: underline; }
  .ond-topic { margin: .7rem 0; }
  .ond-subs { margin: .25rem 0 0 1.2rem; padding-left: 1rem; list-style: disc; color: #333333; }
  .ond-subs .ond-subs { list-style: circle; }
  .ond-subs li { margin: .4rem 0; }
  .ond-label { color: #333333; }
  .ond-refs { margin: .3rem 0 0; }
  .ond-refs .alle { display: inline; }
  .ond-refs .alle summary { display: inline-block; cursor: pointer; color: var(--accent); font-size: .8rem; margin: .1rem 0; }
  .onderwerp .label { font-style: italic; color: #666; }
  .ondrefs { line-height:1.9; margin-top:.4rem; }
  .meer { font-size:.72rem; color:#999; margin-left:.3rem; }
  .schakelnav { display:flex; align-items:center; gap:.6rem; flex-wrap:wrap; }
  .schakelnav .pos { font-size:.75rem; color:#999; }
  .alle > summary { font-size:.75rem; color:var(--accent); cursor:pointer; margin-top:.35rem; list-style:none; }
  .alle > summary::-webkit-details-marker { display:none; }
  .alle > summary:hover { text-decoration:underline; }
  .bronregel { font-size:.72rem; color:#999; margin-top:.6rem; }

  #toast.zichtbaar { opacity: 1; }
  .site-footer { font-family:"Lora"; display:grid; grid-template-columns: 1fr 1fr 1fr; gap:1.5rem; max-width:700px; margin:3rem auto 0; padding:2rem 1.5rem 0; border-top:1px solid var(--lightgray); font-size:.85em; }
  .site-footer-col { display:flex; flex-direction:column; gap:.5rem; }
  .site-footer-mid { text-align:center; }
  .site-footer-right { text-align:right; }
  .site-footer a { color:var(--secondary); text-decoration:underline; }
  .site-footer .footer-plain { color:var(--gray); }

  footer.site { margin-top: 2.5rem; margin-bottom: -3rem; border-top: 1px solid var(--border); padding-top: 1rem; text-align: center; font-family: "Lora"; font-size: .72rem; color: #999; line-height: 1.7; }
  @media (max-width: 640px) { .omslag { padding: .6rem .7rem 3rem; } header.site h1 { font-size: 1.5rem; } }
</style>

f op het gezicht van zijn vader, en hij weende over hem, en kuste hem.","2":"En Jozef gebood zijn knechten, de artsen, dat zij zijn vader balsemen zouden; en de artsen balsemden Israël.","3":"En veertig dagen werden aan hem vervuld; want zo worden de dagen vervuld van hen die gebalsemd worden; en de Egyptenaars beweenden hem zeventig dagen.","4":"Toen de dagen van het bewenen van hem voorbij waren, sprak Jozef tot het huis van Farao en zei: Als ik nu genade gevonden heb in uw ogen, spreekt toch voor de oren van Farao, en zeg:","5":"Mijn vader heeft mij doen zweren en gezegd: Zie, ik sterf; in mijn graf, dat ik mij in het land Kanaän gegraven heb, daar zult u mij begraven! Nu dan, laat mij toch optrekken, dat ik mijn vader kan begraven, dan zal ik terugkomen.","6":"En Farao zei: Trek op en begraaf uw vader, zoals hij u heeft doen zweren.","7":"En Jozef trok op, om zijn vader te begraven; en met hem trokken op alle knechten van Farao, de oudsten van zijn huis, en al de oudsten van het land Egypte;","8":"Daarbij het hele huis van Jozef, en zijn broeders, en het huis van zijn vader; alleen hun kleine kinderen, en hun schapen, en hun runderen lieten zij in het land Gosen.","9":"En met hem trokken op, zowel wagens als ruiters; en het was een zeer zwaar leger.","10":"Toen zij nu bij het plein van het doornbos kwamen, dat aan de overzijde van de Jordaan is, hielden zij daar een grote en zeer zware rouwklacht; en hij maakte voor zijn vader een rouw van zeven dagen.","11":"Toen de inwoners van het land, de Kanaänieten, die rouw zagen op het plein van het doornbos, zeiden zij: Dit is een zware rouw van de Egyptenaars; daarom noemde men haar naam Abel-mizraim, dat aan de overzijde van de Jordaan is.","12":"En zijn zonen deden hem, zoals hij hun geboden had;","13":"Want zijn zonen voerden hem naar het land Kanaän, en begroeven hem in de spelonk van de akker van Machpela, welke Abraham met de akker gekocht had tot een erfbegrafenis van Efron, de Hethiet, tegenover Mamre.","14":"Daarna keerde Jozef terug naar Egypte, hij en zijn broeders, en allen die met hem opgetrokken waren om zijn vader te begraven, nadat hij zijn vader begraven had.","15":"Toen Jozefs broeders zagen dat hun vader dood was, zeiden zij: Misschien zal Jozef ons haten, en zal hij ons zeker vergelden al het kwaad, dat wij hem aangedaan hebben.","16":"Daarom stuurden zij een boodschapper naar Jozef, en zeiden: Uw vader heeft voor zijn dood bevolen en gezegd:","17":"Zo moet u tot Jozef zeggen: Ach, vergeef toch de overtreding van uw broeders, en hun zonde; want zij hebben u kwaad aangedaan; maar nu, vergeef toch de overtreding van de dienaren van de God van uw vader! En Jozef weende toen zij tot hem spraken.","18":"Daarna kwamen ook zijn broeders, en vielen voor hem neder, en zeiden: Zie, wij zijn u tot knechten!","19":"En Jozef zei tot hen: Vreest niet; want ben ik in de plaats van God?","20":"U wel, u hebt kwaad tegen mij gedacht; *doch* God heeft dat ten goede gedacht; opdat Hij deed, zoals het op deze dag is, om een groot volk in het leven te behouden.","21":"Nu dan, vreest niet! Ik zal u en uw kleine kinderen onderhouden. Zo troostte hij hen, en sprak naar hun hart.","22":"Jozef dan woonde in Egypte, hij en het huis van zijn vader; en Jozef leefde honderdtien jaar.","23":"En Jozef zag van Efraïm kinderen, van het derde geslacht; ook werden de zonen van Machir, de zoon van Manasse, op de knieën van Jozef geboren.","24":"En Jozef zei tot zijn broeders: Ik sterf; maar God zal u zeker bezoeken, en Hij zal u doen optrekken uit dit land, naar het land, dat Hij aan Abraham, Izak en Jakob gezworen heeft.","25":"En Jozef deed de zonen van Israël zweren en zei: God zal u zeker bezoeken, zo zult u mijn beenderen van hier opvoeren!","26":"En Jozef stierf, honderdtien jaar oud zijnde; en zij balsemden hem, en men legde hem in een kist in Egypte."},"SV":{"1":"Toen viel Jozef op zijns vaders aangezicht, en hij weende over hem, en kuste hem.","2":"En Jozef gebood zijn knechten, den medicijnmeesters, dat zij zijn vader balsemen zouden; en de medicijnmeesters balsemden Israël.","3":"En veertig dagen werden aan hem vervuld; want alzo werden vervuld de dagen dergenen, die gebalsemd werden; en de Egyptenaars beweenden hem zeventig dagen.","4":"Als nu de dagen zijns bewenens over waren, zo sprak Jozef tot het huis van Farao, zeggende: Indien ik nu genade gevonden heb in uw ogen, spreekt toch voor de oren van Farao, zeggende:","5":"Mijn vader heeft mij doen zweren, zeggende: Zie, ik sterf; in mijn graf, dat ik mij in het land Kanaän gegraven heb, daar zult gij mij begraven! Nu dan, laat mij toch optrekken, dat ik mijn vader begrave, dan zal ik wederkomen.","6":"En Farao zeide: Trek op en begraaf uw vader, gelijk als hij u heeft doen zweren.","7":"En Jozef toog op, om zijn vader te begraven; en met hem togen op alle Farao’s knechten, de oudsten van zijn huis, en al de oudsten des lands van Egypte;","8":"Daartoe het ganse huis van Jozef, en zijn broeders, en het huis zijns vaders; alleen hun kleine kinderen, en hun schapen, en hun runderen lieten zij in het land Gosen.","9":"En met hem togen op, zo wagenen als ruiteren; en het was een zeer zwaar heir.","10":"Toen zij nu aan het plein van het doornbos kwamen, dat aan gene zijde van de Jordaan is, hielden zij daar een grote en zeer zware rouwklage; en hij maakte zijn vader een rouw van zeven dagen.","11":"Als de inwoners des lands, de Kanaänieten, dien rouw zagen op het plein van het doornbos, zo zeiden zij: Dit is een zware rouw der Egyptenaren; daarom noemde men haar naam Abel-mizraim, die aan het veer van de Jordaan is.","12":"En zijn zonen deden hem, gelijk als hij hun geboden had;","13":"Want zijn zonen voerden hem in het land Kanaän, en begroeven hem in de spelonk des akkers van Machpela, welke Abraham met den akker gekocht had tot een erfbegrafenis van Efron, den Hethiet, tegenover Mamre.","14":"Daarna keerde Jozef weder in Egypte, hij en zijn broeders, en allen, die met hem opgetogen waren, om zijn vader te begraven, nadat hij zijn vader begraven had.","15":"Toen Jozefs broeders zagen, dat hun vader dood was, zo zeiden zij: Misschien zal ons Jozef haten, en hij zal ons gewisselijk vergelden al het kwaad, dat wij hem aangedaan hebben.","16":"Daarom ontboden zij aan Jozef, zeggende: Uw vader heeft bevolen voor zijn dood, zeggende:","17":"Zo zult gij tot Jozef zeggen: Ei, vergeef toch de overtreding uwer broederen, en hun zonde; want zij hebben u kwaad aangedaan; maar nu vergeef toch de overtreding der dienaren van den God uws vaders! En Jozef weende, als zij tot hem spraken.","18":"Daarna kwamen ook zijn broeders, en vielen voor hem neder, en zeiden: Zie, wij zijn u tot knechten!","19":"En Jozef zeide tot hen: Vreest niet; want ben ik in de plaats van God?","20":"Gijlieden wel, gij hebt kwaad tegen mij gedacht; *doch* God heeft dat ten goede gedacht; opdat Hij deed, gelijk het te dezen dage is, om een groot volk in het leven te behouden.","21":"Nu dan, vreest niet! Ik zal u en uw kleine kinderen onderhouden. Zo troostte hij hen, en sprak naar hun hart.","22":"Jozef dan woonde in Egypte, hij en het huis zijns vaders; en Jozef leefde honderd en tien jaren.","23":"En Jozef zag van Efraïm kinderen, van het derde gelid; ook werden de zonen van Machir, den zoon van Manasse, op Jozefs knieën geboren.","24":"En Jozef zeide tot zijn broederen: Ik sterf; maar God zal u gewisselijk bezoeken, en Hij zal u doen optrekken uit dit land, in het land, hetwelk hij aan Abraham, Izak en Jakob gezworen heeft.","25":"En Jozef deed de zonen van Israël zweren, zeggende: God zal u gewisselijk bezoeken, zo zult gij mijn beenderen van hier opvoeren!","26":"En Jozef stierf, honderd en tien jaren oud zijnde; en zij balsemden hem, en men leide hem in een kist in Egypte."},"KJV":{"1":"And Joseph fell upon his father's face, and wept upon him, and kissed","2":"And Joseph commanded his servants the physicians to embalm his father: and the physicians embalmed Israel.","3":"And forty days were fulfilled for him; for so are fulfilled the days of those which are embalmed: and the Egyptians mourned for him threescore and ten days.","4":"And when the days of his mourning were past, Joseph spake unto the house of Pharaoh, saying, If now I have found grace in your eyes, speak, I pray you, in the ears of Pharaoh, saying,","5":"My father made me swear, saying, Lo, I die: in my grave which I have digged for me in the land of Canaan, there shalt thou bury me. Now therefore let me go up, I pray thee, and bury my father, and I will come again.","6":"And Pharaoh said, Go up, and bury thy father, according as he made thee swear.","7":"And Joseph went up to bury his father: and with him went up all the servants of Pharaoh, the elders of his house, and all the elders of the land of Egypt,","8":"And all the house of Joseph, and his brethren, and his father's house: only their little ones, and their flocks, and their herds, they left in the land of Goshen.","9":"And there went up with him both chariots and horsemen: and it was a very great company.","10":"And they came to the threshingfloor of Atad, which *is* beyond Jordan, and there they mourned with a great and very sore lamentation: and he made a mourning for his father seven days.","11":"And when the inhabitants of the land, the Canaanites, saw the mourning in the floor of Atad, they said, This *is* a grievous mourning to the Egyptians: wherefore the name of it was called Abelmizraim, which *is* beyond Jordan.","12":"And his sons did unto him according as he commanded","13":"For his sons carried him into the land of Canaan, and buried him in the cave of the field of Machpelah, which Abraham bought with the field for a possession of a buryingplace of Ephron the Hittite, before Mamre.","14":"And Joseph returned into Egypt, he, and his brethren, and all that went up with him to bury his father, after he had buried his father.","15":"And when Joseph's brethren saw that their father was dead, they said, Joseph will peradventure hate us, and will certainly requite us all the evil which we did","16":"And they sent a messenger unto Joseph, saying, Thy father did command before he died, saying,","17":"So shall ye say unto Joseph, Forgive, I pray thee now, the trespass of thy brethren, and their sin; for they did unto thee evil: and now, we pray thee, forgive the trespass of the servants of the God of thy father. And Joseph wept when they spake","18":"And his brethren also went and fell down before his face; and they said, Behold, we *be* thy servants.","19":"And Joseph said unto them, Fear not: for *am* I in the place of God?","20":"But as for you, ye thought evil against me; *but* God meant it unto good, to bring to pass, as *it is* this day, to save much people alive.","21":"Now therefore fear ye not: I will nourish you, and your little ones. And he comforted them, and spake kindly","22":"And Joseph dwelt in Egypt, he, and his father's house: and Joseph lived an hundred and ten years.","23":"And Joseph saw Ephraim's children of the third *generation*: the children also of Machir the son of Manasseh were brought up upon Joseph's knees.","24":"And Joseph said unto his brethren, I die: and God will surely visit you, and bring you out of this land unto the land which he sware to Abraham, to Isaac, and to Jacob.","25":"And Joseph took an oath of the children of Israel, saying, God will surely visit you, and ye shall carry up my bones from hence.","26":"So Joseph died, *being* an hundred and ten years old: and they embalmed him, and he was put in a coffin in Egypt."}},"tsk":{"1":[{"kopje":"viel","refs":["Gen 46:4","Deut 6:7","Deut 6:8","Ef 6:4"]},{"kopje":"weende","refs":["Gen 23:2","2 Kon 13:14","Mark 5:38","Mark 5:39","Joh 11:35-38","Hand 8:2","1 Tess 4:13"]}],"2":[{"kopje":"balsemden","refs":["Gen 50:26","2 Kron 16:14","Matt 26:12","Mark 14:8","Mark 16:1","Luk 24:1","Joh 12:7","Joh 19:39","Joh 19:40"]}],"3":[{"kopje":"zeventig","refs":["Num 20:29","Deut 21:13","Deut 34:8"]}],"4":[{"kopje":"de oseph</span> <span class=\"wl wl-kjv\" data-code=\"H5307\">fell</span> upon his <span class=\"wl wl-kjv\" data-code=\"H1\">father's</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">face,</span> and <span class=\"wl wl-kjv\" data-code=\"H1058\">wept</span> upon him, and kissed","2":"And <span class=\"wl wl-kjv\" data-code=\"H3130\">Joseph</span> <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> his <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> the <span class=\"wl wl-kjv\" data-code=\"H7495\">physicians</span> to <span class=\"wl wl-kjv\" data-code=\"H2590\">embalm</span> his <span class=\"wl wl-kjv\" data-code=\"H1\">father:</span> and the <span class=\"wl wl-kjv\" data-code=\"H7495\">physicians</span> <span class=\"wl wl-kjv\" data-code=\"H2590\">embalmed</span> Israel.","3":"And <span class=\"wl wl-kjv\" data-code=\"H705\">forty</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> were <span class=\"wl wl-kjv\" data-code=\"H4390\">fulfilled</span> for him; for so are <span class=\"wl wl-kjv\" data-code=\"H4390\">fulfilled</span> the <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> of those which are <span class=\"wl wl-kjv\" data-code=\"H2590\">embalmed:</span> and the <span class=\"wl wl-kjv\" data-code=\"H4714\">Egyptians</span> <span class=\"wl wl-kjv\" data-code=\"H1058\">mourned</span> for him threescore and <span class=\"wl wl-kjv\" data-code=\"H7657\">ten</span> days.","4":"And when the <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> of his <span class=\"wl wl-kjv\" data-code=\"H1068\">mourning</span> were <span class=\"wl wl-kjv\" data-code=\"H5674\">past,</span> <span class=\"wl wl-kjv\" data-code=\"H3130\">Joseph</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> unto the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> If now I have <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> <span class=\"wl wl-kjv\" data-code=\"H2580\">grace</span> in your <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes,</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">speak,</span> I pray you, in the <span class=\"wl wl-kjv\" data-code=\"H241\">ears</span> of <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh,</span> saying,","5":"My <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> made me <span class=\"wl wl-kjv\" data-code=\"H7650\">swear,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H2009\">Lo,</span> I <span class=\"wl wl-kjv\" data-code=\"H4191\">die:</span> in my <span class=\"wl wl-kjv\" data-code=\"H6913\">grave</span> which I have <span class=\"wl wl-kjv\" data-code=\"H3738\">digged</span> for me in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H3667\">Canaan,</span> there shalt thou bury <span class=\"wl wl-kjv\" data-code=\"H6912\">me.</span> Now therefore let me go <span class=\"wl wl-kjv\" data-code=\"H5927\">up,</span> I pray thee, and <span class=\"wl wl-kjv\" data-code=\"H6912\">bury</span> my <span class=\"wl wl-kjv\" data-code=\"H1\">father,</span> and I will come again.","6":"And <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Go <span class=\"wl wl-kjv\" data-code=\"H5927\">up,</span> and <span class=\"wl wl-kjv\" data-code=\"H6912\">bury</span> thy <span class=\"wl wl-kjv\" data-code=\"H1\">father,</span> according as he made thee swear.","7":"And <span class=\"wl wl-kjv\" data-code=\"H3130\">Joseph</span> went <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> to <span class=\"wl wl-kjv\" data-code=\"H6912\">bury</span> his <span class=\"wl wl-kjv\" data-code=\"H1\">father:</span> and with him went <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> all the <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> of <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh,</span> the <span class=\"wl wl-kjv\" data-code=\"H2205\">elders</span> of his <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H2205\">elders</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of Egypt,","8":"And all the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H3130\">Joseph,</span> and his <span class=\"wl wl-kjv\" data-code=\"H251\">brethren,</span> and his <span class=\"wl wl-kjv\" data-code=\"H1\">father's</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house:</span> only their little <span class=\"wl wl-kjv\" data-code=\"H2945\">ones,</span> and their <span class=\"wl wl-kjv\" data-code=\"H6629\">flocks,</span> and their <span class=\"wl wl-kjv\" data-code=\"H1241\">herds,</span> they <span class=\"wl wl-kjv\" data-code=\"H5800\">left</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of Goshen.","9":"And there went <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> with him both <span class=\"wl wl-kjv\" data-code=\"H7393\">chariots</span> and <span class=\"wl wl-kjv\" data-code=\"H6571\">horsemen:</span> and it was a <span class=\"wl wl-kjv\" data-code=\"H3966\">very</span> <span class=\"wl wl-kjv\" data-code=\"H3515\">great</span> company.","10":"And they <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to the <span class=\"wl wl-kjv\" data-code=\"H1637\">threshingfloor</span> of <span class=\"wl wl-kjv\" data-code=\"H329\">Atad,</span> which is <span class=\"wl wl-kjv\" data-code=\"H5676\">beyond</span> <span class=\"wl wl-kjv\" data-code=\"H3383\">Jordan,</span> and there they <span class=\"wl wl-kjv\" data-code=\"H5594\">mourned</span> with a <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> and <span class=\"wl wl-kjv\" data-code=\"H3966\">very</span> <span class=\"wl wl-kjv\" data-code=\"H3515\">sore</span> <span class=\"wl wl-kjv\" data-code=\"H4553\">lamentation:</span> and he <span class=\"wl wl-kjv\" data-code=\"H6213\">made</span> a <span class=\"wl wl-kjv\" data-code=\"H60\">mourning</span> for his <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> days.","11":"And when the <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitants</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> the <span class=\"wl wl-kjv\" data-code=\"H3669\">Canaanites,</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> the <span class=\"wl wl-kjv\" data-code=\"H60\">mourning</span> in the <span class=\"wl wl-kjv\" data-code=\"H1637\">floor</span> of <span class=\"wl wl-kjv\" data-code=\"H329\">Atad,</span> they <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> This is a <span class=\"wl wl-kjv\" data-code=\"H3515\">grievous</span> <span class=\"wl wl-kjv\" data-code=\"H60\">mourning</span> to the <span class=\"wl wl-kjv\" data-code=\"H4714\">Egyptians:</span> wherefore the name of <span class=\"wl wl-kjv\" data-code=\"H8034\">it</span> was <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> <span class=\"wl wl-kjv\" data-code=\"H67\">Abelmizraim,</span> which is <span class=\"wl wl-kjv\" data-code=\"H5676\">beyond</span> Jordan.","12":"And his <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> unto him according as he commanded","13":"For his <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> <span class=\"wl wl-kjv\" data-code=\"H5375\">carried</span> him into the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H3667\">Canaan,</span> and <span class=\"wl wl-kjv\" data-code=\"H6912\">buried</span> him in the <span class=\"wl wl-kjv\" data-code=\"H4631\">cave</span> of the <span class=\"wl wl-kjv\" data-code=\"H7704\">field</span> of <span class=\"wl wl-kjv\" data-code=\"H4375\">Machpelah,</span> which <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham</span> <span class=\"wl wl-kjv\" data-code=\"H7069\">bought</span> with the <span class=\"wl wl-kjv\" data-code=\"H7704\">field</span> for a <span class=\"wl wl-kjv\" data-code=\"H272\">possession</span> of a <span class=\"wl wl-kjv\" data-code=\"H6913\">buryingplace</span> of <span class=\"wl wl-kjv\" data-code=\"H6085\">Ephron</span> the <span class=\"wl wl-kjv\" data-code=\"H2850\">Hittite,</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> Mamre.","14":"And <span class=\"wl wl-kjv\" data-code=\"H3130\">Joseph</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">returned</span> into <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> he, and his <span class=\"wl wl-kjv\" data-code=\"H251\">brethren,</span> and all that went <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> with him to <span class=\"wl wl-kjv\" data-code=\"H6912\">bury</span> his <span class=\"wl wl-kjv\" data-code=\"H1\">father,</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> he had <span class=\"wl wl-kjv\" data-code=\"H6912\">buried</span> his father.","15":"And when <span class=\"wl wl-kjv\" data-code=\"H3130\">Joseph's</span> <span class=\"wl wl-kjv\" data-code=\"H251\">brethren</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> that their <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> was <span class=\"wl wl-kjv\" data-code=\"H4191\">dead,</span> they <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H3130\">Joseph</span> will <span class=\"wl wl-kjv\" data-code=\"H3863\">peradventure</span> hate <span class=\"wl wl-kjv\" data-code=\"H7852\">us,</span> and will <span class=\"wl wl-kjv\" data-code=\"H7725\">certainly</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">requite</span> us all the <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> which we did","16":"And they sent a <span class=\"wl wl-kjv\" data-code=\"H6680\">messenger</span> unto <span class=\"wl wl-kjv\" data-code=\"H3130\">Joseph,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Thy <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> did <span class=\"wl wl-kjv\" data-code=\"H6680\">command</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> he <span class=\"wl wl-kjv\" data-code=\"H4194\">died,</span> saying,","17":"So shall ye <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> unto <span class=\"wl wl-kjv\" data-code=\"H3130\">Joseph,</span> <span class=\"wl wl-kjv\" data-code=\"H5375\">Forgive,</span> I pray <span class=\"wl wl-kjv\" data-code=\"H577\">thee</span> now, the <span class=\"wl wl-kjv\" data-code=\"H6588\">trespass</span> of thy <span class=\"wl wl-kjv\" data-code=\"H251\">brethren,</span> and their <span class=\"wl wl-kjv\" data-code=\"H2403\">sin;</span> for they <span class=\"wl wl-kjv\" data-code=\"H1580\">did</span> unto thee <span class=\"wl wl-kjv\" data-code=\"H7451\">evil:</span> and now, we pray thee, <span class=\"wl wl-kjv\" data-code=\"H5375\">forgive</span> the <span class=\"wl wl-kjv\" data-code=\"H6588\">trespass</span> of the <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> of the <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of thy <span class=\"wl wl-kjv\" data-code=\"H1\">father.</span> And <span class=\"wl wl-kjv\" data-code=\"H3130\">Joseph</span> <span class=\"wl wl-kjv\" data-code=\"H1058\">wept</span> when they spake","18":"And his <span class=\"wl wl-kjv\" data-code=\"H251\">brethren</span> also <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> and fell <span class=\"wl wl-kjv\" data-code=\"H5307\">down</span> before his <span class=\"wl wl-kjv\" data-code=\"H6440\">face;</span> and they <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Behold, we be thy servants.","19":"And <span class=\"wl wl-kjv\" data-code=\"H3130\">Jo wl wl-kjv\" data-code=\"H669\">Ephraim's</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of the <span class=\"wl wl-kjv\" data-code=\"H8029\">third</span> generation: the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> also of <span class=\"wl wl-kjv\" data-code=\"H4353\">Machir</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H4519\">Manasseh</span> were brought <span class=\"wl wl-kjv\" data-code=\"H3205\">up</span> upon <span class=\"wl wl-kjv\" data-code=\"H3130\">Joseph's</span> knees.","24":"And <span class=\"wl wl-kjv\" data-code=\"H3130\">Joseph</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto his <span class=\"wl wl-kjv\" data-code=\"H251\">brethren,</span> I <span class=\"wl wl-kjv\" data-code=\"H4191\">die:</span> and <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> will <span class=\"wl wl-kjv\" data-code=\"H6485\">surely</span> <span class=\"wl wl-kjv\" data-code=\"H6485\">visit</span> you, and bring you <span class=\"wl wl-kjv\" data-code=\"H5927\">out</span> of this <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> unto the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> which he <span class=\"wl wl-kjv\" data-code=\"H7650\">sware</span> to <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham,</span> to <span class=\"wl wl-kjv\" data-code=\"H3327\">Isaac,</span> and to Jacob.","25":"And <span class=\"wl wl-kjv\" data-code=\"H3130\">Joseph</span> took an <span class=\"wl wl-kjv\" data-code=\"H7650\">oath</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> will <span class=\"wl wl-kjv\" data-code=\"H6485\">surely</span> <span class=\"wl wl-kjv\" data-code=\"H6485\">visit</span> you, and ye shall carry <span class=\"wl  of the bewailing were past Joseph spake to the house of Pharaoh.[ understand the prince and counselors and friends of Pharaoh who were daily about his person for Joseph being in mourning himself he might not come in kings presence according to the custom of Egypt and other countries compare Est 4:2 ] saying if now I have found grace in your eyes [see above chapter 18 on verse 2] speak I pray before the ears of Pharaoh saying ."}],"5":[{"catchword":null,"tekst":"My father had made me swear saying behold I die[see above chapter 48 verse 21 and here below verse 24] in my grave which I have digged me in the land of Canaan [so did others likewise while they were alive yet cause their graves to be made ready against their dying time see 2Ch 16:14 Isa 22:16 Mat 27:60] there thou shalt bury me now then let me go up I pray that I may bury my father then shall I come again."}],"6":[{"catchword":null,"tekst":"And pharaoh said go up and bury thy father according as he had made thee swear."}],"7":[{"catchword":null,"tekst":"And Joseph went up for to bury his father and there went with him all [ that is a great many or the most part or all such as were not presently employed and could be spread from home compare Mat 3:5] Pharaoh&acirc;&euro;&trade;s servants [that is courtier gentlemen attendants see above chapter20 on verse 8] the most ancient [that is the counselors and senators and statesmen]of his house [that is court family see above chapter 34 on verse 19 ] and all the most ancient of the land of Egypt [that is the principal men the governors chief officers and over vulnerable person of the land.]"}],"8":[{"catchword":null,"tekst":"Besides the whole house of Joseph [that is all his family retinue servants and attendants compare the annotate on the verse foregoing and above chapter 7 on verse 1]and his brethren and the house of his father only their little children and their sheep and their oxen [that is their cattle both great and small and see above chapter 12 on verse 16] they left in the land of Gosen."}],"9":[{"catchword":null,"tekst":"And with him they went up as Charets as horsemen and it was a very heavy host [that is a great and numerous company thus we read of a heavy people Num 20:20 an d1Ki 3:9 which 2Ch 1:10 is explained a great people see likewise 1Ki 10:2 and 2Ki 6:14.]"}],"10":[{"catchword":null,"tekst":"now when they came to the plain of the thorn bush [understand here a plain champion field or country lying bare and open overgrown or perhaps hedged in with thorns or about which there grew a great quantity of thorn bushes the same word that is here rendered the thorn bush we find likewise Jud 9:14 and Psa 58:10 others retain the Hebrew word Atad as the proper name of this place ] that is which is on yonside [ viz. in regard of the place where Moseh was when he wrote this ] of the Jordan [see abovechapter13 on verse 10] where they kept a great and very heavy lamentation there very great and heavy] and he made his father a mourning there of seven days [that is Joseph appointed seven days of sitting and accommodating all things requisite for the solemnity of the mourning and funeral of his father see Ecc 22:13.]"}],"11":[{"catchword":null,"tekst":"When the inhabitants [Hebrews the inhabitants so by and by the Canaanites ] of the country the Canaanites saw this mourning in the plain of the thorn bush then said they this is an heavy mourning of the Egyptian and the mourning Egyptian or mourning Egypt.] which is by the foord of Jordan [see above verse 10.]"}],"12":[{"catchword":null,"tekst":"And his sons did unto him [viz. Jacob ] according as he had commanded them see above chapter 49.29.]"}],"13":[{"catchword":null,"tekst":"For his sons carried him into the land of Canaan and buried him in the cave of tehfield of Machpela [see above chapter 49.30 ] which Abraham had bought together with the field for an hereditary burying place of Ephron the Hethite over against Mamre[see above chapter 43 on verse 30.]"}],"14":[{"catchword":null,"tekst":"After that Joseph retuned into Egypt he and his brother and all that were gone up with him for to bury his father after that he had buried his father."}],"15":[{"catchword":null,"tekst":"When Josephs brethren saw that their father was dead they said peradventure Joseph will hate us and he shall assuredly requisite [Heb. Requiting requite or return] us all the evil we did him [Heb. Requited or returned him to wit for all those that are humble and submissive request and friendly entreaties where by when he was in our hands he besought us to spare him we rejecting them all see above chapter 42.21 and so below verse 17.]"}],"16":[{"catchword":null,"tekst":"Therefore they sent to Joseph [Heb. They charged to him that is they dispatched some persons to him whom they charged to acquaint Joseph with their apprehension and desires ] saying thy father hath given in charge before his death saying [they desire a full pardon of Josephs hands using four main arguments to enforce the grant thereof first that their father say they desired it before his death secondly because they were brethren thirdly they were sorry for and contested their sins fourthly because they were all of one religion.]"}],"17":[{"catchword":null,"tekst":"Thus shall ye say to Joseph forgive now I pray the trespass of thy brethren and their sins for they have done evil against thee but now I pray forgive the trespass of the servants of God for thy father [serving the same God with the whom hath commanded us to forgive one another&acirc;&euro;&trade;s trespass as we desire him to forgive ours see of the attribute here given to God above chapter 26 on verse 22,24 and chapter 31 on verse 42] and Joseph wept as they spake to him [doubtless because they spake in a very feeling term of a matter which he could not hear but be sensible of it the rather that he perceived thereby their apprehension and revenge and punishment and their instructing of his goodness.]"}],"18":[{"catchword":null,"tekst":"After that his brethren also came [viz. after they heard the report of their messengers whom they had sent to Joseph above verse 16] and fell down before him and said behold we are servants to thee."}],"19":[{"catchword":null,"tekst":"And Joseph said unto them fear not for I am in the place of God? [that is am I God that I should have power to do you any hurt or ill since God is pleased to do you good and preserve you by me?]"}],"20":[{"catchword":null,"tekst":"Ye indeed ye thought evil against me yet God thought that for Good to do as it is at this day [that is as is now apparent and manifest before all world] to save a great people alive ."}],"21":[{"catchword":null,"tekst":"Now fear not I shall maintain ye your little children thus he comforted them and spake according to their heart [see above chapter 34 on verse 3.]"}],"22":[{"catchword":null,"tekst":"Joseph then dwelt in Egypt he and his fathers house and Joseph lived an hundred and ten years."}],"23":[{"catchword":null,"tekst":"And Joseph saw the children of Ephraim of the third generation [Heb. Children of the third that is of the third generation that is children of children&acirc;&euro;&trade;s children see of the like blessing Job 42:15 and Psa 128:6 here begins the fulfilling of Jacobs prophesies above chapter48.19] also the sons of Machir Manasseh&acirc;&euro;&trade;s where born on Josephs knees [that is Joseph took pleasure in their infancy to let them sit upon his lap and dandle them after the manner of sporting with children compare above chapter 30.3.]"}],"24":[{"catchword":null,"tekst":"And Joseph said to his brethren I am dying [see above verse 5] but God shall assuredly visit you [Heb. Visiting visit you that is for certain viz. in mercy to do you good and to make good his promise unto you see above chapter 21 on verse1 and here the next verse ] and he shall make you to go up out of his land into the land which he hath sworn to Abraham Isaac and Jacob."}],"25":[{"catchword":null,"tekst":"and Joseph     `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');

    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
