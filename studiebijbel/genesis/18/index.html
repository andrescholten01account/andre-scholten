 hem bij de eikenbossen van Mamre, toen hij in de deur van de tent zat, op het heetst van de dag.","2":"En hij hief zijn ogen op en keek; en zie, daar stonden drie mannen tegenover hem; toen hij hen zag, liep hij hun tegemoet vanuit de deur van de tent, en boog zich tot op de grond.","3":"En hij zei: Heere! Als ik nu genade gevonden heb in Uw ogen, ga toch niet aan Uw knecht voorbij.","4":"Laat er toch een beetje water gebracht worden, en was Uw voeten, en rust onder deze boom.","5":"En ik zal een stuk brood halen, dat U Uw hart sterkt; daarna kunt U verdergaan, want daarom bent U immers[1] naar Uw knecht gekomen. En zij zeiden: Doe zoals u gesproken hebt.","6":"En Abraham haastte zich naar de tent, naar Sara, en zei: Haast u; kneed drie maten meelbloem en maak koeken.","7":"En Abraham liep naar de runderen, en nam een kalf, mals en goed, en gaf het aan de knecht, die zich haastte om het klaar te maken.","8":"En hij nam boter en melk, en het kalf dat hij klaargemaakt had, en zette het hun voor, en stond zelf bij hen onder de boom, en zij aten.","9":"Toen zeiden zij tegen hem: Waar is Sara, uw vrouw? En hij zei: Zie, in de tent.","10":"En Hij zei: Ik zal zeker bij u terugkomen, omstreeks deze tijd volgend jaar; en zie, Sara, uw vrouw, zal een zoon hebben! En Sara hoorde het aan de deur van de tent, die achter Hem was.","11":"Abraham nu en Sara waren oud en op leeftijd; het was Sara opgehouden te gaan naar de wijze van de vrouwen.","12":"Zo lachte Sara bij zichzelf en zei: Zal ik nog wellust hebben, nu ik oud geworden ben, en mijn heer ook oud is?","13":"En de HEERE zei tegen Abraham: Waarom heeft Sara gelachen en gezegd: Zou ik werkelijk nog een kind baren, nu ik oud geworden ben?","14":"Zou iets voor de HEERE te wonderlijk zijn? Op de vastgestelde tijd zal Ik bij u terugkomen, omstreeks deze tijd volgend jaar, en Sara zal een zoon hebben!","15":"En Sara ontkende het en zei: Ik heb niet gelachen; want zij was bang. En Hij zei: Nee! maar u hebt wel gelachen.","16":"Toen stonden die mannen daar op, en keken in de richting van Sodom; en Abraham ging met hen mee, om hen uit te geleide te doen.","17":"En de HEERE zei: Zal Ik voor Abraham verbergen wat Ik ga doen?","18":"Omdat Abraham zeker tot een groot en machtig volk zal worden, en alle volken van de aarde in hem gezegend zullen worden?","19":"Want Ik heb hem gekend, opdat hij zijn kinderen en zijn huis na hem zou opdragen, en zij de weg van de HEERE zouden bewaren, om gerechtigheid en recht te doen; opdat de HEERE over Abraham brengt wat Hij over hem gesproken heeft.","20":"Verder zei de HEERE: Omdat het geroep van Sodom en Gomorra groot is, en omdat hun zonde zeer zwaar is,","21":"Zal Ik nu afgaan en zien of zij naar hun geroep, dat tot Mij gekomen is, het uiterste gedaan hebben, en zo niet, Ik zal het weten.","22":"Toen keerden die mannen zich van daar af, en gingen naar Sodom; maar Abraham bleef nog staan voor het aangezicht van de HEERE.","23":"En Abraham trad naar voren en zei: Zult U ook de rechtvaardige met de goddeloze ombrengen?","24":"Misschien zijn er vijftig rechtvaardigen in de stad; zult U hen ook ombrengen, en de plaats niet sparen, omwille van de vijftig rechtvaardigen die daarin zijn?","25":"Het zij verre van U, zoiets te doen, de rechtvaardige te doden met de goddeloze! zodat de rechtvaardige zou zijn als de goddeloze, verre zij het van U! zou de Rechter van de hele aarde geen recht doen?","26":"Toen zei de HEERE: Als Ik in Sodom, binnen de stad, vijftig rechtvaardigen zal vinden, dan zal Ik de hele plaats sparen omwille van hen.","27":"En Abraham antwoordde en zei: Zie toch, ik heb het aangedurfd te spreken tot de Heere, hoewel ik stof en as ben!","28":"Misschien zullen aan de vijftig rechtvaardigen vijf ontbreken; zult U dan om vijf de hele stad verwoesten? En Hij zei: Ik zal haar niet verwoesten, als Ik er vijfenveertig zal vinden.","29":"En hij ging voort tot Hem te spreken, en zei: Misschien zullen daar veertig gevonden worden! En Hij zei: Ik zal het niet doen omwille van de veertig.","30":"Verder zei hij: Laat de Heere toch niet boos worden, dat ik spreek; misschien zullen daar dertig gevonden worden! En Hij zei: Ik zal het niet doen, als Ik daar dertig zal vinden.","31":"En hij zei: Zie toch, ik heb het aangedurfd te spreken tot de Heere; misschien zullen er twintig gevonden worden! En Hij zei: Ik zal haar niet verwoesten omwille van de twintig.","32":"Nog zei hij: Laat de Heere toch niet boos worden, dat ik alleen deze keer nog spreek: misschien zullen er tien gevonden worden. En Hij zei: Ik zal haar niet verwoesten omwille van de tien.","33":"Toen ging de HEERE weg, toen Hij geëindigd had tot Abraham te spreken; en Abraham keerde terug naar zijn plaats."},"SV":{"1":"Daarna verscheen hem de HEERE aan de eikenbossen van Mamre, als hij in de deur der tent zat, toen de dag heet werd.","2":"En hij hief zijn ogen op en zag; en ziet, daar stonden drie mannen tegenover hem; als hij hen zag, zo liep hij hun tegemoet van de deur der tent, en boog zich ter aarde.","3":"En hij zeide: Heere! heb ik nu genade gevonden in Uw ogen, zo gaat toch niet aan Uw knecht voorbij.","4":"Dat toch een weinig waters gebracht worde, en wast Uw voeten, en leunt onder dezen boom.","5":"En ik zal een bete broods langen, dat Gij Uw hart sterkt; daarna zult Gij voortgaan, daarom omdat Gij tot Uw knecht overgekomen zijt. En zij zeiden: Doe zo als gij gesproken hebt.","6":"En Abraham haastte zich naar de tent tot Sara, en hij zeide: Haast u; kneed drie maten meelbloem, en maak koeken.","7":"En Abraham liep tot de runderen, en hij nam een kalf, teder en goed, en hij gaf het aan den knecht, die haastte, om dat toe te maken.","8":"En hij nam boter en melk, en het kalf, dat hij toegemaakt had, en hij zette het hun voor, en stond bij hen onder dien boom, en zij aten.","9":"Toen zeiden zij tot hem: Waar is Sara, uw huisvrouw? En hij zeide: Ziet, in de tent.","10":"En Hij zeide: Ik zal voorzeker weder tot u komen, omtrent dezen tijd des levens; en zie, Sara, uw huisvrouw, *zal* een zoon *hebben*! En Sara hoorde het aan de deur der tent, welke achter Hem was.","11":"Abraham nu en Sara waren oud, *en* wel bedaagd; het had Sara opgehouden te gaan naar de wijze der vrouwen.","12":"Zo lachte Sara bij zichzelve, zeggende: Zal ik wellust hebben, nadat ik oud geworden ben, en mijn heer oud is?","13":"En de HEERE zeide tot Abraham: Waarom heeft Sara gelachen, zeggende: Zou ik ook waarlijk baren, nu ik oud geworden ben?","14":"Zou iets voor den HEERE te wonderlijk zijn? Ter gezetter tijd zal Ik tot u wederkomen, omtrent dezen tijd des levens, en Sara *zal* een zoon *hebben*!","15":"En Sara loochende het, zeggende: Ik heb niet gelachen; want zij vreesde. En Hij zeide: Neen! maar gij hebt gelachen.","16":"Toen stonden die mannen op van daar, en zagen naar Sodom toe; en Abraham ging met hen, om hen te geleiden.","17":"En de HEERE zeide: Zal Ik voor Abraham verbergen, wat Ik doe?","18":"Dewijl Abraham gewisselijk tot een groot en machtig volk worden zal, en alle volken der aarde in hem gezegend zullen worden?","19":"Want Ik heb hem gekend, opdat hij zijn kinderen en zijn huis na hem zoude bevelen, en zij den weg des HEEREN houden, om te doen gerechtigheid en gerichte; opdat de HEERE over Abraham brenge hetgeen Hij over hem gesproken heeft.","20":"Voorts zeide de HEERE: Dewijl het geroep van Sodom en Gomorra groot *is*, en dewijl haar zonde zeer zwaar is,","21":"Zal Ik nu afgaan en bezien, of zij naar hun geroep, dat tot Mij gekomen is, het uiterste gedaan hebben, en zo niet, Ik zal het weten.","22":"Toen keerden die mannen het aangezicht van daar, en gingen naar Sodom; maar Abraham bleef nog staande voor het aangezicht des HEEREN.","23":"En Abraham trad toe, en zeide: Zult Gij ook den rechtvaardige met den goddeloze ombrengen?","24":"Misschien zijn er vijftig rechtvaardigen in de stad; zult Gij hen ook ombrengen, en de plaats niet sparen, om de vijftig rechtvaardigen, die binnen haar zijn?","25":"Het zij verre van U, zulk een ding te doen, te doden den rechtvaardige met den goddeloze! dat de rechtvaardige zij gelijk de goddeloze, verre zij het van U! zou de Rechter der ganse aarde geen recht doen?","26":"Toen zeide de HEERE: Zo Ik te Sodom binnen de stad vijftig rechtvaardigen zal vinden, zo zal Ik de ganse plaats sparen om hunnentwil.","27":"En Abraham antwoordde en zeide: Zie toch; ik heb mij onderwonden te spreken tot den Heere, hoewel ik stof en as *ben*!","28":"Misschien zullen aan de vijftig rechtvaardigen vijf ontbreken; zult Gij dan om vijf de ganse stad verderven? En Hij zeide: Ik zal haar niet verderven, zo Ik er vijf en veertig zal vinden.","29":"En hij voer voort nog tot Hem te spreken, en zeide: Misschien zullen aldaar veertig gevonden worden! En Hij zeide: Ik zal het niet doen om der veertigen wil.","30":"Voorts zeide hij: Dat toch de Heere niet ontsteke, dat ik spreke; misschien zullen aldaar dertig gevonden worden! En Hij zeide: Ik zal het niet doen, zo Ik aldaar dertig zal vinden.","31":"En hij zeide: Zie toch, ik heb mij onderwonden te spreken tot de Heere; misschien zullen er twintig gevonden worden! En Hij zeide: Ik zal haar niet verderven om der twintigen wil.","32":"Nog zeide hij: Dat toch de Heere niet ontsteke, dat ik alleenlijk ditmaal spreke: misschien zullen er tien gevonden worden. En Hij zeide: Ik zal haar niet verderven om der tienen wil.","33":"Toen ging de HEERE weg, als Hij geëindigd had tot Abraham te spreken; en Abraham keerde weder naar zijn plaats."},"KJV":{"1":"And the LORD appeared unto him in the plains of Mamre: and he sat in the tent door in the heat of the day;","2":"And he lift up his eyes and looked, and, lo, three men stood by him: and when he saw *them*, he ran to meet them from the tent door, and bowed himself toward the ground,","3":"And said, My Lord, if now I have found favour in thy sight, pass not away, I pray thee, from thy servant:","4":"Let a little water, I pray you, be fetched, and wash your feet, and rest yourselves under the tree:","5":"And I will fetch a morsel of bread, and comfort ye your hearts; after that ye shall pass on: for therefore are ye come to your servant. And they said, So do, as thou hast said.","6":"And Abraham hastened into the tent unto Sarah, and said, Make ready quickly three measures of fine meal, knead *it*, and make cakes upon the hearth.","7":"And Abraham ran unto the herd, and fetcht a calf tender and good, and gave *it* unto a young man; and he hasted to dress","8":"And he took butter, and milk, and the calf which he had dressed, and set *it* before them; and he stood by them under the tree, and they did eat.","9":"And they said unto him, Where *is* Sarah thy wife? And he said, Behold, in the tent.","10":"And he said, I will certainly return unto thee according to the time of life; and, lo, Sarah thy wife shall have a son. And Sarah heard *it* in the tent door, which *was* behind him.","11":"Now Abraham and Sarah *were* old *and* well stricken in age; *and* it ceased to be with Sarah after the manner of women.","12":"Therefore Sarah laughed within herself, saying, After I am waxed old shall I have pleasure, my lord being old also?","13":"And the LORD said unto Abraham, Wherefore did Sarah laugh, saying, Shall I of a surety bear a child, which am old?","14":"Is any thing too hard for the LORD? At the time appointed I will return unto thee, according to the time of life, and Sarah shall have a son.","15":"Then Sarah denied, saying, I laughed not; for she was afraid. And he said, Nay; but thou didst laugh.","16":"And the men rose up from thence, and looked toward Sodom: and Abraham went with them to bring them on the way.","17":"And the LORD said, Shall I hide from Abraham that thing which I do;","18":"Seeing that Abraham shall surely become a great and mighty nation, and all the nations of the earth shall be blessed","19":"For I know him, that he will command his children and his household after him, and they shall keep the way of the LORD, to do justice and judgment; that the LORD may bring upon Abraham that which he hath spoken","20":"And the LORD said, Because the cry of Sodom and Gomorrah is great, and because their sin is very grievous;","21":"I will go down now, and see whether they have done altogether according to the cry of it, which is come unto me; and if not, I will know.","22":"And the men turned their faces from thence, and went toward Sodom: but Abraham stood yet before the LORD.","23":"And Abraham drew near, and said, Wilt thou also destroy the righteous with the wicked?","24":"Peradventure there be fifty righteous within the city: wilt thou also destroy and not spare the place for the fifty righteous that *are* therein?","25":"That be far from thee to do after this manner, to slay the righteous with the wicked: and that the righteous should be as the wicked, that be far from thee: Shall not the Judge of all the earth do right?","26":"And the LORD said, If I find in Sodom fifty righteous within the city, then I will spare all the place","27":"And Abraham answered and said, Behold now, I have taken upon me to speak unto the Lord, which *am but* dust and ashes:","28":"Peradventure there shall lack five of the fifty righteous: wilt thou destroy all the city for *lack of* five? And he said, If I find there forty and five, I will not destroy","29":"And he spake unto him yet again, and said, Peradventure there shall be forty found there. And he said, I will not do *it* for forty's","30":"And he said *unto him*, Oh let not the Lord be angry, and I will speak: Peradventure there shall thirty be found there. And he said, I will not do *it*, if I find thirty","31":"And he said, Behold now, I have taken upon me to speak unto the Lord: Peradventure there shall be twenty found there. And he said, I will not destroy *it* for twenty's","32":"And he said, Oh let not the Lord be angry, and I will speak yet but this once: Peradventure ten shall be found there. And he said, I will not destroy *it* for ten's","33":"And the LORD went ode=\"H5324\">stood</span> by him: and when he <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> them, he <span class=\"wl wl-kjv\" data-code=\"H7323\">ran</span> to <span class=\"wl wl-kjv\" data-code=\"H7125\">meet</span> them from the <span class=\"wl wl-kjv\" data-code=\"H168\">tent</span> <span class=\"wl wl-kjv\" data-code=\"H6607\">door,</span> and <span class=\"wl wl-kjv\" data-code=\"H7812\">bowed</span> himself toward the ground,","3":"And <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> My <span class=\"wl wl-kjv\" data-code=\"H136\">Lord,</span> if now I have <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> <span class=\"wl wl-kjv\" data-code=\"H2580\">favour</span> in thy <span class=\"wl wl-kjv\" data-code=\"H5869\">sight,</span> pass not <span class=\"wl wl-kjv\" data-code=\"H5674\">away,</span> I pray thee, from thy servant:","4":"Let a <span class=\"wl wl-kjv\" data-code=\"H4592\">little</span> <span class=\"wl wl-kjv\" data-code=\"H4325\">water,</span> I pray <span class=\"wl wl-kjv\" data-code=\"H4994\">you,</span> be <span class=\"wl wl-kjv\" data-code=\"H3947\">fetched,</span> and <span class=\"wl wl-kjv\" data-code=\"H7364\">wash</span> your <span class=\"wl wl-kjv\" data-code=\"H7272\">feet,</span> and rest <span class=\"wl wl-kjv\" data-code=\"H8172\">yourselves</span> under the tree:","5":"And I will <span class=\"wl wl-kjv\" data-code=\"H3947\">fetch</span> a <span class=\"wl wl-kjv\" data-code=\"H6595\">morsel</span> of <span class=\"wl wl-kjv\" data-code=\"H3899\">bread,</span> and comfort <span class=\"wl wl-kjv\" data-code=\"H5582\">ye</span> your <span class=\"wl wl-kjv\" data-code=\"H3820\">hearts;</span> after <span class=\"wl wl-kjv\" data-code=\"H310\">that</span> ye shall pass <span class=\"wl wl-kjv\" data-code=\"H5674\">on:</span> for therefore are ye <span class=\"wl wl-kjv\" data-code=\"H5674\">come</span> <span class=\"wl wl-kjv\" data-code=\"H5921\">to</span> your <span class=\"wl wl-kjv\" data-code=\"H5650\">servant.</span> And they <span class=\"wl wl-kjv\" data-code=\"H1696\">said,</span> So <span class=\"wl wl-kjv\" data-code=\"H6213\">do,</span> as thou hast said.","6":"And <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham</span> <span class=\"wl wl-kjv\" data-code=\"H4116\">hastened</span> into the <span class=\"wl wl-kjv\" data-code=\"H168\">tent</span> unto <span class=\"wl wl-kjv\" data-code=\"H8283\">Sarah,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Make ready <span class=\"wl wl-kjv\" data-code=\"H4116\">quickly</span> <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H5429\">measures</span> of <span class=\"wl wl-kjv\" data-code=\"H5560\">fine</span> <span class=\"wl wl-kjv\" data-code=\"H7058\">meal,</span> <span class=\"wl wl-kjv\" data-code=\"H3888\">knead</span> it, and <span class=\"wl wl-kjv\" data-code=\"H6213\">make</span> <span class=\"wl wl-kjv\" data-code=\"H5692\">cakes</span> upon the hearth.","7":"And <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham</span> <span class=\"wl wl-kjv\" data-code=\"H7323\">ran</span> unto the <span class=\"wl wl-kjv\" data-code=\"H1241\">herd,</span> and <span class=\"wl wl-kjv\" data-code=\"H3947\">fetcht</span> a <span class=\"wl wl-kjv\" data-code=\"H1121\">calf</span> <span class=\"wl wl-kjv\" data-code=\"H7390\">tender</span> and <span class=\"wl wl-kjv\" data-code=\"H2896\">good,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> it unto a young <span class=\"wl wl-kjv\" data-code=\"H5288\">man;</span> and he <span class=\"wl wl-kjv\" data-code=\"H4116\">hasted</span> to dress","8":"And he <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> <span class=\"wl wl-kjv\" data-code=\"H2529\">butter,</span> and <span class=\"wl wl-kjv\" data-code=\"H2461\">milk,</span> and the <span class=\"wl wl-kjv\" data-code=\"H1121\">calf</span> which he had <span class=\"wl wl-kjv\" data-code=\"H6213\">dressed,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">set</span> it before <span class=\"wl wl-kjv\" data-code=\"H6440\">them;</span> and he <span class=\"wl wl-kjv\" data-code=\"H5975\">stood</span> by them under the <span class=\"wl wl-kjv\" data-code=\"H6086\">tree,</span> and they did eat.","9":"And they <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, <span class=\"wl wl-kjv\" data-code=\"H346\">Where</span> is <span class=\"wl wl-kjv\" data-code=\"H8283\">Sarah</span> thy <span class=\"wl wl-kjv\" data-code=\"H802\">wife?</span> And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Behold, in the tent.","10":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> I will <span class=\"wl wl-kjv\" data-code=\"H7725\">certainly</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">return</span> unto thee according to the <span class=\"wl wl-kjv\" data-code=\"H6256\">time</span> of <span class=\"wl wl-kjv\" data-code=\"H2416\">life;</span> and, lo, <span class=\"wl wl-kjv\" data-code=\"H8283\">Sarah</span> thy <span class=\"wl wl-kjv\" data-code=\"H802\">wife</span> shall have a <span class=\"wl wl-kjv\" data-code=\"H1121\">son.</span> And <span class=\"wl wl-kjv\" data-code=\"H8283\">Sarah</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> it in the <span class=\"wl wl-kjv\" data-code=\"H168\">tent</span> <span class=\"wl wl-kjv\" data-code=\"H6607\">door,</span> which was behind him.","11":"Now <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham</span> and <span class=\"wl wl-kjv\" data-code=\"H8283\">Sarah</span> were <span class=\"wl wl-kjv\" data-code=\"H2205\">old</span> and well <span class=\"wl wl-kjv\" data-code=\"H935\">stricken</span> in <span class=\"wl wl-kjv\" data-code=\"H3117\">age;</span> and it <span class=\"wl wl-kjv\" data-code=\"H2308\">ceased</span> to be with <span class=\"wl wl-kjv\" data-code=\"H8283\">Sarah</span> after the <span class=\"wl wl-kjv\" data-code=\"H734\">manner</span> of women.","12":"Therefore <span class=\"wl wl-kjv\" data-code=\"H8283\">Sarah</span> <span class=\"wl wl-kjv\" data-code=\"H6711\">laughed</span> within <span class=\"wl wl-kjv\" data-code=\"H7130\">herself,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H310\">After</span> I am waxed <span class=\"wl wl-kjv\" data-code=\"H1086\">old</span> shall I have <span class=\"wl wl-kjv\" data-code=\"H5730\">pleasure,</span> my <span class=\"wl wl-kjv\" data-code=\"H113\">lord</span> being old also?","13":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham,</span> <span class=\"wl wl-kjv\" data-code=\"H4100\">Wherefore</span> did <span class=\"wl wl-kjv\" data-code=\"H8283\">Sarah</span> <span class=\"wl wl-kjv\" data-code=\"H6711\">laugh,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Shall I of a <span class=\"wl wl-kjv\" data-code=\"H552\">surety</span> <span class=\"wl wl-kjv\" data-code=\"H3205\">bear</span> a child, <span class=\"wl wl-kjv\" data-code=\"H589\">which</span> am old?","14":"<span class=\"wl wl-kjv\" data-code=\"H6381\">Is</span> any <span class=\"wl wl-kjv\" data-code=\"H1697\">thing</span> too <span class=\"wl wl-kjv\" data-code=\"H6381\">hard</span> for the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD?</span> At the time <span class=\"wl wl-kjv\" data-code=\"H4150\">appointed</span> I will <span class=\"wl wl-kjv\" data-code=\"H7725\">return</span> unto thee, according to the <span class=\"wl wl-kjv\" data-code=\"H6256\">time</span> of <span class=\"wl wl-kjv\" data-code=\"H2416\">life,</span> and <span class=\"wl wl-kjv\" data-code=\"H8283\">Sarah</span> shall have a son.","15":"Then <span class=\"wl wl-kjv\" data-code=\"H8283\">Sarah</span> <span class=\"wl wl-kjv\" data-code=\"H3584\">denied,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> I <span class=\"wl wl-kjv\" data-code=\"H6711\">laughed</span> not; for she was <span class=\"wl wl-kjv\" data-code=\"H3372\">afraid.</span> And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H3808\">Nay;</span> but thou didst laugh.","16":"And the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> rose <span class=\"wl wl-kjv\" data-code=\"H6965\">up</span> from thence, and <span class=\"wl wl-kjv\" data-code=\"H8259\">looked</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">toward</span> <span class=\"wl wl-kjv\" data-code=\"H5467\">Sodom:</span> and <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham</span> <span class=\"wl wl-kjv\" data-code=\"H1980\">went</span> with them to bring them on the way.","17":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Shall I <span class=\"wl wl-kjv\" data-code=\"H3680\">hide</span> from <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham</span> that thing <span class=\"wl wl-kjv\" data-code=\"H834\">which</span> I do;","18":"Seeing that <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham</span> shall surely become a <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> and <span class=\"wl wl-kjv\" data-code=\"H6099\">mighty</span> <span class=\"wl wl-kjv\" data-code=\"H1471\">nation,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H1471\">nations</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> shall be blessed","19":"For I <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> him, <span class=\"wl wl-kjv\" data-code=\"H834\">that</span> he will <span class=\"wl wl-kjv\" data-code=\"H6680\">command</span> his <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> and his <span class=\"wl wl-kjv\" data-code=\"H1004\">household</span> after <span class=\"wl wl-kjv\" data-code=\"H310\">him,</span> and they shall <span class=\"wl wl-kjv\" data-code=\"H8104\">keep</span> the <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> to <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> <span class=\"wl wl-kjv\" data-code=\"H6666\">justice</span> and <span class=\"wl wl-kjv\" data-code=\"H4941\">judgment;</span> that the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> may <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> upon <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham</span> that which he hath spoken","20":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Because the <span class=\"wl wl-kjv\" data-code=\"H2201\">cry</span> of <span class=\"wl wl-kjv\" data-code=\"H5467\">Sodom</span> and <span class=\"wl wl-kjv\" data-code=\"H6017\">Gomorrah</span> is <span class=\"wl wl-kjv\" data-code=\"H7227\">great,</span> and because their <span class=\"wl wl-kjv\" data-code=\"H2403\">sin</span> is <span class=\"wl wl-kjv\" data-code=\"H3966\">very</span> grievous;","21":"I will go <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> now, and <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> whether they have <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> <span class=\"wl wl-kjv\" data-code=\"H3617\">altogether</span> according to the <span class=\"wl wl-kjv\" data-code=\"H6818\">cry</span> of it, which is <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> unto me; and if not, I will know.","22":"And the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> turned their <span class=\"wl wl-kjv\" data-code=\"H6437\">faces</span> from thence, and <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> toward <span class=\"wl wl-kjv\" data-code=\"H5467\">Sodom:</span> but <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham</span> <span class=\"wl wl-kjv\" data-code=\"H5975\">stood</span> <span class=\"wl wl-kjv\" data-code=\"H5750\">yet</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the LORD.","23":"And <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham</span> drew <span class=\"wl wl-kjv\" data-code=\"H5066\">near,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Wilt thou also <span class=\"wl wl-kjv\" data-code=\"H5595\">destroy</span> the <span class=\"wl wl-kjv\" data-code=\"H6662\">righteous</span> <span class=\"wl wl-kjv\" data-code=\"H5973\">with</span> the wicked?","24":"Peradventure there <span class=\"wl wl-kjv\" data-code=\"H3426\">be</span> <span class=\"wl wl-kjv\" data-code=\"H2572\">fifty</span> <span class=\"wl wl-kjv\" data-code=\"H6662\">righteous</span> <span class=\"wl wl-kjv\" data-code=\"H8432\">within</span> the <span class=\"wl wl-kjv\" data-code=\"H5892\">city:</span> wilt thou also <span class=\"wl wl-kjv\" data-code=\"H5595\">destroy</span> and not <span class=\"wl wl-kjv\" data-code=\"H5375\">spare</span> the <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> <span class=\"wl wl-kjv\" data-code=\"H4616\">for</span> the <span class=\"wl wl-kjv\" data-code=\"H2572\">fifty</span> <span class=\"wl wl-kjv\" data-code=\"H6662\">righteous</span> that are therein?","25":"That be <span class=\"wl wl-kjv\" data-code=\"H2486\">far</span> from thee to <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> after this <span class=\"wl wl-kjv\" data-code=\"H1697\">manner,</span> to <span class=\"wl wl-kjv\" data-code=\"H4191\">slay</span> the <span class=\"wl wl-kjv\" data-code=\"H6662\">righteous</span> with the <span class=\"wl wl-kjv\" data-code=\"H7563\">wicked:</span> and that the <span class=\"wl wl-kjv\" data-code=\"H6662\">righteous</span> should be as the <span class=\"wl wl-kjv\" data-code=\"H7563\">wicked,</span> that be <span class=\"wl wl-kjv\" data-code=\"H2486\">far</span> from thee: Shall not the <span class=\"wl wl-kjv\" data-code=\"H8199\">Judge</span> of all the <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> right?","26":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> If I <span class=\"wl wl-kjv\" data-code=\"H4672\">find</span> in <span class=\"wl wl-kjv\" data-code=\"H5467\">Sodom</span> <span class=\"wl wl-kjv\" data-code=\"H2572\">fifty</span> <span class=\"wl wl-kjv\" data-code=\"H6662\">righteous</span> <span class=\"wl wl-kjv\" data-code=\"H8432\">within</span> the <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> then I will <span class=\"wl wl-kjv\" data-code=\"H5375\">spare</span> all the place","27":"And <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham</span> <span class=\"wl wl-kjv\" data-code=\"H6030\">answered</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Behold now, I have taken upon <span class=\"wl wl-kjv\" data-code=\"H2974\">me</span> to <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> unto the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord,</span> <span class=\"wl wl-kjv\" data-code=\"H595\">which</span> am but <span class=\"wl wl-kjv\" data-code=\"H6083\">dust</span> and ashes:","28":"Peradventure there shall <span class=\"wl wl-kjv\" data-code=\"H2637\">lack</span> <span class=\"wl wl-kjv\" data-code=\"H2568\">five</span> of the <span class=\"wl wl-kjv\" data-code=\"H2572\">fifty</span> <span class=\"wl wl-kjv\" data-code=\"H6662\">righteous:</span> wilt thou <span class=\"wl wl-kjv\" data-code=\"H7843\">destroy</span> all the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> for lack of <span class=\"wl wl-kjv\" data-code=\"H2568\">five?</span> And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> If I <span class=\"wl wl-kjv\" data-code=\"H4672\">find</span> there <span class=\"wl wl-kjv\" data-code=\"H705\">forty</span> and <span class=\"wl wl-kjv\" data-code=\"H2568\">five,</span> I will not destroy","29":"And he <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> unto him yet <span class=\"wl wl-kjv\" data-code=\"H3254\">again,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Peradventure there shall be <span class=\"wl wl-kjv\" data-code=\"H705\">forty</span> <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> there. And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> I will not <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> it for forty's","30":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, <span class=\"wl wl-kjv\" data-code=\"H4994\">Oh</span> let not the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> be <span class=\"wl wl-kjv\" data-code=\"H2734\">angry,</span> and I will <span class=\"wl wl-kjv\" data-code=\"H1696\">speak:</span> Peradventure there shall <span class=\"wl wl-kjv\" data-code=\"H7970\">thirty</span> be <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> there. And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> I will not <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> it, if I <span class=\"wl wl-kjv\" data-code=\"H4672\">find</span> thirty","31":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Behold now, I have taken upon <span class=\"wl wl-kjv\" data-code=\"H2974\">me</span> to <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> unto the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord:</span> Peradventure there shall be <span class=\"wl wl-kjv\" data-code=\"H6242\">twenty</span> <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> there. And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> I will not <span class=\"wl wl-kjv\" data-code=\"H7843\">destroy</span> it for twenty's","32":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Oh let not the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> be <span class=\"wl wl-kjv\" data-code=\"H2734\">angry,</span> and I will <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> <span class=\"wl wl-kjv\" data-code=\"H389\">yet</span> but this <span class=\"wl wl-kjv\" data-code=\"H6471\">once:</span> Peradventure <span class=\"wl wl-kjv\" data-code=\"H6235\">ten</span> shall be <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> there. And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> I will not <span class=\"wl wl-kjv\" data-code=\"H7843\">destroy</span> it for ten's","33":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> went his <span class=\"wl wl-kjv\" data-code=\"H3212\">way,</span> as soon <span class=\"wl wl-kjv\" data-code=\"H834\">as</span> he had <span class=\"wl wl-kjv\" data-code=\"H3615\">left</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">communing</span> with <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham:</span> and <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">returned</span> unto his place."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"hem de HEERE","tekst":"Namel, Abraham."},{"catchword":"eikenbossen","tekst":"Zie boven, hoofdstuk. Gen 13:18. Hier had Abraham zijn woonstede gekozen, nadat Lot van hem gescheiden was; boven Gen 13:18."}],"2":[{"catchword":"mannen","tekst":"In gedaante en naar de mening van Abraham; maar in waarheid twee engelen en de derde de HEERE zelf, die voor den tijd van dit gezantschap met menselijke lichamen zich vertoonden; met welke zij gingen, zaten, spraken en aten; zie Heb 13:2. Dat de een de HEERE God was, blijkt hier vs.1, en uit het vervolg van deze historie."},{"catchword":"boog zich","tekst":"Te weten, om politieke en burgerlijke eer te bewijzen. Alzo onder Gen 23:7, 12; 1Sa 25:24; 2Sa 14:4; 1Ki 1:23; Est 3:2."}],"3":[{"catchword":"Heere","tekst":"Anders, mijne heren."},{"catchword":"heb ik nu","tekst":"Dat is, zo gij mij waardig acht deze gunst, eer en vriendschap. Bij de mensen genade te vinden is hun gunst, toegenegenheid en vriendschap te bekomen. Zie onder Gen 32:5, en Gen 34:11, en Gen 39:4, enz."},{"catchword":"uw ogen,","tekst":"Abraham spreekt een van hen aan, die de aanzienlijkste was, en dien hij naderhand bevond de HEERE te zijn."}],"4":[{"catchword":"gebracht worde,","tekst":"Hebr. genomen. Zie boven Gen 15:9-10."},{"catchword":"wast uw","tekst":"Naar het gebruik in die landen, om de voeten te wassen en te verfrissen, daar men om de hitte daar met aangebonden zolen of barvoets ging. Zie onder Gen 19:2, en Gen 24:32, en Gen 43:24; Joh 13:4-5."},{"catchword":"leunt onder","tekst":"Dat is, rust."}],"5":[{"catchword":"broods langen,","tekst":"De Hebreën noemen brood allerlei spijs, 1Sa 14:24; Mat 6:11, Mat 15:2; Luk 14:1, Luk 14:15. Verg. boven Gen 3:19."},{"catchword":"hart sterkt;","tekst":"Zie deze manier van spreken, Jdg 19:5; Psa 104:15; 1Ki 13:7. Sterken, is hier verkwikken en voeden, wat het brood doet, Psa 104:15; niet uit zichzelf, maar door den zegen Gods; Deu 8:3; Mat 4:4."},{"catchword":"daarom","tekst":"Anders, want gij daarom, enz. Niet dat hij meende, dat dit hun voornemen geweest was, maar dat God hen door zijn voorzienigheid daarom derwaarts geleid had. Zie onder, Gen 33:10."}],"6":[{"catchword":"maten","tekst":"Hebr. Seïm. Een zekere maat van droge waren, houdende 144 henne-eierschalen , het derde deel van een efa. Zie van deze maat ook Exo 16:36."},{"catchword":"koeken","tekst":"Het Hebr. woord betekent koeken, die op een heten haard onder of op kolen of in hete as gebakken worden. Zie Exo 12:39; Num 11:8; 1Ki 17:3, 1Ki 19:6."}],"7":[{"catchword":"kalf,","tekst":"Hebr. een zoon van een rund. Dat is, een kalf of een jong rund."}],"8":[{"catchword":"voor,","tekst":"Hebr. voor hun aangezicht."},{"catchword":"stond bij","tekst":"Om hen te dienen."},{"catchword":"aten","tekst":"Zie boven vs.2."}],"9":[{"catchword":"Waar is","tekst":"Niet alsof zij het niet wisten, maar om gelegenheid te nemen van te komen tot de volgende handeling."},{"catchword":"tent","tekst":"Abraham wijst op de tent van zijn huisvrouw, gelijk blijkt uit het volgende vs.10, want de huisvaders en de huismoeders hebben elk hun bijzondere tenten gehad; onder Gen 23:2, en Gen 24:67, en Gen 31:33."}],"10":[{"catchword":"hij zeide","tekst":"De HEERE."},{"catchword":"weder","tekst":"Hebr. wederkomende wederkomen. Deze wederkomst moet men niet juist verstaan van zulk een verschijning gelijk deze was, maar van de vervulling dezer belofte, genoemd een bezoeking, hoofdstuk Gen 21:1."},{"catchword":"omtrent dezen","tekst":"Dat is, in het volgende jaar, omtrent dezen tijd van het leven der mensen. Anders, als deze tijd zal leven, of levend zijn. Zie dezelfde manier van spreken in dit hoofdstuk vs.14; 2Ki 4:16."},{"catchword":"achter hem","tekst":"Achter dengene, die sprak; of achter Abraham, die daar stonder"}],"11":[{"catchword":"wel bedaagd","tekst":"Hebr. gaande in dagen. Deze manier van spreken vindt men ook onder Gen 24:1; Jos 13:1, en Jos 23:1; 1Ki 1:1; Luk 1:7, Luk 1:18."},{"catchword":"te gaan","tekst":"Hebr. te zijn."},{"catchword":"naar de","tekst":"Of, naar de gewoonte. Hebr. naar den weg, gang, of pad. Zo is bij de Hebreën weg voor wijze of gewoonte gesteld. Alzo onder Gen 19:31, en Gen 31:35."}],"12":[{"catchword":"Zo lachte","tekst":"Niet uit geloof, gelijk tevoren Abraham, maar uit zwakheid, ziende meer op de natuur, dan op Gods macht."},{"catchword":"bij zichzelve,","tekst":"Hebr. in haar midden."}],"13":[{"catchword":"de HEERE","tekst":"Merk op dat Hij, die tot nog toe het woord gevoerd heeft en vs.2 een man genoemd wordt, hier JHWH, de HEERE genoemd wordt."}],"14":[{"catchword":"Zou iets","tekst":"Te weten, om te volbrengen wat Hij beloofd heeft? Anders, zou enig ding verborgen zijn voor den HEERE? Namelijk dat Hij niet zou weten?"},{"catchword":"omtrent dezen","tekst":"Zie boven, vs.10."}],"15":[{"catchword":"zij vreesde","tekst":"Van wege de ontdekte zonde tegen God, schande bij de gasten en ondank bij haar man."}],"16":[{"catchword":"om hen","tekst":"Uit beleefdheid. Zie van zulke gedienstigheid, Act 20:38, en Act 21:5; Rom 15:24; 1Co 16:11; Tit 3:13."}],"17":[{"catchword":"Zal ik","tekst":"Dat is, Ik zal het Abraham geenszins verbergen. Zie dergelijke manier van vragen, die stijf loochenen, 2Sa 7:5, verg. met 1Ch 17:4; Mat 7:16. Verg. met Luk 6:44. Zie ook Amo 3:7."}],"18":[{"catchword":"worden zal,","tekst":"Hebr. zijnde zijn zal."},{"catchword":"in hem","tekst":"Dat is, in zijn zaad Christus Jezus. Zie boven Gen 12:3, en Gen 22:18."}],"19":[{"catchword":"hem gekend,","tekst":"Dat is, Ik heb hem uitverkoren, bezind en verzorgd als mijn eigendom. Alzo wordt het woord kennen genomen in verscheidene plaatsen, als Psa 1:6; Jer 1:5, en Jer 24:5; Hos 13:5; Amo 3:2; Joh 10:27; 2Ti 2:19."},{"catchword":"opdat hij","tekst":"Aldus worden de Hebreeuwse woordjes, die hier gebruikt zijn, genomen Lev 17:5; Deu 20:18, en Deu 27:3, enz."},{"catchword":"den weg","tekst":"Dat is, het voorschrift van Gods Woord, ons onderwijzende in al hetgeen ons geloof en onzen wandel aangaat. Zie Psa 51:15, enz."},{"catchword":"om te","tekst":"Een manier van spreken dikwijls in de Heilige Schrift gebruikt, betekende al wat goed en recht is, begrepen in de eerste en tweede tafel der wet, tot het privaat of publiek leven behorende. Verg. Psa 119:121."}],"20":[{"catchword":"het geroep","tekst":"Zie boven 4, op vs.10."}],"21":[{"catchword":"afgaan","tekst":"Zie boven Gen 11:5."},{"catchword":"of zij","tekst":"God weet alles volkomenlijk van zichzelven, maar Hij spreekt hier menselijker wijze, als een, die niet wil straffen zonder onderzoek en volle kennis der zaken."},{"catchword":"hun geroep,","tekst":"Namelijk, der stad Sodom, of, naar het geroep desgenen, tot dat, enz."},{"catchword":"het uiterste","tekst":"Hebr. de voleinding gedaan, of, gemaakt. Dat is, de maat van hun zonden vervuld hebben. Zie boven Gen 15:16; 1Sa 20:7, 1Sa 20:9. Anders, of zij de uiterste verwoesting met hunne werken verdiend hebben."}],"22":[{"catchword":"die mannen","tekst":"Versta de twee engelen; zie hoofdstuk Gen 19:1, want de HEERE bleef spreken met Abraham."}],"25":[{"catchword":"Het zij","tekst":"Hebr. Het zij u verre van te doen naar deze zaak. Hieruit blijkt dat Abraham met de voorgaande vragen God geenszins heeft willen verdenken van onrechtvaardigheid of straf der onschuldigen, want hij wil God niet vermanen omtrent zijn officie, om hem aan te wijzen wat Hij doen moest, maar zichzelven verzekeren van Gods natuur, waardoor Hij niet anders dan recht doen Kon."},{"catchword":"de Rechter","tekst":"Hier kent Abraham dezen persoon, die met hem sprak, voor den Rechter der wereld, welke is de Heere Christus, Joh 5:22, Joh 5:27; Act 10:42, en Act 17:31."}],"27":[{"catchword":"ik stof","tekst":"Te weten, naar het lichaam, ten aanzien van mijn oorsprong en einde in deze wereld. Zie boven Gen 3:19; Job 4:19; Ecc 12:7; 1Co 15:47-48; 2Co 5:1."}],"29":[{"catchword":"veertig gevonden","tekst":"Te weten, rechtvaardigen, en zo in het volgende vs.30."}],"30":[{"catchword":"Dat toch","tekst":"Hebr. dat de Heere niet ontsteke. Te weten, zijn toornigheid. Zie boven Gen 4:5-6, en onder, vs.32, en Gen 31:36."}],"32":[{"catchword":"Nog zeide","tekst":"Merk in dit voorgaande gesprek eensdeels in Abraham een bijzondere vrijmoedigheid, vermengd met behoorlijke nederigheid en onderwerping in zijn ijverig voorbidden; anderdeels, in God een wonderlijke vriendelijkheid en verdraagzame goedertierenheid in het antwoorden; waardoor Hij Abraham volkomen bevredigd heeft aangaande de rechtvaardigheid van dit schrikkelijk oordeel, dat Hij over Sodom en Gomórra wilde laten gaan, omdat de maat van hun zonden geheel vol was."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"After that the Lord appeared unto him [viz. to Abraham ] at the oak bushes or grove of Mamre [ see chapter 13 on verse 18 here Abraham had chosen him out of his habitation after that Lot was departed from him chapter 13 verse 18] as he sate in the door of his tent when the day grew hot."}],"2":[{"catchword":null,"tekst":"And he lifted his eyes and he saw and behold there stood three men over against him [ viz. there in the shape of men and men in Abrahams apprehension but indeed two angels and third the Lord indeed himself who for the time of employment appeared with human bodies wherewith they did walk sit down discourse and eat see Heb. 13.2 that the one of them was the Lord God is plain out of the first verse and by the sequel of his story ] when he saw them he ran to meet them from the door of his tent and bowed himself to the ground [viz. to exhibit them civil honor and respect so chapter 23.7,12 1Sa 25:24 2Sa 14:2 1Ki 1:23 Est 3:2.]"}],"3":[{"catchword":null,"tekst":"And he said my Lord [others my lords] have I now found grace [that is if thou count me of worthy of so much favor honor and friendship to find grace with men is to get their favor affection and friendship see chapter 32.5 & 34.11 & 39.4 &c.] in thy eyes [Abraham addresseth his speech to one of them that had the best presence whom afterwards he found to be the Lord] then I pray do not pass by from thy servant."}],"4":[{"catchword":null,"tekst":"That yet a little water might be brought [Heb. Taken see chapter 12.9, 10.]and wash your feet [ according to the custom of those countries to cleanse and refresh the same being that by reason of heat they used there to go with soles and fastened to their feet or barefoot altogether see chapter 19.2 & 24.31,43.24 & Joh 13:4,5] and lean under this tree [ that is rest yourselves there.]"}],"5":[{"catchword":null,"tekst":"And I will fetch a bit of bread [ the Hebrews call all manner of meat bread 1Sa 14:24 Mat 6:11 & 15.2 Luk 14:11,15 compare chapter 3.19 ] that ye may strengthen your heart [see of this manner of speaking Jude 19.58 Psa 104:15 1Ki 13:7 to strengthen is here to refresh and nourish which is effect of bread Psa 104:15 not of itself but through the blessing of God Deu 8:3 Mat 4:4] then ye shall go forth therefore because ye are come over to your servant [ others for therefore are ye &c. not that he thought they had come of purpose to him but that God had led them thitherward by his prudence see chapter 33.verse 10] they said d as thou hath spoken."}],"6":[{"catchword":null,"tekst":"And Abraham hasted to the tent to Sarah and he said hast thee need three measures [Heb. Seim which was a certain measure for wares holding as much as 144 hen egg shells the third part of an Epha of which measure see likewise Exodus 16 on verse 36] of flour and make cake [Heb. Word doth signify such cakes as are on an hot heart under or upon hot cumbers see Exo 12:39 Num 11:8 1Ki 17:3 & 19.6.]"}],"7":[{"catchword":null,"tekst":"And Abraham ran to the beeves and he took a calf [Heb. A bus son that is a calf or young buck] tender and good and he gave it to the servant who hasted to make it ready."}],"8":[{"catchword":null,"tekst":"And he took butter and milk and the calf which he had made ready and he set it before them [Heb. before their face] and stood by them] to wait upon and serve them [under that tree and they did eat. [See verse 2.]"}],"9":[{"catchword":null,"tekst":"Then they said unto him where Sarah is thy wife? [ not as if they knew it not but take occasion thereby to come upon the following discourse ] and he said behold in the tent [ Abraham pointed at his wives tent as appears by the next verse for the father of the family and the mother of the family had each of them their tent apart chapter 23.2 and 24.67 and 31.33.]"}],"10":[{"catchword":null,"tekst":"And he said [ the Lord namely ] I shall assuredly return unto thee [ Heb I shall returning return this return must not be understood by just another apparition as this was but of the fulfilling of this promise called a visitation chapter 2.11 ] about this time of life [ that is the next year about this time of the men&acirc;&euro;&trade;s living another when this time of men&acirc;&euro;&trade;s living see the same phrase likewise verse 14 // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}

document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);

});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +

    if (!refs || !refs.length) return '';

  const knoop = nd => {

  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
