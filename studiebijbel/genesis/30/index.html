me</span> Gad.", "12": "And <span class=\"wl wl-kjv\" data-code=\"H2153\">Zilpah</span> <span class=\"wl wl-kjv\" data-code=\"H3812\">Leah's</span> <span class=\"wl wl-kjv\" data-code=\"H8198\">maid</span> <span class=\"wl wl-kjv\" data-code=\"H3205\">bare</span> <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> a <span class=\"wl wl-kjv\" data-code=\"H8145\">second</span> son.", "13": "And <span class=\"wl wl-kjv\" data-code=\"H3812\">Leah</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Happy am <span class=\"wl wl-kjv\" data-code=\"H837\">I,</span> for the <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters</span> will call me <span class=\"wl wl-kjv\" data-code=\"H833\">blessed:</span> and she <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> his <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> Asher.", "14": "And <span class=\"wl wl-kjv\" data-code=\"H7205\">Reuben</span> went <span class=\"wl wl-kjv\" data-code=\"H3212\">in</span> the <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> of <span class=\"wl wl-kjv\" data-code=\"H2406\">wheat</span> <span class=\"wl wl-kjv\" data-code=\"H7105\">harvest,</span> and <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> <span class=\"wl wl-kjv\" data-code=\"H1736\">mandrakes</span> in the <span class=\"wl wl-kjv\" data-code=\"H7704\">field,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> them unto his <span class=\"wl wl-kjv\" data-code=\"H517\">mother</span> <span class=\"wl wl-kjv\" data-code=\"H3812\">Leah.</span> Then <span class=\"wl wl-kjv\" data-code=\"H7354\">Rachel</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to <span class=\"wl wl-kjv\" data-code=\"H3812\">Leah,</span> Give <span class=\"wl wl-kjv\" data-code=\"H5414\">me,</span> I pray thee, of thy <span class=\"wl wl-kjv\" data-code=\"H1121\">son's</span> mandrakes.", "15": "And she <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto her, Is it a small <span class=\"wl wl-kjv\" data-code=\"H4592\">matter</span> that thou hast <span class=\"wl wl-kjv\" data-code=\"H3947\">taken</span> my <span class=\"wl wl-kjv\" data-code=\"H376\">husband?</span> and wouldest thou take <span class=\"wl wl-kjv\" data-code=\"H3947\">away</span> my <span class=\"wl wl-kjv\" data-code=\"H1121\">son's</span> <span class=\"wl wl-kjv\" data-code=\"H1736\">mandrakes</span> also? And <span class=\"wl wl-kjv\" data-code=\"H7354\">Rachel</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Therefore he shall <span class=\"wl wl-kjv\" data-code=\"H7901\">lie</span> with thee to <span class=\"wl wl-kjv\" data-code=\"H3915\">night</span> <span class=\"wl wl-kjv\" data-code=\"H8478\">for</span> thy <span class=\"wl wl-kjv\" data-code=\"H1121\">son's</span> mandrakes.", "16": "And <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> out of the <span class=\"wl wl-kjv\" data-code=\"H7704\">field</span> in the <span class=\"wl wl-kjv\" data-code=\"H6153\">evening,</span> and <span class=\"wl wl-kjv\" data-code=\"H3812\">Leah</span> went <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> to <span class=\"wl wl-kjv\" data-code=\"H7125\">meet</span> him, and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Thou must come <span class=\"wl wl-kjv\" data-code=\"H935\">in</span> unto me; for <span class=\"wl wl-kjv\" data-code=\"H7936\">surely</span> I have <span class=\"wl wl-kjv\" data-code=\"H7936\">hired</span> thee with my <span class=\"wl wl-kjv\" data-code=\"H1121\">son's</span> <span class=\"wl wl-kjv\" data-code=\"H1736\">mandrakes.</span> And he <span class=\"wl wl-kjv\" data-code=\"H7901\">lay</span> with her that night.", "17": "And <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">hearkened</span> unto <span class=\"wl wl-kjv\" data-code=\"H3812\">Leah,</span> and she <span class=\"wl wl-kjv\" data-code=\"H2029\">conceived,</span> and <span class=\"wl wl-kjv\" data-code=\"H3205\">bare</span> <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> the <span class=\"wl wl-kjv\" data-code=\"H2549\">fifth</span> son.", "18": "And <span class=\"wl wl-kjv\" data-code=\"H3812\">Leah</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> hath <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> me my <span class=\"wl wl-kjv\" data-code=\"H7939\">hire,</span> <span class=\"wl wl-kjv\" data-code=\"H834\">because</span> I have <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> my <span class=\"wl wl-kjv\" data-code=\"H8198\">maiden</span> to my <span class=\"wl wl-kjv\" data-code=\"H376\">husband:</span> and she <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> his <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> Issachar.", "19": "And <span class=\"wl wl-kjv\" data-code=\"H3812\">Leah</span> <span class=\"wl wl-kjv\" data-code=\"H2029\">conceived</span> again, and <span class=\"wl wl-kjv\" data-code=\"H3205\">bare</span> <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> the <span class=\"wl wl-kjv\" data-code=\"H8345\">sixth</span> son.", "20": "And <span class=\"wl wl-kjv\" data-code=\"H3812\">Leah</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> hath <span class=\"wl wl-kjv\" data-code=\"H2064\">endued</span> me with a <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> <span class=\"wl wl-kjv\" data-code=\"H2065\">dowry;</span> <span class=\"wl wl-kjv\" data-code=\"H6471\">now</span> will my <span class=\"wl wl-kjv\" data-code=\"H376\">husband</span> <span class=\"wl wl-kjv\" data-code=\"H2082\">dwell</span> with me, because I have <span class=\"wl wl-kjv\" data-code=\"H3205\">born</span> him <span class=\"wl wl-kjv\" data-code=\"H8337\">six</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">sons:</span> and she <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> his <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> Zebulun.", "21": "And <span class=\"wl wl-kjv\" data-code=\"H310\">afterwards</span> she <span class=\"wl wl-kjv\" data-code=\"H3205\">bare</span> a <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter,</span> and <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> her <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> Dinah.", "22": "And <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H2142\">remembered</span> <span class=\"wl wl-kjv\" data-code=\"H7354\">Rachel,</span> and <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">hearkened</span> to her, and <span class=\"wl wl-kjv\" data-code=\"H6605\">opened</span> her womb.", "23": "And she <span class=\"wl wl-kjv\" data-code=\"H2029\">conceived,</span> and <span class=\"wl wl-kjv\" data-code=\"H3205\">bare</span> a <span class=\"wl wl-kjv\" data-code=\"H1121\">son;</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> hath taken <span class=\"wl wl-kjv\" data-code=\"H622\">away</span> my reproach:", "24": "And she <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> his <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> <span class=\"wl wl-kjv\" data-code=\"H3130\">Joseph;</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall <span class=\"wl wl-kjv\" data-code=\"H3254\">add</span> to me <span class=\"wl wl-kjv\" data-code=\"H312\">another</span> son.", "25": "And it came to pass, when <span class=\"wl wl-kjv\" data-code=\"H7354\">Rachel</span> had <span class=\"wl wl-kjv\" data-code=\"H3205\">born</span> <span class=\"wl wl-kjv\" data-code=\"H3130\">Joseph,</span> that <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H3837\">Laban,</span> Send me <span class=\"wl wl-kjv\" data-code=\"H7971\">away,</span> that I may <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> unto mine own <span class=\"wl wl-kjv\" data-code=\"H4725\">place,</span> and to my country.", "26": "<span class=\"wl wl-kjv\" data-code=\"H5414\">Give</span> me my <span class=\"wl wl-kjv\" data-code=\"H802\">wives</span> and my <span class=\"wl wl-kjv\" data-code=\"H3206\">children,</span> <span class=\"wl wl-kjv\" data-code=\"H2004\">for</span> whom I have <span class=\"wl wl-kjv\" data-code=\"H5647\">served</span> thee, and let me <span class=\"wl wl-kjv\" data-code=\"H3212\">go:</span> for thou <span class=\"wl wl-kjv\" data-code=\"H3045\">knowest</span> my <span class=\"wl wl-kjv\" data-code=\"H5656\">service</span> which I have done", "27": "And <span class=\"wl wl-kjv\" data-code=\"H3837\">Laban</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, I pray thee, if I have <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> <span class=\"wl wl-kjv\" data-code=\"H2580\">favour</span> in thine <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes,</span> tarry: for I have learned by <span class=\"wl wl-kjv\" data-code=\"H5172\">experience</span> that the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H1288\">blessed</span> me for thy sake.", "28": "And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H5344\">Appoint</span> me thy <span class=\"wl wl-kjv\" data-code=\"H7939\">wages,</span> and I will give", "29": "And he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, Thou <span class=\"wl wl-kjv\" data-code=\"H3045\">knowest</span> <span class=\"wl wl-kjv\" data-code=\"H834\">how</span> I have <span class=\"wl wl-kjv\" data-code=\"H5647\">served</span> thee, and <span class=\"wl wl-kjv\" data-code=\"H834\">how</span> thy cattle", "30": "For it was <span class=\"wl wl-kjv\" data-code=\"H4592\">little</span> which thou hadst before <span class=\"wl wl-kjv\" data-code=\"H6440\">I</span> came, and it is now <span class=\"wl wl-kjv\" data-code=\"H6555\">increased</span> unto a <span class=\"wl wl-kjv\" data-code=\"H7230\">multitude;</span> and the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H1288\">blessed</span> thee since my <span class=\"wl wl-kjv\" data-code=\"H7272\">coming:</span> and now <span class=\"wl wl-kjv\" data-code=\"H4970\">when</span> shall I <span class=\"wl wl-kjv\" data-code=\"H6213\">provide</span> for mine own house", "31": "And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> What shall I give <span class=\"wl wl-kjv\" data-code=\"H5414\">thee?</span> And <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Thou shalt not <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> me any <span class=\"wl wl-kjv\" data-code=\"H3972\">thing:</span> if thou wilt <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> this <span class=\"wl wl-kjv\" data-code=\"H1697\">thing</span> for me, I will <span class=\"wl wl-kjv\" data-code=\"H7725\">again</span> <span class=\"wl wl-kjv\" data-code=\"H7462\">feed</span> and <span class=\"wl wl-kjv\" data-code=\"H8104\">keep</span> thy flock:", "32": "I will <span class=\"wl wl-kjv\" data-code=\"H5674\">pass</span> through all thy <span class=\"wl wl-kjv\" data-code=\"H6629\">flock</span> to <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> <span class=\"wl wl-kjv\" data-code=\"H5493\">removing</span> from thence all the <span class=\"wl wl-kjv\" data-code=\"H5348\">speckled</span> and <span class=\"wl wl-kjv\" data-code=\"H2921\">spotted</span> <span class=\"wl wl-kjv\" data-code=\"H7716\">cattle,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H2345\">brown</span> <span class=\"wl wl-kjv\" data-code=\"H7716\">cattle</span> among the <span class=\"wl wl-kjv\" data-code=\"H3775\">sheep,</span> and the <span class=\"wl wl-kjv\" data-code=\"H2921\">spotted</span> and <span class=\"wl wl-kjv\" data-code=\"H5348\">speckled</span> among the <span class=\"wl wl-kjv\" data-code=\"H5795\">goats:</span> and of such shall be my hire.", "33": "So shall my <span class=\"wl wl-kjv\" data-code=\"H6666\">righteousness</span> <span class=\"wl wl-kjv\" data-code=\"H6030\">answer</span> for me in <span class=\"wl wl-kjv\" data-code=\"H3117\">time</span> to <span class=\"wl wl-kjv\" data-code=\"H4279\">come,</span> when it shall <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> for my <span class=\"wl wl-kjv\" data-code=\"H7939\">hire</span> before thy <span class=\"wl wl-kjv\" data-code=\"H6440\">face:</span> every <span class=\"wl wl-kjv\" data-code=\"H3605\">one</span> that is not <span class=\"wl wl-kjv\" data-code=\"H5348\">speckled</span> and <span class=\"wl wl-kjv\" data-code=\"H2921\">spotted</span> among the <span class=\"wl wl-kjv\" data-code=\"H5795\">goats,</span> and <span class=\"wl wl-kjv\" data-code=\"H2345\">brown</span> among the <span class=\"wl wl-kjv\" data-code=\"H3775\">sheep,</span> that shall be counted stolen", "34": "And <span class=\"wl wl-kjv\" data-code=\"H3837\">Laban</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Behold, I would it might <span class=\"wl wl-kjv\" data-code=\"H3863\">be</span> according to thy word.", "35": "And he <span class=\"wl wl-kjv\" data-code=\"H5493\">removed</span> that <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> the he <span class=\"wl wl-kjv\" data-code=\"H8495\">goats</span> that were <span class=\"wl wl-kjv\" data-code=\"H6124\">ringstraked</span> and <span class=\"wl wl-kjv\" data-code=\"H2921\">spotted,</span> and all the she <span class=\"wl wl-kjv\" data-code=\"H5795\">goats</span> that were <span class=\"wl wl-kjv\" data-code=\"H5348\">speckled</span> and <span class=\"wl wl-kjv\" data-code=\"H2921\">spotted,</span> and every one that had some <span class=\"wl wl-kjv\" data-code=\"H3836\">white</span> in it, and all the <span class=\"wl wl-kjv\" data-code=\"H2345\">brown</span> among the <span class=\"wl wl-kjv\" data-code=\"H3775\">sheep,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> them into the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of his sons.", "36": "And he <span class=\"wl wl-kjv\" data-code=\"H7760\">set</span> <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days'</span> <span class=\"wl wl-kjv\" data-code=\"H1870\">journey</span> betwixt himself and <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob:</span> and <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> <span class=\"wl wl-kjv\" data-code=\"H7462\">fed</span> the <span class=\"wl wl-kjv\" data-code=\"H3498\">rest</span> of <span class=\"wl wl-kjv\" data-code=\"H3837\">Laban's</span> flocks.", "37": "And <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> him <span class=\"wl wl-kjv\" data-code=\"H4731\">rods</span> of <span class=\"wl wl-kjv\" data-code=\"H3892\">green</span> <span class=\"wl wl-kjv\" data-code=\"H3839\">poplar,</span> and of the <span class=\"wl wl-kjv\" data-code=\"H3869\">hazel</span> and chesnut <span class=\"wl wl-kjv\" data-code=\"H6196\">tree;</span> and <span class=\"wl wl-kjv\" data-code=\"H6478\">pilled</span> <span class=\"wl wl-kjv\" data-code=\"H3836\">white</span> <span class=\"wl wl-kjv\" data-code=\"H6479\">strakes</span> in them, and made the <span class=\"wl wl-kjv\" data-code=\"H3836\">white</span> <span class=\"wl wl-kjv\" data-code=\"H4286\">appear</span> which was in the rods.", "38": "And he <span class=\"wl wl-kjv\" data-code=\"H3322\">set</span> the <span class=\"wl wl-kjv\" data-code=\"H4731\">rods</span> which he had <span class=\"wl wl-kjv\" data-code=\"H6478\">pilled</span> <span class=\"wl wl-kjv\" data-code=\"H5227\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H6629\">flocks</span> in the <span class=\"wl wl-kjv\" data-code=\"H7298\">gutters</span> in the <span class=\"wl wl-kjv\" data-code=\"H4325\">watering</span> <span class=\"wl wl-kjv\" data-code=\"H8268\">troughs</span> when the <span class=\"wl wl-kjv\" data-code=\"H6629\">flocks</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to <span class=\"wl wl-kjv\" data-code=\"H8354\">drink,</span> that they should <span class=\"wl wl-kjv\" data-code=\"H3179\">conceive</span> when they <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to drink.", "39": "And the <span class=\"wl wl-kjv\" data-code=\"H6629\">flocks</span> <span class=\"wl wl-kjv\" data-code=\"H3179\">conceived</span> before the <span class=\"wl wl-kjv\" data-code=\"H4731\">rods,</span> and brought <span class=\"wl wl-kjv\" data-code=\"H3205\">forth</span> <span class=\"wl wl-kjv\" data-code=\"H6629\">cattle</span> <span class=\"wl wl-kjv\" data-code=\"H6124\">ringstraked,</span> <span class=\"wl wl-kjv\" data-code=\"H5348\">speckled,</span> and spotted.", "40": "And <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> did <span class=\"wl wl-kjv\" data-code=\"H6504\">separate</span> the <span class=\"wl wl-kjv\" data-code=\"H3775\">lambs,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">set</span> the <span class=\"wl wl-kjv\" data-code=\"H6440\">faces</span> of the <span class=\"wl wl-kjv\" data-code=\"H6629\">flocks</span> <span class=\"wl wl-kjv\" data-code=\"H413\">toward</span> the <span class=\"wl wl-kjv\" data-code=\"H6124\">ringstraked,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H2345\">brown</span> in the <span class=\"wl wl-kjv\" data-code=\"H6629\">flock</span> of <span class=\"wl wl-kjv\" data-code=\"H3837\">Laban;</span> and he <span class=\"wl wl-kjv\" data-code=\"H7896\">put</span> his own <span class=\"wl wl-kjv\" data-code=\"H5739\">flocks</span> by themselves, and <span class=\"wl wl-kjv\" data-code=\"H7896\">put</span> them not unto <span class=\"wl wl-kjv\" data-code=\"H3837\">Laban's</span> cattle.", "41": "And it came to pass, whensoever the <span class=\"wl wl-kjv\" data-code=\"H7194\">stronger</span> <span class=\"wl wl-kjv\" data-code=\"H6629\">cattle</span> did <span class=\"wl wl-kjv\" data-code=\"H3179\">conceive,</span> that <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> <span class=\"wl wl-kjv\" data-code=\"H7760\">laid</span> the <span class=\"wl wl-kjv\" data-code=\"H4731\">rods</span> before the <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes</span> of the <span class=\"wl wl-kjv\" data-code=\"H6629\">cattle</span> in the <span class=\"wl wl-kjv\" data-code=\"H7298\">gutters,</span> that they might <span class=\"wl wl-kjv\" data-code=\"H3179\">conceive</span> among the rods.", "42": "But when the <span class=\"wl wl-kjv\" data-code=\"H6629\">cattle</span> were <span class=\"wl wl-kjv\" data-code=\"H5848\">feeble,</span> he put them not <span class=\"wl wl-kjv\" data-code=\"H7760\">in:</span> so the <span class=\"wl wl-kjv\" data-code=\"H5848\">feebler</span> were <span class=\"wl wl-kjv\" data-code=\"H3837\">Laban's,</span> and the <span class=\"wl wl-kjv\" data-code=\"H7194\">stronger</span> Jacob's.", "43": "And the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> <span class=\"wl wl-kjv\" data-code=\"H6555\">increased</span> <span class=\"wl wl-kjv\" data-code=\"H3966\">exceedingly,</span> and had <span class=\"wl wl-kjv\" data-code=\"H7227\">much</span> <span class=\"wl wl-kjv\" data-code=\"H6629\">cattle,</span> and <span class=\"wl wl-kjv\" data-code=\"H8198\">maidservants,</span> and <span class=\"wl wl-kjv\" data-code=\"H5650\">menservants,</span> and <span class=\"wl wl-kjv\" data-code=\"H1581\">camels,</span> and asses /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    const heeftB = D.koppeling && D.koppeling[n];
    const heeftK = D.koppeling_kjv && D.koppeling_kjv[n];
    let h = '<div class="verg-kop">Grondwoorden</div>';
    if (!heeftB && !heeftK) {
      h += '<em>Nog geen woordkoppeling voor dit vers.</em>';
    } else {
      if (heeftB) h += `<div class="tsk-kop">SVnu</div>` +
        `<div class="gw-tekst" style="font-family:Georgia,serif;line-height:1.8">${D.koppeling[n]}</div>` +
        `<div class="gw-detail" style="margin-top:.5rem"></div>`;
      if (heeftK) h += `<div class="tsk-kop" style="margin-top:.9rem">KJV</div>` +
        `<div class="gw-tekst" style="font-family:Georgia,serif;line-height:1.8">${D.koppeling_kjv[n]}</div>` +
        `<div class="gw-detail" style="margin-top:.5rem"></div>`;
      h += '<div class="bronregel">Klik op een onderstreept woord voor de vindplaatsen.</div>';
    }
    h += '<div class="verg-kop" style="margin-top:1.4rem">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const berea = D.tsk[n], engels = D.tsk_kjv[n];
    if ((!berea || !berea.length) && (!engels || !engels.length)) return '<em>Geen verwijzingen bij dit vers.</em>';
    let h = '';
    if (berea && berea.length) {
      h += '<div class="tsk-kop">Treasury of Scripture Knowledge | SVnu</div>';
      h += berea.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r}">${r}</a>`).join('') + '</div>').join('');
    }
    if (engels && engels.length) {
      h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.tsk[n] && D.tsk[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vergelijk</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een vers: snel wisselen van vertaling ---------- */
(function () {
  const menu = document.createElement('div');
  menu.id = 'vertmenu';
  menu.style.cssText = 'position:absolute;display:none;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.3rem;font-family:sans-serif;font-size:.85rem;z-index:30;min-width:7rem;';
  document.body.appendChild(menu);
  function toon(x, y) {
    menu.innerHTML = Object.keys(D.vertalingen).map(naam =>
      `<div class="vm-optie" data-v="${naam}" style="padding:.35rem .6rem;border-radius:5px;cursor:pointer;${naam === vertaling ? 'font-weight:700;color:var(--accent-donker)' : ''}">${naam}</div>`
    ).join('');
    const breedte = document.documentElement.clientWidth;
    menu.style.left = Math.max(4, Math.min(x, breedte - 130)) + 'px';
    menu.style.top = y + 'px';
    menu.style.display = 'block';
  }
  document.addEventListener('contextmenu', e => {
    const rij = e.target.closest('.vers');
    if (!rij) return;
    e.preventDefault();
    toon(e.pageX, e.pageY);
  });
  menu.addEventListener('mouseover', e => {
    const o = e.target.closest('.vm-optie');
    if (o) o.style.background = 'var(--bg-soft)';
  });
  menu.addEventListener('mouseout', e => {
    const o = e.target.closest('.vm-optie');
    if (o) o.style.background = '';
  });
  menu.addEventListener('click', e => {
    const o = e.target.closest('.vm-optie');
    if (!o) return;
    vertaling = o.dataset.v;
    const kies = document.getElementById('vertaalkies');
    if (kies) kies.value = vertaling;
    bouwRijen();
    menu.style.display = 'none';
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#vertmenu')) menu.style.display = 'none';
  });
  document.addEventListener('scroll', () => { menu.style.display = 'none'; }, true);
})();
</script>
