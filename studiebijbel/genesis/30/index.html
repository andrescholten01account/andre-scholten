<style>
  :root {
    /* huisstijl overgenomen van andre-scholten.nl (Quartz) */
    --light:#ffffff; --lightgray:#e5e5e5; --gray:#b3b3b3; --darkgray:#333333; --dark:#111111;

    --accent: var(--secondary); --accent-donker: var(--dark); --bg: var(--light);
    --bg-soft: #f5f5f5; --border: var(--lightgray); --tekst: var(--darkgray);
  }
  * { box-sizing: border-box; }
  body { font-family: var(--bodyFont); background: var(--bg); color: var(--tekst); margin: 0; line-height: 1.7; }
  .omslag { max-width: 900px; margin: 0 auto; padding: 1.2rem 1rem 4rem; }

  h2.hfd { color: var(--dark); text-align: center; font-size: 1.75rem; font-weight: 700; margin: 2rem 0 0; }

  .hfdnav { display:flex; justify-content:space-between; align-items:center; gap:.6rem; flex-wrap:wrap; font-family:"Lora"; font-size:.85rem; padding:.5rem 0; margin-bottom:1.1rem; }
  .navknop { color:var(--accent); text-decoration:none; padding:.25rem .3rem; white-space:nowrap; }
  .navknop:hover { color:var(--accent-donker); text-decoration:underline; }

  .hfdnav .midden { display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:.4rem; color:#777; }
  .hfdnav select { font-family:"Lora"; font-size:.85rem; border:1px solid var(--border); border-radius:999px; padding:.3rem 1.6rem .3rem .8rem; background:#fff; color:var(--accent-donker); cursor:pointer; }

  .navselect { font-family:"Lora"; font-size:.85rem; border:1px solid var(--border); border-radius:999px; padding:.3rem 1.6rem .3rem .8rem; background:#fff; color:var(--accent-donker); cursor:pointer; display:inline-flex; align-items:center; text-decoration:none; }
  #bibliotheekknop { padding:.3rem .7rem; font-size:1rem; line-height:1; }

     wrapt dan als 'boek hoofdstuk' boven / 'vertaling lampje' onder */
  @media (min-width: 641px) {
    #vertaalkies { order: -1; }
  }

  /* verzen — tabsmodus (één kolom) */
  .vers { position: relative; display: flex; gap: .8rem; padding: .45rem 2.4rem .45rem .4rem; border-radius: 8px; cursor: pointer; }
  .vers:hover { background: var(--bg-soft); }
  .vers.open { background: var(--bg-soft); box-shadow: inset 3px 0 0 var(--accent); border-radius: 8px 8px 0 0; }
  .vers.flits { animation: flits 1.6s ease-out; }
  @keyframes flits { 0% { background: #e0e0e0; } 100% { background: var(--bg-soft); } }
  .vnr { color: #999999; font-size: .75rem; min-width: 1.6rem; text-align: right; padding-top: .45rem; font-family: "Lora"; }
  .vtekst em, .pcel em { font-style: italic; color: #555; }
  .wl { border-bottom: 1px dotted var(--accent); }
  .noot { color: var(--accent); cursor: pointer; font-weight: 700; padding: 0 .05rem; }
  .noot:hover { color: var(--accent-donker); }
  #notenlijst { margin: 1.5rem 0 0 2.4rem; font-family: "Lora"; font-size: .82rem; color: #666; border-top: 1px solid var(--border); padding-top: .8rem; }
  #notenlijst h3 { font-size: .78rem; text-transform: uppercase; letter-spacing: .12em; color: var(--accent-donker); margin: 0 0 .5rem; }

  #notenlijst .nootregel .nn { color: var(--accent); font-weight: 700; margin-right: .35rem; }
  .kopieer { position: absolute; right: .4rem; top: .55rem; opacity: 0; border: none; background: none; cursor: pointer; color: var(--accent); font-size: .95rem; padding: .1rem .3rem; transition: opacity .15s; }
  .vers:hover .kopieer { opacity: .75; }
  .kopieer:hover { opacity: 1 !important; }

  /* parallelmodus (kolommen naast elkaar) */
  #bijbel.parallel .vers { display:grid; gap:.8rem; cursor:pointer; align-items:start; }
  #bijbel.parallel .vnr { grid-row: 1; }
  .kolomkop { display:none; }
  #bijbel.parallel + .kolomkop, .kolomkop.tonen { }
  .pk { font-family:"Lora"; font-size:.72rem; text-transform:uppercase; letter-spacing:.12em; color:var(--accent-donker); font-weight:700; }
  #bijbel.parallel .pcel em { font-style:italic; color:#555; }

  /* naslagpaneel */
  .paneel { display: none; margin: 0 0 .6rem 0; background: #fff; box-shadow: inset 3px 0 0 var(--accent); border-radius: 0 0 8px 8px; padding: .9rem 1.1rem 1rem; font-family: "Lora"; font-size: 1rem; }
  .paneel.open { display: block; }

  .ntab.actief { background: var(--accent); color: #fff; border-color: var(--accent); }
  .ntab.leeg { opacity: .4; cursor: default; }

 Jakob geen kinderen gaf, benijdde Rachel haar zuster; en zij zei tegen Jakob: Geef mij kinderen! Anders ben ik dood.","2":"Toen ontstak Jakobs toorn tegen Rachel, en hij zei: Ben ik dan in de plaats van God, Die de vrucht van uw buik van u geweerd heeft?","3":"En zij zei: Zie, daar is mijn dienstmaagd Bilha, ga bij haar; dat zij op mijn knieën baart, en ik ook uit haar gebouwd word.","4":"Zo gaf zij hem haar dienstmaagd Bilha tot vrouw; en Jakob ging bij haar.","5":"En Bilha werd zwanger, en baarde Jakob een zoon.","6":"Toen zei Rachel: God heeft mij recht gedaan, en heeft ook mijn stem verhoord, en heeft mij een zoon gegeven; daarom noemde zij zijn naam Dan.","7":"En Bilha, Rachels dienstmaagd, werd opnieuw zwanger, en baarde Jakob een tweede zoon.","8":"Toen zei Rachel: Ik heb worstelingen van God met mijn zuster geworsteld; ook heb ik de overhand gehad; en zij noemde zijn naam Nafthali.","9":"Toen Lea nu zag dat zij ophield met baren, nam zij ook haar dienstmaagd Zilpa, en gaf haar aan Jakob tot vrouw.","10":"En Zilpa, Lea's dienstmaagd, baarde Jakob een zoon.","11":"Toen zei Lea: Er komt een hoop! En zij noemde zijn naam Gad.","12":"Daarna baarde Zilpa, Lea's dienstmaagd, Jakob een tweede zoon.","13":"Toen zei Lea: Tot mijn geluk! Want de dochters zullen mij gelukkig noemen; en zij noemde zijn naam Aser.","14":"En Ruben ging in de dagen van de tarweoogst, en hij vond dudaïm in het veld, en hij bracht die naar zijn moeder Lea. Toen zei Rachel tegen Lea: Geef mij toch van de dudaïm van uw zoon.","15":"En zij zei tegen haar: Is het weinig dat u mijn man genomen hebt, dat u ook de dudaïm van mijn zoon nemen wilt? Toen zei Rachel: Daarom zal hij deze nacht bij u liggen, voor de dudaïm van uw zoon.","16":"Toen Jakob 's avonds uit het veld kwam, ging Lea naar buiten, hem tegemoet, en zei: U moet bij mij komen; want ik heb u zeker gehuurd voor de dudaïm van mijn zoon; en hij lag die nacht bij haar.","17":"En God verhoorde Lea; en zij werd zwanger, en baarde Jakob de vijfde zoon.","18":"Toen zei Lea: God heeft mij mijn loon gegeven, omdat ik mijn dienstmaagd aan mijn man gegeven heb; en zij noemde zijn naam Issaschar.","19":"En Lea werd opnieuw zwanger, en zij baarde Jakob de zesde zoon.","20":"En Lea zei: God heeft mij, *mij heeft Hij* begiftigd met een goede gift; deze keer zal mijn man mij bijwonen; want ik heb hem zes zonen gebaard; en zij noemde zijn naam Zebulon.","21":"En zij baarde daarna een dochter; en zij noemde haar naam Dina.","22":"God dacht ook aan Rachel; en God verhoorde haar, en opende haar baarmoeder.","23":"En zij werd zwanger, en baarde een zoon; en zij zei: God heeft mijn smaad weggenomen!","24":"En zij noemde zijn naam Jozef, en zei: De HEERE voegt mij nog een andere zoon toe.","25":"En het gebeurde, toen Rachel Jozef gebaard had, dat Jakob tegen Laban zei: Laat mij vertrekken, dat ik ga naar mijn plaats, en naar mijn land.","26":"Geef mij mijn vrouwen en mijn kinderen, voor wie ik u gediend heb, dat ik vertrek; want u weet mijn dienst, die ik u gediend heb.","27":"Toen zei Laban tegen hem: Als ik toch genade gevonden heb in uw ogen; ik heb ondervonden dat de HEERE mij om u gezegend heeft.","28":"Hij zei dan: Noem mij uitdrukkelijk uw loon, dat ik geven zal.","29":"Toen zei hij tegen hem: U weet hoe ik u gediend heb, en hoe uw vee bij mij geweest is.","30":"Want het weinige dat u voor mij had, is uitgebroken tot een menigte; en de HEERE heeft u gezegend bij mijn komst; nu dan, wanneer zal ik ook voor mijn eigen huis werken?","31":"En hij zei: Wat zal ik u geven? Toen zei Jakob: U hoeft mij helemaal niets te geven, als u mij dit wilt doen; ik zal opnieuw uw kudde weiden en bewaren.","32":"Ik zal heden door heel uw kudde gaan, en daaruit afzonderen al het gespikkelde en geplekte vee, en al het bruine vee onder de lammeren, en het geplekte en gespikkelde onder de geiten; en dat zal mijn loon zijn.","33":"Zo zal mijn rechtvaardigheid morgen voor mij getuigen, als u komt over mijn loon, voor uw gezicht; alles wat niet gespikkeld en geplekt is onder de geiten en bruin onder de lammeren, dat zal bij mij als gestolen gelden.","34":"Toen zei Laban: Zie, och ja, laat het naar uw woord zijn!","35":"En hij zonderde dezelfde dag af de gesprenkelde en geplekte bokken en al de gespikkelde en geplekte geiten, alles waar wit aan was, en al het bruine onder de lammeren; en hij gaf ze in de hand van zijn zonen.","36":"En hij stelde een afstand van drie dagen tussen zichzelf en Jakob; en Jakob weidde de overige kudde van Laban.","37":"Toen nam Jakob voor zichzelf takken van groen populierenhout, en van hazelaar, en van kastanje; en hij schilde daarin witte strepen, zodat het wit dat aan die takken was, bloot kwam te liggen.","38":"En hij legde deze takken, die hij geschild had, in de goten, in de drinkbakken van het water, waar de kudde kwam drinken, tegenover de kudde; en zij werden verhit, als zij kwamen om te drinken.","39":"Als dan de kudde verhit werd bij de takken, dan lammerde de kudde gesprenkelde, gespikkelde en geplekte lammeren.","40":"Toen scheidde Jakob de lammeren, en hij wendde het gezicht van de kudde naar het gesprenkelde, en al het bruine onder Labans kudde; en hij zette zijn eigen kudden apart, en hij zette ze niet bij de kudde van Laban.","41":"En het gebeurde, telkens als de sterkere dieren van de kudde verhit werden, dat Jakob de takken voor de ogen van de kudde in de goten legde, zodat zij verhit werden bij de takken.","42":"Maar als de kudde zwak was, legde hij ze niet erbij, zodat de zwakke dieren aan Laban toekwamen, en de sterke aan Jakob.","43":"En die man breidde zich zeer sterk uit, en hij had veel kudden, en dienstmaagden, en dienstknechten, en kamelen, en ezels."},"SV":{"1":"Als nu Rachel zag, dat zij Jakob niet baarde, zo benijdde Rachel haar zuster; en zij zeide tot Jakob: Geef mij kinderen! of indien niet, zo ben ik dood.","2":"Toen ontstak Jakobs toorn tegen Rachel, en hij zeide: Ben ik dan in plaats van God, Die de vrucht des buiks van u geweerd heeft?","3":"En zij zeide: Zie, daar is mijn dienstmaagd Bilha, ga tot haar in; dat zij op mijn knieën bare, en ik ook uit haar gebouwd worde.","4":"Zo gaf zij hem haar dienstmaagd Bilha tot een vrouw; en Jakob ging tot haar in.","5":"En Bilha werd zwanger, en baarde Jakob een zoon.","6":"Toen zeide Rachel: God heeft mij gericht, en ook mijn stem verhoord, en heeft mij een zoon gegeven; daarom noemde zij zijn naam Dan.","7":"En Bilha, Rachels dienstmaagd, werd wederom bevrucht, en baarde Jakob den tweeden zoon.","8":"Toen zeide Rachel: Ik heb worstelingen Gods met mijn zuster geworsteld; ook heb ik de overhand gehad; en zij noemde zijn naam Nafthali.","9":"Toen nu Lea zag, dat zij ophield van baren, nam zij ook haar dienstmaagd Zilpa, en gaf die aan Jakob tot een vrouw.","10":"En Zilpa, Lea’s dienstmaagd, baarde Jakob een zoon.","11":"Toen zeide Lea: Er komt een hoop! en zij noemde zijn naam Gad.","12":"Daarna baarde Zilpa, Lea’s dienstmaagd, Jakob een tweeden zoon.","13":"Toen zeide Lea: Tot mijn geluk! want de dochters zullen mij gelukkig achten; en zij noemde zijn naam Aser.","14":"En Ruben ging in de dagen van de tarweoogst, en hij vond Dudaim in het veld, en hij bracht die tot zijn moeder Lea. Toen zeide Rachel tot Lea: Geef mij toch van uws zoons Dudaim.","15":"En zij zeide tot haar: Is het weinig, dat gij mijn man genomen hebt, dat gij ook mijns zoons Dudaim nemen zult? Toen zeide Rachel: Daarom zal hij dezen nacht voor uws zoons Dudaim bij u liggen.","16":"Als nu Jakob des avonds uit het veld kwam, ging Lea uit hem tegemoet, en zeide: Gij zult tot mij inkomen; want ik heb u om loon zekerlijk gehuurd voor mijns zoons Dudaim; en hij lag dien nacht bij haar.","17":"En God verhoorde Lea; en zij werd bevrucht, en baarde Jakob den vijfden zoon.","18":"Toen zeide Lea: God heeft mijn loon gegeven, nadat ik mijn dienstmaagd aan mijn man gegeven heb; en zij noemde zijn naam Issaschar.","19":"En Lea werd wederom bevrucht, en zij baarde Jakob den zesden zoon.","20":"En Lea zeide: God heeft mij, mij *heeft* *Hij* begiftigd met een goede gift; ditmaal zal mijn man mij bijwonen; want ik heb hem zes zonen gebaard; en zij noemde zijn naam Zebulon.","21":"En zij baarde daarna een dochter; en zij noemde haar naam Dina.","22":"God dacht ook aan Rachel; en God verhoorde haar, en opende haar baarmoeder.","23":"En zij werd bevrucht, en baarde een zoon; en zij zeide: God heeft mijn smaadheid weggenomen!","24":"En zij noemde zijn naam Jozef, zeggende: De HEERE voege mij een anderen zoon daartoe.","25":"En het geschiedde, dat Rachel Jozef gebaard had, dat Jakob tot Laban zeide: Laat mij vertrekken, dat ik ga tot mijn plaats, en naar mijn land.","26":"Geef mijn vrouwen, en mijn kinderen, om welke ik u gediend heb, dat ik vertrek; want gij weet mijn dienst, dien ik u gediend heb.","27":"Toen zeide Laban tot hem: Zo ik nu genade gevonden heb in uw ogen; ik heb waargenomen, dat de HEERE mij om uwentwil gezegend heeft.","28":"Hij zeide dan: Noem mij uitdrukkelijk uw loon, dat ik geven zal.","29":"Toen zeide hij tot hem: Gij weet, hoe ik u gediend heb, en hoe uw vee bij mij geweest is.","30":"Want het weinige, dat gij voor mij gehad hebt, dat is tot een menigte uitgebroken; en de HEERE heeft u gezegend bij mijn voet; nu dan, wanneer zal ik ook werken voor mijn huis?","31":"En hij zeide: Wat zal ik u geven? Toen zeide Jakob: Gij zult mij niet met al geven, indien gij mij deze zaak doen zult; ik zal wederom uw kudden weiden, *en* bewaren.","32":"Ik zal heden door uw ganse kudde gaan, daarvan afzonderende al het gespikkelde en geplekte vee, en al het bruine vee onder de lammeren, en het geplekte en gespikkelde onder de geiten; en zulks zal mijn loon zijn.","33":"Zo zal mijn gerechtigheid op den dag van morgen met mij betuigen, als gij komen zult over mijn loon, voor uw aangezicht; al wat niet gespikkeld en geplekt is onder de geiten en bruin onder de lammeren, dat zij bij mij gestolen.","34":"Toen zeide Laban: Zie, och ja, het zij naar uw woord!","35":"En hij zonderde af ten zelfden dage de gesprenkelde en geplekte bokken en al de gespikkelde en geplekte geiten, al waar wit aan was, en al het bruine onder de lammeren; en hij gaf dezelve in de hand zijner zonen.","36":"En hij stelde een weg van drie dagen tussen hem, en tussen Jakob; en Jakob weidde de overige kudde van Laban.","37":"Toen nam zich Jakob roeden van groen populierenhout, en van hazelaar, en van kastanje; en hij schilde daarin witte strepen, ontblotende het wit, hetwelk aan die roeden was.","38":"En hij leide deze roeden, die hij geschild had, in de goten, *en* in de drinkbakken van het water, waar de kudde kwam drinken, tegenover de kudde; en zij werden verhit, als zij kwamen om te drinken.","39":"Als dan de kudde verhit werd bij de roeden, zo lammerde de kudde gesprenkelde, gespikkelde, en geplekte.","40":"Toen scheidde Jakob de lammeren, en hij wendde het gezicht der kudde op het gesprenkelde, en al het bruine onder Labans kudde; en hij stelde zijn kudden alleen, en hij zette ze niet bij de kudde van Laban.","41":"En het geschiedde, telkens als de kudde der vroegelingen verhit werd, zo stelde Jakob de roeden voor de ogen der kudde in de goten, opdat zij hittig werden bij de roeden.","42":"Maar als de kudde spade hittig werd, zo stelde hij ze niet, zodat de spadelingen Laban, en de vroegelingen Jakob toekwamen.","43":"En die man brak gans zeer uit *in* *menigte*, en hij had vele kudden, en dienstmaagden, en dienstknechten, en kemelen, en ezelen."},"KJV":{"1":"And when Rachel saw that she bare Jacob no children, Rachel envied her sister; and said unto Jacob, Give me children, or else I die.","2":"And Jacob's anger was kindled against Rachel: and he said, *Am* I in God's stead, who hath withheld from thee the fruit of the womb?","3":"And she said, Behold my maid Bilhah, go in unto her; and she shall bear upon my knees, that I may also have children","4":"And she gave him Bilhah her handmaid to wife: and Jacob went in","5":"And Bilhah conceived, and bare Jacob a son.","6":"And Rachel said, God hath judged me, and hath also heard my voice, and hath given me a son: therefore called she his name Dan.","7":"And Bilhah Rachel's maid conceived again, and bare Jacob a second son.","8":"And Rachel said, With great wrestlings have I wrestled with my sister, and I have prevailed: and she called his name Naphtali.","9":"When Leah saw that she had left bearing, she took Zilpah her maid, and gave her Jacob to wife.","10":"And Zilpah Leah's maid bare Jacob a son.","11":"And Leah said, A troop cometh: and she called his name Gad.","12":"And Zilpah Leah's maid bare Jacob a second son.","13":"And Leah said, Happy am I, for the daughters will call me blessed: and she called his name Asher.","14":"And Reuben went in the days of wheat harvest, and found mandrakes in the field, and brought them unto his mother Leah. Then Rachel said to Leah, Give me, I pray thee, of thy son's mandrakes.","15":"And she said unto her, *Is it* a small matter that thou hast taken my husband? and wouldest thou take away my son's mandrakes also? And Rachel said, Therefore he shall lie with thee to night for thy son's mandrakes.","16":"And Jacob came out of the field in the evening, and Leah went out to meet him, and said, Thou must come in unto me; for surely I have hired thee with my son's mandrakes. And he lay with her that night.","17":"And God hearkened unto Leah, and she conceived, and bare Jacob the fifth son.","18":"And Leah said, God hath given me my hire, because I have given my maiden to my husband: and she called his name Issachar.","19":"And Leah conceived again, and bare Jacob the sixth son.","20":"And Leah said, God hath endued me *with* a good dowry; now will my husband dwell with me, because I have born him six sons: and she called his name Zebulun.","21":"And afterwards she bare a daughter, and called her name Dinah.","22":"And God remembered Rachel, and God hearkened to her, and opened her womb.","23":"And she conceived, and bare a son; and said, God hath taken away my reproach:","24":"And she called his name Joseph; and said, The LORD shall add to me another son.","25":"And it came to pass, when Rachel had born Joseph, that Jacob said unto Laban, Send me away, that I may go unto mine own place, and to my country.","26":"Give *me* my wives and my children, for whom I have served thee, and let me go: for thou knowest my service which I have done","27":"And Laban said unto him, I pray thee, if I have found favour in thine eyes, *tarry: for* I have learned by experience that the LORD hath blessed me for thy sake.","28":"And he said, Appoint me thy wages, and I will give","29":"And he said unto him, Thou knowest how I have served thee, and how thy cattle","30":"For *it was* little which thou hadst before I *came*, and it is *now* increased unto a multitude; and the LORD hath blessed thee since my coming: and now when shall I provide for mine own house","31":"And he said, What shall I give thee? And Jacob said, Thou shalt not give me any thing: if thou wilt do this thing for me, I will again feed *and* keep thy flock:","32":"I will pass through all thy flock to day, removing from thence all the speckled and spotted cattle, and all the brown cattle among the sheep, and the spotted and speckled among the goats: and *of such* shall be my hire.","33":"So shall my righteousness answer for me in time to come, when it shall come for my hire before thy face: every one that *is* not speckled and spotted among the goats, and brown among the sheep, that shall be counted stolen","34":"And Laban said, Behold, I would it might be according to thy word.","35":"And he removed that day the he goats that were ringstraked and spotted, and all the she goats that were speckled and spotted, *and* every one that had *some* white in it, and all the brown among the sheep, and gave *them* into the hand of his sons.","36":"And he set three days' journey betwixt himself and Jacob: and Jacob fed the rest of Laban's flocks.","37":"And Jacob took him rods of green poplar, and of the hazel and chesnut tree; and pilled white strakes in them, and made the white appear which *was* in the rods.","38":"And he set the rods which he had pilled before the flocks in the gutters in the watering troughs when the flocks came to drink, that they should conceive when they came to drink.","39":"And the flocks conceived before the rods, and brought forth cattle ringstraked, speckled, and spotted.","40":"And Jacob did separate the lambs, and set the faces of the flocks toward the ringstraked, and all the brown in the flock of Laban; and he put his own flocks by themselves, and put them not unto Laban's cattle.","41":"And it came to pass, whensoever the stronger cattle did conceive, that Jacob laid the rods before the eyes of the cattle in the gutters, that they might conceive among the rods.","42":"But when the cattle were feeble, he put *them* not in: so the feebler were Laban's, and the stronger Jacob's.","43":"And the man increased exceedingly, and had much cattle, and maidservants, and menservants, and camels, and asses."}},"tsk":{"1":[{"kopje":"toen Rachel","refs":["Gen 29:31"]},{"kopje":"benijdde Rachel","refs":["Gen 37:11","1 Sam 1:4-8","Ps 106:16","Spr 14:30","Pred 4:4","1 Kor 3:3","Gal 5:21","Tit 3:3","Jak 3:14","Jak 4:5"]},{"kopje":"anders ben ik dood","refs":["Gen 35:16-19","Gen 37:11","Num 11:15","Num 11:29","1 Kon 19:4","Job 3:1-3","Job 3:11","Job 3:20-22","Job 5:2","Job 13:19","Jer 20:14-18","Joh 4:3","Joh 4:8","2 Kor 7:10"]}],"2":[{"kopje":"toorn","refs":["Gen 31:36","Ex 32:19","Matt 5:22","Mark 3:5","Ef 4:26"]},{"kopje":"Ben ik","refs":["Gen 16:2","Gen 25:21","Gen 50:19","1 Sam 1:5","1 Sam 2:5","1 Sam 2:6","2 Kon 5:7"]},{"kopje":"geweerd","refs":["Deut 7:13","Deut 7:14","Ps 113:9","Ps 127:3","Luk 1:42"]}],"3":[{"kopje":"Zie","refs":["Gen 30:9","Gen 16:2","Gen 16:3"]},{"kopje":"dat zij","refs":["Gen 50:23","Job 3:12"]},{"kopje":"uit haar gebouwd word","refs":["Gen 16:2","Ruth 4:11"]}],"4":[{"kopje":"tot =\"H5647\">served</span> thee, and let me <span class=\"wl wl-kjv\" data-code=\"H3212\">go:</span> for thou <span class=\"wl wl-kjv\" data-code=\"H3045\">knowest</span> my <span class=\"wl wl-kjv\" data-code=\"H5656\">service</span> which I have done","27":"And <span class=\"wl wl-kjv\" data-code=\"H3837\">Laban</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, I pray thee, if I have <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> <span class=\"wl wl-kjv\" data-code=\"H2580\">favour</span> in thine <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes,</span> tarry: for I have learned by <span class=\"wl wl-kjv\" data-code=\"H5172\">experience</span> that the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H1288\">blessed</span> me for thy sake.","28":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H5344\">Appoint</span> me thy <span class=\"wl wl-kjv\" data-code=\"H7939\">wages,</span> and I will give","29":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, Thou <span class=\"wl wl-kjv\" data-code=\"H3045\">knowest</span> <span class=\"wl wl-kjv\" data-code=\"H834\">how</span> I have <span class=\"wl wl-kjv\" data-code=\"H5647\">served</span> thee, and <span class=\"wl wl-kjv\" data-code=\"H834\">how</span> thy cattle","30":"For it was <span class=\"wl wl-kjv\" data-code=\"H4592\">little</span> which thou hadst before <span class=\"wl wl-kjv\" data-code=\"H6440\">I</span> came, and it is now <span class=\"wl wl-kjv\" data-code=\"H6555\">increased</span> unto a <span class=\"wl wl-kjv\" data-code=\"H7230\">multitude;</span> and the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H1288\">blessed</span> thee since my <span class=\"wl wl-kjv\" data-code=\"H7272\">coming:</span> and now <span class=\"wl wl-kjv\" data-code=\"H4970\">when</span> shall I <span class=\"wl wl-kjv\" data-code=\"H6213\">provide</span> for mine own house","31":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> What shall I give <span class=\"wl wl-kjv\" data-code=\"H5414\">thee?</span> And <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Thou shalt not <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> me any <span class=\"wl wl-kjv\" data-code=\"H3972\">thing:</span> if thou wilt <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> this <span class=\"wl wl-kjv\" data-code=\"H1697\">thing</span> for me, I will <span class=\"wl wl-kjv\" data-code=\"H7725\">again</span> <span class=\"wl wl-kjv\" data-code=\"H7462\">feed</span> and <span class=\"wl wl-kjv\" data-code=\"H8104\">keep</span> thy flock:","32":"I will <span class=\"wl wl-kjv\" data-code=\"H5674\">pass</span> through all thy <span class=\"wl wl-kjv\" data-code=\"H6629\">flock</span> to <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> <span class=\"wl wl-kjv\" data-code=\"H5493\">removing</span> from thence all the <span class=\"wl wl-kjv\" data-code=\"H5348\">speckled</span> and <span class=\"wl wl-kjv\" data-code=\"H2921\">spotted</span> <span class=\"wl wl-kjv\" data-code=\"H7716\">cattle,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H2345\">brown</span> <span class=\"wl wl-kjv\" data-code=\"H7716\">cattle</span> among the <span class=\"wl wl-kjv\" data-code=\"H3775\">sheep,</span> and the <span class=\"wl wl-kjv\" data-code=\"H2921\">spotted</span> and <span class=\"wl wl-kjv\" data-code=\"H5348\">speckled</span> among the <span class=\"wl wl-kjv\" data-code=\"H5795\">goats:</span> and of such shall be my hire.","33":"So shall my <span class=\"wl wl-kjv\" data-code=\"H6666\">righteousness</span> <span class=\"wl wl-kjv\" data-code=\"H6030\">answer</span> for me in <span class=\"wl wl-kjv\" data-code=\"H3117\">time</span> to <span class=\"wl wl-kjv\" data-code=\"H4279\" >days'</span> <span class=\"wl wl-kjv\" data-code=\"H1870\">journey</span> betwixt himself and <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob:</span> and <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> <span class=\"wl wl-kjv\" data-code=\"H7462\">fed</span> the <span class=\"wl wl-kjv\" data-code=\"H3498\">rest</span> of <span class=\"wl wl-kjv\" data-code=\"H3837\">Laban's</span> flocks.","37":"And <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> him <span class=\"wl wl-kjv\" data-code=\"H4731\">rods</span> of <span class=\"wl wl-kjv\" data-code=\"H3892\">green</span> <span class=\"wl wl-kjv\" data-code=\"H3839\">poplar,</span> and of the <span class=\"wl wl-kjv\" data-code=\"H3869\">hazel</span> and chesnut <span class=\"wl wl-kjv\" data-code=\"H6196\">tree;</span> and <span class=\"wl wl-kjv\" data-code=\"H6478\">pilled</span> <span class=\"wl wl-kjv\" data-code=\"H3836\">white</span> <span class=\"wl wl-kjv\" data-code=\"H6479\">strakes</span> in them, and made the <span class=\"wl wl-kjv\" data-code=\"H3836\">white</span> <span class=\"wl wl-kjv\" data-code=\"H4286\">appear</span> which was in the rods.","38":"And he <span class=\"wl wl-kjv\" data-code=\"H3322\">set</span> the <span class=\"wl wl-kjv\" data-code=\"H4731\">rods</span> which he had <span class=\"wl wl-kjv\" data-code=\"H6478\">pilled</span> <span class=\"wl wl-kjv\" data-code=\"H5227\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H6629\">flocks</span> in the <span class=\"wl wl-kjv\" data-code=\"H7298\">gutters</span> in the <span class=\"wl wl-kjv\" data-code=\"H4325\">watering</span> <span class=\"wl wl-kjv\" data-code=\"H8268\">troughs</span> when the <span class=\"wl wl-kjv\" data-code=\"H6629\">flocks</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to <span class=\"wl wl-kjv\" data-code=\"H8354\">drink,</span> that they should <span class=\"wl wl-kjv\" data-code=\"H3179\">conceive</span> when they <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to drink.","39":"And the <span class=\"wl wl-kjv\" data-code=\"H6629\">flocks</span> <span class=\"wl wl-kjv\" data-code=\"H3179\">conceived</span> before the <span class=\"wl wl-kjv\" data-code=\"H4731\">rods,</span> and brought <span class=\"wl wl-kjv\" data-code=\"H3205\">forth</span> <span class=\"wl wl-kjv\" data-code=\"H6629\">cattle</span> <span class=\"wl wl-kjv\" data-code=\"H6124\">ringstraked,</span> <span class=\"wl wl-kjv\" data-code=\"H5348\">speckled,</span> and spotted.","40":"And <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> did <span class=\"wl wl-kjv\" data-code=\"H6504\">separate</span> the <span class=\"wl wl-kjv\" data-code=\"H3775\">lambs,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">set</span> the <span class=\"wl wl-kjv\" data-code=\"H6440\">faces</span> of the <span class=\"wl wl-kjv\" data-code=\"H6629\">flocks</span> <span class=\"wl wl-kjv\" data-code=\"H413\">toward</span> the <span class=\"wl wl-kjv\" data-code=\"H6124\">ringstraked,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H2345\">brown</span> in the <span class=\"wl wl-kjv\" data-code=\"H6629\">flock</span> of <span class=\"wl wl-kjv\" data-code=\"H3837\">Laban;</span> and he <span class=\"wl wl-kjv\" data-code=\"H7896\">put</span> his own <span class=\"wl wl-kjv\" data-code=\"H5739\">flocks</span> by themselves, and <span class=\"wl wl-kjv\" data-code=\"H7896\">put</span> them not unto <span class=\"wl wl-kjv\" data-code=\"H3837\">Laban's</span> cattle.","41":"And it came to pass, whensoever the <span class=\"wl wl-kjv\" data-code=\"H7194\">stronger</span> <span class=\"wl wl-kjv\" data-code=\"H6629\">cattle</span> did <span class=\"wl wl-kjv\" data-code=\"H3179\">conceive,</span> that <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> <span class=\"wl wl-kjv\" data-code=\"H7760\">laid</span> the <span class=\"wl wl-kjv\" data-code=\"H4731\">rods</span> before the <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes</span> of the <span class=\"wl wl-kjv\" data-code=\"H6629\">cattle</span> in the <span class=\"wl wl-kjv\" data-code=\"H7298\">gutters,</span> that they might <span class=\"wl wl-kjv\" data-code=\"H3179\">conceive</span> among the rods.","42":"But when the <span class=\"wl wl-kjv\" data-code=\"H6629\">cattle</span> were <span class=\"wl wl-kjv\" data-code=\"H5848\">feeble,</span> he put them not <span class=\"wl wl-kjv\" data-code=\"H7760\">in:</span> so the <span class=\"wl wl-kjv\" data-code=\"H5848\">feebler</span> were <span class=\"wl wl-kjv\" data-code=\"H3837\">Laban's,</span> and the <span class=\"wl wl-kjv\" data-code=\"H7194\">stronger</span> Jacob's.","43":"And the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> <span class=\"wl wl-kjv\" data-code=\"H6555\">increased</span> <span class=\"wl wl-kjv\" data-code=\"H3966\">exceedingly,</span> and had <span class=\"wl wl-kjv\" data-code=\"H7227\">much</span> <span class=\"wl wl-kjv\" data-code=\"H6629\">cattle,</span> and <span class=\"wl wl-kjv\" data-code=\"H8198\">maidservants,</span> and <span class=\"wl wl-kjv\" data-code=\"H5650\">menservants,</span> and <span class=\"wl wl-kjv\" data-code=\"H1581\">camels,</span> and asses."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"benijdde","tekst":"Of, zij werd jaloers."},{"catchword":"zo ben","tekst":"Dat is, zo moet ik sterven van hartzeer. Woorden van menselijke zwakheid, gesproten uit ongeduld; zie deze manier van spreken boven, Gen 20:3."}],"2":[{"catchword":"Ben ik","tekst":"Dat is, ben ik dan almachtig, dat ik u vruchtbaar maken kan? Het is God alleen, die kinderen geven kan. Zie 1Sa 2:5; Psa 113:9, en Psa 127:3. Gelijke woorden spreekt Jozef, onder, Gen 50:19."},{"catchword":"vrucht des","tekst":"Dat is, kinderen; Deu 7:13, en Deu 28:4; Psa 132:11; Isa 13:18. Zo wordt ook Christus genoemd ten aanzien van zijn menselijke natuur, Luk 1:42."}],"3":[{"catchword":"En zij","tekst":"Zij volgt liever het exempel van Sara, boven, Gen 16:2, dan het loffelijk exempel van Izak en Rebekka, boven, Gen 25:21."},{"catchword":"op mijn","tekst":"Dat is, opdat ik de kinderen, die zij van u krijgt, in mijn schoot ontvange, en voor de mijne houde. Zie gelijke manier van spreken onder, Gen 50:23."},{"catchword":"gebouwd","tekst":"Zie deze manier van spreken boven, Gen 16:2."}],"4":[{"catchword":"tot een","tekst":"Zie boven, Gen 16:3."}],"6":[{"catchword":"God","tekst":"Dat is, Hij heeft mijn zaak tot mijn voordeel uitgewezen. Zie boven, Gen 15:14."},{"catchword":"Dan","tekst":"Dat is, die een zaak uitvoert, terechtwijst of gericht oefent."}],"8":[{"catchword":"worstelingen","tekst":"Dat is, zeer grote, zware, uitnemende. Zie boven Gen 13:10. De zin is: Ik en mijn zuster hebben [om zo te zeggen] tegen elkander gekampt en gestreden, om kinderen te krijgen. En het is mij gegaan naar mijn wens, boven het vermoeden van mijn zuster; of worstelingen Gods, dat is, met gebeden tot God, waarmede ik tegen mijn zuster geworsteld, en door zijn genade overwonnen heb."},{"catchword":"Nafthali","tekst":"Dat is, mijn worsteling."}],"9":[{"catchword":"nam zij","tekst":"Uit een menselijke ontevredenheid zich niet vergenoegende met den voorgaanden zegen."}],"11":[{"catchword":"er komt","tekst":"Of, daar is een hoop gekomen; dat is, deze zoon, gevoegd bij den voorgaanden, zal een hoop of bende volks uitmaken. In het Hebr. is het een woord, hetwelk uit twee woorden samengevoegd is, alsof men zeide: Hoop komt."},{"catchword":"Gad","tekst":"Dat is, hoop, schaar, bende."}],"13":[{"catchword":"Tot mijn","tekst":"Of, met mijn geluk; versta, wordt mij nog deze zoon geboren."},{"catchword":"dochters","tekst":"Versta, de vrouwen in het algemeen."},{"catchword":"Aser","tekst":"Dat is, gelukkig, of die gelukkig maakt, of geluk aanbrengt."}],"14":[{"catchword":"dudaïm","tekst":"Dit woord betekent enige lieflijke vruchten of bloemen, zeer aangenaam van reuk, kleur en smaak; welke bij ons doorgaans genoemd worden minnebloemen, of liefdeappelen. Het woord wordt nergens gevonden dan hier, en Son 7:13."}],"16":[{"catchword":"om loon","tekst":"Hebr. Ik heb u om loon hurende, om loon gehuurd, dat is vastelijk, zekerlijk, uitdrukkelijk. Anders, om bedongen, of bestemd loon heb ik u gehuurd."}],"17":[{"catchword":"verhoorde","tekst":"Uit genade, niettegenstaande haar menselijke zwakheid en verkeerdheid."}],"18":[{"catchword":"heeft mijn","tekst":"Dat is, ik houd mij genoeg beloond voor mijns zoons dudaïm, dewijl mij God, nadat ik uit mijn dienstmaagd kinderen gekregen heb, nog daarenboven, buiten mijn verwachting, uit mijn eigen lichaam dezen zoon gegeven heeft. Voor de woorden nadat, hebben anderen omdat."},{"catchword":"Issaschar","tekst":"Hebr. Issaschar, dat is, daar is een loon."}],"20":[{"catchword":"begiftigd","tekst":"Het Hebreeuwse woord met het volgende gift, wordt in de Heilige Schrift nergens dan hier gevonden. Het gevoelen van de meesten is, dat dit een bijzondere en voortreffelijke gift betekent."},{"catchword":"Zebulon","tekst":"Hebr. Zebulun, dat is, woning of bijwoning."}],"21":[{"catchword":"Dina","tekst":"Dat is, rechtshandel of gericht."}],"22":[{"catchword":"God dacht","tekst":"Zie boven, Gen 8:1."},{"catchword":"opende","tekst":"Zie boven, Gen 20:18."}],"23":[{"catchword":"smaadheid","tekst":"Die in dien tijd bestond in de onvruchtbaarheid; 1Sa 1:6; Isa 4:1; Luk 1:25, en dat meest om twee redenen.&lt;i&gt;I.&lt;/i&gt; Omdat de onvruchtbaren van de belofte aan Abraham gedaan, aangaande de vermenigvuldiging van zijn zaad, schenen uitgesloten te zijn.&lt;i&gt;II.&lt;/i&gt; Omdat zij waren buiten de hoop, die zij anders hebben konden, dat de Messias, [die uit het zaad van Abraham voortkomen moest] van hun nakomelingen een zou worden."},{"catchword":"weggenomen","tekst":"Hebr. vergaderd, ingetrokken, teruggenomen."}],"24":[{"catchword":"Jozef,","tekst":"Deze naam schijnt te doelen op twee woorden, te weten, het voorgaande wegnemen, en wat hier staat, toevoegen."}],"25":[{"catchword":"Jakob","tekst":"Te weten, als de andere zeven jaren van zijn dienst om waren, en hij zijn schoonvader niets meer schuldig was."}],"26":[{"catchword":"om welken","tekst":"Versta dit eigenlijk ten aanzien van de vrouwen."},{"catchword":"dien ik","tekst":"Te weten, den tijd van veertien jaren, met groten arbeid en trouw."}],"27":[{"catchword":"genade","tekst":"Zie over deze manier van spreken boven, Gen 18:3. Het is een afgebroken reden in zulke toespraken gebruikelijk, die men aanvullen kan met deze woorden: Zo blijf toch bij mij, en zeg maar het loon, dat gij van mij begeert."}],"28":[{"catchword":"mij","tekst":"Hebr. over, of op mij. Hij wil zeggen, leg mij op zulk een loon als gij wilt. Het Hebreeuwse woord betekent: doorsteken, doorboren, hechten, vastzetten, en dienvolgens uitdrukkelijk noemen."},{"catchword":"dien ik","tekst":"Of, en ik zal [hem] geven."}],"29":[{"catchword":"hoe ik","tekst":"Of, welken dienst ik u gedaan heb: en wat uw verovering, of verkrijging door mij geweest is. Dat is, hoe wèl gij u bij mijn dienst bevonden hebt."}],"30":[{"catchword":"vóór mij","tekst":"Dat is, vóór mijn komst. Alzo onder, Gen 32:3."},{"catchword":"uitgebroken;","tekst":"Zie van de eigenschap van dit woord boven, Gen 28:14."},{"catchword":"bij mijn","tekst":"Dat is, nadat ik uw zaken beleid en belopen heb; of sinds ik mijn voet in uw huis gezet heb."},{"catchword":"werken","tekst":"Of, wat doen voor mijn huisgezin."}],"31":[{"catchword":"met al","tekst":"Te weten, geen door u gezet loon, maar wat Gods voorzienigheid mij gunnen en toeschikken zal."},{"catchword":"ik zal","tekst":"Ik zal wederkeren, ik zal weiden, enz."}],"32":[{"catchword":"gespikkelde","tekst":"Dat is, getekend met kleine stipJes."},{"catchword":"geplekte","tekst":"Dat is, met grotere plekken of vlekken."},{"catchword":"vee, en","tekst":"Versta, klein vee, als schapen, lammeren, geieten."},{"catchword":"bruine","tekst":"Of, brandkleurig. Het Hebreeuwse woord komt van brand, hitte, warmte."},{"catchword":"en zulks","tekst":"Dat is, welke uit de eenkleurige beesten, namelijk de geheel witte, die ik weiden zal, gesprenkeld, of geplekt, of bruin zullen geworpen worden, zullen mijn loon zijn."}],"33":[{"catchword":"Zo zal","tekst":"Dat is, wanneer gij heden of morgen eens zult komen bezichtigen, wat mij ter beloning toegevallen is, zo zal duidelijk en onwedersprekelijk blijken wat mijn rechtvaardig loon is, of het tegendeel."},{"catchword":"morgen","tekst":"Dat is, in den toekomenden tijd. Alzo is dit woord morgen dikwijls in de Heilige Schrift genomen; gelijk Exo 13:14; Deu 6:20; Jos 4:6; Mat 6:34."},{"catchword":"als gij","tekst":"Anders, als zij komen zal om mijn loon."}],"35":[{"catchword":"hij zonderde","tekst":"Te weten, Laban"},{"catchword":"de gesprenkelde","tekst":"Te weten, aan de poten met een ronde streep in de gelijkenis van een band, naar de eigenschap van het woord."}],"36":[{"catchword":"een weg","tekst":"Of, drie dagreizen; dat is, de ruimte van drie dagreizen; versta, tussen de kudden van Labans zonen en de anderen, die Jakob weidde; opdat de witte toch niet met de gevlekte of bruine enigszins zouden vermengd worden."}],"37":[{"catchword":"Toen nam","tekst":"Dit heeft Jakob gedaan door ingeving en regering van God; zie onder, Gen 31:9. Aldus heeft God voor Jakob gezorgd, opdat Laban hem niet ledig naar huis zou laten gaan; zie onder, Gen 31:42."},{"catchword":"roeden","tekst":"Of, stokken, of roeden."},{"catchword":"groen","tekst":"Of, vers."}],"38":[{"catchword":"zij werden","tekst":"Dat is, verhit zijnde ontvingen zij."}],"39":[{"catchword":"gesprenkelde,","tekst":"Te weten, aan de poten, gelijk boven vs.35."}],"40":[{"catchword":"de lammeren","tekst":"Te weten, die veelkleurig of bruin waren. Dezen liet hij voorgaan; de anderen liet hij volgen, opdat dezen die zouden zien wanneer zij zich paarden."},{"catchword":"hij zette","tekst":"Te weten, opdat zij door het aanschouwen daarvan niet haars gelijken, dat is eenkleurigen, zouden voortbrengen."}],"41":[{"catchword":"der vroegelingen","tekst":"Dat is, die in het voorjaar geworpen werden, zijnde, naar de eigenschap van het Hebr. woord, vast, sterk, gebonden van lichaam."}],"42":[{"catchword":"spade hittig","tekst":"Dat is, in het najaar; die zwak en onsterk van lichaam waren."}],"43":[{"catchword":"brak","tekst":"Zie boven, Gen 28:14."},{"catchword":"gans zeer","tekst":"Hebr. zeer zeer."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Now when Rachel saw that she did not bear to Jacob then Rachel envied her sister[or grew jealousy] and she said to Jacob give me children or if not I am dead [that is then I must die for grief heart words of human frailty proceeding from impatience see the like phrase above chapter 20.3.]"}],"2":[{"catchword":null,"tekst":"Then Jacobs anger was kindled against Rachel then he said am I then in the place of the Lord [that is am I almighty then to make thee fruitful God alone is he that can bestow children see 1Sa 2:5 Psa 113:9 and 127.3 the like words Joseph useth below chapter 50.19] who hath withheld the bellies fruit [that is children Deu 7:13 and 28.4 Psa 132:11 Isa 13:18 thus Christ himself also is called in regard of his human nature Luk 1:42] from thee?"}],"3":[{"catchword":null,"tekst":"And she said behold there is my hand-maid Bilha go in to her [she rather follows the example of Sarah above chapter 16.2 then the commendable example of Isaac and Rebecca above chapter 25 verse 21] that she may bear up on my knees [that is that I may receive the children into my bosom and hold and tender them as my own see the like phrase below chapter 50.23] and also I may be built out of her [see of this kind of speaking above chapter 16.2.]"}],"4":[{"catchword":null,"tekst":"So she gave her hand-maid Bilha as wife [see above chapter 16.3] and Jacob went into her."}],"5":[{"catchword":null,"tekst":"And Bilha conceived and bear a son to Jacob."}],"6":[{"catchword":null,"tekst":"Then said Rachel God hath judged me [that is he hath determined the cause to my advantage see above chapter 15 verse 14] and all likewise heard my voice and hath given me a son therefore she called his name Dan[that is one that pleads a cause or shews the right or pronounceth sentence in judgment.]"}],"7":[{"catchword":null,"tekst":"And Bilha Rachels hand-maid conceived again and beara second son to Jacob."}],"8":[{"catchword":null,"tekst":"Then said Rachel I have wrestled the wrestling of God with my sister[that is a very great and extraordinary hard and difficult ones see above chapter 13 on verse 10 the sense is I and my sister have in a manner striven and sought for getting of children and I got my wish at length beyond my sisters expectation or wrestling of God that is prayers to God wherewith I have wrestled against my sister and through his grace and savor have overcome now ] also I have prevailed and she called his name Naphtali[that is my wrestling.]"}],"9":[{"catchword":null,"tekst":"Now when Leah saw that she ceased to bear her likewise took her hand-maid Zelda and gave the same to Jacob a wife. [Out of human emulation and not and not contenting herself with former benediction.]"}],"10":[{"catchword":null,"tekst":"And Zilpa Leah&acirc;&euro;&trade;s hand-maid did bear a son to Jacob."}],"11":[{"catchword":null,"tekst":"And there said Leah there comes a company [or there is a company coming that this joined to the former will and a company or a troop of men in the Hebrew there is a word compounded of two as if one should say company come or troop come] and she called his name Gad [that is company troop band of men.]"}],"12":[{"catchword":null,"tekst":"After that Zilpa Leah&acirc;&euro;&trade;s hand-maid bear the second son of Jacob."}],"14":[{"catchword":null,"tekst":"And Reuben went in the days of wheat harvest and he found Dudaim [this word signifies a certain pleasant fruit or flower very acceptable and grateful for smell color and taste such as with us are called the love flower or loveably the Hebrew word here used is no where to be found but here in this place and Cant7.13] and he brought them to his mother Leah then said Rachel to Leah give me I pray for thy sons Dudaim."}],"15":[{"catchword":null,"tekst":"And said to heirs it little or small thing that thou hast taken away my husband that thou wilt likewise take my sons Dudaim? Then Rachel said therefore shall he lie with thee this night for thy son Dudaim."}],"16":[{"catchword":null,"tekst":"Now when Jacob came out of the fields in the evening Leah went to meet him and said thou shalt come to me for I have surely hired thee [Heb. Hiring I have hired thee [Heb. Hiring I have hired thee that is firmly certainly expressly others for bargained or conditioned have I hired thee] for my son Dudaim and he lay that night with her."}],"17":[{"catchword":null,"tekst":"And God heard exaudiebate Leah [of his grace not withstanding her human frailty and weakness] and she conceived and bears the fifth son of Jacob."}],"18":[{"catchword":null,"tekst":"Then said Leah god hath given my wages after that I have given my hand-maid o m husband [that is I count my self well rewarded for my son Dudaim since my after that I got children my hand-maid hath yet given me this son of my own body beyond my own expectation for the words after that some read for that ] and she called his name Issachar [Heb. Ischaschar that is there is wages or hire.]"}],"19":[{"catchword":null,"tekst":"And Leah conceived again and she bear the sixth son to acob."}],"20":[{"catchword":null,"tekst":"And Leah saith God hath me he had begifted or presented with a good gift [the Heb. Verb with the noun following gift ] this time my husband shall co-habit with me for I have born him six sons and she called his name Zebulon [Heb. Zebulun that is habitation or co-habitation.]"}],"21":[{"catchword":null,"tekst":"And after that she bear a daughter and she called her name Dinah [that is a law case or judgment.]"}],"22":[{"catchword":null,"tekst":"God remembered Rachel likewise [see above chapter 8 on verse 1] and God heard her and opened her womb [see above chapter 20 on verses 18.]"}],"23":[{"catchword":null,"tekst":"And she conceived and bears a son and she said God hath taken away [Heb. He contracted gathered together drawn in withdrawn] my reproach [which in that time lay open barrenness see 1Sa 1:6 Isa 4:1 Luke 1 verse 21 and that principally for two reasons 1. Because that those that were barren did seem to be excluded from the promise made unto Abraham touching the multiplication of his seed 2. Because they were without hoping that the Messiah who was to proceed out of the seed of Abraham should be one of their posterity.]"}],"24":[{"catchword":null,"tekst":"And she called his name Joseph [this name seems to respect upon two Hebrew words one used in the former signifying to draw back or to take away and the other here expressed here signifying to add or adjoin ] saying the Lord add me another son thereto."}],"25":[{"catchword":null,"tekst":"And it came to pass when Rachel had born Joseph that Jacob said to Laban [viz. when the other seven years of his years were now past and he had quit scores with his father in law ] let me depart that I may go to my place and to my country."}],"26":[{"catchword":null,"tekst":"Give my wives and children for the which I have served thee [understand this properly of the wives ] that I may be gone for thou knowest my service which I have served thee [the time of fourteen years with much pains and faithfulness.]"}],"27":[{"catchword":null,"tekst":"Then said Laban to him if I have found grace in thine eyes [see concerning of such phrase above chapter 18 on verse 3 it is the abrupt speech usual on such occasion and may be supplied and made up with then I pray tarry with me but the wages thou desireth at my hands] I have observed that the LORD hath blessed me for thy sake."}],"28":[{"catchword":null,"tekst":"He said then names me expressly [Heb. Over or upon as who should say lay upon me what wages thou pleases the Hebrew word here doth signify to pierce or bear through to fix or set down and consequently to name expressly down right ] the wages that I shall give thee [or I shall give thee the same.]"}],"29":[{"catchword":null,"tekst":"Then said he to him thou knowest how I have served thee and thy cattle hath been with me [or what service I have done thee and what thy getting or acquiring hath been by me that is how well thou didst thrive and prosper by my service.]"}],"30":[{"catchword":null,"tekst":"For the little that thou hadst before me [that is before my coming to thee and so below chapter 32.3] is broken out [see of the propriety of this word above chapter 28 on verse 14] to a multitude and the LORD hath blessed the by my foot [that is by my painful and careful going about thy affairs or ever since I put my foot within thy doors [now then when I shall likewise for my house? [Or do something of my own family?]"}],"31":[{"catchword":null,"tekst":"And he said what shall I give thee? then Jacob said thou salt give me nothing at all [viz. no wages set or determined by thyself but such only as Gods providence vouchsafe dispose for me ] if thou wilt do me this thing I will keep and feed thy flock again [Heb. I shall return I shall feed &c.]"}],"32":[{"catchword":null,"tekst":"I will go this day through thy whole flock severing there from all the speckled [that is those marked with small sprinkling as it were ] and spotted [that is marked with broad or large spot or stains ] cattle [understand here only the smaller sort such as sheep lambs goats] & all the brown cattle [or burnt colored the Hebrew word comes from burning heat warmth ] among the lambs and spotted among goats and such or the speckled and such or his shall be my wages[that is those shall be wages which being cast or brought forth by the single colored or all white ones under my keeping shall prove speckled or spotted or brown.]"}],"33":[{"catchword":null,"tekst":"so my righteousness shall on the day of morrow [that is in the time to come thus the word morrow is often taken in scripture as Exo 13:14 Deu 6:20 Jos 4:6 Mat 6:34] testify with me [the meaning thereof is when to day or tomorrow that is any time hereafter thou shalt come to view what fell to my wages then it plainly and evidently appear what is my clear and upright due or the contrary ] when thou shalt come over my wages [others when she shall come viz. righteousness for my wages] before thy face and all that is not spckled among the goats and sparkled and spotted among the goats and brown among the lamb that the stolen with me."}],"34":[{"catchword":null,"tekst":"Then said Laban Lo yea be it according to thy word."}],"35":[{"catchword":null,"tekst":"And he [viz. Laban] severed that same day the ring straked [about the legs in fashion of a band as the propriety of the word here implies] and spotted he-goats and all the speckled and spotted goats all where some white was on an doll the brown among the lambs and he gave them into the hand of the sons."}],"36":[{"catchword":null,"tekst":"And he put away of three days [or three days journey] between them and between Jacob [that is he put distance between them of three days journey understand between the flock of Labans sons and the rest which Jacob kept lest in any wise the white ones might come to the intermixed with the spotted or brown.] and Jacob kept pascebat the rest of Labans flock."}],"37":[{"catchword":null,"tekst":"Then Jacob took him rods [or stick wands] of green [or fresh] polar-wood and of hazel and of chestnuts and he peeled thereon white strakes making bear the white which was on the rods [this Jacob did by the instinct and direction of God. See below chapter 31 verse 9 thus God took care for Jacob that Laban should not let him return home empty see below chapter 31 verse 42.]"}],"38":[{"catchword":null,"tekst":"And he laid these rods which he had peeled in the gutters an din the water-though where the flock came to drink over against the flock and they were heated [that is being heated they conceived] when they came to drink."}],"39":[{"catchword":null,"tekst":"When the flock then was heated by or with or at the rods the flock lambed or brought forth straked [viz. on the legs as above verse 35] speckled and brown ones."}],"40":[{"catchword":null,"tekst":"Then Jacob severed the lambs [or various colors] and he turned the face of the flock upon the speckled all the brown among Labans flock [these he caused to go before and the other to follow that they might have them in their sight when they went a rutting] and he put his flocks apart and he set them they should bring forth their like that is single colored ones.]"}],"41":[{"catchword":null,"tekst":"and it happened all the time when the flock of the prime lings [that is these are cast into the spring time of the year being according as the Hebrew word implies well girt as it were that is firm and compact of body and strength] was heated then Jacob put the rods in the gutters before the eyes of the flock that they might be heated by the rods."}],"42":[{"catchword":null,"tekst":"But when the flock was heated late [that is in the fall of the year when they proved weak and feeble of the body] then he put them not so that the late lings became Labans and the primelings Jacobs."}],"43":[{"catchword":null,"tekst":"And that man brake forth [see above chapter 18 verse 14] very much in abundance [Heb. Much] and he had many flocks and maid-servants and men-servants and camels and asses."}]}}};

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
