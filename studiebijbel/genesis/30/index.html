": "mattheus", "Mark": "markus", "Luk": "lukas", "Joh": "johannes", "Hand": "handelingen", "Rom": "romeinen", "1 Kor": "1-korinthe", "2 Kor": "2-korinthe", "Gal": "galaten", "Ef": "efeze", "Fil": "filippenzen", "Kol": "kolossenzen", "1 Tess": "1-thessalonicenzen", "2 Tess": "2-thessalonicenzen", "1 Tim": "1-timotheus", "2 Tim": "2-timotheus", "Tit": "titus", "Filem": "filemon", "Hebr": "hebreeen", "Jak": "jakobus", "1 Petr": "1-petrus", "2 Petr": "2-petrus", "1 Joh": "1-johannes", "2 Joh": "2-johannes", "3 Joh": "3-johannes", "Judas": "judas", "Openb": "openbaring"}}, "vertalingen": {"SVnu": {"1": "Toen Rachel zag dat zij Jakob geen kinderen gaf, benijdde Rachel haar zuster; en zij zei tegen Jakob: Geef mij kinderen! Anders ben ik dood.", "2": "Toen ontstak Jakobs toorn tegen Rachel, en hij zei: Ben ik dan in de plaats van God, Die de vrucht van uw buik van u geweerd heeft?", "3": "En zij zei: Zie, daar is mijn dienstmaagd Bilha, ga bij haar; dat zij op mijn knieën baart, en ik ook uit haar gebouwd word.", "4": "Zo gaf zij hem haar dienstmaagd Bilha tot vrouw; en Jakob ging bij haar.", "5": "En Bilha werd zwanger, en baarde Jakob een zoon.", "6": "Toen zei Rachel: God heeft mij recht gedaan, en heeft ook mijn stem verhoord, en heeft mij een zoon gegeven; daarom noemde zij zijn naam Dan.", "7": "En Bilha, Rachels dienstmaagd, werd opnieuw zwanger, en baarde Jakob een tweede zoon.", "8": "Toen zei Rachel: Ik heb worstelingen van God met mijn zuster geworsteld; ook heb ik de overhand gehad; en zij noemde zijn naam Nafthali.", "9": "Toen Lea nu zag dat zij ophield met baren, nam zij ook haar dienstmaagd Zilpa, en gaf haar aan Jakob tot vrouw.", "10": "En Zilpa, Lea's dienstmaagd, baarde Jakob een zoon.", "11": "Toen zei Lea: Er komt een hoop! En zij noemde zijn naam Gad.", "12": "Daarna baarde Zilpa, Lea's dienstmaagd, Jakob een tweede zoon.", "13": "Toen zei Lea: Tot mijn geluk! Want de dochters zullen mij gelukkig noemen; en zij noemde zijn naam Aser.", "14": "En Ruben ging in de dagen van de tarweoogst, en hij vond dudaïm in het veld, en hij bracht die naar zijn moeder Lea. Toen zei Rachel tegen Lea: Geef mij toch van de dudaïm van uw zoon.", "15": "En zij zei tegen haar: Is het weinig dat u mijn man genomen hebt, dat u ook de dudaïm van mijn zoon nemen wilt? Toen zei Rachel: Daarom zal hij deze nacht bij u liggen, voor de dudaïm van uw zoon.", "16": "Toen Jakob 's avonds uit het veld kwam, ging Lea naar buiten, hem tegemoet, en zei: U moet bij mij komen; want ik heb u zeker gehuurd voor de dudaïm van mijn zoon; en hij lag die nacht bij haar.", "17": "En God verhoorde Lea; en zij werd zwanger, en baarde Jakob de vijfde zoon.", "18": "Toen zei Lea: God heeft mij mijn loon gegeven, omdat ik mijn dienstmaagd aan mijn man gegeven heb; en zij noemde zijn naam Issaschar.", "19": "En Lea werd opnieuw zwanger, en zij baarde Jakob de zesde zoon.", "20": "En Lea zei: God heeft mij, *mij heeft Hij* begiftigd met een goede gift; deze keer zal mijn man mij bijwonen; want ik heb hem zes zonen gebaard; en zij noemde zijn naam Zebulon.", "21": "En zij baarde daarna een dochter; en zij noemde haar naam Dina.", "22": "God dacht ook aan Rachel; en God verhoorde haar, en opende haar baarmoeder.", "23": "En zij werd zwanger, en baarde een zoon; en zij zei: God heeft mijn smaad weggenomen!", "24": "En zij noemde zijn naam Jozef, en zei: De HEERE voegt mij nog een andere zoon toe.", "25": "En het gebeurde, toen Rachel Jozef gebaard had, dat Jakob tegen Laban zei: Laat mij vertrekken, dat ik ga naar mijn plaats, en naar mijn land.", "26": "Geef mij mijn vrouwen en mijn kinderen, voor wie ik u gediend heb, dat ik vertrek; want u weet mijn dienst, die ik u gediend heb.", "27": "Toen zei Laban tegen hem: Als ik toch genade gevonden heb in uw ogen; ik heb ondervonden dat de HEERE mij om u gezegend heeft.", "28": "Hij zei dan: Noem mij uitdrukkelijk uw loon, dat ik geven zal.", "29": "Toen zei hij tegen hem: U weet hoe ik u gediend heb, en hoe uw vee bij mij geweest is.", "30": "Want het weinige dat u voor mij had, is uitgebroken tot een menigte; en de HEERE heeft u gezegend bij mijn komst; nu dan, wanneer zal ik ook voor mijn eigen huis werken?", "31": "En hij zei: Wat zal ik u geven? Toen zei Jakob: U hoeft mij helemaal niets te geven, als u mij dit wilt doen; ik zal opnieuw uw kudde weiden en bewaren.", "32": "Ik zal heden door heel uw kudde gaan, en daaruit afzonderen al het gespikkelde en geplekte vee, en al het bruine vee onder de lammeren, en het geplekte en gespikkelde onder de geiten; en dat zal mijn loon zijn.", "33": "Zo zal mijn rechtvaardigheid morgen voor mij getuigen, als u komt over mijn loon, voor uw gezicht; alles wat niet gespikkeld en geplekt is onder de geiten en bruin onder de lammeren, dat zal bij mij als gestolen gelden.", "34": "Toen zei Laban: Zie, och ja, laat het naar uw woord zijn!", "35": "En hij zonderde dezelfde dag af de gesprenkelde en geplekte bokken en al de gespikkelde en geplekte geiten, alles waar wit aan was, en al het bruine onder de lammeren; en hij gaf ze in de hand van zijn zonen.", "36": "En hij stelde een afstand van drie dagen tussen zichzelf en Jakob; en Jakob weidde de overige kudde van Laban.", "37": "Toen nam Jakob voor zichzelf takken van groen populierenhout, en van hazelaar, en van kastanje; en hij schilde daarin witte strepen, zodat het wit dat aan die takken was, bloot kwam te liggen.", "38": "En hij legde deze takken, die hij geschild had, in de goten, in de drinkbakken van het water, waar de kudde kwam drinken, tegenover de kudde; en zij werden verhit, als zij kwamen om te drinken.", "39": "Als dan de kudde verhit werd bij de takken, dan lammerde de kudde gesprenkelde, gespikkelde en geplekte lammeren.", "40": "Toen scheidde Jakob de lammeren, en hij wendde het gezicht van de kudde naar het gesprenkelde, en al het bruine onder Labans kudde; en hij zette zijn eigen kudden apart, en hij zette ze niet bij de kudde van Laban.", "41": "En het gebeurde, telkens als de sterkere dieren van de kudde verhit werden, dat Jakob de takken voor de ogen van de kudde in de goten legde, zodat zij verhit werden bij de takken.", "42": "Maar als de kudde zwak was, legde hij ze niet erbij, zodat de zwakke dieren aan Laban toekwamen, en de sterke aan Jakob.", "43": "En die man breidde zich zeer sterk uit, en hij had veel kudden, en dienstmaagden, en dienstknechten, en kamelen, en ezels."}, "SV": {"1": "Als nu Rachel zag, dat zij Jakob niet baarde, zo benijdde Rachel haar zuster; en zij zeide tot Jakob: Geef mij kinderen! of indien niet, zo ben ik dood.", "2": "Toen ontstak Jakobs toorn tegen Rachel, en hij zeide: Ben ik dan in plaats van God, Die de vrucht des buiks van u geweerd heeft?", "3": "En zij zeide: Zie, daar is mijn dienstmaagd Bilha, ga tot haar in; dat zij op mijn knieën bare, en ik ook uit haar gebouwd worde.", "4": "Zo gaf zij hem haar dienstmaagd Bilha tot een vrouw; en Jakob ging tot haar in.", "5": "En Bilha werd zwanger, en baarde Jakob een zoon.", "6": "Toen zeide Rachel: God heeft mij gericht, en ook mijn stem verhoord, en heeft mij een zoon gegeven; daarom noemde zij zijn naam Dan.", "7": "En Bilha, Rachels dienstmaagd, werd wederom bevrucht, en baarde Jakob den tweeden zoon.", "8": "Toen zeide Rachel: Ik heb worstelingen Gods met mijn zuster geworsteld; ook heb ik de overhand gehad; en zij noemde zijn naam Nafthali.", "9": "Toen nu Lea zag, dat zij ophield van baren, nam zij ook haar dienstmaagd Zilpa, en gaf die aan Jakob tot een vrouw.", "10": "En Zilpa, Lea’s dienstmaagd, baarde Jakob een zoon.", "11": "Toen zeide Lea: Er komt een hoop! en zij noemde zijn naam Gad.", "12": "Daarna baarde Zilpa, Lea’s dienstmaagd, Jakob een tweeden zoon.", "13": "Toen zeide Lea: Tot mijn geluk! want de dochters zullen mij gelukkig achten; en zij noemde zijn naam Aser.", "14": "En Ruben ging in de dagen van de tarweoogst, en hij vond Dudaim in het veld, en hij bracht die tot zijn moeder Lea. Toen zeide Rachel tot Lea: Geef mij toch van uws zoons Dudaim.", "15": "En zij zeide tot haar: Is het weinig, dat gij mijn man genomen hebt, dat gij ook mijns zoons Dudaim nemen zult? Toen zeide Rachel: Daarom zal hij dezen nacht voor uws zoons Dudaim bij u liggen.", "16": "Als nu Jakob des avonds uit het veld kwam, ging Lea uit hem tegemoet, en zeide: Gij zult tot mij inkomen; want ik heb u om loon zekerlijk gehuurd voor mijns zoons Dudaim; en hij lag dien nacht bij haar.", "17": "En God verhoorde Lea; en zij werd bevrucht, en baarde Jakob den vijfden zoon.", "18": "Toen zeide Lea: God heeft mijn loon gegeven, nadat ik mijn dienstmaagd aan mijn man gegeven heb; en zij noemde zijn naam Issaschar.", "19": "En Lea werd wederom bevrucht, en zij baarde Jakob den zesden zoon.", "20": "En Lea zeide: God heeft mij, mij *heeft* *Hij* begiftigd met een goede gift; ditmaal zal mijn man mij bijwonen; want ik heb hem zes zonen gebaard; en zij noemde zijn naam Zebulon.", "21": "En zij baarde daarna een dochter; en zij noemde haar naam Dina.", "22": "God dacht ook aan Rachel; en God verhoorde haar, en opende haar baarmoeder.", "23": "En zij werd bevrucht, en baarde een zoon; en zij zeide: God heeft mijn smaadheid weggenomen!", "24": "En zij noemde zijn naam Jozef, zeggende: De HEERE voege mij een anderen zoon daartoe.", "25": "En het geschiedde, dat Rachel Jozef gebaard had, dat Jakob tot Laban zeide: Laat mij vertrekken, dat ik ga tot mijn plaats, en naar mijn land.", "26": "Geef mijn vrouwen, en mijn kinderen, om welke ik u gediend heb, dat ik vertrek; want gij weet mijn dienst, dien ik u gediend heb.", "27": "Toen zeide Laban tot hem: Zo ik nu genade gevonden heb in uw ogen; ik heb waargenomen, dat de HEERE mij om uwentwil gezegend heeft.", "28": "Hij zeide dan: Noem mij uitdrukkelijk uw loon, dat ik geven zal.", "29": "Toen zeide hij tot hem: Gij weet, hoe ik u gediend heb, en hoe uw vee bij mij geweest is.", "30": "Want het weinige, dat gij voor mij gehad hebt, dat is tot een menigte uitgebroken; en de HEERE heeft u gezegend bij mijn voet; nu dan, wanneer zal ik ook werken voor mijn huis?", "31": "En hij zeide: Wat zal ik u geven? Toen zeide Jakob: Gij zult mij niet met al geven, indien gij mij deze zaak doen zult; ik zal wederom uw kudden weiden, *en* bewaren.", "32": "Ik zal heden door uw ganse kudde gaan, daarvan afzonderende al het gespikkelde en geplekte vee, en al het bruine vee onder de lammeren, en het geplekte en gespikkelde onder de geiten; en zulks zal mijn loon zijn.", "33": "Zo zal mijn gerechtigheid op den dag van morgen met mij betuigen, als gij komen zult over mijn loon, voor uw aangezicht; al wat niet gespikkeld en geplekt is onder de geiten en bruin onder de lammeren, dat zij bij mij gestolen.", "34": "Toen zeide Laban: Zie, och ja, het zij naar uw woord!", "35": "En hij zonderde af ten zelfden dage de gesprenkelde en geplekte bokken en al de gespikkelde en geplekte geiten, al waar wit aan was, en al het bruine onder de lammeren; en hij gaf dezelve in de hand zijner zonen.", "36": "En hij stelde een weg van drie dagen tussen hem, en tussen Jakob; en Jakob weidde de overige kudde van Laban.", "37": "Toen nam zich Jakob roeden van groen populierenhout, en van hazelaar, en van kastanje; en hij schilde daarin witte strepen, ontblotende het wit, hetwelk aan die roeden was.", "38": "En hij leide deze roeden, die hij geschild had, in de goten, *en* in de drinkbakken van het water, waar de kudde kwam drinken, tegenover de kudde; en zij werden verhit, als zij kwamen om te drinken.", "39": "Als dan de kudde verhit werd bij de roeden, zo lammerde de kudde gesprenkelde, gespikkelde, en geplekte.", "40": "Toen scheidde Jakob de lammeren, en hij wendde het gezicht der kudde op het gesprenkelde, en al het bruine onder Labans kudde; en hij stelde zijn kudden alleen, en hij zette ze niet bij de kudde van Laban.", "41": "En het geschiedde, telkens als de kudde der vroegelingen verhit werd, zo stelde Jakob de roeden voor de ogen der kudde in de goten, opdat zij hittig werden bij de roeden.", "42": "Maar als de kudde spade hittig werd, zo stelde hij ze niet, zodat de spadelingen Laban, en de vroegelingen Jakob toekwamen.", "43": "En die man brak gans zeer uit *in* *menigte*, en hij had vele kudden, en dienstmaagden, en dienstknechten, en kemelen, en ezelen."}, "KJV": {"1": "And when Rachel saw that she bare Jacob no children, Rachel envied her sister; and said unto Jacob, Give me children, or else I die.", "2": "And Jacob's anger was kindled against Rachel: and he said, *Am* I in God's stead, who hath withheld from thee the fruit of the womb?", "3": "And she said, Behold my maid Bilhah, go in unto her; and she shall bear upon my knees, that I may also have children", "4": "And she gave him Bilhah her handmaid to wife: and Jacob went in", "5": "And Bilhah conceived, and bare Jacob a son.", "6": "And Rachel said, God hath judged me, and hath also heard my voice, and hath given me a son: therefore called she his name Dan.", "7": "And Bilhah Rachel's maid conceived again, and bare Jacob a second son.", "8": "And Rachel said, With great wrestlings have I wrestled with my sister, and I have prevailed: and she called his name Naphtali.", "9": "When Leah saw that she had left bearing, she took Zilpah her maid, and gave her Jacob to wife.", "10": "And Zilpah Leah's maid bare Jacob a son.", "11": "And Leah said, A troop cometh: and she called his name Gad.", "12": "And Zilpah Leah's maid bare Jacob a second son.", "13": "And Leah said, Happy am I, for the daughters will call me blessed: and she called his name Asher.", "14": "And Reuben went in the days of wheat harvest, and found mandrakes in the field, and brought them unto his mother Leah. Then Rachel said to Leah, Give me, I pray thee, of thy son's mandrakes.", "15": "And she said unto her, *Is it* a small matter that thou hast taken my husband? and wouldest thou take away my son's mandrakes also? And Rachel said, Therefore he shall lie with thee to night for thy son's mandrakes.", "16": "And Jacob came out of the field in the evening, and Leah went out to meet him, and said, Thou must come in unto me; for surely I have hired thee with my son's mandrakes. And he lay with her that night.", "17": "And God hearkened unto Leah, and she conceived, and bare Jacob the fifth son.", "18": "And Leah said, God hath given me my hire, because I have given my maiden to my husband: and she called his name Issachar.", "19": "And Leah conceived again, and bare Jacob the sixth son.", "20": "And Leah said, God hath endued me *with* a good dowry; now will my husband dwell with me, because I have born him six sons: and she called his name Zebulun.", "21": "And afterwards she bare a daughter, and called her name Dinah.", "22": "And God remembered Rachel, and God hearkened to her, and opened her womb.", "23": "And she conceived, and bare a son; and said, God hath taken away my reproach:", "24": "And she called his name Joseph; and said, The LORD shall add to me another son.", "25": "And it came to pass, when Rachel had born Joseph, that Jacob said unto Laban, Send me away, that I may go unto mine own place, and to my country.", "26": "Give *me* my wives and my children, for whom I have served thee, and let me go: for thou knowest my service which I have done", "27": "And Laban said unto him, I pray thee, if I have found favour in thine eyes, *tarry: for* I have learned by experience that the LORD hath blessed me for thy sake.", "28": "And he said, Appoint me thy wages, and I will give", "29": "And he said unto him, Thou knowest how I have served thee, and how thy cattle", "30": "For *it was* little which thou hadst before I *came*, and it is *now* increased unto a multitude; and the LORD hath blessed thee since my coming: and now when shall I provide for mine own house", "31": "And he said, What shall I give thee? And Jacob said, Thou shalt not give me any thing: if thou wilt do this thing for me, I will again feed *and* keep thy flock:", "32": "I will pass through all thy flock to day, removing from thence all the speckled and spotted cattle, and all the brown cattle among the sheep, and the spotted and speckled among the goats: and *of such* shall be my hire.", "33": "So shall my righteousness answer for me in time to come, when it shall come for my hire before thy face: every one that *is* not speckled and spotted among the goats, and brown among the sheep, that shall be counted stolen", "34": "And Laban said, Behold, I would it might be according to thy word.", "35": "And he removed that day the he goats that were ringstraked and spotted, and all the she goats that were speckled and spotted, *and* every one that had *some* white in it, and all the brown among the sheep, and gave *them* into the hand of his sons.", "36": "And he set three days' journey betwixt himself and Jacob: and Jacob fed the rest of Laban's flocks.", "37": "And Jacob took him rods of green poplar, and of the hazel and chesnut tree; and pilled white strakes in them, and made the white appear which *was* in the rods.", "38": "And he set the rods which he had pilled before the flocks in the gutters in the watering troughs when the flocks came to drink, that they should conceive when they came to drink.", "39": "And the flocks conceived before the rods, and brought forth cattle ringstraked, speckled, and spotted.", "40": "And Jacob did separate the lambs, and set the faces of the flocks toward the ringstraked, and all the brown in the flock of Laban; and he put his own flocks by themselves, and put them not unto Laban's cattle.", "41": "And it came to pass, whensoever the stronger cattle did conceive, that Jacob laid the rods before the eyes of the cattle in the gutters, that they might conceive among the rods.", "42": "But when the cattle were feeble, he put *them* not in: so the feebler were Laban's, and the stronger Jacob's.", "43": "And the man increased exceedingly, and had much cattle, and maidservants, and menservants, and camels, and asses."}}, "tsk": {"1": [{"kopj  42:12", "svLabel": null}], "kinderen": []}]}, {"topic": "Camel, The", "href": "../../torrey/c/#t-camel-the", "kinderen": [{"label": "A part of patriarchal wealth", "href": "../../torrey/c/?hl=Gen.30.43#i2395", "refs": [{"disp": "Gen 12:16", "href": "../../genesis/12/#v16", "ref": "Gen 12:16", "svLabel": null}, {"disp": "Gen 30:43", "href": "../../genesis/30/#v43", "ref": "Gen 30:43", "svLabel": null}, {"disp": "Job 1:3", "href": "../../job/1/#v3", "ref": "Job 1:3", "svLabel": null}], "kinderen": []}]}]}}, "extern": {"Ex 1:3": "Issaschar, Zebulon en Benjamin;", "Jak 4:5": "Of denkt u dat de Schrift zomaar zegt: De Geest, Die in ons woont, verlangt vurig naar ons?", "Gen 49:13": "Zebulon zal aan de haven van de zeeën wonen, en hij zal aan de haven van de schepen wezen; en zijn grens zal zijn naar Sidon.", "Ps 105:42": "Want Hij dacht aan Zijn heilig woord, aan Abraham, Zijn knecht.", "Hoogl 7:13": "De liefdesappels geven geur, en aan onze deuren zijn allerlei heerlijke vruchten, nieuwe en oude; mijn Liefste! die heb ik voor U weggelegd.", "Gen 31:36": "Toen werd Jakob boos, en twistte met Laban; en Jakob antwoordde en zei tegen Laban: Wat is mijn overtreding, wat is mijn zonde, dat u mij zo heftig achterna hebt gejaagd?", "Gen 25:21": "En Izak bad de HEERE vurig voor zijn vrouw; want zij was onvruchtbaar; en de HEERE liet Zich door hem verbidden, zodat Rebekka, zijn vrouw, zwanger werd.", "Gen 24:6": "En Abraham zei tegen hem: Pas op dat u mijn zoon niet weer daarheen terugbrengt!", "Hebr 11:22": "Door het geloof heeft Jozef, stervend, gesproken over het vertrek van de kinderen van Israël, en heeft hij bevel gegeven over zijn gebeente.", "Hoogl 6:9": "Eén is Mijn duif, Mijn volmaakte, de enige van haar moeder, zij is de zuivere van hen die haar gebaard heeft; als de dochters haar zien, zullen zij haar gelukkig prijzen, de koninginnen en de bijvrouwen; en zij zullen haar loven.", "Ps 106:16": "En zij benijdden Mozes in het leger, en Aäron, de heilige van de HEERE.", "Jer 20:15": "Vervloekt zij de man die mijn vader boodschapte en zei: U is een zoon geboren, waardoor hij hem zeer verblijdde!", "Gen 29:32": "En Lea werd zwanger, en baarde een zoon, en zij noemde zijn naam Ruben; want zij zei: Zeker, de HEERE heeft mijn verdrukking aangezien; daarom zal mijn man mij nu liefhebben.", "Ex 1:4": "Dan en Nafthali, Gad en Aser.", "Gen 29:20": "Zo diende Jakob zeven jaar voor Rachel; en die waren in zijn ogen als enkele dagen, omdat hij haar liefhad.", "Gen 30:31-34": "En hij zei: Wat zal ik u geven? Toen zei Jakob: U hoeft mij helemaal niets te geven, als u mij dit wilt doen; ik zal opnieuw uw kudde weiden en bewaren. Ik zal heden door heel uw kudde gaan, en daaruit afzonderen al het gespikkelde en geplekte vee, en al het bruine vee onder de lammeren, en het geplekte en gespikkelde onder de geiten; en dat zal mijn loon zijn. Zo zal mijn rechtvaardigheid morgen voor mij getuigen, als u komt over mijn loon, voor uw gezicht; alles wat niet gespikkeld en geplekt is onder de geiten en bruin onder de lammeren, dat zal bij mij als gestolen gelden.", "Gen 31:13": "Ik ben die God van Bethel, waar u het opgerichte teken gezalfd hebt, waar u Mij een gelofte beloofd hebt; nu, maak u op, vertrek uit dit land, en keer terug naar het land van uw familie.", "Gen 48:1-22": "Het gebeurde nu na deze dingen, dat men Jozef vertelde: Zie, uw vader is ziek! Toen nam hij zijn twee zonen met zich, Manasse en Efraïm. En men vertelde het Jakob, en men zei: Zie, uw zoon Jozef komt naar u toe! Toen verzamelde Israël zijn krachten, en ging op het bed zitten. Daarna zei Jakob tegen Jozef: God de Almachtige is aan mij verschenen te Luz, in het land Kanaän, en Hij heeft mij gezegend;", "Ezech 31:8": "De ceders in Gods hof konden hem niet overtreffen, de dennenbomen waren zijn takken niet gelijk, en de kastanjebomen waren niet gelijk aan zijn scheuten; geen boom in Gods hof was hem gelijk in zijn schoonheid.", "Gen 49:16": "Dan zal zijn volk richten, als een van de stammen van Israël.", "Gen 34:26": "Zij sloegen ook Hemor en zijn zoon Sichem dood met de scherpte van het zwaard; en zij namen Dina uit Sichems huis en gingen vandaar weg.", "Gen 17:16": "Want Ik zal haar zegenen, en u ook uit haar een zoon geven; ja, Ik zal haar zegenen, zodat zij tot volken wordt: koningen van volken zullen uit haar voortkomen!", "Gen 30:14-16": "En Ruben ging in de dagen van de tarweoogst, en hij vond dudaïm in het veld, en hij bracht die naar zijn moeder Lea. Toen zei Rachel tegen Lea: Geef mij toch van de dudaïm van uw zoon. En zij zei tegen haar: Is het weinig dat u mijn man genomen hebt, dat u ook de dudaïm van mijn zoon nemen wilt? Toen zei Rachel: Daarom zal hij deze nacht bij u liggen, voor de dudaïm van uw zoon. Toen Jakob 's avonds uit het veld kwam, ging Lea naar buiten, hem tegemoet, en zei: U moet bij mij komen; want ik heb u zeker gehuurd voor de dudaïm van mijn zoon; en hij lag die nacht bij haar.", "Gen 29:15-20": "Daarna zei Laban tegen Jakob: Omdat u mijn broer bent, zou u mij dan voor niets moeten dienen? Vertel mij, wat zal uw loon zijn? En Laban had twee dochters: de naam van de oudste was Lea; en de naam van de jongste was Rachel. Lea had tere ogen; maar Rachel was mooi van gestalte, en mooi van gezicht.", "Gen 30:31-43": "En hij zei: Wat zal ik u geven? Toen zei Jakob: U hoeft mij helemaal niets te geven, als u mij dit wilt doen; ik zal opnieuw uw kudde weiden en bewaren. Ik zal heden door heel uw kudde gaan, en daaruit afzonderen al het gespikkelde en geplekte vee, en al het bruine vee onder de lammeren, en het geplekte en gespikkelde onder de geiten; en dat zal mijn loon zijn. Zo zal mijn rechtvaardigheid morgen voor mij getuigen, als u komt over mijn loon, voor uw gezicht; alles wat niet gespikkeld en geplekt is onder de geiten en bruin onder de lammeren, dat zal bij mij als gestolen gelden.", "Spr 31:28": "Koph. Haar kinderen staan op, en prijzen haar gelukkig; ook haar man, en hij prijst haar, en zegt:", "1 Sam 2:1-11": "Toen bad Hanna en zei: Mijn hart springt van vreugde op in de HEERE; mijn hoorn is verhoogd in de HEERE; mijn mond is wijd opengedaan over mijn vijanden; want ik verheug mij in Uw heil. Er is niemand heilig, zoals de HEERE; want er is niemand dan U, en er is geen rotssteen, zoals onze God! Maak het niet te veel, dat u hoog, hoog zou spreken, dat iets hards uit uw mond zou gaan; want de HEERE is een God van wetenschappen, en Zijn daden zijn recht gedaan.", "Gen 12:3": "En Ik zal zegenen wie u zegenen, en vervloeken wie u vervloekt; en in u zullen alle geslachten van de aarde gezegend worden.", "Hand 7:5": "En Hij gaf hem geen erfdeel daarin, zelfs geen voetstap; maar Hij beloofde dat Hij het hem tot een bezitting geven zou, en aan zijn nageslacht na hem, terwijl hij nog geen kind had.", "Gen 30:1-25": "Toen Rachel zag dat zij Jakob geen kinderen gaf, benijdde Rachel haar zuster; en zij zei tegen Jakob: Geef mij kinderen! Anders ben ik dood. Toen ontstak Jakobs toorn tegen Rachel, en hij zei: Ben ik dan in de plaats van God, Die de vrucht van uw buik van u geweerd heeft? En zij zei: Zie, daar is mijn dienstmaagd Bilha, ga bij haar; dat zij op mijn knieën baart, en ik ook uit haar gebouwd word.", "Hebr 11:9": "Door het geloof is hij een inwoner geweest in het land van de belofte, als in een vreemd land, en heeft hij in tenten gewoond met Izak en Jakob, die medeerfgenamen waren van dezelfde belofte.", "Jes 54:1": "Zing vrolijk, u onvruchtbare, die niet gebaard hebt! Maak geschal met vrolijk gezang, en juich, die geen barensnood gehad hebt! Want de kinderen van de eenzame zijn meer dan de kinderen van de getrouwde, zegt de HEERE.", "Spr 17:6": "De kroon van de ouderen zijn de kleinkinderen, en het sieraad van de kinderen zijn hun vaders.", "Gen 18:33": "Toen ging de HEERE weg, toen Hij geëindigd had tot Abraham te spreken; en Abraham keerde terug naar zijn plaats.", "Job 3:20-22": "Waarom geeft Hij de ellendigen het licht, en het leven de bitterlijk bedroefden van gemoed? Die verlangen naar de dood, maar hij is er niet; en graven daarnaar meer dan naar verborgen schatten; Die blij zijn tot het opspringen toe, en zich verheugen, als zij het graf vinden;", "Gen 46:24": "En de zonen van Nafthali: Jahzeel, en Guni, en Jezer, en Sillem.", "Gen 34:11": "En Sichem zei tegen haar vader en tegen haar broers: Laat mij genade vinden in uw ogen; en wat u tegen mij zeggen zult, zal ik geven.", "Gen 39:21": "Maar de HEERE was met Jozef, en bewees hem Zijn goedertierenheid; en gaf hem genade in de ogen van de leider van de gevangenis.", "Gen 47:25": "En zij zeiden: U hebt ons leven gered; laten wij genade vinden in de ogen van mijn heer, en wij zullen knechten van Farao zijn.", "Gen 25:31-34": "Toen zei Jakob: Verkoop mij op deze dag uw eerstgeboorterecht. En Ezau zei: Zie, ik ga sterven; en wat heb ik dan aan het eerstgeboorterecht? Toen zei Jakob: Zweer het mij op deze dag! En hij zwoer het hem; en hij verkocht zijn eerstgeboorterecht aan Jakob.", "Gen 30:37-43": "Toen nam Jakob voor zichzelf takken van groen populierenhout, en van hazelaar, en van kastanje; en hij schilde daarin witte strepen, zodat het wit dat aan die takken was, bloot kwam te liggen. En hij legde deze takken, die hij geschild had, in de goten, in de drinkbakken van het water, waar de kudde kwam drinken, tegenover de kudde; en zij werden verhit, als zij kwamen om te drinken. Als dan de kudde verhit werd bij de takken, dan lammerde de kudde gesprenkelde, gespikkelde en geplekte lammeren.", "Deut 33:24": "En van Aser zei hij: Aser zij gezegend met zonen; hij zij zijn broeders aangenaam, en dope zijn voet in olie.", "Gen 37:11": "Zijn broers benijdden hem; maar zijn vader bewaarde deze zaak.", "Gen 30:1-8": "Toen Rachel zag dat zij Jakob geen kinderen gaf, benijdde Rachel haar zuster; en zij zei tegen Jakob: Geef mij kinderen! Anders ben ik dood. Toen ontstak Jakobs toorn tegen Rachel, en hij zei: Ben ik dan in de plaats van God, Die de vrucht van uw buik van u geweerd heeft? En zij zei: Zie, daar is mijn dienstmaagd Bilha, ga bij haar; dat zij op mijn knieën baart, en ik ook uit haar gebouwd word.", "Hebr 11:21": "Door het geloof heeft Jakob, stervend, ieder van de zonen van Jozef gezegend, en heeft hij aangebeden, leunend op het uiteinde van zijn staf.", "Jer 15:14-20": "En Ik zal u overvoeren met uw vijanden, naar een land dat u niet kent; want een vuur is aangestoken in Mijn toorn, het zal over u branden. O HEERE! U weet het, denk aan mij, en bezoek mij, en wreek mij op mijn vervolgers; neem mij niet weg in Uw lankmoedigheid over hen; weet dat ik omwille van U smaad draag. Toen Uw woorden gevonden werden, heb ik ze opgegeten, en Uw woord is mij geweest tot vreugde en tot blijdschap van mijn hart; want ik ben naar Uw Naam genoemd, o HEERE, God van de heerscharen!", "2 Kor 12:14": "Zie, ik ben voor de derde keer gereed om naar u toe te komen, en zal u niet lastig zijn; want ik zoek niet het uwe, maar u; want de kinderen moeten niet schatten vergaderen voor de ouders, maar de ouders voor de kinderen.", "Job 1:17": "Terwijl deze nog sprak, kwam er een ander en zei: De Chaldeeën stelden drie groepen op, en vielen de kamelen aan, en namen ze mee, en sloegen de knechten met de scherpte van het zwaard; en ik ben maar alleen ontkomen om het u te vertellen.", "Gen 22:24": "En zijn bijvrouw, wier naam Reüma was, die baarde ook Tebah, en Gaham, en Tahas, en Maächa.", "Gen 33:5": "Daarna sloeg hij zijn ogen op en zag die vrouwen en die kinderen, en zei: Wie zijn dit bij u? En hij zei: De kinderen die God aan uw knecht genadig gegeven heeft.", "Ps 35:24": "Doe mij recht naar Uw gerechtigheid, HEERE, mijn God! En laat hen zich over mij niet verblijden.", "Gen 30:32-43": "Ik zal heden door heel uw kudde gaan, en daaruit afzonderen al het gespikkelde en geplekte vee, en al het bruine vee onder de lammeren, en het geplekte en gespikkelde onder de geiten; en dat zal mijn loon zijn. Zo zal mijn rechtvaardigheid morgen voor mij getuigen, als u komt over mijn loon, voor uw gezicht; alles wat niet gespikkeld en geplekt is onder de geiten en bruin onder de lammeren, dat zal bij mij als gestolen gelden. Toen zei Laban: Zie, och ja, laat het naar uw woord zijn!", "Ps 127:3": "Zie, de kinderen zijn een erfdeel van de HEERE; de vrucht van de buik is een beloning.", "Tit 3:3": "Want ook wij waren vroeger onverstandig, ongehoorzaam, dwalend, en dienden aan allerlei begeerten en genoegens; wij leefden in slechtheid en afgunst, waren hatelijk en haatten elkaar.", "Deut 33:21": "En hij heeft zich van het eerste voorzien, omdat hij daar in het deel van de wetgever bedekt was; daarom kwam hij met de hoofden van het volk; hij verrichtte de gerechtigheid van de HEERE, en Zijn oordelen met Israël.", "Gen 24:7": "De HEERE, de God van de hemel, Die mij uit het huis van mijn vader en uit het land van mijn familie genomen heeft, en Die tot mij gesproken heeft, en Die mij gezworen heeft en zei: Aan uw nageslacht zal Ik dit land geven! Die Zelf zal Zijn Engel voor uw aangezicht zenden, zodat u voor mijn zoon van daar een vrouw neemt.", "Gen 4:1": "En Adam had gemeenschap met Eva, zijn vrouw, en zij werd zwanger en baarde Kaïn, en zei: Ik heb een man van de HEERE verkregen!", "Ex 9:28": "Bid vurig tot de HEERE (want het is genoeg), dat er geen donder van God of hagel meer zal zijn; dan zal ik u laten gaan, en u zult niet langer hoeven te blijven.", "Hebr 11:16": "maar nu verlangen zij naar een beter vaderland, dat is, naar het hemelse. Daarom schaamt God Zich niet voor hen om hun God genoemd te worden; want Hij had voor hen een stad klaargemaakt.", "Jes 61:9": "En hun nageslacht zal onder de heidenvolken bekend worden, en hun nakomelingen te midden van de volken; allen die hen zien zullen, zullen hen erkennen, dat zij een nageslacht zijn, dat de HEERE gezegend heeft.", "Gen 24:35": "en de HEERE heeft mijn heer zeer gezegend, zodat hij groot geworden is; en Hij heeft hem gegeven schapen, en runderen, en zilver, en goud, en knechten, en dienstmeisjes, en kamelen, en ezels.", "Ps 43:1": "Doe mij recht, o God! En voer Zelf mijn rechtszaak tegen een liefdeloos volk; bevrijd mij van de man van het bedrog en van het onrecht.", "Job 3:12": "Waarom zijn mij de knieën voorgekomen, en waartoe de borsten, opdat ik zuigen zou?", "Gen 30:1-3": "Toen Rachel zag dat zij Jakob geen kinderen gaf, benijdde Rachel haar zuster; en zij zei tegen Jakob: Geef mij kinderen! Anders ben ik dood. Toen ontstak Jakobs toorn tegen Rachel, en hij zei: Ben ik dan in de plaats van God, Die de vrucht van uw buik van u geweerd heeft? En zij zei: Zie, daar is mijn dienstmaagd Bilha, ga bij haar; dat zij op mijn knieën baart, en ik ook uit haar gebouwd word.", "Gen 50:19": "En Jozef zei tot hen: Vreest niet; want ben ik in de plaats van God?", "Gen 30:27-29": "Toen zei Laban tegen hem: Als ik toch genade gevonden heb in uw ogen; ik heb ondervonden dat de HEERE mij om u gezegend heeft. Hij zei dan: Noem mij uitdrukkelijk uw loon, dat ik geven zal. Toen zei hij tegen hem: U weet hoe ik u gediend heb, en hoe uw vee bij mij geweest is.", "Gen 27:45": "Totdat de toorn van uw broer van u afkeert, en hij vergeten heeft wat u hem hebt aangedaan; dan zal ik boodschap sturen, en u van daar terughalen; waarom zou ik ook van u beiden beroofd worden op één dag?", "1 Sam 1:7": "En zo deed hij jaar op jaar; van toen af dat zij opging naar het huis van de HEERE, zo tergde zij haar steeds; daarom weende zij en at niet.", "Job 42:12": "En de HEERE zegende Jobs laatste meer dan zijn eerste; want hij had veertien duizend schapen, en zes duizend kamelen, en duizend juk runderen, en duizend ezelinnen.", "Jes 59:12": "Want onze overtredingen zijn talrijk voor U, en onze zonden getuigen tegen ons; want onze overtredingen zijn bij ons, en onze ongerechtigheden kennen wij;", "Gen 35:26": "En de zonen van Zilpa, Lea's dienstmaagd: Gad en Aser. Dit zijn de zonen van Jakob, die hem geboren zijn in Paddan-Aram.", "Deut 33:18": "En van Zebulon zei hij: Verheug u, Zebulon! over uw uittocht, en Issaschar! over uw tenten.", "Deut 7:14": "Gezegend zult u zijn boven alle volken; er zal onder u geen man of vrouw onvruchtbaar zijn, ook niet onder uw beesten;", "Gen 32:24": "Maar Jakob bleef alleen achter; en een man worstelde met hem, totdat de dageraad opging.", "Gen 34:1-3": "En Dina, de dochter van Lea, die zij Jakob gebaard had, ging naar buiten om de dochters van dat land te bezoeken. Sichem nu, de zoon van Hemor de Heviet, de landvorst, zag haar, en hij nam haar, en lag bij haar, en verkrachtte haar. En zijn ziel hechtte zich aan Dina, Jakobs dochter; en hij had de jonge vrouw lief, en sprak naar het hart van de jonge vrouw.", "Gen 30:32-40": "Ik zal heden door heel uw kudde gaan, en daaruit afzonderen al het gespikkelde en geplekte vee, en al het bruine vee onder de lammeren, en het geplekte en gespikkelde onder de geiten; en dat zal mijn loon zijn. Zo zal mijn rechtvaardigheid morgen voor mij getuigen, als u komt over mijn loon, voor uw gezicht; alles wat niet gespikkeld en geplekt is onder de geiten en bruin onder de lammeren, dat zal bij mij als gestolen gelden. Toen zei Laban: Zie, och ja, laat het naar uw woord zijn!", "Gen 31:9-13": "Zo heeft God het vee van uw vader afgenomen, en aan mij gegeven. En het gebeurde in de tijd dat de kudde bronstig werd, dat ik mijn ogen opsloeg, en ik zag in een droom; en zie, de bokken die de kudde besprongen, waren gestreept, gespikkeld, en gevlekt. En de Engel van God zei tegen mij in de droom: Jakob! En ik zei: Zie, hier ben ik!", "Gen 39:3": "Toen zijn heer zag dat de HEERE met hem was, en dat de HEERE alles wat hij deed door zijn hand voorspoedig maakte,", "Ex 12:35": "De kinderen van Israël nu hadden gedaan naar het woord van Mozes, en hadden van de Egyptenaren gevraagd zilveren voorwerpen, en gouden voorwerpen, en kleren.", "Gen 46:13": "En de zonen van Issaschar: Tola, en Puwa, en Job, en Simron.", "Gen 29:31-35": "Toen de HEERE nu zag dat Lea gehaat was, opende Hij haar baarmoeder; maar Rachel was onvruchtbaar. En Lea werd zwanger, en baarde een zoon, en zij noemde zijn naam Ruben; want zij zei: Zeker, de HEERE heeft mijn verdrukking aangezien; daarom zal mijn man mij nu liefhebben. En zij werd opnieuw zwanger, en baarde een zoon, en zei: Omdat de HEERE gehoord heeft dat ik gehaat was, heeft Hij mij ook deze gegeven; en zij noemde zijn naam Simeon.", "1 Kron 2:1": "Dit zijn de kinderen van Israël: Ruben, Simeon, Levi en Juda, Issaschar en Zebulon,", "Richt 4:10": "Toen riep Barak Zebulon en Nafthali bijeen te Kedes, en hij trok op, te voet, met tienduizend man; ook trok Debora met hem op.", "Num 11:29": "Maar Mozes zei tegen hem: Bent u ijverzuchtig voor mij? Och, was al het volk van de HEERE maar profeten, zodat de HEERE Zijn Geest over hen zou geven!", "Gen 46:14": "En de zonen van Zebulon: Sered, en Elon, en Jahleel.", "Gen 50:23": "En Jozef zag van Efraïm kinderen, van het derde geslacht; ook werden de zonen van Machir, de zoon van Manasse, op de knieën van Jozef geboren.", "Gen 8:1": "En God dacht aan Noach, en aan al het gedierte, en aan al het vee dat met hem in de ark was; en God liet een wind over de aarde gaan, en de wateren werden stil.", "1 Sam 1:5": "Maar aan Hanna gaf hij een aanzienlijk deel, want hij had Hanna lief; doch de HEERE had haar baarmoeder toegesloten.", "Gen 49:15": "Toen hij de rust zag, dat zij goed was, en het land, dat het lieflijk was, boog hij zijn schouder om te dragen, en werd dienstbaar onder cijns.", "Gen 49:20": "Van Aser, zijn brood zal vet zijn; en hij zal koninklijke lekkernijen leveren.", "Gen 37:2": "Dit zijn Jakobs geschiedenissen. Jozef, een zoon van zeventien jaren, weidde de kudde met zijn broeders (en hij was een jongeling), met de zonen van Bilha en de zonen van Zilpa, de vrouwen van zijn vader; en Jozef bracht hun kwaad gerucht over aan hun vader.", "1 Sam 1:4-8": "En het gebeurde op die dag, toen Elkana offerde, dat hij aan Peninna, zijn vrouw, en aan al haar zonen en haar dochters delen gaf. Maar aan Hanna gaf hij een aanzienlijk deel, want hij had Hanna lief; doch de HEERE had haar baarmoeder toegesloten. En haar tegenpartij tergde haar ook met terging, om haar te ergeren, omdat de HEERE haar baarmoeder toegesloten had.", "Pred 4:4": "Verder zag ik al de moeite en alle bekwaamheid van het werk, dat het de mens jaloezie van zijn naaste aanbrengt. Dat is ook vluchtigheid en najagen van de wind.", "Gen 35:25": "En de zonen van Bilha, Rachels dienstmaagd: Dan en Naftali.", "Jer 13:2": "En ik kocht een gordel naar het woord van de HEERE, en ik deed die om mijn middel.", "Gen 25:1": "En Abraham ging verder, en nam een vrouw, wier naam Ketura was.", "2 Kron 2:10": "En zie, ik zal uw knechten, de houwers die het hout houwen, twintigduizend kor uitgeslagen tarwe geven, en twintigduizend kor gerst; daartoe twintigduizend bath wijn, en twintigduizend bath olie.", "Gen 31:37": "Nu u al mijn huisraad doorzocht hebt, wat hebt u gevonden van al het huisraad van uw huis! Leg het hier voor mijn broeders en uw broeders, en laat hen oordelen tussen ons beiden.", "1 Kron 2:9": "En de kinderen van Hezron, die hem geboren zijn, waren Jerahmeel, en Ram, en Chelubai.", "Gen 30:35-43": "En hij zonderde dezelfde dag af de gesprenkelde en geplekte bokken en al de gespikkelde en geplekte geiten, alles waar wit aan was, en al het bruine onder de lammeren; en hij gaf ze in de hand van zijn zonen. En hij stelde een afstand van drie dagen tussen zichzelf en Jakob; en Jakob weidde de overige kudde van Laban. Toen nam Jakob voor zichzelf takken van groen populierenhout, en van hazelaar, en van kastanje; en hij schilde daarin witte strepen, zodat het wit dat aan die takken was, bloot kwam te liggen.", "Hos 12:13": "Jakob vluchtte toch naar het veld van Syrië, en Israël diende om een vrouw, en hoedde de kudde om een vrouw.", "Gen 33:15": "En Ezau zei: Laat mij toch een deel van dit volk dat bij mij is, bij u achterlaten. En hij zei: Waarom zou dat nodig zijn? Laat mij genade vinden in de ogen van mijn heer!", "1 Kon 19:4": "Maar hijzelf ging een dagreis de woestijn in, en kwam en ging zitten onder een jeneverboom; en bad dat hij mocht sterven, en zei: Het is genoeg; neem nu, HEERE, mijn leven, want ik ben niet beter dan mijn vaderen.", "Gen 31:6": "En u weet, dat ik met al mijn kracht uw vader gediend heb.", "Gen 46:23": "En de zonen van Dan: Chusim.", "Ps 127:3-5": "Zie, de kinderen zijn een erfdeel van de HEERE; de vrucht van de buik is een beloning. Zoals de pijlen zijn in de hand van een held, zo zijn de zonen van de jeugd. Gelukkig is de man die zijn pijlkoker ermee gevuld heeft; zij zullen niet beschaamd worden als zij met de vijanden spreken zullen in de poort.", "Gen 46:8-27": "En dit zijn de namen van de zonen van Israël die naar Egypte kwamen: Jakob en zijn zonen. De eerstgeborene van Jakob: Ruben. En de zonen van Ruben: Hanoch, en Pallu, en Hezron, en Karmi. En de zonen van Simeon: Jemuël, en Jamin, en Ohad, en Jachin, en Zohar, en Saul, de zoon van een Kanaänitische vrouw.", "Luk 1:42": "en riep met luide stem uit, en zei: Gezegend bent u onder de vrouwen, en gezegend is de vrucht van uw buik!", "Gen 49:17": "Dan zal een slang zijn aan de weg, een adderslang naast het pad, die de hielen van het paard bijt, zodat zijn ruiter achterover valt.", "Job 3:11": "Waarom ben ik niet gestorven vanaf de baarmoeder, en heb de geest gegeven, toen ik uit de buik voortkwam?", "1 Sam 26:23": "De HEERE vergeldt aan ieder zijn rechtvaardigheid en zijn trouw; want de HEERE had u vandaag in mijn hand gegeven, maar ik heb mijn hand niet willen uitsteken tegen de gezalfde van de HEERE.", "Ps 68:28": "Daar is Benjamin de kleine, die over hen heerste, de vorsten van Juda, met hun vergadering, de vorsten van Zebulon, de vorsten van Naftali.", "Gen 28:15": "En zie, Ik ben met u, en Ik zal u behoeden overal waarheen u trekken zult, en Ik zal u terugbrengen naar dit land; want Ik zal u niet verlaten, totdat Ik gedaan heb wat Ik tot u gesproken heb.", "Deut 11:10": "Want het land, waar u naartoe gaat, om dat te erven, is niet als Egypteland, van waar u uitgegaan bent, waar u uw zaad zaaide, en bewaterde met uw voet, als een kruidhof.", "Gen 29:31": "Toen de HEERE nu zag dat Lea gehaat was, opende Hij haar baarmoeder; maar Rachel was onvruchtbaar.", "Gen 35:17": "En het gebeurde, toen zij het zwaar had bij haar bevalling, dat de vroedvrouw tegen haar zei: Wees niet bang; want ook dit is een zoon voor u!", "Gen 30:22-25": "God dacht ook aan Rachel; en God verhoorde haar, en opende haar baarmoeder. En zij werd zwanger, en baarde een zoon; en zij zei: God heeft mijn smaad weggenomen! En zij noemde zijn naam Jozef, en zei: De HEERE voegt mij nog een andere zoon toe.", "Openb 7:8": "uit het geslacht van Zebulon waren twaalfduizend verzegeld; uit het geslacht van Jozef waren twaalfduizend verzegeld; uit het geslacht van Benjamin waren twaalfduizend verzegeld.", "Joh 4:8": "(Want Zijn discipelen waren naar de stad gegaan om voedsel te kopen.)", "Job 1:21": "En hij zei: Naakt ben ik uit mijn moeders buik gekomen, en naakt zal ik daarheen terugkeren. De HEERE heeft gegeven, en de HEERE heeft genomen; de Naam van de HEERE zij geloofd!", "Jes 65:11": "Maar u, verlaters van de HEERE, u, vergeters van de berg van Mijn heiligheid, u, aanrichters van een tafel voor die bende, en u, opvullers van het drank voor dat getal!", "Gen 26:24": "En de HEERE verscheen hem diezelfde nacht, en zei: Ik ben de God van Abraham, uw vader; wees niet bang; want Ik ben met u; en Ik zal u zegenen, en uw nageslacht vermenigvuldigen, omwille van Abraham, Mijn knecht.", "Gen 16:3": "Zo nam Sarai, Abrams vrouw, de Egyptische Hagar, haar dienstmaagd, na tien jaar dat Abram in het land Kanaän gewoond had, en zij gaf haar aan Abram, haar man, hem tot een vrouw.", "Dan 1:9": "En God gaf Daniël genade en barmhartigheid bij de leider van de kamerlingen.", "Gen 46:23-25": "En de zonen van Dan: Chusim. En de zonen van Nafthali: Jahzeel, en Guni, en Jezer, en Sillem. Dit zijn de zonen van Bilha, die Laban aan zijn dochter Rachel gegeven had; en zij baarde deze Jakob, zij waren allen zeven zielen.", "Jak 3:14": "Maar als u bittere afgunst en eigenbelang in uw hart hebt, beroem u dan niet en lieg niet tegen de waarheid.", "Ex 13:14": "Wanneer het zal gebeuren dat uw zoon u later zal vragen en zegt: Wat is dat, dan moet u tegen hem zeggen: De HEERE heeft ons door een sterke hand uit Egypte, uit het diensthuis, uitgevoerd.", "1 Sam 14:15": "En er kwam beving in het leger, op het veld en onder heel het volk; de bezetting en de plunderaars beefden ook zelf; ja, het land schudde, want het was een beving van God.", "Gen 39:2-5": "En de HEERE was met Jozef, zodat hij een voorspoedig man was; en hij was in het huis van zijn heer, de Egyptenaar. Toen zijn heer zag dat de HEERE met hem was, en dat de HEERE alles wat hij deed door zijn hand voorspoedig maakte, vond Jozef genade in zijn ogen, en diende hem; en hij stelde hem aan over zijn huis, en alles wat hij had, gaf hij in zijn hand.", "Gen 35:24": "De zonen van Rachel: Jozef en Benjamin.", "Gen 49:14": "Issaschar is een sterk gebeende ezel, neerliggende tussen twee pakken.", "Gen 30:22-34": "God dacht ook aan Rachel; en God verhoorde haar, en opende haar baarmoeder. En zij werd zwanger, en baarde een zoon; en zij zei: God heeft mijn smaad weggenomen! En zij noemde zijn naam Jozef, en zei: De HEERE voegt mij nog een andere zoon toe.", "Gen 42:6": "Jozef nu was regent over dat land; hij was het die aan al het volk van het land verkocht; en Jozefs broers kwamen, en bogen zich voor hem, met het gezicht ter aarde.", "1 Kron 2:2": "Dan, Jozef en Benjamin, Nafthali, Gad en Aser.", "Ps 107:38": "En Hij zegent hen, zodat zij zeer meer worden, en hun vee vermindert Hij niet.", "Hand 7:4": "Toen ging hij weg uit het land van de Chaldeeën, en woonde in Haran. En vandaar, nadat zijn vader gestorven was, bracht Hij hem over naar dit land, waarin u nu woont.", "Gen 30:9-18": "Toen Lea nu zag dat zij ophield met baren, nam zij ook haar dienstmaagd Zilpa, en gaf haar aan Jakob tot vrouw. En Zilpa, Lea's dienstmaagd, baarde Jakob een zoon. Toen zei Lea: Er komt een hoop! En zij noemde zijn naam Gad.", "Gen 26:3": "Woon als vreemdeling in dat land, en Ik zal met u zijn, en zal u zegenen; want aan u en uw nageslacht zal Ik al deze landen geven, en Ik zal de eed bevestigen die Ik Abraham, uw vader, gezworen heb.", "Gen 17:20": "En wat Ismaël betreft, Ik heb u verhoord; zie, Ik heb hem gezegend, en zal hem vruchtbaar maken, en hem heel erg veel meer maken; twaalf vorsten zal hij voortbrengen, en Ik zal hem tot een groot volk maken;", "Job 13:19": "Wie is hij die met mij twist? Want als ik nu zweeg, zou ik de geest geven.", "Hos 4:13": "Op de toppen van de bergen offeren zij, en op de heuvels branden zij reukwerk, onder een eik, en populier, en iepenboom, omdat de schaduw daarvan goed is; daarom hoereren uw dochters, en uw bruiden plegen overspel.", "Gen 29:19": "Toen zei Laban: Het is beter dat ik haar aan u geef, dan dat ik haar aan een andere man geef; blijf bij mij.", "Deut 33:23": "En van Naftali zei hij: O Naftali! wees verzadigd van de goedgunstigheid, en vol van de zegen van de HEERE; bezit erfelijk het westen en het zuiden.", "1 Kron 12:32": "En van de kinderen van Issaschar, die verstand hadden van de tijden, om te weten wat Israël moest doen; hun hoofden waren tweehonderd, en al hun broeders volgden hun woord;", "1 Sam 2:6": "De HEERE doodt en maakt levend; Hij doet naar het graf neerdalen, en Hij doet weer opkomen.", "Gen 46:15": "Dit zijn de zonen van Lea, die zij Jakob gebaard heeft in Paddan-Aram, samen met Dina, zijn dochter; al de zielen van zijn zonen en zijn dochters waren drieëndertig.", "Jes 60:6": "Een menigte kamelen zal u bedekken, de snelle kamelen van Midian en Hefa; zij allen uit Scheba zullen komen; goud en wierook zullen zij aanbrengen, en zij zullen de overvloedige lof van de HEERE verkondigen.", "Gen 35:18": "En het gebeurde, toen haar ziel heenging (want zij stierf), dat zij zijn naam Ben-Oni noemde; maar zijn vader noemde hem Benjamin.", "Ex 1:1-5": "Dit zijn de namen van de zonen van Israël, die met Jakob in Egypte gekomen zijn; ieder kwam er met zijn huisgezin. Ruben, Simeon, Levi en Juda; Issaschar, Zebulon en Benjamin;", "Gen 16:1": "Sarai, Abrams vrouw, kreeg geen kinderen van hem; en zij had een Egyptische dienstmaagd, wier naam Hagar was.", "Gen 30:37-42": "Toen nam Jakob voor zichzelf takken van groen populierenhout, en van hazelaar, en van kastanje; en hij schilde daarin witte strepen, zodat het wit dat aan die takken was, bloot kwam te liggen. En hij legde deze takken, die hij geschild had, in de goten, in de drinkbakken van het water, waar de kudde kwam drinken, tegenover de kudde; en zij werden verhit, als zij kwamen om te drinken. Als dan de kudde verhit werd bij de takken, dan lammerde de kudde gesprenkelde, gespikkelde en geplekte lammeren.", "1 Sam 16:22": "Daarna stuurde Saul iemand naar Isaï om te zeggen: Laat David toch bij mij blijven, want hij heeft genade gevonden in mijn ogen.", "Gen 31:38-40": "Deze twintig jaar ben ik bij u geweest; uw ooien en uw geiten hebben niet misdragen, en de rammen van uw kudde heb ik niet gegeten. Het verscheurde heb ik niet naar u toe gebracht; ik heb het zelf vergoed; u eiste het van mijn hand, of het nu overdag gestolen was, of 's nachts gestolen was. Ik ben zo geweest, dat overdag de hitte mij verteerde, en 's nachts de vorst, en dat mijn slaap van mijn ogen week.", "Gen 46:16": "En de zonen van Gad: Zifjon en Haggi, Schuni en Ezbon, Eri en Arodi, en Areli.", "Gal 5:21": "Afgunst, moord, dronkenschappen, uitspattingen, en dergelijke; waarvan ik u van tevoren zeg, zoals ik ook eerder gezegd heb, dat wie zulke dingen doen, het Koninkrijk van God niet zullen beërven.", "Deut 33:22": "En van Dan zei hij: Dan is een jonge leeuw; hij zal als uit Bazan voortspringen.", "Gen 31:42": "Als de God van mijn vader, de God van Abraham, en de Vreze van Izak, niet bij mij was geweest, dan had u mij zeker nu met lege handen weggezonden! God heeft mijn ellende, en de arbeid van mijn handen, gezien, en heeft u gisteravond bestraft.", "1 Sam 2:5": "Zij die verzadigd waren, hebben zich verhuurd om brood, en zij die hongerig waren, hebben opgehouden; totdat de onvruchtbare zeven heeft gebaard, en zij die veel kinderen had, krachteloos is geworden.", "Neh 2:5": "En ik zei tegen de koning: Als het de koning goeddunkt, en als uw dienaar u aangenaam is, dat u mij zendt naar Juda, naar de stad van de graven van mijn vaderen, om die te herbouwen.", "Gen 31:26": "Toen zei Laban tegen Jakob: Wat hebt u gedaan, dat u mij misleid hebt, en mijn dochters weggevoerd hebt, als gevangenen met het zwaard?", "Gen 18:3": "En hij zei: Heere! Als ik nu genade gevonden heb in Uw ogen, ga toch niet aan Uw knecht voorbij.", "Gen 4:25": "En Adam had opnieuw gemeenschap met zijn vrouw, en zij baarde een zoon, en zij noemde zijn naam Seth; want God heeft mij, zei zij, een ander nageslacht gegeven in de plaats van Abel; want Kaïn heeft hem doodgeslagen.", "Gen 29:15": "Daarna zei Laban tegen Jakob: Omdat u mijn broer bent, zou u mij dan voor niets moeten dienen? Vertel mij, wat zal uw loon zijn?", "Mark 3:5": "En nadat Hij hen met toorn had aangekeken, bedroefd over de verharding van hun hart, zei Hij tegen de man: Strek uw hand uit. En hij strekte hem uit; en zijn hand werd hersteld, gezond als de andere.", "Ex 3:21": "En Ik zal dit volk genade geven in de ogen van de Egyptenaren; en het zal gebeuren, wanneer u weggaat, dat u niet met lege handen weg zult gaan.", "Gen 46:17": "En de zonen van Aser: Jimna, en Jisva, en Jisvi, en Berija, en Sera, hun zuster; en de zonen van Berija: Heber en Malchiël.", "Hebr 11:15": "En als zij aan dat vaderland gedacht hadden waar zij uit weggegaan waren, zouden zij de tijd gehad hebben om terug te keren;", "Gen 23:6": "Hoor ons, mijn heer! U bent een vorst van God in het midden van ons; begraaf uw dode in het beste van onze graven; niemand van ons zal zijn graf voor u weren, zodat u uw dode zou kunnen begraven.", "Job 1:3": "Daartoe had hij zeven duizend schapen, en drie duizend kamelen, en vijfhonderd juk ossen, en vijfhonderd ezelinnen; ook had hij zeer veel dienstvolk; zodat deze man groter was dan al die van het oosten.", "Hand 7:10": "en verloste hem uit al zijn verdrukkingen, en gaf hem genade en wijsheid voor Farao, de koning van Egypteland; en hij stelde hem aan als leider over Egypte en zijn hele huis.", "Gen 28:13": "En zie, de HEERE stond boven op de ladder en zei: Ik ben de HEERE, de God van uw vader Abraham, en de God van Izak; dit land, waarop u ligt te slapen, zal Ik aan u geven, en aan uw nageslacht.", "Gen 31:9-12": "Zo heeft God het vee van uw vader afgenomen, en aan mij gegeven. En het gebeurde in de tijd dat de kudde bronstig werd, dat ik mijn ogen opsloeg, en ik zag in een droom; en zie, de bokken die de kudde besprongen, waren gestreept, gespikkeld, en gevlekt. En de Engel van God zei tegen mij in de droom: Jakob! En ik zei: Zie, hier ben ik!", "Gen 35:22": "En het gebeurde, toen Israël in dat land woonde, dat Ruben heenging en lag bij Bilha, het bijvrouw van zijn vader; en Israël hoorde het. En de zonen van Jakob waren twaalf.", "Gen 30:27-43": "Toen zei Laban tegen hem: Als ik toch genade gevonden heb in uw ogen; ik heb ondervonden dat de HEERE mij om u gezegend heeft. Hij zei dan: Noem mij uitdrukkelijk uw loon, dat ik geven zal. Toen zei hij tegen hem: U weet hoe ik u gediend heb, en hoe uw vee bij mij geweest is.", "Gen 35:22-26": "En het gebeurde, toen Israël in dat land woonde, dat Ruben heenging en lag bij Bilha, het bijvrouw van zijn vader; en Israël hoorde het. En de zonen van Jakob waren twaalf. De zonen van Lea waren: Ruben, Jakobs eerstgeborene, daarna Simeon, en Levi, en Juda, en Issaschar, en Zebulon. De zonen van Rachel: Jozef en Benjamin.", "Gen 29:35": "En zij werd opnieuw zwanger, en baarde een zoon, en zei: Ditmaal zal ik de HEERE loven; daarom noemde zij zijn naam Juda. En zij hield op met baren.", "Gen 27:44": "En blijf bij hem enige dagen, totdat de hevige woede van uw broer keert;", "Gen 5:29": "En hij noemde zijn naam Noach, en zei: Deze zal ons troosten over ons werk en over de smart van onze handen, vanwege het aardrijk, dat de HEERE vervloekt heeft!", "Gen 31:38": "Deze twintig jaar ben ik bij u geweest; uw ooien en uw geiten hebben niet misdragen, en de rammen van uw kudde heb ik niet gegeten.", "Gen 30:22-24": "God dacht ook aan Rachel; en God verhoorde haar, en opende haar baarmoeder. En zij werd zwanger, en baarde een zoon; en zij zei: God heeft mijn smaad weggenomen! En zij noemde zijn naam Jozef, en zei: De HEERE voegt mij nog een andere zoon toe.", "Gen 30:1-24": "Toen Rachel zag dat zij Jakob geen kinderen gaf, benijdde Rachel haar zuster; en zij zei tegen Jakob: Geef mij kinderen! Anders ben ik dood. Toen ontstak Jakobs toorn tegen Rachel, en hij zei: Ben ik dan in de plaats van God, Die de vrucht van uw buik van u geweerd heeft? En zij zei: Zie, daar is mijn dienstmaagd Bilha, ga bij haar; dat zij op mijn knieën baart, en ik ook uit haar gebouwd word.", "Gen 30:1-23": "Toen Rachel zag dat zij Jakob geen kinderen gaf, benijdde Rachel haar zuster; en zij zei tegen Jakob: Geef mij kinderen! Anders ben ik dood. Toen ontstak Jakobs toorn tegen Rachel, en hij zei: Ben ik dan in de plaats van God, Die de vrucht van uw buik van u geweerd heeft? En zij zei: Zie, daar is mijn dienstmaagd Bilha, ga bij haar; dat zij op mijn knieën baart, en ik ook uit haar gebouwd word.", "Num 11:15": "En als U zo met mij doet, dood mij dan toch maar meteen, als ik genade in Uw ogen gevonden heb; en laat mij mijn ongeluk niet aanzien!", "Ef 4:26": "Word toornig, en zondig niet; laat de zon niet ondergaan over uw toorn;", "Gen 27:36": "Toen zei hij: Is het niet omdat men zijn naam Jakob noemt, dat hij mij nu al twee keer bedrogen heeft? mijn eerstgeboorterecht heeft hij genomen, en zie, nu heeft hij mijn zegen genomen! Verder zei hij: Hebt u dan geen zegen voor mij bewaard?", "Gen 31:31": "Toen antwoordde Jakob, en zei tegen Laban: Omdat ik bang was; want ik zei: Anders zou u misschien uw dochters met geweld van mij afnemen!", "Gen 12:16": "En hij deed Abram goed omwille van haar; zodat hij schapen had, en runderen, en ezels, en knechten, en dienstmeisjes, en ezelinnen, en kamelen.", "Jes 65:8": "Zo zegt de HEERE: Zoals wanneer men most in een tros druiven vindt, men zegt: Verderf ze niet, want er is een zegen in; zo zal Ik het om Mijn knechten doen, dat Ik hen niet allen verderf.", "Luk 1:48": "omdat Hij de nederigheid van Zijn dienstmaagd heeft aangezien; want zie, van nu af aan zullen alle geslachten mij zalig spreken.", "Gen 37:4": "Toen zijn broeders zagen dat hun vader hem boven al zijn broers liefhad, haatten zij hem, en konden hem niet vredelijk toespreken.", "Deut 7:13": "en Hij zal u liefhebben, en zal u zegenen, en u meer maken; en Hij zal de vrucht van uw buik zegenen, en de vrucht van uw land, uw koren, en uw most, en uw olie, de nakomelingen van uw koeien, en de kudden van uw kleinvee, in het land dat Hij uw vaderen gezworen heeft aan u te geven.", "Ezech 37:16": "U dan, mensenkind! Neem een stuk hout, en schrijf daarop: Voor Juda, en voor de kinderen van Israël, zijn metgezellen; en neem een ander stuk hout, en schrijf daarop: Voor Jozef, het hout van Efraïm, en van het gehele huis van Israël, zijn metgezellen.", "Deut 33:25": "IJzer en koper zal onder uw schoen zijn; en uw sterkte gelijk uw dagen!", "Jer 20:14-18": "Vervloekt zij de dag waarop ik geboren ben; de dag waarop mijn moeder mij gebaard heeft, die zij niet gezegend! Vervloekt zij de man die mijn vader boodschapte en zei: U is een zoon geboren, waardoor hij hem zeer verblijdde! Ja, laat die man zijn als de steden die de HEERE heeft omgekeerd, en het heeft Hem niet berouwd; en laat hij in de morgenstond een geroep horen, en op de middag een geschreeuw.", "Gen 25:6": "Maar aan de zonen van de bijvrouwen die Abraham had, gaf Abraham geschenken; en zond hen weg van zijn zoon Izak, terwijl hij nog leefde, oostwaarts naar het land van het Oosten.", "1 Kor 3:3": "Want u bent nog vleselijk; want omdat er onder u nijd is, en twist, en tweedracht, bent u niet vleselijk, en wandelt u niet naar de mens?", "Gen 24:56": "Maar hij zei tegen hen: Houd mij niet op, omdat de HEERE mijn weg voorspoedig gemaakt heeft! Laat mij vertrekken, zodat ik naar mijn heer ga.", "Gen 39:3-5": "Toen zijn heer zag dat de HEERE met hem was, en dat de HEERE alles wat hij deed door zijn hand voorspoedig maakte, vond Jozef genade in zijn ogen, en diende hem; en hij stelde hem aan over zijn huis, en alles wat hij had, gaf hij in zijn hand. En het gebeurde vanaf toen, dat hij hem aangesteld had over zijn huis en over alles wat hij had, dat de HEERE het huis van de Egyptenaar zegende, om Jozefs wil; ja, de zegen van de HEERE was op alles wat hij had, in het huis en op het veld.", "Gen 29:34": "En zij werd nog zwanger, en baarde een zoon, en zei: Nu zal mijn man zich ditmaal aan mij hechten, omdat ik hem drie zonen gebaard heb; daarom noemde zij zijn naam Levi.", "Hand 7:9-15": "En de aartsvaders, jaloers geworden, verkochten Jozef om naar Egypte gebracht te worden; maar God was met hem, en verloste hem uit al zijn verdrukkingen, en gaf hem genade en wijsheid voor Farao, de koning van Egypteland; en hij stelde hem aan als leider over Egypte en zijn hele huis. En er kwam een hongersnood over het hele land van Egypte en Kanaän, en grote nood; en onze vaders vonden geen voedsel.", "Gen 39:21-23": "Maar de HEERE was met Jozef, en bewees hem Zijn goedertierenheid; en gaf hem genade in de ogen van de leider van de gevangenis. En de leider van de gevangenis gaf alle gevangenen die in de gevangenis waren in Jozefs hand; en alles wat zij daar deden, deed hij. De leider van de gevangenis had geen omzien meer naar enig ding dat in zijn hand was, omdat de HEERE met hem was; en wat hij deed, dat deed de HEERE goed gedijen.", "Ps 1:3": "Want hij zal zijn als een boom, geplant aan waterbeken, die zijn vrucht geeft op zijn tijd, en waarvan het blad niet afvalt; en alles wat hij doet, zal goed gelukken.", "Gen 35:16-19": "En zij reisden verder van Bethel; en er was nog een kleine afstand om tot Efrath te komen; en Rachel baarde, en zij had het zwaar bij haar bevalling. En het gebeurde, toen zij het zwaar had bij haar bevalling, dat de vroedvrouw tegen haar zei: Wees niet bang; want ook dit is een zoon voor u! En het gebeurde, toen haar ziel heenging (want zij stierf), dat zij zijn naam Ben-Oni noemde; maar zijn vader noemde hem Benjamin.", "Neh 1:11": "Och, Heere, laat toch Uw oor opmerkzaam zijn op het gebed van Uw dienaar, en op het gebed van Uw dienaren, die ernaar verlangen Uw Naam te vrezen; en laat het Uw dienaar vandaag toch goed lukken, en geef hem barmhartigheid voor het aangezicht van deze man. Ik was namelijk de schenker van de koning.", "Gen 32:25": "En toen Hij zag dat Hij niet de overhand over hem kreeg, raakte Hij zijn heupgewricht aan, zodat het heupgewricht van Jakob verwrongen raakte, terwijl Hij met hem worstelde.", "Gen 29:29": "En Laban gaf aan zijn dochter Rachel zijn dienstmeisje Bilha, haar tot een dienstmeisje.", "Ex 32:19": "En het gebeurde, toen hij bij het kamp kwam en het kalf en de reidansen zag, dat de toorn van Mozes ontstak, en dat hij de tafelen uit zijn handen wierp en ze onder aan de berg verbrak.", "1 Tim 5:8": "Maar als iemand voor de zijnen, en vooral voor zijn huisgenoten, niet zorgt, die heeft het geloof verloochend, en is erger dan een ongelovige.", "Jes 4:1": "En op die dag zullen zeven vrouwen één man vastgrijpen en zeggen: Ons eigen brood zullen wij eten, en met onze eigen kleren zullen wij bekleed zijn; laat ons alleen naar uw naam genoemd worden, neem onze smaad weg.", "Ex 12:36": "Daartoe had de HEERE het volk genade gegeven in de ogen van de Egyptenaren, zodat zij hun hun verzoek toestonden; en zij beroofden de Egyptenaren.", "Gen 21:10": "En zij zei tegen Abraham: Jaag deze slavin en haar zoon weg; want de zoon van deze slavin zal niet erven met mijn zoon, met Izak.", "Klaagl 3:59": "Resch. HEERE! U hebt de verkeerdheid gezien, die men mij aangedaan heeft, oordeel mijn rechtszaak.", "Gen 28:3": "En God, de Almachtige, zegent u, en maakt u vruchtbaar, en vermenigvuldigt u, zodat u tot een groep volken wordt.", "Gen 31:9": "Zo heeft God het vee van uw vader afgenomen, en aan mij gegeven.", "Ps 113:9": "Die de onvruchtbare vrouw doet wonen als moeder in een huisgezin, een blijde moeder van kinderen. Halleluja!", "1 Sam 1:6": "En haar tegenpartij tergde haar ook met terging, om haar te ergeren, omdat de HEERE haar baarmoeder toegesloten had.", "Matt 5:22": "Maar Ik zeg u: ieder die zonder reden toornig is op zijn broeder, die zal strafbaar zijn voor het gericht; en wie tegen zijn broeder zegt: Raka! die zal strafbaar zijn voor de grote raad; maar wie zegt: Dwaas! die zal strafbaar zijn voor het helse vuur.", "Ruth 4:13": "Zo nam Boaz Ruth, en zij werd hem tot vrouw, en hij ging tot haar in; en de HEERE gaf haar dat zij zwanger werd en een zoon baarde.", "Luk 1:25": "Zo heeft de Heere mij gedaan, in de dagen waarin Hij naar mij omzag, om mijn smaad onder de mensen weg te nemen.", "Gen 31:7": "Maar uw vader heeft mij bedrogen, en heeft mijn loon tien keer veranderd; maar God heeft hem niet toegelaten mij kwaad te doen.", "1 Sam 30:17": "En David sloeg hen van de schemering tot aan de avond van de volgende dag; en er ontkwam niet één man van hen, behalve vierhonderd jonge mannen, die op kamelen reden en vluchtten.", "Gen 33:2": "En hij zette de dienstmaagden en hun kinderen vooraan; en Lea en haar kinderen daarachter; en Rachel en Jozef achteraan.", "Spr 14:30": "Een gezond hart is het leven van het vlees; maar afgunst is verrotting van de beenderen.", "Gen 16:6": "En Abram zei tegen Sarai: Zie, uw dienstmaagd is in uw hand; doe met haar wat goed is in uw ogen. En Sarai vernederde haar, en zij vluchtte van haar aangezicht.", "Gen 49:19": "Aangaande Gad, een bende zal hem aanvallen; maar hij zal haar aanvallen aan het einde.", "Gen 16:2": "En Sarai zei tegen Abram: Zie toch, de HEERE heeft mij belet kinderen te krijgen; ga toch naar mijn dienstmaagd, misschien zal ik uit haar gebouwd worden. En Abram luisterde naar de stem van Sarai.", "1 Kron 27:30": "En over de kamelen was Obil, de Ismaëliet; en over de ezelinnen was Jechdeja, de Meronothiet.", "Gen 21:2": "En Sara werd zwanger, en baarde Abraham een zoon in zijn ouderdom, op de vastgestelde tijd die God hem gezegd had.", "Gen 30:9-13": "Toen Lea nu zag dat zij ophield met baren, nam zij ook haar dienstmaagd Zilpa, en gaf haar aan Jakob tot vrouw. En Zilpa, Lea's dienstmaagd, baarde Jakob een zoon. Toen zei Lea: Er komt een hoop! En zij noemde zijn naam Gad.", "Ruth 4:11": "En al het volk dat in de poort was, alsook de oudsten, zeiden: Wij zijn getuigen; de HEERE make deze vrouw, die in uw huis komt, als Rachel en als Lea, die beiden het huis van Israël gebouwd hebben; en handel kloek in Efratha, en maak uw naam vermaard in Bethlehem!", "2 Kon 5:7": "En het gebeurde, toen de koning van Israël de brief gelezen had, dat hij zijn kleren scheurde, en zei: Ben ik dan God, om te doden en levend te maken, dat deze man naar mij toe stuurt, om een man van zijn melaatsheid te verlossen? Want inderdaad, let toch op en zie, dat hij een aanleiding tegen mij zoekt.", "Gen 31:10": "En het gebeurde in de tijd dat de kudde bronstig werd, dat ik mijn ogen opsloeg, en ik zag in een droom; en zie, de bokken die de kudde besprongen, waren gestreept, gespikkeld, en gevlekt.", "Gen 29:15-30": "Daarna zei Laban tegen Jakob: Omdat u mijn broer bent, zou u mij dan voor niets moeten dienen? Vertel mij, wat zal uw loon zijn? En Laban had twee dochters: de naam van de oudste was Lea; en de naam van de jongste was Rachel. Lea had tere ogen; maar Rachel was mooi van gestalte, en mooi van gezicht.", "Gen 39:1-23": "Jozef werd naar Egypte afgevoerd; en Potifar, een hoveling van de farao, een aanvoerder van de lijfwacht, een Egyptisch man, kocht hem van de Ismaëlieten, die hem daarheen afgevoerd hadden. En de HEERE was met Jozef, zodat hij een voorspoedig man was; en hij was in het huis van zijn heer, de Egyptenaar. Toen zijn heer zag dat de HEERE met hem was, en dat de HEERE alles wat hij deed door zijn hand voorspoedig maakte,", "Gen 25:30": "En Ezau zei tegen Jakob: Laat mij toch slurpen van dat rode, dat rode daar, want ik ben moe; daarom heeft men zijn naam Edom genoemd.", "Gen 31:55": "En Laban stond 's morgens vroeg op, en kuste zijn zonen, en zijn dochters, en zegende hen; en Laban trok weg, en keerde terug naar zijn plaats.", "Gen 31:40": "Ik ben zo geweest, dat overdag de hitte mij verteerde, en 's nachts de vorst, en dat mijn slaap van mijn ogen week.", "Gen 24:54": "Toen aten en dronken zij, hij en de mannen die bij hem waren; en zij overnachtten, en zij stonden 's morgens op, en hij zei: Laat mij vertrekken naar mijn heer!", "Ruth 2:13": "En zij zei: Laat mij genade vinden in uw ogen, mijn heer, omdat u mij getroost hebt, en omdat u naar het hart van uw dienstmaagd gesproken hebt, hoewel ik niet ben als een van uw dienstmaagden.", "Gen 29:32-35": "En Lea werd zwanger, en baarde een zoon, en zij noemde zijn naam Ruben; want zij zei: Zeker, de HEERE heeft mijn verdrukking aangezien; daarom zal mijn man mij nu liefhebben. En zij werd opnieuw zwanger, en baarde een zoon, en zei: Omdat de HEERE gehoord heeft dat ik gehaat was, heeft Hij mij ook deze gegeven; en zij noemde zijn naam Simeon. En zij werd nog zwanger, en baarde een zoon, en zei: Nu zal mijn man zich ditmaal aan mij hechten, omdat ik hem drie zonen gebaard heb; daarom noemde zij zijn naam Levi.", "Gen 29:30-34": "En hij kwam ook bij Rachel, en had ook Rachel liever dan Lea; en hij diende bij hem nog zeven andere jaren. Toen de HEERE nu zag dat Lea gehaat was, opende Hij haar baarmoeder; maar Rachel was onvruchtbaar. En Lea werd zwanger, en baarde een zoon, en zij noemde zijn naam Ruben; want zij zei: Zeker, de HEERE heeft mijn verdrukking aangezien; daarom zal mijn man mij nu liefhebben.", "Gen 30:27-34": "Toen zei Laban tegen hem: Als ik toch genade gevonden heb in uw ogen; ik heb ondervonden dat de HEERE mij om u gezegend heeft. Hij zei dan: Noem mij uitdrukkelijk uw loon, dat ik geven zal. Toen zei hij tegen hem: U weet hoe ik u gediend heb, en hoe uw vee bij mij geweest is.", "Joh 4:3": "verliet Hij Judea, en ging weer naar Galilea.", "Jes 6:13": "Toch zal er nog een tiende deel in zijn, en het zal terugkeren, en zijn om af te weiden; maar zoals de eik, en zoals de haageik, waarin na het afwerpen van hun bladeren nog steunsel is, zo zal het heilige zaad het steunsel daarvan zijn.", "Gen 30:17-22": "En God verhoorde Lea; en zij werd zwanger, en baarde Jakob de vijfde zoon. Toen zei Lea: God heeft mij mijn loon gegeven, omdat ik mijn dienstmaagd aan mijn man gegeven heb; en zij noemde zijn naam Issaschar. En Lea werd opnieuw zwanger, en zij baarde Jakob de zesde zoon.", "Gen 30:17-21": "En God verhoorde Lea; en zij werd zwanger, en baarde Jakob de vijfde zoon. Toen zei Lea: God heeft mij mijn loon gegeven, omdat ik mijn dienstmaagd aan mijn man gegeven heb; en zij noemde zijn naam Issaschar. En Lea werd opnieuw zwanger, en zij baarde Jakob de zesde zoon.", "2 Kor 7:10": "Want de droefheid naar God werkt een onberouwelijke bekering tot zaligheid; maar de droefheid van de wereld werkt de dood.", "Gen 35:23": "De zonen van Lea waren: Ruben, Jakobs eerstgeborene, daarna Simeon, en Levi, en Juda, en Issaschar, en Zebulon.", "Ef 6:12": "Want wij hebben de strijd niet tegen vlees en bloed, maar tegen de overheden, tegen de machten, tegen de geweldhebbers van de wereld, van de duisternis van deze eeuw, tegen de geestelijke boosheden in de lucht.", "1 Kon 11:19": "En Hadad vond grote genade in de ogen van Farao, zodat hij hem tot vrouw gaf de zuster van zijn eigen vrouw, de zuster van Tachpenes, de koningin.", "1 Sam 1:8": "Toen zei Elkana, haar man: Hanna, waarom weent u, en waarom eet u niet, en waarom is uw hart bedroefd? Ben ik u niet beter dan tien zonen?", "Job 5:2": "Want de dwaas brengt de toorn om, en de ijver doodt de eenvoudige.", "Num 11:11": "En Mozes zei tegen de HEERE: Waarom hebt U Uw knecht kwaad gedaan, en waarom heb ik geen genade in Uw ogen gevonden, dat U de last van dit hele volk op mij legt?", "Gen 31:41": "Ik ben nu twintig jaar in uw huis geweest; ik heb u veertien jaar gediend voor uw beide dochters, en zes jaar voor uw kudde; en u hebt mijn loon tien keer veranderd.", "Gen 46:18": "Dit zijn de zonen van Zilpa, die Laban aan zijn dochter Lea gegeven had; en zij baarde Jakob deze zestien zielen.", "Matt 4:13": "en Hij verliet Nazareth en ging wonen in Kapernaüm, dat aan de zee ligt, in het gebied van Zebulon en Nafthali;", "Deut 33:13-17": "En van Jozef zei hij: Zijn land zij gezegend van de HEERE, van het voortreffelijkste van de hemel, van de dauw, en van de diepte, die beneden ligt; En van de voortreffelijkste inkomsten van de zon, en van de voortreffelijkste voortzetting van de maan; En van het voornaamste van de oude bergen, en van het voortreffelijkste van de eeuwige heuvels;", "Gen 49:22-26": "Jozef is een vruchtbare tak, een vruchtbare tak aan een fontein; elk van de takken loopt over de muur. De schutters hebben hem wel bitterheid aangedaan, en op hem geschoten, en hem gehaat; Maar zijn boog is in stevigheid gebleven, en de armen van zijn handen zijn gesterkt, door de handen van de Machtige van Jakob; vandaar is hij een herder, een steen van Israël;", "Jer 13:24": "Daarom zal Ik hen verstrooien als een stoppel die wegwaait door een wind uit de woestijn.", "1 Sam 1:19": "En zij stonden 's morgens vroeg op, en zij aanbaden voor het aangezicht van de HEERE, en zij keerden terug, en kwamen bij hun huis te Rama. En Elkana had gemeenschap met zijn vrouw Hanna, en de HEERE dacht aan haar.", "Gen 31:8": "Wanneer hij zo zei: De gespikkelde zullen uw loon zijn, dan wierp de hele kudde gespikkelde jongen; en wanneer hij zo zei: De gestreepte zullen uw loon zijn, dan wierp de hele kudde gestreepte jongen.", "2 Sam 12:11": "Zo zegt de HEERE: Zie, Ik zal kwaad over u verwekken uit uw eigen huis, en Ik zal uw vrouwen nemen voor uw ogen, en zal ze aan uw naaste geven; die zal bij uw vrouwen liggen, voor de ogen van deze zon.", "Gen 29:27": "Maak de week van deze vol; dan zullen wij u ook die geven, voor de dienst die u nog zeven andere jaren bij mij dienen zult.", "Gen 49:21": "Nafthali is een losgelaten hinde; hij spreekt schone woorden.", "Gen 30:28-34": "Hij zei dan: Noem mij uitdrukkelijk uw loon, dat ik geven zal. Toen zei hij tegen hem: U weet hoe ik u gediend heb, en hoe uw vee bij mij geweest is. Want het weinige dat u voor mij had, is uitgebroken tot een menigte; en de HEERE heeft u gezegend bij mijn komst; nu dan, wanneer zal ik ook voor mijn eigen huis werken?", "Deut 33:20": "En van Gad zei hij: Gezegend zij hij die aan Gad ruimte maakt! hij woont als een oude leeuw, en verscheurt de arm, ja ook de schedel.", "1 Sam 1:20": "En het gebeurde, na verloop van dagen, dat Hanna zwanger werd, en een zoon baarde, en zij noemde zijn naam Samuël: Want, zei ze, ik heb hem van de HEERE gebeden.", "2 Sam 22:21": "De HEERE vergold mij naar mijn gerechtigheid; Hij gaf mij weer naar de reinheid van mijn handen.", "Job 3:1-3": "Daarna opende Job zijn mond, en vervloekte zijn dag. Want Job antwoordde en zei: De dag verga, waarop ik geboren ben, en de nacht waarin men zei: Een knechtje is ontvangen.", "Ps 107:41": "Maar Hij brengt de nooddruftige uit de verdrukking in een veilig verblijf, en maakt de huisgezinnen als kudden.", "Gen 29:30": "En hij kwam ook bij Rachel, en had ook Rachel liever dan Lea; en hij diende bij hem nog zeven andere jaren.", "Ps 37:6": "En Hij zal uw gerechtigheid doen voortkomen als het licht, en uw recht als de middag.", "Gen 31:1-21": "Toen hoorde hij de woorden van de zonen van Laban, die zeiden: Jakob heeft alles genomen wat van onze vader was, en van wat van onze vader was heeft hij al deze rijkdom gemaakt. Jakob zag ook het gezicht van Laban aan, en zie, het was tegenover hem niet als gisteren en eergisteren. En de HEERE zei tegen Jakob: Keer terug naar het land van uw vaderen, en naar uw familie, en Ik zal met u zijn.", "Gen 30:17-20": "En God verhoorde Lea; en zij werd zwanger, en baarde Jakob de vijfde zoon. Toen zei Lea: God heeft mij mijn loon gegeven, omdat ik mijn dienstmaagd aan mijn man gegeven heb; en zij noemde zijn naam Issaschar. En Lea werd opnieuw zwanger, en zij baarde Jakob de zesde zoon.", "Richt 5:14": "Uit Efraïm was hun wortel tegen Amalek. Achter u was Benjamin onder uw volken. Uit Machir zijn de wetgevers afgetrokken, en uit Zebulon, die trekken door de staf van de schrijver.", "Gen 21:1": "En de HEERE bezocht Sara, zoals Hij gezegd had; en de HEERE deed aan Sara, zoals Hij gesproken had."}, "noten": {}, "koppeling": {"1": "Toen <span class=\"wl\" data-l=\"L1\" data-code=\"H7354\">Rachel</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H7200\">zag</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H3588\">dat</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H3290\">zij</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H3290\">Jakob</span> geen kinderen gaf, <span class=\"wl\" data-l=\"L5\" data-code=\"H7065\">benijdde</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H7354\">Rachel</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H7354\">haar</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H269\">zuster</span>; <span class=\"wl\" data-l=\"L8\" data-code=\"H559\">en</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H559\">zij</span> zei tegen <span class=\"wl\" data-l=\"L9\" data-code=\"H3290\">Jakob</span>: <span class=\"wl\" data-l=\"L10\" data-code=\"H3051\">Geef</span> <span class=\"wl\" data-l=\"L11\" data-code=\"H1121\">mij</span> <span class=\"wl\" data-l=\"L11\" data-code=\"H1121\">kinderen</spa
