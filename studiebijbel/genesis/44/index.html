": "mattheus", "Mark": "markus", "Luk": "lukas", "Joh": "johannes", "Hand": "handelingen", "Rom": "romeinen", "1 Kor": "1-korinthe", "2 Kor": "2-korinthe", "Gal": "galaten", "Ef": "efeze", "Fil": "filippenzen", "Kol": "kolossenzen", "1 Tess": "1-thessalonicenzen", "2 Tess": "2-thessalonicenzen", "1 Tim": "1-timotheus", "2 Tim": "2-timotheus", "Tit": "titus", "Filem": "filemon", "Hebr": "hebreeen", "Jak": "jakobus", "1 Petr": "1-petrus", "2 Petr": "2-petrus", "1 Joh": "1-johannes", "2 Joh": "2-johannes", "3 Joh": "3-johannes", "Judas": "judas", "Openb": "openbaring"}}, "vertalingen": {"SVnu": {"1": "En hij gebood degene die over zijn huis ging, en zei: Vul de zakken van deze mannen met voedsel, zoveel als zij kunnen dragen, en leg ieders geld in de mond van zijn zak;", "2": "En mijn beker, de zilveren beker, moet u leggen in de mond van de zak van de jongste, met het geld van zijn koren. En hij deed naar Jozefs woord, dat hij gesproken had.", "3": "'s Morgens, toen het licht werd, liet men deze mannen vertrekken, hen en hun ezels.", "4": "Zij waren de stad uitgegaan; zij waren nog niet ver gekomen, toen Jozef tegen degene die over zijn huis ging, zei: Maak u op en jaag deze mannen achterna; en als u hen zult hebben ingehaald, moet u tegen hen zeggen: Waarom hebt u kwaad met goed vergolden?", "5": "Is dit niet dat waaruit mijn heer drinkt, en waarmee hij iets zeker zal waarnemen*? U hebt kwalijk gedaan met wat u gedaan hebt.", "6": "En hij haalde hen in, en sprak tegen hen diezelfde woorden.", "7": "En zij zeiden tegen hem: Waarom spreekt mijn heer zulke woorden? Het zij verre van uw knechten dat zij zoiets zouden doen.", "8": "Zie, het geld dat wij in de mond van onze zakken vonden, hebben wij uit het land Kanaän naar u teruggebracht; hoe zouden wij dan uit het huis van uw heer zilver of goud stelen?", "9": "Bij wie van uw knechten hij gevonden wordt, laat hem sterven; en ook wij zullen dan mijn heer tot slaven zijn!", "10": "En hij zei: Laat het nu ook zo zijn, naar uw woorden! Bij wie hij gevonden wordt, laat die mijn slaaf zijn; maar u zult onschuldig zijn.", "11": "En zij haastten zich, en ieder zette zijn zak af op de grond, en ieder opende zijn zak.", "12": "En hij doorzocht ze, beginnend bij de grootste en eindigend bij de kleinste; en de beker werd gevonden in de zak van Benjamin.", "13": "Toen scheurden zij hun kleren, en ieder man laadde zijn ezel weer op, en zij keerden terug naar de stad.", "14": "En Juda kwam met zijn broers in het huis van Jozef; want hij was daar nog zelf; en zij vielen voor zijn gezicht neer op de grond.", "15": "En Jozef zei tegen hen: Wat is dit voor daad die u gedaan hebt? Weet u niet dat zo'n man als ik zeker zoiets kan waarnemen?", "16": "Toen zei Juda: Wat zullen wij tegen mijn heer zeggen, wat zullen wij spreken, en hoe zullen wij ons rechtvaardigen? God heeft de ongerechtigheid van uw knechten aan het licht gebracht; zie, wij zijn slaven van mijn heer, zowel wij als hij bij wie de beker gevonden is.", "17": "Maar hij zei: Het zij verre van mij om zoiets te doen! De man bij wie de beker gevonden is, die zal mijn slaaf zijn; maar u, trek in vrede op naar uw vader.", "18": "Toen kwam Juda dichter bij hem, en zei: Och, mijn heer! Laat toch uw knecht een woord spreken voor de oren van mijn heer, en laat uw toorn tegen uw knecht niet ontsteken; want u bent gelijk aan Farao!", "19": "Mijn heer vroeg zijn knechten en zei: Hebt u een vader of broer?", "20": "Toen zeiden wij tegen mijn heer: Wij hebben een oude vader, en een jongen van het ouderdom, de kleinste, wiens broer dood is, en hij is alleen van zijn moeder overgebleven, en zijn vader heeft hem lief.", "21": "Toen zei u tegen uw knechten: Breng hem bij mij, opdat ik mijn oog op hem sla.", "22": "En wij zeiden tegen mijn heer: Die jongen kan zijn vader niet verlaten; als hij zijn vader verlaat, zal zijn vader sterven.", "23": "Toen zei u tegen uw knechten: Als uw kleinste broer niet met u meekomt, zult u mijn gezicht niet meer zien.", "24": "En het gebeurde, toen wij naar uw knecht, mijn vader, opgetrokken waren, dat wij hem de woorden van mijn heer verteld hebben;", "25": "En dat onze vader gezegd heeft: Ga terug, koop ons wat voedsel;", "26": "Toen hebben wij gezegd: Wij kunnen niet aftrekken; als onze kleinste broer bij ons is, zullen wij aftrekken; want wij mogen het gezicht van die man niet zien, als deze onze kleinste broer niet bij ons is.", "27": "Toen zei uw knecht, mijn vader, tegen ons: U weet dat mijn vrouw mij twee zonen gebaard heeft.", "28": "En de één is bij mij weggegaan, en ik heb gezegd: Voorzeker, hij is zeker verscheurd! En ik heb hem niet meer gezien tot nu toe.", "29": "Als u nu deze ook van mijn gezicht wegneemt, en hem een ongeluk overkomt, zult u mijn grijze haren met verdriet naar het graf doen afdalen!", "30": "Nu dan, als ik bij uw knecht, mijn vader, kom, en de jongen is niet bij ons (want zijn ziel is aan diens ziel gebonden),", "31": "Dan zal het gebeuren, als hij ziet dat de jongen er niet is, dat hij sterft; en uw knechten zullen de grijze haren van uw knecht, onze vader, met verdriet naar het graf doen afdalen.", "32": "Want uw knecht is borg gebleven voor deze jongen bij mijn vader, en zei: Als ik hem niet bij u terugbreng, zal ik alle dagen tegen mijn vader gezondigd hebben!", "33": "Nu dan, laat toch uw knecht in plaats van deze jongen als slaaf van mijn heer blijven, en laat de jongen met zijn broers optrekken!", "34": "Want hoe zou ik optrekken naar mijn vader, als de jongen niet bij mij was, zodat ik het verdriet niet hoef te zien dat mijn vader zou overkomen."}, "SV": {"1": "En hij gebood dengene, die over zijn huis was, zeggende: Vul de zakken dezer mannen met spijze, naar dat zij zullen kunnen dragen, en leg ieders mans geld in den mond van zijn zak;", "2": "En mijn beker, den zilveren beker, zult gij leggen in den mond van den zak des kleinsten, met het geld van zijn koren. En hij deed naar Jozefs woord, hetwelk hij gesproken had.", "3": "Des morgens, als het licht werd, zo liet men deze mannen trekken, hen en hun ezelen.", "4": "Zij zijn ter stad uitgegaan; zij waren niet verre gekomen, als Jozef tot dengene, die over zijn huis was, zeide: Maak u op, en jaag die mannen achterna; en als gij hen zult achterhaald hebben, zo zult gij tot hen zeggen: Waarom hebt gij kwaad voor goed vergolden?", "5": "Is het deze niet, waaruit mijn heer drinkt? en waarbij hij *iets* zekerlijk waarnemen zal? Gij hebt kwalijk gedaan, wat gij gedaan hebt.", "6": "En hij achterhaalde hen, en sprak tot hen diezelfde woorden.", "7": "En zij zeiden tot hem: Waarom spreekt mijn heer zulke woorden? Het zij verre van uw knechten, dat zij zodanig een ding doen zouden.", "8": "Zie, het geld, dat wij in den mond onzer zakken vonden, hebben wij tot u uit het land Kanaän wedergebracht; hoe zouden wij dan uit het huis uws heren zilver of goud stelen?", "9": "Bij wien van uw knechten hij gevonden zal worden, dat hij sterve; en ook zullen wij mijn heer tot slaven zijn!", "10": "En hij zeide: Dit zij nu ook alzo, naar uw woorden! Bij wien hij gevonden wordt, die zij mijn slaaf; maar gijlieden zult onschuldig zijn.", "11": "En zij haastten, en iegelijk zette zijn zak af op de aarde, en iegelijk opende zijn zak.", "12": "En hij doorzocht, beginnende met den grootste, en voleindigende met den kleinste; en die beker werd gevonden in den zak van Benjamin.", "13": "Toen scheurden zij hun klederen; en ieder man laadde zijn ezel op, en zij keerden weder naar de stad.", "14": "En Juda kwam met zijn broederen in het huis van Jozef; want hij was nog zelf aldaar; en zij vielen voor zijn aangezicht neder ter aarde.", "15": "En Jozef zeide tot hen: Wat daad is dit, die gij gedaan hebt? Weet gij niet, dat zulk een man als ik *dat* zekerlijk waarnemen zoude?", "16": "Toen zeide Juda: Wat zullen wij tot mijn heer zeggen, wat zullen wij spreken, en wat zullen wij ons rechtvaardigen? God heeft de ongerechtigheid uwer knechten gevonden; zie, wij zijn mijns heren slaven, zo wij, als hij, in wiens hand de beker gevonden is.", "17": "Maar hij zeide: Het zij verre van mij zulks te doen! de man, in wiens hand de beker gevonden is, die zal mijn slaaf zijn; doch trekt gijlieden op in vrede tot uw vader.", "18": "Toen naderde Juda tot hem, en zeide: Och, mijn heer! laat toch uw knecht een woord spreken voor mijns heren oren, en laat uw toorn tegen uw knecht niet ontsteken; want gij zijt even gelijk Farao!", "19": "Mijn heer vraagde zijn knechten, zeggende: Hebt gijlieden een vader, of broeder?", "20": "Zo zeiden wij tot mijn heer: Wij hebben een ouden vader, en een jongeling des ouderdoms, den kleinsten, wiens broeder dood is, en hij is alleen van zijn moeder overgebleven, en zijn vader heeft hem lief.", "21": "Toen zeidet gij tot uw knechten: Brengt hem af tot mij, dat ik mijn oog op hem sla.", "22": "En wij zeiden tot mijn heer: Die jongeling zal zijn vader niet kunnen verlaten; indien hij zijn vader verlaat, zo zal hij sterven.", "23": "Toen zeidet gij tot uw knechten: Indien uw kleinste broeder met u niet afkomt, zo zult gij mijn aangezicht niet meer zien.", "24": "En het is geschied, als wij tot uw knecht, mijn vader, opgetrokken zijn, en wij hem de woorden mijns heren verhaald hebben;", "25": "En dat onze vader gezegd heeft: Keert weder. koopt ons een weinig spijze;", "26": "Zo hebben wij gezegd: Wij zullen niet mogen aftrekken; indien onze kleinste broeder bij ons is, zo zullen wij aftrekken; want wij zullen het aangezicht van dien man niet mogen zien, zo deze onze kleinste broeder niet bij ons is.", "27": "Toen zeide uw knecht, mijn vader, tot ons: Gijlieden weet, dat mijn huisvrouw er mij twee gebaard heeft.", "28": "En de een is van mij uitgegaan, en ik heb gezegd: Voorwaar, hij is gewisselijk verscheurd geworden! en ik heb hem niet gezien tot nu toe.", "29": "Indien gij nu dezen ook van mijn aangezicht wegneemt, en hem een verderf ontmoette, zo zoudt gij mijn grauwe haren met jammer ten grave doen nederdalen!", "30": "Nu dan, als ik tot uw knecht, mijn vader, kome, en de jongeling is niet bij ons (alzo zijn ziel aan de ziel van dezen gebonden is),", "31": "Zo zal het geschieden, als hij ziet, dat de jongeling er niet is, dat hij sterven zal; en uw knechten zullen de grauwe haren van uw knecht, onzen vader, met droefenis ten grave doen nederdalen.", "32": "Want uw knecht is voor deze jongeling borg bij mijn vader, zeggende: Zo ik hem tot u niet wederbreng, zo zal ik tegen mijn vader alle dagen gezondigd hebben!", "33": "Nu dan, laat toch uw knecht voor dezen jongeling slaaf van mijn heer blijven, en laat den jongeling met zijn broederen optrekken!", "34": "Want hoe zoude ik optrekken tot mijn vader, indien de jongeling niet met mij was, opdat ik den jammer niet zie, welke mijn vader overkomen zou."}, "KJV": {"1": "And he commanded the steward of his house, saying, Fill the men's sacks *with* food, as much as they can carry, and put every man's money in his sack's mouth.", "2": "And put my cup, the silver cup, in the sack's mouth of the youngest, and his corn money. And he did according to the word that Joseph had spoken.", "3": "As soon as the morning was light, the men were sent away, they and their asses.", "4": "*And* when they were gone out of the city, *and* not *yet* far off, Joseph said unto his steward, Up, follow after the men; and when thou dost overtake them, say unto them, Wherefore have ye rewarded evil for good?", "5": "*Is* not this *it* in which my lord drinketh, and whereby indeed he divineth? ye have done evil in so doing.", "6": "And he overtook them, and he spake unto them these same words.", "7": "And they said unto him, Wherefore saith my lord these words? God forbid that thy servants should do according to this thing:", "8": "Behold, the money, which we found in our sacks' mouths, we brought again unto thee out of the land of Canaan: how then should we steal out of thy lord's house silver or gold?", "9": "With whomsoever of thy servants it be found, both let him die, and we also will be my lord's bondmen.", "10": "And he said, Now also *let* it *be* according unto your words: he with whom it is found shall be my servant; and ye shall be blameless.", "11": "Then they speedily took down every man his sack to the ground, and opened every man his sack.", "12": "And he searched, *and* began at the eldest, and left at the youngest: and the cup was found in Benjamin's sack.", "13": "Then they rent their clothes, and laded every man his ass, and returned to the city.", "14": "And Judah and his brethren came to Joseph's house; for he *was* yet there: and they fell before him on the ground.", "15": "And Joseph said unto them, What deed *is* this that ye have done? wot ye not that such a man as I can certainly divine?", "16": "And Judah said, What shall we say unto my lord? what shall we speak? or how shall we clear ourselves? God hath found out the iniquity of thy servants: behold, we *are* my lord's servants, both we, and *he* also with whom the cup is found.", "17": "And he said, God forbid that I should do so: *but* the man in whose hand the cup is found, he shall be my servant; and as for you, get you up in peace unto your father.", "18": "Then Judah came near unto him, and said, Oh my lord, let thy servant, I pray thee, speak a word in my lord's ears, and let not thine anger burn against thy servant: for thou *art* even as Pharaoh.", "19": "My lord asked his servants, saying, Have ye a father, or a brother?", "20": "And we said unto my lord, We have a father, an old man, and a child of his old age, a little one; and his brother is dead, and he alone is left of his mother, and his father loveth", "21": "And thou saidst unto thy servants, Bring him down unto me, that I may set mine eyes", "22": "And we said unto my lord, The lad cannot leave his father: for *if* he should leave his father, *his father* would die.", "23": "And thou saidst unto thy servants, Except your youngest brother come down with you, ye shall see my face no more.", "24": "And it came to pass when we came up unto thy servant my father, we told him the words of my lord.", "25": "And our father said, Go again, *and* buy us a little food.", "26": "And we said, We cannot go down: if our youngest brother be with us, then will we go down: for we may not see the man's face, except our youngest brother", "27": "And thy servant my father said unto us, Ye know that my wife bare me two", "28": "And the one went out from me, and I said, Surely he is torn in pieces; and I saw him not since:", "29": "And if ye take this also from me, and mischief befall him, ye shall bring down my gray hairs with sorrow to the grave.", "30": "Now therefore when I come to thy servant my father, and the lad *be* not with us; seeing that his life is bound up in the lad's life;", "31": "It shall come to pass, when he seeth that the lad *is* not *with us*, that he will die: and thy servants shall bring down the gray hairs of thy servant our father with sorrow to the grave.", "32": "For thy servant became surety for the lad unto my father, saying, If I bring him not unto thee, then I shall bear the blame to my father for ever.", "33": "Now therefore, I pray thee, let thy servant abide instead of the lad a bondman to my lord; and let the lad go up with his brethren.", "34": "For how shall I go up to my father, and the lad *be* not with me? lest peradventure I see the evil that shall come on my father."}}, "tsk": {"1": [{"kopje": "degene die over zijn huis ging", "refs": ["Gen 24:2", "Gen 43:16", "Gen 43:19"]}, {"kopje": "Vul de", "refs": ["Gen 42:25", "Gen 43:2", "Jes 3:1"]}], "4": [{"kopje": "Maak u op", "refs": ["Deut 2:16"]}, {"kopje": "Waarom", "refs": ["1 Sam 24:18", "2 Kron 20:11", "Ps 35:12", "Ps 109:5", "Spr 17:13", "Joh 10:32"]}], "5": [{"kopje": "waarnemen", "refs": ["Gen 44:15", "Gen 30:27", "Lev 19:26", "1 Kon 20:33", "2 Kon 21:6"]}], "8": [{"kopje": "het geld", "refs": ["Gen 42:21", "Gen 42:27", "Gen 42:35", "Gen 43:12", "Gen 43:21", "Gen 43:22"]}, {"kopje": jn ziel is verzadigd van tegenspoed, en mijn leven raakt tot aan het graf.", "Gen 37:32": "En zij zonden de veelkleurige rok en lieten hem naar hun vader brengen, en zeiden: Dit hebben wij gevonden; herken toch of dit de rok van uw zoon is, of niet.", "Jer 32:44": "Velden zal men voor geld kopen, en de brieven ondertekenen en verzegelen, en getuigen doen bevestigen, in het land van Benjamin, en in de plaatsen rondom Jeruzalem, en in de steden van Juda, en in de steden van het gebergte, en in de steden van de laagvlakte, en in de steden van het zuiden; want Ik zal hun gevangenschap ten goede keren, spreekt de HEERE.", "Hoogl 8:6": "Zet mij als een zegel op Uw hart, als een zegel op Uw arm; want de liefde is sterk als de dood; de ijver is hard als het graf; haar kolen zijn vurige kolen, vlammen van de Heere.", "Ps 49:16": "Maar God zal mijn ziel uit de macht van het graf verlossen, want Hij zal mij opnemen. Sela.", "Jer 41:5": "Zo kwamen er mannen van Sichem, van Silo, en van Samaria, tachtig man, met de baard afgeschoren, en de kleren gescheurd, en zichzelf gesneden; en spijsoffer en wierook waren in hun hand, om naar het huis van de HEERE te brengen.", "Gen 24:2": "Zo zei Abraham tegen zijn knecht, de oudste van zijn huis, die over alles regeerde wat hij had: Leg toch uw hand onder mijn heup,", "Gen 18:30": "Verder zei hij: Laat de Heere toch niet boos worden, dat ik spreek; misschien zullen daar dertig gevonden worden! En Hij zei: Ik zal het niet doen, als Ik daar dertig zal vinden.", "Gen 37:9": "En hij droomde nog een andere droom en vertelde die aan zijn broers; en hij zei: Zie, ik heb nog een droom gedroomd, en zie, de zon, de maan en elf sterren bogen zich voor mij neer.", "Gen 37:19": "En zij zeiden de een tegen de ander: Zie, daar komt die meesterdromer aan!", "Num 3:48-51": "En u zult dat geld aan Aäron en zijn zonen geven, het geld van de gelosten die onder hen overschieten. Toen nam Mozes dat losgeld van degenen, die overschoten boven de gelosten door de Levieten. Van de eerstgeborenen van de kinderen van Israël nam hij dat geld, duizend driehonderdvijfenzestig sikkels, naar de sikkel van het heiligdom.", "1 Kon 2:6": "Doe dan naar uw wijsheid, en laat zijn grijze hoofd niet in vrede naar het graf afdalen.", "Gen 42:22": "En Ruben antwoordde hun en zei: Heb ik het niet tegen u gezegd toen ik zei: Zondig niet tegen deze jongen! Maar u hoorde niet; en ook zijn bloed, zie, het wordt opgeëist!", "Ezra 9:3": "Toen ik deze zaak hoorde, scheurde ik mijn kleed en mijn mantel; en ik trok het haar van mijn hoofd en van mijn baard uit, en zat verbaasd neer.", "Ex 21:11": "En als hij haar deze drie dingen niet doet, zal zij om niet uitgaan, zonder geld.", "Mark 14:11": "En zij, die dit hoorden, waren verblijd, en beloofden hem geld te geven; en hij zocht hoe hij Hem op een geschikt moment kon overleveren.", "Lev 27:15": "En als hij die het geheiligd heeft, zijn huis wil afkopen, dan zal hij een vijfde deel van het geld van uw schatting daarboven toevoegen, en het zal zijn eigendom zijn.", "Jes 60:9": "Want de eilanden zullen Mij verwachten, en de schepen van Tarsis vooreerst, om uw kinderen van verre te brengen, hun zilver en hun goud met hen, tot de Naam van de HEERE, uw God, en tot de Heilige van Israël, omdat Hij u heerlijk gemaakt heeft.", "Luk 19:23": "Waarom hebt u dan mijn geld niet bij de bank gebracht, zodat ik het bij mijn komst met rente had kunnen opeisen?", "1 Sam 22:22": "Toen zei David tegen Abjathar: Ik wist het al op die dag, toen Doeg, de Edomiet, daar was, dat hij het zeker aan Saul zou vertellen; ik heb er de oorzaak van gegeven tegen alle mensen van het huis van uw vader.", "Num 14:6": "En Jozua, de zoon van Nun, en Kaleb, de zoon van Jefunne, die bij hen waren die dat land verspied hadden, scheurden hun kleren.", "Gen 43:8": "Toen zei Juda tegen Israël, zijn vader: Stuur de jongeman met mij mee, dan zullen wij ons opmaken en op reis gaan, opdat wij leven en niet sterven, wij niet, u niet, en ook onze kinderen niet.", "Matt 10:9": "Verkrijgt u geen goud, geen zilver, geen koperen geld in uw gordels;", "Hand 14:14": "Maar toen de apostelen Barnabas en Paulus dit hoorden, scheurden zij hun kleren, en sprongen onder de menigte, en riepen:", "Deut 14:25": "Zo maak het tot geld, en bind het geld in uw hand, en ga naar de plaats die de HEERE, uw God, zal uitkiezen;", "Gen 42:20": "En breng uw jongste broer tot mij, zo zullen uw woorden bevestigd worden; en u zult niet sterven. En zij deden zo.", "Jes 36:22": "Toen kwam Eljakim, de zoon van Hilkia, de hofmeester, en Sebna, de schrijver, en Joah, de zoon van Asaf, de kanselier, naar Hizkia met gescheurde kleren; en zij vertelden hem de woorden van Rabsake.", "Gen 39:8": "Maar hij weigerde het, en zei tegen de vrouw van zijn heer: Zie, mijn heer weet niet, met mij hier, wat er in het huis is; en alles wat hij heeft, heeft hij in mijn hand gegeven.", "Ps 30:4": "HEERE! U hebt mijn ziel uit het graf opgevoerd; U hebt mij bij het leven behouden, zodat ik niet in de kuil neerdaalde.", "Job 31:29": "Als ik verblijd ben geweest in de verdrukking van mijn haters, en mij opgewekt heb, als het kwaad hem vond;", "Jes 55:1": "O, alle dorstigen, kom tot de wateren, en u die geen geld heeft, kom, koop en eet, ja kom, koop zonder geld en zonder prijs, wijn en melk!", "1 Petr 1:18": "want u weet dat u niet met vergankelijke dingen, zilver of goud, verlost bent uit uw zinloze levenswandel, die u van uw voorouders had overgeërfd,", "Gen 18:32": "Nog zei hij: Laat de Heere toch niet boos worden, dat ik alleen deze keer nog spreek: misschien zullen er tien gevonden worden. En Hij zei: Ik zal haar niet verwoesten omwille van de tien.", "Gen 43:25": "En zij maakten het geschenk gereed, totdat Jozef kwam op de middag; want zij hadden gehoord dat zij daar brood zouden eten.", "Dan 3:19-23": "Toen werd Nebukadnezar vervuld van woede, en de uitdrukking van zijn gezicht veranderde tegen Sadrach, Mesach en Abed-nego; hij antwoordde en zei, dat men de oven zeven keer heter moest maken dan men die gewoonlijk heet maakte. En tegen de sterkste mannen van zijn leger zei hij dat zij Sadrach, Mesach en Abed-nego moesten binden, om hen te werpen in de brandende vuuroven. Toen werden die mannen gebonden in hun mantels, hun broeken, hun hoeden, en hun andere kleren, en zij wierpen hen in het midden van de brandende vuuroven.", "Ezra 7:17": "opdat u spoedig voor dat geld runderen, rammen, lammeren koopt, met hun spijsoffers, en hun drankoffers, en die offert op het altaar van het huis van uw God, dat te Jeruzalem is.", "Hand 8:20": "Maar Petrus zei tegen hem: Laat uw geld met u verloren gaan, omdat u gemeend hebt dat de gave van God door geld verkregen wordt!", "2 Kon 6:30": "En het gebeurde, toen de koning de woorden van deze vrouw gehoord had, dat hij zijn kleren scheurde, terwijl hij over de muur voortging; en het volk zag dat er, zie, een zak van binnen over zijn vlees was.", "Gen 37:14": "En hij zei tegen hem: Ga toch heen, zie naar het welzijn van uw broers en naar het welzijn van de kudde, en breng mij een woord terug. Zo zond hij hem uit het dal Hebron, en hij kwam te Sichem.", "Gen 47:14-18": "Toen verzamelde Jozef al het geld dat in Egypteland en in het land Kanaän gevonden werd, voor het koren dat zij kochten; en Jozef bracht dat geld in het huis van Farao. Toen het geld uit Egypteland en uit het land Kanaän op was, kwamen alle Egyptenaren naar Jozef en zeiden: Geef ons brood; want waarom zouden wij in uw bijzijn sterven? Want het geld is op. En Jozef zei: Geef uw vee, dan zal ik u brood geven voor uw vee, als het geld op is.", "1 Kon 21:2": "Achab sprak tot Naboth en zei: Geef mij uw wijngaard, opdat hij mij tot een kruidhof zij, omdat hij dicht bij mijn huis is; en ik zal u ervoor een wijngaard geven die beter is dan die; of, als het goed is in uw ogen, zal ik u de waarde ervan in geld geven.", "Jes 13:17": "Zie, Ik zal de Meden tegen hen opwekken, die het zilver niet zullen achten, en aan het goud zullen zij geen lust hebben.", "Deut 25:1": "Wanneer er tussen mannen twist is, en zij naar het gerecht gaan zodat men hen recht spreekt, dan zal men de rechtvaardige rechtvaardig verklaren, en de onrechtvaardige veroordelen.", "Matt 28:15": "En zij namen het geld, en deden zoals hun geleerd was. En dit verhaal is onder de Joden verspreid geraakt tot op deze huidige dag.", "Gen 43:33": "En zij zaten voor zijn gezicht, de eerstgeborene naar zijn eerstgeboorterecht, en de jongere naar zijn jeugd; zodat de mannen zich onder elkaar verwonderden.", "Gen 42:15": "Hierin zult u beproefd worden: zo waar als Farao leeft! Als u van hier zult weggaan, tenzij uw jongste broer hierheen gekomen zal zijn!", "Ps 119:143": "Benauwdheid en angst hebben mij getroffen, doch Uw geboden zijn mijn vermakingen.", "Luk 7:12": "En toen Hij de poort van de stad naderde, zie, er werd een dode uitgedragen, de enige zoon van zijn moeder, en zij was weduwe; en een grote menigte uit de stad was bij haar.", "Ex 22:7": "Wanneer iemand aan zijn naaste geld of voorwerpen geeft om te bewaren, en het wordt uit het huis van die man gestolen, en de dief wordt gevonden, dan moet hij het dubbel teruggeven.", "Richt 5:19": "De koningen kwamen, zij streden; toen streden de koningen van Kanaän, te Thaanach aan het water van Megiddo; zij brachten geen winst van het zilver daarvan.", "Gen 43:15-22": "En die mannen namen dat geschenk, en namen dubbel geld in hun hand, en Benjamin; en zij maakten zich op, en trokken af naar Egypte, en zij stonden voor Jozefs gezicht. Toen Jozef Benjamin bij hen zag, zei hij tegen hem die over zijn huis was: Breng deze mannen naar het huis, en slacht slachtvee, en maak het gereed; want deze mannen zullen 's middags met mij eten. De man deed zoals Jozef gezegd had; en de man bracht deze mannen in het huis van Jozef.", "Spr 17:15": "Wie de goddeloze rechtvaardigt, en de rechtvaardige veroordeelt, zijn de HEERE een gruwel, zij beiden.", "Hand 7:16": "En zij werden overgebracht naar Sichem, en gelegd in het graf, dat Abraham gekocht had voor een som geld, van de zonen van Hemor, de vader van Sichem.", "Gen 42:27": "Toen één zijn zak opendeed om zijn ezel voer te geven in de herberg, zag hij zijn geld; want zie, het was in de opening van zijn zak.", "1 Sam 2:33": "Doch de man die Ik u niet zal uitroeien van Mijn altaar, zou zijn om uw ogen te verteren, en om uw ziel te bedroeven; en alle nakomelingen van uw huis zullen sterven als zij mannen geworden zijn.", "1 Kon 21:6": "En hij zei tegen haar: Omdat ik tot Naboth, de Jizreëliet, gesproken heb en tegen hem gezegd heb: Geef mij uw wijngaard voor geld, of, als het u zint, zal ik u een andere wijngaard in zijn plaats geven; maar hij heeft gezegd: Ik zal u mijn wijngaard niet geven.", "Gen 43:14": "En God, de Almachtige, geve u barmhartigheid bij die man, dat hij uw andere broer en Benjamin met u laat teruggaan! En wat mij aangaat, als ik van mijn kinderen beroofd word, dan ben ik maar beroofd!", "Gen 42:38": "Maar hij zei: Mijn zoon zal niet met u meegaan; want zijn broer is dood, en hij is alleen overgebleven; als hem een ongeluk zou overkomen op de weg die u zult gaan, dan zou u mijn grijze haren met verdriet naar het graf doen afdalen.", "Matt 25:18": "Maar hij die het ene ontvangen had, ging weg en groef in de aarde, en verborg het geld van zijn heer.", "Ezech 28:4": "Door uw wijsheid en door uw verstand hebt u vermogen voor uzelf verkregen; ja, u hebt goud en zilver verkregen in uw schatten.", "Gen 42:36-38": "Toen zei Jakob, hun vader, tegen hen: U berooft mij van kinderen! Jozef is er niet meer, en Simeon is er niet meer; nu wilt u Benjamin wegnemen! Al deze dingen zijn tegen mij! Toen sprak Ruben tegen zijn vader en zei: Dood twee van mijn zonen, als ik hem niet bij u terugbreng; geef hem in mijn hand, en ik zal hem weer bij u terugbrengen! Maar hij zei: Mijn zoon zal niet met u meegaan; want zijn broer is dood, en hij is alleen overgebleven; als hem een ongeluk zou overkomen op de weg die u zult gaan, dan zou u mijn grijze haren met verdriet naar het graf doen afdalen.", "Matt 28:12": "En zij kwamen samen met de oudsten, en namen samen een besluit, en gaven de soldaten veel geld,", "2 Sam 13:37": "(Absalom nu vluchtte, en ging naar Thalmai, de zoon van Ammihur, koning van Gesur.) En hij droeg rouw over zijn zoon, al die dagen.", "Ex 12:44": "Doch elke knecht van iemand, die voor geld gekocht is, nadat u hem besneden zult hebben, dan mag hij daarvan eten.", "Gen 24:35": "en de HEERE heeft mijn heer zeer gezegend, zodat hij groot geworden is; en Hij heeft hem gegeven schapen, en runderen, en zilver, en goud, en knechten, en dienstmeisjes, en kamelen, en ezels.", "Ex 32:32": "Nu dan, als Gij hun zonde wilt vergeven! Maar zo niet, delg mij dan nu uit Uw boek, dat Gij geschreven hebt.", "Lev 27:18": "Maar als hij zijn akker na het jubeljaar geheiligd heeft, dan zal de priester hem het geld berekenen naar de jaren die nog overblijven tot het jubeljaar, en het zal van uw schatting afgetrokken worden.", "Hand 2:37": "En toen zij dit hoorden, werden zij diep in het hart getroffen, en zeiden tegen Petrus en de andere apostelen: Wat moeten wij doen, mannen broeders?", "Jer 52:10": "En de koning van Babel slachtte de zonen van Zedekia voor zijn ogen; en hij slachtte ook al de vorsten van Juda te Ribla.", "Gen 31:15": "Worden wij niet door hem als vreemden beschouwd? Want hij heeft ons verkocht, en hij heeft ook steeds ons geld verteerd.", "Est 1:12": "Maar de koningin Vasthi weigerde te komen op het woord van de koning, dat door de kamerlingen aan haar was overgebracht. Toen werd de koning zeer boos, en zijn woede laaide in hem op.", "Ex 22:26": "Als u de mantel van uw naaste als onderpand neemt, moet u die aan hem teruggeven voordat de zon ondergaat;", "Job 39:37": "Zie, ik ben te gering; wat zou ik U antwoorden? Ik leg mijn hand op mijn mond.", "Jer 40:4": "Nu dan, zie, ik heb u vandaag losgemaakt van de ketenen die aan uw hand waren; als het goed is in uw ogen om met mij naar Babel te komen, kom dan, en ik zal mijn oog op u stellen; maar als het kwaad is in uw ogen om met mij naar Babel te komen, laat het dan; zie, het hele land is voor uw aangezicht; waarheen het goed en recht in uw ogen is te gaan, ga daar.", "Lev 22:11": "Maar wanneer de priester een mens met zijn geld gekocht zal hebben, die zal daarvan eten; en wie in zijn huis geboren is, die zullen van zijn voedsel eten.", "Gen 43:2": "Zo gebeurde het, toen zij het voedsel, dat zij uit Egypte gebracht hadden, opgegeten hadden, dat hun vader tegen hen zei: Ga opnieuw, koop ons een weinig voedsel.", "Jer 40:5": "En omdat hij nog niet zal terugkeren, keer u dan terug tot Gedalia, de zoon van Ahikam, de zoon van Safan, die de koning van Babel over de steden van Juda aangesteld heeft; en woon bij hem in het midden van het volk; of ga overal waar het in uw ogen recht is te gaan. En de aanvoerder van de lijfwacht gaf hem reiskost en een geschenk, en liet hem gaan.", "Gen 37:33": "En hij herkende hem en zei: Het is de rok van mijn zoon! Een wild dier heeft hem opgegeten! Jozef is voorzeker verscheurd!", "Gen 42:35": "En het gebeurde, toen zij hun zakken leegden, zie, dat ieder de bundel van zijn geld in zijn zak had; en zij zagen de bundels van hun geld, zij en hun vader, en zij werden bang.", "1 Joh 3:16": "Hieraan hebben wij de liefde gekend, dat Hij Zijn leven voor ons gesteld heeft; en wij zijn schuldig het leven te stellen voor de broeders.", "Gen 13:2": "En Abram was zeer rijk, in vee, in zilver, en in goud.", "Jes 52:3": "Want zo zegt de HEERE: U bent voor niets verkocht, u zult ook zonder geld vrijgekocht worden.", "Spr 6:1-5": "Mijn zoon! Als u voor uw naaste borg geworden bent, voor een vreemde uw hand toegeklapt hebt; dan bent u verstrikt door de woorden van uw mond, dan bent u gevangen door de woorden van uw mond. Doe dan dit, mijn zoon! En red uzelf, omdat u in de hand van uw naaste gekomen bent; ga, verneder uzelf en dring aan bij uw naaste.", "2 Kon 22:9": "Daarna kwam Safan, de schrijver, bij de koning, en bracht de koning verslag terug, en hij zei: Uw dienaren hebben het geld dat in het huis gevonden was bij elkaar gebracht, en hebben het gegeven in de hand van de opzichters van het werk, die aangesteld waren over het huis van de HEERE.", "Gen 42:18": "En op de derde dag zei Jozef tegen hen: Doe dit, dan zult u leven; ik vrees God.", "Gen 17:13": "Degene die in uw huis geboren is, en degene die met uw geld gekocht is, zal zeker besneden worden; en Mijn verbond zal in uw vlees zijn, tot een eeuwig verbond.", "Job 24:19": "De droogte alsook de hitte nemen de sneeuwwateren weg; zo neemt het graf hen weg die gezondigd hebben.", "2 Sam 13:31": "Toen stond de koning op, en scheurde zijn kleren, en ging op de grond liggen; en al zijn knechten stonden erbij met gescheurde kleren.", "Gen 18:25": "Het zij verre van U, zoiets te doen, de rechtvaardige te doden met de goddeloze! zodat de rechtvaardige zou zijn als de goddeloze, verre zij het van U! zou de Rechter van de hele aarde geen recht doen?", "Gen 3:13": "En de HEERE God zei tegen de vrouw: Wat is dit dat u gedaan hebt? En de vrouw zei: De slang heeft mij bedrogen, en ik heb gegeten.", "Richt 1:7": "Toen zei Adoni-bezek: Zeventig koningen, van wie de duimen van hun handen en voeten waren afgehouwen, verzamelden de kruimen onder mijn tafel; zoals ik gedaan heb, zo heeft God mij vergolden! En zij brachten hem naar Jeruzalem, en hij stierf daar.", "Hos 13:14": "Toch zal Ik hen verlossen van de macht van het graf, Ik zal hen vrijmaken van de dood: o dood, waar zijn uw pestilentiën? Graf, waar is uw verderf? Berouw zal voor Mijn ogen verborgen zijn,", "Gen 37:7": "En zie, wij waren schoven aan het binden in het midden van het veld; en zie, mijn schoof stond op en bleef ook staande; en zie, uw schoven kwamen eromheen staan en bogen zich neer voor mijn schoof.", "Job 21:13": "In het goede verslijten zij hun dagen; en in een ogenblik dalen zij af in het graf.", "2 Sam 1:2": "dat het op de derde dag gebeurde dat er, kijk, uit het leger van Saul een man kwam, wiens kleren gescheurd waren, en aarde was op zijn hoofd; en het gebeurde, toen hij bij David kwam, dat hij ter aarde viel en zich neerboog.", "Gen 42:36": "Toen zei Jakob, hun vader, tegen hen: U berooft mij van kinderen! Jozef is er niet meer, en Simeon is er niet meer; nu wilt u Benjamin wegnemen! Al deze dingen zijn tegen mij!", "Spr 17:18": "Een mens zonder verstand slaat de hand erop, en stelt zich borg bij zijn naaste.", "Hand 2:29": "Mannen broeders, ik mag vrijuit tegen u spreken over de aartsvader David: hij is zowel gestorven als begraven, en zijn graf is bij ons tot op deze dag.", "Gen 42:29-34": "En zij kwamen in het land Kanaän, bij Jakob, hun vader; en zij vertelden hem alles wat hun overkomen was, en zeiden: Die man, de heer van dat land, heeft hard met ons gesproken; en hij heeft ons gehouden voor verspieders van het land. Maar wij zeiden tegen hem: Wij zijn eerlijke mensen; wij zijn geen verspieders.", "Ex 32:22": "Toen zei Aäron: De toorn van mijn heer ontsteekt niet! U kent dit volk, dat het geneigd is tot het kwade.", "Spr 20:16": "Als iemand borg geworden is voor een vreemde, neem zijn kleed; en pand hem voor de onbekenden.", "Job 17:13": "Als ik wacht, het graf zal mijn huis wezen; in de duisternis zal ik mijn bed spreiden.", "1 Sam 4:17": "Toen antwoordde de brenger van de boodschap en zei: Israël is gevlucht voor de Filistijnen, en er is ook een grote nederlaag onder het volk gebeurd; bovendien zijn uw twee zonen, Hofni en Pinehas, gestorven, en de ark van God is genomen.", "Spr 11:15": "Als iemand voor een vreemde borg geworden is, zal hij zeker daarvoor lijden; maar wie ervoor terugdeinst om vast toe te slaan, is zeker van zichzelf.", "Est 8:6": "Want hoe zou ik het kunnen verdragen dat ik het kwaad aanzie, dat mijn volk zal treffen? En hoe zou ik het kunnen verdragen dat ik het verderf van mijn geslacht aanzie?", "Luk 22:5": "En zij waren blij, en zijn het eens geworden dat zij hem geld zouden geven.", "Micha 3:11": "Haar hoofden rechtspreken om geschenken, en haar priesters leren om loon, en haar profeten waarzeggen om geld; nog steunen zij op de HEERE, en zeggen: Is de HEERE niet in ons midden? Ons zal geen kwaad overkomen.", "2 Kon 23:35": "En Jojakim gaf dat zilver en dat goud aan Farao; doch hij belastte het land, om dat geld naar het bevel van Farao te geven; ieder naar zijn aanslag eiste hij het zilver en goud af van het volk van het land, om aan Farao Necho te geven.", "Gen 43:18": "Toen werden deze mannen bang, omdat zij in het huis van Jozef gebracht werden, en zeiden: Vanwege het geld, dat in het begin in onze zakken teruggekeerd is, worden wij binnengebracht, opdat hij ons overvalt en op ons afkomt, en ons tot slaven neemt, met onze ezels.", "Ex 32:1": "Toen het volk zag dat Mozes lang wegbleef om van de berg af te komen, verzamelde het volk zich bij Aäron, en zij zeiden tegen hem: Sta op, maak ons goden, die voor ons uit gaan; want van deze Mozes, die man die ons uit Egypteland heeft weggeleid, weten wij niet wat er van hem geworden is.", "Joz 7:1": "Maar de kinderen van Israël overtraden door overtreding met het verbannene; want Achan, de zoon van Charmi, de zoon van Zabdi, de zoon van Zerah, uit de stam van Juda, nam van het verbannene. Toen ontstak de toorn van de HEERE tegen de kinderen van Israël.", "Gen 31:32": "Bij wie u uw goden vindt, laat die niet leven! Onderzoek voor onze broeders wat bij mij is, en neem het tot u. Want Jakob wist niet dat Rachel ze gestolen had.", "Joh 10:32": "Jezus antwoordde hun: Ik heb u veel goede werken getoond van Mijn Vader; om welk van die werken stenigt u Mij?", "2 Kron 34:9": "En zij kwamen bij Hilkia, de hogepriester, en zij gaven hem het geld dat naar het huis van God gebracht was, dat de Levieten die de drempel bewaakten, verzameld hadden uit de hand van Manasse en Efraïm, en uit heel het overblijfsel van Israël, en uit heel Juda en Benjamin, en waarmee zij naar Jeruzalem waren teruggekomen.", "Ps 141:7": "Onze beenderen zijn verstrooid bij de mond van het graf, zoals wanneer iemand op de aarde iets kloofde en verdeelde.", "Gen 37:28": "Toen nu de Midianitische kooplieden voorbijtrokken, trokken en hesen zij Jozef op uit de kuil, en verkochten Jozef aan deze Ismaëlieten voor twintig zilverstukken; die brachten Jozef naar Egypte.", "Job 1:20": "Toen stond Job op, en scheurde zijn mantel, en schoor zijn hoofd, en viel op de aarde, en boog zich neer;", "Gen 43:19": "Daarom naderden zij tot hem die over het huis van Jozef was, en zij spraken tegen hem bij de deur van het huis.", "Gen 43:16": "Toen Jozef Benjamin bij hen zag, zei hij tegen hem die over zijn huis was: Breng deze mannen naar het huis, en slacht slachtvee, en maak het gereed; want deze mannen zullen 's middags met mij eten.", "Gen 43:1-10": "De honger werd zwaar in dat land; Zo gebeurde het, toen zij het voedsel, dat zij uit Egypte gebracht hadden, opgegeten hadden, dat hun vader tegen hen zei: Ga opnieuw, koop ons een weinig voedsel. Toen sprak Juda tegen hem en zei: Die man heeft ons op het hoogste betuigd en gezegd: U zult mijn gezicht niet zien, als uw broer niet bij u is.", "Gen 37:13": "Zo zei Israël tegen Jozef: Weiden uw broers niet bij Sichem? Kom, ik zal u naar hen toe zenden. En hij zei tegen hem: Zie, hier ben ik!", "Jak 2:10": "Want wie de hele wet houdt, en in één ding struikelt, die is schuldig geworden aan alle geboden.", "2 Sam 15:32": "En het gebeurde, toen David tot op de hoogte kwam, waar hij God aanbad, zie, toen ontmoette Husai, de Archiet, hem, met zijn kleed gescheurd, en aarde op zijn hoofd.", "Ezra 8:25-27": "En ik woog hun toe het zilver, en het goud, en de vaten, zijnde de offering van het huis van onze God die de koning en zijn raadsheren, en zijn vorsten, en heel Israël, die daar gevonden werden, geofferd hadden; ik woog dan aan hun hand zeshonderdvijftig talenten van het zilver, en honderd zilveren vaten in talenten; aan goud, honderd talenten; en twintig gouden bekers, tot duizend drachmen; en twee vaten van blinkend goed koper, begeerlijk als goud.", "Ezech 18:7": "En niemand verdrukt, de schuldenaar zijn pand teruggeeft, geen roof pleegt, de hongerige zijn brood geeft, en de naakte met kleding bedekt;", "Jes 37:1": "Het gebeurde nu, toen koning Hizkia dat hoorde, dat hij zijn kleren scheurde, en zich met een zak bedekte, en het huis van de HEERE inging.", "Gen 46:21": "En de zonen van Benjamin: Bela, Becher en Asbel, Gera en Naäman, Echi en Ros, Muppim en Huppim, en Ard.", "Ezra 9:10": "En nu, wat zullen wij zeggen, o onze God, na dit alles? Want wij hebben Uw geboden verlaten,", "Ezra 9:5": "En rond het avondoffer stond ik op uit mijn bedruktheid, nadat ik mijn kleed en mijn mantel gescheurd had; en ik boog mij op mijn knieën, en breidde mijn handen uit tot de HEERE, mijn God;", "Ps 49:15": "Men zet hen als schapen in het graf, de dood zal hen afweiden; en de oprechten zullen over hen heersen in die morgenstond; en het graf zal hun gedaante verslijten, elk uit zijn woning.", "Job 33:31": "Merk op, o Job! Hoor naar mij; zwijg, en ik zal spreken.", "Deut 31:17": "Dan zal Mijn toorn op die dag tegen hen ontsteken, en Ik zal hen verlaten, en Mijn aangezicht van hen verbergen, zodat zij verslonden worden, en veel kwaad en benauwdheden hen zullen treffen; zodat het op die dag zal zeggen: Heeft dit kwaad mij niet getroffen, omdat mijn God niet in mijn midden is?", "Spr 30:16": "Het graf, de gesloten baarmoeder, de aarde die van water niet verzadigd wordt, en het vuur dat niet zegt: Het is genoeg!", "Gen 44:14-34": "En Juda kwam met zijn broers in het huis van Jozef; want hij was daar nog zelf; en zij vielen voor zijn gezicht neer op de grond. En Jozef zei tegen hen: Wat is dit voor daad die u gedaan hebt? Weet u niet dat zo'n man als ik zeker zoiets kan waarnemen? Toen zei Juda: Wat zullen wij tegen mijn heer zeggen, wat zullen wij spreken, en hoe zullen wij ons rechtvaardigen? God heeft de ongerechtigheid van uw knechten aan het licht gebracht; zie, wij zijn slaven van mijn heer, zowel wij als hij bij wie de beker gevonden is.", "Klaagl 5:4": "Ons water moeten wij voor geld drinken; ons hout komt ons op prijs te staan.", "Dan 5:19": "En vanwege de grootheid die Hij hem gegeven had, beefden en sidderden alle volken, naties en talen voor hem; wie hij wilde, doodde hij, en wie hij wilde, hield hij in leven, en wie hij wilde, verhoogde hij, en wie hij wilde, vernederde hij.", "Gen 43:9": "Ik zal borg voor hem zijn; van mijn hand zult u hem eisen; als ik hem niet bij u breng en voor uw gezicht stel, dan heb ik alle dagen tegen u gezondigd!", "Job 14:13": "Och, wilde U mij toch in het graf verbergen, mij verstoppen, totdat Uw toorn zich afkeerde; dat U mij een vaste tijd stelde, en aan mij zou denken!", "Amos 2:8": "En zij leggen zich neer bij elk altaar op de verpande klederen, en drinken de wijn van de beboeten in het huis van hun goden.", "Ps 31:18": "HEERE! laat mij niet beschaamd worden, want ik roep U aan; laat de goddelozen beschaamd worden, laat hen zwijgen in het graf.", "Gen 26:29": "Als u ons geen kwaad doet, zoals wij u niet aangeraakt hebben, en zoals wij u alleen maar goed gedaan hebben, en u in vrede hebben laten vertrekken! U bent nu de gezegende van de HEERE!", "2 Kron 24:5": "Zo verzamelde hij de priesters en de Levieten, en zei tegen hen: Trek uit naar de steden van Juda, en verzamel geld van heel Israël, om het huis van uw God te herstellen van jaar tot jaar; en u, haast u met deze zaak; maar de Levieten haastten zich niet.", "Job 7:9": "Een wolk vergaat en vaart heen; zo zal hij die in het graf daalt, niet weer opkomen.", "Ezech 7:19": "Zij zullen hun zilver op de straten werpen, en hun goud zal tot onreinheid zijn; hun zilver en hun goud zal hen niet kunnen uithelpen ten dage van de verbolgenheid van de HEERE; hun ziel zullen zij niet verzadigen, en hun ingewanden zullen zij niet vullen; want het zal de aanstoot van hun ongerechtigheid zijn.", "Ps 15:5": "Die zijn geld niet uitleent tegen woeker, en geen geschenk aanneemt tegen de onschuldige. Wie deze dingen doet, zal niet wankelen in eeuwigheid.", "Lev 25:51": "Als er nog veel van die jaren zijn, zal hij naar verhouding daarvan tot zijn lossing van het geld waarvoor hij gekocht is, teruggeven.", "2 Kon 22:7": "Doch er werd met hen geen rekening gehouden van het geld dat in hun hand geleverd was, want zij handelden trouw.", "Gen 42:21": "Toen zeiden zij de één tegen de ander: Voorwaar, wij zijn schuldig aan onze broer, wiens angst van zijn ziel wij zagen, toen hij ons om genade smeekte; maar wij luisterden niet! Daarom komt deze benauwdheid over ons.", "1 Kron 21:25": "En David gaf aan Ornan voor die plaats zeshonderd gouden sikkels aan gewicht.", "Gen 44:27-29": "Toen zei uw knecht, mijn vader, tegen ons: U weet dat mijn vrouw mij twee zonen gebaard heeft. En de één is bij mij weggegaan, en ik heb gezegd: Voorzeker, hij is zeker verscheurd! En ik heb hem niet meer gezien tot nu toe. Als u nu deze ook van mijn gezicht wegneemt, en hem een ongeluk overkomt, zult u mijn grijze haren met verdriet naar het graf doen afdalen!", "Gen 37:34": "Toen scheurde Jakob zijn kleren en legde een zak om zijn heupen; en hij bedreef rouw over zijn zoon, vele dagen.", "Spr 22:26": "Wees niet onder hen die in de hand klappen, onder hen die borg staan voor schulden.", "Ezech 18:12": "De ellendige en de arme verdrukt, veel van het roof rooft, het pand niet teruggeeft, en zijn ogen opheft tot de drekgoden, gruwel doet;", "1 Kon 20:33": "De mannen namen dat nauwkeurig waar, en vatten het snel op, of het van hem was, en zeiden: Uw broeder Benhadad leeft. En hij zei: Komt, brengt hem. Toen kwam Benhadad naar hem uit, en hij liet hem op de wagen klimmen.", "Matt 26:65": "Toen scheurde de hogepriester zijn kleren en zei: Hij heeft God gelasterd, waarom hebben wij nog getuigen nodig? Zie, nu hebt u Zijn godslastering gehoord.", "1 Sam 2:6": "De HEERE doodt en maakt levend; Hij doet naar het graf neerdalen, en Hij doet weer opkomen.", "Ps 109:5": "En zij hebben mij kwaad voor goed opgelegd, en haat voor mijn liefde.", "Deut 21:14": "En het zal gebeuren, als u geen behagen meer in haar hebt, dat u haar zult laten gaan waarheen zij wil; maar u zult haar beslist niet voor geld verkopen, u zult geen handel met haar drijven, omdat u haar vernederd hebt.", "Ps 79:5": "Hoe lang, HEERE? Zult U eeuwig toornen? Zal Uw ijver als vuur branden?", "1 Sam 25:29": "Wanneer een mens opstaat om u te vervolgen en om uw ziel te zoeken, dan zal de ziel van mijn heer ingebonden zijn in het bundeltje van de levenden bij de HEERE, uw God; maar de ziel van uw vijanden zal Hij wegslingeren uit de holte van de slinger.", "Neh 5:10": "Ik, mijn broeders en mijn knechten, vorderen wij ook geld en koren van hen? Laten wij toch deze last nalaten.", "1 Sam 2:34": "Dit nu zal u een teken zijn, dat over uw beide zonen, over Hofni en Pinehas, komen zal: op één dag zullen zij beiden sterven.", "Joz 7:18": "Diens huisgezin liet hij aankomen, man voor man, en Achan werd aangewezen, de zoon van Charmi, de zoon van Zabdi, de zoon van Zerah, uit de stam van Juda.", "Gen 37:29": "Toen Ruben nu naar de kuil terugkeerde, zie, Jozef was niet meer in de kuil; toen scheurde hij zijn kleren.", "Gen 23:9": "Dat hij mij de spelonk van Machpela geeft, die hij heeft, die aan het eind van zijn akker is; dat hij die mij voor het volle geld geeft, tot een eigen graf in het midden van u.", "Matt 7:2": "Want met het oordeel waarmee u oordeelt, zult u geoordeeld worden; en met de maat waarmee u meet, zal u weer gemeten worden.", "Gen 35:18": "En het gebeurde, toen haar ziel heenging (want zij stierf), dat zij zijn naam Ben-Oni noemde; maar zijn vader noemde hem Benjamin.", "Rom 5:7-10": "Want nauwelijks zal iemand voor een rechtvaardige sterven; want voor de goede zal misschien iemand ook durven te sterven. Maar God bevestigt Zijn liefde tegenover ons hierin, dat Christus voor ons gestorven is toen wij nog zondaars waren. Veelmeer dan zullen wij, nu gerechtvaardigd door Zijn bloed, door Hem behouden worden van de toorn.", "2 Sam 13:19": "Toen nam Thamar as en strooide die op haar hoofd, en scheurde de veelkleurige mantel die zij aanhad; en zij legde haar hand op haar hoofd, en liep luid schreiend weg.", "2 Kon 5:8": "Maar het gebeurde, toen Elisa, de man van God, gehoord had dat de koning van Israël zijn kleren had gescheurd, dat hij naar de koning stuurde, om te zeggen: Waarom hebt u uw kleren gescheurd? Laat hem nu naar mij toe komen, dan zal hij weten dat er een profeet in Israël is.", "Gen 41:40": "U zult over mijn huis zijn, en op uw bevel zal heel mijn volk de hand kussen; alleen door de troon zal ik groter zijn dan u.", "Luk 9:3": "En Hij zei tegen hen: Neem niets mee voor onderweg, geen stok, geen reistas, geen brood, geen geld; en niemand van u mag twee stel kleren hebben.", "Lev 25:37": "Uw geld zult u hem niet op rente geven, en uw voedsel zult u niet op overwinst geven.", "Amos 9:4": "En al gingen zij in gevangenschap voor het aangezicht van hun vijanden, dan zal Ik vandaar het zwaard gebieden, dat het hen doodt; en Ik zal Mijn oog tegen hen richten ten kwade, en niet ten goede.", "Deut 2:16": "En het gebeurde, toen al de krijgslieden uit het midden van het volk verteerd waren en gestorven,", "Num 32:23": "Maar als u dat niet zo zult doen, zie, dan hebt u tegen de HEERE gezondigd; en weet zeker dat uw zonde u vinden zal!", "Gen 44:1-8": "En hij gebood degene die over zijn huis ging, en zei: Vul de zakken van deze mannen met voedsel, zoveel als zij kunnen dragen, en leg ieders geld in de mond van zijn zak; En mijn beker, de zilveren beker, moet u leggen in de mond van de zak van de jongste, met het geld van zijn koren. En hij deed naar Jozefs woord, dat hij gesproken had. 's Morgens, toen het licht werd, liet men deze mannen vertrekken, hen en hun ezels.", "Jes 3:1": "Want zie, de Heere, HEERE van de heerscharen, zal van Jeruzalem en van Juda wegnemen de stok en de staf, elke stok van het brood, en elke stok van het water;", "Ex 30:16": "U dan moet het geld van de verzoeningen van de kinderen van Israël nemen, en het bestemmen voor de dienst van de tent van de samenkomst; en het zal voor de kinderen van Israël een gedachtenis zijn, voor het aangezicht van de HEERE, om voor uw zielen verzoening te doen.", "Ps 6:6": "Want in de dood is aan U geen gedachtenis; wie zal U loven in het graf?", "2 Kon 2:12": "En Elisa zag het, en hij riep: Mijn vader, mijn vader, wagen van Israël en zijn ruiters! En hij zag hem niet meer; en hij greep zijn klederen en scheurde ze in twee stukken.", "Gen 43:12-23": "En neem dubbel geld in uw hand; en breng het geld, dat in de opening van uw zakken teruggekeerd is, weer terug in uw hand; misschien is het een vergissing. Neem ook uw broer mee, en maak u op, ga terug naar die man. En God, de Almachtige, geve u barmhartigheid bij die man, dat hij uw andere broer en Benjamin met u laat teruggaan! En wat mij aangaat, als ik van mijn kinderen beroofd word, dan ben ik maar beroofd!", "2 Kron 24:14": "Toen zij het nu klaar hadden, brachten zij voor de koning en Jojada het overige van het geld, waarvan hij vaten maakte voor het huis van de HEERE, vaten om te dienen en te offeren, en rookschalen, en gouden en zilveren vaten; en zij offerden voortdurend brandoffers in het huis van de HEERE, al de dagen van Jojada.", "Ps 75:3": "Als ik het bestemde ambt zal ontvangen hebben, zal ik geheel rechtvaardig richten.", "Ex 22:27": "want dat is zijn enige bedekking, het is zijn kleding voor zijn huid; waarin zou hij anders slapen? Het zal dan gebeuren, wanneer hij tot Mij roept, dat Ik hem zal horen; want Ik ben genadig!", "Gen 44:26-32": "Toen hebben wij gezegd: Wij kunnen niet aftrekken; als onze kleinste broer bij ons is, zullen wij aftrekken; want wij mogen het gezicht van die man niet zien, als deze onze kleinste broer niet bij ons is. Toen zei uw knecht, mijn vader, tegen ons: U weet dat mijn vrouw mij twee zonen gebaard heeft. En de één is bij mij weggegaan, en ik heb gezegd: Voorzeker, hij is zeker verscheurd! En ik heb hem niet meer gezien tot nu toe.", "Gen 50:15-21": "Toen Jozefs broeders zagen dat hun vader dood was, zeiden zij: Misschien zal Jozef ons haten, en zal hij ons zeker vergelden al het kwaad, dat wij hem aangedaan hebben. Daarom stuurden zij een boodschapper naar Jozef, en zeiden: Uw vader heeft voor zijn dood bevolen en gezegd: Zo moet u tot Jozef zeggen: Ach, vergeef toch de overtreding van uw broeders, en hun zonde; want zij hebben u kwaad aangedaan; maar nu, vergeef toch de overtreding van de dienaren van de God van uw vader! En Jozef weende toen zij tot hem spraken.", "2 Kon 5:26": "Maar hij zei tegen hem: Ging mijn hart niet mee, toen die man zich van zijn wagen omkeerde, u tegemoet? Was dit het moment om dat zilver aan te nemen, en om kleren aan te nemen, en olijfbomen, en wijngaarden, en schapen, en runderen, en knechten, en dienstmaagden?", "Luk 12:2": "Er is niets bedekt, dat niet onthuld zal worden, en niets verborgen, dat niet bekend zal worden.", "Jak 2:11": "Want Hij Die gezegd heeft: U zult geen overspel doen, heeft ook gezegd: U zult niet doden. Als u nu geen overspel doet, maar wel doodt, dan bent u een overtreder van de wet geworden.", "1 Kon 21:15": "Het gebeurde nu, toen Izebel hoorde dat Naboth gestenigd en dood was, dat Izebel tegen Achab zei: Sta op, neem de wijngaard van Naboth, de Jizreëliet, in bezit, die hij u weigerde voor geld te geven; want Naboth leeft niet meer, maar is dood.", "Jes 5:3": "Nu dan, u, inwoners van Jeruzalem, en u, mannen van Juda, oordeel toch tussen Mij en tussen Mijn wijngaard.", "Neh 5:4": "Evenzo waren er die zeiden: Wij hebben geld geleend voor de belasting van de koning, op onze akkers en onze wijngaarden.", "2 Kon 19:1": "En het gebeurde, toen koning Hizkia dat hoorde, dat hij zijn kleren scheurde en zich met een zak bedekte, en naar het huis van de HEERE ging.", "2 Kon 15:20": "Menahem nu bracht dit geld op van Israël, van alle vermogende mannen, om aan de koning van Assyrië te geven, voor elke man vijftig zilveren sikkels; zo keerde de koning van Assyrië terug, en bleef daar niet in het land.", "Deut 23:19": "U zult uw broeder geen rente laten betalen, rente van geld, rente van voedsel, rente van enig ding waarover men rente vraagt.", "2 Kon 22:19": "Omdat uw hart week geworden is, en u zich voor het aangezicht van de HEERE vernederd hebt, toen u hoorde wat Ik gesproken heb tegen deze plaats en haar inwoners, dat zij tot een verwoesting en vloek zullen worden, en dat u uw kleren gescheurd en voor Mijn aangezicht geweend hebt; zo heb Ik u ook verhoord, spreekt de HEERE.", "Gen 37:33-35": "En hij herkende hem en zei: Het is de rok van mijn zoon! Een wild dier heeft hem opgegeten! Jozef is voorzeker verscheurd! Toen scheurde Jakob zijn kleren en legde een zak om zijn heupen; en hij bedreef rouw over zijn zoon, vele dagen. En al zijn zonen en al zijn dochters maakten zich op om hem te troosten; maar hij weigerde zich te laten troosten en zei: Want ik zal, rouw bedrijvend, tot mijn zoon in het graf neerdalen. Zo beweende zijn vader hem.", "Jer 6:26": "O dochter van Mijn volk! Gord een zak aan, en wentel u in de as, bedrijf rouw als om een enige zoon, een zeer bitter misbaar; want de verstoorder zal ons snel overkomen.", "Gen 49:8": "Juda! U bent het, u zullen uw broers loven; uw hand zal zijn op de nek van uw vijanden; voor u zullen de zonen van uw vader zich neerbuigen.", "Hand 20:33": "Ik heb niemands zilver, of goud, of kleding begeerd.", "1 Sam 4:18": "En het gebeurde, toen hij de ark van God noemde, dat hij achterover van de stoel viel, bij de kant van de poort, en zijn nek brak, en stierf; want de man was oud en zwaar. En hij had Israël veertig jaar geleid.", "Num 18:16": "Wie hiervan gelost zullen worden, zult u van een maand oud lossen, naar uw schatting, voor het geld van vijf sikkels, naar de sikkel van het heiligdom, die is twintig gera.", "Ex 22:25": "Als u Mijn volk, dat arm is onder u, geld leent, mag u zich niet als een woekeraar tegenover hen gedragen; u mag geen rente van hen vragen.", "2 Kron 34:14": "En toen zij het geld uithaalden dat naar het huis van de HEERE gebracht was, vond de priester Hilkia het wetboek van de HEERE, dat door de hand van Mozes gegeven was.", "Gen 21:14": "Toen stond Abraham 's morgens vroeg op, en nam brood en een fles water, en gaf ze aan Hagar, die hij op haar schouder legde; ook gaf hij haar het kind, en stuurde haar weg. En zij ging op weg, en dwaalde rond in de woestijn Berseba.", "2 Sam 14:12": "Toen zei deze vrouw: Laat uw dienares toch een woord tot mijn heer de koning spreken. En hij zei: Spreek.", "Gen 45:3": "En Jozef zei tegen zijn broers: Ik ben Jozef! Leeft mijn vader nog? En zijn broers konden hem niet antwoorden, want zij waren verschrikt voor zijn aangezicht.", "Gen 37:35": "En al zijn zonen en al zijn dochters maakten zich op om hem te troosten; maar hij weigerde zich te laten troosten en zei: Want ik zal, rouw bedrijvend, tot mijn zoon in het graf neerdalen. Zo beweende zijn vader hem.", "Gen 43:12": "En neem dubbel geld in uw hand; en breng het geld, dat in de opening van uw zakken teruggekeerd is, weer terug in uw hand; misschien is het een vergissing.", "Spr 28:17": "Een mens, gedrukt door het bloed van iemand, zal naar de kuil toevluchten; men houde hem niet tegen!", "2 Kon 12:7-16": "Toen riep koning Joas de priester Jojada en de andere priesters, en zei tegen hen: Waarom herstelt u niet de breuken van het huis? Nu dan, neem geen geld van uw bekenden aan, tenzij u het geeft voor de breuken van het huis. En de priesters stemden erin toe geen geld van het volk aan te nemen, noch de breuken van het huis te herstellen. Maar de priester Jojada nam een kist, en boorde een gat in het deksel ervan, en zette die bij het altaar aan de rechterkant, waar iemand het huis van de HEERE binnenkwam; en de priesters die de drempel bewaakten, staken daarin al het geld dat naar het huis van de HEERE gebracht werd.", "Pred 10:19": "Men maakt maaltijden om te lachen, en de wijn verheugt de levenden, en het geld verschaft alles.", "Matt 2:11": "En toen zij in het huis gekomen waren, vonden zij het Kindje met Maria, Zijn moeder, en zij vielen neer en aanbaden Het; en na hun schatten geopend te hebben, brachten zij Hem geschenken: goud, wierook en mirre.", "Deut 2:28": "Verkoop mij voedsel voor geld, dat ik eet, en geef mij water voor geld, dat ik drink; laat mij alleen te voet doortrekken;", "Gen 43:22": "Wij hebben ook ander geld in onze hand meegebracht, om voedsel te kopen; wij weten niet wie ons geld in onze zakken gelegd heeft.", "Gen 42:25-35": "En Jozef gebood dat men hun zakken met koren vullen zou, en dat men hun geld terug zou geven, ieder in zijn zak, en dat men hun proviand zou geven voor onderweg; en men deed hun zo. En zij laadden hun koren op hun ezels, en trokken vandaar weg. Toen één zijn zak opendeed om zijn ezel voer te geven in de herberg, zag hij zijn geld; want zie, het was in de opening van zijn zak.", "Gen 37:26": "Toen zei Juda tegen zijn broers: Wat voor voordeel zal het zijn dat wij onze broer doodslaan en zijn bloed verbergen?", "Job 31:38-40": "Als mijn land tegen mij roept, en zijn voren samen wenen; Als ik zijn vermogen gegeten heb zonder geld, en de ziel van zijn akkerlieden heb doen hijgen; Dat voor tarwe distels voortkomen, en voor gerst stinkkruid! De woorden van Job hebben een einde.", "Gen 23:13": "En hij sprak tot Efron, ten aanhoren van het volk van het land, en zei: Trouwens, als u het toch wilt geven, hoor mij dan alstublieft; ik zal het geld van de akker geven; neem het van mij aan, dan zal ik mijn dode daar begraven.", "Gen 37:3": "En Israël had Jozef lief, boven al zijn zonen; want hij was hem een zoon van het ouderdom; en hij maakte hem een veelkleurige rok.", "Matt 19:18": "Hij zei tegen Hem: Welke? En Jezus zei: Deze: U zult niet doden; u zult geen overspel doen; u zult niet stelen; u zult geen valse getuigenis geven;", "Gen 43:29": "En hij hief zijn ogen op, en zag Benjamin, zijn broer, de zoon van zijn moeder, en zei: Is dit uw jongste broer, over wie u tegen mij zei? Daarna zei hij: Mijn zoon? God zij u genadig!", "Gen 37:18-28": "En zij zagen hem van verre; en voordat hij bij hen kwam, smeedden zij een listig plan tegen hem, om hem te doden. En zij zeiden de een tegen de ander: Zie, daar komt die meesterdromer aan! Nu dan, komt, laten wij hem doodslaan en hem in een van deze kuilen werpen; en wij zullen zeggen: Een wild dier heeft hem opgegeten! Zo zullen wij zien wat er van zijn dromen worden zal.", "Matt 18:25": "En omdat hij niet had waarmee hij kon betalen, beval zijn heer dat men hem zou verkopen, en zijn vrouw en kinderen, en alles wat hij had, en dat de schuld zo betaald zou worden.", "Ex 21:35": "Wanneer nu iemands os de os van zijn naaste zo kwetst, dat hij sterft, dan zal men de levende os verkopen en het geld daarvan gelijk delen, en het dode dier zal men ook gelijk delen.", "2 Kron 34:28": "Zie, Ik zal u verzamelen tot uw vaderen, en u zult in vrede in uw graf verzameld worden, en uw ogen zullen al dat onheil niet zien, dat Ik over deze plaats en over haar inwoners brengen zal. En zij brachten de koning dit antwoord terug.", "Jer 31:15": "Zo zegt de HEERE: Er is een stem gehoord in Rama, een geklaag, een zeer bitter geween; Rachel weent over haar kinderen; zij weigert zich te laten troosten over haar kinderen, omdat zij er niet meer zijn.", "Spr 17:13": "Die kwaad voor goed vergeldt, het kwaad zal van zijn huis niet wijken.", "1 Tess 4:13": "Maar, broeders, ik wil niet dat u onwetend bent over hen die ontslapen zijn, opdat u niet bedroefd bent, zoals ook de anderen, die geen hoop hebben.", "Jer 32:25": "Evenwel hebt U tegen mij gezegd, Heere HEERE: koop voor uzelf dat veld voor geld, en laat het door getuigen bevestigen; terwijl de stad in de hand van de Chaldeeën gegeven is.", "2 Kon 11:14": "En zij zag toe, en zie, de koning stond bij de pilaar, naar de gewoonte, en de leiders en de trompetten bij de koning; en al het volk van het land was blij en blies op trompetten. Toen scheurde Athalia haar kleren en riep: Verraad, verraad!", "Est 4:7": "gaf Mordechai hem te kennen alles wat hem overkomen was, en de opgave van het zilver dat Haman gezegd had te zullen wegen in de schatten van de koning, voor de Joden, om hen om te brengen.", "Spr 19:12": "De gramschap van de koning is als het gebrul van een jonge leeuw; maar zijn welgevallen is als dauw op het gras.", "Gen 17:12": "Een zoontje van acht dagen zal bij u besneden worden, alles wat mannelijk is in uw geslachten: degene die in het huis geboren is, en degene die met geld gekocht is van elke vreemdeling die niet van uw nageslacht is;", "Deut 14:26": "En geef dat geld voor alles wat uw ziel verlangt, voor runderen en voor schapen, en voor wijn, en voor sterke drank, en voor alles wat uw ziel van u begeren zal, en eet daar voor het aangezicht van de HEERE, uw God, en wees vrolijk, u en uw huis.", "2 Kon 12:4": "En Joas zei tegen de priesters: Al het geld van de geheiligde dingen, dat gebracht zal worden in het huis van de HEERE, te weten het geld van hem die overgaat tot de getelden, het geld van ieder man naar zijn schatting, en al het geld, dat in het hart van ieder komt, om dat te brengen in het huis van de HEERE,", "Spr 7:20": "Hij heeft een bundel van het geld in zijn hand genomen; op de vastgestelde dag zal hij naar zijn huis komen.", "Ps 35:12": "Zij vergelden mij kwaad voor goed, de beroving van mijn ziel.", "Ps 88:5": "Ik word gerekend bij hen die in de kuil neerdalen; ik ben geworden als een man die geen kracht heeft;", "Neh 5:11": "Geeft hun toch, nog vandaag, hun akkers, hun wijngaarden, hun olijfgaarden en hun huizen terug; en het honderdste deel van het geld en van het koren, de most en de olie, die u van hen gevorderd hebt.", "Job 31:39": "Als ik zijn vermogen gegeten heb zonder geld, en de ziel van zijn akkerlieden heb doen hijgen;", "Lev 19:26": "U zult niets met het bloed eten. U zult op geen vogelgeschrei letten, noch waarzeggerij plegen.", "Ex 21:34": "dan zal de eigenaar van de kuil het vergoeden; hij zal aan de eigenaar van het dier het geld teruggeven; maar het dode dier zal hem toebehoren.", "Gen 42:25": "En Jozef gebood dat men hun zakken met koren vullen zou, en dat men hun geld terug zou geven, ieder in zijn zak, en dat men hun proviand zou geven voor onderweg; en men deed hun zo.", "2 Kon 21:6": "Ja, hij liet zijn zoon door het vuur gaan, en pleegde waarzeggerij en lette op vogelgeschrei; en hij stelde geestenbezweerders en waarzeggers aan; hij deed zeer veel kwaad in de ogen van de HEERE, om Hem tot toorn te verwekken.", "Gen 43:7": "En zij zeiden: Die man vroeg zeer nauwkeurig naar ons, en naar onze afkomst, en zei: Leeft uw vader nog; hebt u nog een broer? Zo vertelden wij het hem, volgens diezelfde woorden; konden wij dan zeker weten dat hij zou zeggen: Breng uw broer hierheen?", "Ps 7:4-6": "HEERE, mijn God, als ik dat gedaan heb, als er onrecht in mijn handen is; Als ik kwaad vergolden heb aan hem die vrede met mij had; (ja, ik heb hem gered, die mij zonder reden benauwde!) Laat dan de vijand mijn ziel vervolgen, en achterhaalt haar, en vertreedt mijn leven ter aarde, en mijn eer in het stof doet wonen! Sela.", "Gen 20:16": "En tegen Sara zei hij: Zie, ik heb uw broeder duizend zilverlingen gegeven; zie, dat moet voor u een bedekking van de ogen zijn, voor allen die bij u zijn, ja, tegenover allen, en wees terechtgewezen.", "Gen 46:28": "En hij stuurde Juda voor zich uit naar Jozef, om voor hem uit de weg te wijzen naar Gosen; en zij kwamen in het land Gosen.", "Richt 17:4": "Maar hij gaf dat geld aan zijn moeder terug. En zijn moeder nam tweehonderd zilverlingen, en gaf ze aan de goudsmid, die maakte daarvan een gesneden beeld en een gegoten beeld; dat was in het huis van Micha.", "Jer 52:11": "En hij verblindde de ogen van Zedekia, en hij bond hem met twee koperen ketenen; zo bracht de koning van Babel hem naar Babel, en stelde hem in de gevangenis, tot de dag van zijn dood toe.", "Hand 25:11": "Want als ik onrecht doe en iets gedaan heb dat de dood verdient, weiger ik niet te sterven; maar als er niets waar is van wat dezen mij beschuldigen, kan niemand mij uit gunst aan hen overgeven. Ik beroep mij op de keizer.", "Hand 3:6": "En Petrus zei: Zilver en goud heb ik niet, maar wat ik heb, dat geef ik u: in de Naam van Jezus Christus de Nazarener, sta op en loop!", "Jer 24:6": "En Ik zal Mijn oog op hen richten tot hun goed, en zal hen terugbrengen in dit land; en Ik zal hen bouwen, en niet afbreken; en Ik zal hen planten, en niet uitrukken.", "Luk 19:15": "En het gebeurde, toen hij terugkwam nadat hij het koninkrijk ontvangen had, dat hij zei dat die dienstknechten aan wie hij het geld gegeven had bij hem geroepen moesten worden, opdat hij zou weten wat ieder met handel verdiend had.", "Ex 20:15": "U zult niet stelen.", "Spr 27:13": "Als iemand voor een vreemde borg is geworden, neem zijn kleed, en neem pand van hem voor een onbekende vrouw.", "Ex 18:8": "En Mozes vertelde zijn schoonvader alles wat de HEERE aan Farao en aan de Egyptenaren gedaan had, ter wille van Israël; al de moeite die hun onderweg overkomen was, en dat de HEERE hen verlost had.", "2 Sam 3:31": "David dan zei tegen Joab en tegen al het volk dat bij hem was: Scheur uw kleren, en doe rouwgewaden aan, en klaag over Abner. En koning David liep zelf achter de baar.", "Jer 32:9": "Dus kocht ik van Hanameel, de zoon van mijn oom, het veld dat bij Anathoth is; en ik woog hem het geld toe, zeventien zilveren sikkels.", "Gen 41:44": "En Farao zei tegen Jozef: Ik ben Farao! Maar zonder u zal niemand zijn hand of zijn voet opheffen in heel Egypteland.", "Pred 7:12": "Want de wijsheid is tot een schaduw, en het geld is tot een schaduw; maar de uitnemendheid van de wetenschap is, dat de wijsheid haar bezitters het leven geeft.", "2 Kron 20:11": "Zie dan, zij vergelden ons dit, doordat zij komen om ons uit Uw erfbezit te verdrijven, dat U ons als erfdeel gegeven hebt.", "Ex 22:17": "Als haar vader hardnekkig weigert haar aan hem te geven, dan moet hij geld betalen overeenkomstig de bruidsprijs voor maagden.", "Ezra 3:7": "Zo gaven zij geld aan de houwers en werkmeesters, ook eten en drinken, en olie aan de Sidoniërs en aan de Tyriërs, om cederhout van de Libanon te brengen naar de zee bij Jafo, naar de vergunning die Kores, koning van Perzië, hun gegeven had.", "Gen 30:27": "Toen zei Laban tegen hem: Als ik toch genade gevonden heb in uw ogen; ik heb ondervonden dat de HEERE mij om u gezegend heeft.", "Fil 2:10": "Opdat in de Naam van Jezus zich zou buigen elke knie van hen die in de hemel, en die op de aarde, en die onder de aarde zijn.", "Ezech 33:15": "Geeft de goddeloze het pand terug, betaalt hij het geroofde terug, wandelt hij in de inzettingen van het leven, zodat hij geen onrecht doet; dan zal hij zeker leven, hij zal niet sterven.", "Gen 4:10": "En Hij zei: Wat hebt u gedaan? Daar is een stem van het bloed van uw broeder, die tot Mij roept vanuit de aardbodem.", "Dan 9:7": "Bij U, o Heere! is de gerechtigheid, maar bij ons de schaamte van het gezicht, zoals het is op deze dag; bij de mannen van Juda, en de inwoners van Jeruzalem, en heel Israël, die dichtbij en die ver weg zijn, in alle landen waarheen U hen verdreven hebt, om hun overtreding waarmee zij tegen U overtreden hebben.", "Gen 50:18": "Daarna kwamen ook zijn broeders, en vielen voor hem neder, en zeiden: Zie, wij zijn u tot knechten!", "Jes 46:6": "Zij verkwisten het goud uit de beurs, en wegen het zilver met de weegschaal; zij huren een goudsmid, en die maakt het tot een god, zij knielen neer, ook buigen zij zich daarvoor.", "1 Sam 18:1": "Het gebeurde nu, toen hij geëindigd had tot Saul te spreken, dat de ziel van Jonathan verbonden werd aan de ziel van David; en Jonathan had hem lief als zijn eigen ziel.", "2 Kor 7:10": "Want de droefheid naar God werkt een onberouwelijke bekering tot zaligheid; maar de droefheid van de wereld werkt de dood.", "Ezra 9:15": "O HEERE, God van Israël! U bent rechtvaardig; want wij zijn overgelaten ter ontkoming, zoals het is op deze dag. Zie, wij zijn voor Uw aangezicht in onze schuld; want er is niemand die voor Uw aangezicht zou kunnen bestaan, om hiervan.", "Job 2:12": "En toen zij hun ogen van verre opsloegen, herkenden zij hem niet, en zij verhieven hun stem en weenden; daarbij scheurden zij ieder hun mantel, en strooiden stof op hun hoofden, omhoog naar de hemel.", "Matt 18:24": "Toen hij nu begon te rekenen, werd er iemand bij hem gebracht die hem tienduizend talenten schuldig was.", "Jes 55:2": "Waarom weegt u geld uit voor wat geen brood is, en uw arbeid voor wat niet verzadigen kan? Hoor aandachtig naar Mij, en eet het goede, en laat uw ziel zich verlustigen in vettigheid.", "2 Kron 34:17": "En zij hebben het geld dat in het huis van de HEERE gevonden is, samengevoegd, en hebben het gegeven in de hand van de opzichters, en in de hand van hen die het werk verrichtten.", "Ps 89:49": "Wat man leeft er, die de dood niet zien zal, die zijn ziel zal bevrijden van het geweld van het graf? Sela.", "Spr 1:12": "Laat ons hen levend verslinden, als het graf; ja, geheel en al, zoals zij die in de kuil neerdalen;", "2 Sam 1:11": "Toen greep David zijn kleren en scheurde ze; evenzo ook al de mannen die met hem waren.", "Richt 11:35": "En het gebeurde, toen hij haar zag, dat hij zijn kleren scheurde, en zei: Ach, mijn dochter! U hebt mij helemaal terneergeslagen, en u bent onder degenen die mij in het ongeluk storten; want ik heb mijn mond opengedaan tegen de HEERE, en ik kan niet terug.", "2 Kron 24:11": "Het gebeurde nu ter tijd, als hij de kist, naar het bevel van de koning, door de hand van de Levieten inbracht, en als zij zagen dat er veel van het geld was, dat de schrijver van de koning kwam, en de gestelde van de hoofdpriester, en de kist leegmaakten, en die opnamen, en die terugbrachten naar haar plaats; zo deden zij van dag tot dag, en verzamelden geld in overvloed;", "Rom 9:3": "Want ik zou zelf wel wensen verbannen te zijn van Christus, voor mijn broeders, die mijn verwanten zijn naar het vlees;", "2 Sam 18:33": "Toen raakte de koning zeer ontroerd, en ging naar boven, naar de bovenzaal boven de poort, en huilde; en al gaande zei hij dit: Mijn zoon Absalom, mijn zoon, mijn zoon Absalom! Was ik maar, was ik maar in uw plaats gestorven, Absalom, mijn zoon, mijn zoon!", "Gen 17:27": "En alle mannen van zijn huis, degenen die in het huis geboren waren, en degenen die met geld gekocht waren, van de vreemdeling af, werden met hem besneden.", "Ezra 8:25-28": "En ik woog hun toe het zilver, en het goud, en de vaten, zijnde de offering van het huis van onze God die de koning en zijn raadsheren, en zijn vorsten, en heel Israël, die daar gevonden werden, geofferd hadden; ik woog dan aan hun hand zeshonderdvijftig talenten van het zilver, en honderd zilveren vaten in talenten; aan goud, honderd talenten; en twintig gouden bekers, tot duizend drachmen; en twee vaten van blinkend goed koper, begeerlijk als goud.", "Ps 116:3": "De banden van de dood hadden mij omvangen, en de angsten van het graf hadden mij getroffen; ik vond benauwdheid en droefenis.", "Gen 37:7-9": "En zie, wij waren schoven aan het binden in het midden van het veld; en zie, mijn schoof stond op en bleef ook staande; en zie, uw schoven kwamen eromheen staan en bogen zich neer voor mijn schoof. Toen zeiden zijn broers tegen hem: Zult u dan werkelijk over ons regeren? Zult u dan werkelijk over ons heersen? Zo haatten zij hem nog meer, om zijn dromen en om zijn woorden. En hij droomde nog een andere droom en vertelde die aan zijn broers; en hij zei: Zie, ik heb nog een droom gedroomd, en zie, de zon, de maan en elf sterren bogen zich voor mij neer.", "Joh 5:22": "Want ook de Vader oordeelt niemand, maar heeft heel het oordeel aan de Zoon gegeven,", "Gen 37:27": "Komt, laten wij hem aan deze Ismaëlieten verkopen, en onze hand zij niet aan hem; want hij is onze broer, ons vlees. En zijn broers stemden ermee in.", "2 Kon 22:11": "Het gebeurde nu, toen de koning de woorden van het wetboek hoorde, dat hij zijn kleren scheurde.", "Dan 3:15": "Nu dan, als u gereed bent om, op het moment dat u het geluid zult horen van de hoorn, de pijp, de citer, de vedel, de psalters, en het akkoordgezang, en allerlei soort muziek, neer te vallen en het beeld te aanbidden dat ik gemaakt heb, dan is het goed; maar als u het niet aanbidt, zult u op datzelfde moment geworpen worden in het midden van de brandende vuuroven; en wie is de god die u uit mijn handen zou kunnen verlossen?", "2 Sam 23:3": "De God van Israël heeft gezegd, de Rotssteen van Israël heeft tot mij gesproken: Er zal een Heerser zijn over de mensen, een Rechtvaardige, een Heerser in de vreze van God.", "Ex 21:21": "Als hij echter een dag of twee dagen overeind blijft, zal hij niet gewroken worden; want hij is zijn eigen geld waard.", "Hebr 7:22": "van een zoveel beter verbond is Jezus Borg geworden.", "Deut 2:6": "Voedsel zult u voor geld van hen kopen, dat u eet; en ook zult u water voor geld van hen kopen, dat u drinkt.", "Deut 24:10-13": "Wanneer u aan uw naaste iets te leen geeft, zult u zijn huis niet binnengaan om zijn pand te pand te nemen; buiten zult u staan, en de man aan wie u geleend hebt, zal het pand naar buiten tot u brengen. Maar als hij een arme man is, zult u met zijn pand niet neerliggen.", "Jes 27:9": "Daarom zal daardoor de ongerechtigheid van Jakob verzoend worden, en dit is de hele vrucht, dat Hij zijn zonde zal wegdoen: wanneer Hij alle stenen van het altaar maakt als verstrooide kalkstenen, zullen de bossen en de zonnebeelden niet blijven bestaan.", "Rom 13:9": "Want dit: u zult geen overspel doen, u zult niet doden, u zult niet stelen, u zult geen valse getuigenis geven, u zult niet begeren; en als er nog enig ander gebod is, wordt het in dit woord samengevat, namelijk in dit: u zult uw naaste liefhebben als uzelf.", "Ex 22:3": "Als de zon al over hem opgegaan was, dan rust daar wel een bloedschuld op. Hij moet het volledig teruggeven; heeft hij niets, dan wordt hij verkocht voor wat hij gestolen heeft.", "1 Sam 24:18": "En hij zei tegen David: U bent rechtvaardiger dan ik; want u hebt mij goed vergolden, en ik heb u kwaad vergolden.", "Gen 44:18-34": "Toen kwam Juda dichter bij hem, en zei: Och, mijn heer! Laat toch uw knecht een woord spreken voor de oren van mijn heer, en laat uw toorn tegen uw knecht niet ontsteken; want u bent gelijk aan Farao! Mijn heer vroeg zijn knechten en zei: Hebt u een vader of broer? Toen zeiden wij tegen mijn heer: Wij hebben een oude vader, en een jongen van het ouderdom, de kleinste, wiens broer dood is, en hij is alleen van zijn moeder overgebleven, en zijn vader heeft hem lief.", "Gen 43:21": "Het is nu gebeurd, toen wij in de herberg gekomen waren, en wij onze zakken opendeden, zie, zo lag ieders geld in de opening van zijn zak, ons geld met het volle gewicht; en wij hebben het teruggebracht in onze hand.", "Gen 17:23": "Toen nam Abraham zijn zoon Ismaël, en alle mannen die in zijn huis geboren waren, en alle die met zijn geld gekocht waren, alles wat mannelijk was onder de mensen van het huis van Abraham, en hij besneed het vlees van hun voorhuid, op diezelfde dag, zoals God met hem gesproken had.", "Deut 5:19": "En u zult niet stelen.", "Richt 16:18": "Toen Delila nu zag, dat hij haar zijn hele hart bekend had gemaakt, zond zij mensen weg, en riep de vorsten van de Filistijnen, en zei: Komt ditmaal, want hij heeft mij zijn hele hart bekendgemaakt. En de vorsten van de Filistijnen kwamen naar haar toe, en brachten dat geld in hun hand.", "Gen 44:7-16": "En zij zeiden tegen hem: Waarom spreekt mijn heer zulke woorden? Het zij verre van uw knechten dat zij zoiets zouden doen. Zie, het geld dat wij in de mond van onze zakken vonden, hebben wij uit het land Kanaän naar u teruggebracht; hoe zouden wij dan uit het huis van uw heer zilver of goud stelen? Bij wie van uw knechten hij gevonden wordt, laat hem sterven; en ook wij zullen dan mijn heer tot slaven zijn!", "Gen 21:26": "Toen zei Abimelech: Ik heb niet geweten wie dit gedaan heeft; en u hebt het mij ook niet verteld, en ik heb er ook niet van gehoord, dan vandaag.", "Jes 43:24": "Mij hebt u geen kalmoes voor geld gekocht, en met het vet van uw slachtoffers hebt u Mij niet gedrenkt; maar u hebt Mij arbeid gemaakt met uw zonden, u hebt Mij vermoeid met uw ongerechtigheden.", "Jer 32:10": "En ik ondertekende de brief en verzegelde hem, en liet het door getuigen bevestigen, toen ik het geld op de weegschaal gewogen had.", "Fil 2:11": "En elke tong zou belijden dat Jezus Christus de Heere is, tot heerlijkheid van God de Vader.", "Matt 25:27": "Dan had u mijn geld naar de wisselaars moeten brengen, en zou ik bij mijn komst het mijne met rente teruggekregen hebben."}, "noten": {"1": "Vers 5: SV: \"waarbij hij iets zekerlijk waarnemen zal\". D.i.: waarmee hij waarzegt/voorspelt (vgl. vers 15)."}, "koppeling": {"1": "<span class=\"wl\" data-l=\"L1\" data-code=\"H6680\">En</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H6680\">hij</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H6680\">gebood</span> degene <span class=\"wl\" data-l=\"L2\" data-code=\"H834\">die</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H834\">over</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H1004\">zijn</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H1004\">huis</span> ging, en zei: <span class=\"wl\" data-l=\"L4\" data-code=\"H4390\">Vul</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H4390\">de</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H572\">zakken</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H572\">van</span> deze <span class=\"wl\" data-l=\"L6\" data-code=\"H582\">mannen</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H582\">met</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H400\">voedsel</span>, zoveel als <span cla
