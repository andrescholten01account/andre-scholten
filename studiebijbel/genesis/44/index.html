</span> according to the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> that <span class=\"wl wl-kjv\" data-code=\"H3130\">Joseph</span> had spoken.", "3": "As soon as the <span class=\"wl wl-kjv\" data-code=\"H1242\">morning</span> was <span class=\"wl wl-kjv\" data-code=\"H215\">light,</span> the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> were sent <span class=\"wl wl-kjv\" data-code=\"H7971\">away,</span> they and their asses.", "4": "And when they were gone <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> of the <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> and not yet far <span class=\"wl wl-kjv\" data-code=\"H7368\">off,</span> <span class=\"wl wl-kjv\" data-code=\"H3130\">Joseph</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto his <span class=\"wl wl-kjv\" data-code=\"H1004\">steward,</span> <span class=\"wl wl-kjv\" data-code=\"H6965\">Up,</span> <span class=\"wl wl-kjv\" data-code=\"H7291\">follow</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> the <span class=\"wl wl-kjv\" data-code=\"H582\">men;</span> and when thou dost <span class=\"wl wl-kjv\" data-code=\"H5381\">overtake</span> them, <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> unto them, Wherefore have ye <span class=\"wl wl-kjv\" data-code=\"H7999\">rewarded</span> <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> for good?", "5": "Is not this it in which my <span class=\"wl wl-kjv\" data-code=\"H113\">lord</span> <span class=\"wl wl-kjv\" data-code=\"H8354\">drinketh,</span> and whereby <span class=\"wl wl-kjv\" data-code=\"H5172\">indeed</span> he <span class=\"wl wl-kjv\" data-code=\"H5172\">divineth?</span> ye have done <span class=\"wl wl-kjv\" data-code=\"H7489\">evil</span> in so doing.", "6": "And he <span class=\"wl wl-kjv\" data-code=\"H5381\">overtook</span> them, and he <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> unto them these <span class=\"wl wl-kjv\" data-code=\"H428\">same</span> words.", "7": "And they <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, Wherefore <span class=\"wl wl-kjv\" data-code=\"H1696\">saith</span> my <span class=\"wl wl-kjv\" data-code=\"H113\">lord</span> these <span class=\"wl wl-kjv\" data-code=\"H1697\">words?</span> God <span class=\"wl wl-kjv\" data-code=\"H2486\">forbid</span> that thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> should <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> according to this thing:", "8": "Behold, the <span class=\"wl wl-kjv\" data-code=\"H3701\">money,</span> which we <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> in our <span class=\"wl wl-kjv\" data-code=\"H572\">sacks'</span> <span class=\"wl wl-kjv\" data-code=\"H6310\">mouths,</span> we brought <span class=\"wl wl-kjv\" data-code=\"H7725\">again</span> unto thee out of the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H3667\">Canaan:</span> how then should we <span class=\"wl wl-kjv\" data-code=\"H1589\">steal</span> out of thy <span class=\"wl wl-kjv\" data-code=\"H113\">lord's</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> <span class=\"wl wl-kjv\" data-code=\"H3701\">silver</span> or gold?", "9": "With whomsoever of thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> it be <span class=\"wl wl-kjv\" data-code=\"H4672\">found,</span> both let him <span class=\"wl wl-kjv\" data-code=\"H4191\">die,</span> and we also will be my <span class=\"wl wl-kjv\" data-code=\"H113\">lord's</span> bondmen.", "10": "And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Now also let it be according unto your <span class=\"wl wl-kjv\" data-code=\"H1697\">words:</span> he with whom it is <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> shall be my <span class=\"wl wl-kjv\" data-code=\"H5650\">servant;</span> and ye shall be blameless.", "11": "Then they <span class=\"wl wl-kjv\" data-code=\"H4116\">speedily</span> took <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> his <span class=\"wl wl-kjv\" data-code=\"H572\">sack</span> to the <span class=\"wl wl-kjv\" data-code=\"H776\">ground,</span> and <span class=\"wl wl-kjv\" data-code=\"H6605\">opened</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> his sack.", "12": "And he <span class=\"wl wl-kjv\" data-code=\"H2664\">searched,</span> and <span class=\"wl wl-kjv\" data-code=\"H2490\">began</span> at the <span class=\"wl wl-kjv\" data-code=\"H1419\">eldest,</span> and <span class=\"wl wl-kjv\" data-code=\"H3615\">left</span> at the <span class=\"wl wl-kjv\" data-code=\"H6996\">youngest:</span> and the <span class=\"wl wl-kjv\" data-code=\"H1375\">cup</span> was <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> in <span class=\"wl wl-kjv\" data-code=\"H1144\">Benjamin's</span> sack.", "13": "Then they <span class=\"wl wl-kjv\" data-code=\"H7167\">rent</span> their <span class=\"wl wl-kjv\" data-code=\"H8071\">clothes,</span> and <span class=\"wl wl-kjv\" data-code=\"H6006\">laded</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> his <span class=\"wl wl-kjv\" data-code=\"H2543\">ass,</span> and <span class=\"wl wl-kjv\" data-code=\"H7725\">returned</span> to the city.", "14": "And <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> and his <span class=\"wl wl-kjv\" data-code=\"H251\">brethren</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to <span class=\"wl wl-kjv\" data-code=\"H3130\">Joseph's</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house;</span> for he was yet there: and they <span class=\"wl wl-kjv\" data-code=\"H5307\">fell</span> before <span class=\"wl wl-kjv\" data-code=\"H6440\">him</span> on the ground.", "15": "And <span class=\"wl wl-kjv\" data-code=\"H3130\">Joseph</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto them, What <span class=\"wl wl-kjv\" data-code=\"H4639\">deed</span> is this that ye have <span class=\"wl wl-kjv\" data-code=\"H6213\">done?</span> wot <span class=\"wl wl-kjv\" data-code=\"H3045\">ye</span> not that such a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> as I can <span class=\"wl wl-kjv\" data-code=\"H5172\">certainly</span> divine?", "16": "And <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> What shall we <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> unto my <span class=\"wl wl-kjv\" data-code=\"H113\">lord?</span> what shall we <span class=\"wl wl-kjv\" data-code=\"H1696\">speak?</span> or how shall we clear <span class=\"wl wl-kjv\" data-code=\"H6663\">ourselves?</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> hath found <span class=\"wl wl-kjv\" data-code=\"H4672\">out</span> the <span class=\"wl wl-kjv\" data-code=\"H5771\">iniquity</span> of thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servants:</span> behold, we are my <span class=\"wl wl-kjv\" data-code=\"H113\">lord's</span> <span class=\"wl wl-kjv\" data-code=\"H5650\">servants,</span> both we, and he <span class=\"wl wl-kjv\" data-code=\"H1571\">also</span> with <span class=\"wl wl-kjv\" data-code=\"H834\">whom</span> the <span class=\"wl wl-kjv\" data-code=\"H1375\">cup</span> is found.", "17": "And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> God <span class=\"wl wl-kjv\" data-code=\"H2486\">forbid</span> that I should <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> <span class=\"wl wl-kjv\" data-code=\"H2063\">so:</span> but the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> in whose <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> the <span class=\"wl wl-kjv\" data-code=\"H1375\">cup</span> is <span class=\"wl wl-kjv\" data-code=\"H4672\">found,</span> he shall be my <span class=\"wl wl-kjv\" data-code=\"H5650\">servant;</span> and as for you, get you <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> in <span class=\"wl wl-kjv\" data-code=\"H7965\">peace</span> unto your father.", "18": "Then <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> came <span class=\"wl wl-kjv\" data-code=\"H5066\">near</span> unto him, and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H994\">Oh</span> my <span class=\"wl wl-kjv\" data-code=\"H113\">lord,</span> let thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant,</span> I pray thee, <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> a <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> in my <span class=\"wl wl-kjv\" data-code=\"H113\">lord's</span> <span class=\"wl wl-kjv\" data-code=\"H241\">ears,</span> and let not thine <span class=\"wl wl-kjv\" data-code=\"H639\">anger</span> <span class=\"wl wl-kjv\" data-code=\"H2734\">burn</span> against thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant:</span> for thou art even as Pharaoh.", "19": "My <span class=\"wl wl-kjv\" data-code=\"H113\">lord</span> <span class=\"wl wl-kjv\" data-code=\"H7592\">asked</span> his <span class=\"wl wl-kjv\" data-code=\"H5650\">servants,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H3426\">Have</span> ye a <span class=\"wl wl-kjv\" data-code=\"H1\">father,</span> or a brother?", "20": "And we <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto my <span class=\"wl wl-kjv\" data-code=\"H113\">lord,</span> We <span class=\"wl wl-kjv\" data-code=\"H3426\">have</span> a <span class=\"wl wl-kjv\" data-code=\"H1\">father,</span> an old <span class=\"wl wl-kjv\" data-code=\"H2205\">man,</span> and a <span class=\"wl wl-kjv\" data-code=\"H3206\">child</span> of his old <span class=\"wl wl-kjv\" data-code=\"H2208\">age,</span> a little <span class=\"wl wl-kjv\" data-code=\"H6996\">one;</span> and his <span class=\"wl wl-kjv\" data-code=\"H251\">brother</span> is <span class=\"wl wl-kjv\" data-code=\"H4191\">dead,</span> and he alone is <span class=\"wl wl-kjv\" data-code=\"H3498\">left</span> of his <span class=\"wl wl-kjv\" data-code=\"H517\">mother,</span> and his <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> loveth", "21": "And thou <span class=\"wl wl-kjv\" data-code=\"H559\">saidst</span> unto thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servants,</span> Bring him <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> unto me, that I may <span class=\"wl wl-kjv\" data-code=\"H7760\">set</span> mine eyes", "22": "And we <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto my <span class=\"wl wl-kjv\" data-code=\"H113\">lord,</span> The <span class=\"wl wl-kjv\" data-code=\"H5288\">lad</span> <span class=\"wl wl-kjv\" data-code=\"H3201\">cannot</span> <span class=\"wl wl-kjv\" data-code=\"H5800\">leave</span> his <span class=\"wl wl-kjv\" data-code=\"H1\">father:</span> for if he should <span class=\"wl wl-kjv\" data-code=\"H5800\">leave</span> his <span class=\"wl wl-kjv\" data-code=\"H1\">father,</span> his father would die.", "23": "And thou <span class=\"wl wl-kjv\" data-code=\"H559\">saidst</span> unto thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servants,</span> <span class=\"wl wl-kjv\" data-code=\"H3808\">Except</span> your <span class=\"wl wl-kjv\" data-code=\"H6996\">youngest</span> <span class=\"wl wl-kjv\" data-code=\"H251\">brother</span> come <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> with you, ye shall <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> my <span class=\"wl wl-kjv\" data-code=\"H6440\">face</span> no <span class=\"wl wl-kjv\" data-code=\"H7200\">more.</span>", "24": "And it came to pass when we came <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> unto thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> my <span class=\"wl wl-kjv\" data-code=\"H1\">father,</span> we <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> him the <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> of my lord.", "25": "And our <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Go <span class=\"wl wl-kjv\" data-code=\"H7725\">again,</span> and <span class=\"wl wl-kjv\" data-code=\"H7666\">buy</span> us a <span class=\"wl wl-kjv\" data-code=\"H4592\">little</span> food.", "26": "And we <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> We <span class=\"wl wl-kjv\" data-code=\"H3201\">cannot</span> go <span class=\"wl wl-kjv\" data-code=\"H3381\">down:</span> if our <span class=\"wl wl-kjv\" data-code=\"H6996\">youngest</span> <span class=\"wl wl-kjv\" data-code=\"H251\">brother</span> <span class=\"wl wl-kjv\" data-code=\"H3426\">be</span> with us, then will we go <span class=\"wl wl-kjv\" data-code=\"H3381\">down:</span> for we <span class=\"wl wl-kjv\" data-code=\"H3201\">may</span> not <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> the <span class=\"wl wl-kjv\" data-code=\"H376\">man's</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">face,</span> <span class=\"wl wl-kjv\" data-code=\"H369\">except</span> our <span class=\"wl wl-kjv\" data-code=\"H6996\">youngest</span> brother", "27": "And thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> my <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto us, Ye <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> that my <span class=\"wl wl-kjv\" data-code=\"H802\">wife</span> <span class=\"wl wl-kjv\" data-code=\"H3205\">bare</span> me two", "28": "And the <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> went <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> from me, and I <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H2963\">Surely</span> he is torn in <span class=\"wl wl-kjv\" data-code=\"H2963\">pieces;</span> and I saw <span class=\"wl wl-kjv\" data-code=\"H7200\">him</span> not since:", "29": "And if ye <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> this also <span class=\"wl wl-kjv\" data-code=\"H5973\">from</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">me,</span> and <span class=\"wl wl-kjv\" data-code=\"H611\">mischief</span> befall <span class=\"wl wl-kjv\" data-code=\"H7136\">him,</span> ye shall bring <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> my gray <span class=\"wl wl-kjv\" data-code=\"H7872\">hairs</span> with <span class=\"wl wl-kjv\" data-code=\"H7451\">sorrow</span> to the grave.", "30": "Now therefore when I <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> to thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> my <span class=\"wl wl-kjv\" data-code=\"H1\">father,</span> and the <span class=\"wl wl-kjv\" data-code=\"H5288\">lad</span> be not with us; seeing that his <span class=\"wl wl-kjv\" data-code=\"H5315\">life</span> is bound <span class=\"wl wl-kjv\" data-code=\"H7194\">up</span> in the lad's life;", "31": "It shall come to pass, when he <span class=\"wl wl-kjv\" data-code=\"H7200\">seeth</span> that the <span class=\"wl wl-kjv\" data-code=\"H5288\">lad</span> is not with us, that he will <span class=\"wl wl-kjv\" data-code=\"H4191\">die:</span> and thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> shall bring <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> the gray <span class=\"wl wl-kjv\" data-code=\"H7872\">hairs</span> of thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> our <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> with <span class=\"wl wl-kjv\" data-code=\"H3015\">sorrow</span> to the grave.", "32": "For thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> became <span class=\"wl wl-kjv\" data-code=\"H6148\">surety</span> for the <span class=\"wl wl-kjv\" data-code=\"H5288\">lad</span> <span class=\"wl wl-kjv\" data-code=\"H5973\">unto</span> my <span class=\"wl wl-kjv\" data-code=\"H1\">father,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> If I <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> him not unto thee, then I shall bear the <span class=\"wl wl-kjv\" data-code=\"H2398\">blame</span> to my <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> for ever.", "33": "Now therefore, I pray thee, let thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> <span class=\"wl wl-kjv\" data-code=\"H3427\">abide</span> instead of the <span class=\"wl wl-kjv\" data-code=\"H5288\">lad</span> a <span class=\"wl wl-kjv\" data-code=\"H5650\">bondman</span> to my <span class=\"wl wl-kjv\" data-code=\"H113\">lord;</span> and let the <span class=\"wl wl-kjv\" data-code=\"H5288\">lad</span> go <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> with his brethren.", "34": "For <span class=\"wl wl-kjv\" data-code=\"H349\">how</span> shall I go <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> to my <span class=\"wl wl-kjv\" data-code=\"H1\">father,</span> and the <span class=\"wl wl-kjv\" data-code=\"H5288\">lad</span> be not with me? lest peradventure I <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> the <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> that shall come <span class=\"wl wl-kjv\" data-code=\"H4672\">on</span> my father."}};
const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"
const ZELF = D.meta.zelf_abbr;      // afkorting binnen dit hoofdstuk, bv. "Joh 3"

let vertaling = 'SVnu';
let openVers = null;

const popup = document.getElementById('popup');

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen bij dit vers.</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}
</script>
</body>
</html>
