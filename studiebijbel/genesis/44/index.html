over zijn huis ging, en zei: Vul de zakken van deze mannen met voedsel, zoveel als zij kunnen dragen, en leg ieders geld in de mond van zijn zak;","2":"En mijn beker, de zilveren beker, moet u leggen in de mond van de zak van de jongste, met het geld van zijn koren. En hij deed naar Jozefs woord, dat hij gesproken had.","3":"'s Morgens, toen het licht werd, liet men deze mannen vertrekken, hen en hun ezels.","4":"Zij waren de stad uitgegaan; zij waren nog niet ver gekomen, toen Jozef tegen degene die over zijn huis ging, zei: Maak u op en jaag deze mannen achterna; en als u hen zult hebben ingehaald, moet u tegen hen zeggen: Waarom hebt u kwaad met goed vergolden?","5":"Is dit niet dat waaruit mijn heer drinkt, en waarmee hij iets zeker zal waarnemen*? U hebt kwalijk gedaan met wat u gedaan hebt.","6":"En hij haalde hen in, en sprak tegen hen diezelfde woorden.","7":"En zij zeiden tegen hem: Waarom spreekt mijn heer zulke woorden? Het zij verre van uw knechten dat zij zoiets zouden doen.","8":"Zie, het geld dat wij in de mond van onze zakken vonden, hebben wij uit het land Kanaän naar u teruggebracht; hoe zouden wij dan uit het huis van uw heer zilver of goud stelen?","9":"Bij wie van uw knechten hij gevonden wordt, laat hem sterven; en ook wij zullen dan mijn heer tot slaven zijn!","10":"En hij zei: Laat het nu ook zo zijn, naar uw woorden! Bij wie hij gevonden wordt, laat die mijn slaaf zijn; maar u zult onschuldig zijn.","11":"En zij haastten zich, en ieder zette zijn zak af op de grond, en ieder opende zijn zak.","12":"En hij doorzocht ze, beginnend bij de grootste en eindigend bij de kleinste; en de beker werd gevonden in de zak van Benjamin.","13":"Toen scheurden zij hun kleren, en ieder man laadde zijn ezel weer op, en zij keerden terug naar de stad.","14":"En Juda kwam met zijn broers in het huis van Jozef; want hij was daar nog zelf; en zij vielen voor zijn gezicht neer op de grond.","15":"En Jozef zei tegen hen: Wat is dit voor daad die u gedaan hebt? Weet u niet dat zo'n man als ik zeker zoiets kan waarnemen?","16":"Toen zei Juda: Wat zullen wij tegen mijn heer zeggen, wat zullen wij spreken, en hoe zullen wij ons rechtvaardigen? God heeft de ongerechtigheid van uw knechten aan het licht gebracht; zie, wij zijn slaven van mijn heer, zowel wij als hij bij wie de beker gevonden is.","17":"Maar hij zei: Het zij verre van mij om zoiets te doen! De man bij wie de beker gevonden is, die zal mijn slaaf zijn; maar u, trek in vrede op naar uw vader.","18":"Toen kwam Juda dichter bij hem, en zei: Och, mijn heer! Laat toch uw knecht een woord spreken voor de oren van mijn heer, en laat uw toorn tegen uw knecht niet ontsteken; want u bent gelijk aan Farao!","19":"Mijn heer vroeg zijn knechten en zei: Hebt u een vader of broer?","20":"Toen zeiden wij tegen mijn heer: Wij hebben een oude vader, en een jongen van het ouderdom, de kleinste, wiens broer dood is, en hij is alleen van zijn moeder overgebleven, en zijn vader heeft hem lief.","21":"Toen zei u tegen uw knechten: Breng hem bij mij, opdat ik mijn oog op hem sla.","22":"En wij zeiden tegen mijn heer: Die jongen kan zijn vader niet verlaten; als hij zijn vader verlaat, zal zijn vader sterven.","23":"Toen zei u tegen uw knechten: Als uw kleinste broer niet met u meekomt, zult u mijn gezicht niet meer zien.","24":"En het gebeurde, toen wij naar uw knecht, mijn vader, opgetrokken waren, dat wij hem de woorden van mijn heer verteld hebben;","25":"En dat onze vader gezegd heeft: Ga terug, koop ons wat voedsel;","26":"Toen hebben wij gezegd: Wij kunnen niet aftrekken; als onze kleinste broer bij ons is, zullen wij aftrekken; want wij mogen het gezicht van die man niet zien, als deze onze kleinste broer niet bij ons is.","27":"Toen zei uw knecht, mijn vader, tegen ons: U weet dat mijn vrouw mij twee zonen gebaard heeft.","28":"En de één is bij mij weggegaan, en ik heb gezegd: Voorzeker, hij is zeker verscheurd! En ik heb hem niet meer gezien tot nu toe.","29":"Als u nu deze ook van mijn gezicht wegneemt, en hem een ongeluk overkomt, zult u mijn grijze haren met verdriet naar het graf doen afdalen!","30":"Nu dan, als ik bij uw knecht, mijn vader, kom, en de jongen is niet bij ons (want zijn ziel is aan diens ziel gebonden),","31":"Dan zal het gebeuren, als hij ziet dat de jongen er niet is, dat hij sterft; en uw knechten zullen de grijze haren van uw knecht, onze vader, met verdriet naar het graf doen afdalen.","32":"Want uw knecht is borg gebleven voor deze jongen bij mijn vader, en zei: Als ik hem niet bij u terugbreng, zal ik alle dagen tegen mijn vader gezondigd hebben!","33":"Nu dan, laat toch uw knecht in plaats van deze jongen als slaaf van mijn heer blijven, en laat de jongen met zijn broers optrekken!","34":"Want hoe zou ik optrekken naar mijn vader, als de jongen niet bij mij was, zodat ik het verdriet niet hoef te zien dat mijn vader zou overkomen."},"SV":{"1":"En hij gebood dengene, die over zijn huis was, zeggende: Vul de zakken dezer mannen met spijze, naar dat zij zullen kunnen dragen, en leg ieders mans geld in den mond van zijn zak;","2":"En mijn beker, den zilveren beker, zult gij leggen in den mond van den zak des kleinsten, met het geld van zijn koren. En hij deed naar Jozefs woord, hetwelk hij gesproken had.","3":"Des morgens, als het licht werd, zo liet men deze mannen trekken, hen en hun ezelen.","4":"Zij zijn ter stad uitgegaan; zij waren niet verre gekomen, als Jozef tot dengene, die over zijn huis was, zeide: Maak u op, en jaag die mannen achterna; en als gij hen zult achterhaald hebben, zo zult gij tot hen zeggen: Waarom hebt gij kwaad voor goed vergolden?","5":"Is het deze niet, waaruit mijn heer drinkt? en waarbij hij *iets* zekerlijk waarnemen zal? Gij hebt kwalijk gedaan, wat gij gedaan hebt.","6":"En hij achterhaalde hen, en sprak tot hen diezelfde woorden.","7":"En zij zeiden tot hem: Waarom spreekt mijn heer zulke woorden? Het zij verre van uw knechten, dat zij zodanig een ding doen zouden.","8":"Zie, het geld, dat wij in den mond onzer zakken vonden, hebben wij tot u uit het land Kanaän wedergebracht; hoe zouden wij dan uit het huis uws heren zilver of goud stelen?","9":"Bij wien van uw knechten hij gevonden zal worden, dat hij sterve; en ook zullen wij mijn heer tot slaven zijn!","10":"En hij zeide: Dit zij nu ook alzo, naar uw woorden! Bij wien hij gevonden wordt, die zij mijn slaaf; maar gijlieden zult onschuldig zijn.","11":"En zij haastten, en iegelijk zette zijn zak af op de aarde, en iegelijk opende zijn zak.","12":"En hij doorzocht, beginnende met den grootste, en voleindigende met den kleinste; en die beker werd gevonden in den zak van Benjamin.","13":"Toen scheurden zij hun klederen; en ieder man laadde zijn ezel op, en zij keerden weder naar de stad.","14":"En Juda kwam met zijn broederen in het huis van Jozef; want hij was nog zelf aldaar; en zij vielen voor zijn aangezicht neder ter aarde.","15":"En Jozef zeide tot hen: Wat daad is dit, die gij gedaan hebt? Weet gij niet, dat zulk een man als ik *dat* zekerlijk waarnemen zoude?","16":"Toen zeide Juda: Wat zullen wij tot mijn heer zeggen, wat zullen wij spreken, en wat zullen wij ons rechtvaardigen? God heeft de ongerechtigheid uwer knechten gevonden; zie, wij zijn mijns heren slaven, zo wij, als hij, in wiens hand de beker gevonden is.","17":"Maar hij zeide: Het zij verre van mij zulks te doen! de man, in wiens hand de beker gevonden is, die zal mijn slaaf zijn; doch trekt gijlieden op in vrede tot uw vader.","18":"Toen naderde Juda tot hem, en zeide: Och, mijn heer! laat toch uw knecht een woord spreken voor mijns heren oren, en laat uw toorn tegen uw knecht niet ontsteken; want gij zijt even gelijk Farao!","19":"Mijn heer vraagde zijn knechten, zeggende: Hebt gijlieden een vader, of broeder?","20":"Zo zeiden wij tot mijn heer: Wij hebben een ouden vader, en een jongeling des ouderdoms, den kleinsten, wiens broeder dood is, en hij is alleen van zijn moeder overgebleven, en zijn vader heeft hem lief.","21":"Toen zeidet gij tot uw knechten: Brengt hem af tot mij, dat ik mijn oog op hem sla.","22":"En wij zeiden tot mijn heer: Die jongeling zal zijn vader niet kunnen verlaten; indien hij zijn vader verlaat, zo zal hij sterven.","23":"Toen zeidet gij tot uw knechten: Indien uw kleinste broeder met u niet afkomt, zo zult gij mijn aangezicht niet meer zien.","24":"En het is geschied, als wij tot uw knecht, mijn vader, opgetrokken zijn, en wij hem de woorden mijns heren verhaald hebben;","25":"En dat onze vader gezegd heeft: Keert weder. koopt ons een weinig spijze;","26":"Zo hebben wij gezegd: Wij zullen niet mogen aftrekken; indien onze kleinste broeder bij ons is, zo zullen wij aftrekken; want wij zullen het aangezicht van dien man niet mogen zien, zo deze onze kleinste broeder niet bij ons is.","27":"Toen zeide uw knecht, mijn vader, tot ons: Gijlieden weet, dat mijn huisvrouw er mij twee gebaard heeft.","28":"En de een is van mij uitgegaan, en ik heb gezegd: Voorwaar, hij is gewisselijk verscheurd geworden! en ik heb hem niet gezien tot nu toe.","29":"Indien gij nu dezen ook van mijn aangezicht wegneemt, en hem een verderf ontmoette, zo zoudt gij mijn grauwe haren met jammer ten grave doen nederdalen!","30":"Nu dan, als ik tot uw knecht, mijn vader, kome, en de jongeling is niet bij ons (alzo zijn ziel aan de ziel van dezen gebonden is),","31":"Zo zal het geschieden, als hij ziet, dat de jongeling er niet is, dat hij sterven zal; en uw knechten zullen de grauwe haren van uw knecht, onzen vader, met droefenis ten grave doen nederdalen.","32":"Want uw knecht is voor deze jongeling borg bij mijn vader, zeggende: Zo ik hem tot u niet wederbreng, zo zal ik tegen mijn vader alle dagen gezondigd hebben!","33":"Nu dan, laat toch uw knecht voor dezen jongeling slaaf van mijn heer blijven, en laat den jongeling met zijn broederen optrekken!","34":"Want hoe zoude ik optrekken tot mijn vader, indien de jongeling niet met mij was, opdat ik den jammer niet zie, welke mijn vader overkomen zou."},"KJV":{"1":"And he commanded the steward of his house, saying, Fill the men's sacks *with* food, as much as they can carry, and put every man's money in his sack's mouth.","2":"And put my cup, the silver cup, in the sack's mouth of the youngest, and his corn money. And he did according to the word that Joseph had spoken.","3":"As soon as the morning was light, the men were sent away, they and their asses.","4":"*And* when they were gone out of the city, *and* not *yet* far off, Joseph said unto his steward, Up, follow after the men; and when thou dost overtake them, say unto them, Wherefore have ye rewarded evil for good?","5":"*Is* not this *it* in which my lord drinketh, and whereby indeed he divineth? ye have done evil in so doing.","6":"And he overtook them, and he spake unto them these same words.","7":"And they said unto him, Wherefore saith my lord these words? God forbid that thy servants should do according to this thing:","8":"Behold, the money, which we found in our sacks' mouths, we brought again unto thee out of the land of Canaan: how then should we steal out of thy lord's house silver or gold?","9":"With whomsoever of thy servants it be found, both let him die, and we also will be my lord's bondmen.","10":"And he said, Now also *let* it *be* according unto your words: he with whom it is found shall be my servant; and ye shall be blameless.","11":"Then they speedily took down every man his sack to the ground, and opened every man his sack.","12":"And he searched, *and* began at the eldest, and left at the youngest: and the cup was found in Benjamin's sack.","13":"Then they rent their clothes, and laded every man his ass, and returned to the city.","14":"And Judah and his brethren came to Joseph's house; for he *was* yet there: and they fell before him on the ground.","15":"And Joseph said unto them, What deed *is* this that ye have done? wot ye not that such a man as I can certainly divine?","16":"And Judah said, What shall we say unto my lord? what shall we speak? or how shall we clear ourselves? God hath found out the iniquity of thy servants: behold, we *are* my lord's servants, both we, and *he* also with whom the cup is found.","17":"And he said, God forbid that I should do so: *but* the man in whose hand the cup is found, he shall be my servant; and as for you, get you up in peace unto your father.","18":"Then Judah came near unto him, and said, Oh my lord, let thy servant, I pray thee, speak a word in my lord's ears, and let not thine anger burn against thy servant: for thou *art* even as Pharaoh.","19":"My lord asked his servants, saying, Have ye a father, or a brother?","20":"And we said unto my lord, We have a father, an old man, and a child of his old age, a little one; and his brother is dead, and he alone is left of his mother, and his father loveth","21":"And thou saidst unto thy servants, Bring him down unto me, that I may set mine eyes","22":"And we said unto my lord, The lad cannot leave his father: for *if* he should leave his father, *his father* would die.","23":"And thou saidst unto thy servants, Except your youngest brother come down with you, ye shall see my face no more.","24":"And it came to pass when we came up unto thy servant my father, we told him the words of my lord.","25":"And our father said, Go again, *and* buy us a little food.","26":"And we said, We cannot go down: if our youngest brother be with us, then will we go down: for we may not see the man's face, except our youngest brother","27":"And thy servant my father said unto us, Ye know that my wife bare me two","28":"And the one went out from me, and I said, Surely he is torn in pieces; and I saw him not since:","29":"And if ye take this also from me, and mischief befall him, ye shall bring down my gray hairs with sorrow to the grave.","30":"Now therefore when I come to thy servant my father, and the lad *be* not with us; seeing that his life is bound up in the lad's life;","31":"It shall come to pass, when he se 3701\">money.</span> And he <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> according to the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> that <span class=\"wl wl-kjv\" data-code=\"H3130\">Joseph</span> had spoken.","3":"As soon as the <span class=\"wl wl-kjv\" data-code=\"H1242\">morning</span> was <span class=\"wl wl-kjv\" data-code=\"H215\">light,</span> the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> were sent <span class=\"wl wl-kjv\" data-code=\"H7971\">away,</span> they and their asses.","4":"And when they were gone <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> of the <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> and not yet far <span class=\"wl wl-kjv\" data-code=\"H7368\">off,</span> <span class=\"wl wl-kjv\" data-code=\"H3130\">Joseph</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto his <span class=\"wl wl-kjv\" data-code=\"H1004\">steward,</span> <span class=\"wl wl-kjv\" data-code=\"H6965\">Up,</span> <span class=\"wl wl-kjv\" data-code=\"H7291\">follow</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> the <span class=\"wl wl-kjv\" data-code=\"H582\">men;</span> and when thou dost <span class=\"wl wl-kjv\" data-code=\"H5381\">overtake</span> them, <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> unto them, Wherefore have ye <span class=\"wl wl-kjv\" data-code=\"H7999\">rewarded</span> <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> for good?","5":"Is not this it in which my <span class=\"wl wl-kjv\" data-code=\"H113\">lord</span> <span class=\"wl wl-kjv\" data-code=\"H8354\">drinketh,</span> and whereby <span class=\"wl wl-kjv\" data-code=\"H5172\">indeed</span> he <span class=\"wl wl-kjv\" data-code=\"H5172\">divineth?</span> ye have done <span class=\"wl wl-kjv\" data-code=\"H7489\">evil</span> in so doing.","6":"And he <span class=\"wl wl-kjv\" data-code=\"H5381\">overtook</span> them, and he <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> unto them these <span class=\"wl wl-kjv\" data-code=\"H428\">same</span> words.","7":"And they <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, Wherefore <span class=\"wl wl-kjv\" data-code=\"H1696\">saith</span> my <span class=\"wl wl-kjv\" data-code=\"H113\">lord</span> these <span class=\"wl wl-kjv\" data-code=\"H1697\">words?</span> God <span class=\"wl wl-kjv\" data-code=\"H2486\">forbid</span> that thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> should <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> according to this thing:","8":"Behold, the <span class=\"wl wl-kjv\" data-code=\"H3701\">money,</span> which we <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> in our <span class=\"wl wl-kjv\" data-code=\"H572\">sacks'</span> <span class=\"wl wl-kjv\" data-code=\"H6310\">mouths,</span> we brought <span class=\"wl wl-kjv\" data-code=\"H7725\">again</span> unto thee out of the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H3667\">Canaan:</span> how then should we <span class=\"wl wl-kjv\" data-code=\"H1589\">steal</span> out of thy <span class=\"wl wl-kjv\" data-code=\"H113\">lord's</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> <span class=\"wl wl-kjv\" data-code=\"H3701\">silver</span> or gold?","9":"With whomsoever of thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> it be <span class=\"wl wl-kjv\" data-code=\"H4672\">found,</span> both let him <span class=\"wl wl-kjv\" data-code=\"H4191\">die,</span> and we also will be my <span class=\"wl wl-kjv\" data-code=\"H113\">lord's</span> bondmen.","10":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Now also let it be according unto your <span class=\"wl wl-kjv\" data-code=\"H1697\">words:</span> he with whom it is <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> shall be my <span class=\"wl wl-kjv\" data-code=\"H5650\">servant;</span> and ye shall be blameless.","11":"Then they <span class=\"wl wl-kjv\" data-code=\"H4116\">speedily</span> took <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> his <span class=\"wl wl-kjv\" data-code=\"H572\">sack</span> to the <span class=\"wl wl-kjv\" data-code=\"H776\">ground,</span> and <span class=\"wl wl-kjv\" data-code=\"H6605\">opened</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> his sack.","12":"And he <span class=\"wl wl-kjv\" data-code=\"H2664\">searched,</span> and <span class=\"wl wl-kjv\" data-code=\"H2490\">began</span> at the <span class=\"wl wl-kjv\" data-code=\"H1419\">eldest,</span> and <span class=\"wl wl-kjv\" data-code=\"H3615\">left</span> at the <span class=\"wl wl-kjv\" data-code=\"H6996\">youngest:</span> and the <span class=\"wl wl-kjv\" data-code=\"H1375\">cup</span> was <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> in <span class=\"wl wl-kjv\" data-code=\"H1144\">Benjamin's</span> sack.","13":"Then they <span class=\"wl wl-kjv\" data-code=\"H7167\">rent</span> their <span class=\"wl wl-kjv\" data-code=\"H8071\">clothes,</span> and <span class=\"wl wl-kjv\" data-code=\"H6006\">laded</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> his <span class=\"wl wl-kjv\" data-code=\"H2543\">ass,</span> and <span class=\"wl wl-kjv\" data-code=\"H7725\">returned</span> to the city.","14":"And <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> and his <span class=\"wl wl-kjv\" data-code=\"H251\">brethren</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to <span class=\"wl wl-kjv\" data-code=\"H3130\">Joseph's</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house;</span> for he was yet there: and they <span class=\"wl wl-kjv\" data-code=\"H5307\">fell</span> before <span class=\"wl wl-kjv\" data-code=\"H6440\">him</span> on the ground.","15":"And <span class=\"wl wl-kjv\" data-code=\"H3130\">Joseph</span> <spa // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle

// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}

      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
