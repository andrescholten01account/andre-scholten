egs; en de engelen van God ontmoetten hem.","2":"En Jakob zei, toen hij hen zag: Dit is een leger van God! En hij noemde de naam van die plaats Mahanaim.","3":"En Jakob zond boden voor zich uit naar Ezau, zijn broer, naar het land Seir, de landstreek van Edom.","4":"En hij gebood hun: Zo zult u zeggen tegen mijn heer, tegen Ezau: Zo zegt Jakob, uw knecht: Ik heb als vreemdeling gewoond bij Laban, en heb daar tot nu toe vertoefd;","5":"en ik heb ossen en ezels, schapen en knechten en dienstmeisjes; en ik heb gezonden om mijn heer dit aan te zeggen, opdat ik genade vind in uw ogen.","6":"En de boden kwamen terug bij Jakob en zeiden: Wij zijn gekomen bij uw broer, bij Ezau; en hij trekt u ook al tegemoet, met vierhonderd man bij zich.","7":"Toen werd Jakob erg bang en benauwd; en hij verdeelde het volk dat bij hem was, en de schapen, en de runderen, en de kamelen, in twee legers;","8":"want hij zei: Als Ezau op het ene leger afkomt en het verslaat, dan zal het overgebleven leger ontkomen.","9":"Verder zei Jakob: O, God van mijn vader Abraham, en God van mijn vader Izak, o HEERE! Die tegen mij gezegd hebt: Keer terug naar uw land en naar uw familie, en Ik zal u goeddoen!","10":"Ik ben geringer dan al de weldaden en al de trouw die U aan Uw knecht bewezen hebt; want met mijn staf ben ik deze Jordaan overgestoken, en nu ben ik tot twee legers geworden!","11":"Red mij toch uit de hand van mijn broer, uit de hand van Ezau; want ik vrees hem, dat hij misschien komt en mij verslaat, de moeder met de kinderen!","12":"Zeker, U hebt gezegd: Ik zal zeker goed voor u zijn, en Ik zal uw nageslacht maken als het zand van de zee, dat vanwege de hoeveelheid niet geteld kan worden!","13":"En hij overnachtte daar diezelfde nacht; en hij nam van wat hem onder handen kwam een geschenk voor Ezau, zijn broer;","14":"tweehonderd geiten en twintig bokken, tweehonderd ooien en twintig rammen;","15":"dertig zogende kamelinnen met haar veulens, veertig koeien en tien stieren, twintig ezelinnen en tien jonge ezels.","16":"En hij gaf die in de hand van zijn knechten, elke kudde apart; en hij zei tegen zijn knechten: Trekt u voor mij uit, en houdt ruimte tussen de ene kudde en de andere kudde.","17":"En hij gebood de eerste: Wanneer Ezau, mijn broer, u tegenkomt en u vraagt: Van wie bent u? En waar gaat u heen? En van wie zijn deze dieren voor u?","18":"dan zult u zeggen: Dat is een geschenk van uw knecht Jakob, gezonden aan mijn heer, aan Ezau; en zie, hijzelf is ook achter ons!","19":"En hij gebood ook de tweede, ook de derde, ook allen die de kudden achterna gingen: Naar datzelfde woord zult u spreken tegen Ezau, wanneer u hem vindt.","20":"En u zult ook zeggen: Zie, uw knecht Jakob is achter ons! Want hij zei: Ik zal hem verzoenen met dit geschenk, dat voor mij uit gaat, en daarna zal ik hem zien; misschien zal hij mij aannemen.","21":"Zo ging dat geschenk voor hem uit; maar hijzelf overnachtte diezelfde nacht in het leger.","22":"En hij stond in diezelfde nacht op, en nam zijn twee vrouwen, en zijn twee dienstmeisjes, en zijn elf kinderen, en trok over de doorwaadbare plaats van de Jabbok.","23":"En hij nam ze, en liet hen de beek oversteken; en hij liet oversteken wat hij had.","24":"Maar Jakob bleef alleen achter; en een man worstelde met hem, totdat de dageraad opging.","25":"En toen Hij zag dat Hij niet de overhand over hem kreeg, raakte Hij zijn heupgewricht aan, zodat het heupgewricht van Jakob verwrongen raakte, terwijl Hij met hem worstelde.","26":"En Hij zei: Laat Mij gaan, want de dageraad is opgegaan. Maar hij zei: Ik zal U niet laten gaan, tenzij U mij zegent.","27":"En Hij zei tegen hem: Hoe is uw naam? En hij zei: Jakob.","28":"Toen zei Hij: Uw naam zal voortaan niet meer Jakob heten, maar Israël; want u hebt zich als een vorst gedragen tegenover God en tegenover de mensen, en hebt de overhand gekregen.","29":"En Jakob vroeg: Vertel mij toch Uw naam. En Hij zei: Waarom vraagt u naar Mijn naam? En Hij zegende hem daar.","30":"En Jakob noemde de naam van die plaats Pniël: Want, *zei hij*, ik heb God gezien *van* aangezicht tot aangezicht, en mijn ziel is gered.","31":"En de zon ging voor hem op, toen hij door Pniël gegaan was; en hij hinkte op zijn heup.","32":"Daarom eten de kinderen van Israël tot op deze dag de verrukte zenuw niet, die op het heupgewricht zit, omdat Hij het heupgewricht van Jakob had aangeraakt, bij de verrukte zenuw."},"SV":{"1":"Jakob toog ook zijns weegs; en de engelen Gods ontmoetten hem.","2":"En Jakob zeide, met dat hij hen zag: Dit is een heirleger Gods! en hij noemde den naam derzelver plaats Mahanaim.","3":"En Jakob zond boden uit voor zijn aangezicht tot Ezau, zijn broeder, naar het land Seir, de landstreek van Edom.","4":"En hij gebood hun, zeggende: Zo zult gij zeggen tot mijn heer, tot Ezau: Zo zegt Jakob, uw knecht: Ik heb als vreemdeling gewoond bij Laban, en heb er tot nu toe vertoefd;","5":"En ik heb ossen en ezelen, schapen en knechten en maagden; en ik heb gezonden om mijn heer aan te zeggen, opdat ik genade vinde in uw ogen.","6":"En de boden kwamen weder tot Jakob, zeggende: Wij zijn gekomen tot uw broeder, tot Ezau; en ook trekt hij u tegemoet, en vierhonderd mannen met hem.","7":"Toen vreesde Jakob zeer, en hem was bange; en hij verdeelde het volk, dat met hem was, en de schapen, en de runderen, en de kemels, in twee heiren;","8":"Want hij zeide: Indien Ezau op het ene heir komt, en slaat het, zo zal het overgeblevene heir ontkomen.","9":"Voorts zeide Jakob: O, God mijns vaders Abrahams, en God mijns vaders Izaks, o HEERE! Die tot mij gezegd hebt: Keer weder tot uw land, en tot uw maagschap, en Ik zal wel bij u doen!","10":"Ik ben geringer dan al deze weldadigheden, en dan al deze trouw, die Gij aan Uw knecht gedaan hebt; want ik ben met mijn staf over deze Jordaan gegaan, en nu ben ik tot twee heiren geworden!","11":"Ruk mij toch uit mijns broeders hand, uit Ezau’s hand; want ik vreze hem, dat hij niet misschien kome, en mij sla, de moeder met de zonen!","12":"Gij hebt immers gezegd: Ik zal gewisselijk bij u weldoen, en Ik zal uw zaad stellen als het zand der zee, dat vanwege de menigte niet geteld kan worden!","13":"En hij vernachtte aldaar dienzelfden nacht; en hij nam van hetgeen, dat hem in zijn hand kwam, een geschenk voor Ezau zijn broeder;","14":"Tweehonderd geiten en twintig bokken, tweehonderd ooien en twintig rammen;","15":"Dertig zogende kemelinnen met haar veulens, veertig koeien en tien varren, twintig ezelinnen en tien jonge ezels.","16":"En hij gaf die in de hand zijner knechten, elke kudde bijzonder; en hij zeide tot zijn knechten: Gaat gijlieden door, voor mijn aangezicht, en stelt ruimte tussen kudde en tussen kudde.","17":"En hij gebood de eerste, zeggende: Wanneer Ezau, mijn broeder, u ontmoeten zal, en u vragen, zeggende: Wiens zijt gij? en waarheen gaat gij? en wiens zijn deze voor uw aangezicht?","18":"Zo zult gij zeggen: Dat is een geschenk van uw knecht Jakob, gezonden tot mijn heer, tot Ezau, en zie, hij zelf is ook achter ons!","19":"En hij gebood ook den tweede, ook den derde, ook allen, die de kudden nagingen, zeggende: Naar ditzelfde woord zult gij spreken tot Ezau, als gij hem vinden zult.","20":"En gij zult ook zeggen: Zie, uw knecht Jakob is achter ons! Want hij zeide: Ik zal zijn aangezicht verzoenen met dit geschenk, dat voor mijn aangezicht gaat, en daarna zal ik zijn aangezicht zien; misschien zal hij mijn aangezicht aannemen.","21":"Alzo ging dat geschenk heen voor zijn aangezicht; doch hij zelf vernachtte dienzelfden nacht in het leger.","22":"En hij stond op in dienzelfden nacht, en hij nam zijn twee vrouwen, en zijn twee dienstmaagden, en zijn elf kinderen, en hij toog over het veer van de Jabbok.","23":"En hij nam ze, en deed hen over die beek trekken; en hij deed overtrekken hetgeen hij had.","24":"Doch Jakob bleef alleen over; en een man worstelde met hem, totdat de dageraad opging.","25":"En toen Hij zag, dat Hij hem niet overmocht, roerde Hij het gewricht zijner heup aan, zodat het gewricht van Jakobs heup verwrongen werd, als Hij met hem worstelde.","26":"En Hij zeide: Laat Mij gaan, want de dageraad is opgegaan. Maar hij zeide: Ik zal U niet laten gaan, tenzij dat Gij mij zegent.","27":"En Hij zeide tot hem: Hoe is uw naam? En hij zeide: Jakob.","28":"Toen zeide Hij: Uw naam zal voortaan niet Jakob heten, maar Israël; want gij hebt u vorstelijk gedragen met God en met de mensen, en hebt overmocht.","29":"En Jakob vraagde, en zeide: Geef toch Uw naam te kennen. En Hij zeide: Waarom is het, dat gij naar Mijn naam vraagt? En Hij zegende hem aldaar.","30":"En Jakob noemde den naam dier plaats Pniël: Want, *zeide* *hij* ik heb God gezien *van* aangezicht tot aangezicht, en mijn ziel is gered geweest.","31":"En de zon rees hem op, als hij door Pniël gegaan was; en hij was hinkende aan zijn heup.","32":"Daarom eten de kinderen Israëls de verrukte zenuw niet, die op het gewricht der heup is, tot op dezen dag, omdat Hij het gewricht van Jakobs heup aangeroerd had, aan de verrukte zenuw."},"KJV":{"1":"And Jacob went on his way, and the angels of God met","2":"And when Jacob saw them, he said, This *is* God's host: and he called the name of that place Mahanaim.","3":"And Jacob sent messengers before him to Esau his brother unto the land of Seir, the country of Edom.","4":"And he commanded them, saying, Thus shall ye speak unto my lord Esau; Thy servant Jacob saith thus, I have sojourned with Laban, and stayed there","5":"And I have oxen, and asses, flocks, and menservants, and womenservants: and I have sent to tell my lord, that I may find grace in thy sight.","6":"And the messengers returned to Jacob, saying, We came to thy brother Esau, and also he cometh to meet thee, and four hundred men","7":"Then Jacob was greatly afraid and distressed: and he divided the people that *was* with him, and the flocks, and herds, and the camels, into two bands;","8":"And said, If Esau come to the one company, and smite it, then the other company which is left shall escape.","9":"And Jacob said, O God of my father Abraham, and God of my father Isaac, the LORD which saidst unto me, Return unto thy country, and to thy kindred, and I will deal well","10":"I am not worthy of the least of all the mercies, and of all the truth, which thou hast shewed unto thy servant; for with my staff I passed over this Jordan; and now I am become two bands.","11":"Deliver me, I pray thee, from the hand of my brother, from the hand of Esau: for I fear him, lest he will come and smite me, *and* the mother with the children.","12":"And thou saidst, I will surely do thee good, and make thy seed as the sand of the sea, which cannot be numbered for multitude.","13":"And he lodged there that same night; and took of that which came to his hand a present for Esau his brother;","14":"Two hundred she goats, and twenty he goats, two hundred ewes, and twenty rams,","15":"Thirty milch camels with their colts, forty kine, and ten bulls, twenty she asses, and ten foals.","16":"And he delivered *them* into the hand of his servants, every drove by themselves; and said unto his servants, Pass over before me, and put a space betwixt drove and drove.","17":"And he commanded the foremost, saying, When Esau my brother meeteth thee, and asketh thee, saying, Whose *art* thou? and whither goest thou? and whose *are* these before","18":"Then thou shalt say, *They be* thy servant Jacob's; it *is* a present sent unto my lord Esau: and, behold, also he *is* behind us.","19":"And so commanded he the second, and the third, and all that followed the droves, saying, On this manner shall ye speak unto Esau, when ye find","20":"And say ye moreover, Behold, thy servant Jacob *is* behind us. For he said, I will appease him with the present that goeth before me, and afterward I will see his face; peradventure he will accept of me.","21":"So went the present over before him: and himself lodged that night in the company.","22":"And he rose up that night, and took his two wives, and his two womenservants, and his eleven sons, and passed over the ford Jabbok.","23":"And he took them, and sent them over the brook, and sent over","24":"And Jacob was left alone; and there wrestled a man with him until the breaking of the day.","25":"And when he saw that he prevailed not against him, he touched the hollow of his thigh; and the hollow of Jacob's thigh was out of joint, as he wrestled","26":"And he said, Let me go, for the day breaketh. And he said, I will not let thee go, except thou bless","27":"And he said unto him, What *is* thy name? And he said, Jacob.","28":"And he said, Thy name shall be called no more Jacob, but Israel: for as a prince hast thou power with God and with men, and hast prevailed.","29":"And Jacob asked *him*, and said, Tell *me*, I pray thee, thy name. And he said, Wherefore *is* it *that* thou dost ask after my name? And he blessed","30":"And Jacob called the name of the place Peniel: for I have seen God face to face, and my life is preserved.","31":"And as he passed over Penuel the sun rose upon him, and he halted upon his thigh.","32":"Therefore the children of Israel eat not *of* the sinew which shrank, which *is* upon the hollow of the thigh, unto this day: because he touched the hollow of Jacob's thigh in the sinew that shrank."}},"tsk":{"1":[{"kopje":"engelen","refs":["Ps 91:11","Hebr 1:4","1 Kor 3:22","Ef 3:10"]}],"2":[{"kopje":"van God","refs":["Joz 5:14","2 Kon 6:17","Ps 34:8","Ps 103:21","Ps 148:2","Dan 10:20","Luk 2:13"]},{"kopje":"de naam","refs":["Joz 21:38","2 Sam 2:8","2 Sam 2:12","2 Sam 17:24","2 Sam 17:26","2 Sam 17:27","1 Kon 2:8","1 Kon 4:14"]},{"kopje":"Mahanaim","refs":["Hoogl 6:13"]}],"3":[{"kopje":"zond","refs":["Mal 3:1","Luk 9:52","Luk 14:31","Luk 14:32"]},{"kopje":"Seir","refs":["Gen 14:6","Gen 33:14","Gen 33:16","Gen 36:6-8","Deut 2:5","Deut 2:22","Joz 24:4"]},{"kopje":"Edom","refs":["Gen 25:30"]}],"4":[{"kopje":"mijn heer","refs":["Gen 32:5","Gen 32:18","Gen 4:7","Gen 23:6","Gen 27:29","Gen 27:37","G  data-code=\"H3290\">Jacob</span> saw <span class=\"wl wl-kjv\" data-code=\"H7200\">them,</span> he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> This is <span class=\"wl wl-kjv\" data-code=\"H430\">God's</span> <span class=\"wl wl-kjv\" data-code=\"H4264\">host:</span> and he <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of that <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> Mahanaim.","3":"And <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> <span class=\"wl wl-kjv\" data-code=\"H4397\">messengers</span> before <span class=\"wl wl-kjv\" data-code=\"H6440\">him</span> to <span class=\"wl wl-kjv\" data-code=\"H6215\">Esau</span> his <span class=\"wl wl-kjv\" data-code=\"H251\">brother</span> unto the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H8165\">Seir,</span> the <span class=\"wl wl-kjv\" data-code=\"H7704\">country</span> of Edom.","4":"And he <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> them, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Thus shall ye <span class=\"wl wl-kjv\" data-code=\"H559\">speak</span> unto my <span class=\"wl wl-kjv\" data-code=\"H113\">lord</span> <span class=\"wl wl-kjv\" data-code=\"H6215\">Esau;</span> Thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> thus, I have <span class=\"wl wl-kjv\" data-code=\"H1481\">sojourned</span> with <span class=\"wl wl-kjv\" data-code=\"H3837\">Laban,</span> and stayed there","5":"And I have <span class=\"wl wl-kjv\" data-code=\"H7794\">oxen,</span> and <span class=\"wl wl-kjv\" data-code=\"H2543\">asses,</span> <span class=\"wl wl-kjv\" data-code=\"H6629\">flocks,</span> and <span class=\"wl wl-kjv\" data-code=\"H5650\"> e=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H4264\">company,</span> and smite <span class=\"wl wl-kjv\" data-code=\"H5221\">it,</span> then the other <span class=\"wl wl-kjv\" data-code=\"H4264\">company</span> which is <span class=\"wl wl-kjv\" data-code=\"H7604\">left</span> shall escape.","9":"And <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> O <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of my <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham,</span> and <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of my <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> <span class=\"wl wl-kjv\" data-code=\"H3327\">Isaac,</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> which <span class=\"wl wl-kjv\" data-code=\"H559\">saidst</span> unto me, <span class=\"wl wl-kjv\" data-code=\"H7725\">Return</span> unto thy <span class=\"wl wl-kjv\" data-code=\"H776\">country,</span> and to thy <span class=\"wl wl-kjv\" data-code=\"H4138\">kindred,</span> and I will deal well","10":"I am not worthy of the <span class=\"wl wl-kjv\" data-code=\"H6994\">least</span> of all the <span class=\"wl wl-kjv\" data-code=\"H2617\">mercies,</span> and of all the <span class=\"wl wl-kjv\" data-code=\"H571\">truth,</span> which thou hast <span class=\"wl wl-kjv\" data-code=\"H6213\">shewed</span> unto thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant;</span> for with my <span class=\"wl wl-kjv\" data-code=\"H4731\">staff</span> I passed <span class=\"wl wl-kjv\" data-code=\"H5674\">over</span> this <span class=\"wl wl-kjv\" data-code=\"H3383\">Jordan;</span> and now I am become <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> bands.","11":"Deliver <span class=\"wl wl-kjv\" data-code=\"H5337\">me,</span> I pray thee, from the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of my <span class=\"wl wl-kjv\" data-code=\"H251\">brother,</span> from the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of <span class=\"wl wl-kjv\" data-code=\"H6215\">Esau:</span> for I <span class=\"wl wl-kjv\" data-code=\"H3373\">fear</span> him, lest he will <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> and smite <span class=\"wl wl-kjv\" data-code=\"H5221\">me,</span> and the <span class=\"wl wl-kjv\" data-code=\"H517\">mother</span> <span class=\"wl wl-kjv\" data-code=\"H5921\">with</span> the children.","12":"And thou <span class=\"wl wl-kjv\" data-code=\"H559\">saidst,</span> I will <span class=\"wl wl-kjv\" data-code=\"H3190\">surely</span> do thee <span class=\"wl wl-kjv\" data-code=\"H3190\">good,</span> and <span class=\"wl wl-kjv\" data-code=\"H7760\">make</span> thy <span class=\"wl wl-kjv\" data-code=\"H2233\">seed</span> as the <span class=\"wl wl-kjv\" data-code=\"H2344\">sand</span> of the <span class=\"wl wl-kjv\" data-code=\"H3220\">sea,</span> which cannot be <span class=\"wl wl-kjv\" data-code=\"H5608\">numbered</span> for multitude.","13":"And he <span class=\"wl wl-kjv\" data-code=\"H3885\">lodged</span> there that same <span class=\"wl wl-kjv\" data-code=\"H3915\">night;</span> and <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> of that which <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> a <span class=\"wl wl-kjv\" data-code=\"H4503\">present</span> for <span class=\"wl wl-kjv\" data-code=\"H6215\">Esau</span> his brother;","14":"Two <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> she <span class=\"wl wl-kjv\" data-code=\"H5795\">goats,</span> and <span class=\"wl wl-kjv\" data-code=\"H6242\">twenty</span> he <span class=\"wl wl-kjv\" data-code=\"H8495\">goats,</span> two <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> <span class=\"wl wl-kjv\" data-code=\"H7353\">ewes,</span> and <span class=\"wl wl-kjv\" data-code=\"H6242\">twenty</span> rams,","15":"<span class=\"wl wl-kjv\" data-code=\"H7970\">Thirty</span> <span class=\"wl wl-kjv\" data-code=\"H3243\">milch</span> <span class=\"wl wl-kjv\" data-code=\"H1581\">camels</span> with their <span class=\"wl wl-kjv\" data-code=\"H1121\">colts,</span> <span class=\"wl wl-kjv\" data-code=\"H705\">forty</span> <span class=\"wl wl-kjv\" data-code=\"H6510\">kine,</span> and <span class=\"wl wl-kjv\" data-code=\"H6235\">ten</span> <span class=\"wl wl-kjv\" data-code=\"H6499\">bulls,</span> <span class=\"wl wl-kjv\" data-code=\"H6242\">twenty</span> she <span class=\"wl wl-kjv\" data-code=\"H860\">asses,</span> and <span class=\"wl wl-kjv\" data-code=\"H6235\">ten</span> foals.","16":"And he <span class=\"wl wl-kjv\" data-code=\"H5414\">delivered</span> them into the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of his <span class=\"wl wl-kjv\" data-code=\"H5650\">servants,</span> every <span class=\"wl wl-kjv\" data-code=\"H5739\">drove</span> by themselves; and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto his <span class=\"wl wl-kjv\" data-code=\"H5650\">servants,</span> Pass <span class=\"wl wl-kjv\" data-code=\"H5674\">over</span> before <span class=\"wl wl-kjv\" data-code=\"H6440\">me,</span> and <span class=\"wl wl-kjv\" data-code=\"H7760\">put</span> a <span class=\"wl wl-kjv\" data-code=\"H7305\">space</span> <span class=\"wl wl-kjv\" data-code=\"H996\">betwixt</span> <span class=\"wl wl-kjv\" data-code=\"H5739\">drove</span> <span class=\"wl wl-kjv\" data-code=\"H996\">and</span> drove.","17":"And he <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> the <span class=\"wl wl-kjv\" data-code=\"H7223\">foremost,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> When <span class=\"wl wl-kjv\" data-code=\"H6215\">Esau</span> my <span class=\"wl wl-kjv\" data-code=\"H251\">brother</span> meeteth <span class=\"wl wl-kjv\" data-code=\"H6298\">thee,</span> and asketh <span class=\"wl wl-kjv\" data-code=\"H7592\">thee,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Whose art thou? and whither <span class=\"wl wl-kjv\" data-code=\"H3212\">goest</span> thou? and whose are these before","18":"Then thou shalt <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> They be thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob's;</span> it is a <span class=\"wl wl-kjv\" data-code=\"H4503\">present</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> unto my <span class=\"wl wl-kjv\" data-code=\"H113\">lord</span> <span class=\"wl wl-kjv\" data-code=\"H6215\">Esau:</span> and, behold, also he is behind us.","19":"And <span class=\"wl wl-kjv\" data-code=\"H1571\">so</span> commanded <span class=\"wl wl-kjv\" data-code=\"H6680\">he</span> the <span class=\"wl wl-kjv\" data-code=\"H8145\">second,</span> and the <span class=\"wl wl-kjv\" data-code=\"H7992\">third,</span> and all that <span class=\"wl wl-kjv\" data-code=\"H1980\">followed</span> the <span class=\"wl wl-kjv\" data-code=\"H5739\">droves,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> On this <span class=\"wl wl-kjv\" data-code=\"H1697\">manner</span> shall ye <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> unto <span class=\"wl wl-kjv\" data-code=\"H6215\">Esau,</span> when ye find","20":"And say <span class=\"wl wl-kjv\" data-code=\"H559\">ye</span> <span class=\"wl wl-kjv\" data-code=\"H1571\">moreover,</span> Behold, thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> is behind <span class=\"wl wl-kjv\" data-code=\"H310\">us.</span> For he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> I will <span class=\"wl wl-kjv\" data-code=\"H3722\">appease</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">him</span> with the <span class=\"wl wl-kjv\" data-code=\"H4503\">present</span> that <span class=\"wl wl-kjv\" data-code=\"H1980\">goeth</span> before <span class=\"wl wl-kjv\" data-code=\"H6440\">me,</span> and <span class=\"wl wl-kjv\" data-code=\"H310\">afterward</span> I will <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> his <span class=\"wl wl-kjv\" data-code=\"H6440\">face;</span> peradventure he will <span class=\"wl wl-kjv\" data-code=\"H5375\">accept</span> of me.","21":"So <span class=\"wl wl-kjv\" data-code=\"H5674\">went</span> the <span class=\"wl wl-kjv\" data-code=\"H4503\">present</span> <span class=\"wl wl-kjv\" data-code=\"H5674\">over</span> before <span class=\"wl wl-kjv\" data-code=\"H6440\">him:</span> and himself <span class=\"wl wl-kjv\" data-code=\"H3885\">lodged</span> that <span class=\"wl wl-kjv\" data-code=\"H3915\">night</span> in the company.","22":"And he rose <span class=\"wl wl-kjv\" data-code=\"H6965\">up</span> that <span class=\"wl wl-kjv\" data-code=\"H3915\">night,</span> and <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> his <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H802\">wives,</span> and his <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H8198\">womenservants,</span> and his <span class=\"wl wl-kjv\" data-code=\"H6240\">eleven</span> <span class=\"wl wl-kjv\" data-code=\"H3206\">sons,</span> and passed <span class=\"wl wl-kjv\" data-code=\"H5674\">over</span> the <span class=\"wl wl-kjv\" data-code=\"H4569\">ford</span> Jabbok.","23":"And he took <span class=\"wl wl-kjv\" data-code=\"H3947\">them,</span> and sent them <span class=\"wl wl-kjv\" data-code=\"H5674\">over</span> the <span class=\"wl wl-kjv\" data-code=\"H5158\">brook,</span> and sent over","24":"And <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> was <span class=\"wl wl-kjv\" data-code=\"H3498\">left</span> alone; and there <span class=\"wl wl-kjv\" data-code=\"H79\">wrestled</span> a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> with him until the <span class=\"wl wl-kjv\" data-code=\"H5927\">breaking</span> of the day.","25":"And when he <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> that he <span class=\"wl wl-kjv\" data-code=\"H3201\">prevailed</span> not against him, he <span class=\"wl wl-kjv\" data-code=\"H5060\">touched</span> the hollow of his <span class=\"wl wl-kjv\" data-code=\"H3409\">thigh;</span> and the <span class=\"wl wl-kjv\" data-code=\"H3709\">hollow</span> of <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob's</span> <span class=\"wl wl-kjv\" data-code=\"H3409\">thigh</span> was out of <span class=\"wl wl-kjv\" data-code=\"H3363\">joint,</span> as he wrestled","26":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Let me <span class=\"wl wl-kjv\" data-code=\"H7971\">go,</span> for the <span class=\"wl wl-kjv\" data-code=\"H7837\">day</span> <span class=\"wl wl-kjv\" data-code=\"H5927\">breaketh.</span> And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> I will not let thee <span class=\"wl wl-kjv\" data-code=\"H7971\">go,</span> <span class=\"wl wl-kjv\" data-code=\"H518\">except</span> thou bless","27":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, What is thy <span class=\"wl wl-kjv\" data-code=\"H8034\">name?</span> And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Jacob.","28":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Thy <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> shall be <span class=\"wl wl-kjv\" data-code=\"H559\">called</span> no more <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob,</span> but <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel:</span> for as a prince hast thou <span class=\"wl wl-kjv\" data-code=\"H8280\">power</span> with <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> and with <span class=\"wl wl-kjv\" data-code=\"H582\">men,</span> and hast prevailed.","29":"And <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> <span class=\"wl wl-kjv\" data-code=\"H7592\">asked</span> him, and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H5046\">Tell</span> me, I pray thee, thy <span class=\"wl wl-kjv\" data-code=\"H8034\">name.</span> And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Wherefore is <span class=\"wl wl-kjv\" data-code=\"H2088\">it</span> that thou dost <span class=\"wl wl-kjv\" data-code=\"H7592\">ask</span> after my <span class=\"wl wl-kjv\" data-code=\"H8034\">name?</span> And he blessed","30":"And <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of the <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> <span class=\"wl wl-kjv\" data-code=\"H6439\">Peniel:</span> for I have <span class=\"wl wl-kjv\" data-code=\"H7200\">seen</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">face</span> to <span class=\"wl wl-kjv\" data-code=\"H6440\">face,</span> and my <span class=\"wl wl-kjv\" data-code=\"H5315\">life</span> is preserved.","31":"And as he passed <span class=\"wl wl-kjv\" data-code=\"H5674\">over</span> <span class=\"wl wl-kjv\" data-code=\"H6439\">Penuel</span> the <span class=\"wl wl-kjv\" data-code=\"H8121\">sun</span> <span class=\"wl wl-kjv\" data-code=\"H2224\">rose</span> upon him, and he <span class=\"wl wl-kjv\" data-code=\"H6760\">halted</span> upon his thigh.","32":"Therefore the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> not of the <span class=\"wl wl-kjv\" data-code=\"H1517\">sinew</span> which <span class=\"wl wl-kjv\" data-code=\"H5384\">shrank,</span> which is upon the <span class=\"wl wl-kjv\" data-code=\"H3709\">hollow</span> of the <span class=\"wl wl-kjv\" data-code=\"H3409\">thigh,</span> unto this <span class=\"wl wl-kjv\" data-code=\"H3117\">day:</span> because he <span class=\"wl wl-kjv\" data-code=\"H5060\">touched</span> the <span class=\"wl wl-kjv\" data-code=\"H3709\">hollow</span> of <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob's</span> <span class=\"wl wl-kjv\" data-code=\"H3409\">thigh</span> in the <span class=\"wl wl-kjv\" data-code=\"H1517\">sinew</span> that shrank."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"engelen","tekst":"Om Jakob van Gods tegenwoordigheid en bijstand te meer te verzekeren."}],"2":[{"catchword":"Mahanáïm.","tekst":"Dat is, twee heirlegers, of een dubbel heirleger, hetzij dat de engelen zich verdeeld hebben in twee legers, om Jakob tussen beide te laten passeren, of omdat er een leger was, bestaande uit engelen, en een ander, bestaande uit Jakobs huisgezin. Te dezer plaatse is naderhand een stad geweest, die Mahanaïm heette, Jos 13:26, en Jos 21:38."}],"3":[{"catchword":"voor zijn","tekst":"Dat is, vóór zijn aankomst, of eer hij daar komen zou, te weten, om den weg te bereiden tot de gunst zijns broeders. Dergelijke manier van spreken hebben wij Mal 3:1; Mat 11:10; Luk 9:52; en Luk 10:1."},{"catchword":"Seïr,","tekst":"Zie boven, Gen 14:6."},{"catchword":"van Edom","tekst":"Het landschap Idumea, aan het zuidelijke einde van Judea palende, hebbende zijn naam van Ezau, die ook Edom genoemd wordt, boven, Gen 25:30, en nu woonde in dit land, onder, Gen 36:8, hebbende de vroegere inwoners, te weten de Horieten, daaruit verdreven, Deu 2:12-22."}],"4":[{"catchword":"mijn heer,","tekst":"Hoewel Jakob door het recht der eerstgeboorte een heer was van Ezau, boven, Gen 27:29, nochtans noemt hij zich aldus met behoud van zijn recht, om te beter in zijn gunst en vriendschap door deze vernedering te geraken; te meer, omdat hij nog niet terstond op de bezitting van zijn recht, hetwelk zag op den toekomstigen tijd, gesteld was. Zo deed ook Da (function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const KJVKEY2AFK = {"Gen":"Gen","Exo":"Ex","Lev":"Lev","Num":"Num","Deu":"Deut","Jos":"Joz","Jdg":"Richt","Rth":"Ruth","1Sa":"1 Sam","2Sa":"2 Sam","1Ki":"1 Kon","2Ki":"2 Kon","1Ch":"1 Kron","2Ch":"2 Kron","Ezr":"Ezra","Neh":"Neh","Est":"Est","Job":"Job","Psa":"Ps","Pro":"Spr","Ecc":"Pred","Sng":"Hoogl","Isa":"Jes","Jer":"Jer","Lam":"Klaagl","Eze":"Ezech","Dan":"Dan","Hos":"Hos","Joe":"Joël","Amo":"Amos","Oba":"Obadja","Jon":"Jona","Mic":"Micha","Nah":"Nahum","Hab":"Hab","Zep":"Zef","Hag":"Hagg","Zec":"Zach","Mal":"Mal","Mat":"Matt","Mar":"Mark","Luk":"Luk","Jhn":"Joh","Act":"Hand","Rom":"Rom","1Co":"1 Kor","2Co":"2 Kor","Gal":"Gal","Eph":"Ef","Phl":"Fil","Col":"Kol","1Th":"1 Tess","2Th":"2 Tess","1Ti":"1 Tim","2Ti":"2 Tim","Tit":"Tit","Phm":"Filem","Heb":"Hebr","Jas":"Jak","1Pe":"1 Petr","2Pe":"2 Petr","1Jo":"1 Joh","2Jo":"2 Joh","3Jo":"3 Joh","Jde":"Judas","Rev":"Openb"};
const REF_RE = /\b(\d?[A-Za-z]{2,3})\s+(\d{1,3}):(\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek) => {
    const afk = KJVKEY2AFK[boek];
    return afk ? `<a class="refchip" data-ref="${heel.replace(boek, afk)}">${heel}</a>` : heel;
  });
}

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', vert: 'KJV',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
    const items = lijst.map((it, i) => {
      const nr = i + 1;
      const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
      if (kortCw) {
        const idx = brontekstHtml.indexOf(kortCw);
        if (idx !== -1) {
          brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
        }
      }
      const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
      return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
    }).join('');
    const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${brontekstBlok}${items}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
