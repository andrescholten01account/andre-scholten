": "mattheus", "Mark": "markus", "Luk": "lukas", "Joh": "johannes", "Hand": "handelingen", "Rom": "romeinen", "1 Kor": "1-korinthe", "2 Kor": "2-korinthe", "Gal": "galaten", "Ef": "efeze", "Fil": "filippenzen", "Kol": "kolossenzen", "1 Tess": "1-thessalonicenzen", "2 Tess": "2-thessalonicenzen", "1 Tim": "1-timotheus", "2 Tim": "2-timotheus", "Tit": "titus", "Filem": "filemon", "Hebr": "hebreeen", "Jak": "jakobus", "1 Petr": "1-petrus", "2 Petr": "2-petrus", "1 Joh": "1-johannes", "2 Joh": "2-johannes", "3 Joh": "3-johannes", "Judas": "judas", "Openb": "openbaring"}}, "vertalingen": {"SVnu": {"1": "Jakob ging ook zijns weegs; en de engelen van God ontmoetten hem.", "2": "En Jakob zei, toen hij hen zag: Dit is een leger van God! En hij noemde de naam van die plaats Mahanaim.", "3": "En Jakob zond boden voor zich uit naar Ezau, zijn broer, naar het land Seir, de landstreek van Edom.", "4": "En hij gebood hun: Zo zult u zeggen tegen mijn heer, tegen Ezau: Zo zegt Jakob, uw knecht: Ik heb als vreemdeling gewoond bij Laban, en heb daar tot nu toe vertoefd;", "5": "en ik heb ossen en ezels, schapen en knechten en dienstmeisjes; en ik heb gezonden om mijn heer dit aan te zeggen, opdat ik genade vind in uw ogen.", "6": "En de boden kwamen terug bij Jakob en zeiden: Wij zijn gekomen bij uw broer, bij Ezau; en hij trekt u ook al tegemoet, met vierhonderd man bij zich.", "7": "Toen werd Jakob erg bang en benauwd; en hij verdeelde het volk dat bij hem was, en de schapen, en de runderen, en de kamelen, in twee legers;", "8": "want hij zei: Als Ezau op het ene leger afkomt en het verslaat, dan zal het overgebleven leger ontkomen.", "9": "Verder zei Jakob: O, God van mijn vader Abraham, en God van mijn vader Izak, o HEERE! Die tegen mij gezegd hebt: Keer terug naar uw land en naar uw familie, en Ik zal u goeddoen!", "10": "Ik ben geringer dan al de weldaden en al de trouw die U aan Uw knecht bewezen hebt; want met mijn staf ben ik deze Jordaan overgestoken, en nu ben ik tot twee legers geworden!", "11": "Red mij toch uit de hand van mijn broer, uit de hand van Ezau; want ik vrees hem, dat hij misschien komt en mij verslaat, de moeder met de kinderen!", "12": "Zeker, U hebt gezegd: Ik zal zeker goed voor u zijn, en Ik zal uw nageslacht maken als het zand van de zee, dat vanwege de hoeveelheid niet geteld kan worden!", "13": "En hij overnachtte daar diezelfde nacht; en hij nam van wat hem onder handen kwam een geschenk voor Ezau, zijn broer;", "14": "tweehonderd geiten en twintig bokken, tweehonderd ooien en twintig rammen;", "15": "dertig zogende kamelinnen met haar veulens, veertig koeien en tien stieren, twintig ezelinnen en tien jonge ezels.", "16": "En hij gaf die in de hand van zijn knechten, elke kudde apart; en hij zei tegen zijn knechten: Trekt u voor mij uit, en houdt ruimte tussen de ene kudde en de andere kudde.", "17": "En hij gebood de eerste: Wanneer Ezau, mijn broer, u tegenkomt en u vraagt: Van wie bent u? En waar gaat u heen? En van wie zijn deze dieren voor u?", "18": "dan zult u zeggen: Dat is een geschenk van uw knecht Jakob, gezonden aan mijn heer, aan Ezau; en zie, hijzelf is ook achter ons!", "19": "En hij gebood ook de tweede, ook de derde, ook allen die de kudden achterna gingen: Naar datzelfde woord zult u spreken tegen Ezau, wanneer u hem vindt.", "20": "En u zult ook zeggen: Zie, uw knecht Jakob is achter ons! Want hij zei: Ik zal hem verzoenen met dit geschenk, dat voor mij uit gaat, en daarna zal ik hem zien; misschien zal hij mij aannemen.", "21": "Zo ging dat geschenk voor hem uit; maar hijzelf overnachtte diezelfde nacht in het leger.", "22": "En hij stond in diezelfde nacht op, en nam zijn twee vrouwen, en zijn twee dienstmeisjes, en zijn elf kinderen, en trok over de doorwaadbare plaats van de Jabbok.", "23": "En hij nam ze, en liet hen de beek oversteken; en hij liet oversteken wat hij had.", "24": "Maar Jakob bleef alleen achter; en een man worstelde met hem, totdat de dageraad opging.", "25": "En toen Hij zag dat Hij niet de overhand over hem kreeg, raakte Hij zijn heupgewricht aan, zodat het heupgewricht van Jakob verwrongen raakte, terwijl Hij met hem worstelde.", "26": "En Hij zei: Laat Mij gaan, want de dageraad is opgegaan. Maar hij zei: Ik zal U niet laten gaan, tenzij U mij zegent.", "27": "En Hij zei tegen hem: Hoe is uw naam? En hij zei: Jakob.", "28": "Toen zei Hij: Uw naam zal voortaan niet meer Jakob heten, maar Israël; want u hebt zich als een vorst gedragen tegenover God en tegenover de mensen, en hebt de overhand gekregen.", "29": "En Jakob vroeg: Vertel mij toch Uw naam. En Hij zei: Waarom vraagt u naar Mijn naam? En Hij zegende hem daar.", "30": "En Jakob noemde de naam van die plaats Pniël: Want, *zei hij*, ik heb God gezien *van* aangezicht tot aangezicht, en mijn ziel is gered.", "31": "En de zon ging voor hem op, toen hij door Pniël gegaan was; en hij hinkte op zijn heup.", "32": "Daarom eten de kinderen van Israël tot op deze dag de verrukte zenuw niet, die op het heupgewricht zit, omdat Hij het heupgewricht van Jakob had aangeraakt, bij de verrukte zenuw."}, "SV": {"1": "Jakob toog ook zijns weegs; en de engelen Gods ontmoetten hem.", "2": "En Jakob zeide, met dat hij hen zag: Dit is een heirleger Gods! en hij noemde den naam derzelver plaats Mahanaim.", "3": "En Jakob zond boden uit voor zijn aangezicht tot Ezau, zijn broeder, naar het land Seir, de landstreek van Edom.", "4": "En hij gebood hun, zeggende: Zo zult gij zeggen tot mijn heer, tot Ezau: Zo zegt Jakob, uw knecht: Ik heb als vreemdeling gewoond bij Laban, en heb er tot nu toe vertoefd;", "5": "En ik heb ossen en ezelen, schapen en knechten en maagden; en ik heb gezonden om mijn heer aan te zeggen, opdat ik genade vinde in uw ogen.", "6": "En de boden kwamen weder tot Jakob, zeggende: Wij zijn gekomen tot uw broeder, tot Ezau; en ook trekt hij u tegemoet, en vierhonderd mannen met hem.", "7": "Toen vreesde Jakob zeer, en hem was bange; en hij verdeelde het volk, dat met hem was, en de schapen, en de runderen, en de kemels, in twee heiren;", "8": "Want hij zeide: Indien Ezau op het ene heir komt, en slaat het, zo zal het overgeblevene heir ontkomen.", "9": "Voorts zeide Jakob: O, God mijns vaders Abrahams, en God mijns vaders Izaks, o HEERE! Die tot mij gezegd hebt: Keer weder tot uw land, en tot uw maagschap, en Ik zal wel bij u doen!", "10": "Ik ben geringer dan al deze weldadigheden, en dan al deze trouw, die Gij aan Uw knecht gedaan hebt; want ik ben met mijn staf over deze Jordaan gegaan, en nu ben ik tot twee heiren geworden!", "11": "Ruk mij toch uit mijns broeders hand, uit Ezau’s hand; want ik vreze hem, dat hij niet misschien kome, en mij sla, de moeder met de zonen!", "12": "Gij hebt immers gezegd: Ik zal gewisselijk bij u weldoen, en Ik zal uw zaad stellen als het zand der zee, dat vanwege de menigte niet geteld kan worden!", "13": "En hij vernachtte aldaar dienzelfden nacht; en hij nam van hetgeen, dat hem in zijn hand kwam, een geschenk voor Ezau zijn broeder;", "14": "Tweehonderd geiten en twintig bokken, tweehonderd ooien en twintig rammen;", "15": "Dertig zogende kemelinnen met haar veulens, veertig koeien en tien varren, twintig ezelinnen en tien jonge ezels.", "16": "En hij gaf die in de hand zijner knechten, elke kudde bijzonder; en hij zeide tot zijn knechten: Gaat gijlieden door, voor mijn aangezicht, en stelt ruimte tussen kudde en tussen kudde.", "17": "En hij gebood de eerste, zeggende: Wanneer Ezau, mijn broeder, u ontmoeten zal, en u vragen, zeggende: Wiens zijt gij? en waarheen gaat gij? en wiens zijn deze voor uw aangezicht?", "18": "Zo zult gij zeggen: Dat is een geschenk van uw knecht Jakob, gezonden tot mijn heer, tot Ezau, en zie, hij zelf is ook achter ons!", "19": "En hij gebood ook den tweede, ook den derde, ook allen, die de kudden nagingen, zeggende: Naar ditzelfde woord zult gij spreken tot Ezau, als gij hem vinden zult.", "20": "En gij zult ook zeggen: Zie, uw knecht Jakob is achter ons! Want hij zeide: Ik zal zijn aangezicht verzoenen met dit geschenk, dat voor mijn aangezicht gaat, en daarna zal ik zijn aangezicht zien; misschien zal hij mijn aangezicht aannemen.", "21": "Alzo ging dat geschenk heen voor zijn aangezicht; doch hij zelf vernachtte dienzelfden nacht in het leger.", "22": "En hij stond op in dienzelfden nacht, en hij nam zijn twee vrouwen, en zijn twee dienstmaagden, en zijn elf kinderen, en hij toog over het veer van de Jabbok.", "23": "En hij nam ze, en deed hen over die beek trekken; en hij deed overtrekken hetgeen hij had.", "24": "Doch Jakob bleef alleen over; en een man worstelde met hem, totdat de dageraad opging.", "25": "En toen Hij zag, dat Hij hem niet overmocht, roerde Hij het gewricht zijner heup aan, zodat het gewricht van Jakobs heup verwrongen werd, als Hij met hem worstelde.", "26": "En Hij zeide: Laat Mij gaan, want de dageraad is opgegaan. Maar hij zeide: Ik zal U niet laten gaan, tenzij dat Gij mij zegent.", "27": "En Hij zeide tot hem: Hoe is uw naam? En hij zeide: Jakob.", "28": "Toen zeide Hij: Uw naam zal voortaan niet Jakob heten, maar Israël; want gij hebt u vorstelijk gedragen met God en met de mensen, en hebt overmocht.", "29": "En Jakob vraagde, en zeide: Geef toch Uw naam te kennen. En Hij zeide: Waarom is het, dat gij naar Mijn naam vraagt? En Hij zegende hem aldaar.", "30": "En Jakob noemde den naam dier plaats Pniël: Want, *zeide* *hij* ik heb God gezien *van* aangezicht tot aangezicht, en mijn ziel is gered geweest.", "31": "En de zon rees hem op, als hij door Pniël gegaan was; en hij was hinkende aan zijn heup.", "32": "Daarom eten de kinderen Israëls de verrukte zenuw niet, die op het gewricht der heup is, tot op dezen dag, omdat Hij het gewricht van Jakobs heup aangeroerd had, aan de verrukte zenuw."}, "KJV": {"1": "And Jacob went on his way, and the angels of God met", "2": "And when Jacob saw them, he said, This *is* God's host: and he called the name of that place Mahanaim.", "3": "And Jacob sent messengers before him to Esau his brother unto the land of Seir, the country of Edom.", "4": "And he commanded them, saying, Thus shall ye speak unto my lord Esau; Thy servant Jacob saith thus, I have sojourned with Laban, and stayed there", "5": "And I have oxen, and asses, flocks, and menservants, and womenservants: and I have sent to tell my lord, that I may find grace in thy sight.", "6": "And the messengers returned to Jacob, saying, We came to thy brother Esau, and also he cometh to meet thee, and four hundred men", "7": "Then Jacob was greatly afraid and distressed: and he divided the people that *was* with him, and the flocks, and herds, and the camels, into two bands;", "8": "And said, If Esau come to the one company, and smite it, then the other company which is left shall escape.", "9": "And Jacob said, O God of my father Abraham, and God of my father Isaac, the LORD which saidst unto me, Return unto thy country, and to thy kindred, and I will deal well", "10": "I am not worthy of the least of all the mercies, and of all the truth, which thou hast shewed unto thy servant; for with my staff I passed over this Jordan; and now I am become two bands.", "11": "Deliver me, I pray thee, from the hand of my brother, from the hand of Esau: for I fear him, lest he will come and smite me, *and* the mother with the children.", "12": "And thou saidst, I will surely do thee good, and make thy seed as the sand of the sea, which cannot be numbered for multitude.", "13": "And he lodged there that same night; and took of that which came to his hand a present for Esau his brother;", "14": "Two hundred she goats, and twenty he goats, two hundred ewes, and twenty rams,", "15": "Thirty milch camels with their colts, forty kine, and ten bulls, twenty she asses, and ten foals.", "16": "And he delivered *them* into the hand of his servants, every drove by themselves; and said unto his servants, Pass over before me, and put a space betwixt drove and drove.", "17": "And he commanded the foremost, saying, When Esau my brother meeteth thee, and asketh thee, saying, Whose *art* thou? and whither goest thou? and whose *are* these before", "18": "Then thou shalt say, *They be* thy servant Jacob's; it *is* a present sent unto my lord Esau: and, behold, also he *is* behind us.", "19": "And so commanded he the second, and the third, and all that followed the droves, saying, On this manner shall ye speak unto Esau, when ye find", "20": "And say ye moreover, Behold, thy servant Jacob *is* behind us. For he said, I will appease him with the present that goeth before me, and afterward I will see his face; peradventure he will accept of me.", "21": "So went the present over before him: and himself lodged that night in the company.", "22": "And he rose up that night, and took his two wives, and his two womenservants, and his eleven sons, and passed over the ford Jabbok.", "23": "And he took them, and sent them over the brook, and sent over", "24": "And Jacob was left alone; and there wrestled a man with him until the breaking of the day.", "25": "And when he saw that he prevailed not against him, he touched the hollow of his thigh; and the hollow of Jacob's thigh was out of joint, as he wrestled", "26": "And he said, Let me go, for the day breaketh. And he said, I will not let thee go, except thou bless", "27": "And he said unto him, What *is* thy name? And he said, Jacob.", "28": "And he said, Thy name shall be called no more Jacob, but Israel: for as a prince hast thou power with God and with men, and hast prevailed.", "29": "And Jacob asked *him*, and said, Tell *me*, I pray thee, thy name. And he said, Wherefore *is* it *that* thou dost ask after my name? And he blessed", "30": "And Jacob called the name of the place Peniel: for I have seen God face to face, and my life is preserved.", "31": "And as he passed over Penuel the sun rose upon him, and he halted upon his thigh.", "32": "Therefore the children of Israel eat not *of* the sinew which shrank, which *is* upon ": "Geloofd zij de HEERE, Die aan Zijn volk Israël rust gegeven heeft, naar alles wat Hij gesproken heeft! Niet één woord is er gevallen van al Zijn goede woorden, die Hij gesproken heeft door de dienst van Mozes, Zijn dienaar.", "Gen 33:16": "Zo keerde Ezau die dag terug, zijn weg naar Seïr op.", "Spr 15:8": "Het offer van de goddelozen is de HEERE een gruwel; maar het gebed van de oprechten is Zijn welgevallen.", "Gen 2:1": "Zo zijn de hemel en de aarde voltooid, en heel hun leger.", "Ps 71:12": "O God, wees niet ver van mij; mijn God! haast U tot mijn hulp.", "Ps 37:18": "Jod. De HEERE kent de dagen van de oprechten; en hun erfenis zal in eeuwigheid blijven.", "Ex 12:41": "En het gebeurde aan het einde van de vierhonderd en dertig jaren, op diezelfde dag gebeurde het, dat alle legers van de HEERE uit Egypteland gegaan zijn.", "Matt 14:30": "Maar toen hij de sterke wind zag, werd hij bevreesd, en toen hij begon te zinken, riep hij: Heere, red mij!", "1 Kon 2:8": "En zie, bij u is Simeï, de zoon van Gera, de zoon van Jemini, uit Bahurim, die mij vervloekte met een zware vloek, op de dag dat ik naar Mahanaïm ging; maar hij kwam mij tegemoet bij de Jordaan, en ik zwoer hem bij de HEERE en zei: Ik zal u niet met het zwaard doden!", "Ps 132:11": "De HEERE heeft David de waarheid gezworen, waarvan Hij niet wijken zal, en zei: Van de vrucht van uw buik zal Ik op uw troon zetten.", "Ps 31:22": "Geloofd zij de HEERE, want Hij heeft Zijn goedertierenheid aan mij wonderlijk gemaakt, mij voerende als in een vaste stad.", "Jes 63:15-17": "Zie neer van de hemel, en aanschouw van Uw heilige en Uw heerlijke woning; waar zijn Uw ijver en Uw krachten, het gerommel van Uw ingewand en van Uw barmhartigheden? Zij houden zich tegen mij in. U bent toch onze Vader, want Abraham weet van ons niet, en Israël kent ons niet; U, o HEERE, bent onze Vader, onze Verlosser van ouds af is Uw Naam. HEERE! Waarom laat U ons van Uw wegen dwalen, waarom verstokt U ons hart, zodat wij U niet vrezen? Keer terug om Uw dienaren wil, de stammen van Uw erfdeel.", "Richt 16:28": "Toen riep Simson tot de HEERE, en zei: Heere, HEERE! gedenk mij toch, en sterk mij toch alleen ditmaal, o God! dat ik mij met één wraak voor mijn twee ogen op de Filistijnen kan wreken.", "Job 37:5": "God dondert met Zijn stem heel wonderlijk; Hij doet grote dingen, en wij begrijpen ze niet.", "2 Kor 4:6": "Want God, Die gezegd heeft dat het licht uit de duisternis zou schijnen, is Degene Die in onze harten geschenen heeft, om te geven de verlichting van de kennis van de heerlijkheid van God in het aangezicht van Jezus Christus.", "Ps 119:73": "Jod. Uw handen hebben mij gemaakt, en bereid; maak mij verstandig, opdat ik Uw geboden leer.", "Spr 21:14": "Een gift in het verborgene houdt de toorn onder, en een geschenk in de schoot de sterke woede.", "Ps 31:15-19": "Maar ik vertrouw op U, o HEERE! Ik zeg: U bent mijn God. Mijn tijden zijn in Uw hand; red mij van de hand van mijn vijanden, en van mijn vervolgers. Laat Uw aangezicht over Uw knecht lichten; verlos mij door Uw goedertierenheid.", "Ps 105:42": "Want Hij dacht aan Zijn heilig woord, aan Abraham, Zijn knecht.", "Ps 57:3": "Ik zal roepen tot God, de Allerhoogste, tot God, Die het voor mij zal voltooien.", "Openb 1:6": "En Die ons gemaakt heeft tot koningen en priesters voor God en Zijn Vader; Hem, zeg ik, zij de heerlijkheid en de kracht tot in alle eeuwigheid. Amen.", "Jer 14:19-21": "Hebt U dan Juda helemaal verworpen? Heeft Uw ziel een walging aan Sion? Waarom hebt U ons geslagen, zodat er geen genezing voor ons is? Men wacht op vrede, maar daar is niets goeds, en op tijd van genezing, maar zie, daar is verschrikking. HEERE, wij kennen onze goddeloosheid, en de ongerechtigheid van onze vaderen, want wij hebben tegen U gezondigd. Versmaad ons niet, om Uw Naams wil; werp de troon van Uw heerlijkheid niet neer; denk aan ons, vernietig Uw verbond met ons niet.", "Jes 28:26": "En zijn God onderricht hem over de juiste wijze, Hij leert het hem.", "Gen 18:30": "Verder zei hij: Laat de Heere toch niet boos worden, dat ik spreek; misschien zullen daar dertig gevonden worden! En Hij zei: Ik zal het niet doen, als Ik daar dertig zal vinden.", "Num 5:3": "Van de man tot de vrouw toe zult u hen wegzenden; tot buiten het leger zult u hen wegzenden; zodat zij hun legers niet verontreinigen, in welker midden Ik woon.", "Ps 70:6": "Doch ik ben ellendig en nooddruftig; o God, haast U tot mij; Gij zijt mijn Hulp en mijn Bevrijder; HEERE, vertoef niet!", "Jer 40:11": "Toen ook alle Joden die in Moab, en onder de kinderen van Ammon, en in Edom, en die in al die landen waren, hoorden dat de koning van Babel in Juda een overblijfsel gelaten had; en dat hij Gedalia, de zoon van Ahikam, de zoon van Safan, over hen aangesteld had,", "Job 29:3-5": "Toen Hij Zijn lamp deed schijnen over mijn hoofd, en ik bij Zijn licht door de duisternis liep; Zoals ik was in de dagen van mijn jeugd, toen Gods vertrouwelijke omgang over mijn tent was; Toen de Almachtige nog met mij was, en mijn jongens rondom mij;", "2 Sam 12:22": "En hij zei: Toen het kind nog leefde, heb ik gevast en gehuild; want ik zei: Wie weet, de HEERE zou mij misschien genadig kunnen zijn, zodat het kind in leven bleef.", "Ex 15:1-21": "Toen zongen Mozes en de kinderen van Israël de HEERE dit lied, en zeiden: Ik zal de HEERE zingen; want Hij is hoog verheven! Het paard en zijn ruiter heeft Hij in de zee geworpen. De HEERE is mijn Kracht en Lied, en Hij is mij tot een Heil geweest; Deze is mijn God; daarom zal ik Hem een liefelijke woning maken; Hij is de God van mijn vader, daarom zal ik Hem verheffen! De HEERE is een krijgsman; HEERE is Zijn Naam!", "Ps 88:10-15": "Mijn oog treurt vanwege verdrukking; HEERE, ik roep tot U de hele dag; ik strek mijn handen naar U uit. Zult U een wonder doen aan de doden? Of zullen de overledenen opstaan, zullen zij U loven? Sela. Zal Uw goedertierenheid in het graf verteld worden, Uw trouw in het verderf?", "Gen 25:31": "Toen zei Jakob: Verkoop mij op deze dag uw eerstgeboorterecht.", "Job 10:2": "Ik zal tegen God zeggen: Verdoem mij niet; laat mij weten, waarom U met mij twist.", "Jes 41:14": "Vrees niet, wormpje Jakob, volkje Israël! Ik help u, spreekt de HEERE, en uw Verlosser is de Heilige van Israël!", "Gen 27:33-36": "Toen schrok Izak met zeer grote schrik, geheel en al, en zei: Wie is hij dan, die het wildbraad gejaagd en mij gebracht heeft? en ik heb van alles gegeten, voordat u kwam, en heb hem gezegend; ook zal hij gezegend blijven. Toen Ezau de woorden van zijn vader hoorde, schreeuwde hij met een grote en bittere schreeuw, geheel en al; en hij zei tegen zijn vader: Zegen mij, ook mij, mijn vader! En hij zei: Uw broer is gekomen met bedrog, en heeft uw zegen weggenomen.", "2 Kron 14:11": "En Asa riep tot de HEERE, zijn God, en zei: HEERE, het is voor U niets, te helpen hetzij de machtige, hetzij de krachteloze; help ons, o HEERE, onze God! Want wij steunen op U, en in Uw Naam zijn wij gekomen tegen deze menigte; o HEERE! U bent onze God; laat een sterfelijk mens tegen U niets vermogen.", "Neh 1:5": "En ik zei: Och, HEERE, God van de hemel, U, grote en ontzagwekkende God! Die het verbond en de goedertierenheid houdt voor hen die Hem liefhebben en Zijn geboden houden.", "Ps 102:3": "Verberg Uw aangezicht niet voor mij, neig Uw oor tot mij ten dage van mijn benauwdheid; ten dage als ik roep, verhoor mij haastig.", "Jer 17:18": "Laat mijn vervolgers beschaamd worden, maar laat mij niet beschaamd worden; laat hen verschrikt worden, maar laat mij niet verschrikt worden; breng over hen de dag van het kwaad, en verbreek hen met een dubbele verbreking.", "Mark 14:36": "En Hij zei: Abba, Vader! Alle dingen zijn U mogelijk; neem deze drinkbeker van Mij weg; maar niet wat Ik wil, maar wat U wilt.", "Joh 14:23": "Jezus antwoordde en zei tegen hem: Als iemand Mij liefheeft, zal hij Mijn woord bewaren; en Mijn Vader zal hem liefhebben, en Wij zullen naar hem toe komen, en woning bij hem maken.", "Gen 46:4": "Ik zal met u aftrekken naar Egypte, en Ik zal u ook weer laten optrekken; en Jozef zal zijn hand op uw ogen leggen.", "Ex 24:10": "En zij zagen de God van Israël, en onder Zijn voeten als een werk van saffierstenen, en als de gestalte van de hemel in Zijn klaarheid.", "1 Sam 30:6": "En David werd erg bang, want het volk sprak ervan hem te stenigen; want de zielen van heel het volk waren verbitterd, ieder over zijn zonen en over zijn dochters; maar David sterkte zich in de HEERE, zijn God.", "Ps 17:6": "Ik roep U aan, omdat U mij verhoort; o God! Neig Uw oor tot mij; hoor mijn woorden.", "Zach 2:5": "En Ik zal haar wezen, spreekt de HEERE, een vurige muur rondom; en Ik zal tot heerlijkheid wezen in het midden van haar.", "2 Tim 1:7": "Want God heeft ons niet een geest van vreesachtigheid gegeven, maar van kracht, en van liefde, en van gematigdheid.", "2 Kron 6:18": "Maar zou God werkelijk bij de mensen op de aarde wonen? Zie, de hemelen, ja, de hemel der hemelen, zouden U niet kunnen bevatten, hoeveel te minder dit huis, dat ik gebouwd heb?", "Gen 32:9-12": "Verder zei Jakob: O, God van mijn vader Abraham, en God van mijn vader Izak, o HEERE! Die tegen mij gezegd hebt: Keer terug naar uw land en naar uw familie, en Ik zal u goeddoen! Ik ben geringer dan al de weldaden en al de trouw die U aan Uw knecht bewezen hebt; want met mijn staf ben ik deze Jordaan overgestoken, en nu ben ik tot twee legers geworden! Red mij toch uit de hand van mijn broer, uit de hand van Ezau; want ik vrees hem, dat hij misschien komt en mij verslaat, de moeder met de kinderen!", "2 Sam 23:5": "Hoewel mijn huis zo niet is bij God, heeft Hij mij toch een eeuwig verbond gesteld, dat in alles goed geordend en bewaard is; zeker is daarin al mijn heil, en alle lust, hoewel Hij het nog niet laat uitspruiten.", "Jer 14:8": "O Israëls Verwachting, Zijn Verlosser in tijd van benauwdheid! Waarom zou U zijn als een vreemdeling in het land, en als een reiziger die slechts inkeert om te overnachten?", "Job 17:9": "En de rechtvaardige zal zijn weg vasthouden, en wie rein van handen is, zal in sterkte toenemen.", "Joh 15:15": "Ik noem u niet meer dienstknechten; want de dienstknecht weet niet wat zijn heer doet; maar Ik heb u vrienden genoemd; want alles wat Ik van Mijn Vader gehoord heb, dat heb Ik u bekendgemaakt.", "Ps 71:9": "Verwerp mij niet in de tijd van het ouderdom; verlaat mij niet, terwijl mijn kracht vergaat.", "Ps 77:20": "Uw weg was in de zee, en Uw pad in het grote water, en Uw voetstappen werden niet bekend.", "Ps 71:24": "Ook zal mijn tong Uw gerechtigheid de hele dag uitspreken, want zij zijn beschaamd, want zij zijn schaamrood geworden, die mijn kwaad zoeken.", "Dan 9:8": "O Heere! bij ons is de schaamte van het gezicht, bij onze koningen, bij onze vorsten, en bij onze vaders, omdat wij tegen U gezondigd hebben.", "Ps 92:15": "In de grijze ouderdom zullen zij nog vruchten dragen; zij zullen vet en groen zijn,", "Klaagl 3:23": "Cheth. Zij zijn elke morgen nieuw, Uw trouw is groot.", "Ps 5:13": "Want U, HEERE, zult de rechtvaardige zegenen; U zult hem met goedgunstigheid kronen, als met een schild.", "Matt 27:46": "En omstreeks het negende uur riep Jezus met luide stem: ELI, ELI, LAMA SABACHTHANI! Dat is: Mijn God, Mijn God, waarom hebt U Mij verlaten?", "Gen 19:22": "Haast u, vlucht daarheen; want Ik zal niets kunnen doen, totdat u daar aangekomen bent. Daarom noemde men de naam van deze stad Zoar.", "Ex 33:11": "En de HEERE sprak tot Mozes van aangezicht tot aangezicht, zoals een man met zijn vriend spreekt; daarna keerde hij terug naar het kamp; maar zijn dienaar Jozua, de zoon van Nun, de jongeman, week niet uit het midden van de tent.", "1 Kon 8:12": "Toen zei Salomo: De HEERE heeft gezegd, dat Hij in donkerheid zou wonen.", "Ps 119:173-176": "Laat Uw hand mij te hulp komen, want ik heb Uw bevelen gekozen. O HEERE! ik verlang naar Uw heil, en Uw wet is al mijn vermaking. Laat mijn ziel leven, en zij zal U loven, en laat Uw rechten mij helpen.", "Gen 31:13": "Ik ben die God van Bethel, waar u het opgerichte teken gezalfd hebt, waar u Mij een gelofte beloofd hebt; nu, maak u op, vertrek uit dit land, en keer terug naar het land van uw familie.", "Ef 3:10": "opdat nu, door de Gemeente, aan de overheden en de machten in de hemel de veelvuldige wijsheid van God bekendgemaakt wordt;", "Jer 33:25": "Zo zegt de HEERE: Als Mijn verbond niet zou bestaan met dag en nacht, als Ik de ordeningen van de hemel en de aarde niet had vastgesteld;", "Ps 123:3": "Wees ons genadig, HEERE! Wees ons genadig, want wij zijn de verachting veel te zat.", "Luk 15:11-24": "En Hij zei: Een zeker mens had twee zonen. En de jongste van hen zei tegen de vader: Vader, geef mij het deel van het bezit, dat mij toekomt. En hij verdeelde onder hen het bezit. En niet veel dagen daarna heeft de jongste zoon alles bijeengebracht, en is weggereisd naar een ver land, en heeft daar zijn bezit doorgebracht, terwijl hij overdadig leefde.", "Matt 8:8": "En de hoofdman over honderd antwoordde en zei: Heere, ik ben het niet waard dat U onder mijn dak zou komen; maar spreek alleen een woord, en mijn knecht zal genezen worden.", "Ps 71:1": "Op U, o HEERE! vertrouw ik; laat mij niet beschaamd worden in eeuwigheid.", "Jes 33:22": "Want de HEERE is onze Rechter, de HEERE is onze Wetgever, de HEERE is onze Koning. Hij zal ons redden.", "Jes 15:1": "De last die op Moab rust. Zeker, in de nacht is Ar-Moab verwoest, zij is uitgeroeid; zeker, in de nacht is Kir-Moab verwoest, zij is uitgeroeid!", "2 Sam 7:19": "Daarbij is dit in Uw ogen nog klein geweest, Heere HEERE, maar U hebt ook over het huis van uw knecht gesproken tot ver in de toekomst; en dit naar de wet van de mensen, Heere HEERE!", "Ex 9:27": "Toen stuurde Farao mensen, en riep Mozes en Aäron, en zei tegen hen: Ik heb ditmaal gezondigd; de HEERE is rechtvaardig; ik daarentegen en mijn volk zijn goddelozen!", "1 Joh 4:18": "Er is in de liefde geen vrees, maar de volmaakte liefde drijft de vrees naar buiten; want de vrees heeft pijn, en die vreest, is niet volmaakt in de liefde.", "Hos 12:4": "In moeders buik hield hij zijn broeder bij de hielen; en in zijn kracht gedroeg hij zich vorstelijk met God.", "Ex 34:6": "Toen de HEERE nu voor zijn aangezicht voorbijging, riep Hij: HEERE, HEERE, God, barmhartig en genadig, geduldig en groot van goedertierenheid en waarheid.", "Ps 77:3": "Ten dage van mijn benauwdheid zocht ik de Heere; mijn hand was 's nachts uitgestrekt, en liet niet af; mijn ziel weigerde getroost te worden.", "Job 26:9": "Hij houdt het aanzien van het troon vast; Hij spreidt Zijn wolk daarover.", "2 Kron 15:4": "Maar toen zij zich in hun nood bekeerden tot de HEERE, de God van Israël, en Hem zochten, werd Hij door hen gevonden.", "Num 12:8": "Van mond tot mond spreek Ik met hem, en duidelijk zichtbaar, en niet door duistere woorden; en de gestalte van de HEERE aanschouwt hij; waarom hebt u er dan niet voor gevreesd om tegen Mijn knecht, tegen Mozes, te spreken?", "Hagg 2:6": "Met het woord, waarmee Ik met u een verbond gemaakt heb, toen u uit Egypte trok, en met Mijn Geest, die in uw midden staat: wees niet bevreesd!", "Ps 17:14": "Met Uw hand van de mensen, o HEERE! Van de mensen, die van de wereld zijn, wier deel in dit leven is, wier buik U vult met Uw verborgen schat; de kinderen worden verzadigd, en zij laten hun overschot achter aan hun kinderen.", "2 Sam 17:24": "David nu kwam te Mahanaïm, en Absalom trok de Jordaan over, hij en alle mannen van Israël met hem.", "Luk 24:28": "En zij kwamen dichtbij het dorp waar zij naartoe gingen; en Hij deed alsof Hij verder zou gaan.", "Jes 49:7": "Zo zegt de HEERE, de Verlosser van Israël, Zijn Heilige, tegen de veracht ziel, tegen Hem aan Wie het volk een gruwel heeft, tegen de Knecht van hen die heersen: Koningen zullen het zien en opstaan, ook vorsten, en zij zullen zich voor U buigen; om de wil van de HEERE, Die getrouw is, om de Heilige van Israël, Die U verkozen heeft.", "Hos 2:18": "En Ik zal u aan Mij verloven in eeuwigheid; ja, Ik zal u aan Mij verloven in gerechtigheid en in recht, en in goedertierenheid en in barmhartigheden.", "Ps 60:3-5": "O God! U had ons verstoten, U had ons uiteengescheurd, U bent toornig geweest; keer terug tot ons. U hebt het land geschud, U hebt het gespleten; genees zijn breuken, want het wankelt. U hebt Uw volk een harde zaak laten zien; U hebt ons te drinken gegeven zwijmelwijn.", "Gen 30:8": "Toen zei Rachel: Ik heb worstelingen van God met mijn zuster geworsteld; ook heb ik de overhand gehad; en zij noemde zijn naam Nafthali.", "Ps 46:8": "De HEERE van de heerscharen is met ons; de God van Jakob is ons een Hoog Vertrek. Sela.", "1 Tess 5:24": "Hij, Die u roept, is getrouw, Die het ook doen zal.", "2 Kron 20:6": "En hij zei: HEERE, God van onze vaderen, bent U niet de God in de hemel? Ja, U heerst over alle koninkrijken van de heidenvolken; en in Uw hand is kracht en sterkte, zodat niemand tegen U stand kan houden.", "Ps 18:5-7": "Banden van de dood hadden mij omvangen, en beken van Belial verschrikten mij. Banden van het graf omringden mij, strikken van de dood bejegenden mij. Toen het mij bang was, riep ik de HEERE aan, en riep tot mijn God; Hij hoorde mijn stem uit Zijn paleis, en mijn geroep voor Zijn aangezicht kwam in Zijn oren.", "Ps 92:5": "Want U hebt mij verblijd, HEERE! met Uw daden, ik zal juichen over de werken van Uw handen.", "Ps 90:15": "Verblijd ons naar de dagen, waarin U ons gedrukt hebt, naar de jaren, waarin wij het kwaad gezien hebben.", "Matt 7:8": "Want ieder die bidt, ontvangt; en wie zoekt, vindt; en wie klopt, voor hem zal opengedaan worden.", "Gen 32:24-30": "Maar Jakob bleef alleen achter; en een man worstelde met hem, totdat de dageraad opging. En toen Hij zag dat Hij niet de overhand over hem kreeg, raakte Hij zijn heupgewricht aan, zodat het heupgewricht van Jakob verwrongen raakte, terwijl Hij met hem worstelde. En Hij zei: Laat Mij gaan, want de dageraad is opgegaan. Maar hij zei: Ik zal U niet laten gaan, tenzij U mij zegent.", "Jer 15:20": "Want Ik heb u tegen dit volk gesteld tot een koperen versterkte muur; zij zullen wel tegen u strijden, maar u niet overwinnen; want Ik ben met u, om u te behouden en om u te redden, spreekt de HEERE.", "Ps 102:19-21": "Dat zal geschreven worden voor het volgende geslacht; en het volk, dat geschapen zal worden, zal de HEERE loven; Omdat Hij uit de hoogte van het heiligdom zal hebben neerwaarts gezien; dat de HEERE uit de hemel op de aarde geschouwd zal hebben; Om het zuchten van de gevangenen te horen, om los te maken de kinderen van de dood;", "Ps 71:18": "Daarom ook, terwijl het ouderdom en de grijsheid daar zijn, verlaat mij niet, o God, totdat ik aan dit geslacht Uw arm verkondig, aan alle nakomelingen Uw macht.", "Ps 30:4": "HEERE! U hebt mijn ziel uit het graf opgevoerd; U hebt mij bij het leven behouden, zodat ik niet in de kuil neerdaalde.", "Ps 44:5": "U Zelf bent mijn Koning, o God! Gebied de verlossingen van Jakob.", "Luk 17:10": "Zo ook u: wanneer u alles gedaan hebt wat u bevolen is, zeg dan: Wij zijn onnutte dienstknechten; want wij hebben alleen maar gedaan wat wij verplicht waren te doen.", "1 Joh 1:3": "Wat wij dan gezien en gehoord hebben, dat verkondigen wij u, opdat ook u met ons gemeenschap zou hebben, en deze onze gemeenschap ook is met de Vader, en met Zijn Zoon Jezus Christus.", "Ef 1:20": "Die Hij gewrocht heeft in Christus, toen Hij Hem uit de doden heeft opgewekt; en Hem heeft gezet aan Zijn rechterhand in de hemel;", "Ps 74:19": "Geef het leven van Uw tortelduif niet over aan het wilde gedierte; vergeet het leven van Uw ellendigen niet voor eeuwig.", "1 Kor 2:10": "Maar God heeft het ons geopenbaard door Zijn Geest; want de Geest onderzoekt alle dingen, ook de diepten van God.", "Hand 10:35": "maar in ieder volk is hij die Hem vreest en gerechtigheid doet, Hem aangenaam.", "Neh 6:9": "Want zij allen probeerden ons bang te maken, met de gedachte: Hun handen zullen van het werk aflaten, zodat het niet klaarkomt. Nu dan, sterk mijn handen!", "Jes 60:10": "En de vreemden zullen uw muren bouwen, en hun koningen zullen u dienen; want in Mijn verbolgenheid heb Ik u geslagen, maar in Mijn welbehagen heb Ik Mij over u ontfermd.", "Joz 7:8": "Och, Heere! Wat zal ik zeggen, nu Israël voor het aangezicht van zijn vijanden de rug heeft gekeerd?", "Gen 41:16": "En Jozef antwoordde Farao: Het is niet aan mij! God zal Farao welzijn aanzeggen.", "Luk 24:29": "En zij drongen bij Hem aan en zeiden: Blijf bij ons, want het is bijna avond, en de dag is bijna voorbij. En Hij ging naar binnen om bij hen te blijven.", "2 Sam 7:28": "Nu dan, Heere HEERE! U bent die God, en Uw woorden zullen waarheid zijn, en U hebt dit goede tot Uw knecht gesproken.", "Rom 11:1": "Ik zeg dan: Heeft God Zijn volk verstoten? Dat zij verre. Want ik ben ook een Israëliet, uit het zaad van Abraham, van de stam Benjamin.", "Ps 146:6": "Die de hemel en de aarde gemaakt heeft, de zee en alles wat daarin is; Die trouw houdt in eeuwigheid.", "1 Sam 25:28": "Vergeef toch uw dienstmaagd de overtreding, want de HEERE zal mijn heer zeker een bestendig huis maken, omdat mijn heer de oorlogen van de HEERE voert, en er geen kwaad bij u gevonden is al uw dagen.", "Ex 33:22": "En het zal gebeuren, wanneer Mijn heerlijkheid voorbijgaat, dat Ik u in een kloof van de steenrots zal zetten; en Ik zal u met Mijn hand overdekken, totdat Ik voorbijgegaan zal zijn.", "Gen 27:28": "Zo geeft God u dan van de dauw van de hemel, en van de vettigheid van de aarde, en overvloed van koren en most.", "Gen 18:32": "Nog zei hij: Laat de Heere toch niet boos worden, dat ik alleen deze keer nog spreek: misschien zullen er tien gevonden worden. En Hij zei: Ik zal haar niet verwoesten omwille van de tien.", "Spr 14:9": "Elke dwaas maakt de schuld belachelijk; maar onder de oprechten is goedwilligheid.", "Richt 13:21": "En de Engel van de HEERE verscheen niet meer aan Manoach en aan zijn vrouw. Toen begreep Manoach dat het een Engel van de HEERE was.", "Richt 7:16-23": "En hij deelde de driehonderd man in drie groepen; en hij gaf ieder een bazuin in zijn hand, en lege kruiken, en fakkels in het midden van de kruiken. En hij zei tegen hen: Kijk naar mij en doe hetzelfde; en zie, wanneer ik aan het uiterste van het leger kom, zal het zo zijn: zoals ik zal doen, zo zult u doen. Als ik met de bazuin blaas, ik en allen die met mij zijn, dan zult ook u met de bazuin blazen, rondom het hele leger, en u zult zeggen: Voor de HEERE en voor Gideon!", "Jer 16:19": "O HEERE! U bent mijn Sterkte, en mijn Sterkheid, en mijn Toevlucht ten dage van de benauwdheid; tot U zullen de heidenen komen van de einden van de aarde, en zeggen: Zeker hebben onze vaders leugen erfelijk bezeten, en ijdelheid, waarin toch niets was, dat nut deed.", "Ps 35:25": "Laat hen niet zeggen in hun hart: Haha, onze ziel! Laat hen niet zeggen: Wij hebben hem verslonden!", "Ex 6:4": "En ook heb Ik het gekerm gehoord van de kinderen van Israël, die de Egyptenaars in dienstbaarheid houden, en Ik heb aan Mijn verbond gedacht.", "Ps 22:2": "Mijn God, mijn God! Waarom hebt U mij verlaten, ver zijnde van mijn verlossing, van de woorden van mijn brullen?", "Job 9:15": "Aan wie ik, ook al was ik rechtvaardig, niet zou antwoorden; mijn Rechter zal ik om genade bidden.", "Ex 20:24": "Maak Mij een altaar van aarde, en offer daarop uw brandoffers en uw dankoffers, uw schapen en uw runderen; op elke plaats waar Ik Mijn Naam gedenken zal, zal Ik tot u komen en zal u zegenen.", "1 Kon 12:25": "Jerobeam nu bouwde Sichem op het gebergte van Efraïm, en woonde daarin, en trok van daar verder, en bouwde Penuël.", "Gen 30:43": "En die man breidde zich zeer sterk uit, en hij had veel kudden, en dienstmaagden, en dienstknechten, en kamelen, en ezels.", "2 Kron 20:12": "O, onze God, zult U geen recht over hen oefenen? Want in ons is geen kracht tegen deze grote menigte, die tegen ons optrekt, en wij weten niet wat wij moeten doen; maar onze ogen zijn op U gericht.", "Ps 10:12-15": "Sta op, HEERE God! Hef Uw hand op, vergeet de ellendigen niet. Waarom lastert de goddeloze God? Hij zegt in zijn hart: U zult het niet zoeken? U ziet het zeker; want U aanschouwt de moeite en het verdriet, opdat men het in Uw hand geeft; op U verlaat de arme zich, U bent geweest een Helper van de wees.", "Luk 2:52": "En Jezus nam toe in wijsheid en grootte, en in genade bij God en de mensen.", "Jes 43:21": "Dit volk heb Ik Mij geformeerd, zij zullen Mijn lof vertellen.", "Deut 31:6": "Wees sterk en heb goede moed, en vrees niet, en schrik niet voor hen; want het is de HEERE, uw God, Die met u meegaat; Hij zal u niet loslaten, en u niet verlaten.", "Ps 44:8": "Maar U verlost ons van onze tegenstanders, en U maakt onze haters beschaamd.", "Ps 142:2": "Ik riep met mijn stem tot de HEERE; ik smeekte tot de HEERE met mijn stem.", "Rom 11:2": "God heeft Zijn volk niet verstoten, dat Hij van tevoren gekend heeft. Of weet u niet wat de Schrift zegt van Elia, hoe hij God aanspreekt tegen Israël, en zegt:", "Job 19:25-27": "Want ik weet: mijn Verlosser leeft, en Hij zal als de laatste over het stof opstaan; En als zij na mijn huid dit doorknaagd zullen hebben, zal ik uit mijn vlees God aanschouwen; Aan Wie ik voor mij aanschouwen zal, en mijn ogen zien zullen, en niet een vreemde; mijn nieren verlangen zeer in mijn schoot.", "Gen 47:25": "En zij zeiden: U hebt ons leven gered; laten wij genade vinden in de ogen van mijn heer, en wij zullen knechten van Farao zijn.", "Matt 11:27": "Alle dingen zijn Mij overgegeven door Mijn Vader; en niemand kent de Zoon dan de Vader, en niemand kent de Vader dan de Zoon, en wie het de Zoon wil openbaren.", "Gen 48:11": "En Israël zei tegen Jozef: Ik had niet gedacht uw gezicht te zien; maar zie, God heeft mij ook uw nageslacht laten zien!", "Richt 6:22-24": "Toen zag Gideon dat het een Engel van de HEERE was; en Gideon zei: Ach, Heere HEERE! Want ik heb een Engel van de HEERE gezien, van aangezicht tot aangezicht. Doch de HEERE zei tegen hem: Vrede zij u, vrees niet, u zult niet sterven. Toen bouwde Gideon daar voor de HEERE een altaar, en noemde het: De Heere is vrede! Het staat nog tot op deze dag in Ofra van de Abiëzrieten.", "Job 33:6": "Zie, ik ben Gods, net als u; uit het leem ben ik ook afgesneden.", "Gen 33:10": "Toen zei Jakob: Nee toch! Als ik nu genade in uw ogen gevonden heb, neem dan mijn geschenk uit mijn hand aan; want ik heb daarom uw gezicht gezien alsof ik Gods gezicht gezien had, en u hebt mij welwillend ontvangen.", "Ps 18:31": "Gods weg is volmaakt; de rede van de HEERE is doorlouterd; Hij is een Schild voor allen die op Hem vertrouwen.", "Job 34:31": "Zeker heeft hij tot God gezegd: Ik heb Uw straf verdragen, ik zal het niet verderven.", "1 Sam 25:35": "Toen nam David uit haar hand wat zij hem gebracht had; en hij zei tegen haar: Trek in vrede op naar uw huis; zie, ik heb naar uw stem geluisterd, en heb u aanvaard.", "Jes 54:8": "In een kleine toorn heb Ik Mijn aangezicht van u een ogenblik verborgen; maar met eeuwige goedertierenheid zal Ik Mij over u ontfermen, zegt de HEERE, uw Verlosser.", "Ps 36:10": "Want bij U is de fontein van het leven; in Uw licht zien wij het licht.", "1 Kon 8:36-50": "hoor Ú dan in de hemel, en vergeef de zonde van Uw dienaren en van Uw volk Israël, wanneer U hun de goede weg geleerd zult hebben waarin zij wandelen zullen; en geef regen op Uw land, dat U Uw volk tot een erfenis gegeven hebt. Als er honger in het land zal zijn, als er pest zal zijn, als er brandkoren, honingdauw, sprinkhanen, of kevers zullen zijn, als zijn vijand hem in het land van zijn poorten belegeren zal, of welke plaag of welke ziekte er ook zal zijn; elk gebed, elke smeking, die door enig mens, door al Uw volk Israël gebeuren zal; wanneer zij erkennen, ieder de plaag van zijn eigen hart, en ieder zijn handen in dit huis uitbreiden zal;", "Gen 22:16-18": "En zei: Ik zweer bij Mijzelf, spreekt de HEERE; omdat u dit gedaan hebt, en uw zoon, uw enige, niet onthouden hebt; Voorzeker zal Ik u rijk zegenen, en uw nageslacht zeer talrijk maken, als de sterren van de hemel, en als het zand dat aan de oever van de zee is; en uw nageslacht zal de poort van zijn vijanden erfelijk bezitten. En in uw nageslacht zullen alle volken van de aarde gezegend worden, omdat u Mijn stem gehoorzaam bent geweest.", "Hebr 7:25": "Daarom kan Hij ook volkomen zalig maken hen die door Hem tot God gaan, omdat Hij altijd leeft om voor hen te bidden.", "Neh 9:32": "Nu dan, o onze God, U grote, U machtige, en U ontzagwekkende God, Die het verbond en de weldadigheid houdt; laat voor Uw aangezicht niet gering zijn al de moeite, die ons getroffen heeft, onze koningen, onze vorsten, en onze priesters; en onze profeten, en onze vaderen, en Uw hele volk, vanaf de dagen van de koningen van Assur tot op deze dag.", "Ps 116:4": "Maar ik riep de Naam van de HEERE aan: Och HEERE, bevrijd mijn ziel.", "Ps 148:2": "Looft Hem, al Zijn engelen! Looft Hem, al Zijn heerscharen!", "Jes 63:17-19": "HEERE! Waarom laat U ons van Uw wegen dwalen, waarom verstokt U ons hart, zodat wij U niet vrezen? Keer terug om Uw dienaren wil, de stammen van Uw erfdeel. Uw heilig volk heeft het maar een korte tijd bezeten; onze tegenstanders hebben Uw heiligdom vertreden. Wij zijn geworden als zij over wie U van ouds niet hebt geheerst, en die naar Uw Naam niet genoemd zijn.", "1 Kron 17:26": "Nu dan, HEERE, U bent die God; en U hebt dit goede over Uw knecht gesproken.", "Klaagl 5:17": "Daarom is ons hart mat, om deze dingen zijn onze ogen duister geworden.", "2 Sam 19:31": "Barzillai, de Gileadiet, kwam ook naar beneden uit Rogelim; en hij trok met de koning de Jordaan over, om hem over de Jordaan te begeleiden.", "Ps 119:28": "Mijn ziel druipt weg van treurigheid; richt mij op naar Uw woord.", "Ps 115:15": "U bent door de HEERE gezegend, Die de hemel en de aarde gemaakt heeft.", "Jer 31:18": "Ik heb wel gehoord dat Efraïm zich beklaagt, en zegt: U hebt mij getuchtigd, en ik ben getuchtigd zoals een ongewend kalf. Bekeer mij, dan zal ik bekeerd zijn, want U bent de HEERE, mijn God!", "2 Sam 7:14": "Ik zal hem tot een Vader zijn, en hij zal Mij tot een zoon zijn; wanneer hij misdoet, zal Ik hem straffen met een mensenroede en met plagen van de mensenkinderen.", "Jer 14:9": "Waarom zou U zijn als een verschrikte man, als een held die niet kan verlossen? U bent toch in het midden van ons, o HEERE! En wij zijn naar Uw Naam genoemd; verlaat ons niet.", "Mark 9:28": "En toen Hij in huis gegaan was, vroegen Zijn discipelen Hem apart: Waarom konden wij hem niet uitdrijven?", "Joz 24:4": "En aan Izak gaf Ik Jakob en Ezau; en Ik gaf aan Ezau het gebergte Seïr, om dat te bezitten; maar Jakob en zijn kinderen trokken naar Egypte.", "Ef 2:16": "en opdat Hij die beiden met God in één lichaam zou verzoenen door het kruis, nadat Hij de vijandschap daaraan gedood had.", "1 Kon 8:25": "En nu, HEERE, God van Israël, houd Uw dienaar, mijn vader David, wat U tot hem gesproken hebt, en zei: Er zal u geen man van voor Mijn aangezicht afgesneden worden, die op de troon van Israël zit; alleen als uw zonen hun weg bewaren, om te wandelen voor Mijn aangezicht, zoals u gewandeld hebt voor Mijn aangezicht.", "Jer 18:21": "Daarom, geef hun zonen over aan de honger, en doe hen wegvloeien door het geweld van het zwaard, en laat hun vrouwen van kinderen beroofd en weduwe worden, en laat hun mannen door de dood omgebracht worden, en hun jongemannen met het zwaard geslagen worden in de strijd.", "Ps 66:8": "Looft, volken, onze God; en laat de stem van Zijn roem horen.", "Ps 74:11": "Waarom trekt U Uw hand, ja, Uw rechterhand terug? Trek haar uit het midden van Uw boezem; maak er een einde aan.", "Ps 119:39": "Wend mijn smaad af, die ik vrees, want Uw rechten zijn goed.", "Ps 10:1": "HEERE, waarom staat U ver weg? Waarom verbergt U Zich in tijden van benauwdheid?", "Ps 141:5": "Laat de rechtvaardige mij slaan, het zal weldadigheid zijn; en laat hij mij bestraffen, het zal olie van het hoofd zijn, het zal mijn hoofd niet breken; want ook dan zal mijn gebed voor hen zijn in hun tegenspoeden.", "Hand 7:59": "En zij stenigden Stefanus, terwijl hij aanriep en zei: Heere Jezus, ontvang mijn geest.", "Jes 40:28": "Weet u het niet? Hebt u niet gehoord, dat de eeuwige God, de HEERE, de Schepper van de einden van de aarde, noch moede noch mat wordt? Er is geen doorgronding van Zijn verstand.", "Matt 7:7": "Bid, en u zal gegeven worden; zoek, en u zult vinden; klop, en u zal opengedaan worden.", "Ps 109:1-31": "Een psalm van David, voor de koorleider. O God van mijn lof! Zwijg niet. Want de mond van de goddeloze en de mond van het bedrog zijn tegen mij opengedaan; zij hebben tegen mij gesproken met een valse tong. En met hatelijke woorden hebben zij mij omsingeld; ja, zij hebben mij bestreden zonder oorzaak.", "Ps 88:2": "O HEERE, God van mijn heil! Bij dag, bij nacht roep ik voor U.", "Gal 1:6": "Ik verwonder mij dat u zo snel, wijkend van hem die u in de genade van Christus geroepen heeft, overgebracht wordt naar een ander evangelie;", "Gen 27:29": "Volken zullen u dienen, en volken zullen zich voor u neerbuigen; wees heer over uw broers, en de zonen van uw moeder zullen zich voor u neerbuigen! Vervloekt moet hij zijn, wie u vervloekt; en wie u zegent, zij gezegend!", "Mal 4:2": "Voor u echter, die Mijn Naam vreest, zal de Zon der gerechtigheid opgaan, met genezing onder Haar vleugels; en u zult uitgaan en toenemen als mestkalveren.", "Deut 9:25-29": "En ik wierp mij neer voor het aangezicht van de HEERE, die veertig dagen en veertig nachten waarin ik mij neerwierp, omdat de HEERE gezegd had dat Hij u verdelgen zou. En ik bad tot de HEERE, en zei: Heere, HEERE, verderf Uw volk en Uw erfdeel niet, dat U door Uw grootheid verlost hebt; dat U uit Egypte door een sterke hand hebt uitgevoerd. Denk aan Uw knechten, Abraham, Izak en Jakob; zie niet op de hardheid van dit volk, noch op zijn goddeloosheid, noch op zijn zonde;", "Ps 69:14": "Maar mij aangaande, mijn gebed is tot U, o HEERE; er is een tijd van het welbehagen, o God! Door de grootheid van Uw goedertierenheid; verhoor mij door de trouw van Uw heil.", "Ps 8:4": "Als ik Uw hemel aanzie, het werk van Uw vingers, de maan en de sterren, die U bereid hebt;", "Luk 11:9": "En Ik zeg u: Bid, en u zal gegeven worden; zoek, en u zult vinden; klop, en u zal opengedaan worden.", "Kol 1:15": "Die het Beeld is van de onzienlijke God, de Eerstgeborene van alle schepselen.", "Num 31:34": "En eenenzestigduizend ezels;", "Lev 26:45": "Maar Ik zal hun ten goede denken aan het verbond van hun voorouders, die Ik uit het land Egypte voor de ogen van de heidenen uitgevoerd heb, opdat Ik hun tot een God zou zijn; Ik ben de HEERE!", "Ps 70:3": "Laat hen beschaamd en schaamrood worden, die mijn ziel zoeken; laat hen achterwaarts gedreven en te schande worden, die lust hebben aan mijn kwaad.", "1 Kor 2:11": "Want wie van de mensen weet wat een mens is, dan de geest van de mens die in hem is? Zo weet ook niemand wat van God is, dan de Geest van God.", "2 Sam 22:7": "Toen het mij bang was, riep ik de HEERE aan, en riep tot mijn God; en Hij hoorde mijn stem uit Zijn paleis, en mijn geroep kwam in Zijn oren.", "Ps 97:2": "Rondom Hem zijn wolken en donkerheid, gerechtigheid en recht zijn de vastigheid van Zijn troon.", "Ps 83:3": "Want zie, Uw vijanden maken misbaar, en Uw haters steken het hoofd op.", "Deut 2:5": "Meng u niet met hen; want Ik zal u van hun land niets geven, ook niet zoveel als een voetzool breed; want Ik heb Ezau het gebergte Seir tot erfenis gegeven.", "Ex 14:27": "Toen strekte Mozes zijn hand uit over de zee; en de zee kwam terug, tegen het aanbreken van de morgen, tot haar kracht; en de Egyptenaren vluchtten die tegemoet; en de HEERE stortte de Egyptenaren in het midden van de zee.", "Ex 33:14": "Hij dan zei: Zou Mijn aangezicht met u meegaan, om u rust te geven?", "Ps 80:15": "O God van de heerscharen! Keer toch terug; kijk uit de hemel, en zie, en zoek dan om te helpen deze wijnstok,", "Ps 18:20": "En Hij voerde mij uit in de ruimte, Hij rukte mij eruit, want Hij had lust aan mij.", "1 Kor 15:47": "De eerste mens is uit de aarde, aards; de tweede Mens is de Heere uit de hemel.", "Job 16:20": "Mijn vrienden bespotten mij; maar mijn oog druipt tot God.", "Ps 17:13": "Sta op, HEERE, kom hem voor, werp hem neer; bevrijd mijn ziel met Uw zwaard van de goddeloze;", "Richt 6:36-40": "En Gideon zei tegen God: Als U Israël door mijn hand zult verlossen, zoals U gesproken hebt, zie, ik zal een wollen vlies op de dorsvloer leggen; als er dauw op het vlies alleen zal zijn, en droogte op de hele aarde, dan zal ik weten dat U Israël door mijn hand zult verlossen, zoals U gesproken hebt. En het gebeurde zo; want hij stond de volgende morgen vroeg op, en kneep het vlies uit, en hij wrong de dauw uit het vlies, een schaal vol water.", "Ps 8:6": "En hebt U hem een weinig minder gemaakt dan de engelen, en hebt U hem met eer en heerlijkheid gekroond?", "Ps 71:4": "Mijn God, bevrijd mij van de hand van de goddeloze, van de hand van hem die verkeerd handelt, en van de opgeblazene.", "Spr 18:16": "Het geschenk van een mens maakt hem ruimte, en het brengt hem voor het aangezicht van de groten.", "1 Tim 1:15": "Dit is een betrouwbaar woord, en alle aanneming waard, dat Christus Jezus in de wereld gekomen is om de zondaars zalig te maken, van wie ik de voornaamste ben.", "Ps 71:2": "Red mij door Uw gerechtigheid, en bevrijd mij; neig Uw oor tot mij, en verlos mij.", "Jes 55:8": "Want Mijn gedachten zijn niet uw gedachten, en uw wegen zijn niet Mijn wegen, spreekt de HEERE.", "Ps 89:6": "Daarom loven de hemelen Uw wonderen, o HEERE! ook is Uw getrouwheid in de gemeente van de heiligen.", "Rom 11:33": "O diepte van de rijkdom, én van de wijsheid én van de kennis van God, hoe ondoorzoekelijk zijn Zijn oordelen, en onnaspeurlijk Zijn wegen!", "Gen 43:14": "En God, de Almachtige, geve u barmhartigheid bij die man, dat hij uw andere broer en Benjamin met u laat teruggaan! En wat mij aangaat, als ik van mijn kinderen beroofd word, dan ben ik maar beroofd!", "Hab 1:12": "Bent U niet van ouds af de HEERE, mijn God, mijn Heilige? Wij zullen niet sterven; o HEERE! Tot een oordeel hebt U hem gesteld, en o Rots! Om te straffen hebt U hem gegrondvest.", "Joh 7:38": "Wie in Mij gelooft, zoals de Schrift zegt: stromen van levend water zullen uit zijn buik vloeien.", "Ps 89:29": "Ik zal hem Mijn goedertierenheid in eeuwigheid bewaren, en Mijn verbond zal hem vast blijven.", "2 Sam 15:32-34": "En het gebeurde, toen David tot op de hoogte kwam, waar hij God aanbad, zie, toen ontmoette Husai, de Archiet, hem, met zijn kleed gescheurd, en aarde op zijn hoofd. En David zei tegen hem: Als u met mij meegaat, zult u mij tot een last zijn; maar als u teruggaat naar de stad, en tegen Absalom zegt: Uw knecht, ik zal van de koning zijn; ik ben eerder wel de knecht van uw vader geweest, maar nu zal ik uw knecht zijn; dan zou u voor mij de raad van Achitofel teniet doen.", "Ex 12:31-33": "Toen riep hij Mozes en Aäron in de nacht, en zei: Maakt u op, trekt uit het midden van mijn volk, u en de kinderen van Israël; en gaat heen, dient de HEERE, zoals u gesproken hebt. Neemt ook met u uw schapen en uw runderen, zoals u gesproken hebt, en gaat heen, en zegent mij ook. En de Egyptenaren drongen sterk aan bij het volk, om ze snel uit het land te drijven; want zij zeiden: Wij zijn allen dood!", "Luk 23:46": "En Jezus riep met luide stem en zei: Vader, in Uw handen beveel Ik Mijn geest. En toen Hij dat gezegd had, gaf Hij de geest.", "Gen 31:36-55": "Toen werd Jakob boos, en twistte met Laban; en Jakob antwoordde en zei tegen Laban: Wat is mijn overtreding, wat is mijn zonde, dat u mij zo heftig achterna hebt gejaagd? Nu u al mijn huisraad doorzocht hebt, wat hebt u gevonden van al het huisraad van uw huis! Leg het hier voor mijn broeders en uw broeders, en laat hen oordelen tussen ons beiden. Deze twintig jaar ben ik bij u geweest; uw ooien en uw geiten hebben niet misdragen, en de rammen van uw kudde heb ik niet gegeten.", "Ps 119:42": "Opdat ik mijn smader wat heb te antwoorden, want ik vertrouw op Uw woord.", "1 Kon 8:15": "En hij zei: Geloofd zij de HEERE, de God van Israël, Die met Zijn mond tot mijn vader David gesproken heeft, en het met Zijn hand vervuld heeft, en zei:", "Gen 24:27": "en hij zei: Geloofd zij de HEERE, de God van mijn heer Abraham, Die Zijn weldadigheid en trouw niet onthouden heeft aan mijn heer; wat mij betreft, de HEERE heeft mij op deze weg geleid, naar het huis van de broers van mijn heer.", "1 Kon 8:60": "Opdat alle volken van de aarde weten, dat de HEERE die God is, niemand anders.", "Richt 20:29-43": "Toen stelde Israël hinderlagen op tegen Gibea rondom. En de kinderen van Israël trokken op, op de derde dag, tegen de kinderen van Benjamin; en zij schikten de strijd tegen Gibea, zoals de andere keren. Toen trokken de kinderen van Benjamin uit, het volk tegemoet, en werden van de stad afgetrokken; en zij begonnen te slaan van het volk, en te doorsteken, zoals de andere keren, op de wegen waarvan de ene opgaat naar het huis van God, en de andere naar Gibea, in het veld, ongeveer dertig man van Israël.", "Jes 49:16": "Zie, Ik heb u in de beide handpalmen gegraveerd; uw muren zijn steeds voor Mij.", "1 Kron 4:10": "Want Jabez riep de God van Israël aan, en zei: Als U mij rijkelijk zegent, en mijn gebied vermeerdert, en Uw hand met mij zal zijn, en U mij zo voor het kwade behoedt, dat het mij geen smart doet! En God liet komen wat hij begeerde.", "Ps 60:13": "Geef Ú ons hulp uit de benauwdheid, want de hulp van de mens is ijdelheid.", "Ps 89:34": "Maar Mijn goedertierenheid zal Ik van hem niet wegnemen, en in Mijn getrouwheid niet feilen.", "Fil 4:7": "En de vrede van God, die alle verstand te boven gaat, zal uw harten en uw gedachten bewaren in Christus Jezus.", "Ps 74:18-23": "Denk hieraan; de vijand heeft de HEERE gesmaad, en een dwaas volk heeft Uw Naam gelasterd. Geef het leven van Uw tortelduif niet over aan het wilde gedierte; vergeet het leven van Uw ellendigen niet voor eeuwig. Zie naar het verbond; want de duistere plaatsen van het land zijn vol woningen van geweld.", "Ps 9:21": "O HEERE! jaag hun vrees aan; laat de heidenen weten, dat zij mensen zijn. Sela.", "Jes 44:21": "Denk aan deze dingen, o Jakob, en Israël! Want u bent Mijn knecht, Ik heb u geformeerd; u bent Mijn knecht, Israël, u zult door Mij niet vergeten worden.", "Gen 28:14": "En uw nageslacht zal zijn als het stof van de aarde, en u zult uitbreiden in menigte, westwaarts en oostwaarts, en noordwaarts en zuidwaarts; en in u, en in uw nageslacht zullen alle geslachten van de aardbodem gezegend worden.", "Hebr 6:13-19": "Want toen God aan Abraham de belofte deed, zwoer Hij bij Zichzelf, omdat Hij bij niemand groter kon zweren, en zei: Waarlijk, Ik zal u overvloedig zegenen, en Ik zal u overvloedig meer maken. En zo heeft hij, nadat hij geduldig volhard had, de belofte verkregen.", "Jes 38:15": "Wat zal ik spreken? Zoals Hij het mij heeft toegezegd, zo heeft Hij het gedaan; ik zal nu al zoetjes voortgaan al mijn jaren, vanwege de bitterheid van mijn ziel.", "Job 39:38": "Eenmaal heb ik gesproken, maar zal niet antwoorden; of tweemaal, maar zal niet voortvaren.", "Gen 22:12": "Toen zei Hij: Strek uw hand niet uit naar de jongen, en doe hem niets! Want nu weet Ik dat u God vrezend bent, en uw zoon, uw enige, niet van Mij hebt onthouden.", "Job 10:15": "Ben ik goddeloos, wee mij! En ben ik rechtvaardig, ik zal mijn hoofd niet opheffen; ik ben verzadigd van schande, maar zie mijn ellende aan.", "2 Sam 22:31": "Gods weg is volmaakt; het woord van de HEERE is doorlouterd; Hij is een Schild voor allen die op Hem vertrouwen.", "Ps 8:5": "Wat is de mens, dat U aan hem denkt, en de zoon des mensen, dat U hem bezoekt?", "Fil 4:12": "En ik weet vernederd te worden, ik weet ook overvloed te hebben; in alle opzichten en in alles ben ik ingewijd, zowel verzadigd te zijn als honger te lijden, zowel overvloed te hebben als gebrek te lijden.", "Job 42:9": "Toen gingen Elifaz, de Themaniet, en Bildad, de Suhiet, en Zofar, de Naämathiet, heen, en deden, zoals de HEERE tot hen gesproken had; en de HEERE nam het aangezicht van Job aan.", "Jer 10:23": "Ik weet, o HEERE! dat bij de mens zijn weg niet is; het is niet bij een man die wandelt, dat hij zijn gang oordeelt.", "Gen 6:8": "Maar Noach vond genade in de ogen van de HEERE.", "Ex 9:28": "Bid vurig tot de HEERE (want het is genoeg), dat er geen donder van God of hagel meer zal zijn; dan zal ik u laten gaan, en u zult niet langer hoeven te blijven.", "Gen 29:21-35": "Toen zei Jakob tegen Laban: Geef mij mijn vrouw, want mijn dagen zijn vervuld, zodat ik bij haar kan komen. Zo verzamelde Laban alle mannen van die plaats, en maakte een maaltijd. En het gebeurde 's avonds, dat hij zijn dochter Lea nam, en haar bij hem bracht; en hij kwam bij haar.", "Ps 119:107": "Ik ben helemaal zeer verdrukt, HEERE! maak mij levend naar Uw woord.", "Jes 28:5": "Op die dag zal de HEERE van de heerscharen tot een heerlijke kroon en tot een sierlijke krans zijn voor het overblijfsel van Zijn volk;", "Luk 1:17": "En hij zal voor Hem uit gaan, in de geest en de kracht van Elia, om de harten van de vaders tot de kinderen te bekeren, en de ongehoorzamen tot de wijsheid van de rechtvaardigen, om voor de Heere een toegerust volk gereed te maken.", "Ef 2:18": "Want door Hem hebben wij beiden de toegang door één Geest tot de Vader.", "Ex 24:11": "Doch Hij strekte Zijn hand niet tot de aanzienlijken van de kinderen Israëls; maar zij aten en dronken, nadat zij God gezien hadden.", "1 Kron 17:27": "Nu dan, het heeft U behaagd het huis van Uw knecht te zegenen, zodat het in eeuwigheid voor Uw aangezicht zal zijn; want U, HEERE, hebt het gezegend, en het zal gezegend zijn in eeuwigheid.", "Gen 32:24-28": "Maar Jakob bleef alleen achter; en een man worstelde met hem, totdat de dageraad opging. En toen Hij zag dat Hij niet de overhand over hem kreeg, raakte Hij zijn heupgewricht aan, zodat het heupgewricht van Jakob verwrongen raakte, terwijl Hij met hem worstelde. En Hij zei: Laat Mij gaan, want de dageraad is opgegaan. Maar hij zei: Ik zal U niet laten gaan, tenzij U mij zegent.", "2 Sam 7:18": "Toen ging koning David naar binnen, en bleef voor het aangezicht van de HEERE, en hij zei: Wie ben ik, Heere HEERE, en wat is mijn huis, dat U mij tot hiertoe gebracht hebt?", "Gen 24:35": "en de HEERE heeft mijn heer zeer gezegend, zodat hij groot geworden is; en Hij heeft hem gegeven schapen, en runderen, en zilver, en goud, en knechten, en dienstmeisjes, en kamelen, en ezels.", "Gen 34:28": "Hun schapen, en hun runderen, en hun ezels, en wat er in de stad was, en wat er in het veld was, namen zij mee.", "Ex 17:4": "Toen riep Mozes tot de HEERE en zei: Wat moet ik met dit volk doen? Het scheelt niet veel, of zij zullen mij stenigen.", "Ex 32:32": "Nu dan, als Gij hun zonde wilt vergeven! Maar zo niet, delg mij dan nu uit Uw boek, dat Gij geschreven hebt.", "Ps 43:1": "Doe mij recht, o God! En voer Zelf mijn rechtszaak tegen een liefdeloos volk; bevrijd mij van de man van het bedrog en van het onrecht.", "1 Kor 10:13": "U heeft geen verzoeking overvallen dan een menselijke; en God is getrouw, Die niet zal toelaten dat u verzocht wordt boven wat u kunt dragen; maar Hij zal met de verzoeking ook de uitkomst geven, zodat u het kunt verdragen.", "1 Tim 2:8": "Ik wil dan dat de mannen bidden op alle plaatsen, met het opheffen van heilige handen, zonder toorn en twist.", "Ps 88:3": "Laat mijn gebed voor Uw aangezicht komen; neig Uw oor tot mijn geschrei.", "Ps 61:3": "Van het einde van het land roep ik tot U als mijn hart overstelpt is; leid mij op een rotssteen, die mij te hoog zou zijn.", "Joh 1:43": "En hij bracht hem tot Jezus. En Jezus keek hem aan, en zei: U bent Simon, de zoon van Jona; u zult Cefas genoemd worden, wat vertaald wordt als Petrus.", "Judas 1:1": "Judas, een dienstknecht van Jezus Christus, en broeder van Jakobus, aan de geroepenen, die door God de Vader geheiligd zijn, en door Jezus Christus bewaard:", "Ps 132:13": "Want de HEERE heeft Sion verkozen, Hij heeft het begeerd tot Zijn woonplaats, en zei:", "Ef 1:19": "En wat de uitnemende grootheid is van Zijn kracht aan ons, die geloven, naar de werking van de sterkte van Zijn macht,", "Ps 31:2-5": "Op U, o HEERE! vertrouw ik, laat mij niet beschaamd worden in eeuwigheid; help mij eruit door Uw gerechtigheid. Neig Uw oor tot mij, red mij haastig; wees mij tot een sterke Rotssteen, tot een zeer vast Huis, om mij te behouden. Want U bent mijn Steenrots en mijn Burg; leid mij dan, en voer mij, omwille van Uw Naam.", "Hebr 10:23": "Laten wij de onwankelbare belijdenis van de hoop vasthouden (want Die het beloofd heeft, is trouw);", "1 Joh 3:19": "En hieraan weten wij dat wij uit de waarheid zijn, en wij zullen ons hart verzekeren voor Hem.", "Luk 7:7": "Daarom heb ik ook mijzelf niet waard geacht om naar U toe te komen; maar spreek slechts een woord, en mijn knecht zal genezen worden.", "Luk 14:32": "Anders stuurt hij, terwijl die ander nog ver weg is, gezanten en vraagt om vredesvoorwaarden.", "Gen 43:15": "En die mannen namen dat geschenk, en namen dubbel geld in hun hand, en Benjamin; en zij maakten zich op, en trokken af naar Egypte, en zij stonden voor Jozefs gezicht.", "Ex 2:24": "En God hoorde hun gekerm, en God dacht aan Zijn verbond met Abraham, met Izak, en met Jakob.", "Ef 6:18": "Met alle bidden en smeken, terwijl u altijd bidt in de Geest, en daartoe waakt met alle volharding en smeking voor al de heiligen;", "1 Kon 8:26": "Nu dan, o God van Israël, laat toch Uw woord waar worden, dat U gesproken hebt tot Uw dienaar, mijn vader David.", "Ps 94:19": "Toen mijn gedachten in mij talrijk werden, hebben Uw vertroostingen mijn ziel verkwikt.", "Lev 26:11": "En Ik zal Mijn tabernakel in uw midden zetten; en Mijn ziel zal van u niet walgen.", "Ps 84:8": "Zij gaan van kracht tot kracht; ieder van hen zal verschijnen voor God in Sion.", "Hebr 11:27": "Door het geloof heeft hij Egypte verlaten, zonder bang te zijn voor de toorn van de koning; want hij hield vol, als iemand die de Onzichtbare ziet.", "Jes 51:6": "Hef uw ogen op naar de hemel, en kijk naar de aarde beneden; want de hemel zal als rook verdwijnen, en de aarde zal als een kleed verouderen, en haar inwoners zullen op dezelfde manier sterven; maar Mijn heil zal in eeuwigheid zijn, Mijn gerechtigheid zal niet verbroken worden.", "Ps 94:1-23": "O God van de wraken! O HEERE, God van de wraken! Verschijn blinkend! Gij, Rechter der aarde! Verhef U; breng vergelding weer over de hoogmoedigen. Hoe lang zullen de goddelozen, o HEERE! hoe lang zullen de goddelozen van vreugde opspringen?", "Jes 55:6": "Zoek de HEERE, terwijl Hij te vinden is; roep Hem aan, terwijl Hij nabij is.", "Job 39:37": "Zie, ik ben te gering; wat zou ik U antwoorden? Ik leg mijn hand op mijn mond.", "Ps 88:14": "Maar ik, HEERE, roep tot U, en mijn gebed komt U al voor in de morgenstond.", "Ps 27:11": "HEERE, leer mij Uw weg, en leid mij op het rechte pad, omwille van mijn verspieders.", "Luk 11:5-8": "En Hij zei tegen hen: Wie van u zal een vriend hebben, en zal midden in de nacht naar hem toe gaan, en tegen hem zeggen: Vriend! leen mij drie broden; Omdat mijn vriend van de reis bij mij gekomen is, en ik heb niets, dat ik hem kan voorzetten; En dat die van binnen dan zou antwoorden en zeggen: Val mij niet lastig; de deur is al gesloten, en mijn kinderen zijn met mij in de slaapkamer; ik kan niet opstaan om u te geven.", "Ps 75:11": "En ik zal alle hoorns van de goddelozen afhouwen; de hoorns van de rechtvaardige zullen verhoogd worden.", "Hand 14:22": "en versterkten de harten van de discipelen, en vermaanden hen om te blijven in het geloof, en dat wij door veel verdrukkingen het Koninkrijk van God moeten binnengaan.", "2 Sam 19:15": "Toen keerde de koning terug, en kwam tot aan de Jordaan; en Juda kwam naar Gilgal, om de koning tegemoet te gaan, om de koning over de Jordaan te brengen.", "Ps 5:9": "HEERE! Leid mij in Uw gerechtigheid, om mijn verspieders wil; richt Uw weg voor mijn aangezicht.", "Num 24:1": "Toen Bileam zag dat het goed was in de ogen van de HEERE dat hij Israël zegende, ging hij ditmaal niet, zoals de andere keren, op zoek naar toverijen; maar hij richtte zijn gezicht naar de woestijn.", "Gen 33:9": "Maar Ezau zei: Ik heb genoeg, mijn broer! Houd zelf wat u hebt!", "Jes 42:16": "En Ik zal de blinden leiden door de weg die zij niet gekend hebben, Ik zal ze doen gaan door de paden die zij niet gekend hebben; Ik zal de duisternis voor hun ogen tot licht maken, en het kromme tot recht; deze dingen zal Ik hun doen, en Ik zal hen niet verlaten.", "Ps 119:145-149": "Koph. Ik heb van ganser harte geroepen: verhoor mij, o HEERE! ik zal Uw inzettingen bewaren. Ik heb U aangeroepen, verlos mij, en ik zal Uw getuigenissen onderhouden. Ik ben de morgenschemering voorgekomen, en heb geschrei gemaakt; op Uw woord heb ik gehoopt.", "Deut 31:8": "De HEERE nu is Degene, Die voor u uitgaat; Die zal met u zijn; Hij zal u niet loslaten, en u niet verlaten; vrees niet, en wees niet ontsteld.", "1 Tim 1:12": "En ik dank Hem, Die mij kracht gegeven heeft, namelijk Christus Jezus, onze Heere, dat Hij mij trouw geacht heeft, doordat Hij mij in de bediening gesteld heeft;", "Gen 18:26": "Toen zei de HEERE: Als Ik in Sodom, binnen de stad, vijftig rechtvaardigen zal vinden, dan zal Ik de hele plaats sparen omwille van hen.", "Gen 18:2": "En hij hief zijn ogen op en keek; en zie, daar stonden drie mannen tegenover hem; toen hij hen zag, liep hij hun tegemoet vanuit de deur van de tent, en boog zich tot op de grond.", "1 Petr 3:6": "zoals Sara Abraham gehoorzaam is geweest, hem heer noemend, van wie u dochters geworden bent, als u goed doet en voor geen enkele verschrikking bang bent.", "Matt 15:22-28": "En zie, een Kananese vrouw, die uit die omgeving kwam, riep tot Hem en zei: Heere! U Zoon van David, ontferm U over mij! mijn dochter is ernstig door de duivel bezeten. Maar Hij antwoordde haar geen woord. En Zijn discipelen kwamen tot Hem en baden Hem: Laat haar gaan; want zij roept ons na. Maar Hij antwoordde en zei: Ik ben niet gezonden dan naar de verloren schapen van het huis van Israël.", "2 Kron 15:2": "En hij ging Asa tegemoet, en hij zei tegen hem: Hoor mij, Asa, en heel Juda en Benjamin! De HEERE is met u, zolang u met Hem bent; en als u Hem zoekt, zal Hij door u gevonden worden; maar als u Hem verlaat, zal Hij u verlaten.", "Ef 3:8": "Aan mij, de allerminste van al de heiligen, is deze genade gegeven, om onder de heidenen door het Evangelie de onnaspeurlijke rijkdom van Christus te verkondigen,", "Jes 54:9": "Want dat zal Mij zijn als de wateren van Noach, toen Ik zwoer dat de wateren van Noach niet meer over de aarde zouden gaan; zo heb Ik gezworen dat Ik niet meer op u toornen, of u bestraffen zal.", "Richt 3:28": "En hij zei tegen hen: Volg mij na; want de HEERE heeft uw vijanden, de Moabieten, in uw hand gegeven. En zij trokken af, hem na, en namen de doorwaadbare plaatsen van de Jordaan in naar Moab, en lieten niemand oversteken.", "Job 10:9": "Denk er toch aan, dat U mij als leem gevormd hebt, en mij tot stof zult doen terugkeren.", "Jes 25:1": "HEERE! U bent mijn God, U zal ik verhogen, Uw Naam zal ik loven, want U hebt wonder gedaan; Uw raadslagen van verre zijn waarheid en vastigheid.", "Spr 3:4": "En vind gunst en goed verstand, in de ogen van God en van de mensen.", "Gen 32:24-32": "Maar Jakob bleef alleen achter; en een man worstelde met hem, totdat de dageraad opging. En toen Hij zag dat Hij niet de overhand over hem kreeg, raakte Hij zijn heupgewricht aan, zodat het heupgewricht van Jakob verwrongen raakte, terwijl Hij met hem worstelde. En Hij zei: Laat Mij gaan, want de dageraad is opgegaan. Maar hij zei: Ik zal U niet laten gaan, tenzij U mij zegent.", "Gen 31:29": "Het staat in de macht van mijn hand u kwaad te doen; maar de God van uw vader heeft gisteravond tegen mij gesproken en gezegd: Pas op, dat u met Jakob niet spreekt, noch goed, noch kwaad.", "Hand 13:33": "dat God die vervuld heeft aan ons, hun kinderen, doordat Hij Jezus verwekt heeft. Zoals ook in de tweede psalm geschreven staat: U bent Mijn Zoon, heden heb Ik U verwekt.", "Jes 38:2": "Toen keerde Hizkia zijn gezicht om naar de wand, en hij bad tot de HEERE.", "Klaagl 1:20": "Resch. Zie, HEERE, want mij is bang; mijn ingewand is beroerd, mijn hart heeft zich omgekeerd in het binnenste van mij, want ik ben zeer opstandig geweest; van buiten heeft mij het zwaard van kinderen beroofd, van binnen is het als de dood.", "Joh 7:39": "(En dit zei Hij van de Geest, die zij die in Hem geloven zouden ontvangen; want de Heilige Geest was er nog niet, omdat Jezus nog niet verheerlijkt was.)", "Gen 28:19": "En hij noemde de naam van die plaats Beth-el; hoewel de naam van die stad vroeger Luz was.", "Joh 1:18": "Niemand heeft ooit God gezien; de eniggeboren Zoon, Die in de schoot van de Vader is, Die heeft Hem ons verklaard.", "2 Sam 2:29": "Abner dan en zijn mannen gingen diezelfde hele nacht over de vlakte; en zij gingen over de Jordaan en trokken heel Bithron door, en kwamen bij Mahanaim.", "2 Kor 12:7-9": "En opdat ik mij door de overvloed van de openbaringen niet zou verheffen, is mij een scherpe doorn in het vlees gegeven, namelijk een engel van de satan, om mij met vuisten te slaan, opdat ik mij niet zou verheffen. Hierover heb ik de Heere driemaal gebeden, dat hij van mij zou wijken. En Hij heeft tegen mij gezegd: Mijn genade is u genoeg; want Mijn kracht wordt in zwakheid volbracht. Zo zal ik dan veel liever roemen in mijn zwakheden, opdat de kracht van Christus in mij woont.", "Openb 4:10": "dan vielen de vierentwintig oudsten neer voor Hem Die op de troon zat, en aanbaden Hem Die leeft tot in alle eeuwigheid, en wierpen hun kronen voor de troon, en zeiden:", "Mark 11:24": "Daarom zeg Ik u: Alle dingen die u in het gebed vraagt, geloof dat u ze ontvangen zult, en ze zullen u gegeven worden.", "Spr 15:18": "Een grimmige man verwekt gekijf; maar wie langzaam tot toorn is, doet de twist bedaren.", "Ps 119:153": "Resch. Zie mijn ellende aan, en help mij eruit, want Uw wet heb ik niet vergeten.", "Jes 65:15": "En u zult uw naam voor Mijn uitverkorenen tot een vervloeking laten; en de Heere HEERE zal u doden, maar Zijn knechten zal Hij met een andere naam noemen;", "Rom 15:8": "En ik zeg dat Jezus Christus een dienaar van de besnijdenis geworden is, vanwege de waarheid van God, opdat Hij de beloften aan de vaderen zou bevestigen;", "Gen 36:21": "En Dison, en Ezer, en Disan; dat zijn de vorsten van de Horieten, zonen van Seïr, in het land van Edom.", "1 Kron 19:17": "Toen dit aan David werd bericht, verzamelde hij heel Israël, en trok over de Jordaan, en kwam tot hen, en stelde de slagorde tegen hen op. Toen David de slagorde tegen de Syriërs opgesteld had, streden zij met hem.", "Ps 40:3": "En Hij heeft mij uit een ruisende kuil, uit modderig slijk opgehaald, en heeft mijn voeten op een rotssteen gesteld, Hij heeft mijn gangen vastgemaakt.", "Deut 7:8": "Maar omdat de HEERE u liefhad, en omdat Hij de eed hield die Hij uw vaderen gezworen had, heeft de HEERE u met een sterke hand uitgevoerd, en u verlost uit het slavenhuis, uit de hand van de farao, koning van Egypte.", "Ps 55:17": "Wat mij aangaat, ik zal tot God roepen, en de HEERE zal mij verlossen.", "Joh 1:27": "Hij is het, Die na mij komt, Die voor mij geworden is, aan Wie ik niet waardig ben Zijn schoenriem te ontbinden.", "2 Kor 1:4": "Die ons vertroost in al onze verdrukking, opdat wij zouden kunnen vertroosten degenen die in allerlei verdrukking zijn, door de vertroosting waarmee wij zelf door God vertroost worden.", "Ps 119:58": "Ik heb Uw aanschijn met ernst gebeden van ganser harte, wees mij genadig naar Uw toezegging.", "Joël 2:26": "En u zult overvloedig en tot verzadiging eten, en de Naam van de HEERE, uw God, prijzen, Die wonderlijk bij u gehandeld heeft; en Mijn volk zal niet beschaamd worden tot in eeuwigheid.", "Ef 1:6": "Tot prijs van de heerlijkheid van Zijn genade, waardoor Hij ons begenadigd heeft in de Geliefde;", "Gen 6:18": "Maar met u zal Ik Mijn verbond oprichten; en u zult in de ark gaan, u, en uw zonen, en uw vrouw, en de vrouwen van uw zonen met u.", "Jes 40:29-31": "Hij geeft de moede kracht, en Hij vermeerdert de sterkte van wie geen krachten heeft. De jongens zullen moede en mat worden, en de jongemannen zullen zeker vallen; Maar wie de HEERE verwachten, zullen de kracht vernieuwen; zij zullen opvaren met vleugels, gelijk de arenden; zij zullen lopen, en niet moede worden; zij zullen wandelen, en niet mat worden.", "1 Sam 30:21": "Toen David bij de tweehonderd mannen kwam, die zo moe waren geweest dat zij David niet hadden kunnen volgen, en die zij aan de beek Besor hadden laten blijven, gingen die David tegemoet, en het volk dat bij hem was tegemoet; en David trad naar het volk toe, en vroeg hen naar hun welstand.", "Ps 107:6": "Toen riepen zij tot de HEERE in de benauwdheid die zij hadden, en Hij heeft hen gered uit hun angsten;", "Gen 46:3": "En Hij zei: Ik ben die God, de God van uw vader; wees niet bang om af te trekken naar Egypte; want Ik zal u daar tot een groot volk maken.", "Gen 48:16": "Die Engel, Die mij verlost heeft van alle kwaad, zegent deze jongens, en laat in hen mijn naam genoemd worden, en de naam van mijn vaders Abraham en Izak, en laat hen vermenigvuldigen als vissen in menigte, midden in het land!", "Ps 144:4": "De mens lijkt op een ademtocht; zijn dagen zijn als een voorbijgaande schaduw.", "Dan 2:30": "Aan mij nu is dit geheim geopenbaard, niet door wijsheid die in mij meer zou zijn dan in alle levenden, maar opdat men de koning de uitleg bekend zou maken, en opdat u de gedachten van uw hart zou kennen.", "Spr 30:3": "En ik heb geen wijsheid geleerd, en heb de wetenschap van de heiligen niet gekend.", "Ps 79:9": "Help ons, o God van ons heil! Vanwege de eer van Uw Naam; en red ons, en doe verzoening over onze zonden, om Uw Naam.", "Hebr 6:10": "Want God is niet onrechtvaardig, dat Hij uw werk zou vergeten, en de inzet van de liefde die u aan Zijn Naam bewezen hebt, doordat u de heiligen gediend hebt en nog dient.", "Openb 8:3": "En er kwam een andere engel, en hij stond aan het altaar met een gouden wierookvat; en hem werd veel van het reukwerk gegeven, opdat hij dat met de gebeden van alle heiligen zou leggen op het gouden altaar dat voor de troon is.", "1 Kor 2:16": "Want wie heeft de gedachte van de Heere gekend, dat hij Hem zou onderrichten? Maar wij hebben de gedachte van Christus.", "Ps 13:2-5": "Hoe lang, HEERE, zult U mij steeds vergeten? Hoe lang zult U Uw aangezicht voor mij verbergen? Hoe lang zal ik plannen maken in mijn ziel, verdriet in mijn hart bij dag? Hoe lang zal mijn vijand boven mij verheven zijn? Kijk naar mij, verhoor mij, HEERE, mijn God; verlicht mijn ogen, zodat ik niet in de dood ontslaap;", "Spr 30:2": "Voorwaar, ik ben onverstandiger dan wie ook; en ik heb geen mensenverstand;", "Jes 37:15-20": "En Hizkia bad tot de HEERE, en zei: O HEERE van de heerscharen¹, God van Israël, Die tussen de cherubs² woont! U Zelf, U alleen bent de God van alle koninkrijken van de aarde; U hebt de hemel en de aarde gemaakt! O HEERE, neig Uw oor en hoor; HEERE, doe Uw ogen open en zie; en hoor al de woorden van Sanherib, die gezonden heeft om de levende God te honen.", "1 Kon 8:20": "Zo heeft de HEERE Zijn woord bevestigd, dat Hij gesproken had; want ik ben opgestaan in de plaats van mijn vader David, en ik zit op de troon van Israël, zoals de HEERE gesproken heeft; en ik heb een huis gebouwd voor de Naam van de HEERE, de God van Israël.", "Spr 17:8": "Het geschenk is in de ogen van wie het bezit een aangenaam gesteente; waarheen het zich ook wendt, het zal wel gedijen.", "Jer 6:5": "Maakt u op, en laat ons optrekken in de nacht, en haar paleizen verderven!", "1 Sam 2:26": "En de jongen Samuël nam toe, en werd groot en aangenaam, zowel bij de HEERE als ook bij de mensen.", "Jona 3:9": "Wie weet, God mocht Zich wenden, en berouw hebben; en Hij mocht Zich wenden van de gloed van Zijn toorn, zodat wij niet vergaan!", "Ps 116:12-14": "Wat zal ik de HEERE vergelden voor al Zijn weldaden aan mij bewezen? Ik zal de beker der verlossingen opnemen, en de Naam van de HEERE aanroepen. Mijn geloften zal ik de HEERE betalen, nu, in de tegenwoordigheid van heel Zijn volk.", "Joël 2:17": "Laat de priesters, de dienaars van de HEERE, wenen tussen het voorhuis en het altaar, en laat hen zeggen: Spaar Uw volk, o HEERE! en geef Uw erfenis niet over tot een smaad, dat de heidenen over hen zouden heersen; waarom zouden zij onder de volken zeggen: Waar is hun God?", "Jes 51:9": "Ontwaak, ontwaak, trek sterkte aan, Arm van de HEERE! Ontwaak als in de dagen van vroeger, in de geslachten van oude tijden af; bent U het niet, Die Rahab uitgehouwen hebt, Die de zeedraak doorstoken hebt?", "Luk 22:42": "en zei: Vader, als U wilt, neem deze drinkbeker van Mij weg; maar niet Mijn wil, maar de Uwe geschiede.", "Luk 13:24": "Strijd om binnen te gaan door de nauwe poort; want velen, zeg Ik u, zullen zoeken binnen te gaan en zullen dat niet kunnen;", "Kol 1:3": "Wij danken de God en Vader van onze Heere Jezus Christus, terwijl wij altijd voor u bidden,", "Hoogl 2:17": "Totdat de dag aankomt, en de schaduwen vlieden; keer om, mijn Liefste! word Gij gelijk een ree, of een jong van de herten, op de bergen van Bether.", "Ps 80:4-6": "O God! Breng ons terug, en laat Uw aanschijn lichten, zo zullen wij verlost worden. HEERE, God van de heerscharen! Hoe lang zult U roken tegen het gebed van Uw volk? U voedt hen met tranenbrood, en drenkt hen met tranen uit een drieling.", "Joh 14:16-21": "En Ik zal de Vader bidden, en Hij zal u een andere Trooster geven, opdat Hij bij u blijft tot in eeuwigheid; Namelijk de Geest van de waarheid, Die de wereld niet kan ontvangen, want zij ziet Hem niet, en kent Hem niet; maar u kent Hem, want
