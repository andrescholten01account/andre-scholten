</span> he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> This is <span class=\"wl wl-kjv\" data-code=\"H430\">God's</span> <span class=\"wl wl-kjv\" data-code=\"H4264\">host:</span> and he <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of that <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> Mahanaim.", "3": "And <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> <span class=\"wl wl-kjv\" data-code=\"H4397\">messengers</span> before <span class=\"wl wl-kjv\" data-code=\"H6440\">him</span> to <span class=\"wl wl-kjv\" data-code=\"H6215\">Esau</span> his <span class=\"wl wl-kjv\" data-code=\"H251\">brother</span> unto the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H8165\">Seir,</span> the <span class=\"wl wl-kjv\" data-code=\"H7704\">country</span> of Edom.", "4": "And he <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> them, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Thus shall ye <span class=\"wl wl-kjv\" data-code=\"H559\">speak</span> unto my <span class=\"wl wl-kjv\" data-code=\"H113\">lord</span> <span class=\"wl wl-kjv\" data-code=\"H6215\">Esau;</span> Thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> thus, I have <span class=\"wl wl-kjv\" data-code=\"H1481\">sojourned</span> with <span class=\"wl wl-kjv\" data-code=\"H3837\">Laban,</span> and stayed there", "5": "And I have <span class=\"wl wl-kjv\" data-code=\"H7794\">oxen,</span> and <span class=\"wl wl-kjv\" data-code=\"H2543\">asses,</span> <span class=\"wl wl-kjv\" data-code=\"H6629\">flocks,</span> and <span class=\"wl wl-kjv\" data-code=\"H5650\">menservants,</span> and <span class=\"wl wl-kjv\" data-code=\"H8198\">womenservants:</span> and I have <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> to <span class=\"wl wl-kjv\" data-code=\"H5046\">tell</span> my <span class=\"wl wl-kjv\" data-code=\"H113\">lord,</span> that I may <span class=\"wl wl-kjv\" data-code=\"H4672\">find</span> <span class=\"wl wl-kjv\" data-code=\"H2580\">grace</span> in thy sight.", "6": "And the <span class=\"wl wl-kjv\" data-code=\"H4397\">messengers</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">returned</span> to <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> We <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to thy <span class=\"wl wl-kjv\" data-code=\"H251\">brother</span> <span class=\"wl wl-kjv\" data-code=\"H6215\">Esau,</span> and also he <span class=\"wl wl-kjv\" data-code=\"H1980\">cometh</span> to meet <span class=\"wl wl-kjv\" data-code=\"H7125\">thee,</span> and four <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> men", "7": "Then <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> was <span class=\"wl wl-kjv\" data-code=\"H3966\">greatly</span> <span class=\"wl wl-kjv\" data-code=\"H3372\">afraid</span> and <span class=\"wl wl-kjv\" data-code=\"H3334\">distressed:</span> and he <span class=\"wl wl-kjv\" data-code=\"H2673\">divided</span> the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> that was with him, and the <span class=\"wl wl-kjv\" data-code=\"H6629\">flocks,</span> and <span class=\"wl wl-kjv\" data-code=\"H1241\">herds,</span> and the <span class=\"wl wl-kjv\" data-code=\"H1581\">camels,</span> into <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> bands;", "8": "And <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> If <span class=\"wl wl-kjv\" data-code=\"H6215\">Esau</span> <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> to the <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H4264\">company,</span> and smite <span class=\"wl wl-kjv\" data-code=\"H5221\">it,</span> then the other <span class=\"wl wl-kjv\" data-code=\"H4264\">company</span> which is <span class=\"wl wl-kjv\" data-code=\"H7604\">left</span> shall escape.", "9": "And <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> O <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of my <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham,</span> and <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of my <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> <span class=\"wl wl-kjv\" data-code=\"H3327\">Isaac,</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> which <span class=\"wl wl-kjv\" data-code=\"H559\">saidst</span> unto me, <span class=\"wl wl-kjv\" data-code=\"H7725\">Return</span> unto thy <span class=\"wl wl-kjv\" data-code=\"H776\">country,</span> and to thy <span class=\"wl wl-kjv\" data-code=\"H4138\">kindred,</span> and I will deal well", "10": "I am not worthy of the <span class=\"wl wl-kjv\" data-code=\"H6994\">least</span> of all the <span class=\"wl wl-kjv\" data-code=\"H2617\">mercies,</span> and of all the <span class=\"wl wl-kjv\" data-code=\"H571\">truth,</span> which thou hast <span class=\"wl wl-kjv\" data-code=\"H6213\">shewed</span> unto thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant;</span> for with my <span class=\"wl wl-kjv\" data-code=\"H4731\">staff</span> I passed <span class=\"wl wl-kjv\" data-code=\"H5674\">over</span> this <span class=\"wl wl-kjv\" data-code=\"H3383\">Jordan;</span> and now I am become <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> bands.", "11": "Deliver <span class=\"wl wl-kjv\" data-code=\"H5337\">me,</span> I pray thee, from the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of my <span class=\"wl wl-kjv\" data-code=\"H251\">brother,</span> from the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of <span class=\"wl wl-kjv\" data-code=\"H6215\">Esau:</span> for I <span class=\"wl wl-kjv\" data-code=\"H3373\">fear</span> him, lest he will <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> and smite <span class=\"wl wl-kjv\" data-code=\"H5221\">me,</span> and the <span class=\"wl wl-kjv\" data-code=\"H517\">mother</span> <span class=\"wl wl-kjv\" data-code=\"H5921\">with</span> the children.", "12": "And thou <span class=\"wl wl-kjv\" data-code=\"H559\">saidst,</span> I will <span class=\"wl wl-kjv\" data-code=\"H3190\">surely</span> do thee <span class=\"wl wl-kjv\" data-code=\"H3190\">good,</span> and <span class=\"wl wl-kjv\" data-code=\"H7760\">make</span> thy <span class=\"wl wl-kjv\" data-code=\"H2233\">seed</span> as the <span class=\"wl wl-kjv\" data-code=\"H2344\">sand</span> of the <span class=\"wl wl-kjv\" data-code=\"H3220\">sea,</span> which cannot be <span class=\"wl wl-kjv\" data-code=\"H5608\">numbered</span> for multitude.", "13": "And he <span class=\"wl wl-kjv\" data-code=\"H3885\">lodged</span> there that same <span class=\"wl wl-kjv\" data-code=\"H3915\">night;</span> and <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> of that which <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> a <span class=\"wl wl-kjv\" data-code=\"H4503\">present</span> for <span class=\"wl wl-kjv\" data-code=\"H6215\">Esau</span> his brother;", "14": "Two <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> she <span class=\"wl wl-kjv\" data-code=\"H5795\">goats,</span> and <span class=\"wl wl-kjv\" data-code=\"H6242\">twenty</span> he <span class=\"wl wl-kjv\" data-code=\"H8495\">goats,</span> two <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> <span class=\"wl wl-kjv\" data-code=\"H7353\">ewes,</span> and <span class=\"wl wl-kjv\" data-code=\"H6242\">twenty</span> rams,", "15": "<span class=\"wl wl-kjv\" data-code=\"H7970\">Thirty</span> <span class=\"wl wl-kjv\" data-code=\"H3243\">milch</span> <span class=\"wl wl-kjv\" data-code=\"H1581\">camels</span> with their <span class=\"wl wl-kjv\" data-code=\"H1121\">colts,</span> <span class=\"wl wl-kjv\" data-code=\"H705\">forty</span> <span class=\"wl wl-kjv\" data-code=\"H6510\">kine,</span> and <span class=\"wl wl-kjv\" data-code=\"H6235\">ten</span> <span class=\"wl wl-kjv\" data-code=\"H6499\">bulls,</span> <span class=\"wl wl-kjv\" data-code=\"H6242\">twenty</span> she <span class=\"wl wl-kjv\" data-code=\"H860\">asses,</span> and <span class=\"wl wl-kjv\" data-code=\"H6235\">ten</span> foals.", "16": "And he <span class=\"wl wl-kjv\" data-code=\"H5414\">delivered</span> them into the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of his <span class=\"wl wl-kjv\" data-code=\"H5650\">servants,</span> every <span class=\"wl wl-kjv\" data-code=\"H5739\">drove</span> by themselves; and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto his <span class=\"wl wl-kjv\" data-code=\"H5650\">servants,</span> Pass <span class=\"wl wl-kjv\" data-code=\"H5674\">over</span> before <span class=\"wl wl-kjv\" data-code=\"H6440\">me,</span> and <span class=\"wl wl-kjv\" data-code=\"H7760\">put</span> a <span class=\"wl wl-kjv\" data-code=\"H7305\">space</span> <span class=\"wl wl-kjv\" data-code=\"H996\">betwixt</span> <span class=\"wl wl-kjv\" data-code=\"H5739\">drove</span> <span class=\"wl wl-kjv\" data-code=\"H996\">and</span> drove.", "17": "And he <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> the <span class=\"wl wl-kjv\" data-code=\"H7223\">foremost,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> When <span class=\"wl wl-kjv\" data-code=\"H6215\">Esau</span> my <span class=\"wl wl-kjv\" data-code=\"H251\">brother</span> meeteth <span class=\"wl wl-kjv\" data-code=\"H6298\">thee,</span> and asketh <span class=\"wl wl-kjv\" data-code=\"H7592\">thee,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Whose art thou? and whither <span class=\"wl wl-kjv\" data-code=\"H3212\">goest</span> thou? and whose are these before", "18": "Then thou shalt <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> They be thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob's;</span> it is a <span class=\"wl wl-kjv\" data-code=\"H4503\">present</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> unto my <span class=\"wl wl-kjv\" data-code=\"H113\">lord</span> <span class=\"wl wl-kjv\" data-code=\"H6215\">Esau:</span> and, behold, also he is behind us.", "19": "And <span class=\"wl wl-kjv\" data-code=\"H1571\">so</span> commanded <span class=\"wl wl-kjv\" data-code=\"H6680\">he</span> the <span class=\"wl wl-kjv\" data-code=\"H8145\">second,</span> and the <span class=\"wl wl-kjv\" data-code=\"H7992\">third,</span> and all that <span class=\"wl wl-kjv\" data-code=\"H1980\">followed</span> the <span class=\"wl wl-kjv\" data-code=\"H5739\">droves,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> On this <span class=\"wl wl-kjv\" data-code=\"H1697\">manner</span> shall ye <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> unto <span class=\"wl wl-kjv\" data-code=\"H6215\">Esau,</span> when ye find", "20": "And say <span class=\"wl wl-kjv\" data-code=\"H559\">ye</span> <span class=\"wl wl-kjv\" data-code=\"H1571\">moreover,</span> Behold, thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> is behind <span class=\"wl wl-kjv\" data-code=\"H310\">us.</span> For he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> I will <span class=\"wl wl-kjv\" data-code=\"H3722\">appease</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">him</span> with the <span class=\"wl wl-kjv\" data-code=\"H4503\">present</span> that <span class=\"wl wl-kjv\" data-code=\"H1980\">goeth</span> before <span class=\"wl wl-kjv\" data-code=\"H6440\">me,</span> and <span class=\"wl wl-kjv\" data-code=\"H310\">afterward</span> I will <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> his <span class=\"wl wl-kjv\" data-code=\"H6440\">face;</span> peradventure he will <span class=\"wl wl-kjv\" data-code=\"H5375\">accept</span> of me.", "21": "So <span class=\"wl wl-kjv\" data-code=\"H5674\">went</span> the <span class=\"wl wl-kjv\" data-code=\"H4503\">present</span> <span class=\"wl wl-kjv\" data-code=\"H5674\">over</span> before <span class=\"wl wl-kjv\" data-code=\"H6440\">him:</span> and himself <span class=\"wl wl-kjv\" data-code=\"H3885\">lodged</span> that <span class=\"wl wl-kjv\" data-code=\"H3915\">night</span> in the company.", "22": "And he rose <span class=\"wl wl-kjv\" data-code=\"H6965\">up</span> that <span class=\"wl wl-kjv\" data-code=\"H3915\">night,</span> and <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> his <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H802\">wives,</span> and his <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H8198\">womenservants,</span> and his <span class=\"wl wl-kjv\" data-code=\"H6240\">eleven</span> <span class=\"wl wl-kjv\" data-code=\"H3206\">sons,</span> and passed <span class=\"wl wl-kjv\" data-code=\"H5674\">over</span> the <span class=\"wl wl-kjv\" data-code=\"H4569\">ford</span> Jabbok.", "23": "And he took <span class=\"wl wl-kjv\" data-code=\"H3947\">them,</span> and sent them <span class=\"wl wl-kjv\" data-code=\"H5674\">over</span> the <span class=\"wl wl-kjv\" data-code=\"H5158\">brook,</span> and sent over", "24": "And <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> was <span class=\"wl wl-kjv\" data-code=\"H3498\">left</span> alone; and there <span class=\"wl wl-kjv\" data-code=\"H79\">wrestled</span> a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> with him until the <span class=\"wl wl-kjv\" data-code=\"H5927\">breaking</span> of the day.", "25": "And when he <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> that he <span class=\"wl wl-kjv\" data-code=\"H3201\">prevailed</span> not against him, he <span class=\"wl wl-kjv\" data-code=\"H5060\">touched</span> the hollow of his <span class=\"wl wl-kjv\" data-code=\"H3409\">thigh;</span> and the <span class=\"wl wl-kjv\" data-code=\"H3709\">hollow</span> of <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob's</span> <span class=\"wl wl-kjv\" data-code=\"H3409\">thigh</span> was out of <span class=\"wl wl-kjv\" data-code=\"H3363\">joint,</span> as he wrestled", "26": "And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Let me <span class=\"wl wl-kjv\" data-code=\"H7971\">go,</span> for the <span class=\"wl wl-kjv\" data-code=\"H7837\">day</span> <span class=\"wl wl-kjv\" data-code=\"H5927\">breaketh.</span> And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> I will not let thee <span class=\"wl wl-kjv\" data-code=\"H7971\">go,</span> <span class=\"wl wl-kjv\" data-code=\"H518\">except</span> thou bless", "27": "And he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, What is thy <span class=\"wl wl-kjv\" data-code=\"H8034\">name?</span> And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Jacob.", "28": "And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Thy <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> shall be <span class=\"wl wl-kjv\" data-code=\"H559\">called</span> no more <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob,</span> but <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel:</span> for as a prince hast thou <span class=\"wl wl-kjv\" data-code=\"H8280\">power</span> with <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> and with <span class=\"wl wl-kjv\" data-code=\"H582\">men,</span> and hast prevailed.", "29": "And <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> <span class=\"wl wl-kjv\" data-code=\"H7592\">asked</span> him, and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H5046\">Tell</span> me, I pray thee, thy <span class=\"wl wl-kjv\" data-code=\"H8034\">name.</span> And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Wherefore is <span class=\"wl wl-kjv\" data-code=\"H2088\">it</span> that thou dost <span class=\"wl wl-kjv\" data-code=\"H7592\">ask</span> after my <span class=\"wl wl-kjv\" data-code=\"H8034\">name?</span> And he blessed", "30": "And <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of the <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> <span class=\"wl wl-kjv\" data-code=\"H6439\">Peniel:</span> for I have <span class=\"wl wl-kjv\" data-code=\"H7200\">seen</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">face</span> to <span class=\"wl wl-kjv\" data-code=\"H6440\">face,</span> and my <span class=\"wl wl-kjv\" data-code=\"H5315\">life</span> is preserved.", "31": "And as he passed <span class=\"wl wl-kjv\" data-code=\"H5674\">over</span> <span class=\"wl wl-kjv\" data-code=\"H6439\">Penuel</span> the <span class=\"wl wl-kjv\" data-code=\"H8121\">sun</span> <span class=\"wl wl-kjv\" data-code=\"H2224\">rose</span> upon him, and he <span class=\"wl wl-kjv\" data-code=\"H6760\">halted</span> upon his thigh.", "32": "Therefore the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> not of the <span class=\"wl wl-kjv\" data-code=\"H1517\">sinew</span> which <span class=\"wl wl-kjv\" data-code=\"H5384\">shrank,</span> which is upon the <span class=\"wl wl-kjv\" data-code=\"H3709\">hollow</span> of the <span class=\"wl wl-kjv\" data-code=\"H3409\">thigh,</span> unto this <span class=\"wl wl-kjv\" data-code=\"H3117\">day:</span> because he <span class=\"wl wl-kjv\" data-code=\"H5060\">touched</span> the <span class=\"wl wl-kjv\" data-code=\"H3709\">hollow</span> of <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob's</span> <span class=\"wl wl-kjv\" data-code=\"H3409\">thigh</span> in the <span class=\"wl wl-kjv\" data-code=\"H1517\">sinew</span> that shrank."}};
const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"
const ZELF = D.meta.zelf_abbr;      // afkorting binnen dit hoofdstuk, bv. "Joh 3"
const BASIS_URL = D.meta.basis_url;
const PARALLEL_VOLGORDE = ['SVnu', 'SV', 'KJV'];
let vertaling = 'SVnu';
let openVers = null;

const bijbel = document.getElementById('bijbel');
const popup = document.getElementById('popup');
const toast = document.getElementById('toast');
const nummers = Object.keys(D.vertalingen.SVnu);

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling', 'Matthew Henry-verklaring']],
  ['Geloofsbelijdenissen', ['1689 Baptist Confession', 'Westminster Confession']],
  ['Boeken', ['Institutie — Calvijn', 'A Body of Divinity — Watson']],
  ['Preken', ['Spurgeon']],
  ['Devotionals', ['Spurgeon']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    const heeftB = D.koppeling && D.koppeling[n];
    const heeftK = D.koppeling_kjv && D.koppeling_kjv[n];
    let h = '<div class="verg-kop">Grondwoorden</div>';
    if (!heeftB && !heeftK) {
      h += '<em>Nog geen woordkoppeling voor dit vers.</em>';
    } else {
      if (heeftB) h += `<div class="tsk-kop">SVnu</div>` +
        `<div class="gw-tekst" style="font-family:Georgia,serif;line-height:1.8">${D.koppeling[n]}</div>` +
        `<div class="gw-detail" style="margin-top:.5rem"></div>`;
      if (heeftK) h += `<div class="tsk-kop" style="margin-top:.9rem">KJV</div>` +
        `<div class="gw-tekst" style="font-family:Georgia,serif;line-height:1.8">${D.koppeling_kjv[n]}</div>` +
        `<div class="gw-detail" style="margin-top:.5rem"></div>`;
      h += '<div class="bronregel">Klik op een onderstreept woord voor de vindplaatsen.</div>';
    }
    h += '<div class="verg-kop" style="margin-top:1.4rem">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const berea = D.tsk[n], engels = D.tsk_kjv[n];
    if ((!berea || !berea.length) && (!engels || !engels.length)) return '<em>Geen verwijzingen bij dit vers.</em>';
    let h = '';
    if (berea && berea.length) {
      h += '<div class="tsk-kop">Treasury of Scripture Knowledge | SVnu</div>';
      h += berea.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r}">${r}</a>`).join('') + '</div>').join('');
    }
    if (engels && engels.length) {
      h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.tsk[n] && D.tsk[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vergelijk</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}
</script>
