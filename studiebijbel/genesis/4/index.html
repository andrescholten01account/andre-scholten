<style>

    --light:#ffffff; --lightgray:#e5e5e5; --gray:#b3b3b3; --darkgray:#333333; --dark:#111111;

  .hfdnav select { font-family:"Lora"; font-size:.85rem; border:1px solid var(--border); border-radius:999px; padding:.3rem 1.6rem .3rem .8rem; background:#fff; color:var(--accent-donker); cursor:pointer; }

  .navselect { font-family:"Lora"; font-size:.85rem; border:1px solid var(--border); border-radius:999px; padding:.3rem 1.6rem .3rem .8rem; background:#fff; color:var(--accent-donker); cursor:pointer; display:inline-flex; align-items:center; text-decoration:none; }

    #vertaalkies { order: -1; }

  /* verzen — tabsmodus (één kolom) */
  .vers { position: relative; display: flex; gap: .8rem; padding: .45rem 2.4rem .45rem .4rem; border-radius: 8px; cursor: pointer; }
  .vers:hover { background: var(--bg-soft); }
  .vers.open { background: var(--bg-soft); box-shadow: inset 3px 0 0 var(--accent); border-radius: 8px 8px 0 0; }
  .vers.flits { animation: flits 1.6s ease-out; }
  @keyframes flits { 0% { background: #e0e0e0; } 100% { background: var(--bg-soft); } }
  .vnr { color: #999999; font-size: .75rem; min-width: 1.6rem; text-align: right; padding-top: .45rem; font-family: "Lora"; }
  .vtekst em, .pcel em { font-style: italic; color: #555; }
  .wl { border-bottom: 1px dotted var(--accent); }
  .noot { color: var(--accent); cursor: pointer; font-weight: 700; padding: 0 .05rem; }
  .noot:hover { color: var(--accent-donker); }

  .vers:hover .kopieer { opacity: .75; }
  .kopieer:hover { opacity: 1 !important; }

  #bijbel.parallel .vers { display:grid; gap:.8rem; cursor:pointer; align-items:start; }
  #bijbel.parallel .vnr { grid-row: 1; }
  .kolomkop { display:none; }
  #bijbel.parallel + .kolomkop, .kolomkop.tonen { }
  .pk { font-family:"Lora"; font-size:.72rem; text-transform:uppercase; letter-spacing:.12em; color:var(--accent-donker); font-weight:700; }
  #bijbel.parallel .pcel em { font-style:italic; color:#555; }

] Eva, zijn vrouw, en zij werd zwanger en baarde Kaïn, en zei: Ik heb een man van de HEERE verkregen!","2":"En zij baarde verder zijn broeder Abel; en Abel werd een schaapherder, en Kaïn werd een landbouwer.","3":"En het gebeurde na verloop van enige dagen, dat Kaïn van de vrucht van het land de HEERE een offer bracht.","4":"En Abel bracht ook van de eerstgeborenen van zijn schapen, en van hun vet. En de HEERE zag Abel en zijn offer met welgevallen aan;","5":"maar Kaïn en zijn offer zag Hij niet met welgevallen aan. Toen ontstak Kaïn zeer, en zijn gezicht betrok.","6":"En de HEERE zei tegen Kaïn: Waarom bent u ontstoken, en waarom is uw gezicht betrokken?","7":"Is het niet zo: als u goed doet, wordt u aanvaard? En als u niet goed doet, ligt de zonde aan de deur. Naar u gaat zijn begeerte uit, en u zult over hem heersen.","8":"En Kaïn sprak met zijn broeder Abel; en het gebeurde, toen zij op het veld waren, dat Kaïn tegen zijn broeder Abel opstond en hem doodsloeg.","9":"En de HEERE zei tegen Kaïn: Waar is Abel, uw broeder? En hij zei: Ik weet het niet; ben ik de hoeder van mijn broeder?","10":"En Hij zei: Wat hebt u gedaan? Daar is een stem van het bloed van uw broeder, die tot Mij roept vanuit de aardbodem.","11":"En nu bent u vervloekt, verbannen van de aardbodem, die zijn mond heeft opengedaan om het bloed van uw broeder uit uw hand te ontvangen.","12":"Als u de aardbodem bewerkt, zal hij u zijn opbrengst niet meer geven; u zult zwervend en dolend zijn op de aarde.","13":"En Kaïn zei tegen de HEERE: Mijn misdaad is groter dan dat die vergeven kan worden.","14":"Zie, U hebt mij vandaag verdreven van de aardbodem, en ik zal voor Uw aangezicht verborgen zijn; en ik zal zwervend en dolend zijn op de aarde, en het zal gebeuren dat ieder die mij vindt, mij zal doodslaan.","15":"Doch de HEERE zei tegen hem: Daarom, ieder die Kaïn doodslaat, zal zevenvoudig gewroken worden! En de HEERE zette een teken op Kaïn, zodat niemand die hem vond hem zou doden.","16":"En Kaïn ging weg van het aangezicht van de HEERE; en hij woonde in het land Nod, ten oosten van Eden.","17":"En Kaïn had gemeenschap met zijn vrouw, en zij werd zwanger en baarde Henoch; en hij bouwde een stad, en noemde de naam van die stad naar de naam van zijn zoon, Henoch.","18":"En aan Henoch werd Hirad geboren; en Hirad verwekte Mechujaël; en Mechujaël verwekte Methusael; en Methusael verwekte Lamech.","19":"En Lamech nam zich twee vrouwen; de naam van de eerste was Ada, en de naam van de andere Zilla.","20":"En Ada baarde Jabal; hij is de vader geweest van hen die in tenten wonen en vee hebben.","21":"En de naam van zijn broeder was Jubal; hij was de vader van allen die harp en fluit bespelen.","22":"En Zilla baarde ook Tubal-kaïn, een leermeester van allen die met koper en ijzer werken; en de zuster van Tubal-kaïn was Naäma.","23":"En Lamech zei tegen zijn vrouwen Ada en Zilla: Hoor mijn stem, vrouwen van Lamech, neem mijn woorden ter ore! Voorwaar, ik sloeg een man dood om mijn wond, en een jongeman om mijn buil!","24":"Want Kaïn zal zevenvoudig gewroken worden, maar Lamech zeventigmaal zevenmaal.","25":"En Adam had opnieuw gemeenschap met zijn vrouw, en zij baarde een zoon, en zij noemde zijn naam Seth; want God heeft mij, zei zij, een ander nageslacht gegeven in de plaats van Abel; want Kaïn heeft hem doodgeslagen.","26":"En ook aan diezelfde Seth werd een zoon geboren, en hij noemde zijn naam Enos. Toen begon men de Naam van de HEERE aan te roepen."},"SV":{"1":"En Adam bekende Heva, zijn huisvrouw, en zij werd zwanger, en baarde, Kaïn, en zeide: Ik heb een man van den HEERE verkregen!","2":"En zij voer voort te baren zijn broeder Habel; en Habel werd een schaapherder, en Kaïn werd een landbouwer.","3":"En het geschiedde ten einde *van* *enige* dagen, dat Kaïn van de vrucht des lands den HEERE offer bracht.","4":"En Habel bracht ook van de eerstgeborenen zijner schapen, en van hun vet. En de HEERE zag Habel en zijn offer aan;","5":"Maar Kaïn en zijn offer zag Hij niet aan. Toen ontstak Kaïn zeer, en zijn aangezicht verviel.","6":"En de HEERE zeide tot Kaïn: Waarom zijt gij ontstoken, en waarom is uw aangezicht vervallen?","7":"*Is* *er* niet, indien gij weldoet, verhoging? en zo gij niet weldoet, de zonde ligt aan de deur. Zijn begeerte is toch tot u, en gij zult over hem heersen.","8":"En Kaïn sprak met zijn broeder Habel; en het geschiedde, als zij in het veld waren, dat Kaïn tegen zijn broeder Habel opstond, en sloeg hem dood.","9":"En de HEERE zeide tot Kaïn: Waar *is* Habel, uw broeder? En hij zeide: Ik weet *het* niet; *ben* ik mijns broeders hoeder?","10":"En Hij zeide: Wat hebt gij gedaan? *daar* *is* een stem des bloeds van uw broeder, dat tot Mij roept van den aardbodem.","11":"En nu zijt gij vervloekt van den aardbodem, die zijn mond heeft opengedaan, om uws broeders bloed van uw hand te ontvangen.","12":"Als gij den aardbodem bouwen zult, hij zal u zijn vermogen niet meer geven; gij zult zwervende en dolende zijn op aarde.","13":"En Kaïn zeide tot den HEERE: Mijn misdaad *is* groter, dan dat zij vergeven worde.","14":"Zie, Gij hebt mij heden verdreven van den aardbodem, en ik zal voor Uw aangezicht verborgen zijn; en ik zal zwervende en dolende zijn op de aarde, en het zal geschieden, dat al wie mij vindt, mij zal doodslaan.","15":"Doch de HEERE zeide tot hem: Daarom, al wie Kaïn doodslaat, zal zevenvoudig gewroken worden! En de HEERE stelde een teken aan Kaïn; opdat hem niet versloeg al wie hem vond.","16":"En Kaïn ging uit van het aangezicht des HEEREN; en hij woonde in het land Nod, ten oosten van Eden.","17":"En Kaïn bekende zijn huisvrouw, en zij werd bevrucht en baarde Henoch; en hij bouwde een stad, en noemde den naam dier stad naar den naam zijns zoons, Henoch.","18":"En aan Henoch werd Hirad geboren; en Hirad gewon Mechujael; en Mechujael gewon Methusael; en Methusael gewon Lamech.","19":"En Lamech nam zich twee vrouwen; de naam van de eerste was Ada, en de naam van de andere Zilla.","20":"En Ada baarde Jabal; deze is geweest een vader dergenen, die tenten bewoonden, en vee *hadden*.","21":"En de naam zijns broeders was Jubal; deze was de vader van allen, die harpen en orgelen handelen.","22":"En Zilla baarde ook, Tubal-kaïn, een leermeester van allen werker in koper en ijzer; en de zuster van Tubal-kaïn *was* Naema.","23":"En Lamech zeide tot zijn vrouwen Ada en Zilla: Hoort mijn stem, gij vrouwen van Lamech! neemt ter ore mijn rede! Voorwaar, ik sloeg wel een man dood, om mijn wonde, en een jongeling, om mijn buile!","24":"Want Kaïn zal zevenvoudig gewroken worden, maar Lamech zeventigmaal zevenmaal.","25":"En Adam bekende wederom zijn huisvrouw, en zij baarde een zoon, en zij noemde zijn naam Seth; want God heeft mij, *sprak* *zij*, een ander zaad gezet voor Habel; want Kaïn heeft hem doodgeslagen.","26":"En denzelven Seth werd ook een zoon geboren, en hij noemde zijn naam Enos. Toen begon men den Naam des HEEREN aan te roepen."},"KJV":{"1":"And Adam knew Eve his wife; and she conceived, and bare Cain, and said, I have gotten a man from the LORD.","2":"And she again bare his brother Abel. And Abel was a keeper of sheep, but Cain was a tiller of the ground.","3":"And in process of time it came to pass, that Cain brought of the fruit of the ground an offering unto the LORD.","4":"And Abel, he also brought of the firstlings of his flock and of the fat thereof. And the LORD had respect unto Abel and to his offering:","5":"But unto Cain and to his offering he had not respect. And Cain was very wroth, and his countenance fell.","6":"And the LORD said unto Cain, Why art thou wroth? and why is thy countenance fallen?","7":"If thou doest well, shalt thou not be accepted? and if thou doest not well, sin lieth at the door. And unto thee *shall be* his desire, and thou shalt rule","8":"And Cain talked with Abel his brother: and it came to pass, when they were in the field, that Cain rose up against Abel his brother, and slew him.","9":"And the LORD said unto Cain, Where *is* Abel thy brother? And he said, I know not: *Am* I my brother's keeper?","10":"And he said, What hast thou done? the voice of thy brother's blood crieth unto me from the ground.","11":"And now *art* thou cursed from the earth, which hath opened her mouth to receive thy brother's blood from thy hand;","12":"When thou tillest the ground, it shall not henceforth yield unto thee her strength; a fugitive and a vagabond shalt thou be in the earth.","13":"And Cain said unto the LORD, My punishment *is* greater than I can bear.","14":"Behold, thou hast driven me out this day from the face of the earth; and from thy face shall I be hid; and I shall be a fugitive and a vagabond in the earth; and it shall come to pass, *that* every one that findeth me shall slay me.","15":"And the LORD said unto him, Therefore whosoever slayeth Cain, vengeance shall be taken on him sevenfold. And the LORD set a mark upon Cain, lest any finding him should kill","16":"And Cain went out from the presence of the LORD, and dwelt in the land of Nod, on the east of Eden.","17":"And Cain knew his wife; and she conceived, and bare Enoch: and he builded a city, and called the name of the city, after the name of his son, Enoch.","18":"And unto Enoch was born Irad: and Irad begat Mehujael: and Mehujael begat Methusael: and Methusael begat Lamech.","19":"And Lamech took unto him two wives: the name of the one *was* Adah, and the name of the other Zillah.","20":"And Adah bare Jabal: he was the father of such as dwell in tents, and *of such as have* cattle.","21":"And his brother's name *was* Jubal: he was the father of all such as handle the harp and organ.","22":"And Zillah, she also bare Tubalcain, an instructer of every artificer in brass and iron: and the sister of Tubalcain *was* Naamah.","23":"And Lamech said unto his wives, Adah and Zillah, Hear my voice; ye wives of Lamech, hearken unto my speech: for I have slain a man to my wounding, and a young man to my hurt.","24":"If Cain shall be avenged sevenfold, truly Lamech seventy and sevenfold.","25":"And Adam knew his wife again; and she bare a son, and called his name Seth: For God, *said she*, hath appointed me another seed instead of Abel, whom Cain slew.","26":"And to Seth, to him also there was born a son; and he called his name Enos: then began men to call upon the name of the LORD."}},"tsk":{"1":[{"kopje":"had gemeenschap","refs":["Num 31:17"]},{"kopje":"Ik heb","refs":["Gen 4:25","Gen 3:15","Gen 5:29","1 Joh 3:12"]}],"2":[{"kopje":"En Abel","refs":["Gen 30:29-31","Gen 37:13","Gen 46:32-34","Gen 47:3","Ex 3:1","Ps 78:70-72","Amos 7:15"]},{"kopje":"een schaapherder","refs":["Gen 4:25","Gen 4:26","Ps 127:3","Joh 8:44","1 Joh 3:10","1 Joh 3:12","1 Joh 3:15"]},{"kopje":"landbouwer","refs":["Gen 3:23","Gen 9:20"]}],"3":[{"kopje":"na verloop van enige dagen","refs":["1 Kon 17:7","Neh 13:6"]},{"kopje":"de vrucht","refs":["Lev 2:1-11","Num 18:12"]}],"4":[{"kopje":"de eerstgeborenen","refs":["Ex 13:12","Num 18:12","Num 18:17","Spr 3:9","Hebr 9:22","1 Petr 1:19","1 Petr 1:20","Openb 13:8"]},{"kopje":"vet","refs":["Lev 3:16","Lev 3:17"]},{"kopje":"zag","refs":["Gen 15:17","Lev 9:24","Num 16:35","Richt 6:21","1 Kon 18:24","1 Kon 18:38","1 Kron 21:26","2 Kron 7:1","Ps 20:4","Hebr 11:4"]}],"5":[{"kopje":"maar","refs":["Num 16:15","Hebr 11:4"]},{"kopje":"ontstak","refs":["Gen 31:2","Gen 31:5","Job 5:2","Ps 20:4","Jes 3:10","Jes 3:11","Matt 20:15","Luk 15:28-30","Hand 13:45"]}],"7":[{"kopje":"Als u goed doet","refs":["Gen 19:21","2 Sam 24:23","2 Kon 8:28","Job 42:8","Spr 18:5","Pred 8:12","Pred 8:13","Jes 3:10","Jes 3:11","Jer 6:20","Mal 1:8","Mal 1:10","Mal 1:13","Hand 10:35","Rom 2:7-10","Rom 12:1","Rom 14:18","Rom 15:16","Ef 1:6","1 Tim 5:4","1 Petr 2:5"]},{"kopje":"aanvaard","refs":["Job 29:4","Spr 21:27","Hebr 11:4"]},{"kopje":"zonde","refs":["Gen 4:8-13","Rom 7:8","Rom 7:9","Jak 1:15"]},{"kopje":"Naar u","refs":["Gen 3:16"]}],"8":[{"kopje":"sprak","refs":["2 Sam 3:27","2 Sam 13:26-28","2 Sam 20:9","2 Sam 20:10","Neh 6 s=\"wl wl-kjv\" data-code=\"H1893\">Abel</span> his <span class=\"wl wl-kjv\" data-code=\"H251\">brother:</span> and it came to pass, when they were in the <span class=\"wl wl-kjv\" data-code=\"H7704\">field,</span> that <span class=\"wl wl-kjv\" data-code=\"H7014\">Cain</span> rose <span class=\"wl wl-kjv\" data-code=\"H6965\">up</span> <span class=\"wl wl-kjv\" data-code=\"H413\">against</span> <span class=\"wl wl-kjv\" data-code=\"H1893\">Abel</span> his <span class=\"wl wl-kjv\" data-code=\"H251\">brother,</span> and slew him.","9":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H7014\">Cain,</span> <span class=\"wl wl-kjv\" data-code=\"H335\">Where</span> is <span class=\"wl wl-kjv\" data-code=\"H1893\">Abel</span> thy <span class=\"wl wl-kjv\" data-code=\"H251\">brother?</span> And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> I <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> not: Am I my <span class=\"wl wl-kjv\" data-code=\"H251\">brother's</span> keeper?","10":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H4100\">What</span> hast thou <span class=\"wl wl-kjv\" data-code=\"H6213\">done?</span> the <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> of thy <span class=\"wl wl-kjv\" data-code=\"H251\">brother's</span> <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> <span class=\"wl wl-kjv\" data-code=\"H6817\">crieth</span> unto me from the ground.","11":"And now art thou <span class=\"wl wl-kjv\" data-code=\"H779\">cursed</span> from the <span class=\"wl wl-kjv\" data-code=\"H127\">earth,</span> which hath <span class=\"wl wl-kjv\" data-code=\"H6475\">opened</span> her <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth</span> to <span class=\"wl wl-kjv\" data-code=\"H3947\">receive</span> thy <span class=\"wl wl-kjv\" data-code=\"H251\">brother's</span> <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> from thy hand;","12":"<span class=\"wl wl-kjv\" data-code=\"H3588\">When</span> thou <span class=\"wl wl-kjv\" data-code=\"H5647\">tillest</span> the <span class=\"wl wl-kjv\" data-code=\"H127\">ground,</span> it shall not <span class=\"wl wl-kjv\" data-code=\"H3254\">henceforth</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">yield</span> unto thee her <span class=\"wl wl-kjv\" data-code=\"H3581\">strength;</span> a <span class=\"wl wl-kjv\" data-code=\"H5128\">fugitive</span> and a <span class=\"wl wl-kjv\" data-code=\"H5110\">vagabond</span> shalt thou be in the earth.","13":"And <span class=\"wl wl-kjv\" data-code=\"H7014\">Cain</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> My <span class=\"wl wl-kjv\" data-code=\"H5771\">punishment</span> is <span class=\"wl wl-kjv\" data-code=\"H1419\">greater</span> than I can bear.","14":"Behold, thou hast driven me <span class=\"wl wl-kjv\" data-code=\"H1644\">out</span> this <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> from the <span class=\"wl wl-kjv\" data-code=\"H6440\">face</span> of the <span class=\"wl wl-kjv\" data-code=\"H127\">earth;</span> and <span class=\"wl wl-kjv\" data-code=\"H5921\">from</span> thy <span class=\"wl wl-kjv\" data-code=\"H6440\">face</span> shall I be <span class=\"wl wl-kjv\" data-code=\"H5641\">hid;</span> and I shall be a <span class=\"wl wl-kjv\" data-code=\"H5128\">fugitive</span> and a <span class=\"wl wl-kjv\" data-code=\"H5110\">vagabond</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">earth;</span> and it shall come to <span class=\"wl wl-kjv\" data-code=\"H1961\">pass,</span> that every one that findeth <span class=\"wl wl-kjv\" data-code=\"H4672\">me</span> shall slay me.","15":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, <span class=\"wl wl-kjv\" data-code=\"H3651\">Therefore</span> whosoever <span class=\"wl wl-kjv\" data-code=\"H2026\">slayeth</span> <span class=\"wl wl-kjv\" data-code=\"H7014\">Cain,</span> vengeance shall be <span class=\"wl wl-kjv\" data-code=\"H5358\">taken</span> on him <span class=\"wl wl-kjv\" data-code=\"H7659\">sevenfold.</span> And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H7760\">set</span> a <span class=\"wl wl-kjv\" data-code=\"H226\">mark</span> upon <span class=\"wl wl-kjv\" data-code=\"H7014\">Cain,</span> <span class=\"wl wl-kjv\" data-code=\"H1115\">lest</span> any <span class=\"wl wl-kjv\" data-code=\"H4672\">finding</span> him should kill","16":"And <span class=\"wl wl-kjv\" data-code=\"H7014\">Cain</span> went <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> from the <span class=\"wl wl-kjv\" data-code=\"H6440\">presence</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelt</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H5113\">Nod,</span> on the <span class=\"wl wl-kjv\" data-code=\"H6926\">east</span> of Eden.","17":"And <span class=\"wl wl-kjv\" data-code=\"H7014\">Cain</span> <span class=\"wl wl-kjv\" data-code=\"H3045\">knew</span> his <span class=\"wl wl-kjv\" data-code=\"H802\">wife;</span> and she <span class=\"wl wl-kjv\" data-code=\"H2029\">conceived,</span> and <span class=\"wl wl-kjv\" data-code=\"H3205\">bare</span> <span class=\"wl wl-kjv\" data-code=\"H2585\">Enoch:</span> and he <span class=\"wl wl-kjv\" data-code=\"H1129\">builded</span> a <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> and <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of the <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> after the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of his <span class=\"wl wl-kjv\" data-code=\"H1121\">son,</span> Enoch.","18":"And unto <span class=\"wl wl-kjv\" data-code=\"H2585\">Enoch</span> was <span class=\"wl wl-kjv\" data-code=\"H3205\">born</span> <span class=\"wl wl-kjv\" data-code=\"H5897\">Irad:</span> and <span class=\"wl wl-kjv\" data-code=\"H5897\">Irad</span> <span class=\"wl wl-kjv\" data-code=\"H3205\">begat</span> <span class=\"wl wl-kjv\" data-code=\"H4232\">Mehujael:</span> and <span class=\"wl wl-kjv\" data-code=\"H4232\">Mehujael</span> <span class=\"wl wl-kjv\" data-code=\"H3205\">begat</span> <span class=\"wl wl-kjv\" data-code=\"H4967\">Methusael:</span> and <span class=\"wl wl-kjv\" data-code=\"H4967\">Methusael</span> <span class=\"wl wl-kjv\" data-code=\"H3205\">begat</span> Lamech.","19":"And <span class=\"wl wl-kjv\" data-code=\"H3929\">Lamech</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> unto him <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H802\">wives:</span> the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of the <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> was <span class=\"wl wl-kjv\" data-code=\"H5711\">Adah,</span> and the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of the <span class=\"wl wl-kjv\" data-code=\"H8145\">other</span> Zillah.","20":"And <span class=\"wl wl-kjv\" data-code=\"H5711\">Adah</span> <span class=\"wl wl-kjv\" data-code=\"H3205\">bare</span> <span class=\"wl wl-kjv\" data-code=\"H2989\">Jabal:</span> he was the <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> of such as <span class=\"wl wl-kjv\" data-code=\"H3427\">dwell</span> in <span class=\"wl wl-kjv\" data-code=\"H168\">tents,</span> and of such as have cattle.","21":"And his <span class=\"wl wl-kjv\" data-code=\"H251\">brother's</span> <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> was <span class=\"wl wl-kjv\" data-code=\"H3106\">Jubal:</span> he was the <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> of all such as <span class=\"wl wl-kjv\" data-code=\"H8610\">handle</span> the <span class=\"wl wl-kjv\" data-code=\"H3658\">harp</span> and organ.","22":"And <span class=\"wl wl-kjv\" data-code=\"H6741\">Zillah,</span> she also <span class=\"wl wl-kjv\" data-code=\"H3205\">bare</span> <span class=\"wl wl-kjv\" data-code=\"H8423\">Tubalcain,</span> an <span class=\"wl wl-kjv\" data-code=\"H3913\">instructer</span> of every <span class=\"wl wl-kjv\" data-code=\"H2794\">artificer</span> in <span class=\"wl wl-kjv\" data-code=\"H5178\">brass</span> and <span class=\"wl wl-kjv\" data-code=\"H1270\">iron:</span> and the <span class=\"wl wl-kjv\" data-code=\"H269\">sister</span> of <span class=\"wl wl-kjv\" data-code=\"H8423\">Tubalcain</span> was Naamah.","23":"And <span class=\"wl wl-kjv\" data-code=\"H3929\">Lamech</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto his <span class=\"wl wl-kjv\" data-code=\"H802\">wives,</span> <span class=\"wl wl-kjv\" data-code=\"H5711\">Adah</span> and <span class=\"wl wl-kjv\" data-code=\"H6741\">Zillah,</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">Hear</span> my <span class=\"wl wl-kjv\" data-code=\"H6963\">voice;</span> ye <span class=\"wl wl-kjv\" data-code=\"H802\">wives</span> of <span class=\"wl wl-kjv\" data-code=\"H3929\">Lamech,</span> <span class=\"wl wl-kjv\" data-code=\"H238\">hearken</span> unto my <span class=\"wl wl-kjv\" data-code=\"H565\">speech:</span> for I have <span class=\"wl wl-kjv\" data-code=\"H2026\">slain</span> a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> to my <span class=\"wl wl-kjv\" data-code=\"H6482\">wounding,</span> and a young <span class=\"wl wl-kjv\" data-code=\"H3206\">man</span> to my hurt.","24":"<span class=\"wl wl-kjv\" data-code=\"H3588\">If</span> <span class=\"wl wl-kjv\" data-code=\"H7014\">Cain</span> shall be <span class=\"wl wl-kjv\" data-code=\"H5358\">avenged</span> <span class=\"wl wl-kjv\" data-code=\"H7659\">sevenfold,</span> truly <span class=\"wl wl-kjv\" data-code=\"H3929\">Lamech</span> <span class=\"wl wl-kjv\" data-code=\"H7657\">seventy</span> and sevenfold.","25":"And <span class=\"wl wl-kjv\" data-code=\"H120\">Adam</span> <span class=\"wl wl-kjv\" data-code=\"H3045\">knew</span> his <span class=\"wl wl-kjv\" data-code=\"H802\">wife</span> <span class=\"wl wl-kjv\" data-code=\"H5750\">again;</span> and she <span class=\"wl wl-kjv\" data-code=\"H3205\">bare</span> a <span class=\"wl wl-kjv\" data-code=\"H1121\">son,</span> and <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> his <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> <span class=\"wl wl-kjv\" data-code=\"H8352\">Seth:</span> For <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> said she, hath <span class=\"wl wl-kjv\" data-code=\"H7896\">appointed</span> me <span class=\"wl wl-kjv\" data-code=\"H312\">another</span> <span class=\"wl wl-kjv\" data-code=\"H2233\">seed</span> <span class=\"wl wl-kjv\" data-code=\"H8478\">instead</span> of <span class=\"wl wl-kjv\" data-code=\"H1893\">Abel,</span> <span class=\"wl wl-kjv\" data-code=\"H3588\">whom</span> <span class=\"wl wl-kjv\" data-code=\"H7014\">Cain</span> slew.","26":"And to <span class=\"wl wl-kjv\" data-code=\"H8352\">Seth,</span> to <span class=\"wl wl-kjv\" data-code=\"H1931\">him</span> also there was <span class=\"wl wl-kjv\" data-code=\"H3205\">born</span> a <span class=\"wl wl-kjv\" data-code=\"H1121\">son;</span> and he <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> his <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> <span class=\"wl wl-kjv\" data-code=\"H583\">Enos:</span> then began <span class=\"wl wl-kjv\" data-code=\"H2490\">men</span> to <span class=\"wl wl-kjv\" data-code=\"H7121\">call</span> upon the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of the LORD."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"bekende","tekst":"Versta hierdoor de gemeenschap die tussen man en vrouw is tot voortteling van kinderen; zie onder vs.17, 25; idem, hfdst.19:8, 24:16; 1Sa 1:19; Mat 1:25."},{"catchword":"Kaïn,","tekst":"Hebr. Kaïn, dat is, verkregen."},{"catchword":"man","tekst":"Dat is, een zoon."},{"catchword":"van den HEERE","tekst":"Dat het Hebr. woordje eth somtijds voor meëth, dat is van en uit, genomen wordt, zie daarvan Jer 51:59. Anders, met den Heere, dat is, door de genade en hulp des Heeren. Anders, den Heere, alsof Heva gemeend had den beloofden Messias gekregen te hebben."}],"2":[{"catchword":"Habel","tekst":"Hebr. Hebel."},{"catchword":"schaapherder,","tekst":"Hebr. een herder van klein vee, als schapen en geiten. Want het Hebr. woord betekent dat gelijkelijk, alzo onder vs.4 en Gen 13:5, Gen 26:14, enz."}],"3":[{"catchword":"ten einde","tekst":"Hebr. van het einde der dagen, dat is, na enigen tijd van dagen. Het woord dagen, alleen gesteld zijnde, betekent somtijds in de Heilige Schrift enige dagen; gelijk onder Gen 24:55, Gen 40:4; Jdg 14:8; Mar 2:1."},{"catchword":"offer","tekst":"Hebr. MINCHA, dat is, gave, geschenk of spijsoffer. Zie Lev 2:1."}],"4":[{"catchword":"hun vet","tekst":"Hebr. hare vettigheden: versta hierdoor dat Habel geofferd heeft niet alleen het vet, maar ook het beste zijner kudde, en [zo het schijnt] een goed getal. Vet betekent dikwijls het beste in de Heilige Schrift, gelijk Num 18:12 enz."},{"catchword":"zag Habel","tekst":"Dat is, Habels persoon en offerande waren God aangenaam van wege zijn geloof, ziende op de offerande des beloofden Messias. Zie Heb 11:4."}],"5":[{"catchword":"Maar Kaïn en zijn","tekst":"Dit verklaart de apostel Heb 11:4, sprekende van het getuigenis, hetwelk God gaf over Habels gaven, hetzij met woorden, met vuur van den hemel, of enig ander teken. Verg. Lev 9:24; Jdg 6:21; 1Ki 18:38; 1Ch 21:26; 2Ch 7:1."},{"catchword":"ontstak Kaïn","tekst":"Hebr. en Kaïn ontstak. Te weten, de toornigheid; alzo in het volgende vs., zie, in een gelijke manier van spreken, het woordje toorn daarbij gevoegd, onder 39:19; Exo 32:10-11."},{"catchword":"zijn aangezicht","tekst":"Dat is, het gelaat zijns aangezichts veranderde."}],"7":[{"catchword":"verhoging?","tekst":"Dat is, zult gij niet [als de eerstgeborene] verheven en verhoogd blijven boven uw broeder? Anders, zult gij uw hoofd of aangezicht niet vrijelijk opsteken, inplaats dat het nu nedergeslagen of zo ontvallen is? Sommigen hebben: Aanneming, aangenaamheid, of vergeving, overeenkomstig de verscheidene betekenissen des Hebr. woords."},{"catchword":"de zonde","tekst":"Dat is, de straf der zonde, alzo onder Gen 19:15; Lev 5:1; Num 18:1. Zie onder de aantekening op vs.13."},{"catchword":"ligt aan","tekst":"Dat is, is zeer nabij en als tegenwoordig, zodat aan haar zekere aankomst niet te twijfelen is, verg. Mat 24:33; Jam 5:9."},{"catchword":"zijn","tekst":"Dit is te verstaan van Habel, Kaïns broeder; alsof God zeide: Maar wat uw broeder aangaat, gij hebt geen reden om over hem te toornen, dewijl hij tot u genegen en weltevreden is, dat gij [als de eerstgeborene] over hem verheven blijft. Verg. Gen 3:16."}],"8":[{"catchword":"Kaïn sprak met","tekst":"Om [naar sommiger gevoelen] met lieflijk gelaat en vriendelijke woorden hem alleen in het veld te lokken, hebbende in zijn hart haat en doodslag verborgen. Hebr. zeide tot zijn broeder. Te weten, zoals enigen verstaan, hetgeen tussen God en hem was geschied, alzo dat het een afgebroken reden zou zijn."}],"9":[{"catchword":"Ik weet het niet","tekst":"Een onbeschaamde leugen."},{"catchword":"ben ik mijns broeders hoeder?","tekst":"Een vermeten hoogmoed."}],"10":[{"catchword":"Hij zeide","tekst":"Te weten, de Heere."},{"catchword":"des bloeds","tekst":"Hebr. der bloeden, in het getal van velen meervoud. Zo spreekt de Heilige Schrift van moord en doodslag, omdat daarin veel bloed vergoten wordt."},{"catchword":"roept van","tekst":"Hebr. zijn roepende, in het getal van velen of meervoud. Moord is een van de wraakroepe (function bouwHfdnav() {

    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |

  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start) {
  const nummers = [];
  for (let i = 0; i < 3; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
  if (m) {
    const start = parseInt(m[1], 10);
    const html = popupVerzenHtml(D.vertalingen.SVnu, start);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const html = popupVerzenHtml(data, start);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
