<style>
  :root {

    --light:#faf6ee; --lightgray:#e6dcc8; --gray:#c9b896; --darkgray:#4a3829; --dark:#3a2a1d;

    --bg-soft: #f2ead8; --border: var(--lightgray); --tekst: var(--darkgray);
  }
  * { box-sizing: border-box; }
  body { font-family: var(--bodyFont); background: var(--bg); color: var(--tekst); margin: 0; line-height: 1.7; }
  .omslag { max-width: 900px; margin: 0 auto; padding: 1.2rem 1rem 4rem; }

  .navknop { color:var(--accent); text-decoration:none; padding:.25rem .3rem; white-space:nowrap; }
  .navknop:hover { color:var(--accent-donker); text-decoration:underline; }

  .hfdnav .midden { display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:.4rem; color:#777; }
  .hfdnav select { font-family:"Lora"; font-size:.85rem; border:1px solid var(--border); border-radius:999px; padding:.3rem 1.6rem .3rem .8rem; background:#fff; color:var(--accent-donker); cursor:pointer; }

  .navselect { font-family:"Lora"; font-size:.85rem; border:1px solid var(--border); border-radius:999px; padding:.3rem 1.6rem .3rem .8rem; background:#fff; color:var(--accent-donker); cursor:pointer; display:inline-flex; align-items:center; text-decoration:none; }
  #bibliotheekknop { padding:.3rem .7rem; font-size:1rem; line-height:1; }

     wrapt dan als 'boek hoofdstuk' boven / 'vertaling lampje' onder */
  @media (min-width: 641px) {
    #vertaalkies { order: -1; }
  }

  /* verzen — tabsmodus (één kolom) */
  .vers { position: relative; display: flex; gap: .8rem; padding: .45rem 2.4rem .45rem .4rem; border-radius: 8px; cursor: pointer; }
  .vers:hover { background: var(--bg-soft); }
  .vers.open { background: var(--bg-soft); box-shadow: inset 3px 0 0 var(--accent); border-radius: 8px 8px 0 0; }
  .vers.flits { animation: flits 1.6s ease-out; }
  @keyframes flits { 0% { background: #f0e2bd; } 100% { background: var(--bg-soft); } }
  .vnr { color: #b3a184; font-size: .75rem; min-width: 1.6rem; text-align: right; padding-top: .45rem; font-family: "Lora"; }
  .vtekst em, .pcel em { font-style: italic; color: #555; }
  .wl { border-bottom: 1px dotted var(--accent); }
  .noot { color: var(--accent); cursor: pointer; font-weight: 700; padding: 0 .05rem; }
  .noot:hover { color: var(--accent-donker); }
  #notenlijst { margin: 1.5rem 0 0 2.4rem; font-family: "Lora"; font-size: .82rem; color: #666; border-top: 1px solid var(--border); padding-top: .8rem; }
  #notenlijst h3 { font-size: .78rem; text-transform: uppercase; letter-spacing: .12em; color: var(--accent-donker); margin: 0 0 .5rem; }

  .kopieer { position: absolute; right: .4rem; top: .55rem; opacity: 0; border: none; background: none; cursor: pointer; color: var(--accent); font-size: .95rem; padding: .1rem .3rem; transition: opacity .15s; }
  .vers:hover .kopieer { opacity: .75; }
  .kopieer:hover { opacity: 1 !important; }

  /* parallelmodus (kolommen naast elkaar) */
  #bijbel.parallel .vers { display:grid; gap:.8rem; cursor:pointer; align-items:start; }
  #bijbel.parallel .vnr { grid-row: 1; }
  .kolomkop { display:none; }
  #bijbel.parallel + .kolomkop, .kolomkop.tonen { }
  .pk { font-family:"Lora"; font-size:.72rem; text-transform:uppercase; letter-spacing:.12em; color:var(--accent-donker); font-weight:700; }
  #bijbel.parallel .pcel em { font-style:italic; color:#555; }

  /* naslagpaneel */
  .paneel { display: none; margin: 0 0 .6rem 0; background: #fff; box-shadow: inset 3px 0 0 var(--accent); border-radius: 0 0 8px 8px; padding: .9rem 1.1rem 1rem; font-family: "Lora"; font-size: 1rem; }
  .paneel.open { display: block; }
  .ntabs { display: flex; gap: .4rem; margin-bottom: .8rem; }

  .ntab.actief { background: var(--accent); color: #fff; border-color: var(--accent); }
  .ntab.leeg { opacity: .4; cursor: default; }

  .bronregel { font-size:.72rem; color:#999; margin-top:.6rem; }

  .site-footer { font-family:"Lora"; display:grid; grid-template-columns: 1fr 1fr 1fr; gap:1.5rem; max-width:700px; margin:3rem auto 0; padding:2rem 1.5rem 0; border-top:1px solid var(--lightgray); font-size:.85em; }

lacht. Op de dag dat God de mens schiep, maakte Hij hem naar de gelijkenis van God.","2":"Man en vrouw schiep Hij hen, en zegende ze, en noemde hun naam Mens, op de dag dat zij geschapen werden.","3":"En Adam leefde honderdendertig jaren, en verwekte een zoon naar zijn gelijkenis, naar zijn evenbeeld, en noemde zijn naam Seth.","4":"En Adams dagen, nadat hij Seth verwekt had, zijn achthonderd jaren geweest; en hij verwekte zonen en dochters.","5":"Zo waren al de dagen van Adam, die hij leefde, negenhonderd en dertig jaren; en hij stierf.","6":"En Seth leefde honderdenvijf jaren, en hij verwekte Enos.","7":"En Seth leefde, nadat hij Enos verwekt had, achthonderdenzeven jaren; en hij verwekte zonen en dochters.","8":"Zo waren al de dagen van Seth negenhonderdentwaalf jaren; en hij stierf.","9":"En Enos leefde negentig jaren, en hij verwekte Kenan.","10":"En Enos leefde, nadat hij Kenan verwekt had, achthonderdenvijftien jaren; en hij verwekte zonen en dochters.","11":"Zo waren al de dagen van Enos negenhonderdenvijf jaren; en hij stierf.","12":"En Kenan leefde zeventig jaren, en hij verwekte Mahalal-el.","13":"En Kenan leefde, nadat hij Mahalal-el verwekt had, achthonderdenveertig jaren; en hij verwekte zonen en dochters.","14":"Zo waren al de dagen van Kenan negenhonderdentien jaren; en hij stierf.","15":"En Mahalal-el leefde vijfenzestig jaren, en hij verwekte Jered.","16":"En Mahalal-el leefde, nadat hij Jered verwekt had, achthonderdendertig jaren; en hij verwekte zonen en dochters.","17":"Zo waren al de dagen van Mahalal-el achthonderdvijfennegentig jaren; en hij stierf.","18":"En Jered leefde honderdtweeënzestig jaren, en hij verwekte Henoch.","19":"En Jered leefde, nadat hij Henoch verwekt had, achthonderd jaren; en hij verwekte zonen en dochters.","20":"Zo waren al de dagen van Jered negenhonderdtweeënzestig jaren; en hij stierf.","21":"En Henoch leefde vijfenzestig jaren, en hij verwekte Methusalach.","22":"En Henoch wandelde met God, nadat hij Methusalach verwekt had, driehonderd jaren; en hij verwekte zonen en dochters.","23":"Zo waren al de dagen van Henoch driehonderdvijfenzestig jaren.","24":"Henoch dan wandelde met God; en hij was er niet meer; want God nam hem weg.","25":"En Methusalach leefde honderdzevenentachtig jaren, en hij verwekte Lamech.","26":"En Methusalach leefde, nadat hij Lamech verwekt had, zevenhonderdtweeëntachtig jaren; en hij verwekte zonen en dochters.","27":"Zo waren al de dagen van Methusalach negenhonderdnegenenzestig jaren; en hij stierf.","28":"En Lamech leefde honderdtweeëntachtig jaren, en hij verwekte een zoon.","29":"En hij noemde zijn naam Noach, en zei: Deze zal ons troosten over ons werk en over de smart van onze handen, vanwege het aardrijk, dat de HEERE vervloekt heeft!","30":"En Lamech leefde, nadat hij Noach verwekt had, vijfhonderdvijfennegentig jaren; en hij verwekte zonen en dochters.","31":"Zo waren al de dagen van Lamech zevenhonderdzevenenzeventig jaren; en hij stierf.","32":"En Noach was vijfhonderd jaren oud; en Noach verwekte Sem, Cham en Jafeth."},"SV":{"1":"Dit *is* het boek van Adams geslacht. Ten dage als God den mens schiep, maakte Hij hem naar de gelijkenis Gods.","2":"Man en vrouw schiep Hij hen, en zegende ze, en noemde hun naam Mens, ten dage als zij geschapen werden.","3":"En Adam leefde honderd en dertig jaren, en gewon *een* *zoon* naar zijn gelijkenis, naar zijn evenbeeld, en noemde zijn naam Seth.","4":"En Adams dagen, nadat hij Seth gewonnen had, zijn geweest achthonderd jaren; en hij gewon zonen en dochteren.","5":"Zo waren al de dagen van Adam, die hij leefde, negenhonderd jaren, en dertig jaren; en hij stierf.","6":"En Seth leefde honderd en vijf jaren, en hij gewon Enos.","7":"En Seth leefde, nadat hij Enos gewonnen had, achthonderd en zeven jaren; en hij gewon zonen en dochteren.","8":"Zo waren al de dagen van Seth negenhonderd en twaalf jaren; en hij stierf.","9":"En Enos leefde negentig jaren, en hij gewon Kenan.","10":"En Enos leefde, nadat hij Kenan gewonnen had, achthonderd en vijftien jaren; en hij gewon zonen en dochteren.","11":"Zo waren al de dagen van Enos negenhonderd en vijf jaren; en hij stierf.","12":"En Kenan leefde zeventig jaren, en hij gewon Mahalal-el.","13":"En Kenan leefde, nadat hij Mahalal-el gewonnen had, achthonderd en veertig jaren; en hij gewon zonen en dochteren.","14":"Zo waren al de dagen van Kenan negenhonderd en tien jaren; en hij stierf.","15":"En Mahalal-el leefde vijf en zestig jaren, en hij gewon Jered.","16":"En Mahalal-el leefde, nadat hij Jered gewonnen had, achthonderd en dertig jaren; en hij gewon zonen en dochteren.","17":"Zo waren al de dagen van Mahalal-el achthonderd vijf en negentig jaren; en hij stierf.","18":"En Jered leefde honderd twee en zestig jaren, en hij gewon Henoch.","19":"En Jered leefde, nadat hij Henoch gewonnen had, achthonderd jaren; en hij gewon zonen en dochteren.","20":"Zo waren al de dagen van Jered negenhonderd twee en zestig jaren; en hij stierf.","21":"En Henoch leefde vijf en zestig jaren, en hij gewon Methusalach.","22":"En Henoch wandelde met God, nadat hij Methusalach gewonnen had, driehonderd jaren; en hij gewon zonen en dochteren.","23":"Zo waren al de dagen van Henoch driehonderd vijf en zestig jaren.","24":"Henoch dan wandelde met God; en hij *was* niet *meer*; want God nam hem weg.","25":"En Methusalach leefde honderd zeven en tachtig jaren, en hij gewon Lamech.","26":"En Methusalach leefde, nadat hij Lamech gewonnen had, zevenhonderd twee en tachtig jaren; en hij gewon zonen en dochteren.","27":"Zo waren al de dagen van Methusalach negenhonderd negen en zestig jaren; en hij stierf.","28":"En Lamech leefde honderd twee en tachtig jaren, en hij gewon een zoon.","29":"En hij noemde zijn naam Noach, zeggende: Deze zal ons troosten over ons werk, en over de smart onzer handen, vanwege het aardrijk, dat de HEERE vervloekt heeft!","30":"En Lamech leefde, nadat hij Noach gewonnen had, vijfhonderd vijf en negentig jaren; en hij gewon zonen en dochteren.","31":"Zo waren al de dagen van Lamech zevenhonderd zeven en zeventig jaren; en hij stierf.","32":"En Noach was vijfhonderd jaren oud; en Noach gewon Sem, Cham en Jafeth."},"KJV":{"1":"This *is* the book of the generations of Adam. In the day that God created man, in the likeness of God made","2":"Male and female created he them; and blessed them, and called their name Adam, in the day when they were created.","3":"And Adam lived an hundred and thirty years, and begat *a son* in his own likeness, after his image; and called his name Seth:","4":"And the days of Adam after he had begotten Seth were eight hundred years: and he begat sons and daughters:","5":"And all the days that Adam lived were nine hundred and thirty years: and he died.","6":"And Seth lived an hundred and five years, and begat Enos:","7":"And Seth lived after he begat Enos eight hundred and seven years, and begat sons and daughters:","8":"And all the days of Seth were nine hundred and twelve years: and he died.","9":"And Enos lived ninety years, and begat Cainan:","10":"And Enos lived after he begat Cainan eight hundred and fifteen years, and begat sons and daughters:","11":"And all the days of Enos were nine hundred and five years: and he died.","12":"And Cainan lived seventy years, and begat Mahalaleel:","13":"And Cainan lived after he begat Mahalaleel eight hundred and forty years, and begat sons and daughters:","14":"And all the days of Cainan were nine hundred and ten years: and he died.","15":"And Mahalaleel lived sixty and five years, and begat Jared:","16":"And Mahalaleel lived after he begat Jared eight hundred and thirty years, and begat sons and daughters:","17":"And all the days of Mahalaleel were eight hundred ninety and five years: and he died.","18":"And Jared lived an hundred sixty and two years, and he begat Enoch:","19":"And Jared lived after he begat Enoch eight hundred years, and begat sons and daughters:","20":"And all the days of Jared were nine hundred sixty and two years: and he died.","21":"And Enoch lived sixty and five years, and begat Methuselah:","22":"And Enoch walked with God after he begat Methuselah three hundred years, and begat sons and daughters:","23":"And all the days of Enoch were three hundred sixty and five years:","24":"And Enoch walked with God: and he *was* not; for God took","25":"And Methuselah lived an hundred eighty and seven years, and begat Lamech:","26":"And Methuselah lived after he begat Lamech seven hundred eighty and two years, and begat sons and daughters:","27":"And all the days of Methuselah were nine hundred sixty and nine years: and he died.","28":"And Lamech lived an hundred eighty and two years, and begat a son:","29":"And he called his name Noah, saying, This *same* shall comfort us concerning our work and toil of our hands, because of the ground which the LORD hath cursed.","30":"And Lamech lived after he begat Noah five hundred ninety and five years, and begat sons and daughters:","31":"And all the days of Lamech were seven hundred seventy and seven years: and he died.","32":"And Noah was five hundred years old: and Noah begat Shem, Ham, and Japheth."}},"tsk":{"1":[{"kopje":"boek","refs":["Gen 2:4","Gen 6:9","Gen 10:1","1 Kron 1:1","Matt 1:1","Luk 3:36-38"]},{"kopje":"naar de gelijkenis","refs":["Gen 1:26","Gen 1:27","Pred 7:29","Pred 12:1","1 Kor 11:7","2 Kor 3:18","Ef 4:24","Kol 3:10","Hebr 1:3","Hebr 12:9"]}],"2":[{"kopje":"Man","refs":["Gen 1:27","Mal 2:15"]},{"kopje":"hun","refs":["Gen 2:15","Gen 2:23","Hand 17:26"]}],"3":[{"kopje":"naar zijn gelijkenis","refs":["Job 14:4","Job 15:14-16","Job 25:4","Ps 14:2","Ps 14:3","Ps 51:7","Luk 1:35","Joh 3:6","Rom 5:12","1 Kor 15:39","Ef 2:3"]},{"kopje":"noemde","refs":["Gen 4:25"]}],"4":[{"kopje":"En Adams","refs":["1 Kron 1:1-3","Luk 3:36-38"]},{"kopje":"en hij","refs":["Gen 5:7","Gen 5:10","Gen 5:13","Gen 5:19","Gen 5:22","Gen 5:26","Gen 5:30","Gen 1:28","Gen 9:1","Gen 9:7","Gen 11:12","Ps 127:3","Ps 144:12"]}],"5":[{"kopje":"negenhonderd t Adam geschapen was."}],"3":[{"catchword":"leefde","tekst":"Dat is, toen hij zolang had geleefd, of zo oud was, kreeg hij een zoon. En zo moet men dit ook in het volgende verstaan."},{"catchword":"honderd en dertig jaren","tekst":"Hebr. dertig en honderd jaar; en alzo wordt hier en elders in de Hebr. spraak het kleinere getal meest voor en het meerdere achter gesteld."},{"catchword":"naar zijn gelijkenis","tekst":"Tegen Gods beeld en gelijkenis, naar hetwelk Adam geschapen was, wordt hier nu gesteld Adams beeld en gelijkenis, naar hetwelk Seth geboren is. Gods beeld was volmaakt, maar na den val was Adams beeld gans verdorven; waardoor nu alle mensen, die natuurlijk uit Adam geboren worden, zondig, ellendig en den dood onderworpen zijn. Zie Rom 5:12."},{"catchword":"noemde","tekst":"Te weten, uit occasie der woorden, die Heva sprak, toen zij dezen zoon kreeg, zie boven Gen 4:25."}],"5":[{"catchword":"Jaren, en dertig jaren;","tekst":"Het woordje jaar wordt hier tweemalen gesteld naar de Hebr. manier; maar hierna wordt het éénmaal, om de eigenschap onzer Nederduitse taal, nagelaten."}],"9":[{"catchword":"Kenan","tekst":"Luk 3:37, genaamd Kainan."}],"12":[{"catchword":"Mahalal-el.","tekst":"Luk 3:37 staat in het Grieks Malaleël."}],"18":[{"catchword":"hij gewon","tekst":"Verg. den Zendbrief van Jud 1:14-15."},{"catchword":"Henoch","tekst":"Hebr. Chanoch."}],"21":[{"catchword":"Methusalach.","tekst":"Hebr. Methuschalach."}],"22":[{"catchword":"wandelde met God,","tekst":"Dat is, hij leidde voor God een heilig leven met groten ijver en bijzondere gestadigheid, zich afzonderende van de goddeloosheid en boze zeden der wereld. Zie onder dezelfde manier van spreken, hfdst.6:9; Mic 6:8; en vergelijk Jer 12:3."}],"24":[{"catchword":"en hij was niet meer,","tekst":"Dit wordt verklaard, Heb 11:5, dat hij is weggenomen en overgezet in het eeuwige leven."}],"26":[{"catchword":"Lamech","tekst":"Hebr. Lemech."}],"27":[{"catchword":"Methusalach","tekst":"Deze Methusalach is de oudste geweest van alle mensen, die op aarde geleefd hebben, waarvan de Heilige Schrift meldt."}],"29":[{"catchword":"Noach,","tekst":"In het Nieuwe Testament genaamd Noë, Luk 3:36; 1Pe 3:20; Heb 11:7. De twee Hebreeuwse woorden Noach en Nicham, die hier beiden gebruikt worden, hebben enige gelijkheid. Het ene betekent rusten, waarvan de naam Noach genomen is; het andere vertroosten, waarmede de reden der benaming aangewezen wordt, want Lamech, zonder twijfel door des Heeren Geest onderricht zijnde, heeft gezien dat Noach tot wat bijzonders zou gebruikt worden."},{"catchword":"vanwege het aardrijk,","tekst":"Zie boven hoofdstuk Gen 3:17-19, Gen 4:11."}],"32":[{"catchword":"vijfhonderd jaren","tekst":"Hebr. een zoon van vijf honderd jaar. Dat is, Noach was zoveel jaren oud, of ging in het vijf honderdste jaar. Deze manier van spreken vindt men zeer dikwijls in de Heilige Schrift. Zie onder Gen 7:6, Gen 11:10, Gen 17:17, enz."},{"catchword":"gewon","tekst":"Dat is hier te zeggen: hij begon te gewinnen, gelijk hoofdstuk 1Sa 1:26, want deze drie zonen zijn in één jaar niet geboren; maar eerst Jafeth, daarna Sem en ten laatste Cham. Zie hoofdstuk Gen 9:24, Gen 10:10; Sem wordt hier de eerste gesteld, als een godvruchtig voorvader van onzen Heere Jezus Christus naar het vlees, mitsgaders van alle Hebreën. Zie hoofdstuk Gen 10:21, enz."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"This is the book of Adams generation [or rehearsal register account, enumeration , of births or generations that is of them that were born of Adam understand not of all but those only of whom the Lord Jesus Christ is born after the flesh by the line of Seth Luke 3 and who for the most part maintained the true worship of God among them until the time of Deluge ] on the day when God created men he created him after the likeness of God [that is after his own likeness see above chapter 1.26,27.]"}],"2":[{"catchword":null,"tekst":"Male and female he created them and blessed them and called thei // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

(function vulNoten() {

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
