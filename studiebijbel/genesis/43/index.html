 dat land;","2":"Zo gebeurde het, toen zij het voedsel, dat zij uit Egypte gebracht hadden, opgegeten hadden, dat hun vader tegen hen zei: Ga opnieuw, koop ons een weinig voedsel.","3":"Toen sprak Juda tegen hem en zei: Die man heeft ons op het hoogste betuigd en gezegd: U zult mijn gezicht niet zien, als uw broer niet bij u is.","4":"Als u onze broer met ons meestuurt, zullen wij aftrekken en voedsel voor u kopen;","5":"Maar als u *hem* niet stuurt, zullen wij niet aftrekken; want die man heeft tegen ons gezegd: U zult mijn gezicht niet zien, als uw broer niet bij u is.","6":"En Israël zei: Waarom hebt u zo kwalijk aan mij gedaan, dat u die man vertelde dat u nog een broer had?","7":"En zij zeiden: Die man vroeg zeer nauwkeurig naar ons, en naar onze afkomst, en zei: Leeft uw vader nog; hebt u nog een broer? Zo vertelden wij het hem, volgens diezelfde woorden; konden wij dan zeker weten dat hij zou zeggen: Breng uw broer hierheen?","8":"Toen zei Juda tegen Israël, zijn vader: Stuur de jongeman met mij mee, dan zullen wij ons opmaken en op reis gaan, opdat wij leven en niet sterven, wij niet, u niet, en ook onze kinderen niet.","9":"Ik zal borg voor hem zijn; van mijn hand zult u hem eisen; als ik hem niet bij u breng en voor uw gezicht stel, dan heb ik alle dagen tegen u gezondigd!","10":"Want als wij niet getreuzeld hadden, waren wij zeker al twee keer teruggekomen.","11":"Toen zei Israël, hun vader, tegen hen: Is het nu zo, doe dan dit; neem van het beste fruit van dit land in uw zakken, en breng die man een geschenk mee: een weinig balsem, en een weinig honing, specerijen en mirre, terpentijnnoten en amandelen.","12":"En neem dubbel geld in uw hand; en breng het geld, dat in de opening van uw zakken teruggekeerd is, weer terug in uw hand; misschien is het een vergissing.","13":"Neem ook uw broer mee, en maak u op, ga terug naar die man.","14":"En God, de Almachtige, geve u barmhartigheid bij die man, dat hij uw andere broer en Benjamin met u laat teruggaan! En wat mij aangaat, als ik van mijn kinderen beroofd word, dan ben ik maar beroofd!","15":"En die mannen namen dat geschenk, en namen dubbel geld in hun hand, en Benjamin; en zij maakten zich op, en trokken af naar Egypte, en zij stonden voor Jozefs gezicht.","16":"Toen Jozef Benjamin bij hen zag, zei hij tegen hem die over zijn huis was: Breng deze mannen naar het huis, en slacht slachtvee, en maak het gereed; want deze mannen zullen 's middags met mij eten.","17":"De man deed zoals Jozef gezegd had; en de man bracht deze mannen in het huis van Jozef.","18":"Toen werden deze mannen bang, omdat zij in het huis van Jozef gebracht werden, en zeiden: Vanwege het geld, dat in het begin in onze zakken teruggekeerd is, worden wij binnengebracht, opdat hij ons overvalt en op ons afkomt, en ons tot slaven neemt, met onze ezels.","19":"Daarom naderden zij tot hem die over het huis van Jozef was, en zij spraken tegen hem bij de deur van het huis.","20":"En zij zeiden: Och, mijn heer! wij waren in het begin al eerder afgekomen, om voedsel te kopen.","21":"Het is nu gebeurd, toen wij in de herberg gekomen waren, en wij onze zakken opendeden, zie, zo lag ieders geld in de opening van zijn zak, ons geld met het volle gewicht; en wij hebben het teruggebracht in onze hand.","22":"Wij hebben ook ander geld in onze hand meegebracht, om voedsel te kopen; wij weten niet wie ons geld in onze zakken gelegd heeft.","23":"En hij zei: Vrede zij u, wees niet bang! Uw God en de God van uw vader heeft u een schat in uw zakken gegeven; uw geld is bij mij aangekomen. En hij bracht Simeon naar hen toe.","24":"Daarna bracht de man deze mannen in het huis van Jozef, en hij gaf water; en zij wasten hun voeten; hij gaf ook aan hun ezels voer.","25":"En zij maakten het geschenk gereed, totdat Jozef kwam op de middag; want zij hadden gehoord dat zij daar brood zouden eten.","26":"Toen Jozef nu thuisgekomen was, brachten zij hem het geschenk, dat in hun hand was, in het huis, en zij bogen zich voor hem ter aarde.","27":"En hij vroeg hun naar hun welzijn, en zei: Gaat het goed met uw vader, de oude man, over wie u zei? Leeft hij nog?","28":"En zij zeiden: Het gaat goed met uw dienaar, onze vader, hij leeft nog; en zij neigden het hoofd en bogen zich neer.","29":"En hij hief zijn ogen op, en zag Benjamin, zijn broer, de zoon van zijn moeder, en zei: Is dit uw jongste broer, over wie u tegen mij zei? Daarna zei hij: Mijn zoon? God zij u genadig!","30":"En Jozef haastte zich; want zijn hart werd bewogen om zijn broer, en hij zocht een plek om te wenen; en hij ging een kamer in, en weende daar.","31":"Daarna waste hij zijn gezicht en kwam naar buiten; en hij bedwong zichzelf, en zei: Zet brood op tafel.","32":"En zij richtten voor hem apart aan, en voor hen apart; en voor de Egyptenaren, die met hem aten, apart; want de Egyptenaren mogen geen brood eten met de Hebreeën, omdat dat voor de Egyptenaren een gruwel is.","33":"En zij zaten voor zijn gezicht, de eerstgeborene naar zijn eerstgeboorterecht, en de jongere naar zijn jeugd; zodat de mannen zich onder elkaar verwonderden.","34":"En hij liet hun gerechten brengen die voor hem stonden; maar het gerecht van Benjamin was vijf keer groter dan de gerechten van hen allen. En zij dronken, en zij werden vrolijk met hem."},"SV":{"1":"De honger nu werd zwaar in dat land;","2":"Zo geschiedde het, als zij den leeftocht, dien zij uit Egypte gebracht hadden, opgegeten hadden, dat hun vader tot hen zeide: Keert wederom, koopt ons een weinig spijze.","3":"Toen sprak Juda tot hem, zeggende: Die man heeft ons op het hoogste betuigd, zeggende: Gij zult mijn aangezicht niet zien, tenzij dat uw broeder met u is.","4":"Indien gij onzen broeder met ons zendt, wij zullen aftrekken, en u spijze kopen;","5":"Maar indien gij *hem* niet zendt, wij zullen niet aftrekken; want die man heeft tot ons gezegd: Gij zult mijn aangezicht niet zien, tenzij dat uw broeder met u is.","6":"En Israël zeide: Waarom hebt gij zo kwalijk aan mij gedaan, dat gij dien man te kennen gaaft, of gij nog een broeder hadt?","7":"En zij zeiden: Die man vraagde zeer nauw naar ons, en naar onze maagschap, zeggende: Leeft uw vader nog; hebt gij nog een broeder? Zo gaven wij het hem te kennen, volgens diezelfde woorden; hebben wij juist geweten, dat hij zeggen zou: Brengt uw broeder af?","8":"Toen zeide Juda tot Israël, zijn vader: Zend den jongeling met mij, zo zullen wij ons opmaken en reizen, opdat wij leven en niet sterven, noch wij, noch gij, noch onze kinderkens.","9":"Ik zal borg voor hem zijn; van mijn hand zult gij hem eisen; indien ik hem tot u niet breng en hem voor uw aangezicht stel, zo zal ik alle dagen tegen u gezondigd hebben!","10":"Want hadden wij niet gezuimd, voorwaar, wij waren alreeds tweemaal wedergekomen.","11":"Toen zeide Israël, hun vader, tot hen: Is het nu alzo, zo doet dit; neemt van het loffelijkste dezes lands in uwe vaten, en brengt dien man een geschenk henen af: een weinig balsem, en een weinig honig, specerijen en mirre, terpentijnnoten en amandelen.","12":"En neemt dubbel geld in uw hand; en brengt het geld, hetwelk in den mond uwer zakken wedergekeerd is, weder in uw hand; misschien is het een feil.","13":"Neemt ook uw broeder mede, en maakt u op, keert weder tot dien man.","14":"En God, de Almachtige, geve u barmhartigheid voor het aangezicht van dien man, dat hij uw anderen broeder en Benjamin met u late gaan! En mij aangaande, als ik van kinderen beroofd ben, zo ben ik beroofd!","15":"En die mannen namen dat geschenk, en namen dubbel geld in hun hand, en Benjamin; en zij maakten zich op, en togen af naar Egypte, en zij stonden voor Jozefs aangezicht.","16":"Als Jozef Benjamin met hen zag, zo zeide hij tot dengene, die over zijn huis was: Breng deze mannen naar het huis toe, en slacht slachtvee, en maak *het* gereed; want deze mannen zullen te middag met mij eten.","17":"De man nu deed, gelijk Jozef gezegd had; en de man bracht deze mannen in het huis van Jozef.","18":"Toen vreesden deze mannen, omdat zij in het huis van Jozef gebracht werden, en zeiden: Ter oorzake van het geld, dat in het begin in onze zakken wedergekeerd is, worden wij ingebracht, opdat hij ons overrompele en ons overvalle, en ons tot slaven neme, met onze ezelen.","19":"Daarom naderden zij tot dien man, die over het huis van Jozef was, en zij spraken tot hem aan de deur van het huis.","20":"En zij zeiden: Och, mijn heer! wij waren in het begin gewisselijk afgekomen, om spijze te kopen.","21":"Het is nu geschied, als wij in de herberg gekomen waren, en wij onze zakken opendeden, zie, zo was ieders mans geld in den mond van zijn zak, ons geld in zijn gewicht; en wij hebben hetzelve wedergebracht in onze hand.","22":"Wij hebben ook ander geld in onze hand afgebracht, om spijze te kopen; wij weten niet, wie ons geld in onze zakken gelegd heeft.","23":"En hij zeide: Vrede zij ulieden, vreest niet! Uw God en de God uws vaders heeft u een schat in uw zakken gegeven; uw geld is tot mij gekomen. En hij bracht Simeon tot hen uit.","24":"Daarna bracht de man deze mannen in het huis van Jozef, en hij gaf water; en zij wiesen hun voeten; hij gaf ook aan hun ezelen voeder.","25":"En zij bereidden het geschenk, totdat Jozef kwam op den middag; want zij hadden gehoord, dat zij aldaar brood eten zouden.","26":"Als nu Jozef te huis gekomen was, zo brachten zij hem het geschenk, hetwelk in hun hand was, in het huis, en zij bogen zich voor hem ter aarde.","27":"En hij vraagde hun naar *hun* welstand, en zeide: Is het wel met uw vader, den oude, waarvan gij zeidet? Leeft hij nog?","28":"En zij zeiden: Het is wel met uw knecht, onzen vader, hij leeft nog; en zij neigden het hoofd en bogen zich neder.","29":"En hij hief zijn ogen op, en zag Benjamin, zijn broeder, den zoon zijner moeder, en zeide: Is dit uw kleinste broeder, waarvan gij tot mij zeidet? Daarna zeide hij: Mijn zoon? God zij u genadig!","30":"En Jozef haastte zich; want zijn ingewand ontstak jegens zijn broeder, en hij zocht te wenen; en hij ging in een kamer, en weende aldaar.","31":"Daarna wies hij zijn aangezicht en kwam uit; en hij bedwong zichzelven, en zeide: Zet brood op.","32":"En zij richtten voor hem aan in het bijzonder, en voor hen in het bijzonder; en voor de Egyptenaren, die met hem aten, in het bijzonder; want de Egyptenaars mogen geen brood eten met de Hebreën, dewijl zulks den Egyptenaren een gruwel is.","33":"En zij zaten voor zijn aangezicht, de eerstgeborene naar zijn eerstgeboorte, en de jongere naar zijn jonkheid; dies verwonderden zich de mannen onder elkander.","34":"En hij langde hun van de gerechten, die voor hem waren; maar Benjamins gerecht was vijfmaal groter, dan de gerechten van hen allen. En zij dronken, en zij werden dronken met hem."},"KJV":{"1":"And the famine *was* sore in the land.","2":"And it came to pass, when they had eaten up the corn which they had brought out of Egypt, their father said unto them, Go again, buy us a little food.","3":"And Judah spake unto him, saying, The man did solemnly protest unto us, saying, Ye shall not see my face, except your brother","4":"If thou wilt send our brother with us, we will go down and buy thee food:","5":"But if thou wilt not send *him*, we will not go down: for the man said unto us, Ye shall not see my face, except your brother","6":"And Israel said, Wherefore dealt ye *so* ill with me, *as* to tell the man whether ye had yet a brother?","7":"And they said, The man asked us straitly of our state, and of our kindred, saying, *Is* your father yet alive? have ye *another* brother? and we told him according to the tenor of these words: could we certainly know that he would say, Bring your brother down?","8":"And Judah said unto Israel his father, Send the lad with me, and we will arise and go; that we may live, and not die, both we, and thou, *and* also our little ones.","9":"I will be surety for him; of my hand shalt thou require him: if I bring him not unto thee, and set him before thee, then let me bear the blame for ever:","10":"For except we had lingered, surely now we had returned this second time.","11":"And their father Israel said unto them, If *it must be* so now, do this; take of the best fruits in the land in your vessels, and carry down the man a present, a little balm, and a little honey, spices, and myrrh, nuts, and almonds:","12":"And take double money in your hand; and the money that was brought again in the mouth of your sacks, carry *it* again in your hand; peradventure it *was* an oversight:","13":"Take also your brother, and arise, go again unto the man:","14":"And God Almighty give you mercy before the man, that he may send away your other brother, and Benjamin. If I be bereaved *of my children*, I am bereaved.","15":"And the men took that present, and they took double money in their hand, and Benjamin; and rose up, and went down to Egypt, and stood before Joseph.","16":"And when Joseph saw Benjamin with them, he said to the ruler of his house, Bring *these* men home, and slay, and make ready; for *these* men shall dine with me at noon.","17":"And the man did as Joseph bade; and the man brought the men into Joseph's house.","18":"And the men were afraid, because they were brought into Joseph's house; and they said, Because of the money that was returned in our sacks at the first time are we brought in; that he may seek occasion against us, and fall upon us, and take us for bondmen, and our asses.","19":"And they came near to the steward of Joseph's house, and they communed with him at the door of the house,","20":"And said, O sir, we came indeed down at the first time to buy food:","21":"And it came to pass, when we came to the inn, that we opened our sacks, and, behold, *every* man's money *was* in the mouth of his sack, our money in full weight: and we have brought it again in our hand.","22":"And other money have we brought down in our hands to buy food: we cannot tell who put our money in our sacks.","23":"And he said, Peace *be* to you, fear not: your God, and the God of your father, hath given you treasure in your sacks: I had your money. And he brought Simeon","24":"And the man brought the men into Joseph's house, and gave *them* water, and they washed their feet; and he gave their asses provender.","25":"And they made ready the present against Joseph came at noon: for they heard that they should eat bread","26":"And when Joseph came home, they brought him the present which *was* in their hand into the house, and bowed themselves to him to the earth.","27":"And he asked them of *their* welfare, and said, *Is* your father well, the old man of whom ye spake? *Is* he yet alive?","28":"And they answered, Thy servant our father *is* in good health, he *is* yet alive. And they bowed down their heads, and made obeisance.","29":"And he lifted up his eyes, and saw his brother Benjamin, his mother's son, and said, *Is* this your younger brother, of whom ye spake unto me? And he said, God be gracious unto thee, my son.","30":"And Joseph made haste; for his bowels did yearn upon his brother: and he sought *where* to weep; and he entered into *his* chamber, and wept","31":"And he washed his face, and went out, and refrained himself, and said, Set on bread.","32":"And they set on for him by himself, and for them by themselves, and for the Egyptians, which did eat with him, by themselves: because the Egyptians might not eat bread with the Hebrews; for that *is* an abomination unto the Egyptians.","33":"And they sat before him, the firstborn according to his birthright, and the youngest according to his youth: and the men marvelled one at another.","34":"And he took *and sent* messes unto them from before him: but Benjamin's mess was five times so much as any of theirs. And they drank, and were merry"}},"tsk":{"3":[{"kopje":"man","refs":["Gen 42:15-20","Gen 42:33","Gen 42:34","Gen 44:23"]},{"kopje":"betuigd","refs":["Hand 7:34"]},{"kopje":"mijn gezicht niet zien","refs":["Gen 43:5","2 Sam 3:13","2 Sam 14:24","2 Sam 14:28","2 Sam 14:32","Hand "H7666\">buy</span> us a <span class=\"wl wl-kjv\" data-code=\"H4592\">little</span> food.","3":"And <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> <span class=\"wl wl-kjv\" data-code=\"H559\">spake</span> unto him, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> The <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> did <span class=\"wl wl-kjv\" data-code=\"H5749\">solemnly</span> <span class=\"wl wl-kjv\" data-code=\"H5749\">protest</span> unto us, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Ye shall not <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> my <span class=\"wl wl-kjv\" data-code=\"H6440\">face,</span> <span class=\"wl wl-kjv\" data-code=\"H1115\">except</span> your brother","4":"If thou <span class=\"wl wl-kjv\" data-code=\"H3426\">wilt</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">send</span> our <span class=\"wl wl-kjv\" data-code=\"H251\">brother</span> with us, we will go <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> and <span class=\"wl wl-kjv\" data-code=\"H7666\">buy</span> thee food:","5":"But if thou wilt not <span class=\"wl wl-kjv\" data-code=\"H7971\">send</span> him, we will not go <span class=\"wl wl-kjv\" data-code=\"H3381\">down:</span> for the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto us, Ye shall not <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> my <span class=\"wl wl-kjv\" data-code=\"H6440\">face,</span> except your brother","6":"And <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Wherefore dealt ye so <span class=\"wl wl-kjv\" data-code=\"H7489\">ill</span> with me, as to <span class=\"wl wl-kjv\" data-code=\"H5046\">tell</span> the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> whether ye had yet a brother?","7":"And they <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> The <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> <span class=\"wl wl-kjv\" data-code=\"H7592\">asked</span> us <span class=\"wl wl-kjv\" data-code=\"H7592\">straitly</span> of our state, and of our <span class=\"wl wl-kjv\" data-code=\"H4138\">kindred,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Is your <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> yet <span class=\"wl wl-kjv\" data-code=\"H2416\">alive?</span> have <span class=\"wl wl-kjv\" data-code=\"H3426\">ye</span> another <span class=\"wl wl-kjv\" data-code=\"H251\">brother?</span> and we <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> him <span class=\"wl wl-kjv\" data-code=\"H5921\">according</span> to the <span class=\"wl wl-kjv\" data-code=\"H6310\">tenor</span> of these <span class=\"wl wl-kjv\" data-code=\"H1697\">words:</span> could we <span class=\"wl wl-kjv\" data-code=\"H3045\">certainly</span> <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> that he would <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> <span class=\"wl wl-kjv\" data-code=\"H3381\">Bring</span> your <span class=\"wl wl-kjv\" data-code=\"H251\">brother</span> down?","8":"And <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> his <span class=\"wl wl-kjv\" data-code=\"H1\">father,</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">Send</span> the <span class=\"wl wl-kjv\" data-code=\"H5288\">lad</span> with me, and we will <span class=\"wl wl-kjv\" data-code=\"H6965\">arise</span> and <span class=\"wl wl-kjv\" data-code=\"H3212\">go;</span> that we may <span class=\"wl wl-kjv\" data-code=\"H2421\">live,</span> and not <span class=\"wl wl-kjv\" data-code=\"H4191\">die,</span> both we, and thou, and also our little ones.","9":"I will be <span class=\"wl wl-kjv\" data-code=\"H6148\">surety</span> for him; of my <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> shalt thou <span class=\"wl wl-kjv\" data-code=\"H1245\">require</span> him: <span class=\"wl wl-kjv\" data-code=\"H518\">if</span> I <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> him <span class=\"wl wl-kjv\" data-code=\"H518\">not</span> unto thee, and <span class=\"wl wl-kjv\" data-code=\"H3322\">set</span> him before <span class=\"wl wl-kjv\" data-code=\"H6440\">thee,</span> then let me bear the <span class=\"wl wl-kjv\" data-code=\"H2398\">blame</span> for ever:","10":"For <span class=\"wl wl-kjv\" data-code=\"H3884\">except</span> we had <span class=\"wl wl-kjv\" data-code=\"H4102\">lingered,</span> surely now we had <span class=\"wl wl-kjv\" data-code=\"H7725\">returned</span> this second time.","11":"And their <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto them, If it must be so <span class=\"wl wl-kjv\" data-code=\"H645\">now,</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> this; <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> of the best <span class=\"wl wl-kjv\" data-code=\"H2173\">fruits</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> in your <span class=\"wl wl-kjv\" data-code=\"H3627\">vessels,</span> and carry <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> a <span class=\"wl wl-kjv\" data-code=\"H4503\">present,</span> a <span class=\"wl wl-kjv\" data-code=\"H4592\">little</span> <span class=\"wl wl-kjv\" data-code=\"H6875\">balm,</span> and a <span class=\"wl wl-kjv\" data-code=\"H4592\">little</span> <span class=\"wl wl-kjv\" data-code=\"H1706\">honey,</span> <span class=\"wl wl-kjv\" data-code=\"H5219\">spices,</span> and <span class=\"wl wl-kjv\" data-code=\"H3910\">myrrh,</span> <span class=\"wl wl-kjv\" data-code=\"H992\">nuts,</span> and almonds:","12":"And <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> <span class=\"wl wl-kjv\" data-code=\"H4932\">double</span> <span class=\"wl wl-kjv\" data-code=\"H3701\">money</span> in your <span class=\"wl wl-kjv\" data-code=\"H3027\">hand;</span> and the <span class=\"wl wl-kjv\" data-code=\"H3701\">money</span> that was brought <span class=\"wl wl-kjv\" data-code=\"H7725\">again</span> in the <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth</span> of your <span class=\"wl wl-kjv\" data-code=\"H572\">sacks,</span> carry it <span class=\"wl wl-kjv\" data-code=\"H7725\">again</span> in your <span class=\"wl wl-kjv\" data-code=\"H3027\">hand;</span> peradventure it was an oversight:","13":"<span class=\"wl wl-kjv\" data-code=\"H3947\">Take</span> also your <span class=\"wl wl-kjv\" data-code=\"H251\">brother,</span> and <span class=\"wl wl-kjv\" data-code=\"H6965\">arise,</span> go <span class=\"wl wl-kjv\" data-code=\"H7725\">again</span> unto the man:","14":"And <span class=\"wl wl-kjv\" data-code=\"H410\">God</span> <span class=\"wl wl-kjv\" data-code=\"H7706\">Almighty</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> you <span class=\"wl wl-kjv\" data-code=\"H7356\">mercy</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H376\">man,</span> that he may send <span class=\"wl wl-kjv\" data-code=\"H7971\">away</span> your <span class=\"wl wl-kjv\" data-code=\"H312\">other</span> <span class=\"wl wl-kjv\" data-code=\"H251\">brother,</span> and <span class=\"wl wl-kjv\" data-code=\"H1144\">Benjamin.</span> <span class=\"wl wl-kjv\" data-code=\"H834\">If</span> I be <span class=\"wl wl-kjv\" data-code=\"H7921\">bereaved</span> of my children, I am bereaved.","15":"And the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> <span class=\"wl wl-kjv\" data-code=\"H2063\">that</span> <span class=\"wl wl-kjv\" data-code=\"H4503\">present,</span> and they <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> <span class=\"wl wl-kjv\" data-code=\"H4932\">double</span> <span class=\"wl wl-kjv\" data-code=\"H3701\">money</span> in their <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> and <span class=\"wl wl-kjv\" data-code=\"H1144\">Benjamin;</span> and rose <span class=\"wl wl-kjv\" data-code=\"H6965\">up,</span> and went <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> to <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> and <span class=\"wl wl-kjv\" data-code=\"H5975\">stood</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> Joseph.","16":"And when <span class=\"wl wl-kjv\" data-code=\"H3130\">Joseph</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> <span class=\"wl wl-kjv\" data-code=\"H1144\">Benjamin</span> <span class=\"wl wl-kjv\" data-code=\"H854\">with</span> them, he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to the ruler of his <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> <span class=\"wl wl-kjv\" data-code=\"H935\">Bring</span> these <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">home,</span> and <span class=\"wl wl-kjv\" data-code=\"H2873\">slay,</span> and make <span class=\"wl wl-kjv\" data-code=\"H3559\">ready;</span> for these <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> shall <span class=\"wl wl-kjv\" data-code=\"H398\">dine</span> with me at noon.","17":"And the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> as <span class=\"wl wl-kjv\" data-code=\"H3130\">Joseph</span> <span class=\"wl wl-kjv\" data-code=\"H559\">bade;</span> and the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> into <span class=\"wl wl-kjv\" data-code=\"H3130\">Joseph's</span> house.","18":"And the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> were <span class=\"wl wl-kjv\" data-code=\"H3372\">afraid,</span> because they were <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> into <span class=\"wl wl-kjv\" data-code=\"H3130\">Joseph's</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house;</span> and they <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H1697\">Because</span> of the <span class=\"wl wl-kjv\" data-code=\"H3701\">money</span> that was <span class=\"wl wl-kjv\" data-code=\"H7725\">returned</span> in our <span class=\"wl wl-kjv\" data-code=\"H572\">sacks</span> at the first <span class=\"wl wl-kjv\" data-code=\"H8462\">time</span> are we brought <span class=\"wl wl-kjv\" data-code=\"H935\">in;</span> that he may seek <span class=\"wl wl-kjv\" data-code=\"H1556\">occasion</span> against us, and <span class=\"wl wl-kjv\" data-code=\"H5307\">fall</span> upon us, and <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> us for <span class=\"wl wl-kjv\" data-code=\"H5650\">bondmen,</span> and our asses.","19":"And they came <span class=\"wl wl-kjv\" data-code=\"H5066\">near</span> to the <span class=\"wl wl-kjv\" data-code=\"H376\">steward</span> of <span class=\"wl wl-kjv\" data-code=\"H3130\">Joseph's</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> and they <span class=\"wl wl-kjv\" data-code=\"H1696\">communed</span> with him at the <span class=\"wl wl-kjv\" data-code=\"H6607\">door</span> of the house,","20":"And <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H994\">O</span> <span class=\"wl wl-kjv\" data-code=\"H113\">sir,</span> we came <span class=\"wl wl-kjv\" data-code=\"H3381\">indeed</span> <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> at the first <span class=\"wl wl-kjv\" data-code=\"H8462\">time</span> to <span class=\"wl wl-kjv\" data-code=\"H7666\">buy</span> food:","21":"And it came to pass, when we <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to the <span class=\"wl wl-kjv\" data-code=\"H4411\">inn,</span> that we <span class=\"wl wl-kjv\" data-code=\"H6605\">opened</span> our <span class=\"wl wl-kjv\" data-code=\"H572\">sacks,</span> and, behold, every <span class=\"wl wl-kjv\" data-code=\"H376\">man's</span> <span class=\"wl wl-kjv\" data-code=\"H3701\">money</span> was in the <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth</span> of his <span class=\"wl wl-kjv\" data-code=\"H572\">sack,</span> our <span class=\"wl wl-kjv\" data-code=\"H3701\">money</span> in full <span class=\"wl wl-kjv\" data-code=\"H4948\">weight:</span> and we have brought it <span class=\"wl wl-kjv\" data-code=\"H7725\">again</span> in our hand.","22":"And <span class=\"wl wl-kjv\" data-code=\"H312\">other</span> <span class=\"wl wl-kjv\" data-code=\"H3701\">money</span> have we brought <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> in our <span class=\"wl wl-kjv\" data-code=\"H3027\">hands</span> to <span class=\"wl wl-kjv\" data-code=\"H7666\">buy</span> <span class=\"wl wl-kjv\" data-code=\"H400\">food:</span> we cannot <span class=\"wl wl-kjv\" data-code=\"H3045\">tell</span> who <span class=\"wl wl-kjv\" data-code=\"H7760\">put</span> our <span class=\"wl wl-kjv\" data-code=\"H3701\">money</span> in our sacks.","23":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H7965\">Peace</span> be to you, <span class=\"wl wl-kjv\" data-code=\"H3372\">fear</span> not: your <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> and the <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of your <span class=\"wl wl-kjv\" data-code=\"H1\">father,</span> hath <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> you <span class=\"wl wl-kjv\" data-code=\"H4301\">treasure</span> in your <span class=\"wl wl-kjv\" data-code=\"H572\">sacks:</span> I <span class=\"wl wl-kjv\" data-code=\"H935\">had</span> your <span class=\"wl wl-kjv\" data-code=\"H3701\">money.</span> And he <span class=\"wl wl-kjv\" data-code=\"H3318\">brought</span> Simeon","24":"And the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> into <span class=\"wl wl-kjv\" data-code=\"H3130\">Joseph's</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> them <span class=\"wl wl-kjv\" data-code=\"H4325\">water,</span> and they <span class=\"wl wl-kjv\" data-code=\"H7364\">washed</span> their <span class=\"wl wl-kjv\" data-code=\"H7272\">feet;</span> and he <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> their <span class=\"wl wl-kjv\" data-code=\"H2543\">asses</span> provender.","25":"And they made <span class=\"wl wl-kjv\" data-code=\"H3559\">ready</span> the <span class=\"wl wl-kjv\" data-code=\"H4503\">present</span> <span class=\"wl wl-kjv\" data-code=\"H5704\">against</span> <span class=\"wl wl-kjv\" data-code=\"H3130\">Joseph</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> at <span class=\"wl wl-kjv\" data-code=\"H6672\">noon:</span> for they <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> that they should <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> bread","26":"And when <span class=\"wl wl-kjv\" data-code=\"H3130\">Joseph</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">home,</span> they <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> him the <span class=\"wl wl-kjv\" data-code=\"H4503\">present</span> which was in their <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> into the <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> and <span class=\"wl wl-kjv\" data-code=\"H7812\">bowed</span> themselves to him to the earth.","27":"And he <span class=\"wl wl-kjv\" data-code=\"H7592\">asked</span> them of their <span class=\"wl wl-kjv\" data-code=\"H7965\">welfare,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Is your <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> <span class=\"wl wl-kjv\" data-code=\"H7965\">well,</span> the old <span class=\"wl wl-kjv\" data-code=\"H2205\">man</span> of whom ye <span class=\"wl wl-kjv\" data-code=\"H559\">spake?</span> Is he yet alive?","28":"And they <span class=\"wl wl-kjv\" data-code=\"H559\">answered,</span> Thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> our <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> is in good <span class=\"wl wl-kjv\" data-code=\"H7965\">health,</span> he is yet <span class=\"wl wl-kjv\" data-code=\"H2416\">alive.</span> And they bowed down their <span class=\"wl wl-kjv\" data-code=\"H6915\">heads,</span> and made obeisance.","29":"And he lifted <span class=\"wl wl-kjv\" data-code=\"H5375\">up</span> his <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes,</span> and <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> his <span class=\"wl wl-kjv\" data-code=\"H251\">brother</span> <span class=\"wl wl-kjv\" data-code=\"H1144\">Benjamin,</span> his <span class=\"wl wl-kjv\" data-code=\"H517\">mother's</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">son,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Is this your <span class=\"wl wl-kjv\" data-code=\"H6996\">younger</span> <span class=\"wl wl-kjv\" data-code=\"H251\">brother,</span> of whom ye <span class=\"wl wl-kjv\" data-code=\"H559\">spake</span> unto me? And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> be <span class=\"wl wl-kjv\" data-code=\"H2603\">gracious</span> unto thee, my son.","30":"And <span class=\"wl wl-kjv\" data-code=\"H3130\">Joseph</span> made <span class=\"wl wl-kjv\" data-code=\"H4116\">haste;</span> for his <span class=\"wl wl-kjv\" data-code=\"H7356\">bowels</span> did <span class=\"wl wl-kjv\" data-code=\"H3648\">yearn</span> upon his <span class=\"wl wl-kjv\" data-code=\"H251\">brother:</span> and he <span class=\"wl wl-kjv\" data-code=\"H1245\">sought</span> where to <span class=\"wl wl-kjv\" data-code=\"H1058\">weep;</span> and he <span class=\"wl wl-kjv\" data-code=\"H935\">entered</span> into his <span class=\"wl wl-kjv\" data-code=\"H2315\">chamber,</span> and wept","31":"And he <span class=\"wl wl-kjv\" data-code=\"H7364\">washed</span> his <span class=\"wl wl-kjv\" data-code=\"H6440\">face,</span> and went <span class=\"wl wl-kjv\" data-code=\"H3318\">out,</span> and <span class=\"wl wl-kjv\" data-code=\"H662\">refrained</span> himself, and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Set <span class=\"wl wl-kjv\" data-code=\"H7760\">on</span> bread.","32":"And they set <span class=\"wl wl-kjv\" data-code=\"H7760\">on</span> for him by himself, and for them by themselves, and for the <span class=\"wl wl-kjv\" data-code=\"H4713\">Egyptians,</span> which did <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> with him, by themselves: because the <span class=\"wl wl-kjv\" data-code=\"H4713\">Egyptians</span> <span class=\"wl wl-kjv\" data-code=\"H3201\">might</span> not <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> <span class=\"wl wl-kjv\" data-code=\"H3899\">bread</span> with the <span class=\"wl wl-kjv\" data-code=\"H5680\">Hebrews;</span> for that is an <span class=\"wl wl-kjv\" data-code=\"H8441\">abomination</span> unto the Egyptians.","33":"And they <span class=\"wl wl-kjv\" data-code=\"H3427\">sat</span> before <span class=\"wl wl-kjv\" data-code=\"H6440\">him,</span> the <span class=\"wl wl-kjv\" data-code=\"H1060\">firstborn</span> according to his <span class=\"wl wl-kjv\" data-code=\"H1062\">birthright,</span> and the <span class=\"wl wl-kjv\" data-code=\"H6810\">youngest</span> according to his <span class=\"wl wl-kjv\" data-code=\"H6812\">youth:</span> and the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> <span class=\"wl wl-kjv\" data-code=\"H8539\">marvelled</span> <span class=\"wl wl-kjv\" data-code=\"H376\">one</span> at another.","34":"And he <span class=\"wl wl-kjv\" data-code=\"H5375\">took</span> and sent <span class=\"wl wl-kjv\" data-code=\"H4864\">messes</span> unto them from before <span class=\"wl wl-kjv\" data-code=\"H6440\">him:</span> but <span class=\"wl wl-kjv\" data-code=\"H1144\">Benjamin's</span> <span class=\"wl wl-kjv\" data-code=\"H4864\">mess</span> was <span class=\"wl wl-kjv\" data-code=\"H2568\">five</span> <span class=\"wl wl-kjv\" data-code=\"H3027\">times</span> so much <span class=\"wl wl-kjv\" data-code=\"H7235\">as</span> any of theirs. And they <span class=\"wl wl-kjv\" data-code=\"H8354\">drank,</span> and were merry"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"in dat land","tekst":"Te weten, in het land Kanaän, en daaromtrent."}],"2":[{"catchword":"als zij den","tekst":"Hebr. toen zij eindigden te eten; dat is, toen zij ten naasten bij alles opgegeten hadden."}],"3":[{"catchword":"Die man","tekst":"Te weten, de heer van Egypte. Alzo ook boven, Gen 42:33, en hier vs.5-7, enz."},{"catchword":"heeft ons op","tekst":"Hebr. betuigende betuigd."},{"catchword":"Gij zult mijn","tekst":"Dat is, in mijn tegenwoordigheid niet komen; zie deze manier van spreken; 2Sa 14:24, 2Sa 14:28, 2Sa 14:32; Act 20:25, Act 20:38."},{"catchword":"broeder met","tekst":"Te weten, Benjamin."}],"6":[{"catchword":"dat gij dien","tekst":"Of, dien man te kennen gevende, dat gij nog een broeder hadt."}],"7":[{"catchword":"vraagde","tekst":"Hebr. vragende vraagde hij."},{"catchword":"volgens","tekst":"Hebr. naar den mond derzelver woorden; dat is, naar den eis der woorden, die hij ons voorgesteld had."},{"catchword":"hebben wij","tekst":"Hebr. zouden wij wetende weten."}],"8":[{"catchword":"sterven,","tekst":"Te weten, van honger."}],"9":[{"catchword":"gezondigd","tekst":"Dat is, strafwaardig zijn al de dagen mijns levens; aldus wordt het woord zondigen, of zondaar zijn, genomen onder, Gen 44:32; 1Ki 1:21."}],"11":[{"catchword":"Is het nu","tekst":"Alsof hij zeide: Is de zaak aldus gesteld, laat het dan geschieden in Gods naam."},{"catchword":"loffelijkste","tekst":"Wat om de grote waarde zeer geprezen en vermaard was. Sommigen houden het voor een zeer uitnemend gewas en vruchten, die van de bomen afgesneden werden."},{"catchword":"balsem,","tekst":"Zie van deze en van enige volgende specerijen, boven, Gen 37:25."},{"catchword":"terpentijnnoten","tekst":"Anders, pijnappelnoten, of, hazelnoten."}],"12":[{"catchword":"dubbel geld","tekst":"Dat is, nog eens zoveel als tevoren, omdat de duurte vermeerderd was; boven, vs.1."},{"catchword":"misschien is","tekst":"Dat is, er mag enig misverstand of misgreep zijn, dat uw geld dus in uw zakken geraakt is."}],"14":[{"catchword":"God, de","tekst":"Zie boven, Gen 17:1."},{"catchword":"En mij aangaande,","tekst":"Alsof hij zeide: moet het zo zijn, dat mijn kinderen achterblijven.... de wil des Heeren geschiede, wien ik de uitkomst dezer zaak aanbeveel. Zie dergelijke manier van spreken, Est 4:16. Anders, gelijk ik van kinderen beroofd ben [te weten, van Jozef en Simeon], zo word ik beroofd [te weten, van Benjamin]."}],"16":[{"catchword":"slachtvee,","tekst":"Hebr. slachting; dat is, vee, hetwelk geslacht werd om gegeten te worden. Verg. Pro 9:2."}],"18":[{"catchword":"Toen vreesden","tekst":"Zij wisten niet dat zij ter maaltijd genodigd waren, maar meenden dat men hen in het huis verzekeren en om het geld bezwaren of straffen wilde."},{"catchword":"in het begin","tekst":"Dat is, bij onze eerste reis naar dit land; zie boven, Gen 42:25."},{"catchword":"opdat hij","tekst":"OF, opdat hij zich wentele over ons; dat is, met zware beschuldiging zich over ons werpe, om ons ten gronde te brengen; gelijk iemand onder een zwaren last, die op hem valt, verdrukt blijft."},{"catchword":"ons tot","tekst":"Men meent dat de Egyptenaars de dieverij plachten te straffen met slavernij."}],"19":[{"catchword":"Daarom","tekst":"Om zich te verontschuldigen, eer zij beschuldigd zouden mogen worden vanwege het geld."}],"20":[{"catchword":"Och, mijn","tekst":"Het Hebr. woordje is gebruikelijk bij dengene, die, in enige zwarigheid zijnde, van een meerdere iets verzoekt; alzo Exo 4:10; Num 12:11."},{"catchword":"in het begin","tekst":"Zie boven, vs.18."},{"catchword":"gewisselijk","tekst":"Hebr. afkomende, afgekomen."}],"21":[{"catchword":"in de herberg","tekst":"Zij verhalen de zaak niet juist noch onderscheidelijk, zoals zij in het geheel geschied was; want één alleen had op den weg in de herberg zijn geld in zijn zak gevonden, en de anderen tehuis, boven, Gen 42:27, Gen 42:35; maar het schijnt dat zij dit zo gedaan hebben, òf om der kortheid wil, òf door verslagenheid."}],"23":[{"catchword":"Vrede zij","tekst":"Of, vrede zal ulieden zijn; dat is, uw zaken staan wèl; het zal wèl zijn; hebt goeden moed."},{"catchword":"Uw God","tekst":"Het schijnt dat deze dienstknecht van Jozef in de ware religie is onderwezen geweest."},{"catchword":"een schat","tekst":"Of, iets verborgens."},{"catchword":"uw geld is","tekst":"Dat is, ik heb uw geld ontvangen."}],"24":[{"catchword":"zij wiesen","tekst":"Zie Gen 18:4."}],"25":[{"catchword":"brood eten","tekst":"Dat is, hun maaltijd houden, of ten eten blijven. Zie boven, Gen 31:54."}],"26":[{"catchword":"bogen zich","tekst":"Zie boven, Gen 37:7."}],"27":[{"catchword":"vraagde hun","tekst":"Hebr. vraagde hun naar den vrede; dat is, naar hun welvaren; of hoe het met hen ging; alzo Exo 18:7; Jdg 18:15; 1Sa 25:5. Van het woord vrede, zie boven, Gen 37:14."},{"catchword":"Is het wel","tekst":"Hebr. heeft hij vrede? en zo vervolgens. Zie boven, Gen 29:6."}],"29":[{"catchword":"Mijn zoon","tekst":"Zo noemt hij hem uit vriendschap en grote toegenegenheid, naar de wijze dergenen, die bedaagder en aanzienlijker zijnde, een jongere en mindere in het vriendelijke plegen toe te spreken."}],"30":[{"catchword":"ingewand","tekst":"Het ingewand des mensen betekent eigenlijk zijn inwendige delen: als hart, long, lever, maag, enz. Naardien nu deze, en voornamelijk het hart, als men met barmhartigheid en medelijden over iemand bevangen wordt, zeer bewogen en ontstoken worden, zo wordt het ingewand genomen voor de barmhartigheid zelve, uit het diepste van het hart des mensen voorkomende; 1Ki 3:26; Phi 2:1; Col 3:12."}],"31":[{"catchword":"hij bedwong","tekst":"Te weten, van wenen; zie Gen 45:1."},{"catchword":"Zet brood op","tekst":"Dat is, recht de spijs aan."}],"32":[{"catchword":"hem aan","tekst":"Jozef."},{"catchword":"in het bijzonder,","tekst":"Tot een teken van zijn waardigheid en den eerbied, dien men hem schuldig was."},{"catchword":"hen in het bijzonder","tekst":"De broeders van Jozef."},{"catchword":"zulks den","tekst":"Ten aanzien van hun afgodische religie, omdat zij goddelijke eer bewezen aan kalven, ossen, enz., die de Hebreën slachtten en aten; verg. onder, Gen 46:34; Exo 8:26."}],"33":[{"catchword":"voor zijn aangezicht,","tekst":"Dat is, tegen hem over."},{"catchword":"de jongere","tekst":"Hebr. de kleine naar zijn kleinkind."},{"catchword":"dies","tekst":"Niet alleen omdat Jozef hun zulk een grote eer aandeed, maar in het bijzonder, omdat zij naar den ouderdom, dien zij meenden dat hem onbekend was, gezet waren."},{"catchword":"onder elkander","tekst":"Hebr. de man tot zijn naasten."}],"34":[{"catchword":"vijfmaal","tekst":"Hebr. hij vermenigvuldigde de gerechten van Benjamin boven de gerechten van hen allen vijf handen, dat is, vijf delen."},{"catchword":"zij werden","tekst":"Dat is, zij werden vrolijk. Het Hebreeuwse woord betekent niet altijd in overvloed of gulzigheid zich met wijn te overladen, maar somtijds alleen verheugd te zijn door het drinken van den wijn. Zie Psa 104:15; Son 5:1; Hag 1:6, gelijk ook het Griekse woord genomen wordt, hetwelk men vindt Joh 2:10."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"The famine now grew heavy in that Country: [viz. the land of Canaan, and others thereabout.]"}],"2":[{"catchword":null,"tekst":"So it happened, when they had eaten up the Provision [Heb. when they ended, or, made an end to eat, i.e. when their provision was near spent] which they had brought out of Egypt, that their father said to them: Turn again, buy us a little food."}],"3":[{"catchword":null,"tekst":"Then Juda spoke to him, saying : That man [viz. the Lord of Egypt, as also above chap. 42. 33. And here verse 5, 6, 7, & c.] hath in the highest manner testified unto us, [Hebr. Testifying hath testified] saying; Ye shall not see my face, [i.e. ye shall not be admitted into my presence. See this phrase likewise, 2 Sam. 14. 24, 28, 32. Acts 20. 25, 38.] unless your brother be with you [Benjamin namely]"}],"4":[{"catchword":null,"tekst":"If thou sendest our brother with us, we will go down, and buy thee food."}],"5":[{"catchword":null,"tekst":"But if thou send (him) not, we shall not go down : for that man told us: Ye shall not see my face, unless your brother be with you."}],"6":[{"catchword":null,"tekst":"And Israel said; wherefore did ye so ill by me: that ye told that man whether [or, telling that man, that] ye had brother yet?"}],"7":[{"catchword":null,"tekst":"And they said: That man enquired very narrowly after us [Heb. asking he asked] and after our kindred, saying; lives your father yet? Have ye a brother yet? So we told him according to the same words. [Heb. after the mouth of the same words, i.e. according as those questions did require.] did we know justly, that he would say, bring down your brother?"}],"8":[{"catchword":null,"tekst":"Then said Juda to Israel his Father; Send the youth with me; then we shall get us up and journey; that we may live, and not die, [viz. of famine] neither we, nor thou, nor our little children."}],"9":[{"catchword":null,"tekst":"I will be surety for him; from my hand shalt thou require him: if I do reft. [viz. of Benjamin too)]"}],"15":[{"catchword":null,"tekst":"And those men took that present, and took double money in their hand, and Benjamin: and they gate them up, and went down to Egypt, and they stood before the face of Joseph."}],"16":[{"catchword":null,"tekst":"When Joseph saw Benjamin with them, he said to him, that was over his house; Bring these men home, and slay slaughter-cattle, [Heb. slay slaying, i.e. of such cattle as is used to be slain for man&acirc;&euro;&trade;s food. Compare Prov. 9. 2.] and make it ready: for these men shall dine with me."}],"19":[{"catchword":null,"tekst":"Therefore they drew near to that man, that was over Joseph&acirc;&euro;&trade;s house: [viz. for to excuse themselves, before any charge should be laid against them for that money] and they spoke to him, at the door of the house."}],"20":[{"catchword":null,"tekst":"And they said; O my Lord: [The Hebrew phrase here is commonly used by those, who being in any distress, address themselves for advice or relief to a deed come down [Heb. descending, we descended] in the beginning, [see above on verse 18.] for to buy food."}],"21":[{"catchword":null,"tekst":"Now it happened, when we came into the Inn, and we opened our sacks, behold every one&acirc;&euro;&trade;s money was in the mouth of his sack, our money in its weight: [They relate the matter here not just so, nor so distinctly, as the same did happen; for, but one of them had found his money in his sack by the way, and the rest at home, above chap. 42. Verse 27, 35. But it seems, they did it here in his manner, either for brevities sake, or in subtilty.] and we have brought the same again in our hand."}],"22":[{"catchword":null,"tekst":"We have likewise brought down other money in our hand, to buy food: we know not who laid our money in our sacks."}],"23":[{"catchword":null,"tekst":"And he said; Peace be unto you; [or, peace shall be to you, i.e. your case is safe and good, ye need not fear, be of good cheer.] Your God, // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

(function vulNoten() {

  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
