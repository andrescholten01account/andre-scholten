 naar het land van het zuiden, en woonde tussen Kades en Sur; en hij verbleef als vreemdeling in Gerar.","2":"Toen Abraham nu van Sara, zijn vrouw, gezegd had: Zij is mijn zuster, stuurde Abimelech, de koning van Gerar, *iemand* en nam Sara weg.","3":"Maar God kwam 's nachts in een droom tot Abimelech, en zei tegen hem: Zie, u bent dood vanwege de vrouw die u weggenomen hebt, want zij is met een man getrouwd.","4":"Doch Abimelech was niet tot haar genaderd; daarom zei hij: Heere, zult U dan ook een rechtvaardig volk doden?","5":"Heeft hij zelf mij niet gezegd: Zij is mijn zuster? En zij, ook zij heeft gezegd: Hij is mijn broeder. In oprechtheid van mijn hart en in reinheid van mijn handen heb ik dit gedaan.","6":"En God zei tegen hem in de droom: Ik heb ook geweten dat u dit in oprechtheid van uw hart gedaan hebt, en Ik heb u ook belet om tegen Mij te zondigen; daarom heb Ik u niet toegelaten haar aan te raken.","7":"Geef dan nu de vrouw van deze man terug, want hij is een profeet, en hij zal voor u bidden, zodat u blijft leven; maar als u haar niet teruggeeft, weet dan dat u zeker sterven zult, u en al wat van u is!","8":"Toen stond Abimelech 's morgens vroeg op, en riep al zijn knechten, en sprak al deze woorden hun voor. En die mannen werden zeer bevreesd.","9":"En Abimelech riep Abraham, en zei tegen hem: Wat hebt u ons aangedaan? En wat heb ik tegen u gezondigd, dat u over mij en over mijn koninkrijk zo'n grote zonde gebracht hebt? U hebt dingen bij mij gedaan die niet gedaan zouden mogen worden.","10":"Verder zei Abimelech tegen Abraham: Wat hebt u gezien, dat u deze zaak gedaan hebt?","11":"En Abraham zei: Want ik dacht: er is beslist geen vreze van God in deze plaats, zodat zij mij zullen doden vanwege mijn vrouw.","12":"En bovendien is zij werkelijk mijn zuster; zij is de dochter van mijn vader, maar niet de dochter van mijn moeder; en zij is mij tot vrouw geworden.","13":"En het is gebeurd, toen God mij uit het huis van mijn vader deed rondzwerven, dat ik tegen haar zei: Dit is de goedheid die u mij bewijzen moet: op alle plaatsen waar wij komen zullen, zeg daar van mij: Hij is mijn broeder!","14":"Toen nam Abimelech schapen en runderen, ook dienstknechten en dienstmaagden, en gaf ze aan Abraham; en hij gaf hem Sara, zijn vrouw, terug.","15":"En Abimelech zei: Zie, mijn land ligt voor u open; woon waar het goed is in uw ogen.","16":"En tegen Sara zei hij: Zie, ik heb uw broeder duizend zilverlingen gegeven; zie, dat moet voor u een bedekking van de ogen zijn, voor allen die bij u zijn, ja, tegenover allen, en wees terechtgewezen.","17":"En Abraham bad tot God; en God genas Abimelech, en zijn vrouw, en zijn dienstmaagden, zodat zij weer kinderen kregen.","18":"Want de HEERE had al de baarmoeders van het huis van Abimelech helemaal gesloten, vanwege Sara, Abrahams vrouw."},"SV":{"1":"En Abraham reisde van daar naar het land van het zuiden, en woonde tussen Kades en tussen Sur; en hij verkeerde als vreemdeling te Gerar.","2":"Als nu Abraham van Sara, zijn huisvrouw, gezegd had: Zij is mijn zuster, zo zond Abimelech, de koning van Gerar, en nam Sara weg.","3":"Maar God kwam tot Abimelech in een droom des nachts, en Hij zeide tot hem: Zie, gij zijt dood om der vrouwe wil, die gij weggenomen hebt; want zij is met een man getrouwd.","4":"Doch Abimelech was tot haar niet genaderd; daarom zeide hij: Heere! zult Gij dan ook een rechtvaardig volk doden?","5":"Heeft hij zelf mij niet gezegd: Zij is mijn zuster? en zij, ook zij heeft gezegd: Hij is mijn broeder. In oprechtheid mijns harten en in reinheid mijner handen, heb ik dit gedaan.","6":"En God zeide tot hem in den droom: Ik heb ook geweten, dat gij dit in oprechtheid uws harten gedaan hebt, en Ik heb u ook belet van tegen Mij te zondigen; daarom heb Ik u niet toegelaten, haar aan te roeren.","7":"Zo geef dan nu dezes mans huisvrouw weder; want hij is een profeet, en hij zal voor u bidden, opdat gij leeft; maar zo gij haar niet wedergeeft, weet, dat gij voorzeker sterven zult, gij, en al wat uwes is!","8":"Toen stond Abimelech des morgens vroeg op, en riep al zijn knechten, en sprak al deze woorden voor hun oren. En die mannen vreesden zeer.","9":"En Abimelech riep Abraham, en zeide tot hem: Wat hebt gij ons gedaan? en wat heb ik tegen u gezondigd, dat gij over mij en over mijn koninkrijk een grote zonde gebracht hebt? gij hebt daden met mij gedaan, die niet zouden gedaan worden.","10":"Voorts zeide Abimelech tot Abraham: Wat hebt gij gezien, dat gij deze zaak gedaan hebt?","11":"En Abraham zeide: Want ik dacht: alleen is de vreze Gods in deze plaats niet, zodat zij mij om mijner huisvrouw wil zullen doden.","12":"En ook *is* *zij* waarlijk mijn zuster; zij is mijns vaders dochter, maar niet mijner moeder dochter; en zij is mij ter vrouwe geworden.","13":"En het is geschied, als God mij uit mijns vaders huis deed dwalen, zo sprak ik tot haar: Dit zij uw weldadigheid, die gij bij mij doen zult; aan alle plaatsen waar wij komen zullen, zeg van mij: Hij *is* mijn broeder!","14":"Toen nam Abimelech schapen en runderen, ook dienstknechten en dienstmaagden, en gaf dezelve aan Abraham; en hij gaf hem Sara zijn huisvrouw weder.","15":"En Abimelech zeide: Zie, mijn land is voor uw aangezicht; woon, waar het goed is in uw ogen.","16":"En tot Sara zeide hij: Zie, ik heb uw broeder duizend zilverlingen gegeven; zie, hij zij u een deksel der ogen, allen, die met u zijn, ja, bij allen, en wees geleerd.","17":"En Abraham bad tot God; en God genas Abimelech, en zijn huisvrouw, en zijn dienstmaagden, zodat zij baarden.","18":"Want de HEERE had al de baarmoeders van het huis van Abimelech ganselijk toegesloten, ter oorzake van Sara, Abrahams huisvrouw."},"KJV":{"1":"And Abraham journeyed from thence toward the south country, and dwelled between Kadesh and Shur, and sojourned in Gerar.","2":"And Abraham said of Sarah his wife, She *is* my sister: and Abimelech king of Gerar sent, and took Sarah.","3":"But God came to Abimelech in a dream by night, and said to him, Behold, thou *art but* a dead man, for the woman which thou hast taken; for she *is* a man's wife.","4":"But Abimelech had not come near her: and he said, Lord, wilt thou slay also a righteous nation?","5":"Said he not unto me, She *is* my sister? and she, even she herself said, He *is* my brother: in the integrity of my heart and innocency of my hands have I done","6":"And God said unto him in a dream, Yea, I know that thou didst this in the integrity of thy heart; for I also withheld thee from sinning against me: therefore suffered I thee not to touch","7":"Now therefore restore the man *his* wife; for he *is* a prophet, and he shall pray for thee, and thou shalt live: and if thou restore *her* not, know thou that thou shalt surely die,","8":"Therefore Abimelech rose early in the morning, and called all his servants, and told all these things in their ears: and the men were sore afraid.","9":"Then Abimelech called Abraham, and said unto him, What hast thou done unto us? and what have I offended thee, that thou hast brought on me and on my kingdom a great sin? thou hast done deeds unto me that ought not to be done.","10":"And Abimelech said unto Abraham, What sawest thou, that thou hast done this thing?","11":"And Abraham said, Because I thought, Surely the fear of God *is* not in this place; and they will slay me for my wife's sake.","12":"And yet indeed *she is* my sister; she *is* the daughter of my father, but not the daughter of my mother; and she became my wife.","13":"And it came to pass, when God caused me to wander from my father's house, that I said unto her, This *is* thy kindness which thou shalt shew unto me; at every place whither we shall come, say of me, He *is* my brother.","14":"And Abimelech took sheep, and oxen, and menservants, and womenservants, and gave *them* unto Abraham, and restored him Sarah his wife.","15":"And Abimelech said, Behold, my land *is* before thee: dwell where it pleaseth","16":"And unto Sarah he said, Behold, I have given thy brother a thousand *pieces* of silver: behold, he *is* to thee a covering of the eyes, unto all that *are* with thee, and with all *other*: thus she was reproved.","17":"So Abraham prayed unto God: and God healed Abimelech, and his wife, and his maidservants; and they bare","18":"For the LORD had fast closed up all the wombs of the house of Abimelech, because of Sarah Abraham's wife."}},"tsk":{"1":[{"kopje":"vandaar","refs":["Gen 13:1","Gen 18:1","Gen 24:62"]},{"kopje":"Kades","refs":["Gen 14:7","Gen 16:1","Gen 16:7","Gen 16:14","Num 13:26","Num 20:16","Deut 1:19","Deut 32:51","1 Sam 15:7","Ps 29:8"]},{"kopje":"Gerar","refs":["Gen 10:19","Gen 26:26","Gen 10:19","Gen 26:1","Gen 26:6","Gen 26:20","Gen 26:26","2 Kron 14:13","2 Kron 14:14"]}],"2":[{"kopje":"gezegd","refs":["Gen 12:11-13","Gen 26:7","2 Kron 19:2","2 Kron 20:37","2 Kron 32:31","Spr 24:16","Pred 7:20","Gal 2:11","Gal 2:12","Ef 4:25","Kol 3:9"]},{"kopje":"Abimelech","refs":["Gen 12:15","Gen 26:1","Gen 26:16"]}],"3":[{"kopje":"een droom","refs":["Gen 28:12","Gen 31:24","Gen 37:5","Gen 37:9","Gen 40:8","Gen 41:1-36","Job 4:12","Job 4:13","Job 33:15","Matt 1:20","Matt 2:12","Matt 2:13","Matt 27:19"]},{"kopje":"dood","refs":["Gen 20:7","Ps 105:14","Ezech 33:14","Ezech 33:15","Jona 3:4"]}],"4":[{"kopje":"Doch","refs":["Gen 20:6","Gen 20:18"]},{"kopje":"zult","refs":["Gen 20:17","Gen 20:18","Gen 18:23-25","Gen 19:24","2 Sam 4:11","1 Kron 21:17"]}],"5":[{"kopje":"in oprechtheid","refs":["Joz 22:22","1 Kon 9:4","2 Kon 20:3","1 Kron 29:17","Ps 7:9","Ps 25:21","Ps 78:72","Spr 11:3","Spr 20:7","2 Kor 1:12","1 Tess 2:10","1 Tim 1:13"]},{"kopje":"en in reinheid","refs":["Job 33:9","Ps 24:4","Ps 26:6","Ps 73:13","Dan 6:23"]}],"6":[{"kopje":"belet","refs":["Gen 20:18","Gen 31:7","Gen 35:5","Ex 34:24","1 Sam 25:26","1 Sam 25:34","Ps 84:12","Spr 21:1","Hos 2:5","Hos 2:6"]},{"kopje":"zondigen","refs":["Gen 39:9","Lev 6:2","Ps 51:6","Ps 81:13","2 Tess 2:7","2 Tess 2:11"]},{"kopje":"aan te raken","refs":["Gen 3: 40\">Abimelech</span> in a <span class=\"wl wl-kjv\" data-code=\"H2472\">dream</span> by <span class=\"wl wl-kjv\" data-code=\"H3915\">night,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to him, Behold, thou art but a dead <span class=\"wl wl-kjv\" data-code=\"H4191\">man,</span> for the <span class=\"wl wl-kjv\" data-code=\"H802\">woman</span> which thou hast <span class=\"wl wl-kjv\" data-code=\"H3947\">taken;</span> for she is a <span class=\"wl wl-kjv\" data-code=\"H1167\">man's</span> wife.","4":"But <span class=\"wl wl-kjv\" data-code=\"H40\">Abimelech</span> had not come <span class=\"wl wl-kjv\" data-code=\"H7126\">near</span> her: and he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H136\">Lord,</span> wilt thou <span class=\"wl wl-kjv\" data-code=\"H2026\">slay</span> also a <span class=\"wl wl-kjv\" data-code=\"H6662\">righteous</span> nation?","5":"<span class=\"wl wl-kjv\" data-code=\"H559\">Said</span> he not unto me, <span class=\"wl wl-kjv\" data-code=\"H1931\">She</span> is my <span class=\"wl wl-kjv\" data-code=\"H269\">sister?</span> and <span class=\"wl wl-kjv\" data-code=\"H1931\">she,</span> <span class=\"wl wl-kjv\" data-code=\"H1571\">even</span> <span class=\"wl wl-kjv\" data-code=\"H1931\">she</span> herself <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> He is my <span class=\"wl wl-kjv\" data-code=\"H251\">brother:</span> in the <span class=\"wl wl-kjv\" data-code=\"H8537\">integrity</span> of my <span class=\"wl wl-kjv\" data-code=\"H3824\">heart</span> and <span class=\"wl wl-kjv\" data-code=\"H5356\">innocency</span> of my <span class=\"wl wl-kjv\" data-code=\"H3709\">hands</span> have I done","6":"And <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him in a <span class=\"wl wl-kjv\" data-code=\"H2472\">dream,</span> <span class=\"wl wl-kjv\" data-code=\"H1571\">Yea,</span> I <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> that thou <span class=\"wl wl-kjv\" data-code=\"H6213\">didst</span> this in the <span class=\"wl wl-kjv\" data-code=\"H8537\">integrity</span> of thy <span class=\"wl wl-kjv\" data-code=\"H3824\">heart;</span> for I also <span class=\"wl wl-kjv\" data-code=\"H2820\">withheld</span> thee from <span class=\"wl wl-kjv\" data-code=\"H2398\">sinning</span> against me: therefore <span class=\"wl wl-kjv\" data-code=\"H5414\">suffered</span> I thee not to touch","7":"Now therefore <span class=\"wl wl-kjv\" data-code=\"H7725\">restore</span> the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> his <span class=\"wl wl-kjv\" data-code=\"H802\">wife;</span> for he is a <span class=\"wl wl-kjv\" data-code=\"H5030\">prophet,</span> and he shall <span class=\"wl wl-kjv\" data-code=\"H6419\">pray</span> for <span class=\"wl wl-kjv\" data-code=\"H1157\">thee,</span> and thou shalt <span class=\"wl wl-kjv\" data-code=\"H2421\">live:</span> and if thou <span class=\"wl wl-kjv\" data-code=\"H7725\">restore</span> her not, <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> thou that thou shalt <span class=\"wl wl-kjv\" data-code=\"H4191\">surely</span> die,","8":"Therefore <span class=\"wl wl-kjv\" data-code=\"H40\">Abimelech</span> rose <span class=\"wl wl-kjv\" data-code=\"H7925\">early</span> in the <span class=\"wl wl-kjv\" data-code=\"H1242\">morning,</span> and <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> all his <span class=\"wl wl-kjv\" data-code=\"H5650\">servants,</span> and <span class=\"wl wl-kjv\" data-code=\"H1696\">told</span> all these <span class=\"wl wl-kjv\" data-code=\"H1697\">things</span> in their <span class=\"wl wl-kjv\" data-code=\"H241\">ears:</span> and the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> were <span class=\"wl wl-kjv\" data-code=\"H3966\">sore</span> afraid.","9":"Then <span class=\"wl wl-kjv\" data-code=\"H40\">Abimelech</span> <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, What hast thou <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> unto us? and what have I <span class=\"wl wl-kjv\" data-code=\"H2398\">offended</span> thee, that thou hast <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> on me and on my <span class=\"wl wl-kjv\" data-code=\"H4467\">kingdom</span> a <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H2401\">sin?</span> thou hast <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> <span class=\"wl wl-kjv\" data-code=\"H4639\">deeds</span> unto me that ought not to be done.","10":"And <span class=\"wl wl-kjv\" data-code=\"H40\">Abimelech</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham,</span> <span class=\"wl wl-kjv\" data-code=\"H4100\">What</span> sawest <span class=\"wl wl-kjv\" data-code=\"H7200\">thou,</span> that thou hast <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> this thing?","11":"And <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Because I <span class=\"wl wl-kjv\" data-code=\"H559\">thought,</span> <span class=\"wl wl-kjv\" data-code=\"H7535\">Surely</span> the <span class=\"wl wl-kjv\" data-code=\"H3374\">fear</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> is not in this <span class=\"wl wl-kjv\" data-code=\"H4725\">place;</span> and they will slay <span class=\"wl wl-kjv\" data-code=\"H2026\">me</span> for my <span class=\"wl wl-kjv\" data-code=\"H802\">wife's</span> sake.","12":"And yet <span class=\"wl wl-kjv\" data-code=\"H546\">indeed</span> she is my <span class=\"wl wl-kjv\" data-code=\"H269\">sister;</span> she is the <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> of my <span class=\"wl wl-kjv\" data-code=\"H1\">father,</span> but not the <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> of my <span class=\"wl wl-kjv\" data-code=\"H517\">mother;</span> and she became my wife.","13":"And it came to pass, when <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> caused me to <span class=\"wl wl-kjv\" data-code=\"H8582\">wander</span> from my <span class=\"wl wl-kjv\" data-code=\"H1\">father's</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> that I <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto her, This is thy <span class=\"wl wl-kjv\" data-code=\"H2617\">kindness</span> which thou shalt <span class=\"wl wl-kjv\" data-code=\"H6213\">shew</span> unto me; at every <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> whither we shall <span class=\"wl wl-kjv\" data-code=\"H935\">come,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> of me, He is my brother.","14":"And <span class=\"wl wl-kjv\" data-code=\"H40\">Abimelech</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> <span class=\"wl wl-kjv\" data-code=\"H6629\">sheep,</span> and <span class=\"wl wl-kjv\" data-code=\"H1241\">oxen,</span> and <span class=\"wl wl-kjv\" data-code=\"H5650\">menservants,</span> and <span class=\"wl wl-kjv\" data-code=\"H8198\">womenservants,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> them unto <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham,</span> and <span class=\"wl wl-kjv\" data-code=\"H7725\">restored</span> him <span class=\"wl wl-kjv\" data-code=\"H8283\">Sarah</span> his wife.","15":"And <span class=\"wl wl-kjv\" data-code=\"H40\">Abimelech</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Behold, my <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> is before <span class=\"wl wl-kjv\" data-code=\"H6440\">thee:</span> <span class=\"wl wl-kjv\" data-code=\"H3427\">dwell</span> where it <span class=\"wl wl-kjv\" data-code=\"H2896\">pleaseth</span>","16":"And unto <span class=\"wl wl-kjv\" data-code=\"H8283\">Sarah</span> he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Behold, I have <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> thy <span class=\"wl wl-kjv\" data-code=\"H251\">brother</span> a <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> pieces of <span class=\"wl wl-kjv\" data-code=\"H3701\">silver:</span> behold, he is to thee a <span class=\"wl wl-kjv\" data-code=\"H3682\">covering</span> of the <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes,</span> unto all that are with thee, and with all other: thus she was reproved.","17":"So <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham</span> <span class=\"wl wl-kjv\" data-code=\"H6419\">prayed</span> unto <span class=\"wl wl-kjv\" data-code=\"H430\">God:</span> and <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H7495\">healed</span> <span class=\"wl wl-kjv\" data-code=\"H40\">Abimelech,</span> and his <span class=\"wl wl-kjv\" data-code=\"H802\">wife,</span> and his <span class=\"wl wl-kjv\" data-code=\"H519\">maidservants;</span> and they bare","18":"For the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> had <span class=\"wl wl-kjv\" data-code=\"H6113\">fast</span> closed <span class=\"wl wl-kjv\" data-code=\"H6113\">up</span> all the <span class=\"wl wl-kjv\" data-code=\"H7358\">wombs</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H40\">Abimelech,</span> <span class=\"wl wl-kjv\" data-code=\"H1697\">because</span> of <span class=\"wl wl-kjv\" data-code=\"H8283\">Sarah</span> <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham's</span> wife."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"van daar","tekst":"Te weten, van de eikenbossen, Mamre, bij Hebron. Zie Gen 13:18, en Gen 14:13 en Gen 18:1."},{"catchword":"naar het","tekst":"Hebron en Mamre waren wel in het zuidelijk einde van Palestina gelegen, maar Abraham is nog meer zuidwaarts getrokken, om redenen die de Heilige Schrift niet meldt."},{"catchword":"Kades","tekst":"Zie boven Gen 14:7."},{"catchword":"Sur;","tekst":"Zie boven Gen 16:7."},{"catchword":"Gerar","tekst":"Een stad, gelegen in het zuiden van Kanaän, niet ver van Berseba en Ziklag; zie boven Gen 10:19, onder Gen 26:1, en 2Ch 14:13."}],"2":[{"catchword":"gezegd","tekst":"Te weten, uit gelijke vrees, als hem ook tevoren toen hij naar Egypte reisde, overkomen was. Zie boven Gen 11:29, en Gen 12:13, en in dit hoofdst. vs.12."},{"catchword":"Abimélech,","tekst":"Men meent dat deze naam den koningen van dat land gemeen is geweest, gelijk de naam Faraö in Egypte. Zie boven Gen 12:15, verg. onder Gen 26:1; Psa 34:1."}],"3":[{"catchword":"in een","tekst":"God heeft in voorgaande tijden zich geopenbaard door dromen, niet alleen den zijnen, maar ook aan degenen, die vreemd van zijn volk waren, en dat ten beste van de zijnen. Zie onder Gen 28:12, en Gen 31:24, en Gen 40:8, en Gen 41:1; Dan 2:1, en Dan 4:5."},{"catchword":"gij zijt","tekst":"Anders, gij gaat sterven; dat is, gij zult straks sterven, zo gij deze vrouw niet terstond ongeschonden wedergeeft. Verg. onder vs.7, en zie deze manier van spreken onder Gen 30:1, en Gen 48:21, en Gen 50:24."}],"4":[{"catchword":"genaderd;","tekst":"Dat is, hij had haar niet beslapen. Deze manier van spreken komt overeen met een vrouw bekennen, boven Gen 4:1; tot een vrouw ingaan, boven Gen 6:4; of een vrouw aanroeren, Pro 6:29; 1Co 7:1, en onder vs.6. Versta, dat hij door God belet was door ziekte. Zie onder vs.6, 17."},{"catchword":"rechtvaardig","tekst":"Dat is, onschuldig en onnozel in deze zaak. Verg. 2Sa 4:11."},{"catchword":"volk","tekst":"Dat is, niet alleen mijn huisgezin, gelijk vs.17, maar ook de andere onderdanen, gelijk vs.9."}],"5":[{"catchword":"In","tekst":"Dat is, hierin is mijn hart zuiver van een overspelig voornemen, en mijn lichaam van onkuische daad. Zo wordt de // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

function plaatsPopup(el, html) {
  popup.innerHTML = html;

  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');

});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);

function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}

          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
