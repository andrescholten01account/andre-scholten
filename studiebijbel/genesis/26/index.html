, naast de eerste honger, die er in de dagen van Abraham geweest was; daarom ging Izak naar Abimelech, de koning van de Filistijnen, naar Gerar.","2":"En de HEERE verscheen hem en zei: Trek niet naar Egypte; woon in het land dat Ik u zeggen zal;","3":"Woon als vreemdeling in dat land, en Ik zal met u zijn, en zal u zegenen; want aan u en uw nageslacht zal Ik al deze landen geven, en Ik zal de eed bevestigen die Ik Abraham, uw vader, gezworen heb.","4":"En Ik zal uw nageslacht vermenigvuldigen als de sterren van de hemel, en zal aan uw nageslacht al deze landen geven; en in uw nageslacht zullen alle volken van de aarde gezegend worden,","5":"omdat Abraham Mijn stem gehoorzaam is geweest, en Mijn bevel heeft onderhouden, Mijn geboden, Mijn inzettingen en Mijn wetten.","6":"Zo woonde Izak te Gerar.","7":"En toen de mannen van die plaats hem naar zijn vrouw vroegen, zei hij: Zij is mijn zuster; want hij was bang om te zeggen: mijn vrouw; want, dacht hij, misschien doden de mannen van deze plaats mij om Rebekka, want zij was mooi om te zien.","8":"En het gebeurde, toen hij daar al lange tijd geweest was, dat Abimelech, de koning van de Filistijnen, uit het venster keek, en hij zag dat Izak met Rebekka, zijn vrouw, aan het vrijen was.","9":"Toen riep Abimelech Izak, en zei: Zeker, zie, zij is uw vrouw! Hoe kunt u dan gezegd hebben: Zij is mijn zuster? En Izak zei tegen hem: Want ik zei: Anders zou ik misschien om harentwil moeten sterven.","10":"En Abimelech zei: Wat hebt u ons aangedaan? Bijna had iemand van dit volk bij uw vrouw gelegen, zodat u een schuld over ons zou hebben gebracht.","11":"En Abimelech gebood het hele volk: Wie deze man of zijn vrouw aanraakt, zal zeker gedood worden!","12":"En Izak zaaide in dat land, en hij oogstte in datzelfde jaar honderd maten; want de HEERE zegende hem.","13":"En die man werd groot, ja, hij bleef groter worden, totdat hij zeer groot geworden was.","14":"En hij had bezit aan schapen, en bezit aan runderen, en een groot gezin; zodat de Filistijnen hem benijdden.","15":"En alle putten die de knechten van zijn vader in de dagen van zijn vader Abraham gegraven hadden, die stopten de Filistijnen dicht, en vulden ze met aarde.","16":"Ook zei Abimelech tegen Izak: Trek weg van ons; want u bent veel machtiger geworden dan wij.","17":"Toen ging Izak daarvandaan, en hij legerde zich in het dal van Gerar, en woonde daar.","18":"Toen Izak nu teruggekeerd was, groef hij de waterputten weer open die zij in de tijd van Abraham, zijn vader, gegraven hadden, en die de Filistijnen na Abrahams dood hadden dichtgestopt; en hij noemde ze bij de namen waarmee zijn vader ze genoemd had.","19":"De knechten van Izak dan groeven in dat dal, en zij vonden daar een put met levend water.","20":"En de herders van Gerar twistten met Izaks herders, en zeiden: Dit water hoort ons toe! Daarom noemde hij die put Esek, omdat zij met hem gekeven hadden.","21":"Toen groeven zij een andere put, en daar twistten zij ook over; daarom noemde hij die Sitna.","22":"En hij brak daarvandaan op, en groef een andere put, en daarover twistten zij niet; daarom noemde hij die Rehoboth, en zei: Want nu heeft de HEERE ons ruimte gemaakt, en wij zijn vruchtbaar geworden in dit land.","23":"Daarna trok hij daarvandaan op naar Berseba.","24":"En de HEERE verscheen hem diezelfde nacht, en zei: Ik ben de God van Abraham, uw vader; wees niet bang; want Ik ben met u; en Ik zal u zegenen, en uw nageslacht vermenigvuldigen, omwille van Abraham, Mijn knecht.","25":"Toen bouwde hij daar een altaar, en riep de Naam van de HEERE aan. En hij sloeg daar zijn tent op; en Izaks knechten groeven daar een put.","26":"En Abimelech trok naar hem toe vanuit Gerar, met Ahuzzat, zijn vriend, en Pichol, zijn legeraanvoerder.","27":"En Izak zei tegen hen: Waarom bent u naar mij toe gekomen, terwijl u mij haat, en mij van u weggezonden hebt?","28":"En zij zeiden: Wij hebben duidelijk gezien dat de HEERE met u is; daarom hebben wij gezegd: Laat er toch een eed zijn tussen ons, tussen ons en u, en laat ons een verbond met u sluiten:","29":"Als u ons geen kwaad doet, zoals wij u niet aangeraakt hebben, en zoals wij u alleen maar goed gedaan hebben, en u in vrede hebben laten vertrekken! U bent nu de gezegende van de HEERE!","30":"Toen maakte hij voor hen een maaltijd, en zij aten en dronken.","31":"En zij stonden 's morgens vroeg op, en zwoeren elkaar een eed; daarna liet Izak hen gaan, en zij vertrokken van hem in vrede.","32":"En het gebeurde diezelfde dag dat Izaks knechten kwamen, en hem vertelden over de put die zij gegraven hadden, en zij zeiden hem: Wij hebben water gevonden.","33":"En hij noemde hem Seba; daarom is de naam van die stad Berseba, tot op deze dag.","34":"Toen Ezau veertig jaar oud was, nam hij tot vrouw Judith, de dochter van Beëri, de Hethiet, en Basmath, de dochter van Elon, de Hethiet.","35":"En dezen waren voor Izak en Rebekka een bitterheid van de geest."},"SV":{"1":"En er was honger in dat land, behalve den eersten honger, die in de dagen van Abraham geweest was; daarom toog Izak tot Abimelech, de koning der Filistijnen, naar Gerar.","2":"En de HEERE verscheen hem en zeide: Trek niet af naar Egypte; woon in het land, dat Ik u aanzeggen zal;","3":"Woon als vreemdeling in dat land, en Ik zal met u zijn, en zal u zegenen; want aan u en uw zaad zal Ik al deze landen geven, en Ik zal den eed bevestigen, dien Ik Abraham uw vader gezworen heb.","4":"En Ik zal uw zaad vermenigvuldigen, als de sterren des hemels, en zal aan uw zaad al deze landen geven; en in uw zaad zullen gezegend worden alle volken der aarde,","5":"Daarom dat Abraham Mijn stem gehoorzaam geweest is, en heeft onderhouden Mijn bevel, Mijn geboden, Mijn inzettingen en Mijn wetten.","6":"Alzo woonde Izak te Gerar.","7":"En als de mannen van die plaats hem vraagden van zijn huisvrouw, zeide hij: Zij *is* mijn zuster; want hij vreesde te zeggen, mijn huisvrouw; opdat mij misschien, *zeide* *hij* de mannen dezer plaats niet doden, om Rebekka; want zij *was* schoon van aangezicht.","8":"En het geschiedde, als hij een langen tijd daar geweest was, dat Abimelech, de koning der Filistijnen, ten venster uitkeek, en hij zag, dat, ziet, Izak was jokkende met Rebekka zijn huisvrouw.","9":"Toen riep Abimelech Izak, en zeide: Voorwaar, zie, zij *is* uw huisvrouw! hoe hebt gij dan gezegd: Zij *is* mijn zuster? En Izak zeide tot hem: Want ik zeide: Dat ik niet misschien om harentwil sterve.","10":"En Abimelech zeide: Wat *is* dit, *dat* gij ons gedaan hebt? Lichtelijk had een van dit volk bij uw huisvrouw gelegen, zodat gij een schuld over ons zoudt gebracht hebben.","11":"En Abimelech gebood het ganse volk, zeggende: Zo wie deze man of zijn huisvrouw aanroert, zal voorzeker gedood worden!","12":"En Izak zaaide in datzelve land, en hij vond in datzelve jaar honderd maten; want de HEERE zegende hem.","13":"En die man werd groot, ja, hij werd doorgaans groter, totdat hij zeer groot geworden was.","14":"En hij had bezitting van schapen, en bezitting van runderen, en groot gezin; zodat hem de Filistijnen benijdden.","15":"En al de putten, die de knechten van zijn vader, in de dagen van zijn vader Abraham, gegraven hadden, die stopten de Filistijnen, en vulden dezelve met aarde.","16":"Ook zeide Abimelech tot Izak: Trek van ons; want gij zijt veel machtiger geworden, dan wij.","17":"Toen toog Izak van daar, en hij legerde zich in het dal van Gerar, en woonde aldaar.","18":"Als nu Izak wedergekeerd was, groef hij die waterputten op, die zij ten tijde van Abraham, zijn vader, gegraven, en die de Filistijnen na Abrahams dood toegestopt hadden; en hij noemde derzelver namen naar de namen, waarmede zijn vader die genoemd had.","19":"De knechten van Izak dan groeven in dat dal, en zij vonden aldaar een put van levend water.","20":"En de herders van Gerar twistten met Izaks herders, zeggende: Dit water hoort ons toe! Daarom noemde hij den naam van dien put Esek, omdat zij met hem gekeven hadden.","21":"Toen groeven zij een anderen put, en daar twistten zij ook over; daarom noemde hij deszelfs naam Sitna.","22":"En hij brak op van daar, en groef een anderen put, en zij twistten over dien niet; daarom noemde hij deszelfs naam Rehoboth, en zeide: Want nu heeft ons de HEERE ruimte gemaakt, en wij zijn gewassen in dit land.","23":"Daarna toog hij van daar op naar Ber-seba.","24":"En de HEERE verscheen hem in denzelven nacht, en zeide: Ik *ben* de God van Abraham, uw vader; vrees niet; want Ik *ben* met u; en Ik zal u zegenen, en uw zaad vermenigvuldigen, om Abrahams, Mijns knechts, wil.","25":"Toen bouwde hij daar een altaar, en riep den Naam des HEEREN aan. En hij sloeg aldaar zijn tent op; en Izaks knechten groeven daar een put.","26":"En Abimelech trok tot hem van Gerar, met Ahuzzat, zijn vriend, en Pichol, zijn krijgsoverste.","27":"En Izak zeide tot hen: Waarom zijt gij tot mij gekomen, daar gij mij haat, en hebt mij van u weggezonden?","28":"En zij zeiden: Wij hebben merkelijk gezien, dat de HEERE met u is; daarom hebben wij gezegd: Laat toch een eed tussen ons zijn, tussen ons en tussen u, en laat ons een verbond met u maken:","29":"Zo gij bij ons kwaad doet, gelijk als wij u niet aangeroerd hebben, en gelijk als wij bij u alleenlijk goed gedaan hebben, en hebben u in vrede laten trekken! Gij *zijt* nu de gezegende des HEEREN!","30":"Toen maakte hij hun een maaltijd, en zij aten en dronken.","31":"En zij stonden des morgens vroeg op, en zwoeren de een den ander; daarna liet Izak hen gaan, en zij togen van hem in vrede.","32":"En het geschiedde ten zelfden dage, dat Izaks knechten kwamen, en boodschapten hem van de zaak des puts, dien zij gegraven hadden, en zij zeiden hem: Wij hebben water gevonden.","33":"En hij noemde denzelven Seba; daarom is de naam dier stad Ber-seba, tot op dezen dag.","34":"Als nu Ezau veertig jaren oud was, nam hij tot een vrouw Judith, de dochter van Beëri, den Hethiet, en Basmath, de dochter van Elon, den Hethiet.","35":"En deze waren voor Izak en Rebekka een bitterheid des geestes."},"KJV":{"1":"And there was a famine in the land, beside the first famine that was in the days of Abraham. And Isaac went unto Abimelech king of the Philistines unto Gerar.","2":"And the LORD appeared unto him, and said, Go not down into Egypt; dwell in the land which I shall tell","3":"Sojourn in this land, and I will be with thee, and will bless thee; for unto thee, and unto thy seed, I will give all these countries, and I will perform the oath which I sware unto Abraham thy father;","4":"And I will make thy seed to multiply as the stars of heaven, and will give unto thy seed all these countries; and in thy seed shall all the nations of the earth be blessed;","5":"Because that Abraham obeyed my voice, and kept my charge, my commandments, my statutes, and my laws.","6":"And Isaac dwelt in Gerar:","7":"And the men of the place asked *him* of his wife; and he said, She *is* my sister: for he feared to say, *She is* my wife; lest, *said he*, the men of the place should kill me for Rebekah; because she *was* fair to look upon.","8":"And it came to pass, when he had been there a long time, that Abimelech king of the Philistines looked out at a window, and saw, and, behold, Isaac *was* sporting with Rebekah his wife.","9":"And Abimelech called Isaac, and said, Behold, of a surety she *is* thy wife: and how saidst thou, She *is* my sister? And Isaac said unto him, Because I said, Lest I die","10":"And Abimelech said, What *is* this thou hast done unto us? one of the people might lightly have lien with thy wife, and thou shouldest have brought guiltiness","11":"And Abimelech charged all *his* people, saying, He that toucheth this man or his wife shall surely be put to death.","12":"Then Isaac sowed in that land, and received in the same year an hundredfold: and the LORD blessed","13":"And the man waxed great, and went forward, and grew until he became very great:","14":"For he had possession of flocks, and possession of herds, and great store of servants: and the Philistines envied","15":"For all the wells which his father's servants had digged in the days of Abraham his father, the Philistines had stopped them, and filled them with earth.","16":"And Abimelech said unto Isaac, Go from us; for thou art much mightier","17":"And Isaac departed thence, and pitched his tent in the valley of Gerar, and dwelt there.","18":"And Isaac digged again the wells of water, which they had digged in the days of Abraham his father; for the Philistines had stopped them after the death of Abraham: and he called their names after the names by which his father had called","19":"And Isaac's servants digged in the valley, and found there a well of springing water.","20":"And the herdmen of Gerar did strive with Isaac's herdmen, saying, The water *is* ours: and he called the name of the well Esek; because they strove","21":"And they digged another well, and strove for that also: and he called the name of it Sitnah.","22":"And he removed from thence, and digged another well; and for that they strove not: and he called the name of it Rehoboth; and he said, For now the LORD hath made room for us, and we shall be fruitful in the land.","23":"And he went up from thence to Beersheba.","24":"And the LORD appeared unto him the same night, and said, I *am* the God of Abraham thy father: fear not, for I *am* with thee, and will bless thee, and multiply thy seed for my servant Abraham's","25":"And he builded an altar there, and called upon the name of the LORD, and pitched his tent there: and there Isaac's servants digged a well.","26":"Then Abimelech went to him from Gerar, and Ahuzzath one of his friends, and Phichol the chief captain of his army.","27":"And Isaac said unto them, Wherefore come ye to me, seeing ye hate me, and have sent me away","28":"And they said, We saw certainly that the LORD was with thee: and we said, Let there be now an oath betwixt us, *even* betwixt us and thee, and let us make a covenant","29":"That thou wilt do us no hurt,  wl-kjv\" data-code=\"H4714\">Egypt;</span> <span class=\"wl wl-kjv\" data-code=\"H7931\">dwell</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> which I shall tell","3":"<span class=\"wl wl-kjv\" data-code=\"H1481\">Sojourn</span> in this <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> and I will be with thee, and will <span class=\"wl wl-kjv\" data-code=\"H1288\">bless</span> thee; for unto thee, and unto thy <span class=\"wl wl-kjv\" data-code=\"H2233\">seed,</span> I will <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> all <span class=\"wl wl-kjv\" data-code=\"H411\">these</span> <span class=\"wl wl-kjv\" data-code=\"H776\">countries,</span> and I will <span class=\"wl wl-kjv\" data-code=\"H6965\">perform</span> the <span class=\"wl wl-kjv\" data-code=\"H7621\">oath</span> which I <span class=\"wl wl-kjv\" data-code=\"H7650\">sware</span> unto <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham</span> thy father;","4":"And I will <span class=\"wl wl-kjv\" data-code=\"H7235\">make</span> thy <span class=\"wl wl-kjv\" data-code=\"H2233\">seed</span> to <span class=\"wl wl-kjv\" data-code=\"H7235\">multiply</span> as the <span class=\"wl wl-kjv\" data-code=\"H3556\">stars</span> of <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven,</span> and will <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> unto thy <span class=\"wl wl-kjv\" data-code=\"H2233\">seed</span> all <span class=\"wl wl-kjv\" data-code=\"H411\">these</span> <span class=\"wl wl-kjv\" data-code=\"H776\">countries;</span> and in thy <span class=\"wl wl-kjv\" data-code=\"H2233\">seed</span> shall all the <span class=\"wl wl-kjv\" data-code=\"H1471\">nations</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> be blessed;","5":"<span class=\"wl wl-kjv\" data-code=\"H6118\">Because</span> that <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">obeyed</span> my <span class=\"wl wl-kjv\" data-code=\"H6963\">voice,</span> and <span class=\"wl wl-kjv\" data-code=\"H8104\">kept</span> my <span class=\"wl wl-kjv\" data-code=\"H4931\">charge,</span> my <span class=\"wl wl-kjv\" data-code=\"H4687\">commandments,</span> my <span class=\"wl wl-kjv\" data-code=\"H2708\">statutes,</span> and my laws.","6":"And <span class=\"wl wl-kjv\" data-code=\"H3327\">Isaac</span> <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelt</span> in Gerar:","7":"And the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> of the <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> <span class=\"wl wl-kjv\" data-code=\"H7592\">asked</span> him of his <span class=\"wl wl-kjv\" data-code=\"H802\">wife;</span> and he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> She is my <span class=\"wl wl-kjv\" data-code=\"H269\">sister:</span> for he <span class=\"wl wl-kjv\" data-code=\"H3372\">feared</span> to <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> She is my <span class=\"wl wl-kjv\" data-code=\"H802\">wife;</span> lest, said he, the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> of the <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> should <span class=\"wl wl-kjv\" data-code=\"H2026\">kill</span> me for <span class=\"wl wl-kjv\" data-code=\"H7259\">Rebekah;</span> because she was <span class=\"wl wl-kjv\" data-code=\"H2896\">fair</span> to look upon.","8":"And it came to pass, when he had been there a <span class=\"wl wl-kjv\" data-code=\"H748\">long</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">time,</span> that <span class=\"wl wl-kjv\" data-code=\"H40\">Abimelech</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines</span> looked <span class=\"wl wl-kjv\" data-code=\"H8259\">out</span> <span class=\"wl wl-kjv\" data-code=\"H1157\">at</span> a <span class=\"wl wl-kjv\" data-code=\"H2474\">window,</span> and <span class=\"wl wl-kjv\" data-code=\"H7200\">saw,</span> and, behold, <span class=\"wl wl-kjv\" data-code=\"H3327\">Isaac</span> was <span class=\"wl wl-kjv\" data-code=\"H6711\">sporting</span> with <span class=\"wl wl-kjv\" data-code=\"H7259\">Rebekah</span> his wife.","9":"And <span class=\"wl wl-kjv\" data-code=\"H40\">Abimelech</span> <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> <span class=\"wl wl-kjv\" data-code=\"H3327\">Isaac,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Behold, of a <span class=\"wl wl-kjv\" data-code=\"H389\">surety</span> she is thy <span class=\"wl wl-kjv\" data-code=\"H802\">wife:</span> and how <span class=\"wl wl-kjv\" data-code=\"H559\">saidst</span> thou, She is my <span class=\"wl wl-kjv\" data-code=\"H269\">sister?</span> And <span class=\"wl wl-kjv\" data-code=\"H3327\">Isaac</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, Because I <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Lest I die","10":"And <span class=\"wl wl-kjv\" data-code=\"H40\">Abimelech</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> What is this thou hast <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> unto us? <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> of the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> might <span class=\"wl wl-kjv\" data-code=\"H4592\">lightly</span> have <span class=\"wl wl-kjv\" data-code=\"H7901\">lien</span> with thy <span class=\"wl wl-kjv\" data-code=\"H802\">wife,</span> and thou shouldest have <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> guiltiness","11":"And <span class=\"wl wl-kjv\" data-code=\"H40\">Abimelech</span> <span class=\"wl wl-kjv\" data-code=\"H6680\">charged</span> all his <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> He that <span class=\"wl wl-kjv\" data-code=\"H5060\">toucheth</span> this <span class=\"wl wl-kjv\" data-code=\"H376\">man</s /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
