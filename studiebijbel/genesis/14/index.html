agen van Amrafel, de koning van Sinear, van Arioch, de koning van Ellasar, van Kedor-laomer, de koning van Elam, en van Tideal, de koning van de volken;","2":"dat zij oorlog voerden met Bera, koning van Sodom, en met Birsa, koning van Gomorra, Sinab, koning van Adama, en Semeber, koning van Zeboim, en de koning van Bela, dat is Zoar.","3":"Deze allen voegden zich samen in het dal Siddim, dat is de Zoutzee.","4":"Twaalf jaar hadden zij Kedor-laomer gediend; maar in het dertiende jaar vielen zij af.","5":"Zo kwam Kedor-laomer in het veertiende jaar, en de koningen die met hem waren, en versloegen de Refaieten in Asteroth-karnaim, en de Zuzieten in Ham, en de Emieten in Schave-kiriathaim;","6":"en de Horieten op hun gebergte Seir, tot aan het effen veld van Paran, dat aan de woestijn is.","7":"Daarna keerden zij terug en kwamen bij En-mispat, dat is Kades, en versloegen heel het land van de Amalekieten, en ook de Amoriet, die te Hazezon-thamar woonde.","8":"Toen trok de koning van Sodom uit, en de koning van Gomorra, en de koning van Adama, en de koning van Zeboim, en de koning van Bela, dat is Zoar; en zij stelden tegen hen slagorden op in het dal Siddim,","9":"tegen Kedor-laomer, de koning van Elam, en Tideal, de koning van de volken, en Amrafel, de koning van Sinear, en Arioch, de koning van Ellasar; vier koningen tegen vijf.","10":"Het dal Siddim nu was vol lijmputten; en de koningen van Sodom en Gomorra vluchtten en vielen daar; en de overgeblevenen vluchtten naar het gebergte.","11":"En zij namen al de bezittingen van Sodom en Gomorra, en al hun voedsel, en trokken weg.","12":"Ook namen zij Lot, de zoon van Abrams broeder, en zijn bezittingen, en trokken weg; want hij woonde in Sodom.","13":"Toen kwam er iemand die ontkomen was, en bracht dat over aan Abram, de Hebreeër, die woonde bij de eikenbossen van Mamre, de Amoriet, broeder van Eskol, en broeder van Aner, die Abrams bondgenoten waren.","14":"Toen Abram hoorde dat zijn broeder gevangen was genomen, wapende hij zijn geoefende mannen, geboren in zijn eigen huis, driehonderd achttien, en hij achtervolgde hen tot Dan toe.","15":"En hij verdeelde zich tegen hen 's nachts, hij en zijn knechten, en versloeg hen; en hij achtervolgde hen tot Hoba toe, dat ten noorden van Damaskus ligt.","16":"En hij bracht alle bezittingen terug, en ook Lot, zijn broeder, en diens bezittingen bracht hij terug, en ook de vrouwen en het volk.","17":"En de koning van Sodom trok uit, hem tegemoet (nadat hij teruggekeerd was van het verslaan van Kedor-laomer en de koningen die met hem waren), naar het dal Schave, dat is het dal van de koning.","18":"En Melchizedek, koning van Salem, bracht brood en wijn; en hij was een priester van de allerhoogste God.","19":"En hij zegende hem en zei: Gezegend zij Abram door God, de Allerhoogste, Die hemel en aarde bezit!","20":"En gezegend zij de allerhoogste God, Die uw vijanden in uw hand overgeleverd heeft! En hij gaf hem het tiende deel van alles.","21":"En de koning van Sodom zei tegen Abram: Geef mij de mensen; maar neem de bezittingen voor uzelf.","22":"Doch Abram zei tegen de koning van Sodom: Ik heb mijn hand opgeheven tot de HEERE, de allerhoogste God, Die hemel en aarde bezit;","23":"dat ik van een draad tot een schoenriem toe, ja, dat ik van alles wat het uwe is, niets zal nemen! Opdat u niet zegt: Ik heb Abram rijk gemaakt!","24":"Buiten mij om; alleen wat de jongemannen verteerd hebben, en het deel van deze mannen die met mij meegetrokken zijn, Aner, Eskol en Mamre, laat die hun deel nemen!"},"SV":{"1":"En het geschiedde in de dagen van Amrafel, den koning van Sinear, van Arioch, den koning van Ellasar, van Kedor-laomer, den koning van Elam, en van Tideal, den koning der volken;","2":"Dat zij krijg voerden met Bera, koning van Sodom, en met Birsa, koning van Gomorra, Sinab, koning van Adama, en Semeber, koning van Zeboim, en den koning van Bela, dat *is* Zoar.","3":"Deze allen voegden zich samen in het dal Siddim, dat *is* de Zoutzee.","4":"Twaalf jaren hadden zij Kedor-laomer gediend; maar in het dertiende jaar vielen zij af.","5":"Zo kwam Kedor-laomer in het veertiende jaar, en de koningen, die met hem waren, en sloegen de Refaieten in Asteroth-karnaim, en de Zuzieten in Ham, en de Emieten in Schave-kiriathaim;","6":"En de Horieten op hun gebergte Seir, tot aan het effen veld van Paran, hetwelk aan de woestijn *is*.","7":"Daarna keerden zij wederom, en kwamen tot En-mispat, dat *is* Kades, en sloegen al het land der Amalekieten, en ook den Amoriet, die te Hazezon-thamar woonde.","8":"Toen toog de koning van Sodom uit, en de koning van Gomorra, en de koning van Adama, en de koning van Zeboim, en de koning van Bela, dat is Zoar; en zij stelden tegen hen slagorden in het dal Siddim,","9":"Tegen Kedor-laomer, den koning van Elam, en Tideal, den koning der volken, en Amrafel, den koning van Sinear, en Arioch, den koning van Ellasar; vier koningen tegen vijf.","10":"Het dal nu van Siddim *was* vol lijmputten; en de koningen van Sodom en Gomorra vluchtten, en vielen aldaar; en de overgeblevenen vluchtten naar het gebergte.","11":"En zij namen al de have van Sodom en Gomorra, en al hun spijze, en trokken weg.","12":"Ook namen zij Lot, den zoon van Abrams broeder, en zijn have, en trokken weg; want hij woonde in Sodom.","13":"Toen kwam er een, die ontkomen was, en boodschapte het aan Abram, den Hebreër, die woonachtig was aan de eikenbossen van Mamre, den Amoriet, broeder van Eskol, en broeder van Aner, welke Abrams bondgenoten *waren*.","14":"Als Abram hoorde, dat zijn broeder gevangen was, zo wapende hij zijn onderwezenen, de ingeborenen van zijn huis, driehonderd en achttien, en hij jaagde hen na tot Dan toe.","15":"En hij verdeelde zich tegen hen des nachts, hij en zijn knechten, en sloeg ze; en hij jaagde hen na tot Hoba toe, hetwelk is ter linkerhand van Damaskus.","16":"En hij bracht alle have weder, en ook Lot zijn broeder en deszelfs have bracht hij weder, als ook de vrouwen, en het volk.","17":"En de koning van Sodom toog uit, hem tegemoet ( nadat hij wedergekeerd was van het slaan van Kedor-laomer, en van de koningen, die met hem *waren*), tot het dal Schave, dat is, het dal des konings.","18":"En Melchizedek, koning van Salem, bracht voort brood en wijn; en hij *was* een priester des allerhoogsten Gods.","19":"En hij zegende hem, en zeide: Gezegend zij Abram Gode, de Allerhoogste, Die hemel en aarde bezit!","20":"En gezegend zij de allerhoogste God, Die uw vijanden in uw hand geleverd heeft! En hij gaf hem de tiende van alles.","21":"En de koning van Sodom zeide tot Abram: Geef mij de zielen; maar neem de have voor u.","22":"Doch Abram zeide tot den koning van Sodom: Ik heb mijn hand opgeheven tot den HEERE, den allerhoogsten God, Die hemel en aarde bezit;","23":"Zo ik van een draad aan tot een schoenriem toe, ja, zo ik van alles, dat het uwe is, *iets* neme! opdat gij niet zegt: Ik heb Abram rijk gemaakt!","24":"*Het* *zij* buiten mij; alleen wat de jongelingen verteerd hebben, en het deel dezer mannen, die met mij getogen zijn, Aner, Eskol en Mamre, laat die hun deel nemen!"},"KJV":{"1":"And it came to pass in the days of Amraphel king of Shinar, Arioch king of Ellasar, Chedorlaomer king of Elam, and Tidal king of nations;","2":"*That these* made war with Bera king of Sodom, and with Birsha king of Gomorrah, Shinab king of Admah, and Shemeber king of Zeboiim, and the king of Bela, which is Zoar.","3":"All these were joined together in the vale of Siddim, which is the salt sea.","4":"Twelve years they served Chedorlaomer, and in the thirteenth year they rebelled.","5":"And in the fourteenth year came Chedorlaomer, and the kings that *were* with him, and smote the Rephaims in Ashteroth Karnaim, and the Zuzims in Ham, and the Emims in Shaveh Kiriathaim,","6":"And the Horites in their mount Seir, unto Elparan, which *is* by the wilderness.","7":"And they returned, and came to Enmishpat, which *is* Kadesh, and smote all the country of the Amalekites, and also the Amorites, that dwelt in Hazezontamar.","8":"And there went out the king of Sodom, and the king of Gomorrah, and the king of Admah, and the king of Zeboiim, and the king of Bela (the same *is* Zoar;) and they joined battle with them in the vale of Siddim;","9":"With Chedorlaomer the king of Elam, and with Tidal king of nations, and Amraphel king of Shinar, and Arioch king of Ellasar; four kings with five.","10":"And the vale of Siddim *was full of* slimepits; and the kings of Sodom and Gomorrah fled, and fell there; and they that remained fled to the mountain.","11":"And they took all the goods of Sodom and Gomorrah, and all their victuals, and went their way.","12":"And they took Lot, Abram's brother's son, who dwelt in Sodom, and his goods, and departed.","13":"And there came one that had escaped, and told Abram the Hebrew; for he dwelt in the plain of Mamre the Amorite, brother of Eshcol, and brother of Aner: and these *were* confederate with Abram.","14":"And when Abram heard that his brother was taken captive, he armed his trained *servants*, born in his own house, three hundred and eighteen, and pursued *them* unto Dan.","15":"And he divided himself against them, he and his servants, by night, and smote them, and pursued them unto Hobah, which *is* on the left hand of Damascus.","16":"And he brought back all the goods, and also brought again his brother Lot, and his goods, and the women also, and the people.","17":"And the king of Sodom went out to meet him after his return from the slaughter of Chedorlaomer, and of the kings that *were* with him, at the valley of Shaveh, which *is* the king's dale.","18":"And Melchizedek king of Salem brought forth bread and wine: and he *was* the priest of the most high God.","19":"And he blessed him, and said, Blessed *be* Abram of the most high God, possessor of heaven and earth:","20":"And blessed be the most high God, which hath delivered thine enemies into thy hand. And he gave him tithes","21":"And the king of Sodom said unto Abram, Give me the persons, and take the goods","22":"And Abram said to the king of Sodom, I have lift up mine hand unto the LORD, the most high God, the possessor of heaven and earth,","23":"That I will not *take* from a thread even to a shoelatchet, and that I will not take any thing that *is* thine, lest thou shouldest say, I have made Abram rich:","24":"Save only that which the young men have eaten, and the portion of the men which went with me, Aner, Eshcol, and Mamre; let them take their portion."}},"tsk":{"1":[{"kopje":"Sinear","refs":["Gen 10:10","Gen 11:2","Jes 11:11","Dan 1:2","Zach 5:11"]},{"kopje":"Ellasar","refs":["Jes 37:12"]},{"kopje":"Elam","refs":["Gen 10:22","Jes 21:2","Jes 22:6","Jer 25:25","Jer 49:34-39","Ezech 32:24"]}],"2":[{"kopje":"Sodom","refs":["Gen 10:19","Gen 13:10","Gen 19:24","Jes 1:9","Jes 1:10"]},{"kopje":"Adama","refs":["Deut 29:23","Hos 11:8"]},{"kopje":"Zeboim","refs":["1 Sam 13:18","Neh 11:34"]},{"kopje":"Zoar","refs":["Gen 19:20-30","Deut 34:3","Jes 15:5","Jer 48:34"]}],"3":[{"kopje":"Zoutzee","refs":["Gen 19:24","Num 34:12","Deut 3:17","Joz 3:16","Ps 107:34"]}],"4":[{"kopje":"hadden zij gediend","refs":["Gen 9:25","Gen 9:26"]},{"kopje":"vielen zij af","refs":["Ezech 17:15"]}],"5":[{"kopje":"Refaieten","refs":["Gen 15:20","Deut 3:11","Deut 3:20","Deut 3:22","2 Sam 5:18","2 Sam 5:22","2 Sam 23:13","1 Kron 11:15","1 Kron 14:9","Jes 17:5"]},{"kopje":"Asteroth-karnaim","refs":["Deut 1:4","Joz 12:4","Joz 13:12","Joz 13:31"]},{"kopje":"Zuzieten","refs":["Deut 2:20-23","1 Kron 4:40","Ps 78:51","Ps 105:23","Ps 105:27","Ps 106:22"]},{"kopje":"Emieten","refs":["Deut 2:10","Deut 2:11"]},{"kopje":"Schave-kiriathaim","refs":["Joz 13:19","Jer 48:1","Jer 48:23"]}],"6":[{"kopje":"Horieten","refs":["Gen 36:8","Gen 36:20-30","Deut 2:12","Deut 2:22","1 Kron 1:38-42"]},{"kopje":"Paran","refs":["Gen 16:7","Gen 21:21","Num 12:16","Num 13:3","Hab 3:3"]}],"7":[{"kopje":"Kades","refs":["Gen 16:14","Gen 20:1","Num 20:1","Deut 1:19","Deut 1:46"]},{"kopje dus genoemd, omdat die landstreek [waarin veel zout- of brakke lijmputten waren, vs.10], geworden is tot een groten stinkenden poel, ook genoemd Lacus Asphaltites. Dat is, de Pek-, of Lijm-zee, als ook de Dode-zee, omdat daarin geen dier levend kon blijven."}],"4":[{"catchword":"gediend;","tekst":"Zijnde door hem door een voorgaanden krijg, zoals het schijnt, zover bemachtigd, dat zij hem tribuut moesten geven."},{"catchword":"in het","tekst":"Hebr. dertien jaren, dat is, dertiende jaar, en zo ook in het volgende vs. veertien, voor het veertiende."}],"5":[{"catchword":"de Refaïm","tekst":"Een volk, afkomstig van Kanaän. Zie onder Gen 15:20. Anders, Reuzen; men meent dat dezen zo genoemd zijn, om hun gezonde kracht en sterkte."},{"catchword":"in Asteroth-Karnáïm,","tekst":"Een stad over de Jordaan, ook alleen Asteroth genaamd: Deu 1:4; Jos 9:10, en Jos 13:31; haar toenaam is Karnaïm, welke zij schijnt te hebben van wege haar gelegenheid."},{"catchword":"de Emim","tekst":"Zeker volk, hetwelk men meent dat reuzen geweest zijn."},{"catchword":"Schave-Kiriatháïm","tekst":"Een stad van de Rubenieten, naderhand in Gilead gebouwd, eerst, zoals het schijnt, genaamd Schave. Zie onder vs.17; Num 32:17; Jos 13:19. Anders, in het effen land."}],"6":[{"catchword":"de Horieten","tekst":"Hebr. Chorieten, een volk, dat in Seïr woonde, gelijk ook Ezau, onder Gen 32:3, totdat de Edomieten of Ezaus nakomelingen hen van daar verdreven hebben, onder Gen 36:20; Deu 2:12, Deu 2:22."},{"catchword":"Paran,","tekst":"Dit is de naam van een stad, het gebergte en het omliggende land. Zie Num 13:3; Deu 33:2; 1Sa 25:1; Hab 3:3. Hiervan heeft de woestijn Paran haar naam; onder Gen 21:21; Num 10:12."}],"7":[{"catchword":"En-Mispat,","tekst":"Ten tijde van Mozes genoemd Kades, gelegen in de woestijn Sin. Zie Num 20:1, Num 20:14, Num 20:16, Num 20:22, onderscheiden, naar eniger gevoelen, van Kades Barnea; waarvan te zien is Num 32:8; Deu 1:19."},{"catchword":"land der","tekst":"Dat is, de inwoners van het land."},{"catchword":"Amalekieten,","tekst":"Een volk, afkomstig van Ezau, die dit land daarna bewoond hebben. Zie onder Gen 36:12."},{"catchword":"Emorieter,","tekst":"Een der volken afkomstig van Kanaän; zie boven Gen 10:16."},{"catchword":"Hárezon-Thamar","tekst":"Hebr. Chatsatson, daarna genoemd Engedi; zie Jos 15:62; 1Sa 24:1; 2Ch 20:2."}],"10":[{"catchword":"vol lijmputten;","tekst":"Hebr. putten putten. Aldus wordt een woord bij de Hebreën tweemaal gesteld, om de veelheid van enig ding uit te drukken, 2Ki 3:16; Jer 2:13."},{"catchword":"en vielen","tekst":"Een manier van spreken omtrent degenen, die omkomen in den slag, of anderszins, zie Jos 8:24-25; Jdg 8:10; Jdg 12:6; 1Ch 21:14. De vallenden worden hier gesteld tegen de overgeblevenen. Anders, vielen daar in, of daar heen."}],"11":[{"catchword":"have","tekst":"Zie boven Gen 12:5, en onder vs.16, 21."}],"12":[{"catchword":"want hij","tekst":"Namel. Lot; zie boven Gen 13:12."}],"13":[{"catchword":"eikenbossen","tekst":"Zie boven Gen 13:18."},{"catchword":"bondgenoten","tekst":"Hebr. Heeren des verbonds. Het woord BAAL betekent in het algemeen dengene, die wat heeft, of ook gebruikt, of die tot iets genegen is, enz. gelijk onder Gen 37:19, Heer der dromen, die veel dromen heeft; en Gen 49:23, Heeren der pijlen, die veel pijlen gebruiken; 2Ki 1:8. Heer van het haar, die veel van haar heeft; Pro 29:22. Heer der vergrimming, die tot gramschap genegen is. Alhier, Heeren des verbonds; zijn degenen die een verbond met elkander hebben gesloten."}],"14":[{"catchword":"broeder","tekst":"Dat is, zijn neef, zijns broeders Harans zoon; zie boven Gen 11:27."},{"catchword":"onderwezenen,","tekst":"Of, leerlingen. Het Hebr. woord betekent een, die van jongsaf in enig ding onderwezen is, zij in religie, krijgszaken, of in iets anders. Anders toegeëigenden van zijn huis."},{"catchword":"Dan toe","tekst":"Een stad aan den voet van het gebergte Libanon en de noordelijke grens van het land Palestina, tevoren genoemd Leschem, Jos 19:47, of Lais, Jdg 18:27."}],"15":[{"catchword":"hij en zijn knechten,","tekst":"Mitsgaders het volk van Aner, Eskol en Mamre, die als bondgenoten met hem uitgetogen waren. Zie vs.24."},{"catchword":"Damaskus","tekst":"Dit is de wijdvermaarde hoofdstad in Syrië. Zie Isa 7:8, Isa 17:1; Jer 49:25; Act 9:2."}],"17":[{"catchword":"Schave,","tekst":"Zie boven vs.5."},{"catchword":"het dal","tekst":"Aldus genoemd van wege deze geschiedenis. Zie ook van dit dal, 2Sa 18:18."}],"18":[{"catchword":"Melchizédek,","tekst":"Hebr. Melchitsedek, die een voorbeeld was op Christus. Zie Psa 110:4; Heb 7:1."},{"catchword":"Salem,","tekst":"Hebr. Schalem, daarna genoemd Jeruzalem."},{"catchword":"bracht","tekst":"Om Abram te vereren en zijn vermoeid heir te verversen, en niet om God daarmede offerande te doen. Want het Hebr. woord, dat hier staat, wordt nergens in de Heilige Schrift voor offeren gebruikt."}],"19":[{"catchword":"zegende hem,","tekst":"Als een priester des Allerhoogsten. Zie Heb 7:7."},{"catchword":"Gezegend","tekst":"Dat is, van den Heere begenadigd, en met allerlei weldaden naar ziel en lichaam begaafd."}],"20":[{"catchword":"gezegend","tekst":"Dat is, geloofd en gedankt; gelijk boven Gen 9:26, onder Gen 24:27."},{"catchword":"gaf hem","tekst":"Abram gaf aan Melchizedek tienden. Zie Heb 7:4 enz., en vergelijk dit met het volgende vs.23."}],"21":[{"catchword":"zielen;","tekst":"Hebr. de ziel, dat is, de mensen, of personen, of lieden. Zie boven Gen 12:5."}],"22":[{"catchword":"Ik heb","tekst":"Dat is, Ik heb gezworen met opgeheven hand. Zie deze manier van zweren ook Exo 6:7; Num 14:30; Deu 32:40; Eze 20:5-6; Rev 10:5-6."}],"23":[{"catchword":"Zo ik","tekst":"Dit is een afgebroken rede, bij de Hebreën zeer gebruikelijk, waardoor zij de straf, die zij verdienen, zo zij vals zweren, plegen te verzwijgen, tonende daarmede dat zij generlei straf uitnemen, maar die overlaten aan het rechtvaardig oordeel van God. Versta dan hier: Wee mij, of God doe mij dit of dat, zo ik, enz. Zie onder Gen 26:29."}],"24":[{"catchword":"Het zij","tekst":"Of, zonder mij, daar ik niets van het uwe zal nemen. Anderen vertalen: behalve alleen wat, enz. Zie dergelijke manier van spreken, onder Gen 41:16."},{"catchword":"laat","tekst":"Laat volgen niet alleen den jongelingen, wat zij van den roof der vijanden verteerd hebben, maar ook aan de drie mannen, wat zij daarvan nog voor hun deel zouden mogen eisen."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"And it came to pass in the days of Armaphel the king [understand here none of such great and mighty kings and monarchs as got up afterwards but such chieftains and governors only as had the command and the government but some of the tracts or places with some quantity o men restoring under their jurisdiction which appears by this that the five cities Sodom Gomorra &c. had each of them their king verse 2] of Sinear [see chapter 10 on verse 10] Arioch the king of Ellasar [upper Suffiana in Assyria compare chapter 2 on the annotate on the name of Havila verse 11] Kedor Laomer the king of Elam the son of Sem[a country of Perside called Elymias of Elam the son of Sem see chapter 10.22] and Tideal the king of the nations [it should seem that the kings subject and soldiery consisted of several nations though some take it as if the word Gojim here was but the name of the certain place or country.]"}],"2":[{"catchword":null,"tekst":"That they waged war [this is the first war plainly set down and recorded in holy writ nor is there any other history extant in the world that gives account of any war is old as this] with Bera king of Sodom and with Bisra king of Gomorra Sinah king of Adama and Semeberr king of Zehoim and the king of Bela this is Zoar [see chapter 13.10 those cities which here are visited with war were all of them Zoar only excepted not long after consumed with fire and brimstone from heaven because of their intolerable wickedness.]"}],"3":[{"catchword":null,"tekst":"All these assembled themselves in the vale of Siddim [others towards or to this was the plain or low country wherein the foresaid cities were situated ] that is the salt sea [thus called after the destruction of the said cities the same whole tract abound before with abundance of salt and blackish slime pits verse 10 becoming afterwards or turning into great stinking pool otherwise called Lacus Asphaltites that is pitch or glue or slime sea as also the dead sea no living creature being able to remain alive in it.]"}],"4":[{"catchword":null,"tekst":"Twelve years they had served Kedor Laomer [having been it is like subdued so far by him in some former war that they were become tributary to him ] but in the thirteenth year [Heb. Thirteen years that is the thirteenth and so in the next verse fourteen and fourteenth ] they fell off."}],"5":[{"catchword":null,"tekst":"So Kedor Laomer came in the fourteenth year and the king that were with him and smote the Rephaim[a people descending from Canaan see chapter 15.20 others giants who are conceived to be so called from their sound vigor and strength ] in Asteroth Karnaim [ a city beyond Jordan called likewise Asteroth by itself Deu 1:4 and Jos 9:10 & 13.31 her surname is Kernaim which it sems was given her from the situation resembling two Ram horns ] and the Zuzim in Ham and the Emim [a certain people which is likewise were reputed Giants Deu 2:10 ,11] in Schave KIriathaim [a city built afterwards in Gilead by the Reubenites formerly as it seemeth called Schave see verse 17 Num 32:37 Jos 13:10 others in the plain and champion-field.]"}],"6":[{"catchword":null,"tekst":"And the Horites [Heb. The Chorites a people that dwelt in Seir as likewise Esau afterwards see chapter 32.3 until the Edomites or Esau&rsquo;s posterity droe them out thence see chapter 36.20 and Deu 33:2 and 1Sa 25:1 Habakkuk 3.3 hence the desert or wilderness of Paran hath its name see chapter 21.21 an Num 10:12] which is by the desert."}],"7":[{"catchword":null,"tekst":"Then they turned again and came to En mispat that is Kades [as viz. it was called in Moses times lying in the desert of sin see Num 20:11,14,16,22 a distinct place as some do hold from Kades Barnea where may be seen Num 32:8 Deu 1:19 ] and smote al the land ] of the Amalekites [a people descending from Esau which inhabited the same afterwards see chapter 36.12 ] and the Emorites also [likewise a people of Canaans off-spring see chapter 10.16 ] that dwelt at Hezezon Tamar [Heb. Chatsatson afterwards called Engedi see Jos 15:62 1Sa 24:1 and 2Ch 20:2.]"}],"8":[{"catchword":null,"tekst":"Then there went forth the king of Sodom and the king of Gomorra and the king of Adama and the king of Zechoim and the king of Bela this is Zoar and they put buttail-array against them in the valley of Siddim."}],"9":[{"catchword":null,"tekst":"Against Kedor Laomer the king of Elam and Tideal the king of nations and Amarphel the king of Sinear and Arioch the king of Ellasar four kings against five."}],"10":[{"catchword":null,"tekst":"Now the valley of Siddim was full of flame pits [Heb. Pits-pits thus one and the same word is doubled by the Hebrews to express the quantity or multitude of things 2Ki 3:16 Jer 2:13] and the king of Sodom and Gomorra fled and fell there [a phrase of such a perish in the battail or otherwise see Jos 8:24,25 Jude 8.10 and 12.6 and 1Ch 21:14 the fallen ones are here put in the oppositions to them that escaped others fell therein or fell down ] and the remainder fled to the mountains."}],"11":[{"catchword":null,"tekst":"And they took all the substance of Sodom [see chapter 12.5 and here verse 16, 21] and Gomorra and all their victual went away."}],"12":[{"catchword":null,"tekst":"Also they took Lot Abrams brothers sons and his substance and went away for he dwelt in Sodom [Lot namely see chapter 13.12.]"}],"13":[{"catchword":null,"tekst":"Then there came one that was escaped and related it to Abram the Hebrew that was dwelling by the oaken bushes [see chapter 13 on verse 18] of Mamre the Emorite brother of Escol and brother of Aner who were Abrams confederates [Heb. Lord of covenant the word Bathal doth in general signify him that is in possession of anything or useth it or is inclined & affected to it &c. as chapter 37.19 Lord of dreams one that hath many dreams chapter 49.23 Lords of arrows they that use many arrows 2Ki 1:8 Lord of hair one that hath much hair Prov 29:22 Lord of heat or wrathfulness one that giveth to that of passion here in this place Lords of covenant are those which were covenant together.]"}],"14":[{"catchword":null,"tekst":"When Abram heard that his brother [that is nephew his brother Harans sons see chapter 11.27] was taken prisoner he armed his instructed or trained ones [or apprentice the Hebrew word doth signify one that is instructed in something from his youth whether it be in matters of religion or military affairs or otherwise others his dedicated and appropriated ones] the in-born of his house three hundred and eighteen and the pursued them with Dan. [A little city lying at the foot of the mount Libenus and the north border of Palestine formerly called Laschem Jos 19:47 or Lais Jude 18.27.]"}],"15":[{"catchword":null,"tekst":"And he divided himself by them against them by night he and his servants [together with the man of Aner Escol and Mamre who were marched forth with him as confederates see verse 24] and smote them and he pursed them unto Hoba which is on the left hand of Damascus [this is that famous metropolis in Syria see Isa 7:8 and 17.1 Jer 49:25 Act 9:2.]"}],"16":[{"catchword":null,"tekst":"And he brought all the good substance back and Lot likewise his brother and his substance brought again as also the woman and the people."}],"17":[{"catchword":null,"tekst":"And the king of Sodom went forth to meet him after that he was returned from smiting Kedorlaomer and the kings that were with him unto the vale of the schave [see above verse 5] that is the kings vales [ thus called by reason of this encounter see further of this vale 2Sa 18:18.]"}],"18":[{"catchword":null,"tekst":"And Melchizedek [Heb. Melchitsedek who was a type of Christ see Psa 110:4 Heb 7:1] King of Salem [Heb. Schalem afterwards called Jerusalem] brought forth bread and wine [to present Abram with and to refresh with wearied army not to make an offering thereof to God the Hebrew verb here used being nowhere in scripture taken for offering] and he was the priest of the most high God."}],"19":[{"catchword":null,"tekst":"And he blessed him [as a priest of the most high see Heb. 7.7] and said blessed be Abram to the most high God that possesseth heaven and earth [that is the Lord be gracious unto him and endue him with all manner of blessings in soul and body.]"}],"20":[{"catchword":null,"tekst":"And blessed be the most high [that is extold with praise and thanks as chapter 9.26 and chapter 24.27] that hath delivered thine enemies into thy hand and hath gave him the tenth of all [Abram gave the tenth to Melchizedek see Heb 7:4 &c. and compare the same with the following verses here.]"}],"21":[{"catchword":null,"tekst":"And the king of Sodom said to Abram give me the soul [Heb. The soul that is the men or persons or people see chapter 12.5] but the substance take for thyself."}],"22":[{"catchword":null,"tekst":"Yet Abram said to the king of Sodom I have lifted up my hand to the lord the most high God that possesseth heaven and earth[that is I have sworn and lifted up hands see of the manner of swearing Exo 6:8 Num 14:30 Deu 32:40 Eze 20:5,6 Rev 10:5,6.]"}],"23":[{"catchword":null,"tekst":"If from a three to a shoe-latchet yea if of all that is thy I take I ought [this is an imperfect speech very usual among the Hebrews whereby they use to conceal the punishment which they make themselves liable to swearing falsely shewing thereby that tey except no kind of punishment but refer the same to the just judgment of God understand therefore in such passage woe be unto me or God do this or that thus and thus with me if I &c. see chapter 26.29] that thou do not say I have enriched Abram."}],"24":[{"catchword":null,"tekst":"Be it forth or without me [because I will take nothing of what is thine others read it besides only what &c. see the like phrase chapter 41.verse 16] only what the youths have spent and a part of these men that went forth with me Aner Escol and Mamre let them take their share [that is let not only the young men pass with what they spent of the enemies prey but those three men also be supplied with such a share as they shall demand.]"}]}}};
const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
