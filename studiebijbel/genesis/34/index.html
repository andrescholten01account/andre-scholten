ea, die zij Jakob gebaard had, ging naar buiten om de dochters van dat land te bezoeken.","2":"Sichem nu, de zoon van Hemor de Heviet, de landvorst, zag haar, en hij nam haar, en lag bij haar, en verkrachtte haar.","3":"En zijn ziel hechtte zich aan Dina, Jakobs dochter; en hij had de jonge vrouw lief, en sprak naar het hart van de jonge vrouw.","4":"Sichem sprak ook tegen zijn vader Hemor en zei: Neem mij deze *dochter* tot vrouw.","5":"Toen Jakob hoorde dat hij zijn dochter Dina verontreinigd had, waren zijn zonen met het vee in het veld; en Jakob zweeg totdat zij kwamen.","6":"En Hemor, de vader van Sichem, ging naar buiten naar Jakob, om met hem te spreken.","7":"En de zonen van Jakob kwamen van het veld toen zij dit hoorden; en het deed deze mannen verdriet, en zij ontstaken in grote woede, omdat hij dwaasheid in Israël gedaan had door bij Jakobs dochter te liggen, wat zo niet gedaan had mogen worden.","8":"Toen sprak Hemor met hen en zei: Mijn zoon Sichems ziel is verliefd op uw dochter; geef hem haar toch tot vrouw.","9":"En verzwager u met ons; geef ons uw dochters, en neem voor u onze dochters;","10":"en woon met ons; en het land zal voor u open liggen; woon *hier*, en drijf er handel, en vestig u erin als eigenaar.","11":"En Sichem zei tegen haar vader en tegen haar broers: Laat mij genade vinden in uw ogen; en wat u tegen mij zeggen zult, zal ik geven.","12":"Vraag gerust een hoge bruidsprijs en geschenk van mij; en ik zal geven zoals u tegen mij zult zeggen; geef mij alleen de jonge vrouw tot vrouw.","13":"Toen antwoordden Jakobs zonen Sichem en zijn vader Hemor bedrieglijk, en spraken (omdat hij Dina, hun zuster, verontreinigd had);","14":"en zij zeiden tegen hen: Wij kunnen dit niet doen, om onze zuster te geven aan een man die onbesneden is; want dat zou voor ons een schande zijn.","15":"Doch hierin zullen wij het met u eens zijn: als u wordt zoals wij, dat onder u besneden wordt al wie mannelijk is.","16":"Dan zullen wij u onze dochters geven, en uw dochters zullen wij voor onszelf nemen, en wij zullen met u wonen, en wij zullen tot één volk worden.","17":"Maar als u naar ons niet zult luisteren om besneden te worden, dan zullen wij onze dochter nemen en wegtrekken.","18":"En hun woorden waren goed in de ogen van Hemor, en in de ogen van Sichem, Hemors zoon.","19":"En de jongeman aarzelde niet om deze zaak te doen; want hij had een groot verlangen naar Jakobs dochter; en hij was geëerd boven heel zijns vaders huis.","20":"Zo kwamen Hemor en Sichem, zijn zoon, naar hun stadspoort; en zij spraken tegen de mannen van hun stad en zeiden:","21":"Deze mannen zijn vreedzaam tegenover ons; laat hen daarom in dit land wonen, en erin handel drijven, en het land (zie, het is ruim genoeg) zal voor hun aangezicht open liggen; wij zullen ons hun dochters tot vrouwen nemen, en wij zullen onze dochters aan hen geven.","22":"Doch hierin alleen zullen deze mannen het met ons eens zijn, dat zij met ons wonen om tot één volk te worden: als al wie mannelijk is onder ons besneden wordt, zoals zij besneden zijn.","23":"Hun vee, en hun bezit, en al hun dieren, zullen die niet van ons zijn? Laten we het alleen met hen eens zijn, en zij zullen met ons wonen.","24":"En zij luisterden naar Hemor en naar Sichem, zijn zoon, allen die bij zijn stadspoort naar buiten gingen; en zij werden besneden, allen die mannelijk waren, allen die bij zijn stadspoort naar buiten gingen.","25":"En het gebeurde op de derde dag, toen zij in pijn waren, dat de twee zonen van Jakob, Simeon en Levi, broers van Dina, ieder zijn zwaard namen, en stout de stad binnenkwamen, en allen doodden die mannelijk waren.","26":"Zij sloegen ook Hemor en zijn zoon Sichem dood met de scherpte van het zwaard; en zij namen Dina uit Sichems huis en gingen vandaar weg.","27":"De zonen van Jakob kwamen bij de gesneuvelden en plunderden de stad, omdat zij hun zuster verontreinigd hadden.","28":"Hun schapen, en hun runderen, en hun ezels, en wat er in de stad was, en wat er in het veld was, namen zij mee.","29":"En al hun vermogen, en al hun kleine kinderen, en hun vrouwen, voerden zij gevangen weg, en plunderden dezelfde, en alles wat er in huis was.","30":"Toen zei Jakob tegen Simeon en tegen Levi: U hebt mij in het ongeluk gestort, doordat u mij stinkend maakt onder de inwoners van dit land, onder de Kanaänieten en onder de Ferezieten; en ik heb weinig volk in aantal; als zij zich tegen mij verzamelen, zullen zij mij verslaan, en ik zal vernietigd worden, ik en mijn huis.","31":"En zij zeiden: Zou hij dan met onze zuster hebben mogen omgaan als met een hoer?"},"SV":{"1":"En Dina, de dochter van Lea, die zij Jakob gebaard had, ging uit, om de dochteren van dat land te bezien.","2":"Sichem nu, de zoon van Hemor den Heviet, den landvorst, zag haar, en hij nam ze, en lag bij haar, en verkrachtte ze.","3":"En zijn ziel kleefde aan Dina, Jakobs dochter; en hij had de jonge dochter lief, en sprak naar het hart van de jonge dochter.","4":"Sichem sprak ook tot zijn vader Hemor, zeggende: Neem mij deze dochter tot een vrouw.","5":"Toen Jakob hoorde, dat hij zijn dochter Dina verontreinigd had, zo waren zijn zonen met het vee in het veld; en Jakob zweeg, totdat zij kwamen.","6":"En Hemor, de vader van Sichem, ging uit tot Jakob, om met hem te spreken.","7":"En de zonen van Jakob kwamen van het veld, als zij dit hoorden; en het smartte dezen mannen, en zij ontstaken zeer, omdat hij dwaasheid in Israël gedaan had, Jakobs dochter beslapende, hetwelk alzo niet zoude gedaan worden.","8":"Toen sprak Hemor met hen, zeggende: Mijns zoons Sichems ziel is verliefd op ulieder dochter; geeft hem haar toch tot een vrouw.","9":"En verzwagert u met ons; geeft ons uw dochteren; en neemt voor u onze dochteren;","10":"En woont met ons; en het land zal voor uw aangezicht zijn; woont, en handelt daarin, en stelt u tot bezitters daarin.","11":"En Sichem zeide tot haar vader, en tot haar broederen: Laat mij genade vinden in uw ogen; en wat gij tot mij zeggen zult, zal ik geven.","12":"Vergroot zeer over mij den bruidschat en het geschenk; en ik zal geven, gelijk als gij tot mij zult zeggen; geef mij slechts de jonge dochter tot een vrouw.","13":"Toen antwoordden Jakobs zonen aan Sichem en Hemor, zijn vader, bedriegelijk, en spraken ( overmits dat hij Dina, hun zuster, verontreinigd had);","14":"En zij zeiden tot hen: Wij zullen deze zaak niet kunnen doen, dat wij onze zuster aan een man geven zouden, die de voorhuid heeft; want dat ware ons een schande.","15":"Doch hierin zullen wij u te wille zijn, zo gij wordt gelijk als wij, dat onder u besneden worde al wat mannelijk is.","16":"Dan zullen wij u onze dochteren geven, en uw dochteren zullen wij ons nemen, en wij zullen met u wonen, en wij zullen tot een volk zijn.","17":"Maar zo gij naar ons niet zult horen, om besneden te worden, zo zullen wij onze dochter nemen, en wegtrekken.","18":"En hun woorden waren goed in de ogen van Hemor, en in de ogen van Sichem, Hemors zoon.","19":"En de jongeling vertoogde niet, deze zaak te doen; want hij had lust in Jakobs dochter; en hij was geëerd boven al zijns vaders huis.","20":"Zo kwam Hemor en Sichem, zijn zoon, tot hunner stadspoort; en zij spraken tot de mannen hunner stad, zeggende:","21":"Deze mannen zijn vreedzaam met ons; daarom laat hen in dit land wonen, en daarin handelen, en het land ( ziet het is wijd van begrip) voor hun aangezicht zijn; wij zullen ons hun dochteren tot vrouwen nemen, en wij zullen onze dochteren aan hen geven.","22":"Doch hierin zullen deze mannen ons te wille zijn, dat zij met ons wonen, om tot een volk te zijn; als al wat mannelijk is onder ons besneden wordt, gelijk als zij besneden zijn.","23":"Hun vee, en hun bezitting, en al hun beesten, zullen die niet onze zijn? Alleen laat ons hun te wille zijn, en zij zullen met ons wonen.","24":"En zij hoorden naar Hemor, en naar Sichem, zijn zoon, allen, die ter zijner stadspoort uitgingen; en zij werden besneden, al wat mannelijk was, allen, die ter zijner stadspoort uitgingen.","25":"En het geschiedde ten derden dage, toen zij in de smart waren, zo namen de twee zonen van Jakob, Simeon en Levi, broeders van Dina, een iegelijk zijn zwaard, en kwamen stoutelijk in de stad, en doodden al wat mannelijk was.","26":"Zij sloegen ook Hemor, en zijn zoon Sichem, dood met de scherpte des zwaards; en zij namen Dina uit Sichems huis, en gingen van daar.","27":"De zonen van Jakob kwamen over de verslagenen, en plunderden de stad, omdat zij hun zuster verontreinigd hadden.","28":"Hun schapen, en hun runderen, en hun ezelen, en hetgeen dat in de stad, en hetgeen dat in het veld was, namen zij.","29":"En al hun vermogen, en al hun kleine kinderen, en hun vrouwen, voerden zij gevankelijk weg, en plunderden dezelven, en al wat binnenshuis was.","30":"Toen zeide Jakob tot Simeon en tot Levi: Gij hebt mij beroerd, mits mij stinkende te maken onder de inwoners dezes lands, onder de Kanaänieten, en onder de Ferezieten; en ik ben weinig volks in getal; zo zij zich tegen mij verzamelen, zo zullen zij mij slaan, en ik zal verdelgd worden, ik en mijn huis.","31":"En zij zeiden: Zou hij dan *met* onze zuster als *met* een hoer doen?"},"KJV":{"1":"And Dinah the daughter of Leah, which she bare unto Jacob, went out to see the daughters of the land.","2":"And when Shechem the son of Hamor the Hivite, prince of the country, saw her, he took her, and lay with her, and defiled her.","3":"And his soul clave unto Dinah the daughter of Jacob, and he loved the damsel, and spake kindly unto the damsel.","4":"And Shechem spake unto his father Hamor, saying, Get me this damsel to wife.","5":"And Jacob heard that he had defiled Dinah his daughter: now his sons were with his cattle in the field: and Jacob held his peace until they were come.","6":"And Hamor the father of Shechem went out unto Jacob to commune with","7":"And the sons of Jacob came out of the field when they heard *it*: and the men were grieved, and they were very wroth, because he had wrought folly in Israel in lying with Jacob's daughter; which thing ought not to be done.","8":"And Hamor communed with them, saying, The soul of my son Shechem longeth for your daughter: I pray you give her him to wife.","9":"And make ye marriages with us, *and* give your daughters unto us, and take our daughters","10":"And ye shall dwell with us: and the land shall be before you; dwell and trade ye therein, and get you possessions","11":"And Shechem said unto her father and unto her brethren, Let me find grace in your eyes, and what ye shall say unto me I will give.","12":"Ask me never so much dowry and gift, and I will give according as ye shall say unto me: but give me the damsel to wife.","13":"And the sons of Jacob answered Shechem and Hamor his father deceitfully, and said, because he had defiled Dinah their sister:","14":"And they said unto them, We cannot do this thing, to give our sister to one that is uncircumcised; for that *were* a reproach","15":"But in this will we consent unto you: If ye will be as we *be*, that every male of you be circumcised;","16":"Then will we give our daughters unto you, and we will take your daughters to us, and we will dwell with you, and we will become one people.","17":"But if ye will not hearken unto us, to be circumcised; then will we take our daughter, and we will be gone.","18":"And their words pleased Hamor, and Shechem Hamor's son.","19":"And the young man deferred not to do the thing, because he had delight in Jacob's daughter: and he *was* more honourable than all the house of his father.","20":"And Hamor and Shechem his son came unto the gate of their city, and communed with the men of their city, saying,","21":"These men *are* peaceable with us; therefore let them dwell in the land, and trade therein; for the land, behold, *it is* large enough for them; let us take their daughters to us for wives, and let us give them our daughters.","22":"Only herein will the men consent unto us for to dwell with us, to be one people, if every male among us be circumcised, as they *are* circumcised.","23":"*Shall* not their cattle and their substance and every beast of theirs *be* ours? only let us consent unto them, and they will dwell","24":"And unto Hamor and unto Shechem his son hearkened all that went out of the gate of his city; and every male was circumcised, all that went out of the gate of his city.","25":"And it came to pass on the third day, when they were sore, that two of the sons of Jacob, Simeon and Levi, Dinah's brethren, took each man his sword, and came upon the city boldly, and slew all the males.","26":"And they slew Hamor and Shechem his son with the edge of the sword, and took Dinah out of Shechem's house, and went out.","27":"The sons of Jacob came upon the slain, and spoiled the city, because they had defiled their sister.","28":"They took their sheep, and their oxen, and their asses, and that which *was* in the city, and that which *was* in the field,","29":"And all their wealth, and all their little ones, and their wives took they captive, and spoiled even all that *was* in the house.","30":"And Jacob said to Simeon and Levi, Ye have troubled me to make me to stink among the inhabitants of the land, among the Canaanites and the Perizzites: and I *being* few in number, they shall gather themselves together against me, and slay me; and I shall be destroyed, I and my house.","31":"And they said, Should he deal with our sister as with an harlot?"}},"tsk":{"1":[{"kopje":"Dina","refs":["Gen 30:21","Gen 46:15"]},{"kopje":"de dochter","refs":["Gen 26:34","Gen 27:46","Gen 28:6","Gen 30:13","Jer 2:36","1 Tim 5:13","Tit 2:5"]}],"2":[{"kopje":"Sichem","refs":["Gen 10:17","Gen 33:19"]},{"kopje":"zag haar","refs":["Gen 6:2","Gen 39:6","Gen 39:7","Richt 14:1","2 Sam 11:2","Job 31:1","Job 31:9","Spr 13:20","Matt 5:28"]},{"kopje":"nam haar","refs":["Gen 20:2"]},{"kopje":"verkrachtte haar","refs":["Deut 21:14","Deut 22:24","Deut 22:29","Richt 19:24","Richt 19:25","Ezech 22:10","Ezech 22:11"]}],"3":[{ st":"Dat is, wat haar aangenaam en behagelijk mocht zijn, om haar tevreden te stellen en te vertroosten; daar zij buiten twijfel over deze onverwachte daad zeer ontsteld was. Zie dergelijke manier van spreken onder, Gen 50:21; Jdg 19:3; Isa 40:2; Hos 2:13."}],"4":[{"catchword":"Neem mij","tekst":"Een exempel ook onder de heidenen, dat de kinderen met den wil en onder het bestuur van hun ouders behoorden te huwen."}],"7":[{"catchword":"zij ontstaken","tekst":"Hebr. en hen ontstak zeer, te weten, de toorn; zie boven, Gen 4:5-6."},{"catchword":"dwaasheid","tekst":"Of, een schendig stuk, of schandelijkheid, afvalligheid, onzinnigheid. Dit woord betekent een zonde, die, voortkomende uit een bozen en onbeschaamden lust, geschiedt niet alleen tegen Gods gebod, maar ook tegen de burgerlijke eerbaarheid, of ook somtijds tegen de natuur, veroorzakende grote ergernis en schande. Verg. Deu 22:21; Jos 7:15; Jdg 19:23, en Jdg 20:6; 2Sa 13:12."},{"catchword":"Israël","tekst":"Dat is, in of aan het huis Israels, of Gods volk, hetwelk uit Jakob, toen Israel genaamd werd, gesproten is."},{"catchword":"hetwelk","tekst":"Of, alzo geschiedt het niet; dat is, alzo placht en behoorde het niet te geschieden. Zie dergelijke manier van spreken, boven Gen 20:9."}],"9":[{"catchword":"verzwagert u","tekst":"Of, verhuwelijkt u; alzo Deu 7:3."},{"catchword":"geeft ons uw","tekst":"Te weten, ten huwelijk aan onze zonen, alzo onder, Gen 38:14; Deu 7:3, enz."},{"catchword":"neemt voor u","tekst":"Te weten, ten huwelijk aan uw zonen; zie boven, Gen 19:14."}],"10":[{"catchword":"voor uw","tekst":"Zie boven, Gen 13:9."},{"catchword":"stelt u","tekst":"Of, neemt een vast bezit daarin, of onthoudt u daarin."}],"11":[{"catchword":"haar vader,","tekst":"Te weten, van Dina."},{"catchword":"genade","tekst":"Zie boven, Gen 18:3."}],"12":[{"catchword":"Vergroot","tekst":"Dat is, legt mij dien zo groot op als gij wilt."},{"catchword":"den bruidsschat","tekst":"De bruidssschat, dien de man de vrouw gaf, bleef ha // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
function kopieerVers(n) {
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n})`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
}
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  kopieerVers(k.dataset.n);
});
// rechtermuisklik op een vers kopieert het (in plaats van het browser-contextmenu)
document.addEventListener('contextmenu', e => {
  const rij = e.target.closest('.vers');
  if (!rij || !rij.id.startsWith('v')) return;
  const n = rij.id.slice(1);
  if (!D.vertalingen.SVnu[n]) return;
  e.preventDefault();
  kopieerVers(n);
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;

  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  // dubbele rechtsklik (binnen 500ms, zelfde verwijzing) kopieert het vers
  // i.p.v. de vertalingen-popup te tonen (enkele rechtsklik blijft bestaand gedrag)
  function kopieerVerwijzing(chip, ref) {
    haalVert('versteksten', ref).then(data => {
      const tekst = data && data[ref.vers];
      if (!tekst) return;
      const url = location.origin + '/studiebijbel/' + ref.slug + '/' + ref.hfd + '#v' + ref.vers;
      const kopie = tekst.replace(/\*/g, '') + `\n~ [${chip.textContent}](${url})`;
      navigator.clipboard.writeText(kopie).then(() => {
        toast.classList.add('zichtbaar');
        setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
      });
    });
  }
  let laatsteRechtsklik = { sleutel: null, tijd: 0 };
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    const sleutel = chip.dataset.ref;
    const nu = Date.now();
    const isDubbelklik = laatsteRechtsklik.sleutel === sleutel && (nu - laatsteRechtsklik.tijd) < 500;
    laatsteRechtsklik = isDubbelklik ? { sleutel: null, tijd: 0 } : { sleutel, tijd: nu };
    if (isDubbelklik) {
      popup.style.display = 'none';
      vpopup.style.display = 'none';
      kopieerVerwijzing(chip, ref);
      return;
    }
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
