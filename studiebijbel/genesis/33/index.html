n aan, die u gebracht is, omdat God mij genadig behandeld heeft, en omdat ik alles heb wat ik nodig heb; en hij hield bij hem aan, zodat hij het aannam.", "12": "En hij zei: Laten we op reis gaan en verder trekken; en ik zal voor u uit trekken.", "13": "Maar hij zei tegen hem: Mijn heer weet dat deze kinderen teer zijn, en dat ik zogende schapen en koeien bij mij heb; als men ze maar één dag te hard laat lopen, zal de hele kudde sterven.", "14": "Laat mijn heer toch voor zijn knecht uit trekken; en ik zal rustig aan verder trekken, op het tempo van het vee dat voor mij uit gaat, en op het tempo van deze kinderen, totdat ik bij mijn heer in Seïr kom.", "15": "En Ezau zei: Laat mij toch een deel van dit volk dat bij mij is, bij u achterlaten. En hij zei: Waarom zou dat nodig zijn? Laat mij genade vinden in de ogen van mijn heer!", "16": "Zo keerde Ezau die dag terug, zijn weg naar Seïr op.", "17": "Maar Jakob reisde naar Sukkoth, en bouwde daar een huis voor zichzelf, en maakte hutten voor zijn vee; daarom noemde hij die plaats Sukkoth.", "18": "En Jakob kwam veilig aan bij de stad Sichem, die in het land Kanaän ligt, toen hij vanuit Paddan-Aram kwam; en hij sloeg zijn tenten op tegenover de stad.", "19": "En hij kocht een stuk van het veld, waar hij zijn tent had opgezet, van de zonen van Hemor, de vader van Sichem, voor honderd stukken van het geld.", "20": "En hij richtte daar een altaar op, en noemde het: De God van Israël is God!"}, "SV": {"1": "En Jakob hief zijn ogen op en zag; en ziet, Ezau kwam, en vierhonderd mannen met hem. Toen verdeelde hij de kinderen onder Lea, en onder Rachel, en onder de twee dienstmaagden.", "2": "En hij stelde de dienstmaagden en haar kinderen vooraan; en Lea en haar kinderen meer achterwaarts; maar Rachel en Jozef de achterste.", "3": "En hij ging voorbij hun aangezicht heen, en hij boog zich zeven malen ter aarde, totdat hij bij zijn broeder kwam.", "4": "Toen liep Ezau hem tegemoet, en nam hem in den arm, en viel hem aan den hals, en kuste hem; en zij weenden.", "5": "Daarna hief hij zijn ogen op, en zag die vrouwen en die kinderen, en zeide: Wie zijn deze bij u? En hij zeide: De kinderen, die God aan uw knecht genadiglijk verleend heeft.", "6": "Toen traden de dienstmaagden toe, zij en haar kinderen, en zij bogen zich neder.", "7": "En Lea trad ook toe, met haar kinderen, en zij bogen zich neder; en daarna trad Jozef toe en Rachel, en zij bogen zich neder.", "8": "En hij zeide: *Voor* wien is u al dit heir, dat ik ontmoet heb? En hij zeide: Om genade te vinden in de ogen mijns heren!", "9": "Maar Ezau zeide: Ik heb veel, mijn broeder! het zij het uwe, wat gij hebt!", "10": "Toen zeide Jakob: Och neen! indien ik nu genade in uw ogen gevonden heb, zo neem mijn geschenk van mijn hand; daarom, omdat ik uw aangezicht gezien heb, als had ik Gods aangezicht gezien, en gij welgevallen aan mij genomen hebt.", "11": "Neem toch mijn zegen, die u toegebracht is, dewijl het God mij genadiglijk verleend heeft, en dewijl ik alles heb; en hij hield bij hem aan, zodat hij het nam.", "12": "En hij zeide: Laat ons reizen en voorttrekken; en ik zal voor u trekken.", "13": "Maar hij zeide tot hem: Mijn heer weet, dat deze kinderen teder zijn, en dat ik zogende schapen en koeien bij mij heb; indien men dezelve maar een dag afdrijft, zo zal de gehele kudde sterven.", "14": "Mijn heer trekke toch voorbij, voor het aangezicht van zijn knecht; en ik zal mij op mijn gemak als leidsman voegen, naar den gang van het werk, hetwelk voor mijn aangezicht is, en naar den gang dezer kinderen, totdat ik bij mijn heer te Seir kome.", "15": "En Ezau zeide: Laat mij toch van dit volk, dat met mij is, u bijstellen. En hij zeide: Waartoe dat? laat mij genade vinden in mijns heren ogen!", "16": "Alzo keerde Ezau dien dag wederom zijns weegs naar Seir toe.", "17": "Maar Jakob reisde naar Sukkoth, en bouwde een huis voor zich, en maakte hutten voor zijn vee; daarom noemde hij den naam dier plaats Sukkoth.", "18": "En Jakob kwam behouden *tot* de stad Sichem, welke is in het land Kanaän, als hij kwam van Paddan-aram; en hij legerde zich in het gezicht der stad.", "19": "En hij kocht een deel des velds, waarop hij zijn tent gespannen had, van de hand der zonen van Hemor, den vader van Sichem, voor honderd stukken gelds.", "20": "En hij richtte aldaar een altaar op, en noemde het: De God Israëls *is* God!"}, "KJV": {"1": "And Jacob lifted up his eyes, and looked, and, behold, Esau came, and with him four hundred men. And he divided the children unto Leah, and unto Rachel, and unto the two handmaids.", "2": "And he put the handmaids and their children foremost, and Leah and her children after, and Rachel and Joseph hindermost.", "3": "And he passed over before them, and bowed himself to the ground seven times, until he came near to his brother.", "4": "And Esau ran to meet him, and embraced him, and fell on his neck, and kissed him: and they wept.", "5": "And he lifted up his eyes, and saw the women and the children; and said, Who *are* those with thee? And he said, The children which God hath graciously given thy servant.", "6": "Then the handmaidens came near, they and their children, and they bowed themselves.", "7": "And Leah also with her children came near, and bowed themselves: and after came Joseph near and Rachel, and they bowed", "8": "And he said, What *meanest* thou by all this drove which I met? And he said, *These are* to find grace in the sight of my lord.", "9": "And Esau said, I have enough, my brother;", "10": "And Jacob said, Nay, I pray thee, if now I have found grace in thy sight, then receive my present at my hand: for therefore I have seen thy face, as though I had seen the face of God, and thou wast pleased with me.", "11": "Take, I pray thee, my blessing that is brought to thee; because God hath dealt graciously with me, and because I have enough. And he urged him, and he took", "12": "And he said, Let us take our journey, and let us go, and I will go", "13": "And he said unto him, My lord knoweth that the children *are* tender, and the flocks and herds with young *are* with me: and if men should overdrive them one day, all the flock will die.", "14": "Let my lord, I pray thee, pass over before his servant: and I will lead on softly, according as the cattle that goeth before me and the children be able to endure, until I come unto my lord unto Seir.", "15": "And Esau said, Let me now leave with thee *some* of the folk that *are* with me. And he said, What needeth it? let me find grace in the sight of my lord.", "16": "So Esau returned that day on his way unto Seir.", "17": "And Jacob journeyed to Succoth, and built him an house, and made booths for his cattle: therefore the name of the place is called Succoth.", "18": "And Jacob came to Shalem, a city of Shechem, which *is* in the land of Canaan, when he came from Padanaram; and pitched his tent before the city.", "19": "And he bought a parcel of a field, where he had spread his tent, at the hand of the children of Hamor, Shechem's father, for an hundred pieces of money.", "20": "And he erected there an altar, and called it Elelohe-Israel."}}, "tsk": {"1": [{"kopje": "Ezau kwam eraan", "refs": ["Gen 27:41", "Gen 27:42", "Gen 32:6"]}, {"kopje": "Toen verdeelde hij", "refs": ["Gen 32:7", "Gen 32:16"]}], "2": [{"kopje": "Rachel", "refs": ["Gen 29:30", "Gen 30:22-24", "Gen 37:3", "Mal 3:17"]}], "3": [{"kopje": "ging voor hen uit heen", "refs": ["Joh 10:4", "Joh 10:11", "Joh 10:12", "Joh 10:15"]}, {"kopje": "boog zich", "refs": ["Gen 18:2", "Gen 42:6", "Gen 43:26", "Spr 6:3", "Pred 10:4", "Luk 14:11"]}, {"kopje": "zeven keer", "refs": ["1 Sam 2:5"]}], "4": [{"kopje": "nam hem in zijn armen", "refs": ["Gen 32:28", "Gen 43:30", "Gen 43:34", "Gen 45:2", "Gen 45:15", "Job 2:12", "Neh 1:11", "Ps 34:5", "Spr 16:7", "Spr 21:1"]}, {"kopje": "viel hem om", "refs": ["Gen 45:14", "Gen 45:15", "Gen 46:29", "Luk 15:20", "Hand 20:37"]}], "5": [{"kopje": "kinderen", "refs": ["Gen 30:2", "Gen 48:9", "Rut en": []}]}]}, "20": {"nave": [{"topic": "Altar", "href": "../../nave/a/#t-altar", "kinderen": [{"label": "Built by Jacob", "href": "../../nave/a/?hl=Gen.33.20#i719", "refs": [{"disp": "Gen 33:20", "href": "../../genesis/33/#v20", "ref": "Gen 33:20", "svLabel": null}, {"disp": "Gen 35:1-7", "href": "../../genesis/35/#v1", "ref": "Gen 35:1-7", "svLabel": null}], "kinderen": []}]}, {"topic": "El-elohe-israel", "href": "../../nave/e/#t-el-elohe-israel", "kinderen": [{"label": "Name of Jacob's altar at Salem", "href": "../../nave/e/?hl=Gen.33.20#i5987", "refs": [{"disp": "Gen 33:20", "href": "../../genesis/33/#v20", "ref": "Gen 33:20", "svLabel": null}], "kinderen": []}]}], "torrey": [{"topic": "Altars", "href": "../../torrey/a/#t-altars", "kinderen": [{"label": "Mentioned In Scripture", "href": "../../torrey/a/?hl=Gen.33.20#i422", "refs": [], "kinderen": [{"label": "Of Jacob", "href": "../../torrey/a/?hl=Gen.33.20#i426", "refs": [{"disp": "Gen 33:20", "href": "../../genesis/33/#v20", "ref": "Gen 33:20", "svLabel": null}, {"disp": "Gen 35:1", "href": "../../genesis/35/#v1", "ref": "Gen 35:1", "svLabel": null}, {"disp": "Gen 35:3", "href": "../../genesis/35/#v3", "ref": "Gen 35:3", "svLabel": null}, {"disp": "Gen 35:7", "href": "../../genesis/35/#v7", "ref": "Gen 35:7", "svLabel": null}], "kinderen": []}]}]}]}}, "extern": {"Gen 12:8": "En hij brak vandaar op naar het gebergte, ten oosten van Beth-el, en hij sloeg zijn tent op, met Beth-el naar het westen, en Ai naar het oosten; en hij bouwde daar een altaar voor de HEERE, en riep de Naam van de HEERE aan.", "Neh 1:11": "Och, Heere, laat toch Uw oor opmerkzaam zijn op het gebed van Uw dienaar, en op het gebed van Uw dienaren, die ernaar verlangen Uw Naam te vrezen; en laat het Uw dienaar vandaag toch goed lukken, en geef hem barmhartigheid voor het aangezicht van deze man. Ik was namelijk de schenker van de koning.", "2 Sam 14:32": "En Absalom zei tegen Joab: Zie, ik heb naar u gestuurd, en gezegd: Kom hierheen, zodat ik u naar de koning kan sturen, om te zeggen: Waarom ben ik uit Gesur gekomen? Het was beter voor mij geweest, als ik daar nog was; nu dan, laat mij het gezicht van de koning zien; en is er dan nog een misdaad in mij, laat hij mij dan doden.", "1 Kor 3:2": "Ik heb u met melk gevoed, en niet met vaste spijs; want u kon toen nog niet; ja, u kunt ook nu nog niet.", "1 Kon 1:16": "En Bathseba boog haar hoofd en boog zich neer voor de koning; en de koning zei: Wat wilt u?", "Gen 19:19": "Zie toch, Uw knecht heeft genade gevonden in Uw ogen, en U hebt Uw goedheid groot gemaakt die U aan mij bewezen hebt, door mijn leven te sparen; maar ik zal niet naar het gebergte kunnen vluchten, want misschien overkomt mij dat kwaad, en moet ik sterven!", "Matt 18:10": "Kijk uit dat u niet één van deze kleinen veracht. Want Ik zeg u dat hun engelen in de hemelen altijd het aangezicht zien van Mijn Vader, Die in de hemelen is.", "Gen 18:2": "En hij hief zijn ogen op en keek; en zie, daar stonden drie mannen tegenover hem; toen hij hen zag, liep hij hun tegemoet vanuit de deur van de tent, en boog zich tot op de grond.", "Ps 41:12": "Hierbij weet ik, dat U lust aan mij hebt, dat mijn vijand over mij niet zal juichen.", "Gen 48:9": "En Jozef zei tegen zijn vader: Zij zijn mijn zonen, die God mij hier gegeven heeft. En hij zei: Breng hen toch bij mij, dan zal ik hen zegenen!", "2 Kron 20:10": "En nu, zie, de kinderen van Ammon, en Moab, en die van het gebergte Seir, aan wie U niet toestond dat Israël erdoorheen zou trekken, toen zij uit Egypteland kwamen, maar zij weken van hen af en vernietigden hen niet;", "Gen 49:30-32": "In de spelonk die op de akker van Machpela is, die tegenover Mamre is, in het land Kanaän, die Abraham met die akker gekocht heeft van Efron, de Hethiet, tot een erfbegrafenis. Daar hebben zij Abraham begraven, en Sara, zijn vrouw; daar hebben zij Izak begraven, en Rebekka, zijn vrouw; en daar heb ik Lea begraven. De akker, en de spelonk die daarin is, is gekocht van de zonen van Heth.", "Gen 25:20": "En Izak was veertig jaar oud, toen hij Rebekka, de dochter van Bethuel, de Syriër, uit Paddan-Aram, de zuster van Laban, de Syriër, tot vrouw nam.", "Luk 14:11": "Want ieder die zichzelf verhoogt, zal vernederd worden; en wie zichzelf vernedert, zal verhoogd worden.", "Gen 33:3-10": "En hij ging voor hen uit heen, en boog zich zeven keer ter aarde, totdat hij bij zijn broer kwam. Toen liep Ezau hem tegemoet, en nam hem in zijn armen, en viel hem om de hals, en kuste hem; en zij huilden. Daarna sloeg hij zijn ogen op en zag die vrouwen en die kinderen, en zei: Wie zijn dit bij u? En hij zei: De kinderen die God aan uw knecht genadig gegeven heeft.", "1 Kon 7:46": "In de vlakte van de Jordaan liet de koning ze gieten, in de kleigrond, tussen Sukkoth en Zarthan.", "Joz 15:19": "En zij zei: Geef mij een zegen; omdat u mij een dor land gegeven hebt, geef mij ook waterbronnen. Toen gaf hij haar de hoge waterbronnen en de lage waterbronnen.", "Fil 4:11": "Niet dat ik dit zeg vanwege gebrek; want ik heb geleerd tevreden te zijn in de omstandigheden waarin ik ben.", "Gen 28:3": "En God, de Almachtige, zegent u, en maakt u vruchtbaar, en vermenigvuldigt u, zodat u tot een groep volken wordt.", "Richt 8:8": "En hij trok vandaar op naar Pnuël, en sprak hen op dezelfde manier toe. En de mannen van Pnuël antwoordden hem, zoals de mannen van Sukkoth geantwoord hadden.", "Gen 46:15": "Dit zijn de zonen van Lea, die zij Jakob gebaard heeft in Paddan-Aram, samen met Dina, zijn dochter; al de zielen van zijn zonen en zijn dochters waren drieëndertig.", "Ps 113:9": "Die de onvruchtbare vrouw doet wonen als moeder in een huisgezin, een blijde moeder van kinderen. Halleluja!", "Ruth 1:14": "Toen huilden zij weer luid; en Orpa kuste haar schoonmoeder, maar Ruth bleef bij haar.", "Deut 2:4": "En gebied het volk: U zult doortrekken langs het gebied van uw broeders, de kinderen van Ezau, die in Seir wonen; zij zullen wel voor u vrezen; maar u zult u zeer wachten.", "Gen 32:13-20": "En hij overnachtte daar diezelfde nacht; en hij nam van wat hem onder handen kwam een geschenk voor Ezau, zijn broer; tweehonderd geiten en twintig bokken, tweehonderd ooien en twintig rammen; dertig zogende kamelinnen met haar veulens, veertig koeien en tien stieren, twintig ezelinnen en tien jonge ezels.", "2 Kon 2:17": "Maar zij drongen bij hem aan tot het schamen toe; en hij zei: Stuur hen. En zij stuurden vijftig mannen, die drie dagen zochten, doch hem niet vonden.", "Ruth 4:13": "Zo nam Boaz Ruth, en zij werd hem tot vrouw, en hij ging tot haar in; en de HEERE gaf haar dat zij zwanger werd en een zoon baarde.", "Gen 35:1": "Daarna zei God tegen Jakob: Maak u op, trek op naar Bethel, en woon daar; en maak daar een altaar voor de God Die u verscheen, toen u vluchtte voor het aangezicht van uw broer Ezau.", "Gen 27:42": "Toen aan Rebekka deze woorden van Ezau, haar oudste zoon, verteld werden, zond zij een boodschap, en ontbood Jakob, haar jongste zoon, en zei tegen hem: Zie, uw broer Ezau troost zich met de gedachte u te doden.", "Hand 4:34": "Want er was ook niemand onder hen die gebrek had; want allen die bezitters waren van landen of huizen, verkochten die, en brachten de prijs van het verkochte,", "2 Kor 9:6": "En dit zeg ik: wie spaarzaam zaait, zal ook spaarzaam maaien; en wie in zegeningen zaait, zal ook in zegeningen maaien.", "Gen 33:18-20": "En Jakob kwam veilig aan bij de stad Sichem, die in het land Kanaän ligt, toen hij vanuit Paddan-Aram kwam; en hij sloeg zijn tenten op tegenover de stad. En hij kocht een stuk van het veld, waar hij zijn tent had opgezet, van de zonen van Hemor, de vader van Sichem, voor honderd stukken van het geld. En hij richtte daar een altaar op, en noemde het: De God van Israël is God!", "1 Kron 28:5": "En uit al mijn zonen (want de HEERE heeft mij veel zonen gegeven) heeft Hij mijn zoon Salomo verkoren, dat hij zou zitten op de troon van het koninkrijk van de HEERE over Israël.", "Spr 12:10": "De rechtvaardige kent het leven van zijn dier; maar de barmhartigheden van de goddelozen zijn wreed.", "1 Sam 25:27": "En nu, dit is de zegen die uw dienstmaagd mijn heer gebracht heeft, dat die gegeven wordt aan de jongemannen die de voetstappen van mijn heer navolgen.", "Gen 34:2-31": "Sichem nu, de zoon van Hemor de Heviet, de landvorst, zag haar, en hij nam haar, en lag bij haar, en verkrachtte haar. En zijn ziel hechtte zich aan Dina, Jakobs dochter; en hij had de jonge vrouw lief, en sprak naar het hart van de jonge vrouw. Sichem sprak ook tegen zijn vader Hemor en zei: Neem mij deze dochter tot vrouw.", "2 Kor 9:5": "Ik heb dan nodig geacht deze broeders te vermanen, dat zij eerst tot u zouden komen en van tevoren uw eerder aangediende zegen klaarmaken; zodat die gereed is, als een zegen, en niet als een vrekkigheid.", "Gen 33:1-17": "Jakob sloeg zijn ogen op en keek, en zie, Ezau kwam eraan, en vierhonderd man met hem. Toen verdeelde hij de kinderen onder Lea, en onder Rachel, en onder de twee dienstmaagden. En hij zette de dienstmaagden en hun kinderen vooraan; en Lea en haar kinderen daarachter; en Rachel en Jozef achteraan. En hij ging voor hen uit heen, en boog zich zeven keer ter aarde, totdat hij bij zijn broer kwam.", "Gen 41:43": "En hij liet hem rijden op de tweede wagen die hij had; en zij riepen voor hem uit: Kniel! Zo stelde hij hem over heel Egypteland.", "Deut 2:22": "Zoals Hij aan de kinderen van Ezau, die in Seir wonen, gedaan heeft, voor wie Hij de Horieten verdelgde; en zij verdreven hen uit hun bezit, en hebben in hun plaats gewoond tot op deze dag.", "Hand 20:37": "En er ontstond een groot geween bij hen allen; en zij vielen Paulus om de hals en kusten hem;", "Mal 3:17": "En zij zullen, zegt de HEERE van de heerscharen, op die dag, die Ik maken zal, Mij een eigendom zijn; en Ik zal hen verschonen, zoals een man zijn zoon verschoont, die hem dient.", "1 Sam 2:5": "Zij die verzadigd waren, hebben zich verhuurd om brood, en zij die hongerig waren, hebben opgehouden; totdat de onvruchtbare zeven heeft gebaard, en zij die veel kinderen had, krachteloos is geworden.", "2 Kon 5:15": "Toen keerde hij terug naar de man van God, hij en zijn hele leger, en kwam, en stond voor zijn aangezicht en zei: Zie, nu weet ik dat er geen God is op de hele aarde, dan alleen in Israël! Neem dan nu toch een geschenk aan van uw knecht.", "Gen 8:20": "En Noach bouwde de HEERE een altaar; en hij nam van al het reine vee, en van al het rein gevogelte, en offerde brandoffers op dat altaar.", "Gen 28:6": "Toen Ezau nu zag dat Izak Jakob gezegend had, en hem naar Paddan-aram weggezonden had om zich vandaar een vrouw te nemen; en dat hij hem, terwijl hij hem zegende, geboden had en gezegd: Neem geen vrouw van de dochters van Kanaän;", "Est 8:3": "En Esther sprak verder voor de koning, en zij viel voor zijn voeten, en zij weende, en zij smeekte hem, dat hij de boosheid van Haman, de Agagiet, en zijn plan, dat hij tegen de Joden bedacht had, zou wegnemen.", "Ezech 35:2": "Mensenkind! Richt uw gezicht tegen het gebergte Seir, en profeteer ertegen,", "Gen 18:3": "En hij zei: Heere! Als ik nu genade gevonden heb in Uw ogen, ga toch niet aan Uw knecht voorbij.", "Joh 4:5": "Hij kwam dan in een stad van Samaria, genaamd Sichar, dicht bij het stuk land dat Jakob aan zijn zoon Jozef gaf.", "2 Sam 18:28": "Ahimaäz dan riep en zei tegen de koning: Vrede! En hij boog zich voor de koning met het gezicht ter aarde, en zei: Geloofd zij de HEERE, uw God, Die de mannen heeft overgegeven die hun hand tegen mijn heer de koning ophieven.", "Ex 33:12": "En Mozes zei tegen de HEERE: Zie, U zegt tegen mij: Voer dit volk op! maar U laat mij niet weten aan wie U met mij zult zenden; terwijl U gezegd hebt: Ik ken u bij naam! en ook: U hebt genade gevonden in Mijn ogen!", "Gen 12:7": "Toen verscheen de HEERE aan Abram, en zei: Aan uw nageslacht zal Ik dit land geven. Toen bouwde hij daar een altaar voor de HEERE, Die hem verschenen was.", "Gen 4:25": "En Adam had opnieuw gemeenschap met zijn vrouw, en zij baarde een zoon, en zij noemde zijn naam Seth; want God heeft mij, zei zij, een ander nageslacht gegeven in de plaats van Abel; want Kaïn heeft hem doodgeslagen.", "Gen 45:14": "En hij viel om de hals van Benjamin, zijn broer, en weende; en Benjamin weende om zijn hals.", "Hand 21:20": "En toen zij dat gehoord hadden, loofden zij de Heere en zeiden tegen hem: U ziet, broeder, hoeveel duizenden Joden er zijn die geloven; en zij zijn allen ijveraars voor de wet.", "Rom 8:31": "Wat zullen wij dan hierop zeggen? Als God vóór ons is, wie zal tegen ons zijn?", "2 Sam 14:28": "Zo bleef Absalom twee volle jaren in Jeruzalem, zonder het gezicht van de koning te zien.", "Richt 5:4": "HEERE! toen U voorttrok van Seïr, toen U daarheen trad van het veld van Edom, beefde de aarde, ook droop de hemel, ook dropen de wolken van water.", "Gen 46:29": "Toen spande Jozef zijn wagen aan, en trok op, zijn vader Israël tegemoet naar Gosen; en toen hij zich aan hem vertoonde, viel hij hem om zijn hals, en huilde lang aan zijn hals.", "Richt 8:16": "En hij nam de oudsten van die stad, en doornen uit de woestijn, en distels, en liet het de mannen van Sukkoth daarmee ondervinden.", "Gen 17:16": "Want Ik zal haar zegenen, en u ook uit haar een zoon geven; ja, Ik zal haar zegenen, zodat zij tot volken wordt: koningen van volken zullen uit haar voortkomen!", "Richt 20:23": "En de kinderen van Israël trokken op, en weenden voor het aangezicht van de HEERE tot de avond, en vroegen de HEERE en zeiden: Zal ik weer naderen ten strijde tegen de kinderen van Benjamin, mijn broeder? En de HEERE zei: Trek tegen hem op.", "Deut 2:12": "Ook woonden de Horieten hiervoor in Seir; maar de kinderen van Ezau verdreven hen uit hun bezit en verdelgden hen van voor hun aangezicht, en hebben in hun plaats gewoond; zoals Israël gedaan heeft met het land van zijn erfenis, dat de HEERE hun gegeven heeft.", "Mark 5:22": "En zie, er kwam een van de leiders van de synagoge, van wie de naam Jaïrus was; en toen hij Hem zag, viel hij aan Zijn voeten,", "Gen 43:30": "En Jozef haastte zich; want zijn hart werd bewogen om zijn broer, en hij zocht een plek om te wenen; en hij ging een kamer in, en weende daar.", "Spr 16:7": "Als iemands wegen de HEERE behagen, zo zal Hij ook zijn vijanden met hem verzoenen.", "Gen 43:34": "En hij liet hun gerechten brengen die voor hem stonden; maar het gerecht van Benjamin was vijf keer groter dan de gerechten van hen allen. En zij dronken, en zij werden vrolijk met hem.", "2 Kor 6:10": "als treurend, maar altijd blij; als arm, maar velen rijk makend; als niets hebbend, en toch alles bezittend.", "Gen 43:26": "Toen Jozef nu thuisgekomen was, brachten zij hem het geschenk, dat in hun hand was, in het huis, en zij bogen zich voor hem ter aarde.", "Gen 23:3-18": "Daarna stond Abraham op van bij zijn dode, en hij sprak tot de zonen van Heth en zei: Ik ben een vreemdeling en inwoner bij u; geef mij een eigen graf bij u, zodat ik mijn dode van voor mijn aangezicht kan begraven. En de zonen van Heth antwoordden Abraham en zeiden tegen hem:", "Filem 1:7": "Want wij hebben grote vreugde en vertroosting over uw liefde, dat de harten van de heiligen verkwikt zijn door u, broeder!", "Gen 13:18": "En Abram sloeg zijn tenten op, en kwam en woonde bij de eikenbossen van Mamre, die bij Hebron zijn; en hij bouwde daar de HEERE een altaar.", "Rom 8:32": "Hij Die zelfs Zijn eigen Zoon niet gespaard heeft, maar Hem voor ons allen overgegeven heeft, hoe zal Hij ons ook met Hem niet alle dingen schenken?", "Gen 33:2-7": "En hij zette de dienstmaagden en hun kinderen vooraan; en Lea en haar kinderen daarachter; en Rachel en Jozef achteraan. En hij ging voor hen uit heen, en boog zich zeven keer ter aarde, totdat hij bij zijn broer kwam. Toen liep Ezau hem tegemoet, en nam hem in zijn armen, en viel hem om de hals, en kuste hem; en zij huilden.", "Gen 28:7": "en dat Jakob zijn vader en zijn moeder gehoorzaam geweest was, en naar Paddan-aram getrokken was;", "1 Kron 5:2": "want Juda werd machtig onder zijn broeders, en hij die tot een voorganger was, kwam uit hem; maar het eerstgeboorterecht was van Jozef.)", "Joh 3:23": "En Johannes doopte ook, in Enon bij Salim, omdat daar veel water was; en zij kwamen daar en werden gedoopt.", "Gen 31:55": "En Laban stond 's morgens vroeg op, en kuste zijn zonen, en zijn dochters, en zegende hen; en Laban trok weg, en keerde terug naar zijn plaats.", "Gen 21:33": "En hij plantte een bos in Berseba, en riep daar de Naam van de HEERE, de eeuwige God, aan.", "Ruth 2:13": "En zij zei: Laat mij genade vinden in uw ogen, mijn heer, omdat u mij getroost hebt, en omdat u naar het hart van uw dienstmaagd gesproken hebt, hoewel ik niet ben als een van uw dienstmaagden.", "1 Kor 3:21": "Niemand roemt dan op mensen; want alles is van u.", "Richt 8:5": "En hij zei tegen de mannen van Sukkoth: Geef toch enige broden aan het volk dat mij volgt, want zij zijn moe; en ik jaag Zebah en Tsalmuna, de koningen van de Midianieten, achterna.", "2 Sam 14:24": "En de koning zei: Laat hij naar zijn huis gaan, en mijn gezicht niet zien. Zo ging Absalom naar zijn huis, en zag het gezicht van de koning niet.", "1 Sam 30:26": "Toen David in Ziklag kwam, zond hij van de buit naar de oudsten van Juda, zijn vrienden, en zei: Zie, hier is een geschenk voor u, van de buit van de vijanden van de HEERE.", "Gen 29:32-35": "En Lea werd zwanger, en baarde een zoon, en zij noemde zijn naam Ruben; want zij zei: Zeker, de HEERE heeft mijn verdrukking aangezien; daarom zal mijn man mij nu liefhebben. En zij werd opnieuw zwanger, en baarde een zoon, en zei: Omdat de HEERE gehoord heeft dat ik gehaat was, heeft Hij mij ook deze gegeven; en zij noemde zijn naam Simeon. En zij werd nog zwanger, en baarde een zoon, en zei: Nu zal mijn man zich ditmaal aan mij hechten, omdat ik hem drie zonen gebaard heb; daarom noemde zij zijn naam Levi.", "Gen 36:8": "Daarom woonde Ezau op het gebergte Seïr. Ezau is Edom.", "Ps 60:8": "God heeft gesproken in Zijn heiligdom; daarom zal ik van vreugde opspringen; ik zal Sichem verdelen, en het dal van Sukkoth zal ik afmeten.", "1 Kor 9:19-22": "Want daar ik van allen vrij was, heb ik mijzelf allen dienstbaar gemaakt, opdat ik er meer zou winnen. En ik ben voor de Joden geworden als een Jood, opdat ik de Joden zou winnen; voor hen die onder de wet zijn, ben ik geworden als onder de wet zijnde, opdat ik hen die onder de wet zijn, zou winnen. Voor hen die zonder de wet zijn, ben ik geworden als zonder de wet zijnde (voor God nochtans niet zonder de wet zijnde, maar voor Christus onder de wet), opdat ik hen die zonder de wet zijn, zou winnen.", "Ezech 34:23-25": "En Ik zal één Herder over hen doen opstaan, en Hij zal hen weiden, namelijk Mijn knecht David; die zal ze weiden, en Die zal hun tot een Herder zijn. En Ik, de HEERE, zal hun tot een God zijn; en Mijn knecht David zal Vorst zijn te midden van hen, Ik, de HEERE, heb het gesproken. En Ik zal een verbond van vrede met hen maken, en zal het boze gedierte uit het land doen ophouden; en zij zullen zeker wonen in de woestijn, en slapen in de wouden.", "Gen 34:11": "En Sichem zei tegen haar vader en tegen haar broers: Laat mij genade vinden in uw ogen; en wat u tegen mij zeggen zult, zal ik geven.", "Ex 12:37": "Zo reisden de kinderen van Israël uit van Rameses naar Sukkoth, ongeveer zeshonderdduizend te voet, alleen de mannen, behalve de kinderen.", "1 Kron 22:5": "Want David zei: Mijn zoon Salomo is een jongeman en teder; en het huis dat men voor de HEERE bouwen zal, moet buitengewoon groot gemaakt worden, tot een naam en tot glorie in alle landen; ik zal er nu voorraad voor bereiden. Zo bereidde David voorraad in overvloed voor zijn dood.", "Gen 47:25": "En zij zeiden: U hebt ons leven gered; laten wij genade vinden in de ogen van mijn heer, en wij zullen knechten van Farao zijn.", "Gen 27:26": "En zijn vader Izak zei tegen hem: Kom toch dichterbij, en kus mij, mijn zoon!", "Gen 30:2": "Toen ontstak Jakobs toorn tegen Rachel, en hij zei: Ben ik dan in de plaats van God, Die de vrucht van uw buik van u geweerd heeft?", "2 Sam 16:4": "Zo zei de koning tegen Ziba: Zie, alles wat Mefiboseth heeft, zal van u zijn. En Ziba zei: Ik buig mij neer, laat mij genade vinden in uw ogen, mijn heer koning!", "Gen 23:15": "Mijn heer! Hoor mij; een stuk land van vierhonderd sikkel van het zilver, wat is dat tussen mij en u? Begraaf toch uw dode.", "Ezech 34:15": "Ik zal Mijn schapen weiden, en Ik zal ze laten neerliggen, spreekt de Heere HEERE.", "Gen 45:2": "En hij verhief zijn stem met wenen, zodat de Egyptenaren het hoorden, en dat het huis van Farao het hoorde.", "Joh 10:4": "En wanneer hij zijn eigen schapen naar buiten gedreven heeft, gaat hij voor hen uit; en de schapen volgen hem, omdat zij zijn stem kennen.", "Rom 15:1": "Maar wij, die sterk zijn, zijn schuldig de zwakheden van de onsterken te dragen, en niet onszelf te behagen.", "Joh 10:15": "Zoals de Vader Mij kent, zo ken Ik ook de Vader; en Ik geef Mijn leven voor de schapen.", "Gen 32:16": "En hij gaf die in de hand van zijn knechten, elke kudde apart; en hij zei tegen zijn knechten: Trekt u voor mij uit, en houdt ruimte tussen de ene kudde en de andere kudde.", "Gen 32:6": "En de boden kwamen terug bij Jakob en zeiden: Wij zijn gekomen bij uw broer, bij Ezau; en hij trekt u ook al tegemoet, met vierhonderd man bij zich.", "Job 2:12": "En toen zij hun ogen van verre opsloegen, herkenden zij hem niet, en zij verhieven hun stem en weenden; daarbij scheurden zij ieder hun mantel, en strooiden stof op hun hoofden, omhoog naar de hemel.", "Gen 49:8": "Juda! U bent het, u zullen uw broers loven; uw hand zal zijn op de nek van uw vijanden; voor u zullen de zonen van uw vader zich neerbuigen.", "Gen 36:9": "Dit nu zijn de geboorten van Ezau, de vader van de Edomieten, op het gebergte van Seïr.", "Gen 35:3": "En laten wij ons opmaken en optrekken naar Bethel; en ik zal daar een altaar maken voor de God Die mij antwoordt op de dag van mijn benauwdheid, en met mij geweest is op de weg die ik gegaan heb.", "Gen 27:41": "En Ezau haatte Jakob om die zegen, waarmee zijn vader hem gezegend had; en Ezau zei in zijn hart: De dagen van rouw om mijn vader komen dichterbij, en ik zal mijn broer Jakob doden.", "Luk 14:23": "En de heer zei tegen de dienstknecht: Ga de wegen en heggen langs, en dwing hen binnen te komen, zodat mijn huis vol wordt.", "Gen 35:1-7": "Daarna zei God tegen Jakob: Maak u op, trek op naar Bethel, en woon daar; en maak daar een altaar voor de God Die u verscheen, toen u vluchtte voor het aangezicht van uw broer Ezau. Toen zei Jakob tegen zijn huisgezin en tegen allen die bij hem waren: Doe de vreemde goden weg die in uw midden zijn, reinig u, en verander uw kleren; En laten wij ons opmaken en optrekken naar Bethel; en ik zal daar een altaar maken voor de God Die mij antwoordt op de dag van mijn benauwdheid, en met mij geweest is op de weg die ik gegaan heb.", "Ex 18:7": "Toen ging Mozes naar buiten, zijn schoonvader tegemoet, en hij boog zich, en kuste hem; en zij vroegen elkaar naar hun welstand, en zij gingen naar de tent.", "Richt 9:1": "Abimelech nu, de zoon van Jerubbaäl, ging naar Sichem, naar de broers van zijn moeder; en hij sprak tot hen, en tot het hele geslacht van het huis van de vader van zijn moeder, en zei:", "Gen 47:29": "Toen de dagen naderden dat Israël zou sterven, riep hij zijn zoon Jozef, en zei tegen hem: Als ik nu genade gevonden heb in uw ogen, leg dan toch uw hand onder mijn heup, en bewijs mij goedheid en trouw: begraaf mij toch niet in Egypte;", "Luk 15:20": "En hij stond op en ging naar zijn vader. En toen hij nog ver van hem verwijderd was, zag zijn vader hem, en werd innerlijk met ontferming bewogen; en hij liep hem tegemoet, viel hem om de hals, en kuste hem.", "Gen 37:10": "En toen hij het aan zijn vader en aan zijn broers vertelde, bestrafte zijn vader hem en zei tegen hem: Wat is dit voor een droom die u gedroomd hebt? Zullen wij dan werkelijk komen, ik, en uw moeder, en uw broers, om ons voor u ter aarde te buigen?", "Richt 9:28": "En Gaal, de zoon van Ebed, zei: Wie is Abimelech, en wat is Sichem, dat wij hem zouden dienen? Is hij niet een zoon van Jerubbaäl, en Zebul zijn aanvoerder? Dient liever de mannen van Hemor, de vader van Sichem; want waarom zouden wij hem dienen?", "Hebr 2:13": "En verder: Ik zal Mijn vertrouwen op Hem stellen. En verder: Zie, hier ben Ik met de kinderen die God Mij gegeven heeft.", "Filem 1:16": "Nu voortaan niet als een dienstknecht, maar meer dan een dienstknecht, namelijk een geliefde broeder, vooral voor mij, hoeveel te meer dan voor u, zowel in het vlees als in de Heere.", "Joh 10:11": "Ik ben de goede Herder; de goede herder geeft zijn leven voor de schapen.", "Gen 35:7": "En hij bouwde daar een altaar, en noemde die plaats El-Bethel; want God was hem daar geopenbaard, toen hij voor het aangezicht van zijn broer vluchtte.", "1 Sam 20:3": "Toen zwoer David verder, en zei: Uw vader weet heel goed dat ik genade in uw ogen gevonden heb; daarom heeft hij gezegd: Dat Jonathan dit niet weet, opdat hij zich niet bekommert; en zeker, zo waarachtig als de HEERE leeft, en uw ziel leeft, er is maar als een schrede tussen mij en de dood!", "Ex 33:13": "Nu dan, ik bid U, als ik genade gevonden heb in Uw ogen, laat mij dan nu Uw weg weten, en ik zal U kennen, opdat ik genade vind in Uw ogen; en zie aan dat dit volk Uw volk is!", "Hand 7:16": "En zij werden overgebracht naar Sichem, en gelegd in het graf, dat Abraham gekocht had voor een som geld, van de zonen van Hemor, de vader van Sichem.", "Gen 30:22-24": "God dacht ook aan Rachel; en God verhoorde haar, en opende haar baarmoeder. En zij werd zwanger, en baarde een zoon; en zij zei: God heeft mijn smaad weggenomen! En zij noemde zijn naam Jozef, en zei: De HEERE voegt mij nog een andere zoon toe.", "Gen 27:29": "Volken zullen u dienen, en volken zullen zich voor u neerbuigen; wees heer over uw broers, en de zonen van uw moeder zullen zich voor u neerbuigen! Vervloekt moet hij zijn, wie u vervloekt; en wie u zegent, zij gezegend!", "Gen 23:7": "Toen stond Abraham op, en boog zich neer voor het volk van het land, voor de zonen van Heth;", "Joz 24:1": "Daarna verzamelde Jozua al de stammen van Israël te Sichem, en hij riep de oudsten van Israël, en hun hoofden, en hun rechters, en hun opzichters; en zij stelden zich voor het aangezicht van God.", "Gen 50:4": "Toen de dagen van het bewenen van hem voorbij waren, sprak Jozef tot het huis van Farao en zei: Als ik nu genade gevonden heb in uw ogen, spreekt toch voor de oren van Farao, en zeg:", "Pred 10:4": "Als de geest van de heerser tegen u oprijst, verlaat uw plaats niet; want het is medicijn, het stilt grote zonden.", "Gen 32:9-32": "Verder zei Jakob: O, God van mijn vader Abraham, en God van mijn vader Izak, o HEERE! Die tegen mij gezegd hebt: Keer terug naar uw land en naar uw familie, en Ik zal u goeddoen! Ik ben geringer dan al de weldaden en al de trouw die U aan Uw knecht bewezen hebt; want met mijn staf ben ik deze Jordaan overgestoken, en nu ben ik tot twee legers geworden! Red mij toch uit de hand van mijn broer, uit de hand van Ezau; want ik vrees hem, dat hij misschien komt en mij verslaat, de moeder met de kinderen!", "Job 1:21": "En hij zei: Naakt ben ik uit mijn moeders buik gekomen, en naakt zal ik daarheen terugkeren. De HEERE heeft gegeven, en de HEERE heeft genomen; de Naam van de HEERE zij geloofd!", "Deut 2:5": "Meng u niet met hen; want Ik zal u van hun land niets geven, ook niet zoveel als een voetzool breed; want Ik heb Ezau het gebergte Seir tot erfenis gegeven.", "Gen 30:6": "Toen zei Rachel: God heeft mij recht gedaan, en heeft ook mijn stem verhoord, en heeft mij een zoon gegeven; daarom noemde zij zijn naam Dan.", "Joz 24:32": "Zij begroeven ook de beenderen van Jozef, die de kinderen van Israël uit Egypte hadden meegebracht, te Sichem, in dat stuk veld dat Jakob gekocht had van de kinderen van Hemor, de vader van Sichem, voor honderd stukken geld, want zij waren aan de kinderen van Jozef als erfelijk bezit toegevallen.", "1 Sam 25:8": "Vraag het uw jongemannen, en zij zullen het u vertellen. Laat dan deze jongemannen genade vinden in uw ogen, want wij zijn op een goede dag gekomen; geef toch uw knechten, en uw zoon David, wat uw hand vinden zal.", "Joh 21:15-17": "Toen zij dan de maaltijd gehouden hadden, zei Jezus tegen Simon Petrus: Simon, zoon van Jonas, hebt u Mij meer lief dan dezen? Hij zei tegen Hem: Ja, Heere! U weet dat ik U liefheb. Hij zei tegen hem: Weid Mijn lammeren. Hij zei opnieuw tegen hem, voor de tweede keer: Simon, zoon van Jonas, hebt u Mij lief? Hij zei tegen Hem: Ja, Heere, U weet dat ik U liefheb. Hij zei tegen hem: Hoed Mijn schapen. Hij zei tegen hem voor de derde keer: Simon, zoon van Jonas, hebt u Mij lief? Petrus werd bedroefd, omdat Hij voor de derde keer tegen hem zei: Hebt u Mij lief? en hij zei tegen Hem: Heere! U weet alle dingen, U weet dat ik U liefheb. Jezus zei tegen hem: Weid Mijn schapen.", "Gen 31:4": "Toen liet Jakob Rachel en Lea roepen, naar het veld bij zijn kudde;", "Gen 37:35": "En al zijn zonen en al zijn dochters maakten zich op om hem te troosten; maar hij weigerde zich te laten troosten en zei: Want ik zal, rouw bedrijvend, tot mijn zoon in het graf neerdalen. Zo beweende zijn vader hem.", "Ezech 35:3": "En zeg ertegen: Zo zegt de Heere HEERE: Zie, Ik heb het tegen u, o gebergte Seir! En Ik zal Mijn hand tegen u uitstrekken, en zal u maken tot een verwoesting en een verlatenheid.", "1 Tim 4:8": "Want de lichamelijke oefening is van weinig nut; maar de godvruchtigheid is nuttig voor alles, omdat zij de belofte heeft van het tegenwoordige en van het toekomende leven.", "Gen 31:17": "Toen maakte Jakob zich klaar, en zette zijn zonen en zijn vrouwen op kamelen.", "1 Kon 20:32": "Toen gordden zij rouwgewaad om hun lenden, en koorden om hun hoofden, en kwamen naar de koning van Israël, en zeiden: Uw knecht Benhadad zegt: Laat toch mijn leven gespaard blijven. En hij zei: Leeft hij dan nog? Hij is mijn broeder.", "Ps 127:3": "Zie, de kinderen zijn een erfdeel van de HEERE; de vrucht van de buik is een beloning.", "Gen 37:4": "Toen zijn broeders zagen dat hun vader hem boven al zijn broers liefhad, haatten zij hem, en konden hem niet vredelijk toespreken.", "Gen 32:28": "Toen zei Hij: Uw naam zal voortaan niet meer Jakob heten, maar Israël; want u hebt zich als een vorst gedragen tegenover God en tegenover de mensen, en hebt de overhand gekregen.", "Ps 127:1": "Een lied Hammaaloth¹, van Salomo. Als de HEERE het huis niet bouwt, werken de bouwers eraan tevergeefs; als de HEERE de stad niet bewaart, waakt de wachter tevergeefs.", "Matt 2:11": "En toen zij in het huis gekomen waren, vonden zij het Kindje met Maria, Zijn moeder, en zij vielen neer en aanbaden Het; en na hun schatten geopend te hebben, brachten zij Hem geschenken: goud, wierook en mirre.", "2 Kon 5:16": "Maar hij zei: Zo waarachtig als de HEERE leeft, voor Wiens aangezicht ik sta: ik zal het niet aannemen! En hij drong bij hem aan opdat hij het zou aannemen, maar hij weigerde het.", "Gen 49:24-26": "Maar zijn boog is in stevigheid gebleven, en de armen van zijn handen zijn gesterkt, door de handen van de Machtige van Jakob; vandaar is hij een herder, een steen van Israël; Van de God van uw vader, Die u zal helpen, en van de Almachtige, Die u zal zegenen, met zegeningen van de hemel van boven, met zegeningen van het afgrond, dat daaronder ligt, met zegeningen van de borsten en van de baarmoeder! De zegeningen van uw vader gaan de zegeningen van mijn voorvaderen te boven, tot aan het einde van de eeuwige heuvels; die zullen zijn op het hoofd van Jozef, en op de hoofdschedel van hem die afgezonderd is van zijn broers!", "Gen 48:10": "Doch de ogen van Israël waren wazig door ouderdom; hij kon niet goed zien; en hij liet hen naar zich toe komen; toen kuste hij hen, en omhelsde hen.", "Ruth 2:10": "Toen viel zij op haar gezicht, en boog zich ter aarde, en zei tegen hem: Waarom heb ik genade gevonden in uw ogen, dat u mij kent, terwijl ik een vreemde ben?", "Gen 45:15": "En hij kuste al zijn broers, en hij weende over hen; en daarna spraken zijn broers met hem.", "Gen 50:1": "Toen viel Jozef op het gezicht van zijn vader, en hij weende over hem, en kuste hem.", "2 Sam 3:13": "En hij zei: Goed, ik zal een verbond met u sluiten; maar één ding vraag ik van u: u zult mijn gezicht niet zien, als u niet eerst Michal, Sauls dochter, meebrengt, wanneer u komt om mijn gezicht te zien.", "2 Kon 5:23": "En Naäman zei: Het is goed, neem twee talenten. En hij drong bij hem aan, en bond twee talenten van het zilver in twee buidels, met twee stellen kleren, en gaf ze aan twee van zijn knechten, die ze voor hem uit droegen.", "1 Sam 1:27": "Ik bad om dit kind, en de HEERE heeft mij gegeven wat ik van Hem gebeden heb.", "Pred 4:8": "Daar is er een, en geen tweede; hij heeft ook geen kind, noch broer; toch komt aan al zijn moeite geen einde; ook wordt zijn oog niet verzadigd van de rijkdom, en hij zegt niet: Voor wie zwoeg ik toch, en laat ik mijn ziel gebrek lijden aan het goede? Dit is ook vluchtigheid, en het is een moeilijke bezigheid.", "Gen 32:5": "en ik heb ossen en ezels, schapen en knechten en dienstmeisjes; en ik heb gezonden om mijn heer dit aan te zeggen, opdat ik genade vind in uw ogen.", "Gen 19:2": "En hij zei: Zie toch, mijn heren! Keert u toch af naar het huis van uw knecht, en overnacht daar, en wast uw voeten; dan kunt u vroeg opstaan en verder gaan op uw weg. En zij zeiden: Nee, maar wij zullen op straat overnachten.", "Jes 8:18": "Zie, ik en de kinderen die de HEERE mij gegeven heeft, zijn tot tekenen en tot wonderen in Israël, van de HEERE van de heerscharen, Die op de berg Sion woont.", "Joz 13:27": "En in het dal, Beth-haram, en Beth-nimra, en Sukkoth, en Zefon, wat overgebleven was van het koninkrijk van Sihon, de koning te Hesbon, de Jordaan en het gebied daarlangs, tot aan het einde van de zee van Cinnereth toe, aan de overkant van de Jordaan, naar het oosten toe.", "Ezech 25:8": "Zo zegt de Heere HEERE: Omdat Moab en Seïr zeggen: Zie, het huis van Juda is gelijk aan al de heidenvolken;", "Jer 31:2": "Zo zegt de HEERE: Het volk van de overgeblevenen van het zwaard heeft genade gevonden in de woestijn, namelijk Israël, toen Ik heenging om hem tot rust te brengen.", "Fil 4:18": "Maar ik heb alles ontvangen, en ik heb overvloed; ik ben vervuld geworden, nu ik van Epafroditus ontvangen heb wat door u gestuurd was, als een welriekende geur, een aangenaam offer, God welgevallig.", "Jes 40:11": "Hij zal Zijn kudde weiden gelijk een herder; Hij zal de lammeren in Zijn armen bijeenbrengen, en in Zijn schoot dragen; de zogende dieren zal Hij zachtjes leiden.", "Hand 5:1-8": "En een zeker man, met name Ananias, met Saffira zijn vrouw, verkocht een stuk grond; en onttrok van de prijs, ook met medeweten van zijn vrouw, en bracht een zeker deel, en legde dat aan de voeten van de apostelen. En Petrus zei: Ananias, waarom heeft de satan uw hart vervuld, dat u de Heilige Geest zou liegen, en onttrekken van de prijs van het land?", "Joh 10:12": "Maar de huurling, die geen herder is, van wie de schapen niet zelf zijn, ziet de wolf komen, en verlaat de schapen, en vlucht; en de wolf grijpt ze, en verstrooit de schapen.", "Fil 4:12": "En ik weet vernederd te worden, ik weet ook overvloed te hebben; in alle opzichten en in alles ben ik ingewijd, zowel verzadigd te zijn als honger te lijden, zowel overvloed te hebben als gebrek te lijden.", "Gen 43:3": "Toen sprak Juda tegen hem en zei: Die man heeft ons op het hoogste betuigd en gezegd: U zult mijn gezicht niet zien, als uw broer niet bij u is.", "Gen 4:1": "En Adam had gemeenschap met Eva, zijn vrouw, en zij werd zwanger en baarde Kaïn, en zei: Ik heb een man van de HEERE verkregen!", "Gen 39:5": "En het gebeurde vanaf toen, dat hij hem aangesteld had over zijn huis en over alles wat hij had, dat de HEERE het huis van de Egyptenaar zegende, om Jozefs wil; ja, de zegen van de HEERE was op alles wat hij had, in het huis en op het veld.", "Gen 37:3": "En Israël had Jozef lief, boven al zijn zonen; want hij was hem een zoon van het ouderdom; en hij maakte hem een veelkleurige rok.", "Gen 32:7": "Toen werd Jakob erg bang en benauwd; en hij verdeelde het volk dat bij hem was, en de schapen, en de runderen, en de kamelen, in twee legers;", "Gen 27:39": "Toen antwoordde zijn vader Izak en zei tegen hem: Zie, de vettigheden van de aarde zullen uw woningen zijn, en van de dauw van de hemel van boven af zult u gezegend zijn.", "Gen 31:14": "Toen antwoordden Rachel en Lea, en zeiden tegen hem: Is er nog een deel of erfenis voor ons, in het huis van onze vader?", "Ps 107:41": "Maar Hij brengt de nooddruftige uit de verdrukking in een veilig verblijf, en maakt de huisgezinnen als kudden.", "Est 2:17": "En de koning beminde Esther boven alle vrouwen, en zij verkreeg genade en gunst bij hem, boven alle maagden; en hij zette de koninklijke kroon op haar hoofd, en hij maakte haar koningin in de plaats van Vasthi.", "Ps 34:5": "Daleth. Ik heb de HEERE gezocht, en Hij heeft mij geantwoord, en mij uit al mijn angsten gered.", "Hand 9:17": "En Ananias ging heen en kwam in het huis; en hij legde de handen op hem en zei: Saul, broeder! De Heere heeft mij gezonden, namelijk Jezus, Die u verschenen is op de weg waar u kwam, opdat u weer zou kunnen zien en met de Heilige Geest vervuld zou worden.", "Gen 27:27": "En hij kwam dichterbij, en hij kuste hem; toen rook hij de geur van zijn kleren, en zegende hem; en hij zei: Zie, de geur van mijn zoon is als de geur van het veld, dat de HEERE gezegend heeft.", "Gen 42:6": "Jozef nu was regent over dat land; hij was het die aan al het volk van het land verkocht; en Jozefs broers kwamen, en bogen zich voor hem, met het gezicht ter aarde.", "Openb 22:4": "En zij zullen Zijn aangezicht zien, en Zijn Naam zal op hun voorhoofden zijn.", "Ps 128:2": "Want u zult eten van het werk van uw handen; gelukkig zult u zijn, en het zal u goed gaan.", "Gen 29:30": "En hij kwam ook bij Rachel, en had ook Rachel liever dan Lea; en hij diende bij hem nog zeven andere jaren.", "Spr 21:1": "Het hart van de koning is in de hand van de HEERE als waterbeken. Hij neigt het tot alles wat Hij wil.", "Gen 19:1": "En die twee engelen kwamen 's avonds in Sodom aan; en Lot zat in de poort van Sodom; en toen Lot hen zag, stond hij op om hun tegemoet te gaan, en boog zich met het gezicht ter aarde.", "2 Sam 14:33": "Toen ging Joab naar de koning, en vertelde het hem. Toen riep hij Absalom, en hij kwam bij de koning, en boog zich voor hem op zijn gezicht ter aarde, voor het aangezicht van de koning; en de koning kuste Absalom.", "1 Sam 25:23": "Toen Abigaïl nu David zag, haastte zij zich, en kwam van de ezel af, en zij viel voor het aangezicht van David op haar aangezicht, en zij boog zich ter aarde.", "Ezech 34:16": "Het verlorene zal Ik zoeken, en het weggedrevene zal Ik terugbrengen, en het gebrokene zal Ik verbinden, en het zieke zal Ik sterken; maar het vette en het sterke zal Ik verdelgen, Ik zal ze weiden met oordeel.", "Gen 23:17-20": "Zo werd de akker van Efron, die in Machpela was, tegenover Mamre lag, de akker en de spelonk die daarin was, en al het geboomte dat op de akker stond, dat rondom in zijn hele gebied lag, aan Abraham toegewezen, Tot een bezitting, voor de ogen van de zonen van Heth, bij allen die de poort van zijn stad binnengingen. En daarna begroef Abraham zijn vrouw Sara in de spelonk van de akker van Machpela, tegenover Mamre, dat is Hebron, in het land Kanaän.", "Gen 4:9": "En de HEERE zei tegen Kaïn: Waar is Abel, uw broeder? En hij zei: Ik weet het niet; ben ik de hoeder van mijn broeder?", "2 Sam 19:39": "Toen nu heel het volk de Jordaan overgegaan was, en de koning ook overgegaan was, kuste de koning Barzillai, en zegende hem; en die keerde terug naar zijn woonplaats.", "Gen 33:1-12": "Jakob sloeg zijn ogen op en keek, en zie, Ezau kwam eraan, en vierhonderd man met hem. Toen verdeelde hij de kinderen onder Lea, en onder Rachel, en onder de twee dienstmaagden. En hij zette de dienstmaagden en hun kinderen vooraan; en Lea en haar kinderen daarachter; en Rachel en Jozef achteraan. En hij ging voor hen uit heen, en boog zich zeven keer ter aarde, totdat hij bij zijn broer kwam.", "Mark 4:33": "En door veel van zulke gelijkenissen sprak Hij het Woord tot hen, naarmate zij het konden horen.", "Gen 48:22": "En ik heb u één stuk land gegeven, boven uw broers; dat ik met mijn zwaard en met mijn boog uit de hand van de Amorieten genomen heb.", "Gen 43:28": "En zij zeiden: Het gaat goed met uw dienaar, onze vader, hij leeft nog; en zij neigden het hoofd en bogen zich neer.", "Ex 13:20": "Zo braken zij op uit Sukkoth; en zij sloegen hun kamp op in Etham, aan de rand van de woestijn.", "Ps 107:38": "En Hij zegent hen, zodat zij zeer meer worden, en hun vee vermindert Hij niet.", "Job 33:26": "Hij zal tot God ernstig bidden, Die in hem een welbehagen nemen zal, en zijn aangezicht met gejuich aanzien; want Hij zal de mens zijn gerechtigheid wedergeven.", "Gen 32:3": "En Jakob zond boden voor zich uit naar Ezau, zijn broer, naar het land Seir, de landstreek van Edom.", "Gen 30:17-20": "En God verhoorde Lea; en zij werd zwanger, en baarde Jakob de vijfde zoon. Toen zei Lea: God heeft mij mijn loon gegeven, omdat ik mijn dienstmaagd aan mijn man gegeven heb; en zij noemde zijn naam Issaschar. En Lea werd opnieuw zwanger, en zij baarde Jakob de zesde zoon.", "Ps 78:71": "Van achter de zogende schapen liet Hij hem komen, om Jakob te weiden, Zijn volk, en Israël, Zijn erfenis.", "Spr 30:15": "De bloedzuiger heeft twee dochters: Geef, geef! Deze drie dingen worden niet verzadigd; ja, vier zeggen niet: Het is genoeg!", "Richt 1:15": "En zij zei tegen hem: Geef mij een zegen; omdat u mij een dor land gegeven hebt, geef mij ook waterbronnen. Toen gaf Kaleb haar hoger gelegen bronnen en lager gelegen const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen bij dit vers.</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}
</script>
</body>
</html>
