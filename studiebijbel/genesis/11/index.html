 de vloed.", "11": "En Sem leefde, nadat hij Arfachsad verwekt had, vijfhonderd jaar; en hij verwekte zonen en dochters.", "12": "En Arfachsad leefde vijfendertig jaar, en hij verwekte Selah.", "13": "En Arfachsad leefde, nadat hij Selah verwekt had, vierhonderd en drie jaar; en hij verwekte zonen en dochters.", "14": "En Selah leefde dertig jaar, en hij verwekte Heber.", "15": "En Selah leefde, nadat hij Heber verwekt had, vierhonderd en drie jaar, en hij verwekte zonen en dochters.", "16": "En Heber leefde vierendertig jaar, en verwekte Peleg.", "17": "En Heber leefde, nadat hij Peleg verwekt had, vierhonderd en dertig jaar; en hij verwekte zonen en dochters.", "18": "En Peleg leefde dertig jaar, en hij verwekte Rehu.", "19": "En Peleg leefde, nadat hij Rehu verwekt had, tweehonderd en negen jaar; en hij verwekte zonen en dochters.", "20": "En Rehu leefde tweeëndertig jaar, en hij verwekte Serug.", "21": "En Rehu leefde, nadat hij Serug verwekt had, tweehonderd en zeven jaar; en hij verwekte zonen en dochters.", "22": "En Serug leefde dertig jaar, en verwekte Nahor.", "23": "En Serug leefde, nadat hij Nahor verwekt had, tweehonderd jaar; en hij verwekte zonen en dochters.", "24": "En Nahor leefde negenentwintig jaar, en verwekte Terah.", "25": "En Nahor leefde, nadat hij Terah verwekt had, honderd en negentien jaar; en hij verwekte zonen en dochters.", "26": "En Terah leefde zeventig jaar, en verwekte Abram, Nahor en Haran.", "27": "En dit zijn de geboorten van Terah: Terah verwekte Abram, Nahor en Haran; en Haran verwekte Lot.", "28": "En Haran stierf voor het aangezicht van zijn vader Terah, in het land van zijn geboorte, in Ur der Chaldeeën.", "29": "En Abram en Nahor namen voor zichzelf vrouwen; de naam van Abrams vrouw was Sarai, en de naam van Nahors vrouw was Milka, een dochter van Haran, vader van Milka, en vader van Jiska.", "30": "En Sarai was onvruchtbaar; zij had geen kind.", "31": "En Terah nam Abram, zijn zoon, en Lot, Harans zoon, de zoon van zijn zoon, en Sarai, zijn schoondochter, de vrouw van zijn zoon Abram, en zij trokken met hen uit Ur der Chaldeeën, om naar het land Kanaän te gaan; en zij kwamen tot Haran, en woonden daar.", "32": "En de dagen van Terah waren tweehonderd en vijf jaar, en Terah stierf te Haran."}, "SV": {"1": "En de ganse aarde was van enerlei spraak en enerlei woorden.", "2": "Maar het geschiedde, als zij tegen het oosten togen, dat zij een laagte vonden in het land Sinear; en zij woonden aldaar.", "3": "En zij zeiden een ieder tot zijn naaste: Kom aan, laat ons tichelen strijken, en wel doorbranden! En de tichel was hun voor steen, en het lijm was hun voor leem.", "4": "En zij zeiden: Kom aan, laat ons voor ons een stad bouwen, en een toren, welks opperste in den hemel *zij*, en laat ons een naam voor ons maken, opdat wij niet misschien over de ganse aarde verstrooid worden!", "5": "Toen kwam de HEERE neder, om te bezien de stad en den toren, die de kinderen der mensen bouwden.", "6": "En de HEERE zeide: Ziet, zij *zijn* enerlei volk, en *hebben* allen enerlei spraak; en dit *is* *het*, dat zij beginnen te maken; maar nu, zoude hun niet afgesneden worden al wat zij bedacht hebben te maken?", "7": "Kom aan, laat Ons nedervaren, en laat Ons hun spraak aldaar verwarren, opdat iegelijk de spraak zijns naasten niet hore.", "8": "Alzo verstrooide hen de HEERE van daar over de ganse aarde; en zij hielden op de stad te bouwen.", "9": "Daarom noemde men haar naam Babel; want aldaar verwarde de HEERE de spraak der ganse aarde, en van daar verstrooide hen de HEERE over de ganse aarde.", "10": "Deze *zijn* de geboorten van Sem: Sem was honderd jaren oud, en gewon, Arfachsad, twee jaren na den vloed.", "11": "En Sem leefde, nadat hij Arfachsad gewonnen had, vijfhonderd jaren; en hij gewon zonen en dochteren.", "12": "En Arfachsad leefde vijf en dertig jaren, en hij gewon Selah.", "13": "En Arfachsad leefde, nadat hij, Selah gewonnen had, vierhonderd en drie jaren; en hij gewon zonen en dochteren.", "14": "En Selah leefde dertig jaren, en hij gewon Heber.", "15": "En Selah leefde, nadat hij Heber gewonnen had, vierhonderd en drie jaren, en hij gewon zonen en dochteren.", "16": "En Heber leefde vier en dertig jaren, en gewon Peleg.", "17": "En Heber leefde, nadat hij Peleg gewonnen had, vierhonderd en dertig jaren; en hij gewon zonen en dochteren.", "18": "En Peleg leefde dertig jaren, en hij gewon Rehu.", "19": "En Peleg leefde, nadat hij Rehu gewonnen had, tweehonderd en negen jaren; en hij gewon zonen en dochteren.", "20": "En Rehu leefde twee en dertig jaren, en hij gewon Serug.", "21": "En Rehu leefde, nadat hij Serug gewonnen had, tweehonderd en zeven jaren; en hij gewon zonen en dochteren.", "22": "En Serug leefde dertig jaren, en gewon Nahor.", "23": "En Serug leefde, nadat hij Nahor gewonnen had, tweehonderd jaren; en hij gewon zonen en dochteren.", "24": "En Nahor leefde negen en twintig jaren, en gewon Terah.", "25": "En Nahor leefde, nadat hij Terah gewonnen had, honderd en negentien jaren; en hij gewon zonen en dochteren.", "26": "En Terah leefde zeventig jaren, en gewon Abram, Nahor en Haran.", "27": "En deze *zijn* de geboorten van Terah: Terah gewon Abram, Nahor en Haran; en Haran gewon Lot.", "28": "En Haran stierf voor het aangezicht zijns vaders Terah, in het land zijner geboorte, in Ur der Chaldeen.", "29": "En Abram en Nahor namen zich vrouwen; de naam van Abrams huisvrouw was Sarai, en de naam van Nahors huisvrouw was Milka, een dochter van Haran, vader van Milka, en vader van Jiska.", "30": "En Sarai was onvruchtbaar; zij had geen kind.", "31": "En Terah nam Abram, zijn zoon, en Lot, Harans zoon, zijns zoons zoon, en Sarai, zijn schoondochter, de huisvrouw van zijn zoon Abram, en zij togen met hen uit Ur der Chaldeen, om te gaan naar het land Kanaän; en zij kwamen tot Haran, en woonden aldaar.", "32": "En de dagen van Terah waren tweehonderd en vijf jaren, en Terah stierf te Haran."}, "KJV": {"1": "And the whole earth was of one language, and of one speech.", "2": "And it came to pass, as they journeyed from the east, that they found a plain in the land of Shinar; and they dwelt", "3": "And they said one to another, Go to, let us make brick, and burn them throughly. And they had brick for stone, and slime had they for morter.", "4": "And they said, Go to, let us build us a city and a tower, whose top *may reach* unto heaven; and let us make us a name, lest we be scattered abroad upon the face of the whole earth.", "5": "And the LORD came down to see the city and the tower, which the children of men builded.", "6": "And the LORD said, Behold, the people *is* one, and they have all one language; and this they begin to do: and now nothing will be restrained from them, which they have imagined to do.", "7": "Go to, let us go down, and there confound their language, that they may not understand one another's speech.", "8": "So the LORD scattered them abroad from thence upon the face of all the earth: and they left off to build the city.", "9": "Therefore is the name of it called Babel; because the LORD did there confound the language of all the earth: and from thence did the LORD scatter them abroad upon the face of all the earth.", "10": "These *are* the generations of Shem: Shem *was* an hundred years old, and begat Arphaxad two years after the flood:", "11": "And Shem lived after he begat Arphaxad five hundred years, and begat sons and daughters.", "12": "And Arphaxad lived five and thirty years, and begat Salah:", "13": "And Arphaxad lived after he begat Salah four hundred and three years, and begat sons and daughters.", "14": "And Salah lived thirty years, and begat Eber:", "15": "And Salah lived after he begat Eber four hundred and three years, and begat sons and daughters.", "16": "And Eber lived four and thirty years, and begat Peleg:", "17": "And Eber lived after he begat Peleg four hundred and thirty years, and begat sons and daughters.", "18": "And Peleg lived thirty years, and begat Reu:", "19": "And Peleg lived after he begat Reu two hundred and nine years, and begat sons and daughters.", "20": "And Reu lived two and thirty years, and begat Serug:", "21": "And Reu lived after he begat Serug two hundred and seven years, and begat sons and daughters.", "22": "And Serug lived thirty years, and begat Nahor:", "23": "And Serug lived after he begat Nahor two hundred years, and begat sons and daughters.", "24": "And Nahor lived nine and twenty years, and begat Terah:", "25": "And Nahor lived after he begat Terah an hundred and nineteen years, and begat sons and daughters.", "26": "And Terah lived seventy years, and begat Abram, Nahor, and Haran.", "27": "Now these *are* the generations of Terah: Terah begat Abram, Nahor, and Haran; and Haran begat Lot.", "28": "And Haran died before his father Terah in the land of his nativity, in Ur of the Chaldees.", "29": "And Abram and Nahor took them wives: the name of Abram's wife *was* Sarai; and the name of Nahor's wife, Milcah, the daughter of Haran, the father of Milcah, and the father of Iscah.", "30": "But Sarai was barren; she *had* no child.", "31": "And Terah took Abram his son, and Lot the son of Haran his son's son, and Sarai his daughter in law, his son Abram's wife; and they went forth with them from Ur of the Chaldees, to go into the land of Canaan; and they came unto Haran, and dwelt", "32": "And the days of Terah were two hundred and five years: and Terah died in Haran."}}, "tsk": {"1": [{"kopje": "had", "refs": ["Jes 19:18", "Zef 3:9", "Hand 2:6"]}], "2": [{"kopje": "naar het oosten", "refs": ["Gen 13:11"]}, {"kopje": "Sinear", "refs": ["Gen 11:9", "Gen 10:10", "Gen 14:1", "Jes 11:11", "Dan 1:2", "Zach 5:11"]}], "3": [{"kopje": "zeiden tegen elkaar", "refs": ["Gen 11:4", "Gen 11:7", "Ps 64:6", "Spr 1:11", "Pred 2:1", "Jes 5:5", "Jes 41:6", "Jes 41:7", "Jak 4:13", "Jak 5:1", "Hebr 3:13", "Hebr 10:24"]}, {"kopje": "tichels", "refs": ["Ex 1:14", "Ex 5:7-18", "2 Sam 12:31", "Jes 9:9", "Jes 65:3", "Nahum 3:1 . Also called Charran", "href": "../../nave/h/?hl=Gen.11.32#i8436", "refs": [], "kinderen": [{"label": "Death of Terah at", "href": "../../nave/h/?hl=Gen.11.32#i8438", "refs": [{"disp": "Gen 11:32", "href": "../../genesis/11/#v32", "ref": "Gen 11:32", "svLabel": null}], "kinderen": []}]}]}, {"topic": "Longevity", "href": "../../nave/l/#t-longevity", "kinderen": [{"label": "Instances Of", "href": "../../nave/l/?hl=Gen.11.32#i12774", "refs": [], "kinderen": [{"label": "Terah, two-hundred and five years", "href": "../../nave/l/?hl=Gen.11.32#i12793", "refs": [{"disp": "Gen 11:32", "href": "../../genesis/11/#v32", "ref": "Gen 11:32", "svLabel": null}], "kinderen": []}]}]}]}}, "extern": {"Ex 5:18": "Ga dan nu heen, werk; doch stro zal u niet gegeven worden, evenwel zult u het aantal tichelstenen leveren.", "Gen 24:24": "En zij had tegen hem gezegd: Ik ben de dochter van Bethuël, de zoon van Milka, die zij Nahor gebaard heeft.", "Gen 20:3": "Maar God kwam 's nachts in een droom tot Abimelech, en zei tegen hem: Zie, u bent dood vanwege de vrouw die u weggenomen hebt, want zij is met een man getrouwd.", "Gen 17:8": "En Ik zal u en uw nageslacht na u het land waar u als vreemdeling verblijft geven, het hele land Kanaän, tot eeuwig eigendom; en Ik zal hun tot een God zijn.", "Gen 5:4": "En Adams dagen, nadat hij Seth verwekt had, zijn achthonderd jaren geweest; en hij verwekte zonen en dochters.", "Hebr 11:8": "Door het geloof is Abraham, toen hij geroepen werd, gehoorzaam geweest om uit te gaan naar de plaats die hij tot een erfdeel zou ontvangen; en hij is uitgegaan zonder te weten waar hij komen zou.", "Gen 11:10-13": "Dit zijn de geboorten van Sem: Sem was honderd jaar oud, en verwekte Arfachsad, twee jaar na de vloed. En Sem leefde, nadat hij Arfachsad verwekt had, vijfhonderd jaar; en hij verwekte zonen en dochters. En Arfachsad leefde vijfendertig jaar, en hij verwekte Selah.", "Dan 1:2": "En de Heere gaf Jojakim, de koning van Juda, in zijn hand, alsook een deel van de voorwerpen van het huis van God; en hij bracht ze naar het land Sinear, naar het huis van zijn god; en de voorwerpen bracht hij naar het schathuis van zijn god.", "Hab 1:13": "U bent te rein van ogen om het kwade te zien, en de kwelling kunt U niet aanschouwen; waarom zou U aanschouwen wie trouweloos handelen? Waarom zou U zwijgen, als de goddeloze verslindt wie rechtvaardiger is dan hij?", "Luk 3:34-38": "de zoon van Jakob, de zoon van Izak, de zoon van Abraham, de zoon van Thara, de zoon van Nachor, de zoon van Saruch, de zoon van Ragau, de zoon van Falek, de zoon van Heber, de zoon van Sala, de zoon van Kaïnan, de zoon van Arfaxad, de zoon van Sem, de zoon van Noach, de zoon van Lamech,", "Ps 144:12": "opdat onze zonen zijn als planten, die groot geworden zijn in hun jeugd; onze dochters als hoekstenen, uitgehouwen naar het voorbeeld van een paleis.", "1 Petr 3:12": "Want de ogen van de Heere zijn over de rechtvaardigen, en Zijn oren gericht op hun gebed; maar het aangezicht van de Heere is tegen hen die kwaad doen.", "Jes 5:5": "Nu dan, Ik zal u nu bekendmaken wat Ik met Mijn wijngaard doen zal: Ik zal zijn omheining wegnemen, zodat hij kaalgevreten wordt; zijn muur zal Ik afbreken, zodat hij vertrapt wordt.", "Gen 10:21-31": "Verder zijn er aan Sem zonen geboren; hijzelf is ook de vader van alle zonen van Heber, broer van Jafeth, de oudste. Sems zonen waren Elam, en Assur, en Arfachsad, en Lud, en Aram. En Arams zonen waren Uz, en Hul, en Gether, en Maz.", "Gen 10:1": "Dit zijn de geboorten van de zonen van Noach: Sem, Cham en Jafeth; en hun werden zonen geboren na de vloed.", "Gen 25:21": "En Izak bad de HEERE vurig voor zijn vrouw; want zij was onvruchtbaar; en de HEERE liet Zich door hem verbidden, zodat Rebekka, zijn vrouw, zwanger werd.", "Luk 1:7": "En zij hadden geen kind, omdat Elizabet onvruchtbaar was, en zij waren beiden al ver op hun dagen gekomen.", "Gen 8:21": "En de HEERE rook die liefelijke reuk, en de HEERE zei in Zijn hart: Ik zal voortaan de aardbodem niet meer vervloeken om de mens; want het gedichtsel van het hart van de mens is slecht van zijn jeugd aan; en Ik zal voortaan niet meer al het levende slaan, zoals Ik gedaan heb.", "Deut 1:28": "Waarheen zouden wij optrekken? Onze broeders hebben ons hart doen smelten, en zeiden: Het is een volk, groter en langer dan wij; de steden zijn groot, en versterkt tot aan de hemel toe; ook hebben wij daar kinderen van de Enakieten gezien.", "Deut 9:1": "Hoor, Israël! U zult vandaag over de Jordaan gaan, om binnen te komen bij volken om die te erven, die groter en sterker zijn dan u; steden die groot zijn en tot in de hemel versterkt;", "Deut 28:49": "De HEERE zal tegen u een volk laten opkomen van ver, van het einde van de aarde, zoals een arend vliegt; een volk waarvan u de taal niet zult verstaan;", "Ps 121:4": "Zie, de Bewaarder van Israël zal niet sluimeren, ook niet slapen.", "Gen 12:13": "Zeg toch: U bent mijn zuster; opdat het mij goed gaat om u, en ik in leven blijf om uwentwil.", "Gen 10:24": "En Arfachsad verwekte Selah, en Selah verwekte Heber.", "Jes 14:32": "Wat zal men dan antwoorden aan de boden van het volk? Dat de HEERE Sion gegrond heeft, opdat de bedrukten van Zijn volk daarin een toevlucht zouden hebben.", "Gen 10:19": "En het gebied van de Kanaänieten was van Sidon, in de richting van Gerar tot aan Gaza toe; in de richting van Sodom en Gomorra, en Adama, en Zoboim, tot aan Lasa toe.", "Ex 32:14": "Toen kreeg de HEERE berouw over het kwaad, dat Hij gezegd had Zijn volk te zullen aandoen.", "Ps 2:1-4": "Waarom woeden de heidenen, en bedenken de volken iets zinloos? De koningen van de aarde stellen zich op, en de vorsten beraadslagen samen tegen de HEERE, en tegen Zijn Gezalfde, en zeggen: Laat ons hun banden verscheuren, en hun touwen van ons afwerpen.", "Gen 18:12": "Zo lachte Sara bij zichzelf en zei: Zal ik nog wellust hebben, nu ik oud geworden ben, en mijn heer ook oud is?", "Jer 5:15": "Zie, Ik zal over u een volk van verre brengen, o huis van Israël! spreekt de HEERE; het is een sterk volk, het is een zeer oud volk, een volk waarvan u de taal niet zult kennen, en niet zult horen wat het spreken zal.", "Ps 113:9": "Die de onvruchtbare vrouw doet wonen als moeder in een huisgezin, een blijde moeder van kinderen. Halleluja!", "Spr 10:7": "De gedachtenis aan de rechtvaardige zal tot zegening zijn; maar de naam van de goddelozen zal wegrotten.", "Ps 36:8": "Hoe dierbaar is Uw goedertierenheid, o God! Daarom nemen de mensenkinderen onder de schaduw van Uw vleugels toevlucht.", "1 Kron 1:18": "Arfachsad verwekte Selah, en Selah verwekte Heber.", "Ps 127:4": "Zoals de pijlen zijn in de hand van een held, zo zijn de zonen van de jeugd.", "Gen 11:10-32": "Dit zijn de geboorten van Sem: Sem was honderd jaar oud, en verwekte Arfachsad, twee jaar na de vloed. En Sem leefde, nadat hij Arfachsad verwekt had, vijfhonderd jaar; en hij verwekte zonen en dochters. En Arfachsad leefde vijfendertig jaar, en hij verwekte Selah.", "Gen 16:1": "Sarai, Abrams vrouw, kreeg geen kinderen van hem; en zij had een Egyptische dienstmaagd, wier naam Hagar was.", "Richt 13:2": "Er was een man uit Zora, uit het geslacht van een Daniet, wiens naam Manoach was; en zijn vrouw was onvruchtbaar en had geen kinderen gebaard.", "Gen 11:29-31": "En Abram en Nahor namen voor zichzelf vrouwen; de naam van Abrams vrouw was Sarai, en de naam van Nahors vrouw was Milka, een dochter van Haran, vader van Milka, en vader van Jiska. En Sarai was onvruchtbaar; zij had geen kind. En Terah nam Abram, zijn zoon, en Lot, Harans zoon, de zoon van zijn zoon, en Sarai, zijn schoondochter, de vrouw van zijn zoon Abram, en zij trokken met hen uit Ur der Chaldeeën, om naar het land Kanaän te gaan; en zij kwamen tot Haran, en woonden daar.", "Gen 6:6": "Toen had de HEERE er berouw van, dat Hij de mens op de aarde gemaakt had, en het smartte Hem aan Zijn hart.", "Joz 24:2": "Toen zei Jozua tegen het hele volk: Zo zegt de HEERE, de God van Israël: Aan de overkant van de rivier hebben uw vaders vanouds gewoond, namelijk Terah, de vader van Abraham, en de vader van Nahor; en zij hebben andere goden gediend.", "Ex 14:6": "En hij spande zijn wagen aan, en nam zijn volk met zich mee.", "Gen 11:18-21": "En Peleg leefde dertig jaar, en hij verwekte Rehu. En Peleg leefde, nadat hij Rehu verwekt had, tweehonderd en negen jaar; en hij verwekte zonen en dochters. En Rehu leefde tweeëndertig jaar, en hij verwekte Serug.", "Ex 1:11-14": "En zij stelden leiders van dwangarbeid over hen aan, om hen te onderdrukken met hun lasten; want men bouwde voor Farao voorraadsteden, Pitom en Raamses. Maar hoe meer zij hen onderdrukten, hoe meer het vermeerderde, en hoe meer het uitbreidde; zodat zij verontrust waren vanwege de kinderen van Israël. En de Egyptenaren lieten de kinderen van Israël dienen met hardheid;", "Hand 17:26": "En Hij heeft uit één bloed heel het geslacht van de mensen gemaakt, om op de hele aardbodem te wonen, en Hij heeft de vastgestelde tijden bepaald, en de grenzen van hun woongebied;", "Luk 1:51": "Hij heeft een krachtig werk gedaan met Zijn arm; Hij heeft de hoogmoedigen verstrooid in de gedachten van hun hart.", "1 Kron 1:27": "Abram; die is Abraham.", "Gen 6:14-16": "Maak u een ark van goferhout; met kamers zult u deze ark maken; en u zult die van binnen en van buiten met pek bepekken. En zo is het, dat u haar maken zult: driehonderd ellen zij de lengte van de ark, vijftig ellen haar breedte, en dertig ellen haar hoogte. U zult een venster aan de ark maken, en zult het afwerken tot een el van boven; en de deur van de ark zult u in haar zijde zetten; u zult ze met een onderste, tweede en derde verdieping maken.", "Job 5:13": "Hij vangt de wijzen in hun arglistigheid; zodat de raad van de verdraaiden overhaast valt.", "Deut 32:8": "Toen de Allerhoogste aan de volken de erfenis uitdeelde, toen Hij Adams kinderen van elkaar scheidde, heeft Hij de grenzen van de volken vastgesteld naar het getal van de kinderen van Israël.", "Gen 1:28": "En God zegende hen, en God zei tegen hen: Wees vruchtbaar en word talrijk, en vervul de aarde en onderwerp haar, en heers over de vissen van de zee, en over het gevogelte van de hemel, en over al de dieren die op de aarde kruipen!", "Ex 3:8": "Daarom ben Ik neergekomen, om het te verlossen uit de hand van de Egyptenaren, en het op te voeren uit dit land, naar een goed en ruim land, naar een land dat overvloeit van melk en honing, naar de plaats van de Kanaänieten, en de Hethieten, en de Amorieten, en de Ferezieten, en de Hevieten, en de Jebusieten.", "Dan 4:30": "Sprak de koning, en zei: Is dit niet het grote Babel, dat ik gebouwd heb tot een huis van het koninkrijk, door de sterkte van mijn macht, en tot eer van mijn heerlijkheid!", "Gen 19:29": "En het gebeurde, toen God de steden van deze vlakte verwoestte, dat God aan Abraham dacht, en Hij leidde Lot weg uit het midden van deze omkering, toen Hij de steden omkeerde waarin Lot gewoond had.", "Gen 16:2": "En Sarai zei tegen Abram: Zie toch, de HEERE heeft mij belet kinderen te krijgen; ga toch naar mijn dienstmaagd, misschien zal ik uit haar gebouwd worden. En Abram luisterde naar de stem van Sarai.", "Ex 2:3": "Maar toen zij hem niet langer verbergen kon, nam zij voor hem een mandje van biezen, en bestreek het met lijm en met pek; en zij legde het kind daarin, en legde het in de biezen, aan de oever van de rivier.", "Gen 14:1": "En het gebeurde in de dagen van Amrafel, de koning van Sinear, van Arioch, de koning van Ellasar, van Kedor-laomer, de koning van Elam, en van Tideal, de koning van de volken;", "Gen 13:11": "Zo koos Lot voor zich de hele vlakte van de Jordaan, en Lot trok naar het oosten; en zij werden van elkaar gescheiden.", "Gen 2:19": "Want toen de HEERE God uit de aarde alle dieren van het veld, en al het gevogelte van de hemel gevormd had, bracht Hij ze tot Adam, om te zien hoe hij ze noemen zou; en zoals Adam elke levende ziel noemen zou, dat zou haar naam zijn.", "Jak 4:13": "Kom nu, u die zegt: Wij zullen vandaag of morgen naar die en die stad reizen, en daar een jaar doorbrengen, en handel drijven, en winst maken.", "1 Kron 21:15": "En God zond een engel naar Jeruzalem, om die te verderven; en toen hij haar verdierf, zag de HEERE het, en het berouwde Hem over dat kwaad; en Hij zei tegen de verdervende engel: Het is genoeg, trek nu uw hand terug. De engel van de HEERE nu stond bij de dorsvloer van Ornan, de Jebusiet.", "Ex 31:17": "Hij zal tussen Mij en tussen de kinderen van Israël een teken in eeuwigheid zijn; omdat de HEERE, in zes dagen, de hemel en de aarde gemaakt heeft, en op de zevende dag gerust heeft en Zich verkwikt heeft.", "Gen 9:7": "Maar u, wees vruchtbaar en word talrijk; breng overvloedig voort op de aarde, en word talrijk daarop.", "Jer 51:64": "En zult zeggen: Zo zal Babel zinken, en niet meer opkomen, vanwege het kwaad dat Ik over haar zal brengen, en zij zullen moe worden. Tot hiertoe zijn de woorden van Jeremia.", "Ps 92:10": "Want zie, Uw vijanden, o HEERE! Want zie, Uw vijanden zullen vergaan; al de werkers van de ongerechtigheid zullen verstrooid worden.", "Gen 21:2": "En Sara werd zwanger, en baarde Abraham een zoon in zijn ouderdom, op de vastgestelde tijd die God hem gezegd had.", "Ps 68:18": "Gods wagens zijn tweemaal tienduizend, de duizenden verdubbeld. De Heere is onder hen, een Sinaï in heiligheid!", "Hand 2:6": "En toen deze stem gebeurd was, kwam de menigte samen en raakte in verwarring, want ieder hoorde hen in zijn eigen taal spreken.", "Gen 10:22": "Sems zonen waren Elam, en Assur, en Arfachsad, en Lud, en Aram.", "Ps 128:3": "Uw vrouw zal zijn als een vruchtbare wijnstok aan de zijkant van uw huis; uw kinderen als olijfplanten rondom uw tafel.", "Ex 5:7": "U zult voortaan aan deze mensen geen stro meer geven, voor het maken van de tichelstenen, zoals gisteren en eergisteren; laat hen zelf heengaan, en stro voor zichzelf verzamelen.", "Ps 55:10": "Verslind hen, Heere! verdeel hun tong; want ik zie geweld en twist in de stad.", "Jes 41:6": "De een hielp de ander, en zei tegen zijn metgezel: Wees sterk!", "Num 11:25": "Toen kwam de HEERE neer in de wolk, en sprak tot hem, en Hij nam van de Geest die op hem was, en legde die op de zeventig mannen, de oudsten; en het gebeurde, toen de Geest op hen rustte, dat zij profeteerden, maar daarna niet meer.", "Num 24:24": "En de schepen van de kust van de Chitteeërs zullen Assur plagen, zij zullen ook Heber plagen; en ook hij zal voor altijd ten verderve zijn.", "Gen 10:21": "Verder zijn er aan Sem zonen geboren; hijzelf is ook de vader van alle zonen van Heber, broer van Jafeth, de oudste.", "Jes 65:3": "Een volk dat Mij voortdurend tergt in Mijn aangezicht, terwijl het in de hoven offert en op tichelstenen wierook brandt;", "1 Sam 1:2": "En hij had twee vrouwen; de naam van de ene was Hanna, en de naam van de andere was Peninna. Peninna nu had kinderen, maar Hanna had geen kinderen.", "Gen 11:12-15": "En Arfachsad leefde vijfendertig jaar, en hij verwekte Selah. En Arfachsad leefde, nadat hij Selah verwekt had, vierhonderd en drie jaar; en hij verwekte zonen en dochters. En Selah leefde dertig jaar, en hij verwekte Heber.", "Gen 11:2-6": "En het gebeurde, toen zij naar het oosten trokken, dat zij een laagte vonden in het land Sinear; en zij woonden daar. En zij zeiden tegen elkaar: Kom aan, laten we tichels strijken en ze goed doorbranden! En de tichel was voor hen in plaats van steen, en het lijm was voor hen in plaats van leem. En zij zeiden: Kom aan, laten we voor onszelf een stad bouwen, en een toren, waarvan de top tot in de hemel reikt, en laten we voor onszelf een naam maken, opdat wij niet misschien over de hele aarde verstrooid worden!", "Gen 35:13": "Toen voer God van hem op, in die plaats waar Hij met hem gesproken had.", "Gen 10:10": "En het begin van zijn rijk was Babel, en Erech, en Accad, en Calne, in het land Sinear.", "Gen 22:20": "En het gebeurde na deze dingen dat men Abraham berichtte: Zie, Milka heeft ook zonen gebaard aan Nahor, uw broer:", "1 Kron 1:17": "De kinderen van Sem waren Elam, en Assur, en Arfachsad, en Lud, en Aram, en Uz, en Hul, en Gether, en Mesech.", "Zef 3:9": "Zeker, dan zal Ik tot de volken een reine spraak wenden; opdat zij allen de Naam van de HEERE aanroepen, opdat zij Hem dienen met één schouder³.", "Gen 18:33": "Toen ging de HEERE weg, toen Hij geëindigd had tot Abraham te spreken; en Abraham keerde terug naar zijn plaats.", "Ps 2:4": "Die in de hemel woont, zal lachen; de Heere zal hen bespotten.", "Gen 10:25": "En aan Heber werden twee zonen geboren; de naam van de één was Peleg, want in zijn dagen is de aarde verdeeld; en de naam van zijn broer was Joktan.", "Ezech 1:28": "Zoals de gedaante van de boog die in de wolk is op de dag van de regen, zo was de gedaante van de glans rondom; dit was de gedaante van de gelijkenis van de heerlijkheid van de HEERE; en toen ik het zag, viel ik op mijn gezicht, en ik hoorde een stem van Iemand Die sprak.", "Gen 13:12": "Abram woonde dan in het land Kanaän; en Lot woonde in de steden van de vlakte, en sloeg zijn tenten op tot aan Sodom toe.", "Pred 11:9": "Verblijd u, jongeman, in uw jeugd, en laat uw hart zich vermaken in de dagen van uw jongelingschap, en wandel in de wegen van uw hart, en in wat uw ogen zien; maar weet dat God u, om al deze dingen, voor het gericht zal doen komen.", "Luk 3:35": "de zoon van Saruch, de zoon van Ragau, de zoon van Falek, de zoon van Heber, de zoon van Sala,", "Gen 5:4-32": "En Adams dagen, nadat hij Seth verwekt had, zijn achthonderd jaren geweest; en hij verwekte zonen en dochters. Zo waren al de dagen van Adam, die hij leefde, negenhonderd en dertig jaren; en hij stierf. En Seth leefde honderdenvijf jaren, en hij verwekte Enos.", "2 Petr 2:7": "en de rechtvaardige Lot, die vermoeid was door de losbandige levenswijze van de goddeloze mensen, daaruit verlost heeft;", "1 Kron 1:4-27": "Noach, Sem, Cham en Jafeth. De kinderen van Jafeth waren Gomer, en Magog, en Madai, en Javan, en Tubal, en Mesech, en Tiras. En de kinderen van Gomer waren Askenaz, en Difath, en Thogarma.", "Jes 19:18": "Op die dag zullen er vijf steden in Egypteland zijn, die de taal van Kanaän spreken, en zweren bij de HEERE van de heerscharen; een zal genoemd worden een stad der verstoring.", "Joh 5:44": "Hoe kunt u geloven, u die eer van elkaar aanneemt, en de eer die van God alleen is, niet zoekt?", "Gen 22:20-23": "En het gebeurde na deze dingen dat men Abraham berichtte: Zie, Milka heeft ook zonen gebaard aan Nahor, uw broer: Uz, zijn eerstgeborene, en Buz, zijn broer, en Kemuël, de vader van Aram, En Chesed, en Hazo, en Pildas, en Jidlaf, en Bethuël;", "Jes 41:7": "En de werkmeester versterkte de goudsmid; hij die met de hamer glad maakt, hem die op het aambeeld slaat, en zei van het soldeersel: Het is goed; daarna maakt hij het vast met spijkers, zodat het niet wankelt.", "Hand 7:2-4": "En hij zei: Mannen, broeders en vaders, luister: de God van de heerlijkheid verscheen aan onze vader Abraham, toen hij nog in Mesopotamië was, voordat hij in Haran woonde, en zei tegen hem: Ga uit uw land en uit uw familie, en kom in een land dat Ik u wijzen zal. Toen ging hij weg uit het land van de Chaldeeën, en woonde in Haran. En vandaar, nadat zijn vader gestorven was, bracht Hij hem over naar dit land, waarin u nu woont.", "Gen 30:2": "Toen ontstak Jakobs toorn tegen Rachel, en hij zei: Ben ik dan in de plaats van God, Die de vrucht van uw buik van u geweerd heeft?", "Gen 11:14-26": "En Selah leefde dertig jaar, en hij verwekte Heber. En Selah leefde, nadat hij Heber verwekt had, vierhonderd en drie jaar, en hij verwekte zonen en dochters. En Heber leefde vierendertig jaar, en verwekte Peleg.", "Ps 49:12-14": "Hun diepste gedachte is dat hun huizen er voor eeuwig zullen zijn, hun woningen van geslacht tot geslacht; zij noemen de landen naar hun namen. De mens echter, die in aanzien is, blijft niet; hij wordt gelijk aan de dieren, die vergaan. Deze weg van hen is een dwaasheid van hen; toch hebben hun nakomelingen welbehagen in hun woorden. Sela.", "Ps 128:4": "Zie, zo zal die man zeker gezegend worden, die de HEERE vreest.", "Ps 31:3": "Neig Uw oor tot mij, red mij haastig; wees mij tot een sterke Rotssteen, tot een zeer vast Huis, om mij te behouden.", "Gen 28:13": "En zie, de HEERE stond boven op de ladder en zei: Ik ben de HEERE, de God van uw vader Abraham, en de God van Izak; dit land, waarop u ligt te slapen, zal Ik aan u geven, en aan uw nageslacht.", "Jak 5:1": "Welaan nu, u rijken, huil en jammer over uw ellenden, die over u komen.", "Gen 29:5": "En hij zei tegen hen: Kent u Laban, de zoon van Nahor? En zij zeiden: Wij kennen hem.", "Ps 33:6": "Door het Woord van de HEERE zijn de hemelen gemaakt, en door de Geest van Zijn mond heel hun leger.", "2 Sam 24:16": "Toen nu de engel zijn hand uitstrekte over Jeruzalem om haar te verderven, kreeg de HEERE berouw over dat kwaad, en Hij zei tegen de engel die het verderf onder het volk aanrichtte: Het is genoeg, trek uw hand nu terug. De engel van de HEERE was nu bij de dorsvloer van Arauna, de Jebusiet.", "Ex 20:5": "U zult zich daarvoor niet buigen, en ze niet dienen; want Ik, de HEERE, uw God, ben een ijverig God, Die de misdaad van de vaders bezoek aan de kinderen, aan het derde en aan het vierde geslacht van hen die Mij haten;", "Jer 50:1": "Het woord dat de HEERE gesproken heeft tegen Babel, tegen het land van de Chaldeeën, door de dienst van de profeet Jeremia.", "Gen 24:47": "Toen vroeg ik haar, en zei: Van wie bent u de dochter? En zij zei: De dochter van Bethuël, de zoon van Nahor, die Milka hem gebaard heeft. Toen legde ik het voorhoofdsieraad op haar gezicht, en de armringen aan haar handen;", "Hebr 10:24": "en laten wij op elkaar letten, om elkaar aan te sporen tot liefde en goede werken;", "Gen 24:15": "En het gebeurde, voordat hij klaar was met spreken, zie, dat Rebekka naar buiten kwam, die geboren was aan Bethuël, de zoon van Milka, de vrouw van Nahor, de broer van Abraham; en zij had haar kruik op haar schouder.", "Ezech 1:24": "En toen zij gingen, hoorde ik het geruis van hun vleugels, als het geruis van veel water, als de stem van de Almachtige, als het geluid van spreken, als het gedreun van een leger; als zij stonden, lieten zij hun vleugels neer.", "Gen 2:2": "Toen God op de zevende dag Zijn werk voltooid had, dat Hij gemaakt had, heeft Hij op de zevende dag gerust van al Zijn werk, dat Hij gemaakt had.", "1 Kor 14:2-11": "Want wie een vreemde taal spreekt, spreekt niet tot de mensen, maar tot God; want niemand verstaat het, doch met de geest spreekt hij verborgenheden. Maar wie profeteert, spreekt tot de mensen stichting, en vermaning en vertroosting. Wie een vreemde taal spreekt, sticht zichzelf; maar wie profeteert sticht de Gemeente.", "Gen 12:1": "De HEERE had tegen Abram gezegd: Ga uit uw land, uit uw familie en uit het huis van uw vader, naar het land dat Ik u wijzen zal.", "Ex 14:24": "En het gebeurde in dezelfde morgenwake, dat de HEERE, in de kolom van vuur en wolk, neerkeek op het leger van de Egyptenaren; en Hij bracht het leger van de Egyptenaren in verwarring.", "Ex 5:7-18": "U zult voortaan aan deze mensen geen stro meer geven, voor het maken van de tichelstenen, zoals gisteren en eergisteren; laat hen zelf heengaan, en stro voor zichzelf verzamelen. En het aantal tichelstenen, dat zij gisteren en eergisteren gemaakt hebben, zult u hun opleggen; u zult daarvan niet verminderen; want zij lopen leeg; daarom roepen zij en zeggen: Laat ons gaan, laat ons onze God offeren! Men verzwaart de dienst voor deze mannen, zodat zij daaraan te doen hebben, en zich niet vergapen aan leugenachtige woorden.", "Gen 29:4": "Toen zei Jakob tegen hen: Mijn broeders! Waar komt u vandaan? En zij zeiden: Wij komen uit Haran.", "Gen 15:7": "Verder zei Hij tegen hem: Ik ben de HEERE, Die u uitgeleid heb uit Ur van de Chaldeeën, om u dit land te geven, om dat erfelijk te bezitten.", "Gen 11:20-23": "En Rehu leefde tweeëndertig jaar, en hij verwekte Serug. En Rehu leefde, nadat hij Serug verwekt had, tweehonderd en zeven jaar; en hij verwekte zonen en dochters. En Serug leefde dertig jaar, en verwekte Nahor.", "Dan 4:11": "De boom werd groot en sterk; en zijn hoogte reikte aan de hemel, en hij werd gezien tot aan het einde van de hele aarde;", "Luk 3:36": "de zoon van Kaïnan, de zoon van Arfaxad, de zoon van Sem, de zoon van Noach, de zoon van Lamech,", "1 Kron 1:25": "Heber, Peleg, Rehu,", "Gen 10:5": "Van hen zijn de eilanden van de volken verdeeld in hun landschappen, ieder naar zijn taal, naar hun huisgezinnen, onder hun volken.", "Pred 2:1": "Ik zei in mijn hart: Nu, welaan, ik zal u beproeven door vreugde; laat daarom het goede genieten; maar zie, ook dat was ijdelheid.", "Richt 2:18": "En wanneer de HEERE hun richters verwekte, zo was de HEERE met de richter, en verloste hen uit de hand van hun vijanden, al de dagen van de richter; want het berouwde de HEERE vanwege hun zuchten om hen die hen drongen en die hen drukten.", "Gen 18:11": "Abraham nu en Sara waren oud en op leeftijd; het was Sara opgehouden te gaan naar de wijze van de vrouwen.", "Gen 14:12": "Ook namen zij Lot, de zoon van Abrams broeder, en zijn bezittingen, en trokken weg; want hij woonde in Sodom.", "Gen 29:31": "Toen de HEERE nu zag dat Lea gehaat was, opende Hij haar baarmoeder; maar Rachel was onvruchtbaar.", "Gen 30:1": "Toen Rachel zag dat zij Jakob geen kinderen gaf, benijdde Rachel haar zuster; en zij zei tegen Jakob: Geef mij kinderen! Anders ben ik dood.", "1 Kor 14:23": "Als dan de hele Gemeente bijeengebracht is, en zij allen in vreemde talen spraken, en er enige ongeleerden of ongelovigen binnenkwamen, zouden zij dan niet zeggen dat u buiten zinnen bent?", "Luk 3:34": "de zoon van Jakob, de zoon van Izak, de zoon van Abraham, de zoon van Thara, de zoon van Nachor,", "1 Kon 18:27": "En het gebeurde op de middag, dat Elia met hen spotte, en zei: Roep met luide stem, want hij is een god; misschien is hij in gedachten verzonken, of heeft hij iets te doen, of is hij op reis; misschien slaapt hij en moet hij wakker worden.", "Gen 20:9-16": "En Abimelech riep Abraham, en zei tegen hem: Wat hebt u ons aangedaan? En wat heb ik tegen u gezondigd, dat u over mij en over mijn koninkrijk zo'n grote zonde gebracht hebt? U hebt dingen bij mij gedaan die niet gedaan zouden mogen worden. Verder zei Abimelech tegen Abraham: Wat hebt u gezien, dat u deze zaak gedaan hebt? En Abraham zei: Want ik dacht: er is beslist geen vreze van God in deze plaats, zodat zij mij zullen doden vanwege mijn vrouw.", "Gen 10:20": "Dit zijn de zonen van Cham, naar hun huisgezinnen, naar hun talen, in hun landschappen, in hun volken.", "2 Sam 8:13": "Ook maakte David zich een naam, toen hij terugkwam nadat hij de Syriërs geslagen had in het Zoutdal, achttienduizend man.", "Richt 10:14": "Ga heen, roep tot de goden die u hebt uitgekozen; laten die u verlossen in de tijd van uw benauwdheid.", "Gen 15:3": "Verder zei Abram: Zie, mij hebt U geen nageslacht gegeven, en zie, de zoon van mijn huis zal mijn erfgenaam zijn!", "Gen 9:16": "Als deze boog in de wolken zal zijn, dan zal Ik hem aanzien, om te gedenken aan het eeuwige verbond tussen God en tussen alle levende ziel, van alle vlees, dat op de aarde is.", "Lev 14:34": "Als u gekomen zult zijn in het land Kanaän, dat Ik u tot bezitting geven zal, en Ik de plaag van de melaatsheid aan een huis van dat land van uw bezitting gegeven zal hebben,", "Gen 3:22": "Toen zei de HEERE God: Zie, de mens is geworden als één van Ons, kennend het goed en het kwaad! Nu dan, laat hij zijn hand niet uitsteken, en ook nemen van de boom van het leven, en eten, en in eeuwigheid leven —", "Gen 10:31": "Dit zijn de zonen van Sem, naar hun huisgezinnen, naar hun talen, in hun landschappen, naar hun volken.", "Gen 10:21-25": "Verder zijn er aan Sem zonen geboren; hijzelf is ook de vader van alle zonen van Heber, broer van Jafeth, de oudste. Sems zonen waren Elam, en Assur, en Arfachsad, en Lud, en Aram. En Arams zonen waren Uz, en Hul, en Gether, en Maz.", "Ps 127:3": "Zie, de kinderen zijn een erfdeel van de HEERE; de vrucht van de buik is een beloning.", "Ps 57:2": "Wees mij genadig, o God! Wees mij genadig, want mijn ziel vertrouwt op U, en ik neem mijn toevlucht onder de schaduw van Uw vleugels, totdat de verdervingen voorbij zijn gegaan.", "Jes 5:8": "Wee hun die huis aan huis trekken, akker aan akker brengen, totdat er geen plaats meer is, en u alleen wonend achterblijft in het midden van het land!", "Ex 1:14": "zodat zij hun het leven bitter maakten met harde dienst, met leem en met tichelstenen, en met allerlei werk op het veld, met al hun werk, waarmee zij hen met hardheid lieten dienen.", "Gen 12:4": "En Abram ging heen, zoals de HEERE tegen hem gesproken had; en Lot ging met hem mee; en Abram was vijfenzeventig jaar oud, toen hij uit Haran vertrok.", "Gen 42:23": "En zij wisten niet dat Jozef het hoorde; want er was een tolk tussen hen.", "Gen 9:19": "Deze drie waren de zonen van Noach; en van dezen is de hele aarde bevolkt geraakt.", "Nahum 3:14": "Schep u water voor de belegering; versterk uw vestingen; ga in de klei, en treed in het leem; verbeter de ticheloven.", "Gen 11:10-29": "Dit zijn de geboorten van Sem: Sem was honderd jaar oud, en verwekte Arfachsad, twee jaar na de vloed. En Sem leefde, nadat hij Arfachsad verwekt had, vijfhonderd jaar; en hij verwekte zonen en dochters. En Arfachsad leefde vijfendertig jaar, en hij verwekte Selah.", "Gen 14:9": "tegen Kedor-laomer, de koning van Elam, en Tideal, de koning van de volken, en Amrafel, de koning van Sinear, en Arioch, de koning van Ellasar; vier koningen tegen vijf.", "Gen 24:10": "En die knecht nam tien kamelen van de kamelen van zijn heer, en vertrok; en al het goed van zijn heer had hij bij zich; en hij stond op, en vertrok naar Mesopotamië, naar de stad van Nahor.", "Dan 4:22": "Dat bent u, o koning, die groot en sterk bent geworden; want uw grootheid is zo toegenomen, dat zij reikt aan de hemel, en uw heerschappij aan het einde van het aardrijk.", "Ps 33:10": "De HEERE vernietigt de raad van de heidenen; Hij breekt de gedachten van de volken.", "Gen 15:2": "Toen zei Abram: Heere HEERE, wat zult U mij geven, terwijl ik zonder kinderen heenga en de bezorger van mijn huis deze Damascener Eliëzer is?", "1 Kron 1:19": "Aan Heber nu zijn twee zonen geboren; de naam van de één was Peleg, omdat in zijn dagen de aarde verdeeld is, en de naam van zijn broer was Joktan.", "Gen 6:5": "En de HEERE zag dat de slechtheid van de mens groot was op de aarde, en dat elk bedenksel van de gedachten van zijn hart alle dagen alleen maar slecht was.", "Gen 20:12": "En bovendien is zij werkelijk mijn zuster; zij is de dochter van mijn vader, maar niet de dochter van mijn moeder; en zij is mij tot vrouw geworden.", "Jes 11:11": "Want het zal gebeuren op die dag, dat de Heere voor de tweede keer Zijn hand zal aanleggen om het overblijfsel van Zijn volk terug te verwerven, dat overgebleven zal zijn van Assyrië, en van Egypte, en van Pathros, en van Morenland, en van Elam, en van Sinear, en van Hamath, en van de eilanden van de zee.", "Gen 11:26-31": "En Terah leefde zeventig jaar, en verwekte Abram, Nahor en Haran. En dit zijn de geboorten van Terah: Terah verwekte Abram, Nahor en Haran; en Haran verwekte Lot. En Haran stierf voor het aangezicht van zijn vader Terah, in het land van zijn geboorte, in Ur der Chaldeeën.", "Gen 13:1-11": "Zo trok Abram op uit Egypte naar het zuiden, hij en zijn vrouw, en alles wat hij had, en Lot met hem. En Abram was zeer rijk, in vee, in zilver, en in goud. En hij ging, volgens zijn reizen, van het zuiden tot Beth-el toe, tot aan de plaats waar zijn tent in het begin geweest was, tussen Beth-el en Ai;", "Gen 17:15": "Verder zei God tegen Abraham: Wat de naam van uw vrouw Sarai betreft, u zult haar niet meer Sarai noemen; maar haar naam zal Sara zijn.", "Gen 2:3": "En God heeft de zevende dag gezegend, en die geheiligd; omdat Hij daarop gerust heeft van al Zijn werk, dat God geschapen had om te volmaken.", "Jes 6:8": "Daarna hoorde ik de stem van de Heere, die zei: Wie zal Ik zenden, en wie zal voor Ons heengaan? Toen zei ik: Zie, hier ben ik, zend mij heen.", "Ex 14:7": "En hij nam zeshonderd uitgelezen wagens, ja, alle wagens van Egypte, en de hoofdlieden over die allemaal.", "2 Sam 12:31": "Het volk dat daarin was, voerde hij naar buiten, en zette hen aan het werk met zagen, en met ijzeren dorswagens, en met ijzeren bijlen, en liet hen door de steenoven gaan; en zo deed hij met alle steden van de kinderen van Ammon. Daarna keerde David, met heel het volk, terug naar Jeruzalem.", "Gen 22:12": "Toen zei Hij: Strek uw hand niet uit naar de jongen, en doe hem niets! Want nu weet Ik dat u God vrezend bent, en uw zoon, uw enige, niet van Mij hebt onthouden.", "Gen 49:7": "Vervloekt is hun toorn, want hij is heftig; en hun verbolgenheid, want zij is hard! Ik zal hen verdelen onder Jakob, en zal hen verstrooien onder Israël.", "Jes 9:9": "De tichelstenen zijn gevallen, maar met uitgehouwen stenen zullen wij opnieuw bouwen; de wilde vijgenbomen zijn afgehouwen, maar wij zullen ze in cederen veranderen;", "Gen 11:22-26": "En Serug leefde dertig jaar, en verwekte Nahor. En Serug leefde, nadat hij Nahor verwekt had, tweehonderd jaar; en hij verwekte zonen en dochters. En Nahor leefde negenentwintig jaar, en verwekte Terah.", "Gen 22:20-24": "En het gebeurde na deze dingen dat men Abraham berichtte: Zie, Milka heeft ook zonen gebaard aan Nahor, uw broer: Uz, zijn eerstgeborene, en Buz, zijn broer, en Kemuël, de vader van Aram, En Chesed, en Hazo, en Pildas, en Jidlaf, en Bethuël;", "Gen 19:1-29": "En die twee engelen kwamen 's avonds in Sodom aan; en Lot zat in de poort van Sodom; en toen Lot hen zag, stond hij op om hun tegemoet te gaan, en boog zich met het gezicht ter aarde. En hij zei: Zie toch, mijn heren! Keert u toch af naar het huis van uw knecht, en overnacht daar, en wast uw voeten; dan kunt u vroeg opstaan en verder gaan op uw weg. En zij zeiden: Nee, maar wij zullen op straat overnachten. En hij hield sterk bij hen aan, zodat zij bij hem introkken, en in zijn huis kwamen; en hij maakte hun een maaltijd, en bakte ongezuurde koeken, en zij aten.", "Gen 12:5": "En Abram nam Sarai, zijn vrouw, en Lot, de zoon van zijn broer, en al hun bezit dat zij verworven hadden, en de mensen die zij verkregen hadden in Haran; en zij vertrokken om naar het land Kanaän te gaan, en zij kwamen in het land Kanaän aan.", "Hand 2:4-11": "En zij werden allen vervuld met de Heilige Geest, en begonnen te spreken met andere talen, zoals de Geest hun gaf uit te spreken. En er waren Joden die in Jeruzalem woonden, godvruchtige mannen, uit alle volken die er onder de hemel zijn. En toen deze stem gebeurd was, kwam de menigte samen en raakte in verwarring, want ieder hoorde hen in zijn eigen taal spreken.", "Gen 10:32": "Dit zijn de huisgezinnen van de zonen van Noach, naar hun geboorten, in hun volken; en van hen zijn de volken op de aarde verdeeld na de vloed.", "Gen 14:10": "Het dal Siddim nu was vol lijmputten; en de koningen van Sodom en Gomorra vluchtten en vielen daar; en de overgeblevenen vluchtten naar het gebergte.", "Ps 35:1-3": "Een psalm van David. Twist, HEERE, met wie tegen mij twisten; strijd tegen wie tegen mij strijden. Grijp het schild en de rondas, en sta op tot mijn hulp. En breng de spies naar voren, en sluit de weg toe voor mijn vervolgers; zeg tegen mijn ziel: Ik ben uw Heil.", "Hebr 3:13": "Maar vermaan elkaar elke dag, zolang het heden genoemd wordt, opdat niemand van u verhard wordt door de misleiding van de zonde.", "Job 12:20": "Hij ontneemt de betrouwbaren de spraak, en het oordeel van de ouden neemt Hij weg.", "1 Sam 15:35": "En Samuël zag Saul niet meer tot de dag van zijn dood toe; toch droeg Samuël leed om Saul; en het berouwde de HEERE, dat Hij Saul tot koning over Israël gemaakt had.", "Gen 11:16-19": "En Heber leefde vierendertig jaar, en verwekte Peleg. En Heber leefde, nadat hij Peleg verwekt had, vierhonderd en dertig jaar; en hij verwekte zonen en dochters. En Peleg leefde dertig jaar, en hij verwekte Rehu.", "Spr 1:11": "Als zij zeggen: Ga met ons, laat ons loeren op bloed, ons verstoppen tegen de onschuldige, zonder oorzaak;", "Job 5:12": "Hij maakt teniet de gedachten van de arglistigen; zodat hun handen niets uitrichten.", "Gen 18:21": "Zal Ik nu afgaan en zien of zij naar hun geroep, dat tot Mij gekomen is, het uiterste gedaan hebben, en zo niet, Ik zal het weten.", "Zach 5:11": "En Hij zei tegen mij: Om er een huis voor te bouwen in het land Sinear; dat het daar gevestigd wordt en neergezet wordt op zijn eigen grondvesting.", "Gen 11:1-9": "En de hele aarde had één taal en dezelfde woorden. En het gebeurde, toen zij naar het oosten trokken, dat zij een laagte vonden in het land Sinear; en zij woonden daar. En zij zeiden tegen elkaar: Kom aan, laten we tichels strijken en ze goed doorbranden! En de tichel was voor hen in plaats van steen, en het lijm was voor hen in plaats van leem.", "Gen 18:17-19": "En de HEERE zei: Zal Ik voor Abraham verbergen wat Ik ga doen? Omdat Abraham zeker tot een groot en machtig volk zal worden, en alle volken van de aarde in hem gezegend zullen worden? Want Ik heb hem gekend, opdat hij zijn kinderen en zijn huis na hem zou opdragen, en zij de weg van de HEERE zouden bewaren, om gerechtigheid en recht te doen; opdat de HEERE over Abraham brengt wat Hij over hem gesproken heeft.", "Jes 1:15": "En als u uw handen uitspreidt, verberg Ik Mijn ogen voor u; ook wanneer u het gebed vermenigvuldigt, hoor Ik niet; want uw handen zijn vol bloed.", "Joz 24:3": "Toen nam Ik uw vader Abraham van de overkant van de rivier, en liet hem door heel het land Kanaän trekken; Ik vermeerderde ook zijn nageslacht en gaf hem Izak.", "Luk 1:36": "En zie, Elizabet, uw nicht, is ook zelf zwanger van een zoon, in haar ouderdom; en dit is de zesde maand voor haar, die onvruchtbaar genoemd werd.", "Hand 7:4": "Toen ging hij weg uit het land van de Chaldeeën, en woonde in Haran. En vandaar, nadat zijn vader gestorven was, bracht Hij hem over naar dit land, waarin u nu woont.", "Ps 64:6": "Zij sterken zichzelf in een boze zaak; zij overleggen om strikken te verbergen; zij zeggen: Wie zal ze zien?", "Ex 2:24": "En God hoorde hun gekerm, en God dacht aan Zijn verbond met Abraham, met Izak, en met Jakob.", "1 Kron 1:24": "Sem, Arfachsad, Selah,", "Gen 23:2": "Sara stierf te Kiriath-arba, dat is Hebron, in het land Kanaän; en Abraham kwam om Sara te beklagen en haar te bewenen.", "1 Kron 1:17-54": "De kinderen van Sem waren Elam, en Assur, en Arfachsad, en Lud, en Aram, en Uz, en Hul, en Gether, en Mesech. Arfachsad verwekte Selah, en Selah verwekte Heber. Aan Heber nu zijn twee zonen geboren; de naam van de één was Peleg, omdat in zijn dagen de aarde verdeeld is, en de naam van zijn broer was Joktan.", "Gen 1:26": "En God zei: Laat Ons mensen maken, naar Ons beeld, naar Onze gelijkenis; en laten zij heersen over de vissen van de zee, en over het gevogelte van de hemel, en over het vee, en over de hele aarde, en over al de kruipende dieren die op de aarde kruipen.", "Ps 94:9": "Zou Hij, Die het oor plant, niet horen? Zou Hij, Die het oog vormt, niet zien?", "1 Kron 1:26": "Serug, Nahor, Terah,", "Gen 11:24-32": "En Nahor leefde negenentwintig jaar, en verwekte Terah. En Nahor leefde, nadat hij Terah verwekt had, honderd en negentien jaar; en hij verwekte zonen en dochters. En Terah leefde zeventig jaar, en verwekte Abram, Nahor en Haran.", "Gen 27:43": "Nu dan, mijn zoon! luister naar mijn stem, en maak u op, vlucht naar Haran, naar Laban, mijn broer.", "Neh 9:7": "U bent die HEERE, de God, Die Abram hebt verkoren, en hem uit Ur der Chaldeeën uitgevoerd; en U hebt zijn naam gesteld Abraham.", "Gen 21:1": "En de HEERE bezocht Sara, zoals Hij gezegd had; en de HEERE deed aan Sara, zoals Hij gesproken had.", "Jes 13:1": "De last van Babel, die Jesaja, de zoon /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    if (!kjvTekst && (!engels || !engels.length)) return '<em>Geen verwijzingen bij dit vers.</em>';
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    if (engels && engels.length) {
      h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');

    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}
</script>
