<style>

  .navselect { font-family:"Lora"; font-size:.85rem; border:1px solid var(--border); border-radius:999px; padding:.3rem 1.6rem .3rem .8rem; background:#fff; color:var(--accent-donker); cursor:pointer; display:inline-flex; align-items:center; text-decoration:none; }

    #vertaalkies { order: -1; }

  /* verzen — tabsmodus (één kolom) */
  .vers { position: relative; display: flex; gap: .8rem; padding: .45rem 2.4rem .45rem .4rem; border-radius: 8px; cursor: pointer; }
  .vers:hover { background: var(--bg-soft); }
  .vers.open { background: var(--bg-soft); box-shadow: inset 3px 0 0 var(--accent); border-radius: 8px 8px 0 0; }
  .vers.flits { animation: flits 1.6s ease-out; }
  @keyframes flits { 0% { background: #f0e2bd; } 100% { background: var(--bg-soft); } }
  .vnr { color: #b3a184; font-size: .75rem; min-width: 1.6rem; text-align: right; padding-top: .45rem; font-family: "Lora"; }
  .vtekst em, .pcel em { font-style: italic; color: #555; }
  .wl { border-bottom: 1px dotted var(--accent); }
  .noot { color: var(--accent); cursor: pointer; font-weight: 700; padding: 0 .05rem; }
  .noot:hover { color: var(--accent-donker); }

  .vers:hover .kopieer { opacity: .75; }
  .kopieer:hover { opacity: 1 !important; }

  #bijbel.parallel .vers { display:grid; gap:.8rem; cursor:pointer; align-items:start; }
  #bijbel.parallel .vnr { grid-row: 1; }
  .kolomkop { display:none; }
  #bijbel.parallel + .kolomkop, .kolomkop.tonen { }
  .pk { font-family:"Lora"; font-size:.72rem; text-transform:uppercase; letter-spacing:.12em; color:var(--accent-donker); font-weight:700; }
  #bijbel.parallel .pcel em { font-style:italic; color:#555; }

n taal en dezelfde woorden.","2":"En het gebeurde, toen zij naar het oosten trokken, dat zij een laagte vonden in het land Sinear; en zij woonden daar.","3":"En zij zeiden tegen elkaar: Kom aan, laten we tichels strijken en ze goed doorbranden! En de tichel was voor hen in plaats van steen, en het lijm was voor hen in plaats van leem.","4":"En zij zeiden: Kom aan, laten we voor onszelf een stad bouwen, en een toren, waarvan de top tot in de hemel *reikt*, en laten we voor onszelf een naam maken, opdat wij niet misschien over de hele aarde verstrooid worden!","5":"Toen kwam de HEERE neer, om de stad en de toren te bekijken, die de kinderen van de mensen bouwden.","6":"En de HEERE zei: Zie, zij *zijn* één volk, en *hebben* allen dezelfde taal; en dit is *het* waarmee zij beginnen te doen; maar nu zou niets van wat zij bedacht hebben te doen, hun onmogelijk zijn?","7":"Kom aan, laten Wij neerdalen, en laten Wij daar hun taal verwarren, zodat ieder de taal van zijn naaste niet meer verstaat.","8":"Zo verstrooide de HEERE hen vandaar over de hele aarde; en zij hielden op de stad te bouwen.","9":"Daarom noemde men haar naam Babel; want daar verwarde de HEERE de taal van de hele aarde, en vandaar verstrooide de HEERE hen over de hele aarde.","10":"Dit zijn de geboorten van Sem: Sem was honderd jaar oud, en verwekte Arfachsad, twee jaar na de vloed.","11":"En Sem leefde, nadat hij Arfachsad verwekt had, vijfhonderd jaar; en hij verwekte zonen en dochters.","12":"En Arfachsad leefde vijfendertig jaar, en hij verwekte Selah.","13":"En Arfachsad leefde, nadat hij Selah verwekt had, vierhonderd en drie jaar; en hij verwekte zonen en dochters.","14":"En Selah leefde dertig jaar, en hij verwekte Heber.","15":"En Selah leefde, nadat hij Heber verwekt had, vierhonderd en drie jaar, en hij verwekte zonen en dochters.","16":"En Heber leefde vierendertig jaar, en verwekte Peleg.","17":"En Heber leefde, nadat hij Peleg verwekt had, vierhonderd en dertig jaar; en hij verwekte zonen en dochters.","18":"En Peleg leefde dertig jaar, en hij verwekte Rehu.","19":"En Peleg leefde, nadat hij Rehu verwekt had, tweehonderd en negen jaar; en hij verwekte zonen en dochters.","20":"En Rehu leefde tweeëndertig jaar, en hij verwekte Serug.","21":"En Rehu leefde, nadat hij Serug verwekt had, tweehonderd en zeven jaar; en hij verwekte zonen en dochters.","22":"En Serug leefde dertig jaar, en verwekte Nahor.","23":"En Serug leefde, nadat hij Nahor verwekt had, tweehonderd jaar; en hij verwekte zonen en dochters.","24":"En Nahor leefde negenentwintig jaar, en verwekte Terah.","25":"En Nahor leefde, nadat hij Terah verwekt had, honderd en negentien jaar; en hij verwekte zonen en dochters.","26":"En Terah leefde zeventig jaar, en verwekte Abram, Nahor en Haran.","27":"En dit zijn de geboorten van Terah: Terah verwekte Abram, Nahor en Haran; en Haran verwekte Lot.","28":"En Haran stierf voor het aangezicht van zijn vader Terah, in het land van zijn geboorte, in Ur der Chaldeeën.","29":"En Abram en Nahor namen voor zichzelf vrouwen; de naam van Abrams vrouw was Sarai, en de naam van Nahors vrouw was Milka, een dochter van Haran, vader van Milka, en vader van Jiska.","30":"En Sarai was onvruchtbaar; zij had geen kind.","31":"En Terah nam Abram, zijn zoon, en Lot, Harans zoon, de zoon van zijn zoon, en Sarai, zijn schoondochter, de vrouw van zijn zoon Abram, en zij trokken met hen uit Ur der Chaldeeën, om naar het land Kanaän te gaan; en zij kwamen tot Haran, en woonden daar.","32":"En de dagen van Terah waren tweehonderd en vijf jaar, en Terah stierf te Haran."},"SV":{"1":"En de ganse aarde was van enerlei spraak en enerlei woorden.","2":"Maar het geschiedde, als zij tegen het oosten togen, dat zij een laagte vonden in het land Sinear; en zij woonden aldaar.","3":"En zij zeiden een ieder tot zijn naaste: Kom aan, laat ons tichelen strijken, en wel doorbranden! En de tichel was hun voor steen, en het lijm was hun voor leem.","4":"En zij zeiden: Kom aan, laat ons voor ons een stad bouwen, en een toren, welks opperste in den hemel *zij*, en laat ons een naam voor ons maken, opdat wij niet misschien over de ganse aarde verstrooid worden!","5":"Toen kwam de HEERE neder, om te bezien de stad en den toren, die de kinderen der mensen bouwden.","6":"En de HEERE zeide: Ziet, zij *zijn* enerlei volk, en *hebben* allen enerlei spraak; en dit *is* *het*, dat zij beginnen te maken; maar nu, zoude hun niet afgesneden worden al wat zij bedacht hebben te maken?","7":"Kom aan, laat Ons nedervaren, en laat Ons hun spraak aldaar verwarren, opdat iegelijk de spraak zijns naasten niet hore.","8":"Alzo verstrooide hen de HEERE van daar over de ganse aarde; en zij hielden op de stad te bouwen.","9":"Daarom noemde men haar naam Babel; want aldaar verwarde de HEERE de spraak der ganse aarde, en van daar verstrooide hen de HEERE over de ganse aarde.","10":"Deze *zijn* de geboorten van Sem: Sem was honderd jaren oud, en gewon, Arfachsad, twee jaren na den vloed.","11":"En Sem leefde, nadat hij Arfachsad gewonnen had, vijfhonderd jaren; en hij gewon zonen en dochteren.","12":"En Arfachsad leefde vijf en dertig jaren, en hij gewon Selah.","13":"En Arfachsad leefde, nadat hij, Selah gewonnen had, vierhonderd en drie jaren; en hij gewon zonen en dochteren.","14":"En Selah leefde dertig jaren, en hij gewon Heber.","15":"En Selah leefde, nadat hij Heber gewonnen had, vierhonderd en drie jaren, en hij gewon zonen en dochteren.","16":"En Heber leefde vier en dertig jaren, en gewon Peleg.","17":"En Heber leefde, nadat hij Peleg gewonnen had, vierhonderd en dertig jaren; en hij gewon zonen en dochteren.","18":"En Peleg leefde dertig jaren, en hij gewon Rehu.","19":"En Peleg leefde, nadat hij Rehu gewonnen had, tweehonderd en negen jaren; en hij gewon zonen en dochteren.","20":"En Rehu leefde twee en dertig jaren, en hij gewon Serug.","21":"En Rehu leefde, nadat hij Serug gewonnen had, tweehonderd en zeven jaren; en hij gewon zonen en dochteren.","22":"En Serug leefde dertig jaren, en gewon Nahor.","23":"En Serug leefde, nadat hij Nahor gewonnen had, tweehonderd jaren; en hij gewon zonen en dochteren.","24":"En Nahor leefde negen en twintig jaren, en gewon Terah.","25":"En Nahor leefde, nadat hij Terah gewonnen had, honderd en negentien jaren; en hij gewon zonen en dochteren.","26":"En Terah leefde zeventig jaren, en gewon Abram, Nahor en Haran.","27":"En deze *zijn* de geboorten van Terah: Terah gewon Abram, Nahor en Haran; en Haran gewon Lot.","28":"En Haran stierf voor het aangezicht zijns vaders Terah, in het land zijner geboorte, in Ur der Chaldeen.","29":"En Abram en Nahor namen zich vrouwen; de naam van Abrams huisvrouw was Sarai, en de naam van Nahors huisvrouw was Milka, een dochter van Haran, vader van Milka, en vader van Jiska.","30":"En Sarai was onvruchtbaar; zij had geen kind.","31":"En Terah nam Abram, zijn zoon, en Lot, Harans zoon, zijns zoons zoon, en Sarai, zijn schoondochter, de huisvrouw van zijn zoon Abram, en zij togen met hen uit Ur der Chaldeen, om te gaan naar het land Kanaän; en zij kwamen tot Haran, en woonden aldaar.","32":"En de dagen van Terah waren tweehonderd en vijf jaren, en Terah stierf te Haran."},"KJV":{"1":"And the whole earth was of one language, and of one speech.","2":"And it came to pass, as they journeyed from the east, that they found a plain in the land of Shinar; and they dwelt","3":"And they said one to another, Go to, let us make brick, and burn them throughly. And they had brick for stone, and slime had they for morter.","4":"And they said, Go to, let us build us a city and a tower, whose top *may reach* unto heaven; and let us make us a name, lest we be scattered abroad upon the face of the whole earth.","5":"And the LORD came down to see the city and the tower, which the children of men builded.","6":"And the LORD said, Behold, the people *is* one, and they have all one language; and this they begin to do: and now nothing will be restrained from them, which they have imagined to do.","7":"Go to, let us go down, and there confound their language, that they may not understand one another's speech.","8":"So the LORD scattered them abroad from thence upon the face of all the earth: and they left off to build the city.","9":"Therefore is the name of it called Babel; because the LORD did there confound the language of all the earth: and from thence did the LORD scatter them abroad upon the face of all the earth.","10":"These *are* the generations of Shem: Shem *was* an hundred years old, and begat Arphaxad two years after the flood:","11":"And Shem lived after he begat Arphaxad five hundred years, and begat sons and daughters.","12":"And Arphaxad lived five and thirty years, and begat Salah:","13":"And Arphaxad lived after he begat Salah four hundred and three years, and begat sons and daughters.","14":"And Salah lived thirty years, and begat Eber:","15":"And Salah lived after he begat Eber four hundred and three years, and begat sons and daughters.","16":"And Eber lived four and thirty years, and begat Peleg:","17":"And Eber lived after he begat Peleg four hundred and thirty years, and begat sons and daughters.","18":"And Peleg lived thirty years, and begat Reu:","19":"And Peleg lived after he begat Reu two hundred and nine years, and begat sons and daughters.","20":"And Reu lived two and thirty years, and begat Serug:","21":"And Reu lived after he begat Serug two hundred and seven years, and begat sons and daughters.","22":"And Serug lived thirty years, and begat Nahor:","23":"And Serug lived after he begat Nahor two hundred years, and begat sons and daughters.","24":"And Nahor lived nine and twenty years, and begat Terah:","25":"And Nahor lived after he begat Terah an hundred and nineteen years, and begat sons and daughters.","26":"And Terah lived seventy years, and begat Abram, Nahor, and Haran.","27":"Now these *are* the generations of Terah: Terah begat Abram, Nahor, and Haran; and Haran begat Lot.","28":"And Haran died before his father Terah in the land of his nativity, in Ur of the Chaldees.","29":"And Abram and Nahor took them wives: the name of Abram's wife *was* Sarai; and the name of Nahor's wife, Milcah, the daughter of Haran, the father of Milcah, and the father of Iscah.","30":"But Sarai was barren; she *had* no child.","31":"And Terah took Abram his son, and Lot the son of Haran his son's son, and Sarai his daughter in law, his son Abram's wife; and they went forth with them from Ur of the Chaldees, to go into the land of Canaan; and they came unto Haran, and dwelt","32":"And the days of Terah were two hundred and five years: and Terah died in Haran."}},"tsk":{"1":[{"kopje":"had","refs":["Jes 19:18","Zef 3:9","Hand 2:6"]}],"2":[{"kopje":"naar het oosten","refs":["Gen 13:11"]},{"kopje":"Sinear","refs":["Gen 11:9","Gen 10:10","Gen 14:1","Jes 11:11","Dan 1:2","Zach 5:11"]}],"3":[{"kopje":"zeiden tegen elkaar","refs":["Gen 11:4","Gen 11:7","Ps 64:6","Spr 1:11","Pred 2:1","Jes 5:5","Jes 41:6","Jes 41:7","Jak 4:13","Jak 5:1","Hebr 3:13","Hebr 10:24"]},{"kopje":"tichels","refs":["Ex 1:14","Ex 5:7-18","2 Sam 12:31","Jes 9:9","Jes 65:3","Nahum 3:14"]},{"kopje":"lijm","refs":["Gen 14:10","Ex 2:3"]}],"4":[{"kopje":"waarvan","refs":["Deut 1:28","Deut 9:1","Dan 4:11","Dan 4:22"]},{"kopje":"en laten","refs":["2 Sam 8:13","Ps 49:12-14","Spr 10:7","Dan 4:30","Joh 5:44"]},{"kopje":"opdat wij niet","refs":["Gen 11:8","Gen 11:9","Ps 92:10","Luk 1:51"]}],"6":[{"kopje":"Zie","refs":["Gen 3:22","Richt 10:14","1 Kon 18:27","Pred 11:9"]},{"kopje":"volk","refs":["Gen 11:1","Gen 9:19","Hand 17:26"]},{"kopje":"bedacht hebben","refs":["Gen 6:5","Gen 8:21","Ps 2:1-4","Luk 1:51"]}],"7":[{"kopje":"laten","refs":["Gen 11:5","Gen 1:26","Gen 3:22","Jes 6:8"]},{"kopje":"verwarren","refs":["Job 5:12","Job 5:13","Job 12:20","Ps 2:4","Ps 33:10","Hand 2:4-11"]},{"kopje":"zodat","refs":["Gen 10:5","Gen 10:20","Gen 10:32","Gen 42:23","Deut 28:49","Ps 55:10","Jer 5:15","1 Kor 14:2-11","1 Kor 14:23"]}],"8":[{"kopje":"HEERE","refs": h","tekst":"Hebr. Schelach."}],"22":[{"catchword":"Nahor","tekst":"Hebr. Nachor."}],"24":[{"catchword":"Terah","tekst":"Hebr. Thera, en Luk 3:34 Thara."}],"26":[{"catchword":"gewon","tekst":"Dat is, hij begon te gewinnen. Zie boven Gen 5:32."},{"catchword":"Abram,","tekst":"Abram wordt eerst genoemd, niet omdat hij de oudste, maar de waardigste was; gelijk dit ook hier tevoren met Sem geschied is, boven Gen 5:32, en Gen 10:1."}],"28":[{"catchword":"voor het aangezicht zijns vaders","tekst":"Dat is, in het leven en de tegenwoordigheid zijns vaders."},{"catchword":"Ur","tekst":"Een stad in het land van Chaldeën. Zie Neh 9:7; Act 7:4."}],"29":[{"catchword":"een dochter van Haran,","tekst":"Milka is getrouwd geweest met haar oom Nahor, welke huwelijken door de wetten van dien tijd nog niet uitdrukkelijk verboden waren. Jiska wordt door sommigen gehouden voor Sarai, de huisvrouw van Abram; anderen menen dat Sarai niet was de dochter van Haran, maar diens en Abrams en Nahors zuster, uit één vader Terah, maar niet uit één moeder geboren. Verg. onder Gen 20:12."}],"31":[{"catchword":"Terah nam Abram","tekst":"Te weten, nadat hij door zijn zoon Abram verstaan had, dat God hem had geroepen om te gaan uit zijn vaderland, volgens het verhaal daarvan gedaan in het 12e hfdst.."},{"catchword":"zij togen","tekst":"Namel. Terah en Abram."},{"catchword":"met henlieden","tekst":"Namelijk, met Lot en Sarai."},{"catchword":"Haran,","tekst":"Hebr. Charan, Act 7:4 leest men Charran, een stad in Mesopotamië, in de historiën bekend. Zie onder Gen 24:10, en Gen 28:10, en Gen 29:4."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"And all the earth [all the inhabitants of the earth before and after the flood until his division of his languages happened ] was of one language [Heb. Lip: and so in the sequel and this language is supposed to have been the Hebrew which hath its name since of Heber it having continued in its posterity among other reasons therefore that the proper names of the first man are of the Hebrew original and etymology as Adam, Heva, Heva, Cain,Abel &c.] and of sort of words."}],"2":[{"catchword":null,"tekst":"But it came to pass as they [this is understood of Cham&acirc;&euro;&trade;s posterity and their chieftain Nimrod see above chapter 10 verse 10] journeyed towards the east [from the place whither they were first gone when by reason of great increase and multitude of people they were driven to enlarge their quarters from mount Ararat were the ark rested see chapter 8.4] that they found a plain in the land of Sinker [where Babel lay see chapter 10 on verse 10] and they dwelt there."}],"3":[{"catchword":null,"tekst":"And they say everyone of his neighbor let us strike tiles [ or make prepare brick ] and thoroughly burn them [Heb. Burn with or unto burning that is make or bake hard by much burning ] and the tile or brick was instead a stone unto them and the slime was to them instead of lime or mortar [that which is rendered slime here was a very tough bituminous matter cleaving and sticking faster on then any pitch of which there was great plenty in those parts see chapter 14 verse 10 historians tells us that the walls of Babel were mortared with this matter and grown as hard as iron in this time.]"}],"4":[{"catchword":null,"tekst":"And they said come on let us build us a city and a tower whose top or uppermost [Heb. Head] be in the heaven [ an expression serving for exaggeration and magnifying a ting see Deuteronomy chapter 1 verse 28 and 9.1 Psa 107:26 Mat 11:23 this was a most wicked and presumptuous design as if in despite of God and all men they would raise such a fabric that should secure them against any power whatsoever] and let us work a name for us left we be scattered over all the earth [Heb. All the face of the earth and so below verse 8, 9.]"}],"5":[{"catchword":null,"tekst":"Then the Lord came down for to behold the city and the tower [spoken of God infinite and omniscious after the manner of man and implying Go (function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');

    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');

    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'

  document.getElementById('hfdnav').innerHTML =

  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };

  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

document.addEventListener('click', e => {

  if (!k) return;

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:"Lora";font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
