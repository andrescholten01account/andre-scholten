 zonen, en Hij zei tegen hen: Wees vruchtbaar en word talrijk, en vervul de aarde!","2":"En vrees en angst voor u zal er zijn over al het gedierte van de aarde, en over al het gevogelte van de hemel; over alles wat zich op de aardbodem beweegt, en over alle vissen van de zee; zij zijn in uw hand overgegeven.","3":"Alles wat zich beweegt, dat leeft, zal u tot voedsel zijn; Ik heb het u allemaal gegeven, zoals het groene kruid.","4":"Maar het vlees met zijn ziel, *dat is* zijn bloed, zult u niet eten.","5":"En zeker, Ik zal uw bloed, *het bloed* van uw zielen, opeisen; van de hand van elk dier zal Ik het opeisen; ook van de hand van de mens, van de hand van ieders broeder zal Ik de ziel van de mens opeisen.","6":"Wie het bloed van een mens vergiet, diens bloed zal door de mens vergoten worden; want God heeft de mens naar Zijn beeld gemaakt.","7":"Maar u, wees vruchtbaar en word talrijk; breng overvloedig voort op de aarde, en word talrijk daarop.","8":"Verder zei God tegen Noach, en tegen zijn zonen met hem:","9":"Maar Ik, zie, Ik richt Mijn verbond op met u, en met uw nageslacht na u;","10":"en met alle levende ziel die met u is, van het gevogelte, van het vee, en van alle dieren van de aarde met u; van allen die uit de ark gegaan zijn, tot al de dieren van de aarde toe.","11":"En Ik richt Mijn verbond op met u, dat niet meer al het vlees door het water van de vloed zal worden uitgeroeid; en dat er geen vloed meer zal zijn om de aarde te verderven.","12":"En God zei: Dit is het teken van het verbond, dat Ik geef tussen Mij en tussen u, en tussen alle levende ziel die met u is, voor eeuwige geslachten.","13":"Mijn boog heb Ik gegeven in de wolken; die zal zijn tot een teken van het verbond tussen Mij en tussen de aarde.","14":"En het zal gebeuren, als Ik wolken over de aarde breng, dat deze boog gezien zal worden in de wolken;","15":"dan zal Ik Mijn verbond gedenken, dat er is tussen Mij en tussen u, en tussen alle levende ziel van alle vlees; en het water zal niet meer worden tot een vloed, om alle vlees te verderven.","16":"Als deze boog in de wolken zal zijn, dan zal Ik hem aanzien, om te gedenken aan het eeuwige verbond tussen God en tussen alle levende ziel, van alle vlees, dat op de aarde is.","17":"Zo zei God dan tegen Noach: Dit is het teken van het verbond, dat Ik opgericht heb tussen Mij en tussen alle vlees, dat op de aarde is.","18":"En de zonen van Noach die uit de ark gingen, waren Sem, en Cham, en Jafeth; en Cham is de vader van Kanaän.","19":"Deze drie waren de zonen van Noach; en van dezen is de hele aarde bevolkt geraakt.","20":"En Noach begon een akkerman te zijn, en hij plantte een wijngaard.","21":"En hij dronk van die wijn, en werd dronken; en hij ontblootte zich midden in zijn tent.","22":"En Cham, de vader van Kanaän, zag de naaktheid van zijn vader, en hij vertelde het zijn beide broers daarbuiten.","23":"Toen namen Sem en Jafeth een kleed, en zij legden het op hun beider schouders, en gingen achterwaarts, en bedekten de naaktheid van hun vader; en hun gezichten waren afgewend, zodat zij de naaktheid van hun vader niet zagen.","24":"En Noach ontwaakte uit zijn roes, en merkte wat zijn jongste zoon hem had aangedaan.","25":"En hij zei: Vervloekt zij Kanaän; een knecht der knechten zal hij zijn voor zijn broers!","26":"Vervolgens zei hij: Gezegend zij de HEERE, de God van Sem; en Kanaän zal hem een knecht zijn!","27":"God breidt Jafeth uit, en hij woont in de tenten van Sem! En Kanaän zal hem een knecht zijn!","28":"En Noach leefde na de vloed driehonderdvijftig jaren.","29":"Zo waren al de dagen van Noach negenhonderdvijftig jaren; en hij stierf."},"SV":{"1":"En God zegende Noach en zijn zonen, en Hij zeide tot hen: Zijt vruchtbaar en vermenigvuldigt, en vervult de aarde!","2":"En uw vrees, en uw verschrikking zij over al het gedierte der aarde, en over al het gevogelte des hemels; in al wat zich op den aardbodem roert, en in alle vissen der zee; zij zijn in uw hand overgegeven.","3":"Al wat zich roert, dat levend is, zij u tot spijze; Ik heb het u al gegeven, gelijk het groene kruid.","4":"Doch het vlees met zijn ziel, *dat* *is* zijn bloed, zult gij niet eten.","5":"En voorwaar, Ik zal uw bloed, *het* *bloed* uwer zielen eisen; van de hand van alle gedierte zal Ik het eisen; ook van de hand des mensen, van de hand eens iegelijken zijns broeders zal Ik de ziel des mensen eisen.","6":"Wie des mensen bloed vergiet, zijn bloed zal door den mens vergoten worden; want God heeft den mens naar Zijn beeld gemaakt.","7":"Maar gijlieden, weest vruchtbaar, en vermenigvuldigt; teelt overvloediglijk voort op de aarde, en vermenigvuldigt op dezelve.","8":"Voorts zeide God tot Noach, en tot zijn zonen met hem, zeggende:","9":"Maar Ik, ziet, Ik richt Mijn verbond op met u, en met uw zaad na u;","10":"En met alle levende ziel, die met u *is*, van het gevogelte, van het vee, en van alle gedierte der aarde met u; van allen, die uit de ark gegaan zijn, tot al het gedierte der aarde toe.","11":"En Ik richt Mijn verbond op met u, dat niet meer alle vlees door de wateren des vloeds zal worden uitgeroeid; en dat er geen vloed meer zal zijn, om de aarde te verderven.","12":"En God zeide: Dit *is* het teken des verbonds, dat Ik geef tussen Mij en tussen ulieden, en tussen alle levende ziel, die met u *is*, tot eeuwige geslachten.","13":"Mijn boog heb Ik gegeven in de wolken; die zal zijn tot een teken des verbonds tussen Mij en tussen de aarde.","14":"En het zal geschieden, als Ik wolken over de aarde brenge, dat deze boog zal gezien worden in de wolken;","15":"Dan zal Ik gedenken Mijn verbond, hetwelk is tussen Mij en tussen u, en tussen alle levende ziel van alle vlees; en de wateren zullen niet meer wezen tot een vloed, om alle vlees te verderven.","16":"Als deze boog in de wolken zal zijn, zo zal Ik hem aanzien, om te gedenken aan het eeuwig verbond tussen God en tussen alle levende ziel, van alle vlees, dat op de aarde is.","17":"Zo zeide dan God tot Noach: Dit *is* het teken des verbonds, dat Ik opgericht heb tussen Mij en tussen alle vlees, dat op de aarde *is*.","18":"En de zonen van Noach, die uit de ark gingen, waren Sem, en Cham, en Jafeth; en Cham is de vader van Kanaän.","19":"Deze drie *waren* de zonen van Noach; en van dezen is de ganse aarde overspreid.","20":"En Noach begon een akkerman *te* *zijn*, en hij plantte een wijngaard.","21":"En hij dronk van dien wijn, en werd dronken; en hij ontblootte zich in het midden zijner tent.","22":"En Cham, Kanaäns vader, zag zijns vaders naaktheid, en hij gaf het zijn beiden broederen daar buiten te kennen.","23":"Toen namen Sem en Jafeth een kleed, en zij leiden het op hun beider schouderen, en gingen achterwaarts, en bedekten de naaktheid huns vaders; en hun aangezichten waren achterwaarts *gekeerd*, zodat zij de naaktheid huns vaders niet zagen.","24":"En Noach ontwaakte van zijn wijn; en hij merkte wat zijn kleinste zoon hem gedaan had.","25":"En hij zeide: Vervloekt zij Kanaän; een knecht der knechten zij hij zijn broederen!","26":"Voorts zeide hij: Gezegend zij de HEERE, de God van Sem; en Kanaän zij hem een knecht!","27":"God breide Jafeth uit, en hij wone in Sems tenten! en Kanaän zij hem een knecht!","28":"En Noach leefde na den vloed driehonderd en vijftig jaren.","29":"Zo waren al de dagen van Noach negenhonderd en vijftig jaren; en hij stierf."},"KJV":{"1":"And God blessed Noah and his sons, and said unto them, Be fruitful, and multiply, and replenish the earth.","2":"And the fear of you and the dread of you shall be upon every beast of the earth, and upon every fowl of the air, upon all that moveth *upon* the earth, and upon all the fishes of the sea; into your hand are they delivered.","3":"Every moving thing that liveth shall be meat for you; even as the green herb have I given","4":"But flesh with the life thereof, *which is* the blood thereof, shall ye not eat.","5":"And surely your blood of your lives will I require; at the hand of every beast will I require it, and at the hand of man; at the hand of every man's brother will I require the life of man.","6":"Whoso sheddeth man's blood, by man shall his blood be shed: for in the image of God made he man.","7":"And you, be ye fruitful, and multiply; bring forth abundantly in the earth, and multiply","8":"And God spake unto Noah, and to his sons with him, saying,","9":"And I, behold, I establish my covenant with you, and with your seed after you;","10":"And with every living creature that *is* with you, of the fowl, of the cattle, and of every beast of the earth with you; from all that go out of the ark, to every beast of the earth.","11":"And I will establish my covenant with you; neither shall all flesh be cut off any more by the waters of a flood; neither shall there any more be a flood to destroy the earth.","12":"And God said, This *is* the token of the covenant which I make between me and you and every living creature that *is* with you, for perpetual generations:","13":"I do set my bow in the cloud, and it shall be for a token of a covenant between me and the earth.","14":"And it shall come to pass, when I bring a cloud over the earth, that the bow shall be seen in the cloud:","15":"And I will remember my covenant, which *is* between me and you and every living creature of all flesh; and the waters shall no more become a flood to destroy all flesh.","16":"And the bow shall be in the cloud; and I will look upon it, that I may remember the everlasting covenant between God and every living creature of all flesh that *is* upon the earth.","17":"And God said unto Noah, This *is* the token of the covenant, which I have established between me and all flesh that *is* upon the earth.","18":"And the sons of Noah, that went forth of the ark, were Shem, and Ham, and Japheth: and Ham *is* the father of Canaan.","19":"These *are* the three sons of Noah: and of them was the whole earth overspread.","20":"And Noah began *to be* an husbandman, and he planted a vineyard:","21":"And he drank of the wine, and was drunken; and he was uncovered within his tent.","22":"And Ham, the father of Canaan, saw the nakedness of his father, and told his two brethren without.","23":"And Shem and Japheth took a garment, and laid *it* upon both their shoulders, and went backward, and covered the nakedness of their father; and their faces *were* backward, and they saw not their father's nakedness.","24":"And Noah awoke from his wine, and knew what his younger son had done","25":"And he said, Cursed *be* Canaan; a servant of servants shall he be unto his brethren.","26":"And he said, Blessed *be* the LORD God of Shem; and Canaan shall be his servant.","27":"God shall enlarge Japheth, and he shall dwell in the tents of Shem; and Canaan shall be his servant.","28":"And Noah lived after the flood three hundred and fifty years.","29":"And all the days of Noah were nine hundred and fifty years: and he died."}},"tsk":{"1":[{"kopje":"zegende","refs":["Gen 9:7","Gen 1:22","Gen 1:28","Gen 2:3","Gen 8:17","Gen 24:60","Ps 112:1","Ps 128:3","Ps 128:4","Jes 51:2"]},{"kopje":"Wees","refs":["Gen 9:7","Gen 9:19","Gen 1:28","Gen 8:17","Gen 10:32"]}],"3":[{"kopje":"Alles wat zich beweegt","refs":["Lev 11:1-47","Lev 22:8","Deut 12:15","Deut 14:3-21","Hand 10:12-15","1 Tim 4:3-5"]},{"kopje":"zoals het groene kruid","refs":["Gen 1:29","Gen 1:30","Ps 104:14","Ps 104:15","Rom 14:3","Rom 14:14","Rom 14:17","Rom 14:20","1 Kor 10:23","1 Kor 10:25","1 Kor 10:26","1 Kor 10:31","Kol 2:16","Kol 2:21","Kol 2:22","1 Tim 4:3","1 Tim 4:4"]}],"4":[{"kopje":"zijn ziel","refs":["Lev 3:17","Lev 7:26","Lev 17:10-14","Lev 19:26","Deut 12:16","Deut 12:23","Deut 14:21","Deut 15:23","1 Sam 14:34","Hand 15:20","Hand 15:25","Hand 15:29","1 Tim 4:4"]}],"5":[{"kopje":"elk dier","refs":["Ex 21:12","Ex 21:28","Ex 21:29"]},{"kopje":"ook van","refs":["Gen 4:9","Gen 4:10","Lev 19:16","Num 35:31-33","Deut 21:1-9","Ps 9:13","Matt 23:35"]},{"kopje":"broeder","refs":["Hand 17:26"]}],"6":[{"kopje":"door","refs":["Ex 21:12-14","Ex 22:2","Ex wl-kjv\" data-code=\"H389\">But</span> <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh</span> with the <span class=\"wl wl-kjv\" data-code=\"H5315\">life</span> thereof, which is the <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> thereof, shall ye not eat.","5":"And <span class=\"wl wl-kjv\" data-code=\"H389\">surely</span> your <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> of your <span class=\"wl wl-kjv\" data-code=\"H5315\">lives</span> will I <span class=\"wl wl-kjv\" data-code=\"H1875\">require;</span> at the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of every <span class=\"wl wl-kjv\" data-code=\"H2416\">beast</span> will I require <span class=\"wl wl-kjv\" data-code=\"H1875\">it,</span> and at the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of <span class=\"wl wl-kjv\" data-code=\"H120\">man;</span> at the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of every <span class=\"wl wl-kjv\" data-code=\"H376\">man's</span> <span class=\"wl wl-kjv\" data-code=\"H251\">brother</span> will I <span class=\"wl wl-kjv\" data-code=\"H1875\">require</span> the <span class=\"wl wl-kjv\" data-code=\"H5315\">life</span> of man.","6":"Whoso <span class=\"wl wl-kjv\" data-code=\"H8210\">sheddeth</span> <span class=\"wl wl-kjv\" data-code=\"H120\">man's</span> <span class=\"wl wl-kjv\" data-code=\"H1818\">blood,</span> by <span class=\"wl wl-kjv\" data-code=\"H120\">man</span> shall his <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> be <span class=\"wl wl-kjv\" data-code=\"H8210\">shed:</span> for in the <span class=\"wl wl-kjv\" data-code=\"H6754\">image</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">made</span> he man.","7":"And you, be ye <span class=\"wl wl-kjv\" data-code=\"H6509\">fruitful,</span> and <span class=\"wl wl-kjv\" data-code=\"H7235\">multiply;</span> bring forth <span class=\"wl wl-kjv\" data-code=\"H8317\">abundantly</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">earth,</span> and multiply","8":"And <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H559\">spake</span> unto <span class=\"wl wl-kjv\" data-code=\"H5146\">Noah,</span> and to his <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> with him, saying,","9":"And I, behold, I <span class=\"wl wl-kjv\" data-code=\"H6965\">establish</span> my <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant</span> with you, and with your <span class=\"wl wl-kjv\" data-code=\"H2233\">seed</span> after you;","10":"And with every <span class=\"wl wl-kjv\" data-code=\"H2416\">living</span> <span class=\"wl wl-kjv\" data-code=\"H5315\">creature</span> that is with you, of the <span class=\"wl wl-kjv\" data-code=\"H5775\">fowl,</span> of the <span class=\"wl wl-kjv\" data-code=\"H929\">cattle,</span> and of every <span class=\"wl wl-kjv\" data-code=\"H2416\">beast</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> with you; from all that go <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> of the <span class=\"wl wl-kjv\" data-code=\"H8392\">ark,</span> to every <span class=\"wl wl-kjv\" data-code=\"H2416\">beast</span> of the earth.","11":"And I will <span class=\"wl wl-kjv\" data-code=\"H6965\">establish</span> my <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant</span> with you; neither shall all <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh</span> be cut <span class=\"wl wl-kjv\" data-code=\"H3772\">off</span> any more by the <span class=\"wl wl-kjv\" data-code=\"H4325\">waters</span> of a <span class=\"wl wl-kjv\" data-code=\"H3999\">flood;</span> neither shall there any more be a <span class=\"wl wl-kjv\" data-code=\"H3999\">flood</span> to <span class=\"wl wl-kjv\" data-code=\"H7843\">destroy</span> the earth.","12":"And <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> This is the <span class=\"wl wl-kjv\" data-code=\"H226\">token</span> of the <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant</span> which <span class=\"wl wl-kjv\" data-code=\"H589\">I</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">make</span> between me and you and every <span class=\"wl wl-kjv\" data-code=\"H2416\">living</span> <span class=\"wl wl-kjv\" data-code=\"H5315\">creature</span> that is with you, for <span class=\"wl wl-kjv\" data-code=\"H5769\">perpetual</span> generations:","13":"I do <span class=\"wl wl-kjv\" data-code=\"H5414\">set</span> my <span class=\"wl wl-kjv\" data-code=\"H7198\">bow</span> in the <span class=\"wl wl-kjv\" data-code=\"H6051\">cloud,</span> and it shall be for a <span class=\"wl wl-kjv\" data-code=\"H226\">token</span> of a <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant</span> between me and the earth.","14":"And it shall come to pass, when I <span class=\"wl wl-kjv\" data-code=\"H6049\">bring</span> a <span class=\"wl wl-kjv\" data-code=\"H6051\">cloud</span> over the <span class=\"wl wl-kjv\" data-code=\"H776\">earth,</span> that the <span class=\"wl wl-kjv\" data-code=\"H7198\">bow</span> shall be <span class=\"wl wl-kjv\" data-code=\"H7200\">seen</span> in the cloud:","15":"And I will <span class=\"wl wl-kjv\" data-code=\"H2142\">remember</span> my <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant,</span> which is between me and you and every <span class=\"wl wl-kjv\" data-code=\"H2416\">living</span> <span class=\"wl wl-kjv\" data-code=\"H5315\">creature</span> of all <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh;</span> and the <span class=\"wl wl-kjv\" data-code=\"H4325\">waters</span> shall no <span class=\"wl wl-kjv\" data-code=\"H5750\">more</span> become a <span class=\"wl wl-kjv\" data-code=\"H3999\">flood</span> to <span class=\"wl wl-kjv\" data-code=\"H7843\">destroy</span> all flesh.","16":"And the <span class=\"wl wl-kjv\" data-code=\"H7198\">bow</span> shall be in the <span class=\"wl wl-kjv\" data-code=\"H6051\">cloud;</span> and I will look upon <span class=\"wl wl-kjv\" data-code=\"H7200\">it,</span> that I may <span class=\"wl wl-kjv\" data-code=\"H2142\">remember</span> the <span class=\"wl wl-kjv\" data-code=\"H5769\">everlasting</span> <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant</span> <span class=\"wl wl-kjv\" data-code=\"H996\">between</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H996\">and</span> every <span class=\"wl wl-kjv\" data-code=\"H2416\">living</span> <span class=\"wl wl-kjv\" data-code=\"H5315\">creature</span> of all <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh</span> that is upon the earth.","17":"And <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H5146\">Noah,</span> This is the <span class=\"wl wl-kjv\" data-code=\"H226\">token</span> of the <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant,</span> which I have <span class=\"wl wl-kjv\" data-code=\"H6965\">established</span> between me and all <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh</span> that is upon the earth.","18":"And the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H5146\">Noah,</span> that went <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> of the <span class=\"wl wl-kjv\" data-code=\"H8392\">ark,</span> were <span class=\"wl wl-kjv\" data-code=\"H8035\">Shem,</span> and <span class=\"wl wl-kjv\" data-code=\"H2526\">Ham,</span> and <span class=\"wl wl-kjv\" data-code=\"H3315\">Japheth:</span> and <span class=\"wl wl-kjv\" data-code=\"H2526\">Ham</span> is the <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> of Canaan.","19":"These are the <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;

  const n = k.dataset.n;

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:Lora;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
