nthouden, behalve u, omdat u zijn vrouw bent; hoe zou ik dan dit zo grote kwaad doen, en zondigen tegen God!", "10": "En het gebeurde, toen zij Jozef dag op dag aansprak, en hij naar haar niet luisterde om bij haar te liggen *en* bij haar te zijn,", "11": "dat het op zo'n dag gebeurde, dat hij in het huis kwam om zijn werk te doen; en niemand van de mensen van het huis was daar binnen.", "12": "En zij greep hem bij zijn kleed en zei: Lig bij mij! En hij liet zijn kleed in haar hand, en vluchtte, en ging naar buiten.", "13": "En het gebeurde, toen zij zag dat hij zijn kleed in haar hand had gelaten, en naar buiten gevlucht was,", "14": "dat zij de mensen van haar huis riep, en tegen hen zei: Ziet, hij heeft ons de Hebreeuwse man binnengebracht, om met ons te spotten; hij is bij mij gekomen om bij mij te liggen, en ik heb met luide stem geroepen;", "15": "en het gebeurde, toen hij hoorde dat ik mijn stem verhief en riep, dat hij zijn kleed bij mij achterliet, en vluchtte, en naar buiten ging.", "16": "En zij legde zijn kleed bij zich, totdat zijn heer in zijn huis kwam.", "17": "Toen sprak zij tot hem met diezelfde woorden, en zei: De Hebreeuwse knecht die u ons hebt binnengebracht, is bij mij gekomen, om met mij te spotten.", "18": "En het is gebeurd, toen ik mijn stem verhief en riep, dat hij zijn kleed bij mij liet, en naar buiten vluchtte.", "19": "En het gebeurde, toen zijn heer de woorden van zijn vrouw hoorde, die zij tegen hem sprak en zei: Op deze manier heeft uw knecht mij gedaan, dat zijn woede oplaaide.", "20": "En Jozefs heer nam hem, en leverde hem over in de gevangenis, op de plaats waar de gevangenen van de koning gevangen zaten; zo was hij daar in de gevangenis.", "21": "Maar de HEERE was met Jozef, en bewees hem *Zijn* goedertierenheid; en gaf hem genade in de ogen van de leider van de gevangenis.", "22": "En de leider van de gevangenis gaf alle gevangenen die in de gevangenis waren in Jozefs hand; en alles wat zij daar deden, deed hij.", "23": "De leider van de gevangenis had geen omzien meer naar enig ding dat in zijn hand was, omdat de HEERE met hem was; en wat hij deed, dat deed de HEERE goed gedijen."}, "SV": {"1": "Jozef nu werd naar Egypte afgevoerd; en Potifar, een hoveling van Farao, een overste der trawanten, een Egyptisch man, kocht hem uit de hand der Ismaëlieten, die hem derwaarts afgevoerd hadden.", "2": "En de HEERE was met Jozef, zodat hij een voorspoedig man was; en hij was in het huis van zijn heer, den Egyptenaar.", "3": "Als nu zijn heer zag, dat de HEERE met hem was, en dat de HEERE al wat hij deed, door zijn hand voorspoedig maakte;", "4": "Zo vond Jozef genade in zijn ogen, en diende hem; en hij stelde hem over zijn huis; en al wat hij had, gaf hij in zijn hand.", "5": "En het geschiedde van toen af, dat hij hem over zijn huis, en over al wat het zijne was, gesteld had, dat de HEERE des Egyptenaars huis zegende, om Jozefs wil; ja, de zegen des HEEREN was in alles, wat hij had, in het huis en in het veld.", "6": "En hij liet alles, wat hij had, in Jozefs hand, zodat hij met hem van geen ding kennis had, behalve van het brood, dat hij at. En Jozef was schoon van gedaante, en schoon van aangezicht.", "7": "En het geschiedde na deze dingen, dat de huisvrouw zijns heren haar ogen op Jozef wierp; en zij zeide: lig bij mij!", "8": "Maar hij weigerde het, en zeide tot de huisvrouw zijns heren: Zie, mijn heer heeft geen kennis met mij, wat er in het huis is; en al wat hij heeft, dat heeft hij in mijn hand gegeven.", "9": "Niemand is groter in dit huis dan ik, en hij heeft voor mij niets onthouden, dan u, daarin dat gij zijn huisvrouw zijt; hoe zoude ik dan dit een zo groot kwaad doen, en zondigen tegen God!", "10": "En het geschiedde, als zij Jozef dag op dag aansprak, en hij naar haar niet hoorde, om bij haar te liggen, *en* bij haar te zijn;", "11": "Zo gebeurde het op zulk een dag, dat hij in het huis kwam, om zijn werk te doen; en niemand van de lieden des huizes was daar binnenshuis.", "12": "En zij greep hem bij zijn kleed, zeggende: Lig bij mij! En hij liet zijn kleed in haar hand, en vluchtte, en ging uit naar buiten.", "13": "En het geschiedde, als zij zag, dat hij zijn kleed in haar hand gelaten had, en naar buiten gevlucht was;", "14": "Zo riep zij de lieden van haar huis, en sprak tot hen, zeggende: Ziet, hij heeft ons den Hebreeuwsen man ingebracht, om met ons te spotten; hij is tot mij gekomen, om bij mij te liggen, en ik heb geroepen met luider stem;", "15": "En het geschiedde, als hij hoorde, dat ik mijn stem verhief, en riep, zo verliet hij zijn kleed bij mij, en vluchtte, en ging uit naar buiten.", "16": "En zij leide zijn kleed bij zich, totdat zijn heer in zijn huis kwam.", "17": "Toen sprak zij tot hem naar diezelfde woorden, zeggende: De Hebreeuwse knecht, dien gij ons hebt ingebracht, is tot mij gekomen, om met mij te spotten.", "18": "En het is geschied, als ik mijn stem verhief, en riep, dat hij zijn kleed bij mij liet, en vluchtte naar buiten.", "19": "En het geschiedde, als zijn heer de woorden zijner huisvrouw hoorde, die zij tot hem sprak, zeggende: Naar deze zelfde woorden heeft mij uw knecht gedaan, zo ontstak zijn toorn.", "20": "En Jozefs heer nam hem, en leverde hem in het gevangenhuis, ter plaatse, waar des konings gevangenen gevangen waren; alzo was hij daar in het gevangenhuis.", "21": "Doch de HEERE was met Jozef, en wende *Zijn* goedertierenheid tot hem; en gaf hem genade in de ogen van den overste van het gevangenhuis.", "22": "En de overste van het gevangenhuis gaf al de gevangenen, die in het gevangenhuis waren, in Jozefs hand; en al wat zij daar deden, deed hij.", "23": "De overste van het gevangenhuis zag gans op geen ding, dat in zijn hand was, overmits dat de HEERE met hem was; en wat hij deed, dat deed de HEERE wel gedijen."}, "KJV": {"1": "And Joseph was brought down to Egypt; and Potiphar, an officer of Pharaoh, captain of the guard, an Egyptian, bought him of the hands of the Ishmeelites, which had brought him down", "2": "And the LORD was with Joseph, and he was a prosperous man; and he was in the house of his master the Egyptian.", "3": "And his master saw that the LORD *was* with him, and that the LORD made all that he did to prosper in his hand.", "4": "And Joseph found grace in his sight, and he served him: and he made him overseer over his house, and all *that* he had he put into his hand.", "5": "And it came to pass from the time *that* he had made him overseer in his house, and over all that he had, that the LORD blessed the Egyptian's house for Joseph's sake; and the blessing of the LORD was upon all that he had in the house, and in the field.", "6": "And he left all that he had in Joseph's hand; and he knew not ought he had, save the bread which he did eat. And Joseph was *a* goodly *person*, and well favoured.", "7": "And it came to pass after these things, that his master's wife cast her eyes upon Joseph; and she said, Lie", "8": "But he refused, and said unto his master's wife, Behold, my master wotteth not what *is* with me in the house, and he hath committed all that he hath to my hand;", "9": "*There is* none greater in this house than I; neither hath he kept back any thing from me but thee, because thou *art* his wife: how then can I do this great wickedness, and sin against God?", "10": "And it came to pass, as she spake to Joseph day by day, that he hearkened not unto her, to lie by her,", "11": "And it came to pass about this time, that *Joseph* went into the house to do his business; and *there was* none of the men of the house", "12": "And she caught him by his garment, saying, Lie with me: and he left his garment in her hand, and fled, and got him out.", "13": "And it came to pass, when she saw that he had left his garment in her hand, and was fled forth,", "14": "That she called unto the men of her house, and spake unto them, saying, See, he hath brought in an Hebrew unto us to mock us; he came in unto me to lie with me, and I cried with a loud voice:", "15": "And it came to pass, when he heard that I lifted up my voice and cried, that he left his garment with me, and fled, and got him out.", "16": "And she laid up his garment by her, until his lord came home.", "17": "And she spake unto him according to these words, saying, The Hebrew servant, which thou hast brought unto us, came in unto me to mock", "18": "And it came to pass, as I lifted up my voice and cried, that he left his garment with me, and fled out.", "19": "And it came to pass, when his master heard the words of his wife, which she spake unto him, saying, After this manner did thy servant to me; that his wrath was kindled.", "20": "And Joseph's master took him, and put him into the prison, a place where the king's prisoners *were* bound: and he was there in the prison.", "21": "But the LORD was with Joseph, and shewed him mercy, and gave him favour in the sight of the keeper of the prison.", "22": "And the keeper of the prison committed to Joseph's hand all the prisoners that *were* in the prison; and whatsoever they did there, he was the doer", "23": "The keeper of the prison looked not to any thing *that was* under his hand; because the LORD was with him, and *that* which he did, the LORD made *it* to prosper."}}, "tsk": {"1": [{"kopje": "Jozef", "refs": ["Gen 37:36", "Gen 45:4", "Ps 105:17", "Hand 7:9"]}, {"kopje": "Ismaëlieten", "refs": ["Gen 37:25", "Gen 37:28"]}], "2": [{"kopje": "de HEERE", "refs": ["Gen 39:21", "Gen 39:22", "Gen 21:22", "Gen 26:24", "Gen 26:28", "Gen 28:15", "1 Sam 3:19", "1 Sam 16:18", "1 Sam 18:14", "1 Sam 18:28", "Ps 1:3", "Ps 46:8", "Ps 46:12", "Ps 91:15", "Jes 8:9", "Jes 8:10", "Jes 41:10", "Jes 43:2", "Jer 15:20", "Matt 1:23", "Hand 7:9", "Hand 7:10", "Hand 8:31"]}, {"kopje": "huis", "refs": ["1 Kor 7:20-24", "1 Tim 6:1", "Tit 2:9", "Tit 2:10"]}], "3": [{"kopje": "zag dat", "refs": ["Gen 21:22", "Gen 26:24", "Gen 26:28", "Gen 30:27", "Gen 30:30", "1 Sam 18:14", "1 Sam 18:28", "Zach 8:23", "Matt 5:16", "Fil 2:15", : [{"label": "1. Son of Jacob", "href": "../../nave/j/?hl=Gen.39.23#i11727", "refs": [], "kinderen": [{"label": "Is prospered of God", "href": "../../nave/j/?hl=Gen.39.23#i11735", "refs": [{"disp": "Gen 39:2-5", "href": "../../genesis/39/#v2", "ref": "Gen 39:2-5", "svLabel": null}, {"disp": "Gen 39:21", "href": "../../genesis/39/#v21", "ref": "Gen 39:21", "svLabel": null}, {"disp": "Gen 39:23", "href": "../../genesis/39/#v23", "ref": "Gen 39:23", "svLabel": null}], "kinderen": []}]}]}], "torrey": [{"topic": "Faithfulness", "href": "../../torrey/f/#t-faithfulness", "kinderen": [{"label": "Exemplified", "href": "../../torrey/f/?hl=Gen.39.23#i6165", "refs": [], "kinderen": [{"label": "Joseph", "href": "../../torrey/f/?hl=Gen.39.23#i6166", "refs": [{"disp": "Gen 39:22", "href": "../../genesis/39/#v22", "ref": "Gen 39:22", "svLabel": null}, {"disp": "Gen 39:23", "href": "../../genesis/39/#v23", "ref": "Gen 39:23", "svLabel": null}], "kinderen": []}]}]}, {"topic": "Prisons", "href": "../../torrey/p/#t-prisons", "kinderen": [{"label": "Keepers Of", "href": "../../torrey/p/?hl=Gen.39.23#i16128", "refs": [], "kinderen": [{"label": "Sometimes entrusted the care of the prison towell-conducted prisoners", "href": "../../torrey/p/?hl=Gen.39.23#i16134", "refs": [{"disp": "Gen 39:22", "href": "../../genesis/39/#v22", "ref": "Gen 39:22", "svLabel": null}, {"disp": "Gen 39:23", "href": "../../genesis/39/#v23", "ref": "Gen 39:23", "svLabel": null}], "kinderen": []}]}]}]}}, "extern": {"Tit 2:9": "Vermaan de dienstknechten dat zij hun eigen heren onderdanig zijn, dat zij in alles welgevallig zijn, niet tegensprekend;", "Spr 31:11": "Beth. Het hart van haar man vertrouwt op haar, zodat het hem aan geen goed zal ontbreken.", "Luk 4:1-13": "En Jezus, vol van de Heilige Geest, keerde terug van de Jordaan, en werd door de Geest geleid in de woestijn; En werd veertig dagen beproefd door de duivel; en at helemaal niets in die dagen, en toen ze voorbij waren, kreeg Hij ten laatste honger. En de duivel zei tegen Hem: Als U Gods Zoon bent, zeg tegen deze steen dat hij brood wordt.", "1 Kor 6:18": "Vlucht voor de hoererij. Elke zonde die de mens doet, is buiten het lichaam, maar wie hoererij bedrijft, zondigt tegen zijn eigen lichaam.", "Gen 24:2": "Zo zei Abraham tegen zijn knecht, de oudste van zijn huis, die over alles regeerde wat hij had: Leg toch uw hand onder mijn heup,", "Spr 18:24": "Een man die vrienden heeft, moet zich vriendelijk gedragen; want er is een vriend die meer aankleeft dan een broeder.", "Gen 41:38-44": "Toen zei Farao tegen zijn dienaars: Zouden wij wel een man vinden zoals deze, in wie de Geest van God is? Daarna zei Farao tegen Jozef: Omdat God u dit alles heeft bekendgemaakt, is er niemand zo verstandig en wijs als u. U zult over mijn huis zijn, en op uw bevel zal heel mijn volk de hand kussen; alleen door de troon zal ik groter zijn dan u.", "Ezech 27:13": "Javan, Tubal en Mesech waren uw kooplieden; met mensenzielen en koperen vaten dreven zij onderlinge handel met u.", "Spr 7:13-27": "En zij greep hem vast, en kuste hem; zij verhardde haar gezicht, en zei tegen hem: Dankoffers zijn bij mij, ik heb vandaag mijn geloften betaald; Daarom ben ik uitgegaan u tegemoet, om uw gezicht ijverig te zoeken, en ik heb u gevonden.", "Mark 14:51": "En een zekere jongeman volgde Hem, gekleed in een linnen doek over zijn naakte lichaam, en de jongemannen grepen hem.", "Jer 28:16": "Daarom, zo zegt de HEERE: Zie, Ik zal u wegwerpen van de aardbodem; dit jaar zult u sterven, omdat u een afval gesproken hebt tegen de HEERE.", "Spr 29:12": "Een heerser die op leugentaal let, al zijn dienaars worden goddeloos.", "Ex 11:3": "En de HEERE gaf het volk genade in de ogen van de Egyptenaren; ook was de man Mozes zeer groot in Egypteland voor de ogen van Farao's knechten, en voor de ogen van het volk.)", "Ps 105:18": "Men drukte zijn voeten in de stok; zijn persoon kwam in de ijzers.", "Spr 6:5": "red uzelf, als een ree uit de hand van de jager, en als een vogel uit de hand van de vogelvanger.", "Gen 41:41": "Verder zei Farao tegen Jozef: Zie, ik heb u over heel Egypteland gesteld.", "Gen 45:7": "Doch God heeft mij voor uw aangezicht heen gezonden, om u een overblijfsel te stellen op de aarde, en om u bij het leven te behouden, door een grote verlossing.", "1 Petr 4:14-19": "Als u gesmaad wordt om de Naam van Christus, dan bent u gelukkig; want de Geest van de heerlijkheid, en de Geest van God, rust op u. Wat hen aangaat, Hij wordt wel gelasterd, maar wat u aangaat, Hij wordt verheerlijkt. Want laat niemand van u lijden als een moordenaar, of dief, of kwaaddoener, of als iemand die zich met de zaken van een ander bemoeit; maar als iemand lijdt als een christen, laat hij zich daar niet voor schamen, maar God verheerlijken in dit opzicht.", "Spr 22:14": "De mond van vreemde vrouwen is een diepe kuil; op wie de HEERE vertoornd is, zal daarin vallen.", "Jes 8:10": "Beraadslaag een plan, toch zal het vernietigd worden; spreek een woord, toch zal het niet standhouden; want God is met ons!", "Luk 19:17": "En hij zei tegen hem: Goed, u goede dienstknecht, omdat u in het minste betrouwbaar bent geweest, heb macht over tien steden.", "1 Kor 6:13": "De spijzen zijn voor de buik, en de buik is voor de spijzen; maar God zal beide dit en dat tenietdoen. Maar het lichaam is niet voor de hoererij, maar voor de Heere, en de Heere voor het lichaam.", "2 Sam 6:12": "Toen berichtte men aan koning David: De HEERE heeft het huis van Obed-edom, en alles wat hij heeft, gezegend om de ark van God. Zo ging David heen en haalde de ark van God uit het huis van Obed-edom naar de stad van David, met vreugde.", "1 Sam 3:19": "Samuël nu werd groot; en de HEERE was met hem, en liet niet een van al Zijn woorden onvervuld.", "Ps 46:8": "De HEERE van de heerscharen is met ons; de God van Jakob is ons een Hoog Vertrek. Sela.", "Jer 15:20": "Want Ik heb u tegen dit volk gesteld tot een koperen versterkte muur; zij zullen wel tegen u strijden, maar u niet overwinnen; want Ik ben met u, om u te behouden en om u te redden, spreekt de HEERE.", "1 Kor 16:2": "Op elke eerste dag van de week legt ieder van u iets bij zichzelf weg en verzamelt een schat, naardat hij welvaren verkregen heeft, opdat de verzamelingen niet eerst gebeuren wanneer ik gekomen zal zijn.", "Ps 105:17-22": "Hij zond een man voor hun aangezicht heen; Jozef werd verkocht tot een slaaf. Men drukte zijn voeten in de stok; zijn persoon kwam in de ijzers. Tot de tijd toe dat Zijn woord kwam, heeft de rede van de HEERE hem doorlouterd.", "Ezech 22:5": "Wie dichtbij en veraf van u zijn, zullen u bespotten, u onreine van naam en vol van onrust!", "Rom 8:32": "Hij Die zelfs Zijn eigen Zoon niet gespaard heeft, maar Hem voor ons allen overgegeven heeft, hoe zal Hij ons ook met Hem niet alle dingen schenken?", "1 Petr 2:19": "Want dat is genade, als iemand omwille van het geweten voor God moeite verdraagt, terwijl hij ten onrechte lijdt.", "Gen 50:20": "U wel, u hebt kwaad tegen mij gedacht; doch God heeft dat ten goede gedacht; opdat Hij deed, zoals het op deze dag is, om een groot volk in het leven te behouden.", "Spr 9:13-18": "Een dwaze vrouw is druk en luidruchtig, zij is de eenvoud zelf, en weet helemaal niets. En zij zit aan de deur van haar huis, op een stoel, op de hoge plaatsen van de stad; om te roepen naar hen die op de weg voorbijgaan, die hun paden recht maken:", "1 Tim 5:14": "Ik wil dan dat de jonge weduwen trouwen, kinderen krijgen, het huis besturen, en geen aanleiding tot smaad geven aan de tegenpartij.", "Joël 3:6": "En u hebt de kinderen van Juda en de kinderen van Jeruzalem verkocht aan de kinderen van de Grieken, om hen ver van hun grondgebied te brengen.", "Hand 12:5": "Petrus dan werd in de gevangenis bewaakt; maar door de gemeente werd voortdurend tot God voor hem gebeden.", "Gen 30:30": "Want het weinige dat u voor mij had, is uitgebroken tot een menigte; en de HEERE heeft u gezegend bij mijn komst; nu dan, wanneer zal ik ook voor mijn eigen huis werken?", "Gen 12:14": "En het gebeurde, toen Abram in Egypte kwam, dat de Egyptenaren deze vrouw zagen, dat zij zeer knap was.", "Fil 3:5": "Besneden op de achtste dag, uit het geslacht van Israël, van de stam van Benjamin, een Hebreeër uit de Hebreeën, wat de wet betreft een Farizeeër;", "Ezech 16:32": "O, die overspelige vrouw, zij neemt in plaats van haar man de vreemden aan.", "Lev 20:10": "Een man ook, die met de vrouw van een ander overspel doet, omdat hij overspel doet met de vrouw van zijn naaste, zal zeker gedood worden, de overspeler en de overspeelster.", "Ps 105:17": "Hij zond een man voor hun aangezicht heen; Jozef werd verkocht tot een slaaf.", "Gen 33:10": "Toen zei Jakob: Nee toch! Als ik nu genade in uw ogen gevonden heb, neem dan mijn geschenk uit mijn hand aan; want ik heb daarom uw gezicht gezien alsof ik Gods gezicht gezien had, en u hebt mij welwillend ontvangen.", "Spr 5:3": "Want de lippen van de vreemde vrouw druppen honingzeem, en haar gehemelte is gladder dan olie.", "Gen 26:28": "En zij zeiden: Wij hebben duidelijk gezien dat de HEERE met u is; daarom hebben wij gezegd: Laat er toch een eed zijn tussen ons, tussen ons en u, en laat ons een verbond met u sluiten:", "Spr 7:25-27": "Laat uw hart naar haar wegen niet wijken, dwaal niet op haar paden. Want zij heeft veel gewonden neergeveld, en al haar gedoden zijn machtig veel. Haar huis, dat zijn wegen naar het graf, dalend naar de binnenkamers van de dood.", "Spr 6:25": "Begeer haar schoonheid niet in uw hart, en laat u door haar niet vangen met haar oogleden.", "Gen 40:15": "Want ik ben als dief weggehaald uit het land van de Hebreeën; en ook heb ik hier niets gedaan, dat zij mij in deze kuil gezet hebben.", "Jona 1:9": "En hij zei tegen hen: Ik ben een Hebreeër; en ik vrees de HEERE, de God van de hemel, Die de zee en het droge gemaakt heeft.", "Jer 3:3": "Daarom zijn de regendruppels ingehouden, en is er geen late regen geweest. Maar u hebt een hoerenvoorhoofd, u weigert schaamrood te worden.", "Ps 21:7": "Want U zet hem tot zegeningen in eeuwigheid; U vervrolijkt hem door vreugde met Uw aangezicht.", "Hand 6:1": "In diezelfde dagen, toen het aantal discipelen groeide, ontstond er gemor van de Griekssprekenden tegen de Hebreeën, omdat hun weduwen bij de dagelijkse verzorging over het hoofd werden gezien.", "Gen 4:6": "En de HEERE zei tegen Kaïn: Waarom bent u ontstoken, en waarom is uw gezicht betrokken?", "1 Kon 11:28": "De man Jerobeam was een dapper held. Toen Salomo deze jongeman zag, dat hij hard werkte, stelde hij hem aan over al de lastdienst van het huis van Jozef.", "Spr 5:8": "Maak uw weg ver van haar vandaan, en kom niet bij de deur van haar huis;", "Dan 1:17-21": "Aan deze vier jongemannen nu gaf God kennis en verstand in alle boeken, en wijsheid; maar Daniël gaf Hij inzicht in allerlei visioenen en dromen. Aan het einde van de dagen nu, waarvan de koning gezegd had dat men hen zou binnenbrengen, bracht de leider van de kamerlingen hen bij Nebukadnezar, En de koning sprak met hen; maar er werd onder hen allen niemand gevonden zoals Daniël, Hananja, Misaël en Azarja; en zij stonden voor de koning.", "Lev 24:12": "En zij zetten hem in bewaring, totdat hun, naar de mond van de HEERE, uitspraak gedaan zou worden.", "Spr 18:17": "Wie het eerst zijn zaak bepleit, lijkt rechtvaardig; maar zijn naaste komt, en die onderzoekt hem.", "Matt 25:15": "En aan de één gaf hij vijf talenten, en aan de ander twee, en aan de derde één, ieder naar zijn vermogen, en hij vertrok meteen.", "Matt 25:13": "Waak dan; want u weet de dag niet, en ook het uur niet, waarop de Zoon des mensen komen zal.", "Matt 26:59": "En de overpriesters en de oudsten en de hele Grote Raad zochten valse getuigenis tegen Jezus, opdat zij Hem konden doden; en zij vonden niets.", "Mark 13:33-37": "Let op, waak en bid; want u weet niet wanneer de tijd is. Zoals een man die naar het buitenland reisde, zijn huis verliet, en zijn dienaren macht gaf, en ieder zijn werk, en de deurwachter gebood dat hij zou waken; Waak dan (want u weet niet wanneer de heer des huizes zal komen, laat in de avond, of te middernacht, of bij het hanengekraai, of in de ochtend);", "Luk 19:12-27": "Hij zei dan: Een man van hoge afkomst reisde naar een ver land om voor zichzelf een koninkrijk te ontvangen, en dan terug te keren. En hij riep zijn tien dienstknechten, gaf hun tien ponden, en zei tegen hen: Doe er zaken mee totdat ik terugkom. Maar zijn burgers haatten hem, en stuurden gezanten achter hem aan, die zeiden: Wij willen niet dat deze man koning over ons wordt.", "Openb 22:15": "Maar buiten zullen zijn de honden, en de tovenaars, en de hoereerders, en de doodslagers, en de afgodendienaars, en ieder die de leugen liefheeft en doet.", "Jer 5:8": "Als goed gevoede hengsten zijn zij vroeg op; zij hunkeren, ieder naar de vrouw van zijn naaste.", "Gen 41:9-57": "Toen sprak de leider van de schenkers tot Farao: Ik denk vandaag aan mijn zonden. Farao was zeer toornig op zijn dienaars, en leverde mij in bewaring in het huis van de leider van de lijfwacht, mij en de leider van de bakkers. En in één nacht droomden wij een droom, ik en hij; wij droomden ieder naar de uitleg van zijn droom.", "Tit 2:10": "Niet ontvreemdend, maar alle goede trouw bewijzend; opdat zij de leer van God, onze Zaligmaker, in alles sieren.", "2 Tess 2:11": "En daarom zal God hun een kracht van de dwaling zenden, zodat zij de leugen zouden geloven;", "Mal 3:5": "En Ik zal tot u naderen ten oordeel; en Ik zal een snel Getuige zijn tegen de tovenaars, en tegen de overspelers, en tegen hen die vals zweren, en tegen hen die het loon van de dagloner met geweld inhouden, die de weduwe, en de wees, en de vreemdeling het recht verdraaien, en Mij niet vrezen, zegt de HEERE van de heerscharen.", "Ps 73:2-26": "Maar wat mij aangaat, mijn voeten waren bijna uitgegleden; mijn schreden waren bijna weggegleden. Want ik was jaloers op de dwazen, toen ik de vrede van de goddelozen zag. Want er zijn geen boeien tot hun dood toe, en hun kracht is fris.", "Neh 6:11": "Maar ik zei: Zou een man als ik vluchten? En wie zou, in mijn positie, de tempel ingaan om zijn leven te redden? Ik ga er niet in.", "Dan 3:21": "Toen werden die mannen gebonden in hun mantels, hun broeken, hun hoeden, en hun andere kleren, en zij wierpen hen in het midden van de brandende vuuroven.", "1 Joh 3:9": "Ieder die uit God geboren is, doet de zonde niet, want Zijn zaad blijft in hem; en hij kan niet zondigen, want hij is uit God geboren.", "Gen 40:1-3": "En het gebeurde na deze dingen, dat de schenker van de koning van Egypte en de bakker zondigden tegen hun heer, tegen de koning van Egypte. Zodat Farao zeer toornig werd op zijn twee hovelingen, op de leider van de schenkers, en op de leider van de bakkers. En hij leverde hen in bewaring, in het huis van de leider van de lijfwacht, in de gevangenis, ter plaatse waar Jozef gevangen zat.", "Job 31:23": "Want het verderf van God was bij mij een schrik, en ik vermocht niet vanwege Zijn hoogheid.", "Gen 41:9-14": "Toen sprak de leider van de schenkers tot Farao: Ik denk vandaag aan mijn zonden. Farao was zeer toornig op zijn dienaars, en leverde mij in bewaring in het huis van de leider van de lijfwacht, mij en de leider van de bakkers. En in één nacht droomden wij een droom, ik en hij; wij droomden ieder naar de uitleg van zijn droom.", "Ezech 23:6": "Bekleed met hemelsblauw, vorsten en machthebbers, allemaal aantrekkelijke jonge mannen, ruiters, rijdend op paarden.", "1 Sam 15:27": "Toen Samuël zich omkeerde om weg te gaan, greep hij een slip van zijn mantel, en die scheurde.", "Hand 20:28": "Zo, geef dan acht op uzelf, en op de hele kudde, waarover de Heilige Geest u tot opzieners heeft aangesteld, om de gemeente van God te weiden, die Hij verkregen heeft door Zijn eigen bloed.", "Gen 39:2-6": "En de HEERE was met Jozef, zodat hij een voorspoedig man was; en hij was in het huis van zijn heer, de Egyptenaar. Toen zijn heer zag dat de HEERE met hem was, en dat de HEERE alles wat hij deed door zijn hand voorspoedig maakte, vond Jozef genade in zijn ogen, en diende hem; en hij stelde hem aan over zijn huis, en alles wat hij had, gaf hij in zijn hand.", "Spr 9:14": "En zij zit aan de deur van haar huis, op een stoel, op de hoge plaatsen van de stad;", "Amos 8:6": "Zodat wij de armen voor geld mogen kopen, en de nooddruftige om een paar schoenen; en dan zullen wij het kaf van het koren verkopen.", "Jes 43:2": "Wanneer u door het water zult gaan, Ik zal bij u zijn, en door de rivieren, zij zullen u niet overstromen; wanneer u door het vuur zult gaan, zult u niet verbranden, en de vlam zal u niet aansteken.", "Gen 40:4": "En de leider van de lijfwacht stelde Jozef bij hen aan om hen te dienen; en zij waren enige dagen in bewaring.", "Gen 39:14-20": "dat zij de mensen van haar huis riep, en tegen hen zei: Ziet, hij heeft ons de Hebreeuwse man binnengebracht, om met ons te spotten; hij is bij mij gekomen om bij mij te liggen, en ik heb met luide stem geroepen; en het gebeurde, toen hij hoorde dat ik mijn stem verhief en riep, dat hij zijn kleed bij mij achterliet, en vluchtte, en naar buiten ging. En zij legde zijn kleed bij zich, totdat zijn heer in zijn huis kwam.", "Jes 54:17": "Elk instrument dat tegen u gemaakt wordt, zal niet gelukken, en elke tong, die in het gericht tegen u opstaat, zult u verdoemen; dit is het erfdeel van de knechten van de HEERE, en hun gerechtigheid is uit Mij, spreekt de HEERE.", "Spr 27:18": "Wie de vijgenboom bewaakt, zal zijn vrucht eten; en wie zijn heer waarneemt, zal geëerd worden.", "1 Petr 3:14": "Maar als u ook lijdt om de gerechtigheid, dan bent u gelukkig te prijzen; en wees niet bang voor hun dreiging, en raak niet in verwarring;", "Matt 4:1-11": "Toen werd Jezus door de Geest weggeleid naar de woestijn, om beproefd te worden door de duivel. En toen Hij veertig dagen en veertig nachten gevast had, kreeg Hij ten laatste honger. En de verzoeker kwam naar Hem toe en zei: Als U Gods Zoon bent, zeg dan dat deze stenen broden worden.", "Neh 5:15": "En de vorige landvoogden, die vóór mij geweest zijn, hebben het volk bezwaard en van hen genomen aan brood en wijn, daarna veertig zilveren sikkels; ook heersten hun knechten over het volk; maar ik heb dat niet gedaan, om de vreze van God.", "Hand 27:24": "en zei: Wees niet bang, Paulus, u moet voor de keizer gesteld worden; en zie, God heeft u allen geschonken die met u varen.", "Mark 14:52": "Maar hij liet het linnen kleed achter, en vluchtte naakt van hen weg.", "1 Petr 4:14-16": "Als u gesmaad wordt om de Naam van Christus, dan bent u gelukkig; want de Geest van de heerlijkheid, en de Geest van God, rust op u. Wat hen aangaat, Hij wordt wel gelasterd, maar wat u aangaat, Hij wordt verheerlijkt. Want laat niemand van u lijden als een moordenaar, of dief, of kwaaddoener, of als iemand die zich met de zaken van een ander bemoeit; maar als iemand lijdt als een christen, laat hij zich daar niet voor schamen, maar God verheerlijken in dit opzicht.", "Gen 42:18": "En op de derde dag zei Jozef tegen hen: Doe dit, dan zult u leven; ik vrees God.", "Gen 17:13": "Degene die in uw huis geboren is, en degene die met uw geld gekocht is, zal zeker besneden worden; en Mijn verbond zal in uw vlees zijn, tot een eeuwig verbond.", "Deut 15:12": "Wanneer uw broeder, een Hebreeuwse man of een Hebreeuwse vrouw, aan u verkocht is, dan zal hij u zes jaren dienen; maar in het zevende jaar zult u hem vrij van u laten gaan.", "1 Sam 18:14": "En David gedroeg zich voorzichtig op al zijn wegen; en de HEERE was met hem.", "Ps 119:110": "De goddelozen hebben mij een strik gelegd; nochtans ben ik niet afgedwaald van Uw bevelen.", "Gen 39:7-10": "En het gebeurde na deze dingen, dat de vrouw van zijn heer haar ogen op Jozef liet vallen; en zij zei: lig bij mij! Maar hij weigerde het, en zei tegen de vrouw van zijn heer: Zie, mijn heer weet niet, met mij hier, wat er in het huis is; en alles wat hij heeft, heeft hij in mijn hand gegeven. Niemand is groter in dit huis dan ik, en hij heeft mij niets onthouden, behalve u, omdat u zijn vrouw bent; hoe zou ik dan dit zo grote kwaad doen, en zondigen tegen God!", "Hand 12:4": "hem greep hij ook en zette hem in de gevangenis, en gaf hem over aan vier wachten, elk van vier soldaten, om hem te bewaken, want hij was van plan hem na het paasfeest voor het volk te brengen.", "2 Sam 13:11": "Toen zij ze naar hem toe bracht om te eten, greep hij haar vast, en zei tegen haar: Kom, lig bij mij, mijn zuster!", "2 Kor 11:22": "Zijn zij Hebreeën? Ik ook. Zijn zij Israëlieten? Ik ook. Zijn zij het zaad van Abraham? Ik ook.", "Fil 2:16": "Doordat u vasthoudt aan het woord van het leven, mij tot een roem tegen de dag van Christus, dat ik niet tevergeefs gelopen heb, en ook niet tevergeefs gearbeid heb.", "Joz 1:8": "Laat het boek van deze wet niet wijken van uw mond, maar overleg het dag en nacht, opdat u waarneemt te doen naar alles wat daarin geschreven is; want dan zult u uw wegen voorspoedig maken, en dan zult u verstandig handelen.", "Gen 37:25": "Daarna zaten zij neer om brood te eten, en zij hieven hun ogen op en zagen, en zie, een reisgezelschap van Ismaëlieten kwam uit Gilead; en hun kamelen droegen specerijen, balsem en mirre, op weg om dat naar Egypte te brengen.", "Matt 25:14": "Want het is net als bij een mens, die naar het buitenland reisde, zijn dienstknechten riep, en hun zijn bezittingen toevertrouwde.", "2 Kron 26:5": "Want hij begaf zich om God te zoeken, in de dagen van Zacharia, die verstandig was in de gezichten van God; en in de dagen dat hij de HEERE zocht, maakte God hem voorspoedig.", "Luk 12:48": "Maar wie het niet geweten heeft, en dingen gedaan heeft die slagen verdienen, die zal met weinig slagen geslagen worden. En ieder aan wie veel gegeven is, van hem zal veel geëist worden; en aan wie men veel toevertrouwd heeft, van hem zal men des te meer eisen.", "Spr 5:9": "Opdat u anderen uw eer niet geeft, en uw jaren aan de wrede;", "Gen 39:8-12": "Maar hij weigerde het, en zei tegen de vrouw van zijn heer: Zie, mijn heer weet niet, met mij hier, wat er in het huis is; en alles wat hij heeft, heeft hij in mijn hand gegeven. Niemand is groter in dit huis dan ik, en hij heeft mij niets onthouden, behalve u, omdat u zijn vrouw bent; hoe zou ik dan dit zo grote kwaad doen, en zondigen tegen God! En het gebeurde, toen zij Jozef dag op dag aansprak, en hij naar haar niet luisterde om bij haar te liggen en bij haar te zijn,", "Ps 55:4": "Om het geroep van de vijand, vanwege de beangstiging van de goddeloze; want zij schuiven ongerechtigheid op mij, en in toorn haten zij mij.", "1 Kor 6:9": "Of weet u niet, dat de onrechtvaardigen het Koninkrijk van God niet zullen beërven?", "1 Tess 5:22": "Onthoud u van elke schijn van het kwaad.", "2 Tim 2:22": "Maar vlucht de begeerten van de jeugd; en jaag naar rechtvaardigheid, geloof, liefde, vrede, samen met hen die de Heere aanroepen uit een rein hart.", "Gen 37:28": "Toen nu de Midianitische kooplieden voorbijtrokken, trokken en hesen zij Jozef op uit de kuil, en verkochten Jozef aan deze Ismaëlieten voor twintig zilverstukken; die brachten Jozef naar Egypte.", "Gen 43:32": "En zij richtten voor hem apart aan, en voor hen apart; en voor de Egyptenaren, die met hem aten, apart; want de Egyptenaren mogen geen brood eten met de Hebreeën, omdat dat voor de Egyptenaren een gruwel is.", "Openb 21:8": "Maar de bangen, en ongelovigen, en verfoeilijken, en moordenaars, en hoereerders, en tovenaars, en afgodendienaars, en alle leugenaars, hun deel is in de poel die daar brandt van vuur en zwavel; dat is de tweede dood.", "Lev 6:2": "Als een mens gezondigd heeft en tegen de HEERE door overtreding overtreden zal hebben, doordat hij tegen zijn naaste gelogen heeft over iets dat hem in bewaring gegeven was, of ter hand gesteld was, of over roof, of dat hij met geweld zijn naaste iets onthoudt;", "Gen 28:15": "En zie, Ik ben met u, en Ik zal u behoeden overal waarheen u trekken zult, en Ik zal u terugbrengen naar dit land; want Ik zal u niet verlaten, totdat Ik gedaan heb wat Ik tot u gesproken heb.", "Spr 17:2": "Een verstandige knecht zal heersen over een zoon die beschaamd maakt, en in het midden van de broeders zal hij erfenis delen.", "Ezech 16:31": "Toen u uw verhoging bouwde aan het hoofd van elke weg, en uw hoge plaats maakte in elke straat, was u niet als een hoer, die het hoerenloon veracht.", "Gen 12:2": "En Ik zal u tot een groot volk maken, en u zegenen, en uw naam groot maken; en wees een zegen!", "Matt 6:11": "Geef ons heden ons dagelijks brood.", "Jer 37:21": "Toen gaf koning Zedekia bevel, en zij brachten Jeremia onder in het voorhof van de gevangenis, en men gaf hem dagelijks een bol brood uit de Bakkerstraat, totdat al het brood van de stad op was. Zo bleef Jeremia in het voorhof van de gevangenis.", "Gen 26:24": "En de HEERE verscheen hem diezelfde nacht, en zei: Ik ben de God van Abraham, uw vader; wees niet bang; want Ik ben met u; en Ik zal u zegenen, en uw nageslacht vermenigvuldigen, omwille van Abraham, Mijn knecht.", "1 Sam 18:28": "En Saul zag en merkte dat de HEERE met David was; en Michal, de dochter van Saul, had hem lief.", "Dan 1:9": "En God gaf Daniël genade en barmhartigheid bij de leider van de kamerlingen.", "Est 7:4": "Want wij zijn verkocht, ik en mijn volk, om ons te verdelgen, te doden en om te brengen. Als wij nog tot knechten en tot dienstmaagden waren verkocht, zou ik gezwegen hebben, ofschoon de onderdrukker de schade van de koning geenszins zou kunnen vergoeden.", "Spr 6:26": "Want door een vrouw die een hoer is, komt men tot een stuk brood; en de huisvrouw van een andere man jaagt op het kostbare leven.", "Matt 5:11": "Zalig bent u, als de mensen u smaden en vervolgen, en liegend allerlei kwaad tegen u spreken, omwille van Mij.", "Gen 24:10": "En die knecht nam tien kamelen van de kamelen van zijn heer, en vertrok; en al het goed van zijn heer had hij bij zich; en hij stond op, en vertrok naar Mesopotamië, naar de stad van Nahor.", "Ps 46:12": "De HEERE van de heerscharen is met ons; de God van Jakob is ons een Hoog Vertrek. Sela.", "Gen 15:2": "Toen zei Abram: Heere HEERE, wat zult U mij geven, terwijl ik zonder kinderen heenga en de bezorger van mijn huis deze Damascener Eliëzer is?", "Gen 32:5": "en ik heb ossen en ezels, schapen en knechten en dienstmeisjes; en ik heb gezonden om mijn heer dit aan te zeggen, opdat ik genade vind in uw ogen.", "Spr 7:13": "En zij greep hem vast, en kuste hem; zij verhardde haar gezicht, en zei tegen hem:", "Gen 39:2-5": "En de HEERE was met Jozef, zodat hij een voorspoedig man was; en hij was in het huis van zijn heer, de Egyptenaar. Toen zijn heer zag dat de HEERE met hem was, en dat de HEERE alles wat hij deed door zijn hand voorspoedig maakte, vond Jozef genade in zijn ogen, en diende hem; en hij stelde hem aan over zijn huis, en alles wat hij had, gaf hij in zijn hand.", "2 Sam 6:11": "En de ark van de HEERE bleef in het huis van Obed-edom, de Gethiet, drie maanden; en de HEERE zegende Obed-edom en zijn hele huis.", "Gen 39:14-17": "dat zij de mensen van haar huis riep, en tegen hen zei: Ziet, hij heeft ons de Hebreeuwse man binnengebracht, om met ons te spotten; hij is bij mij gekomen om bij mij te liggen, en ik heb met luide stem geroepen; en het gebeurde, toen hij hoorde dat ik mijn stem verhief en riep, dat hij zijn kleed bij mij achterliet, en vluchtte, en naar buiten ging. En zij legde zijn kleed bij zich, totdat zijn heer in zijn huis kwam.", "1 Kron 22:13": "Dan zult u voorspoedig zijn, als u erop toeziet om te doen de inzettingen en de rechten die de HEERE aan Mozes geboden heeft over Israël. Wees sterk en heb goede moed, wees niet bevreesd, en wees niet verslagen!", "Luk 16:10": "Wie getrouw is in het minste, die is ook in het grote getrouw; en wie in het minste onrechtvaardig is, die is ook in het grote onrechtvaardig.", "Ps 106:46": "Daarom gaf Hij hun barmhartigheid voor het aangezicht van allen die hen gevangen hadden.", "Gen 37:25-36": "Daarna zaten zij neer om brood te eten, en zij hieven hun ogen op en zagen, en zie, een reisgezelschap van Ismaëlieten kwam uit Gilead; en hun kamelen droegen specerijen, balsem en mirre, op weg om dat naar Egypte te brengen. Toen zei Juda tegen zijn broers: Wat voor voordeel zal het zijn dat wij onze broer doodslaan en zijn bloed verbergen? Komt, laten wij hem aan deze Ismaëlieten verkopen, en onze hand zij niet aan hem; want hij is onze broer, ons vlees. En zijn broers stemden ermee in.", "Job 29:16": "Ik was voor de behoeftigen een vader; en het geschil dat ik niet kende, dat onderzocht ik.", "Ps 105:17-19": "Hij zond een man voor hun aangezicht heen; Jozef werd verkocht tot een slaaf. Men drukte zijn voeten in de stok; zijn persoon kwam in de ijzers. Tot de tijd toe dat Zijn woord kwam, heeft de rede van de HEERE hem doorlouterd.", "Ps 91:15": "Hij zal Mij aanroepen, en Ik zal hem verhoren; in de benauwdheid zal Ik bij hem zijn. Ik zal hem eruit trekken, en zal hem verheerlijken.", "Gen 41:14": "Toen stuurde Farao iemand en riep Jozef, en zij lieten hem haastig uit de kuil komen; en men schoor hem, en men verwisselde zijn kleren; en hij kwam bij Farao.", "Jer 5:9": "Zou Ik hierom geen straf brengen? spreekt de HEERE. Of zou Mijn ziel zich niet wreken aan zo'n volk als dit is?", "Neh 4:9": "Maar wij baden tot onze God, en zetten wacht tegen hen, dag en nacht, vanwege hen.", "1 Petr 3:17": "Want het is beter, als het de wil van God is, dat u lijdt om het goeddoen, dan om het kwaaddoen.", "Hand 16:34": "En hij bracht hen in zijn huis, en zette hun de tafel voor, en verheugde zich dat hij met heel zijn huis gelovig geworden was in God.", "1 Tim 6:1": "Alle dienstknechten die onder het juk zijn, moeten hun eigen heren alle eer waardig achten, opdat de Naam van God en de leer niet gelasterd wordt.", "Num 15:34": "En zij stelden hem in bewaring; want het was niet duidelijk gemaakt wat hem gedaan moest worden.", "Ezech 23:5": "Ohola nu hoereerde, terwijl zij van Mij was; en zij werd verliefd op haar minnaars, op de Assyriërs, die dichtbij waren,", "Gal 5:19-21": "De werken van het vlees nu zijn openbaar; dat zijn: overspel, hoererij, onreinheid, losbandigheid, Afgoderij, toverij, vijandschappen, ruzies, jaloersheden, toorn, twisten, verdeeldheid, afwijkingen in de leer, Afgunst, moord, dronkenschappen, uitspattingen, en dergelijke; waarvan ik u van tevoren zeg, zoals ik ook eerder gezegd heb, dat wie zulke dingen doen, het Koninkrijk van God niet zullen beërven.", "Neh 2:4": "En de koning zei tegen mij: Wat verzoekt u nu? Toen bad ik tot de God van de hemel.", "2 Tim 2:9": "waarvoor ik verdrukkingen lijd tot aan boeien toe, als een misdadiger; maar het Woord van God is niet gebonden.", "Gen 33:8": "En hij zei: Voor wie is heel dit leger dat ik ontmoet heb? En hij zei: Om genade te vinden in de ogen van mijn heer!", "Gen 41:1-44": "En het gebeurde na verloop van twee volle jaren, dat Farao droomde, en zie, hij stond aan de rivier. En zie, uit de rivier kwamen zeven koeien op, mooi van uiterlijk en vet van vlees, en zij graasden in het gras. En zie, zeven andere koeien kwamen na die op uit de rivier, lelijk van uiterlijk en mager van vlees; en zij stonden bij de andere koeien aan de oever van de rivier.", "Hand 16:19-40": "Toen de heren van haar nu zagen dat de hoop op hun gewin weg was, grepen zij Paulus en Silas, en sleepten hen naar de markt, voor de leiders. En toen zij hen tot de aanvoerders gebracht hadden, zeiden zij: Deze mensen brengen onze stad in opschudding, omdat zij Joden zijn. En zij verkondigen gewoonten die wij niet mogen aannemen, noch mogen navolgen, omdat wij Romeinen zijn.", "Matt 24:42-44": "Waak dan, want u weet niet in welk uur uw Heere komen zal. Maar weet dit, dat als de heer des huizes geweten had in welke nachtwake de dief komen zou, hij gewaakt zou hebben en niet zou hebben toegelaten dat zijn huis werd doorgraven. Daarom, wees ook u bereid, want op een uur dat u het niet verwacht, zal de Zoon des mensen komen.", "Ezech 16:25": "Aan elk hoofd van de weg hebt u uw hoge plaatsen gebouwd, en hebt uw schoonheid tot iets afschuwelijks gemaakt, en hebt uw benen gespreid voor ieder die voorbijkwam, en hebt uw hoererijen vermeerderd.", "Gen 40:3": "En hij leverde hen in bewaring, in het huis van de leider van de lijfwacht, in de gevangenis, ter plaatse waar Jozef gevangen zat.", "Jes 41:10": "Vrees niet, want Ik ben met u; wees niet verbaasd, want Ik ben uw God; Ik sterk u, ook help Ik u, ook ondersteun Ik u met de rechterhand van Mijn gerechtigheid.", "Ps 35:11": "Wrevelige getuigen staan op; wat ik niet weet, eisen zij van mij.", "Job 24:15": "Ook houdt het oog van de overspeler de schemering in de gaten, en zegt: Geen oog zal mij zien; en hij bedekt zijn gezicht.", "Jes 53:8": "Hij is uit de angst en uit het gericht weggenomen; en wie zal Zijn leeftijd uitspreken? Want Hij is afgesneden uit het land van de levenden; om de overtreding van Mijn volk is de plaag op Hem geweest.", "Gen 3:19": "In het zweet van uw gezicht zult u brood eten, totdat u tot de aarde terugkeert, omdat u daaruit genomen bent; want u bent stof, en u zult tot stof terugkeren.", "Gen 41:40": "U zult over mijn huis zijn, en op uw bevel zal heel mijn volk de hand kussen; alleen door de troon zal ik groter zijn dan u.", "1 Sam 16:22": "Daarna stuurde Saul iemand naar Isaï om te zeggen: Laat David toch bij mij blijven, want hij heeft genade gevonden in mijn ogen.", "Gen 31:42": "Als de God van mijn vader, de God van Abraham, en de Vreze van Izak, niet bij mij was geweest, dan had u mij zeker nu met lege handen weggezonden! God heeft mijn ellende, en de arbeid van mijn handen, gezien, en heeft u gisteravond bestraft.", "Neh 2:5": "En ik zei tegen de koning: Als het de koning goeddunkt, en als uw dienaar u aangenaam is, dat u mij zendt naar Juda, naar de stad van de graven van mijn vaderen, om die te herbouwen.", "Gen 19:29": "En het gebeurde, toen God de steden van deze vlakte verwoestte, dat God aan Abraham dacht, en Hij leidde Lot weg uit het midden van deze omkering, toen Hij de steden omkeerde waarin Lot gewoond had.", "Num 32:23": "Maar als u dat niet zo zult doen, zie, dan hebt u tegen de HEERE gezondigd; en weet zeker dat uw zonde u vinden zal!", "Gen 18:3": "En hij zei: Heere! Als ik nu genade gevonden heb in Uw ogen, ga toch niet aan Uw knecht voorbij.", "Rom 8:31": "Wat zullen wij dan hierop zeggen? Als God vóór ons is, wie zal tegen ons zijn?", "Matt 5:16": "Laat uw licht zo schijnen voor de mensen, dat zij uw goede werken mogen zien en uw Vader, Die in de hemelen is, verheerlijken.", "Spr 9:16": "Wie is eenvoudig? Hij keert zich hierheen; en tegen wie geen verstand heeft, zegt zij:", "Spr 7:5": "Opdat zij u bewaren voor een vreemde vrouw, voor de onbekende, die met haar woorden vleit.", "Hebr 13:4": "Het huwelijk is eerbaar onder allen, en het huwelijksbed onbevlekt; maar hoereerders en overspelers zal God oordelen.", "Ex 3:21": "En Ik zal dit volk genade geven in de ogen van de Egyptenaren; en het zal gebeuren, wanneer u weggaat, dat u niet met lege handen weg zult gaan.", "Spr 2:16": "Om u te redden van de vreemde vrouw, van de onbekende, die met haar woorden vleit;", "Spr 16:7": "Als iemands wegen de HEERE behagen, zo zal Hij ook zijn vijanden met hem verzoenen.", "Hand 25:16": "Aan hen antwoordde ik dat het bij de Romeinen geen gewoonte is iemand uit gunst ter dood over te geven, voordat de beschuldigde de beschuldigers persoonlijk tegenover zich heeft gehad en de kans heeft gekregen zich te verantwoorden over de beschuldiging.", "Spr 10:18": "Wie haat bedekt, heeft valse lippen, en wie een kwaad gerucht verspreidt, is een dwaas.", "Ezech 23:12-16": "Zij werd verliefd op de zonen van Assur, de vorsten en machthebbers, die dichtbij waren, bekleed met volmaakte pracht, ruiters, rijdend op paarden, allemaal aantrekkelijke jonge mannen. Toen zag Ik dat zij verontreinigd was; zij hadden beiden dezelfde weg. Ja, zij ging in haar hoererijen nog verder; want toen zij mannen afgebeeld zag op de wand, de beelden van de Chaldeeën, geschilderd met menie,", "Ps 51:6": "Tegen U, U alleen, heb ik gezondigd, en gedaan wat kwaad is in Uw ogen; opdat U rechtvaardig bent in Uw spreken, en rein bent in Uw oordelen.", "Openb 3:9": "Zie, Ik geef u er sommigen uit de synagoge van de satan, van hen die zeggen dat zij Joden zijn, en het niet zijn, maar liegen; zie, Ik zal maken dat zij zullen komen, en aanbidden voor uw voeten, en erkennen dat Ik u liefheb.", "1 Petr 2:11": "Geliefden, ik roep u dringend op, als inwoners en vreemdelingen, dat u zich onthoudt van de vleselijke begeerten, die strijd voeren tegen de ziel;", "Gen 39:7-12": "En het gebeurde na deze dingen, dat de vrouw van zijn heer haar ogen op Jozef liet vallen; en zij zei: lig bij mij! Maar hij weigerde het, en zei tegen de vrouw van zijn heer: Zie, mijn heer weet niet, met mij hier, wat er in het huis is; en alles wat hij heeft, heeft hij in mijn hand gegeven. Niemand is groter in dit huis dan ik, en hij heeft mij niets onthouden, behalve u, omdat u zijn vrouw bent; hoe zou ik dan dit zo grote kwaad doen, en zondigen tegen God!", "Gen 49:24": "Maar zijn boog is in stevigheid gebleven, en de armen van zijn handen zijn gesterkt, door de handen van de Machtige van Jakob; vandaar is hij een herder, een steen van Israël;", "Luk 21:33-36": "De hemel en de aarde zullen voorbijgaan, maar Mijn woorden zullen beslist niet voorbijgaan. En let op uzelf, dat uw harten niet op enig moment bezwaard worden met brasserij en dronkenschap, en zorgen van dit leven, en dat die dag u niet onvoorzien overkomt. Want als een strik zal hij komen over allen die op de hele aardbodem gezeten zijn.", "Hand 8:31": "En hij zei: Hoe zou ik dat toch kunnen, als niemand mij onderricht? En hij vroeg Filippus dringend om op te komen en bij hem te zitten.", "Hoogl 8:7": "Veel water zou deze liefde niet kunnen uitblussen; ja, de rivieren zouden ze niet verdrinken; al gaf iemand al het goed van zijn huis voor deze liefde, men zou hem volkomen verachten.", "1 Sam 16:18": "Toen antwoordde een van de jongens, en zei: Zie, ik heb een zoon van Isaï gezien, de Bethlehemiet, die kan spelen, en hij is een dapper held en een krijgsman, en verstandig in zaken, en een knappe man, en de HEERE is met hem.", "Spr 6:29": "Zo vergaat het hem die bij de vrouw van zijn naaste komt; wie haar aanraakt, zal niet onschuldig blijven.", "Gen 12:15": "Ook zagen de vorsten van Farao haar, en prezen haar bij Farao; en die vrouw werd meegenomen naar het huis van Farao.", "Spr 23:26-28": "Mijn zoon! geef mij uw hart, en laat uw ogen mijn wegen behartigen. Want een hoer is een diepe gracht, en een vreemde vrouw is een nauwe put. Ook loert zij als een rover; en zij vermeerdert de trouwelozen onder de mensen.", "Hand 7:10": "en verloste hem uit al zijn verdrukkingen, en gaf hem genade en wijsheid voor Farao, de koning van Egypteland; en hij stelde hem aan als leider over Egypte en zijn hele huis.", "Gen 45:8": "Nu dan, u hebt mij hierheen niet gezonden, maar God Zelf, Die mij tot vader van Farao gesteld heeft, en tot een heer over zijn hele huis, en regeerder in het hele land van Egypte.", "1 Petr 3:13": "En wie is het die u kwaad zal doen, als u navolgers bent van het goede?", "Spr 5:3-8": "Want de lippen van de vreemde vrouw druppen honingzeem, en haar gehemelte is gladder dan olie. Maar het laatste van haar is bitter als alsem, scherp als een tweesnijdend zwaard. Haar voeten dalen af naar de dood, haar treden houden het graf vast.", "Gen 14:13": "Toen kwam er iemand die ontkomen was, en bracht dat over aan Abram, de Hebreeër, die woonde bij de eikenbossen van Mamre, de Amoriet, broeder van Eskol, en broeder van Aner, die Abrams bondgenoten waren.", "Spr 6:35": "Hij zal geen losgeld aanvaarden; en hij zal niet tevreden zijn, ook al maakt u het geschenk groter.", "Gen 39:1-6": "Jozef werd naar Egypte afgevoerd; en Potifar, een hoveling van de farao, een aanvoerder van de lijfwacht, een Egyptisch man, kocht hem van de Ismaëlieten, die hem daarheen afgevoerd hadden. En de HEERE was met Jozef, zodat hij een voorspoedig man was; en hij was in het huis van zijn heer, de Egyptenaar. Toen zijn heer zag dat de HEERE met hem was, en dat de HEERE alles wat hij deed door zijn hand voorspoedig maakte,", "Gen 6:2": "dat Gods zonen de dochters der mensen aanzagen, dat zij mooi waren, en zij namen zich vrouwen uit allen die zij verkozen hadden.", "Luk 23:2": "En zij begonnen Hem te beschuldigen en zeiden: Wij hebben bevonden dat Deze het volk verkeerd voorlicht, en verbiedt de keizer schattingen te geven, en zegt dat Hij Zelf Christus, de Koning is.", "Luk 12:35-38": "Laat uw middel omgord zijn, en de lampen brandend. En wees zelf gelijk aan mensen die op hun heer wachten, wanneer hij terugkomt van de bruiloft, zodat zij, als hij komt en klopt, hem meteen kunnen opendoen. Zalig zijn die dienstknechten die de heer, als hij komt, wakend zal vinden. Voorwaar, Ik zeg u, dat hij zich zal omgorden, en hen zal laten aanzitten, en zal binnenkomen en hen dienen.", "Spr 22:29": "Hebt u een man gezien die vaardig is in zijn werk? Hij zal voor koningen komen te staan; hij zal niet voor onaanzienlijke mensen staan.", "Matt 5:28": "Maar Ik zeg u, dat ieder die naar een vrouw kijkt om haar te begeren, al overspel met haar gepleegd heeft in zijn hart.", "Ps 119:37": "Wend mijn ogen af, dat zij geen ijdelheid zien; maak mij levend door Uw wegen.", "Job 31:9-12": "Als mijn hart verlokt is geweest tot een vrouw, of ik aan mijn naasten deur geloerd heb; Zo moet mijn huisvrouw met een ander malen, en anderen zich over haar krommen! Want dat is een schandelijke daad, en het is een misdaad bij de rechters.", "Jes 8:9": "Verzamel u samen, volken! Toch zult u verbroken worden; en neem het ter ore, allen die in verre landen bent, omgord u, toch zult u verbroken worden; omgord u, toch zult u verbroken worden!", "Spr 14:35": "Het welbehagen van de koning is over een verstandige knecht; maar zijn verbolgenheid zal zijn over hem die beschaamd maakt.", "1 Sam 16:12": "Toen stuurde hij iemand, en liet hem komen; hij nu was roodachtig, en had daarbij mooie ogen en een knap voorkomen; en de HEERE zei: Sta op, zalf hem, want deze is het.", "Ps 119:101": "Ik heb mijn voeten geweerd van alle kwade paden, opdat ik Uw woord zou onderhouden.", "Deut 28:68": "En de HEERE zal u met schepen laten terugkeren naar Egypte, langs een weg waarvan ik u gezegd heb: U zult die niet meer zien; en daar zult u zich aan uw vijanden willen verkopen als slaven en slavinnen; maar er zal geen koper zijn.", "Spr 1:15": "Mijn zoon! wandel niet met hen op de weg; weer uw voet van hun pad.", "Hand 16:33": "En hij nam hen op datzelfde uur van de nacht mee, en waste hun striemen; en hij werd meteen gedoopt, en al de zijnen.", "1 Sam 17:42": "Toen de Filistijn opkeek en David zag, verachtte hij hem; want hij was een jongeman, roodachtig, en daarbij mooi om te zien.", "Spr 6:34": "Want jaloezie is de woede van een man; en op de dag van de wraak zal hij niet sparen.", "Dan 3:22": "Omdat het bevel van de koning zo dringend was, en de oven zeer heet was, hebben de vonken van het vuur die mannen die Sadrach, Mesach en Abed-nego opgetild hadden, gedood.", "Pred 7:26": "En ik vond iets bitterders dan de dood: een vrouw, wier hart netten en garen, en haar handen boeien zijn; wie goed is voor Gods aangezicht, zal aan haar ontkomen; daarentegen zal de zondaar door haar gevangen worden.", "Gen 39:14-18": "dat zij de mensen van haar huis riep, en tegen hen zei: Ziet, hij heeft ons de Hebreeuwse man binnengebracht, om met ons te spotten; hij is bij mij gekomen om bij mij te liggen, en ik heb met luide stem geroepen; en het gebeurde, toen hij hoorde dat ik mijn stem verhief en riep, dat hij zijn kleed bij mij achterliet, en vluchtte, en naar buiten ging. En zij legde zijn kleed bij zich, totdat zijn heer in zijn huis kwam.", "Neh 2:20": "Toen gaf ik hun antwoord, en zei tegen hen: De God van de hemel, Hij zal het ons doen gelukken, en wij, Zijn dienaren, zullen opstaan en bouwen; maar u hebt geen deel, geen recht, en geen aandenken in Jeruzalem.", "Gen 24:4": "maar dat u naar mijn land en naar mijn familie zult gaan, en voor mijn zoon Izak een vrouw zult nemen.", "Job 31:38-40": "Als mijn land tegen mij roept, en zijn voren samen wenen; Als ik zijn vermogen gegeten heb zonder geld, en de ziel van zijn akkerlieden heb doen hijgen; Dat voor tarwe distels voortkomen, en voor gerst stinkkruid! De woorden van Job hebben een einde.", "Zach 8:23": "Zo zegt de HEERE van de heerscharen: Het zal in die dagen gebeuren, dat tien mannen, uit allerlei talen van de heidenvolken, grijpen zullen, ja, de slip grijpen zullen van een Joodse man, en zeggen: Wij zullen met u gaan, want wij hebben gehoord dat God met u is.", "Spr 6:20-25": "Mijn zoon, bewaar het gebod van uw vader, en verlaat de wet van uw moeder niet. Bind ze voortdurend aan uw hart, hecht ze aan uw hals. Als u wandelt, zal dat u leiden; als u neerligt, zal het over u de wacht houden; als u wakker wordt, zal het met u spreken.", "Ps 37:11": "De zachtmoedigen daarentegen zullen de aarde erfelijk bezitten, en zich verlustigen over grote vrede.", "Rom 8:37": "Maar in dit alles zijn wij meer dan overwinnaars, door Hem Die ons heeft liefgehad.", "Ef 5:12": "Want wat heimelijk door hen gebeurt, is ook schandelijk om te noemen.", "Gen 4:5": "maar Kaïn en zijn offer zag Hij niet met welgevallen aan. Toen ontstak Kaïn zeer, en zijn gezicht betrok.", "Ps 105:19": "Tot de tijd toe dat Zijn woord kwam, heeft de rede van de HEERE hem doorlouterd.", "Ex 2:6": "Toen zij het opendeed, zag zij het kind; en zie, het jongetje huilde; en zij werd door medelijden bewogen, en zei: Dit is een van de kinderen van de Hebreeën!", "1 Petr 3:14-18": "Maar als u ook lijdt om de gerechtigheid, dan bent u gelukkig te prijzen; en wees niet bang voor hun dreiging, en raak niet in verwarring; maar heilig God, de Heere, in uw harten; en wees altijd bereid tot verantwoording aan ieder die u rekenschap vraagt van de hoop die in u is, met zachtmoedigheid en vreze, en heb een goed geweten, opdat zij die uw goede wandel in Christus belasteren, beschaamd gemaakt worden in datgene waarin zij kwaad van u spreken, alsof u kwaaddoeners bent.", "Ps 105:22": "Om zijn vorsten te binden naar zijn lust, en zijn oudsten te onderwijzen.", "Ezech 16:30": "Hoe zwak is uw hart (spreekt de Heere HEERE) dat u al deze dingen doet, het werk van een heersende hoerachtige vrouw!", "Gen 39:21-23": "Maar de HEERE was met Jozef, en bewees hem Zijn goedertierenheid; en gaf hem genade in de ogen van de leider van de gevangenis. En de leider van de gevangenis gaf alle gevangenen die in de gevangenis waren in Jozefs hand; en alles wat zij daar deden, deed hij. De leider van de gevangenis had geen omzien meer naar enig ding dat in zijn hand was, omdat de HEERE met hem was; en wat hij deed, dat deed de HEERE goed gedijen.", "Ps 76:11": "Want de grimmigheid van de mens zal U loffelijk maken; het overblijfsel van de grimmigheden zult U opbinden.", "Hand 7:9": "En de aartsvaders, jaloers geworden, verkochten Jozef om naar Egypte gebracht te worden; maar God was met hem,", "Ps 1:3": "Want hij zal zijn als een boom, geplant aan waterbeken, die zijn vrucht geeft op zijn tijd, en waarvan het blad niet afvalt; en alles wat hij doet, zal goed gelukken.", "Gen 39:2-20": "En de HEERE was met Jozef, zodat hij een voorspoedig man was; en hij was in het huis van zijn heer, de Egyptenaar. Toen zijn heer zag dat de HEERE met hem was, en dat de HEERE alles wat hij deed door zijn hand voorspoedig maakte, vond Jozef genade in zijn ogen, en diende hem; en hij stelde hem aan over zijn huis, en alles wat hij had, gaf hij in zijn hand.", "Gen 20:6": "En God zei tegen hem in de droom: Ik heb ook geweten dat u dit in oprechtheid van uw hart gedaan hebt, en Ik heb u ook belet om tegen Mij te zondigen; daarom heb Ik u niet toegelaten haar aan te raken.", "Spr 2:16-19": "Om u te redden van de vreemde vrouw, van de onbekende, die met haar woorden vleit; Die de leidsman van haar jeugd verlaat, en het verbond van haar God vergeet; Want haar huis helt naar de dood, en haar paden naar de overledenen.", "Ef 1:3": "Gezegend zij de God en Vader van onze Heere Jezus Christus, Die ons gezegend heeft met alle geestelijke zegening in de hemel in Christus.", "Gen 42:16-19": "Stuur er één van u uit, die uw broer haalt; maar blijft u zelf gevangen, en uw woorden zullen beproefd worden, of de waarheid bij u is; en als dat niet zo is, zo waar als Farao leeft, dan bent u verspieders! En hij zette hen samen drie dagen in bewaring. En op de derde dag zei Jozef tegen hen: Doe dit, dan zult u leven; ik vrees God.", "Gen 20:3": "Maar God kwam 's nachts in een droom tot Abimelech, en zei tegen hem: Zie, u bent dood vanwege de vrouw die u weggenomen hebt, want zij is met een man getrouwd.", "Openb 3:2": "Wees waakzaam, en versterk het overige, dat dreigde te sterven; want Ik heb uw werken niet vol bevonden voor God.", "Gen 19:19": "Zie toch, Uw knecht heeft genade gevonden in Uw ogen, en U hebt Uw goedheid groot gemaakt die U aan mij bewezen hebt, door mijn leven te sparen; maar ik zal niet naar het gebergte kunnen vluchten, want misschien overkomt mij dat kwaad, en moet ik sterven!", "1 Kor 15:33": "Dwaal niet. Slechte omgang bederft goede zeden.", "Ezra 7:26": "En ieder die de wet van uw God en de wet van de koning niet zal doen, over hem moet spoedig recht gedaan worden, hetzij ter dood, of tot verbanning, of tot boete van goederen, of tot gevangenschap.", "Ex 12:36": "Daartoe had de HEERE het volk genade gegeven in de ogen van de Egyptenaren, zodat zij hun hun verzoek toestonden; en zij beroofden de Egyptenaren.", "1 Sam 2:30": "Daarom spreekt de HEERE, de God van Israël: Ik had wel duidelijk gezegd: Uw huis en het huis van uw vader zouden voor Mijn aangezicht wandelen tot in eeuwigheid; maar nu spreekt de HEERE: Dat zij verre van Mij; want die Mij eren, zal Ik eren, maar die Mij versmaden, zullen licht geacht worden.", "1 Sam 29:3": "Toen zeiden de leiders van de Filistijnen: Wat moeten deze Hebreeën hier? Zo zei Achis tegen de leiders van de Filistijnen: Is dit niet David, de knecht van Saul, de koning van Israël, die deze dagen of deze jaren bij mij geweest is? En ik heb in hem niets gevonden vanaf de dag dat hij bij mij gekomen is, tot op deze dag.", "Ps 37:3": "Beth. Vertrouw op de HEERE, en doe het goede; bewoon de aarde, en voed u met trouw.", "2 Kor 6:8": "door eer en oneer, door kwaad gerucht en goed gerucht; als verleiders, en toch waarachtig;", "Gen 21:22": "Vervolgens gebeurde het in diezelfde tijd, dat Abimelech, alsook Pichol, zijn legeraanvoerder, tegen Abraham sprak en zei: God is met u in alles wat u doet.", "Spr 6:33": "plaag en schande zal hij vinden, en zijn smaad zal niet uitgewist worden.", "Ps 120:3": "Wat zal U de bedrieglijke tong geven, of wat zal zij U toevoegen?", "Job 31:5-17": "Als ik met ijdelheid omgegaan heb, en mijn voet gesneld heeft tot bedriegerij; Hij weegt mij op, in een rechte weegschaal, en God zal mijn oprechtheid weten. Als mijn gang uit de weg geweken is, en mijn hart mijn ogen nagevolgd is, en aan mijn handen iets aankleeft;", "Fil 2:15": "Opdat u onberispelijk en oprecht mag zijn, kinderen van God, onstraffelijk te midden van een krom en verdraaid geslacht, onder wie u schijnt als lichten in de wereld;", "Deut 28:3-6": "Gezegend zult u zijn in de stad, en gezegend zult u zijn op het veld. Gezegend zal zijn de vrucht van uw schoot, en de vrucht van uw land, en de vrucht van uw vee, de aanwas van uw koeien, en de kudden van uw kleinvee. Gezegend zal zijn uw korf, en uw baktrog.", "1 Joh 2:16": "Want al wat in de wereld is, namelijk de begeerte van het vlees, en de begeerte van de ogen, en de hoogmoed van het leven, is niet uit de Vader, maar is uit de wereld.", "1 Petr 2:20": "Want wat lof is het, als u het verdraagt wanneer u zondigt en daarvoor geslagen wordt? Maar als u het verdraagt wanneer u goeddoet en daarvoor lijdt, dat is genade bij God.", "Jer 52:11": "En hij verblindde de ogen van Zedekia, en hij bond hem met twee koperen ketenen; zo bracht de koning van Babel hem naar Babel, en stelde hem in de gevangenis, tot de dag van zijn dood toe.", "Jes 51:7": "Hoor naar Mij, u die de gerechtigheid kent, u volk, in wiens hart Mijn wet is! Vrees niet de smaad van de mens, en voor hun smaadredenen hoeft u niet ontzet te zijn.", "1 Sam 4:9": "Wees sterk, en gedraag u als mannen, Filistijnen, zodat u de Hebreeën niet gaat dienen, zoals zij u gediend hebben; wees dus mannen, en strijd.", "Joz 1:7": "Wees alleen sterk en heb zeer goede moed, dat u waarneemt te doen naar de hele wet, die Mozes, Mijn knecht, u geboden heeft, en wijk daar niet vanaf, naar rechts of naar links, opdat u verstandig handelt overal waar u gaat.", "Job 31:1": "Ik heb een verbond gemaakt met mijn ogen; hoe zou ik dan acht gegeven hebben op een maagd?", "Spr 23:27": "Want een hoer is een diepe gracht, en een vreemde vrouw is een nauwe put.", "2 Sam 11:27": "En toen de rouw voorbij was, stuurde David iemand heen, en nam haar in zijn huis; en zij werd hem tot vrouw, en baarde hem een zoon. Doch deze daad, die David gedaan had, was kwaad in de ogen van de HEERE.", "Ps 17:4": "Wat de handelingen van de mensen betreft, ik heb mij, naar het woord van Uw lippen, gewacht voor de paden van de inbreker;", "Matt 1:23": "Zie, de maagd zal zwanger worden en een Zoon baren, en u zult Hem de naam Emmanuel geven; dat betekent, vertaald: God met ons.", "Gen 10:21": "Verder zijn er aan Sem zonen geboren; hijzelf is ook de vader van alle zonen van Heber, broer van Jafeth, de oudste.", "Mark 14:37": "En Hij kwam, en vond hen slapend, en zei tegen Petrus: Simon, slaapt u? Kon u niet één uur waken?", "Jer 50:7": "Allen die hen vonden, aten hen op, en hun tegenstanders zeiden: Wij zullen geen schuld hebben; omdat zij gezondigd hebben tegen de HEERE, in de woning van de gerechtigheid, ja, tegen de HEERE, de Verwachting van hun vaderen.", "Gen 30:27": "Toen zei Laban tegen hem: Als ik toch genade gevonden heb in uw ogen; ik heb ondervonden dat de HEERE mij om u gezegend heeft.", "Est 6:1-11": "Diezelfde nacht kon de koning niet slapen, en hij zei dat men het boek van de gedenkwaardigheden, de kronieken, moest brengen; en die werden voorgelezen in de tegenwoordigheid van de koning. En men vond geschreven dat Mordechai had bekendgemaakt dat Bigthana en Theres, twee kamerlingen van de koning, uit de dorpelwachters, van plan waren de hand te leggen aan koning Ahasveros. Toen zei de koning: Welke eer en verhoging is Mordechai hiervoor gegeven? En de knechten van de koning, zijn dienaars, zeiden: Aan hem is niets gegeven.", "Gen 29:17": "Lea had tere ogen; maar Rachel was mooi van gestalte, en mooi van gezicht.", "Ps 72:17": "Zijn naam zal zijn tot in eeuwigheid; zolang als er de zon is, zal zijn naam van kind tot kind voortgeplant worden; en zij zullen in hem gezegend worden; alle heidenvolken zullen hem gelukkig noemen.", "1 Kor 7:20-24": "Ieder moet blijven in de roeping waarin hij geroepen is. Bent u als dienstknecht geroepen, laat u dat niet bekommeren; maar als u ook vrij kunt worden, gebruik dat dan liever. Want wie in de Heere geroepen is als dienstknecht, is een vrijgelatene van de Heere; net zo ook, wie vrij zijnde geroepen is, is een dienstknecht van Christus.", "Ef 5:3": "Maar hoererij en alle onreinheid, of hebzucht, laat onder u zelfs niet genoemd worden, zoals het de heiligen betaamt,", "Gen 39:20-23": "En Jozefs heer nam hem, en leverde hem over in de gevangenis, op de plaats waar de gevangenen van de koning gevangen zaten; zo was hij daar in de gevangenis. Maar de HEERE was met Jozef, en bewees hem Zijn goedertierenheid; en gaf hem genade in de ogen van de leider van de gevangenis. En de leider van de gevangenis gaf alle gevangenen die in de gevangenis waren in Jozefs hand; en alles wat zij daar deden, deed hij.", "Luk 23:19": "Die vanwege een oproer dat in de stad gebeurd was, en om een doodslag, in de gevangenis geworpen was.", "2 Petr 2:14": "zij hebben ogen vol overspel, die niet ophouden met zondigen; zij verleiden onvaste zielen, hebben een hart geoefend in hebzucht, en zijn kinderen van de vervloeking;", "Gen 17:27": "En alle mannen van zijn huis, degenen die in het huis geboren waren, en degenen die met geld gekocht waren, van de vreemdeling af, werden met hem besneden.", "Matt 26:38-42": "Toen zei Hij tegen hen: Mijn ziel is zeer bedroefd, tot de dood toe; blijft hier en waakt met Mij. En toen Hij een weinig verder gegaan was, viel Hij op Zijn aangezicht, bad en zei: Mijn Vader, als het mogelijk is, laat deze drinkbeker aan Mij voorbijgaan! Maar toch niet zoals Ik wil, maar zoals U wilt. En Hij kwam bij de discipelen en vond hen slapend, en zei tegen Petrus: Kunt u dan niet één uur met Mij waken?", "1 Kor 4:2": "En verder wordt van de uitdelers vereist, dat ieder getrouw bevonden wordt.", "1 Petr 4:7": "En het einde van alle dingen is nabij; wees dan nuchter en waak in de gebeden.", "Openb 3:3": "Bedenk dan hoe u het ontvangen en gehoord hebt, en bewaar het, en bekeer u. Als u dan niet waakt, zal Ik over u komen als een dief, en u zult niet weten op welk uur Ik over u komen zal.", "1 Kor 6:10": "Vergis u niet; hoereerders, afgodendienaars, overspelers, ontuchtigen, mannen die bij mannen liggen, dieven, hebzuchtigen, dronkaards, geen lasteraars, geen rovers, zullen het Koninkrijk van God beërven.", "Mark 14:38": "Waak en bid, opdat u niet in verzoeking komt; de geest is wel gewillig, maar het vlees is zwak.", "Ps 94:18": "Toen ik zei: Mijn voet wankelt; Uw goedertierenheid, o HEERE! ondersteunde mij.", "Gen 39:7-20": "En het gebeurde na deze dingen, dat de vrouw van zijn heer haar ogen op Jozef liet vallen; en zij zei: lig bij mij! Maar hij weigerde het, en zei tegen de vrouw van zijn heer: Zie, mijn heer weet niet, met mij hier, wat er in het huis is; en alles wat hij heeft, heeft hij in mijn hand gegeven. Niemand is groter in dit huis dan ik, en hij heeft mij niets onthouden, behalve u, omdat u zijn vrouw bent; hoe zou ik dan dit zo grote kwaad doen, en zondigen tegen God!", "Gen 37:36": "En de Midianieten verkochten hem in Egypte, aan Potifar, een hoveling van de farao, leider van de lijfwacht.", "Spr 6:32": "Maar wie met een vrouw overspel doet, mist verstand; hij die dat doet, richt zichzelf te gronde;", "2 Sam 12:13": "Toen zei David tegen Nathan: Ik heb gezondigd tegen de HEERE! En Nathan zei tegen David: De HEERE heeft ook uw zonde weggenomen, u zult niet sterven.", "Openb 18:13": "En kaneel, en reukwerk, en welriekende zalf, en wierook, en wijn, en olie, en meelbloem, en tarwe, en lastdieren, en schapen; en van paarden, en van wagens, en van lichamen, en de zielen van de mensen.", "Ezech 16:34": "Zo gebeurt met u in uw hoererijen het tegenovergestelde van de vrouwen, omdat men u niet naloopt om te hoereren; want wanneer u hoerenloon geeft, en het hoerenloon u niet gegeven wordt, bent u tot een tegendeel geworden.", "Gen 49:23": "De schutters hebben hem wel bitterheid aangedaan, en op hem geschoten, en hem gehaat;", "Spr 1:10": "Mijn zoon! als de zondaars u aanlokken, stem er niet mee in;", "Spr 9:17": "Het gestolen water is zoet, en het verborgen brood is heerlijk.", "Gen 45:4": "En Jozef zei tegen zijn broers: Kom toch dichter bij mij! En zij kwamen dichterbij. Toen zei hij: Ik ben Jozef, uw broer, die u naar Egypte verkocht hebt.", "Dan 6:23": "Mijn God heeft Zijn engel gezonden, en Hij heeft de bek van de leeuwen dichtgehouden, zodat zij mij niet beschadigd hebben, omdat voor Zijn aangezicht onschuld in mij gevonden is; en ook heb ik, o koning, tegen u geen misdaad begaan.", "Hand 7:20": "In die tijd werd Mozes geboren, en hij was buitengewoon mooi; hij werd drie maanden opgevoed in het huis van zijn vader.", "Matt 25:23-30": "Zijn heer zei tegen hem: Goed gedaan, goede en trouwe dienstknecht, over weinig ben je trouw geweest; over veel zal ik je aanstellen; ga in, in de vreugde van uw heer. Maar hij die het ene talent ontvangen had, kwam ook en zei: Heer, ik kende u, dat u een hard mens bent, die maait waar u niet gezaaid hebt, en verzamelt vandaar waar u niet gestrooid hebt; En ik was bang, en ben weggegaan, en heb uw talent verborgen in de aarde; zie, u hebt het uwe.", "Spr 2:10": "Als de wijsheid in uw hart gekomen zal zijn, en de wetenschap voor uw ziel liefelijk zal zijn;", "Job 31:19-34": "Als ik iemand heb zien omkomen, omdat hij zonder kleding was, en dat de nooddruftige geen deksel had; Als zijn lenden mij niet gezegend hebben, toen hij van de vellen van mijn lammeren verwarmd werd; Als ik mijn hand tegen de wees bewogen heb, omdat ik in de poort mijn hulp zag;", "Jer 23:24": "Zou iemand zich in verborgen plaatsen kunnen verbergen, zodat Ik hem niet zou zien? spreekt de HEERE; vervul Ik niet de hemel en de aarde? spreekt de HEERE.", "Hand 4:3": "En zij sloegen de handen aan hen, en zetten ze gevangen tot de volgende dag; want het was al avond.", "Ps 94:17": "Als de HEERE mij geen Hulp was geweest, had mijn ziel bijna in de stilte gewoond.", "Ps 37:3-11": "Beth. Vertrouw op de HEERE, en doe het goede; bewoon de aarde, en voed u met trouw. En verlustig u in de HEERE, zo zal Hij u geven de verlangens van uw hart. Gimel. Leg uw weg in de handen van de HEERE, en vertrouw op Hem; Hij zal het maken;", "Amos 4:12": "Daarom zal Ik u zo doen, Israël! Omdat Ik u dan dit doen zal, maak u dan gereed, Israël, om uw God te ontmoeten."}, "noten": {}, "koppeling": {"1": "<span class=\"wl\" data-l=\"L1\" data-code=\"H3130\">Jozef</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H3130\">werd</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H4714\">naar</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H4714\">Egypte</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H3381\">afgevoerd</span>; <span class=\"wl\" data-l=\"L4\" data-code=\"H6318\">en</span> <span class=\"wl\" data-l=\ d he was there in the <span class=\"wl wl-kjv\" data-code=\"H1004\">prison.</span>", "21": "But the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> was with <span class=\"wl wl-kjv\" data-code=\"H3130\">Joseph,</span> and <span class=\"wl wl-kjv\" data-code=\"H5186\">shewed</span> him <span class=\"wl wl-kjv\" data-code=\"H2617\">mercy,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> him <span class=\"wl wl-kjv\" data-code=\"H2580\">favour</span> in the <span class=\"wl wl-kjv\" data-code=\"H5869\">sight</span> of the <span class=\"wl wl-kjv\" data-code=\"H8269\">keeper</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">prison.</span>", "22": "And the <span class=\"wl wl-kjv\" data-code=\"H8269\">keeper</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">prison</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">committed</span> to <span class=\"wl wl-kjv\" data-code=\"H3130\">Joseph's</span> <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> all the <span class=\"wl wl-kjv\" data-code=\"H615\">prisoners</span> that were in the <span class=\"wl wl-kjv\" data-code=\"H1004\">prison;</span> and whatsoever they <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> there, he was the doer", "23": "The <span class=\"wl wl-kjv\" data-code=\"H8269\">keeper</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">prison</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">looked</span> not to any <span class=\"wl wl-kjv\" data-code=\"H3972\">thing</span> that was under his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand;</span> because the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> was with him, and that which he <span class=\"wl wl-kjv\" data-code=\"H6213\">did,</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> made it to prosper."}};

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});
