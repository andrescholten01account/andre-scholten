t in het laatste heerlijk gemaakt, naar de weg zeewaarts toe gelegen over de Jordaan, aan Galilea van de heidenen.", "Ps 16:10": "Want U zult mijn ziel in het graf niet verlaten; U zult niet toelaten dat Uw Heilige de ontbinding ziet.", "Spr 21:9": "Het is beter te wonen op een hoek van het dak, dan met een kijfachtige vrouw, en dat in een huis van gezelschap.", "1 Kon 2:3": "En neem de wacht van de HEERE, uw God, in acht, om te wandelen in Zijn wegen, om Zijn inzettingen te onderhouden, en Zijn geboden, en Zijn rechten, en Zijn getuigenissen, zoals geschreven is in de wet van Mozes; opdat u verstandig handelt in alles wat u doet, en overal waar u zich heen wendt;", "Joël 2:32": "En het zal gebeuren, dat ieder die de Naam van de HEERE zal aanroepen, behouden zal worden; want op de berg Sion en te Jeruzalem zal ontkoming zijn, zoals de HEERE gezegd heeft; en dat, bij de overgeblevenen, die de HEERE zal roepen.", "Hebr 12:26": "Wiens stem toen de aarde deed beven; maar nu heeft Hij verkondigd en gezegd: Nog eenmaal zal Ik niet alleen de aarde doen beven, maar ook de hemel.", "Ps 69:23": "Hun tafel moet voor hun gezicht tot een strik worden, en tot volle vergelding tot een valstrik.", "2 Kor 11:3": "Doch ik vrees dat, zoals de slang Eva door haar arglistigheid bedrogen heeft, zo ook uw gedachten op enigerlei wijze bedorven worden, om af te wijken van de eenvoudigheid die in Christus is.", "Jes 1:15": "En als u uw handen uitspreidt, verberg Ik Mijn ogen voor u; ook wanneer u het gebed vermenigvuldigt, hoor Ik niet; want uw handen zijn vol bloed.", "Rom 7:1-3": "Weet u niet, broeders! (want ik spreek tot hen die de wet kennen) dat de wet heerst over de mens, zo lang als hij leeft? Want een vrouw die onder de man staat, is aan de levende man verbonden door de wet; maar als de man gestorven is, dan is zij vrijgemaakt van de wet van de man. Daarom dan, als zij bij een andere man gaat wonen terwijl de man leeft, zal zij een overspeelster genoemd worden; maar als de man gestorven is, dan is zij vrij van de wet, zodat zij geen overspeelster is als zij bij een andere man gaat wonen.", "Deut 6:2-25": "Opdat u de HEERE, uw God, vreest, om al Zijn inzettingen en Zijn geboden te houden, die ik u gebied; u, en uw kind, en kindskind, al de dagen van uw leven; en opdat uw dagen verlengd worden. Hoor dan, Israël! en let erop dat u ze doet, opdat het u goed gaat, en opdat u zeer vermenigvuldigt (zoals de HEERE, de God van uw vaderen, u gesproken heeft) in het land, dat overvloeit van melk en honing. Hoor, Israël! De HEERE, onze God, is een enig HEERE!", "Spr 28:18": "Wie oprecht wandelt, zal behouden worden; maar wie zich verkeerd gedraagt op twee wegen, zal op een van de twee vallen.", "Openb 16:5": "En ik hoorde de engel van het water zeggen: U bent rechtvaardig, Heere! Die is, en Die was, en Die zijn zal, dat U dit geoordeeld hebt;", "Ps 75:11": "En ik zal alle hoorns van de goddelozen afhouwen; de hoorns van de rechtvaardige zullen verhoogd worden.", "Ex 23:22": "Maar als u Zijn stem echt gehoorzaamt, en doet al wat Ik zeggen zal, dan zal Ik de vijand van uw vijanden zijn, en de tegenstander van wie u tegenstaat.", "Ps 23:1-6": "Een psalm van David. De HEERE is mijn Herder, mij zal niets ontbreken. Hij laat mij neerliggen in grazige weiden; Hij voert mij zachtjes naar zeer stille wateren. Hij verkwikt mijn ziel; Hij leidt mij in het spoor van de gerechtigheid, omwille van Zijn Naam.", "Jes 43:15": "Ik ben de HEERE, uw Heilige; de Schepper van Israël, uw Koning.", "Ps 65:10-14": "U bezoekt het land, en hebt het begerig gemaakt, U verrijkt het overvloedig; de rivier van God is vol water; wanneer U het zo bereid hebt, maakt U hun koren gereed. U maakt zijn opgeploegde aarde dronken; U doet ze dalen in zijn voren; U maakt het zacht door de druppels; U zegent zijn uitspruitsel. U kroont het jaar van Uw goedheid; en Uw voetstappen druipen van vettigheid.", "Gen 3:12": "Toen zei Adam: De vrouw die U bij mij gegeven hebt, die heeft mij van die boom gegeven, en ik heb gegeten.", "Jes 13:9": "Zie, de dag van de HEERE komt, gruwelijk, met verbolgenheid en hevige toorn, om het land tot verwoesting te stellen, en de zondaars daaruit te verdelgen.", "Hab 2:4": "Zie, wie zich verheft, zijn ziel is niet oprecht in hem; maar de rechtvaardige zal door zijn geloof leven.", "Ps 104:20": "U beschikt de duisternis, en het wordt nacht, waarin al het gedierte van het woud uittreedt.", "Ezech 33:14": "Als Ik ook tegen de goddeloze zeg: U zult zeker sterven! en hij zich van zijn zonde bekeert en recht en gerechtigheid doet;", "Gen 2:21-24": "Toen deed de HEERE God een diepe slaap op Adam vallen, en hij sliep; en Hij nam een van zijn ribben, en sloot de plaats daarvan toe met vlees. En de HEERE God bouwde de rib, die Hij van Adam genomen had, tot een vrouw, en Hij bracht haar bij Adam. Toen zei Adam: Dit is ditmaal been van mijn benen, en vlees van mijn vlees! Men zal haar Manninne noemen, omdat zij uit de man genomen is.", "2 Petr 2:22": "Maar hun is overkomen wat een waar spreekwoord zegt: De hond is teruggekeerd naar zijn eigen uitbraaksel; en het gewassen varken naar de modderpoel om zich erin te wentelen.", "Joh 7:21-24": "Jezus antwoordde en zei tegen hen: Eén werk heb Ik gedaan, en u verwondert u allen. Daarom heeft Mozes u de besnijdenis gegeven (niet dat ze uit Mozes is, maar uit de vaderen), en u besnijdt een mens op de sabbat. Als een mens de besnijdenis ontvangt op de sabbat, zodat de wet van Mozes niet gebroken wordt, bent u dan boos op Mij, omdat Ik een heel mens gezond gemaakt heb op de sabbat?", "Spr 13:11": "Goed, dat door ijdelheid gekomen is, zal verminderd worden; maar die met de hand verzamelt, zal het vermeerderen.", "1 Kor 6:16": "Of weet u niet, dat wie zich aan een hoer hecht, één lichaam met haar is? Want die twee, zegt Hij, zullen tot één vlees worden.", "Ex 32:14": "Toen kreeg de HEERE berouw over het kwaad, dat Hij gezegd had Zijn volk te zullen aandoen.", "Joël 2:26": "En u zult overvloedig en tot verzadiging eten, en de Naam van de HEERE, uw God, prijzen, Die wonderlijk bij u gehandeld heeft; en Mijn volk zal niet beschaamd worden tot in eeuwigheid.", "Ps 144:4": "De mens lijkt op een ademtocht; zijn dagen zijn als een voorbijgaande schaduw.", "Deut 24:1": "Wanneer een man een vrouw genomen en die getrouwd heeft, dan zal het gebeuren, als zij geen genade vindt in zijn ogen, omdat hij iets van schande aan haar gevonden heeft, dat hij haar een scheidbrief zal schrijven, en die in haar hand geven, en haar laten gaan uit zijn huis.", "Ex 20:14": "U zult geen echtbreuk plegen.", "Ps 9:18": "De goddelozen zullen terugkeren, naar de hel toe, alle heidenen die God vergeten zijn.", "Mark 12:40": "die de huizen van weduwen opeten, en dat onder de schijn van lang te bidden. Dezen zullen een zwaarder oordeel ontvangen.", "Ezech 31:18": "Aan wie bent u zo gelijk in heerlijkheid en grootheid, onder de bomen van Eden? Ja, u zult neergevoerd worden met de bomen van Eden, tot het onderste van de aarde; in het midden van de onbesnedenen zult u liggen, met de verslagenen door het zwaard. Dat is Farao, en zijn hele menigte, spreekt de Heere HEERE.", "Ezech 33:8": "Als Ik tegen de goddeloze zeg: O goddeloze, u zult zeker sterven! en u spreekt niet, om de goddeloze van zijn weg af te manen, dan zal die goddeloze in zijn ongerechtigheid sterven, maar zijn bloed zal Ik van uw hand eisen.", "Job 21:33": "De kluiten van het dal zijn hem zoet, en hij trekt achter zich alle mensen aan; en van hen die vóór hem geweest zijn, is geen getal.", "Jes 33:16": "Die zal in de hoogten wonen, de sterkten van de steenrotsen zullen zijn hoge schuilplaats zijn; zijn brood wordt hem gegeven, zijn water is gewis.", "Joh 3:18": "Wie in Hem gelooft, wordt niet veroordeeld, maar wie niet gelooft, is al veroordeeld, omdat hij niet geloofd heeft in de Naam van de eniggeboren Zoon van God.", "Jer 13:22": "Wanneer u dan in uw hart zult zeggen: Waarom zijn mij deze dingen overkomen? Om de veelheid van uw ongerechtigheid zijn uw zomen ontbloot, en uw hielen hebben geweld geleden.", "Hand 4:24": "En toen dezen dat hoorden, hieven zij eensgezind hun stem op tot God, en zeiden: Heere! U bent de God, Die de hemel gemaakt heeft, en de aarde, en de zee, en alle dingen die daarin zijn.", "Matt 5:45": "opdat u kinderen mag zijn van uw Vader, Die in de hemelen is; want Hij laat Zijn zon opgaan over bozen en goeden, en laat het regenen over rechtvaardigen en onrechtvaardigen.", "Hos 11:1": "Toen Israël een kind was, heb Ik hem liefgehad, en Ik heb Mijn zoon uit Egypte geroepen.", "Ps 103:3-5": "Die al uw ongerechtigheid vergeeft, die al uw ziekten geneest; Die uw leven verlost van het verderf, die u kroont met goedertierenheid en barmhartigheden; Die uw mond verzadigt met het goede, uw jeugd vernieuwt als die van een arend.", "Jes 38:1": "In die dagen werd Hizkia ziek tot de dood toe; en de profeet Jesaja, de zoon van Amoz, kwam bij hem en zei tegen hem: Zo zegt de HEERE: Regel uw zaken; want u zult sterven en niet leven.", "Jer 11:4": "Dat Ik uw vaderen geboden heb, op de dag dat Ik hen uit Egypteland, uit de ijzeroven, uitvoerde, en Ik zei: Wees Mijn stem gehoorzaam, en doe die, naar alles wat Ik u gebied; zo zult u Mij tot een volk zijn, en Ik zal u tot een God zijn;", "Mark 10:19": "U kent de geboden: U zult geen overspel plegen; u zult niet doden; u zult niet stelen; u zult geen vals getuigenis geven; u zult niemand tekortdoen; eer uw vader en uw moeder.", "Hand 8:33": "In Zijn vernedering is Zijn oordeel weggenomen; en wie zal Zijn geslacht verhalen? Want Zijn leven wordt van de aarde weggenomen.", "Rom 9:29": "En zoals Jesaja van tevoren gezegd heeft: Als de Heere Sebaoth ons geen nageslacht had overgelaten, dan waren wij geworden als Sodom, en gelijk gemaakt aan Gomorra.", "Ps 67:7": "De aarde geeft haar opbrengst; God, onze God, zal ons zegenen.", "Hand 4:11": "Hij is de Steen, Die door u, de bouwlieden, veracht is, Die tot een hoeksteen geworden is.", "Rom 14:11": "Want er is geschreven: Ik leef, zegt de Heere, voor Mij zal elke knie zich buigen, en elke tong zal God belijden.", "Ex 20:17": "U zult niet begeren het huis van uw naaste; u zult niet begeren de vrouw van uw naaste, of zijn dienstknecht, of zijn dienstmaagd, of zijn os, of zijn ezel, of iets dat van uw naaste is.", "Gal 6:8": "Want die in zijn eigen vlees zaait, zal uit het vlees verderf maaien; maar die in de Geest zaait, zal uit de Geest het eeuwige leven maaien.", "Matt 5:31": "Er is ook gezegd: Wie zijn vrouw verlaat, moet haar een scheidbrief geven.", "1 Kron 21:15": "En God zond een engel naar Jeruzalem, om die te verderven; en toen hij haar verdierf, zag de HEERE het, en het berouwde Hem over dat kwaad; en Hij zei tegen de verdervende engel: Het is genoeg, trek nu uw hand terug. De engel van de HEERE nu stond bij de dorsvloer van Ornan, de Jebusiet.", "Ps 18:28": "Want U verlost het bedrukte volk, maar de hoge ogen vernedert U.", "Spr 13:6": "De gerechtigheid bewaart de oprechte op de weg; maar de goddeloosheid zal de zondaar omkeren.", "Amos 8:5": "En zegt: Wanneer is de nieuwe maan voorbij, zodat wij koren mogen verkopen? en de sabbat, zodat wij graan mogen aanbieden? terwijl u de efa verkleint en de sikkel vergroot, en verkeerd handelt met bedrieglijke weegschalen;", "Deut 1:7": "Keer u om, vertrek, en ga naar het gebergte van de Amorieten, en naar al hun buren, in het vlakke veld, op het gebergte, en in de laagte, en in het zuiden, en aan de kust van de zee; het land van de Kanaänieten, en de Libanon, tot aan die grote rivier, de rivier de Eufraat.", "Joz 5:14": "En Hij zei: Nee, maar Ik ben de Vorst van het leger van de HEERE: Ik ben nu gekomen! Toen viel Jozua op zijn aangezicht ter aarde en aanbad, en zei tegen Hem: Wat spreekt mijn Heere tegen Zijn knecht?", "Joz 1:8": "Laat het boek van deze wet niet wijken van uw mond, maar overleg het dag en nacht, opdat u waarneemt te doen naar alles wat daarin geschreven is; want dan zult u uw wegen voorspoedig maken, en dan zult u verstandig handelen.", "Matt 15:13": "Maar Hij antwoordde en zei: Elke plant die Mijn hemelse Vader niet geplant heeft, zal uitgeroeid worden.", "Job 3:13": "Want nu zou ik neerliggen, en stil zijn; ik zou slapen, dan zou voor mij rust zijn;", "Jes 58:14": "Dan zult u zich verlustigen in de HEERE, en Ik zal u doen rijden op de hoogten van de aarde, en Ik zal u voeden met het erfdeel van uw vader Jakob; want de mond van de HEERE heeft het gesproken.", "Matt 19:4": "Maar Hij antwoordde en zei tegen hen: Hebt u niet gelezen dat Hij Die van het begin de mens gemaakt heeft, hen gemaakt heeft man en vrouw?", "Luk 8:24": "En zij gingen naar Hem toe en wekten Hem, en zeiden: Meester, Meester, wij vergaan! En Hij stond op en bestrafte de wind en de golven, en zij hielden op, en het werd stil.", "Matt 8:12": "maar de kinderen van het koninkrijk zullen uitgeworpen worden in de buitenste duisternis; daar zal gehuil zijn, en het geknars van de tanden.", "Jak 1:10": "En de rijke in zijn vernedering; want hij zal als een bloem van het gras voorbijgaan.", "Ps 33:9": "Want Hij spreekt, en het is er; Hij gebiedt, en het staat er.", "Ps 68:32": "Prinselijke gezanten zullen komen uit Egypte; Morenland zal zich haasten zijn handen tot God uit te strekken.", "Job 39:3": "Wie bereidt de raaf haar kost, als haar jongen tot God schreeuwen, als zij dwalen, omdat er geen eten is?", "Jes 43:7": "ieder, die naar Mijn Naam genoemd is, en die Ik geschapen heb tot Mijn eer, die Ik geformeerd heb, die Ik ook gemaakt heb.", "Hebr 1:5": "Want tegen wie van de engelen heeft Hij ooit gezegd: U bent Mijn Zoon, heden heb Ik U verwekt? En opnieuw: Ik zal Hem tot een Vader zijn, en Hij zal Mij tot een Zoon zijn?", "Zach 10:1": "Vraag van de HEERE regen, in de tijd van de late regen; de HEERE maakt de bliksemwolken¹, en Hij zal hun regen genoeg geven, voor ieder kruid op het veld.", "Ps 71:15": "Mijn mond zal Uw gerechtigheid vertellen, de hele dag Uw heil; hoewel ik de getallen ervan niet weet.", "Matt 13:35": "Opdat vervuld zou worden wat gesproken is door de profeet, die zei: Ik zal Mijn mond opendoen door gelijkenissen; Ik zal dingen voortbrengen die verborgen waren van de grondlegging van de wereld af.", "Deut 13:11": "Opdat heel Israël het hoort en vreest, en niet meer voortvaart om te doen naar dit boze stuk in uw midden.", "Jes 5:6": "En Ik zal hem tot een woestenij maken; hij zal niet gesnoeid, noch omgespit worden, maar distels en doornen zullen erin opkomen; en Ik zal de wolken gebieden dat zij er geen regen op laten regenen.", "Jes 43:27": "Uw eerste vader heeft gezondigd, en uw uitleggers hebben tegen Mij overtreden.", "Ps 34:8": "Cheth. De Engel van de HEERE legert Zich rondom hen die Hem vrezen, en redt hen.", "Luk 12:7": "Ja, ook de haren van uw hoofd zijn allemaal geteld. Wees dan niet bang; u gaat vele musjes te boven.", "Ex 3:6": "Hij zei verder: Ik ben de God van uw vader, de God van Abraham, de God van Izak en de God van Jakob. En Mozes verborg zijn gezicht, want hij was bang om God aan te zien.", "Ps 71:6": "Op U heb ik gesteund van de buik af aan; van de ingewanden van mijn moeder af aan zijt Gij mijn Uithelper; mijn lof is voortdurend van U.", "1 Kor 6:9": "Of weet u niet, dat de onrechtvaardigen het Koninkrijk van God niet zullen beërven?", "Ps 104:30": "Zendt U Uw Geest uit, dan worden zij geschapen, en U vernieuwt het gelaat van het aardrijk.", "Ps 31:3": "Neig Uw oor tot mij, red mij haastig; wees mij tot een sterke Rotssteen, tot een zeer vast Huis, om mij te behouden.", "1 Sam 2:8": "Hij verheft de geringe uit het stof, en de nooddruftige verhoogt Hij uit de vuilnis, om hen te doen zitten bij de vorsten, dat Hij hen de stoel van de eer laat beërven; want de fundamenten van het aardrijk zijn van de HEERE, en Hij heeft de wereld daarop gezet.", "Openb 22:19": "En als iemand iets afdoet van de woorden van het boek van deze profetie, zal God zijn deel afdoen uit het boek des levens, en uit de heilige stad, en uit wat in dit boek geschreven is.", "Jes 10:22": "Want ofschoon uw volk, o Israël, is als het zand van de zee, zo zal toch maar het overblijfsel daarvan terugkeren; de verdelging is vast besloten, overvloeiend met gerechtigheid.", "Deut 6:16": "U zult de HEERE, uw God, niet beproeven, zoals u Hem beproefd hebt te Massa.", "Ps 89:12": "De hemel is van U, ook is de aarde van U; de wereld en haar volheid, die hebt Gij gegrond.", "Gen 25:23": "En de HEERE zei tegen haar: Twee volken zijn in uw buik, en twee naties zullen zich uit uw ingewand van elkaar scheiden; en het ene volk zal sterker zijn dan het andere volk; en de oudste zal de jongste dienen.", "Lev 26:10": "En u zult het oude, dat verouderd is, eten; en het oude zult u wegdoen vanwege het nieuwe.", "Openb 20:12-14": "En ik zag de doden, klein en groot, staande voor God; en de boeken werden geopend; en een ander boek werd geopend, dat van het leven is; en de doden werden geoordeeld uit wat in de boeken geschreven was, naar hun werken. En de zee gaf de doden, die in haar waren; en de dood en het rijk van de dood gaven de doden, die in hen waren; en zij werden geoordeeld, ieder naar zijn werken. En de dood en het rijk van de dood werden geworpen in de poel van het vuur; dit is de tweede dood.", "Fil 3:19": "Van wie het einde het verderf is, van wie God de buik is, en van wie de heerlijkheid in hun schande is, die aardse dingen bedenken.", "Ps 73:27": "Want zie, wie ver van U zijn, zullen vergaan; U roeit uit al wie van U afhoereert;", "Ezech 9:5-7": "Maar tot die anderen zei Hij voor mijn oren: Ga door de stad achter hem, en sla, uw oog verschoont niet, en spaar niet! Dood oude mensen, jonge mannen en meisjes, en kinderen en vrouwen, tot het verderven toe; maar kom niemand nabij op wie het teken is, en begin bij Mijn heiligdom. En zij begonnen bij de oude mannen, die vóór het huis waren. En Hij zei tot hen: Verontreinig het huis, en vervul de voorhoven met gedoden; ga naar buiten. En zij gingen naar buiten, en zij sloegen in de stad.", "Ps 3:8": "Sta op, HEERE, verlos mij, mijn God; want U hebt al mijn vijanden op het kinnebakken geslagen; de tanden van de goddelozen hebt U verbrijzeld.", "Spr 21:5": "De gedachten van de vlijtige zijn alleen tot overschot; maar van ieder die haastig is, alleen tot gebrek.", "Mark 6:2": "En toen het sabbat geworden was, begon Hij in de synagoge te onderwijzen; en velen die Hem hoorden, waren verbaasd, en zeiden: Waar komen Deze deze dingen vandaan, en wat is dit voor wijsheid die Hem gegeven is, dat ook zulke krachten door Zijn handen gebeuren?", "Openb 22:1": "En hij toonde mij een zuivere rivier van het water des levens, klaar als kristal, die uit de troon van God en van het Lam kwam.", "Ps 18:32": "Want wie is God, behalve de HEERE? En wie is een Rotssteen, dan alleen onze God?", "Ps 30:10": "Wat gewin is er in mijn bloed, in mijn neerdalen tot de groeve? Zal het stof U loven? Zal het Uw waarheid verkondigen?", "Luk 13:10-17": "En Hij gaf onderwijs op de sabbat in een van de synagogen. En zie, er was een vrouw die al achttien jaar lang een geest van ziekte had, en zij was samengebogen en kon zich totaal niet oprichten. En Jezus zag haar, riep haar bij Zich en zei tegen haar: Vrouw, u bent verlost van uw ziekte.", "2 Kron 7:17": "En wat u betreft, als u voor Mijn aangezicht wandelt, zoals uw vader David gewandeld heeft, en doet naar alles wat Ik u geboden heb, en Mijn inzettingen en Mijn rechten houdt;", "Ps 62:4": "Hoelang zult u kwaad aanstichten tegen een man? U zult allen gedood worden; u zult zijn als een ingebogen wand, een aangestoten muur.", "Luk 4:19": "Om aan de gevangenen vrijlating te prediken, en aan de blinden het gezicht, om de verslagenen in vrijheid heen te zenden; om te prediken het aangename jaar van de Heere.", "Joh 5:5-14": "En daar was een zeker mens, die achtendertig jaar ziek geweest was. Toen Jezus hem zag liggen en wist dat hij al lange tijd zo was, zei Hij tegen hem: Wilt u gezond worden? De zieke antwoordde Hem: Heere, ik heb geen mens om mij in het badwater te brengen, wanneer het water bewogen wordt; en terwijl ik kom, gaat een ander vóór mij naar beneden.", "Job 1:21": "En hij zei: Naakt ben ik uit mijn moeders buik gekomen, en naakt zal ik daarheen terugkeren. De HEERE heeft gegeven, en de HEERE heeft genomen; de Naam van de HEERE zij geloofd!", "Jes 51:2": "Kijk naar Abraham, uw vader, en naar Sara, die u gebaard heeft; want Ik riep hem, toen hij nog alleen was, en Ik zegende hem, en Ik vermenigvuldigde hem.", "Ex 39:13": "En de vierde rij van een turkoois, en een sardonyx, en een jaspis; gezet in gouden kastjes in hun vullingen.", "Jes 57:20": "Maar de goddelozen zijn als een voortgejaagde zee, want die kan niet tot rust komen, en haar water werpt slijk en modder op.", "Jes 47:3": "Uw schaamte zal ontdekt worden, ook zal uw schande gezien worden; Ik zal wraak nemen, en Ik zal u niet aanvallen als een mens.", "Spr 22:5": "Doornen en strikken liggen op de weg van de verkeerde; wie zijn ziel bewaart, zal zich ver daarvan houden.", "Ps 127:1": "Een lied Hammaaloth¹, van Salomo. Als de HEERE het huis niet bouwt, werken de bouwers eraan tevergeefs; als de HEERE de stad niet bewaart, waakt de wachter tevergeefs.", "Ps 29:3-10": "De stem van de HEERE is op de wateren, de God van de ere dondert; de HEERE is op de grote wateren. De stem van de HEERE is met kracht, de stem van de HEERE is met heerlijkheid. De stem van de HEERE breekt de ceders; ja, de HEERE verbreekt de ceders van Libanon.", "Matt 13:14": "En in hen wordt de profetie van Jesaja vervuld, die zegt: Met het gehoor zult u horen, en geenszins begrijpen; en ziende zult u zien, en geenszins opmerken.", "Jer 27:5": "Ik heb de aarde gemaakt, de mens en het vee die op de aardbodem zijn, door Mijn grote kracht en door Mijn uitgestrekte arm, en Ik geef ze aan wie het goed is in Mijn ogen.", "Joh 6:45": "Er is geschreven in de profeten: En zij zullen allen door God onderwezen zijn. Ieder dan die het van de Vader gehoord en geleerd heeft, komt tot Mij.", "Luk 22:22": "En de Zoon des mensen gaat wel heen, zoals besloten is; maar wee die mens, door wie Hij verraden wordt!", "Hand 14:17": "hoewel Hij Zichzelf toch niet zonder getuigenis gelaten heeft, doordat Hij goeddeed, ons vanuit de hemel regen en vruchtbare tijden gaf, en onze harten vervulde met voedsel en vreugde.", "Openb 21:4": "En God zal alle tranen van hun ogen afvegen; en de dood zal niet meer zijn; noch rouw, noch geroep, noch moeite zal er meer zijn; want de eerste dingen zijn weggegaan.", "Hebr 2:10": "Want het paste Hem, om Wie alle dingen zijn, en door Wie alle dingen zijn, dat Hij, veel kinderen naar de heerlijkheid leidend, de leidsman van hun zaligheid door lijden zou volmaken.", "Matt 5:21": "U hebt gehoord dat tot de ouden gezegd is: U zult niet doden; en wie doodt, die zal strafbaar zijn voor het gericht.", "Matt 12:10-12": "En kijk, er was een mens die een verschrompelde hand had, en zij vroegen Hem: Is het geoorloofd op de sabbatdagen te genezen? (om Hem te kunnen beschuldigen.) En Hij zei tegen hen: Wie onder u is er die een schaap heeft, en als dat op een sabbatdag in een greppel valt, zal hij het niet vastpakken en eruit heffen? Hoeveel gaat een mens dan een schaap te boven! Daarom is het op de sabbatdagen geoorloofd goed te doen.", "Spr 26:11": "Zoals een hond terugkeert naar zijn uitspuwsel, zo herneemt de dwaas zijn dwaasheid.", "Rom 10:11": "Want de Schrift zegt: Ieder die in Hem gelooft, zal niet beschaamd worden.", "Ezech 46:3": "Ook zal het volk van het land aanbidden voor de deur van die poort, op de sabbatten en op de nieuwe manen, voor het aangezicht van de HEERE.", "Jona 4:6": "En God, de HEERE, liet een wonderboom groeien en die opschieten boven Jona, zodat er schaduw zou zijn over zijn hoofd, om hem te bevrijden van zijn ellende. En Jona verheugde zich over de wonderboom met grote blijdschap.", "1 Kor 7:10-14": "Maar de getrouwden gebied ik niet, maar de Heere, dat de vrouw niet van de man scheidt. En als zij toch scheidt, laat zij dan ongetrouwd blijven, of zich verzoenen met de man; en dat de man de vrouw niet verlaat. Maar tegen de anderen zeg ik, niet de Heere: als een broeder een ongelovige vrouw heeft, en zij ermee tevreden is bij hem te wonen, laat hij haar niet verlaten;", "1 Kor 7:3": "De man zal aan de vrouw geven wat hij haar schuldig is aan genegenheid; en net zo ook de vrouw aan de man.", "Spr 19:16": "Die het gebod bewaart, bewaart zijn ziel; die zijn wegen veracht, zal sterven.", "Ps 31:18": "HEERE! laat mij niet beschaamd worden, want ik roep U aan; laat de goddelozen beschaamd worden, laat hen zwijgen in het graf.", "Hand 7:32": "die zei: Ik ben de God van uw vaders, de God van Abraham, en de God van Izak, en de God van Jakob. En Mozes begon hevig te beven, en durfde niet te kijken.", "Joh 3:8": "De wind waait waarheen hij wil, en u hoort zijn geluid; maar u weet niet waar hij vandaan komt en waar hij heen gaat; zo is ieder die uit de Geest geboren is.", "1 Kor 9:5": "Hebben wij geen macht om een vrouw, een zuster zijnde, met ons mee te nemen, zoals ook de andere apostelen, en de broeders van de Heere, en Cefas?", "Spr 10:3": "De HEERE laat de ziel van de rechtvaardige niet hongeren; maar de have van de goddelozen stoot Hij weg.", "Ps 78:69": "En Hij bouwde Zijn heiligdom als hoogten, als de aarde, die Hij gegrond heeft voor eeuwig.", "Joh 1:4": "In Hem was het Leven, en het Leven was het Licht van de mensen.", "2 Sam 7:8": "Nu dan, zo zult u tegen Mijn knecht, tegen David, zeggen: Zo zegt de HEERE van de heerscharen: Ik heb u genomen van de schaapskooi, van achter de schapen, om een voorganger te zijn over Mijn volk, over Israël.", "Jona 3:10": "En God zag hun werken, dat zij zich bekeerden van hun boze weg; en het berouwde God over het kwaad, dat Hij gesproken had hun te zullen doen, en Hij deed het niet.", "Ps 89:33": "dan zal Ik hun overtreding met de roede bezoeken, en hun ongerechtigheid met plagen.", "Ps 68:22": "Zeker zal God de kop van Zijn vijanden verslaan, de harige schedel van hem die in zijn schulden wandelt.", "Hand 7:26-28": "En de volgende dag liet hij zich aan hen zien, terwijl zij vochten; en hij drong hen tot vrede, en zei: Mannen, u bent broeders; waarom doet u elkaar onrecht aan? Maar die zijn naaste onrecht aandeed, stiet hem weg, en zei: Wie heeft u tot leider en rechter over ons gesteld? Wilt u mij ook ombrengen, zoals u gisteren de Egyptenaar hebt omgebracht?", "Ps 119:21": "U scheldt de vervloekte hoogmoedigen, die van Uw geboden afdwalen.", "Mark 6:18": "Want Johannes had tegen Herodes gezegd: Het is u niet geoorloofd de vrouw van uw broer te hebben.", "Num 15:31": "Want zij heeft het woord van de HEERE veracht en Zijn gebod vernietigd; die ziel zal helemaal uitgeroeid worden; haar ongerechtigheid is op haar.", "Hand 7:3": "en zei tegen hem: Ga uit uw land en uit uw familie, en kom in een land dat Ik u wijzen zal.", "Spr 14:11": "Het huis van de goddelozen zal weggevaagd worden; maar de tent van de oprechten zal bloeien.", "Deut 5:14": "maar de zevende dag is de sabbat van de HEERE, uw God; dan zult u geen werk doen, u, noch uw zoon, noch uw dochter, noch uw dienstknecht, noch uw dienstmaagd, noch uw os, noch uw ezel, noch enig van uw vee, noch de vreemdeling die in uw poorten is; opdat uw dienstknecht en uw dienstmaagd rusten, net als u.", "Ex 35:3": "U zult geen vuur aansteken in enige van uw woningen op de sabbatdag.", "Ps 45:7": "Uw troon, o God! is eeuwig en altijd; de scepter van Uw koninkrijk is een scepter van rechtmatigheid.", "Joh 5:29": "en zij zullen uitgaan, zij die het goede gedaan hebben tot de opstanding van het leven, en zij die het kwade gedaan hebben tot de opstanding van het oordeel.", "Lev 19:18": "U zult niet wreken, noch toorn koesteren tegen de kinderen van uw volk; maar u zult uw naaste liefhebben als uzelf; Ik ben de HEERE!", "Luk 23:56": "En zij keerden terug en bereidden specerijen en zalven; en op de sabbat rustten zij, volgens het gebod.", "Rom 3:14": "Hun mond is vol vervloeking en bitterheid;", "Ps 39:5": "HEERE, maak mij mijn einde bekend, en welke de mate van mijn dagen is; dat ik weet, hoe vergankelijk ik ben.", "Gen 3:2": "En de vrouw zei tegen de slang: Van de vrucht van de bomen in de hof mogen wij eten;", "2 Kron 20:3-30": "Josafat nu werd bevreesd, en richtte zich erop om de HEERE te zoeken; en hij riep een vasten uit in heel Juda. En Juda kwam bijeen om hulp te zoeken bij de HEERE; ook kwamen zij uit alle steden van Juda om de HEERE te zoeken. En Josafat stond in de samenkomst van Juda en Jeruzalem, in het huis van de HEERE, voor het nieuwe voorhof.", "Matt 21:19": "En Hij zag een vijgenboom aan de weg, ging ernaartoe, en vond er niets aan dan alleen bladeren; en Hij zei tegen hem: Laat er in eeuwigheid geen vrucht meer aan u komen! En de vijgenboom verdorde meteen.", "Ps 81:14-17": "Och, dat Mijn volk naar Mij geluisterd had, dat Israël in Mijn wegen had gewandeld! In korte tijd zou Ik hun vijanden onderworpen hebben, en Mijn hand gewend hebben tegen hun tegenstanders. Zij die de HEERE haten, zouden zich Hem geveinsd onderworpen hebben, maar hun tijd zou eeuwig geweest zijn.", "Spr 13:23": "Het ploegen van de armen geeft overvloed van voedsel; maar er is iemand die verteerd wordt door gebrek aan oordeel.", "Matt 15:7-9": "Huichelaars! Terecht heeft Jesaja over u geprofeteerd, toen hij zei: Dit volk nadert Mij met hun mond, en eert Mij met de lippen, maar hun hart houdt zich ver van Mij; Maar tevergeefs eren zij Mij, terwijl zij leringen leren die geboden van mensen zijn.", "2 Tim 2:12": "als wij volharden, zullen wij ook met Hem heersen; als wij Hem verloochenen, zal Hij ons ook verloochenen;", "Matt 16:26": "Want wat baat het een mens, als hij de hele wereld wint, en schade lijdt aan zijn ziel? Of wat zal een mens geven, als losprijs voor zijn ziel?", "Gen 15:18": "Op dezelfde dag maakte de HEERE een verbond met Abram, en Hij zei: Aan uw nageslacht heb Ik dit land gegeven, van de rivier van Egypte af, tot aan die grote rivier, de rivier de Eufraat:", "Gal 5:19": "De werken van het vlees nu zijn openbaar; dat zijn: overspel, hoererij, onreinheid, losbandigheid,", "1 Sam 2:6": "De HEERE doodt en maakt levend; Hij doet naar het graf neerdalen, en Hij doet weer opkomen.", "Hand 17:25-28": "En wordt ook niet door mensenhanden gediend, alsof Hij iets nodig zou hebben, omdat Hij Zelf aan allen het leven, en de adem, en alle dingen geeft; En Hij heeft uit één bloed heel het geslacht van de mensen gemaakt, om op de hele aardbodem te wonen, en Hij heeft de vastgestelde tijden bepaald, en de grenzen van hun woongebied; Opdat zij de Heere zouden zoeken, of zij Hem misschien konden tasten en vinden; hoewel Hij niet ver is van ieder van ons.", "Ezech 33:7-20": "U dan, o mensenkind! Ik heb u tot een wachter gesteld over het huis van Israël; u zult dus het woord uit Mijn mond horen, en hen namens Mij waarschuwen. Als Ik tegen de goddeloze zeg: O goddeloze, u zult zeker sterven! en u spreekt niet, om de goddeloze van zijn weg af te manen, dan zal die goddeloze in zijn ongerechtigheid sterven, maar zijn bloed zal Ik van uw hand eisen. Maar als u de goddeloze van zijn weg afmaant, dat hij zich ervan bekeert, en hij zich van zijn weg niet bekeert, dan zal hij in zijn ongerechtigheid sterven; maar u hebt uw leven bevrijd.", "Gal 3:13": "Christus heeft ons verlost van de vloek van de wet, doordat Hij voor ons een vloek geworden is; want er is geschreven: Vervloekt is ieder die aan het hout hangt.", "1 Tim 1:20": "Onder hen zijn Hymeneüs en Alexander, die ik aan de satan overgegeven heb, opdat zij zouden leren niet meer te lasteren.", "Hebr 2:3": "hoe zullen wij dan ontvluchten, als wij zo'n grote zaligheid veronachtzamen? Deze is eerst door de Heere Zelf verkondigd, en aan ons bevestigd door hen die Hem gehoord hebben;", "1 Kor 7:27-29": "Bent u aan een vrouw verbonden, zoek geen ontbinding; bent u ongebonden van een vrouw, zoek geen vrouw. Maar als u toch trouwt, zondigt u niet; en als een maagd trouwt, zondigt zij niet. Toch zullen zulke mensen verdrukking hebben in het vlees; en ik spaar u daarvoor. Maar dit zeg ik, broeders: dat de tijd voortaan kort is; opdat ook zij die vrouwen hebben, zouden zijn alsof zij ze niet hadden;", "Ps 78:1-67": "Een onderwijzing van Asaf. O mijn volk, neem mijn leer ter ore; neig uw oor tot de woorden van mijn mond. Ik zal mijn mond opendoen met spreuken; ik zal geheimen overvloedig uitstorten, van oude tijden af. Die wij gehoord hebben en weten, en onze vaders ons verteld hebben.", "Spr 11:16": "Een aangename vrouw houdt de eer vast, zoals sterke mannen de rijkdom vasthouden.", "Jes 48:22": "Maar de goddelozen hebben geen vrede, zegt de HEERE.", "Hebr 10:13": "verder wachtend, totdat Zijn vijanden neergelegd worden als een voetbank voor Zijn voeten.", "Ps 36:8": "Hoe dierbaar is Uw goedertierenheid, o God! Daarom nemen de mensenkinderen onder de schaduw van Uw vleugels toevlucht.", "Rom 9:15": "Want Hij zegt tegen Mozes: Ik zal Mij ontfermen over wie Ik Mij ontferm, en zal barmhartig zijn voor wie Ik barmhartig ben.", "Ps 119:161": "Schin. De vorsten hebben mij vervolgd zonder oorzaak; maar mijn hart heeft gevreesd voor Uw woord.", "Hand 2:17-21": "En het zal gebeuren in de laatste dagen, zegt God, dat Ik van Mijn Geest zal uitstorten op alle vlees; en uw zonen en uw dochters zullen profeteren, en uw jongemannen zullen visioenen zien, en uw ouden zullen dromen dromen. En ook op Mijn dienstknechten, en op Mijn dienstmaagden, zal Ik in die dagen van Mijn Geest uitstorten, en zij zullen profeteren. En Ik zal wonderen geven in de hemel boven, en tekenen op de aarde beneden: bloed en vuur en rookwalm.", "Ps 119:90": "Uw trouw is van geslacht tot geslacht; U hebt de aarde vastgemaakt, en zij blijft staan;", "Dan 2:38": "En overal waar mensenkinderen wonen, heeft Hij de dieren van het veld en de vogels van de hemel in uw hand gegeven; en Hij heeft u aangesteld als heerser over hen allen; u bent dat gouden hoofd.", "Gen 3:19": "In het zweet van uw gezicht zult u brood eten, totdat u tot de aarde terugkeert, omdat u daaruit genomen bent; want u bent stof, en u zult tot stof terugkeren.", "Deut 11:24": "Elke plaats, waar uw voetzool op treedt, zal de uwe zijn; van de woestijn en de Libanon, van de rivier, de rivier de Eufraat, tot aan de verste zee, zal uw gebied zijn.", "Pred 7:26-28": "En ik vond iets bitterders dan de dood: een vrouw, wier hart netten en garen, en haar handen boeien zijn; wie goed is voor Gods aangezicht, zal aan haar ontkomen; daarentegen zal de zondaar door haar gevangen worden. Zie, dit heb ik gevonden, zegt de prediker, het ene bij het andere, om de verklaring te vinden; Waar mijn ziel nog naar zoekt, maar ik heb haar niet gevonden: één man uit duizend heb ik gevonden; maar een vrouw onder die allen heb ik niet gevonden.", "1 Kor 12:25": "opdat er geen verdeeldheid in het lichaam zou zijn, maar de leden voor elkaar dezelfde zorg zouden dragen.", "Zach 11:12": "Want ik had tegen hen gezegd: Als het goed is in uw ogen, breng mijn loon, en zo niet, laat het na. En zij hebben mijn loon gewogen, dertig zilverlingen.", "Jes 1:19": "Als u willig bent en luistert, zult u het goede van dit land eten;", "Jak 5:18": "En hij bad opnieuw, en de hemel gaf regen, en de aarde bracht haar vrucht voort.", "Matt 3:7": "Toen hij dan velen van de Farizeeën en Sadduceeën naar zijn doop zag komen, zei hij tegen hen: Adderengebroed! Wie heeft u laten weten dat u moet vluchten voor de komende toorn?", "Luk 13:5-7": "Ik zeg u: Nee; maar als u zich niet bekeert, zult u allen net zo omkomen. En Hij vertelde deze gelijkenis: Iemand had een vijgenboom, geplant in zijn wijngaard; en hij kwam en zocht daarop vrucht, en vond ze niet. En hij zei tegen de wijngaardenier: Zie, ik kom nu al drie jaar vrucht zoeken op deze vijgenboom en vind ze niet; hak hem om; waarom put hij ook nog de grond onnodig uit?", "Neh 9:14": "En U hebt Uw heilige sabbat bekendgemaakt; en U hebt hun geboden, en inzettingen en een wet bevolen, door de hand van Uw knecht Mozes.", "Gen 19:29": "En het gebeurde, toen God de steden van deze vlakte verwoestte, dat God aan Abraham dacht, en Hij leidde Lot weg uit het midden van deze omkering, toen Hij de steden omkeerde waarin Lot gewoond had.", "Spr 20:27": "De ziel van de mens is een lamp van de HEERE, die alle binnenkamers van de buik doorzoekt.", "Jer 17:22": "Ook zult u geen last uitvoeren uit uw huizen op de sabbatdag, en geen enkel werk doen; maar u zult de sabbatdag heiligen, zoals Ik uw vaderen geboden heb.", "Ps 102:26-28": "U hebt voormaals de aarde gegrond, en de hemelen zijn het werk van Uw handen; Die zullen vergaan, maar U zult staande blijven; en zij alle zullen als een kleed verouderen; U zult ze veranderen als een gewaad, en zij zullen veranderd zijn. Maar U bent Dezelfde, en Uw jaren zullen niet geëindigd worden.", "Ex 19:5": "Nu dan, als u nauwgezet Mijn stem gehoorzaamt en Mijn verbond houdt, zult u Mijn eigendom zijn uit alle volken, want de hele aarde is Mijn;", "Rom 12:20": "Als dan uw vijand honger heeft, geef hem te eten; als hij dorst heeft, geef hem te drinken; want als u dat doet, zult u kolen van het vuur op zijn hoofd hopen.", "Hebr 8:8-12": "Want omdat Hij hen berispt, zegt Hij tegen hen: Zie, de dagen komen, spreekt de Heere, dat Ik over het huis van Israël en over het huis van Juda een nieuw verbond zal oprichten; Niet naar het verbond dat Ik met hun vaderen gemaakt heb, op de dag dat Ik hen bij de hand nam om hen uit Egypteland te leiden; want zij zijn in dit Mijn verbond niet gebleven, en Ik heb niet meer naar hen omgekeken, zegt de Heere. Want dit is het verbond dat Ik met het huis van Israël maken zal na die dagen, zegt de Heere: Ik zal Mijn wetten in hun verstand geven, en in hun harten zal Ik ze inschrijven; en Ik zal hun tot een God zijn, en zij zullen Mij tot een volk zijn.", "Hebr 13:4": "Het huwelijk is eerbaar onder allen, en het huwelijksbed onbevlekt; maar hoereerders en overspelers zal God oordelen.", "Jes 65:12-14": "Ik zal u ook tellen voor het zwaard, zodat u zich allen ter slachting zult buigen, omdat Ik geroepen heb, maar u hebt niet geantwoord; Ik gesproken heb, maar u hebt niet gehoord; maar hebt gedaan wat kwaad was in Mijn ogen, en hebt gekozen waaraan Ik geen lust heb. Daarom zegt de Heere HEERE zo: Zie, Mijn knechten zullen eten, maar u zult hongeren; zie, Mijn knechten zullen drinken, maar u zult dorsten; zie, Mijn knechten zullen blij zijn, maar u zult beschaamd zijn. Zie, Mijn knechten zullen juichen van een goed hart, maar u zult schreeuwen van harteleed, en van verbreking van de geest zult u huilen.", "Spr 3:2": "Want lengte van dagen, en jaren van leven, en vrede zullen zij u vermeerderen.", "Matt 4:16": "het volk dat in duisternis zat, heeft een groot licht gezien; en over hen die zaten in het land en de schaduw van de dood, is een licht opgegaan.", "Ps 139:19": "O God! Dat U de goddeloze zou ombrengen! En u, mannen van het bloed, wijkt van mij!", "Jes 66:1": "Zo zegt de HEERE: De hemel is Mijn troon, en de aarde is de voetbank van Mijn voeten; waar zou dat huis zijn, dat u Mij zou bouwen, en waar is de plaats van Mijn rust?", "Mark 1:3": "De stem van hem die roept in de woestijn: Bereid de weg van de Heere, maak Zijn paden recht.", "Jer 25:31": "Het geschal zal komen tot aan het einde van de aarde; want de HEERE heeft een geschil met de volken, Hij zal gericht houden met alle vlees; de goddelozen heeft Hij aan het zwaard overgegeven, spreekt de HEERE.", "Ps 69:26": "Hun paleis worde verwoest; in hun tenten zij geen inwoner.", "Matt 3:3": "Want deze is het, van wie gesproken is door Jesaja, de profeet, toen hij zei: De stem van hem die roept in de woestijn: Bereid de weg van de Heere, maak Zijn paden recht!", "Ezech 22:20": "Zoals zilver, of koper, of ijzer, of lood, of tin in het midden van een oven verzameld wordt, om het vuur daarover op te blazen, zodat men het smelt, zo zal Ik u verzamelen in Mijn toorn, en in Mijn grimmigheid daar laten liggen en smelten.", "Ps 65:7": "Die de bergen vastzet door Zijn kracht, omgord met macht.", "Hos 14:3": "Neem deze woorden met u, en bekeer u tot de Heere; zeg tegen Hem: Neem weg alle ongerechtigheid, en geef het goede, zo zullen wij betalen de stieren van onze lippen.", "Openb 6:12-14": "En ik zag, toen Het het zesde zegel geopend had, en zie, er werd een grote aardbeving; en de zon werd zwart als een haren zak, en de maan werd als bloed. En de sterren van de hemel vielen op de aarde, zoals een vijgenboom zijn onrijpe vijgen afwerpt, als hij door een grote wind geschud wordt. En de hemel is weggeweken, als een boek, dat opgerold wordt; en alle bergen en eilanden zijn bewogen uit hun plaatsen.", "Job 38:4-38": "Waar was u, toen Ik de aarde grondde? Geef het te kennen, indien u kloek van verstand bent. Wie heeft haar maten gezet, want u weet het; of wie heeft over haar een richtsnoer getrokken? Waarop zijn haar grondvesten neergezonken, of wie heeft haar hoeksteen gelegd?", "Ezech 18:4": "Zie, alle zielen zijn van Mij; zoals de ziel van de vader, zo is ook de ziel van de zoon van Mij; de ziel die zondigt, die zal sterven.", "Ezech 20:20": "En heiligt Mijn sabbatten, en zij zullen tot een teken zijn tussen Mij en u, opdat u weet dat Ik, de HEERE, uw God ben.", "Jes 58:13": "Als u uw voet van de sabbat afkeert, van het doen van uw eigen wil op Mijn heilige dag; en als u de sabbat een verlustiging noemt, opdat de HEERE geheiligd wordt, Die geëerd moet worden; en als u die eert, doordat u uw eigen wegen niet gaat, en uw eigen wil niet zoekt, noch een woord daarover spreekt;", "Gen 1:13": "Toen was het avond geweest en het was morgen geweest: de derde dag.", "Ps 104:7": "Van Uw dreigen vluchtten zij, zij haastten zich weg voor de stem van uw donder.", "Mark 10:6-8": "Maar van het begin van de schepping af heeft God hen man en vrouw gemaakt. Daarom zal een man zijn vader en zijn moeder verlaten, en zich aan zijn vrouw hechten; en die twee zullen tot één vlees zijn, zodat zij niet meer twee zijn, maar één vlees.", "Gen 21:12": "Maar God zei tegen Abraham: Laat het niet kwaad zijn in uw ogen vanwege de jongen en vanwege uw slavin; alles wat Sara tegen u zegt, luister naar haar stem; want in Izak zal uw nageslacht genoemd worden.", "Ezech 22:8": "Mijn heilige dingen hebt u veracht, en Mijn sabbatten hebt u ontheiligd.", "Ps 104:14": "Hij doet het gras uitspruiten voor de dieren, en het gewas tot dienst van de mens, zodat brood uit de aarde voortkomt.", "Ezech 3:18-20": "Als Ik tot de goddeloze zeg: U zult zeker sterven, en u waarschuwt hem niet, en spreekt niet, om de goddeloze van zijn goddeloze weg te waarschuwen, opdat u hem in het leven behoudt; die goddeloze zal in zijn ongerechtigheid sterven, maar zijn bloed zal Ik van uw hand eisen. Doch als u de goddeloze waarschuwt, en hij zich van zijn goddeloosheid en van zijn goddeloze weg niet bekeert, zal hij in zijn ongerechtigheid sterven; maar u hebt uw ziel bevrijd. Als ook een rechtvaardige zich van zijn gerechtigheid afkeert, en onrecht doet, en Ik een aanstoot voor zijn gezicht leg, zal hij sterven; omdat u hem niet gewaarschuwd hebt, zal hij in zijn zonde sterven, en zijn gerechtigheden, die hij gedaan heeft, zullen niet gedacht worden; maar zijn bloed zal Ik van uw hand eisen.", "Spr 18:3": "Als de goddeloze komt, komt ook de verachting, en met schande smaad.", "Spr 14:19": "De kwaden buigen neer voor de goeden, en de goddelozen voor de poorten van de rechtvaardige.", "Gen 4:12": "Als u de aardbodem bewerkt, zal hij u zijn opbrengst niet meer geven; u zult zwervend en dolend zijn op de aarde.", "Pred 3:21": "Wie merkt, dat de adem van de kinderen van de mensen opvaart naar boven, en de adem van de dieren naar beneden vaart in de aarde?", "Matt 15:4": "Want God heeft geboden en gezegd: Eer uw vader en moeder, en: Wie vader of moeder vervloekt, die zal de dood sterven.", "Hebr 8:5": "Deze priesters dienen het voorbeeld en de schaduw van de hemelse dingen, zoals Mozes door een goddelijke aanwijzing gewaarschuwd werd toen hij de tabernakel zou voltooien: Want, zegt Hij, zie erop toe dat u alles maakt naar het patroon dat u op de berg getoond is.", "Deut 11:8": "Houd dan alle geboden, die ik u heden gebied; opdat u sterk wordt en het land binnengaat, en het erft, waarheen u overtrekt, om dat te erven;", "Kol 1:22": "in het lichaam van Zijn vlees, door de dood, opdat Hij u heilig en onberispelijk en onbeschuldigbaar voor Zich zou stellen;", "Ps 139:14": "Ik loof U, omdat ik op een heel ontzagwekkende wijze wonderbaarlijk gemaakt ben; wonderlijk zijn Uw werken! Ook weet mijn ziel het zeer goed.", "Matt 25:41": "Dan zal Hij ook zeggen tegen hen die aan de linkerhand zijn: Ga weg van Mij, u vervloekten, in het eeuwige vuur, dat voor de duivel en zijn engelen bereid is.", "Rom 4:8": "Gelukkig is de man, aan wie de Heere de zonden niet toerekent.", "Gen 22:16": "En zei: Ik zweer bij Mijzelf, spreekt de HEERE; omdat u dit gedaan hebt, en uw zoon, uw enige, niet onthouden hebt;", "1 Kor 7:11": "En als zij toch scheidt, laat zij dan ongetrouwd blijven, of zich verzoenen met de man; en dat de man de vrouw niet verlaat.", "1 Petr 3:15": "maar heilig God, de Heere, in uw harten; en wees altijd bereid tot verantwoording aan ieder die u rekenschap vraagt van de hoop die in u is, met zachtmoedigheid en vreze,", "Hebr 10:5-7": "Daarom zegt Hij, bij Zijn komst in de wereld: Slachtoffer en offergave hebt U niet gewild, maar U hebt Mij een lichaam toebereid; Brandoffers en offers voor de zonde hebben U niet behaagd. Toen zei Ik: Zie, Ik kom (in het begin van het boek is over Mij geschreven) om Uw wil te doen, o God!", "Gen 22:17": "Voorzeker zal Ik u rijk zegenen, en uw nageslacht zeer talrijk maken, als de sterren van de hemel, en als het zand dat aan de oever van de zee is; en uw nageslacht zal de poort van zijn vijanden erfelijk bezitten.", "Rom 4:17": "(Zoals geschreven staat: Ik heb u tot een vader van veel volken gesteld) voor Hem, aan Wie hij geloofd heeft, namelijk God, Die de doden levend maakt, en de dingen die niet zijn roept alsof zij waren;", "1 Petr 3:1-7": "Evenzo, u vrouwen, wees uw eigen mannen onderdanig; opdat ook, als er sommigen zijn die het Woord ongehoorzaam zijn, zij door de wandel van de vrouwen zonder Woord gewonnen mogen worden; Als zij uw kuise wandel in vreze zullen hebben gezien. Laat uw versiering niet zijn de uiterlijke, bestaande in het vlechten van het haar, en het omhangen van goud, of het aantrekken van klederen;", "Pred 2:10": "En al wat mijn ogen begeerden, dat onthield ik hun niet; ik weerhield mijn hart niet van enige blijdschap, maar mijn hart was blij vanwege al mijn arbeid; en dit was mijn deel van al mijn arbeid.", "Gen 3:16-19": "Tegen de vrouw zei Hij: Ik zal uw smart zeer vermeerderen, namelijk de smart van uw zwangerschap; met smart zult u kinderen baren; en naar uw man zal uw begeerte uitgaan, en hij zal over u heersen. En tegen Adam zei Hij: Omdat u geluisterd hebt naar de stem van uw vrouw, en van die boom hebt gegeten waarvan Ik u geboden had: Daarvan zult u niet eten; is het aardrijk vervloekt om u; en met smart zult u daarvan eten, alle dagen van uw leven. Ook zal het u doornen en distels laten opgroeien, en u zult het gewas van het veld eten.", "Spr 22:29": "Hebt u een man gezien die vaardig is in zijn werk? Hij zal voor koningen komen te staan; hij zal niet voor onaanzienlijke mensen staan.", "Ex 33:19": "Doch Hij zei: Ik zal al Mijn goedheid voorbij uw aangezicht laten gaan, en zal de Naam van de HEERE uitroepen voor uw aangezicht; maar Ik zal genadig zijn aan wie Ik genadig zal zijn, en Ik zal Mij ontfermen over wie Ik Mij ontfermen zal.", "Gen 6:3": "Toen zei de HEERE: Mijn Geest zal niet in eeuwigheid twisten met de mens, omdat hij ook vlees is; doch zijn dagen zullen honderdtwintig jaren zijn.", "Ex 20:12": "Eer uw vader en uw moeder, opdat uw dagen verlengd worden in het land dat de HEERE, uw God, u geeft.", "Kol 3:18": "Vrouwen, wees uw eigen mannen onderdanig, zoals het betaamt in de Heere.", "2 Tim 1:10": "Doch nu geopenbaard is door de verschijning van onze Zaligmaker Jezus Christus, Die de dood tenietgedaan heeft, en het leven en de onvergankelijkheid aan het licht gebracht heeft door het Evangelie;", "Mark 10:2-12": "En de Farizeeën kwamen naar Hem toe, en vroegen Hem of het een man geoorloofd is zijn vrouw te verlaten, om Hem op de proef te stellen. Maar Hij antwoordde en zei tegen hen: Wat heeft Mozes u geboden? En zij zeiden: Mozes heeft toegestaan een scheidbrief te schrijven, en haar te verlaten.", "Matt 19:2-9": "En veel menigten volgden Hem, en Hij genas ze daar. En de Farizeeën kwamen naar Hem toe, en verzochten Hem, en zeiden tegen Hem: Is het een mens geoorloofd zijn vrouw te verlaten, om allerlei reden? Maar Hij antwoordde en zei tegen hen: Hebt u niet gelezen dat Hij Die van het begin de mens gemaakt heeft, hen gemaakt heeft man en vrouw?", "Jes 33:11": "U gaat met stro zwanger, u zult stoppels baren; uw geest zal u als vuur verslinden.", "Hand 7:50": "Heeft Mijn hand niet al deze dingen gemaakt?", "Ex 9:16": "Maar juist daarom heb Ik u laten opstaan, opdat Ik Mijn kracht aan u zou tonen, en opdat men Mijn Naam vertelt op de hele aarde.", "Gen 9:16": "Als deze boog in de wolken zal zijn, dan zal Ik hem aanzien, om te gedenken aan het eeuwige verbond tussen God en tussen alle levende ziel, van alle vlees, dat op de aarde is.", "Luk 20:37": "En dat de doden opgewekt zullen worden, heeft ook Mozes aangewezen bij de doornstruik, toen hij de Heere de God van Abraham noemt, en de God van Izak, en de God van Jakob.", "Zach 9:9": "Verheug u zeer, dochter van Sion! Juich, dochter van Jeruzalem! Zie, uw Koning zal tot u komen, rechtvaardig, en Hij is een Heiland; arm, en rijdend op een ezel, en op een veulen, het jong van de ezelinnen.", "2 Kor 6:18": "en Ik zal u tot een Vader zijn, en u zult Mij tot zonen en dochters zijn, zegt de Heere, de Almachtige.", "Ps 69:24": "Laat hun ogen duister worden, dat zij niet zien; en doe hun heupen voortdurend waggelen.", "Ef 5:28-31": "Zo zijn de mannen verplicht hun eigen vrouwen lief te hebben, zoals hun eigen lichamen. Wie zijn eigen vrouw liefheeft, die heeft zichzelf lief. Want niemand heeft ooit zijn eigen vlees gehaat, maar hij voedt het, en verzorgt het, zoals ook de Heere de Gemeente. Want wij zijn leden van Zijn lichaam, van Zijn vlees en van Zijn benen.", "Mark 4:25": "Want wie heeft, aan hem zal gegeven worden; en wie niet heeft, van hem zal ook afgenomen worden wat hij heeft.", "Ps 118:26": "Gezegend is hij die daar komt in de Naam van de HEERE! Wij zegenen u uit het huis van de HEERE.", "Jes 10:23": "Want een verdelging, die vast besloten is, zal de Heere HEERE van de heerscharen doen in het midden van dit hele land.", "Joh 10:34": "Jezus antwoordde hun: Staat er niet geschreven in uw wet: Ik heb gezegd, u bent goden?", "Ps 68:7": "Een God, Die de eenzamen zet in een gezin, uitleidt wie in boeien gevangen zitten; maar de afvalligen wonen in het dorre land.", "Ps 2:5": "Dan zal Hij tot hen spreken in Zijn toorn, en in Zijn grimmigheid zal Hij hen verschrikken.", "Matt 19:3-9": "En de Farizeeën kwamen naar Hem toe, en verzochten Hem, en zeiden tegen Hem: Is het een mens geoorloofd zijn vrouw te verlaten, om allerlei reden? Maar Hij antwoordde en zei tegen hen: Hebt u niet gelezen dat Hij Die van het begin de mens gemaakt heeft, hen gemaakt heeft man en vrouw? En gezegd heeft: Daarom zal een mens vader en moeder verlaten, en zal zijn vrouw aanhangen, en die twee zullen tot één vlees zijn?", "Ex 2:13": "De volgende dag ging hij er weer op uit, en zie, twee Hebreeuwse mannen waren aan het vechten; en hij zei tegen degene die ongelijk had: Waarom slaat u uw naaste?", "Jes 8:18": "Zie, ik en de kinderen die de HEERE mij gegeven heeft, zijn tot tekenen en tot wonderen in Israël, van de HEERE van de heerscharen, Die op de berg Sion woont.", "Ps 18:9-16": "Rook ging op van Zijn neus, en een vuur uit Zijn mond verteerde; kolen werden daarvan aangestoken. En Hij boog de hemel, en daalde neer, en donkerheid was onder Zijn voeten. En Hij voer op een cherub, en vloog; ja, Hij vloog snel op de vleugels van de wind.", "Luk 12:47": "En die dienstknecht die de wil van zijn heer geweten heeft, en zich niet klaargemaakt heeft, en ook niet naar zijn wil gehandeld heeft, die zal met veel slagen geslagen worden.", "Job 8:22": "Wie u haten, zullen met schaamte bekleed worden; en de tent van de goddelozen zal er niet meer zijn.", "Hebr 4:7": "bepaalt Hij opnieuw een zekere dag, namelijk heden, doordat Hij door David zegt, zo lange tijd daarna (zoals gezegd is): Heden, als u Zijn stem hoort, verhard dan uw harten niet.", "1 Kor 3:17": "Als iemand de tempel van God schendt, die zal God schenden; want de tempel van God is heilig, en dat bent u.", "2 Kron 36:21": "Opdat het woord van de HEERE vervuld werd, door de mond van Jeremia, totdat het land aan zijn sabbatten een welgevallen had; het rustte al de dagen van de verwoesting, totdat de zeventig jaren vervuld waren.", "1 Sam 20:31": "Want alle dagen dat de zoon van Isaï op de aardbodem leeft, zult u noch uw koninkrijk bevestigd worden; nu dan, stuur iemand heen, en haal hem tot mij, want hij is een kind van de dood.", "Rom 11:27": "En dit is hun een verbond van Mij, als Ik hun zonden zal wegnemen.", "Rom 7:10-13": "En het gebod, dat tot leven bedoeld was, dat bleek voor mij tot de dood te leiden. Want de zonde nam de gelegenheid door het gebod, heeft mij verleid, en heeft mij daardoor gedood. Zo is dan de wet heilig, en het gebod is heilig, en rechtvaardig, en goed.", "Ezech 18:1-32": "Verder kwam het woord van de HEERE tot mij en Hij zei: Wat is er met u, dat u dit spreekwoord gebruikt over het land Israël, en zegt: De vaders hebben onrijpe druiven gegeten, en de tanden van de kinderen zijn stomp geworden? Zo waarachtig als Ik leef, spreekt de Heere HEERE, u zult geen aanleiding meer hebben om dit spreekwoord in Israël te gebruiken!", "Jes 11:10": "Want het zal gebeuren op die dag, dat de heidenen zullen vragen naar de Wortel van Isaï, Die zal staan als een banier voor de volken, en Zijn rust zal heerlijk zijn.", "Gen 31:14": "Toen antwoordden Rachel en Lea, en zeiden tegen hem: Is er nog een deel of erfenis voor ons, in het huis van onze vader?", "Ex 35:2": "Zes dagen zal men het werk doen; maar op de zevende dag zal het voor u heiligheid zijn, een sabbat van rust voor de HEERE; ieder die daarop werk doet, zal gedood worden.", "Ps 95:11": "Daarom heb Ik in Mijn toorn gezworen: Zij zullen in Mijn rust niet ingaan!", "Deut 31:29": "Want ik weet dat u na mijn dood zeker helemaal zult verdorven raken, en afwijken van de weg die ik u geboden heb; dan zal dit kwaad u in de laatste dagen overkomen, wanneer u zult hebben gedaan wat kwaad is in de ogen van de HEERE, om Hem door het werk van uw handen tot toorn te verwekken.", "Gen 18:21": "Zal Ik nu afgaan en zien of zij naar hun geroep, dat tot Mij gekomen is, het uiterste gedaan hebben, en zo niet, Ik zal het weten.", "Ef 5:5": "Want dit weet u, dat geen hoereerder, of onreine, of hebzuchtige, die een afgodendienaar is, erfenis heeft in het Koninkrijk van Christus en van God.", "Ps 59:9": "Maar U, HEERE, zult hen belachen; U zult alle heidenen bespotten.", "Ps 49:10": "dat hij ook voortaan voor altijd zou leven, en de vergankelijkheid niet zien.", "Pred 3:20": "Zij gaan allen naar één plaats; zij zijn allen uit het stof, en zij keren allen terug tot het stof.", "Jes 11:1": "Want er zal een Rijsje voortkomen uit de afgehouwen tronk van Isaï, en een Scheut uit zijn wortels zal vrucht voortbrengen.", "1 Petr 2:24": "Die Zelf onze zonden in Zijn lichaam gedragen heeft op het hout; opdat wij, voor de zonden afgestorven, voor de gerechtigheid zouden leven; door Wiens striemen u genezen bent.", "Matt 2:15": "en hij was daar tot de dood van Herodes; opdat vervuld zou worden wat door de Heere gesproken is door de profeet: Uit Egypte heb Ik Mijn Zoon geroepen.", "Ps 95:4": "In Wiens hand de diepste plaatsen van de aarde zijn, en de hoogten van de bergen zijn van Hem;", "Pred 11:4": "Wie op de wind let, die zal niet zaaien, en wie op de wolken ziet, die zal niet maaien.", "Ps 148:6": "En Hij heeft ze bevestigd voor altijd, in eeuwigheid; Hij heeft hun een orde gegeven, die niemand van hen zal overtreden.", "Jer 10:16": "Jakobs deel is niet gelijk die, want Hij is de Formeerder van alles, en Israël is de roede van Zijn erfenis; HEERE van de heerscharen is Zijn Naam.", "Ps 82:6": "Ik heb wel gezegd: U bent goden; en u bent allen kinderen van de Allerhoogste;", "Openb 9:4-6": "En hun werd gezegd, dat zij het gras van de aarde niet zouden beschadigen, ook geen groente, ook geen boom, dan de mensen alleen, die het zegel van God niet aan hun voorhoofden hebben. En hun werd macht gegeven, niet dat zij hen zouden doden, maar dat zij door hen gepijnigd zouden worden vijf maanden; en hun pijniging was als de pijniging van een schorpioen, wanneer hij een mens gestoken heeft. En in die dagen zullen de mensen de dood zoeken, en zullen die niet vinden; en zij zullen ernaar verlangen te sterven, en de dood zal van hen wegvluchten.", "Deut 7:12-26": "Dan zal het gebeuren, omdat u deze rechten zult horen, en houden, en die doen, dat de HEERE, uw God, voor u het verbond en de goedertierenheid zal houden, die Hij uw vaderen gezworen heeft; en Hij zal u liefhebben, en zal u zegenen, en u meer maken; en Hij zal de vrucht van uw buik zegenen, en de vrucht van uw land, uw koren, en uw most, en uw olie, de nakomelingen van uw koeien, en de kudden van uw kleinvee, in het land dat Hij uw vaderen gezworen heeft aan u te geven. Gezegend zult u zijn boven alle volken; er zal onder u geen man of vrouw onvruchtbaar zijn, ook niet onder uw beesten;", "Mark 12:1-9": "En Hij begon door gelijkenissen tegen hen te spreken: Een man plantte een wijngaard, en zette er een omheining omheen, en groef een wijnpersbak, en bouwde een toren, en verhuurde hem aan de wijnbouwers, en reisde naar het buitenland. En toen het de tijd was, stuurde hij een dienaar naar de wijnbouwers, opdat hij van de wijnbouwers iets van de vrucht van de wijngaard zou ontvangen. Maar zij grepen hem, en sloegen hem, en stuurden hem met lege handen weg.", "1 Petr 3:12": "Want de ogen van de Heere zijn over de rechtvaardigen, en Zijn oren gericht op hun gebed; maar het aangezicht van de Heere is tegen hen die kwaad doen.", "Spr 19:14": "Huis en bezit zijn een erfdeel van de vaderen; maar een verstandige vrouw is van de HEERE.", "Ezech 20:16": "Omdat zij Mijn rechten verwierpen, en in Mijn inzettingen niet wandelden, en Mijn sabbatten ontheiligden; want hun hart ging hun drekgoden achterna.", "Job 8:21": "totdat Hij uw mond met gelach vervult, en uw lippen met gejuich.", "Mark 8:36": "Want wat zou het de mens baten als hij de hele wereld zou winnen, en schade zou lijden aan zijn ziel?", "Ps 37:3": "Beth. Vertrouw op de HEERE, en doe het goede; bewoon de aarde, en voed u met trouw.", "Gen 28:20": "En Jakob deed een gelofte, en zei: Wanneer God met mij geweest zal zijn, en mij behoed zal hebben op deze weg die ik reis, en mij brood gegeven zal hebben om te eten, en kleren om aan te trekken;", "Klaagl 4:22": "Thau. Uw ongerechtigheid heeft een einde, o dochter van Sion! Hij zal u niet meer gevangen laten wegvoeren; maar uw ongerechtigheid, o dochter van Edom! zal Hij bezoeken; Hij zal uw zonden aan het licht brengen.", "Job 38:22": "Bent u gekomen tot de schatkamers van de sneeuw, en hebt u de schatkamers van de hagel gezien?", "Ps 104:3": "Die Zijn opperzalen bouwt op de wateren, Die van de wolken Zijn wagen maakt, Die op de vleugels van de wind wandelt.", "Jes 29:10": "Want de HEERE heeft over u uitgegoten een geest van diepe slaap, en Hij heeft uw ogen dichtgesloten; de profeten, en uw hoofden, en de zieners heeft Hij verblind.", "Pred 11:3": "Als de wolken vol geworden zijn, storten zij plasregen uit op de aarde; en als de boom naar het zuiden, of als hij naar het noorden valt, op de plaats waar de boom valt, daar zal hij blijven liggen.", "Gen 3:17": "En tegen Adam zei Hij: Omdat u geluisterd hebt naar de stem van uw vrouw, en van die boom hebt gegeten waarvan Ik u geboden had: Daarvan zult u niet eten; is het aardrijk vervloekt om u; en met smart zult u daarvan eten, alle dagen van uw leven.", "Job 27:3": "Zo lang als mijn adem in mij zal zijn, en het geblaas van God in mijn neus;", "Amos 9:1-5": "Ik zag de Heere staan op het altaar, en Hij zei: Sla die knop, zodat de posten beven, en kloof ze allen in het hoofd; en Ik zal hun achterste met het zwaard doden; wie van hen probeert te vluchten, zal niet ontkomen, en wie van hen probeert te ontkomen, zal niet gered worden. Al groeven zij tot in het graf, dan zal Mijn hand ze vandaar halen, en al klommen zij in de hemel, dan zal Ik ze vandaar doen neerdalen. En al verstopten zij zich op de top van de Karmel, dan zal Ik ze opsporen en vandaar halen; en al verborgen zij zich voor Mijn ogen op de bodem van de zee, dan zal Ik vandaar de slang gebieden, die zal ze bijten.", "Luk 6:49": "Maar wie het gehoord heeft en het niet gedaan heeft, is als een mens die een huis bouwde op de aarde zonder fundament; de waterstroom sloeg ertegen aan, en het viel meteen om, en de val van dat huis was groot.", "Ef 5:33": "Kortom, ieder van u afzonderlijk moet zijn eigen vrouw zo liefhebben als zichzelf; en laat de vrouw erop letten dat zij haar man vreest.", "Ps 72:16": "Is er een handvol koren in het land op de hoogte van de bergen, de vrucht daarvan zal ruisen als de Libanon; en die van de stad zullen bloeien als het kruid van de aarde.", "Jes 55:3": "Neig uw oor, en kom tot Mij, hoor en uw ziel zal leven; want Ik zal met u een eeuwig verbond maken, en u geven de zekere weldaden van David.", "Job 5:13": "Hij vangt de wijzen in hun arglistigheid; zodat de raad van de verdraaiden overhaast valt.", "Ps 94:11": "De HEERE kent de gedachten van de mens, dat zij vluchtig zijn.", "Job 38:8-11": "Of wie heeft de zee met deuren toegesloten, toen zij uitbrak, en uit de baarmoeder voortkwam? Toen Ik de wolk tot haar kleding stelde, en de donkerheid tot haar windeldoek; Toen Ik voor haar met Mijn besluit de aarde doorbrak, en grendel en deuren zette;", "Ps 2:1": "Waarom woeden de heidenen, en bedenken de volken iets zinloos?", "Joh 12:15": "Vrees niet, dochter van Sion, zie, uw Koning komt, zittend op het veulen van een ezelin.", "Job 27:20": "Verschrikkingen zullen hem als water aangrijpen; 's nachts zal hem een wervelwind wegstelen.", "Jes 50:3": "Ik bekleed de hemel met zwartheid, en maak een zak tot zijn bedekking.", "2 Petr 2:17": "Dezen zijn waterloze bronnen, wolken die door een storm worden voortgedreven; voor hen is de donkerheid van de duisternis voor eeuwig bewaard.", "Ps 90:3": "U doet de mens wederkeren tot verbrijzeling, en zegt: Keer weder, mensenkinderen!", "Luk 3:17": "Zijn wan is in Zijn hand, en Hij zal Zijn dorsvloer grondig reinigen, en de tarwe zal Hij in Zijn schuur samenbrengen; maar het kaf zal Hij met onblusbaar vuur verbranden.", "Ex 31:17": "Hij zal tussen Mij en tussen de kinderen van Israël een teken in eeuwigheid zijn; omdat de HEERE, in zes dagen, de hemel en de aarde gemaakt heeft, en op de zevende dag gerust heeft en Zich verkwikt heeft.", "Jer 5:22": "Zult u Mij niet vrezen? spreekt de HEERE; zult u voor Mijn aangezicht niet beven? Ik heb het zand tot een grens voor de zee gesteld, met een eeuwige verordening, zodat zij daar niet overheen zal gaan; al bewegen haar golven zich, toch zullen zij niets vermogen, al bruisen zij, toch zullen zij daar niet overheen gaan.", "Job 33:14-30": "Maar God spreekt eens of tweemaal; doch men let daar niet op. In de droom, door het gezicht 's nachts, als een diepe slaap op de mensen valt, in de sluimering op het leger; Dan openbaart Hij het voor het oor der mensen, en Hij verzegelt hun kastijding;", "Hand 2:19": "En Ik zal wonderen geven in de hemel boven, en tekenen op de aarde beneden: bloed en vuur en rookwalm.", "Spr 10:6-8": "Zegeningen zijn op het hoofd van de rechtvaardige; maar het geweld bedekt de mond van de goddelozen. De gedachtenis aan de rechtvaardige zal tot zegening zijn; maar de naam van de goddelozen zal wegrotten. Wie wijs van hart is, neemt de geboden aan; maar wie dwaas is van lippen, zal ten val komen.", "Pred 12:5": "Ook wanneer zij bang zullen zijn voor de hoogte, en er verschrikkingen zullen zijn op de weg, en de amandelboom zal bloeien, en de sprinkhaan zichzelf een last zal zijn, en het verlangen zal vergaan; want de mens gaat naar zijn eeuwig huis, en de rouwklagers zullen in de straat rondgaan.", "Ezech 36:35": "En zij zullen zeggen: Dit land, dat verwoest was, is geworden als een hof van Eden; en de eenzame en de verwoeste en verstoorde steden zijn versterkt en bewoond.", "Ps 118:22": "De steen, die de bouwlieden verworpen hadden, is tot een hoofd van de hoek geworden.", "Ps 37:1": "Een psalm van David. Aleph. Wind u niet op over de boosdoeners; benijd hen niet die onrecht doen.", "Zach 3:7": "Zo zegt de HEERE van de heerscharen: Als u in Mijn wegen wandelt, en als u Mijn wacht waarneemt, dan zult u ook Mijn huis richten, en ook Mijn voorhoven bewaren; en Ik zal u wandelingen geven onder dezen, die hier staan.", "Matt 1:23": "Zie, de maagd zal zwanger worden en een Zoon baren, en u zult Hem de naam Emmanuel geven; dat betekent, vertaald: God met ons.", "Ex 40:9-15": "Dan zult u de zalfolie nemen en de tabernakel zalven, en alles wat daarin is; en u zult dezelf heiligen, met al zijn gereedschap, en het zal heilig zijn. U zult ook het altaar van het brandoffer zalven, en al zijn gereedschap; en u zult het altaar heiligen, en het altaar zal allerheiligst zijn. Dan zult u het wasvat zalven, en zijn voetstuk; en u zult het heiligen.", "1 Tim 5:24": "Van sommige mensen zijn de zonden al vooraf openbaar, en gaan vooruit tot hun veroordeling; en bij sommigen komen zij later aan het licht.", "Hos 10:8": "En de hoogten van Aven, Israëls zonde, zullen vernietigd worden; doorns en distels zullen op hun altaren opkomen; en zij zullen tegen de bergen zeggen: Bedek ons! en tegen de heuvels: Val op ons!", "Openb 9:15": "En de vier engelen zijn losgemaakt, die gereed waren gehouden tegen het uur, en dag, en maand, en jaar, opdat zij het derde deel van de mensen zouden doden.", "Spr 30:4": "Wie is naar de hemel opgeklommen, en neergedaald? Wie heeft de wind in Zijn vuisten verzameld? Wie heeft de wateren in een kleed gebonden? Wie heeft alle einden van de aarde vastgesteld? Hoe is Zijn Naam, en hoe is de Naam van Zijn Zoon, als u het weet?", "Num 16:22": "Maar zij vielen op hun aangezichten, en zeiden: O God! God van de geesten van alle vlees! Zal één man zondigen, en zult U op deze hele vergadering hevig toornig worden?", "Ps 21:4-6": "Want U komt hem voor met zegeningen van het goede; op zijn hoofd zet U een kroon van fijn goud. Het leven heeft hij van U begeerd. U hebt het hem gegeven; lengte van dagen, eeuwig en altoos. Groot is zijn eer door Uw heil; majesteit en heerlijkheid hebt U hem toegevoegd.", "Matt 7:13": "Ga in door de nauwe poort; want wijd is de poort, en breed is de weg die naar het verderf leidt, en velen zijn er die daardoor ingaan.", "Openb 14:9-11": "En een derde engel is hen gevolgd, die met luide stem zei: Als iemand het beest aanbidt en zijn beeld, en het merkteken ontvangt aan zijn voorhoofd, of aan zijn hand, die zal ook drinken uit de wijn van de toorn van God, die onvermengd ingeschonken is in de drinkbeker van Zijn toorn; en hij zal gepijnigd worden met vuur en zwavel voor de heilige engelen en voor het Lam. En de rook van hun pijniging gaat op tot in alle eeuwigheid, en zij hebben geen rust, dag en nacht, zij die het beest aanbidden en zijn beeld, en zo iemand het merkteken van zijn naam ontvangt.", "Gen 3:3-6": "Maar van de vrucht van de boom die in het midden van de hof staat, heeft God gezegd: U zult daarvan niet eten, en u zult die ook niet aanraken, anders sterft u. Toen zei de slang tegen de vrouw: U zult zeker niet sterven; Maar God weet dat, op de dag dat u daarvan eet, uw ogen geopend zullen worden, en u als God zult zijn, kennend het goed en het kwaad.", "Jes 40:3": "Een stem van iemand die roept in de woestijn: Bereidt de weg van de HEERE, maakt recht in de wildernis een baan voor onze God!", "Ezech 13:17-23": "En u, mensenkind, zet uw gezicht tegen de dochters van uw volk, die profeteren uit hun eigen hart, en profeteer tegen hen; En zeg: Zo zegt de Heere HEERE: Wee over die vrouwen, die kussens naaien voor alle oksels van de armen, en hoofddeksels maken voor het hoofd van elke lengte, om de zielen te vangen! Zult u de zielen van Mijn volk vangen, en zult u voor uzelf de zielen in leven houden? En zult u Mij ontheiligen bij Mijn volk, voor handvollen gerst en voor stukken brood, om zielen te doden die niet zouden sterven, en om zielen in leven te houden die niet zouden leven, door uw liegen tegen Mijn volk, dat de leugen hoort?", "Matt 27:45": "En van het zesde uur af kwam er duisternis over het hele land, tot het negende uur toe.", "Openb 16:21": "En een grote hagel, elke hagelsteen ongeveer een talent zwaar, viel neer uit de hemel op de mensen; en de mensen lasterden God vanwege de plaag van de hagel; want die plaag was zeer groot.", "Matt 8:17": "opdat vervuld zou worden wat gesproken was door de profeet Jesaja, die zei: Hij heeft onze ziekten op Zich genomen, en onze kwalen gedragen.", "2 Kon 19:15": "En Hizkia bad voor het aangezicht van de HEERE, en zei: HEERE, God van Israël, Die tussen de cherubs¹ woont! U zelf, U alleen bent de God van alle koninkrijken van de aarde, U hebt de hemel en de aarde gemaakt.", "Spr 11:31": "Zie, de rechtvaardige wordt vergolden op de aarde, hoeveel te meer de goddeloze en de zondaar!", "Hand 2:25-28": "Want David zegt van Hem: Ik zag de Heere altijd voor mij; want Hij is aan mijn rechterhand, opdat ik niet bewogen zou worden. Daarom is mijn hart verblijd, en mijn tong verheugt zich; ja, ook mijn vlees zal rusten in hoop; Want U zult mijn ziel niet verlaten in het rijk van de dood, en Uw Heilige zult U niet overgeven om verderving te zien.", "Matt 16:3": "en 's morgens: Vandaag onweer; want de hemel is somber rood. Huichelaars! Het uiterlijk van de hemel weet u wel te onderscheiden, maar kunt u de tekenen van de tijden niet onderscheiden?", "1 Petr 3:10-12": "Want wie het leven wil liefhebben en goede dagen wil zien, die moet zijn tong weerhouden van het kwade, en zijn lippen, zodat ze geen bedrog spreken; hij moet wijken van het kwade en het goede doen; hij moet vrede zoeken en die najagen. Want de ogen van de Heere zijn over de rechtvaardigen, en Zijn oren gericht op hun gebed; maar het aangezicht van de Heere is tegen hen die kwaad doen.", "Pred 9:6": "Ook zijn hun liefde, hun haat en hun jaloezie al vergaan; en zij hebben geen deel meer in deze wereld, in alles wat er onder de zon gebeurt.", "Hand 7:7": "En het volk dat zij zullen dienen, zal Ik oordelen, zei God; en daarna zullen zij uitgaan, en zij zullen Mij dienen op deze plaats.", "Jes 6:9": "Toen zei Hij: Ga heen, en zeg tegen dit volk: Blijf horen, maar begrijp het niet, en blijf zien, maar merk het niet op.", "Hebr 4:3": "Want wij die geloofd hebben, gaan de rust in, zoals Hij gezegd heeft: Zo heb Ik dan in Mijn toorn gezworen: Zij zullen Mijn rust niet ingaan! Hoewel Zijn werken al vanaf de grondlegging van de wereld volbracht waren.", "Hand 13:14": "En zij trokken van Perge het land door, en kwamen te Antiochië, een stad in Pisidië; en gingen op de dag van de sabbat de synagoge in, en gingen zitten.", "Hand 14:15": "Mannen, waarom doet u deze dingen? Ook wij zijn mensen net als u, en wij verkondigen u dat u zich van deze nutteloze dingen zou bekeren tot de levende God, Die de hemel, en de aarde, en de zee, en alles wat daarin is, gemaakt heeft;", "Job 38:36": "Wie heeft de wijsheid in het binnenste gezet? Of wie heeft de zin het verstand gegeven?", "Zach 13:7": "Zwaard! Word wakker tegen Mijn Herder, en tegen de Man Die Mijn Metgezel is, spreekt de HEERE van de heerscharen; sla die Herder, en de schapen zullen verstrooid worden; maar Ik zal Mijn hand tot de kleinen wenden.", "Lev 26:14-39": "Maar als u Mij niet zult horen, en al deze geboden niet zult doen; En als u Mijn inzettingen smadelijk verwerpt, en als uw ziel van Mijn rechten walgt, zodat u niet al Mijn geboden doet, om Mijn verbond te vernietigen; Dan zal Ik u dit ook doen: Ik zal over u schrik stellen, tering en koorts, die de ogen verteren en de ziel pijnigen; u zult ook uw zaad tevergeefs zaaien, en uw vijanden zullen dat opeten.", "Spr 16:4": "De HEERE heeft alles gemaakt om Zichzelf; ja, ook de goddeloze tot de dag van het kwaad.", "1 Kon 9:4": "En als u voor Mijn aangezicht wandelt, zoals uw vader David gewandeld heeft, met een volkomen hart, en met oprechtheid, om te doen naar alles wat Ik u geboden heb, en Mijn inzettingen en Mijn rechten houdt;", "Jer 5:24": "En zij zeggen niet in hun hart: Laten wij nu de HEERE, onze God, vrezen, Die de regen geeft, zowel de vroege regen als de late regen, op Zijn tijd; Die voor ons de weken, de vastgestelde tijden van de oogst, bewaart.", "Deut 17:3": "Doordat hij heengaat en andere goden dient, en zich voor die buigt, of voor de zon, of voor de maan, of voor het hele leger van de hemel, wat ik niet geboden heb;", "1 Tim 2:13": "Want Adam is eerst gemaakt, daarna Eva.", "Ef 4:25": "Daarom, leg de leugen af, en spreek de waarheid, ieder met zijn naaste; want wij zijn elkaars leden.", "Luk 7:27": "Deze is het, over wie geschreven is: Zie, Ik zend Mijn engel voor Uw aangezicht uit, die Uw weg voor U klaar zal maken.", "Ps 97:7": "Beschaamd moeten worden allen die de beelden dienen, die zich op afgoden beroemen; buig u neer voor Hem, alle goden!", "Lev 23:27-32": "Maar op de tiende van deze zevende maand zal de verzoendag zijn, een heilige samenkomst zult u hebben; dan zult u uw zielen verootmoedigen, en zult de HEERE een vuuroffer offeren. En op diezelfde dag zult u geen werk doen; want het is de verzoendag, om over u verzoening te doen voor het aangezicht van de HEERE, uw God. Want elke ziel, die op diezelfde dag niet verootmoedigd zal zijn geweest, die zal uitgeroeid worden uit haar volk.", "Rom 9:26": "En het zal zijn: op de plaats waar tot hen gezegd was: U bent Mijn volk niet, daar zullen zij kinderen van de levende God genoemd worden.", "Hos 12:15": "Efraïm daarentegen heeft Hem zeer bitter vertoornd; daarom zal Hij zijn bloed op hem laten komen, en zijn Heere zal hem zijn smaad vergelden.", "Mark 12:26": "Maar wat de doden betreft, dat zij opgewekt zullen worden: hebt u niet gelezen in het boek van Mozes, hoe God in de doornstruik tot hem gesproken heeft: Ik ben de God van Abraham, en de God van Izak, en de God van Jakob?", "Deut 21:23": "Dan zal zijn dode lichaam niet aan het hout overnachten; maar u zult hem beslist diezelfde dag begraven; want een opgehangene is door God vervloekt. Zo zult u uw land niet verontreinigen, dat de HEERE, uw God, u als erfdeel geeft.", "Gen 3:10": "En hij zei: Ik hoorde Uw stem in de hof, en ik werd bang, want ik ben naakt; daarom verborg ik mij.", "Spr 3:18": "Zij is een boom van het leven voor hen die haar aangrijpen, en ieder die haar vasthoudt, wordt gelukkig.", "Job 7:1": "Heeft de mens niet een strijd op de aarde, en zijn zijn dagen niet als de dagen van de dagloner?", "Hebr 2:8": "Alle dingen hebt U onder zijn voeten onderworpen. Want doordat Hij hem alle dingen onderworpen heeft, heeft Hij niets overgelaten dat hem niet onderworpen is; maar nu zien wij nog niet dat hem alle dingen onderworpen zijn;", "Hebr 1:13": "En tegen wie van de engelen heeft Hij ooit gezegd: Zit aan Mijn rechterhand, totdat Ik Uw vijanden tot een voetbank van Uw voeten gezet heb?", "Deut 30:19": "Ik neem heden tegen u de hemel en de aarde tot getuigen; het leven en de dood heb ik u voorgesteld, de zegen en de vloek! Kies dan het leven, opdat u leeft, u en uw nageslacht;", "1 Kor 12:24": "Terwijl onze sierlijke leden dat niet nodig hebben; maar God heeft het lichaam zo samengevoegd, dat Hij overvloediger eer geeft aan wat tekortkomt,", "Pred 3:19-21": "Want wat de kinderen van de mensen overkomt, dat overkomt ook de dieren; en hetzelfde overkomt hun beiden; zoals die sterft, zo sterft deze, en zij hebben allen dezelfde adem, en de meerderheid van de mensen boven de dieren is er niet; want allen zijn zij vluchtigheid. Zij gaan allen naar één plaats; zij zijn allen uit het stof, en zij keren allen terug tot het stof. Wie merkt, dat de adem van de kinderen van de mensen opvaart naar boven, en de adem van de dieren naar beneden vaart in de aarde?", "Openb 9:2": "En zij heeft de put van het afgrond geopend; en er is rook opgegaan uit de put, als rook van een grote oven; en de zon en de lucht is verduisterd geworden van de rook van de put.", "Gen 8:22": "Voortaan, al de dagen van de aarde, zullen zaaiing en oogst, en koude en hitte, en zomer en winter, en dag en nacht niet ophouden.", "Ps 22:19": "Zij delen mijn kleren onder zich, en werpen het lot over mijn gewaad.", "Openb 3:3": "Bedenk dan hoe u het ontvangen en gehoord hebt, en bewaar het, en bekeer u. Als u dan niet waakt, zal Ik over u komen als een dief, en u zult niet weten op welk uur Ik over u komen zal.", "Matt 24:50": "dan zal de heer van die dienstknecht komen op een dag waarop hij hem niet verwacht, en op een uur dat hij niet weet;", "Pred 2:14-18": "De ogen van de wijze staan in zijn hoofd, maar de dwaas wandelt in de duisternis. Toen merkte ik ook op dat één en hetzelfde lot hun allen treft. Daarom zei ik in mijn hart: Zoals het de dwaas vergaat, zal het ook mij vergaan; waarom heb ik dan toen meer naar wijsheid gestreefd? Toen sprak ik in mijn hart, dat ook dat ijdelheid was. Want er zal in eeuwigheid niet meer herinnering aan een wijze zijn dan aan een dwaas; aangezien wat nu is, in de toekomstige dagen helemaal vergeten wordt; en hoe sterft de wijze? Net als de dwaas.", "1 Kor 6:10": "Vergis u niet; hoereerders, afgodendienaars, overspelers, ontuchtigen, mannen die bij mannen liggen, dieven, hebzuchtigen, dronkaards, geen lasteraars, geen rovers, zullen het Koninkrijk van God beërven.", "Jer 13:14": "En Ik zal hen tegen elkaar te pletter slaan, de een tegen de ander, zowel de vaders als de kinderen samen, spreekt de HEERE; Ik zal geen medelijden hebben, en niet sparen, en Mij niet ontfermen, zodat Ik hen zal verderven.", "Joh 9:1-34": "Toen Hij voorbijging, zag Hij een man die blind was van zijn geboorte af. En Zijn discipelen vroegen Hem: Rabbi, wie heeft er gezondigd, deze man of zijn ouders, dat hij blind geboren zou worden? Jezus antwoordde: Deze man heeft niet gezondigd, en zijn ouders ook niet, maar dit is gebeurd, opdat de werken van God in hem openbaar zouden worden.", "Kol 1:16": "Want door Hem zijn alle dingen geschapen, die in de hemelen en die op de aarde zijn, die zienlijk en die onzienlijk zijn, hetzij tronen, hetzij heerschappijen, hetzij overheden, hetzij machten; alle dingen zijn door Hem en tot Hem geschapen;", "Nahum 1:3": "De HEERE is geduldig, maar van grote kracht, en Hij houdt de schuldige zeker niet onschuldig. De weg van de HEERE is in wervelwind en in storm, en de wolken zijn het stof van Zijn voeten.", "Lev 11:44": "Want Ik ben de HEERE, uw God; daarom zult u uzelf heiligen, en heilig zijn, omdat Ik heilig ben; en u zult uw ziel niet verontreinigen aan enig kruipend gedierte dat zich op de aarde beweegt.", "Gen 25:12": "Dit nu zijn de geboorten van Ismaël, de zoon van Abraham, die Hagar, de Egyptische, dienstmaagd van Sara, Abraham gebaard heeft.", "Jes 61:1": "De Geest van de Heere HEERE is op Mij, omdat de HEERE Mij gezalfd heeft, om een blijde boodschap te brengen aan de zachtmoedigen; Hij heeft Mij gezonden om te verbinden de gebrokenen van hart, om de gevangenen vrijheid uit te roepen, en de gebondenen opening van de gevangenis;", "1 Kon 21:20": "En Achab zei tegen Elia: Hebt u mij gevonden, o mijn vijand? En hij zei: Ik heb u gevonden, omd
