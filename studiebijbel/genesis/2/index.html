<style>

  .navselect { font-family:"Lora"; font-size:.85rem; border:1px solid var(--border); border-radius:999px; padding:.3rem 1.6rem .3rem .8rem; background:#fff; color:var(--accent-donker); cursor:pointer; display:inline-flex; align-items:center; text-decoration:none; }

  .vers:hover { background: var(--bg-soft); }

  @keyframes flits { 0% { background: #f0e2bd; } 100% { background: var(--bg-soft); } }

  .vtekst em, .pcel em { font-style: italic; color: #555; }

  .vers:hover .kopieer { opacity: .75; }

  #bijbel.parallel .vers { display:grid; gap:.8rem; cursor:pointer; align-items:start; }
  #bijbel.parallel .vnr { grid-row: 1; }
  .kolomkop { display:none; }
  #bijbel.parallel + .kolomkop, .kolomkop.tonen { }
  .pk { font-family:"Lora"; font-size:.72rem; text-transform:uppercase; letter-spacing:.12em; color:var(--accent-donker); font-weight:700; }
  #bijbel.parallel .pcel em { font-style:italic; color:#555; }

voltooid, en heel hun leger.","2":"Toen God op de zevende dag Zijn werk voltooid had, dat Hij gemaakt had, heeft Hij op de zevende dag gerust van al Zijn werk, dat Hij gemaakt had.","3":"En God heeft de zevende dag gezegend, en die geheiligd; omdat Hij daarop gerust heeft van al Zijn werk, dat God geschapen had om te volmaken.","4":"Dit *zijn* de geboorten van de hemel en de aarde, toen zij geschapen werden; op de dag dat de HEERE God de aarde en de hemel maakte,","5":"En elke struik van het veld, voordat hij op de aarde was, en al het kruid van het veld, voordat het opkwam; want de HEERE God had het niet laten regenen op de aarde, en er was geen mens *geweest*, om de aardbodem te bewerken.","6":"Maar een damp steeg op uit de aarde, en bevochtigde de hele aardbodem.","7":"En de HEERE God had de mens gevormd uit het stof van de aarde, en in zijn neusgaten de adem van het leven geblazen; zo werd de mens tot een levende ziel.","8":"Ook had de HEERE God een hof geplant in Eden, tegen het oosten, en Hij zette daar de mens, die Hij gevormd had.","9":"En de HEERE God had alle bomen uit de aardbodem laten opkomen, begeerlijk voor het gezicht, en goed tot voedsel; en de boom van het leven in het midden van de hof, en de boom van de kennis van goed en kwaad.","10":"En een rivier stroomde voort uit Eden, om deze hof te bewateren; en werd vandaar verdeeld, en werd tot vier hoofden[1].","11":"De naam van de eerste *rivier* *is* Pison; dat *is* *het*, dat het hele land van Havila omstroomt, waar het goud is.","12":"En het goud van dit land *is* goed; daar *is* *ook* bedolah, en de steen sardonix.","13":"En de naam van de tweede rivier *is* Gihon; dat *is* *het*, dat het hele land Cusch omstroomt.","14":"En de naam van de derde rivier *is* Hiddekel; die stroomt naar het oosten van Assur. En de vierde rivier *is* Frath.","15":"Zo nam de HEERE God de mens, en zette hem in de hof van Eden, om die te bewerken, en die te bewaren.","16":"En de HEERE God gebood de mens en zei: Van elke boom van deze hof mag u vrijelijk eten;","17":"Maar van de boom van de kennis van goed en kwaad, daarvan mag u niet eten; want op de dag dat u daarvan eet, zult u de dood sterven[2].","18":"Ook had de HEERE God gesproken: Het is niet goed dat de mens alleen is; Ik zal hem een hulp maken, *die* bij hem past.","19":"Want toen de HEERE God uit de aarde alle dieren van het veld, en al het gevogelte van de hemel gevormd had, bracht Hij ze tot Adam, om te zien hoe hij ze noemen zou; en zoals Adam elke levende ziel noemen zou, dat zou haar naam zijn.","20":"Zo had Adam de namen genoemd van al het vee, en van het gevogelte van de hemel, en van alle dieren van het veld; maar voor de mens vond hij geen hulp, *die* bij hem paste.","21":"Toen deed de HEERE God een diepe slaap op Adam vallen, en hij sliep; en Hij nam een van zijn ribben, en sloot de plaats daarvan toe met vlees.","22":"En de HEERE God bouwde de rib, die Hij van Adam genomen had, tot een vrouw, en Hij bracht haar bij Adam.","23":"Toen zei Adam: Dit is ditmaal been van mijn benen, en vlees van mijn vlees! Men zal haar Manninne[3] noemen, omdat zij uit de man genomen is.","24":"Daarom zal de man zijn vader en zijn moeder verlaten, en zich hechten aan zijn vrouw; en zij zullen tot een vlees zijn.","25":"En zij waren beiden naakt, Adam en zijn vrouw; en zij schaamden zich niet."},"SV":{"1":"Alzo zijn volbracht de hemel en de aarde, en al hun heir.","2":"Als nu God op den zevenden dag volbracht had Zijn werk, dat Hij gemaakt had, heeft Hij gerust op den zevenden dag van al Zijn werk, dat Hij gemaakt had.","3":"En God heeft den zevenden dag gezegend, en dien geheiligd; omdat Hij op denzelven gerust heeft van al Zijn werk, hetwelk God geschapen had, om te volmaken.","4":"Dit *zijn* de geboorten des hemels en der aarde, als zij geschapen werden; ten dage als de HEERE God de aarde en den hemel maakte.","5":"En allen struik des velds, eer hij in de aarde was, en al het kruid des velds, eer het uitsproot; want de HEERE God had niet doen regenen op de aarde, en er was geen mens *geweest*, om den aardbodem te bouwen.","6":"Maar een damp was opgegaan uit de aarde, en bevochtigde den gansen aardbodem.","7":"En de HEERE God had den mens geformeerd uit het stof der aarde, en in zijn neusgaten geblazen den adem des levens; alzo werd de mens tot een levende ziel.","8":"Ook had de HEERE God een hof geplant in Eden, tegen het oosten, en Hij stelde aldaar den mens, dien Hij geformeerd had.","9":"En de HEERE God had alle geboomte uit het aardrijk doen spruiten, begeerlijk voor het gezicht, en goed tot spijze; en den boom des levens in het midden van den hof, en de boom der kennis des goeds en des kwaads.","10":"En een rivier was voortgaande uit Eden, om dezen hof te bewateren; en werd van daar verdeeld, en werd tot vier hoofden.","11":"De naam der eerste *rivier* *is* Pison; deze *is* *het*, die het ganse land van Havila omloopt, waar het goud *is*.","12":"En het goud van dit land *is* goed; daar *is* *ook* bedolah, en de steen sardonix.","13":"En de naam der tweede rivier *is* Gihon; deze *is* *het*, die het ganse land Cusch omloopt.","14":"En de naam der derde rivier *is* Hiddekel; deze is gaande naar het oosten van Assur. En de vierde rivier *is* Frath.","15":"Zo nam de HEERE God den mens, en zette hem in den hof van Eden, om dien te bouwen, en dien te bewaren.","16":"En de HEERE God gebood den mens, zeggende: Van allen boom dezes hofs zult gij vrijelijk eten;","17":"Maar van den boom der kennis des goeds en des kwaads, daarvan zult gij niet eten; want ten dage, als gij daarvan eet, zult gij den dood sterven.","18":"Ook had de HEERE God gesproken: Het is niet goed, dat de mens alleen zij; Ik zal hem een hulpe maken, *die* als tegen hem over *zij*.","19":"Want als de HEERE God uit de aarde al het gedierte des velds, en al het gevogelte des hemels gemaakt had, zo bracht Hij die tot Adam, om te zien, hoe hij ze noemen zou; en zo als Adam alle levende ziel noemen zoude, dat *zou* haar naam *zijn*.","20":"Zo had Adam genoemd de namen van al het vee, en van het gevogelte des hemels, en van al het gedierte des velds; maar voor den mens vond hij geen hulpe, *die* als tegen hem over *ware*.","21":"Toen deed de HEERE God een diepen slaap op Adam vallen, en hij sliep; en Hij nam een van zijn ribben, en sloot derzelver plaats toe *met* vlees.","22":"En de HEERE God bouwde de ribbe, die Hij van Adam genomen had, tot een vrouw, en Hij bracht haar tot Adam.","23":"Toen zeide Adam: Deze *is* ditmaal been van mijn benen, en vlees van mijn vlees! Men zal haar Manninne heten, omdat zij uit den man genomen is.","24":"Daarom zal de man zijn vader en zijn moeder verlaten, en zijn vrouw aankleven; en zij zullen tot een vlees zijn.","25":"En zij waren beiden naakt, Adam en zijn vrouw; en zij schaamden zich niet."},"KJV":{"1":"Thus the heavens and the earth were finished, and all the host of them.","2":"And on the seventh day God ended his work which he had made; and he rested on the seventh day from all his work which he had made.","3":"And God blessed the seventh day, and sanctified it: because that in it he had rested from all his work which God created and made.","4":"These *are* the generations of the heavens and of the earth when they were created, in the day that the LORD God made the earth and the heavens,","5":"And every plant of the field before it was in the earth, and every herb of the field before it grew: for the LORD God had not caused it to rain upon the earth, and *there was* not a man to till the ground.","6":"But there went up a mist from the earth, and watered the whole face of the ground.","7":"And the LORD God formed man *of* the dust of the ground, and breathed into his nostrils the breath of life; and man became a living soul.","8":"And the LORD God planted a garden eastward in Eden; and there he put the man whom he had formed.","9":"And out of the ground made the LORD God to grow every tree that is pleasant to the sight, and good for food; the tree of life also in the midst of the garden, and the tree of knowledge of good and evil.","10":"And a river went out of Eden to water the garden; and from thence it was parted, and became into four heads.","11":"The name of the first *is* Pison: that *is* it which compasseth the whole land of Havilah, where *there is* gold;","12":"And the gold of that land *is* good: there *is* bdellium and the onyx stone.","13":"And the name of the second river *is* Gihon: the same *is* it that compasseth the whole land of Ethiopia.","14":"And the name of the third river *is* Hiddekel: that *is* it which goeth toward the east of Assyria. And the fourth river *is* Euphrates.","15":"And the LORD God took the man, and put him into the garden of Eden to dress it and to keep","16":"And the LORD God commanded the man, saying, Of every tree of the garden thou mayest freely eat:","17":"But of the tree of the knowledge of good and evil, thou shalt not eat of it: for in the day that thou eatest thereof thou shalt surely die.","18":"And the LORD God said, *It is* not good that the man should be alone; I will make him an help meet for him.","19":"And out of the ground the LORD God formed every beast of the field, and every fowl of the air; and brought *them* unto Adam to see what he would call them: and whatsoever Adam called every living creature, that *was* the name thereof.","20":"And Adam gave names to all cattle, and to the fowl of the air, and to every beast of the field; but for Adam there was not found an help meet","21":"And the LORD God caused a deep sleep to fall upon Adam, and he slept: and he took one of his ribs, and closed up the flesh","22":"And the rib, which the LORD God had taken from man, made he a woman, and brought her unto the man.","23":"And Adam said, This *is* now bone of my bones, and flesh of my flesh: she shall be called Woman, because she was taken out of Man.","24":"Therefore shall a man leave his father and his mother, and shall cleave unto his wife: and they shall be one flesh.","25":"And they were both naked, the man and his wife, and were not ashamed."}},"tsk":{"1":[{"kopje":"Zo","refs":["Gen 2:4","Gen 1:1","Gen 1:10","Ex 20:11","Ex 31:17","2 Kon 19:15","2 Kron 2:12","Neh 9:6","Job 12:9","Ps 89:12-14","Ps 104:2","Ps 136:5-8","Ps 146:6","Jes 42:5","Jes 45:18","Jes 48:13","Jes 55:9","Jes 65:17","Jer 10:12","Jer 10:16","Zach 12:1","Hand 4:24","Hebr 4:3"]},{"kopje":"leger","refs":["Deut 4:19","Deut 17:3","2 Kon 21:3-5","Ps 33:6","Ps 33:9","Jes 34:4","Jes 40:26-28","Jes 45:12","Jer 8:2","Luk 2:13","Hand 7:42"]}],"2":[{"kopje":"op de zevende dag","refs":["Gen 1:31","Ex 20:11","Ex 23:12","Ex 31:17","Deut 5:14","Jes 58:13","Joh 5:17","Hebr 4:4"]}],"3":[{"kopje":"gezegend","refs":["Ex 16:22-30","Ex 20:8-11","Ex 23:12","Ex 31:13-17","Ex 34:21","Ex 35:2","Ex 35:3","Lev 23:3","Lev 25:2","Lev 25:3","Deut 5:12-14","Neh 9:14","Neh 13:15-22","Spr 10:22","Jes 56:2-7","Jes 58:13","Jes 58:14","Jer 17:21-27","Ezech 20:12","Mark 2:27","Luk 23:56","Hebr 4:4-10"]}],"4":[{"kopje":"de geboorten","refs":["Gen 1:4","Gen 5:1","Gen 10:1","Gen 11:10","Gen 25:12","Gen 25:19","Gen 36:1","Gen 36:9","Ex 6:15","Job 38:28","Ps 90:1","Ps 90:2"]},{"kopje":"HEERE","refs":["Ex 15:3","1 Kon 18:39","2 Kron 20:6","Ps 18:32","Ps 86:10","Jes 44:6","Openb 1:4","Openb 1:8","Openb 11:17","Openb 16:5"]}],"5":[{"kopje":"struik","refs":["Gen 1:12","Ps 104:14"]},{"kopje":"had niet","refs":["Job 5:10","Job 38:26-28","Ps 65:10-12","Ps 135:7","Jer 14:22","Matt 5:45","Hebr 6:7"]},{"kopje":"om te bewerken","refs":["Gen 3:23","Gen 4:2","Gen 4:12"]}],"6":[{"kopje":"een damp steeg op uit de aarde","refs":["Gen 2:6"]}],"7":[{"kopje":"de mens gevormd","refs":["Ps 100:3","Ps 139:14","Ps 139:15","Jes 64:8"]},{"kopje":"stof","refs":["Gen 3:19","Gen 3:23","Job 4:19","Job 33:6","Ps 103:14","Pred 3:7","Pred 3:20","Pred 12:7","Jes 64:8","Rom 9:20","1 Kor 15:47","2 Kor 4:7","2 Kor 5:1"]},{"kopje":"geblazen","refs":["Job 27:3","Job 33:4","Joh 20:22","Hand 17:25"]},{"kopje":"neusgaten","refs":["Gen 7 "H1847\">knowledge</span> of <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> and evil.","10":"And a <span class=\"wl wl-kjv\" data-code=\"H5104\">river</span> went <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> of <span class=\"wl wl-kjv\" data-code=\"H5731\">Eden</span> to <span class=\"wl wl-kjv\" data-code=\"H8248\">water</span> the <span class=\"wl wl-kjv\" data-code=\"H1588\">garden;</span> and from thence it was <span class=\"wl wl-kjv\" data-code=\"H6504\">parted,</span> and became into <span class=\"wl wl-kjv\" data-code=\"H702\">four</span> heads.","11":"The <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of the <span class=\"wl wl-kjv\" data-code=\"H259\">first</span> is <span class=\"wl wl-kjv\" data-code=\"H6376\">Pison:</span> <span class=\"wl wl-kjv\" data-code=\"H1931\">that</span> is it which <span class=\"wl wl-kjv\" data-code=\"H5437\">compasseth</span> the whole <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H2341\">Havilah,</span> <span class=\"wl wl-kjv\" data-code=\"H834\">where</span> there is gold;","12":"And the <span class=\"wl wl-kjv\" data-code=\"H2091\">gold</span> of <span class=\"wl wl-kjv\" data-code=\"H1931\">that</span> <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> is <span class=\"wl wl-kjv\" data-code=\"H2896\">good:</span> there is <span class=\"wl wl-kjv\" data-code=\"H916\">bdellium</span> and the <span class=\"wl wl-kjv\" data-code=\"H7718\">onyx</span> stone.","13":"And the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of the <span class=\"wl wl-kjv\" data-code=\"H8145\">second</span> <span class=\"wl wl-kjv\" data-code=\"H5104\">river</span> is <span class=\"wl wl-kjv\" data-code=\"H1521\">Gihon:</span> the same is it that <span class=\"wl wl-kjv\" data-code=\"H5437\">compasseth</span> the whole <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of Ethiopia.","14":"And the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of the <span class=\"wl wl-kjv\" data-code=\"H7992\">third</span> <span class=\"wl wl-kjv\" data-code=\"H5104\">river</span> is <span class=\"wl wl-kjv\" data-code=\"H2313\">Hiddekel:</span> that is it which goeth <span class=\"wl wl-kjv\" data-code=\"H1980\">toward</span> the <span class=\"wl wl-kjv\" data-code=\"H6926\">east</span> of <span class=\"wl wl-kjv\" data-code=\"H804\">Assyria.</span> And the <span class=\"wl wl-kjv\" data-code=\"H7243\">fourth</span> <span class=\"wl wl-kjv\" data-code=\"H5104\">river</span> is Euphrates.","15":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> the <span class=\"wl wl-kjv\" data-code=\"H120\">man,</span> and put <span class=\"wl wl-kjv\" data-code=\"H3240\">him</span> into the <span class=\"wl wl-kjv\" data-code=\"H1588\">garden</span> of <span class=\"wl wl-kjv\" data-code=\"H5731\">Eden</span> to <span class=\"wl wl-kjv\" data-code=\"H5647\">dress</span> it and to keep","16":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> the <span class=\"wl wl-kjv\" data-code=\"H120\">man,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Of every <span class=\"wl wl-kjv\" data-code=\"H6086\">tree</span> of the <span class=\"wl wl-kjv\" data-code=\"H1588\">garden</span> thou mayest <span class=\"wl wl-kjv\" data-code=\"H398\">freely</span> eat:","17":"But of the <span class=\"wl wl-kjv\" data-code=\"H6086\">tree</span> of the <span class=\"wl wl-kjv\" data-code=\"H1847\">knowledge</span> of <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> and <span class=\"wl wl-kjv\" data-code=\"H7451\">evil,</span> thou shalt not <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> of it: for in the <span class=\"wl wl-kjv\" data-code=\"H3117 ss=\"wl wl-kjv\" data-code=\"H6106\">bone</span> of my <span class=\"wl wl-kjv\" data-code=\"H6106\">bones,</span> and <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh</span> of my <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh:</span> <span class=\"wl wl-kjv\" data-code=\"H2063\">she</span> shall be <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> <span class=\"wl wl-kjv\" data-code=\"H802\">Woman,</span> because <span class=\"wl wl-kjv\" data-code=\"H2063\">she</span> was <span class=\"wl wl-kjv\" data-code=\"H3947\">taken</span> out of Man.","24":"<span class=\"wl wl-kjv\" data-code=\"H3651\">Therefore</span> shall a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> <span class=\"wl wl-kjv\" data-code=\"H5800\">leave</span> his <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> and his <span class=\"wl wl-kjv\" data-code=\"H517\">mother,</span> and shall <span class=\"wl wl-kjv\" data-code=\"H1692\">cleave</span> unto his <span class=\"wl wl-kjv\" data-code=\"H802\">wife:</span> and they shall be <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> flesh.","25":"And they were <span class=\"wl wl-kjv\" data-code=\"H8147\">both</span> <span class=\"wl wl-kjv\" data-code=\"H6174\">naked,</span> the <span class=\"wl wl-kjv\" data-code=\"H120\">man</span> and his <span class=\"wl wl-kjv\" data-code=\"H802\">wife,</span> and were not ashamed."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"hemel","tekst":"Dat is, de lucht, de hemel, de zon, maan en sterren, mitsgaders de derde hemel met zijne inwoners, de heilige engelen, gelijk zij ook genaamd worden het heir des hemels, 1Ki 22:19, verg. boven Gen 1:1."},{"catchword":"al hun","tekst":"De schepselen, in hemel en aarde begrepen, worden een heir genaamd, niet alleen om hun grote menigte en verscheidenheid, welgestelde orde en zonderlinge sieraad; maar ook omdat zij van God als hun overste worden onderhouden en geregeerd, en Hem steeds ten dienste moeten staan. Alzo Psa 103:21; Isa 45:12."}],"2":[{"catchword":"heeft Hij gerust","tekst":"Dat is menselijker wijze van God gesproken; want er wordt gezegd dat Hij rustte, niet omdat Hij moede was van het werken, maar omdat Hij opgehouden heeft enige nieuwe soorten van dingen te scheppen; hoewel Hij nog altijd werkt in het onderhouden en regeren van dezelve. Isa 40:28; Joh 5:17."}],"3":[{"catchword":"heeft den zevenden","tekst":"Dat is, God heeft hem verheven boven de andere dagen, en waardiger gemaakt dan dezen. Verg. het woord zegenen met Gen 24:31. De waardigheid is in het gebruik, hetwelk door het volgende woord heiligen te kennen gegeven wordt, betekenende iets, dat gemeen is, tot een heilig gebruik afzonderen. Alzo Exo 13:2; Lev 8:10; Num 7:1; 1Ki 8:64, enz."},{"catchword":"om te volmaken","tekst":"Dat is, om tot al zulke gebruiken en einden, als met Gods wijsheid overeenkomen, maar eens iegelijken aard op het sierlijkste en bekwaamste te schikken, zoals zij nu zijn. Anders, scheppende gemaakt had."}],"4":[{"catchword":"geboorten","tekst":"Dat is, oorsprong of beginselen. Verg. Psa 90:2 met de aant."},{"catchword":"de HEERE God","tekst":"Na de voleinding van het werk der schepping, wordt hier allereerst God de naam van JHWH gegeven, betekenende den zelfstandige, den zelfwezende, van zichzelven zijnde van eeuwigheid tot eeuwigheid en de oorsprong of oorzaak van het wezen aller dingen, waarom ook deze naam den waren God alleen toekomt. Onthoud dit eens voor al: waar gij voortaan het woord HEERE met grote letters geschreven vindt, dat aldaar in het Hebr. het woord JHWH of korter JAH staat."}],"5":[{"catchword":"eer hij","tekst":"Te weten, vóór hunne schepping, toen zij nog niet waren."},{"catchword":"want de HEERE","tekst":"De zin is dat God de planten, als: kruiden, struiken, bomen, uit de aarde in de schepping op den derden dag had doen voortkomen, alleen door zijn alvermogend woord, zondere enige middelen, hetzij van den regen der lucht, hetzij van den arbeid der mensen, die toen nog niet waren."}],"6":[{"catchword":"Maar","tekst":"Te weten, nu of daarna; want Mozes verhaalt nu hier het gewone middel van God in de natuur daargesteld, om kruiden, struiken en bomen uit de aarde voort te brengen, namelijk, den damp, die den regen veroorzaakt en het aardrijk bevochtigt."},{"catchword":"een damp","tekst":"Welke, door de hitte der zon uit het water en de aarde opgetrokken zijnde, stijgt tot in de middenlucht, waar hij door haar koude in wolken verandert, en daarna wederom ontsluit en regen wordt, waarmede het aardrijk dan bevochtigd wordt."},{"catchword":"den gansen","tekst":"Hebr. het ganse aangezicht des aardbodems."}],"7":[{"catchword":"geformeerd","tekst":"Of, gebeeld, of gefatsoeneerd, te weten, gelijk een pottenbakker uit leem wat formeert, als: Isa 45:9; Rom 9:20-21. Versta dit ten aanzien van des mensen lichaam."},{"catchword":"uit het","tekst":"Hebr. stof uit het aardrijk."},{"catchword":"en in zijn","tekst":"Dit is menselijker wijze van God gesproken, en wijst ons aan dat de ziel des mensen niet is geschapen uit enige voorgaande materie, gelijk de ziel der beesten, Gen 1:20-21, Gen 1:24, maar uit niet, door Gods Geest, en van buiten den mensen ingestort."},{"catchword":"levende ziel","tekst":"Dat is, tot een schepsel, dat met leven begaafd is, bestaande uit een lichaam en een redelijke onsterflijke ziel, tezamen den mens uitmakende."}],"8":[{"catchword":"hof","tekst":"Namelijk, het paradijs of lusthof, dat God voor den mens tot ene woning verordend had."},{"catchword":"geplant","tekst":"Te weten, op den derden dag der schepping, eer de mens geschapen was."},{"catchword":"Eden,","tekst":"Eden is de naam van een landschap in Thelassar, het opperdeel in Chaldea, gelijk te zien is 2Ki 19:12, en het is onderscheiden van een ander Eden, gelegen bij Damaskus, in Syrië, waarvan te zien is Amo 1:5. Het Hebr. woord Eden betekent wellust, geneugte, vermaking. Dit land wordt alzo genaamd, omdat het een schoon, lustig, edel land was, gelijk zulks te zien is uit het volgende vers van dit hoofdstuk, vs.9, alsook uit Isa 51:3; Eze 28:13, Eze 31:16, Eze 31:18."},{"catchword":"tegen het oosten,","tekst":"Hebr. van oosten, of uit oosten, dat is, in het oosteinde van Eden, of ten oosten van de plaats, waar Mozes was, dit schrijvende."}],"9":[{"catchword":"goed","tekst":"Versta dit van de vruchten der bomen."},{"catchword":"des levens","tekst":"Dat is, een teken des levens, betekenende dat de mens het leven van God ontvangen had en behouden zou, zo hij in zijne gehoorzaamheid volhardde, totdat het God believen zou hem in zijn hemelse onsterflijkheid op te nemen."}],"10":[{"catchword":"een rivier","tekst":"Het gevoelen van enigen is dat dit te verstaan is van de rivier de Eufraat, die ontspringt in het gebergte van groot Armenië, en zich daarna met de rivier Hiddekel of Tigris verenigt, waaruit zich voorts de twee andere rivieren [Pison en Gihon] verdelen, enz.; doch de eigenlijke ligging dezer rivieren is nu onzeker, en wordt daarvan verscheidenlijk door de geleerden gevoeld."},{"catchword":"uit Eden,","tekst":"Zie boven de aant. op vs.8. Zij was vloeiende door Eden, tot, in en door den hof, in het land van Eden gelegen."},{"catchword":"tot vier","tekst":"Dat is, hoofdstromen, hoofdrivieren, hoofdwateren. Het woord hoofden betekent hier beginselen van deze vier rivieren."}],"11":[{"catchword":"Pison;","tekst":"Hebr. Pischon. Deze naam wordt nergens elders in de Heilige Schrift gevonden dan hier. Zij is een arm van de rivier Eufraat, vallende, naar veler gevoelen, onder Apamea, in de Tigris, en daarna in de Perzische zee; dragende bij de inwoners den naam van (Pasitigris of Pisotigris."},{"catchword":"Havila","tekst":"Hebr. Cavilah. Dit is de naam van een landschap, anders [naar de mening van sommige geleerden] ook Suziana genaamd, naar de hoofdstad Suzan, waarvan te zien is Est 1:2; Dan 8:2. Zie ook van een ander Havila Gen 25:18; 1Sa 15:7."},{"catchword":"omloopt,","tekst":"Hebr. is omlopende."}],"12":[{"catchword":"bedólah,"," /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:"Lora";font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
