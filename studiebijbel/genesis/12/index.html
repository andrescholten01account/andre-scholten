ten; vernieling en ellende is op hun wegen; en de weg van de vrede hebben zij niet gekend.", "Gen 29:17": "Lea had tere ogen; maar Rachel was mooi van gestalte, en mooi van gezicht.", "Jes 52:5": "En nu, wat heb Ik hier te doen? spreekt de HEERE, omdat Mijn volk voor niets is weggenomen, en degenen die over hen heersen, hen laten huilen, spreekt de HEERE, en Mijn Naam voortdurend de hele dag gelasterd wordt;", "Jes 54:1-17": "Zing vrolijk, u onvruchtbare, die niet gebaard hebt! Maak geschal met vrolijk gezang, en juich, die geen barensnood gehad hebt! Want de kinderen van de eenzame zijn meer dan de kinderen van de getrouwde, zegt de HEERE. Maak de plaats van uw tenten wijd, en laat men de gordijnen van uw woningen uitbreiden, verhinder het niet; maak uw koorden lang, en steek uw pinnen vast in. Want u zult uitbreken ter rechter hand en ter linkerhand; en uw nageslacht zal de heidenen erven, en zij zullen de verwoeste steden doen bewonen.", "Gen 22:2": "En Hij zei: Neem toch uw zoon, uw enige, die u liefhebt, Izak, en ga naar het land Moria, en offer hem daar tot een brandoffer, op een van de bergen die Ik u zeggen zal.", "Hebr 13:5": "Laat uw wandel zonder geldgierigheid zijn, en wees tevreden met wat u hebt; want Hij heeft gezegd: Ik zal u niet begeven, en Ik zal u niet verlaten.", "Hand 3:23": "En het zal gebeuren dat iedere ziel die niet naar deze Profeet zal hebben geluisterd, uitgeroeid zal worden uit het volk.", "Deut 32:35": "Aan Mij is de wraak en de vergelding, op de tijd dat hun voet zal wankelen; want de dag van hun ondergang is nabij, en de dingen die hun zullen gebeuren, haasten zich.", "Luk 4:18": "De Geest van de Heere is op Mij, daarom heeft Hij Mij gezalfd; Hij heeft Mij gezonden om aan de armen het Evangelie te verkondigen, om te genezen wie gebroken zijn van hart;", "Matt 7:23": "En dan zal Ik hun openlijk zeggen: Ik heb u nooit gekend; ga weg van Mij, u die de ongerechtigheid werkt!", "Jes 49:8": "Zo zegt de HEERE: In de tijd van het welbehagen heb Ik U verhoord, en op de dag van het heil heb Ik U geholpen; en Ik zal U bewaren, en Ik zal U geven tot een verbond van het volk, om het aardrijk op te richten, om de verwoeste erfenissen te doen beërven;", "Rom 9:5": "van wie de vaders zijn, en uit wie Christus is, wat het vlees aangaat, Hij Die God is, boven allen te prijzen tot in eeuwigheid. Amen.", "Mark 14:27": "En Jezus zei tegen hen: U zult deze nacht allen aanstoot aan Mij nemen; want er is geschreven: Ik zal de Herder slaan, en de schapen zullen verstrooid worden.", "Ex 21:24": "oog voor oog, tand voor tand, hand voor hand, voet voor voet,", "Ps 118:24": "Dit is de dag, die de HEERE gemaakt heeft; laten we ons daarover verheugen, en verblijd zijn.", "Gen 3:6": "En de vrouw zag dat die boom goed was om van te eten, en dat hij een lust was voor de ogen, ja, een boom die begerenswaardig was om er verstandig van te worden; en zij nam van zijn vrucht en at; en zij gaf ook aan haar man, die bij haar was, en hij at.", "Ef 2:7": "opdat Hij zou tonen in de toekomende eeuwen de uitnemende rijkdom van Zijn genade, door de goedertierenheid over ons in Christus Jezus.", "Mark 9:14-29": "En toen Hij bij de discipelen kwam, zag Hij een grote menigte om hen heen, en enige Schriftgeleerden die met hen aan het twisten waren. En meteen, toen de hele menigte Hem zag, was zij zeer verbaasd, en zij liepen naar Hem toe en groetten Hem. En Hij vroeg de Schriftgeleerden: Waarover twist u met hen?", "Gen 24:62": "Izak nu kwam van de weg naar de put Lachai-Roi; want hij woonde in het zuiderland.", "Ps 25:5": "He. Vau. Leid mij in Uw waarheid, en leer mij, want Gij zijt de God van mijn heil; U verwacht ik de hele dag.", "Luk 1:26-35": "En in de zesde maand werd de engel Gabriël door God gezonden naar een stad in Galilea, genaamd Nazareth, naar een maagd die ondertrouwd was met een man wiens naam Jozef was, uit het huis van David; en de naam van de maagd was Maria. En de engel kwam bij haar binnen, en zei: Wees gegroet, begenadigde; de Heere is met u; u bent gezegend onder de vrouwen.", "1 Kon 3:4": "En de koning ging naar Gibeon om daar te offeren, omdat dat de grote hoogte was; duizend brandoffers offerde Salomo op dat altaar.", "Matt 5:27": "U hebt gehoord dat gezegd is: U zult geen overspel plegen.", "Ps 110:1": "Een psalm van David. De HEERE heeft tot mijn Heere gesproken: Zit aan Mijn rechterhand, totdat Ik Uw vijanden gezet zal hebben tot een voetbank van Uw voeten.", "Matt 1:21": "en zij zal een Zoon baren, en u zult Hem de naam JEZUS geven; want Hij zal Zijn volk zalig maken van hun zonden.", "Ps 105:4": "Vraagt naar de HEERE en Zijn sterkte; zoekt Zijn aangezicht voortdurend.", "Ps 144:13": "Dat onze schuren vol zijn, de ene voorraad na de andere opleverend; dat onze kudden bij duizenden jongen werpen, ja, bij tienduizenden op onze velden zich vermenigvuldigen.", "Hand 7:2": "En hij zei: Mannen, broeders en vaders, luister: de God van de heerlijkheid verscheen aan onze vader Abraham, toen hij nog in Mesopotamië was, voordat hij in Haran woonde,", "Hand 8:32": "En het gedeelte van de Schrift dat hij las, was dit: Hij is als een schaap naar de slachting geleid; en zoals een lam stemloos is voor wie het scheert, zo doet Hij Zijn mond niet open.", "Ps 103:17": "Maar de goedertierenheid van de HEERE is van eeuwigheid tot eeuwigheid over hen die Hem vrezen, en Zijn gerechtigheid over kindskinderen;", "Hand 7:2-6": "En hij zei: Mannen, broeders en vaders, luister: de God van de heerlijkheid verscheen aan onze vader Abraham, toen hij nog in Mesopotamië was, voordat hij in Haran woonde, en zei tegen hem: Ga uit uw land en uit uw familie, en kom in een land dat Ik u wijzen zal. Toen ging hij weg uit het land van de Chaldeeën, en woonde in Haran. En vandaar, nadat zijn vader gestorven was, bracht Hij hem over naar dit land, waarin u nu woont.", "Mark 9:11-13": "En zij vroegen Hem: Waarom zeggen de Schriftgeleerden dat Elia eerst moet komen? En Hij antwoordde en zei tegen hen: Elia komt inderdaad eerst, en herstelt alles; en het zal gebeuren, zoals geschreven is van de Zoon des mensen, dat Hij veel moet lijden en veracht worden. Maar Ik zeg u, dat Elia ook gekomen is, en zij hebben hem gedaan wat zij wilden, zoals van hem geschreven is.", "Ps 103:18": "Over hen die Zijn verbond houden, en die aan Zijn bevelen denken, om die te doen.", "Jes 4:5": "En de HEERE zal over elke woning van de berg Sion, en over haar samenkomsten, een wolk scheppen overdag, en rook, en de glans van een vlammend vuur 's nachts; want over alles wat heerlijk is, zal een beschutting zijn.", "Hand 7:31": "Toen Mozes dat zag, verwonderde hij zich over het gezicht; en toen hij erheen ging om het van dichtbij te bekijken, kwam er een stem van de Heere tot hem,", "Jes 24:16": "Van het uiterste einde van de aarde horen wij psalmen, tot verheerlijking van de Rechtvaardige. Maar nu zeg ik: Ik word mager, ik word mager, wee mij! De trouwelozen handelen trouweloos, en met trouweloosheid handelen de trouwelozen trouweloos.", "Ps 132:15-17": "Ik zal haar voedsel rijkelijk zegenen, haar behoeftigen zal Ik met brood verzadigen. En haar priesters zal Ik met heil bekleden, en haar gunstgenoten zullen zeer juichen. Daar zal Ik David een hoorn doen uitspruiten; Ik heb voor Mijn Gezalfde een lamp klaargemaakt.", "Rom 3:28-30": "Wij stellen dan vast, dat de mens door het geloof gerechtvaardigd wordt, zonder de werken van de wet. Is God een God van de Joden alleen? En is Hij het niet ook van de heidenen? Ja, ook van de heidenen; omdat Hij één God is, Die de besnijdenis zal rechtvaardigen uit het geloof, en de onbesnedenen door het geloof.", "Jes 60:1": "Maak u op, word verlicht, want uw licht komt, en de heerlijkheid van de HEERE gaat over u op.", "Luk 23:36": "En ook de soldaten kwamen naar Hem toe en bespotten Hem, en brachten Hem azijn;", "Matt 21:5": "Zeg tegen de dochter van Sion: Zie, uw Koning komt naar u toe, zachtmoedig en gezeten op een ezelin, en een veulen, het jong van een lastdier.", "Matt 2:5": "Zij zeiden tegen hem: In Bethlehem, in Judea; want zo is geschreven door de profeet:", "Hand 9:15": "Maar de Heere zei tegen hem: Ga heen; want deze man is Mij een uitverkoren instrument om Mijn Naam te dragen voor de heidenen, en de koningen, en de kinderen van Israël.", "Jes 19:11": "Zeker, de vorsten van Zoan zijn dwazen, de raad van de wijzen, van de raadgevers van Farao, is redeloos geworden; hoe kunt u dan tegen Farao zeggen: Ik ben een zoon van de wijzen, een zoon van de oude koningen?", "Gen 26:25": "Toen bouwde hij daar een altaar, en riep de Naam van de HEERE aan. En hij sloeg daar zijn tent op; en Izaks knechten groeven daar een put.", "Jes 49:11": "En Ik zal al Mijn bergen tot een weg maken, en Mijn banen zullen verhoogd zijn.", "Ps 31:6": "In Uw hand beveel ik mijn geest; U hebt mij verlost, HEERE, U, God van de waarheid!", "Hebr 4:4": "Want Hij heeft ergens over de zevende dag zo gesproken: En God heeft op de zevende dag van al Zijn werken gerust.", "Ps 105:11": "En zei: Ik zal u geven het land Kanaän, het snoer van uw erfdeel.", "2 Tess 2:13": "Maar wij zijn verplicht altijd God te danken voor u, broeders, die door de Heere bemind bent, dat God u van het begin af verkoren heeft tot zaligheid, in heiliging door de Geest, en geloof in de waarheid;", "Jes 60:8-14": "Wie zijn deze, die daar komen aangevlogen als een wolk, en als duiven naar hun vensters? Want de eilanden zullen Mij verwachten, en de schepen van Tarsis vooreerst, om uw kinderen van verre te brengen, hun zilver en hun goud met hen, tot de Naam van de HEERE, uw God, en tot de Heilige van Israël, omdat Hij u heerlijk gemaakt heeft. En de vreemden zullen uw muren bouwen, en hun koningen zullen u dienen; want in Mijn verbolgenheid heb Ik u geslagen, maar in Mijn welbehagen heb Ik Mij over u ontfermd.", "Num 34:2-12": "Gebied de kinderen van Israël, en zeg tegen hen: Wanneer u in het land Kanaän komt, dan zal dit het land zijn dat u ter erfenis toevalt, het land Kanaän, met zijn grenzen. De zuiderkant nu zal voor u zijn vanaf de woestijn Zin, langs de zijden van Edom; en de zuidergrens zal voor u zijn vanaf het einde van de Zoutzee, in het oosten; En deze grens zal voor u omgaan van het zuiden naar de opgang van Akrabbim, en doorgaan naar Zin; en haar uiteinden zullen zijn, vanaf het zuiden naar Kades-Barnea; en zij zal uitgaan naar Hazar-Addar, en doorgaan naar Azmon.", "Gen 17:12-14": "Een zoontje van acht dagen zal bij u besneden worden, alles wat mannelijk is in uw geslachten: degene die in het huis geboren is, en degene die met geld gekocht is van elke vreemdeling die niet van uw nageslacht is; Degene die in uw huis geboren is, en degene die met uw geld gekocht is, zal zeker besneden worden; en Mijn verbond zal in uw vlees zijn, tot een eeuwig verbond. En wat mannelijk is en de voorhuid heeft, wiens vlees van de voorhuid niet besneden wordt, die persoon zal uit zijn volk uitgeroeid worden; hij heeft Mijn verbond gebroken.", "Jes 32:2": "En die man zal zijn als een schuilplaats tegen de wind, en een schuilplaats tegen de storm, als waterbeken in een dorre plaats, als de schaduw van een zware rotssteen in een dorstig land.", "Jes 50:2": "Waarom kwam Ik, en er was niemand, waarom riep Ik, en niemand antwoordde? Is Mijn hand dan helemaal kort geworden, zodat zij niet verlossen kan, of is er in Mij geen kracht om te redden? Zie, door Mijn dreigende woord maak Ik de zee droog, Ik maak de rivieren tot een woestijn, zodat hun vis stinkt, omdat er geen water is, en sterft van dorst.", "Jer 7:18": "De kinderen rapen hout, en de vaders steken het vuur aan, en de vrouwen kneden het deeg, om koeken te maken voor de koningin van de hemel, en drankoffers te offeren aan andere goden, om Mij verdriet aan te doen.", "Ps 146:3-5": "Vertrouw niet op prinsen, op een mensenkind, bij wie geen heil is. Zijn geest gaat uit, hij keert terug tot zijn aarde; op diezelfde dag vergaan zijn plannen. Gelukkig is hij die de God van Jakob tot zijn Hulp heeft, wiens verwachting op de HEERE, zijn God is;", "Micha 4:1-4": "Maar in het laatste van de dagen zal het gebeuren, dat de berg van het huis van de HEERE vastgesteld zal zijn op de top van de bergen; en hij zal verheven zijn boven de heuvels, en de volken zullen naar hem toestromen. En veel heidenvolken zullen heengaan en zeggen: Kom, laat ons opgaan naar de berg van de HEERE, en naar het huis van de God van Jakob, opdat Hij ons zijn wegen leert, en wij op Zijn paden wandelen; want uit Sion zal de wet uitgaan, en het woord van de HEERE uit Jeruzalem. En Hij zal onder grote volken rechtspreken, en machtige heidenvolken straffen, tot ver weg toe; en zij zullen hun zwaarden omsmeden tot ploegscharen, en hun speren tot snoeimessen; het ene volk zal tegen het andere volk geen zwaard opheffen, en zij zullen de oorlog niet meer leren.", "Matt 21:16": "en zeiden tegen Hem: Hoort U wel wat dezen zeggen? En Jezus zei tegen hen: Ja; hebt u nooit gelezen: Uit de mond van de jonge kinderen en de zuigelingen hebt U Zichzelf lof toebereid?", "Gal 2:20": "Ik ben met Christus gekruisigd; en ik leef, maar niet meer ik, maar Christus leeft in mij; en wat ik nu in het vlees leef, dat leef ik door het geloof van de Zoon van God, Die mij heeft liefgehad, en Zichzelf voor mij heeft overgegeven.", "Jes 49:1": "Hoort naar Mij, eilanden! En luistert toe, volken van verre! De HEERE heeft Mij geroepen van de buik af, van het ingewand van Mijn moeder af heeft Hij Mijn Naam vermeld.", "Amos 9:12": "Opdat zij het overblijfsel van Edom erfelijk bezitten, en alle heidenvolken die naar Mijn Naam genoemd worden, spreekt de HEERE, Die dit doet.", "Joh 1:9": "Dit was het waarachtige Licht, Dat ieder mens verlicht die in de wereld komt.", "Ps 132:11": "De HEERE heeft David de waarheid gezworen, waarvan Hij niet wijken zal, en zei: Van de vrucht van uw buik zal Ik op uw troon zetten.", "Matt 18:11-13": "Want de Zoon des mensen is gekomen om dat wat verloren was, zalig te maken. Wat denkt u? Als iemand honderd schapen had en één daarvan zou afdwalen, zal hij niet de negenennegentig achterlaten en de bergen op gaan om het afgedwaalde te zoeken? En als het gebeurt dat hij het vindt, voorwaar, Ik zeg u, dat hij zich meer verblijdt over dat schaap dan over de negenennegentig die niet afgedwaald zijn.", "Jes 48:17": "Zo zegt de HEERE, uw Verlosser, de Heilige van Israël: Ik ben de HEERE, uw God, Die u leert wat nuttig is, Die u leidt op de weg, die u gaan moet.", "Gen 12:11-19": "En het gebeurde, toen hij Egypte naderde om daar binnen te gaan, dat hij tegen Sarai, zijn vrouw, zei: Zie toch, ik weet dat u een vrouw bent die knap is om te zien. En het zal gebeuren, wanneer de Egyptenaren u zien, dat zij zullen zeggen: Dat is zijn vrouw; en zij zullen mij doden, en u in leven laten. Zeg toch: U bent mijn zuster; opdat het mij goed gaat om u, en ik in leven blijf om uwentwil.", "Joh 12:41": "Dit zei Jesaja, toen hij Zijn heerlijkheid zag, en over Hem sprak.", "Job 33:23": "Is er dan bij Hem een Gezant, een Uitlegger, een uit duizend, om de mens zijn rechte plicht te verkondigen;", "Ex 4:1": "Toen antwoordde Mozes, en zei: Maar zie, zij zullen mij niet geloven, en niet naar mijn stem luisteren; want zij zullen zeggen: De HEERE is u niet verschenen!", "Matt 13:56": "En Zijn zusters, zijn die niet allemaal bij ons? Waar komt dan bij Deze dit alles vandaan?", "Hand 28:25-27": "En omdat zij het onderling oneens waren, gingen zij uiteen, nadat Paulus dit ene woord gezegd had, namelijk: Terecht heeft de Heilige Geest gesproken door de profeet Jesaja tot onze voorvaders, Toen hij zei: Ga naar dit volk, en zeg: Met het gehoor zult u horen, en beslist niet begrijpen; en ziende zult u zien, en beslist niet opmerken. Want het hart van dit volk is ongevoelig geworden, en met de oren hebben zij slecht gehoord, en hun ogen hebben zij gesloten; opdat zij niet op enig moment met de ogen zouden zien, en met de oren horen, en met het hart begrijpen, en zich zouden bekeren, en Ik hen zou genezen.", "Jes 41:9": "U, die Ik gegrepen heb van de einden van de aarde, en uit haar voornaamste mannen geroepen heb; en tegen wie Ik zei: U bent Mijn knecht; u heb Ik uitverkoren, en Ik heb u niet verworpen.", "Ps 18:50": "Daarom zal ik U, o HEERE! loven onder de heidenen; en Uw Naam zal ik psalmzingen;", "Amos 9:11": "Op die dag zal Ik de vervallen hut van David weer oprichten, en Ik zal haar scheuren dichtmaken, en wat aan haar is afgebroken weer oprichten, en zal haar bouwen, als in de dagen van vroeger;", "Zach 9:9-17": "Verheug u zeer, dochter van Sion! Juich, dochter van Jeruzalem! Zie, uw Koning zal tot u komen, rechtvaardig, en Hij is een Heiland; arm, en rijdend op een ezel, en op een veulen, het jong van de ezelinnen. En Ik zal de wagens uit Efraïm uitroeien, en de paarden uit Jeruzalem; ook zal de strijdboog uitgeroeid worden, en Hij zal tot de heidenen vrede spreken; en Zijn heerschappij zal zijn van zee tot aan zee, en van de rivier tot aan de einden van de aarde. U ook aangaande, o Sion! Door het bloed van het verbond met u, heb Ik uw gebondenen uit de kuil, waar geen water in is, uitgelaten.", "Joz 24:2": "Toen zei Jozua tegen het hele volk: Zo zegt de HEERE, de God van Israël: Aan de overkant van de rivier hebben uw vaders vanouds gewoond, namelijk Terah, de vader van Abraham, en de vader van Nahor; en zij hebben andere goden gediend.", "Gen 4:26": "En ook aan diezelfde Seth werd een zoon geboren, en hij noemde zijn naam Enos. Toen begon men de Naam van de HEERE aan te roepen.", "1 Kon 3:2": "Alleen offerde het volk op de hoogten, want er was nog geen huis gebouwd voor de Naam van de HEERE, tot op die dagen.", "1 Joh 4:10": "Hierin is de liefde: niet dat wij God liefgehad hebben, maar dat Hij ons lief heeft gehad, en Zijn Zoon gezonden heeft tot een verzoening voor onze zonden.", "Mark 4:26-32": "En Hij zei: Zo is het Koninkrijk van God, alsof een mens het zaad in de aarde wierp; en vervolgens sliep en opstond, nacht en dag; en het zaad ontkiemde en groeide op, terwijl hij zelf niet wist hoe. Want de aarde brengt uit zichzelf vruchten voort: eerst het kruid, daarna de aar, daarna het volle koren in de aar.", "Deut 12:9": "Want u bent tot nu toe niet gekomen in de rust en in de erfenis die de HEERE, uw God, u geven zal.", "Hand 3:22-24": "Want Mozes heeft tegen de vaderen gezegd: De Heere, uw God, zal u een Profeet doen opstaan uit uw broeders, zoals mij; naar Hem moet u luisteren, in alles wat Hij tegen u zal zeggen. En het zal gebeuren dat iedere ziel die niet naar deze Profeet zal hebben geluisterd, uitgeroeid zal worden uit het volk. En ook al de profeten, van Samuel af, en die daarna gevolgd zijn, zovelen als er gesproken hebben, hebben ook deze dagen van tevoren verkondigd.", "1 Joh 5:11-13": "En dit is het getuigenis, namelijk dat God ons het eeuwige leven gegeven heeft; en dit leven is in Zijn Zoon. Wie de Zoon heeft, die heeft het leven; wie de Zoon van God niet heeft, die heeft het leven niet. Deze dingen heb ik u geschreven, die gelooft in de Naam van de Zoon van God; opdat u weet dat u het eeuwige leven hebt, en opdat u gelooft in de Naam van de Zoon van God.", "1 Tim 5:18": "Want de Schrift zegt: Een dorsende os zult u niet muilbanden; en: De arbeider is zijn loon waard.", "Deut 25:4": "Een os zult u niet muilbanden, als hij graan dorst.", "Jes 40:6-8": "Een stem zegt: Roept! En hij zegt: Wat zal ik roepen? Alle vlees is gras, en al zijn goedertierenheid als een bloem van het veld. Het gras verdort, de bloem valt af, als de Geest van de HEERE daarin waait; voorwaar, het volk is gras. Het gras verdort, de bloem valt af; maar het Woord van onze God bestaat in eeuwigheid.", "1 Kon 19:14": "En hij zei: Ik heb mij zeer sterk ingezet voor de HEERE, de God van de heerscharen; want de Israëlieten hebben Uw verbond verlaten, Uw altaren afgebroken en Uw profeten met het zwaard gedood; en ik alleen ben overgebleven, en zij zoeken mij te doden.", "1 Petr 1:5": "Die in de kracht van God bewaard wordt door het geloof tot de zaligheid, die klaarligt om geopenbaard te worden in de laatste tijd.", "Joh 10:9-11": "Ik ben de Deur; als iemand door Mij ingaat, zal hij behouden worden; en hij zal ingaan en uitgaan, en weide vinden. De dief komt niet dan om te stelen, en te slachten, en te verderven; Ik ben gekomen, opdat zij het leven hebben, en overvloed hebben. Ik ben de goede Herder; de goede herder geeft zijn leven voor de schapen.", "Jes 6:10": "Maak het hart van dit volk vet, en maak hun oren zwaar, en sluit hun ogen, opdat het niet ziet met zijn ogen, of met zijn oren hoort, of met zijn hart begrijpt, of zich bekeert, en Hij het geneest.", "Gen 26:4": "En Ik zal uw nageslacht vermenigvuldigen als de sterren van de hemel, en zal aan uw nageslacht al deze landen geven; en in uw nageslacht zullen alle volken van de aarde gezegend worden,", "Hand 11:17": "Als God hun dan dezelfde gave gegeven heeft als ook ons, die in de Heere Jezus Christus geloofd hebben, wie was ik dan, dat ik God zou kunnen tegenhouden?", "1 Petr 1:18": "want u weet dat u niet met vergankelijke dingen, zilver of goud, verlost bent uit uw zinloze levenswandel, die u van uw voorouders had overgeërfd,", "Hebr 11:9": "Door het geloof is hij een inwoner geweest in het land van de belofte, als in een vreemd land, en heeft hij in tenten gewoond met Izak en Jakob, die medeerfgenamen waren van dezelfde belofte.", "Jes 54:1": "Zing vrolijk, u onvruchtbare, die niet gebaard hebt! Maak geschal met vrolijk gezang, en juich, die geen barensnood gehad hebt! Want de kinderen van de eenzame zijn meer dan de kinderen van de getrouwde, zegt de HEERE.", "Gen 12:14-20": "En het gebeurde, toen Abram in Egypte kwam, dat de Egyptenaren deze vrouw zagen, dat zij zeer knap was. Ook zagen de vorsten van Farao haar, en prezen haar bij Farao; en die vrouw werd meegenomen naar het huis van Farao. En hij deed Abram goed omwille van haar; zodat hij schapen had, en runderen, en ezels, en knechten, en dienstmeisjes, en ezelinnen, en kamelen.", "Num 10:33": "Zo trokken zij drie dagreizen van de berg van de HEERE; en de ark van het verbond van de HEERE reisde voor hun aangezicht drie dagreizen, om voor hen een rustplaats uit te speuren.", "Gen 2:7": "En de HEERE God had de mens gevormd uit het stof van de aarde, en in zijn neusgaten de adem van het leven geblazen; zo werd de mens tot een levende ziel.", "Mark 9:44": "Waar hun worm niet sterft, en het vuur niet uitgeblust wordt.", "Dan 7:27": "Maar het rijk, en de heerschappij, en de grootheid van de koninkrijken onder de hele hemel, zal gegeven worden aan het volk van de heiligen van de hoge plaatsen, wiens Rijk een eeuwig Rijk zal zijn; en alle heerschappijen zullen Hem eren en gehoorzamen.", "Jes 60:1-5": "Maak u op, word verlicht, want uw licht komt, en de heerlijkheid van de HEERE gaat over u op. Want zie, de duisternis zal de aarde bedekken, en donkerheid de volken; maar over u zal de HEERE opgaan, en Zijn heerlijkheid zal over u gezien worden. En de heidenen zullen naar uw licht gaan, en koningen naar de glans die over u is opgegaan.", "Matt 2:6": "En u, Bethlehem, land van Juda! U bent geenszins de minste onder de vorsten van Juda; want uit u zal de Leidsman voortkomen, Die Mijn volk Israël weiden zal.", "Gen 47:4": "Verder zeiden zij tegen Farao: Wij zijn gekomen om als vreemdelingen in dit land te wonen; want er is geen weide voor de schapen die uw knechten hebben, omdat de honger zwaar is in het land Kanaän; en laat nu toch uw knechten in het land Gosen wonen!", "Luk 7:22": "En Jezus antwoordde en zei tegen hen: Ga heen, en vertel Johannes weer wat u gezien en gehoord hebt: dat de blinden ziende worden, de kreupelen lopen, de melaatsen gereinigd worden, de doven horen, de doden opgewekt worden, aan de armen het Evangelie verkondigd wordt.", "Hab 2:3": "Want het visioen is nog bestemd voor een vastgestelde tijd, maar op het einde zal Hij het vervullen, en het zal niet liegen; al blijft het uit, verwacht het toch, want het zal zeker komen, het zal niet achterblijven.", "2 Kor 5:19": "Want God was in Christus de wereld met Zichzelf aan het verzoenen, doordat Hij hun zonden hun niet toerekende; en Hij heeft het woord van de verzoening in ons gelegd.", "Ef 1:11": "In Hem, in Wie wij ook een erfdeel geworden zijn, wij, die van tevoren voorbestemd waren naar het voornemen van Hem die alle dingen werkt naar de raad van Zijn wil;", "Gen 22:16-18": "En zei: Ik zweer bij Mijzelf, spreekt de HEERE; omdat u dit gedaan hebt, en uw zoon, uw enige, niet onthouden hebt; Voorzeker zal Ik u rijk zegenen, en uw nageslacht zeer talrijk maken, als de sterren van de hemel, en als het zand dat aan de oever van de zee is; en uw nageslacht zal de poort van zijn vijanden erfelijk bezitten. En in uw nageslacht zullen alle volken van de aarde gezegend worden, omdat u Mijn stem gehoorzaam bent geweest.", "Hand 7:34": "Ik heb zeker gezien de mishandeling van Mijn volk, dat in Egypte is, en Ik heb hun zuchten gehoord en ben neergekomen om hen daaruit te verlossen; en nu, kom hierheen, Ik zal u naar Egypte zenden.", "Hand 5:31": "Deze heeft God door Zijn rechterhand verhoogd tot een Vorst en Zaligmaker, om Israël bekering en vergeving van zonden te geven.", "1 Joh 4:14": "En wij hebben het gezien, en getuigen dat de Vader Zijn Zoon gezonden heeft tot een Zaligmaker van de wereld.", "Hebr 11:14": "Want wie zulke dingen zeggen, laten daarmee duidelijk zien dat zij een vaderland zoeken.", "Job 1:5": "Het gebeurde dan, als de dagen van de maaltijden voorbij waren, dat Job hen liet halen en hen heiligde en 's morgens vroeg opstond en brandoffers offerde naar hun aller getal; want Job zei: Misschien hebben mijn kinderen gezondigd, en God in hun hart vervloekt. Zo deed Job al die dagen.", "Job 1:17": "Terwijl deze nog sprak, kwam er een ander en zei: De Chaldeeën stelden drie groepen op, en vielen de kamelen aan, en namen ze mee, en sloegen de knechten met de scherpte van het zwaard; en ik ben maar alleen ontkomen om het u te vertellen.", "1 Sam 27:1": "David zei in zijn hart: Nu zal ik op een dag door de hand van Saul omkomen. Ik kan niets beters doen dan snel ontkomen naar het land van de Filistijnen, opdat Saul de hoop op mij verliest en mij niet langer zoekt in heel het gebied van Israël; zo zal ik ontkomen uit zijn hand.", "Hand 7:11": "En er kwam een hongersnood over het hele land van Egypte en Kanaän, en grote nood; en onze vaders vonden geen voedsel.", "Matt 4:6": "en zei tegen Hem: Als U Gods Zoon bent, werp Uzelf naar beneden; want er is geschreven dat Hij Zijn engelen bevelen zal U te beschermen, en dat zij U op de handen zullen dragen, opdat U niet op enig moment Uw voet aan een steen stoot.", "Joz 1:5": "Niemand zal voor uw aangezicht standhouden al de dagen van uw leven; zoals Ik met Mozes geweest ben, zal Ik met u zijn; Ik zal u niet begeven, en zal u niet verlaten.", "Ps 40:7-11": "Gij hebt geen lust gehad aan slachtoffer en spijsoffer; Gij hebt mij de oren doorboord; brandoffer en zondoffer hebt Gij niet geëist. Toen zei ik: Zie, ik kom; in de rol van het boek is van mij geschreven. Ik heb lust, o mijn God! om Uw welbehagen te doen; en Uw wet is in het midden van mijn ingewand.", "Ps 139:10": "ook daar zou Uw hand mij leiden, en Uw rechterhand zou mij vasthouden.", "Ex 16:18": "Maar toen zij het met de gomer maten, had hij die veel verzameld had, niets over, en hem die weinig verzameld had, ontbrak niets; ieder verzamelde zoveel als hij eten kon.", "Zach 6:15": "En zij die ver weg zijn, zullen komen, en zullen bouwen in de tempel van de HEERE, en u zult weten, dat de HEERE van de heerscharen mij tot u gezonden heeft. Dit zal gebeuren, als u vlijtig zult horen naar de stem van de HEERE, van uw God.", "Ps 66:4": "De hele aarde aanbidt U, en zingt U psalmen; zij zingt Uw Naam psalmen. Sela.", "1 Tim 1:15": "Dit is een betrouwbaar woord, en alle aanneming waard, dat Christus Jezus in de wereld gekomen is om de zondaars zalig te maken, van wie ik de voornaamste ben.", "Gen 18:1": "Daarna verscheen de HEERE hem bij de eikenbossen van Mamre, toen hij in de deur van de tent zat, op het heetst van de dag.", "Openb 19:6": "En ik hoorde als een stem van een grote menigte, en als een stem van veel water, en als een stem van sterke donderslagen, die zei: Halleluja, want de Heere, de almachtige God, heeft als Koning geheerst.", "Gen 13:15": "Want al dit land, dat u ziet, zal Ik u geven, en aan uw nageslacht, tot in eeuwigheid.", "Openb 20:4-6": "En ik zag tronen, en zij zaten daarop; en het oordeel werd hun gegeven; en ik zag de zielen van hen die onthoofd waren om de getuigenis van Jezus, en om het Woord van God, en die het beest, en zijn beeld niet aangebeden hadden, en die het merkteken niet ontvangen hadden aan hun voorhoofd en aan hun hand; en zij leefden en heersten als koningen met Christus, de duizend jaar. Maar de overigen van de doden werden niet weer levend, totdat de duizend jaar geëindigd waren. Dit is de eerste opstanding. Gelukkig en heilig is hij, die deel heeft in de eerste opstanding; over hen heeft de tweede dood geen macht, maar zij zullen priesters van God en Christus zijn, en zij zullen met Hem als koningen heersen, duizend jaar.", "Jes 30:20": "De Heere zal u wel brood van de benauwdheid, en water van de verdrukking geven; maar uw leraars zullen niet meer als met vleugels wegvliegen, maar uw ogen zullen uw leraars zien;", "Openb 11:15": "En de zevende engel heeft op de bazuin geblazen, en er kwamen grote stemmen in de hemel, die zeiden: De koninkrijken van de wereld zijn van onze Heere geworden en van Zijn Christus, en Hij zal als Koning heersen tot in alle eeuwigheid.", "Ps 91:16": "Ik zal hem met lengte van dagen verzadigen, en Ik zal hem Mijn heil doen zien.", "Ps 72:4": "Hij zal de ellendigen van het volk richten; hij zal de kinderen van de behoeftige verlossen, en de verdrukker verbrijzelen.", "Gen 28:14": "En uw nageslacht zal zijn als het stof van de aarde, en u zult uitbreiden in menigte, westwaarts en oostwaarts, en noordwaarts en zuidwaarts; en in u, en in uw nageslacht zullen alle geslachten van de aardbodem gezegend worden.", "Jes 61:2": "Om uit te roepen het jaar van het welbehagen van de HEERE, en de dag van de wraak van onze God; om alle treurenden te troosten;", "Gen 22:12": "Toen zei Hij: Strek uw hand niet uit naar de jongen, en doe hem niets! Want nu weet Ik dat u God vrezend bent, en uw zoon, uw enige, niet van Mij hebt onthouden.", "Deut 24:15": "Op zijn dag zult u hem zijn loon geven, en de zon zal daarover niet ondergaan; want hij is arm, en zijn ziel verlangt daarnaar; zodat hij tegen u niet roept tot de HEERE, en er zonde in u is.", "Num 11:21": "En Mozes zei: Zeshonderdduizend man te voet is dit volk, in wiens midden ik ben; en U hebt gezegd: Ik zal hun vlees geven, en zij zullen een hele maand eten!", "Gal 4:27": "Want er is geschreven: Wees vrolijk, u onvruchtbare, die niet baart, breek uit en roep, u die geen weeën hebt, want de kinderen van de eenzame zijn veel meer dan van haar die de man heeft.", "1 Petr 2:25": "Want u was als dwalende schapen; maar u bent nu bekeerd tot de Herder en Opziener van uw zielen.", "Ps 34:13-17": "Mem. Wie is de man die lust heeft ten leven, die dagen liefheeft om het goede te zien? Nun. Bewaar uw tong voor het kwaad, en uw lippen voor het spreken van bedrog. Samech. Wijk af van het kwaad, en doe het goede; zoek de vrede, en jaag die na.", "Ezech 33:24": "Mensenkind! De inwoners van die verwoeste plaatsen in het land van Israël zeggen: Abraham was maar één man, en bezat dit land erfelijk; maar wij zijn met velen; het land is ons gegeven tot erfelijk bezit.", "Jes 8:23": "Maar het land dat beangstigd was, zal niet helemaal verduisterd worden; zoals Hij het in de eerste tijd verachtelijk gemaakt heeft, naar het land van Zebulon toe en naar het land van Nafthali toe, zo heeft Hij het in het laatste heerlijk gemaakt, naar de weg zeewaarts toe gelegen over de Jordaan, aan Galilea van de heidenen.", "Gen 26:14": "En hij had bezit aan schapen, en bezit aan runderen, en een groot gezin; zodat de Filistijnen hem benijdden.", "Joh 12:14": "En Jezus vond een jonge ezel, en ging daarop zitten, zoals geschreven is:", "Ps 16:10": "Want U zult mijn ziel in het graf niet verlaten; U zult niet toelaten dat Uw Heilige de ontbinding ziet.", "Matt 13:17": "Want voorwaar, Ik zeg u, dat veel profeten en rechtvaardigen begeerd hebben te zien wat u ziet, en het niet gezien hebben; en te horen wat u hoort, en het niet gehoord hebben.", "1 Tim 4:10": "Want hiervoor spannen wij ons in en worden wij versmaad, omdat wij onze hoop gevestigd hebben op de levende God, Die een Redder is van alle mensen, maar vooral van de gelovigen.", "Joël 2:32": "En het zal gebeuren, dat ieder die de Naam van de HEERE zal aanroepen, behouden zal worden; want op de berg Sion en te Jeruzalem zal ontkoming zijn, zoals de HEERE gezegd heeft; en dat, bij de overgeblevenen, die de HEERE zal roepen.", "Hebr 12:26": "Wiens stem toen de aarde deed beven; maar nu heeft Hij verkondigd en gezegd: Nog eenmaal zal Ik niet alleen de aarde doen beven, maar ook de hemel.", "Ps 69:23": "Hun tafel moet voor hun gezicht tot een strik worden, en tot volle vergelding tot een valstrik.", "Luk 2:11": "namelijk dat u heden geboren is de Zaligmaker, Die is Christus, de Heere, in de stad van David.", "Jer 16:19-21": "O HEERE! U bent mijn Sterkte, en mijn Sterkheid, en mijn Toevlucht ten dage van de benauwdheid; tot U zullen de heidenen komen van de einden van de aarde, en zeggen: Zeker hebben onze vaders leugen erfelijk bezeten, en ijdelheid, waarin toch niets was, dat nut deed. Zal een mens zich goden maken? Zij zijn toch geen goden. Daarom, zie, Ik zal hun bekendmaken op dit moment; Ik zal hun Mijn hand en Mijn macht bekendmaken; en zij zullen weten, dat Mijn Naam is HEERE.", "Joh 4:22": "U aanbidt wat u niet weet; wij aanbidden wat wij weten; want de zaligheid is uit de Joden.", "Jes 51:6": "Hef uw ogen op naar de hemel, en kijk naar de aarde beneden; want de hemel zal als rook verdwijnen, en de aarde zal als een kleed verouderen, en haar inwoners zullen op dezelfde manier sterven; maar Mijn heil zal in eeuwigheid zijn, Mijn gerechtigheid zal niet verbroken worden.", "Mark 16:10": "Zij ging heen, en vertelde het aan hen die met Hem geweest waren, die treurden en weenden.", "Gen 16:16": "En Abram was zesentachtig jaar oud, toen Hagar Ismaël aan Abram baarde.", "Ps 89:2-38": "Ik zal de goedertierenheid van de HEERE eeuwig zingen; ik zal Uw waarheid met mijn mond bekend maken, van geslacht tot geslacht. Want ik heb gezegd: Uw goedertierenheid zal eeuwig gebouwd worden; in de hemelen zelf hebt Gij Uw waarheid bevestigd, en gezegd: Ik heb een verbond gemaakt met Mijn uitverkorene; Ik heb Mijn knecht David gezworen:", "Ex 23:22": "Maar als u Zijn stem echt gehoorzaamt, en doet al wat Ik zeggen zal, dan zal Ik de vijand van uw vijanden zijn, en de tegenstander van wie u tegenstaat.", "Hand 14:22": "en versterkten de harten van de discipelen, en vermaanden hen om te blijven in het geloof, en dat wij door veel verdrukkingen het Koninkrijk van God moeten binnengaan.", "Jes 42:16": "En Ik zal de blinden leiden door de weg die zij niet gekend hebben, Ik zal ze doen gaan door de paden die zij niet gekend hebben; Ik zal de duisternis voor hun ogen tot licht maken, en het kromme tot recht; deze dingen zal Ik hun doen, en Ik zal hen niet verlaten.", "Ex 15:13": "U leidde door Uw goedheid dit volk, dat U verlost hebt; U voert hen zachtjes door Uw sterkte naar de liefelijke woning van Uw heiligheid.", "Ps 96:1-13": "Zingt de HEERE een nieuw lied; zingt de HEERE, heel de aarde! Zingt de HEERE, looft Zijn Naam; verkondigt Zijn heil van dag tot dag. Vertelt onder de heidenen Zijn eer, onder alle volken Zijn wonderen.", "Gen 31:54": "Toen slachtte Jakob een offer op dat gebergte, en hij nodigde zijn broeders om brood te eten; en zij aten brood, en overnachtten op dat gebergte.", "Hab 2:4": "Zie, wie zich verheft, zijn ziel is niet oprecht in hem; maar de rechtvaardige zal door zijn geloof leven.", "Gen 18:12-14": "Zo lachte Sara bij zichzelf en zei: Zal ik nog wellust hebben, nu ik oud geworden ben, en mijn heer ook oud is? En de HEERE zei tegen Abraham: Waarom heeft Sara gelachen en gezegd: Zou ik werkelijk nog een kind baren, nu ik oud geworden ben? Zou iets voor de HEERE te wonderlijk zijn? Op de vastgestelde tijd zal Ik bij u terugkomen, omstreeks deze tijd volgend jaar, en Sara zal een zoon hebben!", "2 Petr 2:22": "Maar hun is overkomen wat een waar spreekwoord zegt: De hond is teruggekeerd naar zijn eigen uitbraaksel; en het gewassen varken naar de modderpoel om zich erin te wentelen.", "Deut 4:37": "En omdat Hij uw vaderen liefhad, en hun nageslacht na hen verkoren had, zo heeft Hij u voor Zijn aangezicht door Zijn grote kracht uit Egypte weggevoerd;", "Gen 28:19": "En hij noemde de naam van die plaats Beth-el; hoewel de naam van die stad vroeger Luz was.", "1 Kor 6:16": "Of weet u niet, dat wie zich aan een hoer hecht, één lichaam met haar is? Want die twee, zegt Hij, zullen tot één vlees worden.", "Spr 20:7": "De rechtvaardige wandelt steeds in zijn oprechtheid; gelukkig zijn zijn kinderen na hem.", "Gen 22:11": "Maar de Engel van de HEERE riep tot hem vanuit de hemel, en zei: Abraham, Abraham! En hij zei: Zie, hier ben ik!", "Deut 24:1": "Wanneer een man een vrouw genomen en die getrouwd heeft, dan zal het gebeuren, als zij geen genade vindt in zijn ogen, omdat hij iets van schande aan haar gevonden heeft, dat hij haar een scheidbrief zal schrijven, en die in haar hand geven, en haar laten gaan uit zijn huis.", "Ex 20:14": "U zult geen echtbreuk plegen.", "2 Kor 5:21": "Want Hem Die geen zonde gekend heeft, heeft Hij voor ons tot zonde gemaakt, opdat wij zouden worden rechtvaardigheid van God in Hem.", "Ps 36:9": "Zij worden dronken van de vettigheid van uw huis; en U drenkt hen uit de beek van Uw wellusten.", "Hos 11:1": "Toen Israël een kind was, heb Ik hem liefgehad, en Ik heb Mijn zoon uit Egypte geroepen.", "Openb 12:10": "En ik hoorde een grote stem, die zei in de hemel: Nu is de zaligheid, en de kracht, en het koninkrijk van onze God gekomen; en de macht van Zijn Christus; want de aanklager van onze broeders, die hen aanklaagde voor onze God dag en nacht, is neergeworpen.", "Ex 1:8": "Daarna kwam er een nieuwe koning over Egypte aan de macht, die Jozef niet gekend had;", "Ex 3:11": "Toen zei Mozes tegen God: Wie ben ik, dat ik naar Farao zou gaan; en dat ik de kinderen van Israël uit Egypte zou voeren?", "Mark 10:19": "U kent de geboden: U zult geen overspel plegen; u zult niet doden; u zult niet stelen; u zult geen vals getuigenis geven; u zult niemand tekortdoen; eer uw vader en uw moeder.", "Hand 8:33": "In Zijn vernedering is Zijn oordeel weggenomen; en wie zal Zijn geslacht verhalen? Want Zijn leven wordt van de aarde weggenomen.", "Rom 9:29": "En zoals Jesaja van tevoren gezegd heeft: Als de Heere Sebaoth ons geen nageslacht had overgelaten, dan waren wij geworden als Sodom, en gelijk gemaakt aan Gomorra.", "Hand 4:11": "Hij is de Steen, Die door u, de bouwlieden, veracht is, Die tot een hoeksteen geworden is.", "Rom 14:11": "Want er is geschreven: Ik leef, zegt de Heere, voor Mij zal elke knie zich buigen, en elke tong zal God belijden.", "Mark 12:11": "Dit is door de Heere gebeurd, en het is wonderlijk in onze ogen?", "Ex 20:17": "U zult niet begeren het huis van uw naaste; u zult niet begeren de vrouw van uw naaste, of zijn dienstknecht, of zijn dienstmaagd, of zijn os, of zijn ezel, of iets dat van uw naaste is.", "Jer 4:2": "Maar zweer: Zo waarachtig als de HEERE leeft! in waarheid, in recht en in gerechtigheid; dan zullen de heidenvolken zich in Hem zegenen, en zich in Hem beroemen.", "Matt 5:31": "Er is ook gezegd: Wie zijn vrouw verlaat, moet haar een scheidbrief geven.", "Openb 22:16": "Ik, Jezus, heb Mijn engel gezonden om u deze dingen te getuigen in de Gemeenten. Ik ben de Wortel en het geslacht van David, de blinkende Morgenster.", "Jes 56:3-8": "En de vreemdeling, die zich bij de HEERE gevoegd heeft, moet niet zeggen: De HEERE heeft mij helemaal van Zijn volk gescheiden; en de ontmande moet niet zeggen: Zie, ik ben een dorre boom. Want zo zegt de HEERE van de ontmanden, die Mijn sabbatten houden, en verkiezen wat Mij behaagt, en vasthouden aan Mijn verbond; Ik zal hun ook in Mijn huis en binnen Mijn muren een plaats en een naam geven, beter dan van zonen en dan van dochters; een eeuwige naam zal Ik ieder van hen geven, die niet uitgeroeid zal worden.", "Hebr 12:27": "En dit woord: Nog eenmaal, wijst aan de verandering van de dingen die bewegen kunnen, alsof zij gemaakt waren, opdat blijven zouden de dingen die niet bewegen kunnen.", "Matt 19:4": "Maar Hij antwoordde en zei tegen hen: Hebt u niet gelezen dat Hij Die van het begin de mens gemaakt heeft, hen gemaakt heeft man en vrouw?", "Hebr 8:11": "En zij zullen niet leren, ieder zijn naaste en ieder zijn broeder, en zeggen: Ken de Heere; want zij zullen Mij allen kennen, van de kleinste onder hen tot de grootste onder hen.", "Ps 68:32": "Prinselijke gezanten zullen komen uit Egypte; Morenland zal zich haasten zijn handen tot God uit te strekken.", "Hebr 1:5": "Want tegen wie van de engelen heeft Hij ooit gezegd: U bent Mijn Zoon, heden heb Ik U verwekt? En opnieuw: Ik zal Hem tot een Vader zijn, en Hij zal Mij tot een Zoon zijn?", "2 Kon 7:1": "Toen zei Elisa: Hoor het woord van de HEERE; zo zegt de HEERE: Morgen omtrent deze tijd zal een maat meelbloem verkocht worden voor een sikkel, en twee maten gerst voor een sikkel, in de poort van Samaria.", "Matt 13:35": "Opdat vervuld zou worden wat gesproken is door de profeet, die zei: Ik zal Mijn mond opendoen door gelijkenissen; Ik zal dingen voortbrengen die verborgen waren van de grondlegging van de wereld af.", "Joh 3:17": "Want God heeft Zijn Zoon niet in de wereld gezonden opdat Hij de wereld zou veroordelen, maar opdat de wereld door Hem behouden zou worden.", "Jer 23:5": "Zie, de dagen komen, spreekt de HEERE, dat Ik voor David een rechtvaardige Spruit zal doen opstaan; Die zal Koning zijnde regeren, en voorspoedig zijn, en recht en gerechtigheid doen op de aarde.", "Ex 3:6": "Hij zei verder: Ik ben de God van uw vader, de God van Abraham, de God van Izak en de God van Jakob. En Mozes verborg zijn gezicht, want hij was bang om God aan te zien.", "Hand 7:3-8": "en zei tegen hem: Ga uit uw land en uit uw familie, en kom in een land dat Ik u wijzen zal. Toen ging hij weg uit het land van de Chaldeeën, en woonde in Haran. En vandaar, nadat zijn vader gestorven was, bracht Hij hem over naar dit land, waarin u nu woont. En Hij gaf hem geen erfdeel daarin, zelfs geen voetstap; maar Hij beloofde dat Hij het hem tot een bezitting geven zou, en aan zijn nageslacht na hem, terwijl hij nog geen kind had.", "Ps 110:1-7": "Een psalm van David. De HEERE heeft tot mijn Heere gesproken: Zit aan Mijn rechterhand, totdat Ik Uw vijanden gezet zal hebben tot een voetbank van Uw voeten. De HEERE zal de scepter van Uw sterkte zenden uit Sion, en zeggen: Heers in het midden van Uw vijanden. Uw volk zal zeer gewillig zijn op de dag van Uw heirkracht, in heilig sieraad; uit de baarmoeder van het dageraad zal U de dauw van Uw jeugd zijn.", "Matt 2:13": "Toen zij vertrokken waren, zie, de engel van de Heere verschijnt aan Jozef in de droom en zegt: Sta op, neem het Kindje en Zijn moeder tot u, en vlucht naar Egypte, en blijf daar totdat ik het u zeg; want Herodes zal het Kindje zoeken om Het te doden.", "Luk 2:10": "En de engel zei tegen hen: Wees niet bang, want zie, ik verkondig u grote blijdschap, die er voor heel het volk zijn zal;", "Gal 2:13": "En ook de andere Joden veinsden met hem mee; zodat ook Barnabas werd meegesleept door hun veinzerij.", "Ps 102:19-23": "Dat zal geschreven worden voor het volgende geslacht; en het volk, dat geschapen zal worden, zal de HEERE loven; Omdat Hij uit de hoogte van het heiligdom zal hebben neerwaarts gezien; dat de HEERE uit de hemel op de aarde geschouwd zal hebben; Om het zuchten van de gevangenen te horen, om los te maken de kinderen van de dood;", "Jes 10:22": "Want ofschoon uw volk, o Israël, is als het zand van de zee, zo zal toch maar het overblijfsel daarvan terugkeren; de verdelging is vast besloten, overvloeiend met gerechtigheid.", "Luk 14:27": "En wie zijn kruis niet draagt en Mij navolgt, die kan Mijn discipel niet zijn.", "Deut 6:16": "U zult de HEERE, uw God, niet beproeven, zoals u Hem beproefd hebt te Massa.", "Jes 54:1-3": "Zing vrolijk, u onvruchtbare, die niet gebaard hebt! Maak geschal met vrolijk gezang, en juich, die geen barensnood gehad hebt! Want de kinderen van de eenzame zijn meer dan de kinderen van de getrouwde, zegt de HEERE. Maak de plaats van uw tenten wijd, en laat men de gordijnen van uw woningen uitbreiden, verhinder het niet; maak uw koorden lang, en steek uw pinnen vast in. Want u zult uitbreken ter rechter hand en ter linkerhand; en uw nageslacht zal de heidenen erven, en zij zullen de verwoeste steden doen bewonen.", "Ps 132:16": "En haar priesters zal Ik met heil bekleden, en haar gunstgenoten zullen zeer juichen.", "Gen 25:23": "En de HEERE zei tegen haar: Twee volken zijn in uw buik, en twee naties zullen zich uit uw ingewand van elkaar scheiden; en het ene volk zal sterker zijn dan het andere volk; en de oudste zal de jongste dienen.", "Ps 135:12": "En Hij gaf hun land tot erfenis, tot erfenis aan Zijn volk Israël.", "Ps 25:9": "Jod. Hij zal de zachtmoedigen leiden in het recht, en Hij zal de zachtmoedigen Zijn weg leren.", "Openb 22:1": "En hij toonde mij een zuivere rivier van het water des levens, klaar als kristal, die uit de troon van God en van het Lam kwam.", "Jes 1:18": "Kom dan, en laten wij samen rechten, zegt de HEERE; al waren uw zonden als scharlaken, zij zullen wit worden als sneeuw, al waren zij rood als karmozijn, zij zullen worden als witte wol.", "Matt 2:12": "En omdat zij door God in een droom gewaarschuwd waren dat zij niet naar Herodes zouden terugkeren, vertrokken zij via een andere weg naar hun land.", "Luk 4:19": "Om aan de gevangenen vrijlating te prediken, en aan de blinden het gezicht, om de verslagenen in vrijheid heen te zenden; om te prediken het aangename jaar van de Heere.", "Matt 19:30": "Maar veel eersten zullen de laatsten zijn, en veel laatsten de eersten.", "Gen 7:1": "Daarna zei de HEERE tegen Noach: Ga u, en heel uw huis in de ark; want u heb Ik gezien als rechtvaardige voor Mijn aangezicht in dit geslacht.", "Jes 51:2": "Kijk naar Abraham, uw vader, en naar Sara, die u gebaard heeft; want Ik riep hem, toen hij nog alleen was, en Ik zegende hem, en Ik vermenigvuldigde hem.", "Tit 1:4": "aan Titus, mijn oprechte zoon, naar het gemeenschappelijke geloof: genade, barmhartigheid, vrede zij u van God de Vader, en de Heere Jezus Christus, onze Zaligmaker.", "1 Petr 3:18": "Want Christus heeft ook eenmaal voor de zonden geleden, Hij, de Rechtvaardige, voor de onrechtvaardigen, opdat Hij ons tot God zou brengen; Hij is wel gedood in het vlees, maar levend gemaakt door de Geest;", "Joh 14:8-11": "Filippus zei tegen Hem: Heere, toon ons de Vader, en het is ons genoeg. Jezus zei tegen hem: Ben Ik zo lange tijd bij u, en hebt u Mij niet gekend, Filippus? Wie Mij gezien heeft, heeft de Vader gezien; en hoe zegt u dan: Toon ons de Vader? Gelooft u niet dat Ik in de Vader ben, en de Vader in Mij is? De woorden die Ik tegen u spreek, spreek Ik niet uit Mijzelf, maar de Vader, Die in Mij blijft, Die doet de werken.", "Tit 2:11": "Want de genade van God die zaligmakend is, is verschenen aan alle mensen.", "Jes 2:2-5": "En het zal gebeuren in de laatste dagen, dat de berg van het huis van de HEERE vastgesteld zal zijn op de top van de bergen, en dat hij verheven zal worden boven de heuvels, en tot hem zullen alle heidenvolken toevloeien. En veel volken zullen heengaan en zeggen: Kom, laat ons opgaan tot de berg van de HEERE, tot het huis van de God van Jakob, opdat Hij ons leert van Zijn wegen, en dat wij wandelen in Zijn paden; want uit Sion zal de wet uitgaan, en het woord van de HEERE uit Jeruzalem. En Hij zal rechtspreken onder de heidenvolken, en bestraffen veel volken; en zij zullen hun zwaarden slaan tot spaden, en hun speren tot snoeimessen; het ene volk zal tegen het andere volk geen zwaard opheffen, en zij zullen geen oorlog meer leren.", "Matt 13:14": "En in hen wordt de profetie van Jesaja vervuld, die zegt: Met het gehoor zult u horen, en geenszins begrijpen; en ziende zult u zien, en geenszins opmerken.", "Gen 3:15": "En Ik zal vijandschap zetten tussen u en de vrouw, en tussen uw nageslacht en haar Nageslacht; Dat zal u de kop vermorzelen, en u zult Het de hiel vermorzelen.", "Jes 49:9": "Om te zeggen tegen de gebondenen: Gaat uit; tegen hen die in duisternis zijn: Komt te voorschijn; zij zullen op de wegen weiden, en op alle hoge plaatsen zal hun weide zijn.", "Joh 6:45": "Er is geschreven in de profeten: En zij zullen allen door God onderwezen zijn. Ieder dan die het van de Vader gehoord en geleerd heeft, komt tot Mij.", "Matt 16:18": "En Ik zeg u ook, dat u Petrus bent, en op deze petra zal Ik Mijn gemeente bouwen, en de poorten van de hel zullen haar niet overweldigen.", "Matt 5:21": "U hebt gehoord dat tot de ouden gezegd is: U zult niet doden; en wie doodt, die zal strafbaar zijn voor het gericht.", "2 Tess 2:14": "waartoe Hij u geroepen heeft door ons Evangelie, tot verkrijging van de heerlijkheid van onze Heere Jezus Christus.", "Hebr 2:10": "Want het paste Hem, om Wie alle dingen zijn, en door Wie alle dingen zijn, dat Hij, veel kinderen naar de heerlijkheid leidend, de leidsman van hun zaligheid door lijden zou volmaken.", "Mark 16:11": "En toen dezen hoorden dat Hij leefde, en door haar gezien was, geloofden zij het niet.", "Spr 26:11": "Zoals een hond terugkeert naar zijn uitspuwsel, zo herneemt de dwaas zijn dwaasheid.", "Rom 9:30-33": "Wat zullen wij dan zeggen? Dat de heidenen, die de rechtvaardigheid niet zochten, de rechtvaardigheid verkregen hebben, en wel de rechtvaardigheid die uit het geloof is. Maar Israël, dat de wet van de rechtvaardigheid zocht, is tot de wet van de rechtvaardigheid niet gekomen. Waarom? Omdat zij die niet uit het geloof zochten, maar als het ware uit de werken van de wet; want zij hebben zich gestoten aan de steen des aanstoots;", "2 Kor 5:20": "Zo zijn wij dan gezanten namens Christus, alsof God door ons bad; wij bidden namens Christus: laat u met God verzoenen.", "Hand 16:31": "En zij zeiden: Geloof in de Heere Jezus Christus, en u zult zalig worden, u en uw huis.", "Jes 40:11": "Hij zal Zijn kudde weiden gelijk een herder; Hij zal de lammeren in Zijn armen bijeenbrengen, en in Zijn schoot dragen; de zogende dieren zal Hij zachtjes leiden.", "Rom 10:11": "Want de Schrift zegt: Ieder die in Hem gelooft, zal niet beschaamd worden.", "Hand 9:14": "en hij heeft hier macht van de overpriesters om allen te binden die Uw Naam aanroepen.", "Gen 20:2": "Toen Abraham nu van Sara, zijn vrouw, gezegd had: Zij is mijn zuster, stuurde Abimelech, de koning van Gerar, iemand en nam Sara weg.", "Jes 11:1-10": "Want er zal een Rijsje voortkomen uit de afgehouwen tronk van Isaï, en een Scheut uit zijn wortels zal vrucht voortbrengen. En op Hem zal de Geest van de HEERE rusten, de Geest van wijsheid en van verstand, de Geest van raad en van sterkte, de Geest van kennis en van vreze van de HEERE. En Zijn vreugde zal zijn in de vreze van de HEERE; en Hij zal niet oordelen naar wat Zijn ogen zien, en niet bestraffen naar wat Zijn oren horen.", "Num 13:29": "De Amalekieten wonen in het land van het zuiden; maar de Hethieten, en de Jebusieten, en de Amorieten wonen op het gebergte; en de Kanaänieten wonen aan de zee, en aan de oever van de Jordaan.", "Hand 7:32": "die zei: Ik ben de God van uw vaders, de God van Abraham, en de God van Izak, en de God van Jakob. En Mozes begon hevig te beven, en durfde niet te kijken.", "2 Kon 25:26": "Toen maakte heel het volk zich op, van de minste tot de grootste, en de aanvoerders van de legers, en zij kwamen in Egypte; want zij waren bang voor de Chaldeeën.", "Gen 40:1": "En het gebeurde na deze dingen, dat de schenker van de koning van Egypte en de bakker zondigden tegen hun heer, tegen de koning van Egypte.", "Openb 21:9-27": "En er kwam naar mij een van de zeven engelen, die de zeven schalen hadden, die vol geweest waren van de zeven laatste plagen, en hij sprak met mij en zei: Kom hier, ik zal u de Bruid tonen, de Vrouw van het Lam. En hij voerde mij weg in de geest op een grote en hoge berg, en hij toonde mij de grote stad, het heilige Jeruzalem, neerdalend uit de hemel van God. En zij had de heerlijkheid van God, en haar licht was gelijk aan de allerkostbaarste steen, namelijk als de steen Jaspis, blinkend als kristal.", "Ps 90:14": "Verzadig ons in de morgenstond met Uw goedertierenheid, zo zullen wij juichen, en verblijd zijn in al onze dagen.", "Jes 45:6": "Opdat men weet, vanaf de opgang van de zon tot aan de ondergang, dat er buiten Mij niets is, Ik ben de HEERE, en niemand meer.", "Hand 7:26-28": "En de volgende dag liet hij zich aan hen zien, terwijl zij vochten; en hij drong hen tot vrede, en zei: Mannen, u bent broeders; waarom doet u elkaar onrecht aan? Maar die zijn naaste onrecht aandeed, stiet hem weg, en zei: Wie heeft u tot leider en rechter over ons gesteld? Wilt u mij ook ombrengen, zoals u gisteren de Egyptenaar hebt omgebracht?", "Hand 7:3": "en zei tegen hem: Ga uit uw land en uit uw familie, en kom in een land dat Ik u wijzen zal.", "Ps 45:7": "Uw troon, o God! is eeuwig en altijd; de scepter van Uw koninkrijk is een scepter van rechtmatigheid.", "Gen 26:3": "Woon als vreemdeling in dat land, en Ik zal met u zijn, en zal u zegenen; want aan u en uw nageslacht zal Ik al deze landen geven, en Ik zal de eed bevestigen die Ik Abraham, uw vader, gezworen heb.", "Lev 19:18": "U zult niet wreken, noch toorn koesteren tegen de kinderen van uw volk; maar u zult uw naaste liefhebben als uzelf; Ik ben de HEERE!", "Jes 63:5": "En Ik zag toe, en er was niemand die hielp; en Ik ontzette Mij, en er was niemand die ondersteunde; daarom heeft Mijn arm Mij heil beschikt, en Mijn grimmigheid heeft Mij ondersteund,", "1 Kron 16:39": "En de priester Zadok, en zijn broeders, de priesters, voor de tabernakel van de HEERE op de hoogte, die te Gibeon is;", "1 Joh 3:5": "En u weet dat Hij geopenbaard is, opdat Hij onze zonden zou wegnemen; en geen zonde is in Hem.", "Openb 3:18": "Ik raad u aan dat u van Mij goud koopt, gelouterd door het vuur, opdat u rijk mag worden; en witte kleren, opdat u bekleed mag worden, en de schande van uw naaktheid niet openbaar wordt; en zalf uw ogen met ogenzalf, opdat u zien kunt.", "Rom 3:14": "Hun mond is vol vervloeking en bitterheid;", "2 Kron 33:17": "Maar het volk offerde nog op de hoogten, hoewel aan de HEERE, hun God.", "Richt 6:13": "Maar Gideon zei tegen Hem: Och, mijn heer! Als de HEERE met ons is, waarom is ons dan dit alles overkomen? En waar zijn al Zijn wonderen, die onze vaders ons verteld hebben en zeiden: Heeft de HEERE ons niet uit Egypte opgevoerd? Maar nu heeft de HEERE ons verlaten, en heeft ons in de hand van de Midianieten gegeven.", "Luk 1:38-56": "En Maria zei: Zie, de dienstmaagd van de Heere; mij gebeure naar uw woord. En de engel ging van haar weg. En Maria stond in diezelfde dagen op en reisde met haast naar het gebergte, naar een stad van Juda; en kwam in het huis van Zacharias, en groette Elizabet.", "Jes 50:9": "Zie, de Heere HEERE helpt Mij, wie is het die Mij zal veroordelen? Zie, zij zullen allemaal verslijten als een kleed, de mot zal hen opeten.", "Matt 15:7-9": "Huichelaars! Terecht heeft Jesaja over u geprofeteerd, toen hij zei: Dit volk nadert Mij met hun mond, en eert Mij met de lippen, maar hun hart houdt zich ver van Mij; Maar tevergeefs eren zij Mij, terwijl zij leringen leren die geboden van mensen zijn.", "Joël 2:28": "En daarna zal het gebeuren, dat Ik Mijn Geest zal uitgieten over alle vlees, en uw zonen en uw dochters zullen profeteren; uw ouden zullen dromen dromen, uw jongelingen zullen gezichten zien;", "Gen 21:5": "En Abraham was honderd jaar oud, toen zijn zoon Izak hem geboren werd.", "Gen 15:18": "Op dezelfde dag maakte de HEERE een verbond met Abram, en Hij zei: Aan uw nageslacht heb Ik dit land gegeven, van de rivier van Egypte af, tot aan die grote rivier, de rivier de Eufraat:", "Hand 3:26": "God heeft, na Zijn Kind Jezus te hebben opgewekt, Hem eerst tot u gezonden, om u te zegenen, doordat Hij ieder van u afkeert van zijn slechte daden.", "Gal 3:13": "Christus heeft ons verlost van de vloek van de wet, doordat Hij voor ons een vloek geworden is; want er is geschreven: Vervloekt is ieder die aan het hout hangt.", "Hebr 2:3": "hoe zullen wij dan ontvluchten, als wij zo'n grote zaligheid veronachtzamen? Deze is eerst door de Heere Zelf verkondigd, en aan ons bevestigd door hen die Hem gehoord hebben;", "Jes 53:3-6": "Hij was veracht, en de onwaardigste onder de mensen, een Man van smarten, en vertrouwd met ziekte; en ieder verborg als het ware het gezicht voor Hem; Hij was veracht, en wij hebben Hem niet geacht. Waarlijk, Hij heeft onze ziekten op Zich genomen, en onze smarten heeft Hij gedragen; maar wij hielden Hem voor een geplaagde, door God geslagen en verdrukt. Maar Hij is om onze overtredingen verwond, om onze ongerechtigheden is Hij verbrijzeld; de straf die ons de vrede aanbrengt, was op Hem, en door Zijn striemen is er voor ons genezing gekomen.", "Matt 22:45": "Als David Hem dan zijn Heere noemt, hoe is Hij dan zijn Zoon?", "Rom 7:26": "Zo dan, ik zelf dien wel met het gemoed de wet van God, maar met het vlees de wet van de zonde.", "Hebr 10:13": "verder wachtend, totdat Zijn vijanden neergelegd worden als een voetbank voor Zijn voeten.", "Jes 57:11": "Maar voor wie bent u bang geweest of hebt u gevreesd? Want u hebt gelogen, en aan Mij hebt u niet gedacht, u hebt Mij niet op uw hart gelegd; is het niet omdat Ik zwijg, en dat al lang, dat u Mij niet vreest?", "Rom 9:15": "Want Hij zegt tegen Mozes: Ik zal Mij ontfermen over wie Ik Mij ontferm, en zal barmhartig zijn voor wie Ik barmhartig ben.", "Ps 119:161": "Schin. De vorsten hebben mij vervolgd zonder oorzaak; maar mijn hart heeft gevreesd voor Uw woord.", "Hos 7:5": "Het is de dag van onze koning; de vorsten maken hem ziek door verhitting van de wijn; hij strekt zijn hand uit met de spotters.", "Hand 2:17-21": "En het zal gebeuren in de laatste dagen, zegt God, dat Ik van Mijn Geest zal uitstorten op alle vlees; en uw zonen en uw dochters zullen profeteren, en uw jongemannen zullen visioenen zien, en uw ouden zullen dromen dromen. En ook op Mijn dienstknechten, en op Mijn dienstmaagden, zal Ik in die dagen van Mijn Geest uitstorten, en zij zullen profeteren. En Ik zal wonderen geven in de hemel boven, en tekenen op de aarde beneden: bloed en vuur en rookwalm.", "Jes 60:6": "Een menigte kamelen zal u bedekken, de snelle kamelen van Midian en Hefa; zij allen uit Scheba zullen komen; goud en wierook zullen zij aanbrengen, en zij zullen de overvloedige lof van de HEERE verkondigen.", "Neh 9:20": "En U hebt Uw goede Geest gegeven om hen te onderwijzen; en Uw Manna hebt U niet geweerd van hun mond, en water hebt U hun gegeven voor hun dorst.", "Ex 6:3-7": "En ook heb Ik Mijn verbond met hen opgericht, dat Ik hun het land Kanaän geven zou, het land van hun vreemdelingschap, waarin zij vreemdelingen zijn geweest. En ook heb Ik het gekerm gehoord van de kinderen van Israël, die de Egyptenaars in dienstbaarheid houden, en Ik heb aan Mijn verbond gedacht. Daarom, zeg tegen de kinderen van Israël: Ik ben de HEERE! En Ik zal u uitleiden van onder de lasten van de Egyptenaren, en Ik zal u redden uit hun dienstbaarheid, en zal u verlossen door een uitgestrekte arm, en door grote gerichten;", "Joh 1:29": "De volgende dag zag Johannes Jezus naar zich toe komen, en zei: Zie het Lam van God, Dat de zonde van de wereld wegneemt!", "Zach 11:12": "Want ik had tegen hen gezegd: Als het goed is in uw ogen, breng mijn loon, en zo niet, laat het na. En zij hebben mijn loon gewogen, dertig zilverlingen.", "Jes 60:1-8": "Maak u op, word verlicht, want uw licht komt, en de heerlijkheid van de HEERE gaat over u op. Want zie, de duisternis zal de aarde bedekken, en donkerheid de volken; maar over u zal de HEERE opgaan, en Zijn heerlijkheid zal over u gezien worden. En de heidenen zullen naar uw licht gaan, en koningen naar de glans die over u is opgegaan.", "Jes 56:6-8": "En de vreemdelingen, die zich bij de HEERE voegen om Hem te dienen, en om de Naam van de HEERE lief te hebben, om Hem tot knechten te zijn; ieder die de sabbat houdt, zodat hij die niet ontheiligt, en die aan Mijn verbond vasthouden; Die zal Ik ook brengen naar Mijn heilige berg, en Ik zal hen verheugen in Mijn huis van gebed; hun brandoffers en hun slachtoffers zullen aangenaam zijn op Mijn altaar; want Mijn huis zal een huis van gebed genoemd worden voor alle volken. De Heere HEERE, Die de verdrevenen van Israël bijeenbrengt, spreekt: Ik zal er bij hem nog meer bijeenbrengen, naast hen die al bij hem bijeengebracht zijn.", "Joh 10:14-16": "Ik ben de goede Herder; en Ik ken de Mijnen, en word door de Mijnen gekend. Zoals de Vader Mij kent, zo ken Ik ook de Vader; en Ik geef Mijn leven voor de schapen. Ik heb nog andere schapen, die niet van deze schaapskooi zijn; ook die moet Ik toebrengen; en zij zullen Mijn stem horen; en het zal worden één kudde, en één Herder.", "Gen 19:29": "En het gebeurde, toen God de steden van deze vlakte verwoestte, dat God aan Abraham dacht, en Hij leidde Lot weg uit het midden van deze omkering, toen Hij de steden omkeerde waarin Lot gewoond had.", "Hand 2:21": "En het zal gebeuren dat ieder die de Naam van de Heere zal aanroepen, behouden zal worden.", "Ex 13:21": "En de HEERE ging voor hun aangezicht uit, overdag in een wolkkolom om hen de weg te leiden, en 's nachts in een vuurkolom om hen licht te geven, zodat zij dag en nacht konden voortgaan.", "Ps 102:26-28": "U hebt voormaals de aarde gegrond, en de hemelen zijn het werk van Uw handen; Die zullen vergaan, maar U zult staande blijven; en zij alle zullen als een kleed verouderen; U zult ze veranderen als een gewaad, en zij zullen veranderd zijn. Maar U bent Dezelfde, en Uw jaren zullen niet geëindigd worden.", "Jer 3:17": "In die tijd zullen zij Jeruzalem noemen: de troon van de HEERE; en alle heidenvolken zullen daar samenkomen, vanwege de Naam van de HEERE, in Jeruzalem; en zij zullen niet meer wandelen naar het goeddunken van hun slechte hart.", "Rom 12:20": "Als dan uw vijand honger heeft, geef hem te eten; als hij dorst heeft, geef hem te drinken; want als u dat doet, zult u kolen van het vuur op zijn hoofd hopen.", "Hebr 8:8-12": "Want omdat Hij hen berispt, zegt Hij tegen hen: Zie, de dagen komen, spreekt de Heere, dat Ik over het huis van Israël en over het huis van Juda een nieuw verbond zal oprichten; Niet naar het verbond dat Ik met hun vaderen gemaakt heb, op de dag dat Ik hen bij de hand nam om hen uit Egypteland te leiden; want zij zijn in dit Mijn verbond niet gebleven, en Ik heb niet meer naar hen omgekeken, zegt de Heere. Want dit is het verbond dat Ik met het huis van Israël maken zal na die dagen, zegt de Heere: Ik zal Mijn wetten in hun verstand geven, en in hun harten zal Ik ze inschrijven; en Ik zal hun tot een God zijn, en zij zullen Mij tot een volk zijn.", "2 Kon 8:19": "Toch wilde de HEERE Juda niet verderven, omwille van David, Zijn dienaar; zoals Hij hem gezegd had dat Hij hem altijd een lamp zou geven voor zijn zonen.", "Hebr 13:4": "Het huwelijk is eerbaar onder allen, en het huwelijksbed onbevlekt; maar hoereerders en overspelers zal God oordelen.", "Deut 10:15": "Alleen heeft de HEERE behagen gehad in uw vaderen, om hen lief te hebben, en heeft hun nageslacht na hen, u, uit alle volken uitverkoren, zoals het op deze dag is.", "Matt 4:16": "het volk dat in duisternis zat, heeft een groot licht gezien; en over hen die zaten in het land en de schaduw van de dood, is een licht opgegaan.", "Jes 66:1": "Zo zegt de HEERE: De hemel is Mijn troon, en de aarde is de voetbank van Mijn voeten; waar zou dat huis zijn, dat u Mij zou bouwen, en waar is de plaats van Mijn rust?", "Mark 1:3": "De stem van hem die roept in de woestijn: Bereid de weg van de Heere, maak Zijn paden recht.", "Ps 69:26": "Hun paleis worde verwoest; in hun tenten zij geen inwoner.", "Rom 7:24": "Ik, ellendig mens, wie zal mij verlossen uit het lichaam van deze dood?", "Matt 3:3": "Want deze is het, van wie gesproken is door Jesaja, de profeet, toen hij zei: De stem van hem die roept in de woestijn: Bereid de weg van de Heere, maak Zijn paden recht!", "Ps 139:9": "Nam ik vleugels van de dageraad, woonde ik aan het uiterste van de zee;", "Hos 14:3": "Neem deze woorden met u, en bekeer u tot de Heere; zeg tegen Hem: Neem weg alle ongerechtigheid, en geef het goede, zo zullen wij betalen de stieren van onze lippen.", "2 Kron 6:41": "En nu, HEERE God, maak U op tot Uw rust, U en de ark van Uw kracht; laat Uw priesters, HEERE God, met heil bekleed worden, en laat Uw gunstgenoten¹ over het goede blijde zijn.", "Jes 63:9": "In al hun benauwdheid was Hij benauwd, en de Engel van Zijn aangezicht heeft hen behouden; door Zijn liefde en door Zijn genade heeft Hij hen verlost; en Hij nam hen op, en Hij droeg hen al de dagen van ouds.", "Ezech 18:4": "Zie, alle zielen zijn van Mij; zoals de ziel van de vader, zo is ook de ziel van de zoon van Mij; de ziel die zondigt, die zal sterven.", "Gen 21:12": "Maar God zei tegen Abraham: Laat het niet kwaad zijn in uw ogen vanwege de jongen en vanwege uw slavin; alles wat Sara tegen u zegt, luister naar haar stem; want in Izak zal uw nageslacht genoemd worden.", "Gen 12:1-3": "De HEERE had tegen Abram gezegd: Ga uit uw land, uit uw familie en uit het huis van uw vader, naar het land dat Ik u wijzen zal. En Ik zal u tot een groot volk maken, en u zegenen, en uw naam groot maken; en wees een zegen! En Ik zal zegenen wie u zegenen, en vervloeken wie u vervloekt; en in u zullen alle geslachten van de aarde gezegend worden.", "Job 1:3": "Daartoe had hij zeven duizend schapen, en drie duizend kamelen, en vijfhonderd juk ossen, en vijfhonderd ezelinnen; ook had hij zeer veel dienstvolk; zodat deze man groter was dan al die van het oosten.", "Tit 3:3-7": "Want ook wij waren vroeger onverstandig, ongehoorzaam, dwalend, en dienden aan allerlei begeerten en genoegens; wij leefden in slechtheid en afgunst, waren hatelijk en haatten elkaar. Maar toen de goedertierenheid van God, onze Zaligmaker, en Zijn liefde tot de mensen verschenen is, Heeft Hij ons zalig gemaakt, niet uit de werken van de rechtvaardigheid die wij gedaan hadden, maar naar Zijn barmhartigheid, door het bad van de wedergeboorte en de vernieuwing door de Heilige Geest;", "Matt 21:4": "Dit alles nu is gebeurd, opdat vervuld werd wat gesproken is door de profeet, die zei:", "Jer 33:22": "Zoals het leger van de hemel niet geteld, en het zand van de zee niet gemeten kan worden, zo zal Ik het nageslacht van Mijn knecht David vermenigvuldigen, en de Levieten die Mij dienen.", "Matt 15:4": "Want God heeft geboden en gezegd: Eer uw vader en moeder, en: Wie vader of moeder vervloekt, die zal de dood sterven.", "Hebr 8:5": "Deze priesters dienen het voorbeeld en de schaduw van de hemelse dingen, zoals Mozes door een goddelijke aanwijzing gewaarschuwd werd toen hij de tabernakel zou voltooien: Want, zegt Hij, zie erop toe dat u alles maakt naar het patroon dat u op de berg getoond is.", "Ex 4:10": "Toen zei Mozes tegen de HEERE: Och Heere! ik ben geen man die goed kan spreken, niet van gisteren, niet van eergisteren, en ook niet van toen af, toen U tot Uw knecht gesproken hebt; want ik ben zwaar van mond, en zwaar van tong.", "Est 2:2-16": "Toen zeiden de jongelingen van de koning, die hem dienden: Men zoekt voor de koning jonge dochters, maagden, mooi van uiterlijk. En de koning stelt toezieners aan in alle landschappen van zijn koninkrijk, dat zij alle jonge dochters, maagden, mooi van uiterlijk, bijeenbrengen naar de burg Susan, naar het huis van de vrouwen, onder de hand van Hegai, de kamerling van de koning, bewaarder van de vrouwen; en men geeft haar haar schoonheidsmiddelen. En de jonge dochter, die in de ogen van de koning mooi zal zijn, wordt koningin in de plaats van Vasthi. Deze zaak nu was goed in de ogen van de koning, en hij deed zo.", "Rom 5:15-21": "Toch is het niet zo dat de genadegift is zoals de misdaad; want als door de misdaad van één velen gestorven zijn, is de genade van God, en de gave door de genade die er is van één Mens Jezus Christus, des te meer overvloedig geweest over velen. En het is niet zo dat de gift is zoals de schuld die er was door die ene die gezondigd heeft; want de schuld is wel uit één misdaad tot verdoemenis, maar de genadegift is uit veel misdaden tot rechtvaardigmaking. Want als door de misdaad van één de dood geheerst heeft door die ene, zullen zij die de overvloed van de genade en van de gave van de rechtvaardigheid ontvangen, des te meer in het leven heersen door die Ene, namelijk Jezus Christus.", "Gen 35:3": "En laten wij ons opmaken en optrekken naar Bethel; en ik zal daar een altaar maken voor de God Die mij antwoordt op de dag van mijn benauwdheid, en met mij geweest is op de weg die ik gegaan heb.", "Matt 26:69-75": "En Petrus zat buiten in de zaal; en een dienstmeisje kwam naar hem toe en zei: U was ook met Jezus, de Galileeër. Maar hij loochende het voor allen en zei: Ik weet niet wat u zegt. En toen hij naar de voorpoort ging, zag een ander dienstmeisje hem, en zei tegen hen die daar waren: Deze was ook met Jezus de Nazarener.", "Gen 2:2": "Toen God op de zevende dag Zijn werk voltooid had, dat Hij gemaakt had, heeft Hij op de zevende dag gerust van al Zijn werk, dat Hij gemaakt had.", "Rom 4:8": "Gelukkig is de man, aan wie de Heere de zonden niet toerekent.", "1 Tim 1:16": "Maar juist daarom is mij barmhartigheid overkomen, opdat Jezus Christus in mij, die de voornaamste ben, al Zijn geduld zou tonen, tot een voorbeeld voor hen die later in Hem geloven zullen tot het eeuwige leven.", "Jer 33:16": "In die dagen zal Juda verlost worden, en Jeruzalem zal veilig wonen; en dit is de naam waarmee zij genoemd zal worden: De Heere, ONZE GERECHTIGHEID.", "Gen 22:16": "En zei: Ik zweer bij Mijzelf, spreekt de HEERE; omdat u dit gedaan hebt, en uw zoon, uw enige, niet onthouden hebt;", "Richt 9:1": "Abimelech nu, de zoon van Jerubbaäl, ging naar Sichem, naar de broers van zijn moeder; en hij sprak tot hen, en tot het hele geslacht van het huis van de vader van zijn moeder, en zei:", "1 Petr 3:15": "maar heilig God, de Heere, in uw harten; en wees altijd bereid tot verantwoording aan ieder die u rekenschap vraagt van de hoop die in u is, met zachtmoedigheid en vreze,", "Hebr 10:5-7": "Daarom zegt Hij, bij Zijn komst in de wereld: Slachtoffer en offergave hebt U niet gewild, maar U hebt Mij een lichaam toebereid; Brandoffers en offers voor de zonde hebben U niet behaagd. Toen zei Ik: Zie, Ik kom (in het begin van het boek is over Mij geschreven) om Uw wil te doen, o God!", "Gen 22:17": "Voorzeker zal Ik u rijk zegenen, en uw nageslacht zeer talrijk maken, als de sterren van de hemel, en als het zand dat aan de oever van de zee is; en uw nageslacht zal de poort van zijn vijanden erfelijk bezitten.", "Joh 3:14-17": "En zoals Mozes de slang in de woestijn verhoogd heeft, zo moet de Zoon des mensen verhoogd worden; Opdat ieder die in Hem gelooft, niet verloren gaat, maar het eeuwige leven heeft. Want zo lief heeft God de wereld gehad, dat Hij Zijn eniggeboren Zoon gegeven heeft, opdat ieder die in Hem gelooft, niet verloren gaat, maar het eeuwige leven heeft.", "Ex 23:31": "En Ik zal uw grenzen vaststellen van de Schelfzee tot aan de zee van de Filistijnen, en van de woestijn tot aan de rivier; want Ik zal de inwoners van dat land in uw hand geven, zodat u hen voor uw aangezicht wegjaagt.", "Rom 4:17": "(Zoals geschreven staat: Ik heb u tot een vader van veel volken gesteld) voor Hem, aan Wie hij geloofd heeft, namelijk God, Die de doden levend maakt, en de dingen die niet zijn roept alsof zij waren;", "Ex 33:19": "Doch Hij zei: Ik zal al Mijn goedheid voorbij uw aangezicht laten gaan, en zal de Naam van de HEERE uitroepen voor uw aangezicht; maar Ik zal genadig zijn aan wie Ik genadig zal zijn, en Ik zal Mij ontfermen over wie Ik Mij ontfermen zal.", "Matt 5:28": "Maar Ik zeg u, dat ieder die naar een vrouw kijkt om haar te begeren, al overspel met haar gepleegd heeft in zijn hart.", "Jer 1:6": "Toen zei ik: Ach, Heere HEERE! zie, ik kan niet spreken, want ik ben jong.", "Luk 13:29": "En er zullen mensen komen van oost en west, en van noord en zuid, en zullen aanzitten in het Koninkrijk van God.", "Ex 20:12": "Eer uw vader en uw moeder, opdat uw dagen verlengd worden in het land dat de HEERE, uw God, u geeft.", "2 Tim 1:10": "Doch nu geopenbaard is door de verschijning van onze Zaligmaker Jezus Christus, Die de dood tenietgedaan heeft, en het leven en de onvergankelijkheid aan het licht gebracht heeft door het Evangelie;", "Jes 19:25": "Want de HEERE van de heerscharen zal hen zegenen en zeggen: Gezegend zij Mijn volk, de Egyptenaars, en de Assyriërs, het werk van Mijn handen, en Israël, Mijn erfdeel!", "1 Tim 1:13": "Ik was voorheen een godslasteraar, en een vervolger, en een geweldenaar; maar mij is barmhartigheid overkomen, omdat ik het onwetend gedaan heb in mijn ongeloof.", "Jes 65:1": "Ik ben gevonden door hen die naar Mij niet vroegen; Ik ben gevonden door hen die Mij niet zochten; tegen het volk, dat naar Mijn Naam niet genoemd was, heb Ik gezegd: Zie, hier ben Ik, zie, hier ben Ik.", "Ps 89:36": "Ik heb eens gezworen bij Mijn heiligheid: Zeker zal Ik aan David niet liegen!", "Hand 7:50": "Heeft Mijn hand niet al deze dingen gemaakt?", "Ex 9:16": "Maar juist daarom heb Ik u laten opstaan, opdat Ik Mijn kracht aan u zou tonen, en opdat men Mijn Naam vertelt op de hele aarde.", "Luk 15:1-10": "En alle tollenaars en zondaars kwamen naar Hem toe, om Hem te horen. En de Farizeeën en de Schriftgeleerden mopperden en zeiden: Deze man ontvangt de zondaars, en eet met hen. En Hij sprak deze gelijkenis tegen hen, en zei:", "Luk 20:37": "En dat de doden opgewekt zullen worden, heeft ook Mozes aangewezen bij de doornstruik, toen hij de Heere de God van Abraham noemt, en de God van Izak, en de God van Jakob.", "1 Sam 9:12": "Toen antwoordden zij hun, en zeiden: Ja, hij is er, kijk, hij is vlak voor u; haast u nu, want hij is vandaag in de stad gekomen, omdat het volk vandaag een offer heeft op de hoogte.", "Zach 9:9": "Verheug u zeer, dochter van Sion! Juich, dochter van Jeruzalem! Zie, uw Koning zal tot u komen, rechtvaardig, en Hij is een Heiland; arm, en rijdend op een ezel, en op een veulen, het jong van de ezelinnen.", "2 Kor 6:18": "en Ik zal u tot een Vader zijn, en u zult Mij tot zonen en dochters zijn, zegt de Heere, de Almachtige.", "Ps 69:24": "Laat hun ogen duister worden, dat zij niet zien; en doe hun heupen voortdurend waggelen.", "Ps 118:26": "Gezegend is hij die daar komt in de Naam van de HEERE! Wij zegenen u uit het huis van de HEERE.", "Jes 10:23": "Want een verdelging, die vast besloten is, zal de Heere HEERE van de heerscharen doen in het midden van dit hele land.", "Matt 28:19": "Ga dan heen, onderwijs alle volken, en doop hen in de Naam van de Vader, en van de Zoon, en van de Heilige Geest;", "Joh 10:34": "Jezus antwoordde hun: Staat er niet geschreven in uw wet: Ik heb gezegd, u bent goden?", "Gen 17:1": "Toen Abram negenennegentig jaar oud was, verscheen de HEERE aan Abram en zei tegen hem: Ik ben God, de Almachtige! Wandel voor Mijn aangezicht en wees oprecht!", "Hebr 10:9": "zei Hij toen: Zie, Ik kom om Uw wil te doen, o God! Hij neemt het eerste weg, om het tweede te laten gelden.", "Luk 14:26-33": "Als iemand bij Mij komt en niet zijn vader, en moeder, en vrouw, en kinderen, en broers, en zussen, ja, zelfs ook zijn eigen leven haat, die kan Mijn discipel niet zijn. En wie zijn kruis niet draagt en Mij navolgt, die kan Mijn discipel niet zijn. Want wie van u die een toren wil bouwen, gaat niet eerst zitten om de kosten te berekenen, of hij wel genoeg heeft om het af te maken?", "Gen 17:3": "Toen viel Abram op zijn aangezicht, en God sprak met hem en zei:", "Jes 23:17": "Want het zal gebeuren aan het einde van zeventig jaren, dat de HEERE Tyrus zal bezoeken, en dat zij zal terugkeren tot haar hoerenloon, en zij zal hoererij bedrijven met alle koninkrijken van de aarde, die op de aardbodem zijn.", "2 Kon 18:21": "Zie nu, vertrouwt u op die gebroken rietstaf, op Egypte, waarop, als iemand daarop leunt, het in zijn hand zal gaan, en die doorboren; zo is Farao, de koning van Egypte, voor allen die op hem vertrouwen.", "Ex 2:13": "De volgende dag ging hij er weer op uit, en zie, twee Hebreeuwse mannen waren aan het vechten; en hij zei tegen degene die ongelijk had: Waarom slaat u uw naaste?", "Jes 8:18": "Zie, ik en de kinderen die de HEERE mij gegeven heeft, zijn tot tekenen en tot wonderen in Israël, van de HEERE van de heerscharen, Die op de berg Sion woont.", "Ps 72:12-14": "Want hij zal de behoeftige redden, die daar roept, alsook de ellendige, en die geen helper heeft. Hij zal de arme en behoeftige verschonen, en de zielen van de behoeftigen verlossen. Hij zal hun zielen van list en geweld bevrijden, en hun bloed zal dierbaar zijn in zijn ogen.", "Hebr 4:7": "bepaalt Hij opnieuw een zekere dag, namelijk heden, doordat Hij door David zegt, zo lange tijd daarna (zoals gezegd is): Heden, als u Zijn stem hoort, verhard dan uw harten niet.", "Rom 11:27": "En dit is hun een verbond van Mij, als Ik hun zonden zal wegnemen.", "Jes 11:10": "Want het zal gebeuren op die dag, dat de heidenen zullen vragen naar de Wortel van Isaï, Die zal staan als een banier voor de volken, en Zijn rust zal heerlijk zijn.", "Micha 4:3": "En Hij zal onder grote volken rechtspreken, en machtige heidenvolken straffen, tot ver weg toe; en zij zullen hun zwaarden omsmeden tot ploegscharen, en hun speren tot snoeimessen; het ene volk zal tegen het andere volk geen zwaard opheffen, en zij zullen de oorlog niet meer leren.", "Deut 32:49": "Klim op de berg Abarim (dit is de berg Nebo, die in het land van Moab is, tegenover Jericho), en zie het land Kanaän, dat Ik de kinderen van Israël tot een bezitting geven zal;", "Matt 13:55": "Is Dit niet de zoon van de timmerman? Heet Zijn moeder niet Maria, en Zijn broers Jakobus en Joses, en Simon en Judas?", "1 Kon 18:2": "En Elia ging heen om zich aan Achab te vertonen. En de honger was sterk in Samaria.", "Matt 28:17": "En toen zij Hem zagen, aanbaden zij Hem; maar sommigen twijfelden.", "Ps 95:11": "Daarom heb Ik in Mijn toorn gezworen: Zij zullen in Mijn rust niet ingaan!", "Gen 41:1": "En het gebeurde na verloop van twee volle jaren, dat Farao droomde, en zie, hij stond aan de rivier.", "Gen 19:30": "En Lot trok weg uit Zoar, en woonde op de berg, en zijn twee dochters met hem; want hij was bang om in Zoar te wonen. En hij woonde in een grot, hij en zijn twee dochters.", "Jes 11:1": "Want er zal een Rijsje voortkomen uit de afgehouwen tronk van Isaï, en een Scheut uit zijn wortels zal vrucht voortbrengen.", "1 Petr 2:24": "Die Zelf onze zonden in Zijn lichaam gedragen heeft op het hout; opdat wij, voor de zonden afgestorven, voor de gerechtigheid zouden leven; door Wiens striemen u genezen bent.", "Matt 2:15": "en hij was daar tot de dood van Herodes; opdat vervuld zou worden wat door de Heere gesproken is door de profeet: Uit Egypte heb Ik Mijn Zoon geroepen.", "Gen 22:9": "En zij kwamen bij de plaats die God hem gezegd had; en Abraham bouwde daar een altaar, en schikte het hout, en bond zijn zoon Izak, en legde hem op het altaar boven op het hout.", "Ef 4:8": "Daarom zegt Hij: Toen Hij opgevaren is in de hoogte, heeft Hij de gevangenis gevangengenomen, en heeft Hij de mensen gaven gegeven.", "Jes 51:3-16": "Want
