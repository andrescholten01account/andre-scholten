<style>
  :root {

    --light:#ffffff; --lightgray:#e5e5e5; --gray:#b3b3b3; --darkgray:#333333; --dark:#111111;

  .hfdnav .midden { display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:.4rem; color:#777; }
  .hfdnav select { font-family:"Lora"; font-size:.85rem; border:1px solid var(--border); border-radius:999px; padding:.3rem 1.6rem .3rem .8rem; background:#fff; color:var(--accent-donker); cursor:pointer; }

  .navselect { font-family:"Lora"; font-size:.85rem; border:1px solid var(--border); border-radius:999px; padding:.3rem 1.6rem .3rem .8rem; background:#fff; color:var(--accent-donker); cursor:pointer; display:inline-flex; align-items:center; text-decoration:none; }

    #vertaalkies { order: -1; }
  }

  /* verzen — tabsmodus (één kolom) */
  .vers { position: relative; display: flex; gap: .8rem; padding: .45rem 2.4rem .45rem .4rem; border-radius: 8px; cursor: pointer; }
  .vers:hover { background: var(--bg-soft); }
  .vers.open { background: var(--bg-soft); box-shadow: inset 3px 0 0 var(--accent); border-radius: 8px 8px 0 0; }
  .vers.flits { animation: flits 1.6s ease-out; }
  @keyframes flits { 0% { background: #e0e0e0; } 100% { background: var(--bg-soft); } }
  .vnr { color: #999999; font-size: .75rem; min-width: 1.6rem; text-align: right; padding-top: .45rem; font-family: "Lora"; }
  .vtekst em, .pcel em { font-style: italic; color: #555; }
  .wl { border-bottom: 1px dotted var(--accent); }
  .noot { color: var(--accent); cursor: pointer; font-weight: 700; padding: 0 .05rem; }
  .noot:hover { color: var(--accent-donker); }

  .vers:hover .kopieer { opacity: .75; }
  .kopieer:hover { opacity: 1 !important; }

  #bijbel.parallel .vers { display:grid; gap:.8rem; cursor:pointer; align-items:start; }
  #bijbel.parallel .vnr { grid-row: 1; }
  .kolomkop { display:none; }
  #bijbel.parallel + .kolomkop, .kolomkop.tonen { }
  .pk { font-family:"Lora"; font-size:.72rem; text-transform:uppercase; letter-spacing:.12em; color:var(--accent-donker); font-weight:700; }
  #bijbel.parallel .pcel em { font-style:italic; color:#555; }

m gezegd: Ga uit uw land, uit uw familie en uit het huis van uw vader, naar het land dat Ik u wijzen zal.","2":"En Ik zal u tot een groot volk maken, en u zegenen, en uw naam groot maken; en wees een zegen!","3":"En Ik zal zegenen wie u zegenen, en vervloeken wie u vervloekt; en in u zullen alle geslachten van de aarde gezegend worden.[1]","4":"En Abram ging heen, zoals de HEERE tegen hem gesproken had; en Lot ging met hem mee; en Abram was vijfenzeventig jaar oud, toen hij uit Haran vertrok.","5":"En Abram nam Sarai, zijn vrouw, en Lot, de zoon van zijn broer, en al hun bezit dat zij verworven hadden, en de mensen die zij verkregen hadden in Haran; en zij vertrokken om naar het land Kanaän te gaan, en zij kwamen in het land Kanaän aan.","6":"En Abram trok door dat land, tot aan de plaats Sichem, tot aan het eikenbos More; en de Kanaänieten waren toen in dat land.","7":"Toen verscheen de HEERE aan Abram, en zei: Aan uw nageslacht zal Ik dit land geven. Toen bouwde hij daar een altaar voor de HEERE, Die hem verschenen was.","8":"En hij brak vandaar op naar het gebergte, ten oosten van Beth-el, en hij sloeg zijn tent op, met Beth-el naar het westen, en Ai naar het oosten; en hij bouwde daar een altaar voor de HEERE, en riep de Naam van de HEERE aan.","9":"Daarna vertrok Abram, verder trekkend naar het zuiden.","10":"En er was hongersnood in dat land; zo trok Abram af naar Egypte om daar als vreemdeling te wonen, omdat de hongersnood zwaar was in dat land.","11":"En het gebeurde, toen hij Egypte naderde om daar binnen te gaan, dat hij tegen Sarai, zijn vrouw, zei: Zie toch, ik weet dat u een vrouw bent die knap is om te zien.","12":"En het zal gebeuren, wanneer de Egyptenaren u zien, dat zij zullen zeggen: Dat is zijn vrouw; en zij zullen mij doden, en u in leven laten.","13":"Zeg toch: U bent mijn zuster; opdat het mij goed gaat om u, en ik in leven blijf om uwentwil.","14":"En het gebeurde, toen Abram in Egypte kwam, dat de Egyptenaren deze vrouw zagen, dat zij zeer knap was.","15":"Ook zagen de vorsten van Farao haar, en prezen haar bij Farao; en die vrouw werd meegenomen naar het huis van Farao.","16":"En hij deed Abram goed omwille van haar; zodat hij schapen had, en runderen, en ezels, en knechten, en dienstmeisjes, en ezelinnen, en kamelen.","17":"Maar de HEERE plaagde Farao met grote plagen, ook zijn huis, vanwege Sarai, de vrouw van Abram.","18":"Toen riep Farao Abram en zei: Wat is dit dat u mij hebt aangedaan? Waarom hebt u mij niet verteld dat zij uw vrouw is?","19":"Waarom hebt u gezegd: Zij is mijn zuster; zodat ik haar voor mij tot vrouw zou hebben genomen? En nu, zie, daar is uw vrouw; neem haar en ga heen!","20":"En Farao gaf zijn mannen bevel vanwege hem, en zij lieten hem vertrekken, met zijn vrouw en alles wat hij had."},"SV":{"1":"De HEERE nu had tot Abram gezegd: Ga gij uit uw land, en uit uw maagschap, en uit uws vaders huis, naar het land, dat Ik u wijzen zal.","2":"En Ik zal u tot een groot volk maken, en u zegenen, en uw naam groot maken; en wees een zegen!","3":"En Ik zal zegenen, die u zegenen, en vervloeken, die u vloekt; en in u zullen alle geslachten des aardrijks gezegend worden.","4":"En Abram toog heen, gelijk de HEERE tot hem gesproken had; en Lot toog met hem; en Abram was vijf en zeventig jaren oud, toen hij uit Haran ging.","5":"En Abram nam Sarai, zijn huisvrouw, en Lot, zijns broeders zoon, en al hun have, die zij verworven hadden, en de zielen, die zij verkregen hadden in Haran; en zij togen uit, om te gaan naar het land Kanaän, en zij kwamen in het land Kanaän.","6":"En Abram is doorgetogen in dat land, tot aan de plaats Sichem, tot aan het eikenbos More; en de Kanaänieten *waren* toen ter tijd in dat land.","7":"Zo verscheen de HEERE aan Abram, en zeide: Aan uw zaad zal Ik dit land geven. Toen bouwde hij aldaar een altaar den HEERE, Die hem verschenen was.","8":"En hij brak op van daar naar het gebergte, tegen het oosten van Beth-el, en hij sloeg zijn tent op, zijnde Beth-el tegen het westen, en Ai tegen het oosten; en hij bouwde daar den HEERE een altaar, en riep den Naam des HEEREN aan.","9":"Daarna vertrok Abram, gaande en trekkende naar het zuiden.","10":"En er was honger in dat land; zo toog Abram af naar Egypte, om daar als een vreemdeling te verkeren, dewijl de honger zwaar *was* in dat land.","11":"En het geschiedde, als hij naderde, om in Egypte te komen, dat hij zeide tot Sarai, zijn huisvrouw: Zie toch, ik weet, dat gij een vrouw zijt, schoon van aangezicht.","12":"En het zal geschieden, als u de Egyptenaars zullen zien, zo zullen zij zeggen: Dat *is* zijn huisvrouw; en zij zullen mij doden, en u in het leven behouden.","13":"Zeg toch: Gij *zijt* mijn zuster; opdat het mij wel ga om u, en mijn ziel om uwentwil leve.","14":"En het geschiedde, als Abram in Egypte kwam, dat de Egyptenaars deze vrouw zagen, dat zij zeer schoon *was*.","15":"Ook zagen haar de vorsten van Farao, en prezen haar bij Farao; en die vrouw werd weggenomen naar het huis van Farao.","16":"En hij deed Abram goed, om harentwil; zodat hij had schapen, en runderen, en ezelen, en knechten, en maagden, en ezelinnen, en kemelen.","17":"Maar de HEERE plaagde Farao met grote plagen, ook zijn huis, ter oorzake van Sarai, Abrams huisvrouw.","18":"Toen riep Farao Abram, en zeide: Wat *is* dit, *dat* gij mij gedaan hebt? waarom hebt gij mij niet te kennen gegeven, dat zij uw huisvrouw *is*?","19":"Waarom hebt gij gezegd: Zij *is* mijn zuster; zodat ik haar mij tot een vrouw zoude genomen hebben? en nu, zie, *daar* *is* uw huisvrouw; neem *haar* en ga henen!","20":"En Farao gebood *zijn* mannen vanwege hem, en zij geleidden hem, en zijn huisvrouw, en alles wat hij had."},"KJV":{"1":"Now the LORD had said unto Abram, Get thee out of thy country, and from thy kindred, and from thy father's house, unto a land that I will shew","2":"And I will make of thee a great nation, and I will bless thee, and make thy name great; and thou shalt be a blessing:","3":"And I will bless them that bless thee, and curse him that curseth thee: and in thee shall all families of the earth be blessed.","4":"So Abram departed, as the LORD had spoken unto him; and Lot went with him: and Abram *was* seventy and five years old when he departed out of Haran.","5":"And Abram took Sarai his wife, and Lot his brother's son, and all their substance that they had gathered, and the souls that they had gotten in Haran; and they went forth to go into the land of Canaan; and into the land of Canaan they came.","6":"And Abram passed through the land unto the place of Sichem, unto the plain of Moreh. And the Canaanite *was* then in the land.","7":"And the LORD appeared unto Abram, and said, Unto thy seed will I give this land: and there builded he an altar unto the LORD, who appeared","8":"And he removed from thence unto a mountain on the east of Bethel, and pitched his tent, *having* Bethel on the west, and Hai on the east: and there he builded an altar unto the LORD, and called upon the name of the LORD.","9":"And Abram journeyed, going on still toward the south.","10":"And there was a famine in the land: and Abram went down into Egypt to sojourn there; for the famine *was* grievous in the land.","11":"And it came to pass, when he was come near to enter into Egypt, that he said unto Sarai his wife, Behold now, I know that thou *art* a fair woman to look upon:","12":"Therefore it shall come to pass, when the Egyptians shall see thee, that they shall say, This *is* his wife: and they will kill me, but they will save thee alive.","13":"Say, I pray thee, thou *art* my sister: that it may be well with me for thy sake; and my soul shall live because of thee.","14":"And it came to pass, that, when Abram was come into Egypt, the Egyptians beheld the woman that she *was* very fair.","15":"The princes also of Pharaoh saw her, and commended her before Pharaoh: and the woman was taken into Pharaoh's house.","16":"And he entreated Abram well for her sake: and he had sheep, and oxen, and he asses, and menservants, and maidservants, and she asses, and camels.","17":"And the LORD plagued Pharaoh and his house with great plagues because of Sarai Abram's wife.","18":"And Pharaoh called Abram, and said, What *is* this *that* thou hast done unto me? why didst thou not tell me that she *was* thy wife?","19":"Why saidst thou, She *is* my sister? so I might have taken her to me to wife: now therefore behold thy wife, take *her*, and go thy way.","20":"And Pharaoh commanded *his* men concerning him: and they sent him away, and his wife,"}},"tsk":{"1":[{"kopje":"had","refs":["Gen 11:31","Gen 11:32","Gen 15:7","Neh 9:7","Jes 41:9","Jes 51:2","Ezech 33:24"]},{"kopje":"Ga","refs":["Joz 24:2","Joz 24:3","Ps 45:11","Ps 45:12","Luk 14:26-33","Hand 7:2-6","2 Kor 6:17","Hebr 11:8","Openb 18:4"]}],"2":[{"kopje":"wees","refs":["Gen 14:14-16","Gen 18:18","Gen 19:29","Gen 28:4","1 Kon 1:47","Gal 3:14"]}],"3":[{"kopje":"En Ik","refs":["Gen 27:29","Ex 23:22","Num 24:9","Matt 25:40","Matt 25:45"]},{"kopje":"in u","refs":["Gen 18:18","Gen 22:18","Gen 26:4","Gen 28:14","Gen 30:27","Gen 30:30","Gen 39:5","Ps 72:17","Hand 3:25","Hand 3:26","Rom 4:11","1 Kor 1:30","Gal 3:8","Gal 3:16","Gal 3:28","Ef 1:3","Kol 3:11","Openb 7:9"]}],"4":[{"kopje":"en Lot","refs":["Gen 11:27"]},{"kopje":"toen hij uit Haran vertrok","refs":["Hebr 11:8"]}],"5":[{"kopje":"de mensen","refs":["Gen 14:14","Gen 14:21","Gen 46:5-26"]},{"kopje":"in","refs":["Gen 11:31"]},{"kopje":"en zij kwamen in","refs":["Gen 10:19","Hand 7:4","Hebr 11:8","Hebr 11:9"]}],"6":[{"kopje":"trok","refs":["Hebr 11:9"]},{"kopje":"Sichem","refs":["Gen 33:18","Gen 34:2","Gen 35:4","Joz 20:7","Joz 24:32","Richt 9:1","1 Kon 12:1","Joh 4:5","Hand 7:16"]},{"kopje":"More","refs":["Deut 11:30","Richt 7:1"]},{"kopje":"Kanaänieten","refs":["Gen 10:15","Gen 10:18","Gen 10:19","Gen 13:7","Gen 15:18-21"]}],"7":[{"kopje":"verscheen","refs":["Gen 17:1","Gen 18:1","Gen 32:30"]},{"kopje":"Aan uw","refs":["Gen 13:15","Gen 17:3","Gen 17:8","Gen 26:3","Gen 2 class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> unto a <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> that I will shew","2":"And I will make of <span class=\"wl wl-kjv\" data-code=\"H6213\">thee</span> a <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H1471\">nation,</span> and I will <span class=\"wl wl-kjv\" data-code=\"H1288\">bless</span> thee, and <span class=\"wl wl-kjv\" data-code=\"H1431\">make</span> thy <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> <span class=\"wl wl-kjv\" data-code=\"H1431\">great;</span> and thou shalt be a blessing:","3":"And I will <span class=\"wl wl-kjv\" data-code=\"H1288\">bless</span> them that <span class=\"wl wl-kjv\" data-code=\"H1288\">bless</span> thee, and <span class=\"wl wl-kjv\" data-code=\"H779\">curse</span> him that <span class=\"wl wl-kjv\" data-code=\"H7043\">curseth</span> thee: and in thee shall all <span class=\"wl wl-kjv\" data-code=\"H4940\">families</span> of the <span class=\"wl wl-kjv\" data-code=\"H127\">earth</span> be blessed.","4":"So <span class=\"wl wl-kjv\" data-code=\"H87\">Abram</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">departed,</span> as the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> had <span class=\"wl wl-kjv\" data-code=\"H1696\">spoken</span> unto him; and <span class=\"wl wl-kjv\" data-code=\"H3876\">Lot</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> with him: and <span class=\"wl wl-kjv\" data-code=\"H87\">Abram</span> was <span class=\"wl wl-kjv\" data-code=\"H7657\">seventy</span> and <span class=\"wl wl-kjv\" data-code=\"H2568\">five</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">old</span> when he <span class=\"wl wl-kjv\" data-code=\"H3318\">departed</span> out of Haran.","5":"And <span class=\"wl wl-kjv\" data-code=\"H87\">Abram</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> <span class=\"wl wl-kjv\" data-code=\"H8297\">Sarai</span> his <span class=\"wl wl-kjv\" data-code=\"H802\">wife,</span> and <span class=\"wl wl-kjv\" data-code=\"H3876\">Lot</span> his <span class=\"wl wl-kjv\" data-code=\"H251\">brother's</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">son,</span> and all their <span class=\"wl wl-kjv\" data-code=\"H7399\">substance</span> that they had <span class=\"wl wl-kjv\" data-code=\"H7408\">gathered,</span> and the <span class=\"wl wl-kjv\" data-code=\"H5315\">souls</span> that they had <span class=\"wl wl-kjv\" data-code=\"H6213\">gotten</span> in <span class=\"wl wl-kjv\" data-code=\"H2771\">Haran;</span> and they went <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> to <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> into the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H3667\">Canaan;</span> and into the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H3667\">Canaan</span> they came.","6":"And <span class=\"wl wl-kjv\" data-code=\"H87\">Abram</span> passed <span class=\"wl wl-kjv\" data-code=\"H5674\">through</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> unto the <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> of <span class=\"wl wl-kjv\" data-code=\"H7927\">Sichem,</span> unto the <span class=\"wl wl-kjv\" data-code=\"H436\">plain</span> of <span class=\"wl wl-kjv\" data-code=\"H4176\">Moreh.</span> And the <span class=\"wl wl-kjv\" data-code=\"H3669\">Canaanite</span> was <span class=\"wl wl-kjv\" data-code=\"H227\">then</span> in the land.","7":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">appeared</span> unto <span class=\"wl wl-kjv\" data-code=\"H87\">Abram,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Unto thy <span class=\"wl wl-kjv\" data-code=\"H2233\">seed</span> will I <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> <span class=\"wl wl-kjv\" data-code=\"H2063\">this</span> <span class=\"wl wl-kjv\" data-code=\"H776\">land:</span> and there <span class=\"wl wl-kjv\" data-code=\"H1129\">builded</span> he an <span class=\"wl wl-kjv\" data-code=\"H4196\">altar</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> who appeared","8":"And he <span class=\"wl wl-kjv\" data-code=\"H6275\">removed</span> from thence unto a <span class=\"wl wl-kjv\" data-code=\"H2022\">mountain</span> on the <span class=\"wl wl-kjv\" data-code=\"H6924\">east</span> of <span class=\"wl wl-kjv\" data-code=\"H1008\">Bethel,</span> and <span class=\"wl wl-kjv\" data-code=\"H5186\">pitched</span> his <span class=\"wl wl-kjv\" data-code=\"H168\">tent,</span> having <span class=\"wl wl-kjv\" data-code=\"H1008\">Bethel</span> on the <span class=\"wl wl-kjv\" data-code=\"H3220\">west,</span> and <span class=\"wl wl-kjv\" data-code=\"H5857\">Hai</span> on the <span class=\"wl wl-kjv\" data-code=\"H6924\">east:</span> and there he <span class=\"wl wl-kjv\" data-code=\"H1129\">builded</span> an <span class=\"wl wl-kjv\" data-code=\"H4196\">altar</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> upon the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of the LORD.","9":"And <span class=\"wl wl-kjv\" data-code=\"H87\">Abram</span> <span class=\"wl wl-kjv\" data-code=\"H5265\">journeyed,</span> going <span class=\"wl wl-kjv\" data-code=\"H1980\">on</span> <span class=\"wl wl-kjv\" data-code=\"H5265\">still</span> toward the south.","10":"And there was a <span class=\"wl wl-kjv\" data-code=\"H7458\">famine</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land:</span> and <span class=\"wl wl-kjv\" data-code=\"H87\">Abram</span> went <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> into <span class=\"wl wl-kjv\" data-code=\"H4714\">E ass=\"wl wl-kjv\" data-code=\"H87\">Abram</span> was <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> into <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> the <span class=\"wl wl-kjv\" data-code=\"H4713\">Egyptians</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">beheld</span> the <span class=\"wl wl-kjv\" data-code=\"H802\">woman</span> that she was <span class=\"wl wl-kjv\" data-code=\"H3966\">very</span> fair.","15":"The <span class=\"wl wl-kjv\" data-code=\"H8269\">princes</span> also of <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> her, and <span class=\"wl wl-kjv\" data-code=\"H1984\">commended</span> her <span class=\"wl wl-kjv\" data-code=\"H413\">before</span> <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh:</span> and the <span class=\"wl wl-kjv\" data-code=\"H802\">woman</span> was <span class=\"wl wl-kjv\" data-code=\"H3947\">taken</span> into <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh's</span> house.","16":"And he <span class=\"wl wl-kjv\" data-code=\"H3190\">entreated</span> <span class=\"wl wl-kjv\" data-code=\"H87\">Abram</span> <span class=\"wl wl-kjv\" data-code=\"H3190\">well</span> for her sake: and he had <span class=\"wl wl-kjv\" data-code=\"H6629\">sheep,</span> and <span class=\"wl wl-kjv\" data-code=\"H1241\">oxen,</span> and he <span class=\"wl wl-kjv\" data-code=\"H2543\">asses,</span> and <span class=\"wl wl-kjv\" data-code=\"H5650\">menservants,</span> and <span class=\"wl wl-kjv\" data-code=\"H8198\">maidservants,</span> and she <span class=\"wl wl-kjv\" data-code=\"H860\">asses,</span> and camels.","17":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H5060\">plagued</span> <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh</span> and his <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> with <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H5061\">plagues</span> because <span class=\"wl wl-kjv\" data-code=\"H1697\">of</span> <span class=\"wl wl-kjv\" data-code=\"H8297\">Sarai</span> <span class=\"wl wl-kjv\" data-code=\"H87\">Abram's</span> wife.","18":"And <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh</span> <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> <span class=\"wl wl-kjv\" data-code=\"H87\">Abram,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> What is this that thou hast <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> unto me? why didst thou not <span class=\"wl wl-kjv\" data-code=\"H5046\">tell</span> me that she was thy wife?","19":"Why saidst <span class=\"wl wl-kjv\" data-code=\"H559\">thou,</span> She is my <span class=\"wl wl-kjv\" data-code=\"H269\">sister?</span> so I might have <span class=\"wl wl-kjv\" data-code=\"H3947\">taken</span> her to me to <span class=\"wl wl-kjv\" data-code=\"H802\">wife:</span> now therefore behold thy <span class=\"wl wl-kjv\" data-code=\"H802\">wife,</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> her, and go thy way.","20":"And <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh</span> <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> his <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> concerning him: and they sent him <span class=\"wl wl-kjv\" data-code=\"H7971\">away,</span> and his wife,"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"Abram","tekst":"Te weten, eer hij uit Chaldea vertrokken was, want dit bevel van God was de oorzaak zijner verhuizing uit Chaldea, eer hij nog wist waar hij heentrekken zou; hetwelk hem daarna is geopenbaard. Zie boven Gen 11:31. Verg. hiermede Act 7:3-4."},{"catchword":"Ga gij","tekst":"Hebr. Ga voor u, of ga u. Dat is, tot uw best; alzo onder Gen 22:2, idem, vlied voor u, onder Gen 27:43, onderken voor u, onder Gen 31:32, doch overigens is dit woordje u, dikwerf in de Hebr. taal als een /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
