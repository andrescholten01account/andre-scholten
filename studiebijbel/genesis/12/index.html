e bekering tot God en het geloof in onze Heere Jezus Christus.", "Micha 5:1-14": "En u, Bethlehem Efratha, bent u klein om te zijn onder de duizenden van Juda? Uit u zal Mij Iemand voortkomen, Die een Heerser zal zijn in Israël, en Wiens uitgangen zijn van oudsher, van de dagen van de eeuwigheid. Daarom zal Hij hen overgeven, tot de tijd toe dat zij, die baren zal, gebaard heeft; dan zullen de overigen van Zijn broeders zich bekeren met de kinderen van Israël. En Hij zal staan, en zal weiden in de kracht van de HEERE, in de hoogheid van de Naam van de HEERE, Zijn God, en zij zullen wonen, want nu zal Hij groot zijn tot aan de einden van de aarde.", "Hand 13:47": "Want zo heeft de Heere ons geboden: Ik heb u gesteld tot een licht voor de heidenen, opdat u tot zaligheid zou zijn, tot aan het uiterste van de aarde.", "Gen 18:19": "Want Ik heb hem gekend, opdat hij zijn kinderen en zijn huis na hem zou opdragen, en zij de weg van de HEERE zouden bewaren, om gerechtigheid en recht te doen; opdat de HEERE over Abraham brengt wat Hij over hem gesproken heeft.", "Joh 19:24": "Zij zeiden dan tegen elkaar: Laten wij die niet scheuren, maar erom loten, van wie die zal zijn; opdat de Schrift vervuld wordt, die zegt: Zij hebben Mijn kleren onder elkaar verdeeld, en over Mijn kleding hebben zij het lot geworpen. Dit hebben de soldaten dan gedaan.", "Gen 17:7": "En Ik zal Mijn verbond oprichten tussen Mij en u, en uw nageslacht na u, in hun geslachten, tot een eeuwig verbond, om u en uw nageslacht na u tot een God te zijn.", "Openb 5:13": "En elk schepsel dat in de hemel is, en op de aarde, en onder de aarde, en die in de zee zijn, en alles wat daarin is, hoorde ik zeggen: Hem Die op de troon zit, en het Lam, zij de dankzegging, en de eer, en de heerlijkheid, en de kracht, tot in alle eeuwigheid.", "2 Kor 5:16": "Zo kennen wij van nu af aan niemand meer naar het vlees; en al hebben wij ook Christus naar het vlees gekend, toch kennen wij Hem nu niet meer naar het vlees.", "Neh 9:19": "Hebt U hen toch door Uw grote barmhartigheid niet verlaten in de woestijn; de wolkkolom week niet van hen overdag, om hen op de weg te leiden, noch de vuurkolom 's nachts, om hen licht te geven, op de weg waarin zij zouden gaan.", "Deut 5:16": "Eer uw vader en uw moeder, zoals de HEERE, uw God, u geboden heeft, opdat uw dagen verlengd worden, en opdat het u goed gaat in het land dat de HEERE, uw God, u geven zal.", "Hand 1:20": "Want er staat geschreven in het boek van de Psalmen: Zijn woonstede moet woest worden, en er mag niemand zijn die erin woont. En: Een ander moet zijn opzienersambt overnemen.", "Rom 11:8": "(Zoals geschreven is: God heeft hun een geest van diepe slaap gegeven; ogen om niet te zien, en oren om niet te horen) tot op deze huidige dag.", "Spr 1:21": "Zij roept op de belangrijkste plaats van de samenscholingen; aan de deuren van de poorten spreekt Zij Haar woorden in de stad;", "Tit 2:13": "Verwachtend de zalige hoop en verschijning van de heerlijkheid van de grote God en onze Zaligmaker Jezus Christus;", "Rom 13:9": "Want dit: u zult geen overspel doen, u zult niet doden, u zult niet stelen, u zult geen valse getuigenis geven, u zult niet begeren; en als er nog enig ander gebod is, wordt het in dit woord samengevat, namelijk in dit: u zult uw naaste liefhebben als uzelf.", "Matt 22:9": "Ga daarom naar de kruispunten van de wegen, en roep zovelen als u er zult vinden, naar de bruiloft.", "1 Kor 3:20": "En opnieuw: De Heere kent de overleggingen van de wijzen, dat zij nutteloos zijn.", "Hebr 5:9": "En nadat Hij volmaakt gemaakt was, is Hij voor allen die Hem gehoorzaam zijn een oorzaak van eeuwige zaligheid geworden;", "Joh 8:56": "Abraham, uw vader, heeft er met vreugde naar verlangd Mijn dag te zien; en hij heeft hem gezien, en is verblijd geweest.", "Jes 59:19-21": "Dan zullen zij de Naam van de HEERE vrezen vanaf de neergang, en Zijn heerlijkheid vanaf de opgang van de zon; als de vijand zal komen als een stroom, zal de Geest van de HEERE de banier tegen hem oprichten. En er zal een Verlosser tot Sion komen, namelijk voor hen die zich bekeren van de overtreding in Jakob, spreekt de HEERE. Wat Mij aangaat, dit is Mijn Verbond met hen, zegt de HEERE: Mijn Geest, Die op u is, en Mijn woorden, die Ik in uw mond gelegd heb, die zullen van uw mond niet wijken, ook niet van de mond van uw zaad, ook niet van de mond van het zaad van uw zaad, zegt de HEERE, van nu af tot in eeuwigheid toe.", "Ps 102:16": "Dan zullen de heidenen de Naam van de HEERE vrezen, en alle koningen van de aarde Uw heerlijkheid.", "Ps 37:39": "Thau. Toch is het heil van de rechtvaardigen van de HEERE; hun Sterkte in de tijd van benauwdheid.", "Jes 55:7": "De goddeloze verlaat zijn weg, en de onrechtvaardige man zijn gedachten; en hij bekeert zich tot de HEERE, zo zal Hij Zich over hem ontfermen, en tot onze God, want Hij vergeeft menigvuldig.", "Jes 29:13": "Want de Heere heeft gezegd: Omdat dit volk tot Mij nadert met zijn mond, en zij Mij met hun lippen eren, maar hun hart ver van Mij houden; en hun vrees, waarmee zij Mij vrezen, mensengeboden zijn, die hun geleerd zijn;", "Gen 13:4": "tot de plaats van het altaar, dat hij daar eerst gemaakt had; en Abram heeft daar de Naam van de HEERE aangeroepen.", "1 Kor 1:18": "Want het woord van het kruis is voor hen die verloren gaan wel dwaasheid; maar voor ons, die behouden worden, is het een kracht van God;", "Neh 9:7": "U bent die HEERE, de God, Die Abram hebt verkoren, en hem uit Ur der Chaldeeën uitgevoerd; en U hebt zijn naam gesteld Abraham.", "Fil 2:11": "En elke tong zou belijden dat Jezus Christus de Heere is, tot heerlijkheid van God de Vader.", "Jes 49:6": "Verder zei Hij: Het is te gering, dat U Mij een Knecht zou zijn, om op te richten de stammen van Jakob, en om terug te brengen de bewaarden in Israël; Ik heb U ook gegeven tot een Licht van de heidenen, om Mijn heil te zijn tot aan het einde van de aarde.", "Jer 17:5-8": "Zo zegt de HEERE: Vervloekt is de man die op een mens vertrouwt, en vlees tot zijn arm stelt, en wiens hart van de HEERE afwijkt! Want hij zal zijn als de heide in de wildernis, die het niet merkt wanneer het goede komt; maar blijft in dorre plaatsen in de woestijn, in zout en onbewoond land. Gezegend daarentegen is de man die op de HEERE vertrouwt, en wiens vertrouwen de HEERE is!", "Gen 19:16": "Maar hij aarzelde; toen grepen die mannen zijn hand, en de hand van zijn vrouw, en de hand van zijn twee dochters, omdat de HEERE hem genadig was; en zij brachten hem naar buiten, en zetten hem buiten de stad neer.", "Gen 22:14": "En Abraham noemde de naam van die plaats: De Heere zal het voorzien! Waarom tot op deze dag gezegd wordt: Op de berg van de HEERE zal het voorzien worden!", "Gen 12:1-7": "De HEERE had tegen Abram gezegd: Ga uit uw land, uit uw familie en uit het huis van uw vader, naar het land dat Ik u wijzen zal. En Ik zal u tot een groot volk maken, en u zegenen, en uw naam groot maken; en wees een zegen! En Ik zal zegenen wie u zegenen, en vervloeken wie u vervloekt; en in u zullen alle geslachten van de aarde gezegend worden.", "Ef 2:20": "gebouwd op het fundament van de apostelen en profeten, waarvan Jezus Christus Zelf is de uiterste Hoeksteen;", "Jes 35:8": "En daar zal een verheven baan, en een weg zijn, die de heilige weg genoemd zal worden; de onreine zal er niet doorgaan, maar hij zal voor deze zijn; wie deze weg gaat, zelfs de dwazen zullen niet dwalen.", "Gen 35:16": "En zij reisden verder van Bethel; en er was nog een kleine afstand om tot Efrath te komen; en Rachel baarde, en zij had het zwaar bij haar bevalling.", "Spr 29:12": "Een heerser die op leugentaal let, al zijn dienaars worden goddeloos.", "Ps 78:52": "En Hij voerde Zijn volk als schapen, en leidde hen, als een kudde, door de woestijn.", "Zach 9:10": "En Ik zal de wagens uit Efraïm uitroeien, en de paarden uit Jeruzalem; ook zal de strijdboog uitgeroeid worden, en Hij zal tot de heidenen vrede spreken; en Zijn heerschappij zal zijn van zee tot aan zee, en van de rivier tot aan de einden van de aarde.", "Zef 3:9-20": "Zeker, dan zal Ik tot de volken een reine spraak wenden; opdat zij allen de Naam van de HEERE aanroepen, opdat zij Hem dienen met één schouder³. Van de zijden van de rivieren van Morenland zullen Mijn ernstige aanbidders, met de dochter van Mijn verstrooiden, Mijn offeranden brengen. Op die dag zult u niet beschaamd zijn vanwege al uw handelingen, waarmee u tegen Mij overtreden hebt; want dan zal Ik uit uw midden wegnemen wie van vreugde opspringen over uw hoogmoed, en u zult zich voortaan niet meer verheffen om Mijn heilige berg.", "Jes 59:7": "Hun voeten lopen naar het kwade, en zij haasten zich om onschuldig bloed te vergieten; hun gedachten zijn gedachten van ongerechtigheid, verwoesting en verderf is op hun wegen.", "Rom 10:5": "Want Mozes beschrijft de rechtvaardigheid die uit de wet is, en zegt: De mens die deze dingen doet, zal daardoor leven.", "Matt 22:10": "En diezelfde dienstknechten gingen de wegen op en brachten allen bijeen die zij vonden, zowel slechten als goeden; en de bruiloft werd vervuld met gasten die aanzaten.", "Ps 102:14-17": "U zult opstaan, U zult U ontfermen over Sion, want de tijd om haar genadig te zijn, want de bestemde tijd is gekomen. Want Uw knechten hebben een welgevallen aan haar stenen, en hebben medelijden met haar gruis. Dan zullen de heidenen de Naam van de HEERE vrezen, en alle koningen van de aarde Uw heerlijkheid.", "1 Kor 1:19": "Want er is geschreven: Ik zal de wijsheid van de wijzen doen vergaan, en het verstand van de verstandigen zal Ik tenietdoen.", "Luk 23:30": "Dan zullen zij beginnen te zeggen tegen de bergen: Valt op ons; en tegen de heuvels: Bedekt ons.", "Ps 145:10": "Jod. Al Uw werken, HEERE, zullen U loven, en Uw gunstgenoten zullen U zegenen.", "Ezech 47:1-12": "Daarna bracht hij mij terug naar de deur van het huis, en zie, er stroomde water uit van onder de drempel van het huis naar het oosten; want de voorkant van het huis lag naar het oosten, en het water daalde af van onderen, uit de rechterzijde van het huis, ten zuiden van het altaar. En hij bracht mij naar buiten door de noordpoort, en leidde mij rondom via de weg van buiten naar de buitenpoort, de weg die naar het oosten kijkt; en zie, het water sprong eruit aan de rechterzijde. Toen die man naar het oosten uitging, had hij een meetsnoer in zijn hand; en hij mat duizend el, en liet mij door het water gaan, en het water kwam tot aan de enkels.", "Deut 32:36": "Want de HEERE zal Zijn volk recht doen, en het zal Hem berouwen over Zijn knechten; want Hij zal zien, dat de hand is weggegaan, en er niemand meer over is, gebonden of vrij.", "Openb 2:27": "En hij zal hen hoeden met een ijzeren staf; zij zullen als pottenbakkersvaten vermorzeld worden; zoals ook Ik van Mijn Vader ontvangen heb.", "Ps 32:2": "Gelukkig is de mens, die de HEERE de ongerechtigheid niet toerekent, en in wiens geest geen bedrog is.", "Jes 66:24": "En zij zullen naar buiten gaan, en zij zullen de dode lichamen zien van de mensen die tegen Mij in opstand zijn gekomen; want hun worm zal niet sterven, en hun vuur zal niet uitgeblust worden, en zij zullen voor alle vlees een afgrijzen zijn.", "Hand 13:35": "Daarom zegt hij ook in een andere psalm: U zult Uw Heilige geen verderving laten zien.", "Gen 11:31": "En Terah nam Abram, zijn zoon, en Lot, Harans zoon, de zoon van zijn zoon, en Sarai, zijn schoondochter, de vrouw van zijn zoon Abram, en zij trokken met hen uit Ur der Chaldeeën, om naar het land Kanaän te gaan; en zij kwamen tot Haran, en woonden daar.", "Matt 1:20-23": "En terwijl hij deze dingen overwoog, zie, de engel van de Heere verscheen hem in een droom en zei: Jozef, zoon van David! Wees niet bevreesd Maria, uw vrouw, tot u te nemen, want wat in haar ontvangen is, dat is uit de Heilige Geest; en zij zal een Zoon baren, en u zult Hem de naam JEZUS geven; want Hij zal Zijn volk zalig maken van hun zonden. En dit alles is gebeurd, opdat vervuld zou worden wat door de Heere gesproken is door de profeet, die zei:", "1 Kon 11:17": "Toen vluchtte Hadad, hij en enkele Edomitische mannen uit de dienaren van zijn vader met hem, om naar Egypte te gaan; Hadad was toen nog een kleine jongen.", "Jes 35:1": "De woestijn en de dorre plaatsen zullen hierover vrolijk zijn, en de wildernis zal zich verheugen, en zal bloeien als een roos.", "Ps 107:7": "En Hij leidde hen op een rechte weg, om te gaan naar een stad om in te wonen.", "Lev 18:5": "Ja, Mijn inzettingen en Mijn rechten zult u houden; welk mens die doet, die zal daardoor leven; Ik ben de HEERE!", "Rom 15:21": "maar zoals geschreven is: Aan wie van Hem niet was verkondigd, die zullen het zien; en die het niet gehoord hebben, die zullen het verstaan.", "Hand 3:22": "Want Mozes heeft tegen de vaderen gezegd: De Heere, uw God, zal u een Profeet doen opstaan uit uw broeders, zoals mij; naar Hem moet u luisteren, in alles wat Hij tegen u zal zeggen.", "Gen 21:33": "En hij plantte een bos in Berseba, en riep daar de Naam van de HEERE, de eeuwige God, aan.", "Mark 11:17": "En Hij onderwees hen, en zei: Staat er niet geschreven: Mijn huis zal een huis van gebed genoemd worden voor alle volken? Maar u hebt het tot een rovershol gemaakt.", "Gen 30:30": "Want het weinige dat u voor mij had, is uitgebroken tot een menigte; en de HEERE heeft u gezegend bij mijn komst; nu dan, wanneer zal ik ook voor mijn eigen huis werken?", "Dan 12:4": "En u, Daniël! sluit deze woorden toe, en verzegel dit boek, tot de tijd van het einde; velen zullen het naspeuren, en de kennis zal toenemen.", "Lev 12:8": "Maar als haar hand niet genoeg vindt voor een lam, zal zij twee tortelduiven of twee jonge duiven nemen, één als brandoffer en één als zondoffer; en de priester zal voor haar verzoening doen; zo zal zij rein zijn.", "2 Petr 3:15": "En beschouw het geduld van onze Heere als redding; zoals ook onze geliefde broeder Paulus, naar de wijsheid die hem gegeven is, aan u geschreven heeft;", "Ps 6:9": "Wijk van mij, alle werkers van de ongerechtigheid; want de HEERE heeft de stem van mijn geween gehoord.", "Jes 40:10": "Ziet, de Heere HEERE zal komen tegen de sterke, en Zijn arm zal heersen; ziet, Zijn loon is bij Hem, en Zijn arbeidsloon is voor Zijn aangezicht.", "Ps 5:10": "Want in hun mond is niets rechts, hun binnenste is enkel verderving, hun keel is een open graf, met hun tong vleien zij.", "Jes 29:19": "En de zachtmoedigen zullen vreugde op vreugde hebben in de HEERE; en de behoeftigen onder de mensen zullen zich in de Heilige van Israël verheugen.", "Gal 3:12": "Maar de wet is niet uit het geloof; maar de mens die deze dingen doet, zal daardoor leven.", "Mark 7:10": "Want Mozes heeft gezegd: Eer uw vader en uw moeder; en: Wie vader of moeder vervloekt, die zal zeker sterven.", "2 Sam 7:14": "Ik zal hem tot een Vader zijn, en hij zal Mij tot een zoon zijn; wanneer hij misdoet, zal Ik hem straffen met een mensenroede en met plagen van de mensenkinderen.", "Jes 42:1-12": "Zie, Mijn Knecht, Die Ik ondersteun, Mijn Uitverkorene, in Wie Mijn ziel een welbehagen heeft! Ik heb Mijn Geest op Hem gegeven; Hij zal het recht aan de heidenen voortbrengen. Hij zal niet schreeuwen, noch Zijn stem verheffen, noch Zijn stem op straat horen laten. Het geknakte riet zal Hij niet breken, en de rokende vlaswiek zal Hij niet uitblussen; met waarheid zal Hij het recht voortbrengen.", "Luk 3:4": "zoals geschreven is in het boek van de woorden van Jesaja, de profeet, die zei: De stem van iemand die roept in de woestijn: Bereid de weg van de Heere, maak Zijn paden recht!", "Hebr 2:13": "En verder: Ik zal Mijn vertrouwen op Hem stellen. En verder: Zie, hier ben Ik met de kinderen die God Mij gegeven heeft.", "Rom 11:4": "Maar wat zegt het Goddelijk antwoord tegen hem? Ik heb Mijzelf nog zevenduizend mannen overgelaten, die de knie voor het beeld van Baäl niet gebogen hebben.", "Ps 87:4": "Ik zal Rahab en Babel vermelden, onder hen die Mij kennen; zie, de Filistijn en de Tyriër, met de Moor, deze is daar geboren.", "Joh 16:13": "Maar wanneer Hij zal gekomen zijn, namelijk de Geest van de waarheid, zal Hij u in alle waarheid leiden; want Hij zal niet uit Zichzelf spreken, maar wat Hij zal gehoord hebben, zal Hij spreken, en de toekomende dingen zal Hij u verkondigen.", "Deut 32:12": "Zo leidde de HEERE hem alleen, en er was geen vreemde god met hem.", "Hand 15:17": "opdat de overige mensen de Heere zoeken, en alle heidenen, over wie Mijn Naam aangeroepen is, zegt de Heere, Die dit alles doet.", "Gen 27:29": "Volken zullen u dienen, en volken zullen zich voor u neerbuigen; wees heer over uw broers, en de zonen van uw moeder zullen zich voor u neerbuigen! Vervloekt moet hij zijn, wie u vervloekt; en wie u zegent, zij gezegend!", "Gen 12:1-9": "De HEERE had tegen Abram gezegd: Ga uit uw land, uit uw familie en uit het huis van uw vader, naar het land dat Ik u wijzen zal. En Ik zal u tot een groot volk maken, en u zegenen, en uw naam groot maken; en wees een zegen! En Ik zal zegenen wie u zegenen, en vervloeken wie u vervloekt; en in u zullen alle geslachten van de aarde gezegend worden.", "Rom 9:17": "Want de Schrift zegt tegen Farao: Hiertoe heb Ik u doen opstaan, opdat Ik in u Mijn kracht zou bewijzen, en opdat Mijn Naam verkondigd wordt op de hele aarde.", "Jes 45:8": "Drupt, hemelen! van boven af, en laat de wolken vloeien van gerechtigheid; en laat de aarde zich openen, en laat allerlei heil uitwassen, en gerechtigheid samen uitspruiten; Ik, de HEERE, heb ze geschapen.", "Ps 85:11-13": "De goedertierenheid en waarheid zullen elkaar ontmoeten; de gerechtigheid en vrede zullen elkaar kussen. De waarheid zal uit de aarde opkomen, en gerechtigheid zal vanuit de hemel neerzien. Ook zal de HEERE het goede geven; en ons land zal zijn vrucht geven.", "Joz 24:32": "Zij begroeven ook de beenderen van Jozef, die de kinderen van Israël uit Egypte hadden meegebracht, te Sichem, in dat stuk veld dat Jakob gekocht had van de kinderen van Hemor, de vader van Sichem, voor honderd stukken geld, want zij waren aan de kinderen van Jozef als erfelijk bezit toegevallen.", "Joh 19:36": "Want deze dingen zijn gebeurd, opdat de Schrift vervuld wordt: Geen been van Hem zal verbroken worden.", "Rom 10:13": "Want ieder die de Naam van de Heere zal aanroepen, zal zalig worden.", "Joh 7:38": "Wie in Mij gelooft, zoals de Schrift zegt: stromen van levend water zullen uit zijn buik vloeien.", "2 Kor 6:1": "En wij, als medearbeiders, bidden u ook dat u de genade van God niet tevergeefs mag hebben ontvangen.", "2 Kon 8:1": "Elisa had tegen de vrouw gesproken, van wie hij de zoon levend gemaakt had. Hij zei: Maak u klaar, en ga weg, u en uw huisgezin, en woon als vreemdeling waar u maar wonen kunt; want de HEERE heeft een hongersnood aangekondigd, die ook zeven jaar lang over het land zal komen.", "Gal 4:30": "Maar wat zegt de Schrift? Werp de dienstmaagd uit en haar zoon; want de zoon van de dienstmaagd zal geenszins erven met de zoon van de vrije.", "Hand 7:49": "De hemel is Mij een troon, en de aarde een voetbank voor Mijn voeten. Wat voor huis zult u Mij bouwen, zegt de Heere, of wat is de plaats van Mijn rust?", "Luk 1:69": "en heeft een hoorn van heil voor ons opgericht, in het huis van David, Zijn knecht;", "Rom 5:15": "Toch is het niet zo dat de genadegift is zoals de misdaad; want als door de misdaad van één velen gestorven zijn, is de genade van God, en de gave door de genade die er is van één Mens Jezus Christus, des te meer overvloedig geweest over velen.", "Luk 14:26": "Als iemand bij Mij komt en niet zijn vader, en moeder, en vrouw, en kinderen, en broers, en zussen, ja, zelfs ook zijn eigen leven haat, die kan Mijn discipel niet zijn.", "Rom 11:26": "En zo zal heel Israël zalig worden; zoals geschreven is: De Verlosser zal uit Sion komen en zal de goddeloosheden afwenden van Jakob.", "Gen 39:5": "En het gebeurde vanaf toen, dat hij hem aangesteld had over zijn huis en over alles wat hij had, dat de HEERE het huis van de Egyptenaar zegende, om Jozefs wil; ja, de zegen van de HEERE was op alles wat hij had, in het huis en op het veld.", "Hebr 1:9": "U hebt rechtvaardigheid liefgehad, en ongerechtigheid gehaat; daarom heeft God, Uw God, U gezalfd met de olie van vreugde boven Uw medegenoten.", "Jes 44:3": "Want Ik zal water gieten op de dorstige, en stromen op het droge; Ik zal Mijn Geest op uw nageslacht gieten, en Mijn zegen op uw nakomelingen.", "Hand 13:40": "Kijk dan uit, dat over u niet komt wat gezegd is in de profeten:", "Deut 32:17": "Zij hebben aan de duivelen geofferd, niet aan God; aan de goden, die zij niet kenden; nieuwe, die van dichtbij gekomen waren, voor wie uw vaders niet geschrikt hebben.", "Ps 89:20": "Toen hebt Gij in een gezicht gesproken van Uw heilige, en gezegd: Ik heb hulp besteld bij een held; Ik heb een verkorene uit het volk verhoogd.", "Fil 2:7": "Maar heeft Zichzelf ontledigd door de gestalte van een dienstknecht aan te nemen, en is de mensen gelijk geworden;", "Luk 23:34": "En Jezus zei: Vader, vergeef het hun; want zij weten niet wat zij doen. En zij verdeelden Zijn kleren en wierpen erom het lot.", "Jes 40:13": "Wie heeft de Geest van de HEERE bestierd, en wie heeft Hem als Zijn raadsman onderwezen?", "Jes 2:2-4": "En het zal gebeuren in de laatste dagen, dat de berg van het huis van de HEERE vastgesteld zal zijn op de top van de bergen, en dat hij verheven zal worden boven de heuvels, en tot hem zullen alle heidenvolken toevloeien. En veel volken zullen heengaan en zeggen: Kom, laat ons opgaan tot de berg van de HEERE, tot het huis van de God van Jakob, opdat Hij ons leert van Zijn wegen, en dat wij wandelen in Zijn paden; want uit Sion zal de wet uitgaan, en het woord van de HEERE uit Jeruzalem. En Hij zal rechtspreken onder de heidenvolken, en bestraffen veel volken; en zij zullen hun zwaarden slaan tot spaden, en hun speren tot snoeimessen; het ene volk zal tegen het andere volk geen zwaard opheffen, en zij zullen geen oorlog meer leren.", "Hand 2:31": "Heeft hij, dit vooruitziend, gesproken over de opstanding van Christus, dat Zijn ziel niet verlaten is in het rijk van de dood, en Zijn vlees geen verderving heeft gezien.", "Ps 40:8": "Toen zei ik: Zie, ik kom; in de rol van het boek is van mij geschreven.", "Ps 65:3": "U hoort het gebed; tot U zal alle vlees komen.", "1 Sam 17:11": "Toen Saul en heel Israël deze woorden van de Filistijn hoorden, schrokken zij enorm, en vreesden zeer.", "Dan 7:13": "Verder zag ik in de nachtgezichten, en zie, er kwam Een met de wolken van de hemel, als eens mensen zoon, en Hij kwam tot de Oude van dagen, en men liet Hem voor Hem naderen.", "Gen 32:30": "En Jakob noemde de naam van die plaats Pniël: Want, zei hij, ik heb God gezien van aangezicht tot aangezicht, en mijn ziel is gered.", "Jes 55:6": "Zoek de HEERE, terwijl Hij te vinden is; roep Hem aan, terwijl Hij nabij is.", "Fil 2:8": "En in gedaante gevonden als een mens, heeft Hij Zichzelf vernederd, gehoorzaam geworden tot de dood, ja, de dood van het kruis.", "Micha 4:4": "Maar zij zullen zitten, ieder onder zijn wijnstok en onder zijn vijgenboom, en er zal niemand zijn die hen verschrikt; want de mond van de HEERE van de heerscharen heeft het gesproken.", "Ps 27:11": "HEERE, leer mij Uw weg, en leid mij op het rechte pad, omwille van mijn verspieders.", "Hand 7:14": "En Jozef stuurde iemand heen, en liet zijn vader Jakob halen, en heel zijn familie, vijfenzeventig zielen in totaal.", "Ps 2:2": "De koningen van de aarde stellen zich op, en de vorsten beraadslagen samen tegen de HEERE, en tegen Zijn Gezalfde, en zeggen:", "2 Tim 2:19": "Toch staat het vaste fundament van God, met dit zegel: De Heere kent hen die van Hem zijn; en: Ieder die de Naam van Christus noemt, moet afstand nemen van ongerechtigheid.", "Ps 36:2": "De overtreding van de goddeloze spreekt in het binnenste van mijn hart: Er is geen vreze van God voor zijn ogen.", "Hebr 10:17": "En aan hun zonden en hun ongerechtigheden zal Ik geenszins meer denken.", "Jer 46:17": "Daar riepen zij: Farao, de koning van Egypte, is maar een gedruis; hij heeft de gezette tijd laten voorbijgaan.", "Deut 31:8": "De HEERE nu is Degene, Die voor u uitgaat; Die zal met u zijn; Hij zal u niet loslaten, en u niet verlaten; vrees niet, en wees niet ontsteld.", "Hand 7:37": "Dit is de Mozes die tegen de kinderen van Israël gezegd heeft: De Heere, uw God, zal u een Profeet doen opstaan uit uw broeders, zoals mij; naar Hem zult u luisteren.", "Ps 14:1-3": "Een psalm van David, voor de koorleider. De dwaas zegt in zijn hart: Er is geen God. Zij verderven het, zij maken het gruwelijk met hun werk; er is niemand die goed doet. De HEERE heeft uit de hemel neergezien op de mensenkinderen, om te zien of iemand verstandig was, die God zocht. Zij zijn allen afgeweken, samen zijn zij smerig geworden; er is niemand die goed doet, ook niet één.", "Joh 12:32": "En Ik, wanneer Ik van de aarde verhoogd zal zijn, zal allen tot Mij trekken.", "Dan 2:44": "Maar in de dagen van die koningen zal de God van de hemel een Koninkrijk oprichten, dat in eeuwigheid niet zal worden verwoest; en dat Koninkrijk zal aan geen ander volk worden overgelaten; het zal al die koninkrijken verbrijzelen en tenietdoen, maar zelf zal het in alle eeuwigheid bestaan.", "Hebr 9:20": "en zei: Dit is het bloed van het testament, dat God u geboden heeft.", "Matt 4:4": "Maar Hij antwoordde en zei: Er is geschreven: De mens zal niet van brood alleen leven, maar van elk woord dat uit de mond van God komt.", "Jes 56:7": "Die zal Ik ook brengen naar Mijn heilige berg, en Ik zal hen verheugen in Mijn huis van gebed; hun brandoffers en hun slachtoffers zullen aangenaam zijn op Mijn altaar; want Mijn huis zal een huis van gebed genoemd worden voor alle volken.", "Hebr 12:24": "En tot de Middelaar van het nieuwe testament, Jezus, en het bloed van de besprenging, dat betere dingen spreekt dan Abel.", "Ezech 17:23": "op de berg van de hoogte van Israël zal Ik hem planten; en hij zal takken voortbrengen, en vrucht dragen, en hij zal tot een heerlijke ceder worden, zodat onder hem alle vogels van allerlei vleugel zullen wonen; in de schaduw van zijn takken zullen zij wonen.", "Hand 13:33": "dat God die vervuld heeft aan ons, hun kinderen, doordat Hij Jezus verwekt heeft. Zoals ook in de tweede psalm geschreven staat: U bent Mijn Zoon, heden heb Ik U verwekt.", "1 Petr 3:14": "Maar als u ook lijdt om de gerechtigheid, dan bent u gelukkig te prijzen; en wees niet bang voor hun dreiging, en raak niet in verwarring;", "Jes 23:18": "En haar koophandel en haar hoerenloon zullen de HEERE heilig zijn, het zal niet als schat verzameld worden, en ook niet weggesloten; maar haar koophandel zal er zijn voor hen die voor het aangezicht van de HEERE wonen, opdat zij tot verzadiging eten, en opdat zij duurzame kleding hebben.", "Gen 13:2": "En Abram was zeer rijk, in vee, in zilver, en in goud.", "Num 11:22": "Zullen dan voor hen schapen en runderen geslacht worden, zodat het voor hen genoeg is? Zullen alle vissen van de zee voor hen verzameld worden, zodat het voor hen genoeg is?", "Mal 1:11": "Maar van de opgang van de zon tot haar ondergang, zal Mijn Naam groot zijn onder de heidenen; en op elke plaats zal aan Mijn Naam reukwerk gebracht worden, en een rein spijsoffer; want Mijn Naam zal groot zijn onder de heidenen, zegt de HEERE van de heerscharen.", "Jes 45:14": "Zo zegt de HEERE: De arbeid van de Egyptenaren en de koophandel van de Moren en van de Sabeërs, mannen van grote lengte, zullen tot u overkomen, en zij zullen van u zijn, zij zullen u navolgen, in boeien zullen zij overkomen; en zij zullen zich voor u buigen, zij zullen u smeken, en zeggen: Zeker, God is in u, en er is verder geen God meer.", "Jes 49:18-23": "Hef uw ogen op rondom, en zie, al dezen verzamelen zich, zij komen tot u; Zo waarachtig als Ik leef, spreekt de HEERE, zeker zult u zich met al dezen als met een sieraad bekleden, en u zult ze u aanbinden, zoals een bruid. Want in uw woeste en uw eenzame plaatsen, en uw verwoeste land, zeker, nu zult u benauwd worden van inwoners; en zij die u verslonden, zullen zich ver van u maken. Nog zullen de kinderen, waarvan u beroofd was, zeggen voor uw oren: De plaats is mij te nauw, wijk van mij, dat ik wonen mag.", "Ex 14:10-12": "Toen Farao dichtbij gekomen was, hieven de kinderen van Israël hun ogen op, en zie, de Egyptenaren trokken achter hen aan; en zij vreesden zeer; toen riepen de kinderen van Israël tot de HEERE. En zij zeiden tegen Mozes: Had u ons daarom, omdat er in Egypte helemaal geen graven waren, weggehaald, opdat wij in deze woestijn zouden sterven? Waarom heeft u ons dit aangedaan, dat u ons uit Egypte hebt weggevoerd? Is dit niet het woord dat wij in Egypte tot u spraken en zeiden: Houd op met ons, en laat ons de Egyptenaren dienen? Want het was ons beter geweest de Egyptenaren te dienen, dan in deze woestijn te sterven.", "Ps 112:2": "Gimel. Zijn nakomelingen zullen machtig zijn op aarde; Daleth. het geslacht van de oprechten zal gezegend worden.", "Ps 34:21": "Schin. Hij bewaart al zijn beenderen; niet een daarvan wordt gebroken.", "Ps 63:7": "Als ik aan U denk op mijn bed, dan peins ik over U in de nachtwaken.", "Joh 9:39": "En Jezus zei: Ik ben tot een oordeel in deze wereld gekomen, opdat zij die niet zien, zien mogen, en zij die zien, blind worden.", "Matt 21:13": "En Hij zei tegen hen: Er is geschreven: Mijn huis zal een huis van gebed genoemd worden; maar u hebt het tot een rovershol gemaakt.", "Ps 113:3": "Van de opgang van de zon af tot haar neergang zij de Naam van de HEERE geloofd.", "Gal 3:6": "Zoals Abraham God geloofd heeft, en het is hem tot rechtvaardigheid gerekend;", "Hos 13:14": "Toch zal Ik hen verlossen van de macht van het graf, Ik zal hen vrijmaken van de dood: o dood, waar zijn uw pestilentiën? Graf, waar is uw verderf? Berouw zal voor Mijn ogen verborgen zijn,", "Lev 19:12": "U zult niet vals bij Mijn Naam zweren; want u zou de Naam van uw God ontheiligen; Ik ben de HEERE.", "Hand 10:44": "Terwijl Petrus deze woorden nog sprak, viel de Heilige Geest op allen die het Woord hoorden.", "Joh 11:51": "En dit zei hij niet uit zichzelf; maar omdat hij dat jaar hogepriester was, profeteerde hij dat Jezus zou sterven voor het volk;", "Ps 44:23": "Maar om Uwentwil worden wij de hele dag gedood; wij worden geacht als slachtschapen.", "Dan 7:14": "En Hem werd gegeven heerschappij, en eer, en het Koninkrijk, dat alle volken, natiën en talen Hem zouden eren; Zijn heerschappij is een eeuwige heerschappij, die niet zal vergaan, en Zijn Koninkrijk zal niet te gronde gericht worden.", "Zach 9:1": "De last van het woord van de HEERE over het land Chadrach en Damaskus, zijn rustplaats; want de HEERE heeft een oog op de mens, zoals op alle stammen van Israël.", "Micha 5:1": "En u, Bethlehem Efratha, bent u klein om te zijn onder de duizenden van Juda? Uit u zal Mij Iemand voortkomen, Die een Heerser zal zijn in Israël, en Wiens uitgangen zijn van oudsher, van de dagen van de eeuwigheid.", "Matt 11:5": "De blinden worden ziende, en de kreupelen wandelen; de melaatsen worden gereinigd, en de doven horen; de doden worden opgewekt, en de armen wordt het Evangelie verkondigd.", "Ps 95:7-11": "Want Hij is onze God, en wij zijn het volk van Zijn weide, en de schapen van Zijn hand. Heden, als u Zijn stem hoort, Verhard uw hart niet, zoals te Meriba, zoals ten dage van Massa in de woestijn; Waar uw vaders Mij verzochten, Mij beproefden, ook Mijn werk zagen.", "Ps 80:18": "Uw hand zij over de man van Uw rechterhand, over de zoon van de mens, die U voor Uzelf gesterkt hebt.", "Joh 3:16": "Want zo lief heeft God de wereld gehad, dat Hij Zijn eniggeboren Zoon gegeven heeft, opdat ieder die in Hem gelooft, niet verloren gaat, maar het eeuwige leven heeft.", "Gen 39:7": "En het gebeurde na deze dingen, dat de vrouw van zijn heer haar ogen op Jozef liet vallen; en zij zei: lig bij mij!", "Fil 3:20": "Maar onze wandel is in de hemelen, waaruit wij ook de Zaligmaker verwachten, namelijk de Heere Jezus Christus;", "Ex 34:33": "Zo eindigde Mozes met hen te spreken, en hij had een sluier op zijn aangezicht gelegd.", "Gen 15:6": "En hij geloofde in de HEERE; en Hij rekende het hem tot gerechtigheid.", "Gen 24:16": "En dat meisje was zeer mooi van aangezicht, een maagd, en geen man had haar bekend; en zij ging naar beneden naar de bron, en vulde haar kruik, en ging weer omhoog.", "Deut 24:14": "U zult de arme en behoeftige dagloner niet verdrukken, die uit uw broeders is, of uit uw vreemdelingen die in uw land en in uw poorten zijn.", "Num 16:5": "En hij sprak tot Korach en tot zijn hele vergadering, en zei: Morgenvroeg zal de HEERE bekendmaken wie van Hem is, en wie de heilige is, die Hij tot Zich zal laten naderen; en wie Hij verkoren zal hebben, die zal Hij tot Zich laten naderen.", "Kol 1:20-23": "en dat Hij, door Hem vrede gemaakt te hebben door het bloed van Zijn kruis, door Hem, zeg ik, alle dingen met Zichzelf verzoenen zou, hetzij de dingen die op de aarde, hetzij de dingen die in de hemelen zijn. En u, die eertijds vervreemd was en vijanden door het verstand in de boze werken, heeft Hij nu ook verzoend, in het lichaam van Zijn vlees, door de dood, opdat Hij u heilig en onberispelijk en onbeschuldigbaar voor Zich zou stellen;", "Ps 91:12": "Zij zullen u op de handen dragen, opdat u uw voet aan geen steen stoot.", "1 Joh 2:25": "En dit is de belofte, die Hij ons beloofd heeft, namelijk het eeuwige leven.", "Gal 3:10": "Want zovelen als er uit de werken van de wet zijn, die zijn onder de vloek; want er is geschreven: Vervloekt is ieder die niet blijft in alles wat geschreven is in het boek van de wet, om dat te doen.", "Jes 51:5": "Mijn gerechtigheid is nabij, Mijn heil trekt uit, en Mijn armen zullen de volken richten; op Mij zullen de eilanden wachten, en op Mijn arm zullen zij hopen.", "Mal 3:1-3": "Zie, Ik zend Mijn engel, die voor Mijn aangezicht de weg bereiden zal; en snel zal die Heere, Die u zoekt, tot Zijn tempel komen, namelijk de Engel van het verbond, aan Wie u lust hebt; zie, Hij komt, zegt de HEERE van de heerscharen. Maar wie zal de dag van Zijn komst verdragen, en wie zal standhouden als Hij verschijnt? Want Hij zal zijn als het vuur van een goudsmid, en als zeep van de blekers. En Hij zal zitten, louterend, en het zilver reinigend, en Hij zal de kinderen van Levi reinigen, en Hij zal ze doorlouteren als goud en als zilver; dan zullen zij de HEERE spijsoffer toebrengen in gerechtigheid.", "Hand 13:41": "Zie, u verachters, verwonder u, en verdwijn; want Ik doe een werk in uw dagen, een werk dat u beslist niet zult geloven, ook al vertelt iemand het u.", "Jes 55:10-13": "Want zoals de regen en de sneeuw van de hemel neerdaalt, en daarheen niet terugkeert; maar de aarde doorvochtigt, en maakt dat zij voortbrengt en uitspruit, en zaad geeft aan de zaaier, en brood aan de eter; Zo zal Mijn woord, dat uit Mijn mond uitgaat, ook zijn, het zal niet leeg naar Mij terugkeren; maar het zal doen wat Mij behaagt, en het zal voorspoedig zijn in wat, waartoe Ik het zend. Want in blijdschap zult u uittrekken, en met vrede voortgeleid worden; de bergen en heuvelen zullen geschal maken met vrolijk gezang voor uw aangezicht, en alle bomen van het veld zullen de handen samenklappen.", "1 Kon 19:13-18": "En het gebeurde, toen Elia dat hoorde, dat hij zijn gezicht bedekte met zijn mantel, en naar buiten ging, en ging staan in de ingang van de grot. En zie, een stem kwam tot hem, die zei: Wat doet u hier, Elia? En hij zei: Ik heb mij zeer sterk ingezet voor de HEERE, de God van de heerscharen; want de Israëlieten hebben Uw verbond verlaten, Uw altaren afgebroken en Uw profeten met het zwaard gedood; en ik alleen ben overgebleven, en zij zoeken mij te doden. En de HEERE zei tegen hem: Ga, keer terug op uw weg, naar de woestijn van Damaskus; en als u daar aankomt, zalf dan Hazaël tot koning over Syrië.", "Jes 53:7": "Toen die geëist werd, werd Hij verdrukt; maar Hij deed Zijn mond niet open; als een lam werd Hij ter slachting geleid, en zoals een schaap stom is voor het aangezicht van zijn scheerders, zo deed Hij Zijn mond niet open.", "Hebr 10:16": "want nadat Hij eerder gezegd had: Dit is het verbond, dat Ik met hen sluiten zal na die dagen, zegt de Heere: Ik zal Mijn wetten in hun harten geven, en Ik zal die in hun verstand schrijven;", "Hebr 6:14": "en zei: Waarlijk, Ik zal u overvloedig zegenen, en Ik zal u overvloedig meer maken.", "Matt 9:12": "Maar Jezus hoorde dat en zei tegen hen: Wie gezond zijn hebben de dokter niet nodig, maar wie ziek zijn.", "Joh 5:26": "Want zoals de Vader het leven heeft in Zichzelf, zo heeft Hij ook de Zoon gegeven het leven te hebben in Zichzelf;", "Hebr 10:5": "Daarom zegt Hij, bij Zijn komst in de wereld: Slachtoffer en offergave hebt U niet gewild, maar U hebt Mij een lichaam toebereid;", "Rom 7:7": "Wat zullen wij dan zeggen? Is de wet zonde? Volstrekt niet. Ja, ik kende de zonde niet dan door de wet; want ik had ook de begeerte niet gekend als zonde, als de wet niet zei: U zult niet begeren.", "Jak 2:23": "En de Schrift is vervuld die zegt: En Abraham geloofde God, en het is hem tot rechtvaardigheid gerekend, en hij is een vriend van God genoemd.", "Mark 16:15": "En Hij zei tegen hen: Ga heen in de hele wereld, predik het Evangelie aan alle schepselen.", "Jes 33:5": "De HEERE is verheven, want Hij woont in de hoogte; Hij heeft Sion vervuld met recht en gerechtigheid.", "Dan 12:1-13": "En in die tijd zal Michaël opstaan, die grote vorst, die voor de kinderen van uw volk staat, als het zo'n tijd van benauwdheid zal zijn, als er niet geweest is sinds er een volk geweest is, tot op die tijd toe; en in die tijd zal uw volk verlost worden, ieder die gevonden wordt geschreven te zijn in het boek. En velen van hen die in het stof van de aarde slapen, zullen ontwaken, dezen tot eeuwig leven, en anderen tot versmaadheden en tot eeuwige afgrijzing. De leraars nu zullen blinken als de glans van het uitspansel, en zij die er velen rechtvaardigen, gelijk de sterren, voor altijd en eeuwig.", "Joh 17:3": "En dit is het eeuwige leven, dat zij U kennen, de enige waarachtige God, en Jezus Christus, Die U gezonden hebt.", "Jer 31:34": "En zij zullen niet meer, ieder zijn naaste, en ieder zijn broeder, onderwijzen door te zeggen: Kent de HEERE! Want zij zullen Mij allen kennen, van hun kleinste tot hun grootste toe, spreekt de HEERE; want Ik zal hun ongerechtigheid vergeven, en aan hun zonden niet meer denken.", "1 Kor 10:20": "Nee, maar ik zeg dat wat de heidenen offeren, zij dat aan de duivelen offeren en niet aan God; en ik wil niet dat u gemeenschap hebt met de duivelen.", "Matt 13:31-33": "Een andere gelijkenis heeft Hij hun voorgehouden en zei: Het Koninkrijk der hemelen is gelijk aan een mosterdzaadje, dat een mens genomen heeft en in zijn akker gezaaid heeft; Dat wel het kleinste is van alle zaden, maar wanneer het opgegroeid is, is het het grootste van de tuingewassen, en het wordt een boom, zodat de vogels van de hemel komen en nestelen in zijn takken. Een andere gelijkenis sprak Hij tot hen: Het Koninkrijk der hemelen is gelijk aan zuurdesem, die een vrouw nam en verborg in drie maten van het meel, totdat het geheel gezuurd was.", "Jes 59:17": "Want Hij trok gerechtigheid aan als een pantser, en de helm van het heil zette Hij op Zijn hoofd, en de kleren van de wraak trok Hij aan als kleding, en Hij deed de ijver aan als een mantel.", "Hand 26:23": "Namelijk dat de Christus moest lijden, en dat Hij, als Eerste uit de opstanding van de doden, een licht zou verkondigen aan dit volk en aan de heidenen.", "Jes 61:1-11": "De Geest van de Heere HEERE is op Mij, omdat de HEERE Mij gezalfd heeft, om een blijde boodschap te brengen aan de zachtmoedigen; Hij heeft Mij gezonden om te verbinden de gebrokenen van hart, om de gevangenen vrijheid uit te roepen, en de gebondenen opening van de gevangenis; Om uit te roepen het jaar van het welbehagen van de HEERE, en de dag van de wraak van onze God; om alle treurenden te troosten; Om de treurenden van Sion te geven, dat hun sieraad gegeven wordt voor as, vreugdeolie voor treurigheid, het gewaad van lof voor een benauwde geest; opdat zij eikenbomen van de gerechtigheid genoemd worden, een planting van de HEERE, opdat Hij verheerlijkt wordt.", "Ps 68:33": "U koninkrijken van de aarde, zingt voor God; zingt psalmen voor de Heere! Sela.", "2 Sam 24:25": "En David bouwde daar de HEERE een altaar, en offerde brandoffers en dankoffers. Zo werd de HEERE verbeden voor het land, en deze plaag werd van over Israël opgehouden.", "Mark 15:34": "En op het negende uur riep Jezus met luide stem: ELOÏ, ELOÏ, LAMMA SABACHTANI, dat vertaald betekent: Mijn God, Mijn God, waarom hebt U Mij verlaten?", "Gen 43:1": "De honger werd zwaar in dat land;", "Ex 33:13-15": "Nu dan, ik bid U, als ik genade gevonden heb in Uw ogen, laat mij dan nu Uw weg weten, en ik zal U kennen, opdat ik genade vind in Uw ogen; en zie aan dat dit volk Uw volk is! Hij dan zei: Zou Mijn aangezicht met u meegaan, om u rust te geven? Toen zei hij tegen Hem: Als Uw aangezicht niet meegaat, laat ons dan van hier niet optrekken!", "Luk 22:37": "Want Ik zeg u, dat nog dit, wat geschreven is, in Mij vervuld moet worden, namelijk: En Hij is met de misdadigers gerekend. Want ook wat over Mij geschreven is, heeft een einde.", "Luk 2:26": "En hem was door de Heilige Geest een goddelijke openbaring gedaan, dat hij de dood niet zien zou voordat hij de Christus van de Heere zou zien.", "1 Kon 11:40": "Daarom zocht Salomo Jerobeam te doden; maar Jerobeam maakte zich op en vluchtte naar Egypte, naar Sisak, de koning van Egypte, en was in Egypte totdat Salomo stierf.", "Rom 10:12-14": "Want er is geen onderscheid tussen Jood en Griek; want eenzelfde Heere is Heere van allen, rijk over allen die Hem aanroepen. Want ieder die de Naam van de Heere zal aanroepen, zal zalig worden. Hoe zullen zij Hem dan aanroepen, in Wie zij niet geloofd hebben? En hoe zullen zij in Hem geloven, van Wie zij niet gehoord hebben? En hoe zullen zij horen, zonder iemand die hun predikt?", "Jes 35:2": "Zij zal uitbundig bloeien, en zich verheugen, ja, met verheuging, en juichen; de heerlijkheid van Libanon is haar gegeven, het sieraad van Karmel en Saron; zij zullen de heerlijkheid van de HEERE zien, het sieraad van onze God.", "Gen 32:5": "en ik heb ossen en ezels, schapen en knechten en dienstmeisjes; en ik heb gezonden om mijn heer dit aan te zeggen, opdat ik genade vind in uw ogen.", "Joh 8:35": "En de dienstknecht blijft niet eeuwig in het huis, de zoon blijft er eeuwig.", "Gen 20:12": "En bovendien is zij werkelijk mijn zuster; zij is de dochter van mijn vader, maar niet de dochter van mijn moeder; en zij is mij tot vrouw geworden.", "Ruth 1:1": "In de dagen dat de rechters rechtspraken, gebeurde het dat er honger in het land was; daarom trok een man van Bethlehem-juda weg om als vreemdeling te wonen in de velden van Moab, hij, en zijn vrouw, en zijn twee zonen.", "Joh 11:52": "en niet alleen voor dat volk, maar ook opdat Hij de kinderen van God die verstrooid waren, tot één zou samenbrengen.", "Mal 4:5": "Zie, Ik zend u de profeet Elia, voordat die grote en vreselijke dag van de HEERE komt.", "Luk 1:55": "zoals Hij gesproken heeft tot onze vaderen, tot Abraham en zijn nageslacht, tot in eeuwigheid.", "Rom 10:15": "En hoe zullen zij prediken, als zij niet gezonden worden? Zoals geschreven is: Hoe lieflijk zijn de voeten van hen die vrede verkondigen, van hen die het goede verkondigen!", "Joz 8:17": "En er bleef geen man over in Ai of Beth-el, die niet uittrok, Israël na; en zij lieten de stad openstaan, en joegen Israël achterna.", "Hebr 11:8-17": "Door het geloof is Abraham, toen hij geroepen werd, gehoorzaam geweest om uit te gaan naar de plaats die hij tot een erfdeel zou ontvangen; en hij is uitgegaan zonder te weten waar hij komen zou. Door het geloof is hij een inwoner geweest in het land van de belofte, als in een vreemd land, en heeft hij in tenten gewoond met Izak en Jakob, die medeerfgenamen waren van dezelfde belofte. Want hij verwachtte de stad die fundamenten heeft, waarvan God de Ontwerper en Bouwer is.", "Ps 144:14": "Dat onze ossen goed beladen zijn; dat er geen inbraak is, geen uitval, geen gejammer op onze straten.", "Gal 1:3": "Genade zij u en vrede van God de Vader, en onze Heere Jezus Christus;", "Ps 69:5": "Die mij zonder oorzaak haten, zijn meer dan de haren van mijn hoofd; die mij zoeken te vernielen, die mij om valse oorzaken vijand zijn, zijn machtig geworden; wat ik niet geroofd heb, moet ik dan teruggeven.", "Jes 25:6-8": "En de HEERE van de heerscharen zal op deze berg voor alle volken een vette maaltijd maken, een maaltijd van reine wijn, van vet vol merg, van reine wijnen, die gezuiverd zijn. En Hij zal op deze berg verslinden het bewindsel van het aangezicht, waarmee alle volken bewonden zijn, en het deksel, waarmee alle naties bedekt zijn. Hij zal de dood verslinden tot overwinning, en de Heere HEERE zal de tranen van alle aangezichten afwissen; en Hij zal de smaad van Zijn volk van de hele aarde wegnemen; want de HEERE heeft het gesproken.", "2 Sam 14:14": "Want wij moeten sterven, en zijn als water dat, uitgestort op de aarde, niet meer verzameld kan worden. God zal echter het leven niet wegnemen, maar Hij zal er middelen op bedenken, dat Hij de verstotene niet van Zich verstoot.", "Jes 57:18": "Ik zie zijn wegen, en Ik zal hem genezen; en Ik zal hem leiden, en hem vertroostingen teruggeven, namelijk aan hen die om hem treuren.", "Luk 2:32": "een licht tot verlichting van de heidenen, en tot heerlijkheid van Uw volk Israël.", "Kol 1:12-14": "terwijl u de Vader dankt, Die ons bekwaam gemaakt heeft om deel te hebben aan de erfenis van de heiligen in het licht; Die ons getrokken heeft uit de macht van de duisternis, en overgezet heeft in het Koninkrijk van de Zoon van Zijn liefde; in Wie wij de verlossing hebben door Zijn bloed, namelijk de vergeving van de zonden;", "Jer 3:23": "Waarlijk, tevergeefs verwacht men het van de heuvels en de menigte van bergen; waarlijk, in de HEERE, onze God, is het heil van Israël!", "1 Tim 1:1": "Paulus, een apostel van Jezus Christus, naar het bevel van God, onze Zaligmaker, en de Heere Jezus Christus, Die onze Hoop is,", "Gen 19:15": "En toen de dageraad opging, drongen de engelen bij Lot aan en zeiden: Maak u klaar, neem uw vrouw, en uw twee dochters die hier zijn, opdat u niet omkomt door de ongerechtigheid van deze stad.", "Deut 6:10": "Als het dan gebeurd zal zijn, dat de HEERE, uw God, u zal hebben gebracht in dat land, dat Hij aan uw vaderen, Abraham, Izak en Jakob, gezworen heeft u te zullen geven; grote en goede steden, die u niet gebouwd hebt,", "Rom 1:14": "Aan Grieken en barbaren, aan wijzen en onwijzen ben ik een schuldenaar.", "Joh 10:16": "Ik heb nog andere schapen, die niet van deze schaapskooi zijn; ook die moet Ik toebrengen; en zij zullen Mijn stem horen; en het zal worden één kudde, en één Herder.", "Jer 31:7-9": "Want zo zegt de HEERE: Roept luide over Jakob met vreugde, en juicht vanwege het hoofd van de heidenvolken; laat het horen, lofzingt, en zegt: O HEERE! Behoud Uw volk, het overblijfsel van Israël. Zie, Ik zal ze aanbrengen uit het land van het noorden, en zal hen verzamelen van de einden van de aarde; onder hen zullen blinden en lammen zijn, zwangere vrouwen en barenden samen; met een grote menigte zullen zij hierheen terugkomen. Zij zullen komen met geween, en met smekingen zal Ik hen leiden; Ik zal hen leiden aan de waterbeken, op een rechte weg, waarop zij zich niet zullen stoten; want Ik ben Israël tot een Vader, en Efraïm is Mijn eerstgeborene.", "Openb 5:5-14": "En een van de oudsten zei tegen mij: Huil niet; zie, de Leeuw uit de stam van Juda, de Wortel van David, heeft overwonnen om het boek te openen en zijn zeven zegels te verbreken. En ik zag, en zie, in het midden van de troon, en van de vier dieren, en in het midden van de oudsten, een Lam, dat stond als geslacht, met zeven horens en zeven ogen; dat zijn de zeven Geesten van God, die uitgezonden zijn over de hele aarde. En Het kwam en heeft het boek genomen uit de rechterhand van Hem Die op de troon zat.", "Jes 65:23": "Zij zullen niet tevergeefs arbeiden, noch baren voor verstoring; want zij zijn het nageslacht van de gezegenden van de HEERE, en hun nakomelingen met hen.", "Jes 65:2": "Ik heb Mijn handen uitgebreid, de hele dag, tot een opstandig volk, dat wandelt op een weg die niet goed is, naar hun eigen gedachten.", "Hos 7:4": "Zij plegen allemaal samen overspel, zij zijn als een bakoven, die heet gemaakt is door de bakker; die ophoudt met opstoken nadat hij het deeg heeft gekneed, totdat het doorgezuurd is.", "Matt 2:18": "Een stem is in Rama gehoord, geklaag, geween en veel gekerm; Rachel beweende haar kinderen, en wilde niet getroost worden, omdat zij er niet meer zijn!", "Hebr 2:17": "Daarom moest Hij in alles aan Zijn broeders gelijk worden, opdat Hij een barmhartig en getrouw Hogepriester zou zijn in de dingen die bij God gedaan moeten worden, om de zonden van het volk te verzoenen.", "Gen 17:19": "En God zei: Voorwaar, Sara, uw vrouw, zal u een zoon baren, en u zult zijn naam Izak noemen; en Ik zal Mijn verbond met hem oprichten, tot een eeuwig verbond voor zijn nageslacht na hem.", "2 Petr 2:20": "Want als zij, nadat zij door de kennis van de Heere en Zaligmaker Jezus Christus aan de besmettingen van de wereld ontkomen zijn, daar opnieuw in verstrikt raken en erdoor overwonnen worden, dan is voor hen het laatste erger geworden dan het eerste.", "Mark 16:16": "Wie geloofd zal hebben, en gedoopt zal zijn, zal behouden worden; maar wie niet geloofd zal hebben, zal verdoemd worden.", "Num 32:11": "Zeker, deze mannen die uit Egypte zijn opgetrokken, van twintig jaar oud en daarboven, zullen het land niet zien dat Ik Abraham, Izak en Jakob gezworen heb! Want zij hebben Mij niet volledig gevolgd;", "Gen 12:1-4": "De HEERE had tegen Abram gezegd: Ga uit uw land, uit uw familie en uit het huis van uw vader, naar het land dat Ik u wijzen zal. En Ik zal u tot een groot volk maken, en u zegenen, en uw naam groot maken; en wees een zegen! En Ik zal zegenen wie u zegenen, en vervloeken wie u vervloekt; en in u zullen alle geslachten van de aarde gezegend worden.", "Jes 4:2": "Op die dag zal de SPRUIT van de HEERE tot sieraad en heerlijkheid zijn, en de vrucht van de aarde tot voortreffelijkheid en tot versiering voor hen die ontkomen zullen in Israël.", "Deut 6:4": "Hoor, Israël! De HEERE, onze God, is een enig HEERE!", "2 Kon 6:25-29": "En er kwam grote honger in Samaria; want zie, zij belegerden de stad, totdat een ezelskop voor tachtig zilverstukken werd verkocht, en een vierde deel van een kab duivenmest voor vijf zilverstukken. En het gebeurde, toen de koning van Israël over de muur voorbijging, dat een vrouw tegen hem riep, en zei: Help mij, heer koning! En hij zei: De HEERE helpt u niet; waarmee zou ik u helpen? Van de dorsvloer of van de wijnpers?", "Ef 2:8": "Want uit genade bent u zalig geworden door het geloof; en dat niet uit u, het is Gods gave;", "Hand 9:13": "En Ananias antwoordde: Heere, ik heb van velen gehoord over deze man, hoeveel kwaad hij Uw heiligen in Jeruzalem heeft aangedaan;", "Rom 1:2": "(Wat Hij van tevoren beloofd had door Zijn profeten, in de heilige Schriften),", "Ps 41:10": "Zelfs de man van mijn vrede, op wie ik vertrouwde, die mijn brood at, heeft zijn hiel tegen mij groot gemaakt.", "Luk 1:41-45": "En het gebeurde, toen Elizabet de groet van Maria hoorde, dat het kindje opsprong in haar buik; en Elizabet werd vervuld met de Heilige Geest; en riep met luide stem uit, en zei: Gezegend bent u onder de vrouwen, en gezegend is de vrucht van uw buik! En waar heb ik dit aan te danken, dat de moeder van mijn Heere naar mij toe komt?", "Deut 30:20": "door de HEERE, uw God, lief te hebben, Zijn stem gehoorzaam te zijn, en Hem aan te hangen; want Hij is uw leven en de lengte van uw dagen; opdat u blijft in het land dat de HEERE uw vaderen, Abraham, Izak en Jakob, gezworen heeft hun te zullen geven.", "Ps 118:6": "De HEERE is bij mij, ik zal niet vrezen; wat zal een mens mij doen?", "1 Kor 1:16": "Overigens heb ik ook het huisgezin van Stefanus gedoopt; verder weet ik niet, of ik iemand anders gedoopt heb.", "Ps 8:7": "U doet hem heersen over de werken van Uw handen; U hebt alles onder zijn voeten gezet;", "Ex 6:11": "Doch Mozes sprak voor de HEERE en zei: Zie, de kinderen van Israël hebben naar mij niet geluisterd; hoe zou Farao dan naar mij luisteren? Bovendien ben ik onbesneden van lippen.", "Ef 6:2": "Eer uw vader en moeder (dat is het eerste gebod met een belofte),", "Rom 5:2": "Door Wie wij ook de toeleiding hebben door het geloof tot deze genade, waarin wij staan, en roemen in de hoop van de heerlijkheid van God.", "Gen 8:20": "En Noach bouwde de HEERE een altaar; en hij nam van al het reine vee, en van al het rein gevogelte, en offerde brandoffers op dat altaar.", "Rom 4:11": "En hij heeft het teken van de besnijdenis ontvangen als een zegel van de rechtvaardigheid van het geloof, die hem toegerekend was toen hij nog onbesneden was: opdat hij een vader zou zijn van allen die geloven terwijl zij onbesneden zijn, opdat ook hun de rechtvaardigheid toegerekend wordt;", "Joh 4:14": "maar wie gedronken zal hebben van het water dat Ik hem geven zal, die zal in eeuwigheid geen dorst meer krijgen; maar het water dat Ik hem zal geven, zal in hem worden een fontein van water, opwellend tot in het eeuwige leven.", "Rom 10:9": "namelijk: als u met uw mond de Heere Jezus belijdt, en met uw hart gelooft dat God Hem uit de doden heeft opgewekt, zult u zalig worden.", "Hebr 1:6": "En als Hij de Eerstgeborene opnieuw in de wereld inbrengt, zegt Hij: En dat alle engelen van God Hem aanbidden.", "Ps 23:3": "Hij verkwikt mijn ziel; Hij leidt mij in het spoor van de gerechtigheid, omwille van Zijn Naam.", "Jes 52:15": "zo zal Hij veel heidenvolken besprenkelen; ja, koningen zullen hun mond over Hem dichthouden; want aan wie het niet verkondigd was, die zullen het zien, en wie het niet gehoord hebben, die zullen het begrijpen.", "2 Kon 7:4": "Als wij zeggen: Laat ons de stad in gaan, dan is de honger in de stad, en zullen wij daar sterven, en als wij hier blijven, zullen wij ook sterven; nu dan, kom, laat ons naar het leger van de Syriërs overlopen; als zij ons laten leven, zullen wij leven; en als zij ons doden, zullen wij maar sterven.", "Ezech 17:22-24": "Zo zegt de Heere HEERE: Ik zal ook van de opperste tak van de hoge ceder nemen, dat Ik zal planten; van de top van zijn jonge takjes zal Ik een teer takje afplukken, dat Ik op een hoge en verheven berg planten zal; op de berg van de hoogte van Israël zal Ik hem planten; en hij zal takken voortbrengen, en vrucht dragen, en hij zal tot een heerlijke ceder worden, zodat onder hem alle vogels van allerlei vleugel zullen wonen; in de schaduw van zijn takken zullen zij wonen. Zo zullen alle bomen van het veld weten dat Ik, de HEERE, de hoge boom vernederd heb, de nederige boom verheven heb, de groene boom verdroogd heb, en de droge boom bloeiend gemaakt heb; Ik, de HEERE, heb het gesproken, en zal het doen.", "Joh 11:25-27": "Jezus zei tegen haar: Ik ben de Opstanding en het Leven; wie in Mij gelooft zal leven, ook al was hij gestorven; en ieder die leeft en in Mij gelooft, zal niet sterven in eeuwigheid. Gelooft u dat? Zij zei tegen Hem: Ja, Heere; ik heb geloofd dat U de Christus bent, de Zoon van God, Die in de wereld komen zou.", "Ex 20:13": "U zult niet doodslaan.", "Jes 59:8": "De weg van de vrede kennen zij niet; en er is geen recht in hun gangen; hun paden maken zij krom voor zichzelf; ieder die daarop gaat, kent de vrede niet.", "Mark 15:36": "En er liep iemand, en vulde een spons met azijn, en stak die op een rietstok, en gaf Hem te drinken, en zei: Laat staan, laten we zien of Elia komt om Hem eraf te halen.", "2 Sam 7:12": "Wanneer uw dagen vervuld zullen zijn, en u met uw vaderen zult ontslapen zijn, dan zal Ik uw nakomeling na u doen opstaan, die uit uw lijf voortkomen zal, en Ik zal zijn koninkrijk bevestigen.", "Matt 8:20": "En Jezus zei tegen hem: De vossen hebben holen, en de vogels van de hemel nesten; maar de Zoon des mensen heeft niets waar Hij het hoofd kan neerleggen.", "Ps 117:1": "Loof de HEERE, alle heidenvolken; prijs Hem, alle natiën!", "Ps 78:2": "Ik zal mijn mond opendoen met spreuken; ik zal geheimen overvloedig uitstorten, van oude tijden af.", "1 Kor 15:24-28": "Daarna zal het einde zijn, wanneer Hij het Koninkrijk aan God en de Vader zal hebben overgegeven; wanneer Hij alle heerschappij, alle macht en kracht zal hebben tenietgedaan. Want Hij moet als Koning heersen, totdat Hij alle vijanden onder Zijn voeten zal hebben gelegd. De laatste vijand die tenietgedaan wordt, is de dood.", "Ps 86:9": "Al de heidenen, Heere! die Gij gemaakt hebt, zullen komen, en zullen zich voor Uw aangezicht neerbuigen, en Uw Naam eren.", "Ps 105:8-11": "Hij gedenkt Zijn verbond tot in eeuwigheid, het woord dat Hij ingesteld heeft, tot in duizend geslachten; Het verbond, dat Hij met Abraham heeft gemaakt, en Zijn eed aan Izak; Wat Hij ook aan Jakob gesteld heeft tot een inzetting, aan Israël tot een eeuwig verbond,", "Gen 34:2": "Sichem nu, de zoon van Hemor de Heviet, de landvorst, zag haar, en hij nam haar, en lag bij haar, en verkrachtte haar.", "1 Petr 1:25": "maar het Woord van de Heere blijft in eeuwigheid. En dit is het Woord dat onder u verkondigd is.", "Hebr 1:14": "Zijn zij niet allemaal dienende geesten, die uitgezonden worden om te dienen, om hen die de zaligheid zullen beërven?", "Hebr 2:6-8": "Maar iemand heeft ergens verklaard: Wat is de mens, dat U aan hem denkt, of de zoon van de mens, dat U naar hem omziet! U hebt hem een weinig minder gemaakt dan de engelen; met heerlijkheid en eer hebt U hem gekroond, en hebt U hem gesteld over de werken van Uw handen; Alle dingen hebt U onder zijn voeten onderworpen. Want doordat Hij hem alle dingen onderworpen heeft, heeft Hij niets overgelaten dat hem niet onderworpen is; maar nu zien wij nog niet dat hem alle dingen onderworpen zijn;", "Hand 2:35": "Totdat Ik Uw vijanden tot een voetbank voor Uw voeten gezet zal hebben.", "Rom 9:8": "Dat is: niet de kinderen van het vlees zijn kinderen van God, maar de kinderen van de belofte worden als nageslacht gerekend.", "Spr 6:29": "Zo vergaat het hem die bij de vrouw van zijn naaste komt; wie haar aanraakt, zal niet onschuldig blijven.", "Jer 23:6": "In Zijn dagen zal Juda verlost worden, en Israël zal zeker wonen; en dit zal Zijn naam zijn, waarmee men Hem zal noemen: De Heere: ONZE GERECHTIGHEID.", "1 Tess 1:10": "En om Zijn Zoon uit de hemelen te verwachten, Die Hij uit de doden heeft opgewekt, namelijk Jezus, Die ons verlost van de toekomende toorn.", "Hand 2:34": "Want David is niet opgevaren naar de hemel; maar hij zegt zelf: De Heere heeft gesproken tot mijn Heere: Zit aan Mijn rechterhand,", "Gen 28:13": "En zie, de HEERE stond boven op de ladder en zei: Ik ben de HEERE, de God van uw vader Abraham, en de God van Izak; dit land, waarop u ligt te slapen, zal Ik aan u geven, en aan uw nageslacht.", "Ef 2:3-5": "onder wie ook wij allen eertijds verkeerd hebben, in de begeerten van ons vlees, terwijl wij deden de wil van het vlees en van de gedachten; en wij waren van nature kinderen van de toorn, net als ook de anderen; Maar God, Die rijk is in barmhartigheid door Zijn grote liefde, waarmee Hij ons liefgehad heeft, heeft ons, ook toen wij dood waren door de misdaden, levend gemaakt met Christus; (uit genade bent u zalig geworden),", "Jes 45:17": "Maar Israël wordt verlost door de HEERE, met een eeuwige verlossing; u zult niet beschaamd worden, ook niet tot schande worden, tot in alle eeuwigheden.", "1 Kor 15:25": "Want Hij moet als Koning heersen, totdat Hij alle vijanden onder Zijn voeten zal hebben gelegd.", "Ps 46:11": "Laat af, en weet, dat Ik God ben; Ik zal verhoogd worden onder de heidenen, Ik zal verhoogd worden op de aarde.", "1 Kor 10:4": "en zij hebben allen dezelfde geestelijke drank gedronken; want zij dronken uit de geestelijke steenrots die hen volgde; en die steenrots was Christus.", "Zach 2:10": "Juich en verblijd u, dochter van Sion; want zie, Ik kom, en Ik zal in het midden van u wonen, spreekt de HEERE.", "1 Petr 1:19": "maar met het kostbare bloed van Christus, als van een smetteloos en onbevlekt Lam;", "Ps 69:22": "Ja, zij hebben mij gal tot mijn spijs gegeven; en in mijn dorst hebben zij mij azijn te drinken gegeven.", "Joh 14:6": "Jezus zei tegen hem: Ik ben de Weg, en de Waarheid, en het Leven. Niemand komt tot de Vader dan door Mij.", "Jes 49:6-12": "Verder zei Hij: Het is te gering, dat U Mij een Knecht zou zijn, om op te richten de stammen van Jakob, en om terug te brengen de bewaarden in Israël; Ik heb U ook gegeven tot een Licht van de heidenen, om Mijn heil te zijn tot aan het einde van de aarde. Zo zegt de HEERE, de Verlosser van Israël, Zijn Heilige, tegen de veracht ziel, tegen Hem aan Wie het volk een gruwel heeft, tegen de Knecht van hen die heersen: Koningen zullen het zien en opstaan, ook vorsten, en zij zullen zich voor U buigen; om de wil van de HEERE, Die getrouw is, om de Heilige van Israël, Die U verkozen heeft. Zo zegt de HEERE: In de tijd van het welbehagen heb Ik U verhoord, en op de dag van het heil heb Ik U geholpen; en Ik zal U bewaren, en Ik zal U geven tot een verbond van het volk, om het aardrijk op te richten, om de verwoeste erfenissen te doen beërven;", "Jes 53:12": "Daarom zal Ik Hem een deel geven onder velen, en Hij zal de machtigen als buit verdelen, omdat Hij Zijn ziel uitgestort heeft in de dood, en onder de overtreders geteld is geweest, en Hij de zonden van velen gedragen heeft, en voor de overtreders gebeden heeft.", "Zach 8:1-23": "Daarna kwam het woord van de HEERE van de heerscharen tot mij, en Hij zei: Zo zegt de HEERE van de heerscharen: Ik heb geijverd over Sion met een grote ijver; ja, met grote grimmigheid heb Ik over haar geijverd. Zo zegt de HEERE: Ik ben teruggekeerd naar Sion, en Ik zal in het midden van Jeruzalem wonen; en Jeruzalem zal genoemd worden een stad van de waarheid, en de berg van de HEERE van de heerscharen, een berg van heiligheid.", "1 Joh 3:8": "Die de zonde doet, is uit de duivel; want de duivel zondigt vanaf het begin. Hiertoe is de Zoon van God geopenbaard, opdat Hij de werken van de duivel zou verbreken.", "Jes 8:14": "Dan zal Hij u tot een Heiligdom zijn; maar tot een steen des aanstoots en tot een rots der struikeling voor de twee huizen van Israël, tot een strik en tot een net voor de inwoners van Jeruzalem.", "Joh 6:31": "Onze vaders hebben het manna gegeten in de woestijn, zoals geschreven is: Hij gaf hun brood uit de hemel te eten.", "Gen 25:7": "Dit nu zijn de dagen van de jaren van het leven van Abraham, die hij geleefd heeft: honderdvijfenzeventig jaar.", "Joh 6:51": "Ik ben het levende Brood, dat uit de hemel neergedaald is; als iemand van dit Brood eet, zal hij eeuwig leven. En het Brood dat Ik geven zal, is Mijn vlees, dat Ik geven zal voor het leven van de wereld.", "Matt 17:10-13": "En Zijn discipelen vroegen Hem: Waarom zeggen de Schriftgeleerden dan dat Elia eerst moet komen? Jezus antwoordde en zei tegen hen: Elia zal inderdaad eerst komen en alles herstellen. Maar Ik zeg u dat Elia al gekomen is, en zij hebben hem niet erkend; maar zij hebben met hem gedaan wat zij wilden. Zo zal ook de Zoon des mensen door hen lijden.", "Deut 5:17": "U zult niet doodslaan.", "Deut 32:10": "Hij vond hem in een land van de woestijn, en in een woeste huilende wildernis; Hij voerde hem rondom, Hij onderwees hem, Hij bewaarde hem als Zijn oogappel.", "Rom 1:5-7": "(Door Wie wij genade en het apostelschap hebben ontvangen, tot gehoorzaamheid van het geloof onder alle heidenen, voor Zijn Naam; onder wie u ook bent, geroepenen van Jezus Christus!) Aan allen die in Rome zijn, geliefden van God, en geroepen heiligen: genade zij u, en vrede van God, onze Vader, en de Heere Jezus Christus.", "1 Petr 5:10": "En de God van alle genade, Die ons geroepen heeft tot Zijn eeuwige heerlijkheid in Christus Jezus, nadat u een tijdlang geleden zult hebben, Hij zal u volmaken, bevestigen, versterken en funderen.", "Ps 126:6": "Die het zaad draagt om te zaaien, gaat al gaande en wenende; maar hij zal zeker met gejuich terugkomen, terwijl hij zijn schoven draagt.", "Jes 49:1-26": "Hoort naar Mij, eilanden! En luistert toe, volken van verre! De HEERE heeft Mij geroepen van de buik af, van het ingewand van Mijn moeder af heeft Hij Mijn Naam vermeld. En Hij heeft Mijn mond gemaakt als een scherp zwaard, onder de schaduw van Zijn hand heeft Hij Mij bedekt; en Hij heeft Mij tot een gezuiverde pijl gesteld, in Zijn pijlkoker heeft Hij Mij verborgen. En Hij heeft tegen Mij gezegd: U bent Mijn Knecht, Israël, door Wie Ik verheerlijkt zal worden.", "Ps 107:34": "Het vruchtbare land tot zoute grond, om de boosheid van hen die daarin wonen.", "Joh 2:17": "En Zijn discipelen herinnerden zich dat er geschreven is: De ijver voor Uw huis heeft mij verslonden.", "Rom 9:27": "En Jesaja roept over Israël: Al zou het aantal kinderen van Israël zijn als het zand van de zee, toch zal het overblijfsel behouden worden.", "2 Tim 3:15": "en dat u van kindsbeen af de heilige Schriften kent, die u wijs kunnen maken tot zaligheid, door het geloof dat in Christus Jezus is.", "Rom 4:3": "Want wat zegt de Schrift? En Abraham geloofde God, en het is hem gerekend tot rechtvaardigheid.", "Jes 63:8": "Want Hij zei: Zij zijn zeker Mijn volk, kinderen die niet liegen zullen? Zo is Hij hun geworden tot een Heiland.", "Ps 16:8-11": "Ik stel de HEERE voortdurend voor mij, omdat Hij aan mijn rechterhand is, zal ik niet wankelen. Daarom is mijn hart blij, en mijn eer verheugt zich; ook zal mijn lichaam met zekerheid rusten. Want U zult mijn ziel in het graf niet verlaten; U zult niet toelaten dat Uw Heilige de ontbinding ziet.", "Matt 11:13": "Want al de profeten en de wet hebben tot Johannes toe geprofeteerd.", "Jak 2:21": "Is Abraham, onze vader, niet uit de werken gerechtvaardigd, toen hij Izak, zijn zoon, op het altaar geofferd heeft?", "Matt 19:18": "Hij zei tegen Hem: Welke? En Jezus zei: Deze: U zult niet doden; u zult geen overspel doen; u zult niet stelen; u zult geen valse getuigenis geven;", "Rom 9:7": "Ook zijn zij niet allen kinderen omdat zij nageslacht van Abraham zijn; maar: In Izaak zal uw nageslacht genoemd worden.", "Gen 14:21": "En de koning van Sodom zei tegen Abram: Geef mij de mensen; maar neem de bezittingen voor uzelf.", "Rom 11:3": "Heere! Zij hebben Uw profeten gedood, en Uw altaren omgeworpen; en ik ben alleen overgebleven en zij zoeken mijn leven.", "Jes 53:9": "En men heeft Zijn graf bij de goddelozen gesteld, en Hij is bij de rijke in Zijn dood geweest, omdat Hij geen onrecht gedaan heeft, en er geen bedrog in Zijn mond geweest is.", "1 Tess 5:9": "Want God heeft ons niet gesteld tot toorn, maar tot verkrijging van de zaligheid, door onze Heere Jezus Christus.", "Jer 52:6": "In de vierde maand, op de negende van de maand, toen de honger in de stad sterk werd, en het volk van het land geen brood had;", "Ex 20:13-17": "U zult niet doodslaan. U zult geen echtbreuk plegen. U zult niet stelen.", "1 Kron 5:21": "En zij voerden hun vee gevankelijk weg; van hun kamelen vijftigduizend, en tweehonderdvijftigduizend schapen, en tweeduizend ezels, en honderdduizend mensenzielen.", "1 Petr 3:21": "Waarvan het tegenbeeld, de doop, ons nu ook behoudt — niet als het afleggen van de vuiligheid van het lichaam, maar als de vraag van een goed geweten aan God — door de opstanding van Jezus Christus;", "Jes 8:13": "De HEERE van de heerscharen, Die zult u heiligen, en Hij zij uw vrees, en Hij zij uw verschrikking.", "Rom 15:11": "En opnieuw: Looft de Heere, alle heidenen, en prijst Hem, alle volken!", "2 Sam 23:7": "maar ieder die ze zal aantasten, voorziet zich met ijzer en het hout van een speer; en zij zullen helemaal met vuur verbrand worden, op dezelfde plaats.", "Jer 32:39": "En Ik zal hun één hart en één weg geven, om Mij te vrezen alle dagen, hun ten goede, alsook hun kinderen na hen.", "Jak 2:8": "Als u dan de koninklijke wet vervult, naar de Schrift: U zult uw naaste liefhebben als uzelf, dan doet u goed;", "Ef 1:3": "Gezegend zij de God en Vader van onze Heere Jezus Christus, Die ons gezegend heeft met alle geestelijke zegening in de hemel in Christus.", "Joh 12:40": "Hij heeft hun ogen verblind, en hun hart verhard; opdat zij met de ogen niet zien, en met het hart niet verstaan, en zij zich bekeren, en Ik hen genees.", "Hand 11:18": "En toen zij dit hoorden, waren zij tevreden, en verheerlijkten God, en zeiden: Zo heeft God dan ook aan de heidenen de bekering gegeven tot leven!", "Jes 53:10-12": "Maar het behaagde de HEERE Hem te verbrijzelen; Hij heeft Hem ziek gemaakt. Als Zijn ziel Zich tot een schuldoffer gesteld zal hebben, zal Hij nageslacht zien, Hij zal de dagen verlengen; en het welbehagen van de HEERE zal door Zijn hand voorspoedig voortgaan. Om de arbeid van Zijn ziel zal Hij het zien en verzadigd worden; door Zijn kennis zal Mijn Knecht, de Rechtvaardige, velen rechtvaardig maken, want Hij zal hun ongerechtigheden dragen. Daarom zal Ik Hem een deel geven onder velen, en Hij zal de machtigen als buit verdelen, omdat Hij Zijn ziel uitgestort heeft in de dood, en onder de overtreders geteld is geweest, en Hij de zonden van velen gedragen heeft, en voor de overtreders gebeden heeft.", "Gen 20:3": "Maar God kwam 's nachts in een droom tot Abimelech, en zei tegen hem: Zie, u bent dood vanwege de vrouw die u weggenomen hebt, want zij is met een man getrouwd.", "Openb 15:4": "Wie zou U niet vrezen, Heere, en Uw Naam niet verheerlijken? Want Gij alleen zijt heilig; want alle volken zullen komen, en voor U aanbidden; want Uw oordelen zijn openbaar geworden.", "Matt 21:9": "En de menigten die voor Hem uit gingen en die volgden, riepen: Hosanna, de Zoon van David! Gezegend is Hij Die komt in de Naam van de Heere! Hosanna in de hoogste hemelen!", "Gal 3:16": "Nu zijn de beloften gesproken tot Abraham en zijn nageslacht. Hij zegt niet: En aan de nageslachten, alsof het over velen ging; maar alsof het over één ging: En uw nageslacht; dat is Christus.", "Mark 12:36": "Want David zelf heeft door de Heilige Geest gezegd: De Heere heeft gezegd tegen mijn Heere: Zit aan Mijn rechterhand, totdat Ik Uw vijanden tot een voetbank van Uw voeten gemaakt heb.", "Joh 15:25": "Maar dit gebeurt, zodat het woord vervuld wordt dat in hun wet geschreven is: Zij hebben Mij zonder oorzaak gehaat.", "Joh 6:39": "En dit is de wil van de Vader, Die Mij gezonden heeft: dat Ik van alles wat Hij Mij gegeven heeft, niets verlies, maar het opwek op de laatste dag.", "1 Tess 5:8-10": "Maar wij, die van de dag zijn, laten wij nuchter zijn, terwijl wij aandoen het borstwapen van het geloof en de liefde, en tot een helm de hoop van de zaligheid. Want God heeft ons niet gesteld tot toorn, maar tot verkrijging van de zaligheid, door onze Heere Jezus Christus. Die voor ons gestorven is, opdat wij, hetzij dat wij waken, hetzij dat wij slapen, samen met Hem zouden leven.", "1 Petr 2:6": "Daarom staat er ook in de Schrift: Zie, Ik leg in Sion een uitverkoren, kostbare hoeksteen; en wie in Hem gelooft, zal niet beschaamd worden.", "1 Kon 1:47": "Ook zijn de knechten van de koning gekomen om onze heer, de koning David, te zegenen, en zeiden: Uw God make de naam van Salomo beter dan uw naam, en make zijn troon groter dan uw troon; en de koning heeft zich neergebogen op het bed.", "Gen 10:19": "En het gebied van de Kanaänieten was van Sidon, in de richting van Gerar tot aan Gaza toe; in de richting van Sodom en Gomorra, en Adama, en Zoboim, tot aan Lasa toe.", "Rom 9:9": "Want dit is het woord van de belofte: Rond deze tijd zal Ik komen, en Sara zal een zoon hebben.", "Mark 12:19": "Meester, Mozes heeft ons geschreven: Als iemands broer sterft, en een vrouw achterlaat, en geen kinderen nalaat, dat zijn broer diens vrouw moet nemen en voor zijn broer nageslacht moet verwekken.", "Joz 24:15": "Doch als het kwaad is in uw ogen om de HEERE te dienen, kies heden wie u dienen zult; hetzij de goden die uw vaders, die aan de andere kant van de rivier waren, gediend hebben, of de goden van de Amorieten, in wiens land u woont; maar wat mij en mijn huis aangaat, wij zullen de HEERE dienen!", "Ef 1:10": "Om in de bedeling van de volheid der tijden alles weer tot één te vergaderen in Christus, zowel wat in de hemel is, als wat op de aarde is;", "Hand 7:42": "En God keerde Zich af, en gaf hen over om het leger van de hemel te dienen, zoals geschreven staat in het boek van de profeten: Hebt u soms slachtoffers en offers aan Mij gebracht, veertig jaar lang in de woestijn, huis van Israël?", "Joz 20:7": "Toen wijdden zij Kedes in Galilea, op het gebergte van Naftali, en Sichem op het gebergte van Efraïm, en Kirjath-arba, dat is Hebron, op het gebergte van Juda.", "Hebr 13:6": "Zodat wij vrijmoedig durven zeggen: De Heere is mij een Helper, en ik zal niet vrezen wat een mens mij zal doen.", "Hebr 1:10-12": "En: U, Heere! hebt in het begin de aarde gegrond, en de hemelen zijn werken van Uw handen; Die zullen vergaan, maar U blijft altijd, en zij zullen allemaal verouderen als een kleed; En als een dekkleed zult U ze oprollen, en zij zullen veranderd worden; maar U bent Dezelfde, en Uw jaren zullen niet ophouden.", "Ex 5:23": "Want vanaf het moment dat ik bij Farao ben gekomen, om in Uw Naam te spreken, heeft hij dit volk kwaad gedaan; en U hebt Uw volk geenszins verlost.", "Ezech 34:23": "En Ik zal één Herder over hen doen opstaan, en Hij zal hen weiden, namelijk Mijn knecht David; die zal ze weiden, en Die zal hun tot een Herder zijn.", "Joh 17:2": "Zoals U Hem macht gegeven hebt over alle vlees, opdat Hij aan allen die U Hem gegeven hebt, het eeuwige leven geeft.", "Rom 10:8-13": "Maar wat zegt zij? Dicht bij u is het Woord, in uw mond en in uw hart. Dit is het Woord van het geloof, dat wij prediken; namelijk: als u met uw mond de Heere Jezus belijdt, en met uw hart gelooft dat God Hem uit de doden heeft opgewekt, zult u zalig worden. Want met het hart gelooft men tot rechtvaardigheid, en met de mond belijdt men tot zaligheid.", "Matt 1:1": "Het geslachtsregister van JEZUS CHRISTUS, de Zoon van David, de zoon van Abraham.", "Joh 5:40": "En u wilt niet tot Mij komen, opdat u het leven zou hebben.", "Gen 40:2": "Zodat Farao zeer toornig werd op zijn twee hovelingen, op de leider van de schenkers, en op de leider van de bakkers.", "Matt 11:14": "En als u het wilt aannemen, hij is Elia, die komen zou.", "2 Kon 13:18": "Daarna zei hij: Neem de pijlen. En hij nam ze. Toen zei hij tegen de koning van Israël: Sla tegen de aarde. En hij sloeg driemaal; daarna stond hij stil.", "Luk 5:32": "Ik ben niet gekomen om rechtvaardigen te roepen, maar zondaars, tot bekering.", "Gen 13:18": "En Abram sloeg zijn tenten op, en kwam en woonde bij de eikenbossen van Mamre, die bij Hebron zijn; en hij bouwde daar de HEERE een altaar.", "Matt 11:10": "Want deze is het, van wie geschreven staat: Zie, Ik zend Mijn engel voor Uw aangezicht, die Uw weg bereiden zal voor U heen.", "Hand 23:5": "En Paulus zei: Ik wist niet, broeders, dat hij de hogepriester was; want er is geschreven: De leider van uw volk zult u niet vervloeken.", "Deut 32:18": "De Rotssteen, Die u verwekt heeft, bent u vergeten; en u hebt de God, Die u gebaard heeft, in vergetelheid gesteld.", "Deut 30:12-14": "Het is niet in de hemel, om te zeggen: Wie zal voor ons naar de hemel gaan, dat hij het voor ons haalt, en het ons laat horen, dat wij het doen? Het is ook niet aan de andere kant van de zee, om te zeggen: Wie zal voor ons oversteken naar de andere kant van de zee, dat hij het voor ons haalt, en het ons laat horen, dat wij het doen? Want dit woord is heel dichtbij u, in uw mond, en in uw hart, om dat te doen.", "Ex 32:6": "En zij stonden de volgende dag vroeg op, en offerden brandoffers en brachten dankoffers; en het volk zat neer om te eten en te drinken, daarna stonden zij op om te spelen.", "Gen 30:27": "Toen zei Laban tegen hem: Als ik toch genade gevonden heb in uw ogen; ik heb ondervonden dat de HEERE mij om u gezegend heeft.", "Rom 11:1-36": "Ik zeg dan: Heeft God Zijn volk verstoten? Dat zij verre. Want ik ben ook een Israëliet, uit het zaad van Abraham, van de stam Benjamin. God heeft Zijn volk niet verstoten, dat Hij van tevoren gekend heeft. Of weet u niet wat de Schrift zegt van Elia, hoe hij God aanspreekt tegen Israël, en zegt: Heere! Zij hebben Uw profeten gedood, en Uw altaren omgeworpen; en ik ben alleen overgebleven en zij zoeken mijn leven.", "Hand 10:33": "Zo heb ik dan meteen naar u gezonden, en u hebt er goed aan gedaan hier te komen. Wij zijn dan nu allen hier aanwezig voor God, om te horen alles wat u door God bevolen is.", "1 Petr 1:9": "en zo het einddoel van uw geloof bereikt, namelijk de zaligheid van de zielen.", "Hand 4:26": "De koningen van de aarde zijn samen opgestaan, en de leiders zijn bijeengebracht tegen de Heere, en tegen Zijn Gezalfde.", "Mark 15:28": "En de Schrift is vervuld die zegt: En Hij is met de misdadigers gerekend.", "Jes 51:4": "Luister naar Mij, Mijn volk! En Mijn lieden, neig naar Mij het oor! Want een wet zal van Mij uitgaan, en Ik zal Mijn recht doen rusten tot een licht van de volken.", "Gal 2:16": "maar omdat wij weten dat de mens niet gerechtvaardigd wordt uit de werken van de wet, maar door het geloof van Jezus Christus, hebben ook wij in Christus Jezus geloofd, opdat wij gerechtvaardigd zouden worden uit het geloof van Christus, en niet uit de werken van de wet; omdat uit de werken van de wet geen vlees zal worden gerechtvaardigd.", "Dan 7:18": "Maar de heiligen van de hoge plaatsen zullen dat Koninkrijk ontvangen, en zij zullen het Rijk bezitten tot in eeuwigheid, ja, tot in eeuwigheid der eeuwigheden.", "Joh 6:68": "Simon Petrus antwoordde Hem: Heere, naar wie zouden wij heengaan? U hebt de woorden van het eeuwige leven.", "Jes 55:1-13": "O, alle dorstigen, kom tot de wateren, en u die geen geld heeft, kom, koop en eet, ja kom, koop zonder geld en zonder prijs, wijn en melk! Waarom weegt u geld uit voor wat geen brood is, en uw arbeid voor wat niet verzadigen kan? Hoor aandachtig naar Mij, en eet het goede, en laat uw ziel zich verlustigen in vettigheid. Neig uw oor, en kom tot Mij, hoor en uw ziel zal leven; want Ik zal met u een eeuwig verbond maken, en u geven de zekere weldaden van David.", "Joh 4:42": "en zij zeiden tegen de vrouw: Wij geloven niet meer om wat u zei; want wij hebben Hem zelf gehoord, en weten dat Deze werkelijk de Christus is, de Zaligmaker van de wereld.", "Openb 19:11-21": "En ik zag de hemel geopend; en zie, een wit paard, en Die daarop zat, werd genoemd Getrouw en Waarachtig, en Hij oordeelt en voert krijg in gerechtigheid. En Zijn ogen waren als een vlam van het vuur, en op Zijn hoofd waren veel koninklijke hoeden; en Hij had een naam geschreven, die niemand wist, dan Hij Zelf. En Hij was bekleed met een kleed, dat met bloed geverfd was; en Zijn naam wordt genoemd het Woord van God.", "Jes 60:3-5": "En de heidenen zullen naar uw licht gaan, en koningen naar de glans die over u is opgegaan. Hef uw ogen rondom op, en zie: die allen zijn samengebracht, zij komen tot u; uw zonen zullen van verre komen, en uw dochters zullen aan uw zijde grootgebracht worden. Dan zult u het zien en stralen, en uw hart zal vervaard zijn en verwijd worden; want de menigte van de zee zal tot u gekeerd worden, het leger van de heidenen zal tot u komen.", "Openb 3:20": "Zie, Ik sta aan de deur, en Ik klop; als iemand Mijn stem hoort, en de deur opendoet, zal Ik bij hem binnenkomen, en Ik zal met hem avondmaal houden, en hij met Mij.", "2 Kor 7:10": "Want de droefheid naar God werkt een onberouwelijke bekering tot zaligheid; maar de droefheid van de wereld werkt de dood.", "Hebr 12:5": "En u bent de vermaning vergeten, die tot u spreekt als tot zonen: Mijn z
