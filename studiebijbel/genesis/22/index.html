n; en u zult over veel volken heersen, maar over u zullen zij niet heersen.", "Luk 12:22-31": "En Hij zei tegen Zijn discipelen: Daarom zeg Ik u: wees niet bezorgd voor uw leven, wat u eten zult, en ook niet voor het lichaam, waarmee u zich kleden zult. Het leven is meer dan het voedsel, en het lichaam meer dan de kleding. Kijk naar de raven: zij zaaien niet en maaien niet, zij hebben geen voorraadkamer of schuur, en God voedt ze; hoeveel meer bent u dan de vogels waard?", "Openb 22:12": "En zie, Ik kom haastig, en Mijn loon is met Mij, om ieder te vergelden zoals zijn werk zal zijn.", "Num 24:17-19": "Ik zal hem zien, maar nu niet; ik zal hem aanschouwen, maar niet van dichtbij. Er zal een ster voortkomen uit Jakob, en er zal een scepter uit Israël opkomen; die zal de gebieden van de Moabieten verslaan, en al de kinderen van Seth verstoren. En Edom zal een erfelijk bezit zijn; en Seir zal voor zijn vijanden een erfelijk bezit zijn; doch Israël zal met kracht handelen. En er zal iemand uit Jakob heersen, en hij zal de overigen uit de steden ombrengen.", "Lev 26:4-10": "Dan zal Ik uw regens geven op hun tijd; en het land zal zijn opbrengst geven, en het geboomte van het veld zal zijn vrucht geven; En de dorstijd zal u reiken tot de wijnoogst, en de wijnoogst zal reiken tot de zaaitijd; en u zult uw brood eten tot verzadiging toe, en u zult zeker in uw land wonen. Ook zal Ik vrede geven in het land, zodat u zult gaan slapen, en niemand is er die u verschrikt; en Ik zal het boze gedierte uit het land doen ophouden, en het zwaard zal door uw land niet doorgaan.", "2 Tim 2:10-12": "Daarom verdraag ik alles om de uitverkorenen, opdat ook zij de zaligheid zouden verkrijgen die in Christus Jezus is, met eeuwige heerlijkheid. Dit is een betrouwbaar woord: want als wij met Hem gestorven zijn, zullen wij ook met Hem leven; als wij volharden, zullen wij ook met Hem heersen; als wij Hem verloochenen, zal Hij ons ook verloochenen;", "Ps 44:4": "Want zij hebben het land niet geërfd door hun zwaard, en hun arm heeft hun geen heil gegeven; maar Uw rechterhand, en Uw arm, en het licht van Uw aangezicht, omdat U een welbehagen in hen had.", "Ps 22:28-32": "Alle einden van de aarde zullen het gedenken, en zich tot de HEERE bekeren; en alle geslachten van de heidenen zullen voor Uw aangezicht aanbidden. Want het koninkrijk is van de HEERE, en Hij heerst onder de heidenen. Alle vetten op aarde zullen eten, en aanbidden; allen die in het stof neerdalen, zullen voor Zijn aangezicht neerbukken; en die zijn ziel bij het leven niet kan houden.", "Ex 20:11": "want in zes dagen heeft de HEERE de hemel en de aarde gemaakt, de zee en alles wat daarin is, en Hij rustte op de zevende dag; daarom zegende de HEERE de sabbatdag en heiligde hem.", "Gen 21:14": "Toen stond Abraham 's morgens vroeg op, en nam brood en een fles water, en gaf ze aan Hagar, die hij op haar schouder legde; ook gaf hij haar het kind, en stuurde haar weg. En zij ging op weg, en dwaalde rond in de woestijn Berseba.", "Deut 33:27": "De eeuwige God zij u een woning, en van onder eeuwige armen; en Hij verdrijft de vijand voor uw aangezicht, en zegt: Verdelg!", "Matt 10:38": "En wie zijn kruis niet op zich neemt, en Mij navolgt, is Mij niet waard.", "Luk 5:27": "En hierna ging Hij naar buiten en zag een tollenaar, genaamd Levi, in het tolhuis zitten, en Hij zei tegen hem: Volg Mij.", "1 Kor 3:21-23": "Niemand roemt dan op mensen; want alles is van u. Hetzij Paulus, hetzij Apollos, hetzij Cefas, hetzij de wereld, hetzij leven, hetzij dood, hetzij tegenwoordige, hetzij toekomende dingen, ze zijn allemaal van u. Doch u bent van Christus, en Christus is van God.", "Ps 89:21": "Ik heb David, Mijn knecht, gevonden; met Mijn heilige olie heb Ik hem gezalfd;", "Matt 9:13": "Ga heen en leer wat dit betekent: Ik wil barmhartigheid, en geen offerande; want Ik ben niet gekomen om rechtvaardigen te roepen, maar zondaars, tot bekering.", "Hebr 6:13": "Want toen God aan Abraham de belofte deed, zwoer Hij bij Zichzelf, omdat Hij bij niemand groter kon zweren,", "Gen 1:27": "En God schiep de mens naar Zijn beeld; naar het beeld van God schiep Hij hem; man en vrouw schiep Hij hen.", "Matt 12:18-21": "Zie, Mijn Knecht, Die Ik uitgekozen heb; Mijn Beminde, in Wie Mijn ziel een welbehagen heeft; Ik zal Mijn Geest op Hem leggen, en Hij zal het oordeel aan de heidenen verkondigen. Hij zal niet twisten, en niet roepen, en niemand zal Zijn stem op de straten horen. Het geknakte riet zal Hij niet breken, en de walmende vlaspit zal Hij niet uitblussen, totdat Hij het oordeel tot overwinning zal uitbrengen.", "Matt 1:16-18": "en Jakob verwekte Jozef, de man van Maria, uit wie geboren is JEZUS, Die Christus genoemd wordt. Al de geslachten dus, van Abraham tot David, zijn veertien geslachten; en van David tot de Babylonische wegvoering veertien geslachten; en van de Babylonische wegvoering tot Christus veertien geslachten. De geboorte van Jezus Christus was nu als volgt. Toen Maria, Zijn moeder, met Jozef in ondertrouw was, bleek zij, voordat zij samengekomen waren, zwanger te zijn uit de Heilige Geest.", "Dan 2:45": "Daarom hebt u gezien dat uit de berg een steen zonder handen werd afgehouwen, die het ijzer, koper, leem, zilver en goud verbrijzelde; de grote God heeft de koning bekendgemaakt wat hierna gebeuren zal; de droom is dus waar, en de uitleg ervan betrouwbaar.", "Ps 40:6": "Gij, o HEERE, mijn God! hebt Uw wonderen en Uw gedachten aan ons vele gemaakt, men kan ze niet in orde bij U verhalen; zal ik ze verkondigen en uitspreken, dan zijn ze menigvuldiger dan dat ik ze zou kunnen vertellen.", "1 Kon 9:26": "De koning Salomo maakte ook schepen te Ezeon-geber, dat bij Eloth is, aan de oever van de Schelfzee, in het land van Edom.", "Rom 8:15": "Want u hebt niet de geest van slavernij ontvangen, om opnieuw te vrezen, maar u hebt de Geest van aanneming tot kinderen ontvangen, door Wie wij roepen: Abba, Vader!", "Gen 22:3-13": "Toen stond Abraham 's morgens vroeg op, en zadelde zijn ezel, en nam twee van zijn knechten met zich, en Izak zijn zoon; en hij kloofde hout voor het brandoffer, en maakte zich op, en ging naar de plaats die God hem gezegd had. Op de derde dag hief Abraham zijn ogen op, en zag die plaats van verre. En Abraham zei tegen zijn knechten: Blijf u hier met de ezel, en ik en de jongen zullen daarheen gaan; als wij aanbeden hebben, zullen wij tot u terugkeren.", "Ps 46:5": "De beekjes van de rivier zullen verblijden de stad van God, het heiligdom van de woningen van de Allerhoogste.", "Rom 4:16-18": "Daarom is zij uit het geloof, opdat zij naar genade is; opdat de belofte vaststaat voor heel het nageslacht, niet alleen voor wie uit de wet is, maar ook voor wie uit het geloof van Abraham is, die een vader is van ons allen; (Zoals geschreven staat: Ik heb u tot een vader van veel volken gesteld) voor Hem, aan Wie hij geloofd heeft, namelijk God, Die de doden levend maakt, en de dingen die niet zijn roept alsof zij waren; Hij heeft tegen hoop op hoop geloofd, dat hij een vader van veel volken zou worden, volgens wat gezegd was: Zo zal uw nageslacht zijn.", "Ps 135:6-12": "Al wat de HEERE behaagt, doet Hij, in de hemelen en op de aarde, in de zeeën en alle afgronden. Hij doet dampen opklimmen van het einde van de aarde; Hij maakt de bliksemen met de regen; Hij brengt de wind uit Zijn schatkamers voort. Die de eerstgeborenen van Egypte sloeg, van de mens af tot het vee toe.", "Jes 54:13": "En al uw kinderen zullen door de HEERE geleerd zijn, en de vrede van uw kinderen zal groot zijn.", "Tit 2:11-14": "Want de genade van God die zaligmakend is, is verschenen aan alle mensen. En onderwijst ons dat wij, doordat we de goddeloosheid en de wereldse begeerten verzaken, matig en rechtvaardig en godvruchtig zouden leven in deze tegenwoordige wereld; Verwachtend de zalige hoop en verschijning van de heerlijkheid van de grote God en onze Zaligmaker Jezus Christus;", "Hebr 9:28": "zo is ook Christus, eenmaal geofferd, om de zonden van velen weg te nemen, en zal ten tweeden male zonder zonde gezien worden door hen die Hem verwachten tot zaligheid.", "Hand 7:43": "Ja, u hebt de tent van Moloch opgenomen, en de ster van uw god Remfan, de beelden die u gemaakt hebt om die te aanbidden; en Ik zal u wegvoeren tot voorbij Babylon.", "Luk 4:12": "En Jezus antwoordde en zei tegen hem: Er is gezegd: U zult de Heere, uw God, niet verzoeken.", "Hebr 9:12": "ook niet door het bloed van bokken en kalveren, maar door Zijn eigen bloed, eenmaal ingegaan in het heiligdom, en heeft een eeuwige verlossing verworven.", "Ps 35:1-3": "Een psalm van David. Twist, HEERE, met wie tegen mij twisten; strijd tegen wie tegen mij strijden. Grijp het schild en de rondas, en sta op tot mijn hulp. En breng de spies naar voren, en sluit de weg toe voor mijn vervolgers; zeg tegen mijn ziel: Ik ben uw Heil.", "Ex 15:23-25": "Toen kwamen zij bij Mara; maar zij konden het water van Mara niet drinken, want het was bitter; daarom werd het Mara genoemd. Toen morde het volk tegen Mozes, en zei: Wat zullen wij drinken? Hij dan riep tot de HEERE; en de HEERE wees hem een stuk hout, dat wierp hij in het water; toen werd het water zoet. Daar stelde Hij het volk een inzetting en recht, en daar beproefde Hij hen,", "Zach 2:11": "En veel heidenen zullen op die dag aan de HEERE toegevoegd worden, en zij zullen Mij tot een volk wezen; en Ik zal in het midden van u wonen; en u zult weten, dat de HEERE van de heerscharen mij tot u gezonden heeft.", "Jes 45:23": "Ik heb bij Mijzelf gezworen, er is een woord van gerechtigheid uit Mijn mond gegaan, en het zal niet terugkeren: dat voor Mij alle knie zich zal buigen, alle tong Mij zal zweren.", "Rom 13:11": "En dit zeg ik te meer, omdat wij de tijd waarin we leven kennen, dat het de tijd is dat wij nu uit de slaap ontwaken; want de zaligheid is ons nu dichterbij dan toen wij tot geloof kwamen.", "Jes 44:2": "Zo zegt de HEERE, uw Maker en uw Formeerder van de buik af aan, Die u helpt: Wees niet bang, o Jakob, Mijn knecht, en u, Jeschurun, die Ik uitgekozen heb!", "Matt 21:1-46": "En toen zij Jeruzalem naderden en aangekomen waren te Bethfagé, aan de Olijfberg, toen stuurde Jezus twee discipelen erop uit en zei tegen hen: Ga naar het dorp dat tegenover u ligt, en u zult meteen een ezelin vinden, vastgebonden, en een veulen bij haar. Maak ze los en breng ze bij Mij. En als iemand u iets zegt, dan moet u zeggen: De Heere heeft ze nodig; en hij zal ze meteen sturen.", "Matt 16:25": "Want wie zijn leven zal willen behouden, die zal het verliezen; maar wie zijn leven zal verliezen om Mijnentwil, die zal het vinden.", "Luk 21:2-4": "En Hij zag ook een zekere arme weduwe twee kleine penningen daarin werpen. En Hij zei: Waarlijk, Ik zeg u, dat deze arme weduwe meer dan allen heeft ingeworpen. Want die allen hebben van hun overvloed geworpen tot de gaven van God; maar deze heeft van haar gebrek, alle middelen van bestaan die zij had, daarin geworpen.", "Luk 8:10": "En Hij zei: Aan u is het gegeven de verborgenheden van het Koninkrijk van God te verstaan; maar tot de anderen spreek Ik in gelijkenissen, opdat zij ziende niet zien, en horende niet verstaan.", "Joh 7:42": "Zegt de Schrift niet dat de Christus zal komen uit het nageslacht van David, en uit het dorp Bethlehem, waar David was?", "Jer 31:15": "Zo zegt de HEERE: Er is een stem gehoord in Rama, een geklaag, een zeer bitter geween; Rachel weent over haar kinderen; zij weigert zich te laten troosten over haar kinderen, omdat zij er niet meer zijn.", "Num 19:12": "Op de derde dag zal hij zich daarmee ontzondigen, dan zal hij op de zevende dag rein zijn; maar als hij zich op de derde dag niet ontzondigt, dan zal hij op de zevende dag niet rein zijn.", "Rom 9:12": "werd tot haar gezegd: De oudste zal de jongste dienen.", "Ps 33:12": "Gelukkig is het volk wiens God de HEERE is; het volk, dat Hij Zich als erfdeel heeft uitgekozen.", "Richt 6:24": "Toen bouwde Gideon daar voor de HEERE een altaar, en noemde het: De Heere is vrede! Het staat nog tot op deze dag in Ofra van de Abiëzrieten.", "Gen 12:8": "En hij brak vandaar op naar het gebergte, ten oosten van Beth-el, en hij sloeg zijn tent op, met Beth-el naar het westen, en Ai naar het oosten; en hij bouwde daar een altaar voor de HEERE, en riep de Naam van de HEERE aan.", "Ps 10:7": "Zijn mond is vol vloek, bedrog en list; onder zijn tong is moeite en onrecht.", "Richt 6:12": "Toen verscheen de Engel van de HEERE aan hem, en zei tegen hem: De HEERE is met u, dappere held!", "Num 22:21": "Toen stond Bileam 's morgens op, en zadelde zijn ezelin, en hij trok heen met de vorsten van Moab.", "Spr 18:4": "De woorden uit de mond van een man zijn diepe wateren; en de bron van wijsheid is een stromende beek.", "2 Kor 9:8-10": "En God is machtig alle genade in u overvloedig te maken; opdat u in alles, te allen tijde, met alle genoegzaamheid, overvloedig kunt zijn tot alle goed werk. Zoals er geschreven is: Hij heeft uitgestrooid, hij heeft aan de armen gegeven; Zijn gerechtigheid blijft in eeuwigheid. Doch Die het zaad aan de zaaier verleent, Die verleent ook brood tot voedsel, en vermenigvuldigt uw gezaaisel, en vermeerdert de vruchten van uw gerechtigheid;", "Job 8:7": "Uw begin zal wel gering zijn geweest, maar uw einde zal zeer toenemen.", "1 Sam 12:10": "En zij riepen tot de HEERE, en zeiden: Wij hebben gezondigd, omdat wij de HEERE verlaten hebben, en de Baäls en Astharoths gediend hebben; en nu, red ons uit de hand van onze vijanden, en wij zullen U dienen.", "Gen 21:10": "En zij zei tegen Abraham: Jaag deze slavin en haar zoon weg; want de zoon van deze slavin zal niet erven met mijn zoon, met Izak.", "Hebr 2:12": "En Hij zegt: Ik zal Uw naam aan Mijn broeders verkondigen; in het midden van de Gemeente zal Ik U lofzingen.", "1 Sam 2:30": "Daarom spreekt de HEERE, de God van Israël: Ik had wel duidelijk gezegd: Uw huis en het huis van uw vader zouden voor Mijn aangezicht wandelen tot in eeuwigheid; maar nu spreekt de HEERE: Dat zij verre van Mij; want die Mij eren, zal Ik eren, maar die Mij versmaden, zullen licht geacht worden.", "Rom 6:6": "Terwijl wij dit weten, dat onze oude mens met Hem gekruisigd is, opdat het lichaam van de zonde tenietgedaan wordt, opdat wij niet meer de zonde dienen.", "Jer 3:14-19": "Bekeer u, afkerige kinderen! spreekt de HEERE, want Ik heb u getrouwd, en Ik zal u aannemen, één uit een stad, en twee uit een geslacht, en Ik zal u naar Sion brengen. En Ik zal u herders geven naar Mijn hart; die zullen u weiden met kennis en verstand. En het zal gebeuren, wanneer u meer geworden en vruchtbaar geworden bent in het land, in die dagen, spreekt de HEERE, dat zij niet meer zullen zeggen: De ark van het verbond van de HEERE, en zij zal ook niet in het hart opkomen; en zij zullen er niet aan denken, en haar niet bezoeken, en zij zal niet opnieuw gemaakt worden.", "Rom 13:14": "Maar doe de Heere Jezus Christus aan, en verzorg het vlees niet met het oog op begeerten.", "Pred 5:18": "Ook: ieder mens aan wie God rijkdom en bezittingen gegeven heeft, en aan wie Hij de macht geeft om daarvan te eten, en om zijn deel te nemen, en om zich te verheugen in zijn arbeid, dat is een gave van God.", "Luk 12:24-28": "Kijk naar de raven: zij zaaien niet en maaien niet, zij hebben geen voorraadkamer of schuur, en God voedt ze; hoeveel meer bent u dan de vogels waard? Wie van u kan door bezorgd te zijn één el aan zijn lengte toevoegen? Als u dan zelfs het kleinste niet kunt, waarom bent u dan bezorgd over de andere dingen?", "Jes 53:4-6": "Waarlijk, Hij heeft onze ziekten op Zich genomen, en onze smarten heeft Hij gedragen; maar wij hielden Hem voor een geplaagde, door God geslagen en verdrukt. Maar Hij is om onze overtredingen verwond, om onze ongerechtigheden is Hij verbrijzeld; de straf die ons de vrede aanbrengt, was op Hem, en door Zijn striemen is er voor ons genezing gekomen. Wij dwaalden allen als schapen, wij keerden ons ieder naar zijn eigen weg; maar de HEERE heeft de ongerechtigheid van ons allen op Hem doen neerkomen.", "Rom 4:7": "En zei: Gelukkig zijn zij wier ongerechtigheden vergeven zijn, en wier zonden bedekt zijn;", "Lev 19:2": "Spreek tot de hele vergadering van de kinderen van Israël, en zeg tegen hen: U zult heilig zijn, want Ik, de HEERE, uw God, ben heilig!", "Luk 13:32": "En Hij zei tegen hen: Ga en zeg tegen die vos: Zie, Ik drijf duivelen uit en maak gezond, vandaag en morgen, en op de derde dag kom Ik tot mijn einde.", "2 Kon 19:35": "Het gebeurde toen in diezelfde nacht, dat de Engel van de HEERE uittrok en in het leger van Assyrië honderdvijfentachtigduizend man sloeg. En toen zij zich 's morgens vroeg opmaakten, zie, dat waren allemaal dode lichamen.", "Jes 49:5": "En nu zegt de HEERE, Die Mij van moeders buik af tot een Knecht gevormd heeft, dat Ik Jakob tot Hem terugbrengen zou; maar Israël zal zich niet laten verzamelen; toch zal Ik verheerlijkt worden in de ogen van de HEERE, en Mijn God zal Mijn Sterkte zijn.", "Rom 15:12": "En opnieuw zegt Jesaja: Er zal de wortel van Isaï zijn, en Die opstaat om over de heidenen te heersen; op Hem zullen de heidenen hopen.", "1 Kon 19:18": "Ook heb Ik in Israël zevenduizend laten overblijven, alle knieën die zich niet voor Baäl gebogen hebben, en alle monden die hem niet gekust hebben.", "Jes 64:4": "Ja, van oudsher heeft men het niet gehoord, ook niet met de oren opgemerkt, en geen oog heeft het gezien, behalve U, o God! wat Hij doen zal aan hem, die op Hem wacht.", "1 Kor 14:21": "In de wet is geschreven: Ik zal door lieden van andere talen, en door andere lippen tot dit volk spreken, en toch zullen zij Mij ook zo niet horen, zegt de Heere.", "Ps 37:9": "Want de boosdoeners zullen uitgeroeid worden, maar wie de HEERE verwachten, die zullen de aarde erfelijk bezitten.", "Ex 13:2": "Heilig voor Mij alle eerstgeborenen; wat er ook onder de kinderen van Israël de baarmoeder opent, van mensen en van dieren, dat is Mijn eigendom.", "Rom 3:4": "Dat zij verre. Maar God is waarachtig, en ieder mens leugenachtig; zoals geschreven is: Opdat U gerechtvaardigd wordt in Uw woorden, en overwint, wanneer U oordeelt.", "Klaagl 3:52": "Tsade. Zij die mijn vijanden zijn zonder oorzaak, hebben mij als een vogeltje dapper gejaagd.", "Deut 8:18": "Maar u zult denken aan de HEERE, uw God, dat Hij het is die u kracht geeft om vermogen te verwerven; opdat Hij Zijn verbond bevestigt, dat Hij aan uw vaderen gezworen heeft, zoals het op deze dag is.", "Jer 22:5": "Als u daarentegen deze woorden niet zult horen, dan heb Ik bij Mijzelf gezworen, spreekt de HEERE, dat dit huis tot een woestenij worden zal.", "1 Kron 17:8": "En Ik ben met u geweest overal waar u heen bent gegaan, en Ik heb al uw vijanden voor u uitgeroeid; en Ik heb u een naam gemaakt, gelijk de naam van de groten die op de aarde zijn.", "Jes 40:4-11": "Alle dalen zullen verhoogd worden, en alle bergen en heuvels zullen vernederd worden; en wat krom is, dat zal recht, en wat hobbelig is, dat zal tot een vallei gemaakt worden. En de heerlijkheid van de HEERE zal geopenbaard worden; en alle vlees tegelijk zal zien, dat de mond van de HEERE het gesproken heeft. Een stem zegt: Roept! En hij zegt: Wat zal ik roepen? Alle vlees is gras, en al zijn goedertierenheid als een bloem van het veld.", "Zach 8:16": "Dit zijn de dingen die u doen zult: spreek de waarheid, ieder met zijn naaste; oordeel de waarheid en een oordeel van vrede in uw poorten.", "1 Kor 15:45": "Zo staat er ook geschreven: De eerste mens Adam is geworden tot een levende ziel; de laatste Adam tot een levendmakende Geest.", "Openb 22:14": "Zalig zijn zij die Zijn geboden doen, zodat hun macht toekomt aan de boom des levens, en zij door de poorten de stad mogen binnengaan.", "1 Sam 12:9": "Maar zij vergaten de HEERE, hun God; zo verkocht Hij hen in de hand van Sisera, de legeraanvoerder van Hazor, en in de hand van de Filistijnen, en in de hand van de koning van de Moabieten, die tegen hen streden.", "Ps 87:5": "En van Sion zal gezegd worden: Die en die is daarin geboren; en de Allerhoogste Zelf zal hen bevestigen.", "1 Petr 2:9": "Maar u bent een uitverkoren geslacht, een koninklijk priesterschap, een heilig volk, een volk dat God Zich verworven heeft; opdat u de deugden zou verkondigen van Hem Die u uit de duisternis geroepen heeft tot Zijn wonderbaar licht;", "Gen 15:13": "Toen zei Hij tegen Abram: Weet voorzeker dat uw nageslacht vreemdeling zal zijn in een land dat niet van hen is, en zij zullen hen dienen, en zij zullen hen verdrukken, vierhonderd jaar.", "Gen 49:10": "De scepter zal van Juda niet wijken, evenmin de wetgever van tussen zijn voeten, totdat Silo komt, en Hem zullen de volken gehoorzaam zijn.", "Matt 10:37": "Wie vader of moeder liefheeft boven Mij, is Mij niet waard; en wie zoon of dochter liefheeft boven Mij, is Mij niet waard.", "Luk 2:24": "En om een offer te geven, naar wat in de wet van de Heere gezegd is, een paar tortelduiven of twee jonge duiven.", "Ps 44:2-4": "O God! Wij hebben het met onze oren gehoord, onze vaders hebben het ons verteld: Wat een werk hebt U gedaan in hun dagen, in de dagen van vroeger. U hebt de heidenvolken met Uw hand uit de bezitting verdreven, maar hen geplant; U hebt de volken geplaagd, hen daarentegen doen voortschieten. Want zij hebben het land niet geërfd door hun zwaard, en hun arm heeft hun geen heil gegeven; maar Uw rechterhand, en Uw arm, en het licht van Uw aangezicht, omdat U een welbehagen in hen had.", "Jes 59:21": "Wat Mij aangaat, dit is Mijn Verbond met hen, zegt de HEERE: Mijn Geest, Die op u is, en Mijn woorden, die Ik in uw mond gelegd heb, die zullen van uw mond niet wijken, ook niet van de mond van uw zaad, ook niet van de mond van het zaad van uw zaad, zegt de HEERE, van nu af tot in eeuwigheid toe.", "Rom 3:15-17": "hun voeten zijn snel om bloed te vergieten; vernieling en ellende is op hun wegen; en de weg van de vrede hebben zij niet gekend.", "Amos 4:7": "Daarbij heb Ik ook de regen van u geweerd, toen er nog drie maanden waren tot de oogst, en heb doen regenen over de ene stad, maar over de andere stad niet doen regenen; het ene stuk land werd beregend, maar het andere stuk land, waar het niet op regende, verdorde.", "Jes 52:5": "En nu, wat heb Ik hier te doen? spreekt de HEERE, omdat Mijn volk voor niets is weggenomen, en degenen die over hen heersen, hen laten huilen, spreekt de HEERE, en Mijn Naam voortdurend de hele dag gelasterd wordt;", "Jes 54:1-17": "Zing vrolijk, u onvruchtbare, die niet gebaard hebt! Maak geschal met vrolijk gezang, en juich, die geen barensnood gehad hebt! Want de kinderen van de eenzame zijn meer dan de kinderen van de getrouwde, zegt de HEERE. Maak de plaats van uw tenten wijd, en laat men de gordijnen van uw woningen uitbreiden, verhinder het niet; maak uw koorden lang, en steek uw pinnen vast in. Want u zult uitbreken ter rechter hand en ter linkerhand; en uw nageslacht zal de heidenen erven, en zij zullen de verwoeste steden doen bewonen.", "Matt 10:28-32": "En weest niet bang voor hen die het lichaam doden, en de ziel niet kunnen doden; maar vreest veel meer Hem, Die zowel ziel als lichaam kan verderven in de hel. Worden niet twee musjes voor een penninkje verkocht? En niet één daarvan zal op de aarde vallen zonder uw Vader. En ook uw haren van het hoofd zijn alle geteld.", "Hebr 13:13": "Laten wij dan naar Hem uitgaan, buiten de legerplaats, terwijl wij Zijn smaad dragen.", "Ps 33:6": "Door het Woord van de HEERE zijn de hemelen gemaakt, en door de Geest van Zijn mond heel hun leger.", "2 Kor 1:8-10": "Want wij willen niet, broeders, dat u onwetend bent van onze verdrukking, die ons in Azië overkomen is: dat wij uitzonderlijk zwaar belast zijn geweest, boven ons vermogen, zodat wij zeer in twijfel waren, ook aan het leven. Ja, wij hadden zelf al in onszelf het vonnis van de dood, opdat wij niet op onszelf zouden vertrouwen, maar op God, Die de doden opwekt; Die ons uit zo’n grote dood verlost heeft, en nog verlost; op Wie wij hopen dat Hij ons ook nog verlossen zal.", "Hebr 13:5": "Laat uw wandel zonder geldgierigheid zijn, en wees tevreden met wat u hebt; want Hij heeft gezegd: Ik zal u niet begeven, en Ik zal u niet verlaten.", "Hand 3:23": "En het zal gebeuren dat iedere ziel die niet naar deze Profeet zal hebben geluisterd, uitgeroeid zal worden uit het volk.", "Deut 32:35": "Aan Mij is de wraak en de vergelding, op de tijd dat hun voet zal wankelen; want de dag van hun ondergang is nabij, en de dingen die hun zullen gebeuren, haasten zich.", "Mark 13:13": "En u zult door allen gehaat worden, omwille van Mijn Naam; maar wie zal volharden tot het einde, die zal behouden worden.", "Richt 1:14": "En het gebeurde, toen zij bij hem kwam, dat zij hem aanspoorde om van haar vader een veld te vragen; en zij sprong van de ezel af; toen zei Kaleb tegen haar: Wat wilt u?", "Fil 3:7-9": "Maar wat mij winst was, dat heb ik om Christus' wil als schade beschouwd. Ja, zeker, ik beschouw ook alle dingen als schade vanwege de uitnemendheid van de kennis van Christus Jezus, mijn Heere; om Wiens wil ik al die dingen als schade heb gerekend, en ze beschouw als vuil, opdat ik Christus mag winnen, En in Hem gevonden word, niet met mijn eigen rechtvaardigheid, die uit de wet is, maar met de rechtvaardigheid die door het geloof van Christus is, namelijk de rechtvaardigheid die uit God is door het geloof;", "Luk 4:18": "De Geest van de Heere is op Mij, daarom heeft Hij Mij gezalfd; Hij heeft Mij gezonden om aan de armen het Evangelie te verkondigen, om te genezen wie gebroken zijn van hart;", "Matt 7:23": "En dan zal Ik hun openlijk zeggen: Ik heb u nooit gekend; ga weg van Mij, u die de ongerechtigheid werkt!", "Ps 66:10-12": "Want U hebt ons beproefd, o God! U hebt ons gelouterd, zoals men zilver loutert; U had ons in het net gebracht; U had een engs band om onze lenden gelegd; U had de mens over ons hoofd laten rijden; wij waren in het vuur en in het water gekomen; maar U hebt ons uitgevoerd naar een overvloeiende verversing.", "Jes 49:8": "Zo zegt de HEERE: In de tijd van het welbehagen heb Ik U verhoord, en op de dag van het heil heb Ik U geholpen; en Ik zal U bewaren, en Ik zal U geven tot een verbond van het volk, om het aardrijk op te richten, om de verwoeste erfenissen te doen beërven;", "Rom 9:5": "van wie de vaders zijn, en uit wie Christus is, wat het vlees aangaat, Hij Die God is, boven allen te prijzen tot in eeuwigheid. Amen.", "Ps 105:24": "En Hij deed Zijn volk zeer meer worden, en maakte het machtiger dan zijn tegenstanders.", "Mark 14:27": "En Jezus zei tegen hen: U zult deze nacht allen aanstoot aan Mij nemen; want er is geschreven: Ik zal de Herder slaan, en de schapen zullen verstrooid worden.", "Micha 6:7": "Zou de HEERE welgevallen hebben aan duizenden rammen, aan tienduizenden oliebeken? Zal ik mijn eerstgeborene geven voor mijn overtreding, de vrucht van mijn buik voor de zonde van mijn ziel?", "Richt 6:22": "Toen zag Gideon dat het een Engel van de HEERE was; en Gideon zei: Ach, Heere HEERE! Want ik heb een Engel van de HEERE gezien, van aangezicht tot aangezicht.", "Ex 21:24": "oog voor oog, tand voor tand, hand voor hand, voet voor voet,", "Ex 20:20": "En Mozes zei tegen het volk: Wees niet bang, want God is gekomen om u te beproeven, en opdat de vreze voor Hem voor uw ogen zou zijn, zodat u niet zondigt.", "Ef 2:7": "opdat Hij zou tonen in de toekomende eeuwen de uitnemende rijkdom van Zijn genade, door de goedertierenheid over ons in Christus Jezus.", "Gen 16:10": "Verder zei de Engel van de HEERE tegen haar: Ik zal uw nageslacht enorm vermeerderen, zodat het vanwege de menigte niet geteld zal kunnen worden.", "Micha 4:10": "Lijd smart en doe uw uiterste best om te baren, dochter van Sion, als een barende vrouw; want nu zult u wel uit de stad heen weggaan, en op het veld wonen, en tot in Babel komen, maar daar zult u gered worden; daar zal de HEERE u verlossen uit de hand van uw vijanden.", "Ex 34:24": "Wanneer Ik de volken voor uw aangezicht uit hun bezit zal verdrijven, en uw grenzen verruimen, dan zal niemand uw land begeren, terwijl u erheen optrekt, om te verschijnen voor het aangezicht van de HEERE, uw God, driemaal in het jaar.", "Matt 5:30": "En als uw rechterhand u ergert, hak hem af en werp hem van u; want het is beter voor u dat een van uw lichaamsdelen verloren gaat, en niet uw hele lichaam in de hel geworpen wordt.", "1 Tim 4:8": "Want de lichamelijke oefening is van weinig nut; maar de godvruchtigheid is nuttig voor alles, omdat zij de belofte heeft van het tegenwoordige en van het toekomende leven.", "Jes 42:18-21": "Hoort, u doven! En kijkt toe, u blinden, om te zien. Wie is er blind als Mijn knecht, en doof, zoals Mijn bode, die Ik zend? Wie is blind, zoals de volmaakte, en blind, zoals de knecht van de HEERE? U ziet wel veel dingen, maar u bewaart ze niet; en al doet hij de oren open, toch hoort hij niet.", "1 Kon 3:4": "En de koning ging naar Gibeon om daar te offeren, omdat dat de grote hoogte was; duizend brandoffers offerde Salomo op dat altaar.", "Ps 57:2": "Wees mij genadig, o God! Wees mij genadig, want mijn ziel vertrouwt op U, en ik neem mijn toevlucht onder de schaduw van Uw vleugels, totdat de verdervingen voorbij zijn gegaan.", "Lev 25:18-22": "En doe Mijn inzettingen, en houd Mijn rechten, en doe die; dan zult u zeker wonen in het land. En het land zal zijn vrucht geven, en u zult eten tot verzadiging toe; en u zult zeker daarin wonen. En als u zou zeggen: Wat zullen wij eten in het zevende jaar! Zie, wij zullen niet zaaien, en onze opbrengst niet inzamelen;", "Luk 1:26-35": "En in de zesde maand werd de engel Gabriël door God gezonden naar een stad in Galilea, genaamd Nazareth, naar een maagd die ondertrouwd was met een man wiens naam Jozef was, uit het huis van David; en de naam van de maagd was Maria. En de engel kwam bij haar binnen, en zei: Wees gegroet, begenadigde; de Heere is met u; u bent gezegend onder de vrouwen.", "Matt 5:27": "U hebt gehoord dat gezegd is: U zult geen overspel plegen.", "Ps 110:1": "Een psalm van David. De HEERE heeft tot mijn Heere gesproken: Zit aan Mijn rechterhand, totdat Ik Uw vijanden gezet zal hebben tot een voetbank van Uw voeten.", "Dan 5:18": "Wat u aangaat, o koning! De allerhoogste God heeft uw vader Nebukadnezar het koninkrijk, en grootheid, en eer, en heerlijkheid gegeven;", "Jer 11:5": "Opdat Ik de eed bevestig, die Ik uw vaderen gezworen heb, hun een land te geven vloeiende van melk en honing, zoals het is op deze dag. Toen antwoordde ik en zei: Amen, o HEERE!", "Joh 12:26": "Als iemand Mij dient, laat hij Mij volgen; en waar Ik ben, daar zal ook Mijn dienaar zijn. En als iemand Mij dient, zal de Vader hem eren.", "Hand 8:32": "En het gedeelte van de Schrift dat hij las, was dit: Hij is als een schaap naar de slachting geleid; en zoals een lam stemloos is voor wie het scheert, zo doet Hij Zijn mond niet open.", "Deut 21:19": "Dan zullen zijn vader en zijn moeder hem grijpen, en hem brengen naar de oudsten van zijn stad, en naar de poort van zijn plaats.", "Gen 13:16": "En Ik zal uw nageslacht stellen als het stof van de aarde, zodat als iemand het stof van de aarde zal kunnen tellen, ook uw nageslacht geteld zal worden.", "Mark 9:11-13": "En zij vroegen Hem: Waarom zeggen de Schriftgeleerden dat Elia eerst moet komen? En Hij antwoordde en zei tegen hen: Elia komt inderdaad eerst, en herstelt alles; en het zal gebeuren, zoals geschreven is van de Zoon des mensen, dat Hij veel moet lijden en veracht worden. Maar Ik zeg u, dat Elia ook gekomen is, en zij hebben hem gedaan wat zij wilden, zoals van hem geschreven is.", "Jes 4:5": "En de HEERE zal over elke woning van de berg Sion, en over haar samenkomsten, een wolk scheppen overdag, en rook, en de glans van een vlammend vuur 's nachts; want over alles wat heerlijk is, zal een beschutting zijn.", "Hand 7:31": "Toen Mozes dat zag, verwonderde hij zich over het gezicht; en toen hij erheen ging om het van dichtbij te bekijken, kwam er een stem van de Heere tot hem,", "Jes 24:16": "Van het uiterste einde van de aarde horen wij psalmen, tot verheerlijking van de Rechtvaardige. Maar nu zeg ik: Ik word mager, ik word mager, wee mij! De trouwelozen handelen trouweloos, en met trouweloosheid handelen de trouwelozen trouweloos.", "Gen 12:5": "En Abram nam Sarai, zijn vrouw, en Lot, de zoon van zijn broer, en al hun bezit dat zij verworven hadden, en de mensen die zij verkregen hadden in Haran; en zij vertrokken om naar het land Kanaän te gaan, en zij kwamen in het land Kanaän aan.", "Jes 60:1": "Maak u op, word verlicht, want uw licht komt, en de heerlijkheid van de HEERE gaat over u op.", "1 Sam 15:35": "En Samuël zag Saul niet meer tot de dag van zijn dood toe; toch droeg Samuël leed om Saul; en het berouwde de HEERE, dat Hij Saul tot koning over Israël gemaakt had.", "Luk 23:36": "En ook de soldaten kwamen naar Hem toe en bespotten Hem, en brachten Hem azijn;", "Matt 21:5": "Zeg tegen de dochter van Sion: Zie, uw Koning komt naar u toe, zachtmoedig en gezeten op een ezelin, en een veulen, het jong van een lastdier.", "Jes 40:31": "Maar wie de HEERE verwachten, zullen de kracht vernieuwen; zij zullen opvaren met vleugels, gelijk de arenden; zij zullen lopen, en niet moede worden; zij zullen wandelen, en niet mat worden.", "Matt 2:5": "Zij zeiden tegen hem: In Bethlehem, in Judea; want zo is geschreven door de profeet:", "Hand 9:15": "Maar de Heere zei tegen hem: Ga heen; want deze man is Mij een uitverkoren instrument om Mijn Naam te dragen voor de heidenen, en de koningen, en de kinderen van Israël.", "Ps 119:67": "Eer ik verdrukt werd, dwaalde ik, maar nu onderhoud ik Uw woord.", "Ps 111:10": "Resch. De vreze van de HEERE is het beginsel van de wijsheid; Schin. allen die ernaar handelen, hebben goed verstand; Thau. Zijn lof bestaat tot in eeuwigheid.", "Ps 31:6": "In Uw hand beveel ik mijn geest; U hebt mij verlost, HEERE, U, God van de waarheid!", "Hebr 4:4": "Want Hij heeft ergens over de zevende dag zo gesproken: En God heeft op de zevende dag van al Zijn werken gerust.", "2 Tess 2:13": "Maar wij zijn verplicht altijd God te danken voor u, broeders, die door de Heere bemind bent, dat God u van het begin af verkoren heeft tot zaligheid, in heiliging door de Geest, en geloof in de waarheid;", "Jes 60:8-14": "Wie zijn deze, die daar komen aangevlogen als een wolk, en als duiven naar hun vensters? Want de eilanden zullen Mij verwachten, en de schepen van Tarsis vooreerst, om uw kinderen van verre te brengen, hun zilver en hun goud met hen, tot de Naam van de HEERE, uw God, en tot de Heilige van Israël, omdat Hij u heerlijk gemaakt heeft. En de vreemden zullen uw muren bouwen, en hun koningen zullen u dienen; want in Mijn verbolgenheid heb Ik u geslagen, maar in Mijn welbehagen heb Ik Mij over u ontfermd.", "Jes 32:2": "En die man zal zijn als een schuilplaats tegen de wind, en een schuilplaats tegen de storm, als waterbeken in een dorre plaats, als de schaduw van een zware rotssteen in een dorstig land.", "Zach 13:9": "En Ik zal dat derde deel in het vuur brengen, en Ik zal het louteren, zoals men zilver loutert, en Ik zal het beproeven, zoals men goud beproeft; het zal Mijn Naam aanroepen, en Ik zal het verhoren; Ik zal zeggen: Het is Mijn volk; en het zal zeggen: De HEERE is mijn God.", "Jes 41:13": "Want Ik, de HEERE, uw God, grijp uw rechterhand aan, Die tegen u zeg: Vrees niet, Ik help u.", "Ex 12:11": "Zo moet u het eten: uw lendenen opgeschort, uw schoenen aan uw voeten, en uw staf in uw hand; en u moet het met haast eten; het is het pascha van de HEERE.", "Spr 12:2": "De goede zal een welgevallen krijgen van de HEERE; maar een man van schandelijke verdichtsels zal Hij verdoemen.", "Matt 21:16": "en zeiden tegen Hem: Hoort U wel wat dezen zeggen? En Jezus zei tegen hen: Ja; hebt u nooit gelezen: Uit de mond van de jonge kinderen en de zuigelingen hebt U Zichzelf lof toebereid?", "Hebr 11:4": "Door het geloof heeft Abel een beter offer aan God gebracht dan Kaïn, en daardoor heeft hij het getuigenis gekregen dat hij rechtvaardig was, doordat God over zijn gave getuigenis gaf; en door dit geloof spreekt hij nog, hoewel hij gestorven is.", "Ps 4:4": "Weet toch, dat de HEERE Zich een gunstgenoot heeft afgezonderd; de HEERE zal horen, als ik tot Hem roep.", "Gal 2:20": "Ik ben met Christus gekruisigd; en ik leef, maar niet meer ik, maar Christus leeft in mij; en wat ik nu in het vlees leef, dat leef ik door het geloof van de Zoon van God, Die mij heeft liefgehad, en Zichzelf voor mij heeft overgegeven.", "Jes 49:1": "Hoort naar Mij, eilanden! En luistert toe, volken van verre! De HEERE heeft Mij geroepen van de buik af, van het ingewand van Mijn moeder af heeft Hij Mijn Naam vermeld.", "Ps 85:13": "Ook zal de HEERE het goede geven; en ons land zal zijn vrucht geven.", "Amos 9:12": "Opdat zij het overblijfsel van Edom erfelijk bezitten, en alle heidenvolken die naar Mijn Naam genoemd worden, spreekt de HEERE, Die dit doet.", "Rom 8:13": "Want als u naar het vlees leeft, zult u sterven; maar als u door de Geest de daden van het lichaam doodt, zult u leven.", "Deut 32:47": "Want dat is geen leeg woord voor u; maar het is uw leven; en door ditzelfde woord zult u de dagen verlengen op het land, waar u over de Jordaan naartoe gaat, om dat te erven.", "Ps 132:11": "De HEERE heeft David de waarheid gezworen, waarvan Hij niet wijken zal, en zei: Van de vrucht van uw buik zal Ik op uw troon zetten.", "Openb 3:4": "Toch hebt u enkele weinige namen ook in Sardis, die hun kleren niet bevlekt hebben, en zij zullen met Mij wandelen in witte kleren, omdat zij het waard zijn.", "Gen 25:20": "En Izak was veertig jaar oud, toen hij Rebekka, de dochter van Bethuel, de Syriër, uit Paddan-Aram, de zuster van Laban, de Syriër, tot vrouw nam.", "Rom 5:8": "Maar God bevestigt Zijn liefde tegenover ons hierin, dat Christus voor ons gestorven is toen wij nog zondaars waren.", "Jes 48:17": "Zo zegt de HEERE, uw Verlosser, de Heilige van Israël: Ik ben de HEERE, uw God, Die u leert wat nuttig is, Die u leidt op de weg, die u gaan moet.", "Matt 25:21": "En zijn heer zei tegen hem: Goed gedaan, goede en trouwe dienstknecht! Over weinig ben je trouw geweest; over veel zal ik je aanstellen; ga in, in de vreugde van uw heer.", "Joh 12:41": "Dit zei Jesaja, toen hij Zijn heerlijkheid zag, en over Hem sprak.", "Spr 14:34": "Gerechtigheid verhoogt een volk, maar de zonde is een schandvlek voor de naties.", "Matt 13:56": "En Zijn zusters, zijn die niet allemaal bij ons? Waar komt dan bij Deze dit alles vandaan?", "Joh 14:23": "Jezus antwoordde en zei tegen hem: Als iemand Mij liefheeft, zal hij Mijn woord bewaren; en Mijn Vader zal hem liefhebben, en Wij zullen naar hem toe komen, en woning bij hem maken.", "Dan 3:17-25": "Als het zo is, onze God, Die wij eren, is machtig om ons te verlossen uit de brandende vuuroven, en Hij zal ons uit uw hand, o koning, verlossen. Maar als dat niet zo is, laat het u bekend zijn, o koning, dat wij uw goden niet zullen eren, en ook het gouden beeld, dat u hebt opgericht, niet zullen aanbidden. Toen werd Nebukadnezar vervuld van woede, en de uitdrukking van zijn gezicht veranderde tegen Sadrach, Mesach en Abed-nego; hij antwoordde en zei, dat men de oven zeven keer heter moest maken dan men die gewoonlijk heet maakte.", "Hand 28:25-27": "En omdat zij het onderling oneens waren, gingen zij uiteen, nadat Paulus dit ene woord gezegd had, namelijk: Terecht heeft de Heilige Geest gesproken door de profeet Jesaja tot onze voorvaders, Toen hij zei: Ga naar dit volk, en zeg: Met het gehoor zult u horen, en beslist niet begrijpen; en ziende zult u zien, en beslist niet opmerken. Want het hart van dit volk is ongevoelig geworden, en met de oren hebben zij slecht gehoord, en hun ogen hebben zij gesloten; opdat zij niet op enig moment met de ogen zouden zien, en met de oren horen, en met het hart begrijpen, en zich zouden bekeren, en Ik hen zou genezen.", "Ps 18:50": "Daarom zal ik U, o HEERE! loven onder de heidenen; en Uw Naam zal ik psalmzingen;", "1 Kor 6:2": "Weet u niet, dat de heiligen de wereld zullen oordelen? En als door u de wereld geoordeeld wordt, bent u dan onwaardig de kleinste rechtszaken te oordelen?", "Gen 28:5": "Zo zond Izak Jakob weg, zodat hij naar Paddan-aram trok, naar Laban, de zoon van Bethuel, de Syriër, de broer van Rebekka, de moeder van Jakob en Ezau.", "Amos 9:11": "Op die dag zal Ik de vervallen hut van David weer oprichten, en Ik zal haar scheuren dichtmaken, en wat aan haar is afgebroken weer oprichten, en zal haar bouwen, als in de dagen van vroeger;", "Zach 9:9-17": "Verheug u zeer, dochter van Sion! Juich, dochter van Jeruzalem! Zie, uw Koning zal tot u komen, rechtvaardig, en Hij is een Heiland; arm, en rijdend op een ezel, en op een veulen, het jong van de ezelinnen. En Ik zal de wagens uit Efraïm uitroeien, en de paarden uit Jeruzalem; ook zal de strijdboog uitgeroeid worden, en Hij zal tot de heidenen vrede spreken; en Zijn heerschappij zal zijn van zee tot aan zee, en van de rivier tot aan de einden van de aarde. U ook aangaande, o Sion! Door het bloed van het verbond met u, heb Ik uw gebondenen uit de kuil, waar geen water in is, uitgelaten.", "1 Kon 19:7": "En de engel van de HEERE kwam voor de tweede keer terug, en raakte hem aan, en zei: Sta op, eet, want de weg zou te zwaar voor u zijn.", "Gen 22:11-18": "Maar de Engel van de HEERE riep tot hem vanuit de hemel, en zei: Abraham, Abraham! En hij zei: Zie, hier ben ik! Toen zei Hij: Strek uw hand niet uit naar de jongen, en doe hem niets! Want nu weet Ik dat u God vrezend bent, en uw zoon, uw enige, niet van Mij hebt onthouden. Toen hief Abraham zijn ogen op, en keek om, en zie, achter hem was een ram vastzittend in de struiken met zijn hoorns; en Abraham ging, en nam die ram, en offerde hem tot brandoffer in de plaats van zijn zoon.", "Gen 6:6": "Toen had de HEERE er berouw van, dat Hij de mens op de aarde gemaakt had, en het smartte Hem aan Zijn hart.", "Jes 35:10": "En de vrijgekochte van de HEERE zullen terugkeren, en naar Sion komen met gejuich, en eeuwige blijdschap zal op hun hoofd zijn; vrolijkheid en blijdschap zullen zij verkrijgen, maar droefenis en zuchten zullen wegvluchten.", "2 Tess 1:5-7": "Een bewijs van het rechtvaardige oordeel van God, opdat u waardig geacht wordt voor het Koninkrijk van God, waarvoor u ook lijdt; Aangezien het recht is bij God, verdrukking te vergelden aan hen die u verdrukken; En aan u, die verdrukt wordt, verkwikking te geven met ons, bij de openbaring van de Heere Jezus vanuit de hemel met de engelen van Zijn kracht;", "1 Tess 4:15-18": "Want dit zeggen wij u door het Woord van de Heere, dat wij, die levend overblijven tot de komst van de Heere, hen die ontslapen zijn niet zullen voorgaan. Want de Heere Zelf zal met een geroep, met de stem van de aartsengel, en met de bazuin van God neerdalen van de hemel; en zij die in Christus gestorven zijn, zullen eerst opstaan; Daarna zullen wij, die levend overgebleven zijn, samen met hen opgenomen worden in de wolken, de Heere tegemoet, in de lucht; en zo zullen wij altijd bij de Heere zijn.", "1 Kon 3:2": "Alleen offerde het volk op de hoogten, want er was nog geen huis gebouwd voor de Naam van de HEERE, tot op die dagen.", "Matt 21:2": "en zei tegen hen: Ga naar het dorp dat tegenover u ligt, en u zult meteen een ezelin vinden, vastgebonden, en een veulen bij haar. Maak ze los en breng ze bij Mij.", "1 Joh 4:10": "Hierin is de liefde: niet dat wij God liefgehad hebben, maar dat Hij ons lief heeft gehad, en Zijn Zoon gezonden heeft tot een verzoening voor onze zonden.", "Spr 3:1": "Mijn zoon! Vergeet mijn wet niet, maar uw hart bewaart mijn geboden.", "1 Tim 5:18": "Want de Schrift zegt: Een dorsende os zult u niet muilbanden; en: De arbeider is zijn loon waard.", "Deut 25:4": "Een os zult u niet muilbanden, als hij graan dorst.", "Mark 9:43": "En als uw hand u doet struikelen, hak hem af; het is beter voor u verminkt het leven in te gaan, dan met twee handen naar de hel te gaan, in het onblusbare vuur;", "Jes 40:6-8": "Een stem zegt: Roept! En hij zegt: Wat zal ik roepen? Alle vlees is gras, en al zijn goedertierenheid als een bloem van het veld. Het gras verdort, de bloem valt af, als de Geest van de HEERE daarin waait; voorwaar, het volk is gras. Het gras verdort, de bloem valt af; maar het Woord van onze God bestaat in eeuwigheid.", "1 Kon 19:14": "En hij zei: Ik heb mij zeer sterk ingezet voor de HEERE, de God van de heerscharen; want de Israëlieten hebben Uw verbond verlaten, Uw altaren afgebroken en Uw profeten met het zwaard gedood; en ik alleen ben overgebleven, en zij zoeken mij te doden.", "Jes 6:10": "Maak het hart van dit volk vet, en maak hun oren zwaar, en sluit hun ogen, opdat het niet ziet met zijn ogen, of met zijn oren hoort, of met zijn hart begrijpt, of zich bekeert, en Hij het geneest.", "Gen 26:4": "En Ik zal uw nageslacht vermenigvuldigen als de sterren van de hemel, en zal aan uw nageslacht al deze landen geven; en in uw nageslacht zullen alle volken van de aarde gezegend worden,", "Matt 18:9": "En als uw oog u doet struikelen, trek het uit en werp het van u weg. Het is beter voor u om met één oog het leven in te gaan, dan met twee ogen in het helse vuur geworpen te worden.", "Hebr 6:18": "opdat wij, door twee onveranderlijke dingen, waarin het onmogelijk is dat God liegt, een sterke troost zouden hebben, wij namelijk, die de toevlucht genomen hebben om de hoop die ons voorgesteld is vast te houden;", "Pred 2:26": "Want Hij geeft wijsheid, kennis en vreugde aan de mens die goed is voor Zijn aangezicht; maar aan de zondaar geeft Hij de bezigheid om te verzamelen en te vergaderen, opdat Hij het geeft aan wie goed is voor Gods aangezicht. Dit is ook ijdelheid en kwelling van de geest.", "Num 19:19": "En de reine zal de onreine op de derde dag, en op de zevende dag besprenkelen; en op de zevende dag zal hij hem ontzondigen; en hij zal zijn kleren wassen, en zichzelf met water baden, en op de avond rein zijn.", "Jes 54:1": "Zing vrolijk, u onvruchtbare, die niet gebaard hebt! Maak geschal met vrolijk gezang, en juich, die geen barensnood gehad hebt! Want de kinderen van de eenzame zijn meer dan de kinderen van de getrouwde, zegt de HEERE.", "Num 10:33": "Zo trokken zij drie dagreizen van de berg van de HEERE; en de ark van het verbond van de HEERE reisde voor hun aangezicht drie dagreizen, om voor hen een rustplaats uit te speuren.", "Gen 2:7": "En de HEERE God had de mens gevormd uit het stof van de aarde, en in zijn neusgaten de adem van het leven geblazen; zo werd de mens tot een levende ziel.", "Gen 24:64": "Rebekka hief ook haar ogen op, en zij zag Izak; en zij liet zich van de kameel af glijden.", "Mark 9:44": "Waar hun worm niet sterft, en het vuur niet uitgeblust wordt.", "Dan 7:27": "Maar het rijk, en de heerschappij, en de grootheid van de koninkrijken onder de hele hemel, zal gegeven worden aan het volk van de heiligen van de hoge plaatsen, wiens Rijk een eeuwig Rijk zal zijn; en alle heerschappijen zullen Hem eren en gehoorzamen.", "Matt 2:6": "En u, Bethlehem, land van Juda! U bent geenszins de minste onder de vorsten van Juda; want uit u zal de Leidsman voortkomen, Die Mijn volk Israël weiden zal.", "Mark 10:29": "En Jezus antwoordde en zei: Voorwaar, Ik zeg u: Er is niemand die huis, of broers, of zusters, of vader, of moeder, of vrouw, of kinderen, of akkers verlaten heeft, omwille van Mij en omwille van het Evangelie,", "Hab 2:3": "Want het visioen is nog bestemd voor een vastgestelde tijd, maar op het einde zal Hij het vervullen, en het zal niet liegen; al blijft het uit, verwacht het toch, want het zal zeker komen, het zal niet achterblijven.", "Ef 1:18": "Namelijk verlichte ogen van uw verstand, opdat u mag weten wat de hoop is van Zijn roeping, en wat de rijkdom is van de heerlijkheid van Zijn erfenis in de heiligen;", "Matt 24:22": "En als die dagen niet verkort werden, zou geen vlees behouden worden; maar omwille van de uitverkorenen zullen die dagen verkort worden.", "Gen 22:16-18": "En zei: Ik zweer bij Mijzelf, spreekt de HEERE; omdat u dit gedaan hebt, en uw zoon, uw enige, niet onthouden hebt; Voorzeker zal Ik u rijk zegenen, en uw nageslacht zeer talrijk maken, als de sterren van de hemel, en als het zand dat aan de oever van de zee is; en uw nageslacht zal de poort van zijn vijanden erfelijk bezitten. En in uw nageslacht zullen alle volken van de aarde gezegend worden, omdat u Mijn stem gehoorzaam bent geweest.", "Deut 8:4": "Uw kleding is aan u niet versleten, en uw voet is niet gezwollen, deze veertig jaar.", "Hand 7:34": "Ik heb zeker gezien de mishandeling van Mijn volk, dat in Egypte is, en Ik heb hun zuchten gehoord en ben neergekomen om hen daaruit te verlossen; en nu, kom hierheen, Ik zal u naar Egypte zenden.", "Jer 31:18": "Ik heb wel gehoord dat Efraïm zich beklaagt, en zegt: U hebt mij getuchtigd, en ik ben getuchtigd zoals een ongewend kalf. Bekeer mij, dan zal ik bekeerd zijn, want U bent de HEERE, mijn God!", "Job 1:5": "Het gebeurde dan, als de dagen van de maaltijden voorbij waren, dat Job hen liet halen en hen heiligde en 's morgens vroeg opstond en brandoffers offerde naar hun aller getal; want Job zei: Misschien hebben mijn kinderen gezondigd, en God in hun hart vervloekt. Zo deed Job al die dagen.", "Matt 4:6": "en zei tegen Hem: Als U Gods Zoon bent, werp Uzelf naar beneden; want er is geschreven dat Hij Zijn engelen bevelen zal U te beschermen, en dat zij U op de handen zullen dragen, opdat U niet op enig moment Uw voet aan een steen stoot.", "Joz 1:5": "Niemand zal voor uw aangezicht standhouden al de dagen van uw leven; zoals Ik met Mozes geweest ben, zal Ik met u zijn; Ik zal u niet begeven, en zal u niet verlaten.", "Ex 16:18": "Maar toen zij het met de gomer maten, had hij die veel verzameld had, niets over, en hem die weinig verzameld had, ontbrak niets; ieder verzamelde zoveel als hij eten kon.", "Richt 11:31": "dan zal het zo zijn, dat wat uit de deur van mijn huis mij tegemoet komt, wanneer ik in vrede terugkeer van de kinderen van Ammon, dat zal van de HEERE zijn, en ik zal het offeren als brandoffer.", "Joz 1:11": "Gaat door het midden van het leger, en beveelt het volk: Bereidt teerkost voor u; want binnen nog drie dagen zult u deze Jordaan overgaan, om erin te gaan, om het land te erven, dat de HEERE, uw God, u geeft om te beërven.", "Zach 6:15": "En zij die ver weg zijn, zullen komen, en zullen bouwen in de tempel van de HEERE, en u zult weten, dat de HEERE van de heerscharen mij tot u gezonden heeft. Dit zal gebeuren, als u vlijtig zult horen naar de stem van de HEERE, van uw God.", "Deut 28:2-13": "En al deze zegeningen zullen over u komen, en u aantreffen, wanneer u naar de stem van de HEERE, uw God, luistert. Gezegend zult u zijn in de stad, en gezegend zult u zijn op het veld. Gezegend zal zijn de vrucht van uw schoot, en de vrucht van uw land, en de vrucht van uw vee, de aanwas van uw koeien, en de kudden van uw kleinvee.", "Ps 66:4": "De hele aarde aanbidt U, en zingt U psalmen; zij zingt Uw Naam psalmen. Sela.", "Jer 22:15": "Zou u regeren, omdat u zich omringt met ceder? Heeft uw vader niet gegeten en gedronken, en recht en gerechtigheid gedaan, en ging het hem toen niet goed?", "Pred 12:13": "Van alles wat gehoord is, is dit de slotsom: Vrees God, en houd Zijn geboden, want dit is de hele plicht van de mens.", "Openb 20:4-6": "En ik zag tronen, en zij zaten daarop; en het oordeel werd hun gegeven; en ik zag de zielen van hen die onthoofd waren om de getuigenis van Jezus, en om het Woord van God, en die het beest, en zijn beeld niet aangebeden hadden, en die het merkteken niet ontvangen hadden aan hun voorhoofd en aan hun hand; en zij leefden en heersten als koningen met Christus, de duizend jaar. Maar de overigen van de doden werden niet weer levend, totdat de duizend jaar geëindigd waren. Dit is de eerste opstanding. Gelukkig en heilig is hij, die deel heeft in de eerste opstanding; over hen heeft de tweede dood geen macht, maar zij zullen priesters van God en Christus zijn, en zij zullen met Hem als koningen heersen, duizend jaar.", "Ezech 34:11-17": "Want zo zegt de Heere HEERE: Zie, Ik, ja, Ik zal naar Mijn schapen vragen, en zal ze opzoeken. Zoals een herder zijn kudde opzoekt, op de dag dat hij te midden van zijn verspreide schapen is, zo zal Ik Mijn schapen opzoeken; en Ik zal ze redden uit al de plaatsen, waarheen zij verstrooid zijn, op de dag van de wolk en de donkerheid. En Ik zal ze uitvoeren van de volken, en zal ze verzamelen uit de landen, en ze in hun land brengen; en Ik zal ze weiden op de bergen van Israël, bij de stromen en in alle bewoonbare plaatsen van het land.", "Ex 12:31-33": "Toen riep hij Mozes en Aäron in de nacht, en zei: Maakt u op, trekt uit het midden van mijn volk, u en de kinderen van Israël; en gaat heen, dient de HEERE, zoals u gesproken hebt. Neemt ook met u uw schapen en uw runderen, zoals u gesproken hebt, en gaat heen, en zegent mij ook. En de Egyptenaren drongen sterk aan bij het volk, om ze snel uit het land te drijven; want zij zeiden: Wij zijn allen dood!", "Ps 33:18": "Zie, het oog van de HEERE is over hen die Hem vrezen, op hen die op Zijn goedertierenheid hopen.", "Openb 11:15": "En de zevende engel heeft op de bazuin geblazen, en er kwamen grote stemmen in de hemel, die zeiden: De koninkrijken van de wereld zijn van onze Heere geworden en van Zijn Christus, en Hij zal als Koning heersen tot in alle eeuwigheid.", "Gen 2:3": "En God heeft de zevende dag gezegend, en die geheiligd; omdat Hij daarop gerust heeft van al Zijn werk, dat God geschapen had om te volmaken.", "Gen 24:7": "De HEERE, de God van de hemel, Die mij uit het huis van mijn vader en uit het land van mijn familie genomen heeft, en Die tot mij gesproken heeft, en Die mij gezworen heeft en zei: Aan uw nageslacht zal Ik dit land geven! Die Zelf zal Zijn Engel voor uw aangezicht zenden, zodat u voor mijn zoon van daar een vrouw neemt.", "Jes 61:2": "Om uit te roepen het jaar van het welbehagen van de HEERE, en de dag van de wraak van onze God; om alle treurenden te troosten;", "Gen 28:14": "En uw nageslacht zal zijn als het stof van de aarde, en u zult uitbreiden in menigte, westwaarts en oostwaarts, en noordwaarts en zuidwaarts; en in u, en in uw nageslacht zullen alle geslachten van de aardbodem gezegend worden.", "Deut 24:15": "Op zijn dag zult u hem zijn loon geven, en de zon zal daarover niet ondergaan; want hij is arm, en zijn ziel verlangt daarnaar; zodat hij tegen u niet roept tot de HEERE, en er zonde in u is.", "Ps 71:7": "Ik ben voor velen als een wonder geweest; doch Gij zijt mijn sterke Toevlucht.", "Gal 4:27": "Want er is geschreven: Wees vrolijk, u onvruchtbare, die niet baart, breek uit en roep, u die geen weeën hebt, want de kinderen van de eenzame zijn veel meer dan van haar die de man heeft.", "1 Petr 2:25": "Want u was als dwalende schapen; maar u bent nu bekeerd tot de Herder en Opziener van uw zielen.", "Ps 34:13-17": "Mem. Wie is de man die lust heeft ten leven, die dagen liefheeft om het goede te zien? Nun. Bewaar uw tong voor het kwaad, en uw lippen voor het spreken van bedrog. Samech. Wijk af van het kwaad, en doe het goede; zoek de vrede, en jaag die na.", "Jes 8:23": "Maar het land dat beangstigd was, zal niet helemaal verduisterd worden; zoals Hij het in de eerste tijd verachtelijk gemaakt heeft, naar het land van Zebulon toe en naar het land van Nafthali toe, zo heeft Hij het in het laatste heerlijk gemaakt, naar de weg zeewaarts toe gelegen over de Jordaan, aan Galilea van de heidenen.", "Pred 8:5": "Wie het gebod onderhoudt, zal niets kwaads ervaren; en het hart van een wijze weet tijd en wijze.", "Joh 12:14": "En Jezus vond een jonge ezel, en ging daarop zitten, zoals geschreven is:", "Ps 16:10": "Want U zult mijn ziel in het graf niet verlaten; U zult niet toelaten dat Uw Heilige de ontbinding ziet.", "Dan 12:1-3": "En in die tijd zal Michaël opstaan, die grote vorst, die voor de kinderen van uw volk staat, als het zo'n tijd van benauwdheid zal zijn, als er niet geweest is sinds er een volk geweest is, tot op die tijd toe; en in die tijd zal uw volk verlost worden, ieder die gevonden wordt geschreven te zijn in het boek. En velen van hen die in het stof van de aarde slapen, zullen ontwaken, dezen tot eeuwig leven, en anderen tot versmaadheden en tot eeuwige afgrijzing. De leraars nu zullen blinken als de glans van het uitspansel, en zij die er velen rechtvaardigen, gelijk de sterren, voor altijd en eeuwig.", "1 Kon 2:3": "En neem de wacht van de HEERE, uw God, in acht, om te wandelen in Zijn wegen, om Zijn inzettingen te onderhouden, en Zijn geboden, en Zijn rechten, en Zijn getuigenissen, zoals geschreven is in de wet van Mozes; opdat u verstandig handelt in alles wat u doet, en overal waar u zich heen wendt;", "Joël 2:32": "En het zal gebeuren, dat ieder die de Naam van de HEERE zal aanroepen, behouden zal worden; want op de berg Sion en te Jeruzalem zal ontkoming zijn, zoals de HEERE gezegd heeft; en dat, bij de overgeblevenen, die de HEERE zal roepen.", "Hebr 12:26": "Wiens stem toen de aarde deed beven; maar nu heeft Hij verkondigd en gezegd: Nog eenmaal zal Ik niet alleen de aarde doen beven, maar ook de hemel.", "Ps 69:23": "Hun tafel moet voor hun gezicht tot een strik worden, en tot volle vergelding tot een valstrik.", "2 Kor 4:17": "Want onze lichte verdrukking, die zeer haast voorbijgaat, brengt ons een geheel bijzonder groot en eeuwig gewicht van heerlijkheid;", "Jes 1:15": "En als u uw handen uitspreidt, verberg Ik Mijn ogen voor u; ook wanneer u het gebed vermenigvuldigt, hoor Ik niet; want uw handen zijn vol bloed.", "Jer 16:19-21": "O HEERE! U bent mijn Sterkte, en mijn Sterkheid, en mijn Toevlucht ten dage van de benauwdheid; tot U zullen de heidenen komen van de einden van de aarde, en zeggen: Zeker hebben onze vaders leugen erfelijk bezeten, en ijdelheid, waarin toch niets was, dat nut deed. Zal een mens zich goden maken? Zij zijn toch geen goden. Daarom, zie, Ik zal hun bekendmaken op dit moment; Ik zal hun Mijn hand en Mijn macht bekendmaken; en zij zullen weten, dat Mijn Naam is HEERE.", "Ps 65:9-14": "En die aan de einden wonen, vrezen voor Uw tekenen; U doet de uitgangen van de morgen en van de avond juichen. U bezoekt het land, en hebt het begerig gemaakt, U verrijkt het overvloedig; de rivier van God is vol water; wanneer U het zo bereid hebt, maakt U hun koren gereed. U maakt zijn opgeploegde aarde dronken; U doet ze dalen in zijn voren; U maakt het zacht door de druppels; U zegent zijn uitspruitsel.", "Ps 72:8": "En hij zal heersen van de zee tot aan de zee, en van de rivier tot aan de einden van de aarde.", "Gen 24:51": "Zie, Rebekka staat voor u; neem haar en ga heen; laat zij de vrouw worden van de zoon van uw heer, zoals de HEERE gesproken heeft!", "Deut 6:2-25": "Opdat u de HEERE, uw God, vreest, om al Zijn inzettingen en Zijn geboden te houden, die ik u gebied; u, en uw kind, en kindskind, al de dagen van uw leven; en opdat uw dagen verlengd worden. Hoor dan, Israël! en let erop dat u ze doet, opdat het u goed gaat, en opdat u zeer vermenigvuldigt (zoals de HEERE, de God van uw vaderen, u gesproken heeft) in het land, dat overvloeit van melk en honing. Hoor, Israël! De HEERE, onze God, is een enig HEERE!", "Joël 2:21": "Vrees niet, o land! verheug u, en wees blijde; want de HEERE heeft grote dingen gedaan.", "Ex 23:22": "Maar als u Zijn stem echt gehoorzaamt, en doet al wat Ik zeggen zal, dan zal Ik de vijand van uw vijanden zijn, en de tegenstander van wie u tegenstaat.", "Ps 23:1-6": "Een psalm van David. De HEERE is mijn Herder, mij zal niets ontbreken. Hij laat mij neerliggen in grazige weiden; Hij voert mij zachtjes naar zeer stille wateren. Hij verkwikt mijn ziel; Hij leidt mij in het spoor van de gerechtigheid, omwille van Zijn Naam.", "Ps 65:10-14": "U bezoekt het land, en hebt het begerig gemaakt, U verrijkt het overvloedig; de rivier van God is vol water; wanneer U het zo bereid hebt, maakt U hun koren gereed. U maakt zijn opgeploegde aarde dronken; U doet ze dalen in zijn voren; U maakt het zacht door de druppels; U zegent zijn uitspruitsel. U kroont het jaar van Uw goedheid; en Uw voetstappen druipen van vettigheid.", "Gen 31:54": "Toen slachtte Jakob een offer op dat gebergte, en hij nodigde zijn broeders om brood te eten; en zij aten brood, en overnachtten op dat gebergte.", "Openb 22:5": "En daar zal geen nacht zijn, en zij zullen geen kaars noch licht van de zon nodig hebben; want de Heere God verlicht hen; en zij zullen als koningen heersen tot in alle eeuwigheid.", "Hab 2:4": "Zie, wie zich verheft, zijn ziel is niet oprecht in hem; maar de rechtvaardige zal door zijn geloof leven.", "2 Petr 2:9": "dan weet de Heere hoe Hij de godvruchtigen uit de verzoeking moet verlossen, en de onrechtvaardigen moet bewaren tot de dag van het oordeel om gestraft te worden;", "2 Petr 2:22": "Maar hun is overkomen wat een waar spreekwoord zegt: De hond is teruggekeerd naar zijn eigen uitbraaksel; en het gewassen varken naar de modderpoel om zich erin te wentelen.", "Gen 28:19": "En hij noemde de naam van die plaats Beth-el; hoewel de naam van die stad vroeger Luz was.", "1 Kor 6:16": "Of weet u niet, dat wie zich aan een hoer hecht, één lichaam met haar is? Want die twee, zegt Hij, zullen tot één vlees worden.", "Ex 32:14": "Toen kreeg de HEERE berouw over het kwaad, dat Hij gezegd had Zijn volk te zullen aandoen.", "Neh 5:15": "En de vorige landvoogden, die vóór mij geweest zijn, hebben het volk bezwaard en van hen genomen aan brood en wijn, daarna veertig zilveren sikkels; ook heersten hun knechten over het volk; maar ik heb dat niet gedaan, om de vreze van God.", "Joël 2:26": "En u zult overvloedig en tot verzadiging eten, en de Naam van de HEERE, uw God, prijzen, Die wonderlijk bij u gehandeld heeft; en Mijn volk zal niet beschaamd worden tot in eeuwigheid.", "Dan 10:3": "Smakelijk voedsel at ik niet, en vlees of wijn kwam niet in mijn mond; ook zalfde ik mij helemaal niet, totdat die drie volle weken vervuld waren.", "Luk 9:57-60": "En het gebeurde onderweg, terwijl zij reisden, dat iemand tegen Hem zei: Heere, ik zal U volgen waar U ook heengaat. En Jezus zei tegen hem: De vossen hebben holen, en de vogels onder de hemel nesten; maar de Zoon des mensen heeft geen plaats om het hoofd neer te leggen. En Hij zei tegen een ander: Volg Mij. Maar hij zei: Heere, sta mij toe dat ik eerst wegga om mijn vader te begraven.", "Deut 24:1": "Wanneer een man een vrouw genomen en die getrouwd heeft, dan zal het gebeuren, als zij geen genade vindt in zijn ogen, omdat hij iets van schande aan haar gevonden heeft, dat hij haar een scheidbrief zal schrijven, en die in haar hand geven, en haar laten gaan uit zijn huis.", "Ex 20:14": "U zult geen echtbreuk plegen.", "Jes 33:16": "Die zal in de hoogten wonen, de sterkten van de steenrotsen zullen zijn hoge schuilplaats zijn; zijn brood wordt hem gegeven, zijn water is gewis.", "Matt 5:45": "opdat u kinderen mag zijn van uw Vader, Die in de hemelen is; want Hij laat Zijn zon opgaan over bozen en goeden, en laat het regenen over rechtvaardigen en onrechtvaardigen.", "Hos 11:1": "Toen Israël een kind was, heb Ik hem liefgehad, en Ik heb Mijn zoon uit Egypte geroepen.", "Ps 103:3-5": "Die al uw ongerechtigheid vergeeft, die al uw ziekten geneest; Die uw leven verlost van het verderf, die u kroont met goedertierenheid en barmhartigheden; Die uw mond verzadigt met het goede, uw jeugd vernieuwt als die van een arend.", "1 Kor 9:12": "Als anderen deze macht over u deelachtig zijn, waarom wij dan niet veel meer? Toch hebben wij deze macht niet gebruikt, maar wij verdragen alles, opdat wij geen enkele verhindering geven aan het Evangelie van Christus.", "Jes 65:14": "Zie, Mijn knechten zullen juichen van een goed hart, maar u zult schreeuwen van harteleed, en van verbreking van de geest zult u huilen.", "Mark 10:19": "U kent de geboden: U zult geen overspel plegen; u zult niet doden; u zult niet stelen; u zult geen vals getuigenis geven; u zult niemand tekortdoen; eer uw vader en uw moeder.", "Hand 8:33": "In Zijn vernedering is Zijn oordeel weggenomen; en wie zal Zijn geslacht verhalen? Want Zijn leven wordt van de aarde weggenomen.", "Rom 9:29": "En zoals Jesaja van tevoren gezegd heeft: Als de Heere Sebaoth ons geen nageslacht had overgelaten, dan waren wij geworden als Sodom, en gelijk gemaakt aan Gomorra.", "Ps 15:2-5": "Die oprecht wandelt, en gerechtigheid doet, en die met zijn hart de waarheid spreekt; Die met zijn tong niet lastert, zijn metgezellen geen kwaad doet, en geen smaad uit over zijn naaste; In wiens ogen de verworpene veracht is, maar hij eert hen die de HEERE vrezen; heeft hij gezworen tot zijn eigen schade, toch verandert hij niet;", "Ps 67:7": "De aarde geeft haar opbrengst; God, onze God, zal ons zegenen.", "Hand 4:11": "Hij is de Steen, Die door u, de bouwlieden, veracht is, Die tot een hoeksteen geworden is.", "Mark 12:11": "Dit is door de Heere gebeurd, en het is wonderlijk in onze ogen?", "Rom 14:11": "Want er is geschreven: Ik leef, zegt de Heere, voor Mij zal elke knie zich buigen, en elke tong zal God belijden.", "Ex 20:17": "U zult niet begeren het huis van uw naaste; u zult niet begeren de vrouw van uw naaste, of zijn dienstknecht, of zijn dienstmaagd, of zijn os, of zijn ezel, of iets dat van uw naaste is.", "Gal 6:8": "Want die in zijn eigen vlees zaait, zal uit het vlees verderf maaien; maar die in de Geest zaait, zal uit de Geest het eeuwige leven maaien.", "Matt 5:31": "Er is ook gezegd: Wie zijn vrouw verlaat, moet haar een scheidbrief geven.", "1 Kron 21:15": "En God zond een engel naar Jeruzalem, om die te verderven; en toen hij haar verdierf, zag de HEERE het, en het berouwde Hem over dat kwaad; en Hij zei tegen de verdervende engel: Het is genoeg, trek nu uw hand terug. De engel van de HEERE nu stond bij de dorsvloer van Ornan, de Jebusiet.", "Jer 4:2": "Maar zweer: Zo waarachtig als de HEERE leeft! in waarheid, in recht en in gerechtigheid; dan zullen de heidenvolken zich in Hem zegenen, en zich in Hem beroemen.", "Openb 22:16": "Ik, Jezus, heb Mijn engel gezonden om u deze dingen te getuigen in de Gemeenten. Ik ben de Wortel en het geslacht van David, de blinkende Morgenster.", "Joz 1:8": "Laat het boek van deze wet niet wijken van uw mond, maar overleg het dag en nacht, opdat u waarneemt te doen naar alles wat daarin geschreven is; want dan zult u uw wegen voorspoedig maken, en dan zult u verstandig handelen.", "Gen 22:1-12": "Het gebeurde na deze dingen dat God Abraham beproefde; en Hij zei tegen hem: Abraham! En hij zei: Zie, hier ben ik! En Hij zei: Neem toch uw zoon, uw enige, die u liefhebt, Izak, en ga naar het land Moria, en offer hem daar tot een brandoffer, op een van de bergen die Ik u zeggen zal. Toen stond Abraham 's morgens vroeg op, en zadelde zijn ezel, en nam twee van zijn knechten met zich, en Izak zijn zoon; en hij kloofde hout voor het brandoffer, en maakte zich op, en ging naar de plaats die God hem gezegd had.", "Matt 19:4": "Maar Hij antwoordde en zei tegen hen: Hebt u niet gelezen dat Hij Die van het begin de mens gemaakt heeft, hen gemaakt heeft man en vrouw?", "Matt 24:21": "Want dan zal er grote verdrukking zijn, wat voor verdrukking er niet geweest is vanaf het begin van de wereld tot nu toe, en er ook nooit meer zal zijn.", "Ps 68:32": "Prinselijke gezanten zullen komen uit Egypte; Morenland zal zich haasten zijn handen tot God uit te strekken.", "Job 39:3": "Wie bereidt de raaf haar kost, als haar jongen tot God schreeuwen, als zij dwalen, omdat er geen eten is?", "Hebr 1:5": "Want tegen wie van de engelen heeft Hij ooit gezegd: U bent Mijn Zoon, heden heb Ik U verwekt? En opnieuw: Ik zal Hem tot een Vader zijn, en Hij zal Mij tot een Zoon zijn?", "1 Tess 3:13": "opdat Hij uw harten versterkt, om onberispelijk te zijn in heiligmaking, voor onze God en Vader, bij de komst van onze Heere Jezus Christus met al Zijn heiligen.", "Zach 10:1": "Vraag van de HEERE regen, in de tijd van de late regen; de HEERE maakt de bliksemwolken¹, en Hij zal hun regen genoeg geven, voor ieder kruid op het veld.", "Ps 71:15": "Mijn mond zal Uw gerechtigheid vertellen, de hele dag Uw heil; hoewel ik de getallen ervan niet weet.", "Matt 8:19-22": "En er kwam een schriftgeleerde naar Hem toe, die tegen Hem zei: Meester, ik zal U volgen, waar U ook heengaat. En Jezus zei tegen hem: De vossen hebben holen, en de vogels van de hemel nesten; maar de Zoon des mensen heeft niets waar Hij het hoofd kan neerleggen. En een ander van Zijn discipelen zei tegen Hem: Heere, laat mij toe dat ik eerst heenga en mijn vader kan begraven.", "Matt 13:35": "Opdat vervuld zou worden wat gesproken is door de profeet, die zei: Ik zal Mijn mond opendoen door gelijkenissen; Ik zal dingen voortbrengen die verborgen waren van de grondlegging van de wereld af.", "Hebr 6:16-20": "Want mensen zweren wel bij iemand die groter is dan zij, en de eed tot bevestiging is voor hen een einde van alle tegenspraak; waarbij God, omdat Hij aan de erfgenamen van de belofte overvloediger de onveranderlijkheid van Zijn raad wilde tonen, er een eed tussen heeft gebracht; opdat wij, door twee onveranderlijke dingen, waarin het onmogelijk is dat God liegt, een sterke troost zouden hebben, wij namelijk, die de toevlucht genomen hebben om de hoop die ons voorgesteld is vast te houden;", "Jer 23:5": "Zie, de dagen komen, spreekt de HEERE, dat Ik voor David een rechtvaardige Spruit zal doen opstaan; Die zal Koning zijnde regeren, en voorspoedig zijn, en recht en gerechtigheid doen op de aarde.", "Ps 34:8": "Cheth. De Engel van de HEERE legert Zich rondom hen die Hem vrezen, en redt hen.", "Joh 10:18": "Niemand neemt het van Mij, maar Ik leg het zelf af; Ik heb macht om het af te leggen, en Ik heb macht om het opnieuw te nemen. Dit gebod heb Ik van Mijn Vader ontvangen.", "Luk 12:7": "Ja, ook de haren van uw hoofd zijn allemaal geteld. Wees dan niet bang; u gaat vele musjes te boven.", "Ex 3:6": "Hij zei verder: Ik ben de God van uw vader, de God van Abraham, de God van Izak en de God van Jakob. En Mozes verborg zijn gezicht, want hij was bang om God aan te zien.", "Ps 71:6": "Op U heb ik gesteund van de buik af aan; van de ingewanden van mijn moeder af aan zijt Gij mijn Uithelper; mijn lof is voortdurend van U.", "Hand 7:3-8": "en zei tegen hem: Ga uit uw land en uit uw familie, en kom in een land dat Ik u wijzen zal. Toen ging hij weg uit het land van de Chaldeeën, en woonde in Haran. En vandaar, nadat zijn vader gestorven was, bracht Hij hem over naar dit land, waarin u nu woont. En Hij gaf hem geen erfdeel daarin, zelfs geen voetstap; maar Hij beloofde dat Hij het hem tot een bezitting geven zou, en aan zijn nageslacht na hem, terwijl hij nog geen kind had.", "Ps 31:3": "Neig Uw oor tot mij, red mij haastig; wees mij tot een sterke Rotssteen, tot een zeer vast Huis, om mij te behouden.", "1 Sam 2:8": "Hij verheft de geringe uit het stof, en de nooddruftige verhoogt Hij uit de vuilnis, om hen te doen zitten bij de vorsten, dat Hij hen de stoel van de eer laat beërven; want de fundamenten van het aardrijk zijn van de HEERE, en Hij heeft de wereld daarop gezet.", "Num 6:17": "Hij zal ook de ram als dankoffer voor de HEERE bereiden, met de korf ongezuurde koeken; en de priester zal zijn spijsoffer en zijn drankoffer bereiden.", "Ps 102:19-23": "Dat zal geschreven worden voor het volgende geslacht; en het volk, dat geschapen zal worden, zal de HEERE loven; Omdat Hij uit de hoogte van het heiligdom zal hebben neerwaarts gezien; dat de HEERE uit de hemel op de aarde geschouwd zal hebben; Om het zuchten van de gevangenen te horen, om los te maken de kinderen van de dood;", "Jes 10:22": "Want ofschoon uw volk, o Israël, is als het zand van de zee, zo zal toch maar het overblijfsel daarvan terugkeren; de verdelging is vast besloten, overvloeiend met gerechtigheid.", "Luk 16:22-25": "En het gebeurde dat de bedelaar stierf, en door de engelen gedragen werd in de schoot van Abraham; en de rijke stierf ook, en werd begraven. En toen hij in de hel zijn ogen ophief, terwijl hij in de pijn was, zag hij Abraham van verre, en Lazarus in zijn schoot. En hij riep en zei: Vader Abraham, ontferm u over mij, en zend Lazarus, dat hij het uiterste puntje van zijn vinger in het water dompelt, en mijn tong verkoelt; want ik lijd pijn in deze vlam.", "Kol 3:24": "want u weet dat u van de Heere de vergelding van de erfenis zult ontvangen; want u dient de Heere Christus.", "2 Sam 24:1": "En de toorn van de HEERE ging verder tegen Israël ontsteken; en Hij porde David tegen hen aan en zei: Ga, tel Israël en Juda.", "Deut 6:16": "U zult de HEERE, uw God, niet beproeven, zoals u Hem beproefd hebt te Massa.", "Jes 54:1-3": "Zing vrolijk, u onvruchtbare, die niet gebaard hebt! Maak geschal met vrolijk gezang, en juich, die geen barensnood gehad hebt! Want de kinderen van de eenzame zijn meer dan de kinderen van de getrouwde, zegt de HEERE. Maak de plaats van uw tenten wijd, en laat men de gordijnen van uw woningen uitbreiden, verhinder het niet; maak uw koorden lang, en steek uw pinnen vast in. Want u zult uitbreken ter rechter hand en ter linkerhand; en uw nageslacht zal de heidenen erven, en zij zullen de verwoeste steden doen bewonen.", "1 Petr 2:11-16": "Geliefden, ik roep u dringend op, als inwoners en vreemdelingen, dat u zich onthoudt van de vleselijke begeerten, die strijd voeren tegen de ziel; En houd uw levenswandel eerlijk onder de heidenen; opdat, waar zij nu kwaad van u spreken als van kwaaddoeners, zij door de goede werken die zij van u zien, God mogen verheerlijken op de dag dat Hij naar hen omziet. Wees dan onderdanig aan alle menselijke instelling, om de Heere; hetzij aan de koning, als hebbende het hoogste gezag;", "Lev 26:10": "En u zult het oude, dat verouderd is, eten; en het oude zult u wegdoen vanwege het nieuwe.", "Gen 25:23": "En de HEERE zei tegen haar: Twee volken zijn in uw buik, en twee naties zullen zich uit uw ingewand van elkaar scheiden; en het ene volk zal sterker zijn dan het andere volk; en de oudste zal de jongste dienen.", "Lev 16:30": "Want op die dag zal hij voor u verzoening doen, om u te reinigen; van al uw zonden zult u voor het aangezicht van de HEERE gereinigd worden.", "Gen 12:2": "En Ik zal u tot een groot volk maken, en u zegenen, en uw naam groot maken; en wees een zegen!", "2 Kron 7:17": "En wat u betreft, als u voor Mijn aangezicht wandelt, zoals uw vader David gewandeld heeft, en doet naar alles wat Ik u geboden heb, en Mijn inzettingen en Mijn rechten houdt;", "Luk 4:19": "Om aan de gevangenen vrijlating te prediken, en aan de blinden het gezicht, om de verslagenen in vrijheid heen te zenden; om te prediken het aangename jaar van de Heere.", "Matt 19:30": "Maar veel eersten zullen de laatsten zijn, en veel laatsten de eersten.", "Jes 51:2": "Kijk naar Abraham, uw vader, en naar Sara, die u gebaard heeft; want Ik riep hem, toen hij nog alleen was, en Ik zegende hem, en Ik vermenigvuldigde hem.", "Job 37:6": "Want Hij zegt tot de sneeuw: Val op de aarde; en tot de regenbui: Wees een sterke regenbui.", "Jes 2:2-5": "En het zal gebeuren in de laatste dagen, dat de berg van het huis van de HEERE vastgesteld zal zijn op de top van de bergen, en dat hij verheven zal worden boven de heuvels, en tot hem zullen alle heidenvolken toevloeien. En veel volken zullen heengaan en zeggen: Kom, laat ons opgaan tot de berg van de HEERE, tot het huis van de God van Jakob, opdat Hij ons leert van Zijn wegen, en dat wij wandelen in Zijn paden; want uit Sion zal de wet uitgaan, en het woord van de HEERE uit Jeruzalem. En Hij zal rechtspreken onder de heidenvolken, en bestraffen veel volken; en zij zullen hun zwaarden slaan tot spaden, en hun speren tot snoeimessen; het ene volk zal tegen het andere volk geen zwaard opheffen, en zij zullen geen oorlog meer leren.", "Matt 13:14": "En in hen wordt de profetie van Jesaja vervuld, die zegt: Met het gehoor zult u horen, en geenszins begrijpen; en ziende zult u zien, en geenszins opmerken.", "Gen 3:15": "En Ik zal vijandschap zetten tussen u en de vrouw, en tussen uw nageslacht en haar Nageslacht; Dat zal u de kop vermorzelen, en u zult Het de hiel vermorzelen.", "Joh 6:45": "Er is geschreven in de profeten: En zij zullen allen door God onderwezen zijn. Ieder dan die het van de Vader gehoord en geleerd heeft, komt tot Mij.", "Hand 14:17": "hoewel Hij Zichzelf toch niet zonder getuigenis gelaten heeft, doordat Hij goeddeed, ons vanuit de hemel regen en vruchtbare tijden gaf, en onze harten vervulde met voedsel en vreugde.", "Gen 16:7": "En de Engel van de HEERE vond haar bij een waterbron in de woestijn, bij de bron op de weg naar Sur.", "Matt 5:21": "U hebt gehoord dat tot de ouden gezegd is: U zult niet doden; en wie doodt, die zal strafbaar zijn voor het gericht.", "2 Tess 2:14": "waartoe Hij u geroepen heeft door ons Evangelie, tot verkrijging van de heerlijkheid van onze Heere Jezus Christus.", "Hebr 2:10": "Want het paste Hem, om Wie alle dingen zijn, en door Wie alle dingen zijn, dat Hij, veel kinderen naar de heerlijkheid leidend, de leidsman van hun zaligheid door lijden zou volmaken.", "Spr 26:11": "Zoals een hond terugkeert naar zijn uitspuwsel, zo herneemt de dwaas zijn dwaasheid.", "Jes 40:11": "Hij zal Zijn kudde weiden gelijk een herder; Hij zal de lammeren in Zijn armen bijeenbrengen, en in Zijn schoot dragen; de zogende dieren zal Hij zachtjes leiden.", "Klaagl 3:20": "Zain. Mijn ziel denkt er wel terdege aan, en zij buigt zich neer in mij.", "Openb 7:4": "En ik hoorde het getal van hen die verzegeld waren: honderdvierenveertigduizend waren verzegeld uit alle geslachten van de kinderen van Israël.", "Jona 4:6": "En God, de HEERE, liet een wonderboom groeien en die opschieten boven Jona, zodat er schaduw zou zijn over zijn hoofd, om hem te bevrijden van zijn ellende. En Jona verheugde zich over de wonderboom met grote blijdschap.", "Jes 11:1-10": "Want er zal een Rijsje voortkomen uit de afgehouwen tronk van Isaï, en een Scheut uit zijn wortels zal vrucht voortbrengen. En op Hem zal de Geest van de HEERE rusten, de Geest van wijsheid en van verstand, de Geest van raad en van sterkte, de Geest van kennis en van vreze van de HEERE. En Zijn vreugde zal zijn in de vreze van de HEERE; en Hij zal niet oordelen naar wat Zijn ogen zien, en niet bestraffen naar wat Zijn oren horen.", "Deut 13:3": "dan zult u naar de woorden van die profeet, of naar die dromen-dromer, niet horen; want de HEERE, uw God, beproeft u, om te weten of u de HEERE, uw God, liefhebt met heel uw hart en met heel uw ziel.", "Hand 7:32": "die zei: Ik ben de God van uw vaders, de God van Abraham, en de God van Izak, en de God van Jakob. En Mozes begon hevig te beven, en durfde niet te kijken.", "Gen 11:26": "En Terah leefde zeventig jaar, en verwekte Abram, Nahor en Haran.", "Ps 58:12": "En de mens zal zeggen: Zeker, er is vrucht voor de rechtvaardige; zeker, er is een God, Die op de aarde recht spreekt.", "Ps 23:1": "Een psalm van David. De HEERE is mijn Herder, mij zal niets ontbreken.", "Spr 10:3": "De HEERE laat de ziel van de rechtvaardige niet hongeren; maar de have van de goddelozen stoot Hij weg.", "Ps 22:6": "Tot U hebben zij geroepen, en zijn uitgered; op U hebben zij vertrouwd, en zijn niet beschaamd geworden.", "2 Sam 7:8": "Nu dan, zo zult u tegen Mijn knecht, tegen David, zeggen: Zo zegt de HEERE van de heerscharen: Ik heb u genomen van de schaapskooi, van achter de schapen, om een voorganger te zijn over Mijn volk, over Israël.", "Jes 45:6": "Opdat men weet, vanaf de opgang van de zon tot aan de ondergang, dat er buiten Mij niets is, Ik ben de HEERE, en niemand meer.", "Hand 7:26-28": "En de volgende dag liet hij zich aan hen zien, terwijl zij vochten; en hij drong hen tot vrede, en zei: Mannen, u bent broeders; waarom doet u elkaar onrecht aan? Maar die zijn naaste onrecht aandeed, stiet hem weg, en zei: Wie heeft u tot leider en rechter over ons gesteld? Wilt u mij oo
