ngen dat God Abraham beproefde; en Hij zei tegen hem: Abraham! En hij zei: Zie, hier ben ik!","2":"En Hij zei: Neem toch uw zoon, uw enige, die u liefhebt, Izak, en ga naar het land Moria, en offer hem daar tot een brandoffer, op een van de bergen die Ik u zeggen zal.","3":"Toen stond Abraham 's morgens vroeg op, en zadelde zijn ezel, en nam twee van zijn knechten met zich, en Izak zijn zoon; en hij kloofde hout voor het brandoffer, en maakte zich op, en ging naar de plaats die God hem gezegd had.","4":"Op de derde dag hief Abraham zijn ogen op, en zag die plaats van verre.","5":"En Abraham zei tegen zijn knechten: Blijf u hier met de ezel, en ik en de jongen zullen daarheen gaan; als wij aanbeden hebben, zullen wij tot u terugkeren.","6":"En Abraham nam het hout van het brandoffer, en legde het op Izak, zijn zoon; en hij nam het vuur en het mes in zijn hand, en zij gingen beiden samen.","7":"Toen sprak Izak tegen Abraham, zijn vader, en zei: Mijn vader! En hij zei: Zie, hier ben ik, mijn zoon! En hij zei: Zie het vuur en het hout; maar waar is het lam voor het brandoffer?","8":"En Abraham zei: God zal Zichzelf een lam tot brandoffer voorzien, mijn zoon! Zo gingen zij beiden samen.","9":"En zij kwamen bij de plaats die God hem gezegd had; en Abraham bouwde daar een altaar, en schikte het hout, en bond zijn zoon Izak, en legde hem op het altaar boven op het hout.","10":"En Abraham strekte zijn hand uit, en nam het mes om zijn zoon te slachten.","11":"Maar de Engel van de HEERE riep tot hem vanuit de hemel, en zei: Abraham, Abraham! En hij zei: Zie, hier ben ik!","12":"Toen zei Hij: Strek uw hand niet uit naar de jongen, en doe hem niets! Want nu weet Ik dat u God vrezend bent, en uw zoon, uw enige, niet van Mij hebt onthouden.","13":"Toen hief Abraham zijn ogen op, en keek om, en zie, achter hem was een ram vastzittend in de struiken met zijn hoorns; en Abraham ging, en nam die ram, en offerde hem tot brandoffer in de plaats van zijn zoon.","14":"En Abraham noemde de naam van die plaats: De Heere zal het voorzien! Waarom tot op deze dag gezegd wordt: Op de berg van de HEERE zal het voorzien worden!","15":"Toen riep de Engel van de HEERE voor de tweede keer tot Abraham vanuit de hemel;","16":"En zei: Ik zweer bij Mijzelf, spreekt de HEERE; omdat u dit gedaan hebt, en uw zoon, uw enige, niet onthouden hebt;","17":"Voorzeker zal Ik u rijk zegenen, en uw nageslacht zeer talrijk maken, als de sterren van de hemel, en als het zand dat aan de oever van de zee is; en uw nageslacht zal de poort van zijn vijanden erfelijk bezitten.","18":"En in uw nageslacht zullen alle volken van de aarde gezegend worden, omdat u Mijn stem gehoorzaam bent geweest.","19":"Toen keerde Abraham terug naar zijn knechten, en zij maakten zich op, en zij gingen samen naar Ber-seba; en Abraham woonde te Ber-seba.","20":"En het gebeurde na deze dingen dat men Abraham berichtte: Zie, Milka heeft ook zonen gebaard aan Nahor, uw broer:","21":"Uz, zijn eerstgeborene, en Buz, zijn broer, en Kemuël, de vader van Aram,","22":"En Chesed, en Hazo, en Pildas, en Jidlaf, en Bethuël;","23":"(En Bethuël verwekte Rebekka) deze acht baarde Milka aan Nahor, de broer van Abraham.","24":"En zijn bijvrouw, wier naam Reüma was, die baarde ook Tebah, en Gaham, en Tahas, en Maächa."},"SV":{"1":"En het geschiedde na deze dingen, dat God Abraham verzocht; en Hij zeide tot hem: Abraham! En hij zeide: Zie, *hier* ben ik!","2":"En Hij zeide: Neem nu uw zoon, uw enige, dien gij liefhebt, Izak, en ga heen naar het land Moria, en offer hem aldaar tot een brandoffer, op een van de bergen, dien Ik u zeggen zal.","3":"Toen stond Abraham des morgens vroeg op, en zadelde zijn ezel, en nam twee van zijn jongeren met zich, en Izak zijn zoon; en hij kloofde hout tot het brandoffer, en maakte zich op, en ging naar de plaats, die God hem gezegd had.","4":"Aan den derden dag, toen hief Abraham zijn ogen op, en zag die plaats van verre.","5":"En Abraham zeide tot zijn jongeren: Blijft gij hier met den ezel, en ik en de jongen zullen heengaan tot daar; als wij aangebeden zullen hebben, dan zullen wij tot u wederkeren.","6":"En Abraham nam het hout des brandoffers, en legde het op Izak, zijn zoon; en hij nam het vuur en het mes in zijn hand, en zij beiden gingen samen.","7":"Toen sprak Izak tot Abraham, zijn vader, en zeide: Mijn vader! En hij zeide: Zie, *hier* ben ik, mijn zoon! En hij zeide: Zie het vuur en het hout; maar waar *is* het lam tot het brandoffer?","8":"En Abraham zeide: God zal Zichzelven een lam ten brandoffer voorzien, mijn zoon! Zo gingen zij beiden samen.","9":"En zij kwamen ter plaatse, die hem God gezegd had; en Abraham bouwde aldaar een altaar, en hij schikte het hout, en bond zijn zoon Izak, en leide hem op het altaar boven op het hout.","10":"En Abraham strekte zijn hand uit, en nam het mes om zijn zoon te slachten.","11":"Maar de Engel des HEEREN riep tot hem van den hemel, en zeide: Abraham, Abraham! En hij zeide: Zie, *hier* ben ik!","12":"Toen zeide Hij: Strek uw hand niet uit aan den jongen, en doe hem niets! want nu weet Ik, dat gij God vrezende *zijt*, en uw zoon, uw enige, van Mij niet hebt onthouden.","13":"Toen hief Abraham zijn ogen op, en zag om, en ziet, achter was een ram in de verwarde struiken vast met zijn hoornen; en Abraham ging, en nam dien ram, en offerde hem ten brandoffer in zijns zoons plaats.","14":"En Abraham noemde den naam van die plaats: De Heere zal het voorzien! Waarom heden ten dage gezegd wordt: Op den berg des HEEREN zal het voorzien worden!","15":"Toen riep de Engel des HEEREN tot Abraham ten tweeden male van den hemel;","16":"En zeide: Ik zweer bij Mijzelven, spreekt de HEERE; daarom dat gij deze zaak gedaan hebt, en uw zoon, uw enige, niet onthouden hebt;","17":"Voorzeker zal Ik u grotelijks zegenen, en uw zaad zeer vermenigvuldigen, als de sterren des hemels, en als het zand, dat aan den oever der zee is; en uw zaad zal de poort zijner vijanden erfelijk bezitten.","18":"En in uw zaad zullen gezegend worden alle volken der aarde, naardien gij Mijn stem gehoorzaam geweest zijt.","19":"Toen keerde Abraham weder tot zijn jongeren, en zij maakten zich op, en zij gingen samen naar Ber-seba; en Abraham woonde te Ber-seba.","20":"En het geschiedde na deze dingen, dat men Abraham boodschapte, zeggende: Zie, Milka heeft ook Nahor, uw broeder, zonen gebaard:","21":"Uz, zijn eerstgeborene, en Buz, zijn broeder, en Kemuël, den vader van Aram,","22":"En Chesed, en Hazo, en Pildas, en Jidlaf, en Bethuël;","23":"(En Bethuël gewon Rebekka) deze acht baarde Milka aan Nahor, den broeder van Abraham.","24":"En zijn bijwijf, welker naam was Reüma, diezelve baarde ook Tebah, en Gaham, en Tahas, en Maacha."},"KJV":{"1":"And it came to pass after these things, that God did tempt Abraham, and said unto him, Abraham: and he said,","2":"And he said, Take now thy son, thine only *son* Isaac, whom thou lovest, and get thee into the land of Moriah; and offer him there for a burnt offering upon one of the mountains which I will tell","3":"And Abraham rose up early in the morning, and saddled his ass, and took two of his young men with him, and Isaac his son, and clave the wood for the burnt offering, and rose up, and went unto the place of which God had told","4":"Then on the third day Abraham lifted up his eyes, and saw the place afar off.","5":"And Abraham said unto his young men, Abide ye here with the ass; and I and the lad will go yonder and worship, and come again","6":"And Abraham took the wood of the burnt offering, and laid *it* upon Isaac his son; and he took the fire in his hand, and a knife; and they went both of them together.","7":"And Isaac spake unto Abraham his father, and said, My father: and he said, Here *am* I, my son. And he said, Behold the fire and the wood: but where *is* the lamb for a burnt offering?","8":"And Abraham said, My son, God will provide himself a lamb for a burnt offering: so they went both of them together.","9":"And they came to the place which God had told him of; and Abraham built an altar there, and laid the wood in order, and bound Isaac his son, and laid him on the altar upon the wood.","10":"And Abraham stretched forth his hand, and took the knife to slay his son.","11":"And the angel of the LORD called unto him out of heaven, and said, Abraham, Abraham: and he said,","12":"And he said, Lay not thine hand upon the lad, neither do thou any thing unto him: for now I know that thou fearest God, seeing thou hast not withheld thy son, thine only","13":"And Abraham lifted up his eyes, and looked, and behold behind *him* a ram caught in a thicket by his horns: and Abraham went and took the ram, and offered him up for a burnt offering in the stead of his son.","14":"And Abraham called the name of that place Jehovahjireh: as it is said *to* this day, In the mount of the LORD it shall be seen.","15":"And the angel of the LORD called unto Abraham out of heaven the second time,","16":"And said, By myself have I sworn, saith the LORD, for because thou hast done this thing, and hast not withheld thy son, thine only","17":"That in blessing I will bless thee, and in multiplying I will multiply thy seed as the stars of the heaven, and as the sand which *is* upon the sea shore; and thy seed shall possess the gate of his enemies;","18":"And in thy seed shall all the nations of the earth be blessed; because thou hast obeyed my voice.","19":"So Abraham returned unto his young men, and they rose up and went together to Beersheba; and Abraham dwelt at Beersheba.","20":"And it came to pass after these things, that it was told Abraham, saying, Behold, Milcah, she hath also born children unto thy brother Nahor;","21":"Huz his firstborn, and Buz his brother, and Kemuel the father of Aram,","22":"And Chesed, and Hazo, and Pildash, and Jidlaph, and Bethuel.","23":"And Bethuel begat Rebekah: these eight Milcah did bear to Nahor, Abraham's brother.","24":"And his concubine, whose name *was* Reumah, she bare also Tebah, and Gaham, and Thahash, and Maachah."}},"tsk":{"1":[{"kopje":"God","refs":["Ex 15:25","Ex 15:26","Ex 16:4","Deut 8:2","Deut 13:3","Richt 2:22","2 Sam 24:1","2 Kron 32:31","Spr 17:3","1 Kor 10:13","Hebr 11:17","Jak 1:12-14","Jak 2:21","1 Petr 1:7"]},{"kopje":"Zie, hier ben ik","refs":["Gen 22:7","Gen 22:11","Ex 3:4","Jes 6:8"]}],"2":[{"kopje":"Neem","refs":["Gen 17:19","Gen 21:12","Joh 3:16","Rom 5:8","Rom 8:32","Hebr 11:17","1 Joh 4:9","1 Joh 4:10"]},{"kopje":"Moria","refs":["2 Kron 3:1"]},{"kopje":"en offer","refs":["Richt 11:31","Richt 11:39","2 Kon 3:27","Micha 6:7"]}],"4":[{"kopje":"derde","refs":["Ex 5:3","Ex 15:22","Ex 19:11","Ex 19:15","Lev 7:17","Num 10:33","Num 19:12","Num 19:19","Num 31:19","Joz 1:11","2 Kon 20:5","Est 5:1","Hos 6:2","Matt 17:23","Luk 13:32","1 Kor 15:4"]},{"kopje":"zag","refs":["1 Sam 26:13"]}],"5":[{"kopje":"Blijf","refs":["Hebr 12:1"]},{"kopje":"gaan","refs":["Hebr 11:19"]}],"6":[{"kopje":"legde het","refs":["Jes 53:6","Matt 8:17","Luk 24:26","Luk 24:27","Joh 19:17","1 Petr 2:24"]}],"7":[{"kopje":"Mijn vader","refs":["Matt 26:39","Matt 26:42","Joh 18:11","Rom 8:15"]},{"kopje":"Zie, hier ben ik","refs":["Gen 22:1"]},{"kopje":"maar","refs":["Gen 4:2-4","Gen 8:20"]},{"kopje":"lam","refs":["Ex 12:3"]}],"9":[{"kopje":"plaats","refs":["Gen 22:2-4","Matt 21:1-46","Matt 26:1","Matt 27:66"]},{"kopje":"bouwde","refs":["Gen 8:20"]},{"kopje":"bond","refs":["Ps 118:27","Jes 53:4-10","Matt 27:2","Mark 15:1","Joh 10:17","Joh 10:18","Hand 8:32","Gal 3:13","Ef 5:2","Fil 2:7","Fil 2:8","Hebr 9:28","1 Petr 2:24"]}],"11":[{"kopje":"Engel","refs":["Gen 22:12","Gen 22:16","Gen 16:7","Gen 16:9","Gen 16:10","Gen 21:17"]},{"kopje":"Abraham","refs":["Gen 22:1","Ex 3:4","1 Sam 3:10","Hand 9:4","Hand 26:14"]}],"12":[{"kopje":"Strek","refs":["1 Sam 15:22","Job 5:19","Jer 19:5","Micha 6:6-8","1 Kor 10:13","2 Kor 8:12","Hebr 11:19"]},{"kopje":"nu","refs":["Gen 20:11","Gen 26:5","Gen 42:18","Ex 20:20","1 Sam 12:24","1 Sam 12:25","1 Sam 15:22","Neh 5:15","Job 28:28","Ps 1:6","Ps 2:11","Ps 2 ">tempt</span> <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham:</span> and he said,","2":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Take <span class=\"wl wl-kjv\" data-code=\"H3947\">now</span> thy <span class=\"wl wl-kjv\" data-code=\"H1121\">son,</span> thine <span class=\"wl wl-kjv\" data-code=\"H3173\">only</span> son <span class=\"wl wl-kjv\" data-code=\"H3327\">Isaac,</span> whom thou <span class=\"wl wl-kjv\" data-code=\"H157\">lovest,</span> and get <span class=\"wl wl-kjv\" data-code=\"H3212\">thee</span> into the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4179\">Moriah;</span> and offer <span class=\"wl wl-kjv\" data-code=\"H5927\">him</span> there for a burnt <span class=\"wl wl-kjv\" data-code=\"H5930\">offering</span> upon <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> of the <span class=\"wl wl-kjv\" data-code=\"H2022\">mountains</span> which I will tell","3":"And <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham</span> rose up <span class=\"wl wl-kjv\" data-code=\"H7925\">early</span> in the <span class=\"wl wl-kjv\" data-code=\"H1242\">morning,</span> and <span class=\"wl wl-kjv\" data-code=\"H2280\">saddled</span> his <span class=\"wl wl-kjv\" data-code=\"H2543\">ass,</span> and <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> of his young <span class=\"wl wl-kjv\" data-code=\"H5288\">men</span> with him, and <span class=\"wl wl-kjv\" data-code=\"H3327\">Isaac</span> his <span class=\"wl wl-kjv\" data-code=\"H1121\">son,</span> and <span class=\"wl wl-kjv\" data-code=\"H1234\">clave</span> the <span class=\"wl wl-kjv\" data-code=\"H6086\">wood</span> for the burnt <span class=\"wl wl-kjv\" data-code=\"H5930\">offering,</span> and rose <span class=\"wl wl-kjv\" data-code=\"H6965\">up,</span> and <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> unto the <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> of which <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> had told","4":"Then on the <span class=\"wl wl-kjv\" data-code=\"H7992\">third</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham</span> lifted <span class=\"wl wl-kjv\" data-code=\"H5375\">up</span> his <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes,</span> and <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> the <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> afar off.","5":"And <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto his young <span class=\"wl wl-kjv\" data-code=\"H5288\">men,</span> <span class=\"wl wl-kjv\" data-code=\"H3427\">Abide</span> ye here with the <span class=\"wl wl-kjv\" data-code=\"H2543\">ass;</span> and I and the <span class=\"wl wl-kjv\" data-code=\"H5288\">lad</span> will <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> <span class=\"wl wl-kjv\" data-code=\"H3541\">yonder</span> and <span class=\"wl wl-kjv\" data-code=\"H7812\">worship,</span> and come again","6":"And <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> the <span class=\"wl wl-kjv\" data-code=\"H6086\">wood</span> of the burnt <span class=\"wl wl-kjv\" data-code=\"H5930\">offering,</span> and <span class=\"wl wl-kjv\" data-code=\"H7760\">laid</span> it upon <span class=\"wl wl-kjv\" data-code=\"H3327\">Isaac</span> his <span class=\"wl wl-kjv\" data-code=\"H1121\">son;</span> and he <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> the <span class=\"wl wl-kjv\" data-code=\"H784\">fire</span> in his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> and a <span class=\"wl wl-kjv\" data-code=\"H3979\">knife;</span> and they <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> <span class=\"wl wl-kjv\" data-code=\"H8147\">both</span> of them together.","7":"And <span class=\"wl wl-kjv\" data-code=\"H3327\">Isaac</span> <span class=\"wl wl-kjv\" data-code=\"H559\">spake</span> unto <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham</span> his <span class=\"wl wl-kjv\" data-code=\"H1\">father,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> My <span class=\"wl wl-kjv\" data-code=\"H1\">father:</span> and he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Here am I, my <span class=\"wl wl-kjv\" data-code=\"H1121\">son.</span> And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Behold the <span class=\"wl wl-kjv\" data-code=\"H784\">fire</span> and the <span class=\"wl wl-kjv\" data-code=\"H6086\">wood:</span> but where is the <span class=\"wl wl-kjv\" data-code=\"H7716\">lamb</span> for a burnt offering?","8":"And <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> My <span class=\"wl wl-kjv\" data-code=\"H1121\">son,</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> will <span class=\"wl wl-kjv\" data-code=\"H7200\">provide</span> himself a <span class=\"wl wl-kjv\" data-code=\"H7716\">lamb</span> for a burnt <span class=\"wl wl-kjv\" data-code=\"H5930\">offering:</span> so they <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> both of <span class=\"wl wl-kjv\" data-code=\"H8147\">them</span> together.","9":"And they <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to the <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> which <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> had <span class=\"wl wl-kjv\" data-code=\"H559\">told</span> him of; and <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham</span> <span class=\"wl wl-kjv\" data-code=\"H1129\">built</span> an <span class=\"wl wl-kjv\" data-code=\"H4196\">altar</span> there, and <span class=\"wl wl-kjv\" data-code=\"H6186\">laid</span> the <span class=\"wl wl-kjv\" data-code=\"H6086\">wood</span> in <span class=\"wl wl-kjv\" data-code=\"H6186\">order,</span> and <span class=\"wl wl-kjv\" data-code=\"H6123\">bound</span> <span class=\"wl wl-kjv\" data-code=\"H3327\">Isaac</span> his <span class=\"wl wl-kjv\" data-code=\"H1121\">son,</span> and <span class=\"wl wl-kjv\" data-code=\"H7760\">laid</span> him on the <span class=\"wl wl-kjv\" data-code=\"H4196\">altar</span> <span class=\"wl wl-kjv\" data-code=\"H4605\">upon</span> the wood.","10":"And <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham</span> stretched <span class=\"wl wl-kjv\" data-code=\"H7971\">forth</span> his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> and <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> the <span class=\"wl wl-kjv\" data-code=\"H3979\">knife</span> to <span class=\"wl wl-kjv\" data-code=\"H7819\">slay</span> his son.","11":"And the <span class=\"wl wl-kjv\" data-code=\"H4397\">angel</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> unto him out of <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham,</span> <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham:</span> and he said,","12":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">Lay</span> not thine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> <span class=\"wl wl-kjv\" data-code=\"H413\">upon</span> the <span class=\"wl wl-kjv\" data-code=\"H5288\">lad,</span> neither do <span class=\"wl wl-kjv\" data-code=\"H6213\">thou</span> any <span class=\"wl wl-kjv\" data-code=\"H3972\">thing</span> unto him: for <span class=\"wl wl-kjv\" data-code=\"H6258\">now</span> I <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> that thou <span class=\"wl wl-kjv\" data-code=\"H3373\">fearest</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> seeing thou hast <span class=\"wl wl-kjv\" data-code=\"H3808\">not</span> <span class=\"wl wl-kjv\" data-code=\"H2820\">withheld</span> thy <span class=\"wl wl-kjv\" data-code=\"H1121\">son,</span> thine only","13":"And <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham</span> lifted <span class=\"wl wl-kjv\" data-code=\"H5375\">up</span> his <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes,</span> and <span class=\"wl wl-kjv\" data-code=\"H7200\">looked,</span> and behold <span class=\"wl wl-kjv\" data-code=\"H310\">behind</span> him a <span class=\"wl wl-kjv\" data-code=\"H352\">ram</span> <span class=\"wl wl-kjv\" data-code=\"H270\">caught</span> in a <span class=\"wl wl-kjv\" data-code=\"H5442\">thicket</span> by his <span class=\"wl wl-kjv\" data-code=\"H7161\">horns:</span> and <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> and <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> the <span class=\"wl wl-kjv\" data-code=\"H352\">ram,</span> and offered him <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> for a burnt <span class=\"wl wl-kjv\" data-code=\"H5930\">offering</span> in the <span class=\"wl wl-kjv\" data-code=\"H8478\">stead</span> of his son.","14":"And <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham</span> <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of that <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> <span class=\"wl wl-kjv\" data-code=\"H3070\">Jehovahjireh:</span> <span class=\"wl wl-kjv\" data-code=\"H834\">as</span> it is <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to this <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> In the <span class=\"wl wl-kjv\" data-code=\"H2022\">mount</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> it shall be seen.","15":"And the <span class=\"wl wl-kjv\" data-code=\"H4397\">angel</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> unto <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham</span> out of <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven</span> the second time,","16":"And <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> By myself have I <span class=\"wl wl-kjv\" data-code=\"H7650\">sworn,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> for <span class=\"wl wl-kjv\" data-code=\"H3282\">because</span> thou hast <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> this <span class=\"wl wl-kjv\" data-code=\"H1697\">thing,</span> and hast <span class=\"wl wl-kjv\" data-code=\"H3808\">not</span> <span class=\"wl wl-kjv\" data-code=\"H2820\">withheld</span> thy <span class=\"wl wl-kjv\" data-code=\"H1121\">son,</span> thine only","17":"That in <span class=\"wl wl-kjv\" data-code=\"H1288\">blessing</span> I will <span class=\"wl wl-kjv\" data-code=\"H1288\">bless</span> thee, and in <span class=\"wl wl-kjv\" data-code=\"H7235\">multiplying</span> I will <span class=\"wl wl-kjv\" data-code=\"H7235\">multiply</span> thy <span class=\"wl wl-kjv\" data-code=\"H2233\">seed</span> as the <span class=\"wl wl-kjv\" data-code=\"H3556\">stars</span> of the <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven,</span> and as the <span class=\"wl wl-kjv\" data-code=\"H2344\">sand</span> which is upon the <span class=\"wl wl-kjv\" data-code=\"H3220\">sea</span> <span class=\"wl wl-kjv\" data-code=\"H8193\">shore;</span> and thy <span class=\"wl wl-kjv\" data-code=\"H2233\">seed</span> shall <span class=\"wl wl-kjv\" data-code=\"H3423\">possess</span> the <span class=\"wl wl-kjv\" data-code=\"H8179\">gate</span> of his enemies;","18":"And in thy <span class=\"wl wl-kjv\" data-code=\"H2233\">seed</span> shall all the <span class=\"wl wl-kjv\" data-code=\"H1471\">nations</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> be <span class=\"wl wl-kjv\" data-code=\"H1288\">blessed;</span> <span class=\"wl wl-kjv\" data-code=\"H834\">because</span> thou hast <span class=\"wl wl-kjv\" data-code=\"H8085\">obeyed</span> my voice.","19":"So <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">returned</span> unto his young <span class=\"wl wl-kjv\" data-code=\"H5288\">men,</span> and they rose <span class=\"wl wl-kjv\" data-code=\"H6965\">up</span> and <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> <span class=\"wl wl-kjv\" data-code=\"H3162\">together</span> to <span class=\"wl wl-kjv\" data-code=\"H884\">Beersheba;</span> and <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham</span> <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelt</span> at Beersheba.","20":"And it came to pass <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> these <span class=\"wl wl-kjv\" data-code=\"H1697\">things,</span> that it was <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Behold, <span class=\"wl wl-kjv\" data-code=\"H4435\">Milcah,</span> she hath also <span class=\"wl wl-kjv\" data-code=\"H3205\">born</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> unto thy <span class=\"wl wl-kjv\" data-code=\"H251\">brother</span> Nahor;","21":"<span class=\"wl wl-kjv\" data-code=\"H5780\">Huz</span> his <span class=\"wl wl-kjv\" data-code=\"H1060\">firstborn,</span> and <span class=\"wl wl-kjv\" data-code=\"H938\">Buz</span> his <span class=\"wl wl-kjv\" data-code=\"H251\">brother,</span> and <span class=\"wl wl-kjv\" data-code=\"H7055\">Kemuel</span> the <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> of Aram,","22":"And <span class=\"wl wl-kjv\" data-code=\"H3777\">Chesed,</span> and <span class=\"wl wl-kjv\" data-code=\"H2375\">Hazo,</span> and <span class=\"wl wl-kjv\" data-code=\"H6394\">Pildash,</span> and <span class=\"wl wl-kjv\" data-code=\"H3044\">Jidlaph,</span> and Bethuel.","23":"And <span class=\"wl wl-kjv\" data-code=\"H1328\">Bethuel</span> <span class=\"wl wl-kjv\" data-code=\"H3205\">begat</span> <span class=\"wl wl-kjv\" data-code=\"H7259\">Rebekah:</span> these <span class=\"wl wl-kjv\" data-code=\"H8083\">eight</span> <span class=\"wl wl-kjv\" data-code=\"H4435\">Milcah</span> did <span class=\"wl wl-kjv\" data-code=\"H3205\">bear</span> to <span class=\"wl wl-kjv\" data-code=\"H5152\">Nahor,</span> <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham's</span> brother.","24":"And his <span class=\"wl wl-kjv\" data-code=\"H6370\">concubine,</span> whose <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> was <span class=\"wl wl-kjv\" data-code=\"H7208\">Reumah,</span> she <span class=\"wl wl-kjv\" data-code=\"H3205\">bare</span> also <span class=\"wl wl-kjv\" data-code=\"H2875\">Tebah,</span> and <span class=\"wl wl-kjv\" data-code=\"H1514\">Gaham,</span> and <span class=\"wl wl-kjv\" data-code=\"H8477\">Thahash,</span> and Maachah."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"het geschiedde","tekst":"Nadat Abraham zoveel beloften ontvangen had, ja zelfs van de geboorte van den Messias, van welke er geen konden vervuld worden, indien Izak zonder zaad ware gestorven, zo heeft de Heere Abraham aldus willen beproeven, alsof Hij al de voorgemelde beloften had willen vernietigen."},{"catchword":"verzocht","tekst":"God verzoekt de zijnen, als Hij een proef neemt van hun zwakheid of deugd, om door derzelver openbaring hen te vernederen of te verheerlijken. Zie Deu 8:2, en Deu 13:3; Jdg 2:22; 2Ch 32:21; Psa 139:23-24. Wat Abraham aangaat, God kende hem volkomen, maar wilde zijn sterk geloof en ongeveinsde gehoorzaamheid op een bijzondere wijze, tot zijn eer, mitsgaders van Abraham en van zijn ganse kerk, ten beste openbaren. Zie onder vs.16,17."},{"catchword":"Zie","tekst":"Hebr. Zie ik, te weten, ben hier. Een manier van spreken, dengenen eigen, die, geroepen zijnde, bereid zijn om aan te horen wat hun voorgehouden wordt. Zie onder vs.7, 11, en Gen 27:1; 1Sa 3:4, 1Sa 3:6, enz."}],"2":[{"catchword":"Neem","tekst":"Elk woord kon des vaders hart doorsnijden. Dit en hetgeen onder vs.6, 9,10, verhaald wordt, kan ons enigszins afbeelden het genadewerk Gods, die zijn eigen, welbeminden Zoon niet gespaard, maar voor ons allen overgeven heeft, om onze zonden te dragen op het hout; Rom 8:32; 1Pe 2:24."},{"catchword":"het land","tekst":"Alzo, naar het algemeen gevoelen genoemd naar de uitkomst dezer verzoeking. Zie onder, vs.14, met de aant. Dit is het land, waarin Jeruzalem gelegen en de tempel op den berg Moria gebouwd is, 1Ch 22:1; 2Ch 3:1, ter zijde van den berg Zion, omtrent drie dagreizen van Berseba. Zie onder, vs.4."},{"catchword":"offer hem","tekst":"Dat is, dood hem eerst met uw eigen hand, en verbrand daarna het dode lichaam tot as toe; gelijk men doet met de beesten, die ten brandoffer geëigend zijn; Lev 6:9-10, enz. Dit bevel was door geen natuurlijk vernuft, maar alleenlijk door het geloof, met Gods belofte en Abrahams vaderlijken plicht en genegenheid tot zijn enigen zoon overeen te brengen; maar van Gods verborgen raad en voornemen in dit bevel; zie op vs.1 en onder vs.12."},{"catchword":"brandoffer,","tekst":"Zie de aantekening boven Gen 8:20."}],"3":[{"catchword":"stond","tekst":"Abraham is terstond vaardig, overwinnende vlees en bloed, en vastelijk gelovende dat God, niettegenstaande dit alles, zijn beloften zou volbrengen, als machtig zijnde om hem Izak uit de doden weder te geven, hetwelk ook naar gelijkenis geschied is, gelijk de apostel betuigt, Heb 11:19."},{"catchword":"hout tot","tekst":"Hebr. houten des brandoffers."}],"4":[{"catchword":"Aan den","tekst":"Deze verheid van plaats en reis van omtrent drie dagen, diende tot klaarder openbaring van Abrahams zonderlinge bestendigheid."}],"5":[{"catchword":"jongen","tekst":"Dit woord wordt niet alleen op de kleine kinderen toegepast, maar ook op de volwassenen, gelijk Abrahams gewapende knechten, boven, Gen 14:14, Gen 14:24; idem, op den jonkman Sichem, die Dina verkrachtte, on. Gen 34:19; Jozef, toen hij Faraö's dromen uitlegde, ond. Gen 41:12; Jozua, toen hij Mozes diende, Exo 33:1; Absalom, toen hij zijn vader oorlog aandeed, 2Sa 18:29, en hier op Izak en Abrahams knechten; verg. het volgende vers (6)."},{"catchword":"aangebeden","tekst":"Zie ond. Gen 24:26."},{"catchword":"dan zullen","tekst":"Hoewel het voornemen van Abraham was zijn zoon te offeren, en hem de uitkomst van dit werk specialijk onbekend was, nochtans geloofde hij dat God zijn zoon hem wedergeven kon; en alzo heeft hij onwetend wat toekomstig was voorzegd."}],"6":[{"catchword":"En Abraham","tekst":"Hoewel het onzeker is hoe oud Izak in dezen tijd was [enigen menen vijf en twintig jaren, anderen minder, anderen meer] nochtans is hieruit af te nemen dat hij tamelijk oud was, omdat hij het hout, waarmede de ezel was beladen geweest, heeft kunnen dragen op het gebergte. Zie boven vs.5"}],"7":[{"catchword":"Mijn vader","tekst":"De liefelijke woorden van Izak zouden Abraham naar het vlees wel veel hebben kunnen hinderen, maar door des Heeren Geest verwekten zij in hem meerder vertrouwen van een goede uitkomst, gelijk zijn antwoord getuigt."}],"8":[{"catchword":"voorzien,","tekst":"Hebr. zien. Verg. onder vs.14."}],"9":[{"catchword":"bond zijn","tekst":"Gelijk de beesten ter offerande aan hun vier voeten gebonden worden, alzo heeft Abraham zijn zoon Izak aan handen en voeten gebonden, zoals enigen menen, omdat het Hebreeuwse woord, van de offeranden gebruikt zijnde, zulks dikwijls betekent. Merk hier de bijzondere lijdzaamheid en gehoorzaamheid van Izak, die zonder twijfel door zijn vader daartoe tevoren was overreed."}],"10":[{"catchword":"te slachten","tekst":"Anders, de keel af te snijden."}],"11":[{"catchword":"engel des","tekst":"Versta, den Zoon Gods, blijkende uit het einde van het 12 vs . en het ganse vervolg dezer historie. Verg. Gen 18:1, Gen 18:17, Gen 18:22, en Gen 19:18-19, Gen 19:21, Gen 19:24."},{"catchword":"Abraham,","tekst":"De naam wordt verdubbeld, omdat de zaak haast vereiste, dewijl Abraham bezig was om het mes aan de keel te brengen en de snede te geven."}],"12":[{"catchword":"Strek uw","tekst":"Door dit bevel openbaart nu God zijn verborgen raad en voornemen in deze verzoeking, hetwelk Hij in het voorgaande bevel, vs.2, niet gedaan had."},{"catchword":"nu weet","tekst":"Menselijker wijze van God gesproken, gelijk vs.1, want Abrahams godvruchtigheid was God tevoren genoeg bekend, maar Hij wordt gezegd nu daarvan kennis te hebben, omdat Hij haar door deze verzoeking aan zijn ganse kerk ten volle bekend had gemaakt. Zo wordt het Hebreeuwse woord genomen Psa 139:23. Beproef mij en ken mijn gedachten. Want tevoren had hij gezegd vs.2: Gij verstaat mijn gedachten van verre."},{"catchword":"van Mij","tekst":"Hieruit blijkt dat het God zelf is, die hier spreekt."}],"13":[{"catchword":"achter","tekst":"Het schijnt dat de engel Abraham van achteren geroepen heeft, zodat hij, omziende, meteen den ram gezien heeft; verstaande terstond door Gods ingeven, dat hij dien in zijns zoons plaats zou slachten."},{"catchword":"in de","tekst":"Te weten, van een haag of doornbos."}],"14":[{"catchword":"Abraham","tekst":"Vergelijkende zijn vertrouwen vs.8, met deze uitkomst."},{"catchword":"HEERE","tekst":"Versta, dat de berg Moria den naam heeft van het antwoord, dat Abraham zijn zoon gaf, vs.8, gelijk ook het woord Moria schier hetzelfde betekent; dat is, het gezicht Gods."},{"catchword":"Op den","tekst":"Een spreekwoord, gebruikt van degenen, die in den uitersten nood zijnde, en geen menselijke uitkomst ziende, zich op de trouwe voorzienigheid Gods verlieten."}],"16":[{"catchword":"bij Mijzelven,","tekst":"Want Hij had geen meerderen, om bij te zweren; Heb 6:13. Zie ook Jer 22:5. Elders zweert God bij zijn groten naam, Jer 44:26; ook bij zijn ziel, Jer 51:14; en bij zijn heiligheid, Amo 4:2. Dat is, bij zichzelven. In het volgende: spreekt. Hebr. Neüm. Zie van dit woord Jer 23:31."},{"catchword":"daarom","tekst":"Versta hierdoor geen verdienende oorzaak der volgende belofte, die ook tevoren Abraham gedaan was, maar de vrucht of het einde der gehoorzaamheid Abrahams, die God uit genade met de vernieuwing zijner belofte, en met dezen zijn eed heeft willen vereren en belonen, tot meerdere versterking van het geloof Abrahams en zijner ganse kerk; zie hiervan Heb 6:13-14, Heb 6:17-18."}],"17":[{"catchword":"Voorzeker","tekst":"Hebr. zegenende zegenen, en vermenigvuldigende zal Ik vermenigvuldigen."},{"catchword":"aan den","tekst":"Hebr. aan de lip der zee; alzo onder, Gen 41:4; Jos 11:4, 1Sa 13:5."},{"catchword":"de poort","tekst":"Dat is, gebied, geweld, steden en landen, want bij de ouden is in de poort het gericht geweest, Deu 21:19; en Deu 22:15; Amo 5:12, Amo 5:15; Zec 8:16, idem, der steden sterkte. Zie Jdg 5:8; Psa 147:13; Isa 22:7; Eze 21:22. Hierom zijn ook poorten de steden zelf, Deu 22:15 en Deu 18:6, ja de steden van een geheel land, Jer 14:2. Dit is ten aanzien van het lichamelijke vervuld in Jozua, David, enz., maar voornamelijk en geestelijk in den Messias, Psa 2:8-9 en Psa 110:1-3; Col 2:15, die zijn kerk en dienstknechten ziujn overwinning deelachtig maakt; 1Co 15:57; 2Co 2:14 en 2Co 10:5-6."}],"18":[{"catchword":"in uw","tekst":"Dat is, in Christus, die uit uw zaad naar het vlees voortkomen zal. Zie boven Gen 12:3."},{"catchword":"zullen","tekst":"Zie Act 3:25; Gal 3:8, Gal 3:16."},{"catchword":"alle","tekst":"Niet alleen, die uit uw vlees zullen voortkomen, maar ook alle andere volken, die in uw zaad aan den Messias geloven zullen. Zie Gal 3:29."},{"catchword":"naardien","tekst":"Zie vs.16."}],"19":[{"catchword":"Ber-séba;","tekst":"Zie boven, Gen 21:31."}],"20":[{"catchword":"Milka","tekst":"die met Abraham uit Ur der Chaldeën niet was vertrokken naar het land Kanaän, maar had zich met ter woon begeven naar Mesopotamië. Zie boven, Gen 11:29, Gen 11:31, en Gen 24:10."}],"21":[{"catchword":"Uz,","tekst":"Deze Uz, de zoon van Nahor, is van twee anderen van denzelfden naam te onderscheiden: de ene is geweest de zoon van Aram, Sems zoon, boven Gen 10:23, de andere, de zoon van Dischan, de zoon van Seïr den Horiet, ond. Gen 36:28."},{"catchword":"Buz,","tekst":"Van dezen menen sommigen dat Elihu de Buziet afkomstig is van welken men zie Job 32:2."},{"catchword":"Aram","tekst":"Zie van een anderen Aram, bov. Gen 10:22. Men meent dat van beiden, of een hunner, het landschap Syrië Aram geheten wordt."}],"23":[{"catchword":"Rebekka","tekst":"Hebr. Ribka, die naderhand aan Izak vertrouwd is; ond. Gen 24"}],"24":[{"catchword":"bijwijf,","tekst":"Versta een zodanige vrouw, die wel tot voortteling van kinderen getrouwd werd, naar het misbruik van dien tijd, maar evenwel werd genomen zonder bruidschat en huwelijkscontract, staande onder de wettelijke en principale huisvrouw; gelijk ook haar kinderen geen erfgenamen waren, maar werden met giften of legaten uitgezet; bov. Gen 21:14-15, en Gen 25:6. Het Hebreeuwse woord betekent een gedeelde of halve vrouw."},{"catchword":"Máächa.","tekst":"Dit schijnt hier de naam van een man te zijn; alsook 2Sa 10:6, de naam van zekeren koning. Aldus was ook genoemd de moeder van den koning Asa, 1Ki 15:13."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"And it came to pass after these things [after that Abraham had received so many promises even of the birth of the Messiah himself wherefore none could be fulfilled if Isaac had died without issue the Lord was pleased to put Abraham to this trial as if he would have rescinded and mulled all the former promises at one blow ]that God tempted Abraham [ God is said to tempt his when he makes trial of their weakness or graces either to humble or exalt them by the manifestation of the same see Deu 8:2 and 13.3 Jud 2:22 2Ch 32:31 Psa 139:23,24 as for Abraham god knew him perfectly but intended to manifest his faith and the unfeignedness of his obedience in an extraordinary manner as for his own glories sake so both for Abrahams and the whole church of God their benefit and improvement see below verse 16,17] and he said unto him Abraham and he said here I am [Heb. Loe I viz. am here such a kind of answer which implieth a great deal of readiness and attentiveness in them that are called upon see below verse 7 and11 and chapter27.1 and 1Sa 3:4 ,6 &c.]"}],"2":[{"catchword":null,"tekst":"And he said take now thy son thy only snotty beloved Isaac[each word had been enough to pierce the fathers heart this and that which is rehearsed below verse 6.9,10 can in some sort represent unto us the great mystery of Gods grace a and salvation he having not spread his only begotten an dwell beloved son but delivered him up for all to bear our sins upon the true Rom 8:32 1Peter 2.4] and go thy way towards the land of Morija [ thus called after the common opinion from issue of this temptation see below verse 14 and the annotations this is the land wherein Jerusalem lay and the temple was built upon the hill of Morija 1Ch 22:1 2Ch 3:1 sidewards of mount Zion about three days journey fro Beersheba see below verse 4] and offer him there [ that is slay him first with thine own hand s and afterwards burn his head and body to ashes as the manner was to proceed with burning offerings Lev 6:9,10&c. this commandment was not to be construed or examined with natural sense and understanding but only through faith with gods promise and Abraham&acirc;&euro;&trade;s fatherly duty and affection to his only begotten son but of Gods hidden purpose and counsel in this command see the first verse of this chapter and below verse 12 ] for a burn sacrifice [ see the annotate above chapter 8 on verse 20 ] upon one of the hills which I shall tell thee."}],"3":[{"catchword":null,"tekst":"Then Abraham rose up early in the morning [ Abraham is instantly ready overcoming flesh and blood and firmly believing that notwithstanding all this God would perform his promises as being able to restore him Isaac even from the dead which also after a manner awes done as the apostle testifies Heb. 11.19] and saddled his ass and took two of his youths with him and Isaac his son and the cleft would be burnt offering [ Heb. Woods of the burnt offering ] or up made himself ready & went towards the place which God told him."}],"4":[{"catchword":null,"tekst":"On the third day [this great distance from the place of about three days journey served to further manifestation of Abraham singular steadfastness] then Abraham lifted up his eyes and saw the place afar off."}],"5":[{"catchword":null,"tekst":"And Abraham said to his youths stay ye here with the ass and I and the youth [this word is not only attributed to the little children but to young men likewise full grown as above you Abrahams armed trained men chapter 14 verse 14 and to the young men of sachem that abused Dina below chapter 34.19 and to Joseph when he called to interpret Pharaoh&acirc;&euro;&trade;s dream below chapter 41.12 to Joshua serving Mosheh Exo 33:11 to Absolom making war against his father 2samuel 18.9 adhere both to Isaac and Abrahams servant compare the next verse ] shall go on yonder when we shall have worshipped [ see below chapter 24.26] when we shall return unto ye [ though Abraham intended to offer up his son the special issue of this work was unknown to him he nevertheless believed that God was able to restore him his son again and thus without knowing what should be done he foretold what came to pass.]"}],"7":[{"catchword":null,"tekst":"Then spake Isaac to Abraham his father saying my father [ this sweet appellation of Isaac might well have been able according to the flesh to have hindered Abraham but through the spirit of LORD it riseth up in him so much that the more confidence of a good issue as appeareth by his answer ] and he said see here I am my son and he said Lo the fire and the wood but where is the lamb for the burnt offering?"}],"8":[{"catchword":null,"tekst":"And Abraham said God shall provide [Heb. See compare below verse 14] himself a lamb for burnt offering my son so they both went together."}],"9":[{"catchword":null,"tekst":"And they came to the place which God had told him and Abraham built there an altar and disposed the wood and bound his son Isaac [ even as the beast of the burnt offering were bound by their four legs so Abraham bound his four legs Isaacs hands and feet as some conceive the Hebrew word being used about sacrifices often signifying the same observe here the singular patience and obedience of Isaac being doubtless first exhorted and persuaded to it by his father ] and laid him upon the altar atop the wood."}],"10":[{"catchword":null,"tekst":"Then Abraham stretched forth his hand and took the knife for to slay his son [others to cut the throat of &c.]"}],"11":[{"catchword":null,"tekst":"But the angels of the Lord [understand the son of God as appears by the latter end of verse 12 and the whole series and drift of this story compare chapter 18 verse 1, 17, 22 and chapter 19 verse 18, 19, 21, 24] called unto him from heaven and said Abraham, Abraham [the is doubled thus the matter requiring haste and prompt attention Abraham even being ready to give the stroke and to dispatch the execution] and he said see here I am."}],"12":[{"catchword":null,"tekst":"Then said he do not stretch forth thy hand on the youth and do nothing to him [ by this command God reveals the secrets counsel and purpose in this temptation which in the former command verse 2 he had not done ] for now I know [said after the manner of men as verse 1 for Abraham was sufficiently known to God before but now he is said to take knowledge of it in regard that this temptation he made the same fully known to his whole church thus the Hebrew word is taken Psa 139:23 prove me and know my thoughts for before he had said verse 2 though understandeth my thought afar off ] thou hast fearing God and not withheld thy son thy only one from me [ Hence it is plain that it is God himself that speaketh here.]"}],"13":[{"catchword":null,"tekst":"Then Abraham lifted up his eyes and looked about and behold behind there was a ram [[it should seem that the angel called Abraham from behind so that he turning himself about to spy the ram withal instantly apprehending that he was to slay and offer the same there in his son instead] fast by his horns intricate thickets [viz. of some briar or thorn bush] and Abraham went and took that ram and offered to him for a burnt offering in his sons stead."}],"14":[{"catchword":null,"tekst":"And Abraham [comparing his on his confidence verse 8 with this issue] named the name of that place the LORD shall provide it [understand that the mountain of Morija itself doth signify almost the same thing that is the sight or vision of God] wherefore to this day it is said on the mountain of the LORD it shall be provided [a preverbal speech used by those who being in the exceeds extremity and seeing no human issue cast themselves altogether upon the faithful providence of God.]"}],"15":[{"catchword":null,"tekst":"Then the angel of the Lord called Abraham the second time from heaven."}],"16":[{"catchword":null,"tekst":"And said I swear by my self [ having none greater to swear by Heb. 6.13 see likewise Jer 2:5 elsewhere God swears by his great name Jer 44:26 or by his soul Jer 51:14 an day his holiness Amos 4.2 that is by himself ] speaketh the Lord [Heb. Neum of this word see jeremiah 23.31] therefore because thou hast done this thing and not withheld thy son thy only son [understand hereby no meriting cause of the ensuing promise which was already before made to Abraham but the fruit and the end of Abrahams obedience which God was pleased of hi // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers) => {

}

function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
