nd van de vreemdelingschap van zijn vader, in het land Kanaän.","2":"Dit zijn Jakobs geschiedenissen. Jozef, een zoon van zeventien jaren, weidde de kudde met zijn broeders (en hij was een jongeling), met de zonen van Bilha en de zonen van Zilpa, de vrouwen van zijn vader; en Jozef bracht hun kwaad gerucht over aan hun vader.","3":"En Israël had Jozef lief, boven al zijn zonen; want hij was hem een zoon van het ouderdom; en hij maakte hem een veelkleurige rok.","4":"Toen zijn broeders zagen dat hun vader hem boven al zijn broers liefhad, haatten zij hem, en konden hem niet vredelijk toespreken.","5":"Ook droomde Jozef een droom, die hij aan zijn broers vertelde; daarom haatten zij hem nog meer.","6":"En hij zei tegen hen: Hoor toch deze droom, die ik gedroomd heb.","7":"En zie, wij waren schoven aan het binden in het midden van het veld; en zie, mijn schoof stond op en bleef ook staande; en zie, uw schoven kwamen eromheen staan en bogen zich neer voor mijn schoof.","8":"Toen zeiden zijn broers tegen hem: Zult u dan werkelijk over ons regeren? Zult u dan werkelijk over ons heersen? Zo haatten zij hem nog meer, om zijn dromen en om zijn woorden.","9":"En hij droomde nog een andere droom en vertelde die aan zijn broers; en hij zei: Zie, ik heb nog een droom gedroomd, en zie, de zon, de maan en elf sterren bogen zich voor mij neer.","10":"En toen hij het aan zijn vader en aan zijn broers vertelde, bestrafte zijn vader hem en zei tegen hem: Wat is dit voor een droom die u gedroomd hebt? Zullen wij dan werkelijk komen, ik, en uw moeder, en uw broers, om ons voor u ter aarde te buigen?","11":"Zijn broers benijdden hem; maar zijn vader bewaarde deze zaak.","12":"En zijn broers gingen heen om de kudde van hun vader te weiden bij Sichem.","13":"Zo zei Israël tegen Jozef: Weiden uw broers niet bij Sichem? Kom, ik zal u naar hen toe zenden. En hij zei tegen hem: Zie, *hier* ben ik!","14":"En hij zei tegen hem: Ga toch heen, zie naar het welzijn van uw broers en naar het welzijn van de kudde, en breng mij een woord terug. Zo zond hij hem uit het dal Hebron, en hij kwam te Sichem.","15":"En een man vond hem (want zie, hij was aan het dwalen in het veld); zo vroeg deze man hem: Wat zoekt u?","16":"En hij zei: Ik zoek mijn broers; vertel mij toch waar zij weiden.","17":"Zo zei die man: Zij zijn hiervandaan vertrokken; want ik hoorde hen zeggen: Laten wij naar Dothan gaan. Jozef dan ging zijn broers achterna en vond hen te Dothan.","18":"En zij zagen hem van verre; en voordat hij bij hen kwam, smeedden zij een listig plan tegen hem, om hem te doden.","19":"En zij zeiden de een tegen de ander: Zie, daar komt die meesterdromer aan!","20":"Nu dan, komt, laten wij hem doodslaan en hem in een van deze kuilen werpen; en wij zullen zeggen: Een wild dier heeft hem opgegeten! Zo zullen wij zien wat er van zijn dromen worden zal.","21":"Ruben hoorde dat en verloste hem uit hun hand, en hij zei: Laten wij hem niet aan het leven slaan.","22":"Ook zei Ruben tegen hen: Vergiet geen bloed; werpt hem in deze kuil die in de woestijn is, en legt de hand niet aan hem; opdat hij hem uit hun hand zou verlossen, om hem tot zijn vader terug te brengen.","23":"En het gebeurde, toen Jozef bij zijn broers kwam, dat zij Jozef zijn rok uittrokken, de veelkleurige rok die hij aanhad.","24":"En zij namen hem en wierpen hem in de kuil; de kuil was echter leeg, er was geen water in.","25":"Daarna zaten zij neer om brood te eten, en zij hieven hun ogen op en zagen, en zie, een reisgezelschap van Ismaëlieten kwam uit Gilead; en hun kamelen droegen specerijen, balsem en mirre, op weg om dat naar Egypte te brengen.","26":"Toen zei Juda tegen zijn broers: Wat voor voordeel zal het zijn dat wij onze broer doodslaan en zijn bloed verbergen?","27":"Komt, laten wij hem aan deze Ismaëlieten verkopen, en onze hand zij niet aan hem; want hij is onze broer, ons vlees. En zijn broers stemden ermee in.","28":"Toen nu de Midianitische kooplieden voorbijtrokken, trokken en hesen zij Jozef op uit de kuil, en verkochten Jozef aan deze Ismaëlieten voor twintig zilverstukken; die brachten Jozef naar Egypte.","29":"Toen Ruben nu naar de kuil terugkeerde, zie, Jozef was niet meer in de kuil; toen scheurde hij zijn kleren.","30":"En hij keerde terug naar zijn broers en zei: De jongen is er niet; en ik, waar zal ik heengaan?","31":"Toen namen zij de rok van Jozef, en zij slachtten een geitenbok en doopten de rok in het bloed.","32":"En zij zonden de veelkleurige rok en lieten hem naar hun vader brengen, en zeiden: Dit hebben wij gevonden; herken toch of dit de rok van uw zoon is, of niet.","33":"En hij herkende hem en zei: Het is de rok van mijn zoon! Een wild dier heeft hem opgegeten! Jozef is voorzeker verscheurd!","34":"Toen scheurde Jakob zijn kleren en legde een zak om zijn heupen; en hij bedreef rouw over zijn zoon, vele dagen.","35":"En al zijn zonen en al zijn dochters maakten zich op om hem te troosten; maar hij weigerde zich te laten troosten en zei: Want ik zal, rouw bedrijvend, tot mijn zoon in het graf neerdalen. Zo beweende zijn vader hem.","36":"En de Midianieten verkochten hem in Egypte, aan Potifar, een hoveling van de farao, leider van de lijfwacht."},"SV":{"1":"En Jakob woonde in het land der vreemdelingschappen zijns vaders, in het land Kanaän.","2":"Dit zijn Jakobs geschiedenissen. Jozef, zijnde een zoon van zeventien jaren, weidde de kudde met zijn broeders (en hij was een jongeling), met de zonen van Bilha, en de zonen van Zilpa, zijns vaders vrouwen; en Jozef bracht hun kwaad gerucht tot hun vader.","3":"En Israël had Jozef lief, boven al zijn zonen; want hij was hem een zoon des ouderdoms; en hij maakte hem een veelvervigen rok.","4":"Als nu zijn broeders zagen, dat hun vader hem boven al zijn broederen liefhad, haatten zij hem, en konden hem niet vredelijk toespreken.","5":"Ook droomde Jozef een droom, dien hij aan zijn broederen vertelde; daarom haatten zij hem nog te meer.","6":"En hij zeide tot hen: Hoort toch dezen droom, dien ik gedroomd heb.","7":"En ziet, wij waren schoven bindende in het midden des velds; en ziet, mijn schoof stond op, en bleef ook staande; en ziet, uw schoven kwamen rondom, en bogen zich neder voor mijn schoof.","8":"Toen zeiden zijn broeders tot hem: Zult gij dan ganselijk over ons regeren: zult gij dan ganselijk over ons heersen? Zo haatten zij hem nog te meer, om zijn dromen en om zijn woorden.","9":"En hij droomde nog een anderen droom, en verhaalde dien aan zijn broederen; en hij zeide: Ziet, ik heb nog een droom gedroomd, en ziet, de zon, en de maan, en elf sterren bogen zich voor mij neder.","10":"En als hij het aan zijn vader en aan zijn broederen verhaalde, bestrafte hem zijn vader, en zeide tot hem: Wat is dit voor een droom, dien gij gedroomd hebt; zullen wij dan ganselijk komen, ik, en uw moeder, en uw broeders, om ons voor u ter aarde te buigen?","11":"Zijn broeders dan benijdden hem; doch zijn vader bewaarde deze zaak.","12":"En zijn broeders gingen heen, om de kudde van hun vader te weiden bij Sichem.","13":"Zo zeide Israël tot Jozef: Weiden uw broeders niet bij Sichem? Kom, dat ik u tot hen zende. En hij zeide tot hem: Zie, *hier* ben ik!","14":"En hij zeide tot hem: Ga toch heen, zie naar den welstand van uw broederen, en naar den welstand van de kudde, en breng mij een woord wederom. Zo zond hij hem uit het dal Hebron, en hij kwam te Sichem.","15":"En een man vond hem (want ziet, hij was dwalende in het veld); zo vraagde hem deze man, zeggende: Wat zoekt gij?","16":"En hij zeide: Ik zoek mijn broederen; geef mij toch te kennen, waar zij weiden.","17":"Zo zeide die man: Zij zijn van hier gereisd; want ik hoorde hen zeggen: Laat ons naar Dothan gaan. Jozef dan ging zijn broederen na, en vond hen te Dothan.","18":"En zij zagen hem van verre; en eer hij tot hen naderde, sloegen zij tegen hem een listigen raad, om hem te doden.","19":"En zij zeiden de een tot den ander: Ziet, daar komt die meesterdromer aan!","20":"Nu komt dan, en laat ons hem doodslaan, en hem in een dezer kuilen werpen; en wij zullen zeggen: een boos dier heeft hem opgegeten; zo zullen wij zien, wat van zijn dromen worden zal.","21":"Ruben hoorde dat, en verloste hem uit hun hand; en hij zeide: Laat ons hem niet aan het leven slaan.","22":"Ook zeide Ruben tot hen: Vergiet geen bloed; werpt hem in dezen kuil die in de woestijn is, en legt de hand niet aan hem; opdat hij hem uit hun hand verloste, om hem tot zijn vader weder te brengen.","23":"En het geschiedde, als Jozef tot zijn broederen kwam, zo togen zij Jozef zijn rok uit, den veelvervigen rok, dien hij aanhad.","24":"En zij namen hem, en wierpen hem in den kuil; doch de kuil was ledig; er was geen water in.","25":"Daarna zaten zij neder om brood te eten, en hieven hun ogen op, en zagen, en ziet, een reisgezelschap van Ismaëlieten kwam uit Gilead; en hun kemelen droegen specerijen en balsem, en mirre, reizende, om dat af te brengen naar Egypte.","26":"Toen zeide Juda tot zijn broederen: Wat gewin zal het zijn, dat wij onzen broeder doodslaan, en zijn bloed verbergen?","27":"Komt, en laat ons hem aan deze Ismaëlieten verkopen, en onze hand zij niet aan hem; want hij is onze broeder, ons vlees, en zijn broederen hoorden *hem*.","28":"Als nu de Midianietische kooplieden voorbijtogen, zo trokken en hieven zij Jozef op uit den kuil, en verkochten Jozef aan deze Ismaëlieten voor twintig zilverlingen; die brachten Jozef naar Egypte.","29":"Als nu Ruben tot den kuil wederkeerde, ziet, zo was Jozef niet in den kuil; toen scheurde hij zijn klederen.","30":"En hij keerde weder tot zijn broederen, en zeide: De jongeling is er niet; en ik, waar zal ik heengaan?","31":"Toen namen zij Jozefs rok, en zij slachtten een geitenbok, en zij doopten den rok in het bloed.","32":"En zij zonden den veelvervigen rok, en deden hem tot hun vader brengen, en zeiden: Dezen hebben wij gevonden; beken toch, of deze uws zoons rok zij, of niet.","33":"En hij bekende hem, en zeide: Het is mijns zoons rok! een boos dier heeft hem opgegeten! voorzeker is Jozef verscheurd!","34":"Toen scheurde Jakob zijn klederen, en legde een zak om zijn lenden; en hij bedreef rouw over zijn zoon vele dagen.","35":"En al zijn zonen, en al zijn dochteren maakten zich op, om hem te troosten; maar hij weigerde zich te laten troosten, en zeide: Want ik zal, rouw bedrijvende, tot mijn zoon in het graf nederdalen. Alzo beweende hem zijn vader.","36":"En de Midianieten verkochten hem in Egypte, aan Potifar, een hoveling van Farao, overste der trawanten."},"KJV":{"1":"And Jacob dwelt in the land wherein his father was a stranger, in the land of Canaan.","2":"These *are* the generations of Jacob. Joseph, *being* seventeen years old, was feeding the flock with his brethren; and the lad *was* with the sons of Bilhah, and with the sons of Zilpah, his father's wives: and Joseph brought unto his father their evil report.","3":"Now Israel loved Joseph more than all his children, because he *was* the son of his old age: and he made him a coat of *many* colours.","4":"And when his brethren saw that their father loved him more than all his brethren, they hated him, and could not speak peaceably","5":"And Joseph dreamed a dream, and he told *it* his brethren: and they hated him yet the more.","6":"And he said unto them, Hear, I pray you, this dream which I have dreamed:","7":"For, behold, we *were* binding sheaves in the field, and, lo, my sheaf arose, and also stood upright; and, behold, your sheaves stood round about, and made obeisance to my sheaf.","8":"And his brethren said to him, Shalt thou indeed reign over us? or shalt thou indeed have dominion over us? And they hated him yet the more for his dreams, and for his words.","9":"And he dreamed yet another dream, and told it his brethren, and said, Behold, I have dreamed a dream more; and, behold, the sun and the moon and the eleven stars made obeisance","10":"And he told *it* to his father, and to his brethren: and his father rebuked him, and said unto him, What *is* this dream that thou hast dreamed? Shall I and thy mother and thy brethren indeed come to bow down ourselves to thee to the earth?","11":"And his brethren envied him; but his father observed the saying.","12":"And his brethren went to feed their father's flock in Shechem.","13":"And Israel said unto Joseph, Do not thy brethren feed *the flock* in Shechem? come, and I will send thee unto them. And he said","14":"And he said to him, Go, I pray thee, see whether it be well with thy brethren, and well with the flocks; and bring me word again. So he sent him out of the vale of Hebron, and he came to Shechem.","15":"And a certain man found him, and, behold, *he was* wandering in the field: and the man asked him, saying, What seekest","16":"And he said, I seek my brethren: tell me, I pray thee, where they feed","17":"And the man said, They are departed hence; for I heard them say, Let us go to Dothan. And Joseph went after his brethren, and found them in Dothan.","18":"And when they saw him afar off, even before he came near unto them, they conspired against him to slay","19":"And they said one to another, Behold, this dreamer cometh.","20":"Come now therefore, and let us slay him, and cast him into some pit, and we will say, Some evil beast hath devoured him: and we shall see what will become of his dreams.","21":"And Reuben heard *it*, and he delivered him out of their hands; and said, Let us not kill","22":"And Reuben said unto them, Shed no blood, *but* cast him into this pit that *is* in the wilderness, and lay no hand upon him; that he might rid him out of their hands, to deliver him to his father again.","23":"And it came to pass, when Joseph was come unto his brethren, that they stript Joseph out of his coat, *his* coat of *many* colours","24":"And they took him, and cast him into a pit: and the pit *was* empty, *there was* no water","25":"And they sat down to eat bread: and they lifted up their eyes and looked, and, behold, a company of Ishmeelites came from Gilead with their camels bearing spicery and balm and myrrh, going to carry *it* down to Egypt.","26":"And Judah said unto his brethren, What profit *is it* if we slay our brother, and conceal his blood?","27":"Come, and let us sell him to the Ishmeelites, and let not our hand be upon him; for he *is* our brother *and* our flesh. And his brethren were content.","28":"Then there passed by Midianites merchantmen; and they drew and lifted up Joseph out of the pit, and sold Joseph to the Ishmeelites for twenty *pieces* of silver: and they brought Joseph into Egypt.","29":"And Reuben returned unto the pit; and, behold, Joseph *was* not in the pit; and he rent his clothes.","30":"And he returned unto his brethren, and said, The child *is* not; and I, whither shall I go?","31":"And they took Joseph's coat, and killed a kid of the goats, and dipped the coat in the blood;","32":"And they sent the coat of *many* colours, and they brought *it* to their father; and said, This have we found: know now whether it *be* thy son's coat","33":"And he knew it, and said, *It is* my son's coat; an evil beast hath devoured him; Joseph is without doubt rent in pieces.","34":"And Jacob rent his clothes, and put sackcloth upon his loins, and mourned for his son many days.","35":"And all his sons and all his daughters rose up to comfort him; but he refused to be comforted; and he said, For I will go down into the grave unto my son mourning. Thus his father wept","36":"And the Midianites sold him into Egypt unto Potiphar, an officer of Pharaoh's, *and* captain of the guard."}},"tsk":{"1":[{"kopje":"de vreemdelingschap van zijn vader","refs":["Gen 17:8","Gen 23:4","Gen 28:4","Gen 36:7","Hebr 11:9-16"]}],"2":[{"kopje":"geschiedenissen","refs":["Gen 2:4","Gen 5:1","Gen 6:9","Gen 10:1"]},{"kopje":"vrouwen","refs":["Gen 30:4","Gen 30:9","Gen 35:22","Gen 35:25","Gen 35:26"]},{"kopje":"kwaad gerucht","refs":["1 Sam 2:22-24","Joh 7:7","1 Kor 1:11","1 Kor 5:1","1 Kor 11:18"]}],"3":[{"kopje":"had lief","refs":["J </span> and the <span class=\"wl wl-kjv\" data-code=\"H5288\">lad</span> was with the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H1090\">Bilhah,</span> and with the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H2153\">Zilpah,</span> his <span class=\"wl wl-kjv\" data-code=\"H1\">father's</span> <span class=\"wl wl-kjv\" data-code=\"H802\">wives:</span> and <span class=\"wl wl-kjv\" data-code=\"H3130\">Joseph</span> <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> unto his <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> their <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> report.","3":"Now <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H157\">loved</span> <span class=\"wl wl-kjv\" data-code=\"H3130\">Joseph</span> more than all his <span class=\"wl wl-kjv\" data-code=\"H1121\">children,</span> because he was the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of his old <span class=\"wl wl-kjv\" data-code=\"H2208\">age:</span> and he <span class=\"wl wl-kjv\" data-code=\"H6213\">made</span> him a <span class=\"wl wl-kjv\" data-code=\"H3801\">coat</span> of many colours.","4":"And when his <span class=\"wl wl-kjv\" data-code=\"H251\">brethren</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> that their <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> <span class=\"wl wl-kjv\" data-code=\"H157\">loved</span> him more than all his <span class=\"wl wl-kjv\" data-code=\"H251\">brethren,</span> they <span class=\"wl wl-kjv\" data-code=\"H8130\">hated</span> him, and <span class=\"wl wl-kjv\" data-code=\"H3201\">could</span> not <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> peaceably","5":"And <span class=\"wl wl-kjv\" data-code=\"H3130\">Joseph</span> <span class=\"wl wl-kjv\" data-code=\"H2492\">dreamed</span> a <span class=\"wl wl-kjv\" data-code=\"H2472\">dream,</span> and he <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> it his <span class=\"wl wl-kjv\" data-code=\"H251\">brethren:</span> and they <span class=\"wl wl-kjv\" data-code=\"H8130\">hated</span> him yet the more.","6":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto them, <span class=\"wl wl-kjv\" data-code=\"H8085\">Hear,</span> I pray you, this <span class=\"wl wl-kjv\" data-code=\"H2472\">dream</span> which I have dreamed:","7":"For, behold, we were <span class=\"wl wl-kjv\" data-code=\"H481\">binding</span> <span class=\"wl wl-kjv\" data-code=\"H485\">sheaves</span> in the <span class=\"wl wl-kjv\" data-code=\"H7704\">field,</span> and, lo, my <span class=\"wl wl-kjv\" data-code=\"H485\">sheaf</span> <span class=\"wl wl-kjv\" data-code=\"H6965\">arose,</span> and also stood <span class=\"wl wl-kjv\" data-code=\"H5324\">upright;</span> and, behold, your <span class=\"wl wl-kjv\" data-code=\"H485\">sheaves</span> stood round <span class=\"wl wl-kjv\" data-code=\"H5437\">about,</span> and made <span class=\"wl wl-kjv\" data-code=\"H7812\">obeisance</span> to my sheaf.","8":"And his <span class=\"wl wl-kjv\" data-code=\"H251\">brethren</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to him, Shalt thou <span class=\"wl wl-kjv\" data-code=\"H4427\">indeed</span> <span class=\"wl wl-kjv\" data-code=\"H4427\">reign</span> over us? or shalt thou <span class=\"wl wl-kjv\" data-code=\"H4910\">indeed</span> have <span class=\"wl wl-kjv\" data-code=\"H4910\">dominion</span> over us? And they <span class=\"wl wl-kjv\" data-code=\"H8130\">hated</span> him yet the <span class=\"wl wl-kjv\" data-code=\"H3254\">more</span> for his <span class=\"wl wl-kjv\" data-code=\"H2472\">dreams,</span> and for his words.","9":"And he <span class=\"wl wl-kjv\" data-code=\"H2492\">dreamed</span> yet <span class=\"wl wl-kjv\" data-code=\"H312\">another</span> <span class=\"wl wl-kjv\" data-code=\"H2472\">dream,</span> and <span class=\"wl wl-kjv\" data-code=\"H5608\">told</span> it his <span class=\"wl wl-kjv\" data-code=\"H251\">brethren,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Behold, I have <span class=\"wl wl-kjv\" data-code=\"H2492\">dreamed</span> a <span class=\"wl wl-kjv\" data-code=\"H2472\">dream</span> more; and, behold, the <span class=\"wl wl-kjv\" data-code=\"H8121\">sun</span> and the <span class=\"wl wl-kjv\" data-code=\"H3394\">moon</span> and the <span class=\"wl wl-kjv\" data-code=\"H6240\">eleven</span> <span class=\"wl wl-kjv\" data-code=\"H3556\">stars</span> made obeisance","10":"And he <span class=\"wl wl-kjv\" data-code=\"H5608\">told</span> it to his <span class=\"wl wl-kjv\" data-code=\"H1\">father,</span> and to his <span class=\"wl wl-kjv\" data-code=\"H251\">brethren:</span> and his <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> <span class=\"wl wl-kjv\" data-code=\"H1605\">rebuked</span> him, and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, What is this <span class=\"wl wl-kjv\" data-code=\"H2472\">dream</span> that thou hast <span class=\"wl wl-kjv\" data-code=\"H2492\">dreamed?</span> Shall I and thy <span class=\"wl wl-kjv\" data-code=\"H517\">mother</span> and thy <span class=\"wl wl-kjv\" data-code=\"H251\">brethren</span> <span class=\"wl wl-kjv\" data-code=\"H935\">indeed</span> <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> to bow <span class=\"wl wl-kjv\" data-code=\"H7812\">down</span> ourselves to thee to the earth?","11":"And his <span class=\"wl wl-kjv\" data-code=\"H251\">brethren</span> <span class=\"wl wl-kjv\" data-code=\"H7065\">envied</span> him; but his <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> <span class=\"wl wl-kjv\" data-code=\"H8104\">observed</span> the saying.","12":"And his <span class=\"wl wl-kjv\" data-code=\"H251\">brethren</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> to <span class=\"wl wl-kjv\" data-code=\"H7462\">feed</span> their <span class=\"wl wl-kjv\" data-code=\"H1\">father's</span> <span class=\"wl wl-kjv\" data-code=\"H6629\">flock</span> in Shechem.","13":"And <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H3130\">Joseph,</span> Do not thy <span class=\"wl wl-kjv\" data-code=\"H251\">brethren</span> <span class=\"wl wl-kjv\" data-code=\"H7462\">feed</span> the flock in <span class=\"wl wl-kjv\" data-code=\"H7927\">Shechem?</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">come,</span> and I will send <span class=\"wl wl-kjv\" data-code=\"H7971\">thee</span> unto them. And he said","14":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to him, <span class=\"wl wl-kjv\" data-code=\"H3212\">Go,</span> I pray thee, <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> whether it be <span class=\"wl wl-kjv\" data-code=\"H7965\">well</span> with thy <span class=\"wl wl-kjv\" data-code=\"H251\">brethren,</span> and <span class=\"wl wl-kjv\" data-code=\"H7965\">well</span> with the <span class=\"wl wl-kjv\" data-code=\"H6629\">flocks;</span> and <span class=\"wl wl-kjv\" data-code=\"H7725\">bring</span> me <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">again.</span> So he <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> him out of the <span class=\"wl wl-kjv\" data-code=\"H6010\">vale</span> of <span class=\"wl wl-kjv\" data-code=\"H2275\">Hebron,</span> and he <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to Shechem.","15":"And a certain <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> found <span class=\"wl wl-kjv\" data-code=\"H4672\">him,</span> and, behold, he was <span class=\"wl wl-kjv\" data-code=\"H8582\">wandering</span> in the <span class=\"wl wl-kjv\" data-code=\"H7704\">field:</span> and the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> asked <span class=\"wl wl-kjv\" data-code=\"H7592\">him,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> What seekest","16":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> I <span class=\"wl wl-kjv\" data-code=\"H1245\">seek</span> my <span class=\"wl wl-kjv\" data-code=\"H251\">brethren:</span> <span class=\"wl wl-kjv\" data-code=\"H5046\">tell</span> me, I pray thee, <span class=\"wl wl-kjv\" data-code=\"H375\">where</span> they feed","17":"And the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> They are <span class=\"wl wl-kjv\" data-code=\"H5265\">departed</span> <span class=\"wl wl-kjv\" data-code=\"H2088\">hence;</span> for I <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> them <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> Let us <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> to <span class=\"wl wl-kjv\" data-code=\"H1886\">Dothan.</span> And <span class=\"wl wl-kjv\" data-code=\"H3130\">Joseph</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> his <span class=\"wl wl-kjv\" data-code=\"H251\">brethren,</span> and <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> them in Dothan.","18":"And when they <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> him afar <span class=\"wl wl-kjv\" data-code=\"H7350\">off,</span> even before he came <span class=\"wl wl-kjv\" data-code=\"H7126\">near</span> unto them, they <span class=\"wl wl-kjv\" data-code=\"H5230\">conspired</span> against him to slay","19":"And they <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> <span class=\"wl wl-kjv\" data-code=\"H376\">one</span> to <span class=\"wl wl-kjv\" data-code=\"H251\">another,</span> Behold, <span class=\"wl wl-kjv\" data-code=\"H1976\">this</span> <span class=\"wl wl-kjv\" data-code=\"H1167\">dreamer</span> cometh.","20":"<span class=\"wl wl-kjv\" data-code=\"H3212\">Come</span> now therefore, and let us <span class=\"wl wl-kjv\" data-code=\"H2026\">slay</span> him, and <span class=\"wl wl-kjv\" data-code=\"H7993\">cast</span> him into <span class=\"wl wl-kjv\" data-code=\"H259\">some</span> <span class=\"wl wl-kjv\" data-code=\"H953\">pit,</span> and we will <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> Some <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> <span class=\"wl wl-kjv\" data-code=\"H2416\">beast</span> hath <span class=\"wl wl-kjv\" data-code=\"H398\">devoured</span> him: and we shall <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> what will become of his dreams.","21":"And <span class=\"wl wl-kjv\" data-code=\"H7205\">Reuben</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> it, and he <span class=\"wl wl-kjv\" data-code=\"H5337\">delivered</span> him out of their <span class=\"wl wl-kjv\" data-code=\"H3027\">hands;</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Let us not <span class=\"wl wl-kjv\" data-code=\"H5221\">kill</span>","22":"And <span class=\"wl wl-kjv\" data-code=\"H7205\">Reuben</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto them, <span class=\"wl wl-kjv\" data-code=\"H8210\">Shed</span> no <span class=\"wl wl-kjv\" data-code=\"H1818\">blood,</span> but <span class=\"wl wl-kjv\" data-code=\"H7993\">cast</span> him into this <span class=\"wl wl-kjv\" data-code=\"H953\">pit</span> that is in the <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness,</span> and <span class=\"wl wl-kjv\" data-code=\"H7971\">lay</span> no <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> upon him; that he might <span class=\"wl wl-kjv\" data-code=\"H5337\">rid</span> him out of their <span class=\"wl wl-kjv\" data-code=\"H3027\">hands,</span> to <span class=\"wl wl-kjv\" data-code=\"H7725\">deliver</span> him to his <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> again.","23":"And it came to pass, when <span class=\"wl wl-kjv\" data-code=\"H3130\">Joseph</span> was <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> unto his <span class=\"wl wl-kjv\" data-code=\"H251\">brethren,</span> that they <span class=\"wl wl-kjv\" data-code=\"H6584\">stript</span> <span class=\"wl wl-kjv\" data-code=\"H3130\">Joseph</span> out <span class=\"wl wl-kjv\" data-code=\"H854\">of</span> his <span class=\"wl wl-kjv\" data-code=\"H3801\">coat,</span> his <span class=\"wl wl-kjv\" data-code=\"H3801\">coat</span> of many colours","24":"And they <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> him, and <span class=\"wl wl-kjv\" data-code=\"H7993\">cast</span> him into a <span class=\"wl wl-kjv\" data-code=\"H953\">pit:</span> and the <span class=\"wl wl-kjv\" data-code=\"H953\">pit</span> was <span class=\"wl wl-kjv\" data-code=\"H7386\">empty,</span> there was no water","25":"And they sat <span class=\"wl wl-kjv\" data-code=\"H3427\">down</span> to <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> <span class=\"wl wl-kjv\" data-code=\"H3899\">bread:</span> and they lifted <span class=\"wl wl-kjv\" data-code=\"H5375\">up</span> their <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes</span> and <span class=\"wl wl-kjv\" data-code=\"H7200\">looked,</span> and, behold, a <span class=\"wl wl-kjv\" data-code=\"H736\">company</span> of <span class=\"wl wl-kjv\" data-code=\"H3459\">Ishmeelites</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> from <span class=\"wl wl-kjv\" data-code=\"H1568\">Gilead</span> with their <span class=\"wl wl-kjv\" data-code=\"H1581\">camels</span> <span class=\"wl wl-kjv\" data-code=\"H5375\">bearing</span> <span class=\"wl wl-kjv\" data-code=\"H5219\">spicery</span> and <span class=\"wl wl-kjv\" data-code=\"H6875\">balm</span> and <span class=\"wl wl-kjv\" data-code=\"H3910\">myrrh,</span> <span class=\"wl wl-kjv\" data-code=\"H1980\">going</span> to carry it <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> to Egypt.","26":"And <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto his <span class=\"wl wl-kjv\" data-code=\"H251\">brethren,</span> What <span class=\"wl wl-kjv\" data-code=\"H1215\">profit</span> is it if we <span class=\"wl wl-kjv\" data-code=\"H2026\">slay</span> our <span class=\"wl wl-kjv\" data-code=\"H251\">brother,</span> and <span class=\"wl wl-kjv\" data-code=\"H3680\">conceal</span> his blood?","27":"<span class=\"wl wl-kjv\" data-code=\"H3212\">Come,</span> and let us <span class=\"wl wl-kjv\" data-code=\"H4376\">sell</span> him to the <span class=\"wl wl-kjv\" data-code=\"H3459\">Ishmeelites,</span> and let not our <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> be upon him; for he is our <span class=\"wl wl-kjv\" data-code=\"H251\">brother</span> and our <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh.</span> And his <span class=\"wl wl-kjv\" data-code=\"H251\">brethren</span> were content.","28":"Then there <span class=\"wl wl-kjv\" data-code=\"H5674\">passed</span> by <span class=\"wl wl-kjv\" data-code=\"H4084\">Midianites</span> <span class=\"wl wl-kjv\" data-code=\"H582\">merchantmen;</span> and they <span class=\"wl wl-kjv\" data-code=\"H4900\">drew</span> and lifted <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> <span class=\"wl wl-kjv\" data-code=\"H3130\">Joseph</span> out of the <span class=\"wl wl-kjv\" data-code=\"H953\">pit,</span> and <span class=\"wl wl-kjv\" data-code=\"H4376\">sold</span> <span class=\"wl wl-kjv\" data-code=\"H3130\">Joseph</span> to the <span class=\"wl wl-kjv\" data-code=\"H3459\">Ishmeelites</span> for <span class=\"wl wl-kjv\" data-code=\"H6242\">twenty</span> pieces of <span class=\"wl wl-kjv\" data-code=\"H3701\">silver:</span> and they <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> <span class=\"wl wl-kjv\" data-code=\"H3130\">Joseph</span> into Egypt.","29":"And <span class=\"wl wl-kjv\" data-code=\"H7205\">Reuben</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">returned</span> unto the <span class=\"wl wl-kjv\" data-code=\"H953\">pit;</span> and, behold, <span class=\"wl wl-kjv\" data-code=\"H3130\">Joseph</span> was not in the <span class=\"wl wl-kjv\" data-code=\"H953\">pit;</span> and he <span class=\"wl wl-kjv\" data-code=\"H7167\">rent</span> his clothes.","30":"And he <span class=\"wl wl-kjv\" data-code=\"H7725\">returned</span> unto his <span class=\"wl wl-kjv\" data-code=\"H251\">brethren,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> The <span class=\"wl wl-kjv\" data-code=\"H3206\">child</span> is not; and I, <span class=\"wl wl-kjv\" data-code=\"H575\">whither</span> shall I go?","31":"And they <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> <span class=\"wl wl-kjv\" data-code=\"H3130\">Joseph's</span> <span class=\"wl wl-kjv\" data-code=\"H3801\">coat,</span> and <span class=\"wl wl-kjv\" data-code=\"H7819\">killed</span> a <span class=\"wl wl-kjv\" data-code=\"H8163\">kid</span> of the <span class=\"wl wl-kjv\" data-code=\"H5795\">goats,</span> and <span class=\"wl wl-kjv\" data-code=\"H2881\">dipped</span> the <span class=\"wl wl-kjv\" data-code=\"H3801\">coat</span> in the blood;","32":"And they <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> the <span class=\"wl wl-kjv\" data-code=\"H3801\">coat</span> of many <span class=\"wl wl-kjv\" data-code=\"H6446\">colours,</span> and they <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> it to their <span class=\"wl wl-kjv\" data-code=\"H1\">father;</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> This have we <span class=\"wl wl-kjv\" data-code=\"H4672\">found:</span> <span class=\"wl wl-kjv\" data-code=\"H5234\">know</span> now whether it be thy <span class=\"wl wl-kjv\" data-code=\"H1121\">son's</span> coat","33":"And he knew <span class=\"wl wl-kjv\" data-code=\"H5234\">it,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> It is my <span class=\"wl wl-kjv\" data-code=\"H1121\">son's</span> <span class=\"wl wl-kjv\" data-code=\"H3801\">coat;</span> an <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> <span class=\"wl wl-kjv\" data-code=\"H2416\">beast</span> hath <span class=\"wl wl-kjv\" data-code=\"H398\">devoured</span> him; <span class=\"wl wl-kjv\" data-code=\"H3130\">Joseph</span> is without <span class=\"wl wl-kjv\" data-code=\"H2963\">doubt</span> rent in pieces.","34":"And <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> <span class=\"wl wl-kjv\" data-code=\"H7167\">rent</span> his <span class=\"wl wl-kjv\" data-code=\"H8071\">clothes,</span> and <span class=\"wl wl-kjv\" data-code=\"H7760\">put</span> <span class=\"wl wl-kjv\" data-code=\"H8242\">sackcloth</span> upon his <span class=\"wl wl-kjv\" data-code=\"H4975\">loins,</span> and <span class=\"wl wl-kjv\" data-code=\"H56\">mourned</span> for his <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> <span class=\"wl wl-kjv\" data-code=\"H7227\">many</span> days.","35":"And all his <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> and all his <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters</span> rose <span class=\"wl wl-kjv\" data-code=\"H6965\">up</span> to <span class=\"wl wl-kjv\" data-code=\"H5162\">comfort</span> him; but he <span class=\"wl wl-kjv\" data-code=\"H3985\">refused</span> to be <span class=\"wl wl-kjv\" data-code=\"H5162\">comforted;</span> and he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> For I will go <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> into the <span class=\"wl wl-kjv\" data-code=\"H7585\">grave</span> unto my <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> <span class=\"wl wl-kjv\" data-code=\"H57\">mourning.</span> Thus his <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> wept","36":"And the <span class=\"wl wl-kjv\" data-code=\"H4092\">Midianites</span> <span class=\"wl wl-kjv\" data-code=\"H4376\">sold</span> him into <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt</span> unto <span class=\"wl wl-kjv\" data-code=\"H6318\">Potiphar,</span> an <span class=\"wl wl-kjv\" data-code=\"H5631\">officer</span> of <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh's,</span> and <span class=\"wl wl-kjv\" data-code=\"H8269\">captain</span> of the guard."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"der","tekst":"Zie boven, Gen 17:8."}],"2":[{"catchword":"geschiedenissen","tekst":"Hebr. geboorten; dat is, hetgeen Jakob in zijn geslacht en nakomelingen wedervaren is. Zo wordt het Hebreeuwse woord somtijds genomen. Zie boven, Gen 6:8."},{"catchword":"kwaad gerucht","tekst":"Dat is, wat zij kwaads mochten zeggen, of bedrijven, strekkende tot ontering van henzelven en het ganse huis."}],"3":[{"catchword":"des ouderdoms;","tekst":"Omdat hij hem omtrent een en negentig jaren oud zijnde gewonnen had, alsook omdat hij de eerstgeborene uit Rachel was, dien zij na lange en verdrietige onvruchtbaarheid Jakob gebaard had; verg. onder, Gen 44:20."},{"catchword":"veelvervigen","tekst":"Hebr. van verscheidene stukken, te weten, die van onderscheiden kleuren waren; verg. 2Sa 13:18."}],"4":[{"catchword":"vredelijk","tekst":"Hebr. tot, of ten vrede; dat is, wat uit een zachtmoedig en vreedzaam hart voortgaande tot onderhouding van liefde en vrede diende."}],"5":[{"catchword":"haatten","tekst":"Hebr. zij deden, of voegden toe, of, voeren voort hem nog, of, te meer te haten; alzo onder, vs.8; zij namen drie oorzaken om hem te haten. Eerst, omdat hij hun kwaad gerucht tot Jakob bracht, vs.2. Ten tweede, omdat de vader hem liever had dan zijn broeders, vs.4. Ten derde, om zijn dromen, die hij hun vertelde, hier vs.6, enz."}],"7":[{"catchword":"en ziet,","tekst":"God heeft door dezen en den volgenden droom willen openbaren wat namaals geschieden zou, om te weten dat het niet bij toeval, maar door zijn regering geschiedde."},{"catchword":"bleef ook","tekst":"Anders, stond ook overeind."},{"catchword":"en ziet,","tekst":"Dit woordje ziet, gebruikt Jozef hier tot driemalen toe, daarmede tonende, dat deze droom hem zeer zeldzaam voorkwam, en zeer bewoog. Zie de vervulling daarvan onder, Gen 42:6."}],"8":[{"catchword":"Zult gij dan ganselijk over ons regeren","tekst":"Of, zekerlijk. Hebr. zult, of, zoudt gij regerende regeren? en zo in het vervolg, heersende heersen, Jozefs broeders dulden dezen droom op zichzelven gelijk de Midianieten, Jdg 7:13."}],"9":[{"catchword":"droom gedroomd,","tekst":"Zie de vervulling hiervan, onder, Gen 46:29, enz."}],"10":[{"catchword":"bestrafte","tekst":"Meer om zijn andere zonen wat te verzachten, dan dat hij inderdaad op Jozef zou vergramd zijn; want hij bemerkte wel dat deze droom wat bijzonders, gelijk blijkt uit het volgende vs., in had."},{"catchword":"moeder, en","tekst":"Versta, zijn stiefmoeder Lea of Bilha, Rachels dienstmaagd. Wil men het nemen van Rachel, zijn eigen moeder, die overleden was, het zal dan zijn, alsof Jakob zeide: zal uw moeder uit de doden opstaan, en zich voor u ter aarde buigen?"}],"11":[{"catchword":"deze zaak","tekst":"Anders, dit woord; dat is, deze woorden. De zin is dat hij Jozefs dromen overlegde en in zijn hart opsloot, oordelende dat zij wat beduiden, en verwachtende wat met den tijd daarvan geworden zou; verg. Luk 2:19."}],"12":[{"catchword":"Sichem","tekst":"Zie boven, Gen 12:6. Omtrent deze plaats had Jakob tevoren een stuk land gekocht; boven, Gen 33:19."}],"13":[{"catchword":"Zie, hier","tekst":"Zie boven, Gen 22:1, en de aanteek."}],"14":[{"catchword":"welstand","tekst":"Hebr. vrede. Dit woord betekent allerlei welvaart der mensen, niet alleen in het algemeen, Lev 26:6; 1Ki 2:33; Psa 125:5; Jer 29:7, maar ook in het bijzonder, ten aanzien van hun lichamelijke gezondheid en sterkte, 2Sa 18:32; Psa 38:4, en hier; idem vanhun ziel, Num 6:26; Isa 48:22; Luk 2:14; Joh 14:27, mitsgaders van al hun goederen, roerende en onroerende; 1Sa 25:6; Job 5:24 en hier in de volgende woorden."},{"catchword":"breng mij","tekst":"Of, breng mij de zaak weder over, dat is, breng mij van alles bescheid."},{"catchword":"Hebron,","tekst":"Zie boven, Gen 23:2."}],"17":[{"catchword":"Dothan gaan","tekst":"Een plaats, gelegen niet ver van Sichem en Samaria, waar met den tijd een stad gebouwd is, hebbende denzelfden naam, 2Ki 6:13."}],"18":[{"catchword":"sloegen zij","tekst":"Het Hebreeuwse woord betekent, enig kwaad tegen iemand arglistiglijk uit te vinden, of practiseren."},{"catchword":"te doden","tekst":"Een bedroevend en deerlijk schandaal in Israels huis; hoewel God, die uit de duisternis het licht trekt, het wonderlijk heeft geregeerd tot zijn eer en de voltrekking van zijn raad over Jakobs huisgezin; gelijk dit blijkt uit het volgende."}],"19":[{"catchword":"de een tot","tekst":"Hebr. de man tot zijn broeder."},{"catchword":"meesterdromer","tekst":"Of, opperdromer. Hebr. meester der dromen. Zie boven, Gen 14:13."}],"20":[{"catchword":"zullen zeggen","tekst":"Te weten, tot onzen vader en anderen. Aldus zoeken zij die schandelijke daad met een leugen te verbergen."},{"catchword":"wat van zijn","tekst":"Hebr. wat zijn dromen zijn zullen."}],"21":[{"catchword":"Ruben hoorde","tekst":"Of, toen Ruben dat gehoord had, en zo vervolgens. Het schijnt dat Ruben, bemerkende dat zijn broeders Jozef wilden doden, deze manier in het voorafgaande vs. voorgeslagen, liever heeft willen toestaan, omdat hij voornemens was hem naderhand uit den kuil te verlossen, zoals in het volgende vs. verhaald is."},{"catchword":"en verloste","tekst":"Dat is, hij zocht hem te verlossen."},{"catchword":"leven slaan","tekst":"Hebr. ziel; dat is leven. Hij wil zeggen, laat ons hem het leven met onze eigen handen niet benemen. Het woord ziel wordt aldus elders ook gebruikt. Zie boven, Gen 19:17."}],"22":[{"catchword":"en legt","tekst":"Dat is, doodt hem niet met eigen hand; zie dergelijke manier van spreken, boven, Gen 22:12, alwaar de hand aan iemand te leggen, is hem te doden met zijn hand, gelijk Abraham voorhad met zijn zoon te doen. Dezelfde uitdrukking vindt men onder, vs.27, onze hand zij niet aan hem."}],"23":[{"catchword":"den veelvervigen","tekst":"Zie boven, vs.3; waarom zij dit gedaan hebben, zie onder, vs.31."}],"24":[{"catchword":"En zij namen","tekst":"Hoe zich Jozef in deze gelegenheid gedragen heeft, zieonder, Gen 42:21."}],"25":[{"catchword":"om brood","tekst":"Dat is, om hun maal te houden; zie boven, Gen 31:54."},{"catchword":"Ismaëlieten","tekst":"Een volk, afkomstig van Ismael, den zoon van Abraham uit Hagar; van welks land men zien mag, boven, Gen 25:18. Beneden worden ook genoemd Midianieten en Medanieten, vs.28, 36, waaruit blijkt dat het een gezelschap geweest is van onderscheiden natiën, woonachtig in Arabië."},{"catchword":"Gilead;","tekst":"Zie boven, Gen 31:21."},{"catchword":"specerijen","tekst":"Het Hebreeuwse woord betekent in het algemeen allerlei soort van specerij."},{"catchword":"balsem,","tekst":"Anders, hars, terpentijn."},{"catchword":"mirre,","tekst":"Anders, mastik, of balsem; zie van deze specerij ook onder, Gen 43:11."},{"catchword":"Egypte","tekst":"Zie boven, Gen 12:10."}],"26":[{"catchword":"bloed verbergen?","tekst":"Dat is, zijn dood of moord. Aldus is het woord bloed genomen Deu 17:8; 2Sa 1:16, en 2Sa 3:28."}],"27":[{"catchword":"onze hand","tekst":"Zie boven, vs.22."}],"28":[{"catchword":"Midianietische","tekst":"Een volk, afkomstig uit Midian, den zoon van Abraham uit Ketura; zie boven, Gen 25:2, en Gen 36:35."},{"catchword":"twintig zilverlingen;","tekst":"Hebr. twintig zilvers; dat is, omtrent vijf rijksdaalders (f 12,50); zie boven, Gen 20:16, en Gen 23:15."}],"29":[{"catchword":"Als nu Ruben","tekst":"Want hij had zich van zijn broeders verstoken, om Jozef daarna heimelijk uit den kuil te trekken; maar middelerwijl werd hij verkocht."},{"catchword":"scheurde hij","tekst":"Dit was een gebruik bij de ouden, wanneer hun iets zwaars en bedroevends voorkwam of wedervoer; zieonder, vs.34; Num 14:6; 2Ki 19:1; Ezr 9:3; Job 1:20, en Job 2:12; Mat 26:65."}],"30":[{"catchword":"De jongeling","tekst":"Jozef was omtrent dezen tijd zeventien jaren oud; zie boven, vs.2."},{"catchword":"waar zal ik","tekst":"Ruben is zeer ontsteld, uit vrees voor zijn vader, diehem als den oudste, zonder twijfel, rekenschap zou afeischen over het verlies van Jozef, en dit hem te meer kwalijk afnemen omdat hij zich onlangs zeer vergrepen en zijn vader grotelijks vertoornd had; boven, Gen 35:22."}],"31":[{"catchword":"en zij doopten","tekst":"Niet twijfelende, of de vader zou daaruit oordelen dat Jozef door een wild dier verscheurd was, gelijk hij ook geoordeeld heeft; onder, vs.33."}],"33":[{"catchword":"voorzeker is","tekst":"Hebr. is verscheurende verscheurd; dat is, gewisselijk en buiten allen twijfel, of, gans en ten enenmale verscheurd; zie boven, Gen 2:16-17."}],"34":[{"catchword":"scheurde","tekst":"Zie boven, vs.29."},{"catchword":"zak om","tekst":"Dat is, een zeer grof, slecht en onkostbaar kleed, [wel niet juist als een rechte zak], waarmede de ouden zich plachten te bewinden, als met een zak, tot bewijs van groten rouw en droefheid. Zie 2Sa 3:31; 1Ki 20:32, en 1Ki 21:27; Psa 35:13; Lam 2:10; Mat 11:21."},{"catchword":"bedreef rouw","tekst":"Of, droeg; alzo 1Sa 15:35, en 2Sa 13:37."},{"catchword":"vele dagen","tekst":"Dat is, langen tijd, meer dan men gewoon was te doen."}],"35":[{"catchword":"zijn dochteren","tekst":"Zijn dochter Dina, zijn aangehuwde dochters en de dochters van zijn zonen."},{"catchword":"maar hij","tekst":"Niet dat Jakob geen geestelijken troost zou gehad of toegelaten hebben, maar dat hij uit menselijke zwakheid en de grootheid van zijn liefde tot Jozef, zijn rouw niet zo kon afleggen en matigen, of hij zou daarvan enig overblijfsel zijn levenlang behouden."},{"catchword":"tot mijn zoon","tekst":"Anders, om mijns zoons wil; verg. 1Sa 4:19, 1Sa 4:21; 2Sa 21:1."},{"catchword":"graf nederdalen","tekst":"Het Hebr. woord betekent somtijds het graf gelijk hier en onder, Gen 42:38, en Gen 44:29, Gen 44:31; Psa 6:6, en Psa 16:10; Ecc 9:10; Isa 38:18; idem allerlei grote diepten, of diepe, verborgen plaatsen; Job 26:6; Psa 139:8; Amo 9:2; somtijds de hel, of plaats der verdoemden, gelijk Job 11:8; Pro 15:11. Aldus kan het hier niet genomen worden; want Jakob geloofde het tegendeel van zijn zoon. Somtijds betekent het ook overgrote en uiterste benauwdheden, en het gevoel van Gods toorn, gelijk 1Sa 2:6; Psa 18:6, en Psa 86:13."}],"36":[{"catchword":"Medanieten","tekst":"Zie boven Gen 25:2."},{"catchword":"hoveling","tekst":"Het Hebr. woord betekent eigenlijk een gesneden man, gelijk Isa 56:3-4; en daarom ook een kamerling, omdat de kamerlingen der grote vrouwen gesneden waren, Est 4:4; voorts betekent het ook hovelingen of officieren in herenhoven, gelijk hier en onder, Gen 40:2, en 2Ki 8:6."},{"catchword":"der trawanten","tekst":"Die gesteld waren om de misdadigers op des konings bevel te straffen. Zie onder, Gen 40:3; 1Sa 22:17; Mar 6:27. Het Hebreeuwse woord betekent slachters van beesten en mensen."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"And Jacob dwelt in the land of stranger ship of his father [see above chapter 17 on verse 8] in the land of Canaan."}],"2":[{"catchword":null,"tekst":"These are Jacobs acts or occurrences [Heb. Births that is here that which happened unto Jacob in his generation and posterity thus the Hebrew word is taken sometimes see above chapter 6 on verse 9] Joseph being a son of seventeen years fed his flock with his brethren and he was a youth with the sons of Bilha and the sons of Zilpha his fathers wife and Joseh brought their bad report to their father [that is all such things as they either said or did tending to discredit and dispute of themselves and whole family.]"}],"3":[{"catchword":null,"tekst":"And Israel loved Joseph above all his sons for he was to him a son of old age [whom he had gotten being about ninety one years of age [whom he had gotten being about ninety one years of age as also because he was the first born of Rachel of whom he was born after a long tedious time of barrenness compare below 44 verse 20] and he made him a coat off many colors [Heb. Of various pieces being of divers colors compare 2Sa 13:18.]"}],"4":[{"catchword":null,"tekst":"Now when his brethren saw that their father loved him above all his brethren they hated him and could not speak peaceable with him [Heb. To peace or for peace that is they could find that meekness in their heart which is requisite for the maintaining of peace and love.]"}],"5":[{"catchword":null,"tekst":"Likewise Joseph dreamnt a dream which he told his brethren wherefore they hated the more [Heb. They did or added or continued him yet or the more to hate so below verse 8they hated him for three reasons 1. For bringing their bad report to their father Jacob. Verse 2. 2. For being better beloved by his father Jacob then the rest of his brethren verse 4. 3.For his dream sake which he told them.]"}],"6":[{"catchword":null,"tekst":"And he said unto them hear this dream I pray which I dreamnt."}],"7":[{"catchword":null,"tekst":"And behold we were binding of sheaves in the middle of the fields and behold my sheaf stood up [God was pleased to declare this and the following dream what should come to pass afterwards for to shew and make known that those things did not happen by chance but his own direction and appointment] and remained likewise standing [Heb. Stood likewise also erect] and behold this [ this word behold is thrice repeated here by Joseph to shew that this dream was really strange to him and have left a singular impression upon him see the fulfilling thereof below chapter 42.6 ] your sheaves came around about and bowed themselves even before my sheaf."}],"8":[{"catchword":null,"tekst":"Then said hios brethren to him shalt thou then be wholly [or assuredly] rule over us [ Heb. Shalt should dest thou ruling rule and so in the sequel lording lord Josephs brethren interpretes this dream upon themselves much like unto the Medianites Jud 7:13.] shalt thou then wholly lord over us? So they hated him yet the more for his dream and his words sake."}],"9":[{"catchword":null,"tekst":"And he dreamnt yet another dream and related it to his brethren and he said behold I have dreamnt another drem yet and behold the sun and the moon and the eleven stars bowed down before me. [See the fulfilling thereof below chapter 45.9&c.]"}],"10":[{"catchword":null,"tekst":"And when he related it to his father and his brethren and his father rebuked him [more to allay his brethren envy then for any anger towards Joseph for he observed enough that this dream signified some extraordinary matter as appears by the next verse ] and said to him what a dream is this that thou dreamiest ? shall we then wholly come I and thy mother [understand his step-mother Leah and Bilha Rachels hand-maid if we shall take it for his own mother who was dead already then Jacobs meaning must be as if he said shall thy mother rise out of the grave to bow herself down before thee on the ground?] and thy brethren for to bow ourselves down to the ground before thee.?"}],"11":[{"catchword":null,"tekst":"Then his brothers envied him and his father kept or observed this thing [others this word that is these words or this relation the meaning is weighed the dreams of Joseph and looked them up in his heart judging that they must needs betoken something and waited observing what it would produce and prove in time compare Luk 2:19.]"}],"12":[{"catchword":null,"tekst":"And his brethren went to feed their fathers flock by Schichem [see above chapter 12 on verse 6 about this place Jacob had formerly bought a piece of ground above chapter 33.19.]"}],"13":[{"catchword":null,"tekst":"Then Israel said to Joseph do not thy brethren feed the flock by Sichem? Feed the flock [the Hebrew had but one word signifying pascere Annon pascunt fraters tui &c. implying the keeping and keeping of the sheep] come let me send // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)

  const u = refUrl(ref);

}

function plaatsPopup(el, html) {

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;

function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;

    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });

const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}

  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  // slug -> volledige boeknaam (voor citaten met de volle boeknaam i.p.v. de afkorting)
  const boeknaamPerSlug = {};
  (D.meta.boeken || []).forEach(b => {
    const m = b.href.match(/^\.\.\/\.\.\/([^/]+)\//);
    if (m) boeknaamPerSlug[m[1]] = b.naam;
  });
  // dubbele rechtsklik (binnen 500ms, zelfde verwijzing) kopieert het vers
  // i.p.v. de vertalingen-popup te tonen (enkele rechtsklik blijft bestaand gedrag)
  function kopieerVerwijzing(chip, ref) {
    haalVert('versteksten', ref).then(data => {
      const tekst = data && data[ref.vers];
      if (!tekst) return;
      const url = location.origin + '/studiebijbel/' + ref.slug + '/' + ref.hfd + '#v' + ref.vers;
      const naam = boeknaamPerSlug[ref.slug] || chip.textContent.replace(/\s+\d+:\d+.*$/, '');
      const kopie = tekst.replace(/\*/g, '') + `\n~ [${naam} ${ref.hfd}:${ref.vers}](${url})`;
      navigator.clipboard.writeText(kopie).then(() => {
        toast.classList.add('zichtbaar');
        setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
      });
    });
  }
  let laatsteRechtsklik = { sleutel: null, tijd: 0 };
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    const sleutel = chip.dataset.ref;
    const nu = Date.now();
    const isDubbelklik = laatsteRechtsklik.sleutel === sleutel && (nu - laatsteRechtsklik.tijd) < 500;
    laatsteRechtsklik = isDubbelklik ? { sleutel: null, tijd: 0 } : { sleutel, tijd: nu };
    if (isDubbelklik) {
      popup.style.display = 'none';
      vpopup.style.display = 'none';
      kopieerVerwijzing(chip, ref);
      return;
    }
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
