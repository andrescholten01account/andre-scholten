eken dan naar elkaar, en twijfelden van wie Hij dat zei.", "Gen 27:1": "En het gebeurde, toen Izak oud geworden was, en zijn ogen donker waren geworden, zodat hij niet meer kon zien; toen riep hij Ezau, zijn oudste zoon, en zei tegen hem: Mijn zoon! En hij zei tegen hem: Zie, hier ben ik!", "Hoogl 3:6": "Wie is zij, die daar opkomt uit de woestijn, als rookpilaren, berookt met mirre en wierook, en met allerlei poeder van de kruidenier?", "Ezech 38:13": "Scheba, en Dedan, en de kooplieden van Tarsis, en al hun jonge leeuwen zullen tegen u zeggen: Komt u, om buit te buiten? Hebt u uw verzameling verzameld, om roof te roven? Om zilver en goud weg te voeren, om vee en have weg te nemen, om een grote buit te buiten?", "Gen 23:13": "En hij sprak tot Efron, ten aanhoren van het volk van het land, en zei: Trouwens, als u het toch wilt geven, hoor mij dan alstublieft; ik zal het geld van de akker geven; neem het van mij aan, dan zal ik mijn dode daar begraven.", "Joh 11:53": "Vanaf die dag dan beraadslaagden zij samen om Hem te doden.", "Gen 4:5": "maar Kaïn en zijn offer zag Hij niet met welgevallen aan. Toen ontstak Kaïn zeer, en zijn gezicht betrok.", "Joh 18:7": "Hij vroeg hun dan opnieuw: Wie zoekt u? En zij zeiden: Jezus de Nazarener.", "Zach 9:11": "U ook aangaande, o Sion! Door het bloed van het verbond met u, heb Ik uw gebondenen uit de kuil, waar geen water in is, uitgelaten.", "Gen 37:29-35": "Toen Ruben nu naar de kuil terugkeerde, zie, Jozef was niet meer in de kuil; toen scheurde hij zijn kleren. En hij keerde terug naar zijn broers en zei: De jongen is er niet; en ik, waar zal ik heengaan? Toen namen zij de rok van Jozef, en zij slachtten een geitenbok en doopten de rok in het bloed.", "Gen 41:1": "En het gebeurde na verloop van twee volle jaren, dat Farao droomde, en zie, hij stond aan de rivier.", "Gen 37:18-28": "En zij zagen hem van verre; en voordat hij bij hen kwam, smeedden zij een listig plan tegen hem, om hem te doden. En zij zeiden de een tegen de ander: Zie, daar komt die meesterdromer aan! Nu dan, komt, laten wij hem doodslaan en hem in een van deze kuilen werpen; en wij zullen zeggen: Een wild dier heeft hem opgegeten! Zo zullen wij zien wat er van zijn dromen worden zal.", "Jes 21:13": "De last tegen Arabië. In het woud van Arabië zult u overnachten, o reizende karavanen van Dedanieten!", "Gen 42:9": "Toen dacht Jozef aan de dromen die hij over hen gedroomd had; en hij zei tegen hen: U bent verspieders, u bent gekomen om te bekijken waar het land onbeschermd is.", "Hoogl 1:7": "Zeg mij aan, U, Die mijn ziel liefheeft, waar U weidt, waar U de kudde legert in de middag; want waarom zou ik zijn als iemand die zich afwendt bij de kudden van uw metgezellen?", "Joh 3:12": "Als Ik u de aardse dingen gezegd heb en u gelooft niet, hoe zult u geloven als Ik u de hemelse dingen zou zeggen?", "Ex 21:35": "Wanneer nu iemands os de os van zijn naaste zo kwetst, dat hij sterft, dan zal men de levende os verkopen en het geld daarvan gelijk delen, en het dode dier zal men ook gelijk delen.", "Hand 7:9": "En de aartsvaders, jaloers geworden, verkochten Jozef om naar Egypte gebracht te worden; maar God was met hem,", "Ps 64:6": "Zij sterken zichzelf in een boze zaak; zij overleggen om strikken te verbergen; zij zeggen: Wie zal ze zien?", "1 Sam 19:1": "Daarom sprak Saul tot zijn zoon Jonathan en tot al zijn knechten, om David te doden. Doch Jonathan, Sauls zoon, had groot welgevallen aan David.", "Jer 31:15": "Zo zegt de HEERE: Er is een stem gehoord in Rama, een geklaag, een zeer bitter geween; Rachel weent over haar kinderen; zij weigert zich te laten troosten over haar kinderen, omdat zij er niet meer zijn.", "Jer 32:25": "Evenwel hebt U tegen mij gezegd, Heere HEERE: koop voor uzelf dat veld voor geld, en laat het door getuigen bevestigen; terwijl de stad in de hand van de Chaldeeën gegeven is.", "2 Kon 11:14": "En zij zag toe, en zie, de koning stond bij de pilaar, naar de gewoonte, en de leiders en de trompetten bij de koning; en al het volk van het land was blij en blies op trompetten. Toen scheurde Athalia haar kleren en riep: Verraad, verraad!", "Est 4:7": "gaf Mordechai hem te kennen alles wat hem overkomen was, en de opgave van het zilver dat Haman gezegd had te zullen wegen in de schatten van de koning, voor de Joden, om hen om te brengen.", "Jes 30:6": "De last van de dieren, van het zuiden, naar het land van angst en van benauwdheid, waar de sterke leeuw en de oude leeuw is, de basilisk en de vurige vliegende draak; hun goederen zullen zij voeren op de rug van de veulens, en hun schatten op de bulten van de kamelen, naar het volk dat hun geen nut zal doen.", "Gen 17:12": "Een zoontje van acht dagen zal bij u besneden worden, alles wat mannelijk is in uw geslachten: degene die in het huis geboren is, en degene die met geld gekocht is van elke vreemdeling die niet van uw nageslacht is;", "1 Kon 1:16": "En Bathseba boog haar hoofd en boog zich neer voor de koning; en de koning zei: Wat wilt u?", "Gen 17:8": "En Ik zal u en uw nageslacht na u het land waar u als vreemdeling verblijft geven, het hele land Kanaän, tot eeuwig eigendom; en Ik zal hun tot een God zijn.", "Deut 14:26": "En geef dat geld voor alles wat uw ziel verlangt, voor runderen en voor schapen, en voor wijn, en voor sterke drank, en voor alles wat uw ziel van u begeren zal, en eet daar voor het aangezicht van de HEERE, uw God, en wees vrolijk, u en uw huis.", "2 Kon 12:4": "En Joas zei tegen de priesters: Al het geld van de geheiligde dingen, dat gebracht zal worden in het huis van de HEERE, te weten het geld van hem die overgaat tot de getelden, het geld van ieder man naar zijn schatting, en al het geld, dat in het hart van ieder komt, om dat te brengen in het huis van de HEERE,", "2 Kron 9:14": "Behalve wat de kramers en de kooplieden inbrachten; ook brachten alle koningen van Arabië, en de vorsten van dat land, goud en zilver aan Salomo.", "Spr 7:20": "Hij heeft een bundel van het geld in zijn hand genomen; op de vastgestelde dag zal hij naar zijn huis komen.", "Gen 29:29": "En Laban gaf aan zijn dochter Rachel zijn dienstmeisje Bilha, haar tot een dienstmeisje.", "Job 16:18": "O aarde, bedek mijn bloed niet; en laat er voor mijn geroep geen plaats zijn.", "Hand 23:12": "En toen het dag geworden was, spanden sommige Joden samen en vervloekten zichzelf, en zeiden dat ze niet zouden eten of drinken totdat zij Paulus gedood zouden hebben.", "Luk 20:14": "Maar toen de landbouwers hem zagen, overlegden zij onder elkaar en zeiden: Dit is de erfgenaam; kom, laten we hem doden, zodat de erfenis van ons wordt.", "Gen 10:1": "Dit zijn de geboorten van de zonen van Noach: Sem, Cham en Jafeth; en hun werden zonen geboren na de vloed.", "1 Kon 20:31": "Toen zeiden de knechten tegen hem: Zie toch, wij hebben gehoord, dat de koningen van het huis van Israël goedertierene koningen zijn; laat ons toch rouwgewaad om onze lenden leggen, en koorden om onze hoofden, en uitgaan naar de koning van Israël; misschien zal hij uw leven sparen.", "Neh 5:11": "Geeft hun toch, nog vandaag, hun akkers, hun wijngaarden, hun olijfgaarden en hun huizen terug; en het honderdste deel van het geld en van het koren, de most en de olie, die u van hen gevorderd hebt.", "Matt 13:30": "Laat ze beide samen opgroeien tot de oogst, en in de tijd van de oogst zal ik tegen de maaiers zeggen: Verzamel eerst het onkruid, en bind het in bundels om het te verbranden; maar breng de tarwe samen in mijn schuur.", "Ps 25:14": "Samech. De verborgenheid van de HEERE is voor hen die Hem vrezen; en Zijn verbond, om het hun bekend te maken.", "Gen 37:4-11": "Toen zijn broeders zagen dat hun vader hem boven al zijn broers liefhad, haatten zij hem, en konden hem niet vredelijk toespreken. Ook droomde Jozef een droom, die hij aan zijn broers vertelde; daarom haatten zij hem nog meer. En hij zei tegen hen: Hoor toch deze droom, die ik gedroomd heb.", "Num 25:15": "En de naam van de gedode Midianietische vrouw was Kozbi, een dochter van Zur, die een hoofd was van de volken van een vaderlijk huis onder de Midianieten.", "Mark 12:7": "Maar die wijnbouwers zeiden onder elkaar: Dit is de erfgenaam; kom, laten we hem doden, en de erfenis zal van ons zijn.", "Joz 14:13": "Toen zegende Jozua hem, en hij gaf Kaleb, de zoon van Jefunne, Hebron als erfdeel.", "Neh 13:20": "Toen overnachtten de kramers en de verkopers van allerlei koopwaren buiten voor Jeruzalem, een of twee keer.", "Gen 27:18": "En hij kwam tot zijn vader, en zei: Mijn vader! En hij zei: Zie, hier ben ik; wie bent u, mijn zoon?", "Job 31:39": "Als ik zijn vermogen gegeten heb zonder geld, en de ziel van zijn akkerlieden heb doen hijgen;", "2 Sam 6:20": "Toen David nu terugkwam om zijn huis te zegenen, ging Michal, de dochter van Saul, naar buiten, David tegemoet, en zei: Hoe is de koning van Israël vandaag geëerd, die zich vandaag voor de ogen van de dienstmaagden van zijn dienstknechten heeft ontbloot, zoals een van de nietswaardige mensen zich onbeschaamd ontbloot!", "Spr 6:17": "hoogmoedige ogen, een valse tong, en handen die onschuldig bloed vergieten;", "Gen 30:3": "En zij zei: Zie, daar is mijn dienstmaagd Bilha, ga bij haar; dat zij op mijn knieën baart, en ik ook uit haar gebouwd word.", "Gen 33:2": "En hij zette de dienstmaagden en hun kinderen vooraan; en Lea en haar kinderen daarachter; en Rachel en Jozef achteraan.", "Gen 28:12": "En hij droomde, en zie, een ladder stond op de aarde opgesteld, waarvan de top tot de hemel reikte; en zie, de engelen van God klommen daarlangs op en neer.", "Fil 2:15": "Opdat u onberispelijk en oprecht mag zijn, kinderen van God, onstraffelijk te midden van een krom en verdraaid geslacht, onder wie u schijnt als lichten in de wereld;", "Ex 21:34": "dan zal de eigenaar van de kuil het vergoeden; hij zal aan de eigenaar van het dier het geld teruggeven; maar het dode dier zal hem toebehoren.", "2 Sam 11:14-17": "'s Morgens nu gebeurde het, dat David een brief schreef aan Joab; en hij stuurde die door de hand van Uria. En hij schreef in die brief: Stel Uria vooraan tegenover de sterkste strijd, en trek u van achter hem terug, opdat hij geslagen wordt en sterft. Zo gebeurde het, toen Joab op de stad had gelet, dat hij Uria stelde op de plaats waarvan hij wist dat daar strijdbare mannen waren.", "Gen 6:9": "Dit zijn de afstammelingen van Noach. Noach was een rechtvaardig, oprecht man onder zijn tijdgenoten. Noach wandelde met God.", "Matt 27:1": "Toen het morgen geworden was, hebben alle overpriesters en de oudsten van het volk samen een besluit genomen tegen Jezus, om Hem te doden.", "Gen 20:16": "En tegen Sara zei hij: Zie, ik heb uw broeder duizend zilverlingen gegeven; zie, dat moet voor u een bedekking van de ogen zijn, voor allen die bij u zijn, ja, tegenover allen, en wees terechtgewezen.", "Richt 17:4": "Maar hij gaf dat geld aan zijn moeder terug. En zijn moeder nam tweehonderd zilverlingen, en gaf ze aan de goudsmid, die maakte daarvan een gesneden beeld en een gegoten beeld; dat was in het huis van Micha.", "2 Sam 18:32": "Toen zei de koning tegen Cuschi: Is het goed met de jongeman, met Absalom? En Cuschi zei: Laat het de vijanden van mijn heer de koning, en allen die tegen u opstaan om u kwaad te doen, vergaan als die jongeman.", "Ps 125:5": "Maar die zich neigen tot hun kromme wegen, die zal de HEERE weg doen gaan met de werkers van de ongerechtigheid. Vrede zal over Israël zijn!", "Luk 19:15": "En het gebeurde, toen hij terugkwam nadat hij het koninkrijk ontvangen had, dat hij zei dat die dienstknechten aan wie hij het geld gegeven had bij hem geroepen moesten worden, opdat hij zou weten wat ieder met handel verdiend had.", "Gen 46:29": "Toen spande Jozef zijn wagen aan, en trok op, zijn vader Israël tegemoet naar Gosen; en toen hij zich aan hem vertoonde, viel hij hem om zijn hals, en huilde lang aan zijn hals.", "Richt 8:26": "En het gewicht van de gouden voorhoofdsieraden die hij gevraagd had, was zeventienhonderd sikkel goud, behalve de maantjes, en ketens, en purperen kleren die de koningen van de Midianieten gedragen hadden, en behalve de halsbanden die aan de halzen van hun kamelen hadden gezeten.", "Gen 45:9": "Haast u en trek op naar mijn vader, en zeg het hem: Zo zegt uw zoon Jozef: God heeft mij tot een heer over heel Egypte gesteld; kom af naar mij, en wacht niet.", "Gen 30:9-13": "Toen Lea nu zag dat zij ophield met baren, nam zij ook haar dienstmaagd Zilpa, en gaf haar aan Jakob tot vrouw. En Zilpa, Lea's dienstmaagd, baarde Jakob een zoon. Toen zei Lea: Er komt een hoop! En zij noemde zijn naam Gad.", "2 Sam 3:31": "David dan zei tegen Joab en tegen al het volk dat bij hem was: Scheur uw kleren, en doe rouwgewaden aan, en klaag over Abner. En koning David liep zelf achter de baar.", "Jer 32:9": "Dus kocht ik van Hanameel, de zoon van mijn oom, het veld dat bij Anathoth is; en ik woog hem het geld toe, zeventien zilveren sikkels.", "Gen 44:29-31": "Als u nu deze ook van mijn gezicht wegneemt, en hem een ongeluk overkomt, zult u mijn grijze haren met verdriet naar het graf doen afdalen! Nu dan, als ik bij uw knecht, mijn vader, kom, en de jongen is niet bij ons (want zijn ziel is aan diens ziel gebonden), Dan zal het gebeuren, als hij ziet dat de jongen er niet is, dat hij sterft; en uw knechten zullen de grijze haren van uw knecht, onze vader, met verdriet naar het graf doen afdalen.", "Gen 23:4": "Ik ben een vreemdeling en inwoner bij u; geef mij een eigen graf bij u, zodat ik mijn dode van voor mijn aangezicht kan begraven.", "Ex 2:16": "En de priester in Midian had zeven dochters, die kwamen om water te putten, en de drinkbakken te vullen om de kudde van hun vader te laten drinken.", "Ps 118:22": "De steen, die de bouwlieden verworpen hadden, is tot een hoofd van de hoek geworden.", "Neh 5:8": "En ik zei tegen hen: Wij hebben onze broeders, de Joden, die aan de heidenen verkocht waren, naar ons vermogen teruggekocht; en zouden u ook uw broeders verkopen, of zouden zij aan ons verkocht worden? Toen zwegen zij en vonden geen antwoord.", "1 Joh 3:12": "Niet zoals Kaïn, die uit de boze was en zijn broeder doodsloeg; en waarom sloeg hij hem dood? Omdat zijn werken slecht waren, en die van zijn broeder rechtvaardig.", "Pred 7:12": "Want de wijsheid is tot een schaduw, en het geld is tot een schaduw; maar de uitnemendheid van de wetenschap is, dat de wijsheid haar bezitters het leven geeft.", "Gen 39:1-23": "Jozef werd naar Egypte afgevoerd; en Potifar, een hoveling van de farao, een aanvoerder van de lijfwacht, een Egyptisch man, kocht hem van de Ismaëlieten, die hem daarheen afgevoerd hadden. En de HEERE was met Jozef, zodat hij een voorspoedig man was; en hij was in het huis van zijn heer, de Egyptenaar. Toen zijn heer zag dat de HEERE met hem was, en dat de HEERE alles wat hij deed door zijn hand voorspoedig maakte,", "Gen 45:5": "Maar nu, weest niet bekommerd, en de toorn ontsteekt niet in uw ogen, omdat u mij hierheen verkocht hebt; want God heeft mij voor uw aangezicht gezonden, tot behoud van het leven.", "Ex 22:17": "Als haar vader hardnekkig weigert haar aan hem te geven, dan moet hij geld betalen overeenkomstig de bruidsprijs voor maagden.", "Ezra 3:7": "Zo gaven zij geld aan de houwers en werkmeesters, ook eten en drinken, en olie aan de Sidoniërs en aan de Tyriërs, om cederhout van de Libanon te brengen naar de zee bij Jafo, naar de vergunning die Kores, koning van Perzië, hun gegeven had.", "Fil 2:10": "Opdat in de Naam van Jezus zich zou buigen elke knie van hen die in de hemel, en die op de aarde, en die onder de aarde zijn.", "Hos 12:8": "In de hand van de koopman is een bedrieglijke weegschaal, hij houdt ervan te verdrukken;", "Matt 22:16": "En zij stuurden hun discipelen naar Hem toe, met de Herodianen, en zeiden: Meester! wij weten dat U waarachtig bent, en de weg van God in waarheid leert, en U vraagt naar niemand; want U kijkt niet naar de persoon van de mensen.", "Gen 4:10": "En Hij zei: Wat hebt u gedaan? Daar is een stem van het bloed van uw broeder, die tot Mij roept vanuit de aardbodem.", "Gen 16:12": "En hij zal een woudezel van een mens zijn; zijn hand zal tegen allen zijn, en de hand van allen tegen hem; en hij zal wonen voor het aangezicht van al zijn broeders.", "1 Sam 17:17-20": "En Isaï zei tegen zijn zoon David: Neem toch voor uw broers een efa van dit geroosterde koren, en deze tien broden, en breng ze snel naar het leger, naar uw broers. Maar breng deze tien melkkazen naar de aanvoerder over duizend; en u zult naar uw broers omzien, of het hun goed gaat, en u zult van hen een teken meenemen. Saul nu, en zij, en alle mannen van Israël waren bij het eikendal met de Filistijnen aan het strijden.", "1 Sam 3:4-6": "dat de HEERE Samuël riep; en hij zei: Hier ben ik. En hij liep naar Eli en zei: Hier ben ik, want u hebt mij geroepen. Doch hij zei: Ik heb niet geroepen, keer terug, ga liggen. En hij ging heen en legde zich neer. Toen riep de HEERE Samuël opnieuw; en Samuël stond op en ging naar Eli, en zei: Hier ben ik, want u hebt mij geroepen. Hij dan zei: Ik heb u niet geroepen, mijn zoon; keer terug, ga liggen.", "Gen 23:15": "Mijn heer! Hoor mij; een stuk land van vierhonderd sikkel van het zilver, wat is dat tussen mij en u? Begraaf toch uw dode.", "Gen 29:6": "Verder zei hij tegen hen: Gaat het goed met hem? En zij zeiden: Het gaat goed; en zie, Rachel, zijn dochter, komt met de schapen.", "Richt 7:13": "Toen Gideon nu aankwam, zie, daar was een man die aan zijn metgezel een droom vertelde, en zei: Zie, ik heb een droom gehad, en zie, een geroosterd gerstebrood tuimelde het leger van de Midianieten in, en het kwam tot aan de tent, en sloeg ertegen, zodat zij viel, en keerde haar ondersteboven, zodat de tent daar plat lag.", "Ps 37:32": "Tsade. De goddeloze loert op de rechtvaardige, en zoekt hem te doden.", "Job 2:12": "En toen zij hun ogen van verre opsloegen, herkenden zij hem niet, en zij verhieven hun stem en weenden; daarbij scheurden zij ieder hun mantel, en strooiden stof op hun hoofden, omhoog naar de hemel.", "Gen 2:4": "Dit zijn de geboorten van de hemel en de aarde, toen zij geschapen werden; op de dag dat de HEERE God de aarde en de hemel maakte,", "Jes 55:2": "Waarom weegt u geld uit voor wat geen brood is, en uw arbeid voor wat niet verzadigen kan? Hoor aandachtig naar Mij, en eet het goede, en laat uw ziel zich verlustigen in vettigheid.", "Gen 27:41": "En Ezau haatte Jakob om die zegen, waarmee zijn vader hem gezegend had; en Ezau zei in zijn hart: De dagen van rouw om mijn vader komen dichterbij, en ik zal mijn broer Jakob doden.", "Ps 2:3-6": "Laat ons hun banden verscheuren, en hun touwen van ons afwerpen. Die in de hemel woont, zal lachen; de Heere zal hen bespotten. Dan zal Hij tot hen spreken in Zijn toorn, en in Zijn grimmigheid zal Hij hen verschrikken.", "2 Kron 34:17": "En zij hebben het geld dat in het huis van de HEERE gevonden is, samengevoegd, en hebben het gegeven in de hand van de opzichters, en in de hand van hen die het werk verrichtten.", "1 Kon 13:24": "Zo ging hij weg, en een leeuw vond hem op de weg, en doodde hem; en zijn dode lichaam lag geworpen op de weg, en de ezel stond ernaast; ook stond de leeuw bij het dode lichaam.", "Gen 37:5-10": "Ook droomde Jozef een droom, die hij aan zijn broers vertelde; daarom haatten zij hem nog meer. En hij zei tegen hen: Hoor toch deze droom, die ik gedroomd heb. En zie, wij waren schoven aan het binden in het midden van het veld; en zie, mijn schoof stond op en bleef ook staande; en zie, uw schoven kwamen eromheen staan en bogen zich neer voor mijn schoof.", "Klaagl 4:20": "Resch. De adem van onze neus, de gezalfde van de HEERE, is gevangen in hun kuilen; van wie wij zeiden: Wij zullen onder zijn schaduw leven onder de heidenen!", "Hand 12:1": "In diezelfde tijd sloeg koning Herodes de handen aan sommigen van de gemeente, om hen kwalijk te behandelen.", "Ps 89:49": "Wat man leeft er, die de dood niet zien zal, die zijn ziel zal bevrijden van het geweld van het graf? Sela.", "Matt 10:28": "En weest niet bang voor hen die het lichaam doden, en de ziel niet kunnen doden; maar vreest veel meer Hem, Die zowel ziel als lichaam kan verderven in de hel.", "Joh 4:27": "En daarop kwamen Zijn discipelen en verwonderden zich dat Hij met een vrouw sprak. Toch zei niemand: Wat vraagt U, of: Wat spreekt U met haar?", "Luk 19:10": "Want de Zoon des mensen is gekomen om te zoeken en zalig te maken wat verloren was.", "Gen 46:18": "Dit zijn de zonen van Zilpa, die Laban aan zijn dochter Lea gegeven had; en zij baarde Jakob deze zestien zielen.", "Spr 1:12": "Laat ons hen levend verslinden, als het graf; ja, geheel en al, zoals zij die in de kuil neerdalen;", "Gen 30:9": "Toen Lea nu zag dat zij ophield met baren, nam zij ook haar dienstmaagd Zilpa, en gaf haar aan Jakob tot vrouw.", "2 Sam 1:11": "Toen greep David zijn kleren en scheurde ze; evenzo ook al de mannen die met hem waren.", "Luk 20:17": "Maar Hij keek hen aan en zei: Wat betekent dan wat er geschreven staat: De steen die de bouwers verworpen hebben, die is de hoeksteen geworden?", "1 Sam 16:13": "Toen nam Samuël de oliehoorn, en zalfde hem te midden van zijn broers. En de Geest van de HEERE kwam vanaf die dag over David, en bleef. Daarna stond Samuël op, en ging naar Rama.", "Num 12:6": "En Hij zei: Hoor nu Mijn woorden! Als er een profeet onder u is, zal Ik, de HEERE, Mij door een gezicht aan hem bekendmaken, door een droom zal Ik met hem spreken.", "Richt 11:35": "En het gebeurde, toen hij haar zag, dat hij zijn kleren scheurde, en zei: Ach, mijn dochter! U hebt mij helemaal terneergeslagen, en u bent onder degenen die mij in het ongeluk storten; want ik heb mijn mond opengedaan tegen de HEERE, en ik kan niet terug.", "2 Kron 24:11": "Het gebeurde nu ter tijd, als hij de kist, naar het bevel van de koning, door de hand van de Levieten inbracht, en als zij zagen dat er veel van het geld was, dat de schrijver van de koning kwam, en de gestelde van de hoofdpriester, en de kist leegmaakten, en die opnamen, en die terugbrachten naar haar plaats; zo deden zij van dag tot dag, en verzamelden geld in overvloed;", "Zach 11:13": "Doch de HEERE zei tegen mij: Werp ze heen voor de pottenbakker: een heerlijke prijs, die Ik van hen waard geacht ben geweest! En ik nam die dertig zilverlingen, en wierp ze in het huis van de HEERE, voor de pottenbakker.", "Jes 47:15": "Zo zullen zij u zijn, met wie u gearbeid hebt, uw handelaars van uw jeugd af aan; ieder zal zijns weegs dwalen, niemand zal u verlossen.", "Gen 17:27": "En alle mannen van zijn huis, degenen die in het huis geboren waren, en degenen die met geld gekocht waren, van de vreemdeling af, werden met hem besneden.", "1 Sam 17:28": "Toen Eliab, zijn oudste broer, hem tegen die mannen hoorde spreken, ontstak de toorn van Eliab tegen David, en hij zei: Waarom bent u nu hierheen gekomen, en bij wie hebt u die paar schapen in de woestijn gelaten? Ik ken uw overmoed en de slechtheid van uw hart wel; want u bent gekomen om de strijd te zien.", "Gen 50:10": "Toen zij nu bij het plein van het doornbos kwamen, dat aan de overzijde van de Jordaan is, hielden zij daar een grote en zeer zware rouwklacht; en hij maakte voor zijn vader een rouw van zeven dagen.", "Gen 37:5-11": "Ook droomde Jozef een droom, die hij aan zijn broers vertelde; daarom haatten zij hem nog meer. En hij zei tegen hen: Hoor toch deze droom, die ik gedroomd heb. En zie, wij waren schoven aan het binden in het midden van het veld; en zie, mijn schoof stond op en bleef ook staande; en zie, uw schoven kwamen eromheen staan en bogen zich neer voor mijn schoof.", "Gen 19:2": "En hij zei: Zie toch, mijn heren! Keert u toch af naar het huis van uw knecht, en overnacht daar, en wast uw voeten; dan kunt u vroeg opstaan en verder gaan op uw weg. En zij zeiden: Nee, maar wij zullen op straat overnachten.", "2 Kon 22:11": "Het gebeurde nu, toen de koning de woorden van het wetboek hoorde, dat hij zijn kleren scheurde.", "Richt 5:30": "Zouden zij dan de buit niet vinden en delen? Een liefje, of twee liefjes, voor ieder man? Voor Sisera een buit van verscheidene verven, een buit van verscheidene verven, gestikt; van verscheiden verf aan beide zijden gestikt, voor de buithalzen?", "Hand 4:28": "Om te doen alles wat Uw hand en Uw raad van tevoren bepaald hadden dat zou gebeuren.", "Num 31:2": "Neem wraak voor de kinderen van Israël op de Midianieten; daarna zult u verzameld worden tot uw volken.", "Ex 21:21": "Als hij echter een dag of twee dagen overeind blijft, zal hij niet gewroken worden; want hij is zijn eigen geld waard.", "Gen 34:25-31": "En het gebeurde op de derde dag, toen zij in pijn waren, dat de twee zonen van Jakob, Simeon en Levi, broers van Dina, ieder zijn zwaard namen, en stout de stad binnenkwamen, en allen doodden die mannelijk waren. Zij sloegen ook Hemor en zijn zoon Sichem dood met de scherpte van het zwaard; en zij namen Dina uit Sichems huis en gingen vandaar weg. De zonen van Jakob kwamen bij de gesneuvelden en plunderden de stad, omdat zij hun zuster verontreinigd hadden.", "Gen 37:26-28": "Toen zei Juda tegen zijn broers: Wat voor voordeel zal het zijn dat wij onze broer doodslaan en zijn bloed verbergen? Komt, laten wij hem aan deze Ismaëlieten verkopen, en onze hand zij niet aan hem; want hij is onze broer, ons vlees. En zijn broers stemden ermee in. Toen nu de Midianitische kooplieden voorbijtrokken, trokken en hesen zij Jozef op uit de kuil, en verkochten Jozef aan deze Ismaëlieten voor twintig zilverstukken; die brachten Jozef naar Egypte.", "Deut 2:6": "Voedsel zult u voor geld van hen kopen, dat u eet; en ook zult u water voor geld van hen kopen, dat u drinkt.", "Joh 20:15": "Jezus zei tegen haar: Vrouw, waarom huilt u? Wie zoekt u? Zij, denkend dat het de tuinman was, zei tegen Hem: Heer, als u Hem weggedragen hebt, zeg mij waar u Hem hebt neergelegd, en ik zal Hem wegnemen.", "Spr 27:4": "Grimmigheid en overloping van toorn is wreedheid; maar wie zal voor jaloezie standhouden?", "Num 25:17": "Handel vijandig met de Midianieten, en versla hen;", "Est 1:10": "Op de zevende dag, toen het hart van de koning vrolijk was van de wijn, zei hij tegen Mehuman, Biztha, Charbona, Bigtha en Abagtha, Zethar en Charchas, de zeven kamerlingen die dienden voor het aangezicht van de koning Ahasveros,", "Hand 4:16-18": "En zeiden: Wat zullen wij met deze mensen doen? Want dat er een bekend teken door hen gebeurd is, is duidelijk voor allen die in Jeruzalem wonen, en wij kunnen het niet ontkennen. Maar opdat het niet nog meer onder het volk verspreid wordt, laten wij hen scherp dreigen, dat zij niet meer tot enig mens in deze Naam spreken. En zij riepen hen en zeiden hun aan, dat zij helemaal niet meer zouden spreken, noch leren, in de Naam van Jezus.", "Ps 88:9": "Mijn bekenden hebt U ver van mij weggedaan, U hebt mij hun tot een grote gruwel gesteld; ik ben opgesloten en kan niet uitkomen.", "Openb 18:13": "En kaneel, en reukwerk, en welriekende zalf, en wierook, en wijn, en olie, en meelbloem, en tarwe, en lastdieren, en schapen; en van paarden, en van wagens, en van lichamen, en de zielen van de mensen.", "Gen 49:23": "De schutters hebben hem wel bitterheid aangedaan, en op hem geschoten, en hem gehaat;", "Gen 45:4": "En Jozef zei tegen zijn broers: Kom toch dichter bij mij! En zij kwamen dichterbij. Toen zei hij: Ik ben Jozef, uw broer, die u naar Egypte verkocht hebt.", "Hand 7:35": "Deze Mozes, die zij verloochend hadden door te zeggen: Wie heeft u tot leider en rechter gesteld? — deze heeft God tot leider en verlosser gezonden, door de hand van de engel die hem verschenen was in de doornstruik.", "Matt 10:16": "Zie, Ik zend u als schapen te midden van de wolven; wees dan voorzichtig zoals de slangen, en oprecht zoals de duiven.", "Richt 19:3-5": "En haar man maakte zich op, en trok haar achterna, om vriendelijk tegen haar te spreken, om haar terug te halen; en zijn knecht was bij hem, en een paar ezels. En zij bracht hem in het huis van haar vader. En toen de vader van de jonge vrouw hem zag, werd hij blij dat hij hem ontmoette. En zijn schoonvader, de vader van de jonge vrouw, hield hem tegen, zodat hij drie dagen bij hem bleef; en zij aten en dronken, en overnachtten daar. Op de vierde dag nu gebeurde het, dat zij 's morgens vroeg op waren, en hij opstond om weg te trekken; toen zei de vader van de jonge dochter tegen zijn schoonzoon: Sterk uw hart met een stukje brood, en daarna zult u weggaan.", "Gen 17:23": "Toen nam Abraham zijn zoon Ismaël, en alle mannen die in zijn huis geboren waren, en alle die met zijn geld gekocht waren, alles wat mannelijk was onder de mensen van het huis van Abraham, en hij besneed het vlees van hun voorhuid, op diezelfde dag, zoals God met hem gesproken had.", "Matt 27:43": "Hij heeft op God vertrouwd; laat God Hem nu verlossen, als Hij Hem tenminste wil hebben; want Hij heeft gezegd: Ik ben Gods Zoon.", "2 Sam 13:18": "Zij droeg een veelkleurige mantel; want zo werden de dochters van de koning die nog maagd waren gekleed. En zijn dienaar bracht haar naar buiten, en grendelde de deur achter haar dicht.", "Richt 9:7": "Toen ze dit aan Jotham vertelden, ging hij heen en ging op de top van de berg Gerizim staan, en verhief zijn stem, en riep, en hij zei tegen hen: Luistert naar mij, burgers van Sichem! Dan zal God ook naar u luisteren.", "1 Kon 10:29": "En een wagen kwam op en ging uit Egypte weg voor zeshonderd sikkel van het zilver, en een paard voor honderdvijftig; en zo voerden zij die uit door hun toedoen, voor alle koningen van de Hethieten, en voor de koningen van Syrië.", "1 Joh 2:11": "Maar wie zijn broeder haat, is in de duisternis, en wandelt in de duisternis, en weet niet, waar hij heengaat; want de duisternis heeft zijn ogen verblind.", "Richt 16:18": "Toen Delila nu zag, dat hij haar zijn hele hart bekend had gemaakt, zond zij mensen weg, en riep de vorsten van de Filistijnen, en zei: Komt ditmaal, want hij heeft mij zijn hele hart bekendgemaakt. En de vorsten van de Filistijnen kwamen naar haar toe, en brachten dat geld in hun hand.", "Gen 23:2": "Sara stierf te Kiriath-arba, dat is Hebron, in het land Kanaän; en Abraham kwam om Sara te beklagen en haar te bewenen.", "Dan 4:5": "Toen zag ik een droom, die mij bang maakte, en de gedachten die ik op mijn bed had, en de visioenen van mijn hoofd verontrustten mij.", "Jes 43:24": "Mij hebt u geen kalmoes voor geld gekocht, en met het vet van uw slachtoffers hebt u Mij niet gedrenkt; maar u hebt Mij arbeid gemaakt met uw zonden, u hebt Mij vermoeid met uw ongerechtigheden.", "Gen 33:18": "En Jakob kwam veilig aan bij de stad Sichem, die in het land Kanaän ligt, toen hij vanuit Paddan-Aram kwam; en hij sloeg zijn tenten op tegenover de stad.", "Gen 35:27": "En Jakob kwam bij Izak, zijn vader, in Mamre, te Kirjath-Arba, dat is Hebron, waar Abraham als vreemdeling had gewoond, en Izak.", "Jer 32:10": "En ik ondertekende de brief en verzegelde hem, en liet het door getuigen bevestigen, toen ik het geld op de weegschaal gewogen had.", "Spr 1:16": "Want hun voeten lopen tot het kwade; en zij haasten zich om bloed te storten.", "Fil 2:11": "En elke tong zou belijden dat Jezus Christus de Heere is, tot heerlijkheid van God de Vader.", "Matt 27:40": "en zeiden: U Die de tempel afbreekt en in drie dagen opbouwt, verlos Uzelf. Als U de Zoon van God bent, kom dan van het kruis af."}, "noten": {}, "koppeling": {"1": "<span class=\"wl\" data-l=\"L1\" data-code=\"H3290\">En</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H3290\">Jakob</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H3427\">woonde</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H3427\">in</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H776\">het</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H776\">land</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H776\">van</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H4033\">de</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H4033\">vreemdelingschap</span> <span c "H853\">hem</span>.", "36": "<span class=\"wl\" data-l=\"L1\" data-code=\"H4092\">En</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H4092\">de</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H4092\">Midianieten</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H4376\">verkochten</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H853\">hem</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H853\">in</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H4714\">Egypte</span>, <span class=\"wl\" data-l=\"L4\" data-code=\"H4714\">aan</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H6318\">Potifar</span>, <span class=\"wl\" data-l=\"L5\" data-code=\"H6318\">een</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H5631\">hoveling</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H5631\">van</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H6547\">de</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H6547\">farao</span>, <span class=\"wl\" data-l=\"L8\" data-code=\"H8269\">leider</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H8269\">van</span> de lijfwacht."}, "koppeling_kjv": {"1": "And <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelt</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> wherein his <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> was a <span class=\"wl wl-kjv\" data-code=\"H4033\">stranger,</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of Canaan.", "2": "These are the <span class=\"wl wl-kjv\" data-code=\"H8435\">generations</span> of <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob.</span> <span class=\"wl wl-kjv\" data-code=\"H3130\">Joseph,</span> being <span class=\"wl wl-kjv\" data-code=\"H6240\">seventeen</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">old,</span> was <span class=\"wl wl-kjv\" data-code=\"H7462\">feeding</span> the <span class=\"wl wl-kjv\" data-code=\"H6629\">flock</span> with his <span class=\"wl wl-kjv\" data-code=\"H251\">brethren;</span> and the <span class=\"wl wl-kjv\" data-code=\"H5288\">lad</span> was with the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H1090\">Bilhah,</span> and with the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H2153\">Zilpah,</span> his <span class=\"wl wl-kjv\" data-code=\"H1\">father's</span> <span class=\"wl wl-kjv\" data-code=\"H802\">wives:</span> and <span class=\"wl wl-kjv\" data-code=\"H3130\">Joseph</span> <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> unto his <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> their <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> report.", "3": "Now <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H157\">loved</span> <span class=\"wl wl-kjv\" data-code=\"H3130\">Joseph</span> more than all his <span class=\"wl wl-kjv\" data-code=\"H1121\">children,</span> because he was the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of his old <span class=\"wl wl-kjv\" data-code=\"H2208\">age:</span> and he <span class=\"wl wl-kjv\" data-code=\"H6213\">made</span> him a <span class=\"wl wl-kjv\" data-code=\"H3801\">coat</span> of many colours.", "4": "And when his <span class=\"wl wl-kjv\" data-code=\"H251\">brethren</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> that their <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> <span class=\"wl wl-kjv\" data-code=\"H157\">loved</span> him more than all his <span class=\"wl wl-kjv\" data-code=\"H251\">brethren,</span> they <span class=\"wl wl-kjv\" data-code=\"H8130\">hated</span> him, and <span class=\"wl wl-kjv\" data-code=\"H3201\">could</span> not <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> peaceably", "5": "And <span class=\"wl wl-kjv\" data-code=\"H3130\">Joseph</span> <span class=\"wl wl-kjv\" data-code=\"H2492\">dreamed</span> a <span class=\"wl wl-kjv\" data-code=\"H2472\">dream,</span> and he <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> it his <span class=\"wl wl-kjv\" data-code=\"H251\">brethren:</span> and they <span class=\"wl wl-kjv\" data-code=\"H8130\">hated</span> him yet the more.", "6": "And he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto them, <span class=\"wl wl-kjv\" data-code=\"H8085\">Hear,</span> I pray you, this <span class=\"wl wl-kjv\" data-code=\"H2472\">dream</span> which I have dreamed:", "7": "For, behold, we were <span class=\"wl wl-kjv\" data-code=\"H481\">binding</span> <span class=\"wl wl-kjv\" data-code=\"H485\">sheaves</span> in the <span class=\"wl wl-kjv\" data-code=\"H7704\">field,</span> and, lo, my <span class=\"wl wl-kjv\" data-code=\"H485\">sheaf</span> <span class=\"wl wl-kjv\" data-code=\"H6965\">arose,</span> and also stood <span class=\"wl wl-kjv\" data-code=\"H5324\">upright;</span> and, behold, your <span class=\"wl wl-kjv\" data-code=\"H485\">sheaves</span> stood round <span class=\"wl wl-kjv\" data-code=\"H5437\">about,</span> and made <span class=\"wl wl-kjv\" data-code=\"H7812\">obeisance</span> to my sheaf.", "8": "And his <span class=\"wl wl-kjv\" data-code=\"H251\">brethren</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to him, Shalt thou <span class=\"wl wl-kjv\" data-code=\"H4427\">indeed</span> <span class=\"wl wl-kjv\" data-code=\"H4427\">reign</span> over us? or shalt thou <span class=\"wl wl-kjv\" data-code=\"H4910\">indeed</span> have <span class=\"wl wl-kjv\" data-code=\"H4910\">dominion</span> over us? And they <span class=\"wl wl-kjv\" data-code=\"H8130\">hated</span> him yet the <span class=\"wl wl-kjv\" data-code=\"H3254\">more</span> for his <span class=\"wl wl-kjv\" data-code=\"H2472\">dreams,</span> and for his words.", "9": "And he <span class=\"wl wl-kjv\" data-code=\"H2492\">dreamed</span> yet <span class=\"wl wl-kjv\" data-code=\"H312\">another</span> <span class=\"wl wl-kjv\" data-code=\"H2472\">dream,</span> and <span class=\"wl wl-kjv\" data-code=\"H5608\">told</span> it his <span class=\"wl wl-kjv\" data-code=\"H251\">brethren,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Behold, I have <span class=\"wl wl-kjv\" data-code=\"H2492\">dreamed</span> a <span class=\"wl wl-kjv\" data-code=\"H2472\">dream</span> more; and, behold, the <span class=\"wl wl-kjv\" data-code=\"H8121\">sun</span> and the <span class=\"wl wl-kjv\" data-code=\"H3394\">moon</span> and the <span class=\"wl wl-kjv\" data-code=\"H6240\">eleven</span> <span class=\"wl wl-kjv\" data-code=\"H3556\">stars</span> made obeisance", "10": "And he <span class=\"wl wl-kjv\" data-code=\"H5608\">told</span> it to his <span class=\"wl wl-kjv\" data-code=\"H1\">father,</span> and to his <span class=\"wl wl-kjv\" data-code=\"H251\">brethren:</span> and his <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> <span class=\"wl wl-kjv\" data-code=\"H1605\">rebuked</span> him, and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, What is this <span class=\"wl wl-kjv\" data-code=\"H2472\">dream</span> that thou hast <span class=\"wl wl-kjv\" data-code=\"H2492\">dreamed?</span> Shall I and thy <span class=\"wl wl-kjv\" data-code=\"H517\">mother</span> and thy <span class=\"wl wl-kjv\" data-code=\"H251\">brethren</span> <span class=\"wl wl-kjv\" data-code=\"H935\">indeed</span> <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> to bow <span class=\"wl wl-kjv\" data-code=\"H7812\">down</span> ourselves to thee to the earth?", "11": "And his <span class=\"wl wl-kjv\" data-code=\"H251\">brethren</span> <span class=\"wl wl-kjv\" data-code=\"H7065\">envied</span> him; but his <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> <span class=\"wl wl-kjv\" data-code=\"H8104\">observed</span> the saying.", "12": "And his <span class=\"wl wl-kjv\" data-code=\"H251\">brethren</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> to <span class=\"wl wl-kjv\" data-code=\"H7462\">feed</span> their <span class=\"wl wl-kjv\" data-code=\"H1\">father's</span> <span class=\"wl wl-kjv\" data-code=\"H6629\">flock</span> in Shechem.", "13": "And <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H3130\">Joseph,</span> Do not thy <span class=\"wl wl-kjv\" data-code=\"H251\">brethren</span> <span class=\"wl wl-kjv\" data-code=\"H7462\">feed</span> the flock in <span class=\"wl wl-kjv\" data-code=\"H7927\">Shechem?</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">come,</span> and I will send <span class=\"wl wl-kjv\" data-code=\"H7971\">thee</span> unto them. And he said", "14": "And he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to him, <span class=\"wl wl-kjv\" data-code=\"H3212\">Go,</span> I pray thee, <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> whether it be <span class=\"wl wl-kjv\" data-code=\"H7965\">well</span> with thy <span class=\"wl wl-kjv\" data-code=\"H251\">brethren,</span> and <span class=\"wl wl-kjv\" data-code=\"H7965\">well</span> with the <span class=\"wl wl-kjv\" data-code=\"H6629\">flocks;</span> and <span class=\"wl wl-kjv\" data-code=\"H7725\">bring</span> me <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">again.</span> So he <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> him out of the <span class=\"wl wl-kjv\" data-code=\"H6010\">vale</span> of <span class=\"wl wl-kjv\" data-code=\"H2275\">Hebron,</span> and he <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to Shechem.", "15": "And a certain <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> found <span class=\"wl wl-kjv\" data-code=\"H4672\">him,</span> and, behold, he was <span class=\"wl wl-kjv\" data-code=\"H8582\">wandering</span> in the <span class=\"wl wl-kjv\" data-code=\"H7704\">field:</span> and the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> asked <span class=\"wl wl-kjv\" data-code=\"H7592\">him,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> What seekest", "16": "And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> I <span class=\"wl wl-kjv\" data-code=\"H1245\">seek</span> my <span class=\"wl wl-kjv\" data-code=\"H251\">brethren:</span> <span class=\"wl wl-kjv\" data-code=\"H5046\">tell</span> me, I pray thee, <span class=\"wl wl-kjv\" data-code=\"H375\">where</span> they feed", "17": "And the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> They are <span class=\"wl wl-kjv\" data-code=\"H5265\">departed</span> <span class=\"wl wl-kjv\" data-code=\"H2088\">hence;</span> for I <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> them <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> Let us <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> to <span class=\"wl wl-kjv\" data-code=\"H1886\">Dothan.</span> And <span class=\"wl wl-kjv\" data-code=\"H3130\">Joseph</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> his <span class=\"wl wl-kjv\" data-code=\"H251\">brethren,</span> and <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> them in Dothan.", "18": "And when they <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> him afar <span class=\"wl wl-kjv\" data-code=\"H7350\">off,</span> even before he came <span class=\"wl wl-kjv\" data-code=\"H7126\">near</span> unto them, they <span class=\"wl wl-kjv\" data-code=\"H5230\">conspired</span> against him to slay", "19": "And they <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> <span class=\"wl wl-kjv\" data-code=\"H376\">one</span> to <span class=\"wl wl-kjv\" data-code=\"H251\">another,</span> Behold, <span class=\"wl wl-kjv\" data-code=\"H1976\">this</span> <span class=\"wl wl-kjv\" data-code=\"H1167\">dreamer</span> cometh.", "20": "<span class=\"wl wl-kjv\" data-code=\"H3212\">Come</span> now therefore, and let us <span class=\"wl wl-kjv\" data-code=\"H2026\">slay</span> him, and <span class=\"wl wl-kjv\" data-code=\"H7993\">cast</span> him into <span class=\"wl wl-kjv\" data-code=\"H259\">some</span> <span class=\"wl wl-kjv\" data-code=\"H953\">pit,</span> and we will <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> Some <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> <span class=\"wl wl-kjv\" data-code=\"H2416\">beast</span> hath <span class=\"wl wl-kjv\" data-code=\"H398\">devoured</span> him: and we shall <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> what will become of his dreams.", "21": "And <span class=\"wl wl-kjv\" data-code=\"H7205\">Reuben</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> it, and he <span class=\"wl wl-kjv\" data-code=\"H5337\">delivered</span> him out of their <span class=\"wl wl-kjv\" data-code=\"H3027\">hands;</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Let us not <span class=\"wl wl-kjv\" data-code=\"H5221\">kill</span>", "22": "And <span class=\"wl wl-kjv\" data-code=\"H7205\">Reuben</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto them, <span class=\"wl wl-kjv\" data-code=\"H8210\">Shed</span> no <span class=\"wl wl-kjv\" data-code=\"H1818\">blood,</span> but <span class=\"wl wl-kjv\" data-code=\"H7993\">cast</span> him into this <span class=\"wl wl-kjv\" data-code=\"H953\">pit</span> that is in the <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness,</span> and <span class=\"wl wl-kjv\" data-code=\"H7971\">lay</span> no <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> upon him; that he might <span class=\"wl wl-kjv\" data-code=\"H5337\">rid</span> him out of their <span class=\"wl wl-kjv\" data-code=\"H3027\">hands,</span> to <span class=\  data-code=\"H935\">brought</span> <span class=\"wl wl-kjv\" data-code=\"H3130\">Joseph</span> into Egypt.", "29": "And <span class=\"wl wl-kjv\" data-code=\"H7205\">Reuben</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">returned</span> unto the <span class=\"wl wl-kjv\" data-code=\"H953\">pit;</span> and, behold, <span class=\"wl wl-kjv\" data-code=\"H3130\">Joseph</span> was not in the <span class=\"wl wl-kjv\" data-code=\"H953\">pit;</span> and he <span class=\"wl wl-kjv\" data-code=\"H7167\">rent</span> his clothes.", "30": "And he <span class=\"wl wl-kjv\" data-code=\"H7725\">returned</span> unto his <span class=\"wl wl-kjv\" data-code=\"H251\">brethren,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> The <span class=\"wl wl-kjv\" data-code=\"H3206\">child</span> is not; and I, <span class=\"wl wl-kjv\" data-code=\"H575\">whither</span> shall I go?", "31": "And they <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> <span class=\"wl wl-kjv\" data-code=\"H3130\">Joseph's</span> <span class=\"wl wl-kjv\" data-code=\"H3801\">coat,</span> and <span class=\"wl wl-kjv\" data-code=\"H7819\">killed</span> a <span class=\"wl wl-kjv\" data-code=\"H8163\">kid</span> of the <span class=\"wl wl-kjv\" data-code=\"H5795\">goats,</span> and <span class=\"wl wl-kjv\" data-code=\"H2881\">dipped</span> the <span class=\"wl wl-kjv\" data-code=\"H3801\">coat</span> in the blood;", "32": "And they <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> the <span class=\"wl wl-kjv\" data-code=\"H3801\">coat</span> of many <span class=\"wl wl-kjv\" data-code=\"H6446\">colours,</span> and they <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> it to their <span class=\"wl wl-kjv\" data-code=\"H1\">father;</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> This have we <span class=\"wl wl-kjv\" data-code=\"H4672\">found:</span> <span class=\"wl wl-kjv\" data-code=\"H5234\">know</span> now whether it be thy <span class=\"wl wl ass=\"wl wl-kjv\" data-code=\"H1\">father</span> wept", "36": "And the <span class=\"wl wl-kjv\" data-code=\"H4092\">Midianites</span> <span class=\"wl wl-kjv\" data-code=\"H4376\">sold</span> him into <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt</span> unto <span class=\"wl wl-kjv\" data-code=\"H6318\">Potiphar,</span> an <span class=\"wl wl-kjv\" data-code=\"H5631\">officer</span> of <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh's,</span> and <span class=\"wl wl-kjv\" data-code=\"H8269\">captain</span> of the guard."}};
const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"
const ZELF = D.meta.zelf_abbr;      // afkorting binnen dit hoofdstuk, bv. "Joh 3"

const PARALLEL_VOLGORDE = ['SVnu', 'SV', 'KJV'];
let vertaling = 'SVnu';

const bijbel = document.getElementById('bijbel');
const popup = document.getElementById('popup');

const nummers = Object.keys(D.vertalingen.SVnu);

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const berea = D.tsk[n], engels = D.tsk_kjv[n];
    if ((!berea || !berea.length) && (!engels || !engels.length)) return '<em>Geen verwijzingen bij dit vers.</em>';
    let h = '';
    if (berea && berea.length) {
      h += '<div class="tsk-kop">Treasury of Scripture Knowledge | SVnu</div>';
      h += berea.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r}">${r}</a>`).join('') + '</div>').join('');
    }
    if (engels && engels.length) {
      h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.tsk[n] && D.tsk[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}
</script>
</body>
</html>
