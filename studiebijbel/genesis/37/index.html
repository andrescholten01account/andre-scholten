10": "En toen hij het aan zijn vader en aan zijn broers vertelde, bestrafte zijn vader hem en zei tegen hem: Wat is dit voor een droom die u gedroomd hebt? Zullen wij dan werkelijk komen, ik, en uw moeder, en uw broers, om ons voor u ter aarde te buigen?", "11": "Zijn broers benijdden hem; maar zijn vader bewaarde deze zaak.", "12": "En zijn broers gingen heen om de kudde van hun vader te weiden bij Sichem.", "13": "Zo zei Israël tegen Jozef: Weiden uw broers niet bij Sichem? Kom, ik zal u naar hen toe zenden. En hij zei tegen hem: Zie, *hier* ben ik!", "14": "En hij zei tegen hem: Ga toch heen, zie naar het welzijn van uw broers en naar het welzijn van de kudde, en breng mij een woord terug. Zo zond hij hem uit het dal Hebron, en hij kwam te Sichem.", "15": "En een man vond hem (want zie, hij was aan het dwalen in het veld); zo vroeg deze man hem: Wat zoekt u?", "16": "En hij zei: Ik zoek mijn broers; vertel mij toch waar zij weiden.", "17": "Zo zei die man: Zij zijn hiervandaan vertrokken; want ik hoorde hen zeggen: Laten wij naar Dothan gaan. Jozef dan ging zijn broers achterna en vond hen te Dothan.", "18": "En zij zagen hem van verre; en voordat hij bij hen kwam, smeedden zij een listig plan tegen hem, om hem te doden.", "19": "En zij zeiden de een tegen de ander: Zie, daar komt die meesterdromer aan!", "20": "Nu dan, komt, laten wij hem doodslaan en hem in een van deze kuilen werpen; en wij zullen zeggen: Een wild dier heeft hem opgegeten! Zo zullen wij zien wat er van zijn dromen worden zal.", "21": "Ruben hoorde dat en verloste hem uit hun hand, en hij zei: Laten wij hem niet aan het leven slaan.", "22": "Ook zei Ruben tegen hen: Vergiet geen bloed; werpt hem in deze kuil die in de woestijn is, en legt de hand niet aan hem; opdat hij hem uit hun hand zou verlossen, om hem tot zijn vader terug te brengen.", "23": "En het gebeurde, toen Jozef bij zijn broers kwam, dat zij Jozef zijn rok uittrokken, de veelkleurige rok die hij aanhad.", "24": "En zij namen hem en wierpen hem in de kuil; de kuil was echter leeg, er was geen water in.", "25": "Daarna zaten zij neer om brood te eten, en zij hieven hun ogen op en zagen, en zie, een reisgezelschap van Ismaëlieten kwam uit Gilead; en hun kamelen droegen specerijen, balsem en mirre, op weg om dat naar Egypte te brengen.", "26": "Toen zei Juda tegen zijn broers: Wat voor voordeel zal het zijn dat wij onze broer doodslaan en zijn bloed verbergen?", "27": "Komt, laten wij hem aan deze Ismaëlieten verkopen, en onze hand zij niet aan hem; want hij is onze broer, ons vlees. En zijn broers stemden ermee in.", "28": "Toen nu de Midianitische kooplieden voorbijtrokken, trokken en hesen zij Jozef op uit de kuil, en verkochten Jozef aan deze Ismaëlieten voor twintig zilverstukken; die brachten Jozef naar Egypte.", "29": "Toen Ruben nu naar de kuil terugkeerde, zie, Jozef was niet meer in de kuil; toen scheurde hij zijn kleren.", "30": "En hij keerde terug naar zijn broers en zei: De jongen is er niet; en ik, waar zal ik heengaan?", "31": "Toen namen zij de rok van Jozef, en zij slachtten een geitenbok en doopten de rok in het bloed.", "32": "En zij zonden de veelkleurige rok en lieten hem naar hun vader brengen, en zeiden: Dit hebben wij gevonden; herken toch of dit de rok van uw zoon is, of niet.", "33": "En hij herkende hem en zei: Het is de rok van mijn zoon! Een wild dier heeft hem opgegeten! Jozef is voorzeker verscheurd!", "34": "Toen scheurde Jakob zijn kleren en legde een zak om zijn heupen; en hij bedreef rouw over zijn zoon, vele dagen.", "35": "En al zijn zonen en al zijn dochters maakten zich op om hem te troosten; maar hij weigerde zich te laten troosten en zei: Want ik zal, rouw bedrijvend, tot mijn zoon in het graf neerdalen. Zo beweende zijn vader hem.", "36": "En de Midianieten verkochten hem in Egypte, aan Potifar, een hoveling van de farao, leider van de lijfwacht."}, "SV": {"1": "En Jakob woonde in het land der vreemdelingschappen zijns vaders, in het land Kanaän.", "2": "Dit zijn Jakobs geschiedenissen. Jozef, zijnde een zoon van zeventien jaren, weidde de kudde met zijn broeders (en hij was een jongeling), met de zonen van Bilha, en de zonen van Zilpa, zijns vaders vrouwen; en Jozef bracht hun kwaad gerucht tot hun vader.", "3": "En Israël had Jozef lief, boven al zijn zonen; want hij was hem een zoon des ouderdoms; en hij maakte hem een veelvervigen rok.", "4": "Als nu zijn broeders zagen, dat hun vader hem boven al zijn broederen liefhad, haatten zij hem, en konden hem niet vredelijk toespreken.", "5": "Ook droomde Jozef een droom, dien hij aan zijn broederen vertelde; daarom haatten zij hem nog te meer.", "6": "En hij zeide tot hen: Hoort toch dezen droom, dien ik gedroomd heb.", "7": "En ziet, wij waren schoven bindende in het midden des velds; en ziet, mijn schoof stond op, en bleef ook staande; en ziet, uw schoven kwamen rondom, en bogen zich neder voor mijn schoof.", "8": "Toen zeiden zijn broeders tot hem: Zult gij dan ganselijk over ons regeren: zult gij dan ganselijk over ons heersen? Zo haatten zij hem nog te meer, om zijn dromen en om zijn woorden.", "9": "En hij droomde nog een anderen droom, en verhaalde dien aan zijn broederen; en hij zeide: Ziet, ik heb nog een droom gedroomd, en ziet, de zon, en de maan, en elf sterren bogen zich voor mij neder.", "10": "En als hij het aan zijn vader en aan zijn broederen verhaalde, bestrafte hem zijn vader, en zeide tot hem: Wat is dit voor een droom, dien gij gedroomd hebt; zullen wij dan ganselijk komen, ik, en uw moeder, en uw broeders, om ons voor u ter aarde te buigen?", "11": "Zijn broeders dan benijdden hem; doch zijn vader bewaarde deze zaak.", "12": "En zijn broeders gingen heen, om de kudde van hun vader te weiden bij Sichem.", "13": "Zo zeide Israël tot Jozef: Weiden uw broeders niet bij Sichem? Kom, dat ik u tot hen zende. En hij zeide tot hem: Zie, *hier* ben ik!", "14": "En hij zeide tot hem: Ga toch heen, zie naar den welstand van uw broederen, en naar den welstand van de kudde, en breng mij een woord wederom. Zo zond hij hem uit het dal Hebron, en hij kwam te Sichem.", "15": "En een man vond hem (want ziet, hij was dwalende in het veld); zo vraagde hem deze man, zeggende: Wat zoekt gij?", "16": "En hij zeide: Ik zoek mijn broederen; geef mij toch te kennen, waar zij weiden.", "17": "Zo zeide die man: Zij zijn van hier gereisd; want ik hoorde hen zeggen: Laat ons naar Dothan gaan. Jozef dan ging zijn broederen na, en vond hen te Dothan.", "18": "En zij zagen hem van verre; en eer hij tot hen naderde, sloegen zij tegen hem een listigen raad, om hem te doden.", "19": "En zij zeiden de een tot den ander: Ziet, daar komt die meesterdromer aan!", "20": "Nu komt dan, en laat ons hem doodslaan, en hem in een dezer kuilen werpen; en wij zullen zeggen: een boos dier heeft hem opgegeten; zo zullen wij zien, wat van zijn dromen worden zal.", "21": "Ruben hoorde dat, en verloste hem uit hun hand; en hij zeide: Laat ons hem niet aan het leven slaan.", "22": "Ook zeide Ruben tot hen: Vergiet geen bloed; werpt hem in dezen kuil die in de woestijn is, en legt de hand niet aan hem; opdat hij hem uit hun hand verloste, om hem tot zijn vader weder te brengen.", "23": "En het geschiedde, als Jozef tot zijn broederen kwam, zo togen zij Jozef zijn rok uit, den veelvervigen rok, dien hij aanhad.", "24": "En zij namen hem, en wierpen hem in den kuil; doch de kuil was ledig; er was geen water in.", "25": "Daarna zaten zij neder om brood te eten, en hieven hun ogen op, en zagen, en ziet, een reisgezelschap van Ismaëlieten kwam uit Gilead; en hun kemelen droegen specerijen en balsem, en mirre, reizende, om dat af te brengen naar Egypte.", "26": "Toen zeide Juda tot zijn broederen: Wat gewin zal het zijn, dat wij onzen broeder doodslaan, en zijn bloed verbergen?", "27": "Komt, en laat ons hem aan deze Ismaëlieten verkopen, en onze hand zij niet aan hem; want hij is onze broeder, ons vlees, en zijn broederen hoorden *hem*.", "28": "Als nu de Midianietische kooplieden voorbijtogen, zo trokken en hieven zij Jozef op uit den kuil, en verkochten Jozef aan deze Ismaëlieten voor twintig zilverlingen; die brachten Jozef naar Egypte.", "29": "Als nu Ruben tot den kuil wederkeerde, ziet, zo was Jozef niet in den kuil; toen scheurde hij zijn klederen.", "30": "En hij keerde weder tot zijn broederen, en zeide: De jongeling is er niet; en ik, waar zal ik heengaan?", "31": "Toen namen zij Jozefs rok, en zij slachtten een geitenbok, en zij doopten den rok in het bloed.", "32": "En zij zonden den veelvervigen rok, en deden hem tot hun vader brengen, en zeiden: Dezen hebben wij gevonden; beken toch, of deze uws zoons rok zij, of niet.", "33": "En hij bekende hem, en zeide: Het is mijns zoons rok! een boos dier heeft hem opgegeten! voorzeker is Jozef verscheurd!", "34": "Toen scheurde Jakob zijn klederen, en legde een zak om zijn lenden; en hij bedreef rouw over zijn zoon vele dagen.", "35": "En al zijn zonen, en al zijn dochteren maakten zich op, om hem te troosten; maar hij weigerde zich te laten troosten, en zeide: Want ik zal, rouw bedrijvende, tot mijn zoon in het graf nederdalen. Alzo beweende hem zijn vader.", "36": "En de Midianieten verkochten hem in Egypte, aan Potifar, een hoveling van Farao, overste der trawanten."}, "KJV": {"1": "And Jacob dwelt in the land wherein his father was a stranger, in the land of Canaan.", "2": "These *are* the generations of Jacob. Joseph, *being* seventeen years old, was feeding the flock with his brethren; and the lad *was* with the sons of Bilhah, and with the sons of Zilpah, his father's wives: and Joseph brought unto his father their evil report.", "3": "Now Israel loved Joseph more than all his children, because he *was* the son of his old age: and he made him a coat of *many* colours.", "4": "And when his brethren saw that their father loved him more than all his brethren, they hated him, and could not speak peaceably", "5": "And Joseph dreamed a dream, and he told *it* his brethren: and they hated him yet the more.", "6": "And he said unto them, Hear, I pray you, this dream which I have dreamed:", "7": "For, behold, we *were* binding sheaves in the field, and, lo, my sheaf arose, and also stood upright; and, behold, your sheaves stood round about, and made obeisance to my sheaf.", "8": "And his brethren said to him, Shalt thou indeed reign over us? or shalt thou indeed have dominion over us? And they hated him yet the more for his dreams, and for his words.", "9": "And he dreamed yet another dream, and told it his brethren, and said, Behold, I have dreamed a dream more; and, behold, the sun and the moon and the eleven stars made obeisance", "10": "And he told *it* to his father, and to his brethren: and his father rebuked him, and said unto him, What *is* this dream that thou hast dreamed? Shall I and thy mother and thy brethren indeed come to bow down ourselves to thee to the earth?", "11": "And his brethren envied him; but his father observed the saying.", "12": "And his brethren went to feed their father's flock in Shechem.", "13": "And Israel said unto Joseph, Do not thy brethren feed *the flock* in Shechem? come, and I will send thee unto them. And he said", "14": "And he said to him, Go, I pray thee, see whether it be well with thy brethren, and well with the flocks; and bring me word again. So he sent him out of the vale of Hebron, and he came to Shechem.", "15": "And a certain man found him, and, behold, *he was* wandering in the field: and the man asked him, saying, What seekest", "16": "And he said, I seek my brethren: tell me, I pray thee, where they feed", "17": "And the man said, They are departed hence; for I heard them say, Let us go to Dothan. And Joseph went after his brethren, and found them in Dothan.", "18": "And when they saw him afar off, even before he came near unto them, they conspired against him to slay", "19": "And they said one to another, Behold, this dreamer cometh.", "20": "Come now therefore, and let us slay him, and cast him into some pit, and we will say, Some evil beast hath devoured him: and we shall see what will become of his dreams.", "21": "And Reuben heard *it*, and he delivered him out of their hands; and said, Let us not kill", "22": "And Reuben said unto them, Shed no blood, *but* cast him into this pit that *is* in the wilderness, and lay no hand upon him; that he might rid him out of their hands, to deliver him to his father again.", "23": "And it came to pass, when Joseph was come unto his brethren, that they stript Joseph out of his coat, *his* coat of *many* colours", "24": "And they took him, and cast him into a pit: and the pit *was* empty, *there was* no water", "25": "And they sat down to eat bread: and they lifted up their eyes and looked, and, behold, a company of Ishmeelites came from Gilead with their camels bearing spicery and balm and myrrh, going to carry *it* down to Egypt.", "26": "And Judah said unto his brethren, What profit *is it* if we slay our brother, and conceal his blood?", "27": "Come, and let us sell him to the Ishmeelites, and let not our hand be upon him; for he *is* our brother *and* our flesh. And his brethren were content.", "28": "Then there passed by Midianites merchantmen; and they drew and lifted up Joseph out of the pit, and sold Joseph to the Ishmeelites for twenty *pieces* of silver: and they brought Joseph into Egypt.", "29": "And Reuben returned unto the pit; and, behold, Joseph *was* not in the pit; and he rent his clothes.", "30": "And he returned unto his brethren, and said, The child *is* not; and I, whither shall I go?", "31": "And they took Joseph's coat, and killed a kid of the goats, and dipped the coat in the blood;", "32": "And they sent the coat of *many* colours, and they brought *it* to their father; and said, This have we found: know now whether it *be* thy son's coat", "33": "And he knew it, and said, *It is* my son's coat; an evil beast hath devoured him; Joseph is without doubt rent in pieces.", "34" Egypte; en wat het linnen garen betreft, de kooplieden van de koning namen het linnen garen voor een vaste prijs.", "Jer 32:44": "Velden zal men voor geld kopen, en de brieven ondertekenen en verzegelen, en getuigen doen bevestigen, in het land van Benjamin, en in de plaatsen rondom Jeruzalem, en in de steden van Juda, en in de steden van het gebergte, en in de steden van de laagvlakte, en in de steden van het zuiden; want Ik zal hun gevangenschap ten goede keren, spreekt de HEERE.", "Hoogl 8:6": "Zet mij als een zegel op Uw hart, als een zegel op Uw arm; want de liefde is sterk als de dood; de ijver is hard als het graf; haar kolen zijn vurige kolen, vlammen van de Heere.", "Ps 49:16": "Maar God zal mijn ziel uit de macht van het graf verlossen, want Hij zal mij opnemen. Sela.", "Jer 41:5": "Zo kwamen er mannen van Sichem, van Silo, en van Samaria, tachtig man, met de baard afgeschoren, en de kleren gescheurd, en zichzelf gesneden; en spijsoffer en wierook waren in hun hand, om naar het huis van de HEERE te brengen.", "Joz 14:15": "De naam van Hebron was vroeger Kirjath-Arba; die Arba een groot man geweest is onder de Enakieten. En het land had rust van de oorlog.", "Jes 13:10": "Want de sterren van de hemel en zijn sterrenbeelden zullen hun licht niet laten schijnen; de zon zal verduisterd worden wanneer zij opgaat, en de maan zal haar licht niet laten schijnen.", "Ezech 27:13": "Javan, Tubal en Mesech waren uw kooplieden; met mensenzielen en koperen vaten dreven zij onderlinge handel met u.", "1 Kor 11:18": "Want eerst, als u samenkomt in de Gemeente, hoor ik dat er scheuringen onder u zijn; en ik geloof het ten dele;", "1 Kor 1:11": "Want mij is over u bekendgemaakt, mijn broeders, door hen die van het huisgezin van Chloë zijn, dat er twisten onder u zijn.", "Ps 106:16": "En zij benijdden Mozes in het leger, en Aäron, de heilige van de HEERE.", "Matt 27:40-42": "en zeiden: U Die de tempel afbreekt en in drie dagen opbouwt, verlos Uzelf. Als U de Zoon van God bent, kom dan van het kruis af. En evenzo zeiden ook de overpriesters, met de schriftgeleerden en oudsten, en Farizeeën, terwijl zij Hem bespotten: Anderen heeft Hij verlost, Zichzelf kan Hij niet verlossen. Als Hij de Koning van Israël is, laat Hij nu van het kruis afkomen, en wij zullen Hem geloven.", "Gen 44:14": "En Juda kwam met zijn broers in het huis van Jozef; want hij was daar nog zelf; en zij vielen voor zijn gezicht neer op de grond.", "Num 3:48-51": "En u zult dat geld aan Aäron en zijn zonen geven, het geld van de gelosten die onder hen overschieten. Toen nam Mozes dat losgeld van degenen, die overschoten boven de gelosten door de Levieten. Van de eerstgeborenen van de kinderen van Israël nam hij dat geld, duizend driehonderdvijfenzestig sikkels, naar de sikkel van het heiligdom.", "1 Kon 2:6": "Doe dan naar uw wijsheid, en laat zijn grijze hoofd niet in vrede naar het graf afdalen.", "Dan 8:10": "En hij werd groot tot aan het leger van de hemel; en hij wierp sommigen van dat leger, namelijk van de sterren, neer ter aarde, en vertrapte ze.", "Ps 14:4": "Hebben dan alle werkers van de ongerechtigheid geen kennis, die mijn volk opeten alsof zij brood aten? Zij roepen de HEERE niet aan.", "Gen 42:22": "En Ruben antwoordde hun en zei: Heb ik het niet tegen u gezegd toen ik zei: Zondig niet tegen deze jongen! Maar u hoorde niet; en ook zijn bloed, zie, het wordt opgeëist!", "Ezra 9:3": "Toen ik deze zaak hoorde, scheurde ik mijn kleed en mijn mantel; en ik trok het haar van mijn hoofd en van mijn baard uit, en zat verbaasd neer.", "Ex 21:11": "En als hij haar deze drie dingen niet doet, zal zij om niet uitgaan, zonder geld.", "Mark 14:11": "En zij, die dit hoorden, waren verblijd, en beloofden hem geld te geven; en hij zocht hoe hij Hem op een geschikt moment kon overleveren.", "Joh 18:4": "Jezus dan, die alles wist wat over Hem komen zou, ging naar buiten en zei tegen hen: Wie zoekt u?", "Lev 27:15": "En als hij die het geheiligd heeft, zijn huis wil afkopen, dan zal hij een vijfde deel van het geld van uw schatting daarboven toevoegen, en het zal zijn eigendom zijn.", "Luk 19:23": "Waarom hebt u dan mijn geld niet bij de bank gebracht, zodat ik het bij mijn komst met rente had kunnen opeisen?", "Mark 15:29": "En zij die voorbijkwamen, lasterden Hem, en schudden hun hoofden, en zeiden: Ha! U die de tempel afbreekt, en in drie dagen opbouwt,", "Deut 17:8": "Wanneer een zaak voor het gericht u te zwaar zal zijn, tussen bloed en bloed, tussen rechtszaak en rechtszaak, tussen de ene plaag en de andere plaag, geschillen in uw poorten, dan moet u opstaan en gaan naar de plaats die de HEERE, uw God, zal uitkiezen;", "Gen 44:28": "En de één is bij mij weggegaan, en ik heb gezegd: Voorzeker, hij is zeker verscheurd! En ik heb hem niet meer gezien tot nu toe.", "Ezech 24:7": "Want haar bloed is in haar midden; op een gladde rots heeft zij het gelegd; zij heeft het niet op de aarde uitgestort, om het met stof te bedekken.", "Gen 41:43": "En hij liet hem rijden op de tweede wagen die hij had; en zij riepen voor hem uit: Kniel! Zo stelde hij hem over heel Egypteland.", "Jer 29:7": "En zoekt de vrede van de stad waarheen Ik u gevankelijk heb laten wegvoeren, en bidt voor haar tot de HEERE; want in haar vrede zult u vrede hebben.", "Num 14:6": "En Jozua, de zoon van Nun, en Kaleb, de zoon van Jefunne, die bij hen waren die dat land verspied hadden, scheurden hun kleren.", "1 Sam 17:17": "En Isaï zei tegen zijn zoon David: Neem toch voor uw broers een efa van dit geroosterde koren, en deze tien broden, en breng ze snel naar het leger, naar uw broers.", "Ps 77:3": "Ten dage van mijn benauwdheid zocht ik de Heere; mijn hand was 's nachts uitgestrekt, en liet niet af; mijn ziel weigerde getroost te worden.", "Gen 16:11": "Ook zei de Engel van de HEERE tegen haar: Zie, u bent zwanger, en zult een zoon baren, en u zult zijn naam Ismaël noemen, omdat de HEERE uw verdrukking gehoord heeft.", "Joh 4:5": "Hij kwam dan in een stad van Samaria, genaamd Sichar, dicht bij het stuk land dat Jakob aan zijn zoon Jozef gaf.", "Rom 6:21": "Wat voor vrucht had u toen van die dingen waarover u zich nu schaamt? Want het einde daarvan is de dood.", "Hand 14:14": "Maar toen de apostelen Barnabas en Paulus dit hoorden, scheurden zij hun kleren, en sprongen onder de menigte, en riepen:", "Ps 83:7": "de tenten van Edom en de Ismaëlieten, Moab en de Hagarenen;", "Deut 14:25": "Zo maak het tot geld, en bind het geld in uw hand, en ga naar de plaats die de HEERE, uw God, zal uitkiezen;", "Jer 39:9": "Het overige nu van het volk, dat in de stad was overgebleven, en de overlopers, die naar hem overgelopen waren, met het overige van het volk, dat overgebleven was, voerde Nebuzaradan, de aanvoerder van de lijfwacht, gevankelijk naar Babel.", "Gen 22:1": "Het gebeurde na deze dingen dat God Abraham beproefde; en Hij zei tegen hem: Abraham! En hij zei: Zie, hier ben ik!", "Ps 94:21": "Zij rotten samen tegen de ziel van de rechtvaardige, en zij veroordelen onschuldig bloed.", "Klaagl 3:52-55": "Tsade. Zij die mijn vijanden zijn zonder oorzaak, hebben mij als een vogeltje dapper gejaagd. Tsade. Zij hebben mijn leven in een kuil uitgeroeid, en zij hebben een steen op mij geworpen. Tsade. Het water zwom over mijn hoofd; ik zei: Ik ben afgesneden!", "Jes 36:22": "Toen kwam Eljakim, de zoon van Hilkia, de hofmeester, en Sebna, de schrijver, en Joah, de zoon van Asaf, de kanselier, naar Hizkia met gescheurde kleren; en zij vertelden hem de woorden van Rabsake.", "Neh 3:32": "En tussen de bovenzaal van het punt tot de Schaapspoort toe, verbeterden de goudsmeden en de kruideniers.", "Ps 35:7": "Want zij hebben zonder oorzaak de groeve van hun net voor mij verborgen; zij hebben zonder oorzaak gegraven voor mijn ziel.", "Ps 30:4": "HEERE! U hebt mijn ziel uit het graf opgevoerd; U hebt mij bij het leven behouden, zodat ik niet in de kuil neerdaalde.", "Ex 2:14": "Hij dan zei: Wie heeft u tot een leider en rechter over ons gezet? Wilt u mij doden, zoals u de Egyptenaar gedood hebt? Toen werd Mozes bang, en zei: Zeker, deze zaak is bekend geworden!", "Gen 44:13": "Toen scheurden zij hun kleren, en ieder man laadde zijn ezel weer op, en zij keerden terug naar de stad.", "Gen 41:16": "En Jozef antwoordde Farao: Het is niet aan mij! God zal Farao welzijn aanzeggen.", "Jes 55:1": "O, alle dorstigen, kom tot de wateren, en u die geen geld heeft, kom, koop en eet, ja kom, koop zonder geld en zonder prijs, wijn en melk!", "Luk 19:14": "Maar zijn burgers haatten hem, en stuurden gezanten achter hem aan, die zeiden: Wij willen niet dat deze man koning over ons wordt.", "Joël 3:6": "En u hebt de kinderen van Juda en de kinderen van Jeruzalem verkocht aan de kinderen van de Grieken, om hen ver van hun grondgebied te brengen.", "Ezra 7:17": "opdat u spoedig voor dat geld runderen, rammen, lammeren koopt, met hun spijsoffers, en hun drankoffers, en die offert op het altaar van het huis van uw God, dat te Jeruzalem is.", "Num 31:3": "Mozes dan sprak tot het volk en zei: Laat mannen uit u zich ten strijde toerusten, en laat hen tegen de Midianieten optrekken, om de wraak van de HEERE te voltrekken aan de Midianieten.", "Hand 8:20": "Maar Petrus zei tegen hem: Laat uw geld met u verloren gaan, omdat u gemeend hebt dat de gave van God door geld verkregen wordt!", "Openb 18:23": "En het licht van de lamp zal in u niet meer schijnen; en de stem van een bruidegom en van een bruid zal in u niet meer gehoord worden; want uw kooplieden waren de groten van de aarde, want door uw toverij zijn alle volken misleid geweest.", "Job 6:19": "De reizigers van Thema zien ze, de wandelaars van Scheba wachten op haar.", "Ps 37:12": "Zain. De goddeloze bedenkt listige plannen tegen de rechtvaardige, en knerst met zijn tanden over hem.", "Gen 39:1": "Jozef werd naar Egypte afgevoerd; en Potifar, een hoveling van de farao, een aanvoerder van de lijfwacht, een Egyptisch man, kocht hem van de Ismaëlieten, die hem daarheen afgevoerd hadden.", "2 Kon 6:30": "En het gebeurde, toen de koning de woorden van deze vrouw gehoord had, dat hij zijn kleren scheurde, terwijl hij over de muur voortging; en het volk zag dat er, zie, een zak van binnen over zijn vlees was.", "Jer 38:6": "Toen namen zij Jeremia en wierpen hem in de kuil van Malchia, de zoon van Hammelech, die in het voorhof van de bewaking was, en zij lieten Jeremia met touwen zakken; in de kuil nu was geen water, maar slijk; en Jeremia zonk in het slijk.", "Ps 105:17": "Hij zond een man voor hun aangezicht heen; Jozef werd verkocht tot een slaaf.", "Gen 48:11": "En Israël zei tegen Jozef: Ik had niet gedacht uw gezicht te zien; maar zie, God heeft mij ook uw nageslacht laten zien!", "Gen 25:32": "En Ezau zei: Zie, ik ga sterven; en wat heb ik dan aan het eerstgeboorterecht?", "1 Sam 17:18": "Maar breng deze tien melkkazen naar de aanvoerder over duizend; en u zult naar uw broers omzien, of het hun goed gaat, en u zult van hen een teken meenemen.", "Gen 24:31": "En hij zei: Kom binnen, gezegende van de HEERE! Waarom zou u buiten blijven staan? Want ik heb het huis gereedgemaakt, en de plaats voor de kamelen.", "Jer 41:8": "Doch onder hen werden tien mannen gevonden, die tegen Ismaël zeiden: Dood ons niet, want wij hebben verborgen schatten in het veld, van tarwe, en gerst, en olie, en honing. Zo liet hij af, en doodde hen niet te midden van hun broeders.", "Luk 2:44": "Maar zij dachten dat Hij bij het reisgezelschap was, en gingen een dagreis, en zochten Hem onder de familie en onder de bekenden.", "Gen 47:14-18": "Toen verzamelde Jozef al het geld dat in Egypteland en in het land Kanaän gevonden werd, voor het koren dat zij kochten; en Jozef bracht dat geld in het huis van Farao. Toen het geld uit Egypteland en uit het land Kanaän op was, kwamen alle Egyptenaren naar Jozef en zeiden: Geef ons brood; want waarom zouden wij in uw bijzijn sterven? Want het geld is op. En Jozef zei: Geef uw vee, dan zal ik u brood geven voor uw vee, als het geld op is.", "1 Kon 21:2": "Achab sprak tot Naboth en zei: Geef mij uw wijngaard, opdat hij mij tot een kruidhof zij, omdat hij dicht bij mijn huis is; en ik zal u ervoor een wijngaard geven die beter is dan die; of, als het goed is in uw ogen, zal ik u de waarde ervan in geld geven.", "Joh 1:39": "Wat zoekt u? En zij zeiden tegen Hem: Rabbi! (wat vertaald betekent: Meester) waar woont U?", "Ps 88:7": "U hebt mij in de onderste kuil gelegd, in duisternissen, in diepten.", "Ef 6:1-3": "U kinderen, wees uw ouders gehoorzaam in de Heere; want dat is recht. Eer uw vader en moeder (dat is het eerste gebod met een belofte), opdat het u goed gaat, en u lang leeft op de aarde.", "Matt 28:15": "En zij namen het geld, en deden zoals hun geleerd was. En dit verhaal is onder de Joden verspreid geraakt tot op deze huidige dag.", "Joh 13:23": "En een van Zijn discipelen, die Jezus liefhad, lag aan tafel dicht bij Jezus.", "Gen 25:2": "En zij baarde hem Zimran en Joksan, en Medan en Midian, en Jisbak en Suah.", "1 Kon 2:33": "Zo zal hun bloed terugkeren op het hoofd van Joab, en op het hoofd van zijn nakomelingen voor eeuwig; maar David, en zijn nakomelingen, en zijn huis, en zijn troon zal vrede hebben van de HEERE tot in eeuwigheid.", "Ex 22:7": "Wanneer iemand aan zijn naaste geld of voorwerpen geeft om te bewaren, en het wordt uit het huis van die man gestolen, en de dief wordt gevonden, dan moet hij het dubbel teruggeven.", "Richt 5:19": "De koningen kwamen, zij streden; toen streden de koningen van Kanaän, te Thaanach aan het water van Megiddo; zij brachten geen winst van het zilver daarvan.", "Spr 14:15": "De onnozele gelooft elk woord; maar de kloekzinnige let goed op zijn gang.", "Hand 7:16": "En zij werden overgebracht naar Sichem, en gelegd in het graf, dat Abraham gekocht had voor een som geld, van de zonen van Hemor, de vader van Sichem.", "Gen 27:29": "Volken zullen u dienen, en volken zullen zich voor u neerbuigen; wees heer over uw broers, en de zonen van uw moeder zullen zich voor u neerbuigen! Vervloekt moet hij zijn, wie u vervloekt; en wie u zegent, zij gezegend!", "Luk 2:51": "En Hij ging met hen mee naar beneden, en kwam in Nazareth, en was hun onderdanig. En Zijn moeder bewaarde al deze dingen in haar hart.", "Hand 13:45": "Doch de Joden, die de menigten zagen, werden vervuld met afgunst, en weerspraken wat door Paulus gezegd werd, en tegenspraken en lasterden.", "Joël 2:13": "En scheurt uw hart en niet uw kleren, en bekeert u tot de HEERE, uw God; want Hij is genadig en barmhartig, geduldig en groot van goedertierenheid, en Hij heeft berouw over het kwade.", "1 Kon 21:6": "En hij zei tegen haar: Omdat ik tot Naboth, de Jizreëliet, gesproken heb en tegen hem gezegd heb: Geef mij uw wijngaard voor geld, of, als het u zint, zal ik u een andere wijngaard in zijn plaats geven; maar hij heeft gezegd: Ik zal u mijn wijngaard niet geven.", "Gen 43:14": "En God, de Almachtige, geve u barmhartigheid bij die man, dat hij uw andere broer en Benjamin met u laat teruggaan! En wat mij aangaat, als ik van mijn kinderen beroofd word, dan ben ik maar beroofd!", "Tit 3:3": "Want ook wij waren vroeger onverstandig, ongehoorzaam, dwalend, en dienden aan allerlei begeerten en genoegens; wij leefden in slechtheid en afgunst, waren hatelijk en haatten elkaar.", "Gen 9:5": "En zeker, Ik zal uw bloed, het bloed van uw zielen, opeisen; van de hand van elk dier zal Ik het opeisen; ook van de hand van de mens, van de hand van ieders broeder zal Ik de ziel van de mens opeisen.", "Gen 42:31": "Maar wij zeiden tegen hem: Wij zijn eerlijke mensen; wij zijn geen verspieders.", "Gen 42:38": "Maar hij zei: Mijn zoon zal niet met u meegaan; want zijn broer is dood, en hij is alleen overgebleven; als hem een ongeluk zou overkomen op de weg die u zult gaan, dan zou u mijn grijze haren met verdriet naar het graf doen afdalen.", "Gen 40:5": "Zij droomden nu beiden een droom, elk zijn eigen droom, in één nacht, elk met zijn eigen uitleg, de schenker en de bakker van de koning van Egypte, die gevangen zaten in de gevangenis.", "Matt 25:18": "Maar hij die het ene ontvangen had, ging weg en groef in de aarde, en verborg het geld van zijn heer.", "Gen 25:1-4": "En Abraham ging verder, en nam een vrouw, wier naam Ketura was. En zij baarde hem Zimran en Joksan, en Medan en Midian, en Jisbak en Suah. En Joksan verwekte Seba en Dedan; en de zonen van Dedan waren de Assurieten, en Letusieten, en Leummieten.", "Joh 17:14": "Ik heb hun Uw woord gegeven; en de wereld heeft hen gehaat, omdat zij niet van de wereld zijn, zoals Ik niet van de wereld ben.", "Gen 22:12": "Toen zei Hij: Strek uw hand niet uit naar de jongen, en doe hem niets! Want nu weet Ik dat u God vrezend bent, en uw zoon, uw enige, niet van Mij hebt onthouden.", "Ex 24:11": "Doch Hij strekte Zijn hand niet tot de aanzienlijken van de kinderen Israëls; maar zij aten en dronken, nadat zij God gezien hadden.", "2 Sam 1:16": "En David zei tegen hem: Uw bloed komt op uw hoofd; want uw mond heeft tegen u getuigd, toen u zei: ik heb de gezalfde van de HEERE gedood.", "Gen 37:21-30": "Ruben hoorde dat en verloste hem uit hun hand, en hij zei: Laten wij hem niet aan het leven slaan. Ook zei Ruben tegen hen: Vergiet geen bloed; werpt hem in deze kuil die in de woestijn is, en legt de hand niet aan hem; opdat hij hem uit hun hand zou verlossen, om hem tot zijn vader terug te brengen. En het gebeurde, toen Jozef bij zijn broers kwam, dat zij Jozef zijn rok uittrokken, de veelkleurige rok die hij aanhad.", "Matt 28:12": "En zij kwamen samen met de oudsten, en namen samen een besluit, en gaven de soldaten veel geld,", "2 Sam 13:37": "(Absalom nu vluchtte, en ging naar Thalmai, de zoon van Ammihur, koning van Gesur.) En hij droeg rouw over zijn zoon, al die dagen.", "Ex 12:44": "Doch elke knecht van iemand, die voor geld gekocht is, nadat u hem besneden zult hebben, dan mag hij daarvan eten.", "1 Sam 25:23": "Toen Abigaïl nu David zag, haastte zij zich, en kwam van de ezel af, en zij viel voor het aangezicht van David op haar aangezicht, en zij boog zich ter aarde.", "Lev 27:18": "Maar als hij zijn akker na het jubeljaar geheiligd heeft, dan zal de priester hem het geld berekenen naar de jaren die nog overblijven tot het jubeljaar, en het zal van uw schatting afgetrokken worden.", "Gen 36:7": "Want hun bezit was te veel om samen te wonen; en het land van hun vreemdelingschap kon hen niet dragen vanwege hun vee.", "Gen 44:31": "Dan zal het gebeuren, als hij ziet dat de jongen er niet is, dat hij sterft; en uw knechten zullen de grijze haren van uw knecht, onze vader, met verdriet naar het graf doen afdalen.", "Gen 37:18-20": "En zij zagen hem van verre; en voordat hij bij hen kwam, smeedden zij een listig plan tegen hem, om hem te doden. En zij zeiden de een tegen de ander: Zie, daar komt die meesterdromer aan! Nu dan, komt, laten wij hem doodslaan en hem in een van deze kuilen werpen; en wij zullen zeggen: Een wild dier heeft hem opgegeten! Zo zullen wij zien wat er van zijn dromen worden zal.", "Luk 19:42": "en zei: Och, had u ook maar geweten, ook nog op deze dag van u, wat tot uw vrede dient! Maar nu is het verborgen voor uw ogen.", "Gen 48:22": "En ik heb u één stuk land gegeven, boven uw broers; dat ik met mijn zwaard en met mijn boog uit de hand van de Amorieten genomen heb.", "Hand 7:9-14": "En de aartsvaders, jaloers geworden, verkochten Jozef om naar Egypte gebracht te worden; maar God was met hem, en verloste hem uit al zijn verdrukkingen, en gaf hem genade en wijsheid voor Farao, de koning van Egypteland; en hij stelde hem aan als leider over Egypte en zijn hele huis. En er kwam een hongersnood over het hele land van Egypte en Kanaän, en grote nood; en onze vaders vonden geen voedsel.", "Gen 31:15": "Worden wij niet door hem als vreemden beschouwd? Want hij heeft ons verkocht, en hij heeft ook steeds ons geld verteerd.", "Nahum 3:16": "U hebt meer handelaars dan er sterren aan de hemel zijn; de kevers zullen invallen, en ervandaan vliegen.", "Amos 3:7": "Zeker, de Heere HEERE zal niets doen, tenzij Hij Zijn verborgenheid aan Zijn dienaren, de profeten, geopenbaard heeft.", "Richt 6:1-3": "Maar de Israëlieten deden wat slecht was in de ogen van de HEERE; daarom gaf de HEERE hen zeven jaar lang in de hand van de Midianieten. Toen de hand van de Midianieten sterk werd over Israël, maakten de Israëlieten voor zichzelf, vanwege de Midianieten, de holen die in de bergen zijn, en de spelonken, en de vestingen. Want het gebeurde, als Israël gezaaid had, dan kwamen de Midianieten op, en de Amalekieten, en zij die uit het oosten kwamen, kwamen ook tegen hen op.", "Matt 25:27": "Dan had u mijn geld naar de wisselaars moeten brengen, en zou ik bij mijn komst het mijne met rente teruggekregen hebben.", "Amos 8:6": "Zodat wij de armen voor geld mogen kopen, en de nooddruftige om een paar schoenen; en dan zullen wij het kaf van het koren verkopen.", "Matt 21:38": "Maar toen de landbouwers de zoon zagen, zeiden zij onder elkaar: Deze is de erfgenaam, kom, laten we hem doden en zijn erfenis voor onszelf houden.", "Gen 37:12-14": "En zijn broers gingen heen om de kudde van hun vader te weiden bij Sichem. Zo zei Israël tegen Jozef: Weiden uw broers niet bij Sichem? Kom, ik zal u naar hen toe zenden. En hij zei tegen hem: Zie, hier ben ik! En hij zei tegen hem: Ga toch heen, zie naar het welzijn van uw broers en naar het welzijn van de kudde, en breng mij een woord terug. Zo zond hij hem uit het dal Hebron, en hij kwam te Sichem.", "Gen 40:4": "En de leider van de lijfwacht stelde Jozef bij hen aan om hen te dienen; en zij waren enige dagen in bewaring.", "Gen 18:2": "En hij hief zijn ogen op en keek; en zie, daar stonden drie mannen tegenover hem; toen hij hen zag, liep hij hun tegemoet vanuit de deur van de tent, en boog zich tot op de grond.", "Gen 35:26": "En de zonen van Zilpa, Lea's dienstmaagd: Gad en Aser. Dit zijn de zonen van Jakob, die hem geboren zijn in Paddan-Aram.", "1 Sam 18:17": "Daarom zei Saul tegen David: Zie, mijn oudste dochter Merab zal ik u tot vrouw geven; alleen, wees mij een dapper man en voer de oorlogen van de HEERE. Want Saul zei: Laat mijn hand niet tegen hem zijn, maar laat de hand van de Filistijnen tegen hem zijn.", "Lev 22:11": "Maar wanneer de priester een mens met zijn geld gekocht zal hebben, die zal daarvan eten; en wie in zijn huis geboren is, die zullen van zijn voedsel eten.", "Luk 2:19": "Maar Maria bewaarde al deze woorden samen, en overlegde ze in haar hart.", "Num 31:8": "Daarbij doodden zij, behalve hun overige gesneuvelden, de koningen van de Midianieten: Evi, en Rekem, en Zur, en Hur, en Reba, vijf koningen van de Midianieten; ook doodden zij met het zwaard Bileam, de zoon van Beor.", "Gen 31:21": "En hij vluchtte, met alles wat van hem was, en hij maakte zich op, en trok de rivier over, en hij richtte zich naar het gebergte Gilead.", "Matt 27:42": "Anderen heeft Hij verlost, Zichzelf kan Hij niet verlossen. Als Hij de Koning van Israël is, laat Hij nu van het kruis afkomen, en wij zullen Hem geloven.", "1 Sam 24:21": "En nu, zie, ik weet dat u zeker koning worden zult, en dat het koninkrijk van Israël in uw hand bestaan zal.", "Num 13:22": "En zij trokken op in het zuiden, en kwamen tot Hebron toe, en daar waren Ahiman, Sesai en Talmai, kinderen van Enak; Hebron nu was zeven jaar eerder gebouwd dan Zoan in Egypte.", "Gen 39:17": "Toen sprak zij tot hem met diezelfde woorden, en zei: De Hebreeuwse knecht die u ons hebt binnengebracht, is bij mij gekomen, om met mij te spotten.", "Amos 6:6": "Die wijn uit schalen drinken, en zich zalven met de beste olie, maar zich niet bekommeren over de verbreking van Jozef.", "Ps 40:3": "En Hij heeft mij uit een ruisende kuil, uit modderig slijk opgehaald, en heeft mijn voeten op een rotssteen gesteld, Hij heeft mijn gangen vastgemaakt.", "Jer 51:8": "Plotseling is Babel gevallen en verbroken; huil over haar, neem balsem voor haar pijn, misschien zal zij genezen worden.", "Jes 52:3": "Want zo zegt de HEERE: U bent voor niets verkocht, u zult ook zonder geld vrijgekocht worden.", "Matt 27:18": "Want hij wist dat zij Hem uit afgunst overgeleverd hadden.", "1 Kon 16:24": "En hij kocht de berg Samaria van Semer, voor twee talenten van het zilver, en bebouwde de berg; en noemde de naam van de stad die hij bouwde, naar de naam van Semer, de heer van de berg, Samaria.", "2 Kon 22:9": "Daarna kwam Safan, de schrijver, bij de koning, en bracht de koning verslag terug, en hij zei: Uw dienaren hebben het geld dat in het huis gevonden was bij elkaar gebracht, en hebben het gegeven in de hand van de opzichters van het werk, die aangesteld waren over het huis van de HEERE.", "Deut 24:7": "Wanneer iemand gevonden wordt die een mens steelt uit zijn broeders, uit de kinderen van Israël, en met hem handelt als koopwaar, en hem verkoopt; dan zal die dief sterven, en u zult het kwaad uit uw midden wegdoen.", "Gen 17:13": "Degene die in uw huis geboren is, en degene die met uw geld gekocht is, zal zeker besneden worden; en Mijn verbond zal in uw vlees zijn, tot een eeuwig verbond.", "Matt 27:24": "Toen Pilatus nu zag dat hij niets bereikte, maar dat er juist meer oproer kwam, nam hij water en waste zijn handen voor de menigte, en zei: Ik ben onschuldig aan het bloed van deze Rechtvaardige; u moet maar toezien.", "Matt 26:15": "en zei: Wat wilt u mij geven, en ik zal Hem aan u overleveren? En zij hebben hem dertig zilveren munten toegezegd.", "Job 24:19": "De droogte alsook de hitte nemen de sneeuwwateren weg; zo neemt het graf hen weg die gezondigd hebben.", "2 Sam 13:31": "Toen stond de koning op, en scheurde zijn kleren, en ging op de grond liggen; en al zijn knechten stonden erbij met gescheurde kleren.", "Openb 18:3": "Omdat alle volken hebben gedronken van de wijn van de toorn van haar hoererij, en de koningen van de aarde met haar gehoereerd hebben, en de kooplieden van de aarde rijk zijn geworden uit de kracht van haar weelde.", "Jer 8:22": "Is er geen balsem in Gilead? Is er geen heelmeester daar? Want waarom is de genezing van de dochter van mijn volk niet gekomen?", "Gen 42:4": "Maar Benjamin, Jozefs broer, stuurde Jakob niet met zijn broers mee; want hij zei: Anders overkomt hem misschien een ongeluk!", "Richt 4:22": "En zie, Barak achtervolgde Sisera; en Jaël ging naar buiten hem tegemoet, en zei tegen hem: Kom, en ik zal u de man wijzen die u zoekt. Zo kwam hij bij haar binnen, en zie, Sisera lag dood, en de pin was in zijn slaap.", "Hos 13:14": "Toch zal Ik hen verlossen van de macht van het graf, Ik zal hen vrijmaken van de dood: o dood, waar zijn uw pestilentiën? Graf, waar is uw verderf? Berouw zal voor Mijn ogen verborgen zijn,", "Est 3:15": "De lopers gingen uit, aangespoord door het woord van de koning, en de wet werd uitgegeven in de burcht Susan. En de koning en Haman gingen zitten om te drinken, doch de stad Susan was in verwarring.", "Job 21:13": "In het goede verslijten zij hun dagen; en in een ogenblik dalen zij af in het graf.", "Matt 27:9": "Toen is vervuld wat gesproken is door de profeet Jeremia, die zei: En zij hebben de dertig zilverstukken genomen, de prijs van Hem Die gewaardeerd was, op wie de kinderen van Israël een waarde gesteld hadden;", "Pred 4:4": "Verder zag ik al de moeite en alle bekwaamheid van het werk, dat het de mens jaloezie van zijn naaste aanbrengt. Dat is ook vluchtigheid en najagen van de wind.", "Gen 35:25": "En de zonen van Bilha, Rachels dienstmaagd: Dan en Naftali.", "Ezech 27:21-36": "Arabië en alle vorsten van Kedar waren de kooplieden van uw hand; met lammeren, en rammen, en bokken, daarmee handelden zij met u. De kooplieden van Scheba en Raëma waren uw kooplieden; met alle hoofdspecerij, en met alle kostbaar gesteente en goud, handelden zij op uw markten. Haran, en Kanne, en Eden, de kooplieden van Scheba, Assur en Kilmad, handelden met u.", "Mark 15:29-32": "En zij die voorbijkwamen, lasterden Hem, en schudden hun hoofden, en zeiden: Ha! U die de tempel afbreekt, en in drie dagen opbouwt, Red Uzelf, en kom van het kruis af. En evenzo zeiden ook de overpriesters, met de Schriftgeleerden, spottend tegen elkaar: Anderen heeft Hij verlost; Zichzelf kan Hij niet verlossen.", "2 Sam 1:2": "dat het op de derde dag gebeurde dat er, kijk, uit het leger van Saul een man kwam, wiens kleren gescheurd waren, en aarde was op zijn hoofd; en het gebeurde, toen hij bij David kwam, dat hij ter aarde viel en zich neerboog.", "Mark 5:22": "En zie, er kwam een van de leiders van de synagoge, van wie de naam Jaïrus was; en toen hij Hem zag, viel hij aan Zijn voeten,", "Gen 25:1": "En Abraham ging verder, en nam een vrouw, wier naam Ketura was.", "Matt 13:45": "Opnieuw, het Koninkrijk der hemelen is gelijk aan een koopman, die mooie parels zoekt;", "1 Kron 5:2": "want Juda werd machtig onder zijn broeders, en hij die tot een voorganger was, kwam uit hem; maar het eerstgeboorterecht was van Jozef.)", "Joh 7:7": "De wereld kan u niet haten, maar Mij haat zij, omdat Ik van haar getuig dat haar werken slecht zijn.", "Ps 105:25": "Hij keerde hun hart om, zodat zij Zijn volk haatten, dat zij met Zijn knechten listig omgingen.", "Job 17:13": "Als ik wacht, het graf zal mijn huis wezen; in de duisternis zal ik mijn bed spreiden.", "Gen 44:29": "Als u nu deze ook van mijn gezicht wegneemt, en hem een ongeluk overkomt, zult u mijn grijze haren met verdriet naar het graf doen afdalen!", "1 Kon 10:2": "En zij kwam in Jeruzalem, met een zeer zwaar leger, met kamelen die specerijen droegen, en zeer veel goud, en kostbaar gesteente; en zij kwam bij Salomo, en sprak met hem over alles wat er in haar hart was.", "Ezech 16:16": "En u hebt van uw kleren genomen, en u geplekte hoogten gemaakt, en daarop gehoereerd; zoiets is niet gebeurd en zal niet gebeuren.", "Ps 45:14": "De Dochter van de Koning is geheel verheerlijkt van binnen; haar kleding is van gouden borduursel.", "1 Kon 3:5": "Te Gibeon verscheen de HEERE aan Salomo in een droom 's nachts, en God zei: Vraag wat Ik u geven zal.", "Luk 22:5": "En zij waren blij, en zijn het eens geworden dat zij hem geld zouden geven.", "Micha 3:11": "Haar hoofden rechtspreken om geschenken, en haar priesters leren om loon, en haar profeten waarzeggen om geld; nog steunen zij op de HEERE, en zeggen: Is de HEERE niet in ons midden? Ons zal geen kwaad overkomen.", "Gen 31:23": "Toen nam hij zijn broeders met zich mee, en achtervolgde hem, een reis van zeven dagen, en hij haalde hem in op het gebergte van Gilead.", "2 Kon 23:35": "En Jojakim gaf dat zilver en dat goud aan Farao; doch hij belastte het land, om dat geld naar het bevel van Farao te geven; ieder naar zijn aanslag eiste hij het zilver en goud af van het volk van het land, om aan Farao Necho te geven.", "2 Kron 34:9": "En zij kwamen bij Hilkia, de hogepriester, en zij gaven hem het geld dat naar het huis van God gebracht was, dat de Levieten die de drempel bewaakten, verzameld hadden uit de hand van Manasse en Efraïm, en uit heel het overblijfsel van Israël, en uit heel Juda en Benjamin, en waarmee zij naar Jeruzalem waren teruggekomen.", "Ps 141:7": "Onze beenderen zijn verstrooid bij de mond van het graf, zoals wanneer iemand op de aarde iets kloofde en verdeelde.", "1 Sam 10:27": "Doch de verdorven mensen zeiden: Wat zou deze man ons kunnen redden? En zij verachtten hem, en brachten hem geen geschenk. Doch hij deed alsof hij het niet hoorde.", "Gen 28:4": "En Hij geeft u de zegen van Abraham; aan u, en uw nageslacht met u, zodat u het land van uw vreemdelingschap erfelijk bezit, dat God aan Abraham gegeven heeft.", "Mark 14:1": "En het pascha, en het feest der ongezuurde broden, was na twee dagen. En de overpriesters en de Schriftgeleerden zochten hoe zij Hem door list konden grijpen en doden.", "Job 2:11": "Toen de drie vrienden van Job al dit kwaad hoorden dat over hem gekomen was, kwamen zij, ieder uit zijn eigen plaats: Elifaz, de Themaniet, en Bildad, de Suhiet, en Zofar, de Naämathiet; en zij waren het samen eens geworden dat zij zouden komen om hem te beklagen en om hem te troosten.", "Ezech 27:17": "Juda en het land Israël waren uw kooplieden; met tarwe van Minnit en Pannag, en honing, en olie, en balsem, dreven zij onderlinge handel met u.", "Jes 26:11": "HEERE, is Uw hand verhoogd, zij zien het niet; maar zij zullen het zien, en beschaamd worden, vanwege de ijver over Uw volk, ook zal het vuur Uw tegenstanders verteren.", "Job 1:20": "Toen stond Job op, en scheurde zijn mantel, en schoor zijn hoofd, en viel op de aarde, en boog zich neer;", "Hebr 10:29": "hoeveel zwaarder straf, denkt u, zal hij waard geacht worden, die de Zoon van God met voeten heeft getreden, en het bloed van het testament, waardoor hij geheiligd was, als onrein heeft beschouwd, en de Geest van de genade smaad heeft aangedaan?", "Spr 7:16": "Ik heb mijn bed met tapijtsieraad bedekt, met uitgehouwen werken, met fijn linnen van Egypte;", "2 Sam 15:32": "En het gebeurde, toen David tot op de hoogte kwam, waar hij God aanbad, zie, toen ontmoette Husai, de Archiet, hem, met zijn kleed gescheurd, en aarde op zijn hoofd.", "Ps 30:10": "Wat gewin is er in mijn bloed, in mijn neerdalen tot de groeve? Zal het stof U loven? Zal het Uw waarheid verkondigen?", "Gen 23:7": "Toen stond Abraham op, en boog zich neer voor het volk van het land, voor de zonen van Heth;", "1 Joh 3:10": "Hierin zijn de kinderen van God en de kinderen van de duivel openbaar. Ieder die de rechtvaardigheid niet doet, is niet uit God; en ook wie zijn broeder niet liefheeft,", "Jes 37:1": "Het gebeurde nu, toen koning Hizkia dat hoorde, dat hij zijn kleren scheurde, en zich met een zak bedekte, en het huis van de HEERE inging.", "Spr 31:24": "Samech. Zij maakt fijn linnen en verkoopt het; en zij levert de koopman gordels.", "Jes 11:13": "En de nijd van Efraïm zal wegwijken, en de tegenstanders van Juda zullen uitgeroeid worden; Efraïm zal Juda niet benijden, en Juda zal Efraïm niet benauwen.", "Gen 31:43": "Toen antwoordde Laban en zei tegen Jakob: Deze dochters zijn mijn dochters, en deze zonen zijn mijn zonen, en deze kudde is mijn kudde, ja, alles wat u ziet, dat is van mij; en wat zou ik vandaag aan deze mijn dochters kunnen doen? Of aan hun zonen, die zij gebaard hebben?", "Gen 37:18-24": "En zij zagen hem van verre; en voordat hij bij hen kwam, smeedden zij een listig plan tegen hem, om hem te doden. En zij zeiden de een tegen de ander: Zie, daar komt die meesterdromer aan! Nu dan, komt, laten wij hem doodslaan en hem in een van deze kuilen werpen; en wij zullen zeggen: Een wild dier heeft hem opgegeten! Zo zullen wij zien wat er van zijn dromen worden zal.", "Ezra 9:5": "En rond het avondoffer stond ik op uit mijn bedruktheid, nadat ik mijn kleed en mijn mantel gescheurd had; en ik boog mij op mijn knieën, en breidde mijn handen uit tot de HEERE, mijn God;", "Est 7:4": "Want wij zijn verkocht, ik en mijn volk, om ons te verdelgen, te doden en om te brengen. Als wij nog tot knechten en tot dienstmaagden waren verkocht, zou ik gezwegen hebben, ofschoon de onderdrukker de schade van de koning geenszins zou kunnen vergoeden.", "Gen 5:1": "Dit is het boek van Adams geslacht. Op de dag dat God de mens schiep, maakte Hij hem naar de gelijkenis van God.", "Ps 49:15": "Men zet hen als schapen in het graf, de dood zal hen afweiden; en de oprechten zullen over hen heersen in die morgenstond; en het graf zal hun gedaante verslijten, elk uit zijn woning.", "Joh 15:19": "Als u van de wereld was, zou de wereld het hare liefhebben; maar omdat u van de wereld niet bent, maar Ik u uit de wereld heb uitverkoren, daarom haat de wereld u.", "Gen 48:10": "Doch de ogen van Israël waren wazig door ouderdom; hij kon niet goed zien; en hij liet hen naar zich toe komen; toen kuste hij hen, en omhelsde hen.", "Gen 45:26-28": "Toen berichtten zij hem, en zeiden: Jozef leeft nog, ja, hij is ook regeerder in heel Egypteland! Toen bezweek zijn hart, want hij geloofde hen niet. Maar toen zij tot hem gesproken hadden al de woorden van Jozef, die hij tot hen gesproken had, en dat hij de wagens zag, die Jozef gezonden had om hem te vervoeren, toen werd de geest van Jakob, hun vader, levendig. En Israël zei: Het is genoeg! Mijn zoon Jozef leeft nog! Ik zal gaan, en hem zien, voordat ik sterf!", "Dan 7:28": "Tot hiertoe is het einde van dit relaas. Wat mij, Daniël, aangaat, mijn gedachten verschrikten mij zeer, en mijn gelaatskleur veranderde; doch ik bewaarde dat woord in mijn hart.", "Gen 43:13": "Neem ook uw broer mee, en maak u op, ga terug naar die man.", "Gen 24:10": "En die knecht nam tien kamelen van de kamelen van zijn heer, en vertrok; en al het goed van zijn heer had hij bij zich; en hij stond op, en vertrok naar Mesopotamië, naar de stad van Nahor.", "Jes 23:2": "Zwijg, u inwoners van het eiland! U, die de kooplieden van Sidon, die over zee voeren, rijk maakten,", "Spr 30:16": "Het graf, de gesloten baarmoeder, de aarde die van water niet verzadigd wordt, en het vuur dat niet zegt: Het is genoeg!", "Ezech 27:21": "Arabië en alle vorsten van Kedar waren de kooplieden van uw hand; met lammeren, en rammen, en bokken, daarmee handelden zij met u.", "Hand 4:27": "Want in waarheid zijn tegen Uw heilig Kind Jezus, Die U gezalfd hebt, bijeengekomen, zowel Herodes en Pontius Pilatus, met de heidenen en de volken van Israël;", "2 Kon 6:19": "Toen zei Elisa tegen hen: Dit is de weg niet, en dit is de stad niet; volg mij, en ik zal u leiden tot de man die u zoekt; en hij leidde hen naar Samaria.", "Klaagl 5:4": "Ons water moeten wij voor geld drinken; ons hout komt ons op prijs te staan.", "Gen 23:16": "En Abraham luisterde naar Efron; en Abraham woog Efron het geld af, waarover hij gesproken had ten aanhoren van de zonen van Heth, vierhonderd sikkel van het zilver, gangbaar bij de koopman.", "Job 14:13": "Och, wilde U mij toch in het graf verbergen, mij verstoppen, totdat Uw toorn zich afkeerde; dat U mij een vaste tijd stelde, en aan mij zou denken!", "Gen 37:5-9": "Ook droomde Jozef een droom, die hij aan zijn broers vertelde; daarom haatten zij hem nog meer. En hij zei tegen hen: Hoor toch deze droom, die ik gedroomd heb. En zie, wij waren schoven aan het binden in het midden van het veld; en zie, mijn schoof stond op en bleef ook staande; en zie, uw schoven kwamen eromheen staan en bogen zich neer voor mijn schoof.", "Joh 7:3-5": "Zijn broers zeiden dan tegen Hem: Vertrek van hier en ga naar Judea, zodat ook Uw discipelen de werken kunnen zien die U doet. Want niemand doet iets in het verborgen als hij zelf zoekt om openlijk bekend te zijn. Als U deze dingen doet, laat Uzelf dan aan de wereld zien. Want ook Zijn broers geloofden niet in Hem.", "Jer 46:11": "Ga heen op naar Gilead, en haal balsem, jonkvrouw, dochter van Egypte! Tevergeefs vermenigvuldigt u de medicijnen, er is geen genezing voor u.", "Ps 130:2": "Heere! Hoor naar mijn stem; laat Uw oren opmerkzaam zijn op de stem van mijn smekingen.", "Ps 31:18": "HEERE! laat mij niet beschaamd worden, want ik roep U aan; laat de goddelozen beschaamd worden, laat hen zwijgen in het graf.", "Jak 3:14-16": "Maar als u bittere afgunst en eigenbelang in uw hart hebt, beroem u dan niet en lieg niet tegen de waarheid. Dat is de wijsheid niet die van boven komt, maar is aards, ongeestelijk, duivels. Want waar afgunst en eigenbelang is, daar is verwarring en allerlei kwade praktijk.", "Gen 42:6": "Jozef nu was regent over dat land; hij was het die aan al het volk van het land verkocht; en Jozefs broers kwamen, en bogen zich voor hem, met het gezicht ter aarde.", "Gen 37:25-36": "Daarna zaten zij neer om brood te eten, en zij hieven hun ogen op en zagen, en zie, een reisgezelschap van Ismaëlieten kwam uit Gilead; en hun kamelen droegen specerijen, balsem en mirre, op weg om dat naar Egypte te brengen. Toen zei Juda tegen zijn broers: Wat voor voordeel zal het zijn dat wij onze broer doodslaan en zijn bloed verbergen? Komt, laten wij hem aan deze Ismaëlieten verkopen, en onze hand zij niet aan hem; want hij is onze broer, ons vlees. En zijn broers stemden ermee in.", "Ps 69:5": "Die mij zonder oorzaak haten, zijn meer dan de haren van mijn hoofd; die mij zoeken te vernielen, die mij om valse oorzaken vijand zijn, zijn machtig geworden; wat ik niet geroofd heb, moet ik dan teruggeven.", "Gen 19:1": "En die twee engelen kwamen 's avonds in Sodom aan; en Lot zat in de poort van Sodom; en toen Lot hen zag, stond hij op om hun tegemoet te gaan, en boog zich met het gezicht ter aarde.", "Gen 43:11": "Toen zei Israël, hun vader, tegen hen: Is het nu zo, doe dan dit; neem van het beste fruit van dit land in uw zakken, en breng die man een geschenk mee: een weinig balsem, en een weinig honing, specerijen en mirre, terpentijnnoten en amandelen.", "Spr 1:11": "Als zij zeggen: Ga met ons, laat ons loeren op bloed, ons verstoppen tegen de onschuldige, zonder oorzaak;", "2 Kron 24:5": "Zo verzamelde hij de priesters en de Levieten, en zei tegen hen: Trek uit naar de steden van Juda, en verzamel geld van heel Israël, om het huis van uw God te herstellen van jaar tot jaar; en u, haast u met deze zaak; maar de Levieten haastten zich niet.", "Job 7:9": "Een wolk vergaat en vaart heen; zo zal hij die in het graf daalt, niet weer opkomen.", "1 Sam 2:22-24": "Doch Eli was zeer oud, en hoorde alles wat zijn zonen aan heel Israël deden, en dat zij sliepen bij de vrouwen die met velen samenkwamen bij de deur van de tent van de samenkomst. En hij zei tegen hen: Waarom doet u zulke dingen, dat ik deze uw slechte daden hoor van heel dit volk? Nee, mijn zonen; want dit is geen goed gerucht, dat ik hoor; u maakt dat het volk van de HEERE overtreedt.", "Gen 26:14-16": "En hij had bezit aan schapen, en bezit aan runderen, en een groot gezin; zodat de Filistijnen hem benijdden. En alle putten die de knechten van zijn vader in de dagen van zijn vader Abraham gegraven hadden, die stopten de Filistijnen dicht, en vulden ze met aarde. Ook zei Abimelech tegen Izak: Trek weg van ons; want u bent veel machtiger geworden dan wij.", "Joh 3:35": "De Vader heeft de Zoon lief en heeft alle dingen in Zijn hand gegeven.", "Gen 43:28": "En zij zeiden: Het gaat goed met uw dienaar, onze vader, hij leeft nog; en zij neigden het hoofd en bogen zich neer.", "Lev 25:51": "Als er nog veel van die jaren zijn, zal hij naar verhouding daarvan tot zijn lossing van het geld waarvoor hij gekocht is, teruggeven.", "Ps 15:5": "Die zijn geld niet uitleent tegen woeker, en geen geschenk aanneemt tegen de onschuldige. Wie deze dingen doet, zal niet wankelen in eeuwigheid.", "2 Kon 22:7": "Doch er werd met hen geen rekening gehouden van het geld dat in hun hand geleverd was, want zij handelden trouw.", "Gen 29:14": "Toen zei Laban tegen hem: Voorwaar, u bent mijn gebeente en mijn vlees! En hij bleef bij hem een volle maand.", "1 Kor 5:1": "Men hoort algemeen dat er hoererij onder u is, en wel zodanige hoererij die zelfs onder de heidenen niet genoemd wordt: dat iemand de vrouw van zijn vader heeft.", "Ps 45:15": "In gestikte kleren zal zij tot de Koning geleid worden; de jonge dochters, die achter haar zijn, haar gezellinnen, zullen tot u gebracht worden.", "2 Sam 12:17": "Toen kwamen de oudsten van zijn huis naar hem toe, om hem te laten opstaan van de aarde; maar hij wilde niet, en at ook geen brood met hen.", "Ezech 17:4": "Hij plukte de top van zijn jonge takjes af, en bracht hem in een land van koophandel; hij zette hem in een stad van kooplieden.", "1 Joh 4:20": "Als iemand zegt: Ik heb God lief, en haat zijn broeder, die is een leugenaar; want die zijn broeder niet liefheeft, die hij gezien heeft, hoe kan hij God liefhebben, Die hij niet gezien heeft?", "Gen 42:21": "Toen zeiden zij de één tegen de ander: Voorwaar, wij zijn schuldig aan onze broer, wiens angst van zijn ziel wij zagen, toen hij ons om genade smeekte; maar wij luisterden niet! Daarom komt deze benauwdheid over ons.", "Gen 44:19": "Mijn heer vroeg zijn knechten en zei: Hebt u een vader of broer?", "Spr 16:14": "De woede van de koning is als de boden van de dood; maar een wijs man zal die verzoenen.", "Ps 38:20": "Maar mijn vijanden leven, worden machtig; en die mij om valse redenen haten, worden groot in aantal.", "1 Kon 10:15": "behalve wat er binnenkwam van de kramers, en van de handel van de kruideniers, en van alle koningen van Arabië, en van de bestuurders van dat land.", "Job 40:25": "Zullen de metgezellen over hem een maaltijd bereiden? Zullen zij hem delen onder de kooplieden?", "Gen 44:27-29": "Toen zei uw knecht, mijn vader, tegen ons: U weet dat mijn vrouw mij twee zonen gebaard heeft. En de één is bij mij weggegaan, en ik heb gezegd: Voorzeker, hij is zeker verscheurd! En ik heb hem niet meer gezien tot nu toe. Als u nu deze ook van mijn gezicht wegneemt, en hem een ongeluk overkomt, zult u mijn grijze haren met verdriet naar het graf doen afdalen!", "Richt 7:14": "En zijn metgezel antwoordde en zei: Dit is niets anders dan het zwaard van Gideon, de zoon van Joas, de Israëlitische man; God heeft de Midianieten en dit hele leger in zijn hand gegeven.", "Matt 27:29": "en zij vlochten een kroon van doornen en zetten die op Zijn hoofd, en gaven Hem een rietstok in Zijn rechterhand; en zij vielen voor Hem op de knieën en bespotten Hem, en zeiden: Gegroet, Koning van de Joden!", "2 Kon 8:9": "Zo ging Hazaël hem tegemoet, en nam een geschenk mee, namelijk al het goede van Damaskus, een last van veertig kamelen; en hij kwam, en stond voor hem, en zei: Uw zoon Benhadad, de koning van Syrië, heeft mij naar u gezonden om te vragen: Zal ik van deze ziekte genezen?", "Joël 2:28": "En daarna zal het gebeuren, dat Ik Mijn Geest zal uitgieten over alle vlees, en uw zonen en uw dochters zullen profeteren; uw ouden zullen dromen dromen, uw jongelingen zullen gezichten zien;", "Matt 16:26": "Want wat baat het een mens, als hij de hele wereld wint, en schade lijdt aan zijn ziel? Of wat zal een mens geven, als losprijs voor zijn ziel?", "Ps 129:7": "waarmee de maaier zijn hand niet vult, en ook de garvenbinder zijn arm niet;", "Gen 50:3": "En veertig dagen werden aan hem vervuld; want zo worden de dagen vervuld van hen die gebalsemd worden; en de Egyptenaars beweenden hem zeventig dagen.", "Matt 26:65": "Toen scheurde de hogepriester zijn kleren en zei: Hij heeft God gelasterd, waarom hebben wij nog getuigen nodig? Zie, nu hebt u Zijn godslastering gehoord.", "1 Sam 2:6": "De HEERE doodt en maakt levend; Hij doet naar het graf neerdalen, en Hij doet weer opkomen.", "Openb 18:11": "En de kooplieden van de aarde zullen wenen en rouw bedrijven over haar, omdat niemand hun waren meer koopt;", "Gen 33:3": "En hij ging voor hen uit heen, en boog zich zeven keer ter aarde, totdat hij bij zijn broer kwam.", "2 Sam 12:9": "Waarom hebt u dan het woord van de HEERE veracht, door te doen wat kwaad is in Zijn ogen? U hebt Uria, de Hethiet, met het zwaard verslagen, en zijn vrouw hebt u tot uw vrouw genomen; en hem hebt u met het zwaard van de kinderen van Ammon gedood.", "Jes 5:19": "Die zeggen: Laat Hij haasten, laat Hij Zijn werk bespoedigen, opdat wij het zien; en laat het raadsbesluit van de Heilige van Israël naderen en komen, opdat wij het vernemen!", "Deut 21:14": "En het zal gebeuren, als u geen behagen meer in haar hebt, dat u haar zult laten gaan waarheen zij wil; maar u zult haar beslist niet voor geld verkopen, u zult geen handel met haar drijven, omdat u haar vernederd hebt.", "Neh 5:10": "Ik, mijn broeders en mijn knechten, vorderen wij ook geld en koren van hen? Laten wij toch deze last nalaten.", "Jes 60:6": "Een menigte kamelen zal u bedekken, de snelle kamelen van Midian en Hefa; zij allen uit Scheba zullen komen; goud en wierook zullen zij aanbrengen, en zij zullen de overvloedige lof van de HEERE verkondigen.", "Gen 23:9": "Dat hij mij de spelonk van Machpela geeft, die hij heeft, die aan het eind van zijn akker is; dat hij die mij voor het volle geld geeft, tot een eigen graf in het midden van u.", "Gen 41:32": "En dat die droom aan Farao voor de tweede keer herhaald is, komt omdat de zaak door God vast besloten is, en dat God zich haast om dat te doen.", "Gen 45:28": "En Israël zei: Het is genoeg! Mijn zoon Jozef leeft nog! Ik zal gaan, en hem zien, voordat ik sterf!", "2 Sam 13:19": "Toen nam Thamar as en strooide die op haar hoofd, en scheurde de veelkleurige mantel die zij aanhad; en zij legde haar hand op haar hoofd, en liep luid schreiend weg.", "2 Kon 5:8": "Maar het gebeurde, toen Elisa, de man van God, gehoord had dat de koning van Israël zijn kleren had gescheurd, dat hij naar de koning stuurde, om te zeggen: Waarom hebt u uw kleren gescheurd? Laat hem nu naar mij toe komen, dan zal hij weten dat er een profeet in Israël is.", "Dan 2:1": "In het tweede jaar van het koninkrijk van Nebukadnezar droomde Nebukadnezar dromen; daarvan raakte zijn geest verontrust, en zijn slaap week van hem.", "Luk 9:3": "En Hij zei tegen hen: Neem niets mee voor onderweg, geen stok, geen reistas, geen brood, geen geld; en niemand van u mag twee stel kleren hebben.", "Zach 11:12": "Want ik had tegen hen gezegd: Als het goed is in uw ogen, breng mijn loon, en zo niet, laat het na. En zij hebben mijn loon gewogen, dertig zilverlingen.", "Num 31:9": "Maar de kinderen van Israël namen de vrouwen van de Midianieten, en hun kinderen gevangen; zij roofden ook al hun beesten, en al hun vee, en al hun bezit.", "Gen 47:12": "En Jozef verzorgde zijn vader en zijn broers en het hele huis van zijn vader met brood, tot aan de kleinste kinderen toe.", "Lev 25:37": "Uw geld zult u hem niet op rente geven, en uw voedsel zult u niet op overwinst geven.", "Gal 5:21": "Afgunst, moord, dronkenschappen, uitspattingen, en dergelijke; waarvan ik u van tevoren zeg, zoals ik ook eerder gezegd heb, dat wie zulke dingen doen, het Koninkrijk van God niet zullen beërven.", "Est 8:3": "En Esther sprak verder voor de koning, en zij viel voor zijn voeten, en zij weende, en zij smeekte hem, dat hij de boosheid van Haman, de Agagiet, en zijn plan, dat hij tegen de Joden bedacht had, zou wegnemen.", "2 Sam 18:28": "Ahimaäz dan riep en zei tegen de koning: Vrede! En hij boog zich voor de koning met het gezicht ter aarde, en zei: Geloofd zij de HEERE, uw God, Die de mannen heeft overgegeven die hun hand tegen mijn heer de koning ophieven.", "Ezech 27:20": "Dedan handelde met u met kostbaar gewaad voor wagens.", "2 Kon 25:8": "Daarna in de vijfde maand, op de zevende van de maand (dit was het negentiende jaar van Nebukadnezar, de koning van Babel) kwam Nebuzaradan, de aanvoerder van de lijfwacht, de knecht van de koning van Babel, in Jeruzalem.", "Gen 44:1-8": "En hij gebood degene die over zijn huis ging, en zei: Vul de zakken van deze mannen met voedsel, zoveel als zij kunnen dragen, en leg ieders geld in de mond van zijn zak; En mijn beker, de zilveren beker, moet u leggen in de mond van de zak van de jongste, met het geld van zijn koren. En hij deed naar Jozefs woord, dat hij gesproken had. 's Morgens, toen het licht werd, liet men deze mannen vertrekken, hen en hun ezels.", "Gen 34:13": "Toen antwoordden Jakobs zonen Sichem en zijn vader Hemor bedrieglijk, en spraken (omdat hij Dina, hun zuster, verontreinigd had);", "Ex 30:16": "U dan moet het geld van de verzoeningen van de kinderen van Israël nemen, en het bestemmen voor de dienst van de tent van de samenkomst; en het zal voor de kinderen van Israël een gedachtenis zijn, voor het aangezicht van de HEERE, om voor uw zielen verzoening te doen.", "Ps 6:6": "Want in de dood is aan U geen gedachtenis; wie zal U loven in het graf?", "1 Sam 26:2": "Toen maakte Saul zich op en trok af naar de woestijn Zif, met drieduizend man, uitgelezen mannen van Israël, om David te zoeken in de woestijn Zif.", "2 Kon 2:12": "En Elisa zag het, en hij riep: Mijn vader, mijn vader, wagen van Israël en zijn ruiters! En hij zag hem niet meer; en hij greep zijn klederen en scheurde ze in twee stukken.", "Deut 13:9": "maar u zult hem zeker doodslaan; uw hand zal eerst tegen hem zijn, om hem te doden, en daarna de hand van het hele volk.", "Gen 43:12-23": "En neem dubbel geld in uw hand; en breng het geld, dat in de opening van uw zakken teruggekeerd is, weer terug in uw hand; misschien is het een vergissing. Neem ook uw broer mee, en maak u op, ga terug naar die man. En God, de Almachtige, geve u barmhartigheid bij die man, dat hij uw andere broer en Benjamin met u laat teruggaan! En wat mij aangaat, als ik van mijn kinderen beroofd word, dan ben ik maar beroofd!", "1 Sam 3:8": "Toen riep de HEERE Samuël opnieuw, voor de derde keer; en hij stond op, en ging naar Eli, en zei: Hier ben ik, want u hebt mij geroepen. Toen begreep Eli dat de HEERE de jongen riep.", "Gen 41:25": "Toen zei Jozef tot Farao: De droom van Farao is één; wat God gaat doen, heeft Hij Farao bekendgemaakt.", "Ps 31:14": "Want ik hoorde de kwaadsprekerij van velen; vrees is van rondom, omdat zij samen tegen mij overleggen; zij zijn van plan mijn ziel te nemen.", "2 Kon 2:24": "En hij keerde zich achterom, en hij zag hen, en vervloekte hen, in de Naam van de HEERE. Toen kwamen er twee berinnen uit het woud, en verscheurden van hen tweeënveertig kinderen.", "Gen 43:26": "Toen Jozef nu thuisgekomen was, brachten zij hem het geschenk, dat in hun hand was, in het huis, en zij bogen zich voor hem ter aarde.", "2 Kon 6:13": "En hij zei: Ga heen, en kijk waar hij is, zodat ik iemand zend en hem laat halen. En hem werd meegedeeld: Zie, hij is in Dothan.", "Jes 56:3": "En de vreemdeling, die zich bij de HEERE gevoegd heeft, moet niet zeggen: De HEERE heeft mij helemaal van Zijn volk gescheiden; en de ontmande moet niet zeggen: Zie, ik ben een dorre boom.", "2 Kron 24:14": "Toen zij het nu klaar hadden, brachten zij voor de koning en Jojada het overige van het geld, waarvan hij vaten maakte voor het huis van de HEERE, vaten om te dienen en te offeren, en rookschalen, en gouden en zilveren vaten; en zij offerden voortdurend brandoffers in het huis van de HEERE, al de dagen van Jojada.", "Spr 10:18": "Wie haat bedekt, heeft valse lippen, en wie een kwaad gerucht verspreidt, is een dwaas.", "Ezech 27:7": "Fijn linnen met stiksel uit Egypte was uw uitgespreide zeil, dat het u tot een zeil zou zijn; hemelsblauw en purper, uit de eilanden van Elisa, was uw dek.", "1 Tim 1:10": "De hoereerders, mannen die met mannen omgang hebben, de mensenrovers, de leugenaars, de meinedigen, en al wat verder tegen de gezonde leer ingaat;", "1 Kron 12:40": "En ook degenen die dicht bij hen woonden, tot aan Issaschar, en Zebulon, en Nafthali, brachten brood op ezels, en op kamelen, en op muildieren, en op runderen, meel, klompen gedroogde vijgen, en rozijnenkoeken, en wijn, en olie, en runderen, en kleinvee in overvloed; want er was blijdschap in Israël.", "Gen 50:15-21": "Toen Jozefs broeders zagen dat hun vader dood was, zeiden zij: Misschien zal Jozef ons haten, en zal hij ons zeker vergelden al het kwaad, dat wij hem aangedaan hebben. Daarom stuurden zij een boodschapper naar Jozef, en zeiden: Uw vader heeft voor zijn dood bevolen en gezegd: Zo moet u tot Jozef zeggen: Ach, vergeef toch de overtreding van uw broeders, en hun zonde; want zij hebben u kwaad aangedaan; maar nu, vergeef toch de overtreding van de dienaren van de God van uw vader! En Jozef weende toen zij tot hem spraken.", "2 Kon 5:26": "Maar hij zei tegen hem: Ging mijn hart niet mee, toen die man zich van zijn wagen omkeerde, u tegemoet? Was dit het moment om dat zilver aan te nemen, en om kleren aan te nemen, en olijfbomen, en wijngaarden, en schapen, en runderen, en knechten, en dienstmaagden?", "Joz 10:28": "Op diezelfde dag nam Jozua ook Makkeda in, en sloeg haar met de scherpte van het zwaard; daartoe verbande hij haar koning, hen en elke ziel die daarin was; hij liet niemand overblijven; en hij deed de koning van Makkeda zoals hij de koning van Jericho gedaan had.", "Spr 30:20": "Zo is de weg van een overspelige vrouw; zij eet en veegt haar mond af, en zegt: Ik heb geen onrecht gedaan!", "Richt 8:24": "Verder zei Gideon tegen hen: Eén ding wil ik van u vragen: geef mij ieder een voorhoofdsieraad uit uw buit; want zij hadden gouden voorhoofdsieraden, omdat zij Ismaëlieten waren.", "1 Kon 21:15": "Het gebeurde nu, toen Izebel hoorde dat Naboth gestenigd en dood was, dat Izebel tegen Achab zei: Sta op, neem de wijngaard van Naboth, de Jizreëliet, in bezit, die hij u weigerde voor geld te geven; want Naboth leeft niet meer, maar is dood.", "Gen 44:18": "Toen kwam Juda dichter bij hem, en zei: Och, mijn heer! Laat toch uw knecht een woord spreken voor de oren van mijn heer, en laat uw toorn tegen uw knecht niet ontsteken; want u bent gelijk aan Farao!", "Ex 21:16": "Verder, wie een mens steelt, of hij hem verkocht heeft, of hij in zijn hand gevonden wordt, die zal zeker gedood worden.", "Neh 5:4": "Evenzo waren er die zeiden: Wij hebben geld geleend voor de belasting van de koning, op onze akkers en onze wijngaarden.", "Matt 2:2-16": "Zij zeiden: Waar is de geboren Koning van de Joden? Want wij hebben Zijn ster gezien in het Oosten, en zijn gekomen om Hem te aanbidden. Toen koning Herodes dit hoorde, werd hij ontroerd, en heel Jeruzalem met hem. En hij bracht al de overpriesters en Schriftgeleerden van het volk bijeen en vroeg hun waar de Christus geboren zou worden.", "Gen 44:20-23": "Toen zeiden wij tegen mijn heer: Wij hebben een oude vader, en een jongen van het ouderdom, de kleinste, wiens broer dood is, en hij is alleen van zijn moeder overgebleven, en zijn vader heeft hem lief. Toen zei u tegen uw knechten: Breng hem bij mij, opdat ik mijn oog op hem sla. En wij zeiden tegen mijn heer: Die jongen kan zijn vader niet verlaten; als hij zijn vader verlaat, zal zijn vader sterven.", "2 Kon 19:1": "En het gebeurde, toen koning Hizkia dat hoorde, dat hij zijn kleren scheurde en zich met een zak bedekte, en naar het huis van de HEERE ging.", "Spr 28:13": "Wie zijn overtredingen bedekt, zal geen voorspoed hebben; maar wie ze belijdt en laat, zal barmhartigheid ontvangen.", "2 Kon 15:20": "Menahem nu bracht dit geld op van Israël, van alle vermogende mannen, om aan de koning van Assyrië te geven, voor elke man vijftig zilveren sikkels; zo keerde de koning van Assyrië terug, en bleef daar niet in het land.", "Deut 23:19": "U zult uw broeder geen rente laten betalen, rente van geld, rente van voedsel, rente van enig ding waarover men rente vraagt.", "2 Kon 22:19": "Omdat uw hart week geworden is, en u zich voor het aangezicht van de HEERE vernederd hebt, toen u hoorde wat Ik gesproken heb tegen deze plaats en haar inwoners, dat zij tot een verwoesting en vloek zullen worden, en dat u uw kleren gescheurd en voor Mijn aangezicht geweend hebt; zo heb Ik u ook verhoord, spreekt de HEERE.", "Jer 26:15": "Maar weet zeker, dat u, als u mij doodt, zeker onschuldig bloed zult brengen op u, en op deze stad, en op haar inwoners; want in waarheid, de HEERE heeft mij tot u gezonden, om al deze woorden voor uw oren te spreken.", "Gen 35:22": "En het gebeurde, toen Israël in dat land woonde, dat Ruben heenging en lag bij Bilha, het bijvrouw van zijn vader; en Israël hoorde het. En de zonen van Jakob waren twaalf.", "Kol 1:18": "en Hij is het Hoofd van het lichaam, namelijk van de Gemeente, Hij, Die het Begin is, de Eerstgeborene uit de doden, opdat Hij in alles de Eerste zou zijn.", "Luk 15:30": "Maar toen deze zoon van u kwam, die uw bezit met hoeren heeft opgemaakt, hebt u voor hem het gemeste kalf geslacht.", "Gen 44:20-30": "Toen zeiden wij tegen mijn heer: Wij hebben een oude vader, en een jongen van het ouderdom, de kleinste, wiens broer dood is, en hij is alleen van zijn moeder overgebleven, en zijn vader heeft hem lief. Toen zei u tegen uw knechten: Breng hem bij mij, opdat ik mijn oog op hem sla. En wij zeiden tegen mijn heer: Die jongen kan zijn vader niet verlaten; als hij zijn vader verlaat, zal zijn vader sterven.", "Gen 35:22-26": "En het gebeurde, toen Israël in dat land woonde, dat Ruben heenging en lag bij Bilha, het bijvrouw van zijn vader; en Israël hoorde het. En de zonen van Jakob waren twaalf. De zonen van Lea waren: Ruben, Jakobs eerstgeborene, daarna Simeon, en Levi, en Juda, en Issaschar, en Zebulon. De zonen van Rachel: Jozef en Benjamin.", "Ps 130:1": "Een lied van de hogere trappen. Uit de diepten roep ik tot U, o HEERE!", "Gen 49:8": "Juda! U bent het, u zullen uw broers loven; uw hand zal zijn op de nek van uw vijanden; voor u zullen de zonen van uw vader zich neerbuigen.", "Jer 6:26": "O dochter van Mijn volk! Gord een zak aan, en wentel u in de as, bedrijf rouw als om een enige zoon, een zeer bitter misbaar; want de verstoorder zal ons snel overkomen.", "Gen 30:4": "Zo gaf zij hem haar dienstmaagd Bilha tot vrouw; en Jakob ging bij haar.", "Joh 12:11": "Want om zijnentwil gingen velen van de Joden weg, en geloofden in Jezus.", "Ps 22:9": "Hij heeft het op de HEERE gewenteld, dat Hij hem nu uithelpt, dat Hij hem redt, omdat Hij lust aan hem heeft!", "Hebr 11:9-16": "Door het geloof is hij een inwoner geweest in het land van de belofte, als in een vreemd land, en heeft hij in tenten gewoond met Izak en Jakob, die medeerfgenamen waren van dezelfde belofte. Want hij verwachtte de stad die fundamenten heeft, waarvan God de Ontwerper en Bouwer is. Door het geloof heeft ook Sara zelf kracht ontvangen om, ook toen de tijd van haar ouderdom voorbij was, zwanger te worden en te baren; omdat zij Hem trouw achtte, Die het beloofd had.", "Mark 15:10": "(Want hij wist dat de overpriesters Hem uit afgunst overgeleverd hadden.)", "Ps 83:10": "Doe hun als Midian, als Sisera, als Jabin bij de beek Kison;", "Ps 109:4": "Voor mijn liefde staan zij mij tegen; maar ik was steeds in het gebed.", "1 Sam 3:16": "Toen riep Eli Samuël, en zei: Mijn zoon Samuël! Hij dan zei: Hier ben ik.", "Num 18:16": "Wie hiervan gelost zullen worden, zult u van een maand oud lossen, naar uw schatting, voor het geld van vijf sikkels, naar de sikkel van het heiligdom, die is twintig gera.", "Gen 37:9-11": "En hij droomde nog een andere droom en vertelde die aan zijn broers; en hij zei: Zie, ik heb nog een droom gedroomd, en zie, de zon, de maan en elf sterren bogen zich voor mij neer. En toen hij het aan zijn vader en aan zijn broers vertelde, bestrafte zijn vader hem en zei tegen hem: Wat is dit voor een droom die u gedroomd hebt? Zullen wij dan werkelijk komen, ik, en uw moeder, en uw broers, om ons voor u ter aarde te buigen? Zijn broers benijdden hem; maar zijn vader bewaarde deze zaak.", "Ex 22:25": "Als u Mijn volk, dat arm is onder u, geld leent, mag u zich niet als een woekeraar tegenover hen gedragen; u mag geen rente van hen vragen.", "Joh 15:18": "Als de wereld u haat, weet dan, dat zij Mij eerder dan u gehaat heeft.", "1 Sam 16:12": "Toen stuurde hij iemand, en liet hem komen; hij nu was roodachtig, en had daarbij mooie ogen en een knap voorkomen; en de HEERE zei: Sta op, zalf hem, want deze is het.", "Gen 21:14": "Toen stond Abraham 's morgens vroeg op, en nam brood en een fles water, en gaf ze aan Hagar, die hij op haar schouder legde; ook gaf hij haar het kind, en stuurde haar weg. En zij ging op weg, en dwaalde rond in de woestijn Berseba.", "2 Kron 34:14": "En toen zij het geld uithaalden dat naar het huis van de HEERE gebracht was, vond de priester Hilkia het wetboek van de HEERE, dat door de hand van Mozes gegeven was.", "Deut 28:68": "En de HEERE zal u met schepen laten terugkeren naar Egypte, langs een weg waarvan ik u gezegd heb: U zult die niet meer zien; en daar zult u zich aan uw vijanden willen verkopen als slaven en slavinnen; maar er zal geen koper zijn.", "Joh 12:10": "En de overpriesters beraadslaagden om ook Lazarus te doden,", "2 Kon 12:7-16": "Toen riep koning Joas de priester Jojada en de andere priesters, en zei tegen hen: Waarom herstelt u niet de breuken van het huis? Nu dan, neem geen geld van uw bekenden aan, tenzij u het geeft voor de breuken van het huis. En de priesters stemden erin toe geen geld van het volk aan te nemen, noch de breuken van het huis te herstellen. Maar de priester Jojada nam een kist, en boorde een gat in het deksel ervan, en zette die bij het altaar aan de rechterkant, waar iemand het huis van de HEERE binnenkwam; en de priesters die de drempel bewaakten, staken daarin al het geld dat naar het huis van de HEERE gebracht werd.", "Joh 13:7": "Jezus antwoordde en zei tegen hem: Wat Ik doe, weet u nu niet, maar u zult het hierna verstaan.", "Matt 2:11": "En toen zij in het huis gekomen waren, vonden zij het Kindje met Maria, Zijn moeder, en zij vielen neer en aanbaden Het; en na hun schatten geopend te hebben, brachten zij Hem geschenken: goud, wierook en mirre.", "Pred 10:19": "Men maakt maaltijden om te lachen, en de wijn verheugt de levenden, en het geld verschaft alles.", "Deut 2:28": "Verkoop mij voedsel voor geld, dat ik eet, en geef mij water voor geld, dat ik drink; laat mij alleen te voet doortrekken;", "Jes 60:14": "Ook zullen, zich buigend, tot u komen de kinderen van hen die u onderdrukt hebben, en allen die u gelasterd hebben zullen zich neerbuigen aan de zolen van uw voeten; en zij zullen u noemen: de stad van de HEERE, het Sion van de Heilige van Israël.", "Gen 42:25-35": "En Jozef gebood dat men hun zakken met koren vullen zou, en dat men hun geld terug zou geven, ieder in zijn zak, en dat men hun proviand zou geven voor onderweg; en men deed hun zo. En zij laadden hun koren op hun ezels, en trokken vandaar weg. Toen één zijn zak opendeed om zijn ezel voer te geven in de herberg, zag hij zijn geld; want zie, het was in de opening van zijn zak.", "Gen 25:16-18": "Deze zijn de zonen van Ismaël, en dit zijn hun namen, in hun dorpen en versterkte plaatsen: twaalf vorsten naar hun volken. En dit zijn de jaren van het leven van Ismaël: honderdzevenendertig jaar; en hij gaf de geest, en stierf, en hij werd verzameld tot zijn volk. En zij woonden van Havila tot Sur toe, dat tegenover Egypte ligt, in de richting van Assur; hij heeft zich neergeslagen tegenover al zijn broers.", "Joh 13:22": "De discipelen k
