eeg geen kinderen van hem; en zij had een Egyptische dienstmaagd, wier naam Hagar was.","2":"En Sarai zei tegen Abram: Zie toch, de HEERE heeft mij belet kinderen te krijgen; ga toch naar mijn dienstmaagd, misschien zal ik uit haar gebouwd worden. En Abram luisterde naar de stem van Sarai.","3":"Zo nam Sarai, Abrams vrouw, de Egyptische Hagar, haar dienstmaagd, na tien jaar dat Abram in het land Kanaän gewoond had, en zij gaf haar aan Abram, haar man, hem tot een vrouw.","4":"En hij ging naar Hagar, en zij werd zwanger. Toen zij nu zag dat zij zwanger was geworden, werd haar meesteres veracht in haar ogen.","5":"Toen zei Sarai tegen Abram: Het onrecht mij aangedaan komt op u neer; ik heb mijn dienstmaagd in uw schoot gegeven; nu zij ziet dat zij zwanger is geworden, ben ik veracht in haar ogen; de HEERE oordele tussen mij en tussen u!","6":"En Abram zei tegen Sarai: Zie, uw dienstmaagd is in uw hand; doe met haar wat goed is in uw ogen. En Sarai vernederde haar, en zij vluchtte van haar aangezicht.","7":"En de Engel van de HEERE vond haar bij een waterbron in de woestijn, bij de bron op de weg naar Sur.","8":"En hij zei: Hagar, dienstmaagd van Sarai, waar komt u vandaan, en waar zult u heengaan? En zij zei: Ik vlucht van het aangezicht van mijn meesteres Sarai!","9":"Toen zei de Engel van de HEERE tegen haar: Keer terug naar uw meesteres, en verneder u onder haar handen.","10":"Verder zei de Engel van de HEERE tegen haar: Ik zal uw nageslacht enorm vermeerderen, zodat het vanwege de menigte niet geteld zal kunnen worden.","11":"Ook zei de Engel van de HEERE tegen haar: Zie, u bent zwanger, en zult een zoon baren, en u zult zijn naam Ismaël noemen, omdat de HEERE uw verdrukking gehoord heeft.","12":"En hij zal een woudezel *van* *een* mens zijn; zijn hand zal tegen allen zijn, en de hand van allen tegen hem; en hij zal wonen voor het aangezicht van al zijn broeders.","13":"En zij noemde de Naam van de HEERE, Die tot haar sprak: U bent de God van het aanzien! want zij zei: Heb ik ook hier gezien naar Hem, Die mij aanziet?","14":"Daarom noemde men die put: de put Lachai-roi; zie, hij ligt tussen Kades en Bered.","15":"En Hagar baarde Abram een zoon; en Abram noemde de naam van zijn zoon, die Hagar gebaard had, Ismaël.","16":"En Abram was zesentachtig jaar oud, toen Hagar Ismaël aan Abram baarde."},"SV":{"1":"Doch Sarai, Abrams huisvrouw, baarde hem niet; en zij had een Egyptische dienstmaagd, welker naam was Hagar.","2":"Zo zeide Sarai tot Abram: Zie toch, de HEERE heeft mij toegesloten, dat ik niet bare; ga toch in tot mijn dienstmaagd, misschien zal ik uit haar gebouwd worden. En Abram hoorde naar de stem van Sarai.","3":"Zo nam Sarai, Abrams huisvrouw, de Egyptische Hagar, haar dienstmaagd, ten einde van tien jaren, welke Abram in het land Kanaän gewoond had, en zij gaf haar aan Abram, haar man, hem tot een vrouw.","4":"En hij ging in tot Hagar, en zij ontving. Als zij nu zag, dat zij ontvangen had, zo werd haar vrouw veracht in haar ogen.","5":"Toen zeide Sarai tot Abram: Mijn ongelijk is op u; ik heb mijn dienstmaagd in uw schoot gegeven; nu zij ziet, dat zij ontvangen heeft, zo ben ik veracht in haar ogen; de HEERE rechte tussen mij en tussen u!","6":"En Abram zeide tot Sarai: Zie uw dienstmaagd is in uw hand; doe haar, wat goed is in uw ogen. En Sarai vernederde haar, en zij vluchtte van haar aangezicht.","7":"En de Engel des HEEREN vond haar aan een waterfontein in de woestijn, aan de fontein op den weg van Sur.","8":"En hij zeide: Hagar, gij, dienstmaagd van Sarai! van waar komt gij, en waar zult gij heengaan? En zij zeide: Ik ben vluchtende van het aangezicht mijner vrouw Sarai!","9":"Toen zeide de Engel des HEEREN tot haar: Keer weder tot uw vrouw, en verneder u onder haar handen.","10":"Voorts zeide de Engel des HEEREN tot haar: Ik zal uw zaad grotelijks vermenigvuldigen, zodat het vanwege de menigte niet zal geteld worden.","11":"Ook zeide des HEEREN Engel tot haar: Zie, gij zijt zwanger, en zult een zoon baren, en gij zult zijn naam Ismaël noemen, omdat de HEERE uw verdrukking aangehoord heeft.","12":"En hij zal een woudezel *van* *een* mens zijn; zijn hand zal tegen allen zijn, en de hand van allen tegen hem; en hij zal wonen voor het aangezicht van al zijn broederen.","13":"En zij noemde den Naam des HEEREN, Die tot haar sprak: Gij, God des aanziens! want zij zeide: Heb ik ook hier gezien naar Dien, Die mij aanziet?","14":"Daarom noemde men dien put, den put Lachai-roi; ziet, hij is tussen Kades en tussen Bered.","15":"En Hagar baarde Abram een zoon; en Abram noemde den naam zijns zoons, die Hagar gebaard had, Ismaël.","16":"En Abram was zes en tachtig jaren oud, toen Hagar Ismaël aan Abram baarde."},"KJV":{"1":"Now Sarai Abram's wife bare him no children: and she had an handmaid, an Egyptian, whose name *was* Hagar.","2":"And Sarai said unto Abram, Behold now, the LORD hath restrained me from bearing: I pray thee, go in unto my maid; it may be that I may obtain children by her. And Abram hearkened to the voice of Sarai.","3":"And Sarai Abram's wife took Hagar her maid the Egyptian, after Abram had dwelt ten years in the land of Canaan, and gave her to her husband Abram to be his wife.","4":"And he went in unto Hagar, and she conceived: and when she saw that she had conceived, her mistress was despised in her eyes.","5":"And Sarai said unto Abram, My wrong *be* upon thee: I have given my maid into thy bosom; and when she saw that she had conceived, I was despised in her eyes: the LORD judge","6":"But Abram said unto Sarai, Behold, thy maid *is* in thy hand; do to her as it pleaseth thee. And when Sarai dealt hardly with her, she fled from her face.","7":"And the angel of the LORD found her by a fountain of water in the wilderness, by the fountain in the way to Shur.","8":"And he said, Hagar, Sarai's maid, whence camest thou? and whither wilt thou go? And she said, I flee from the face of my mistress Sarai.","9":"And the angel of the LORD said unto her, Return to thy mistress, and submit thyself under her hands.","10":"And the angel of the LORD said unto her, I will multiply thy seed exceedingly, that it shall not be numbered for multitude.","11":"And the angel of the LORD said unto her, Behold, thou *art* with child, and shalt bear a son, and shalt call his name Ishmael; because the LORD hath heard thy affliction.","12":"And he will be a wild man; his hand *will be* against every man, and every man's hand against him; and he shall dwell in the presence of all his brethren.","13":"And she called the name of the LORD that spake unto her, Thou God seest me: for she said, Have I also here looked after him that seeth me?","14":"Wherefore the well was called Beerlahairoi; behold, *it is* between Kadesh and Bered.","15":"And Hagar bare Abram a son: and Abram called his son's name, which Hagar bare, Ishmael.","16":"And Abram *was* fourscore and six years old, when Hagar bare Ishmael to Abram."}},"tsk":{"1":[{"kopje":"kreeg","refs":["Gen 15:2","Gen 15:3","Gen 21:10","Gen 21:12","Gen 25:21","Richt 13:2","Luk 1:7","Luk 1:36"]},{"kopje":"Egyptische","refs":["Gen 12:16","Gen 21:9","Gen 21:21"]},{"kopje":"naam","refs":["Gal 4:24"]}],"2":[{"kopje":"de HEERE","refs":["Gen 17:16","Gen 18:10","Gen 20:18","Gen 25:21","Gen 30:2","Gen 30:3","Gen 30:9","Gen 30:22","Ps 127:3"]},{"kopje":"kinderen te krijgen","refs":["Gen 30:3","Gen 30:6","Ex 21:4","Ruth 4:11"]},{"kopje":"luisterde","refs":["Gen 3:1-6","Gen 3:12","Gen 3:17"]}],"3":[{"kopje":"had","refs":["Gen 12:4","Gen 12:5"]},{"kopje":"gaf","refs":["Gen 16:5","Gen 30:4","Gen 30:9"]},{"kopje":"hem","refs":["Gen 25:6","Gen 28:9","Gen 32:22","Gen 35:22","Richt 19:1-4","2 Sam 5:13","1 Kon 11:3","Gal 4:25"]}],"4":[{"kopje":"haar meesteres","refs":["1 Sam 1:6-8","2 Sam 6:16","Spr 30:20","Spr 30:21","Spr 30:23","1 Kor 4:6","1 Kor 13:4","1 Kor 13:5"]}],"5":[{"kopje":"Het onrecht mij aangedaan","refs":["Luk 10:40","Luk 10:41"]},{"kopje":"de HEERE","refs":["Gen 31:53","Ex 5:21","1 Sam 24:13-16","2 Kron 24:22","Ps 7:9  wl-kjv\" data-code=\"H87\">Abram</span> to be his wife.","4":"And he went <span class=\"wl wl-kjv\" data-code=\"H935\">in</span> unto <span class=\"wl wl-kjv\" data-code=\"H1904\">Hagar,</span> and she <span class=\"wl wl-kjv\" data-code=\"H2029\">conceived:</span> and when she <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> that she had <span class=\"wl wl-kjv\" data-code=\"H2029\">conceived,</span> her <span class=\"wl wl-kjv\" data-code=\"H1404\">mistress</span> was <span class=\"wl wl-kjv\" data-code=\"H7043\">despised</span> in her eyes.","5":"And <span class=\"wl wl-kjv\" data-code=\"H8297\">Sarai</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H87\">Abram,</span> My <span class=\"wl wl-kjv\" data-code=\"H2555\">wrong</span> be upon thee: I have <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> my <span class=\"wl wl-kjv\" data-code=\"H8198\">maid</span> into thy <span class=\"wl wl-kjv\" data-code=\"H2436\">bosom;</span> and when she <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> that she had <span class=\"wl wl-kjv\" data-code=\"H2029\">conceived,</span> I was <span class=\"wl wl-kjv\" data-code=\"H7043\">despised</span> in her <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes:</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> judge","6":"But <span class=\"wl wl-kjv\" data-code=\"H87\">Abram</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H8297\">Sarai,</span> Behold, thy <span class=\"wl wl-kjv\" data-code=\"H8198\">maid</span> is in thy <span class=\"wl wl-kjv\" data-code=\"H3027\">hand;</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> to her as it pleaseth <span class=\"wl wl-kjv\" data-code=\"H2896\">thee.</span> And when <span class=\"wl wl-kjv\" data-code=\"H8297\">Sarai</span> dealt hardly <span class=\"wl wl-kjv\" data-code=\"H6031\">with</span> her, she <span class=\"wl wl-kjv\" data-code=\"H1272\">fled</span> from her face.","7":"And the <span class=\"wl wl-kjv\" data-code=\"H4397\">angel</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> found <span class=\"wl wl-kjv\" data-code=\"H4672\">her</span> by a <span class=\"wl wl-kjv\" data-code=\"H5869\">fountain</span> of <span class=\"wl wl-kjv\" data-code=\"H4325\">water</span> in the <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness,</span> by the <span class=\"wl wl-kjv\" data-code=\"H5869\">fountain</span> in the <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> to Shur.","8":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H1904\">Hagar,</span> <span class=\"wl wl-kjv\" data-code=\"H8297\">Sarai's</span> <span class=\"wl wl-kjv\" data-code=\"H8198\">maid,</span> <span class=\"wl wl-kjv\" data-code=\"H335\">whence</span> camest <span class=\"wl wl-kjv\" data-code=\"H935\">thou?</span> and whither wilt thou <span class=\"wl wl-kjv\" data-code=\"H3212\">go?</span> And she <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> I <span class=\"wl wl-kjv\" data-code=\"H1272\">flee</span> from the <span class=\"wl wl-kjv\" data-code=\"H6440\">face</span> of my <span class=\"wl wl-kjv\" data-code=\"H1404\">mistress</span> Sarai.","9":"And the <span class=\"wl wl-kjv\" data-code=\"H4397\">angel</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto her, <span class=\"wl wl-kjv\" data-code=\"H7725\">Return</span> to thy <span class=\"wl wl-kjv\" data-code=\"H1404\">mistress,</span> and <span class=\"wl wl-kjv\" data-code=\"H6031\">submit</span> thyself under her hands.","10":"And the <span class=\"wl wl-kjv\" data-code=\"H4397\">angel</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto her, I will <span class=\"wl wl-kjv\" data-code=\"H7235\">multiply</span> thy <span class=\"wl wl-kjv\" data-code=\"H2233\">seed</span> <span class=\"wl wl-kjv\" data-code=\"H7235\">exceedingly,</span> that it shall not be <span class=\"wl wl-kjv\" data-code=\"H5608\">numbered</span> for multitude.","11":"And the <span class=\"wl wl-kjv\" data-code=\"H4397\">angel</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto her, <span class=\"wl wl-kjv\" data-code=\"H2009\">Behold,</span> thou art with <span class=\"wl wl-kjv\" data-code=\"H2030\">child,</span> and shalt <span class=\"wl wl-kjv\" data-code=\"H3205\">bear</span> a <span class=\"wl wl-kjv\" data-code=\"H1121\">son,</span> and shalt <span class=\"wl wl-kjv\" data-code=\"H7121\">call</span> his <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> <span class=\"wl wl-kjv\" data-code=\"H3458\">Ishmael;</span> because the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> thy affliction.","12":"And he will be a <span class=\"wl wl-kjv\" data-code=\"H6501\">wild</span> <span class=\"wl wl-kjv\" data-code=\"H120\">man;</span> his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> will be against every man, and every man's <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> against him; and he shall <span class=\"wl wl-kjv\" data-code=\"H7931\">dwell</span> in the <span class=\"wl wl-kjv\" data-code=\"H6440\">presence</span> of all his brethren.","13":"And she <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> that <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> unto her, Thou <span class=\"wl wl-kjv\" data-code=\"H410\">God</span> seest <span class=\"wl wl-kjv\" data-code=\"H7210\">me:</span> for she <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Have I also <span class=\"wl wl-kjv\" data-code=\"H1988\">here</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">looked</span> after <span class=\"wl wl-kjv\" data-code=\"H310\">him</span> that seeth me?","14":"Wherefore the <span class=\"wl wl-kjv\" data-code=\"H875\">well</span> was <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> <span class=\"wl wl-kjv\" data-code=\"H883\">Beerlahairoi;</span> behold, it is between <span class=\"wl wl-kjv\" data-code=\"H6946\">Kadesh</span> and Bered.","15":"And <span class=\"wl wl-kjv\" data-code=\"H1904\">Hagar</span> <span class=\"wl wl-kjv\" data-code=\"H3205\">bare</span> <span class=\"wl wl-kjv\" data-code=\"H87\">Abram</span> a <span class=\"wl wl-kjv\" data-code=\"H1121\">son:</span> and <span class=\"wl wl-kjv\" data-code=\"H87\">Abram</span> <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> his <span class=\"wl wl-kjv\" data-code=\"H1121\">son's</span> <span class=\"wl wl-kjv\" data-code=\"H8034\">name,</span> which <span class=\"wl wl-kjv\" data-code=\"H1904\">Hagar</span> <span class=\"wl wl-kjv\" data-code=\"H3205\">bare,</span> Ishmael.","16":"And <span class=\"wl wl-kjv\" data-code=\"H87\">Abram</span> was <span class=\"wl wl-kjv\" data-code=\"H8084\">fourscore</span> and <span class=\"wl wl-kjv\" data-code=\"H8337\">six</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">old,</span> when <span class=\"wl wl-kjv\" data-code=\"H1904\">Hagar</span> <span class=\"wl wl-kjv\" data-code=\"H3205\">bare</span> <span class=\"wl wl-kjv\" data-code=\"H3458\">Ishmael</span> to Abram."},"bijbeluitleg":{"kanttekeningen_nl":{"2":[{"catchword":"toegesloten,","tekst":"Dat is, onvruchtbaar gemaakt. Verg. onder, hoofdstuk Gen 20:18."},{"catchword":"ga toch","tekst":"Zie boven Gen 6:4; zo ook onder vs.4. Sarai aan eigen lijfsvrucht wanhopende, en nochtans naar het beloofde zaad hartelijk verlangende, vergeet zichzelve zover, dat zij, zonder God te vragen, haar man raadt door dit middel, dat wel in dien tijd algemeen, maar tegen de eerste instelling des huwelijks strijdig was, de vervulling van Gods belofte te verzoeken."},{"catchword":"misschien","tekst":"Zo deed dan Sarai dit om te beproeven of Abram uit Hagar een zoon zou bekomen, dien zij voor haar eigen mocht houden, als uit hare maagd in haar huis haar geboren. Zie onder Gen 30:3; Exo 21:4."},{"catchword":"gebouwd","tekst":"De manier van spreken, bouwen, of het huis bouwen, vindt men ook onder, Gen 30:3; Rth 4:11; Deu 25:9; zij betekent het geslacht onderhouden en uitbreiden."},{"catchword":"Abram hoord","tekst":"Abram, zonder God, wiens belofte dit aanging, eens te vragen, laat zich van Sarai, niet door onkuisen lust, maar om de redenen die zij voortbracht, en die hem mede ter harte gingen, overreden; te meer, omdat het hem nog verborgen was, of het beloofde zaad hem uit Sarai, of uit een andere zou geboren worden."}],"3":[{"catchword":"ten einde","tekst":"Te weten, nadat hij uit Haran gescheiden, en in het land Kanaän gekomen was."},{"catchword":"zij gaf","tekst":"Misbruikende de macht [die zij overigens had] over haar dienstmaagd en het lichaam van haar man, 1Co 7:4."},{"catchword":"hem tot","tekst":"Versta, ene vrouw, zijnde van minder waardigheid dan de eerste, daar Hagar dienstmaagd en onder het gebied van haar vrouwe Sarai bleef, vs.4, 8,9. Zie voorts van dusdanige bijvrouwen onder Gen 25:6, en Gen 30:3, Gen 30:9. Omtrent de geestelijke beduiding van dit huwelijk, zie Gal 4:22, enz."}],"4":[{"catchword":"veracht in","tekst":"Hebr. licht, dat is, klein geacht."}],"5":[{"catchword":"Mijn ongelijk","tekst":"Dat is, het ongelijk, dat mij wordt aangedaan. Dit heeft Sarai gesproken uit ongeduld."},{"catchword":"is op u;","tekst":"Of, om u, om uwentwille, het is u toe te rekenen, omdat gij wel merkt dat Hagar mij versmaadt, en gij haar daarover niet bestraft."},{"catchword":"HEERE","tekst":"Uit zwakheid beveelt zij de zaad aan Gods oordeel, mits Hij straffe dengene die ongelijk heeft, zo hij daarin niet voorziet. Vergelijk 1Sa 24:13, 1Sa 24:16."}],"6":[{"catchword":"in uw hand","tekst":"Dat is, in uw geweld, onder uw gebied of macht, gelijk ook, Gen 24:10, en hoofdstuk Gen 39:4, Gen 39:6, Gen 39:8; Num 31:49; Jos 9:25; 1Sa 14:48; 2Ki 8:20. Abram wil zeggen: Ofschoon ik haar tot een tweede vrouw genomen heb, zo heb ik haar nochtans aan uw gebied niet onttrokken; daarom, zo zij misdoet, gebruik uw recht, als over ene die onder u staat."}],"7":[{"catchword":"de engel","tekst":"Dat is, het hoofd der engelen, de Heere Christus, die daarom ook HEERE genoemd wordt, vs.13, en Gen 18:26, Gen 18:33; Jdg 6:14, en Jdg 13:19, Jdg 13:22."},{"catchword":"vond haar","tekst":"Dit woordje drukt uit het wakende oog des Heeren over deze dwalende en bedroefde Hagar."},{"catchword":"Sur","tekst":"Hebr. Schur. Vanwaar men ging naar Egypte, waarvan zij was; zie onder Gen 25:18; Exo 15:22; en 1Sa 15:7."}],"10":[{"catchword":"Ik zal uw","tekst":"Hier wordt den engel een Goddelijk werk toegeschreven, waaruit men verstaan kan, dat hij niet een schepsel, maar de Schepper zelf is."},{"catchword":"grotelijks","tekst":"Hebr. vermenigvuldigende vermenigvuldigen. Deze lichamelijke zegen is te onderscheiden van den geestelijken, welke bleef bij het zaad der belofte."}],"11":[{"catchword":"uw verdrukking","tekst":"Hebr. naar uw ellende gehoord heeft."}],"12":[{"catchword":"woudezel","tekst":"Dat is een wild, woest mens, gelijk een wilde of woudezel, daaronder begrepen dat hij zou zijn een onversaagd en vreeslijk krijgsman. Zie onder, hoofdstuk Gen 21:20."},{"catchword":"zijn hand zal","tekst":"Dat is, tot vechten en oorlogen zal hij ieder tergen, en zal ook daarom door anderen getergd worden. Versta dit niet alleen van zijn persoon, maar ook van zijn nakomelingen."},{"catchword":"en hij zal wonen","tekst":"De zin is, dat hij de grenzen zijner woning wijd en breed zou uitspreiden, tot onder zijn maagschap, die hij niet zou vrezen, maar haar stoutelijk het aangezicht bieden. Zie onder, Gen 25:18."}],"13":[{"catchword":"naam des HEEREN,","tekst":"Hier wordt de voornoemde engel uitdrukkelijk JHWH, de HEERE, genoemd. Verg. boven vs.7."},{"catchword":"Gij God","tekst":"Dat is, die alle dingen ziet, en mij nu ook in deze mijn zware ellende ten goede aangezien hebt, mij op den rechten weg helpende en vertroostende."},{"catchword":"Heb ik ook","tekst":"Dat is, is het geen wonder, dat ik hier nu nog het licht aanschouw, en in het leven ben, nadat Hij mij verschenen is, die naar mij in dezen mijn bedrukten staat omgezien heeft? Zij meende dat zij sterven zou, omdat zij den Heere gezien had. Verg. onder Gen 32:30; Exo 24:11; Jdg 13:22."}],"14":[{"catchword":"Lachai-Róï;","tekst":"Dat is, des levenden die mij ziet. Zij noemde den put naar zichzelve, omdat zij in het leven gebleven was, nadat zij den Heere gezien had; en ook naar den Heere, omdat Hij haar gunstig aangezien had; doch anderen menen dat beide benamingen op God zien, die leeft en alles ziet."},{"catchword":"Kades","tekst":"Zie boven Gen 14:7, en de aant."}],"15":[{"catchword":"Ismaël.","tekst":"Ontwijfelbaar door Hagar onderricht zijnde, dat God den naam van het kind aldus genoemd had; zie vs.11."}],"16":[{"catchword":"was zes en tachtig","tekst":"Hebr. een zoon van tachtig jaren en zes jaren, alzo in het eerste Gen 17:1, van het volgende hoofdstuk."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Yet Sarai Abrams wife did not hear to him or brought net forth unto him and she and Egyptian maid-servant whose name was Hagar."}],"2":[{"catchword":null,"tekst":"Therefore Sarai said to Abram behold I pray the Lord hath shut me up [that is made me barren compare chapter 20 verse 18] that I bear not go in I pray to my maid-servant [see chapter 6.4 and so below verse 4 Sarai despairing of her own bodily issue and yet heartily longing for the promised seed she doth so far here forget herself that without asking Gods advice she counsels her husband to endeavor the f // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

document.addEventListener('click', e => {

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {

  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';

  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
