ten gegeven heeft.", "Job 36:18": "Omdat er grimmigheid is, pas op, dat Hij u niet misschien met een klap wegstoot; zodat u een groot rantsoen er niet af zou kunnen brengen.", "Spr 18:14": "De geest van een man zal zijn ziekte dragen; maar een verslagen geest, wie zal die opheffen?", "Ps 62:5": "Zij overleggen slechts om hem van zijn hoogheid te verstoten; zij hebben behagen in leugen; met hun mond zegenen zij, maar met hun binnenste vloeken zij. Sela.", "Kol 2:21": "Namelijk: raak niet, en proef niet, en roer niet aan?", "Jes 41:15": "Zie, Ik heb u gemaakt tot een scherpe nieuwe dorsslede, die scherpe punten heeft; u zult bergen dorsen en verpulveren, en heuvels zult u maken als kaf.", "Joh 16:21": "Een vrouw heeft droefheid wanneer zij baart, omdat haar tijd gekomen is; maar wanneer zij het kind gebaard heeft, denkt zij niet meer aan de benauwdheid, vanwege de blijdschap dat er een mens ter wereld geboren is.", "Gen 2:8": "Ook had de HEERE God een hof geplant in Eden, tegen het oosten, en Hij zette daar de mens, die Hij gevormd had.", "2 Kon 6:20": "En het gebeurde, toen zij in Samaria gekomen waren, dat Elisa zei: HEERE, open de ogen van dezen, dat zij zien! En de HEERE opende hun ogen, dat zij zagen; en zie, zij waren midden in Samaria.", "Jes 28:14": "Daarom, hoor het woord van de HEERE, u bespotters, u die heersen over dit volk, dat in Jeruzalem is!", "Ps 35:19-21": "Laat hen zich niet verblijden over mij, die mij om valse oorzaken vijand zijn; laat hen ook niet wenken met de ogen, die mij zonder oorzaak haten. Want zij spreken niet van vrede, maar zij bedenken bedrieglijke zaken tegen de stillen in het land. En zij sperren hun mond wijd open tegen mij; zij zeggen: Ha, ha, ons oog heeft het gezien!", "Rom 6:21": "Wat voor vrucht had u toen van die dingen waarover u zich nu schaamt? Want het einde daarvan is de dood.", "Jak 2:13": "Want een onbarmhartig oordeel zal komen over hem die geen barmhartigheid bewezen heeft; en de barmhartigheid triomfeert over het oordeel.", "Spr 6:19": "een vals getuige, die leugens uitblaast; en wie ruzie zaait tussen broeders.", "Ef 4:27": "En geef de duivel geen plaats.", "1 Joh 4:10": "Hierin is de liefde: niet dat wij God liefgehad hebben, maar dat Hij ons lief heeft gehad, en Zijn Zoon gezonden heeft tot een verzoening voor onze zonden.", "Ps 4:7": "Velen zeggen: Wie zal ons het goede laten zien? Verhef U over ons het licht van uw aangezicht, o HEERE!", "Hand 3:22-24": "Want Mozes heeft tegen de vaderen gezegd: De Heere, uw God, zal u een Profeet doen opstaan uit uw broeders, zoals mij; naar Hem moet u luisteren, in alles wat Hij tegen u zal zeggen. En het zal gebeuren dat iedere ziel die niet naar deze Profeet zal hebben geluisterd, uitgeroeid zal worden uit het volk. En ook al de profeten, van Samuel af, en die daarna gevolgd zijn, zovelen als er gesproken hebben, hebben ook deze dagen van tevoren verkondigd.", "Jes 29:20": "Wanneer de tiran een einde zal hebben, en het met de spotter voorbij zal zijn, en allen die op ongerechtigheid loeren, uitgeroeid zullen zijn;", "Job 10:21": "Voordat ik heenga (en niet terugkom) naar een land van duisternis en van de schaduw van de dood;", "1 Tim 6:7": "Want wij hebben niets in de wereld meegebracht, het is duidelijk dat wij er ook niets uit kunnen meedragen.", "1 Tim 5:18": "Want de Schrift zegt: Een dorsende os zult u niet muilbanden; en: De arbeider is zijn loon waard.", "Deut 25:4": "Een os zult u niet muilbanden, als hij graan dorst.", "Mark 9:43": "En als uw hand u doet struikelen, hak hem af; het is beter voor u verminkt het leven in te gaan, dan met twee handen naar de hel te gaan, in het onblusbare vuur;", "Luk 22:40": "En toen Hij op die plaats gekomen was, zei Hij tegen hen: Bid, dat u niet in verzoeking komt.", "2 Kor 5:2": "Want ook hierin zuchten wij, verlangend om met onze woning die uit de hemel is overkleed te worden.", "Job 36:12": "Maar als zij niet horen, dan gaan zij door het zwaard om, en geven zij de geest zonder kennis.", "1 Kor 2:10": "Maar God heeft het ons geopenbaard door Zijn Geest; want de Geest onderzoekt alle dingen, ook de diepten van God.", "Jer 22:23": "O u, die nu op de Libanon woont, en in de ceders nestelt! hoe genadig zult u zijn, als de smarten u zullen overkomen, de pijn als van een barende vrouw!", "Ezech 22:21": "Ja, Ik zal u bijeenbrengen, en op u blazen in het vuur van Mijn verbolgenheid, zodat u in het midden ervan zult smelten.", "Job 5:14": "Overdag ontmoeten zij de duisternis, en zoals 's nachts tasten zij rond in de middag.", "Pred 2:26": "Want Hij geeft wijsheid, kennis en vreugde aan de mens die goed is voor Zijn aangezicht; maar aan de zondaar geeft Hij de bezigheid om te verzamelen en te vergaderen, opdat Hij het geeft aan wie goed is voor Gods aangezicht. Dit is ook ijdelheid en kwelling van de geest.", "Luk 11:18": "Als dan ook de satan tegen zichzelf verdeeld is, hoe zal zijn rijk bestaan? Want u zegt dat Ik door Beëlzebul de demonen uitdrijf.", "Job 11:20": "Maar de ogen van de goddelozen zullen bezwijken, en de toevlucht zal van hen vergaan; en hun verwachting zal zijn de laatste ademtocht.", "Job 19:21": "Ontferm u over mij, ontferm u over mij, o mijn vrienden! want de hand van God heeft mij aangeraakt.", "Gen 2:23": "Toen zei Adam: Dit is ditmaal been van mijn benen, en vlees van mijn vlees! Men zal haar Manninne noemen, omdat zij uit de man genomen is.", "Jak 1:15": "Daarna, als de begeerte ontvangen is, baart zij zonde; en als de zonde volgroeid is, baart zij de dood.", "Tit 2:5": "Matig te zijn, kuis te zijn, het huis te bewaren, goed te zijn, hun eigen mannen onderdanig te zijn, opdat het Woord van God niet gelasterd wordt.", "Gen 2:7": "En de HEERE God had de mens gevormd uit het stof van de aarde, en in zijn neusgaten de adem van het leven geblazen; zo werd de mens tot een levende ziel.", "Hand 13:10": "O kind van de duivel, vol van alle bedrog en van alle arglistigheid, vijand van alle gerechtigheid, zult u niet ophouden de rechte wegen van de Heere te verdraaien?", "Luk 16:14": "En al deze dingen hoorden ook de Farizeeën, die geldgierig waren, en zij beschimpten Hem.", "Luk 4:1": "En Jezus, vol van de Heilige Geest, keerde terug van de Jordaan, en werd door de Geest geleid in de woestijn;", "Spr 27:15": "Een aanhoudend druppelen op een dag van slagregen en een twistzieke huisvrouw zijn precies gelijk.", "Rom 6:12-14": "Laat dan de zonde niet heersen in uw sterfelijk lichaam, om haar te gehoorzamen in de begeerten daarvan. En stel uw leden niet tot wapens van de ongerechtigheid ter beschikking aan de zonde; maar stel uzelf ter beschikking aan God, als mensen die uit de doden levend geworden zijn, en stel uw leden tot wapens van de gerechtigheid ter beschikking aan God. Want de zonde zal over u niet heersen; want u bent niet onder de wet, maar onder de genade.", "Matt 2:6": "En u, Bethlehem, land van Juda! U bent geenszins de minste onder de vorsten van Juda; want uit u zal de Leidsman voortkomen, Die Mijn volk Israël weiden zal.", "1 Kon 22:6": "Toen verzamelde de koning van Israël de profeten, ongeveer vierhonderd man, en hij zei tegen hen: Zal ik tegen Ramoth in Gilead ten strijde trekken, of zal ik het nalaten? En zij zeiden: Trek op, want de Heere zal ze in de hand van de koning geven.", "Rom 2:15": "Als mensen die het werk van de wet laten zien, geschreven in hun harten, terwijl hun geweten mede getuigt, en de gedachten elkaar onderling beschuldigen, of ook wel ontschuldigen).", "Ps 21:12": "Want zij hebben kwaad tegen U aangelegd; zij hebben een schandelijke daad bedacht, doch zullen niets vermogen.", "Ps 7:15-17": "Zie, hij is zwanger van onrecht, en heeft moeite ontvangen, hij zal leugen baren. Hij heeft een kuil gegraven, en hem uitgegraven, maar hij is gevallen in de groeve, die hij gemaakt heeft. Zijn moeite zal op zijn eigen hoofd terugkeren, en zijn geweld op zijn eigen schedel neerdalen.", "Pred 1:14": "Ik heb al de werken gezien die onder de zon gebeuren; en zie, het was allemaal vluchtig en kwelling van de geest.", "2 Kor 5:19": "Want God was in Christus de wereld met Zichzelf aan het verzoenen, doordat Hij hun zonden hun niet toerekende; en Hij heeft het woord van de verzoening in ons gelegd.", "Est 1:20": "Wanneer het bevel van de koning, dat hij zal geven in zijn hele koninkrijk (want het is groot), bekend wordt gemaakt, dan zullen alle vrouwen aan hun mannen eer geven, van de grootste tot de kleinste toe.", "Job 19:26": "En als zij na mijn huid dit doorknaagd zullen hebben, zal ik uit mijn vlees God aanschouwen;", "Zach 5:2-4": "En Hij zei tegen mij: Wat ziet u? En ik zei: Ik zie een vliegende rol, de lengte ervan is twintig el, en de breedte ervan tien el. Toen zei Hij tegen mij: Dit is de vloek die uitgaan zal over heel het land; want ieder die steelt, zal hiervandaan, volgens deze vloek, uitgeroeid worden; en ieder die valselijk zweert, zal hiervandaan, volgens deze vloek, uitgeroeid worden. Ik breng deze vloek naar buiten, spreekt de HEERE van de heerscharen, dat hij komt in het huis van de dief, en in het huis van hem die bij Mijn Naam vals zweert; en hij zal midden in zijn huis overnachten, en hij zal het verteren, met zijn hout en zijn stenen.", "Rom 16:20": "En de God van de vrede zal de satan spoedig onder uw voeten verpletteren. De genade van onze Heere Jezus Christus zij met u. Amen.", "Luk 1:31-35": "En zie, u zult zwanger worden, en een Zoon baren, en u zult Hem de naam JEZUS geven. Hij zal groot zijn, en de Zoon van de Allerhoogste genoemd worden; en God, de Heere, zal Hem de troon van Zijn vader David geven. En Hij zal over het huis van Jakob Koning zijn tot in eeuwigheid, en aan Zijn koninkrijk zal geen einde zijn.", "Ps 56:8": "Zouden zij om hun ongerechtigheid vrijuit gaan? Stort de volken neder in toorn, o God!", "Hand 5:31": "Deze heeft God door Zijn rechterhand verhoogd tot een Vorst en Zaligmaker, om Israël bekering en vergeving van zonden te geven.", "Ps 109:22-24": "Want ik ben ellendig en behoeftig, en mijn hart is in mijn binnenste doorwond. Ik ga heen als een schaduw wanneer die zich neigt; ik word omgedreven als een sprinkhaan. Mijn knieën struikelen van het vasten, en mijn vlees is vermagerd, zodat er geen vet aan is.", "Amos 8:14": "Zij die zweren bij de schuld van Samaria, en zeggen: Zo waarachtig als uw God van Dan leeft, en de weg van Berseba leeft! zij zullen vallen, en niet meer opstaan.", "Mark 8:31": "En Hij begon hun te leren dat de Zoon des mensen veel moest lijden, en verworpen moest worden door de oudsten, en overpriesters, en Schriftgeleerden, en gedood moest worden, en na drie dagen weer moest opstaan.", "Jes 3:8": "Want Jeruzalem is gestruikeld, en Juda is gevallen, omdat hun tong en hun daden tegen de HEERE zijn, om de ogen van Zijn heerlijkheid te verbitteren.", "Klaagl 1:12": "Lamed. Gaat het u niet aan, u allen, die over de weg gaat? Schouwt het aan en ziet, of er een smart is gelijk mijn smart, die mij aangedaan is, waarmee de HEERE mij bedroefd heeft ten dage van de gloed van Zijn toorn.", "Luk 6:11": "Maar zij werden vervuld met woede, en overlegden met elkaar wat zij Jezus zouden aandoen.", "Matt 4:6": "en zei tegen Hem: Als U Gods Zoon bent, werp Uzelf naar beneden; want er is geschreven dat Hij Zijn engelen bevelen zal U te beschermen, en dat zij U op de handen zullen dragen, opdat U niet op enig moment Uw voet aan een steen stoot.", "Jes 52:14": "Zoals velen zich over u ontzet hebben — zo misvormd was Zijn gelaat, meer dan van iemand anders, en Zijn gedaante, meer dan van andere mensenkinderen —", "Ezech 7:4-6": "En Mijn oog zal u niet verschonen, en Ik zal niet sparen; maar Ik zal uw wegen op u brengen, en uw gruwelen zullen in het midden van u zijn, en u zult weten dat Ik de HEERE ben. Zo zegt de Heere HEERE: Een kwaad, een enig kwaad, zie, is gekomen; Een einde is er gekomen, dat einde is gekomen, het is opgewaakt tegen u; zie, het kwaad is gekomen!", "Jes 38:18": "Want het graf zal U niet loven, de dood zal U niet prijzen; wie in de kuil neerdalen, zullen op Uw waarheid niet hopen.", "Ef 1:7": "In Wie wij de verlossing hebben door Zijn bloed, namelijk de vergeving van de misdaden, naar de rijkdom van Zijn genade,", "Hebr 12:7": "Als u de kastijding verdraagt, gedraagt God Zich tegenover u als tegenover zonen; want welke zoon is er, die de vader niet kastijdt?", "Job 16:6-14": "Als ik spreek, wordt mijn smart niet ingehouden; en houd ik op, wat gaat er dan van mij weg? Zeker, Hij heeft mij nu vermoeid; U hebt mijn hele vergadering verwoest. Dat U mij rimpelig gemaakt hebt, is tot een getuige; en mijn magerheid staat tegen mij op, zij getuigt in mijn gezicht.", "Ps 40:7-11": "Gij hebt geen lust gehad aan slachtoffer en spijsoffer; Gij hebt mij de oren doorboord; brandoffer en zondoffer hebt Gij niet geëist. Toen zei ik: Zie, ik kom; in de rol van het boek is van mij geschreven. Ik heb lust, o mijn God! om Uw welbehagen te doen; en Uw wet is in het midden van mijn ingewand.", "Ps 59:4": "Want zie, zij leggen mijn ziel lagen; sterken rotten samen tegen mij; zonder mijn overtreding en zonder mijn zonde, o HEERE!", "Job 5:3": "Ik heb een dwaas gezien die wortel schoot; doch meteen vervloekte ik zijn woning.", "Spr 11:3": "De oprechtheid van de oprechten leidt hen; maar de verkeerdheid van de trouwelozen verstoort hen.", "Hand 13:45": "Doch de Joden, die de menigten zagen, werden vervuld met afgunst, en weerspraken wat door Paulus gezegd werd, en tegenspraken en lasterden.", "Ps 4:3": "U, mannen, hoe lang zal mijn eer tot schande zijn? Hoe lang zult u de ijdelheid liefhebben, de leugen zoeken? Sela.", "Luk 13:9": "en als hij dan vrucht draagt, laat hem staan; maar zo niet, dan kunt u hem daarna omhakken.", "Gal 4:5": "opdat Hij hen die onder de wet waren, verlossen zou, en opdat wij de aanneming tot kinderen verkrijgen zouden.", "Matt 25:24-27": "Maar hij die het ene talent ontvangen had, kwam ook en zei: Heer, ik kende u, dat u een hard mens bent, die maait waar u niet gezaaid hebt, en verzamelt vandaar waar u niet gestrooid hebt; En ik was bang, en ben weggegaan, en heb uw talent verborgen in de aarde; zie, u hebt het uwe. Maar zijn heer antwoordde en zei tegen hem: U slechte en luie dienstknecht! U wist dat ik maai waar ik niet gezaaid heb, en vandaar verzamel waar ik niet gestrooid heb.", "Matt 3:11": "Ik doop u wel met water tot bekering; maar Hij Die na mij komt, is sterker dan ik, van Wie ik niet waardig ben Zijn schoenen te dragen; Hij zal u met de Heilige Geest en met vuur dopen.", "Jes 29:16": "Uw omkeren van de dingen is, alsof de pottenbakker geacht werd als leem, dat het maaksel zei van zijn maker: Hij heeft mij niet gemaakt; en het gevormde vat zei van zijn pottenbakker: Hij begrijpt het niet.", "Luk 22:32": "maar Ik heb voor u gebeden, dat uw geloof niet ophoudt; en u, als u eens bekeerd bent, versterk dan uw broeders.", "Luk 13:27": "En Hij zal zeggen: Ik zeg u, Ik weet niet waar u vandaan komt; ga weg van Mij, allen die ongerechtigheid werken!", "Deut 24:15": "Op zijn dag zult u hem zijn loon geven, en de zon zal daarover niet ondergaan; want hij is arm, en zijn ziel verlangt daarnaar; zodat hij tegen u niet roept tot de HEERE, en er zonde in u is.", "Job 4:9": "Van de adem van God komen zij om, en van het geblaas van Zijn neus worden zij verdaan.", "Luk 23:39-43": "En een van de kwaaddoeners die daar hingen, lasterde Hem en zei: Als U de Christus bent, verlos Uzelf en ons. Maar de ander antwoordde en bestrafte hem: Vreest u ook God niet, terwijl u in hetzelfde oordeel bent? En wij toch terecht; want wij ontvangen straf die past bij wat wij gedaan hebben; maar Deze heeft niets onbehoorlijks gedaan.", "Hand 5:3": "En Petrus zei: Ananias, waarom heeft de satan uw hart vervuld, dat u de Heilige Geest zou liegen, en onttrekken van de prijs van het land?", "Gen 4:1": "En Adam had gemeenschap met Eva, zijn vrouw, en zij werd zwanger en baarde Kaïn, en zei: Ik heb een man van de HEERE verkregen!", "Joël 3:13-16": "Sla de sikkel erin, want de oogst is rijp geworden; kom, daal af, want de pers is vol, en de perskuipen lopen over; want hun slechtheid is groot. Menigten, menigten in het dal van de beslissing; want de dag van de HEERE is nabij, in het dal van de beslissing. De zon en de maan zijn zwart geworden, en de sterren hebben hun glans ingetrokken.", "1 Joh 4:4": "Kinderen, u bent uit God, en hebt hen overwonnen; want Hij die in u is, is meer dan hij die in de wereld is.", "Pred 7:29": "Alleen zie, dit heb ik gevonden, dat God de mens recht gemaakt heeft, maar zij hebben veel uitvindingen gezocht.", "Mal 3:18": "Dan zult u opnieuw zien het onderscheid tussen de rechtvaardige en de goddeloze, tussen wie God dient, en wie Hem niet dient.", "Pred 6:6": "Ja, al leefde hij wel tweemaal duizend jaren, en zag hij het goede niet; gaan zij niet allen naar één plaats?", "1 Tim 2:14": "En Adam is niet verleid, maar de vrouw is, verleid zijnde, in overtreding geweest.", "2 Kon 19:25": "Hebt u niet gehoord dat Ik dit lang van tevoren gedaan heb, en het van oude dagen af gevormd heb? Nu heb Ik het laten komen, dat u de versterkte steden zou verstoren tot puinhopen.", "Joh 8:59": "Toen namen zij stenen op om die op Hem te werpen. Maar Jezus verborg Zich, en ging de tempel uit, terwijl Hij door hun midden ging; en zo ging Hij weg.", "Luk 11:4": "En vergeef ons onze zonden; want ook wij vergeven ieder die ons schuldig is. En leid ons niet in verzoeking, maar verlos ons van de boze.", "Job 15:35": "Zij ontvangen moeite, en baren ijdelheid, en hun buik richt bedrog aan.", "Ps 16:10": "Want U zult mijn ziel in het graf niet verlaten; U zult niet toelaten dat Uw Heilige de ontbinding ziet.", "Spr 21:9": "Het is beter te wonen op een hoek van het dak, dan met een kijfachtige vrouw, en dat in een huis van gezelschap.", "Hebr 12:26": "Wiens stem toen de aarde deed beven; maar nu heeft Hij verkondigd en gezegd: Nog eenmaal zal Ik niet alleen de aarde doen beven, maar ook de hemel.", "2 Kor 11:3": "Doch ik vrees dat, zoals de slang Eva door haar arglistigheid bedrogen heeft, zo ook uw gedachten op enigerlei wijze bedorven worden, om af te wijken van de eenvoudigheid die in Christus is.", "2 Kor 4:17": "Want onze lichte verdrukking, die zeer haast voorbijgaat, brengt ons een geheel bijzonder groot en eeuwig gewicht van heerlijkheid;", "Spr 26:27": "Wie een kuil graaft, zal erin vallen, en wie een steen wentelt, op hem zal die terugkeren.", "Spr 28:18": "Wie oprecht wandelt, zal behouden worden; maar wie zich verkeerd gedraagt op twee wegen, zal op een van de twee vallen.", "Ps 75:11": "En ik zal alle hoorns van de goddelozen afhouwen; de hoorns van de rechtvaardige zullen verhoogd worden.", "Mark 10:33": "En Hij zei: Zie, wij gaan op naar Jeruzalem, en de Zoon des mensen zal aan de overpriesters, en aan de Schriftgeleerden overgeleverd worden, en zij zullen Hem ter dood veroordelen, en Hem aan de heidenen overleveren;", "1 Tim 3:4": "iemand die zijn eigen huis goed bestuurt en zijn kinderen in onderdanigheid houdt, met alle waardigheid;", "Jes 13:9": "Zie, de dag van de HEERE komt, gruwelijk, met verbolgenheid en hevige toorn, om het land tot verwoesting te stellen, en de zondaars daaruit te verdelgen.", "2 Petr 2:9": "dan weet de Heere hoe Hij de godvruchtigen uit de verzoeking moet verlossen, en de onrechtvaardigen moet bewaren tot de dag van het oordeel om gestraft te worden;", "Spr 24:29": "Zeg niet: Zoals hij mij gedaan heeft, zo zal ik hem doen; ik zal ieder vergelden naar zijn werk.", "Gen 2:21-24": "Toen deed de HEERE God een diepe slaap op Adam vallen, en hij sliep; en Hij nam een van zijn ribben, en sloot de plaats daarvan toe met vlees. En de HEERE God bouwde de rib, die Hij van Adam genomen had, tot een vrouw, en Hij bracht haar bij Adam. Toen zei Adam: Dit is ditmaal been van mijn benen, en vlees van mijn vlees! Men zal haar Manninne noemen, omdat zij uit de man genomen is.", "Jes 48:10": "Zie, Ik heb u gelouterd, doch niet als zilver, Ik heb u gekeurd in de smeltkroes van de ellende.", "Joh 7:39": "(En dit zei Hij van de Geest, die zij die in Hem geloven zouden ontvangen; want de Heilige Geest was er nog niet, omdat Jezus nog niet verheerlijkt was.)", "Matt 1:20": "En terwijl hij deze dingen overwoog, zie, de engel van de Heere verscheen hem in een droom en zei: Jozef, zoon van David! Wees niet bevreesd Maria, uw vrouw, tot u te nemen, want wat in haar ontvangen is, dat is uit de Heilige Geest;", "Hand 23:8": "Want de Sadduceeën zeggen dat er geen opstanding is, en ook geen engel of geest; maar de Farizeeën belijden het beide.", "Jer 14:14": "En de HEERE zei tegen mij: Die profeten profeteren vals in Mijn Naam; Ik heb hen niet gezonden, hun ook geen bevel gegeven, noch tot hen gesproken; zij profeteren u een vals gezicht, en waarzeggerij, en nietigheid, en bedrog van hun hart.", "Job 36:23": "Wie heeft Hem gesteld over Zijn weg? Of wie heeft gezegd: U hebt onrecht gedaan?", "Gen 9:20": "En Noach begon een akkerman te zijn, en hij plantte een wijngaard.", "Jes 21:3": "Daarom zijn mijn lendenen vol grote pijn, weeën hebben mij aangegrepen, zoals de weeën van een barende vrouw; ik krom mij van wat ik hoor, ik word ontsteld van wat ik zie.", "Ps 144:4": "De mens lijkt op een ademtocht; zijn dagen zijn als een voorbijgaande schaduw.", "Ps 107:5": "Zij waren hongerig, ook dorstig; hun ziel was in hen overstelpt.", "Rom 14:21": "Het is goed geen vlees te eten, en geen wijn te drinken, en niets waaraan uw broeder zich stoot, of geërgerd wordt, of waarin hij zwak is.", "Ps 9:18": "De goddelozen zullen terugkeren, naar de hel toe, alle heidenen die God vergeten zijn.", "Mark 12:40": "die de huizen van weduwen opeten, en dat onder de schijn van lang te bidden. Dezen zullen een zwaarder oordeel ontvangen.", "Spr 24:3-7": "Door wijsheid wordt een huis gebouwd, en door verstandigheid bevestigd; En door kennis worden de binnenkamers gevuld met alle kostelijk en heerlijk goed. Een wijs man is sterk; en een man van kennis maakt de kracht groter.", "2 Kor 5:21": "Want Hem Die geen zonde gekend heeft, heeft Hij voor ons tot zonde gemaakt, opdat wij zouden worden rechtvaardigheid van God in Hem.", "Ezech 31:18": "Aan wie bent u zo gelijk in heerlijkheid en grootheid, onder de bomen van Eden? Ja, u zult neergevoerd worden met de bomen van Eden, tot het onderste van de aarde; in het midden van de onbesnedenen zult u liggen, met de verslagenen door het zwaard. Dat is Farao, en zijn hele menigte, spreekt de Heere HEERE.", "Joh 3:18": "Wie in Hem gelooft, wordt niet veroordeeld, maar wie niet gelooft, is al veroordeeld, omdat hij niet geloofd heeft in de Naam van de eniggeboren Zoon van God.", "Job 21:33": "De kluiten van het dal zijn hem zoet, en hij trekt achter zich alle mensen aan; en van hen die vóór hem geweest zijn, is geen getal.", "Jes 33:16": "Die zal in de hoogten wonen, de sterkten van de steenrotsen zullen zijn hoge schuilplaats zijn; zijn brood wordt hem gegeven, zijn water is gewis.", "Ps 14:1": "Een psalm van David, voor de koorleider. De dwaas zegt in zijn hart: Er is geen God. Zij verderven het, zij maken het gruwelijk met hun werk; er is niemand die goed doet.", "Ezech 9:9": "Toen zei Hij tot mij: De ongerechtigheid van het huis van Israël en van Juda is heel erg groot, en het land is met bloed vervuld, en de stad is vol van afwijking; want zij zeggen: De HEERE heeft het land verlaten, en de HEERE ziet niet.", "2 Tess 3:10": "Want ook toen wij bij u waren, hebben wij u dit bevolen: dat als iemand niet wil werken, hij ook niet moet eten.", "Openb 12:10": "En ik hoorde een grote stem, die zei in de hemel: Nu is de zaligheid, en de kracht, en het koninkrijk van onze God gekomen; en de macht van Zijn Christus; want de aanklager van onze broeders, die hen aanklaagde voor onze God dag en nacht, is neergeworpen.", "Hand 17:26": "En Hij heeft uit één bloed heel het geslacht van de mensen gemaakt, om op de hele aardbodem te wonen, en Hij heeft de vastgestelde tijden bepaald, en de grenzen van hun woongebied;", "Jer 13:22": "Wanneer u dan in uw hart zult zeggen: Waarom zijn mij deze dingen overkomen? Om de veelheid van uw ongerechtigheid zijn uw zomen ontbloot, en uw hielen hebben geweld geleden.", "Jes 38:1": "In die dagen werd Hizkia ziek tot de dood toe; en de profeet Jesaja, de zoon van Amoz, kwam bij hem en zei tegen hem: Zo zegt de HEERE: Regel uw zaken; want u zult sterven en niet leven.", "1 Joh 3:13-15": "Verwonder u niet, mijn broeders, als de wereld u haat. Wij weten dat wij overgegaan zijn uit de dood in het leven, omdat wij de broeders liefhebben; wie zijn broeder niet liefheeft, blijft in de dood. Ieder die zijn broeder haat, is een moordenaar; en u weet dat geen moordenaar het eeuwige leven in zich heeft blijven.", "Joh 13:2": "En terwijl het avondmaal gehouden werd, en de duivel al in het hart van Judas, de zoon van Simon Iskariot, gegeven had dat hij Hem verraden zou,", "Jer 11:4": "Dat Ik uw vaderen geboden heb, op de dag dat Ik hen uit Egypteland, uit de ijzeroven, uitvoerde, en Ik zei: Wees Mijn stem gehoorzaam, en doe die, naar alles wat Ik u gebied; zo zult u Mij tot een volk zijn, en Ik zal u tot een God zijn;", "Ps 22:8": "Allen die mij zien, bespotten mij; zij steken de lip uit, zij schudden het hoofd en zeggen:", "Ex 19:12": "En bepaal de grens voor het volk rondom, en zeg: Wacht ervoor de berg te beklimmen en de rand ervan aan te raken; al wie de berg aanraakt, zal zeker gedood worden.", "1 Tim 2:12": "Maar ik sta de vrouw niet toe dat zij leert, of over de man heerst, maar ik wil dat zij in stilte is.", "Ex 20:17": "U zult niet begeren het huis van uw naaste; u zult niet begeren de vrouw van uw naaste, of zijn dienstknecht, of zijn dienstmaagd, of zijn os, of zijn ezel, of iets dat van uw naaste is.", "Gal 6:8": "Want die in zijn eigen vlees zaait, zal uit het vlees verderf maaien; maar die in de Geest zaait, zal uit de Geest het eeuwige leven maaien.", "Jes 5:21": "Wee hun die in hun eigen ogen wijs, en naar hun eigen oordeel verstandig zijn!", "Gen 3:1-6": "De slang was listiger dan al het gedierte van het veld, dat de HEERE God gemaakt had; en zij zei tegen de vrouw: Is het echt zo dat God gezegd heeft: U zult niet eten van alle bomen in de hof? En de vrouw zei tegen de slang: Van de vrucht van de bomen in de hof mogen wij eten; Maar van de vrucht van de boom die in het midden van de hof staat, heeft God gezegd: U zult daarvan niet eten, en u zult die ook niet aanraken, anders sterft u.", "Ps 18:28": "Want U verlost het bedrukte volk, maar de hoge ogen vernedert U.", "Rom 14:13": "Laten wij elkaar dan niet meer oordelen; maar oordeelt dit liever, namelijk dat u de broeder geen aanstoot of ergernis geeft.", "Openb 22:16": "Ik, Jezus, heb Mijn engel gezonden om u deze dingen te getuigen in de Gemeenten. Ik ben de Wortel en het geslacht van David, de blinkende Morgenster.", "Spr 13:6": "De gerechtigheid bewaart de oprechte op de weg; maar de goddeloosheid zal de zondaar omkeren.", "Joh 5:27": "en Hij heeft Hem macht gegeven om ook gericht te houden, omdat Hij de Zoon des mensen is.", "Spr 20:22": "Zeg niet: Ik zal het kwaad vergelden; wacht op de HEERE, en Hij zal u verlossen.", "Job 5:17": "Zie, gelukzalig is de mens, aan wie God straft; daarom verwerp de kastijding van de Almachtige niet.", "2 Kor 3:17": "De Heere nu is de Geest; en waar de Geest van de Heere is, daar is vrijheid.", "Jes 10:15": "Zal een bijl zich beroemen tegen hem die daarmee houwt? Zal een zaag pochen tegen hem die ze trekt? Alsof een staf beweegt wie hem opheffen? Als men een stok opheft, is het geen hout?", "Matt 15:13": "Maar Hij antwoordde en zei: Elke plant die Mijn hemelse Vader niet geplant heeft, zal uitgeroeid worden.", "Job 3:13": "Want nu zou ik neerliggen, en stil zijn; ik zou slapen, dan zou voor mij rust zijn;", "Matt 8:12": "maar de kinderen van het koninkrijk zullen uitgeworpen worden in de buitenste duisternis; daar zal gehuil zijn, en het geknars van de tanden.", "Jak 1:10": "En de rijke in zijn vernedering; want hij zal als een bloem van het gras voorbijgaan.", "1 Joh 2:26": "Dit heb ik u geschreven over hen, die u verleiden.", "Tit 3:4-6": "Maar toen de goedertierenheid van God, onze Zaligmaker, en Zijn liefde tot de mensen verschenen is, Heeft Hij ons zalig gemaakt, niet uit de werken van de rechtvaardigheid die wij gedaan hadden, maar naar Zijn barmhartigheid, door het bad van de wedergeboorte en de vernieuwing door de Heilige Geest; Die Hij over ons rijkelijk heeft uitgegoten door Jezus Christus, onze Zaligmaker;", "Matt 12:40": "Want zoals Jona drie dagen en drie nachten in de buik van de walvis was, zo zal de Zoon des mensen drie dagen en drie nachten in het hart van de aarde zijn.", "1 Kor 2:2": "Want ik had besloten niets te weten onder u, dan Jezus Christus, en Die gekruisigd.", "Hebr 2:14-18": "Omdat nu de kinderen deel hebben aan vlees en bloed, heeft Hij Zelf op dezelfde manier daaraan deelgenomen, opdat Hij door de dood hem teniet zou doen die de macht over de dood had, dat is: de duivel; en zou verlossen allen die door angst voor de dood, heel hun leven lang, aan slavernij onderworpen waren. Want inderdaad, Hij neemt niet de engelen aan, maar Hij neemt het nageslacht van Abraham aan.", "Hebr 10:14": "Want met één offer heeft Hij voor eeuwig volmaakt gemaakt hen die geheiligd worden.", "Jes 5:6": "En Ik zal hem tot een woestenij maken; hij zal niet gesnoeid, noch omgespit worden, maar distels en doornen zullen erin opkomen; en Ik zal de wolken gebieden dat zij er geen regen op laten regenen.", "Jes 43:27": "Uw eerste vader heeft gezondigd, en uw uitleggers hebben tegen Mij overtreden.", "Jer 23:5": "Zie, de dagen komen, spreekt de HEERE, dat Ik voor David een rechtvaardige Spruit zal doen opstaan; Die zal Koning zijnde regeren, en voorspoedig zijn, en recht en gerechtigheid doen op de aarde.", "2 Kor 11:15": "Zo is het dan niets groots, als ook zijn dienaars zich veranderen als waren zij dienaars van de gerechtigheid; van wie het einde zal zijn naar hun werken.", "Joh 7:1": "Na deze dingen trok Jezus rond in Galilea; want Hij wilde niet in Judea rondtrekken, omdat de Joden Hem probeerden te doden.", "Jak 5:4": "Zie, het loon van de arbeiders die uw landen gemaaid hebben, dat door u is achtergehouden, roept; en het geschrei van hen die geoogst hebben, is gekomen tot in de oren van de Heere Sebaoth.", "Job 22:17": "Die tegen God zeiden: Wijk van ons! En wat zou de Almachtige voor hen kunnen doen?", "Joh 10:18": "Niemand neemt het van Mij, maar Ik leg het zelf af; Ik heb macht om het af te leggen, en Ik heb macht om het opnieuw te nemen. Dit gebod heb Ik van Mijn Vader ontvangen.", "Ex 3:6": "Hij zei verder: Ik ben de God van uw vader, de God van Abraham, de God van Izak en de God van Jakob. En Mozes verborg zijn gezicht, want hij was bang om God aan te zien.", "1 Kor 6:9": "Of weet u niet, dat de onrechtvaardigen het Koninkrijk van God niet zullen beërven?", "Matt 2:13": "Toen zij vertrokken waren, zie, de engel van de Heere verschijnt aan Jozef in de droom en zegt: Sta op, neem het Kindje en Zijn moeder tot u, en vlucht naar Egypte, en blijf daar totdat ik het u zeg; want Herodes zal het Kindje zoeken om Het te doden.", "Matt 13:7": "En een ander deel viel in de doornen; en de doornen kwamen op en verstikten het.", "Jes 29:4": "Dan zult u vernederd worden, u zult uit de aarde spreken, en uw spraak zal uit het stof zachtjes voortkomen; en uw stem zal zijn uit de aarde als van een tovenaar, en uw spraak zal uit het stof piepen.", "Luk 22:3": "En de satan voer in Judas, die bijgenaamd was Iskariot, die uit het getal van de twaalf was.", "Openb 22:19": "En als iemand iets afdoet van de woorden van het boek van deze profetie, zal God zijn deel afdoen uit het boek des levens, en uit de heilige stad, en uit wat in dit boek geschreven is.", "Mark 15:23": "En zij gaven Hem wijn met mirre vermengd te drinken; maar Hij nam die niet aan.", "1 Tess 2:18": "Daarom hebben wij tot u willen komen (zeker ik, Paulus) een keer en opnieuw, maar de satan heeft ons verhinderd.", "Openb 20:12-14": "En ik zag de doden, klein en groot, staande voor God; en de boeken werden geopend; en een ander boek werd geopend, dat van het leven is; en de doden werden geoordeeld uit wat in de boeken geschreven was, naar hun werken. En de zee gaf de doden, die in haar waren; en de dood en het rijk van de dood gaven de doden, die in hen waren; en zij werden geoordeeld, ieder naar zijn werken. En de dood en het rijk van de dood werden geworpen in de poel van het vuur; dit is de tweede dood.", "Fil 3:19": "Van wie het einde het verderf is, van wie God de buik is, en van wie de heerlijkheid in hun schande is, die aardse dingen bedenken.", "1 Sam 4:19-21": "En zijn schoondochter, de vrouw van Pinehas, was zwanger en stond op het punt te bevallen; toen zij het bericht hoorde dat de ark van God genomen was, en dat haar schoonvader en haar man gestorven waren, kromde zij zich ineen en baarde; want haar weeën overvielen haar. En omstreeks het tijdstip van haar sterven zeiden de vrouwen die bij haar stonden: Wees niet bang, want u hebt een zoon gebaard. Maar zij antwoordde niet, en trok het zich niet aan. En zij noemde de jongen Ikabod, en zei: De eer is weggevoerd uit Israël! Omdat de ark van God gevankelijk was weggevoerd, en vanwege haar schoonvader en haar man.", "Ps 73:27": "Want zie, wie ver van U zijn, zullen vergaan; U roeit uit al wie van U afhoereert;", "Spr 24:9": "De gedachte van de dwaasheid is zonde; en een spotter is de mensen een gruwel.", "Ezech 9:5-7": "Maar tot die anderen zei Hij voor mijn oren: Ga door de stad achter hem, en sla, uw oog verschoont niet, en spaar niet! Dood oude mensen, jonge mannen en meisjes, en kinderen en vrouwen, tot het verderven toe; maar kom niemand nabij op wie het teken is, en begin bij Mijn heiligdom. En zij begonnen bij de oude mannen, die vóór het huis waren. En Hij zei tot hen: Verontreinig het huis, en vervul de voorhoven met gedoden; ga naar buiten. En zij gingen naar buiten, en zij sloegen in de stad.", "Spr 17:22": "Een blij hart zal goed doen als een medicijn; maar een verslagen geest zal het gebeente doen verdrogen.", "Ps 3:8": "Sta op, HEERE, verlos mij, mijn God; want U hebt al mijn vijanden op het kinnebakken geslagen; de tanden van de goddelozen hebt U verbrijzeld.", "Matt 11:25": "In diezelfde tijd antwoordde Jezus en zei: Ik dank U, Vader! Heere van de hemel en van de aarde! Dat U deze dingen voor de wijzen en verstandigen verborgen hebt, en die aan de kinderen geopenbaard hebt.", "Jes 28:17-22": "En Ik zal het oordeel stellen naar het richtsnoer, en de gerechtigheid naar het paslood; en de hagel zal de toevlucht van de leugen wegvagen, en het water zal de schuilplaats overstromen. En uw verbond met de dood zal teniet gedaan worden, en uw voorzichtig verdrag met het rijk van de dood zal niet standhouden; wanneer de overstromende gesel doortrekt, dan zult u erdoor vertrapt worden. Vanaf de tijd dat hij doortrekt, zal hij u wegnemen, want elke morgen zal hij doortrekken, bij dag en bij nacht; en het zal gebeuren, dat louter het verstaan van het gerucht een verschrikking zal zijn.", "Ps 30:10": "Wat gewin is er in mijn bloed, in mijn neerdalen tot de groeve? Zal het stof U loven? Zal het Uw waarheid verkondigen?", "Ps 62:4": "Hoelang zult u kwaad aanstichten tegen een man? U zult allen gedood worden; u zult zijn als een ingebogen wand, een aangestoten muur.", "Job 1:21": "En hij zei: Naakt ben ik uit mijn moeders buik gekomen, en naakt zal ik daarheen terugkeren. De HEERE heeft gegeven, en de HEERE heeft genomen; de Naam van de HEERE zij geloofd!", "1 Petr 3:18": "Want Christus heeft ook eenmaal voor de zonden geleden, Hij, de Rechtvaardige, voor de onrechtvaardigen, opdat Hij ons tot God zou brengen; Hij is wel gedood in het vlees, maar levend gemaakt door de Geest;", "Job 2:5": "Strek toch Uw hand uit, en tast zijn gebeente en zijn vlees aan; dan zal hij U beslist in Uw aangezicht vervloeken!", "Jes 57:20": "Maar de goddelozen zijn als een voortgejaagde zee, want die kan niet tot rust komen, en haar water werpt slijk en modder op.", "Jes 47:3": "Uw schaamte zal ontdekt worden, ook zal uw schande gezien worden; Ik zal wraak nemen, en Ik zal u niet aanvallen als een mens.", "Spr 22:5": "Doornen en strikken liggen op de weg van de verkeerde; wie zijn ziel bewaart, zal zich ver daarvan houden.", "Luk 11:53": "En toen Hij deze dingen tegen hen zei, begonnen de Schriftgeleerden en Farizeeën Hem hevig aan te vallen, en Hem over veel dingen uit te horen;", "Ezech 25:15": "Zo zegt de Heere HEERE: Omdat de Filistijnen uit wraak gehandeld hebben, en van harte wraak geoefend hebben door plundering, om te vernielen vanuit een eeuwige vijandschap;", "Deut 8:11-14": "Wacht u ervoor dat u de HEERE, uw God, niet vergeet, door Zijn geboden, en Zijn rechten, en Zijn inzettingen niet te houden, die ik u vandaag gebied; Opdat niet misschien, als u gegeten zult hebben, en verzadigd bent, en goede huizen gebouwd hebt, en die bewoont, En uw runderen en uw schapen meer worden, ook zilver en goud u meer wordt, ja, al wat u hebt meer wordt;", "Luk 22:22": "En de Zoon des mensen gaat wel heen, zoals besloten is; maar wee die mens, door wie Hij verraden wordt!", "Ps 6:7": "Ik ben moe van mijn zuchten; ik laat mijn bed de hele nacht zwemmen; ik doornat mijn bedstede met mijn tranen.", "Jes 29:21": "die een mens schuldig maken om een woord, en die strikken leggen voor hem die bestraft in de poort; en die de rechtvaardige verdrijven met valse argumenten.", "Ezech 28:2": "Mensenkind! Zeg tegen de vorst van Tyrus: Zo zegt de Heere HEERE: Omdat uw hart zich verheft en u zegt: Ik ben God, ik zit in de zetel van God, in het hart van de zeeën! terwijl u een mens bent en geen God, stelt u toch uw hart als het hart van God.", "Openb 21:4": "En God zal alle tranen van hun ogen afvegen; en de dood zal niet meer zijn; noch rouw, noch geroep, noch moeite zal er meer zijn; want de eerste dingen zijn weggegaan.", "Hebr 2:10": "Want het paste Hem, om Wie alle dingen zijn, en door Wie alle dingen zijn, dat Hij, veel kinderen naar de heerlijkheid leidend, de leidsman van hun zaligheid door lijden zou volmaken.", "Hand 4:27": "Want in waarheid zijn tegen Uw heilig Kind Jezus, Die U gezalfd hebt, bijeengekomen, zowel Herodes en Pontius Pilatus, met de heidenen en de volken van Israël;", "2 Tess 2:14": "waartoe Hij u geroepen heeft door ons Evangelie, tot verkrijging van de heerlijkheid van onze Heere Jezus Christus.", "Ps 139:1-12": "Een psalm van David, voor de koorleider. HEERE! U doorgrondt en kent mij. U weet mijn zitten en mijn opstaan; U verstaat van verre mijn gedachten. U omringt mijn gaan en mijn liggen; en U bent al mijn wegen gewend.", "Jer 5:12": "Zij verloochenen de HEERE, en zeggen: Hij is het niet, en ons zal geen kwaad overkomen, wij zullen geen zwaard en geen honger zien.", "Jes 40:11": "Hij zal Zijn kudde weiden gelijk een herder; Hij zal de lammeren in Zijn armen bijeenbrengen, en in Zijn schoot dragen; de zogende dieren zal Hij zachtjes leiden.", "Ps 22:17": "Want honden hebben mij omsingeld; een vergadering van boosdoeners heeft mij omgeven; zij hebben mijn handen en mijn voeten doorgraven.", "Hand 7:52": "Wie van de profeten hebben uw vaders niet vervolgd? En zij hebben degenen gedood die van tevoren de komst van de Rechtvaardige verkondigd hebben, van Wie u nu verraders en moordenaars geworden bent.", "1 Kor 7:10-14": "Maar de getrouwden gebied ik niet, maar de Heere, dat de vrouw niet van de man scheidt. En als zij toch scheidt, laat zij dan ongetrouwd blijven, of zich verzoenen met de man; en dat de man de vrouw niet verlaat. Maar tegen de anderen zeg ik, niet de Heere: als een broeder een ongelovige vrouw heeft, en zij ermee tevreden is bij hem te wonen, laat hij haar niet verlaten;", "Spr 19:29": "Gerichten zijn voor de spotters bereid, en slagen voor de rug van de dwazen.", "Spr 19:16": "Die het gebod bewaart, bewaart zijn ziel; die zijn wegen veracht, zal sterven.", "Deut 13:3": "dan zult u naar de woorden van die profeet, of naar die dromen-dromer, niet horen; want de HEERE, uw God, beproeft u, om te weten of u de HEERE, uw God, liefhebt met heel uw hart en met heel uw ziel.", "Deut 30:11-14": "Want dit gebod, dat ik u heden gebied, dat is voor u niet verborgen, en dat is niet ver weg. Het is niet in de hemel, om te zeggen: Wie zal voor ons naar de hemel gaan, dat hij het voor ons haalt, en het ons laat horen, dat wij het doen? Het is ook niet aan de andere kant van de zee, om te zeggen: Wie zal voor ons oversteken naar de andere kant van de zee, dat hij het voor ons haalt, en het ons laat horen, dat wij het doen?", "Rom 9:21": "Of heeft de pottenbakker geen macht over het leem, om uit dezelfde klomp het ene vat tot eer te maken, en het andere tot oneer?", "Ps 22:12-22": "Wees dan niet ver van mij, want benauwdheid is nabij; want er is geen helper. Veel stieren hebben mij omsingeld, sterke stieren van Basan hebben mij omringd. Zij hebben hun mond tegen mij opgesperd, als een verscheurende en brullende leeuw.", "Spr 10:3": "De HEERE laat de ziel van de rechtvaardige niet hongeren; maar de have van de goddelozen stoot Hij weg.", "Dan 9:26": "En na die tweeënzestig weken zal de Messias uitgeroeid worden, maar het zal niet voor Hemzelf zijn; en een volk van de vorst die komen zal, zal de stad en het heiligdom verderven, en zijn einde zal zijn met een overstromende vloed, en tot het einde toe zal er oorlog zijn, en vast besloten verwoestingen.", "Ps 89:33": "dan zal Ik hun overtreding met de roede bezoeken, en hun ongerechtigheid met plagen.", "Jona 3:10": "En God zag hun werken, dat zij zich bekeerden van hun boze weg; en het berouwde God over het kwaad, dat Hij gesproken had hun te zullen doen, en Hij deed het niet.", "Mark 14:9": "Voorwaar, Ik zeg u: Waar dit Evangelie ook gepredikt zal worden in de hele wereld, daar zal ook gesproken worden over wat zij gedaan heeft, tot haar gedachtenis.", "Luk 4:28": "En zij werden allen in de synagoge met toorn vervuld, toen zij dit hoorden.", "Ps 68:22": "Zeker zal God de kop van Zijn vijanden verslaan, de harige schedel van hem die in zijn schulden wandelt.", "Ps 119:21": "U scheldt de vervloekte hoogmoedigen, die van Uw geboden afdwalen.", "Num 15:31": "Want zij heeft het woord van de HEERE veracht en Zijn gebod vernietigd; die ziel zal helemaal uitgeroeid worden; haar ongerechtigheid is op haar.", "1 Sam 15:24": "Toen zei Saul tegen Samuël: Ik heb gezondigd, omdat ik het bevel van de HEERE en uw woorden overtreden heb; want ik heb het volk gevreesd en naar hun stem geluisterd.", "Joh 16:7": "Doch Ik zeg u de waarheid: het is nuttig voor u dat Ik wegga; want als Ik niet wegga, zal de Trooster niet tot u komen; maar als Ik heenga, zal Ik Hem tot u zenden.", "Ps 1:1": "Gelukkig is de man die niet wandelt in de raad van de goddelozen, noch staat op de weg van de zondaars, noch zit op de zetel van de spotters;", "Hebr 9:12-17": "ook niet door het bloed van bokken en kalveren, maar door Zijn eigen bloed, eenmaal ingegaan in het heiligdom, en heeft een eeuwige verlossing verworven. Want als het bloed van stieren en bokken, en de as van de jonge koe, besprenkeld over de onreinen, hen heiligt tot de reinheid van het vlees, hoeveel te meer zal het bloed van Christus, Die door de eeuwige Geest Zichzelf onberispelijk aan God geofferd heeft, uw geweten reinigen van dode werken, om de levende God te dienen?", "Mark 16:18": "slangen zullen zij oppakken; en al is het dat zij iets dodelijks zullen drinken, het zal hun niet schaden; op zieken zullen zij de handen leggen, en zij zullen gezond worden.", "1 Tim 5:15": "Want sommigen hebben zich al afgewend, achter de satan aan.", "Pred 1:2": "Vluchtigheid der vluchtigheden, zegt de prediker; vluchtigheid der vluchtigheden, het is al vluchtig.", "Jer 14:13": "Toen zei ik: Ach, Heere HEERE! Zie, die profeten zeggen hun: U zult geen zwaard zien, en u zult geen honger hebben; maar Ik zal u een zekere vrede geven op deze plaats.", "Jes 19:12": "Waar zijn nu uw wijzen? Laat zij u nu te kennen geven of vernemen, wat de HEERE van de heerscharen beraadslaagd heeft tegen Egypte.", "Joh 5:29": "en zij zullen uitgaan, zij die het goede gedaan hebben tot de opstanding van het leven, en zij die het kwade gedaan hebben tot de opstanding van het oordeel.", "Lev 19:18": "U zult niet wreken, noch toorn koesteren tegen de kinderen van uw volk; maar u zult uw naaste liefhebben als uzelf; Ik ben de HEERE!", "2 Kor 5:15": "Omdat wij dit oordelen: dat als Eén voor allen gestorven is, zij dan allen gestorven zijn. En Hij is voor allen gestorven, opdat zij die leven niet meer voor zichzelf zouden leven, maar voor Hem Die voor hen gestorven en opgewekt is.", "1 Joh 4:20": "Als iemand zegt: Ik heb God lief, en haat zijn broeder, die is een leugenaar; want die zijn broeder niet liefheeft, die hij gezien heeft, hoe kan hij God liefhebben, Die hij niet gezien heeft?", "Openb 3:18": "Ik raad u aan dat u van Mij goud koopt, gelouterd door het vuur, opdat u rijk mag worden; en witte kleren, opdat u bekleed mag worden, en de schande van uw naaktheid niet openbaar wordt; en zalf uw ogen met ogenzalf, opdat u zien kunt.", "Ps 39:5": "HEERE, maak mij mijn einde bekend, en welke de mate van mijn dagen is; dat ik weet, hoe vergankelijk ik ben.", "Matt 26:3": "Toen kwamen de overpriesters en de Schriftgeleerden en de oudsten van het volk samen in de zaal van de hogepriester, die Kajafas genoemd werd;", "Jer 7:10": "en dan komen en staan voor Mijn aangezicht in dit huis, dat naar Mijn Naam genoemd is, en zeggen: Wij zijn verlost, om al deze gruwelen te doen?", "Gal 5:19-21": "De werken van het vlees nu zijn openbaar; dat zijn: overspel, hoererij, onreinheid, losbandigheid, Afgoderij, toverij, vijandschappen, ruzies, jaloersheden, toorn, twisten, verdeeldheid, afwijkingen in de leer, Afgunst, moord, dronkenschappen, uitspattingen, en dergelijke; waarvan ik u van tevoren zeg, zoals ik ook eerder gezegd heb, dat wie zulke dingen doen, het Koninkrijk van God niet zullen beërven.", "Matt 21:19": "En Hij zag een vijgenboom aan de weg, ging ernaartoe, en vond er niets aan dan alleen bladeren; en Hij zei tegen hem: Laat er in eeuwigheid geen vrucht meer aan u komen! En de vijgenboom verdorde meteen.", "Luk 1:38-56": "En Maria zei: Zie, de dienstmaagd van de Heere; mij gebeure naar uw woord. En de engel ging van haar weg. En Maria stond in diezelfde dagen op en reisde met haast naar het gebergte, naar een stad van Juda; en kwam in het huis van Zacharias, en groette Elizabet.", "2 Tim 2:12": "als wij volharden, zullen wij ook met Hem heersen; als wij Hem verloochenen, zal Hij ons ook verloochenen;", "Matt 16:26": "Want wat baat het een mens, als hij de hele wereld wint, en schade lijdt aan zijn ziel? Of wat zal een mens geven, als losprijs voor zijn ziel?", "Rom 1:29-32": "vervuld met alle ongerechtigheid, hoererij, boosheid, hebzucht, kwaadaardigheid; vol afgunst, moord, twist, bedrog, kwaadwilligheid; kwaadsprekers, lasteraars, haters van God, smaders, hoogmoedigen, laatdunkende, vinders van kwade dingen, ongehoorzaam aan hun ouders; onverstandigen, verbondbrekers, zonder natuurlijke liefde, onverzoenlijken, onbarmhartigen;", "Matt 12:28": "Maar als Ik door de Geest van God de duivels uitwerp, dan is het Koninkrijk van God tot u gekomen.", "Gal 5:19": "De werken van het vlees nu zijn openbaar; dat zijn: overspel, hoererij, onreinheid, losbandigheid,", "1 Sam 2:6": "De HEERE doodt en maakt levend; Hij doet naar het graf neerdalen, en Hij doet weer opkomen.", "Ezech 33:7-20": "U dan, o mensenkind! Ik heb u tot een wachter gesteld over het huis van Israël; u zult dus het woord uit Mijn mond horen, en hen namens Mij waarschuwen. Als Ik tegen de goddeloze zeg: O goddeloze, u zult zeker sterven! en u spreekt niet, om de goddeloze van zijn weg af te manen, dan zal die goddeloze in zijn ongerechtigheid sterven, maar zijn bloed zal Ik van uw hand eisen. Maar als u de goddeloze van zijn weg afmaant, dat hij zich ervan bekeert, en hij zich van zijn weg niet bekeert, dan zal hij in zijn ongerechtigheid sterven; maar u hebt uw leven bevrijd.", "Gal 3:13": "Christus heeft ons verlost van de vloek van de wet, doordat Hij voor ons een vloek geworden is; want er is geschreven: Vervloekt is ieder die aan het hout hangt.", "1 Tim 1:20": "Onder hen zijn Hymeneüs en Alexander, die ik aan de satan overgegeven heb, opdat zij zouden leren niet meer te lasteren.", "Hebr 2:3": "hoe zullen wij dan ontvluchten, als wij zo'n grote zaligheid veronachtzamen? Deze is eerst door de Heere Zelf verkondigd, en aan ons bevestigd door hen die Hem gehoord hebben;", "1 Kor 7:27-29": "Bent u aan een vrouw verbonden, zoek geen ontbinding; bent u ongebonden van een vrouw, zoek geen vrouw. Maar als u toch trouwt, zondigt u niet; en als een maagd trouwt, zondigt zij niet. Toch zullen zulke mensen verdrukking hebben in het vlees; en ik spaar u daarvoor. Maar dit zeg ik, broeders: dat de tijd voortaan kort is; opdat ook zij die vrouwen hebben, zouden zijn alsof zij ze niet hadden;", "Ps 78:1-67": "Een onderwijzing van Asaf. O mijn volk, neem mijn leer ter ore; neig uw oor tot de woorden van mijn mond. Ik zal mijn mond opendoen met spreuken; ik zal geheimen overvloedig uitstorten, van oude tijden af. Die wij gehoord hebben en weten, en onze vaders ons verteld hebben.", "Spr 11:16": "Een aangename vrouw houdt de eer vast, zoals sterke mannen de rijkdom vasthouden.", "Matt 20:17-19": "En Jezus, op weg naar Jeruzalem, nam de twaalf discipelen apart onderweg, en zei tegen hen: Zie, wij gaan naar Jeruzalem, en de Zoon des mensen zal aan de overpriesters en Schriftgeleerden overgeleverd worden, en zij zullen Hem ter dood veroordelen; en zij zullen Hem aan de heidenen overleveren, om Hem te bespotten en te geselen en te kruisigen; en op de derde dag zal Hij weer opstaan.", "Matt 22:45": "Als David Hem dan zijn Heere noemt, hoe is Hij dan zijn Zoon?", "Jes 48:22": "Maar de goddelozen hebben geen vrede, zegt de HEERE.", "Jes 57:11": "Maar voor wie bent u bang geweest of hebt u gevreesd? Want u hebt gelogen, en aan Mij hebt u niet gedacht, u hebt Mij niet op uw hart gelegd; is het niet omdat Ik zwijg, en dat al lang, dat u Mij niet vreest?", "Hos 7:5": "Het is de dag van onze koning; de vorsten maken hem ziek door verhitting van de wijn; hij strekt zijn hand uit met de spotters.", "Ps 80:7": "U hebt ons onze buren tot een twist gesteld, en onze vijanden spotten onder elkaar.", "Pred 7:26-28": "En ik vond iets bitterders dan de dood: een vrouw, wier hart netten en garen, en haar handen boeien zijn; wie goed is voor Gods aangezicht, zal aan haar ontkomen; daarentegen zal de zondaar door haar gevangen worden. Zie, dit heb ik gevonden, zegt de prediker, het ene bij het andere, om de verklaring te vinden; Waar mijn ziel nog naar zoekt, maar ik heb haar niet gevonden: één man uit duizend heb ik gevonden; maar een vrouw onder die allen heb ik niet gevonden.", "Joh 1:29": "De volgende dag zag Johannes Jezus naar zich toe komen, en zei: Zie het Lam van God, Dat de zonde van de wereld wegneemt!", "Spr 12:26": "De rechtvaardige is voortreffelijker dan zijn naaste; maar de weg van de goddelozen doet hen dwalen.", "Spr 24:17": "Verblijd u niet, als uw vijand valt; en als hij neerstruikelt, laat uw hart zich niet verheugen;", "1 Kor 1:23": "Maar wij prediken Christus, de Gekruisigde, voor de Joden wel een ergernis, en voor de Grieken een dwaasheid;", "2 Tess 3:7-13": "Want u zelf weet hoe men ons behoort na te volgen; want wij hebben ons niet ongeregeld gedragen onder u; En wij hebben geen brood bij iemand gegeten voor niets, maar in arbeid en moeite, nacht en dag werkend, opdat wij niemand van u lastig zouden zijn; Niet dat wij de macht niet hebben, maar opdat wij onszelf u zouden geven tot een voorbeeld, om ons na te volgen.", "Matt 3:7": "Toen hij dan velen van de Farizeeën en Sadduceeën naar zijn doop zag komen, zei hij tegen hen: Adderengebroed! Wie heeft u laten weten dat u moet vluchten voor de komende toorn?", "Luk 13:5-7": "Ik zeg u: Nee; maar als u zich niet bekeert, zult u allen net zo omkomen. En Hij vertelde deze gelijkenis: Iemand had een vijgenboom, geplant in zijn wijngaard; en hij kwam en zocht daarop vrucht, en vond ze niet. En hij zei tegen de wijngaardenier: Zie, ik kom nu al drie jaar vrucht zoeken op deze vijgenboom en vind ze niet; hak hem om; waarom put hij ook nog de grond onnodig uit?", "Jak 4:1-3": "Waar komen strijd en ruzies onder u vandaan? Komen ze niet hieruit voort, namelijk uit uw lusten, die in uw leden strijd voeren? U begeert, en hebt niet; u benijdt en jaagt naar dingen, en kunt ze niet krijgen; u vecht en voert strijd, maar u hebt niet, omdat u niet bidt. U bidt, en u ontvangt niet, omdat u verkeerd bidt, met de bedoeling het in uw lusten door te brengen.", "Jes 29:14-16": "daarom, zie, Ik zal verder wonderlijk handelen met dit volk, wonderlijk en wonderbaarlijk; want de wijsheid van zijn wijzen zal vergaan, en het verstand van zijn verstandigen zal zich verbergen. Wee hun die zich diep willen verbergen voor de HEERE, hun raad verbergend; en wier werken in duisternis gebeuren, en zij zeggen: Wie ziet ons, en wie kent ons? Uw omkeren van de dingen is, alsof de pottenbakker geacht werd als leem, dat het maaksel zei van zijn maker: Hij heeft mij niet gemaakt; en het gevormde vat zei van zijn pottenbakker: Hij begrijpt het niet.", "Matt 27:34": "gaven zij Hem azijn te drinken, gemengd met gal; en toen Hij dat geproefd had, wilde Hij niet drinken.", "Gen 4:25": "En Adam had opnieuw gemeenschap met zijn vrouw, en zij baarde een zoon, en zij noemde zijn naam Seth; want God heeft mij, zei zij, een ander nageslacht gegeven in de plaats van Abel; want Kaïn heeft hem doodgeslagen.", "Ex 19:5": "Nu dan, als u nauwgezet Mijn stem gehoorzaamt en Mijn verbond houdt, zult u Mijn eigendom zijn uit alle volken, want de hele aarde is Mijn;", "Joh 1:33": "En ik kende Hem niet; maar Die mij gezonden heeft om te dopen met water, Die had mij gezegd: Op Wie u de Geest zult zien neerdalen en op Hem blijven, Deze is het, Die met de Heilige Geest doopt.", "1 Petr 3:1-6": "Evenzo, u vrouwen, wees uw eigen mannen onderdanig; opdat ook, als er sommigen zijn die het Woord ongehoorzaam zijn, zij door de wandel van de vrouwen zonder Woord gewonnen mogen worden; Als zij uw kuise wandel in vreze zullen hebben gezien. Laat uw versiering niet zijn de uiterlijke, bestaande in het vlechten van het haar, en het omhangen van goud, of het aantrekken van klederen;", "Ps 22:7-9": "Maar ik ben een worm en geen man, een smaad van mensen, en veracht van het volk. Allen die mij zien, bespotten mij; zij steken de lip uit, zij schudden het hoofd en zeggen: Hij heeft het op de HEERE gewenteld, dat Hij hem nu uithelpt, dat Hij hem redt, omdat Hij lust aan hem heeft!", "Pred 8:16": "Toen ik mijn hart erop richtte om wijsheid te kennen, en om de bezigheid te zien die op de aarde gebeurt, dat men zelfs overdag of 's nachts geen slaap ziet met zijn ogen;", "Jes 65:12-14": "Ik zal u ook tellen voor het zwaard, zodat u zich allen ter slachting zult buigen, omdat Ik geroepen heb, maar u hebt niet geantwoord; Ik gesproken heb, maar u hebt niet gehoord; maar hebt gedaan wat kwaad was in Mijn ogen, en hebt gekozen waaraan Ik geen lust heb. Daarom zegt de Heere HEERE zo: Zie, Mijn knechten zullen eten, maar u zult hongeren; zie, Mijn knechten zullen drinken, maar u zult dorsten; zie, Mijn knechten zullen blij zijn, maar u zult beschaamd zijn. Zie, Mijn knechten zullen juichen van een goed hart, maar u zult schreeuwen van harteleed, en van verbreking van de geest zult u huilen.", "Ps 139:19": "O God! Dat U de goddeloze zou ombrengen! En u, mannen van het bloed, wijkt van mij!", "Num 14:27-34": "Hoelang zal Ik het bij deze slechte vergadering uithouden, die tegen Mij morren? Ik heb het gemor van de kinderen van Israël gehoord, waarmee zij tegen Mij morren. Zeg tegen hen: Zo waarachtig als Ik leef, spreekt de HEERE, zoals u in Mijn oren gesproken hebt, zo zal Ik u doen! Uw dode lichamen zullen in deze woestijn vallen; en al uw getelden, naar uw hele aantal, van twintig jaar oud en daarboven, u die tegen Mij gemord hebt.", "2 Kon 2:24": "En hij keerde zich achterom, en hij zag hen, en vervloekte hen, in de Naam van de HEERE. Toen kwamen er twee berinnen uit het woud, en verscheurden van hen tweeënveertig kinderen.", "Jer 25:31": "Het geschal zal komen tot aan het einde van de aarde; want de HEERE heeft een geschil met de volken, Hij zal gericht houden met alle vlees; de goddelozen heeft Hij aan het zwaard overgegeven, spreekt de HEERE.", "Gen 3:1-5": "De slang was listiger dan al het gedierte van het veld, dat de HEERE God gemaakt had; en zij zei tegen de vrouw: Is het echt zo dat God gezegd heeft: U zult niet eten van alle bomen in de hof? En de vrouw zei tegen de slang: Van de vrucht van de bomen in de hof mogen wij eten; Maar van de vrucht van de boom die in het midden van de hof staat, heeft God gezegd: U zult daarvan niet eten, en u zult die ook niet aanraken, anders sterft u.", "Deut 8:5": "Erken dan in uw hart, dat de HEERE, uw God, u opvoedt, zoals een man zijn zoon opvoedt.", "Ezech 22:20": "Zoals zilver, of koper, of ijzer, of lood, of tin in het midden van een oven verzameld wordt, om het vuur daarover op te blazen, zodat men het smelt, zo zal Ik u verzamelen in Mijn toorn, en in Mijn grimmigheid daar laten liggen en smelten.", "Hebr 7:27": "Hij heeft het niet elke dag nodig, zoals de hogepriesters, om eerst voor zijn eigen zonden slachtoffers te offeren, en daarna voor de zonden van het volk; want dat heeft Hij eenmaal gedaan, toen Hij Zichzelf opgeofferd heeft.", "Job 22:13": "Daarom zegt u: Wat weet God ervan? Zal Hij door de donkere wolk oordelen?", "Matt 26:36-45": "Toen ging Jezus met hen naar een plaats genaamd Gethsémané, en zei tegen de discipelen: Blijft hier zitten, totdat Ik weggegaan ben en daar gebeden heb. En Hij nam Petrus en de twee zonen van Zebedeüs met Zich mee, en begon droevig en zeer beangst te worden. Toen zei Hij tegen hen: Mijn ziel is zeer bedroefd, tot de dood toe; blijft hier en waakt met Mij.", "Jes 63:9": "In al hun benauwdheid was Hij benauwd, en de Engel van Zijn aangezicht heeft hen behouden; door Zijn liefde en door Zijn genade heeft Hij hen verlost; en Hij nam hen op, en Hij droeg hen al de dagen van ouds.", "Ps 10:14": "U ziet het zeker; want U aanschouwt de moeite en het verdriet, opdat men het in Uw hand geeft; op U verlaat de arme zich, U bent geweest een Helper van de wees.", "Jak 4:7": "Onderwerp u dan aan God; weerstaat de duivel, en hij zal van u wegvluchten.", "Ps 104:14": "Hij doet het gras uitspruiten voor de dieren, en het gewas tot dienst van de mens, zodat brood uit de aarde voortkomt.", "Ezech 3:18-20": "Als Ik tot de goddeloze zeg: U zult zeker sterven, en u waarschuwt hem niet, en spreekt niet, om de goddeloze van zijn goddeloze weg te waarschuwen, opdat u hem in het leven behoudt; die goddeloze zal in zijn ongerechtigheid sterven, maar zijn bloed zal Ik van uw hand eisen. Doch als u de goddeloze waarschuwt, en hij zich van zijn goddeloosheid en van zijn goddeloze weg niet bekeert, zal hij in zijn ongerechtigheid sterven; maar u hebt uw ziel bevrijd. Als ook een rechtvaardige zich van zijn gerechtigheid afkeert, en onrecht doet, en Ik een aanstoot voor zijn gezicht leg, zal hij sterven; omdat u hem niet gewaarschuwd hebt, zal hij in zijn zonde sterven, en zijn gerechtigheden, die hij gedaan heeft, zullen niet gedacht worden; maar zijn bloed zal Ik van uw hand eisen.", "Hand 1:2": "tot op de dag waarop Hij opgenomen is, nadat Hij door de Heilige Geest de apostelen die Hij uitverkoren had, bevelen had gegeven.", "Spr 18:3": "Als de goddeloze komt, komt ook de verachting, en met schande smaad.", "Ex 20:9-11": "Zes dagen zult u arbeiden en al uw werk doen; maar de zevende dag is de sabbat van de HEERE, uw God; dan zult u geen werk doen, u, noch uw zoon, noch uw dochter, noch uw dienstknecht, noch uw dienstmaagd, noch uw vee, noch uw vreemdeling die in uw poorten is; want in zes dagen heeft de HEERE de hemel en de aarde gemaakt, de zee en alles wat daarin is, en Hij rustte op de zevende dag; daarom zegende de HEERE de sabbatdag en heiligde hem.", "Spr 14:19": "De kwaden buigen neer voor de goeden, en de goddelozen voor de poorten van de rechtvaardige.", "Gen 4:12": "Als u de aardbodem bewerkt, zal hij u zijn opbrengst niet meer geven; u zult zwervend en dolend zijn op de aarde.", "Kol 1:22": "in het lichaam van Zijn vlees, door de dood, opdat Hij u heilig en onberispelijk en onbeschuldigbaar voor Zich zou stellen;", "Matt 25:41": "Dan zal Hij ook zeggen tegen hen die aan de linkerhand zijn: Ga weg van Mij, u vervloekten, in het eeuwige vuur, dat voor de duivel en zijn engelen bereid is.", "Ps 22:9": "Hij heeft het op de HEERE gewenteld, dat Hij hem nu uithelpt, dat Hij hem redt, omdat Hij lust aan hem heeft!", "Mark 16:17": "En degenen die geloofd zullen hebben, zullen deze tekenen volgen: in Mijn Naam zullen zij duivels uitwerpen; met nieuwe tongen zullen zij spreken;", "Mark 15:10": "(Want hij wist dat de overpriesters Hem uit afgunst overgeleverd hadden.)", "Jes 19:13": "De vorsten van Zoan zijn zot geworden, de vorsten van Nof zijn bedrogen; zij hebben ook Egypte doen dwalen, tot de uiterste hoek van zijn stammen.", "Joh 3:14-17": "En zoals Mozes de slang in de woestijn verhoogd heeft, zo moet de Zoon des mensen verhoogd worden; Opdat ieder die in Hem gelooft, niet verloren gaat, maar het eeuwige leven heeft. Want zo lief heeft God de wereld gehad, dat Hij Zijn eniggeboren Zoon gegeven heeft, opdat ieder die in Hem gelooft, niet verloren gaat, maar het eeuwige leven heeft.", "1 Petr 3:1-7": "Evenzo, u vrouwen, wees uw eigen mannen onderdanig; opdat ook, als er sommigen zijn die het Woord ongehoorzaam zijn, zij door de wandel van de vrouwen zonder Woord gewonnen mogen worden; Als zij uw kuise wandel in vreze zullen hebben gezien. Laat uw versiering niet zijn de uiterlijke, bestaande in het vlechten van het haar, en het omhangen van goud, of het aantrekken van klederen;", "Luk 10:21": "Op dat moment verheugde Jezus Zich in de geest, en zei: Ik dank U, Vader, Heere van hemel en aarde, dat U deze dingen voor de wijzen en verstandigen verborgen hebt, en ze aan de kinderen geopenbaard hebt; ja, Vader, want zo was het welbehagen voor U.", "Gen 3:16-19": "Tegen de vrouw zei Hij: Ik zal uw smart zeer vermeerderen, namelijk de smart van uw zwangerschap; met smart zult u kinderen baren; en naar uw man zal uw begeerte uitgaan, en hij zal over u heersen. En tegen Adam zei Hij: Omdat u geluisterd hebt naar de stem van uw vrouw, en van die boom hebt gegeten waarvan Ik u geboden had: Daarvan zult u niet eten; is het aardrijk vervloekt om u; en met smart zult u daarvan eten, alle dagen van uw leven. Ook zal het u doornen en distels laten opgroeien, en u zult het gewas van het veld eten.", "Mark 14:34": "en Hij zei tegen hen: Mijn ziel is zeer bedroefd, tot de dood toe; blijf hier, en waak.", "Matt 5:28": "Maar Ik zeg u, dat ieder die naar een vrouw kijkt om haar te begeren, al overspel met haar gepleegd heeft in zijn hart.", "Gen 6:3": "Toen zei de HEERE: Mijn Geest zal niet in eeuwigheid twisten met de mens, omdat hij ook vlees is; doch zijn dagen zullen honderdtwintig jaren zijn.", "Kol 3:18": "Vrouwen, wees uw eigen mannen onderdanig, zoals het betaamt in de Heere.", "Job 31:9-12": "Als mijn hart verlokt is geweest tot een vrouw, of ik aan mijn naasten deur geloerd heb; Zo moet mijn huisvrouw met een ander malen, en anderen zich over haar krommen! Want dat is een schandelijke daad, en het is een misdaad bij de rechters.", "2 Tim 1:10": "Doch nu geopenbaard is door de verschijning van onze Zaligmaker Jezus Christus, Die de dood tenietgedaan heeft, en het leven en de onvergankelijkheid aan het licht gebracht heeft door het Evangelie;", "Spr 21:20": "In de woning van de wijze is een gewenste schat, en olie; maar een dwaas mens verslindt dat.", "Kol 1:14": "in Wie wij de verlossing hebben door Zijn bloed, namelijk de vergeving van de zonden;", "Jes 33:11": "U gaat met stro zwanger, u zult stoppels baren; uw geest zal u als vuur verslinden.", "Ps 89:36": "Ik heb eens gezworen bij Mijn heiligheid: Zeker zal Ik aan David niet liegen!", "Ps 107:4": "Die in de woestijn dwaalden, op een weg door de wildernis, die geen stad vonden om in te wonen;", "Zach 9:9": "Verheug u zeer, dochter van Sion! Juich, dochter van Jeruzalem! Zie, uw Koning zal tot u komen, rechtvaardig, en Hij is een Heiland; arm, en rijdend op een ezel, en op een veulen, het jong van de ezelinnen.", "Luk 4:29": "En zij stonden op en wierpen Hem de stad uit, en leidden Hem naar de top van de berg waarop hun stad gebouwd was, om Hem van de steilte af te werpen;", "Rom 14:9": "Want daarvoor is Christus ook gestorven, en opgestaan, en weer levend geworden, opdat Hij zou heersen over zowel doden als levenden.", "Ps 118:26": "Gezegend is hij die daar komt in de Naam van de HEERE! Wij zegenen u uit het huis van de HEERE.", "Mark 4:25": "Want wie heeft, aan hem zal gegeven worden; en wie niet heeft, van hem zal ook afgenomen worden wat hij heeft.", "Matt 28:19": "Ga dan heen, onderwijs alle volken, en doop hen in de Naam van de Vader, en van de Zoon, en van de Heilige Geest;", "Jes 59:6": "Hun webben deugen niet tot kleding, en zij zullen zichzelf niet kunnen bedekken met hun werken; hun werken zijn werken van ongerechtigheid, en een daad van geweld is in hun handen.", "Luk 22:31": "En de Heere zei: Simon, Simon, zie, de satan heeft u dringend willen ziften als de tarwe;", "Ps 68:7": "Een God, Die de eenzamen zet in een gezin, uitleidt wie in boeien gevangen zitten; maar de afvalligen wonen in het dorre land.", "Hebr 10:9": "zei Hij toen: Zie, Ik kom om Uw wil te doen, o God! Hij neemt het eerste weg, om het tweede te laten gelden.", "Jona 2:6": "Ik was neergedaald tot de bodem van de bergen; de grendels van de aarde waren voor eeuwig om mij heen; maar U hebt mijn leven uit het verderf opgevoerd, o HEERE, mijn God!", "Ps 2:5": "Dan zal Hij tot hen spreken in Zijn toorn, en in Zijn grimmigheid zal Hij hen verschrikken.", "Openb 2:13": "Ik weet uw werken, en waar u woont; namelijk daar waar de troon van de satan is, en u houdt Mijn Naam vast, en hebt Mijn geloof niet verloochend, ook in die dagen waarin Antipas, Mijn getrouwe getuige, gedood is bij u, daar waar de satan woont.", "2 Kor 1:12": "Want onze roem is dit: de getuigenis van ons geweten, dat wij in eenvoud en oprechtheid van God, niet in vleselijke wijsheid, maar in de genade van God, in de wereld verkeerd hebben, en allermeest bij u.", "Luk 12:47": "En die dienstknecht die de wil van zijn heer geweten heeft, en zich niet klaargemaakt heeft, en ook niet naar zijn wil gehandeld heeft, die zal met veel slagen geslagen worden.", "Jes 8:18": "Zie, ik en de kinderen die de HEERE mij gegeven heeft, zijn tot tekenen en tot wonderen in Israël, van de HEERE van de heerscharen, Die op de berg Sion woont.", "Job 8:22": "Wie u haten, zullen met schaamte bekleed worden; en de tent van de goddelozen zal er niet meer zijn.", "Mal 3:14": "U zegt: Het is tevergeefs God te dienen; want wat nut heeft het, dat wij Zijn wacht in acht nemen, en dat wij in het zwart gaan, voor het aangezicht van de HEERE van de heerscharen?", "1 Kor 3:17": "Als iemand de tempel van God schendt, die zal God schenden; want de tempel van God is heilig, en dat bent u.", "Ezech 18:1-32": "Verder kwam het woord van de HEERE tot mij en Hij zei: Wat is er met u, dat u dit spreekwoord gebruikt over het land Israël, en zegt: De vaders hebben onrijpe druiven gegeten, en de tanden van de kinderen zijn stomp geworden? Zo waarachtig als Ik leef, spreekt de Heere HEERE, u zult geen aanleiding meer hebben om dit spreekwoord in Israël te gebruiken!", "Mark 3:22-26": "En de Schriftgeleerden die van Jeruzalem gekomen waren, zeiden: Hij heeft Beëlzebul, en door de leider van de duivels drijft Hij de duivels uit. En Hij riep hen tot Zich, en zei tegen hen in gelijkenissen: Hoe kan de satan de satan uitdrijven? En als een koninkrijk tegen zichzelf verdeeld is, kan dat koninkrijk niet standhouden.", "Pred 2:17": "Daarom haatte ik dit leven, want dit werk dat onder de zon gebeurt, leek mij slecht; want het is allemaal ijdelheid en kwelling van de geest.", "Spr 14:13": "Het hart zal ook bij het lachen verdriet hebben; en het einde van die blijdschap is droefheid.", "Gen 4:5": "maar Kaïn en zijn offer zag Hij niet met welgevallen aan. Toen ontstak Kaïn zeer, en zijn gezicht betrok.", "Matt 13:55": "Is Dit niet de zoon van de timmerman? Heet Zijn moeder niet Maria, en Zijn broers Jakobus en Joses, en Simon en Judas?", "Ps 119:150": "Die kwade praktijken najagen, genaken mij, zij wijken ver van Uw wet.", "Deut 31:29": "Want ik weet dat u na mijn dood zeker helemaal zult verdorven raken, en afwijken van de weg die ik u geboden heb; dan zal dit kwaad u in de laatste dagen overkomen, wanneer u zult hebben gedaan wat kwaad is in de ogen van de HEERE, om Hem door het werk van uw handen tot toorn te verwekken.", "Ef 5:5": "Want dit weet u, dat geen hoereerder, of onreine, of hebzuchtige, die een afgodendienaar is, erfenis heeft in het Koninkrijk van Christus en van God.", "Rom 14:2": "De één gelooft dat men alles mag eten, maar hij die zwak is, eet groenten.", "Ex 14:11": "En zij zeiden tegen Mozes: Had u ons daarom, omdat er in Egypte helemaal geen graven waren, weggehaald, opdat wij in deze woestijn zouden sterven? Waarom heeft u ons dit aangedaan, dat u ons uit Egypte hebt weggevoerd?", "Ps 59:9": "Maar U, HEERE, zult hen belachen; U zult alle heidenen bespotten.", "Ps 49:10": "dat hij ook voortaan voor altijd zou leven, en de vergankelijkheid niet zien.", "1 Petr 2:1": "Leg dan alle kwaadheid af, en alle bedrog, en huichelarij, en afgunst, en alle kwaadsprekerij;", "Openb 12:9": "En de grote draak is neergeworpen, namelijk de oude slang, die genoemd wordt duivel en satan, die de hele wereld verleidt; hij is, zeg ik, neergeworpen op de aarde; en zijn engelen zijn met hem neergeworpen.", "Pred 3:20": "Zij gaan allen naar één plaats; zij zijn allen uit het stof, en zij keren allen terug tot het stof.", "Jes 11:1": "Want er zal een Rijsje voortkomen uit de afgehouwen tronk van Isaï, en een Scheut uit zijn wortels zal vrucht voortbrengen.", "1 Petr 2:24": "Die Zelf onze zonden in Zijn lichaam gedragen heeft op het hout; opdat wij, voor de zonden afgestorven, voor de gerechtigheid zouden leven; door Wiens striemen u genezen bent.", "2 Kon 1:4": "Daarom nu zegt de HEERE zo: U zult niet afkomen van dat bed waarop u geklommen bent, maar u zult zeker sterven. En Elia ging weg.", "Job 4:18-21": "Zie, op Zijn knechten zou Hij niet vertrouwen; ook Zijn engelen heeft Hij van dwaasheid beschuldigd. Hoeveel te meer dan hen die in lemen huizen wonen, waarvan de grondslag in het stof is? Zij worden verbrijzeld voor de mot. Van de morgen tot de avond worden zij vermorzeld; zonder dat men er acht op slaat, vergaan zij voor eeuwig.", "Luk 4:14": "En Jezus keerde terug, door de kracht van de Geest, naar Galilea; en het gerucht over Hem verspreidde zich door het hele omliggende land.", "Openb 9:4-6": "En hun werd gezegd, dat zij het gras van de aarde niet zouden beschadigen, ook geen groente, ook geen boom, dan de mensen alleen, die het zegel van God niet aan hun voorhoofden hebben. En hun werd macht gegeven, niet dat zij hen zouden doden, maar dat zij door hen gepijnigd zouden worden vijf maanden; en hun pijniging was als de pijniging van een schorpioen, wanneer hij een mens gestoken heeft. En in die dagen zullen de mensen de dood zoeken, en zullen die niet vinden; en zij zullen ernaar verlangen te sterven, en de dood zal van hen wegvluchten.", "Deut 7:12-26": "Dan zal het gebeuren, omdat u deze rechten zult horen, en houden, en die doen, dat de HEERE, uw God, voor u het verbond en de goedertierenheid zal houden, die Hij uw vaderen gezworen heeft; en Hij zal u liefhebben, en zal u zegenen, en u meer maken; en Hij zal de vrucht van uw buik zegenen, en de vrucht van uw land, uw koren, en uw most, en uw olie, de nakomelingen van uw koeien, en de kudden van uw kleinvee, in het land dat Hij uw vaderen gezworen heeft aan u te geven. Gezegend zult u zijn boven alle volken; er zal onder u geen man of vrouw onvruchtbaar zijn, ook niet onder uw beesten;", "Rom 4:25": "Die overgeleverd is om onze zonden, en opgewekt om onze rechtvaardigmaking.", "Mark 12:1-9": "En Hij begon door gelijkenissen tegen hen te spreken: Een man plantte een wijngaard, en zette er een omheining omheen, en groef een wijnpersbak, en bouwde een toren, en verhuurde hem aan de wijnbouwers, en reisde naar het buitenland. En toen het de tijd was, stuurde hij een dienaar naar de wijnbouwers, opdat hij van de wijnbouwers iets van de vrucht van de wijngaard zou ontvangen. Maar zij grepen hem, en sloegen hem, en stuurden hem met lege handen weg.", "1 Petr 3:12": "Want de ogen van de Heere zijn over de rechtvaardigen, en Zijn oren gericht op hun gebed; maar het aangezicht van de Heere is tegen hen die kwaad doen.", "Spr 19:14": "Huis en bezit zijn een erfdeel van de vaderen; maar een verstandige vrouw is van de HEERE.", "Joh 16:13-15": "Maar wanneer Hij zal gekomen zijn, namelijk de Geest van de waarheid, zal Hij u in alle waarheid leiden; want Hij zal niet uit Zichzelf spreken, maar wat Hij zal gehoord hebben, zal Hij spreken, en de toekomende dingen zal Hij u verkondigen. Hij zal Mij verheerlijken; want Hij zal het uit het Mijne nemen, en het u verkondigen. Alles wat de Vader heeft, is van Mij; daarom heb Ik gezegd dat Hij het uit het Mijne zal nemen, en het u zal verkondigen.", "Ps 32:3": "Toen ik zweeg, verouderden mijn beenderen, in mijn brullen de hele dag.", "Mark 8:36": "Want wat zou het de mens baten als hij de hele wereld zou winnen, en schade zou lijden aan zijn ziel?", "Ps 72:9": "De inwoners van dorre plaatsen zullen voor zijn aangezicht knielen, en zijn vijanden zullen het stof lekken.", "Klaagl 4:22": "Thau. Uw ongerechtigheid heeft een einde, o dochter van Sion! Hij zal u niet meer gevangen laten wegvoeren; maar uw ongerechtigheid, o dochter van Edom! zal Hij bezoeken; Hij zal uw zonden aan het licht brengen.", "Rom 1:4": "Die met kracht bewezen is de Zoon van God te zijn, naar de Geest van de heiligmaking, uit de opstanding van de doden), namelijk Jezus Christus, onze Heere:", "Openb 13:14": "En het verleidt hen die op de aarde wonen, door de tekenen die hem gegeven zijn te doen in de tegenwoordigheid van het beest; en het zegt tegen hen die op de aarde wonen dat zij een beeld moeten maken voor het beest dat de wond van het zwaard had, en weer levend werd.", "Rom 8:35-39": "Wie zal ons scheiden van de liefde van Christus? Verdrukking, of benauwdheid, of vervolging, of honger, of naaktheid, of gevaar, of het zwaard? (Zoals geschreven is: Want om Uwentwil worden wij de hele dag gedood; wij worden gerekend als schapen die geslacht worden.) Maar in dit alles zijn wij meer dan overwinnaars, door Hem Die ons heeft liefgehad.", "Ex 4:10-14": "Toen zei Mozes tegen de HEERE: Och Heere! ik ben geen man die goed kan spreken, niet van gisteren, niet van eergisteren, en ook niet van toen af, toen U tot Uw knecht gesproken hebt; want ik ben zwaar van mond, en zwaar van tong. En de HEERE zei tegen hem: Wie heeft de mens de mond gemaakt, of wie maakt de stomme, of dove, of ziende, of blinde? Ben Ik het niet, de HEERE? En nu ga heen, en Ik zal met uw mond zijn, en zal u leren, wat u spreken zult.", "Jes 9:5": "Want een Kind is ons geboren, een Zoon is ons gegeven, en de heerschappij is op Zijn schouder; en men noemt Zijn naam Wonderlijk, Raad, Sterke God, Vader van de eeuwigheid, Vredevorst;", "Amos 9:1-5": "Ik zag de Heere staan op het altaar, en Hij zei: Sla die knop, zodat de posten beven, en kloof ze allen in het hoofd; en Ik zal hun achterste met het zwaard doden; wie van hen probeert te vluchten, zal niet ontkomen, en wie van hen probeert te ontkomen, zal niet gered worden. Al groeven zij tot in het graf, dan zal Mijn hand ze vandaar halen, en al klommen zij in de hemel, dan zal Ik ze vandaar doen neerdalen. En al verstopten zij zich op de top van de Karmel, dan zal Ik ze opsporen en vandaar halen; en al verborgen zij zich voor Mijn ogen op de bodem van de zee, dan zal Ik vandaar de slang gebieden, die zal ze bijten.", "Luk 6:49": "Maar wie het gehoord heeft en het niet gedaan heeft, is als een mens die een huis bouwde op de aarde zonder fundament; de waterstroom sloeg ertegen aan, en het viel meteen om, en de val van dat huis was groot.", "Ef 5:33": "Kortom, ieder van u afzonderlijk moet zijn eigen vrouw zo liefhebben als zichzelf; en laat de vrouw erop letten dat zij haar man vreest.", "Job 5:13": "Hij vangt de wijzen in hun arglistigheid; zodat de raad van de verdraaiden overhaast valt.", "Jes 53:7-12": "Toen die geëist werd, werd Hij verdrukt; maar Hij deed Zijn mond niet open; als een lam werd Hij ter slachting geleid, en zoals een schaap stom is voor het aangezicht van zijn scheerders, zo deed Hij Zijn mond niet open. Hij is uit de angst en uit het gericht weggenomen; en wie zal Zijn leeftijd uitspreken? Want Hij is afgesneden uit het land van de levenden; om de overtreding van Mijn volk is de plaag op Hem geweest. En men heeft Zijn graf bij de goddelozen gesteld, en Hij is bij de rijke in Zijn dood geweest, omdat Hij geen onrecht gedaan heeft, en er geen bedrog in Zijn mond geweest is.", "1 Joh 2:16": "Want al wat in de wereld is, namelijk de begeerte van het vlees, en de begeerte van de ogen, en de hoogmoed van het leven, is niet uit de Vader, maar is uit de wereld.", "Ex 5:2": "Maar Farao zei: Wie is de HEERE, Wiens stem ik gehoorzamen zou, om Israël te laten trekken? Ik ken de HEERE niet, en ik zal ook Israël niet laten trekken.", "Joh 8:44": "U bent uit uw vader de duivel, en u wilt de begeerten van uw vader doen; die was een mensenmoordenaar van het begin af aan, en is niet in de waarheid blijven staan, want er is geen waarheid in hem. Wanneer hij de leugen spreekt, spreekt hij uit wat van hemzelf is; want hij is een leugenaar, en de vader daarvan.", "Ps 90:3": "U doet de mens wederkeren tot verbrijzeling, en zegt: Keer weder, mensenkinderen!", "Kol 2:15": "Hij heeft de overheden en de machten ontwapend en openlijk tentoongesteld, en door het kruis over hen getriomfeerd.", "Luk 3:17": "Zijn wan is in Zijn hand, en Hij zal Zijn dorsvloer grondig reinigen, en de tarwe zal Hij in Zijn schuur samenbrengen; maar het kaf zal Hij met onblusbaar vuur verbranden.", "Job 31:1": "Ik heb een verbond gemaakt met mijn ogen; hoe zou ik dan acht gegeven hebben op een maagd?", "Ps 109:6": "Stel een goddeloze over hem, en de satan sta aan zijn rechterhand.", "Spr 10:6-8": "Zegeningen zijn op het hoofd van de rechtvaardige; maar het geweld bedekt de mond van de goddelozen. De gedachtenis aan de rechtvaardige zal tot zegening zijn; maar de naam van de goddelozen zal wegrotten. Wie wijs van hart is, neemt de geboden aan; maar wie dwaas is van lippen, zal ten val komen.", "Pred 12:5": "Ook wanneer zij bang zullen zijn voor de hoogte, en er verschrikkingen zullen zijn op de weg, en de amandelboom zal bloeien, en de sprinkhaan zichzelf een last zal zijn, en het verlangen zal vergaan; want de mens gaat naar zijn eeuwig huis, en de rouwklagers zullen in de straat rondgaan.", "Ezech 36:35": "En zij zullen zeggen: Dit land, dat verwoest was, is geworden als een hof van Eden; en de eenzame en de verwoeste en verstoorde steden zijn versterkt en bewoond.", "Matt 25:45": "Dan zal Hij hun antwoorden: Voorwaar, Ik zeg u: Voor zoveel u dit voor één van deze minsten niet gedaan hebt, hebt u het Mij ook niet gedaan.", "Ps 37:1": "Een psalm van David. Aleph. Wind u niet op over de boosdoeners; benijd hen niet die onrecht doen.", "Matt 12:18": "Zie, Mijn Knecht, Die Ik uitgekozen heb; Mijn Beminde, in Wie Mijn ziel een welbehagen heeft; Ik zal Mijn Geest op Hem leggen, en Hij zal het oordeel aan de h
