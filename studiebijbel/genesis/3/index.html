even heeft in genade,", "Lev 26:12": "En Ik zal in uw midden wandelen, en zal u tot een God zijn, en u zult Mij tot een volk zijn.", "1 Petr 4:1": "Omdat Christus dan voor ons in het vlees geleden heeft, wapent u zich ook met dezelfde gedachte, namelijk dat wie in het vlees geleden heeft, opgehouden heeft met de zonde;", "Jes 6:8": "Daarna hoorde ik de stem van de Heere, die zei: Wie zal Ik zenden, en wie zal voor Ons heengaan? Toen zei ik: Zie, hier ben ik, zend mij heen.", "Matt 7:26": "En ieder die deze woorden van Mij hoort en ze niet doet, zal vergeleken worden met een dwaze man, die zijn huis op het zand gebouwd heeft;", "Matt 4:3": "En de verzoeker kwam naar Hem toe en zei: Als U Gods Zoon bent, zeg dan dat deze stenen broden worden.", "2 Tim 3:13": "Maar de slechte mensen en bedriegers zullen van kwaad tot erger gaan, zij verleiden en worden verleid.", "2 Tess 2:8-10": "En dan zal de onrechtvaardige geopenbaard worden, die de Heere zal doden door de Geest van Zijn mond, en teniet zal doen door de verschijning van Zijn komst; hem, zeg ik, wiens komst is naar de werking van de satan, met alle kracht en tekenen en wonderen van de leugen; en met alle verleiding van de onrechtvaardigheid in hen die verloren gaan; omdat zij de liefde voor de waarheid niet aangenomen hebben, om behouden te worden.", "Spr 13:9": "Het licht van de rechtvaardigen zal zich verblijden; maar de lamp van de goddelozen zal uitgeblust worden.", "Jer 48:26": "Maak hem dronken, omdat hij zich groot gemaakt heeft tegen de HEERE; zo zal Moab met de handen klappen in zijn uitspuwsel, en hij zelf zal ook tot bespotting zijn.", "1 Kor 6:20": "Want u bent duur gekocht: verheerlijk dan God in uw lichaam en in uw geest, die van God zijn.", "Luk 8:13": "En zij die op de rots bezaaid worden, zijn zij die, wanneer zij het gehoord hebben, het Woord met vreugde ontvangen; en dezen hebben geen wortel: zij geloven maar voor een tijd, en in de tijd van verzoeking wijken zij af.", "Gen 2:15-17": "Zo nam de HEERE God de mens, en zette hem in de hof van Eden, om die te bewerken, en die te bewaren. En de HEERE God gebood de mens en zei: Van elke boom van deze hof mag u vrijelijk eten; Maar van de boom van de kennis van goed en kwaad, daarvan mag u niet eten; want op de dag dat u daarvan eet, zult u de dood sterven.", "Micha 5:2": "Daarom zal Hij hen overgeven, tot de tijd toe dat zij, die baren zal, gebaard heeft; dan zullen de overigen van Zijn broeders zich bekeren met de kinderen van Israël.", "Spr 3:34": "Zeker, de spotters zal Hij bespotten, maar aan de zachtmoedigen zal Hij genade geven.", "Joh 16:2": "Zij zullen u uit de synagogen werpen; ja, de tijd komt dat ieder die u doodt, zal denken God een dienst te doen.", "Ezech 33:20": "Toch zegt u: De weg van de Heere is niet recht; Ik zal u richten, ieder naar zijn wegen, o huis van Israël!", "Gen 3:1-13": "De slang was listiger dan al het gedierte van het veld, dat de HEERE God gemaakt had; en zij zei tegen de vrouw: Is het echt zo dat God gezegd heeft: U zult niet eten van alle bomen in de hof? En de vrouw zei tegen de slang: Van de vrucht van de bomen in de hof mogen wij eten; Maar van de vrucht van de boom die in het midden van de hof staat, heeft God gezegd: U zult daarvan niet eten, en u zult die ook niet aanraken, anders sterft u.", "Ps 55:11": "Dag en nacht gaan zij er omheen op haar muren; en ongerechtigheid en overlast is binnen in haar.", "Joh 12:7": "Jezus dan zei: Laat haar met rust; zij heeft dit bewaard voor de dag van Mijn begrafenis.", "Ezech 20:8": "Maar zij waren opstandig tegen Mij, en wilden naar Mij niet horen; niemand wierp de verfoeisels van zijn ogen weg, en niemand verliet de drekgoden van Egypte; daarom zei Ik dat Ik Mijn grimmigheid over hen zou uitgieten, om Mijn toorn tegen hen te volbrengen midden in Egypteland.", "Ps 102:4-12": "Want mijn dagen zijn vergaan als rook, en mijn beenderen zijn uitgebrand als een haard. Mijn hart is geslagen en verdord als gras, zodat ik vergeten heb mijn brood te eten. Mijn beenderen kleven aan mijn vlees, vanwege de stem van het zuchten.", "Job 3:17-19": "Daar houden de bozen op van beroering, en daar rusten de vermoeiden van kracht; Daar zijn de gebondenen samen in rust; zij horen de stem van de drijver niet. De kleine en de grote is daar; en de knecht vrij van zijn heer.", "Ezech 28:13": "U was in Eden, de hof van God; alle kostelijke stenen waren uw bedekking: sardisstenen, topazen en diamanten, turkooizen, sardonyxstenen en jaspisstenen, saffieren, robijnen en smaragden, en goud; het werk van uw trommels en uw pijpen was bij u; op de dag dat u geschapen werd, waren zij gereed.", "Hebr 10:12": "Maar Deze, die één offer voor de zonden gebracht heeft, is voor eeuwig gaan zitten aan de rechterhand van God;", "Spr 6:24": "om u te bewaren voor de slechte vrouw, voor het gevlei van de tong van de vreemde vrouw.", "1 Tim 3:5": "(want als iemand niet weet hoe hij zijn eigen huis moet besturen, hoe zal hij dan voor de Gemeente van God zorgen?)", "2 Kon 6:22": "Doch hij zei: U zult hen niet doden; zou u ook doden wie u met uw zwaard en met uw boog gevangen had? Zet hun brood en water voor, dat zij eten en drinken, en naar hun heer trekken.", "Pred 8:17": "toen zag ik al het werk van God, dat de mens niet kan doorgronden, het werk dat onder de zon gebeurt, waarnaar een mens zoekt met inspanning, maar hij zal het niet doorgronden; ja, zelfs al zou een wijze zeggen dat hij het zou kennen, dan nog zal hij het niet kunnen doorgronden.", "Jer 13:21": "Wat zult u zeggen, wanneer Hij u bezoeking laat overkomen, terwijl u hen geleerd hebt tot vorsten, tot een hoofd over u te zijn; zullen de smarten u niet aangrijpen, als een barende vrouw?", "2 Sam 1:23": "Saul en Jonathan, die geliefd waren, en die liefelijke mensen in hun leven, zijn ook in hun dood niet gescheiden; zij waren sneller dan arenden, zij waren sterker dan leeuwen.", "1 Tim 6:10": "Want de geldzucht is een wortel van alle kwaad; sommigen hebben daarnaar verlangd en zijn van het geloof afgedwaald, en hebben zichzelf met veel smarten doorstoken.", "Spr 27:16": "Ieder die haar verbergt, zou de wind verbergen, en de olie van zijn rechterhand, die zich verraadt.", "Luk 20:34-38": "En Jezus antwoordde en zei tegen hen: De kinderen van deze wereld trouwen, en worden ten huwelijk uitgegeven; maar wie waardig geacht worden om die andere wereld te verwerven en de opstanding uit de doden, zullen niet trouwen, en ook niet ten huwelijk uitgegeven worden; want zij kunnen niet meer sterven, want zij zijn gelijk aan de engelen; en zij zijn kinderen van God, omdat zij kinderen van de opstanding zijn.", "Hand 26:18": "Om hun ogen te openen en hen te bekeren van de duisternis tot het licht, en van de macht van de satan tot God; opdat zij vergeving van de zonden ontvangen, en een erfdeel onder de geheiligden, door het geloof in Mij.", "Openb 5:9": "En zij zongen een nieuw lied: U bent waard dat boek te nemen en zijn zegels te openen; want U bent geslacht, en hebt ons voor God gekocht met Uw bloed, uit elk geslacht, en taal, en volk, en natie;", "Spr 29:16": "Als de goddelozen talrijk worden, wordt de overtreding groot; maar de rechtvaardigen zullen hun val aanschouwen.", "Rom 5:21": "Opdat, zoals de zonde geheerst heeft tot de dood, zo ook de genade zou heersen door rechtvaardigheid tot het eeuwige leven, door Jezus Christus onze Heere.", "Num 30:8": "Maar als haar man op de dag dat hij het hoorde dat verbreekt, en haar gelofte die op haar was, teniet doet, alsook de onbedachte uitspraak van haar lippen waarmee zij haar ziel verbonden heeft, dan zal de HEERE het haar vergeven.", "Ps 90:7-9": "Want wij vergaan door Uw toorn; en door Uw grimmigheid worden wij verschrikt. U stelt onze ongerechtigheden voor U, onze heimelijke zonden in het licht van uw aangezicht. Want al onze dagen gaan henen door Uw verbolgenheid; wij brengen onze jaren door als een gedachte.", "Ef 5:22-25": "Vrouwen, wees uw eigen mannen onderdanig, zoals aan de Heere; want de man is het hoofd van de vrouw, zoals ook Christus het Hoofd van de Gemeente is; en Hij is de Behouder van het lichaam. Daarom, zoals de Gemeente aan Christus onderdanig is, zo ook de vrouwen aan hun eigen mannen in alles.", "Ef 2:13-16": "Maar nu bent u, die eertijds ver weg was, in Christus Jezus nabij gekomen door het bloed van Christus. Want Hij is onze vrede, Die deze beiden één gemaakt heeft, en de scheidsmuur die tussen ons in stond, afgebroken heeft, doordat Hij de vijandschap in Zijn vlees teniet gemaakt heeft, namelijk de wet van de geboden die in inzettingen bestond; opdat Hij die twee in Zichzelf tot één nieuwe mens zou scheppen, en zo vrede zou maken;", "Ps 119:120": "Het haar van mijn vlees is te berge gerezen van verschrikking voor U, en ik heb gevreesd voor Uw oordelen.", "Jes 24:1-16": "Zie, de HEERE maakt het land leeg, en Hij maakt het woest; en Hij keert de gestalte ervan om, en Hij verstrooit zijn inwoners. En zoals het met het volk zal gaan, zo zal het met de priester zijn; zoals met de knecht, zo met zijn heer; zoals met de dienstmaagd, zo met haar vrouw; zoals met de koper, zo met de verkoper; zoals met de lener, zo met de ontlener; zoals met de woekeraar, zo met hem van wie hij woeker ontvangt. Dat land zal helemaal leeg gemaakt worden, en het zal helemaal beroofd worden; want de HEERE heeft dit woord gesproken.", "Ps 37:34-38": "Koph. Wacht op de HEERE, en houd Zijn weg, en Hij zal u verhogen om de aarde erfelijk te bezitten; u zult zien dat de goddelozen worden uitgeroeid. Resch. Ik heb een geweldenaar gezien, een goddeloze, die zich uitbreidde als een groene inlandse boom. Maar hij ging voorbij, en zie, hij was er niet meer; en ik zocht hem, maar hij werd niet gevonden.", "Jes 59:20": "En er zal een Verlosser tot Sion komen, namelijk voor hen die zich bekeren van de overtreding in Jakob, spreekt de HEERE.", "Fil 1:16": "Dezen verkondigen Christus wel uit eigenbelang, niet zuiver, en menen aan mijn banden verdrukking toe te brengen;", "Lev 19:14": "U zult de dove niet vloeken, en voor het aangezicht van de blinde geen struikelblok zetten; maar u zult voor uw God vrezen; Ik ben de HEERE!", "Ex 32:22-24": "Toen zei Aäron: De toorn van mijn heer ontsteekt niet! U kent dit volk, dat het geneigd is tot het kwade. Zij zeiden namelijk tegen mij: Maak ons goden, die voor ons uit gaan; want van deze Mozes, die man die ons uit Egypteland heeft opgevoerd, weten wij niet wat er van hem geworden is. Toen zei ik tegen hen: Wie goud heeft, laat die het afrukken en aan mij geven; en ik wierp het in het vuur, en dit kalf is eruit gekomen.", "Matt 13:50": "En zij zullen hen in de vurige oven werpen; daar zal geween zijn en het geknars van de tanden.", "1 Sam 4:4": "Het volk zond dan naar Silo, en men bracht vandaar de ark van het verbond van de HEERE van de heerscharen, die tussen de cherubs† woont; en de twee zonen van Eli, Hofni en Pinehas, waren daar bij de ark van het verbond van God.", "Openb 6:15-17": "En de koningen van de aarde, en de groten, en de rijken, en de leiders over duizend, en de machtigen, en alle dienstknechten, en alle vrijen, verborgen zichzelf in de spelonken, en in de steenrotsen van de bergen; En zeiden tot de bergen en tot de steenrotsen: Valt op ons, en verbergt ons van het aangezicht van Hem Die op de troon zit, en van de toorn van het Lam. Want de grote dag van Zijn toorn is gekomen, en wie kan bestaan?", "Rom 12:19": "Wreek uzelf niet, geliefden, maar geef de toorn plaats; want er is geschreven: Mij komt de wraak toe; Ik zal het vergelden, zegt de Heere.", "Openb 13:4": "En zij aanbaden de draak, die het beest macht gegeven had; en zij aanbaden het beest en zeiden: Wie is aan dit beest gelijk? Wie kan er oorlog tegen voeren?", "Jer 49:24": "Damaskus is slap geworden, zij heeft zich omgekeerd om te vluchten, en siddering heeft haar aangegrepen; benauwdheid en smarten als van een barende vrouw hebben haar bevangen;", "Matt 3:12": "Zijn wan is in Zijn hand, en Hij zal Zijn dorsvloer helemaal zuiveren, en Zijn tarwe in Zijn schuur samenbrengen, en Hij zal het kaf met onblusbaar vuur verbranden.", "Rom 5:18": "Zo dan, zoals door één misdaad de schuld gekomen is over alle mensen tot verdoemenis; zo komt ook door één rechtvaardigheid de genade over alle mensen tot rechtvaardigmaking van het leven.", "Hebr 7:14": "Want het is duidelijk, dat onze Heere uit Juda voortgekomen is; over die stam heeft Mozes niets gesproken wat het priesterschap betreft.", "Rom 3:22": "namelijk de gerechtigheid van God door het geloof van Jezus Christus, tot allen, en over allen die geloven; want er is geen onderscheid.", "Hand 13:27-29": "Want zij die in Jeruzalem wonen, en hun leiders, hebben Hem niet gekend, en hebben ook de stemmen van de profeten, die elke sabbat gelezen worden, vervuld door Hem te veroordelen; En hoewel zij geen reden voor de dood vonden, hebben zij van Pilatus gevraagd dat Hij gedood zou worden. En toen zij alles volbracht hadden wat over Hem geschreven was, namen zij Hem af van het hout, en legden Hem in het graf.", "Deut 28:15-68": "Daarentegen zal het gebeuren, als u niet naar de stem van de HEERE, uw God, luistert, om op te letten dat u al Zijn geboden en Zijn inzettingen doet, die ik u heden gebied; zo zullen al deze vloeken over u komen, en u treffen. Vervloekt zult u zijn in de stad, en vervloekt zult u zijn op het veld. Vervloekt zal zijn uw korf, en uw baktrog.", "1 Tim 3:11": "De vrouwen moeten evenzo eerbaar zijn, geen kwaadspreeksters, waakzaam, betrouwbaar in alles.", "Luk 10:19": "Zie, Ik geef u de macht om op slangen en schorpioenen te treden, en over alle kracht van de vijand; en niets zal u ooit schaden.", "Joh 18:23": "Jezus antwoordde hem: Als Ik verkeerd gesproken heb, getuig dan van het kwade; en als Ik goed gesproken heb, waarom slaat u Mij?", "Mal 3:17": "En zij zullen, zegt de HEERE van de heerscharen, op die dag, die Ik maken zal, Mij een eigendom zijn; en Ik zal hen verschonen, zoals een man zijn zoon verschoont, die hem dient.", "2 Kon 1:6": "En zij zeiden tegen hem: Een man kwam ons tegemoet en zei tegen ons: Ga heen, keer terug naar de koning die u gezonden heeft, en zeg tegen hem: Zo zegt de HEERE: Is het omdat er geen God in Israël is, dat u stuurt om Baäl-Zebub, de god van Ekron, te vragen? Daarom zult u van dat bed waarop u geklommen bent, niet afkomen, maar u zult zeker sterven.", "Openb 3:17": "Want u zegt: Ik ben rijk, en verrijkt geworden, en heb aan niets gebrek; en u weet niet dat u ellendig bent, en jammerlijk, en arm, en blind, en naakt.", "Luk 2:35": "(En ook een zwaard zal door uw eigen ziel gaan) opdat de gedachten uit veel harten geopenbaard worden.", "Ps 18:15": "En Hij zond Zijn pijlen uit, en verstrooide ze; en Hij vermenigvuldigde de bliksemen, en verschrikte ze.", "1 Kor 5:5": "Hem over te geven aan de satan, tot verderf van het vlees, opdat de geest behouden mag worden op de dag van de Heere Jezus.", "Openb 13:7": "En hem werd macht gegeven om de heiligen oorlog aan te doen, en om hen te overwinnen; en hem werd macht gegeven over elk geslacht, en taal, en volk.", "Mark 10:32-34": "En zij waren onderweg, op weg naar Jeruzalem; en Jezus liep voor hen uit; en zij waren verbaasd, en terwijl zij Hem volgden, waren zij bang. En Hij nam de twaalf weer apart, en begon hun te vertellen wat Hem zou overkomen; En Hij zei: Zie, wij gaan op naar Jeruzalem, en de Zoon des mensen zal aan de overpriesters, en aan de Schriftgeleerden overgeleverd worden, en zij zullen Hem ter dood veroordelen, en Hem aan de heidenen overleveren; en zij zullen Hem bespotten, en Hem geselen, en Hem bespuwen, en Hem doden; en op de derde dag zal Hij weer opstaan.", "Rom 2:8": "Maar hun die twistgierig zijn, en die de waarheid ongehoorzaam zijn, maar de ongerechtigheid gehoorzaam zijn, zal verbolgenheid en toorn vergolden worden;", "Jes 28:15": "Omdat u zegt: Wij hebben een verbond met de dood gemaakt, en met het rijk van de dood hebben wij een voorzichtig verdrag gemaakt; wanneer de overstromende gesel doortrekt, zal hij bij ons niet komen; want wij hebben de leugen ons tot een toevlucht gesteld, en onder de valsheid hebben wij ons verborgen.", "Gal 5:17": "Want het vlees begeert tegen de Geest, en de Geest tegen het vlees; en die staan tegenover elkaar, zodat u niet doet wat u zou willen.", "Matt 16:27": "Want de Zoon des mensen zal komen in de heerlijkheid van Zijn Vader, met Zijn engelen, en dan zal Hij ieder vergelden naar zijn daden.", "1 Tim 3:16": "En buiten alle twijfel, de verborgenheid van de godsvrucht is groot: God is geopenbaard in het vlees, gerechtvaardigd in de Geest, gezien door de engelen, gepredikt onder de heidenen, geloofd in de wereld, opgenomen in heerlijkheid.", "Jer 33:15-18": "In die dagen, en te dien tijde zal Ik David een SPRUIT van gerechtigheid doen opkomen; en Hij zal recht en gerechtigheid doen op aarde. In die dagen zal Juda verlost worden, en Jeruzalem zal veilig wonen; en dit is de naam waarmee zij genoemd zal worden: De Heere, ONZE GERECHTIGHEID. Want zo zegt de HEERE: Aan David zal het nooit ontbreken aan een Man, Die op de troon van het huis van Israël zit.", "Spr 24:8": "Wie erop bedacht is kwaad te doen, die zal men een meester in schandelijke plannen noemen.", "Gen 23:4": "Ik ben een vreemdeling en inwoner bij u; geef mij een eigen graf bij u, zodat ik mijn dode van voor mijn aangezicht kan begraven.", "Job 10:22": "Een stikdonker land, als de duisternis zelf, de schaduw van de dood, en zonder ordeningen, en het geeft schijnsel als de duisternis.", "Ps 22:14": "Zij hebben hun mond tegen mij opgesperd, als een verscheurende en brullende leeuw.", "Spr 10:24": "Wat de goddeloze vreest, dat zal hem overkomen; maar wat de rechtvaardigen verlangen, zal God geven.", "Deut 30:15": "Zie, ik heb u heden voorgesteld het leven en het goede, en de dood en het kwade.", "Rom 8:6": "Want het bedenken van het vlees is de dood, maar het bedenken van de Geest is leven en vrede.", "1 Joh 3:12": "Niet zoals Kaïn, die uit de boze was en zijn broeder doodsloeg; en waarom sloeg hij hem dood? Omdat zijn werken slecht waren, en die van zijn broeder rechtvaardig.", "Gen 9:3": "Alles wat zich beweegt, dat leeft, zal u tot voedsel zijn; Ik heb het u allemaal gegeven, zoals het groene kruid.", "Ps 57:5": "Mijn ziel is te midden van leeuwen, ik lig tussen mensen die vuur spuwen, mensenkinderen, wier tanden speren en pijlen zijn, en hun tong een scherp zwaard.", "Spr 21:10": "De ziel van de goddeloze begeert het kwaad; zijn naaste krijgt geen genade in zijn ogen.", "Ps 49:8": "niemand van hen zal zijn broeder ooit kunnen verlossen; hij zal aan God zijn losprijs niet kunnen geven;", "Ps 2:4": "Die in de hemel woont, zal lachen; de Heere zal hen bespotten.", "1 Kor 9:9": "Want in de wet van Mozes staat geschreven: U zult een dorsende os niet muilbanden. Zorgt God soms voor de ossen?", "Spr 10:25": "Zoals een wervelwind voorbijgaat, zo is de goddeloze niet meer; maar de rechtvaardige is een eeuwig fundament.", "Matt 26:14-16": "Toen ging één van de twaalf, Judas Iskariot genaamd, naar de overpriesters, en zei: Wat wilt u mij geven, en ik zal Hem aan u overleveren? En zij hebben hem dertig zilveren munten toegezegd. En vanaf toen zocht hij een gelegenheid om Hem over te leveren.", "Ps 69:2-4": "Verlos mij, o God! Want de wateren zijn gekomen tot aan mijn ziel. Ik ben gezonken in grondeloze modder, waar men niet kan staan; ik ben gekomen in de diepten van de wateren, en de vloed overstroomt mij. Ik ben vermoeid van mijn roepen, mijn keel is ontstoken, mijn ogen zijn bezweken, terwijl ik hoop op mijn God.", "Fil 1:19": "Want ik weet dat dit mij ter zaligheid zal gedijen, door uw gebed en de toebrenging van de Geest van Jezus Christus.", "Ezech 33:17": "Toch zeggen de kinderen van uw volk: De weg van de Heere is niet recht; terwijl het toch hun eigen weg is die niet recht is.", "Ps 64:3-7": "Verberg mij voor de heimelijke afspraken van de boosdoeners, voor het oproer van de werkers van ongerechtigheid. Die hun tong scherpen als een zwaard, een bitter woord richten als hun pijl; Om in verborgen plaatsen de oprechte te schieten; haastig schieten zij naar hem, en vrezen niet.", "Jes 32:9-12": "Staat op, u geruste vrouwen, hoor mijn stem; u dochters, die zo zeker bent, neem mijn woorden ter oor. Vele dagen over het jaar zult u beroerd zijn, u dochters, die zo zeker bent, want de wijnoogst zal voorbij zijn, er zal geen inzameling komen. Beeft, u geruste vrouwen; wees beroerd, dochters, die zo zeker bent; trek u uit, en ontbloot u, en gord zakken om uw middel.", "Jer 1:4-10": "Het woord van de HEERE dan kwam tot mij, en zei: Voordat Ik u in moeders buik vormde, heb Ik u gekend, en voordat u uit de baarmoeder voortkwam, heb Ik u geheiligd; Ik heb u de volken tot een profeet gesteld. Toen zei ik: Ach, Heere HEERE! zie, ik kan niet spreken, want ik ben jong.", "Ex 16:3": "En de Israëlieten zeiden tegen hen: Was ons maar in Egypte gestorven door de hand van de HEERE, toen wij bij de vleespotten zaten, toen wij tot verzadiging brood aten! Want u hebt ons naar deze woestijn gebracht, om deze hele gemeente door honger te laten sterven.", "Jer 18:8-10": "Maar als datzelfde volk, over wie Ik dat gesproken heb, zich van zijn boosheid bekeert, dan zal Ik berouw hebben over het kwaad dat Ik dacht hen aan te doen. Ook zal Ik in een ogenblik spreken over een volk en over een koninkrijk, dat Ik het zal bouwen en planten; Maar als het doet wat kwaad is in Mijn ogen, dat het naar Mijn stem niet luistert, dan zal Ik berouw hebben over het goede waarmee Ik gezegd had hen te zullen weldoen.", "Dan 9:24-27": "Zeventig weken zijn bestemd over uw volk en over uw heilige stad, om de overtreding te sluiten, en om de zonden te verzegelen, en om de ongerechtigheid te verzoenen, en om een eeuwige gerechtigheid aan te brengen, en om het visioen en de profeet te verzegelen, en om het allerheiligst te zalven. Weet dan, en versta: van het uitgaan van het woord om te doen terugkeren en om Jeruzalem te bouwen, tot op de Messias, de Vorst, zijn zeven weken, en tweeënzestig weken; de straten en de grachten zullen weer gebouwd worden, maar in benauwdheid van de tijden. En na die tweeënzestig weken zal de Messias uitgeroeid worden, maar het zal niet voor Hemzelf zijn; en een volk van de vorst die komen zal, zal de stad en het heiligdom verderven, en zijn einde zal zijn met een overstromende vloed, en tot het einde toe zal er oorlog zijn, en vast besloten verwoestingen.", "Mark 11:18": "En de Schriftgeleerden en de overpriesters hoorden dat, en zochten hoe zij Hem konden doden; want zij waren bang voor Hem, omdat de hele menigte verbaasd was over Zijn onderwijs.", "Jes 6:3": "En de een riep tot de ander en zei: Heilig, heilig, heilig is de HEERE van de heerscharen! De hele aarde is vol van Zijn heerlijkheid!", "Luk 22:53": "Toen Ik dagelijks bij u was in de tempel, hebt u de handen tegen Mij niet uitgestoken; maar dit is uw uur, en de macht van de duisternis.", "Jes 10:6": "Ik zal hem zenden tegen een huichelachtig volk, en Ik zal hem bevel geven tegen het volk van Mijn verbolgenheid; opdat hij de roof rooft, en plundert de plundering, en het stelt ter vertreding, als het slijk van de straten.", "Joh 17:12": "Toen Ik met hen in de wereld was, bewaarde Ik hen in Uw Naam. Hen die U Mij gegeven hebt, heb Ik bewaard, en niemand van hen is verloren gegaan, dan de zoon van het verderf, opdat de Schrift vervuld wordt.", "Ps 89:49": "Wat man leeft er, die de dood niet zien zal, die zijn ziel zal bevrijden van het geweld van het graf? Sela.", "Luk 22:21": "Maar zie, de hand van hem die Mij verraadt, is met Mij aan de tafel.", "Ps 127:2": "Het is tevergeefs dat u vroeg opstaat, laat opblijft, brood eet met zorgen erbij; het is zo, dat Hij het aan hen die Hij liefheeft, geeft als in de slaap.", "1 Petr 1:19-21": "maar met het kostbare bloed van Christus, als van een smetteloos en onbevlekt Lam; Die al vóór de grondlegging van de wereld voorbestemd was, maar in deze laatste tijden geopenbaard is omwille van u, die door Hem gelooft in God, Die Hem uit de doden heeft opgewekt en Hem heerlijkheid gegeven heeft, zodat uw geloof en hoop op God gericht zouden zijn.", "Matt 26:41": "Waakt en bidt, opdat u niet in verzoeking komt; de geest is wel gewillig, maar het vlees is zwak.", "Spr 21:22": "De wijze beklimt de stad van de geweldigen, en werpt de sterkte van hun vertrouwen neer.", "Jes 50:6": "Ik geef Mijn rug aan hen die Mij slaan, en Mijn wangen aan hen die Mij het haar uitplukken; Mijn gezicht verberg Ik niet voor smaad en speeksel.", "Jes 42:1-4": "Zie, Mijn Knecht, Die Ik ondersteun, Mijn Uitverkorene, in Wie Mijn ziel een welbehagen heeft! Ik heb Mijn Geest op Hem gegeven; Hij zal het recht aan de heidenen voortbrengen. Hij zal niet schreeuwen, noch Zijn stem verheffen, noch Zijn stem op straat horen laten. Het geknakte riet zal Hij niet breken, en de rokende vlaswiek zal Hij niet uitblussen; met waarheid zal Hij het recht voortbrengen.", "Luk 20:18": "Ieder die op die steen valt, zal verpletterd worden, en op wie hij valt, die zal hij vermorzelen.", "Jes 3:11": "Wee de goddeloze, het zal hem kwalijk gaan, want de vergelding van zijn handen zal hem overkomen.", "Luk 16:8": "En de heer prees de onrechtvaardige rentmeester, omdat hij voorzichtig gehandeld had; want de kinderen van deze wereld zijn voorzichtiger dan de kinderen van het licht, in hun geslacht.", "Ef 4:18": "Verduisterd in het verstand, vervreemd van het leven van God, door de onwetendheid die in hen is, door de verharding van hun hart;", "2 Kor 1:8": "Want wij willen niet, broeders, dat u onwetend bent van onze verdrukking, die ons in Azië overkomen is: dat wij uitzonderlijk zwaar belast zijn geweest, boven ons vermogen, zodat wij zeer in twijfel waren, ook aan het leven.", "Luk 10:7": "En blijf in dat huis, etend en drinkend wat zij u geven; want de arbeider is zijn loon waard. Ga niet van het ene huis naar het andere.", "Ps 106:24": "Zij versmaadden ook het gewenste land; zij geloofden Zijn woord niet.", "Joh 12:31": "Nu is het oordeel over deze wereld; nu zal de leider van deze wereld buitengeworpen worden.", "Gen 18:19": "Want Ik heb hem gekend, opdat hij zijn kinderen en zijn huis na hem zou opdragen, en zij de weg van de HEERE zouden bewaren, om gerechtigheid en recht te doen; opdat de HEERE over Abraham brengt wat Hij over hem gesproken heeft.", "Joh 19:24": "Zij zeiden dan tegen elkaar: Laten wij die niet scheuren, maar erom loten, van wie die zal zijn; opdat de Schrift vervuld wordt, die zegt: Zij hebben Mijn kleren onder elkaar verdeeld, en over Mijn kleding hebben zij het lot geworpen. Dit hebben de soldaten dan gedaan.", "Gen 17:7": "En Ik zal Mijn verbond oprichten tussen Mij en u, en uw nageslacht na u, in hun geslachten, tot een eeuwig verbond, om u en uw nageslacht na u tot een God te zijn.", "Ps 90:10": "Aangaande de dagen van onze jaren, daarin zijn zeventig jaren, of, als wij zeer sterk zijn, tachtig jaren; en het voortreffelijkste van die is moeite en verdriet; want het wordt snel afgesneden, en wij vliegen daarheen.", "Ps 58:4": "De goddelozen zijn vervreemd van de moederschoot af; de leugensprekers dolen van de moederbuik af.", "Joh 1:32": "En Johannes getuigde: Ik heb de Geest zien neerdalen uit de hemel, als een duif, en Hij bleef op Hem.", "1 Sam 1:20": "En het gebeurde, na verloop van dagen, dat Hanna zwanger werd, en een zoon baarde, en zij noemde zijn naam Samuël: Want, zei ze, ik heb hem van de HEERE gebeden.", "2 Kor 5:16": "Zo kennen wij van nu af aan niemand meer naar het vlees; en al hebben wij ook Christus naar het vlees gekend, toch kennen wij Hem nu niet meer naar het vlees.", "Openb 7:14": "En ik zei tegen hem: Heere, u weet het. En hij zei tegen mij: Dezen zijn het, die uit de grote verdrukking komen; en zij hebben hun lange kleren gewassen, en hebben hun lange kleren wit gemaakt in het bloed van het Lam.", "Rom 3:5": "Als nu onze ongerechtigheid de gerechtigheid van God bevestigt, wat zullen wij zeggen? Is God onrechtvaardig, als Hij toorn over ons brengt? (Ik spreek naar de mens.)", "Joh 9:41": "Jezus zei tegen hen: Als u blind was, zou u geen zonde hebben; maar nu zegt u: Wij zien; daarom blijft uw zonde.", "Job 34:7": "Wat man is er, gelijk Job? Hij drinkt de bespotting in als water;", "Hebr 13:11": "Want de lichamen van de dieren waarvan het bloed voor de zonde door de hogepriester in het heiligdom gedragen werd, worden verbrand buiten de legerplaats.", "Lev 26:14": "Maar als u Mij niet zult horen, en al deze geboden niet zult doen;", "Ps 18:27": "Bij de reine houdt U Zich rein, maar bij de verkeerde bewijst U Zich een Worstelaar.", "Gen 3:1-16": "De slang was listiger dan al het gedierte van het veld, dat de HEERE God gemaakt had; en zij zei tegen de vrouw: Is het echt zo dat God gezegd heeft: U zult niet eten van alle bomen in de hof? En de vrouw zei tegen de slang: Van de vrucht van de bomen in de hof mogen wij eten; Maar van de vrucht van de boom die in het midden van de hof staat, heeft God gezegd: U zult daarvan niet eten, en u zult die ook niet aanraken, anders sterft u.", "Ps 99:1": "De HEERE regeert, dat de volken beven; Hij zit tussen de cherubs; de aarde beeft.", "Ps 101:8": "Elke morgen zal ik alle goddelozen van het land verdelgen, om uit de stad van de HEERE alle werkers van de ongerechtigheid uit te roeien.", "Job 31:3": "Is niet het verderf voor de verkeerde, ja, wat vreemds voor de werkers van ongerechtigheid?", "Spr 29:1": "Een man die, vaak bestraft, zijn nek verhardt, zal plotseling verbroken worden, zodat er geen genezing meer mogelijk is.", "1 Kon 21:21": "Zie, Ik zal kwaad over u brengen, en uw nakomelingen wegdoen; en Ik zal van Achab uitroeien wie mannelijk is, alsook wie in Israël afgesloten is en wie verlaten is.", "Micha 4:14": "Nu, verzamel u met benden, dochter van de bende, hij heeft een belegering tegen ons gelegd; zij zullen de rechter van Israël met de roede op het kinnebak slaan.", "Joh 8:56": "Abraham, uw vader, heeft er met vreugde naar verlangd Mijn dag te zien; en hij heeft hem gezien, en is verblijd geweest.", "Joh 16:11": "En van oordeel, omdat de aanvoerder van deze wereld geoordeeld is.", "Rom 5:12-21": "Daarom, zoals door één mens de zonde in de wereld ingekomen is, en door de zonde de dood; en zo de dood tot alle mensen doorgegaan is, doordat allen gezondigd hebben. Want tot de wet was de zonde in de wereld; maar de zonde wordt niet toegerekend als er geen wet is. Maar de dood heeft geheerst van Adam tot Mozes toe, ook over hen die niet gezondigd hadden op dezelfde manier als de overtreding van Adam, die een voorbeeld is van Hem die komen zou.", "Matt 10:16": "Zie, Ik zend u als schapen te midden van de wolven; wees dan voorzichtig zoals de slangen, en oprecht zoals de duiven.", "Klaagl 5:16": "De kroon van ons hoofd is afgevallen; o wee nu ons, dat wij zo gezondigd hebben!", "Ps 59:6": "Ja, U HEERE, God van de heerscharen, God van Israël! Ontwaak om al deze heidenen te bezoeken; wees niemand van hen genadig die trouweloos ongerechtigheid bedrijven. Sela.", "2 Kor 5:5": "Die ons nu hiertoe klaargemaakt heeft, is God, Die ons ook het onderpand van de Geest gegeven heeft.", "Ps 37:2": "Want als gras zullen zij snel worden afgesneden, en als het groene grasscheutje zullen zij afvallen.", "Spr 28:10": "Wie de oprechten doet dwalen op een kwade weg, zal zelf in zijn eigen kuil vallen; maar de vromen zullen het goede beërven.", "Gen 2:5": "En elke struik van het veld, voordat hij op de aarde was, en al het kruid van het veld, voordat het opkwam; want de HEERE God had het niet laten regenen op de aarde, en er was geen mens geweest, om de aardbodem te bewerken.", "Joz 5:13": "Vervolgens gebeurde het, toen Jozua bij Jericho was, dat hij zijn ogen opsloeg en toekeek, en zie, er stond een Man tegenover hem, Die een getrokken zwaard in Zijn hand had. En Jozua ging naar Hem toe, en zei tegen Hem: Bent U van ons, of van onze vijanden?", "2 Kon 8:10": "En Elisa zei tegen hem: Ga, zeg hem: U zult beslist niet genezen; want de HEERE heeft mij getoond dat hij zeker zal sterven.", "Jes 7:23": "Ook zal het op diezelfde dag gebeuren, dat iedere plaats waar duizend wijnstokken waren, elk duizend zilverstukken waard, met doorns en distels bedekt zal zijn;", "Matt 17:23": "en zij zullen Hem doden, en op de derde dag zal Hij worden opgewekt. En zij werden zeer bedroefd.", "1 Kor 1:18": "Want het woord van het kruis is voor hen die verloren gaan wel dwaasheid; maar voor ons, die behouden worden, is het een kracht van God;", "Ezech 28:9": "Zult u dan nog, voor het aangezicht van hem die u doodslaat, zeggen: Ik ben God? terwijl u een mens bent en geen God, in de hand van hem die u verslaat?", "Spr 21:16": "Een mens die van de weg van het verstand afdwaalt, zal in de gemeente van de doden rusten.", "Luk 24:26": "Moest de Christus deze dingen niet lijden, en zo in Zijn heerlijkheid ingaan?", "1 Tim 3:6": "Geen pas bekeerde, opdat hij niet hoogmoedig wordt en onder het oordeel van de duivel valt.", "Jer 50:24": "Ik heb u een strik gesteld, en daardoor bent u ook gevangen, o Babel! Zonder dat u het wist; u bent gevonden, en ook gegrepen, omdat u zich tegen de HEERE in strijd gemengd hebt.", "Hebr 4:15": "Want wij hebben geen Hogepriester Die geen medelijden kan hebben met onze zwakheden, maar Die in alle dingen, net als wij, beproefd is geweest, doch zonder zonde.", "Hebr 12:4": "U hebt nog niet tot bloedens toe tegenstand geboden, terwijl u streed tegen de zonde;", "Rom 1:18": "Want de toorn van God wordt geopenbaard van de hemel over alle goddeloosheid en ongerechtigheid van de mensen, die de waarheid in ongerechtigheid ten onder houden.", "Mark 14:24": "En Hij zei tegen hen: Dat is Mijn bloed, het bloed van het nieuwe testament, dat voor velen vergoten wordt.", "Luk 17:2": "Het zou beter voor hem zijn dat een molensteen om zijn hals gedaan werd en hij in de zee geworpen werd, dan dat hij één van deze kleinen zou laten struikelen.", "Joh 15:24": "Als Ik de werken onder hen niet had gedaan, die niemand anders gedaan heeft, hadden zij geen zonde; maar nu hebben zij ze gezien, en hebben zowel Mij als Mijn Vader gehaat.", "Joh 11:49-52": "En een van hen, namelijk Kajafas, die dat jaar hogepriester was, zei tegen hen: U begrijpt niets; en u overweegt niet dat het nuttig voor ons is dat één mens sterft voor het volk, en niet het hele volk verloren gaat. En dit zei hij niet uit zichzelf; maar omdat hij dat jaar hogepriester was, profeteerde hij dat Jezus zou sterven voor het volk;", "Kol 3:8": "Maar leg nu ook u dit alles af: gramschap, toorn, kwaadheid, lastering, vuil spreken uit uw mond.", "2 Kor 11:13-15": "Want zulke valse apostelen zijn bedrieglijke arbeiders, die zich veranderen in apostelen van Christus. En het is geen wonder, want de satan zelf verandert zich in een engel van het licht. Zo is het dan niets groots, als ook zijn dienaars zich veranderen als waren zij dienaars van de gerechtigheid; van wie het einde zal zijn naar hun werken.", "Ezech 24:13": "In uw onreinheid is schandelijkheid, omdat Ik u gereinigd heb, en u niet gereinigd bent, zult u van uw onreinheid niet meer gereinigd worden, totdat Ik Mijn grimmigheid op u tot rust heb gebracht.", "Gen 3:20-24": "Vervolgens noemde Adam zijn vrouw Eva, omdat zij een moeder van alle levenden is. En de HEERE God maakte voor Adam en zijn vrouw kleren van huiden, en trok ze hun aan. Toen zei de HEERE God: Zie, de mens is geworden als één van Ons, kennend het goed en het kwaad! Nu dan, laat hij zijn hand niet uitsteken, en ook nemen van de boom van het leven, en eten, en in eeuwigheid leven —", "Ps 58:7-10": "O God, verbreek hun tanden in hun mond; breek de baktanden van de jonge leeuwen af, o HEERE! Laat hen wegsmelten als water, laat hen wegstromen; als hij zijn pijlen aanlegt, laat hen zijn alsof zij afgesneden waren. Laat hem heengaan als een wegsmeltende slak; laat hen, als de misdracht van een vrouw, de zon niet zien.", "Ps 71:24": "Ook zal mijn tong Uw gerechtigheid de hele dag uitspreken, want zij zijn beschaamd, want zij zijn schaamrood geworden, die mijn kwaad zoeken.", "Matt 6:15": "Maar als u de mensen hun misdaden niet vergeeft, zal ook uw Vader uw misdaden niet vergeven.", "Luk 23:30": "Dan zullen zij beginnen te zeggen tegen de bergen: Valt op ons; en tegen de heuvels: Bedekt ons.", "Rom 8:7": "Daarom dat het bedenken van het vlees vijandschap is tegen God; want het onderwerpt zich niet aan de wet van God, want het kan ook niet.", "Rom 9:20": "Maar toch, o mens, wie bent u, die tegen God antwoordt? Zal ook het maaksel tegen hem die het gemaakt heeft zeggen: Waarom hebt u mij zo gemaakt?", "Openb 12:9-12": "En de grote draak is neergeworpen, namelijk de oude slang, die genoemd wordt duivel en satan, die de hele wereld verleidt; hij is, zeg ik, neergeworpen op de aarde; en zijn engelen zijn met hem neergeworpen. En ik hoorde een grote stem, die zei in de hemel: Nu is de zaligheid, en de kracht, en het koninkrijk van onze God gekomen; en de macht van Zijn Christus; want de aanklager van onze broeders, die hen aanklaagde voor onze God dag en nacht, is neergeworpen. En zij hebben hem overwonnen door het bloed van het Lam, en door het woord van hun getuigenis, en zij hebben hun leven niet liefgehad tot de dood toe.", "Matt 27:39-44": "En zij die voorbijgingen, beschimpten Hem en schudden hun hoofd, en zeiden: U Die de tempel afbreekt en in drie dagen opbouwt, verlos Uzelf. Als U de Zoon van God bent, kom dan van het kruis af. En evenzo zeiden ook de overpriesters, met de schriftgeleerden en oudsten, en Farizeeën, terwijl zij Hem bespotten:", "Openb 3:10": "Omdat u het woord van Mijn volharding bewaard hebt, zal Ik u ook bewaren uit het uur van de verzoeking, dat over de hele wereld komen zal, om te verzoeken hen die op de aarde wonen.", "Joh 8:38": "Ik spreek wat Ik bij Mijn Vader gezien heb; en u doet dan ook wat u bij uw vader gezien hebt.", "Openb 1:13": "en te midden van de zeven kandelaren Eén, gelijk de Zoon des mensen, bekleed met een lang kleed tot de voeten, en omgord aan de borst met een gouden gordel;", "Job 17:16": "Zij zullen mee naar beneden gaan met de grendels van het graf, als er rust samen in het stof zal zijn.", "Amos 5:18-20": "Wee hen die de dag van de HEERE verlangen! Waartoe toch zal de dag van de HEERE u zijn? Hij zal duisternis zijn en geen licht. Zoals wanneer iemand vlucht voor het aangezicht van een leeuw, en een beer hem ontmoet; of dat hij in een huis komt, en met zijn hand tegen de wand leunt, en een slang hem bijt. Zal dan niet de dag van de HEERE duisternis zijn, en geen licht? En donkerheid, zodat er geen glans aan is?", "2 Kor 4:4": "In hen heeft de god van deze eeuw de zinnen verblind, namelijk van de ongelovigen, opdat hen niet zou bestralen de verlichting van het Evangelie van de heerlijkheid van Christus, Die het Beeld van God is.", "1 Kor 10:6": "En deze dingen zijn ons tot voorbeelden gebeurd, opdat wij geen lust tot het kwade zouden hebben, zoals zij ook lust gehad hebben.", "Ps 37:13-22": "De Heere belacht hem, want Hij ziet dat zijn dag komt. Cheth. De goddelozen hebben het zwaard getrokken, en hun boog gespannen, om de ellendige en de arme neer te vellen, om te slachten wie oprecht van weg zijn. Maar hun zwaard zal in hun eigen hart gaan; en hun bogen zullen verbroken worden.", "Jes 49:7": "Zo zegt de HEERE, de Verlosser van Israël, Zijn Heilige, tegen de veracht ziel, tegen Hem aan Wie het volk een gruwel heeft, tegen de Knecht van hen die heersen: Koningen zullen het zien en opstaan, ook vorsten, en zij zullen zich voor U buigen; om de wil van de HEERE, Die getrouw is, om de Heilige van Israël, Die U verkozen heeft.", "Openb 9:18": "Door deze drie werd het derde deel van de mensen gedood, namelijk door het vuur, en door de rook, en door het zwavel, dat uit hun monden uitging.", "Matt 1:20-23": "En terwijl hij deze dingen overwoog, zie, de engel van de Heere verscheen hem in een droom en zei: Jozef, zoon van David! Wees niet bevreesd Maria, uw vrouw, tot u te nemen, want wat in haar ontvangen is, dat is uit de Heilige Geest; en zij zal een Zoon baren, en u zult Hem de naam JEZUS geven; want Hij zal Zijn volk zalig maken van hun zonden. En dit alles is gebeurd, opdat vervuld zou worden wat door de Heere gesproken is door de profeet, die zei:", "1 Tim 5:9": "Een weduwe moet niet worden opgenomen jonger dan zestig jaar, die de vrouw van één man geweest is;", "2 Kor 2:11": "opdat de satan geen voordeel over ons krijgt; want zijn gedachten zijn ons niet onbekend.", "Rom 8:32": "Hij Die zelfs Zijn eigen Zoon niet gespaard heeft, maar Hem voor ons allen overgegeven heeft, hoe zal Hij ons ook met Hem niet alle dingen schenken?", "Matt 26:18": "En Hij zei: Ga de stad in, naar zo iemand, en zeg hem: De Meester zegt: Mijn tijd is nabij, Ik zal bij u het Pascha houden met Mijn discipelen.", "Job 20:5-29": "Dat het gejuich van de goddelozen van dichtbij geweest is², en de vreugde van de huichelaar maar voor een ogenblik? Al zou zijn hoogheid tot de hemel toe opklimmen, en zijn hoofd tot aan de wolken raken; Zal hij, net als zijn eigen drek, voor eeuwig vergaan; wie hem gezien hadden, zullen zeggen: Waar is hij?", "Jer 22:13": "Wee hem die zijn huis bouwt met ongerechtigheid, en zijn bovenzalen met onrecht; die de dienst van zijn naaste voor niets gebruikt, en hem zijn arbeidsloon niet geeft!", "Hand 3:22": "Want Mozes heeft tegen de vaderen gezegd: De Heere, uw God, zal u een Profeet doen opstaan uit uw broeders, zoals mij; naar Hem moet u luisteren, in alles wat Hij tegen u zal zeggen.", "Joh 13:21": "Toen Jezus dit gezegd had, werd Hij ontroerd in de geest, en betuigde en zei: Voorwaar, voorwaar, Ik zeg u, dat een van u Mij zal verraden.", "Gen 35:16-18": "En zij reisden verder van Bethel; en er was nog een kleine afstand om tot Efrath te komen; en Rachel baarde, en zij had het zwaar bij haar bevalling. En het gebeurde, toen zij het zwaar had bij haar bevalling, dat de vroedvrouw tegen haar zei: Wees niet bang; want ook dit is een zoon voor u! En het gebeurde, toen haar ziel heenging (want zij stierf), dat zij zijn naam Ben-Oni noemde; maar zijn vader noemde hem Benjamin.", "Job 5:5": "Wiens oogst de hongerige verteerde, die hij ook uit de doornen gehaald had; de struikrover slokte hun vermogen in.", "Joh 16:20": "Voorwaar, voorwaar, Ik zeg u: u zult huilen en klagen, maar de wereld zal zich verblijden; en u zult bedroefd zijn, maar uw droefheid zal tot blijdschap worden.", "Ps 74:20": "Zie naar het verbond; want de duistere plaatsen van het land zijn vol woningen van geweld.", "Joh 14:17": "Namelijk de Geest van de waarheid, Die de wereld niet kan ontvangen, want zij ziet Hem niet, en kent Hem niet; maar u kent Hem, want Hij blijft bij u, en zal in u zijn.", "Hos 9:7": "De dagen van de vergelding zijn gekomen, de dagen van de vergelding zijn gekomen; zij van Israël zullen het gewaar worden; de profeet is een dwaas, de man van de geest is onzinnig; om de grootheid van uw ongerechtigheid is de haat ook groot.", "Job 14:19-21": "Het water vermaalt de stenen, het stof van de aarde overspoelt het gewas dat er zelf uit voortkomt; zo verderft U de verwachting van de mens. U overweldigt hem voor altijd, en hij gaat heen; U verandert zijn gelaat, en zendt hem weg. Zijn kinderen komen tot eer, en hij weet het niet; of zij worden klein, en hij merkt het niet aan hen.", "Ezech 18:2": "Wat is er met u, dat u dit spreekwoord gebruikt over het land Israël, en zegt: De vaders hebben onrijpe druiven gegeten, en de tanden van de kinderen zijn stomp geworden?", "Jes 57:4-11": "Over wie maakt u zich vrolijk, tegen wie sperrt u de mond wijd open en steekt u de tong lang uit? Bent u geen kinderen van de overtreding, een nageslacht van de valsheid? U die verhit bent in de eikenbossen, onder elke groene boom; die de kinderen slacht bij de beken, onder de richels van de rotsen? Aan de gladde stenen van de beek is uw deel; die, die zijn uw lot; ook stort u daarover een drankoffer uit, u offert hun een spijsoffer; zou Ik Mij hierover laten troosten?", "Zach 8:17": "En denk niet, de een over de ander, kwaad in uw hart; en heb een valse eed niet lief; want al deze dingen zijn wat Ik haat, spreekt de HEERE.", "Klaagl 5:17": "Daarom is ons hart mat, om deze dingen zijn onze ogen duister geworden.", "Pred 8:8": "Er is geen mens die macht heeft over de geest, om de geest tegen te houden; en hij heeft geen macht over de dag van de dood; er is ook geen vrijstelling in die strijd; en de goddeloosheid zal haar meesters niet redden.", "2 Sam 7:14": "Ik zal hem tot een Vader zijn, en hij zal Mij tot een zoon zijn; wanneer hij misdoet, zal Ik hem straffen met een mensenroede en met plagen van de mensenkinderen.", "Pred 7:15": "Dit alles heb ik gezien in de dagen van mijn vluchtige leven; er is een rechtvaardige die in zijn gerechtigheid omkomt; daarentegen is er een goddeloze die in zijn slechtheid zijn dagen verlengt.", "Pred 1:13": "En ik richtte mijn hart erop om met wijsheid te onderzoeken en na te speuren alles wat er gebeurt onder de hemel. Deze moeilijke bezigheid heeft God de kinderen der mensen gegeven, om zich daarmee bezig te houden.", "Ef 6:13-17": "Daarom, neem de hele wapenrusting van God aan, opdat u kunt weerstaan in de boze dag, en na alles verricht te hebben, staande blijven. Sta dan, met uw lenden omgord met de waarheid, en aangedaan met het borstwapen van de gerechtigheid; en de voeten geschoeid met bereidheid van het Evangelie van de vrede;", "Luk 3:4": "zoals geschreven is in het boek van de woorden van Jesaja, de profeet, die zei: De stem van iemand die roept in de woestijn: Bereid de weg van de Heere, maak Zijn paden recht!", "2 Kon 6:21": "En de koning van Israël zei tegen Elisa, toen hij hen zag: Zal ik hen doden? Zal ik hen doden, mijn vader?", "Spr 11:23": "Het verlangen van de rechtvaardigen is alleen het goede; maar de verwachting van de goddelozen is verbolgenheid.", "Jer 21:14": "En Ik zal over u bezoeking doen naar de vrucht van uw daden, spreekt de HEERE; en Ik zal een vuur aansteken in haar woud, dat alles zal verteren wat rondom haar is.", "Ps 23:4": "Al ging ik ook in een dal van de schaduw van de dood, ik zou geen kwaad vrezen, want U bent met mij; Uw stok en Uw staf, die troosten mij.", "Jak 1:11": "Want de zon is opgegaan met hitte, en heeft het gras dor gemaakt, en zijn bloem is afgevallen, en de mooie vorm van zijn aanzien is vergaan; zo zal ook de rijke in zijn wegen verwelken.", "2 Petr 2:3-9": "En zij zullen door hebzucht, met gemaakte woorden, van u een koopwaar maken; over hen is het oordeel van lang geleden niet werkeloos, en hun verderf sluimert niet. Want als God de engelen die gezondigd hebben niet gespaard heeft, maar hen in de hel geworpen heeft en overgegeven heeft aan de ketenen van de duisternis, om tot het oordeel bewaard te worden; en de oude wereld niet gespaard heeft, maar Noach, de prediker van de gerechtigheid, met zeven anderen bewaard heeft, toen Hij de zondvloed over de wereld van de goddelozen bracht;", "1 Tess 4:11": "En dat u zich beijvert om stil te zijn, en uw eigen zaken te doen, en te werken met uw eigen handen, zoals wij u bevolen hebben;", "Job 1:9-12": "Toen antwoordde de satan de HEERE en zei: Is het voor niets, dat Job God vreest? Hebt U niet een omheining gemaakt om hem heen, en om zijn huis, en om alles wat hij heeft rondom? Het werk van zijn handen hebt U gezegend, en zijn vee heeft zich in menigte uitgebreid in het land. Maar strek toch nu Uw hand uit, en tast alles aan wat hij heeft; dan zal hij U beslist in Uw aangezicht vervloeken.", "Joh 19:36": "Want deze dingen zijn gebeurd, opdat de Schrift vervuld wordt: Geen been van Hem zal verbroken worden.", "Mark 10:45": "Want ook de Zoon des mensen is niet gekomen om gediend te worden, maar om te dienen, en Zijn leven te geven als losprijs voor velen.", "1 Kron 16:22": "Raak Mijn gezalfden niet aan, en doet Mijn profeten geen kwaad.", "Mark 15:14": "Maar Pilatus zei tegen hen: Wat heeft Hij dan voor kwaad gedaan? En zij riepen des te meer: Kruisig Hem!", "Jak 1:2-4": "Acht het voor grote vreugde, mijn broeders, wanneer u in allerlei verzoekingen valt; Wetend dat de beproeving van uw geloof volharding werkt. Doch de volharding moet een volmaakt werk hebben, opdat u volmaakt bent en geheel oprecht, in geen ding gebrekkig.", "1 Petr 5:9": "Weersta hem, vast staand in het geloof, in de wetenschap dat hetzelfde lijden wordt volbracht aan uw broederschap die in de wereld is.", "Luk 3:7": "Hij zei dan tegen de menigten die naar buiten kwamen om door hem gedoopt te worden: Adderengebroed, wie heeft u aangewezen te vluchten van de toekomende toorn?", "Luk 9:24-26": "Want wie zijn leven wil behouden, zal het verliezen; maar wie zijn leven verliest om Mij, die zal het behouden. Want wat baat het een mens als hij de hele wereld zou winnen, en zichzelf verliezen of schade lijden? Want wie zich voor Mij en Mijn woorden zal schamen, voor hem zal de Zoon des mensen Zich schamen wanneer Hij komt in Zijn heerlijkheid, en die van de Vader, en van de heilige engelen.", "Gen 5:1-5": "Dit is het boek van Adams geslacht. Op de dag dat God de mens schiep, maakte Hij hem naar de gelijkenis van God. Man en vrouw schiep Hij hen, en zegende ze, en noemde hun naam Mens, op de dag dat zij geschapen werden. En Adam leefde honderdendertig jaren, en verwekte een zoon naar zijn gelijkenis, naar zijn evenbeeld, en noemde zijn naam Seth.", "Zef 1:12": "En het zal gebeuren in die tijd, Ik zal Jeruzalem met lantaarns doorzoeken; en Ik zal bezoeking doen over de mannen die star geworden zijn op hun droesem, die in hun hart zeggen: De HEERE doet geen goed, en Hij doet geen kwaad.", "Spr 6:18": "een hart dat verdorven plannen smeedt; voeten die zich haasten om naar het kwaad te lopen;", "Deut 32:32": "Want hun wijnstok is uit de wijnstok van Sodom, en uit de velden van Gomorra; hun wijndruiven zijn vergiftige wijndruiven; zij hebben bittere druiventrossen.", "Matt 18:28-35": "Maar deze dienstknecht ging naar buiten en vond een van zijn mededienstknechten, die hem honderd penningen schuldig was; hij greep hem vast en greep hem bij de keel, en zei: Betaal mij wat u schuldig bent. Zijn mededienstknecht viel toen aan zijn voeten neer en smeekte hem: Heb geduld met mij, en ik zal u alles betalen. Maar hij wilde niet, maar ging weg en wierp hem in de gevangenis, totdat hij de schuld zou betaald hebben.", "Mark 9:49": "Want ieder zal met vuur gezouten worden, en elk offer zal met zout gezouten worden.", "Joh 15:6": "Als iemand in Mij niet blijft, die is buiten geworpen, zoals de rank, en is verdord; en men verzamelt ze, en men werpt ze in het vuur, en zij worden verbrand.", "Ps 73:2-21": "Maar wat mij aangaat, mijn voeten waren bijna uitgegleden; mijn schreden waren bijna weggegleden. Want ik was jaloers op de dwazen, toen ik de vrede van de goddelozen zag. Want er zijn geen boeien tot hun dood toe, en hun kracht is fris.", "Jes 47:10": "Want u hebt op uw boosheid vertrouwd; u hebt gezegd: Niemand ziet mij; uw wijsheid en uw kennis heeft u afkerig gemaakt; en u hebt in uw hart gezegd: Ik ben het, en niemand meer dan ik.", "Luk 13:28": "Daar zal het geween zijn en het geknars van de tanden, wanneer u Abraham, Izak en Jakob en al de profeten zult zien in het Koninkrijk van God, en uzelf eruit gezet.", "Hand 17:18": "En sommigen van de Epicureïsche en Stoïcijnse wijsgeren streden met hem; en sommigen zeiden: Wat wil deze praatjesmaker toch zeggen? Maar anderen zeiden: Hij lijkt een verkondiger te zijn van vreemde goden; omdat hij hun Jezus en de opstanding verkondigde.", "Spr 6:28": "Zal iemand over kolen lopen, zonder dat zijn voeten verbranden?", "Dan 7:25": "En het zal woorden spreken tegen de Allerhoogste, en het zal de heiligen van de hoge plaatsen uitputten, en het zal proberen de tijden en de wet te veranderen, en zij zullen in zijn hand overgegeven worden tot een tijd, en tijden, en een deel van een tijd.", "Rom 5:15": "Toch is het niet zo dat de genadegift is zoals de misdaad; want als door de misdaad van één velen gestorven zijn, is de genade van God, en de gave door de genade die er is van één Mens Jezus Christus, des te meer overvloedig geweest over velen.", "Mal 3:5": "En Ik zal tot u naderen ten oordeel; en Ik zal een snel Getuige zijn tegen de tovenaars, en tegen de overspelers, en tegen hen die vals zweren, en tegen hen die het loon van de dagloner met geweld inhouden, die de weduwe, en de wees, en de vreemdeling het recht verdraaien, en Mij niet vrezen, zegt de HEERE van de heerscharen.", "Matt 27:25-30": "En al het volk antwoordde en zei: Laat Zijn bloed komen over ons, en over onze kinderen. Toen liet hij hun Barabbas los; maar nadat hij Jezus gegeseld had, gaf hij Hem over om gekruisigd te worden. Toen namen de soldaten van de stadhouder Jezus mee naar het rechthuis, en verzamelden de hele legerafdeling om Hem heen.", "Job 10:15": "Ben ik goddeloos, wee mij! En ben ik rechtvaardig, ik zal mijn hoofd niet opheffen; ik ben verzadigd van schande, maar zie mijn ellende aan.", "Ps 21:11": "U zult hun vrucht van de aarde verdoen, en hun nageslacht van de kinderen der mensen.", "Ps 6:8": "Mijn oog is doorknaagd van verdriet, is verouderd, vanwege al mijn tegenstanders.", "Num 30:7": "en haar man dat hoort, en op de dag dat hij het hoort tegen haar zwijgt, dan blijven haar geloften gelden, en haar verbintenissen, waarmee zij haar ziel verbonden heeft, blijven gelden.", "2 Tim 3:7": "vrouwtjes die altijd leren, en nooit tot kennis van de waarheid kunnen komen.", "Dan 12:2": "En velen van hen die in het stof van de aarde slapen, zullen ontwaken, dezen tot eeuwig leven, en anderen tot versmaadheden en tot eeuwige afgrijzing.", "Ps 71:11": "En zeggen: God heeft hem verlaten; jaag hem na, en grijp hem, want er is geen verlosser.", "Mark 9:12": "En Hij antwoordde en zei tegen hen: Elia komt inderdaad eerst, en herstelt alles; en het zal gebeuren, zoals geschreven is van de Zoon des mensen, dat Hij veel moet lijden en veracht worden.", "Spr 15:22": "Plannen worden tenietgedaan als er geen overleg is; maar door veel raadgevers komen ze tot stand.", "Ps 89:20": "Toen hebt Gij in een gezicht gesproken van Uw heilige, en gezegd: Ik heb hulp besteld bij een held; Ik heb een verkorene uit het volk verhoogd.", "Fil 2:7": "Maar heeft Zichzelf ontledigd door de gestalte van een dienstknecht aan te nemen, en is de mensen gelijk geworden;", "Luk 23:34": "En Jezus zei: Vader, vergeef het hun; want zij weten niet wat zij doen. En zij verdeelden Zijn kleren en wierpen erom het lot.", "Spr 28:14": "Gelukkig is de mens, die voortdurend vreest; maar wie zijn hart verhardt, zal in het kwaad vallen.", "Joh 12:31-33": "Nu is het oordeel over deze wereld; nu zal de leider van deze wereld buitengeworpen worden. En Ik, wanneer Ik van de aarde verhoogd zal zijn, zal allen tot Mij trekken. (En dit zei Hij, om aan te duiden wat voor dood Hij sterven zou.)", "Ps 2:1-5": "Waarom woeden de heidenen, en bedenken de volken iets zinloos? De koningen van de aarde stellen zich op, en de vorsten beraadslagen samen tegen de HEERE, en tegen Zijn Gezalfde, en zeggen: Laat ons hun banden verscheuren, en hun touwen van ons afwerpen.", "2 Tess 2:4": "die zich tegenstelt en zich verheft boven alles wat God genoemd wordt, of als God vereerd wordt, zodat hij in de tempel van God als God zal zitten, zichzelf voordoend dat hij God is.", "Matt 7:19": "Iedere boom die geen goede vrucht voortbrengt, wordt omgehakt en in het vuur geworpen.", "Gen 2:18": "Ook had de HEERE God gesproken: Het is niet goed dat de mens alleen is; Ik zal hem een hulp maken, die bij hem past.", "2 Tim 2:26": "en zij weer mochten ontwaken uit de strik van de duivel, door wie zij gevangen waren om diens wil te doen.", "Hand 2:31": "Heeft hij, dit vooruitziend, gesproken over de opstanding van Christus, dat Zijn ziel niet verlaten is in het rijk van de dood, en Zijn vlees geen verderving heeft gezien.", "Ps 40:8": "Toen zei ik: Zie, ik kom; in de rol van het boek is van mij geschreven.", "Openb 12:7": "En er kwam strijd in de hemel: Michaël en zijn engelen streden tegen de draak, en de draak streed, ook zijn engelen;", "Spr 14:22": "Dwalen zij niet, die kwaad beramen? Maar goedertierenheid en trouw is er voor hen die goed beramen.", "Dan 7:13": "Verder zag ik in de nachtgezichten, en zie, er kwam Een met de wolken van de hemel, als eens mensen zoon, en Hij kwam tot de Oude van dagen, en men liet Hem voor Hem naderen.", "Matt 22:13": "Toen zei de koning tegen de dienaars: Bind zijn handen en voeten, neem hem mee en werp hem in de buitenste duisternis; daar zal het huilen zijn en het geknars van de tanden.", "Hand 2:23": "Deze, door de bepaalde raad en voorkennis van God overgegeven, hebt u genomen en door de handen van onrechtvaardigen aan het kruis gehecht en gedood;", "Rom 2:5": "Maar naar uw hardheid en onbekeerlijk hart, verzamelt u voor uzelf toorn als een schat, voor de dag van de toorn en de openbaring van het rechtvaardig oordeel van God.", "Joh 14:26": "Maar de Trooster, de Heilige Geest, Die de Vader zal zenden in Mijn Naam, Die zal u alles leren, en zal u alles laten herinneren wat Ik u gezegd heb.", "Rom 8:39": "Noch hoogte, noch diepte, noch enig ander schepsel ons zal kunnen scheiden van de liefde van God, die er is in Christus Jezus, onze Heere.", "Fil 2:8": "En in gedaante gevonden als een mens, heeft Hij Zichzelf vernederd, gehoorzaam geworden tot de dood, ja, de dood van het kruis.", "Hand 17:31": "Omdat Hij een dag vastgesteld heeft, waarop Hij de aardbodem rechtvaardig zal oordelen, door een Man Die Hij daartoe aangesteld heeft, en Hij heeft daarvan aan allen zekerheid gegeven doordat Hij Hem uit de doden heeft opgewekt.", "Mark 14:42": "Sta op, laten we gaan; zie, hij die Mij verraadt, is dichtbij.", "Hand 20:28": "Zo, geef dan acht op uzelf, en op de hele kudde, waarover de Heilige Geest u tot opzieners heeft aangesteld, om de gemeente van God te weiden, die Hij verkregen heeft door Zijn eigen bloed.", "Matt 13:12-15": "Want wie heeft, hem zal gegeven worden, en hij zal overvloedig hebben; maar wie niet heeft, van hem zal genomen worden ook wat hij heeft. Daarom spreek Ik tot hen door gelijkenissen, omdat zij ziende niet zien, en horende niet horen, en ook niet begrijpen. En in hen wordt de profetie van Jesaja vervuld, die zegt: Met het gehoor zult u horen, en geenszins begrijpen; en ziende zult u zien, en geenszins opmerken.", "1 Kor 6:19": "Of weet u niet, dat uw lichaam een tempel is van de Heilige Geest, Die in u is, Die u van God hebt, en dat u niet van uzelf bent?", "Matt 25:32": "En voor Hem zullen alle volken verzameld worden, en Hij zal ze van elkaar scheiden, zoals de herder de schapen van de bokken scheidt.", "Jer 16:18": "Daarom zal Ik eerst hun ongerechtigheid en hun zonde dubbel vergelden, omdat zij Mijn land ontheiligd hebben; zij hebben Mijn erfenis met de dode lichamen van hun verfoeisels en hun gruwelen vervuld.", "Jes 40:2": "Spreekt naar het hart van Jeruzalem, en roept haar toe, dat haar strijd vervuld is, dat haar ongerechtigheid verzoend is, dat zij van de hand van de HEERE dubbel ontvangen heeft voor al haar zonden.", "3 Joh 1:1": "De ouderling aan de geliefde Gajus, die ik in waarheid liefheb.", "Job 7:21": "En waarom vergeeft U mijn overtreding niet, en doet U mijn ongerechtigheid niet weg? Want nu zal ik in het stof liggen; en U zult mij vroeg zoeken, maar ik zal niet zijn.", "Hebr 12:24": "En tot de Middelaar van het nieuwe testament, Jezus, en het bloed van de besprenging, dat betere dingen spreekt dan Abel.", "1 Joh 1:7": "Maar als wij in het licht wandelen, zoals Hij in het licht is, dan hebben wij gemeenschap met elkaar, en het bloed van Jezus Christus, Zijn Zoon, reinigt ons van alle zonde.", "Ef 5:22": "Vrouwen, wees uw eigen mannen onderdanig, zoals aan de Heere;", "Mark 4:15": "En dezen zijn zij die langs de weg bezaaid worden, waarin het Woord gezaaid wordt; en wanneer zij het gehoord hebben, komt de satan meteen, en neemt het Woord weg, dat in hun hart gezaaid was.", "Job 19:29": "Schroom voor het zwaard; want de grimmigheid is over de misdaden van het zwaard; opdat u weet, dat er een gericht is.", "Matt 4:1-11": "Toen werd Jezus door de Geest weggeleid naar de woestijn, om beproefd te worden door de duivel. En toen Hij veertig dagen en veertig nachten gevast had, kreeg Hij ten laatste honger. En de verzoeker kwam naar Hem toe en zei: Als U Gods Zoon bent, zeg dan dat deze stenen broden worden.", "Hand 13:33": "dat God die vervuld heeft aan ons, hun kinderen, doordat Hij Jezus verwekt heeft. Zoals ook in de tweede psalm geschreven staat: U bent Mijn Zoon, heden heb Ik U verwekt.", "1 Joh 3:16": "Hieraan hebben wij de liefde gekend, dat Hij Zijn leven voor ons gesteld heeft; en wij zijn schuldig het leven te stellen voor de broeders.", "Mark 1:13": "En Hij was daar in de woestijn veertig dagen, beproefd door de satan; en Hij was bij de wilde dieren; en de engelen dienden Hem.", "Hand 12:23": "En meteen sloeg hem een engel van de Heere, omdat hij God de eer niet gaf; en hij werd door de wormen opgegeten, en gaf de geest.", "Micha 4:9": "Nu, waarom zou u zo luid roepen? Is er geen koning onder u? Is uw Raadgever vergaan, dat smart u heeft aangegrepen, als van een barende vrouw?", "Openb 3:19": "Ieder die Ik liefheb, die bestraf en tuchtig Ik; wees dan ijverig, en bekeer u.", "Jes 28:18-22": "En uw verbond met de dood zal teniet gedaan worden, en uw voorzichtig verdrag met het rijk van de dood zal niet standhouden; wanneer de overstromende gesel doortrekt, dan zult u erdoor vertrapt worden. Vanaf de tijd dat hij doortrekt, zal hij u wegnemen, want elke morgen zal hij doortrekken, bij dag en bij nacht; en het zal gebeuren, dat louter het verstaan van het gerucht een verschrikking zal zijn. Want het bed zal korter zijn dan dat men zich erop kan uitstrekken; en het deksel zal te smal zijn, als men zich eronder wikkelt.", "Tit 2:3-5": "De oude vrouwen eveneens, dat zij zich gedragen zoals bij heiligheid past, geen lasteraarsters zijn, zich niet overgeven aan veel wijn, maar leraressen zijn van het goede; Opdat zij de jonge vrouwen leren bezonnen te zijn, hun mannen lief te hebben, hun kinderen lief te hebben; Matig te zijn, kuis te zijn, het huis te bewaren, goed te zijn, hun eigen mannen onderdanig te zijn, opdat het Woord van God niet gelasterd wordt.", "1 Kon 19:19-21": "Zo ging hij vandaar, en vond Elisa, de zoon van Safat; die was aan het ploegen met twaalf span runderen voor zich uit, en hij zelf was bij het twaalfde; en Elia ging naar hem toe, en wierp zijn mantel op hem. En hij liet de runderen achter, en liep Elia achterna, en zei: Laat mij toch mijn vader en mijn moeder kussen, daarna zal ik u volgen. En hij zei tegen hem: Ga, keer terug; want wat heb ik u gedaan? Zo keerde hij van achter hem terug, en nam een span runderen, en slachtte het, en met het gereedschap van de runderen kookte hij hun vlees, dat hij aan het volk gaf; en zij aten. Daarna stond hij op, en volgde Elia, en diende hem.", "Matt 13:49": "Zo zal het bij de voleinding van de wereld zijn; de engelen zullen uitgaan, en de bozen uit het midden van de rechtvaardigen afscheiden;", "1 Kor 8:9-13": "Maar kijk uit, dat deze macht van u niet op de een of andere manier een aanstoot wordt voor hen die zwak zijn. Want als iemand u, die de kennis hebt, ziet aanzitten in de tempel van de afgod, zal het geweten van hem, die zwak is, dan niet gesterkt worden om te eten de dingen die aan de afgoden geofferd zijn? En zal de broeder, die zwak is, door uw kennis verloren gaan, om wie Christus gestorven is?", "1 Kor 10:5-11": "Maar in het meerdere deel van hen heeft God geen welgevallen gehad; want zij zijn in de woestijn neergeslagen. En deze dingen zijn ons tot voorbeelden gebeurd, opdat wij geen lust tot het kwade zouden hebben, zoals zij ook lust gehad hebben. En word geen afgodendienaars, zoals sommigen van hen, zoals geschreven staat: Het volk zat neer om te eten en te drinken, en zij stonden op om te spelen.", "1 Tess 5:15": "Zie erop toe dat niemand kwaad met kwaad vergeldt bij wie dan ook; maar jaag altijd het goede na, zowel tegenover elkaar als tegenover allen.", "Ps 34:21": "Schin. Hij bewaart al zijn beenderen; niet een daarvan wordt gebroken.", "Ezech 22:14": "Zal uw hart standhouden? Zullen uw handen sterk zijn, in de dagen dat Ik met u zal handelen? Ik, de HEERE, heb het gesproken, en zal het doen.", "Deut 32:39": "Zie nu, dat Ik, Ik DIE ben, en geen God met Mij; Ik dood en maak levend; Ik versla en Ik heel; en er is niemand die uit Mijn hand redt!", "Luk 2:11-14": "namelijk dat u heden geboren is de Zaligmaker, Die is Christus, de Heere, in de stad van David. En dit zal voor u het teken zijn: u zult het Kindje vinden in doeken gewonden, en liggend in de kribbe. En opeens was er bij de engel een menigte van het hemelse leger, die God prezen en zeiden:", "Job 21:32": "Ten slotte wordt hij naar de graven gebracht, en blijft hij op de aardhoop.", "Jona 3:9": "Wie weet, God mocht Zich wenden, en berouw hebben; en Hij mocht Zich wenden van de gloed van Zijn toorn, zodat wij niet vergaan!", "Spr 15:3": "De ogen van de HEERE zijn in alle plaatsen, en zien de kwaden en de goeden.", "Spr 14:32": "De goddeloze zal weggedreven worden in zijn kwaad; maar de rechtvaardige vertrouwt zelfs in zijn dood.", "Ps 109:16-18": "Omdat hij niet gedacht heeft weldadigheid te doen, maar de ellendige en de behoeftige man heeft vervolgd, en de verslagene van hart, om hem te doden. Omdat hij de vloek heeft liefgehad, laat die hem overkomen, en heeft geen lust gehad tot de zegen, laat die dan ver van hem zijn. En laat hij bekleed zijn met de vloek, als met zijn kleed, en laat die gaan tot in zijn binnenste als het water, en als de olie in zijn beenderen.", "Hos 13:14": "Toch zal Ik hen verlossen van de macht van het graf, Ik zal hen vrijmaken van de dood: o dood, waar zijn uw pestilentiën? Graf, waar is uw verderf? Berouw zal voor Mijn ogen verborgen zijn,", "Kol 1:20-22": "en dat Hij, door Hem vrede gemaakt te hebben door het bloed van Zijn kruis, door Hem, zeg ik, alle dingen met Zichzelf verzoenen zou, hetzij de dingen die op de aarde, hetzij de dingen die in de hemelen zijn. En u, die eertijds vervreemd was en vijanden door het verstand in de boze werken, heeft Hij nu ook verzoend, in het lichaam van Zijn vlees, door de dood, opdat Hij u heilig en onberispelijk en onbeschuldigbaar voor Zich zou stellen;", "Matt 26:39": "En toen Hij een weinig verder gegaan was, viel Hij op Zijn aangezicht, bad en zei: Mijn Vader, als het mogelijk is, laat deze drinkbeker aan Mij voorbijgaan! Maar toch niet zoals Ik wil, maar zoals U wilt.", "Ps 97:3": "Een vuur gaat voor Zijn aangezicht heen, en het steekt Zijn tegenstanders rondom in brand.", "Ex 25:2": "Spreek tot de kinderen van Israël, dat zij voor Mij een hefoffer nemen. Van elke man wiens hart zich vrijwillig bewegen zal, zult u Mijn hefoffer nemen.", "Jes 11:2": "En op Hem zal de Geest van de HEERE rusten, de Geest van wijsheid en van verstand, de Geest van raad en van sterkte, de Geest van kennis en van vreze van de HEERE.", "Dan 7:14": "En Hem werd gegeven heerschappij, en eer, en het Koninkrijk, dat alle volken, natiën en talen Hem zouden eren; Zijn heerschappij is een eeuwige heerschappij, die niet zal vergaan, en Zijn Koninkrijk zal niet te gronde gericht worden.", "Spr 22:23": "Want de HEERE zal hun rechtszaak voeren, en Hij zal aan hen die hen beroven, de ziel roven.", "Deut 29:19-21": "En het gebeurt, als hij de woorden van deze vloek hoort, dat hij zichzelf zegent in zijn hart, en zegt: Ik zal vrede hebben, ook al zal ik naar mijn eigen hart wandelen, om de dronkenschap toe te voegen aan de dorst. De HEERE zal hem niet willen vergeven; maar dan zal de toorn van de HEERE en Zijn ijver roken over die man, en de hele vloek, die in dit boek geschreven is, zal op hem liggen; en de HEERE zal zijn naam van onder de hemel uitwissen. En de HEERE zal hem ten kwade afscheiden van al de stammen van Israël, naar alle vloeken van het verbond, dat in het boek van deze wet geschreven is.", "Micha 5:1": "En u, Bethlehem Efratha, bent u klein om te zijn onder de duizenden van Juda? Uit u zal Mij Iemand voortkomen, Die een Heerser zal zijn in Israël, en Wiens uitgangen zijn van oudsher, van de dagen van de eeuwigheid.", "1 Joh 5:5": "Wie is het, die de wereld overwint, dan hij die gelooft dat Jezus de Zoon van God is?", "Hebr 10:27-31": "maar een schrikwekkend uitzicht op het oordeel, en een felle hitte van het vuur, die de tegenstanders zal verslinden. Als iemand de wet van Mozes heeft verworpen, sterft hij zonder ontferming, op het woord van twee of drie getuigen; hoeveel zwaarder straf, denkt u, zal hij waard geacht worden, die de Zoon van God met voeten heeft getreden, en het bloed van het testament, waardoor hij geheiligd was, als onrein heeft beschouwd, en de Geest van de genade smaad heeft aangedaan?", "Hebr 12:3": "Want let op Hem, Die zo'n tegenspreken van de zondaren tegen Zich heeft verdragen, opdat u niet verflauwt en bezwijkt in uw zielen.", "Rom 7:5": "Want toen wij in het vlees waren, werkten de hartstochten van de zonden, die door de wet geprikkeld worden, in onze leden, om vruchten te dragen voor de dood.", "1 Kor 9:27": "Maar ik bedwing mijn lichaam, en breng het tot dienstbaarheid, opdat ik niet, nadat ik anderen gepredikt heb, zelf verwerpelijk word.", "Ps 80:18": "Uw hand zij over de man van Uw rechterhand, over de zoon van de mens, die U voor Uzelf gesterkt hebt.", "Joh 3:16": "Want zo lief heeft God de wereld gehad, dat Hij Zijn eniggeboren Zoon gegeven heeft, opdat ieder die in Hem gelooft, niet verloren gaat, maar het eeuwige leven heeft.", "Openb 2:24": "Maar Ik zeg u, en tegen de anderen die in Thyatire zijn, zovelen als deze leer niet hebben, en die de diepten van de satan niet gekend hebben, zoals zij zeggen: Ik zal u geen andere last opleggen;", "Joh 19:23": "De soldaten dan namen, toen zij Jezus gekruisigd hadden, Zijn kleren (en maakten er vier delen van, voor elke soldaat een deel) en de onderkleding. De onderkleding nu was zonder naad, van boven af helemaal geweven.", "Joh 7:7": "De wereld kan u niet haten, maar Mij haat zij, omdat Ik van haar getuig dat haar werken slecht zijn.", "Gen 39:7": "En het gebeurde na deze dingen, dat de vrouw van zijn heer haar ogen op Jozef liet vallen; en zij zei: lig bij mij!", "2 Kron 30:6": "De boodschappers dan gingen weg met de brieven uit de hand van de koning en zijn leiders, door heel Israël en Juda, en naar het bevel van de koning, en zeiden: Kinderen van Israël, bekeer u tot de HEERE, de God van Abraham, Izak en Israël, dan zal Hij Zich keren naar wie ontkomen waren, die voor u overgebleven zijn uit de hand van de koningen van Assyrië.", "Luk 9:22": "en Hij zei: De Zoon des mensen moet veel lijden, en verworpen worden door de oudsten, overpriesters en Schriftgeleerden, en gedood worden en op de derde dag opgewekt worden.", "Job 17:13": "Als ik wacht, het graf zal mijn huis wezen; in de duisternis zal ik mijn bed spreiden.", "Deut 24:14": "U zult de arme en behoeftige dagloner niet verdrukken, die uit uw broeders is, of uit uw vreemdelingen die in uw land en in uw poorten zijn.", "Spr 5:6-21": "Opdat u het pad van het leven niet zoudt overwegen, zijn haar gangen onvast, zodat u het niet merkt. Nu dan, kinderen! Hoor naar mij, en wijk niet van de woorden van mijn mond. Maak uw weg ver van haar vandaan, en kom niet bij de deur van haar huis;", "Deut 32:33": "Hun wijn is vurig drakenvenijn, en een wreed adderenvergif.", "Mark 14:62": "En Jezus zei: Ik ben het. En u zult de Zoon des mensen zien zitten aan de rechterhand van de kracht van God, en komen met de wolken van de hemel.", "Matt 18:34": "En zijn heer werd toornig en leverde hem over aan de pijnigers, totdat hij alles zou betaald hebben wat hij hem schuldig was.", "Gen 3:15-19": "En Ik zal vijandschap zetten tussen u en de vrouw, en tussen uw nageslacht en haar Nageslacht; Dat zal u de kop vermorzelen, en u zult Het de hiel vermorzelen. Tegen de vrouw zei Hij: Ik zal uw smart zeer vermeerderen, namelijk de smart van uw zwangerschap; met smart zult u kinderen baren; en naar uw man zal uw begeerte uitgaan, en hij zal over u heersen. En tegen Adam zei Hij: Omdat u geluisterd hebt naar de stem van uw vrouw, en van die boom hebt gegeten waarvan Ik u geboden had: Daarvan zult u niet eten; is het aardrijk vervloekt om u; en met smart zult u daarvan eten, alle dagen van uw leven.", "Ezech 18:29": "Toch zegt het huis van Israël: De weg van de Heere is niet recht. Zouden Mijn wegen, o huis van Israël, niet recht zijn? Zijn niet uw wegen onrecht?", "Ps 55:4": "Om het geroep van de vijand, vanwege de beangstiging van de goddeloze; want zij schuiven ongerechtigheid op mij, en in toorn haten zij mij.", "Matt 18:7-9": "Wee de wereld vanwege de struikelblokken, want het is onvermijdelijk dat de struikelblokken komen; maar wee die mens door wie het struikelblok komt! Als dan uw hand of uw voet u doet struikelen, hak ze af en werp ze van u weg. Het is beter voor u om kreupel of verminkt het leven in te gaan, dan met twee handen of twee voeten in het eeuwige vuur geworpen te worden. En als uw oog u doet struikelen, trek het uit en werp het van u weg. Het is beter voor u om met één oog het leven in te gaan, dan met twee ogen in het helse vuur geworpen te worden.", "Gal 3:10": "Want zovelen als er uit de werken van de wet zijn, die zijn onder de vloek; want er is geschreven: Vervloekt is ieder die niet blijft in alles wat geschreven is in het boek van de wet, om dat te doen.", "Luk 1:76": "En u, kind, zult een profeet van de Allerhoogste genoemd worden; want u zult voor het aangezicht van de Heere uit gaan, om Zijn wegen te bereiden;", "Job 9:18": "Hij laat mij niet toe mijn adem te halen, maar Hij verzadigt mij met bitterheden.", "Openb 5:12": "die met een luide stem zeiden: Het Lam, Dat geslacht is, is waard te ontvangen de kracht, en rijkdom, en wijsheid, en sterkte, en eer, en heerlijkheid, en dankzegging.", "Mal 3:1-3": "Zie, Ik zend Mijn engel, die voor Mijn aangezicht de weg bereiden zal; en snel zal die Heere, Die u zoekt, tot Zijn tempel komen, namelijk de Engel van het verbond, aan Wie u lust hebt; zie, Hij komt, zegt de HEERE van de heerscharen. Maar wie zal de dag van Zijn komst verdragen, en wie zal standhouden als Hij verschijnt? Want Hij zal zijn als het vuur van een goudsmid, en als zeep van de blekers. En Hij zal zitten, louterend, en het zilver reinigend, en Hij zal de kinderen van Levi reinigen, en Hij zal ze doorlouteren als goud en als zilver; dan zullen zij de HEERE spijsoffer toebrengen in gerechtigheid.", "1 Tess 5:2": "Want u weet zelf zeer goed dat de dag van de Heere zo zal komen, zoals een dief in de nacht.", "Ps 141:7": "Onze beenderen zijn verstrooid bij de mond van het graf, zoals wanneer iemand op de aarde iets kloofde en verdeelde.", "2 Tim 2:22": "Maar vlucht de begeerten van de jeugd; en jaag naar rechtvaardigheid, geloof, liefde, vrede, samen met hen die de Heere aanroepen uit een rein hart.", "Mark 9:31": "Want Hij onderwees Zijn discipelen, en zei tegen hen: De Zoon des mensen zal overgeleverd worden in de handen van mensen, en zij zullen Hem doden, en nadat Hij gedood is, zal Hij op de derde dag weer opstaan.", "2 Kor 4:10": "Altijd de doding van de Heere Jezus in het lichaam met ons omdragend, opdat ook het leven van Jezus in ons lichaam openbaar zou worden.", "Hos 7:15": "Ik heb hen wel getuchtigd, en hun armen gesterkt; maar zij denken kwaad tegen Mij.", "Nahum 1:8-10": "En met een doorgaande vloed zal Hij haar plaats volledig vernietigen; en duisternis zal Zijn vijanden vervolgen. Wat bedenkt u tegen de HEERE? Hij zal zelf een einde maken; de benauwdheid zal niet tweemaal opkomen. Omdat zij als doornen ineengevlochten zijn, en dronken zijn zoals zij plegen dronken te zijn, zo worden zij helemaal verteerd, als een dorre stoppel.", "Spr 18:22": "Wie een vrouw gevonden heeft, heeft iets goeds gevonden, en hij heeft welgevallen verkregen van de HEERE.", "Jes 11:4": "Maar Hij zal de armen met gerechtigheid oordelen, en de zachtmoedigen van het land met rechtmatigheid bestraffen; doch Hij zal de aarde slaan met de roede van Zijn mond, en met de adem van Zijn lippen zal Hij de goddeloze doden.", "Ps 82:7": "Toch zult u sterven als een mens; en als een van de vorsten zult u vallen.", "Hebr 10:5": "Daarom zegt Hij, bij Zijn komst in de wereld: Slachtoffer en offergave hebt U niet gewild, maar U hebt Mij een lichaam toebereid;", "Ps 28:4": "Geef hun naar hun doen, en naar de boosheid van hun handelingen; geef hun naar het werk van hun handen; laat de vergelding voor hen tot hen terugkeren.", "Spr 26:10": "De groten doen ieder verdriet aan, en huren de dwazen, en huren de overtreders.", "Rom 11:22": "Zie dan de goedertierenheid en de strengheid van God; de strengheid wel over hen die gevallen zijn, maar de goedertierenheid over u, als u in de goedertierenheid blijft; anders zult ook u afgehouwen worden.", "Jona 1:10": "Toen werden die mannen erg bang, en zeiden tegen hem: Wat hebt u gedaan? Want de mannen wisten dat hij van het aangezicht van de HEERE vluchtte; want hij had het hun verteld.", "Spr 17:2": "Een verstandige knecht zal heersen over een zoon die beschaamd maakt, en in het midden van de broeders zal hij erfenis delen.", "Spr 12:4": "Een kloeke huisvrouw is een kroon voor haar man; maar zij die beschaamd maakt, is als verrotting in zijn beenderen.", "Hos 14:10": "Wie is wijs? die begrijpt deze dingen; wie is verstandig? die bekent ze; want de wegen van de Heere zijn recht, en de rechtvaardigen zullen daarin wandelen, maar de overtreders zullen daarin vallen.", "Gal 5:20": "Afgoderij, toverij, vijandschappen, ruzies, jaloersheden, toorn, twisten, verdeeldheid, afwijkingen in de leer,", "Hand 26:23": "Namelijk dat de Christus moest lijden, en dat Hij, als Eerste uit de opstanding van de doden, een licht zou verkondigen aan dit volk en aan de heidenen.", "Luk 9:44": "Neem deze woorden ter harte: want de Zoon des mensen zal overgeleverd worden in de handen van mensen.", "Mark 15:34": "En op het negende uur riep Jezus met luide stem: ELOÏ, ELOÏ, LAMMA SABACHTANI, dat vertaald betekent: Mijn God, Mijn God, waarom hebt U Mij verlaten?", "Openb 15:1-6": "En ik zag een ander groot en wonderlijk teken in de hemel: namelijk zeven engelen, die de zeven laatste plagen hadden; want in deze is de toorn van God geëindigd. En ik zag als een glazen zee, met vuur gemengd; en zij die de overwinning hadden behaald op het beest, en op zijn beeld, en op zijn merkteken, en op het getal van zijn naam, stonden aan de glazen zee, met de citers van God. En zij zongen het gezang van Mozes, de dienstknecht van God, en het gezang van het Lam, en zeiden: Groot en wonderlijk zijn Uw werken, Heere, Gij almachtige God, rechtvaardig en waarachtig zijn Uw wegen, Gij Koning der heiligen!", "Ezech 22:31": "Daarom heb Ik Mijn gramschap over hen uitgegoten; door het vuur van Mijn verbolgenheid heb Ik hen verteerd; hun weg heb Ik op hun hoofd gegeven, spreekt de Heere HEERE.", "Spr 13:14": "De leer van de wijze is een springader van het leven, om af te wijken van de strikken van de dood.", "Ps 22:3": "Mijn God! Ik roep overdag, maar U antwoordt niet; en 's nachts, en ik heb geen stilte.", "Luk 17:24": "Want zoals de bliksem, die van het ene einde onder de hemel bliksemt, tot het andere einde onder de hemel schijnt, zo zal ook de Zoon des mensen zijn in Zijn dag.", "Spr 6:12-15": "Een nietsnut, een verdorven man, gaat om met een verkeerde mond; hij knipoogt met zijn ogen, spreekt met zijn voeten, wijst met zijn vingers; in zijn hart zijn verkeerdheden, hij smeedt voortdurend kwaad, hij zaait ruzie.", "Luk 22:37": "Want Ik zeg u, dat nog dit, wat geschreven is, in Mij vervuld moet worden, namelijk: En Hij is met de misdadigers gerekend. Want ook wat over Mij geschreven is, heeft een einde.", "Luk 2:26": "En hem was door de Heilige Geest een goddelijke openbaring gedaan, dat hij de dood niet zien zo
