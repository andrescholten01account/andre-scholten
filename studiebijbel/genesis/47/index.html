eren, in de dagen van hun vreemdelingschap.", "10": "En Jakob zegende Farao, en ging weg van Farao.", "11": "En Jozef zorgde voor woningen voor Jakob en zijn broers, en gaf hun een bezitting in Egypteland, in het beste deel van het land, in het land Rameses, zoals Farao geboden had.", "12": "En Jozef verzorgde zijn vader en zijn broers en het hele huis van zijn vader met brood, tot aan de kleinste kinderen toe.", "13": "En er was geen brood in het hele land; want de honger was zeer zwaar, zodat het land van Egypte en het land Kanaän uitgeput raakten vanwege die honger.", "14": "Toen verzamelde Jozef al het geld dat in Egypteland en in het land Kanaän gevonden werd, voor het koren dat zij kochten; en Jozef bracht dat geld in het huis van Farao.", "15": "Toen het geld uit Egypteland en uit het land Kanaän op was, kwamen alle Egyptenaren naar Jozef en zeiden: Geef ons brood; want waarom zouden wij in uw bijzijn sterven? Want het geld is op.", "16": "En Jozef zei: Geef uw vee, dan zal ik u brood geven voor uw vee, als het geld op is.", "17": "Toen brachten zij hun vee naar Jozef; en Jozef gaf hun brood in ruil voor paarden, voor het vee van de schapen, voor het vee van de runderen en voor ezels; en hij voorzag hen van brood, dat jaar, voor al hun vee.", "18": "Toen dat jaar voorbij was, kwamen zij in het tweede jaar bij hem en zeiden tegen hem: Wij zullen het voor mijn heer niet verbergen: het geld is op, en de bezitting van het vee is bij mijn heer gekomen; er is voor het aangezicht van mijn heer niets anders overgebleven dan ons lichaam en ons land.", "19": "Waarom zouden wij voor uw ogen sterven, zowel wij als ons land? Koop ons en ons land voor brood, dan zullen wij en ons land Farao dienstbaar zijn; en geef ons zaad, opdat wij leven en niet sterven, en het land niet woest wordt!", "20": "Zo kocht Jozef het hele land van Egypte voor Farao; want de Egyptenaren verkochten ieder zijn akker, omdat de honger sterk op hen drukte; zo werd het land eigendom van Farao.", "21": "En wat het volk betreft, dat liet hij overbrengen naar de steden, van het ene uiterste van de grenzen van Egypte tot het andere uiterste ervan.", "22": "Alleen het land van de priesters kocht hij niet; want de priesters hadden een vast deel van Farao, en zij aten van dat vaste deel dat Farao hun gegeven had; daarom verkochten zij hun land niet.", "23": "Toen zei Jozef tegen het volk: Zie, ik heb vandaag u en uw land gekocht voor Farao; zie, hier is zaad voor u, opdat u het land bezaait.", "24": "Maar met de opbrengst zal het zo gaan, dat u aan Farao het vijfde deel zult geven, en de vier delen zullen voor u zijn, tot zaad voor het veld, en tot voedsel voor uzelf en voor wie in uw huizen zijn, en om te eten voor uw kinderen.", "25": "En zij zeiden: U hebt ons leven gered; laten wij genade vinden in de ogen van mijn heer, en wij zullen knechten van Farao zijn.", "26": "Jozef stelde dit dan in tot een wet, tot op deze dag, over het land van Egypte, dat Farao het vijfde deel zou hebben; behalve alleen het land van de priesters, dat niet van Farao werd.", "27": "Zo woonde Israël in het land van Egypte, in het land Gosen; en zij verkregen daar bezittingen, en zij werden vruchtbaar en vermeerderden zeer.", "28": "En Jakob leefde in het land van Egypte zeventien jaar; zodat de dagen van Jakob, de jaren van zijn leven, honderdzevenenveertig jaar geweest zijn.", "29": "Toen de dagen naderden dat Israël zou sterven, riep hij zijn zoon Jozef, en zei tegen hem: Als ik nu genade gevonden heb in uw ogen, leg dan toch uw hand onder mijn heup, en bewijs mij goedheid en trouw: begraaf mij toch niet in Egypte;", "30": "maar laat ik bij mijn vaderen liggen; daarom zult u mij uit Egypte wegvoeren en mij in hun graf begraven. En hij zei: Ik zal doen naar uw woord!", "31": "En hij zei: Zweer het mij! En hij zwoer het hem. En Israël boog zich neer aan het hoofdeind van het bed."}, "SV": {"1": "Toen kwam Jozef en boodschapte Farao, en zeide: Mijn vader en mijn broeders, en hun schapen, en hun runderen, met alles wat zij hebben, zijn gekomen uit het land Kanaän; en zie, zij zijn in het land Gosen.", "2": "En hij nam een deel zijner broederen, *te* *weten* vijf mannen, en hij stelde hen voor Farao’s aangezicht.", "3": "Toen zeide Farao tot zijn broederen: Wat is uw hantering? En zij zeiden tot Farao: Uw knechten zijn schaapherders, zo wij als onze vaders.", "4": "Voorts zeiden zij tot Farao: Wij zijn gekomen, om als vreemdelingen in dit land te wonen; want er is geen weide voor de schapen, die uw knechten hebben, dewijl de honger zwaar is in het land Kanaän; en nu, laat toch uw knechten in het land Gosen wonen!", "5": "Toen sprak Farao tot Jozef, zeggende: Uw vader en uw broeders zijn tot u gekomen;", "6": "Egypteland is voor uw aangezicht; doe uw vader en uw broeders in het beste van het land wonen; laat hen in het land Gosen wonen, en zo gij weet, dat er onder hen kloeke mannen zijn, zo zet hen tot veemeesters over hetgeen ik heb.", "7": "En Jozef bracht zijn vader Jakob mede, en stelde hem voor Farao’s aangezicht; en Jakob zegende Farao.", "8": "En Farao zeide tot Jakob: Hoe vele zijn de dagen der jaren uws levens!", "9": "En Jakob zeide tot Farao: De dagen der jaren mijner vreemdelingschappen zijn honderd en dertig jaren; weinig en kwaad zijn de dagen der jaren mijns levens geweest, en hebben niet bereikt de dagen van de jaren des levens mijner vaderen, in de dagen hunner vreemdelingschappen.", "10": "En Jakob zegende Farao, en ging uit van Farao’s aangezicht.", "11": "En Jozef bestelde voor Jakob en zijn broederen woningen, en hij gaf hun een bezitting in Egypteland, in het beste van het land, in het land Rameses, gelijk als Farao geboden had.", "12": "En Jozef onderhield zijn vader, en zijn broeders, en het ganse huis zijns vaders, met brood, tot den mond der kinderkens toe.", "13": "En er was geen brood in het ganse land; want de honger was zeer zwaar: zodat het land van Egypte en het land Kanaän raasden vanwege dien honger.", "14": "Toen verzamelde Jozef al het geld, dat in Egypteland en in het land Kanaän gevonden werd, voor het koren, dat zij kochten; en Jozef bracht dat geld in Farao’s huis.", "15": "Als nu het geld uit Egypteland en uit het land Kanaän verdaan was, kwamen al de Egyptenaars tot Jozef, zeggende: Geef ons brood; want waarom zouden wij in uw tegenwoordigheid sterven? want het geld ontbreekt;", "16": "En Jozef zeide: Geeft uw vee, zo zal ik het u geven voor uw vee, indien het geld ontbreekt.", "17": "Toen brachten zij hun vee tot Jozef; en Jozef gaf hun brood voor paarden en voor het vee der schapen, en voor het vee der runderen, en voor ezels; en hij voedde hen met brood, datzelve jaar, voor al hun vee.", "18": "Toen datzelve jaar voleind was, zo kwamen zij tot hem in het tweede jaar, en zeiden tot hem: Wij zullen het voor mijn heer niet verbergen, alzo het geld verdaan is, en de bezitting der beesten *gekomen* aan mijn heer, zo is er niets anders overgebleven voor het aangezichts mijns heren, dan ons lichaam en ons land.", "19": "Waarom zullen wij voor uw ogen sterven, zo wij als ons land? Koop ons en ons land voor brood; zo zullen wij en ons land Farao dienstbaar zijn; en geef zaad, opdat wij leven en niet sterven, en het land niet woest worde!", "20": "Alzo kocht Jozef het gehele land van Egypte voor Farao; want de Egyptenaars verkochten een ieder zijn akker, dewijl de honger sterk over hen geworden was; zo werd het land Farao’s eigen.", "21": "En aangaande het volk, dat zette hij over in de steden, van het ene uiterste der palen van Egypte, tot het andere uiterste deszelven.", "22": "Alleen het land der priesteren kocht hij niet, want de priesters hadden een bescheiden deel van Farao, en zij aten hun bescheiden deel, hetwelk hun Farao gegeven had; daarom verkochten zij hun land niet.", "23": "Toen zeide Jozef tot het volk: Ziet, ik heb heden u en uw land gekocht voor Farao; ziet, daar is zaad voor u, opdat gij het land bezaait.", "24": "Doch met de inkomsten zal het geschieden, dat gij aan Farao het vijfde deel zult geven, en de vier delen zullen voor u zijn, tot zaad des velds, en tot uw spijze en van degenen, die in uw huizen zijn, en om te eten voor uw kinderkens.", "25": "En zij zeiden: Gij hebt ons leven behouden; laat ons genade vinden in de ogen mijns heren, en wij zullen Farao’s knechten zijn.", "26": "Jozef dan stelde ditzelve in tot een wet, tot dezen dag, over het land van Egypte, dat Farao het vijfde deel zou hebben; behalve dat alleen het land der priesteren van Farao niet werd.", "27": "Zo woonde Israël in het land van Egypte, in het land Gosen; en zij stelden zich tot bezitters daarin, en zij werden vruchtbaar en vermeerderden zeer.", "28": "En Jakob leefde in het land van Egypte zeventien jaar; zodat de dagen van Jakob, de jaren zijns levens, geweest zijn honderd zeven en veertig jaren.", "29": "Als nu de dagen van Israël naderden, dat hij sterven zou, zo riep hij zijn zoon Jozef, en zeide tot hem: Indien ik nu genade gevonden heb in uw ogen, zo leg toch uw hand onder mijn heup, en doe weldadigheid en trouw aan mij, en begraaf mij toch niet in Egypte;", "30": "Maar dat ik bij mijn vaderen ligge; hierom zult gij mij uit Egypte voeren, en mij in hun graf begraven. En hij zeide: Ik zal doen naar uw woord!", "31": "En hij zeide: Zweer mij! en hij zwoer hem. En Israël boog zich ten hoofde van het bed."}, "KJV": {"1": "Then Joseph came and told Pharaoh, and said, My father and my brethren, and their flocks, and their herds, and all that they have, are come out of the land of Canaan; and, behold, they *are* in the land of Goshen.", "2": "And he took some of his brethren, *even* five men, and presented them unto Pharaoh.", "3": "And Pharaoh said unto his brethren, What *is* your occupation? And they said unto Pharaoh, Thy servants *are* shepherds, both we, *and* also our fathers.", "4": "They said moreover unto Pharaoh, For to sojourn in the land are we come; for thy servants have no pasture for their flocks; for the famine *is* sore in the land of Canaan: now therefore, we pray thee, let thy servants dwell in the land of Goshen.", "5": "And Pharaoh spake unto Joseph, saying, Thy father and thy brethren are come", "6": "The land of Egypt *is* before thee; in the best of the land make thy father and brethren to dwell; in the land of Goshen let them dwell: and if thou knowest *any* men of activity among them, then make them rulers over my cattle.", "7": "And Joseph brought in Jacob his father, and set him before Pharaoh: and Jacob blessed Pharaoh.", "8": "And Pharaoh said unto Jacob, How old", "9": "And Jacob said unto Pharaoh, The days of the years of my pilgrimage *are* an hundred and thirty years: few and evil have the days of the years of my life been, and have not attained unto the days of the years of the life of my fathers in the days of their pilgrimage.", "10": "And Jacob blessed Pharaoh, and went out from before Pharaoh.", "11": "And Joseph placed his father and his brethren, and gave them a possession in the land of Egypt, in the best of the land, in the land of Rameses, as Pharaoh had commanded.", "12": "And Joseph nourished his father, and his brethren, and all his father's household, with bread, according to *their* families.", "13": "And *there was* no bread in all the land; for the famine *was* very sore, so that the land of Egypt and *all* the land of Canaan fainted by reason of the famine.", "14": "And Joseph gathered up all the money that was found in the land of Egypt, and in the land of Canaan, for the corn which they bought: and Joseph brought the money into Pharaoh's house.", "15": "And when money failed in the land of Egypt, and in the land of Canaan, all the Egyptians came unto Joseph, and said, Give us bread: for why should we die in thy presence? for the money faileth.", "16": "And Joseph said, Give your cattle; and I will give you for your cattle, if money fail.", "17": "And they brought their cattle unto Joseph: and Joseph gave them bread *in exchange* for horses, and for the flocks, and for the cattle of the herds, and for the asses: and he fed them with bread for all their cattle for that year.", "18": "When that year was ended, they came unto him the second year, and said unto him, We will not hide *it* from my lord, how that our money is spent; my lord also hath our herds of cattle; there is not ought left in the sight of my lord, but our bodies, and our lands:", "19": "Wherefore shall we die before thine eyes, both we and our land? buy us and our land for bread, and we and our land will be servants unto Pharaoh: and give *us* seed, that we may live, and not die, that the land be not desolate.", "20": "And Joseph bought all the land of Egypt for Pharaoh; for the Egyptians sold every man his field, because the famine prevailed over them: so the land became Pharaoh's.", "21": "And as for the people, he removed them to cities from *one* end of the borders of Egypt even to the *other* end", "22": "Only the land of the priests bought he not; for the priests had a portion *assigned them* of Pharaoh, and did eat their portion which Pharaoh gave them: wherefore they sold not their lands.", "23": "Then Joseph said unto the people, Behold, I have bought you this day and your land for Pharaoh: lo, *here is* seed for you, and ye shall sow the land.", "24": "And it shall come to pass in the increase, that ye shall give the fifth *part* unto Pharaoh, and four parts shall be your own, for seed of the field, and for your food, and for them of your households, and for food for your little ones.", "25": "And they said, Thou hast saved our lives: let us find grace in the sight of my lord, and we will be Pharaoh's servants.", "26": "And Joseph made it a law over the land of Egypt unto this day, *that* Pharaoh should have the fifth *part*; except the land of the priests only, *which* became not Pharaoh's.", "27": "And Israel dwelt in the land of Egypt, in the country of Goshen; and they had possessions therein, and grew, and multiplied exceedingl 47:31", "href": "../../genesis/47/#v31", "ref": "Gen 47:31", "svLabel": null}, {"disp": "Ex 8:3", "href": "../../exodus/8/#v3", "ref": "Ex 8:3", "svLabel": null}], "kinderen": []}]}, {"topic": "Hands, The", "href": "../../torrey/h/#t-hands-the", "kinderen": [{"label": "Placed under the thigh of a person to whom an oath was made", "href": "../../torrey/h/?hl=Gen.47.31#i8161", "refs": [{"disp": "Gen 24:2", "href": "../../genesis/24/#v2", "ref": "Gen 24:2", "svLabel": null}, {"disp": "Gen 24:3", "href": "../../genesis/24/#v3", "ref": "Gen 24:3", "svLabel": null}, {"disp": "Gen 47:29", "href": "../../genesis/47/#v29", "ref": "Gen 47:29", "svLabel": null}, {"disp": "Gen 47:31", "href": "../../genesis/47/#v31", "ref": "Gen 47:31", "svLabel": null}], "kinderen": []}]}]}}, "extern": {"Gen 11:25": "En Nahor leefde, nadat hij Terah verwekt had, honderd en negentien jaar; en hij verwekte zonen en dochters.", "Gen 41:48": "En hij verzamelde al het voedsel van de zeven jaren die in Egypteland waren, en legde het voedsel op in de steden; het voedsel van het veld rondom elke stad, legde hij daarbinnen op.", "1 Kon 10:28": "En de paarden die Salomo had, kwamen uit Egypte; en wat het linnen garen betreft, de kooplieden van de koning namen het linnen garen voor een vaste prijs.", "Jer 32:44": "Velden zal men voor geld kopen, en de brieven ondertekenen en verzegelen, en getuigen doen bevestigen, in het land van Benjamin, en in de plaatsen rondom Jeruzalem, en in de steden van Juda, en in de steden van het gebergte, en in de steden van de laagvlakte, en in de steden van het zuiden; want Ik zal hun gevangenschap ten goede keren, spreekt de HEERE.", "Hand 7:17": "Maar toen de tijd van de belofte naderde, die God aan Abraham gezworen had, werd het volk meer en vermenigvuldigde het zich in Egypte,", "1 Petr 4:10": "Ieder bedient, naar de gave die hij ontvangen heeft, daarmee de anderen, als goede uitdelers van de veelsoortige genade van God.", "Neh 5:2": "Want er waren er die zeiden: Onze zonen en onze dochters, wij zijn met velen; daarom hebben wij koren opgenomen, opdat wij eten en leven.", "Gen 24:2": "Zo zei Abraham tegen zijn knecht, de oudste van zijn huis, die over alles regeerde wat hij had: Leg toch uw hand onder mijn heup,", "Hebr 11:22": "Door het geloof heeft Jozef, stervend, gesproken over het vertrek van de kinderen van Israël, en heeft hij bevel gegeven over zijn gebeente.", "Gen 24:26": "Toen boog die man zijn hoofd, en aanbad de HEERE;", "Gen 47:1-10": "Toen kwam Jozef en vertelde het aan Farao, en zei: Mijn vader en mijn broers, met hun schapen, hun runderen en alles wat zij hebben, zijn gekomen uit het land Kanaän; en zie, zij zijn in het land Gosen. En hij nam een deel van zijn broers, namelijk vijf mannen, en stelde hen voor Farao. Toen zei Farao tegen zijn broers: Wat is uw beroep? En zij zeiden tegen Farao: Uw knechten zijn schaapherders, zowel wij als onze vaders.", "Gen 49:29": "Daarna gaf hij hun een opdracht, en zei tegen hen: Ik word verzameld tot mijn volk: begraaf mij bij mijn vaders, in de spelonk die is in de akker van Efron, de Hethiet;", "Num 3:48-51": "En u zult dat geld aan Aäron en zijn zonen geven, het geld van de gelosten die onder hen overschieten. Toen nam Mozes dat losgeld van degenen, die overschoten boven de gelosten door de Levieten. Van de eerstgeborenen van de kinderen van Israël nam hij dat geld, duizend driehonderdvijfenzestig sikkels, naar de sikkel van het heiligdom.", "Joh 14:23": "Jezus antwoordde en zei tegen hem: Als iemand Mij liefheeft, zal hij Mijn woord bewaren; en Mijn Vader zal hem liefhebben, en Wij zullen naar hem toe komen, en woning bij hem maken.", "Ps 39:5-7": "HEERE, maak mij mijn einde bekend, en welke de mate van mijn dagen is; dat ik weet, hoe vergankelijk ik ben. Zie, U hebt mijn dagen een handbreed lang gemaakt, en mijn levensduur is als niets voor U; zeker, ieder mens, hoe vast hij ook staat, is enkel ijdelheid. Sela. Zeker, de mens wandelt als in een beeld, zeker, zij maken zich druk voor niets; men brengt bijeen, en men weet niet, wie het naar zich toe zal halen.", "Ps 148:12": "Jongemannen en ook meisjes; oude mensen met de jongeren!", "Ps 90:12": "Leer ons zo onze dagen tellen, dat wij een wijs hart bekomen.", "Fil 3:8": "Ja, zeker, ik beschouw ook alle dingen als schade vanwege de uitnemendheid van de kennis van Christus Jezus, mijn Heere; om Wiens wil ik al die dingen als schade heb gerekend, en ze beschouw als vuil, opdat ik Christus mag winnen,", "Hebr 9:27": "En zoals het de mensen beschikt is eenmaal te sterven, en daarna het oordeel;", "Ex 21:11": "En als hij haar deze drie dingen niet doet, zal zij om niet uitgaan, zonder geld.", "Ps 71:9": "Verwerp mij niet in de tijd van het ouderdom; verlaat mij niet, terwijl mijn kracht vergaat.", "Mark 14:11": "En zij, die dit hoorden, waren verblijd, en beloofden hem geld te geven; en hij zocht hoe hij Hem op een geschikt moment kon overleveren.", "Job 12:12": "In de stokoude is de wijsheid, en in de lengte van de dagen het verstand.", "Ps 92:15": "In de grijze ouderdom zullen zij nog vruchten dragen; zij zullen vet en groen zijn,", "Lev 27:15": "En als hij die het geheiligd heeft, zijn huis wil afkopen, dan zal hij een vijfde deel van het geld van uw schatting daarboven toevoegen, en het zal zijn eigendom zijn.", "Luk 19:23": "Waarom hebt u dan mijn geld niet bij de bank gebracht, zodat ik het bij mijn komst met rente had kunnen opeisen?", "Job 13:25": "Zult U een heen en weer gedreven blad verbrijzelen, en zult U een droge stoppel vervolgen?", "2 Sam 21:1": "Er was in de dagen van David een hongersnood, drie jaren lang, jaar na jaar; en David zocht het aangezicht van de HEERE. En de HEERE zei: Het is om Saul en om zijn bloedhuis, omdat hij de Gibeonieten gedood heeft.", "Matt 24:45": "Wie is dan de trouwe en verstandige dienstknecht, aan wie zijn heer het gezag over zijn huisbedienden gegeven heeft, om hun op de juiste tijd voedsel te geven?", "Deut 14:25": "Zo maak het tot geld, en bind het geld in uw hand, en ga naar de plaats die de HEERE, uw God, zal uitkiezen;", "Spr 16:31": "Grijs haar is een sierlijke kroon; zij wordt gevonden op de weg van de gerechtigheid.", "Spr 12:17": "Wie waarheid voortbrengt, maakt gerechtigheid bekend; maar een getuige van leugens maakt bedrog bekend.", "1 Kon 11:17": "Toen vluchtte Hadad, hij en enkele Edomitische mannen uit de dienaren van zijn vader met hem, om naar Egypte te gaan; Hadad was toen nog een kleine jongen.", "Ps 90:6": "In de morgenstond bloeit het, en het verandert; 's avonds wordt het afgesneden, en het verdort.", "Job 10:21": "Voordat ik heenga (en niet terugkom) naar een land van duisternis en van de schaduw van de dood;", "Gen 47:18-26": "Toen dat jaar voorbij was, kwamen zij in het tweede jaar bij hem en zeiden tegen hem: Wij zullen het voor mijn heer niet verbergen: het geld is op, en de bezitting van het vee is bij mijn heer gekomen; er is voor het aangezicht van mijn heer niets anders overgebleven dan ons lichaam en ons land. Waarom zouden wij voor uw ogen sterven, zowel wij als ons land? Koop ons en ons land voor brood, dan zullen wij en ons land Farao dienstbaar zijn; en geef ons zaad, opdat wij leven en niet sterven, en het land niet woest wordt! Zo kocht Jozef het hele land van Egypte voor Farao; want de Egyptenaren verkochten ieder zijn akker, omdat de honger sterk op hen drukte; zo werd het land eigendom van Farao.", "Ps 71:18": "Daarom ook, terwijl het ouderdom en de grijsheid daar zijn, verlaat mij niet, o God, totdat ik aan dit geslacht Uw arm verkondig, aan alle nakomelingen Uw macht.", "Gen 48:1": "Het gebeurde nu na deze dingen, dat men Jozef vertelde: Zie, uw vader is ziek! Toen nam hij zijn twee zonen met zich, Manasse en Efraïm.", "Jes 51:12": "Ik, Ik ben het, Die u troost; wie bent u, dat u vreest voor de mens, die sterven zal? En voor het kind van een mens, dat hooi worden zal?", "Jes 55:1": "O, alle dorstigen, kom tot de wateren, en u die geen geld heeft, kom, koop en eet, ja kom, koop zonder geld en zonder prijs, wijn en melk!", "1 Sam 21:3": "En nu, wat is er onder uw hand? Geef mij vijf broden in mijn hand, of wat er te vinden is.", "Gen 26:4": "En Ik zal uw nageslacht vermenigvuldigen als de sterren van de hemel, en zal aan uw nageslacht al deze landen geven; en in uw nageslacht zullen alle volken van de aarde gezegend worden,", "Gen 50:20": "U wel, u hebt kwaad tegen mij gedacht; doch God heeft dat ten goede gedacht; opdat Hij deed, zoals het op deze dag is, om een groot volk in het leven te behouden.", "Job 9:26": "Zij zijn voorbijgevaren met jachtschepen; zoals een arend naar het aas toevliegt.", "Joh 10:10": "De dief komt niet dan om te stelen, en te slachten, en te verderven; Ik ben gekomen, opdat zij het leven hebben, en overvloed hebben.", "1 Kon 2:1": "Toen de dagen van David naderden dat hij zou sterven, gaf hij zijn zoon Salomo deze opdracht en zei:", "Klaagl 5:6": "Wij hebben de Egyptenaar de hand gegeven, en de Assyriër, om met brood verzadigd te worden.", "Ezra 7:17": "opdat u spoedig voor dat geld runderen, rammen, lammeren koopt, met hun spijsoffers, en hun drankoffers, en die offert op het altaar van het huis van uw God, dat te Jeruzalem is.", "Fil 4:8": "Verder, broeders, alles wat waar is, alles wat eerbaar is, alles wat rechtvaardig is, alles wat rein is, alles wat lieflijk is, alles wat goed klinkt, als er enige deugd is, en als er enige lof is, denk daaraan;", "Hand 8:20": "Maar Petrus zei tegen hem: Laat uw geld met u verloren gaan, omdat u gemeend hebt dat de gave van God door geld verkregen wordt!", "Filem 1:1": "Paulus, een gevangene van Christus Jezus, en Timotheüs, de broeder, aan Filemon, de geliefde, en onze medearbeider,", "Gen 8:7": "En hij liet een raaf uitvliegen, die dikwijls heen en weer ging, totdat de wateren van boven de aarde verdroogd waren.", "Gen 24:49": "Nu dan, als u weldadigheid en trouw aan mijn heer wilt bewijzen, vertel het mij; en zo niet, vertel het mij ook, zodat ik mij naar rechts of naar links kan wenden.", "Gen 47:14-18": "Toen verzamelde Jozef al het geld dat in Egypteland en in het land Kanaän gevonden werd, voor het koren dat zij kochten; en Jozef bracht dat geld in het huis van Farao. Toen het geld uit Egypteland en uit het land Kanaän op was, kwamen alle Egyptenaren naar Jozef en zeiden: Geef ons brood; want waarom zouden wij in uw bijzijn sterven? Want het geld is op. En Jozef zei: Geef uw vee, dan zal ik u brood geven voor uw vee, als het geld op is.", "1 Kon 21:2": "Achab sprak tot Naboth en zei: Geef mij uw wijngaard, opdat hij mij tot een kruidhof zij, omdat hij dicht bij mijn huis is; en ik zal u ervoor een wijngaard geven die beter is dan die; of, als het goed is in uw ogen, zal ik u de waarde ervan in geld geven.", "Luk 2:37": "En zij was een weduwe van ongeveer vierentachtig jaar, die niet week uit de tempel, maar God diende met vasten en bidden, nacht en dag.", "Job 13:28": "En hij vergaat als een verrotting, als een kleed dat de mot opeet.", "Ex 12:38": "En veel vermengd volk trok ook met hen op, en schapen, en runderen, heel veel vee.", "Luk 22:19": "En Hij nam brood, en toen Hij gedankt had, brak Hij het en gaf het hun, en zei: Dat is Mijn lichaam, dat voor u gegeven wordt; doe dat tot Mijn gedachtenis.", "1 Petr 1:24": "Want alle vlees is als gras, en alle heerlijkheid van de mens is als een bloem van het gras. Het gras verdort, en zijn bloem valt af;", "Matt 28:15": "En zij namen het geld, en deden zoals hun geleerd was. En dit verhaal is onder de Joden verspreid geraakt tot op deze huidige dag.", "Hebr 11:21": "Door het geloof heeft Jakob, stervend, ieder van de zonen van Jozef gezegend, en heeft hij aangebeden, leunend op het uiteinde van zijn staf.", "Ex 22:7": "Wanneer iemand aan zijn naaste geld of voorwerpen geeft om te bewaren, en het wordt uit het huis van die man gestolen, en de dief wordt gevonden, dan moet hij het dubbel teruggeven.", "Gen 45:9-11": "Haast u en trek op naar mijn vader, en zeg het hem: Zo zegt uw zoon Jozef: God heeft mij tot een heer over heel Egypte gesteld; kom af naar mij, en wacht niet. En u zult in het land Gosen wonen, en dicht bij mij zijn, u en uw zonen, en de zonen van uw zonen, en uw schapen, en uw runderen, en alles wat u hebt. En ik zal u daar onderhouden; want er zullen nog vijf jaren van de honger zijn, opdat u niet verarmt, u en uw huis, en alles wat u hebt!", "Spr 27:1": "Beroem u niet over de dag van morgen; want u weet niet, wat de dag zal baren.", "Gen 45:9-13": "Haast u en trek op naar mijn vader, en zeg het hem: Zo zegt uw zoon Jozef: God heeft mij tot een heer over heel Egypte gesteld; kom af naar mij, en wacht niet. En u zult in het land Gosen wonen, en dicht bij mij zijn, u en uw zonen, en de zonen van uw zonen, en uw schapen, en uw runderen, en alles wat u hebt. En ik zal u daar onderhouden; want er zullen nog vijf jaren van de honger zijn, opdat u niet verarmt, u en uw huis, en alles wat u hebt!", "Richt 5:19": "De koningen kwamen, zij streden; toen streden de koningen van Kanaän, te Thaanach aan het water van Megiddo; zij brachten geen winst van het zilver daarvan.", "2 Kon 4:29": "En hij zei tegen Gehazi: Gord uw lendenen, en neem mijn staf in uw hand, en ga heen; als u iemand tegenkomt, groet hem niet; en als iemand u groet, antwoord hem niet; en leg mijn staf op het gezicht van de jongen.", "1 Sam 20:3": "Toen zwoer David verder, en zei: Uw vader weet heel goed dat ik genade in uw ogen gevonden heb; daarom heeft hij gezegd: Dat Jonathan dit niet weet, opdat hij zich niet bekommert; en zeker, zo waarachtig als de HEERE leeft, en uw ziel leeft, er is maar als een schrede tussen mij en de dood!", "Hand 7:11": "En er kwam een hongersnood over het hele land van Egypte en Kanaän, en grote nood; en onze vaders vonden geen voedsel.", "Gen 41:31": "Ook zal de overvloed in het land niet gemerkt worden, vanwege die honger die daarna zal komen; want hij zal zeer zwaar zijn.", "Jak 1:11": "Want de zon is opgegaan met hitte, en heeft het gras dor gemaakt, en zijn bloem is afgevallen, en de mooie vorm van zijn aanzien is vergaan; zo zal ook de rijke in zijn wegen verwelken.", "Hand 7:16": "En zij werden overgebracht naar Sichem, en gelegd in het graf, dat Abraham gekocht had voor een som geld, van de zonen van Hemor, de vader van Sichem.", "Gen 47:7-12": "En Jozef bracht zijn vader Jakob binnen en stelde hem voor Farao; en Jakob zegende Farao. En Farao zei tegen Jakob: Hoeveel jaren telt u al? En Jakob zei tegen Farao: De jaren van mijn vreemdelingschap zijn honderddertig jaar; weinig en zwaar zijn de jaren van mijn leven geweest, en zij hebben niet gehaald bij de jaren van het leven van mijn vaderen, in de dagen van hun vreemdelingschap.", "Gen 47:7-10": "En Jozef bracht zijn vader Jakob binnen en stelde hem voor Farao; en Jakob zegende Farao. En Farao zei tegen Jakob: Hoeveel jaren telt u al? En Jakob zei tegen Farao: De jaren van mijn vreemdelingschap zijn honderddertig jaar; weinig en zwaar zijn de jaren van mijn leven geweest, en zij hebben niet gehaald bij de jaren van het leven van mijn vaderen, in de dagen van hun vreemdelingschap.", "Joh 10:28": "En Ik geef hun het eeuwige leven; en zij zullen niet verloren gaan in eeuwigheid, en niemand zal ze uit Mijn hand rukken.", "Gen 20:15": "En Abimelech zei: Zie, mijn land ligt voor u open; woon waar het goed is in uw ogen.", "Gen 46:34": "Dan moet u zeggen: Uw knechten zijn mannen die van onze jeugd af tot nu toe met vee omgegaan hebben, zowel wij als onze vaders; opdat u in het land Gosen mag wonen; want elke schaapherder is voor de Egyptenaren een gruwel.", "Gen 47:1-12": "Toen kwam Jozef en vertelde het aan Farao, en zei: Mijn vader en mijn broers, met hun schapen, hun runderen en alles wat zij hebben, zijn gekomen uit het land Kanaän; en zie, zij zijn in het land Gosen. En hij nam een deel van zijn broers, namelijk vijf mannen, en stelde hen voor Farao. Toen zei Farao tegen zijn broers: Wat is uw beroep? En zij zeiden tegen Farao: Uw knechten zijn schaapherders, zowel wij als onze vaders.", "2 Kor 4:14": "Wetend dat Hij, Die de Heere Jezus opgewekt heeft, ook ons door Jezus zal opwekken, en met u daar zal stellen.", "1 Kon 21:6": "En hij zei tegen haar: Omdat ik tot Naboth, de Jizreëliet, gesproken heb en tegen hem gezegd heb: Geef mij uw wijngaard voor geld, of, als het u zint, zal ik u een andere wijngaard in zijn plaats geven; maar hij heeft gezegd: Ik zal u mijn wijngaard niet geven.", "Gen 47:4-10": "Verder zeiden zij tegen Farao: Wij zijn gekomen om als vreemdelingen in dit land te wonen; want er is geen weide voor de schapen die uw knechten hebben, omdat de honger zwaar is in het land Kanaän; en laat nu toch uw knechten in het land Gosen wonen! Toen sprak Farao tegen Jozef en zei: Uw vader en uw broers zijn tot u gekomen; Egypteland ligt voor u; laat uw vader en uw broers wonen in het beste deel van het land; laat hen in het land Gosen wonen. En als u weet dat er onder hen bekwame mannen zijn, zet hen dan aan als veemeesters over wat ik heb.", "Luk 16:1": "En Hij zei ook tegen Zijn discipelen: Er was een zeker rijk mens, die een rentmeester had; en deze werd bij hem beschuldigd, dat hij zijn goederen verkwistte.", "Gen 50:26": "En Jozef stierf, honderdtien jaar oud zijnde; en zij balsemden hem, en men legde hem in een kist in Egypte.", "Ex 1:11": "En zij stelden leiders van dwangarbeid over hen aan, om hen te onderdrukken met hun lasten; want men bouwde voor Farao voorraadsteden, Pitom en Raamses.", "Matt 25:18": "Maar hij die het ene ontvangen had, ging weg en groef in de aarde, en verborg het geld van zijn heer.", "Gen 8:9": "Maar de duif vond geen rust voor de holte van haar voet; zo keerde zij terug naar hem in de ark; want de wateren waren over de gehele aarde; en hij stak zijn hand uit, en nam haar, en bracht haar tot zich in de ark.", "Gen 28:14": "En uw nageslacht zal zijn als het stof van de aarde, en u zult uitbreiden in menigte, westwaarts en oostwaarts, en noordwaarts en zuidwaarts; en in u, en in uw nageslacht zullen alle geslachten van de aardbodem gezegend worden.", "1 Sam 2:20": "En Eli zegende Elkana en zijn vrouw, en zei: De HEERE geeft u nageslacht uit deze vrouw, voor de bede die zij aan de HEERE heeft afgebeden. En zij gingen naar hun eigen plaats.", "Dan 6:6-8": "Toen zeiden die mannen: Wij zullen tegen deze Daniël geen gelegenheid vinden, tenzij wij iets tegen hem vinden in de wet van zijn God. Zo kwamen deze vorsten en de stadhouders met elkaar bijeen bij de koning, en zeiden zo tegen hem: O koning Darius, leef voor eeuwig! Alle vorsten van het rijk, de overheden en stadhouders, de raadsheren en landvoogden hebben samen overlegd om een koninklijke verordening in te stellen, en een streng gebod te maken, dat ieder die in dertig dagen een verzoek doet aan enige god of mens, behalve aan u, o koning, in de kuil van de leeuwen geworpen zal worden.", "Pred 6:6": "Ja, al leefde hij wel tweemaal duizend jaren, en zag hij het goede niet; gaan zij niet allen naar één plaats?", "Gen 11:24": "En Nahor leefde negenentwintig jaar, en verwekte Terah.", "Matt 28:12": "En zij kwamen samen met de oudsten, en namen samen een besluit, en gaven de soldaten veel geld,", "Ex 12:44": "Doch elke knecht van iemand, die voor geld gekocht is, nadat u hem besneden zult hebben, dan mag hij daarvan eten.", "Ps 90:9": "Want al onze dagen gaan henen door Uw verbolgenheid; wij brengen onze jaren door als een gedachte.", "Deut 26:5": "Dan zult u voor het aangezicht van de HEERE, uw God, betuigen en zeggen: Mijn vader was een omzwervende Syriër, en hij trok af naar Egypte, en verbleef daar als vreemdeling met weinig mensen; maar hij werd daar tot een groot, machtig en talrijk volk.", "Lev 27:18": "Maar als hij zijn akker na het jubeljaar geheiligd heeft, dan zal de priester hem het geld berekenen naar de jaren die nog overblijven tot het jubeljaar, en het zal van uw schatting afgetrokken worden.", "1 Kron 29:15": "Want wij zijn vreemdelingen en bijwoners voor Uw aangezicht, zoals al onze vaders; onze dagen op aarde zijn als een schaduw, en er is geen verwachting.", "Gen 41:30": "Maar daarna zullen er zeven jaren van honger opstaan; dan zal in het land van Egypte al die overvloed vergeten worden; en de honger zal het land verteren.", "Jes 64:6": "Doch wij allen zijn als een onreine, en al onze gerechtigheden zijn als een wegwerpkleed; en wij allen vallen af als een blad, en onze misdaden voeren ons weg als een wind.", "Gen 31:15": "Worden wij niet door hem als vreemden beschouwd? Want hij heeft ons verkocht, en hij heeft ook steeds ons geld verteerd.", "Jes 40:24": "Ja, zij worden niet geplant, ja, zij worden niet gezaaid, ja, hun afgehouwen stam wortelt niet in de aarde; ook als Hij op hen waait, zullen zij verdorren, en een stormwind zal hen als een stoppel wegnemen.", "Ex 1:7-20": "werden de kinderen van Israël vruchtbaar en namen ze sterk in aantal toe, en zij vermeerderden, en werden buitengewoon machtig, zodat het land met hen vervuld werd. Daarna kwam er een nieuwe koning over Egypte aan de macht, die Jozef niet gekend had; die tegen zijn volk zei: Zie, het volk van de kinderen van Israël is talrijk, ja, machtiger dan wij.", "Amos 7:15": "Maar de HEERE nam mij van achter de kudde vandaan; en de HEERE zei tegen mij: Ga heen, profeteer tegen Mijn volk Israël.", "Lev 22:11": "Maar wanneer de priester een mens met zijn geld gekocht zal hebben, die zal daarvan eten; en wie in zijn huis geboren is, die zullen van zijn voedsel eten.", "Jes 46:4": "En tot de ouderdom toe zal Ik Dezelfde zijn, ja, tot de grijsheid toe zal Ik u dragen; Ik heb het gedaan, en Ik zal u opnemen, en Ik zal dragen en redden.", "Job 4:19-21": "Hoeveel te meer dan hen die in lemen huizen wonen, waarvan de grondslag in het stof is? Zij worden verbrijzeld voor de mot. Van de morgen tot de avond worden zij vermorzeld; zonder dat men er acht op slaat, vergaan zij voor eeuwig. Verdwijnt hun uitnemendheid niet met hen? Zij sterven, maar niet in wijsheid.", "Job 10:9": "Denk er toch aan, dat U mij als leem gevormd hebt, en mij tot stof zult doen terugkeren.", "Ps 78:39": "En Hij dacht eraan, dat zij vlees waren, een wind, die heengaat en niet terugkeert.", "Num 33:5": "Toen de kinderen van Israël van Rameses vertrokken waren, legerden zij zich te Sukkoth.", "Jes 52:3": "Want zo zegt de HEERE: U bent voor niets verkocht, u zult ook zonder geld vrijgekocht worden.", "Ps 103:14-16": "Want Hij weet wat voor maaksel wij zijn, en Hij denkt eraan dat wij stof zijn. De dagen van de mens zijn als het gras, zoals een bloem van het veld, zo bloeit hij. Als de wind daarover gegaan is, is hij er niet meer, en zijn plaats kent hem niet meer.", "Ps 144:4": "De mens lijkt op een ademtocht; zijn dagen zijn als een voorbijgaande schaduw.", "Gen 46:3": "En Hij zei: Ik ben die God, de God van uw vader; wees niet bang om af te trekken naar Egypte; want Ik zal u daar tot een groot volk maken.", "Ps 105:23": "Daarna kwam Israël in Egypte, en Jakob verkeerde als vreemdeling in het land van Cham.", "2 Kon 22:9": "Daarna kwam Safan, de schrijver, bij de koning, en bracht de koning verslag terug, en hij zei: Uw dienaren hebben het geld dat in het huis gevonden was bij elkaar gebracht, en hebben het gegeven in de hand van de opzichters van het werk, die aangesteld waren over het huis van de HEERE.", "Kol 1:28": "Hem verkondigen wij, terwijl wij ieder mens vermanen en ieder mens onderwijzen in alle wijsheid, opdat wij ieder mens volmaakt zouden stellen in Christus Jezus;", "Ps 119:19": "Ik ben een vreemdeling op de aarde, verberg Uw geboden voor mij niet.", "Gen 17:13": "Degene die in uw huis geboren is, en degene die met uw geld gekocht is, zal zeker besneden worden; en Mijn verbond zal in uw vlees zijn, tot een eeuwig verbond.", "Jes 33:16": "Die zal in de hoogten wonen, de sterkten van de steenrotsen zullen zijn hoge schuilplaats zijn; zijn brood wordt hem gegeven, zijn water is gewis.", "1 Kron 29:28": "En hij stierf op hoge leeftijd, verzadigd van dagen, rijkdom en eer; en zijn zoon Salomo regeerde in zijn plaats.", "1 Kon 18:5": "En Achab had tegen Obadja gezegd: Trek door het land, naar alle waterfonteinen en naar alle rivieren; misschien vinden wij gras, zodat wij de paarden en de muilezels in leven houden, en niets van het vee hoeven uit te roeien.", "Matt 15:4-6": "Want God heeft geboden en gezegd: Eer uw vader en moeder, en: Wie vader of moeder vervloekt, die zal de dood sterven. Maar u zegt: Wie tegen vader of moeder zal zeggen: Het is een gave, wat u ook van mij zou kunnen ten nutte komen; en zijn vader of zijn moeder geenszins zal eren, die voldoet. En u hebt zo het gebod van God krachteloos gemaakt door uw overlevering.", "Gen 45:16-20": "Toen dit gerucht in het huis van Farao gehoord werd, dat men zei: Jozefs broers zijn gekomen! was het goed in de ogen van Farao, en in de ogen van zijn dienaren. En Farao zei tegen Jozef: Zeg tegen uw broers: Doe dit, laad uw dieren, en trek heen, ga naar het land Kanaän; En neem uw vader en uw huisgezinnen, en kom naar mij, en ik zal u het beste van Egypteland geven, en u zult het vette van dit land eten.", "2 Tess 3:10": "Want ook toen wij bij u waren, hebben wij u dit bevolen: dat als iemand niet wil werken, hij ook niet moet eten.", "2 Sam 19:37": "Laat uw knecht toch terugkeren, zodat ik sterf in mijn eigen stad, bij het graf van mijn vader en mijn moeder; maar zie, daar is uw knecht Chimham, laat hem met mijn heer de koning meetrekken, en doe met hem wat goed is in uw ogen.", "Ps 39:13": "Hoor, HEERE, mijn gebed, en neem mijn geroep ter ore; zwijg niet bij mijn tranen; want ik ben een vreemdeling bij U, een bijwoner, zoals al mijn vaders.", "Gen 37:2": "Dit zijn Jakobs geschiedenissen. Jozef, een zoon van zeventien jaren, weidde de kudde met zijn broeders (en hij was een jongeling), met de zonen van Bilha en de zonen van Zilpa, de vrouwen van zijn vader; en Jozef bracht hun kwaad gerucht over aan hun vader.", "Jer 14:1-6": "Het woord van de HEERE, dat tot Jeremia gekomen is, over de zaken van de grote droogte. Juda treurt en haar poorten zijn verzwakt; zij zijn in het zwart gekleed tot op de grond, en Jeruzalems geschrei klimt op. En hun voortreffelijken zenden hun kleinen naar water; zij komen bij de putten, zij vinden geen water, zij komen met hun vaten leeg terug; zij zijn beschaamd, ja, worden schaamrood, en bedekken hun hoofd.", "Ex 12:32": "Neemt ook met u uw schapen en uw runderen, zoals u gesproken hebt, en gaat heen, en zegent mij ook.", "Ps 33:19": "Om hun ziel van de dood te redden, en om hen bij het leven te houden in de honger.", "Pred 6:12": "Want wie weet wat goed is voor de mens in dit leven, gedurende het aantal dagen van het leven van zijn ijdelheid, dat hij doorbrengt als een schaduw? Want wie kan de mens aanzeggen wat na hem wezen zal onder de zon?", "Ezech 48:10": "En daarin zal het heilig hefoffer zijn voor de priesters, noordwaarts de lengte van vijfentwintigduizend, en westwaarts de breedte van tienduizend, en oostwaarts de breedte van tienduizend, en zuidwaarts de lengte van vijfentwintigduizend; en het heiligdom van de HEERE zal in het midden daarvan zijn.", "Gen 46:28-34": "En hij stuurde Juda voor zich uit naar Jozef, om voor hem uit de weg te wijzen naar Gosen; en zij kwamen in het land Gosen. Toen spande Jozef zijn wagen aan, en trok op, zijn vader Israël tegemoet naar Gosen; en toen hij zich aan hem vertoonde, viel hij hem om zijn hals, en huilde lang aan zijn hals. En Israël zei tegen Jozef: Laat mij nu sterven, nadat ik uw gezicht gezien heb, omdat u nog leeft!", "Hebr 13:14": "Want wij hebben hier geen blijvende stad, maar wij zoeken de toekomstige.", "Gen 5:27": "Zo waren al de dagen van Methusalach negenhonderdnegenenzestig jaren; en hij stierf.", "Jak 1:10": "En de rijke in zijn vernedering; want hij zal als een bloem van het gras voorbijgaan.", "Gen 28:7": "en dat Jakob zijn vader en zijn moeder gehoorzaam geweest was, en naar Paddan-aram getrokken was;", "Gen 41:56": "Toen er honger was over heel het land, opende Jozef alles waarin iets was, en verkocht aan de Egyptenaren; want de honger werd sterk in Egypteland.", "Matt 6:24": "Niemand kan twee heren dienen; want of hij zal de één haten en de ander liefhebben, of hij zal de één aanhangen en de ander verachten. U kunt niet God dienen en de Mammon.", "Richt 8:5": "En hij zei tegen de mannen van Sukkoth: Geef toch enige broden aan het volk dat mij volgt, want zij zijn moe; en ik jaag Zebah en Tsalmuna, de koningen van de Midianieten, achterna.", "Job 7:6-10": "Mijn dagen zijn lichter geweest dan een weversspoel, en zijn vergaan zonder verwachting. Bedenk, dat mijn leven een wind is; mijn oog zal niet terugkomen, om het goede te zien. Het oog van hem die mij nu ziet, zal mij niet zien; uw ogen zullen op mij zijn; maar ik zal niet meer zijn.", "Jes 2:22": "Laat u dan af van de mens, wiens adem in zijn neus is, want waarin is hij te achten?", "Hand 7:15": "En Jakob ging naar Egypte, en stierf, hijzelf en onze vaders.", "Gen 33:15": "En Ezau zei: Laat mij toch een deel van dit volk dat bij mij is, bij u achterlaten. En hij zei: Waarom zou dat nodig zijn? Laat mij genade vinden in de ogen van mijn heer!", "2 Kron 26:10": "Hij bouwde ook torens in de woestijn, en hakte veel putten uit, omdat hij veel vee had, zowel in de laagten als in de effent velden; akkerlieden en wijngaardeniers op de bergen en op de vruchtbare velden; want hij was een liefhebber van het bewerken van het land.", "Spr 11:26": "Wie koren inhoudt, hem vervloekt het volk; maar zegening zal zijn over het hoofd van de verkoper.", "Ps 144:3": "O HEERE, wat is de mens, dat U hem kent, het kind van de mens, dat U op hem let?", "Num 6:23": "Spreek tot Aäron en zijn zonen en zeg: Zo zult u de kinderen van Israël zegenen, door tot hen te zeggen:", "Luk 22:5": "En zij waren blij, en zijn het eens geworden dat zij hem geld zouden geven.", "Micha 3:11": "Haar hoofden rechtspreken om geschenken, en haar priesters leren om loon, en haar profeten waarzeggen om geld; nog steunen zij op de HEERE, en zeggen: Is de HEERE niet in ons midden? Ons zal geen kwaad overkomen.", "Deut 10:22": "Uw vaderen trokken met zeventig zielen af naar Egypte; en nu heeft de HEERE, uw God, u gesteld als de sterren van de hemel in menigte.", "2 Kon 23:35": "En Jojakim gaf dat zilver en dat goud aan Farao; doch hij belastte het land, om dat geld naar het bevel van Farao te geven; ieder naar zijn aanslag eiste hij het zilver en goud af van het volk van het land, om aan Farao Necho te geven.", "Gen 4:2": "En zij baarde verder zijn broeder Abel; en Abel werd een schaapherder, en Kaïn werd een landbouwer.", "2 Kron 34:9": "En zij kwamen bij Hilkia, de hogepriester, en zij gaven hem het geld dat naar het huis van God gebracht was, dat de Levieten die de drempel bewaakten, verzameld hadden uit de hand van Manasse en Efraïm, en uit heel het overblijfsel van Israël, en uit heel Juda en Benjamin, en waarmee zij naar Jeruzalem waren teruggekomen.", "Matt 2:13": "Toen zij vertrokken waren, zie, de engel van de Heere verschijnt aan Jozef in de droom en zegt: Sta op, neem het Kindje en Zijn moeder tot u, en vlucht naar Egypte, en blijf daar totdat ik het u zeg; want Herodes zal het Kindje zoeken om Het te doden.", "Ps 37:19": "Zij zullen niet beschaamd worden in de kwade tijd, en in de dagen van het honger zullen zij verzadigd worden.", "Neh 13:10": "Ook vernam ik dat het deel van de Levieten hun niet gegeven was; zodat de Levieten en de zangers, die het werk deden, gevlucht waren, ieder naar zijn akker.", "Spr 11:27": "Wie het goede vroeg nazoekt, zoekt welgevalligheid; maar wie het kwade natracht, hem zal het overkomen.", "Gen 45:10": "En u zult in het land Gosen wonen, en dicht bij mij zijn, u en uw zonen, en de zonen van uw zonen, en uw schapen, en uw runderen, en alles wat u hebt.", "Gen 37:28": "Toen nu de Midianitische kooplieden voorbijtrokken, trokken en hesen zij Jozef op uit de kuil, en verkochten Jozef aan deze Ismaëlieten voor twintig zilverstukken; die brachten Jozef naar Egypte.", "Joz 24:29": "En het gebeurde na deze dingen, dat Jozua, de zoon van Nun, de knecht van de HEERE, stierf, honderdtien jaar oud.", "1 Petr 2:17": "Eer ieder; heb de broederschap lief; vrees God; eer de koning.", "Ps 22:30": "Alle vetten op aarde zullen eten, en aanbidden; allen die in het stof neerdalen, zullen voor Zijn aangezicht neerbukken; en die zijn ziel bij het leven niet kan houden.", "Gen 48:12": "Toen liet Jozef hen van zijn knieën vandaan gaan; en hij boog zich met zijn gezicht neer tot de aarde.", "Pred 11:6": "Zaai uw zaad in de morgenstond, en trek uw hand 's avonds niet terug; want u weet niet wat goed uit zal komen, of dit of dat, of dat die beide samen goed zullen zijn.", "Gen 18:27": "En Abraham antwoordde en zei: Zie toch, ik heb het aangedurfd te spreken tot de Heere, hoewel ik stof en as ben!", "Ps 39:12": "Kastijdt U iemand met straffen om de ongerechtigheid, dan doet U zijn schoonheid wegteren als door een mot; zeker, ieder mens is ijdelheid. Sela.", "Matt 6:11": "Geef ons heden ons dagelijks brood.", "Ex 1:12": "Maar hoe meer zij hen onderdrukten, hoe meer het vermeerderde, en hoe meer het uitbreidde; zodat zij verontrust waren vanwege de kinderen van Israël.", "Matt 2:12": "En omdat zij door God in een droom gewaarschuwd waren dat zij niet naar Herodes zouden terugkeren, vertrokken zij via een andere weg naar hun land.", "Ex 7:7": "En Mozes was tachtig jaar oud, en Aäron was drieëntachtig jaar oud, toen zij tegen Farao spraken.", "Gen 43:1": "De honger werd zwaar in dat land;", "Job 8:9": "Want wij zijn van gisteren en weten niets, omdat onze dagen op de aarde een schaduw zijn.", "Klaagl 2:19": "Koph. Maak u op, maak geschrei 's nachts, in het begin van de nachtwaken, stort uw hart uit voor het aangezicht van de Heere als water; hef uw handen tot Hem op voor de ziel van uw kinderen, die in onmacht gevallen zijn van honger, vooraan op alle straten.", "1 Kon 11:40": "Daarom zocht Salomo Jerobeam te doden; maar Jerobeam maakte zich op en vluchtte naar Egypte, naar Sisak, de koning van Egypte, en was in Egypte totdat Salomo stierf.", "Hand 7:6": "En God sprak zo, dat zijn nageslacht als vreemdeling zou wonen in een vreemd land, en dat men hen tot slaaf zou maken en slecht behandelen, vierhonderd jaar.", "Ps 119:54": "Uw inzettingen zijn mij gezangen geweest, ter plaatse van mijn vreemdelingschap.", "Klaagl 5:4": "Ons water moeten wij voor geld drinken; ons hout komt ons op prijs te staan.", "Ruth 1:1": "In de dagen dat de rechters rechtspraken, gebeurde het dat er honger in het land was; daarom trok een man van Bethlehem-juda weg om als vreemdeling te wonen in de velden van Moab, hij, en zijn vrouw, en zijn twee zonen.", "Joh 14:2": "In het huis van Mijn Vader zijn veel woningen; anders zou Ik het u gezegd hebben. Ik ga heen om u plaats te bereiden.", "Job 32:4-9": "Doch Elihu had gewacht op Job in het spreken, omdat zij ouder van dagen waren dan hij. Toen Elihu dan zag dat er geen antwoord was in de mond van die drie mannen, ontstak zijn toorn. Hierom antwoordde Elihu, de zoon van Baracheël, de Buziet, en zei: Ik ben jong van dagen, maar u bent stokoude; daarom heb ik geschroomd en gevreesd, u mijn mening te tonen.", "Gen 41:27": "En die zeven schrale en lelijke koeien, die daarna opkwamen, zijn zeven jaren; en die zeven lege, door de oostenwind verzengde aren zullen zeven jaren van honger zijn.", "2 Kon 25:26": "Toen maakte heel het volk zich op, van de minste tot de grootste, en de aanvoerders van de legers, en zij kwamen in Egypte; want zij waren bang voor de Chaldeeën.", "Jes 31:1": "Wee hun die naar Egypte om hulp aftrekken, en steunen op paarden, en vertrouwen op wagens, omdat er veel zijn, en op ruiters, omdat die zeer machtig zijn; en niet zien op de Heilige van Israël, en de HEERE niet zoeken.", "2 Sam 14:14": "Want wij moeten sterven, en zijn als water dat, uitgestort op de aarde, niet meer verzameld kan worden. God zal echter het leven niet wegnemen, maar Hij zal er middelen op bedenken, dat Hij de verstotene niet van Zich verstoot.", "Gen 41:50": "En Jozef werden twee zonen geboren, voordat het jaar van de honger aankwam, die Asnath, de dochter van Potifera, priester van On, hem baarde.", "2 Kor 5:6": "Wij hebben dus altijd goede moed, en weten dat wij, zolang wij in het lichaam wonen, wij afwezig zijn van de Heere;", "2 Kron 24:5": "Zo verzamelde hij de priesters en de Levieten, en zei tegen hen: Trek uit naar de steden van Juda, en verzamel geld van heel Israël, om het huis van uw God te herstellen van jaar tot jaar; en u, haast u met deze zaak; maar de Levieten haastten zich niet.", "2 Sam 19:39": "Toen nu heel het volk de Jordaan overgegaan was, en de koning ook overgegaan was, kuste de koning Barzillai, en zegende hem; en die keerde terug naar zijn woonplaats.", "Gen 47:19-26": "Waarom zouden wij voor uw ogen sterven, zowel wij als ons land? Koop ons en ons land voor brood, dan zullen wij en ons land Farao dienstbaar zijn; en geef ons zaad, opdat wij leven en niet sterven, en het land niet woest wordt! Zo kocht Jozef het hele land van Egypte voor Farao; want de Egyptenaren verkochten ieder zijn akker, omdat de honger sterk op hen drukte; zo werd het land eigendom van Farao. En wat het volk betreft, dat liet hij overbrengen naar de steden, van het ene uiterste van de grenzen van Egypte tot het andere uiterste ervan.", "Gal 6:6": "En wie onderwezen wordt in het Woord, moet delen van alle goederen met hem die hem onderwijst.", "Lev 25:51": "Als er nog veel van die jaren zijn, zal hij naar verhouding daarvan tot zijn lossing van het geld waarvoor hij gekocht is, teruggeven.", "Ps 15:5": "Die zijn geld niet uitleent tegen woeker, en geen geschenk aanneemt tegen de onschuldige. Wie deze dingen doet, zal niet wankelen in eeuwigheid.", "Ps 107:38": "En Hij zegent hen, zodat zij zeer meer worden, en hun vee vermindert Hij niet.", "Ps 39:6": "Zie, U hebt mijn dagen een handbreed lang gemaakt, en mijn levensduur is als niets voor U; zeker, ieder mens, hoe vast hij ook staat, is enkel ijdelheid. Sela.", "2 Kon 22:7": "Doch er werd met hen geen rekening gehouden van het geld dat in hun hand geleverd was, want zij handelden trouw.", "Jak 4:14": "U weet niet wat morgen gebeuren zal, want hoe is uw leven? Het is immers een damp, die voor een korte tijd zichtbaar is, en daarna verdwijnt.", "Job 14:2": "Hij komt op als een bloem, en wordt afgesneden; ook vlucht hij als een schaduw, en houdt geen stand.", "Ruth 4:15": "Die zal u zijn tot een verkwikker van de ziel, en om uw ouderdom te onderhouden; want uw schoondochter, die u liefheeft, heeft hem gebaard, en zij is u beter dan zeven zonen.", "Spr 13:23": "Het ploegen van de armen geeft overvloed van voedsel; maar er is iemand die verteerd wordt door gebrek aan oordeel.", "Ps 89:48": "Gedenk wat voor eeuw ik ben; waarom zou Gij alle mensenkinderen tevergeefs geschapen hebben?", "Jes 50:9": "Zie, de Heere HEERE helpt Mij, wie is het die Mij zal veroordelen? Zie, zij zullen allemaal verslijten als een kleed, de mot zal hen opeten.", "2 Sam 8:18": "Er was ook Benaja, zoon van Jojada, met de Krethi en de Plethi; maar Davids zonen waren prinsen.", "Gen 50:24": "En Jozef zei tot zijn broeders: Ik sterf; maar God zal u zeker bezoeken, en Hij zal u doen optrekken uit dit land, naar het land, dat Hij aan Abraham, Izak en Jakob gezworen heeft.", "Matt 16:26": "Want wat baat het een mens, als hij de hele wereld wint, en schade lijdt aan zijn ziel? Of wat zal een mens geven, als losprijs voor zijn ziel?", "Ex 6:3": "En ook heb Ik Mijn verbond met hen opgericht, dat Ik hun het land Kanaän geven zou, het land van hun vreemdelingschap, waarin zij vreemdelingen zijn geweest.", "Luk 16:2": "En hij riep hem en zei tegen hem: Hoe hoor ik dit van u? Geef rekenschap van uw rentmeesterschap; want u zult niet meer rentmeester kunnen zijn.", "Job 11:17": "Ja, uw levenstijd zal helderder dan de middag oprijzen; u zult stralen, als de morgenstond zult u zijn.", "Gen 15:15": "En u zult tot uw vaderen gaan in vrede; u zult in goede ouderdom begraven worden.", "Spr 12:11": "Wie zijn land bewerkt, zal met brood verzadigd worden; maar wie nutteloze mensen volgt, is verstandeloos.", "Deut 31:14": "En de HEERE zei tegen Mozes: Zie, uw dagen zijn genaderd om te sterven; roep Jozua, en stel u op in de tent van de samenkomst, zodat Ik hem een opdracht geef. Zo ging Mozes, en Jozua, en zij stelden zich op in de tent van de samenkomst.", "Ps 90:5": "U overstroomt hen; zij zijn gelijk een slaap; in de morgenstond zijn zij gelijk het gras, dat verandert;", "Ps 148:13": "Laat hen de Naam van de HEERE loven; want Zijn Naam alleen is hoog verheven; Zijn majesteit is over de aarde en de hemel.", "Deut 21:14": "En het zal gebeuren, als u geen behagen meer in haar hebt, dat u haar zult laten gaan waarheen zij wil; maar u zult haar beslist niet voor geld verkopen, u zult geen handel met haar drijven, omdat u haar vernederd hebt.", "Neh 5:10": "Ik, mijn broeders en mijn knechten, vorderen wij ook geld en koren van hen? Laten wij toch deze last nalaten.", "Gen 23:9": "Dat hij mij de spelonk van Machpela geeft, die hij heeft, die aan het eind van zijn akker is; dat hij die mij voor het volle geld geeft, tot een eigen graf in het midden van u.", "Pred 1:4": "Het ene geslacht gaat, en het andere geslacht komt; maar de aarde blijft staan in eeuwigheid.", "Gen 26:1": "Er was honger in dat land, naast de eerste honger, die er in de dagen van Abraham geweest was; daarom ging Izak naar Abimelech, de koning van de Filistijnen, naar Gerar.", "Gen 3:19": "In het zweet van uw gezicht zult u brood eten, totdat u tot de aarde terugkeert, omdat u daaruit genomen bent; want u bent stof, en u zult tot stof terugkeren.", "Gen 45:18-20": "En neem uw vader en uw huisgezinnen, en kom naar mij, en ik zal u het beste van Egypteland geven, en u zult het vette van dit land eten. U bent toch gelast: doe dit, neem u uit Egypteland wagens voor uw kinderen, en voor uw vrouwen, en breng uw vader, en kom. En laat uw oog uw huisraad niet verschonen; want het beste van heel Egypteland, dat zal het uwe zijn.", "Luk 9:3": "En Hij zei tegen hen: Neem niets mee voor onderweg, geen stok, geen reistas, geen brood, geen geld; en niemand van u mag twee stel kleren hebben.", "Gen 25:8": "En Abraham gaf de geest en stierf, in goede ouderdom, oud en verzadigd van het leven, en hij werd verzameld tot zijn volk.", "Gen 46:33": "Wanneer het nu zal gebeuren dat de farao u zal roepen, en zeggen: Wat is uw beroep?", "Lev 25:37": "Uw geld zult u hem niet op rente geven, en uw voedsel zult u niet op overwinst geven.", "Ps 102:12": "Mijn dagen zijn als een afgaande schaduw, en ik verdor als gras.", "Ex 9:10": "En zij namen as uit de oven, en gingen voor Farao staan; en Mozes strooide die naar de hemel; toen ontstonden er zweren, die openbraken met blaren, bij de mensen en bij het vee;", "Gen 18:3": "En hij zei: Heere! Als ik nu genade gevonden heb in Uw ogen, ga toch niet aan Uw knecht voorbij.", "Job 7:17": "Wat is de mens, dat U hem groot acht, en dat U Uw hart op hem zet?", "Gen 12:10": "En er was hongersnood in dat land; zo trok Abram af naar Egypte om daar als vreemdeling te wonen, omdat de hongersnood zwaar was in dat land.", "Gen 44:1-8": "En hij gebood degene die over zijn huis ging, en zei: Vul de zakken van deze mannen met voedsel, zoveel als zij kunnen dragen, en leg ieders geld in de mond van zijn zak; En mijn beker, de zilveren beker, moet u leggen in de mond van de zak van de jongste, met het geld van zijn koren. En hij deed naar Jozefs woord, dat hij gesproken had. 's Morgens, toen het licht werd, liet men deze mannen vertrekken, hen en hun ezels.", "Klaagl 1:11": "Caph. Al haar volk zucht, brood zoekend, zij hebben hun gewenste dingen voor voedsel gegeven, om de ziel te verkwikken. Zie, HEERE, en aanschouw, dat ik onwaard geworden ben.", "Gen 35:28": "En de dagen van Izak waren honderdtachtig jaar.", "Ps 6:6": "Want in de dood is aan U geen gedachtenis; wie zal U loven in het graf?", "Klaagl 2:20": "Resch. Zie, HEERE, aanschouw toch, aan wie Gij zo gedaan hebt; zullen dan de vrouwen haar vrucht eten, de kinderen die men op de handen draagt? Zullen dan de profeet en de priester in het heiligdom van de Heere gedood worden?", "Ex 30:16": "U dan moet het geld van de verzoeningen van de kinderen van Israël nemen, en het bestemmen voor de dienst van de tent van de samenkomst; en het zal voor de kinderen van Israël een gedachtenis zijn, voor het aangezicht van de HEERE, om voor uw zielen verzoening te doen.", "Gen 43:12-23": "En neem dubbel geld in uw hand; en breng het geld, dat in de opening van uw zakken teruggekeerd is, weer terug in uw hand; misschien is het een vergissing. Neem ook uw broer mee, en maak u op, ga terug naar die man. En God, de Almachtige, geve u barmhartigheid bij die man, dat hij uw andere broer en Benjamin met u laat teruggaan! En wat mij aangaat, als ik van mijn kinderen beroofd word, dan ben ik maar beroofd!", "Job 14:14": "Als een man gestorven is, zal hij dan weer leven? Ik zou al de dagen van het strijd hopen, totdat mijn verandering zou komen.", "Micha 2:1": "Wee hun die onrecht bedenken en kwaad beramen op hun slaapplaatsen; in het licht van de morgen doen zij het, omdat het in de macht van hun hand is.", "Gen 45:11": "En ik zal u daar onderhouden; want er zullen nog vijf jaren van de honger zijn, opdat u niet verarmt, u en uw huis, en alles wat u hebt!", "Gen 41:45": "En Farao noemde Jozef Zafnath-Paaneah, en gaf hem Asnath, de dochter van Potifera, priester van On, tot vrouw; en Jozef trok door het land van Egypte.", "2 Kron 24:14": "Toen zij het nu klaar hadden, brachten zij voor de koning en Jojada het overige van het geld, waarvan hij vaten maakte voor het huis van de HEERE, vaten om te dienen en te offeren, en rookschalen, en gouden en zilveren vaten; en zij offerden voortdurend brandoffers in het huis van de HEERE, al de dagen van Jojada.", "Job 9:25": "En mijn dagen zijn sneller geweest dan een loper; zij zijn weggevlucht, zij hebben het goede niet gezien.", "1 Petr 2:11": "Geliefden, ik roep u dringend op, als inwoners en vreemdelingen, dat u zich onthoudt van de vleselijke begeerten, die strijd voeren tegen de ziel;", "2 Sam 7:12": "Wanneer uw dagen vervuld zullen zijn, en u met uw vaderen zult ontslapen zijn, dan zal Ik uw nakomeling na u doen opstaan, die uit uw lijf voortkomen zal, en Ik zal zijn koninkrijk bevestigen.", "Matt 10:10": "Ook geen reistas voor onderweg, geen twee stel kleren, geen schoenen, geen staf; want de arbeider is zijn voedsel waard.", "2 Kon 5:26": "Maar hij zei tegen hem: Ging mijn hart niet mee, toen die man zich van zijn wagen omkeerde, u tegemoet? Was dit het moment om dat zilver aan te nemen, en om kleren aan te nemen, en olijfbomen, en wijngaarden, en schapen, en runderen, en knechten, en dienstmaagden?", "Ezra 7:24": "Ook laten wij u weten, aangaande alle priesters en Levieten, zangers, poortwachters, Nethinim en dienaars van het huis van deze God, dat men de cijns, oude belasting en tol hun niet zal mogen opleggen.", "Matt 15:5": "Maar u zegt: Wie tegen vader of moeder zal zeggen: Het is een gave, wat u ook van mij zou kunnen ten nutte komen; en zijn vader of zijn moeder geenszins zal eren, die voldoet.", "1 Kon 21:15": "Het gebeurde nu, toen Izebel hoorde dat Naboth gestenigd en dood was, dat Izebel tegen Achab zei: Sta op, neem de wijngaard van Naboth, de Jizreëliet, in bezit, die hij u weigerde voor geld te geven; want Naboth leeft niet meer, maar is dood.", "Gen 6:19": "En u zult van al wat leeft, van alle vlees, twee van elk, in de ark laten komen, om met u in het leven te behouden: mannetje en vrouwtje zullen zij zijn;", "Neh 5:4": "Evenzo waren er die zeiden: Wij hebben geld geleend voor de belasting van de koning, op onze akkers en onze wijngaarden.", "Ex 12:37": "Zo reisden de kinderen van Israël uit van Rameses naar Sukkoth, ongeveer zeshonderdduizend te voet, alleen de mannen, behalve de kinderen.", "2 Kon 15:20": "Menahem nu bracht dit geld op van Israël, van alle vermogende mannen, om aan de koning van Assyrië te geven, voor elke man vijftig zilveren sikkels; zo keerde de koning van Assyrië terug, en bleef daar niet in het land.", "Deut 23:19": "U zult uw broeder geen rente laten betalen, rente van geld, rente van voedsel, rente van enig ding waarover men rente vraagt.", "Ps 119:84": "Hoeveel zullen de dagen van Uw knecht zijn? Wanneer zult U recht doen over mijn vervolgers?", "Num 33:3": "Zij reisden dan van Rameses; in de eerste maand, op de vijftiende dag van de eerste maand, de dag na het pascha, trokken de kinderen van Israël uit door een hoge hand, voor de ogen van alle Egyptenaren;", "Job 10:20": "Zijn mijn dagen niet weinig? Houd op, laat van mij af, dat ik mij een weinig verkwikt;", "Hebr 11:9-16": "Door het geloof is hij een inwoner geweest in het land van de belofte, als in een vreemd land, en heeft hij in tenten gewoond met Izak en Jakob, die medeerfgenamen waren van dezelfde belofte. Want hij verwachtte de stad die fundamenten heeft, waarvan God de Ontwerper en Bouwer is. Door het geloof heeft ook Sara zelf kracht ontvangen om, ook toen de tijd van haar ouderdom voorbij was, zwanger te worden en te baren; omdat zij Hem trouw achtte, Die het beloofd had.", "Jes 40:7": "Het gras verdort, de bloem valt af, als de Geest van de HEERE daarin waait; voorwaar, het volk is gras.", "Num 18:16": "Wie hiervan gelost zullen worden, zult u van een maand oud lossen, naar uw schatting, voor het geld van vijf sikkels, naar de sikkel van het heiligdom, die is twintig gera.", "Jes 51:8": "Want de mot zal ze opeten als een kleed, en het schietwormpje zal ze opeten als wol; maar Mijn gerechtigheid zal in eeuwigheid zijn, en Mijn heil van geslacht tot geslacht.", "Gen 47:20-26": "Zo kocht Jozef het hele land van Egypte voor Farao; want de Egyptenaren verkochten ieder zijn akker, omdat de honger sterk op hen drukte; zo werd het land eigendom van Farao. En wat het volk betreft, dat liet hij overbrengen naar de steden, van het ene uiterste van de grenzen van Egypte tot het andere uiterste ervan. Alleen het land van de priesters kocht hij niet; want de priesters hadden een vast deel van Farao, en zij aten van dat vaste deel dat Farao hun gegeven had; daarom verkochten zij hun land niet.", "Spr 22:29": "Hebt u een man gezien die vaardig is in zijn werk? Hij zal voor koningen komen te staan; hij zal niet voor onaanzienlijke mensen staan.", "1 Kon 11:18": "En zij trokken op vanuit Midian en kwamen naar Paran; en zij namen mannen uit Paran met zich mee, en kwamen in Egypte bij Farao, de koning van Egypte, die hem een huis gaf, en hem levensonderhoud toezei, en hem land gaf.", "Ex 22:25": "Als u Mijn volk, dat arm is onder u, geld leent, mag u zich niet als een woekeraar tegenover hen gedragen; u mag geen rente van hen vragen.", "Ex 20:12": "Eer uw vader en uw moeder, opdat uw dagen verlengd worden in het land dat de HEERE, uw God, u geeft.", "Gen 47:15-26": "Toen het geld uit Egypteland en uit het land Kanaän op was, kwamen alle Egyptenaren naar Jozef en zeiden: Geef ons brood; want waarom zouden wij in uw bijzijn sterven? Want het geld is op. En Jozef zei: Geef uw vee, dan zal ik u brood geven voor uw vee, als het geld op is. Toen brachten zij hun vee naar Jozef; en Jozef gaf hun brood in ruil voor paarden, voor het vee van de schapen, voor het vee van de runderen en voor ezels; en hij voorzag hen van brood, dat jaar, voor al hun vee.", "Joël 1:10-12": "Het veld is verwoest, het land treurt; want het koren is verwoest, de most is verdroogd, de olie is uitgeput. De akkerlieden zijn beschaamd, de wijngaardeniers huilen, om de tarwe en om de gerst, want de oogst van het veld is vergaan. De wijnstok is verdord, de vijgenboom is uitgeput; de granaatappelboom, ook de palmboom en appelboom; alle bomen van het veld zijn verdord; ja, de vrolijkheid is verdord van de mensenkinderen.", "2 Kron 34:14": "En toen zij het geld uithaalden dat naar het huis van de HEERE gebracht was, vond de priester Hilkia het wetboek van de HEERE, dat door de hand van Mozes gegeven was.", "Gen 50:1-13": "Toen viel Jozef op het gezicht van zijn vader, en hij weende over hem, en kuste hem. En Jozef gebood zijn knechten, de artsen, dat zij zijn vader balsemen zouden; en de artsen balsemden Israël. En veertig dagen werden aan hem vervuld; want zo worden de dagen vervuld van hen die gebalsemd worden; en de Egyptenaars beweenden hem zeventig dagen.", "Gen 25:7": "Dit nu zijn de dagen van de jaren van het leven van Abraham, die hij geleefd heeft: honderdvijfenzeventig jaar.", "Luk 16:10-12": "Wie getrouw is in het minste, die is ook in het grote getrouw; en wie in het minste onrechtvaardig is, die is ook in het grote onrechtvaardig. Als u dan in de onrechtvaardige Mammon niet getrouw bent geweest, wie zal u het ware vertrouwen? En als u in andermans goed niet getrouw bent geweest, wie zal u het uwe geven?", "Jer 9:12": "Wie is de wijze man, die dit begrijpt? En tot wie heeft de mond van de HEERE gesproken, dat hij het verkondigt, waarom het land vergaat en afgebrand is als een woestijn, zodat er niemand doorgaat?", "Jes 28:24": "Ploegt de ploeger de hele dag om te zaaien? Opent en egt hij zijn land de hele dag?", "Gen 48:2": "En men vertelde het Jakob, en men zei: Zie, uw zoon Jozef komt naar u toe! Toen verzamelde Israël zijn krachten, en ging op het bed zitten.", "1 Kron 27:29-31": "En over de runderen die in Saron weidden, was Sitrai, de Saroniet; maar over de runderen in de laagten was Safat, de zoon van Adlai. En over de kamelen was Obil, de Ismaëliet; en over de ezelinnen was Jechdeja, de Meronothiet. En over het kleine vee was Jaziz, de Hageriet. Al dezen waren opzichters over het bezit dat koning David had.", "Ex 1:7": "werden de kinderen van Israël vruchtbaar en namen ze sterk in aantal toe, en zij vermeerderden, en werden buitengewoon machtig, zodat het land met hen vervuld werd.", "Gen 47:5-10": "Toen sprak Farao tegen Jozef en zei: Uw vader en uw broers zijn tot u gekomen; Egypteland ligt voor u; laat uw vader en uw broers wonen in het beste deel van het land; laat hen in het land Gosen wonen. En als u weet dat er onder hen bekwame mannen zijn, zet hen dan aan als veemeesters over wat ik heb. En Jozef bracht zijn vader Jakob binnen en stelde hem voor Farao; en Jakob zegende Farao.", "2 Kon 12:7-16": "Toen riep koning Joas de priester Jojada en de andere priesters, en zei tegen hen: Waarom herstelt u niet de breuken van het huis? Nu dan, neem geen geld van uw bekenden aan, tenzij u het geeft voor de breuken van het huis. En de priesters stemden erin toe geen geld van het volk aan te nemen, noch de breuken van het huis te herstellen. Maar de priester Jojada nam een kist, en boorde een gat in het deksel ervan, en zette die bij het altaar aan de rechterkant, waar iemand het huis van de HEERE binnenkwam; en de priesters die de drempel bewaakten, staken daarin al het geld dat naar het huis van de HEERE gebracht werd.", "Pred 10:19": "Men maakt maaltijden om te lachen, en de wijn verheugt de levenden, en het geld verschaft alles.", "Deut 2:28": "Verkoop mij voedsel voor geld, dat ik eet, en geef mij water voor geld, dat ik drink; laat mij alleen te voet doortrekken;", "Ex 9:21": "maar wie zijn hart niet richtte op het woord van de HEERE, die liet zijn dienaren en zijn vee op het veld.", "Job 2:4": "Toen antwoordde de satan de HEERE en zei: Huid voor huid, en alles wat iemand heeft, zal hij geven voor zijn leven.", "Gen 42:25-35": "En Jozef gebood dat men hun zakken met koren vullen zou, en dat men hun geld terug zou geven, ieder in zijn zak, en dat men hun proviand zou geven voor onderweg; en men deed hun zo. En zij laadden hun koren op hun ezels, en trokken vandaar weg. Toen één zijn zak opendeed om zijn ezel voer te geven in de herberg, zag hij zijn geld; want zie, het was in de opening van zijn zak.", "Ex 9:3": "zie, de hand van de HEERE zal zijn over uw vee dat in het veld is, over de paarden, over de ezels, over de kamelen, over de runderen, en over het kleinvee, door een zeer zware pest.", "Klaagl 5:9": "Wij moeten ons brood met gevaar voor ons leven halen, vanwege het zwaard van de woestijn.", "Job 14:1": "De mens, uit een vrouw geboren, leeft maar kort en is vol onrust.", "Lev 27:32": "Wat betreft alle tienden van runderen en klein vee, alles wat onder de herdersstaf doorgaat, het tiende zal de HEERE heilig zijn.", "Gen 23:13": "En hij sprak tot Efron, ten aanhoren van het volk van het land, en zei: Trouwens, als u het toch wilt geven, hoor mij dan alstublieft; ik zal het geld van de akker geven; neem het van mij aan, dan zal ik mijn dode daar begraven.", "Num 6:24": "De HEERE zegent u, en behoedt u!", "Neh 9:23": "U hebt ook hun kinderen vermenigvuldigd, als de sterren van de hemel; en U hebt hen gebracht in het land, waarvan U tot hun vaderen had gezegd, dat zij zouden ingaan om het erfelijk te bezitten.", "Jes 38:12": "Mijn levenstijd is weggetrokken, en van mij weggevoerd als de tent van een herder; ik heb mijn leven afgesneden, zoals een wever zijn weefsel; Hij zal mij afsnijden, als van de drom; van de dag tot de nacht zult U mij ten einde gebracht hebben.", "Amos 7:14": "Toen antwoordde Amos, en zei tegen Amazia: Ik was geen profeet, en ik was geen profetenzoon; maar ik was een ossenherder, en verzamelde wilde vijgen.", "Job 13:12": "Uw spreuken zijn als as, uw verweer is als een verweer van leem.", "Matt 26:26": "En toen zij aten, nam Jezus het brood, en na de zegen brak Hij het, en gaf het aan de discipelen en zei: Neemt, eet, dat is Mijn lichaam.", "Jes 28:25": "Is het niet zo? Wanneer hij het bovenste ervan gelijk gemaakt heeft, dan strooit hij wikken, en spreidt komijn uit, of hij werpt er de beste tarwe in, of uitgelezen gerst, of spelt, elk op zijn plaats.", "Gen 24:9": "Toen legde de knecht zijn hand onder de heup van Abraham, zijn heer, en hij zwoer hem over deze zaak.", "2 Sam 8:10": "zond Thoi zijn zoon Joram naar de koning David om hem naar zijn welstand te vragen, en om hem te zegenen, omdat hij tegen Hadad-Ezer had gevochten en hem geslagen had (want Hadad-Ezer voerde steeds oorlog tegen Thoi); en in zijn hand waren zilveren vaten, en gouden vaten, en koperen vaten;", "Ps 107:36": "En Hij doet de hongerigen daar wonen, en zij stichten een stad om in te wonen;", "Ps 49:10": "dat hij ook voortaan voor altijd zou leven, en de vergankelijkheid niet zien.", "Ezech 7:24": "Daarom zal Ik de kwaadste van de heidenvolken doen komen, die hun huizen erfelijk zullen bezitten, en Ik zal de hoogmoed van de sterken doen ophouden, en die hen heiligen, zullen ontheiligd worden.", "Ex 21:35": "Wanneer nu iemands os de os van zijn naaste zo kwetst, dat hij sterft, dan zal men de levende os verkopen en het geld daarvan gelijk delen, en het dode dier zal men ook gelijk delen.", "Job 5:26": "U zult in ouderdom naar het graf gaan, zoals de korenhoop op zijn tijd wordt opgevoerd.", "Jer 32:25": "Evenwel hebt U tegen mij gezegd, Heere HEERE: koop voor uzelf dat veld voor geld, en laat het door getuigen bevestigen; terwijl de stad in de hand van de Chaldeeën gegeven is.", "Jes 55:10": "Want zoals de regen en de sneeuw van de hemel neerdaalt, en daarheen niet terugkeert; maar de aarde doorvochtigt, en maakt dat zij voortbrengt en uitspruit, en zaad geeft aan de zaaier, en brood aan de eter;", "Est 4:7": "gaf Mordechai hem te kennen alles wat hem overkomen was, en de opgave van het zilver dat Haman gezegd had te zullen wegen in de schatten van de koning, voor de Joden, om hen om te brengen.", "Kol 4:5": "Wandel met wijsheid bij hen die buiten zijn, en maak gebruik van elke gelegenheid.", "Fil 3:9": "En in Hem gevonden word, niet met mijn eigen rechtvaardigheid, die uit de wet is, maar met de rechtvaardigheid die door het geloof van Christus is, namelijk de rechtvaardigheid die uit God is door het geloof;", "Neh 5:3": "Ook waren er die zeiden: Wij verpanden onze akkers en onze wijngaarden en onze huizen, opdat wij in deze hongersnood koren mogen opnemen.", "Gen 11:11": "En Sem leefde, nadat hij Arfachsad verwekt had, vijfhonderd jaar; en hij verwekte zonen en dochters.", "Gen 47:29-31": "Toen de dagen naderden dat Israël zou sterven, riep hij zijn zoon Jozef, en zei tegen hem: Als ik nu genade gevonden heb in uw ogen, leg dan toch uw hand onder mijn heup, en bewijs mij goedheid en trouw: begraaf mij toch niet in Egypte; maar laat ik bij mijn vaderen liggen; daarom zult u mij uit Egypte wegvoeren en mij in hun graf begraven. En hij zei: Ik zal doen naar uw woord! En hij zei: Zweer het mij! En hij zwoer het hem. En Israël boog zich neer aan het hoofdeind van het bed.", "Ps 146:4": "Zijn geest gaat uit, hij keert terug tot zijn aarde; op diezelfde dag vergaan zijn plannen.", "Gen 17:12": "Een zoontje van acht dagen zal bij u besneden worden, alles wat mannelijk is in uw geslachten: degene die in het huis geboren is, en degene die met geld gekocht is van elke vreemdeling die niet van uw nageslacht is;", "Gen 41:34": "Laat Farao dit doen, en opzieners aanstellen over het land; en het vijfde deel nemen van het land van Egypte in de zeven jaren van overvloed.", "Gen 50:1-6": "Toen viel Jozef op het gezicht van zijn vader, en hij weende over hem, en kuste hem. En Jozef gebood zijn knechten, de artsen, dat zij zijn vader balsemen zouden; en de artsen balsemden Israël. En veertig dagen werden aan hem vervuld; want zo worden de dagen vervuld van hen die gebalsemd worden; en de Egyptenaars beweenden hem zeventig dagen.", "Deut 14:26": "En geef dat geld voor alles wat uw ziel verlangt, voor runderen en voor schapen, en voor wijn, en voor sterke drank, en voor alles wat uw ziel van u begeren zal, en eet daar voor het aangezicht van de HEERE, uw God, en wees vrolijk, u en uw huis.", "2 Kon 12:4": "En Joas zei tegen de priesters: Al het geld van de geheiligde dingen, dat gebracht zal worden in het huis van de HEERE, te weten het geld van hem die overgaat tot de getelden, het geld van ieder man naar zijn schatting, en al het geld, dat in het hart van ieder komt, om dat te brengen in het huis van de HEERE,", "Spr 7:20": "Hij heeft een bundel van het geld in zijn hand genomen; op de vastgestelde dag zal hij naar zijn huis komen.", "Gen 45:16": "Toen dit gerucht in het huis van Farao gehoord werd, dat men zei: Jozefs broers zijn gekomen! was het goed in de ogen van Farao, en in de ogen van zijn dienaren.", "1 Tim 5:8": "Maar als iemand voor de zijnen, en vooral voor zijn huisgenoten, niet zorgt, die heeft het geloof verloochend, en is erger dan een ongelovige.", "Neh 5:11": "Geeft hun toch, nog vandaag, hun akkers, hun wijngaarden, hun olijfgaarden en hun huizen terug; en het honderdste deel van het geld en van het koren, de most en de olie, die u van hen gevorderd hebt.", "1 Kor 10:32": "Wees zonder aanstoot te geven, zowel voor de Joden als voor de Grieken als voor de gemeente van God.", "Ps 90:3-12": "U doet de mens wederkeren tot verbrijzeling, en zegt: Keer weder, mensenkinderen! Want duizend jaren zijn in Uw ogen als de dag van gisteren, als hij voorbijgegaan is, en als een nachtwaak. U overstroomt hen; zij zijn gelijk een slaap; in de morgenstond zijn zij gelijk het gras, dat verandert;", "Zach 10:8": "Ik zal hen toefluiten en zal hen verzamelen, want Ik zal hen verlossen; en zij zullen talrijker worden, zoals zij eerder talrijk waren.", "Ps 37:3": "Beth. Vertrouw op de HEERE, en doe het goede; bewoon de aarde, en voed u met trouw.", "1 Kon 1:47": "Ook zijn de knechten van de koning gekomen om onze heer, de koning David, te zegenen, en zeiden: Uw God make de naam van Salomo beter dan uw naam, en make zijn troon groter dan uw troon; en de koning heeft zich neergebogen op het bed.", "Pred 12:1-7": "Denk aan uw Schepper in de dagen van uw jeugd, voordat de kwade dagen komen en de jaren naderen waarvan u zult zeggen: Ik heb er geen vreugde in. Voordat de zon, en het licht, en de maan, en de sterren verduisterd worden, en de wolken terugkomen na de regen. Op de dag wanneer de wachters van het huis zullen beven, en de sterke mannen zich zullen krommen, en de maalsters zullen stilstaan, omdat zij minder geworden zijn, en zij die door de vensters kijken, verduisterd zullen worden;", "Joz 14:13": "Toen zegende Jozua hem, en hij gaf Kaleb, de zoon van Jefunne, Hebron als erfdeel.", "Richt 8:8": "En hij trok vandaar op naar Pnuël, en sprak hen op dezelfde manier toe. En de mannen van Pnuël antwoordden hem, zoals de mannen van Sukkoth geantwoord hadden.", "Job 31:39": "Als ik zijn vermogen gegeten heb zonder geld, en de ziel van zijn akkerlieden heb doen hijgen;", "Job 42:17": "En Job stierf, oud en verzadigd van dagen.", "Tit 2:2": "Dat de oude mannen nuchter zijn, stemmig, bezonnen, gezond in het geloof, in de liefde, in de volharding.", "Gen 50:25": "En Jozef deed de zonen van Israël zweren en zei: God zal u zeker bezoeken, zo zult u mijn beenderen van hier opvoeren!", "Gen 14:18": "En Melchizedek, koning van Salem, bracht brood en wijn; en hij was een priester van de allerhoogste God.", "Gen 45:6-8": "Want het zijn nu twee jaren van de honger in het midden van het land; en er zijn nog vijf jaren, waarin geen ploeging noch oogst zal zijn. Doch God heeft mij voor uw aangezicht heen gezonden, om u een overblijfsel te stellen op de aarde, en om u bij het leven te behouden, door een grote verlossing. Nu dan, u hebt mij hierheen niet gezonden, maar God Zelf, Die mij tot vader van Farao gesteld heeft, en tot een heer over zijn hele huis, en regeerder in het hele land van Egypte.", "Gen 24:3": "opdat ik u laat zweren bij de HEERE, de God van de hemel en de God van de aarde, dat u voor mijn zoon geen vrouw zult nemen van de dochters van de Kanaänieten, in het midden van wie ik woon;", "1 Sam 21:7": "Daar was nu een man van de knechten van Saul, diezelfde dag opgehouden voor het aangezicht van de HEERE, en zijn naam was Doeg, een Edomiet, de machtigste onder de herders die Saul had.", "Hand 7:13": "En de
