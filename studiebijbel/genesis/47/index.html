de het aan Farao, en zei: Mijn vader en mijn broers, met hun schapen, hun runderen en alles wat zij hebben, zijn gekomen uit het land Kanaän; en zie, zij zijn in het land Gosen.","2":"En hij nam een deel van zijn broers, namelijk vijf mannen, en stelde hen voor Farao.","3":"Toen zei Farao tegen zijn broers: Wat is uw beroep? En zij zeiden tegen Farao: Uw knechten zijn schaapherders, zowel wij als onze vaders.","4":"Verder zeiden zij tegen Farao: Wij zijn gekomen om als vreemdelingen in dit land te wonen; want er is geen weide voor de schapen die uw knechten hebben, omdat de honger zwaar is in het land Kanaän; en laat nu toch uw knechten in het land Gosen wonen!","5":"Toen sprak Farao tegen Jozef en zei: Uw vader en uw broers zijn tot u gekomen;","6":"Egypteland ligt voor u; laat uw vader en uw broers wonen in het beste deel van het land; laat hen in het land Gosen wonen. En als u weet dat er onder hen bekwame mannen zijn, zet hen dan aan als veemeesters over wat ik heb.","7":"En Jozef bracht zijn vader Jakob binnen en stelde hem voor Farao; en Jakob zegende Farao.","8":"En Farao zei tegen Jakob: Hoeveel jaren telt u al?","9":"En Jakob zei tegen Farao: De jaren van mijn vreemdelingschap[1] zijn honderddertig jaar; weinig en zwaar zijn de jaren van mijn leven geweest, en zij hebben niet gehaald bij de jaren van het leven van mijn vaderen, in de dagen van hun vreemdelingschap.","10":"En Jakob zegende Farao, en ging weg van Farao.","11":"En Jozef zorgde voor woningen voor Jakob en zijn broers, en gaf hun een bezitting in Egypteland, in het beste deel van het land, in het land Rameses, zoals Farao geboden had.","12":"En Jozef verzorgde zijn vader en zijn broers en het hele huis van zijn vader met brood, tot aan de kleinste kinderen toe.","13":"En er was geen brood in het hele land; want de honger was zeer zwaar, zodat het land van Egypte en het land Kanaän uitgeput raakten vanwege die honger.","14":"Toen verzamelde Jozef al het geld dat in Egypteland en in het land Kanaän gevonden werd, voor het koren dat zij kochten; en Jozef bracht dat geld in het huis van Farao.","15":"Toen het geld uit Egypteland en uit het land Kanaän op was, kwamen alle Egyptenaren naar Jozef en zeiden: Geef ons brood; want waarom zouden wij in uw bijzijn sterven? Want het geld is op.","16":"En Jozef zei: Geef uw vee, dan zal ik u brood geven voor uw vee, als het geld op is.","17":"Toen brachten zij hun vee naar Jozef; en Jozef gaf hun brood in ruil voor paarden, voor het vee van de schapen, voor het vee van de runderen en voor ezels; en hij voorzag hen van brood, dat jaar, voor al hun vee.","18":"Toen dat jaar voorbij was, kwamen zij in het tweede jaar bij hem en zeiden tegen hem: Wij zullen het voor mijn heer niet verbergen: het geld is op, en de bezitting van het vee is bij mijn heer gekomen; er is voor het aangezicht van mijn heer niets anders overgebleven dan ons lichaam en ons land.","19":"Waarom zouden wij voor uw ogen sterven, zowel wij als ons land? Koop ons en ons land voor brood, dan zullen wij en ons land Farao dienstbaar zijn; en geef ons zaad, opdat wij leven en niet sterven, en het land niet woest wordt!","20":"Zo kocht Jozef het hele land van Egypte voor Farao; want de Egyptenaren verkochten ieder zijn akker, omdat de honger sterk op hen drukte; zo werd het land eigendom van Farao.","21":"En wat het volk betreft, dat liet hij overbrengen naar de steden, van het ene uiterste van de grenzen van Egypte tot het andere uiterste ervan.","22":"Alleen het land van de priesters kocht hij niet; want de priesters hadden een vast deel van Farao, en zij aten van dat vaste deel dat Farao hun gegeven had; daarom verkochten zij hun land niet.","23":"Toen zei Jozef tegen het volk: Zie, ik heb vandaag u en uw land gekocht voor Farao; zie, hier is zaad voor u, opdat u het land bezaait.","24":"Maar met de opbrengst zal het zo gaan, dat u aan Farao het vijfde deel zult geven, en de vier delen zullen voor u zijn, tot zaad voor het veld, en tot voedsel voor uzelf en voor wie in uw huizen zijn, en om te eten voor uw kinderen.","25":"En zij zeiden: U hebt ons leven gered; laten wij genade vinden in de ogen van mijn heer, en wij zullen knechten van Farao zijn.","26":"Jozef stelde dit dan in tot een wet, tot op deze dag, over het land van Egypte, dat Farao het vijfde deel zou hebben; behalve alleen het land van de priesters, dat niet van Farao werd.","27":"Zo woonde Israël in het land van Egypte, in het land Gosen; en zij verkregen daar bezittingen, en zij werden vruchtbaar en vermeerderden zeer.","28":"En Jakob leefde in het land van Egypte zeventien jaar; zodat de dagen van Jakob, de jaren van zijn leven, honderdzevenenveertig jaar geweest zijn.","29":"Toen de dagen naderden dat Israël zou sterven, riep hij zijn zoon Jozef, en zei tegen hem: Als ik nu genade gevonden heb in uw ogen, leg dan toch uw hand onder mijn heup, en bewijs mij goedheid en trouw: begraaf mij toch niet in Egypte;","30":"maar laat ik bij mijn vaderen liggen; daarom zult u mij uit Egypte wegvoeren en mij in hun graf begraven. En hij zei: Ik zal doen naar uw woord!","31":"En hij zei: Zweer het mij! En hij zwoer het hem. En Israël boog zich neer aan het hoofdeind van het bed."},"SV":{"1":"Toen kwam Jozef en boodschapte Farao, en zeide: Mijn vader en mijn broeders, en hun schapen, en hun runderen, met alles wat zij hebben, zijn gekomen uit het land Kanaän; en zie, zij zijn in het land Gosen.","2":"En hij nam een deel zijner broederen, *te* *weten* vijf mannen, en hij stelde hen voor Farao’s aangezicht.","3":"Toen zeide Farao tot zijn broederen: Wat is uw hantering? En zij zeiden tot Farao: Uw knechten zijn schaapherders, zo wij als onze vaders.","4":"Voorts zeiden zij tot Farao: Wij zijn gekomen, om als vreemdelingen in dit land te wonen; want er is geen weide voor de schapen, die uw knechten hebben, dewijl de honger zwaar is in het land Kanaän; en nu, laat toch uw knechten in het land Gosen wonen!","5":"Toen sprak Farao tot Jozef, zeggende: Uw vader en uw broeders zijn tot u gekomen;","6":"Egypteland is voor uw aangezicht; doe uw vader en uw broeders in het beste van het land wonen; laat hen in het land Gosen wonen, en zo gij weet, dat er onder hen kloeke mannen zijn, zo zet hen tot veemeesters over hetgeen ik heb.","7":"En Jozef bracht zijn vader Jakob mede, en stelde hem voor Farao’s aangezicht; en Jakob zegende Farao.","8":"En Farao zeide tot Jakob: Hoe vele zijn de dagen der jaren uws levens!","9":"En Jakob zeide tot Farao: De dagen der jaren mijner vreemdelingschappen zijn honderd en dertig jaren; weinig en kwaad zijn de dagen der jaren mijns levens geweest, en hebben niet bereikt de dagen van de jaren des levens mijner vaderen, in de dagen hunner vreemdelingschappen.","10":"En Jakob zegende Farao, en ging uit van Farao’s aangezicht.","11":"En Jozef bestelde voor Jakob en zijn broederen woningen, en hij gaf hun een bezitting in Egypteland, in het beste van het land, in het land Rameses, gelijk als Farao geboden had.","12":"En Jozef onderhield zijn vader, en zijn broeders, en het ganse huis zijns vaders, met brood, tot den mond der kinderkens toe.","13":"En er was geen brood in het ganse land; want de honger was zeer zwaar: zodat het land van Egypte en het land Kanaän raasden vanwege dien honger.","14":"Toen verzamelde Jozef al het geld, dat in Egypteland en in het land Kanaän gevonden werd, voor het koren, dat zij kochten; en Jozef bracht dat geld in Farao’s huis.","15":"Als nu het geld uit Egypteland en uit het land Kanaän verdaan was, kwamen al de Egyptenaars tot Jozef, zeggende: Geef ons brood; want waarom zouden wij in uw tegenwoordigheid sterven? want het geld ontbreekt;","16":"En Jozef zeide: Geeft uw vee, zo zal ik het u geven voor uw vee, indien het geld ontbreekt.","17":"Toen brachten zij hun vee tot Jozef; en Jozef gaf hun brood voor paarden en voor het vee der schapen, en voor het vee der runderen, en voor ezels; en hij voedde hen met brood, datzelve jaar, voor al hun vee.","18":"Toen datzelve jaar voleind was, zo kwamen zij tot hem in het tweede jaar, en zeiden tot hem: Wij zullen het voor mijn heer niet verbergen, alzo het geld verdaan is, en de bezitting der beesten *gekomen* aan mijn heer, zo is er niets anders overgebleven voor het aangezichts mijns heren, dan ons lichaam en ons land.","19":"Waarom zullen wij voor uw ogen sterven, zo wij als ons land? Koop ons en ons land voor brood; zo zullen wij en ons land Farao dienstbaar zijn; en geef zaad, opdat wij leven en niet sterven, en het land niet woest worde!","20":"Alzo kocht Jozef het gehele land van Egypte voor Farao; want de Egyptenaars verkochten een ieder zijn akker, dewijl de honger sterk over hen geworden was; zo werd het land Farao’s eigen.","21":"En aangaande het volk, dat zette hij over in de steden, van het ene uiterste der palen van Egypte, tot het andere uiterste deszelven.","22":"Alleen het land der priesteren kocht hij niet, want de priesters hadden een bescheiden deel van Farao, en zij aten hun bescheiden deel, hetwelk hun Farao gegeven had; daarom verkochten zij hun land niet.","23":"Toen zeide Jozef tot het volk: Ziet, ik heb heden u en uw land gekocht voor Farao; ziet, daar is zaad voor u, opdat gij het land bezaait.","24":"Doch met de inkomsten zal het geschieden, dat gij aan Farao het vijfde deel zult geven, en de vier delen zullen voor u zijn, tot zaad des velds, en tot uw spijze en van degenen, die in uw huizen zijn, en om te eten voor uw kinderkens.","25":"En zij zeiden: Gij hebt ons leven behouden; laat ons genade vinden in de ogen mijns heren, en wij zullen Farao’s knechten zijn.","26":"Jozef dan stelde ditzelve in tot een wet, tot dezen dag, over het land van Egypte, dat Farao het vijfde deel zou hebben; behalve dat alleen het land der priesteren van Farao niet werd.","27":"Zo woonde Israël in het land van Egypte, in het land Gosen; en zij stelden zich tot bezitters daarin, en zij werden vruchtbaar en vermeerderden zeer.","28":"En Jakob leefde in het land van Egypte zeventien jaar; zodat de dagen van Jakob, de jaren zijns levens, geweest zijn honderd zeven en veertig jaren.","29":"Als nu de dagen van Israël naderden, dat hij sterven zou, zo riep hij zijn zoon Jozef, en zeide tot hem: Indien ik nu genade gevonden heb in uw ogen, zo leg toch uw hand onder mijn heup, en doe weldadigheid en trouw aan mij, en begraaf mij toch niet in Egypte;","30":"Maar dat ik bij mijn vaderen ligge; hierom zult gij mij uit Egypte voeren, en mij in hun graf begraven. En hij zeide: Ik zal doen naar uw woord!","31":"En hij zeide: Zweer mij! en hij zwoer hem. En Israël boog zich ten hoofde van het bed."},"KJV":{"1":"Then Joseph came and told Pharaoh, and said, My father and my brethren, and their flocks, and their herds, and all that they have, are come out of the land of Canaan; and, behold, they *are* in the land of Goshen.","2":"And he took some of his brethren, *even* five men, and presented them unto Pharaoh.","3":"And Pharaoh said unto his brethren, What *is* your occupation? And they said unto Pharaoh, Thy servants *are* shepherds, both we, *and* also our fathers.","4":"They said moreover unto Pharaoh, For to sojourn in the land are we come; for thy servants have no pasture for their flocks; for the famine *is* sore in the land of Canaan: now therefore, we pray thee, let thy servants dwell in the land of Goshen.","5":"And Pharaoh spake unto Joseph, saying, Thy father and thy brethren are come","6":"The land of Egypt *is* before thee; in the best of the land make thy father and brethren to dwell; in the land of Goshen let them dwell: and if thou knowest *any* men of activity among them, then make them rulers over my cattle.","7":"And Joseph brought in Jacob his father, and set him before Pharaoh: and Jacob blessed Pharaoh.","8":"And Pharaoh said unto Jacob, How old","9":"And Jacob said unto Pharaoh, The days of the years of my pilgrimage *are* an hundred and thirty years: few and evil have the days of the years of my life been, and have not attained unto the days of the years of the life of my fathers in the days of their pilgrimage.","10":"And Jacob blessed Pharaoh, and went out from before Pharaoh.","11":"And Joseph placed his father and his brethren, and gave them a possession in the land of Egypt, in the best of the land, in the land of Rameses, as Pharaoh had commanded.","12":"And Joseph nourished his father, and his brethren, and all his father's household, with bread, according to *their* families.","13":"And *there was* no bread in all the land; for the famine *was* very sore, so that the land of Egypt and *all* the land of Canaan fainted by reason of the famine.","14":"And Joseph gathered up all the money that was found in the land of Egypt, and in the land of Canaan, for the corn which they bought: and Joseph brought the money into Pharaoh's house.","15":"And when money failed in the land of Egypt, and in the land of Canaan, all the Egyptians came unto Joseph, and said, Give us bread: for why should we die in thy presence? for the money faileth.","16":"And Joseph said, Give your cattle; and I will give you for your cattle, if money fail.","17":"And they brought their cattle unto Joseph: and Joseph gave them bread *in exchange* for horses, and for the flocks, and for the cattle of the herds, and for the asses: and he fed them with bread for all their cattle for that year.","18":"When that year was ended, they came unto him the second year, and said unto him, We will not hide *it* from my lord, how that our money is spent; my lord also hath our herds of cattle; there is not ought left in the sight of my lord, but our bodies, and our lands:","19":"Wherefore shall we die before thine eyes, both we and our land? buy us and our land for bread, and we and our land will be servants unto Pharaoh: and give *us* seed, that we may live, and not die, that the land be not desolate.","20":"And Joseph bought all the land of Egypt for Pharaoh; for the Egyptians sold every man his field, because the famine prevailed over them: so the land became Pharaoh's.","21":"And as for the people, he removed them to cities from *one* end of the borders of Egypt even to the *other* end","22":"Only the land of the priests bought he not; for the priests had a portion *assigned them* of Pharaoh, and did eat their portion which Pharaoh gave them: wherefore they sold not their lands.","23":"Then Joseph said unto the people, Behold, I have bought you this day and your land for Pharaoh: lo, *here is* seed for you, and ye shall sow the land.","24":"And it shall come to pass in the increase, that ye shall give the fifth *part* unto Pharaoh, and four parts shall be your own, for seed of the field, and for your food, and for them of your households, and for food for your little ones.","25":"And they said, Thou hast saved our lives: let us find grace in the sight of my lord, and we will be Pharaoh's servants.","26":"And Joseph made it a law over the land of Egypt unto this day, *that* Pharaoh should have the fifth *part*; except the land of the priests only, *which* became not Pharaoh's.","27":"And Israel dwelt in the land of Egypt, in the country of Goshen; and they had possessions therein, and grew, and multiplied exceedingly.","28":"And Jacob lived in the land of Egypt seventeen years: so the whole age of Jacob was an hundred forty and seven years.","29":"And the time drew nigh that Israel must die: and he called his son Joseph, and said unto him, If now I have found grace in thy sight, put, I pray thee, thy hand under my thigh, and deal kindly and truly with me; bury me not, I pray thee, in Egypt:","30":"But I will lie with my fathers, and thou shalt carry me out of Egypt, and bury me in their buryingplace. And he said, I will do as thou hast said.","31":"And he said, Swear unto me. And he sware unto him. And Israel bowed himself upon the bed's head."}},"tsk":{"1":[{"kopje":"Jozef","refs":["Gen 45:16","Gen 46:31","Hebr 2:11"]},{"kopje":"in het land","refs":["Gen 45:10","Gen 46:28","Gen 46:34","Ex 8:22","Ex 9:26"]}], 47\">Pharaoh</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto his <span class=\"wl wl-kjv\" data-code=\"H251\">brethren,</span> What is your <span class=\"wl wl-kjv\" data-code=\"H4639\">occupation?</span> And they <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh,</span> Thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> are <span class=\"wl wl-kjv\" data-code=\"H7462\">shepherds,</span> both we, and also our fathers.","4":"They <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> moreover unto <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh,</span> For to <span class=\"wl wl-kjv\" data-code=\"H1481\">sojourn</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> are we <span class=\"wl wl-kjv\" data-code=\"H935\">come;</span> for thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> have no <span class=\"wl wl-kjv\" data-code=\"H4829\">pasture</span> for their <span class=\"wl wl-kjv\" data-code=\"H6629\">flocks;</span> for the <span class=\"wl wl-kjv\" data-code=\"H7458\">famine</span> is <span class=\"wl wl-kjv\" data-code=\"H3515\">sore</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H3667\">Canaan:</span> now therefore, we pray thee, let thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> <span class=\"wl wl-kjv\" data-code=\"H3427\">dwell</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of Goshen.","5":"And <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh</span> <span class=\"wl wl-kjv\" data-code=\"H559\">spake</span> unto <span class=\"wl wl-kjv\" data-code=\"H3130\">Joseph,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Thy <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> and thy <span class=\"wl wl-kjv\" data-code=\"H251\">brethren</span> are come","6":"The <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt</span> is before <span class=\"wl wl-kjv\" data-code=\"H6440\">thee;</span> in the <span class=\"wl wl-kjv\" data-code=\"H4315\">best</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> <span class=\"wl wl-kjv\" data-code=\"H3427\">make</span> thy <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> and <span class=\"wl wl-kjv\" data-code=\"H251\">brethren</span> to <span class=\"wl wl-kjv\" data-code=\"H3427\">dwell;</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H1657\">Goshen</span> let them <span class=\"wl wl-kjv\" data-code=\"H3427\">dwell:</span> and if thou <span class=\"wl wl-kjv\" data-code=\"H3045\">knowest</span> any <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H2428\">activity</span> among them, then make <span class=\"wl wl-kjv\" data-code=\"H7760\">them</span> <span class=\"wl wl-kjv\" data-code=\"H8269\">rulers</span> over my cattle.","7":"And <span class=\"wl wl-kjv\" data-code=\"H3130\">Joseph</span> brought <span class=\"wl wl-kjv\" data-code=\"H935\">in</span> <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> his <span class=\"wl wl-kjv\" data-code=\"H1\">father,</span> and set <span class=\"wl wl-kjv\" data-code=\"H5975\">him</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh:</span> and <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> <span class=\"wl wl-kjv\" data-code=\"H1288\">blessed</span> Pharaoh.","8":"And <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob,</span> <span class=\"wl wl-kjv\" data-code=\"H4100\">How</span> <span class=\"wl wl-kjv\" data-code=\"H2416\">old</span>","9":"And <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh,</span> The <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> of the <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> of my <span class=\"wl wl-kjv\" data-code=\"H4033\">pilgrimage</span> are an <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> and <span class=\"wl wl-kjv\" data-code=\"H7970\">thirty</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years:</span> <span class=\"wl wl-kjv\" data-code=\"H4592\">few</span> and <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> have the <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> of the <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> of my <span class=\"wl wl-kjv\" data-code=\"H2416\">life</span> been, and have not <span class=\"wl wl-kjv\" data-code=\"H5381\">attained</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> of the <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> of the <span class=\"wl wl-kjv\" data-code=\"H2416\">life</span> of my <span class=\"wl wl-kjv\" data-code=\"H1\">fathers</span> in the <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> of their pilgrimage.","10":"And <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> <span class=\"wl wl-kjv\" data-code=\"H1288\">blessed</span> <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh,</span> and went <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> from <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> Pharaoh.","11":"And <span class=\"wl wl-kjv\" data-code=\"H3130\">Joseph</span> <span class=\"wl wl-kjv\" data-code=\"H3427\">placed</span> his <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> and his <span class=\"wl wl-kjv\" data-code=\"H251\">brethren,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> them a <span class=\"wl wl-kjv\" data-code=\"H272\">possession</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> in the <span class=\"wl wl-kjv\" data-code=\"H4315\">best</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H7486\">Rameses,</span> as <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh</span> had commanded.","12":"And <span class=\"wl wl-kjv\" data-code=\"H3130\">Joseph</span> <span class=\"wl wl-kjv\" data-code=\"H3557\">nourished</span> his <span class=\"wl wl-kjv\" data-code=\"H1\">father,</span> and his <span class=\"wl wl-kjv\" data-code=\"H251\">brethren,</span> and all his <span class=\"wl wl-kjv\" data-code=\"H1\">father's</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">household,</span> with <span class=\"wl wl-kjv\" data-code=\"H3899\">bread,</span> <span class=\"wl wl-kjv\" data-code=\"H6310\">according</span> to their families.","13":"And there was no <span class=\"wl wl-kjv\" data-code=\"H3899\">bread</span> in all the <span class=\"wl wl-kjv\" data-code=\"H776\">land;</span> for the <span class=\"wl wl-kjv\" data-code=\"H7458\">famine</span> was <span class=\"wl wl-kjv\" data-code=\"H3966\">very</span> <span class=\"wl wl-kjv\" data-code=\"H3515\">sore,</span> so that the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt</span> and all the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H3667\">Canaan</span> <span class=\"wl wl-kjv\" data-code=\"H3856\">fainted</span> by <span class=\"wl wl-kjv\" data-code=\"H6440\">reason</span> of the famine.","14":"And <span class=\"wl wl-kjv\" data-code=\"H3130\">Joseph</span> gathered <span class=\"wl wl-kjv\" data-code=\"H3950\">up</span> all the <span class=\"wl wl-kjv\" data-code=\"H3701\">money</span> that was <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> and in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H3667\">Canaan,</span> for the <span class=\"wl wl-kjv\" data-code=\"H7668\">corn</span> which they <span class=\"wl wl-kjv\" data-code=\"H7666\">bought:</span> and <span class=\"wl wl-kjv\" data-code=\"H3130\">Joseph</span> <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> the <span class=\"wl wl-kjv\" data-code=\"H3701\">money</span> into <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh's</span> house.","15":"And when <span class=\"wl wl-kjv\" data-code=\"H3701\">money</span> <span class=\"wl wl-kjv\" data-code=\"H8552\">failed</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> and in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H3667\">Canaan,</span> all the <span class=\"wl wl-kjv\" data-code=\"H4714\">Egyptians</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> unto <span class=\"wl wl-kjv\" data-code=\"H3130\">Joseph,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H3051\">Give</span> us <span class=\"wl wl-kjv\" data-code=\"H3899\">bread:</span> for why should we <span class=\"wl wl-kjv\" data-code=\"H4191\">die</span> in thy presence? for the <span class=\"wl wl-kjv\" data-code=\"H3701\">money</span> faileth.","16":"And <span class=\"wl wl-kjv\" data-code=\"H3130\">Joseph</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H3051\">Give</span> your <span class=\"wl wl-kjv\" data-code=\"H4735\">cattle;</span> and I will <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> you for your <span class=\"wl wl-kjv\" data-code=\"H4735\">cattle,</span> if <span class=\"wl wl-kjv\" data-code=\"H3701\">money</span> fail.","17":"And they <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> their <span class=\"wl wl-kjv\" data-code=\"H4735\">cattle</span> unto <span class=\"wl wl-kjv\" data-code=\"H3130\">Joseph:</span> and <span class=\"wl wl-kjv\" data-code=\"H3130\">Joseph</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> them <span class=\"wl wl-kjv\" data-code=\"H3899\">bread</span> in exchange for <span class=\"wl wl-kjv\" data-code=\"H5483\">horses,</span> and for the <span class=\"wl wl-kjv\" data-code=\"H6629\">flocks,</span> and for the <span class=\"wl wl-kjv\" data-code=\"H4735\">cattle</span> of the <span class=\"wl wl-kjv\" data-code=\"H1241\">herds,</span> and for the <span class=\"wl wl-kjv\" data-code=\"H2543\">asses:</span> and he <span class=\"wl wl-kjv\" data-code=\"H5095\">fed</span> them with <span class=\"wl wl-kjv\" data-code=\"H3899\">bread</span> for all their <span class=\"wl wl-kjv\" data-code=\"H4735\">cattle</span> for that year.","18":"When that <span class=\"wl wl-kjv\" data-code=\"H8141\">year</span> was <span class=\"wl wl-kjv\" data-code=\"H8552\">ended,</span> they <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> unto him the <span class=\"wl wl-kjv\" data-code=\"H8145\">second</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">year,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, We will not <span class=\"wl wl-kjv\" data-code=\"H3582\">hide</span> it from my <span class=\"wl wl-kjv\" data-code=\"H113\">lord,</span> how that our <span class=\"wl wl-kjv\" data-code=\"H3701\">money</span> is <span class=\"wl wl-kjv\" data-code=\"H8552\">spent;</span> my <span class=\"wl wl-kjv\" data-code=\"H113\">lord</span> also <span class=\"wl wl-kjv\" data-code=\"H413\">hath</span> our <span class=\"wl wl-kjv\" data-code=\"H4735\">herds</span> of <span class=\"wl wl-kjv\" data-code=\"H929\">cattle;</span> there is not ought <span class=\"wl wl-kjv\" data-code=\"H7604\">left</span> in the <span class=\"wl wl-kjv\" data-code=\"H6440\">sight</span> of my <span class=\"wl wl-kjv\" data-code=\"H113\">lord,</span> but our <span class=\"wl wl-kjv\" data-code=\"H1472\">bodies,</span> and our lands:","19":"Wherefore shall we <span class=\"wl wl-kjv\" data-code=\"H4191\">die</span> before thine <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes,</span> both we and our <span class=\"wl wl-kjv\" data-code=\"H127\">land?</span> <span class=\"wl wl-kjv\" data-code=\"H7069\">buy</span> us and our <span class=\"wl wl-kjv\" data-code=\"H127\">land</span> for <span class=\"wl wl-kjv\" data-code=\"H3899\">bread,</span> and we and our <span class=\"wl wl-kjv\" data-code=\"H127\">land</span> will be <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> unto <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh:</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> us <span class=\"wl wl-kjv\" data-code=\"H2233\">seed,</span> that we may <span class=\"wl wl-kjv\" data-code=\"H2421\">live,</span> and not <span class=\"wl wl-kjv\" data-code=\"H4191\">die,</span> that the <span class=\"wl wl-kjv\" data-code=\"H127\">land</span> be not desolate.","20":"And <span class=\"wl wl-kjv\" data-code=\"H3130\">Joseph</span> <span class=\"wl wl-kjv\" data-code=\"H7069\">bought</span> all the <span class=\"wl wl-kjv\" data-code=\"H127\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt</span> for <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh;</span> for the <span class=\"wl wl-kjv\" data-code=\"H4714\">Egyptians</span> <span class=\"wl wl-kjv\" data-code=\"H4376\">sold</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> his <span class=\"wl wl-kjv\" data-code=\"H7704\">field,</span> because the <span class=\"wl wl-kjv\" data-code=\"H7458\">famine</span> <span class=\"wl wl-kjv\" data-code=\"H2388\">prevailed</span> over them: so the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> became Pharaoh's.","21":"And as for the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> he <span class=\"wl wl-kjv\" data-code=\"H5674\">removed</span> them to <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> from one <span class=\"wl wl-kjv\" data-code=\"H7097\">end</span> of the <span class=\"wl wl-kjv\" data-code=\"H1366\">borders</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt</span> even to the other end","22":"Only the <span class=\"wl wl-kjv\" data-code=\"H127\">land</span> of the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests</span> bought <span class=\"wl wl-kjv\" data-code=\"H7069\">he</span> not; for the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests</span> had a <span class=\"wl wl-kjv\" data-code=\"H2706\">portion</span> assigned them of <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh,</span> and did <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> their <span class=\"wl wl-kjv\" data-code=\"H2706\">portion</span> which <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> them: wherefore they <span class=\"wl wl-kjv\" data-code=\"H4376\">sold</span> not their lands.","23":"Then <span class=\"wl wl-kjv\" data-code=\"H3130\">Joseph</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> Behold, I have <span class=\"wl wl-kjv\" data-code=\"H7069\">bought</span> you this <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> and your <span class=\"wl wl-kjv\" data-code=\"H127\">land</span> for <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh:</span> <span class=\"wl wl-kjv\" data-code=\"H1887\">lo,</span> here is <span class=\"wl wl-kjv\" data-code=\"H2233\">seed</span> for you, and ye shall <span class=\"wl wl-kjv\" data-code=\"H2232\">sow</span> the land.","24":"And it shall come to pass in the <span class=\"wl wl-kjv\" data-code=\"H8393\">increase,</span> that ye shall <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> the <span class=\"wl wl-kjv\" data-code=\"H2549\">fifth</span> part unto <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh,</span> and <span class=\"wl wl-kjv\" data-code=\"H702\">four</span> <span class=\"wl wl-kjv\" data-code=\"H3027\">parts</span> shall be your own, for <span class=\"wl wl-kjv\" data-code=\"H2233\">seed</span> of the <span class=\"wl wl-kjv\" data-code=\"H7704\">field,</span> and for your <span class=\"wl wl-kjv\" data-code=\"H400\">food,</span> and for them of your <span class=\"wl wl-kjv\" data-code=\"H1004\">households,</span> and for <span class=\"wl wl-kjv\" data-code=\"H398\">food</span> for your little ones.","25":"And they <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Thou hast saved our <span class=\"wl wl-kjv\" data-code=\"H2421\">lives:</span> let us <span class=\"wl wl-kjv\" data-code=\"H4672\">find</span> <span class=\"wl wl-kjv\" data-code=\"H2580\">grace</span> in the <span class=\"wl wl-kjv\" data-code=\"H5869\">sight</span> of my <span class=\"wl wl-kjv\" data-code=\"H113\">lord,</span> and we will be <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh's</span> servants.","26":"And <span class=\"wl wl-kjv\" data-code=\"H3130\">Joseph</span> <span class=\"wl wl-kjv\" data-code=\"H7760\">made</span> it a <span class=\"wl wl-kjv\" data-code=\"H2706\">law</span> over the <span class=\"wl wl-kjv\" data-code=\"H127\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt</span> unto this <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> that <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh</span> should have the <span class=\"wl wl-kjv\" data-code=\"H2569\">fifth</span> part; <span class=\"wl wl-kjv\" data-code=\"H7535\">except</span> the <span class=\"wl wl-kjv\" data-code=\"H127\">land</span> of the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests</span> only, which became not Pharaoh's.","27":"And <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelt</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">country</span> of <span class=\"wl wl-kjv\" data-code=\"H1657\">Goshen;</span> and they had <span class=\"wl wl-kjv\" data-code=\"H270\">possessions</span> therein, and <span class=\"wl wl-kjv\" data-code=\"H6509\">grew,</span> and <span class=\"wl wl-kjv\" data-code=\"H7235\">multiplied</span> exceedingly.","28":"And <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> <span class=\"wl wl-kjv\" data-code=\"H2421\">lived</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt</span> <span class=\"wl wl-kjv\" data-code=\"H6240\">seventeen</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years:</span> so the whole <span class=\"wl wl-kjv\" data-code=\"H2416\">age</span> of <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> was an <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> <span class=\"wl wl-kjv\" data-code=\"H705\">forty</span> and <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> years.","29":"And the <span class=\"wl wl-kjv\" data-code=\"H3117\">time</span> drew <span class=\"wl wl-kjv\" data-code=\"H7126\">nigh</span> that <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> must <span class=\"wl wl-kjv\" data-code=\"H4191\">die:</span> and he <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> his <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> <span class=\"wl wl-kjv\" data-code=\"H3130\">Joseph,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, If now I have <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> <span class=\"wl wl-kjv\" data-code=\"H2580\">grace</span> in thy <span class=\"wl wl-kjv\" data-code=\"H5869\">sight,</span> <span class=\"wl wl-kjv\" data-code=\"H7760\">put,</span> I pray thee, thy <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> under my <span class=\"wl wl-kjv\" data-code=\"H3409\">thigh,</span> and <span class=\"wl wl-kjv\" data-code=\"H6213\">deal</span> <span class=\"wl wl-kjv\" data-code=\"H2617\">kindly</span> and <span class=\"wl wl-kjv\" data-code=\"H571\">truly</span> with me; <span class=\"wl wl-kjv\" data-code=\"H6912\">bury</span> me not, I pray thee, in Egypt:","30":"But I will <span class=\"wl wl-kjv\" data-code=\"H7901\">lie</span> with my <span class=\"wl wl-kjv\" data-code=\"H1\">fathers,</span> and thou shalt <span class=\"wl wl-kjv\" data-code=\"H5375\">carry</span> me out of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> and <span class=\"wl wl-kjv\" data-code=\"H6912\">bury</span> me in their <span class=\"wl wl-kjv\" data-code=\"H6900\">buryingplace.</span> And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> I will <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> as thou hast said.","31":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H7650\">Swear</span> unto me. And he <span class=\"wl wl-kjv\" data-code=\"H7650\">sware</span> unto him. And <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H7812\">bowed</span> himself upon the <span class=\"wl wl-kjv\" data-code=\"H4296\">bed's</span> head."},"bijbeluitleg":{"kanttekeningen_nl":{"2":[{"catchword":"een deel","tekst":"Hebr. het einde, of, van het uiterste; dat is, [zoals enigen verstaan] van de jongsten en van de oudsten. Anders, van de aanzienlijkste, of, die in aanzien uitstaken. Verg. Jdg 18:2; 1Ki 12:31; Isa 56:11; Eze 33:2."}],"3":[{"catchword":"zijn broeders","tekst":"Te weten, van Jozef."},{"catchword":"zijn schaapherders,","tekst":"Hebr. schaapherder, [of, vehoeder, want het Hebr. woord wordt somtijds breder genomen. Zie Amo 7:15 ] in het getal van een, dat is, ieder van uw knechten is een schaapherder."}],"4":[{"catchword":"om als","tekst":"Zij willen zeggen dat zij daar gekomen waren, niet om het recht der burgers, of dat der natuurlijke inlanders te genieten, maar alleen als vreemdelingen, om voor een tijd daar te mogen herbergen, om den zwaren honger, totdat zij gelegenheid zouden hebben om naar hun land weder te keren."}],"6":[{"catchword":"voor uw","tekst":"Zie boven, Gen 13:9."},{"catchword":"kloeke","tekst":"Hebr. mannen van sterkte, of kloekheid. Het Hebreeuwse woord betekent in het algemeen kracht, of vermogen, en het wordt gebruikt van tijdelijke middelen, Psa 49:7; Eze 28:5, van sterkte des lichaams, Ezr 4:23, van verstand, trouw, en standvastigheid in enige regering, Exo 18:21, Exo 18:25, van kracht en ervarenheid ten oorlog, Deu 3:18; Jdg 11:1, en 1Sa 18:17, idem, van vlijt en ervarenheid in de huishouding, Rth 3:11; Pro 31:10."}],"7":[{"catchword":"zegende","tekst":"Op een bijzondere wijze, als een patriarch, den koning in zijn groetenis voor alle eer en vriendschap, hem en den zijnen bewezen, dankende, en hem allerlei welvaart van God toewensende; verg. 1Sa 13:10, en 2Sa 8:10, alzo ook onder, vs.10."}],"8":[{"catchword":"Hoevele","tekst":"Dat is, hoe oud zijt gij? Zie boven, Gen 25:7."}],"9":[{"catchword":"De dagen","tekst":"Dat is, waarin ik dikwijls als een vreemdeling herwaarts en derwaarts heb moeten trekken en omzwerven; zie boven, Gen 17:8."},{"catchword":"kwaad zijn","tekst":"Jakob wil zeggen dat zijn leven is geweest vol arbeid, moeite, verdriet en ellende, ook meerder dan van zijn voorvaders."},{"catchword":"en hebben","tekst":"Want zijn vader Izak had geleefd 180 jaren, boven, Gen 35:28; zijn grootvader Abraham 175 jaren, boven, Gen 25:7, zijn overgrootvader Therah 205 jaren, boven, Gen 11:32. Jakob is gestorven oud zijnde 147 jaren."}],"11":[{"catchword":"in het land Raméses,","tekst":"Een deel van het land Gosen, waarin, naar sommiger gevoelen, gelegen was de stad Rameses; verg. Exo 1:11; zie ook Exo 12:37."}],"12":[{"catchword":"Jozef","tekst":"Naar de belofte gedaan boven, Gen 45:11, en herhaald onder, Gen 50:21."},{"catchword":"tot den mond","tekst":"Of, naar den mond des kleinen kinds, of des kindeken; dat is, naar den eis van het getal der kinderen. Anders, naar de gelegenheid, of wijze der kinderkens; dat is, zoals men de kindertjes pleegt te voeden, die men, zonder hun arbeid en verdienste, de spijs in den mond steekt."}],"13":[{"catchword":"geen brood","tekst":"Dat is, er was overgroot gebrek aan alle nooddruft. Dit groot gebrek was meest bij den gemenen man, omdat er geen brood te koop was. Van het woord brood, zie boven, Gen 3:19."},{"catchword":"raasden","tekst":"Verst, de inwoner des lands, die zo door den honger geperst waren, dat zij zeer moeilijk en als onzinnig werden, en nabij om tot beroerten uit te breken. Zie onder vs.18,19."}],"15":[{"catchword":"waarom zouden","tekst":"Dat is, waarom zult gij lijden als wij voor uw ogen van honger vergaan, nu wij geen geld meer hebben? Gij kondt het toch wel beteren."}],"17":[{"catchword":"het vee van schapen,","tekst":"Hieruit, alsook boven, vs.6, blijkt dat, ofschoon de schaapherders den Egyptenaars een gruwel waren, zij nochtans vee tot zekere gebruiken gehad hebben."},{"catchword":"voedde hen","tekst":"Hebr. leidde hen zoetJes."}],"18":[{"catchword":"het tweede","tekst":"Niet van den honger, maar het tweede jaar na het voorgaande, waarin zij hun beesten voor koren verwisseld hadden. Dit tweede jaar was het zevende van den duren tijd."},{"catchword":"aan mijn heer,","tekst":"Te weten, mits hem hetzelve voor koren over te laten."},{"catchword":"voor het aangezicht","tekst":"Dat is, dat mijn heer zien mag, en dat hij van ons meer eisen en ontvangen kan. Of, dat wij mijn heer zouden kunnen voortbrengen om koren te kopen."}],"19":[{"catchword":"als ons","tekst":"Versta, door het sterven des lands, de verwoesting, gelijk in het einde van het vers verklaard wordt. Anders, wij en ons land zijn [nog], te weten, overig: koop ons, enz."},{"catchword":"dienstbaar zijn","tekst":"Hebr. knechten, of slaven zijn."},{"catchword":"zaad, opdat","tekst":"Om te zaaien."}],"20":[{"catchword":"zo werd","tekst":"Tevoren had het land Faraö wel toebehoord, door het recht van het opperste gebied, maar nu kwam het hem ook toe door het recht van eigendom."}],"21":[{"catchword":"dat zette","tekst":"Hebr. hij deed hen overgaan. Hij wil zeggen dat hij het volk, het gehele land door, van zijn woonplaats deed veranderen, uit de ene stad of hoek des lands, waar hun goederen gelegen waren, in een anderen, waar het Faraö beliefde hen heen te zenden, opdat het inderdaad blijken zou dat zij voortaan niets eigens hadden, maar dat het gehele land den koning volkomenlijk toekwam."},{"catchword":"van het ene","tekst":"Dat is, van den enen uitersten landpaal tot den anderen."}],"22":[{"catchword":"der priesters kocht","tekst":"Versta, zulke personen, die van den godsdienst en de wijsheid der Egyptenaars hun werk hadden, die, daar zij hun onderhoud van den koning ontvingen, hun land niet behoefden te verkopen. Eenigen zetten het over ambtlieden, omdat het Hebreeuwse woord [doch zelden] dit betekent. Zie boven, Gen 41:45."}],"23":[{"catchword":"opdat gij","tekst":"Hieruit is af te nemen dat dit geschied is in het laatste jaar van den duren tijd. Verg. de aantekeningen boven, vs.18."}],"24":[{"catchword":"delen zullen","tekst":"Hebr. handen; dat is, delen, gelijk boven, Gen 43:34."}],"25":[{"catchword":"leven behouden;","tekst":"Hebr. levend gemaakt; dat is, in het leven behouden; aldus boven, Gen 6:19, en Gen 45:7; de Egyptenaars verklaren dat zij met de voorgeslagen conditie, van Faraö's akkers te bebouwen, wel tevreden waren; en zij achtten dat hun nog grote beleefdheid of gunst geschiedde."},{"catchword":"genade vinden","tekst":"Zie deze manier van spreken, boven, Gen 18:3."},{"catchword":"knechten zijn","tekst":"Dat is, lijfeigenen."}],"26":[{"catchword":"een wet,","tekst":"Of, inzetting, ordinantie, recht, wijze, gebruik."},{"catchword":"tot op dezen","tekst":"Dat is, welke wet nog tot heden toe duurt."},{"catchword":"dat Faraö het","tekst":"Dat is, dat het land Faraö's eigen zou zijn, met het vijfde deel der inkomsten."}],"29":[{"catchword":"zo leg","tekst":"Zie boven, Gen 24:2."},{"catchword":"begraaf mij","tekst":"Hij versterkt zich hiermede in het geloof aan Gods belofte, en wil door zijn exempel al de zijnen tot volharding in hetzelve vermanen. Insgelijkss deed Jozef, onder, Gen 50:24-25."}],"30":[{"catchword":"hun graf","tekst":"Te weten, in het graf van Abraham en Izak, in het land Kanaän, in de spelonk Machpela in Hebron; zie boven, Gen 23:19, en Gen 25:9, en Gen 35:29."}],"31":[{"catchword":"hij zeide","tekst":"Namelijk, Jakob."},{"catchword":"hij zwoer","tekst":"Namelijk, JoZEf."},{"catchword":"boog zich","tekst":"Te weten, voor den Heere; dat is, hij riep God aan, hem dankende voor de versterking zijns geloofs, die hij uit Jozefs belofte en eed verkregen had."},{"catchword":"ten hoofde","tekst":"Vanwege zijn zwakheid in het bed zittende, en niet kunnende opstaan, om staande of knielende te bidden."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Then came Joseph, and related unto Pharao and said; My father, and my brethren, and their sheep, and their oxen, with all that they have, are come out of the land of Canaan: and behold, they are in the land of Gosen."}],"2":[{"catchword":null,"tekst":"And he took some of his brethren; [Heb. the end, or, the extremity, or, the uttermost; that is, as some do understand it, some of the youngest, and some of the eldest. Oth. Of the most presentable, those of the best presence; Compare Jud. 18. 2. 1 Kings 12. 31. Isa. 56. 11. Ezek. 33. 2.] (to wit,) five men, and he put them before Pharao&acirc;&euro;&trade;s face."}],"3":[{"catchword":null,"tekst":"Then said Pharao to his [viz. Josephs] brethren; what is your employment? And they said to Pharao; Thy Servants are Shepherds, both we, and our fathers. [Heb. Shepherd, or, Herdsman, (for the Hebrew word is sometimes taken in a larger sense; see Amos 7. Verse 15.) in the singular number, implying thus much: we are every one of us a Shepherd.]"}],"4":[{"catchword":null,"tekst":"Further said they unto Pharao; we are come to dwell as strangers (or, to sojourn) in this land: [as if they should have said, They were come there, not to desire or enjoy the right of the Citizens, or Native inhabitants of the Country; but only as strangers, to procure some harbor and shelter there for a time, in regard of the grievous famine in their own Country, until they should have opportunity to return thither again.] for there is no pasture for the sheep, which thy Servants have, because the famine is grievous in the land of Canaan; and now let thy Servants (we pray) dwell in the land of Gosen.]"}],"5":[{"catchword":null,"tekst":"Then Pharao spoke to Joseph, saying; Thy father and thy brethren are come unto thee."}],"6":[{"catchword":null,"tekst":"The land of Egypt is before thy face [See above 13. On verse 9.] cause thy father, and thy brethren, to dwell in the best of the land: let them dwell in the land of Gosen: and if thou know that there be able men among them, [Heb. men of strength, or, valour. The Hebrew word generally signifies power or ability; and it is used of temporal means, Psalm 49. 7. Ezech. 28. 5. Of strength of body, Ezra 4. 23. Of understanding, faithfulness, and steadfastness in any Government, Exod. 18. 21, and 25. Of valour and experience in war, Deut. 3. 18. Jud. 11. 3. And 1 Sam. 18. 17. Item, of care, diligence, and expert readiness in household affairs, Ruth 3. 11. Prov. 31. 10.] Set them to (be) Cattle-masters, over that which I have."}],"7":[{"catchword":null,"tekst":"And Joseph brought his father Jacob along, and put him before Pharao&acirc;&euro;&trade;s face: and Jacob blessed Pharao. [After a peculiar manner, as a Patriarch, giving thanks to the King in his greatness, for all the honour and friendship showed to himself and his, and wishing him all prosperity from God. Compare 1 Sam. 13. 10. And 2 Sam. 8. 10. As also below verse 10.]"}],"8":[{"catchword":null,"tekst":"And Pharao said to Jacob; How many are the days of the years of thy life? [i.e. how old art thou? See above chap. 25. 7.]"}],"9":[{"catchword":null,"tekst":"And Jacob said to Pharao; The days of the years of my strangerships, [i.e. wherein I have often been constrained to travel and wander to and fro like a stranger: See above chap. 17. On verse 8.] are, an hundred and thirty years: few and evil have been the days of my life, [i.e. it hath been full of labour and toil, trouble and vexation, more than my fore-fathers had in theirs.] et they have not reached to the days of the years of the lives of my fathers in the days of their strangerships. [for his father Isaac had lived an hundred and eighty years, above chap. 35. 28. His grand-father Abraham an hundred seventy five, above chap. 25. 7. His great grand-father Thara two hundred and five years, above chap. 11. 32. Jacob died at the age of an hundred fourty seven.]"}],"10":[{"catchword":null,"tekst":"And Jacob blessed Pharao: and went forth from Pharao&acirc;&euro;&trade;s face."}],"11":[{"catchword":null,"tekst":"And Joseph appointed Jacob and his brethren habitations, and he gave them a possession in the land of Egypt, in the best (part) of the land, in the land of Rameses; [being a part of the land of Gosen, wherein, as some do hold, the City of Rameses was situated. Compare Exo. 1. 11. See also Exod. 12. 37.] so as Pharao had commanded."}],"12":[{"catchword":null,"tekst":"And Joseph entertained his father, and his brethren, and all the house of his father&acirc;&euro;&trade;s, [according to his promise made, above chap. 45. 11. And repeated below, ch. 50. Verse 21.] with bread, unto the mouth of the little (ones?) [or, according to the mouth of // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);

function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
