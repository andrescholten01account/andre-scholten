ntwintig jaar oud; dit waren de jaren van het leven van Sara.","2":"Sara stierf te Kiriath-arba, dat is Hebron, in het land Kanaän; en Abraham kwam om Sara te beklagen en haar te bewenen.","3":"Daarna stond Abraham op van bij zijn dode, en hij sprak tot de zonen van Heth en zei:","4":"Ik ben een vreemdeling en inwoner bij u; geef mij een eigen graf bij u, zodat ik mijn dode van voor mijn aangezicht kan begraven.","5":"En de zonen van Heth antwoordden Abraham en zeiden tegen hem:","6":"Hoor ons, mijn heer! U bent een vorst van God in het midden van ons; begraaf uw dode in het beste van onze graven; niemand van ons zal zijn graf voor u weren, zodat u uw dode zou kunnen begraven.","7":"Toen stond Abraham op, en boog zich neer voor het volk van het land, voor de zonen van Heth;","8":"En hij sprak met hen en zei: Als het naar uw wil is, dat ik mijn dode begraaf van voor mijn aangezicht; hoor mij dan, en spreek voor mij bij Efron, de zoon van Zohar,","9":"Dat hij mij de spelonk van Machpela geeft, die hij heeft, die aan het eind van zijn akker is; dat hij die mij voor het volle geld geeft, tot een eigen graf in het midden van u.","10":"Efron nu zat in het midden van de zonen van Heth; en Efron de Hethiet antwoordde Abraham, ten aanhoren van de zonen van Heth, van allen die door de poort van zijn stad naar binnen gingen, en zei:","11":"Nee, mijn heer! Hoor mij; de akker geef ik u; ook de spelonk die daarin is, die geef ik u; voor de ogen van de zonen van mijn volk geef ik u die; begraaf uw dode.","12":"Toen boog Abraham zich neer voor het aangezicht van het volk van het land;","13":"En hij sprak tot Efron, ten aanhoren van het volk van het land, en zei: Trouwens, als u het toch wilt geven, hoor mij dan alstublieft; ik zal het geld van de akker geven; neem het van mij aan, dan zal ik mijn dode daar begraven.","14":"En Efron antwoordde Abraham en zei tegen hem:","15":"Mijn heer! Hoor mij; een stuk land van vierhonderd sikkel van het zilver, wat is dat tussen mij en u? Begraaf toch uw dode.","16":"En Abraham luisterde naar Efron; en Abraham woog Efron het geld af, waarover hij gesproken had ten aanhoren van de zonen van Heth, vierhonderd sikkel van het zilver, gangbaar bij de koopman.","17":"Zo werd de akker van Efron, die in Machpela was, tegenover Mamre lag, de akker en de spelonk die daarin was, en al het geboomte dat op de akker stond, dat rondom in zijn hele gebied lag, aan Abraham toegewezen,","18":"Tot een bezitting, voor de ogen van de zonen van Heth, bij allen die de poort van zijn stad binnengingen.","19":"En daarna begroef Abraham zijn vrouw Sara in de spelonk van de akker van Machpela, tegenover Mamre, dat is Hebron, in het land Kanaän.","20":"Zo werd die akker, en de spelonk die daarin was, door de zonen van Heth aan Abraham toegewezen tot een eigen graf."},"SV":{"1":"En het leven van Sara was honderd zeven en twintig jaren; *dit* *waren* de jaren des levens van Sara.","2":"En Sara stierf te Kiriath-arba, dat *is* Hebron, in het land Kanaän; en Abraham kwam om Sara te beklagen, en haar te bewenen.","3":"Daarna stond Abraham op van het aangezicht van zijner dode, en hij sprak tot de zonen Heths, zeggende:","4":"Ik *ben* een vreemdeling en inwoner bij u; geeft mij een erfbegrafenis bij u, opdat ik mijn dode van voor mijn aangezicht begrave.","5":"En de zonen Heths antwoordden, Abraham, zeggende tot hem:","6":"Hoor ons, mijn heer! gij zijt een vorst Gods in het midden van ons; begraaf uw dode in de keure onzer graven; niemand van ons zal zijn graf voor u weren, dat gij uw dode niet zoudt begraven.","7":"Toen stond Abraham op, en boog zich neder voor het volk des lands, voor de zonen Heths;","8":"En hij sprak met hen, zeggende: Is het met uw wil, dat ik mijn dode begrave van voor mijn aangezicht; zo hoort mij, en spreekt voor mij bij Efron, den zoon van Zohar,","9":"Dat hij mij geve de spelonk van Machpela, die hij heeft, die in het einde van zijn akker is, dat hij dezelve mij om het volle geld geve, tot een erfbegrafenis in het midden van u.","10":"Efron nu zat in het midden van de zonen Heths; en Efron de Hethiet antwoordde Abraham, voor de oren van de zonen Heths, van al degenen, die ter poorte zijner stad ingingen, zeggende:","11":"Neen, mijn heer! hoor mij; den akker geef ik u; ook de spelonk, die daarin is, die geef ik u; voor de ogen van de zonen mijns volks geef ik u die; begraaf uw dode.","12":"Toen boog zich Abraham neder voor het aangezicht van het volk des lands;","13":"En hij sprak tot Efron, voor de oren van het volk des lands, zeggende: Trouwens, *zijt* gij het? lieve, hoor mij; ik zal het geld des akkers geven; neem het van mij, zo zal ik mijn dode aldaar begraven.","14":"En Efron antwoordde Abraham, zeggende tot hem:","15":"Mijn heer! hoor mij; een land van vierhonderd sikkelen zilvers, wat *is* dat tussen mij en tussen u? begraaf slechts uw dode.","16":"En Abraham luisterde naar Efron; en Abraham woog Efron het geld, waarvan hij gesproken had voor de oren van de zonen Heths, vierhonderd sikkelen zilvers, onder den koopman gangbaar.","17":"Alzo werd de akker van Efron, die in Machpela *was*, dat tegenover Mamre *lag*, de akker en de spelonk, die daarin *was*, en al het geboomte, dat op den akker *stond*, dat rondom in zijn ganse landpale was gevestigd,","18":"Aan Abraham tot een bezitting, voor de ogen van de zonen Heths, bij allen, die tot zijn stadspoort ingingen.","19":"En daarna begroef Abraham zijn huisvrouw Sara in de spelonk des akkers van Machpela, tegenover Mamre, hetwelk is Hebron, in het land Kanaän.","20":"Alzo werd die akker, en de spelonk die daarin was, aan Abraham gevestigd tot een erfbegrafenis van de zonen Heths."},"KJV":{"1":"And Sarah was an hundred and seven and twenty years old: *these were* the years of the life of Sarah.","2":"And Sarah died in Kirjatharba; the same *is* Hebron in the land of Canaan: and Abraham came to mourn for Sarah, and to weep","3":"And Abraham stood up from before his dead, and spake unto the sons of Heth, saying,","4":"I *am* a stranger and a sojourner with you: give me a possession of a buryingplace with you, that I may bury my dead out of my sight.","5":"And the children of Heth answered Abraham, saying","6":"Hear us, my lord: thou *art* a mighty prince among us: in the choice of our sepulchres bury thy dead; none of us shall withhold from thee his sepulchre, but that thou mayest bury thy dead.","7":"And Abraham stood up, and bowed himself to the people of the land, *even* to the children of Heth.","8":"And he communed with them, saying, If it be your mind that I should bury my dead out of my sight; hear me, and intreat for me to Ephron the son of Zohar,","9":"That he may give me the cave of Machpelah, which he hath, which *is* in the end of his field; for as much money as it is worth he shall give it me for a possession of a buryingplace amongst you.","10":"And Ephron dwelt among the children of Heth: and Ephron the Hittite answered Abraham in the audience of the children of Heth, *even* of all that went in at the gate of his city, saying,","11":"Nay, my lord, hear me: the field give I thee, and the cave that *is* therein, I give it thee; in the presence of the sons of my people give I it thee: bury thy dead.","12":"And Abraham bowed down himself before the people of the land.","13":"And he spake unto Ephron in the audience of the people of the land, saying, But if thou *wilt give it*, I pray thee, hear me: I will give thee money for the field; take *it* of me, and I will bury my dead","14":"And Ephron answered Abraham, saying","15":"My lord, hearken unto me: the land *is worth* four hundred shekels of silver; what *is* that betwixt me and thee? bury therefore thy dead.","16":"And Abraham hearkened unto Ephron; and Abraham weighed to Ephron the silver, which he had named in the audience of the sons of Heth, four hundred shekels of silver, current *money* with the merchant.","17":"And the field of Ephron, which *was* in Machpelah, which *was* before Mamre, the field, and the cave which *was* therein, and all the trees that *were* in the field, that *were* in all the borders round about, were made sure","18":"Unto Abraham for a possession in the presence of the children of Heth, before all that went in at the gate of his city.","19":"And after this, Abraham buried Sarah his wife in the cave of the field of Machpelah before Mamre: the same *is* Hebron in the land of Canaan.","20":"And the field, and the cave that *is* therein, were made sure unto Abraham for a possession of a buryingplace by the sons of Heth."}},"tsk":{"1":[{"kopje":"honderdzevenentwintig jaar","refs":["Gen 17:17"]}],"2":[{"kopje":"Kiriath-arba","refs":["Gen 23:19","Gen 13:18","Num 13:22","Joz 10:39","Joz 14:14","Joz 14:15","Joz 20:7","Richt 1:10","1 Sam 20:31","2 Sam 2:11","2 Sam 5:3","2 Sam 5:5","1 Kron 6:57"]},{"kopje":"kwam","refs":["Gen 23:19"]},{"kopje":"bewenen","refs":["Gen 27:41","Gen 50:10","Num 20:29","Deut 34:8","1 Sam 28:3","2 Sam 1:12","2 Sam 1:17","2 Kron 35:25","Jer 22:10","Jer 22:18","Ezech 24:16-18","Joh 11:31","Joh 11:35","Hand 8:2"]}],"3":[{"kopje":"Heth","refs":["Gen 23:5","Gen 23:7","Gen 10:15","Gen 25:10","Gen 27:46","Gen 49:30","1 Sam 26:6","2 Sam 23:39"]}],"4":[{"kopje":"vreemdeling","refs":["Gen 17:8","Gen 47:9","Lev 25:23","1 Kron 29:15","Ps 39:13","Ps 105:12","Ps 105:13","Ps 119:19","Hebr 11:9","Hebr 11:13-16","1 Petr 2:11"]},{"kopje":"graf","refs":["Gen 3:19","Gen 49:30","Gen 50:13","Job 30:23","Pred 6:3","Pred 12:5","Pred 12:7","Hand 7:5"]},{"kopje":"begraven","refs":["Gen 23:19"]}],"6":[{"kopje":"mijn heer","refs":["Gen 18:12","Gen 24:18","Gen 24:35","Gen 31:35","Gen 32:4","Gen 32:5","Gen 32:18","Gen 42:10","Gen 44:5","Gen 44:8","Ex 32:22","Ruth 2:13"]},{"kopje":"een vorst van God","refs":["Gen 21:22","Jes 45:14","1 Joh 3:1","1 Joh 3:2"]},{"kopje":"vorst","refs":["Gen 13:2","Gen 14:14","Gen 24:35"]}],"8":[{"kopje":"spreek voor mij","refs":["1 Kon 2:17","Luk 7:3","Luk 7:4","Hebr 7:26","1 Joh 2:1","1 Joh 2:2"]}],"9":[{"kopje":"het volle geld","refs":[ ode=\"H5971\">people</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> But if thou wilt give it, I pray <span class=\"wl wl-kjv\" data-code=\"H3863\">thee,</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">hear</span> me: I will <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> thee <span class=\"wl wl-kjv\" data-code=\"H3701\">money</span> for the <span class=\"wl wl-kjv\" data-code=\"H7704\">field;</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> it of me, and I will <span class=\"wl wl-kjv\" data-code=\"H6912\">bury</span> my dead","14":"And <span class=\"wl wl-kjv\" data-code=\"H6085\">Ephron</span> <span class=\"wl wl-kjv\" data-code=\"H6030\">answered</span> <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham,</span> saying","15":"My <span class=\"wl wl-kjv\" data-code=\"H113\">lord,</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">hearken</span> unto me: the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> is worth <span class=\"wl wl-kjv\" data-code=\"H702\">four</span> <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> <span class=\"wl wl-kjv\" data-code=\"H8255\">shekels</span> of <span class=\"wl wl-kjv\" data-code=\"H3701\">silver;</span> what is that <span class=\"wl wl-kjv\" data-code=\"H996\">betwixt</span> me and thee? <span class=\"wl wl-kjv\" data-code=\"H6912\">bury</span> therefore thy dead.","16":"And <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">hearkened</span> unto <span class=\"wl wl-kjv\" data-code=\"H6085\">Ephron;</span> and <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham</span> <span class=\"wl wl-kjv\" data-code=\"H8254\">weighed</span> to <span class=\"wl wl-kjv\" data-code=\"H6085\">Ephron</span> the <span class=\"wl wl-kjv\" data-code=\"H3701\">silver,</span> which he had <span class=\"wl wl-kjv\" data-code=\"H1696\">named</span> in the <span class=\"wl wl-kjv\" data-code=\"H241\">audience</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H2845\">Heth,</span> <span class=\"wl wl-kjv\" data-code=\"H702\">four</span> <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> <span class=\"wl wl-kjv\" data-code=\"H8255\">shekels</span> of <span class=\"wl wl-kjv\" data-code=\"H3701\">silver,</span> <span class=\"wl wl-kjv\" data-code=\"H5674\">current</span> money with the merchant.","17":"And the <span class=\"wl wl-kjv\" data-code=\"H7704\">field</span> of <span class=\"wl wl-kjv\" data-code=\"H6085\">Ephron,</span> which was in <span class=\"wl wl-kjv\" data-code=\"H4375\">Machpelah,</span> which was <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> <span class=\"wl wl-kjv\" data-code=\"H4471\">Mamre,</span> the <span class=\"wl wl-kjv\" data-code=\"H7704\">field,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4631\">cave</span> which was therein, and all the <span class=\"wl wl-kjv\" data-code=\"H6086\">trees</span> that were in the <span class=\"wl wl-kjv\" data-code=\"H7704\">field,</span> that were in all the <span class=\"wl wl-kjv\" data-code=\"H1366\">borders</span> round <span class=\"wl wl-kjv\" data-code=\"H5439\">about,</span> were made sure","18":"Unto <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham</span> for a <span class=\"wl wl-kjv\" data-code=\"H4736\">possession</span> in the <span class=\"wl wl-kjv\" data-code=\"H5869\">presence</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H2845\">Heth,</span> before all that went <span class=\"wl wl-kjv\" data-code=\"H935\">in</span> at the <span class=\"wl wl-kjv\" data-code=\"H8179\">gate</span> of his city.","19":"And <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> <span class=\"wl wl-kjv\" data-code=\"H3651\">this,</span> <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham</span> <span class=\"wl wl-kjv\" data-code=\"H6912\">buried</span> <span class=\"wl wl-kjv\" data-code=\"H8283\">Sarah</span> his <span class=\"wl wl-kjv\" data-code=\"H802\">wife</span> in the <span class=\"wl wl-kjv\" data-code=\"H4631\">cave</span> of the <span class=\"wl wl-kjv\" data-code=\"H7704\">field</span> of <span class=\"wl wl-kjv\" data-code=\"H4375\">Machpelah</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> <span class=\"wl wl-kjv\" data-code=\"H4471\">Mamre:</span> the same is <span class=\"wl wl-kjv\" data-code=\"H2275\">Hebron</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of Canaan.","20":"And the <span class=\"wl wl-kjv\" data-code=\"H7704\">field,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4631\">cave</span> that is therein, were made <span class=\"wl wl-kjv\" data-code=\"H6965\">sure</span> unto <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham</span> for a <span class=\"wl wl-kjv\" data-code=\"H272\">possession</span> of a <span class=\"wl wl-kjv\" data-code=\"H6913\">buryingplace</span> by the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of Heth."},"bijbeluitleg":{"kanttekeningen_nl":{"2":[{"catchword":"Kiriath-Arba,","tekst":"Anders, in de stad Arba. Sommigen houden dezen naam gekomen te zijn van een reus, bouwer dezer stad. Zie Jos 14:15 en Jos 15:13."},{"catchword":"Hebron,","tekst":"Een stad, die daarna in den stam van Juda geweest is, gelegen bij het eikenveld Mamre, waar Abraham langen tijd gewoond heeft. Zie voorts boven, Gen 13:18"},{"catchword":"kwam om","tekst":"Te weten, in de tent zijner vrouw. Zie boven Gen 18:6, Gen 18:9."},{"catchword":"te beklagen","tekst":"Dit gebruik is bij de vromen vanouds af geweest, om hun droefenis te verklaren in het algemeen over de ellende aller mensen, en in het bijzonder over het tijdelijk verlies van hun vrienden, of enige uitnemende personen. Zie hiervan ond. Gen 50:3; Deu 34:8; 1Sa 25:1; 2Sa 3:32; Act 8:39, enz. Welk gebruik bijgelovig door de ongelovigen nagebootst is geweest. Zie Mar 5:38-39, enz."}],"3":[{"catchword":"op van","tekst":"Als een gelovig patriarch, zijn droefenis en rouw over Sara matigende, willende haar nu een eerlijke begrafenis in een vreemd land bezorgen."},{"catchword":"zonen","tekst":"Anders, kinderen; alzo ook vs.5, 7, 10,11, 16, 18, 20. Dat is, tot de regenten, of voornaamsten der Hethieten, die Kanaänieten waren, afkomstig van Heth, Chams kindskind. Zie boven, Gen 10:15."}],"4":[{"catchword":"opdat","tekst":"De begrafenis der dode lichamen is van oude tijden af bij de mensen gebruikelijk geweest, gelijk hier blijkt, en uit het volgende vers vs.5, omdat de natuur leert, dat men het ene deel des redelijken mensen niet behoort weg te werpen tot ontering en schending en de religie ons vermaant hetzelve te bewaren en op te sluiten tegen den dag der opstanding uit de doden. Zie onder Gen 50:5-6; Num 33:4; Deu 21:23; Job 5:26."}],"6":[{"catchword":"een vorst","tekst":"Dat is, met wien God is, gelijk bov. Gen 21:22, of een prins Gods, dat is, een voortreffelijk heer en vorst. Zie boven Gen 13:10."},{"catchword":"keur","tekst":"Dat is, in de beste, uitgelezenste der graven. Verg. Jer 22:7."}],"8":[{"catchword":"Is het","tekst":"Hebr. is het met uw ziel, of, zo het is met uw ziel. Het woord ziel betekent dikwijls wil, beliefte, goedvinden, gelijk Deu 21:14; 1Ki 19:3; 2Ki 9:15; Psa 27:12 en Psa 41:3, en Psa 105:22."},{"catchword":"Zohar","tekst":"Hebr. Tsochar, een Hethiet, en is te onderscheiden van een Zohar, die de zoon van Simeon was; onder Gen 46:10."}],"9":[{"catchword":"Machpéla,","tekst":"De eigennaam van dezen akker, gelijk blijkt vs.17, 19."},{"catchword":"volle","tekst":"Ten aanzien van den prijs des akkers, en van het gewicht des gelds."}],"10":[{"catchword":"Efron","tekst":"Hij was niet alleen een burger onder de Hethieten, maar een der voornaamsten onder hen, zittende in de vergadering voor welke Abraham verscheen. Aldus wordt het woord zitten genomen voor den staat der publieke raden of regeerders des volks; gelijk Psa 119:23."},{"catchword":"zijner","tekst":"Of, waar hij geboren was, gelijk Luk 2:3-4, of waar hij woonde, gelijk onder Gen 24:10; Mat 9:1."},{"catchword":"ingingen,","tekst":"Dat is, die burgers of inwoners der stad waren. Alzo onder, vs.18. Verg. Gen 34:24."}],"13":[{"catchword":"zijt gij","tekst":"Anders, maar of [lieve] zo gij het zijt, enz. Te weten, den man van wien ik spreek, namelijk Efron. Het schijnt dat Abraham hem kende bij naam maar niet van aangezicht, en dat Abraham niet geweten heeft dat Efron daar zat."},{"catchword":"ik zal","tekst":"Hebr. ik heb gegeven, dat is, ik ben gereed om te geven."}],"15":[{"catchword":"sikkelen","tekst":"De sikkel was een soort van munt, hebbende zijn naam van wegen; er waren tweeërlei, de algemene, wegende omtrent als een oord, of het vierde deel van een rijkdsdaalder; en de heilige, bedragende nog eens zoveel; zie boven Gen 20:16, waar van den zilverling [die van een prijs was] gesproken is. Aldus bedroeg deze som weinig meer dan 100 rijkdaalders, zijnde hier van den algemenen of burgerlijken sikkel gesproken."}],"16":[{"catchword":"woog","tekst":"Eertijds woog men elkander het geld toe, in het kopen en verkopen, gelijk men het nu elkander toetelt."}],"17":[{"catchword":"gevestigd,","tekst":"Hebr. stond, of stond op. Dat is, kwam en verbleef aan Abraham. Als ook ond. vs.20."}],"18":[{"catchword":"zijn stadspoort","tekst":"Zie bov. vs.10."}],"19":[{"catchword":"tegenover","tekst":"Hebr. tegen het aangezicht Mamre."},{"catchword":"Hebron,","tekst":"Zie bov. vs.2."},{"catchword":"in het","tekst":"Hetwelk wel Abraham en zijn zaad door God gegeven was, om te zijner tijd erfelijk te bezitten, maar daar hij vooralsnog een vreemdeling daarin was, heeft hij [gelijk ook andere gelovige voorvaders] begeerd daarin begraven te worden, tot een teken dat zij geloofden de beloftenis Gods, van dit land te zullen bezitten, hetwelk hun een pand was van het hemelse Kanaän."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"And the life of Sarah was an hundred and twenty seven years those were the years of the life of Sarah."}],"2":[{"catchword":null,"tekst":"And Sarah died at Kiarth-arba [others in the city of Arba some do hold it had a name of this giant so called the builder thereof see Jos 14:15 and 15.13] this is Hebron [ a city afterwards allotted to the tribe of Judah lying not far from the Oak-field of Mamre where Abraham had lived a long time see further above chapter 13 on verse 18] in the land of Canaan and Abraham came [viz. into the tent of his wife see above chapter 18.6,9] for to bemoan Sarah and bewail her [this was an ancient custom amongst the godly to manifest their grief and sorrow in general for the miserable mankind an din a particular for the temporal loss of their friends or any eminent person see hereof below chapter 50.3 Deu 34:8 1Sa 25:1 2Sa 3:32 Act 9:39 &c. which custom was superstitiously afterwards imitated by unbelievers see Mark 5 verse 38 ,39 &c.]"}],"3":[{"catchword":null,"tekst":"After that Abraham arose from the face of his dead [like a believing patriarch moderating the grief and mourning over Sarah and going about now to provide her an honorable interment in a strange country ] and he spake to the sons of Heth [others to the children of Heth and c. as also verse 5,7,10,11,16,18,19 that is the governors or principal men of the Hethites who were Canaanites of the race of Heth the grand child of Cham see above chapter 10.15] saying:"}],"4":[{"catchword":null,"tekst":"I am a stranger and inhabitant with you give me an hereditary burying place with you that I may bury my dead once from before my face [the burying of the dead bodies hath been a very ancient custom among men as appears by this and the next verse nature itself and teaching that the one part of the reasonable creature man ought not to be thrown away by the dishonored or abused by another and religion minding us to lay us and safe keep the same against the day of the resurrection from the dead. See below chapter, 50.5,6 Num 33:4 Deu 21:23. Job 5:26.]"}],"5":[{"catchword":null,"tekst":"And the sons of Heth answered Abraham saying to him."}],"6":[{"catchword":null,"tekst":"Hear us my Lord thou art a prince of God in the midst of us [that is with whom God is as above chapter 21.22 or a prince of God that is an excellent or very eminent Lord and prince see above chapter 13 on verse 10] bury thy dead one in the choice of our graves [that is the best and choicest we have compare Jer 2:7] none of us shall keep his grave from thee that thou shouldst not bury thy dead one."}],"7":[{"catchword":null,"tekst":"Then Abraham stood up and bowed up himself down before the people of the land before the sons of Heth."}],"8":[{"catchword":null,"tekst":"And he spake with them saying it is with your will? [Heb. It is with your soul? or if it be with your soul the word soul doth often times signify will contents allowance approbation as Deu 21:14 1Ki 19:32Ki_9:15 Psa 27:12 and 41.3 and 105.22] that I bury my dead from before my face? Therefore hear me and speak for me with Ephron the son of Zoar [Heb. Tsochar and Hethite who is distinguished from another Zoar that was the son of Simeon afterwards chapter 46.10.]"}],"9":[{"catchword":null,"tekst":"That he would give me the cave of Machpela [the proper name of this cave as appears verse 17 and 19] which he hath with which is at the end of the field that he would give it to me for the full money [in regard of the price of the ground and the weight and the value of the money] for an hereditary burying place in the midst of you."}],"10":[{"catchword":null,"tekst":"Now Ephron sate in the midst of the sons of Heth [he was not a citizen and Native of the Hethite but one of the principal men among them sitting in the assemble before which Abraham had represented himself thus the word sitting is taken for the state or place of the public counselors or governors of people as Psa 119:23] and Ephrone the Hethite answered Abraham before the ears of the sons Heth of all those which entered the gate [that is were citizens or inhabitants of the city so below verse 18 compare chapter 34.24] of his city [either were he was born as Luk 2:3,4 or where he dwelt as below chapter 24 verse 10. Mat 9:1] saying."}],"11":[{"catchword":null,"tekst":"No my Lord hear me the field I give thee also the cave that is in it I give thee the same before the eyes of the sons of my people do I give the same to bury thy dead."}],"12":[{"catchword":null,"tekst":"Then Abraham bowed himself down before the face of the people of the land."}],"13":[{"catchword":null,"tekst":"And he spake to Ephron before the people of the land saying throth art thou it? [Others but have indeed good now if thou be it &c. viz. Ephron it should seem that Abraham knew him by name though not by face and that Abraham did not know that Ephron was sitting there] hear me I will give money of the ground [Heb. I have given that is I am ready to give it and lay it down] take it of me so shall I bury my dead there."}],"14":[{"catchword":null,"tekst":"And the Ephron answered Abraham saying to him."}],"16":[{"catchword":null,"tekst":"And Abraham hearkened Ephron and Abraham weighed Ephron the money whereof he had spoken [of old it was the custom to weigh the money one to another in payments buying and selling as now the use is to tell it out to one another] before the ears of the sons of Heth four hundred shekels of silver currant among the merchants."}],"17":[{"catchword":null,"tekst":"Thus the field of Ephron that is the Machapela that lay over against Mamre the ground and the cave that was therein and all the trees that stood upon the ground that was round about the whole border thereof was established [ Heb. Stood or stood up that is it became remained Abrahams and so below verse 20.]"}],"18":[{"catchword":null,"tekst":"On Abraham for a possession before the eyes of the sons of Heth with all that went into the city gates [see above on verse 10.]"}],"19":[{"catchword":null,"tekst":"And after that Abraham buried his wife Sarah in thecae of the field Machapela over against Mamre [Heb. Against the face of Mamre ] which is Hebron [see above on verse 2] in the land of Canaan [which indeed was given to God to Abraham and his seed hereditarily to possess the same in due time but he having hitherto and still continuing a stranger in it therefore like to other faithful patriarchs he desires to be buried in it in token and testimony that they believed the promise of God touching the possession of this land which was a pledge unto them of the heavenly Canaan.]"}],"20":[{"catchword":null,"tekst":"Thus that ground and cave that was therein was established on Abraham for a hereditary burying place from the sons of Heth."}]}}};

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {

  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:Lora;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
