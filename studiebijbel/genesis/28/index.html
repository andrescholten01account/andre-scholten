de hem en gebood hem, en zei tegen hem: Neem geen vrouw van de dochters van Kanaän.","2":"Maak u op, ga naar Paddan-aram, naar het huis van Bethuel, de vader van uw moeder, en neem u vandaar een vrouw, van de dochters van Laban, de broer van uw moeder.","3":"En God, de Almachtige, zegent u, en maakt u vruchtbaar, en vermenigvuldigt u, zodat u tot een groep volken wordt.","4":"En Hij geeft u de zegen van Abraham; aan u, en uw nageslacht met u, zodat u het land van uw vreemdelingschap erfelijk bezit, dat God aan Abraham gegeven heeft.","5":"Zo zond Izak Jakob weg, zodat hij naar Paddan-aram trok, naar Laban, de zoon van Bethuel, de Syriër, de broer van Rebekka, de moeder van Jakob en Ezau.","6":"Toen Ezau nu zag dat Izak Jakob gezegend had, en hem naar Paddan-aram weggezonden had om zich vandaar een vrouw te nemen; en dat hij hem, terwijl hij hem zegende, geboden had en gezegd: Neem geen vrouw van de dochters van Kanaän;","7":"en dat Jakob zijn vader en zijn moeder gehoorzaam geweest was, en naar Paddan-aram getrokken was;","8":"en dat Ezau zag dat de dochters van Kanaän slecht waren in de ogen van Izak, zijn vader;","9":"toen ging Ezau naar Ismaël, en nam zich, naast zijn *andere* vrouwen, tot vrouw Mahalath, de dochter van Ismaël, de zoon van Abraham, de zuster van Nebajoth.","10":"Jakob dan trok weg van Ber-Seba, en ging naar Haran.","11":"En hij kwam op een plaats, waar hij overnachtte, want de zon was ondergegaan; en hij nam van de stenen van die plaats, en maakte er zijn hoofdkussen van, en legde zich te slapen op die plaats.","12":"En hij droomde, en zie, een ladder stond op de aarde opgesteld, waarvan de top tot de hemel reikte; en zie, de engelen van God klommen daarlangs op en neer.","13":"En zie, de HEERE stond boven op de ladder en zei: Ik ben de HEERE, de God van uw vader Abraham, en de God van Izak; dit land, waarop u ligt te slapen, zal Ik aan u geven, en aan uw nageslacht.","14":"En uw nageslacht zal zijn als het stof van de aarde, en u zult uitbreiden *in* *menigte*, westwaarts en oostwaarts, en noordwaarts en zuidwaarts; en in u, en in uw nageslacht zullen alle geslachten van de aardbodem gezegend worden.","15":"En zie, Ik ben met u, en Ik zal u behoeden overal waarheen u trekken zult, en Ik zal u terugbrengen naar dit land; want Ik zal u niet verlaten, totdat Ik gedaan heb wat Ik tot u gesproken heb.","16":"Toen Jakob nu uit zijn slaap ontwaakte, zei hij: Zeker is de HEERE op deze plaats, en ik heb het niet geweten!","17":"En hij vreesde, en zei: Hoe ontzagwekkend is deze plaats! Dit is niets anders dan een huis van God, en dit is de poort van de hemel!","18":"Toen stond Jakob 's morgens vroeg op, en hij nam de steen die hij als hoofdkussen gelegd had, en zette hem op als een opgericht teken, en goot er olie boven op.","19":"En hij noemde de naam van die plaats Beth-el; hoewel de naam van die stad vroeger Luz was.","20":"En Jakob deed een gelofte, en zei: Wanneer God met mij geweest zal zijn, en mij behoed zal hebben op deze weg die ik reis, en mij brood gegeven zal hebben om te eten, en kleren om aan te trekken;","21":"en ik in vrede naar het huis van mijn vader terugkeer, dan zal de HEERE mij tot een God zijn!","22":"En deze steen, die ik als opgericht teken gezet heb, zal een huis van God zijn; en van alles wat U mij geven zult, zal ik U zeker de tienden geven!"},"SV":{"1":"En Izak riep Jakob, en zegende hem; en gebood hem, en zeide tot hem: Neem geen vrouw van de dochteren van Kanaän.","2":"Maak u op, ga naar Paddan-aram, ten huize van Bethuël, den vader uwer moeder, en neem u van daar een vrouw, van de dochteren van Laban, uwer moeders broeder.","3":"En God almachtig zegene u, en make u vruchtbaar, en vermenigvuldige u, dat gij tot een hoop volken wordt.","4":"En Hij geve u den zegen van Abraham; aan u, en uw zaad met u, opdat gij erfelijk bezit het land uwer vreemdelingschappen, hetwelk God aan Abraham gegeven heeft.","5":"Alzo zond Izak Jakob weg, dat hij toog naar Paddan-aram, tot Laban, den zoon van Bethuël, den Syriër, den broeder van Rebekka, Jakobs en Ezau’s moeder.","6":"Als nu Ezau zag, dat Izak Jakob gezegend, en hem naar Paddan-aram weggezonden had om zich van daar een vrouw te nemen; *en* als hij hem zegende, dat hij hem geboden had, zeggende: Neem geen vrouw van de dochteren van Kanaän;","7":"En dat Jakob zijn vader en zijn moeder gehoorzaam geweest was, en naar Paddan-aram getrokken was;","8":"En dat Ezau zag, dat de dochteren van Kanaän kwaad waren in de ogen van Izak, zijn vader;","9":"Zo ging Ezau tot Ismaël, en nam zich tot een vrouw boven zijn vrouwen, Mahalath, de dochter van Ismaël, den zoon van Abraham, de zuster van Nebajoth.","10":"Jakob dan toog uit van Ber-seba, en ging naar Haran.","11":"En hij geraakte op een plaats, waar hij vernachtte; want de zon was ondergegaan; en hij nam van de stenen dier plaats, en maakte zijn hoofdpeluw, en leide zich te slapen te dierzelver plaats.","12":"En hij droomde; en ziet, een ladder was gesteld op de aarde, welker opperste aan den hemel raakte; en ziet, de engelen Gods klommen daarbij op en neder.","13":"En ziet, de HEERE stond op dezelve en zeide: Ik ben de HEERE, de God van uw vader Abraham, en de God van Izak; dit land, waarop gij ligt te slapen, zal Ik aan u geven, en aan uw zaad.","14":"En uw zaad zal wezen als het stof der aarde, en gij zult uitbreken *in* *menigte*, westwaarts en oostwaarts, en noordwaarts en zuidwaarts; en in u, en in uw zaad zullen alle geslachten des aardbodems gezegend worden.","15":"En zie, Ik ben met u, en Ik zal u behoeden overal, waarheen gij trekken zult, en Ik zal u wederbrengen in dit land; want Ik zal u niet verlaten, totdat Ik zal gedaan hebben, hetgeen Ik tot u gesproken heb.","16":"Toen nu Jakob van zijn slaap ontwaakte, zeide hij: Gewisselijk is de HEERE aan deze plaats, en ik heb het niet geweten!","17":"En hij vreesde, en zeide: Hoe vreselijk is deze plaats! Dit is niet dan een huis Gods, en dit is de poort des hemels!","18":"Toen stond Jakob des morgens vroeg op, en hij nam dien steen, dien hij tot zijn hoofdpeluw gelegd had, en zette hem tot een opgericht teken, en goot daar olie boven op.","19":"En hij noemde den naam dier plaats Beth-el; daar toch de naam dier stad te voren was Luz.","20":"En Jakob beloofde een gelofte, zeggende: Wanneer God met mij geweest zal zijn, en mij behoed zal hebben op dezen weg, dien ik reize, en mij gegeven zal hebben brood om te eten, en klederen om aan te trekken;","21":"En ik ten huize mijns vaders in vrede zal wedergekeerd zijn; zo zal de HEERE mij tot een God zijn!","22":"En deze steen, dien ik tot een opgericht teken gezet heb, zal een huis Gods wezen, en van alles, wat Gij mij geven zult, zal ik U voorzeker de tienden geven!"},"KJV":{"1":"And Isaac called Jacob, and blessed him, and charged him, and said unto him, Thou shalt not take a wife of the daughters of Canaan.","2":"Arise, go to Padanaram, to the house of Bethuel thy mother's father; and take thee a wife from thence of the daughters of Laban thy mother's brother.","3":"And God Almighty bless thee, and make thee fruitful, and multiply thee, that thou mayest be a multitude of people;","4":"And give thee the blessing of Abraham, to thee, and to thy seed with thee; that thou mayest inherit the land wherein thou art a stranger, which God gave unto Abraham.","5":"And Isaac sent away Jacob: and he went to Padanaram unto Laban, son of Bethuel the Syrian, the brother of Rebekah, Jacob's and Esau's mother.","6":"When Esau saw that Isaac had blessed Jacob, and sent him away to Padanaram, to take him a wife from thence; and that as he blessed him he gave him a charge, saying, Thou shalt not take a wife of the daughters of Canaan;","7":"And that Jacob obeyed his father and his mother, and was gone to Padanaram;","8":"And Esau seeing that the daughters of Canaan pleased not Isaac his father;","9":"Then went Esau unto Ishmael, and took unto the wives which he had Mahalath the daughter of Ishmael Abraham's son, the sister of Nebajoth, to be his wife.","10":"And Jacob went out from Beersheba, and went toward Haran.","11":"And he lighted upon a certain place, and tarried there all night, because the sun was set; and he took of the stones of that place, and put *them for* his pillows, and lay down in that place to sleep.","12":"And he dreamed, and behold a ladder set up on the earth, and the top of it reached to heaven: and behold the angels of God ascending and descending","13":"And, behold, the LORD stood above it, and said, I *am* the LORD God of Abraham thy father, and the God of Isaac: the land whereon thou liest, to thee will I give it, and to thy seed;","14":"And thy seed shall be as the dust of the earth, and thou shalt spread abroad to the west, and to the east, and to the north, and to the south: and in thee and in thy seed shall all the families of the earth be blessed.","15":"And, behold, I *am* with thee, and will keep thee in all *places* whither thou goest, and will bring thee again into this land; for I will not leave thee, until I have done *that* which I have spoken","16":"And Jacob awaked out of his sleep, and he said, Surely the LORD is in this place; and I knew","17":"And he was afraid, and said, How dreadful *is* this place! this *is* none other but the house of God, and this *is* the gate of heaven.","18":"And Jacob rose up early in the morning, and took the stone that he had put *for* his pillows, and set it up *for* a pillar, and poured oil upon the top of it.","19":"And he called the name of that place Bethel: but the name of that city *was called* Luz at the first.","20":"And Jacob vowed a vow, saying, If God will be with me, and will keep me in this way that I go, and will give me bread to eat, and raiment to put on,","21":"So that I come again to my father's house in peace; then shall the LORD be my God:","22":"And this stone, which I have set *for* a pillar, shall be God's house: and of all that thou shalt give me I will surely give the tenth"}},"tsk":{"1":[{"kopje":"zegende he n</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H5414\">zult</span>, <span class=\"wl\" data-l=\"L8\" data-code=\"H5414\">zal</span> <span class=\"wl\" data-l=\"L9\" data-code=\"H6237\">ik</span> <span class=\"wl\" data-l=\"L9\" data-code=\"H6237\">U</span> zeker <span class=\"wl\" data-l=\"L9\" data-code=\"H6237\">de</span> <span class=\"wl\" data-l=\"L9\" data-code=\"H6237\">tienden</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H5414\">geven</span>!"},"koppeling_kjv":{"1":"And <span class=\"wl wl-kjv\" data-code=\"H3327\">Isaac</span> <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob,</span> and <span class=\"wl wl-kjv\" data-code=\"H1288\">blessed</span> him, and <span class=\"wl wl-kjv\" data-code=\"H6680\">charged</span> him, and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, Thou shalt not <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> a <span class=\"wl wl-kjv\" data-code=\"H802\">wife</span> of the <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters</span> of Canaan.","2":"<span class=\"wl wl-kjv\" data-code=\"H6965\">Arise,</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> to <span class=\"wl wl-kjv\" data-code=\"H6307\">Padanaram,</span> to the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H1328\">Bethuel</span> thy <span class=\"wl wl-kjv\" data-code=\"H517\">mother's</span> <span class=\"wl wl-kjv\" data-code=\"H1\">father;</span> and <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> thee a <span class=\"wl wl-kjv\" data-code=\"H802\">wife</span> from thence of the <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters</span> of <span class=\"wl wl-kjv\" data-code=\"H3837\">Laban</span> thy <span class=\"wl wl-kjv\" data-code=\"H517\">mother's</span> brother.","3":"And <span class=\"wl wl-kjv\" data-code=\"H410\">God</span> <span class=\"wl wl-kjv\" data-code=\"H7706\">Almighty</span> <span class=\"wl wl-kjv\" data-code=\"H1288\">bless</span> thee, and make thee <span class=\"wl wl-kjv\" data-code=\"H6509\">fruitful,</span> and <span class=\"wl wl-kjv\" data-code=\"H7235\">multiply</span> thee, that thou mayest be a <span class=\"wl wl-kjv\" data-code=\"H6951\">multitude</span> of people;","4":"And <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> thee the <span class=\"wl wl-kjv\" data-code=\"H1293\">blessing</span> of <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham,</span> to thee, and to thy <span class=\"wl wl-kjv\" data-code=\"H2233\">seed</span> with thee; that thou mayest <span class=\"wl wl-kjv\" data-code=\"H3423\">inherit</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> wherein thou art a <span class=\"wl wl-kjv\" data-code=\"H4033\">stranger,</span> which <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> unto Abraham.","5":"And <span class=\"wl wl-kjv\" data-code=\"H3327\">Isaac</span> sent <span class=\"wl wl-kjv\" data-code=\"H7971\">away</span> <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob:</span> and he <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> to <span class=\"wl wl-kjv\" data-code=\"H6307\">Padanaram</span> unto <span class=\"wl wl-kjv\" data-code=\"H3837\">Laban,</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H1328\">Bethuel</span> the <span class=\"wl wl-kjv\" data-code=\"H761\">Syrian,</span> the <span class=\"wl wl-kjv\" data-code=\"H251\">brother</span> of <span class=\"wl wl-kjv\" data-code=\"H7259\">Rebekah,</span> <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob's</span> and <span class=\"wl wl-kjv\" data-code=\"H6215\">Esau's</span> mother.","6":"When <span class=\"wl wl-kjv\" data-code=\"H6215\">Esau</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> that <span class=\"wl wl-kjv\" data-code=\"H3327\">Isaac</span> had <span class=\"wl wl-kjv\" data-code=\"H1288\">blessed</span> <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob,</span> and sent him <span class=\"wl wl-kjv\" data-code=\"H7971\">away</span> to <span class=\"wl wl-kjv\" data-code=\"H6307\">Padanaram,</span> to <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> him a <span class=\"wl wl-kjv\" data-code=\"H802\">wife</span> from thence; and that as he <span class=\"wl wl-kjv\" data-code=\"H1288\">blessed</span> him he gave him a <span class=\"wl wl-kjv\" data-code=\"H6680\">charge,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Thou shalt not <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> a <span class=\"wl wl-kjv\" data-code=\"H802\">wife</span> of the <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters</span> of Canaan;","7":"And that <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">obeyed</span> his <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> and his <span class=\"wl wl-kjv\" data-code=\"H517\">mother,</span> and was <span class=\"wl wl-kjv\" data-code=\"H3212\">gone</span> to Padanaram;","8":"And <span class=\"wl wl-kjv\" data-code=\"H6215\">Esau</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">seeing</span> that the <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters</span> of <span class=\"wl wl-kjv\" data-code=\"H3667\">Canaan</span> <span class=\"wl wl-kjv\" data-code=\"H5869\">pleased</span> <span class=\"wl wl-kjv\" data-code=\"H7451\">not</span> <span class=\"wl wl-kjv\" data-code=\"H3327\">Isaac</span> his father;","9":"Then <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> <span class=\"wl wl-kjv\" data-code=\"H6215\">Esau</span> unto <span class=\"wl wl-kjv\" data-code=\"H3458\">Ishmael,</span> and <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> unto the <span class=\"wl wl-kjv\" data-code=\"H802\">wives</span> which he had <span class=\"wl wl-kjv\" data-code=\"H4258\">Mahalath</span> the <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> of <span class=\"wl wl-kjv\" data-code=\"H3458\">Ishmael</span> <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham's</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">son,</span> the <span class=\"wl wl-kjv\" data-code=\"H269\">sister</span> of <span class=\"wl wl-kjv\" data-code=\"H5032\">Nebajoth,</span> to be his wife.","10":"And <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> went <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> from <span class=\"wl wl-kjv\" data-code=\"H884\">Beersheba,</span> and <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> toward Haran.","11":"And he <span class=\"wl wl-kjv\" data-code=\"H6293\">lighted</span> upon a certain <span class=\"wl wl-kjv\" data-code=\"H4725\">place,</span> and tarried there all <span class=\"wl wl-kjv\" data-code=\"H3885\">night,</span> because the <span class=\"wl wl-kjv\" data-code=\"H8121\">sun</span> was <span class=\"wl wl-kjv\" data-code=\"H935\">set;</span> and he <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> of the <span class=\"wl wl-kjv\" data-code=\"H68\">stones</span> of that <span class=\"wl wl-kjv\" data-code=\"H4725\">place,</span> and <span class=\"wl wl-kjv\" data-code=\"H7760\">put</span> them for his <span class=\"wl wl-kjv\" data-code=\"H4763\">pillows,</span> and lay <span class=\"wl wl-kjv\" data-code=\"H7901\">down</span> in that <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> to sleep.","12":"And he <span class=\"wl wl-kjv\" data-code=\"H2492\">dreamed,</span> and behold a <span class=\"wl wl-kjv\" data-code=\"H5551\">ladder</span> set <span class=\"wl wl-kjv\" data-code=\"H5324\">up</span> on the <span class=\"wl wl-kjv\" data-code=\"H776\">earth,</span> and the top of <span class=\"wl wl-kjv\" data-code=\"H7218\">it</span> <span class=\"wl wl-kjv\" data-code=\"H5060\">reached</span> to <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven:</span> and b (function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
function kopieerVers(n) {
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
}
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  kopieerVers(k.dataset.n);
});
// rechtermuisklik op een vers kopieert het (in plaats van het browser-contextmenu)
document.addEventListener('contextmenu', e => {
  const rij = e.target.closest('.vers');
  if (!rij || !rij.id.startsWith('v')) return;
  const n = rij.id.slice(1);
  if (!D.vertalingen.SVnu[n]) return;
  e.preventDefault();
  kopieerVers(n);
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
