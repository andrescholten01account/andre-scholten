en in Egypte was, zei Jakob tegen zijn zonen: Waarom kijkt u elkaar aan?","2":"Vervolgens zei hij: Kijk, ik heb gehoord dat er koren in Egypte is; trek daarheen af, en koop ons *koren* van daar, zodat wij leven en niet sterven.","3":"Toen trokken Jozefs tien broers af, om koren uit Egypte te kopen.","4":"Maar Benjamin, Jozefs broer, stuurde Jakob niet met zijn broers mee; want hij zei: Anders overkomt hem misschien een ongeluk!","5":"Zo kwamen Israëls zonen om koren te kopen tussen degenen die daar kwamen; want de honger was in het land Kanaän.","6":"Jozef nu was regent over dat land; hij was het die aan al het volk van het land verkocht; en Jozefs broers kwamen, en bogen zich voor hem, *met* het gezicht ter aarde.","7":"Toen Jozef zijn broers zag, herkende hij hen; maar hij hield zich vreemd tegenover hen, en sprak hard met hen, en zei tegen hen: Waar komt u vandaan? En zij zeiden: Uit het land Kanaän; om voedsel te kopen.","8":"Jozef dan herkende zijn broers; maar zij herkenden hem niet.","9":"Toen dacht Jozef aan de dromen die hij over hen gedroomd had; en hij zei tegen hen: U bent verspieders, u bent gekomen om te bekijken waar het land onbeschermd is[1].","10":"En zij zeiden tegen hem: Nee, mijn heer! Maar uw knechten zijn gekomen om voedsel te kopen.","11":"Wij allen zijn zonen van één man; wij zijn eerlijke mensen; uw knechten zijn geen verspieders.","12":"En hij zei tegen hen: Nee, maar u bent gekomen om te bekijken waar het land onbeschermd is.","13":"En zij zeiden: Wij, uw knechten, waren twaalf broers, zonen van één man, in het land Kanaän; en zie, de jongste is vandaag bij onze vader; en de één is er niet meer.","14":"Toen zei Jozef tegen hen: Dat is het, wat ik tegen u gesproken heb, toen ik zei: U bent verspieders!","15":"Hierin zult u beproefd worden: zo waar als Farao leeft! Als u van hier zult weggaan, tenzij uw jongste broer hierheen gekomen zal zijn!","16":"Stuur er één van u uit, die uw broer haalt; maar blijft u zelf gevangen, en uw woorden zullen beproefd worden, of de waarheid bij u is; en als dat niet zo is, zo waar als Farao leeft, dan bent u verspieders!","17":"En hij zette hen samen drie dagen in bewaring.","18":"En op de derde dag zei Jozef tegen hen: Doe dit, dan zult u leven; ik vrees God.","19":"Als u eerlijke mensen bent, laat dan één van uw broers gebonden blijven in het huis waar u gevangen zit; en gaat u heen, breng het koren voor de honger van uw huizen.","20":"En breng uw jongste broer tot mij, zo zullen uw woorden bevestigd worden; en u zult niet sterven. En zij deden zo.","21":"Toen zeiden zij de één tegen de ander: Voorwaar, wij zijn schuldig aan onze broer, wiens angst van zijn ziel wij zagen, toen hij ons om genade smeekte; maar wij luisterden niet! Daarom komt deze benauwdheid over ons.","22":"En Ruben antwoordde hun en zei: Heb ik het niet tegen u gezegd toen ik zei: Zondig niet tegen deze jongen! Maar u hoorde niet; en ook zijn bloed, zie, het wordt opgeëist!","23":"En zij wisten niet dat Jozef het hoorde; want er was een tolk tussen hen.","24":"Toen wendde hij zich van hen af, en huilde; daarna keerde hij weer naar hen terug, en sprak tegen hen, en nam Simeon van hen weg, en bond hem voor hun ogen.","25":"En Jozef gebood dat men hun zakken met koren vullen zou, en dat men hun geld terug zou geven, ieder in zijn zak, en dat men hun proviand zou geven voor onderweg; en men deed hun zo.","26":"En zij laadden hun koren op hun ezels, en trokken vandaar weg.","27":"Toen één zijn zak opendeed om zijn ezel voer te geven in de herberg, zag hij zijn geld; want zie, het was in de opening van zijn zak.","28":"En hij zei tegen zijn broers: Mijn geld is teruggegeven; en zie, het is zelfs in mijn zak! Toen zonk hun het hart in de schoenen, en zij werden bang, en zeiden de één tegen de ander: Wat heeft God ons hier aangedaan?","29":"En zij kwamen in het land Kanaän, bij Jakob, hun vader; en zij vertelden hem alles wat hun overkomen was, en zeiden:","30":"Die man, de heer van dat land, heeft hard met ons gesproken; en hij heeft ons gehouden voor verspieders van het land.","31":"Maar wij zeiden tegen hem: Wij zijn eerlijke mensen; wij zijn geen verspieders.","32":"Wij waren twaalf broers, zonen van onze vader; de één is er niet meer, en de jongste is vandaag bij onze vader in het land Kanaän.","33":"En die man, de heer van dat land, zei tegen ons: Hieraan zal ik weten dat u eerlijke mensen bent: laat één van uw broers bij mij, en neem voor de honger van uw huizen, en trek heen.","34":"En breng uw jongste broer tot mij; dan zal ik weten dat u geen verspieders bent, maar dat u eerlijke mensen bent; uw broer zal ik u teruggeven, en u zult in dit land handel kunnen drijven.","35":"En het gebeurde, toen zij hun zakken leegden, zie, dat ieder de bundel van zijn geld in zijn zak had; en zij zagen de bundels van hun geld, zij en hun vader, en zij werden bang.","36":"Toen zei Jakob, hun vader, tegen hen: U berooft mij van kinderen! Jozef is er niet meer, en Simeon is er niet meer; nu wilt u Benjamin wegnemen! Al deze dingen zijn tegen mij!","37":"Toen sprak Ruben tegen zijn vader en zei: Dood twee van mijn zonen, als ik hem niet bij u terugbreng; geef hem in mijn hand, en ik zal hem weer bij u terugbrengen!","38":"Maar hij zei: Mijn zoon zal niet met u meegaan; want zijn broer is dood, en hij is alleen overgebleven; als hem een ongeluk zou overkomen op de weg die u zult gaan, dan zou u mijn grijze haren met verdriet naar het graf doen afdalen."},"SV":{"1":"Toen Jakob zag, dat er koren in Egypte was, zo zeide Jakob tot zijn zonen: Waarom ziet gij op elkander?","2":"Voorts zeide hij: Ziet, ik heb gehoord, dat er koren in Egypte is; trekt daarhenen af, en koopt ons *koren* van daar, opdat wij leven en niet sterven.","3":"Toen togen Jozefs tien broederen af, om koren uit Egypte te kopen.","4":"Doch Benjamin, Jozefs broeder, zond Jakob niet met zijn broederen; want hij zeide: Opdat hem niet misschien het verderf ontmoete!","5":"Alzo kwamen Israëls zonen om te kopen onder degenen, die daar kwamen; want de honger was in het land Kanaän.","6":"Jozef nu was regent over dat land; hij verkocht aan al het volk des lands; en Jozefs broederen kwamen, en bogen zich voor hem, *met* de aangezichten ter aarde.","7":"Als Jozef zijn broederen zag, zo kende hij hen; maar hij hield zich vreemd jegens hen, en sprak hard met hen, en zeide tot hen: Van waar komt gij? En zij zeiden: Uit het land Kanaän; om spijze te kopen.","8":"Jozef dan kende zijn broederen; maar zij kenden hem niet.","9":"Toen gedacht Jozef aan de dromen, die hij van hen gedroomd had; en hij zeide tot hen: Gij zijt verspieders, gij zijt gekomen om te bezichtigen, waar het land bloot is.","10":"En zij zeiden tot hem: Neen, mijn heer! maar uw knechten zijn gekomen, om spijze te kopen.","11":"Wij allen zijn eens mans zonen; wij zijn vroom; uw knechten zijn geen verspieders.","12":"En hij zeide tot hen: Neen, maar gij zijt gekomen, om te bezichtigen, waar het land bloot is.","13":"En zij zeiden: Wij, uw knechten, waren twaalf gebroeders, eens mans zonen, in het land Kanaän; en zie, de kleinste is heden bij onzen vader; doch de een is niet *meer*.","14":"Toen zeide Jozef tot hen: Dat is het, wat ik tot u gesproken heb, zeggende: Gij zijt verspieders!","15":"Hierin zult gij beproefd worden: *zo* *waarlijk* *als* Farao leeft! indien gij van hier zult uitgaan, tenzij dan, wanneer uw kleinste broeder herwaarts zal gekomen zijn!","16":"Zendt een uit u, die uw broeder hale; maar weest gijlieden gevangen, en uw woorden zullen beproefd worden, of de waarheid bij u zij; en indien niet, *zo* *waarlijk* *als* Farao leeft, zo zijt gij verspieders!","17":"En hij zette hen samen drie dagen in bewaring.","18":"En ten derden dage zeide Jozef tot hen: Doet dit, zo zult gij leven; ik vrees God.","19":"Zo gij vroom zijt, zo zij een uwer broederen gebonden in het huis uwer bewaring; en gaat gij heen, brengt het koren voor den honger uwer huizen.","20":"En brengt uw kleinsten broeder tot mij, zo zullen uw woorden waargemaakt worden; en gij zult niet sterven. En zij deden alzo.","21":"Toen zeiden zij de een tot den ander: Voorwaar, wij zijn schuldig aan onzen broeder, wiens benauwdheid der ziele wij zagen, toen hij ons om genade bad; maar wij hoorden niet! daarom komt deze benauwdheid over ons.","22":"En Ruben antwoordde hun, zeggende: Heb ik het tot u niet gezegd, toen ik zeide: Zondigt niet aan dezen jongeling! maar gij hoordet niet; en ook zijn bloed, ziet, het wordt gezocht!","23":"En zij wisten niet, dat het Jozef hoorde; want daar was een taalman tussen hen.","24":"Toen wendde hij zich om, van hen af, en weende; daarna keerde hij weder tot hen, en sprak tot hen, en nam Simeon van hen, en bond hem voor hun ogen.","25":"En Jozef gebood, dat men hun zakken met koren vullen zou, en dat men hun geld wederkeerde, een iegelijk in zijn zak, en dat men hun teerkost gave tot den weg; en men deed hun alzo.","26":"En zij laadden hun koren op hun ezels, en togen van daar.","27":"Toen een zijn zak opendeed, om zijn ezel voeder te geven in de herberg, zo zag hij zijn geld; want ziet, het was in den mond van zijn zak.","28":"En hij zeide tot zijn broederen: Mijn geld is wedergekeerd; daartoe ook, ziet, het is in mijn zak! Toen ontging hun het hart, en zij verschrikten, de een tot den ander zeggende: Wat is dit, *dat* ons God gedaan heeft?","29":"En zij kwamen in het land Kanaän, tot Jakob, hun vader; en zij gaven hem te kennen al hun wedervaren, zeggende:","30":"Die man, de heer van dat land, heeft hard met ons gesproken; en hij heeft ons gehouden voor verspieders des lands.","31":"Maar wij zeiden tot hem: Wij zijn vroom; wij zijn geen verspieders.","32":"Wij waren twaalf gebroeders, zonen van onzen vader; de een is niet *meer*, en de kleinste is heden bij onzen vader in het land Kanaän.","33":"En die man, de heer van dat land, zeide tot ons: Hieraan zal ik bekennen, dat gijlieden vroom zijt; laat een uwer broederen bij mij, en neemt voor den honger uwer huizen, en trekt heen.","34":"En brengt uw kleinsten broeder tot mij; zo zal ik weten, dat gij geen verspieders zijt, maar dat gij vroom zijt; uw broeder zal ik u wedergeven, en gij zult in dit land handelen.","35":"En het geschiedde, als zij hun zakken ledigden, ziet, zo had een iegelijk den bundel zijns gelds in zijn zak; en zij zagen de bundelen huns gelds, zij en hun vader, en zij waren bevreesd.","36":"Toen zeide Jakob, hun vader, tot hen: Gij berooft mij van kinderen! Jozef is er niet, en Simeon is er niet; nu zult gij Benjamin wegnemen! al deze dingen zijn tegen mij!","37":"Toen sprak Ruben tot zijn vader, zeggende: Dood twee mijner zonen, zo ik hem tot u niet wederbreng; geef hem in mijn hand, en ik zal hem weder tot u brengen!","38":"Maar hij zeide: Mijn zoon zal met ulieden niet aftrekken; want zijn broeder is dood, en hij is alleen overgebleven; zo hem een verderf ontmoette op den weg, dien gij zult gaan, zo zoudt gij mijn grauwe haren met droefenis ten grave doen nederdalen."},"KJV":{"1":"Now when Jacob saw that there was corn in Egypt, Jacob said unto his sons, Why do ye look","2":"And he said, Behold, I have heard that there is corn in Egypt: get you down thither, and buy for us from thence; that we may live, and not die.","3":"And Joseph's ten brethren went down to buy corn in Egypt.","4":"But Benjamin, Joseph's brother, Jacob sent not with his brethren; for he said, Lest peradventure mischief befall him.","5":"And the sons of Israel came to buy *corn* among those that came: for the famine was in the land of Canaan.","6":"And Joseph *was* the governor over the land, *and* he *it was* that sold to all the people of the land: and Joseph's brethren came, and bowed down themselves before him *with* their faces to the earth.","7":"And Joseph saw his brethren, and he knew them, but made himself strange unto them, and spake roughly unto them; and he said unto them, Whence come ye? And they said, From the land of Canaan to buy food.","8":"And Joseph knew his brethren, but they knew","9":"And Joseph remembered the dreams which he dreamed of them, and said unto them, Ye *are* spies; to see the nakedness of the land ye are come.","10":"And they said unto him, Nay, my lord, but to buy food are thy servants come.","11":"We *are* all one man's sons; we *are* true *men*, thy servants are no spies.","12":"And he said unto them, Nay, but to see the nakedness of the land ye are come.","13":"And they said, Thy servants *are* twelve brethren, the sons of one man in the land of Canaan; and, behold, the youngest *is* this day with our father, and one","14":"And Joseph said unto them, That *is it* that I spake unto you, saying, Ye *are* spies:","15":"Hereby ye shall be proved: By the life of Pharaoh ye shall not go forth hence, except your youngest brother come","16":"Send one of you, and let him fetch your brother, and ye shall be kept in prison, that your words may be proved, whether *there be any* truth in you: or else by the life of Pharaoh surely ye *are* spies.","17":"And he put them all together into ward three days.","18":"And Joseph said unto them the third day, This do, and live; *for* I fear God:","19":"If ye *be* true *men*, let one of your brethren be bound in the house of your prison: go ye, carry corn for the famine of your houses:","20":"But bring your youngest brother unto me; so shall your words be verified, and ye shall not die. And they did","21":"And they said one to another, We *are* verily guilty concerning our brother, in that we saw the anguish of his soul, when he besought us, and we would not hear; therefore is this distress come","22":"And Reuben answered them, saying, Spake I not unto you, saying, Do not sin against the child; and ye would not hear? therefore, behold, also his blood is required.","23":"And they knew not that Joseph understood *them*; for he spake unto them by an interpreter.","24":"And he turned himself about from them, and wept; and returned to them again, and communed with them, and took from them Simeon, and bound him before their eyes.","25":"Then Joseph commanded to fill their sacks with corn, and to restore every man's money into his sack, and to give them provision for the way: and thus did he","26":"And they laded their asses with the corn, and departed","27":"And as one of them opened his sack to give his ass provender in the inn, he espied his money; for, behold, it *was* in his sack's mouth.","28":"And he said unto his brethren, My money is restored; and, lo, *it is* even in my sack: and their heart failed *them*, and they were afraid, saying one to another, What *is* this *that* God hath done","29":"And they came unto Jacob their father unto the land of Canaan, and told him all that befell unto them; saying,","30":"The man, *who is* the lord of the land, spake roughly to us, and took us for spies of the country.","31":"And we said unto him, We *are* true *men*; we are no spies:","32":"We *be* twelve brethren, sons of our father; one *is* not, and the youngest *is* this day with our father in the land of Canaan.","33":"And the man, the lord of the country, said unto us, Hereby shall I know that ye *are* true *men*; leave one of your brethren *here* with me, and take *food for* the famine of your households, and be gone:","34":"And bring your youngest brother unto me: then shall I know that ye *are* no spies, but *that* ye *are* true *men: so* will I deliver you your brother, and ye shall traffick in the land.","35":"And it came to pass as they emptied their sacks, that, behold, every man's bundle of money *was* in his sack: and when *both* they and their father saw the bundles of money, they were afraid.","36":"And Jacob their father said unto them, Me have ye bereaved *of my children*: Joseph *is* not, and Simeon *is* not, and ye will take Benjamin","37":"And Reuben spake unto his father, saying, Slay my two sons, if I bring him not to thee: deliver him into my hand, and I will bring him to thee again.","38":"And he said, My son shall not go down with you; for his brother is dead, and he is left alone: if mischief befall him by the way in the which ye go, then shall ye bring down my gray hairs with sorrow to the grave."}},"tsk":{"1":[{"kopje":"Toen Jakob","refs":["Gen 41:54","Gen 41:57","Hand 7:12"]},{"kopje":"zag","refs":["Gen 42:2","Ex 5:19","Ex 20:18","1 Kon 19:3","Hos 5:13","Gal 2:7"]},{"kopje":"Waarom kijkt u elkaar aan","refs":["Joz 7:10","2 Kon 8:3","2 Kon 8:4","Ezra 10:4","Jer 8:14"]}],"2":[{"kopje":"trek daarheen af","refs":["Gen 43:2","Gen 43:4","Gen 45:9"]},{"kopje":"zodat wij","refs":["Gen 43:8","Ps 118:17","Jes 38:1","Matt 4:4"]}],"4":[{"kopje":"Benjamin","refs":["Gen 35:16-19"]},{"kopje":"Anders","refs":["Gen 42:38","Gen 3:22","Gen 11:4","Gen 33:1","Gen 33:2","Gen 43:14","Gen 43:29","Gen 44:20-22","Gen 44:27-34"]}],"5":[{"kopje":"want","refs":["Gen 12:10","Gen 26:1","Gen 41:57","Hand 7:11","Hand 11:28"]}],"6":[{"kopje":"regent","refs":["Gen 41:40","Gen 41:41","Gen 45:8","Gen 45:26","Ps 105:16-21","Hand 7:10"]},{"kopje":"hij was het","refs":["Gen 41:55","Gen 41:56"]},{"kopje":"bogen zich","refs":["Gen 18:2","Gen 19:1","Gen 37:7","Gen 37:9","Gen 44:14","Openb 3:9"]}],"7":[{"kopje":"hard met hen","refs":["Gen 42:9-12","Gen 42:14-17","Gen 42:19","Gen 42:20","Matt 15:23-26"]}],"8":[{"kopje":"maar zij herkenden hem niet","refs":["Luk 24:16","Joh 20:14","Joh 21:4"]}],"9":[{"kopje":"dacht","refs":["Gen 37:5-9"]},{"kopje":"U bent verspieders","refs":["Gen 42:9","Gen 42:16","Gen 42:30","Gen 42:31","Gen 42:34","Num 13:2","Num 13:16-20","Joz 2:1","Joz 6:23","Richt 1:24","1 Sam 26:4","Luk 20:20","Hebr 11:31"]},{"kopje":"onbeschermd","refs":["Ex 32:35"]}],"11":[{"kopje":"eerlijke mensen","refs":["Gen 42:19","Gen 42:33","Gen 42:34","Joh 7:18","2 Kor 6:4"]}],"12":[{"kopje":"onbeschermd","refs":["Gen 42:9"]}],"13":[{"kopje":"Uw knechten","refs":["Gen 42:11","Gen 42:32","Gen 29:32-35","Gen 30:6-24","Gen 35:16-26","Gen 43:7","Gen 46:8-27","Ex 1:2-5","Num 1:1-54","Num 10:1-36","Num 26:1-65","1 Kron 2:1","1 Kron 8:40"]},{"kopje":"de n in the words following.] for there was famine in the land of Canaan."}],"6":[{"catchword":null,"tekst":"Joseph now was Ruler over that land; he sold to all people of the land: and Joseph&acirc;&euro;&trade;s brethren came, and bowed themselves before him: [to show him Civil honour and respect. See above chap. 18. On verse 2. And compare herewith, the former dreams of Joseph, chap. 37. 7, 8.] (with) the faces to the ground."}],"7":[{"catchword":null,"tekst":"When Joseph saw his brethren, he knew them; but he showed himself strange towards them, [thereby the better to discover their state and condition, especially that of his father and brother.] and spoke harsh with them; [see below verse 9, 11, 12. This he did, partly to understand the truth the better, how it fared with his father, and his brother Benjamin; partly to rouze them up to an acknowledgement of the sin, they had committed against him.] and said to them; whence come yee? And they said; out of the land of Canaan, to buy food."}],"8":[{"catchword":null,"tekst":"And Joseph knew his brethren, but they knew him not."}],"9":[{"catchword":null,"tekst":"Then Joseph remembered the dreams, which he had dreamt of them; and he said to them, yee are Spies, yee are come to view, where the land is bare. [Heb. the bareness, or, nakedness of the land, i.e. to see where the Country lies most open and naked, or is least provided and fenced, for an enemy to invade the same, or to surprise some places, or to over-run the land to spoil and plunder it.]"}],"10":[{"catchword":null,"tekst":"And they said to him; No my Lord, but thy servants are come to buy food."}],"11":[{"catchword":null,"tekst":"We are all of us the sons of one man, we are honest; thy servants are no Spies."}],"12":[{"catchword":null,"tekst":"And he said to them: No; but yee are come to view, where the land is bare."}],"13":[{"catchword":null,"tekst":"And they said; we thy servants were twelve brethren, one man&acirc;&euro;&trade;s sons in the land of Canaan: [here now Joseph begins to learn, what he aimed at by all this strict examination.] and behold, the least [Heb. the little (one) i.e. the youngest, viz. Benjamin. Compare above chap. 19. On verse 31.] is this day with our Father: yet the one, he is no (more). [meaning Joseph, whom they held to be dead, as appears below verse 22. And ch. 44. 20.]"}],"15":[{"catchword":null,"tekst":"Herein shall ye be tried: [i.e. By this I shall see, whether yee speak the truth, and deal uprightly with me, or whether ye are Spies indeed.] (as true as) Pharao liveth; [Heb. Pharao&acirc;&euro;&trade;s life, or, Pharao liveth. This is an imperfect speech, which may be supplied thus; as sure as it is that Pharao lives, so certain is that which I tell you. Compare 1 Sam. 1. 26. Others take these words to be an oath, made after the manner of the Egyptians, by Pharao&acirc;&euro;&trade;s life; so that Joseph, out of human frailty, (as may happen to good men) should have followed them therein.] if yee shall go forth hence. Unless it be, when your least brother shall be come hither. [This now seemeth to be an Oath, made after the manner of the Hebrews, whereupon must be understood then, God do this or that unto me, if yee, etc. See above chap. 14. On verse 23. And compare 1 Sam. 17. 55. 2 Kings 2. 2. Ezech. 33. 11.]"}],"16":[{"catchword":null,"tekst":"Send one of you to fetch your brother: but be yee prisoners, [Heb. bound, i.e. as for you, ye shall remain my prisoners the while in this place.] and your words shall be tried, whether the truth be with you: and if not, (as true as) Pharao lives, [See the Note on the verse fore-going,] then yee are Spies."}],"17":[{"catchword":null,"tekst":"And he put them together [Heb. gathered them] into custody for three days."}],"18":[{"catchword":null,"tekst":"And, on the third day, Joseph said to them: do this, then yee shall live: [i.e. do what I shall tell you; then shall yee take care for your lives, and welfare, that ye may not be taken for Spies, and suffer accordingly.] I fear God."}],"19":[{"catchword":null,"tekst":"If ye be honest, let one of your brethren [Heb. one brother of you, or, your brother one] be bound in the house of your custody: and go your ways, bring [or, carry] the Corn for the famine of your houses. [Heb. the Corn of the famine of your houses; i.e. that which is needful for the famine of your households and families.]"}],"20":[{"catchword":null,"tekst":"And bring your least brother unto me, so shall your words be made true, and ye shall not die: and they did so."}],"21":[{"catchword":null,"tekst":"Then said they the one to the other; Verily, we are guilty in (regard of) our brother, [Oth. However, howbeit: as if they said; though we seek to hide it, yet we find and feel now, that God comes to call us to an account for it.] whose souls distress we saw, when he entreated us for mercy, but we hearkened not unto him: [this passage is not rehearsed indeed by Moseh, above chap. 37. But here they confess it themselves, that it was thus.] therefore comes this distress comes this distress upon us."}],"22":[{"catchword":null,"tekst":"And Ruben answered them, saying; did not I tell it you, when I said; Sin not in this youth, but ye hearkened not: and his blood also, it is sought? [By the blood, is understood the guilt and punishment of his death. See 1 Kings 2. 32, 33, etc. thus, to seek, or, require blood, is to punish and avenge it. See 2 Chron. 24. 22. Ezech. 3. 18. Luke 11. 50. It seems they all thought that Joseph was dead now, though they had made Ruben believe it formerly, when he came to draw him out of the pit and found him not, they having sold him away. See above chap. 37. 29.]"}],"23":[{"catchword":null,"tekst":"And they knew not, that Joseph heard [i.e. understood what they said; see above chap. 11. On ver. 7.] for there was an interpreter between them. [Joseph made show, as if he did not understand the Hebrew tongue, for to be the less suspected or discovered by his brethren.]"}],"24":[{"catchword":null,"tekst":"Then he turned himself about from them, and wept: [partly; out of natural affection, being of the same blood and birth with them; and partly for the discourse and debates sake which his brethren had together concerning him.] afterwards, he turned to them again, and spoke to them, and took Simeon, [the eldest but one among the sons of Jacob: whom some conceive to have been the rudest against Joseph, as he had been the principal in the murder of Sichem. Ruben the eldest is spared, for having been less guilty in the case of Joseph, and being the fittest man, to conduct his brethren home again.] and bound him [viz. by his servant or guard, upon his order.] before their eyes."}],"25":[{"catchword":null,"tekst":"And Joseph gave charge to fill their sacks [The Hebrew word signifies all manner of vessels, sacks, bags, packs, or the like; wherein something is put in, or packet up.] with Corn, and to return them their money [Heb. Their silverlings, or monies] to every one in his sack, and to give them provision for the way; and they did so to them. [or, thus he did unto them.]"}],"26":[{"catchword":null,"tekst":"And they laded their Corn upon their asses; and went from thence."}],"27":[{"catchword":null,"tekst":"When one (of them) opened his sack, for to give his ass provender in the Inn, he saw his money, for, behold it was in the mouth of the sack."}],"28":[{"catchword":null,"tekst":"And he said to his brethren ; My money is returned withal, loe it is in my sack: then their heart failed them, [Heb. Their heart went out, i.e. the vigour of their heart forsook it, as it happens in fainting and swooning. Compare 1 Kings 10. 5. And the Annotation.] and they were frighted, [see above chap. 7. On verse 33.] saying one to another; [Heb. The man to his brother.] What is this (that) God hath done to us? [or, how hath and all the former, lately happened to them, that God was displeased with them.]"}],"29":[{"catchword":null,"tekst":"And they came into the land of Canaan, to Jacob their Father: and they have him to understand all what happened to them [besides what they concealed, not to frighten their father too much.] saying:"}],"30":[{"catchword":null,"tekst":"That man, the Lord of that land, spoke harsh with us: and he held us [Heb. He gave, delivered, or, put us ] as Spies of the land."}],"31":[{"catchword":null,"tekst":"But we said to him; we are honest, we are no Spies."}],"32":[{"catchword":null,"tekst":"We were twelve brethren, our father&acirc;&euro;&trade;s sons; the one is no (more) and the least is to day with our father in the land of Canaan."}],"33":[{"catchword":null,"tekst":"And that man, the LORD of that land, said to us, Hereby shall I acknowledge, that ye re honest: leave one of your brethren with me, and take for the famine of your houses, [Heb. Take the famine of your houses. See above verse 19.] and go your way."}],"34":[{"catchword":null,"tekst":"And bring your least brother with you, then shall I know, that ye are no Spies, but that ye are honest: your brother I shall restore unto you, and ye shall traffique in this land. [See above chap. 34. Verse 10.]"}],"35":[{"catchword":null,"tekst":"And it came to pass, when they emptied their sacks, behold then every one had the bundle of his money in his sack; and they saw the bundles of their money, they and their father, and they were afraid. [viz. lest they should be charged with theft, or cheating. Compare below chap. 43. 18.]"}],"36":[{"catchword":null,"tekst":"Then said Jacob their father to them; Ye bereave me of children: Joseph he is not, and Simeon, he is not; [He counts him likewise already lost, fearing he would not easily get free again out of his prison, and might perhaps be in danger of his life there.] now ye will take away Benjamin; all these things are against me."}],"37":[{"catchword":null,"tekst":"Then said Ruben to his Father, saying; put to death [This Proposition was altogether unlawful and unnatural, therefore Jacob doth not accept thereof] two of my sons, [viz. two of four, namely below, ch. 46. 9.] if I do not bring him to thee back again. Give (or put) him into my hand, and I shall bring him again to thee."}]}}};

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
