n 's avonds in Sodom aan; en Lot zat in de poort van Sodom; en toen Lot hen zag, stond hij op om hun tegemoet te gaan, en boog zich met het gezicht ter aarde.","2":"En hij zei: Zie toch, mijn heren! Keert u toch af naar het huis van uw knecht, en overnacht daar, en wast uw voeten; dan kunt u vroeg opstaan en verder gaan op uw weg. En zij zeiden: Nee, maar wij zullen op straat overnachten.","3":"En hij hield sterk bij hen aan, zodat zij bij hem introkken, en in zijn huis kwamen; en hij maakte hun een maaltijd, en bakte ongezuurde koeken, en zij aten.","4":"Eer zij zich te slapen legden, omsingelden de mannen van die stad, de mannen van Sodom, van de jongste tot de oudste toe, dat huis, het hele volk, van alle kanten.","5":"En zij riepen Lot toe, en zeiden tegen hem: Waar zijn die mannen die deze nacht bij u gekomen zijn? Breng hen naar buiten, naar ons toe, opdat wij met hen gemeenschap hebben.","6":"Toen ging Lot naar buiten naar hen toe, bij de deur, en hij sloot de deur achter zich toe;","7":"en hij zei: Mijn broeders! Doe toch geen kwaad!","8":"Zie toch, ik heb twee dochters, die nog met geen man gemeenschap gehad hebben; ik zal ze nu naar buiten brengen, naar u toe, en doe met hen zoals het goed is in uw ogen; alleen, doe deze mannen niets; want daarom zijn zij onder de bescherming van mijn dak gekomen.","9":"Toen zeiden zij: Kom, ga opzij! Verder zeiden zij: Deze ene is gekomen om hier als vreemdeling te wonen, en zou hij dan de rechter spelen? Nu zullen wij u meer kwaad doen dan hun. En zij drongen sterk op de man, op Lot, en zij kwamen dichterbij om de deur open te breken.","10":"Maar die mannen staken hun hand uit, en trokken Lot naar binnen bij zich in het huis, en sloten de deur toe.","11":"En zij sloegen de mannen die bij de deur van het huis waren met blindheid, van de kleinste tot de grootste, zodat zij moe werden bij het zoeken naar de deur.","12":"Toen zeiden die mannen tegen Lot: Wie hebt u hier nog meer? Een schoonzoon, of uw zonen, of uw dochters, en allen die u in deze stad hebt, breng hen weg uit deze plaats;","13":"want wij gaan deze plaats verwoesten, omdat hun geroep groot geworden is voor het aangezicht van de HEERE, en de HEERE ons uitgezonden heeft om haar te verwoesten.","14":"Toen ging Lot naar buiten, en sprak tegen zijn schoonzonen, die met zijn dochters zouden trouwen, en zei: Maak u klaar, ga weg uit deze plaats; want de HEERE gaat deze stad verwoesten. Maar in de ogen van zijn schoonzonen leek het alsof hij een grap maakte.","15":"En toen de dageraad opging, drongen de engelen bij Lot aan en zeiden: Maak u klaar, neem uw vrouw, en uw twee dochters die hier zijn, opdat u niet omkomt door de ongerechtigheid van deze stad.","16":"Maar hij aarzelde; toen grepen die mannen zijn hand, en de hand van zijn vrouw, en de hand van zijn twee dochters, omdat de HEERE hem genadig was; en zij brachten hem naar buiten, en zetten hem buiten de stad neer.","17":"En het gebeurde, toen zij hen naar buiten gebracht hadden, dat Hij zei: Red u, om uw leven; kijk niet achter u om, en blijf nergens staan op deze hele vlakte; vlucht naar het gebergte, opdat u niet omkomt.","18":"En Lot zei tegen hen: Nee toch, Heere!","19":"Zie toch, Uw knecht heeft genade gevonden in Uw ogen, en U hebt Uw goedheid groot gemaakt die U aan mij bewezen hebt, door mijn leven te sparen; maar ik zal niet naar het gebergte kunnen vluchten, want misschien overkomt mij dat kwaad, en moet ik sterven!","20":"Zie toch, deze stad is dichtbij om daarheen te vluchten, en zij is klein; laat mij toch daarheen mogen vluchten (is zij niet klein?), opdat mijn leven behouden blijft.","21":"En Hij zei tegen hem: Zie, Ik heb ook in deze zaak rekening met u gehouden, dat Ik deze stad niet zal omkeren waarvan u gesproken hebt.","22":"Haast u, vlucht daarheen; want Ik zal niets kunnen doen, totdat u daar aangekomen bent. Daarom noemde men de naam van deze stad Zoar.","23":"De zon ging op boven de aarde, toen Lot in Zoar aankwam.","24":"Toen liet de HEERE zwavel en vuur over Sodom en Gomorra regenen, van de HEERE uit de hemel.","25":"En Hij keerde deze steden om, en die hele vlakte, en alle inwoners van deze steden, ook het gewas van het land.","26":"En zijn vrouw keek achter hem om; en zij werd een zoutpilaar.","27":"En Abraham stond de volgende morgen vroeg op, en ging naar de plaats waar hij voor het aangezicht van de HEERE gestaan had.","28":"En hij keek uit naar Sodom en Gomorra, en naar het hele land van die vlakte; en hij zag, en zie, er steeg rook op van het land, als de rook van een oven.","29":"En het gebeurde, toen God de steden van deze vlakte verwoestte, dat God aan Abraham dacht, en Hij leidde Lot weg uit het midden van deze omkering, toen Hij de steden omkeerde waarin Lot gewoond had.","30":"En Lot trok weg uit Zoar, en woonde op de berg, en zijn twee dochters met hem; want hij was bang om in Zoar te wonen. En hij woonde in een grot, hij en zijn twee dochters.","31":"Toen zei de oudste tegen de jongste: Onze vader is oud, en er is geen man in dit land om bij ons binnen te gaan, zoals dat overal op aarde gaat.","32":"Kom, laten we onze vader wijn te drinken geven, en bij hem liggen, opdat wij van onze vader nakomelingen in leven houden.","33":"En zij gaven die nacht hun vader wijn te drinken; en de oudste kwam, en lag bij haar vader, en hij merkte het niet toen zij ging liggen, en ook niet toen zij opstond.","34":"En het gebeurde de volgende dag, dat de oudste tegen de jongste zei: Zie, ik heb gisternacht bij mijn vader gelegen; laten wij hem ook deze nacht wijn te drinken geven; ga dan naar binnen, lig bij hem, opdat wij van onze vader nakomelingen in leven houden.","35":"En zij gaven hun vader ook die nacht wijn te drinken, en de jongste stond op, en lag bij hem. En hij merkte het niet toen zij ging liggen, en ook niet toen zij opstond.","36":"En de twee dochters van Lot raakten zwanger van hun vader.","37":"En de oudste baarde een zoon, en noemde hem Moab; deze is de vader van de Moabieten, tot op deze dag.","38":"En de jongste baarde ook een zoon, en noemde hem Ben-Ammi; deze is de vader van de nakomelingen van Ammon, tot op deze dag."},"SV":{"1":"En die twee engelen kwamen te Sodom in den avond; en Lot zat in de poort te Sodom; en als Lot hen zag, stond hij op hun tegemoet, en boog zich met het aangezicht ter aarde.","2":"En hij zeide: Ziet nu, mijne heren! keert toch in ten huize van uw knecht, en vernacht, en wast uw voeten; en gij zult vroeg opstaan, en gaan uws weegs. En zij zeiden: Neen, maar wij zullen op de straat vernachten.","3":"En hij hield bij hen zeer aan, zodat zij tot hem inkeerden, en kwamen in zijn huis; en hij maakte hun een maaltijd, en bakte ongezuurde koeken, en zij aten.","4":"Eer zij zich te slapen leiden, zo hebben de mannen dier stad, de mannen van Sodom, van den jongste tot den oudste toe, dat huis omsingeld, het ganse volk, van het uiterste einde af.","5":"En zij riepen Lot toe, en zeiden tot hem: Waar zijn die mannen, die deze nacht tot u gekomen zijn? breng hen uit tot ons, opdat wij ze bekennen.","6":"Toen ging Lot uit tot hen aan de deur, en hij sloot de deur achter zich toe;","7":"En hij zeide: Mijn broeders! doet toch geen kwaad!","8":"Ziet toch, ik heb twee dochters, die geen man bekend hebben; ik zal haar nu tot u uitbrengen, en doet haar, zoals het goed is in uw ogen; alleenlijk doet dezen mannen niets; want daarom zijn zij onder de schaduw mijns daks ingegaan.","9":"Toen zeiden zij: Kom verder aan! Voorts zeiden zij: Deze ene is gekomen, om als vreemdeling *hier* te wonen, en zoude hij alleszins rechter zijn? Nu zullen wij u meer kwaads doen, dan hun. En zij drongen zeer op den man, op Lot, en zij traden toe om de deur open te breken.","10":"Doch die mannen staken hun hand uit, en deden Lot tot zich inkomen in het huis, en sloten de deur toe.","11":"En zij sloegen de mannen, die aan de deur van het huis waren, met verblindheden, van den kleinste tot aan den grootste, zodat zij moede werden, om de deur te vinden.","12":"Toen zeiden die mannen tot Lot: Wien hebt gij hier nog meer? een schoonzoon, of uw zonen, of uw dochteren, en allen, die gij hebt in deze stad, breng uit deze plaats;","13":"Want wij gaan deze plaats verderven, omdat haar geroep groot geworden is voor het aangezicht des HEEREN, en de HEERE ons uitgezonden heeft, om haar te verderven.","14":"Toen ging Lot uit, en sprak tot zijn schoonzonen, die zijn dochteren nemen zouden, en zeide: Maakt u op, gaat uit deze plaats; want de HEERE gaat deze stad verderven. Maar hij was in de ogen zijner schoonzonen als jokkende.","15":"En als de dageraad opging, drongen de engelen Lot aan, zeggende: Maak u op, neem uw huisvrouw, en uw twee dochteren, die voorhanden zijn, opdat gij in de ongerechtigheid dezer stad niet omkomt.","16":"Maar hij vertoefde; zo grepen dan die mannen zijn hand, en de hand zijner vrouw, en de hand zijner twee dochteren, om de verschoning des HEEREN over hem; en zij brachten hem uit, en stelden hem buiten de stad.","17":"En het geschiedde als zij hen uitgebracht hadden naar buiten, zo zeide Hij: behoud u om uws levens wil; zie niet achter u om, en sta niet op deze ganse vlakte; behoud u naar het gebergte heen, opdat gij niet omkomt.","18":"En Lot zeide tot hen: Neen toch, Heere!","19":"Zie toch, Uw knecht heeft genade gevonden in Uw ogen, en Gij hebt Uw weldadigheid groot gemaakt, die Gij aan mij gedaan hebt, om mijn ziel te behouden bij het leven; maar ik zal niet kunnen behouden worden naar het gebergte heen, opdat mij niet misschien dat kwaad aankleve, en ik sterve!","20":"Ziet toch, deze stad *is* nabij, om derwaarts te vluchten, en zij *is* klein; laat mij toch derwaarts behouden worden (*is* zij niet klein?) opdat mijn ziel leve.","21":"En Hij zeide tot hem: Zie, Ik heb uw aangezicht opgenomen ook in deze zaak, dat Ik deze stad niet omkere waarvan gij gesproken hebt.","22":"Haast, behoud u derwaarts; want Ik zal niets kunnen doen, totdat gij daarhenen ingekomen zijt. Daarom noemde men den naam dezer stad Zoar.","23":"De zon ging op boven de aarde, als Lot te Zoar inkwam.","24":"Toen deed de HEERE zwavel en vuur over Sodom en Gomorra regenen, van den HEERE uit den hemel.","25":"En Hij keerde deze steden om, en die ganse vlakte, en alle inwoners dezer steden, ook het gewas des lands.","26":"En zijn huisvrouw zag om van achter hem; en zij werd een zoutpilaar.","27":"En Abraham maakte zich deszelven morgens vroeg op, naar de plaats, waar hij voor het aangezicht des HEEREN gestaan had.","28":"En hij zag naar Sodom en Gomorra toe, en naar het ganse land van die vlakte; en hij zag, en ziet, er ging een rook van het land op, gelijk de rook eens ovens.","29":"En het geschiedde, toen God de steden dezer vlakte verdierf, dat God aan Abraham gedacht, en Hij leidde Lot uit het midden dezer omkering, in het omkeren dier steden, in welke Lot gewoond had.","30":"En Lot toog op uit Zoar, en woonde op den berg, en zijn twee dochters met hem; want hij vreesde binnen Zoar te wonen. En hij woonde in een spelonk, hij en zijn twee dochters.","31":"Toen zeide de eerstgeborene tot de jongste: Onze vader is oud, en er is geen man in dit land, om tot ons in te gaan, naar de wijze der ganse aarde.","32":"Kom, laat ons onze vader wijn te drinken geven, en hem hem liggen, opdat wij van onze vader zaad in het leven behouden.","33":"En zij gaven dien nacht haar vader wijn te drinken; en de eerstgeborene kwam, en lag bij haar vader, en hij werd het niet gewaar in haar nederliggen, noch in haar opstaan.","34":"En het geschiedde des anderen daags, dat de eerstgeborene zeide tot de jongste: Zie, ik heb gisteren nacht bij mijn vader gelegen; laat ons ook dezen nacht hem wijn te drinken geven; ga dan in, lig bij hem, opdat wij van onzen vader zaad in het leven behouden.","35":"En zij gaven haar vader ook dien nacht wijn te drinken, en de jongste stond op, en lag bij hem. En hij werd het niet gewaar in haar nederliggen, noch in haar opstaan.","36":"En de twee dochters van Lot werden bevrucht van haar vader.","37":"En de eerstgeborene baarde een zoon, en noemde zijn naam Moab; deze is de vader der Moabieten, tot op dezen dag.","38":"En de jongste baarde ook een zoon, en noemde zijn naam Ben-ammi; deze is de vader der kinderen Ammons, tot op dezen dag."},"KJV":{"1":"And there came two angels to Sodom at even; and Lot sat in the gate of Sodom: and Lot seeing *them* rose up to meet them; and he bowed himself with his face toward the ground;","2":"And he said, Behold now, my lords, turn in, I pray you, into your servant's house, and tarry all night, and wash your feet, and ye shall rise up early, and go on your ways. And they said, Nay; but we will abide in the street all night.","3":"And he pressed upon them greatly; and they turned in unto him, and entered into his house; and he made them a feast, and did bake unleavened bread, and they did eat.","4":"But before they lay down, the men of the city, *even* the men of Sodom, compassed the house round, both old and young, all the people from every quarter:","5":"And they called unto Lot, and said unto him, Where *are* the men which came in to thee this night? bring them out unto us, that we may know","6":"And Lot went out at the door unto them, and shut the door after him,","7":"And said, I pray you, brethren, do not so wickedly.","8":"Behold now, I have two daughters which have not known man; let me, I pray you, bring them out unto you, and do ye to them as *is* good in your eyes: only unto these men do nothing; for therefore came they under the shadow of my roof.","9":"And they said, Stand back. And they said *again*, This one *fellow* came in to sojourn, and he will needs be a judge: now will we deal worse with thee, than with them. And they pressed sore upon the man, *even* Lot, and came near to break the door.","10":"But the men put forth their hand, and pulled Lot into the house to them, and shut to the door.","11":"And they smote the men that *were* at the door of the house with blindness, both small and great: so that they wearied themselves to find the door.","12":"And the men said unto Lot, Hast thou here any besides? son in law, and thy sons, and thy daughters, and whatsoever thou hast in the city, bring *them* out of this place:","13":"For we will destroy this place, because the cry of them is waxen great before the face of the LORD; and the LORD hath sent us to destroy","14":"And Lot went out, and spake unto his sons in law, which married his daughters, and said, Up, get you out of this place; for the LORD will destroy this city. But he seemed as one that mocked unto his sons in law.","15":"And when the morning arose, then the angels hastened Lot, saying, Arise, take thy wife, and thy two daughters, which are here; lest thou be consumed in the iniquity of the city.","16":"And while he lingered, the men laid hold upon his hand, and upon the hand of his wife, and upon the hand of his two daughters; the LORD being merciful unto him: and they brought him forth, and set him without the city.","17":"And it came to pass, when they had brought them forth abroad, that he said, Escape for thy life; look not behind thee, neither stay thou in all the plain; escape to the mountain, lest thou be consumed.","18":"And Lot said unto them, Oh, not so, my Lord:","19":"Behold now, thy servant hath found grace in thy sight, and thou hast magnified thy mercy, which thou hast shewed unto me in saving my life; and I cannot escape to the mountain, lest some evil take me, and I die:","20":"Behold now, this city *is* near to flee unto, and it *is* a little one: Oh, let me escape thither, (*is* it not a little one?) and my soul shall live.","21":"And he said unto him, See, I have accepted thee concerning this thing also, that I will not overthrow this city, for the which thou hast spoken.","22":"Haste thee, escape thither; for I cannot do any thing till thou be come thither. Therefore the name of the city was called Zoar.","23":"The sun was risen upon the earth when Lot entered into Zoar.","24":"Then the LORD rained upon Sodom and upon Gomorrah brimstone and fire from the LORD out of heaven;","25":"And he overthrew those cities, and all the plain, and all the inhabitants of the cities, and that which grew upon the ground.","26":"But his wife looked back from behind him, and she became a pillar of salt.","27":"And Abraham gat up early in the morning to the place where he stood before the LORD:","28":"And he looked toward Sodom and Gomorrah, and toward all the land of the plain, and beheld, and, lo, the smoke of the country went up as the smoke of a furnace.","29":"And it came to pass, when God destroyed the cities of the plain, that God remembered Abraham, and sent Lot out of the midst of the overthrow, when he overthrew the cities in the which Lot dwelt.","30":"And Lot went up out of Zoar, and dwelt in the mountain, and his two daughters with him; for he feared to dwell in Zoar: and he dwelt in a cave, he and his two daughters.","31":"And the firstborn said unto the younger, Our father *is* old, and *there is* not a man in the earth to come in unto us after the manner of all the earth:","32":"Come, let us make our father drink wine, and we will lie with him, that we may preserve seed of our father.","33":"And they made their father drink wine that night: and the firstborn went in, and lay with her father; and he perceived not when she lay down, nor when she arose.","34":"And it came to pass on the morrow, that the firstborn said unto the younger, Behold, I lay yesternight with my father: let us make him drink wine this night also; and go thou in, *and* lie with him, that we may preserve seed of our father.","35":"And they made their father drink wine that night also: and the younger arose, and lay with him; and he perceived not when she lay down, nor when she arose.","36":"Thus were both the daughters of Lot with child by their father.","37":"And the firstborn bare a son, and called his name Moab: the same *is* the father of the Moabites unto this day.","38":"And th v\" data-code=\"H4397\">angels</span> to <span class=\"wl wl-kjv\" data-code=\"H5467\">Sodom</span> at <span class=\"wl wl-kjv\" data-code=\"H6153\">even;</span> and <span class=\"wl wl-kjv\" data-code=\"H3876\">Lot</span> <span class=\"wl wl-kjv\" data-code=\"H3427\">sat</span> in the <span class=\"wl wl-kjv\" data-code=\"H8179\">gate</span> of <span class=\"wl wl-kjv\" data-code=\"H5467\">Sodom:</span> and <span class=\"wl wl-kjv\" data-code=\"H3876\">Lot</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">seeing</span> them rose <span class=\"wl wl-kjv\" data-code=\"H6965\">up</span> to <span class=\"wl wl-kjv\" data-code=\"H7125\">meet</span> them; and he <span class=\"wl wl-kjv\" data-code=\"H7812\">bowed</span> himself with his <span class=\"wl wl-kjv\" data-code=\"H639\">face</span> toward the ground;","2":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Behold now, my <span class=\"wl wl-kjv\" data-code=\"H113\">lords,</span> turn <span class=\"wl wl-kjv\" data-code=\"H5493\">in,</span> I pray you, into your <span class=\"wl wl-kjv\" data-code=\"H5650\">servant's</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> and tarry all <span class=\"wl wl-kjv\" data-code=\"H3885\">night,</span> and <span class=\"wl wl-kjv\" data-code=\"H7364\">wash</span> your <span class=\"wl wl-kjv\" data-code=\"H7272\">feet,</span> and ye shall rise up <span class=\"wl wl-kjv\" data-code=\"H7925\">early,</span> and <span class=\"wl wl-kjv\" data-code=\"H1980\">go</span> on your <span class=\"wl wl-kjv\" data-code=\"H1870\">ways.</span> And they <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Nay; but we will <span class=\"wl wl-kjv\" data-code=\"H3885\">abide</span> in the <span class=\"wl wl-kjv\" data-code=\"H7339\">street</span> all night.","3":"And he <span class=\"wl wl-kjv\" data-code=\"H6484\">pressed</span> upon them <span class=\"wl wl-kjv\" data-code=\"H3966\">greatly;</span> and they turned <span class=\"wl wl-kjv\" data-code=\"H5493\">in</span> unto him, and <span class=\"wl wl-kjv\" data-code=\"H935\">entered</span> into his <span class=\"wl wl-kjv\" data-code=\"H1004\">house;</span> and he <span class=\"wl wl-kjv\" data-code=\"H6213\">made</span> them a <span class=\"wl wl-kjv\" data-code=\"H4960\">feast,</span> and did <span class=\"wl wl-kjv\" data-code=\"H644\">bake</span> unleavened <span class=\"wl wl-kjv\" data-code=\"H4682\">bread,</span> and they did eat.","4":"But before they lay <span class=\"wl wl-kjv\" data-code=\"H7901\">down,</span> the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> of the <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> even the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H5467\">Sodom,</span> <span class=\"wl wl-kjv\" data-code=\"H5437\">compassed</span> the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> <span class=\"wl wl-kjv\" data-code=\"H5437\">round,</span> both <span class=\"wl wl-kjv\" data-code=\"H2205\">old</span> and <span class=\"wl wl-kjv\" data-code=\"H5288\">young,</span> all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> from every quarter:","5":"And they <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> unto <span class=\"wl wl-kjv\" data-code=\"H3876\">Lot,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, Where are the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> which came <span class=\"wl wl-kjv\" data-code=\"H935\">in</span> to thee this <span class=\"wl wl-kjv\" data-code=\"H3915\">night?</span> bring them <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> unto us, that we may know","6":"And <span class=\"wl wl-kjv\" data-code=\"H3876\">Lot</span> went <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> at the <span class=\"wl wl-kjv\" data-code=\"H6607\">door</span> unto them, and <span class=\"wl wl-kjv\" data-code=\"H5462\">shut</span> the <span class=\"wl wl-kjv\" data-code=\"H1817\">door</span> after him,","7":"And <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> I pray you, <span class=\"wl wl-kjv\" data-code=\"H251\">brethren,</span> do not so wickedly.","8":"Behold now, I have <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters</span> which have not <span class=\"wl wl-kjv\" data-code=\"H3045\">known</span> <span class=\"wl wl-kjv\" data-code=\"H376\">man;</span> let me, I pray you, bring them <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> unto you, and <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> ye to them as is <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> in your <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes:</span> only unto <span class=\"wl wl-kjv\" data-code=\"H411\">these</span> <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> <span class=\"wl wl-kjv\" data-code=\"H408\">nothing;</span> for therefore <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> they under the <span class=\"wl wl-kjv\" data-code=\"H6738\">shadow</span> of my roof.","9":"And they <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H5066\">Stand</span> <span class=\"wl wl-kjv\" data-code=\"H1973\">back.</span> And they <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> again, This <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> fellow came <span class=\"wl wl-kjv\" data-code=\"H935\">in</span> to <span class=\"wl wl-kjv\" data-code=\"H1481\">sojourn,</span> and he will <span class=\"wl wl-kjv\" data-code=\"H8199\">needs</span> be a <span class=\"wl wl-kjv\" data-code=\"H8199\">judge:</span> now will we deal <span class=\"wl wl-kjv\" data-code=\"H7489\">worse</span> with thee, than with them. And they <span class=\"wl wl-kjv\" data-code=\"H6484\">pressed</span> <span class=\"wl wl-kjv\" data-code=\"H3966\">sore</span> l-kjv\" data-code=\"H5892\">city,</span> bring them <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> of this place:","13":"For <span class=\"wl wl-kjv\" data-code=\"H587\">we</span> will <span class=\"wl wl-kjv\" data-code=\"H7843\">destroy</span> this <span class=\"wl wl-kjv\" data-code=\"H4725\">place,</span> because the cry of <span class=\"wl wl-kjv\" data-code=\"H6818\">them</span> is waxen <span class=\"wl wl-kjv\" data-code=\"H1431\">great</span> <span class=\"wl wl-kjv\" data-code=\"H854\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H6440\">face</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD;</span> and the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> us to destroy","14":"And <span class=\"wl wl-kjv\" data-code=\"H3876\">Lot</span> went <span class=\"wl wl-kjv\" data-code=\"H3318\">out,</span> and <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> unto his sons in <span class=\"wl wl-kjv\" data-code=\"H2860\">law,</span> which <span class=\"wl wl-kjv\" data-code=\"H3947\">married</span> his <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H6965\">Up,</span> get you <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> of this <span class=\"wl wl-kjv\" data-code=\"H4725\">place;</span> for the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> will <span class=\"wl wl-kjv\" data-code=\"H7843\">destroy</span> this <span class=\"wl wl-kjv\" data-code=\"H5892\">city.</span> But he seemed as one that <span class=\"wl wl-kjv\" data-code=\"H6711\">mocked</span> <span class=\"wl wl-kjv\" data-code=\"H5869\">unto</span> his sons in law.","15":"And <span class=\"wl wl-kjv\" data-code=\"H3644\">when</span> the <span class=\"wl wl-kjv\" data-code=\"H7837\">morning</span> <span class=\"wl wl-kjv\" data-code=\"H5927\">arose,</span> then the <span class=\"wl wl-kjv\" data-code=\"H4397\">angels</span> <span class=\"wl wl-kjv\" data-code=\"H213\">hastened</span> <span class=\"wl wl-kjv\" data-code=\"H3876\">Lot,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H6965\">Arise,</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> thy <span class=\"wl wl-kjv\" data-code=\"H802\">wife,</span> and thy <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters,</span> which are <span class=\"wl wl-kjv\" data-code=\"H4672\">here;</span> lest thou be <span class=\"wl wl-kjv\" data-code=\"H5595\">consumed</span> in the <span class=\"wl wl-kjv\" data-code=\"H5771\">iniquity</span> of the city.","16":"And while he <span class=\"wl wl-kjv\" data-code=\"H4102\">lingered,</span> the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> laid <span class=\"wl wl-kjv\" data-code=\"H2388\">hold</span> upon his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> and upon the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of his <span class=\"wl wl-kjv\" data-code=\"H802\">wife,</span> and upon the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of his <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters;</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> being <span class=\"wl wl-kjv\" data-code=\"H2551\">merciful</span> unto him: and they brought him <span class=\"wl wl-kjv\" data-code=\"H3318\">forth,</span> and set <span class=\"wl wl-kjv\" data-code=\"H3240\">him</span> <span class=\"wl wl-kjv\" data-code=\"H2351\">without</span> the city.","17":"And it came to pass, when they had brought them <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> <span class=\"wl wl-kjv\" data-code=\"H2351\">abroad,</span> that he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H4422\">Escape</span> <span class=\"wl wl-kjv\" data-code=\"H5921\">for</span> thy <span class=\"wl wl-kjv\" data-code=\"H5315\">life;</span> <span class=\"wl wl-kjv\" data-code=\"H5027\">look</span> not behind <span class=\"wl wl-kjv\" data-code=\"H310\">thee,</span> neither <span class=\"wl wl-kjv\" data-code=\"H5975\">stay</span> thou in all the <span class=\"wl wl-kjv\" data-code=\"H3603\">plain;</span> <span class=\"wl wl-kjv\" data-code=\"H4422\">escape</span> to the <span class=\"wl wl-kjv\" data-code=\"H2022\">mountain,</span> lest thou be consumed.","18":"And <span class=\"wl wl-kjv\" data-code=\"H3876\">Lot</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto them, Oh, not so, my Lord:","19":"Behold now, thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> hath <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> <span class=\"wl wl-kjv\" data-code=\"H2580\">grace</span> in thy <span class=\"wl wl-kjv\" data-code=\"H5869\">sight,</span> and thou hast <span class=\"wl wl-kjv\" data-code=\"H1431\">magnified</span> thy <span class=\"wl wl-kjv\" data-code=\"H2617\">mercy,</span> which thou hast <span class=\"wl wl-kjv\" data-code=\"H6213\">shewed</span> unto <span class=\"wl wl-kjv\" data-code=\"H5978\">me</span> in <span class=\"wl wl-kjv\" data-code=\"H2421\">saving</span> my <span class=\"wl wl-kjv\" data-code=\"H5315\">life;</span> and I <span class=\"wl wl-kjv\" data-code=\"H3201\">cannot</span> <span class=\"wl wl-kjv\" data-code=\"H4422\">escape</span> to the <span class=\"wl wl-kjv\" data-code=\"H2022\">mountain,</span> lest some <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> <span class=\"wl wl-kjv\" data-code=\"H1692\">take</span> me, and I die:","20":"Behold now, this <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> is <span class=\"wl wl-kjv\" data-code=\"H7138\">near</span> to <span class=\"wl wl-kjv\" data-code=\"H5127\">flee</span> unto, and <span class=\"wl wl-kjv\" data-code=\"H1931\">it</span> is a little <span class=\"wl wl-kjv\" data-code=\"H4705\">one:</span> Oh, let me <span class=\"wl wl-kjv\" data-code=\"H4422\">escape</span> thither, (is it not a little <span class=\"wl wl-kjv\" data-code=\"H4705\">one?)</span> and my <span class=\"wl wl-kjv\" data-code=\"H5315\">soul</span> shall live.","21":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, <span class=\"wl wl-kjv\" data-code=\"H2009\">See,</span> I have <span class=\"wl wl-kjv\" data-code=\"H5375\">accepted</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">thee</span> concerning this <span class=\"wl wl-kjv\" data-code=\"H1697\">thing</span> also, that I will not <span class=\"wl wl-kjv\" data-code=\"H2015\">overthrow</span> this <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> for the <span class=\"wl wl-kjv\" data-code=\"H834\">which</span> thou hast spoken.","22":"<span class=\"wl wl-kjv\" data-code=\"H4116\">Haste</span> thee, <span class=\"wl wl-kjv\" data-code=\"H4422\">escape</span> thither; for I <span class=\"wl wl-kjv\" data-code=\"H3201\">cannot</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> any <span class=\"wl wl-kjv\" data-code=\"H1697\">thing</span> till thou be <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> thither. Therefore the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> was <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> Zoar.","23":"The <span class=\"wl wl-kjv\" data-code=\"H8121\">sun</span> was <span class=\"wl wl-kjv\" data-code=\"H3318\">risen</span> upon the <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> when <span class=\"wl wl-kjv\" data-code=\"H3876\">Lot</span> <span class=\"wl wl-kjv\" data-code=\"H935\">entered</span> into Zoar.","24":"Then the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H4305\">rained</span> upon <span class=\"wl wl-kjv\" data-code=\"H5467\">Sodom</span> and upon <span class=\"wl wl-kjv\" data-code=\"H6017\">Gomorrah</span> <span class=\"wl wl-kjv\" data-code=\"H1614\">brimstone</span> and <span class=\"wl wl-kjv\" data-code=\"H784\">fire</span> from the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> out of heaven;","25":"And he <span class=\"wl wl-kjv\" data-code=\"H2015\">overthrew</span> <span class=\"wl wl-kjv\" data-code=\"H411\">those</span> <span class=\"wl wl-kjv\" data-code=\"H5892\">cities,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H3603\">plain,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitants</span> of the <span class=\"wl wl-kjv\" data-code=\"H5892\">cities,</span> and that which <span class=\"wl wl-kjv\" data-code=\"H6780\">grew</span> upon the ground.","26":"But his <span class=\"wl wl-kjv\" data-code=\"H802\">wife</span> looked <span class=\"wl wl-kjv\" data-code=\"H5027\">back</span> from behind <span class=\"wl wl-kjv\" data-code=\"H310\">him,</span> and she became a <span class=\"wl wl-kjv\" data-code=\"H5333\">pillar</span> of salt.","27":"And <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham</span> gat up <span class=\"wl wl-kjv\" data-code=\"H7925\">early</span> in the <span class=\"wl wl-kjv\" data-code=\"H1242\">morning</span> to the <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> where he <span class=\"wl wl-kjv\" data-code=\"H5975\">stood</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the LORD:","28":"And he <span class=\"wl wl-kjv\" data-code=\"H8259\">looked</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">toward</span> <span class=\"wl wl-kjv\" data-code=\"H5467\">Sodom</span> and <span class=\"wl wl-kjv\" data-code=\"H6017\">Gomorrah,</span> and <span class=\"wl wl-kjv\" data-code=\"H6440\">toward</span> all the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of the <span class=\"wl wl-kjv\" data-code=\"H3603\">plain,</span> and <span class=\"wl wl-kjv\" data-code=\"H7200\">beheld,</span> and, lo, the <span class=\"wl wl-kjv\" data-code=\"H7008\">smoke</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">country</span> went <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> as the <span class=\"wl wl-kjv\" data-code=\"H7008\">smoke</span> of a furnace.","29":"And it came to pass, when <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H7843\">destroyed</span> the <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> of the <span class=\"wl wl-kjv\" data-code=\"H3603\">plain,</span> that <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H2142\">remembered</span> <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham,</span> and <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> <span class=\"wl wl-kjv\" data-code=\"H3876\">Lot</span> out of the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> of the <span class=\"wl wl-kjv\" data-code=\"H2018\">overthrow,</span> when he <span class=\"wl wl-kjv\" data-code=\"H2015\">overthrew</span> the <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> in the <span class=\"wl wl-kjv\" data-code=\"H2004\">which</span> <span class=\"wl wl-kjv\" data-code=\"H3876\">Lot</span> dwelt.","30":"And <span class=\"wl wl-kjv\" data-code=\"H3876\">Lot</span> went <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> out of <span class=\"wl wl-kjv\" data-code=\"H6820\">Zoar,</span> and <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelt</span> in the <span class=\"wl wl-kjv\" data-code=\"H2022\">mountain,</span> and his <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters</span> with him; for he <span class=\"wl wl-kjv\" data-code=\"H3372\">feared</span> to <span class=\"wl wl-kjv\" data-code=\"H3427\">dwell</span> in <span class=\"wl wl-kjv\" data-code=\"H6820\">Zoar:</span> and he <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelt</span> in a <span class=\"wl wl-kjv\" data-code=\"H4631\">cave,</span> he and his <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> daughters.","31":"And the <span class=\"wl wl-kjv\" data-code=\"H1067\">firstborn</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto the <span class=\"wl wl-kjv\" data-code=\"H6810\">younger,</span> Our <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> is <span class=\"wl wl-kjv\" data-code=\"H2204\">old,</span> and there is not a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> to come <span class=\"wl wl-kjv\" data-code=\"H935\">in</span> unto us after the <span class=\"wl wl-kjv\" data-code=\"H1870\">manner</span> of all the earth:","32":"<span class=\"wl wl-kjv\" data-code=\"H3212\">Come,</span> let us <span class=\"wl wl-kjv\" data-code=\"H8248\">make</span> our <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> <span class=\"wl wl-kjv\" data-code=\"H8248\">drink</span> <span class=\"wl wl-kjv\" data-code=\"H3196\">wine,</span> and we will <span class=\"wl wl-kjv\" data-code=\"H7901\">lie</span> with him, that we may <span class=\"wl wl-kjv\" data-code=\"H2421\">preserve</span> <span class=\"wl wl-kjv\" data-code=\"H2233\">seed</span> of our father.","33":"And they <span class=\"wl wl-kjv\" data-code=\"H8248\">made</span> their <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> <span class=\"wl wl-kjv\" data-code=\"H8248\">drink</span> <span class=\"wl wl-kjv\" data-code=\"H3196\">wine</span> that <span class=\"wl wl-kjv\" data-code=\"H3915\">night:</span> and the <span class=\"wl wl-kjv\" data-code=\"H1067\">firstborn</span> went <span class=\"wl wl-kjv\" data-code=\"H935\">in,</span> and <span class=\"wl wl-kjv\" data-code=\"H7901\">lay</span> with her <span class=\"wl wl-kjv\" data-code=\"H1\">father;</span> and he <span class=\"wl wl-kjv\" data-code=\"H3045\">perceived</span> not when she lay <span class=\"wl wl-kjv\" data-code=\"H7901\">down,</span> nor when she arose.","34":"And it came to pass on the <span class=\"wl wl-kjv\" data-code=\"H4283\">morrow,</span> that the <span class=\"wl wl-kjv\" data-code=\"H1067\">firstborn</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto the <span class=\"wl wl-kjv\" data-code=\"H6810\">younger,</span> Behold, I <span class=\"wl wl-kjv\" data-code=\"H7901\">lay</span> <span class=\"wl wl-kjv\" data-code=\"H570\">yesternight</span> with my <span class=\"wl wl-kjv\" data-code=\"H1\">father:</span> let us make him <span class=\"wl wl-kjv\" data-code=\"H8248\">drink</span> <span class=\"wl wl-kjv\" data-code=\"H3196\">wine</span> this <span class=\"wl wl-kjv\" data-code=\"H3915\">night</span> also; and go thou <span class=\"wl wl-kjv\" data-code=\"H935\">in,</span> and <span class=\"wl wl-kjv\" data-code=\"H7901\">lie</span> with him, that we may <span class=\"wl wl-kjv\" data-code=\"H2421\">preserve</span> <span class=\"wl wl-kjv\" data-code=\"H2233\">seed</span> of our father.","35":"And they <span class=\"wl wl-kjv\" data-code=\"H8248\">made</span> their <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> <span class=\"wl wl-kjv\" data-code=\"H8248\">drink</span> <span class=\"wl wl-kjv\" data-code=\"H3196\">wine</span> <span class=\"wl wl-kjv\" data-code=\"H1931\">that</span> <span class=\"wl wl-kjv\" data-code=\"H3915\">night</span> also: and the <span class=\"wl wl-kjv\" data-code=\"H6810\">younger</span> <span class=\"wl wl-kjv\" data-code=\"H6965\">arose,</span> and <span class=\"wl wl-kjv\" data-code=\"H7901\">lay</span> with him; and he <span class=\"wl wl-kjv\" data-code=\"H3045\">perceived</span> not when she lay <span class=\"wl wl-kjv\" data-code=\"H7901\">down,</span> nor when she arose.","36":"Thus were <span class=\"wl wl-kjv\" data-code=\"H8147\">both</span> the <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters</span> of <span class=\"wl wl-kjv\" data-code=\"H3876\">Lot</span> with <span class=\"wl wl-kjv\" data-code=\"H2029\">child</span> by their father.","37":"And the <span class=\"wl wl-kjv\" data-code=\"H1067\">firstborn</span> <span class=\"wl wl-kjv\" data-code=\"H3205\">bare</span> a <span class=\"wl wl-kjv\" data-code=\"H1121\">son,</span> and <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> his <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab:</span> the <span class=\"wl wl-kjv\" data-code=\"H1931\">same</span> is the <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> of the <span class=\"wl wl-kjv\" data-code=\"H4124\">Moabites</span> unto this day.","38":"And the <span class=\"wl wl-kjv\" data-code=\"H6810\">younger,</span> she also <span class=\"wl wl-kjv\" data-code=\"H3205\">bare</span> a <span class=\"wl wl-kjv\" data-code=\"H1121\">son,</span> and <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> his <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> <span class=\"wl wl-kjv\" data-code=\"H1151\">Benammi:</span> the same is the <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H5983\">Ammon</span> unto this day."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"die twee","tekst":"Van welke boven Gen 18:22, gesproken wordt, waar zij mannen genoemd worden; gelijk onder, vs.5, enz. Het Hebr. woord betekent gezanten, of boden, gelijk ook het woord engelen, dat uit de Griekse taal genomen is."},{"catchword":"Lot zat","tekst":"Verg. boven Gen 18:1-2."}],"2":[{"catchword":"van uw","tekst":"Dat is, in mijn huis."},{"catchword":"op de straat","tekst":"Wel verstaande, ten ware Lot met hard aanhouden hen bewoog om bij hem te vernachten, gelijk geschied is. Verg. Luk 24:28-29."}],"3":[{"catchword":"ongezuurde","tekst":"Die eerder vaardig konden zijn, opdat zij zich te spoediger ter rust mochten begeven. Verg. boven Gen 13:2."},{"catchword":"zij aten","tekst":"Zie boven hoofdstuk Gen 18:2."}],"4":[{"catchword":"te slapen","tekst":"Hebr. eer zij nederlagen, of, neder gelegen waren, te weten om te slapen; alzo onder Gen 28:13; Lev 14:47, en Lev 26:6, enz."},{"catchword":"van den","tekst":"Een overgegeven gruwzame moedwilligheid, waarin zij allen hebben samengespannen, jong en oud, van alle hoeken der stad, en dat wel in den nacht."},{"catchword":"van het uiterste","tekst":"Te weten, der stad. Versta, van het ene en het andere einde der stad."}],"5":[{"catchword":"riepen","tekst":"Zij schaamden zich niet hun eigen zonde en schande openbaar uit te roepen, en voor ieder man bekend te staan, Dezen Sodomietischen roem in het kwaad verwijt God den Israëlieten, Isa 3:9, waar Hij zegt: Hun zonden spreken zij vrijuit, gelijk Sodom, zij verbergen haar niet."},{"catchword":"opdat","tekst":"Wat gruwel zij door deze manier van spreken verstaan kan men uit het antwoord van Lot klaarlijk zien. Zie Lev 18:22, en Lev 20:13; Rom 1:26-27; 1Co 6:10; Jud 1:7."}],"7":[{"catchword":"broeders","tekst":"Aldus sprak Lot die boze mensen beleefdelijk aan, noemende hen broeders ten aanzien van de algemene broederschap der natuur; verg. boven Gen 9:5; onder Gen 29:4; Lev 19:17."}],"8":[{"catchword":"die geen","tekst":"Zie deze manier van spreken, onder Gen 24:16; Num 31:18; Jdg 11:39; Luk 1:34."},{"catchword":"doet haar","tekst":"Lot, een schrikkelijke zonde willende beletten, laat door menselijke verbaasdheid en radeloosheid een andere zonde toe, tegen zijn vaderlijken plicht en den regel; Rom 3:8."},{"catchword":"goed is","tekst":"Dat is, alzo het u wel gevalt en belieft. Zie deze manier van spreken onder Gen 20:15, en Gen 41:37; Num 24:1, enz."},{"catchword":"daarom","tekst":"Te weten, om vrij te zijn van alle schade en geweld. Onder iemands schaduw te komen, is zich onder zijn schut en scherm te begeven; verg. Jdg 9:15; Psa 36:8; Jer 48:45."}],"9":[{"catchword":"Kom verder","tekst":"Alsof zij hem bedreigden, zo zij hem in handen hadden kunnen krijgen."},{"catchword":"zou hij","tekst":"Hebr. zou hij rechten rechtende? of hij zou rechten rechtende. Zie de aant. boven, Gen 2:16. Verg. 2Pe 2:8."}],"10":[{"catchword":"die mannen","tekst":"Die twee engelen, Lots gasten."}],"11":[{"catchword":"met verblindheden,","tekst":"Te weten, niet alleen des lichaams, maar ook des geestes. Deze mirakeleuze straf was niet zozeer in het gezicht der ogen, zodat zij gans niet konden zien, maar was meest in het oordeel des verstands, zodat zij niet konden onderscheiden hetgeen zij enigszins zagen. Zie iets dergelijks, 2Ki 6:18."},{"catchword":"zodat","tekst":"De deur met groten arbeid zoekende, en niet kunnende vinden, werden zij zo vermoeid, dat zij moesten ophouden en vertrekken."}],"12":[{"catchword":"die gij","tekst":"Anders, wat gij hebt, enz."}],"13":[{"catchword":"haar geroep","tekst":"Versta het geroep der inwoners van Sodom."},{"catchword":"groot","tekst":"Zie boven Gen 4:10, en Gen 18:20."},{"catchword":"voor het","tekst":"Alzo gekomen tot zijne kennis, dat Hij naar zijn gerechtigheid wraak daarover doen wilde. Want het aangezicht des Heeren is tegen degenen, die kwaad doen, om hun gedachtenis van de aarde uit te roeien, Psa 34:17."}],"14":[{"catchword":"nemen","tekst":"Dat is, trouwen. Alzo boven Gen 6:2, en onder Gen 24:3, en Gen 28:6, en Gen 34:9; Deu 7:3."},{"catchword":"als jokkende","tekst":"Een levend beeld van de zorgeloze en vleselijke mensen, ten tijde van nakende straffen. Zie Mat 24:38; Luk 17:28-29; 1Th 5:3."}],"15":[{"catchword":"die voorhanden","tekst":"Hebr. die gevonden worden. Hieruit leiden enigen af, dat Lot meer dochters gehad heeft, die bij haar mannen in Sodom gebleven en vergaan zijn."},{"catchword":"in de","tekst":"Of, in de straf der ongerechtigheid. Zie boven Gen 4:13."}],"16":[{"catchword":"vertoefde;","tekst":"Zonder twijfel belet zijnde door menigerlei vleselijke gedachten en bekommeringen."},{"catchword":"verschoning","tekst":"Die Lot bekent, onder vs.19."}],"17":[{"catchword":"hij","tekst":"Te weten, de Heere, die bij Abraham was blijven staan; boven Gen 18:22, en later van hem weggegaan, vs.33. Hoewel enigen menen dat het een van de engelen geweest is, die Lot verschenen waren."},{"catchword":"Behoud","tekst":"Of, ontkomt, aldus in het volgende."},{"catchword":"levens","tekst":"Hebr. ziel, gelijk onder Gen 37:21; Deu 22:26; Jos 2:13; 1Ki 19:3; 2Ki 7:7; Mat 2:20. De zin is: dat hij zijn goederen moest vergeten, maar op zijn leven denken."}],"18":[{"catchword":"tot hen","tekst":"Te weten tot de engelen; richtende nochtans zijn woorden in het vervolg tot den Heere, die nu bij de twee engelen schijnt tegenwoordig geweest te zijn, zoals in het voorgaande hoofdst. bij Abraham geschied was."}],"19":[{"catchword":"genade","tekst":"Zie boven Gen 6:8."},{"catchword":"opdat mij","tekst":"Lot is bezorgd dat het gebergte te ver zal zijn, en dat hij onder weg door dat verderf zou mogen overvallen worden."},{"catchword":"kwaad","tekst":"Versta, het kwaad der straf, gelijk dit woord aldus dikwijls gebruikt wordt. Zie Deu 31:17; 1Ki 9:9, en 1Ki 14:10; Isa 45:7; Jer 6:19; Amo 3:6."}],"20":[{"catchword":"zij is","tekst":"Anders, het is toch wat kleind, of gerings; en zo in het volgende."},{"catchword":"(is zij niet","tekst":"And. Is dat niet een kleine zaak?"}],"21":[{"catchword":"Ik heb","tekst":"Dat is, Ik zal u goedertieren zijn, en deze bede uit genade vergunnen. Zie deze manier van spreken onder Gen 32:20, en vergelijk de aantekening."}],"22":[{"catchword":"want Ik","tekst":"Omdat mijn goddelijk besluit is, u genadiglijk te verschonen."},{"catchword":"Zoar","tekst":"Dat is, kleine, tevoren genoemd Bela boven Gen 14:2. Zie ook boven Gen 13:10."}],"24":[{"catchword":"de HEERE","tekst":"Te weten, de Zoon van God, die van één wezen, macht en heerlijkheid is met den Vader, en hier tevoren in dit en het voorgaande hoofdstuk dikwijls JHWH of HEERE is genoemd geweest; aan wien de Vader alle oordeel heeft overgegeven; Joh 5:22."},{"catchword":"en vuur","tekst":"Tevoren heeft God een algemeen oordeel uitgevoerd door het water; hier gebruikt Hij een schrikkelijk en particulier oordeel door vuur, om daarmede te verteren de heilloze, verhitte Sodomieten. Een voorbeeld van de eeuwige straf; Rev 19:20. Dit is geschied [volgens sommiger berekening] in het jaar na de schepping 2048."},{"catchword":"Sodom","tekst":"Voeg hierbij Adama en Zebóïm uit Deu 29:23; Hos 11:8. Want al deze vier streden zijn tegelijk verbrand."},{"catchword":"van den","tekst":"Dat is, naar het gevoelen van vele treffelijke uitleggers, van den Vader, die door den Zoon werkt; Joh 5:19."}],"26":[{"catchword":"om van","tekst":"Tegen het gebod, vs.17, in welke overtreding met ongeloof en ongehoorzaamheid vermengd geweest zijn gierigheid en ondankbaarheid."},{"catchword":"achter","tekst":"Dat is, van achter Lot, die de Leidsman en voorganger was, zich haastende om te komen ter plaatse, waar hij mocht behouden worden."},{"catchword":"een zoutpilaar","tekst":"Versta, haar lichaam, hetwelk veranderd is geworden in een zoutachtige materie zeer hard, om lang te duren en staande te blijven. Zie Luk 17:32. Josefus getuigt dat deze zoutpilaar nog tot zijn tijd gestaan heeft, lib.Ant. 1, c 12. Deze landstreek is naderhand genoemd de Zoutzee. Zie boven Gen 14:3."}],"27":[{"catchword":"waar hij","tekst":"Zie boven Gen 18:22."}],"29":[{"catchword":"gedacht,","tekst":"Eensdeels aan Abrahams voorbede. Zie boven Gen 18:23-24. Anderdeels aan zijn beloften. Zie boven Gen 12:3."},{"catchword":"in welke","tekst":"Dat is, in welker ene. Zie dergelijke manier van spreken, boven Gen 18:9, en Gen 19:12; Jon 1:5; Mat 27:44."}],"30":[{"catchword":"want","tekst":"Waar hij nochtans tevoren meende zich allerveiligst te zullen bergen. Zie vs.20; maar nu vreest hij dat God die stad mede zou mogen verderven, of dat hij aldaar enig geweld mocht lijden van de inwoners."}],"31":[{"catchword":"jongste","tekst":"Hebr. kleine, en alzo in de volgende vs.34,35, 38. Dat is, de jongste."},{"catchword":"in dit","tekst":"Zij wisten wel dat te Zoar mannen waren, maar vreesden dat die gelijk de anderen, mede vergaan zouden."},{"catchword":"om tot","tekst":"Zie deze manier van spreken, boven Gen 6:4, en Gen 16:2, Gen 16:4; Deu 25:5."},{"catchword":"naar de","tekst":"Hebr. naar den weg. Zie boven, Gen 18:11."}],"32":[{"catchword":"wijn te","tekst":"Die zij tot voorraad op haar reis van Sodom of Zoar medegebracht hadden."},{"catchword":"bij hem","tekst":"Een schrikkelijke voorslag, en val in Lots huisgezin."},{"catchword":"zaad in","tekst":"Een zoon, of kind; aldus onder vs.34. Zie boven Gen 4:25."}],"37":[{"catchword":"der Moabieten,","tekst":"Hebr. Moab. Een volk in de Heilige Schrift genoeg bekend, hebbende gewoond aan de oostzijde van de Jordaan en de Dode Zee, tussen de rivier Arnon en Jabbok."}],"38":[{"catchword":"der kinderen","tekst":"Dat is, der Ammonieten; een volk in de Heilige schrift mede genoeg bekend; hebbende mede gewoond oostwaarts van Palestina, doch noordwaarts van de Moabieten."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"And the two angels [of whom mention is made above chapter 18.22 where they are called men as below verse 5 &c. the Hebrew word doth signify ambassadors sent ones messengers as also doth the word angels taken from the Greek tongue] came to Sodom in the evening and Lot sate in the gate of Sodom and when Lot saw them he arose to meet them and bowed himself with the face to the ground [compare above chapter 18. Verse, 2.]"}],"2":[{"catchword":null,"tekst":"And he said Lo now my Lords turn in I pray unto the house of your servant [ that is into my house ] and overnight lodge there and wash your feet and ye shall arise early and go your way and they said no but we will overnight in the streets [ namely in case Lot should not persuade to the contrary of the importunity and to take up their lodging in his house as came to pass compare Luke 24 verse 28,29.]"}],"3":[{"catchword":null,"tekst":"And he pressed them very much so that they turned into him and came to his house and he made them a feats and baked unleavened cakes [ which could be soon made ready that they might betake themselves so much the sooner to their rest compare above chapter 18.6.] and they did eat [ see above chapter 18 on verse 2.]"}],"4":[{"catchword":null,"tekst":"Before they lay to sleep [ Heb. Before they lay down or when laid down viz. for to sleep so below chapter 28.13 Lev 14:47 and 26.6 &c.] the man of that city the man of Soddom from the youngest to the eldest had surrounded the house [ a most shameless and abominable insolence wherein they all conspired young and old from all parts of the city and that by night too ] and all the people from the utmost end [ of the city namely understand from one end and the other end of it.]"}],"5":[{"catchword":null,"tekst":"And they called upon Lot and said to him where are those men that came this night unto thee? Bring them forth to us [ they are not ashamed to proclaim their sin and abominations in public and to have it known by all men this Sodomitical boasting in evil God reproacheth to the Israelites Isa 3:9 where he saith they boast themselves of their sins like those of Sodom and do not hide them ] that we may acknowledge them [ what kind of abomination they mean by this expression is plain enough by Lots answer see Lev 18:2 and 20.13 and 20.13 Rom 1:26,27 and 1Co 6:9 and Jude verse 7.]"}],"6":[{"catchword":null,"tekst":"Then Lot went forth unto them at the door and he shut the door after him."}],"7":[{"catchword":null,"tekst":"And he said my brethren do no evil I pray [ thus courteously Lot spake to these wretched men calling them brethren in regard of the common brotherhood of nature compare above chapter 9.5 and c below chapter 29.4 and Lev 19:17.]"}],"8":[{"catchword":null,"tekst":"Behold yet I have two daughters who acknowledged men [ see of this phrase below chapter 24.16 Num 31:18 and Jude 11.39 Luk 1:34 ] I will bring them forth unto you and do unto them [ Lot endeavoring to hinder one abominable sin he gives way here through human fearfulness and adverseness unto another sin contrary to his fatherly duty and the rule Rom 3:8] as it is good in your eyes [ even what you will yourselves at your own pleasure see of this phrase below chapter 20.15 an d41.37 Num 24:1 &c.] only do nothing to these men for therefore they are gone in under the shadow of my roof [ viz. to be free and safe from all harm and violence to come under one shadow is to break one under his protection and safeguard compare Jude 9.15Psa 36:8 Jer 48:44.]"}],"9":[{"catchword":null,"tekst":"Then they said come father on [as threatening him if they could but get him into their hands] moreover said they this such a one is come for to dwell here as a stranger and should he judge judging? or he would judge judging see the annotate above chapter 2.16 compare 2Pe 2:8now shall we do the more evil then them and they pressed much upon the men upon Lot and they slept on to break open the door."}],"10":[{"catchword":null,"tekst":"Yet the men [the two angels Lot his guests] put forth their hand and caused Lot to come into them into the house and shut the door."}],"11":[{"catchword":null,"tekst":"And they smote the men at the door of the house with blindness [ viz. not only corporal but spiritual also this miraculous punishment was such upon the sight of their eyes not that they could not see at all but that they were blinded chiefly in the judgment and apprehension of their understanding and disabled thereby to discern and distinguished what they saw in some measure see the like 2kings 6.18] from the least to the greatest so that they grew weary for to find the door [ seeking the door with much labor and not able to find it they were so tired that they were fain to give over and shift away.]"}],"12":[{"catchword":null,"tekst":"Then said those men to Lot whom hast thou here yet more? A son in law or thy sons or thy daughters and all whom or what thou hast in this city bring out of this place."}],"13":[{"catchword":null,"tekst":"For we go to destroy this place for that her cry [ understand that of the inhabitants of Sodom is become or grown great see above chapter 4 on verse 10 and 18.20] before the face of the Lord [thus made known unto him that according to his justice he was now about to avenge it for the face of the Lord is over them that do to avenge it for the face of the LORD is over them that do evil that he may destroy their embrace from the earth Psa 34:17] and the Lord hath sent us forth to destroy her."}],"14":[{"catchword":null,"tekst":"And then Lot went forth and spake to his sons in law that were to take his daughters [ viz. to marry them so above chapter 6.2 and below chapter 24.3 an d228.6 an d34.9 Deu 7:3 ] and said get ye up go forth out of this place for the Lord goeth to destroy this city but he was in the eyes of his sons in law as jesting [ a lively image of the reckless and carnal men in the time approaching judgments see Mat 24:38 Luk 17:28 ,29 , 1Thessalonians 5.3.]"}],"15":[{"catchword":null,"tekst":"And when the dawning arose the angels pressed Lot saying get up thee take thy wife and thy two daughters which are present [ Heb. Which are found hence some conjecture that Lot had more daughters which remained and perished with their husbands in Sodom ] that thou perish not with the unrighteousness of this city [ or in the punishment of the unrighteousness &c. see above chapter 4 on verse 13.]"}],"16":[{"catchword":null,"tekst":"But he delayed [ doubtless being troubled & destructed with manifold carnal thoughts and cares ] so the men apprehend his hand and the hand of his wife and the hand of his two daughters for or because of the sparing of the LORD over them [ which Lot acknowledgeth below verse 19.] and they brought them forth and put them without the city."}],"17":[{"catchword":null,"tekst":"And it came to pass when they had brought them forth without then he said [ Heb. Viz. the LORD that had stayed with Abraham, above chapter 18.22 and was gone from him verse 33 though some do hold that this is one of the two angels that appeared unto Lot] save thee [ and escape so in the sequel ] for thy lifes sake [ Heb. Soul so below chapter 37.21 Deu 22:16 Jos 2:13 1Ki 19:3 2Ki 7:7 Mat 2:0 the meaning is that he should forget to care of his goods and look only to the saving of his life ] and look not about thee back and stand not this plain save thee towards the mountain that thou perish not."}],"18":[{"catchword":null,"tekst":"And Lot said to them [ viz. to the angels and addressing himself nevertheless in the sequel to the LORD who it seems to be present now with the two angels as before at Abraham ]] chapter 18 Nay I pray Lord."}],"19":[{"catchword":null,"tekst":"See yet thy servant hath found grace in thy eyes [ see above chapter 6 on verse 8] and hast made thy bounty great which thou hast don eto m for to save my soul alive but I shall not b able to b preserved towards the mountain left peradventure that evil cleave to me and I should die [ by the evil understand here that of punishment as this word is frequently used see Deuteronomy 31 verse 17 1Ki 9:9 and 14.10 Isa 45:7 Jer 6:19 Amos 3.6 Lot is afraid that the mountain would be too far from him and that he might be surprised with that destruction by the way .]"}],"20":[{"catchword":null,"tekst":"Behold yet this city is near to escape thither and she is little [otherwise it is but a small thing and so in the sequel] let me I pray be saved thitherward is she not little? [Otherwise is not that a small matter?] That my soul may live."}],"21":[{"catchword":null,"tekst":"And he said Lo I have received thy face also in the matter [ that is I shall be favorable to thee and in mercy grant thee this request also see this phrase below chapter 32.0 and compare the annotate] that I do not destroy this city wherefore thou hast spoken."}],"22":[{"catchword":null,"tekst":"Make he salt-sea see above chapter 14.3.]"}],"27":[{"catchword":null,"tekst":"And Abraham got himself up that morning very early towards that place where he had stood before the face of the Lord [see above chapter 18.22.]"}],"28":[{"catchword":null,"tekst":"And he looked towards Sodom and Gomorra and towards all the land of the plain and he saw and behold there went up a smoke from the land like the smoke of the furnace."}],"29":[{"catchword":null,"tekst":"And it came to pass when God destroyed the cities of this plain the Go remembered Abraham [partly the intercession h had made above chapter 18.22,24 and partly the promises made unto him above chapter 12.3] and he led forth Lot out of the midst of destruction in the destroying f those cities in which Lot had dwelt [that is in one of which see the like phrase above chapter 18 .9 and 19.12Jn 1:5 Mat 7:44.]"}],"30":[{"catchword":null,"tekst":"And lot went up out of Zoar and dwelt upon the mountain and his two daughters with him for he was afraid to dwell within zoar [ not withstanding that before he had thought it the safest place to retreat see verse 20 but now he fears God he would likewise destroy that city or else that the inhabitants might do him some mischief and violence .] and he dwelt in a cave he and his two daughters."}],"31":[{"catchword":null,"tekst":"Then said the first born to the youngest [ Heb. The little one ands in the sequel that is the youngest ] our father is old and there is no man in this land [ They knew well enough that there are men at Zoar but they were afraid that these would perish like the rest ] to go in to us [ see of this phrase above chapter 6.4 and 16.2,4 item Deu 25:5] after the manner of all the earth [ Heb. The way of &c. see above chapter 18. On verse 11.]"}],"32":[{"catchword":null,"tekst":"Come let us give wine [ which doubtless they have brought along with them from Sodom or Zoar for provision ] to drink to our father and lie with him [ an abominable enterprise and grievous fall // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

(function vulNoten() {

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

    rij.className = 'vers'; rij.id = 'v' + n;

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
