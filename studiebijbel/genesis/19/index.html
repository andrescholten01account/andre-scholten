ig.", "Jer 23:14": "Maar in de profeten van Jeruzalem zie Ik afschuwelijkheid; zij plegen overspel, en gaan om met valsheid, en sterken de handen van de boosdoeners, zodat zij zich niet bekeren, ieder van zijn boosheid; zij zijn Mij allen als Sodom, en haar inwoners als Gomorra.", "Ef 2:4": "Maar God, Die rijk is in barmhartigheid door Zijn grote liefde, waarmee Hij ons liefgehad heeft,", "Mark 6:5": "En Hij kon daar geen kracht doen; behalve dat Hij een paar zieken de handen oplegde en hen genas.", "Matt 13:50": "En zij zullen hen in de vurige oven werpen; daar zal geween zijn en het geknars van de tanden.", "Jer 6:15": "Zijn zij beschaamd, omdat zij gruwel bedreven hebben? Ja, zij schamen zich in het minste niet, weten ook niet van schaamrood te maken; daarom zullen zij vallen onder de vallende, ten tijde als Ik hen bezoeken zal, zullen zij struikelen, zegt de HEERE.", "Mark 12:19": "Meester, Mozes heeft ons geschreven: Als iemands broer sterft, en een vrouw achterlaat, en geen kinderen nalaat, dat zijn broer diens vrouw moet nemen en voor zijn broer nageslacht moet verwekken.", "Gen 19:4-14": "Eer zij zich te slapen legden, omsingelden de mannen van die stad, de mannen van Sodom, van de jongste tot de oudste toe, dat huis, het hele volk, van alle kanten. En zij riepen Lot toe, en zeiden tegen hem: Waar zijn die mannen die deze nacht bij u gekomen zijn? Breng hen naar buiten, naar ons toe, opdat wij met hen gemeenschap hebben. Toen ging Lot naar buiten naar hen toe, bij de deur, en hij sloot de deur achter zich toe;", "Rom 3:8": "En zeggen wij niet liever (zoals wij belasterd worden, en zoals sommigen zeggen dat wij zeggen): Laat ons het kwade doen, opdat het goede daaruit komt? Hun veroordeling is rechtvaardig.", "Mark 3:29": "Maar wie zal lasteren tegen de Heilige Geest, die heeft geen vergeving in eeuwigheid, maar is schuldig aan een eeuwig oordeel.", "Ex 2:20": "En hij zei tegen zijn dochters: Waar is hij dan? Waarom hebt u de man daar gelaten? Roep hem, dat hij brood eet.", "Spr 13:22": "De goede zal zijn kindskinderen doen erven; maar het vermogen van de zondaar is voor de rechtvaardige weggelegd.", "2 Kon 19:35": "Het gebeurde toen in diezelfde nacht, dat de Engel van de HEERE uittrok en in het leger van Assyrië honderdvijfentachtigduizend man sloeg. En toen zij zich 's morgens vroeg opmaakten, zie, dat waren allemaal dode lichamen.", "Ps 78:4-72": "Wij zullen het niet verbergen voor hun kinderen, maar het navolgende geslacht vertellen de loffelijke daden van de HEERE, en Zijn sterkheid, en Zijn wonderen, die Hij gedaan heeft. Want Hij heeft een getuigenis opgericht in Jakob, en een wet gesteld in Israël, die Hij onze vaders geboden heeft, dat zij die aan hun kinderen bekend zouden maken; Opdat het navolgende geslacht ze zou weten, de kinderen die geboren zouden worden; en zouden opstaan en ze vertellen aan hun kinderen;", "Rom 10:12": "Want er is geen onderscheid tussen Jood en Griek; want eenzelfde Heere is Heere van allen, rijk over allen die Hem aanroepen.", "Ef 2:4-7": "Maar God, Die rijk is in barmhartigheid door Zijn grote liefde, waarmee Hij ons liefgehad heeft, heeft ons, ook toen wij dood waren door de misdaden, levend gemaakt met Christus; (uit genade bent u zalig geworden), en heeft ons mede opgewekt, en heeft ons mede gezet in de hemel in Christus Jezus;", "Zach 3:9": "Want zie, aangaande die steen, die Ik gelegd heb voor het aangezicht van Jozua, op die ene steen zullen zeven ogen zijn; zie, Ik zal zijn graveersel graveren, spreekt de HEERE van de heerscharen, en Ik zal de ongerechtigheid van dit land op één dag wegnemen.", "Jer 7:16": "U dan, bid niet voor dit volk, en hef geen geschrei of gebed voor hen op, en dring niet bij Mij aan; want Ik zal u niet horen.", "Deut 28:15-68": "Daarentegen zal het gebeuren, als u niet naar de stem van de HEERE, uw God, luistert, om op te letten dat u al Zijn geboden en Zijn inzettingen doet, die ik u heden gebied; zo zullen al deze vloeken over u komen, en u treffen. Vervloekt zult u zijn in de stad, en vervloekt zult u zijn op het veld. Vervloekt zal zijn uw korf, en uw baktrog.", "Ex 5:23": "Want vanaf het moment dat ik bij Farao ben gekomen, om in Uw Naam te spreken, heeft hij dit volk kwaad gedaan; en U hebt Uw volk geenszins verlost.", "Jes 55:3": "Neig uw oor, en kom tot Mij, hoor en uw ziel zal leven; want Ik zal met u een eeuwig verbond maken, en u geven de zekere weldaden van David.", "Jer 36:7": "Misschien zal hun smeking voor het aangezicht van de HEERE neervallen, en zullen zij zich bekeren, ieder van zijn boze weg; want groot is de toorn en de grimmigheid die de HEERE tegen dit volk heeft uitgesproken.", "Hebr 12:15-17": "Let er goed op dat niemand verachtert van de genade van God; dat niet enige wortel van bitterheid, die opwaarts uitspruit, opschudding maakt en daardoor velen ontreinigd worden. Dat niemand een hoereerder is, of een onheilige, zoals Ezau, die om één voedsel zijn eerstgeboorterecht wegdeed. Want u weet dat hij ook daarna, toen hij de zegening wilde erven, verworpen werd; want hij vond geen gelegenheid tot berouw, hoewel hij het met tranen zocht.", "Neh 13:14": "Denk aan mij, mijn God, in dit opzicht; en delg mijn weldaden niet uit, die ik aan het huis van mijn God en aan Zijn wachten gedaan heb.", "Micha 6:16": "Want de inzettingen van Omri worden onderhouden, en al het werk van het huis van Achab; en u wandelt in hun raadslagen; opdat Ik u stel tot verwoesting, en haar inwoners tot aanfluiting; zo zult u de smaad van Mijn volk dragen.", "Spr 3:33": "De vloek van de HEERE is in het huis van de goddeloze; maar de woning van de rechtvaardigen zal Hij zegenen.", "Matt 17:14-21": "En toen zij bij de menigte gekomen waren, kwam er iemand naar Hem toe, die voor Hem op de knieën viel en zei: Heere, ontferm U over mijn zoon, want hij is maanziek en lijdt zwaar; want vaak valt hij in het vuur, en vaak in het water. En ik heb hem naar Uw discipelen gebracht, maar zij hebben hem niet kunnen genezen.", "1 Sam 16:2": "Maar Samuël zei: Hoe zou ik kunnen gaan? Saul zal het horen en mij doden. Toen zei de HEERE: Neem een kalf van de runderen met u mee, en zeg: Ik ben gekomen om de HEERE een offer te brengen.", "Ps 85:3": "De misdaad van Uw volk hebt U weggenomen; U hebt al hun zonden bedekt. Sela.", "Gen 16:2": "En Sarai zei tegen Abram: Zie toch, de HEERE heeft mij belet kinderen te krijgen; ga toch naar mijn dienstmaagd, misschien zal ik uit haar gebouwd worden. En Abram luisterde naar de stem van Sarai.", "2 Kron 24:19": "Toch zond Hij profeten onder hen, om hen tot de HEERE te doen terugkeren; die waarschuwden hen, maar zij luisterden niet.", "Matt 11:23": "En u, Kapernaüm! Die tot de hemel toe verhoogd bent, u zult tot de hel toe neergestoten worden. Want als in Sodom die krachten gebeurd waren die in u gebeurd zijn, zouden zij tot op deze huidige dag gebleven zijn.", "Ps 119:175": "Laat mijn ziel leven, en zij zal U loven, en laat Uw rechten mij helpen.", "2 Petr 2:6": "en de steden Sodom en Gomorra tot as heeft laten verbranden en met een omkering veroordeeld heeft, en tot een voorbeeld gesteld heeft voor hen die goddeloos zouden leven;", "Fil 3:14": "Maar één ding doe ik: ik vergeet wat achter is, en strek mij uit naar wat voor is, en jaag naar het doel, naar de prijs van de roeping van God van boven in Christus Jezus.", "Deut 5:29": "Och, dat zij zo'n hart hadden om Mij te vrezen, en al Mijn geboden alle dagen te onderhouden, opdat het hun en hun kinderen goed gaat in eeuwigheid!", "Ezech 20:17": "Doch Mijn oog spaarde hen, zodat Ik hen niet verdierf, en geen einde met hen maakte in de woestijn.", "Ex 31:17": "Hij zal tussen Mij en tussen de kinderen van Israël een teken in eeuwigheid zijn; omdat de HEERE, in zes dagen, de hemel en de aarde gemaakt heeft, en op de zevende dag gerust heeft en Zich verkwikt heeft.", "Ezech 16:48": "Zo waar Ik leef, spreekt de Heere HEERE, Sodom, uw zuster, heeft niet gedaan, zij en haar dochters niet, zoals u gedaan hebt, u en uw dochters!", "Spr 22:24": "Ga geen vriendschap aan met een driftig man, en ga niet om met een zeer grimmig man;", "2 Kon 13:18": "Daarna zei hij: Neem de pijlen. En hij nam ze. Toen zei hij tegen de koning van Israël: Sla tegen de aarde. En hij sloeg driemaal; daarna stond hij stil.", "Ps 105:8": "Hij gedenkt Zijn verbond tot in eeuwigheid, het woord dat Hij ingesteld heeft, tot in duizend geslachten;", "Jer 49:18": "Zoals de omkering van Sodom en Gomorra en haar buren, zal het zijn, zegt de HEERE; niemand zal daar wonen, en geen mensenkind daarin verblijven.", "2 Kor 5:14": "Want de liefde van Christus dringt ons;", "Job 33:14-30": "Maar God spreekt eens of tweemaal; doch men let daar niet op. In de droom, door het gezicht 's nachts, als een diepe slaap op de mensen valt, in de sluimering op het leger; Dan openbaart Hij het voor het oor der mensen, en Hij verzegelt hun kastijding;", "Ps 85:4": "U hebt al Uw verbolgenheid weggenomen; U hebt U afgewend van de gloed van Uw toorn.", "Ps 68:18": "Gods wagens zijn tweemaal tienduizend, de duizenden verdubbeld. De Heere is onder hen, een Sinaï in heiligheid!", "Luk 1:77": "om Zijn volk kennis van het heil te geven, in vergeving van hun zonden,", "Jes 13:19": "Zo zal Babel, het sieraad van de koninkrijken, de heerlijkheid, de hovaardigheid van de Chaldeeën, zijn zoals toen God Sodom en Gomorra omgekeerd heeft.", "Spr 29:24": "Wie met een dief deelt, haat zijn eigen leven; hij hoort een vervloeking, en geeft het niet te kennen.", "2 Tim 3:5": "met een schijn van godzaligheid, maar de kracht daarvan verloochenend. Heb ook een afkeer van hen.", "2 Kron 19:2": "En Jehu, de zoon van Hanani, de ziener, ging naar buiten, hem tegemoet, en zei tegen koning Josafat: Zou u de goddeloze helpen, en hen liefhebben die de HEERE haten? Daarom is er nu van het aangezicht van de HEERE grote toorn over u.", "2 Kor 12:9": "En Hij heeft tegen mij gezegd: Mijn genade is u genoeg; want Mijn kracht wordt in zwakheid volbracht. Zo zal ik dan veel liever roemen in mijn zwakheden, opdat de kracht van Christus in mij woont.", "Jer 30:11": "Want Ik ben met u, spreekt de HEERE, om u te verlossen; want Ik zal een voleinding maken met al de heidenen, waarheen Ik u verstrooid heb; maar met u zal Ik geen voleinding maken; maar Ik zal u kastijden met mate, en u niet helemaal ongestraft laten.", "Job 11:6": "En u bekend maakte de verborgenheden van de wijsheid, omdat zij dubbel zijn in wezen! Weet daarom, dat God voor u minder rekent van uw ongerechtigheid dan die verdient.", "Ps 139:21": "Zou ik niet haten, HEERE, wie U haten? En verdriet hebben over wie tegen U opstaan?", "Lev 26:44": "En hierboven is dit ook: als zij in het land van hun vijanden zullen zijn, zal Ik hen niet verwerpen, en ook niet van hen walgen, om een einde aan hen te maken en Mijn verbond met hen te vernietigen; want Ik ben de HEERE, hun God!", "Num 16:26": "En hij sprak tot de vergadering en zei: Ga toch weg van de tenten van deze goddeloze mannen, en raak niets aan van wat van hen is, anders wordt u misschien meegesleurd in al hun zonden.", "Gen 19:24-28": "Toen liet de HEERE zwavel en vuur over Sodom en Gomorra regenen, van de HEERE uit de hemel. En Hij keerde deze steden om, en die hele vlakte, en alle inwoners van deze steden, ook het gewas van het land. En zijn vrouw keek achter hem om; en zij werd een zoutpilaar.", "Ex 12:15": "Zeven dagen moet u ongezuurde broden eten; maar op de eerste dag moet u het zuurdeeg wegdoen uit uw huizen; want wie het gedesemde eet, van de eerste dag af tot de zevende dag, die ziel zal uitgeroeid worden uit Israël.", "2 Kor 4:15": "Want al deze dingen zijn om uw wil, opdat de vermenigvuldigde genade, door de dankzegging van velen, overvloedig wordt tot heerlijkheid van God.", "Openb 9:15": "En de vier engelen zijn losgemaakt, die gereed waren gehouden tegen het uur, en dag, en maand, en jaar, opdat zij het derde deel van de mensen zouden doden.", "Ex 20:2": "Ik ben de HEERE, uw God, Die u uit Egypteland, uit het diensthuis, uitgeleid heb.", "Ps 89:3": "Want ik heb gezegd: Uw goedertierenheid zal eeuwig gebouwd worden; in de hemelen zelf hebt Gij Uw waarheid bevestigd, en gezegd:", "Luk 17:28": "Evenzo ook, zoals het gebeurde in de dagen van Lot: zij aten, zij dronken, zij kochten, zij verkochten, zij plantten, zij bouwden;", "Spr 22:10": "Jaag de spotter weg, en het gekijf zal weggaan, en het geschil met de schande zal ophouden.", "Ps 86:15": "Maar Gij, Heere! zijt een barmhartig en genadig God, geduldig, en groot van goedertierenheid en waarheid.", "Luk 6:35": "Maar heb uw vijanden lief, en doe goed, en leen, zonder iets terug te hopen; en uw loon zal groot zijn, en u zult kinderen van de Allerhoogste zijn; want Hij is goedertieren over de ondankbaren en de bozen.", "Ex 5:22": "Toen keerde Mozes weer terug tot de HEERE, en zei: Heere! Waarom hebt U dit volk kwaad gedaan, waarom hebt U mij nu gezonden?", "Ps 106:1": "Halleluja! Loof de HEERE, want Hij is goed, want Zijn goedertierenheid is voor eeuwig.", "Ps 40:2-18": "Ik heb de HEERE lang verwacht; en Hij heeft Zich tot mij geneigd, en mijn geroep gehoord. En Hij heeft mij uit een ruisende kuil, uit modderig slijk opgehaald, en heeft mijn voeten op een rotssteen gesteld, Hij heeft mijn gangen vastgemaakt. En Hij heeft een nieuw lied in mijn mond gegeven, een lofzang voor onze God; velen zullen het zien, en vrezen, en op de HEERE vertrouwen.", "Ex 34:12-15": "Wacht u ervoor dat u toch geen verbond maakt met de inwoner van het land, waarin u komen zult; dat hij misschien niet tot een valstrik wordt in uw midden. Maar hun altaren zult u omverwerpen, en hun opgerichte beelden zult u verbreken, en hun gewijde palen zult u afhouwen. (Want u zult zich niet buigen voor een andere god; want de Naam van de HEERE is IJveraar! Een ijverig God is Hij!)", "Ps 33:6": "Door het Woord van de HEERE zijn de hemelen gemaakt, en door de Geest van Zijn mond heel hun leger.", "Dan 4:13": "Ik zag verder in de visioenen van mijn hoofd, op mijn bed; en zie, een wachter, namelijk een heilige, kwam neer uit de hemel,", "Gen 18:4": "Laat er toch een beetje water gebracht worden, en was Uw voeten, en rust onder deze boom.", "Gen 38:8": "Toen zei Juda tegen Onan: Ga naar de vrouw van uw broer, en trouw met haar volgens het zwagerrecht, en verwek voor uw broer nageslacht.", "Jes 6:9": "Toen zei Hij: Ga heen, en zeg tegen dit volk: Blijf horen, maar begrijp het niet, en blijf zien, maar merk het niet op.", "Gen 13:13": "En de mannen van Sodom waren slecht, en grote zondaars tegen de HEERE.", "Openb 18:4": "En ik hoorde een andere stem uit de hemel, die zei: Ga uit haar weg, Mijn volk, opdat u geen deel hebt aan haar zonden, en opdat u niet ontvangt van haar plagen.", "Pred 10:13": "Het begin van de woorden van zijn mond is dwaasheid, en het einde van zijn mond is boze dolheid.", "Luk 14:23": "En de heer zei tegen de dienstknecht: Ga de wegen en heggen langs, en dwing hen binnen te komen, zodat mijn huis vol wordt.", "Ps 81:12": "Maar Mijn volk heeft Mijn stem niet gehoord; en Israël heeft Mij niet gewild.", "Gen 19:1-17": "En die twee engelen kwamen 's avonds in Sodom aan; en Lot zat in de poort van Sodom; en toen Lot hen zag, stond hij op om hun tegemoet te gaan, en boog zich met het gezicht ter aarde. En hij zei: Zie toch, mijn heren! Keert u toch af naar het huis van uw knecht, en overnacht daar, en wast uw voeten; dan kunt u vroeg opstaan en verder gaan op uw weg. En zij zeiden: Nee, maar wij zullen op straat overnachten. En hij hield sterk bij hen aan, zodat zij bij hem introkken, en in zijn huis kwamen; en hij maakte hun een maaltijd, en bakte ongezuurde koeken, en zij aten.", "Lev 18:22": "Bij een man zult u niet liggen zoals bij een vrouw; dit is een gruwel.", "1 Petr 1:3": "Geloofd zij de God en Vader van onze Heere Jezus Christus, Die naar Zijn grote barmhartigheid ons opnieuw geboren heeft doen worden tot een levende hoop, door de opstanding van Jezus Christus uit de doden.", "Num 16:45": "Maak u op uit het midden van deze vergadering, en Ik zal hen verteren, in een ogenblik! Toen vielen zij op hun aangezichten.", "Neh 13:1-3": "Op die dag werd er gelezen in het boek van Mozes, voor de oren van het volk; en daarin werd geschreven gevonden, dat de Ammonieten en Moabieten niet zouden komen in de gemeente van God, tot in eeuwigheid; Omdat zij de kinderen van Israël niet tegemoet waren gekomen met brood en met water, ja, Bileam tegen hen gehuurd hadden om hen te vloeken, hoewel onze God de vloek omkeerde in een zegen. Zo gebeurde het, toen zij deze wet hoorden, dat zij alle vermenging van Israël afscheidden.", "1 Joh 1:9": "Als wij onze zonden belijden: Hij is getrouw en rechtvaardig, om ons de zonden te vergeven, en ons te reinigen van alle ongerechtigheid.", "Joh 17:12": "Toen Ik met hen in de wereld was, bewaarde Ik hen in Uw Naam. Hen die U Mij gegeven hebt, heb Ik bewaard, en niemand van hen is verloren gegaan, dan de zoon van het verderf, opdat de Schrift vervuld wordt.", "Zef 2:7": "En dat gebied zal zijn voor het overblijfsel van het huis van Juda, zodat zij daarin weiden; 's avonds zullen zij in de huizen van Askelon liggen, want de HEERE, hun God, zal hen bezoeken, en Hij zal hun gevangenschap wenden.", "Ezech 16:63": "opdat u eraan denkt, en zich schaamt, en niet meer uw mond opendoet vanwege uw schande, wanneer Ik verzoening voor u zal doen over alles wat u gedaan hebt, spreekt de Heere HEERE.", "Rom 9:22": "En wat nu, als God, terwijl Hij Zijn toorn wilde bewijzen en Zijn macht bekend wilde maken, met veel geduld de vaten van de toorn verdragen heeft, die klaargemaakt zijn tot verderf;", "2 Kron 21:7": "Doch de HEERE wilde het huis van David niet te gronde richten, omwille van het verbond dat Hij met David gesloten had; en zoals Hij gezegd had hem en zijn zonen voor altijd een lamp te zullen geven.", "Num 21:29": "Wee u, Moab! U, volk van Kamoz, bent verloren! Hij heeft zijn zonen, die ontkwamen, en zijn dochters in de gevangenschap geleverd aan Sihon, de koning van de Amorieten.", "Spr 2:11": "Zo zal de bedachtzaamheid over u de wacht houden, de verstandigheid zal u behoeden;", "Jes 22:12-14": "En op die dag zal de Heere, de HEERE van de heerscharen, roepen tot geween, en tot rouwklacht, en tot kaalheid, en tot omgording met de zak. Maar zie, er is vreugde en blijdschap met runderen te doden, en schapen te slachten, vlees te eten, en wijn te drinken, en te zeggen: Laten we eten en drinken, want morgen zullen we sterven. Maar de HEERE van de heerscharen heeft Zich aan mijn oren geopenbaard, en zei: Zeker zal deze ongerechtigheid u niet verzoend worden, totdat u sterft! zegt de Heere, de HEERE van de heerscharen.", "Ps 120:5-7": "O, wee mij, dat ik een vreemdeling ben in Mesech, dat ik in de tenten van Kedar woont. Mijn ziel heeft lang gewoond bij hen die de vrede haten. Ik ben vreedzaam; maar als ik spreek, zijn zij uit op oorlog.", "Neh 1:10": "Zij zijn toch Uw dienaren en Uw volk, dat U verlost hebt door Uw grote kracht en door Uw sterke hand.", "Matt 13:41": "De Zoon des mensen zal Zijn engelen uitzenden, en zij zullen uit Zijn Koninkrijk verzamelen alles wat tot zonde verleidt, en degenen die de ongerechtigheid doen;", "Job 23:2-6": "Ook vandaag is mijn klacht bitter; mijn plaag is zwaarder dan mijn zuchten. Och, of ik wist waar ik Hem vinden zou, ik zou tot Zijn troon komen; Ik zou het recht voor Zijn aangezicht ordentelijk voorstellen, en mijn mond zou ik met verdedigingen vullen.", "Jes 3:11": "Wee de goddeloze, het zal hem kwalijk gaan, want de vergelding van zijn handen zal hem overkomen.", "Mark 9:14-29": "En toen Hij bij de discipelen kwam, zag Hij een grote menigte om hen heen, en enige Schriftgeleerden die met hen aan het twisten waren. En meteen, toen de hele menigte Hem zag, was zij zeer verbaasd, en zij liepen naar Hem toe en groetten Hem. En Hij vroeg de Schriftgeleerden: Waarover twist u met hen?", "Zach 1:16": "Daarom zegt de HEERE zo: Ik ben tot Jeruzalem teruggekeerd met ontfermingen; Mijn huis zal daarin gebouwd worden, spreekt de HEERE van de heerscharen, en het meetlint zal over Jeruzalem uitgespannen worden.", "Pred 9:18": "De wijsheid is beter dan oorlogswapens, maar één zondaar verderft veel goeds.", "Deut 31:18": "Ik dan zal Mijn aangezicht op die dag geheel en al verbergen, om al het kwaad dat het gedaan heeft; want het heeft zich gewend tot andere goden.", "Spr 13:20": "Die met de wijzen omgaat, zal wijs worden; maar die de metgezel van de dwazen is, zal verbroken worden.", "Luk 6:36": "Wees dan barmhartig, zoals ook uw Vader barmhartig is.", "Jer 8:12": "Zijn zij beschaamd, omdat zij gruwel bedreven hebben? Nee, zij schamen zich in het geheel niet, en weten niet hoe ze schaamrood moeten worden; daarom zullen zij vallen onder de vallende; ten tijde van hun bezoeking zullen zij struikelen, zegt de HEERE.", "2 Kon 14:26": "Want de HEERE zag dat de ellende van Israël zeer bitter was, en dat er niemand was die opgesloten of achtergelaten was, en dat Israël geen helper had.", "Ex 16:2": "En de hele gemeenschap van de Israëlieten morde tegen Mozes en tegen Aäron, in de woestijn.", "2 Kor 13:5-7": "Onderzoek uzelf, of u in het geloof bent, beproef uzelf. Of weet u zelf niet, dat Jezus Christus in u is? Tenzij u op de een of andere manier verwerpelijk bent. Maar ik hoop dat u zult begrijpen, dat wij niet verwerpelijk zijn. En ik verlang van God, dat u geen kwaad doet; niet opdat wij beproefd bevonden zouden worden, maar opdat u het goede zou doen, ook al zouden wij als verwerpelijk zijn.", "Jer 46:28": "U dan, Mijn knecht Jakob! Vrees niet, spreekt de HEERE; want Ik ben met u; want Ik zal een voleinding maken met al de heidenen, waarheen Ik u gedreven zal hebben, doch met u zal Ik geen voleinding maken, maar u kastijden met mate, en u niet geheel onschuldig houden.", "Ex 32:10": "En nu, laat Mij begaan, dat Mijn toorn tegen hen ontsteekt en hen verteert; dan zal Ik u tot een groot volk maken.", "Ezech 36:25": "Dan zal Ik rein water op u sprenkelen, en u zult rein worden; van al uw onreinheden en van al uw drekgoden zal Ik u reinigen.", "Ps 57:2": "Wees mij genadig, o God! Wees mij genadig, want mijn ziel vertrouwt op U, en ik neem mijn toevlucht onder de schaduw van Uw vleugels, totdat de verdervingen voorbij zijn gegaan.", "Gen 19:17-22": "En het gebeurde, toen zij hen naar buiten gebracht hadden, dat Hij zei: Red u, om uw leven; kijk niet achter u om, en blijf nergens staan op deze hele vlakte; vlucht naar het gebergte, opdat u niet omkomt. En Lot zei tegen hen: Nee toch, Heere! Zie toch, Uw knecht heeft genade gevonden in Uw ogen, en U hebt Uw goedheid groot gemaakt die U aan mij bewezen hebt, door mijn leven te sparen; maar ik zal niet naar het gebergte kunnen vluchten, want misschien overkomt mij dat kwaad, en moet ik sterven!", "Hos 5:6": "Met hun schapen en met hun runderen zullen zij dan gaan om de Heere te zoeken, maar niet vinden; Hij heeft Zich van hen teruggetrokken.", "1 Kon 11:34": "Toch zal Ik niets van dit koninkrijk uit zijn hand nemen; maar Ik stel hem tot vorst al de dagen van zijn leven, omwille van Mijn dienaar David, die Ik verkozen heb, die Mijn geboden en Mijn inzettingen gehouden heeft.", "Gen 18:1-5": "Daarna verscheen de HEERE hem bij de eikenbossen van Mamre, toen hij in de deur van de tent zat, op het heetst van de dag. En hij hief zijn ogen op en keek; en zie, daar stonden drie mannen tegenover hem; toen hij hen zag, liep hij hun tegemoet vanuit de deur van de tent, en boog zich tot op de grond. En hij zei: Heere! Als ik nu genade gevonden heb in Uw ogen, ga toch niet aan Uw knecht voorbij.", "Gen 17:7": "En Ik zal Mijn verbond oprichten tussen Mij en u, en uw nageslacht na u, in hun geslachten, tot een eeuwig verbond, om u en uw nageslacht na u tot een God te zijn.", "Richt 3:9": "Toen riepen de kinderen van Israël tot de HEERE; en de HEERE verwekte de kinderen van Israël een verlosser, die hen verloste, Othniël, zoon van Kenaz, broer van Kaleb, die jonger was dan hij.", "Gen 12:12": "En het zal gebeuren, wanneer de Egyptenaren u zien, dat zij zullen zeggen: Dat is zijn vrouw; en zij zullen mij doden, en u in leven laten.", "Ezech 20:49": "En ik zei: Ach, Heere HEERE, zij zeggen van mij: Spreekt hij niet in gelijkenissen?", "2 Tess 3:6": "En wij bevelen u, broeders, in de Naam van onze Heere Jezus Christus, dat u zich onttrekt van iedere broeder die ongeregeld wandelt, en niet naar de overlevering die hij van ons ontvangen heeft.", "Ps 103:17": "Maar de goedertierenheid van de HEERE is van eeuwigheid tot eeuwigheid over hen die Hem vrezen, en Zijn gerechtigheid over kindskinderen;", "Ex 30:19": "Zodat Aäron en zijn zonen zich daarmee kunnen wassen, hun handen en voeten.", "Tit 1:2": "In de hoop van het eeuwige leven, dat God, Die niet liegen kan, beloofd heeft vóór de tijden der eeuwen, maar geopenbaard heeft op Zijn tijd;", "Richt 19:20": "Toen zei de oude man: Vrede zij u! Al wat u ontbreekt, is toch voor mijn rekening; alleen overnacht niet op het plein.", "Ex 34:7": "Die de goedertierenheid bewaart aan vele duizenden, Die de ongerechtigheid, en overtreding, en zonde vergeeft; Die de schuldige geenszins onschuldig houdt, en de ongerechtigheid van de vaders bezoekt aan de kinderen, en aan de kindskinderen, tot in het derde en vierde geslacht.", "1 Kon 14:24": "Er waren ook schandjongens in het land; zij deden naar al de gruwelen van de heidenvolken, die de HEERE van voor het aangezicht van de kinderen van Israël uit hun bezit verdreven had.", "Deut 34:3": "En het zuiden, en het vlakke veld van de vallei van Jericho, de palmstad, tot Zoar toe.", "Matt 13:42": "En zij zullen hen in de vurige oven werpen; daar zal geween zijn en het geknars van de tanden.", "Ps 26:9": "Raap mijn ziel niet weg met de zondaars, en mijn leven niet met de mannen van het bloed;", "1 Kon 22:47": "Ook verwijderde hij uit het land de overige schandjongens, die in de dagen van zijn vader Asa overgebleven waren.", "Jes 65:5": "Die daar zeggen: Houd u tot uzelf, en kom niet bij mij, want ik ben heiliger dan u. Deze zijn een rook in Mijn neus, een vuur, dat de hele dag brandt.", "Jer 2:25": "Bedwing uw voet van ontschoeiing, en uw keel van dorst; maar u zegt: Het is buiten hoop; nee, want ik heb de vreemden lief, en die zal ik nawandelen!", "2 Joh 1:1": "De oudste aan de uitverkoren vrouw en aan haar kinderen, die ik in waarheid liefheb, en niet alleen ik, maar ook allen die de waarheid gekend hebben;", "Ps 103:18": "Over hen die Zijn verbond houden, en die aan Zijn bevelen denken, om die te doen.", "Ps 117:2": "Want Zijn goedertierenheid is machtig over ons, en de waarheid van de HEERE is er voor eeuwig! Halleluja!", "Nahum 1:3": "De HEERE is geduldig, maar van grote kracht, en Hij houdt de schuldige zeker niet onschuldig. De weg van de HEERE is in wervelwind en in storm, en de wolken zijn het stof van Zijn voeten.", "Ezech 14:16": "Al waren die drie mannen in het midden daarvan, zo waarachtig als Ik leef, spreekt de Heere HEERE, zij zouden zonen noch dochters bevrijden, zij zelf alleen zouden bevrijd worden, maar het land zou woest worden.", "Ezech 14:22": "Doch zie, daarin zullen mensen die ontkomen zijn overblijven, die uitgevoerd zullen worden, zonen en dochters; zie, zij zullen tot u uitkomen, en u zult hun weg zien en hun handelingen; en u zult vertroost worden over het kwaad dat Ik over Jeruzalem gebracht zal hebben, ja, al wat Ik over haar zal hebben gebracht.", "Rom 11:8": "(Zoals geschreven is: God heeft hun een geest van diepe slaap gegeven; ogen om niet te zien, en oren om niet te horen) tot op deze huidige dag.", "Jer 32:24": "Zie de wallen! Zij zijn tot aan de stad gekomen om die in te nemen, en de stad is gegeven in de hand van de Chaldeeën, die tegen haar strijden; vanwege het zwaard en de honger en de pest; en wat U gesproken hebt, is gebeurd, en zie, U ziet het.", "Spr 1:21": "Zij roept op de belangrijkste plaats van de samenscholingen; aan de deuren van de poorten spreekt Zij Haar woorden in de stad;", "Jes 11:14": "Maar zij zullen op de schouder van de Filistijnen vliegen naar het westen, en zij zullen samen die van het oosten beroven; aan Edom en Moab zullen zij hun handen slaan, en de kinderen van Ammon zullen hun gehoorzaam zijn.", "2 Sam 12:13": "Toen zei David tegen Nathan: Ik heb gezondigd tegen de HEERE! En Nathan zei tegen David: De HEERE heeft ook uw zonde weggenomen, u zult niet sterven.", "Jer 36:3": "Misschien zullen die van het huis van Juda al het kwaad horen dat Ik hun van plan ben te doen, zodat zij zich bekeren, ieder van zijn boze weg, en Ik hun ongerechtigheid en hun zonde vergeef.", "2 Kron 7:3": "En toen alle kinderen van Israël dat vuur zagen neerdalen, en de heerlijkheid van de HEERE over het huis, bogen zij met hun gezichten ter aarde op de vloer, en aanbaden en loofden de HEERE, dat Hij goed is, dat Zijn goedertierenheid tot in eeuwigheid is.", "Joh 12:2": "Zij bereidden Hem daar dan een avondmaal, en Martha diende; en Lazarus was een van hen die met Hem aanzaten.", "1 Kron 21:16": "Toen David zijn ogen ophief, zag hij de engel van de HEERE, staande tussen de aarde en de hemel, met zijn getrokken zwaard in zijn hand, uitgestrekt over Jeruzalem; toen viel David, en de oudsten, bedekt met zakken, op hun aangezicht.", "Matt 11:3": "En zei tegen Hem: Bent U Degene, Die komen zou, of verwachten wij een ander?", "Jer 5:1-6": "Ga rond door de wijken van Jeruzalem, en kijk nu goed, en onderzoek, en zoek op haar straten, of u iemand vindt, of er iemand is die recht doet, die waarheid zoekt; dan zal Ik haar genadig zijn. En al zeggen zij: Zo waarachtig als de HEERE leeft! toch zweren zij vals. HEERE, zien Uw ogen niet naar waarheid? U hebt hen geslagen, maar zij hebben geen pijn gevoeld; U hebt hen verteerd, maar zij hebben geweigerd de tucht aan te nemen; zij hebben hun gezicht harder gemaakt dan een steenrots, zij hebben geweigerd zich te bekeren.", "1 Sam 15:35": "En Samuël zag Saul niet meer tot de dag van zijn dood toe; toch droeg Samuël leed om Saul; en het berouwde de HEERE, dat Hij Saul tot koning over Israël gemaakt had.", "Spr 1:10": "Mijn zoon! als de zondaars u aanlokken, stem er niet mee in;", "Spr 29:1": "Een man die, vaak bestraft, zijn nek verhardt, zal plotseling verbroken worden, zodat er geen genezing meer mogelijk is.", "Ps 83:5-9": "Zij hebben gezegd: Kom, laten we hen uitroeien, zodat zij geen volk meer zijn, en aan de naam van Israël niet meer gedacht wordt. Want zij hebben in hun hart samen een plan beraamd; tegen U hebben zij een verbond gesloten; de tenten van Edom en de Ismaëlieten, Moab en de Hagarenen;", "Hebr 8:12": "Want Ik zal hun ongerechtigheden genadig zijn, en aan hun zonden en hun overtredingen zal Ik geenszins meer denken.", "2 Kor 6:15": "En welke overeenstemming heeft Christus met Belial, of welk deel heeft de gelovige met de ongelovige?", "Ps 103:8-10": "Barmhartig en genadig is de HEERE, geduldig en groot van goedertierenheid. Hij zal niet altijd twisten, en ook niet eeuwig de toorn behouden. Hij doet ons niet naar onze zonden, en vergeldt ons niet naar onze ongerechtigheden.", "2 Kon 3:1-27": "Joram, de zoon van Achab, werd koning over Israël in Samaria, in het achttiende jaar van Josafat, de koning van Juda, en hij regeerde twaalf jaar. En hij deed wat kwaad was in de ogen van de HEERE, doch niet zoals zijn vader en zoals zijn moeder; want hij deed het opgerichte beeld van Baäl weg, dat zijn vader gemaakt had. Toch hield hij vast aan de zonden van Jerobeam, de zoon van Nebat, die Israël deed zondigen; hij week daarvan niet af.", "Deut 25:5": "Wanneer broeders samenwonen, en één van hen sterft zonder zoon, dan mag de vrouw van de gestorvene niet trouwen met een vreemde man van buiten; haar zwager zal tot haar ingaan, en haar tot vrouw nemen, en zo de plicht van een zwager aan haar vervullen.", "Rom 16:17": "En ik bid u, broeders, let op degenen die tweedracht en ergernissen veroorzaken, tegen de leer die u geleerd hebt; en blijf bij hen vandaan.", "Gen 49:4": "Snelle afloop als van water, u zult niet de voortreffelijkste zijn! Want u hebt het bed van uw vader beklommen; toen hebt u het geschonden; hij heeft mijn bed beklommen!", "Jer 5:31": "De profeten profeteren vals, en de priesters heersen door hun eigen hand; en Mijn volk heeft het graag zo; maar wat zult u aan het einde daarvan doen?", "Hand 17:32": "Toen zij nu van de opstanding van de doden hoorden, spotten sommigen daarmee; en sommigen zeiden: Wij zullen u hierover een andere keer horen.", "Spr 11:21": "Hand aan hand zal de boze niet onschuldig blijven; maar het nageslacht van de rechtvaardigen zal ontkomen.", "Gen 19:20-23": "Zie toch, deze stad is dichtbij om daarheen te vluchten, en zij is klein; laat mij toch daarheen mogen vluchten (is zij niet klein?), opdat mijn leven behouden blijft. En Hij zei tegen hem: Zie, Ik heb ook in deze zaak rekening met u gehouden, dat Ik deze stad niet zal omkeren waarvan u gesproken hebt. Haast u, vlucht daarheen; want Ik zal niets kunnen doen, totdat u daar aangekomen bent. Daarom noemde men de naam van deze stad Zoar.", "Hos 11:8": "Hoe zou Ik u overgeven, o Efraïm? U overleveren, o Israël? Hoe zou Ik u maken als Adama, u stellen als Zeboïm? Mijn hart is in Mij omgekeerd, al Mijn medelijden is samen ontstoken.", "Openb 8:4": "En de rook van het reukwerk steeg, met de gebeden van de heiligen, op uit de hand van de engel voor God.", "Fil 3:13": "Broeders, ik acht niet dat ik het zelf al gegrepen heb.", "Ps 106:35": "maar zij vermengden zich met de heidenen, en leerden daarvan de werken.", "1 Joh 5:16": "Als iemand zijn broeder een zonde ziet doen die niet tot de dood is, die zal God bidden en Hij zal hem het leven geven, aan hen namelijk die zondigen niet tot de dood. Er is een zonde tot de dood; voor die zonde zeg ik niet dat hij moet bidden.", "Richt 19:24": "Zie, mijn dochter die maagd is, en zijn bijvrouw, die zal ik nu naar buiten brengen, opdat u hen schendt, en met hen doet wat goed is in uw ogen; maar doe aan deze man zo'n dwaze zaak niet.", "Gen 43:24": "Daarna bracht de man deze mannen in het huis van Jozef, en hij gaf water; en zij wasten hun voeten; hij gaf ook aan hun ezels voer.", "Ps 36:6": "O HEERE! Uw goedertierenheid is tot in de hemelen; Uw waarheid tot de bovenste wolken toe.", "Gen 14:2": "dat zij oorlog voerden met Bera, koning van Sodom, en met Birsa, koning van Gomorra, Sinab, koning van Adama, en Semeber, koning van Zeboim, en de koning van Bela, dat is Zoar.", "Spr 23:6": "Eet niet het brood van hem die boos is van oog, en wees niet belust op zijn smakelijke gerechten;", "Ex 23:2": "U zult de menigte niet volgen tot boze zaken; en u zult niet spreken in een geschil om u naar de menigte te neigen, om het recht te buigen.", "Joz 6:22": "Jozua nu zei tegen de twee mannen, de verspieders van het land: Gaat in het huis van de vrouw, de hoer, en brengt die vrouw vandaar uit, met alles wat zij heeft, zoals u haar gezworen hebt.", "Deut 5:10": "en doe barmhartigheid aan duizenden van hen die Mij liefhebben en Mijn geboden onderhouden.", "Ps 94:9": "Zou Hij, Die het oor plant, niet horen? Zou Hij, Die het oog vormt, niet zien?", "Lev 18:3": "U zult niet doen naar de werken van het Egyptische land, waarin u gewoond hebt; en naar de werken van het land Kanaän, waarheen Ik u breng, zult u niet doen, en u zult in hun inzettingen niet wandelen.", "Gen 21:13": "Maar Ik zal ook de zoon van deze slavin tot een volk maken, omdat hij uw nageslacht is.", "Gen 11:6": "En de HEERE zei: Zie, zij zijn één volk, en hebben allen dezelfde taal; en dit is het waarmee zij beginnen te doen; maar nu zou niets van wat zij bedacht hebben te doen, hun onmogelijk zijn?", "Ef 1:6-8": "Tot prijs van de heerlijkheid van Zijn genade, waardoor Hij ons begenadigd heeft in de Geliefde; In Wie wij de verlossing hebben door Zijn bloed, namelijk de vergeving van de misdaden, naar de rijkdom van Zijn genade, Waarmee Hij overvloedig is geweest over ons in alle wijsheid en voorzichtigheid;", "Deut 9:14": "Laat Mij begaan, dat Ik hen ve  data-code=\"H3876\">Lot</span> <span class=\"wl wl-kjv\" data-code=\"H3427\">sat</span> in the <span class=\"wl wl-kjv\" data-code=\"H8179\">gate</span> of <span class=\"wl wl-kjv\" data-code=\"H5467\">Sodom:</span> and <span class=\"wl wl-kjv\" data-code=\"H3876\">Lot</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">seeing</span> them rose <span class=\"wl wl-kjv\" data-code=\"H6965\">up</span> to <span class=\"wl wl-kjv\" data-code=\"H7125\">meet</span> them; and he <span class=\"wl wl-kjv\" data-code=\"H7812\">bowed</span> himself with his <span class=\"wl wl-kjv\" data-code=\"H639\">face</span> toward the ground;", "2": "And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Behold now, my <span class=\"wl wl-kjv\" data-code=\"H113\">lords,</span> turn <span class=\"wl wl-kjv\" data-code=\"H5493\">in,</span> I pray you, into your <span class=\"wl wl-kjv\" data-code=\"H5650\">servant's</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> and tarry all <span class=\"wl wl-kjv\" data-code=\"H3885\">night,</span> and <span class=\"wl wl-kjv\" data-code=\"H7364\">wash</span> your <span class=\"wl wl-kjv\" data-code=\"H7272\">feet,</span> and ye shall rise up <span class=\"wl wl-kjv\" data-code=\"H7925\">early,</span> and <span class=\"wl wl-kjv\" data-code=\"H1980\">go</span> on your <span class=\"wl wl-kjv\" data-code=\"H1870\">ways.</span> And they <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Nay; but we will <span class=\"wl wl-kjv\" data-code=\"H3885\">abide</span> in the <span class=\"wl wl-kjv\" data-code=\"H7339\">street</span> all night.", "3": "And he <span class=\"wl wl-kjv\" data-code=\"H6484\">pressed</span> upon them <span class=\"wl wl-kjv\" data-code=\"H3966\">greatly;</span> and they turned <span class=\"wl wl-kjv\" data-code=\"H5493\">in</span> unto him, and <span class=\"wl wl-kjv\" data-code=\"H935\">entered</span> into his <span class=\"wl wl-kjv\" data-code=\"H1004\">house;</span> and he <span class=\"wl wl-kjv\" data-code=\"H6213\">made</span> them a <span class=\"wl wl-kjv\" data-code=\"H4960\">feast,</span> and did <span class=\"wl wl-kjv\" data-code=\"H644\">bake</span> unleavened <span class=\"wl wl-kjv\" data-code=\"H4682\">bread,</span> and they did eat.", "4": "But before they lay <span class=\"wl wl-kjv\" data-code=\"H7901\">down,</span> the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> of the <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> even the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H5467\">Sodom,</span> <span class=\"wl wl-kjv\" data-code=\"H5437\">compassed</span> the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> <span class=\"wl wl-kjv\" data-code=\"H5437\">round,</span> both <span class=\"wl wl-kjv\" data-code=\"H2205\">old</span> and <span class=\"wl wl-kjv\" data-code=\"H5288\">young,</span> all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> from every quarter:", "5": "And they <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> unto <span class=\"wl wl-kjv\" data-code=\"H3876\">Lot,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, Where are the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> which came <span class=\"wl wl-kjv\" data-code=\"H935\">in</span> to thee this <span class=\"wl wl-kjv\" data-code=\"H3915\">night?</span> bring them <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> unto us, that we may know", "6": "And <span class=\"wl wl-kjv\" data-code=\"H3876\">Lot</span> went <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> at the <span class=\"wl wl-kjv\" data-code=\"H6607\">door</span> unto them, and <span class=\"wl wl-kjv\" data-code=\"H5462\">shut</span> the <span class=\"wl wl-kjv\" data-code=\"H1817\">door</span> after him,", "7": "And <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> I pray you, <span class=\"wl wl-kjv\" data-code=\"H251\">brethren,</span> do not so wickedly.", "8": "Behold now, I have <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters</span> which have not <span class=\"wl wl-kjv\" data-code=\"H3045\">known</span> <span class=\"wl wl-kjv\" data-code=\"H376\">man;</span> let me, I pray you, bring them <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> unto you, and <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> ye to them as is <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> in your <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes:</span> only unto <span class=\"wl wl-kjv\" data-code=\"H411\">these</span> <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> <span class=\"wl wl-kjv\" data-code=\"H408\">nothing;</span> for therefore <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> they under the <span class=\"wl wl-kjv\" data-code=\"H6738\">shadow</span> of my roof.", "9": "And they <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H5066\">Stand</span> <span class=\"wl wl-kjv\" data-code=\"H1973\">back.</span> And they <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> again, This <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> fellow came <span class=\"wl wl-kjv\" data-code=\"H935\">in</span> to <span class=\"wl wl-kjv\" data-code=\"H1481\">sojourn,</span> and he will <span class=\"wl wl-kjv\" data-code=\"H8199\">needs</span> be a <span class=\"wl wl-kjv\" data-code=\"H8199\">judge:</span> now will we deal <span class=\"wl wl-kjv\" data-code=\"H7489\">worse</span> with thee, than with them. And they <span class=\"wl wl-kjv\" data-code=\"H6484\">pressed</span> <span class=\"wl wl-kjv\" data-code=\"H3966\">sore</span> upon the <span class=\"wl wl-kjv\" data-code=\"H376\">man,</span> even <span class=\"wl wl-kjv\" data-code=\"H3876\">Lot,</span> and came <span class=\"wl wl-kjv\" data-code=\"H5066\">near</span> to <span class=\"wl wl-kjv\" data-code=\"H7665\">break</span> the door.", "10": "But the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> put <span class=\"wl wl-kjv\" data-code=\"H7971\">forth</span> their <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">pulled</span> <span class=\"wl wl-kjv\" data-code=\"H3876\">Lot</span> into the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> to them, and <span class=\"wl wl-kjv\" data-code=\"H5462\">shut</span> to the door.", "11": "And they <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> that were at the <span class=\"wl wl-kjv\" data-code=\"H6607\">door</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> with <span class=\"wl wl-kjv\" data-code=\"H5575\">blindness,</span> both <span class=\"wl wl-kjv\" data-code=\"H6996\">small</span> and <span class=\"wl wl-kjv\" data-code=\"H1419\">great:</span> so that they <span class=\"wl wl-kjv\" data-code=\"H3811\">wearied</span> themselves to <span class=\"wl wl-kjv\" data-code=\"H4672\">find</span> the door.", "12": "And the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H3876\">Lot,</span> Hast thou <span class=\"wl wl-kjv\" data-code=\"H6311\">here</span> <span class=\"wl wl-kjv\" data-code=\"H4310\">any</span> besides? son in <span class=\"wl wl-kjv\" data-code=\"H2860\">law,</span> and thy <span class=\"wl wl-kjv\" data-code=\"H1121\">sons,</span> and thy <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters,</span> and <span class=\"wl wl-kjv\" data-code=\"H834\">whatsoever</span> thou hast in the <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> bring them <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> of this place:", "13": "For <span class=\"wl wl-kjv\" data-code=\"H587\">we</span> will <span class=\"wl wl-kjv\" data-code=\"H7843\">destroy</span> this <span class=\"wl wl-kjv\" data-code=\"H4725\">place,</span> because the cry of <span class=\"wl wl-kjv\" data-code=\"H6818\">them</span> is waxen <span class=\"wl wl-kjv\" data-code=\"H1431\">great</span> <span class=\"wl wl-kjv\" data-code=\"H854\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H6440\">face</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD;</span> and the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> us to destroy", "14": "And <span class=\"wl wl-kjv\" data-code=\"H3876\">Lot</span> went <span class=\"wl wl-kjv\" data-code=\"H3318\">out,</span> and <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> unto his sons in <span class=\"wl wl-kjv\" data-code=\"H2860\">law,</span> which <span class=\"wl wl-kjv\" data-code=\"H3947\">married</span> his <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H6965\">Up,</span> get you <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> of this <span class=\"wl wl-kjv\" data-code=\"H4725\">place;</span> for the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> will <span class=\"wl wl-kjv\" data-code=\"H7843\">destroy</span> this <span class=\"wl wl-kjv\" data-code=\"H5892\">city.</span> But he seemed as one that <span class=\"wl wl-kjv\" data-code=\"H6711\">mocked</span> <span class=\"wl wl-kjv\" data-code=\"H5869\">unto</span> his sons in law.", "15": "And <span class=\"wl wl-kjv\" data-code=\"H3644\">when</span> the <span class=\"wl wl-kjv\" data-code=\"H7837\">morning</span> <span class=\"wl wl-kjv\" data-code=\"H5927\">arose,</span> then the <span class=\"wl wl-kjv\" data-code=\"H4397\">angels</span> <span class=\"wl wl-kjv\" data-code=\"H213\">hastened</span> <span class=\"wl wl-kjv\" data-code=\"H3876\">Lot,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H6965\">Arise,</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> thy <span class=\"wl wl-kjv\" data-code=\"H802\">wife,</span> and thy <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters,</span> which are <span class=\"wl wl-kjv\" data-code=\"H4672\">here;</span> lest thou be <span class=\"wl wl-kjv\" data-code=\"H5595\">consumed</span> in the <span class=\"wl wl-kjv\" data-code=\"H5771\">iniquity</span> of the city.", "16": "And while he <span class=\"wl wl-kjv\" data-code=\"H4102\">lingered,</span> the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> laid <span class=\"wl wl-kjv\" data-code=\"H2388\">hold</span> upon his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> and upon the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of his <span class=\"wl wl-kjv\" data-code=\"H802\">wife,</span> and upon the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of his <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters;</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> being <span class=\"wl wl-kjv\" data-code=\"H2551\">merciful</span> unto him: and they brought him <span class=\"wl wl-kjv\" data-code=\"H3318\">forth,</span> and set <span class=\"wl wl-kjv\" data-code=\"H3240\">him</span> <span class=\"wl wl-kjv\" data-code=\"H2351\">without</span> the city.", "17": "And it came to pass, when they had brought them <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> <span class=\"wl wl-kjv\" data-code=\"H2351\">abroad,</span> that he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H4422\">Escape</span> <span class=\"wl wl-kjv\" data-code=\"H5921\">for</span> thy <span class=\"wl wl-kjv\" data-code=\"H5315\">life;</span> <span class=\"wl wl-kjv\" data-code=\"H5027\">look</span> not behind <span class=\"wl wl-kjv\" data-code=\"H310\">thee,</span> neither <span class=\"wl wl-kjv\" data-code=\"H5975\">stay</span> thou in all the <span class=\"wl wl-kjv\" data-code=\"H3603\">plain;</span> <span class=\"wl wl-kjv\" data-code=\"H4422\">escape</span> to the <span class=\"wl wl-kjv\" data-code=\"H2022\">mountain,</span> lest thou be consumed.", "18": "And <span class=\"wl wl-kjv\" data-code=\"H3876\">Lot</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto them, Oh, not so, my Lord:", "19": "Behold now, thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> hath <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> <span class=\"wl wl-kjv\" data-code=\"H2580\">grace</span> in thy <span class=\"wl wl-kjv\" data-code=\"H5869\">sight,</span> and thou hast <span class=\"wl wl-kjv\" data-code=\"H1431\">magnified</span> thy <span class=\"wl wl-kjv\" data-code=\"H2617\">mercy,</span> which thou hast <span class=\"wl wl-kjv\" data-code=\"H6213\">shewed</span> unto <span class=\"wl wl-kjv\" data-code=\"H5978\">me</span> in <span class=\"wl wl-kjv\" data-code=\"H2421\">saving</span> my <span class=\"wl wl-kjv\" data-code=\"H5315\">life;</span> and I <span class=\"wl wl-kjv\" data-code=\"H3201\">cannot</span> <span class=\"wl wl-kjv\" data-code=\"H4422\">escape</span> to the <span class=\"wl wl-kjv\" data-code=\"H2022\">mountain,</span> lest some <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> <span class=\"wl wl-kjv\" data-code=\"H1692\">take</span> me, and I die:", "20": "Behold now, this <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> is <span class=\"wl wl-kjv\" data-code=\"H7138\">near</span> to <span class=\"wl wl-kjv\" data-code=\"H5127\">flee</span> unto, and <span class=\"wl wl-kjv\" data-code=\"H1931\">it</span> is a little <span class=\"wl wl-kjv\" data-code=\"H4705\">one:</span> Oh, let me <span class=\"wl wl-kjv\" data-code=\"H4422\">escape</span> thither, (is it not a little <span class=\"wl wl-kjv\" data-code=\"H4705\">one?)</span> and my <span class=\"wl wl-kjv\" data-code=\"H5315\">soul</span> shall live.", "21": "And he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, <span class=\"wl wl-kjv\" data-code=\"H2009\">See,</span> I have <span class=\"wl wl-kjv\" data-code=\"H5375\">accepted</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">thee</span> concerning this <span class=\"wl wl-kjv\" data-code=\"H1697\">thing</span> also, that I will not <span class=\"wl wl-kjv\" data-code=\"H2015\">overthrow</span> this <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> for the <span class=\"wl wl-kjv\" data-code=\"H834\">which</span> thou hast spoken.", "22": "<span class=\"wl wl-kjv\" data-code=\"H4116\">Haste</span> thee, <span class=\"wl wl-kjv\" data-code=\"H4422\">escape</span> thither; for I <span class=\"wl wl-kjv\" data-code=\"H3201\">cannot</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> any <span class=\"wl wl-kjv\" data-code=\"H1697\">thing</span> till thou be <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> thither. Therefore the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> was <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> Zoar.", "23": "The <span class=\"wl wl-kjv\" data-code=\"H8121\">sun</span> was <span class=\"wl wl-kjv\" data-code=\"H3318\">risen</span> upon the <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> when <span class=\"wl wl-kjv\" data-code=\"H3876\">Lot</span> <span class=\"wl wl-kjv\" data-code=\"H935\">entered</span> into Zoar.", "24": "Then the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H4305\">rained</span> upon <span class=\"wl wl-kjv\" data-code=\"H5467\">Sodom</span> and upon <span class=\"wl wl-kjv\" data-code=\"H6017\">Gomorrah</span> <span class=\"wl wl-kjv\" data-code=\"H1614\">brimstone</span> and <span class=\"wl wl-kjv\" data-code=\"H784\">fire</span> from the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> out of heaven;", "25": "And he <span class=\"wl wl-kjv\" data-code=\"H2015\">overthrew</span> <span class=\"wl wl-kjv\" data-code=\"H411\">those</span> <span class=\"wl wl-kjv\" data-code=\"H5892\">cities,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H3603\">plain,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitants</span> of the <span class=\"wl wl-kjv\" data-code=\"H5892\">cities,</span> and that which <span class=\"wl wl-kjv\" data-code=\"H6780\">grew</span> upon the ground.", "26": "But his <span class=\"wl wl-kjv\" data-code=\"H802\">wife</span> looked <span class=\"wl wl-kjv\" data-code=\"H5027\">back</span> from behind <span class=\"wl wl-kjv\" data-code=\"H310\">him,</span> and she became a <span class=\"wl wl-kjv\" data-code=\"H5333\">pillar</span> of salt.", "27": "And <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham</span> gat up <span class=\"wl wl-kjv\" data-code=\"H7925\">early</span> in the <span class=\"wl wl-kjv\" data-code=\"H1242\">morning</span> to the <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> where he <span class=\"wl wl-kjv\" data-code=\"H5975\">stood</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the LORD:", "28": "And he <span class=\"wl wl-kjv\" data-code=\"H8259\">looked</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">toward</span> <span class=\"wl wl-kjv\" data-code=\"H5467\">Sodom</span> and <span class=\"wl wl-kjv\" data-code=\"H6017\">Gomorrah,</span> and <span class=\"wl wl-kjv\" data-code=\"H6440\">toward</span> all the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of the <span class=\"wl wl-kjv\" data-code=\"H3603\">plain,</span> and <span class=\"wl wl-kjv\" data-code=\"H7200\">beheld,</span> and, lo, the <span class=\"wl wl-kjv\" data-code=\"H7008\">smoke</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">country</span> went <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> as the <span class=\"wl wl-kjv\" data-code=\"H7008\">smoke</span> of a furnace.", "29": "And it came to pass, when <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H7843\">destroyed</span> the <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> of the <span class=\"wl wl-kjv\" data-code=\"H3603\">plain,</span> that <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H2142\">remembered</span> <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham,</span> and <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> <span class=\"wl wl-kjv\" data-code=\"H3876\">Lot</span> out of the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> of the <span class=\"wl wl-kjv\" data-code=\"H2018\">overthrow,</span> when he <span class=\"wl wl-kjv\" data-code=\"H2015\">overthrew</span> the <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> in the <span class=\"wl wl-kjv\" data-code=\"H2004\">which</span> <span class=\"wl wl-kjv\" data-code=\"H3876\">Lot</span> dwelt.", "30": "And <span class=\"wl wl-kjv\" data-code=\"H3876\">Lot</span> went <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> out of <span class=\"wl wl-kjv\" data-code=\"H6820\">Zoar,</span> and <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelt</span> in the <span class=\"wl wl-kjv\" data-code=\"H2022\">mountain,</span> and his <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters</span> with him; for he <span class=\"wl wl-kjv\" data-code=\"H3372\">feared</span> to <span class=\"wl wl-kjv\" data-code=\"H3427\">dwell</span> in <span class=\"wl wl-kjv\" data-code=\"H6820\">Zoar:</span> and he <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelt</span> in a <span class=\"wl wl-kjv\" data-code=\"H4631\">cave,</span> he and his <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> daughters.", "31": "And the <span class=\"wl wl-kjv\" data-code=\"H1067\">firstborn</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto the <span class=\"wl wl-kjv\" data-code=\"H6810\">younger,</span> Our <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> is <span class=\"wl wl-kjv\" data-code=\"H2204\">old,</span> and there is not a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> to come <span class=\"wl wl-kjv\" data-code=\"H935\">in</span> unto us after the <span class=\"wl wl-kjv\" data-code=\"H1870\">manner</span> of all the earth:", "32": "<span class=\"wl wl-kjv\" data-code=\"H3212\">Come,</span> let us <span class=\"wl wl-kjv\" data-code=\"H8248\">make</span> our <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> <span class=\"wl wl-kjv\" data-code=\"H8248\">drink</span> <span class=\"wl wl-kjv\" data-code=\"H3196\">wine,</span> and we will <span class=\"wl wl-kjv\" data-code=\"H7901\">lie</span> with him, that we may <span class=\"wl wl-kjv\" data-code=\"H2421\">preserve</span> <span class=\"wl wl-kjv\" data-code=\"H2233\">seed</span> of our father.", "33": "And they <span class=\"wl wl-kjv\" data-code=\"H8248\">made</span> their <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> <span class=\"wl wl-kjv\" data-code=\"H8248\">drink</span> <span class=\"wl wl-kjv\" data-code=\"H3196\">wine</span> that <span class=\"wl wl-kjv\" data-code=\"H3915\">night:</span> and the <span class=\"wl wl-kjv\" data-code=\"H1067\">firstborn</span> went <span class=\"wl wl-kjv\" data-code=\"H935\">in,</span> and <span class=\"wl wl-kjv\" data-code=\"H7901\">lay</span> with her <span class=\"wl wl-kjv\" data-code=\"H1\">father;</span> and he <span class=\"wl wl-kjv\" data-code=\"H3045\">perceived</span> not when she lay <span class=\"wl wl-kjv\" data-code=\"H7901\">down,</span> nor when she arose.", "34": "And it came to pass on the <span class=\"wl wl-kjv\" data-code=\"H4283\">morrow,</span> that the <span class=\"wl wl-kjv\" data-code=\"H1067\">firstborn</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto the <span class=\"wl wl-kjv\" data-code=\"H6810\">younger,</span> Behold, I <span class=\"wl wl-kjv\" data-code=\"H7901\">lay</span> <span class=\"wl wl-kjv\" data-code=\"H570\">yesternight</span> with my <span class=\"wl wl-kjv\" data-code=\"H1\">father:</span> let us make him <span class=\"wl wl-kjv\" data-code=\"H8248\">drink</span> <span class=\"wl wl-kjv\" data-code=\"H3196\">wine</span> this <span class=\"wl wl-kjv\" data-code=\"H3915\">night</span> also; and go thou <span class=\"wl wl-kjv\" data-code=\"H935\">in,</span> and <span class=\"wl wl-kjv\" data-code=\"H7901\">lie</span> with him, that we may <span class=\"wl wl-kjv\" data-code=\"H2421\">preserve</span> <span class=\"wl wl-kjv\" data-code=\"H2233\">seed</span> of our father.", "35": "And they <span class=\"wl wl-kjv\" data-code=\"H8248\">made</span> their <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> <span class=\"wl wl-kjv\" data-code=\"H8248\">drink</span> <span class=\"wl wl-kjv\" data-code=\"H3196\">wine</span> <span class=\"wl wl-kjv\" data-code=\"H1931\">that</span> <span class=\"wl wl-kjv\" data-code=\"H3915\">night</span> also: and the <span class=\"wl wl-kjv\" data-code=\"H6810\">younger</span> <span class=\"wl wl-kjv\" data-code=\"H6965\">arose,</span> and <span class=\"wl wl-kjv\" data-code=\"H7901\">lay</span> with him; and he <span class=\"wl wl-kjv\" data-code=\"H3045\">perceived</span> not when she lay <span class=\"wl wl-kjv\" data-code=\"H7901\">down,</span> nor when she arose.", "36": "Thus were <span class=\"wl wl-kjv\" data-code=\"H8147\">both</span> the <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters</span> of <span class=\"wl wl-kjv\" data-code=\"H3876\">Lot</span> with <span class=\"wl wl-kjv\" data-code=\"H2029\">child</span> by their father.", "37": " /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling', 'Matthew Henry-verklaring']],
  ['Geloofsbelijdenissen', ['1689 Baptist Confession', 'Westminster Confession']],
  ['Boeken', ['Institutie — Calvijn', 'A Body of Divinity — Watson']],
  ['Preken', ['Spurgeon']],
  ['Devotionals', ['Spurgeon']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    const heeftB = D.koppeling && D.koppeling[n];
    const heeftK = D.koppeling_kjv && D.koppeling_kjv[n];
    let h = '<div class="verg-kop">Grondwoorden</div>';
    if (!heeftB && !heeftK) {
      h += '<em>Nog geen woordkoppeling voor dit vers.</em>';
    } else {
      if (heeftB) h += `<div class="tsk-kop">SVnu</div>` +
        `<div class="gw-tekst" style="font-family:Georgia,serif;line-height:1.8">${D.koppeling[n]}</div>` +
        `<div class="gw-detail" style="margin-top:.5rem"></div>`;
      if (heeftK) h += `<div class="tsk-kop" style="margin-top:.9rem">KJV</div>` +
        `<div class="gw-tekst" style="font-family:Georgia,serif;line-height:1.8">${D.koppeling_kjv[n]}</div>` +
        `<div class="gw-detail" style="margin-top:.5rem"></div>`;
      h += '<div class="bronregel">Klik op een onderstreept woord voor de vindplaatsen.</div>';
    }
    h += '<div class="verg-kop" style="margin-top:1.4rem">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const berea = D.tsk[n], engels = D.tsk_kjv[n];
    if ((!berea || !berea.length) && (!engels || !engels.length)) return '<em>Geen verwijzingen bij dit vers.</em>';
    let h = '';
    if (berea && berea.length) {
      h += '<div class="tsk-kop">Treasury of Scripture Knowledge | SVnu</div>';
      h += berea.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r}">${r}</a>`).join('') + '</div>').join('');
    }
    if (engels && engels.length) {
      h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.tsk[n] && D.tsk[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vergelijk</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}
</script>
</body>
