<style>

  .hfdnav select { font-family:"Lora"; font-size:.85rem; border:1px solid var(--border); border-radius:999px; padding:.3rem 1.6rem .3rem .8rem; background:#fff; color:var(--accent-donker); cursor:pointer; }

  .navselect { font-family:"Lora"; font-size:.85rem; border:1px solid var(--border); border-radius:999px; padding:.3rem 1.6rem .3rem .8rem; background:#fff; color:var(--accent-donker); cursor:pointer; display:inline-flex; align-items:center; text-decoration:none; }

  /* verzen — tabsmodus (één kolom) */
  .vers { position: relative; display: flex; gap: .8rem; padding: .45rem 2.4rem .45rem .4rem; border-radius: 8px; cursor: pointer; }
  .vers:hover { background: var(--bg-soft); }
  .vers.open { background: var(--bg-soft); box-shadow: inset 3px 0 0 var(--accent); border-radius: 8px 8px 0 0; }
  .vers.flits { animation: flits 1.6s ease-out; }
  @keyframes flits { 0% { background: #e0e0e0; } 100% { background: var(--bg-soft); } }

  .vtekst em, .pcel em { font-style: italic; color: #555; }
  .wl { border-bottom: 1px dotted var(--accent); }
  .noot { color: var(--accent); cursor: pointer; font-weight: 700; padding: 0 .05rem; }
  .noot:hover { color: var(--accent-donker); }

  .vers:hover .kopieer { opacity: .75; }
  .kopieer:hover { opacity: 1 !important; }

  #bijbel.parallel .vers { display:grid; gap:.8rem; cursor:pointer; align-items:start; }
  #bijbel.parallel .vnr { grid-row: 1; }
  .kolomkop { display:none; }
  #bijbel.parallel + .kolomkop, .kolomkop.tonen { }
  .pk { font-family:"Lora"; font-size:.72rem; text-transform:uppercase; letter-spacing:.12em; color:var(--accent-donker); font-weight:700; }

 woord van de HEERE tot Abram in een visioen, en Hij zei: Vrees niet, Abram! Ik ben u een Schild, uw Loon zeer groot.","2":"Toen zei Abram: Heere HEERE, wat zult U mij geven, terwijl ik zonder kinderen heenga en de bezorger van mijn huis deze Damascener Eliëzer is?","3":"Verder zei Abram: Zie, mij hebt U geen nageslacht gegeven, en zie, de zoon van mijn huis zal mijn erfgenaam zijn!","4":"En zie, het woord van de HEERE kwam tot hem, en Hij zei: Deze zal uw erfgenaam niet zijn; maar hij die uit uw lijf voortkomen zal, die zal uw erfgenaam zijn.","5":"Toen leidde Hij hem naar buiten, en zei: Zie nu op naar de hemel, en tel de sterren, als u ze tellen kunt; en Hij zei tegen hem: Zo zal uw nageslacht zijn!","6":"En hij geloofde in de HEERE; en Hij rekende het hem tot gerechtigheid.","7":"Verder zei Hij tegen hem: Ik ben de HEERE, Die u uitgeleid heb uit Ur van de Chaldeeën, om u dit land te geven, om dat erfelijk te bezitten.","8":"En hij zei: Heere HEERE, waarbij zal ik weten dat ik het erfelijk bezitten zal?","9":"En Hij zei tegen hem: Neem voor Mij een driejarige vaars, en een driejarige geit, en een driejarige ram, en een tortelduif, en een jonge duif.","10":"En hij bracht Hem deze alle, en hij deelde ze middendoor, en hij legde ieders deel tegenover het andere; maar het gevogelte deelde hij niet.","11":"En het wilde gevogelte kwam neer op het aas; maar Abram joeg het weg.","12":"En het gebeurde, toen de zon aan het ondergaan was, dat een diepe slaap op Abram viel; en zie, een schrik en grote duisternis vielen op hem.","13":"Toen zei Hij tegen Abram: Weet voorzeker dat uw nageslacht vreemdeling zal zijn in een land dat niet van hen is, en zij zullen hen dienen, en zij zullen hen verdrukken, vierhonderd jaar.","14":"Maar Ik zal ook het volk rechten dat zij zullen dienen; en daarna zullen zij uittrekken met veel bezit.","15":"En u zult tot uw vaderen gaan in vrede; u zult in goede ouderdom begraven worden.","16":"En het vierde geslacht zal hierheen terugkeren; want de ongerechtigheid van de Amorieten is tot nog toe niet volkomen.","17":"En het gebeurde, toen de zon onderging en het duister werd, en zie, daar was een rokende oven en een vurige fakkel, die tussen die stukken doorging.","18":"Op dezelfde dag maakte de HEERE een verbond met Abram, en Hij zei: Aan uw nageslacht heb Ik dit land gegeven, van de rivier van Egypte af, tot aan die grote rivier, de rivier de Eufraat:","19":"De Kenieten, en de Kenizzieten, en de Kadmonieten,","20":"En de Hethieten, en de Ferezieten, en de Refaïeten,","21":"En de Amorieten, en de Kanaänieten, en de Girgazieten, en de Jebusieten."},"SV":{"1":"Na deze dingen geschiedde het woord des HEEREN tot Abram in een gezicht, zeggende: Vrees niet, Abram! Ik *ben* u een Schild, uw Loon zeer groot.","2":"Toen zeide Abram: Heere, HEERE! wat zult Gij mij geven, daar ik zonder kinderen heenga en de bezorger van mijn huis *is* deze Damaskener Eliëzer?","3":"Voorts zeide Abram: Zie, mij hebt Gij geen zaad gegeven, en zie, de zoon van mijn huis zal mijn erfgenaam zijn!","4":"En ziet, het woord des HEEREN *was* tot hem, zeggende: Deze zal uw erfgenaam niet zijn; maar die uit uw lijf voortkomen zal, die zal uw erfgenaam zijn.","5":"Toen leidde Hij hem uit naar buiten, en zeide: Zie nu op naar den hemel, en tel de sterren, indien gij ze tellen kunt; en Hij zeide tot hem: Zo zal uw zaad zijn!","6":"En hij geloofde in den HEERE; en Hij rekende het hem *tot* gerechtigheid.","7":"Voorts zeide Hij tot hem: Ik *ben* de HEERE, Die u uitgeleid heb uit Ur der Chaldeen, om u dit land te geven, om dat erfelijk te bezitten.","8":"En hij zeide: Heere, HEERE! waarbij zal ik weten, dat ik het erfelijk bezitten zal?","9":"En Hij zeide tot hem: Neem Mij een driejarige vaars, en een driejarige geit, en een driejarigen ram, en een tortelduif, en een jonge duif.","10":"En hij bracht Hem deze alle, en hij deelde ze middendoor, en hij leide elks deel tegen het andere over; maar het gevogelte deelde hij niet.","11":"En het wild gevogelte kwam neder op het aas; maar Abram joeg het weg.","12":"En het geschiedde, als de zon was aan het ondergaan, zo viel een diepe slaap op Abram; en ziet, een schrik, *en* grote duisternis viel op hem.","13":"Toen zeide Hij tot Abram: Weet voorzeker, dat uw zaad vreemd zal zijn in een land, dat het hunne niet *is*, en zij zullen hen dienen, en zij zullen hen verdrukken vierhonderd jaren.","14":"Doch Ik zal het volk ook rechten, hetwelk zij zullen dienen; en daarna zullen zij uittrekken met grote have.","15":"En gij zult tot uw vaderen gaan met vrede; gij zult in goeden ouderdom begraven worden.","16":"En het vierde geslacht zal herwaarts wederkeren; want de ongerechtigheid der Amorieten is tot nog toe niet volkomen.","17":"En het geschiedde, dat de zon onderging en het duister werd, en ziet, daar was een rokende oven en vurige fakkel, die tussen die stukken doorging.","18":"Ten zelfden dage maakte de HEERE een verbond met Abram, zeggende: Aan uw zaad heb Ik dit land gegeven, van de rivier van Egypte af, tot aan die grote rivier, de rivier Frath:","19":"Den Keniet, en den Keniziet, en den Kadmoniet,","20":"En den Hethiet, en den Fereziet, en de Refaieten,","21":"En den Amoriet, en den Kanaäniet, en den Girgaziet, en den Jebusiet."},"KJV":{"1":"After these things the word of the LORD came unto Abram in a vision, saying, Fear not, Abram: I *am* thy shield, *and* thy exceeding great reward.","2":"And Abram said, Lord GOD, what wilt thou give me, seeing I go childless, and the steward of my house *is* this Eliezer of Damascus?","3":"And Abram said, Behold, to me thou hast given no seed: and, lo, one born in my house is mine heir.","4":"And, behold, the word of the LORD *came* unto him, saying, This shall not be thine heir; but he that shall come forth out of thine own bowels shall be thine heir.","5":"And he brought him forth abroad, and said, Look now toward heaven, and tell the stars, if thou be able to number them: and he said unto him, So shall thy seed","6":"And he believed in the LORD; and he counted it to him for righteousness.","7":"And he said unto him, I *am* the LORD that brought thee out of Ur of the Chaldees, to give thee this land to inherit","8":"And he said, Lord GOD, whereby shall I know that I shall inherit it?","9":"And he said unto him, Take me an heifer of three years old, and a she goat of three years old, and a ram of three years old, and a turtledove, and a young pigeon.","10":"And he took unto him all these, and divided them in the midst, and laid each piece one against another: but the birds divided","11":"And when the fowls came down upon the carcases, Abram drove them away.","12":"And when the sun was going down, a deep sleep fell upon Abram; and, lo, an horror of great darkness fell","13":"And he said unto Abram, Know of a surety that thy seed shall be a stranger in a land *that is* not theirs, and shall serve them; and they shall afflict them four hundred years;","14":"And also that nation, whom they shall serve, will I judge: and afterward shall they come out with great substance.","15":"And thou shalt go to thy fathers in peace; thou shalt be buried in a good old age.","16":"But in the fourth generation they shall come hither again: for the iniquity of the Amorites *is* not yet full.","17":"And it came to pass, that, when the sun went down, and it was dark, behold a smoking furnace, and a burning lamp that passed between those pieces.","18":"In the same day the LORD made a covenant with Abram, saying, Unto thy seed have I given this land, from the river of Egypt unto the great river, the river Euphrates:","19":"The Kenites, and the Kenizzites, and the Kadmonites,","20":"And the Hittites, and the Perizzites, and the Rephaims,","21":"And the Amorites, and the Canaanites, and the Girgashites, and the Jebusites."}},"tsk":{"1":[{"kopje":"in","refs":["Gen 46:2","Num 12:6","1 Sam 9:9","Ezech 1:1","Ezech 3:4","Ezech 11:24","Dan 10:1-16","Hand 10:10-17","Hand 10:22","Hebr 1:1"]},{"kopje":"Vrees niet","refs":["Ge \" data-code=\"H3318\">forth</span> out of thine own <span class=\"wl wl-kjv\" data-code=\"H4578\">bowels</span> shall be thine heir.","5":"And he brought him <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> <span class=\"wl wl-kjv\" data-code=\"H2351\">abroad,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H5027\">Look</span> now toward <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven,</span> and <span class=\"wl wl-kjv\" data-code=\"H5608\">tell</span> the <span class=\"wl wl-kjv\" data-code=\"H3556\">stars,</span> if thou be <span class=\"wl wl-kjv\" data-code=\"H3201\">able</span> to <span class=\"wl wl-kjv\" data-code=\"H5608\">number</span> them: and he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, <span class=\"wl wl-kjv\" data-code=\"H3541\">So</span> shall thy seed","6":"And he <span class=\"wl wl-kjv\" data-code=\"H539\">believed</span> in the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD;</span> and he <span class=\"wl wl-kjv\" data-code=\"H2803\">counted</span> it to him for righteousness.","7":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, I am the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> that brought thee <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> of <span class=\"wl wl-kjv\" data-code=\"H218\">Ur</span> of the <span class=\"wl wl-kjv\" data-code=\"H3778\">Chaldees,</span> to <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> thee this <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> to inherit","8":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD,</span> <span class=\"wl wl-kjv\" data-code=\"H4100\">whereby</span> shall I <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> that I shall inherit it?","9":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, <span class=\"wl wl-kjv\" data-code=\"H3947\">Take</span> me an <span class=\"wl wl-kjv\" data-code=\"H5697\">heifer</span> of three years <span class=\"wl wl-kjv\" data-code=\"H8027\">old,</span> and a she <span class=\"wl wl-kjv\" data-code=\"H5795\">goat</span> of three years <span class=\"wl wl-kjv\" data-code=\"H8027\">old,</span> and a <span class=\"wl wl-kjv\" data-code=\"H352\">ram</span> of three years <span class=\"wl wl-kjv\" data-code=\"H8027\">old,</span> and a <span class=\"wl wl-kjv\" data-code=\"H8449\">turtledove,</span> and a young pigeon.","10":"And he <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> unto him all these, and <span class=\"wl wl-kjv\" data-code=\"H1334\">divided</span> them in the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">laid</span> <span class=\"wl wl-kjv\" data-code=\"H376\">each</span> <span class=\"wl wl-kjv\" data-code=\"H1335\">piece</span> one <span class=\"wl wl-kjv\" data-code=\"H7125\">against</span> <span class=\"wl wl-kjv\" data-code=\"H7453\">another:</span> but the <span class=\"wl wl-kjv\" data-code=\"H6833\">birds</span> divided","11":"And when the <span class=\"wl wl-kjv\" data-code=\"H5861\">fowls</span> came <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> upon the <span class=\"wl wl-kjv\" data-code=\"H6297\">carcases,</span> <span class=\"wl wl-kjv\" data-code=\"H87\">Abram</span> drove them away.","12":"And when the <span class=\"wl wl-kjv\" data-code=\"H8121\">sun</span> was going <span class=\"wl wl-kjv\" data-code=\"H935\">down,</span> a deep <span class=\"wl wl-kjv\" data-code=\"H8639\">sleep</span> <span class=\"wl wl-kjv\" data-code=\"H5307\">fell</span> upon <span class=\"wl wl-kjv\" data-code=\"H87\">Abram;</span> and, lo, an <span class=\"wl wl-kjv\" data-code=\"H367\">horror</span> of <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H2825\">darkness</span> fell","13":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H87\">Abram,</span> <span class=\"wl wl-kjv\" data-code=\"H3045\">Know</span> of a <span class=\"wl wl-kjv\" data-code=\"H3045\">surety</span> that thy <span class=\"wl wl-kjv\" data-code=\"H2233\">seed</span> shall be a <span class=\"wl wl-kjv\" data-code=\"H1616\">stranger</span> in a <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> that is not theirs, and shall <span class=\"wl wl-kjv\" data-code=\"H5647\">serve</span> them; and they shall <span class=\"wl wl-kjv\" data-code=\"H6031\">afflict</span> them <span class=\"wl wl-kjv\" data-code=\"H702\">four</span> <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> years;","14":"And also that <span class=\"wl wl-kjv\" data-code=\"H1471\">nation,</span> whom they shall <span class=\"wl wl-kjv\" data-code=\"H5647\">serve,</span> will I <span class=\"wl wl-kjv\" data-code=\"H1777\">judge:</span> and <span class=\"wl wl-kjv\" data-code=\"H310\">afterward</span> shall they come <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> with <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> substance.","15":"And thou shalt <span class=\"wl wl-kjv\" data-code=\"H935\">go</span> to thy <span class=\"wl wl-kjv\" data-code=\"H1\">fathers</span> in <span class=\"wl wl-kjv\" data-code=\"H7965\">peace;</span> thou shalt be <span class=\"wl wl-kjv\" data-code=\"H6912\">buried</span> in a <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> old age.","16":"But in the <span class=\"wl wl-kjv\" data-code=\"H7243\">fourth</span> <span class=\"wl wl-kjv\" data-code=\"H1755\">generation</span> they shall come <span class=\"wl wl-kjv\" data-code=\"H2008\">hither</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">again:</span> for the <span class=\"wl wl-kjv\" data-code=\"H5771\">iniquity</span> of the <span class=\"wl wl-kjv\" data-code=\"H567\">Amorites</span> is not <span class=\"wl wl-kjv\" data-code=\"H2008\">yet</span> full.","17":"And it came to pass, that, when the <span class=\"wl wl-kjv\" data-code=\"H8121\">sun</span> went <span class=\"wl wl-kjv\" data-code=\"H935\">down,</span> and it was <span class=\"wl wl-kjv\" data-code=\"H5939\">dark,</span> behold a <span class=\"wl wl-kjv\" data-code=\"H6227\">smoking</span> <span class=\"wl wl-kjv\" data-code=\"H8574\">furnace,</span> and a <span class=\"wl wl-kjv\" data-code=\"H784\">burning</span> <span class=\"wl wl-kjv\" data-code=\"H3940\">lamp</span> that <span class=\"wl wl-kjv\" data-code=\"H5674\">passed</span> <span class=\"wl wl-kjv\" data-code=\"H996\">between</span> those pieces.","18":"In the <span class=\"wl wl-kjv\" data-code=\"H1931\">same</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H3772\">made</span> a <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant</span> with <span class=\"wl wl-kjv\" data-code=\"H87\">Abram,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Unto thy <span class=\"wl wl-kjv\" data-code=\"H2233\">seed</span> have I <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> this <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> from the <span class=\"wl wl-kjv\" data-code=\"H5104\">river</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt</span> unto the <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H5104\">river,</span> the <span class=\"wl wl-kjv\" data-code=\"H5104\">river</span> Euphrates:","19":"The <span class=\"wl wl-kjv\" data-code=\"H7017\">Kenites,</span> and the <span class=\"wl wl-kjv\" data-code=\"H7074\">Kenizzites,</span> and the Kadmonites,","20":"And the <span class=\"wl wl-kjv\" data-code=\"H2850\">Hittites,</span> and the <span class=\"wl wl-kjv\" data-code=\"H6522\">Perizzites,</span> and the Rephaims,","21":"And the <span class=\"wl wl-kjv\" data-code=\"H567\">Amorites,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3669\">Canaanites,</span> and the <span class=\"wl wl-kjv\" data-code=\"H1622\">Girgashites,</span> and the Jebusites."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"in een","tekst":"Een soort der goddelijke openbaring, waardoor den mens, als hij niet slaapt, òf uitwendig van God iets voorkomt, òf in zijn geest opgetrokken wordt, om door denzelven inwendig te zien, of te verstaan hetgeen de Heere hem wil bekendmaken, Num 12:6-8, Num 24:4; Isa 1:1; Act 10:10-11. Het schijnt dat God in dit gezicht Abram ook uitwendig op zichtbare wijze verschenen is; zie vs.5 enz."},{"catchword":"Ik ben","tekst":"Deze woorden begrijpen de volheid aller gelukzaligheid, die God zijn kinderen in den Messias belooft en geeft, bestaande in de bescherming tegen alle kwaad, en toevoeging van alles goeds, hier aanvankelijk en hierna volmaaktelijk."}],"2":[{"catchword":"wat zult","tekst":"Dat is, welke gave zal mij vermaken, zolang ik niet zie de vervulling uwer belofte, aangaande mijn zaad, waaruit de Messias zal voortkomen?"},{"catchword":"daar ik","tekst":"Anders, ik ga toch zonder kinderen."},{"catchword":"bezorger van","tekst":"Hebr. de zoon der beloping, of, besturing, of, der bezorging van mijn huis. Dat is, de verzorger van mijn huis. Aldus wordt een zoon der vroomheid gezegd, 1Ki 1:52, voor een vroom man; aldus zonen der gevangenis, Ezr 4:1, voor degenen, die gevangen geweest waren; zonen der verdrukking, Pro 31:5, voor verdrukten; en Jer 48:45, zonen der beroerte, voor degenen die beroerte maken."},{"catchword":"deze Damaskener","tekst":"Hebr. Dammeseck, dat is, van Damaskus, of Damaskener. Dit is een afgebroken rede, die Abram vervolgt en ten einde brengt in het volgende vs.3."},{"catchword":"Eliëzer","tekst":"De naam des verzorgers van Abrams huis."}],"3":[{"catchword":"zaad gegeven,","tekst":"Dat is zoon. Zie boven Gen 4:25."},{"catchword":"de zoon","tekst":"Dat is, mijn knecht, die in mijn huis geboren is, vergelijk boven Gen 14:14. Met deze manier van spreken worden de ingeboren knechten onderscheiden van de zonen des lichaams, of eigen kinderen, zoals Job 19:17; Pro 31:2; Jer 2:14."},{"catchword":"zal mijn erfgenaam zijn","tekst":"Hebr. zal mij erven, zo ook vs.4."}],"4":[{"catchword":"Deze zal","tekst":"Nam. Eliëzer de Damaskener."},{"catchword":"uit uw","tekst":"Hebr. uit uw ingewand. Zie 2Sa 7:12; verg. onder Gen 35:11, en 2Ch 6:9."}],"5":[{"catchword":"Hij","tekst":"Te weten, God."},{"catchword":"hem","tekst":"Nam. Abram."},{"catchword":"uit naar","tekst":"Buiten de tent."},{"catchword":"Zo zal","tekst":"Verg. boven Gen 13:16; 1Ki 4:20."}],"6":[{"catchword":"hij geloofde","tekst":"Niet dat Abram hier eerst begon te geloven, maar dat hij sterker werd in het geloof, zijn vlees overwinnende, en de grote belofte, die hem God. vs.1, 4,5, van zijn zaad en voornamelijk van den Messias gedaan had, tot troost en zaligheid van zijn ziel langs zo meer aannemende."},{"catchword":"Hij rekende","tekst":"Dat is, God heeft uit loutere genade, hem, die geen gerechtigheid had in zichzelven, om voor zijn gericht te bestaan, voor rechtvaardig geacht, door het geloof aan zijn belofte en den beloofden Middelaar; Rom 4:2-3, enz."},{"catchword":"tot","tekst":"Het woordje tot, wordt hier bijgevoegd uit Psa 106:31; Rom 4:3; Gal 3:6; Jam 2:23."}],"7":[{"catchword":"uit Ur","tekst":"Zie boven Gen 11:31."}],"8":[{"catchword":"dat ik","tekst":"Abram, hoewel gelovende, begeert nochtans van God nader bericht en versterking gelijk ook andere gelovigen eertijds gedaan hebben; Jdg 6:27; 2Ki 20:8."}],"9":[{"catchword":"Neem mij","tekst":"Het is opmerkelijk dat hier zulke beesten genomen worden, als in de offeranden meest gebruikt werden."}],"10":[{"catchword":"hem deze","tekst":"Aan God, die tevoren, vs.9, gezegd had: Neem Mij, dat is, om aan Mij toe te brengen."},{"catchword":"hij deelde","tekst":"Zonder twijfel door God onderwezen zijnde."},{"catchword":"elks deel","tekst":"Hebr. den man zijns deels tegen over zijn naaste, of vriend; dat is, de stukken die tezamen behoorden, legde hij tegen elkander over, zoals de rechterzijde van de vaars tegen de linkerzijde, enz."}],"11":[{"catchword":"joeg het","tekst":"Met geblaas, naar de eigenschap van het Hebr. woord."}],"12":[{"catchword":"duisternis","tekst":"Duisternis betekent dikwijls in de Heilige Schrift droefheid, ellende, tegenspoed, Psa 35:14 Psa 38:7, enz."}],"13":[{"catchword":"Weet voorzeker,","tekst":"Hebr. wetende zult gij weten."},{"catchword":"dat het","tekst":"Versta het land Kanaän, maar voornamelijk Egypte."},{"catchword":"hen dienen,","tekst":"De landzaten."},{"catchword":"vierhonderd","tekst":"Het getal van deze vier honderd jaren [volgens het eenvoudigste gevoelen], wordt hier in het groot, en niet in het volkomen gesteld; zijnde het even getal genomen, en het oneven nagelaten, gelijk dit dikmaals in zulke gezegden voorkomt, zoals Jdg 11:26, Jdg 20:46; 2Sa 5:4-5; 1Ki 15:25. Het volle getal is 430 jaren, Exo 12:41; Gal 3:17, waarvan het begin is de tijd des verbonds, dat God hier met Abram heeft gemaakt tot bevestiging zijner voorgaande beloften, zoals dit blijkt uit de woorden van Paulus, Gal 3:17. Het einde van het genoemd aantal jaren is de uitgang der kinderen Israëls uit Egypte, of de wetgeving. Anderen beginnen deze jaren van den uitgang van Abram uit Ur der Chaldeën, of uit Haran, òf van de geboorte van Izak, òf van dien tijd af dat Ismaël Izak bespotte, welke bespotting door Paulus een vervolging genoemd wordt, Gal 4:29."}],"14":[{"catchword":"rechten,","tekst":"Rechten is dikwijls zoveel als iemands zaak te beoordelen en uit te wijzen, òf tot zijn nadeel om hem te straffen, zoals hier en Psa 51:6, òf tot zijn voordeel om hem te beschermen, zoals onder Gen 30:6; Psa 7:9; Jer 5:28, Jer 22:16."}],"15":[{"catchword":"gij zult tot","tekst":"Dat is, gij zult sterven naar het lichaam, maar naar de ziel vergaderd worden tot den staat van het andere leven; verg. onder Gen 25:8, Gen 25:17."},{"catchword":"goeden","tekst":"Hebr. in goede grijsheid. Een goede ouderdom bestaat eigenlijk niet alleen in de langheid des levens en het tijdelijk geluk, maar in het voorgaande leven, doorgebracht in Godvruchtigheid voor God, rechtvaardigheid jegens de mensen, matigheid en gerustheid bij zichzelven. Alzo onder Gen 25:8; Jdg 8:32; 1Ch 29:28."}],"16":[{"catchword":"het vierde","tekst":"Anders, in het vierde geslacht zullen zij wederkeren, dat is, na het einde van vier honderd jaren; het leven des mensen in dien tijd op omtrent honderd jaren gerekend zijnde."},{"catchword":"der Amorieten","tekst":"En van andere boze natiën, die hieronder genoemd worden, vs.19-21. Alzo onder Gen 48:22; 1Ki 21:2; 2Ki 21:11."},{"catchword":"is tot nog","tekst":"Dewijl God dit land den Amorieten gegeven, en besloten had hen daaruit niet te verdelgen, eer zij zulks ten hoogste zouden verdiend hebben, zo heeft Hij hun dien tijd willen laten vervullen, en intussen de zijnen beproeven en oefenen; Jer 51:13; Mat 23:32."}],"17":[{"catchword":"rokende","tekst":"Hebr. oven des rooks. De verdrukking des Israelietischen volks in Egypte wordt vergeleken bij een ijzeren oven. Deu 4:20; 1Ki 8:51; Jer 11:14."},{"catchword":"vurige","tekst":"Hebr. fakkel des vuurs; betekenende Gods tegenwoordigheid en de toekomstige verlossing uit de verdrukking. Zie Jdg 6:21; Isa 62:1; Zec 12:6."},{"catchword":"doorging","tekst":"God maakt hier zijn verbond met Abram op een bijzonder solemnele doch zeer vriendelijke wijze, gelijk de ene mens, vriend en bondgenoot, in dien tijd met den ander gewoon was te doen, te weten, door het slachten van beesten, en de verdeling der stukken, waar de bondgenoten midden door gingen, tot een teken, dat de verbreker van het verbond waardig was aldus in stukken gehouwen te worden. Zie Jer 34:18-19."}],"18":[{"catchword":"maakte de","tekst":"Hebr. sneed, of, hieuw. Een manier van spreken genomen van het slachten der beesten, en de verdeling der stukken, vermeld vs.17."},{"catchword":"gegeven,","tekst":"Te weten, door mijn besloten voornemen en verklaarde belofte; boven hoofdstuk Gen 13:15, hoewel de uitvoering nog tot den tijd voornoemd, vs.13, moet uitgesteld worden."},{"catchword":"van de","tekst":"Hierdoor wordt verstaan de rivier Sichor, welke Egypte van Kanaän scheidt; Num 34:5; Jos 13:3; 1Ch 13:5. Anderen verstaan hier de rivier Nilus (de Nijl.)"},{"catchword":"Frath","tekst":"Zie boven Gen 2:14, en de vervulling hiervan 2Sa 8:3, en 1Ki 4:21, 1Ki 9:21; 1Ch 18:3; 2Ch 9:26."}],"19":[{"catchword":"Den Kenieter,","tekst":"De opsomming der volken, die het land Kanaän vóór de Israëlieten bezeten hebben. Vergelijk dezelve met boven, Gen 10:15-16, enz. en met de aantekeningen aldaar."}],"20":[{"catchword":"Refaïm","tekst":"Zie van dezen boven Gen 14:15."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"After these things the word of the LORD was or happened to Abram in a vision [a certain kind of divine revelation whereby a man that is not asleep hath either outwardly something representing unto him by God or his spirit taken up thereby to see or understand inwardly that which the Lord is pleased to make known to him Num 12:6,7,8 and 24.4 Isa 1:1 Act 10:10 ,11 it should seem that God in this vision appeared likewise outwardly to Abram see verse 5 &c.] saying fear not Abram I am thy shield thy reward very great [these words comprehend the faithfulness of all happiness which God doth promise and give unto his children consisting in protection against all evils and he grant of all good to begin here and to be completed hereafter.]"}],"2":[{"catchword":null,"tekst":"Then said Abram Lord LORD what shouldest thou give me [that is what gift shall I take pleasure or comfort in as long as I do not see the fulfilling of thy promise touching my seed whence the Messiah is to proceed ?] while l go along without children? [Others yet I go without children] and the steward of my house [Heb. The son of the errand or managing or stewardship of my house that is the steward or baily of my house so a son of strength is put 1Ki 1:52 for a strong or stout man and sons of captivity sons of oppression Proverbs31.5 for oppressed ones and Jer 48:45 sons of uproar for man making uproar ] is this Damasco-man [Heb. Damesek that is man of Damascus DAmasco-man this is an imperfect speech which Abram completes in the next verse] Eliezer [the name Abram steward.]"}],"3":[{"catchword":null,"tekst":"Moreover Abram said behold unto thou hast given no seed [that is no son see chapter 4 on verse 25] and lo he son of my house [that is my servant that was born in my house compare chapter 14.14 by this expression the house born servant are differenced from the sons of ones body or proper children as Job 19:17 Prov 31:2 Jer 2:14] shall be my heir [Heb. Shall inherit me as also verse 4.]"}],"4":[{"catchword":null,"tekst":"And behold the word of the Lord was to him saying this man [this Eliezer namely of Damascus] shall not be thy heir but he that shall come forth out of thy body [Heb. Out of thy bowl see 2Sa 7:12 compare Gen 35:11 and 2Ch 6:9] he shall be thy heir."}],"5":[{"catchword":null,"tekst":"Then he [God namely] led him [Abram] forth [the tent] and said look up now to heaven and tell the stars if thou canst tell them and he said unto them thus shall thy seed be [compare 13.16 and 1Ki 4:20]"}],"6":[{"catchword":null,"tekst":"And he believed in the Lord [ not as if Abram had but then begun to believe but that he grew stronger in his faith overcoming the doubts of his flesh and more and more embracing and relying on the great promises which God had made him verse 1,4,5 concerning his seed and principally the Messiah to his own souls comfort and salvation ] and he imputed it to him for righteousness [the particle for is put in here out of Psa 106:31 and Rom 4:3 Galatians 3.6 Jas 2:23teh sense is God of his mere grace held him righteous and justified that had no righteousness in himself whereby to subsist before the judgment seat and that through faith in his promise and in the promised mediator Rom 4:2,3&c.]"}],"7":[{"catchword":null,"tekst":"Moreover he said unto him I am the Lord that led thee forth out of Ur of the Chaldeans [see chapter 11 verse 31] for to give thee in this land hereditarily to possess the same."}],"8":[{"catchword":null,"tekst":"And he said Lord, Lord whereby shall I know that I shall hereditarily possess it? [Abram though he believed yet he desireth further information and confirmation of god as others believers likewise have done in their times Jude 6.37 2Kings 28.]"}],"9":[{"catchword":null,"tekst":"And he said to him take me a three-years heifer and a three years Goat and a three years ram and a turtle dove and a young dove [it is remarkable that here such beasts or creatures only are made use of as were mostly used for sacrifices.]"}],"10":[{"catchword":null,"tekst":"And he brought all these unto him [viz. unto God who formerly verse 9 bid him take me that is to take to bring unto me &c.] and he [ Abram namely being doubtless instructed by God ] divided them through the midst and he laid each one part over against the other [Heb. The man of his part over against his neighbor or friend that is to say he laid the pieces belonging together right over against one another as the right side of the heifer over against the left &c.] But the fowl he divided not."}],"11":[{"catchword":null,"tekst":"And the wild fowl came down upon the carcass but Abram chased it away [by blowing as the property of the Hebrew word doth imply.]"}],"12":[{"catchword":null,"tekst":"And it came to pass when the sun was going down there fell a deep sleep on Abram and behold a terror and great darkness fell upon him [darkness doth often in scripture signify terror affliction adversity tribulation Psa 35:14 and 38.7 &c.]"}],"13":[{"catchword":null,"tekst":"Then said he to Abram know for certain [Heb. Knowing thou shalt know ] that thy seed shall be foreign or a stranger in a country that is not theirs [understand the land of Canaan but principally Egypt ] and shall serve them [that is the inhabitants or owner thereof ] and they shall oppress them four hundred years[the number of these four hundred years after the plainest sense is here set down in gross not in the exactness the round number being made use of and the odd number left out as usual in the like relations see Jude 11.26 and 20.46,2Sa 5:5 1Ki 15:25 the full number is four hundred and thirty years Exo 12:41 Galatians 3.17 beginning from the time of the covenant made here by the God with Abram in confirmation of the former promises as doth appear by the words of the saints Paul Galatians 3.17 the end of the foresaid years is going forth of the children of Israel out of Egypt or the giving of the law others begin these years from Abrams going forth out of Ur in Chaldea and out of Haran or from the birth of Isaac or from time when Ishmael mocked Isaac which mocking is termed a persecution by Paul Galatians 4.29.]"}],"14":[{"catchword":null,"tekst":"Yet shall likewise judge the people [to judge implieth many times as much as to judge and shew or to determine a mans cause either to his damage by punishing of him as he and Psa 51:6 or to his advantage by protecting him as chapter 30.6 Psa 7:9 Jer 5:28 and 22.16] whom they shall serve and after that they shall go forth with great substance."}],"15":[{"catchword":null,"tekst":"And thou shalt go to thy father with peace [that is thou shalt die a bodily death while thy soul shall be gathered to others into life everlasting compare chapter 25 verse 8 and 17] thou shalt be buried in good age [Heb. In good age properly consists not only in good grayness a good age properly consists not only in length of life and temporal happiness but in a life pass and transacted in piety before God justice towards men sobriety and contentedness in and by ones self so chapter 25.8 and Jude 8.32 1Ch 29:28.]"}],"16":[{"catchword":null,"tekst":"And the forth generation shall turn hither again [others in the forth generation they shall return &c. that is after the end of four hundred years the age of men being at that time ordinarily reckoned about a hundred years ] for the unrighteousness of the Amorites [and those other wicked nations rehearsed below verse 19, 20,21 so chapter 48.22,1 Kings 21.26 2Ki 21:11] is not perfect as yet [God having given this land unto the Amorites and determined not to drive them out thence until they should have deserved it in the highest degree he is resolved to let them spend and make up that time accordingly and in the interim to prove & exercise his own people Jer 51:13 Mat 23:32.]"}],"17":[{"catchword":null,"tekst":"And it came to pass that the sun went down and it grew dark and lo there was a smoking furnace [Heb. Furnace o f smoke the oppression of people of Israel in Egypt is compared in the iron furnace Deu 4:20 and 1Ki 8:51 Jer 11:4] and fiery torch [Heb. Torch of fire signifying the presence of God and the future deliverance from the oppression see Jude6.21 Isa 62:1 Zach. 12.6]which past through between those pieces [God makes up his covenant here with Abram in a most peculiar and solemn though very friendly manner like as the custom was to do at that time between one men friend and confederate with the other namely by slaying of beasts and dividing of the parts or pieces and the confederates passing through the midst of them in token that the covenant breaker deserved to be cut in pieces thus see Jer 34:18,19.]"}],"18":[{"catchword":null,"tekst":"At or on that the same day the Lord made [Heb. Cut or stroke a borrowed phrase from the slaying of the beast and dividing of the pieces mentioned verse 17.]a covenant with Abram saying unto the seed have I given this land [viz. by my determined purpose and declared promise chapter 13.15 however the performance and execution thereof must be deserted yet until the time aforesaid verse 13 ] from off the river of Egypt [ hereby is understood the river Sicher which divided Egypt from Canaan Num 34:5 Jos 13:3 2Ch 13:15others do understand here the river Nilus] unto that great river the river Phrath [see chapter2.14 and the fulfilling hereof 2Sa 8:3 and 1Ki 4:21 and 9.21 and 1 Chronicles 18.3 2Ch 9:26.]"}],"19":[{"catchword":null,"tekst":"The Kenite and the Kenezite and the Kadmonite [the Rowl of the nation which did possess the land of Canaan the Israelites compare the same with chapter 10.15,16 &c. and the annotation there.]"}],"20":[{"catchword":null,"tekst":"The Hethite and the Pherizite and the Rephaim [see of this chapter 14.5.]"}],"21":[{"catchword":null,"tekst":"And the Amorite and the Canaanites and the Girgasite and the Jebusite."}]}}};

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');

  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);

});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start) {
  const nummers = [];
  for (let i = 0; i < 3; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
  if (m) {
    const start = parseInt(m[1], 10);
    const html = popupVerzenHtml(D.vertalingen.SVnu, start);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const html = popupVerzenHtml(data, start);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
