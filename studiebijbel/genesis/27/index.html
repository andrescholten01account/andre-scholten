zak oud geworden was, en zijn ogen donker waren geworden, zodat hij niet meer kon zien; toen riep hij Ezau, zijn oudste zoon, en zei tegen hem: Mijn zoon! En hij zei tegen hem: Zie, *hier* ben ik!","2":"En hij zei: Zie toch, ik ben oud geworden, ik weet de dag van mijn dood niet.","3":"Nu dan, neem toch uw gereedschap, uw pijlkoker en uw boog, en ga het veld in, en jaag voor mij een stuk wild;","4":"En maak voor mij smakelijke spijzen, zoals ik ze graag heb, en breng ze mij, zodat ik kan eten; opdat mijn ziel u zegent, voordat ik sterf.","5":"Rebekka nu luisterde toe, toen Izak tot zijn zoon Ezau sprak; en Ezau ging het veld in om een stuk wild te jagen en het thuis te brengen.","6":"Toen sprak Rebekka tot Jakob, haar zoon, en zei: Zie, ik heb uw vader tot Ezau, uw broer, horen spreken, en hij zei:","7":"Breng mij een stuk wild, en maak voor mij smakelijke spijzen, zodat ik kan eten; en ik zal u zegenen voor het aangezicht van de HEERE, voor mijn dood.","8":"Nu dan, mijn zoon! luister naar mijn stem, in hetgeen ik u moet gebieden.","9":"Ga nu naar de kudde, en haal voor mij van daar twee goede geitenbokjes; en ik zal die voor uw vader klaarmaken tot smakelijke spijzen, zoals hij graag heeft.","10":"En u zult ze naar uw vader brengen, en hij zal eten, opdat hij u zegent voor zijn dood.","11":"Toen zei Jakob tot Rebekka, zijn moeder: Zie, mijn broer Ezau *is* een harige man, en ik *ben* een gladde man.","12":"Misschien zal mijn vader mij betasten, en dan zal ik in zijn ogen zijn als een bedrieger; zo zou ik een vloek over mij halen, en geen zegen.","13":"En zijn moeder zei tegen hem: Uw vloek zij op mij, mijn zoon! luister alleen naar mijn stem, en ga, haal ze voor mij.","14":"Toen ging hij, en hij haalde ze, en bracht ze naar zijn moeder; en zijn moeder maakte smakelijke spijzen, zoals zijn vader graag had.","15":"Daarna nam Rebekka de kostbare kleren van Ezau, haar oudste zoon, die zij bij zich in huis had, en zij trok ze Jakob, haar jongste zoon, aan.","16":"En de vellen van de geitenbokjes trok zij over zijn handen, en over de gladheid van zijn hals.","17":"En zij gaf de smakelijke spijzen, en het brood, dat zij klaargemaakt had, in de hand van Jakob, haar zoon.","18":"En hij kwam tot zijn vader, en zei: Mijn vader! En hij zei: Zie, *hier* ben ik; wie *bent* u, mijn zoon?","19":"En Jakob zei tot zijn vader: Ik *ben* Ezau, uw eerstgeborene; ik heb gedaan zoals u tot mij gesproken had; sta toch op, ga zitten, en eet van mijn wildbraad, opdat uw ziel mij zegent.","20":"Toen zei Izak tot zijn zoon: Hoe komt het dat u het zo snel gevonden hebt, mijn zoon? En hij zei: Omdat de HEERE, uw God, het mij heeft doen ontmoeten voor mijn aangezicht.","21":"En Izak zei tot Jakob: Kom toch dichterbij, zodat ik u kan betasten, mijn zoon! of u werkelijk mijn zoon Ezau bent, of niet.","22":"Toen kwam Jakob dichter bij zijn vader Izak, die hem betastte; en hij zei: De stem is Jakobs stem, maar de handen zijn Ezaus handen.","23":"Doch hij herkende hem niet, omdat zijn handen harig waren, zoals de handen van zijn broer Ezau; en hij zegende hem.","24":"En hij zei: Bent u werkelijk mijn zoon Ezau? En hij zei: Ik *ben het*!","25":"Toen zei hij: Zet het dichtbij mij, zodat ik van het wildbraad van mijn zoon kan eten, opdat mijn ziel u zegent. En hij zette het dichtbij hem, en hij at; hij bracht hem ook wijn, en hij dronk.","26":"En zijn vader Izak zei tegen hem: Kom toch dichterbij, en kus mij, mijn zoon!","27":"En hij kwam dichterbij, en hij kuste hem; toen rook hij de geur van zijn kleren, en zegende hem; en hij zei: Zie, de geur van mijn zoon is als de geur van het veld, dat de HEERE gezegend heeft.","28":"Zo geeft God u dan van de dauw van de hemel, en van de vettigheid van de aarde, en overvloed van koren en most.","29":"Volken zullen u dienen, en volken zullen zich voor u neerbuigen; wees heer over uw broers, en de zonen van uw moeder zullen zich voor u neerbuigen! Vervloekt moet hij zijn, wie u vervloekt; en wie u zegent, zij gezegend!","30":"En het gebeurde, toen Izak klaar was met Jakob te zegenen, en Jakob nog maar net van het aangezicht van zijn vader Izak was weggegaan, dat Ezau, zijn broer, van zijn jacht kwam.","31":"Hij nu maakte ook smakelijke spijzen klaar, en bracht die tot zijn vader; en hij zei tegen zijn vader: Mijn vader, sta op en eet van het wildbraad van uw zoon, opdat uw ziel mij zegent.","32":"En Izak, zijn vader, zei tegen hem: Wie *bent* u? En hij zei: Ik *ben* uw zoon, uw eerstgeborene, Ezau.","33":"Toen schrok Izak met zeer grote schrik, geheel en al, en zei: Wie *is* hij dan, die het wildbraad gejaagd en mij gebracht heeft? en ik heb van alles gegeten, voordat u kwam, en heb hem gezegend; ook zal hij gezegend blijven.","34":"Toen Ezau de woorden van zijn vader hoorde, schreeuwde hij met een grote en bittere schreeuw, geheel en al; en hij zei tegen zijn vader: Zegen mij, ook mij, mijn vader!","35":"En hij zei: Uw broer is gekomen met bedrog, en heeft uw zegen weggenomen.","36":"Toen zei hij: Is het niet omdat men zijn naam Jakob noemt, dat hij mij nu al twee keer bedrogen heeft? mijn eerstgeboorterecht heeft hij genomen, en zie, nu heeft hij mijn zegen genomen! Verder zei hij: Hebt u dan geen zegen voor mij bewaard?","37":"Toen antwoordde Izak, en zei tegen Ezau: Zie, ik heb hem tot een heer over u gesteld, en al zijn broers heb ik hem tot knechten gegeven; en ik heb hem met koren en most ondersteund; wat zal ik dan nu voor u doen, mijn zoon?","38":"En Ezau zei tegen zijn vader: Hebt u *maar* deze ene zegen, mijn vader? Zegen mij, ook mij, mijn vader! En Ezau verhief zijn stem, en weende.","39":"Toen antwoordde zijn vader Izak en zei tegen hem: Zie, de vettigheden van de aarde zullen uw woningen zijn, en van de dauw van de hemel van boven af *zult u gezegend zijn*.","40":"En van uw zwaard zult u leven, en u zult uw broer dienen; doch het zal gebeuren, wanneer u zult heersen, dan zult u zijn juk van uw hals afrukken.","41":"En Ezau haatte Jakob om die zegen, waarmee zijn vader hem gezegend had; en Ezau zei in zijn hart: De dagen van rouw om mijn vader komen dichterbij, en ik zal mijn broer Jakob doden.","42":"Toen aan Rebekka deze woorden van Ezau, haar oudste zoon, verteld werden, zond zij een boodschap, en ontbood Jakob, haar jongste zoon, en zei tegen hem: Zie, uw broer Ezau troost zich met de gedachte u te doden.","43":"Nu dan, mijn zoon! luister naar mijn stem, en maak u op, vlucht naar Haran, naar Laban, mijn broer.","44":"En blijf bij hem enige dagen, totdat de hevige woede van uw broer keert;","45":"Totdat de toorn van uw broer van u afkeert, en hij vergeten heeft wat u hem hebt aangedaan; dan zal ik boodschap sturen, en u van daar terughalen; waarom zou ik ook van u beiden beroofd worden op één dag?","46":"En Rebekka zei tegen Izak: Ik heb een afkeer van mijn leven vanwege de dochters van Heth! Als Jakob een vrouw neemt van de dochters van Heth, zoals deze zijn, van de dochters van dit land, waartoe zal mij dan het leven zijn?"},"SV":{"1":"En het geschiedde, als Izak oud geworden was, en zijn ogen donker geworden waren, en hij niet zien kon; toen riep hij Ezau, zijn grootsten zoon, en zeide tot hem: Mijn zoon! En hij zeide tot hem: Zie, *hier* ben ik!","2":"En hij zeide: Zie nu, ik ben oud geworden, ik weet den dag mijns doods niet.","3":"Nu dan, neem toch uw gereedschap, uw pijlkoker en uw boog, en ga uit in het veld, en jaag mij een wildbraad;","4":"En maak mij smakelijke spijzen, zo als ik die gaarne heb, en breng ze mij, dat ik ete; opdat mijn ziel u zegene, eer ik sterve.","5":"Rebekka nu hoorde toe, als Izak tot zijn zoon Ezau sprak; en Ezau ging in het veld, om een wildbraad te jagen, dat hij het inbracht.","6":"Toen sprak Rebekka tot Jakob, haar zoon, zeggende: Zie, ik heb uw vader tot Ezau, uw broeder, horen spreken, zeggende:","7":"Breng mij een wildbraad, en maak mij smakelijke spijzen toe, dat ik ete; en ik zal u zegenen voor het aangezicht des HEEREN, voor mijn dood.","8":"Nu dan, mijn zoon! hoor mijn stem in hetgeen ik u gebiede.","9":"Ga nu heen tot de kudde, en haal mij van daar twee goede geitenbokjes; en ik zal die voor uw vader maken tot smakelijke spijzen, gelijk als hij gaarne heeft.","10":"En gij zult ze tot uw vader brengen, en hij zal eten, opdat hij u zegene voor zijn dood.","11":"Toen zeide Jakob tot Rebekka, zijn moeder: Zie, mijn broeder Ezau *is* een harig man, en ik *ben* een glad man.","12":"Misschien zal mij mijn vader betasten, en ik zal in zijn ogen zijn als een bedrieger; zo zoude ik een vloek over mij halen, en niet een zegen.","13":"En zijn moeder zeide tot hem: Uw vloek zij op mij, mijn zoon! hoor alleen naar mijn stem, en ga, haal ze mij.","14":"Toen ging hij, en hij haalde ze, en bracht ze zijn moeder; en zijn moeder maakte smakelijke spijzen, gelijk als zijn vader gaarne had.","15":"Daarna nam Rebekka de kostelijke klederen van Ezau, haar grootsten zoon, die zij bij zich in huis had, en zij trok ze Jakob, haar kleinsten zoon, aan.","16":"En de vellen van de geitenbokjes trok zij over zijn handen, en over de gladdigheid van zijn hals.","17":"En zij gaf de smakelijke spijzen, en het brood, welke zij toegemaakt had, in de hand van Jakob, haar zoon.","18":"En hij kwam tot zijn vader, en zeide: Mijn vader! En hij zeide: Zie, *hier* ben ik; wie *zijt* gij, mijn zoon?","19":"En Jakob zeide tot zijn vader: Ik *ben* Ezau uw eerstgeborene; ik heb gedaan, gelijk als gij tot mij gesproken hadt; sta toch op, zit, en eet van mijn wildbraad, opdat uw ziel mij zegene.","20":"Toen zeide Izak tot zijn zoon: Hoe is dit, *dat* gij het zo haast gevonden hebt, mijn zoon? En hij zeide: Omdat de HEERE uw God *dat* heeft doen ontmoeten voor mijn aangezicht.","21":"En Izak zeide tot Jakob: Nader toch, dat ik u betaste, mijn zoon! of gij mijn zoon Ezau zelf zijt, of niet.","22":"Toen kwam Jakob bij, tot zijn vader Izak, die hem betastte; en hij zeide: De stem is Jakobs stem, maar de handen zijn Ezau’s handen.","23":"Doch hij kende hem niet, omdat zijn handen harig waren, gelijk zijns broeders Ezau’s handen; en hij zegende hem.","24":"En hij zeide: Zijt gij mijn zoon Ezau zelf? En hij zeide: Ik *ben het*!","25":"Toen zeide hij: Stel het nabij mij, dat ik van het wildbraad mijns zoons ete, opdat mijn ziel u zegene. En hij stelde het nabij hem, en hij at; hij bracht hem ook wijn, en hij dronk.","26":"En zijn vader Izak zeide tot hem: Kom toch bij, en kus mij, mijn zoon!","27":"En hij kwam bij, en hij kuste hem; toen rook hij de reuk zijner klederen, en zegende hem; en hij zeide: Zie, de reuk mijns zoons is als de reuk des velds, hetwelk de HEERE gezegend heeft.","28":"Zo geve u dan God van den dauw des hemels, en de vettigheid der aarde, en menigte van tarwe en most.","29":"Volken zullen u dienen, en natiën zullen zich voor u nederbuigen; wees heer over uw broederen, en de zonen uwer moeder zullen zich voor u nederbuigen! Vervloekt moet hij zijn, wie u vervloekt; en wie u zegent, zij gezegend!","30":"En het geschiedde, als Izak voleindigd had Jakob te zegenen, zo geschiedde het, toen Jakob maar even van het aangezicht van zijn vader Izak uitgegaan was, dat Ezau, zijn broeder, van zijn jacht kwam.","31":"Hij nu maakte smakelijke spijzen toe, en bracht die tot zijn vader; en hij zeide tot zijn vader: Mijn vader sta op en ete van het wildbraad zijns zoons, opdat uw ziel mij zegene.","32":"En Izak, zijn vader, zeide tot hem: Wie *zijt* gij? En hij zeide: Ik *ben* uw zoon, uw eerstgeborene, Ezau.","33":"Toen verschrikte Izak met zeer grote verschrikking, gans zeer, en zeide: Wie *is* hij dan, die het wildbraad gejaagd en tot mij gebracht heeft? en ik heb van alles gegeten, eer gij kwaamt, en heb hem gezegend; ook zal hij gezegend wezen.","34":"Als Ezau de woorden zijns vaders hoorde, zo schreeuwde hij met een groten en bitteren schreeuw, gans zeer; en hij zeide tot zijn vader: Zegen mij, ook mij, mijn vader!","35":"En hij zeide: Uw broeder is gekomen met bedrog, en heeft uw zegen weggenomen.","36":"Toen zeide hij: Is het niet omdat men zijn naam noemt Jakob, dat hij mij nu twee reizen heeft bedrogen? mijn eerstgeboorte heeft hij genomen, en zie, nu heeft hij mijn zegen genomen! Voorts zeide hij: Hebt gij dan geen zegen voor mij uitbehouden?","37":"Toen antwoordde Izak, en zeide tot Ezau: Zie, ik heb hem tot een heer over u gezet, en al zijn broeders heb ik hem tot knechten gegeven; en ik heb hem met koorn en most ondersteund; wat zal ik u dan nu doen, mijn zoon?","38":"En Ezau zeide tot zijn vader: Hebt gij *maar* dezen enen zegen, mijn vader? Zegen mij, ook mij, mijn vader! En Ezau hief zijn stem op, en weende.","39":"Toen antwoordde zijn vader Izak en zeide tot hem: Zie, de vettigheden der aarde zullen uw woningen zijn, en van den dauw des hemels van boven af *zult* *gij* *gezegend* *zijn*.","40":"En op uw zwaard zult gij leven, en zult uw broeder dienen; doch het zal geschieden, als gij heersen zult, dan zult gij zijn juk van uw hals afrukken.","41":"En Ezau haatte Jakob om dien zegen, waarmede zijn vader hem gezegend had; en Ezau zeide in zijn hart: De dagen van den rouw mijns vaders naderen, en ik zal mijn broeder Jakob doden.","42":"Toen aan Rebekka deze woorden van Ezau, haar grootsten zoon, geboodschapt werden, zo zond zij heen, en ontbood Jakob, haar kleinsten zoon, en zeide tot hem: Zie, uw broeder Ezau troost zich over u, dat hij u doden zal.","43":"Nu dan, mijn zoon! hoor naar mijn stem, en maak u op, vlied gij naar Haran, tot Laban, mijn broeder.","44":"En blijf bij hem enige dagen, totdat de hittige gramschap uws broeders kere;","45":"Totdat de toorn uws broeders van u afkere, en hij vergeten hebbe, hetgeen gij hem gedaan hebt; dan zal ik zenden, en u van daar nemen; waarom zoude ik ook van u beiden beroofd worden op een dag?","46":"En Rebekka zeide tot Izak: Ik heb verdriet aan mijn leven vanwege de dochteren Heths! Indien Jakob een vrouw neemt van de dochteren Heths, gelijk deze *zijn*, van de dochteren dezes lands, waartoe *zal* mij het leven *zijn*?"},"KJV":{"1":"And it came to pass, that when Isaac was old, and his eyes were dim, so that he could not see, he called Esau his eldest son, and said unto him, My son: and he said","2":"And he said, Behold now, I am old, I know not the day of my death:","3":"Now therefore take, I pray thee, thy weapons, thy quiver and thy bow, and go out to the field, and take me *some* venison;","4":"And make me savoury meat, such as I love, and bring *it* to me, that I may eat; that my soul may bless thee before I die.","5":"And Rebekah heard when Isaac spake to Esau his son. And Esau went to the field to hunt *for* venison, *and* to bring","6":"And Rebekah spake unto Jacob her son, saying, Behold, I heard thy father speak unto Esau thy brother, saying,","7":"Bring me venison, and make me savoury meat, that I may eat, and bless thee before the LORD before my death.","8":"Now therefore, my son, obey my voice according to that which I command","9":"Go now to the flock, and fetch me from thence two good kids of the goats; and I will make them savoury meat for thy father, such as he loveth:","10":"And thou shalt bring *it* to thy father, that he may eat, and that he may bless thee before his death.","11":"And Jacob said to Rebekah his mother, Behold, Esau my brother *is* a hairy man, and I *am* a smooth man:","12":"My father peradventure will feel me, and I shall seem to him as a deceiver; and I shall bring a curse upon me, and not a blessing.","13":"And his mother said unto him, Upon me *be* thy curse, my son: only obey my voice, and go fetch","14":"And he went, and fetched, and brought *them* to his mother: and his mother made savoury meat, such as his father loved.","15":"And Rebekah took goodly raiment of her eldest son Esau, which *were* with her in the house, and put them upon Jacob her younger son:","16":"And she put the skins of the kids of the goats upon his hands, and upon the smooth of his neck:","17":"And she gave the savoury meat and the bread, which she had prepared, into the hand of her son Jacob.","18":"And he came unto his father, and said, My father: and he said, Here *am* I; who *art* thou, my son?","19":"And Jacob said unto his father, I *am* Esau thy firstborn; I have done according as thou badest me: arise, I pray thee, sit and eat of my venison, that thy soul may bless","20":"And Isaac said unto his son, How *is it* that thou hast found *it* so quickly, my son? And he said, Because the LORD thy God brought *it* to me.","21":"And Isaac said unto Jacob, Come near, I pray thee, that I may feel thee, my son, whether thou *be* my very son Esau","22":"And Jacob went near unto Isaac his father; and he felt him, and said, The voice *is* Jacob's voice, but the hands *are* the hands of Esau.","23":"And he discerned him not, because his hands were hairy, as his brother Esau's hands: so he blessed","24":"And he said, *Art* thou my very son Esau? And he said,","25":"And he said, Bring *it* near to me, and I will eat of my son's venison, that my soul may bless thee. And he brought *it* near to him, and he did eat: and he brought him wine, and he drank.","26":"And his father Isaac said unto him, Come near now, and kiss me, my son.","27":"And he came near, and kissed him: and he smelled the smell of his raiment, and blessed him, and said, See, the smell of my son *is* as the smell of a field which the LORD hath blessed:","28":"Therefore God give thee of the dew of heaven, and the fatness of the earth, and plenty of corn and wine:","29":"Let people serve thee, and nations bow down to thee: be lord over thy brethren, and let thy mother's sons bow down to thee: cursed *be* every one that curseth thee, and blessed *be* he that blesseth","30":"And it came to pass, as soon as Isaac had made an end of blessing Jacob, and Jacob was yet scarce gone out from the presence of Isaac his father, that Esau his brother came in from his hunting.","31":"And he also had made savoury meat, and brought it unto his father, and said unto his father, Let my father arise, and eat of his son's venison, that thy soul may bless","32":"And Isaac his father said unto him, Who *art* thou? And he said, I *am* thy son, thy firstborn Esau.","33":"And Isaac trembled very exceedingly, and said, Who? where *is* he that hath taken venison, and brought *it* me, and I have eaten of all before thou camest, and have blessed him? yea, *and* he shall be blessed.","34":"And when Esau heard the words of his father, he cried with a great and exceeding bitter cry, and said unto his father, Bless me, *even* me also, O my father.","35":"And he said, Thy brother came with subtilty, and hath taken away thy blessing.","36":"And he said, Is not he rightly named Jacob? for he hath supplanted me these two times: he took away my birthright; and, behold, now he hath taken away my blessing. And he said, Hast thou not reserved a blessing","37":"And Isaac answered and said unto Esau, Behold, I have made him thy lord, and all his brethren have I given to him for servants; and with corn and wine have I sustained him: and what shall I do now unto thee, my son?","38":"And Esau said unto his father, Hast thou but one blessing, my father? bless me, *even* me also, O my father. And Esau lifted up his voice, and wept.","39":"And Isaac his father answered and said unto him, Behold, thy dwelling shall be the fatness of the earth, and of the dew of heaven from above;","40":"And by thy sword shalt thou live, and shalt serve thy brother; and it shall come to pass when thou shalt have the dominion, that thou shalt break his yoke from off thy neck.","41":"And Esau hated Jacob because of the blessing wherewith his father blessed him: and Esau said in his heart, The days of mourning for my father are at hand; then will I slay my brother Jacob.","42":"And these words of Esau her elder son were told to Rebekah: and she sent and called Jacob her younger son, and said unto him, Behold, thy brother Esau, as touching thee, doth comfort himself, *purposing* to kill","43":"Now therefore, my son, obey my voice; and arise, flee thou to Laban my brother to Haran;","44":"And tarry with him a few days, until thy brother's fury turn away;","45":"Until thy brother's anger turn away from thee, and he forget *that* which thou hast done to him: then I will send, and fetch thee from thence: why should I be deprived also of you both in one day?","46":"And Rebekah said to Isaac, I am weary of my life because of the daughters of Heth: if Jacob take a wife of the daughters of Heth, such as these *which are* of the daughters of the land, what good shall my life"}},"tsk":{"1":[{"kopje":"donker","refs":["Gen 48:10","1 Sam 3:2","Pred 12:3","Joh 9:3"]},{"kopje":"oudste zoon","refs":["Gen 25:23-25"]}],"2":[{"kopje":"ik weet niet","refs":["Gen 48:21","1 Sam 20:3","Spr 27:1","Pred 9:10","Jes 38:1","Jes 38:3","Mark 13:35","Jak 4:14"]}],"3":[{"kopje":"neem toch","refs":["Gen 10:9","Gen 25:27","Gen 25:28"]},{"kopje":"neem toch","refs":["Gen 25:27","Gen 25:28","1 Kor 6:12"]}],"4":[{"kopje":"opdat mijn","refs":["Gen 27:7","Gen 27:23","Gen 27:25","Gen 27:27","Gen 14:19","Gen 24:60","Gen 28:3","Gen 48:9","Gen 48:15-20","Gen 49:28","Lev 9:22","Lev 9:23","Deut 33:1-29","Joz 14:13","Joz 22:6","Luk 2:34","Luk 24:51","Hebr 11:20"]}],"7":[{"kopje":"voor het aangezicht van de","refs":["Deut 33:1","Joz 6:26","1 Sam 24:20"]}],"9":[{"kopje":"twee","refs":["Richt 13:15","1 Sam 16:20"]},{"kopje":"smakelijke","refs":["Gen 27:4"]}],"11":[{"kopje":"harige man","refs":["Gen 25:25"]}],"12":[{"kopje":"betasten","refs":["Gen 27:22","Job 12:16","2 Kor 6:8"]},{"kopje":"een bedrieger","refs":["Gen 27:36","Gen 25:27","1 Tess 5:22"]},{"kopje":"zo zou ik","refs":["Gen 9:25","Deut 27:18","Jer 48:10","Mal 1:14"]}],"13":[{"kopje":"op mij","refs":["Gen 25:23","Gen 25:33","Gen 43:9","1 Sam 14:24-28","1 Sam 14:36-45","1 Sam 25:24","2 Sam 14:9","Matt 27:25"]}],"14":[{"kopje":"moeder","refs":["Gen 27:4","Gen 27:7","Gen 27:9","Gen 27:17","Gen 27:31","Gen 25:28","Ps 141:4","Spr 23:2","Spr 23:3","Luk 21:34"]}],"15":[{"kopje":"kostbare kleren","refs":[" 66\">near,</span> I pray thee, that I may <span class=\"wl wl-kjv\" data-code=\"H4184\">feel</span> thee, my <span class=\"wl wl-kjv\" data-code=\"H1121\">son,</span> whether thou be my <span class=\"wl wl-kjv\" data-code=\"H2088\">very</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> Esau","22":"And <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> went <span class=\"wl wl-kjv\" data-code=\"H5066\">near</span> unto <span class=\"wl wl-kjv\" data-code=\"H3327\">Isaac</span> his <span class=\"wl wl-kjv\" data-code=\"H1\">father;</span> and he <span class=\"wl wl-kjv\" data-code=\"H4959\">felt</span> him, and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> The <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> is <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob's</span> <span class=\"wl wl-kjv\" data-code=\"H6963\">voice,</span> but the <span class=\"wl wl-kjv\" data-code=\"H3027\">hands</span> are the <span class=\"wl wl-kjv\" data-code=\"H3027\">hands</span> of Esau.","23":"And he <span class=\"wl wl-kjv\" data-code=\"H5234\">discerned</span> him not, because his <span class=\"wl wl-kjv\" data-code=\"H3027\">hands</span> were <span class=\"wl wl-kjv\" data-code=\"H8163\">hairy,</span> as his <span class=\"wl wl-kjv\" data-code=\"H251\">brother</span> <span class=\"wl wl-kjv\" data-code=\"H6215\">Esau's</span> <span class=\"wl wl-kjv\" data-code=\"H3027\">hands:</span> so he blessed","24":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Art thou my very <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> <span class=\"wl wl-kjv\" data-code=\"H6215\">Esau?</span> And he said,","25":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Bring it <span class=\"wl wl-kjv\" data-code=\"H5066\">near</span> to me, and I will <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> of my <span class=\"wl wl-kjv\" data-code=\"H1121\">son's</span> <span class=\"wl wl-kjv\" data-code=\"H6718\">venison, chword":"enige dagen,","tekst":"Dat is, enigen tijd. Hebr. ene dagen. Alzo ook onder, Gen 29:20."},{"catchword":"hittige","tekst":"Het Hebr. woord betekent een heten en brandenden toorn, zoals deze toorn van Ezau was."}],"45":[{"catchword":"beiden","tekst":"Dat is, van u, indien u Ezau kwam te vermoorden, en van Ezau, indien hij om zijn moord door de overheid gestraft werd, of door enig rechtvaardig oordeel Gods omkwam, of, gelijk Kaïn, van Gods aangezicht verdreven werd."}],"46":[{"catchword":"vanwege","tekst":"Hebr. van, of, voor het aangezicht der dochteren Heths, versta, Ezaus vrouwen. Zie boven, Gen 26:34."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"And it came to pass when Isaac grown old [as some conjecture about 137 years now ] and his eyes became dim [not withstanding Gods wonderful providence who by this blindness or dim sightedness did not only exercise his servants Isaac but likewise brought it about that the right of primogeniture was conferred upon Jacob] that he could not see he called Esau his greatest son [that is the first born ] and said to him my son and he said lo here I am [see above chapter 22 on verse 1.]"}],"2":[{"catchword":null,"tekst":"and he said behold now I am grown old I do not know the day of my death [that is I have so small time to live left me that I know soon death may surprise me and must look for him every hour and moment.]"}],"3":[{"catchword":null,"tekst":"Now then take I pray thy instruments thy quiver of arrows [Heb. Pendant quiver r any kind of Bandelier] antsy bow and go to thy field and hunt me some venison [Heb. Hunt me a hunting take any kind of venison for me such as thou knowest I love to eat as below verse 5,7.]"}],"4":[{"catchword":null,"tekst":"And make or dress me savory meats or dishes [or some dainties ] so as I love the same and bring them to me eat that thy my soul [that is myself with full intent and purpose of mind ] may bless thee ere I die [understand this is not a common or ordinary blessing which parents are able to give their children in any occasion but of a most singular extraordinary and excellent solemn prophetical blessing drest and solemnized in a manner of a last will and testament declairing his son the heir apparent of al the spiritual and corporal promises made to him his father and so below chapter 8.1.]"}],"5":[{"catchword":null,"tekst":"Now Rebecca hearkened to it when Isaac spake to his son Esau and Esau went into the field for to hunt some venison that might bring it in."}],"6":[{"catchword":null,"tekst":"Then Rebecca spoke to her son Jacob saying behold I have heard thy father speak to Esau thy brother saying:"}],"7":[{"catchword":null,"tekst":"bring me some venison and dress me savory meats and dishes that I may eat and bless thee before the faceoff the LORD [that is to say with such a blessing as shall be pronounced in his name and as in his presence and confirmed by his guidance and direction ] before my death."}],"8":[{"catchword":null,"tekst":"Now then my son hear my voice [howbeit Rebecca makes use of means in this business which cannot wholly be excused nevertheless the matter itself that she endeavored to derive the right of the progeniture upon Jacob did agree with Gods will and declaration see above chapter25.23] in that which I command thee."}],"9":[{"catchword":null,"tekst":"Go to the stock now and fetch or bring [Heb. Take but the Hebrew word doth likewise here comprehend the signification to bring and both they together imply as much as to fetch see above chapter 12 on verse 15] me thence two good kids of the he goats [ that is two fat ones well liking and well fed compare below chapter 41.5] and I will make or dress them for savory meats to thy father such as he loves."}],"10":[{"catchword":null,"tekst":"And thou salt bring the same to thy father and he shall eat that he may bless thee before his death."}],"11":[{"catchword":null,"tekst":"Then said Jacob to Rebecca his mother behold my brother Esau is a hairy men [that is rough skinned] and I am a smooth man [that is soft skinned.]"}],"12":[{"catchword":null,"tekst":"Perhaps my father will feel me and I shall be a deceiver before his eyes [Heb. Seducer the particle as is sometimes used not for that which only seems so but which is so indeed see Nehemiah 7.2Jn 1:14 2Co 3:18] so should I bring a curse upon me and not a blessing [compare Deu 27:18.]"}],"13":[{"catchword":null,"tekst":"And his mother said to him the curse be upon me my son [Rebecca speaks thus confidently not out of any levity but as it seems out of an assured hope of a good issue arguing and concluding with herself not only from the clear oracle of God but likewise from the ungracious life and conversation of Esau that the right of primogeniture did not belong to him but to his brother Jacob] only hearken to my voice and go fetch them me [Heb. Take me that island bring them me to wit the two young he goats as I bad thee see above verse 9.]"}],"14":[{"catchword":null,"tekst":"Then he went and he fetched them and brought them to his mother made savory meats such as his father loved."}],"15":[{"catchword":null,"tekst":"then Rebecca took Esau her greatest sons precious garments [Heb. Desirable garments or garments of the desirableness that is such as are much desired and delighted in that is fair and costly ones ] which she had by her in the house [that which she kept and laid up in the well scented presses or wardrobes as appears by verse 27] and she put them upon Jacob her least son [this and the following action verse 16 which Rebecca made use of to compass her design indeed a kind of deceit but so much the less to be found fault with as her intent was thereby to help to reduce him into the right way to fulfill the way of God and to put Jacob in the possession of which Gods intimated decree belonged unto him.]"}],"16":[{"catchword":null,"tekst":"And the skins of the kids of the he-goat she put on his hands and upon the smoothness of his neck."}],"17":[{"catchword":null,"tekst":"And she gave the savory meats and the bread which she had prepared into the hand of Jacob her son."}],"18":[{"catchword":null,"tekst":"And he came to is father and said my father and he said Lo here I am who art thou my son?"}],"19":[{"catchword":null,"tekst":"And Jacob said I am Esau the first born [it is indeed commendable to Jacob that he did highly esteem and earnestly long for high primogeniture but the way he goeth deserves no praise making use of untruth the former was in from God through faith in his promises that the latter was from himself through frailty of human corruption] I have done as thou hast spoken to me get thee up sit and eat for my venison that thy soul may bless me [see above verse 4]"}],"22":[{"catchword":null,"tekst":"Then Jacob came nigh to his father Isaac who felt and said the voice is Jacobs voice [that is as rough if they were Esau&acirc;&euro;&trade;s hands as it is declared verse 23 hereby it appears that Isaac began to doubt whether this carriage was right nevertheless God purpose proceeded.]"}],"23":[{"catchword":null,"tekst":"Yet he knew him not [notably by a wonderful direction of the providence of God who besides the blindness of his eyes suffers such a dullness of mind to surprise him in this particular that he proceeds to the blessings although he knew the voice of Jacob and was doubtful still as appears by the next verse] because his hands were hairy as his brother Esau&acirc;&euro;&trade;s hands and he blessed him."}],"24":[{"catchword":null,"tekst":"And he said art thou my son Esau himself? And he said I am."}],"25":[{"catchword":null,"tekst":"Then said he put it near me that I may eat of the venison of my son [to wit of that which thou hast taken and drest for me] that my soul may bless the and he put it near him and he did eat he brought him wine also and he drank."}],"26":[{"catchword":null,"tekst":"And his father Isaac said unto him come near I pray and kiss me my son [the kiss was used for the old in such solemn benediction as a pledge of honor and affection see below chapter 48 verse 10.]"}],"27":[{"catchword":null,"tekst":"And he came near and he kissed him then he smelt the smell of his garments [whereby he was the more persuaded that Jacob was his son Esau as if the same he said my apparel doth smell of the stables and cattle but of the fields and wood of pleasure ] and bless him and he said behold the smell of my son [that is the smell of my sons garments ] is like the smell of the fields which the Lord hath blessed [which smell is chiefly caused by the temperateness of the air the goodness of the soil and the precious abundance of all manner of growing things. The meaning is , that like as a pleasant smell of the field is a token of its goodly situation precious fruits and rich abundance so the smell of my sons garments is a token unto me of his and his posterities future blessedness which shall more then deserve to be compared to such goodly field.]"}],"28":[{"catchword":null,"tekst":"Thus then God gives unto thee [this is not to be understood as a wish only that it may be so but as a prophecy that it should be fulfilled thus according to the letter indeed not so much in Jacobs person as in his posterity nevertheless the spiritual benefits typified thereby were common to him with all the true believers ] of the dew of heaven [under the name of the dew which was very necessary to the land of Canaan to supply the scarcity o frail he comprehends all manner of blessing conveyed and bestowed upon the earth by means of the air and the heavens compare Deuteronomy 33 verse 13,14] and the fastness of the earth [that is abundance of god and precious things produced out of good and fruitful soil compare Deu 8:8 and 32.13,14 and 33.24] and the abundance of wheat and must."}],"29":[{"catchword":null,"tekst":"People popular shall serve thee and the nations shall bow down before thee[this wish or blessing was especially fulfilled in the times of David Solomon and king of Judah unto Jorum see above chapter 25 on verse 23] be thou LORD over thy brethren and thy mothers sons shall bow down before thee [according to the right of primogeniture see above chapter 25 on verse 31] cursed must he be who so curseth thee and he who so blesseth thee must he be blessed [see above chapter 12 on verse 3.]"}],"30":[{"catchword":null,"tekst":"And it happened when Isaac had finished blessing Jacob it happened then Jacob was just gone forth from his father Isaacs face [Heb. Going forth was gone forth ] that Esau came from his hunting."}],"31":[{"catchword":null,"tekst":"He now likewise make drest savory meats and brought them to his father and he said to his father let my father arise and eat of the venison of his son that thy soul may bless me."}],"32":[{"catchword":null,"tekst":"And Isaac his father said to him who art thou? And he said I am thy son the first born Esau."}],"33":[{"catchword":null,"tekst":"Then Isaac was astonished with very great astonishment exceedingly [the Hebrew word doth signify a very great fright and terror accompanied with shaking and trembling as below chapter 4.8] Exo 19:16,18 this terror God suffered to seize upon him from being angry with Jacob and partly to make him consider that the issue and success of the blessing renounced was a thing proceeding from Gods decree and his everlasting purpose see above chapter 25.23] then said who is he then that hunted the venison and broth it to me ? And I have eaten of all before thou comest and have blessed him also he shall be blessed."}],"34":[{"catchword":null,"tekst":"When Esau heard the words of his father he cried out with a great and bitter cry exceedingly and he said to his father bless me also my father [others I am likewise my father or I am likewise thy son my father so verse 38.]"}],"35":[{"catchword":null,"tekst":"And he said thy brother is come with deceit [Isaac indeed called Jacobs action deceit as indeed it was but now he understood plainly that himself had been the cause of it by his foregoing advertency as the same appears by his ratifying an firmly adhering to what bring deceived thus he had done upon it see above verse 23] and hath taken thy blessing away [that is which by nature appertained to thee and I was fully resolved to have bestowed upon thee.]"}],"36":[{"catchword":null,"tekst":"Then thou said it is not because they call his name Jacob that he hath deceived me twice now? [wherefore he was called Jacob that is to be seen above chapter 25 verse 26 to wit because he laid hold on his brothers heels at his birth but Esau interprets this name as if he had trip up his heels that is had coarsened and cheated him which signification the Hebrew word may bear well enough see Jer 17:9] my first birth he hath taken away [this is false for he has freely accord sold the same unto him see above chapter 25.32,33] and behold now he hath taken away my blessings [the blessing belonged to the right primogeniture but he having sold the same the blessing did not appertain unto him ] moreover he said hast thou then kept no blessing for?"}],"37":[{"catchword":null,"tekst":"Then Isaac answered and said unto Esau behold I set him to be the Lord over thee an doll his brethren [that is all the progeny and posterity of Esau] have I given him for servants and I have supported him with corn and must [that is I have so furnished and provided for him that he shall have enough not only to supply the common wants and necessities but likewise to cheer and comfort himself abundantly] what shall I now do unto thee my son?"}],"38":[{"catchword":null,"tekst":"And Esau said to his father hast thou but third one blessing my father? [understand by this one blessing the chief and principal whereby now Jacob was now declared heir of the divine covenant an of the land of Canaan ] bless me also my father and Esau lifted up his voice and wept."}],"39":[{"catchword":null,"tekst":"Then his father Isaac answered and said unto him behold the fatnesses of the earth shall be thy habitation and of the dew of heaven shalt thou be blessed above."}],"40":[{"catchword":null,"tekst":"And thou shalt live upon thy sword [that is thou shalt be put upon to it to maintain the people country and substance by force of arms and by reason thereof live a troublesome life in the midst of many wards] and shalt serve thy brother [see above chapter 25 on verse 23] nevertheless it shalt come to pass when it shalt bear sway then shalt withdraw his yoke from thy neck [see 2Sa 8:14 and the fulfilling hereof 2 Kings 8.20, 22.]"}],"41":[{"catchword":null,"tekst":"And Esau hated Jacob for that blessing wherewith his father had blessed him [this hatred descended as by inheritance upon the children and posterity see Eze 35:5 Amos 1.11 Obadiah verse 10] and Esau said in his heart [that is by himself howbeit he not only thought so but either by words or gestures made it sufficiently known afterwards so that it cam to his mothers ears appears verse 42.] the days of my fathers mourning draw near and I will kill my brother Jacob."}],"42":[{"catchword":null,"tekst":"When Rebecca was made acquainted with these words of Esau her greatest son she sent and called Jacob her least son and said to him behold thy brother Esau comforts himself over thee that he shall kill thee [Rebecca reveals unto her son Jacob what she had understood of Esau&acirc;&euro;&trade;s design for to encourage him thereby to undertake his journey she had thought on as a means of his safety.]"}],"43":[{"catchword":null,"tekst":"Now then my son hearken my voice and get thee up flee [or flee thee or for thee see above chapter 12 on verse 1] to Haran [see above chapter 11 on verse 31] unto my brother Alban."}],"44":[{"catchword":null,"tekst":"And tarry with him for some days [that is for a while or certain time Heb. Had the plural this dies unos and so below likewise chapter 29.20] until the servant wrath [the Heb. Word doth signify a hot burning wrath such as this of Esaus was] of thy brotherbrothers turn."}],"45":[{"catchword":null,"tekst":"Until the wrath of thy brother turn away from thee, and he shall have forgotten that which thou didst to him then I will send and take thee thence why should I be bereaved of you both in one day? [That is of thee if Esau should chance to kill thee and of Esau if for his murder should be put to death by the magistrate or otherwise destroyed by a just judgment of God upon him or should be driven away from the presence of God like Cain.]"}],"46":[{"catchword":null,"tekst":"And Rebecca said to Isaac I am vexed to live or in my life because of the daughters of Heth [Heb. From or before the face of &c. understand Esau&acirc;&euro;&trade;s wife of daughters of Heth such as these are of the daughters of this land what shall I live for?"}]}}};

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}

    data.weergaven.map(w => {

function bijbeluitlegHtml(n) {

      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +

}
function renderPaneel(n) {

function toggle(n) {

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen

      detail.innerHTML = '<em>Laden…</em>';

        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {

      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;

    }

});

  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
