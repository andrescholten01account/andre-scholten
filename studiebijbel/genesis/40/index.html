ven voort.", "11": "En Farao's beker was in mijn hand; en ik nam die druiven, en perste ze uit in Farao's beker, en ik gaf de beker in Farao's hand.", "12": "Toen zei Jozef tegen hem: Dit is de uitleg ervan: de drie ranken zijn drie dagen.", "13": "Binnen nog drie dagen zal Farao uw hoofd verheffen, en zal u in uw positie herstellen; en u zult Farao's beker in zijn hand geven, op de vorige wijze, toen u zijn schenker was.", "14": "Maar denk aan mij, wanneer het u goed gaat, en bewijs mij toch weldadigheid, en maak melding van mij bij Farao, en zorg dat ik uit dit huis kom.", "15": "Want ik ben als dief weggehaald uit het land van de Hebreeën; en ook heb ik hier niets gedaan, dat zij mij in deze kuil gezet hebben.", "16": "Toen de leider van de bakkers zag dat hij een goede uitleg had gegeven, zei hij tegen Jozef: Ik had ook een droom, en zie, drie getraliede korven waren op mijn hoofd.", "17": "En in de bovenste korf was van al het voedsel van Farao, gebakken werk; en het gevogelte at dat op uit de korf, van boven mijn hoofd.", "18": "Toen antwoordde Jozef, en zei: Dit is de uitleg ervan: de drie korven zijn drie dagen.", "19": "Binnen nog drie dagen zal Farao uw hoofd van u verheffen, en hij zal u aan een paal hangen, en het gevogelte zal uw vlees van u eten.", "20": "En het gebeurde op de derde dag, de dag van Farao's geboorte, dat hij voor al zijn dienaren een maaltijd maakte; en hij verhief het hoofd van de leider van de schenkers, en het hoofd van de leider van de bakkers, te midden van zijn dienaren.", "21": "En hij liet de leider van de schenkers terugkeren tot zijn schenkambt, zodat hij de beker in Farao's hand gaf.", "22": "Maar de leider van de bakkers hing hij op, zoals Jozef hun had uitgelegd.", "23": "Doch de leider van de schenkers dacht niet aan Jozef, maar vergat hem."}, "SV": {"1": "En het geschiedde na deze dingen, dat de schenker des konings van Egypte, en de bakker, zondigden tegen hun heer, tegen den koning van Egypte.", "2": "Zodat Farao zeer toornig werd op zijn twee hovelingen, op den overste der schenkers, en op den overste der bakkers.", "3": "En hij leverde hen in bewaring, ten huize van den overste der trawanten, in het gevangenhuis, ter plaatse, waar Jozef gevangen was.", "4": "En de overste der trawanten bestelde Jozef bij hen, dat hij hen diende; en zij waren *sommige* dagen in bewaring.", "5": "Zij droomden nu beiden een droom, elk zijn droom, in een nacht, elk naar de uitlegging zijns drooms, de schenker en de bakker, die des konings van Egypte waren, die gevangen waren in het gevangenhuis.", "6": "En Jozef kwam des morgens tot hen, en hij zag hen aan, en ziet, zij waren ontsteld.", "7": "Toen vraagde hij de hovelingen van Farao, die bij hem waren in hechtenis van het huis zijns heren, zeggende: Waarom zijn uw aangezichten heden kwalijk gesteld?", "8": "En zij zeiden tot hem: Wij hebben een droom gedroomd, en er is niemand, die hem uitlegge. En Jozef zeide tot hen: Zijn de uitleggingen niet van God? Vertelt *ze* mij toch.", "9": "Toen vertelde de overste der schenkers Jozef zijn droom, en zeide tot hem: In mijn droom, zie, zo was een wijnstok voor mijn aangezicht;", "10": "En aan den wijnstok waren drie ranken; en hij was als bottende, zijn bloeisel ging op, zijn trossen brachten rijpe druiven voort.", "11": "En Farao’s beker was in mijn hand; en ik nam die druiven, en drukte ze uit in Farao’s beker, en ik gaf den beker op Farao’s hand.", "12": "Toen zeide Jozef tot hem: Dit is zijn uitlegging: de drie ranken zijn drie dagen.", "13": "Binnen nog drie dagen zal Farao uw hoofd verheffen, en zal u in uw staat herstellen; en gij zult Farao’s beker in zijn hand geven, naar de vorige wijze, toen gij zijn schenker waart.", "14": "Doch gedenk mijner bij uzelven, wanneer het u wel gaan zal, en doe toch weldadigheid aan mij, en doe van mij melding bij Farao, en maak, dat ik uit dit huis kome.", "15": "Want ik ben diefelijk ontstolen uit het land der Hebreën; en ook heb ik hier niets gedaan, dat zij mij in dezen kuil gezet hebben.", "16": "Toen de overste der bakkers zag, dat hij een goede uitlegging gedaan had, zo zeide hij tot Jozef: Ik was ook in mijn droom, en zie, drie getraliede korven waren op mijn hoofd.", "17": "En in den oppersten korf was van alle spijze van Farao, die bakkerswerk is; en het gevogelte at dezelve uit den korf, van boven mijn hoofd.", "18": "Toen antwoordde Jozef, en zeide: Dit is zijn uitlegging: de drie korven zijn drie dagen.", "19": "Binnen nog drie dagen zal Farao uw hoofd verheffen van boven u, en hij zal u aan een hout hangen, en het gevogelte zal uw vlees van boven u eten.", "20": "En het geschiedde op den derden dag, den dag van Farao’s geboorte, dat hij voor al zijn knechten een maaltijd maakte; en hij verhief het hoofd van den overste der schenkers, en het hoofd van den overste der bakkers, in het midden zijner knechten.", "21": "En hij deed den overste der schenkers wederkeren tot zijn schenkambt, zodat hij den beker op Farao’s hand gaf.", "22": "Maar den overste der bakkers hing hij op; gelijk Jozef hun uitgelegd had.", "23": "Doch de overste der schenkers gedacht aan Jozef niet, maar vergat hem."}, "KJV": {"1": "And it came to pass after these things, *that* the butler of the king of Egypt and *his* baker had offended their lord the king of Egypt.", "2": "And Pharaoh was wroth against two *of* his officers, against the chief of the butlers, and against the chief of the bakers.", "3": "And he put them in ward in the house of the captain of the guard, into the prison, the place where Joseph *was* bound.", "4": "And the captain of the guard charged Joseph with them, and he served them: and they continued a season in ward.", "5": "And they dreamed a dream both of them, each man his dream in one night, each man according to the interpretation of his dream, the butler and the baker of the king of Egypt, which *were* bound in the prison.", "6": "And Joseph came in unto them in the morning, and looked upon them, and, behold, they *were* sad.", "7": "And he asked Pharaoh's officers that *were* with him in the ward of his lord's house, saying, Wherefore look ye *so* sadly to day?", "8": "And they said unto him, We have dreamed a dream, and *there is* no interpreter of it. And Joseph said unto them, *Do* not interpretations *belong* to God? tell me", "9": "And the chief butler told his dream to Joseph, and said to him, In my dream, behold, a vine *was* before me;", "10": "And in the vine *were* three branches: and it *was* as though it budded, *and* her blossoms shot forth; and the clusters thereof brought forth ripe grapes:", "11": "And Pharaoh's cup *was* in my hand: and I took the grapes, and pressed them into Pharaoh's cup, and I gave the cup into Pharaoh's hand.", "12": "And Joseph said unto him, This *is* the interpretation of it: The three branches *are* three days:", "13": "Yet within three days shall Pharaoh lift up thine head, and restore thee unto thy place: and thou shalt deliver Pharaoh's cup into his hand, after the former manner when thou wast his butler.", "14": "But think on me when it shall be well with thee, and shew kindness, I pray thee, unto me, and make mention of me unto Pharaoh, and bring me out of this house:", "15": "For indeed I was stolen away out of the land of the Hebrews: and here also have I done nothing that they should put me into the dungeon.", "16": "When the chief baker saw that the interpretation was good, he said unto Joseph, I also *was* in my dream, and, behold, *I had* three white baskets on my head:", "17": "And in the uppermost basket *there was* of all manner of bakemeats for Pharaoh; and the birds did eat them out of the basket upon my head.", "18": "And Joseph answered and said, This *is* the interpretation thereof: The three baskets *are* three days:", "19": "Yet within three days shall Pharaoh lift up thy head from off thee, and shall hang thee on a tree; and the birds shall eat thy flesh", "20": "And it came to pass the third day, *which was* Pharaoh's birthday, that he made a feast unto all his servants: and he lifted up the head of the chief butler and of the chief baker among his servants.", "21": "And he restored the chief butler unto his butlership again; and he gave the cup into Pharaoh's hand:", "22": "But he hanged the chief baker: as Joseph had interpreted", "23": "Yet did not the chief butler remember Joseph, but forgat"}}, "tsk": {"1": [{"kopje": "het gebeurde", "refs": ["Gen 39:20-23", "Est 6:1"]}, {"kopje": "de schenker", "refs": ["Gen 40:13", "Neh 1:11", "Neh 2:1", "Neh 2:2"]}], "2": [{"kopje": "toornig", "refs": ["Ps 76:11", "Spr 16:14", "Spr 19:12", "Spr 19:19", "Spr 27:4", "Hand 12:20"]}, {"kopje": "de leider van de schenkers", "refs": ["1 Kron 27:27"]}], "3": [{"kopje": "ter plaatse", "refs": ["Gen 39:20", "Gen 39:23"]}, {"kopje": "waar Jozef gevangen zat", "refs": ["Gen 39:20"]}], "4": [{"kopje": "de leider", "refs": ["Gen 37:36", "Gen 39:1", "Gen 39:21-23", "Ps 37:5"]}, {"kopje": "enige dagen", "refs": ["Gen 4:3", "Gen 24:55", "Gen 40:20"]}], "6": [{"kopje": "zie", "refs": ["Gen 40:8", "Gen 41:8", "Dan 2:1-3", "Dan 4:5", "Dan 5:6", "Dan 7:28", "Dan 8:27"]}], "7": [{"kopje": "Waarom", "refs": ["Richt 18:24", "1 Sam 1:8", "2 Sam 13:4", "Neh 2:2", "Luk 24:17"]}], "8": [{"kopje": "Vertel ze mij toch", "refs": ["Gen 41:15", "Gen 41:16", "Job 33:15", "Job 33:16", "Ps 25:14", "Jes 8:19", "Dan 2:11", "Dan 2:28", "Dan 2:47", "Dan 4:8", "Dan 5:11-15", "1 Kor 12:10", "1 Kor 12:11", "Amos 3:7"]}], "9": [{"kopje": "een wijnstok", "refs": ["Gen 37:5-10", "Richt 7:13-15", "Dan 2:31", "Dan 4:8", "Dan 4:10-18"]}], "11": [{"kopje": "perste", "refs": ["Gen 49:11", "Lev 10:9", "Spr 3:10"]}, {"kopje": "hand", "refs": ["Gen 40:21", "1 Kon 10:5", "2 Kron 9:4", "Neh 1:11", "Neh 2:1"]}], "12": [{"kopje": "Dit", "refs": ["Gen 40:18", "Gen 41:12", "Gen 41:25", "Gen 41:26", "Richt 7:14", "Dan 2:36-45", "Dan 4:19-33"]}, {"kopje": "de drie ranken", "refs": ["Gen 41:26", "Richt 7:14", "Matt 26:26", "1 Kor 10:4", "Gal 4: 0.23#i9965", "refs": [{"disp": "Gen 40:23", "href": "../../genesis/40/#v23", "ref": "Gen 40:23", "svLabel": null}], "kinderen": []}]}]}]}}, "extern": {"Ps 59:5": "Zij lopen en maken zich klaar zonder dat ik iets misdaan heb; word wakker mij tegemoet, en zie.", "Ezech 11:5": "Toen viel de Geest van de HEERE op mij, en Hij zei tegen mij: Zeg: Zo zegt de HEERE: Zo hebt u gezegd, huis van Israël! Want Ik weet elk van de dingen die in uw geest opkomen.", "Jona 1:1": "Het woord van de HEERE gebeurde tot Jona, de zoon van Amitthai, en Hij zei:", "Num 23:5": "Toen legde de HEERE het woord in de mond van Bileam, en zei: Keer terug naar Balak, en spreek zo.", "Est 1:3": "in het derde jaar van zijn regering, dat hij een maaltijd gaf voor al zijn vorsten en zijn knechten; de machthebbers van Perzië en Medië, de grootste heren en de leiders van de landschappen waren voor hem aanwezig.", "Richt 11:29": "Toen kwam de Geest van de HEERE op Jeftha, zodat hij Gilead en Manasse doortrok; want hij trok door tot Mizpa in Gilead, en van Mizpa in Gilead trok hij door naar de kinderen van Ammon.", "Num 16:29": "Als dezen sterven zoals alle mensen sterven, en over hen een straf voltrokken wordt zoals over alle mensen, dan heeft de HEERE mij niet gezonden.", "Gen 24:55": "Toen zeiden haar broer en haar moeder: Laat het meisje nog enkele dagen, of tien, bij ons blijven; daarna zult u gaan.", "Num 16:28": "Toen zei Mozes: Hieraan zult u herkennen dat de HEERE mij gezonden heeft om al deze daden te doen, dat ze niet uit mijn eigen hart komen.", "Jes 8:11": "Want zo heeft de HEERE tegen mij gezegd, met een sterke hand, en Hij onderwees mij om niet te wandelen op de weg van dit volk, en zei:", "Matt 18:23-25": "Daarom wordt het Koninkrijk der hemelen vergeleken met een zekere koning die met zijn dienstknechten rekening wilde houden. Toen hij nu begon te rekenen, werd er iemand bij hem gebracht die hem tienduizend talenten schuldig was. En omdat hij niet had waarmee hij kon betalen, beval zijn heer dat men hem zou verkopen, en zijn vrouw en kinderen, en alles wat hij had, en dat de schuld zo betaald zou worden.", "1 Kor 12:7-11": "Maar aan ieder wordt de openbaring van de Geest gegeven tot wat nuttig is. Want aan de een wordt door de Geest het woord van wijsheid gegeven, en aan een ander het woord van kennis, door dezelfde Geest; en aan een ander het geloof, door dezelfde Geest; en aan een ander de gaven van gezondmaking, door dezelfde Geest.", "Ezech 2:4": "En deze kinderen zijn hard van gezicht, en stijf van hart; Ik zend u tot hen, en u zult tegen hen zeggen: Zo zegt de Heere HEERE!", "Ezech 3:16": "Het gebeurde nu aan het einde van zeven dagen, dat het woord van de HEERE tot mij kwam, en zei:", "Luk 1:41": "En het gebeurde, toen Elizabet de groet van Maria hoorde, dat het kindje opsprong in haar buik; en Elizabet werd vervuld met de Heilige Geest;", "Gen 41:25-32": "Toen zei Jozef tot Farao: De droom van Farao is één; wat God gaat doen, heeft Hij Farao bekendgemaakt. Die zeven mooie koeien zijn zeven jaren; die zeven mooie aren zijn ook zeven jaren; de droom is één. En die zeven schrale en lelijke koeien, die daarna opkwamen, zijn zeven jaren; en die zeven lege, door de oostenwind verzengde aren zullen zeven jaren van honger zijn.", "2 Sam 7:3-7": "En Nathan zei tegen de koning: Ga heen, doe alles wat in uw hart is, want de HEERE is met u. Maar het gebeurde in diezelfde nacht, dat het woord van de HEERE tot Nathan kwam, en Hij zei: Ga, en zeg tegen Mijn knecht, tegen David: Zo zegt de HEERE: Zou u Mij een huis bouwen om in te wonen?", "Ex 3:14": "En God zei tegen Mozes: IK ZAL ZIJN, DIE IK ZIJN ZAL! Ook zei Hij: Zo zult u tegen de kinderen van Israël zeggen: IK ZAL ZIJN heeft mij tot u gezonden!", "Jer 40:12": "keerden alle Joden terug uit alle plaatsen waarheen zij verdreven waren, en kwamen in het land van Juda tot Gedalia te Mizpa; en zij verzamelden zeer veel wijn en zomervruchten.", "Lev 10:9": "Wijn en sterke drank mag u niet drinken, u, en ook uw zonen niet, als u de tent van de samenkomst ingaat, zodat u niet sterft; het is een eeuwige inzetting onder uw generaties;", "Lev 1:1": "En de HEERE riep Mozes, en sprak tot hem uit de tent van de samenkomst, en zei:", "Jer 33:1": "Verder kwam het woord van de HEERE voor de tweede keer tot Jeremia, toen hij nog opgesloten was in het voorhof van de bewaring, en Hij zei:", "2 Kon 10:7": "Het gebeurde dan, toen die brief tot hen kwam, dat zij de zonen van de koning namen, en zeventig mannen slachtten; en zij legden hun hoofden in korven, die zij tot hem zonden naar Jizreël.", "Ex 33:11": "En de HEERE sprak tot Mozes van aangezicht tot aangezicht, zoals een man met zijn vriend spreekt; daarna keerde hij terug naar het kamp; maar zijn dienaar Jozua, de zoon van Nun, de jongeman, week niet uit het midden van de tent.", "1 Sam 10:7": "En het zal gebeuren, als deze tekenen u overkomen, doe dan wat uw hand vindt te doen, want God zal met u zijn.", "Ezech 43:5": "En de Geest nam mij op, en bracht mij in het binnenste voorhof; en zie, de heerlijkheid van de HEERE had het huis vervuld.", "Jona 3:1": "En het woord van de HEERE gebeurde voor de tweede keer tot Jona, en zei:", "1 Sam 3:20": "En heel Israël, van Dan tot Berseba toe, wist dat Samuël bevestigd was tot een profeet van de HEERE.", "Gen 15:11": "En het wilde gevogelte kwam neer op het aas; maar Abram joeg het weg.", "Hand 20:27": "Want ik heb niet nagelaten u heel de raad van God te verkondigen.", "Num 12:6-8": "En Hij zei: Hoor nu Mijn woorden! Als er een profeet onder u is, zal Ik, de HEERE, Mij door een gezicht aan hem bekendmaken, door een droom zal Ik met hem spreken. Zo is Mijn knecht Mozes niet, die in heel Mijn huis trouw is. Van mond tot mond spreek Ik met hem, en duidelijk zichtbaar, en niet door duistere woorden; en de gestalte van de HEERE aanschouwt hij; waarom hebt u er dan niet voor gevreesd om tegen Mijn knecht, tegen Mozes, te spreken?", "Num 11:25": "Toen kwam de HEERE neer in de wolk, en sprak tot hem, en Hij nam van de Geest die op hem was, en legde die op de zeventig mannen, de oudsten; en het gebeurde, toen de Geest op hen rustte, dat zij profeteerden, maar daarna niet meer.", "Gen 41:16": "En Jozef antwoordde Farao: Het is niet aan mij! God zal Farao welzijn aanzeggen.", "Joz 2:12": "Nu dan, zweer mij toch bij de HEERE, omdat ik goedheid aan u bewezen heb, dat u ook goedheid zult bewijzen aan het huis van mijn vader, en geef mij een betrouwbaar teken,", "Luk 3:2": "onder de hogepriesters Annas en Kajafas, kwam het woord van God tot Johannes, de zoon van Zacharias, in de woestijn.", "2 Kon 6:32": "(Elisa nu zat in zijn huis, en de oudsten zaten bij hem.) En hij zond een man voor zijn aangezicht; maar voordat de bode bij hem gekomen was, had hij tegen de oudsten gezegd: Hebt u gezien hoe deze zoon van een moordenaar gezonden heeft om mijn hoofd af te nemen? Let op, wanneer die bode komt, sluit de deur toe, en houd hem tegen bij de deur; is niet het geluid van de voeten van zijn heer achter hem?", "Deut 5:4-6": "Van aangezicht tot aangezicht heeft de HEERE met u op de berg gesproken uit het midden van het vuur, (ik stond in die tijd tussen de HEERE en tussen u, om u het woord van de HEERE bekend te maken; want u was bang voor het vuur en klom niet op de berg) en Hij zei: Ik ben de HEERE, uw God, Die u uit Egypteland, uit het diensthuis, uitgeleid heb.", "Jer 34:1": "Het woord dat tot Jeremia gebeurde van de HEERE, toen Nebukadnezar, koning van Babel, en zijn hele leger, en alle koninkrijken van de aarde die onder de heerschappij van zijn hand waren, en alle volken tegen Jeruzalem streden, en tegen al haar steden, en zei:", "Gen 12:14": "En het gebeurde, toen Abram in Egypte kwam, dat de Egyptenaren deze vrouw zagen, dat zij zeer knap was.", "Ezech 3:14": "Toen hief de Geest mij op, en nam mij weg, en ik ging heen, bitter bedroefd door de hitte van mijn geest; maar de hand van de HEERE was sterk op mij.", "Richt 18:24": "Toen zei hij: U hebt mijn goden die ik gemaakt had weggenomen, alsook de priester, en bent weggegaan; wat heb ik nu nog? Wat is dit dan, dat u tegen mij zegt: Wat is er met u?", "Fil 3:5": "Besneden op de achtste dag, uit het geslacht van Israël, van de stam van Benjamin, een Hebreeër uit de Hebreeën, wat de wet betreft een Farizeeër;", "Dan 2:11": "Want de zaak die de koning vraagt is te zwaar, en er is niemand anders die dat voor de koning bekend kan maken, dan de goden, wier woning niet bij het vlees is.", "Neh 2:2": "Zo zei de koning tegen mij: Waarom is uw gezicht treurig, terwijl u toch niet ziek bent? Dit is niets anders dan treurigheid van het hart. Toen werd ik erg bevreesd,", "Gen 39:1": "Jozef werd naar Egypte afgevoerd; en Potifar, een hoveling van de farao, een aanvoerder van de lijfwacht, een Egyptisch man, kocht hem van de Ismaëlieten, die hem daarheen afgevoerd hadden.", "Jer 7:1": "Het woord dat tot Jeremia gebeurd is, van de HEERE, en Hij zei:", "Micha 3:8": "Maar waarlijk, ik ben vol van de kracht van de Geest van de HEERE; en vol van gericht en dapperheid, om Jakob zijn overtreding te verkondigen, en Israël zijn zonde.", "Ex 29:3": "En u zult ze in een korf leggen, en zult ze in de korf brengen, met de stier en de twee rammen.", "Jona 1:9": "En hij zei tegen hen: Ik ben een Hebreeër; en ik vrees de HEERE, de God van de hemel, Die de zee en het droge gemaakt heeft.", "1 Kron 12:18": "En de Geest bekleedde Amasai, de leider van de aanvoerders, en hij zei: Wij zijn van u, o David, en met u zijn wij, zoon van Isaï. Vrede, vrede zij u, en vrede uw helpers; want uw God helpt u. Toen nam David hen aan, en stelde hen tot aanvoerders van de benden.", "Ezech 1:20": "Waarheen de geest wilde gaan, gingen zij, waarheen de geest wilde gaan; en de raderen werden tegenover hen opgeheven; want de geest van de levende wezens was in de raderen.", "Hand 6:1": "In diezelfde dagen, toen het aantal discipelen groeide, ontstond er gemor van de Griekssprekenden tegen de Hebreeën, omdat hun weduwen bij de dagelijkse verzorging over het hoofd werden gezien.", "Ezech 1:3": "Kwam het woord van de HEERE uitdrukkelijk tot Ezechiël, de zoon van Buzi, de priester, in het land van de Chaldeeën, bij de rivier Chebar; en de hand van de HEERE was daar op hem.", "Jes 8:19": "Wanneer zij dan tegen u zeggen zullen: Vraag waarzeggers en duivelskunstenaars, die daar piepen en binnensmonds mompelen; zo zeg: Zal een volk niet zijn God vragen? Zal men voor de levenden de doden vragen?", "Dan 1:17": "Aan deze vier jongemannen nu gaf God kennis en verstand in alle boeken, en wijsheid; maar Daniël gaf Hij inzicht in allerlei visioenen en dromen.", "Num 22:38": "Toen zei Bileam tegen Balak: Zie, ik ben tot u gekomen; kan ik nu wel iets zeggen? Het woord dat God in mijn mond leggen zal, dat zal ik spreken.", "Spr 30:17": "Het oog dat de vader bespot, of de gehoorzaamheid aan de moeder veracht, dat zullen de raven van de beek uitpikken, en de jongen van de arend zullen het eten.", "Richt 14:19": "Toen kwam de Geest van de HEERE machtig over hem, en hij ging af naar de Askelonieten, en sloeg van hen dertig man; en hij nam hun kleren, en gaf de stellen (extra) kleren aan hen die het raadsel verklaard hadden. Maar zijn toorn ontstak, en hij ging naar het huis van zijn vader.", "Ezech 37:1": "De hand van de HEERE was op mij, en de HEERE voerde mij uit in de geest, en zette mij neer in het midden van een vallei; die was nu vol beenderen.", "Deut 34:9-11": "Jozua nu, de zoon van Nun, was vol van de Geest van wijsheid; want Mozes had zijn handen op hem gelegd; zo luisterden de kinderen van Israël naar hem, en deden zoals de HEERE Mozes geboden had. En er stond in Israël geen profeet meer op zoals Mozes, die de HEERE gekend had, van aangezicht tot aangezicht, In al de tekenen en de wonderen, waartoe de HEERE hem gezonden had, om die te doen in het land Egypte aan farao, en aan al zijn knechten, en aan heel zijn land;", "Spr 19:19": "Die groot is van grimmigheid, zal straf dragen; want als u hem redt, zult u het nog moeten herhalen.", "Dan 2:3": "En de koning zei tegen hen: Ik heb een droom gedroomd, en mijn geest is onrustig om die droom te weten.", "Ezech 3:10-12": "Verder zei Hij tot mij: Mensenkind, vat al Mijn woorden, die Ik tot u spreken zal, in uw hart, en hoor ze met uw oren. En ga heen, kom tot de weggevoerden, tot de kinderen van uw volk, en spreek tot hen, en zeg tot hen: Zo zegt de Heere HEERE, hetzij dat zij horen zullen, of hetzij dat zij het laten zullen. Toen nam de Geest mij op, en ik hoorde achter mij een stem van een groot ruisen, en zei: Geloofd zij de heerlijkheid van de HEERE uit Zijn plaats!", "Ps 59:4": "Want zie, zij leggen mijn ziel lagen; sterken rotten samen tegen mij; zonder mijn overtreding en zonder mijn zonde, o HEERE!", "Zach 7:12": "En zij maakten hun hart als een diamant, zodat zij niet hoorden de wet en de woorden die de HEERE van de heerscharen zond door Zijn Geest, door de dienst van de vorige profeten, waardoor een grote toorn is ontstaan van de HEERE van de heerscharen.", "Joz 8:29": "En de koning van Ai hing hij aan een paal, tot de avond; en omtrent het ondergaan van de zon gebood Jozua dat men zijn dode lichaam van de paal zou afnemen; en zij wierpen het bij de ingang van de stadspoort, en richtten daarop een grote steenhoop op, die er is tot op deze dag.", "Hand 7:56": "En hij zei: Zie, ik zie de hemelen geopend, en de Zoon des mensen, staande aan de rechterhand van God.", "Ezech 2:5": "En zij, hetzij dat zij het horen zullen, of hetzij dat zij het laten zullen (want zij zijn een opstandig huis), zo zullen zij weten, dat er een profeet in hun midden geweest is.", "Luk 16:1": "En Hij zei ook tegen Zijn discipelen: Er was een zeker rijk mens, die een rentmeester had; en deze werd bij hem beschuldigd, dat hij zijn goederen verkwistte.", "Job 33:15": "In de droom, door het gezicht 's nachts, als een diepe slaap op de mensen valt, in de sluimering op het leger;", "Dan 5:11-15": "Er is een man in uw koninkrijk, in wie de geest van de heilige goden is, want in de dagen van uw vader is bij hem licht, en verstand, en wijsheid gevonden, zoals de wijsheid van de goden is; daarom stelde de koning Nebukadnezar, uw vader, hem aan tot leider van de tovenaars, de sterrenkijkers, de Chaldeeën, en de waarzeggers, uw vader, o koning! Omdat een voortreffelijke geest, en wetenschap, en verstand van iemand die dromen uitlegt, en raadsels aanwijst, en knopen ontbindt, in hem gevonden werd, in Daniël, aan wie de koning de naam Beltsazar gaf; laat nu Daniël geroepen worden, die zal de uitleg bekendmaken. Toen werd Daniël voor de koning binnengebracht. De koning antwoordde en zei tegen Daniël: Bent u die Daniël, een van de weggevoerde gevangenen van Juda, die de koning, mijn vader, uit Juda gebracht heeft?", "Ex 19:3": "En Mozes klom op naar God. En de HEERE riep tot hem van de berg en zei: Zo zult u tot het huis van Jakob spreken, en de kinderen van Israël verkondigen:", "2 Kon 3:12": "En Josafat zei: Het woord van de HEERE is bij hem. Zo trokken naar hem toe de koning van Israël, en Josafat, en de koning van Edom.", "Ex 3:15": "Toen zei God verder tegen Mozes: Zo zult u tegen de kinderen van Israël zeggen: De HEERE, de God van uw vaderen, de God van Abraham, de God van Izak, en de God van Jakob, heeft mij tot u gezonden; dat is Mijn Naam eeuwig, en dat is Mijn gedachtenis van geslacht tot geslacht.", "1 Kon 17:1": "En Elia, de Thisbiet, van de inwoners van Gilead, zei tegen Achab: Zo waarachtig als de HEERE, de God van Israël, leeft, voor Wiens aangezicht ik sta, indien deze jaren dauw of regen zijn zal, tenzij dan naar mijn woord!", "Ex 19:9": "En de HEERE zei tot Mozes: Zie, Ik zal tot u komen in een dikke wolk, opdat het volk het hoort als Ik met u spreek, en dat zij ook eeuwig aan u geloven. Want Mozes had de HEERE de woorden van het volk verkondigd.", "2 Sam 23:2": "De Geest van de HEERE heeft door mij gesproken, en Zijn woord is op mijn tong geweest.", "2 Kon 2:15": "Toen de zonen van de profeten, die tegenover te Jericho waren, hem zagen, zeiden zij: De geest van Elia rust op Elisa; en zij kwamen hem tegemoet, en bogen zich voor hem neer ter aarde.", "Ex 26:30": "Dan moet u de tabernakel oprichten volgens de manier die u op de berg getoond is.", "2 Kron 24:20": "En de Geest van God bekleedde Zacharia, de zoon van Jojada, de priester, die boven het volk stond, en hij zei tegen hen: Zo zegt God: Waarom overtreedt u de geboden van de HEERE? Daarom zult u niet voorspoedig zijn; omdat u de HEERE verlaten hebt, zo zal Hij u verlaten.", "Ezech 3:17": "Mensenkind! Ik heb u tot een wachter gesteld over het huis Israëls; zo zult u het woord uit Mijn mond horen, en hen namens Mij waarschuwen.", "Gen 41:12": "En daar was bij ons een Hebreeuwse jongeman, een knecht van de leider van de lijfwacht; en wij vertelden ze aan hem, en hij legde ons onze dromen uit; ieder legde hij ze uit, naar zijn droom.", "1 Sam 9:15-20": "Want de HEERE had het aan Samuël geopenbaard, een dag voordat Saul kwam, en had gezegd: Morgen omstreeks deze tijd zal Ik naar u een man sturen uit het land van Benjamin, die zult u tot voorganger zalven over Mijn volk Israël; en hij zal Mijn volk verlossen uit de hand van de Filistijnen, want Ik heb naar Mijn volk omgezien, omdat hun geroep tot Mij gekomen is. Toen Samuel Saul zag, antwoordde de HEERE hem: Zie, dit is de man, van wie Ik u gezegd heb: Deze zal over Mijn volk heersen.", "Judas 1:1": "Judas, een dienstknecht van Jezus Christus, en broeder van Jakobus, aan de geroepenen, die door God de Vader geheiligd zijn, en door Jezus Christus bewaard:", "2 Sam 12:1": "En de HEERE zond Nathan naar David. Toen hij bij hem kwam, zei hij tegen hem: Er waren twee mannen in één stad, de één rijk en de ander arm.", "Num 22:18": "Toen antwoordde Bileam, en zei tegen de dienaren van Balak: Al zou Balak mij zijn huis vol zilver en goud geven, dan nog zou ik het bevel van de HEERE, mijn God, niet kunnen overtreden, om iets kleins of groots te doen.", "2 Sam 4:12": "En David gaf zijn knechten bevel, en zij doodden hen, en hakten hun handen en hun voeten af, en hingen ze op bij de vijver te Hebron; maar het hoofd van Isboseth namen zij en begroeven het in Abners graf te Hebron.", "1 Sam 24:12": "Zie toch, mijn vader, ja, zie de slip van uw mantel in mijn hand; want al heb ik de slip van uw mantel afgesneden, ik heb u niet gedood; erken en zie, dat er in mijn hand geen kwaad of overtreding is, en dat ik tegen u niet gezondigd heb; toch jaagt u mijn ziel na, om ze weg te nemen.", "1 Sam 19:24": "En hij trok zelf ook zijn kleren uit, en hij profeteerde zelf ook, voor het aangezicht van Samuël; en hij viel naakt neer, diezelfde hele dag en de hele nacht. Daarom zegt men: Is Saul ook onder de profeten?", "Dan 5:6": "Toen veranderde de gezichtskleur van de koning, en zijn gedachten verschrikten hem; en de banden van zijn heupen werden los, en zijn knieën stootten tegen elkaar aan.", "1 Kor 12:11": "Doch al deze dingen werkt één en dezelfde Geest, Die aan ieder afzonderlijk uitdeelt zoals Hij wil.", "Ex 12:29": "En het gebeurde te middernacht, dat de HEERE alle eerstgeborenen in Egypteland sloeg, van de eerstgeborene van Farao af, die op zijn troon zou zitten, tot de eerstgeborene van de gevangene, die in de gevangenis was, en alle eerstgeborenen van het vee.", "Jer 24:4": "Toen kwam het woord van de HEERE tot mij, en Hij zei:", "Amos 3:7": "Zeker, de Heere HEERE zal niets doen, tenzij Hij Zijn verborgenheid aan Zijn dienaren, de profeten, geopenbaard heeft.", "1 Sam 3:21": "En de HEERE ging door met verschijnen te Silo; want de HEERE openbaarde Zich aan Samuël te Silo, door het woord van de HEERE.", "Jes 63:11": "Toch dacht Hij aan de dagen van ouds, aan Mozes en Zijn volk; maar nu, waar is Hij, Die hen uit de zee opgebracht heeft, met de herders van Zijn kudde? Waar is Hij, Die Zijn Heilige Geest in het midden van hen stelde?", "1 Sam 10:6": "En de Geest van de HEERE zal vaardig worden over u, en u zult met hen profeteren; en u zult in een andere man veranderd worden.", "Ezra 5:1": "De profeten Haggai, de profeet, en Zacharia, de zoon van Iddo, profeteerden tot de Joden die in Juda en te Jeruzalem waren; in de naam van de God van Israël profeteerden zij tot hen.", "Hab 3:16": "Toen ik het hoorde, werd mijn buik beroerd; voor de stem hebben mijn lippen gebeefd; verrotting kwam in mijn beenderen, en ik werd beroerd op mijn plaats. Zeker, ik zal rusten op de dag van de benauwdheid, wanneer hij zal optrekken tegen het volk, om het met troepen aan te vallen.", "1 Kon 22:14": "Doch Micha zei: Zo waarachtig als de HEERE leeft, wat de HEERE tegen mij zeggen zal, dat zal ik spreken.", "Amos 7:15": "Maar de HEERE nam mij van achter de kudde vandaan; en de HEERE zei tegen mij: Ga heen, profeteer tegen Mijn volk Israël.", "Jer 26:2": "Zo zegt de HEERE: Sta in het voorhof van het huis van de HEERE, en spreek tot alle steden van Juda, die komen om aan te bidden in het huis van de HEERE, al de woorden die Ik u geboden heb tot hen te spreken; doe er niet één woord af.", "Dan 4:8": "Totdat ten laatste Daniël bij mij binnenkwam, wiens naam Beltsazar is, naar de naam van mijn god, in wie ook de geest van de heilige goden is; en ik vertelde de droom aan hem en zei:", "2 Kon 1:12": "En Elia antwoordde en sprak tot hem: Ben ik een man van God, laat er dan vuur uit de hemel neerdalen, dat u en uw vijftigtal verteert. Toen daalde het vuur van God uit de hemel neer en verteerde hem en zijn vijftigtal.", "Num 24:16": "Die hoort de woorden van God, spreekt, en die de kennis van de allerhoogste weet; die het gezicht van de Almachtige ziet, die in verrukking valt, en wiens ogen geopend worden.", "Amos 6:6": "Die wijn uit schalen drinken, en zich zalven met de beste olie, maar zich niet bekommeren over de verbreking van Jozef.", "Jer 16:1": "En het woord van de HEERE kwam tot mij, en Hij zei:", "Matt 23:25": "Wee u, Schriftgeleerden en Farizeeën, huichelaars, want u reinigt de buitenkant van de drinkbeker en de schotel, maar van binnen zijn ze vol roof en onmatigheid.", "1 Sam 17:44": "Daarna zei de Filistijn tegen David: Kom naar mij toe, dan zal ik uw vlees aan de vogels van de hemel geven, en aan de dieren van het veld.", "Ex 35:31": "En de Geest van God heeft hem vervuld met wijsheid, met verstand, en met kennis, namelijk in alle handwerk;", "Dan 2:19-23": "Toen werd aan Daniël in een nachtvisioen het geheim geopenbaard; toen loofde Daniël de God van de hemel. Daniël antwoordde en zei: De Naam van God zij geloofd van eeuwigheid tot in eeuwigheid, want van Hem is de wijsheid en de kracht. Want Hij verandert de tijden en de tijdperken; Hij zet koningen af en Hij stelt koningen aan; Hij geeft de wijzen wijsheid, en kennis aan hen die verstand hebben.", "Dan 2:30": "Aan mij nu is dit geheim geopenbaard, niet door wijsheid die in mij meer zou zijn dan in alle levenden, maar opdat men de koning de uitleg bekend zou maken, en opdat u de gedachten van uw hart zou kennen.", "Deut 24:7": "Wanneer iemand gevonden wordt die een mens steelt uit zijn broeders, uit de kinderen van Israël, en met hem handelt als koopwaar, en hem verkoopt; dan zal die dief sterven, en u zult het kwaad uit uw midden wegdoen.", "Ex 6:12": "Evenwel sprak de HEERE tot Mozes en tot Aäron, en gaf hun bevel aan de kinderen van Israël, en aan Farao, de koning van Egypte, om de kinderen van Israël uit Egypteland te leiden.", "2 Kron 36:15": "En de HEERE, de God van hun vaderen, zond tot hen, door de hand van Zijn boden, vroeg opstaand, om hen te zenden; want Hij spaarde Zijn volk en Zijn woning.", "2 Sam 12:3": "Maar de arme had helemaal niets, dan één enkel klein ooilam, dat hij gekocht had. Hij had het gevoed, zodat het groot werd bij hem en bij zijn kinderen samen; het at van zijn eigen stuk brood, en dronk uit zijn eigen beker, en sliep in zijn schoot, en het was voor hem als een dochter.", "Deut 15:12": "Wanneer uw broeder, een Hebreeuwse man of een Hebreeuwse vrouw, aan u verkocht is, dan zal hij u zes jaren dienen; maar in het zevende jaar zult u hem vrij van u laten gaan.", "Gen 49:20": "Van Aser, zijn brood zal vet zijn; en hij zal koninklijke lekkernijen leveren.", "Ex 25:9": "Naar alles wat Ik u tot een voorbeeld van deze tabernakel, en een voorbeeld van al zijn gereedschap wijzen zal, precies zo zult u dat maken.", "Ex 1:8": "Daarna kwam er een nieuwe koning over Egypte aan de macht, die Jozef niet gekend had;", "Jer 27:1": "In het begin van het koningschap van Jojakim, zoon van Josia, koning van Juda, kwam dit woord van de HEERE tot Jeremia:", "2 Kor 11:22": "Zijn zij Hebreeën? Ik ook. Zijn zij Israëlieten? Ik ook. Zijn zij het zaad van Abraham? Ik ook.", "1 Kron 28:11": "En David gaf zijn zoon Salomo een bereiding van het voorhuis, met zijn gebouwen, en zijn schatkamers, en zijn bovenzalen, en zijn binnenkamers, en van het huis van het verzoendeksel;", "1 Petr 1:10": "Naar deze zaligheid hebben de profeten gezocht en onderzoek gedaan, zij die geprofeteerd hebben van de genade die voor u bestemd was;", "1 Kon 17:24": "Toen zei die vrouw tegen Elia: Nu weet ik dat u een man van God bent, en dat het woord van de HEERE in uw mond waarheid is.", "Num 23:26": "Maar Bileam antwoordde en zei tegen Balak: Heb ik u niet gezegd: Alles wat de HEERE zal spreken, dat zal ik doen?", "1 Sam 20:15": "Ook zult u uw weldadigheid niet afsnijden van mijn huis tot in eeuwigheid; ook niet wanneer de HEERE ieder van de vijanden van David van de aardbodem zal hebben afgesneden.", "Jer 2:1": "En het woord van de HEERE gebeurde tot mij, en Hij zei:", "Klaagl 3:55": "Koph. HEERE! Ik heb Uw Naam aangeroepen uit de onderste kuil.", "Ex 19:19": "Toen het geluid van de bazuin aanhield en zeer sterk werd, sprak Mozes; en God antwoordde hem met een stem.", "2 Kon 3:11": "En Josafat zei: Is hier geen profeet van de HEERE, zodat wij door hem de HEERE kunnen raadplegen? Toen antwoordde een van de dienaren van de koning van Israël, en zei: Hier is Elisa, de zoon van Safat, die water op Elia's handen goot.", "Jer 25:3": "Vanaf het dertiende jaar van Josia, de zoon van Amon, de koning van Juda, tot op deze dag toe (dit is het drieëntwintigste jaar) is het woord van de HEERE tot mij gebeurd; en ik heb tot u gesproken, vroeg opstaand en sprekend, maar u hebt niet gehoord.", "Amos 3:8": "De leeuw heeft gebruld, wie zou niet vrezen? De Heere HEERE heeft gesproken, wie zou niet profeteren?", "2 Sam 21:6": "Laat ons zeven mannen van zijn zonen gegeven worden, zodat wij hen voor de HEERE ophangen te Gibea van Saul, o, u verkorene van de HEERE! En de koning zei: Ik zal hen geven.", "Jer 7:25": "Vanaf de dag dat uw vaders uit het land Egypte zijn uitgegaan, tot op deze dag, heb Ik tot u gezonden al Mijn knechten, de profeten, dagelijks vroeg opgestaan en hen zendend.", "Zach 1:7": "Op de vierentwintigste dag, in de elfde maand (dat is de maand Schebat), in het tweede jaar van Darius, kwam het woord van de HEERE tot Zacharia, de zoon van Berechja, de zoon van Iddo, de profeet, en hij zei:", "Gen 41:13": "En zoals hij ons uitlegde, zo is het gebeurd; mij heeft hij hersteld in mijn functie, en hem opgehangen.", "2 Kron 26:5": "Want hij begaf zich om God te zoeken, in de dagen van Zacharia, die verstandig was in de gezichten van God; en in de dagen dat hij de HEERE zocht, maakte God hem voorspoedig.", "Ex 4:15": "U dan zult tot hem spreken, en de woorden in zijn mond leggen; en Ik zal met uw mond, en met zijn mond zijn; en Ik zal u leren, wat u doen zult.", "Ps 37:5": "Gimel. Leg uw weg in de handen van de HEERE, en vertrouw op Hem; Hij zal het maken;", "Gen 21:8": "En het kind werd groot en werd gespeend; toen maakte Abraham een grote maaltijd op de dag dat Izak gespeend werd.", "Mark 6:16": "Maar toen Herodes dit hoorde, zei hij: Dit is Johannes, die ik onthoofd heb; hij is opgewekt uit de doden.", "Pred 9:16": "Toen zei ik: Wijsheid is beter dan kracht, hoewel de wijsheid van de arme veracht wordt, en zijn woorden niet gehoord worden.", "Gen 39:8-12": "Maar hij weigerde het, en zei tegen de vrouw van zijn heer: Zie, mijn heer weet niet, met mij hier, wat er in het huis is; en alles wat hij heeft, heeft hij in mijn hand gegeven. Niemand is groter in dit huis dan ik, en hij heeft mij niets onthouden, behalve u, omdat u zijn vrouw bent; hoe zou ik dan dit zo grote kwaad doen, en zondigen tegen God! En het gebeurde, toen zij Jozef dag op dag aansprak, en hij naar haar niet luisterde om bij haar te liggen en bij haar te zijn,", "Amos 7:7": "Nog liet Hij mij dit zien: zie, de Heere stond op een muur, die met een paslood gemaakt was, en een paslood was in Zijn hand.", "Ps 3:4": "Maar U, HEERE, bent een Schild voor mij, mijn eer, en Die mijn hoofd opheft.", "Jes 44:26": "Die het woord van Zijn knecht bevestigt, en de raad van Zijn boden volbrengt; Die tot Jeruzalem zegt: U zult bewoond worden; en tot de steden van Juda: U zult herbouwd worden, en Ik zal haar verwoeste plaatsen oprichten.", "Dan 2:18-30": "opdat zij van de God van de hemel barmhartigheid zouden vragen over dit geheim, zodat Daniël en zijn metgezellen niet zouden omkomen met de overige wijzen van Babel. Toen werd aan Daniël in een nachtvisioen het geheim geopenbaard; toen loofde Daniël de God van de hemel. Daniël antwoordde en zei: De Naam van God zij geloofd van eeuwigheid tot in eeuwigheid, want van Hem is de wijsheid en de kracht.", "Joh 10:32": "Jezus antwoordde hun: Ik heb u veel goede werken getoond van Mijn Vader; om welk van die werken stenigt u Mij?", "Ex 1:22": "Toen gebood Farao aan heel zijn volk: Elke zoon die geboren wordt, moet u in de rivier werpen, maar elke dochter mag u in leven laten.", "Ex 4:27": "De HEERE zei ook tegen Aäron: Ga Mozes tegemoet in de woestijn. En hij ging, en ontmoette hem bij de berg van God, en kuste hem.", "Jer 27:2": "Zo zei de HEERE tegen mij: Maak u banden en jukken, en doe die om uw hals.", "Gen 37:28": "Toen nu de Midianitische kooplieden voorbijtrokken, trokken en hesen zij Jozef op uit de kuil, en verkochten Jozef aan deze Ismaëlieten voor twintig zilverstukken; die brachten Jozef naar Egypte.", "Gen 43:32": "En zij richtten voor hem apart aan, en voor hen apart; en voor de Egyptenaren, die met hem aten, apart; want de Egyptenaren mogen geen brood eten met de Hebreeën, omdat dat voor de Egyptenaren een gruwel is.", "Dan 9:1-22": "In het eerste jaar van Darius, de zoon van Ahasveros, uit het nageslacht van de Meden, die koning gemaakt was over het koninkrijk van de Chaldeeën; in het eerste jaar van zijn regering, merkte ik, Daniël, in de boeken dat het getal van de jaren waarover het woord van de HEERE tot de profeet Jeremia gekomen was, in het vervullen van de verwoestingen van Jeruzalem, zeventig jaren was. En ik richtte mijn gezicht tot God, de HEERE, om Hem te zoeken met gebed en smekingen, met vasten, en een zak, en as.", "Joh 1:6": "Er was een mens door God gezonden, wiens naam Johannes was.", "1 Kon 7:26": "Haar dikte nu was een handbreed, en haar rand was gemaakt als de rand van een beker, met leliebloemen; zij hield tweeduizend bath.", "2 Kron 18:27": "En Micha zei: Als u werkelijk met vrede terugkomt, dan heeft de HEERE niet door mij gesproken. Verder zei hij: Hoor, alle volken!", "1 Kron 21:18": "Toen zei de engel van de HEERE tegen Gad, dat hij tegen David zou zeggen, dat David zou opgaan, om voor de HEERE een altaar op te richten op de dorsvloer van Ornan, de Jebusiet.", "Openb 22:8": "En ik, Johannes, ben degene die deze dingen gezien en gehoord heeft. En toen ik ze gehoord en gezien had, viel ik neer om aan te bidden voor de voeten van de engel die mij deze dingen toonde.", "Deut 1:6": "De HEERE, onze God, sprak tot ons bij Horeb, en zei: U bent lang genoeg bij deze berg gebleven.", "Jer 23:28": "De profeet, bij wie een droom is, vertelt de droom; en bij wie Mijn woord is, spreekt Mijn woord waarachtig; wat heeft het stro met het koren te maken? spreekt de HEERE.", "Hos 1:2": "Het begin van het woord van de Heere door Hosea. De Heere zei toen tegen Hosea: Ga heen, neem u een vrouw van hoererijen, en kinderen van hoererijen; want het land hoereert helemaal van achter de Heere vandaan.", "Gen 40:5-23": "Zij droomden nu beiden een droom, elk zijn eigen droom, in één nacht, elk met zijn eigen uitleg, de schenker en de bakker van de koning van Egypte, die gevangen zaten in de gevangenis. En Jozef kwam 's morgens bij hen, en hij keek hen aan, en zie, zij waren ontdaan. Toen vroeg hij de hovelingen van Farao, die bij hem in hechtenis waren in het huis van zijn heer: Waarom kijkt u vandaag zo somber?", "Hos 1:1": "Het woord van de Heere, dat gebeurd is tot Hosea, de zoon van Beëri, in de dagen van Uzzia, Jotham, Achaz, Hizkia, koningen van Juda, en in de dagen van Jerobeam, zoon van Joas, koning van Israël.", "Jer 37:21": "Toen gaf koning Zedekia bevel, en zij brachten Jeremia onder in het voorhof van de gevangenis, en men gaf hem dagelijks een bol brood uit de Bakkerstraat, totdat al het brood van de stad op was. Zo bleef Jeremia in het voorhof van de gevangenis.", "Jer 26:12": "Maar Jeremia sprak tot al de vorsten en tot al het volk, en zei: De HEERE heeft mij gezonden, om tegen dit huis en tegen deze stad te profeteren al de woorden die u gehoord hebt;", "Dan 2:31": "U, o koning, zag, en zie, er was een groot beeld (dit beeld was indrukwekkend, en de glans ervan was schitterend), dat tegenover u stond; en de vorm ervan was ontzagwekkend.", "1 Petr 3:18": "Want Christus heeft ook eenmaal voor de zonden geleden, Hij, de Rechtvaardige, voor de onrechtvaardigen, opdat Hij ons tot God zou brengen; Hij is wel gedood in het vlees, maar levend gemaakt door de Geest;", "Ex 7:2": "U zult alles spreken wat Ik u gebieden zal; en Aäron, uw broer, zal tegen Farao spreken, dat hij de kinderen van Israël uit zijn land laat trekken.", "Num 23:12": "Hij antwoordde en zei: Moet ik er niet op letten te spreken wat de HEERE in mijn mond gelegd heeft?", "Num 7:89": "En toen Mozes de tent van de samenkomst inging om met Hem te spreken, hoorde hij een stem tot hem spreken, van boven het verzoendeksel dat op de ark van de getuigenis was, van tussen de twee cherubs. Zo sprak Hij tot hem.", "Hand 3:18": "Maar God heeft zo vervuld wat Hij door de mond van al Zijn profeten van tevoren had verkondigd, dat de Christus zou lijden.", "Dan 4:19-33": "Toen schrok Daniël, wiens naam Beltsazar is, ongeveer een uur lang, en zijn gedachten verontrustten hem. De koning antwoordde en zei: Beltsazar, laat de droom en zijn uitleg u niet verontrusten. Beltsazar antwoordde en zei: Mijn heer! De droom moge uw haters wedervaren, en zijn uitleg uw tegenstanders! De boom, die u gezien hebt, die groot en sterk geworden was, en wiens hoogte tot aan de hemel reikte, en die over het hele aardrijk gezien werd; En wiens loof mooi, en wiens vruchten veel waren, en waaraan voedsel was voor allen, onder wie het gedierte van het veld woonde, en in wiens takken de vogels van de hemel nestelden;", "1 Kor 12:10": "En aan een ander de werkingen van krachten; en aan een ander profetie; en aan een ander het onderscheiden van geesten; en aan een ander allerlei talen; en aan een ander uitleg van de talen.", "Richt 13:25": "En de Geest van de HEERE begon hem soms te drijven in het leger van Dan, tussen Zora en Esthaol.", "1 Kon 2:7": "Maar aan de zonen van Barzillai, de Gileadiet, zult u vriendelijkheid bewijzen, en zij zullen bij hen horen die aan uw tafel eten; want zo kwamen zij naar mij toe, toen ik vluchtte voor het aangezicht van uw broer Absalom.", "2 Kon 4:27": "Toen zij nu bij de man Gods op de berg kwam, greep zij zijn voeten vast. Maar Gehazi kwam dichterbij om haar weg te duwen. Maar de man Gods zei: Laat haar begaan; want haar ziel is in haar bitter bedroefd, en de HEERE heeft het voor mij verborgen, en het mij niet verteld.", "Hab 3:2": "HEERE! Toen ik Uw rede gehoord heb, ben ik bevreesd geworden; Uw werk, o HEERE! Behoud dat in het leven in het midden van de jaren, maak het bekend in het midden van de jaren; gedenk in de toorn aan het ontfermen.", "Gen 7:4": "Want over nog zeven dagen zal Ik het laten regenen op de aarde, veertig dagen en veertig nachten; en Ik zal van de aardbodem wegvagen alles wat leeft, dat Ik gemaakt heb.", "Jer 11:1": "Het woord dat tot Jeremia gebeurd is, van de HEERE, en Hij zei:", "Ezech 40:1": "In het vijfentwintigste jaar van onze wegvoering, in het begin van het jaar, op de tiende van de maand, in het veertiende jaar nadat de stad was ingenomen, op diezelfde dag was de hand van de HEERE op mij, en Hij bracht mij daarheen.", "Dan 7:28": "Tot hiertoe is het einde van dit relaas. Wat mij, Daniël, aangaat, mijn gedachten verschrikten mij zeer, en mijn gelaatskleur veranderde; doch ik bewaarde dat woord in mijn hart.", "Ezech 11:1": "Toen tilde de Geest mij op en bracht mij naar de Oostpoort van het huis van de HEERE, die oostwaarts ziet; en zie, aan de deur van de poort waren vijfentwintig mannen, en in hun midden zag ik Jaazanja, de zoon van Azzur, en Pelatja, de zoon van Benaja, vorsten van het volk.", "Luk 14:24": "Want ik zeg u, dat niemand van die mannen die genodigd waren, mijn avondmaal zal proeven.", "Jona 3:2": "Maak u op, ga naar de grote stad Nineve, en predik tegen haar de prediking, die Ik tot u spreek.", "Jer 26:1": "In het begin van het koningschap van Jojakim, de zoon van Josia, koning van Juda, kwam dit woord van de HEERE, en Hij zei:", "Ex 29:23": "En een broodbol, en een koek geolied brood, en een vlade, uit de korf van de ongezuurde broden, die voor het aangezicht van de HEERE zijn zal;", "Ex 25:22": "En daar zal Ik bij u komen, en Ik zal met u spreken van boven het verzoendeksel af, van tussen de twee cherubs die op de ark van de getuigenis zullen zijn, alles wat Ik u gebieden zal aan de kinderen van Israël.", "1 Sam 20:14": "En zult u niet, als ik dan nog leef, ja, zult u niet de weldadigheid van de HEERE aan mij doen, dat ik niet sterf?", "Ezech 2:2": "Zo kwam in mij, toen Hij tot mij sprak, de Geest, Die mij op mijn voeten zette; en ik hoorde Hem, Die tot mij sprak.", "Ps 27:6": "Ook nu zal mijn hoofd verhoogd worden boven mijn vijanden die rondom mij zijn, en ik zal in Zijn tent offeranden van het geschal offeren; ik zal zingen, ja, psalmzingen voor de HEERE.", "1 Kor 7:21": "Bent u als dienstknecht geroepen, laat u dat niet bekommeren; maar als u ook vrij kunt worden, gebruik dat dan liever.", "Dan 2:36-45": "Dit is de droom; de uitleg ervan zullen wij nu voor de koning vertellen. U, o koning, bent een koning der koningen; want de God van de hemel heeft u een koninkrijk, macht, sterkte en eer gegeven; En overal waar mensenkinderen wonen, heeft Hij de dieren van het veld en de vogels van de hemel in uw hand gegeven; en Hij heeft u aangesteld als heerser over hen allen; u bent dat gouden hoofd.", "Num 24:2-4": "Toen Bileam zijn ogen ophief en Israël zag, wonend naar zijn stammen, kwam de Geest van God op hem. En hij hief zijn spreuk op en zei: Bileam, de zoon van Beor, spreekt, en de man wiens ogen geopend zijn, spreekt! Die hoort de woorden van God, spreekt, die het gezicht van de Almachtige ziet; die in verrukking valt, en wiens ogen geopend worden!", "Num 1:1": "Verder sprak de HEERE tot Mozes, in de woestijn van Sinaï, in de tent van de samenkomst, op de eerste dag van de tweede maand, in het tweede jaar nadat zij uit het land Egypte vertrokken waren, en Hij zei:", "Gen 41:14": "Toen stuurde Farao iemand en riep Jozef, en zij lieten hem haastig uit de kuil komen; en men schoor hem, en men verwisselde zijn kleren; en hij kwam bij Farao.", "Gen 41:26": "Die zeven mooie koeien zijn zeven jaren; die zeven mooie aren zijn ook zeven jaren; de droom is één.", "Gen 40:5-19": "Zij droomden nu beiden een droom, elk zijn eigen droom, in één nacht, elk met zijn eigen uitleg, de schenker en de bakker van de koning van Egypte, die gevangen zaten in de gevangenis. En Jozef kwam 's morgens bij hen, en hij keek hen aan, en zie, zij waren ontdaan. Toen vroeg hij de hovelingen van Farao, die bij hem in hechtenis waren in het huis van zijn heer: Waarom kijkt u vandaag zo somber?", "1 Petr 3:17": "Want het is beter, als het de wil van God is, dat u lijdt om het goeddoen, dan om het kwaaddoen.", "Gen 41:8": "En het gebeurde 's morgens, dat zijn geest onrustig was, en hij stuurde iemand weg, en riep al de tovenaars van Egypte, en al de wijzen die er waren; en Farao vertelde hun zijn droom; maar er was niemand die hem aan Farao kon uitleggen.", "Hand 2:2-4": "En er kwam plotseling uit de hemel een geluid, als van een geweldige, gedreven wind, en het vervulde het hele huis waar zij zaten. En er werden door hen verdeelde tongen gezien, als van vuur, en het zat op ieder van hen. En zij werden allen vervuld met de Heilige Geest, en begonnen te spreken met andere talen, zoals de Geest hun gaf uit te spreken.", "Hos 12:11": "En Ik zal spreken tot de profeten, en Ik zal het gezicht vermenigvuldigen; en door de dienst van de profeten zal Ik gelijkenissen voorstellen.", "Hebr 3:5": "En Mozes is wel trouw geweest in heel Zijn huis, als een dienaar, tot getuigenis van de dingen die daarna gesproken zouden worden;", "Spr 16:14": "De woede van de koning is als de boden van de dood; maar een wijs man zal die verzoenen.", "1 Sam 19:23": "Toen ging hij daarheen naar Najoth bij Rama; en dezelfde Geest van God kwam ook op hem, en al voortgaande profeteerde hij, totdat hij in Najoth in Rama aankwam.", "Job 19:14": "Mijn nabestaanden houden op, en mijn bekenden vergeten mij.", "Richt 14:6": "Toen kwam de Geest van de HEERE machtig over hem, zodat hij hem uiteenscheurde, zoals men een bokje uiteenscheurt, en er was niets in zijn hand; maar hij vertelde zijn vader en zijn moeder niet wat hij gedaan had.", "Klaagl 3:53": "Tsade. Zij hebben mijn leven in een kuil uitgeroeid, en zij hebben een steen op mij geworpen.", "1 Kon 18:46": "En de hand van de HEERE was op Elia, en hij gordde zijn lenden, en liep voor het aangezicht van Achab uit, tot waar men bij Jizreël komt.", "Richt 7:14": "En zijn metgezel antwoordde en zei: Dit is niets anders dan het zwaard van Gideon, de zoon van Joas, de Israëlitische man; God heeft de Midianieten en dit hele leger in zijn hand gegeven.", "Openb 14:13": "En ik hoorde een stem uit de hemel, die tegen mij zei: Schrijf, zalig zijn de doden die in de Heere sterven, van nu aan. Ja, zegt de Geest, opdat zij rusten van hun arbeid; en hun werken volgen met hen.", "Hagg 1:13": "Toen sprak Haggai, de bode van de HEERE, in de boodschap van de HEERE, tot het volk, en hij zei: Ik ben met u, spreekt de HEERE.", "Joël 2:28": "En daarna zal het gebeuren, dat Ik Mijn Geest zal uitgieten over alle vlees, en uw zonen en uw dochters zullen profeteren; uw ouden zullen dromen dromen, uw jongelingen zullen gezichten zien;", "1 Sam 9:6": "Hij daarentegen zei tegen hem: Zie toch, er is een man van God in deze stad, en hij is een geëerd man; alles wat hij zegt, komt zeker uit; laten wij nu daarheen gaan, misschien zal hij ons onze weg aanwijzen, die wij gaan zullen.", "Hand 2:30": "Omdat hij dan een profeet was, en wist dat God hem met een eed gezworen had dat Hij uit de vrucht van zijn lichaam, wat het vlees betreft, de Christus zou verwekken om Hem op zijn troon te zetten;", "Luk 16:2": "En hij riep hem en zei tegen hem: Hoe hoor ik dit van u? Geef rekenschap van uw rentmeesterschap; want u zult niet meer rentmeester kunnen zijn.", "Pred 9:15": "En men vond daar een arme, wijze man in, die de stad door zijn wijsheid redde; maar geen mens dacht meer aan die arme man.", "Gen 39:20": "En Jozefs heer nam hem, en leverde hem over in de gevangenis, op de plaats waar de gevangenen van de koning gevangen zaten; zo was hij daar in de gevangenis.", "Gal 3:13": "Christus heeft ons verlost van de vloek van de wet, doordat Hij voor ons een vloek geworden is; want er is geschreven: Vervloekt is ieder die aan het hout hangt.", "Dan 2:47": "De koning antwoordde Daniël en zei: Het is werkelijk waar dat uw God een God der goden is, en een Heere der koningen, en Iemand Die geheimen openbaart, omdat u dit geheim hebt kunnen openbaren.", "1 Sam 10:10": "Toen zij daar bij de heuvel kwamen, zie, toen kwam hem een groep profeten tegemoet; en de Geest van de HEERE werd vaardig over hem, en hij profeteerde in hun midden.", "Jer 37:16": "Toen Jeremia in het kuil-gedeelte en in de kotjes gekomen was, en Jeremia daar veel dagen gezeten had,", "Rom 1:2": "(Wat Hij van tevoren beloofd had door Zijn profeten, in de heilige Schriften),", "Ps 103:7": "Hij heeft Mozes Zijn wegen bekendgemaakt, aan de kinderen van Israël Zijn daden.", "Zach 1:1": "In de achtste maand, in het tweede jaar van Darius, kwam het woord van de HEERE tot Zacharia, de zoon van Berechja, de zoon van Iddo, de profeet, en hij zei:", "Num 9:8-10": "En Mozes zei tot hen: Blijf staan, dat ik hoor wat de HEERE u gebieden zal. Toen sprak de HEERE tot Mozes en zei: Spreek tot de kinderen van Israël en zeg: Wanneer iemand onder u, of onder uw geslachten, onrein is door een dood lichaam, of op een verre reis zal zijn, dan zal hij toch de HEERE het pascha houden.", "2 Kon 5:8": "Maar het gebeurde, toen Elisa, de man van God, gehoord had dat de koning van Israël zijn kleren had gescheurd, dat hij naar de koning stuurde, om te zeggen: Waarom hebt u uw kleren gescheurd? Laat hem nu naar mij toe komen, dan zal hij weten dat er een profeet in Israël is.", "Est 1:8": "En het drinken gebeurde volgens de regel, dat niemand dwong; want zo had de koning het vast bevolen aan alle leiders van zijn huis, dat zij zouden doen naar de wil van ieder.", "Dan 2:1": "In het tweede jaar van het koninkrijk van Nebukadnezar droomde Nebukadnezar dromen; daarvan raakte zijn geest verontrust, en zijn slaap week van hem.", "2 Kron 9:4": "En het voedsel van zijn tafel, en het zitten van zijn knechten, en het optreden van zijn dienaren, en hun kleding, en zijn schenkers, en hun kleding, en zijn opgang waarmee hij opging in het huis van de HEERE, toen was er geen geest meer in haar.", "Gen 41:38": "Toen zei Farao tegen zijn dienaars: Zouden wij wel een man vinden zoals deze, in wie de Geest van God is?", "Ex 35:35": "Hij heeft hen vervuld met wijsheid van hart, om alle werk te maken van een werkmeester, en van de allervernuftigste handwerker, en van de borduurder in hemelsblauw, en in purper, in scharlaken, en in fijn linnen, en van de wever; die alle werk maken, en vernuftig werk bedenken.", "Hebr 1:1": "Nadat God voortijds veelmaal en op velerlei wijze tot de vaderen gesproken heeft door de profeten, heeft Hij in deze laatste dagen tot ons gesproken door de Zoon;", "2 Kon 3:15": "Nu dan, brengt mij een speelman. En het gebeurde, toen de speelman op de snaren speelde, dat de hand van de HEERE op hem kwam.", "Richt 6:7-10": "En het gebeurde, toen de Israëlieten tot de HEERE riepen vanwege de Midianieten, dat de HEERE een man zond, die een profeet was, naar de Israëlieten; die zei tegen hen: Zo zegt de HEERE, de God van Israël: Ik heb u uit Egypte doen optrekken, en u uit het slavenhuis uitgeleid; en Ik heb u verlost uit de hand van de Egyptenaren, en uit de hand van allen die u onderdrukten; en Ik heb hen voor uw ogen verdreven, en u hun land gegeven;", "Job 3:1": "Daarna opende Job zijn mond, en vervloekte zijn dag.", "Hand 28:25": "En omdat zij het onderling oneens waren, gingen zij uiteen, nadat Paulus dit ene woord gezegd had, namelijk: Terecht heeft de Heilige Geest gesproken door de profeet Jesaja tot onze voorvaders,", "Ex 4:12": "En nu ga heen, en Ik zal met uw mond zijn, en zal u leren, wat u spreken zult.", "Openb 10:7": "maar in de dagen van de stem van de zevende engel, wanneer hij zal bazuinen, dan zal het geheimenis van God vervuld worden, zoals Hij aan Zijn dienstknechten, de profeten, verkondigd heeft.", "Openb 2:7": "Wie oren heeft, laat hij horen wat de Geest tegen de gemeenten zegt. Wie overwint, hem zal Ik geven te eten van de boom des levens, die in het midden van het paradijs van God is.", "Hand 11:28": "En een van hen, met de naam Agabus, stond op en maakte door de Geest bekend dat er een grote hongersnood zou komen over de hele wereld; die is ook gekomen onder keizer Claudius.", "1 Kron 28:12": "en een bereiding van alles wat bij hem was door de Geest, namelijk van de voorhoven van het huis van de HEERE, en van alle kamers rondom; van de schatten van het huis van God, en van de schatten van de heilige dingen;", "Jer 42:7": "En het gebeurde na tien dagen, dat het woord van de HEERE tot Jeremia kwam.", "Job 32:8": "Zeker, de geest die in de mens is, en de inblazing van de Almachtige, maakt hen verstandig.", "Dan 5:12": "Omdat een voortreffelijke geest, en wetenschap, en verstand van iemand die dromen uitlegt, en raadsels aanwijst, en knopen ontbindt, in hem gevonden werd, in Daniël, aan wie de koning de naam Beltsazar gaf; laat nu Daniël geroepen worden, die zal de uitleg bekendmaken.", "Gen 41:25": "Toen zei Jozef tot Farao: De droom van Farao is één; wat God gaat doen, heeft Hij Farao bekendgemaakt.", "Dan 2:27-30": "Daniël antwoordde voor de koning en zei: Het geheim dat de koning vraagt, kunnen de wijzen, de sterrenkijkers, de tovenaars en de waarzeggers de koning niet bekendmaken; Maar er is een God in de hemel, Die geheimen openbaart, Die de koning Nebukadnezar bekendgemaakt heeft wat er gebeuren zal in het laatste der dagen; uw droom en de visioenen van uw hoofd op uw bed zijn deze: U, o koning, terwijl u op uw bed lag, kwamen er gedachten bij u op over wat hierna gebeuren zou; en Hij, Die geheimen openbaart, heeft u bekendgemaakt wat er gebeuren zal.", "Gen 43:34": "En hij liet hun gerechten brengen die voor hem stonden; maar het gerecht van Benjamin was vijf keer groter dan de gerechten van hen allen. En zij dronken, en zij werden vrolijk met hem.", "2 Kon 25:27": "Het gebeurde daarna in het zevenendertigste jaar van de wegvoering van Jojachin, de koning van Juda, in de twaalfde maand, op de zevenentwintigste van de maand, dat Evilmerodach, de koning van Babel, in het jaar dat hij koning werd, het hoofd van Jojachin, de koning van Juda, uit de gevangenis verhief.", "1 Tim 1:10": "De hoereerders, mannen die met mannen omgang hebben, de mensenrovers, de leugenaars, de meinedigen, en al wat verder tegen de gezonde leer ingaat;", "Job 7:14": "Dan doet U mij schrikken met dromen, en door visioenen verschrikt U mij;", "Jer 18:1": "Het woord dat van de HEERE tot Jeremia gebeurde, en Hij zei:", "1 Kon 19:9": "En hij kwam daar in een grot, en overnachtte daar; en zie, het woord van de HEERE kwam tot hem, en Hij zei tegen hem: Wat doet u hier, Elia?", "Gen 49:11": "Hij bindt zijn jonge ezel aan de wijnstok, en het veulen van zijn ezelin aan de edelste wijnstok; hij wast zijn kleed in de wijn, en zijn mantel in wijndruivenbloed.", "Jes 25:6": "En de HEERE van de heerscharen zal op deze berg voor alle volken een vette maaltijd maken, een maaltijd van reine wijn, van vet vol merg, van reine wijnen, die gezuiverd zijn.", "Ex 21:16": "Verder, wie een mens steelt, of hij hem verkocht heeft, of hij in zijn hand gevonden wordt, die zal zeker gedood worden.", "Matt 25:19": "En na lange tijd kwam de heer van die dienstknechten, en hield afrekening met hen.", "Dan 2:19": "Toen werd aan Daniël in een nachtvisioen het geheim geopenbaard; toen loofde Daniël de God van de hemel.", "Gen 12:15": "Ook zagen de vorsten van Farao haar, en prezen haar bij Farao; en die vrouw werd meegenomen naar het huis van Farao.", "2 Kron 15:1": "Toen kwam de Geest van God op Azaria, de zoon van Oded.", "Dan 2:28": "Maar er is een God in de hemel, Die geheimen openbaart, Die de koning Nebukadnezar bekendgemaakt heeft wat er gebeuren zal in het laatste der dagen; uw droom en de visioenen van uw hoofd op uw bed zijn deze:", "Job 33:16": "Dan openbaart Hij het voor het oor der mensen, en Hij verzegelt hun kastijding;", "1 Kor 10:4": "en zij hebben allen dezelfde geestelijke drank gedronken; want zij dronken uit de geestelijke steenrots die hen volgde; en die steenrots was Christus.", "Deut 21:22": "Verder, wanneer iemand een zonde heeft begaan die de doodstraf verdient, zodat hij gedood wordt, en u hem aan het hout hebt opgehangen;", "2 Kron 20:14": "Toen kwam de Geest van de HEERE in het midden van de samenkomst, op Jahaziël, de zoon van Zecharja, de zoon van Benaja, de zoon van Jehiël, de zoon van Matthanja, de Leviet, uit de zonen van Asaf;", "2 Petr 1:21": "Want de profetie is vroeger nooit voortgebracht door de wil van een mens, maar de heilige mensen van God hebben gesproken, gedreven door de Heilige Geest.", "Luk 1:15": "Want hij zal groot zijn voor de Heere; hij zal geen wijn en geen sterke drank drinken, en hij zal met de Heilige Geest vervuld worden, al vanaf de moederschoot.", "Gen 14:13": "Toen kwam er iemand die ontkomen was, en bracht dat over aan Abram, de Hebreeër, die woonde bij de eikenbossen van Mamre, de Amoriet, broeder van Eskol, en broeder van Aner, die Abrams bondgenoten waren.", "Dan 10:7-9": "En ik, Daniël, zag alleen dat gezicht, maar de mannen die bij mij waren, zagen dat gezicht niet; maar er viel een grote schrik op hen, en zij vluchtten om zich te verbergen. Ik dan bleef alleen achter, en zag dit grote gezicht, en er bleef in mij geen kracht over; en mijn schoonheid veranderde in verval, zodat ik geen kracht behield. En ik hoorde de stem van Zijn woorden; en toen ik de stem van Zijn woorden hoorde, viel ik in een diepe slaap op mijn gezicht, met mijn gezicht op de grond.", "1 Sam 17:46": "Vandaag zal de HEERE u overleveren in mijn hand, en ik zal u verslaan, en ik zal uw hoofd van u wegnemen, en ik zal de dode lichamen van het leger van de Filistijnen vandaag aan de vogels van de hemel en aan de dieren van het veld geven; en heel de aarde zal weten dat Israël een God heeft.", "2 Sam 21:10": "Toen nam Rizpa, de dochter van Aja, een rouwkleed, en spande dit voor zich uit op een rotssteen, vanaf het begin van de oogst, totdat er water op hen drupte uit de hemel; en zij liet het gevogelte van de hemel overdag niet op hen rusten, en het gedierte van het veld 's nachts ook niet.", "Hand 5:30": "De God van onze vaderen heeft Jezus opgewekt, Die u omgebracht hebt, door Hem aan het hout te hangen.", "1 Sam 25:31": "dan zal dit u, mijn heer, niet tot wankeling zijn, noch tot aanstoot van het hart, namelijk dat u bloed zonder oorzaak zou vergoten hebben, en dat mijn heer zichzelf zou verlost hebben; en wanneer de HEERE mijn heer goed zal doen, dan zult u aan uw dienstmaagd denken.", "Jer 11:18": "De HEERE nu heeft het mij te kennen gegeven, dat ik het weet; toen hebt U mij hun handelingen laten zien.", "Ezech 11:24": "Daarna nam de Geest mij op, en bracht mij in een gezicht door de Geest van God naar Chaldea, tot de weggevoerde gevangenen; en het gezicht dat ik gezien had, steeg van mij op.", "Jer 1:2": "Tot wie het woord van de HEERE kwam, in de dagen van Josia, zoon van Amon, koning van Juda, in het dertiende jaar van zijn regering.", "1 Sam 3:4-10": "dat de HEERE Samuël riep; en hij zei: Hier ben ik. En hij liep naar Eli en zei: Hier ben ik, want u hebt mij geroepen. Doch hij zei: Ik heb niet geroepen, keer terug, ga liggen. En hij ging heen en legde zich neer. Toen riep de HEERE Samuël opnieuw; en Samuël stond op en ging naar Eli, en zei: Hier ben ik, want u hebt mij geroepen. Hij dan zei: Ik heb u niet geroepen, mijn zoon; keer terug, ga liggen.", "Hand 21:10": "En toen wij daar veel dagen gebleven waren, kwam er een zekere profeet uit Judea aan, met de naam Agabus.", "Ex 33:9": "En het gebeurde, als Mozes de tent binnengegaan was, dat de wolkkolom neerdaalde en bleef staan in de deur van de tent, en Hij sprak met Mozes.", "Spr 3:10": "Zo zullen uw schuren met overvloed gevuld worden, en uw perskuipen van most overlopen.", "Ezech 39:4": "Op de bergen van Israël zult u vallen, u en al uw benden, en de volken die met u zijn; Ik heb u aan de roofvogels, aan het gevogelte van elke vleugel, en aan de dieren van het veld tot voedsel gegeven.", "Jer 29:30": "Daarom kwam het woord van de HEERE tot Jeremia, en Hij zei:", "Hand 8:39": "En toen zij uit het water waren opgekomen, nam de Geest van de Heere Filippus weg, en de kamerling zag hem niet meer; want hij reisde zijn weg met blijdschap.", "Jes 24:22": "En zij zullen bijeengebracht worden, zoals gevangenen in een put, en zij zullen opgesloten worden in een gevangenis, maar na veel dagen weer bezocht worden.", "Deut 28:5": "Gezegend zal zijn uw korf, en uw baktrog.", "1 Sam 19:20": "Toen zond Saul boden om David te halen; die zagen een groep profeten, die profeteerden, en Samuël stond daarbij, over hen aangesteld; en de Geest van God kwam over Sauls boden, en ook zij profeteerden.", "Amos 9:1": "Ik zag de Heere staan op het altaar, en Hij zei: Sla die knop, zodat de posten beven, en kloof ze allen in het hoofd; en Ik zal hun achterste met het zwaard doden; wie van hen probeert te vluchten, zal niet ontkomen, en wie van hen probeert te ontkomen, zal niet gered worden.", "Matt 14:6": "Maar toen de verjaardag van Herodes gevierd werd, danste de dochter van Herodias in hun midden, en zij beviel Herodes.", "Amos 7:14": "Toen antwoordde Amos, en zei tegen Amazia: Ik was geen profeet, en ik was geen profetenzoon; maar ik was een ossenherder, en verzamelde wilde vijgen.", "Matt 26:26": "En toen zij aten, nam Jezus het brood, en na de zegen brak Hij het, en gaf het aan de discipelen en zei: Neemt, eet, dat is Mijn lichaam.", "2 Kron 36:12": "En hij deed wat slecht was in de ogen van de HEERE, zijn God; hij verootmoedigde zich niet voor het aangezicht van de profeet Jeremia, die sprak uit de mond van de HEERE.", "Jer 40:1": "Het woord dat van de HEERE gebeurd is tot Jeremia, nadat Nebuzaradan, de aanvoerder van de lijfwacht, hem had laten gaan van Rama; toen hij hem had laten halen, terwijl hij met ketenen gebonden was in het midden van alle gevangenen van Jeruzalem en Juda, die naar Babel gevankelijk werden weggevoerd.", "Ps 105:19": "Tot de tijd toe dat Zijn woord kwam, heeft de rede van de HEERE hem doorlouterd.", "Ex 2:6": "Toen zij het opendeed, zag zij het kind; en zie, het jongetje huilde; en zij werd door medelijden bewogen, en zei: Dit is een van de kinderen van de Hebreeën!", "1 Kron 12:20": "Toen hij naar Ziklag ging, vielen tot hem uit Manasse: Adnah, en Jozabad, en Jediaël, en Michaël, en Jozabad, en Elihu, en Zillethai; aanvoerders van de duizenden die in Manasse waren.", "Micha 1:1": "Het woord van de HEERE, dat gebeurd is tot Micha, de Morastiet, in de dagen van Jotham, Achaz en Jehizkia, koningen van Juda; dat hij gezien heeft over Samaria en Jeruzalem.", "2 Sam 13:4": "Die zei tegen hem: Waarom bent u, dag na dag, zo mager, u koningszoon, zult u het mij niet vertellen? Toen zei Amnon tegen hem: Ik heb Thamar, de zuster van mijn broer Absalom, lief.", "Ezech 8:1": "Het gebeurde nu in het zesde jaar, in de zesde maand, op de vijfde van de maand, terwijl ik in mijn huis zat, en de oudsten van Juda voor mij zaten, dat de hand van de Heere HEERE daar over mij viel.", "2 Kon 10:10": "Weet nu, dat niets van het woord van de HEERE, dat de HEERE tegen het huis van Achab gesproken heeft, op de aarde zal vallen; want de HEERE heeft gedaan, wat Hij door de dienst van Zijn knecht Elia gesproken heeft.", "1 Petr 1:11": "en onderzochten op welke of wat voor tijd de Geest van Christus, Die in hen was, doelde, toen Hij vooraf getuigde van het lijden dat over Christus zou komen, en de heerlijkheid daarna.", "Ps 31:13": "Ik ben uit het hart vergeten als een dode; ik ben geworden als een gebroken vat.", "Gen 39:21-23": "Maar de HEERE was met Jozef, en bewees hem Zijn goedertierenheid; en gaf hem genade in de ogen van de leider van de gevangenis. En de leider van de gevangenis gaf alle gevangenen die in de gevangenis waren in Jozefs hand; en alles wat zij daar deden, deed hij. De leider van de gevangenis had geen omzien meer naar enig ding dat in zijn hand was, omdat de HEERE met hem was; en wat hij deed, dat deed de HEERE goed gedijen.", "Ps 76:11": "Want de grimmigheid van de mens zal U loffelijk maken; het overblijfsel van de grimmigheden zult U opbinden.", "1 Kor 14:32": "En de geesten der profeten zijn aan de profeten onderworpen.", "Ezech 1:1": "In het dertigste jaar, in de vierde maand, op de vijfde dag van die maand, toen ik te midden van de weggevoerden was bij de rivier Chebar, gebeurde het dat de hemelen werden geopend, en ik zag visioenen van God.", "Ezech 11:4": "Daarom, profeteer tegen hen; profeteer, o mensenkind!", "2 Kron 33:18": "Het overige nu van de geschiedenissen van Manasse, en zijn gebed tot zijn God, ook de woorden van de zieners, die tot hem gesproken hebben in de Naam van de HEERE, de God van Israël, zie, die staan in de geschiedenissen van de koningen van Israël;", "Ezech 2:1": "En Hij zei tegen mij: Mensenkind, sta op uw voeten, en Ik zal met u spreken.", "Joz 10:26": "En Jozua sloeg hen daarna, en doodde ze, en hing ze aan vijf bomen; en zij hingen aan de bomen tot de avond.", "Jer 20:9": "Daarom zei ik: Ik zal Hem niet meer noemen, en niet meer in Zijn Naam spreken; maar het werd in mijn hart als een brandend vuur, opgesloten in mijn beenderen; en ik werd moe van het verdragen, maar ik kon het niet.", "Ezech 3:22": "En de hand van de HEERE was daar op mij, en Hij zei tot mij: Maak u op, ga uit naar de vallei, en Ik zal daar met u spreken.", "Spr 19:12": "De gramschap van de koning is als het gebrul van een jonge leeuw; maar zijn welgevallen is als dauw op het gras.", "Dan 4:10-18": "De visioenen van mijn hoofd op mijn bed waren deze: ik zag, en zie, er was een boom in het midden van de aarde, en zijn hoogte was groot. De boom werd groot en sterk; en zijn hoogte reikte aan de hemel, en hij werd gezien tot aan het einde van de hele aarde; Zijn loof was mooi, en zijn vruchten veel, en er was voedsel aan voor allen; onder hem vond het gedierte van het veld schaduw, en de vogels van de hemel woonden in zijn takken, en alle vlees werd daarvan gevoed.", "Neh 1:11": "Och, Heere, laat toch Uw oor opmerkzaam zijn op het gebed van Uw dienaar, en op het gebed van Uw dienaren, die ernaar verlangen Uw Naam te vrezen; en laat het Uw dienaar vandaag toch goed lukken, en geef hem barmhartigheid voor het aangezicht van deze man. Ik was namelijk de schenker van de koning.", "Hand 7:55": "Maar hij, vol van de Heilige Geest, hield de ogen gericht naar de hemel, en zag de heerlijkheid van God, en Jezus, staande aan de rechterhand van God.", "Lev 8:2": "Neem Aäron en zijn zonen met hem, en de kleren, en de zalfolie, ook de stier van het zondoffer, en de twee rammen, en de korf met de ongezuurde broden;", "2 Kon 6:8-12": "En de koning van Syrië voerde oorlog tegen Israël, en overlegde met zijn knechten, en zei: Mijn legerplaats zal zijn bij die en die plaats. Maar de man van God zond bericht aan de koning van Israël, en zei: Wacht u ervoor dat u door die plaats trekt, want de Syriërs zijn daarheen afgekomen. Daarom zond de koning van Israël bericht naar die plaats, waarover de man van God hem gezegd en gewaarschuwd had, en hij wachtte zich daar, niet één keer, en niet twee keer.", "Hand 21:4": "En wij vonden de discipelen en bleven daar zeven dagen; die zeiden door de Geest tegen Paulus dat hij niet naar Jeruzalem moest gaan.", "Gen 40:8-23": "En zij zeiden tegen hem: Wij hebben een droom gehad, en er is niemand die hem uitlegt. En Jozef zei tegen hen: Zijn de uitleggingen niet van God? Vertel ze mij toch. Toen vertelde de leider van de schenkers Jozef zijn droom, en zei tegen hem: In mijn droom, zie, was een wijnstok voor mij; en aan de wijnstok waren drie ranken; en het was alsof hij uitbotte, zijn bloesem kwam op, zijn trossen brachten rijpe druiven voort.", "1 Kon 22:28": "En Micha zei: Als u ooit in vrede terugkomt, dan heeft de HEERE niet door mij gesproken! Verder zei hij: Hoor, alle volken!", "1 Sam 9:22": "Samuel dan nam Saul en zijn knecht, en bracht hen in de kamer; en hij gaf hun de voornaamste plaats onder de genodigden; die nu waren ongeveer dertig man.", "2 Kron 8:14": "Hij stelde ook, naar de wijze van zijn vader David, de verdelingen van de priesters aan over hun dienst, en van de Levieten over hun taken, om God te prijzen en voor de priesters te dienen, naar de eis van elke dag; en de poortwachters in hun verdelingen, bij elke poort; want zo was het gebod van David, de man Gods.", "Mark 12:36": "Want David zelf heeft door de Heilige Geest gezegd: De Heere heeft gezegd tegen mijn Heere: Zit aan Mijn rechterhand, totdat Ik Uw vijanden tot een voetbank van Uw voeten gemaakt heb.", "Deut 28:17": "Vervloekt zal zijn uw korf, en uw baktrog.", "Joh 15:25": "Maar dit gebeurt, zodat het woord vervuld wordt dat in hun wet geschreven is: Zij hebben Mij zonder oorzaak gehaat.", "Jer 23:9": "Aangaande de profeten. Mijn hart wordt in mijn binnenste gebroken, al mijn beenderen beven; ik ben als een dronken man, en als een man die de wijn te boven gaat; vanwege de HEERE, en vanwege de woorden van Zijn heiligheid.", "Openb 22:6": "En hij zei tegen mij: Deze woorden zijn getrouw en waarachtig; en de Heere, de God van de heilige profeten, heeft Zijn engel gezonden om Zijn dienstknechten te tonen wat spoedig moet gebeuren.", "Dan 8:27": "Toen werd ik, Daniël, zwak, en was enige dagen ziek; daarna stond ik op, en deed het werk van de koning; en ik was ontzet over dit gezicht, maar niemand begreep het.", "Luk 1:70": "zoals Hij gesproken heeft door de mond van Zijn heilige profeten, die er van oudsher geweest zijn;", "1 Kon 18:36": "En het gebeurde, toen men het spijsoffer offerde, dat de profeet Elia naderde en zei: HEERE, God van Abraham, Izak en Israël, laat het vandaag bekend worden, dat U God bent in Israël, en ik Uw knecht; en dat ik al deze dingen naar Uw woord gedaan heb.", "Ex 6:28": "Zo sprak de HEERE tot Mozes en zei: Ik ben de HEERE! Spreek tot Farao, de koning van Egypte, alles wat Ik tot u spreek.", "Ps 25:14": "Samech. De verborgenheid van de HEERE is voor hen die Hem vrezen; en Zijn verbond, om het hun bekend te maken.", "1 Sam 29:3": "Toen zeiden de leiders van de Filistijnen: Wat moeten deze Hebreeën hier? Zo zei Achis tegen de leiders van de Filistijnen: Is dit niet David, de knecht van Saul, de koning van Israël, die deze dagen of deze jaren bij mij geweest is? En ik heb in hem niets gevonden vanaf de dag dat hij bij mij gekomen is, tot op deze dag.", "Hand 21:11": "En hij kwam naar ons toe, nam de gordel van Paulus, bond daarmee zijn eigen handen en voeten, en zei: Dit zegt de Heilige Geest: De man van wie deze gordel is, zullen de Joden zo te Jeruzalem binden en overleveren in de handen van de heidenen.", "Luk 24:17": "En Hij zei tegen hen: Wat zijn dit voor gesprekken die u onderweg met elkaar voert, en waarom kijkt u zo droevig?", "1 Kron 27:27": "En over de wijngaarden was Simeï, de Ramathiet; maar over wat van de wijnstokken kwam, tot de voorraden wijn, was Zabdi, de Sifmiet.", "Matt 14:10": "en hij stuurde iemand heen, en onthoofdde Johannes in de kerker.", "Deut 28:26": "En uw dode lichaam zal voedsel zijn voor alle vogels van de hemel, en voor de dieren van de aarde; en niemand zal ze verjagen.", "Num 6:15": "En een korf ongezuurde koeken, koeken van meelbloem, met olie gemengd, en ongezuurde vladen, met olie bestreken, alsook hun spijsoffer en hun drankoffers;", "Gen 39:23": "De leider van de gevangenis had geen omzien meer naar enig ding dat in zijn hand was, omdat de HEERE met hem was; en wat hij deed, dat deed de HEERE goed gedijen.", "1 Sam 3:1": "En de jongen Samuël diende de HEERE onder toezicht van Eli; en het woord van de HEERE was zeldzaam in die dagen; er was geen openbaar visioen.", "Ex 29:32": "Aäron nu en zijn zonen zullen het vlees van deze ram eten, en het brood, dat in de korf zal zijn, bij de deur van de tent van de samenkomst.", "Gen 41:15": "En Farao zei tegen Jozef: Ik heb een droom gedroomd, en er is niemand die hem kan uitleggen; maar ik heb van u horen zeggen, dat u een droom kunt horen en die kunt uitleggen.", "Num 11:17": "Dan zal Ik neerkomen en daar met u spreken; en van de Geest die op u is, zal Ik afnemen, en op hen leggen; en zij zullen met u de last van dit volk dragen, opdat u die niet alleen draagt.", "Gen 4:3": "En het gebeurde na verloop van enige dagen, dat Kaïn van de vrucht van het land de HEERE een offer bracht.", "2 Sam 9:1": "En David zei: Is er nog iemand die overgebleven is van het huis van Saul, zodat ik hem goedheid kan bewijzen, omwille van Jonathan?", "Luk 2:25-27": "En zie, er was een mens in Jeruzalem, wiens naam was Simeon; en deze mens was rechtvaardig en godvrezend, en verwachtte de vertroosting van Israël, en de Heilige Geest was op hem. En hem was door de Heilige Geest een goddelijke openbaring gedaan, dat hij de dood niet zien zou voordat hij de Christus van de Heere zou zien. En hij kwam door de Geest in de tempel. En toen de ouders het Kindje Jezus binnenbrachten, om naar de gewoonte van de wet met Hem te doen,", "Mark 6:27": "En de koning zond meteen een beul, en gebood zijn hoofd te brengen. Deze ging heen, en onthoofdde hem in de gevangenis;", "Deut 1:5": "Aan deze kant van de Jordaan, in het land Moab, begon Mozes deze wet uit te leggen, en zei:", "Zach 2:9": "Want zie, Ik zal Mijn hand over hen bewegen, en zij zullen hun knechten een roof wezen. Zo zult u weten, dat de HEERE van de heerscharen mij gezonden heeft.", "Hand 25:11": "Want als ik onrecht doe en iets gedaan heb dat de dood verdient, weiger ik niet te sterven; maar als er niets waar is van wat dezen mij beschuldigen, kan niemand mij uit gunst aan hen overgeven. Ik beroep mij op de keizer.", "Hand 24:12-21": "En zij hebben mij noch in de tempel gevonden met iemand in gesprek, of enige oploop van het volk makende, noch in de synagogen, noch in de stad; En zij kunnen niet bewijzen waarvan zij mij nu beschuldigen. Maar dit beken ik u, dat ik naar die weg, die zij een sekte noemen, de God van de vaderen zo dien, gelovend alles wat in de wet en in de profeten geschreven is;", "Dan 7:16": "Ik naderde tot een van hen die daar stonden, en vroeg hem naar de zekerheid over dit alles; en hij zei het mij, en
