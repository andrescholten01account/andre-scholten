 maakte mij de uitleg van deze zaken bekend.", "1 Sam 4:9": "Wees sterk, en gedraag u als mannen, Filistijnen, zodat u de Hebreeën niet gaat dienen, zoals zij u gediend hebben; wees dus mannen, en strijd.", "Dan 8:16": "En ik hoorde tussen de oevers van de Ulai een mensenstem, die riep en zei: Gabriël! leg deze man het gezicht uit.", "1 Kon 10:5": "en het voedsel van zijn tafel, en het zitten van zijn knechten, en het staan van zijn dienaren, en hun kleding, en zijn schenkers, en zijn opgang waarlangs hij naar boven ging in het huis van de HEERE, toen was er in haar geen geest meer.", "Hand 12:20": "En Herodes was zeer verbolgen op de Tyriërs en Sidoniërs; maar zij kwamen eensgezind naar hem toe, en nadat zij Blastus, de kamerheer van de koning, hadden overreed, vroegen zij om vrede, omdat hun land werd bevoorraad vanuit het land van de koning.", "Num 23:20": "Zie, ik heb opdracht ontvangen om te zegenen; omdat Hij zegent, zal ik het niet terugdraaien.", "Neh 9:30": "Doch U hebt geduld met hen gehad, vele jaren lang, en tegen hen getuigd door Uw Geest, door de dienst van Uw profeten, maar zij neigden hun oor niet; daarom hebt U hen gegeven in de hand van de volken van de landen.", "Jak 5:10": "Mijn broeders, neem als voorbeeld van het lijden en van de geduldigheid de profeten, die in de Naam van de Heere gesproken hebben.", "Gen 41:39": "Daarna zei Farao tegen Jozef: Omdat God u dit alles heeft bekendgemaakt, is er niemand zo verstandig en wijs als u.", "1 Kon 13:20": "En het gebeurde, terwijl zij aan tafel zaten, dat het woord van de HEERE kwam tot de profeet die hem had laten terugkeren;", "Luk 23:42": "En hij zei tegen Jezus: Heere, denk aan mij, wanneer U in Uw Koninkrijk gekomen bent.", "Luk 1:67": "En Zacharias, zijn vader, werd vervuld met de Heilige Geest, en profeteerde, en zei:", "Joël 2:29": "Ja, ook over de dienstknechten, en over de dienstmaagden, zal Ik in die dagen Mijn Geest uitgieten.", "Gen 40:19-22": "Binnen nog drie dagen zal Farao uw hoofd van u verheffen, en hij zal u aan een paal hangen, en het gevogelte zal uw vlees van u eten. En het gebeurde op de derde dag, de dag van Farao's geboorte, dat hij voor al zijn dienaren een maaltijd maakte; en hij verhief het hoofd van de leider van de schenkers, en het hoofd van de leider van de bakkers, te midden van zijn dienaren. En hij liet de leider van de schenkers terugkeren tot zijn schenkambt, zodat hij de beker in Farao's hand gaf.", "1 Kron 28:19": "Dit alles, zei David, heeft men mij door geschrift laten verstaan, van de hand van de HEERE, namelijk al de werken van deze bereiding.", "Jer 42:4": "En de profeet Jeremia zei tegen hen: Ik heb het gehoord; zie, ik zal tot de HEERE, uw God, bidden naar uw woorden; en het zal gebeuren, elk woord dat de HEERE u zal antwoorden, zal ik u bekendmaken, ik zal u niet één woord onthouden.", "Deut 5:31": "Maar u, sta hier bij Mij, dan zal Ik tot u spreken al de geboden, en inzettingen, en rechten, die u hun leren zult, opdat zij ze doen in het land dat Ik hun geven zal, om dat te erven.", "Jer 1:4-10": "Het woord van de HEERE dan kwam tot mij, en zei: Voordat Ik u in moeders buik vormde, heb Ik u gekend, en voordat u uit de baarmoeder voortkwam, heb Ik u geheiligd; Ik heb u de volken tot een profeet gesteld. Toen zei ik: Ach, Heere HEERE! zie, ik kan niet spreken, want ik ben jong.", "Ezra 5:2": "Toen maakten Zerubbabel, de zoon van Sealthiël, en Jesua, de zoon van Jozadak, zich op en begonnen het huis van God te bouwen, Dat te Jeruzalem woont; en met hen de profeten van God, die hen ondersteunden.", "Jer 52:31": "Het gebeurde daarna, in het zevenendertigste jaar van de gevankelijke wegvoering van Jojachin, de koning van Juda, in de twaalfde maand, op de vijfentwintigste van de maand, dat Evilmerodach, de koning van Babel, in het eerste jaar van zijn koninkrijk, het hoofd van Jojachin, de koning van Juda, verhief, en hem uit de gevangenis liet uitgaan.", "Dan 2:1-3": "In het tweede jaar van het koninkrijk van Nebukadnezar droomde Nebukadnezar dromen; daarvan raakte zijn geest verontrust, en zijn slaap week van hem. Toen zei de koning dat men de tovenaars, de sterrenkijkers, de guichelaars en de Chaldeeën zou roepen, om de koning zijn dromen bekend te maken; zij nu kwamen en gingen voor de koning staan. En de koning zei tegen hen: Ik heb een droom gedroomd, en mijn geest is onrustig om die droom te weten.", "Hand 8:29": "En de Geest zei tegen Filippus: Ga erheen, en voeg u bij deze wagen.", "1 Sam 1:8": "Toen zei Elkana, haar man: Hanna, waarom weent u, en waarom eet u niet, en waarom is uw hart bedroefd? Ben ik u niet beter dan tien zonen?", "2 Kon 2:9": "Het gebeurde nu, toen zij overgekomen waren, dat Elia zei tegen Elisa: Vraag wat ik voor u doen zal, voordat ik van bij u weggenomen word. En Elisa zei: Laat toch een dubbel deel van uw geest op mij zijn!", "Gen 37:5-10": "Ook droomde Jozef een droom, die hij aan zijn broers vertelde; daarom haatten zij hem nog meer. En hij zei tegen hen: Hoor toch deze droom, die ik gedroomd heb. En zie, wij waren schoven aan het binden in het midden van het veld; en zie, mijn schoof stond op en bleef ook staande; en zie, uw schoven kwamen eromheen staan en bogen zich neer voor mijn schoof.", "Rom 1:1": "Paulus, een dienstknecht van Jezus Christus, een geroepen apostel, afgezonderd tot het Evangelie van God,", "Jer 13:1-3": "Zo heeft de HEERE tegen mij gezegd: Ga heen, en koop u een linnen gordel, en doe die om uw middel, maar breng hem niet in het water. En ik kocht een gordel naar het woord van de HEERE, en ik deed die om mijn middel. Toen kwam het woord van de HEERE voor de tweede keer tot mij, en Hij zei:", "Neh 2:1": "Toen gebeurde het in de maand Nisan, in het twintigste jaar van koning Arthahsasta, als er wijn voor hem was, dat ik de wijn opnam en aan de koning gaf; nu was ik nooit eerder treurig geweest voor hem.", "Gen 40:20-22": "En het gebeurde op de derde dag, de dag van Farao's geboorte, dat hij voor al zijn dienaren een maaltijd maakte; en hij verhief het hoofd van de leider van de schenkers, en het hoofd van de leider van de bakkers, te midden van zijn dienaren. En hij liet de leider van de schenkers terugkeren tot zijn schenkambt, zodat hij de beker in Farao's hand gaf. Maar de leider van de bakkers hing hij op, zoals Jozef hun had uitgelegd.", "Obadja 1:1": "Het visioen van Obadja. Zo zegt de Heere HEERE van Edom: Wij hebben een bericht gehoord van de HEERE, en er is een gezant gestuurd onder de heidenvolken: Sta op, en laten wij tegen haar opstaan ten strijde.", "Ezech 3:27": "Maar als Ik met u spreken zal, zal Ik uw mond opendoen, en u zult tot hen zeggen: Zo zegt de Heere HEERE, wie hoort, laat hij horen, en wie het laat, laat hij het laten; want zij zijn een opstandig huis.", "Ex 24:16": "En de heerlijkheid van de HEERE woonde op de berg Sinaï, en de wolk bedekte hem zes dagen, en op de zevende dag riep Hij Mozes uit het midden van de wolk.", "Gal 4:25": "want Hagar is de berg Sinaï in Arabië, en komt overeen met het huidige Jeruzalem, dat met haar kinderen in dienstbaarheid is.", "Gen 39:20-23": "En Jozefs heer nam hem, en leverde hem over in de gevangenis, op de plaats waar de gevangenen van de koning gevangen zaten; zo was hij daar in de gevangenis. Maar de HEERE was met Jozef, en bewees hem Zijn goedertierenheid; en gaf hem genade in de ogen van de leider van de gevangenis. En de leider van de gevangenis gaf alle gevangenen die in de gevangenis waren in Jozefs hand; en alles wat zij daar deden, deed hij.", "2 Kon 6:17": "En Elisa bad, en zei: HEERE, open toch zijn ogen, dat hij ziet! En de HEERE opende de ogen van de knecht, dat hij zag; en zie, de berg was vol vurige paarden en wagens rondom Elisa.", "Gen 39:14": "dat zij de mensen van haar huis riep, en tegen hen zei: Ziet, hij heeft ons de Hebreeuwse man binnengebracht, om met ons te spotten; hij is bij mij gekomen om bij mij te liggen, en ik heb met luide stem geroepen;", "1 Sam 16:13": "Toen nam Samuël de oliehoorn, en zalfde hem te midden van zijn broers. En de Geest van de HEERE kwam vanaf die dag over David, en bleef. Daarna stond Samuël op, en ging naar Rama.", "1 Sam 8:13": "En uw dochters zal hij nemen tot apothekeressen, en tot keukenmeiden, en tot baksters.", "1 Kon 14:5": "Maar de HEERE zei tegen Ahia: Zie, Jerobeams vrouw komt om u iets te vragen over haar zoon, want hij is ziek. Zo en zo zult u tot haar spreken, en het zal gebeuren, als zij binnenkomt, dat zij zich als een andere vrouw zal voordoen.", "Hand 25:10": "En Paulus zei: Ik sta voor de rechterstoel van de keizer, waar ik geoordeeld moet worden; de Joden heb ik geen onrecht gedaan, zoals u ook zeer goed weet.", "Deut 21:23": "Dan zal zijn dode lichaam niet aan het hout overnachten; maar u zult hem beslist diezelfde dag begraven; want een opgehangene is door God vervloekt. Zo zult u uw land niet verontreinigen, dat de HEERE, uw God, u als erfdeel geeft.", "Est 7:10": "Zo hingen zij Haman aan de galg, die hij voor Mordechai had laten maken; en de grimmigheid van de koning werd gestild.", "Ezech 33:22": "Nu was de hand van de HEERE 's avonds op mij geweest, voordat wie ontkomen was kwam, en Hij had mijn mond geopend, totdat hij 's morgens tot mij kwam. Zo werd mijn mond geopend, en ik was niet meer stom.", "Est 6:1": "Diezelfde nacht kon de koning niet slapen, en hij zei dat men het boek van de gedenkwaardigheden, de kronieken, moest brengen; en die werden voorgelezen in de tegenwoordigheid van de koning.", "Ezech 3:24": "Toen kwam de Geest in mij, en stelde mij op mijn voeten, en Hij sprak met mij, en zei tot mij: Ga, sluit u binnen in uw huis.", "Job 33:14-16": "Maar God spreekt eens of tweemaal; doch men let daar niet op. In de droom, door het gezicht 's nachts, als een diepe slaap op de mensen valt, in de sluimering op het leger; Dan openbaart Hij het voor het oor der mensen, en Hij verzegelt hun kastijding;", "Mark 6:21": "En toen er een gunstige dag gekomen was, toen Herodes op zijn verjaardag een maaltijd gaf voor zijn hoogwaardigheidsbekleders, en de aanvoerders over duizend, en de voornaamsten van Galilea;", "Richt 6:34": "Toen bekleedde de Geest van de HEERE Gideon, en hij blies op de bazuin, en de Abiëzrieten werden achter hem bijeengeroepen.", "Joz 3:7": "Want de HEERE had tegen Jozua gezegd: Deze dag zal Ik beginnen u groot te maken voor de ogen van heel Israël, opdat zij weten dat Ik met u zal zijn, zoals Ik met Mozes geweest ben.", "2 Sam 23:3": "De God van Israël heeft gezegd, de Rotssteen van Israël heeft tot mij gesproken: Er zal een Heerser zijn over de mensen, een Rechtvaardige, een Heerser in de vreze van God.", "Gen 37:36": "En de Midianieten verkochten hem in Egypte, aan Potifar, een hoveling van de farao, leider van de lijfwacht.", "Jer 1:1": "De woorden van Jeremia, de zoon van Hilkia, uit de priesters die te Anathoth waren, in het land van Benjamin;", "Jes 6:1-9": "In het jaar dat koning Uzzia stierf, zag ik de Heere zitten op een hoge en verheven troon, en Zijn zomen vulden de tempel. De serafs stonden boven Hem; ieder had zes vleugels; met twee bedekte ieder zijn gezicht, en met twee bedekte hij zijn voeten, en met twee vloog hij. En de een riep tot de ander en zei: Heilig, heilig, heilig is de HEERE van de heerscharen! De hele aarde is vol van Zijn heerlijkheid!", "Spr 27:4": "Grimmigheid en overloping van toorn is wreedheid; maar wie zal voor jaloezie standhouden?", "Richt 7:13-15": "Toen Gideon nu aankwam, zie, daar was een man die aan zijn metgezel een droom vertelde, en zei: Zie, ik heb een droom gehad, en zie, een geroosterd gerstebrood tuimelde het leger van de Midianieten in, en het kwam tot aan de tent, en sloeg ertegen, zodat zij viel, en keerde haar ondersteboven, zodat de tent daar plat lag. En zijn metgezel antwoordde en zei: Dit is niets anders dan het zwaard van Gideon, de zoon van Joas, de Israëlitische man; God heeft de Midianieten en dit hele leger in zijn hand gegeven. En het gebeurde, toen Gideon het vertellen van deze droom, en de uitleg ervan, hoorde, dat hij aanbad; en hij keerde terug naar het leger van Israël, en zei: Maak u op, want de HEERE heeft het leger van de Midianieten in uw hand gegeven.", "Est 1:9": "De koningin Vasthi gaf ook een maaltijd voor de vrouwen in het koninklijk huis van de koning Ahasveros.", "Deut 26:2": "dan zult u van de eerstelingen van alle vrucht van het land nemen, die u opbrengt van uw land dat de HEERE, uw God, u geeft, en zult ze in een korf leggen; en u zult gaan naar de plaats die de HEERE, uw God, zal uitkiezen om Zijn Naam daar te doen wonen;", "Dan 6:23": "Mijn God heeft Zijn engel gezonden, en Hij heeft de bek van de leeuwen dichtgehouden, zodat zij mij niet beschadigd hebben, omdat voor Zijn aangezicht onschuld in mij gevonden is; en ook heb ik, o koning, tegen u geen misdaad begaan.", "Num 24:15": "Toen hief hij zijn spreuk op en zei: Bileam, de zoon van Beor, spreekt, en die man wiens ogen geopend zijn, spreekt!", "Gen 41:11-13": "En in één nacht droomden wij een droom, ik en hij; wij droomden ieder naar de uitleg van zijn droom. En daar was bij ons een Hebreeuwse jongeman, een knecht van de leider van de lijfwacht; en wij vertelden ze aan hem, en hij legde ons onze dromen uit; ieder legde hij ze uit, naar zijn droom. En zoals hij ons uitlegde, zo is het gebeurd; mij heeft hij hersteld in mijn functie, en hem opgehangen.", "Jer 38:10": "Toen gebood de koning de Moorman Ebed-Melech: Neem van hier dertig mannen met u mee, en haal de profeet Jeremia op uit de kuil, voordat hij sterft.", "Dan 4:5": "Toen zag ik een droom, die mij bang maakte, en de gedachten die ik op mijn bed had, en de visioenen van mijn hoofd verontrustten mij."}, "noten": {"1": "SV: bottende. D.i.: uitlopen, ontluiken (van een plant)."}, "koppeling": {"1": "<span class=\"wl\" data-l=\"L1\" data-code=\"H1961\">En</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H1961\">het</span> gebeurde <span class=\"wl\" data-l=\"L2\" data-code=\"H310\">na</span> <span class=\"wl\" data-l=\"L3\" dat </span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt</span> and his <span class=\"wl wl-kjv\" data-code=\"H644\">baker</span> had <span class=\"wl wl-kjv\" data-code=\"H2398\">offended</span> their <span class=\"wl wl-kjv\" data-code=\"H113\">lord</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of Egypt.", "2": "And <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh</span> was <span class=\"wl wl-kjv\" data-code=\"H7107\">wroth</span> <span class=\"wl wl-kjv\" data-code=\"H5921\">against</span> <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> of his <span class=\"wl wl-kjv\" data-code=\"H5631\">officers,</span> against the <span class=\"wl wl-kjv\" data-code=\"H8269\">chief</span> of the <span class=\"wl wl-kjv\" data-code=\"H8248\">butlers,</span> and against the <span class=\"wl wl-kjv\" data-code=\"H8269\">chief</span> of the bakers.", "3": "And he <span class=\"wl wl-kjv\" data-code=\"H5414\">put</span> them in <span class=\"wl wl-kjv\" data-code=\"H4929\">ward</span> in the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H8269\">captain</span> of the <span class=\"wl wl-kjv\" data-code=\"H2876\">guard,</span> into the <span class=\"wl wl-kjv\" data-code=\"H1004\">prison,</span> the <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> where <span class=\"wl wl-kjv\" data-code=\"H3130\">Joseph</span> was bound.", "4": "And the <span class=\"wl wl-kjv\" data-code=\"H8269\">captain</span> of the <span class=\"wl wl-kjv\" data-code=\"H2876\">guard</span> <span class=\"wl wl-kjv\" data-code=\"H6485\">charged</span> <span class=\"wl wl-kjv\" data-code=\"H3130\">Joseph</span> with them, and he <span class=\"wl wl-kjv\" data-code=\"H8334\">served</span> them: and they continued a <span class=\"wl wl-kjv\" data-code=\"H3117\">season</span> in ward.", "5": "And they <span class=\"wl wl-kjv\" data-code=\"H2492\">dreamed</span> a <span class=\"wl wl-kjv\" data-code=\"H2472\">dream</span> both of <span class=\"wl wl-kjv\" data-code=\"H8147\">them,</span> each <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> his <span class=\"wl wl-kjv\" data-code=\"H2472\">dream</span> in <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H3915\">night,</span> each <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> according to the <span class=\"wl wl-kjv\" data-code=\"H6623\">interpretation</span> of his <span class=\"wl wl-kjv\" data-code=\"H2472\">dream,</span> the <span class=\"wl wl-kjv\" data-code=\"H8248\">butler</span> and the <span class=\"wl wl-kjv\" data-code=\"H644\">baker</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> which were <span class=\"wl wl-kjv\" data-code=\"H631\">bound</span> in the <span class=\"wl wl-kjv\" data-code=\"H1004\">prison.</span>", "6": "And <span class=\"wl wl-kjv\" data-code=\"H3130\">Joseph</span> came <span class=\"wl wl-kjv\" data-code=\"H935\">in</span> unto them in the <span class=\"wl wl-kjv\" data-code=\"H1242\">morning,</span> and <span class=\"wl wl-kjv\" data-code=\"H7200\">looked</span> upon them, and, behold, they were sad.", "7": "And he <span class=\"wl wl-kjv\" data-code=\"H7592\">asked</span> <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh's</span> <span class=\"wl wl-kjv\" data-code=\"H5631\">officers</span> that were with him in the <span class=\"wl wl-kjv\" data-code=\"H4929\">ward</span> of his <span class=\"wl wl-kjv\" data-code=\"H113\">lord's</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Wherefore <span class=\"wl wl-kjv\" data-code=\"H6440\">look</span> ye so <span class=\"wl wl-kjv\" data-code=\"H7451\">sadly</span> to day?", "8": "And they <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, We have <span class=\"wl wl-kjv\" data-code=\"H2492\">dre /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
