d worden, een planting van de HEERE, opdat Hij verheerlijkt wordt.", "Gen 13:18": "En Abram sloeg zijn tenten op, en kwam en woonde bij de eikenbossen van Mamre, die bij Hebron zijn; en hij bouwde daar de HEERE een altaar.", "1 Petr 2:9": "Maar u bent een uitverkoren geslacht, een koninklijk priesterschap, een heilig volk, een volk dat God Zich verworven heeft; opdat u de deugden zou verkondigen van Hem Die u uit de duisternis geroepen heeft tot Zijn wonderbaar licht;", "Num 1:20-46": "Zo waren de zonen van Ruben, de eerstgeborene van Israël, hun geboorten, naar hun geslachten, naar het huis van hun vaderen, in het getal van de namen, hoofd voor hoofd, al wat mannelijk was, van twintig jaar oud en daarboven, allen die ten leger uittrokken; Hun getelden van de stam van Ruben waren zesenveertigduizend vijfhonderd. Van de zonen van Simeon, hun geboorten, naar hun geslachten, naar het huis van hun vaderen, hun getelden, in het getal van de namen, hoofd voor hoofd, al wat mannelijk was, van twintig jaar oud en daarboven, allen die ten leger uittrokken;", "1 Sam 21:13": "Daarom veranderde hij zijn gelaat voor hun ogen, en hij deed zichzelf gek voor onder hun handen; en hij krabbelde op de deuren van de poort, en hij liet zijn kwijl in zijn baard aflopen.", "Ef 5:19": "en spreek onder elkaar met psalmen, en lofzangen, en geestelijke liederen, terwijl u zingt en psalmt voor de Heere in uw hart,", "Joël 2:15-17": "Waait op de bazuin te Sion, heiligt een vasten, roept een verbodsdag uit. Verzamelt het volk, heiligt de gemeente, vergadert de oudsten, verzamelt de kinderen, en wie de borsten zuigen; de bruidegom ga uit zijn binnenkamer, en de bruid uit haar slaapkamer. Laat de priesters, de dienaars van de HEERE, wenen tussen het voorhuis en het altaar, en laat hen zeggen: Spaar Uw volk, o HEERE! en geef Uw erfenis niet over tot een smaad, dat de heidenen over hen zouden heersen; waarom zouden zij onder de volken zeggen: Waar is hun God?", "Ps 55:15": "Wij die samen in zoetheid heimelijk raadpleegden; wij wandelden in gezelschap naar het huis van God.", "Deut 12:11": "Dan zal er een plaats zijn die de HEERE, uw God, zal uitkiezen om Zijn Naam daar te doen wonen; daarheen zult u brengen alles wat ik u gebied: uw brandoffers, en uw slachtoffers, uw tienden, en het hefoffer van uw hand, en alle beste keuze van uw geloften, die u de HEERE beloven zult.", "Matt 12:33": "Of maak de boom goed en zijn vrucht goed; of maak de boom slecht en zijn vrucht slecht; want aan de vrucht wordt de boom gekend.", "Ex 12:14": "En deze dag zal voor u een gedachtenis zijn, en u zult hem als een feest voor de HEERE vieren; u zult hem vieren onder uw geslachten, als een eeuwige inzetting.", "Num 28:24-31": "Van het achtervolgen van deze dingen zult u per dag, zeven dagen lang, het voedsel van het vuuroffer bereiden tot een liefelijke reuk voor de HEERE; boven dat voortdurende brandoffer zal het bereid worden, met zijn drankoffer. En op de zevende dag zult u een heilige samenkomst hebben; geen dienstwerk zult u doen. Ook op de dag van de eerstelingen, als u een nieuw spijsoffer de HEERE zult offeren naar uw weken, zult u een heilige samenkomst hebben; geen dienstwerk zult u doen.", "Lev 19:24": "Maar in het vierde jaar zal al zijn vrucht een heilig ding zijn, tot lofzegging voor de HEERE.", "Ps 116:1": "Ik heb Hem lief, want de HEERE hoort mijn stem, mijn smekingen;", "Ps 149:1": "Halleluja! Zing de HEERE een nieuw lied; Zijn lof zij in de gemeente van Zijn gunstgenoten.", "Gen 48:4": "en Hij heeft tegen mij gezegd: Zie, Ik zal u vruchtbaar maken, en u vermenigvuldigen, en u tot een menigte van volken maken; en Ik zal aan uw nageslacht na u dit land tot een eeuwig bezit geven.", "1 Sam 10:2": "Als u vandaag van mij weggaat, zult u twee mannen vinden bij het graf van Rachel, aan de grens van Benjamin, te Zelzah; die zullen tegen u zeggen: De ezelinnen zijn gevonden, die u bent gaan zoeken, en zie, uw vader heeft de zorg om de ezelinnen laten varen, en hij is bekommerd om u, en zegt: Wat zal ik doen voor mijn zoon?", "Ps 98:2": "De HEERE heeft Zijn heil bekendgemaakt; Hij heeft Zijn gerechtigheid geopenbaard voor de ogen van de heidenen.", "Ps 132:7": "Wij zullen in Zijn woningen ingaan, wij zullen ons neerbuigen voor de voetbank van Zijn voeten.", "Jes 26:8": "Wij hebben ook op de weg van Uw oordelen, U, o HEERE, verwacht; naar Uw Naam en naar Uw gedachtenis gaat het verlangen van onze ziel uit.", "1 Kor 12:31": "Streef daarom naar de beste gaven; en ik wijs u nog een weg, die voortreffelijker is.", "Ex 40:35": "Zodat Mozes niet in de tent der samenkomst kon ingaan, omdat de wolk daarop bleef, en de heerlijkheid van de HEERE de tabernakel vervulde.", "Rom 14:17": "Want het Koninkrijk van God is niet eten en drinken, maar rechtvaardigheid, en vrede, en blijdschap, door de Heilige Geest.", "1 Joh 2:5": "Maar wie Zijn Woord bewaart, in hem is werkelijk de liefde van God volmaakt geworden; hieraan weten wij, dat wij in Hem zijn.", "Ps 106:1": "Halleluja! Loof de HEERE, want Hij is goed, want Zijn goedertierenheid is voor eeuwig.", "Jes 3:18-21": "Op diezelfde dag zal de Heere wegnemen het sieraad van de kousebanden, en de netjes, en de maantjes, De reukdoosjes, en de kleine ketentjes, en de glinsterende kledingen, De hoofdkroning, en de armversierselen, en de bindselen, en de reukballetjes, en de oorringen,", "Ps 107:32": "En Hem verhogen in de gemeente van het volk, en Hem roemen in de vergadering van de oudsten.", "Ps 33:6": "Door het Woord van de HEERE zijn de hemelen gemaakt, en door de Geest van Zijn mond heel hun leger.", "Ex 1:5": "Alle zielen die uit Jakobs heup voortgekomen zijn, waren zeventig zielen; Jozef was echter al in Egypte.", "1 Tess 2:7": "maar wij zijn vriendelijk geweest in uw midden, zoals een voedster haar kinderen koestert;", "2 Sam 2:1": "Daarna gebeurde het, dat David de HEERE vroeg en zei: Zal ik optrekken in een van de steden van Juda? En de HEERE zei tegen hem: Trek op. En David zei: Waarheen zal ik optrekken? En Hij zei: Naar Hebron.", "Ps 47:5": "Hij kiest voor ons onze erfenis, de heerlijkheid van Jakob, die Hij heeft liefgehad. Sela.", "Ex 30:19-21": "Zodat Aäron en zijn zonen zich daarmee kunnen wassen, hun handen en voeten. Wanneer zij de tent van de samenkomst binnengaan, moeten zij zich met water wassen, zodat zij niet sterven; of wanneer zij tot het altaar naderen om te dienen, om het vuuroffer aan de HEERE aan te steken; Dan moeten zij hun handen en voeten wassen, zodat zij niet sterven; en dit zal voor hen een eeuwige instelling zijn, voor hem en zijn nageslacht, bij hun geslachten.", "Openb 18:4": "En ik hoorde een andere stem uit de hemel, die zei: Ga uit haar weg, Mijn volk, opdat u geen deel hebt aan haar zonden, en opdat u niet ontvangt van haar plagen.", "Gen 27:41": "En Ezau haatte Jakob om die zegen, waarmee zijn vader hem gezegend had; en Ezau zei in zijn hart: De dagen van rouw om mijn vader komen dichterbij, en ik zal mijn broer Jakob doden.", "Hebr 4:3": "Want wij die geloofd hebben, gaan de rust in, zoals Hij gezegd heeft: Zo heb Ik dan in Mijn toorn gezworen: Zij zullen Mijn rust niet ingaan! Hoewel Zijn werken al vanaf de grondlegging van de wereld volbracht waren.", "1 Tess 5:5": "U bent allen kinderen van het licht en kinderen van de dag; wij zijn niet van de nacht, en ook niet van de duisternis.", "Lev 26:1": "U zult voor uzelf geen afgoden maken; ook geen gesneden beeld of opgericht beeld zult u zich stellen, en geen gebeelde steen zult u in uw land zetten, om u daarvoor te buigen; want Ik ben de HEERE, uw God!", "Gen 35:1-7": "Daarna zei God tegen Jakob: Maak u op, trek op naar Bethel, en woon daar; en maak daar een altaar voor de God Die u verscheen, toen u vluchtte voor het aangezicht van uw broer Ezau. Toen zei Jakob tegen zijn huisgezin en tegen allen die bij hem waren: Doe de vreemde goden weg die in uw midden zijn, reinig u, en verander uw kleren; En laten wij ons opmaken en optrekken naar Bethel; en ik zal daar een altaar maken voor de God Die mij antwoordt op de dag van mijn benauwdheid, en met mij geweest is op de weg die ik gegaan heb.", "Lev 14:8": "Die nu te reinigen is, zal zijn kleren wassen, en al zijn haar afscheren, en zich in het water afwassen, dan zal hij rein zijn; daarna zal hij in het leger komen, maar zal buiten zijn tent zeven dagen blijven.", "Rom 2:28": "Want die is niet een Jood, die het in het openbaar is; en dat is ook niet de besnijdenis, die het in het openbaar in het vlees is;", "Hab 2:20": "Maar de HEERE is in Zijn heilige tempel. Zwijg voor Zijn aangezicht, heel de aarde!", "Rom 11:16": "En als de eerstelingen heilig zijn, dan is ook het deeg heilig, en als de wortel heilig is, dan zijn ook de takken heilig.", "Zach 14:21": "Ja, al de potten in Jeruzalem en in Juda zullen de HEERE van de heerscharen heilig zijn, zodat allen die willen offeren, zullen komen, en daarvan nemen, en daarin koken; en er zal geen Kanaäniet meer zijn in het huis van de HEERE van de heerscharen, op die dag.", "1 Kor 7:23": "U bent duur gekocht, word geen dienstknechten van mensen.", "Zef 2:3": "Zoekt de HEERE, alle zachtmoedigen van het land, die Zijn recht doen! Zoekt gerechtigheid, zoekt zachtmoedigheid, misschien zult u verborgen worden in de dag van de toorn van de HEERE.", "Hos 12:5": "Ja, hij gedroeg zich vorstelijk tegen de Engel, en kreeg de overhand op Hem; hij weende en smeekte Hem. Te Bethel vond hij Hem, en daar sprak Hij met ons;", "Ex 20:3-6": "U zult geen andere goden voor Mijn aangezicht hebben. U zult zich geen gesneden beeld maken, of enige gelijkenis van hetgeen boven in de hemel is, of van hetgeen beneden op de aarde is, of van hetgeen in het water onder de aarde is. U zult zich daarvoor niet buigen, en ze niet dienen; want Ik, de HEERE, uw God, ben een ijverig God, Die de misdaad van de vaders bezoek aan de kinderen, aan het derde en aan het vierde geslacht van hen die Mij haten;", "Ex 1:15-21": "Bovendien sprak de koning van Egypte tot de vroedvrouwen van de Hebreeuwse vrouwen, van wie de ene Sifra heette, en de andere Pua; en hij zei: Wanneer u de Hebreeuwse vrouwen bij de bevalling helpt, en u ziet hen op de baarstoelen; is het een zoon, dood hem dan; maar is het een dochter, laat haar dan leven! Maar de vroedvrouwen vreesden God, en deden niet wat de koning van Egypte tegen hen gezegd had, maar zij hielden de jongetjes in leven.", "Ef 5:3": "Maar hoererij en alle onreinheid, of hebzucht, laat onder u zelfs niet genoemd worden, zoals het de heiligen betaamt,", "1 Tess 5:18": "Dank God in alles; want dit is de wil van God in Christus Jezus over u.", "Ps 29:2": "Geef de HEERE de eer van Zijn Naam, aanbid de HEERE in de heerlijkheid van het heiligdom.", "Ps 65:5": "Gelukkig is hij, die U verkiest, en doet naderen, dat hij woont in Uw voorhoven; wij zullen verzadigd worden met het goed van Uw huis, met het heilige van Uw paleis.", "Zach 8:22": "Zo zullen veel volken, en machtige heidenvolken komen, om de HEERE van de heerscharen te Jeruzalem te zoeken, en om het aangezicht van de HEERE te smeken.", "Gen 46:18": "Dit zijn de zonen van Zilpa, die Laban aan zijn dochter Lea gegeven had; en zij baarde Jakob deze zestien zielen.", "Klaagl 2:12": "Lamed. Als zij tegen hun moeders zeggen: Waar is koren en wijn, als zij op de straten van de stad in onmacht zinken, als de verslagenen; als hun ziel zich uitschudt in de schoot van hun moeders.", "Jak 4:4": "Overspelers en overspeleressen, weet u niet dat de vriendschap met de wereld vijandschap tegen God is? Wie dan ook een vriend van de wereld wil zijn, wordt daarmee een vijand van God.", "Gen 48:3": "Daarna zei Jakob tegen Jozef: God de Almachtige is aan mij verschenen te Luz, in het land Kanaän, en Hij heeft mij gezegend;", "2 Kor 6:14-17": "Trek niet een ander juk aan met de ongelovigen; want wat heeft de gerechtigheid gemeen met de ongerechtigheid, en welke gemeenschap heeft het licht met de duisternis? En welke overeenstemming heeft Christus met Belial, of welk deel heeft de gelovige met de ongelovige? Of welke samenvoeging heeft de tempel van God met de afgoden? Want u bent de tempel van de levende God; zoals God gezegd heeft: Ik zal in hen wonen, en Ik zal onder hen wandelen; en Ik zal hun God zijn, en zij zullen Mij een volk zijn.", "Gen 27:2": "En hij zei: Zie toch, ik ben oud geworden, ik weet de dag van mijn dood niet.", "Lev 17:15": "En elke ziel onder de inboorlingen of onder de vreemdelingen, die een dood aas of het verscheurde zal gegeten hebben, die zal zijn kleren wassen, en zich met water baden, en onrein zijn tot aan de avond; daarna zal hij rein zijn.", "Ps 97:7": "Beschaamd moeten worden allen die de beelden dienen, die zich op afgoden beroemen; buig u neer voor Hem, alle goden!", "Matt 5:30": "En als uw rechterhand u ergert, hak hem af en werp hem van u; want het is beter voor u dat een van uw lichaamsdelen verloren gaat, en niet uw hele lichaam in de hel geworpen wordt.", "Ex 20:4": "U zult zich geen gesneden beeld maken, of enige gelijkenis van hetgeen boven in de hemel is, of van hetgeen beneden op de aarde is, of van hetgeen in het water onder de aarde is.", "1 Kor 8:1-13": "Wat betreft de dingen die aan de afgoden geofferd zijn: wij weten dat wij allemaal samen kennis hebben. De kennis maakt opgeblazen, maar de liefde sticht. En als iemand meent iets te weten, die heeft nog niets gekend, zoals men behoort te kennen. Maar als iemand God liefheeft, die is door Hem gekend.", "Mark 1:44": "en zei tegen hem: Zie erop toe dat u het niemand zegt; maar ga heen en laat uzelf aan de priester zien, en offer voor uw reiniging wat Mozes geboden heeft, hun tot een getuigenis.", "Ruth 4:16": "En Naomi nam dat kind en zette het op haar schoot, en werd zijn voedster.", "1 Tim 4:8": "Want de lichamelijke oefening is van weinig nut; maar de godvruchtigheid is nuttig voor alles, omdat zij de belofte heeft van het tegenwoordige en van het toekomende leven.", "Gal 5:22-25": "Maar de vrucht van de Geest is liefde, blijdschap, vrede, geduld, vriendelijkheid, goedheid, geloof, zachtmoedigheid, zelfbeheersing. Tegen zulke mensen is de wet niet. Maar wie van Christus zijn, hebben het vlees gekruisigd met zijn hartstochten en begeerten.", "Jer 11:13": "Want naar het getal van uw steden zijn uw goden geweest, o Juda! en naar het getal van de straten van Jeruzalem hebt u altaren gesteld voor die schaamte, altaren om Baäl te beroken.", "Ezech 36:25": "Dan zal Ik rein water op u sprenkelen, en u zult rein worden; van al uw onreinheden en van al uw drekgoden zal Ik u reinigen.", "Spr 21:29": "Een goddeloze man sterkt zich in zijn aangezicht; maar de oprechte, die maakt zijn weg vast.", "Ex 19:10-13": "Ook zei de HEERE tot Mozes: Ga tot het volk, en heilig hen heden en morgen, en laat hen hun kleren wassen, En gereed zijn tegen de derde dag; want op de derde dag zal de HEERE voor de ogen van al het volk neerkomen, op de berg Sinaï. En bepaal de grens voor het volk rondom, en zeg: Wacht ervoor de berg te beklimmen en de rand ervan aan te raken; al wie de berg aanraakt, zal zeker gedood worden.", "Gen 18:19": "Want Ik heb hem gekend, opdat hij zijn kinderen en zijn huis na hem zou opdragen, en zij de weg van de HEERE zouden bewaren, om gerechtigheid en recht te doen; opdat de HEERE over Abraham brengt wat Hij over hem gesproken heeft.", "Ps 57:2": "Wees mij genadig, o God! Wees mij genadig, want mijn ziel vertrouwt op U, en ik neem mijn toevlucht onder de schaduw van Uw vleugels, totdat de verdervingen voorbij zijn gegaan.", "Gen 28:18": "Toen stond Jakob 's morgens vroeg op, en hij nam de steen die hij als hoofdkussen gelegd had, en zette hem op als een opgericht teken, en goot er olie boven op.", "Richt 9:6": "Toen verzamelden zich alle burgers van Sichem, en het hele huis van Millo, en gingen heen en maakten Abimelech tot koning, bij de hoge eik die bij Sichem is.", "Ps 118:4": "Laten zij die de HEERE vrezen, nu zeggen, dat Zijn goedertierenheid voor eeuwig is.", "Ef 1:4": "Zoals Hij ons uitverkoren heeft in Hem, voor de grondlegging van de wereld, opdat wij heilig en onberispelijk zouden zijn voor Hem in de liefde;", "Ex 40:30-32": "Hij zette ook het wasvat tussen de tent der samenkomst en het altaar; en hij deed er water in om te wassen. En Mozes en Aäron en zijn zonen wasten daaruit hun handen en hun voeten. Als zij ingingen tot de tent der samenkomst, en als zij tot het altaar naderden, dan wasten zij zich, zoals de HEERE aan Mozes geboden had.", "Deut 5:7-9": "U zult geen andere goden voor Mijn aangezicht hebben. U zult u geen gesneden beeld maken, noch enige gelijkenis, van wat boven in de hemel is, of onder op de aarde is, of in het water onder de aarde is; u zult u voor die niet buigen, en hen niet dienen; want Ik, de HEERE, uw God, ben een ijverig God, Die de misdaad van de vaderen bezoek aan de kinderen, en aan het derde en aan het vierde lid van hen die Mij haten;", "Ef 5:4": "ook geen oneerbaarheid, geen zot geklap of grappenmakerij, wat niet betaamt; maar veelmeer dankzegging.", "Gen 25:17": "En dit zijn de jaren van het leven van Ismaël: honderdzevenendertig jaar; en hij gaf de geest, en stierf, en hij werd verzameld tot zijn volk.", "Gen 46:19": "De zonen van Rachel, Jakobs vrouw: Jozef en Benjamin.", "1 Petr 4:7": "En het einde van alle dingen is nabij; wees dan nuchter en waak in de gebeden.", "Jes 42:17": "Maar wie zich op gesneden beelden verlaten, die tegen de gegoten beelden zeggen: U bent onze goden; die zullen achteruit gedreven worden, en met schaamte beschaamd worden.", "1 Kor 6:10": "Vergis u niet; hoereerders, afgodendienaars, overspelers, ontuchtigen, mannen die bij mannen liggen, dieven, hebzuchtigen, dronkaards, geen lasteraars, geen rovers, zullen het Koninkrijk van God beërven.", "Num 7:12-89": "Hij nu die op de eerste dag zijn offergave bracht, was Nahesson, de zoon van Amminadab, voor de stam van Juda. En zijn offergave was: een zilveren schotel, waarvan het gewicht honderddertig sikkels was; een zilveren sprenkelschaal van zeventig sikkels, naar de sikkel van het heiligdom; beide vol meelbloem gemengd met olie, als spijsoffer; Een reukschaal van tien gouden sikkels, vol van het reukwerk;", "Gen 13:16": "En Ik zal uw nageslacht stellen als het stof van de aarde, zodat als iemand het stof van de aarde zal kunnen tellen, ook uw nageslacht geteld zal worden.", "1 Kron 27:16-22": "En over de stammen van Israël waren dezen: over de Rubenieten was Eliëzer, de zoon van Zichri, voorganger; over de Simeonieten was Sefatja, de zoon van Maächa; Over de Levieten was Hasabja, de zoon van Kemuël; over de Aäronieten was Zadok; Over Juda was Elihu, uit de broers van David; over Issaschar was Omri, de zoon van Michaël;", "Ps 119:108": "Laat U toch, o HEERE! welgevallen de vrijwillige offeranden van mijn mond, en leer mij Uw rechten.", "Deut 16:9-15": "Zeven weken zult u tellen; vanaf het moment dat men met de sikkel begint in het staande koren, zult u de zeven weken beginnen te tellen. Daarna zult u de HEERE, uw God, het feest van de weken houden; het zal een vrijwillige schatting van uw hand zijn, die u geven zult, naarmate de HEERE, uw God, u gezegend zal hebben. En u zult vrolijk zijn voor het aangezicht van de HEERE, uw God, u, en uw zoon, en uw dochter, en uw dienstknecht, en uw dienstmaagd, en de Leviet die in uw poorten is, en de vreemdeling, en de wees, en de weduwe die in uw midden zijn; in de plaats die de HEERE, uw God, zal uitkiezen om Zijn Naam daar te doen wonen.", "Lev 10:8-10": "En de HEERE sprak tegen Aäron: Wijn en sterke drank mag u niet drinken, u, en ook uw zonen niet, als u de tent van de samenkomst ingaat, zodat u niet sterft; het is een eeuwige inzetting onder uw generaties; En om onderscheid te maken tussen het heilige en het onheilige, en tussen het onreine en het reine;", "1 Sam 4:20": "En omstreeks het tijdstip van haar sterven zeiden de vrouwen die bij haar stonden: Wees niet bang, want u hebt een zoon gebaard. Maar zij antwoordde niet, en trok het zich niet aan.", "2 Joh 1:1": "De oudste aan de uitverkoren vrouw en aan haar kinderen, die ik in waarheid liefheb, en niet alleen ik, maar ook allen die de waarheid gekend hebben;", "Ex 28:36": "Verder zult u een plaat maken van zuiver goud, en u zult daarin graveren, zoals men de zegels graveert: HEILIGHEID VOOR DE HEERE!", "Lev 11:44": "Want Ik ben de HEERE, uw God; daarom zult u uzelf heiligen, en heilig zijn, omdat Ik heilig ben; en u zult uw ziel niet verontreinigen aan enig kruipend gedierte dat zich op de aarde beweegt.", "Jes 4:5": "En de HEERE zal over elke woning van de berg Sion, en over haar samenkomsten, een wolk scheppen overdag, en rook, en de glans van een vlammend vuur 's nachts; want over alles wat heerlijk is, zal een beschutting zijn.", "1 Kron 16:29": "Geeft de HEERE de eer van Zijn Naam, brengt offer, en komt voor Zijn aangezicht; aanbidt de HEERE in de heerlijkheid van het heiligdom.", "Ex 2:15": "Toen Farao deze zaak hoorde, zocht hij Mozes te doden; maar Mozes vluchtte voor Farao, en woonde in het land Midian, en hij ging bij een waterput zitten.", "Ps 73:1": "Een psalm van Asaf. Zeker, God is goed voor Israël, voor hen die rein van hart zijn.", "Richt 1:22-26": "En het huis van Jozef trok ook op naar Beth-el. En de HEERE was met hen. En het huis van Jozef stuurde verspieders naar Beth-el; de naam van deze stad was voorheen Luz. En de wachters zagen een man de stad uitgaan; en zij zeiden tegen hem: Wijs ons toch de ingang van de stad, en wij zullen goedheid bij u bewijzen.", "Jes 60:1": "Maak u op, word verlicht, want uw licht komt, en de heerlijkheid van de HEERE gaat over u op.", "1 Kor 3:16": "Weet u niet, dat u de tempel van God bent, en dat de Geest van God in u woont?", "Jes 57:2": "Hij zal ingaan in de vrede; zij zullen rusten op hun slaapsteden, ieder die in zijn oprechtheid gewandeld heeft.", "Joz 21:11": "Zo gaven zij hun de stad van Arba, de vader van Anok (dat is Hebron), op het gebergte van Juda, en de voorsteden rondom haar.", "Job 31:26-28": "Als ik het licht aangezien heb, wanneer het scheen, of de maan heerlijk voortgaande; En mijn hart verlokt is geweest in het verborgen, dat mijn hand mijn mond gekust heeft; Dat ware ook een misdaad bij de rechter; want ik zou de God van boven verzaakt hebben.", "1 Sam 15:35": "En Samuël zag Saul niet meer tot de dag van zijn dood toe; toch droeg Samuël leed om Saul; en het berouwde de HEERE, dat Hij Saul tot koning over Israël gemaakt had.", "Hand 7:8": "En Hij gaf hem het verbond van de besnijdenis; en zo verwekte Abraham Izak, en besneed hem op de achtste dag; en Izak verwekte Jakob, en Jakob de twaalf aartsvaders.", "Deut 30:10": "wanneer u de stem van de HEERE, uw God, gehoorzaam zult zijn, door Zijn geboden en Zijn inzettingen te houden, die in dit boek van de wet geschreven zijn; wanneer u zich zult bekeren tot de HEERE, uw God, met uw ganse hart en met uw ganse ziel.", "Ps 107:42": "De oprechten zien het, en zijn verblijd, maar alle ongerechtigheid stopt haar mond.", "Gen 31:3": "En de HEERE zei tegen Jakob: Keer terug naar het land van uw vaderen, en naar uw familie, en Ik zal met u zijn.", "Joh 13:10": "Jezus zei tegen hem: Wie gewassen is, heeft het niet nodig, behalve de voeten te wassen, maar is helemaal rein. En u bent rein, maar niet allen.", "Ps 98:1": "Een psalm. Zingt de HEERE een nieuw lied; want Hij heeft wonderen gedaan; Zijn rechterhand, en de arm van Zijn heiligheid, heeft Hem heil gegeven.", "Ex 34:23": "Al wat mannelijk is onder u zal driemaal in het jaar verschijnen voor het aangezicht van de Heere HEERE, de God van Israël.", "1 Kor 10:31": "Of u dus eet, of drinkt, of iets anders doet, doe alles tot eer van God.", "Ps 44:21": "Als wij de Naam van onze God hadden vergeten, en onze handen tot een vreemde god uitgebreid,", "Jes 40:31": "Maar wie de HEERE verwachten, zullen de kracht vernieuwen; zij zullen opvaren met vleugels, gelijk de arenden; zij zullen lopen, en niet moede worden; zij zullen wandelen, en niet mat worden.", "2 Kor 6:15": "En welke overeenstemming heeft Christus met Belial, of welk deel heeft de gelovige met de ongelovige?", "Gen 49:4": "Snelle afloop als van water, u zult niet de voortreffelijkste zijn! Want u hebt het bed van uw vader beklommen; toen hebt u het geschonden; hij heeft mijn bed beklommen!", "2 Kon 11:2": "Maar Joseba, de dochter van koning Joram, de zuster van Ahazia, nam Joas, de zoon van Ahazia, en stal hem uit het midden van de zonen van de koning die gedood werden. Zij zette hem en zijn voedster in een slaapkamer en verborg hem voor Athalia, zodat hij niet gedood werd.", "Rom 7:4": "Zo dan, mijn broeders, u bent ook voor de wet gedood door het lichaam van Christus, opdat u zou toebehoren aan een Ander, namelijk aan Hem Die van de doden opgewekt is, opdat wij voor God vruchten zouden dragen.", "Hand 15:29": "namelijk dat u zich onthoudt van hetgeen aan de afgoden geofferd is, en van bloed, en van het verstikte, en van hoererij; als u zich voor deze dingen wacht, zult u er goed aan doen. Vaarwel.", "Ex 40:12": "U zult ook Aäron en zijn zonen laten naderen tot de deur van de tent der samenkomst; en u zult hen met water wassen.", "Deut 1:8": "Zie, Ik heb dat land aan u gegeven; ga erin, en bezit erfelijk het land, dat de HEERE aan uw vaderen, Abraham, Izak en Jakob, gezworen heeft dat Hij het hun en hun nageslacht na hen geven zou.", "Deut 13:17": "Ook zal er niets van het verbannene aan uw hand kleven, opdat de HEERE Zich wendt van de hitte van Zijn toorn, en u barmhartigheid geeft, en Zich over u erbarmt, en u vermenigvuldigt, zoals Hij uw vaders gezworen heeft;", "2 Tess 2:13": "Maar wij zijn verplicht altijd God te danken voor u, broeders, die door de Heere bemind bent, dat God u van het begin af verkoren heeft tot zaligheid, in heiliging door de Geest, en geloof in de waarheid;", "Ps 105:11": "En zei: Ik zal u geven het land Kanaän, het snoer van uw erfdeel.", "Gen 23:2": "Sara stierf te Kiriath-arba, dat is Hebron, in het land Kanaän; en Abraham kwam om Sara te beklagen en haar te bewenen.", "Luk 2:8": "En er waren herders in diezelfde landstreek, die in het veld verbleven en 's nachts de wacht hielden over hun kudde.", "Ps 94:9": "Zou Hij, Die het oor plant, niet horen? Zou Hij, Die het oog vormt, niet zien?", "Gen 13:4": "tot de plaats van het altaar, dat hij daar eerst gemaakt had; en Abram heeft daar de Naam van de HEERE aangeroepen.", "Ps 119:1-3": "Aleph. Gelukkig zijn de oprechten van wandel, die in de wet van de HEERE gaan. Gelukkig zijn zij, die Zijn getuigenissen onderhouden, die Hem van ganser harte zoeken; Ook geen onrecht werken, maar wandelen in Zijn wegen.", "Num 8:6": "Neem de Levieten uit het midden van de kinderen van Israël, en reinig hen.", "Spr 22:1": "Een goede naam is verkieslijker dan grote rijkdom, goede gunst dan zilver en dan goud.", "Deut 11:28": "Maar de vloek, als u niet zult horen naar de geboden van de HEERE, uw God, en afwijkt van de weg, die ik u heden gebied, om andere goden na te wandelen, die u niet gekend hebt.", "Deut 30:17": "Maar als uw hart zich zal afwenden, en u niet horen zult, en u gedreven wordt om u voor andere goden te buigen, en die te dienen;"}, "noten": {}, "koppeling": {"1": "<span class=\"wl\" data-l=\"L1\" data-code=\"H559\">Daarna</span> zei <span class=\"wl\" data-l=\"L2\" data-code=\"H430\">God</span> tegen <span class=\"wl\" data-l=\"L3\" data-code=\"H3290\">Jakob</span>: <span class=\"wl\" data-l=\"L4\" data-code=\"H6965\">Maak</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H6965\">u</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H6965\">op</span>, <span class=\"wl\" data-l=\"L5\" data-code=\"H5927\">trek</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H5927\">op</span> naar Bethel, <span class=\"wl\" data-l=\"L6\" data-code=\"H3427\">en</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H3427\">woon</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H8033\">daar</span>; <span class=\"wl\" data-l=\"L8\" data-code=\"H6213\">en</span> <span class=\"wl\" data-l=\"L8\" data-c pan> go <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> to <span class=\"wl wl-kjv\" data-code=\"H1008\">Bethel,</span> and <span class=\"wl wl-kjv\" data-code=\"H3427\">dwell</span> there: and <span class=\"wl wl-kjv\" data-code=\"H6213\">make</span> there an <span class=\"wl wl-kjv\" data-code=\"H4196\">altar</span> unto <span class=\"wl wl-kjv\" data-code=\"H410\">God,</span> that <span class=\"wl wl-kjv\" data-code=\"H7200\">appeared</span> unto thee when thou <span class=\"wl wl-kjv\" data-code=\"H1272\">fleddest</span> from the <span class=\"wl wl-kjv\" data-code=\"H6440\">face</span> of <span class=\"wl wl-kjv\" data-code=\"H6215\">Esau</span> thy brother.", "2": "Then <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto his <span class=\"wl wl-kjv\" data-code=\"H1004\">household,</span> and to all that were with him, Put <span class=\"wl wl-kjv\" data-code=\"H5493\">away</span> the <span class=\"wl wl-kjv\" data-code=\"H5236\">strange</span> <span class=\"wl wl-kjv\" data-code=\"H430\">gods</span> that are among <span class=\"wl wl-kjv\" data-code=\"H8432\">you,</span> and be <span class=\"wl wl-kjv\" data-code=\"H2891\">clean,</span> and <span class=\"wl wl-kjv\" data-code=\"H2498\">change</span> your garments:", "3": "And let us <span class=\"wl wl-kjv\" data-code=\"H6965\">arise,</span> and go <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> to <span class=\"wl wl-kjv\" data-code=\"H1008\">Bethel;</span> and I will <span class=\"wl wl-kjv\" data-code=\"H6213\">make</span> there an <span class=\"wl wl-kjv\" data-code=\"H4196\">altar</span> unto <span class=\"wl wl-kjv\" data-code=\"H410\">God,</span> who <span class=\"wl wl-kjv\" data-code=\"H6030\">answered</span> me in the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of my <span class=\"wl wl-kjv\" data-code=\"H6869\">distress,</span> and was with me in the <span class=\"wl wl-kjv\" data-code=\"H1870\">way</spa  wl-kjv\" data-code=\"H416\">Elbethel:</span> because there <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H1540\">appeared</span> unto him, when he <span class=\"wl wl-kjv\" data-code=\"H1272\">fled</span> from the <span class=\"wl wl-kjv\" data-code=\"H6440\">face</span> of his brother.", "8": "But <span class=\"wl wl-kjv\" data-code=\"H1683\">Deborah</span> <span class=\"wl wl-kjv\" data-code=\"H7259\">Rebekah's</span> <span class=\"wl wl-kjv\" data-code=\"H3243\">nurse</span> <span class=\"wl wl-kjv\" data-code=\"H4191\">died,</span> and she was <span class=\"wl wl-kjv\" data-code=\"H6912\">buried</span> beneath <span class=\"wl wl-kjv\" data-code=\"H1008\">Bethel</span> under an <span class=\"wl wl-kjv\" data-code=\"H437\">oak:</span> and the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of it was <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> Allonbachuth.", "9": "And <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">appeared</span> unto <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> again, when he <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> out of <span class=\"wl wl-kjv\" data-code=\"H6307\">Padanaram,</span> and blessed", "10": "And <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, Thy <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> is <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob:</span> thy <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> shall not be <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> any more <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob,</span> but <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> shall be thy <span class=\"wl wl-kjv\" data-code=\"H8034\">name:</span> and he <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> his <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> Israel.", "11": "And <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, I am <span class=\"wl wl-kjv\" data-code=\"H410\">God</span> <span class=\"wl wl-kjv\" data-code=\"H7706\">Almighty:</span> be <span class=\"wl wl-kjv\" data-code=\"H6509\">fruitful</span> and <span class=\"wl wl-kjv\" data-code=\"H7235\">multiply;</span> a <span class=\"wl wl-kjv\" data-code=\"H1471\">nation</span> and a <span class=\"wl wl-kjv\" data-code=\"H6951\">company</span> of <span class=\"wl wl-kjv\" data-code=\"H1471\">nations</span> shall be of thee, and <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> shall <span class=\"wl wl-kjv\" data-code=\"H3318\">come</span> out of thy loins;", "12": "And the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> which I <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham</span> and <span class=\"wl wl-kjv\" data-code=\"H3327\">Isaac,</span> to thee I will give <span class=\"wl wl-kjv\" data-code=\"H5414\">it,</span> and to thy <span class=\"wl wl-kjv\" data-code=\"H2233\">seed</span> after <span class=\"wl wl-kjv\" data-code=\"H310\">thee</span> will I <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> the land.", "13": "And <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> went <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> from him in the <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> where he talked", "14": "And <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> set <span class=\"wl wl-kjv\" data-code=\"H5324\">up</span> a <span class=\"wl wl-kjv\" data-code=\"H4676\">pillar</span> in the <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> where he <span class=\"wl wl-kjv\" data-code=\"H1696\">talked</span> with him, even a <span class=\"wl wl-kjv\" data-code=\"H4678\">pillar</span> of <span class=\"wl wl-kjv\" data-code=\"H68\">stone:</span> and he <span class=\"wl wl-kjv\" data-code=\"H5258\">poured</span> a drink <span class=\"wl wl-kjv\" data-code=\"H5262\">offering</span> thereon, and he <span class=\"wl wl-kjv\" data-code=\"H3332\">poured</span> oil", "15": "And <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of the <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> where <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> with him, Bethel.", "16": "And they <span class=\"wl wl-kjv\" data-code=\"H5265\">journeyed</span> from <span class=\"wl wl-kjv\" data-code=\"H1008\">Bethel;</span> and there was <span class=\"wl wl-kjv\" data-code=\"H5750\">but</span> a <span class=\"wl wl-kjv\" data-code=\"H3530\">little</span> <span class=\"wl wl-kjv\" data-code=\"H776\">way</span> to <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> to <span class=\"wl wl-kjv\" data-code=\"H672\">Ephrath:</span> and <span class=\"wl wl-kjv\" data-code=\"H7354\">Rachel</span> <span class=\"wl wl-kjv\" data-code=\"H3205\">travailed,</span> and she had <span class=\"wl wl-kjv\" data-code=\"H7185\">hard</span> labour.", "17": "And it came to pass, when she was in <span class=\"wl wl-kjv\" data-code=\"H7185\">hard</span> <span class=\"wl wl-kjv\" data-code=\"H3205\">labour,</span> that the <span class=\"wl wl-kjv\" data-code=\"H3205\">midwife</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto her, <span class=\"wl wl-kjv\" data-code=\"H3372\">Fear</span> not; thou shalt have this son", "18": "And it came to pass, as her <span class=\"wl wl-kjv\" data-code=\"H5315\">soul</span> was in <span class=\"wl wl-kjv\" data-code=\"H3318\">departing,</span> (for she <span class=\"wl wl-kjv\" data-code=\"H4191\">died</span>) that she <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> his <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> <span class=\"wl wl-kjv\" data-code=\"H1126\">Benoni:</span> but his <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> him Benjamin.", "19": "And <span class=\"wl wl-kjv\" data-code=\"H7354\">Rachel</span> <span class=\"wl wl-kjv\" data-code=\"H4191\">died,</span> and was <span class=\"wl wl-kjv\" data-code=\"H6912\">buried</span> in the <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> to <span class=\"wl wl-kjv\" data-code=\"H672\">Ephrath,</span> which is Bethlehem.", "20": "And <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> <span class=\"wl wl-kjv\" data-code=\"H5324\">set</span> a <span class=\"wl wl-kjv\" data-code=\"H4676\">pillar</span> upon her <span class=\"wl wl-kjv\" data-code=\"H6900\">grave:</span> that is the <span class=\"wl wl-kjv\" data-code=\"H4678\">pillar</span> of <span class=\"wl wl-kjv\" data-code=\"H7354\">Rachel's</span> <span class=\"wl wl-kjv\" data-code=\"H6900\">grave</span> unto this day.", "21": "And <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H5265\">journeyed,</span> and <span class=\"wl wl-kjv\" data-code=\"H5186\">spread</span> his <span class=\"wl wl-kjv\" data-code=\"H168\">tent</span> <span class=\"wl wl-kjv\" data-code=\"H1973\">beyond</span> the <span class=\"wl wl-kjv\" data-code=\"H4026\">tower</span> of Edar.", "22": "And it came to pass, when <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H7931\">dwelt</span> in that <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> that <span class=\"wl wl-kjv\" data-code=\"H7205\">Reuben</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> and <span class=\"wl wl-kjv\" data-code=\"H7901\">lay</span> with <span class=\"wl wl-kjv\" data-code=\"H1090\">Bilhah</span> his <span class=\"wl wl-kjv\" data-code=\"H1\">father's</span> <span class=\"wl wl-kjv\" data-code=\"H6370\">concubine:</span> and <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> it. Now the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> were <span class=\"wl wl-kjv\" data-code=\"H8147\">twelve:</span>", "23": "The <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H3812\">Leah;</span> <span class=\"wl wl-kjv\" data-code=\"H7205\">Reuben,</span> <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob's</span> <span class=\"wl wl-kjv\" data-code=\"H1060\">firstborn,</span> and <span class=\"wl wl-kjv\" data-code=\"H8095\">Simeon,</span> and <span class=\"wl wl-kjv\" data-code=\"H3878\">Levi,</span> and <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> and <span class=\"wl wl-kjv\" data-code=\"H3485\">Issachar,</span> and Zebulun:", "24": "The <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H7354\">Rachel;</span> <span class=\"wl wl-kjv\" data-code=\"H3130\">Joseph,</span> and Benjamin:", "25": "And the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H1090\">Bilhah,</span> <span class=\"wl wl-kjv\" data-code=\"H7354\">Rachel's</span> <span class=\"wl wl-kjv\" data-code=\"H8198\">handmaid;</span> <span class=\"wl wl-kjv\" data-code=\"H1835\">Dan,</span> and Naphtali:", "26": "And the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H2153\">Zilpah,</span> <span class=\"wl wl-kjv\" data-code=\"H3812\">Leah's</span> <span class=\"wl wl-kjv\" data-code=\"H8198\">handmaid;</span> <span class=\"wl wl-kjv\" data-code=\"H1410\">Gad,</span> and <span class=\"wl wl-kjv\" data-code=\"H836\">Asher:</span> these are the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob,</span> which were <span class=\"wl wl-kjv\" data-code=\"H3205\">born</span> to him in Padanaram.", "27": "And <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> unto <span class=\"wl wl-kjv\" data-code=\"H3327\">Isaac</span> his <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> unto <span class=\"wl wl-kjv\" data-code=\"H4471\">Mamre,</span> unto the city of <span class=\"wl wl-kjv\" data-code=\"H7153\">Arbah,</span> which is <span class=\"wl wl-kjv\" data-code=\"H2275\">Hebron,</span> where <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham</span> and <span class=\"wl wl-kjv\" data-code=\"H3327\">Isaac</span> sojourned.", "28": "And the <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> of <span class=\"wl wl-kjv\" data-code=\"H3327\">Isaac</span> were an <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> and <span class=\"wl wl-kjv\" data-code=\"H8084\">fourscore</span> years.", "29": "And <span class=\"wl wl-kjv\" data-code=\"H3327\">Isaac</span> gave up the <span class=\"wl wl-kjv\" data-code=\"H1478\">ghost,</span> and <span class=\"wl wl-kjv\" data-code=\"H4191\">died,</span> and was <span class=\"wl wl-kjv\" data-code=\"H622\">gathered</span> unto his <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> being <span class=\"wl wl-kjv\" data-code=\"H2205\">old</span> and <span class=\"wl wl-kjv\" data-code=\"H7649\">full</span> of <span class=\"wl wl-kjv\" data-code=\"H3117\">days:</span> and his <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> <span class=\"wl wl-kjv\" data-code=\"H6215\">Esau</span> and <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> buried"}};
const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"
const ZELF = D.meta.zelf_abbr;      // afkorting binnen dit hoofdstuk, bv. "Joh 3"
const BASIS_URL = D.meta.basis_url;
const PARALLEL_VOLGORDE = ['SVnu', 'SV', 'KJV'];
let vertaling = 'SVnu';
let openVers = null;

const bijbel = document.getElementById('bijbel');
const popup = document.getElementById('popup');
const toast = document.getElementById('toast');
const nummers = Object.keys(D.vertalingen.SVnu);

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling', 'Matthew Henry-verklaring']],
  ['Geloofsbelijdenissen', ['1689 Baptist Confession', 'Westminster Confession']],
  ['Boeken', ['Institutie — Calvijn', 'A Body of Divinity — Watson']],
  ['Preken', ['Spurgeon']],
  ['Devotionals', ['Spurgeon']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    const heeftB = D.koppeling && D.koppeling[n];
    const heeftK = D.koppeling_kjv && D.koppeling_kjv[n];
    let h = '<div class="verg-kop">Grondwoorden</div>';
    if (!heeftB && !heeftK) {
      h += '<em>Nog geen woordkoppeling voor dit vers.</em>';
    } else {
      if (heeftB) h += `<div class="tsk-kop">SVnu</div>` +
        `<div class="gw-tekst" style="font-family:Georgia,serif;line-height:1.8">${D.koppeling[n]}</div>` +
        `<div class="gw-detail" style="margin-top:.5rem"></div>`;
      if (heeftK) h += `<div class="tsk-kop" style="margin-top:.9rem">KJV</div>` +
        `<div class="gw-tekst" style="font-family:Georgia,serif;line-height:1.8">${D.koppeling_kjv[n]}</div>` +
        `<div class="gw-detail" style="margin-top:.5rem"></div>`;
      h += '<div class="bronregel">Klik op een onderstreept woord voor de vindplaatsen.</div>';
    }
    h += '<div class="verg-kop" style="margin-top:1.4rem">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const berea = D.tsk[n], engels = D.tsk_kjv[n];
    if ((!berea || !berea.length) && (!engels || !engels.length)) return '<em>Geen verwijzingen bij dit vers.</em>';
    let h = '';
    if (berea && berea.length) {
      h += '<div class="tsk-kop">Treasury of Scripture Knowledge | SVnu</div>';
      h += berea.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r}">${r}</a>`).join('') + '</div>').join('');
    }
    if (engels && engels.length) {
      h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.tsk[n] && D.tsk[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vergelijk</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}
</script>
</body>
