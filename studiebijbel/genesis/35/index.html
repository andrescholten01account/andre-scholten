<style>

  .navselect { font-family:"Lora"; font-size:.85rem; border:1px solid var(--border); border-radius:999px; padding:.3rem 1.6rem .3rem .8rem; background:#fff; color:var(--accent-donker); cursor:pointer; display:inline-flex; align-items:center; text-decoration:none; }

  /* verzen — tabsmodus (één kolom) */
  .vers { position: relative; display: flex; gap: .8rem; padding: .45rem 2.4rem .45rem .4rem; border-radius: 8px; cursor: pointer; }
  .vers:hover { background: var(--bg-soft); }
  .vers.open { background: var(--bg-soft); box-shadow: inset 3px 0 0 var(--accent); border-radius: 8px 8px 0 0; }
  .vers.flits { animation: flits 1.6s ease-out; }
  @keyframes flits { 0% { background: #e0e0e0; } 100% { background: var(--bg-soft); } }

  .vtekst em, .pcel em { font-style: italic; color: #555; }

  .noot { color: var(--accent); cursor: pointer; font-weight: 700; padding: 0 .05rem; }

  .vers:hover .kopieer { opacity: .75; }
  .kopieer:hover { opacity: 1 !important; }

  #bijbel.parallel .vers { display:grid; gap:.8rem; cursor:pointer; align-items:start; }
  #bijbel.parallel .vnr { grid-row: 1; }
  .kolomkop { display:none; }
  #bijbel.parallel + .kolomkop, .kolomkop.tonen { }
  .pk { font-family:"Lora"; font-size:.72rem; text-transform:uppercase; letter-spacing:.12em; color:var(--accent-donker); font-weight:700; }

kob: Maak u op, trek op naar Bethel, en woon daar; en maak daar een altaar voor de God Die u verscheen, toen u vluchtte voor het aangezicht van uw broer Ezau.","2":"Toen zei Jakob tegen zijn huisgezin en tegen allen die bij hem waren: Doe de vreemde goden weg die in uw midden zijn, reinig u, en verander uw kleren;","3":"En laten wij ons opmaken en optrekken naar Bethel; en ik zal daar een altaar maken voor de God Die mij antwoordt op de dag van mijn benauwdheid, en met mij geweest is op de weg die ik gegaan heb.","4":"Toen gaven zij Jakob al die vreemde goden die in hun hand waren, en de oorringen die aan hun oren waren, en Jakob verborg ze onder de eikenboom die bij Sichem is.","5":"En zij reisden verder; en er kwam een schrik van God over de steden die rondom hen waren, zodat zij de zonen van Jakob niet achterna joegen.","6":"Zo kwam Jakob te Luz, dat in het land Kanaän is (dat is Bethel), hij en al het volk dat bij hem was.","7":"En hij bouwde daar een altaar, en noemde die plaats El-Bethel; want God was hem daar geopenbaard, toen hij voor het aangezicht van zijn broer vluchtte.","8":"En Debora, de voedster van Rebekka, stierf, en zij werd begraven onder aan Bethel, onder die eik, waarvan hij de naam Allon-Bachuth noemde.","9":"En God verscheen Jakob opnieuw, toen hij uit Paddan-Aram gekomen was; en Hij zegende hem.","10":"En God zei tegen hem: Uw naam is Jakob, uw naam zal voortaan niet Jakob genoemd worden, maar Israël zal uw naam zijn; en Hij noemde zijn naam Israël.","11":"Verder zei God tegen hem: Ik ben God de Almachtige! Wees vruchtbaar en word talrijk! Een volk, ja, een menigte volken zal uit u worden, en koningen zullen uit uw lenden voortkomen.","12":"En dit land, dat Ik aan Abraham en Izak gegeven heb, dat zal Ik u geven; en aan uw nageslacht na u zal Ik dit land geven.","13":"Toen voer God van hem op, in die plaats waar Hij met hem gesproken had.","14":"En Jakob zette een gedenkteken op in die plaats waar Hij met hem gesproken had, een stenen gedenkteken; en hij stortte daarop een drankoffer, en goot er olie overheen.","15":"En Jakob noemde de naam van die plaats waar God met hem gesproken had, Bethel.","16":"En zij reisden verder van Bethel; en er was nog een kleine afstand om tot Efrath te komen; en Rachel baarde, en zij had het zwaar bij haar bevalling.","17":"En het gebeurde, toen zij het zwaar had bij haar bevalling, dat de vroedvrouw tegen haar zei: Wees niet bang; want ook dit is een zoon voor u!","18":"En het gebeurde, toen haar ziel heenging (want zij stierf), dat zij zijn naam Ben-Oni noemde; maar zijn vader noemde hem Benjamin.","19":"Zo stierf Rachel; en zij werd begraven aan de weg naar Efrath, dat is Bethlehem.","20":"En Jakob richtte een gedenkteken op boven haar graf; dit is het gedenkteken van Rachels graf tot op deze dag.","21":"Toen trok Israël verder, en hij spande zijn tent op aan de andere kant van Migdal-Eder.","22":"En het gebeurde, toen Israël in dat land woonde, dat Ruben heenging en lag bij Bilha, het bijvrouw van zijn vader; en Israël hoorde het. En de zonen van Jakob waren twaalf.","23":"De zonen van Lea waren: Ruben, Jakobs eerstgeborene, daarna Simeon, en Levi, en Juda, en Issaschar, en Zebulon.","24":"De zonen van Rachel: Jozef en Benjamin.","25":"En de zonen van Bilha, Rachels dienstmaagd: Dan en Naftali.","26":"En de zonen van Zilpa, Lea's dienstmaagd: Gad en Aser. Dit zijn de zonen van Jakob, die hem geboren zijn in Paddan-Aram.","27":"En Jakob kwam bij Izak, zijn vader, in Mamre, te Kirjath-Arba, dat is Hebron, waar Abraham als vreemdeling had gewoond, en Izak.","28":"En de dagen van Izak waren honderdtachtig jaar.","29":"En Izak gaf de geest en stierf, en werd verzameld tot zijn volken, oud en verzadigd van dagen; en zijn zonen Ezau en Jakob begroeven hem."},"SV":{"1":"Daarna zeide God tot Jakob: Maak u op, trek op naar Beth-el, en woon aldaar; en maak daar een altaar dien God, Die u verscheen, toen gij vluchttet voor het aangezicht van uw broeder Ezau.","2":"Toen zeide Jakob tot zijn huisgezin, en tot allen, die bij hem waren: Doet weg de vreemde goden, die in het midden van u zijn, en reinigt u, en verandert uw klederen;","3":"En laat ons ons opmaken, en optrekken naar Beth-el; en ik zal daar een altaar maken dien God, Die mij antwoordt ten dage mijner benauwdheid, en met mij geweest is op den weg, die ik gewandeld heb.","4":"Toen gaven zij Jakob al die vreemde goden, die in hun hand waren, en de oorsierselen, die aan hun oren waren, en Jakob verborg ze onder den eikeboom, die bij Sichem is.","5":"En zij reisden heen; en Gods verschrikking was over de steden, die rondom hen waren, zodat zij de zonen van Jakob niet achterna jaagden.","6":"Alzo kwam Jakob te Luz, hetwelk is in het land Kanaän ( dat is Beth-el), hij en al het volk, dat bij hem was.","7":"En hij bouwde aldaar een altaar, en noemde die plaats El Beth-el; want God was hem aldaar geopenbaard geweest, als hij voor zijns broeders aangezicht vlood.","8":"En Debora, de voedster van Rebekka, stierf, en zij werd begraven onder aan Beth-el; onder dien eik, welks naam hij noemde Allon-bachuth.","9":"En God verscheen Jakob wederom, als hij van Paddan-aram gekomen was; en Hij zegende hem.","10":"En God zeide tot hem: Uw naam is Jakob, uw naam zal voortaan niet Jakob genoemd worden, maar Israël zal uw naam zijn; en Hij noemde zijn naam Israël.","11":"Voorts zeide God tot hem: Ik ben God de Almachtige! wees vruchtbaar, en vermenigvuldig! Een volk, ja, een hoop der volken zal uit u worden, en koningen zullen uit uw lenden voortkomen.","12":"En dit land, dat Ik aan Abraham en Izak gegeven heb, dat zal Ik u geven; en aan uw zaad na u zal Ik dit land geven.","13":"Toen voer God van hem op in die plaats, waar Hij met hem gesproken had.","14":"En Jakob stelde een opgericht teken op in die plaats, waar Hij met hem gesproken had, een stenen opgericht teken; en hij stortte daarop drankoffer, en goot olie daarover.","15":"En Jakob noemde den naam dier plaats, alwaar God met hem gesproken had, Beth-el.","16":"En zij reisden van Beth-el; en er was nog een kleine streek lands om tot Efrath te komen; en Rachel baarde, en zij had het hard in haar baren.","17":"En het geschiedde, als zij het hard had in haar baren, zo zeide de vroedvrouw tot haar: Vrees niet; want dezen zoon zult gij ook hebben!","18":"En het geschiedde, als haar ziel uitging ( want zij stierf), dat zij zijn naam noemde Ben-oni; maar zijn vader noemde hem Benjamin.","19":"Alzo stierf Rachel; en zij werd begraven aan den weg naar Efrath, hetwelk is Bethlehem.","20":"En Jakob richtte een gedenkteken op boven haar graf, dit is het gedenkteken van Rachels graf tot op dezen dag.","21":"Toen verreisde Israël, en hij spande zijn tent op gene zijde van Migdal-eder.","22":"En het geschiedde, als Israël in dat land woonde, dat Ruben heenging, en lag bij Bilha, zijns vaders bijwijf; en Israël hoorde het. En de zonen van Jakob waren twaalf.","23":"De zonen van Lea waren: Ruben, Jakobs eerstgeborene, daarna Simeon, en Levi, en Juda, en Issaschar, en Zebulon.","24":"De zonen van Rachel: Jozef en Benjamin.","25":"En de zonen van Bilha, Rachels dienstmaagd: Dan en Nafthali.","26":"En de zonen van Zilpa, Lea’s dienstmaagd: Gad en Aser. Deze zijn de zonen van Jakob, die hem geboren zijn in Paddan-aram.","27":"En Jakob kwam tot Izak, zijn vader, in Mamre, te Kirjath-arba, hetwelk is Hebron, waar Abraham als vreemdeling had verkeerd, en Izak.","28":"En de dagen van Izak waren honderd jaren, en tachtig jaren.","29":"En Izak gaf den geest en stierf, en werd verzameld tot zijn volken, oud en zat van dagen; en zijn zonen Ezau en Jakob begroeven hem."},"KJV":{"1":"And God said unto Jacob, Arise, go up to Bethel, and dwell there: and make there an altar unto God, that appeared unto thee when thou fleddest from the face of Esau thy brother.","2":"Then Jacob said unto his household, and to all that *were* with him, Put away the strange gods that *are* among you, and be clean, and change your garments:","3":"And let us arise, and go up to Bethel; and I will make there an altar unto God, who answered me in the day of my distress, and was with me in the way which I went.","4":"And they gave unto Jacob all the strange gods which *were* in their hand, and *all their* earrings which *were* in their ears; and Jacob hid them under the oak which *was* by Shechem.","5":"And they journeyed: and the terror of God was upon the cities that *were* round about them, and they did not pursue after the sons of Jacob.","6":"So Jacob came to Luz, which *is* in the land of Canaan, that *is*, Bethel, he and all the people","7":"And he built there an altar, and called the place Elbethel: because there God appeared unto him, when he fled from the face of his brother.","8":"But Deborah Rebekah's nurse died, and she was buried beneath Bethel under an oak: and the name of it was called Allonbachuth.","9":"And God appeared unto Jacob again, when he came out of Padanaram, and blessed","10":"And God said unto him, Thy name *is* Jacob: thy name shall not be called any more Jacob, but Israel shall be thy name: and he called his name Israel.","11":"And God said unto him, I *am* God Almighty: be fruitful and multiply; a nation and a company of nations shall be of thee, and kings shall come out of thy loins;","12":"And the land which I gave Abraham and Isaac, to thee I will give it, and to thy seed after thee will I give the land.","13":"And God went up from him in the place where he talked","14":"And Jacob set up a pillar in the place where he talked with him, *even* a pillar of stone: and he poured a drink offering thereon, and he poured oil","15":"And Jacob called the name of the place where God spake with him, Bethel.","16":"And they journeyed from Bethel; and there was but a little way to come to Ephrath: and Rachel travailed, and she had hard labour.","17":"And it came to pass, when she was in hard labour, that the midwife said unto her, Fear not; thou shalt have this son","18":"And it came to pass, as her soul was in departing, (for she died) that she called his name Benoni: but his father called him Benjamin.","19":"And Rachel died, and was buried in the way to Ephrath, which *is* Bethlehem.","20":"And Jacob set a pillar upon her grave: that *is* the pillar of Rachel's grave unto this day.","21":"And Israel journeyed, and spread his tent beyond the tower of Edar.","22":"And it came to pass, when Israel dwelt in that land, that Reuben went and lay with Bilhah his father's concubine: and Israel heard *it*. Now the sons of Jacob were twelve:","23":"The sons of Leah; Reuben, Jacob's firstborn, and Simeon, and Levi, and Judah, and Issachar, and Zebulun:","24":"The sons of Rachel; Joseph, and Benjamin:","25":"And the sons of Bilhah, Rachel's handmaid; Dan, and Naphtali:","26":"And the sons of Zilpah, Leah's handmaid; Gad, and Asher: these *are* the sons of Jacob, which were born to him in Padanaram.","27":"And Jacob came unto Isaac his father unto Mamre, unto the city of Arbah, which *is* Hebron, where Abraham and Isaac sojourned.","28":"And the days of Isaac were an hundred and fourscore years.","29":"And Isaac gave up the ghost, and died, and was gathered unto his people, *being* old and full of days: and his sons Esau and Jacob buried"}},"tsk":{"1":[{"kopje":"God zei","refs":["Gen 22:14","Deut 32:36","Ps 46:2","Ps 91:15"]},{"kopje":"Bethel","refs":["Gen 35:7","Gen 12:8","Gen 13:3","Gen 13:4","Gen 28:10-22","Gen 31:3","Gen 31:13","Ps 47:5","Pred 5:3-5","Hos 12:5","Nahum 1:15"]},{"kopje":"toen u","refs":["Gen 16:8","Gen 27:41-45","Ex 2:15"]}],"2":[{"kopje":"tegen zijn huisgezin","refs":["Gen 18:19","Joz 24:15","Ps 101:2-7"]},{"kopje":"vreemde","refs":["Gen 31:19","Gen 31:34","Ex 20:3","Ex 20:4","Ex 23:13","Deut 5:7","Deut 6:14","Deut 7:25","Deut 11:28","Deut 32:16","Joz 23:7","Joz 24:2","Joz 24:20","Joz 24:23","Richt 10:16","Ruth 1:15","1 Sam 7:3","2 Sam 7:23","2 Kon 17:29","1 Kron 16:26","Jer 5:7","Jer 16:20","Dan 5:4","Hand 19:26","1 Kor 10:7","2 Kor 6:15-17","Gal 4:8"]},{"ko huth.","9":"And <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">appeared</span> unto <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> again, when he <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> out of <span class=\"wl wl-kjv\" data-code=\"H6307\">Padanaram,</span> and blessed","10":"And <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, Thy <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> is <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob:</span> thy <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> shall not be <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> any more <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob,</span> but <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> shall be thy <span class=\"wl wl-kjv\" data-code=\"H8034\">name:</span> and he <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> his <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> Israel.","11":"And <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, I am <span class=\"wl wl-kjv\" data-code=\"H410\">God</span> <span class=\"wl wl-kjv\" data-code=\"H7706\">Almighty:</span> be <span class=\"wl wl-kjv\" data-code=\"H6509\">fruitful</span> and <span class=\"wl wl-kjv\" data-code=\"H7235\">multiply;</span> a <span class=\"wl wl-kjv\" data-code=\"H1471\">nation</span> and a <span class=\"wl wl-kjv\" data-code=\"H6951\">company</span> of <span class=\"wl wl-kjv\" data-code=\"H1471\">nations</span> shall be of thee, and <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> shall <span class=\"wl wl-kjv\" data-code=\"H3318\">come</span> out of thy loins;","12":"And the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> which I <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham</span> and <span class=\"wl wl-kjv\" data-code=\"H3327\">Isaac,</span> to thee I will give <span class=\"wl wl-kjv\" data-code=\"H5414\">it,</span> and to thy <span class=\"wl wl-kjv\" data-code=\"H2233\">seed</span> after <span class=\"wl wl-kjv\" data-code=\"H310\">thee</span> will I <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> the land.","13":"And <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> went <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> from him in the <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> where he talked","14":"And <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> set <span class=\"wl wl-kjv\" data-code=\"H5324\">up</span> a <span class=\"wl wl-kjv\" data-code=\"H4676\">pillar</span> in the <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> where he <span class=\"wl wl-kjv\" data-code=\"H1696\">talked</span> with him, even a <span class=\"wl wl-kjv\" data-code=\"H4678\">pillar</span> of <span class=\"wl wl-kjv\" data-code=\"H68\">stone:</span> and he <span class=\"wl wl-kjv\" data-code=\"H5258\">poured</span> a drink <span class=\"wl wl-kjv\" data-code=\"H5262\">offering</span> thereon, and he <span class=\"wl wl-kjv\" data-code=\"H3332\">poured</span> oil","15":"And <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of the <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> where <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> with him, Bethel.","16":"And they <span class=\"wl wl-kjv\" data-code=\"H5265\">journeyed</span> from <span class=\"wl wl-kjv\" data-code=\"H1008\">Bethel;</span> and there was <span class=\"wl wl-kjv\" data-code=\"H5750\">but</span> a <span class=\"wl wl-kjv\" data-code=\"H3530\">little</span> <span class=\"wl wl-kjv\" data-code=\"H776\">way</span> to <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> to <span class=\"wl wl-kjv\" data-code=\"H672\">Ephrath:</span> and <span class=\"wl wl-kjv\" data-code=\"H7354\">Rachel</span> <span class=\"wl wl-kjv\" data-code=\"H3205\">travailed,</span> and she had <span class=\"wl wl-kjv\" data-code=\"H7185\">hard</span> labour.","17":"And it came to pass, when she was in <span class=\"wl wl-kjv\" data-code=\"H7185\">hard</span> <span class=\"wl wl-kjv\" data-code=\"H3205\">labour,</span> that the <span class=\"wl wl-kjv\" data-code=\"H3205\">midwife</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto her, <span class=\"wl wl-kjv\" data-code=\"H3372\">Fear</span> not; thou shalt have this son","18":"And it came to pass, as her <span class=\"wl wl-kjv\" data-code=\"H5315\">soul</span> was in <span class=\"wl wl-kjv\" data-code=\"H3318\">departing,</span> (for she <span class=\"wl wl-kjv\" data-code=\"H4191\">died</span>) that she <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> his <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> <span class=\"wl wl-kjv\" data-code=\"H1126\">Benoni:</span> but his <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> him Benjamin.","19":"And <span class=\"wl wl-kjv\" data-code=\"H7354\">Rachel</span> <span class=\"wl wl-kjv\" data-code=\"H4191\">died,</span> and was <span class=\"wl wl-kjv\" data-code=\"H6912\">buried</span> in the <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> to <span class=\"wl wl-kjv\" data-code=\"H672\">Ephrath,</span> which is Bethlehem.","20":"And <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> <span class=\"wl wl-kjv\" data-code=\"H5324\">set</span> a <span class=\"wl wl-kjv\" data-code=\"H4676\">pillar</span> upon her <span class=\"wl wl-kjv\" data-code=\"H6900\">grave:</span> that is the <span class=\"wl wl-kjv\" data-code=\"H4678\">pillar</span> of <span class=\"wl wl-kjv\" data-code=\"H7354\">Rachel's</span> <span class=\"wl wl-kjv\" data-code=\"H6900\">grave</span> unto this day.","21":"And <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H5265\">journeyed,</span> and <span class=\"wl wl-kjv\" data-code=\"H5186\">spread</span> his <span class=\"wl wl-kjv\" data-code=\"H168\">tent</span> <span class=\"wl wl-kjv\" data-code=\"H1973\">beyond</span> the <span class=\"wl wl-kjv\" data-code=\"H4026\">tower</span> of Edar.","22":"And it came to pass, when <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H7931\">dwelt</span> in that <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> that <span class=\"wl wl-kjv\" data-code=\"H7205\">Reuben</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> and <span class=\"wl wl-kjv\" data-code=\"H7901\">lay</span> with <span class=\"wl wl-kjv\" data-code=\"H1090\">Bilhah</span> his <span class=\"wl wl-kjv\" data-code=\"H1\">father's</span> <span class=\"wl wl-kjv\" data-code=\"H6370\">concubine:</span> and <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> it. Now the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> were <span class=\"wl wl-kjv\" data-code=\"H8147\">twelve:</span>","23":"The <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H3812\">Leah;</span> <span class=\"wl wl-kjv\" data-code=\"H7205\">Reuben,</span> <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob's</span> <span class=\"wl wl-kjv\" data-code=\"H1060\">firstborn,</span> and <span class=\"wl wl-kjv\" data-code=\"H8095\">Simeon,</span> and <span class=\"wl wl-kjv\" data-code=\"H3878\">Levi,</span> and <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> and <span class=\"wl wl-kjv\" data-code=\"H3485\">Issachar,</span> and Zebulun:","24":"The <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H7354\">Rachel;</span> <span class=\"wl wl-kjv\" data-code=\"H3130\">Joseph,</span> and Benjamin:","25":"And the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H1090\">Bilhah,</span> <span class=\"wl wl-kjv\" data-code=\"H7354\">Rachel's</span> <span class=\"wl wl-kjv\" data-code=\"H8198\">handmaid;</span> <span class=\"wl wl-kjv\" data-code=\"H1835\">Dan,</span> and Naphtali:","26":"And the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H2153\">Zilpah,</span> <span class=\"wl wl-kjv\" data-code=\"H3812\">Leah's</span> <span class=\"wl wl-kjv\" data-code=\"H8198\">handmaid;</span> <span class=\"wl wl-kjv\" data-code=\"H1410\">Gad,</span> and <span class=\"wl wl-kjv\" data-code=\"H836\">Asher:</span> these are the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob,</span> which were <span class=\"wl wl-kjv\" data-code=\"H3205\">born</span> to him in Padanaram.","27":"And <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> unto <span class=\"wl wl-kjv\" data-code=\"H3327\">Isaac</span> his <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> unto <span class=\"wl wl-kjv\" data-code=\"H4471\">Mamre,</span> unto the city of <span class=\"wl wl-kjv\" data-code=\"H7153\">Arbah,</span> which is <span class=\"wl wl-kjv\" data-code=\"H2275\">Hebron,</span> where <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham</span> and <span class=\"wl wl-kjv\" data-code=\"H3327\">Isaac</span> sojourned.","28":"And the <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> of <span class=\"wl wl-kjv\" data-code=\"H3327\">Isaac</span> were an <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> and <span class=\"wl wl-kjv\" data-code=\"H8084\">fourscore</span> years.","29":"And <span class=\"wl wl-kjv\" data-code=\"H3327\">Isaac</span> gave up the <span class=\"wl wl-kjv\" data-code=\"H1478\">ghost,</span> and <span class=\"wl wl-kjv\" data-code=\"H4191\">died,</span> and was <span class=\"wl wl-kjv\" data-code=\"H622\">gathered</span> unto his <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> being <span class=\"wl wl-kjv\" data-code=\"H2205\">old</span> and <span class=\"wl wl-kjv\" data-code=\"H7649\">full</span> of <span class=\"wl wl-kjv\" data-code=\"H3117\">days:</span> and his <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> <span class=\"wl wl-kjv\" data-code=\"H6215\">Esau</span> and <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> buried"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"maak daar","tekst":"Om te gedenken aan de beloften, die Ik daar aan u gedaan heb, en gij aan mij; boven, Gen 28:13-14, Gen 28:20. Dit schijnt daartoe te dienen, dat Jakob getroost en gesterkt mocht worden tegen de vrees, waarmede hij bevangen was; zie Gen 34:30."}],"2":[{"catchword":"huisgezin,","tekst":"Hebr. huis; zie boven, Gen 7:1."},{"catchword":"allen,","tekst":"Knechts en dienstmaagden, en die van buiten er bij gekomen waren."},{"catchword":"vreemde","tekst":"Hebr. Goden des vreemden. Versta er onder de beelden der afgoden, die van vreemde volken gediend waren, niet zijnde de ware God, die zich aan Abraham, Izak en Jakob geopenbaard had. Aldus werden de afgoden genoemd, Deu 31:16, en Deu 32:12; Jos 24:20; Psa 81:10. Dezen werden geheten, andere goden, Deu 6:14; Jos 23:16; Jdg 10:13, idem, nieuwe goden, Jdg 5:8."},{"catchword":"die in","tekst":"Het blijkt hieruit dat onder Jakobs gezin nog enige beelden verborgen waren, hetzij dat deze afgoden waren van Laban, boven, Gen 31:19, of enige kostbare beelden, die zij bij de plundering van Sichem gekregen, of die andere gevangenen daar gebracht hadden."},{"catchword":"reinigt u,","tekst":"Om met deze uitwendige ceremonie te betuigen de inwendige zuivering en bekering des harten, die zij niet alleen ten aanzien van de afgodische besmetting, maar ook vooral van dien moord der Sichemieten nodig hadden, om zich te bereiden tot den statelijken godsdienst, dien Jakob op Gods bevel met zijn huisgezin zou verrichten. Zie Exo 19:10, Exo 19:14."}],"3":[{"catchword":"die mij","tekst":"Dat is, die mij placht te verhoren. God antwoordt zijn volk, als Hij met woorden of werken doet blijken dat Hij het verhoord heeft; zie 1Ki 18:24; Isa 41:17-18; Psa 22:22."},{"catchword":"op den weg,","tekst":"Te weten, van Haran tot hiertoe."}],"4":[{"catchword":"die in hun","tekst":"Dat is, die zij bij zich hadden; zie 2Sa 8:10."},{"catchword":"oorsierselen,","tekst":"Dezen heeft Jakob hun afgenomen, òf omdat die bij de plundering der afgoden te Sichem gekregen, òf ter ere van die afgoden gedragen waren; òf tot enig misbruik der zijnen hadden mogen dienen."},{"catchword":"verbergde","tekst":"Zonder dat zijn volk wist waar hij die liet, opdat niemand dezelve mocht vinden en tot superstitie en afgoderij misbruiken."}],"5":[{"catchword":"Gods verschrikking","tekst":"Dat is, die van God toegezonden en zeer groot was; alzo Exo 23:27; 2Ch 14:14, en 2Ch 17:10. Het woord God wordt somtijds gebruikt om de grootheid en uitnemendheid van enige zaak uit te drukken; zie boven, Gen 13:10. Zonder deze verschrikking zou Jakob met al de zijnen lichtelijk overvallen en vernield geweest zijn, om de daad van Simeon en Levi, te Sichem begaan; boven Gen 34:25."}],"6":[{"catchword":"Luz,","tekst":"Zie boven, Gen 12:8, en Gen 28:19."},{"catchword":"Beth-el","tekst":"Aldus door Jakob genoemd."}],"7":[{"catchword":"El Beth-el","tekst":"Dat is, God is [te] Beth-el. Aldus noemt hij deze plaats voor de tweede maal; zie boven, Gen 28:19, en verg. boven, Gen 33:20."},{"catchword":"God was","tekst":"Zie boven, Gen 28:13, en de manier van spreken, Gen 20:13."}],"8":[{"catchword":"Debóra,","tekst":"Die met Rebekka uit Mesopotamië gezonden was, naar het land Kanaän. Zie boven, Gen 24:59."},{"catchword":"Allon-Báchuth.","tekst":"Dat is, elk des wenens, omdat zij Debora daar beklaagd en beweend hebben."}],"10":[{"catchword":"Uw naam is","tekst":"God bevestigt hier aan Jakob hetgeen Hij hem tevoren gezegd had; zie boven, Gen 32:28."}],"11":[{"catchword":"God de","tekst":"Zie boven, Gen 17:1."},{"catchword":"wees","tekst":"God bevestigt hier den zegen van zijn vader Izak, dien hij hem gaf toen hij vluchtte naar Mesopotamië; zie boven, Gen 28:3-4."},{"catchword":"uit uw lenden","tekst":"Dat is, uit uw eigen vlees en bloed geboren worden; alzo 1Ki 8:19; 2Ch 6:9; Act 2:30, verg. onder, Gen 46:26."}],"13":[{"catchword":"voer God","tekst":"Hebr. voer op van boven hem. God wordt gezegd op te klimmen en neder te dalen, de plaatsen niet veranderende, aangemerkt Hij overal is, maar de tekenen zijner tegenwoordigheid, die Hij openbaart door zijn nederdalen; gelijk boven, Gen 11:5; Exo 3:8, en Num 11:17, of wegneemt door zijn opklimmen gelijk hier en boven, Gen 17:22; Jdg 13:20."}],"14":[{"catchword":"Jakob","tekst":"Jakob vernieuwt hier het gedenkteken, dat hij tevoren opgericht had, boven, Gen 28:18, omdat het door langheid ingezetenen mocht vervallen of omgeworpen zijn; opdat het strekken van Gods weldaad en zijn schuldigen plicht."},{"catchword":"drankoffer,","tekst":"Versta hierdoor, òf de olie, zoals terstond volgt; òf den wijn, òf enig ander vocht, dat gewoonlijk gebruikt werd in drankoffers, of in plengoffers tot dankzegging."}],"15":[{"catchword":"noemde den","tekst":"Zijn belofte willende volbrengen, vernieuwt hij niet alleen het gedenkteken, maar ook den naam. Deze plaats schijnt onderscheiden te zijn van El Beth-el, boven, vs.7."}],"16":[{"catchword":"een kleine","tekst":"Anders, omtrent een voedering, of pleistering lands; dat is, zoveel land als men reist eer men pleistert, een mijl van den weg. Zie Gen 48:7; 2Ki 5:19."},{"catchword":"Efrath","tekst":"Dit is de naam van een stad, die gewoonlijk Bethlehem genoemd wordt. Zie deze beide namen onder, vs.19; Mic 5:1."}],"17":[{"catchword":"zult gij","tekst":"Of, hebt gij ook, boven Jozef; gelijk gij gewenst hebt, dat u nog een boven hem zou toegevoegd worden; boven Gen 30:24."}],"18":[{"catchword":"als haar","tekst":"Een klare beschrijving van den dood, waaruit blijkt dat hij is een scheiding der ziel, die tot een ander leven overblijft, en gaat uit het lichaam, hetwelk door den dood vergaat. Waarom ook gezegd wordt van degenen, die nog leven, dat hun ziel in hen is, 2Sa 1:9, en van degenen, die sterven, dat hun geest uitgaat, Psa 146:4, en van degenen die verrijzen, dat hun geest in hen wederkeert; 1Ki 17:21-22."},{"catchword":"(want zij","tekst":"Of, dat zij stierf, en noemde, of had genoemd."},{"catchword":"Ben-oni;","tekst":"Dat is, zoon mijner smart, mijns weedoms."},{"catchword":"Benjamin","tekst":"Dat is zoon der rechterhand; dat is, die mij altijd nabij en zeer lief zal zijn, als den mens zijn rechterhand; Psa 80:18."}],"19":[{"catchword":"Efrath,","tekst":"Deze naam schijnt Bethlehem gegeven te zijn door Kalebs huisvrouw, zie 1Ch 2:19, 1Ch 2:24; en daarmede wordt ook dit Bethlehem, gelegen in den stam van Juda, [ Mic 5:1; Mat 2:6 ] , onderscheiden van een ander Bethlehem, gelegen in den stam van Zebulon; Jos 19:15."},{"catchword":"Bethlehem","tekst":"Bethlehem betekent een huis des broods."}],"20":[{"catchword":"tot op dezen","tekst":"Te weten, ten tijde toen Mozes dit schreef; ja het bestond nog ten tijde van Samuel en Saul; 1Sa 10:2. Omtrent den kindermoord, dien Herodes hieromtrent heeft laten plegen, ten tijde van Christus' geboorte, zie Jer 31:15; Mat 2:16-17."}],"21":[{"catchword":"Israël,","tekst":"Hier wordt Jakob eerst Israel genoemd, naar het bevel Gods, vs.10."},{"catchword":"Migdal-Eder.","tekst":"Dat is, een toren der kudde; zie ook Mic 4:8."}],"22":[{"catchword":"bijwijf;","tekst":"Zie boven, Gen 22:24."},{"catchword":"Israël","tekst":"Zonder twijfel met groot harteleed, ziende dat door deze daad van Ruben God vertoornd, zijn huisgezin onteerd, en oorzaak van lasteringen gegeven was; zo zelfs, dat Jakob, liggende op zijn sterfbed, reden had om zich te beklagen over deze schandelijke daad; onder, Gen 49:3-4; en Ruben het recht der eerstgeboorte te benemen; 1Ch 5:1-2."}],"23":[{"catchword":"De zonen","tekst":"Deze twaalf zonen van Jakob worden hier vermeld, omdat hun getal na Benjamins geboorte en Rachels dood nu vol was, en hem geen zonen meer geboren zijn; en dat deze twaalf geweest zijn de vaders der twaalf stammen Israëls, van welke hierna dikwijls zal gesproken worden."}],"26":[{"catchword":"die hem","tekst":"Uitgenomen Benjamin, die bij Efrath in het land Kanaän geboren is, boven, vs.16. Maar Mozes spreekt zo, aangezien al de anderen daar geboren zijn. Dit is een manier van spreken, waardoor iets niet precieselijk wordt gesteld, maar in het algemeen en in een zeker opzicht; zie boven, Gen 15:13; nder, Gen 46:15; Jdg 20:46; 1Co 15:5."}],"27":[{"catchword":"in Mamre,","tekst":"Een plaats vanwaar men zien mag boven, Gen 23:17. Alzo genoemd door Abrahams bondgenoot, die Mamre heette; zie boven, Gen 13:18, en Gen 14:13, Gen 14:24."},{"catchword":"Kirjath-Arba,","tekst":"Zie boven, Gen 23:2."},{"catchword":"Hebron,","tekst":"Zie boven, Gen 13:18, en Gen 23:2, Gen 23:19."},{"catchword":"en Izak","tekst":"Die er nog als vreemdeling woonde."}],"29":[{"catchword":"gaf den","tekst":"Verg. boven, Gen 25:8."},{"catchword":"tot zijn","tekst":"Zie boven, Gen 15:15."},{"catchword":"begroeven hem","tekst":"Te weten, in de spelonk, waarvan te lezen is boven, Gen 23, waarin ook Abraham begraven lag, boven, Gen 25:9. Deze was in Hebron, waar Izak gestorven is. Dit is geschied lang na dezen tijd, overmits Jakob wel 23 jaren in Kanaän na zijn wederkomst uit Mesopotamië gewoond had, eer zijn vader stierf. Maar het wordt hier door Mozes verhaald, om hiermede Izaks historie te eindigen, en Jakobs historie te vervolgen."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"After that God said to Jacob arise go up to Bethel and dwell there and make an altar there to that God who appeared to thee upon thou steadfast before the face of thy brother Esau [that thou maist call to mind there what promises I past unto thee and what vows thou madest unto me then above chapter 28 verse 13, 14, 20. This seem stop have served to comfort and encourage Jacob against the fears that hath seized on him before chapter 34.30.]"}],"2":[{"catchword":null,"tekst":"Then said Jacob to his household [Heb. House see above chapter 7 on verse 1] and to all that were with him [that is all man and maid servants and such as were come to him from without and lived in his family ] put away the strange Gods [Heb. God of the stranger understand the images of the idols whom the strangers served being not the true God that hath revealed himself to Abraham Isaac Jacob thus the idols are called Deu 31:16 and 32.12 Jos 24:20 Psa 81:10 those are called other Gods Deu 6:14 Josiah 23.16 Jud 10:13item new Gods Jud 5:8]which are in the midst of you [hence it seems that there were some such images kept in secret yet among his family whether they were the idols of Laban above chapter 31.19 or some costly images which they had gotten in the plundering of Sichem or some of the prisoners had brought thither with them] and cleanse you and change your garments [to shew by this outward ceremony the inward cleansing and the reforming of the heart which the stood indeed not only by reason of that idolatrous defilements but also especially in regard of that base murder committed upon the Sichemites thus to prepare themselves for that solemn worship of God which Jacob was commanded now to set up and exercise with the family at Bethel see exodus 19.10,15.]"}],"3":[{"catchword":null,"tekst":"And let us arise and go up to Bethel and I will an altar there unto God that answereth me in the day of distress [that is doth use to hear and help me God answers his people and makes it appear by word or // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start) {
  const nummers = [];
  for (let i = 0; i < 3; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
  if (m) {
    const start = parseInt(m[1], 10);
    const html = popupVerzenHtml(D.vertalingen.SVnu, start);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const html = popupVerzenHtml(data, start);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
