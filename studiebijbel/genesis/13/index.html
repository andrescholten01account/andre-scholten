<style>

  .navselect { font-family:"Lora"; font-size:.85rem; border:1px solid var(--border); border-radius:999px; padding:.3rem 1.6rem .3rem .8rem; background:#fff; color:var(--accent-donker); cursor:pointer; display:inline-flex; align-items:center; text-decoration:none; }

    #vertaalkies { order: -1; }

  /* verzen — tabsmodus (één kolom) */
  .vers { position: relative; display: flex; gap: .8rem; padding: .45rem 2.4rem .45rem .4rem; border-radius: 8px; cursor: pointer; }
  .vers:hover { background: var(--bg-soft); }
  .vers.open { background: var(--bg-soft); box-shadow: inset 3px 0 0 var(--accent); border-radius: 8px 8px 0 0; }
  .vers.flits { animation: flits 1.6s ease-out; }
  @keyframes flits { 0% { background: #e0e0e0; } 100% { background: var(--bg-soft); } }

  .vtekst em, .pcel em { font-style: italic; color: #555; }

  .vers:hover .kopieer { opacity: .75; }

  #bijbel.parallel .vers { display:grid; gap:.8rem; cursor:pointer; align-items:start; }
  #bijbel.parallel .vnr { grid-row: 1; }
  .kolomkop { display:none; }
  #bijbel.parallel + .kolomkop, .kolomkop.tonen { }
  .pk { font-family:"Lora"; font-size:.72rem; text-transform:uppercase; letter-spacing:.12em; color:var(--accent-donker); font-weight:700; }
  #bijbel.parallel .pcel em { font-style:italic; color:#555; }

ypte naar het zuiden, hij en zijn vrouw, en alles wat hij had, en Lot met hem.","2":"En Abram was zeer rijk, in vee, in zilver, en in goud.","3":"En hij ging, volgens zijn reizen, van het zuiden tot Beth-el toe, tot aan de plaats waar zijn tent in het begin geweest was, tussen Beth-el en Ai;","4":"tot de plaats van het altaar, dat hij daar eerst gemaakt had; en Abram heeft daar de Naam van de HEERE aangeroepen.","5":"En Lot, die met Abram meetrok, had ook schapen, en runderen, en tenten.","6":"En dat land kon hen niet dragen om samen te wonen; want hun bezit was veel, zodat zij niet samen konden wonen.","7":"En er was twist tussen de herders van Abrams vee, en tussen de herders van Lots vee. Ook woonden toen de Kanaänieten en Ferezieten in dat land.","8":"En Abram zei tegen Lot: Laat er toch geen twist zijn tussen mij en u, en tussen mijn herders en uw herders; want wij zijn broeders.","9":"Ligt niet het hele land voor u? Scheid u toch van mij; als u de linkerhand *kiest*, zal ik naar rechts gaan; en als u de rechterhand *kiest*, zal ik naar links gaan.","10":"En Lot hief zijn ogen op, en zag de hele vlakte van de Jordaan, dat die overal goed bevochtigd was; voordat de HEERE Sodom en Gomorra verwoest had, *was zij* als de hof van de HEERE, als het land Egypte, tot waar men bij Zoar komt.","11":"Zo koos Lot voor zich de hele vlakte van de Jordaan, en Lot trok naar het oosten; en zij werden van elkaar gescheiden.","12":"Abram woonde *dan* in het land Kanaän; en Lot woonde in de steden van de vlakte, en sloeg zijn tenten op tot aan Sodom toe.","13":"En de mannen van Sodom *waren* slecht, en grote zondaars tegen de HEERE.","14":"En de HEERE zei tegen Abram, nadat Lot van hem gescheiden was: Hef uw ogen op, en zie van de plaats waar u bent naar het noorden en het zuiden, en naar het oosten en het westen.","15":"Want al dit land, dat u ziet, zal Ik u geven, en aan uw nageslacht, tot in eeuwigheid.","16":"En Ik zal uw nageslacht stellen als het stof van de aarde, zodat als iemand het stof van de aarde zal kunnen tellen, ook uw nageslacht geteld zal worden.","17":"Maak u op, doorwandel dit land, in zijn lengte en in zijn breedte; want Ik zal het u geven.","18":"En Abram sloeg zijn tenten op, en kwam en woonde bij de eikenbossen van Mamre, die bij Hebron zijn; en hij bouwde daar de HEERE een altaar."},"SV":{"1":"Alzo toog Abram op uit Egypte naar het zuiden, hij en zijn huisvrouw, en al wat hij had, en Lot met hem.","2":"En Abram was zeer rijk, in vee, in zilver, en in goud.","3":"En hij ging, volgens zijn reizen, van het zuiden tot Beth-el toe, tot aan de plaats, waar zijn tent in het begin geweest was, tussen Beth-el, en tussen Ai;","4":"Tot de plaats des altaars, dat hij in het eerst daar gemaakt had; en Abram heeft aldaar den Naam des HEEREN aangeroepen.","5":"En Lot, die met Abram toog, had ook schapen, en runderen, en tenten.","6":"En dat land droeg hen niet, om samen te wonen; want hun have was vele, zodat zij samen niet konden wonen.","7":"En er was twist tussen de herders van Abrams vee, en tussen de herders van Lots vee. Ook woonden toen de Kanaänieten en Ferezieten in dat land.","8":"En Abram zeide tot Lot: Laat toch geen twisting zijn tussen mij en tussen u, en tussen mijn herders en tussen uw herders; want wij zijn mannen broeders.","9":"*Is* niet het ganse land voor uw aangezicht? Scheid u toch van mij; zo gij de linkerhand *kiest*, zo zal ik ter rechterhand gaan; en zo gij de rechterhand, zo zal ik ter linkerhand gaan.","10":"En Lot hief zijn ogen op, en hij zag de ganse vlakte der Jordaan, dat zij die geheel bevochtigde; eer de HEERE Sodom en Gomorra verdorven had, *was* *zij* als de hof des HEEREN, als Egypteland, als gij komt te Zoar.","11":"Zo koos Lot voor zich de ganse vlakte der Jordaan, en Lot trok tegen het oosten; en zij werden gescheiden, de een van den ander.","12":"Abram *dan* woonde in het land Kanaän; en Lot woonde in de steden der vlakte, en sloeg tenten tot aan Sodom toe.","13":"En de mannen van Sodom *waren* boos, en grote zondaars tegen den HEERE.","14":"En de HEERE zeide tot Abram, nadat Lot van hem gescheiden was: Hef uw ogen op, en zie van de plaats, waar gij zijt noordwaarts en zuidwaarts, en oostwaarts en westwaarts.","15":"Want al dit land, dat gij ziet, zal Ik u geven, en aan uw zaad, tot in eeuwigheid.","16":"En Ik zal uw zaad stellen als het stof der aarde, zodat, indien iemand het stof der aarde zal kunnen tellen, zal ook uw zaad geteld worden.","17":"Maak u op, wandel door dit land, in zijn lengte en in zijn breedte; want Ik zal het u geven.","18":"En Abram sloeg tenten op, en kwam en woonde aan de eikenbossen van Mamre, die bij Hebron zijn; en hij bouwde aldaar den HEERE een altaar."},"KJV":{"1":"And Abram went up out of Egypt, he, and his wife, and all that he had, and Lot with him, into the south.","2":"And Abram *was* very rich in cattle, in silver, and in gold.","3":"And he went on his journeys from the south even to Bethel, unto the place where his tent had been at the beginning, between Bethel and Hai;","4":"Unto the place of the altar, which he had made there at the first: and there Abram called on the name of the LORD.","5":"And Lot also, which went with Abram, had flocks, and herds, and tents.","6":"And the land was not able to bear them, that they might dwell together: for their substance was great, so that they could not dwell together.","7":"And there was a strife between the herdmen of Abram's cattle and the herdmen of Lot's cattle: and the Canaanite and the Perizzite dwelled then in the land.","8":"And Abram said unto Lot, Let there be no strife, I pray thee, between me and thee, and between my herdmen and thy herdmen; for we *be* brethren.","9":"*Is* not the whole land before thee? separate thyself, I pray thee, from me: if *thou wilt take* the left hand, then I will go to the right; or if *thou depart* to the right hand, then I will go to the left.","10":"And Lot lifted up his eyes, and beheld all the plain of Jordan, that it *was* well watered every where, before the LORD destroyed Sodom and Gomorrah, *even* as the garden of the LORD, like the land of Egypt, as thou comest unto Zoar.","11":"Then Lot chose him all the plain of Jordan; and Lot journeyed east: and they separated themselves the one from the other.","12":"Abram dwelled in the land of Canaan, and Lot dwelled in the cities of the plain, and pitched *his* tent toward Sodom.","13":"But the men of Sodom *were* wicked and sinners before the LORD exceedingly.","14":"And the LORD said unto Abram, after that Lot was separated from him, Lift up now thine eyes, and look from the place where thou art northward, and southward, and eastward, and westward:","15":"For all the land which thou seest, to thee will I give it, and to thy seed for ever.","16":"And I will make thy seed as the dust of the earth: so that if a man can number the dust of the earth, *then* shall thy seed also be numbered.","17":"Arise, walk through the land in the length of it and in the breadth of it; for I will give","18":"Then Abram removed *his* tent, and came and dwelt in the plain of Mamre, which *is* in Hebron, and built there an altar unto the LORD."}},"tsk":{"1":[{"kopje":"het zuiden","refs":["Gen 13:3","Gen 12:9-20","Gen 20:1","Gen 21:33","Joz 10:40","Joz 18:5","1 Sam 27:10","2 Sam 24:7"]}],"3":[{"kopje":"van","refs":["Gen 12:6","Gen 12:8","Gen 12:9"]},{"kopje":"Beth-el en Ai","refs":["Gen 28:19"]}],"4":[{"kopje":"tot","refs":["Gen 13:18","Gen 12:7","Gen 12:8","Gen 35:1-3","Ps 26:8","Ps 42:2","Ps 42:3","Ps 84:2","Ps 84:3","Ps 84:11"]},{"kopje":"aangeroepen","refs":["Gen 4:26","Ps 65:2","Ps 65:3","Ps 107:1","Ps 107:8","Ps 107:15","Ps 116:2","Ps 116:17","Ps 145:18","Jes 58:9","Jer 29:12","Zef 3:9","1 Kor 1:2","Ef 6:18","Ef 6:19"]}],"5":[{"kopje":"tenten","refs":["Gen 4:20","Gen 25:27","Jer 49:29"]}],"7":[{"kopje":"twist","refs":["Gen 21:25","Gen 26:20","Ex 2:17","1 Kor 3:3","Gal 5:20","Tit 3:3","Jak 3:16","Jak 4:1"]},{"kopje":"Kanaänieten","refs":["Gen 10:19","Gen 12:6" ch he had <span class=\"wl wl-kjv\" data-code=\"H6213\">made</span> there at the <span class=\"wl wl-kjv\" data-code=\"H7223\">first:</span> and there <span class=\"wl wl-kjv\" data-code=\"H87\">Abram</span> <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> on the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of the LORD.","5":"And <span class=\"wl wl-kjv\" data-code=\"H3876\">Lot</span> also, which <span class=\"wl wl-kjv\" data-code=\"H1980\">went</span> <span class=\"wl wl-kjv\" data-code=\"H854\">with</span> <span class=\"wl wl-kjv\" data-code=\"H87\">Abram,</span> had <span class=\"wl wl-kjv\" data-code=\"H6629\">flocks,</span> and <span class=\"wl wl-kjv\" data-code=\"H1241\">herds,</span> and tents.","6":"And the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> was not able to <span class=\"wl wl-kjv\" data-code=\"H5375\">bear</span> them, that they might <span class=\"wl wl-kjv\" data-code=\"H3427\">dwell</span> <span class=\"wl wl-kjv\" data-code=\"H3162\">together:</span> for their <span class=\"wl wl-kjv\" data-code=\"H7399\">substance</span> was <span class=\"wl wl-kjv\" data-code=\"H7227\">great,</span> so that they <span class=\"wl wl-kjv\" data-code=\"H3201\">could</span> not <span class=\"wl wl-kjv\" data-code=\"H3427\">dwell</span> together.","7":"And there was a <span class=\"wl wl-kjv\" data-code=\"H7379\">strife</span> between the <span class=\"wl wl-kjv\" data-code=\"H7462\">herdmen</span> of <span class=\"wl wl-kjv\" data-code=\"H87\">Abram's</span> <span class=\"wl wl-kjv\" data-code=\"H4735\">cattle</span> and the <span class=\"wl wl-kjv\" data-code=\"H7462\">herdmen</span> of <span class=\"wl wl-kjv\" data-code=\"H3876\">Lot's</span> <span class=\"wl wl-kjv\" data-code=\"H4735\">cattle:</span> and the <span class=\"wl wl-kjv\" data-code=\"H3669\">Canaanite</span> and the <span class=\"wl wl-kjv\" data-code=\"H6522\">Perizzite</span> <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelled</span> then in the land.","8":"And <span class=\"wl wl-kjv\" data-code=\"H87\">Abram</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H3876\">Lot,</span> Let there <span class=\"wl wl-kjv\" data-code=\"H1961\">be</span> <span class=\"wl wl-kjv\" data-code=\"H408\">no</span> <span class=\"wl wl-kjv\" data-code=\"H4808\">strife,</span> I pray thee, between me and thee, and between my <span class=\"wl wl-kjv\" data-code=\"H7462\">herdmen</span> and thy <span class=\"wl wl-kjv\" data-code=\"H7462\">herdmen;</span> for <span class=\"wl wl-kjv\" data-code=\"H582\">we</span> be brethren.","9":"Is not the whole <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> before <span class=\"wl wl-kjv\" data-code=\"H6440\">thee?</span> separate <span class=\"wl wl-kjv\" data-code=\"H6504\">thyself,</span> I pray thee, from me: if thou wilt take the left <span class=\"wl wl-kjv\" data-code=\"H8040\">hand,</span> then I will go to the <span class=\"wl wl-kjv\" data-code=\"H3231\">right;</span> or if thou depart to the right <span class=\"wl wl-kjv\" data-code=\"H3225\">hand,</span> then I will go to the left.","10":"And <span class=\"wl wl-kjv\" data-code=\"H3876\">Lot</span> lifted <span class=\"wl wl-kjv\" data-code=\"H5375\">up</span> his <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes,</span> and <span class=\"wl wl-kjv\" data-code=\"H7200\">beheld</span> all the <span class=\"wl wl-kjv\" data-code=\"H3603\">plain</span> of <span class=\"wl wl-kjv\" data-code=\"H3383\">Jordan,</span> that it was well <span class=\"wl wl-kjv\" data-code=\"H4945\">watered</span> every where, <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H7843\">destroyed</span> <span class=\"wl wl-kjv\" data-code=\"H5467\">Sodom</span> and <span class=\"wl wl-kjv\" data-code=\"H6017\">Gomorrah,</span> even as the <span class=\"wl wl-kjv\" data-code=\"H1588\">garden</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> like the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> as thou <span class=\"wl wl-kjv\" data-code=\"H935\">comest</span> unto Zoar.","11":"Then <span class=\"wl wl-kjv\" data-code=\"H3876\">Lot</span> <span class=\"wl wl-kjv\" data-code=\"H977\">chose</span> him all the <span class=\"wl wl-kjv\" data-code=\"H3603\">plain</span> of <span class=\"wl wl-kjv\" data-code=\"H3383\">Jordan;</span> and <span class=\"wl wl-kjv\" data-code=\"H3876\">Lot</span> <span class=\"wl wl-kjv\" data-code=\"H5265\">journeyed</span> <span class=\"wl wl-kjv\" data-code=\"H6924\">east:</span> and they separated <span class=\"wl wl-kjv\" data-code=\"H6504\">themselves</span> the <span class=\"wl wl-kjv\" data-code=\"H376\">one</span> from the other.","12":"<span class=\"wl wl-kjv\" data-code=\"H87\">Abram</span> <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelled</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H3667\">Canaan,</span> and <span class=\"wl wl-kjv\" data-code=\"H3876\">Lot</span> <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelled</span> in the <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> of the <span class=\"wl wl-kjv\" data-code=\"H3603\">plain,</span> and pitched his <span class=\"wl wl-kjv\" data-code=\"H167\">tent</span> <span class=\"wl wl-kjv\" data-code=\"H5704\">toward</span> Sodom.","13":"But the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H5467\">Sodom</span> were <span class=\"wl wl-kjv\" data-code=\"H7451\">wicked</span> and <span class=\"wl wl-kjv\" data-code=\"H2400\">sinners</span> before the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> exceedingly.","14":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H87\">Abram,</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> that <span class=\"wl wl-kjv\" data-code=\"H3876\">Lot</span> was <span class=\"wl wl-kjv\" data-code=\"H6504\">separated</span> from him, Lift <span class=\"wl wl-kjv\" data-code=\"H5375\">up</span> now thine <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes,</span> and <span class=\"wl wl-kjv\" data-code=\"H7200\">look</span> from the <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> where thou art <span class=\"wl wl-kjv\" data-code=\"H6828\">northward,</span> and <span class=\"wl wl-kjv\" data-code=\"H5045\">southward,</span> and <span class=\"wl wl-kjv\" data-code=\"H6924\">eastward,</span> and westward:","15":"For all the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> which thou <span class=\"wl wl-kjv\" data-code=\"H7200\">seest,</span> to thee will I give <span class=\"wl wl-kjv\" data-code=\"H5414\">it,</span> and to thy <span class=\"wl wl-kjv\" data-code=\"H2233\">seed</span> <span class=\"wl wl-kjv\" data-code=\"H5704\">for</span> ever.","16":"And I will <span class=\"wl wl-kjv\" data-code=\"H7760\">make</span> thy <span class=\"wl wl-kjv\" data-code=\"H2233\">seed</span> as the <span class=\"wl wl-kjv\" data-code=\"H6083\">dust</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">earth:</span> so <span class=\"wl wl-kjv\" data-code=\"H834\">that</span> if a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> <span class=\"wl wl-kjv\" data-code=\"H3201\">can</span> <span class=\"wl wl-kjv\" data-code=\"H4487\">number</span> the <span class=\"wl wl-kjv\" data-code=\"H6083\">dust</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">earth,</span> then shall thy <span class=\"wl wl-kjv\" data-code=\"H2233\">seed</span> also be numbered.","17":"<span class=\"wl wl-kjv\" data-code=\"H6965\">Arise,</span> <span class=\"wl wl-kjv\" data-code=\"H1980\">walk</span> through the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> in the <span class=\"wl wl-kjv\" data-code=\"H753\">length</span> of it and in the <span class=\"wl wl-kjv\" data-code=\"H7341\">breadth</span> of it; for I will give","18":"Then <span class=\"wl wl-kjv\" data-code=\"H87\">Abram</span> removed his <span class=\"wl wl-kjv\" data-code=\"H167\">tent,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> and <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelt</span> in the <span class=\"wl wl-kjv\" data-code=\"H436\">plain</span> of <span class=\"wl wl-kjv\" data-code=\"H4471\">Mamre,</span> which is in <span class=\"wl wl-kjv\" data-code=\"H2275\">Hebron,</span> and <span class=\"wl wl-kjv\" data-code=\"H1129\">built</span> there an <span class=\"wl wl-kjv\" data-code=\"H4196\">altar</span> unto the LORD."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"zuiden,","tekst":"Dat is, naar het zuidelijke gedeelte van Kanaän."}],"2":[{"catchword":"zeer rijk","tekst":"Hebr. zeer zwaar. Aldus gevoelde Abram de waarheid van de goddelijke belofte. Hij meende slechts den honger te ontgaan, en hij werd nog daarenboven zo verrijkt."}],"3":[{"catchword":"volgens zijn reizen,","tekst":"Dat is, volgende de wegen en plaatsen, door welke hij tevoren naar Egypte gereisd was; zie boven Gen 12:9, of, hij reisde zoals het vervoeren van zijn goederen en het voortgaan van zijn beesten dat lijden konden."},{"catchword":"Beth-el","tekst":"Zie boven Gen 12:8."},{"catchword":"in het begin","tekst":"Zie boven Gen 12:6, Gen 12:8."},{"catchword":"Ai","tekst":"Zie boven Gen 12:8."}],"4":[{"catchword":"den naam des HEEREN","tekst":"Verg. boven Gen 4:26."}],"6":[{"catchword":"droeg","tekst":"Dat is, kon hen niet dragen."}],"7":[{"catchword":"En er was twist","tekst":"Zie hoofdstuk Gen 21:26, waar van gelijken twist gesproken wordt."},{"catchword":"woonden","tekst":"Dewijl de oude ingezetenen niet veel plaats in een gedeelte van het land voor de vreemden overlieten, zo konden Abram en Lot, die zeer machtig in vee waren, en daarom bij de inwoners buiten twijfel benijd waren, niet wel tezamen in één oord hun behoeften aan weiden vinden; waaruit niet alleen twist onder de herders van Abram en Lot gerezen is, maar ook zwarigheid van de Kanaänieten hun overkomen Kon. Zie onder Gen 21:25, en Gen 26:15, Gen 26:20-21."}],"8":[{"catchword":"want wij zijn mannen broeders","tekst":"Wij zijn mannen broeders, niet alleen naar het vlees, want ik ben uw oom, en gij zijt mijn neef, maar ook naar den geest, want wij dienen één God, en zouden met onzen twist de ingezetenen ergeren en onzen godsdienst schande aandoen."}],"9":[{"catchword":"Is niet het ganse land","tekst":"Zulk een manier van vragen betekent een grote verzekering; alzo onder Gen 20:5; Exo 14:12; Jdg 4:6."},{"catchword":"voor uw aangezicht?","tekst":"Dat is, voor u open, om door u gebruikt te mogen worden. Zie gelijke manier van spreken, onder Gen 20:15, en Gen 34:10, Gen 34:21, Gen 47:6."},{"catchword":"kiest,","tekst":"Dit woord is hier ingevoegd uit het volgende vs.11."}],"10":[{"catchword":"Jordaan,","tekst":"Dit is de naam van een rivier, bevochtigende het land Kanaän, en spruitende uit twee fonteinen aan het gebergte Libanon, welke genaamd worden Jor en Dan."},{"catchword":"hof","tekst":"Hiermede wordt verstaan de hof Eden, dien God geplant had, of de hof des Heeren, dat is, een uitermate schone hof; gelijk het leger Gods, 1Ch 12:22. Gods bergen, Psa 36:7. De cederen Gods, Psa 80:11. De worstelingen Gods, onder Gen 30:8. Dat is, zeer grote. Het woord God /bt hier uitnemendheid."},{"catchword":"als Egypteland,","tekst":"Zie Eze 31, waar een vergelijking gemaakt wordt tussen de vruchtbaarheid van Egypte en Assyrië."},{"catchword":"Zoar","tekst":"Hebr. Tsohar, een stad gelegen omtrent Sodom en Gomórra, welke dezen naam heeft gekregen toen Lot daarin vluchtte; onder Gen 19:23; zijnde tevoren genaamd Bela; onder Gen 14:2."}],"11":[{"catchword":"de een van den ander","tekst":"Hebr. de man van zijn broeder."}],"13":[{"catchword":"zondaars","tekst":"Hebr. Zondaars tegen den Heere zeer. Niettegenstaande de grote boosheid der Sodomieten en andere omliggende volken, verkoos Lot deze landstreek, vanwege haar schoonheid. Anders, voor den Heere. Verg. boven Gen 6:11, en Gen 10:9."}],"14":[{"catchword":"En de HEERE zeide","tekst":"God troost Abram over het vertrek van zijn neef, en de verkiezing der schone landstreek."},{"catchword":"westwaarts","tekst":"Hebr. naar de zee, boven Gen 12:8."}],"15":[{"catchword":"Al dit land, dat gij ziet,","tekst":"Niet wat hij toen gans zag, maar wat hem gans beloofd werd."},{"catchword":"zal Ik","tekst":"Wel tot een aardse herberg voor uw vleselijk zaad, maar ook tot een teken van het hemelse vaderland voor uw geestelijk zaad. Verg. Heb 11:9-10, 14-16."},{"catchword":"u geven,","tekst":"Te weten, u het recht tot het aardse Kanaän, en uw zaad naar het vlees te zijner tijd de dadelijke bezitting; daarna u en uw geestelijk zaad, hier het recht tot het hemelse Kanaän en hierna de eeuwige bezitting daarvan; alles uit genade."},{"catchword":"tot in eeuwigheid","tekst":"Dat is, een langen tijd, te weten, totdat de Messias, het zaad der zegening, uit uw vlees geboren zijnde, het werk der verlossing op aarde zal volbracht hebben. Het /hw wordt in andere betekenissen dikwijls genomen voor den gansen tijd der wet. Zie onder Gen 17:13, en Gen 48:4; Psa 132:4. Of, eigenlijk in eeuwigheid, ten aanzien van het geestelijke Kanaän en het geestelijke zaad."}],"16":[{"catchword":"zaad","tekst":"Abrams zaad en het stof der aarde worden vergeleken met elkander, ten aanzien niet van een gelijk getal, maar van een grote menigte, die bij de mensen ontelbaar is; zie dergelijke manier van spreken, onder Gen 15:5, en Gen 22:17, en Gen 32:12."}],"18":[{"catchword":"sloeg tenten op,","tekst":"Dat is, in het reizen en vertrekken sloeg hij hier en daar zijn tenten op."},{"catchword":"eikenbossen","tekst":"Anders, in de effen velden."},{"catchword":"Mamre,","tekst":"Deze Mamre was // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

function bouwRijen() {

  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;

    paneel.className = 'paneel'; paneel.id = 'p' + n;

    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');

      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');

function toggle(n) {
  const paneel = document.getElementById('p' + n);

    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
