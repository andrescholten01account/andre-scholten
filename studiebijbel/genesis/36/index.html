 Ezau, dat is Edom.","2":"Ezau nam zijn vrouwen uit de dochters van Kanaän: Ada, de dochter van Elon, de Hethiet, en Aholibama, de dochter van Ana, de dochter van Zibeon, de Heviet;","3":"En Basmath, de dochter van Ismaël, zuster van Nebajoth.","4":"Ada nu baarde aan Ezau Elifaz, en Basmath baarde Rehuël.","5":"En Aholibama baarde Jehus, en Jaëlam, en Korah. Dit zijn de zonen van Ezau, die hem geboren zijn in het land Kanaän.","6":"Ezau nu had zijn vrouwen genomen, en zijn zonen, en zijn dochters, en alle mensen van zijn huis, en zijn vee, en al zijn dieren, en al zijn bezit, dat hij in het land Kanaän verworven had, en was vertrokken naar een *ander* land, weg van zijn broer Jakob.","7":"Want hun bezit was te veel om samen te wonen; en het land van hun vreemdelingschap[1] kon hen niet dragen vanwege hun vee.","8":"Daarom woonde Ezau op het gebergte Seïr. Ezau is Edom.","9":"Dit nu zijn de geboorten van Ezau, de vader van de Edomieten, op het gebergte van Seïr.","10":"Dit zijn de namen van de zonen van Ezau: Elifaz, de zoon van Ada, Ezaus vrouw; Rehuël, de zoon van Basmath, Ezaus vrouw.","11":"En de zonen van Elifaz waren: Teman, Omar, Zefo, en Gaetam, en Kenaz.","12":"En Timna was een bijvrouw van Elifaz, de zoon van Ezau, en zij baarde aan Elifaz Amalek; dit zijn de zonen van Ada, Ezaus vrouw.","13":"En dit zijn de zonen van Rehuël: Nahath, en Zerah, Samma en Mizza; dat zijn geweest de zonen van Basmath, Ezaus vrouw.","14":"En dit zijn geweest de zonen van Aholibama, dochter van Ana, dochter van Zibeon, Ezaus vrouw; en zij baarde aan Ezau Jehus, en Jaëlam, en Korah.","15":"Dit zijn de vorsten onder de zonen van Ezau: de zonen van Elifaz, de eerstgeborene van Ezau, waren: vorst Teman, vorst Omar, vorst Zefo, vorst Kenaz.","16":"Vorst Korah, vorst Gaetam, vorst Amalek; dat zijn de vorsten van Elifaz in het land Edom; dat zijn de zonen van Ada.","17":"En dit zijn de zonen van Rehuël, de zoon van Ezau: vorst Nahath, vorst Zerah, vorst Samma, vorst Mizza; dat zijn de vorsten van Rehuël in het land Edom; dat zijn de zonen van Basmath, de vrouw van Ezau.","18":"En dit zijn de zonen van Aholibama, de vrouw van Ezau: vorst Jehus, vorst Jaëlam, vorst Korah; dat zijn de vorsten van Aholibama, de dochter van Ana, de vrouw van Ezau.","19":"Dat zijn de zonen van Ezau, en dat zijn hun vorsten; hij is Edom.","20":"Dit zijn de zonen van Seïr, de Horiet, de inwoners van dat land: Lotan, en Sobal, en Zibeon, en Ana,","21":"En Dison, en Ezer, en Disan; dat zijn de vorsten van de Horieten, zonen van Seïr, in het land van Edom.","22":"En de zonen van Lotan waren Hori en Hemam; en Lotans zuster was Timna.","23":"En dit zijn de zonen van Sobal: Alvan en Manahath, en Ebal, en Sefo, en Onam.","24":"En dit zijn de zonen van Zibeon: Aja en Ana; dat is die Ana, die de muildieren in de woestijn gevonden heeft, toen hij de ezels van zijn vader Zibeon weidde.","25":"En dit zijn de zonen van Ana: Dison; en Aholibama was de dochter van Ana.","26":"En dit zijn de zonen van Dison: Hemdan, en Esban, en Ithran, en Cheran.","27":"Dit zijn de zonen van Ezer: Bilhan, en Zaävan, en Akan.","28":"Dit zijn de zonen van Disan: Uz en Aran.","29":"Dit zijn de vorsten van de Horieten: vorst Lotan, vorst Sobal, vorst Zibeon, vorst Ana.","30":"Vorst Dison, vorst Ezer, vorst Disan; dit zijn de vorsten van de Horieten, naar hun vorsten in het land Seïr.","31":"En dit zijn de koningen die geregeerd hebben in het land Edom, voordat er een koning regeerde over de kinderen van Israël.","32":"Bela dan, de zoon van Beor, regeerde in Edom, en de naam van zijn stad was Dinhaba.","33":"En Bela stierf, en Jobab, de zoon van Zerah, uit Bozra, regeerde in zijn plaats.","34":"En Jobab stierf, en Husam, uit het land van de Temanieten, regeerde in zijn plaats.","35":"En Husam stierf, en in zijn plaats regeerde Hadad, de zoon van Bedad, die Midian versloeg in het veld van Moab; en de naam van zijn stad was Avith.","36":"En Hadad stierf, en Samla, van Masreka, regeerde in zijn plaats.","37":"En Samla stierf, en Saul van Rehoboth, aan de rivier, regeerde in zijn plaats.","38":"En Saul stierf, en Baäl-Hanan, de zoon van Achbor, regeerde in zijn plaats.","39":"En Baäl-Hanan, de zoon van Achbor, stierf, en Hadar regeerde in zijn plaats; en de naam van zijn stad was Pahu; en de naam van zijn vrouw was Mechetabeël, een dochter van Matred, de dochter van Me-Zahab.","40":"En dit zijn de namen van de vorsten van Ezau, naar hun geslachten, naar hun plaatsen, met hun namen: vorst Timna, vorst Alva, vorst Jetheth,","41":"Vorst Aholibama, vorst Ela, vorst Pinon,","42":"Vorst Kenaz, vorst Teman, vorst Mibzar,","43":"Vorst Magdiël, vorst Iram; dit zijn de vorsten van Edom, naar hun woonplaatsen, in het land van hun bezit; hij is Ezau, de vader van Edom."},"SV":{"1":"Dit nu zijn de geboorten van Ezau, welke is Edom.","2":"Ezau nam zijn vrouwen uit de dochteren van Kanaän, Ada, de dochter van Elon, den Hethiet, en Aholibama, de dochter van Ana, de dochter van Zibeon, den Heviet;","3":"En Basmath, de dochter van Ismaël, zuster van Nebajoth.","4":"Ada nu baarde aan Ezau Elifaz, en Basmath baarde Rehuël.","5":"En Aholibama baarde Jehus, en Jaëlam, en Korah. Dit zijn de zonen van Ezau, die hem geboren zijn in het land Kanaän.","6":"Ezau nu had genomen zijn vrouwen, en zijn zonen, en zijn dochters, en al de zielen zijns huizes, en zijn vee, en al zijn beesten, en al zijn bezitting, die hij in het land Kanaän geworven had, en was vertrokken naar een *ander* land, van het aangezicht van zijn broeder Jakob.","7":"Want hun have was te veel, om samen te wonen; en het land hunner vreemdelingschappen kon ze niet dragen vanwege hun vee.","8":"Derhalve woonde Ezau op het gebergte Seir. Ezau is Edom.","9":"Dit nu zijn de geboorten van Ezau, den vader der Edomieten, op het gebergte van Seir.","10":"Dit zijn de namen der zonen van Ezau: Elifaz, de zoon van Ada, Ezau’s huisvrouw; Rehuël, de zoon van Basmath, Ezau’s huisvrouw.","11":"En de zonen van Elifaz waren: Teman, Omar, Zefo, en Gaetam, en Kenaz.","12":"En Timna was een bijwijf van Elifaz, den zoon van Ezau, en zij baarde aan Elifaz Amalek; dit zijn de zonen van Ada, Ezau’s huisvrouw.","13":"En dit zijn de zonen van Rehuël: Nahath, en Zerah, Samma en Mizza; dat zijn geweest de zonen van Basmath, Ezau’s huisvrouw.","14":"En dit zijn geweest de zonen van Aholibama, dochter van Ana, dochter van Zibeon, Ezau’s huisvrouw; en zij baarde aan Ezau Jehus, en Jaëlam, en Korah.","15":"Dit zijn de vorsten der zonen van Ezau: de zonen van Elifaz, den eerstgeborene van Ezau, waren: de vorst Teman, de vorst Omar, de vorst Zefo, de vorst Kenaz.","16":"De vorst Korah, de vorst Gaetam, de vorst Amalek; dat zijn de vorsten van Elifaz in het land Edom; dat zijn de zonen van Ada.","17":"En dit zijn de zonen van Rehuël, den zoon van Ezau: de vorst Nahath, de vorst Zerah, de vorst Samma, de vorst Mizza; dat zijn de vorsten van Rehuël in het land Edom; dat zijn de zonen van Basmath, de huisvrouw van Ezau.","18":"En dit zijn de zonen van Aholibama, de huisvrouw van Ezau: de vorst Jehus, de vorst Jaëlam, de vorst Korah; dat zijn de vorsten van Aholibama, de dochter van Ana, de huisvrouw van Ezau.","19":"Dat zijn de zonen van Ezau, en dat zijn hunlieder vorsten; hij is Edom.","20":"Dit zijn de zonen van Seir, den Horiet, inwoners van dat land: Lotan, en Sobal, en Zibeon, en Ana,","21":"En Dison, en Ezer, en Disan; dat zijn de vorsten der Horieten, zonen van Seir, in het land van Edom.","22":"En de zonen van Lotan waren Hori en Hemam; en Lotans zuster was Timna.","23":"En dit zijn de zonen van Sobal: Alvan en Manahath, en Ebal, en Sefo, en Onam.","24":"En dit zijn de zonen van Zibeon: Aja en Ana, hij is die Ana, die de muilen in de woestijn gevonden heeft, toen hij de ezels van zijn vader Zibeon weidde.","25":"En dit zijn de zonen van Ana: Dison; en Aholibama was de dochter van Ana.","26":"En dit zijn de zonen van Dison: Hemdan, en Esban, en Ithran, en Cheran.","27":"Dit zijn de zonen van Ezer: Bilhan, en Zaavan, en Akan.","28":"Dit zijn de zonen van Disan: Uz en Aran.","29":"Dit zijn de vorsten der Horieten: de vorst Lotan, de vorst Sobal, de vorst Zibeon, de vorst Ana.","30":"De vorst Dison, de vorst Ezer, de vorst Disan; dit zijn de vorsten der Horieten, naar hun vorsten in het land Seir.","31":"En dit zijn koningen, die geregeerd hebben in het land Edom, eer een koning regeerde over de kinderen Israëls.","32":"Bela dan, de zoon van Beor, regeerde in Edom, en de naam zijner stad was Dinhaba.","33":"En Bela stierf, en Jobab, de zoon van Zerah, van Bozra, regeerde in zijn plaats.","34":"En Jobab stierf, en Husam, uit der Temanieten land, regeerde in zijn plaats.","35":"En Husam stierf, en in zijn plaats regeerde Hadad, de zoon van Bedad, die Midian versloeg in het veld van Moab; en de naam zijner stad was Avith.","36":"En Hadad stierf, en Samla, van Masreka, regeerde in zijn plaats.","37":"En Samla stierf, en Saul van Rehoboth, aan de rivier, regeerde in zijn plaats.","38":"En Saul stierf, en Baäl-hanan, de zoon van Achbor, regeerde in zijn plaats.","39":"En Baäl-hanan, de zoon van Achbor, stierf, en Hadar regeerde in zijn plaats; en de naam zijner stad was Pahu; en de naam zijner huisvrouw was Mechetabeel, een dochter van Matred, de dochter van Me-zahab.","40":"En dit zijn de namen der vorsten van Ezau, naar hun geslachten, naar hun plaatsen, met hun namen: de vorst Timna, de vorst Alva, de vorst Jetheth,","41":"De vorst Aholibama, de vorst Ela, de vorst Pinon,","42":"De vorst Kenaz, de vorst Teman, de vorst Mibzar,","43":"De vorst Magdiel, de vorst Iram; dit zijn de vorsten van Edom, naar hun woningen, in het land hunner bezitting; hij is Ezau, de vader van Edom."},"KJV":{"1":"Now these *are* the generations of Esau, who *is* Edom.","2":"Esau took his wives of the daughters of Canaan; Adah the daughter of Elon the Hittite, and Aholibamah the daughter of Anah the daughter of Zibeon the Hivite;","3":"And Bashemath Ishmael's daughter, sister of Nebajoth.","4":"And Adah bare to Esau Eliphaz; and Bashemath bare Reuel;","5":"And Aholibamah bare Jeush, and Jaalam, and Korah: these *are* the sons of Esau, which were born unto him in the land of Canaan.","6":"And Esau took his wives, and his sons, and his daughters, and all the persons of his house, and his cattle, and all his beasts, and all his substance, which he had got in the land of Canaan; and went into the country from the face of his brother Jacob.","7":"For their riches were more than that they might dwell together; and the land wherein they were strangers could not bear them because of their cattle.","8":"Thus dwelt Esau in mount Seir: Esau *is* Edom.","9":"And these *are* the generations of Esau the father of the Edomites in mount Seir:","10":"These *are* the names of Esau's sons; Eliphaz the son of Adah the wife of Esau, Reuel the son of Bashemath the wife of Esau.","11":"And the sons of Eliphaz were Teman, Omar, Zepho, and Gatam, and Kenaz.","12":"And Timna was concubine to Eliphaz Esau's son; and she bare to Eliphaz Amalek: these *were* the sons of Adah Esau's wife.","13":"And these *are* the sons of Reuel; Nahath, and Zerah, Shammah, and Mizzah: these were the sons of Bashemath Esau's wife.","14":"And these were the sons of Aholibamah, the daughter of Anah the daughter of Zibeon, Esau's wife: and she bare to Esau Jeush, and Jaalam, and Korah.","15":"These *were* dukes of the sons of Esau: the sons of Eliphaz the firstborn *son* of Esau; duke Teman, duke Omar, duke Zepho, duke Kenaz,","16":"Duke Korah, duke Gatam, *and* duke Amalek: these *are* the dukes *that came* of Eliphaz in the land of Edom; these *were* the sons of Adah.","17":"And these *are* the sons of Reuel Esau's son; duke Nahath, duke Zerah, duke Shammah, duke Mizzah: these *are* the dukes *that came* of Reuel in the land of Edom; these *are* the sons of Bashemath Esau's wife.","18":"And these *are* the sons of Aholibamah Esau's wife; duke Jeush, duke Jaalam, duke Korah: these *were* the dukes *that came* of Aholibamah the daughter of Anah, Esau's wife.","19":"These *are* the sons of Esau, who *is* Edom, and these *are* their dukes.","20":"These *are* the sons of Seir the Horite, who inhabited the land; Lotan, and Shobal, and Zibeon, and Anah,","21":"And Dishon, and Ezer, and Dishan: these *are* the dukes of the Horites, the children of Seir in the land of Edom.","22":"And the children of Lotan were Hori and Hemam; and Lotan's sister *was* Timna.","23":"And the children of Shobal *were* these; Alvan, and Manahath, and Ebal, Shepho, and Onam.","24":"And these *are* the children of Zibeon; both Ajah, and Anah: this *was that* Anah that found the mules in the wilderness, as he fed the asses of Zibeon his father.","25":"And the children of Anah *were* these; Dishon, and Aholibamah the daughter of Anah.","26":"And these *are* the children of Dishon; Hemdan, and Eshban, and Ithran, and Cheran.","27":"The children of Ezer *are* these; Bilhan, and Zaavan, and Akan.","28":"The children of Dishan *are* these; Uz, and Aran.","29":"These *are* the dukes *that came* of the Horites; duke Lotan, duke Shobal, duke Zibeon, duke Anah,","30":"Duke Dishon, duke Ezer, duke Dishan: these *are* the dukes *that came* of Hori, among their dukes in the land of Seir.","31":"And these *are* the kings that reigned in the land of Edom, before there reigned any king over the children of Israel.","32":"And Bela the son of Beor reigned in Edom: and the name of his city *was* Dinhabah.","33":"And Bela died, and Jobab the son of Zerah of Bozrah reigned","34":"And Jobab died, and Husham of the land of Temani reigned","35":"And Husham died, and Hadad the son of Bedad, who smote Midian in the field of Moab, reigned in his stead: and the name of his city *was* Avith.","36":"And Hadad died, and Samlah of Masrekah reigned","37":"And Samlah died, and Saul of Rehoboth *by* the river reigned","38":"And Saul died, and Baalhanan the son of Achbor reigned","39":"And Baalhanan the son of Achbor died, and Hadar reigned in his stea \">Teman,</span> <span class=\"wl wl-kjv\" data-code=\"H441\">duke</span> Mibzar,","43":"<span class=\"wl wl-kjv\" data-code=\"H441\">Duke</span> <span class=\"wl wl-kjv\" data-code=\"H4025\">Magdiel,</span> <span class=\"wl wl-kjv\" data-code=\"H441\">duke</span> <span class=\"wl wl-kjv\" data-code=\"H5902\">Iram:</span> these be the <span class=\"wl wl-kjv\" data-code=\"H441\">dukes</span> of <span class=\"wl wl-kjv\" data-code=\"H123\">Edom,</span> according to their <span class=\"wl wl-kjv\" data-code=\"H4186\">habitations</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of their <span class=\"wl wl-kjv\" data-code=\"H272\">possession:</span> he is <span class=\"wl wl-kjv\" data-code=\"H6215\">Esau</span> the <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> of the Edomites."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"de geboorten","tekst":"Dat is nakomelingen; anders geslachten."},{"catchword":"Edom","tekst":"Zie boven, Gen 25:30."}],"2":[{"catchword":"Ezau","tekst":"Zie boven, Gen 26:34."},{"catchword":"van Kanaän","tekst":"Dat is, der Kanaänieten. Zie boven, Gen 10:18-19, en Gen 12:6."},{"catchword":"ada,","tekst":"Hebr. Adah, boven, Gen 26:34, genoemd Basmath."},{"catchword":"Hethiet,","tekst":"Een uit de volken van Kanaän, afkomstig van Kanaän, den zoon van Cham; boven Gen 10:15."},{"catchword":"Aholibáma,","tekst":"Zie boven, Gen 26:34."},{"catchword":"Ana,","tekst":"Hebr. Anah, anders genoemd, Beëri, boven, Gen 26:34, wel verstaande, indien Judith, aldaar vermeld, en deze Aholibama, één en dezelfde vrouw zijn geweest."},{"catchword":"de dochter","tekst":"Dat is, kindskind; aldus wordt Athalia genoemd zowel de dochter van Omri haar grootvader, als de dochter van Achab haar vader; 2Ki 8:18, 2Ki 8:26."},{"catchword":"Heviet","tekst":"Zie boven, Gen 10:15, Gen 10:17. De Hethieten en Hevieten schijnen zo nabij elkander gelegen en ondereen gemengd te zijn geweest, dat zij hun namen lichtelijk verwisseld hebben."}],"3":[{"catchword":"Basmath,","tekst":"Boven, Gen 28:9, genoemd Mahaloth."},{"catchword":"zuster","tekst":"Zie van deze boven, Gen 28:9, en van Nabajoth Gen 25:13."}],"4":[{"catchword":"Elifaz,","tekst":"Denzelfden naam heeft een van Jobs vrienden gehad, genaamd Elifaz van Teman, Job 2:11; zodat men meent, dat hij van dezen Elifaz voortgekomen is, door middel van zijn zoon Teman, die onder vs.1 genoemd wordt onder de kinderen van Elifaz."},{"catchword":"Rehuël.","tekst":"Dezen naam had ook de vader van Jethro, Mozes' vrouws vader. Exo 2:18; Num 10:29."}],"5":[{"catchword":"Korach","tekst":"Van een anderen Korach leest men Exo 6:20; Num 16:1."},{"catchword":"zonen","tekst":"Hij heeft ook dochters gehad, onder, vs.6, maar die worden niet genoemd."}],"6":[{"catchword":"zielen zijns","tekst":"Dat is, de personen, gelijk boven, Gen 12:5."},{"catchword":"vee, en","tekst":"Door vee versta men de kleine, en door beesten de grote dieren; gelijk ook boven, Gen 34:24; 2Ki 3:17."},{"catchword":"een ander","tekst":"Namelijk, naar Seïr, gelijk volgt."},{"catchword":"van het","tekst":"Of voor het aangezicht, dat is van wege Jakob. Dit is geschied door een heimelijke regering van God, omdat het land Kanaän hem door zijn vader, naar Gods bevel, beloofd was, en hij schuldig was dat voor zijn broeder te ruimen."}],"7":[{"catchword":"hun have","tekst":"Namelijk, van Jakob en Ezau; hoewel Ezau in dezen tijd in Seïr woonde, nochtans schijnt het, dat hij, met zijn broeder verzoend zijnde, met ter woon wedergekeerd is naar het land Kanaän; maar aangezien zij daar, beiden vreemdelingen zijnde, geen ruimte genoeg hadden voor hun vee, zo zou Ezau wedergekeerd zijn naar Seïr."},{"catchword":"land hunner","tekst":"Dat is, het land Kanaän. Zie boven, Gen 17:8."}],"8":[{"catchword":"op het","tekst":"Zie boven, Gen 14:6."},{"catchword":"Ezau is","tekst":"Dat is, Ezau is dezelfde man die ook Edom genoemd wordt."}],"9":[{"catchword":"der Edomieten","tekst":"Hebr. Edoms."}],"10":[{"catchword":"der zonen","tekst":"Dat is, kinderen en kindskinderen, of nakomelingen."}],"11":[{"catchword":"Zepho,","tekst":"Hebr. Tsepho; ook genoemd Tsephi, 1Ch 1:36."}],"12":[{"catchword":"Amalek","tekst":"De vader der Amelekieten, van wien wij lezen Exo 17:8; Deu 25:17, en 1Sa 15:2."},{"catchword":"de zonen","tekst":"Zie boven, vs.10, en zo vervolgens."}],"13":[{"catchword":"Zerah,","tekst":"Zie onder, vs.33."}],"15":[{"catchword":"de vorsten","tekst":"Deze vorsten hebben niet de een na des anderen dood geregeerd, maar tegelijk op één tijd, een iegelijk over de zijnen. Doch zij zijn geen machtige vorsten geweest; zij waren hoofden, of de voornaamsten der geslachten, gelijk gouverneurs of leidsmannen."},{"catchword":"Zepho,","tekst":"Hebr. Tsepho."}],"16":[{"catchword":"Korach,","tekst":"Deze is te onderscheiden van den anderen Korach, een zoon van Aholibama, vs.5, 14, 18. Hij kan een neef van Elifaz geweest zijn."}],"20":[{"catchword":"Seïr,","tekst":"Deze Seïr is daar geweest de eerste vorst, van wien het land oorspronkelijk den naam Seïr bekomen heeft. Dit geslacht wordt hier verhaald, omdat Ezau en Elifaz met hun nakomelingen daarmede, door middel van het huwelijk, zijn vermaagschapt, en dat de heerschappij over het land van de Horieten op de nakomelingen van Ezau gekomen is; uit vergelijking van dit vs. en vs.2, blijkt, dat de Horieten en Hevieten voor één genomen worden."}],"21":[{"catchword":"Dison, en","tekst":"Die ook Disan genoemd wordt, vs.26."},{"catchword":"der Horieten,","tekst":"Hebr. des Horieters."}],"22":[{"catchword":"Hemam;","tekst":"Hij wordt 1Ch 1:39, Homam genoemd."},{"catchword":"Timna","tekst":"Zie boven, vs.12."}],"23":[{"catchword":"Alvan","tekst":"Hij wordt 1Ch 1:40, Alian genoemd."},{"catchword":"Sepho,","tekst":"Ook genoemd Sephi, 1Ch 1:40."}],"24":[{"catchword":"die de muilen","tekst":"Dat is, die eerst bedacht heeft een merrie bij een ezel te voegen, waaruit een derde soort van gedierte, half-ezel half-paard, is voortgebracht, welk gebruik nog duurt, alhoewel God verboden heeft, Lev 19:19, onderscheiden geslachten van beesten te vermengen."}],"25":[{"catchword":"zonen van","tekst":"Dat is, zoon, of kinderen. Zo is het veelvoudig getal voor het enkelvoudige genomen. Zie boven, Gen 21:7."},{"catchword":"Aholibáma","tekst":"Zie boven, vs.2, 5."},{"catchword":"Ana","tekst":"Deze is een ander dan van wien boven, vs.20, gesproken wordt."}],"26":[{"catchword":"Hemdan","tekst":"Genoemd Hemran; 1Ch 1:41."}],"27":[{"catchword":"Ezer","tekst":"Hebr. Etsers."},{"catchword":"Akan","tekst":"Anders, Jacan; 1Ch 1:42."}],"28":[{"catchword":"Uz","tekst":"Hebr. Uts."}],"29":[{"catchword":"der Horieten","tekst":"Hebr. des Chorieters, en alzo in het volgende."}],"30":[{"catchword":"naar hun","tekst":"Anders, onder hun vorsten, of naar hun vorstendommen."}],"31":[{"catchword":"koningen, die","tekst":"Gesproten uit Ezaus nakomelingen, die de Horieten verdrukt en van hun vorstendommen een koninkrijk gemaakt hebben."},{"catchword":"eer een","tekst":"Ezaus geslacht heeft welhaast gebloeid, doch is haast vergaan; maar Jacobs geslacht, later opgekomen zijnde, heeft veel langer geduurd, ja het duurt eeuwiglijk in zijn gebenedijd zaad van onzen Heere Jezus Christus."},{"catchword":"kinderen","tekst":"Of, zonen, nakomelingen."}],"32":[{"catchword":"zijner stad","tekst":"Waar hij geboren was. Aldus worden vervolgens de geboorteplaatsen dezer koningen aangewezen; welke, daar zij onderscheiden geweest zijn, zo schijnen die koningen, niet bij orde van successie maar door verkiezing of geweld, aan de regering gekomen te zijn."}],"33":[{"catchword":"Bozra,","tekst":"Hebr. Botsrah. Een hoofdstad in Idumea; zie van deze Isa 34:6, en Isa 63:1; Amo 1:12."}],"34":[{"catchword":"uit der","tekst":"Hebr. des Temanietiers; aldus genoemd naar Teman, den zoon van Elifaz; zie van dezen boven, vs.4, 11, 15; van het land, Jer 49:7, Jer 49:20. Van hier schijnt ook afkomstig geweest te zijn Elifaz van Teman, een der vrienden van Job, Job 2:11."}],"35":[{"catchword":"Midian","tekst":"Dat is, de Midianieten; zie boven, Gen 25:2."}],"37":[{"catchword":"Saul van","tekst":"Deze is wel te onderscheiden van Saul, den zoon van Kis, die de eerste koning was van Israel."},{"catchword":"aan de","tekst":"Dat is aan de rivier gelegen; tot onderscheid van een ander Rehoboth, boven Gen 10:11."}],"39":[{"catchword":"de dochter","tekst":"Dat is, nicht, kindskind; verg. boven, vs.2."}],"40":[{"catchword":"vorsten","tekst":"Dat is, van Ezau afkomstig, die na de koningen het regiment in Idumea, òf tezamen, òf na elkander gehad hebben."},{"catchword":"met hun","tekst":"Dat is, niet alleen van hun personen, maar ook van hun geslachten, huisgezinnen en woonplaatsen, welke veel genoemd zijn geweest naar de personen."},{"catchword":"Timna,","tekst":"Dit is hier een mansnaam, gelijk ook vs.41, Aholibama, en onderscheidene personen van degenen, die boven, vs.2, 5, 12, genoemd staan."}],"42":[{"catchword":"Mibzar,","tekst":"Hebr. Mibtsar."}],"43":[{"catchword":"Edom","tekst":"Dat is, der Edomieten."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"These now are the births of Esau [that is his posterity issue or off springs other generation] which is Edom see above chaper25.30.]"}],"2":[{"catchword":null,"tekst":"Esau took his wives [see above chapter 26.34 and 32.3 and 33.14,16] out of the daughters of Canaan [that is the Canaanites see above chapter 10 verse 18 ,19 and 12,6] Ada the daughters of Elon [Hebrews Adah above chapter 26.34 called Besmath] the Hethite [one of the people of Canaan descending from Canaan the son of Cham above chapter 10.15] Aholibama [see above chapter 6 on verse 34] the daughters of Ana [Heb. Anah otherwise called Beri above chapter 26.34 at leastwise if Judith here mentioned an dthis Aholibama were one and the same woman] the daughters of Zebeon the Hevite [his grand child thus Athalia is called as well the daughters of Amri her grand father as of Achab her immediate father of the surname Hevite see above chapter 10 verse 15,17 the Hethites and the Hevites seem to lain so contiguous one to another an dpermixed that their names might easily be taken the one for another.]"}],"3":[{"catchword":null,"tekst":"And Basmath [above chapter 28.9 called Mahalath] Ishmaels daughter Nebajoths sister [of this woman see above chapter 28 on verse 9 and Nebajoth chapter 5.13.]"}],"4":[{"catchword":null,"tekst":"Now Adah bare to Esau Eliphaz [this same name on of Jobs friends Job 2:11 so that some conceive him to be issued from this Eliphaz here by means of his son Teman whose name is recorded below verse 11 among the children of Eliphaz.] and Basmath bare Rebuel [this name Jethros father likewise had the grand father likewise had the grand father of Mosehs wife Exo 2:18 Numbers10.29.]"}],"5":[{"catchword":null,"tekst":"And Abolihama bare Jebus and Jaelem and Korah [of another korah we read Exo 6:21 Num 16:1] these are Esaus sons [he had daughters likewise verse 6 but their names are registered] which were born to him in the land of Canaan."}],"6":[{"catchword":null,"tekst":"Now Esau had taken his wives and his sons and his daughters and all the souls [that is persons as chapter 12.5] of his house and cattle and all his beast [by cattle here we understand the lesser sort by the beast the bigger as likewise above chapter 34.23 and 2Ki 3:17] and all his possession which he had gotten in the land of Canaan and was gone to another land [viz. to the land of Seir as followeth ] from the face of his father Jacob [or before the face that is by reason of Jacob this was brought to pass by Gods secret disposing and ordering it thus since his father had according to Gods command promised Jacob the inheritance of the land of Canaan which Esau therefore stood obliged to clear for his brother.]"}],"7":[{"catchword":null,"tekst":"For their substance or wealth [viz. Jacob and Esau] was too great for to dwell together [though Esau dwelt in Sier at this time nevertheless it should seem that being reconciled with his brother he returned and took up his habitation in the land of Canaan but being both strangers in the country and not having room enough for all their cattle Esau afterwards returned again into Sier] and the land of their stranger ship or sojourning [that is the land of Canaan see above chapter 17 on verse 8] could not bear them by reason of their cattle."}],"8":[{"catchword":null,"tekst":"Therefore dwelt upon mount Seir [see above chapter 14 on verse 6] Esau is Edom [that is Esau is the same man who elsewhere is called Edom.]"}],"9":[{"catchword":null,"tekst":"These are the births of Esau the father of the Edomites [Heb. Of Edom] upon mount Seir."}],"11":[{"catchword":null,"tekst":"And the son of Eliphaz are Teman Omar Zepho[Heb. Tsepho called likewise Tsephi 1Ch 1:36] and Gaelam and Kenaz."}],"12":[{"catchword":null,"tekst":"And Timna was Eliphaz the son of Esau his concubines and she bare to Eliphaz Amelek [the father of Amelekites of whom we read Exo 17:8 deuteronomy25.17and 1Samuel 15. ] these are the sons of Adah Esaus wife [see above verse 10so in the seuel.]"}],"13":[{"catchword":null,"tekst":"And these are the sons of Rebuel Nahath and Zerah [see below verse 33] Samma and Miza these were the sons of Besmath Esau&acirc;&euro;&trade;s wife."}],"14":[{"catchword":null,"tekst":"And these were the sons of Aholibama daughters of Anah daughters of Zibeon Esau&acirc;&euro;&trade;s wife and her bare to Esau Jebus and Jaelam and Korah."}],"15":[{"catchword":null,"tekst":"These are the princes of the sons of Esau [these princes did not reign successively after one another death but much together at one time each one over another death but much together at one time each one over their peculiar people nevertheless they were no very great or mighty princes but the heads of the chief among their generation or families s the governors and leaders of the rest] the son of Eliphaz the first born of Esau were Prince Teman Prince Omar prince Zepho an dprince Kenaz."}],"16":[{"catchword":null,"tekst":"Prince Koran [this Koran is to be distinguished from the other the sons of Aholibama verse 5.14,18 he may have been the grand child of Eliphaz in the land of Edom these are the sons of Ada ."}],"17":[{"catchword":null,"tekst":"And these are the sons of Rebuel the sons of Esau prince Nahath prince Zerah prince Samma prince Mizza these are the princes of Rebuel in the land of Edom these are the sons of Besmath the wife of Esau."}],"18":[{"catchword":null,"tekst":"And these are sons of Aholibama Esau&acirc;&euro;&trade;s wife prince Jebus prince Jaelam prince Korah these are the princes of Aholibama the daughter of Anah Esau&acirc;&euro;&trade;s wife."}],"19":[{"catchword":null,"tekst":"These are the sons of Esau and these are their prince that is Edom."}],"20":[{"catchword":null,"tekst":"These are the sons of Seir the Horite [this Horite had been the first prince there from whom the land also dominated the generation Genealogy is inserted here because of Esau and Eliphaz with their posterities their alliance with them by mean of marriages and that the dominion of this land of the Horites was devolved afterwards unto the off spring of Esau by comparing this verse with verse 2 it seems that the Horites and the Hevites are taken for and the same people ] inhabitants of that land Lothan and Sobal and Zibeon and Anah."}],"21":[{"catchword":null,"tekst":"And Dizon [who likewise is called Disan verse 26] and Ezer and Dizan these are the princes of the Horites [Heb. The Horites] son of Seir in the land of Edom."}],"22":[{"catchword":null,"tekst":"And the sons of Lathan were Hori and Heman [1Ch 1:39 he is called Hemam] and Lothan sister was Timna [see above verse 12.]"}],"23":[{"catchword":null,"tekst":"And the sons of Sobal Alvan [called Alian 1Ch 1:30] and Manahat and Ebal and Sepho [called Sephi 1Ch 1:40] and Oman."}],"24":[{"catchword":null,"tekst":"And these are sons of Zibeon Aia and Ana he is that ana which found the mules in the wilderness as he fed or kept his father Zibeon asses [that is he was the first that divised the joining of a mare to an ass whence issued a third sort half ass half horse called mules the use whereof continued ever since notwithstanding that God hath forbidden the mixing of several kinds of beasts Lev 19:19.]"}],"25":[{"catchword":null,"tekst":"These are the sons of Ana [that is the sons or children thus the plural is taken for singular see above chapter 21 verse 7] Dison and Aholibama [see above verse 2 and 5 ] was the daughter of Ana [this is another then was mentioned above verse 20.]"}],"26":[{"catchword":null,"tekst":"And these are sons of Disan Hemdan called Hemtan 1Ch 1:41] and Esban and Ithran and Cheran."}],"27":[{"catchword":null,"tekst":"These are the sons of Ezer [Heb. Etser] Bilban and Saavan and Acan [others Jaacan 1Ch 1:41.]"}],"28":[{"catchword":null,"tekst":"These are the sons of Disan Uz [Heb. Uts] and Aran."}],"29":[{"catchword":null,"tekst":"These are the princes of Horites [Heb. of the Chorites and so in the seuel] prince Lothan prince Sebal prince Zibeon prince Ana."}],"30":[{"catchword":null,"tekst":"Prince Dison prince Ezer prince Disan these are the princes of the Horites according to their princes [others under the princes or according to the principalities] in the land of Seir."}],"32":[{"catchword":null,"tekst":"Bella than the son of Beor reigned in Edom and the name of his city [viz. where he was born and so in the sequel the name of the city joined to these kings were the places of the Ninivites which having been divers it should seem those kings came not to the government by order of succession but by election or the prevalence of power] was Dinhaba."}],"33":[{"catchword":null,"tekst":"And Bela died and Johab the son of Zerah of Bozra [Heb. Botsra a principal city in Idumea see of it in Isa 34:6 a d 63.1 and Amos 1.12] reigned in his place."}],"34":[{"catchword":null,"tekst":"And Jobab died and Husam out of the land of Temanites [Heb. The Temanite so called from the man the son of Eliphaz of whom see above verse 4,11,15 and of the country Jer 49:7,20 hence also it should seem was that Eliphaz of Teman one of the friends of Job chapter 2.11] reigned his stead."}],"35":[{"catchword":null,"tekst":"And Husam died and his stead there reigned Hadad the son of Bedad who smote Midian [that is the Midianites see above chapter 5 on verse 2] in the field of Moab and the name of the city was Avith."}],"36":[{"catchword":null,"tekst":"And Hadad died and Samla of Mesreka reigned in his stead."}],"37":[{"catchword":null,"tekst":"And Samla died And Saul of Rahoboth [this distinguished him from the son of Kis the first king of Israel ] on the river [that is situated by the river side to difference it from another rahoboth above chapter 10.11] reigned in his place."}],"38":[{"catchword":null,"tekst":"And Saul died and Baal-Hanan the son of Archor reigned in his stead."}],"39":[{"catchword":null,"tekst":"And Baal Hanan the son of Achbor died and Hadar reigned in his stead and the name of the city was Pahu and the name of the wife was Mahetabel a daughter of Mehetabeel of Matred the daughter [that is the grandchild compare above verse 2] of Mezehab."}],"40":[{"catchword":null,"tekst":"And these are names of the princes of Esau [that is descending from him who after the kings had the government in Idumea either together at one time or successively ] according to their generation according to their places by their names [that is not only of their persons but likewise of their generation families and habitations which were much varied according to the persons ] princes Timna [this is a mans name here as also verse 41 Aholibama is different person from them above mentioned verse 2,5,12] prince Alva prince Jatheth."}],"41":[{"catchword":null,"tekst":"Prince Aholibama, prince Ela, prince Pinon."}],"42":[{"catchword":null,"tekst":"Prince Kenaz, prince Teman, prince Mibzar [Heb. Mibtsar.]"}],"43":[{"catchword":null,"tekst":"Prince Magdel prince Iram these are the princes of Edom according to their habitation in the land of of their possession he is Esau the father of Edom [that is the Edomites.]"}]}}};

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');

    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');

  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);

});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
