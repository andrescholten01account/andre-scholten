nen, en hij zei: Verzamel u, en ik zal u vertellen wat u in de laatste dagen zal overkomen.","2":"Kom samen en hoor, zonen van Jakob! En luister naar Israël, uw vader.","3":"Ruben! U bent mijn eerstgeborene, mijn kracht, en het begin van mijn macht; de voortreffelijkste in hoogheid, en de voortreffelijkste in sterkte!","4":"Snelle afloop als van water, u zult niet de voortreffelijkste zijn! Want u hebt het bed van uw vader beklommen; toen hebt u het geschonden; hij heeft mijn bed beklommen!","5":"Simeon en Levi zijn broers! Hun wapens zijn werktuigen van geweld!","6":"Mijn ziel, kom niet in hun verborgen raad; mijn eer, wordt niet verenigd met hun vergadering! Want in hun toorn hebben zij de mannen doodgeslagen, en in hun moedwil hebben zij de ossen* verlamd.","7":"Vervloekt is hun toorn, want hij is heftig; en hun verbolgenheid, want zij is hard! Ik zal hen verdelen onder Jakob, en zal hen verstrooien onder Israël.","8":"Juda! U bent het, u zullen uw broers loven; uw hand zal zijn op de nek van uw vijanden; voor u zullen de zonen van uw vader zich neerbuigen.","9":"Juda is een leeuwenwelp! U bent van de roof opgeklommen, mijn zoon! Hij kromt zich, hij legt zich neer als een leeuw, en als een oude leeuw; wie zal hem doen opstaan?","10":"De scepter zal van Juda niet wijken, evenmin de wetgever van tussen zijn voeten, totdat Silo komt, en Hem zullen de volken gehoorzaam zijn.","11":"Hij bindt zijn jonge ezel aan de wijnstok, en het veulen van zijn ezelin aan de edelste wijnstok; hij wast zijn kleed in de wijn, en zijn mantel in wijndruivenbloed.","12":"Hij is roodachtig van ogen door de wijn, en wit van tanden door de melk.","13":"Zebulon zal aan de haven van de zeeën wonen, en hij zal aan de haven van de schepen wezen; en zijn grens zal zijn naar Sidon.","14":"Issaschar is een sterk gebeende ezel, neerliggende tussen twee pakken.","15":"Toen hij de rust zag, dat zij goed was, en het land, dat het lieflijk was, boog hij zijn schouder om te dragen, en werd dienstbaar onder cijns.","16":"Dan zal zijn volk richten, als een van de stammen van Israël.","17":"Dan zal een slang zijn aan de weg, een adderslang naast het pad, die de hielen van het paard bijt, zodat zijn ruiter achterover valt.","18":"Op Uw zaligheid wacht ik, HEERE!","19":"Aangaande Gad, een bende zal hem aanvallen; maar hij zal haar aanvallen aan het einde.","20":"Van Aser, zijn brood zal vet zijn; en hij zal koninklijke lekkernijen leveren.","21":"Nafthali is een losgelaten hinde; hij spreekt schone woorden.","22":"Jozef is een vruchtbare tak, een vruchtbare tak aan een fontein; elk van de takken loopt over de muur.","23":"De schutters hebben hem wel bitterheid aangedaan, en op hem geschoten, en hem gehaat;","24":"Maar zijn boog is in stevigheid gebleven, en de armen van zijn handen zijn gesterkt, door de handen van de Machtige van Jakob; vandaar is hij een herder, een steen van Israël;","25":"Van de God van uw vader, Die u zal helpen, en van de Almachtige, Die u zal zegenen, met zegeningen van de hemel van boven, met zegeningen van het afgrond, dat daaronder ligt, met zegeningen van de borsten en van de baarmoeder!","26":"De zegeningen van uw vader gaan de zegeningen van mijn voorvaderen te boven, tot aan het einde van de eeuwige heuvels; die zullen zijn op het hoofd van Jozef, en op de hoofdschedel van hem die afgezonderd is van zijn broers!","27":"Benjamin zal als een wolf verscheuren; 's morgens zal hij roof eten, en 's avonds zal hij buit uitdelen.","28":"Al deze stammen van Israël zijn twaalf; en dit is het wat hun vader tot hen sprak, toen hij hen zegende; hij zegende hen, ieder naar zijn eigen zegen.","29":"Daarna gaf hij hun een opdracht, en zei tegen hen: Ik word verzameld tot mijn volk: begraaf mij bij mijn vaders, in de spelonk die is in de akker van Efron, de Hethiet;","30":"In de spelonk die op de akker van Machpela is, die tegenover Mamre is, in het land Kanaän, die Abraham met die akker gekocht heeft van Efron, de Hethiet, tot een erfbegrafenis.","31":"Daar hebben zij Abraham begraven, en Sara, zijn vrouw; daar hebben zij Izak begraven, en Rebekka, zijn vrouw; en daar heb ik Lea begraven.","32":"De akker, en de spelonk die daarin is, is gekocht van de zonen van Heth.","33":"Toen Jakob geëindigd had zijn zonen opdrachten te geven, legde hij zijn voeten samen op het bed, en gaf de geest, en hij werd verzameld tot zijn volken."},"SV":{"1":"Daarna riep Jakob zijn zonen, en hij zeide: Verzamelt u, en ik zal u verkondigen, hetgeen u in de navolgende dagen wedervaren zal.","2":"Komt samen en hoort, gij, zonen van Jakob! en hoort naar Israël, uw vader.","3":"Ruben! gij zijt mijn eerstgeborene, mijn kracht, en het begin mijner macht; de voortreffelijkste in hoogheid, en de voortreffelijkste in sterkte!","4":"Snelle afloop als der wateren, gij zult de voortreffelijkste niet zijn! want gij hebt uws vaders leger beklommen; toen hebt gij *het* geschonden; hij heeft mijn bed beklommen!","5":"Simeon en Levi zijn gebroeders! hun handelingen zijn werktuigen van geweld!","6":"Mijn ziel kome niet in hun verborgen raad; mijn eer worde niet verenigd met hun vergadering! want in hun toorn hebben zij de mannen doodgeslagen, en in hun moedwil hebben zij de ossen weggerukt.","7":"Vervloekt zij hun toorn, want hij is heftig; en hun verbolgenheid, want zij is hard! ik zal hen verdelen onder Jakob, en zal hen verstrooien onder Israël.","8":"Juda! gij zijt het, u zullen uw broeders loven; uw hand zal zijn op den nek uwer vijanden; voor u zullen zich uws vaders zonen nederbuigen.","9":"Juda is een leeuwenwelp! gij zijt van den roof opgeklommen, mijn zoon! Hij kromt zich, hij legt zich neder als een leeuw, en als een oude leeuw; wie zal hem doen opstaan?","10":"De schepter zal van Juda niet wijken, noch de wetgever van tussen zijn voeten, totdat Silo komt, en Denzelven zullen de volken gehoorzaam zijn.","11":"Hij bindt zijn jongen ezel aan den wijnstok, en het veulen zijner ezelin aan den edelsten wijnstok; hij wast zijn kleed in den wijn, en zijn mantel in wijndruivenbloed.","12":"Hij is roodachtig van ogen door den wijn, en wit van tanden door de melk.","13":"Zebulon zal aan de haven der zeeën wonen, en hij zal aan de haven der schepen wezen; en zijn zijde zal zijn naar Sidon.","14":"Issaschar is een sterk gebeende ezel, nederliggende tussen twee pakken.","15":"Toen hij de rust zag, dat zij goed was, en het land, dat het lustig was, zo boog hij zijn schouder om te dragen, en was dienende onder cijns.","16":"Dan zal zijn volk richten, als een der stammen Israëls.","17":"Dan zal een slang zijn aan den weg, een adderslang nevens het pad, bijtende des paards verzenen, dat zijn rijder achterover valle.","18":"Op uw zaligheid wacht ik, HEERE!","19":"Aangaande Gad, een bende zal hem aanvallen; maar hij zal *haar* aanvallen in het einde.","20":"Van Aser, zijn brood zal vet zijn; en hij zal koninklijke lekkernijen leveren.","21":"Nafthali is een losgelaten hinde; hij geeft schone woorden.","22":"Jozef is een vruchtbare tak, een vruchtbare tak aan een fontein; elk der takken loopt over den muur.","23":"De schutters hebben hem wel bitterheid aangedaan, en beschoten, en hem gehaat;","24":"Maar zijn boog is in stijvigheid gebleven, en de armen zijner handen zijn gesterkt geworden, door de handen van den Machtige Jakobs; daarvan is hij een herder, een steen Israëls;","25":"Van uws vaders God, Die u zal helpen, en van den Almachtige, Die u zal zegenen, met zegeningen des hemels van boven, met zegeningen des afgronds, die daaronder ligt, met zegeningen der borsten en der baarmoeder!","26":"De zegeningen uws vaders gaan te boven de zegeningen mijner voorvaderen, tot aan het einde van de eeuwige heuvelen; die zullen zijn op het hoofd van Jozef, en op den hoofdschedel des afgezonderden zijner broederen!","27":"Benjamin zal *als* een wolf verscheuren; des morgens zal hij roof eten, en des avonds zal hij buit uitdelen.","28":"Al deze stammen van Israël zijn twaalf; en dit is het, wat hun vader tot hen sprak, als hij hen zegende; hij zegende hen, een iegelijk naar zijn bijzonderen zegen.","29":"Daarna gebood hij hun, en zeide tot hen: Ik word verzameld tot mijn volk: begraaft mij bij mijn vaders, in de spelonk, die is in den akker van Efron, den Hethiet;","30":"In de spelonk, welke is op den akker van Machpela, die tegenover Mamre is, in het land Kanaän, die Abraham met dien akker gekocht heeft van Efron, den Hethiet, tot een erfbegrafenis.","31":"Aldaar hebben zij Abraham begraven, en Sara, zijn huisvrouw; daar hebben zij Izak begraven, en Rebekka, zijn huisvrouw; en daar heb ik Lea begraven.","32":"De akker, en de spelonk, die daarin is, is gekocht van de zonen Heths.","33":"Als Jakob voleind had aan zijn zonen bevelen te geven, zo leide hij zijn voeten samen op het bed, en hij gaf den geest, en hij werd verzameld tot zijn volken."},"KJV":{"1":"And Jacob called unto his sons, and said, Gather yourselves together, that I may tell you *that* which shall befall you in the last days.","2":"Gather yourselves together, and hear, ye sons of Jacob; and hearken unto Israel your father.","3":"Reuben, thou *art* my firstborn, my might, and the beginning of my strength, the excellency of dignity, and the excellency of power:","4":"Unstable as water, thou shalt not excel; because thou wentest up to thy father's bed; then defiledst thou *it*: he went up to my couch.","5":"Simeon and Levi *are* brethren; instruments of cruelty *are in* their habitations.","6":"O my soul, come not thou into their secret; unto their assembly, mine honour, be not thou united: for in their anger they slew a man, and in their selfwill they digged down a wall.","7":"Cursed *be* their anger, for *it was* fierce; and their wrath, for it was cruel: I will divide them in Jacob, and scatter them in Israel.","8":"Judah, thou *art he* whom thy brethren shall praise: thy hand *shall be* in the neck of thine enemies; thy father's children shall bow down","9":"Judah *is* a lion's whelp: from the prey, my son, thou art gone up: he stooped down, he couched as a lion, and as an old lion; who shall rouse him up?","10":"The sceptre shall not depart from Judah, nor a lawgiver from between his feet, until Shiloh come; and unto him *shall* the gathering of the people","11":"Binding his foal unto the vine, and his ass's colt unto the choice vine; he washed his garments in wine, and his clothes in the blood of grapes:","12":"His eyes *shall be* red with wine, and his teeth white with milk.","13":"Zebulun shall dwell at the haven of the sea; and he *shall be* for an haven of ships; and his border *shall be* unto Zidon.","14":"Issachar *is* a strong ass couching down between two burdens:","15":"And he saw that rest *was* good, and the land that *it was* pleasant; and bowed his shoulder to bear, and became a servant unto tribute.","16":"Dan shall judge his people, as one of the tribes of Israel.","17":"Dan shall be a serpent by the way, an adder in the path, that biteth the horse heels, so that his rider shall fall backward.","18":"I have waited for thy salvation, O LORD.","19":"Gad, a troop shall overcome him: but he shall overcome at the last.","20":"Out of Asher his bread *shall be* fat, and he shall yield royal dainties.","21":"Naphtali *is* a hind let loose: he giveth goodly words.","22":"Joseph *is* a fruitful bough, *even* a fruitful bough by a well; *whose* branches run over the wall:","23":"The archers have sorely grieved him, and shot *at him*, and hated him:","24":"But his bow abode in strength, and the arms of his hands were made strong by the hands of the mighty *God* of Jacob; (from thence *is* the shepherd, the stone of Israel:)","25":"*Even* by the God of thy father, who shall help thee; and by the Almighty, who shall bless thee with blessings of heaven above, blessings of the deep that lieth under, blessings of the breasts, and of the womb:","26":"The blessings of thy father have prevailed above the blessings of my progenitors unto the utmost bound of the everlasting hills: they shall be on the head of Joseph, and on the crown of the head of him that was separate from his brethren.","27":"Benjamin shall ravin *as* a wolf: in the morning he shall devour the prey, and at night he shall divide the spoil.","28":"All these *are* the twelve tribes of Israel: and this *is it* that their father spake unto them, and blessed them; every one according to his blessing he blessed","29":"And he charged them, and said unto them, I am to be gathered unto my people: bury me with my fathers in the cave that *is* in the field of Ephron the Hittite,","30":"In the cave that *is* in the field of Machpelah, which *is* before Mamre, in the land of Canaan, which Abraham bought with the field of Ephron the Hittite for a possession of a buryingplace.","31":"There they buried Abraham and Sarah his wife; there they buried Isaac and Rebekah his wife; and there I buried Leah.","32":"The purchase of the field and of the cave that *is* therein *was* from the children of Heth.","33":"And when Jacob had made an end of commanding his sons, he gathered up his feet into the bed, and yielded up the ghost, and was gathered unto his people."}},"tsk":{"1":[{"kopje":"Verzamel","refs":["Deut 31:12","Deut 31:28","Deut 31:29","Deut 33:1-29","Ps 25:14","Ps 105:15","Jes 22:14","Jes 53:1","Dan 2:47","Dan 10:1","Amos 3:7","Luk 2:26","Rom 1:17","Rom 1:18","Hebr 10:24","Hebr 10:25","Hebr 13:1","Openb 4:1"]},{"kopje":"laatste dagen","refs":["Num 24:14","Deut 4:30","Deut 31:29","Jes 2:2","Jes 39:6","Jer 23:20","Dan 2:28","Dan 2:29","Dan 10:14","Micha 4:1","Hand 2:17","1 Tim 4:1","2 Tim 3:1","Hebr 1:2"]}],"2":[{"kopje":"luister","refs":["Ps 34:12","Spr 1:8","Spr 1:9","Spr 4:1-4","Spr 5:1","Spr 6:20","Spr 7:1","Spr 7:24","Spr 8:32","Spr 23:22","Spr 23:26"]}],"3":[{"kopje":"mijn eerstgeborene","refs":["Gen 29:32","Gen 46:8","Gen 48:18","Num 1:20","Num 26:5","1 Kron 2:1","1 Kron 5:1","1 Kron 5:3"]},{"kopje":"mijn macht","refs":["Deut 21:17","Ps 78:51","Ps 105:36"]}],"4":[{"kopje":"Snelle afloop als van wa l-kjv\" data-code=\"H8085\">hearken</span> unto <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> your father.","3":"<span class=\"wl wl-kjv\" data-code=\"H7205\">Reuben,</span> thou art my <span class=\"wl wl-kjv\" data-code=\"H1060\">firstborn,</span> my <span class=\"wl wl-kjv\" data-code=\"H3581\">might,</span> and the <span class=\"wl wl-kjv\" data-code=\"H7225\">beginning</span> of my <span class=\"wl wl-kjv\" data-code=\"H202\">strength,</span> the <span class=\"wl wl-kjv\" data-code=\"H3499\">excellency</span> of <span class=\"wl wl-kjv\" data-code=\"H7613\">dignity,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3499\">excellency</span> of power:","4":"<span class=\"wl wl-kjv\" data-code=\"H6349\">Unstable</span> as <span class=\"wl wl-kjv\" data-code=\"H4325\">water,</span> thou shalt not <span class=\"wl wl-kjv\" data-code=\"H3498\">excel;</span> because thou wentest <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> to thy <span class=\"wl wl-kjv\" data-code=\"H1\">father's</span> <span class=\"wl wl-kjv\" data-code=\"H4904\">bed;</span> then defiledst <span class=\"wl wl-kjv\" data-code=\"H2490\">thou</span> it: he went <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> to my couch.","5":"<span class=\"wl wl-kjv\" data-code=\"H8095\">Simeon</span> and <span class=\"wl wl-kjv\" data-code=\"H3878\">Levi</span> are <span class=\"wl wl-kjv\" data-code=\"H251\">brethren;</span> <span class=\"wl wl-kjv\" data-code=\"H3627\">instruments</span> of <span class=\"wl wl-kjv\" data-code=\"H2555\">cruelty</span> are in their habitations.","6":"O my <span class=\"wl wl-kjv\" data-code=\"H5315\">soul,</span> <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> not thou into their <span class=\"wl wl-kjv\" data-code=\"H5475\">secret;</span> unto their <span class=\"wl wl-kjv\" data-code=\"H6951\">assembly,</span> mine <span class=\"wl wl-kjv\" data-code=\"H3519\">honour,</span> be not thou <span class=\"wl wl-kjv\" data-code=\"H3161\">united:</span> for in their <span class=\"wl wl-kjv\" data-code=\"H639\">anger</span> they <span class=\"wl wl-kjv\" data-code=\"H2026\">slew</span> a <span class=\"wl wl-kjv\" data-code=\"H376\">man,</span> and in their <span class=\"wl wl-kjv\" data-code=\"H7522\">selfwill</span> they digged <span class=\"wl wl-kjv\" data-code=\"H6131\">down</span> a wall.","7":"<span class=\"wl wl-kjv\" data-code=\"H779\">Cursed</span> be their <span class=\"wl wl-kjv\" data-code=\"H639\">anger,</span> for it was <span class=\"wl wl-kjv\" data-code=\"H5794\">fierce;</span> and their <span class=\"wl wl-kjv\" data-code=\"H5678\">wrath,</span> for it was <span class=\"wl wl-kjv\" data-code=\"H7185\">cruel:</span> I will <span class=\"wl wl-kjv\" data-code=\"H2505\">divide</span> them in <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob,</span> and <span class=\"wl wl-kjv\" data-code=\"H6327\">scatter</span> them in Israel.","8":"<span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> thou art he whom thy <span class=\"wl wl-kjv\" data-code=\"H251\">brethren</span> shall <span class=\"wl wl-kjv\" data-code=\"H3034\">praise:</span> thy <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> shall be in the <span class=\"wl wl-kjv\" data-code=\"H6203\">neck</span> of thine <span class=\"wl wl-kjv\" data-code=\"H341\">enemies;</span> thy <span class=\"wl wl-kjv\" data-code=\"H1\">father's</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> shall bow down","9":"<span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> is a <span class=\"wl wl-kjv\" data-code=\"H738\">lion's</span> <span class=\"wl wl-kjv\" data-code=\"H1482\">whelp:</span> from the <span class=\"wl wl-kjv\" data-code=\"H2964\">prey,</span> my <span class=\"wl wl-kjv\" data-code=\"H1121\">son,</span> thou art gone <span class=\"wl wl-kjv\" data-code=\"H5927\">up:</span> he stooped <span class=\"wl wl-kjv\" data-code=\"H3766\">down,</span> he <span class=\"wl wl-kjv\" data-code=\"H7257\">couched</span> as a <span class=\"wl wl-kjv\" data-code=\"H738\">lion,</span> and as an old <span class=\"wl wl-kjv\" data-code=\"H3833\">lion;</span> who shall rouse him up?","10":"The <span class=\"wl wl-kjv\" data-code=\"H7626\">sceptre</span> shall not <span class=\"wl wl-kjv\" data-code=\"H5493\">depart</span> from <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> nor a <span class=\"wl wl-kjv\" data-code=\"H2710\">lawgiver</span> from between his <span class=\"wl wl-kjv\" data-code=\"H7272\">feet,</span> <span class=\"wl wl-kjv\" data-code=\"H3588\">until</span> <span class=\"wl wl-kjv\" data-code=\"H7886\">Shiloh</span> <span class=\"wl wl-kjv\" data-code=\"H935\">come;</span> and unto him shall the <span class=\"wl wl-kjv\" data-code=\"H3349\">gathering</span> of the people","11":"<span class=\"wl wl-kjv\" data-code=\"H631\">Binding</span> his <span class=\"wl wl-kjv\" data-code=\"H5895\">foal</span> unto the <span class=\"wl wl-kjv\" data-code=\"H1612\">vine,</span> and his <span class=\"wl wl-kjv\" data-code=\"H860\">ass's</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">colt</span> unto the choice <span class=\"wl wl-kjv\" data-code=\"H8321\">vine;</span> he <span class=\"wl wl-kjv\" data-code=\"H3526\">washed</span> his <span class=\"wl wl-kjv\" data-code=\"H3830\">garments</span> in <span class=\"wl wl-kjv\" data-code=\"H3196\">wine,</span> and his <span class=\"wl wl-kjv\" data-code=\"H5497\">clothes</span> in the <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> of grapes:","12":"His <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes</span> shall be <span class=\"wl wl-kjv\" data-code=\"H2447\">red</span> with <span class=\"wl wl-kjv\" data-code=\"H3196\">wine,</span> and his <span class=\"wl wl-kjv\" data-code=\"H8127\">teeth</span> <span class=\"wl wl-kjv\" data-code=\"H3836\">white</span> with milk.","13":"<span class=\"wl wl-kjv\" data-code=\"H2074\">Zebulun</span> shall <span class=\"wl wl-kjv\" data-code=\"H7931\">dwell</span> at the <span class=\"wl wl-kjv\" data-code=\"H2348\">haven</span> of the <span class=\"wl wl-kjv\" data-code=\"H3220\">sea;</span> and he shall be for an <span class=\"wl wl-kjv\" data-code=\"H2348\">haven</span> of <span class=\"wl wl-kjv\" data-code=\"H591\">ships;</span> and his <span class=\"wl wl-kjv\" data-code=\"H3411\">border</span> shall be unto Zidon.","14":"<span class=\"wl wl-kjv\" data-code=\"H3485\">Issachar</span> is a <span class=\"wl wl-kjv\" data-code=\"H1634\">strong</span> <span class=\"wl wl-kjv\" data-code=\"H2543\">ass</span> couching <span class=\"wl wl-kjv\" data-code=\"H7257\">down</span> between two burdens:","15":"And he <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> that <span class=\"wl wl-kjv\" data-code=\"H4496\">rest</span> was <span class=\"wl wl-kjv\" data-code=\"H2896\">good,</span> and the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> that it was <span class=\"wl wl-kjv\" data-code=\"H5276\">pleasant;</span> and <span class=\"wl wl-kjv\" data-code=\"H5186\">bowed</span> his <span class=\"wl wl-kjv\" data-code=\"H7926\">shoulder</span> to <span class=\"wl wl-kjv\" data-code=\"H5445\">bear,</span> and became a <span class=\"wl wl-kjv\" data-code=\"H5647\">servant</span> unto tribute.","16":"<span class=\"wl wl-kjv\" data-code=\"H1835\">Dan</span> shall <span class=\"wl wl-kjv\" data-code=\"H1777\">judge</span> his <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> as <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> of the <span class=\"wl wl-kjv\" data-code=\"H7626\">tribes</span> of Israel.","17":"<span class=\"wl wl-kjv\" data-code=\"H1835\">Dan</span> shall be a <span class=\"wl wl-kjv\" data-code=\"H5175\">serpent</span> by the <span class=\"wl wl-kjv\" data-code=\"H1870\">way,</span> an <span class=\"wl wl-kjv\" data-code=\"H8207\">adder</span> in the <span class=\"wl wl-kjv\" data-code=\"H734\">path,</span> that <span class=\"wl wl-kjv\" data-code=\"H5391\">biteth</span> the <span class=\"wl wl-kjv\" data-code=\"H5483\">horse</span> <span class=\"wl wl-kjv\" data-code=\"H6119\">heels,</span> so that his <span class=\"wl wl-kjv\" data-code=\"H7392\">rider</span> shall <span class=\"wl wl-kjv\" data-code=\"H5307\">fall</span> backward.","18":"I have waited <span class=\"wl wl-kjv\" data-code=\"H6960\">for</span> thy <span class=\"wl wl-kjv\" data-code=\"H3444\">salvation,</span> O LORD.","19":"<span class=\"wl wl-kjv\" data-code=\"H1410\">Gad,</span> a <span class=\"wl wl-kjv\" data-code=\"H1416\">troop</span> shall <span class=\"wl wl-kjv\" data-code=\"H1464\">overcome</span> him: but he shall <span class=\"wl wl-kjv\" data-code=\"H1464\">overcome</span> at the last.","20":"Out of <span class=\"wl wl-kjv\" data-code=\"H836\">Asher</span> his <span class=\"wl wl-kjv\" data-code=\"H3899\">bread</span> shall be <span class=\"wl wl-kjv\" data-code=\"H8082\">fat,</span> and he shall <span class=\"wl wl-kjv\" data-code=\"H5414\">yield</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">royal</span> dainties.","21":"<span class=\"wl wl-kjv\" data-code=\"H5321\">Naphtali</span> is a <span class=\"wl wl-kjv\" data-code=\"H355\">hind</span> let <span class=\"wl wl-kjv\" data-code=\"H7971\">loose:</span> he <span class=\"wl wl-kjv\" data-code=\"H5414\">giveth</span> <span class=\"wl wl-kjv\" data-code=\"H8233\">goodly</span> words.","22":"<span class=\"wl wl-kjv\" data-code=\"H3130\">Joseph</span> is a <span class=\"wl wl-kjv\" data-code=\"H6509\">fruitful</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">bough,</span> even a <span class=\"wl wl-kjv\" data-code=\"H6509\">fruitful</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">bough</span> by a <span class=\"wl wl-kjv\" data-code=\"H5869\">well;</span> whose <span class=\"wl wl-kjv\" data-code=\"H1323\">branches</span> <span class=\"wl wl-kjv\" data-code=\"H6805\">run</span> over the wall:","23":"The <span class=\"wl wl-kjv\" data-code=\"H1167\">archers</span> have sorely grieved <span class=\"wl wl-kjv\" data-code=\"H4843\">him,</span> and <span class=\"wl wl-kjv\" data-code=\"H7232\">shot</span> at him, and hated him:","24":"But his <span class=\"wl wl-kjv\" data-code=\"H7198\">bow</span> <span class=\"wl wl-kjv\" data-code=\"H3427\">abode</span> in <span class=\"wl wl-kjv\" data-code=\"H386\">strength,</span> and the <span class=\"wl wl-kjv\" data-code=\"H2220\">arms</span> of his <span class=\"wl wl-kjv\" data-code=\"H3027\">hands</span> were made <span class=\"wl wl-kjv\" data-code=\"H6339\">strong</span> by the <span class=\"wl wl-kjv\" data-code=\"H3027\">hands</span> of the <span class=\"wl wl-kjv\" data-code=\"H46\">mighty</span> God of <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob;</span> (from thence is the <span class=\"wl wl-kjv\" data-code=\"H7462\">shepherd,</span> the <span class=\"wl wl-kjv\" data-code=\"H68\">stone</span> of Israel:)","25":"Even by the <span class=\"wl wl-kjv\" data-code=\"H410\">God</span> of thy <span class=\"wl wl-kjv\" data-code=\"H1\">father,</span> who shall <span class=\"wl wl-kjv\" data-code=\"H5826\">help</span> thee; and <span class=\"wl wl-kjv\" data-code=\"H854\">by</span> the <span class=\"wl wl-kjv\" data-code=\"H7706\">Almighty,</span> who shall <span class=\"wl wl-kjv\" data-code=\"H1288\">bless</span> thee with <span class=\"wl wl-kjv\" data-code=\"H1293\">blessings</span> of <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven</span> <span class=\"wl wl-kjv\" data-code=\"H5920\">above,</span> <span class=\"wl wl-kjv\" data-code=\"H1293\">blessings</span> of the <span class=\"wl wl-kjv\" data-code=\"H8415\">deep</span> that <span class=\"wl wl-kjv\" data-code=\"H7257\">lieth</span> under, <span class=\"wl wl-kjv\" data-code=\"H1293\">blessings</span> of the <span class=\"wl wl-kjv\" data-code=\"H7699\">breasts,</span> and of the womb:","26":"The <span class=\"wl wl-kjv\" data-code=\"H1293\">blessings</span> of thy <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> have <span class=\"wl wl-kjv\" data-code=\"H1396\">prevailed</span> above the <span class=\"wl wl-kjv\" data-code=\"H1293\">blessings</span> of my <span class=\"wl wl-kjv\" data-code=\"H2029\">progenitors</span> unto the utmost <span class=\"wl wl-kjv\" data-code=\"H8379\">bound</span> of the <span class=\"wl wl-kjv\" data-code=\"H5769\">everlasting</span> <span class=\"wl wl-kjv\" data-code=\"H1389\">hills:</span> they shall be on the <span class=\"wl wl-kjv\" data-code=\"H7218\">head</span> of <span class=\"wl wl-kjv\" data-code=\"H3130\">Joseph,</span> and on the crown of the <span class=\"wl wl-kjv\" data-code=\"H6936\">head</span> of him that was <span class=\"wl wl-kjv\" data-code=\"H5139\">separate</span> from his brethren.","27":"<span class=\"wl wl-kjv\" data-code=\"H1144\">Benjamin</span> shall <span class=\"wl wl-kjv\" data-code=\"H2963\">ravin</span> as a <span class=\"wl wl-kjv\" data-code=\"H2061\">wolf:</span> in the <span class=\"wl wl-kjv\" data-code=\"H1242\">morning</span> he shall <span class=\"wl wl-kjv\" data-code=\"H398\">devour</span> the <span class=\"wl wl-kjv\" data-code=\"H5706\">prey,</span> and at <span class=\"wl wl-kjv\" data-code=\"H6153\">night</span> he shall <span class=\"wl wl-kjv\" data-code=\"H2505\">divide</span> the spoil.","28":"All these are the <span class=\"wl wl-kjv\" data-code=\"H6240\">twelve</span> <span class=\"wl wl-kjv\" data-code=\"H7626\">tribes</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel:</span> and this is it that their <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> unto them, and <span class=\"wl wl-kjv\" data-code=\"H1288\">blessed</span> them; <span class=\"wl wl-kjv\" data-code=\"H834\">every</span> <span class=\"wl wl-kjv\" data-code=\"H376\">one</span> according to his <span class=\"wl wl-kjv\" data-code=\"H1293\">blessing</span> he blessed","29":"And he <span class=\"wl wl-kjv\" data-code=\"H6680\">charged</span> them, and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto them, I am to be <span class=\"wl wl-kjv\" data-code=\"H622\">gathered</span> unto my <span class=\"wl wl-kjv\" data-code=\"H5971\">people:</span> <span class=\"wl wl-kjv\" data-code=\"H6912\">bury</span> me with my <span class=\"wl wl-kjv\" data-code=\"H1\">fathers</span> in the <span class=\"wl wl-kjv\" data-code=\"H4631\">cave</span> that is in the <span class=\"wl wl-kjv\" data-code=\"H7704\">field</span> of <span class=\"wl wl-kjv\" data-code=\"H6085\">Ephron</span> the Hittite,","30":"In the <span class=\"wl wl-kjv\" data-code=\"H4631\">cave</span> that is in the <span class=\"wl wl-kjv\" data-code=\"H7704\">field</span> of <span class=\"wl wl-kjv\" data-code=\"H4375\">Machpelah,</span> which is <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> <span class=\"wl wl-kjv\" data-code=\"H4471\">Mamre,</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H3667\">Canaan,</span> which <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham</span> <span class=\"wl wl-kjv\" data-code=\"H7069\">bought</span> with the <span class=\"wl wl-kjv\" data-code=\"H7704\">field</span> of <span class=\"wl wl-kjv\" data-code=\"H6085\">Ephron</span> the <span class=\"wl wl-kjv\" data-code=\"H2850\">Hittite</span> for a <span class=\"wl wl-kjv\" data-code=\"H272\">possession</span> of a buryingplace.","31":"There they <span class=\"wl wl-kjv\" data-code=\"H6912\">buried</span> <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham</span> and <span class=\"wl wl-kjv\" data-code=\"H8283\">Sarah</span> his <span class=\"wl wl-kjv\" data-code=\"H802\">wife;</span> there they <span class=\"wl wl-kjv\" data-code=\"H6912\">buried</span> <span class=\"wl wl-kjv\" data-code=\"H3327\">Isaac</span> and <span class=\"wl wl-kjv\" data-code=\"H7259\">Rebekah</span> his <span class=\"wl wl-kjv\" data-code=\"H802\">wife;</span> and there I <span class=\"wl wl-kjv\" data-code=\"H6912\">buried</span> Leah.","32":"The <span class=\"wl wl-kjv\" data-code=\"H4735\">purchase</span> of the <span class=\"wl wl-kjv\" data-code=\"H7704\">field</span> and of the <span class=\"wl wl-kjv\" data-code=\"H4631\">cave</span> that is therein was from the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of Heth.","33":"And when <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> had made an <span class=\"wl wl-kjv\" data-code=\"H3615\">end</span> of <span class=\"wl wl-kjv\" data-code=\"H6680\">commanding</span> his <span class=\"wl wl-kjv\" data-code=\"H1121\">sons,</span> he gathered <span class=\"wl wl-kjv\" data-code=\"H622\">up</span> his <span class=\"wl wl-kjv\" data-code=\"H7272\">feet</span> into the <span class=\"wl wl-kjv\" data-code=\"H4296\">bed,</span> and yielded up the <span class=\"wl wl-kjv\" data-code=\"H1478\">ghost,</span> and was <span class=\"wl wl-kjv\" data-code=\"H622\">gathered</span> unto his people."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"in de","tekst":"Hebr. in het achterste, laatste, of na vervolg der dagen; dat is, in de toekomende tijden; te weten, omtrent 200 jaren na dezen tijd beginnende, en voorts tot de komst en het koninkrijk van den Messias toe."}],"3":[{"catchword":"mijn kracht","tekst":"Dat is, een kind in de principale sterkte mijns levens gewonnen."},{"catchword":"het begin","tekst":"Te weten, in het kinderwinnen; aldus worden de eerstgeborenen genoemd; Deu 21:17; Psa 78:51."},{"catchword":"de voortreffelijkste in hoogheid,","tekst":"Hebr. de voortreffelijkheid."}],"4":[{"catchword":"Snelle afloop","tekst":"Hebr. snelligheid."},{"catchword":"als der wateren,","tekst":"Te weten, toen gij uws vaders bed geschonden hebt; gelijk het water van een hoge plaats in een lage zeer snellijk loopt, zo hebt gij door uw onkuische begeerte, verenigd met grote stoutheid en lichtvaardigheid, uzelven in een schandelijke misdaad en oneer gestort."},{"catchword":"gij hebt uws","tekst":"Dat is, gij hebt uws vaders bed door bloedschande ontreinigd."},{"catchword":"hij heeft mijn","tekst":"Dit heeft Jakob gesproken, zich wendende tot zijn andere zonen."}],"5":[{"catchword":"gebroeders","tekst":"Te weten, niet alleen van natuur, maar ook van zinnen, manieren en werken in het kwaad; hetgeen zij bewezen hebben met hun handel tegen de Sichemieten; boven, Gen. 34."},{"catchword":"handelingen","tekst":"Volgens sommigen, zwaarden."}],"6":[{"catchword":"eer worde","tekst":"Eer is hier zoveel als tevoren ziel, die het waardigste deel des mensen is. Aldus kan het woord eer ook genomen worden Psa 16:9, en Psa 30:13, en Psa 57:9. Anders, tong; waarmede men schuldig is God te eren en zijn lof te verbreiden. Men kan ook door het woord eer verstaan zijn goeden naam."},{"catchword":"de mannen","tekst":"Hebr. den man; versta, de Sichemieten. Zie boven, Gen 34:25-26."},{"catchword":"ossen weggerukt","tekst":"Hebr. den os; versta hieronder ook andere beesten, die zij bij het plunderen van de stad Sichem den inwoners ontweldigd hebben. Dikwijls gebruiken de Hebreën het getal van één voor velen, boven; Gen 32:5, en 1Ch 10:1; verg. met 1Sa 31:1."}],"7":[{"catchword":"Vervloekt zij","tekst":"Vervloekt te zijn, is lichamelijke en geestelijke, tijdelijke en eeuwige straf, of enige van deze onderworpen te zijn, gelijk boven Gen 3:14, en Gen 4:11, en Gen 5:29; Deu 28:16-17; Mat 25:41. Versta hier tijdelijke straf."},{"catchword":"Ik zal hen","tekst":"Jakob spreekt in den naam Gods, als een profeet, en zijn profetie is vervuld in de nakomelingen, want de stam van Simeon is in het land Kanaän vermengd geweest onder den stam van Juda, Jos 19:1, en de stam van Levi verspreid onder al de stammen."}],"8":[{"catchword":"uw hand zal zijn","tekst":"Dat is, gij zult hen in de vlucht slaan en dempen; verg. Psa 18:41."},{"catchword":"u zullen zich","tekst":"Hiermede geeft hij te kennen dat zijn nakomelingen tot de heerschappij, het andere deel van het recht der eerstgeboorte zouden verheven worden."}],"9":[{"catchword":"Juda is een","tekst":"Dit alles wordt hier gesproken bij gelijkenis, om uit te drukken de tijdelijke heerschappij en macht der nakomelingen van Juda; Jdg 1:2; 1Sa 17:51; 2Sa 8:12-13, en 1Ki 9:20, enz; en de eeuwige van den Messias, die uit Juda zou spruiten, Mat 28:18; Luk 1:32, Luk 1:43; Eph 1:20-21."},{"catchword":"wie zal hem","tekst":"Alsof hij zeide: zijn vijanden zullen hem zozeer vrezen, dat zij hem niet lichtelijk of zonder hun schade tergen zullen."}],"10":[{"catchword":"scepter zal","tekst":"Dat is, de macht om te regeren; Isa 14:5; Eze 19:11, Eze 19:14; Zec 10:11, omdat de regeerders staven of scepters in hun handen droegen, tot een teken van heerschappij, Est 8:4. Anders, de stam; dat is, de stam van Juda zal niet vermengd worden met anderen, noch gevoerd uit zijn plaats vooraleer, enz."},{"catchword":"de wetgever","tekst":"Versta, dengene, die de macht heeft om de wetten der regering te stellen en voor te schrijven; zie Pro 8:15."},{"catchword":"van tussen zijn","tekst":"Dat is, die uit den stam Juda afkomstig zal wezen. Anders, die als een discipel aan de voeten des meesters in de wetten zal onderwezen worden; alzo Deu 33:3."},{"catchword":"Silo","tekst":"Hierbij wordt buiten allen twijfel verstaan de Messias, en wordt door sommigen overgezet zijn zoon, of, vrucht; te weten, de zoon van Juda; want het Hebreeuwse woord betekent het velletje, waarin de kinderen geboren worden; en alzo het kind zelf, wat er in ligt, en uit het geslacht van Juda [waarvan de maagd Maria des Heeren Christus' moeder was, Luk 1:32 ] voortkomen zou. Anders, de Heiland, Zaligmaker, Gelukgever, enz."},{"catchword":"komt, en","tekst":"Anders, gekomen zal zijn. Beiden is waarachtig, ten aanzien van tweeërlei vorm van regering; de ene macht hebbende over criminele zaken, de ander alleen over burgerlijke geschillen en differenten der religie, want sommigen jaren, eer Christus kwam, is den Joden door Pompejus afgenomen den eersten vorm der regering, maar de andere is hun nog over geweest, toen Christus in het vlees verschenen was, Joh 18:31."},{"catchword":"zullen de volken","tekst":"Hebr. en tot, of, aan hem zal de gehoorzaamheid der volken zijn; dat is, de ware gelovigen uit alle volken zullen hem gehoorzaamheid bewijzen, hem erkennende voor hun Heere en Zaligmaker, enz. Anders, en tot hem zal zijn de vergadering der volken."}],"11":[{"catchword":"bindt zijn","tekst":"Met deze manier van spreken wordt te kennen gegeven de overvloed en de edelheid van den wijn, die in het erfdeel van Juda zou wezen."},{"catchword":"mantel in","tekst":"Anders, zijn opperkleed."},{"catchword":"wijndruivenbloed","tekst":"Dat is, sap der druiven, of wijn. Alzo Deu 32:14."}],"12":[{"catchword":"Hij is","tekst":"Met deze manier van spreken geeft hij te kennen den overvloed en de kracht van den wijn en van de melk, welke in het land van Juda zou wezen. Anders, roder van ogen dan wijn, en witter van tanden dan melk."}],"13":[{"catchword":"Zebulon zal","tekst":"Dat is, hij zal zijn woning aan den zeekant hebben. Zie de vervulling hier van Jos 19:10-11, enz."},{"catchword":"zeeën wonen,","tekst":"Anders, meren."},{"catchword":"Zidon","tekst":"Zie van deze stad boven, Gen 10:19."}],"14":[{"catchword":"Issaschar is","tekst":"Bij gelijkenis van een sterken doch luien en gemakkelijken ezel, voorzegt hij dat de nakomelingen van Issaschar wel sterk zouden zijn en groot van vermogen, door de goedheid van hun land, maar zo tot gemak en vrede genegen, dat zij niets bijzonders zouden uitrichten, ja zich door anderen overlasten; zie Jdg 5:13, en verg. Deu 33:18."},{"catchword":"een sterkgebeende","tekst":"Hebr. een ezel des beens; dat is, een ezel, die groot en sterk van gebeente is."}],"16":[{"catchword":"richten, als","tekst":"Dat is, regeren, met wetten te geven en uit te voeren, alzo 1Sa 2:10; Psa 96:13; Zec 3:7. Ditzelfde verstaat Jakob ook van de andere stammen, afkomstig uit de andere dienstmaagden, dat zij, zowel als de andere, de volle heerschappij in hun erfdeel hebben zouden."}],"17":[{"catchword":"Dan zal een","tekst":"De zin en de mening der profetie is deze: Dan zal, naar der slangen aard, listiglijk zijn vijanden bespringen, gelijk ook af te nemen is uit Deu 33:22. Zie exempelen der vervulling, Richt. 14; Richt. 15; Richt. 16; Richt. 18."},{"catchword":"adderslang","tekst":"Anders, pijlslang, die, in de bomen zich verbergende, door derzelver takken met grote sterkte en snelheid zich uitschiet, doende van gelijken op de aarde langs den weg. Het Hebreeuwse woord wordt hier alleen gevonden."}],"18":[{"catchword":"Op uw","tekst":"Jakob wendt zich tot God, om hem den welstand zijner nakomelingen aan te bevelen, door Gods Geest voorziende de zwarigheden, die hun in het algemeen zouden overkomen, en in het bijzonder den stam van Dan, zowel ten aanzien van zijn erfdeel, Jos 19:47; Jdg 1:34, als van de zuivere religie of godsdienst, die zij zeer haast door afgoderij verloren hebben; Jdg 18:17."},{"catchword":"zaligheid wacht ik,","tekst":"Het Hebreeuwse woord betekent, òf tijdelijke verlossing en behoud, Jdg 15:18, en 2Sa 10:11; of eeuwige, Isa 45:17; Luk 19:9, of beiden tezamen, gelijk Psa 37:39, en hier. Anders, tot [of, om ] uw heil, [of, behoudenis ], wacht ik den Heere."}],"19":[{"catchword":"een bende","tekst":"Jakob wil zeggen dan Gad wel in het eerst door zijn vijanden zou onderdrukt worden, maar dat hij hen daarna zelf zou overwinnen. Zie Deu 33:20-21."},{"catchword":"aanvallen; maar","tekst":"Het Hebreeuwse woord betekent, met rovende en stropende benden of rotten een uitval doen."}],"20":[{"catchword":"Van Aser,","tekst":"De zin is dat de nakomelingen van Aser van het land, hetwelk hun ten erfdeel vallen zou, zeer goede tarwe, olie en ander voedsel in overvloed genieten zouden."},{"catchword":"hij zal","tekst":"Dat is, het land van Aser zal zeer vruchtbaar zijn, niet alleen van het nodige voedsel, maar ook van kostelijke, vermakelijke en lekkere vruchten, die men met ere een koning zou mogen voorzetten. Zie Deu 33:24, en Jos 19:24-25, enz."}],"21":[{"catchword":"losgelaten hinde;","tekst":"Dat is, wakker in oorlogsdaden; Jdg 4:6, Jdg 4:10, en Jdg 5:18, en aangenaam in de burgerlijke conversatie."}],"22":[{"catchword":"een vruchtbare","tekst":"Hebr. Zoon des vruchtbaren [wijstoks]; alzo dochters in het volgende. Jozef wordt vergeleken bij een vruchtbaren stam, die takken geeft, en die zich zeer vermenigvuldigen en wijd uitbreiden zouden."}],"23":[{"catchword":"De schutters","tekst":"Hebr. de heren, of, meesters der pijlen; dat is, de schutters, die de pijlen in het schieten gebruiken. Zie boven, Gen 14:13. Versta door dezen, al degenen, die Jozef enig lijden hebben aangedaan, zoals zijn broeders, met hem te verkopen; zijn meesteres, met hem te beschuldigen; haar man, met hem in de gevangenis te werpen, enz., welke allen naar hem, evenals de schutters naar een doel, geschoten hebben, om hem te verderven."},{"catchword":"bitterheid","tekst":"Hebr. verbitterd."},{"catchword":"beschoten,","tekst":"Zie van het Hebreeuwse woord Job 16:13; Jer 50:29; ook Psa 18:15."}],"24":[{"catchword":"zijn boog","tekst":"Dat is, zijn sterkte en welvaart is in haar geheel gebleven, zodat hij niet kon vernield worden door zijn vijanden. Eenigen verstaan door den boog, het geloof van Jozef; door zijn armen, zijn deugden."},{"catchword":"handen van den","tekst":"De handen Gods; betekenen zijn almachtige sterkte; Exo 13:3; Psa 10:12; Eze 39:21, enz."},{"catchword":"Machtige","tekst":"Dat is, van God, die Jakob en zijn huisgezin door zijn macht beschermd heeft."},{"catchword":"daarvan is hij","tekst":"Dat is, van God, die alleen de fontein is en de gever alles goeds."},{"catchword":"herder, een","tekst":"Versta, Jozef, wien God gesteld had tot een herder, om voedsel te beschikken den Egyptenaars en anderen volken, doch in het bijzonder Jakobs huis, om welke oorzaak hij ook een steen, of, rots van toevlucht genoemd wordt."}],"25":[{"catchword":"zegenen met zegeningen des","tekst":"Hij spreekt van Jozefs nakomelingen, wien hij v (function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
function kopieerVers(n) {
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n})`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
}
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  kopieerVers(k.dataset.n);
});
// rechtermuisklik op een vers kopieert het (in plaats van het browser-contextmenu)
document.addEventListener('contextmenu', e => {
  const rij = e.target.closest('.vers');
  if (!rij || !rij.id.startsWith('v')) return;
  const n = rij.id.slice(1);
  if (!D.vertalingen.SVnu[n]) return;
  e.preventDefault();
  kopieerVers(n);
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  // dubbele rechtsklik (binnen 500ms, zelfde verwijzing) kopieert het vers
  // i.p.v. de vertalingen-popup te tonen (enkele rechtsklik blijft bestaand gedrag)
  function kopieerVerwijzing(chip, ref) {
    haalVert('versteksten', ref).then(data => {
      const tekst = data && data[ref.vers];
      if (!tekst) return;
      const url = location.origin + '/studiebijbel/' + ref.slug + '/' + ref.hfd + '#v' + ref.vers;
      const kopie = tekst.replace(/\*/g, '') + `\n~ [${chip.textContent}](${url})`;
      navigator.clipboard.writeText(kopie).then(() => {
        toast.classList.add('zichtbaar');
        setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
      });
    });
  }
  let laatsteRechtsklik = { sleutel: null, tijd: 0 };
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    const sleutel = chip.dataset.ref;
    const nu = Date.now();
    const isDubbelklik = laatsteRechtsklik.sleutel === sleutel && (nu - laatsteRechtsklik.tijd) < 500;
    laatsteRechtsklik = isDubbelklik ? { sleutel: null, tijd: 0 } : { sleutel, tijd: nu };
    if (isDubbelklik) {
      popup.style.display = 'none';
      vpopup.style.display = 'none';
      kopieerVerwijzing(chip, ref);
      return;
    }
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
