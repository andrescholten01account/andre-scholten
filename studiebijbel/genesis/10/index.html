  .hfdnav .midden { display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:.4rem; color:#777; }
  @media (max-width:640px) { .hfdnav .midden { order:1; width:100%; justify-content:center; } .hfdnav .navknop { order:2; } }
  .hfdnav select { font-family:"Lora"; font-size:.85rem; border:1px solid var(--border); border-radius:999px; padding:.3rem 1.6rem .3rem .8rem; background:#fff; color:var(--accent-donker); cursor:pointer; }

  .navselect { font-family:"Lora"; font-size:.85rem; border:1px solid var(--border); border-radius:999px; padding:.3rem 1.6rem .3rem .8rem; background:#fff; color:var(--accent-donker); cursor:pointer; display:inline-flex; align-items:center; text-decoration:none; }
  /* mobiel (smal): natuurlijke DOM-volgorde boek→hoofdstuk→vertaling→lampje,

  @media (min-width: 641px) {
    #vertaalkies { order: -1; }
  }

  /* verzen — tabsmodus (één kolom) */
  .vers { position: relative; display: flex; gap: .8rem; padding: .45rem 2.4rem .45rem .4rem; border-radius: 8px; cursor: pointer; }
  .vers:hover { background: var(--bg-soft); }
  .vers.open { background: var(--bg-soft); box-shadow: inset 3px 0 0 var(--accent); border-radius: 8px 8px 0 0; }
  .vers.flits { animation: flits 1.6s ease-out; }
  @keyframes flits { 0% { background: #e0e0e0; } 100% { background: var(--bg-soft); } }
  .vnr { color: #999999; font-size: .75rem; min-width: 1.6rem; text-align: right; padding-top: .45rem; font-family: "Lora"; }
  .vtekst em, .pcel em { font-style: italic; color: #555; }
  .wl { border-bottom: 1px dotted var(--accent); }
  .noot { color: var(--accent); cursor: pointer; font-weight: 700; padding: 0 .05rem; }
  .noot:hover { color: var(--accent-donker); }
  #notenlijst { margin: 1.5rem 0 0 2.4rem; font-family: "Lora"; font-size: .82rem; color: #666; border-top: 1px solid var(--border); padding-top: .8rem; }
  #notenlijst:empty { display: none; }
  #notenlijst h3 { font-size: .78rem; text-transform: uppercase; letter-spacing: .12em; color: var(--accent-donker); margin: 0 0 .5rem; }
  #notenlijst .nootregel { margin: .25rem 0; }
  #notenlijst .nootregel .nn { color: var(--accent); font-weight: 700; margin-right: .35rem; }
  .kopieer { position: absolute; right: .4rem; top: .55rem; opacity: 0; border: none; background: none; cursor: pointer; color: var(--accent); font-size: .95rem; padding: .1rem .3rem; transition: opacity .15s; }
  .vers:hover .kopieer { opacity: .75; }
  .kopieer:hover { opacity: 1 !important; }

  /* parallelmodus (kolommen naast elkaar) */
  #bijbel.parallel .vers { display:grid; gap:.8rem; cursor:pointer; align-items:start; }
  #bijbel.parallel .vnr { grid-row: 1; }
  .kolomkop { display:none; }
  #bijbel.parallel + .kolomkop, .kolomkop.tonen { }
  .pk { font-family:"Lora"; font-size:.72rem; text-transform:uppercase; letter-spacing:.12em; color:var(--accent-donker); font-weight:700; }
  #bijbel.parallel .pcel em { font-style:italic; color:#555; }

  /* naslagpaneel */
  .paneel { display: none; margin: 0 0 .6rem 0; background: #fff; box-shadow: inset 3px 0 0 var(--accent); border-radius: 0 0 8px 8px; padding: .9rem 1.1rem 1rem; font-family: "Lora"; font-size: 1rem; }
  .paneel.open { display: block; }
  .ntabs { display: flex; gap: .4rem; margin-bottom: .8rem; flex-wrap: wrap; }
  
  .ntab { border: 1px solid var(--border); background: var(--bg-soft); border-radius: 6px 6px 0 0; padding: .28rem .95rem; cursor: pointer; font-size: .8rem; color: #666; }
  .ntab.actief { background: var(--accent); color: #fff; border-color: var(--accent); }
  .ntab.leeg { opacity: .4; cursor: default; }
  .tsk-kop { font-weight: 700; color: var(--accent-donker); margin: .55rem 0 .3rem; font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; }
  .verg-kop { font-family:"Lora"; font-weight: 700; color: var(--accent-donker); font-size: 1.05rem; margin: 0 0 .6rem; padding-bottom: .35rem; border-bottom: 2px solid var(--accent); }
  .bu-lijst { list-style: disc; margin: .2rem 0 0 1.2rem; padding: 0; }

  .uitleg-bron { border-bottom: 1px solid var(--bg-soft); padding: .3rem 0; }
  .uitleg-bron:last-of-type { border-bottom: none; }
  .opener { display: block; cursor: pointer; font-weight: 600; color: var(--accent-donker); padding: .2rem 0; }
  .opener:hover { color: var(--accent); }
  .opener::before { content: '▸ '; font-size: .75em; }
  .opener.open::before { content: '▾ '; }
  .smoothOpen { max-height: 0; overflow: hidden; transition: max-height .25s ease; }

  .uitleg-item { margin: .5rem 0; font-family: Lora, serif; }

  .kt-nr { font-style: normal; font-weight: 700; color: var(--accent-donker); }
  .tsk-sub { font-weight: 600; color: #444; margin: .5rem 0 .2rem; }

  .refchip:hover { color: var(--dark); border-bottom-color: var(--dark); }
  .onderwerp { padding:.45rem 0; border-bottom:1px solid var(--bg-soft); }

  .onderwerp .naam { font-weight: 700; color: var(--accent-donker); }

  .ond-topic { margin: .7rem 0; }
  .ond-subs { margin: .25rem 0 0 1.2rem; padding-left: 1rem; list-style: disc; color: #333333; }

  .ond-subs li { margin: .4rem 0; }
  .ond-label { color: #333333; }
  .ond-refs { margin: .3rem 0 0; }

  .site-footer { font-family:"Lora"; text-align:center; max-width:700px; margin:1rem auto 0; padding:1rem 1.5rem 1.5rem; border-top:1px solid var(--lightgray); font-size:.85em; }
  
  
  
  .site-footer a { color:var(--secondary); text-decoration:underline; }
  
  
  footer.site { margin-top: 2.5rem; margin-bottom: -3rem; border-top: 1px solid var(--border); padding-top: 1rem; text-align: center; font-family: "Lora"; font-size: .72rem; color: #999; line-height: 1.7; }
  @media (max-width: 640px) { .omslag { padding: .6rem .7rem 2rem; } header.site h1 { font-size: 1.5rem; } }
.zoekbalk { max-width:640px; margin:0 auto 1rem; }.zoekinvoer { width:100%; box-sizing:border-box; font-family:"Lora"; font-size:.9rem; border:1px solid var(--border); border-radius:8px; padding:.6rem .8rem; resize:vertical; color:var(--tekst); background:#fff; }.zoekinvoer::placeholder { color:#aaa; }.zoekknoprij { display:flex; justify-content:center; margin-top:.5rem; }.zoekknop { font-family:"Lora"; font-size:.85rem; border:1px solid var(--accent); background:#fff; color:var(--accent-donker); border-radius:999px; padding:.4rem 1.1rem; cursor:pointer; }.zoekknop:hover { background:var(--accent); color:#fff; }.zoekresultaten { margin-top:.8rem; display:flex; flex-wrap:wrap; gap:.4rem; justify-content:center; }.zoekresultaten a { font-family:"Lora"; font-size:.8rem; border:1px solid var(--border); border-radius:999px; padding:.25rem .7rem; text-decoration:none; color:var(--accent-donker); background:#fff; }.zoekresultaten a:hover { background:var(--bg-soft); }.zoekresultaten .zoek-leeg { color:#999; font-size:.85rem; font-family:"Lora"; }</style>

de zonen van Noach: Sem, Cham en Jafeth; en hun werden zonen geboren na de vloed.","2":"De zonen van Jafeth zijn: Gomer, en Magog, en Madai, en Javan, en Tubal, en Mesech, en Thiras.","3":"En de zonen van Gomer zijn: Askenaz, en Rifath, en Togarma.","4":"En de zonen van Javan zijn: Elisa, en Tarsis; de Chittieten en Dodanieten.","5":"Van hen zijn de eilanden van de volken verdeeld in hun landschappen, ieder naar zijn taal, naar hun huisgezinnen, onder hun volken.","6":"En de zonen van Cham zijn: Cusch en Mitsraïm, en Put, en Kanaän.","7":"En de zonen van Cusch zijn: Seba en Havila, en Sabta, en Raema, en Sabtecha. En de zonen van Raema zijn: Scheba en Dedan.","8":"En Cusch verwekte Nimrod; deze begon geweldig te zijn op de aarde.","9":"Hij was een geweldig jager voor het aangezicht van de HEERE; daarom wordt gezegd: Net als Nimrod, een geweldig jager voor het aangezicht van de HEERE.","10":"En het begin van zijn rijk was Babel, en Erech, en Accad, en Calne, in het land Sinear.","11":"Uit dit land is Assur uitgegaan, en heeft Nineve gebouwd, en Rehoboth, Ir, en Kalach.","12":"En Resen, tussen Nineve en Kalach; dit is die grote stad.","13":"En Mitsraïm verwekte de Ludieten, en de Anamieten, en de Lehabieten, en de Naftuchieten,","14":"En de Pathrusieten, en de Casluchieten, van waar de Filistijnen uitgekomen zijn, en de Caftorieten.","15":"En Kanaän verwekte Sidon, zijn eerstgeborene, en Heth,","16":"En de Jebusiet, en de Amoriet, en de Girgasiet,","17":"En de Hivviet, en de Arkiet, en de Siniet,","18":"En de Arvadiet, en de Tsemariet, en de Hamathiet; en daarna zijn de huisgezinnen van de Kanaänieten verspreid.","19":"En het gebied van de Kanaänieten was van Sidon, in de richting van Gerar tot aan Gaza toe; in de richting van Sodom en Gomorra, en Adama, en Zoboim, tot aan Lasa toe.","20":"Dit zijn de zonen van Cham, naar hun huisgezinnen, naar hun talen, in hun landschappen, in hun volken.","21":"Verder zijn er aan Sem zonen geboren; hijzelf is ook de vader van alle zonen van Heber, broer van Jafeth, de oudste.","22":"Sems zonen waren Elam, en Assur, en Arfachsad, en Lud, en Aram.","23":"En Arams zonen waren Uz, en Hul, en Gether, en Maz.","24":"En Arfachsad verwekte Selah, en Selah verwekte Heber.","25":"En aan Heber werden twee zonen geboren; de naam van de één was Peleg, want in zijn dagen is de aarde verdeeld; en de naam van zijn broer was Joktan.","26":"En Joktan verwekte Almodad, en Selef, en Hatsarmaveth, en Jarach,","27":"En Hadoram, en Usal, en Dikla,","28":"En Obal, en Abimaël, en Scheba,","29":"En Ofir, en Havila, en Jobab; deze allen waren zonen van Joktan.","30":"En hun woongebied strekte zich uit van Mescha af, in de richting van Sefar, het gebergte van het oosten.","31":"Dit zijn de zonen van Sem, naar hun huisgezinnen, naar hun talen, in hun landschappen, naar hun volken.","32":"Dit zijn de huisgezinnen van de zonen van Noach, naar hun geboorten, in hun volken; en van hen zijn de volken op de aarde verdeeld na de vloed."},"SV":{"1":"Dit nu *zijn* de geboorten van Noachs zonen: Sem, Cham, en Jafeth; en hun werden zonen geboren na den vloed.","2":"De zonen van Jafeth *zijn*: Gomer, en Magog, en Madai, en Javan, en Tubal, en Mesech, en Thiras.","3":"En de zonen van Gomer *zijn*: Askenaz, en Rifath, en Togarma.","4":"En de zonen van Javan *zijn*: Elisa, en Tarsis; de Chittieten en Dodanieten.","5":"Van dezen zijn verdeeld de eilanden der volken in hun landschappen, elk naar zijn spraak, naar hun huisgezinnen, onder hun volken.","6":"En de zonen van Cham *zijn*: Cusch en Mitsraim, en Put, en Kanaän.","7":"En de zonen van Cusch *zijn*: Seba en Havila, en Sabta, en Raema, en Sabtecha. En de zonen van Raema zijn: Scheba en Dedan.","8":"En Cusch gewon Nimrod; deze begon geweldig te zijn op de aarde.","9":"Hij was een geweldig jager voor het aangezicht des HEEREN; daarom wordt gezegd: Gelijk Nimrod, een geweldig jager voor het aangezicht des HEEREN.","10":"En het beginsel zijns rijks was Babel, en Erech, en Accad, en Calne in het land Sinear.","11":"Uit ditzelve land is Assur uitgegaan, en heeft gebouwd Nineve, en Rehoboth, Ir, en Kalach.","12":"En Resen, tussen Nineve en tussen Kalach; deze is die grote stad.","13":"En Mitsraim gewon de Ludieten, en de Anamieten, en de Lehabieten, en de Naftuchieten,","14":"En de Pathrusieten, en de Casluchieten, van waar de Filistijnen uitgekomen zijn, en de Caftorieten.","15":"En Kanaän gewon Sidon, zijn eerstgeborene, en Heth,","16":"En den Jebusiet, en den Amoriet, en den Girgasiet,","17":"En den Hivviet, en den Arkiet, en den Siniet,","18":"En den Arvadiet, en den Tsemariet, en den Hamathiet; en daarna zijn de huisgezinnen der Kanaänieten verspreid.","19":"En de landpale der Kanaänieten was van Sidon, daar gij gaat naar Gerar tot Gaza toe; daar gij gaat naar Sodom en Gomorra, en Adama, en Zoboim, tot Lasa toe.","20":"Deze *zijn* zonen van Cham, naar hun huisgezinnen, naar hun spraken, in hun landschappen, in hun volken.","21":"Voorts zijn Sem *zonen* geboren; dezelve *is* ook de vader aller zonen van Heber, broeder van Jafeth, den grootste.","22":"Sems zonen *waren* Elam, en Assur, en Arfachsad, en Lud, en Aram.","23":"En Arams zonen *waren* Uz, en Hul, en Gether, en Maz.","24":"En Arfachsad gewon Selah, en Selah gewon Heber.","25":"En Heber werden twee zonen geboren; des enen naam was Peleg; want in zijn dagen is de aarde verdeeld; en zijns broeders naam was Joktan.","26":"En Joktan gewon Almodad, en Selef, en Hatsarmaveth, en Jarach,","27":"En Hadoram, en Usal, en Dikla,","28":"En Obal, en Abimaël, en Scheba,","29":"En Ofir, en Havila, en Jobab; deze allen waren zonen van Joktan.","30":"En hun woning was van Mescha af, daar gij gaat naar Sefar, het gebergte van het oosten.","31":"Deze *zijn* zonen van Sem, naar hun huisgezinnen, naar hun spraken, in hun landschappen, naar hun volken.","32":"Deze *zijn* de huisgezinnen der zonen van Noach, naar hun geboorten, in hun volken; en van dezen zijn de volken op de aarde verdeeld na den vloed."},"KJV":{"1":"Now these *are* the generations of the sons of Noah, Shem, Ham, and Japheth: and unto them were sons born after the flood.","2":"The sons of Japheth; Gomer, and Magog, and Madai, and Javan, and Tubal, and Meshech, and Tiras.","3":"And the sons of Gomer; Ashkenaz, and Riphath, and Togarmah.","4":"And the sons of Javan; Elishah, and Tarshish, Kittim, and Dodanim.","5":"By these were the isles of the Gentiles divided in their lands; every one after his tongue, after their families, in their nations.","6":"And the sons of Ham; Cush, and Mizraim, and Phut, and Canaan.","7":"And the sons of Cush; Seba, and Havilah, and Sabtah, and Raamah, and Sabtecha: and the sons of Raamah; Sheba, and Dedan.","8":"And Cush begat Nimrod: he began to be a mighty one in the earth.","9":"He was a mighty hunter before the LORD: wherefore it is said, Even as Nimrod the mighty hunter before the LORD.","10":"And the beginning of his kingdom was Babel, and Erech, and Accad, and Calneh, in the land of Shinar.","11":"Out of that land went forth Asshur, and builded Nineveh, and the city Rehoboth, and Calah,","12":"And Resen between Nineveh and Calah: the same *is* a great city.","13":"And Mizraim begat Ludim, and Anamim, and Lehabim, and Naphtuhim,","14":"And Pathrusim, and Casluhim, (out of whom came Philistim,) and Caphtorim.","15":"And Canaan begat Sidon his firstborn, and Heth,","16":"And the Jebusite, and the Amorite, and the Girgasite,","17":"And the Hivite, and the Arkite, and the Sinite,","18":"And the Arvadite, and the Zemarite, and the Hamathite: and afterward were the families of the Canaanites spread abroad.","19":"And the border of the Canaanites was from Sidon, as thou comest to Gerar, unto Gaza; as thou goest, unto Sodom, and Gomorrah, and Admah, and Zeboim, even unto Lasha.","20":"These *are* the sons of Ham, after their families, after their tongues, in their countries, *and* in their nations.","21":"Unto Shem also, the father of all the children of Eber, the brother of Japheth the elder, even to him were *children* born.","22":"The children of Shem; Elam, and Asshur, and Arphaxad, and Lud, and Aram.","23":"And the children of Aram; Uz, and Hul, and Gether, and Mash.","24":"And Arphaxad begat Salah; and Salah begat Eber.","25":"And unto Eber were born two sons: the name of one *was* Peleg; for in his days was the earth divided; and his brother's name *was* Joktan.","26":"And Joktan begat Almodad, and Sheleph, and Hazarmaveth, and Jerah,","27":"And Hadoram, and Uzal, and Diklah,","28":"And Obal, and Abimael, and Sheba,","29":"And Ophir, and Havilah, and Jobab: all these *were* the sons of Joktan.","30":"And their dwelling was from Mesha, as thou goest unto Sephar a mount of the east.","31":"These *are* the sons of Shem, after their families, after their tongues, in their lands, after their nations.","32":"These *are* the families of the sons of Noah, after their generations, in their nations: and by these were the nations divided in the earth after the flood."}},"tsk":{"1":[{"kopje":"Dit zijn de","refs":["Gen 2:4","Gen 5:1","Gen 6:9","Matt 1:1"]},{"kopje":"en hun werden","refs":["Gen 9:1","Gen 9:7","Gen 9:19"]}],"4":[{"kopje":"Chittieten","refs":["Num 24:24","Jes 23:1","Jes 23:12","Dan 11:30"]}],"5":[{"kopje":"eilanden","refs":["Gen 10:25","Ps 72:10","Jes 24:15","Jes 40:15","Jes 41:5","Jes 42:4","Jes 42:10","Jes 49:1","Jes 51:5","Jes 59:18","Jes 60:9","Jer 2:10","Jer 25:22","Zef 2:11"]},{"kopje":"naar zijn","refs":["Gen 10:20","Gen 11:1-9"]}],"6":[{"kopje":"En de","refs":["Gen 9:22","1 Kron 1:8-16","1 Kron 4:40","Ps 78:51","Ps 105:23","Ps 105:27","Ps 106:22"]},{"kopje":"Cusch","refs":["Jes 11:11"]},{"kopje":"Put","refs":["Jer 46:9","Ezech 27:10"]}],"7":[{"kopje":"Seba","refs":["Ps 72:10"]},{"kopje":"Havila","refs":["Gen 2:11"]},{"kopje":"Scheba","refs":["1 Kon 10:1","Ezech 27:22"]},{"kopje":"Dedan","refs":["Jes 21:13","Ezech 27:15"]}],"8":[{"kopje":"Nimrod","refs":["Micha 5:5"]}],"9":[{"kopje":"een geweldig","refs":["Gen 6:4","Gen 25:2 210\">Nineveh</span> and <span class=\"wl wl-kjv\" data-code=\"H3625\">Calah:</span> the same is a <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> city.","13":"And <span class=\"wl wl-kjv\" data-code=\"H4714\">Mizraim</span> <span class=\"wl wl-kjv\" data-code=\"H3205\">begat</span> <span class=\"wl wl-kjv\" data-code=\"H3866\">Ludim,</span> and <span class=\"wl wl-kjv\" data-code=\"H6047\">Anamim,</span> and <span class=\"wl wl-kjv\" data-code=\"H3853\">Lehabim,</span> and Naphtuhim,","14":"And <span class=\"wl wl-kjv\" data-code=\"H6625\">Pathrusim,</span> and <span class=\"wl wl-kjv\" data-code=\"H3695\">Casluhim,</span> (out of whom <span class=\"wl wl-kjv\" data-code=\"H3318\">came</span> <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistim,)</span> and Caphtorim.","15":"And <span class=\"wl wl-kjv\" data-code=\"H3667\">Canaan</span> <span class=\"wl wl-kjv\" data-code=\"H3205\">begat</span> <span class=\"wl wl-kjv\" data-code=\"H6721\">Sidon</span> his <span class=\"wl wl-kjv\" data-code=\"H1060\">firstborn,</span> and Heth,","16":"And the <span class=\"wl wl-kjv\" data-code=\"H2983\">Jebusite,</span> and the <span class=\"wl wl-kjv\" data-code=\"H567\">Amorite,</span> and the Girgasite,","17":"And the <span class=\"wl wl-kjv\" data-code=\"H2340\">Hivite,</span> and the <span class=\"wl wl-kjv\" data-code=\"H6208\">Arkite,</span> and the Sinite,","18":"And the <span class=\"wl wl-kjv\" data-code=\"H721\">Arvadite,</span> and the <span class=\"wl wl-kjv\" data-code=\"H6786\">Zemarite,</span> and the <span class=\"wl wl-kjv\" data-code=\"H2577\">Hamathite:</span> and <span class=\"wl wl-kjv\" data-code=\"H310\">afterward</span> were the <span class=\"wl wl-kjv\" data-code=\"H4940\">families</span> of the <span class=\"wl wl-kjv\" data-code=\"H3669\">Canaanites</span> spread abroad.","19":"And the <span class=\"wl wl-kjv\" data-code=\"H1366\">border</span> of the <span class=\"wl wl-kjv\" data-code=\"H3669\">Canaanites</span> was from <span class=\"wl wl-kjv\" data-code=\"H6721\">Sidon,</span> as thou <span class=\"wl wl-kjv\" data-code=\"H935\">comest</span> to <span class=\"wl wl-kjv\" data-code=\"H1642\">Gerar,</span> unto <span class=\"wl wl-kjv\" data-code=\"H5804\">Gaza;</span> as thou <span class=\"wl wl-kjv\" data-code=\"H935\">goest,</span> unto <span class=\"wl wl-kjv\" data-code=\"H5467\">Sodom,</span> and <span class=\"wl wl-kjv\" data-code=\"H6017\">Gomorrah,</span> and <span class=\"wl wl-kjv\" data-code=\"H126\">Admah,</span> and <span class=\"wl wl-kjv\" data-code=\"H6636\">Zeboim,</span> even unto Lasha.","20":"These are the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H2526\">Ham,</span> after their <span class=\"wl wl-kjv\" data-code=\"H4940\">families,</span> after their <span class=\"wl wl-kjv\" data-code=\"H3956\">tongues,</span> in their <span class=\"wl wl-kjv\" data-code=\"H776\">countries,</span> and in their nations.","21":"Unto <span class=\"wl wl-kjv\" data-code=\"H8035\">Shem</span> also, the <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> of all the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H5677\">Eber,</span> the <span class=\"wl wl-kjv\" data-code=\"H251\">brother</span> of <span class=\"wl wl-kjv\" data-code=\"H3315\">Japheth</span> the <span class=\"wl wl-kjv\" data-code=\"H1419\">elder,</span> even to him were children born.","22":"The <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H8035\">Shem;</span> <span class=\"wl wl-kjv\" data-code=\"H5867\">Elam,</span> and <span class=\"wl wl-kjv\" data-code=\"H804\">Asshur,</span> and <span class=\"wl wl-kjv\" data-code=\"H775\">Arphaxad,</span> and <span class=\"wl wl-kjv\" data-code=\"H3865\">Lud,</span> and Aram.","23":"And the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H758\">Aram;</span> <span class=\"wl wl-kjv\" data-code=\"H5780\">Uz,</span> and <span class=\"wl wl-kjv\" data-code=\"H2343\">Hul,</span> and <span class=\"wl wl-kjv\" data-code=\"H1666\">Gether,</span> and Mash.","24":"And <span class=\"wl wl-kjv\" data-code=\"H775\">Arphaxad</span> <span class=\"wl wl-kjv\" data-code=\"H3205\">begat</span> <span class=\"wl wl-kjv\" data-code=\"H7974\">Salah;</span> and <span class=\"wl wl-kjv\" data-code=\"H7974\">Salah</span> <span class=\"wl wl-kjv\" data-code=\"H3205\">begat</span> Eber.","25":"And unto <span class=\"wl wl-kjv\" data-code=\"H5677\">Eber</span> were <span class=\"wl wl-kjv\" data-code=\"H3205\">born</span> <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">sons:</span> the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> was <span class=\"wl wl-kjv\" data-code=\"H6389\">Peleg;</span> for in his <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> was the <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> <span class=\"wl wl-kjv\" data-code=\"H6385\">divided;</span> and his <span class=\"wl wl-kjv\" data-code=\"H251\">brother's</span> <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> was Joktan.","26":"And <span class=\"wl wl-kjv\" data-code=\"H3355\">Joktan</span> <span class=\"wl wl-kjv\" data-code=\"H3205\">begat</span> <span class=\"wl wl-kjv\" data-code=\"H486\">Almodad,</span> and <span class=\"wl wl-kjv\" data-code=\"H8026\">Sheleph,</span> and <span class=\"wl wl-kjv\" data-code=\"H2700\">Hazarmaveth,</span> and Jerah,","27":"And <span class=\"wl wl-kjv\" data-code=\"H1913\">Hadoram,</span> and <span class=\"wl wl-kjv\" data-code=\"H187\">Uzal,</span> and Diklah,","28":"And <span class=\"wl wl-kjv\" data-code=\"H5745\">Obal,</span> and <span class=\"wl wl-kjv\" data-code=\"H39\">Abimael,</span> and Sheba,","29":"And <span class=\"wl wl-kjv\" data-code=\"H211\">Ophir,</span> and <span class=\"wl wl-kjv\" data-code=\"H2341\">Havilah,</span> and <span class=\"wl wl-kjv\" data-code=\"H3103\">Jobab:</span> all these were the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of Joktan.","30":"And their <span class=\"wl wl-kjv\" data-code=\"H4186\">dwelling</span> was from <span class=\"wl wl-kjv\" data-code=\"H4852\">Mesha,</span> as thou <span class=\"wl wl-kjv\" data-code=\"H935\">goest</span> unto <span class=\"wl wl-kjv\" data-code=\"H5611\">Sephar</span> a <span class=\"wl wl-kjv\" data-code=\"H2022\">mount</span> of the east.","31":"These are the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H8035\">Shem,</span> after their <span class=\"wl wl-kjv\" data-code=\"H4940\">families,</span> after their <span class=\"wl wl-kjv\" data-code=\"H3956\">tongues,</span> in their <span class=\"wl wl-kjv\" data-code=\"H776\">lands,</span> after their nations.","32":"These are the <span class=\"wl wl-kjv\" data-code=\"H4940\">families</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H5146\">Noah,</span> after their <span class=\"wl wl-kjv\" data-code=\"H8435\">generations,</span> in their <span class=\"wl wl-kjv\" data-code=\"H1471\">nations:</span> and by these were the <span class=\"wl wl-kjv\" data-code=\"H1471\">nations</span> <span class=\"wl wl-kjv\" data-code=\"H6504\">divided</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> the flood."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"nu zijn","tekst":"Het oogmerk van dit verhaal is, voornamelijk om aan te wijzen, uit welke vaders de Messias naar het vlees gesproten, en onder welk volk intussen de gemeente Gods gevonden werd. Daarna om bekend te maken den oorsprong der volken, en de bedelingen der landen, die zij bewoond hebben; hetwelk alles ook zeer dienstig is tot verklaring van vele Schriftuurplaatsen, gelijk in het vervolg zal blijken."},{"catchword":"geboorten","tekst":"Of, geslachten."}],"2":[{"catchword":"zonen","tekst":"Dezen hebben zich van de plaatsen hunner woningen het meest noord-en westwaarts verspreid; want zich eerst nedergezet hebbende in Klein-Azië, hebben zij langzamerhand de noordse landen en Europa het meest vervuld."},{"catchword":"Gomer,","tekst":"De nakomelingen van dezen hebben het noordelijke gedeelte van Klein-Azië bewoond; waarom zij onder de noordse volken worden geteld. Eze 38:6. En daar zij zich ook westwaarts uitgebreid hebben, zo houdt men het er voor dat zij de voorttelers mede zijn der volken in wier landen de Gallo-Grieken naderhand gewoond hebben."},{"catchword":"Magog,","tekst":"De stamvader der Scythen; zie van dezen Eze 38:2, Eze 39:6."},{"catchword":"Madái,","tekst":"Van wien zijn de Meden; zie 2Ki 17:6; Isa 13:17; Jer 25:25; Dan 5:6, Dan 5:8."},{"catchword":"Javan,","tekst":"De vader der Grieken; zie van dezen Isa 66:19; Dan 8:21; Joe 3:6; Eze 27:13, Eze 27:19."},{"catchword":"Tubal,","tekst":"Men houdt het er voor dat van dezen de Iberen en uit dezen de Spanjaarden voortgekomen zijn. Zie Eze 27:13, Eze 32:28, Eze 38:2-3."},{"catchword":"Mesech,","tekst":"Hebr. Meschech, welke van dezen afkomstig zijn, is onzeker. Sommigen menen die van Cappadocië; anderen, die van Mysië; enigen, de Moschen, of Moskovieten. Zie Eze 38:2-3."},{"catchword":"Thiras","tekst":"Van dezen is in de H.Schrift niets meer vermeld; doch het gevoelen van velen is dat de Thraciërs aan de oevers van den Dniester, naburen der Macedoniërs, van hem zijn voortgekomen."}],"3":[{"catchword":"Askenaz,","tekst":"De vader der inwoners van Pontus en Bithynië, landschappen, gelegen in Klein-Azië. Sommigen houden het er voor dat van dezen de Duitsers afkomstig zijn. Zie Jer 51:27."},{"catchword":"Rifath,","tekst":"Anders, Difath, 1Ch 1:6. Hij was de stamvader der Paphlagoniërs, een volk van Klein-Azië, vroeger genaamd Rifatteën, of Rifeën, langs de kusten der Zwarte Zee."},{"catchword":"Togarma","tekst":"Deze wordt meest gehouden voor den oorsprong van het volk in Klein-Armenië; of [volgens het gevoelen van anderen] der Hoogduitsers. Zie Eze 27:14, Eze 38:6."}],"4":[{"catchword":"Elisa,","tekst":"Van wien afkomstig zijn de Eolen, een volk in Griekenland. Verg. Eze 27:7."},{"catchword":"Tarsis;","tekst":"Naar dezen wordt genoemd de hoofdstad van Cilicië, het vaderland van Paulus, Act 23:3, zodat deze Tarsis geweest is de stamvader der Ciliciërs. Zie Eze 27:12; Jon 1:3."},{"catchword":"Chittim","tekst":"De vader der inwoners van Macedonië, of van Italië, of van Cyprus, of een deel van het land Cilicië: het gevoelen hierover is verschillend. Zie Num 24:24; Isa 23:1; Jer 2:10."},{"catchword":"Dodanim","tekst":"Anders, Rodanim, 1Ch 1:7. Men meent dat van deze afkomstig zijn de Rhodiërs en de Doriërs."}],"5":[{"catchword":"de eilanden","tekst":"Versta, de landen aan de zee westwaarts van Syrië tussen de Middellandse zee en den Oceaan gelegen; namelijk niet alleen die eigenlijk eilanden genoemd worden, maar ook de vaste landen, die door hun ligging eilanden schijnen te zijn."},{"catchword":"elk naar zijn spraak,","tekst":"De verdeling der spraken was wel in dien tijd nog niet geschied [zie onder hoofdstuk Gen 11] , maar Mozes spreekt volgens den tijd, waarin hij dit schreEf. Zie dergelijk exempel Gen 12:8, Gen 13:3, enz."}],"6":[{"catchword":"en de zonen van Cham","tekst":"De nakomelingen van dezen hebben zich van Babel meest zuidwaarts verdeeld in een deel van Azië en in Afrika, en voor een tijd in Palestina. Zie van dezen, 1Ch 4:40; Psa 105:27."},{"catchword":"Cusch","tekst":"Van dezen zijn afkomstig de Arabieren en de Moren. Zie boven de aant. hoofdstuk Gen 2:13; idem 2Ki 19:9; Job 28:19; Jer 13:23, Jer 46:9."},{"catchword":"Mitsraïm","tekst":"De vader der Egyptenaars. Den naam vindt men overal in de H. Schrift. En het is ook de naam van het landschap Egypte zelf en van de inwoners."},{"catchword":"Put,","tekst":"Men meent dat hij een gedeelte van Lybië, [waar de rivier Put is] bewoond heeft. Zie Jer 46:9; Eze 27:10, Eze 38:5."},{"catchword":"Kanaän.","tekst":"De stamvader der Kanaänieten, in de Schrift genoeg bekend. Zie boven Gen 9:25, en onder vs.18."}],"7":[{"catchword":"Seba","tekst":"Van dezen komen de Sabeërs, in Woest-Arabië. Zie Psa 72:10, en Isa 43:3."},{"catchword":"Havila,","tekst":"De vaders der inwoners van een land aldus genaamd, boven Gen 2:11."},{"catchword":"Sabta,","tekst":"Het gevoelen der geleerden is dat de nakomelingen van dezen bewoond hebben het onderdeel van Gelukkig-Arabië."},{"catchword":"Raëma,","tekst":"Mede een voorvader der inwoners van het bovengenoemde Arabië. Zie Eze 27:22."},{"catchword":"Sábtecha.","tekst":"Men houdt het er voor dat deze ook een stamvader van dezelfde natie geweest is."},{"catchword":"Scheba","tekst":"Zuidwaarts wonende in Morenland; van waar men meent dat de koningin van Scheba gekomen is. Zie 1Ki 10:1, 1Ki 10:4; Eze 27:22; Mat 12:42; Act 8:27. Anderen plaatsen hem in Gelukkig-Arabië."},{"catchword":"Dedan","tekst":"Een inwoner mede van Gelukkig-Arabië, of volgens anderer gevoelen, van Morenland. Zie Eze 27:15, Eze 38:13."}],"8":[{"catchword":"geweldig","tekst":"Zie boven Gen 6:4."}],"9":[{"catchword":"jager","tekst":"Hebr. geweldig in jacht, namelijk, niet alleen der beesten, maar ook der mensen, met wie hij handelde gelijk de jagers met het wild, dat zij doden of bedwingen naar hun lust. Zie deze manier van spreken Jer 16:16; Lam 3:52."},{"catchword":"voor het","tekst":"Dat is, openlijk en stoutelijk, zonder vrees voor God en schaamte voor de mensen; verg. hoofdstuk Gen 6:11."}],"10":[{"catchword":"beginsel","tekst":"Nimrod wordt gehouden voor de stichter van de eerste monarchie, en hij heeft het eerst deze vier steden gebouwd; gelijk Kaïn de eerste stad bouwde, vóór den zondvloed."},{"catchword":"Sinear","tekst":"Hebr. Schinhar, het land van Mesopotamië en Chaldea, aldus genaamd naar een gebergte daaraan gelegen, zie omtrent dit Sinear ook onder, Gen 11:2, en Gen 14:1, en Jos 7:21."}],"11":[{"catchword":"Uit ditzelve land","tekst":"Anders, uit dit land is hij, namel. Nimrod, uitgegaan naar Assyrië."},{"catchword":"Ninevé,","tekst":"De hoofdstad van Assyrië, Jon 1:2."},{"catchword":"Rehobóth,","tekst":"Anders, Rechoboth de stad, of, de straten der stad, te weten van Ninevé."}],"12":[{"catchword":"die grote stad","tekst":"Te weten Ninevé. Zie Jon 3:3, Jon 4:11."}],"13":[{"catchword":"Ludim,","tekst":"De stamvader van het volk van Lydië in Mauritanië. Zie van dezen Isa 66:19."},{"catchword":"Anamim,","tekst":"Men houdt hem voor den stamvader der Cyreneërs."},{"catchword":"Lehabim,","tekst":"De vader der Lybiërs in Afrika."},{"catchword":"Naftuhim,","tekst":"Van wien men acht afkomstig te zijn de Moren van Numidië."}],"14":[{"catchword":"Pathrusim,","tekst":"Die omtrent de stad Pathros in Egypte gewoond hebben. Zie van dezen Isa 11:11."},{"catchword":"Kasluhim,","tekst":"De inwoners van Cassiotis."},{"catchword":"van waar","tekst":"Als ook van Caphthorim. Zie Deu 2:23; Jer 47:4; Amo 9:7. Het schijnt dat deze twee broeders uit hun woonplaats tezamen zijn opgetogen, en het land Palestina hebben ingenomen, waarom zij Filistijnen genaamd zijn."},{"catchword":"Filistijnen","tekst":"Dat is, inwoners van Palestina."},{"catchword":"uitgekomen","tekst":"Anders, afgekomen."},{"catchword":"Kaphtorim","tekst":"Afkomstig uit Caphtor; zie daarvan Deu 2:23."}],"15":[{"catchword":"Sidon,","tekst":"Hebr. Tsidon, stichter der stad Tsidon, of Sidon in Phenicië; zie daarvan Jos 11:8, Jos 19:28; Jdg 1:31, enz."},{"catchword":"Heth,","tekst":"De vader der Hethieten, zie van dezen Jos 1:4, Jos 9:1, enz."}],"16":[{"catchword":"En den","tekst":"Dit zijn niet alleen eigennamen van personen, maar ook van ganse volken, die uit dezen gesproten zijn; en worden daarom ook overgezet, de Jebusieter, de Amorieter, enz."},{"catchword":"Jebusi,","tekst":"Van de nakomelingen van dezen zie men Jos 15:8, Jos 18:28; Jdg 1:21."},{"catchword":"Emori,","tekst":"Van de Emorieten, zie men Deu 2:24."},{"catchword":"Girgasi,","tekst":"Zie Mat 8:28."}],"17":[{"catchword":"Hivvi,","tekst":"Zie Jdg 3:3."},{"catchword":"Sini,","tekst":"Van dezen wordt gesproken Isa 49:12."}],"18":[{"catchword":"Arvadi,","tekst":"Zie Eze 27:8, Eze 27:11."},{"catchword":"Zemari,","tekst":"Zie Jos 18:22, en 2Ch 13:4."},{"catchword":"Hamathi","tekst":"Zie Amo 6:2, Amo 6:14; Zec 9:2; van enigen dezer tezamen, zie men Gen 15:19-21."},{"catchword":"Kanaänieten","tekst":"Versta door dezen de Kanaänieten in het algemeen, vooral de nakomelingen of volken van Kanaän."}],"19":[{"catchword":"landpale","tekst":"De grenzen van het land Kanaän worden hier afgetekend; welke waren in de lengte aan de westzijde Sidon noordwaarts, en Gaza zuidwaarts; aan de oostzijde, Laza noordwaarts, en Sodom zuidwaarts; zijnde aldus de breedte aan de noordzijde Sidon en Laza; aan het zuideinde Gaza en Sodom."},{"catchword":"Gaza toe","tekst":"Hebr. Azza."},{"catchword":"Sodom","tekst":"Hebr. Sedom. Zie van deze stad en de drie volgende, onder Gen 13:10, Gen 14:2."},{"catchword":"Gomórra,","tekst":"Hebr. Amora."},{"catchword":"Adama,","tekst":"Hebr. Adma."},{"catchword":"Zebóïm,","tekst":"Hebr. Tseboïm."},{"catchword":"Lasa toe","tekst":"Hebr. Laschah."}],"21":[{"catchword":"zijn","tekst":"Hebr. is geboren, gelijk vs.25."},{"catchword":"zonen","tekst":"Dezen hebben meest hun woonplaatsen verkozen, oostwaarts in groot Azië, waarin Syrië, Assyrië, Mesopotamië, Chaldea, enz. gelegen zijn."},{"catchword":"vader","tekst":"Dat is, niet alleen de stamvader naar het vlees, ten aanzien van de eerstgeboorte; maar ook een voorganger naar den geest, ten aanzien van de wedergeboorte."},{"catchword":"aller zonen","tekst":"Dat is, der Hebreën, [die daarom ook Heber genaamd worden, Num 24:24 ] bij wie de kerk Gods met de ware leer en den waren godsdienst langen tijd gebleven is. Anders, kinderen van de overvaart, van de rivier Eufraat, die Abraham overgevaren is, Jos 24:3. Zie voorts van Sem, boven Gen 6:10."},{"catchword":"Jafeth","tekst":"Deze wordt bijzonder genoemd, omdat hij mede deel had in de zegeningen over Sem, door God uitgesproken, waarvan Cham uitgesloten was, boven Gen 9:25-27."},{"catchword":"den grootste","tekst":"Dat is, de oudste."}],"22":[{"catchword":"Sems zonen","tekst":"Omtrent de woonplaats zijner nakomelingen zie men op het voorgaande vs."},{"catchword":"Elam,","tekst":"Van hem zijn afkomstig de Elamieten, dat is, de Perzen; zie van dezen onder Gen 14:1, Gen 14:9; Isa 21:2; Jer 49:34, enz. Dan 8:2; Act 2:9."},{"catchword":"Assur,","tekst":"De stamvader der Assyriërs, een volk genoeg bekend in de Heilige Schrift. Verg. boven vs.11."},{"catchword":"Arfachsad,","tekst":"Van dezen meent men dat de Chaldeërs voortkomen, genoemd Casdim of Chasdim."},{"catchword":"Lud,","tekst":"Van wie afkomstig zijn die van Lydië in Klein-Azië."},{"catchword":"Aram","tekst":"De stamvader der Syriërs; zie van een anderen Aram, onder Gen 22:21, van welke beiden men meent, dat het land Syrië en de Syriërs hun naam hebben."}],"23":[{"catchword":"Uz,","tekst":"Hebr. Uts. Men houdt het er voor dat deze de stamvader is van de bewoners van het land Trachonitis; volgens het gevoelen van anderen, van enigen die omtrent Idumea woonden. Zie van Utz (Uz,) Job 1:1; Lam 4:21."},{"catchword":"Hul,","tekst":"Van dezen meent men, dat zij het land der Palmyrenen in Syrië bewoond hebben, of Armenië."},{"catchword":"Gether","tekst":"Van dezen waren de Bactriërs, of die Apamene in Syrië bewoonden."},{"catchword":"Mas","tekst":"Anders, Mesech, 1Ch 1:17, die bewoond heeft [zoals men meent] het opperdeel van Syrië tussen Cilicië en Mesopotamië, aan een gedeelte van den berg Aman genaamd Masius; anderen plaatsen hen in Mysië."}],"24":[{"catchword":"Arfachsad","tekst":"Verg. onder Gen 11:13, Gen 11:15."}],"25":[{"catchword":"want in zijn dagen","tekst":"Dat is, omtrent den tijd zijner geboorte zijn de bewoners der aarde van elkander gescheiden door de verde /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
function kopieerVers(n) {
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n})`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
}
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  kopieerVers(k.dataset.n);
});
// rechtermuisklik op een vers kopieert het (in plaats van het browser-contextmenu)
document.addEventListener('contextmenu', e => {
  const rij = e.target.closest('.vers');
  if (!rij || !rij.id.startsWith('v')) return;
  const n = rij.id.slice(1);
  if (!D.vertalingen.SVnu[n]) return;
  e.preventDefault();
  kopieerVers(n);
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  // slug -> volledige boeknaam (voor citaten met de volle boeknaam i.p.v. de afkorting)
  const boeknaamPerSlug = {};
  (D.meta.boeken || []).forEach(b => {
    const m = b.href.match(/^\.\.\/\.\.\/([^/]+)\//);
    if (m) boeknaamPerSlug[m[1]] = b.naam;
  });
  // dubbele rechtsklik (binnen 500ms, zelfde verwijzing) kopieert het vers
  // i.p.v. de vertalingen-popup te tonen (enkele rechtsklik blijft bestaand gedrag)
  function kopieerVerwijzing(chip, ref) {
    haalVert('versteksten', ref).then(data => {
      const tekst = data && data[ref.vers];
      if (!tekst) return;
      const url = location.origin + '/studiebijbel/' + ref.slug + '/' + ref.hfd + '#v' + ref.vers;
      const naam = boeknaamPerSlug[ref.slug] || chip.textContent.replace(/\s+\d+:\d+.*$/, '');
      const kopie = tekst.replace(/\*/g, '') + `\n~ [${naam} ${ref.hfd}:${ref.vers}](${url})`;
      navigator.clipboard.writeText(kopie).then(() => {
        toast.classList.add('zichtbaar');
        setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
      });
    });
  }
  let laatsteRechtsklik = { sleutel: null, tijd: 0 };
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    const sleutel = chip.dataset.ref;
    const nu = Date.now();
    const isDubbelklik = laatsteRechtsklik.sleutel === sleutel && (nu - laatsteRechtsklik.tijd) < 500;
    laatsteRechtsklik = isDubbelklik ? { sleutel: null, tijd: 0 } : { sleutel, tijd: nu };
    if (isDubbelklik) {
      popup.style.display = 'none';
      vpopup.style.display = 'none';
      kopieerVerwijzing(chip, ref);
      return;
    }
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
