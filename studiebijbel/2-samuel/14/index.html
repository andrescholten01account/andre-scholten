naam":"Openbaring","href":"../../openbaring/1/"}],"slugmap":{"Gen":"genesis","Ex":"exodus","Lev":"leviticus","Num":"numeri","Deut":"deuteronomium","Joz":"jozua","Richt":"richteren","Ruth":"ruth","1 Sam":"1-samuel","2 Sam":"2-samuel","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Joab, de zoon van Zeruja, merkte dat het hart van de koning naar Absalom uitging.","2":"Zo zond Joab iemand naar Thekoa, en liet vandaar een wijze vrouw halen; en hij zei tegen haar: Doe toch alsof u rouw draagt, en trek nu rouwkleren aan, en zalf u niet met olie, en wees als een vrouw die al veel dagen rouw heeft gedragen over een dode;","3":"En ga naar de koning, en spreek tot hem naar dit woord. En Joab legde de woorden in haar mond.","4":"En de vrouw uit Thekoa sprak tot de koning, terwijl zij op haar gezicht ter aarde was gevallen, en zich neergebogen had, en zij zei: Help, o koning!","5":"En de koning zei tegen haar: Wat is er met u? En zij zei: Zeker, ik ben een weduwe, en mijn man is gestorven.","6":"Nu had uw dienares twee zonen, en deze twee vochten met elkaar in het veld, en er was niemand om hen uit elkaar te halen; zo sloeg de een de ander, en doodde hem.","7":"En zie, de hele familie is opgestaan tegen uw dienares, en heeft gezegd: Geef hem hier, die zijn broer geslagen heeft, zodat wij hem doden voor het leven van zijn broer, die hij doodgeslagen heeft, en ook de erfgenaam ombrengen; zo zullen zij mijn kool die is overgebleven uitblussen, zodat zij mijn man geen naam of nakomeling laten op de aardbodem.","8":"Toen zei de koning tegen deze vrouw: Ga naar uw huis, en ik zal een bevel voor u geven.","9":"En de vrouw uit Thekoa zei tegen de koning: Mijn heer koning, de schuld zij op mij en op het huis van mijn vader; de koning daarentegen, en zijn troon, zij onschuldig.","10":"En de koning zei: Spreekt iemand tegen u, breng hem dan bij mij; en hij zal u voortaan niet meer aanraken.","11":"En zij zei: De koning gedenkt toch aan de HEERE, uw God, dat de bloedwrekers niet te talrijk worden om te verderven, zodat zij mijn zoon niet ombrengen. Toen zei hij: Zo waarachtig als de HEERE leeft, er zal geen haar van uw zoon op de aarde vallen!","12":"Toen zei deze vrouw: Laat uw dienares toch een woord tot mijn heer de koning spreken. En hij zei: Spreek.","13":"En de vrouw zei: Waarom hebt u dan zoiets tegen het volk van God bedacht? Want doordat de koning dit woord gesproken heeft, is hij als iemand die schuldig staat, omdat de koning zijn verstotene niet terughaalt.","14":"Want wij moeten sterven, en zijn als water dat, uitgestort op de aarde, niet meer verzameld kan worden. God zal echter het leven niet wegnemen, maar Hij zal er middelen op bedenken, dat Hij de verstotene niet van Zich verstoot.","15":"Nu dan, dat ik gekomen ben om dit woord tot de koning, mijn heer, te spreken, is omdat het volk mij bang gemaakt heeft; zo zei uw dienares: Ik zal nu tot de koning spreken; misschien zal de koning doen wat zijn dienares vraagt.","16":"Want de koning zal horen, om zijn dienares te redden uit de hand van de man, die van plan is mij en mijn zoon samen uit het erfdeel van God weg te vagen.","17":"Verder zei uw dienares: Het woord van mijn heer de koning zij toch tot rust; want zoals een Engel van God, zo is mijn heer de koning, om het goede en het kwade te onderscheiden; en de HEERE, uw God, zal met u zijn.","18":"Toen antwoordde de koning, en zei tegen de vrouw: Verberg toch niets voor mij van wat ik u vragen zal. En de vrouw zei: Mijn heer de koning spreke toch.","19":"En de koning zei: Is de hand van Joab hierin met u? En de vrouw antwoordde en zei: Zo waarachtig als uw ziel leeft, mijn heer koning, niemand zou naar rechts of naar links kunnen afwijken van alles wat mijn heer de koning gesproken heeft; want uw dienaar Joab, hij heeft het mij opgedragen, en hij heeft al deze woorden in de mond van uw dienares gelegd;","20":"Om de zaak zo een andere gestalte te geven, dat heeft uw dienaar Joab gedaan; maar mijn heer is wijs, met de wijsheid van een Engel van God, om alles te doorzien wat op de aarde is.","21":"Toen zei de koning tegen Joab: Zie nu, ik heb deze zaak gedaan; ga dan heen, haal de jongeman Absalom terug.","22":"Toen viel Joab op zijn gezicht ter aarde, en boog zich, en dankte de koning; en Joab zei: Vandaag heeft uw dienaar gemerkt, dat ik genade gevonden heb in uw ogen, mijn heer koning! Omdat de koning gedaan heeft wat zijn dienaar gevraagd heeft.","23":"Zo maakte Joab zich op, en ging naar Gesur; en hij bracht Absalom naar Jeruzalem.","24":"En de koning zei: Laat hij naar zijn huis gaan, en mijn gezicht niet zien. Zo ging Absalom naar zijn huis, en zag het gezicht van de koning niet.","25":"Nu was er in heel Israël geen man zo mooi als Absalom, zeer geprezen; van zijn voetzool af tot zijn hoofdschedel toe was er geen gebrek in hem.","26":"En als hij zijn hoofd liet scheren (dit gebeurde aan het einde van elk jaar, dat hij het liet scheren, omdat het hem te zwaar werd, daarom liet hij het scheren), dan woog het haar van zijn hoofd tweehonderd sikkel, naar het gewicht van de koning.","27":"Ook werden aan Absalom drie zonen geboren, en één dochter, wier naam Tamar was; deze was een vrouw, mooi van uiterlijk.","28":"Zo bleef Absalom twee volle jaren in Jeruzalem, zonder het gezicht van de koning te zien.","29":"Daarom zond Absalom iemand naar Joab, om hem naar de koning te sturen; maar hij wilde niet naar hem toe komen. Toen zond hij nog een tweede keer; toch wilde hij niet komen.","30":"Toen zei hij tegen zijn knechten: Kijk, het stuk akker van Joab ligt naast het mijne, en hij heeft daar gerst op staan; ga erheen, en steek het in brand. En de knechten van Absalom staken dat stuk akker in brand.","31":"Toen maakte Joab zich op en kwam naar Absalom in zijn huis, en zei tegen hem: Waarom hebben uw knechten het stuk akker dat van mij is, in brand gestoken?","32":"En Absalom zei tegen Joab: Zie, ik heb naar u gestuurd, en gezegd: Kom hierheen, zodat ik u naar de koning kan sturen, om te zeggen: Waarom ben ik uit Gesur gekomen? Het was beter voor mij geweest, als ik daar nog was; nu dan, laat mij het gezicht van de koning zien; en is er dan nog een misdaad in mij, laat hij mij dan doden.","33":"Toen ging Joab naar de koning, en vertelde het hem. Toen riep hij Absalom, en hij kwam bij de koning, en boog zich voor hem op zijn gezicht ter aarde, voor het aangezicht van de koning; en de koning kuste Absalom."},"SV":{"1":"Als nu Joab, de zoon van Zeruja, merkte, dat des konings hart over Absalom was;","2":"Zo zond Joab heen naar Thekoa, en nam van daar een wijze vrouw; en hij zeide tot haar: Stel u toch, alsof gij rouw droegt, en trek nu rouwklederen aan, en zalf u niet met olie, en wees als een vrouw, die nu vele dagen rouw gedragen heeft over een dode;","3":"En ga in tot den koning, en spreek tot hem naar dit woord. En Joab leide de woorden in haar mond.","4":"En de Thekoietische vrouw zeide tot den koning, als zij op haar aangezicht ter aarde was gevallen, en zich nedergebogen had, zo zeide zij: Behoud, o koning!","5":"En de koning zeide tot haar: Wat is u? En zij zeide: Zekerlijk, ik ben een weduwvrouw, en mijn man is gestorven.","6":"Nu had uw dienstmaagd twee zonen, en deze beiden twistten in het veld, en er was geen scheider tussen hen; zo sloeg de een den ander, en doodde hem.","7":"En zie, het ganse geslacht is opgestaan tegen uw dienstmaagd, en hebben gezegd: Geef dien hier, die zijn broeder geslagen heeft, dat wij hem voor de ziel zijns broeders, dien hij doodgeslagen heeft, doden, en ook den erfgenaam verdelgen; alzo zullen zij mijn kool, die overgebleven is, uitblussen, opdat zij mijn man geen naam noch overblijfsel laten op den aardbodem.","8":"Toen zeide de koning tot deze vrouw: Ga naar uw huis, en ik zal voor u gebieden.","9":"En de Thekoietische vrouw zeide tot den koning: Mijn heer koning, de ongerechtigheid zij op mij en op mijns vaders huis; de koning daarentegen, en zijn stoel, zij onschuldig.","10":"En de koning zeide: Spreekt iemand tegen u, zo breng hem tot mij; en hij zal u voortaan niet meer aantasten.","11":"En zij zeide: De koning gedenke toch aan den HEERE, uw God, dat de bloedwrekers niet te vele worden om te verderven, dat zij mijn zoon niet verdelgen. Toen zeide hij: *Zo* *waarachtig* *als* de HEERE leeft, indien er een van de haren uws zoons op de aarde zal vallen!","12":"Toen zeide deze vrouw: Laat toch uw dienstmaagd een woord tot mijn heer den koning spreken. En hij zeide: Spreek.","13":"En de vrouw zeide: Waarom hebt gij dan alzulks tegen Gods volk gedaan? Want daaruit, dat de koning dit woord gesproken heeft, is hij als een schuldige, dewijl de koning zijn verstotene niet wederhaalt.","14":"Want wij zullen den dood sterven, en wezen als water, dat, ter aarde uitgestort zijnde, niet verzameld wordt. God dan zal de ziel niet wegnemen, maar Hij zal gedachten denken, dat Hij den verstotene niet van Zich verstote.","15":"Nu dan, dat ik gekomen ben, om ditzelve woord tot den koning, mijn heer, te spreken, *is* omdat het volk mij vreesachtig gemaakt heeft; zo zeide uw dienstmaagd: Ik zal nu tot den koning spreken; misschien zal de koning het woord zijner dienstmaagd doen.","16":"Want de koning zal horen, om zijn dienstmaagd te redden van de hand des mans, die *voorheeft* mij en mijn zoon te zamen van Gods erve te verdelgen.","17":"Wijders zeide uw dienstmaagd: Het woord mijns heren, des konings, zij toch tot rust; want gelijk een Engel Gods, alzo is mijn heer de koning, om te horen het goede en het kwade; en de HEERE, uw God, zal met u zijn.","18":"Toen antwoordde de koning, en zeide tot de vrouw: Verberg nu niet voor mij de zaak, die ik u vragen zal. En de vrouw zeide: Mijn heer de koning spreke toch.","19":"En de koning zeide: Is Joabs hand met u in dit alles? En de vrouw antwoordde en zeide: *Zo* *waarachtig* *als* uw ziel leeft, mijn heer koning, indien iemand ter rechter- of ter linkerhand zou kunnen afwijken van alles, wat mijn heer de koning gesproken heeft; want uw knecht Joab heeft het mij geboden, en die heeft al deze woorden in den mond uwer dienstmaagd gelegd;","20":"Dat ik de gestalte dezer zaak alzo omwenden zou, zulks heeft uw knecht Joab gedaan; doch mijn heer is wijs, naar de wijsheid van een Engel Gods, om te merken alles, wat op de aarde is.","21":"Toen zeide de koning tot Joab: Zie nu, ik heb deze zaak gedaan; zo ga henen, haal den jongeling Absalom weder.","22":"Toen viel Joab op zijn aangezicht ter aarde, en boog zich, en dankte den koning; en Joab zeide: Heden heeft uw knecht gemerkt, dat ik genade gevonden heb in uw ogen, mijn heer koning! Omdat de koning het woord van zijn knecht gedaan heeft.","23":"Alzo maakte zich Joab op, en toog naar Gesur; en hij bracht Absalom te Jeruzalem.","24":"En de koning zeide: Dat hij in zijn huis kere, en mijn aangezicht niet zie. Alzo keerde Absalom in zijn huis, en zag des konings aangezicht niet.","25":"Nu was er in gans Israël geen man zo schoon als Absalom, zeer te prijzen; van zijn voetzool af tot zijn hoofdschedel toe was er geen gebrek in hem.","26":"En als hij zijn hoofd beschoor, (nu geschiedde het ten einde van elk jaar, dat hij het beschoor, omdat het hem te zwaar was, zo beschoor hij het), zo woog het haar zijns hoofds tweehonderd sikkelen, naar des konings gewicht.","27":"Ook werden Absalom drie zonen geboren, en een dochter, welker naam was Thamar; deze was een vrouw, schoon van aanzien.","28":"Alzo bleef Absalom twee volle jaren te Jeruzalem, dat hij des konings aangezicht niet zag.","29":"Daarom zond Absalom tot Joab, dat hij hem tot den koning zond; maar hij wilde niet tot hem komen. Zo zond hij nog ten anderen male; evenwel wilde hij niet komen.","30":"Zo zeide hij tot zijn knechten: Ziet, het stuk akkers van Joab is aan de zijde van het mijne, en hij heeft gerst daarop; gaat heen, en steekt het aan met vuur, en Absaloms knechten staken dat stuk akkers aan met vuur.","31":"Toen maakte zich Joab op en kwam tot Absalom in het huis, en zeide tot hem: Waarom hebben uw knechten het stuk akkers, dat mijn is, met vuur aangestoken?","32":"En Absalom zeide tot Joab: Zie, ik heb tot u gezonden, zeggende: Kom herwaarts, dat ik u tot den koning zende, om te zeggen: Waarom ben ik van Gesur gekomen? Het ware mij goed, dat ik nog daar ware; nu dan, laat mij het aangezicht des konings zien; is er dan nog een misdaad in mij, zo dode hij mij.","33":"Toen ging Joab in tot den koning, en zeide het hem aan. Toen riep hij Absalom, en hij kwam tot den koning in, en boog zich voor hem op zijn aangezicht ter aarde, voor des konings aangezicht; en de koning kuste Absalom."},"KJV":{"1":"Now Joab the son of Zeruiah perceived that the king's heart was toward Absalom.","2":"And Joab sent to Tekoah, and fetched thence a wise woman, and said unto her, I pray thee, feign thyself to be a mourner, and put on now mourning apparel, and anoint not thyself with oil, but be as a woman that had a long time mourned for the dead:","3":"And come to the king, and speak on this manner unto him. So Joab put the words in her mouth.","4":"And when the woman of Tekoah spake to the king, she fell on her face to the ground, and did obeisance, and said, Help, O king.","5":"And the king said unto her, What aileth thee? And she answered, I am indeed a widow woman, and mine husband is dead.","6":"And thy handmaid had two sons, and they two strove together in the field, and there was none to part them, but the one smote the other, and slew him.","7":"And, behold, the whole family is risen against thine handmaid, and they said, Deliver him that smote his brother, that we may kill him, for the life of his brother whom he slew; and we will destroy the heir also: and so they shall quench my coal which is left, and shall not leave to my husband neither name nor remainder upon the earth.","8":"And the king said unto the woman, Go to thine house, and I will give charge concerning thee.","9":"And the woman of Tekoah said unto the king, My lord, O king, the iniquity be on me, and on my father's house: and the king and his throne be guiltless.","10":"And the king said, Whosoever saith ought unto thee, bring him to me, and he shall not touch thee any more.","11":"Then said she, I pray thee, let the king remember the LORD thy God, that thou wouldest not suffer the revengers of blood to destroy any more, lest they destroy my son. And he said, As the LORD liveth, there shall not one hair of thy son fall to the earth.","12":"Then the woman said, Let thine handmaid, I pray thee, speak one word unto my lord the king. And he said, Say on.","13":"And the woman said, Wherefore then hast thou thought such a thing against the people of God? for the king doth speak this thing as one which is faulty, in that the king doth not fetch home again his banished.","14":"For we must needs die, and are as water spilt on the ground, which cannot be gathered up again; neither doth God respect any person: yet doth he devise means, that his banished be not expelled from him.","15":"Now therefore that I am come to speak of this thing unto my lord the king, it is because the people have made me afraid: and thy handmaid said, I will now speak unto the king; it may be that the king will perform the request of his handmaid.","16":"For the king will hear, to deliver his handmaid out of the hand of the man that would destroy me and my son together out of the inheritance of God.","17":"Then thine handmaid said, The word of my lord the king shall now be comfortable: for as an angel of God, so is my lord the king to discern good and bad: therefore the LORD thy God will be with thee.","18":"Then the king answered and said unto the woman, Hide not from me, I pray thee, the thing that I shall ask thee. And the woman said, Let my lord the king now speak.","19":"And the king said, Is not the hand of Joab with thee in all this? And the woman answered and said, As thy soul liveth, my lord the king, none can turn to the right hand or to the left from ought that my lord the king hath spoken: for thy servant Joab, he bade me, and he put all these words in the mouth of thine handmaid:","20":"To fetch about this form of speech hath thy servant Joab done this thing: and my lord is wise, according to the wisdom of an angel of God, to know all things that are in the earth.","21":"And the king said unto Joab, Behold now, I have done this thing: go therefore, bring ➔ the young man Absalom again.","22":"And Joab fell to the ground on his face, and bowed himself, and thanked the king: and Joab said, To day thy servant knoweth that I have found grace in thy sight, my lord, O king, in that the king hath fulfilled the request of his servant.","23":"So Joab arose and went to Geshur, and brought Absalom to Jerusalem.","24":"And the king said, Let him turn to his own house, and let him not see my face. So Absalom returned to his own house, and saw not the king's face.","25":"But in all Israel there was none to be so much praised as Absalom for his beauty: from the sole of his foot even to the crown of his head there was no blemish in him.","26":"And when he polled his head, (for it was at every year's end that he polled it: because the hair was heavy on him, therefore he polled it:) he weighed the hair of his head at two hundred shekels after the king's weight.","27":"And unto Absalom there were born three sons, and one daughter, whose name was Tamar: she was a woman of a fair countenance.","28":"So Absalom dwelt two full years in Jerusalem, and saw not the king's face.","29":"Therefore Absalom sent for Joab, to have sent him to the king; but he would not come to him: and when he sent again the second time, he would not come.","30":"Therefore he said unto his servants, See, Joab's field is near mine, and he hath barley there; go and set it on fire. And Absalom's servants set the field on fire.","31":"Then Joab arose, and came to Absalom unto his house, and said unto him, Wherefore have thy servants set my field on fire?","32":"And Absalom answered Joab, Behold, I sent unto thee, saying, Come hither, that I may send thee to the king, to say, Wherefore am I come from Geshur? it had been good for me to have been there still: now therefore let me see the king's face; and if there be any iniquity in me, let him kill me.","33":"So Joab came to the king, and told him: and when he had called for Absalom, he came to the king, and bowed himself on his face to the ground before the king: and the king kissed Absalom."}},"tsk":{"1":[{"kopje":"Joab","refs":["2 Sam 2:18","1 Kron 2:16"]},{"kopje":"naar Absalom","refs":["2 Sam 13:39","2 Sam 18:33","2 Sam 19:2","2 Sam 19:4","Spr 29:26"]}],"2":[{"kopje":"naar Thekoa","refs":["2 Kron 11:6","2 Kron 20:20","Neh 3:5","Neh 3:27","Jer 6:1","Amos 1:1"]},{"kopje":"rouw draagt","refs":["2 Sam 11:26","Ruth 3:3","Ps 104:15","Pred 9:8","Matt 6:17"]}],"3":[{"kopje":"legde de woorden","refs":["2 Sam 14:19","Ex 4:15","Num 23:5","Deut 18:18","Jes 51:16","Jes 59:21","Jer 1:9"]}],"4":[{"kopje":"op haar gezicht ter aarde was gevallen","refs":["2 Sam 1:2","1 Sam 20 code=\"H53\">Absalom.</span>","2":"And <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> to <span class=\"wl wl-kjv\" data-code=\"H8620\">Tekoah,</span> and <span class=\"wl wl-kjv\" data-code=\"H3947\">fetched</span> thence a <span class=\"wl wl-kjv\" data-code=\"H2450\">wise</span> <span class=\"wl wl-kjv\" data-code=\"H802\">woman,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto her, I pray thee, feign thyself to be a <span class=\"wl wl-kjv\" data-code=\"H56\">mourner,</span> and put <span class=\"wl wl-kjv\" data-code=\"H3847\">on</span> now <span class=\"wl wl-kjv\" data-code=\"H60\">mourning</span> <span class=\"wl wl-kjv\" data-code=\"H899\">apparel,</span> and <span class=\"wl wl-kjv\" data-code=\"H5480\">anoint</span> not thyself with <span class=\"wl wl-kjv\" data-code=\"H8081\">oil,</span> but be as a <span class=\"wl wl-kjv\" data-code=\"H802\">woman</span> that had a <span class=\"wl wl-kjv\" data-code=\"H7227\">long</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">time</span> <span class=\"wl wl-kjv\" data-code=\"H56\">mourned</span> for the <span class=\"wl wl-kjv\" data-code=\"H4191\">dead:</span>","3":"And <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> to the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> and <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> on this <span class=\"wl wl-kjv\" data-code=\"H1697\">manner</span> unto him. So <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab</span> <span class=\"wl wl-kjv\" data-code=\"H7760\">put</span> the <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> in her <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth.</span>","4":"And when the <span class=\"wl wl-kjv\" data-code=\"H802\">woman</span> of <span class=\"wl wl-kjv\" data-code=\"H8621\">Tekoah</span> <span class=\"wl wl-kjv\" data-code=\"H559\">spake</span> to the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> she <span class=\"wl wl-kjv\" data-code=\"H5307\">fell</span> on her <span class=\"wl wl-kjv\" data-code=\"H639\">face</span> to the <span class=\"wl wl-kjv\" data-code=\"H776\">ground,</span> and did <span class=\"wl wl-kjv\" data-code=\"H7812\">obeisance,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H3467\">Help,</span> O <span class=\"wl wl-kjv\" data-code=\"H4428\">king.</span>","5":"And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto her, What aileth thee? And she <span class=\"wl wl-kjv\" data-code=\"H559\">answered,</span> I am <span class=\"wl wl-kjv\" data-code=\"H61\">indeed</span> a <span class=\"wl wl-kjv\" data-code=\"H490\">widow</span> <span class=\"wl wl-kjv\" data-code=\"H802\">woman,</span> and mine <span class=\"wl wl-kjv\" data-code=\"H376\">husband</span> is <span class=\"wl wl-kjv\" data-code=\"H4191\">dead.</span>","6":"And thy <span class=\"wl wl-kjv\" data-code=\"H8198\">handmaid</span> had <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">sons,</span> and they <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> strove <span class=\"wl wl-kjv\" data-code=\"H5327\">together</span> in the <span class=\"wl wl-kjv\" data-code=\"H7704\">field,</span> and there was none to <span class=\"wl wl-kjv\" data-code=\"H5337\">part</span> them, but the <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> the <span class=\"wl wl-kjv\" data-code=\"H259\">other,</span> and <span class=\"wl wl-kjv\" data-code=\"H4191\">slew</span> him.","7":"And, behold, the whole <span class=\"wl wl-kjv\" data-code=\"H4940\">family</span> is <span class=\"wl wl-kjv\" data-code=\"H6965\">risen</span> against thine <span class=\"wl wl-kjv\" data-code=\"H8198\">handmaid,</span> and they <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">Deliver</span> him that <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> his <span class=\"wl wl-kjv\" data-code=\"H251\">brother,</span> that we may <span class=\"wl wl-kjv\" data-code=\"H4191\">kill</span> him, for the <span class=\"wl wl-kjv\" data-code=\"H5315\">life</span> of his <span class=\"wl wl-kjv\" data-code=\"H251\">brother</span> whom he <span class=\"wl wl-kjv\" data-code=\"H2026\">slew;</span> and we will <span class=\"wl wl-kjv\" data-code=\"H8045\">destroy</span> the <span class=\"wl wl-kjv\" data-code=\"H3423\">heir</span> also: and so they shall <span class=\"wl wl-kjv\" data-code=\"H3518\">quench</span> my <span class=\"wl wl-kjv\" data-code=\"H1513\">coal</span> which is <span class=\"wl wl-kjv\" data-code=\"H7760\">left,</span> and shall not <span class=\"wl wl-kjv\" data-code=\"H7604\">leave</span> to my <span class=\"wl wl-kjv\" data-code=\"H376\">husband</span> neither <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> nor <span class=\"wl wl-kjv\" data-code=\"H7611\">remainder</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">upon</span> the <span class=\"wl wl-kjv\" data-code=\"H127\">earth.</span>","8":"And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto the <span class=\"wl wl-kjv\" data-code=\"H802\">woman,</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">Go</span> to thine <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> and I will give <span class=\"wl wl-kjv\" data-code=\"H6680\">charge</span> concerning thee.","9":"And the <span class=\"wl wl-kjv\" data-code=\"H802\">woman</span> of <span class=\"wl wl-kjv\" data-code=\"H8621\">Tekoah</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> My <span class=\"wl wl-kjv\" data-code=\"H113\">lord,</span> O <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> the <span class=\"wl wl-kjv\" data-code=\"H5771\">iniquity</span> be on me, and on my <span class=\"wl wl-kjv\" data-code=\"H1\">father's</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house:</span> and the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> and his <span class=\"wl wl-kjv\" data-code=\"H3678\">throne</span> be <span class=\"wl wl-kjv\" data-code=\"H5355\">guiltless.</span>","10":"And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Whosoever <span class=\"wl wl-kjv\" data-code=\"H1696\">saith</span> ought unto thee, <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> him to me, and he shall not <span class=\"wl wl-kjv\" data-code=\"H5060\">touch</span> thee any <span class=\"wl wl-kjv\" data-code=\"H3254\">more.</span>","11":"Then <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> she, I pray thee, let the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H2142\">remember</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> that thou wouldest not suffer the <span class=\"wl wl-kjv\" data-code=\"H1350\">revengers</span> of <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> to <span class=\"wl wl-kjv\" data-code=\"H7843\">destroy</span> any <span class=\"wl wl-kjv\" data-code=\"H7235\">more,</span> lest they <span class=\"wl wl-kjv\" data-code=\"H8045\">destroy</span> my <span class=\"wl wl-kjv\" data-code=\"H1121\">son.</span> And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> As the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H2416\">liveth,</span> there shall not one <span class=\"wl wl-kjv\" data-code=\"H8185\">hair</span> of thy <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> <span class=\"wl wl-kjv\" data-code=\"H5307\">fall</span> to the <span class=\"wl wl-kjv\" data-code=\"H776\">earth.</span>","12":"Then the <span class=\"wl wl-kjv\" data-code=\"H802\">woman</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Let thine <span class=\"wl wl-kjv\" data-code=\"H8198\">handmaid,</span> I pray thee, <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> one <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> unto my <span class=\"wl wl-kjv\" data-code=\"H113\">lord</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king.</span> And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Say <span class=\"wl wl-kjv\" data-code=\"H1696\">on.</span>","13":"And the <span class=\"wl wl-kjv\" data-code=\"H802\">woman</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Wherefore then hast thou <span class=\"wl wl-kjv\" data-code=\"H2803\">thought</span> such a thing against the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God?</span> for the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> doth <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> this <span class=\"wl wl-kjv\" data-code=\"H1697\">thing</span> as one which is <span class=\"wl wl-kjv\" data-code=\"H818\">faulty,</span> in that the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> doth not fetch home <span class=\"wl wl-kjv\" data-code=\"H7725\">again</span> his <span class=\"wl wl-kjv\" data-code=\"H5080\">banished.</span>","14":"For we must <span class=\"wl wl-kjv\" data-code=\"H4191\">needs</span> <span class=\"wl wl-kjv\" data-code=\"H4191\">die,</span> and are as <span class=\"wl wl-kjv\" data-code=\"H4325\">water</span> <span class=\"wl wl-kjv\" data-code=\"H5064\">spilt</span> on the <span class=\"wl wl-kjv\" data-code=\"H776\">ground,</span> which cannot be gathered up <span class=\"wl wl-kjv\" data-code=\"H622\">again;</span> neither doth <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H5375\">respect</span> any <span class=\"wl wl-kjv\" data-code=\"H5315\">person:</span> yet doth he <span class=\"wl wl-kjv\" data-code=\"H2803\">devise</span> <span class=\"wl wl-kjv\" data-code=\"H4284\">means,</span> that his <span class=\"wl wl-kjv\" data-code=\"H5080\">banished</span> be not <span class=\"wl wl-kjv\" data-code=\"H5080\">expelled</span> from him.","15":"Now therefore that I am <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> to <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> of this <span class=\"wl wl-kjv\" data-code=\"H1697\">thing</span> unto my <span class=\"wl wl-kjv\" data-code=\"H113\">lord</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> it is because the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> have made me <span class=\"wl wl-kjv\" data-code=\"H3372\">afraid:</span> and thy <span class=\"wl wl-kjv\" data-code=\"H8198\">handmaid</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> I will now <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> unto the <span class=\"wl wl-kjv\" data-code=\"H4428\">king;</span> it may be that the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> will <span class=\"wl wl-kjv\" data-code=\"H6213\">perform</span> the <span class=\"wl wl-kjv\" data-code=\"H1697\">request</span> of his <span class=\"wl wl-kjv\" data-code=\"H519\">handmaid.</span>","16":"For the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> will <span class=\"wl wl-kjv\" data-code=\"H8085\">hear,</span> to <span class=\"wl wl-kjv\" data-code=\"H5337\">deliver</span> his <span class=\"wl wl-kjv\" data-code=\"H519\">handmaid</span> out of the <span class=\"wl wl-kjv\" data-code=\"H3709\">hand</span> of the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> that would <span class=\"wl wl-kjv\" data-code=\"H8045\">destroy</span> me and my <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> <span class=\"wl wl-kjv\" data-code=\"H3162\">together</span> out of the <span class=\"wl wl-kjv\" data-code=\"H5159\">inheritance</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God.</span>","17":"Then thine <span class=\"wl wl-kjv\" data-code=\"H8198\">handmaid</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> The <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of my <span class=\"wl wl-kjv\" data-code=\"H113\">lord</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> shall now be <span class=\"wl wl-kjv\" data-code=\"H4496\">comfortable:</span> for as an <span class=\"wl wl-kjv\" data-code=\"H4397\">angel</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> so is my <span class=\"wl wl-kjv\" data-code=\"H113\">lord</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> to <span class=\"wl wl-kjv\" data-code=\"H8085\">discern</span> <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> and <span class=\"wl wl-kjv\" data-code=\"H7451\">bad:</span> therefore the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> will be with thee.","18":"Then the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H6030\">answered</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto the <span class=\"wl wl-kjv\" data-code=\"H802\">woman,</span> <span class=\"wl wl-kjv\" data-code=\"H3582\">Hide</span> not from me, I pray thee, the <span class=\"wl wl-kjv\" data-code=\"H1697\">thing</span> that I shall <span class=\"wl wl-kjv\" data-code=\"H7592\">ask</span> thee. And the <span class=\"wl wl-kjv\" data-code=\"H802\">woman</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Let my <span class=\"wl wl-kjv\" data-code=\"H113\">lord</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> now <span class=\"wl wl-kjv\" data-code=\"H1696\">speak.</span>","19":"And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Is not the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab</span> with thee in all this? And the <span class=\"wl wl-kjv\" data-code=\"H802\">woman</span> <span class=\"wl wl-kjv\" data-code=\"H6030\">answered</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> As thy <span class=\"wl wl-kjv\" data-code=\"H5315\">soul</span> <span class=\"wl wl-kjv\" data-code=\"H2416\">liveth,</span> my <span class=\"wl wl-kjv\" data-code=\"H113\">lord</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> <span class=\"wl wl-kjv\" data-code=\"H376\">none</span> <span class=\"wl wl-kjv\" data-code=\"H786\">can</span> turn to the right <span class=\"wl wl-kjv\" data-code=\"H3231\">hand</span> or to the <span class=\"wl wl-kjv\" data-code=\"H8041\">left</span> from ought that my <span class=\"wl wl-kjv\" data-code=\"H113\">lord</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> hath <span class=\"wl wl-kjv\" data-code=\"H1696\">spoken:</span> for thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab,</span> he <span class=\"wl wl-kjv\" data-code=\"H6680\">bade</span> me, and he <span class=\"wl wl-kjv\" data-code=\"H7760\">put</span> all these <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> in the <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth</span> of thine <span class=\"wl wl-kjv\" data-code=\"H8198\">handmaid:</span>","20":"<span class=\"wl wl-kjv\" data-code=\"H5668\">To</span> fetch <span class=\"wl wl-kjv\" data-code=\"H5437\">about</span> this <span class=\"wl wl-kjv\" data-code=\"H6440\">form</span> of <span class=\"wl wl-kjv\" data-code=\"H1697\">speech</span> hath thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> this <span class=\"wl wl-kjv\" data-code=\"H1697\">thing:</span> and my <span class=\"wl wl-kjv\" data-code=\"H113\">lord</span> is <span class=\"wl wl-kjv\" data-code=\"H2450\">wise,</span> according to the <span class=\"wl wl-kjv\" data-code=\"H2451\">wisdom</span> of an <span class=\"wl wl-kjv\" data-code=\"H4397\">angel</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> to <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> all things that are in the <span class=\"wl wl-kjv\" data-code=\"H776\">earth.</span>","21":"And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab,</span> Behold now, I have <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> this <span class=\"wl wl-kjv\" data-code=\"H1697\">thing:</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> therefore, <span class=\"wl wl-kjv\" data-code=\"H7725\">bring</span> ➔ the young <span class=\"wl wl-kjv\" data-code=\"H5288\">man</span> <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">again.</span>","22":"And <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab</span> <span class=\"wl wl-kjv\" data-code=\"H5307\">fell</span> to the <span class=\"wl wl-kjv\" data-code=\"H776\">ground</span> on his <span class=\"wl wl-kjv\" data-code=\"H6440\">face,</span> and <span class=\"wl wl-kjv\" data-code=\"H7812\">bowed</span> himself, and <span class=\"wl wl-kjv\" data-code=\"H1288\">thanked</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king:</span> and <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> To <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> <span class=\"wl wl-kjv\" data-code=\"H3045\">knoweth</span> that I have <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> <span class=\"wl wl-kjv\" data-code=\"H2580\">grace</span> in thy <span class=\"wl wl-kjv\" data-code=\"H5869\">sight,</span> my <span class=\"wl wl-kjv\" data-code=\"H113\">lord,</span> O <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> in that the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> hath <span class=\"wl wl-kjv\" data-code=\"H6213\">fulfilled</span> the <span class=\"wl wl-kjv\" data-code=\"H1697\">request</span> of his <span class=\"wl wl-kjv\" data-code=\"H5650\">servant.</span>","23":"So <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab</span> <span class=\"wl wl-kjv\" data-code=\"H6965\">arose</span> and <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> to <span class=\"wl wl-kjv\" data-code=\"H1650\">Geshur,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom</span> to <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem.</span>","24":"And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Let him <span class=\"wl wl-kjv\" data-code=\"H5437\">turn</span> to his own <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> and let him not <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> my <span class=\"wl wl-kjv\" data-code=\"H6440\">face.</span> So <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom</span> <span class=\"wl wl-kjv\" data-code=\"H5437\">returned</span> to his own <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> and <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> not the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">face.</span>","25":"But in all <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> there was <span class=\"wl wl-kjv\" data-code=\"H376\">none</span> to be so <span class=\"wl wl-kjv\" data-code=\"H3966\">much</span> <span class=\"wl wl-kjv\" data-code=\"H1984\">praised</span> as <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom</span> for his <span class=\"wl wl-kjv\" data-code=\"H3303\">beauty:</span> from the <span class=\"wl wl-kjv\" data-code=\"H3709\">sole</span> of his <span class=\"wl wl-kjv\" data-code=\"H7272\">foot</span> even to the crown of his <span class=\"wl wl-kjv\" data-code=\"H6936\">head</span> there was no <span class=\"wl wl-kjv\" data-code=\"H3971\">blemish</span> in him.","26":"And when he <span class=\"wl wl-kjv\" data-code=\"H1548\">polled</span> his <span class=\"wl wl-kjv\" data-code=\"H7218\">head,</span> (for it was at every <span class=\"wl wl-kjv\" data-code=\"H3117\">year's</span> <span class=\"wl wl-kjv\" data-code=\"H7093\">end</span> that he <span class=\"wl wl-kjv\" data-code=\"H1548\">polled</span> it: because the hair was <span class=\"wl wl-kjv\" data-code=\"H3513\">heavy</span> on him, therefore he <span class=\"wl wl-kjv\" data-code=\"H1548\">polled</span> it:) he <span class=\"wl wl-kjv\" data-code=\"H8254\">weighed</span> the <span class=\"wl wl-kjv\" data-code=\"H8181\">hair</span> of his <span class=\"wl wl-kjv\" data-code=\"H7218\">head</span> at two <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> <span class=\"wl wl-kjv\" data-code=\"H8255\">shekels</span> after the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H68\">weight.</span>","27":"And unto <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom</span> there were <span class=\"wl wl-kjv\" data-code=\"H3205\">born</span> <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">sons,</span> and <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter,</span> whose <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> was <span class=\"wl wl-kjv\" data-code=\"H8559\">Tamar:</span> she was a <span class=\"wl wl-kjv\" data-code=\"H802\">woman</span> of a <span class=\"wl wl-kjv\" data-code=\"H3303\">fair</span> <span class=\"wl wl-kjv\" data-code=\"H4758\">countenance.</span>","28":"So <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom</span> <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelt</span> two <span class=\"wl wl-kjv\" data-code=\"H3117\">full</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> in <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> and <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> not the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">face.</span>","29":"Therefore <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> for <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab,</span> to have <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> him to the <span class=\"wl wl-kjv\" data-code=\"H4428\">king;</span> but he <span class=\"wl wl-kjv\" data-code=\"H14\">would</span> not <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> to him: and when he sent <span class=\"wl wl-kjv\" data-code=\"H7971\">again</span> the second <span class=\"wl wl-kjv\" data-code=\"H8145\">time,</span> he <span class=\"wl wl-kjv\" data-code=\"H14\">would</span> not <span class=\"wl wl-kjv\" data-code=\"H935\">come.</span>","30":"Therefore he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto his <span class=\"wl wl-kjv\" data-code=\"H5650\">servants,</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">See,</span> <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab's</span> <span class=\"wl wl-kjv\" data-code=\"H2513\">field</span> is <span class=\"wl wl-kjv\" data-code=\"H413\">near</span> <span class=\"wl wl-kjv\" data-code=\"H3027\">mine,</span> and he hath <span class=\"wl wl-kjv\" data-code=\"H8184\">barley</span> there; <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> and <span class=\"wl wl-kjv\" data-code=\"H3341\">set</span> it on <span class=\"wl wl-kjv\" data-code=\"H784\">fire.</span> And <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom's</span> <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> <span class=\"wl wl-kjv\" data-code=\"H3341\">set</span> the <span class=\"wl wl-kjv\" data-code=\"H2513\">field</span> on <span class=\"wl wl-kjv\" data-code=\"H784\">fire.</span>","31":"Then <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab</span> <span class=\"wl wl-kjv\" data-code=\"H6965\">arose,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom</span> unto his <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, Wherefore have thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> <span class=\"wl wl-kjv\" data-code=\"H3341\">set</span> my <span class=\"wl wl-kjv\" data-code=\"H2513\">field</span> on <span class=\"wl wl-kjv\" data-code=\"H784\">fire?</span>","32":"And <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom</span> <span class=\"wl wl-kjv\" data-code=\"H559\">answered</span> <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab,</span> Behold, I <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> unto thee, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H935\">Come</span> hither, that I may <span class=\"wl wl-kjv\" data-code=\"H7971\">send</span> thee to the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> to <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> Wherefore am I <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> from <span class=\"wl wl-kjv\" data-code=\"H1650\">Geshur?</span> it had been <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> for me to have been there still: now therefore let me <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">face;</span> and if there <span class=\"wl wl-kjv\" data-code=\"H3426\">be</span> any <span class=\"wl wl-kjv\" data-code=\"H5771\">iniquity</span> in me, let him <span class=\"wl wl-kjv\" data-code=\"H4191\">kill</span> me.","33":"So <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> and <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> him: and when he had <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> for <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom,</span> he <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> and <span class=\"wl wl-kjv\" data-code=\"H7812\">bowed</span> himself on his <span class=\"wl wl-kjv\" data-code=\"H639\">face</span> to the <span class=\"wl wl-kjv\" data-code=\"H776\">ground</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king:</span> and the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H5401\">kissed</span> <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom.</span>"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"hart","tekst":"Dat zijn hart alzo over hem hing, dat hij hem gaarne zou zien wedergehaald, maar dat het hem ontbreken mocht aan bekwame gelegenheid of een eerlijk voorwendsel, zo bedenkt hij een behendig middel daartoe, hetwelk in het volgende verhaald wordt."}],"2":[{"catchword":"Thekóa,","tekst":"Een stadje, gelegen op een berg, aan de noordelijke grenzen van Juda, niet ver van Jeruzalem. Zie 2Ch 11:6."},{"catchword":"wijze vrouw;","tekst":"Vergelijk boven, 2Sa 13:3."},{"catchword":"olie,","tekst":"Zie Rth 3:3."}],"3":[{"catchword":"legde","tekst":"Dat is, zeide haar voor, zoals zij tot den koning nazeggen zou. Vergelijk Exo 4:15."}],"4":[{"catchword":"aangezicht ter aarde was gevallen,","tekst":"Tot een teken van ootmoedigen eerbied, gelijk Rth 2:10; 1Sa 20:41, en 1Sa 25:23-24, onder 2Sa 22; 1Ki 18:7, enz."},{"catchword":"nedergebogen had,","tekst":"Zie Gen 18:2."},{"catchword":"Behoud, o koning","tekst":"Of, verlos, schaf heil."}],"6":[{"catchword":"scheider tussen hen;","tekst":"Redder of verlosser. Derhalve kon ook niemand van de gelegenheid der misdaad getuigen. Zie Deu 19:15, enz."}],"7":[{"catchword":"geslacht","tekst":"Om het recht van bloedwraak tegen den doodslager uit te voeren. Zie Num 35:19; Deu 19:12."},{"catchword":"ziel","tekst":"Dat is, het leven, of de persoon."},{"catchword":"kool,","tekst":"Dat is, mijn enigen overigen zoon doden, door welken het geslacht zou kunnen worden voortgeplant en bewaard, gelijk van een kool een vuur kan gemaakt en bewaard worden."},{"catchword":"naam","tekst":"Dewijl deze zoon alleen zijns vaders naam zou dragen en erfgenaam zijn. Zie Deu 25:6; Rth 4:5, Rth 4:10."},{"catchword":"laten","tekst":"Hebreeuws, stellen."}],"8":[{"catchword":"voor u gebieden","tekst":"Over u, of, om u, u aangaande. De zin is: Ik zal bevel geven dat uw zoon geen leed geschiede. Of, [gelijk sommigen] ik zal de zaak doen onderzoeken door rechters."}],"9":[{"catchword":"ongerechtigheid","tekst":"Indien er enige mocht zijn in dit uw vonnis, die neem ik op mij, als verzekerd zijnde van mijns zoons onschuld, of de billijkheid uwer sententie."}],"10":[{"catchword":"voortaan niet meer aantasten","tekst":"Hebreeuws, niet toedoen, of, voortvaren om u aan te roeren, dat is, u te kwellen, lastig te vallen."}],"11":[{"catchword":"HEERE,","tekst":"Het schijnt dat zij ziet op de wet van God gegeven, Num 35:11-12. Sommigen verstaan dat zij door deze woorden van den koning een eed verzoekt. Anderen dat zij ziet op het exempel van Kaïn den broedermoorder, welken God verschoond heeft."},{"catchword":"uw God,","tekst":"Dat is, zijnen."},{"catchword":"vele worden om te verderven,","tekst":"De zin is: Dewijl er veel bloedverwanten en veel bloedwrekers zijn, zo nodig zijn dat de koning niet één alleen, maar allen bevel geve, anders zou lichtelijk de een of de ander, geen bevel hebbende, mijn zoon mogen doden."},{"catchword":"Zo waarachtig als","tekst":"Versta hierop: Zal ik ook doen wat ik gezegd heb."},{"catchword":"indien er een","tekst":"Versta hierop: Zo doe mij God dt en dat. Zie van zulk eedzweren Gen 14:23."},{"catchword":"de haren uws zoons","tekst":"Dat is, ik zal beschikken dat uw zoon in het minste niet zal beschadigd worden. Zie 1Sa 14:45; 1Ki 1:52; Act 27:34, en vergelijk Mat 10:30."}],"13":[{"catchword":"alzulks","tekst":"Te weten, dat gij in uw vonnis terstond veroordeeld hebt, als onbillijk en onbetamelijk zijnde."},{"catchword":"volk gedaan?","tekst":"Dat naar Absaloms wederkomst verlangt, opdat hij in zijns ouden vaders plaats tot hun best zou mogen regeren."},{"catchword":"dit woord gesproken heeft,","tekst":"Dat is, de voorgaande sententie over de zaak mijns zoons."},{"catchword":"verstotene","tekst":"Namelijk, Absalom, wiens zaak, zij wil zeggen, gelijk te zijn met de zaak van haar zoon; hoewel er groot onderscheid tussen was, dewijl Absalom zijn broeder niet in het gevecht of onverhoeds, maar verradelijk had doen vermoorden. Zie boven, 2Sa 13:28."}],"14":[{"catchword":"den dood sterven,","tekst":"Hebreeuws, stervende sterven; te weten, indien Absalom niet wederkomt. Anderen verstaan deze en de volgende woorden van den natuurlijken dood, alsof zij zeide: Verhaast toch Absaloms dood niet, hij zal toch vroeg genoeg sterven, gelijk wij allen eens moeten sterven, en staan niet op vóór den jongsten dag."},{"catchword":"niet verzameld wordt","tekst":"Dat is, niet weder kan bijeengebracht worden, als het op aarde weggegoten is."},{"catchword":"God dan","tekst":"Om zijns volks wil, opdat wij niet, van Absalom beroofd zijnde, na uw dood, zonder hoofd en beschermer zouden zijn en een roof onzer vijanden worden."},{"catchword":"ziel niet wegnemen,","tekst":"Of, heeft [zijne] ziel niet weggenomen; dat is, het leven van Absalom. Anders, en God zal geen persoon aannemen; te weten, dat iemand den dood zou ontgaan."},{"catchword":"gedachten denken,","tekst":"Dat is, en hij [te weten, de koning] zal gedachten denken, enz. middel beschikken, verschaffen, de zaak daarheen richten. Versta, opdat na zijn dood het rijk van een navolger moge voorzien zijn."},{"catchword":"verstotene","tekst":"Absalom."},{"catchword":"Zich verstote","tekst":"Zodat hij niet weder tot Gods volk zou komen."}],"15":[{"catchword":"volk mij vreesachtig gemaakt heeft;","tekst":"Sprekende dagelijks, gelijk in vs.14 verhaald is, uit vrees dat Absalom wel gans mocht wegblijven."},{"catchword":"zeide uw dienstmaagd","tekst":"Te weten, bij zichzelven, dat is, dacht; alzo vs.17."},{"catchword":"woord zijner dienstmaagd doen","tekst":"Dat is, den raad, voorslag."}],"16":[{"catchword":"redden","tekst":"En dan voorts van gelijken moeten doen aan zijn zoon Absalom, om de gelijkheid dezer beide zaken."},{"catchword":"erve te verdelgen","tekst":"Dat is, uit Gods volk, zijnde hem zo lief als iemand zijn erfdeel wezen kan."}],"17":[{"catchword":"zeide uw dienstmaagd","tekst":"Dat is, dacht, gelijk vs.15."},{"catchword":"woord mijns heren,","tekst":"Dat is, de uitspraak, het vonnis."},{"catchword":"zij toch tot rust;","tekst":"Wensender wijze gesproken. Of, zal nu tot rust zijn; dat is, zal dienen tot troost en gerustheid, niet alleen voor mij en mijn zoon, maar bijgevolg ook voor Absalom, den koning zelf en het ganse volk, dat naar Absalom verlangt."},{"catchword":"gelijk een Engel Gods,","tekst":"Zo wijs als enz. Zie vs.20."},{"catchword":"horen het goede en het kwade;","tekst":"Dat is, om te verstaan, te oordelen wat goed of wat kwaad is. Alzo onder 2Sa 19:27."},{"catchword":"zal met u zijn","tekst":"Of, zij met u."}],"19":[{"catchword":"hand met u","tekst":"Dat is, doet gij dit alles niet door ingeven en beleid van Joab?"},{"catchword":"iemand","tekst":"Anders, indien er ter rechter-of ter linkerhand is af te wijken, enz. Zij wil zeggen: Men zou toch den koning met leugens niet kunnen bedriegen, alzo hij terstond merkt wat van de zaak is."},{"catchword":"mond","tekst":"Gelijk boven, vs.3."}],"20":[{"catchword":"gestalte","tekst":"Hebreeuws, het aangezicht"},{"catchword":"omwenden zou,","tekst":"Eerst spreken van mijn zaak, en des konings vonnis daarvan hebbende, alsdan de zaak wenden en toepassen op Absalom."},{"catchword":"Engel Gods,","tekst":"Gelijk vs.17."},{"catchword":"wat op de aarde is","tekst":"Of, wat in dat land [omgaat]."}],"21":[{"catchword":"ik heb deze zaak gedaan;","tekst":"Dat is, ik heb het verzoek, dat gij door de Thekoietische vrouw mij hebt doen voorstellen, toegestaan; of, gij hebt deze zaak gedaan; dat is, alzo beleid."},{"catchword":"jongeling Absalom weder","tekst":"Hebreeuws, jongen; hoewel hij een man was. Zie van het Hebreeuwse woord Gen 22:5."}],"22":[{"catchword":"dankte den koning;","tekst":"Hebreeuws, zegende"},{"catchword":"uw knecht gemerkt,","tekst":"Dat is, ik."},{"catchword":"woord","tekst":"Dat is, het verzoek, den raad."},{"catchword":"van zijn knecht","tekst":"Anders, uws knechts."}],"23":[{"catchword":"Gesur;","tekst":"Zie boven, 2Sa 3:3, en 2Sa 13:37."}],"24":[{"catchword":"hij in zijn huis kere,","tekst":"Absalom."},{"catchword":"aangezicht niet zie","tekst":"Zie Gen 43:3. Dit diende eensdeels om Absalom te meer in betrachting zijner misdaad op te houden; anderdeels om de ergernis en ongerustheid te vermijden, die bij de vromen en des konings kinderen had mogen ontstaan, indien Absalom terstond in gelijken graad met zijne broeders ware hersteld."}],"26":[{"catchword":"beschoor,","tekst":"Dat is, liet scheren, en alzo in het volgende."},{"catchword":"van elk jaar,","tekst":"Hebreeuws, van dagen tot dagen; dat is, van jaar tot jaar, of elk jaar. Zie Lev 25:29."},{"catchword":"naar des konings gewicht","tekst":"Dat is, naar het gewicht van den gemenen burgerlijken sikkel, en niet den heiligen. Zie Gen 23:16. Hebreeuws, Naar den steen des konings; dat is, naar het koninklijk gewicht. Zie Lev 19:36, en Deu 25:13."}],"28":[{"catchword":"twee volle jaren te Jeruzalem,","tekst":"Hebreeuws, twee jaren der dagen. Zie Gen 41:1."}],"30":[{"catchword":"hij tot zijn knechten","tekst":"Absalom."},{"catchword":"zijde van het mijne,","tekst":"Hebreeuws, aan mijn hand; dat is, zijde. De zin is: aan de zijde van mijn akker."}],"32":[{"catchword":"nu dan,","tekst":"Dit spreekt nu Absalom tot Joab."},{"catchword":"een misdaad in mij,","tekst":"Zo stout spreekt hij, omdat hij des konings goedertierenheid wel wist."}],"33":[{"catchword":"zeide het hem aan","tekst":"Dat hij van Absalom in last had."},{"catchword":"kuste Absalom","tekst":"Tot een teken van volkomen genade en verzoening. Vergelijk Gen 27:26."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Now when Joab the son of Zeruja, perceived, that the Kings heart was toward Absalom, [i.e. That his heart was enclined toward him, that he would sain see him brought back again, but that he might want a fit opportunity, or honest pretence, therefore he plotteth or contriveth a cunning way for it, which is mentioned in the sequel.]"}],"2":[{"catchword":null,"tekst":"Then Joab sent away to Thekoa, [A City lying upon an hill, on the Northen borders of Juda, not far from Jerusalem. See 2 Chron.11.6.] and took thence a wise woman [compare above chap.13.on v.3.] and he said unto her; I pray thee, feign thyself, as if thou didst mourn, and put on now mourning-apparel, and anoint not thy self with oil, [see Ruth 3.on verse 3.] and be as a woman that now hath mourned many days for a dead (person):"}],"3":[{"catchword":null,"tekst":"And go in unto the King, and speak unto him, according to this word: and Joab put the words into her mouth [i.e. He told her the very words, which she afterwards should utter, or speak to the King. Compare Exod. 4.on v.15.]"}],"4":[{"catchword":null,"tekst":"And the Thekotish woman said unto the King, when she was fallen on her face to the ground, [In token of humble reverence; as Ruth 2.10. 1 Sam.20.41. & 25.23, 24. Below v 22. 1 King.18.7, etc.] and had bowed her self down: [see Gen.18.on ver.2.] then she said; help [or, deliver, give salvation] O King."}],"5":[{"catchword":null,"tekst":"And the King said unto her, What aileth thee? and she said; Surely, I am a widow woman, and my husband is dead."}],"6":[{"catchword":null,"tekst":"Now thine hand-maid had two sons, and these both strove (together) in the field, and there was no Parter, [Deliverer: and consequently none could witness of the case of the offence was. See Deut.19.15, &c.] between them; so the one smote the other, and killed him."}],"7":[{"catchword":null,"tekst":"And behold, the whole family is risen against thine hand-maid, [To execute the Law of revenge of bloud against the slayer. See Num 35:19. Deut.19.12.] and have said; Deliver here him, that hath smitten his brother, that we may put him to death for the soul [i.e. life, or person] of his brother, whom he hath slain, and destroy the heir also: thus shall they quench my cole that is left, [i.e. put mine onely son that is left to death, whereby the family might be planted and preserved, as from a coal a fire may be raised and preserved] that they may leave [Heb. put] mine husband no name nor remainder upon the earth. [Because this son was onely to bear his fathers name, and to be their heir. See Deu 25:6. Ruth 4.5, 10.]"}],"8":[{"catchword":null,"tekst":"Then said the King unto this woman; Go to thine house, and I will give charge for thee [Over thee, or, about thee, concerning thee. The meaning is, I will give charge, that no hurt come to thy son. Or, (as some would have it) I will cause the matter to be examined by Judges.]"}],"9":[{"catchword":null,"tekst":"And the Thekotish woman said unto the King: My Lord (O) King the iniquity, [If there may be any in this sentence of thine] be on me, [i.e. I take the same upon me, as being assured of my sons innocency, or the equity of thy sentence] and on my fathers house: on the contrary, the King and his throne be guiltless."}],"10":[{"catchword":null,"tekst":"And the King said; If any man speak against thee, then bring him to me, and he shall not touch thee any more. [Heb. not add, or, proceed to touch thee; i.e. To vex thee, trouble thee, molest thee.]"}],"11":[{"catchword":null,"tekst":"And she said, I pray let the King remember the LORD thy [i.e. His] God, [It seemeth, that she looks at the Law given by God, Num 35:11, 12. Some conceive, that by these words she requireth an Oath of the King. Others, that she looketh on the example of Kain that murdered his brother, whom God spread] that the revenge of blood may not be multiplied to destroy, lest they destroy my son: [The meaning is, seeing there be many next Kinsmen and avengers of blood, it would be requisite, that the King should not onely give charge to one, but to all: Otherwise one or other having received no charge to the contrary, might easily slay my son] then said he; (As true as) the LORD liveth. [Understand withal; I which also do that which I have said] If there shall one of the hairs of thy son fall on the earth. [Understand withal: Then let God do this and that to me. See of such kind of Oath, Gen.14.on ver.23. The meaning of the words is this, as if David had said, I will take order, that thy son shall not be damnified in the least. See 1 Sam.14.45. 1 King.1.52. Act.27.34. & compare Mat 10:30.]"}],"12":[{"catchword":null,"tekst":"Then said this woman; I pray let thine handmaid speak one word unto my LORD the King: and he said speak (on.)"}],"13":[{"catchword":null,"tekst":"And the woman said; Wherefore then hast thou thought such a (thing) [viz. Which thou hast but even now condemned in the sentence thou passedst; as being unjust and unbeseeming] against the people of God? [which long for Absaloms return, that he may join for their good in his old fathers stead] for thence, that the King hath spoken this word, [i.e. the former speech or sentence in my sons case] he is a guilty (person), seeing the King doth not fetch back again his banished. [namely, Absalom, whose case (she would say) is like her sons case: although there was great difference between both, in that Absalom had not slain his brother in the fight , nor unawares, but had caused him to be treacherously murdered: see above chap.13.28.]"}],"14":[{"catchword":null,"tekst":"For we shall die the death [Heb. dying die: to wit, if Absalom return not. Others understand this and the words following, of the natural death; as if he had said, Do not hasten Absaloms death, he will yet die soon enough, as all of us must die once, and not rise again till the last day] and be as water, which being poured forth on the ground, is not gathered up again: [i.e. cannot be brought together again, when it is once poured forth on the ground] God then [For his peoples sake, lest being deprived of Absalom, we should after thy death be without an head and Protector, and become a prey unto our enemies] will not take away the soul, [or, hath not taken away (his) soul; i.e. Absaloms life. Oth. and God will not accept any person; viz. that any man should avoid death] but he will think thoughts, [i.e. and he (to wit, the King) will think thoughts, &c. devise, or find out means, order the matter, meaning, so as that after his death the Kingdom may be provided of a successor] so as not to expel the expelled [viz. Absalom] from him. [so that he should not return to Gods people.]"}],"15":[{"catchword":null,"tekst":"Now then, that I am come, to speak this word unto my Lord the King (is) because the people [Speaking daily in the former verse is related, for fear that Absalom should tarry quite away] made me afraid: so thine hand-maid said; [viz. by her self; i.e. thought: so ver.17.] // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}

document.addEventListener('click', e => {

  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);

function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;

function paneelInhoud(n, tab) {
