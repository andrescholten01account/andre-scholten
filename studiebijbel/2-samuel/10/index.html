ard half af, en sneed hun kleren half af, tot aan hun billen; en hij liet hen gaan.","5":"Toen zij dit David lieten weten, zond hij hun tegemoet; want deze mannen waren zeer beschaamd. En de koning zei: Blijf te Jericho, totdat uw baard weer gegroeid is, kom dan terug.","6":"Toen nu de kinderen Ammons zagen, dat zij zich bij David stinkend gemaakt hadden, zonden de kinderen Ammons heen, en huurden van de Syriërs van Beth-Rechob, en van de Syriërs van Zoba, twintigduizend man van het voetvolk, en van de koning van Maächa duizend man, en van de mannen van Tob twaalfduizend man.","7":"Toen David dit hoorde, zond hij Joab heen, met heel het leger van de helden.","8":"En de kinderen Ammons trokken uit, en stelden de slagorde op voor de ingang van de poort; maar de Syriërs van Zoba, en Rechob, en de mannen van Tob en Maächa waren afzonderlijk in het veld.","9":"Toen Joab nu zag, dat de spits van de slagorde tegen hem was, van voren en van achteren, koos hij uit alle uitgelezen mannen van Israël, en stelde hen in slagorde op tegen de Syriërs;","10":"En het overige van het volk gaf hij onder de hand van zijn broer Abisaï, die het in slagorde opstelde tegen de kinderen Ammons.","11":"En hij zei: Als de Syriërs mij te sterk zullen zijn, zult u mij komen verlossen; en als de kinderen Ammons u te sterk zullen zijn, zal ik komen om u te verlossen.","12":"Wees sterk, en laten wij sterk zijn voor ons volk, en voor de steden van onze God; de HEERE nu doet, wat goed is in Zijn ogen.","13":"Toen naderde Joab, en het volk dat bij hem was, tot de strijd tegen de Syriërs; en zij vluchtten voor zijn aangezicht.","14":"Toen de kinderen Ammons zagen, dat de Syriërs vluchtten, vluchtten zij ook voor het aangezicht van Abisaï, en kwamen in de stad. En Joab keerde terug van de kinderen Ammons, en kwam te Jeruzalem.","15":"Toen nu de Syriërs zagen, dat zij voor Israëls aangezicht geslagen waren, verzamelden zij zich *weer* samen.","16":"En Hadad-Ezer zond heen, en liet de Syriërs uitkomen, die aan de overzijde van de rivier zijn, en zij kwamen te Helam; en Sobach, Hadad-Ezers legeraanvoerder, *trok* voor hun aangezicht heen.","17":"Toen dat aan David werd bekendgemaakt, verzamelde hij heel Israël, en trok over de Jordaan, en kwam te Helam, en de Syriërs stelden *de slagorde* op tegen David, en streden met hem.","18":"Maar de Syriërs vluchtten voor Israëls aangezicht, en David versloeg van de Syriërs zevenhonderd wagens, en veertigduizend ruiters; daartoe sloeg hij Sobach, hun legeraanvoerder, zodat hij daar stierf.","19":"Toen nu alle koningen die knechten van Hadad-Ezer waren, zagen dat zij voor Israëls aangezicht geslagen waren, sloten zij vrede met Israël, en dienden hen; en de Syriërs vreesden de kinderen Ammons niet meer te verlossen."},"SV":{"1":"En het geschiedde daarna, dat de koning der kinderen Ammons stierf, en zijn zoon Hanun werd koning in zijn plaats.","2":"Toen zeide David: Ik zal weldadigheid doen aan Hanun, den zoon van Nahas, gelijk als zijn vader weldadigheid aan mij gedaan heeft. Zo zond David heen, om hem door den dienst zijner knechten te troosten over zijn vader. En de knechten van David kwamen in het land van de kinderen Ammons.","3":"Toen zeiden de vorsten der kinderen Ammons tot hun heer Hanun: Eert David uw vader in uw ogen, omdat hij troosters tot u gezonden heeft? Heeft David zijn knechten niet daarom tot u gezonden, dat hij deze stad doorzoeke, en die verspiede, en die omkere?","4":"Toen nam Hanun Davids knechten, en schoor hun baard half af, en sneed hun klederen half af, tot aan hun billen; en hij liet hen gaan.","5":"Als zij dit David lieten weten, zo zond hij hun tegemoet; want deze mannen waren zeer beschaamd. En de koning zeide: Blijft te Jericho, totdat uw baard weder gewassen zal zijn, komt dan weder.","6":"Toen nu de kinderen Ammons zagen, dat zij zich bij David stinkende gemaakt hadden, zonden de kinderen Ammons heen, en huurden van de Syriërs van Beth-rechob, en van de Syriërs van Zoba, twintig duizend voetvolks, en van den koning van Maacha duizend man, en van de mannen van Tob twaalf duizend man.","7":"Als David dit hoorde, zond hij Joab heen, en het ganse heir met de helden.","8":"En de kinderen Ammons togen uit, en stelden de slagorde voor de deur der poort; maar de Syriërs van Zoba, en Rechob, en de mannen van Tob en Maacha waren bijzonder in het veld.","9":"Als nu Joab zag, dat de spits der slagorde tegen hem was, van voren en van achteren, zo verkoos hij uit alle uitgelezenen van Israël, en stelde hen in orde tegen de Syriërs aan;","10":"En het overige des volks gaf hij onder de hand van zijn broeder Abisai, die het in orde stelde tegen de kinderen Ammons aan.","11":"En hij zeide: Zo de Syriërs mij te sterk zullen zijn, zo zult gij mij komen verlossen; en zo de kinderen Ammons u te sterk zullen zijn, zo zal ik komen om u te verlossen.","12":"Wees sterk, en laat ons sterk zijn voor ons volk, en voor de steden onzes Gods; de HEERE nu doe, wat goed is in Zijn ogen.","13":"Toen naderde Joab, en het volk, dat bij hem was, tot den strijd tegen de Syriërs; en zij vloden voor zijn aangezicht.","14":"Als de kinderen Ammons zagen, dat de Syriërs vloden, vloden zij ook voor het aangezicht van Abisai, en kwamen in de stad. En Joab keerde weder van de kinderen Ammons, en kwam te Jeruzalem.","15":"Toen nu de Syriërs zagen, dat zij voor Israëls aangezicht geslagen waren, zo vergaderden zij zich *weder* te zamen.","16":"En Hadad-ezer zond heen, en deed de Syriërs uitkomen, die op gene zijde der rivier zijn, en zij kwamen te Helam; en Sobach, Hadad-ezers krijgsoverste, *toog* voor hun aangezicht heen.","17":"Als dat David werd aangezegd, verzamelde hij gans Israël, en toog over de Jordaan, en kwam te Helam, en de Syriërs stelden *de* *slagorde* tegen David aan, en streden met hem.","18":"Maar de Syriërs vloden voor Israëls aangezicht, en David versloeg van de Syriërs zevenhonderd wagenen, en veertig duizend ruiteren; daartoe sloeg hij Sobach, hun krijgsoverste, dat hij aldaar stierf.","19":"Toen nu al de koningen, die Hadad-ezers knechten waren, zagen, dat zij voor Israëls aangezicht geslagen waren, maakten zij vrede met Israël, en dienden hen; en de Syriërs vreesden de kinderen Ammons meer te verlossen."},"KJV":{"1":"And it came to pass after this, that the king of the children of Ammon died, and Hanun his son reigned in his stead.","2":"Then said David, I will shew kindness unto Hanun the son of Nahash, as his father shewed kindness unto me. And David sent to comfort him by the hand of his servants for his father. And David's servants came into the land of the children of Ammon.","3":"And the princes of the children of Ammon said unto Hanun their lord, Thinkest thou that David doth honour thy father, that he hath sent comforters unto thee? hath not David rather sent his servants unto thee, to search the city, and to spy it out, and to overthrow it?","4":"Wherefore Hanun took David's servants, and shaved off the one half of their beards, and cut off their garments in the middle, even to their buttocks, and sent them away.","5":"When they told it unto David, he sent to meet them, because the men were greatly ashamed: and the king said, Tarry at Jericho until your beards be grown, and then return.","6":"And when the children of Ammon saw that they stank before David, the children of Ammon sent and hired the Syrians of Bethrehob, and the Syrians of Zoba, twenty thousand footmen, and of king Maacah a thousand men, and of Ishtob twelve thousand men.","7":"And when David heard of it, he sent Joab, and all the host of the mighty men.","8":"And the children of Ammon came out, and put the battle in array at the entering in of the gate: and the Syrians of Zoba, and of Rehob, and Ishtob, and Maacah, were by themselves in the field.","9":"When Joab saw that the front of the battle was against him before and behind, he chose of all the choice men of Israel, and put them in array against the Syrians:","10":"And the rest of the people he delivered into the hand of Abishai his brother, that he might put them in array against the children of Ammon.","11":"And he said, If the Syrians be too strong for me, then thou shalt help me: but if the children of Ammon be too strong for thee, then I will come and help thee.","12":"Be of good courage, and let us play the men for our people, and for the cities of our God: and the LORD do that which seemeth him good.","13":"And Joab drew nigh, and the people that were with him, unto the battle against the Syrians: and they fled before him.","14":"And when the children of Ammon saw that the Syrians were fled, then fled they also before Abishai, and entered into the city. So Joab returned from the children of Ammon, and came to Jerusalem.","15":"And when the Syrians saw that they were smitten before Israel, they gathered themselves together.","16":"And Hadarezer sent, and brought out the Syrians that were beyond the river: and they came to Helam; and Shobach the captain of the host of Hadarezer went before them.","17":"And when it was told David, he gathered ➔ all Israel together, and passed over Jordan, and came to Helam. And the Syrians set themselves in array against David, and fought with him.","18":"And the Syrians fled before Israel; and David slew the men of seven hundred chariots of the Syrians, and forty thousand horsemen, and smote Shobach the captain of their host, who died there.","19":"And when all the kings that were servants to Hadarezer saw that they were smitten before Israel, they made peace with Israel, and served them. So the Syrians feared to help the children of Ammon any more."}},"tsk":{"1":[{"kopje":"koning","refs":["Richt 10:7-9","Richt 11:12-28","1 Sam 11:1-3","1 Kron 19:1-3"]}],"2":[{"kopje":"weldadigheid doen","refs":["Deut 23:3-6","Neh 4:3-7","Neh 13:1-3"]},{"kopje":"Nahas","refs":["1 Sam 11:1"]},{"kopje":"zoals zijn vader","refs":["1 Sam 22:3","1 Sam 22:4"]}],"3":[{"kopje":"niet","refs":["Gen 42:9","Gen 42:16","1 Kor 13:5","1 Kor 13:7"]}],"4":[{"kopje":"en sc v\" data-code=\"H4428\">king</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H5983\">Ammon</span> <span class=\"wl wl-kjv\" data-code=\"H4191\">died,</span> and <span class=\"wl wl-kjv\" data-code=\"H2586\">Hanun</span> his <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> <span class=\"wl wl-kjv\" data-code=\"H4427\">reigned</span> in his stead.","2":"Then <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> I will <span class=\"wl wl-kjv\" data-code=\"H6213\">shew</span> <span class=\"wl wl-kjv\" data-code=\"H2617\">kindness</span> unto <span class=\"wl wl-kjv\" data-code=\"H2586\">Hanun</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H5176\">Nahash,</span> as his <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">shewed</span> <span class=\"wl wl-kjv\" data-code=\"H2617\">kindness</span> unto me. And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> to <span class=\"wl wl-kjv\" data-code=\"H5162\">comfort</span> him by the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of his <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> for his <span class=\"wl wl-kjv\" data-code=\"H1\">father.</span> And <span class=\"wl wl-kjv\" data-code=\"H1732\">David's</span> <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> into the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H5983\">Ammon.</span>","3":"And the <span class=\"wl wl-kjv\" data-code=\"H8269\">princes</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H5983\">Ammon</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H2586\">Hanun</span> their <span class=\"wl wl-kjv\" data-code=\"H113\">lord,</span> <span class=\"wl wl-kjv\" data-code=\"H5869\">Thinkest</span> thou that <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> doth <span class=\"wl wl-kjv\" data-code=\"H3513\">honour</span> thy <span class=\"wl wl-kjv\" data-code=\"H1\">father,</span> that he hath <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> <span class=\"wl wl-kjv\" data-code=\"H5162\">comforters</span> unto thee? hath not <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> rather <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> his <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> unto thee, <span class=\"wl wl-kjv\" data-code=\"H5668\">to</span> <span class=\"wl wl-kjv\" data-code=\"H2713\">search</span> the <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> and to spy it <span class=\"wl wl-kjv\" data-code=\"H7270\">out,</span> and to <span class=\"wl wl-kjv\" data-code=\"H2015\">overthrow</span> it?","4":"Wherefore <span class=\"wl wl-kjv\" data-code=\"H2586\">Hanun</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David's</span> <span class=\"wl wl-kjv\" data-code=\"H5650\">servants,</span> and shaved <span class=\"wl wl-kjv\" data-code=\"H1548\">off</span> the one <span class=\"wl wl-kjv\" data-code=\"H2677\">half</span> of their <span class=\"wl wl-kjv\" data-code=\"H2206\">beards,</span> and cut <span class=\"wl wl-kjv\" data-code=\"H3772\">off</span> their <span class=\"wl wl-kjv\" data-code=\"H4063\">garments</span> in the <span class=\"wl wl-kjv\" data-code=\"H2677\">middle,</span> even to their <span class=\"wl wl-kjv\" data-code=\"H8357\">buttocks,</span> and sent them <span class=\"wl wl-kjv\" data-code=\"H7971\">away.</span>","5":"When they <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> it unto <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> he <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> to <span class=\"wl wl-kjv\" data-code=\"H7125\">meet</span> them, because the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> were <span class=\"wl wl-kjv\" data-code=\"H3966\">greatly</span> <span class=\"wl wl-kjv\" data-code=\"H3637\">ashamed:</span> and the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H3427\">Tarry</span> at <span class=\"wl wl-kjv\" data-code=\"H3405\">Jericho</span> until your <span class=\"wl wl-kjv\" data-code=\"H2206\">beards</span> be <span class=\"wl wl-kjv\" data-code=\"H6779\">grown,</span> and then <span class=\"wl wl-kjv\" data-code=\"H7725\">return.</span>","6":"And when the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H5983\">Ammon</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> that they <span class=\"wl wl-kjv\" data-code=\"H887\">stank</span> before <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H5983\">Ammon</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> and <span class=\"wl wl-kjv\" data-code=\"H7936\">hired</span> the <span class=\"wl wl-kjv\" data-code=\"H758\">Syrians</span> of <span class=\"wl wl-kjv\" data-code=\"H1050\">Bethrehob,</span> and the <span class=\"wl wl-kjv\" data-code=\"H758\">Syrians</span> of <span class=\"wl wl-kjv\" data-code=\"H6678\">Zoba,</span> <span class=\"wl wl-kjv\" data-code=\"H6242\">twenty</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> <span class=\"wl wl-kjv\" data-code=\"H7273\">footmen,</span> and of <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\ tle</span> was against him <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> and <span class=\"wl wl-kjv\" data-code=\"H268\">behind,</span> he <span class=\"wl wl-kjv\" data-code=\"H977\">chose</span> of all the <span class=\"wl wl-kjv\" data-code=\"H977\">choice</span> men of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> and put them in <span class=\"wl wl-kjv\" data-code=\"H6186\">array</span> <span class=\"wl wl-kjv\" data-code=\"H7125\">against</span> the <span class=\"wl wl-kjv\" data-code=\"H758\">Syrians:</span>","10":"And the <span class=\"wl wl-kjv\" data-code=\"H3499\">rest</span> of the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> he <span class=\"wl wl-kjv\" data-code=\"H5414\">delivered</span> into the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of <span class=\"wl wl-kjv\" data-code=\"H52\">Abishai</span> his <span class=\"wl wl-kjv\" data-code=\"H251\">brother,</span> that he might put them in <span class=\"wl wl-kjv\" data-code=\"H6186\">array</span> <span class=\"wl wl-kjv\" data-code=\"H7125\">against</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H5983\">Ammon.</span>","11":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> If the <span class=\"wl wl-kjv\" data-code=\"H758\">Syrians</span> be too <span class=\"wl wl-kjv\" data-code=\"H2388\">strong</span> for me, then thou shalt <span class=\"wl wl-kjv\" data-code=\"H3444\">help</span> me: but if the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H5983\">Ammon</span> be too <span class=\"wl wl-kjv\" data-code=\"H2388\">strong</span> for thee, then I will <span class=\"wl wl-kjv\" data-code=\"H1980\">come</span> and <span class=\"wl wl-kjv\" data-code=\"H3467\">help</span> thee.","12":"Be of good <span class=\"wl wl-kjv\" data-code=\"H2388\">courage,</span> and let us play the <span class=\"wl wl-kjv\" data-c purpose: see of such kind of questions, Judg.4.on ver.6.]"}],"4":[{"catchword":null,"tekst":"Then Hanun took David&acirc;&euro;&trade;s servants, and shaved their beard half off, [Heb. The moiety, or, one half of their beard] and cut their garments half off, [or, through the half, or, midst] unto their buttocks, and he let them go."}],"5":[{"catchword":null,"tekst":"When they let David know this, then he sent to meet them; for these men were greatly ashamed: and the King said; Tarry at Jericho, [Meaning the place, or there abouts, where Jericho had formerly been built: for Jericho was not built up again till Ahabs time, 1 King 9.24.] until your beard shall be grown, [Heb. shall grow, bud forth. A compassion taken from herbs and trees, that sprout forth, green, bud, blossom] then return."}],"6":[{"catchword":null,"tekst":"Now when the children of Ammon saw, that they had made themselves stick [See Gen.34.on ver.30.] with David, the children of Ammon sent forth, and nired [viz. To serve them as souldiers in this war. This is the first History in the holy Scripture, wherein we read of mercenary souldiers that were hired for money, to serve other Lords and Masters in the Wars] of the Syrians [see above chap.8.on verse 5.] of Beth-Rechob, and of the Syrians of Zoba, twenty thousand foot-men, and of the King of Maacha a thousand men, and of the men of Tob [see Judg, 11.on verse 3.] twelve thousand men."}],"7":[{"catchword":null,"tekst":"When David heard this, he sent Joab forth, and all the Host, with the Champions, [See of David&acirc;&euro;&trade;s Champions, or Worthies, below chap.23.8, &c.]"}],"8":[{"catchword":null,"tekst":"And the children of Ammon marched forth, and put the Battalias before the door of gate: [Of the City Medela, see 1 Chron.19.7. This they likewise did to secure the City, and (if need were) to retire in thither: (below verse 14.) leaving the succour by themselves apart in the field, to set upon Joab on the other side] but the Syrians of Zoba, and Rechob, and the men of Tob, and Maacha, they were by themselves in the field."}],"9":[{"catchword":null,"tekst":"Now when Joab saw that the field [Heb. face] of the Battle-aray was against him, before and behind, then he chose out of all the choices (men) of Israel, and put them in aray against the Syrians: [Heb. in the meeting of Syria: and so in the following verses, 10, 17.]"}],"10":[{"catchword":null,"tekst":"And the rest of the people the gave under the hand of Abisai his brother, who put them in aray against the children of Ammon."}],"11":[{"catchword":null,"tekst":"And he said; if the Syrians shall be too strong for me; then thou shalt come to deliver me, [Heb. be a Deliverer] and if the children of Ammon shall be too strong for thee, then will I come to deliver thee."}],"12":[{"catchword":null,"tekst":"Be strong, [i.e. Be of good courage, and play the men] and let us strong for our people, and for the cities of our God: now the LORD do [or, will do that which is good in his eyes. [that which pleaseth him.]"}],"13":[{"catchword":null,"tekst":"Then Joab drew nigh, and the people that were with him, unto the battle against the Syrians: and they fled before his face."}],"14":[{"catchword":null,"tekst":"When the children of Ammon saw that the Syrians fled, they fled also before the face of Abisai, and came into the city: and Joab returned from the children of Ammon; and came to Jerusalem."}],"15":[{"catchword":null,"tekst":"Now when the Syrians saw that they were smitten before the face of Israel, then gathered themselves (again) together."}],"16":[{"catchword":null,"tekst":"And Hadarezer sent forth, and caused the Syrians to come out, that are on the other side of the River, [viz. Euphrates] and they came to Helam: [Heb. Ghelam, This place is no where mentioned in the Holy Scripture, but in this History] and Sobach, [called also Schophach, 2 Chron.19 16.] Hadarezers Commander in chief, (marched) along before their face."}],"17":[{"catchword":null,"tekst":"When that was told David, he gathered all Israel together, and went over the Jordan, and came to Helam: and the Syrians put (the battle-aray) against David, [Heb. in the meeting, etc, as above vers.9.10] and fought with him."}],"18":[{"catchword":null,"tekst":"But the Syrians fled before the face of Israel, and David slew [Heb. smote dead] of the Syrians seven hundred charets [understand with their horse-men, which sought from the charets, on which they were carried. And hereby may be understood sevenhundred troops or companies of horse-men, each troop or company on a charet, consisting of ten horse-men, which make together seven thousand. Which number is expressly set down, 1 Chron.19.18. See above chap.8.on v.4.] and fourty thousand horse-men: [for this is put, 1 Chron.19.18. foot-men, or foot: which may be thus compared, that besides the asore-mentioned cahrets and horse-men, the great part of the army, both horse and foot were slain, so that here the number of horse, and 1 Chron. Chap.19. a like number of foot is mentioned, that these nations were wont to go forth to battle with huge multitudes, (as also David himself therefore went forth with all Israel) is clear and evident by the Holy Scripture. Others understand in this place seven hundred great and eminent charets, and the whole number of charets together, both great and small, to be seven thousand, 1 Chron.19.18.] Besides, he smote Sobach, their Commander in chief, that he died there."}],"19":[{"catchword":null,"tekst":"Now when all the Kings that were Hadarezers servants [i.e. which were subjects to him, or under his protection, or which ha had used for his service in this Israel, they made peace with Israel, and served them: [i.e. were subject and obedient unto them. Compare 1 Sam.4.9. and elsewhere often] and the Syrians were afraid to deliver [i.e. to assist, aid, help, succour, come to deliver] the children of anymore."}]}}};

function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));

  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  // slug -> volledige boeknaam (voor citaten met de volle boeknaam i.p.v. de afkorting)
  const boeknaamPerSlug = {};
  (D.meta.boeken || []).forEach(b => {
    const m = b.href.match(/^\.\.\/\.\.\/([^/]+)\//);
    if (m) boeknaamPerSlug[m[1]] = b.naam;
  });
  // dubbele rechtsklik (binnen 500ms, zelfde verwijzing) kopieert het vers
  // i.p.v. de vertalingen-popup te tonen (enkele rechtsklik blijft bestaand gedrag)
  function kopieerVerwijzing(chip, ref) {
    haalVert('versteksten', ref).then(data => {
      const tekst = data && data[ref.vers];
      if (!tekst) return;
      const url = location.origin + '/studiebijbel/' + ref.slug + '/' + ref.hfd + '#v' + ref.vers;
      const naam = boeknaamPerSlug[ref.slug] || chip.textContent.replace(/\s+\d+:\d+.*$/, '');
      const kopie = tekst.replace(/\*/g, '') + `\n~ [${naam} ${ref.hfd}:${ref.vers}](${url})`;
      navigator.clipboard.writeText(kopie).then(() => {
        toast.classList.add('zichtbaar');
        setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
      });
    });
  }
  let laatsteRechtsklik = { sleutel: null, tijd: 0 };
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    const sleutel = chip.dataset.ref;
    const nu = Date.now();
    const isDubbelklik = laatsteRechtsklik.sleutel === sleutel && (nu - laatsteRechtsklik.tijd) < 500;
    laatsteRechtsklik = isDubbelklik ? { sleutel: null, tijd: 0 } : { sleutel, tijd: nu };
    if (isDubbelklik) {
      popup.style.display = 'none';
      vpopup.style.display = 'none';
      kopieerVerwijzing(chip, ref);
      return;
    }
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
<script src="/studiebijbel/zoekbalk.js"></script></body>
</html>
