oals zijn vader weldadigheid aan mij gedaan heeft. Zo zond David heen, om hem door de dienst van zijn knechten te troosten over zijn vader. En de knechten van David kwamen in het land van de kinderen Ammons.", "3": "Toen zeiden de vorsten van de kinderen Ammons tegen hun heer Hanun: Eert u David uw vader in uw ogen, omdat hij troosters tot u gezonden heeft? Heeft David zijn knechten niet daarom tot u gezonden, dat hij deze stad doorzoekt, en die verspiedt, en die omkeert?", "4": "Toen nam Hanun Davids knechten, en schoor hun baard half af, en sneed hun kleren half af, tot aan hun billen; en hij liet hen gaan.", "5": "Toen zij dit David lieten weten, zond hij hun tegemoet; want deze mannen waren zeer beschaamd. En de koning zei: Blijf te Jericho, totdat uw baard weer gegroeid is, kom dan terug.", "6": "Toen nu de kinderen Ammons zagen, dat zij zich bij David stinkend gemaakt hadden, zonden de kinderen Ammons heen, en huurden van de Syriërs van Beth-Rechob, en van de Syriërs van Zoba, twintigduizend man van het voetvolk, en van de koning van Maächa duizend man, en van de mannen van Tob twaalfduizend man.", "7": "Toen David dit hoorde, zond hij Joab heen, met heel het leger van de helden.", "8": "En de kinderen Ammons trokken uit, en stelden de slagorde op voor de ingang van de poort; maar de Syriërs van Zoba, en Rechob, en de mannen van Tob en Maächa waren afzonderlijk in het veld.", "9": "Toen Joab nu zag, dat de spits van de slagorde tegen hem was, van voren en van achteren, koos hij uit alle uitgelezen mannen van Israël, en stelde hen in slagorde op tegen de Syriërs;", "10": "En het overige van het volk gaf hij onder de hand van zijn broer Abisaï, die het in slagorde opstelde tegen de kinderen Ammons.", "11": "En hij zei: Als de Syriërs mij te sterk zullen zijn, zult u mij komen verlossen; en als de kinderen Ammons u te sterk zullen zijn, zal ik komen om u te verlossen.", "12": "Wees sterk, en laten wij sterk zijn voor ons volk, en voor de steden van onze God; de HEERE nu doet, wat goed is in Zijn ogen.", "13": "Toen naderde Joab, en het volk dat bij hem was, tot de strijd tegen de Syriërs; en zij vluchtten voor zijn aangezicht.", "14": "Toen de kinderen Ammons zagen, dat de Syriërs vluchtten, vluchtten zij ook voor het aangezicht van Abisaï, en kwamen in de stad. En Joab keerde terug van de kinderen Ammons, en kwam te Jeruzalem.", "15": "Toen nu de Syriërs zagen, dat zij voor Israëls aangezicht geslagen waren, verzamelden zij zich *weer* samen.", "16": "En Hadad-Ezer zond heen, en liet de Syriërs uitkomen, die aan de overzijde van de rivier zijn, en zij kwamen te Helam; en Sobach, Hadad-Ezers legeraanvoerder, *trok* voor hun aangezicht heen.", "17": "Toen dat aan David werd bekendgemaakt, verzamelde hij heel Israël, en trok over de Jordaan, en kwam te Helam, en de Syriërs stelden *de slagorde* op tegen David, en streden met hem.", "18": "Maar de Syriërs vluchtten voor Israëls aangezicht, en David versloeg van de Syriërs zevenhonderd wagens, en veertigduizend ruiters; daartoe sloeg hij Sobach, hun legeraanvoerder, zodat hij daar stierf.", "19": "Toen nu alle koningen die knechten van Hadad-Ezer waren, zagen dat zij voor Israëls aangezicht geslagen waren, sloten zij vrede met Israël, en dienden hen; en de Syriërs vreesden de kinderen Ammons niet meer te verlossen."}, "SV": {"1": "En het geschiedde daarna, dat de koning der kinderen Ammons stierf, en zijn zoon Hanun werd koning in zijn plaats.", "2": "Toen zeide David: Ik zal weldadigheid doen aan Hanun, den zoon van Nahas, gelijk als zijn vader weldadigheid aan mij gedaan heeft. Zo zond David heen, om hem door den dienst zijner knechten te troosten over zijn vader. En de knechten van David kwamen in het land van de kinderen Ammons.", "3": "Toen zeiden de vorsten der kinderen Ammons tot hun heer Hanun: Eert David uw vader in uw ogen, omdat hij troosters tot u gezonden heeft? Heeft David zijn knechten niet daarom tot u gezonden, dat hij deze stad doorzoeke, en die verspiede, en die omkere?", "4": "Toen nam Hanun Davids knechten, en schoor hun baard half af, en sneed hun klederen half af, tot aan hun billen; en hij liet hen gaan.", "5": "Als zij dit David lieten weten, zo zond hij hun tegemoet; want deze mannen waren zeer beschaamd. En de koning zeide: Blijft te Jericho, totdat uw baard weder gewassen zal zijn, komt dan weder.", "6": "Toen nu de kinderen Ammons zagen, dat zij zich bij David stinkende gemaakt hadden, zonden de kinderen Ammons heen, en huurden van de Syriërs van Beth-rechob, en van de Syriërs van Zoba, twintig duizend voetvolks, en van den koning van Maacha duizend man, en van de mannen van Tob twaalf duizend man.", "7": "Als David dit hoorde, zond hij Joab heen, en het ganse heir met de helden.", "8": "En de kinderen Ammons togen uit, en stelden de slagorde voor de deur der poort; maar de Syriërs van Zoba, en Rechob, en de mannen van Tob en Maacha waren bijzonder in het veld.", "9": "Als nu Joab zag, dat de spits der slagorde tegen hem was, van voren en van achteren, zo verkoos hij uit alle uitgelezenen van Israël, en stelde hen in orde tegen de Syriërs aan;", "10": "En het overige des volks gaf hij onder de hand van zijn broeder Abisai, die het in orde stelde tegen de kinderen Ammons aan.", "11": "En hij zeide: Zo de Syriërs mij te sterk zullen zijn, zo zult gij mij komen verlossen; en zo de kinderen Ammons u te sterk zullen zijn, zo zal ik komen om u te verlossen.", "12": "Wees sterk, en laat ons sterk zijn voor ons volk, en voor de steden onzes Gods; de HEERE nu doe, wat goed is in Zijn ogen.", "13": "Toen naderde Joab, en het volk, dat bij hem was, tot den strijd tegen de Syriërs; en zij vloden voor zijn aangezicht.", "14": "Als de kinderen Ammons zagen, dat de Syriërs vloden, vloden zij ook voor het aangezicht van Abisai, en kwamen in de stad. En Joab keerde weder van de kinderen Ammons, en kwam te Jeruzalem.", "15": "Toen nu de Syriërs zagen, dat zij voor Israëls aangezicht geslagen waren, zo vergaderden zij zich *weder* te zamen.", "16": "En Hadad-ezer zond heen, en deed de Syriërs uitkomen, die op gene zijde der rivier zijn, en zij kwamen te Helam; en Sobach, Hadad-ezers krijgsoverste, *toog* voor hun aangezicht heen.", "17": "Als dat David werd aangezegd, verzamelde hij gans Israël, en toog over de Jordaan, en kwam te Helam, en de Syriërs stelden *de* *slagorde* tegen David aan, en streden met hem.", "18": "Maar de Syriërs vloden voor Israëls aangezicht, en David versloeg van de Syriërs zevenhonderd wagenen, en veertig duizend ruiteren; daartoe sloeg hij Sobach, hun krijgsoverste, dat hij aldaar stierf.", "19": "Toen nu al de koningen, die Hadad-ezers knechten waren, zagen, dat zij voor Israëls aangezicht geslagen waren, maakten zij vrede met Israël, en dienden hen; en de Syriërs vreesden de kinderen Ammons meer te verlossen."}, "KJV": {"1": "And it came to pass after this, that the king of the children of Ammon died, and Hanun his son reigned in his stead.", "2": "Then said David, I will shew kindness unto Hanun the son of Nahash, as his father shewed kindness unto me. And David sent to comfort him by the hand of his servants for his father. And David's servants came into the land of the children of Ammon.", "3": "And the princes of the children of Ammon said unto Hanun their lord, Thinkest thou that David doth honour thy father, that he hath sent comforters unto thee? hath not David rather sent his servants unto thee, to search the city, and to spy it out, and to overthrow it?", "4": "Wherefore Hanun took David's servants, and shaved off the one half of their beards, and cut off their garments in the middle, even to their buttocks, and sent them away.", "5": "When they told it unto David, he sent to meet them, because the men were greatly ashamed: and the king said, Tarry at Jericho until your beards be grown, and then return.", "6": "And when the children of Ammon saw that they stank before David, the children of Ammon sent and hired the Syrians of Bethrehob, and the Syrians of Zoba, twenty thousand footmen, and of king Maacah a thousand men, and of Ishtob twelve thousand men.", "7": "And when David heard of it, he sent Joab, and all the host of the mighty men.", "8": "And the children of Ammon came out, and put the battle in array at the entering in of the gate: and the Syrians of Zoba, and of Rehob, and Ishtob, and Maacah, were by themselves in the field.", "9": "When Joab saw that the front of the battle was against him before and behind, he chose of all the choice men of Israel, and put them in array against the Syrians:", "10": "And the rest of the people he delivered into the hand of Abishai his brother, that he might put them in array against the children of Ammon.", "11": "And he said, If the Syrians be too strong for me, then thou shalt help me: but if the children of Ammon be too strong for thee, then I will come and help thee.", "12": "Be of good courage, and let us play the men for our people, and for the cities of our God: and the LORD do that which seemeth him good.", "13": "And Joab drew nigh, and the people that were with him, unto the battle against the Syrians: and they fled before him.", "14": "And when the children of Ammon saw that the Syrians were fled, then fled they also before Abishai, and entered into the city. So Joab returned from the children of Ammon, and came to Jerusalem.", "15": "And when the Syrians saw that they were smitten before Israel, they gathered themselves together.", "16": "And Hadarezer sent, and brought out the Syrians that were beyond the river: and they came to Helam; and Shobach the captain of the host of Hadarezer went before them.", "17": "And when it was told David, he gathered ➔ all Israel together, and passed over Jordan, and came to Helam. And the Syrians set themselves in array against David, and fought with him.", "18": "And the Syrians fled before Israel; and David slew the men of seven hundred chariots of the Syrians, and forty thousand horsemen, and smote Shobach the captain of their host, who died there.", "19": "And when all the kings that were servants to Hadarezer saw that they were smitten before Israel, they made peace with Israel, and served them. So the Syrians feared to help the children of Ammon any more."}}, "tsk": {"1": [{"kopje": "koning", "refs": ["Richt 10:7-9", "Richt 11:12-28", "1 Sam 11:1-3", "1 Kron 19:1-3"]}], "2": [{"kopje": "weldadigheid doen", "refs": ["Deut 23:3-6", "Neh 4:3-7", "Neh 13:1-3"]}, {"kopje": "Nahas", "refs": ["1 Sam 11:1"]}, {"kopje": "zoals zijn vader", "refs": ["1 Sam 22:3", "1 Sam 22:4"]}], "3": [{"kopje": "niet", "refs": ["Gen 42:9", "Gen 42:16", "1 Kor 13:5", "1 Kor 13:7"]}], "4": [{"kopje": "en schoor", "refs": ["Lev 19:27", "1 Kron 19:3", "1 Kron 19:4", "Ps 109:4", "Ps 109:5", "Jes 15:2"]}, {"kopje": "sneed af", "refs": ["Jes 20:4", "Jes 47:2", "Jes 47:3", "Jer 41:5"]}], "5": [{"kopje": "Jericho", "refs": ["Joz 6:24-26", "1 Kon 16:34", "1 Kron 19:5"]}], "6": [{"kopje": "stinkend", "refs": ["Gen 34:30", "Ex 5:21", "1 Sam 13:4", "1 Sam 27:12", "1 Kron 19:6", "1 Kron 19:7"]}, {"kopje": "Syriërs van Beth-Rechob", "refs": ["2 Sam 8:3", "2 Sam 8:5", "2 Sam 8:12", "Spr 25:8", "Jes 8:9", "Jes 8:10"]}, {"kopje": "Maächa", "refs": ["Joz 13:11-13"]}, {"kopje": "Tob", "refs": ["Richt 11:3", "Richt 11:5"]}], "7": [{"kopje": "heel het leger van de helden", "refs": ["2 Sam 23:8-39", "1 Kron 19:8-19"]}], "8": [{"kopje": "voor de ingang", "refs": ["1 Kron 19:7"]}, {"kopje": "Rechob", "refs": ["2 Sam 10:6", "Num 13:21", "Joz 19:28", "Richt 1:31"]}], "12": [{"kopje": "Wees sterk", "refs": ["Num 13:20", "Deut 31:6", "Joz 1:6", "Joz 1:7", "Joz 1:9", "Joz 1:18", "1 Sam 14:6", "1 Sam 14:12", "1 Sam 17:32", "2 Kron 32:7", "Neh 4:14", "Hebr 13:6"]}, {"kopje": "laten wij sterk zijn", "refs": ["1 Sam 4:9", "1 Kron 19:13", "1 Kor 16:13"]}, {"kopje": "de HEERE", "refs": ["2 Sam 16:10", "2 Sam 16:11", "Richt 10:15", "1 Sam 3:18", "Job 1:21"]}], "13": [{"kopje": "zij vluchtten", "refs": ["1 Kon 20:13-21", "1 Kon 20:28-30", :3", "svLabel": null}, {"disp": "2 Kron 20:1", "href": "../../2-kronieken/20/#v1", "ref": "2 Kron 20:1", "svLabel": null}, {"disp": "2 Kron 22:5", "href": "../../2-kronieken/22/#v5", "ref": "2 Kron 22:5", "svLabel": null}, {"disp": "2 Kron 28:16", "href": "../../2-kronieken/28/#v16", "ref": "2 Kron 28:16", "svLabel": null}, {"disp": "2 Kron 28:20", "href": "../../2-kronieken/28/#v20", "ref": "2 Kron 28:20", "svLabel": null}, {"disp": "Ps 83:1-12", "href": "../../psalmen/83/#v2", "ref": "Ps 83:2-13", "svLabel": "SV 2"}, {"disp": "Jes 7:1-9", "href": "../../jesaja/7/#v1", "ref": "Jes 7:1-9", "svLabel": null}, {"disp": "Jes 8:9-12", "href": "../../jesaja/8/#v9", "ref": "Jes 8:9-12", "svLabel": null}, {"disp": "Jes 54:15", "href": "../../jesaja/54/#v15", "ref": "Jes 54:15", "svLabel": null}], "kinderen": []}]}]}]}}, "extern": {"Richt 11:3": "Toen vluchtte Jeftha weg van zijn broers, en woonde in het land Tob; en ijdele mannen verzamelden zich bij Jeftha, en trokken met hem uit.", "1 Sam 11:1-3": "Toen trok Nahas, de Ammoniet, op en belegerde Jabes in Gilead. En alle mannen van Jabes zeiden tegen Nahas: Sluit een verbond met ons, en wij zullen u dienen. Maar Nahas, de Ammoniet, zei tegen hen: Op deze voorwaarde zal ik een verbond met u sluiten, dat ik bij u allen het rechteroog uitsteek, en dat ik deze schande op heel Israël leg. Toen zeiden de oudsten van Jabes tegen hem: Geef ons zeven dagen de tijd, zodat wij boden kunnen sturen naar alle grensgebieden van Israël; is er dan niemand die ons verlost, dan zullen wij naar u uitgaan.", "Richt 4:2": "Zo verkocht de HEERE hen in de hand van Jabin, koning van de Kanaänieten, die te Hazor regeerde; en zijn legeraanvoerder was Sisera; hij woonde in Haroseth der heidenen.", "Zach 14:3": "En de HEERE zal uittrekken, en Hij zal strijden tegen die heidenen, zoals ten dage dat Hij gestreden heeft, ten dage van het strijd.", "2 Kron 20:1": "Het gebeurde nu hierna, dat de kinderen van Moab, en de kinderen van Ammon, en met hen anderen naast de Ammonieten, tegen Josafat kwamen om te strijden.", "2 Kron 13:5-16": "Weet u niet dat de HEERE, de God van Israël, het koninkrijk over Israël voor eeuwig aan David gegeven heeft, aan hem en zijn zonen, met een zoutverbond? Toch is Jerobeam, de zoon van Nebat, de knecht van Salomo, de zoon van David, opgestaan en heeft hij tegen zijn heer gerebelleerd. Daarbij hebben zich nietswaardige mannen, kinderen van Belial, bij hem verzameld en zich sterk gemaakt tegen Rehabeam, de zoon van Salomo, toen Rehabeam jong was en teder van hart, zodat hij zich tegen hen niet kon verzetten.", "Richt 10:15": "Maar de Israëlieten zeiden tegen de HEERE: Wij hebben gezondigd; doe met ons naar alles wat goed is in Uw ogen; verlos ons toch alleen op deze dag!", "Joz 1:9": "Heb Ik het u niet bevolen? Wees sterk en heb goede moed, en wees niet bang, en wees niet ontzet; want de HEERE, uw God, is met u overal waar u heengaat.", "Ps 48:6": "Zoals zij het zagen, zo waren zij verwonderd; zij werden verschrikt, zij haastten weg.", "2 Sam 23:8-39": "Dit zijn de namen van de helden die David gehad heeft: Joscheb-Baschebeth, de zoon van Tachkemoni, de voornaamste van de hoofdlieden. Deze was Adino, de Ezniet, die zich stelde tegen achthonderd man, die door hem verslagen werden op één moment. En na hem was Eleazar, de zoon van Dodo, zoon van Ahohi; deze was onder de drie helden met David, toen zij de Filistijnen beschimpten, die daar ten strijde verzameld waren, en de mannen van Israël waren teruggetrokken. Deze stond op en sloeg onder de Filistijnen, totdat zijn hand moe werd, ja, zijn hand aan het zwaard kleefde; en de HEERE bracht een grote overwinning tot stand op die dag; en het volk keerde terug achter hem aan, alleen om te plunderen.", "1 Kron 19:7": "zodat zij zich tweeëndertigduizend wagens huurden; en de koning van Maächa en zijn volk kwamen en legerden zich voor Medeba; ook verzamelden de kinderen van Ammon zich uit hun steden, en zij kwamen ten strijde.", "1 Kron 19:13": "Wees sterk, en laten we sterk zijn voor ons volk, en voor de steden van onze God; de HEERE doe wat goed is in Zijn ogen.", "Spr 25:8": "Ga niet haastig een geschil aan om te twisten, opdat u misschien aan het einde daarvan niet weet wat u moet doen, wanneer uw naaste u beschaamd zou hebben.", "1 Kon 20:13-21": "En zie, een profeet trad naar Achab, de koning van Israël, en zei: Zo zegt de HEERE: Hebt u al deze grote menigte gezien? Zie, Ik zal ze heden in uw hand geven, opdat u weet, dat Ik de HEERE ben. En Achab zei: Door wie? En hij zei: Zo zegt de HEERE: Door de jongens van de leiders van de landschappen. En hij zei: Wie zal de strijd aanbinden? En hij zei: U. Toen telde hij de jongens van de leiders van de landschappen, en zij waren tweehonderdtwee en dertig; en na hen telde hij al het volk, alle kinderen van Israël, zevenduizend.", "Jer 41:5": "Zo kwamen er mannen van Sichem, van Silo, en van Samaria, tachtig man, met de baard afgeschoren, en de kleren gescheurd, en zichzelf gesneden; en spijsoffer en wierook waren in hun hand, om naar het huis van de HEERE te brengen.", "1 Sam 14:6": "Jonathan nu zei tegen de jongen die zijn wapens droeg: Kom, laten we naar de bezetting van deze onbesnedenen oversteken; misschien zal de HEERE voor ons werken, want bij de HEERE is geen belemmering om te verlossen door velen of door weinigen.", "2 Sam 8:6": "En David legde bezettingen in Syrië van Damaskus, en de Syriërs werden David tot knechten, en zij brachten geschenken; en de HEERE behoedde David overal waar hij heentrok.", "1 Kron 19:8-19": "Toen David dit hoorde, stuurde hij Joab en het hele leger met de helden. Toen de kinderen van Ammon uitgetrokken waren, stelden zij zich in slagorde op voor de poort van de stad; maar de koningen die gekomen waren, stonden apart in het veld. Toen Joab zag dat de spits van de slagorde van voren en van achteren tegen hem stond, koos hij enigen uit alle uitgelezen mannen in Israël, en hij stelde hen in slagorde tegen de Syriërs op.", "2 Kron 32:7": "Weest sterk, en houd goede moed, weest niet bevreesd en niet ontsteld voor het aangezicht van de koning van Assyrië, noch voor het aangezicht van de hele menigte die met hem is; want met ons is er meer dan met hem.", "1 Kron 19:2-5": "Toen zei David: Ik zal goedheid bewijzen aan Hanun, de zoon van Nahas, want zijn vader heeft goedheid aan mij bewezen. Daarom stuurde David boden, om hem te troosten over zijn vader. Toen de knechten van David in het land van de kinderen van Ammon bij Hanun kwamen, om hem te troosten, zeiden de vorsten van de kinderen van Ammon tegen Hanun: Eert David uw vader in uw ogen, omdat hij troosters naar u gestuurd heeft? Zijn zijn knechten niet naar u gekomen om het land te doorzoeken, en om het te verwoesten, en om het te verspieden? Daarom nam Hanun de knechten van David, en hij schoor hen, en sneed hun kleren half af tot aan de heupen, en liet hen heengaan.", "2 Kron 16:2-9": "Toen bracht Asa het zilver en het goud voort, uit de schatten van het huis van de HEERE en van het huis van de koning, en zond het tot Benhadad, de koning van Syrië, die in Damaskus woonde, en zei: Er is een verbond tussen mij en u, en tussen mijn vader en uw vader; zie, ik zend u zilver en goud; ga heen, verbreek uw verbond met Baësa, de koning van Israël, zodat hij van tegen mij aftrekt. En Benhadad hoorde naar de koning Asa, en zond de aanvoerders van de legers die hij had, tegen de steden van Israël, en zij sloegen Ijon, en Dan, en Abel-Maim, en alle schatsteden van Naftali.", "1 Kron 19:17": "Toen dit aan David werd bericht, verzamelde hij heel Israël, en trok over de Jordaan, en kwam tot hen, en stelde de slagorde tegen hen op. Toen David de slagorde tegen de Syriërs opgesteld had, streden zij met hem.", "Zach 14:2": "Want Ik zal alle heidenen tegen Jeruzalem ten strijde verzamelen; en de stad zal ingenomen worden, en de huizen zullen geplunderd worden, en de vrouwen zullen geschonden worden; en de helft van de stad zal uitgaan in de gevangenis, maar het overige van het volk zal uit de stad niet uitgeroeid worden.", "Ps 48:5": "Want zie, de koningen waren verzameld; zij waren samen doorgetrokken.", "Richt 11:12-28": "Vervolgens zond Jeftha boden naar de koning van de kinderen van Ammon, en zei: Wat hebben ik en u met elkaar te maken, dat u naar mij toe bent gekomen om tegen mijn land te strijden? En de koning van de kinderen van Ammon zei tegen de boden van Jeftha: Omdat Israël, toen het optrok uit Egypte, mijn land heeft afgenomen, van de Arnon af tot aan de Jabbok, en tot aan de Jordaan; geef mij dat nu dus in vrede terug. Maar Jeftha ging verder, en zond opnieuw boden naar de koning van de kinderen van Ammon.", "Ps 109:5": "En zij hebben mij kwaad voor goed opgelegd, en haat voor mijn liefde.", "Ps 83:2-13": "O God! Zwijg niet, houd U niet doof, en blijf niet stil, o God! Want zie, Uw vijanden maken misbaar, en Uw haters steken het hoofd op. Zij maken listig een heimelijk plan tegen Uw volk, en spannen samen tegen wie U verborgen houdt.", "1 Kron 18:3": "David sloeg ook Hadar-ezer, de koning van Zoba, naar Hamath toe, toen hij optrok om zijn macht te vestigen aan de rivier de Eufraat.", "Neh 2:1-20": "Toen gebeurde het in de maand Nisan, in het twintigste jaar van koning Arthahsasta, als er wijn voor hem was, dat ik de wijn opnam en aan de koning gaf; nu was ik nooit eerder treurig geweest voor hem. Zo zei de koning tegen mij: Waarom is uw gezicht treurig, terwijl u toch niet ziek bent? Dit is niets anders dan treurigheid van het hart. Toen werd ik erg bevreesd, en ik zei tegen de koning: De koning leve in eeuwigheid! Hoe zou mijn gezicht niet treurig zijn, terwijl de stad, de plaats van de graven van mijn vaderen, verwoest is, en haar poorten met vuur verteerd zijn?", "Joz 6:24-26": "De stad nu verbrandden zij met vuur, en alles wat daarin was; alleen het zilver en goud, alsook de koperen en ijzeren voorwerpen, gaven zij bij de schat van het huis van de HEERE. Dus liet Jozua de hoer Rachab leven, en het huisgezin van haar vader, en alles wat zij had; en zij heeft gewoond in het midden van Israël tot op deze dag, omdat zij de boden verborgen had, die Jozua gezonden had om Jericho te verspieden. En terzelfder tijd bezwoer Jozua hen, en zei: Vervloekt zij die man voor het aangezicht van de HEERE, die zich opmaakt en deze stad Jericho bouwen zal; dat hij haar grondvest op zijn eerstgeboren zoon, en haar poorten stelt op zijn jongste zoon!", "Hebr 13:6": "Zodat wij vrijmoedig durven zeggen: De Heere is mij een Helper, en ik zal niet vrezen wat een mens mij zal doen.", "1 Kron 19:19": "Toen de knechten van Hadar-Ezer zagen dat zij verslagen waren voor Israël, sloten zij vrede met David, en dienden hem; en de Syriërs wilden de kinderen van Ammon niet meer helpen.", "1 Kon 11:23": "Ook verwekte God tegen hem een tegenstander, Rezon, de zoon van Eljada, die gevlucht was van zijn heer Hadad-ezer, de koning van Zoba,", "Jes 20:4": "zo zal de koning van Assyrië de gevangenen van de Egyptenaren wegvoeren, en de Moren, die weggevoerd zullen worden, jong en oud, naakt en barrevoets, en met ontblote billen, de Egyptenaren tot schande.", "1 Kon 20:1": "En Benhadad, de koning van Syrië, verzamelde al zijn leger; en twee en dertig koningen waren met hem, en paarden en wagens; en hij trok op, en belegerde Samaria en streed tegen haar.", "2 Sam 10:1-5": "En het gebeurde daarna, dat de koning van de kinderen Ammons stierf, en zijn zoon Hanun werd koning in zijn plaats. Toen zei David: Ik zal weldadigheid doen aan Hanun, de zoon van Nahas, zoals zijn vader weldadigheid aan mij gedaan heeft. Zo zond David heen, om hem door de dienst van zijn knechten te troosten over zijn vader. En de knechten van David kwamen in het land van de kinderen Ammons. Toen zeiden de vorsten van de kinderen Ammons tegen hun heer Hanun: Eert u David uw vader in uw ogen, omdat hij troosters tot u gezonden heeft? Heeft David zijn knechten niet daarom tot u gezonden, dat hij deze stad doorzoekt, en die verspiedt, en die omkeert?", "1 Sam 14:47": "Toen nam Saul het koningschap over Israël in bezit; en hij streed rondom tegen al zijn vijanden: tegen Moab, en tegen de kinderen van Ammon, en tegen Edom, en tegen de koningen van Zoba, en tegen de Filistijnen; en overal waarheen hij zich wendde, strafte hij hen.", "2 Sam 8:12": "van Syrië, en van Moab, en van de kinderen van Ammon, en van de Filistijnen, en van Amalek, en van de buit van Hadad-Ezer, de zoon van Rechob, de koning van Zoba.", "Ps 18:39": "Ik doorstak hen, zodat zij niet weer konden opstaan; zij vielen onder mijn voeten.", "Gen 14:1-5": "En het gebeurde in de dagen van Amrafel, de koning van Sinear, van Arioch, de koning van Ellasar, van Kedor-laomer, de koning van Elam, en van Tideal, de koning van de volken; dat zij oorlog voerden met Bera, koning van Sodom, en met Birsa, koning van Gomorra, Sinab, koning van Adama, en Semeber, koning van Zeboim, en de koning van Bela, dat is Zoar. Deze allen voegden zich samen in het dal Siddim, dat is de Zoutzee.", "Gen 42:16": "Stuur er één van u uit, die uw broer haalt; maar blijft u zelf gevangen, en uw woorden zullen beproefd worden, of de waarheid bij u is; en als dat niet zo is, zo waar als Farao leeft, dan bent u verspieders!", "1 Kron 19:6-15": "Toen de kinderen van Ammon zagen dat zij zich stinkend gemaakt hadden bij David, stuurden Hanun en de kinderen van Ammon duizend talenten van het zilver, om zich wagens en ruiters te huren uit Mesopotamië, en uit Syrië-Maächa, en uit Zoba; zodat zij zich tweeëndertigduizend wagens huurden; en de koning van Maächa en zijn volk kwamen en legerden zich voor Medeba; ook verzamelden de kinderen van Ammon zich uit hun steden, en zij kwamen ten strijde. Toen David dit hoorde, stuurde hij Joab en het hele leger met de helden.", "1 Kron 19:14": "Toen naderde Joab en het volk dat bij hem was, ten strijde tegenover de Syriërs; en zij vluchtten voor hem.", "Jes 8:10": "Beraadslaag een plan, toch zal het vernietigd worden; spreek een woord, toch zal het niet standhouden; want God is met ons!", "Richt 1:7": "Toen zei Adoni-bezek: Zeventig koningen, van wie de duimen van hun handen en voeten waren afgehouwen, verzamelden de kruimen onder mijn tafel; zoals ik gedaan heb, zo heeft God mij vergolden! En zij brachten hem naar Jeruzalem, en hij stierf daar.", "2 Sam 8:5": "En de Syriërs van Damaskus kwamen om Hadad-Ezer, de koning van Zoba, te helpen; maar David sloeg van de Syriërs tweeëntwintigduizend man.", "Richt 4:22": "En zie, Barak achtervolgde Sisera; en Jaël ging naar buiten hem tegemoet, en zei tegen hem: Kom, en ik zal u de man wijzen die u zoekt. Zo kwam hij bij haar binnen, en zie, Sisera lag dood, en de pin was in zijn slaap.", "Ps 2:1": "Waarom woeden de heidenen, en bedenken de volken iets zinloos?", "Richt 10:7-9": "Toen ontstak de toorn van de HEERE tegen Israël; en Hij verkocht hen in de hand van de Filistijnen en in de hand van de Ammonieten. Die verdrukten en vertrapten de Israëlieten in datzelfde jaar; achttien jaar lang onderdrukten zij alle Israëlieten die aan de overkant van de Jordaan waren, in het land van de Amorieten, dat in Gilead ligt. Daarbij trokken de Ammonieten de Jordaan over om te strijden, ook tegen Juda, tegen Benjamin en tegen het huis van Efraïm, zodat Israël erg in het nauw kwam.", "1 Kron 19:5": "Zij nu gingen heen, en men berichtte David over deze mannen; en hij stuurde hun tegemoet, want die mannen waren zeer beschaamd. De koning zei toen: Blijft in Jericho, totdat uw baard weer gegroeid is; komt dan terug.", "1 Kor 13:5": "Zij handelt niet ongeschikt, zij zoekt zichzelf niet, zij wordt niet verbitterd, zij denkt geen kwaad;", "1 Sam 4:9": "Wees sterk, en gedraag u als mannen, Filistijnen, zodat u de Hebreeën niet gaat dienen, zoals zij u gediend hebben; wees dus mannen, en strijd.", "Lev 19:27": "U zult de hoeken van het hoofd niet rond afscheren; ook zult u de hoeken van het baard niet aantasten.", "Joz 1:7": "Wees alleen sterk en heb zeer goede moed, dat u waarneemt te doen naar de hele wet, die Mozes, Mijn knecht, u geboden heeft, en wijk daar niet vanaf, naar rechts of naar links, opdat u verstandig handelt overal waar u gaat.", "Joz 1:6": "Wees sterk en heb goede moed! Want u zult dit volk dat land als erfelijk bezit doen verkrijgen, dat Ik hun vaderen gezworen heb hun te geven.", "Jes 47:2": "Neem de molen en maal meel; ontdek uw vlechten, ontbloot de enkels, ontdek de schenkels, ga door de rivieren.", "2 Kron 22:5": "Hij wandelde ook naar hun raad, en ging met Joram, de zoon van Achab, de koning van Israël, ten strijde tegen Hazaël, de koning van Syrië, bij Ramoth in Gilead; en de Syriërs sloegen Joram.", "Joz 13:11-13": "En Gilead, en het gebied van de Gezurieten en van de Maachathieten, en de hele berg Hermon, en heel Bazan, tot Salcha toe; Het hele koninkrijk van Og, in Bazan, die geregeerd heeft te Astharoth en te Edrei; deze was overgebleven van het overblijfsel van de reuzen, die Mozes verslagen heeft en verdreven heeft. Maar de kinderen van Israël verdreven de Gezurieten en de Maachathieten niet; maar Gezur en Maachath woonden midden in Israël tot op deze dag.", "1 Sam 3:18": "Toen maakte Samuël hem al die woorden bekend, en verborg ze niet voor hem. En hij zei: Hij is de HEERE; laat Hij doen wat goed is in Zijn ogen!", "Deut 23:3-6": "Geen Ammoniet, noch Moabiet zal in de vergadering van de HEERE komen; zelfs hun tiende geslacht zal in eeuwigheid niet in de vergadering van de HEERE komen. Vanwege dat zij u onderweg niet tegemoet gekomen zijn met brood en met water, toen u uit Egypte wegtrok; en omdat hij tegen u Bileam gehuurd heeft, de zoon van Beor, uit Pethor in Mesopotamië, om u te vloeken. Doch de HEERE, uw God, heeft niet naar Bileam willen horen; maar de HEERE, uw God, heeft de vloek voor u in een zegen veranderd, omdat de HEERE, uw God, u liefhad.", "2 Sam 10:7-14": "Toen David dit hoorde, zond hij Joab heen, met heel het leger van de helden. En de kinderen Ammons trokken uit, en stelden de slagorde op voor de ingang van de poort; maar de Syriërs van Zoba, en Rechob, en de mannen van Tob en Maächa waren afzonderlijk in het veld. Toen Joab nu zag, dat de spits van de slagorde tegen hem was, van voren en van achteren, koos hij uit alle uitgelezen mannen van Israël, en stelde hen in slagorde op tegen de Syriërs;", "1 Kron 18:9": "Toen Thou, de koning van Hamath, hoorde dat David de hele legermacht van Hadar-ezer, de koning van Zoba, verslagen had,", "1 Sam 13:4": "Toen hoorde heel Israël zeggen: Saul heeft de bezetting van de Filistijnen verslagen, en ook is Israël gehaat geworden bij de Filistijnen. Toen werd het volk samengeroepen achter Saul, naar Gilgal.", "2 Sam 16:11": "Verder zei David tegen Abisai en tegen al zijn knechten: Zie, mijn zoon, die uit mijn lijf is voortgekomen, zoekt mijn leven; hoeveel te meer dan nu deze zoon van Jemini? Laat hem begaan, laat hij vloeken, want de HEERE heeft het hem gezegd.", "1 Kon 15:20": "En Benhadad luisterde naar de koning Asa, en zond de leiders van de legers die hij had tegen de steden van Israël; en sloeg Ijon, en Dan, en Abel-Beth-Maächa, en het gehele Cinneroth, met het gehele land Nafthali.", "2 Kron 28:16": "In diezelfde tijd zond koning Achaz tot de koningen van Assyrië, dat zij hem zouden helpen.", "1 Sam 14:12": "Verder antwoordden de mannen van de bezetting Jonathan en zijn wapendrager, en zeiden: Klim op naar ons, en wij zullen u iets duidelijk maken. En Jonathan zei tegen zijn wapendrager: Klim achter mij op, want de HEERE heeft hen gegeven in de hand van Israël.", "2 Kron 18:3": "Want Achab, de koning van Israël, zei tegen Josafat, de koning van Juda: Zult u met mij meegaan naar Ramoth in Gilead? En hij zei tegen hem: Ik zal zijn zoals u bent, en zoals uw volk is, zo zal mijn volk zijn, en wij zullen met u zijn in deze strijd.", "Joz 11:10": "En Jozua keerde op datzelfde moment terug, en hij nam Hazor in, en haar koning sloeg hij met het zwaard; want Hazor was voorheen het hoofd van al deze koninkrijken.", "1 Kron 18:5": "En de Syriërs van Damaskus kwamen om Hadar-ezer, de koning van Zoba, te helpen; maar David sloeg van de Syriërs tweeëntwintigduizend man.", "1 Kron 19:6-19": "Toen de kinderen van Ammon zagen dat zij zich stinkend gemaakt hadden bij David, stuurden Hanun en de kinderen van Ammon duizend talenten van het zilver, om zich wagens en ruiters te huren uit Mesopotamië, en uit Syrië-Maächa, en uit Zoba; zodat zij zich tweeëndertigduizend wagens huurden; en de koning van Maächa en zijn volk kwamen en legerden zich voor Medeba; ook verzamelden de kinderen van Ammon zich uit hun steden, en zij kwamen ten strijde. Toen David dit hoorde, stuurde hij Joab en het hele leger met de helden.", "2 Sam 10:15-19": "Toen nu de Syriërs zagen, dat zij voor Israëls aangezicht geslagen waren, verzamelden zij zich weer samen. En Hadad-Ezer zond heen, en liet de Syriërs uitkomen, die aan de overzijde van de rivier zijn, en zij kwamen te Helam; en Sobach, Hadad-Ezers legeraanvoerder, trok voor hun aangezicht heen. Toen dat aan David werd bekendgemaakt, verzamelde hij heel Israël, en trok over de Jordaan, en kwam te Helam, en de Syriërs stelden de slagorde op tegen David, en streden met hem.", "Deut 31:6": "Wees sterk en heb goede moed, en vrees niet, en schrik niet voor hen; want het is de HEERE, uw God, Die met u meegaat; Hij zal u niet loslaten, en u niet verlaten.", "Jes 15:2": "Hij trekt op naar Baith en Dibon, naar de hoogten, om te wenen; over Nebo en over Medeba zal Moab huilen; op al hun hoofden is kaalheid, ieders baard is afgesneden.", "Joz 12:5": "En hij heerste over de berg Hermon, en over Salcha, en over heel Bazan, tot aan het gebied van de Gezurieten en de Maachathieten; en de helft van Gilead, het gebied van Sihon, de koning van Hesbon.", "Jes 54:15": "Zie, zij zullen zich zeker verzamelen, maar niet uit Mij; wie zich tegen u verzamelen zal, die zal om uw wil vallen.", "1 Kron 18:3-10": "David sloeg ook Hadar-ezer, de koning van Zoba, naar Hamath toe, toen hij optrok om zijn macht te vestigen aan de rivier de Eufraat. En David nam hem duizend wagens af, en zevenduizend ruiters, en twintigduizend man te voet; en David sneed bij alle wagenpaarden de hezenpezen door; maar hij hield honderd wagens daarvan over. En de Syriërs van Damaskus kwamen om Hadar-ezer, de koning van Zoba, te helpen; maar David sloeg van de Syriërs tweeëntwintigduizend man.", "2 Sam 12:26-29": "Joab nu streed tegen Rabba van de kinderen van Ammon; en hij nam de koninklijke stad in. Toen zond Joab boden naar David, en zei: Ik heb gestreden tegen Rabba, en ik heb ook de waterstad ingenomen. Verzamel u nu het overige van het volk, en beleger de stad, en neem haar in; anders zou het, als ík de stad zou innemen, naar mijn naam genoemd worden.", "1 Kron 19:4": "Daarom nam Hanun de knechten van David, en hij schoor hen, en sneed hun kleren half af tot aan de heupen, en liet hen heengaan.", "1 Kron 19:15": "Toen de kinderen van Ammon zagen dat de Syriërs vluchtten, vluchtten zij ook voor Abisai, zijn broer, en zij kwamen in de stad; en Joab kwam in Jeruzalem.", "1 Kron 19:6": "Toen de kinderen van Ammon zagen dat zij zich stinkend gemaakt hadden bij David, stuurden Hanun en de kinderen van Ammon duizend talenten van het zilver, om zich wagens en ruiters te huren uit Mesopotamië, en uit Syrië-Maächa, en uit Zoba;", "Jes 26:11": "HEERE, is Uw hand verhoogd, zij zien het niet; maar zij zullen het zien, en beschaamd worden, vanwege de ijver over Uw volk, ook zal het vuur Uw tegenstanders verteren.", "2 Sam 8:3-8": "David sloeg ook Hadad-Ezer, de zoon van Rechob, de koning van Zoba, toen hij op weg ging om zijn macht te herstellen tot aan de rivier Frath. En David nam hem duizend wagens af, en zevenhonderd ruiters, en twintigduizend man voetvolk; en David sneed de pezen door van alle wagenpaarden, en hield daarvan honderd wagens over. En de Syriërs van Damaskus kwamen om Hadad-Ezer, de koning van Zoba, te helpen; maar David sloeg van de Syriërs tweeëntwintigduizend man.", "2 Kron 25:6": "Daartoe huurde hij uit Israël honderdduizend sterke helden, voor honderd talenten van het zilver.", "1 Kron 19:16": "Toen de Syriërs zagen dat zij door Israël verslagen waren, stuurden zij boden, en lieten de Syriërs komen die aan de overkant van de rivier woonden; en Sofach, de legeraanvoerder van Hadar-Ezer, trok voor hen uit.", "Neh 13:1-3": "Op die dag werd er gelezen in het boek van Mozes, voor de oren van het volk; en daarin werd geschreven gevonden, dat de Ammonieten en Moabieten niet zouden komen in de gemeente van God, tot in eeuwigheid; Omdat zij de kinderen van Israël niet tegemoet waren gekomen met brood en met water, ja, Bileam tegen hen gehuurd hadden om hen te vloeken, hoewel onze God de vloek omkeerde in een zegen. Zo gebeurde het, toen zij deze wet hoorden, dat zij alle vermenging van Israël afscheidden.", "Gen 34:30": "Toen zei Jakob tegen Simeon en tegen Levi: U hebt mij in het ongeluk gestort, doordat u mij stinkend maakt onder de inwoners van dit land, onder de Kanaänieten en onder de Ferezieten; en ik heb weinig volk in aantal; als zij zich tegen mij verzamelen, zullen zij mij verslaan, en ik zal vernietigd worden, ik en mijn huis.", "Ps 18:38": "Ik vervolgde mijn vijanden, en trof hen aan; en ik keerde niet weer, totdat ik hen verdaan had.", "Ps 109:4": "Voor mijn liefde staan zij mij tegen; maar ik was steeds in het gebed.", "Neh 5:1-18": "Maar het geroep van het volk en van hun vrouwen was groot, tegen hun broeders, de Joden. Want er waren er die zeiden: Onze zonen en onze dochters, wij zijn met velen; daarom hebben wij koren opgenomen, opdat wij eten en leven. Ook waren er die zeiden: Wij verpanden onze akkers en onze wijngaarden en onze huizen, opdat wij in deze hongersnood koren mogen opnemen.", "Openb 19:19-21": "En ik zag het beest, en de koningen van de aarde, en hun legers verzameld, om krijg te voeren tegen Hem, Die op het paard zat, en tegen Zijn legers. En het beest werd gegrepen, en met hem de valse profeet, die de tekenen in de tegenwoordigheid van hem gedaan had, waardoor hij verleid had hen die het merkteken van het beest ontvangen hadden, en die zijn beeld aanbaden. Deze twee zijn levend geworpen in de poel van het vuur, die met sulfer brandt. En de overigen werden gedood met het zwaard van Hem Die op het paard zat, dat uit Zijn mond ging; en alle vogels werden verzadigd van hun vlees.", "1 Kon 20:28-30": "En de man van God trad toe, en sprak tegen de koning van Israël, en zei: Zo zegt de HEERE: Omdat de Syriërs gezegd hebben: De HEERE is een God van de bergen, en Hij is niet een God van de laagten; zo zal Ik al deze grote menigte in uw hand geven, opdat u weet, dat Ik de HEERE ben. En dezen waren gelegerd tegenover die, zeven dagen; het gebeurde nu op de zevende dag, dat de strijd aanging; en de kinderen van Israël sloegen van de Syriërs honderdduizend van het voetvolk op één dag. En de overgeblevenen vluchtten naar Afek, de stad in, en de muur viel op zeven en twintig duizend mannen, die overgebleven waren; ook vluchtte Benhadad, en kwam in de stad van kamer in kamer.", "Richt 1:3": "Toen zei Juda tegen zijn broeder Simeon: Trek met mij op in mijn lot, en laten we tegen de Kanaänieten strijden, dan zal ik ook met u optrekken in uw lot. Zo ging Simeon met hem mee.", "Joz 1:18": "Elke man die uw mond opstandig zal zijn, en uw woorden niet horen zal in alles wat u hem gebieden zult, die zal gedood worden; wees alleen sterk en heb goede moed!", "2 Kon 16:9": "Zo luisterde de koning van Assyrië naar hem; want de koning van Assyrië trok op tegen Damaskus, en nam het in, en voerde de bevolking gevankelijk weg naar Kir, en hij doodde Rezin.", "Jes 8:9": "Verzamel u samen, volken! Toch zult u verbroken worden; en neem het ter ore, allen die in verre landen bent, omgord u, toch zult u verbroken worden; omgord u, toch zult u verbroken worden!", "1 Kor 13:7": "Zij bedekt alle dingen, zij gelooft alle dingen, zij hoopt alle dingen, zij verdraagt alle dingen.", "Job 1:21": "En hij zei: Naakt ben ik uit mijn moeders buik gekomen, en naakt zal ik daarheen terugkeren. De HEERE heeft gegeven, en de HEERE heeft genomen; de Naam van de HEERE zij geloofd!", "1 Kor 16:13": "Waakt, staat vast in het geloof, houdt u mannelijk, weest sterk.", "Micha 4:12": "Maar zij kennen de gedachten van de HEERE niet, en begrijpen Zijn raadsbesluit niet; dat Hij hen bijeengebracht heeft als schoven op de dorsvloer.", "Jes 47:3": "Uw schaamte zal ontdekt worden, ook zal uw schande gezien worden; Ik zal wraak nemen, en Ik zal u niet aanvallen als een mens.", "1 Kron 19:18": "Maar de Syriërs vluchtten voor Israël, en David versloeg van de Syriërs zevenduizend wagens, en veertigduizend man te voet; daarbij doodde hij Sofach, de legeraanvoerder.", "Richt 5:1-31": "Verder zong Debora, en Barak, de zoon van Abinoam, op dezelfde dag, en zei: Looft de HEERE, om het wreken van de wraken in Israël, om dat het volk zich gewillig heeft aangeboden. Hoor, u koningen, neem het ter ore, u vorsten! Ik, den HEERE zal ik zingen, ik zal den HEERE, de God van Israël, psalmzingen.", "Neh 4:3-7": "En Tobia, de Ammoniet, was bij hem, en zei: Al is het dat zij bouwen, als er een vos opklom, dan zou hij hun stenen muur al kunnen omverhalen. Hoor, o onze God, dat wij erg veracht worden, en keer hun smaad terug op hun eigen hoofd, en geef hen over als buit in een land van gevangenschap. Dek hun ongerechtigheid niet toe, en laat hun zonde niet uitgewist worden van voor Uw aangezicht, want zij hebben U getergd, tegenover de bouwers.", "1 Kon 16:34": "In zijn dagen bouwde Hiel, de Betheliet, Jericho; op Abiram, zijn eerstgeboren zoon, heeft hij het gegrondvest, en op Segub, zijn jongste zoon, heeft hij de poorten ervan geplaatst; naar het woord van de HEERE, dat Hij door de dienst van Jozua, de zoon van Nun, gesproken had.", "1 Kron 19:1-3": "En het gebeurde na deze dingen, dat Nahas, de koning van de kinderen van Ammon, stierf, en zijn zoon werd koning in zijn plaats. Toen zei David: Ik zal goedheid bewijzen aan Hanun, de zoon van Nahas, want zijn vader heeft goedheid aan mij bewezen. Daarom stuurde David boden, om hem te troosten over zijn vader. Toen de knechten van David in het land van de kinderen van Ammon bij Hanun kwamen, om hem te troosten, zeiden de vorsten van de kinderen van Ammon tegen Hanun: Eert David uw vader in uw ogen, omdat hij troosters naar u gestuurd heeft? Zijn zijn knechten niet naar u gekomen om het land te doorzoeken, en om het te verwoesten, en om het te verspieden?", "1 Sam 22:3": "En David ging vandaar naar Mizpa van de Moabieten; en hij zei tegen de koning van de Moabieten: Laat toch mijn vader en mijn moeder bij u komen, totdat ik weet wat God met mij doen zal.", "2 Kron 18:1": "Josafat had rijkdom en eer in overvloed; en hij verzwagerde zich aan Achab.", "2 Sam 10:6-14": "Toen nu de kinderen Ammons zagen, dat zij zich bij David stinkend gemaakt hadden, zonden de kinderen Ammons heen, en huurden van de Syriërs van Beth-Rechob, en van de Syriërs van Zoba, twintigduizend man van het voetvolk, en van de koning van Maächa duizend man, en van de mannen van Tob twaalfduizend man. Toen David dit hoorde, zond hij Joab heen, met heel het leger van de helden. En de kinderen Ammons trokken uit, en stelden de slagorde op voor de ingang van de poort; maar de Syriërs van Zoba, en Rechob, en de mannen van Tob en Maächa waren afzonderlijk in het veld.", "Richt 18:28": "En er was niemand die hen bevrijdde; want zij lag ver van Sidon, en zij hadden met niemand iets te maken; en zij lag in het dal dat bij Beth-rechob is. Daarna herbouwden zij de stad, en woonden daarin.", "Ps 46:12": "De HEERE van de heerscharen is met ons; de God van Jakob is ons een Hoog Vertrek. Sela.", "2 Sam 16:10": "Maar de koning zei: Wat heb ik met u te doen, zonen van Zeruja? Ja, laat hem vloeken; want de HEERE heeft immers tegen hem gezegd: Vloek David; wie zou dan zeggen: Waarom hebt u dat gedaan?", "Joz 10:1-5": "Het gebeurde nu, toen Adoni-Zedek, de koning van Jeruzalem, gehoord had dat Jozua Ai ingenomen en verbannen had, en aan Ai en haar koning zo gedaan had als hij aan Jericho en haar koning gedaan had; en dat de inwoners van Gibeon vrede met Israël gemaakt hadden, en in hun midden waren; Zo vreesden zij zeer; want Gibeon was een grote stad, als een van de koninklijke steden; ja, zij was groter dan Ai, en al haar mannen waren sterk. Daarom stuurde Adoni-Zedek, koning van Jeruzalem, tot Hoham, de koning van Hebron, en tot Piram, de koning van Jarmuth, en tot Jafia, de koning van Lachis, en tot Debir, de koning van Eglon, en zei:", "Richt 11:5": "Toen nu de kinderen van Ammon tegen Israël streden, gingen de oudsten van Gilead heen om Jeftha te halen uit het land van Tob.", "1 Kron 19:1": "En het gebeurde na deze dingen, dat Nahas, de koning van de kinderen van Ammon, stierf, en zijn zoon werd koning in zijn plaats.", "1 Sam 22:4": "En hij bracht hen voor het aangezicht van de koning van de Moabieten; en zij bleven bij hem al de dagen dat David in de vesting was.", "2 Kron 28:20": "En Tiglath-Pilneser, de koning van Assyrië, kwam tot hem; maar hij benauwde hem, en versterkte hem niet.", "Jes 8:9-12": "Verzamel u samen, volken! Toch zult u verbroken worden; en neem het ter ore, allen die in verre landen bent, omgord u, toch zult u verbroken worden; omgord u, toch zult u verbroken worden! Beraadslaag een plan, toch zal het vernietigd worden; spreek een woord, toch zal het niet standhouden; want God is met ons! Want zo heeft de HEERE tegen mij gezegd, met een sterke hand, en Hij onderwees mij om niet te wandelen op de weg van dit volk, en zei:", "1 Sam 27:12": "En Achis geloofde David, en zei: Hij heeft zich helemaal onmogelijk gemaakt bij zijn volk, in Israël; daarom zal hij eeuwig mijn knecht zijn.", "Neh 1:1-11": "De geschiedenissen van Nehemia, zoon van Hachalja. En het gebeurde in de maand Chisleu, in het twintigste jaar, toen ik in de burcht Susan was, dat Hanani kwam, een van mijn broers, hij en enkele mannen uit Juda, en ik vroeg hen naar de Joden die ontkomen waren, die overgebleven waren van de gevangenschap, en naar Jeruzalem. En zij zeiden tegen mij: De overgeblevenen, die van de gevangenschap daar in het gebied zijn overgebleven, zijn in grote ellende en in smaad; en de muur van Jeruzalem is afgebroken, en haar poorten zijn met vuur verbrand.", "Dan 2:37": "U, o koning, bent een koning der koningen; want de God van de hemel heeft u een koninkrijk, macht, sterkte en eer gegeven;", "Jes 7:1-9": "Het gebeurde nu in de dagen van Achaz, de zoon van Jotham, de zoon van Uzzia, de koning van Juda, dat Rezin, de koning van Syrië, en Pekah, de zoon van Remalia, de koning van Israël, optrokken naar Jeruzalem, ten oorlog tegen haar; maar hij kon met strijden niet tegen haar op. Toen men het huis van David boodschapte en zei: De Syriërs liggen bij Efraïm, bewoog zijn hart zich, en het hart van zijn volk, zoals de bomen van het woud bewegen door de wind. En de HEERE zei tegen Jesaja: Ga nu uit, Achaz tegemoet, u en uw zoon, Schear-Jaschub, aan het einde van de watergang van de bovenste vijver, aan de hoge weg van het veld van de voller;", "1 Sam 11:1": "Toen trok Nahas, de Ammoniet, op en belegerde Jabes in Gilead. En alle mannen van Jabes zeiden tegen Nahas: Sluit een verbond met ons, en wij zullen u dienen.", "Deut 3:14": "Jaïr, de zoon van Manasse, kreeg de hele landstreek van Argob, tot aan het gebied van de Gezurieten en Maächatieten; en hij noemde ze naar zijn naam, Bazan-Havvoth-Jaïr, tot op deze dag.", "Richt 1:31": "Aser verdreef de inwoners van Acco niet, noch de inwoners van Sidon, noch Achlab, noch Achsib, noch Chelba, noch Afik, noch Rechob;", "1 Kron 19:2": "Toen zei David: Ik zal goedheid bewijzen aan Hanun, de zoon van Nahas, want zijn vader heeft goedheid aan mij bewezen. Daarom stuurde David boden, om hem te troosten over zijn vader. Toen de knechten van David in het land van de kinderen van Ammon bij Hanun kwamen, om hem te troosten,", "Num 13:21": "Zo trokken zij op, en verspiedden het land, van de woestijn Zin af tot Rechob toe, waar men komt bij Hamath.", "2 Sam 8:3-13": "David sloeg ook Hadad-Ezer, de zoon van Rechob, de koning van Zoba, toen hij op weg ging om zijn macht te herstellen tot aan de rivier Frath. En David nam hem duizend wagens af, en zevenhonderd ruiters, en twintigduizend man voetvolk; en David sneed de pezen door van alle wagenpaarden, en hield daarvan honderd wagens over. En de Syriërs van Damaskus kwamen om Hadad-Ezer, de koning van Zoba, te helpen; maar David sloeg van de Syriërs tweeëntwintigduizend man.", "Joz 19:28": "En Ebron, en Rehob, en Hammon, en Kana, tot aan het grote Sidon.", "2 Sam 10:6-19": "Toen nu de kinderen Ammons zagen, dat zij zich bij David stinkend gemaakt hadden, zonden de kinderen Ammons heen, en huurden van de Syriërs van Beth-Rechob, en van de Syriërs van Zoba, twintigduizend man van het voetvolk, en van de koning van Maächa duizend man, en van de mannen van Tob twaalfduizend man. Toen David dit hoorde, zond hij Joab heen, met heel het leger van de helden. En de kinderen Ammons trokken uit, en stelden de slagorde op voor de ingang van de poort; maar de Syriërs van Zoba, en Rechob, en de mannen van Tob en Maächa waren afzonderlijk in het veld.", "2 Sam 8:4": "En David nam hem duizend wagens af, en zevenhonderd ruiters, en twintigduizend man voetvolk; en David sneed de pezen door van alle wagenpaarden, en hield daarvan honderd wagens over.", "Num 13:20": "Ook hoe het land is, of het vet is of mager, of er bomen in zijn of niet; en wees sterk, en neem van de vrucht van het land. Die dagen nu waren de dagen van de eerste vruchten van de wijndruiven.", "1 Sam 17:32": "En David zei tegen Saul: Laat aan niemand het hart ontvallen om hem. Uw knecht zal gaan en met deze Filistijn strijden.", "2 Kron 25:5": "En Amazia verzamelde Juda, en stelde hen, naar de families van hun vaderen, aan tot leiders van duizenden en tot leiders van honderden, door heel Juda en Benjamin; en hij monsterde hen, van twintig jaar oud en daarboven, en vond hen driehonderdduizend uitgelezen mannen, die uit konden trekken ten strijde, en die speer en schild konden hanteren.", "Openb 18:10": "Van verre staande uit vrees voor haar pijniging, en zeggen: Wee, wee, de grote stad Babylon, de sterke stad, want uw oordeel is in één uur gekomen.", "Gen 42:9": "Toen dacht Jozef aan de dromen die hij over hen gedroomd had; en hij zei tegen hen: U bent verspieders, u bent gekomen om te bekijken waar het land onbeschermd is.", "Ps 137:1-6": "Aan de rivieren van Babel, daar zaten wij, ook weenden wij, als wij dachten aan Sion. Wij hebben onze harpen gehangen aan de wilgen, die daar zijn. Toen zij die ons daar gevangen hielden, de woorden van een lied van ons vroegen, en zij die ons overhoop hadden geworpen, vreugde, en zeiden: Zingt ons een van de liederen van Sion;", "Richt 5:26": "Haar hand sloeg zij aan de nagel, en haar rechterhand aan de hamer van de arbeidslieden; en zij klopte Sisera; zij streek zijn hoofd af, toen zij zijn slaap had doorgenageld en doorgedrongen.", "2 Kon 5:20": "Gehazi nu, de knecht van Elisa, de man van God, zei: Zie, mijn heer heeft Naäman, deze Syriër, ontzien, doordat hij niet uit zijn hand heeft aangenomen wat hij gebracht had; maar zo waarachtig als de HEERE leeft, ik zal hem achterna lopen, en zal iets van hem aannemen!", "Ex 5:21": "En zeiden tot hen: De HEERE ziet op u, en oordeelt het, omdat u onze reuk hebt doen stinken voor Farao, en voor zijn knechten, door een zwaard in hun handen te geven, om ons te doden.", "2 Kon 18:19-21": "En Rabsake zei tot hen: Zeg nu tot Hizkia: Zo zegt de grote koning, de koning van Assyrië: Wat vertrouwen is dit, waarmee u vertrouwt? U zegt (doch het is een woord der lippen): Er is raad en macht tot de oorlog; op wie vertrouwt u nu, dat u tegen mij rebelleert? Zie nu, vertrouwt u op die gebroken rietstaf, op Egypte, waarop, als iemand daarop leunt, het in zijn hand zal gaan, en die doorboren; zo is Farao, de koning van Egypte, voor allen die op hem vertrouwen.", "1 Kon 22:1-4": "En zij bleven drie jaar stil, zodat er geen oorlog was tussen Syrië en Israël. En het gebeurde in het derde jaar, dat Josafat, de koning van Juda, naar de koning van Israël afkwam. Toen zei de koning van Israël tegen zijn knechten: Weet u dat Ramoth in Gilead van ons is? En wij blijven stil, zonder het uit de hand van de koning van Syrië te nemen.", "2 Sam 10:1-4": "En het gebeurde daarna, dat de koning van de kinderen Ammons stierf, en zijn zoon Hanun werd koning in zijn plaats. Toen zei David: Ik zal weldadigheid doen aan Hanun, de zoon van Nahas, zoals zijn vader weldadigheid aan mij gedaan heeft. Zo zond David heen, om hem door de dienst van zijn knechten te troosten over zijn vader. En de knechten van David kwamen in het land van de kinderen Ammons. Toen zeiden de vorsten van de kinderen Ammons tegen hun heer Hanun: Eert u David uw vader in uw ogen, omdat hij troosters tot u gezonden heeft? Heeft David zijn knechten niet daarom tot u gezonden, dat hij deze stad doorzoekt, en die verspiedt, en die omkeert?", "Joz 11:1-5": "Het gebeurde daarna, toen Jabin, de koning van Hazor, dit hoorde, dat hij een boodschap stuurde naar Jobab, de koning van Madon, en naar de koning van Simron, en naar de koning van Achsaf, En naar de koningen die tegen het noorden op het gebergte, en op het vlakke, tegen het zuiden van Cinneroth, en in de laagte, en in Nafoth-dor, aan de zee waren; Tot de Kanaänieten tegen het oosten en tegen het westen, en de Amorieten, en de Hethieten, en de Ferezieten; en de Jebusieten op het gebergte, en de Hevieten onder aan Hermon, in het land van Mizpa.", "1 Kron 19:3": "zeiden de vorsten van de kinderen van Ammon tegen Hanun: Eert David uw vader in uw ogen, omdat hij troosters naar u gestuurd heeft? Zijn zijn knechten niet naar u gekomen om het land te doorzoeken, en om het te verwoesten, en om het te verspieden?", "2 Sam 8:3": "David sloeg ook Hadad-Ezer, de zoon van Rechob, de koning van Zoba, toen hij op weg ging om zijn macht te herstellen tot aan de rivier Frath.", "Micha 4:11": "Nu zijn wel veel heidenvolken tegen u verzameld, die zeggen: Laat ze ontheiligd worden, en laat ons oog zich verlustigen aan Sion.", "Neh 4:14": "En ik zag toe, stond op, en zei tegen de edelen, tegen de leiders en tegen de rest van het volk: Wees niet bang voor hen; denk aan die grote en ontzagwekkende Heere, en strijd voor uw broeders, uw zonen en uw dochters, uw vrouwen en uw huizen."}, "noten": {}, "koppeling": {"1": "<span class=\"wl\" data-l=\"L1\" data-code=\"H1961\">En</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H1961\">het</span> gebeurde <span class=\"wl\" data-l=\"L2\" data-code=\"H310\">daarna</span>, <span class=\"wl\" data-l=\"L3\" data-code=\"H4428\">dat</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H4428\">de</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H4428\">koning</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H4428\">van</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H1121\">de</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H1121\">kinderen</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H5983\">Ammons</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H4191\">stierf</span>, <span class=\"wl\" data-l=\"L4\" data-code=\"H1121\">en</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H1121\">zijn</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H1121\">zoon</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H2586\">Hanun</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H2586\">werd</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H4427\">koning</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H4427\">in</span> <span class=\"wl\" data-l=\"L9\" data-code=\"H8478\">zijn</span> <span class=\"wl\" data-l=\"L9\" data-code=\"H8478\">plaats</span>.", "2": "<span class=\"wl\" data-l=\"L1\" data-code=\"H559\">Toen</span> zei <span class=\"wl\" data-l=\"L2\" data-code=\"H1732\">David</span>: <span class=\"wl\" data-l=\"L3\" data-code= "L5\" data-code=\"H7200\">zagen</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H3588\">dat</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H3478\">zij</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H3478\">voor</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H3478\">Israëls</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H6440\">aangezicht</span> <span class=\"wl\" data-l=\"L9\" data-code=\"H5062\">geslagen</span> <span class=\"wl\" data-l=\"L9\" data-code=\"H5062\">waren</span>, sloten <span class=\"wl\" data-l=\"L10\" data-code=\"H7999\">zij</span> <span class=\"wl\" data-l=\"L10\" data-code=\"H7999\">vrede</span> <span class=\"wl\" data-l=\"L10\" data-code=\"H7999\">met</span> <span class=\"wl\" data-l=\"L11\" data-code=\"H3478\">Israël</span>, <span class=\"wl\" data-l=\"L12\" data-code=\"H5647\">en</span> <span class=\"wl\" data-l=\"L12\" data-code=\"H5647\">dienden</span> <span class=\"wl\" data-l=\"L13\" data-code=\"H758\">hen</span>; <span class=\"wl\" data-l=\"L13\" data-code=\"H758\">en</span> <span class=\"wl\" data-l=\"L13\" data-code=\"H758\">de</span> <span class=\"wl\" data-l=\"L13\" data-code=\"H758\">Syriërs</span> <span class=\"wl\" data-l=\"L14\" data-code=\"H3372\">vreesden</span> <span class=\"wl\" data-l=\"L14\" data-code=\"H3372\">de</span> <span class=\"wl\" data-l=\"L15\" data-code=\"H1121\">kinderen</span> <span class=\"wl\" data-l=\"L16\" data-code=\"H5983\">Ammons</span> niet <span class=\"wl\" data-l=\"L17\" data-code=\"H5750\">meer</span> <span class=\"wl\" data-l=\"L17\" data-code=\"H5750\">te</span> <span class=\"wl\" data-l=\"L18\" data-code=\"H3467\">verlossen</span>."}, "koppeling_kjv": {"1": "And it came to pass after <span class=\"wl wl-kjv\" data-code=\"H310\">this,</span> that the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H5983\">Ammon</span> <span class=\"wl wl-kjv\" data-code=\"H4191\">died,</span> and <span class=\"wl wl-kjv\" data-code=\"H2586\">Hanun</span> his <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> <span class=\"wl wl-kjv\" data-code=\"H4427\">reigned</span> in his stead.", "2": "Then <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> I will <span class=\"wl wl-kjv\" data-code=\"H6213\">shew</span> <span class=\"wl wl-kjv\" data-code=\"H2617\">kindness</span> unto <span class=\"wl wl-kjv\" data-code=\"H2586\">Hanun</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H5176\">Nahash,</span> as his <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">shewed</span> <span class=\"wl wl-kjv\" data-code=\"H2617\">kindness</span> unto me. And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> to <span class=\"wl wl-kjv\" data-code=\"H5162\">comfort</span> him by the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of his <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> for his <span class=\"wl wl-kjv\" data-code=\"H1\">father.</span> And <span class=\"wl wl-kjv\" data-code=\"H1732\">David's</span> <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> into the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H5983\">Ammon.</span>", "3": "And the <span class=\"wl wl-kjv\" data-code=\"H8269\">princes</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H5983\">Ammon</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H2586\">Hanun</span> their <span class=\"wl wl-kjv\" data-code=\"H113\">lord,</span> <span class=\"wl wl-kjv\" data-code=\"H5869\">Thinkest</span> thou that <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> doth <span class=\"wl wl-kjv\" data-code=\"H3513\">honour</span> thy <span class=\"wl wl-kjv\" data-code=\"H1\">father,</span> that he hath <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> <span class=\"wl wl-kjv\" data-code=\"H5162\">comforters</span> unto thee? hath not <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> rather <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> his <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> unto thee, <span class=\"wl wl-kjv\" data-code=\"H5668\">to</span> <span class=\"wl wl-kjv\" data-code=\"H2713\">search</span> the <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> and to spy it <span class=\"wl wl-kjv\" data-code=\"H7270\">out,</span> and to <span class=\"wl wl-kjv\" data-code=\"H2015\">overthrow</span> it?", "4": "Wherefore <span class=\"wl wl-kjv\" data-code=\"H2586\">Hanun</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David's</span> <span class=\"wl wl-kjv\" data-code=\"H5650\">servants,</span> and shaved <span class=\"wl wl-kjv\" data-code=\"H1548\">off</span> the one <span class=\"wl wl-kjv\" data-code=\"H2677\">half</span> of their <span class=\"wl wl-kjv\" data-code=\"H2206\">beards,</span> and cut <span class=\"wl wl-kjv\" data-code=\"H3772\">off</span> their <span class=\"wl wl-kjv\" data-code=\"H4063\">garments</span> in the <span class=\"wl wl-kjv\" data-code=\"H2677\">middle,</span> even to their <span class=\"wl wl-kjv\" data-code=\"H8357\">buttocks,</span> and sent them <span class=\"wl wl-kjv\" data-code=\"H7971\">away.</span>", "5": "When they <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> it unto <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> he <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> to <span class=\"wl wl-kjv\" data-code=\"H7125\">meet</span> them, because the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> were <span class=\"wl wl-kjv\" data-code=\"H3966\">greatly</span> <span class=\"wl wl-kjv\" data-code=\"H3637\">ashamed:</span> and the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H3427\">Tarry</span> at <span class=\"wl wl-kjv\" data-code=\"H3405\">Jericho</span> until your <span class=\"wl wl-kjv\" data-code=\"H2206\">beards</span> be <span class=\"wl wl-kjv\" data-code=\"H6779\">grown,</span> and then <span class=\"wl wl-kjv\" data-code=\"H7725\">return.</span>", "6": "And when the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H5983\">Ammon</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> that they <span class=\"wl wl-kjv\" data-code=\"H887\">stank</span> before <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H5983\">Ammon</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> and <span class=\"wl wl-kjv\" data-code=\"H7936\">hired</span> the <span class=\"wl wl-kjv\" data-code=\"H758\">Syrians</span> of <span class=\"wl wl-kjv\" data-code=\"H1050\">Bethrehob,</span> and the <span class=\"wl wl-kjv\" data-code=\"H758\">Syrians</span> of <span class=\"wl wl-kjv\" data-code=\"H6678\">Zoba,</span> <span class=\"wl wl-kjv\" data-code=\"H6242\">twenty</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> <span class=\"wl wl-kjv\" data-code=\"H7273\">footmen,</span> and of <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H4601\">Maacah</span> a <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> <span class=\"wl wl-kjv\" data-code=\"H376\">men,</span> and of <span class=\"wl wl-kjv\" data-code=\"H382\">Ishtob</span> <span class=\"wl wl-kjv\" data-code=\"H6240\">twelve</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> <span class=\"wl wl-kjv\" data-code=\"H376\">men.</span>", "7": "And when <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> of it, he <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H6635\">host</span> of the mighty <span class=\"wl wl-kjv\" data-code=\"H1368\">men.</span>", "8": "And the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H5983\">Ammon</span> came <span class=\"wl wl-kjv\" data-code=\"H3318\">out,</span> and put the <span class=\"wl wl-kjv\" data-code=\"H4421\">battle</span> in <span class=\"wl wl-kjv\" data-code=\"H6186\">array</span> at the entering <span class=\"wl wl-kjv\" data-code=\"H6607\">in</span> of the <span class=\"wl wl-kjv\" data-code=\"H8179\">gate:</span> and the <span class=\"wl wl-kjv\" data-code=\"H758\">Syrians</span> of <span class=\"wl wl-kjv\" data-code=\"H6678\">Zoba,</span> and of <span class=\"wl wl-kjv\" data-code=\"H7340\">Rehob,</span> and <span class=\"wl wl-kjv\" data-code=\"H382\">Ishtob,</span> and <span class=\"wl wl-kjv\" data-code=\"H4601\">Maacah,</span> were by <span class=\"wl wl-kjv\" data-code=\"H905\">themselves</span> in the <span class=\"wl wl-kjv\" data-code=\"H7704\">field.</span>", "9": "When <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> that the <span class=\"wl wl-kjv\" data-code=\"H6440\">front</span> of the <span class=\"wl wl-kjv\" data-code=\"H4421\">battle</span> was against him <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> and <span class=\"wl wl-kjv\" data-code=\"H268\">behind,</span> he <span class=\"wl wl-kjv\" data-code=\"H977\">chose</span> of all the <span class=\"wl wl-kjv\" data-code=\"H977\">choice</span> men of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> and put them in <span class=\"wl wl-kjv\" data-code=\"H6186\">array</span> <span class=\"wl wl-kjv\" data-code=\"H7125\">against</span> the <span class=\"wl wl-kjv\" data-code=\"H758\">Syrians:</span>", "10": "And the <span class=\"wl wl-kjv\" data-code=\"H3499\">rest</span> of the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> he <span class=\"wl wl-kjv\" data-code=\"H5414\">delivered</span> into the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of <span class=\"wl wl-kjv\" data-code=\"H52\">Abishai</span> his <span class=\"wl wl-kjv\" data-code=\"H251\">brother,</span> that he might put them in <span class=\"wl wl-kjv\" data-code=\"H6186\">array</span> <span class=\"wl wl-kjv\" data-code=\"H7125\">against</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H5983\">Ammon.</span>", "11": "And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> If the <span class=\"wl wl-kjv\" data-code=\"H758\">Syrians</span> be too <span class=\"wl wl-kjv\" data-code=\"H2388\">strong</span> for me, then thou shalt <span class=\"wl wl-kjv\" data-code=\"H3444\">help</span> me: but if the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H5983\">Ammon</span> be too <span class=\"wl wl-kjv\" data-code=\"H2388\">strong</span> for thee, then I will <span class=\"wl wl-kjv\" data-code=\"H1980\">come</span> and <span class=\"wl wl-kjv\" data-code=\"H3467\">help</span> thee.", "12": "Be of good <span class=\"wl wl-kjv\" data-code=\"H2388\">courage,</span> and let us play the <span class=\"wl wl-kjv\" data-code=\"H2388\">men</span> for our <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> and for the <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> of our <span class=\"wl wl-kjv\" data-code=\"H430\">God:</span> and the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> that which <span class=\"wl wl-kjv\" data-code=\"H5869\">seemeth</span> him <span class=\"wl wl-kjv\" data-code=\"H2896\">good.</span>", "13": "And <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab</span> drew <span class=\"wl wl-kjv\" data-code=\"H5066\">nigh,</span> and the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> that were with him, unto the <span class=\"wl wl-kjv\" data-code=\"H4421\">battle</span> against the <span class=\"wl wl-kjv\" data-code=\"H758\">Syrians:</span> and they <span class=\"wl wl-kjv\" data-code=\"H5127\">fled</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> him.", "14": "And when the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H5983\">Ammon</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> that the <span class=\"wl wl-kjv\" data-code=\"H758\">Syrians</span> were <span class=\"wl wl-kjv\" data-code=\"H5127\">fled,</span> then <span class=\"wl wl-kjv\" data-code=\"H5127\">fled</span> they also <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> <span class=\"wl wl-kjv\" data-code=\"H52\">Abishai,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">entered</span> into the <span class=\"wl wl-kjv\" data-code=\"H5892\">city.</span> So <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">returned</span> from the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H5983\">Ammon,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem.</span>", "15": "And when the <span class=\"wl wl-kjv\" data-code=\"H758\">Syrians</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> that they were <span class=\"wl wl-kjv\" data-code=\"H5062\">smitten</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> they <span class=\"wl wl-kjv\" data-code=\"H622\">gathered</span> themselves <span class=\"wl wl-kjv\" data-code=\"H3162\">together.</span>", "16": "And <span class=\"wl wl-kjv\" data-code=\"H1928\">Hadarezer</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent,</span> and brought <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> the <span class=\"wl wl-kjv\" data-code=\"H758\">Syrians</span> that were <span class=\"wl wl-kjv\" data-code=\"H5676\">beyond</span> the <span class=\"wl wl-kjv\" data-code=\"H5104\">river:</span> and they <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to <span class=\"wl wl-kjv\" data-code=\"H2431\">Helam;</span> and <span class=\"wl wl-kjv\" data-code=\"H7731\">Shobach</span> the <span class=\"wl wl-kjv\" data-code=\"H8269\">captain</span> of the <span class=\"wl wl-kjv\" data-code=\"H6635\">host</span> of <span class=\"wl wl-kjv\" data-code=\"H1928\">Hadarezer</span> went <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> them.", "17": "And when it was <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> he <span class=\"wl wl-kjv\" data-code=\"H622\">gathered</span> ➔ all <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H622\">together,</span> and passed <span class=\"wl wl-kjv\" data-code=\"H5674\">over</span> <span class=\"wl wl-kjv\" data-code=\"H3383\">Jordan,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to <span class=\"wl wl-kjv\" data-code=\"H2431\">Helam.</span> And the <span class=\"wl wl-kjv\" data-code=\"H758\">Syrians</span> set themselves in <span class=\"wl wl-kjv\" data-code=\"H6186\">array</span> <span class=\"wl wl-kjv\" data-code=\"H7125\">against</span> <span class=\"wl wl-k ians</span> <span class=\"wl wl-kjv\" data-code=\"H3372\">feared</span> to <span class=\"wl wl-kjv\" data-code=\"H3467\">help</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H5983\">Ammon</span> any more."}};

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
