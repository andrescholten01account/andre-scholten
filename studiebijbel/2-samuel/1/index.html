dood waren.","5":"En David zei tegen de jongeman die hem de boodschap bracht: Hoe weet u dat Saul dood is, en zijn zoon Jonathan?","6":"Toen zei de jongeman die hem de boodschap bracht: Ik kwam toevallig op het gebergte van Gilboa; en kijk, Saul leunde op zijn speer; en kijk, de wagens en ruiters zaten hem dicht op de hielen.","7":"Toen keek hij achter zich om, en zag mij, en hij riep mij, en ik zei: Zie, *hier* ben ik.","8":"En hij zei tegen mij: Wie bent u? En ik zei tegen hem: Ik ben een Amalekiet.","9":"Toen zei hij tegen mij: Sta toch bij mij, en dood mij; want deze maliënkolder houdt mij vast; want mijn leven is nog helemaal in mij.","10":"Zo stond ik bij hem, en doodde hem; want ik wist dat hij na zijn val niet zou leven; en ik nam de kroon die op zijn hoofd was, en de armband die aan zijn arm was, en heb ze hier naar mijn heer gebracht.","11":"Toen greep David zijn kleren en scheurde ze; evenzo ook al de mannen die met hem waren.","12":"En zij weeklaagden, en weenden, en vastten tot de avond, over Saul en over Jonathan, zijn zoon, en over het volk van de HEERE, en over het huis van Israël, omdat zij door het zwaard gevallen waren.","13":"Verder zei David tegen de jongeman die hem de boodschap gebracht had: Waar komt u vandaan? En hij zei: Ik ben de zoon van een vreemdeling, van een Amalekiet.","14":"En David zei tegen hem: Hoe hebt u niet gevreesd uw hand uit te strekken om de gezalfde van de HEERE te doden?","15":"En David riep een van de jongens, en zei: Kom dichterbij, val hem aan. En hij sloeg hem, zodat hij stierf.","16":"En David zei tegen hem: Uw bloed komt op uw hoofd; want uw mond heeft tegen u getuigd, toen u zei: ik heb de gezalfde van de HEERE gedood.","17":"David nu klaagde deze klaagzang over Saul en over Jonathan, zijn zoon;","18":"toen hij gezegd had dat men de kinderen van Juda de boog moest leren; kijk, het is geschreven in het boek van de Oprechten.","19":"O Sieraad van Israël, op uw hoogten is hij verslagen; hoe zijn de helden gevallen!","20":"Verkondigt het niet in Gath, verkondigt het niet op de straten van Askelon; opdat de dochters van de Filistijnen zich niet verblijden, opdat de dochters van de onbesnedenen niet opspringen van vreugde.","21":"U, bergen van Gilboa, geen dauw en geen regen mag op u zijn, en geen velden met hefoffers; want daar is het schild van de helden smadelijk weggeworpen, het schild van Saul, alsof hij niet met olie gezalfd was geweest.","22":"Van het bloed van de verslagenen, van het vet van de helden, week Jonathans boog niet terug; en Sauls zwaard keerde niet leeg terug.","23":"Saul en Jonathan, die geliefd waren, en die liefelijke mensen in hun leven, zijn ook in hun dood niet gescheiden; zij waren sneller dan arenden, zij waren sterker dan leeuwen.","24":"U, dochters van Israël, weent over Saul; die u kleedde met scharlaken, met weelde; die u sieraad van goud liet dragen over uw kleding.","25":"Hoe zijn de helden gevallen in het midden van de strijd! Jonathan is verslagen op uw hoogten!","26":"Ik ben benauwd om uwentwil, mijn broeder Jonathan! U was mij zeer liefelijk; uw liefde was mij wonderlijker dan liefde van vrouwen.","27":"Hoe zijn de helden gevallen, en de oorlogswapens verloren!"},"SV":{"1":"Voorts geschiedde het na Sauls dood, als David van den slag der Amalekieten was wedergekomen, en David twee dagen te Ziklag gebleven was;","2":"Zo geschiedde het op den derden dag, dat, ziet, uit het heirleger van Saul, een man kwam, wiens klederen gescheurd waren, en aarde was op zijn hoofd; en het geschiedde, als hij tot David kwam, zo viel hij ter aarde en boog zich neder.","3":"En David zeide tot hem: Van waar komt gij? En hij zeide tot hem: Ik ben ontkomen uit het heirleger van Israël.","4":"Voorts zeide David tot hem: Wat is de zaak? Verhaal het mij toch. En hij zeide, dat het volk uit den strijd gevloden was, en dat er ook velen van het volk gevallen en gestorven waren, dat ook Saul en zijn zoon Jonathan dood waren.","5":"En David zeide tot den jongen, die hem de boodschap bracht: Hoe weet gij, dat Saul dood is, en zijn zoon Jonathan?","6":"Toen zeide de jongen, die hem de boodschap bracht: Ik kwam bij geval op het gebergte van Gilboa; en ziet, Saul leunde op zijn spies; en ziet, de wagens en ritmeesters hielden dicht op hem.","7":"Zo zag hij achter zich om, en zag mij, en hij riep mij, en ik zeide: Zie, *hier* ben ik.","8":"En hij zeide tot mij: Wie zijt gij? En ik zeide tot hem: Ik ben een Amalekiet.","9":"Toen zeide hij tot mij: Sta toch bij mij, en dood mij; want deze malienkolder heeft mij opgehouden; want mijn leven is nog gans in mij.","10":"Zo stond ik bij hem, en doodde hem; want ik wist, dat hij na zijn val niet leven zou; en ik nam de kroon, die op zijn hoofd was, en het armgesmijde, dat aan zijn arm was, en heb ze hier tot mijn heer gebracht.","11":"Toen vatte David zijn klederen en scheurde ze; desgelijks ook al de mannen, die met hem waren.","12":"En zij weeklaagden, en weenden, en vastten tot op den avond, over Saul en over Jonathan, zijn zoon, en over het volk des HEEREN, en over het huis Israëls, omdat zij door het zwaard gevallen waren.","13":"Voorts zeide David tot den jongen, die hem de boodschap gebracht had: Van waar zijt gij? En hij zeide: Ik ben de zoon van een vreemden man, van een Amalekiet.","14":"En David zeide tot hem: Hoe, hebt gij niet gevreesd uw hand uit te strekken, om den gezalfde des HEEREN te verderven?","15":"En David riep een van de jongens, en zeide: Treed toe, val op hem aan. En hij sloeg hem, dat hij stierf.","16":"En David zeide tot hem: Uw bloed zij op uw hoofd; want uw mond heeft tegen u getuigd, zeggende: ik heb den gezalfde des HEEREN gedood.","17":"David nu klaagde deze klage over Saul en over Jonathan, zijn zoon;","18":"Als hij gezegd had, dat men den kinderen van Juda den boog zou leren; ziet, het is geschreven in het boek des Oprechten.","19":"O Sieraad van Israël, op uw hoogten is hij verslagen; hoe zijn de helden gevallen!","20":"Verkondigt het niet te Gath, boodschapt het niet op de straten van Askelon; opdat de dochters der Filistijnen zich niet verblijden, opdat de dochters der onbesnedenen niet opspringen van vreugde.","21":"Gij, bergen van Gilboa, noch dauw noch regen moet zijn op u, noch velden der hefofferen; want aldaar is der helden schild smadelijk weggeworpen, het schild van Saul, alsof hij niet gezalfd ware geweest met olie.","22":"Van het bloed der verslagenen, van het vette der helden, werd Jonathans boog niet achterwaarts gedreven; en Sauls zwaard keerde niet ledig weder.","23":"Saul en Jonathan, die beminden, en die liefelijken in hun leven, zijn ook in hun dood niet gescheiden; zij waren lichter dan arenden, zij waren sterker dan leeuwen.","24":"Gij, dochteren Israëls, weent over Saul; die u kleedde met scharlaken, met weelde; die u sieraad van goud deed dragen over uw kleding.","25":"Hoe zijn de helden gevallen in het midden van den strijd! Jonathan is verslagen op uw hoogten!","26":"Ik ben benauwd om uwentwil, mijn broeder Jonathan! Gij waart mij zeer liefelijk; uw liefde was mij wonderlijker dan liefde der vrouwen.","27":"Hoe zijn de helden gevallen, en de krijgswapenen verloren!"},"KJV":{"1":"Now it came to pass after the death of Saul, when David was returned from the slaughter of the Amalekites, and David had abode two days in Ziklag;","2":"It came even to pass on the third day, that, behold, a man came out of the camp from Saul with his clothes rent, and earth upon his head: and so it was, when he came to David, that he fell to the earth, and did obeisance.","3":"And David said unto him, From whence comest thou? And he said unto him, Out of the camp of Israel am I escaped.","4":"And David said unto him, How went the matter? I pray thee, tell me. And he answered, That the people are fled from the battle, and many of the people also are fallen and dead; and Saul and Jonathan his son are dead also.","5":"And David said unto the young man that told him, How knowest thou that Saul and Jonathan his son be dead?","6":"And the young man that told him said, As I happened by chance upon mount Gilboa, behold, Saul leaned upon his spear; and, lo, the chariots and horsemen followed hard after him.","7":"And when he looked behind him, he saw me, and called unto me. And I answered, Here am I.","8":"And he said unto me, Who art thou? And I answered him, I am an Amalekite.","9":"He said unto me again, Stand, I pray thee, upon me, and slay me: for anguish is come upon me, because my life is yet whole in me.","10":"So I stood upon him, and slew him, because I was sure that he could not live after that he was fallen: and I took the crown that was upon his head, and the bracelet that was on his arm, and have brought them hither unto my lord.","11":"Then David took hold on his clothes, and rent them; and likewise all the men that were with him:","12":"And they mourned, and wept, and fasted until even, for Saul, and for Jonathan his son, and for the people of the LORD, and for the house of Israel; because they were fallen by the sword.","13":"And David said unto the young man that told him, Whence art thou? And he answered, I am the son of a stranger, an Amalekite.","14":"And David said unto him, How wast thou not afraid to stretch forth thine hand to destroy the LORD'S anointed?","15":"And David called one of the young men, and said, Go near, and fall upon him. And he smote him that he died.","16":"And David said unto him, Thy blood be upon thy head; for thy mouth hath testified against thee, saying, I have slain the LORD'S anointed.","17":"And David lamented with this lamentation over Saul and over Jonathan his son:","18":"(Also he bade them teach the children of Judah the use of the bow: behold, it is written in the book of Jasher.)","19":"The beauty of Israel is slain upon thy high places: how are the mighty fallen!","20":"Tell it not in Gath, publish it not in the streets of Askelon; lest the daughters of the Philistines rejoice, lest the daughters of the uncircumcised triumph.","21":"Ye mountains of Gilboa, let there be no dew, neither let there be rain, upon you, nor fields of offerings: for there the shield of the mighty is vilely cast away, the shield of Saul, as though he had not been anointed with oil.","22":"From the blood of the slain, from the fat of the mighty, the bow of Jonathan turned not back, and the sword of Saul returned not empty.","23":"Saul and Jonathan were lovely and pleasant in their lives, and in their death they were not divided: they were swifter than eagles, they were stronger than lions.","24":"Ye daughters of Israel, weep over Saul, who clothed you in scarlet, with other delights, who put on ornaments of gold upon your apparel.","25":"How are the mighty fallen in the midst of the battle! O Jonathan, thou wast slain in thine high places.","26":"I am distressed for thee, my brother Jonathan: very pleasant hast thou been unto me: thy love to me was wonderful, passing the love of women.","27":"How are the mighty fallen, and the weapons of war perished!"}},"tsk":{"1":[{"kopje":"toen David","refs":["1 Sam 30:17-26"]},{"kopje":"Ziklag","refs":["1 Sam 27:6"]}],"2":[{"kopje":"de derde","refs":["Gen 22:4","Est 4:16","Est 5:1","Hos 6:2","Matt 12:40","Matt 16:21"]},{"kopje":"een man","refs":["2 Sam 4:10"]},{"kopje":"kleren","refs":["Gen 37:29","Gen 37:34","Joz 7:6","1 Sam 4:12","1 Sam 4:16","Joël 2:13"]},{"kopje":"en aarde","refs":["2 Sam 15:32"]},{"kopje":"hij viel","refs":["2 Sam 14:4","Gen 37:7-10","Gen 43:28","1 Sam 20:41","1 Sam 25:23","Ps 66:3","Openb 3:9"]}],"3":[{"kopje":"Waar","refs":["2 Kon 5:25"]},{"kopje":"Ik ben","refs":["Job 1:15-19"]}],"4":[{"kopje":"Wat is er gebeurd","refs":["1 Sam 4:16"]},{"kopje":"het volk","refs":["1 Sam 31:1-6","1 Kron 10:1-6"]}],"5":[{"kopje":"Hoe weet u","refs":["Spr 14:15","Spr 25:2"]}],"6":[{"kopje":"Ik kwam toevallig","refs":["Ruth 2:3","1 Sam 6:9","Luk 10:31"]},{"kopje":"gebergte","refs":["2 Sam 1:21","1 Sam 28:4","1 Sam 31:1"]},{"kopje":"Saul","refs":["1 Sam 31:2-7"]}],"7":[{"kopje":"Zie, h ik bij geval"},{"catchword":"Gilbóa;","tekst":"Gelegen in Issaschar, aan de zuidelijke grenzen. Zie 1Sa 28:4, en 1Sa 31:1."},{"catchword":"leunde op zijn spies;","tekst":"Dat is, drukte, om het scherp zijner spies te doen doordringen in zijn lichaam."},{"catchword":"ritmeesters","tekst":"Hebreeuws, de meesters, of heren der ruiters"},{"catchword":"hielden dicht op hem","tekst":"Hebreeuws, kleefden hem aan."}],"9":[{"catchword":"bij mij,","tekst":"Of, tegen mij, op mij, of staat op tegen mij; alzo vs.10."},{"catchword":"maliënkolder","tekst":"Of, geoogde, of geborduurde krijgsrok. Het Hebreeuwse woord wordt aldus hier alleen gevonden, en komt van een woord dat borduurwerk, of geoogdwerk maken, idem omvatten, inhechten in kastjes betekent. Daarom zetten het sommigen over: Deze omsingeling, bezetting, benauwing [der ruiters] ook schrik, benauwdheid, heeft mij aangeroepen"},{"catchword":"opgehouden;","tekst":"Dat de spies niet heeft kunnen doordringen in mijn lichaam."},{"catchword":"want mijn leven","tekst":"Alsof hij zeide: Ik heb vast gearbeid, om mijzelven met mijn spies het leven te benemen, maar het heeft niet willen zijn, mijn leven is nog gans in mij."}],"10":[{"catchword":"zijn val","tekst":"Nadat hij in de spies, en met dezelve was nedergevallen. Dit voegt hij daarbij om zich te ontschuldigen van Sauls dood, en de tijding, die hij bracht, te bevestigen en buiten twijfel te stellen. De lezer kan dit ganse verhaal vergelijken met 1Sa 31, en oordelen wat van de zaak is."},{"catchword":"heer gebracht","tekst":"Te weten, David, dat is, tot u."}],"11":[{"catchword":"scheurde ze;","tekst":"Gelijk boven, vs.2."}],"14":[{"catchword":"gezalfde des HEEREN","tekst":"Zie 1Sa 10:1, en 1Ki 1:14."},{"catchword":"verderven","tekst":"Dat is, te verslaan, nedervellen, doden. Vergelijk Jdg 20:21, Jdg 20:25, Jdg 20:35, Jdg 20:42, en elders."}],"15":[{"catchword":"jongens,","tekst":"Zijne dienstknechten of hovelingen."}],"16":[{"catchword":"Uw bloed zij op uw hoofd;","tekst":"Zie L eten over de zaken, die aldaar gebeurd waren. Vergelijk Jdg 5:23; Job 3, en elders."},{"catchword":"noch velden der hefofferen;","tekst":"Dat is, er moeten op deze bergen geen vruchtbare velden zijn, waarvan men hefoffers zou kunnen doen. Of, op de verheven velden, hoge velden. Hebreeuws, velden der verheffingen"},{"catchword":"smadelijk weggeworpen,","tekst":"Of, verfoeilijk, verachtelijk"},{"catchword":"hij niet gezalfd ware geweest met olie","tekst":"Namelijk, Saul, die zo smadelijk en verachtelijk gevallen was, dat het zeer deerlijk was voor een gezalfde des Heeren. Anderen duiden het op Sauls schild; gelijk men in dien tijd de schilden [als met leder overtrokken] met olie placht te zalven; zie Isa 21:5. Anders, zonder den gezalfde met olie; dat is, afgezonderd van den gezalfde enz.; namelijk van Saul."}],"22":[{"catchword":"Van het bloed der verslagenen,","tekst":"De zin is: Jonathans boog en Sauls zwaard plachten altijd zekerlijk te treffen, zodat zij niet wederkeerden zonder de dapperste krijgslieden des vijands nedergeveld te hebben; hoewel het nu, helaas, gans anders gevallen is."}],"23":[{"catchword":"lichter dan arenden,","tekst":"Dat is, sneller."}],"24":[{"catchword":"kleedde met scharlaken,","tekst":"Het land tegen de vijanden beschermende, dat het in vrede en overvloed van allen rijkdom bloeide, waarvan dit een teken was."},{"catchword":"met weelde;","tekst":"Dat is, lustiglijk, lieflijk, tederlijk, dat het lieflijk was om te zien. Anders, met [allerlei, of met andere] wellustigheden"},{"catchword":"die u sieraad van goud","tekst":"Hebreeuws, die sieraad van goud deed opkomen op uw kleding, door de oorzaak in de voorgaande aantekening vermeld, alsmede door den roof, dien hij bekwam van de vijanden."}],"25":[{"catchword":"uw hoogten","tekst":"Zie vs.19."}],"26":[{"catchword":"uw liefde","tekst":"Die gij mij toedroegt."},{"catchword":"vrouwen","tekst":"Met welke men de vrouwen liefheeft; dat is, zij overtrof de allernauwste vriendschap, die tussen mensen kan wezen, zijnde tot Davids troost in Jonathans hart ontstoken en onderhouden door den Heiligen Geest."}],"27":[{"catchword":"krijgswapenen verloren","tekst":"Of, instrumenten van oorlog; te weten, Saul en Jonathan, die als wapenen Israëls waren, en middelen, waardoor Israël beschermd werd. Men kan het ook eigenlijk verstaan van de krijgswapenen, die de Filistijnen ten buit hebben gekregen."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Moreover, it came to pass&Atilde;&copy; after Sauls death, when David was returned from the slaughter of the Amalekites, [Heb. from smiting Amalek. See the history, 1 Sam.30.] and David had tarried two days at Ziklag: [See 1 Sam.27.6.]"}],"2":[{"catchword":null,"tekst":"Then it came to pass&Atilde;&copy; on the third day, that behold, a man came out of the host, from Saul, whose clothes went rent, [In token of mourning, and grief of heart. See Genes.37.on vers.29.] and earth was upon his head: [Compare Jos.7.6. 1 Sam.4.12. and below chap.13.19. and 15.32. Job 2:12. Thus was in mourning a token of shame, unworthiness, and deep humiliation] and it came to pass, when he came to David, that he fell to the earth, and bowed himself down."}],"3":[{"catchword":null,"tekst":"And David said unto him; Whence comest thou? and he said unto him; I am escaped out of the Host of Israel."}],"4":[{"catchword":null,"tekst":"Moreover, David said unto him; What is the matter? [Or, properly what was the matter, or the business?] relate it to me, I pray thee: and he said, That the people were fled out of the battle, and that there were also many of the people fallen and dead, that also Saul, and his son Jonathan were dead."}],"5":[{"catchword":null,"tekst":"And David said unto the lad [i.e. youth, young man. See Genes.22.on vers.5.] that brought him the tidings: bow knowest thou that Saul is dead, and his son Jonathan?"}],"6":[{"catchword":null,"tekst":"Then said the young man, that brought him the tidings; I came by chance [Heb. meeting I met, or, coming by chance I came by chance] upon the mountain of Gilead; [Lying in Issaschar, on the South-borders. See 1 sam.20.1. and 31.1.] and behold, Saul leaned upon his spear: [i.e. thrusted to make the head of his spear to pierce thorow his body] and behold the charets, and the Captains [Heb. the masters, or, lords of the Horseman] held close upon him. [Heb. clave, or, stuk close to him.]"}],"7":[{"catchword":null,"tekst":"Then he looked behind him, and saw me: and he called me, and I said, Behold, (here) am I."}],"8":[{"catchword":null,"tekst":"And he said unto me; Who art thou? and I said unto him; I am an Amalekite."}],"9":[{"catchword":null,"tekst":"Then he said unto me; stand, I pray thee, by me, [Or, against me, upon me: or, stand up against me: so v.10.] and slay me, for this coat of mail [Or, eyed, or, embroidered military coat. The Hebrew word is thus only found in this place, and cometh from a word, which signfieth embroidering, or making work full of eyes, also compassing about, inlaying of precious stone in ouches eases, or, scutcheons. Therefore some translate it, this compassing about, bemming in, straitening (of the Horsemen) also terror, anguish, hath caught hold of me] hath kept me up, [That the spear could not pierce thorow into my body] for my life yet whole in me. [As if he should say, I have strongly endeavoured to take away my life with my spear, but it would not be, my life is yet whole in me]"}],"10":[{"catchword":null,"tekst":"So I stood by him, and slew him, for I knew that he would not live after his fall: [After he was fallen upon his spear, and by means thereof was fallen down. This he addeth to excuse himself of being the cause of Sauls death, and to confirm, and put out of doubt the tidings which he brought. The Reader may compare this whole relation with 1 Sam.31. and judge of the matter] and I took the Crown that was upon his head, and the Bracelet that was upon his arm, and have brought them hither unto my Lord. [viz. David: i.e. unto thee. The Reader may compare this whole relation with 1 Sam.31. and judge what truth there is in the thing.]"}],"11":[{"catchword":null,"tekst":"Then David took hold on his clothes, and rent them [As above vers.2.] likewise also all the men that were with him."}],"12":[{"catchword":null,"tekst":"And they mourned, and wept, and fasted until the evening, for Saul, and for Jonathan his son, and for the people of the LORD, and for the house of Israel, because they were fallen by the sword."}],"13":[{"catchword":null,"tekst":"Moreover, David said unto the Lad, that had brought him the tidings; whence art thou? and he said; I am the son of a stranger, an Amalekite."}],"14":[{"catchword":null,"tekst":"And David said unto him: How? wast thou not afraid to stretch forth thine hand, to destroy [i.e. to slay, smite down, kill. Compare Judge.20.on vers.21, 25, 35, 42. and elsewhere] the LORDS anointed? [See 1 Sam.10.1. and 1 Kings 1.24.]"}],"15":[{"catchword":null,"tekst":"And David called one of the Lads [His servants, or, courtiers] and said; Go near, fall upon him: and he smote him, that he died."}],"16":[{"catchword":null,"tekst":"And David said unto him; Thy blood be upon thine head: [See Judg.9.on vers.24. and Levit.20.on v.9.] for thy mouth hath witnessed against thee, saying: I have killed the LORDS anointed."}],"17":[{"catchword":null,"tekst":"Now David&acirc;&euro;&trade;s lamented (with) this lamentation, [which beginneth, ver.19.] over Saul, and over Jonathan his son;"}],"18":[{"catchword":null,"tekst":"When he had said, [i.e. commanded, given order] that they should teach the Children of Juda [From which tribe David himself was descended, and who had the promise of God concerning the Kingdom, and valour in war, Genes.49.8, 9, 10.] the bowe: [To wit, the use or handling of the bow, to grow experienced archers and souldiers, after the example of Saul and Jonathan. See vers.22. This David did in the first place to raise up the people of God after the death of their King, and to encourage them that they might not be daunted by his following lamentation] behold, it is written in the book of the upright. [Of this book, see Jos.10.on v.13. This may be understood thus, that in this book was written, what order David had given concerning them, so as to make the use and exercise of arms a thing common to his tribe.]"}],"19":[{"catchword":null,"tekst":"Ornament of Israel, [Thus he calleth God, from whom all Israels glory and ornament descended. Compare Deut.4.7, 8. and 33.29. Others apply it to Saul, or the Land of promise] he is smitten upon thy high places: [viz. Upon the mountains of Gilboa (vers.21. and 1 Sam.31.8.) which he calleth Gods high places, because they specially pertained to God, as lying in Israel] how are the champions fallen?"}],"20":[{"catchword":null,"tekst":"Relate it not at Gath, publish it not the streets of Askelon: [Gath and Askelon were both inhabited by the Philistines, lying in the South west of the mountains of Gilboa by the Sea, Gath in Dan, and Askelon in Simeon. See Judg.14.on vers.19. and below chap.21.20, 22.] lest the Daughters of the Philistines rejoice, [blasp eming and mocking God and his people: as Judg.16.23, etc.] lest the Daughters of the uncircumcised [See judg.15.on vers.18.] leap up for joy. [By outward gestures and token of joy ascribing the praise of this victory unto their Gods]"}],"21":[{"catchword":null,"tekst":"Ye mountains of Gilboa, let neither dew, nor rain be upon you, nor fields of heave-offerings: [i.e. let there be no fruitful fields upon these mountains, whereof heave-offerings might be made. Or, upon the heaved, or, lifted up fields, high fields. Heb. fields of heavings, or, liftings up. This serveth to move and stir up the Israelites at the things, that there happened. Compare Judg.5.23. Job 3. And elsewhere] for there the shield of the mighty is reproachfully [Or, loathsomely, vilely, contemptibly] cast away, the shield of Saul, as though he had not been anointed with oil, [viz. Saul, who fell so shamefully and contemptibly, that it was pitful for one that was the Lords anointed to fall so. Others apply it to Sauls shield: as they were wont in those times to anointed the shields (that were covered with lether) with oil. See Isa 21:5. Oth. Without the anointed with oil: i.e. severed from the anointed, etc. viz. from Saul.]"}],"22":[{"catchword":null,"tekst":"From the blood of the slain, from the fat of the mighty, the bow of Jonathan was not driven back, and the sword of Saul returned not empty. [The meaning is, Jonathans bow, and Sauls sword were wont ever to hit sure, so that they turned not back without having felled to the ground the stoutest and valiantest souldiers of the enemy, though it have now (alas) happened quite otherwise]"}],"23":[{"catchword":null,"tekst":"Saul and Jonathan, those beloved and close lovely (ones) in their life, were neither separated in their death: they were lighter [i.e. swister] then Eagles, they were stronger then Lions."}],"24":[{"catchword":null,"tekst":"Ye Daughters of Israel weep over Saul: who cloathed you with scarlet; [Protecting the Land against the enemies, so that it flourished in peace and abundance of all kind of riches, whereof this was a token] with delights [i.e. pleasantly, lovely, tenderly, that it was de lightful to behold. Oth. With (all manner of, or, with other] delights] who made you wear ornaments of gold upon your apparel. [Heb. who made ornaments of gold some up upon your apparel, by reason of the cause mentioned in the fore-going annotation, as also in regard of the prey, which he took from the enemies]"}],"25":[{"catchword":null,"tekst":"How are the mighty fallen in the midst of the battle? Jonathan is slain upon thy high places. [See vers.19.]"}],"26":[{"catchword":null,"tekst":"I am distressed for thy sake, my brother Jonathan; very lovely hast thou been unto me: thy love [Which thou barest to me] was more wonderful to me, then the love of women. [viz. where with men /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {

  if (!k) return;

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:"Lora";font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
