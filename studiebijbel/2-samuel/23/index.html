naam":"Openbaring","href":"../../openbaring/1/"}],"slugmap":{"Gen":"genesis","Ex":"exodus","Lev":"leviticus","Num":"numeri","Deut":"deuteronomium","Joz":"jozua","Richt":"richteren","Ruth":"ruth","1 Sam":"1-samuel","2 Sam":"2-samuel","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Verder zijn dit de laatste woorden van David. David, de zoon van Isaï, zegt, en de man die hoog is opgericht, de gezalfde van de God van Jakob, en de lieflijke psalmzanger van Israël, zegt:","2":"De Geest van de HEERE heeft door mij gesproken, en Zijn woord is op mijn tong geweest.","3":"De God van Israël heeft gezegd, de Rotssteen van Israël heeft tot mij gesproken: Er zal een Heerser zijn over de mensen, een Rechtvaardige, een Heerser in de vreze van God.","4":"En Hij zal zijn gelijk het licht van de morgen, wanneer de zon opgaat, een morgen zonder wolken, wanneer door de glans na de regen de grasscheutjes uit de aarde voortkomen.","5":"Hoewel mijn huis zo niet is bij God, heeft Hij mij toch een eeuwig verbond gesteld, dat in alles goed geordend en bewaard is; zeker is daarin al mijn heil, en alle lust, hoewel Hij het nog niet laat uitspruiten.","6":"Maar de mannen van Belial zullen allemaal zijn als doornen, die weggeworpen worden, omdat men ze met de hand niet kan vatten;","7":"maar ieder die ze zal aantasten, voorziet zich met ijzer en het hout van een speer; en zij zullen helemaal met vuur verbrand worden, op dezelfde plaats.","8":"Dit zijn de namen van de helden die David gehad heeft: Joscheb-Baschebeth, de zoon van Tachkemoni, de voornaamste van de hoofdlieden. Deze was Adino, de Ezniet, die zich stelde tegen achthonderd man, die door hem verslagen werden op één moment.","9":"En na hem was Eleazar, de zoon van Dodo, zoon van Ahohi; deze was onder de drie helden met David, toen zij de Filistijnen beschimpten, die daar ten strijde verzameld waren, en de mannen van Israël waren teruggetrokken.","10":"Deze stond op en sloeg onder de Filistijnen, totdat zijn hand moe werd, ja, zijn hand aan het zwaard kleefde; en de HEERE bracht een grote overwinning tot stand op die dag; en het volk keerde terug achter hem aan, alleen om te plunderen.","11":"Na hem nu was Samma, de zoon van Age, de Harariet. Toen de Filistijnen verzameld waren in een dorp, en daar een stuk akker was vol linzen, en het volk vluchtte voor de Filistijnen,","12":"stelde hij zich op in het midden van dat stuk, en verdedigde het, en sloeg de Filistijnen; en de HEERE bracht een grote overwinning tot stand.","13":"Ook gingen drie van de dertig hoofden af, en kwamen in de oogsttijd naar David, in de spelonk van Adullam; en de troep Filistijnen had zich gelegerd in het dal Rafaïm.","14":"En David was toen in een vesting; en de bezetting van de Filistijnen was toen te Bethlehem.","15":"En David kreeg lust en zei: Wie zal mij water te drinken geven uit Bethlehems bornput, die in de poort is?","16":"Toen braken die drie helden door het leger van de Filistijnen, en putten water uit Bethlehems bornput, die in de poort is, en droegen het, en kwamen bij David; maar hij wilde dat niet drinken, maar goot het uit voor de HEERE.","17":"En hij zei: Het zij verre van mij, o HEERE, dat ik dit zou doen; zou ik het bloed drinken van de mannen die heengegaan zijn met gevaar voor hun leven? En hij wilde het niet drinken. Dit deden die drie helden.","18":"Abisai, Joabs broer, de zoon van Zeruja, die was ook een hoofd van drie; en hij hief zijn speer op tegen driehonderd man, die door hem verslagen werden; en hij had een naam onder die drie.","19":"Was hij niet de meest geëerde van die drie? Daarom werd hij hun tot een aanvoerder. Maar hij kwam niet tot aan die eerste drie.","20":"Verder Benaja, de zoon van Jojada, de zoon van een dappere man, groot van daden, uit Kabzeel; die versloeg twee sterke leeuwen van Moab; ook ging hij af, en sloeg een leeuw in het midden van een kuil in de sneeuwtijd.","21":"Daarbij versloeg hij een Egyptische man, een man van aanzien; en in de hand van de Egyptenaar was een speer, maar hij ging op hem af met een staf; en hij rukte de speer uit de hand van de Egyptenaar, en doodde hem met zijn eigen speer.","22":"Deze dingen deed Benaja, de zoon van Jojada; daarom had hij een naam onder de drie helden.","23":"Hij was de meest geëerde van de dertig, maar tot die eerste drie kwam hij niet; en David stelde hem aan over zijn lijfwacht.","24":"Asahel, Joabs broer, was onder de dertig; Elhanan, de zoon van Dodo, van Bethlehem;","25":"Samma, de Harodiet; Elika, de Harodiet;","26":"Helez, de Paltiet; Ira, de zoon van Ikes, de Thekoiet;","27":"Abiëzer, de Anetothiet; Mebunnai, de Husathiet;","28":"Zalmon, de Ahohiet; Maharai, de Netofathiet;","29":"Heleb, de zoon van Baëna, de Netofathiet; Ithai, de zoon van Ribai, van Gibea van de kinderen van Benjamin;","30":"Benaja, de Pirhathoniet; Hiddai, van de beken van Gaäs;","31":"Abi-albon, de Arbathiet; Azmaveth, de Barhumiet;","32":"Eljachba, de Saalboniet; van de zonen van Jazen, Jonathan;","33":"Samma, de Harariet; Ahiam, de zoon van Sarar, de Harariet;","34":"Elifelet, de zoon van Ahasbai, de zoon van een Maachathiet; Eliam, de zoon van Achitofel, de Giloniet;","35":"Hezrai, de Karmeliet; Paërai, de Arbiet;","36":"Jig-al, de zoon van Nathan, van Zoba; Bani, de Gadiet;","37":"Zelek, de Ammoniet; Naharai, de Beerothiet, de wapendrager van Joab, de zoon van Zeruja;","38":"Ira, de Jethriet; Gareb, de Jethriet;","39":"Uria, de Hethiet, zevenendertig in alles."},"SV":{"1":"Voorts zijn dit de laatste woorden van David. David, de zoon van Isaï zegt, en de man, die hoog is opgericht, de gezalfde van Jakobs God, en liefelijk *in* psalmen van Israël, zegt:","2":"De Geest des HEEREN heeft door mij gesproken, en Zijn rede is op mijn tong geweest.","3":"De God Israëls heeft gezegd, de Rotssteen Israëls heeft tot mij gesproken: *Er* *zal* *zijn* een Heerser over de mensen, een Rechtvaardige, een Heerser *in* *de* vreze Gods.","4":"En Hij zal zijn gelijk het licht des morgens, *wanneer* de zon opgaat, des morgens zonder wolken, *wanneer* van den glans na den regen de grasscheutjes uit de aarde *voortkomen*.","5":"Hoewel mijn huis alzo niet is bij God, nochtans heeft Hij mij een eeuwig verbond gesteld, dat in alles wel geordineerd en bewaard is; voorzeker is *daarin* al mijn heil, en alle lust, hoewel Hij het *nog* niet doet uitspruiten.","6":"Maar de *mannen* Belials zullen altemaal zijn als doornen, die weggeworpen worden, omdat men ze met de hand niet kan vatten;","7":"Maar een iegelijk, die ze zal aantasten, voorziet zich met ijzer en het hout ener spies; en zij zullen ganselijk met vuur verbrand worden ter zelver plaats.","8":"Dit zijn de namen der helden, die David gehad heeft: Joscheb Baschebeth , *de* *zoon* *van* Tachkemoni, de voornaamste der hoofdlieden. Deze was Adino, de Ezniet, *die* *zich* *stelde* tegen achthonderd, die *van* *hem* verslagen werden op eenmaal.","9":"En na hem was Eleazar, de zoon van Dodo, zoon van Ahohi, *deze* *was* onder de drie helden met David, toen zij de Filistijnen beschimpten, *die* aldaar ten strijde verzameld waren, en de mannen van Israël waren opgetogen.","10":"Deze stond op, en sloeg onder de Filistijnen, totdat zijn hand moede werd, ja, zijn hand aan het zwaard kleefde; en de HEERE wrocht een groot heil ten zelven dage; en het volk keerde wederom hem na, alleenlijk om te plunderen.","11":"Na hem nu was Samma, de zoon van Age, de Harariet. Toen de Filistijnen verzameld waren in een dorp, en aldaar een stuk akkers was vol linzen, en het volk voor het aangezicht der Filistijnen vluchtte;","12":"Zo stelde hij zich in het midden van dat stuk, en verloste dat, en sloeg de Filistijnen; en de HEERE wrocht een groot heil.","13":"Ook gingen af drie van de dertig hoofden, en kwamen in den oogst tot David, in de spelonk van Adullam; en de hoop der Filistijnen had zich gelegerd in het dal Rafaim.","14":"En David was toen in een vesting; en de bezetting der Filistijnen was toen te Bethlehem.","15":"En David kreeg lust, en zeide: Wie zal mij water te drinken geven uit Bethlehems bornput, die in de poort is?","16":"Toen braken die drie helden door het leger der Filistijnen, en putten water uit Bethlehems bornput, die in de poort is, en droegen het, en kwamen tot David; doch hij wilde dat niet drinken, maar goot het uit voor den HEERE.","17":"En zeide: Het zij verre van mij, o HEERE, dat ik dit zou doen; zou *ik* *drinken* het bloed der mannen, die heengegaan zijn met gevaar van hun leven? En hij wilde het niet drinken. Dit deden die drie helden.","18":"Abisai, Joabs broeder, de zoon van Zeruja, die was ook een hoofd van drieën; en die hief zijn spies op tegen driehonderd, die *van* *hem* verslagen werden; en hij had een naam onder die drie.","19":"Was hij niet de heerlijkste van die drie? Daarom was hij hun tot een overste. Maar hij kwam niet tot aan die *eerste* drie.","20":"Voorts Benaja, de zoon van Jojada, de zoon van een dapperen man, groot van daden, van Kabzeel; die sloeg twee sterke leeuwen van Moab; ook ging hij af, en sloeg een leeuw in het midden van een kuil in den sneeuwtijd.","21":"Daartoe sloeg hij een Egyptischen man, een man van aanzien; en in de hand des Egyptenaars was een spies, maar hij ging tot hem af met een staf; en hij rukte de spies uit de hand des Egyptenaars, en doodde hem met zijn *eigen* spies.","22":"Die dingen deed Benaja, de zoon van Jojada; dies had hij een naam onder de drie helden.","23":"Hij was de heerlijkste van de dertig, maar tot die drie *eersten* kwam hij niet; en David stelde hem over zijn trawanten.","24":"Asahel, Joabs broeder, was onder de dertig; Elhanan, de zoon van Dodo, van Bethlehem;","25":"Samma, de Harodiet; Elika, de Harodiet;","26":"Helez, de Paltiet; Ira, de zoon van Ikes, de Thekoiet;","27":"Abi-ezer, de Anetothiet; Mebunnai, de Husathiet;","28":"Zalmon, de Ahohiet; Maharai, de Netofathiet;","29":"Heleb, de zoon van Baëna, de Netofathiet; Ithai, de zoon van Ribai, van Gibea der kinderen Benjamins;","30":"Benaja, de Pirhathoniet; Hiddai, van de beken van Gaas;","31":"Abi-albon, de Arbathiet; Azmaveth, de Barhumiet;","32":"Eljachba, de Saalboniet; van de zonen van Jazen, Jonathan;","33":"Samma, de Harariet; Ahiam, de zoon van Sarar, de Harariet;","34":"Elifelet, de zoon van Ahasbai, de zoon van een Maachathiet; Eliam, de zoon van Achitofel, de Giloniet;","35":"Hezrai, de Karmeliet; Paerai, de Arbiet;","36":"Jig-al, de zoon van Nathan, van Zoba; Bani, de Gadiet;","37":"Zelek, de Ammoniet; Naharai, de Beerothiet, de wapendrager van Joab, den zoon van Zeruja;","38":"Ira, de Jethriet; Gareb, de Jethriet;","39":"Uria, de Hethiet, zeven en dertig in alles."},"KJV":{"1":"Now these be the last words of David. David the son of Jesse said, and the man who was raised up on high, the anointed of the God of Jacob, and the sweet psalmist of Israel, said,","2":"The Spirit of the LORD spake by me, and his word was in my tongue.","3":"The God of Israel said, the Rock of Israel spake to me, He that ruleth over men must be just, ruling in the fear of God.","4":"And he shall be as the light of the morning, when the sun riseth, even a morning without clouds; as the tender grass springing out of the earth by clear shining after rain.","5":"Although my house be not so with God; yet he hath made with me an everlasting covenant, ordered in all things, and sure: for this is all my salvation, and all my desire, although he make it not to grow.","6":"But the sons of Belial shall be all of them as thorns thrust away, because they cannot be taken with hands:","7":"But the man that shall touch them must be fenced with iron and the staff of a spear; and they shall be utterly burned with fire in the same place.","8":"These be the names of the mighty men whom David had: The Tachmonite that sat in the seat, chief among the captains; the same was Adino the Eznite: he lift up his spear against eight hundred, whom he slew at one time.","9":"And after him was Eleazar the son of Dodo the Ahohite, one of the three mighty men with David, when they defied the Philistines that were there gathered together to battle, and the men of Israel were gone away:","10":"He arose, and smote the Philistines until his hand was weary, and his hand clave unto the sword: and the LORD wrought a great victory that day; and the people returned after him only to spoil.","11":"And after him was Shammah the son of Agee the Hararite. And the Philistines were gathered together into a troop, where was a piece of ground full of lentiles: and the people fled from the Philistines.","12":"But he stood in the midst of the ground, and defended it, and slew the Philistines: and the LORD wrought a great victory.","13":"And three of the thirty chief went down, and came to David in the harvest time unto the cave of Adullam: and the troop of the Philistines pitched in the valley of Rephaim.","14":"And David was then in an hold, and the garrison of the Philistines was then in Bethlehem.","15":"And David longed, and said, Oh that one would give me drink of the water of the well of Bethlehem, which is by the gate!","16":"And the three mighty men brake through the host of the Philistines, and drew water out of the well of Bethlehem, that was by the gate, and took it, and brought it to David: nevertheless he would not drink thereof, but poured it out unto the LORD.","17":"And he said, Be it far from me, O LORD, that I should do this: is not this the blood of the men that went in jeopardy of their lives? therefore he would not drink it. These things did these three mighty men.","18":"And Abishai, the brother of Joab, the son of Zeruiah, was chief among three. And he lifted up his spear against three hundred, and slew them, and had the name among three.","19":"Was he not most honourable of three? therefore he was their captain: howbeit he attained not unto the first three.","20":"And Benaiah the son of Jehoiada, the son of a valiant man, of Kabzeel, who had done many acts, he slew two lionlike men of Moab: he went down also and slew a lion in the midst of a pit in time of snow:","21":"And he slew an Egyptian, a goodly man: and the Egyptian had a spear in his hand; but he went down to him with a staff, and plucked the spear out of the Egyptian's hand, and slew him with his own spear.","22":"These things did Benaiah the son of Jehoiada, and had the name among three mighty men.","23":"He was more honourable than the thirty, but he attained not to the first three. And David set him over his guard.","24":"Asahel the brother of Joab was one of the thirty; Elhanan the son of Dodo of Bethlehem,","25":"Shammah the Harodite, Elika the Harodite,","26":"Helez the Paltite, Ira the son of Ikkesh the Tekoite,","27":"Abiezer the Anethothite, Mebunnai the Hushathite,","28":"Zalmon the Ahohite, Maharai the Netophathite,","29":"Heleb the son of Baanah, a Netophathite, Ittai the son of Ribai out of Gibeah of the children of Benjamin,","30":"Benaiah the Pirathonite, Hiddai of the brooks of Gaash,","31":"Abialbon the Arbathite, Azmaveth the Barhumite,","32":"Eliahba the Shaalbonite, of the sons of Jashen, Jonathan,","33":"Shammah the Hararite, Ahiam the son of Sharar the Hararite,","34":"Eliphelet the son of Ahasbai, the son of the Maachathite, Eliam the son of Ahithophel the Gilonite,","35":"Hezrai the Carmelite, Paarai the Arbite,","36":"Igal the son of Nathan of Zobah, Bani the Gadite,","37":"Zelek the Ammonite, Naharai the Beerothite, armourbearer to Joab the son of Zeruiah,","38":"Ira an Ithrite, Gareb an Ithrite,","39":"Uriah the Hittite: thirty and seven in all."}},"tsk":{"1":[{"kopje":"de laatste","refs":["Gen 49:1","Deut 33:1","Joz 23:1","Joz 24:32","Ps 72:20","2 Petr 1:13-15"]},{"kopje":"opgericht","refs":["2 Sam 7:8","2 Sam 7:9","Ps 78:70"]},{"kopje":"de gezalfde","refs":["1 Sam 2:10","1 Sam 16:12","1 Sam 16:13","Ps 2:6","Ps 89:21"]},{"kopje":"lieflijke psalmzanger","refs":["1 Kron 16:4","1 Kron 16:5","1 Kron 16:7","1 Kron 16:9","Amos 6:5","Luk 20:42","Luk 24:44","Ef 5:19","Ef 5:20","Kol 3:16","Jak 5:13"]}],"3":[{"kopje":"God","refs":["Gen 33:20","Ex 3:15","Ex 19:5","Ex 19:6","Ex 20:2"]},{"kopje":"de Rotssteen","refs":["2 Sam 22:2","2 Sam 22:32","Deut 32:4","Deut 32:30","Deut 32:31","Ps 42:10"]},{"kopje":"Er zal een Heerser zijn","refs":["Ps 110:2"]},{"kopje":"een Rechtvaardige","refs":["Ex 23:6-8","Deut 16:18-20","Ps 82:3","Ps 82:4","Spr 31:9","Jes 11:4","Jes 11:5","Jes 32:1","Jer 23:5","Zach 9:9","Hebr 1:8"]},{"kopje":"Heerser","refs":["Ex 18:21","2 Kron 19:7-9","Neh 5:14"]}],"4":[{"kopje":"gelijk het licht","refs":["Richt 5:31","Ps 89:37","Ps 110:3","Spr 4:18","Jes 60:1","Jes 60:3","Jes 60:18-20","Hos 6:5","Mal 4:2","Luk 1:78","Luk 1:79","Joh 1:7"]},{"kopje":"morgen","refs":["Hos 6:3"]},{"kopje":"grasscheutjes","refs":["Deut 32:2","Ps 72:6","Jes 4:2","Micha 5:6"]}],"5":[{"kopje":"Hoewel","refs":["2 Sam 7:18","2 Sam 12:10","2 Sam 13:14","2 Sam 13:28","2 Sam 18:14","1 Kon 1:5","1 Kon 2:24","1 Kon 2:25","1 Kon 11:6-8","1 Kon 12:14"]},{"kopje":"heeft Hij gesteld","refs":["2 Sam 7:14-16","1 Kron 17:11-14","Ps 89:4","Ps pan class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob,</span> and the <span class=\"wl wl-kjv\" data-code=\"H5273\">sweet</span> <span class=\"wl wl-kjv\" data-code=\"H2158\">psalmist</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">said,</span>","2":"The <span class=\"wl wl-kjv\" data-code=\"H7307\">Spirit</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> by me, and his <span class=\"wl wl-kjv\" data-code=\"H4405\">word</span> was in my <span class=\"wl wl-kjv\" data-code=\"H3956\">tongue.</span>","3":"The <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> the <span class=\"wl wl-kjv\" data-code=\"H6697\">Rock</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> to me, He that <span class=\"wl wl-kjv\" data-code=\"H4910\">ruleth</span> over <span class=\"wl wl-kjv\" data-code=\"H120\">men</span> must be <span class=\"wl wl-kjv\" data-code=\"H6662\">just,</span> <span class=\"wl wl-kjv\" data-code=\"H4910\">ruling</span> in the <span class=\"wl wl-kjv\" data-code=\"H3374\">fear</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God.</span>","4":"And he shall be as the <span class=\"wl wl-kjv\" data-code=\"H216\">light</span> of the <span class=\"wl wl-kjv\" data-code=\"H1242\">morning,</span> when the <span class=\"wl wl-kjv\" data-code=\"H8121\">sun</span> <span class=\"wl wl-kjv\" data-code=\"H2224\">riseth,</span> even a <span class=\"wl wl-kjv\" data-code=\"H1242\">morning</span> <span class=\"wl wl-kjv\" data-code=\"H3808\">without</span> <span class=\"wl wl-kjv\" data-code=\"H5645\">clouds;</span> as the tender <span class=\"wl wl-kjv\" data-code=\"H1877\">grass</span> springing out of the <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> by clear <span class=\"wl wl-kjv\" data-code=\"H5051\">shining</span> after <span class=\"wl wl-kjv\" data-code=\"H4306\">rain.</span>","5":"Although my <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> be not so with <span class=\"wl wl-kjv\" data-code=\"H410\">God;</span> yet he hath <span class=\"wl wl-kjv\" data-code=\"H7760\">made</span> with me an <span class=\"wl wl-kjv\" data-code=\"H5769\">everlasting</span> <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant,</span> <span class=\"wl wl-kjv\" data-code=\"H6186\">ordered</span> in all things, and <span class=\"wl wl-kjv\" data-code=\"H8104\">sure:</span> for this is all my <span class=\"wl wl-kjv\" data-code=\"H3468\">salvation,</span> and all my <span class=\"wl wl-kjv\" data-code=\"H2656\">desire,</span> although he make it not to <span class=\"wl wl-kjv\" data-code=\"H6779\">grow.</span>","6":"But the sons of <span class=\"wl wl-kjv\" data-code=\"H1100\">Belial</span> shall be all of them as <span class=\"wl wl-kjv\" data-code=\"H6975\">thorns</span> thrust <span class=\"wl wl-kjv\" data-code=\"H5074\">away,</span> because they cannot be <span class=\"wl wl-kjv\" data-code=\"H3947\">taken</span> with <span class=\"wl wl-kjv\" data-code=\"H3027\">hands:</span>","7":"But the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> that shall <span class=\"wl wl-kjv\" data-code=\"H5060\">touch</span> them must be <span class=\"wl wl-kjv\" data-code=\"H4390\">fenced</span> with <span class=\"wl wl-kjv\" data-code=\"H1270\">iron</span> and the <span class=\"wl wl-kjv\" data-code=\"H6086\">staff</span> of a <span class=\"wl wl-kjv\" data-code=\"H2595\">spear;</span> and they shall be <span class=\"wl wl-kjv\" data-code=\"H8313\">utterly</span> <span class=\"wl wl-kjv\" data-code=\"H8313\">burned</span> with <span class=\"wl wl-kjv\" data-code=\"H784\">fire</span> in the same <span class=\"wl wl-kjv\" data-code=\"H7675\">place.</span>","8":"These be the <span class=\"wl wl-kjv\" data-code=\"H8034\">names</span> of the mighty <span class=\"wl wl-kjv\" data-code=\"H1368\">men</span> whom <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> had: The <span class=\"wl wl-kjv\" data-code=\"H8461\">Tachmonite</span> that <span class=\"wl wl-kjv\" data-code=\"H3427\">sat</span> in the <span class=\"wl wl-kjv\" data-code=\"H7675\">seat,</span> <span class=\"wl wl-kjv\" data-code=\"H7218\">chief</span> among the <span class=\"wl wl-kjv\" data-code=\"H7991\">captains;</span> the same was <span class=\"wl wl-kjv\" data-code=\"H5722\">Adino</span> the <span class=\"wl wl-kjv\" data-code=\"H6112\">Eznite:</span> he lift up his spear against <span class=\"wl wl-kjv\" data-code=\"H8083\">eight</span> <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred,</span> whom he <span class=\"wl wl-kjv\" data-code=\"H2491\">slew</span> at <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H6471\">time.</span>","9":"And <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> him was <span class=\"wl wl-kjv\" data-code=\"H499\">Eleazar</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H1734\">Dodo</span> the <span class=\"wl wl-kjv\" data-code=\"H266\">Ahohite,</span> one of the <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> mighty <span class=\"wl wl-kjv\" data-code=\"H1368\">men</span> with <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> when they <span class=\"wl wl-kjv\" data-code=\"H2778\">defied</span> the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines</span> that were there gathered <span class=\"wl wl-kjv\" data-code=\"H622\">together</span> to <span class=\"wl wl-kjv\" data-code=\"H4421\">battle,</span> and the <span class=\"wl wl-kjv\" data-code=\"H376\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> were gone <span class=\"wl wl-kjv\" data-code=\"H5927\">away:</span>","10":"He <span class=\"wl wl-kjv\" data-code=\"H6965\">arose,</span> and <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines</span> <span class=\"wl wl-kjv\" data-code=\"H3588\">until</span> his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> was <span class=\"wl wl-kjv\" data-code=\"H3021\">weary,</span> and his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> <span class=\"wl wl-kjv\" data-code=\"H1692\">clave</span> unto the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword:</span> and the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">wrought</span> a <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H8668\">victory</span> that <span class=\"wl wl-kjv\" data-code=\"H3117\">day;</span> and the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">returned</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> him only to <span class=\"wl wl-kjv\" data-code=\"H6584\">spoil.</span>","11":"And <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> him was <span class=\"wl wl-kjv\" data-code=\"H8048\">Shammah</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H89\">Agee</span> the <span class=\"wl wl-kjv\" data-code=\"H2043\">Hararite.</span> And the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines</span> were gathered <span class=\"wl wl-kjv\" data-code=\"H622\">together</span> into a <span class=\"wl wl-kjv\" data-code=\"H2416\">troop,</span> where was a <span class=\"wl wl-kjv\" data-code=\"H2513\">piece</span> of <span class=\"wl wl-kjv\" data-code=\"H7704\">ground</span> <span class=\"wl wl-kjv\" data-code=\"H4392\">full</span> of <span class=\"wl wl-kjv\" data-code=\"H5742\">lentiles:</span> and the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H5127\">fled</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">from</span> the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines.</span>","12":"But he <span class=\"wl wl-kjv\" data-code=\"H3320\">stood</span> in the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> of the <span class=\"wl wl-kjv\" data-code=\"H2513\">ground,</span> and <span class=\"wl wl-kjv\" data-code=\"H5337\">defended</span> it, and <span class=\"wl wl-kjv\" data-code=\"H5221\">slew</span> the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines:</span> and the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">wrought</span> a <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H8668\">victory.</span>","13":"And <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> of the <span class=\"wl wl-kjv\" data-code=\"H7970\">thirty</span> <span class=\"wl wl-kjv\" data-code=\"H7218\">chief</span> went <span class=\"wl wl-kjv\" data-code=\"H3381\">down,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> in the harvest <span class=\"wl wl-kjv\" data-code=\"H7105\">time</span> unto the <span class=\"wl wl-kjv\" data-code=\"H4631\">cave</span> of <span class=\"wl wl-kjv\" data-code=\"H5725\">Adullam:</span> and the <span class=\"wl wl-kjv\" data-code=\"H2416\">troop</span> of the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines</span> <span class=\"wl wl-kjv\" data-code=\"H2583\">pitched</span> in the <span class=\"wl wl-kjv\" data-code=\"H6010\">valley</span> of <span class=\"wl wl-kjv\" data-code=\"H7497\">Rephaim.</span>","14":"And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> was then in an <span class=\"wl wl-kjv\" data-code=\"H4686\">hold,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4673\">garrison</span> of the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines</span> was then in <span class=\"wl wl-kjv\" data-code=\"H1035\">Bethlehem.</span>","15":"And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H183\">longed,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Oh that one would give me <span class=\"wl wl-kjv\" data-code=\"H8248\">drink</span> of the <span class=\"wl wl-kjv\" data-code=\"H4325\">water</span> of the <span class=\"wl wl-kjv\" data-code=\"H953\">well</span> of <span class=\"wl wl-kjv\" data-code=\"H1035\">Bethlehem,</span> which is by the <span class=\"wl wl-kjv\" data-code=\"H8179\">gate!</span>","16":"And the <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> mighty <span class=\"wl wl-kjv\" data-code=\"H1368\">men</span> brake <span class=\"wl wl-kjv\" data-code=\"H1234\">through</span> the <span class=\"wl wl-kjv\" data-code=\"H4264\">host</span> of the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines,</span> and <span class=\"wl wl-kjv\" data-code=\"H7579\">drew</span> <span class=\"wl wl-kjv\" data-code=\"H4325\">water</span> out of the <span class=\"wl wl-kjv\" data-code=\"H953\">well</span> of <span class=\"wl wl-kjv\" data-code=\"H1035\">Bethlehem,</span> that was by the <span class=\"wl wl-kjv\" data-code=\"H8179\">gate,</span> and <span class=\"wl wl-kjv\" data-code=\"H5375\">took</span> it, and <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> it to <span class=\"wl wl-kjv\" data-code=\"H1732\">David:</span> nevertheless he <span class=\"wl wl-kjv\" data-code=\"H14\">would</span> not <span class=\"wl wl-kjv\" data-code=\"H8354\">drink</span> thereof, but poured it <span class=\"wl wl-kjv\" data-code=\"H5258\">out</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD.</span>","17":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Be it <span class=\"wl wl-kjv\" data-code=\"H2486\">far</span> from me, O <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> that I should <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> this: is not this the <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> of the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> that <span class=\"wl wl-kjv\" data-code=\"H1980\">went</span> in jeopardy of their <span class=\"wl wl-kjv\" data-code=\"H5315\">lives?</span> therefore he <span class=\"wl wl-kjv\" data-code=\"H14\">would</span> not <span class=\"wl wl-kjv\" data-code=\"H8354\">drink</span> it. These things <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> these <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> mighty <span class=\"wl wl-kjv\" data-code=\"H1368\">men.</span>","18":"And <span class=\"wl wl-kjv\" data-code=\"H52\">Abishai,</span> the <span class=\"wl wl-kjv\" data-code=\"H251\">brother</span> of <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab,</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H6870\">Zeruiah,</span> was <span class=\"wl wl-kjv\" data-code=\"H7218\">chief</span> among <span class=\"wl wl-kjv\" data-code=\"H7992\">three.</span> And he lifted <span class=\"wl wl-kjv\" data-code=\"H5782\">up</span> his <span class=\"wl wl-kjv\" data-code=\"H2595\">spear</span> against <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred,</span> and <span class=\"wl wl-kjv\" data-code=\"H2491\">slew</span> them, and had the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> among <span class=\"wl wl-kjv\" data-code=\"H7969\">three.</span>","19":"Was he not most <span class=\"wl wl-kjv\" data-code=\"H3513\">honourable</span> of <span class=\"wl wl-kjv\" data-code=\"H7969\">three?</span> therefore he was their <span class=\"wl wl-kjv\" data-code=\"H8269\">captain:</span> howbeit he <span class=\"wl wl-kjv\" data-code=\"H935\">attained</span> not unto the first <span class=\"wl wl-kjv\" data-code=\"H7969\">three.</span>","20":"And <span class=\"wl wl-kjv\" data-code=\"H1141\">Benaiah</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H3077\">Jehoiada,</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of a <span class=\"wl wl-kjv\" data-code=\"H2428\">valiant</span> <span class=\"wl wl-kjv\" data-code=\"H376\">man,</span> of <span class=\"wl wl-kjv\" data-code=\"H6909\">Kabzeel,</span> who had done <span class=\"wl wl-kjv\" data-code=\"H7227\">many</span> <span class=\"wl wl-kjv\" data-code=\"H6467\">acts,</span> he <span class=\"wl wl-kjv\" data-code=\"H5221\">slew</span> <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> lionlike <span class=\"wl wl-kjv\" data-code=\"H739\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab:</span> he went <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> also and <span class=\"wl wl-kjv\" data-code=\"H5221\">slew</span> a <span class=\"wl wl-kjv\" data-code=\"H738\">lion</span> in the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> of a <span class=\"wl wl-kjv\" data-code=\"H953\">pit</span> in <span class=\"wl wl-kjv\" data-code=\"H3117\">time</span> of <span class=\"wl wl-kjv\" data-code=\"H7950\">snow:</span>","21":"And he <span class=\"wl wl-kjv\" data-code=\"H2026\">slew</span> an <span class=\"wl wl-kjv\" data-code=\"H4713\">Egyptian,</span> a <span class=\"wl wl-kjv\" data-code=\"H4758\">goodly</span> <span class=\"wl wl-kjv\" data-code=\"H376\">man:</span> and the <span class=\"wl wl-kjv\" data-code=\"H4713\">Egyptian</span> had a <span class=\"wl wl-kjv\" data-code=\"H2595\">spear</span> in his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand;</span> but he went <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> to him with a <span class=\"wl wl-kjv\" data-code=\"H7626\">staff,</span> and <span class=\"wl wl-kjv\" data-code=\"H1497\">plucked</span> the <span class=\"wl wl-kjv\" data-code=\"H2595\">spear</span> out of the <span class=\"wl wl-kjv\" data-code=\"H4713\">Egyptian's</span> <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> and <span class=\"wl wl-kjv\" data-code=\"H5221\">slew</span> him with his own <span class=\"wl wl-kjv\" data-code=\"H2595\">spear.</span>","22":"These things <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> <span class=\"wl wl-kjv\" data-code=\"H1141\">Benaiah</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H3077\">Jehoiada,</span> and had the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> among <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> mighty <span class=\"wl wl-kjv\" data-code=\"H1368\">men.</span>","23":"He was more <span class=\"wl wl-kjv\" data-code=\"H3513\">honourable</span> than the <span class=\"wl wl-kjv\" data-code=\"H7970\">thirty,</span> but he <span class=\"wl wl-kjv\" data-code=\"H935\">attained</span> not to the first <span class=\"wl wl-kjv\" data-code=\"H7969\">three.</span> And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H7760\">set</span> him over his <span class=\"wl wl-kjv\" data-code=\"H4928\">guard.</span>","24":"<span class=\"wl wl-kjv\" data-code=\"H6214\">Asahel</span> the <span class=\"wl wl-kjv\" data-code=\"H251\">brother</span> of <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab</span> was one of the <span class=\"wl wl-kjv\" data-code=\"H7970\">thirty;</span> <span class=\"wl wl-kjv\" data-code=\"H445\">Elhanan</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H1734\">Dodo</span> of <span class=\"wl wl-kjv\" data-code=\"H1035\">Bethlehem,</span>","25":"<span class=\"wl wl-kjv\" data-code=\"H8048\">Shammah</span> the <span class=\"wl wl-kjv\" data-code=\"H2733\">Harodite,</span> <span class=\"wl wl-kjv\" ,"tekst":"Versta, onzen eeuwigen geestelijken Koning en Heere Jezus Christus, wiens voorbeeld David, [alsook Salomo] geweest is, en van welken hem God geopenbaard had, dat hij uit zijn zaad [naar het vlees] zou voortkomen. Vergelijk Psa 2:8, en Psa 72:8; Jer 30:21; Mic 5:1. Anderen nemen het als een beschrijving van de deugden en schuldige plichten der regenten, passende ook daarop de volgende gelijkenis, vs.4, als waardoor beduid is de aangenaamheid en nuttigheid van zulke regenten, gelijk David en Salomo geweest zijn, hoewel gebrekkelijk in vele."},{"catchword":"Rechtvaardige,","tekst":"Zie Isa 53:11; Jer 23:5-6, en Jer 33:15-16; Zec 9:9 met de aantekeningen."},{"catchword":"vreze Gods","tekst":"Vergelijk Isa 11:2-3."}],"4":[{"catchword":"gelijk het licht des morgens,","tekst":"Dat is, de komst van den Messias, en de verrichting van zijn zaligmakend ambt, zal zo lieflijk, aangenaam, nuttig en vruchtbaar zijn voor zijn kerk, als de zaken, in deze gelijkenis verhaald, voor de aarde en haar gewas zijn. Vergelijk met vs.4, Hos 6:3; Psa 110:3; idem Isa 60:1-2; Mal 4:2; Luk 1:78, en voorts Isa 44:3-4, enz., en Isa 55:10-11, enz."}],"5":[{"catchword":"Hoewel mijn huis","tekst":"David belijdt hier zijne en zijns huizes zonden en onwaardigheid. [Vergelijk 2Sa 7:18-19, enz., en zie 2Sa 11, 2Sa 12, 2Sa 13, 2Sa 15, enz.], en roemt daartegen Gods onverdiende weldadigheid, hem bewezen door het eeuwig en onveranderlijk genadeverbond, zijnde gegrond in den Messias, wiens dag David [gelijk Abraham] door het geloof ziende, daarop getroost en verheugd in den Heere ontslapen is. Vergelijk 2Sa 22:51, en Psa 72:20, met de aantekeningen."},{"catchword":"wel geordineerd","tekst":"Dat is, hetwelk in Gods eeuwigen raad, tot zijn eer en zaligheid zijns volks, met alle middelen daartoe behorende, wijselijk besloten en voorgeschikt is, en tot de eindelijke vervulling toe zo vast bewaard is en gehouden zal worden, dat de poorten der hel daartegen niet zullen vermogen. Vergelijk Mat 16:18; Act 13:23, Act 13:32-33, enz.; Eph 1:3-4, enz.; 1Pe 1:5, 1Pe 1:510-11 enz."},{"catchword":"uitspruiten","tekst":"Dat is, hoewel de beloofde Scheut, of Spruit van Isaï en David, de Middelaar des verbonds, de Messias, nog niet is gekomen. Vergelijk Isa 4:2, en Isa 11:1; Jer 23:5, en Jer 33:15; Zec 3:8, en Zec 6:12. Sommigen verstaan dat David in vs.4 en vs.5 tegen elkander stelt de vergankelijkheid der dingen, die in vs.4 verhaald staan, en de eeuwigheid zijns koninkrijks en van zijn huis in den Messias, die uit zijn zaad voortkomen zou, en zetten deze verzen aldus over: 4"}],"6":[{"catchword":"Belials","tekst":"Dat is, verworpenen, goddelozen, deugnieten, verachters en vijanden van het koninkrijk van Christus. Zie van dit woord Deu 13:13."}],"7":[{"catchword":"voorziet zich","tekst":"Hebreeuws, wordt vervuld; dat is, hij vult zijn hand, hij voorziet zich eerst met enig instrument, waarmede hij de doornen onbeschadigd kan behandelen."},{"catchword":"ganselijk","tekst":"Hebreeuws, verbrandende verbrand worden"},{"catchword":"ter zelver plaats","tekst":"Waar zij zijn gewassen, of heengeworpen waar zij liggen. Hebreeuws eigenlijk, in de zitplaats, of verblijfplaats, of stoel."}],"8":[{"catchword":"helden,","tekst":"Alzo worden hier genoemd Davids voornaamste krijgsofficieren, vanwege hun bijzondere dapperheid, manhaftigheid en onversaagdheid in den oorlog. De orde, die onder hen naar hun dapperheid en verdienste van David is aangesteld, is zeer aanmerkelijk."},{"catchword":"Joscheb Baschébeth,","tekst":"1Ch 11:11 wordt hij genoemd Jaschobham; uit welke plaats het woord zoon hier ook is ingevoegd, gelijk ook aldaar Chachmoni wordt gesteld voor Tachkemoni"},{"catchword":"de voornaamste","tekst":"Hebreeuws, het hoofd"},{"catchword":"die zich stelde","tekst":"Anders, [die de overhand had] over, of tegen, enz."},{"catchword":"die van hem","tekst":"Vergelijk 1Ch 11:11. Sommigen menen dat van deze achthonderd maar driehonderd op de plaats zijn dood gebleven, omdat dit getal in het const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    const inhoud = lijst.map(it => it.catchword
      ? `<div class="uitleg-item"><span class="uitleg-cw">${md(it.catchword)}</span>${md(it.tekst)}</div>`
      : `<div class="uitleg-item">${md(it.tekst)}</div>`
    ).join('');
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {

    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>

      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
