Baëna, en de naam van de ander Rechab, zonen van Rimmon, de Beerothiet, uit de kinderen van Benjamin; want ook Beeroth werd tot Benjamin gerekend.", "3": "En de Beerothieten waren gevlucht naar Gitthaïm, en waren daar vreemdelingen tot op deze dag.", "4": "En Jonathan, Sauls zoon, had een zoon die aan beide voeten gewond was; hij was vijf jaar oud toen het bericht over Saul en Jonathan uit Jizreël kwam; en zijn voedster nam hem op en vluchtte; en het gebeurde, toen zij zich haastte om te vluchten, dat hij viel en kreupel werd; en zijn naam was Mefiboseth.", "5": "En de zonen van Rimmon, de Beerothiet, Rechab en Baëna, gingen op weg en kwamen naar het huis van Isboseth toen de dag heet geworden was; en hij lag op zijn bed, in de middag.", "6": "En zij kwamen daar tot midden in het huis, alsof zij tarwe kwamen halen, en zij sloegen hem in de buik; en Rechab en zijn broer Baëna ontkwamen.", "7": "Want toen zij het huis binnenkwamen, terwijl hij op zijn bed lag, in zijn slaapkamer, sloegen zij hem, en doodden hem, en hakten zijn hoofd af; en zij namen zijn hoofd en gingen weg, de weg over het vlakke veld, de hele nacht.", "8": "En zij brachten het hoofd van Isboseth naar David te Hebron, en zeiden tegen de koning: Zie, hier is het hoofd van Isboseth, de zoon van Saul, uw vijand, die u naar het leven stond; zo heeft de HEERE mijn heer de koning op deze dag wraak gegeven over Saul en over zijn nageslacht.", "9": "Maar David antwoordde Rechab en zijn broer Baëna, de zonen van Rimmon, de Beerothiet, en zei tegen hen: *Zo waarachtig als* de HEERE leeft, Die mijn ziel uit alle benauwdheid verlost heeft!", "10": "Toen hij die mij het bericht bracht en zei: Zie, Saul is dood – terwijl hij zelf dacht dat hij goed nieuws bracht – heb ik hem gegrepen en te Ziklag gedood, hoewel hij *meende* dat ik hem daarvoor loon zou geven;", "11": "Hoeveel te meer, wanneer goddeloze mannen een rechtvaardig man in zijn eigen huis op zijn bed hebben gedood? Zou ik dan nu zijn bloed niet van uw handen eisen, en u van de aarde wegdoen?", "12": "En David gaf zijn knechten bevel, en zij doodden hen, en hakten hun handen en hun voeten af, en hingen ze op bij de vijver te Hebron; maar het hoofd van Isboseth namen zij en begroeven het in Abners graf te Hebron."}, "SV": {"1": "Als nu Sauls zoon hoorde, dat Abner te Hebron gestorven was, werden zijn handen slap, en gans Israël werd verschrikt.", "2": "En Sauls zoon had twee mannen, oversten van benden; de naam des enen was Baëna, en de naam des anderen Rechab, zonen van Rimmon, den Beerothiet, van de kinderen van Benjamin; want ook Beeroth werd aan Benjamin gerekend.", "3": "En de Beerothieten waren gevloden naar Gitthaim, en waren aldaar vreemdelingen tot op dezen dag.", "4": "En Jonathan, Sauls zoon, had een zoon, die geslagen was aan beide voeten; vijf jaren was hij oud als het gerucht van Saul en Jonathan uit Jizreël kwam; en zijn voedster hem opnam, en vluchtte; en het geschiedde, als zij haastte, om te vluchten, dat hij viel en kreupel werd; en zijn naam was Mefiboseth.", "5": "En de zonen van Rimmon: den Beerothiet, Rechab en Baëna, gingen heen, en kwamen ten huize van Isboseth, als de dag heet geworden was; en hij lag op de slaapstede, in den middag.", "6": "En zij kwamen daarin tot het midden des huizes, *als* zullende tarwe halen; en zij sloegen hem aan de vijfde rib; en Rechab en zijn broeder Baëna ontkwamen.", "7": "Want zij kwamen in huis, als hij op zijn bed lag, in zijn slaapkamer, en sloegen hem, en doodden hem, en hieuwen zijn hoofd af; en zij namen zijn hoofd, en gingen henen, den weg op het vlakke veld, den gansen nacht.", "8": "En zij brachten het hoofd van Isboseth tot David te Hebron, en zeiden tot den koning: Zie, daar is het hoofd van Isboseth, den zoon van Saul, uw vijand, die uw ziel zocht, alzo heeft de HEERE mijn heer den koning te dezen dage wrake gegeven van Saul en van zijn zaad.", "9": "Maar David antwoordde Rechab en zijn broeder Baëna, den zonen van Rimmon, den Beerothiet, en zeide tot hen: *Zo* *waarachtig* *als* de HEERE leeft, Die mijn ziel uit alle benauwdheid verlost heeft!", "10": "Dewijl ik hem, die mij boodschapte, zeggende: Zie, Saul is dood; daar hij in zijn ogen was als een, die goede boodschap bracht, nochtans gegrepen en te Ziklag gedood heb, hoewel hij *meende*, dat ik hem bodenloon zou geven;", "11": "Hoeveel te meer, wanneer goddeloze mannen een rechtvaardigen man in zijn huis op zijn slaapstede hebben gedood? Nu dan, zou ik zijn bloed van uw handen niet eisen, en u van de aarde wegdoen?", "12": "En David gebood zijn jongens, en zij doodden hen, en hieuwen hun handen en hun voeten af, en hingen ze op bij den vijver te Hebron, maar het hoofd van Isboseth namen zij, en begroeven het in Abners graf te Hebron."}, "KJV": {"1": "And when Saul's son heard that Abner was dead in Hebron, his hands were feeble, and all the Israelites were troubled.", "2": "And Saul's son had two men that were captains of bands: the name of the one was Baanah, and the name of the other Rechab, the sons of Rimmon a Beerothite, of the children of Benjamin: (for Beeroth also was reckoned to Benjamin:", "3": "And the Beerothites fled to Gittaim, and were sojourners there until this day.)", "4": "And Jonathan, Saul's son, had a son that was lame of his feet. He was five years old when the tidings came of Saul and Jonathan out of Jezreel, and his nurse took him up, and fled: and it came to pass, as she made haste to flee, that he fell, and became lame. And his name was Mephibosheth.", "5": "And the sons of Rimmon the Beerothite, Rechab and Baanah, went, and came about the heat of the day to the house of Ishbosheth, who lay on a bed at noon.", "6": "And they came thither into the midst of the house, as though they would have fetched wheat; and they smote him under the fifth rib: and Rechab and Baanah his brother escaped.", "7": "For when they came into the house, he lay on his bed in his bedchamber, and they smote him, and slew him, and beheaded him, and took his head, and gat them away through the plain all night.", "8": "And they brought the head of Ishbosheth unto David to Hebron, and said to the king, Behold the head of Ishbosheth the son of Saul thine enemy, which sought thy life; and the LORD hath avenged my lord the king this day of Saul, and of his seed.", "9": "And David answered Rechab and Baanah his brother, the sons of Rimmon the Beerothite, and said unto them, As the LORD liveth, who hath redeemed my soul out of all adversity,", "10": "When one told me, saying, Behold, Saul is dead, thinking to have brought good tidings, I took hold of him, and slew him in Ziklag, who thought that I would have given him a reward for his tidings:", "11": "How much more, when wicked men have slain a righteous person in his own house upon his bed? shall I not therefore now require his blood of your hand, and take you away from the earth?", "12": "And David commanded his young men, and they slew them, and cut off their hands and their feet, and hanged them up over the pool in Hebron. But they took the head of Ishbosheth, and buried it in the sepulchre of Abner in Hebron."}}, "tsk": {"1": [{"kopje": "zijn handen", "refs": ["2 Sam 17:2", "Ezra 4:4", "Neh 6:9", "Jes 13:7", "Jes 35:3", "Jer 6:24", "Jer 50:43", "Zef 3:16"]}, {"kopje": "en heel Israël", "refs": ["Matt 2:2", "Matt 2:3"]}], "2": [{"kopje": "aanvoerders", "refs": ["2 Sam 3:22", "2 Kon 5:2", "2 Kon 6:23"]}, {"kopje": "Beeroth", "refs": ["Joz 9:17", "Joz 18:25"]}], "4": [{"kopje": "Jonathan", "refs": ["2 Sam 9:3"]}, {"kopje": "toen het bericht", "refs": ["1 Sam 29:1", "1 Sam 29:11", "1 Sam 31:1-10"]}, {"kopje": "Mefiboseth", "refs": ["1 Kron 8:34", "1 Kron 9:40"]}], "5": [{"kopje": "gingen op weg", "refs": ["2 Kron 24:25", "2 Kron 25:27", "2 Kron 33:24"]}, {"kopje": "lag op zijn bed", "refs": ["2 Sam 11:2", "1 Kon 16:9", "Spr 24:33", "Spr 24:34", "1 Tess 5:3-7"]}], "6": [{"kopje": "in de buik", "refs": ["2 Sam 2:23", "2 Sam 3:27", "2 Sam 20:10"]}], "7": [{"kopje": "namen zij ef": "../../2-samuel/4/#v12", "ref": "2 Sam 4:12", "svLabel": null}], "kinderen": []}]}, {"topic": "Hands, The", "href": "../../torrey/h/#t-hands-the", "kinderen": [{"label": "Criminals Often", "href": "../../torrey/h/?hl=2Sam.4.12#i8185", "refs": [], "kinderen": [{"label": "Deprived of", "href": "../../torrey/h/?hl=2Sam.4.12#i8187", "refs": [{"disp": "Deut 25:12", "href": "../../deuteronomium/25/#v12", "ref": "Deut 25:12", "svLabel": null}, {"disp": "2 Sam 4:12", "href": "../../2-samuel/4/#v12", "ref": "2 Sam 4:12", "svLabel": null}], "kinderen": []}]}]}, {"topic": "Pools And Ponds", "href": "../../torrey/p/#t-pools-and-ponds", "kinderen": [{"label": "Mentioned In Scripture", "href": "../../torrey/p/?hl=2Sam.4.12#i15153", "refs": [], "kinderen": [{"label": "Hebron", "href": "../../torrey/p/?hl=2Sam.4.12#i15156", "refs": [{"disp": "2 Sam 4:12", "href": "../../2-samuel/4/#v12", "ref": "2 Sam 4:12", "svLabel": null}], "kinderen": []}]}]}, {"topic": "Punishments", "href": "../../torrey/p/#t-punishments", "kinderen": [{"label": "Secondary Kinds Of", "href": "../../torrey/p/?hl=2Sam.4.12#i16846", "refs": [], "kinderen": [{"label": "Cutting off hands and feet", "href": "../../torrey/p/?hl=2Sam.4.12#i16859", "refs": [{"disp": "2 Sam 4:12", "href": "../../2-samuel/4/#v12", "ref": "2 Sam 4:12", "svLabel": null}], "kinderen": []}]}]}]}}, "extern": {"Luk 18:8": "Ik zeg u dat Hij hun snel recht zal doen. Maar de Zoon des mensen, zal Hij, als Hij komt, geloof vinden op de aarde?", "Ps 107:2": "Laat dat de bevrijden van de HEERE zeggen, die Hij uit de hand van de tegenstander bevrijd heeft.", "2 Sam 11:2": "Zo gebeurde het tegen de avondtijd, dat David van zijn bed opstond, en wandelde op het dak van het koningshuis, en zag van het dak een vrouw die zich waste; deze vrouw nu was zeer schoon van uiterlijk.", "Ex 21:12": "Wie iemand slaat, zodat hij sterft, die zal zeker gedood worden.", "Spr 25:26": "De rechtvaardige, wankelend voor het aangezicht van de goddeloze, is een beroerde bron, en een verdorven springader.", "2 Sam 3:22": "En zie, Davids dienaren en Joab kwamen terug van een strooptocht, en brachten een grote buit met zich mee. Abner was toen niet bij David te Hebron, want hij had hem laten gaan, en hij was in vrede vertrokken.", "Ps 34:7": "Zain. Deze ellendige riep, en de HEERE hoorde; en Hij verloste hem uit al zijn benauwdheden.", "2 Sam 1:2-16": "dat het op de derde dag gebeurde dat er, kijk, uit het leger van Saul een man kwam, wiens kleren gescheurd waren, en aarde was op zijn hoofd; en het gebeurde, toen hij bij David kwam, dat hij ter aarde viel en zich neerboog. En David zei tegen hem: Waar komt u vandaan? En hij zei tegen hem: Ik ben ontkomen uit het leger van Israël. Verder zei David tegen hem: Wat is er gebeurd? Vertel het mij toch. En hij zei dat het volk uit de strijd gevlucht was, en dat er ook velen van het volk gevallen en gestorven waren, en dat ook Saul en zijn zoon Jonathan dood waren.", "1 Sam 31:1-6": "De Filistijnen streden tegen Israël; en de mannen van Israël vluchtten voor de Filistijnen, en vielen verslagen op het gebergte Gilboa. En de Filistijnen zaten Saul en zijn zonen dicht op de hielen; en de Filistijnen versloegen Jonathan, en Abinadab, en Malchisua, de zonen van Saul. En de strijd werd zwaar tegen Saul; en de mannen die met de boog schieten, troffen hem, en hij werd zeer bang voor de schutters.", "1 Sam 25:29": "Wanneer een mens opstaat om u te vervolgen en om uw ziel te zoeken, dan zal de ziel van mijn heer ingebonden zijn in het bundeltje van de levenden bij de HEERE, uw God; maar de ziel van uw vijanden zal Hij wegslingeren uit de holte van de slinger.", "Gen 48:16": "Die Engel, Die mij verlost heeft van alle kwaad, zegent deze jongens, en laat in hen mijn naam genoemd worden, en de naam van mijn vaders Abraham en Izak, en laat hen vermenigvuldigen als vissen in menigte, midden in het land!", "Jes 13:7": "Daarom zullen alle handen slap worden, en het hart van elk mens zal versmelten;", "1 Sam 18:11": "En Saul wierp de speer, en zei: Ik zal David aan de wand spietsen; maar David week tweemaal voor hem opzij.", "Zef 3:16": "Op die dag zal tegen Jeruzalem gezegd worden: Vrees niet, o Sion! Laat uw handen niet slap worden.", "2 Sam 9:3": "En de koning zei: Is er nog iemand van het huis van Saul, zodat ik Gods goedheid aan hem kan bewijzen? Toen zei Ziba tegen de koning: Er is nog een zoon van Jonathan, die aan beide voeten verlamd is.", "Matt 7:2": "Want met het oordeel waarmee u oordeelt, zult u geoordeeld worden; en met de maat waarmee u meet, zal u weer gemeten worden.", "1 Sam 29:1": "De Filistijnen hadden al hun legers verzameld te Afek; en de Israëlieten legerden zich bij de bron die bij Jizreël is.", "1 Kron 9:40": "En Jonathans zoon was Merib-baal, en Merib-baal verwekte Micha.", "2 Kon 10:7": "Het gebeurde dan, toen die brief tot hen kwam, dat zij de zonen van de koning namen, en zeventig mannen slachtten; en zij legden hun hoofden in korven, die zij tot hem zonden naar Jizreël.", "Ps 71:24": "Ook zal mijn tong Uw gerechtigheid de hele dag uitspreken, want zij zijn beschaamd, want zij zijn schaamrood geworden, die mijn kwaad zoeken.", "1 Sam 31:1-10": "De Filistijnen streden tegen Israël; en de mannen van Israël vluchtten voor de Filistijnen, en vielen verslagen op het gebergte Gilboa. En de Filistijnen zaten Saul en zijn zonen dicht op de hielen; en de Filistijnen versloegen Jonathan, en Abinadab, en Malchisua, de zonen van Saul. En de strijd werd zwaar tegen Saul; en de mannen die met de boog schieten, troffen hem, en hij werd zeer bang voor de schutters.", "Richt 1:7": "Toen zei Adoni-bezek: Zeventig koningen, van wie de duimen van hun handen en voeten waren afgehouwen, verzamelden de kruimen onder mijn tafel; zoals ik gedaan heb, zo heeft God mij vergolden! En zij brachten hem naar Jeruzalem, en hij stierf daar.", "2 Sam 1:15": "En David riep een van de jongens, en zei: Kom dichterbij, val hem aan. En hij sloeg hem, zodat hij stierf.", "2 Sam 11:14-17": "'s Morgens nu gebeurde het, dat David een brief schreef aan Joab; en hij stuurde die door de hand van Uria. En hij schreef in die brief: Stel Uria vooraan tegenover de sterkste strijd, en trek u van achter hem terug, opdat hij geslagen wordt en sterft. Zo gebeurde het, toen Joab op de stad had gelet, dat hij Uria stelde op de plaats waarvan hij wist dat daar strijdbare mannen waren.", "Joz 18:25": "Gibeon, en Rama, en Beeroth,", "2 Sam 1:13-16": "Verder zei David tegen de jongeman die hem de boodschap gebracht had: Waar komt u vandaan? En hij zei: Ik ben de zoon van een vreemdeling, van een Amalekiet. En David zei tegen hem: Hoe hebt u niet gevreesd uw hand uit te strekken om de gezalfde van de HEERE te doden? En David riep een van de jongens, en zei: Kom dichterbij, val hem aan. En hij sloeg hem, zodat hij stierf.", "Ps 9:13": "Want Hij zoekt de bloedstortingen, Hij gedenkt daarvan; Hij vergeet het geroep van de ellendigen niet.", "2 Sam 3:39": "Maar ik ben vandaag teder, hoewel tot koning gezalfd, en deze mannen, de zonen van Zeruja, zijn te hard voor mij; de HEERE zal de boosdoener vergelden naar zijn boosheid.", "Ps 63:11": "Men zal hen neervellen door het geweld van het zwaard; zij zullen het deel van de vossen worden.", "Ps 34:18": "Tsade. Zij roepen, en de HEERE hoort, en Hij redt hen uit al hun benauwdheden.", "1 Sam 22:17": "En de koning zei tegen de lijfwachten die bij hem stonden: Wend u om, en dood de priesters van de HEERE, omdat hun hand ook met David is, en omdat zij geweten hebben dat hij vluchtte, en het mij niet hebben laten horen. Doch de knechten van de koning wilden hun hand niet uitsteken om de priesters van de HEERE aan te vallen.", "1 Kon 2:25": "En de koning Salomo stuurde Benaja, de zoon van Jojada; die viel op hem aan, zodat hij stierf.", "Neh 6:9": "Want zij allen probeerden ons bang te maken, met de gedachte: Hun handen zullen van het werk aflaten, zodat het niet klaarkomt. Nu dan, sterk mijn handen!", "1 Joh 3:12": "Niet zoals Kaïn, die uit de boze was en zijn broeder doodsloeg; en waarom sloeg hij hem dood? Omdat zijn werken slecht waren, en die van zijn broeder rechtvaardig.", "Richt 1:6": "Maar Adoni-bezek vluchtte; en zij achtervolgden hem, en grepen hem, en hieuwen de duimen van zijn handen en zijn voeten af.", "2 Tim 4:18": "En de Heere zal mij verlossen van alle slecht werk, en bewaren tot Zijn hemels Koninkrijk; aan Hem zij de heerlijkheid, tot in alle eeuwigheid. Amen.", "2 Sam 17:2": "Zo zal ik hem overvallen terwijl hij moe en slap van handen is, en zal hem schrik aanjagen; en al het volk dat bij hem is zal vluchten; dan zal ik de koning alleen doden.", "Mark 6:29": "En toen zijn discipelen dit hoorden, gingen zij en namen zijn lichaam mee, en legden het in een graf.", "Ps 31:6-8": "In Uw hand beveel ik mijn geest; U hebt mij verlost, HEERE, U, God van de waarheid! Ik haat hen die op valse ijdelheden acht slaan, en ik vertrouw op de HEERE. Ik zal mij verheugen en verblijden in Uw goedertierenheid, omdat U mijn ellende hebt aangezien, en mijn ziel in benauwdheden gekend hebt;", "Gen 6:13": "Daarom zei God tegen Noach: Het einde van alle vlees is voor Mijn aangezicht gekomen; want de aarde is door hen vervuld met geweld; en zie, Ik zal hen met de aarde verderven.", "Ps 55:24": "Maar U, o God! zult hen doen neerdalen in de put van het verderf; de mannen van het bloed en het bedrog zullen hun dagen niet tot de helft brengen; ik, daarentegen, zal op U vertrouwen.", "Matt 14:11": "En zijn hoofd werd op een schotel gebracht, en aan het meisje gegeven; en zij bracht het naar haar moeder.", "2 Kron 33:24": "En zijn knechten smeedden een samenzwering tegen hem, en doodden hem in zijn huis.", "1 Kon 2:31": "En de koning zei tegen hem: Doe zoals hij gesproken heeft, en val op hem aan, en begraaf hem, zodat u van mij en van het huis van mijn vader wegneemt het bloed dat Joab zonder reden vergoten heeft.", "1 Sam 19:15": "Toen zond Saul boden om David te bezien, en zei: Breng hem met bed en al bij mij, zodat men hem kan doden.", "Matt 2:2": "Zij zeiden: Waar is de geboren Koning van de Joden? Want wij hebben Zijn ster gezien in het Oosten, en zijn gekomen om Hem te aanbidden.", "2 Sam 18:31": "En zie, Cuschi kwam aan; en Cuschi zei: Er is bericht voor mijn heer de koning, dat de HEERE u vandaag recht gedaan heeft tegenover allen die tegen u opstonden.", "Openb 6:10": "En zij riepen met grote stem, en zeiden: Hoelang, o heilige en waarachtige Heerser, oordeelt en wreekt U ons bloed niet van hen, die op de aarde wonen?", "Spr 2:22": "Maar de goddelozen zullen van de aarde uitgeroeid worden, en de trouwelozen zullen eruit weggerukt worden.", "Ezra 2:25": "De kinderen van Kirjath-arim, Cefira en Beeroth, zevenhonderddrieënveertig.", "1 Kon 2:32": "Zo zal de HEERE zijn bloed op zijn eigen hoofd doen terugkeren, omdat hij twee mannen heeft aangevallen die rechtvaardiger en beter waren dan hij, en hen met het zwaard gedood heeft, terwijl mijn vader David het niet wist: Abner, de zoon van Ner, de legeraanvoerder van Israël, en Amasa, de zoon van Jether, de legeraanvoerder van Juda.", "Gen 40:19-22": "Binnen nog drie dagen zal Farao uw hoofd van u verheffen, en hij zal u aan een paal hangen, en het gevogelte zal uw vlees van u eten. En het gebeurde op de derde dag, de dag van Farao's geboorte, dat hij voor al zijn dienaren een maaltijd maakte; en hij verhief het hoofd van de leider van de schenkers, en het hoofd van de leider van de bakkers, te midden van zijn dienaren. En hij liet de leider van de schenkers terugkeren tot zijn schenkambt, zodat hij de beker in Farao's hand gaf.", "Ps 34:8": "Cheth. De Engel van de HEERE legert Zich rondom hen die Hem vrezen, en redt hen.", "Gen 4:11": "En nu bent u vervloekt, verbannen van de aardbodem, die zijn mond heeft opengedaan om het bloed van uw broeder uit uw hand te ontvangen.", "Jer 10:11": "(Zo zult u tegen hen zeggen: De goden, die de hemel en de aarde niet gemaakt hebben, zullen vergaan van de aarde, en van onder deze hemel.)", "2 Sam 4:5-12": "En de zonen van Rimmon, de Beerothiet, Rechab en Baëna, gingen op weg en kwamen naar het huis van Isboseth toen de dag heet geworden was; en hij lag op zijn bed, in de middag. En zij kwamen daar tot midden in het huis, alsof zij tarwe kwamen halen, en zij sloegen hem in de buik; en Rechab en zijn broer Baëna ontkwamen. Want toen zij het huis binnenkwamen, terwijl hij op zijn bed lag, in zijn slaapkamer, sloegen zij hem, en doodden hem, en hakten zijn hoofd af; en zij namen zijn hoofd en gingen weg, de weg over het vlakke veld, de hele nacht.", "1 Kon 2:23": "En de koning Salomo zwoer bij de HEERE en zei: Zo doe God mij, en zo doet Hij daar nog aan toe, zeker zal Adonia dat woord met zijn leven bekopen!", "Spr 24:34": "Zo zal uw armoede u overkomen, als een wandelaar, en uw velerlei gebrek als een gewapend man.", "2 Sam 20:10": "En Amasa lette niet op het zwaard dat in Joabs hand was; zo sloeg hij hem daarmee aan de vijfde rib, en hij stortte zijn ingewanden op de aarde uit, en hij sloeg hem niet ten tweeden male, en hij stierf. Toen jaagden Joab en zijn broeder Abisai Seba, de zoon van Bichri, achterna.", "2 Sam 21:9": "En hij gaf hen in de hand van de Gibeonieten, die hen ophingen op de berg voor het aangezicht van de HEERE; en die zeven vielen tegelijk; en zij werden gedood in de dagen van de oogst, in de eerste dagen, in het begin van de gersteoogst.", "Gen 9:6": "Wie het bloed van een mens vergiet, diens bloed zal door de mens vergoten worden; want God heeft de mens naar Zijn beeld gemaakt.", "Jes 35:3": "Versterkt de slappe handen, en maakt de struikelende knieën vast.", "Jer 50:43": "De koning van Babel heeft hun gerucht gehoord, en zijn handen zijn slap geworden; benauwdheid heeft hem aangegrepen, weeën als van een barende vrouw.", "2 Sam 2:23": "Maar hij weigerde af te wijken. Zo sloeg Abner hem met de achterkant van de speer tegen de vijfde rib, dat de speer er van achteren uitging; en hij viel daar, en stierf op zijn plaats. En het gebeurde, dat allen die kwamen bij de plaats waar Asahel gevallen en gestorven was, stil bleven staan.", "Deut 21:22": "Verder, wanneer iemand een zonde heeft begaan die de doodstraf verdient, zodat hij gedood wordt, en u hem aan het hout hebt opgehangen;", "2 Sam 4:5-7": "En de zonen van Rimmon, de Beerothiet, Rechab en Baëna, gingen op weg en kwamen naar het huis van Isboseth toen de dag heet geworden was; en hij lag op zijn bed, in de middag. En zij kwamen daar tot midden in het huis, alsof zij tarwe kwamen halen, en zij sloegen hem in de buik; en Rechab en zijn broer Baëna ontkwamen. Want toen zij het huis binnenkwamen, terwijl hij op zijn bed lag, in zijn slaapkamer, sloegen zij hem, en doodden hem, en hakten zijn hoofd af; en zij namen zijn hoofd en gingen weg, de weg over het vlakke veld, de hele nacht.", "1 Sam 20:1": "Toen vluchtte David van Najoth bij Rama, en hij kwam en zei tegen Jonathan: Wat heb ik gedaan, wat is mijn misdaad, en wat is mijn zonde tegenover uw vader, dat hij mijn leven zoekt?", "1 Sam 31:9": "En zij hakten zijn hoofd af, en trokken zijn wapenrusting uit, en zonden die in het land van de Filistijnen rondom, om het bekend te maken in het huis van hun afgoden en onder het volk.", "Ex 9:15": "Want nu heb Ik Mijn hand uitgestrekt, om u en uw volk met de pest te slaan, zodat u van de aarde verdelgd zou worden.", "2 Kron 16:12": "Asa nu werd, in het negenendertigste jaar van zijn koninkrijk, ziek aan zijn voeten; tot het uiterste toe was zijn ziekte; daarbij zocht hij ook in zijn ziekte de HEERE niet, maar de artsen.", "2 Sam 22:48": "De God, Die mij volkomen wraak geeft, en de volken onder mij neerwerpt;", "2 Kon 10:6": "Toen schreef hij voor de tweede keer een brief tot hen, en zei: Als u mijn kant kiest, en u naar mijn stem luistert, neem dan de hoofden van de mannen, de zonen van uw heer, en kom tot mij morgen omtrent deze tijd naar Jizreël. (De zonen van de koning nu, zeventig mannen, waren bij de groten van de stad, die hen opvoedden.)", "Spr 24:33": "Een weinig van het slapen, een weinig van het sluimeren, en een weinig handen vouwen, al neerliggende;", "Hab 1:4": "Daarom wordt de wet losgelaten, en het recht komt nooit meer voort; want de goddeloze omringt de rechtvaardige; daarom komt het recht verdraaid voort.", "2 Kron 25:27": "Van de tijd af nu dat Amazia afgeweken was van achter de HEERE, smeedden zij in Jeruzalem een samenzwering tegen hem; doch hij vluchtte naar Lachis. Toen zonden zij hem achterna tot Lachis, en doodden hem daar.", "Ruth 4:16": "En Naomi nam dat kind en zette het op haar schoot, en werd zijn voedster.", "Joz 9:17": "Want toen de kinderen van Israël verder trokken, kwamen zij op de derde dag bij hun steden aan; hun steden nu waren Gibeon, en Chefira, en Beeroth, en Kirjath-jearim.", "Deut 21:23": "Dan zal zijn dode lichaam niet aan het hout overnachten; maar u zult hem beslist diezelfde dag begraven; want een opgehangene is door God vervloekt. Zo zult u uw land niet verontreinigen, dat de HEERE, uw God, u als erfdeel geeft.", "Joz 8:29": "En de koning van Ai hing hij aan een paal, tot de avond; en omtrent het ondergaan van de zon gebood Jozua dat men zijn dode lichaam van de paal zou afnemen; en zij wierpen het bij de ingang van de stadspoort, en richtten daarop een grote steenhoop op, die er is tot op deze dag.", "Hab 1:12": "Bent U niet van ouds af de HEERE, mijn God, mijn Heilige? Wij zullen niet sterven; o HEERE! Tot een oordeel hebt U hem gesteld, en o Rots! Om te straffen hebt U hem gegrondvest.", "Est 7:10": "Zo hingen zij Haman aan de galg, die hij voor Mordechai had laten maken; en de grimmigheid van de koning werd gestild.", "Gen 9:5": "En zeker, Ik zal uw bloed, het bloed van uw zielen, opeisen; van de hand van elk dier zal Ik het opeisen; ook van de hand van de mens, van de hand van ieders broeder zal Ik de ziel van de mens opeisen.", "Gen 7:23": "Zo werd weggevaagd alles wat leefde, dat op de aardbodem was, van de mens tot het vee, tot het kruipend gedierte, en tot het gevogelte van de hemel; en zij werden weggevaagd van de aarde; alleen Noach bleef over, en wat met hem in de ark was.", "Openb 18:20": "Bedrijf vreugde over haar, u hemel, en u heilige apostelen en profeten, want God heeft uw oordeel aan haar voltrokken.", "Matt 2:20": "en zegt: Sta op, neem het Kindje en Zijn moeder tot u, en ga naar het land Israël; want zij zijn gestorven die het leven van het Kindje zochten.", "Ps 34:23": "De HEERE verlost de ziel van Zijn knechten; en allen die op Hem vertrouwen, zullen niet schuldig verklaard worden.", "2 Sam 1:14": "En David zei tegen hem: Hoe hebt u niet gevreesd uw hand uit te strekken om de gezalfde van de HEERE te doden?", "Neh 11:33": "Hazor, Rama, Gitthaim,", "2 Kron 24:25": "En toen zij van hem weggetrokken waren (want zij lieten hem achter in grote ziekten), maakten zijn knechten, om het bloed van de zonen van de priester Jojada, een samenzwering tegen hem, en zij sloegen hem dood op zijn bed, zodat hij stierf; en zij begroeven hem in de stad van David, maar zij begroeven hem niet in de graven van de koningen.", "Ps 109:15": "Laat ze voortdurend voor de HEERE zijn; en Hij roeit hun gedachtenis uit van de aarde.", "Ps 106:10": "En Hij verloste hen uit de hand van de hater, en Hij bevrijdde hen van de hand van de vijand.", "2 Sam 4:5-8": "En de zonen van Rimmon, de Beerothiet, Rechab en Baëna, gingen op weg en kwamen naar het huis van Isboseth toen de dag heet geworden was; en hij lag op zijn bed, in de middag. En zij kwamen daar tot midden in het huis, alsof zij tarwe kwamen halen, en zij sloegen hem in de buik; en Rechab en zijn broer Baëna ontkwamen. Want toen zij het huis binnenkwamen, terwijl hij op zijn bed lag, in zijn slaapkamer, sloegen zij hem, en doodden hem, en hakten zijn hoofd af; en zij namen zijn hoofd en gingen weg, de weg over het vlakke veld, de hele nacht.", "Neh 7:29": "De mannen van Kirjath-Jearim, Cefira en Beëroth, zevenhonderddrieënveertig;", "2 Sam 18:19": "Toen zei Ahimaäz, de zoon van Zadok: Laat mij toch snel gaan, en de koning berichten dat de HEERE hem recht gedaan heeft tegenover zijn vijanden.", "2 Sam 3:32": "Toen zij Abner te Hebron begroeven, verhief de koning zijn stem, en huilde bij Abners graf; ook al het volk huilde.", "Ps 71:23": "Mijn lippen zullen juichen, wanneer ik U zal psalmzingen, en mijn ziel, die Gij verlost hebt.", "Deut 25:12": "dan zult u haar hand afhouwen, uw oog zal geen medelijden hebben.", "2 Kon 6:23": "En hij bereidde voor hen een grote maaltijd, dat zij aten en dronken; daarna liet hij hen gaan, en zij trokken naar hun heer. Zo kwamen de rooftroepen van de Syriërs niet meer in het land van Israël.", "Num 35:31-34": "En u zult geen losgeld nemen voor het leven van de doodslager, die schuldig is te sterven; want hij zal zeker gedood worden. Ook zult u geen losgeld nemen voor hem die naar zijn vrijstad gevlucht is, zodat hij zou terugkeren om te wonen in het land, voor de dood van de hogepriester. Zo zult u het land niet ontheiligen waarin u woont; want het bloed ontheiligt het land; en voor het land kan geen verzoening gedaan worden voor het bloed dat daarin vergoten is, dan door het bloed van hem die het vergoten heeft.", "Ps 103:4": "Die uw leven verlost van het verderf, die u kroont met goedertierenheid en barmhartigheden;", "1 Kon 16:9": "En Zimri, zijn knecht, aanvoerder van de helft van de wagens, maakte een verbond tegen hem, toen hij te Thirza was, zich dronken drinkend in het huis van Arza, die hofmeester te Thirza was.", "1 Sam 22:18": "Toen zei de koning tegen Doeg: Wend u om, en val de priesters aan. Toen wendde Doeg, de Edomiet, zich om, en hij viel de priesters aan, en doodde op die dag vijfentachtig mannen die de linnen priesterrok droegen.", "1 Kon 1:29": "Toen zwoer de koning en zei: Zo waarachtig als de HEERE leeft, Die mijn ziel uit alle nood verlost heeft;", "1 Sam 17:54": "Daarna nam David het hoofd van de Filistijn en bracht het naar Jeruzalem; maar zijn wapens legde hij in zijn tent.", "1 Kron 8:34": "En Jonathans zoon was Merib-baal, en Merib-baal verwekte Micha.", "1 Sam 19:2-11": "En Jonathan verkondigde het David en zei: Mijn vader Saul zoekt u te doden; nu dan, wees toch morgenochtend op uw hoede, en blijf op een geheime plaats, en verberg u. Doch ik zal uitgaan, en aan de hand van mijn vader staan op het veld waar u zult zijn; en ik zal met mijn vader over u spreken, en zien wat het is; dat zal ik u meedelen. Zo sprak dan Jonathan goed van David tot zijn vader Saul; en hij zei tegen hem: De koning zondige niet tegen zijn knecht David, omdat hij tegen u niet gezondigd heeft, en omdat zijn daden voor u zeer goed zijn.", "Ps 63:10": "Maar zij die mijn ziel zoeken om die te verwoesten, zullen komen in de onderste plaatsen van de aarde.", "Hand 7:20": "In die tijd werd Mozes geboren, en hij was buitengewoon mooi; hij werd drie maanden opgevoed in het huis van zijn vader.", "2 Kon 11:2": "Maar Joseba, de dochter van koning Joram, de zuster van Ahazia, nam Joas, de zoon van Ahazia, en stal hem uit het midden van de zonen van de koning die gedood werden. Zij zette hem en zijn voedster in een slaapkamer en verborg hem voor Athalia, zodat hij niet gedood werd.", "1 Sam 29:11": "Toen maakte David zich vroeg op, hij en zijn mannen, om 's morgens weg te gaan en terug te keren naar het land van de Filistijnen; de Filistijnen daarentegen trokken op naar Jizreël.", "Ezra 4:4": "Toch maakte het volk van het land de handen van het volk van Juda slap, en joeg hen schrik aan bij het bouwen;", "2 Sam 4:9-12": "Maar David antwoordde Rechab en zijn broer Baëna, de zonen van Rimmon, de Beerothiet, en zei tegen hen: Zo waarachtig als de HEERE leeft, Die mijn ziel uit alle benauwdheid verlost heeft! Toen hij die mij het bericht bracht en zei: Zie, Saul is dood – terwijl hij zelf dacht dat hij goed nieuws bracht – heb ik hem gegrepen en te Ziklag gedood, hoewel hij meende dat ik hem daarvoor loon zou geven; Hoeveel te meer, wanneer goddeloze mannen een rechtvaardig man in zijn eigen huis op zijn bed hebben gedood? Zou ik dan nu zijn bloed niet van uw handen eisen, en u van de aarde wegdoen?", "2 Sam 3:27": "Toen Abner naar Hebron terugkwam, nam Joab hem apart in het midden van de poort om in stilte met hem te spreken; en hij sloeg hem daar onder de vijfde rib, zodat hij stierf, vanwege het bloed van zijn broer Asaël.", "1 Tess 5:3-7": "Want wanneer zij zullen zeggen: Het is vrede en veilig; dan zal een plotseling verderf hun overkomen, zoals de barensweeën een zwangere vrouw overkomen; en zij zullen het geenszins ontvluchten; Maar u, broeders, u bent niet in duisternis, zodat die dag u als een dief zou overvallen. U bent allen kinderen van het licht en kinderen van de dag; wij zijn niet van de nacht, en ook niet van de duisternis.", "Luk 18:7": "Zal God dan geen recht doen aan Zijn uitverkorenen, die dag en nacht tot Hem roepen, hoewel Hij geduldig is met hen?", "2 Tim 4:17": "Maar de Heere heeft mij bijgestaan en heeft mij kracht gegeven; opdat door mij de prediking ten volle bekend zou worden, en alle heidenen die zouden horen. En ik ben uit de muil van de leeuw verlost.", "Ex 2:7-9": "Toen zei zijn zuster tegen de dochter van Farao: Zal ik gaan en een voedstermoeder uit de Hebreeuwse vrouwen voor u roepen, die dit kind voor u zoogt? En de dochter van Farao zei tegen haar: Ga. En het meisje ging, en riep de moeder van het kind. Toen zei de dochter van Farao tegen haar: Neem dit kind mee, en zoog het voor mij; ik zal u uw loon geven. En de vrouw nam het kind en zoogde het.", "Mark 6:28": "en bracht zijn hoofd op een schotel, en gaf het aan het meisje, en het meisje gaf het aan haar moeder.", "1 Sam 23:15": "Toen David zag dat Saul was uitgetrokken om hem naar het leven te staan, bleef David in de woestijn Zif, in een woud.", "Matt 2:3": "Toen koning Herodes dit hoorde, werd hij ontroerd, en heel Jeruzalem met hem.", "2 Kon 5:2": "En er waren benden uit Syrië getrokken, en hadden een klein meisje uit het land van Israël gevangen meegenomen, die in dienst van de vrouw van Naäman was.", "Jer 6:24": "Wij hebben zijn gerucht gehoord, onze handen zijn slap geworden; benauwdheid heeft ons aangegrepen, weedom als van een barende vrouw."}, "noten": {}, "koppeling": {"1": "Toen <span class=\"wl\" data-l=\"L1\" data-code=\"H7586\">Sauls</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H1121\">zoon</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H8085\">hoorde</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H3588\">dat</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H74\">Abner</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H74\">in</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H2275\">Hebron</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H4191\">gestorven</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H4191\">was</span>, <span class=\"wl\" data-l=\"L8\" data-code=\"H7503\">werden</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H7503\">zijn</span> <span class=\"wl\" data-l=\"L9\" data-code=\"H3027\">handen</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H7503\">slap</span>, <span class=\"wl\" data-l=\"L10\" data-code=\"H3605\">en</span> heel <span class=\"wl\" data-l=\"L11\" data-code=\"H3478\">Israël</span> <span class=\"wl\" data-l=\"L11\" data-code=\"H3478\">werd</span> <span class=\"wl\" data-l=\"L12\" data-code=\"H926\">verschrikt</span>.", "2": "<span class=\"wl\" data-l=\"L1\" data-code=\"H7586\">En</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H7586\">Sauls</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H1121\">zoon</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H1121\">had</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H8147\">twee</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H582\">mannen</span>, <span class=\"wl\" data-l=\"L5\" data-code=\"H8269\">aanvoerders</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H8269\">van</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H1416\">benden</span>; <span class=\"wl\ "L2\" data-code=\"H2026\">zij</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H2026\">doodden</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H7112\">hen</span>, <span class=\"wl\" data-l=\"L3\" data-code=\"H7112\">en</span> hakten <span class=\"wl\" data-l=\"L4\" data-code=\"H3027\">hun</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H3027\">handen</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H7272\">en</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H7272\">hun</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H7272\">voeten</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H7112\">af</span>, <span class=\"wl\" data-l=\"L6\" data-code=\"H8518\">en</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H8518\">hingen</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H5921\">ze</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H5921\">op</span> bij <span class=\"wl\" data-l=\"L8\" data-code=\"H1295\">de</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H1295\">vijver</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H1295\">te</span> <span class=\"wl\" data-l=\"L9\" data-code=\"H2275\">Hebron</span>; <span class=\"wl\" data-l=\"L10\" data-code=\"H7218\">maar</span> <span class=\"wl\" data-l=\"L10\" data-code=\"H7218\">het</span> <span class=\"wl\" data-l=\"L10\" data-code=\"H7218\">hoofd</span> <span class=\"wl\" data-l=\"L10\" data-code=\"H7218\">van</span> <span class=\"wl\" data-l=\"L11\" data-code=\"H378\">Isboseth</span> <span class=\"wl\" data-l=\"L12\" data-code=\"H3947\">namen</span> <span class=\"wl\" data-l=\"L12\" data-code=\"H3947\">zij</span> <span class=\"wl\" data-l=\"L13\" data-code=\"H6912\">en</span> <span class=\"wl\" data-l=\"L13\" data-code=\"H6912\">begroeven</span> <span class=\"wl\" data-l=\"L13\" data-code=\"H6912\">het</span> <span class=\"wl\" data-l=\"L14\" data-code=\"H74\">in</span> <span class=\"wl\" data-l=\"L14\" data-code=\"H74\">Abners</span> <span class=\"wl\" data-l=\"L15\" data-code=\"H6913\">graf 881\">Beeroth</span> also was <span class=\"wl wl-kjv\" data-code=\"H2803\">reckoned</span> to <span class=\"wl wl-kjv\" data-code=\"H1144\">Benjamin:</span>", "3": "And the <span class=\"wl wl-kjv\" data-code=\"H886\">Beerothites</span> <span class=\"wl wl-kjv\" data-code=\"H1272\">fled</span> to <span class=\"wl wl-kjv\" data-code=\"H1664\">Gittaim,</span> and were <span class=\"wl wl-kjv\" data-code=\"H1481\">sojourners</span> there until this <span class=\"wl wl-kjv\" data-code=\"H3117\">day.)</span>", "4": "And <span class=\"wl wl-kjv\" data-code=\"H3083\">Jonathan,</span> <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul's</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">son,</span> had a <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> that was <span class=\"wl wl-kjv\" data-code=\"H5223\">lame</span> of his <span class=\"wl wl-kjv\" data-code=\"H7272\">feet.</span> He was <span class=\"wl wl-kjv\" data-code=\"H2568\">five</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">old</span> when the <span class=\"wl wl-kjv\" data-code=\"H8052\">tidings</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> of <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> and <span class=\"wl wl-kjv\" data-code=\"H3083\">Jonathan</span> out of <span class=\"wl wl-kjv\" data-code=\"H3157\">Jezreel,</span> and his <span class=\"wl wl-kjv\" data-code=\"H539\">nurse</span> took him <span class=\"wl wl-kjv\" data-code=\"H5375\">up,</span> and <span class=\"wl wl-kjv\" data-code=\"H5127\">fled:</span> and it came to pass, as she made <span class=\"wl wl-kjv\" data-code=\"H2648\">haste</span> to <span class=\"wl wl-kjv\" data-code=\"H5127\">flee,</span> that he <span class=\"wl wl-kjv\" data-code=\"H5307\">fell,</span> and became <span class=\"wl wl-kjv\" data-code=\"H6452\">lame.</span> And his <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> was <span class=\"wl wl-kjv\" data-code=\"H4648\">Mephibosheth.</span>", "5": "And the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H7417\">Rimmon</span> the <span class=\"wl wl-kjv\" data-code=\"H886\">Beerothite,</span> <span class=\"wl wl-kjv\" data-code=\"H7394\">Rechab</span> and <span class=\"wl wl-kjv\" data-code=\"H1196\">Baanah,</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">went,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> about the <span class=\"wl wl-kjv\" data-code=\"H2527\">heat</span> of the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> to the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H378\">Ishbosheth,</span> who <span class=\"wl wl-kjv\" data-code=\"H7901\">lay</span> on a <span class=\"wl wl-kjv\" data-code=\"H4904\">bed</span> at <span class=\"wl wl-kjv\" data-code=\"H6672\">noon.</span>", "6": "And they came <span class=\"wl wl-kjv\" data-code=\"H935\">thither</span> into the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> as though they would have <span class=\"wl wl-kjv\" data-code=\"H3947\">fetched</span> <span class=\"wl wl-kjv\" data-code=\"H2406\">wheat;</span> and they <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> him under the <span class=\"wl wl-kjv\" data-code=\"H2570\">fifth</span> rib: and <span class=\"wl wl-kjv\" data-code=\"H7394\">Rechab</span> and <span class=\"wl wl-kjv\" data-code=\"H1196\">Baanah</span> his <span class=\"wl wl-kjv\" data-code=\"H251\">brother</span> <span class=\"wl wl-kjv\" data-code=\"H4422\">escaped.</span>", "7": "For when they <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> into the <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> he <span class=\"wl wl-kjv\" data-code=\"H7901\">lay</span> on his <span class=\"wl wl-kjv\" data-code=\"H4296\">bed</span> in his <span class=\"wl wl-kjv\" data-code=\"H2315\">bedchamber,</span> and they <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> him, and <span class=\"wl wl-kjv\" data-code=\"H4191\">slew</span> him, and <span class=\"wl wl-kjv\" data-code=\"H5493\">beheaded</span> him, and <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> his <span class=\"wl wl-kjv\" data-code=\"H7218\">head,</span> and gat them <span class=\"wl wl-kjv\" data-code=\"H3212\">away</span> <span class=\"wl wl-kjv\" data-code=\"H1870\">through</span> the <span class=\"wl wl-kjv\" data-code=\"H6160\">plain</span> all <span class=\"wl wl-kjv\" data-code=\"H3915\">night.</span>", "8": "And they <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> the <span class=\"wl wl-kjv\" data-code=\"H7218\">head</span> of <span class=\"wl wl-kjv\" data-code=\"H378\">Ishbosheth</span> unto <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> to <span class=\"wl wl-kjv\" data-code=\"H2275\">Hebron,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> Behold the <span class=\"wl wl-kjv\" data-code=\"H7218\">head</span> of <span class=\"wl wl-kjv\" data-code=\"H378\">Ishbosheth</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> thine <span class=\"wl wl-kjv\" data-code=\"H341\">enemy,</span> which <span class=\"wl wl-kjv\" data-code=\"H1245\">sought</span> thy <span class=\"wl wl-kjv\" data-code=\"H5315\">life;</span> and the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">hath</span> <span class=\"wl wl-kjv\" data-code=\"H5360\">avenged</span> my <span class=\"wl wl-kjv\" data-code=\"H113\">lord</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> this <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul,</span> and of his <span class=\"wl wl-kjv\" data-code=\"H2233\">seed.</span>", "9": "And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H6030\">answered</span> <span class=\"wl wl-kjv\" data-code=\"H7394\">Rechab</span> and <span class=\"wl wl-kjv\" data-code=\"H1196\">Baanah</span> his <span class=\"wl wl-kjv\" data-code=\"H251\">brother,</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H7417\">Rimmon</span> the <span class=\"wl wl-kjv\" data-code=\"H886\">Beerothite,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto them, As the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H2416\">liveth,</span> who hath <span class=\"wl wl-kjv\" data-code=\"H6299\">redeemed</span> my <span class=\"wl wl-kjv\" data-code=\"H5315\">soul</span> out of all <span class=\"wl wl-kjv\" data-code=\"H6869\">adversity,</span>", "10": "When one <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> me, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Behold, <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> is <span class=\"wl wl-kjv\" data-code=\"H4191\">dead,</span> thinking to have <span class=\"wl wl-kjv\" data-code=\"H5869\">brought</span> good <span class=\"wl wl-kjv\" data-code=\"H1319\">tidings,</span> I took <span class=\"wl wl-kjv\" data-code=\"H270\">hold</span> of him, and <span class=\"wl wl-kjv\" data-code=\"H2026\">slew</span> him in <span class=\"wl wl-kjv\" data-code=\"H6860\">Ziklag,</span> who thought that I would have <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> him a reward for his <span class=\"wl wl-kjv\" data-code=\"H1309\">tidings:</span>", "11": "How much more, when <span class=\"wl wl-kjv\" data-code=\"H7563\">wicked</span> <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> have <span class=\"wl wl-kjv\" data-code=\"H2026\">slain</span> a <span class=\"wl wl-kjv\" data-code=\"H6662\">righteous</span> <span class=\"wl wl-kjv\" data-code=\"H376\">person</span> in his own <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> upon his <span class=\"wl wl-kjv\" data-code=\"H4904\">bed?</span> shall I not therefore now <span class=\"wl wl-kjv\" data-code=\"H1245\">require</span> his <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> of your <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> and take you <span class=\"wl wl-kjv\" data-code=\"H1197\">away</span> from the <span class=\"wl wl-kjv\" data-code=\"H776\">earth?</span>", "12": "And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> his young <span class=\"wl wl-kjv\" data-code=\"H5288\">men,</span> and they <span class=\"wl wl-kjv\" data-code=\"H2026\">slew</span> them, and cut <span class=\"wl wl-kjv\" data-code=\"H7112\">off</span> their <span class=\"wl wl-kjv\" data-code=\"H3027\">hands</span> and their <span class=\"wl wl-kjv\" data-code=\"H7272\">feet,</span> and hanged them <span class=\"wl wl-kjv\" data-code=\"H8518\">up</span> over the <span class=\"wl wl-kjv\" data-code=\"H1295\">pool</span> in <span class=\"wl wl-kjv\" data-code=\"H2275\">Hebron.</span> But they <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> the <span class=\"wl wl-kjv\" data-code=\"H7218\">head</span> of <span class=\"wl wl-kjv\" data-code=\"H378\">Ishbosheth,</span> and <span class=\"wl wl-kjv\" data-code=\"H6912\">buried</span> it in the <span class=\"wl wl-kjv\" data-code=\"H6913\">sepulchre</span> of <span class=\"wl wl-kjv\" data-code=\"H74\">Abner</span> in <span class=\"wl wl-kjv\" data-code=\"H2275\">Hebron.</span>"}};

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling', 'Matthew Henry-verklaring']],
  ['Geloofsbelijdenissen', ['1689 Baptist Confession', 'Westminster Confession']],
  ['Boeken', ['Institutie — Calvijn', 'A Body of Divinity — Watson']],
  ['Preken', ['Spurgeon']],
  ['Devotionals', ['Spurgeon']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    const heeftB = D.koppeling && D.koppeling[n];
    const heeftK = D.koppeling_kjv && D.koppeling_kjv[n];
    let h = '<div class="verg-kop">Grondwoorden</div>';
    if (!heeftB && !heeftK) {
      h += '<em>Nog geen woordkoppeling voor dit vers.</em>';
    } else {
      if (heeftB) h += `<div class="tsk-kop">SVnu</div>` +
        `<div class="gw-tekst" style="font-family:Georgia,serif;line-height:1.8">${D.koppeling[n]}</div>` +
        `<div class="gw-detail" style="margin-top:.5rem"></div>`;
      if (heeftK) h += `<div class="tsk-kop" style="margin-top:.9rem">KJV</div>` +
        `<div class="gw-tekst" style="font-family:Georgia,serif;line-height:1.8">${D.koppeling_kjv[n]}</div>` +
        `<div class="gw-detail" style="margin-top:.5rem"></div>`;
      h += '<div class="bronregel">Klik op een onderstreept woord voor de vindplaatsen.</div>';
    }
    h += '<div class="verg-kop" style="margin-top:1.4rem">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const berea = D.tsk[n], engels = D.tsk_kjv[n];
    if ((!berea || !berea.length) && (!engels || !engels.length)) return '<em>Geen verwijzingen bij dit vers.</em>';
    let h = '';
    if (berea && berea.length) {
      h += '<div class="tsk-kop">Treasury of Scripture Knowledge | SVnu</div>';
      h += berea.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r}">${r}</a>`).join('') + '</div>').join('');
    }
    if (engels && engels.length) {
      h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.tsk[n] && D.tsk[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vergelijk</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}
</script>
</body>
