erfoeisel van de Moabieten, op de berg die tegenover Jeruzalem ligt, en voor Molech, het verfoeisel van de kinderen Ammons.", "2 Sam 1:11": "Toen greep David zijn kleren en scheurde ze; evenzo ook al de mannen die met hem waren.", "Joz 1:16-18": "Toen antwoordden zij Jozua: Alles wat u ons geboden hebt, zullen wij doen, en overal waar u ons zenden zult, zullen wij gaan. Zoals wij in alles naar Mozes geluisterd hebben, zo zullen wij naar u luisteren; alleen dat de HEERE, uw God, met u is, zoals Hij met Mozes geweest is! Elke man die uw mond opstandig zal zijn, en uw woorden niet horen zal in alles wat u hem gebieden zult, die zal gedood worden; wees alleen sterk en heb goede moed!", "1 Sam 16:13": "Toen nam Samuël de oliehoorn, en zalfde hem te midden van zijn broers. En de Geest van de HEERE kwam vanaf die dag over David, en bleef. Daarna stond Samuël op, en ging naar Rama.", "Ps 79:8": "Denk ons de vorige misdaden niet aan; haast U, laat Uw barmhartigheden ons tegemoetkomen; want wij zijn zeer zwak geworden.", "Ps 74:3": "Hef Uw voeten op naar de eeuwige verwoestingen; de vijand heeft alles in het heiligdom verdorven.", "Richt 11:35": "En het gebeurde, toen hij haar zag, dat hij zijn kleren scheurde, en zei: Ach, mijn dochter! U hebt mij helemaal terneergeslagen, en u bent onder degenen die mij in het ongeluk storten; want ik heb mijn mond opengedaan tegen de HEERE, en ik kan niet terug.", "2 Sam 17:1-14": "Verder zei Achitofel tegen Absalom: Laat mij nu twaalfduizend man uitkiezen, dan sta ik op en jaag David deze nacht achterna. Zo zal ik hem overvallen terwijl hij moe en slap van handen is, en zal hem schrik aanjagen; en al het volk dat bij hem is zal vluchten; dan zal ik de koning alleen doden. En ik zal al het volk naar u laten terugkeren; de man die u zoekt, is gelijk aan het terugkeren van allen; zo zal al het volk in vrede zijn.", "Ps 69:7": "Laat hen door mij niet beschaamd worden, die U verwachten, o Heere, HEERE van de heerscharen, laat hen door mij niet te schande worden, die U zoeken, o God van Israël!", "Ps 79:11": "Laat het gekerm van de gevangenen voor Uw aangezicht komen; behoud, naar de grootheid van Uw arm, hen die tot de dood bestemd zijn.", "Ps 119:170": "Laat mijn smeken voor Uw aanschijn komen, red mij naar Uw toezegging.", "2 Sam 18:33": "Toen raakte de koning zeer ontroerd, en ging naar boven, naar de bovenzaal boven de poort, en huilde; en al gaande zei hij dit: Mijn zoon Absalom, mijn zoon, mijn zoon Absalom! Was ik maar, was ik maar in uw plaats gestorven, Absalom, mijn zoon, mijn zoon!", "Ps 69:2-37": "Verlos mij, o God! Want de wateren zijn gekomen tot aan mijn ziel. Ik ben gezonken in grondeloze modder, waar men niet kan staan; ik ben gekomen in de diepten van de wateren, en de vloed overstroomt mij. Ik ben vermoeid van mijn roepen, mijn keel is ontstoken, mijn ogen zijn bezweken, terwijl ik hoop op mijn God.", "Ps 57:2": "Wees mij genadig, o God! Wees mij genadig, want mijn ziel vertrouwt op U, en ik neem mijn toevlucht onder de schaduw van Uw vleugels, totdat de verdervingen voorbij zijn gegaan.", "Ps 142:6-8": "Tot U riep ik, o HEERE! Ik zei: U bent mijn Toevlucht, mijn Deel in het land van de levenden. Let op mijn geschrei, want ik ben zeer uitgeput; red mij van mijn vervolgers, want zij zijn sterker dan ik. Voer mijn ziel uit de gevangenis, om Uw Naam te loven; de rechtvaardigen zullen mij omringen, wanneer U goed voor mij zult zijn geweest.", "2 Sam 12:11": "Zo zegt de HEERE: Zie, Ik zal kwaad over u verwekken uit uw eigen huis, en Ik zal uw vrouwen nemen voor uw ogen, en zal ze aan uw naaste geven; die zal bij uw vrouwen liggen, voor de ogen van deze zon.", "Ps 35:17": "Heere! Hoe lang zult U toezien? Breng mijn ziel weer van hun verwoestingen, mijn eenzame van de jonge leeuwen.", "Jer 8:8": "Hoe zegt u dan: Wij zijn wijs en de wet van de HEERE is bij ons! Zie, waarlijk, tevergeefs werkt de valse pen van de schriftgeleerden.", "Ps 55:22": "Zijn mond is gladder dan boter, maar zijn hart is oorlog; zijn woorden zijn zachter dan olie, maar ze zijn blote zwaarden.", "1 Sam 4:5": "En het gebeurde, toen de ark van het verbond van de HEERE in het leger kwam, dat heel Israël juichte met een groot gejuich, zodat de aarde dreunde.", "Ps 102:25": "Ik zei: Mijn God! Neem mij niet weg in het midden van mijn dagen; Uw jaren zijn van geslacht tot geslacht.", "Deut 21:19": "Dan zullen zijn vader en zijn moeder hem grijpen, en hem brengen naar de oudsten van zijn stad, en naar de poort van zijn plaats.", "2 Sam 16:10": "Maar de koning zei: Wat heb ik met u te doen, zonen van Zeruja? Ja, laat hem vloeken; want de HEERE heeft immers tegen hem gezegd: Vloek David; wie zou dan zeggen: Waarom hebt u dat gedaan?", "Ps 140:2-14": "Red mij, HEERE, van de kwade mens; behoed mij voor de man van geweld; Die veel kwaad in het hart bedenken, elke dag komen zij samen om te oorlogen. Zij scherpen hun tong als een slang; heet addervergif is onder hun lippen. Sela.", "2 Kon 22:11": "Het gebeurde nu, toen de koning de woorden van het wetboek hoorde, dat hij zijn kleren scheurde.", "Ps 17:1": "Een gebed van David. HEERE! Hoor de gerechtigheid, let op mijn geschrei, neem ter ore mijn gebed, gesproken met onbedriegelijke lippen.", "2 Sam 20:7": "Toen trokken uit, hem achterna, de mannen van Joab, en de Krethi, en de Plethi, en al de helden. Dezen trokken uit van Jeruzalem, om Seba, de zoon van Bichri, achterna te jagen.", "Job 12:16-20": "Bij Hem is kracht en wijsheid; van Hem is hij die dwaalt, en hij die doet dwalen. Hij voert de raadsheren beroofd weg, en de rechters maakt Hij uitzinnig, De band van de koningen maakt Hij los, en Hij bindt de gordel aan hun heupen.", "Ps 120:2": "O HEERE! Red mijn ziel van de valse lippen, van de bedrieglijke tong.", "Matt 5:4": "Zalig zijn zij die treuren, want zij zullen vertroost worden.", "Ps 59:2-18": "Red mij van mijn vijanden, o mijn God! Stel mij in een hoog vertrek voor hen die tegen mij opstaan. Red mij van de werkers van de ongerechtigheid, en verlos mij van de mannen van het bloed. Want zie, zij leggen mijn ziel lagen; sterken rotten samen tegen mij; zonder mijn overtreding en zonder mijn zonde, o HEERE!", "1 Sam 4:12": "Toen liep er een Benjaminiet uit de slagorde, en kwam dezelfde dag in Silo aan; zijn kleren waren gescheurd, en er was aarde op zijn hoofd.", "Ps 71:20": "Gij, Die mij veel benauwdheden en kwaden hebt doen zien, zult mij weer levend maken, en zult mij weer ophalen uit de afgronden van de aarde.", "Jer 15:15": "O HEERE! U weet het, denk aan mij, en bezoek mij, en wreek mij op mijn vervolgers; neem mij niet weg in Uw lankmoedigheid over hen; weet dat ik omwille van U smaad draag.", "2 Sam 3:32": "Toen zij Abner te Hebron begroeven, verhief de koning zijn stem, en huilde bij Abners graf; ook al het volk huilde.", "Job 42:6": "Daarom verfoei ik mij, en ik heb berouw in stof en as.", "Ps 119:121-123": "Ain. Ik heb recht en gerechtigheid gedaan; geef mij niet over aan mijn onderdrukkers. Wees borg voor Uw knecht ten goede; laat de hoogmoedigen mij niet onderdrukken. Mijn ogen zijn bezweken van verlangen naar Uw heil, en naar de toezegging van Uw rechtvaardigheid.", "Ps 56:13": "O God! Op mij zijn Uw geloften; ik zal U dankzeggingen vergelden;", "1 Kron 18:17": "en Benaja, de zoon van Jojada, ging over de Krethi en Plethi; maar de zonen van David waren de eersten aan de hand van de koning.", "Luk 18:1": "Hij vertelde hen ook een gelijkenis, met de bedoeling dat men altijd moet bidden en niet moet opgeven,", "Ps 7:2": "HEERE, mijn God, op U vertrouw ik; verlos mij van al mijn vervolgers, en red mij.", "Jes 19:3": "En de geest van de Egyptenaren zal uitgeledigd worden in hun binnenste, en hun raad zal Ik verslinden; dan zullen zij hun afgoden vragen, en de bezweerders, en de waarzeggers, en de duivelskunstenaars.", "1 Sam 24:18": "En hij zei tegen David: U bent rechtvaardiger dan ik; want u hebt mij goed vergolden, en ik heb u kwaad vergolden.", "Matt 10:16": "Zie, Ik zend u als schapen te midden van de wolven; wees dan voorzichtig zoals de slangen, en oprecht zoals de duiven.", "Ps 43:3": "Zend Uw licht en Uw waarheid, dat die mij leiden; dat zij mij brengen tot de berg van Uw heiligheid, en tot Uw woningen;", "Klaagl 5:16": "De kroon van ons hoofd is afgevallen; o wee nu ons, dat wij zo gezondigd hebben!", "Jes 64:9-12": "HEERE! wees niet zo zeer verbolgen, en denk niet eeuwig aan de ongerechtigheid; zie, aanschouw toch, wij allen zijn Uw volk. Uw heilige steden zijn een woestijn geworden, Sion is een woestijn geworden, Jeruzalem een verwoesting. Ons heilig en ons heerlijk huis, waarin onze vaders U loofden, is met vuur verbrand; en al onze gewenste dingen zijn tot woestheid geworden.", "Ps 16:1": "Een gouden kleinood van David. Bewaar mij, o God! Want ik vertrouw op U.", "2 Sam 13:28": "Absalom nu gebood zijn knechten: Let er nu op, wanneer Amnons hart vrolijk is van de wijn, en ik tegen u zeg: Sla Amnon neer, dan zult u hem doden; wees niet bang; heb ik het u niet geboden? Wees sterk en wees dapper.", "2 Kon 4:30": "Doch de moeder van de jongen zei: Zo waarachtig als de HEERE leeft en uw ziel leeft, ik zal u niet verlaten! Hij stond dan op, en volgde haar.", "2 Sam 1:17": "David nu klaagde deze klaagzang over Saul en over Jonathan, zijn zoon;", "Ps 141:1-10": "Een psalm van David. HEERE, ik roep U aan, haast U tot mij; luister naar mijn stem, als ik tot U roep. Laat mijn gebed voor Uw aangezicht staan als reukwerk, het opheffen van mijn handen als het avondoffer. HEERE, zet een wacht voor mijn mond, bewaak de deur van mijn lippen.", "2 Kon 2:2": "En Elia zei tegen Elisa: Blijf toch hier, want de HEERE heeft mij naar Beth-el gezonden. Maar Elisa zei: Zo waarachtig als de HEERE leeft en uw ziel leeft, ik zal u niet verlaten! Zo gingen zij af naar Beth-el.", "2 Petr 2:3": "En zij zullen door hebzucht, met gemaakte woorden, van u een koopwaar maken; over hen is het oordeel van lang geleden niet werkeloos, en hun verderf sluimert niet.", "Micha 7:6": "Want de zoon veracht de vader, de dochter staat op tegen haar moeder, de schoondochter tegen haar schoonmoeder; iemands vijanden zijn zijn huisgenoten.", "Ps 30:11": "Hoor, HEERE! en wees mij genadig; HEERE! wees mij een Helper.", "2 Sam 17:23": "Toen Achitofel nu zag dat zijn raad niet was opgevolgd, zadelde hij de ezel, stond op, en ging naar zijn huis in zijn stad, en gaf bevel aan zijn huis, en verhing zich. Zo stierf hij, en werd begraven in het graf van zijn vader."}, "noten": {}, "koppeling": {"1": "Het gebeurde <span class=\"wl\" data-l=\"L2\" data-code=\"H310\">daarna</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H53\">dat</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H53\">Absalom</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H53\">voor</span> zichzelf <span class=\"wl\" data-l=\"L5\" data-code=\"H4818\">wagens</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H1961\">en</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H5483\">paarden</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H6213\">liet</span> klaarmaken, <span class=\"wl\" data-l=\"L6\" data-code=\"H5483\">en</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H2572\">vijftig</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H376\">mannen</span> die voor hem uit renden.", "2": "<span class=\"wl\" data-l=\"L1\" data-code=\"H7925\">Ook</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H5975\">stond</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H53\">Absalom</span> 's <span class=\"wl\" data-l=\"L3\" data-code=\"H7925\">morgens</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H7925\">vroeg</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H7925\">op</span>, <span class=\"wl\" data-l=\"L4\" data-code=\"H5975\">en</span> ging staan <span class=\"wl\" data-l=\"L5\" data-code=\"H5921\">aan</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H5921\">de</span> kant van <span class=\"wl\" data-l=\"L6\" data-code=\"H1870\">de</span> <span class=\"wl\" data-l=\"L6\" dat \">man</span> that had a <span class=\"wl wl-kjv\" data-code=\"H7379\">controversy</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> for <span class=\"wl wl-kjv\" data-code=\"H4941\">judgment,</span> then <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom</span> <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> unto him, and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Of <span class=\"wl wl-kjv\" data-code=\"H335\">what</span> <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> art thou? And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> is of <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> of the <span class=\"wl wl-kjv\" data-code=\"H7626\">tribes</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel.</span>", "3": "And <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, <span class=\"wl wl-kjv\" data-code=\"H7200\">See,</span> thy <span class=\"wl wl-kjv\" data-code=\"H1697\">matters</span> are <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> and <span class=\"wl wl-kjv\" data-code=\"H5228\">right;</span> but there is no man deputed of the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> to <span class=\"wl wl-kjv\" data-code=\"H8085\">hear</span> thee.", "4": "<span class=\"wl wl-kjv\" data-code=\"H53\">Absalom</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> moreover, Oh that I were <span class=\"wl wl-kjv\" data-code=\"H7760\">made</span> <span class=\"wl wl-kjv\" data-code=\"H8199\">judge</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> that every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> which hath any <span class=\"wl wl-kjv\" data-code=\"H7379\">suit</span> or <span class=\"wl wl-kjv\" data-code=\"H4941\">cause</span> might <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> unto me, and I would do him <span class=\"wl wl-kjv\" data-code=\"H6663\">justice!</span>", "5": "And it was so, that when any <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> came <span class=\"wl wl-kjv\" data-code=\"H7126\">nigh</span> to him to do him <span class=\"wl wl-kjv\" data-code=\"H7812\">obeisance,</span> he put <span class=\"wl wl-kjv\" data-code=\"H7971\">forth</span> his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> and <span class=\"wl wl-kjv\" data-code=\"H2388\">took</span> him, and <span class=\"wl wl-kjv\" data-code=\"H5401\">kissed</span> him.", "6": "And on this <span class=\"wl wl-kjv\" data-code=\"H1697\">manner</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom</span> to all <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> that <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> for <span class=\"wl wl-kjv\" data-code=\"H4941\">judgment:</span> so <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom</span> <span class=\"wl wl-kjv\" data-code=\"H1589\">stole</span> the <span class=\"wl wl-kjv\" data-code=\"H3820\">hearts</span> of the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel.</span>", "7": "And it came to pass <span class=\"wl wl-kjv\" data-code=\"H7093\">after</span> <span class=\"wl wl-kjv\" data-code=\"H705\">forty</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years,</span> that <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> I pray thee, let me <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> and <span class=\"wl wl-kjv\" data-code=\"H7999\">pay</span> my <span class=\"wl wl-kjv\" data-code=\"H5088\">vow,</span> which I have <span class=\"wl wl-kjv\" data-code=\"H5087\">vowed</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> in <span class=\"wl wl-kjv\" data-code=\"H2275\">Hebron.</span>", "8": "For thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> <span class=\"wl wl-kjv\" data-code=\"H5087\">vowed</span> a <span class=\"wl wl-kjv\" data-code=\"H5088\">vow</span> while I <span class=\"wl wl-kjv\" data-code=\"H3427\">abode</span> at <span class=\"wl wl-kjv\" data-code=\"H1650\">Geshur</span> in <span class=\"wl wl-kjv\" data-code=\"H758\">Syria,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> If the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall bring me <span class=\"wl wl-kjv\" data-code=\"H7725\">again</span> indeed to <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> then I will <span class=\"wl wl-kjv\" data-code=\"H5647\">serve</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD.</span>", "9": "And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, <span class=\"wl wl-kjv\" data-code=\"H3212\">Go</span> in <span class=\"wl wl-kjv\" data-code=\"H7965\">peace.</span> So he <span class=\"wl wl-kjv\" data-code=\"H6965\">arose,</span> and <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> to <span class=\"wl wl-kjv\" data-code=\"H2275\">Hebron.</span>", "10": "But <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> <span class=\"wl wl-kjv\" data-code=\"H7270\">spies</span> throughout all the <span class=\"wl wl-kjv\" data-code=\"H7626\">tribes</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> As soon as ye <span class=\"wl wl-kjv\" data-code=\"H8085\">hear</span> the <span class=\"wl wl-kjv\" data-code=\"H6963\">sound</span> of the <span class=\"wl wl-kjv\" data-code=\"H7782\">trumpet,</span> then ye shall <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom</span> <span class=\"wl wl-kjv\" data-code=\"H4427\">reigneth</span> in <span class=\"wl wl-kjv\" data-code=\"H2275\">Hebron.</span>", "11": "And with <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom</span> <span class=\"wl wl-kjv\" data-code=\"H1980\">went</span> two <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> <span class=\"wl wl-kjv\" data-code=\"H376\">men</span> out of <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> that were <span class=\"wl wl-kjv\" data-code=\"H7121\">called;</span> and they <span class=\"wl wl-kjv\" data-code=\"H1980\">went</span> in their <span class=\"wl wl-kjv\" data-code=\"H8537\">simplicity,</span> and they <span class=\"wl wl-kjv\" data-code=\"H3045\">knew</span> not any <span class=\"wl wl-kjv\" data-code=\"H1697\">thing.</span>", "12": "And <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> for <span class=\"wl wl-kjv\" data-code=\"H302\">Ahithophel</span> the <span class=\"wl wl-kjv\" data-code=\"H1526\">Gilonite,</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David's</span> <span class=\"wl wl-kjv\" data-code=\"H3289\">counsellor,</span> from his <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> even from <span class=\"wl wl-kjv\" data-code=\"H1542\">Giloh,</span> while he <span class=\"wl wl-kjv\" data-code=\"H2076\">offered</span> <span class=\"wl wl-kjv\" data-code=\"H2077\">sacrifices.</span> And the <span class=\"wl wl-kjv\" data-code=\"H7195\">conspiracy</span> was <span class=\"wl wl-kjv\" data-code=\"H533\">strong;</span> for the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H7227\">increased</span> <span class=\"wl wl-kjv\" data-code=\"H1980\">continually</span> with <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom.</span>", "13": "And there <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> a <span class=\"wl wl-kjv\" data-code=\"H5046\">messenger</span> to <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> The <span class=\"wl wl-kjv\" data-code=\"H3820\">hearts</span> of the <span class=\"wl wl-kjv\" data-code=\"H376\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> are <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom.</span>", "14": "And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto all his <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> that were with him at <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> <span class=\"wl wl-kjv\" data-code=\"H6965\">Arise,</span> and let us <span class=\"wl wl-kjv\" data-code=\"H1272\">flee;</span> for we shall not else <span class=\"wl wl-kjv\" data-code=\"H6413\">escape</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">from</span> <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom:</span> make <span class=\"wl wl-kjv\" data-code=\"H4116\">speed</span> to <span class=\"wl wl-kjv\" data-code=\"H3212\">depart,</span> lest he <span class=\"wl wl-kjv\" data-code=\"H5381\">overtake</span> us <span class=\"wl wl-kjv\" data-code=\"H4116\">suddenly,</span> and <span class=\"wl wl-kjv\" data-code=\"H5080\">bring</span> <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> upon us, and <span class=\"wl wl-kjv\" data-code=\"H5221\">smite</span> the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> with the <span class=\"wl wl-kjv\" data-code=\"H6310\">edge</span> of the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword.</span>", "15": "And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> Behold, thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> are ready to do whatsoever my <span class=\"wl wl-kjv\" data-code=\"H113\">lord</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> shall <span class=\"wl wl-kjv\" data-code=\"H977\">appoint.</span>", "16": "And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> went <span class=\"wl wl-kjv\" data-code=\"H3318\">forth,</span> and all his <span class=\"wl wl-kjv\" data-code=\"H1004\">household</span> <span class=\"wl wl-kjv\" data-code=\"H7272\">after</span> him. And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H5800\">left</span> <span class=\"wl wl-kjv\" data-code=\"H6235\">ten</span> <span class=\"wl wl-kjv\" data-code=\"H802\">women,</span> which were <span class=\"wl wl-kjv\" data-code=\"H6370\">concubines,</span> to <span class=\"wl wl-kjv\" data-code=\"H8104\">keep</span> the <span class=\"wl wl-kjv\" data-code=\"H1004\">house.</span>", "17": "And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> went <span class=\"wl wl-kjv\" data-code=\"H3318\">forth,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H7272\">after</span> him, and <span class=\"wl wl-kjv\" data-code=\"H5975\">tarried</span> in a <span class=\"wl wl-kjv\" data-code=\"H1004\">place</span> that was far <span class=\"wl wl-kjv\" data-code=\"H4801\">off.</span>", "18": "And all his <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> passed <span class=\"wl wl-kjv\" data-code=\"H5674\">on</span> <span class=\"wl wl-kjv\" data-code=\"H3027\">beside</span> him; and all the <span class=\"wl wl-kjv\" data-code=\"H3774\">Cherethites,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H6432\">Pelethites,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H1663\">Gittites,</span> <span class=\"wl wl-kjv\" data-code=\"H8337\">six</span> <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> <span class=\"wl wl-kjv\" data-code=\"H376\">men</span> which <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> <span class=\"wl wl-kjv\" data-code=\"H7272\">after</span> him from <span class=\"wl wl-kjv\" data-code=\"H1661\">Gath,</span> passed <span class=\"wl wl-kjv\" data-code=\"H5674\">on</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king.</span>", "19": "Then <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> to <span class=\"wl wl-kjv\" data-code=\"H863\">Ittai</span> the <span class=\"wl wl-kjv\" data-code=\"H1663\">Gittite,</span> Wherefore <span class=\"wl wl-kjv\" data-code=\"H3212\">goest</span> thou also with us? <span class=\"wl wl-kjv\" data-code=\"H7725\">return</span> to thy <span class=\"wl wl-kjv\" data-code=\"H4725\">place,</span> and <span class=\"wl wl-kjv\" data-code=\"H3427\">abide</span> with the <span class=\"wl wl-kjv\" data-code=\"H4428\">king:</span> for thou art a <span class=\"wl wl-kjv\" data-code=\"H5237\">stranger,</span> and also an <span class=\"wl wl-kjv\" data-code=\"H1540\">exile.</span>", "20": "Whereas thou <span class=\"wl wl-kjv\" data-code=\"H935\">camest</span> but <span class=\"wl wl-kjv\" data-code=\"H8543\">yesterday,</span> should I this <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> make thee <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> up and <span class=\"wl wl-kjv\" data-code=\"H5128\">down</span> with us? seeing I <span class=\"wl wl-kjv\" data-code=\"H1980\">go</span> whither I may, <span class=\"wl wl-kjv\" data-code=\"H7725\">return</span> thou, and take <span class=\"wl wl-kjv\" data-code=\"H7725\">back</span> thy <span class=\"wl wl-kjv\" data-code=\"H251\">brethren:</span> <span class=\"wl wl-kjv\" data-code=\"H2617\">mercy</span> and <span class=\"wl wl-kjv\" data-code=\"H571\">truth</span> be with thee.", "21": "And <span class=\"wl wl-kjv\" data-code=\"H863\">Ittai</span> <span class=\"wl wl-kjv\" data-code=\"H6030\">answered</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> As the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H2416\">liveth,</span> and as my <span class=\"wl wl-kjv\" data-code=\"H113\">lord</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H2416\">liveth,</span> surely in what <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> my <span class=\"wl wl-kjv\" data-code=\"H113\">lord</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> shall be, whether in <span class=\"wl wl-kjv\" data-code=\"H4194\">death</span> or <span class=\"wl wl-kjv\" data-code=\"H2416\">life,</span> even there also will thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> be.", "22": "And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to <span class=\"wl wl-kjv\" data-code=\"H863\">Ittai,</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">Go</span> and pass <span class=\"wl wl-kjv\" data-code=\"H5674\">over.</span> And <span class=\"wl wl-kjv\" data-code=\"H863\">Ittai</span> the <span class=\"wl wl-kjv\" data-code=\"H1663\">Gittite</span> passed <span class=\"wl wl-kjv\" data-code=\"H5674\">over,</span> and all his <span class=\"wl wl-kjv\" data-code=\"H582\">men,</span> and all the little <span class=\"wl wl-kjv\" data-code=\"H2945\">ones</span> that were with him.", "23": "And all the <span class=\"wl wl-kjv\" data-code=\"H776\">country</span> <span class=\"wl wl-kjv\" data-code=\"H1058\">wept</span> with a <span class=\"wl wl-kjv\" data-code=\"H1419\">loud</span> <span class=\"wl wl-kjv\" data-code=\"H6963\">voice,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> passed <span class=\"wl wl-kjv\" data-code=\"H5674\">over:</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> also himself passed <span class=\"wl wl-kjv\" data-code=\"H5674\">over</span> the <span class=\"wl wl-kjv\" data-code=\"H5158\">brook</span> <span class=\"wl wl-kjv\" data-code=\"H6939\">Kidron,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> passed <span class=\"wl wl-kjv\" data-code=\"H5674\">over,</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">toward</span> the <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> of the <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness.</span>", "24": "And lo <span class=\"wl wl-kjv\" data-code=\"H6659\">Zadok</span> also, and all the <span class=\"wl wl-kjv\" data-code=\"H3881\">Levites</span> were with him, <span class=\"wl wl-kjv\" data-code=\"H5375\">bearing</span> the <span class=\"wl wl-kjv\" data-code=\"H727\">ark</span> of the <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God:</span> and they set <span class=\"wl wl-kjv\" data-code=\"H3332\">down</span> the <span class=\"wl wl-kjv\" data-code=\"H727\">ark</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God;</span> and <span class=\"wl wl-kjv\" data-code=\"H54\">Abiathar</span> went <span class=\"wl wl-kjv\" data-code=\"H5927\">up,</span> until all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> had <span class=\"wl wl-kjv\" data-code=\"H8552\">done</span> <span class=\"wl wl-kjv\" data-code=\"H5674\">passing</span> out of the <span class=\"wl wl-kjv\" data-code=\"H5892\">city.</span>", "25": "And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H6659\">Zadok,</span> Carry <span class=\"wl wl-kjv\" data-code=\"H7725\">back</span> the <span class=\"wl wl-kjv\" data-code=\"H727\">ark</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> into the <span class=\"wl wl-kjv\" data-code=\"H5892\">city:</span> if I shall <span class=\"wl wl-kjv\" data-code=\"H4672\">find</span> <span class=\"wl wl-kjv\" data-code=\"H2580\">favour</span> in the <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> he will bring me <span class=\"wl wl-kjv\" data-code=\"H7725\">again,</span> and <span class=\"wl wl-kjv\" data-code=\"H7200\">shew</span> me both it, and his <span class=\"wl wl-kjv\" data-code=\"H5116\">habitation:</span>", "26": "But if he thus <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> I have no <span class=\"wl wl-kjv\" data-code=\"H2654\">delight</span> in thee; behold, here am I, let him <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> to me as <span class=\"wl wl-kjv\" data-code=\"H5869\">seemeth</span> <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> unto him.", "27": "The <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> also unto <span class=\"wl wl-kjv\" data-code=\"H6659\">Zadok</span> the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest,</span> Art not thou a <span class=\"wl wl-kjv\" data-code=\"H7200\">seer?</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">return</span> into the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> in <span class=\"wl wl-kjv\" data-code=\"H7965\">peace,</span> and your <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> with you, <span class=\"wl wl-kjv\" data-code=\"H290\">Ahimaaz</span> thy <span class=\"wl wl-kjv\" data-code=\"H1121\">son,</span> and <span class=\"wl wl-kjv\" data-code=\"H3083\"> /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [

).join('');

function paneelInhoud(n, tab) {

  if (tab === 'verwijzingen') {
    const berea = D.tsk[n], engels = D.tsk_kjv[n];

    }
    if (engels && engels.length) {
      h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.tsk[n] && D.tsk[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vergelijk</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}
</script>
</body>
</html>
