naam":"Openbaring","href":"../../openbaring/1/"}],"slugmap":{"Gen":"genesis","Ex":"exodus","Lev":"leviticus","Num":"numeri","Deut":"deuteronomium","Joz":"jozua","Richt":"richteren","Ruth":"ruth","1 Sam":"1-samuel","2 Sam":"2-samuel","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Het gebeurde daarna dat Absalom voor zichzelf wagens en paarden liet klaarmaken, en vijftig mannen die voor hem uit renden.","2":"Ook stond Absalom 's morgens vroeg op, en ging staan aan de kant van de weg naar de poort. En het gebeurde dat Absalom iedere man die een geschil had en naar de koning wilde komen voor een rechtszaak, tot zich riep en zei: Uit welke stad bent u? Als hij dan zei: Uw knecht is uit een van de stammen van Israël,","3":"dan zei Absalom tegen hem: Zie, uw zaken zijn goed en juist; maar u hebt niemand die u namens de koning aanhoort.","4":"Verder zei Absalom: Och, dat men mij tot rechter stelde in het land! Dat iedere man die een geschil of rechtszaak heeft, tot mij zou komen, opdat ik hem recht zou doen.","5":"Het gebeurde ook, als iemand naderde om zich voor hem te buigen, dat hij zijn hand uitstak, hem greep, en hem kuste.","6":"En op die manier deed Absalom met heel Israël, die tot de koning kwamen voor een rechtszaak. Zo stal Absalom het hart van de mannen van Israël.","7":"Aan het einde van veertig jaren gebeurde het dat Absalom tegen de koning zei: Laat mij toch gaan, en mijn gelofte, die ik de HEERE beloofd heb, te Hebron inlossen.","8":"Want uw knecht heeft een gelofte gedaan, toen ik te Gesur in Syrië woonde, en zei: Als de HEERE mij werkelijk terug naar Jeruzalem zal brengen, dan zal ik de HEERE dienen.","9":"Toen zei de koning tegen hem: Ga in vrede. Zo stond hij op, en ging naar Hebron.","10":"Absalom nu had verspieders uitgezonden naar alle stammen van Israël, om te zeggen: Zodra u het geluid van de bazuin hoort, moet u zeggen: Absalom is koning geworden te Hebron.","11":"En met Absalom gingen er tweehonderd mannen mee uit Jeruzalem, die uitgenodigd waren, maar in hun eenvoudigheid meegingen, want zij wisten van niets.","12":"Absalom zond ook om Achitofel, de Giloniet, Davids raadsman, te halen uit zijn stad, uit Gilo, terwijl hij offers bracht. En de samenzwering werd sterk, en het volk kwam gestaag toe en werd meer bij Absalom.","13":"Toen kwam er een boodschapper naar David, en zei: Het hart van ieder in Israël volgt Absalom na.","14":"Toen zei David tegen al zijn knechten die met hem te Jeruzalem waren: Maak u op, en laten we vluchten, want anders zou er voor ons geen ontkomen zijn voor Absalom; haast u om weg te gaan, opdat hij ons niet misschien plotseling haast, en ons achterhaalt, en een kwaad over ons brengt, en deze stad slaat met de scherpte van het zwaard.","15":"Toen zeiden de knechten van de koning tegen de koning: Naar alles wat mijn heer de koning zal verkiezen, zie, hier zijn uw knechten.","16":"En de koning ging weg te voet, met zijn hele huis; maar de koning liet tien bijvrouwen achter om het huis te bewaren.","17":"Toen de koning met heel het volk te voet weggegaan was, bleven zij staan op een afgelegen plaats.","18":"En al zijn knechten trokken aan zijn zijde voorbij, ook alle Krethi en alle Plethi, en alle Gethieten, zeshonderd man die van Gath te voet gekomen waren, trokken voor het aangezicht van de koning voorbij.","19":"Toen zei de koning tegen Ithai, de Gethiet: Waarom zou u ook met ons meegaan? Keer terug, en blijf bij de koning; want u bent een vreemdeling, en bovendien bent u verbannen uit uw eigen plaats.","20":"Gisteren bent u gekomen, en zou ik u vandaag met ons laten meetrekken, terwijl ik zelf ga waarheen ik maar kan gaan? Keer terug, en breng uw broeders mee terug; goedertierenheid en trouw zij met u.","21":"Maar Ithai antwoordde de koning en zei: Zo waarachtig als de HEERE leeft, en mijn heer de koning leeft, op de plaats waar mijn heer de koning zal zijn, hetzij ten dode, hetzij ten leven, daar zal uw knecht voorzeker ook zijn!","22":"Toen zei David tegen Ithai: Kom dan, en ga over. Zo ging Ithai, de Gethiet, over, en al zijn mannen, en alle kinderen die bij hem waren.","23":"En heel het land weende met luide stem, terwijl heel het volk overging; ook ging de koning over de beek Kidron, en heel het volk ging over, recht in de richting van de weg naar de woestijn.","24":"En zie, Zadok was ook daar, en alle Levieten met hem, die de ark van het verbond van God droegen; en zij zetten de ark van God neer, en Abjathar klom op, totdat heel het volk uit de stad klaar was met overgaan.","25":"Toen zei de koning tegen Zadok: Breng de ark van God terug in de stad; als ik genade zal vinden in de ogen van de HEERE, dan zal Hij mij terughalen, en zal Hij mij haar laten zien, alsook Zijn woning.","26":"Maar als Hij zo zal zeggen: Ik heb geen behagen in u; zie, hier ben ik, laat Hij met mij doen zoals het goed is in Zijn ogen.","27":"Verder zei de koning tegen de priester Zadok: Bent u niet een ziener? Keer terug in de stad met vrede; ook uw beide zonen, Ahimaäz, uw zoon, en Jonathan, Abjathars zoon, met u.","28":"Zie, ik zal wachten op de vlakke velden van de woestijn, totdat er een woord van u komt, dat men het mij aanzegt.","29":"Zo brachten Zadok en Abjathar de ark van God terug naar Jeruzalem, en zij bleven daar.","30":"En David ging op door de opgang van de olijven, terwijl hij opging en weende, en zijn hoofd was bedekt; en hij zelf ging blootsvoets; ook had heel het volk dat bij hem was, ieder zijn hoofd bedekt, en zij gingen op, terwijl zij opgingen en weenden.","31":"Toen liet men David weten, en zei: Achitofel is onder degenen die zich met Absalom hebben verbonden. Toen zei David: HEERE, maak toch de raad van Achitofel tot dwaasheid.","32":"En het gebeurde, toen David tot op de hoogte kwam, waar hij God aanbad, zie, toen ontmoette Husai, de Archiet, hem, met zijn kleed gescheurd, en aarde op zijn hoofd.","33":"En David zei tegen hem: Als u met mij meegaat, zult u mij tot een last zijn;","34":"maar als u teruggaat naar de stad, en tegen Absalom zegt: Uw knecht, ik zal van de koning zijn; ik ben eerder wel de knecht van uw vader geweest, maar nu zal ik uw knecht zijn; dan zou u voor mij de raad van Achitofel teniet doen.","35":"En zijn niet Zadok en Abjathar, de priesters, daar bij u? Zo zal het gebeuren, dat u alles wat u uit het huis van de koning zult horen, aan de priesters, Zadok en Abjathar, zult bekendmaken.","36":"Zie, hun beide zonen zijn daar bij hen, Ahimaäz, de zoon van Zadok, en Jonathan, de zoon van Abjathar; zo zult u door hun hand alles wat u zult horen, naar mij laten overbrengen.","37":"Zo kwam Husai, Davids vriend, in de stad; en Absalom kwam te Jeruzalem."},"SV":{"1":"En het geschiedde daarna, dat Absalom zich liet bereiden wagenen en paarden, en vijftig mannen, lopende voor zijn aangezicht henen.","2":"Ook maakte zich Absalom des morgens vroeg op, en stond aan de zijde van den weg der poort. En het geschiedde, dat Absalom allen man, die een geschil had, om tot den koning ten gerichte te komen, tot zich riep, en zeide: Uit welke stad zijt gij? Als hij dan zeide: Uw kencht is uit een der stammen Israëls;","3":"Zo zeide Absalom tot hem: Zie, uw zaken zijn goed en recht; maar gij hebt geen verhoorder van des konings wege.","4":"Voorts zeide Absalom: Och, dat men mij ten rechter stelde in het land! Dat alle man tot mij kwame, die een geschil of rechtzaak heeft, dat ik hem recht sprake.","5":"Het geschiedde ook, als iemand naderde, om zich voor hem te buigen, zo reikte hij zijn hand uit, en greep hem, en kuste hem.","6":"En naar die wijze deed Absalom aan gans Israël, die tot den koning ten gerichte kwamen. Alzo stal Absalom het hart der mannen van Israël.","7":"Ten einde nu van veertig jaren is het geschied, dat Absalom tot den koning zeide: Laat mij toch heengaan, en mijn gelofte, die ik den HEERE beloofd heb, te Hebron betalen.","8":"Want uw knecht heeft een gelofte beloofd, als ik te Gesur in Syrië woonde, zeggende: Indien de HEERE mij zekerlijk weder te Jeruzalem zal brengen , zo zal ik den HEERE dienen.","9":"Toen zeide de koning tot hem: Ga in vrede. Alzo maakte hij zich op, en ging naar Hebron.","10":"Absalom nu had verspieders uitgezonden in alle stammen van Israël, om te zeggen: Als gij het geluid der bazuin zult horen, zo zult gij zeggen: Absalom is koning te Hebron.","11":"En er gingen met Absalom van Jeruzalem tweehonderd mannen, genodigd zijnde, doch gaande in hun eenvoudigheid, want zij wisten *van* geen zaak.","12":"Absalom zond ook om Achitofel, den Giloniet, Davids raad, uit zijn stad, uit Gilo *te* *halen*, als hij offeranden offerde. En de verbintenis werd sterk, en het volk kwam toe en vermeerderde bij Absalom.","13":"Toen kwam er een boodschapper tot David, zeggende: Het hart van een iegelijk in Israël *volgt* Absalom na.","14":"Zo zeide David tot al zijn knechten, die met hem te Jeruzalem waren: Maakt u op, en laat ons vlieden, want er zou voor ons geen ontkomen zijn voor Absaloms aangezicht; haast u, om weg te gaan, opdat hij niet misschien haaste, en ons achterhale, en een kwaad over ons drijve, en deze stad sla met de scherpte des zwaards.","15":"Toen zeiden de knechten des konings tot den koning: Naar alles, wat mijn heer de koning verkiezen zal, ziet, *hier* zijn uw knechten.","16":"En de koning ging uit met zijn ganse huis te voet; doch de koning liet tien bijwijven, om het huis te bewaren.","17":"Als nu de koning met al het volk te voet was uitgegaan, zo bleven zij staan in een verre plaats.","18":"En al zijn knechten gingen aan zijn zijde heen, ook al de Krethi en al de Plethi, en al de Gethieten, zeshonderd man, die van Gath te voet gekomen waren, gingen voor des konings aangezicht heen.","19":"Zo zeide de koning tot Ithai, den Gethiet: Waarom zoudt gij ook met ons gaan? Keer weder, en blijf bij den koning; want gij zijt vreemd, en ook zult gij weder vertrekken naar uw plaats.","20":"Gisteren zijt gij gekomen, en heden zou ik u met ons omvoeren om te gaan? Zo ik toch gaan moet, waarheen ik gaan kan, keer weder; en breng uw broederen wederom; weldadigheid en trouw zij met u.","21":"Maar Ithai antwoordde den koning, en zeide: *Zo* *waarachtig* *als* de HEERE leeft, en mijn heer de koning leeft, in de plaats, waar mijn heer de koning zal zijn, hetzij ten dode, hetzij ten leven, daar zal uw knecht voorzeker ook zijn!","22":"Toen zeide David tot Ithai: Zo kom, en ga over. Alzo ging Ithai, de Gethiet, over, en al zijn mannen, en al de kinderen die met hem waren.","23":"En het ganse land weende met luider stem, als al het volk overging; ook ging de koning over de beek Kidron, en al het volk ging over, recht naar den weg der woestijn.","24":"En ziet, Zadok was ook daar, en al de Levieten met hem, dragende de ark des verbonds van God, en zij zetten de ark Gods neder; en Abjathar klom op, totdat al het volk uit de stad geëindigd had over te gaan.","25":"Toen zeide de koning tot Zadok: Breng de ark Gods weder in de stad; indien ik genade zal vinden in des HEEREN ogen, zo zal Hij mij wederhalen, en zal ze mij laten zien, mitsgaders Zijn woning.","26":"Maar indien Hij alzo zal zeggen: Ik heb geen lust tot u; zie, *hier* ben ik, Hij doe mij, zo als het in Zijn ogen goed is.","27":"Voorts zeide de koning tot den priester Zadok: Zijt gij *niet* een ziener? Keer weder in de stad met vrede; ook ulieder beide zonen, Ahimaäz, uw zoon, en Jonathan, Abjathars zoon, met u.","28":"Zie, ik zal vertoeven in de vlakke velden der woestijn, totdat er een woord van ulieden kome, dat men mij aanzegge.","29":"Alzo bracht Zadok, en Abjathar, de ark Gods weder te Jeruzalem, en zij bleven aldaar.","30":"En David ging op door den opgang der olijven, opgaande en wenende, en het hoofd was hem bewonden; en hij zelf ging barrevoets; ook had al het volk, dat met hem was, een iegelijk zijn hoofd bedekt, en zij gingen op, opgaande en wenende.","31":"Toen gaf men David te kennen, zeggende: Achitofel is onder degenen, die zich met Absalom hebben verbonden. Dies zeide David: O, HEERE! maak toch Achitofels raad tot zotheid.","32":"En het geschiedde, als David tot op de hoogte kwam, dat hij aldaar God aanbad; ziet, toen ontmoette hem Husai, de Archiet, hebbende zijn rok gescheurd, en aarde op zijn hoofd.","33":"En David zeide tot hem: Zo gij met mij voortgaat, zo zult gij mij tot een last zijn;","34":"Maar zo gij weder in de stad gaat, en tot Absalom zegt: Uw knecht, ik zal des konings zijn; ik ben wel uws vaders knecht van te voren geweest, maar nu zal ik uw knecht zijn; zo zoudt gij mij den raad van Achitofel te niet maken.","35":"En zijn niet Zadok en Abjathar, de priesters, aldaar met u? Zo zal het geschieden, dat gij alle ding, dat gij uit des konings huis zult horen, den priesteren, Zadok en Abjathar, zult te kennen geven.","36":"Ziet, hun beide zonen zijn aldaar bij hen, Ahimaäz, Zadoks, en Jonathan, Abjathars *zoon*; zo zult gijlieden door hun hand tot mij zenden alle ding, dat gij zult horen.","37":"Alzo kwam Husai, Davids vriend, in de stad; en Absalom kwam te Jeruzalem."},"KJV":{"1":"And it came to pass after this, that Absalom prepared him chariots and horses, and fifty men to run before him.","2":"And Absalom rose up early, and stood beside the way of the gate: and it was so, that when any man that had a controversy came to the king for judgment, then Absalom called unto him, and said, Of what city art thou? And he said, Thy servant is of one of the tribes of Israel.","3":"And Absalom said unto him, See, thy matters are good and right; but there is no man deputed of the king to hear thee.","4":"Absalom said moreover, Oh that I were made judge in the land, that every man which hath any suit or cause might come unto me, and I would do him justice!","5":"And it was so, that when any man came nigh to him to do him obeisance, he put forth his hand, and took him, and kissed him.","6":"And on this manner did Absalom to all Israel that came to the king for judgment: so Absalom stole the hearts of the men of Israel.","7":"And it came to pass after forty years, that Absalom said unto the king, I pray thee, let me go and pay my vow, which I have vowed unto the LORD, in Hebron.","8":"For thy servant vowed a vow while I abode at Geshur in Syria, saying, If the LORD shall bring me again indeed to Jerusalem, then I will serve the LORD.","9":"And the king said unto him, Go in peace. So he arose, and went to Hebron.","10":"But Absalom sent spies throughout all the tribes of Israel, saying, As soon as ye hear the sound of the trumpet, then ye shall say, Absalom reigneth in Hebron.","11":"And with Absalom went two hundred men out of Jerusalem, that were called; and they went in their simplicity, and they knew not any thing.","12":"And Absalom sent for Ahithophel the Gilonite, David's counsellor, from his city, even from Giloh, while he offered sacrifices. And the conspiracy was strong; for the people increased continually with Absalom.","13":"And there came a messenger to David, saying, The hearts of the men of Israel are after Absalom.","14":"And David said unto all his servants that were with him at Jerusalem, Arise, and let us flee; for we shall not else escape from Absalom: make speed to depart, lest he overtake us suddenly, and bring evil upon us, and smite the city with the edge of the sword.","15":"And the king's servants said unto the king, Behold, thy servants are ready to do whatsoever my lord the king shall appoint.","16":"And the king went forth, and all his household after him. And the king left ten women, which were concubines, to keep the house.","17":"And the king went forth, and all the people after him, and tarried in a place that was far off.","18":"And all his servants passed on beside him; and all the Cherethites, and all the Pelethites, and all the Gittites, six hundred men which came after him from Gath, passed on before the king.","19":"Then said the king to Ittai the Gittite, Wherefore goest thou also with us? return to thy place, and abide with the king: for thou art a stranger, and also an exile.","20":"Whereas thou camest but yesterday, should I this day make thee go up and down with us? seeing I go whither I may, return thou, and take back thy brethren: mercy and truth be with thee.","21":"And Ittai answered the king, and said, As the LORD liveth, and as my lord the king liveth, surely in what place my lord the king shall be, whether in death or life, even there also will thy servant be.","22":"And David said to Ittai, Go and pass over. And Ittai the Gittite passed over, and all his men, and all the little ones that were with him.","23":"And all the country wept with a loud voice, and all the people passed over: the king also himself passed over the brook Kidron, and all the people passed over, toward the way of the wilderness.","24":"And lo Zadok also, and all the Levites were with him, bearing the ark of the covenant of God: and they set down the ark of God; and Abiathar went up, until all the people had done passing out of the city.","25":"And the king said unto Zadok, Carry back the ark of God into the city: if I shall find favour in the eyes of the LORD, he will bring me again, and shew me both it, and his habitation:","26":"But if he thus say, I have no delight in thee; behold, here am I, let him do to me as seemeth good unto him.","27":"The king said also unto Zadok the priest, Art not thou a seer? return into the city in peace, and your two sons with you, Ahimaaz thy son, and Jonathan the son of Abiathar.","28":"See, I will tarry in the plain of the wilderness, until there come word from you to certify me.","29":"Zadok therefore and Abiathar carried ➔ the ark of God again to Jerusalem: and they tarried there.","30":"And David went up by the ascent of mount Olivet, and wept as he went up, and had his head covered, and he went barefoot: and all the people that was with him covered every man his head, and they went up, weeping as they went up.","31":"And one told David, saying, Ahithophel is among the conspirators with Absalom. And David said, O LORD, I pray thee, turn the counsel of Ahithophel into foolishness.","32":"And it came to pass, that when David was come to the top of the mount, where he worshipped God, behold, Hushai the Archite came to meet him with his coat rent, and earth upon his head:","33":"Unto whom David said, If thou passest on with me, then thou shalt be a burden unto me:","34":"But if thou return to the city, and say unto Absalom, I will be thy servant, O king; as I have been thy father's servant hitherto, so will I now also be thy servant: then mayest thou for me defeat the counsel of Ahithophel.","35":"And hast thou not there with thee Zadok and Abiathar the priests? therefore it shall be, that what thing soever thou shalt hear out of the king's house, thou shalt tell it to Zadok and Abiathar the priests.","36":"Behold, they have there with them their two sons, Ahimaaz Zadok's son, and Jonathan Abiathar's son; and by them ye shall send unto me every thing that ye can hear.","37":"So Hushai David's friend came into the city, and Absalom came into =\"wl wl-kjv\" data-code=\"H7379\">controversy</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> for <span class=\"wl wl-kjv\" data-code=\"H4941\">judgment,</span> then <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom</span> <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> unto him, and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Of <span class=\"wl wl-kjv\" data-code=\"H335\">what</span> <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> art thou? And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> is of <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> of the <span class=\"wl wl-kjv\" data-code=\"H7626\">tribes</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel.</span>","3":"And <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, <span class=\"wl wl-kjv\" data-code=\"H7200\">See,</span> thy <span class=\"wl wl-kjv\" data-code=\"H1697\">matters</span> are <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> and <span class=\"wl wl-kjv\" data-code=\"H5228\">right;</span> but there is no man deputed of the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> to <span class=\"wl wl-kjv\" data-code=\"H8085\">hear</span> thee.","4":"<span class=\"wl wl-kjv\" data-code=\"H53\">Absalom</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> moreover, Oh that I were <span class=\"wl wl-kjv\" data-code=\"H7760\">made</span> <span class=\"wl wl-kjv\" data-code=\"H8199\">judge</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> that every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> which hath any <span class=\"wl wl-kjv\" data-code=\"H7379\">suit</span> or <span class=\"wl wl-kjv\" data-code=\"H4941\">cause</span> might <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> unto me, and I would do him <span class=\"wl wl-kjv\" data-code=\"H6663\">justice!</span>","5":"And it was so, that when any <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> came <span class=\"wl wl-kjv\" data-code=\"H7126\">nigh</span> to him to do him <span class=\"wl wl-kjv\" data-code=\"H7812\">obeisance,</span> he put <span class=\"wl wl-kjv\" data-code=\"H7971\">forth</span> his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> and <span class=\"wl wl-kjv\" data-code=\"H2388\">took</span> him, and <span class=\"wl wl-kjv\" data-code=\"H5401\">kissed</span> him.","6":"And on this <span class=\"wl wl-kjv\" data-code=\"H1697\">manner</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom</span> to all <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> that <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> for <span class=\"wl wl-kjv\" data-code=\"H4941\">judgment:</span> so <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom</span> <span class=\"wl wl-kjv\" data-code=\"H1589\">stole</span> the <span class=\"wl wl-kjv\" data-code=\"H3820\">hearts</span> of the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel.</span>","7":"And it came to pass <span class=\"wl wl-kjv\" data-code=\"H7093\">after</span> <span class=\"wl wl-kjv\" data-code=\"H705\">forty</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years,</span> that <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> I pray thee, let me <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> and <span class=\"wl wl-kjv\" data-code=\"H7999\">pay</span> my <span class=\"wl wl-kjv\" data-code=\"H5088\">vow,</span> which I have <span class=\"wl wl-kjv\" data-code=\"H5087\">vowed</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> in <span class=\"wl wl-kjv\" data-code=\"H2275\">Hebron.</span>","8":"For thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> <span class=\"wl wl-kjv\" data-code=\"H5087\">vowed</span> a <span class=\"wl wl-kjv\" data-code=\"H5088\">vow</span> while I <span class=\"wl wl-kjv\" data-code=\"H3427\">abode</span> at <span class=\"wl wl-kjv\" data-code=\"H1650\">Geshur</span> in <span class=\"wl wl-kjv\" data-code=\"H758\">Syria,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> If the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall bring me <span class=\"wl wl-kjv\" data-code=\"H7725\">again</span> indeed to <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> then I will <span class=\"wl wl-kjv\" data-code=\"H5647\">serve</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD.</span>","9":"And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, <span class=\"wl wl-kjv\" data-code=\"H3212\">Go</span> in <span class=\"wl wl-kjv\" data-code=\"H7965\">peace.</span> So he <span class=\"wl wl-kjv\" data-code=\"H6965\">arose,</span> and <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> to <span class=\"wl wl-kjv\" data-code=\"H2275\">Hebron.</span>","10":"But <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> <span class=\"wl wl-kjv\" data-code=\"H7270\">spies</span> throughout all the <span class=\"wl wl-kjv\" data-code=\"H7626\">tribes</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> As soon as ye <span class=\"wl wl-kjv\" data-code=\"H8085\">hear</span> the <span class=\"wl wl-kjv\" data-code=\"H6963\">sound</span> of the <span class=\"wl wl-kjv\" data-code=\"H7782\">trumpet,</span> then ye shall <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom</span> <span class=\"wl wl-kjv\" data-code=\"H4427\">reigneth</span> in <span class=\"wl wl-kjv\" data-code=\"H2275\">Hebron.</span>","11":"And with <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom</span> <span class=\"wl wl-kjv\" data-code=\"H1980\">went</span> two <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> <span class=\"wl wl-kjv\" data-code=\"H376\">men</span> out of <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> that were <span class=\"wl wl-kjv\" data-code=\"H7121\">called;</span> and they <span class=\"wl wl-kjv\" data-code=\"H1980\">went</span> in their <span class=\"wl wl-kjv\" data-code=\"H8537\">simplicity,</span> and they <span class=\"wl wl-kjv\" data-code=\"H3045\">knew</span> not any <span class=\"wl wl-kjv\" data-code=\"H1697\">thing.</span>","12":"And <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> for <span class=\"wl wl-kjv\" data-code=\"H302\">Ahithophel</span> the <span class=\"wl wl-kjv\" data-code=\"H1526\">Gilonite,</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David's</span> <span class=\"wl wl-kjv\" data-code=\"H3289\">counsellor,</span> from his <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> even from <span class=\"wl wl-kjv\" data-code=\"H1542\">Giloh,</span> while he <span class=\"wl wl-kjv\" data-code=\"H2076\">offered</span> <span class=\"wl wl-kjv\" data-code=\"H2077\">sacrifices.</span> And the <span class=\"wl wl-kjv\" data-code=\"H7195\">conspiracy</span> was <span class=\"wl wl-kjv\" data-code=\"H533\">strong;</span> for the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H7227\">increased</span> <span class=\"wl wl-kjv\" data-code=\"H1980\">continually</span> with <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom.</span>","13":"And there <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> a <span class=\"wl wl-kjv\" data-code=\"H5046\">messenger</span> to <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> The <span class=\"wl wl-kjv\" data-code=\"H3820\">hearts</span> of the <span class=\"wl wl-kjv\" data-code=\"H376\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> are <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom.</span>","14":"And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto all his <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> that were with him at <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> <span class=\"wl wl-kjv\" data-code=\"H6965\">Arise,</span> and let us <span class=\"wl wl-kjv\" data-code=\"H1272\">flee;</span> for we shall not else <span class=\"wl wl-kjv\" data-code=\"H6413\">escape</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">from</span> <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom:</span> make <span class=\"wl wl-kjv\" data-code=\"H4116\">speed</span> to <span class=\"wl wl-kjv\" data-code=\"H3212\">depart,</span> lest he <span class=\"wl wl-kjv\" data-code=\"H5381\">overtake</span> us <span class=\"wl wl-kjv\" data-code=\"H4116\">suddenly,</span> and <span class=\"wl wl-kjv\" data-code=\"H5080\">bring</span> <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> upon us, and <span class=\"wl wl-kjv\" data-code=\"H5221\">smite</span> the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> with the <span class=\"wl wl-kjv\" data-code=\"H6310\">edge</span> of the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword.</span>","15":"And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> Behold, thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> are ready to do whatsoever my <span class=\"wl wl-kjv\" data-code=\"H113\">lord</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> shall <span class=\"wl wl-kjv\" data-code=\"H977\">appoint.</span>","16":"And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> went <span class=\"wl wl-kjv\" data-code=\"H3318\">forth,</span> and all his <span class=\"wl wl-kjv\" data-code=\"H1004\">household</span> <span class=\"wl wl-kjv\" data-code=\"H7272\">after</span> him. And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H5800\">left</span> <span class=\"wl wl-kjv\" data-code=\"H6235\">ten</span> <span class=\"wl wl-kjv\" data-code=\"H802\">women,</span> which were <span class=\"wl wl-kjv\" data-code=\"H6370\">concubines,</span> to <span class=\"wl wl-kjv\" data-code=\"H8104\">keep</span> the <span class=\"wl wl-kjv\" data-code=\"H1004\">house.</span>","17":"And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> went <span class=\"wl wl-kjv\" data-code=\"H3318\">forth,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H7272\">after</span> him, and <span class=\"wl wl-kjv\" data-code=\"H5975\">tarried</span> in a <span class=\"wl wl-kjv\" data-code=\"H1004\">place</span> that was far <span class=\"wl wl-kjv\" data-code=\"H4801\">off.</span>","18":"And all his <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> passed <span class=\"wl wl-kjv\" data-code=\"H5674\">on</span> <span class=\"wl wl-kjv\" data-code=\"H3027\">beside</span> him; and all the <span class=\"wl wl-kjv\" data-code=\"H3774\">Cherethites,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H6432\">Pelethites,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H1663\">Gittites,</span> <span class=\"wl wl-kjv\" data-code=\"H8337\">six</span> <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> <span class=\"wl wl-kjv\" data-code=\"H376\">men</span> which <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> <span class=\"wl wl-kjv\" data-code=\"H7272\">after</span> him from <span class=\"wl wl-kjv\" data-code=\"H1661\">Gath,</span> passed <span class=\"wl wl-kjv\" data-code=\"H5674\">on</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king.</span>","19":"Then <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> to <span class=\"wl wl-kjv\" data-code=\"H863\">Ittai</span> the <span class=\"wl wl-kjv\" data-code=\"H1663\">Gittite,</span> Wherefore <span class=\"wl wl-kjv\" data-code=\"H3212\">goest</span> thou also with us? <span class=\"wl wl-kjv\" data-code=\"H7725\">return</span> to thy <span class=\"wl wl-kjv\" data-code=\"H4725\">place,</span> and <span class=\"wl wl-kjv\" data-code=\"H3427\">abide</span> with the <span class=\"wl wl-kjv\" data-code=\"H4428\">king:</span> for thou art a <span class=\"wl wl-kjv\" data-code=\"H5237\">stranger,</span> and also an <span class=\"wl wl-kjv\" data-code=\"H1540\">exile.</span>","20":"Whereas thou <span class=\"wl wl-kjv\" data-code=\"H935\">camest</span> but <span class=\"wl wl-kjv\" data-code=\"H8543\">yesterday,</span> should I this <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> make thee <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> up and <span class=\"wl wl-kjv\" data-code=\"H5128\">down</span> with us? seeing I <span class=\"wl wl-kjv\" data-code=\"H1980\">go</span> whither I may, <span class=\"wl wl-kjv\" data-code=\"H7725\">return</span> thou, and take <span class=\"wl wl-kjv\" data-code=\"H7725\">back</span> thy <span class=\"wl wl-kjv\" data-code=\"H251\">brethren:</span> <span class=\"wl wl-kjv\" data-code=\"H2617\">mercy</span> and <span class=\"wl wl-kjv\" data-code=\"H571\">truth</span> be with thee.","21":"And <span class=\"wl wl-kjv\" data-code=\"H863\">Ittai</span> <span class=\"wl wl-kjv\" data-code=\"H6030\">answered</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> As the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H2416\">liveth,</span> and as my <span class=\"wl wl-kjv\" data-code=\"H113\">lord</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H2416\">liveth,</span> surely in what <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> my <span class=\"wl wl-kjv\" data-code=\"H113\">lord</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> shall be, whether in <span class=\"wl wl-kjv\" data-code=\"H4194\">death</span> or <span class=\"wl wl-kjv\" data-code=\"H2416\">life,</span> even there also will thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> be.","22":"And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to <span class=\"wl wl-kjv\" data-code=\"H863\">Ittai,</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">Go</span> and pass <span class=\"wl wl-kjv\" data-code=\"H5674\">over.</span> And <span class=\"wl wl-kjv\" data-code=\"H863\">Ittai</span> the <span class=\"wl wl-kjv\" data-code=\"H1663\">Gittite</span> passed <span class=\"wl wl-kjv\" data-code=\"H5674\">over,</span> and all his <span class=\"wl wl-kjv\" data-code=\"H582\">men,</span> and all the little <span class=\"wl wl-kjv\" data-code=\"H2945\">ones</span> that were with him.","23":"And all the <span class=\"wl wl-kjv\" data-code=\"H776\">country</span> <span class=\"wl wl-kjv\" data-code=\"H1058\">wept</span> with a <span class=\"wl wl-kjv\" data-code=\"H1419\">loud</span> <span class=\"wl wl- st":"Dat is, gelijke weldadigheid en trouw moet u wedervaren als gij aan mij bewezen hebt. Anders, vergeld uwen broederen, die met u zijn, weldadigheid en trouw."}],"22":[{"catchword":"over","tekst":"Over, of door de beek Kidron, gelijk in het volgende verhaald wordt."}],"23":[{"catchword":"ganse land weende","tekst":"Dat is, alle inwoners des lands, omtrent Jeruzalem gelegen."},{"catchword":"luider stem,","tekst":"Hebreeuws, groter"},{"catchword":"overging;","tekst":"Of, doorging; alzo sommigen menen dat er ondiepten geweest zijn, waar men te voet kon doorgaan."},{"catchword":"Kidron,","tekst":"Lopende oostwaarts voorbij Jeruzalem, langs den voet van den Olijfberg. Over deze beek ging ook onze Zaligmaker Jezus Christus, Joh 18:1, als Hij voor ons zou gevangen worden en lijden."},{"catchword":"naar den weg","tekst":"Hebreeuws, naar het aangezicht des wegs, enz."},{"catchword":"woestijn","tekst":"Liggende tussen Jeruzalem en de Jordaan, anders ook genoemd het vlakke veld. Zie onder, vs.28, en 2Sa 16:2, en 2Sa 17:16; idem boven, 2Sa 2:29."}],"24":[{"catchword":"Zadok","tekst":"Zie boven, 2Sa 8:17."},{"catchword":"Abjathar","tekst":"Zie van dezen 1Sa 22:20, enz., en 1Sa 30:7-8, onder, 2Sa 20:25; 1Ki 1:7, en 1Ki 2:26-27."},{"catchword":"klom op,","tekst":"Het kan zijn dat hij van de hoogte des Olijfbergs heeft willen toezien, wanneer al het volk, dat David uit Jeruzalem volgde, zou over de beek Kidron gegaan zijn, en dat er niemand meer was te verwachten. Vergelijk Jos 3:17."}],"25":[{"catchword":"Zijn woning","tekst":"Anders, haar woning; namelijk der ark. Versta, den tabernakel, waar de ark te dien tijde in gesteld en God dienvolgens aldaar op een bijzondere wijze met zijn genade tegenwoordig was. Zie boven, 2Sa 6:17."}],"26":[{"catchword":"Ik heb geen lust tot u;","tekst":"Alsof hij zeide: Belieft het hem daarentegen mij wijders te kastijden, ik ben bereid om mij zijnen wil te onderwerpen."},{"catchword":"zie, hier ben ik,","tekst":"Zie Gen 22:1."},{"catchword":"zo als het in Zijn ogen goed is","tekst":"Dat is, zoals het hem zal welgevallen, of goeddunken."}],"27":[{"catchword":"Zijt gij niet een ziener?","tekst":"Dat is, een leraar, die op het volk moet toezien? Anders, gij zijt de ziener; dat is, gelijk als een profeet [zie 1Sa 9:9 ] , omdat hij den Heere vraagde door urim en thummim, en van hem antwoord ontving. Hij mag ook daarenboven een profeet geweest zijn. Sommigen nemen het aldus: Ziet gij niet? Te weten, hoe de zaken gaan en wat nodig is."}],"28":[{"catchword":"woord","tekst":"Dat is, enig bescheid van hetgeen te Jeruzalem passeert, of van Absalom wordt voorgenomen."}],"30":[{"catchword":"olijven,","tekst":"Die op den Olijfberg bij menigte stonden."},{"catchword":"bewonden;","tekst":"Dit waren tekenen van rouw, schaamte en vernedering. Zie ook van toedekken of verhullen des hoofds, onder, 2Sa 19:4; Est 6:12; Jer 14:3-4; Eze 31:15; en van barrevoets of ongeschoeid gaan, Isa 20:2-4; Jer 2:25."}],"31":[{"catchword":"Toen gaf men David te kennen,","tekst":"Anders, toen verklaarde David, zeggende, enz."},{"catchword":"maak toch","tekst":"Hebreeuws, maak zot, verdwaas. Vergelijk onder, 2Sa 16:23."}],"32":[{"catchword":"hoogte kwam,","tekst":"Te weten, van den Olijfberg, vanwaar hij de stad en woning des Heeren, waarin de ark [een voorbeeld van den Messias Jezus Christus ] haar verblijf had, en waarheen de gelovigen des Ouden Testaments, absent of ballingen zijnde, hun aangezicht in het bidden plachten te richten, tot een teken dat zij hun gebeden fondeerden op de verdiensten van den Messias. Vergelijk 1Ki 8:44, 1Ki 8:48; Dan 6:11."},{"catchword":"gescheurd,","tekst":"Zie boven, 2Sa 1:2."}],"33":[{"catchword":"mij tot een last zijn;","tekst":"Hebreeuws, een last op mij zijn."}],"34":[{"catchword":"Uw knecht,","tekst":"Een afgebroken rede, gelijk men nu ook spreekt, voor: ik ben uw knecht, ik zal uw knecht zijn. Anders, O koning, ik zal uw knecht zijn, gelijk ik uws vaders knecht tevoren geweest ben, alzo zal ik nu uw knecht zijn"},{"catchword":"van te voren geweest,","tekst":"Hebreeuws, van toen af."}],"35":[{"catchword":"En zijn niet","tekst":"Dat is, die zijn voorzeker aldaar. Van zulk een manier van vragen, zie Jdg 4:6, en elders dikwijls."}],"36":[{"catchword":"hand","tekst":"Dat is, dienst."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"And it came to pass after that, that Absalom caused to be prepared for him a charet and horse; and fifty men running along before his face, [which were his footmen, life-guard, pages, lackeys, &c, as 1 Kings 1.5. See also 1 Sam.8.11. Thus Absalom assayed to put himself in a new kind of way, to make the people believe, that he carried himself as the heir apparent to the crown: Ammon the first born being dead, and perhaps Chilead, the second son likewise, or at least of no account. It&acirc;&euro;&trade;s possible also, that he intended hereby to prevent Solomon, of whose succession (it may be) he had understood Gods counsel, and his fathers intent and purpose.]"}],"2":[{"catchword":null,"tekst":"Also Absalom got him up early in the morning, and stood beside the way of the gate: [Of the Kings court] and it came to pass, that Absalom called all (or every) man, that had a controversy, to come to the King for judgement, unto him, and said; of what city art thou? when he then said; thy servant is of one of the tribes of Israel; [i.e. of this or that city, lying in this or that tribe.]"}],"3":[{"catchword":null,"tekst":"Then said Absalom unto him; behold, thy matters are good and right, [Or consinder thy matters, they are good and right][ but thou hast no hearer (deputed) of the King. [i.e. there is no man deputed or appointed of the King, to examine thy cause duely, and to help thee to right.]"}],"4":[{"catchword":null,"tekst":"Moreover Absalom said; O that they would appoint me Judge in the Land, [Heb. who will make me, etc. A manner of wishing. Compare Judg.9.on v.29.] that all (or every) man, which hath a suit or cause might come unto me, that I might do him justice."}],"5":[{"catchword":null,"tekst":"Also it came to pass, when any man drew near, to bow himself before him, then he reached forth his hand, and took hold of him, and kissed him."}],"6":[{"catchword":null,"tekst":"And according to that manner [Hebr. According to this word, or according to this thing, i.e. thus on this manner] did Absalom to all Jerusalem, that came to the King for Judgement: thus Absalom stole the hearts of the men of Israel. [i.e. he won and drew to him the affection of the Israelites. Compare Gen.31.on vers.20.]"}],"7":[{"catchword":null,"tekst":"Now it came to pass at the end of fourty years, [How or from whence these fourty years are to be counted, is very uncertain, seeing the Holy Scripture maketh no mention of it, and divers opinions there are touching the same] that Absalom said unto the King, I pray thee let me go my ways, and pay my vow, [he covereth his mischievous conspiracy with a shew of holiness, to deceive his Father, and to hide his ambition from the common people] which I have vowed unto the LORD, at Hebron. [a place very well known in Israel by reason of many remarkeable things. See Gen 32:2. above chap.2.4. and 5.1, &c.]"}],"8":[{"catchword":null,"tekst":"For thy servant [i.e. I] hath vowed a vow, when I dwelt at Geshur [see above chap.13.37, 38.] in Syria; saying; If the LORD shall surely bring me again, [Heb. bringing again shall bring again] then I will serve the Lord. [i.e. perform a special service unto God, in offerings, and praising God for his mercy shewed to me, as my vow importeth.]"}],"9":[{"catchword":null,"tekst":"Then said the King unto him; go in peace; so Absalom gat him up, and went to Hebron."}],"10":[{"catchword":null,"tekst":"Now Absalom had sent forth spies [To prepare and encourage the people that were enclined to Absalom, v.2. to fall off from David, and to follow Absalom] to say: when ye shall hear the sound of the trumpet, then ye shall say, Absalom is King [or reigneth] at Hebron."}],"11":[{"catchword":null,"tekst":"And there went with Absalom out of Jerusalem two hundred men, being invited [To be present at Absaloms feast of thanksgiving, without being in the least privy to his conspiracy, as followeth] but going in their simplicity; for they knew not (of) any thing."}],"12":[{"catchword":null,"tekst":"Absalom sent also Achitophel the Gilmite, David&acirc;&euro;&trade;s counsellor out of his city, (to fetch him) out of Cilo, [A city in Juda, Jos.15.51.] when he offered offering: And the combination grew strong, and the people went, and increased with Absalom."}],"13":[{"catchword":null,"tekst":"There came also a messenger unto David, saying; The heart of every one in Israel (followeth) after Absalom."}],"14":[{"catchword":null,"tekst":"Then David said unto all his servants, that were with him at Jerusalem; get ye up, and let us flee, for there will be no escaping for us from Absaloms face: [If we should tarry long here, he will surprise us? we shall not be able to escape his hand] make hast to depart, left peradventure he make hast and overtake us, and bring [Heb. bring on] evil upon us, and smite this city [i.e. the inhabitants of Jerusalem] with the edge [Heb. at the mouth] of the sword."}],"15":[{"catchword":null,"tekst":"Then the Kings servants said unto the King; according to all that my Lord the King shall choose, behold, (here) thy servants are. [i.e. we re ready and willing to following thee, and to do what pleaseth thee, what thou commandest. Compare below chap.19.38. and Psa.25 on v.12. See also Gen.22.on ver.3.]"}],"16":[{"catchword":null,"tekst":"And the King went forth with all his house, on foot: [Heb. upon, or with his feet; and so in the following verse. Compare v.30. Oth. at his feet, i.e. after him] but the King left ten concubines [Heb. ten women, concubines] to keep his house."}],"17":[{"catchword":null,"tekst":"Now when the King was gone forth with all the people on foot, then they tarried in a remote place (that was) far off [Heb. in an house (i.e. place) of remoteness. The meaning is, when they were gone a good way of from the city, then they stood still to place themselves in order, and so to march over the brook Kindron.]"}],"18":[{"catchword":null,"tekst":"And all his servants [i.e. Officers and Courtiers as often] marched on beside him, also all the Crechi, and all the Plethi [his life guard. See 1 King 1 on v.38.] and all the Gethites, six hundred men, which were come on foot [Heb. upon his feet. The meaning is, that every one of them came on foot] from Gath, [see above chap.6.on v.10 and chap 8.on v.1] marched on before the Kings face."}],"19":[{"catchword":null,"tekst":"Then the King said unto Ithai the Gethite [The chief Commander of the six hundred men that were come from Gath unto David, who kept Garrison (as some conceive) in the city of Gath, which David had taken from the Philistines. See above chap.8.on v.1. This man was also used by David as a commander, below chap.18. 2.] why shouldest thou also go with us? return, and abide with the King; [viz. Absalom, who was now held by the people to be their King] for thou art a stranger, [so that Absalom can have no cause to subject thee, and consequently thou shalt, with Absaloms leave, have free liberty to return to Gath; whereas thou, abiding with me, wilt hazard thine estate and the people that are with thee] and also thou shalt return to thy place."}],"20":[{"catchword":null,"tekst":"Thou camest yesterday, [i.e. lately] and should I lead thee about to day to go with us? seeing I must now go, whither I may go: return, and bring back thy brethren; kindness be with thee. [i.e. the like kindness and faithfulness happen to thee, as thou hast shewed to me. Oth. reward thy brethren, that are with thee, (with) kindness and faithfulness.]"}],"21":[{"catchword":null,"tekst":"But Ithai answered the King, and said: (as true as) the LORD liveth, and my Lord the king liveth; surely in the place, where my Lord the King shall be, be it for death, be it for life, there also shall thy servant be."}],"22":[{"catchword":null,"tekst":"Then said David unto Ithai; come then and pass over: [Over or thorough the brook Kidron, as is related in the sequel] So Ithai, the Gethite, passed over, and all his men, and all the children that were with him."}],"23":[{"catchword":null,"tekst":"And all the land [i.e. all the inhabitants of the land, lying about Jerusalem] wept with a loud [Hebr. Great] voice when all the people passed over: [or passed thorough; as some conceived that there were shallow places, where they might pass thorough on foot] the King also passed over the brook Kidron, [running east-ward by Jerusalem, along the foot of the mount of Olives. Our Saviour Jesus Christ himself went also over this brook, when he was to be apprehended and to suffer for us, Jos.18.1.] and all the people passed over straight toward the way [Heb. toward the face of the way] of the wilderness. [Lying between Jerusalem and the Jordan, otherwise also called the plain field. See below v.28. and ch.16.2. and 17.16. Item above chap.29.]"}],"24":[{"catchword":null,"tekst":"And so, Zadok [See above chap.8.on v.17.] was there also, and all the Levites with him, bearing the Ark of the covenant of God, and they set down the Ark, and Abjathar [see of this man, 1 Sam.22 20 &c. and 30.7, 8. below chap 28.25. 1 Kings 1.7. and 2.26, 27.] went up, [it may be, to spy from the top of the mount of Olives, when all the people that followed David out of Jerusalem, were passed over the brook Kidron and that there were none more to be expected. Compare Jos.3.17.] until all the people of the city had made an end of passing over."}],"25":[{"catchword":null,"tekst":"Then the King said unto Zadok; bring back the Ark of God into the carry if I shall find grace in the eyes of the Lord, then he will bring me back again, and will let me see it, together with his habitation. [Oth. with her habitation, namely, the Arks. Understand the Tabernacle, wherein the Ark was placed at that time, and consequently where God in a special manner was present with his grace. See above chap.6.17.]"}],"26":[{"catchword":null,"tekst":"But if he shall say thus, I have no delight in thee, behold, (there) am I, [See Gen.22.on v.3.] let him do so as it is good in his eyes. [i.e. so as it shall please, or seem good unto him. As if he had said; if on the contrary it please him to chastise me further, I am ready to submit to his will.]"}],"27":[{"catchword":null,"tekst":"Moreover the King said unto Zadok the Priest; art not thou a Seer? [i.e. a Teacher, that must look to the people? Oth. thou art the Seer, i.e. as a Prophet: (See 1 Sam.9.9.) because he enquired of the Lord by Urim and Thummim, and received answer from him: it may be also that he was a Prophet besides. Some take it thus: seest thou not, viz. how affairs go, and what is needful] return into the city in peace: also both your sons, Ahimaaz, thy son, and Jonathan, Abjathars son."}],"28":[{"catchword":null,"tekst":"Behold, I will tarry in the plain fields of the wilderness, until there come a word [i.e. some intelligence of what happeneth at Jerusalem, or is attempted by Absalom] from you, to be certified to me."}],"29":[{"catchword":null,"tekst":"So Zadok and Abjathar brought the Ark of God again to Jerusalem: and they tarried there."}],"30":[{"catchword":null,"tekst":"And David went up to the ascent of the Olives [That stood in great quantities upon the mount of Olives] going up and weeping, and his head was wound about, and he himself went bare-foot, [these were tokens of mourning, shame and humiliation. See also of covering the head, below chap.19.4. Esih.6. 12. Jer 14:3, 4. and chap.31.15. and of going bare-foot, or unshod, Isa 20:2, 3, 4. Jer 2:25.] and all the people that was him, had every man his head covered, and went up, going up and weeping."}],"31":[{"catchword":null,"tekst":"Then they told David, saying; [Oth. then David declared, saying] Achitophel is among those, that have conspired with Absalom: therefore David said; O Lord I pray turn the counsel of Achitophel into foolishness [Heb. make foolish, besot. Compare below chap.16. 23.]"}],"32":[{"catchword":null,"tekst":"And it came to pass, when David came to the top, [viz. of the mount of Olives, from whence he might behold the city, and the habitation of the Lord, wherein the Ark (a type of the Messiah Jesus Christ) abode, and whither Believers of the Old Testament, being absent or banishment, were wont to direct their faces in praying, in token that they grounded their prayers on the merits of the Messiah. Compare 1 Kings 8.44, 48. Dan.6.10.] that he worshipped God there, behold, then Husai, the Archite, met him, having his coat rent, and Earth upon his head. [see chap.1.on v.2.]"}],"33":[{"catchword":null,"tekst":"And David said unto him, if thou passest on with me, then thou shalt be a burden unto me. [Heb. be a burden upon me.]"}],"34":[{"catchword":null,"tekst":"But if thou return into the city, and say unto Absalom; thy servant, [An Abrupt speech, as we now also use to say, for I am thy servant, I will be thy servant] I will be the Kings: I have been indeed thy Fathers servant heretofore, [Heb. from that time] but now I will be thy servant: [oth. O king: I will be thy servant, as I have been formerly thy fathers, so will I now be thy servant] then thou shalt defeat for me the counsel of Achitophel."}],"35":[{"catchword":null,"tekst":"And are not there with thee Zadok and Abjathar the Priests? [i.e. they are surely there. Of such kind of questions see Judg.4.on v.6. and elsewhere often] So therefore it shall come to pass, that what thing soever thou shalt hear out of the Kings house, thou shalt make known to Zadok and Abjathar the Priests."}],"36":[{"catchword":null,"tekst":"Behold, both their sons are there with them, Ahimaaz Zadocks (son), and Jonathan Abjuthars (son): so by their hand [i.e. ministry] ye shall send to me what thing soever ye shall hear."}],"37":[{"catchword":null,"tekst":"So Husai David&acirc;&euro;&trade;s friend, came into the city; And Absalom came to Jerusalem."}]}}};

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;

}

/* ---------- rijen (her)bouwen ---------- */

  bijbel.innerHTML = '';
  bijbel.className = '';

    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:Lora;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
