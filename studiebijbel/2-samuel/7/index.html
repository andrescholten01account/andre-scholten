t en in een tabernakel.","7":"Overal waar Ik met al de kinderen van Israël heb rondgetrokken, heb Ik ooit een woord gesproken met een van de stammen van Israël, aan wie Ik geboden heb Mijn volk Israël te weiden, en gezegd: Waarom bouwt u Mij geen huis van cederhout?","8":"Nu dan, zo zult u tegen Mijn knecht, tegen David, zeggen: Zo zegt de HEERE van de heerscharen[1]: Ik heb u genomen van de schaapskooi, van achter de schapen, om een voorganger te zijn over Mijn volk, over Israël.","9":"En Ik ben met u geweest, overal waar u gegaan bent, en heb al uw vijanden voor uw aangezicht uitgeroeid; en Ik heb u een grote naam gemaakt, als de naam van de groten die op de aarde zijn.","10":"En Ik heb voor Mijn volk, voor Israël, een plaats bepaald, en hem geplant, zodat hij op zijn eigen plaats woont, en niet meer heen en weer gedreven wordt; en de kinderen van de verkeerdheid zullen hem niet meer onderdrukken, zoals in het begin,","11":"En vanaf de dag dat Ik geboden heb richters te wezen over Mijn volk Israël. Toch heb Ik u rust gegeven van al uw vijanden. Ook maakt de HEERE u bekend, dat de HEERE u een huis maken zal.","12":"Wanneer uw dagen vervuld zullen zijn, en u met uw vaderen zult ontslapen zijn, dan zal Ik uw nakomeling na u doen opstaan, die uit uw lijf voortkomen zal, en Ik zal zijn koninkrijk bevestigen.","13":"Die zal voor Mijn Naam een huis bouwen; en Ik zal de troon van zijn koninkrijk bevestigen tot in eeuwigheid.","14":"Ik zal hem tot een Vader zijn, en hij zal Mij tot een zoon zijn; wanneer hij misdoet, zal Ik hem straffen met een mensenroede en met plagen van de mensenkinderen.","15":"Maar Mijn goedertierenheid zal van hem niet wijken, zoals Ik die weggenomen heb van Saul, die Ik van voor uw aangezicht heb weggenomen.","16":"Doch uw huis zal bestendig zijn, en uw koninkrijk tot in eeuwigheid, voor uw aangezicht; uw troon zal vast zijn tot in eeuwigheid.","17":"Naar al deze woorden, en naar dit hele visioen, zo sprak Nathan tot David.","18":"Toen ging koning David naar binnen, en bleef voor het aangezicht van de HEERE, en hij zei: Wie ben ik, Heere HEERE, en wat is mijn huis, dat U mij tot hiertoe gebracht hebt?","19":"Daarbij is dit in Uw ogen nog klein geweest, Heere HEERE, maar U hebt ook over het huis van uw knecht gesproken tot ver in de toekomst; en dit naar de wet van de mensen, Heere HEERE!","20":"En wat zal David nog meer tot U spreken? Want U kent Uw knecht, Heere HEERE!","21":"Om het woord van Uw wil, en naar Uw hart hebt U al deze grote dingen gedaan, om ze aan Uw knecht bekend te maken.","22":"Daarom bent U groot, HEERE God! Want er is niemand gelijk U, en er is geen God dan alleen U, naar alles wat wij met onze oren gehoord hebben.","23":"En wie is gelijk Uw volk, gelijk Israël, een enig volk op aarde, dat God is heengegaan om Zich tot een volk te verlossen, en om Zich een Naam te maken, en om voor u deze grote en verschrikkelijke dingen te doen aan Uw land, voor het aangezicht van Uw volk, dat U voor Uzelf uit Egypte verlost hebt, terwijl U de heidenen en hun goden verdreef.","24":"En U hebt Uw volk Israël voor Uzelf bevestigd, voor Uzelf tot een volk, tot in eeuwigheid; en U, HEERE, bent hun tot een God geworden.","25":"Nu dan, HEERE God, doe dit woord, dat U over Uw knecht en over zijn huis gesproken hebt, blijven bestaan tot in eeuwigheid, en doe zoals U gesproken hebt.","26":"En laat Uw Naam groot gemaakt worden tot in eeuwigheid, zodat men zegt: De HEERE van de heerscharen is God over Israël; en het huis van Uw knecht David zal bestendig zijn voor Uw aangezicht.","27":"Want U, HEERE van de heerscharen, God van Israël! U hebt het voor het oor van Uw knecht geopenbaard, en gezegd: Ik zal u een huis bouwen; daarom heeft Uw knecht in zijn hart gevonden, dit gebed tot U te bidden.","28":"Nu dan, Heere HEERE! U bent die God, en Uw woorden zullen waarheid zijn, en U hebt dit goede tot Uw knecht gesproken.","29":"Zo belieft het U nu, en zegen het huis van Uw knecht, dat het in eeuwigheid voor Uw aangezicht blijft; want U, Heere HEERE, hebt het gesproken, en met Uw zegen zal het huis van Uw knecht gezegend worden in eeuwigheid."},"SV":{"1":"En het geschiedde, als de koning in zijn huis zat, en de HEERE hem rust gegeven had van al zijn vijanden rondom,","2":"Zo zeide de koning tot den profeet Nathan: Zie toch, ik woon in een cederen huis, en de ark Gods woont in het midden der gordijnen.","3":"En Nathan zeide tot den koning: Ga heen, doe al wat in uw hart is, want de HEERE is met u.","4":"Maar het gebeurde in denzelfden nacht, dat het woord des HEEREN tot Nathan geschiedde, zeggende:","5":"Ga, en zeg tot Mijn knecht, tot David: Zo zegt de HEERE: Zoudt gij Mij een huis bouwen tot Mijn woning?","6":"Want Ik heb in geen huis gewoond, van dien dag af, dat Ik de kinderen Israëls uit Egypte opvoerde, tot op dezen dag; maar Ik heb gewandeld in een tent en in een tabernakel.","7":"Overal, waar Ik met al de kinderen Israëls heb gewandeld, heb Ik wel een woord gesproken met een der stammen Israëls, dien Ik bevolen heb Mijn volk Israël te weiden, zeggende: Waarom bouwt gij Mij niet een cederen huis?","8":"Nu dan, alzo zult gij tot Mijn knecht, tot David, zeggen: Zo zegt de HEERE der heirscharen: Ik heb u genomen van de schaapskooi, van achter de schapen, dat gij een voorganger zoudt zijn over Mijn volk, over Israël.","9":"En Ik ben met u geweest, overal, waar gij gegaan zijt, en heb al uw vijanden voor uw aangezicht uitgeroeid; en Ik heb u een groten naam gemaakt, als den naam der groten, die op de aarde zijn.","10":"En Ik heb voor Mijn volk, voor Israël, een plaats besteld, en hem geplant, dat hij aan zijn plaats wone, en niet meer heen en weder gedreven worde; en de kinderen der verkeerdheid zullen hem niet meer verdrukken, gelijk als in het eerst.","11":"En van dien dag af, dat Ik geboden heb richters te wezen over Mijn volk Israël. Doch u heb Ik rust gegeven van al uw vijanden. Ook geeft u de HEERE te kennen, dat de HEERE u een huis maken zal.","12":"Wanneer uw dagen zullen vervuld zijn, en gij met uw vaderen zult ontslapen zijn, zo zal Ik uw zaad na u doen opstaan, dat uit uw lijf voortkomen zal, en Ik zal zijn koninkrijk bevestigen.","13":"Die zal Mijn Naam een huis bouwen; en Ik zal den stoel zijns koninkrijks bevestigen tot in eeuwigheid.","14":"Ik zal hem zijn tot een Vader, en hij zal Mij zijn tot een zoon; dewelke als hij misdoet, zo zal Ik hem met een mensenroede en met plagen der mensenkinderen straffen.","15":"Maar Mijn goedertierenheid zal van hem niet wijken, gelijk als Ik *die* weggenomen heb van Saul, dien Ik van voor uw aangezicht heb weggenomen.","16":"Doch uw huis zal bestendig zijn, en uw koninkrijk tot in eeuwigheid, voor uw aangezicht; uw stoel zal vast zijn tot in eeuwigheid.","17":"Naar al deze woorden, en naar dit ganse gezicht, alzo sprak Nathan tot David.","18":"Toen ging de koning David in, en bleef voor het aangezicht des HEEREN, en hij zeide: Wie ben ik, Heere HEERE, en wat is mijn huis, dat Gij mij tot hiertoe gebracht hebt?","19":"Daartoe is dit in Uw ogen nog klein geweest, Heere HEERE, maar Gij hebt ook over het huis Uws knechts gesproken tot van verre heen; en dit *naar* de wet der mensen, Heere HEERE!","20":"En wat zal David nog meer tot U spreken? Want Gij kent Uw knecht, Heere HEERE!","21":"Om Uws woords wil, en naar Uw hart hebt Gij al deze grote dingen gedaan, om aan Uw knecht bekend te maken.","22":"Daarom zijt Gij groot, HEERE God! Want er is niemand gelijk Gij, en er is geen God dan alleen Gij, naar alles, wat wij met onze oren gehoord hebben.","23":"En wie is, gelijk Uw volk, gelijk Israël, een enig volk op aarde, hetwelk God is heengegaan Zich tot een volk te verlossen, en om Zich een Naam te zetten, en om voor ulieden deze grote en verschrikkelijke dingen te doen aan Uw land, voor het aangezicht Uws volks, dat Gij U uit Egypte verlost hebt, de heidenen en hun goden *verdrijvende*.","24":"En Gij hebt Uw volk Israël U bevestigd, U tot een volk, tot in eeuwigheid; en Gij, HEERE, zijt hun tot een God geworden.","25":"Nu dan, HEERE God, doe dit woord, dat Gij over Uw knecht en over zijn huis gesproken hebt, bestaan tot in eeuwigheid, en doe, gelijk als Gij gesproken hebt.","26":"En Uw Naam worde groot gemaakt tot in eeuwigheid, dat men zegge: De HEERE der heirscharen is God over Israël; en het huis van Uw knecht David zal bestendig zijn voor Uw aangezicht.","27":"Want Gij, HEERE der heirscharen, Gij, God Israëls! Gij hebt *voor* het oor Uws knechts geopenbaard, zeggende: Ik zal u een huis bouwen; daarom heeft Uw knecht in zijn hart gevonden, dit gebed tot U te bidden.","28":"Nu dan, Heere HEERE! Gij zijt die God, en Uw woorden zullen waarheid zijn, en Gij hebt dit goede tot Uw knecht gesproken.","29":"Zo believe het U nu, en zegen het huis van Uw knecht, dat het in eeuwigheid voor uw aangezicht zij; want Gij, Heere HEERE, hebt *het* gesproken, en met Uw zegen zal het huis van Uw knecht gezegend worden in eeuwigheid."},"KJV":{"1":"And it came to pass, when the king sat in his house, and the LORD had given him rest round about from all his enemies;","2":"That the king said unto Nathan the prophet, See now, I dwell in an house of cedar, but the ark of God dwelleth within curtains.","3":"And Nathan said to the king, Go, do all that is in thine heart; for the LORD is with thee.","4":"And it came to pass that night, that the word of the LORD came unto Nathan, saying,","5":"Go and tell my servant David, Thus saith the LORD, Shalt thou build me an house for me to dwell in?","6":"Whereas I have not dwelt in any house since the time that I brought up the children of Israel out of Egypt, even to this day, but have walked in a tent and in a tabernacle.","7":"In all the places wherein I have walked with all the children of Israel spake I a word with any of the tribes of Israel, whom I commanded to feed my people Israel, saying, Why build ye not me an house of cedar?","8":"Now therefore so shalt thou say unto my servant David, Thus saith the LORD of hosts, I took thee from the sheepcote, from following the sheep, to be ruler over my people, over Israel:","9":"And I was with thee whithersoever thou wentest, and have cut off all thine enemies out of thy sight, and have made thee a great name, like unto the name of the great men that are in the earth.","10":"Moreover I will appoint a place for my people Israel, and will plant them, that they may dwell in a place of their own, and move no more; neither shall the children of wickedness afflict them any more, as beforetime,","11":"And as since the time that I commanded judges to be over my people Israel, and have caused thee to rest from all thine enemies. Also the LORD telleth thee that he will make thee an house.","12":"And when thy days be fulfilled, and thou shalt sleep with thy fathers, I will set up thy seed after thee, which shall proceed out of thy bowels, and I will establish his kingdom.","13":"He shall build an house for my name, and I will stablish the throne of his kingdom for ever.","14":"I will be his father, and he shall be my son. If he commit iniquity, I will chasten him with the rod of men, and with the stripes of the children of men:","15":"But my mercy shall not depart away from him, as I took it from Saul, whom I put away before thee.","16":"And thine house and thy kingdom shall be established for ever before thee: thy throne shall be established for ever.","17":"According to all these words, and according to all this vision, so did Nathan speak unto David.","18":"Then went king David in, and sat before the LORD, and he said, Who am I, O Lord GOD? and what is my house, that thou hast brought me hitherto?","19":"And this was yet a small thing in thy sight, O Lord GOD; but thou hast spoken also of thy servant's house for a great while to come. And is this the manner of man, O Lord GOD?","20":"And what can ➔ David say more unto thee? for thou, Lord GOD, knowest thy servant.","21":"For thy word's sake, and according to thine own heart, hast thou done all these great things, to make thy servant know them.","22":"Wherefore thou art great, O LORD God: for there is none like thee, neither is there any God beside thee, according to all that we have heard with our ears.","23":"And what one nation in the earth is like thy people, even like Israel, whom God went to redeem for a people to himself, and to make him a name, and to do for you great things and terrible, for thy land, before thy people, which thou redeemedst to thee from Egypt, from the nations and their gods?","24":"For thou hast confirmed to thyself thy people Israel to be a people unto thee for ever: and thou, LORD, art become their God.","25":"And now, O LORD God, the word that thou hast spoken concerning thy servant, and concerning his house, establish it for ever, and do as thou hast said.","26":"And let thy name be magnified for ever, saying, The LORD of hosts is the God over Israel: and let the house of thy servant David be established before thee.","27":"For thou, O LORD of hosts, God of Israel, hast revealed to thy servant, saying, I will build thee an house: therefore hath thy servant found in his heart to pray this prayer unto thee.","28":"And now, O Lord GOD, thou art that God, and thy words be true, and thou hast promised this goodness unto thy servant:","29":"Therefore now let it please thee to bless the house of thy servant, that it may continue for ever before thee: for thou, O Lord GOD, hast spoken it: and with thy blessing let the house of thy servant be blessed for ever."}},"tsk":{"1":[{"kopje":"de koning","refs":["1 Kron 17:1-15","Dan 4:29","Dan 4:30"]},{"kopje":"de HEERE","refs":["Joz 21:44","Joz 23:1","1 Kon 5:4","2 Kron 14:6","Ps 18:2","Spr 16:7","Luk 1:74","Luk 1:75"]}],"2":[{"kopje":"Nathan","refs":["2 Sam 12:1","1 Kron 29:29"]},{"kopje":"ik woon","refs":["2 Sam 5:11","1 Kron 14:1","Jer 22:13-15","Hagg 1:4"]},{"kopje":"de ark","refs":["Ps 132:5","Joh 2:17","Hand 7:46"]},{"kopje":"tentkleden","refs":["2 Sam 6:17","Ex 26:1-14","Ex 40:21","1 Kron 16:1","2 Kron wl-kjv\" data-code=\"H4428\">king,</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">Go,</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> all that is in thine <span class=\"wl wl-kjv\" data-code=\"H3824\">heart;</span> for the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> is with thee.","4":"And it came to pass that <span class=\"wl wl-kjv\" data-code=\"H3915\">night,</span> that the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> came unto <span class=\"wl wl-kjv\" data-code=\"H5416\">Nathan,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span>","5":"<span class=\"wl wl-kjv\" data-code=\"H3212\">Go</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">tell</span> my <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> Shalt thou <span class=\"wl wl-kjv\" data-code=\"H1129\">build</span> me an <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> for me to dwell <span class=\"wl wl-kjv\" data-code=\"H3427\">in?</span>","6":"Whereas I have not <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelt</span> in any <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> since the <span class=\"wl wl-kjv\" data-code=\"H3117\">time</span> that I brought <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> out of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> even to this <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> but have <span class=\"wl wl-kjv\" data-code=\"H1980\">walked</span> in a <span class=\"wl wl-kjv\" data-code=\"H168\">tent</span> and in a <span class=\"wl wl-kjv\" data-code=\"H4908\">taberna or U uit te spreken."}],"29":[{"catchword":"met Uw zegen","tekst":"Met deze woorden betuigt David zijn geloof, met hetwelk hij deze beloften Gods aannam, vastelijk vertrouwende dat zij zouden worden volbracht."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"And it came to pass when the King [Compare this whole Chapter with 1 Chron.17.] sat in his house [dwelling quietly, and being at rest, as followeth] and the Lord had given him rest from all his enemies round about; [who were so afraid of David, that they durst not make any more war against him: although David afterward of his own motion, made divers ways, to put Israel in possession of the right and freedom, that was promised them by God. See below chap.8. ver.11, 12, 13, 14. 1 Chron.18.3. & Gen 15:18.]"}],"2":[{"catchword":null,"tekst":"Then the King said unto the Prophet Nathan; Behold now, I dwell in an house of Cedar, [See above chap.5.11.] and the Ark of God dwelleth in the midst of Curtains. [According to Gods command, Exo 26:1, &c. intimating, that it became not him to have better dwelling then Ark had; and that therefore he purposed to build God an house of Cedar. See verse 7.]"}],"3":[{"catchword":null,"tekst":"And Nathan said unto the King; Go thy ways, do all that is in thine heart: for the LORD is with thee. [Nathan speaketh this in haste of his own accord, thinking no otherwise, but that David&acirc;&euro;&trade;s purpose pleased God, without expecting revelation from him in this weighty matter. See the like concerning Samuel, 1 Sam.16.6.]"}],"4":[{"catchword":null,"tekst":"But it happened that night, that the Word of the LORD came unto Nathan the Prophet, saying:"}],"5":[{"catchword":null,"tekst":"Go, and say unto my servant, unto David; Thus saith the LORD: shouldest thou build me an house, [God speaketh thus, because he manifested himself in this house, and above the Ark, by his gracious presence] for my dwelling?"}],"6":[{"catchword":null,"tekst":"For I have not dwelt in any house, since that day that I brought [Understand thereupon, thou shalt not do it] the children of Israel out of Egypt, unto this day, but I have walked [Heb. I have been walking] in a Tent, and in a Tabernacle."}],"7":[{"catchword":null,"tekst":"Whithersoever I have walked with all the children of Israel, spake I indeed a word with one of the tribes of Israel, whom I commanded to feel my people Israel. [See above chap.5.on verse 2. Out of which I now and then took, or raised a Judge or Ruler] saying, why build ye not me an house of Cedar? [The meaning is, that the LORD never complained, that the Rulers of Israel built him no house of Cedar.]"}],"8":[{"catchword":null,"tekst":"Now then, thus shalt thou say unto my servant, unto David; Thus saith the LORD of hosts; [As above chap.6.on ver.2.] I took thee from the sheep-coat, from after the sheep, to be a Leader over my people, over Israel. [The following rehearsal of Gods special favours manifested unto David, and to be manifested in time to come, served to prevent the seruple and doubt, which David might have drawn thence, that God would have no house for himself built by him: whereby he might have fallen into this surmise, as if he were not accepted of God, or that he esteemed him not worthy to do it.]"}],"9":[{"catchword":null,"tekst":"And I have been with thee whithersoever thou wentest, and have destroyed all thine enemies before thy face: and have made thee a great name, as the name of the great (ones) that are on the earth."}],"10":[{"catchword":null,"tekst":"And I have appointed [Oth. I will appoint] a place for my people, for Israel, and planted him, that he may dwell in his (own) place. [i.e. in his own peculiar land] and be no more driven to and fro; and the children of perverseness [see above chap.3.on verse 34.] shall no more oppress him, [Heb. shall not add, or go on to oppress him (Israel) understand all this, on condition obedience, see Deut.28.] according, as at the first. [this may be understood of the oppression in Egypt.]"}],"11":[{"catchword":null,"tekst":"And from that day, that I commanded [i.e. By my command, counsel and word raised and appointed. See above chap 6. verse 21.] Judge to be over my people Israel; But I gave thee rest from all thine enemies: [since that Israel being brought into and planted in the land of Promise by Josua, was served and protected by Judges, Judg.2.on verse 16.] Also the LORD maketh known to thee, that the LORD will make thee an house, [In stead, that thou purposest to build the LORD an house, he giveth thee to understand that he will build thee an house; i.e. establish and continue thy Kingdom in thy Posterity, and (that which is far more) raise up out of thy seed (according to the flesh) the Messiah, who shall be an everlasting King over his people. This Prophecy is so be understood, that it partly looketh at Salomon, as a type of the Lord Christ, partly at Christ himself, whole type he was: and that some things suit or agree to Salomon onely some onely and properly to Christ, some to them both.]"}],"12":[{"catchword":null,"tekst":"When thy days shall be fulfilled, and thou shalt be fallen asleep with thy fathers, [See Deut.31.on verse 10. Act.13.36.] then will cause thy seed [i.e. thy son, or one of thy sons, meaning Salomon, and the Messiah our Lord Jesus Christ, whose type and figure Salomon was. See 1 Chron.28.6 & Heb 1:5. & Act.13.22, 23. Rom 1:3, &c.] to arise after thee, that shall proceed out of thy body, [Heb. out of thy bowels] and I will establish his Kingdom."}],"13":[{"catchword":null,"tekst":"He shall build an house [Salomon the Temple of the Lord, Jesus Christ the spiritual house, that is, the Church of God] for my name, and shall establish the throne of his Kingdom for ever. [The Kingdom of Salomon and David continued indeed a long time, but this is properly to be understood of the spiritual Kingdom of Jesus Christ, forasmuch as the same above is properly everlasting: below verse 16. See Luk 1:32, 33.]"}],"14":[{"catchword":null,"tekst":"I will be to him father, [To him; i.e. to Salomon, by grace, viz. through adoption in Christ: but to the Lord Christ himself by nature, he being mine own, eternal, onely begotten son. See Job 1:18. Act 13 33. Heb 1:3, 5. Rom 8:3. 1 Job 4:9 &c.] and he shall be the Lord Christ was altogether without sin. See Isa 53:9. Heb.4 5. 2 Cor.5.21. 1 Pet.1.19. although he hath taken our sins upon him, and as our surely paid for them] then I will punish him with a rod of men, and with plagues of the children of men. [i.e. Fatherly and moderately, as a man useth to chasten his child: but will not cast him off, as in the following verse is set forth.]"}],"15":[{"catchword":null,"tekst":"But my loving kindness shall not depart from him; according as I have taken (the same) away from Saul, whom I have taken away from before thy face."}],"16":[{"catchword":null,"tekst":"But thine house, and thy Kingdom shall be established forever, [See above on verse 13 and compare Luk 1:32, 33.] before thy face: [i.e. Thou shalt live to see the beginning of the accomplishment of these Promises in thy son Salomon: from whence thou shalt be confident of the rest, as if thou now beheldest the accomplishment with thine own eyes. See 1 King.1.48. & 2 4.] thy throne shall be established forever."}],"17":[{"catchword":null,"tekst":"According to all these words, and according to all this vision; so did Nathan speak unto David. [i.e. Nathan delivered faithfully unto David, all that was revealed to him from the LORD, without dimishing from, or adding any thing thereunto.]"}],"18":[{"catchword":null,"tekst":"Then King David went in, [viz. Into the Tent, which he had called to be made for the Ark of the Covenant, above chap 6.17.] and continued before the face of the LORD: [see above chap.6.on ver.13.] and be said, Who am I, LORD, and what is mine house, that thou hast brought me hitherto?"}],"19":[{"catchword":null,"tekst":"Moreover, this [Which thou hast hitherto done by me] was yet little in thine eyes, Lord LORD , but thou hast spoken also over thy servants house for a great while to come: [i.e. of things which shall not happen till after a long time; and this (accordingly) the law of men, i.e. as men are wont to dispose their house, goods, and posterity. Oth. according to an instruction of men; i.e. very freely, familiarly, and friendly, as men are wont to speak with men, and to teach and instruct them. Oth. Is this a manner of men? i.e. thus to deal with men? The meaning will be thus: Are men worthy, that thou shouldest speak to them in such a friendly and samiliar way of such great and weighty things to come, which are determined in thy counsel? Tis too much, and too great!] Lord LORD."}],"20":[{"catchword":null,"tekst":"And what shall David speak yet more unto thee? for thou knowest thy servant, Lord LORD."}],"21":[{"catchword":null,"tekst":"For thy words sake, [i.e. For thy promise sake. Or, understand by the WORD the eternal Son of God, who is the substantial Word of the father, in whom all the Promises of God are Yea and Amen: see 1 Chron.17.on verse 19. Hag. 2.on verse 6.] and according to thine heart, [i.e. gracious good pleasure, counsel, or favourable affection toward me] hst thou done [David speaketh by Faith, and according to the manner of the Prophets, of things to come, as if they were already fulfilled, by reason of the certainty of Gods promises] all these great things; [Heb. all this greatness] to make (them) known to thy servant. [or, making (them) known to thy servant]"}],"22":[{"catchword":null,"tekst":"Therefore thou art great, LORD God; for there is none like thee, and there is no God then thou alone, [Or, except, or, besides thee] according to all that we have heard with our ears. [i.e. according to the demonstration of all, &c.]"}],"23":[{"catchword":null,"tekst":"And who is like thy people, like Israel, an onely people upon earth, which [Or, that, because] God went forth [Heb. ELOHIM went forth. See of this phrase Gen.20.on ver.13.] to redeem for a people to himself, and to make himself a Name, [i.e. to the honour of his holy Name] and to do for you [to wit, O Israel] these great and terrible things, [Heb. these greatness and terribleness, or, fearfulness] to thy hand [O God] before the face of thy people, which thou redeemedst to thee from Egypt, (expelling) [this word is here unserted from 1 Chron.7 21.] the heathen, and their Gods. [oth. thus: before the face of thy people, which thou redeemedst to thee, from Egypt, from the Nations, and their Gods.]"}],"24":[{"catchword":null,"tekst":"And thou hast established to thy self thy people Israel (to be) a people unto thee forever: [Understand Israel, according to the flesh, till the coming of Christ, but the spiritual Israel (that is, the Church of God, consisting of believing Jews and Gentiles) to all eternity] and thou, LORD, art become, [or, hast been] a God unto them. [See Gen.17.on verse 7. Levit.18.on verse 2.]"}],"25":[{"catchword":null,"tekst":"Now then, LORD God, establish forever, which thou hast spoken over thy servant, and over his house; and do according as thou hast spoken."}],"26":[{"catchword":null,"tekst":"And let thy Name be magnified forever, that it may be said; The LORD of host is God over Israel, and the house of thy servant David shall be established before thy face."}],"27":[{"catchword":null,"tekst":"For thou LORD of hosts, thou God of Israel, thou hast revealed (before) the ear of thy servant, [i.e. Thou hast caused me to hear, revealed to me, made Known, that which formerly was hidden from me. See the like phrase, Ruth 4 4. & 1 Sam.9 15. See there] saying; I will build thee an house: therefore thy servant hath found in his heart to pray this prayer unto thee. [Heb. hath found his heart, or, found with, or, by his heart, &c. i.e. he found himself so moved in his heart at it, that he purposed to utter this prayer before thee, as an evidence of his faith and thankfulness.]"}],"28":[{"catchword":null,"tekst":"Now then, Lord LORD, thou art that God, and thy words shall be truth: and thou hast spoken this good unto thy servant."}],"29":[{"catchword":null,"tekst":"So let it now please thee, and bless the house of thy servant, that it may before thy face: for thou lord LORD hast spoken (it), and with thy blessing shall thy servants house be blessed forever. [By these words David testifieth his Faith, whereby he received these promises of God, being strongly confident, that they shall be fulfilled.]"}]}}};

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;

  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];

    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen

      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {

      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);

        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
<script src="/studiebijbel/zoekbalk.js"></script></body>
</html>
