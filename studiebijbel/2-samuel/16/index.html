naam":"Openbaring","href":"../../openbaring/1/"}],"slugmap":{"Gen":"genesis","Ex":"exodus","Lev":"leviticus","Num":"numeri","Deut":"deuteronomium","Joz":"jozua","Richt":"richteren","Ruth":"ruth","1 Sam":"1-samuel","2 Sam":"2-samuel","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Toen David een klein stuk voorbij de top gegaan was, zie, daar ontmoette Ziba hem, de knecht van Mefiboseth, met een paar gezadelde ezels, en daarop tweehonderd broden, honderd stukken rozijnen, honderd stukken zomervruchten en een leren zak wijn.","2":"En de koning zei tegen Ziba: Wat wilt u daarmee? En Ziba zei: De ezels zijn voor het huis van de koning, om op te rijden, en het brood en de zomervruchten om te eten voor de knechten; en de wijn, opdat wie moede zijn in de woestijn, kunnen drinken.","3":"Toen zei de koning: Waar is dan de zoon van uw heer? En Ziba zei tegen de koning: Zie, hij blijft in Jeruzalem, want hij zei: Vandaag zal het huis van Israël mij het koninkrijk van mijn vader teruggeven.","4":"Zo zei de koning tegen Ziba: Zie, alles wat Mefiboseth heeft, zal van u zijn. En Ziba zei: Ik buig mij neer, laat mij genade vinden in uw ogen, mijn heer koning!","5":"Toen koning David tot bij Bahurim kwam, zie, daar kwam een man vandaan uit het geslacht van het huis van Saul, van wie de naam Simeï was, de zoon van Gera; hij liep almaar door en vloekte.","6":"En hij gooide David met stenen, en ook alle knechten van koning David, hoewel al het volk en alle helden aan zijn rechter- en aan zijn linkerhand waren.","7":"Zo zei Simeï, terwijl hij vloekte: Ga weg, ga weg, man van bloed, en man van Belial!","8":"De HEERE heeft op u al het bloed van het huis van Saul laten terugkomen, in wiens plaats u geregeerd hebt; nu heeft de HEERE het koninkrijk gegeven in de hand van Absalom, uw zoon; zie nu, u bent in uw ongeluk, omdat u een man van bloed bent.","9":"Toen zei Abisai, de zoon van Zeruja, tegen de koning: Waarom zou deze dode hond mijn heer de koning vloeken? Laat mij toch oversteken en zijn kop wegnemen.","10":"Maar de koning zei: Wat heb ik met u te doen, zonen van Zeruja? Ja, laat hem vloeken; want de HEERE heeft immers[1] tegen hem gezegd: Vloek David; wie zou dan zeggen: Waarom hebt u dat gedaan?","11":"Verder zei David tegen Abisai en tegen al zijn knechten: Zie, mijn zoon, die uit mijn lijf is voortgekomen, zoekt mijn leven; hoeveel te meer dan nu deze zoon van Jemini? Laat hem begaan, laat hij vloeken, want de HEERE heeft het hem gezegd.","12":"Misschien zal de HEERE naar mijn ellende omzien; en de HEERE zal mij goed vergelden voor zijn vloek van vandaag.","13":"Zo ging David met zijn mannen op de weg; en Simeï liep al voortgaand langs de kant van de berg tegenover hem, en vloekte, en gooide met stenen van tegenover hem, en wierp stof op.","14":"En de koning kwam aan, en al het volk dat bij hem was, moede zijnde; en hij verkwikte zich daar.","15":"Absalom nu en al het volk, de mannen van Israël, kwamen in Jeruzalem aan, en Achitofel met hem.","16":"En het gebeurde, toen Husai, de Archiet, Davids vriend, bij Absalom kwam, dat Husai tegen Absalom zei: Leve de koning, leve de koning!","17":"Maar Absalom zei tegen Husai: Is dit uw trouw aan uw vriend? Waarom bent u niet met uw vriend meegegaan?","18":"En Husai zei tegen Absalom: Nee, maar wie de HEERE verkiest, en dit hele volk, en alle mannen van Israël, van hem zal ik zijn, en bij hem zal ik blijven.","19":"En verder, aan wie zou ik dienen? Zou het niet zijn voor het aangezicht van zijn zoon? Zoals ik voor het aangezicht van uw vader gediend heb, zo zal ik voor uw aangezicht zijn.","20":"Toen zei Absalom tegen Achitofel: Geef onder u raad, wat zullen wij doen?","21":"En Achitofel zei tegen Absalom: Ga naar de bijvrouwen van uw vader, die hij heeft achtergelaten om het huis te bewaren; zo zal heel Israël horen dat u zich bij uw vader gehaat gemaakt hebt, en de handen van allen die bij u zijn, zullen gesterkt worden.","22":"Zo spanden zij voor Absalom een tent op op het dak; en Absalom ging naar de bijvrouwen van zijn vader, voor de ogen van heel Israël.","23":"In die dagen was de raad die Achitofel gaf, als had men naar het woord van God gevraagd; zo was alle raad van Achitofel, zowel bij David als bij Absalom."},"SV":{"1":"Als nu David een weinig van de hoogte was voortgegaan, ziet, toen ontmoette hem Ziba, Mefiboseths jongen, met een paar gezadelde ezelen, en daarop tweehonderd broden, met honderd stukken rozijnen, en honderd *stukken* zomervruchten, en een lederen zak wijns.","2":"En de koning zeide tot Ziba: Wat zult gij daarmede? En Ziba zeide: De ezels zijn voor het huis des konings, om op te rijden en het brood en de zomervruchten, om te eten voor de jongens; en de wijn, opdat de moeden in de woestijn drinken.","3":"Toen zeide de koning: Waar is dan de zoon uws heren? En Ziba zeide tot den koning: Zie, hij blijft te Jeruzalem, want hij zeide: Heden zal mij het huis Israëls mijns vaders koninkrijk wedergeven.","4":"Zo zeide de koning tot Ziba: Zie, het zal het uwe zijn alles wat Mefiboseth heeft. En Ziba zeide: Ik buig mij neder, laat mij genade vinden in uw ogen, mijn heer koning!","5":"Als nu de koning David tot aan Bahurim kwam, ziet, toen kwam van daar een man uit, van het geslacht van het huis van Saul, wiens naam was Simeï, de zoon van Gera; hij ging steeds voort, en vloekte.","6":"En hij wierp David met stenen, mitsgaders alle knechten van den koning David, hoewel al het volk en al de helden aan zijn rechter-en aan zijn linkerhand waren.","7":"Aldus nu zeide Simeï in zijn vloeken: Ga uit, ga uit, gij, man des bloeds, en gij, Belials man!","8":"De HEERE heeft op u doen wederkomen al het bloed van Sauls huis, in wiens plaats gij geregeerd hebt; nu heeft de HEERE het koninkrijk gegeven in de hand van Absalom, uw zoon; zie nu, gij zijt in uw ongeluk, omdat gij een man des bloeds zijt.","9":"Toen zeide Abisai, de zoon van Zeruja, tot den koning: Waarom zou deze dode hond mijn heer den koning vloeken? Laat mij toch overgaan en zijn kop wegnemen.","10":"Maar de koning zeide: Wat heb ik met u te doen, gij zonen van Zeruja? Ja, laat hem vloeken; want de HEERE toch heeft tot hem gezegd: Vloek David; wie zou dan zeggen: Waarom hebt gij alzo gedaan?","11":"Voorts zeide David tot Abisai en tot al zijn knechten: Ziet, mijn zoon, die van mijn lijf is voortgekomen, zoekt mijn ziel; hoeveel te meer dan nu deze zoon van Jemini? Laat hem geworden, dat hij vloeke, want de HEERE heeft het hem gezegd.","12":"Misschien zal de HEERE mijn ellende aanzien; en de HEERE zal mij goed vergelden voor zijn vloek, te dezen dage.","13":"Alzo ging David met zijn lieden op den weg; en Simeï ging al voort langs de zijde des bergs tegen hem over, en vloekte, en wierp met stenen van tegenover hem, en stoof met stof.","14":"En de koning kwam in, en al het volk, dat met hem was, moede zijnde; en hij verkwikte zich aldaar.","15":"Absalom nu en al het volk, de mannen van Israël, kwamen te Jeruzalem, en Achitofel met hem.","16":"En het geschiedde, als Husai, de Archiet, Davids vriend, tot Absalom kwam, dat Husai tot Absalom zeide: De koning leve, de koning leve!","17":"Maar Absalom zeide tot Husai: Is dit uw weldadigheid aan uw vriend? Waarom zijt gij niet met uw vriend getogen?","18":"En Husai zeide tot Absalom: Neen, maar welken de HEERE verkiest, en al dit volk, en alle mannen van Israël, diens zal ik zijn, en bij hem zal ik blijven.","19":"En ten andere, wien zou ik dienen? Zou het niet zijn voor het aangezicht zijns zoons? Gelijk als ik voor het aangezicht uws vaders gediend heb, alzo zal ik voor uw aangezicht zijn.","20":"Toen zeide Absalom tot Achitofel: Geeft onder ulieden raad, wat zullen wij doen?","21":"En Achitofel zeide tot Absalom: Ga in tot de bijwijven uws vaders, die hij gelaten heeft om het huis te bewaren; zo zal gans Israël horen, dat gij bij uw vader stinkende zijt geworden, en de handen van allen, die met u zijn, zullen gesterkt worden.","22":"Zo spanden zij Absalom een tent op het dak; en Absalom ging in tot de bijwijven zijns vaders, voor de ogen van het ganse Israël.","23":"En in die dagen was Achitofels raad, dien hij raadde, als of men naar Gods woord gevraagd had; alzo was alle raad van Achitofel, zo bij David als bij Absalom."},"KJV":{"1":"And when David was a little past the top of the hill, behold, Ziba the servant of Mephibosheth met him, with a couple of asses saddled, and upon them two hundred loaves of bread, and an hundred bunches of raisins, and an hundred of summer fruits, and a bottle of wine.","2":"And the king said unto Ziba, What meanest thou by these? And Ziba said, The asses be for the king's household to ride on; and the bread and summer fruit for the young men to eat; and the wine, that such as be faint in the wilderness may drink.","3":"And the king said, And where is thy master's son? And Ziba said unto the king, Behold, he abideth at Jerusalem: for he said, To day shall the house of Israel restore me the kingdom of my father.","4":"Then said the king to Ziba, Behold, thine are all that pertained unto Mephibosheth. And Ziba said, I humbly beseech thee that I may find grace in thy sight, my lord, O king.","5":"And when king David came to Bahurim, behold, thence came out a man of the family of the house of Saul, whose name was Shimei, the son of Gera: he came forth, and cursed still as he came.","6":"And he cast stones at David, and at all the servants of king David: and all the people and all the mighty men were on his right hand and on his left.","7":"And thus said Shimei when he cursed, Come out, come out, thou bloody man, and thou man of Belial:","8":"The LORD hath returned upon thee all the blood of the house of Saul, in whose stead thou hast reigned; and the LORD hath delivered the kingdom into the hand of Absalom thy son: and, behold, thou art taken in thy mischief, because thou art a bloody man.","9":"Then said Abishai the son of Zeruiah unto the king, Why should this dead dog curse my lord the king? let me go over, I pray thee, and take off his head.","10":"And the king said, What have I to do with you, ye sons of Zeruiah? so let him curse, because the LORD hath said unto him, Curse David. Who shall then say, Wherefore hast thou done so?","11":"And David said to Abishai, and to all his servants, Behold, my son, which came forth of my bowels, seeketh my life: how much more now may this Benjamite do it? let him alone, and let him curse; for the LORD hath bidden him.","12":"It may be that the LORD will look on mine affliction, and that the LORD will requite me good for his cursing this day.","13":"And as David and his men went by the way, Shimei went along on the hill's side over against him, and cursed as he went, and threw stones at him, and cast dust.","14":"And the king, and all the people that were with him, came weary, and refreshed themselves there.","15":"And Absalom, and all the people the men of Israel, came to Jerusalem, and Ahithophel with him.","16":"And it came to pass, when Hushai the Archite, David's friend, was come unto Absalom, that Hushai said unto Absalom, God save the king, God save the king.","17":"And Absalom said to Hushai, Is this thy kindness to thy friend? why wentest thou not with thy friend?","18":"And Hushai said unto Absalom, Nay; but whom the LORD, and this people, and all the men of Israel, choose, his will I be, and with him will I abide.","19":"And again, whom should I serve? should I not serve in the presence of his son? as I have served in thy father's presence, so will I be in thy presence.","20":"Then said Absalom to Ahithophel, Give counsel among you what we shall do.","21":"And Ahithophel said unto Absalom, Go in unto thy father's concubines, which he hath left to keep the house; and all Israel shall hear that thou art abhorred of thy father: then shall the hands of all that are with thee be strong.","22":"So they spread Absalom a tent upon the top of the house; and Absalom went in unto his father's concubines in the sight of all Israel.","23":"And the counsel of Ahithophel, which he counselled in those days, was as if a man had enquired at the oracle of God: so was all the counsel of Ahithophel both with David and with Absalom."}},"tsk":{"1":[{"kopje":"een klein stuk voorbij","refs":["2 Sam 15:30","2 Sam 15:32"]},{"kopje":"Ziba","refs":["2 Sam 9:2","2 Sam 9:9-12"]},{"kopje":"met een paar","refs":["2 Sam 17:27-29","2 Sam 19:32","1 Sam 17:17","1 Sam 17:18","1 Sam 25:18","1 Kron 12:40","Spr 18:16","Spr 29:4","Spr 29:5"]},{"kopje":"zomervruchten","refs":["Jer 40:10","Jer 40:12","Amos 8:1","Micha 7:1"]},{"kopje":"een leren zak","refs":["1 Sam 10:3","1 Sam 16:20"]}],"2":[{"kopje":"Wat wilt u","refs":["Gen 21:29","Gen 33:8","Ezech 37:18","2 Sam 15:1","2 Sam 19:26","Richt 5:10","Richt 10:4"]},{"kopje":"knechten","refs":["1 Sam 25:27"]},{"kopje":"die moede zijn","refs":["2 Sam 15:23","2 Sam 17:29","Richt 8:4","Richt 8:5","1 Sam 14:28","Spr 31:6","Spr 31:7"]}],"3":[{"kopje":"Waar is dan","refs":["2 Sam 9:9","2 Sam 9:10","Ps 88:19","Micha 7:5"]},{"kopje":"Vandaag","r v\" data-code=\"H4648\">Mephibosheth</span> <span class=\"wl wl-kjv\" data-code=\"H7125\">met</span> him, with a <span class=\"wl wl-kjv\" data-code=\"H6776\">couple</span> of <span class=\"wl wl-kjv\" data-code=\"H2543\">asses</span> <span class=\"wl wl-kjv\" data-code=\"H2280\">saddled,</span> and upon them two <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> loaves of <span class=\"wl wl-kjv\" data-code=\"H3899\">bread,</span> and an <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> bunches of <span class=\"wl wl-kjv\" data-code=\"H6778\">raisins,</span> and an <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> of summer <span class=\"wl wl-kjv\" data-code=\"H7019\">fruits,</span> and a <span class=\"wl wl-kjv\" data-code=\"H5035\">bottle</span> of <span class=\"wl wl-kjv\" data-code=\"H3196\">wine.</span>","2":"And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H6717\">Ziba,</span> What meanest thou by these? And <span class=\"wl wl-kjv\" data-code=\"H6717\">Ziba</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> The <span class=\"wl wl-kjv\" data-code=\"H2543\">asses</span> be for the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">household</span> to ride <span class=\"wl wl-kjv\" data-code=\"H7392\">on;</span> and the <span class=\"wl wl-kjv\" data-code=\"H3899\">bread</span> and summer <span class=\"wl wl-kjv\" data-code=\"H7019\">fruit</span> for the young <span class=\"wl wl-kjv\" data-code=\"H5288\">men</span> to <span class=\"wl wl-kjv\" data-code=\"H398\">eat;</span> and the <span class=\"wl wl-kjv\" data-code=\"H3196\">wine,</span> that such as be <span class=\"wl wl-kjv\" data-code=\"H3287\">faint</span> in the <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness</span> may <span class=\"wl wl-kjv\" data-code=\"H8354\">drink.</span>","3":"And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> And where is thy <span class=\"wl wl-kjv\" data-code=\"H113\">master's</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">son?</span> And <span class=\"wl wl-kjv\" data-code=\"H6717\">Ziba</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> Behold, he <span class=\"wl wl-kjv\" data-code=\"H3427\">abideth</span> at <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem:</span> for he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> To <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> shall the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">restore</span> me the <span class=\"wl wl-kjv\" data-code=\"H4468\">kingdom</span> of my <span class=\"wl wl-kjv\" data-code=\"H1\">father.</span>","4":"Then <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> to <span class=\"wl wl-kjv\" data-code=\"H6717\">Ziba,</span> Behold, thine are all that pertained unto <span class=\"wl wl-kjv\" data-code=\"H4648\">Mephibosheth.</span> And <span class=\"wl wl-kjv\" data-code=\"H6717\">Ziba</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> I <span class=\"wl wl-kjv\" data-code=\"H7812\">humbly</span> beseech thee that I may <span class=\"wl wl-kjv\" data-code=\"H4672\">find</span> <span class=\"wl wl-kjv\" data-code=\"H2580\">grace</span> in thy <span class=\"wl wl-kjv\" data-code=\"H5869\">sight,</span> my <span class=\"wl wl-kjv\" data-code=\"H113\">lord,</span> O <span class=\"wl wl-kjv\" data-code=\"H4428\">king.</span>","5":"And when <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to <span class=\"wl wl-kjv\" data-code=\"H980\">Bahurim,</span> behold, thence came <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of the <span class=\"wl wl-kjv\" data-code=\"H4940\">family</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul,</span> whose <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> was <span class=\"wl wl-kjv\" data-code=\"H8096\">Shimei,</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H1617\">Gera:</span> he came <span class=\"wl wl-kjv\" data-code=\"H3318\">forth,</span> and <span class=\"wl wl-kjv\" data-code=\"H7043\">cursed</span> still as he <span class=\"wl wl-kjv\" data-code=\"H3318\">came.</span>","6":"And he <span class=\"wl wl-kjv\" data-code=\"H5619\">cast</span> <span class=\"wl wl-kjv\" data-code=\"H68\">stones</span> at <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> and at all the <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> of <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David:</span> and all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> and all the mighty <span class=\"wl wl-kjv\" data-code=\"H1368\">men</span> were on his right <span class=\"wl wl-kjv\" data-code=\"H3225\">hand</span> and on his <span class=\"wl wl-kjv\" data-code=\"H8040\">left.</span>","7":"And thus <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> <span class=\"wl wl-kjv\" data-code=\"H8096\">Shimei</span> when he <span class=\"wl wl-kjv\" data-code=\"H7043\">cursed,</span> Come <span class=\"wl wl-kjv\" data-code=\"H3318\">out,</span> come <span class=\"wl wl-kjv\" data-code=\"H3318\">out,</span> thou <span class=\"wl wl-kjv\" data-code=\"H1818\">bloody</span> <span class=\"wl wl-kjv\" data-code=\"H376\">man,</span> and thou <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H1100\">Belial:</span>","8":"The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H7725\">returned</span> upon thee all the <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul,</span> in whose stead thou hast <span class=\"wl wl-kjv\" data-code=\"H4427\">reigned;</span> and the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H5414\">delivered</span> the <span class=\"wl wl-kjv\" data-code=\"H4410\">kingdom</span> into the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom</span> thy <span class=\"wl wl-kjv\" data-code=\"H1121\">son:</span> and, behold, thou art taken in thy <span class=\"wl wl-kjv\" data-code=\"H7451\">mischief,</span> because thou art a <span class=\"wl wl-kjv\" data-code=\"H1818\">bloody</span> <span class=\"wl wl-kjv\" data-code=\"H376\">man.</span>","9":"Then <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> <span class=\"wl wl-kjv\" data-code=\"H52\">Abishai</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H6870\">Zeruiah</span> unto the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> Why should this <span class=\"wl wl-kjv\" data-code=\"H4191\">dead</span> <span class=\"wl wl-kjv\" data-code=\"H3611\">dog</span> <span class=\"wl wl-kjv\" data-code=\"H7043\">curse</span> my <span class=\"wl wl-kjv\" data-code=\"H113\">lord</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king?</span> let me go <span class=\"wl wl-kjv\" data-code=\"H5674\">over,</span> I pray thee, and take <span class=\"wl wl-kjv\" data-code=\"H5493\">off</span> his <span class=\"wl wl-kjv\" data-code=\"H7218\">head.</span>","10":"And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> What have I to do with you, ye <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H6870\">Zeruiah?</span> so let him <span class=\"wl wl-kjv\" data-code=\"H7043\">curse,</span> because the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, <span class=\"wl wl-kjv\" data-code=\"H7043\">Curse</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David.</span> Who shall then <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> Wherefore hast thou done <span class=\"wl wl-kjv\" data-code=\"H6213\">so?</span>","11":"And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to <span class=\"wl wl-kjv\" data-code=\"H52\">Abishai,</span> and to all his <span class=\"wl wl-kjv\" data-code=\"H5650\">servants,</span> Behold, my <span class=\"wl wl-kjv\" data-code=\"H1121\">son,</span> which came <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> of my <span class=\"wl wl-kjv\" data-code=\"H4578\">bowels,</span> <span class=\"wl wl-kjv\" data-code=\"H1245\">seeketh</span> my <span class=\"wl wl-kjv\" data-code=\"H5315\">life:</span> how much more now may this <span class=\"wl wl-kjv\" data-code=\"H1145\">Benjamite</span> do it? let him <span class=\"wl wl-kjv\" data-code=\"H3240\">alone,</span> and let him <span class=\"wl wl-kjv\" data-code=\"H7043\">curse;</span> for the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H559\">bidden</span> him.","12":"It may be that the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> will <span class=\"wl wl-kjv\" data-code=\"H7200\">look</span> on mine <span class=\"wl wl-kjv\" data-code=\"H5869\">affliction,</span> and that the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> will <span class=\"wl wl-kjv\" data-code=\"H7725\">requite</span> me <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> for his <span class=\"wl wl-kjv\" data-code=\"H7045\">cursing</span> this <span class=\"wl wl-kjv\" data-code=\"H3117\">day.</span>","13":"And as <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> and his <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> by the <span class=\"wl wl-kjv\" data-code=\"H1870\">way,</span> <span class=\"wl wl-kjv\" data-code=\"H8096\">Shimei</span> went <span class=\"wl wl-kjv\" data-code=\"H1980\">along</span> on the <span class=\"wl wl-kjv\" data-code=\"H2022\">hill's</span> <span class=\"wl wl-kjv\" data-code=\"H6763\">side</span> over <span class=\"wl wl-kjv\" data-code=\"H5980\">against</span> him, and <span class=\"wl wl-kjv\" data-code=\"H7043\">cursed</span> as he <span class=\"wl wl-kjv\" data-code=\"H1980\">went,</span> and <span class=\"wl wl-kjv\" data-code=\"H5619\">threw</span> <span class=\"wl wl-kjv\" data-code=\"H68\">stones</span> <span class=\"wl wl-kjv\" data-code=\"H5980\">at</span> him, and <span class=\"wl wl-kjv\" data-code=\"H6080\">cast</span> <span class=\"wl wl-kjv\" data-code=\"H6083\">dust.</span>","14":"And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> that were with him, <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> <span class=\"wl wl-kjv\" data-code=\"H5889\">weary,</span> and <span class=\"wl wl-kjv\" data-code=\"H5314\">refreshed</span> themselves there.","15":"And <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> the <span class=\"wl wl-kjv\" data-code=\"H376\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> <span class ing. Compare above chap.13.19. and below v.13.]"}],"6":[{"catchword":null,"tekst":"And he cast stones at David; and likewise at all the servants of King David: although all the people, and all the champions were at his right hand and on his left. [He attempted so bold a fact, not withstanding that all these marched by David&acirc;&euro;&trade;s side.]"}],"7":[{"catchword":null,"tekst":"Now thus said Simei in his cursing: [Or when, or while he cursed him, to wit, David] come out, come out, thou man of blood, [Heb. man of bloods, i.e. thou murderer, thou blood-thirsty person, see Psa.5.on v.7.] and thou man of Belial. [see Deut.13.on v.13.]"}],"8":[{"catchword":null,"tekst":"The Lord hath caused to return upon thee all the blood [See Judg.9.on v.24.] of the house of Saul, in whose stead thou hast reigned: [he reviles David, as the Author of Abners and Isboseths murder, intimating, that by that means David came to the Crown & Kingdom of all Israel] now the Lord hath delivered the Kingdom into the hand of Absalom, thy son: behold, now thou art in thy mischief, [Heb. evil, i.e. misery, punishment of thy sins] because thou art a man of blood."}],"9":[{"catchword":null,"tekst":"Then said Abisai, the son of Zeruja, unto the King, why should this dead dog [see above chap.9. on v.8.] curse my Lord the King? Let me go over, I pray thee, and take off his head."}],"10":[{"catchword":null,"tekst":"But the King said; what have I to do with you, [Heb. what (is) to me and to you? Or what have I and ye? viz. to do one with another. As if he had said: why do ye always vex me with your wrath and hastiness, whereby ye are prone to be straightway smitten with the sword. So below chap.9.22. and Judg.11.12, &c.] the sons of Zeruja? yea, let him curse; for the LORD hath now said unto him, curse David: [understand this not properly, as if God had commanded it either outwardly by his word, or inwardly by his holy Spirit: but by comparison from the secret guidance and providence of God, whereby he delivered up this same Simei unto Satan, and to his own wicked lusts, and so over-ruled his wickedness, which he had of and from himself , that he now exercised it against David, to chastice and humible him as a gracious and loving father, and then justlytp punish Simei&acirc;&euro;&trade;s wickedness. Compare 1 Sam.18.10, 11 1 Kings 22.21, 22. 1 Chron.21.1. and above ch.12.11,12, below chap.24.1.] who shall then say; [viz. unto the Lord. Although God at this time did David no wrong, yet Simei committed a grievous crime, who Judge David to be worthy of punishment. See 1 Kings 2.9.] wherefore hast thou done so?"}],"11":[{"catchword":null,"tekst":"Moreover, David said to Abisai, and to all his servants; behold, my son which came forth of my body, seeketh my soul; [i.e. hunteth after my life. See above chap.4.on v.8.] how much more then this son of Jemini? [i.e. this Benjamite, as Judg.19.16 Simei was of Sauls family, above v.5. and Saul was of the tribe of Benjamin. See above chap.3.on v.19.] and below chap.19 16.] let him alone, let him curse, for the LORD hath said it to him. [see on the former verse.]"}],"12":[{"catchword":null,"tekst":"It may be the LORD will look on my misery: [Oth. mine eye, i.e. my tears] and the LORD will recompense good unto me, for his curse, this day. [i.e. wherewith Simei curseth me this day, or it may be God will also even this very day allot me out some good for this curse.]"}],"13":[{"catchword":null,"tekst":"So David with his men went on the way: and Simei went on [Heb. went, going] along the bills side over against him, [viz. David] and cursed, and threw with stones from over against him, [or at him] and dusted with dust. [i.e. he raised dust and kick it up, and cast it upon David and his men: or he threw lumps or pieces of Earth, so that David and his men were all bedusted with it.]"}],"14":[{"catchword":null,"tekst":"And the King came in, and all the people that were with him, being weary: and he refreshed himself there."}],"15":[{"catchword":null,"tekst":"Now Absalom and all the people, the men of Israel, came to Jerusalem, and Achitophel with him. [viz. Absalom.]"}],"16":[{"catchword":null,"tekst":"And it came to pass, when Husai, the Archite, David&acirc;&euro;&trade;s friend came to Absalom, that Husai had said unto Absalom; let the King live, let the King live. [i.e. I wish the King health and happiness with a long life.]"}],"17":[{"catchword":null,"tekst":"But Absalom said unto Husai; is this thy kindness tp thy friend? Why wentest thou not with thy friend."}],"18":[{"catchword":null,"tekst":"And Husai said unto Absalom; nay, but whom the Lord chuseth, and all this people, and all the men of Israel, his will I be, and with him will I abide."}],"19":[{"catchword":null,"tekst":"And again, whom shall I serve? Should I not be before the face of his [viz. David&acirc;&euro;&trade;s] son? according as I have served before thy Fathers face, so will I be before thy face."}],"20":[{"catchword":null,"tekst":"Then said Absalom to Achitophel? Give counsel among you, what shall we do?"}],"21":[{"catchword":null,"tekst":"And Achitophel said unto Absalom: go in unto thy Fathers concubines, [i.e. lie with them, see Gen.6.on v.4.] which he hath left to keep the house: then all Israel shall hear, that thou art become stinking before thy Father, [see Gen.34.on v.30. i.e. hearing that, they will understand and perceive, that thou goest in good earnest against thy father, and carest not for him, so that they need not fear that thou wilt be reconciled to thy father, and they then be in danger of punishment] and the hands of all that are with thee shall be strengthened. [i.e. they will take heart and courage, to go on stoutly and without fear with thee against thy father. As on the contrary, the hands growing slack, signifieth to lose all courage and valour. See above chap.4. 1.]"}],"22":[{"catchword":null,"tekst":"So they spread Absalom a tent upon the roof: [See Deu.22.on v.8. and above chap.11.2.] And /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:"Lora";font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
