honderd stukken zomervruchten en een leren zak wijn.", "2": "En de koning zei tegen Ziba: Wat wilt u daarmee? En Ziba zei: De ezels zijn voor het huis van de koning, om op te rijden, en het brood en de zomervruchten om te eten voor de knechten; en de wijn, opdat wie moede zijn in de woestijn, kunnen drinken.", "3": "Toen zei de koning: Waar is dan de zoon van uw heer? En Ziba zei tegen de koning: Zie, hij blijft in Jeruzalem, want hij zei: Vandaag zal het huis van Israël mij het koninkrijk van mijn vader teruggeven.", "4": "Zo zei de koning tegen Ziba: Zie, alles wat Mefiboseth heeft, zal van u zijn. En Ziba zei: Ik buig mij neer, laat mij genade vinden in uw ogen, mijn heer koning!", "5": "Toen koning David tot bij Bahurim kwam, zie, daar kwam een man vandaan uit het geslacht van het huis van Saul, van wie de naam Simeï was, de zoon van Gera; hij liep almaar door en vloekte.", "6": "En hij gooide David met stenen, en ook alle knechten van koning David, hoewel al het volk en alle helden aan zijn rechter- en aan zijn linkerhand waren.", "7": "Zo zei Simeï, terwijl hij vloekte: Ga weg, ga weg, man van bloed, en man van Belial!", "8": "De HEERE heeft op u al het bloed van het huis van Saul laten terugkomen, in wiens plaats u geregeerd hebt; nu heeft de HEERE het koninkrijk gegeven in de hand van Absalom, uw zoon; zie nu, u bent in uw ongeluk, omdat u een man van bloed bent.", "9": "Toen zei Abisai, de zoon van Zeruja, tegen de koning: Waarom zou deze dode hond mijn heer de koning vloeken? Laat mij toch oversteken en zijn kop wegnemen.", "10": "Maar de koning zei: Wat heb ik met u te doen, zonen van Zeruja? Ja, laat hem vloeken; want de HEERE heeft immers[1] tegen hem gezegd: Vloek David; wie zou dan zeggen: Waarom hebt u dat gedaan?", "11": "Verder zei David tegen Abisai en tegen al zijn knechten: Zie, mijn zoon, die uit mijn lijf is voortgekomen, zoekt mijn leven; hoeveel te meer dan nu deze zoon van Jemini? Laat hem begaan, laat hij vloeken, want de HEERE heeft het hem gezegd.", "12": "Misschien zal de HEERE naar mijn ellende omzien; en de HEERE zal mij goed vergelden voor zijn vloek van vandaag.", "13": "Zo ging David met zijn mannen op de weg; en Simeï liep al voortgaand langs de kant van de berg tegenover hem, en vloekte, en gooide met stenen van tegenover hem, en wierp stof op.", "14": "En de koning kwam aan, en al het volk dat bij hem was, moede zijnde; en hij verkwikte zich daar.", "15": "Absalom nu en al het volk, de mannen van Israël, kwamen in Jeruzalem aan, en Achitofel met hem.", "16": "En het gebeurde, toen Husai, de Archiet, Davids vriend, bij Absalom kwam, dat Husai tegen Absalom zei: Leve de koning, leve de koning!", "17": "Maar Absalom zei tegen Husai: Is dit uw trouw aan uw vriend? Waarom bent u niet met uw vriend meegegaan?", "18": "En Husai zei tegen Absalom: Nee, maar wie de HEERE verkiest, en dit hele volk, en alle mannen van Israël, van hem zal ik zijn, en bij hem zal ik blijven.", "19": "En verder, aan wie zou ik dienen? Zou het niet zijn voor het aangezicht van zijn zoon? Zoals ik voor het aangezicht van uw vader gediend heb, zo zal ik voor uw aangezicht zijn.", "20": "Toen zei Absalom tegen Achitofel: Geef onder u raad, wat zullen wij doen?", "21": "En Achitofel zei tegen Absalom: Ga naar de bijvrouwen van uw vader, die hij heeft achtergelaten om het huis te bewaren; zo zal heel Israël horen dat u zich bij uw vader gehaat gemaakt hebt, en de handen van allen die bij u zijn, zullen gesterkt worden.", "22": "Zo spanden zij voor Absalom een tent op op het dak; en Absalom ging naar de bijvrouwen van zijn vader, voor de ogen van heel Israël.", "23": "In die dagen was de raad die Achitofel gaf, als had men naar het woord van God gevraagd; zo was alle raad van Achitofel, zowel bij David als bij Absalom."}, "SV": {"1": "Als nu David een weinig van de hoogte was voortgegaan, ziet, toen ontmoette hem Ziba, Mefiboseths jongen, met een paar gezadelde ezelen, en daarop tweehonderd broden, met honderd stukken rozijnen, en honderd *stukken* zomervruchten, en een lederen zak wijns.", "2": "En de koning zeide tot Ziba: Wat zult gij daarmede? En Ziba zeide: De ezels zijn voor het huis des konings, om op te rijden en het brood en de zomervruchten, om te eten voor de jongens; en de wijn, opdat de moeden in de woestijn drinken.", "3": "Toen zeide de koning: Waar is dan de zoon uws heren? En Ziba zeide tot den koning: Zie, hij blijft te Jeruzalem, want hij zeide: Heden zal mij het huis Israëls mijns vaders koninkrijk wedergeven.", "4": "Zo zeide de koning tot Ziba: Zie, het zal het uwe zijn alles wat Mefiboseth heeft. En Ziba zeide: Ik buig mij neder, laat mij genade vinden in uw ogen, mijn heer koning!", "5": "Als nu de koning David tot aan Bahurim kwam, ziet, toen kwam van daar een man uit, van het geslacht van het huis van Saul, wiens naam was Simeï, de zoon van Gera; hij ging steeds voort, en vloekte.", "6": "En hij wierp David met stenen, mitsgaders alle knechten van den koning David, hoewel al het volk en al de helden aan zijn rechter-en aan zijn linkerhand waren.", "7": "Aldus nu zeide Simeï in zijn vloeken: Ga uit, ga uit, gij, man des bloeds, en gij, Belials man!", "8": "De HEERE heeft op u doen wederkomen al het bloed van Sauls huis, in wiens plaats gij geregeerd hebt; nu heeft de HEERE het koninkrijk gegeven in de hand van Absalom, uw zoon; zie nu, gij zijt in uw ongeluk, omdat gij een man des bloeds zijt.", "9": "Toen zeide Abisai, de zoon van Zeruja, tot den koning: Waarom zou deze dode hond mijn heer den koning vloeken? Laat mij toch overgaan en zijn kop wegnemen.", "10": "Maar de koning zeide: Wat heb ik met u te doen, gij zonen van Zeruja? Ja, laat hem vloeken; want de HEERE toch heeft tot hem gezegd: Vloek David; wie zou dan zeggen: Waarom hebt gij alzo gedaan?", "11": "Voorts zeide David tot Abisai en tot al zijn knechten: Ziet, mijn zoon, die van mijn lijf is voortgekomen, zoekt mijn ziel; hoeveel te meer dan nu deze zoon van Jemini? Laat hem geworden, dat hij vloeke, want de HEERE heeft het hem gezegd.", "12": "Misschien zal de HEERE mijn ellende aanzien; en de HEERE zal mij goed vergelden voor zijn vloek, te dezen dage.", "13": "Alzo ging David met zijn lieden op den weg; en Simeï ging al voort langs de zijde des bergs tegen hem over, en vloekte, en wierp met stenen van tegenover hem, en stoof met stof.", "14": "En de koning kwam in, en al het volk, dat met hem was, moede zijnde; en hij verkwikte zich aldaar.", "15": "Absalom nu en al het volk, de mannen van Israël, kwamen te Jeruzalem, en Achitofel met hem.", "16": "En het geschiedde, als Husai, de Archiet, Davids vriend, tot Absalom kwam, dat Husai tot Absalom zeide: De koning leve, de koning leve!", "17": "Maar Absalom zeide tot Husai: Is dit uw weldadigheid aan uw vriend? Waarom zijt gij niet met uw vriend getogen?", "18": "En Husai zeide tot Absalom: Neen, maar welken de HEERE verkiest, en al dit volk, en alle mannen van Israël, diens zal ik zijn, en bij hem zal ik blijven.", "19": "En ten andere, wien zou ik dienen? Zou het niet zijn voor het aangezicht zijns zoons? Gelijk als ik voor het aangezicht uws vaders gediend heb, alzo zal ik voor uw aangezicht zijn.", "20": "Toen zeide Absalom tot Achitofel: Geeft onder ulieden raad, wat zullen wij doen?", "21": "En Achitofel zeide tot Absalom: Ga in tot de bijwijven uws vaders, die hij gelaten heeft om het huis te bewaren; zo zal gans Israël horen, dat gij bij uw vader stinkende zijt geworden, en de handen van allen, die met u zijn, zullen gesterkt worden.", "22": "Zo spanden zij Absalom een tent op het dak; en Absalom ging in tot de bijwijven zijns vaders, voor de ogen van het ganse Israël.", "23": "En in die dagen was Achitofels raad, dien hij raadde, als of men naar Gods woord gevraagd had; alzo was alle raad van Achitofel, zo bij David als bij Absalom."}, "KJV": {"1": "And when David was a little past the top of the hill, behold, Ziba the servant of Mephibosheth met him, with a couple of asses saddled, and upon them two hundred loaves of bread, and an hundred bunches of raisins, and an hundred of summer fruits, and a bottle of wine.", "2": "And the king said unto Ziba, What meanest thou by these? And Ziba said, The asses be for the king's household to ride on; and the bread and summer fruit for the young men to eat; and the wine, that such as be faint in the wilderness may drink.", "3": "And the king said, And where is thy master's son? And Ziba said unto the king, Behold, he abideth at Jerusalem: for he said, To day shall the house of Israel restore me the kingdom of my father.", "4": "Then said the king to Ziba, Behold, thine are all that pertained unto Mephibosheth. And Ziba said, I humbly beseech thee that I may find grace in thy sight, my lord, O king.", "5": "And when king David came to Bahurim, behold, thence came out a man of the family of the house of Saul, whose name was Shimei, the son of Gera: he came forth, and cursed still as he came.", "6": "And he cast stones at David, and at all the servants of king David: and all the people and all the mighty men were on his right hand and on his left.", "7": "And thus said Shimei when he cursed, Come out, come out, thou bloody man, and thou man of Belial:", "8": "The LORD hath returned upon thee all the blood of the house of Saul, in whose stead thou hast reigned; and the LORD hath delivered the kingdom into the hand of Absalom thy son: and, behold, thou art taken in thy mischief, because thou art a bloody man.", "9": "Then said Abishai the son of Zeruiah unto the king, Why should this dead dog curse my lord the king? let me go over, I pray thee, and take off his head.", "10": "And the king said, What have I to do with you, ye sons of Zeruiah? so let him curse, because the LORD hath said unto him, Curse David. Who shall then say, Wherefore hast thou done so?", "11": "And David said to Abishai, and to all his servants, Behold, my son, which came forth of my bowels, seeketh my life: how much more now may this Benjamite do it? let him alone, and let him curse; for the LORD hath bidden him.", "12": "It may be that the LORD will look on mine affliction, and that the LORD will requite me good for his cursing this day.", "13": "And as David and his men went by the way, Shimei went along on the hill's side over against him, and cursed as he went, and threw stones at him, and cast dust.", "14": "And the king, and all the people that were with him, came weary, and refreshed themselves there.", "15": "And Absalom, and all the people the men of Israel, came to Jerusalem, and Ahithophel with him.", "16": "And it came to pass, when Hushai the Archite, David's friend, was come unto Absalom, that Hushai said unto Absalom, God save the king, God save the king.", "17": "And Absalom said to Hushai, Is this thy kindness to thy friend? why wentest thou not with thy friend?", "18": "And Hushai said unto Absalom, Nay; but whom the LORD, and this people, and all the men of Israel, choose, his will I be, and with him will I abide.", "19": "And again, whom should I serve? should I not serve in the presence of his son? as I have served in thy father's presence, so will I be in thy presence.", "20": "Then said Absalom to Ahithophel, Give counsel among you what we shall do.", "21": "And Ahithophel said unto Absalom, Go in unto thy father's concubines, which he hath left to keep the house; and all Israel shall hear that thou art abhorred of thy father: then shall the hands of all that are with thee be strong.", "22": "So they spread Absalom a tent upon the top of the house; and Absalom went in unto his father's concubines in the sight of all Israel.", "23": "And the counsel of Ahithophel, which he counselled in those days, was as if a man had enquired at the oracle of God: so was all the counsel of Ahithophel both with David and with Absalom."}}, "tsk": {"1": [{"kopje": "een klein stuk voorbij", "refs": ["2 Sam 15:30", "2 Sam 15:32"]}, {"kopje": "Ziba", "refs": ["2 Sam 9:2", "2 Sam 9:9-12"]}, {"kopje": "met een paar", "r  "refs": [{"disp": "2 Sam 16:22", "href": "../../2-samuel/16/#v22", "ref": "2 Sam 16:22", "svLabel": null}, {"disp": "Neh 8:16", "href": "../../nehemia/8/#v17", "ref": "Neh 8:17", "svLabel": "SV 17"}, {"disp": "Spr 2:19", "href": "../../spreuken/2/#v19", "ref": "Spr 2:19", "svLabel": null}], "kinderen": []}]}]}, {"topic": "Tents", "href": "../../torrey/t/#t-tents", "kinderen": [{"label": "Were Pitched", "href": "../../torrey/t/?hl=2Sam.16.22#i20977", "refs": [], "kinderen": [{"label": "On the tops of houses", "href": "../../torrey/t/?hl=2Sam.16.22#i20981", "refs": [{"disp": "2 Sam 16:22", "href": "../../2-samuel/16/#v22", "ref": "2 Sam 16:22", "svLabel": null}], "kinderen": []}]}]}]}, "23": {"nave": [{"topic": "Counsellor", "href": "../../nave/c/#t-counsellor", "kinderen": [{"label": "Ahithophel was", "href": "../../nave/c/?hl=2Sam.16.23#i4504", "refs": [], "kinderen": [{"label": "To David", "href": "../../nave/c/?hl=2Sam.16.23#i4505", "refs": [{"disp": "1 Kron 27:33", "href": "../../1-kronieken/27/#v33", "ref": "1 Kron 27:33", "svLabel": null}, {"disp": "2 Sam 16:23", "href": "../../2-samuel/16/#v23", "ref": "2 Sam 16:23", "svLabel": null}], "kinderen": []}, {"label": "To Absalom", "href": "../../nave/c/?hl=2Sam.16.23#i4506", "refs": [{"disp": "2 Sam 16:23", "href": "../../2-samuel/16/#v23", "ref": "2 Sam 16:23", "svLabel": null}], "kinderen": []}]}]}]}}, "extern": {"Micha 7:9": "Ik zal de gramschap van de HEERE dragen, want ik heb tegen Hem gezondigd; totdat Hij mijn twist twist, en mijn recht uitvoert; Hij zal mij naar buiten brengen aan het licht; ik zal met vreugde zien naar Zijn gerechtigheid.", "2 Sam 2:18": "Nu waren daar drie zonen van Zeruja, Joab, en Abisai en Asahel; en Asahel was licht op zijn voeten, als een van de reeën die in het veld zijn.", "Richt 10:15": "Maar de Israëlieten zeiden tegen de HEERE: Wij hebben gezondigd; doe met ons naar alles wat goed is in Uw ogen; verlos ons toch alleen op deze dag!", "1 Kon 2:8": "En zie, bij u is Simeï, de zoon van Gera, de zoon van Jemini, uit Bahurim, die mij vervloekte met een zware vloek, op de dag dat ik naar Mahanaïm ging; maar hij kwam mij tegemoet bij de Jordaan, en ik zwoer hem bij de HEERE en zei: Ik zal u niet met het zwaard doden!", "Jak 3:13-18": "Wie is wijs en verstandig onder u? Laat hij door zijn goede levenswandel zijn werken tonen, in zachtmoedige wijsheid. Maar als u bittere afgunst en eigenbelang in uw hart hebt, beroem u dan niet en lieg niet tegen de waarheid. Dat is de wijsheid niet die van boven komt, maar is aards, ongeestelijk, duivels.", "Ps 59:16": "Laat hen zelfs omzwerven om eten; en laat hen vernachten, ook al zijn zij niet verzadigd.", "Jer 8:9": "De wijzen zijn beschaamd, verschrikt en gevangen; zie, zij hebben het woord van de HEERE verworpen; wat wijsheid zouden zij dan hebben?", "Richt 16:28": "Toen riep Simson tot de HEERE, en zei: Heere, HEERE! gedenk mij toch, en sterk mij toch alleen ditmaal, o God! dat ik mij met één wraak voor mijn twee ogen op de Filistijnen kan wreken.", "2 Sam 14:10": "En de koning zei: Spreekt iemand tegen u, breng hem dan bij mij; en hij zal u voortaan niet meer aanraken.", "Hand 4:23-28": "En toen zij losgelaten waren, gingen zij naar de hunnen, en verkondigden alles wat de overpriesters en de oudsten tegen hen gezegd hadden. En toen dezen dat hoorden, hieven zij eensgezind hun stem op tot God, en zeiden: Heere! U bent de God, Die de hemel gemaakt heeft, en de aarde, en de zee, en alle dingen die daarin zijn. Die door de mond van David, Uw knecht, gezegd hebt: Waarom woeden de heidenen, en hebben de volken zinloze dingen bedacht?", "Spr 2:19": "Allen die tot haar ingaan, zullen niet terugkomen, en zullen de paden van het leven niet bereiken;", "Spr 18:24": "Een man die vrienden heeft, moet zich vriendelijk gedragen; want er is een vriend die meer aankleeft dan een broeder.", "Spr 21:28": "Een leugenachtige getuige zal vergaan; en een man die hoort, zal spreken tot overwinning.", "Ex 4:11": "En de HEERE zei tegen hem: Wie heeft de mens de mond gemaakt, of wie maakt de stomme, of dove, of ziende, of blinde? Ben Ik het niet, de HEERE?", "1 Kon 2:36-44": "Daarna stuurde de koning, en riep Simeï, en zei tegen hem: Bouw u een huis in Jeruzalem, en woon daar, en ga vandaar niet naar hier of daar. Want het zal gebeuren op de dag dat u weggaat, wanneer u over de beek Kidron trekt, weet u zeker, dat u zult sterven; uw bloed zal op uw eigen hoofd zijn. En Simeï zei tegen de koning: Dat woord is goed; zoals mijn heer de koning gesproken heeft, zo zal uw dienaar doen. En Simeï woonde in Jeruzalem vele dagen.", "Mark 14:36": "En Hij zei: Abba, Vader! Alle dingen zijn U mogelijk; neem deze drinkbeker van Mij weg; maar niet wat Ik wil, maar wat U wilt.", "Jer 40:12": "keerden alle Joden terug uit alle plaatsen waarheen zij verdreven waren, en kwamen in het land van Juda tot Gedalia te Mizpa; en zij verzamelden zeer veel wijn en zomervruchten.", "Jer 17:18": "Laat mijn vervolgers beschaamd worden, maar laat mij niet beschaamd worden; laat hen verschrikt worden, maar laat mij niet verschrikt worden; breng over hen de dag van het kwaad, en verbreek hen met een dubbele verbreking.", "Ps 109:29": "Laat mijn tegenstanders met schande bekleed worden, en laat hen zich met hun schande bedekken, als met een mantel.", "Ps 69:29": "Laat hen uitgedelgd worden uit het boek van het leven, en met de rechtvaardigen niet aangeschreven worden.", "1 Sam 30:6": "En David werd erg bang, want het volk sprak ervan hem te stenigen; want de zielen van heel het volk waren verbitterd, ieder over zijn zonen en over zijn dochters; maar David sterkte zich in de HEERE, zijn God.", "Gen 29:32": "En Lea werd zwanger, en baarde een zoon, en zij noemde zijn naam Ruben; want zij zei: Zeker, de HEERE heeft mijn verdrukking aangezien; daarom zal mijn man mij nu liefhebben.", "Deut 11:29": "En het zal gebeuren, als de HEERE, uw God, u zal hebben binnengebracht in het land, waar u naartoe gaat, om dat te erven; dan zult u de zegen uitspreken op de berg Gerizim, en de vloek op de berg Ebal.", "1 Kon 21:13": "Toen kwamen de twee mannen, zonen van Belial, en gingen tegenover hem zitten; en de mannen van Belial getuigden tegen hem, tegen Naboth, voor het volk, en zeiden: Naboth heeft God en de koning gevloekt. En zij voerden hem de stad uit, en stenigden hem met stenen, zodat hij stierf.", "Gen 15:4": "En zie, het woord van de HEERE kwam tot hem, en Hij zei: Deze zal uw erfgenaam niet zijn; maar hij die uit uw lijf voortkomen zal, die zal uw erfgenaam zijn.", "Rom 9:20": "Maar toch, o mens, wie bent u, die tegen God antwoordt? Zal ook het maaksel tegen hem die het gemaakt heeft zeggen: Waarom hebt u mij zo gemaakt?", "2 Kron 32:21": "En de HEERE zond een engel, die alle strijdbare helden, en vorsten, en aanvoerders in het leger van de koning van Assyrië vernietigde. Zo keerde hij met schaamte van het aangezicht terug naar zijn land; en toen hij in het huis van zijn god was gegaan, velden zij hem daar met het zwaard, zij die uit zijn eigen lijf voortgekomen waren.", "Mark 15:29": "En zij die voorbijkwamen, lasterden Hem, en schudden hun hoofden, en zeiden: Ha! U die de tempel afbreekt, en in drie dagen opbouwt,", "Ezech 24:7": "Want haar bloed is in haar midden; op een gladde rots heeft zij het gelegd; zij heeft het niet op de aarde uitgestort, om het met stof te bedekken.", "Pred 10:20": "Vloek de koning niet, zelfs niet in uw gedachten, en vloek de rijke niet in het binnenste van uw slaapkamer; want het gevogelte des hemels zou de stem wegvoeren, en het gevleugelde zou het woord bekendmaken.", "2 Sam 2:7": "En nu, laat uw handen sterk zijn, en wees dapper, omdat uw heer Saul gestorven is; en ook hebben die van het huis van Juda mij tot koning over zich gezalfd.", "Jes 8:10": "Beraadslaag een plan, toch zal het vernietigd worden; spreek een woord, toch zal het niet standhouden; want God is met ons!", "Ex 3:8": "Daarom ben Ik neergekomen, om het te verlossen uit de hand van de Egyptenaren, en het op te voeren uit dit land, naar een goed en ruim land, naar een land dat overvloeit van melk en honing, naar de plaats van de Kanaänieten, en de Hethieten, en de Amorieten, en de Ferezieten, en de Hevieten, en de Jebusieten.", "Job 9:12": "Zie, Hij zal roven, wie zal het Hem doen teruggeven? Wie zal tegen Hem zeggen: Wat doet U?", "1 Sam 17:17": "En Isaï zei tegen zijn zoon David: Neem toch voor uw broers een efa van dit geroosterde koren, en deze tien broden, en breng ze snel naar het leger, naar uw broers.", "Spr 31:7": "dat hij drinkt en zijn armoede vergeet, en aan zijn moeite niet meer denkt.", "2 Sam 19:32": "Barzillai nu was zeer oud, een man van tachtig jaar; en hij had de koning van voedsel voorzien toen hij in Mahanaïm verbleef; want hij was een zeer belangrijk man.", "2 Sam 16:5-8": "Toen koning David tot bij Bahurim kwam, zie, daar kwam een man vandaan uit het geslacht van het huis van Saul, van wie de naam Simeï was, de zoon van Gera; hij liep almaar door en vloekte. En hij gooide David met stenen, en ook alle knechten van koning David, hoewel al het volk en alle helden aan zijn rechter- en aan zijn linkerhand waren. Zo zei Simeï, terwijl hij vloekte: Ga weg, ga weg, man van bloed, en man van Belial!", "Deut 11:30": "Zijn zij niet aan de overkant van de Jordaan, achter de weg van de ondergang van de zon, in het land van de Kanaänieten, die in het vlakke veld wonen, tegenover Gilgal, bij de eikenbossen van More?", "2 Sam 4:8-12": "En zij brachten het hoofd van Isboseth naar David te Hebron, en zeiden tegen de koning: Zie, hier is het hoofd van Isboseth, de zoon van Saul, uw vijand, die u naar het leven stond; zo heeft de HEERE mijn heer de koning op deze dag wraak gegeven over Saul en over zijn nageslacht. Maar David antwoordde Rechab en zijn broer Baëna, de zonen van Rimmon, de Beerothiet, en zei tegen hen: Zo waarachtig als de HEERE leeft, Die mijn ziel uit alle benauwdheid verlost heeft! Toen hij die mij het bericht bracht en zei: Zie, Saul is dood – terwijl hij zelf dacht dat hij goed nieuws bracht – heb ik hem gegrepen en te Ziklag gedood, hoewel hij meende dat ik hem daarvoor loon zou geven;", "2 Sam 17:14": "Toen zeiden Absalom en alle mannen van Israël: De raad van Husai, de Archiet, is beter dan de raad van Achitofel. Doch de HEERE had het zo bepaald, om de goede raad van Achitofel te vernietigen, opdat de HEERE het kwaad over Absalom zou brengen.", "Hand 28:4": "En toen de inwoners het beest aan zijn hand zagen hangen, zeiden zij tegen elkaar: Deze man is zeker een moordenaar, die, hoewel hij uit de zee ontkomen is, door de wraak niet in leven gelaten wordt.", "Ps 90:15": "Verblijd ons naar de dagen, waarin U ons gedrukt hebt, naar de jaren, waarin wij het kwaad gezien hebben.", "2 Kon 11:12": "Daarna bracht hij de zoon van de koning naar voren en zette hem de kroon op, en gaf hem de getuigenis; en zij maakten hem koning en zalfden hem; daarbij klapten zij in de handen en zeiden: Leve de koning!", "Pred 8:4": "Waar het woord van de koning is, daar is macht; en wie zal tegen hem zeggen: Wat doet u?", "1 Kor 11:32": "Maar als wij geoordeeld worden, worden wij door de Heere getuchtigd, opdat wij niet met de wereld veroordeeld zouden worden.", "Ps 55:10": "Verslind hen, Heere! verdeel hun tong; want ik zie geweld en twist in de stad.", "2 Sam 19:23": "En de koning zei tegen Simeï: U zult niet sterven. En de koning zwoer het hem.", "Ex 23:8": "Ook zult u geen geschenk aannemen; want het geschenk verblindt de zienden, en het verdraait de zaak van de rechtvaardigen.", "1 Sam 25:18": "Toen haastte Abigaïl zich, en nam tweehonderd broden, en twee lederzakken wijn, en vijf toebereide schapen, en vijf maten geroosterd koren, en honderd stukken rozijnen, en tweehonderd klompen vijgen, en legde die op ezels.", "2 Sam 19:26-29": "En hij zei: Mijn heer koning, mijn knecht heeft mij bedrogen; want uw knecht zei: Ik zal voor mij een ezel zadelen, en daarop rijden, en naar de koning trekken, want uw knecht is kreupel. Bovendien heeft hij uw knecht bij mijn heer de koning valselijk beschuldigd; maar mijn heer de koning is als een engel van God; doe dan wat goed is in uw ogen. Want heel mijn vaders huis was voor mijn heer de koning niets anders dan mensen die de dood verdienen; toch hebt u uw knecht een plaats gegeven onder hen die aan uw tafel eten; wat recht heb ik dan nog om verder te klagen bij de koning?", "1 Sam 3:18": "Toen maakte Samuël hem al die woorden bekend, en verborg ze niet voor hem. En hij zei: Hij is de HEERE; laat Hij doen wat goed is in Zijn ogen!", "2 Kor 6:4-10": "Maar wij maken onszelf in alles aangenaam als dienaars van God, in veel verdraagzaamheid, in verdrukkingen, in noden, in benauwdheden, in slagen, in gevangenissen, in opschudding, in arbeid, in waken, in vasten, in reinheid, in kennis, in geduld, in vriendelijkheid, in de Heilige Geest, in ongeveinsde liefde,", "Ps 48:5-8": "Want zie, de koningen waren verzameld; zij waren samen doorgetrokken. Zoals zij het zagen, zo waren zij verwonderd; zij werden verschrikt, zij haastten weg. Beving greep hen daar aan, smart als van een barende vrouw.", "2 Sam 19:30": "En Mefiboseth zei tegen de koning: Laat hem het ook helemaal maar nemen, nu mijn heer de koning met vrede in zijn huis is teruggekomen.", "1 Sam 2:7": "De HEERE maakt arm en maakt rijk; Hij vernedert, ook verhoogt Hij.", "Gen 50:20": "U wel, u hebt kwaad tegen mij gedacht; doch God heeft dat ten goede gedacht; opdat Hij deed, zoals het op deze dag is, om een groot volk in het leven te behouden.", "Jes 22:1": "De last van het dal van het gezicht. Wat is er nu met u, dat u helemaal naar de daken bent geklommen?", "2 Sam 3:30": "Zo hebben Joab en zijn broer Abisaï Abner doodgeslagen, omdat hij hun broer Asaël te Gibeon in de strijd had gedood.", "Jer 18:21-23": "Daarom, geef hun zonen over aan de honger, en doe hen wegvloeien door het geweld van het zwaard, en laat hun vrouwen van kinderen beroofd en weduwe worden, en laat hun mannen door de dood omgebracht worden, en hun jongemannen met het zwaard geslagen worden in de strijd. Laat er een geschrei uit hun huizen gehoord worden, wanneer U snel een bende over hen brengt; omdat zij een kuil gegraven hebben om mij te vangen, en strikken verborgen hebben voor mijn voeten. Doch U, HEERE, weet al hun plannen tegen mij, om mij te doden; maak geen verzoening over hun ongerechtigheid, en delg hun zonde niet uit van voor Uw aangezicht; maar laat hen neergeveld worden voor Uw aangezicht; handel zo met hen, in de tijd van Uw toorn.", "Ps 19:8": "De wet van de HEERE is volmaakt, en zet de ziel om; de getuigenis van de HEERE is betrouwbaar, en geeft de eenvoudigen wijsheid.", "Hand 28:5": "Maar hij schudde het beest af in het vuur, en had er geen kwaad van te lijden.", "2 Sam 12:23": "Maar nu is het dood, waarom zou ik nu vasten? Zal ik het nog kunnen terughalen? Ik zal wel naar hem toe gaan, maar hij zal niet naar mij terugkomen.", "Ps 10:2": "De goddeloze vervolgt in hoogmoed heftig de ellendige; laat hen gegrepen worden in de plannen die zij bedacht hebben.", "Job 19:21": "Ontferm u over mij, ontferm u over mij, o mijn vrienden! want de hand van God heeft mij aangeraakt.", "Dan 9:14": "Daarom heeft de HEERE over het kwade gewaakt, en Hij heeft het over ons gebracht; want de HEERE, onze God, is rechtvaardig in al Zijn werken die Hij gedaan heeft, omdat wij Zijn stem niet gehoorzaamden.", "Rom 1:22": "terwijl zij zich voor wijzen uitgaven, zijn zij dwaas geworden;", "Dan 5:10": "Vanwege deze woorden van de koning en zijn leiders, ging de koningin het huis van de maaltijd binnen. De koningin sprak en zei: O koning, leef in eeuwigheid! Laat uw gedachten u niet verschrikken, en laat uw gezichtskleur niet veranderen.", "1 Kon 2:32": "Zo zal de HEERE zijn bloed op zijn eigen hoofd doen terugkeren, omdat hij twee mannen heeft aangevallen die rechtvaardiger en beter waren dan hij, en hen met het zwaard gedood heeft, terwijl mijn vader David het niet wist: Abner, de zoon van Ner, de legeraanvoerder van Israël, en Amasa, de zoon van Jether, de legeraanvoerder van Juda.", "Ps 37:12": "Zain. De goddeloze bedenkt listige plannen tegen de rechtvaardige, en knerst met zijn tanden over hem.", "2 Sam 19:26": "En hij zei: Mijn heer koning, mijn knecht heeft mij bedrogen; want uw knecht zei: Ik zal voor mij een ezel zadelen, en daarop rijden, en naar de koning trekken, want uw knecht is kreupel.", "Ruth 1:20": "Maar zij zei tegen hen: Noem mij niet Naomi, noem mij Mara; want de Almachtige heeft mij grote bitterheid aangedaan.", "Luk 23:41": "En wij toch terecht; want wij ontvangen straf die past bij wat wij gedaan hebben; maar Deze heeft niets onbehoorlijks gedaan.", "2 Sam 14:4": "En de vrouw uit Thekoa sprak tot de koning, terwijl zij op haar gezicht ter aarde was gevallen, en zich neergebogen had, en zij zei: Help, o koning!", "1 Sam 17:18": "Maar breng deze tien melkkazen naar de aanvoerder over duizend; en u zult naar uw broers omzien, of het hun goed gaat, en u zult van hen een teken meenemen.", "Jak 5:11": "Zie, wij noemen hen gelukkig die volharden; u hebt van de volharding van Job gehoord, en u hebt gezien hoe de Heere het einde bracht, dat de Heere zeer barmhartig is en vol ontferming.", "Jes 8:21": "En ieder van hen zal daar doorgaan, hard gedrukt en hongerig; en het zal gebeuren, wanneer hem hongert en hij zeer toornig zal zijn, dan zal hij vloeken op zijn koning en op zijn God, als hij opwaarts zal zien;", "1 Kon 1:34": "En laat Zadok, de priester, met Nathan, de profeet, hem daar tot koning over Israël zalven. Daarna moet u op de bazuin blazen, en zeggen: Leve de koning Salomo!", "Luk 23:40": "Maar de ander antwoordde en bestrafte hem: Vreest u ook God niet, terwijl u in hetzelfde oordeel bent?", "2 Sam 16:9-13": "Toen zei Abisai, de zoon van Zeruja, tegen de koning: Waarom zou deze dode hond mijn heer de koning vloeken? Laat mij toch oversteken en zijn kop wegnemen. Maar de koning zei: Wat heb ik met u te doen, zonen van Zeruja? Ja, laat hem vloeken; want de HEERE heeft immers tegen hem gezegd: Vloek David; wie zou dan zeggen: Waarom hebt u dat gedaan? Verder zei David tegen Abisai en tegen al zijn knechten: Zie, mijn zoon, die uit mijn lijf is voortgekomen, zoekt mijn leven; hoeveel te meer dan nu deze zoon van Jemini? Laat hem begaan, laat hij vloeken, want de HEERE heeft het hem gezegd.", "Job 23:16": "Want God heeft mijn hart week gemaakt, en de Almachtige heeft mij ontsteld;", "2 Sam 3:8": "Toen ontstak Abner in grote woede over de woorden van Isboseth, en zei: Ben ik dan een hondenkop, ik, die tegen Juda, aan het huis van Saul, uw vader, aan zijn broers en aan zijn vrienden, tot op vandaag trouw bewijs, en u niet in Davids hand overgeleverd heb, dat u mij vandaag beschuldigt vanwege de schuld met deze vrouw?", "Jer 11:20": "Maar, o HEERE van de heerscharen¹, U rechtvaardige Rechter, Die de nieren en het hart beproeft! laat mij Uw wraak over hen zien; want aan U heb ik mijn rechtszaak bekendgemaakt.", "1 Sam 26:11": "De HEERE late het verre van mij zijn, dat ik mijn hand zou leggen aan de gezalfde van de HEERE! Neem toch nu de speer die bij zijn hoofdeinde ligt, en de waterfles, en laten we gaan.", "Jer 3:3": "Daarom zijn de regendruppels ingehouden, en is er geen late regen geweest. Maar u hebt een hoerenvoorhoofd, u weigert schaamrood te worden.", "Ps 56:8": "Zouden zij om hun ongerechtigheid vrijuit gaan? Stort de volken neder in toorn, o God!", "Ps 88:7": "U hebt mij in de onderste kuil gelegd, in duisternissen, in diepten.", "1 Sam 25:14": "Doch een van de jongemannen boodschapte het aan Abigaïl, de vrouw van Nabal, en zei: Zie, David heeft boden gezonden uit de woestijn om onze heer te zegenen; maar hij is tegen hen uitgevaren.", "Joz 8:34": "En daarna las hij hardop al de woorden van de wet, de zegen en de vloek, overeenkomstig alles wat in het wetboek geschreven staat.", "1 Kon 2:33": "Zo zal hun bloed terugkeren op het hoofd van Joab, en op het hoofd van zijn nakomelingen voor eeuwig; maar David, en zijn nakomelingen, en zijn huis, en zijn troon zal vrede hebben van de HEERE tot in eeuwigheid.", "2 Sam 7:2": "Dat de koning zei tegen de profeet Nathan: Zie toch, ik woon in een huis van cederhout, en de ark van God woont in het midden van de tentkleden.", "Ps 35:4": "Laat hen beschaamd worden en te schande, die mijn ziel zoeken; laat hen achterwaarts gedreven worden en schaamrood, die kwaad tegen mij bedenken.", "Hand 7:59": "En zij stenigden Stefanus, terwijl hij aanriep en zei: Heere Jezus, ontvang mijn geest.", "Rom 5:3-5": "En niet alleen dit, maar wij roemen ook in de verdrukkingen, wetende dat de verdrukking lijdzaamheid werkt; En de lijdzaamheid werkt bevinding, en de bevinding werkt hoop; En de hoop beschaamt niet, omdat de liefde van God in onze harten uitgestort is door de Heilige Geest, Die ons gegeven is.", "2 Sam 15:34": "maar als u teruggaat naar de stad, en tegen Absalom zegt: Uw knecht, ik zal van de koning zijn; ik ben eerder wel de knecht van uw vader geweest, maar nu zal ik uw knecht zijn; dan zou u voor mij de raad van Achitofel teniet doen.", "Ps 70:3": "Laat hen beschaamd en schaamrood worden, die mijn ziel zoeken; laat hen achterwaarts gedreven en te schande worden, die lust hebben aan mijn kwaad.", "2 Kon 15:5": "En de HEERE plaagde de koning, zodat hij melaats werd tot de dag van zijn dood; en hij woonde in een afgezonderd huis, terwijl Jotham, de zoon van de koning, over het huis ging en het volk van het land rechtsprak.", "2 Kor 6:3-11": "Wij geven nergens aanstoot in, opdat de bediening niet gelasterd wordt. Maar wij maken onszelf in alles aangenaam als dienaars van God, in veel verdraagzaamheid, in verdrukkingen, in noden, in benauwdheden, in slagen, in gevangenissen, in opschudding, in arbeid, in waken, in vasten,", "Spr 18:17": "Wie het eerst zijn zaak bepleit, lijkt rechtvaardig; maar zijn naaste komt, en die onderzoekt hem.", "Spr 18:16": "Het geschenk van een mens maakt hem ruimte, en het brengt hem voor het aangezicht van de groten.", "Ps 4:3": "U, mannen, hoe lang zal mijn eer tot schande zijn? Hoe lang zult u de ijdelheid liefhebben, de leugen zoeken? Sela.", "2 Sam 19:22": "Maar David zei: Wat heb ik met u te maken, zonen van Zeruja, dat u mij vandaag tot tegenstander zou willen zijn? Zou er vandaag iemand gedood moeten worden in Israël? Want weet ik niet dat ik vandaag koning geworden ben over Israël?", "1 Sam 4:6": "Toen de Filistijnen het geluid van dat gejuich hoorden, zeiden zij: Wat betekent dit grote gejuich in het leger van de Hebreeën? Toen begrepen zij dat de ark van de HEERE in het leger gekomen was.", "Matt 16:23": "Maar Hij keerde Zich om en zei tegen Petrus: Ga weg, achter Mij, satan! U bent Mij een struikelblok, want u bedenkt niet de dingen die van God zijn, maar die van de mensen zijn.", "Jes 30:20": "De Heere zal u wel brood van de benauwdheid, en water van de verdrukking geven; maar uw leraars zullen niet meer als met vleugels wegvliegen, maar uw ogen zullen uw leraars zien;", "2 Sam 17:1-23": "Verder zei Achitofel tegen Absalom: Laat mij nu twaalfduizend man uitkiezen, dan sta ik op en jaag David deze nacht achterna. Zo zal ik hem overvallen terwijl hij moe en slap van handen is, en zal hem schrik aanjagen; en al het volk dat bij hem is zal vluchten; dan zal ik de koning alleen doden. En ik zal al het volk naar u laten terugkeren; de man die u zoekt, is gelijk aan het terugkeren van allen; zo zal al het volk in vrede zijn.", "Ps 25:3": "Gimel. Ja, allen die U verwachten, zullen niet beschaamd worden; zij zullen beschaamd worden, die trouweloos handelen zonder oorzaak.", "2 Sam 14:11": "En zij zei: De koning gedenkt toch aan de HEERE, uw God, dat de bloedwrekers niet te talrijk worden om te verderven, zodat zij mijn zoon niet ombrengen. Toen zei hij: Zo waarachtig als de HEERE leeft, er zal geen haar van uw zoon op de aarde vallen!", "Jer 40:10": "En zie, ik woon te Mizpa, om voor de Chaldeeën te staan die tot ons zullen komen; verzamel u dan wijn, en zomervruchten, en olie, en doe ze in uw vaten, en woon in uw steden die u hebt ingenomen.", "2 Sam 15:16": "En de koning ging weg te voet, met zijn hele huis; maar de koning liet tien bijvrouwen achter om het huis te bewaren.", "Ps 9:21": "O HEERE! jaag hun vrees aan; laat de heidenen weten, dat zij mensen zijn. Sela.", "Spr 26:2": "Zoals de mus wegzweeft, zoals een zwaluw wegvliegt, zo zal een vloek die zonder oorzaak is, niet komen.", "2 Sam 3:16": "En haar man ging met haar mee, huilend achter haar aan lopend, tot Bahurim toe. Toen zei Abner tegen hem: Ga weg, keer terug. En hij keerde terug.", "2 Tim 4:6": "Want ik word al als een drankoffer geofferd, en de tijd van mijn heengaan is nabij.", "Ps 15:3": "Die met zijn tong niet lastert, zijn metgezellen geen kwaad doet, en geen smaad uit over zijn naaste;", "2 Sam 6:9": "En David vreesde de HEERE die dag; en hij zei: Hoe zal de ark van de HEERE bij mij komen?", "1 Sam 27:12": "En Achis geloofde David, en zei: Hij heeft zich helemaal onmogelijk gemaakt bij zijn volk, in Israël; daarom zal hij eeuwig mijn knecht zijn.", "Luk 9:54-56": "Toen Zijn discipelen Jakobus en Johannes dit zagen, zeiden zij: Heere, wilt U dat wij zeggen dat er vuur uit de hemel neerdaalt om hen te verslinden, zoals ook Elia gedaan heeft? Maar Hij keerde Zich om, bestrafte hen en zei: U weet niet wat voor geest u hebt. Want de Zoon des mensen is niet gekomen om het leven van mensen te vernietigen, maar om het te behouden. En zij gingen naar een ander dorp.", "Gal 1:8": "Maar al zouden wij, of een engel uit de hemel, u een evangelie verkondigen naast wat wij u verkondigd hebben, laat hij vervloekt zijn.", "2 Sam 1:16": "En David zei tegen hem: Uw bloed komt op uw hoofd; want uw mond heeft tegen u getuigd, toen u zei: ik heb de gezalfde van de HEERE gedood.", "1 Sam 26:6-8": "Toen antwoordde David en sprak tegen Achimelech, de Hethiet, en tegen Abisai, de zoon van Zeruja, de broer van Joab, en zei: Wie zal met mij naar Saul in het leger afgaan? Toen zei Abisai: Ik zal met u afgaan. Zo kwamen David en Abisai 's nachts bij het volk; en zie, Saul lag te slapen in de wagenburg, en zijn speer stak in de aarde bij zijn hoofdeinde, en Abner en het volk lagen rondom hem. Toen zei Abisai tegen David: God heeft vandaag uw vijand in uw hand gegeven; laat mij hem toch nu met de speer in één keer aan de grond spijkeren, en ik zal het hem geen tweede keer hoeven te doen.", "Ps 54:7": "Hij zal dit kwaad aan mijn belagers vergelden; roei hen uit door Uw waarheid.", "2 Tim 4:15": "Wees ook u voor hem op uw hoede, want hij heeft onze woorden sterk tegengestaan.", "Ps 70:4": "Laat hen terugkeren tot loon van hun beschaming, die daar zeggen: Ha, ha!", "Est 4:16": "Ga, verzamel alle Joden die te Susan gevonden worden, en vast voor mij, en eet of drink niet, drie dagen lang, nacht noch dag; ik en mijn jonge dochters zullen ook zo vasten, en zo zal ik tot de koning ingaan, wat niet naar de wet is. Wanneer ik dan omkom, dan kom ik om.", "Pred 10:1": "Een dode vlieg doet de zalf van de apotheker stinken en opwellen; zo doet een weinig dwaasheid met een man die kostelijk is van wijsheid en van eer.", "Job 5:12": "Hij maakt teniet de gedachten van de arglistigen; zodat hun handen niets uitrichten.", "1 Kron 8:3": "Bela nu had deze kinderen: Addar, en Gera, en Abihud,", "Ex 1:10": "Kom, laten we verstandig tegen hen optreden, anders vermenigvuldigt het zich, en gebeurt het, als er een oorlog uitbreekt, dat het zich ook aansluit bij onze vijanden, en tegen ons strijdt, en uit het land wegtrekt.", "2 Kor 4:17": "Want onze lichte verdrukking, die zeer haast voorbijgaat, brengt ons een geheel bijzonder groot en eeuwig gewicht van heerlijkheid;", "Job 11:10": "Als Hij voorbijgaat, om af te snijden of te vergaderen, wie zal Hem dan tegenhouden?", "Ex 2:24": "En God hoorde hun gekerm, en God dacht aan Zijn verbond met Abraham, met Izak, en met Jakob.", "Job 12:14-25": "Zie, Hij breekt af, en het zal niet herbouwd worden; Hij besluit iemand op, en er zal niet opengedaan worden. Zie, Hij houdt de wateren tegen, en zij drogen uit; ook laat Hij ze los, en zij keren de aarde om. Bij Hem is kracht en wijsheid; van Hem is hij die dwaalt, en hij die doet dwalen.", "Ps 5:11": "Verklaar hen schuldig, o God; laat hen vervallen van hun raadslagen; drijf hen weg om de veelheid van hun overtredingen, want zij zijn opstandig tegen U.", "Job 10:8": "Uw handen doen mij pijn aan, hoewel zij mij gemaakt hebben, samen rondom mij zijn zij, en U verslindt mij.", "Ps 69:25": "Stort over hen Uw gramschap uit; en de gloed van Uw toorn grijpt hen aan.", "Ps 119:78": "Laat de hoogmoedigen beschaamd worden, omdat zij mij met leugen neergestoten hebben; doch ik betracht Uw geboden.", "Ps 2:2": "De koningen van de aarde stellen zich op, en de vorsten beraadslagen samen tegen de HEERE, en tegen Zijn Gezalfde, en zeggen:", "2 Sam 19:24-30": "Mefiboseth, Sauls zoon, kwam ook de koning tegemoet; en hij had zijn voeten niet verzorgd, noch zijn baard geknipt, noch zijn kleren gewassen, vanaf de dag dat de koning weggegaan was, tot de dag dat hij met vrede terugkwam. En het gebeurde, toen hij in Jeruzalem de koning tegemoet kwam, dat de koning tegen hem zei: Waarom bent u niet met mij meegegaan, Mefiboseth? En hij zei: Mijn heer koning, mijn knecht heeft mij bedrogen; want uw knecht zei: Ik zal voor mij een ezel zadelen, en daarop rijden, en naar de koning trekken, want uw knecht is kreupel.", "Ps 35:8": "De verwoesting overkomt hem, zodat hij het niet weet, en zijn net, dat hij verborgen heeft, vangt hemzelf; hij valt daarin met verwoesting.", "Jes 27:7": "Heeft Hij hem geslagen, zoals Hij hen geslagen heeft die hem sloegen? Is hij gedood, zoals zijn gedoden gedood zijn geworden?", "1 Kron 8:5": "En Gera, en Sefufan, en Huram.", "2 Sam 11:2": "Zo gebeurde het tegen de avondtijd, dat David van zijn bed opstond, en wandelde op het dak van het koningshuis, en zag van het dak een vrouw die zich waste; deze vrouw nu was zeer schoon van uiterlijk.", "2 Sam 24:14": "Toen zei David tegen Gad: Het is mij zeer bang te moede; laat ons toch in de hand van de HEERE vallen, want Zijn barmhartigheden zijn groot, maar laat mij niet in de hand van mensen vallen.", "Openb 3:19": "Ieder die Ik liefheb, die bestraf en tuchtig Ik; wees dan ijverig, en bekeer u.", "Jer 12:3": "Maar U, HEERE, kent mij, U ziet mij, en proeft mijn hart, dat het met U is. Ruk hen uit als schapen ter slachting, en heilig hen tot de dag van de doding.", "Ps 89:39-46": "Maar Gij hebt hem verstoten en verworpen; Gij bent verbolgen geworden tegen Uw gezalfde. Gij hebt het verbond van Uw knecht teniet gedaan; Gij hebt zijn kroon ontheiligd tegen de aarde. Gij hebt al zijn muren doorgebroken; Gij hebt zijn vestingen neergeworpen.", "1 Kon 2:17": "En hij zei: Spreek toch tot de koning Salomo, want hij zal uw aangezicht niet afwijzen, dat hij mij Abisag, de Sunamitische, tot vrouw geeft.", "Ps 78:31-34": "Toen Gods toorn tegen hen opging, zodat Hij van hun vetste doodde, en de uitgelezen mannen van Israël neervelde. Boven dit alles zondigden zij nog, en geloofden niet, ondanks Zijn wonderen. Daarom liet Hij hun dagen vergaan in ijdelheid, en hun jaren in verschrikking.", "Richt 10:3": "Na hem stond Jaïr op, de Gileadiet; hij richtte Israël tweeëntwintig jaar.", "Deut 32:39": "Zie nu, dat Ik, Ik DIE ben, en geen God met Mij; Ik dood en maak levend; Ik versla en Ik heel; en er is niemand die uit Mijn hand redt!", "2 Kron 7:12-22": "En de HEERE verscheen aan Salomo 's nachts, en Hij zei tegen hem: Ik heb uw gebed verhoord, en heb Mij deze plaats uitgekozen tot een offerhuis. Als Ik de hemel toesluit, zodat er geen regen is, of als Ik de sprinkhaan gebied het land te verteren, of als Ik pest onder Mijn volk zend; En Mijn volk, over wie Mijn Naam genoemd wordt, zich verootmoedigt en bidt, en zij Mijn aangezicht zoeken, en zich bekeren van hun slechte wegen; dan zal Ik uit de hemel horen, en hun zonden vergeven, en hun land genezen.", "Luk 22:42": "en zei: Vader, als U wilt, neem deze drinkbeker van Mij weg; maar niet Mijn wil, maar de Uwe geschiede.", "Ps 38:14": "Ik daarentegen ben als een dove, ik hoor niet, en als een stomme, die zijn mond niet opendoet.", "Ps 51:16": "Verlos mij van bloedschuld, o God, U, God van mijn heil! zo zal mijn tong Uw gerechtigheid vrolijk roemen.", "Gen 38:16": "En hij ging naar haar toe, opzij van de weg, en zei: Kom toch, laat mij bij u ingaan; want hij wist niet dat zij zijn schoondochter was. En zij zei: Wat zult u mij geven, dat u bij mij ingaat?", "Matt 26:39": "En toen Hij een weinig verder gegaan was, viel Hij op Zijn aangezicht, bad en zei: Mijn Vader, als het mogelijk is, laat deze drinkbeker aan Mij voorbijgaan! Maar toch niet zoals Ik wil, maar zoals U wilt.", "Amos 3:6": "Zal de bazuin in de stad geblazen worden, zonder dat het volk sidddert? Zal er een kwaad in de stad zijn, dat de HEERE niet doet?", "2 Sam 16:16-19": "En het gebeurde, toen Husai, de Archiet, Davids vriend, bij Absalom kwam, dat Husai tegen Absalom zei: Leve de koning, leve de koning! Maar Absalom zei tegen Husai: Is dit uw trouw aan uw vriend? Waarom bent u niet met uw vriend meegegaan? En Husai zei tegen Absalom: Nee, maar wie de HEERE verkiest, en dit hele volk, en alle mannen van Israël, van hem zal ik zijn, en bij hem zal ik blijven.", "Gen 49:3": "Ruben! U bent mijn eerstgeborene, mijn kracht, en het begin van mijn macht; de voortreffelijkste in hoogheid, en de voortreffelijkste in sterkte!", "1 Sam 28:2": "Toen zei David tegen Achis: Zo zult u weten wat uw dienaar doen zal. En Achis zei tegen David: Daarom zal ik u voor altijd tot bewaarder van mijn hoofd aanstellen.", "Ex 3:7": "En de HEERE zei: Ik heb heel goed gezien de verdrukking van Mijn volk dat in Egypte is, en heb hun geschrei gehoord vanwege hun drijvers; want Ik ken hun smarten.", "2 Sam 9:9-12": "Toen riep de koning Ziba, de jongen van Saul, en zei tegen hem: Alles wat van Saul geweest is, en zijn hele huis, heb ik aan de zoon van uw heer gegeven. Daarom zult u voor hem het land bewerken, u, en uw zonen, en uw knechten, en de opbrengst inbrengen, zodat de zoon van uw heer brood heeft om te eten; en Mefiboseth, de zoon van uw heer, zal voortdurend brood eten aan mijn tafel. Ziba nu had vijftien zonen en twintig knechten. En Ziba zei tegen de koning: Naar alles wat mijn heer de koning zijn knecht gebiedt, zo zal uw knecht doen. Ook zou Mefiboseth, etend aan mijn tafel, als een van de zonen van de koning zijn.", "Ps 68:2": "God zal opstaan, Zijn vijanden zullen verstrooid worden, en Zij die Hem haten zullen van Zijn aangezicht vluchten.", "Ps 143:12": "En roei mijn vijanden uit, om Uw goedertierenheid, en breng hen om, allen die mijn ziel beangstigen; want ik ben Uw knecht.", "2 Sam 19:29": "Toen zei de koning tegen hem: Waarom spreekt u nog meer over uw zaken? Ik heb gezegd: U en Ziba, verdeel het land.", "Job 5:17": "Zie, gelukzalig is de mens, aan wie God straft; daarom verwerp de kastijding van de Almachtige niet.", "Klaagl 1:5": "He. Haar tegenstanders zijn tot hoofd geworden, haar vijanden hebben rust; omdat de HEERE haar bedroefd heeft, vanwege de veelheid van haar overtredingen; haar kinderen gaan heen in de gevangenschap voor het aangezicht van de tegenstander.", "Job 2:10": "Maar hij zei tegen haar: U spreekt zoals een van de dwaze vrouwen spreekt; zouden wij dan het goede van God ontvangen, en het kwade niet ontvangen? In dit alles zondigde Job niet met zijn lippen.", "Ps 88:8": "Uw grimmigheid ligt op mij; U hebt mij neergedrukt met al Uw baren. Sela.", "2 Sam 17:5-15": "Doch Absalom zei: Roep toch ook Husai, de Archiet, en laten we horen wat ook hij zegt. En toen Husai bij Absalom binnenkwam, sprak Absalom tegen hem en zei: Zo heeft Achitofel gesproken; zullen wij doen wat hij zegt? Zo niet, spreek u dan. Toen zei Husai tegen Absalom: De raad die Achitofel deze keer gegeven heeft, is niet goed.", "2 Sam 19:17": "En duizend man van Benjamin met hem; ook Ziba, de knecht van Sauls huis, en zijn vijftien zonen en zijn twintig knechten met hem; en zij trokken vaardig de Jordaan over, voor de koning uit.", "1 Sam 13:4": "Toen hoorde heel Israël zeggen: Saul heeft de bezetting van de Filistijnen verslagen, en ook is Israël gehaat geworden bij de Filistijnen. Toen werd het volk samengeroepen achter Saul, naar Gilgal.", "Gen 42:26": "En zij laadden hun koren op hun ezels, en trokken vandaar weg.", "2 Sam 16:5-13": "Toen koning David tot bij Bahurim kwam, zie, daar kwam een man vandaan uit het geslacht van het huis van Saul, van wie de naam Simeï was, de zoon van Gera; hij liep almaar door en vloekte. En hij gooide David met stenen, en ook alle knechten van koning David, hoewel al het volk en alle helden aan zijn rechter- en aan zijn linkerhand waren. Zo zei Simeï, terwijl hij vloekte: Ga weg, ga weg, man van bloed, en man van Belial!", "Num 25:6": "En zie, een man uit de kinderen van Israël kwam, en bracht een Midianietische vrouw naar zijn broeders, voor de ogen van Mozes en voor de ogen van de hele vergadering van de kinderen van Israël, terwijl zij weenden voor de deur van de tent van de samenkomst.", "Richt 8:5": "En hij zei tegen de mannen van Sukkoth: Geef toch enige broden aan het volk dat mij volgt, want zij zijn moe; en ik jaag Zebah en Tsalmuna, de koningen van de Midianieten, achterna.", "Dan 2:4": "Toen spraken de Chaldeeën tot de koning in het Syrisch: O koning, leef in eeuwigheid! Vertel uw dienaren de droom, dan zullen wij de uitleg bekendmaken.", "Num 24:10": "Toen ontstak de toorn van Balak tegen Bileam, en hij sloeg zijn handen samen; en Balak zei tegen Bileam: Ik heb u geroepen om mijn vijanden te vervloeken; maar zie, u hebt hen nu al driemaal gezegend!", "2 Sam 17:25": "En Absalom had Amasa in de plaats van Joab aangesteld over het leger. Amasa nu was de zoon van een man wiens naam Jethra was, de Israëliet, die bij Abigaïl was ingegaan, de dochter van Nahas, zuster van Zeruja, de moeder van Joab.", "Job 27:2": "Zo waarachtig als God leeft, Die mijn recht weggenomen heeft, en de Almachtige, Die mijn ziel bitterheid heeft aangedaan!", "Ps 109:9-20": "Laat zijn kinderen wezen worden, en zijn vrouw weduwe. En laat zijn kinderen hier en daar omzwerven, en bedelen, en de nooddruft uit hun verwoeste plaatsen zoeken. Laat de schuldeiser aanslaan al wat hij heeft, en laat de vreemden zijn arbeid roven.", "Hand 7:60": "En terwijl hij op de knieën viel, riep hij met luide stem: Heere, reken hun deze zonde niet toe! En toen hij dat gezegd had, ontsliep hij.", "Job 30:11": "Want Hij heeft mijn koord losgemaakt en mij bedrukt; daarom hebben zij de teugel voor mijn aangezicht afgeworpen.", "Ex 2:25": "En God zag de kinderen van Israël aan, en God kende hen.", "2 Sam 15:30": "En David ging op door de opgang van de olijven, terwijl hij opging en weende, en zijn hoofd was bedekt; en hij zelf ging blootsvoets; ook had heel het volk dat bij hem was, ieder zijn hoofd bedekt, en zij gingen op, terwijl zij opgingen en weenden.", "1 Sam 25:17": "Weet dan nu, en zie wat u doen zult; want het kwaad is ten volle over onze heer besloten, en over zijn hele huis; en hij is een zoon van Belial, zodat men hem niet kan aanspreken.", "Gal 2:13": "En ook de andere Joden veinsden met hem mee; zodat ook Barnabas werd meegesleept door hun veinzerij.", "Ps 102:24": "Hij heeft mijn kracht op de weg neergedrukt; mijn dagen heeft Hij verkort.", "Amos 8:2": "En Hij zei: Wat ziet u, Amos? En ik zei: Een korf met zomervruchten. Toen zei de HEERE tegen mij: Het einde is gekomen over Mijn volk Israël; Ik zal het voortaan niet meer voorbijgaan.", "2 Kon 4:26": "Loop haar nu toch tegemoet, en zeg tegen haar: Is het goed met u? Is het goed met uw man? Is het goed met uw kind? En zij zei: Het is goed.", "1 Sam 24:7": "En hij zei tegen zijn mannen: Laat het ver van mij zijn bij de HEERE, dat ik deze zaak zou doen aan mijn heer, de gezalfde van de HEERE, dat ik mijn hand tegen hem uit zou steken; want hij is de gezalfde van de HEERE!", "1 Petr 2:17": "Eer ieder; heb de broederschap lief; vrees God; eer de koning.", "2 Sam 3:37": "En al het volk en heel Israël merkten op die dag dat het niet van de koning was gekomen dat Abner, de zoon van Ner, gedood was.", "Hebr 12:10": "Want zij hebben ons wel voor een korte tijd gekastijd, zoals het hun goeddacht; maar Hij kastijdt ons tot ons nut, opdat wij Zijn heiligheid deelachtig zouden worden.", "Fil 3:19": "Van wie het einde het verderf is, van wie God de buik is, en van wie de heerlijkheid in hun schande is, die aardse dingen bedenken.", "Ps 28:4": "Geef hun naar hun doen, en naar de boosheid van hun handelingen; geef hun naar het werk van hun handen; laat de vergelding voor hen tot hen terugkeren.", "2 Kon 8:13": "En Hazaël zei: Wat is uw dienaar toch, die een hond is, dat hij deze grote zaak zou doen? En Elisa zei: De HEERE heeft mij getoond dat u koning zult zijn over Syrië.", "Richt 7:10": "Maar als u ervoor terugschrikt naar beneden te gaan, ga dan af, u en Pura, uw knecht, naar het leger.", "Micha 1:12": "Want de inwoonster van Maroth is ziek om het goede; want een kwaad is van de HEERE neergedaald, tot aan de poort van Jeruzalem.", "Job 3:1-10": "Daarna opende Job zijn mond, en vervloekte zijn dag. Want Job antwoordde en zei: De dag verga, waarop ik geboren ben, en de nacht waarin men zei: Een knechtje is ontvangen.", "Dan 4:35": "En alle inwoners van de aarde worden als niets geacht, en Hij doet naar Zijn wil met het leger van de hemel en de inwoners van de aarde, en er is niemand die Zijn hand kan tegenhouden, of tegen Hem kan zeggen: Wat doet U?", "Ps 66:11": "U had ons in het net gebracht; U had een engs band om onze lenden gelegd;", "Ps 28:2": "Hoor de stem van mijn smekingen, als ik tot U roep, als ik mijn handen ophef naar het binnenste heiligdom van Uw heiligheid.", "Klaagl 3:38": "Mem. Gaat niet uit de mond van de Allerhoogste het kwade en het goede?", "Matt 11:25": "In diezelfde tijd antwoordde Jezus en zei: Ik dank U, Vader! Heere van de hemel en van de aarde! Dat U deze dingen voor de wijzen en verstandigen verborgen hebt, en die aan de kinderen geopenbaard hebt.", "Ps 38:4": "Er is niets heels in mijn vlees, vanwege Uw gramschap; er is geen vrede in mijn beenderen, vanwege mijn zonde.", "2 Sam 15:32": "En het gebeurde, toen David tot op de hoogte kwam, waar hij God aanbad, zie, toen ontmoette Husai, de Archiet, hem, met zijn kleed gescheurd, en aarde op zijn hoofd.", "Num 16:15": "Toen ontstak Mozes zeer, en hij zei tegen de HEERE: Zie hun offer niet aan! Ik heb niet één ezel van hen genomen, en niemand van hen kwaad gedaan.", "Jer 4:22": "Zeker, Mijn volk is dwaas, Mij kennen zij niet; het zijn zotte kinderen, en zij hebben geen inzicht; wijs zijn zij om kwaad te doen, maar goed te doen weten zij niet.", "Job 2:9": "Toen zei zijn vrouw tegen hem: Houdt u nog steeds vast aan uw oprechtheid? Vervloek God en sterf.", "Gen 46:21": "En de zonen van Benjamin: Bela, Becher en Asbel, Gera en Naäman, Echi en Ros, Muppim en Huppim, en Ard.", "Job 1:21": "En hij zei: Naakt ben ik uit mijn moeders buik gekomen, en naakt zal ik daarheen terugkeren. De HEERE heeft gegeven, en de HEERE heeft genomen; de Naam van de HEERE zij geloofd!", "2 Kon 6:33": "Terwijl hij nog met hen sprak, zie, zo kwam de bode bij hem af; en hij zei: Zie, dit kwaad is van de HEERE; wat zou ik nog langer op de HEERE wachten?", "1 Sam 30:8": "Toen vroeg David de HEERE: Zal ik deze bende achternajagen? Zal ik ze inhalen? En Hij zei tegen hem: Jaag na, want u zult zeker inhalen, en u zult zeker verlossen.", "Num 23:7": "Toen begon hij zijn spreuk, en zei: Uit Syrië heeft Balak, de koning van de Moabieten, mij laten halen, van het gebergte in het oosten, en zei: Kom, vervloek Jakob voor mij, en kom, scheld Israël uit!", "1 Sam 14:28": "Toen antwoordde iemand uit het volk en zei: Uw vader heeft het volk streng bezworen en gezegd: Vervloekt is de man die vandaag brood eet! Daarom bezwijkt het volk.", "2 Sam 9:2": "Het huis van Saul had een knecht, wiens naam Ziba was; en zij riepen hem bij David. En de koning zei tegen hem: Bent u Ziba? En hij zei: Uw knecht.", "Spr 19:2": "Ook is het niet goed als de ziel zonder kennis is; en die met de voeten haastig is, zondigt.", "Gen 6:4": "In die dagen waren er reuzen op de aarde, en ook daarna, toen Gods zonen tot de dochters der mensen ingegaan waren, en zich kinderen verwekt hadden; deze zijn de geweldigen, die van ouds geweest zijn, mannen van naam.", "Matt 5:11": "Zalig bent u, als de mensen u smaden en vervolgen, en liegend allerlei kwaad tegen u spreken, omwille van Mij.", "Jes 29:15": "Wee hun die zich diep willen verbergen voor de HEERE, hun raad verbergend; en wier werken in duisternis gebeuren, en zij zeggen: Wie ziet ons, en wie kent ons?", "Ps 59:12": "Dood hen niet, opdat mijn volk het niet vergeet; laat hen omzwerven door Uw macht, en werp hen neer, o Heere, ons Schild!", "Neh 4:4": "Hoor, o onze God, dat wij erg veracht worden, en keer hun smaad terug op hun eigen hoofd, en geef hen over als buit in een land van gevangenschap.", "Richt 9:57": "Op dezelfde manier liet God al het kwaad van de mensen van Sichem op hun hoofd terugkomen; en de vloek van Jotham, de zoon van Jerubbaäl, kwam over hen.", "Num 22:6-11": "En nu, kom toch, vervloek voor mij dit volk, want het is machtiger dan ik; misschien kan ik het dan verslaan, of uit het land verdrijven; want ik weet dat wie u zegent, gezegend is, en wie u vervloekt, vervloekt is. Toen gingen de oudsten van Moab en de oudsten van Midian, met het loon voor de waarzeggerij in hun hand; zo kwamen zij bij Bileam, en spraken tot hem de woorden van Balak. Hij zei toen tegen hen: Overnacht hier deze nacht, dan zal ik u een antwoord terugbrengen, zoals de HEERE tot mij zal gesproken hebben. Toen bleven de vorsten van Moab bij Bileam.", "Gen 29:33": "En zij werd opnieuw zwanger, en baarde een zoon, en zei: Omdat de HEERE gehoord heeft dat ik gehaat was, heeft Hij mij ook deze gegeven; en zij noemde zijn naam Simeon.", "1 Sam 9:25": "Daarna gingen zij van de hoogte af naar de stad; en hij sprak met Saul op het dak.", "Deut 32:6": "Zult u dit de HEERE vergelden, u, dwaas en onwijs volk! Is Hij niet uw Vader, Die u verkregen heeft, Die u gemaakt en u bevestigd heeft?", "2 Kon 20:19": "Maar Hizkia zei tegen Jesaja: Het woord van de HEERE, dat u gesproken hebt, is goed. Ook zei hij: Zou het niet goed zijn, als er vrede en waarheid in mijn dagen zal zijn?", "1 Kon 1:25": "Want hij is vandaag afgegaan en heeft ossen geslacht, en gemest vee, en schapen in overvloed, en heeft alle zonen van de koning genodigd, en de aanvoerders van het leger, en Abjathar, de priester; en zie, zij eten en drinken voor zijn aangezicht, en zeggen: Leve de koning Adonia!", "Ps 3:3": "Velen zeggen van mijn ziel: Hij heeft geen heil bij God. Sela.", "Rom 8:20": "Want de schepping is aan de zinloosheid onderworpen, niet vrijwillig, maar om hem die haar daaraan onderworpen heeft,", "Ps 5:7": "U zult de leugensprekers verdoen; van de man van het bloed en van het bedrog heeft de HEERE een gruwel.", "Richt 10:4": "Hij had dertig zonen, die op dertig ezelsveulens reden, en zij hadden dertig steden, die tot op deze dag Havvoth-jair genoemd worden en die in het land Gilead liggen.", "Jes 3:9": "Het gelaat van hun aangezicht getuigt tegen hen, en hun zonden spreken zij vrij uit, net als Sodom; zij verbergen ze niet. Wee hun ziel; want zij doen zichzelf kwaad.", "Ps 31:18": "HEERE! laat mij niet beschaamd worden, want ik roep U aan; laat de goddelozen beschaamd worden, laat hen zwijgen in het graf.", "Ps 140:11": "Vurige kolen moeten op hen geschud worden; Hij doet hen vallen in het vuur, in diepe kuilen, zodat zij niet meer opstaan.", "Deut 4:5-31": "Zie, ik heb u de inzettingen en rechten geleerd, zoals de HEERE, mijn God, mij geboden heeft; opdat u zo doet in het land waar u naar toe gaat om het in bezit te nemen. Bewaar ze dan, en doe ze; want dat zal uw wijsheid en uw verstand zijn voor de ogen van de volken, die al deze inzettingen zullen horen en zeggen: Dit grote volk is werkelijk een wijs en verstandig volk! Want welk groot volk is er, dat de goden zo dichtbij heeft als de HEERE, onze God, bij ons is, zo vaak als wij Hem aanroepen?", "Judas 1:11": "Wee hen, want zij zijn de weg van Kaïn ingegaan, en door de verleiding van het loon van Balaäm zijn zij weggestort, en zijn door de tegenspraak van Korach vergaan.", "Ps 90:7": "Want wij vergaan door Uw toorn; en door Uw grimmigheid worden wij verschrikt.", "Ps 31:19": "Laat de valse lippen stom worden, die hard spreken tegen de rechtvaardige, in hoogmoed en verachting.", "Ruth 1:21": "Vol trok ik weg, maar leeg heeft de HEERE mij laten terugkeren; waarom zouden jullie mij Naomi noemen, terwijl de HEERE tegen mij getuigt, en de Almachtige mij kwaad heeft aangedaan?", "Lev 10:1-3": "En de zonen van Aäron, Nadab en Abihu, namen ieder zijn wierookvat en deden er vuur in, en legden er reukwerk op, en brachten vreemd vuur voor het aangezicht van de HEERE, wat Hij hun niet geboden had. Toen ging er een vuur uit van het aangezicht van de HEERE, en verteerde hen; en zij stierven voor het aangezicht van de HEERE. En Mozes zei tegen Aäron: Dit is het wat de HEERE gesproken heeft: In hen die tot Mij naderen zal Ik geheiligd worden, en voor het aangezicht van heel het volk zal Ik verheerlijkt worden. Maar Aäron zweeg stil.", "Job 31:31": "Als de lieden van mijn tent niet hebben gezegd: Och, hadden wij van zijn vlees maar, wij zouden niet verzadigd worden;", "Ex 22:28": "U mag de rechters niet vervloeken, en de leiders van uw volk mag u niet belasteren.", "Ps 140:10": "Wat het hoofd betreft van hen die mij omringen, de overlast van hun lippen overdekt hen.", "Num 23:8": "Wat zal ik vervloeken, wie God niet vervloekt; en wat zal ik uitschelden, wie de HEERE niet uitscheldt?", "Klaagl 3:39": "Mem. Wat klaagt dan een levend mens? Ieder klaagt vanwege zijn zonden.", "2 Kon 19:37": "Het gebeurde nu, toen hij in het huis van Nisroch, zijn god, neerboog, dat Adramelech en Sarezer, zijn zonen, hem met het zwaard doodden; maar zij ontkwamen naar het land van Ararat; en Esar-haddon, zijn zoon, werd koning in zijn plaats.", "1 Kor 5:1": "Men hoort algemeen dat er hoererij onder u is, en wel zodanige hoererij die zelfs onder de heidenen niet genoemd wordt: dat iemand de vrouw van zijn vader heeft.", "2 Sam 16:9-14": "Toen zei Abisai, de zoon van Zeruja, tegen de koning: Waarom zou deze dode hond mijn heer de koning vloeken? Laat mij toch oversteken en zijn kop wegnemen. Maar de koning zei: Wat heb ik met u te doen, zonen van Zeruja? Ja, laat hem vloeken; want de HEERE heeft immers tegen hem gezegd: Vloek David; wie zou dan zeggen: Waarom hebt u dat gedaan? Verder zei David tegen Abisai en tegen al zijn knechten: Zie, mijn zoon, die uit mijn lijf is voortgekomen, zoekt mijn leven; hoeveel te meer dan nu deze zoon van Jemini? Laat hem begaan, laat hij vloeken, want de HEERE heeft het hem gezegd.", "1 Kon 2:22": "Toen antwoordde de koning Salomo, en zei tegen zijn moeder: En waarom vraagt u Abisag, de Sunamitische, voor Adonia? Vraag ook het koninkrijk voor hem (want hij is mijn oudere broer), ja, voor hem, en voor Abjathar, de priester, en voor Joab, de zoon van Zeruja.", "2 Sam 16:9-11": "Toen zei Abisai, de zoon van Zeruja, tegen de koning: Waarom zou deze dode hond mijn heer de koning vloeken? Laat mij toch oversteken en zijn kop wegnemen. Maar de koning zei: Wat heb ik met u te doen, zonen van Zeruja? Ja, laat hem vloeken; want de HEERE heeft immers tegen hem gezegd: Vloek David; wie zou dan zeggen: Waarom hebt u dat gedaan? Verder zei David tegen Abisai en tegen al zijn knechten: Zie, mijn zoon, die uit mijn lijf is voortgekomen, zoekt mijn leven; hoeveel te meer dan nu deze zoon van Jemini? Laat hem begaan, laat hij vloeken, want de HEERE heeft het hem gezegd.", "1 Sam 2:12": "Doch de zonen van Eli waren kinderen van Belial; zij kenden de HEERE niet.", "Num 27:21": "En hij zal voor Eleazar, de priester, staan, die voor hem om raad zal vragen, volgens de wijze van Urim, voor de HEERE; naar zijn woord zullen zij uitgaan, en naar zijn woord zullen zij ingaan, hij, en alle kinderen van Israël met hem, en de hele vergadering.", "Job 5:18": "Want Hij doet smart aan, en Hij verbindt; Hij doorwondt, en Zijn handen helen.", "1 Kron 8:7": "En Naäman, en Ahia, en Gera; dezen voerde hij weg; en hij verwekte Uzza en Ahihud.", "Ps 94:2": "Gij, Rechter der aarde! Verhef U; breng vergelding weer over de hoogmoedigen.", "2 Sam 15:23": "En heel het land weende met luide stem, terwijl heel het volk overging; ook ging de koning over de beek Kidron, en heel het volk ging over, recht in de richting van de weg naar de woestijn.", "Richt 9:24": "opdat het geweld, gedaan aan de zeventig zonen van Jerubbaäl, tot uiting zou komen, en opdat hun bloed gelegd zou worden op Abimelech, hun broer, die hen gedood had, en op de burgers van Sichem, die zijn handen gesterkt hadden om zijn broers te doden.", "Deut 27:11-13": "En Mozes gebood het volk op diezelfde dag: Dezen zullen staan om het volk te zegenen op de berg Gerizim, wanneer u over de Jordaan gegaan bent: Simeon, en Levi, en Juda, en Issaschar, en Jozef, en Benjamin. En dezen zullen staan voor de vervloeking op de berg Ebal: Ruben, Gad en Aser, Zebulon, Dan en Naftali.", "1 Sam 24:15": "Achter wie is de koning van Israël uitgetrokken? Wie jaagt u na? Een dode hond, een enkele vlo!", "Ps 40:15": "Laat hen samen beschaamd en schaamrood worden, die mijn ziel zoeken om die te vernielen; laat hen achterwaarts gedreven worden, en te schande worden, die lust hebben aan mijn kwaad.", "Job 6:4": "Want de pijlen van de Almachtige zijn in mij, waarvan het vurige venijn mijn geest uitdrinkt; de verschrikkingen van God rusten zich tegen mij.", "1 Sam 24:11": "Zie, op deze dag hebben uw ogen gezien dat de HEERE u heden in mijn hand gegeven heeft in deze spelonk, en men zei dat ik u doden zou; doch mijn hand spaarde u, want ik zei: Ik zal mijn hand niet uitsteken tegen mijn heer, want hij is de gezalfde van de HEERE.", "Gen 33:8": "En hij zei: Voor wie is heel dit leger dat ik ontmoet heb? En hij zei: Om genade te vinden in de ogen van mijn heer!", "Joz 2:6": "Maar zij had hen op het dak laten klimmen, en zij had hen verstopt onder de vlasstoppels, die zij op het dak had klaargelegd.", "1 Sam 1:11": "En zij deed een gelofte, en zei: HEERE van de heerscharen, als U werkelijk de ellende van Uw dienstmaagd aanziet, en aan mij denkt, en Uw dienstmaagd niet vergeet, maar aan Uw dienstmaagd een zoon geeft, dan zal ik hem aan de HEERE geven al de dagen van zijn leven, en er zal geen scheermes op zijn hoofd komen.", "1 Sam 2:6": "De HEERE doodt en maakt levend; Hij doet naar het graf neerdalen, en Hij doet weer opkomen.", "Ps 6:11": "Al mijn vijanden zullen zeer beschaamd en verbaasd worden; zij zullen terugkeren, zij zullen in een ogenblik beschaamd worden.", "2 Sam 12:9": "Waarom hebt u dan het woord van de HEERE veracht, door te doen wat kwaad is in Zijn ogen? U hebt Uria, de Hethiet, met het zwaard verslagen, en zijn vrouw hebt u tot uw vrouw genomen; en hem hebt u met het zwaard van de kinderen van Ammon gedood.", "1 Petr 2:23": "Die, toen Hij uitgescholden werd, niet terugschold, en toen Hij leed, niet dreigde; maar het overgaf aan Hem Die rechtvaardig oordeelt;", "1 Kon 2:45": "Maar de koning Salomo is gezegend; en de troon van David zal bevestigd zijn voor het aangezicht van de HEERE tot in eeuwigheid.", "2 Sam 17:18": "Een jongen zag hen echter, en vertelde het aan Absalom; doch die beiden gingen haastig weg, en kwamen in het huis van een man te Bahurim, die een put had in zijn binnenplaats, en zij daalden daarin af.", "Spr 21:30": "Er is geen wijsheid, en er is geen verstand, en er is geen raad tegen de HEERE.", "1 Sam 17:29": "Toen zei David: Wat heb ik nu gedaan? Is er geen reden voor?", "2 Tim 4:14": "Alexander, de kopersmid, heeft mij veel kwaad aangedaan; de Heere zal hem vergelden naar zijn werken.", "Ps 119:75": "Ik weet, HEERE! dat Uw gerichten de gerechtigheid zijn, en dat U mij uit getrouwheid verdrukt hebt.", "Lev 20:11": "En een man, die gemeenschap heeft met de vrouw van zijn vader, heeft de schaamte van zijn vader ontdekt; zij beiden zullen zeker gedood worden; hun bloed is op hen!", "Spr 29:4": "Een koning houdt het land staande door recht; maar wie tot geschenken geneigd is, verstoort het.", "Ps 10:15": "Breek de arm van de goddeloze en de bozen; zoek zijn goddeloosheid, totdat U haar niet meer vindt.", "2 Sam 17:1-15": "Verder zei Achitofel tegen Absalom: Laat mij nu twaalfduizend man uitkiezen, dan sta ik op en jaag David deze nacht achterna. Zo zal ik hem overvallen terwijl hij moe en slap van handen is, en zal hem schrik aanjagen; en al het volk dat bij hem is zal vluchten; dan zal ik de koning alleen doden. En ik zal al het volk naar u laten terugkeren; de man die u zoekt, is gelijk aan het terugkeren van allen; zo zal al het volk in vrede zijn.", "Micha 7:5": "Geloof een vriend niet, vertrouw niet op een boezemvriend; bewaar de deuren van uw mond voor haar die in uw schoot ligt.", "Klaagl 1:18": "Tsade. De HEERE is rechtvaardig, want ik ben Zijn mond opstandig geweest; hoort toch, alle volken, en ziet mijn smart; mijn jonkvrouwen en mijn jongelingen zijn in de gevangenschap gegaan.", "2 Kor 7:4": "Ik heb veel vrijmoedigheid in het spreken tegen u, ik heb veel roem over u; ik ben vervuld met vertroosting; ik ben zeer overvloedig van blijdschap in al onze verdrukking.", "2 Sam 9:10": "Daarom zult u voor hem het land bewerken, u, en uw zonen, en uw knechten, en de opbrengst inbrengen, zodat de zoon van uw heer brood heeft om te eten; en Mefiboseth, de zoon van uw heer, zal voortdurend brood eten aan mijn tafel. Ziba nu had vijftien zonen en twintig knechten.", "Ps 102:11": "Vanwege Uw verstoordheid en Uw grote toorn; want U hebt mij verheven, en mij weer neergeworpen.", "1 Sam 29:8": "Toen zei David tegen Achis: Maar wat heb ik gedaan? Of wat hebt u in uw knecht gevonden, vanaf de dag dat ik voor uw aangezicht geweest ben, tot op deze dag, dat ik niet zou mogen gaan en strijden tegen de vijanden van mijn heer, de koning?", "2 Sam 19:18": "Toen het veer overstak, om het huis van de koning over te brengen, en te doen wat goed was in zijn ogen, viel Simeï, de zoon van Gera, neer voor het gezicht van de koning, toen hij de Jordaan overstak;", "Spr 1:19": "Zo zijn de paden van ieder die hebzucht pleegt; zij zal het leven van haar meester wegnemen.", "Rom 5:3": "En niet alleen dit, maar wij roemen ook in de verdrukkingen, wetende dat de verdrukking lijdzaamheid werkt;", "Joh 18:11": "Jezus dan zei tegen Petrus: Steek uw zwaard in de schede. Zou Ik de drinkbeker die de Vader Mij gegeven heeft, niet drinken?", "Amos 8:1": "De Heere HEERE liet mij dit zien: er was een korf met zomervruchten.", "Ps 109:16-19": "Omdat hij niet gedacht heeft weldadigheid te doen, maar de ellendige en de behoeftige man heeft vervolgd, en de verslagene van hart, om hem te doden. Omdat hij de vloek heeft liefgehad, laat die hem overkomen, en heeft geen lust gehad tot de zegen, laat die dan ver van hem zijn. En laat hij bekleed zijn met de vloek, als met zijn kleed, en laat die gaan tot in zijn binnenste als het water, en als de olie in zijn beenderen.", "Job 14:14": "Als een man gestorven is, zal hij dan weer leven? Ik zou al de dagen van het strijd hopen, totdat mijn verandering zou komen.", "Joz 22:10-34": "Toen zij aankwamen bij de grenzen van de Jordaan, die in het land Kanaän zijn, bouwden de kinderen van Ruben, en de kinderen van Gad, en de halve stam van Manasse daar een altaar bij de Jordaan, een altaar groot van aanzien. En de kinderen van Israël hoorden zeggen: Zie, de kinderen van Ruben, en de kinderen van Gad, en de halve stam van Manasse hebben een altaar gebouwd, tegenover het land Kanaän, aan de grenzen van de Jordaan, aan de zijde van de kinderen van Israël. Toen de kinderen van Israël dit hoorden, verzamelde de hele vergadering van de kinderen van Israël zich te Silo, om tegen hen op te trekken met een leger.", "1 Kor 3:19": "Want de wijsheid van deze wereld is dwaasheid bij God; want er is geschreven: Hij vat de wijzen in hun sluwheid;", "1 Kron 12:40": "En ook degenen die dicht bij hen woonden, tot aan Issaschar, en Zebulon, en Nafthali, brachten brood op ezels, en op kamelen, en op muildieren, en op runderen, meel, klompen gedroogde vijgen, en rozijnenkoeken, en wijn, en olie, en runderen, en kleinvee in overvloed; want er was blijdschap in Israël.", "Job 21:17": "Hoe vaak gebeurt het, dat de lamp van de goddelozen wordt uitgeblust, en hun ondergang over hen komt; dat God hun smarten uitdeelt in Zijn toorn!", "2 Sam 11:15-17": "En hij schreef in die brief: Stel Uria vooraan tegenover de sterkste strijd, en trek u van achter hem terug, opdat hij geslagen wordt en sterft. Zo gebeurde het, toen Joab op de stad had gelet, dat hij Uria stelde op de plaats waarvan hij wist dat daar strijdbare mannen waren. Toen de mannen van de stad uittrokken en met Joab streden, vielen er van het volk, van Davids knechten, en Uria, de Hethiet, stierf ook.", "Hand 23:23": "En hij riep twee van de hoofdmannen over honderd bij zich en zei: Maak tweehonderd soldaten gereed om naar Caesarea te trekken, en zeventig ruiters en tweehonderd schutters, tegen het derde uur van de nacht.", "Deut 19:15": "Eén enkele getuige zal tegen niemand opstaan in verband met enige ongerechtigheid of enige zonde, van welke zonde hij ook zou hebben gezondigd; op de verklaring van twee getuigen, of op de verklaring van drie getuigen, zal de zaak vaststaan.", "Ezech 20:25": "Daarom gaf Ik hun ook bepalingen die niet goed waren, en rechten waardoor zij niet zouden leven.", "1 Sam 17:43": "De Filistijn nu zei tegen David: Ben ik een hond, dat u met stokken naar mij toe komt? En de Filistijn vervloekte David bij zijn goden.", "Job 28:28": "Maar tegen de mens heeft Hij gezegd: Zie, de vreze des Heeren, dat is de wijsheid, en van het kwade te wijken is het verstand.", "1 Kron 2:16": "En hun zusters waren Zeruja en Abigaïl. De kinderen nu van Zeruja waren Abisai, en Joab, en Asa-el; drie.", "Jes 56:10": "Hun wachters zijn allemaal blind, zij weten niets; zij zijn allemaal stomme honden, zij kunnen niet blaffen; zij zijn slaperig, zij liggen neer, zij hebben het sluimeren lief.", "Job 1:22": "In dit alles zondigde Job niet, en schreef God niets van het ongerijmd toe.", "2 Sam 15:1": "Het gebeurde daarna dat Absalom voor zichzelf wagens en paarden liet klaarmaken, en vijftig mannen die voor hem uit renden.", "Joz 21:18": "Anathoth en haar voorsteden, en Almon en haar voorsteden: vier steden.", "Joz 8:33": "En heel Israël met zijn oudsten, en opzichters, en zijn rechters, stonden aan deze en aan gene kant van de ark, tegenover de Levitische priesters die de ark van het verbond van de HEERE droegen, zowel vreemdelingen als geboren Israëlieten, de ene helft daarvan tegenover de berg Gerizim, en de andere helft daarvan tegenover de berg Ebal, zoals Mozes, de knecht van de HEERE, eerder bevolen had, om het volk van Israël te zegenen.", "Ps 119:84": "Hoeveel zullen de dagen van Uw knecht zijn? Wanneer zult U recht doen over mijn vervolgers?", "Gen 35:22": "En het gebeurde, toen Israël in dat land woonde, dat Ruben heenging en lag bij Bilha, het bijvrouw van zijn vader; en Israël hoorde het. En de zonen van Jakob waren twaalf.", "Ps 129:5": "Laat hen beschaamd worden en achteruitgedreven, allen die Sion haten.", "Rom 5:4": "En de lijdzaamheid werkt bevinding, en de bevinding werkt hoop;", "Richt 5:10": "U, die op witte ezelinnen rijdt, u, die aan het gericht zit, en u, die over de weg wandelt, spreek erover!", "Deut 33:11": "Zegen, HEERE! zijn vermogen, en laat U het werk van zijn handen goed bevallen; versla de lenden van hen die tegen hem opstaan en hem haten, zodat zij niet weer opstaan!", "Gen 34:30": "Toen zei Jakob tegen Simeon en tegen Levi: U hebt mij in het ongeluk gestort, doordat u mij stinkend maakt onder de inwoners van dit land, onder de Kanaänieten en onder de Ferezieten; en ik heb weinig volk in aantal; als zij zich tegen mij verzamelen, zullen zij mij verslaan, en ik zal vernietigd worden, ik en mijn huis.", "Jer 40:13-16": "Doch Johanan, de zoon van Kareah, en alle aanvoerders van de legers die in het veld waren, kwamen tot Gedalia te Mizpa, en zeiden tegen hem: Weet u wel dat Baälis, de koning van de kinderen van Ammon, Ismaël, de zoon van Nethanja, uitgezonden heeft om u om het leven te brengen? Maar Gedalia, de zoon van Ahikam, geloofde hen niet. Johanan echter, de zoon van Kareah, sprak in het verborgene tot Gedalia, te Mizpa, en zei: Laat mij toch heengaan, en Ismaël, de zoon van Nethanja, doden, en niemand zal het weten; waarom zou hij u om het leven brengen, en heel Juda, dat tot u vergaderd is, verstrooid worden, en het overblijfsel van Juda verloren gaan?", "Ps 69:28": "Doe misdaad bij hun misdaad, en laat hen niet komen tot Uw gerechtigheid.", "Jes 16:9": "Daarom beween ik, met de wening over Jaezer, de wijnstok van Sibma; ik maak u doornat met mijn tranen, o Hesbon en Eleale! Want het vreugdegeroep over uw zomervruchten en over uw oogst is verstomd;", "2 Sam 16:9-12": "Toen zei Abisai, de zoon van Zeruja, tegen de koning: Waarom zou deze dode hond mijn heer de koning vloeken? Laat mij toch oversteken en zijn kop wegnemen. Maar de koning zei: Wat heb ik met u te doen, zonen van Zeruja? Ja, laat hem vloeken; want de HEERE heeft immers tegen hem gezegd: Vloek David; wie zou dan zeggen: Waarom hebt u dat gedaan? Verder zei David tegen Abisai en tegen al zijn knechten: Zie, mijn zoon, die uit mijn lijf is voortgekomen, zoekt mijn leven; hoeveel te meer dan nu deze zoon van Jemini? Laat hem begaan, laat hij vloeken, want de HEERE heeft het hem gezegd.", "Job 13:15": "Zie, al doodde Hij mij, zou ik niet hopen? Toch zal ik mijn wegen voor Zijn aangezicht verdedigen.", "Jer 20:12": "Gij dan, o HEERE van de heerscharen, Die de rechtvaardige beproeft, Die de nieren en het hart ziet, laat mij Uw wraak op hen zien, want ik heb U mijn rechtszaak voorgelegd.", "Neh 4:5": "Dek hun ongerechtigheid niet toe, en laat hun zonde niet uitgewist worden van voor Uw aangezicht, want zij hebben U getergd, tegenover de bouwers.", "1 Sam 10:24": "Toen zei Samuël tegen heel het volk: Ziet u wie de HEERE gekozen heeft? Want er is niemand zoals hij onder heel het volk. Toen juichte heel het volk, en zij zeiden: Leve de koning!", "Jes 39:8": "Maar Hizkia zei tegen Jesaja: Het woord van de HEERE dat u gesproken hebt, is goed. Ook zei hij: Er zal immers vrede en waarheid zijn in mijn dagen!", "Ex 20:16": "U zult geen valse getuigenis spreken tegen uw naaste.", "2 Sam 19:16-23": "En Simeï, de zoon van Gera, een Benjaminiet, die uit Bahurim was, haastte zich, en kwam met de mannen van Juda naar beneden, koning David tegemoet; En duizend man van Benjamin met hem; ook Ziba, de knecht van Sauls huis, en zijn vijftien zonen en zijn twintig knechten met hem; en zij trokken vaardig de Jordaan over, voor de koning uit. Toen het veer overstak, om het huis van de koning over te brengen, en te doen wat goed was in zijn ogen, viel Simeï, de zoon van Gera, neer voor het gezicht van de koning, toen hij de Jordaan overstak;", "1 Kon 2:5": "U weet ook zelf wat Joab, de zoon van Zeruja, mij heeft aangedaan, en wat hij heeft gedaan aan de twee legeraanvoerders van Israël, Abner, de zoon van Ner, en Amasa, de zoon van Jether, die hij heeft gedood, en hij heeft krijgsbloed vergoten in vredestijd; en hij heeft krijgsbloed gedaan aan zijn gordel, die om zijn middel was, en aan zijn schoenen, die aan zijn voeten waren.", "Luk 12:3": "Daarom, alles wat u in het duister gezegd hebt, zal in het licht gehoord worden; en wat u in het oor gesproken hebt, in de binnenkamers, zal op de daken gepredikt worden.", "Jona 2:3": "Want U had mij geworpen in de diepte, in het hart van de zeeën, en de stroom omving mij; al Uw baren en Uw golven gingen over mij heen.", "Job 5:6": "Want uit
