sraël en Juda.","6":"En de koning trok met zijn mannen naar Jeruzalem, tegen de Jebusieten, die in dat land woonden. En zij zeiden tegen David: U zult hier niet binnenkomen, maar de blinden en kreupelen zullen u wegjagen; dat wil zeggen: David zal hier niet binnenkomen.","7":"Maar David nam de burcht Sion in; dat is de stad van David.","8":"Want David zei op diezelfde dag: Ieder die de Jebusieten slaat en bij die watergoot komt, en die kreupelen en die blinden, die door Davids ziel gehaat worden, *die zal tot een hoofd en tot een leider zijn*; daarom zegt men: Een blinde en kreupele zal het huis niet binnenkomen.","9":"Zo woonde David in de burcht en noemde die de stad van David. En David bouwde rondom, vanaf Millo naar binnen toe.","10":"David nu ging voortdurend voort, en werd machtig; want de HEERE, de God van de heerscharen[1], was met hem.","11":"En Hiram, de koning van Tyrus, zond boden naar David, en cederhout, en timmerlieden, en metselaars; en zij bouwden David een huis.","12":"En David merkte dat de HEERE hem tot koning over Israël bevestigd had, en dat Hij zijn koninkrijk verheven had, omwille van Zijn volk Israël.","13":"En David nam nog meer bijvrouwen en vrouwen uit Jeruzalem, nadat hij uit Hebron gekomen was; en David werden nog meer zonen en dochters geboren.","14":"En dit zijn de namen van hen die hem in Jeruzalem geboren zijn: Schammua, en Schobab, en Nathan, en Salomo.","15":"En Ibchar, en Elischua, en Nefeg, en Jafia,","16":"En Elischama, en Eljada, en Elifeleth.","17":"Toen de Filistijnen hoorden dat zij David tot koning over Israël gezalfd hadden, trokken alle Filistijnen op om David te zoeken; en David hoorde dat en trok af naar de burcht.","18":"En de Filistijnen kwamen en verspreidden zich in het dal Refaïm.","19":"Toen vroeg David de HEERE: Zal ik optrekken tegen de Filistijnen? Zult U hen in mijn hand geven? En de HEERE zei tegen David: Trek op, want Ik zal de Filistijnen zeker in uw hand geven.","20":"Toen kwam David bij Baäl-Perazim; en David sloeg hen daar, en zei: De HEERE heeft mijn vijanden voor mijn aangezicht uiteengeslagen, zoals een doorbraak van water; daarom noemde hij die plaats Baäl-Perazim.","21":"En zij lieten hun afgoden daar achter; en David en zijn mannen namen ze mee.","22":"Daarna trokken de Filistijnen weer op; en zij verspreidden zich in het dal Refaïm.","23":"En David vroeg de HEERE, Die zei: U zult niet optrekken; *maar* trek om, tot achter hen, zodat u bij hen komt van tegenover de moerbeibomen;","24":"En het zal gebeuren, als u het geluid van een gang hoort in de toppen van de moerbeibomen, dat u zich dan haast; want dan is de HEERE voor uw aangezicht uitgegaan, om het leger van de Filistijnen te verslaan.","25":"En David deed zo, zoals de HEERE hem geboden had; en hij versloeg de Filistijnen van Geba af, tot waar u bij Gezer komt."},"SV":{"1":"Toen kwamen alle stammen van Israël tot David te Hebron; en zij spraken, zeggende: Zie, wij, uw gebeente en uw vlees zijn wij.","2":"Daartoe ook te voren, toen Saul koning over ons was, waart gij Israël uitvoerende en inbrengende; ook heeft de HEERE tot u gezegd: Gij zult Mijn volk Israël weiden, en gij zult tot een voorganger zijn over Israël.","3":"Alzo kwamen alle oudsten van Israël tot den koning te Hebron; en de koning David maakte een verbond met hen te Hebron, voor het aangezicht des HEEREN; en zij zalfden David tot koning over Israël.","4":"Dertig jaar was David oud, als hij koning werd; veertig jaren heeft hij geregeerd.","5":"Te Hebron regeerde hij over Juda zeven jaren en zes maanden; en te Jeruzalem regeerde hij drie en dertig jaren over gans Israël en Juda.","6":"En de koning toog met zijn mannen naar Jeruzalem, tegen de Jebusieten, die in dat land woonden. En zij spraken tot David, zeggende: Gij zult hier niet inkomen, maar de blinden en kreupelen zullen u afdrijven; dat is te zeggen: David zal hier niet inkomen.","7":"Maar David nam den burg Sion in; dezelve is de stad Davids.","8":"Want David zeide ten zelfden dage: Al wie de Jebusieten slaat, en geraakt aan die watergoot, en die kreupelen, en die blinden, die van Davids ziel gehaat zijn, *die* *zal* *tot* *een* *hoofd* *en* *tot* *een* *overste* *zijn*; daarom zegt men: Een blinde en kreupele zal in het huis niet komen.","9":"Alzo woonde David in den burg en noemde dien Davids stad. En David bouwde rondom van Millo af en binnenwaarts.","10":"David nu ging geduriglijk voort, en werd groot; want de HEERE, de God der heirscharen, was met hem.","11":"En Hiram, de koning van Tyrus, zond boden tot David, en cederenhout, en timmerlieden, en metselaars; en zij bouwden David een huis.","12":"En David merkte, dat de HEERE hem tot een koning over Israël bevestigd had, en dat Hij zijn koninkrijk verheven had, om Zijns volks Israëls wil.","13":"En David nam meer bijwijven, en vrouwen van Jeruzalem, nadat hij van Hebron gekomen was; en David werden meer zonen en dochteren geboren.","14":"En dit zijn de namen dergenen, die hem te Jeruzalem geboren zijn: Schammua, en Schobab, en Nathan, en Salomo.","15":"En Ibchar, en Elischua en Nefeg, en Jafia,","16":"En Elischama, en Eljada, en Elifeleth.","17":"Als nu de Filistijnen hoorden, dat zij David ten koning over Israël gezalfd hadden, zo togen alle Filistijnen op om David te zoeken; en David, dat horende, toog af, naar den burg.","18":"En de Filistijnen kwamen en verspreidden zich in het dal Refaim.","19":"Zo vraagde David den HEERE, zeggende: Zal ik optrekken tegen de Filistijnen? Zult Gij ze in mijn hand geven? En de HEERE zeide tot David: Trek op, want Ik zal de Filistijnen zekerlijk in uw hand geven.","20":"Toen kwam David te Baäl-perazim; en David sloeg hen aldaar, en zeide: De HEERE heeft mijn vijanden voor mijn aangezicht gescheurd, als een scheur der wateren; daarom noemde hij den naam derzelve plaats, Baäl-perazim.","21":"En zij lieten hun afgoden aldaar; en David en zijn mannen namen ze op.","22":"Daarna togen de Filistijnen weder op; en zij verspreidden zich in het dal Refaim.","23":"En David vraagde den HEERE, Dewelke zeide: Gij zult niet optrekken; *maar* trek om tot achter hen, dat gij aan hen komt van tegenover de moerbezienbomen;","24":"En het geschiede, als gij hoort het geruis van een gang in de toppen der moerbezienbomen, dan rep u; want alsdan is de HEERE voor uw aangezicht uitgegaan, om het heirleger der Filistijnen te slaan.","25":"En David deed alzo, gelijk als de HEERE hem geboden had; en hij sloeg de Filistijnen van Geba af, totdat gij komt te Gezer."},"KJV":{"1":"Then came all the tribes of Israel to David unto Hebron, and spake, saying, Behold, we are thy bone and thy flesh.","2":"Also in time past, when Saul was king over us, thou wast he that leddest out and broughtest in Israel: and the LORD said to thee, Thou shalt feed my people Israel, and thou shalt be a captain over Israel.","3":"So all the elders of Israel came to the king to Hebron; and king David made a league with them in Hebron before the LORD: and they anointed David king over Israel.","4":"David was thirty years old when he began to reign, and he reigned forty years.","5":"In Hebron he reigned over Judah seven years and six months: and in Jerusalem he reigned thirty and three years over all Israel and Judah.","6":"And the king and his men went to Jerusalem unto the Jebusites, the inhabitants of the land: which spake unto David, saying, Except thou take away the blind and the lame, thou shalt not come in hither: thinking, David cannot come in hither.","7":"Nevertheless David took the strong hold of Zion: the same is the city of David.","8":"And David said on that day, Whosoever getteth up to the gutter, and smiteth the Jebusites, and the lame and the blind, that are hated of David's soul, he shall be chief and captain. Wherefore they said, The blind and the lame shall not come into the house.","9":"So David dwelt in the fort, and called it the city of David. And David built round about from Millo and inward.","10":"And David went on, and grew great, and the LORD God of hosts was with him.","11":"And Hiram king of Tyre sent messengers to David, and cedar trees, and carpenters, and masons: and they built David an house.","12":"And David perceived that the LORD had established him king over Israel, and that he had exalted his kingdom for his people Israel's sake.","13":"And David took him more concubines and wives out of Jerusalem, after he was come from Hebron: and there were yet sons and daughters born to David.","14":"And these be the names of those that were born unto him in Jerusalem; Shammua, and Shobab, and Nathan, and Solomon,","15":"Ibhar also, and Elishua, and Nepheg, and Japhia,","16":"And Elishama, and Eliada, and Eliphalet.","17":"But when the Philistines heard that they had anointed David king over Israel, all the Philistines came up to seek David; and David heard of it, and went down to the hold.","18":"The Philistines also came and spread themselves in the valley of Rephaim.","19":"And David enquired of the LORD, saying, Shall I go up to the Philistines? wilt thou deliver them into mine hand? And the LORD said unto David, Go up: for I will doubtless deliver the Philistines into thine hand.","20":"And David came to Baalperazim, and David smote them there, and said, The LORD hath broken forth upon mine enemies before me, as the breach of waters. Therefore he called the name of that place Baalperazim.","21":"And there they left their images, and David and his men burned them.","22":"And the Philistines came up yet again, and spread themselves in the valley of Rephaim.","23":"And when David enquired of the LORD, he said, Thou shalt not go up; but fetch a compass behind them, and come upon them over against the mulberry trees.","24":"And let it be, when thou hearest the sound of a going in the tops of the mulberry trees, that then thou shalt bestir thyself: for then shall the LORD go out before thee, to smite the host of the Philistines.","25":"And David did so, as the LORD had commanded him; and smote the Philistines from Geba until thou come to Gazer."}},"tsk":{"1":[{"kopje":"kwamen","refs":["1 Kron 11:1-3","1 Kron 12:23-40"]},{"kopje":"wij","refs":["2 Sam 19:13","Gen 29:14","Deut 17:15","Richt 9:2","Ef 5:30","Hebr 2:14"]}],"2":[{"kopje":"uitleidde","refs":["Num 27:17","1 Sam 18:13","1 Sam 18:16","1 Sam 25:28","Jes 55:4"]},{"kopje":"weiden","refs":["2 Sam 7:7","1 Sam 16:1","1 Sam 16:12","1 Sam 16:13","1 Sam 25:30","Ps 78:70-72","Jes 40:11","Ezech 34:23","Ezech 37:24","Ezech 37:25","Micha 5:3","Matt 2:6","Joh 10:3","Joh 10:4","Joh 10:11"]},{"kopje":"een leider","refs":["1 Sam 9:16","1 Sam 13:14","2 Kon 20:5","Jes 55:4","Hebr 2:10"]}],"3":[{"kopje":"Zo kwamen alle","refs":["Ex 3:16","1 Kron 11:3"]},{"kopje":"sloot","refs":["1 Sam 11:15","2 Kon 11:17","2 Kron 23:16","Neh 9:38"]},{"kopje":"voor","refs":["Richt 11:11","1 Sam 23:18"]},{"kopje":"zalfden","refs":["2 Sam 2:4","1 Sam 16:13"]}],"4":[{"kopje":"dertig","refs":["Luk 3:23"]},{"kopje":"veertig","refs":["1 Kron 26:31","1 Kron 29:27"]}],"5":[{"kopje":"zeven jaar","refs":["2 Sam 2:11","1 Kon 2:11","1 Kron 3:4"]}],"6":[{"kopje":"Jeruzalem","refs":["Gen 14:18","Joz 10:3","Richt 1:8","Hebr 7:1"]},{"kopje":"de Jebusieten","refs":["Joz 15:63","Joz 18:28","Richt 1:8","Richt 1:21","Richt 19:10-12"]},{"kopje":"die zeiden","refs":["2 Sam 5:8"]},{"kopje":"maar","refs":["Jer 37:10"]}],"7":[{"kopje":"Sion","refs":["Ps 2:6","Ps 9:12","Ps 48:13","Ps 51:20","Ps 87:2","Ps 132:13","Jes 12:6","Jes 59:20","Micha 4:2","Rom 9:33","Hebr 12:22","Openb 14:1"]},{"kopje":"dat","refs":["2 Sam 5:9","2 Sam 6:10","1 Kon 2:10","1 Kon 3:1","1 Kon 8:1","1 Kron 11:7","2 Kron 5:2","2 Kron 24:16"]}],"8":[{"kopje":"Ieder","refs":["Joz 15:16","Joz 15:17","1 Sam 17:25"]},{"kopje":"die zal zijn","refs":["1 Kron 11:6-9"]}],"9":[{"kopje":"de stad","refs":["2 Sam 5:7"]},{"kopje":"Millo","refs":["Richt 9:6","Richt 9:20","1 Kon 9:15","1 Kon 9:24","1 Kon 11:27","1 Kron 11:8","2 Kron 32:5"]}],"10":[{"kopje":"ging voortdurend voort, en werd machtig","refs":["2 Sam 3:1","Job 17:9 " data-code=\"H1057\">trees.</span>","24":"And let it be, when thou <span class=\"wl wl-kjv\" data-code=\"H8085\">hearest</span> the <span class=\"wl wl-kjv\" data-code=\"H6963\">sound</span> of a <span class=\"wl wl-kjv\" data-code=\"H6807\">going</span> in the <span class=\"wl wl-kjv\" data-code=\"H7218\">tops</span> of the mulberry <span class=\"wl wl-kjv\" data-code=\"H1057\">trees,</span> that then thou shalt <span class=\"wl wl-kjv\" data-code=\"H2782\">bestir</span> thyself: for then shall the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> go <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> thee, to <span class=\"wl wl-kjv\" data-code=\"H5221\">smite</span> the <span class=\"wl wl-kjv\" data-code=\"H4264\">host</span> of the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines.</span>","25":"And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> did <span class=\"wl wl-kjv\" data-code=\"H6213\">so,</span> as the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> had <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> him; and <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines</span> from <span class=\"wl wl-kjv\" data-code=\"H1387\">Geba</span> until thou <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> to <span class=\"wl wl-kjv\" data-code=\"H1507\">Gazer.</span>"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"stammen van Israël","tekst":"Versta, gezanten van alle stammen. Zie vs.3."},{"catchword":"gebeente en uw vlees zijn wij","tekst":"Wij zijn van enen bloede, beiden gesproten uit den patriarch Jakob, en dienvolgens broeders. Zodanigen had God geboden tot koning te kiezen, Deu 17:15. Aangaande de manier van spreken, zie Gen 29:14."}],"2":[{"catchword":"te voren,","tekst":"Hebreeuws, gisteren, ook eergisteren"},{"catchword":"uitvoerende en inbrengende;","tekst":"Dat is, die het krijgsvolk aan en van den vijand voerde, overal voorging, en beleid van zaken had, en overzulks, als een ervaren heer, tot het koninkrijk bekwaam is. Zie 1Sa 18:5, 1Sa 18:16, en vergelijk Num 27:17."},{"catchword":"gezegd","tekst":"Ten tijde uwer zalving door Samuel, beschreven 1Sa 16:11-13. Alhoewel deze woorden daar niet staan."},{"catchword":"weiden,","tekst":"Dat is, regeren met al zulke zorg, genegenheid en getrouwheid, als een goed herder, [waarop gij u verstaat] zijn schapen leidt, weidt, regeert, bezorgt en beschermt. Zie Psa 78:70-71, en onder, 2Sa 7:7."},{"catchword":"voorganger zijn over Israël","tekst":"Of, leidsman, hertog. Zie onder, 2Sa 6:21."}],"3":[{"catchword":"oudsten van Israël","tekst":"Zie Exo 3:16, en vergelijk Lev 4:15, en Lev 9:1."},{"catchword":"een verbond","tekst":"Waardoor zij wederzijds bij ede tot hun schuldige plichten werden verbonden."},{"catchword":"aangezicht des HEEREN;","tekst":"Dat is, in bijwezen des priesters met den efod bekleed, of, in een statelijke vergadering en rijksdag, met aanroeping van des Heeren naam. Vergelijk Jdg 11:11."},{"catchword":"zalfden David tot koning over Israël","tekst":"Dit was Davids derde zalving. Zie boven, 2Sa 2:4."}],"4":[{"catchword":"oud","tekst":"Hebreeuws, een zoon van dertig jaar"},{"catchword":"veertig jaren","tekst":"En zes maanden, gelijk uit vs.5 blijkt. Van zulk een gebruik van een rond getal, zie Jdg 11:26. Anderen verstaan zes maanden onder de veertig jaren. Doch vs.5 en 1Ki 2:11 [alwaar dezelfde jaren van Davids regering te Hebron alleen gesteld worden, zonder de zes maanden] schijnen mede te brengen dat de zes maanden zijner regering te Hebron overschieten."}],"6":[{"catchword":"toog","tekst":"Zonder twijfel door Gods raad en met toestemming der gezanten en oudsten van Israël, die bij hem geweest waren, vs.3."},{"catchword":"mannen","tekst":"Dat is, krijgslieden, gelijk in de voorgaande hoofstukken dikwijls."},{"catchword":"Jeruzalem,","tekst":"Tevoren genoemd Jebus, Jdg 19:10, en Salem, Gen 14:18; Psa 76:2-3, zijnde de plaats, die van God verkoren was om aldaar zijn naam te zetten en den stoel des koninkrijks van gans Israël op te richten, toebehorende Juda [Davids stam] en Benjamin."},{"catchword":"Jebusieten,","tekst":"Die tot dezen tijd toe Jeruzalem hadden ingenomen, of immers het meeste en sterkste deel, te weten, het slot. Zie Jdg 1:8, en Jdg 19:12."},{"catchword":"blinden en kreupelen zullen u afdrijven;","tekst":"Dien zij, [naar sommiger gevoelen] tot Davids spijt en spot de vesting in bewaring hadden gegeven, willende daarmede tonen dat de plaats van zichzelve zo vast en sterk was, dat ook kreupelen en blinden die tegen David zouden kunnen beschermen. Anders, tenzij dat gij die blinden en kreupelen wegneemt, of wegdoet; waardoor enigen verstaan der Jebusieten afgodische beelden, die zij, als patronen en beschermers, het slot toevertrouwden, noemende die blinden en kreupelen naar Davids en der Israëlieten gevoelen, maar menen dat zij wel anders zouden bevinden. Anderen verstaan door de blinden en kreupelen de soldaten van David, die zij zo verwijtelijk schelden, alsof zij zeiden: Het moesten andere krijgslieden doen dan uw volk."}],"7":[{"catchword":"de stad Davids","tekst":"Zie vs.9, en 1Ki 2:10."}],"8":[{"catchword":"slaat,","tekst":"Versta, die de eerste en voorste zal zijn in het slaan der Jebusieten. Zie 1Ch 11:6."},{"catchword":"watergoot,","tekst":"Of, kanaal, buis, waterleiding, sluis; dat is, binnen de vesting, waar deze watergoot, mitsgaders de lammen en blinden lagen, of waar de afgoden opgericht waren."},{"catchword":"gehaat zijn,","tekst":"Vanwege de bespotting der Jebusieten, boven, vs.6. Of versta, der Jebusieten, afgoden, die Davids ziel haatte. Anders, [want de kreupelen en blinden zijn van Davids ziel gehaat], dat is, David heeft geen lam en blind volk lief, maar kloeke krijgslieden."},{"catchword":"zal tot een hoofd en tot een overste zijn","tekst":"Deze woorden zijn tot aanvulling van Davids redenen hier ingevoegd uit 1Ch 11:6. Sommigen verstaan het dat men het alzo hier kan nemen, dat de belofte van beloning verzwegen kan zijn, als in het eedzweren en anderszins wel gebruikelijk is."},{"catchword":"daarom zegt men","tekst":"Dat is, tot gedachtenis van deze aanmerkelijke geschiedenis is dit spreekwoord gebleven."},{"catchword":"Een blinde en kreupele zal in het huis niet komen","tekst":"Of, daar is een blinde en lamme; [dat is, daar zijn blinden en lammen] hij zal er niet binnen komen. Om zo te bespotten een zorgeloze, of degenen, die op ijdele en nietige hulp trots zijnde en roemende, zich bedrogen vinden, gelijk de Jebusieten in hun roem op de blinden en kreupelen tegen David. Sommigen menen dat men te dien tijde tot ene gedachtenis besloten heeft, geen blinden en lammen binnen den burg Zion meer te laten komen. Eenigen menen de zin te zijn, dat het kloeke krijgslieden moeten zijn, die een vaste plaats zullen innemen."}],"9":[{"catchword":"bouwde","tekst":"En Joab bouwde de rest, 1Ch 11:8."},{"catchword":"Millo af en binnenwaarts","tekst":"Van Millo, zie 1Ki 9:15, en Jdg 9:6."}],"10":[{"catchword":"ging geduriglijk voort,","tekst":"Hebreeuws, ging gaande en groot wordende; dat is, werd van tijd tot tijd hoe langer hoe machtiger."},{"catchword":"heirscharen,","tekst":"Zie 1Ki 18:15."},{"catchword":"was met hem","tekst":"Zie Gen 21:22, en Gen 26:24; Num 14:9."}],"11":[{"catchword":"Hiram,","tekst":"Hebreeuws, Chiram"},{"catchword":"Tyrus,","tekst":"Hebreeuws, Tsor. Een zeer vermaarde, machtige, koninklijke koopstad, gelegen aan en in de zee bij de westelijke grenzen van den stam Aser. Zie ook Jos 19:29."},{"catchword":"timmerlieden,","tekst":"Hebreeuws, meesters, of, kunstenaars van hout"},{"catchword":"metselaars;","tekst":"Hebreeuws, kunstenaars, of meesters van steen des wands, of wandsteen."}],"12":[{"catchword":"bevestigd had,","tekst":"Dat is, hij werd door bevinding van Gods genadigen zegen en bijstand, zo in het geestelijke als lichamelijke hoe langer hoe meer versterkt en verzekerd van zijn beroep tot het koninkrijk over Israël."},{"catchword":"om Zijns volks Israëls wil","tekst":"Dat is, ten beste van zijn kerk."}],"13":[{"catchword":"bijwijven,","tekst":"Zie van bijwijven, Gen 22:24."}],"14":[{"catchword":"Schammua,","tekst":"Ook genoemd Schima, 1Ch 3:5."},{"catchword":"Sálomo","tekst":"Hebreeuws, Schelomoh."}],"15":[{"catchword":"Elischua","tekst":"Ook genoemd Elischama, 1Ch 3:6."}],"16":[{"catchword":"Eljada,","tekst":"Ook genoemd Beëliada, 1Ch 14:7."}],"17":[{"catchword":"Als nu de Filistijnen hoorden,","tekst":"Vergelijk hiermede de wederhaling van deze geschiedenis, gedaan 1Ch 14:8, enz."},{"catchword":"zij David ten koning over Israël gezalfd hadden,","tekst":"Te weten, de Israëlieten."},{"catchword":"zoeken;","tekst":"Om hem, als een vreselijken vijand, intijds te overvallen en met gemener hand te slaan."},{"catchword":"toog af,","tekst":"Met zijn krijgsvolk."},{"catchword":"burg","tekst":"Om met zijn leger zich bij den burg te onthouden, totdat hij wat zeker mocht hebben besloten. Zie 1Ch 14:8."}],"18":[{"catchword":"Refaïm","tekst":"Of, der grenzen. Zie Gen 14:5. Dit dal lag in Juda, Jos 15:8. Of, aan de noordelijke grenzen van Juda, in Benjamin, ten westen van Jeruzalem."}],"19":[{"catchword":"vraagde David den HEERE,","tekst":"Vergelijk 1Sa 23:9, en 1Sa 30:7, en 2Sa 2:1, enz."},{"catchword":"zekerlijk in uw hand geven","tekst":"Hebreeuws, gevende geven."}],"20":[{"catchword":"Baäl-perázim","tekst":"Alzo naderhand van David genoemd, gelijk in het volgende verhaald wordt."},{"catchword":"De HEERE","tekst":"Of, de HEERE is door mijn vijanden heen doorgebroken, voor mijn aangezicht, gelijk een waterbreuk, of, inbreuk, doorbreking van wateren. De zin schijnt te wezen dat God door zijn macht en Davids dienst [ 1Ch 14:11 ] de Filistijnen had overvallen en nedergestort, gelijk wateren met macht en sterkelijk doorbreken, en alles overlopen en nedervellen; of, zo licht als water verloopt of, zo licht als water verloopt of gedeeld en verstrooid wordt, heeft God de Filistijnen van elkander verstrooid."},{"catchword":"Baäl-perázim","tekst":"Dat is, heer, of, meester, bezitter van scheuren, breuken, doorbrekingen; dat is, het plein, of effen der scheuren, de plaats der scheuren."}],"21":[{"catchword":"zij lieten","tekst":"De Filistijnen, die hun afgoden hadden medegenomen, menende door derzelver tegenwoordigheid zeker victorie te bekomen."},{"catchword":"afgoden aldaar;","tekst":"Het Hebreeuwse woord betekent smarten, wedommen, omdat dit de vruchten der afgoderij zijn. Zie 1Sa 31:9."},{"catchword":"namen ze op","tekst":"Om die, volgens Davids bevel, en Gods gebod [ Deu 7:25] ] met vuur te verbranden, gelijk uitdrukkelijk staat 1Ch 14:12. Anders, verbrandde ze, lieten ze opgaan [in het vuur]."}],"22":[{"catchword":"weder op;","tekst":"Hebreeuws, deden toe, of, voeren voort weder, of, nogmaals op te trekken"},{"catchword":"Refaïm","tekst":"Gelijk tevoren. Zie boven, vs.18."}],"23":[{"catchword":"vraagde den HEERE,","tekst":"Zie boven, vs.19."}],"24":[{"catchword":"geruis van een gang","tekst":"Dat is [gelijk sommigen verstaan], een gedruis als van marcheren, waardoor de tegenwoordigheid der heilige engelen kan worden verstaan."},{"catchword":"rep u;","tekst":"Dat is, maak u op met het krijgsvolk, om de Filistijnen aan te vallen."},{"catchword":"uitgegaan,","tekst":"Zie Jdg 4:14."}],"25":[{"catchword":"Geba","tekst":"Anders doorgaans genoemd Gibea, gelegen in Benjamin. Zie Jdg 19:13, en Jdg 20:10; 1Ch 14:16 staat Gibeon"},{"catchword":"te Gezer","tekst":"Gelegen in Efraïm, in het westen naar de zee toe. Zie Jos 16:10."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Then all the tribes [Understand Ambassadours sent from all the tribes: see ver.3.] of Israel came to David to Hebron: and they spake, saying; Behold, we are thy bone, and thy flesh. [i.e. we are of one blood, both descended from the Patriarch Jacob, and consequently brethren: such a person God had commanded them to choose for their King, Deut.17.15. concerning the phrase, see Gen.29.on v.14.]"}],"2":[{"catchword":null,"tekst":"Besides, heretofore, [Heb. Yesterday, also ere yesterday,] when Saul was King over us, thou wast leading out, and bringing in Israel: [i.e. He that led the souldiers, and brought them off from the enemy, went every where before them, and had the chief command and managing of War, and in that respect, as an experienced Commander, is most for the Kingdom. See 1 Sam.18.5, 16. and compare Numb.27.on v.17.] Also the LORD said unto thee; [viz. At the time of thine anointing by Samuel, described 1 Sam.16. vers.11, 12, 13. Although these words be not there mentioned] thou shalt feet my people Israel, [i.e. govern them with such care, affection, and faithfulness, as a good shepheard (as thou art) leadeth, feedeth, governeth, taketh care of, and protecteth his sheep: see Psal.78.70, 71. and below chap.7.7.] and thou shalt be a Goer before [or, thou shalt be Leader, Duke, see above chap.6.21.] over Israel."}],"3":[{"catchword":null,"tekst":"So all the Eldest of Israel [See Exo 3:16. and compare Lev.4.15.& 9.1.] came to the King to Hebron; and King David made league with them [whereby they were bound on both sides by oath to perform their duties to each other] at Hebron before the face of the LORD: [i.e. in the presence of the Priest clothed with the Ephod, or in a stately Assembly, and solemn meeting, with calling upon the Name of the Lord. Compare Juda.11.on ver.11.] and they anointed David King over Israel. [This was David&acirc;&euro;&trade;s third anointed. See above chap.2.on v.4.]"}],"4":[{"catchword":null,"tekst":"David was thirty years old, [Heb. A son of thirty year] when he was King: he reigned fourty year. [And six months, as appeareth from the following verse. Of such an use of a round and complete number, see Judg.11.on v.26. Others understand six months less then fourty years. But the verse following, and 1 King.2.11. (where the same years of David&acirc;&euro;&trade;s reign at Hebron are only mentioned without the six months) seem to import, that the six months of his reign at Hebron, are over and above the fourty years.]"}],"5":[{"catchword":null,"tekst":"At Hebron he reigned over Juda seven years, and six months; and at Jerusalem he reigned three and thirty years over all Israel and Juda."}],"6":[{"catchword":null,"tekst":"And the King went [Without doubt by the advise and counsel of God, and with the consent and approbation of the Ambassadors and Eldest of Israel, that had been with him, vers.3.] with his men. [i.e. souldiers; as often in the former chapter is declared] to Jerusalem, [formerly called Jebus, Judg.19 10. and Salem, Gen 14:18. Psal.76.2, 3. being the place chosen by God, to set his Name there, and to erect the throne of the Kingdom over all Israel, belonging to Juda (David&acirc;&euro;&trade;s tribe) and Benjamin] against the Jebusites, [who hitherto had possession of Jerusalem, or at least of the greatest and strongest part thereof, to wit, of the strong hold, or castle. See Judg.1.on ver.8.and 19.on vers.12.] who dwelt in that land: and they spake unto David, saying; Thou shalt not come in hither, but the blind and cripple shall drive thee away, [to whose custody and protection (according to the opinion of some) they had committed the strong hold, to the spite and scorn or disgrace of David & had given the strong hold to keep, intimating thereby, that the place of it self was so firm and strong, that even cripple and blind persons were able to keep and defend it against David. Oth. Except thou take away, or, put away those blind and cripple ones: whereby some understand the idolatrous images of the Jabusites, whom they as Protectors entrusted with the keeping and guarding of the strong hold, calling them blind and cripple, according to the opinion of David and Israelites; but imagined, that they would find them otherwise then so Others understand by the blind and cripple the souldiers of David, whom they so upbraidingly reviled; as if they had said, They must be other kind of souldiers that must do it then thy men are] that is to say, David shall not come in hither."}],"7":[{"catchword":null,"tekst":"But David took the strong hold of Zion, the same is the city of David. [See verse 9.& 1 King.2.on verse 10.]"}],"8":[{"catchword":null,"tekst":"For David said on that day; Whosoever smitteth the Jebusites, [Meaning, he that shall be the first and foremost in smiting the Jebusites: see 1 Chron.11.6.] and getteth up to that gutter, [or, channel, pipe, water-course, sluce; that is, within the strong hold, wherein this gutter, together with the blind add lame lay, or where the Idols were set up.] and (to) those cripple, and those blind (ones), that are hated of David&acirc;&euro;&trade;s soul, [Because of the scorn and contempt offered by the Jebusites, above verse 6. Or, it may be meant of the Idols of the Jebusites, whom David&acirc;&euro;&trade;s soul hated and abhorred. Oth. for the cripple and blind are hated of David&acirc;&euro;&trade;s soul. i.e. David loveth no lame and Blind people, but valiant and stout souldiers] (he shall be an head, and a Commander:) [These words are here inserted out of Chron.11 6. To fill up David&acirc;&euro;&trade;s speech or saying. Some conceive that it may be here so taken, as that the promise of reward may be concealed, as is most usual in swearing and otherwise] herefore its said: [i.e. in remembrance of this remarkable passage doth this Proverb remain] a blind and cripple (person) shall not come into the house. [Or, there is a blind and lame (one), i.e. there are blind and lame (ones) he shall not enter therein; That slout and jeer a careless person, or those who being proud and bragging of idle and vain help, find themselves deceived as the Jebusites did, in their boasting of the blind and cripple against David. Some are of opinion that it was concluded at that time for remembrance hereof, to suffer no blind and lame persons to come any more into the strong hold of Zion. Some conceive this to be the meaning, that they must be stout and valiant souldiers, that shall take or subdue a strong place.]"}],"9":[{"catchword":null,"tekst":"Thus David dwelt in the fort, and called that city, The City of David: And David built round about from Millo, [Of Millo, see 1 King.9.on verse 15.& Judg.9.on verse 6.] and inward. [And Joab built the rest, 1 Chron.11.8.]"}],"10":[{"catchword":null,"tekst":"Now David went on constantly, and became great: [Heb. Went going and growing great; i.e. grew from time to time the longer the stronger] For the LORD, the God of Host, [see 1 King.18.on verse 15.] was with him. [See Gen.21.on verse 22. And 26 on verse 24. Num.14.on vers.9.]"}],"11":[{"catchword":null,"tekst":"And Hiram [Heb. Chiram] the King of Tyrus Heb.Tsor: a very famous, mighty, royal, merchantable city, lying at and in the Sea by the Western borders of the tribe of Aser. See also Jos.19.on ver.19.] sent messengers to David, and cedar-wood, and carpenters, [Heb. masters, or, artificers of wood] and masons; [Heb. artificers, or, masters of stone of the wall, or, wall-stone] and they built David an house."}],"12":[{"catchword":null,"tekst":"And David perceived, that the LORD had established him King over Israel: [i.e. He was by experience of Gods gracious blessing and assistance both in spiritual and corporal things, more and more strengthened, and assured to his calling to the Kingdom over Israel] and that he had exalted his Kingdom, for his people Israels sake. [i.e. for the good of his Church.]"}],"13":[{"catchword":null,"tekst":"And David took more concubines, [Of Concubines, see Gen.22.on verse 24.] and wives from Jerusalem, after that he was come from Hebron: and (there) were more sons and daughters born to David."}],"14":[{"catchword":null,"tekst":"But these are the names of those that were born at Jerusalem; Schammua, [Called also Schima, 1 Chron.3.5.] and Schobab, and Nathan, and Salomo: [Heb. Schelomoh.]"}],"15":[{"catchword":null,"tekst":"And Ibchar, and Elischua, [Called also Elischuna, 1 Chron.3.6.] and Nepheg, and Japhia:"}],"16":[{"catchword":null,"tekst":"And Elischama, and Eljada, [Called also Beeliada, 1 Chron.14.7.] and Eliphelet."}],"17":[{"catchword":null,"tekst":"Now when the Philistine heard, that they [viz. The Israelites] had anointed David King over Israel: then all the Philistines marched up to seek David: [i.e. To fall upon him betimes, as upon a dreadful and terrible enemy, and with united strength and power to smite him. Compare herewith the repetition of this passage, 1 Chron.14.8,&c.] and David hearing that, marched down, [viz. with his souldiers, forces] to the Fort. [To abide with his Camp by the fort, until he should have determined some certain thing upon a sure ground.]"}],"18":[{"catchword":null,"tekst":"And the Philistines came and spread themselves in the valley of Rephaim. [Or, of the Giants. See Genes.14.on verse 5. This valley lay in Juda, Jos.15.8. or on the Northern borders of Juda, in Benjamin, Westward from Jerusalem.]"}],"19":[{"catchword":null,"tekst":"So David enquired of the LORD, [Compare 1 Sam.23.9. & 30.7. & 2 Sam.2. 1, &c.] Saying; shall I march up against the philistines? Wilt thou deliver them up into mine hand? and the LORD said unto David; March up, for I will surely deliver [Heb. giving give, or, delivering deliver] the Philistines into thine hand."}],"20":[{"catchword":null,"tekst":"Then David came to Baal-Perasim; [Afterward so called by David, as in the following words is declared] and David smote them there, and said; The LORD hath rent mine enemies before my face, as a rent of water; [or, the LORD hath broken forth upon mine enemies, before my face, as a water-breach, or, incursion, breaking thorough of waters. The sense seemeth to be, that God by his power, and David&acirc;&euro;&trade;s service (1 Chron.14.11.) had fallen upon the Philistines, and overthrown them, as waters do with force and violence break thorough, and over-run all things, and cast them down: or as easily as water passeth away, or is divided and scattered, so easily hath God scattered the Philistines one from another] therefore he called the name of that place Baal-Perasim. [i.e. LORD, or, master, Possessour of rents, breaches, breakings thorough: i.e. the plain, or, even (ground) of rents, the place of rents]"}],"21":[{"catchword":null,"tekst":"And they [viz. The Philistines, who had taken their Idols along with them, imagining by their presence surely to get the victory] left their Idols [the Hebrew word signifieth pains, smarts, griefs, because these are the fruits of Idolatry, see 1 Sam.31.on ver.9.] there: And David and his men took them up, [to burn them with fire, according to David&acirc;&euro;&trade;s order, and Gods command, Deut.7.25. as expressly is mentioned, 1 Chron.14.12. Otherwise, burnt them, Let them ascend in the fire.]"}],"22":[{"catchword":null,"tekst":"After that the Philistines marched up again: [Heb. Added, or, went on again, or, more times to marched up.] and they spread themselves in the valley of Rephaim. [as before; see above v.18.]"}],"23":[{"catchword":null,"tekst":"And David enquired of the LORD, [See above on ver.19.] who said; Thou shalt not march up: (but) fetch a campass behind them, that thou mayest come upon them over against the Mulberry-trees."}],"24":[{"catchword":null,"tekst":"And let it be, when thou hearest the sound of a going; [i.e. (as some understand it) a noise as it were of marching: whereby may be understood the presence of the holy Angels] in the tops of the Mulberry-trees, then bestir thyself: [get thee up with the souldiery, to fall upon the Philistines] for then is the LORD gone out: [see Judg 4.on ver.14.] before thy face, to smite the host of the Philistines."}],"25":[{"catchword":null,"tekst":"And David did so, according as the LORD had commanded him: And he smote the Philitines from Geba, [Otherwise, ever called Gibea, Lying in Benjamin. See Judg.19.on verse 13. and 20.on verse 10. 1 Chron.14.16. Its called Gibeon] until thou come to Gezer. [Lying in Ephraim, in the West toward the sea: see Jos.16.10.]"}]}}};

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
