am":"Openbaring","href":"../../openbaring/1/"}],"slugmap":{"Gen":"genesis","Ex":"exodus","Lev":"leviticus","Num":"numeri","Deut":"deuteronomium","Joz":"jozua","Richt":"richteren","Ruth":"ruth","1 Sam":"1-samuel","2 Sam":"2-samuel","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"En Joab werd verteld: Zie, de koning huilt en bedrijft rouw over Absalom.","2":"Toen werd de overwinning op diezelfde dag voor het hele volk tot rouw; want het volk had diezelfde dag horen zeggen: Het smart de koning over zijn zoon.","3":"En het volk kwam diezelfde dag stiekem de stad binnen, zoals het volk zich wegsteelt, dat beschaamd is wanneer zij in de strijd gevlucht zijn.","4":"De koning nu had zijn gezicht bedekt, en de koning riep met luide stem: Mijn zoon Absalom, Absalom, mijn zoon, mijn zoon!","5":"Toen kwam Joab bij de koning in huis, en zei: U hebt vandaag het gezicht van al uw knechten beschaamd gemaakt, terwijl zij vandaag uw leven hebben gered, en het leven van uw zonen en uw dochters, en het leven van uw vrouwen, en het leven van uw bijvrouwen;","6":"Door hen lief te hebben die u haten, en te haten die u liefhebben; want u geeft vandaag te kennen dat leiders en knechten voor u niets betekenen; want ik merk vandaag dat als Absalom in leven was gebleven, en wij vandaag allemaal dood waren, dat het u dan goed zou uitkomen.","7":"Zo sta nu op, ga naar buiten, en spreek uw knechten moed in; want ik zweer bij de HEERE: als u niet naar buiten gaat, zal er vannacht niemand bij u blijven! En dat zal erger voor u zijn dan al het kwaad dat u overkomen is vanaf uw jeugd tot nu toe.","8":"Toen stond de koning op, en ging in de poort zitten. En zij lieten heel het volk weten: Zie, de koning zit in de poort. Toen kwam heel het volk voor de koning, maar Israël was gevlucht, ieder naar zijn tent.","9":"En heel het volk, in alle stammen van Israël, was onder elkaar aan het twisten en zei: De koning heeft ons gered uit de hand van onze vijanden en hij heeft ons bevrijd uit de hand van de Filistijnen, en nu is hij het land uit gevlucht vanwege Absalom;","10":"En Absalom, die wij over ons gezalfd hadden, is in de strijd gestorven; waarom zwijgt u dan nu over het terughalen van de koning?","11":"Toen zond koning David *een bericht* naar Zadok en naar Abjathar, de priesters, en zei: Spreek tegen de oudsten van Juda: Waarom zouden jullie de laatsten zijn om de koning terug te halen naar zijn huis? (Want wat er in heel Israël gezegd werd, was de koning ter ore gekomen in zijn huis.)","12":"U bent mijn broeders; mijn gebeente en mijn vlees bent u; waarom zouden jullie dan de laatsten zijn om de koning terug te halen?","13":"En tegen Amasa moet u zeggen: Bent u niet mijn gebeente en mijn vlees? God doe mij zo, en meer dan dat, als u niet legeraanvoerder wordt voor mijn aangezicht, alle dagen, in de plaats van Joab.","14":"Zo boog hij het hart van alle mannen van Juda, als van één man; en zij stuurden een boodschap naar de koning: Keer terug, u en al uw knechten.","15":"Toen keerde de koning terug, en kwam tot aan de Jordaan; en Juda kwam naar Gilgal, om de koning tegemoet te gaan, om de koning over de Jordaan te brengen.","16":"En Simeï, de zoon van Gera, een Benjaminiet, die uit Bahurim was, haastte zich, en kwam met de mannen van Juda naar beneden, koning David tegemoet;","17":"En duizend man van Benjamin met hem; ook Ziba, de knecht van Sauls huis, en zijn vijftien zonen en zijn twintig knechten met hem; en zij trokken vaardig de Jordaan over, voor de koning uit.","18":"Toen het veer overstak, om het huis van de koning over te brengen, en te doen wat goed was in zijn ogen, viel Simeï, de zoon van Gera, neer voor het gezicht van de koning, toen hij de Jordaan overstak;","19":"En hij zei tegen de koning: Mijn heer, rekent u mij de schuld niet toe, en gedenkt u niet wat uw knecht verkeerd gedaan heeft, op de dag dat mijn heer de koning uit Jeruzalem wegging, dat de koning het zich ter harte zou nemen.","20":"Want uw knecht weet zeer goed dat ik gezondigd heb; maar zie, ik ben vandaag gekomen, als eerste van heel het huis van Jozef, om mijn heer de koning tegemoet te gaan.","21":"Toen antwoordde Abisai, de zoon van Zeruja, en zei: Zou Simeï hiervoor niet gedood moeten worden? Hij heeft toch de gezalfde van de HEERE vervloekt?","22":"Maar David zei: Wat heb ik met u te maken, zonen van Zeruja, dat u mij vandaag tot tegenstander zou willen zijn? Zou er vandaag iemand gedood moeten worden in Israël? Want weet ik niet dat ik vandaag koning geworden ben over Israël?","23":"En de koning zei tegen Simeï: U zult niet sterven. En de koning zwoer het hem.","24":"Mefiboseth, Sauls zoon, kwam ook de koning tegemoet; en hij had zijn voeten niet verzorgd, noch zijn baard geknipt, noch zijn kleren gewassen, vanaf de dag dat de koning weggegaan was, tot de dag dat hij met vrede terugkwam.","25":"En het gebeurde, toen hij in Jeruzalem de koning tegemoet kwam, dat de koning tegen hem zei: Waarom bent u niet met mij meegegaan, Mefiboseth?","26":"En hij zei: Mijn heer koning, mijn knecht heeft mij bedrogen; want uw knecht zei: Ik zal voor mij een ezel zadelen, en daarop rijden, en naar de koning trekken, want uw knecht is kreupel.","27":"Bovendien heeft hij uw knecht bij mijn heer de koning valselijk beschuldigd; maar mijn heer de koning is als een engel van God; doe dan wat goed is in uw ogen.","28":"Want heel mijn vaders huis was voor mijn heer de koning niets anders dan mensen die de dood verdienen; toch hebt u uw knecht een plaats gegeven onder hen die aan uw tafel eten; wat recht heb ik dan nog om verder te klagen bij de koning?","29":"Toen zei de koning tegen hem: Waarom spreekt u nog meer over uw zaken? Ik heb gezegd: U en Ziba, verdeel het land.","30":"En Mefiboseth zei tegen de koning: Laat hem het ook helemaal maar nemen, nu mijn heer de koning met vrede in zijn huis is teruggekomen.","31":"Barzillai, de Gileadiet, kwam ook naar beneden uit Rogelim; en hij trok met de koning de Jordaan over, om hem over de Jordaan te begeleiden.","32":"Barzillai nu was zeer oud, een man van tachtig jaar; en hij had de koning van voedsel voorzien toen hij in Mahanaïm verbleef; want hij was een zeer belangrijk man.","33":"En de koning zei tegen Barzillai: Trek met mij mee, en ik zal u bij mij in Jeruzalem onderhouden.","34":"Maar Barzillai zei tegen de koning: Hoeveel dagen zullen de jaren van mijn leven nog duren, dat ik met de koning zou optrekken naar Jeruzalem?","35":"Ik ben vandaag tachtig jaar oud; zou ik nog kunnen onderscheiden tussen goed en kwaad? Zou uw knecht kunnen proeven wat ik eet en wat ik drink? Zou ik nog kunnen horen naar de stem van zangers en zangeressen? En waarom zou uw knecht mijn heer de koning nog langer tot last zijn?","36":"Uw knecht zal maar een klein stukje met de koning de Jordaan overgaan; waarom toch zou de koning mij zo'n beloning geven?","37":"Laat uw knecht toch terugkeren, zodat ik sterf in mijn eigen stad, bij het graf van mijn vader en mijn moeder; maar zie, daar is uw knecht Chimham, laat hem met mijn heer de koning meetrekken, en doe met hem wat goed is in uw ogen.","38":"Toen zei de koning: Chimham zal met mij meetrekken, en ik zal met hem doen wat goed is in uw ogen; ja, alles wat u van mij zult verlangen, zal ik voor u doen.","39":"Toen nu heel het volk de Jordaan overgegaan was, en de koning ook overgegaan was, kuste de koning Barzillai, en zegende hem; en die keerde terug naar zijn woonplaats.","40":"En de koning trok verder naar Gilgal, en Chimham trok met hem mee; en heel het volk van Juda had de koning over de Jordaan geholpen, evenals de helft van het volk van Israël.","41":"En zie, alle mannen van Israël kwamen naar de koning; en zij zeiden tegen de koning: Waarom hebben onze broeders, de mannen van Juda, u gestolen, en hebben zij de koning en zijn huis over de Jordaan gebracht, en alle mannen van David met hem?","42":"Toen antwoordden alle mannen van Juda de mannen van Israël: Omdat de koning ons nauw verwant is; en waarom zijn jullie nu boos over deze zaak? Hebben wij dan ook maar iets gegeten op kosten van de koning, of heeft hij ons een geschenk gegeven?","43":"En de mannen van Israël antwoordden de mannen van Juda, en zeiden: Wij hebben tien delen aan de koning, en ook aan David hebben wij, meer dan jullie, recht; waarom hebben jullie ons dan geringschat, zodat ons woord niet het eerste geweest is bij het terughalen van onze koning? Maar het woord van de mannen van Juda was harder dan het woord van de mannen van Israël."},"SV":{"1":"En Joab werd aangezegd: Zie, de koning weent, en bedrijft rouw over Absalom.","2":"Toen werd de verlossing te dienzelven dage het ganse volk tot rouw; want het volk had te dienzelven dage horen zeggen: Het smart den koning over zijn zoon.","3":"En het volk kwam te dienzelven dage steelsgewijze in de stad, gelijk als het volk zich wegsteelt, dat beschaamd is, wanneer zij in den strijd gevloden zijn.","4":"De koning nu had zijn aangezicht toegewonden, en de koning riep met luider stem: Mijn zoon Absalom, Absalom, mijn zoon, mijn zoon!","5":"Toen kwam Joab tot den koning in het huis, en zeide: Gij hebt heden beschaamd het aangezicht van al uw knechten, die uw ziel, en de ziel uwer zonen en uwer dochteren, en de ziel uwer vrouwen, en de ziel uwer bijwijven heden hebben bevrijd;","6":"Liefhebbende die u haten, en hatende die u liefhebben; want gij geeft heden te kennen, dat oversten en knechten bij u niets zijn; want ik merk heden, dat zo Absalom leefde, en wij heden allen dood waren, dat het alsdan recht zou zijn in uw ogen.","7":"Zo sta nu op, ga uit, en spreek naar het hart uwer knechten; want ik zweer bij den HEERE, als gij niet uitgaat, zo er een man dezen nacht bij u zal vernachten! En dit zal u kwader zijn, dan al het kwaad, dat over u gekomen is van uw jeugd af tot nu toe.","8":"Toen stond de koning op, en zette zich in de poort. En zij lieten al het volk weten, zeggende: Ziet, de koning zit in de poort. Toen kwam al het volk voor des konings aangezicht, maar Israël was gevloden, een iegelijk naar zijn tenten.","9":"En al het volk, in alle stammen van Israël, was onder zich twistende, zeggende: De koning heeft ons gered van de hand onzer vijanden en hij heeft ons bevrijd van de hand der Filistijnen, en nu is hij uit het land gevlucht voor Absalom;","10":"En Absalom, die wij over ons gezalfd hadden, is in den strijd gestorven; nu dan, waarom zwijgt gijlieden van den koning weder te halen?","11":"Toen zond de koning David tot Zadok en tot Abjathar, de priesteren, zeggende: Spreekt tot de oudsten van Juda, zeggende: Waarom zoudt gijlieden de laatsten zijn, om den koning weder te halen in zijn huis? (Want de rede van het ganse Israël was tot den koning gekomen in zijn huis.)","12":"Gij zijt mijn broederen; mijn been en mijn vlees zijt gij; waarom zoudt gij dan de laatsten zijn, om den koning weder te halen?","13":"En tot Amasa zult gijlieden zeggen: Zijt gij niet mijn been en mijn vlees? God doe mij zo, en doe er zo toe, zo gij niet krijgsoverste zult zijn voor mijn aangezicht, te allen dage, in Joabs plaats.","14":"Alzo neigde hij het hart aller mannen van Juda, als van een enigen man; en zij zonden henen tot den koning, *zeggende*: Keer weder, gij en al uw knechten.","15":"Toen keerde de koning weder, en kwam tot aan de Jordaan; en Juda kwam te Gilgal, om den koning tegemoet te gaan, dat zij den koning over de Jordaan voerden.","16":"En Simeï, de zoon van Gera, een zoon van Jemini, die van Bahurim was, haastte zich, en kwam af met de mannen van Juda, den koning David tegemoet;","17":"En duizend man van Benjamin met hem; ook Ziba, de knecht van Sauls huis, en zijn vijftien zonen en zijn twintig knechten met hem; en zij togen vaardiglijk over de Jordaan, voor den koning.","18":"Als nu de pont overvoer, om het huis des konings over te halen, en te doen, wat goed was in zijn ogen, zo viel Simeï, de zoon van Gera, neder voor het aangezicht des konings, als hij over de Jordaan voer;","19":"En hij zeide tot den koning: Mijn heer rekene mij niet toe de misdaad, en gedenke niet, wat uw knecht verkeerdelijk gedaan heeft, te dien dage, als mijn heer de koning uit Jeruzalem uitging, dat het de koning zich ter harte zoude nemen.","20":"Want uw knecht weet *het* zekerlijk, ik heb gezondigd; doch zie, ik ben heden gekomen, de eerste van het ganse huis van Jozef, om mijn heer den koning tegemoet af te komen.","21":"Toen antwoordde Abisai, de zoon van Zeruja, en zeide: Zou dan Simeï hiervoor niet gedood worden? Zo hij toch den gezalfde des HEEREN gevloekt heeft.","22":"Maar David zeide: Wat heb ik met ulieden te doen, gij zonen van Zeruja! Dat gij mij heden ten satan zoudt zijn? Zou heden iemand gedood worden in Israël? Want weet ik niet, dat ik heden koning geworden ben over Israël?","23":"En de koning zeide tot Simeï: Gij zult niet sterven. En de koning zwoer hem.","24":"Mefiboseth, Sauls zoon, kwam ook af den koning tegemoet; en hij had zijn voeten niet schoon gemaakt, noch zijn knevelbaard beschoren, noch zijn klederen gewassen, van dien dag af, dat de koning was weggegaan, tot dien dag toe, dat hij met vrede wederkwam.","25":"En het geschiedde, als hij te Jeruzalem den koning tegemoet kwam, dat de koning tot hem zeide: Waarom zijt gij niet met mij getogen, Mefiboseth?","26":"En hij zeide: Mijn heer koning, mijn knecht heeft mij bedrogen; want uw knecht zeide: Ik zal mij een ezel zadelen, en daarop rijden, en tot den koning trekken, want uw knecht is kreupel.","27":"Daartoe heeft hij uw knecht bij mijn heer den koning valselijk aangedragen; doch mijn heer de koning is als een engel Gods; doe dan, wat goed is in uw ogen.","28":"Want al mijns vaders huis is niet geweest, dan maar lieden des doods voor mijn heer den koning; nochtans hebt gij uw knecht gezet onder degenen, die aan uw tafel eten; wat heb ik dan meer voor gerechtigheid, en meer te roepen aan den koning?","29":"Toen zeide de koning tot hem: Waarom spreekt gij meer *van* uw zaken? Ik heb gezegd: Gij en Ziba, deelt het land.","30":"En Mefiboseth zeide tot den koning: Hij neme het ook gans weg, naardien mijn heer de koning met vrede in zijn huis is gekomen.","31":"Barzillai, de Gileadiet, kwam ook af van Rogelim; en hij toog met den koning over de Jordaan, om hem over de Jordaan te geleiden.","32":"Barzillai nu was zeer oud, een man van tachtig jaren; en hij had den koning onderhouden, toen hij te Mahanaim zijn verblijf had; want hij was een zeer groot man.","33":"En de koning zeide tot Barzillai: Trekt gij met mij over, en ik zal u bij mij te Jeruzalem onderhouden.","34":"Maar Barzillai zeide tot den koning: Hoe veel zullen de dagen der jaren mijns levens zijn, dat ik met den koning zou optrekken naar Jeruzalem?","35":"Ik ben heden tachtig jaren oud; zou ik kunnen onderscheiden tussen goed en kwaad? Zou uw knecht kunnen smaken, wat ik eet en wat ik drink? Zoude ik meer kunnen horen naar de stem der zangers en zangeressen? En waarom zou uw knecht mijn heer den koning verder tot een last zijn?","36":"Uw knecht zal maar een weinig met den koning over de Jordaan gaan; waarom toch zou mij de koning zulk een vergelding doen?","37":"Laat toch uw knecht wederkeren, dat ik sterve in mijn stad, bij het graf mijns vaders en mijner moeder; maar zie, daar is uw knecht Chimham, laat dien met mijn heer den koning overtrekken, en doe hem, wat goed is in uw ogen.","38":"Toen zeide de koning: Chimham zal met mij overtrekken, en ik zal hem doen, wat goed is in uw ogen; ja, alles, wat gij op mij begeren zult, zal ik u doen.","39":"Toen nu al het volk over de Jordaan gegaan was, en de koning *ook* was overgegaan, kuste de koning Barzillai, en zegende hem; alzo keerde hij weder naar zijn plaats.","40":"En de koning toog voort naar Gilgal, en Chimham toog met hem voort; en al het volk van Juda had den koning overgevoerd , als ook een gedeelte van het volk Israëls.","41":"En ziet, alle mannen van Israël kwamen tot den koning; en zij zeiden tot den koning: Waarom hebben u onze broeders, de mannen van Juda, gestolen, en hebben den koning en zijn huis over de Jordaan gevoerd, en alle mannen Davids met hem?","42":"Toen antwoordden alle mannen van Juda tegen de mannen van Israël: Omdat de koning ons na verwant is; en waarom zijt gij nu toornig over deze zaak? Hebben wij dan enigszins gegeten van des konings *kost*, of heeft hij ons een geschenk geschonken?","43":"En de mannen van Israël antwoordden den mannen van Juda, en zeiden: Wij hebben tien delen aan den koning, en ook aan David, wij, meer dan gij; waarom hebt gij ons dan gering geacht, dat ons woord niet het eerste geweest is, om onzen koning weder te halen? Maar het woord der mannen van Juda was harder dan het woord der mannen van Israël."},"KJV":{"1":"And it was told Joab, Behold, the king weepeth and mourneth for Absalom.","2":"And the victory that day was turned into mourning unto all the people: for the people heard say that day how the king was grieved for his son.","3":"And the people gat them by stealth that day into the city, as people being ashamed steal away when they flee in battle.","4":"But the king covered his face, and the king cried with a loud voice, O my son Absalom, O Absalom, my son, my son!","5":"And Joab came into the house to the king, and said, Thou hast shamed this day the faces of all thy servants, which this day have saved thy life, and the lives of thy sons and of thy daughters, and the lives of thy wives, and the lives of thy concubines;","6":"In that thou lovest thine enemies, and hatest thy friends. For thou hast declared this day, that thou regardest neither princes nor servants: for this day I perceive, that if Absalom had lived, and all we had died this day, then it had pleased thee well.","7":"Now therefore arise, go forth, and speak comfortably unto thy servants: for I swear by the LORD, if thou go not forth, there will not tarry one with thee this night: and that will be worse unto thee than all the evil that befell thee from thy youth until now.","8":"Then the king arose, and sat in the gate. And they told unto all the people, saying, Behold, the king doth sit in the gate. And all the people came before the king: for Israel had fled every man to his tent.","9":"And all the people were at strife throughout all the tribes of Israel, saying, The king saved us out of the hand of our enemies, and he delivered us out of the hand of the Philistines; and now he is fled out of the land for Absalom.","10":"And Absalom, whom we anointed over us, is dead in battle. Now therefore why speak ye not a word of bringing ➔ the king back?","11":"And king David sent to Zadok and to Abiathar the priests, saying, Speak unto the elders of Judah, saying, Why are ye the last to bring ➔ the king back to his house? seeing the speech of all Israel is come to the king, even to his house.","12":"Ye are my brethren, ye are my bones and my flesh: wherefore then are ye the last to bring back the king?","13":"And say ye to Amasa, Art thou not of my bone, and of my flesh? God do so to me, and more also, if thou be not captain of the host before me continually in the room of Joab.","14":"And he bowed the heart of all the men of Judah, even as the heart of one man; so that they sent this word unto the king, Return thou, and all thy servants.","15":"So the king returned, and came to Jordan. And Judah came to Gilgal, to go to meet the king, to conduct ➔ the king over Jordan.","16":"And Shimei the son of Gera, a Benjamite, which was of Bahurim, hasted and came down with the men of Judah to meet king David.","17":"And there were a thousand men of Benjamin with him, and Ziba the servant of the house of Saul, and his fifteen sons and his twenty servants with him; and they went over Jordan before the king.","18":"And there went over a ferry boat to carry over the king's household, and to do what he thought good. And Shimei the son of Gera fell down before the king, as he was come over Jordan;","19":"And said unto the king, Let not my lord impute iniquity unto me, neither do thou remember that which thy servant did perversely the day that my lord the king went out of Jerusalem, that the king should take it to his heart.","20":"For thy servant doth know that I have sinned: therefore, behold, I am come the first this day of all the house of Joseph to go down to meet my lord the king.","21":"But Abishai the son of Zeruiah answered and said, Shall not Shimei be put to death for this, because he cursed the LORD'S anointed?","22":"And David said, What have I to do with you, ye sons of Zeruiah, that ye should this day be adversaries unto me? shall there any man be put to death this day in Israel? for do not I know that I am this day king over Israel?","23":"Therefore the king said unto Shimei, Thou shalt not die. And the king sware unto him.","24":"And Mephibosheth the son of Saul came down to meet the king, and had neither dressed his feet, nor trimmed his beard, nor washed his clothes, from the day the king departed until the day he came again in peace.","25":"And it came to pass, when he was come to Jerusalem to meet the king, that the king said unto him, Wherefore wentest not thou with me, Mephibosheth?","26":"And he answered, My lord, O king, my servant deceived me: for thy servant said, I will saddle me an ass, that I may ride thereon, and go to the king; because thy servant is lame.","27":"And he hath slandered thy servant unto my lord the king; but my lord the king is as an angel of God: do therefore what is good in thine eyes.","28":"For all of my father's house were but dead men before my lord the king: yet didst thou set thy servant among them that did eat at thine own table. What right therefore have I yet to cry any more unto the king?","29":"And the king said unto him, Why speakest thou any more of thy matters? I have said, Thou and Ziba divide the land.","30":"And Mephibosheth said unto the king, Yea, let him take all, forasmuch as my lord the king is come again in peace unto his own house.","31":"And Barzillai the Gileadite came down from Rogelim, and went over Jordan with the king, to conduct him over Jordan.","32":"Now Barzillai was a very aged man, even fourscore years old: and he had provided the king of sustenance while he lay at Mahanaim; for he was a very great man.","33":"And the king said unto Barzillai, Come thou over with me, and I will feed thee with me in Jerusalem.","34":"And Barzillai said unto the king, How long have I to live, that I should go up with the king unto Jerusalem?","35":"I am this day fourscore years old: and can I discern between good and evil? can thy servant taste what I eat or what I drink? can I hear any more the voice of singing men and singing women? wherefore then should thy servant be yet a burden unto my lord the king?","36":"Thy servant will go ➔ a little way over Jordan with the king: and why should the king recompense it me with such a reward?","37":"Let thy servant, I pray thee, turn back again, that I may die in mine own city, and be buried by the grave of my father and of my mother. But behold thy servant Chimham; let him go over with my lord the king; and do to him what shall seem good unto thee.","38":"And the king answered, Chimham shall go over with me, and I will do to him that which shall seem good unto thee: and whatsoever thou shalt require of me, that will I do for thee.","39":"And all the people went over Jordan. And when the king was come over, the king kissed Barzillai, and blessed him; and he returned unto his own place.","40":"Then the king went on to Gilgal, and Chimham went on with him: and all the people of Judah conducted the king, and also half the people of Israel.","41":"And, behold, all the men of Israel came to the king, and said unto the king, Why have our brethren the men of Judah stolen thee away, and have brought the king, and his household, and all David's men with him, over Jordan?","42":"And all the men of Judah answered the men of Israel, Because the king is near of kin to us: wherefore then be ye angry for this matter? have we eaten at all of the king's cost? or hath he given us any gift?","43":"And the men of Israel answered the men of Judah, and said, We have ten parts in the king, and we have also more right in David than ye: why then did ye despise us, that our advice should not be first had in bringing back our king? And the words of the men of Judah were fiercer than the words of the men of Israel."}},"tsk":{"2":[{"kopje":"werd","refs":["Spr 16:15","Spr 19:12"]}],"3":[{"kopje":"de stad binnen","refs":["2 Sam 19:32","2 Sam 17:24"]},{"kopje":"wegsteelt","refs":["Gen 31:27"]}],"4":[{"kopje":"bedekt","refs":["2 Sam 15:30"]},{"kopje":"Mijn zoon","refs":["2 Sam 18:33"]}],"5":[{"kopje":"gered","refs":["Neh 9:27","Ps 3:9","Ps 18:48","Ps 18:49"]}],"6":[{"kopje":"u geeft te kennen","refs":["2 Sam 3:24","2 Sam 3:25","Job 34:18","Spr 19:9","Spr 19:10","Hand 23:5"]}],"7":[{"kopje":"spreek uw knechten moed in","refs":["Gen 34:3","Spr 19:15","Jes 40:1","Hos 2:13"]},{"kopje":"niemand","refs":["Spr 14:28"]},{"kopje":"al het kwaad","refs":["Ps 71:4-6","Ps 7 /span>."},"koppeling_kjv":{"1":"And it was <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab,</span> Behold, the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H1058\">weepeth</span> and <span class=\"wl wl-kjv\" data-code=\"H56\">mourneth</span> for <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom.</span>","2":"And the <span class=\"wl wl-kjv\" data-code=\"H8668\">victory</span> that <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> was turned into <span class=\"wl wl-kjv\" data-code=\"H60\">mourning</span> unto all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people:</span> for the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> that <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> how the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> was <span class=\"wl wl-kjv\" data-code=\"H6087\">grieved</span> for his <span class=\"wl wl-kjv\" data-code=\"H1121\">son.</span>","3":"And the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H935\">gat</span> them by <span class=\"wl wl-kjv\" data-code=\"H1589\">stealth</span> that <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> into the <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> as <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> being <span class=\"wl wl-kjv\" data-code=\"H3637\">ashamed</span> steal <span class=\"wl wl-kjv\" data-code=\"H1589\">away</span> when they <span class=\"wl wl-kjv\" data-code=\"H5127\">flee</span> in <span class=\"wl wl-kjv\" data-code=\"H4421\">battle.</span>","4":"But the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H3813\">covered</span> his <span class=\"wl wl-kjv\" data-code=\"H6440\">face,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H2199\">cried</span> with a <span class=\"wl wl-kjv\" data-code=\"H1419\">loud</span> <span class=\"wl wl-kjv\" data-code=\"H6963\">voice,</span> O my <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom,</span> O <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom,</span> my <span class=\"wl wl-kjv\" data-code=\"H1121\">son,</span> my <span class=\"wl wl-kjv\" data-code=\"H1121\">son!</span>","5":"And <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> into the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> to the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Thou hast <span class=\"wl wl-kjv\" data-code=\"H3001\">shamed</span> this <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> the <span class=\"wl wl-kjv\" data-code=\"H6440\">faces</span> of all thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servants,</span> which this <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> have <span class=\"wl wl-kjv\" data-code=\"H4422\">saved</span> thy <span class=\"wl wl-kjv\" data-code=\"H5315\">life,</span> and the <span class=\"wl wl-kjv\" data-code=\"H5315\">lives</span> of thy <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> and of thy <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters,</span> and the <span class=\"wl wl-kjv\" data-code=\"H5315\">lives</span> of thy <span class=\"wl wl-kjv\" data-code=\"H802\">wives,</span> and the <span class=\"wl wl-kjv\" data-code=\"H5315\">lives</span> of thy <span class=\"wl wl-kjv\" data-code=\"H6370\">concubines;</span>","6":"In that thou <span class=\"wl wl-kjv\" data-code=\"H157\">lovest</span> thine <span class=\"wl wl-kjv\" data-code=\"H8130\">enemies,</span> and <span class=\"wl wl-kjv\" data-code=\"H8130\">hatest</span> thy <span class=\"wl wl-kjv\" data-code=\"H157\">friends.</span> For thou hast <span class=\"wl wl-kjv\" data-code=\"H5046\">declared</span> this <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> that thou regardest neither <span class=\"wl wl-kjv\" data-code=\"H8269\">princes</span> nor <span class=\"wl wl-kjv\" data-code=\"H5650\">servants:</span> for this <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> I <span class=\"wl wl-kjv\" data-code=\"H3045\">perceive,</span> that <span class=\"wl wl-kjv\" data-code=\"H3863\">if</span> <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom</span> had <span class=\"wl wl-kjv\" data-code=\"H2416\">lived,</span> and all we had <span class=\"wl wl-kjv\" data-code=\"H4191\">died</span> this <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> then it had pleased thee <span class=\"wl wl-kjv\" data-code=\"H3477\">well.</span>","7":"Now therefore <span class=\"wl wl-kjv\" data-code=\"H6965\">arise,</span> go <span class=\"wl wl-kjv\" data-code=\"H3318\">forth,</span> and <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> <span class=\"wl wl-kjv\" data-code=\"H3820\">comfortably</span> unto thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servants:</span> for I <span class=\"wl wl-kjv\" data-code=\"H7650\">swear</span> by the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> if thou go not <span class=\"wl wl-kjv\" data-code=\"H3318\">forth,</span> there will not <span class=\"wl wl-kjv\" data-code=\"H3885\">tarry</span> <span class=\"wl wl-kjv\" data-code=\"H376\">one</span> with thee this <span class=\"wl wl-kjv\" data-code=\"H3915\">night:</span> and that will be <span class=\"wl wl-kjv\" data-code=\"H7489\">worse</span> unto thee than all the <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> that <span class=\"wl wl-kjv\" data-code=\"H935\">befell</span> thee from thy <span class=\"wl wl-kjv\" data-code=\"H5271\">youth</span> until now.","8":"Then the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H6965\">arose,</span> and <span class=\"wl wl-kjv\" data-code=\"H3427\">sat</span> in the <span class=\"wl wl-kjv\" data-code=\"H8179\">gate.</span> And they <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> unto all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Behold, the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> doth <span class=\"wl wl-kjv\" data-code=\"H3427\">sit</span> in the <span class=\"wl wl-kjv\" data-code=\"H8179\">gate.</span> And all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king:</span> for <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> had <span class=\"wl wl-kjv\" data-code=\"H5127\">fled</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> to his <span class=\"wl wl-kjv\" data-code=\"H168\">tent.</span>","9":"And all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> were at <span class=\"wl wl-kjv\" data-code=\"H1777\">strife</span> throughout all the <span class=\"wl wl-kjv\" data-code=\"H7626\">tribes</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> The <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H5337\">saved</span> us out of the <span class=\"wl wl-kjv\" data-code=\"H3709\">hand</span> of our <span class=\"wl wl-kjv\" data-code=\"H341\">enemies,</span> and he <span class=\"wl wl-kjv\" data-code=\"H4422\">delivered</span> us out of the <span class=\"wl wl-kjv\" data-code=\"H3709\">hand</span> of the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines;</span> and now he is <span class=\"wl wl-kjv\" data-code=\"H1272\">fled</span> out of the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> for <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom.</span>","10":"And <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom,</span> whom we <span class=\"wl wl-kjv\" data-code=\"H4886\">anointed</span> over us, is <span class=\"wl wl-kjv\" data-code=\"H4191\">dead</span> in <span class=\"wl wl-kjv\" data-code=\"H4421\">battle.</span> Now therefore why <span class=\"wl wl-kjv\" data-code=\"H2790\">speak</span> ye not a word of <span class=\"wl wl-kjv\" data-code=\"H7725\">bringing</span> ➔ the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">back?</span>","11":"And <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> to <span class=\"wl wl-kjv\" data-code=\"H6659\">Zadok</span> and to <span class=\"wl wl-kjv\" data-code=\"H54\">Abiathar</span> the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">Speak</span> unto the <span class=\"wl wl-kjv\" data-code=\"H2205\">elders</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Why are ye the <span class=\"wl wl-kjv\" data-code=\"H314\">last</span> to <span class=\"wl wl-kjv\" data-code=\"H7725\">bring</span> ➔ the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">back</span> to his <span class=\"wl wl-kjv\" data-code=\"H1004\">house?</span> seeing the <span class=\"wl wl-kjv\" data-code=\"H1697\">speech</span> of all <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> is <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> to the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> even to his <span class=\"wl wl-kjv\" data-code=\"H1004\">house.</span>","12":"Ye are my <span class=\"wl wl-kjv\" data-code=\"H251\">brethren,</span> ye are my <span class=\"wl wl-kjv\" data-code=\"H6106\">bones</span> and my <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh:</span> wherefore then are ye the <span class=\"wl wl-kjv\" data-code=\"H314\">last</span> to bring <span class=\"wl wl-kjv\" data-code=\"H7725\">back</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king?</span>","13":"And <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> ye to <span class=\"wl wl-kjv\" data-code=\"H6021\">Amasa,</span> Art thou not of my <span class=\"wl wl-kjv\" data-code=\"H6106\">bone,</span> and of my <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh?</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> so to me, and <span class=\"wl wl-kjv\" data-code=\"H3254\">more</span> also, if thou be not <span class=\"wl wl-kjv\" data-code=\"H8269\">captain</span> of the <span class=\"wl wl-kjv\" data-code=\"H6635\">host</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> me <span class=\"wl wl-kjv\" data-code=\"H3117\">continually</span> in the <span class=\"wl wl-kjv\" data-code=\"H8478\">room</span> of <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab.</span>","14":"And he <span class=\"wl wl-kjv\" data-code=\"H5186\">bowed</span> the <span class=\"wl wl-kjv\" data-code=\"H3824\">heart</span> of all the <span class=\"wl wl-kjv\" data-code=\"H376\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> even as the heart of <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H376\">man;</span> so that they <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> this word unto the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">Return</span> thou, and all thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servants.</span>","15":"So the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">returned,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to <span class=\"wl wl-kjv\" data-code=\"H3383\">Jordan.</span> And <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to <span class=\"wl wl-kjv\" data-code=\"H1537\">Gilgal,</span> to <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> to <span class=\"wl wl-kjv\" data-code=\"H7125\">meet</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> to <span class=\"wl wl-kjv\" data-code=\"H5674\">conduct</span> ➔ the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H5674\">over</span> <span class=\"wl wl-kjv\" data-code=\"H3383\">Jordan.</span>","16":"And <span class=\"wl wl-kjv\" data-code=\"H8096\">Shimei</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H1617\">Gera,</span> a <span class=\"wl wl-kjv\" data-code=\"H1145\">Benjamite,</span> which was of <span class=\"wl wl-kjv\" data-code=\"H980\">Bahurim,</span> <span class=\"wl wl-kjv\" data-code=\"H4116\">hasted</span> and came <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> with the <span class=\"wl wl-kjv\" data-code=\"H376\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> to <span class=\"wl wl-kjv\" data-code=\"H7125\">meet</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David.</span>","17":"And there were a <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> <span class=\"wl wl-kjv\" data-code=\"H376\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H1145\">Benjamin</span> with him, and <span class=\"wl wl-kjv\" data-code=\"H6717\">Ziba</span> the <span class=\"wl wl-kjv\" data-code=\"H5288\">servant</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul,</span> and his <span class=\"wl wl-kjv\" data-code=\"H2568\">fifteen</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> and his <span class=\"wl wl-kjv\" data-code=\"H6242\">twenty</span> <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> with him; and they went <span class=\"wl wl-kjv\" data-code=\"H6743\">over</span> <span class=\"wl wl-kjv\" data-code=\"H3383\">Jordan</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king.</span>","18":"And there went <span class=\"wl wl-kjv\" data-code=\"H5674\">over</span> a ferry <span class=\"wl wl-kjv\" data-code=\"H5679\">boat</span> to carry <span class=\"wl wl-kjv\" data-code=\"H5674\">over</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">household,</span> and to <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> what he <span class=\"wl wl-kjv\" data-code=\"H5869\">thought</span> <span class=\"wl wl-kjv\" data-code=\"H2896\">good.</span> And <span class=\"wl wl-kjv\" data-code=\"H8096\">Shimei</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H1617\">Gera</span> fell <span class=\"wl wl-kjv\" data-code=\"H5307\">down</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> as he was come <span class=\"wl wl-kjv\" data-code=\"H5674\">over</span> <span class=\"wl wl-kjv\" data-code=\"H3383\">Jordan;</span>","19":"And <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> Let not my <span class=\"wl wl-kjv\" data-code=\"H113\">lord</span> <span class=\"wl wl-kjv\" data-code=\"H2803\">impute</span> <span class=\"wl wl-kjv\" data-code=\"H5771\">iniquity</span> unto me, neither do thou <span class=\"wl wl-kjv\" data-code=\"H2142\">remember</span> that which thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> did <span class=\"wl wl-kjv\" data-code=\"H5753\">perversely</span> the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> that my <span class=\"wl wl-kjv\" data-code=\"H113\">lord</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> went <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> of <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> that the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> should <span class=\"wl wl-kjv\" data-code=\"H7760\">take</span> it to his <span class=\"wl wl-kjv\" data-code=\"H3820\">heart.</span>","20":"For thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> doth <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> that I have <span class=\"wl wl-kjv\" data-code=\"H2398\">sinned:</span> therefore, behold, I am <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> the <span class=\"wl wl-kjv\" data-code=\"H7223\">first</span> this <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of all the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H3130\">Joseph</span> to go <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> to <span class=\"wl wl-kjv\" data-code=\"H7125\">meet</span> my <span class=\"wl wl-kjv\" data-code=\"H113\">lord</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king.</span>","21":"But <span class=\"wl wl-kjv\" data-code=\"H52\">Abishai</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H6870\">Zeruiah</span> <span class=\"wl wl-kjv\" data-code=\"H6030\">answered</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Shall not <span class=\"wl wl-kjv\" data-code=\"H8096\">Shimei</span> be put to <span class=\"wl wl-kjv\" data-code=\"H4191\">death</span> for this, because he <span class=\"wl wl-kjv\" data-code=\"H7043\">cursed</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD'S</span> <span class=\"wl wl-kjv\" data-code=\"H4899\">anointed?</span>","22":"And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> What have I to do with you, ye <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H6870\">Zeruiah,</span> that ye should this <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> be <span class=\"wl wl-kjv\" data-code=\"H7854\">adversaries</span> unto me? shall there any <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> be put to <span class=\"wl wl-kjv\" data-code=\"H4191\">death</span> this <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> in <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel?</span> for do not I <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> that I am this <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> over <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel?</span>","23":"Therefore the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H8096\">Shimei,</span> Thou shalt not <span class=\"wl wl-kjv\" data-code=\"H4191\">die.</span> And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H7650\">sware</span> unto him.","24":"And <span class=\"wl wl-kjv\" data-code=\"H4648\">Mephibosheth</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> came <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> to <span class=\"wl wl-kjv\" data-code=\"H7125\">meet</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> and had <span class=\"wl wl-kjv\" data-code=\"H3808\">neither</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">dressed</span> his <span class=\"wl wl-kjv\" data-code=\"H7272\">feet,</span> nor <span class=\"wl wl-kjv\" data-code=\"H6213\">trimmed</span> his <span class=\"wl wl-kjv\" data-code=\"H8222\">beard,</span> nor <span class=\"wl wl-kjv\" data-code=\"H3526\">washed</span> his <span class=\"wl wl-kjv\" data-code=\"H899\">clothes,</span> from the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">departed</span> until the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> he <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> again in <span class=\"wl wl-kjv\" data-code=\"H7965\">peace.</span>","25":"And it came to pass, when he was <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> to <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> to <span class=\"wl wl-kjv\" data-code=\"H7125\">meet</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> that the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, Wherefore <span class=\"wl wl-kjv\" data-code=\"H1980\">wentest</span> not thou with me, <span class=\"wl wl-kjv\" data-code=\"H4648\">Mephibosheth?</span>","26":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">answered,</span> My <span class=\"wl wl-kjv\" data-code=\"H113\">lord,</span> O <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> my <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> <span class=\"wl wl-kjv\" data-code=\"H7411\">deceived</span> me: for thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> I will <span class=\"wl wl-kjv\" data-code=\"H2280\">saddle</span> me an <span class=\"wl wl-kjv\" data-code=\"H2543\">ass,</span> that I may <span class=\"wl wl-kjv\" data-code=\"H7392\">ride</span> thereon, and <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> to the <span class=\"wl wl-kjv\" data-code=\"H4428\">king;</span> because thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> is <span class=\"wl wl-kjv\" data-code=\"H6455\">lame.</span>","27":"And he hath <span class=\"wl wl-kjv\" data-code=\"H7270\">slandered</span> thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> unto my <span class=\"wl wl-kjv\" data-code=\"H113\">lord</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king;</span> but my <span class=\"wl wl-kjv\" data-code=\"H113\">lord</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> is as an <span class=\"wl wl-kjv\" data-code=\"H4397\">angel</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God:</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> therefore what is <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> in thine <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes.</span>","28":"For all of my <span class=\"wl wl-kjv\" data-code=\"H1\">father's</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> were <span class=\"wl wl-kjv\" data-code=\"H3808\">but</span> <span class=\"wl wl-kjv\" data-code=\"H4194\">dead</span> <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> before my <span class=\"wl wl-kjv\" data-code=\"H113\">lord</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king:</span> yet didst thou <span class=\"wl wl-kjv\" data-code=\"H7896\">set</span> thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> among them that did <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> at thine own <span class=\"wl wl-kjv\" data-code=\"H7979\">table.</span> What <span class=\"wl wl-kjv\" data-code=\"H6666\">right</span> therefore <span class=\"wl wl-kjv\" data-code=\"H3426\">have</span> I yet to <span class=\"w Anders, als hij overgevaren was, of overvaren zou."}],"19":[{"catchword":"zich ter harte zoude nemen","tekst":"Dat is, daarop letten, en mij naar mijn verdienste doen straffen. Hebreeuws, in, of aan zijn hart stellen."}],"20":[{"catchword":"uw knecht","tekst":"Dat is, ik weet."},{"catchword":"van Jozef,","tekst":"Hierdoor verstaat hij niet alleen Efraïm en Manasse, maar ook Benjamin, [uit welken stam hij was, vs.16] omdat Jozef en Benjamin volle broeders waren van één vader en één moeder, zodat ook Benjamin onder de banier van Efraïm optoog, Num 10:22-24. Sommigen verstaan dat hij wil zeggen: Hij is eerder gekomen dan iemand van de tien stammen, of Efraïm en Manasse, doch het schijnt dat hier door het huis Jozefs in het algemeen verstaan worden de Israëlieten, tegengesteld tegen den stam van Juda."}],"21":[{"catchword":"hiervoor","tekst":"Omdat hij om genade bidt, en den koning aldus tegemoet gekomen is."},{"catchword":"gezalfde des HEEREN","tekst":"Vergelijk 1Sa 24:7. Van Davids zalving ten koning, 2Sa 5:2."}],"22":[{"catchword":"Wat heb ik","tekst":"Zie boven, 2Sa 16:10."},{"catchword":"satan zoudt zijn?","tekst":"Dat is, wederpartijder; tegenstrijder, die mij hinderlijk is en tegenvalt in mijn voornemen, Mat 16:23. Zie wijders Job 1:6."},{"catchword":"gedood worden in Israël?","tekst":"Vergelijk 1Sa 11:13."},{"catchword":"heden","tekst":"Hij wil zeggen, wederom als van nieuw, enz."}],"23":[{"catchword":"niet sterven","tekst":"Versta, heden, en voorts gedurende mijn regering zal ik u niet doen straffen. Dewijl nochtans Simeï's misdaad zeer ergerlijk en grof was, ook het algemeen merkelijk rakende, zo heeft David niet gewild dat hij ten enenmale of voor altoos ongestraft zou blijven. Zie 1Ki 2:8-9."}],"24":[{"catchword":"zoon,","tekst":"Dat is, kindskind. Want Mefiboseth was Jonathans zoon, boven, 2Sa 9:3, 2Sa 9:6, enz."},{"catchword":"voeten","tekst":"Hebreeuws, had zijn voeten niet gemaakt noch zijn knevelbaard gemaakt; dat is, [gelijk dit woord dikwijls elders genomen wordt] toegemaakt, bereid, toegeschikt. Vergelijk inzonderheid Deu 21:12. Dit waren alle tekenen van grote droefheid en rouw, die Mefiboseth had over Davids ongeluk, die hem zoveel goeds gedaan had. Vergelijk boven, 2Sa 12:20."},{"catchword":"weggegaan,","tekst":"Van Jeruzalem, vluchtende voor Absalom."}],"25":[{"catchword":"Jeruzalem","tekst":"Nadat de koning binnen Jeruzalem gekomen was. Het schijnt dat hij onderweg geen gelegenheid gehad heeft, of zich ontzien heeft den koning aan te spreken. Anders, als Jeruzalem [dat is, de inwoners van Jeruzalem] den koning tegemoet kwam, waaronder zich Mefiboseth mede gevoegd heeft, om den koning aan de Jordaan te ontmoeten."}],"26":[{"catchword":"mijn knecht","tekst":"Ziba."}],"27":[{"catchword":"valselijk aangedragen;","tekst":"Zie boven, 2Sa 16:3."},{"catchword":"engel Gods;","tekst":"Gelijk boven, 2Sa 14:17."}],"28":[{"catchword":"vaders huis","tekst":"Dat is, van mijn grootvader Saul."},{"catchword":"maar lieden des doods","tekst":"Dat is, die allen den dood verdiend hadden. Vergelijk Gen 20:3; 2Sa 12:5."},{"catchword":"tafel eten;","tekst":"Zie boven, 2Sa 9:7, 2Sa 9:10, 2Sa 9:13."},{"catchword":"roepen aan den koning?","tekst":"Te klagen over het onrecht, dat mij mijn knecht gedaan heeft."}],"29":[{"catchword":"heb gezegd","tekst":"Te weten, toen mij voorkwam dat Ziba u ongelijk had gedaan; of ik zeg; dat is, verordineer en beveel. Zoveel had Ziba met zijn praktijken bij dezen, anderszins zeer wijzen koning, uitgericht, dat hij een verering bekomt, inplaats dat hij vanwege zijn schandelijke ontrouw aan Mefiboseth bewezen, en leugentaal, waarmede hij den koning had bedrogen, verdiend had gestraft te worden."}],"30":[{"catchword":"naardien","tekst":"Alsof hij zeide: Het is mij genoeg, dat het gemeen wel gaat. Aan mijn particulier is weinig gelegen; of, die schade zal ik door overdenking van het algemene welvaren geduldiglijk opnemen."}],"31":[{"catchword":"Barzillai,","tekst":"Zie boven, 2Sa 17:27, en 1Ki 2:7."},{"catchword":"kwam ook af","tekst":"Eer de koning over de Jordaan toog."}],"32":[{"catchword":"man van tachtig jaren;","tekst":"Hebreeuws, een zoon"},{"catchword":"groot man","tekst":"Van vermogen of middelen; gelijk 1Sa 25:2."}],"34":[{"catchword":"Hoe veel","tekst":"Alsof hij zeide: Ik heb toch maar weinig tijds te leven, waartoe dan de moeite?"}],"35":[{"catchword":"tachtig jaren oud;","tekst":"Hebreeuws, een zoon van tachtig jaar"},{"catchword":"zou ik kunnen onderscheiden","tekst":"Hij wil zeggen dat hij te oud is om in zulks alles vermaak te nemen, dat het hem beter paste bij zijn graf te zijn en tot zijn sterfdag zich te bereiden."}],"36":[{"catchword":"zulk een vergelding doen?","tekst":"Voor een kleine weldaad zo grote vergelding."}],"37":[{"catchword":"Chimham,","tekst":"Onder, vs.40, genoemd Chimham, een van Barzillai's zonen, gelijk afgenomen wordt uit 1Ki 2:7."}],"38":[{"catchword":"uw ogen;","tekst":"Dat u aangenaam en welgevallig zal mogen zijn."},{"catchword":"begeren zult,","tekst":"Hebreeuws, verkiezen zult; te weten, om van mij te begeren, of wat u believen, behagen zal, wat u lief en aangenaam zal zijn. Zie boven, 2Sa 15:15."}],"39":[{"catchword":"overgegaan,","tekst":"Met de schouw; gelijk vs.18."},{"catchword":"kuste de koning Barzillai,","tekst":"Nemende van hem afscheid, met dankzegging en wensing alles goeds. Zie Gen 29:11."},{"catchword":"hij weder naar zijn plaats","tekst":"Barzillai keerde weder naar Rogelim."}],"40":[{"catchword":"had den koning overgevoerd,","tekst":"Of, geleidde den koning; en alzo in vs.41."},{"catchword":"een gedeelte","tekst":"Hebreeuws, de helft; hetwelk altemet voor een gedeelte genomen wordt."},{"catchword":"Israëls","tekst":"Dat is, der andere stammen."}],"41":[{"catchword":"gestolen,","tekst":"Dat is, als steelsgewijze, zonder ons te ontbieden, alleen geleid."},{"catchword":"gevoerd,","tekst":"Of, gevoerd? Alle mannen Davids nu [waren] bij hem; te weten, bij den koning, die al zijn officieren en krijgslieden bij zich had."},{"catchword":"met hem?","tekst":"Dat is, Davids officieren en krijgslieden waren allen met David, en hielden het met die van Juda, die David zelf daartoe bewogen had, boven vs.11, 12, 14. Hierom spraken die van Juda te stouter."}],"42":[{"catchword":"ons na verwant is;","tekst":"Hebreeuws, mij; te weten, den stam van Juda."},{"catchword":"Hebben wij dan","tekst":"Zij willen zeggen: Meent gij dat de koning ons daartoe gekocht heeft door goede beloften of geschenken?"},{"catchword":"enigszins gegeten","tekst":"Hebreeuws, etende gegeten"},{"catchword":"konings kost,","tekst":"Hebreeuws, van den koning."}],"43":[{"catchword":"Wij hebben","tekst":"Hebreeuws, ik; te weten, Israël; en alzo in het volgende."},{"catchword":"tien delen","tekst":"Hebreeuws, handen. Dit zeggen zij omdat zij tien stammen waren, en overzulks tien stemmen hadden."},{"catchword":"koning,","tekst":"Dat is, aan den koning in het algemeen, of aan het koninkrijk, en ook aan dezen koning David, dien wij met onzen algemene stemmen gekozen hebben; 2Sa 5:1."},{"catchword":"ons woord","tekst":"Dat is, dat wij niet de voorstemming en den voortocht gehad hebben in deze zaak."},{"catchword":"harder","tekst":"Dat is, sterker, krachtiger, zulks dat die van Israël tegen hen niet konden opkomen, maar moesten aflaten."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"And it was told Joab: Behold, the King weepeth, and mourneth for Absalom."}],"2":[{"catchword":null,"tekst":"Then the deliverance [Or, Salvation, Conquest, Victory] became that day mourning unto all the people [i.e. The joy which the people should have shewed for the Victory, was turned into sorrow and mourning] for the people had heard say that day; It grieveth the King for his son. [or, the King is very much grieved.]"}],"3":[{"catchword":null,"tekst":"And the people came that day by stealth [Heb. The people stole themselves to come, or, coming] into the city: [viz. Mahanaim] according as people steal away, that are ashamed, when they fled in battle."}],"4":[{"catchword":null,"tekst":"Now the King had his face wound about, [Or, covered. In token of great mourning: see above chap.15. on v.30.] and the King cried with a loud voice: My son Absalom, Absalom my son, my son! [see above chap.18.on v.33.]"}],"5":[{"catchword":null,"tekst":"Then Joab came into the house to the King, and said; Thou hast shamed this day the face of all thy servants, which have this day freed thy soul, [Tha is here, thy life, or person, as elsewhere often] and the soul of thy sons, and of thy daughters, and the soul of thy wives, and the soul of thy concubines."}],"6":[{"catchword":null,"tekst":"Loving them that hate thee, and hating them that love thee: for thou declares this day, that Commanders and servants are nothing with thee; for this day I perceive, that if Absalom lived, and all we were dead this day, that it would then be right in thine eyes."}],"7":[{"catchword":null,"tekst":"Now then arise, go forth, and speak to the heart of thy servants: [See gen.34.on ver.3.] for I swear by the LORD, when thou goest not forth, if there overnight one man with thee this night! [Understand with all, then God do this and that to me; kind of oath as often] and this will be worse unto thee, then all the evil that hath befallen thee from youth, until now."}],"8":[{"catchword":null,"tekst":"Then the King arose, and sat himself (down) in the gate: and they let all the people know saying: Behold the King sitteth in the gate: Then all the people came before the Kings face, but Israel [viz. who had followed Absalom] was fled, every man to his tents. [i.e. dweilling places.]"}],"9":[{"catchword":null,"tekst":"And all the people, in all tribes of Israel, were contending among themselves, [With sorrow and shame condemning themselves] saying; The King hath delivered us from the hand of our enemies, and he hath freed us from the hand of the Philistines, and now he is fled out of the Land from Absalom!"}],"10":[{"catchword":null,"tekst":"And Absalom, whom we had anointed over us, [i.e. Whom we had chosen to be King, and intended to cause him to be anointed] is dead in the battle: Now then, why do ye hold your peace [or, are still quiet: see Judg.18.on verse 9.] of bringing the King [viz. David, our lawful and bountiful King] back."}],"11":[{"catchword":null,"tekst":"Then King David sent to Zadok, and to Abiathar, the Priests, saying; [i.e. To send word to them] speak unto the Eldest of Juda, saying: Why should ye be the last, to bring the King back into his house? [i.e. into the Royal Court or Palace at Jerusalem] (for the speech of all Israel [related in the former verses] was come to the King in his house.) [viz. at Mahanaim.]"}],"12":[{"catchword":null,"tekst":"Ye are my brethren, ye are my bone and my flesh. [See above chap.5.on v.1. so in the following verse] Why then should ye be the last to bring back the King?"}],"13":[{"catchword":null,"tekst":"And ye [Priests, Zadok and Abiathar] shall say unto Amasa; Art thou not my bone and my flesh? [For he was David&acirc;&euro;&trade;s sister son: see above chap.17.on v 25.] Let God do so to me, and let him so add thereunto, [Of such kind of swearing, see Ruth 1.on v.17.& 1 King.19on v.2.] if thou shalt not be chief Commander before my face, all days, in Joabs room. [see above chap.3.on verse 39.]"}],"14":[{"catchword":null,"tekst":"So he [viz. David; some apply it to Amasa] bowed the heart of all the men of Juda, as of one man; [That they were so unanimous, of one accord, as one man: see Judg.20.on v.1.] and they sent forth to the King, (saying); Return, and thou and all thy servants."}],"15":[{"catchword":null,"tekst":"Then the King returned, and came to Jordan; and Juda came to Gilgal, to go to meet the King, to conduct the King over the Jordan."}],"16":[{"catchword":null,"tekst":"And Simei, the son of Gera, a son of Jemini, [i.e. a Benjamite: see above chap 16.on v.11.] which was of Bahurim [see above chap 3.on verse 16. & chap.16.5.] made haste, and came down with the men of Juda, to meet King David."}],"17":[{"catchword":null,"tekst":"And a thousand men of Benjamin with him; also Ziba the servant [Heb. Lad: so above chap.2.9.on vers.1. & chap.16.1, &c. This man feared that David would come to know (as indeed he did) of his deceitful dealing with Mephiboseth: therefore he sought by this serviceableness of his to mollisie and soften the Kings heart against it, by way of prevention; which also happened unto him] of the house of Saul, and his fifteen sons, and his twenty servants [as above chap.9.10.] with him; and they went readily over the Jordan, [or, they made the Jordan ready; i.e. they made all things fit and ready for the King his household, to pass over] before the King. [i.e. before the King was come to the Ferry of Jordan, to pass over, they were all got over, and had got all things ready.]"}],"18":[{"catchword":null,"tekst":"Now when the Wherry [Or, Hulk, Ferry-boat] went over, to fetch over the Kings house, [i.e. the King with his household] and do that which was good in his eyes; then Simei, the son of Gera, fell down before the Kings face, when he went over the Jordan: [Oth. when he was come over, or, should go over.]"}],"19":[{"catchword":null,"tekst":"And he said unto the King; Let not my Lord impute the iniquity unto me, neither remember, what thy servant did perversely that day, when my Lord the King went out Jerusalem, that the King should take it to heart. [i.e. Regard it, mind it, and cause me to be punished according to my desert. Heb. put it in, or, to his heart.]"}],"20":[{"catchword":null,"tekst":"For thy servant [i.e. I] Knoweth assuredly, (that) I have sinned: but be hold, I am come this day the first of all the house of Joseph, [Hereby he understandeth not onely Ephraim and Manasseh, but also Benjamin (of which tribe he was, ver.16.) because Joseph and Benjamin were entire brethren, both of one father and mother; so that Benjamin also marched up under the standard of Ephraim, Num 10:22, 23, 24. Some understand, that he would say, that he came sooner then any man of the ten tribes, or Ephraim and Manasseh; but it seemeth that here by the house of Joseph, are meant the Israelites in general, opposed to the house of Juda] to go down to meet my Lord the King."}],"21":[{"catchword":null,"tekst":"Then Abisai, the son of Zeruja, answered, and said; should then Simei not be put to death for this? [That he sueth for mercy, and is come to meet the King] seeing he hath cursed the LORDS anointed. [Compare 1 Sam.24.7. of David&acirc;&euro;&trade;s anointing King, see 2 Sam.5.on v.3.]"}],"22":[{"catchword":null,"tekst":"But David said; What have I to do with you, [See above chap.16.on ver.10.] ye sons of Zeruja, that ye should this day be Sathan [i.e. adversary, oppose, that hiners me, and crosseth me in mine intent and purpose; compare Mat 16:23. see further, Job 1.on verse 6.] should any man be put to death this day in Israel? [compare 1 Sam.11.13.] for do not I know, that I am this day made King over Israel? [as if he should say again, as it were a new, &c.]"}],"23":[{"catchword":null,"tekst":"And the King said unto Simei, Thou shalt not die: [Meaning this day, and so on ward during my reign, I will not cause thee to be punished: yet in regard Simei&acirc;&euro;&trade;s fault was very scandalous and gross, and did likewise much concern the Publike, therefore David would not that he should altogether, or forever go unpunished: see 1 King.2.9, 10.] and the King sware unto him."}],"24":[{"catchword":null,"tekst":"Mephiboseth, the son of Saul, [i.e. His Grandchild. For Mephiboseth was Jonathans son, above chap. 9 3, 6, &c.] came also down to meet the King: and he had not made his feet clean, nor shaved his muchato-beard, that is, (as this word elsewhere is often taken) dressed himself, sitted, or ordered. Compare especially Deut.21.on ver.12.] nor washed his clothes, [these were all tokens of great grief and sorrow, that Mephiboseth took at David&acirc;&euro;&trade;s misfortune, who had done him so much good. Compare above chap.12.20.] from that day, that the King was departed, [viz. from Jerusalem, fleeing from Absalom] until that day that he came again in peace."}],"25":[{"catchword":null,"tekst":"And it came to pass, when he cane to Jerusalem to meet the King, [After the King was come into Jerusalem: It seemeth he found no opportunity by the way, or was afraid to speak to the King. Oth. when Jerusalem (that is, the inhabitants of Jerusalem) came to meet the King, among whom Mephiboseth joined himself, to meet the King at the Jordan] that the King said unto him; Wherefore wentest not thou with me, Mephiboseth?"}],"26":[{"catchword":null,"tekst":"And he said; My Lord (O) King, my servant [viz. Ziba] deceived me: for thy servant said; I will saddle me an ass, and ride thereon, and go to the King, for thy servant is cripple."}],"27":[{"catchword":null,"tekst":"Beside, he hath falsly accused thy servant unto my Lord the King: [See above chap.16.3.] but my Lord the King is as an Angel of God; [as above chap.14.17.] do then that which is good in thine eyes."}],"28":[{"catchword":null,"tekst":"For all my Fathers [i.e. My Grand father Sauls] house was nothing, but as men of death [i.e. they had all deserved death: compare Gen.20.on ver.3. &2 Sam. 12.on ver.5.] before my Lord the King, yet thou didst set thy servant among them that eat at thy table: [see above chap.9.7, 10, 13.] what have I then more to cry for justice unto the King? [to complain of the wrong that my servant hath done me.]"}],"29":[{"catchword":null,"tekst":"Then said the King unto him; Why speakest thou more (of) thy matters? I have said; [viz. When I called to mind, that Ziba had done thee wrong: or I say, that is, ordain, and appoint. So much had Ziba by his cunning plots and devices prevailed with this, otherwise most wise King, that he obtained a reward or gratuity, in stead of a punishment, which he had most justly deserved, by reason of his shameful unfaithfulness shewed towards Mephiboseth, and his lying and falsehood whereby he had consented and cheated the King] Thou and Ziba divided the Land."}],"30":[{"catchword":null,"tekst":"And Mephiboseth said unto the King; Let him also take all away: forasmuch as my Lord the King is come in peace into his (own) house. [As if he had said, It sufficeth me, that the publick thriveth: As for mine own particular, I weigh it not; or, I&acirc;&euro;&trade;ll bear that loss patiently, considering the Public prospereth so well]"}],"31":[{"catchword":null,"tekst":"Barzillai the Gileadite [See above chap.17.27. and 1 Kings 2.7.] came down also from Rogelim; [Before the King passed over the Jordan] and he went with the King over the Jordan, to conduct him over the Jordan."}],"32":[{"catchword":null,"tekst":"Now Barzillai was very old, a man [Heb. a son] of fourscore years: and he had sustained the King, when he abode at Mahanaim; for he was a very great man. [In power or means. As 1 Sam.25.2.]"}],"33":[{"catchword":null,"tekst":"And the King said unto Barzillai, come thou over with me, and I wil sustain thee with me at Jerusalem."}],"34":[{"catchword":null,"tekst":"But Barzillai said unto the King. How many will the days of the years of my life be, that I should go up with the King to Jerusalem? [As if he had said: I have now but a little time to live, why then should I undergo that troubled?]"}],"35":[{"catchword":null,"tekst":"I am this day fourscore years old; [Heb. a son of fourscore years] should I be able to distinguish between good and evil? Should thy servant be able to taste what I eat, and what I drink? Should I be able to hearken (any) more to the voice of singing-men, and singing-women? and why should thy servant be (any) more a burden unto my Lord the King? [Intimating that he was too old, to take delight in all those things; that it besitted him better to be hear his grave, and to prepare himself for his dying day]"}],"36":[{"catchword":null,"tekst":"Thy servant shall // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);

});
