vloekte: Ga weg, ga weg, man van bloed, en man van Belial!", "Richt 9:23": "zond God een boze geest tussen Abimelech en de burgers van Sichem; en de burgers van Sichem handelden trouweloos tegen Abimelech;", "1 Tess 5:26": "Groet al de broeders met een heilige kus.", "Ex 21:17-20": "Wie ook zijn vader of zijn moeder vervloekt, die zal zeker gedood worden. En wanneer mannen ruzie hebben, en de een slaat de ander met een steen of met een vuist, en hij sterft niet, maar moet het bed houden; als hij weer opstaat en op straat gaat met behulp van zijn stok, zal hij die hem sloeg, onschuldig zijn; alleen zal hij vergoeden wat de ander door verzuim verloren heeft, en hij zal hem volledig laten helen.", "Job 1:3": "Daartoe had hij zeven duizend schapen, en drie duizend kamelen, en vijfhonderd juk ossen, en vijfhonderd ezelinnen; ook had hij zeer veel dienstvolk; zodat deze man groter was dan al die van het oosten.", "2 Sam 16:4": "Zo zei de koning tegen Ziba: Zie, alles wat Mefiboseth heeft, zal van u zijn. En Ziba zei: Ik buig mij neer, laat mij genade vinden in uw ogen, mijn heer koning!", "Neh 9:27": "Daarom hebt U hen gegeven in de hand van hun belagers, die hen benauwd hebben; maar toen zij in de tijd van hun benauwdheid tot U riepen, hebt U vanuit de hemel gehoord, en hun naar Uw grote barmhartigheden verlossers gegeven, die hen uit de hand van hun belagers verlosten.", "Jes 16:5": "Want er zal een troon bevestigd worden in goedertierenheid, en daarop zal iemand betrouwbaar zitten in de tent van David, iemand die oordeelt en het recht zoekt, en vaardig is tot gerechtigheid.", "1 Kron 15:16-22": "En David zei tegen de leiders van de Levieten, dat zij hun broeders, de zangers, moesten aanstellen met muziekinstrumenten, met luiten, en harpen, en cimbalen, zodat zij zich lieten horen, terwijl zij de stem verhieven met blijdschap. Zo stelden de Levieten Heman aan, de zoon van Joël, en uit zijn broeders Asaf, de zoon van Berechja; en uit de zonen van Merari, hun broeders, Ethan, de zoon van Kusaja; En met hen hun broeders van de tweede orde: Zecharja, Ben en Jaaziel, en Semiramoth, en Jehiel, en Unni, Eliab, en Benaja, en Maaseja, en Mattithja, en Elifele, en Mikneja, en Obed-edom, en Jeiel, de poortwachters.", "2 Sam 19:11-15": "Toen zond koning David een bericht naar Zadok en naar Abjathar, de priesters, en zei: Spreek tegen de oudsten van Juda: Waarom zouden jullie de laatsten zijn om de koning terug te halen naar zijn huis? (Want wat er in heel Israël gezegd werd, was de koning ter ore gekomen in zijn huis.) U bent mijn broeders; mijn gebeente en mijn vlees bent u; waarom zouden jullie dan de laatsten zijn om de koning terug te halen? En tegen Amasa moet u zeggen: Bent u niet mijn gebeente en mijn vlees? God doe mij zo, en meer dan dat, als u niet legeraanvoerder wordt voor mijn aangezicht, alle dagen, in de plaats van Joab.", "Fil 2:3": "Doe niets uit twist of ijdele eer, maar acht door ootmoedigheid de een de ander voortreffelijker dan uzelf.", "2 Sam 8:16": "Joab nu, de zoon van Zeruja, was over het leger; en Josafat, zoon van Achilud, was kanselier.", "Spr 15:1": "Een zacht antwoord keert de grimmigheid af; maar een smartend woord doet de toorn oprijzen.", "Luk 15:20": "En hij stond op en ging naar zijn vader. En toen hij nog ver van hem verwijderd was, zag zijn vader hem, en werd innerlijk met ontferming bewogen; en hij liep hem tegemoet, viel hem om de hals, en kuste hem.", "2 Sam 16:13": "Zo ging David met zijn mannen op de weg; en Simeï liep al voortgaand langs de kant van de berg tegenover hem, en vloekte, en gooide met stenen van tegenover hem, en wierp stof op.", "2 Sam 19:41-42": "En zie, alle mannen van Israël kwamen naar de koning; en zij zeiden tegen de koning: Waarom hebben onze broeders, de mannen van Juda, u gestolen, en hebben zij de koning en zijn huis over de Jordaan gebracht, en alle mannen van David met hem? Toen antwoordden alle mannen van Juda de mannen van Israël: Omdat de koning ons nauw verwant is; en waarom zijn jullie nu boos over deze zaak? Hebben wij dan ook maar iets gegeten op kosten van de koning, of heeft hij ons een geschenk gegeven?", "2 Sam 5:1": "Toen kwamen alle stammen van Israël naar David in Hebron, en zij zeiden: Zie, wij zijn uw gebeente en uw vlees.", "Ex 20:16": "U zult geen valse getuigenis spreken tegen uw naaste.", "2 Sam 19:16-23": "En Simeï, de zoon van Gera, een Benjaminiet, die uit Bahurim was, haastte zich, en kwam met de mannen van Juda naar beneden, koning David tegemoet; En duizend man van Benjamin met hem; ook Ziba, de knecht van Sauls huis, en zijn vijftien zonen en zijn twintig knechten met hem; en zij trokken vaardig de Jordaan over, voor de koning uit. Toen het veer overstak, om het huis van de koning over te brengen, en te doen wat goed was in zijn ogen, viel Simeï, de zoon van Gera, neer voor het gezicht van de koning, toen hij de Jordaan overstak;", "Jes 30:29": "Er zal een lofzang bij u zijn, zoals in de nacht wanneer het feest geheiligd wordt; en blijdschap van het hart, zoals van iemand die met pijpen wandelt, om te komen tot de berg van de HEERE, tot de Rotssteen van Israël.", "Hand 21:5": "Toen het nu gebeurde dat wij deze dagen hadden doorgebracht, gingen wij weg en reisden verder; en zij begeleidden ons allen, met vrouwen en kinderen, tot buiten de stad; en wij knielden neer aan de oever en baden.", "Richt 9:2": "Spreekt toch ten aanhoren van alle burgers van Sichem: Wat is voor u beter, dat zeventig mannen, allemaal zonen van Jerubbaäl, over u heersen, of dat één man over u heerst? Bedenkt ook dat ik uw eigen vlees en bloed ben.", "1 Sam 16:12": "Toen stuurde hij iemand, en liet hem komen; hij nu was roodachtig, en had daarbij mooie ogen en een knap voorkomen; en de HEERE zei: Sta op, zalf hem, want deze is het.", "2 Sam 24:3": "Toen zei Joab tegen de koning: Laat de HEERE, uw God, aan dit volk, hoeveel het er ook mogen zijn, honderdmaal meer toevoegen, zodat de ogen van mijn heer de koning het mogen aanzien; maar waarom heeft mijn heer de koning zin in deze zaak?", "Hand 16:25": "En omtrent middernacht baden Paulus en Silas en zongen lofzangen voor God; en de gevangenen luisterden naar hen.", "Gen 25:7": "Dit nu zijn de dagen van de jaren van het leven van Abraham, die hij geleefd heeft: honderdvijfenzeventig jaar.", "1 Kron 22:6": "Toen riep hij zijn zoon Salomo, en gebood hem voor de HEERE, de God van Israël, een huis te bouwen.", "Richt 11:34": "Toen Jeftha nu bij Mizpa bij zijn huis kwam, zie, zo kwam zijn dochter hem tegemoet, met trommels en met reidansen. Zij was zijn enige kind; hij had verder geen zoon of dochter.", "Ps 68:33-36": "U koninkrijken van de aarde, zingt voor God; zingt psalmen voor de Heere! Sela. Voor Hem, Die daar rijdt in de hemel der hemelen, Die er van oudsher is; zie, Hij geeft Zijn stem, een stem van sterkte. Geeft God sterkte! Zijn hoogheid is over Israël, en Zijn sterkte in de bovenste wolken.", "Luk 2:30": "want mijn ogen hebben Uw zaligheid gezien,", "Gen 31:27": "Waarom bent u heimelijk gevlucht, en hebt u zich aan mij ontstolen? En hebt u het mij niet verteld, zodat ik u had kunnen wegzenden met vreugde, en met gezangen, met tamboerijn en met harp?", "Ps 18:48": "De God, Die mij volkomen wraak geeft, en de volken onder mij brengt;", "Ps 98:1-8": "Een psalm. Zingt de HEERE een nieuw lied; want Hij heeft wonderen gedaan; Zijn rechterhand, en de arm van Zijn heiligheid, heeft Hem heil gegeven. De HEERE heeft Zijn heil bekendgemaakt; Hij heeft Zijn gerechtigheid geopenbaard voor de ogen van de heidenen. Hij is gedachtig geweest aan Zijn goedertierenheid en Zijn waarheid aan het huis van Israël; en alle einden van de aarde hebben het heil van onze God gezien.", "Gen 45:15": "En hij kuste al zijn broers, en hij weende over hen; en daarna spraken zijn broers met hem.", "2 Sam 17:27-29": "En het gebeurde, toen David te Mahanaïm gekomen was, dat Sobi, de zoon van Nahas, uit Rabba van de kinderen van Ammon, en Machir, de zoon van Ammiël, uit Lodebar, en Barzillai, de Gileadiet, uit Rogelim, Beddengoed, en schalen, en aarden vaten, en tarwe, en gerst, en meel, en geroosterd koren, en bonen, en linzen, ook geroosterd, En honing, en boter, en schapen, en koeienkaas, brachten naar David, en naar het volk dat bij hem was, om te eten, want zij zeiden: Dit volk is hongerig, en moe, en dorstig in de woestijn.", "Gen 50:1": "Toen viel Jozef op het gezicht van zijn vader, en hij weende over hem, en kuste hem.", "Job 2:4": "Toen antwoordde de satan de HEERE en zei: Huid voor huid, en alles wat iemand heeft, zal hij geven voor zijn leven.", "2 Sam 15:12": "Absalom zond ook om Achitofel, de Giloniet, Davids raadsman, te halen uit zijn stad, uit Gilo, terwijl hij offers bracht. En de samenzwering werd sterk, en het volk kwam gestaag toe en werd meer bij Absalom.", "Richt 3:15": "Toen riepen de kinderen van Israël tot de HEERE, en de HEERE verwekte hun een verlosser, Ehud, de zoon van Gera, een zoon van Jemini, een man die links was. En de kinderen van Israël zonden door zijn hand een geschenk aan Eglon, de koning van de Moabieten.", "Gen 47:30": "maar laat ik bij mijn vaderen liggen; daarom zult u mij uit Egypte wegvoeren en mij in hun graf begraven. En hij zei: Ik zal doen naar uw woord!", "Gal 5:26": "Laten wij niet zoeken naar ijdele eer, elkaar tergen, elkaar benijden.", "2 Sam 20:6": "Toen zei David tegen Abisai: Nu zal Seba, de zoon van Bichri, ons meer kwaad doen dan Absalom; neem u de knechten van uw heer, en jaag hem achterna, opdat hij niet misschien vaste steden voor zich vindt, en zich aan onze ogen onttrekt.", "2 Sam 18:14": "Toen zei Joab: Ik zal hier zo niet langer bij u blijven wachten; en hij nam drie pijlen in zijn hand, en stak ze in het hart van Absalom, terwijl hij nog leefde, midden in de eik.", "2 Sam 1:14": "En David zei tegen hem: Hoe hebt u niet gevreesd uw hand uit te strekken om de gezalfde van de HEERE te doden?", "Hos 4:15-17": "Als u, Israël! wilt hoereren, laat Juda dan zeker niet schuldig worden; kom toch niet naar Gilgal, en ga niet op naar Beth-Aven, en zweer niet: Zo waarachtig als de Heere leeft. Want Israël is koppig, als een koppige koe; nu zal de Heere hen weiden, als een lam in de ruimte. Efraïm is met de afgoden verbonden; laat hem begaan.", "Matt 8:29": "En zie, zij riepen: Jezus, Zoon van God, wat hebben wij met U te maken? Bent U hier gekomen om ons te pijnigen vóór de tijd?", "Joh 7:5": "Want ook Zijn broers geloofden niet in Hem.", "Ps 105:2": "Zingt Hem, zingt Hem psalmen, spreekt met aandacht van al Zijn wonderen.", "Ps 81:2-4": "Zingt vrolijk voor God, onze Sterkte; juicht voor de God van Jakob. Heft een psalm op, en geeft de trommel; de liefelijke harp met de luit. Blaast de bazuin in de nieuwe maan, op de bestemde tijd, op onze feestdag.", "1 Kon 12:20": "En het gebeurde, toen heel Israël hoorde dat Jerobeam teruggekomen was, dat zij heen zonden en hem in de vergadering riepen, en hem over heel Israël koning maakten; niemand volgde het huis van David, dan de stam van Juda alleen.", "1 Kron 15:11": "En David riep de priesters Zadok en Abjathar, en de Levieten Uriël, Asaja en Joël, Semaja, en Eliël, en Amminadab.", "2 Sam 14:33": "Toen ging Joab naar de koning, en vertelde het hem. Toen riep hij Absalom, en hij kwam bij de koning, en boog zich voor hem op zijn gezicht ter aarde, voor het aangezicht van de koning; en de koning kuste Absalom.", "1 Kon 2:9": "Maar nu, houd hem niet onschuldig, omdat u een wijs man bent; en u zult weten wat u hem moet doen, opdat u zijn grijze hoofd met bloed naar het graf laat afdalen.", "2 Sam 8:10": "zond Thoi zijn zoon Joram naar de koning David om hem naar zijn welstand te vragen, en om hem te zegenen, omdat hij tegen Hadad-Ezer had gevochten en hem geslagen had (want Hadad-Ezer voerde steeds oorlog tegen Thoi); en in zijn hand waren zilveren vaten, en gouden vaten, en koperen vaten;", "1 Sam 11:15": "Toen ging heel het volk naar Gilgal, en Saul werd daar koning gemaakt voor het aangezicht van de HEERE te Gilgal; en zij offerden daar dankoffers voor het aangezicht van de HEERE; en Saul verheugde zich daar zeer, met alle mannen van Israël.", "Richt 12:5": "Want de Gileadieten namen de Efraïmieten de doorwaadbare plaatsen van de Jordaan af; en het gebeurde, toen de vluchtelingen van Efraïm zeiden: Laat mij oversteken, dat de mannen van Gilead tegen hem zeiden: Bent u een Efraïmiet? En wanneer hij zei: Nee;", "Jes 24:8": "De vreugde van de trommelen rust, het geluid van de vrolijk huppelende houdt op, de vreugde van de harp rust.", "Richt 13:6": "Toen kwam deze vrouw binnen en sprak tegen haar man en zei: Er kwam een Man van God naar mij toe, Wiens gezicht was als het gezicht van een Engel van God, zeer ontzagwekkend; en ik heb Hem niet gevraagd waar Hij vandaan was, en Zijn naam heeft Hij mij niet bekendgemaakt.", "2 Sam 15:14": "Toen zei David tegen al zijn knechten die met hem te Jeruzalem waren: Maak u op, en laten we vluchten, want anders zou er voor ons geen ontkomen zijn voor Absalom; haast u om weg te gaan, opdat hij ons niet misschien plotseling haast, en ons achterhaalt, en een kwaad over ons brengt, en deze stad slaat met de scherpte van het zwaard.", "Pred 12:1-5": "Denk aan uw Schepper in de dagen van uw jeugd, voordat de kwade dagen komen en de jaren naderen waarvan u zult zeggen: Ik heb er geen vreugde in. Voordat de zon, en het licht, en de maan, en de sterren verduisterd worden, en de wolken terugkomen na de regen. Op de dag wanneer de wachters van het huis zullen beven, en de sterke mannen zich zullen krommen, en de maalsters zullen stilstaan, omdat zij minder geworden zijn, en zij die door de vensters kijken, verduisterd zullen worden;", "Spr 19:15": "Luiheid doet in een diepe slaap vallen; en een lui mens zal hongeren.", "1 Sam 16:3": "En u zult Isaï uitnodigen voor het offer, en Ik zal u laten weten wat u moet doen; en u zult Mij zalven degene die Ik u zeggen zal.", "1 Kron 21:3": "Toen zei Joab: De HEERE doet Zijn volk, hoeveel zij nu ook zijn, honderd keer zoveel worden; zijn zij niet allen, o mijn heer koning, mijn heer tot knechten? Waarom verzoekt mijn heer dit? Waarom zou het Israël tot schuld worden?", "Job 5:26": "U zult in ouderdom naar het graf gaan, zoals de korenhoop op zijn tijd wordt opgevoerd.", "Ex 15:20": "En Mirjam, de profetes, de zuster van Aäron, nam een trommel in haar hand; en alle vrouwen gingen achter haar aan, met trommels en met reidansen.", "Gen 14:19": "En hij zegende hem en zei: Gezegend zij Abram door God, de Allerhoogste, Die hemel en aarde bezit!", "Richt 18:9": "En zij zeiden: Maak u op, en laat ons tegen hen optrekken; want wij hebben dat land bekeken, en zie, het is zeer goed; zult u dan stil blijven? Wees niet lui om te gaan, en om erin te trekken, om dat land in erfelijk bezit te nemen;", "Job 19:16": "Ik riep mijn knecht, en hij antwoordde niet; ik smeekte met mijn mond tot hem.", "Ps 101:7": "Wie bedrog pleegt, zal binnen mijn huis niet blijven; die leugens spreekt, zal voor mijn ogen niet bevestigd worden.", "Spr 19:12": "De gramschap van de koning is als het gebrul van een jonge leeuw; maar zijn welgevallen is als dauw op het gras.", "Gen 47:29-31": "Toen de dagen naderden dat Israël zou sterven, riep hij zijn zoon Jozef, en zei tegen hem: Als ik nu genade gevonden heb in uw ogen, leg dan toch uw hand onder mijn heup, en bewijs mij goedheid en trouw: begraaf mij toch niet in Egypte; maar laat ik bij mijn vaderen liggen; daarom zult u mij uit Egypte wegvoeren en mij in hun graf begraven. En hij zei: Ik zal doen naar uw woord! En hij zei: Zweer het mij! En hij zwoer het hem. En Israël boog zich neer aan het hoofdeind van het bed.", "Hand 18:15": "maar als er een geschil is over een woord, en namen, en over de wet die onder u geldt, zoekt u het dan zelf maar uit; want ik wil over deze dingen geen rechter zijn.", "Hand 20:38": "Zeer bedroefd, vooral over het woord dat hij gezegd had, dat zij zijn gezicht niet meer zouden zien; en zij begeleidden hem naar het schip.", "Jak 4:1-5": "Waar komen strijd en ruzies onder u vandaan? Komen ze niet hieruit voort, namelijk uit uw lusten, die in uw leden strijd voeren? U begeert, en hebt niet; u benijdt en jaagt naar dingen, en kunt ze niet krijgen; u vecht en voert strijd, maar u hebt niet, omdat u niet bidt. U bidt, en u ontvangt niet, omdat u verkeerd bidt, met de bedoeling het in uw lusten door te brengen.", "Pred 2:8": "Ik verzamelde mij ook zilver en goud, en kostbaarheden van koningen en landstreken; ik nam mij zangers en zangeressen aan, en wat mensenkinderen tot lust strekt: allerlei snarenspel.", "Matt 5:25": "Wees snel welgezind tegenover uw tegenpartij, terwijl u nog met hem onderweg bent, opdat de tegenpartij u misschien niet aan de rechter overlevert, en de rechter u aan de gerechtsdienaar overlevert, en u in de gevangenis geworpen wordt.", "2 Sam 9:8": "Toen boog hij zich neer, en zei: Wat is uw knecht, dat u omgezien hebt naar een dode hond, zoals ik ben?", "Gen 47:9": "En Jakob zei tegen Farao: De jaren van mijn vreemdelingschap zijn honderddertig jaar; weinig en zwaar zijn de jaren van mijn leven geweest, en zij hebben niet gehaald bij de jaren van het leven van mijn vaderen, in de dagen van hun vreemdelingschap.", "1 Kron 11:3": "Ook kwamen alle oudsten van Israël naar de koning in Hebron, en David maakte een verbond met hen te Hebron, voor het aangezicht van de HEERE; en zij zalfden David tot koning over Israël, naar het woord van de HEERE, door de dienst van Samuël.", "Matt 21:9": "En de menigten die voor Hem uit gingen en die volgden, riepen: Hosanna, de Zoon van David! Gezegend is Hij Die komt in de Naam van de Heere! Hosanna in de hoogste hemelen!", "1 Sam 24:8": "En David hield zijn mannen met woorden tegen, en liet hun niet toe dat zij opstonden tegen Saul. En Saul maakte zich op uit de spelonk, en ging op de weg.", "2 Sam 13:33": "Zo moet mijn heer de koning nu de zaak niet ter harte nemen, door te denken dat alle zonen van de koning dood zijn; want Amnon alleen is dood.", "2 Sam 19:31-39": "Barzillai, de Gileadiet, kwam ook naar beneden uit Rogelim; en hij trok met de koning de Jordaan over, om hem over de Jordaan te begeleiden. Barzillai nu was zeer oud, een man van tachtig jaar; en hij had de koning van voedsel voorzien toen hij in Mahanaïm verbleef; want hij was een zeer belangrijk man. En de koning zei tegen Barzillai: Trek met mij mee, en ik zal u bij mij in Jeruzalem onderhouden.", "Hebr 2:12": "En Hij zegt: Ik zal Uw naam aan Mijn broeders verkondigen; in het midden van de Gemeente zal Ik U lofzingen.", "Jes 40:1": "Troost, troost Mijn volk, zal uw God zeggen.", "Gal 5:15": "Maar als u elkaar bijt en verslindt, kijk dan uit dat u niet door elkaar verteerd wordt.", "Gen 28:3": "En God, de Almachtige, zegent u, en maakt u vruchtbaar, en vermenigvuldigt u, zodat u tot een groep volken wordt.", "1 Kor 7:29": "Maar dit zeg ik, broeders: dat de tijd voortaan kort is; opdat ook zij die vrouwen hebben, zouden zijn alsof zij ze niet hadden;", "Pred 12:1-7": "Denk aan uw Schepper in de dagen van uw jeugd, voordat de kwade dagen komen en de jaren naderen waarvan u zult zeggen: Ik heb er geen vreugde in. Voordat de zon, en het licht, en de maan, en de sterren verduisterd worden, en de wolken terugkomen na de regen. Op de dag wanneer de wachters van het huis zullen beven, en de sterke mannen zich zullen krommen, en de maalsters zullen stilstaan, omdat zij minder geworden zijn, en zij die door de vensters kijken, verduisterd zullen worden;", "2 Sam 15:13": "Toen kwam er een boodschapper naar David, en zei: Het hart van ieder in Israël volgt Absalom na.", "Spr 18:13": "Wie antwoord geeft eer hij geluisterd heeft, dat is hem dwaasheid en schande.", "Openb 18:22": "En de stem van citerspelers, en zangers, en fluiters, en bazuinblazers, zal in u niet meer gehoord worden; en geen enkele kunstenaar van welke kunst dan ook zal meer in u gevonden worden; en het geluid van de molen zal in u niet meer gehoord worden.", "Job 42:17": "En Job stierf, oud en verzadigd van dagen.", "Tit 2:2": "Dat de oude mannen nuchter zijn, stemmig, bezonnen, gezond in het geloof, in de liefde, in de volharding.", "2 Sam 6:20": "Toen David nu terugkwam om zijn huis te zegenen, ging Michal, de dochter van Saul, naar buiten, David tegemoet, en zei: Hoe is de koning van Israël vandaag geëerd, die zich vandaag voor de ogen van de dienstmaagden van zijn dienstknechten heeft ontbloot, zoals een van de nietswaardige mensen zich onbeschaamd ontbloot!", "Gen 50:25": "En Jozef deed de zonen van Israël zweren en zei: God zal u zeker bezoeken, zo zult u mijn beenderen van hier opvoeren!", "Hos 8:4": "Zij hebben koningen aangesteld, maar niet door Mij; zij hebben vorsten aangesteld, maar Ik heb het niet erkend; van hun zilver en hun goud hebben zij voor zichzelf afgoden gemaakt, zodat zij uitgeroeid worden.", "Ezech 24:17": "Houd stil met kermen, u zult geen dodenrouw bedrijven, bind uw hoofddeksel op u, en doe uw schoenen aan uw voeten; en de bovenlip zult u niet bedekken, en het brood van de mensen zult u niet eten.", "Rom 12:15": "Verblijd u met de blijden, en ween met de wenende.", "Luk 22:28-30": "En u bent degenen die met Mij steeds gebleven zijn in Mijn beproevingen. En Ik ken u het Koninkrijk toe, zoals Mijn Vader dat Mij toegekend heeft; opdat u eet en drinkt aan Mijn tafel in Mijn Koninkrijk, en zit op tronen, en de twaalf stammen van Israël oordeelt.", "Ps 92:2-4": "Het is goed dat men de HEERE looft, en Uw Naam psalmzingt, o Allerhoogste! Dat men in de morgenstond Uw goedertierenheid verkondigt, en Uw trouw in de nachten; Op het tiensnarig instrument en op de luit, met een voorbedacht lied op de harp.", "Dan 3:6": "En wie niet neervalt en aanbidt, die zal op datzelfde moment in het midden van de brandende vuuroven geworpen worden.", "1 Sam 19:5": "Want hij heeft zijn leven gewaagd, en hij heeft de Filistijn geslagen, en de HEERE heeft een grote overwinning aan heel Israël gegeven; u hebt het gezien, en u bent verblijd geweest; waarom zou u dan tegen onschuldig bloed zondigen, David zonder reden doden?", "Ex 2:8": "En de dochter van Farao zei tegen haar: Ga. En het meisje ging, en riep de moeder van het kind.", "Ps 68:26": "De zangers gingen voorop, de speellieden erachteraan, in het midden de trommelende meisjes.", "Ps 101:6": "Mijn ogen zullen zijn op de getrouwen in het land, dat zij bij mij zitten; die op de oprechte weg wandelt, die zal mij dienen.", "2 Sam 1:15": "En David riep een van de jongens, en zei: Kom dichterbij, val hem aan. En hij sloeg hem, zodat hij stierf.", "2 Sam 19:9-15": "En heel het volk, in alle stammen van Israël, was onder elkaar aan het twisten en zei: De koning heeft ons gered uit de hand van onze vijanden en hij heeft ons bevrijd uit de hand van de Filistijnen, en nu is hij het land uit gevlucht vanwege Absalom; En Absalom, die wij over ons gezalfd hadden, is in de strijd gestorven; waarom zwijgt u dan nu over het terughalen van de koning? Toen zond koning David een bericht naar Zadok en naar Abjathar, de priesters, en zei: Spreek tegen de oudsten van Juda: Waarom zouden jullie de laatsten zijn om de koning terug te halen naar zijn huis? (Want wat er in heel Israël gezegd werd, was de koning ter ore gekomen in zijn huis.)", "2 Sam 1:26": "Ik ben benauwd om uwentwil, mijn broeder Jonathan! U was mij zeer liefelijk; uw liefde was mij wonderlijker dan liefde van vrouwen.", "Deut 34:7": "Mozes nu was honderdtwintig jaar oud, toen hij stierf; zijn oog was niet dof geworden, en zijn kracht was niet vergaan.", "Joz 2:7": "Die mannen dan achtervolgden hen op de weg naar de Jordaan, tot aan de doorwaadbare plaatsen; en men sloot de poort dicht, nadat zij naar buiten gegaan waren die hen achtervolgden.", "1 Kor 14:15": "Wat is het dan? Ik zal wel met de geest bidden, maar ik zal ook met het verstand bidden; ik zal wel met de geest zingen, maar ik zal ook met het verstand zingen.", "Tit 2:3": "De oude vrouwen eveneens, dat zij zich gedragen zoals bij heiligheid past, geen lasteraarsters zijn, zich niet overgeven aan veel wijn, maar leraressen zijn van het goede;", "2 Kron 23:18": "Jojada nu stelde de diensten van het huis van de HEERE aan, onder leiding van de Levitische priesters, die David in het huis van de HEERE ingedeeld had, om de brandoffers van de HEERE te offeren, zoals in de wet van Mozes geschreven staat, met blijdschap en met gezang, naar de instelling van David.", "2 Sam 16:17": "Maar Absalom zei tegen Husai: Is dit uw trouw aan uw vriend? Waarom bent u niet met uw vriend meegegaan?", "Matt 11:17": "En zeggen: Wij hebben voor u op de fluit gespeeld, en u hebt niet gedanst; wij hebben u klaagliederen gezongen, en u hebt niet geweend.", "2 Tess 1:7": "En aan u, die verdrukt wordt, verkwikking te geven met ons, bij de openbaring van de Heere Jezus vanuit de hemel met de engelen van Zijn kracht;", "2 Kron 29:25-28": "En hij stelde de Levieten aan in het huis van de HEERE, met cimbalen, met luiten en harpen, naar het gebod van David, en van Gad, de ziener van de koning, en van Nathan, de profeet; want dit gebod kwam van de hand van de HEERE, door de hand van Zijn profeten. De Levieten nu stonden met de instrumenten van David, en de priesters met de trompetten. En Hizkia gaf bevel dat men het brandoffer op het altaar zou offeren; en op het moment dat het brandoffer begon, begon ook het gezang van de HEERE, met de trompetten en met de instrumenten van David, de koning van Israël.", "Pred 6:3": "Als een man honderd kinderen verwekte, en veel jaren leefde, zodat de dagen van zijn jaren veel waren, maar zijn ziel niet verzadigd werd van het goede, en hij ook geen begrafenis had; ik zeg dat een misdracht beter is dan hij.", "2 Sam 3:39": "Maar ik ben vandaag teder, hoewel tot koning gezalfd, en deze mannen, de zonen van Zeruja, zijn te hard voor mij; de HEERE zal de boosdoener vergelden naar zijn boosheid.", "Ezech 26:13": "Zo zal Ik het gedreun van uw liederen doen ophouden, en het geschal van uw harpen zal niet meer gehoord worden.", "1 Sam 16:6": "En het gebeurde, toen zij binnenkwamen, dat hij Eliab aanzag, en dacht: Zeker, deze staat hier voor de HEERE, Zijn gezalfde.", "2 Sam 19:31-40": "Barzillai, de Gileadiet, kwam ook naar beneden uit Rogelim; en hij trok met de koning de Jordaan over, om hem over de Jordaan te begeleiden. Barzillai nu was zeer oud, een man van tachtig jaar; en hij had de koning van voedsel voorzien toen hij in Mahanaïm verbleef; want hij was een zeer belangrijk man. En de koning zei tegen Barzillai: Trek met mij mee, en ik zal u bij mij in Jeruzalem onderhouden.", "Hand 4:32": "En de menigte van hen die geloofden, was een van hart en een van ziel; en niemand zei dat iets van wat hij had zijn eigendom was, maar alle dingen waren hun gemeenschappelijk.", "Job 6:30": "Zou onrecht op mijn tong wezen? Zou mijn gehemelte niet de ellenden te verstaan geven?", "Ezra 2:61": "En van de kinderen van de priesters, de kinderen van Habaja, de kinderen van Koz, de kinderen van Barzillai, die een vrouw genomen had van de dochters van Barzillai, de Gileadiet, en naar hun naam genoemd was.", "1 Kon 2:25": "En de koning Salomo stuurde Benaja, de zoon van Jojada; die viel op hem aan, zodat hij stierf.", "Gen 49:10": "De scepter zal van Juda niet wijken, evenmin de wetgever van tussen zijn voeten, totdat Silo komt, en Hem zullen de volken gehoorzaam zijn.", "Ef 5:19": "en spreek onder elkaar met psalmen, en lofzangen, en geestelijke liederen, terwijl u zingt en psalmt voor de Heere in uw hart,", "Hand 23:5": "En Paulus zei: Ik wist niet, broeders, dat hij de hogepriester was; want er is geschreven: De leider van uw volk zult u niet vervloeken.", "Gen 31:55": "En Laban stond 's morgens vroeg op, en kuste zijn zonen, en zijn dochters, en zegende hen; en Laban trok weg, en keerde terug naar zijn plaats.", "2 Sam 16:11": "Verder zei David tegen Abisai en tegen al zijn knechten: Zie, mijn zoon, die uit mijn lijf is voortgekomen, zoekt mijn leven; hoeveel te meer dan nu deze zoon van Jemini? Laat hem begaan, laat hij vloeken, want de HEERE heeft het hem gezegd.", "1 Sam 26:16": "Deze zaak die u gedaan hebt, is niet goed; zo waarachtig als de HEERE leeft, u bent kinderen van de dood, omdat u geen wacht gehouden hebt over uw heer, de gezalfde van de HEERE! En nu, kijk waar de speer van de koning is, en de waterfles die bij zijn hoofdeinde was.", "1 Sam 26:21": "Toen zei Saul: Ik heb gezondigd; keer terug, mijn zoon David, want ik zal u geen kwaad meer doen, omdat mijn leven vandaag kostbaar geweest is in uw ogen; zie, ik heb dwaas gehandeld en ben zeer ernstig misgegaan.", "Gen 47:10": "En Jakob zegende Farao, en ging weg van Farao.", "Ruth 1:17": "Waar u zult sterven, zal ik sterven, en daar zal ik begraven worden; zo doe mij de HEERE en zo doe Hij daar nog aan toe, als niet de dood alléén scheiding zal maken tussen mij en u!", "Ezra 2:65": "Behalve hun knechten en hun dienstmeisjes, die er zevenduizend driehonderdzevenendertig waren; en zij hadden tweehonderd zangers en zangeressen.", "1 Kon 2:46": "En de koning gaf Benaja, de zoon van Jojada, de opdracht; die ging naar buiten, en viel op hem aan, zodat hij stierf. Zo is het koninkrijk bevestigd in de hand van Salomo.", "Ps 68:27": "Looft God in de gemeenten, de Heere, u die uit de bron van Israël bent!", "1 Sam 22:15": "Ben ik vandaag begonnen God voor hem te raadplegen? Dat zij verre van mij, dat de koning zijn knecht iets aanrekent, of het hele huis van mijn vader; want uw knecht heeft van al deze dingen niets geweten, klein of groot.", "Neh 7:63": "En van de priesters: de kinderen van Habaja, de kinderen van Koz, de kinderen van Barzillai, die een vrouw van de dochters van Barzillai, de Gileadiet, genomen had, en naar hun naam genoemd was.", "Job 12:11": "Zal het oor de woorden niet proeven, zoals het gehemelte voor zich het voedsel smaakt?", "Gen 27:26": "En zijn vader Izak zei tegen hem: Kom toch dichterbij, en kus mij, mijn zoon!", "1 Kon 21:10": "En zet tegenover hem twee mannen, zonen van Belial, die tegen hem getuigen en zeggen: U hebt God en de koning gevloekt; en voer hem naar buiten, en stenig hem, dat hij sterft.", "1 Kron 6:32": "En zij dienden voor de tabernakel van de tent der samenkomst met gezangen, totdat Salomo het huis van de HEERE in Jeruzalem bouwde; en zij stonden naar hun beurt in hun ambt.", "Ps 101:5": "Wie zijn naaste in het heimelijke belastert, die zal ik verdelgen; die hoogmoedig van ogen is, en trots van hart, die zal ik niet verdragen.", "Openb 14:3": "en zij zongen als een nieuw lied voor de troon, en voor de vier dieren, en de oudsten; en niemand kon dat lied leren, dan de honderdvierenveertigduizend, die van de aarde gekocht waren.", "1 Kon 2:37": "Want het zal gebeuren op de dag dat u weggaat, wanneer u over de beek Kidron trekt, weet u zeker, dat u zult sterven; uw bloed zal op uw eigen hoofd zijn.", "Jer 31:4": "Ik zal u weer bouwen, en u zult gebouwd worden, o jonkvrouw Israël! U zult weer versierd zijn met uw tamboerijnen, en uitgaan met de rei van de spelende mensen.", "Ps 3:9": "Het heil is van de HEERE; Uw zegen is over Uw volk. Sela.", "Matt 27:4": "en zei: Ik heb gezondigd, want ik heb onschuldig bloed verraden! Maar zij zeiden: Wat gaat ons dat aan? U moet maar toezien.", "Luk 2:29": "Nu laat U, Heere, Uw dienstknecht gaan in vrede, naar Uw woord;", "1 Kron 22:3": "En David bereidde ijzer in overvloed, voor de nagelen aan de deuren van de poorten en voor de verbindingen; ook koper in overvloed, zonder gewicht;", "Gen 49:30": "In de spelonk die op de akker van Machpela is, die tegenover Mamre is, in het land Kanaän, die Abraham met die akker gekocht heeft van Efron, de Hethiet, tot een erfbegrafenis.", "Ps 110:3": "Uw volk zal zeer gewillig zijn op de dag van Uw heirkracht, in heilig sieraad; uit de baarmoeder van het dageraad zal U de dauw van Uw jeugd zijn.", "1 Sam 25:25": "Laat mijn heer toch zijn hart niet richten op deze Belials man, op Nabal; want zoals zijn naam is, zo is hij; zijn naam is Nabal, en dwaasheid is bij hem; en ik, uw dienstmaagd, heb de jongemannen van mijn heer niet gezien, die u gezonden hebt.", "1 Kron 25:8": "En zij wierpen de loten over de dienst, tegen elkaar, zowel de kleinen als de groten, de meester met de leerling.", "Ps 79:8": "Denk ons de vorige misdaden niet aan; haast U, laat Uw barmhartigheden ons tegemoetkomen; want wij zijn zeer zwak geworden.", "Hebr 13:3": "Denk aan de gevangenen, alsof u mee gevangen was; en aan hen die kwalijk behandeld worden, alsof u ook zelf in het lichaam kwalijk behandeld was.", "1 Sam 16:13": "Toen nam Samuël de oliehoorn, en zalfde hem te midden van zijn broers. En de Geest van de HEERE kwam vanaf die dag over David, en bleef. Daarna stond Samuël op, en ging naar Rama.", "Pred 10:4": "Als de geest van de heerser tegen u oprijst, verlaat uw plaats niet; want het is medicijn, het stilt grote zonden.", "2 Sam 12:7": "Toen zei Nathan tegen David: U bent die man! Zo zegt de HEERE, de God van Israël: Ik heb u tot koning gezalfd over Israël, en Ik heb u uit de hand van Saul gered;", "Richt 12:6": "dan zeiden zij tegen hem: Zeg dan Schibboleth; maar hij zei: Sibbolet, en kon het zo niet goed uitspreken; dan grepen zij hem en doodden hem bij de doorwaadbare plaatsen van de Jordaan, zodat er in die tijd van Efraïm tweeënveertigduizend vielen.", "Richt 12:4": "En Jeftha verzamelde alle mannen van Gilead, en streed met Efraïm; en de mannen van Gilead versloegen Efraïm, want de Gileadieten zeiden: U bent vluchtelingen van Efraïm, [wonend] tussen Efraïm en tussen Manasse.", "Ex 15:1": "Toen zongen Mozes en de kinderen van Israël de HEERE dit lied, en zeiden: Ik zal de HEERE zingen; want Hij is hoog verheven! Het paard en zijn ruiter heeft Hij in de zee geworpen.", "Ex 32:24": "Toen zei ik tegen hen: Wie goud heeft, laat die het afrukken en aan mij geven; en ik wierp het in het vuur, en dit kalf is eruit gekomen.", "2 Sam 18:33": "Toen raakte de koning zeer ontroerd, en ging naar boven, naar de bovenzaal boven de poort, en huilde; en al gaande zei hij dit: Mijn zoon Absalom, mijn zoon, mijn zoon Absalom! Was ik maar, was ik maar in uw plaats gestorven, Absalom, mijn zoon, mijn zoon!", "Hebr 5:14": "Maar voor de volwassenen is er het vaste voedsel, voor hen die door de gewoonte hun zintuigen geoefend hebben, om onderscheid te maken tussen goed en kwaad.", "Jes 24:9": "Zij zullen geen wijn drinken met gezang; de sterke drank zal bitter zijn voor hen die hem drinken.", "1 Sam 28:10": "Saul nu zwoer haar bij de HEERE en zei: Zo waarachtig als de HEERE leeft, u zal geen straf om deze zaak overkomen!", "1 Kon 2:36-46": "Daarna stuurde de koning, en riep Simeï, en zei tegen hem: Bouw u een huis in Jeruzalem, en woon daar, en ga vandaar niet naar hier of daar. Want het zal gebeuren op de dag dat u weggaat, wanneer u over de beek Kidron trekt, weet u zeker, dat u zult sterven; uw bloed zal op uw eigen hoofd zijn. En Simeï zei tegen de koning: Dat woord is goed; zoals mijn heer de koning gesproken heeft, zo zal uw dienaar doen. En Simeï woonde in Jeruzalem vele dagen.", "2 Kron 20:28": "En zij kwamen in Jeruzalem, met luiten, en met harpen, en met trompetten, naar het huis van de HEERE.", "Deut 21:12": "Dan zult u haar in uw huis brengen; en zij zal haar hoofd scheren en haar nagels knippen.", "1 Sam 20:25-27": "Toen de koning zich op zijn zitplaats had gezet, deze keer net als de andere keren, aan de plaats bij de wand, stond Jonathan op, en Abner zat aan Sauls zijde, en Davids plaats werd leeg gevonden. En Saul sprak die dag niets, want hij zei: Hem is iets overkomen, dat hij niet rein is; zeker, hij is niet rein. Het gebeurde nu de volgende dag, de tweede dag van de nieuwe maan, dat Davids plaats leeg gevonden werd, zo zei Saul tegen zijn zoon Jonathan: Waarom is de zoon van Isaï noch gisteren noch vandaag bij het voedsel gekomen?", "2 Sam 19:1-7": "En Joab werd verteld: Zie, de koning huilt en bedrijft rouw over Absalom. Toen werd de overwinning op diezelfde dag voor het hele volk tot rouw; want het volk had diezelfde dag horen zeggen: Het smart de koning over zijn zoon. En het volk kwam diezelfde dag stiekem de stad binnen, zoals het volk zich wegsteelt, dat beschaamd is wanneer zij in de strijd gevlucht zijn.", "2 Sam 19:34-37": "Maar Barzillai zei tegen de koning: Hoeveel dagen zullen de jaren van mijn leven nog duren, dat ik met de koning zou optrekken naar Jeruzalem? Ik ben vandaag tachtig jaar oud; zou ik nog kunnen onderscheiden tussen goed en kwaad? Zou uw knecht kunnen proeven wat ik eet en wat ik drink? Zou ik nog kunnen horen naar de stem van zangers en zangeressen? En waarom zou uw knecht mijn heer de koning nog langer tot last zijn? Uw knecht zal maar een klein stukje met de koning de Jordaan overgaan; waarom toch zou de koning mij zo'n beloning geven?", "Richt 8:4": "Toen Gideon nu bij de Jordaan gekomen was, ging hij eroverheen, met de driehonderd mannen die bij hem waren, moe, maar toch nog vervolgend.", "2 Sam 15:33": "En David zei tegen hem: Als u met mij meegaat, zult u mij tot een last zijn;", "Ps 90:10": "Aangaande de dagen van onze jaren, daarin zijn zeventig jaren, of, als wij zeer sterk zijn, tachtig jaren; en het voortreffelijkste van die is moeite en verdriet; want het wordt snel afgesneden, en wij vliegen daarheen.", "1 Kron 16:4-39": "En hij stelde voor de ark van de HEERE sommigen uit de Levieten aan tot dienaars, en dat om de HEERE, de God van Israël, te vermelden, en te loven, en te prijzen. Asaf was het hoofd, en Zecharja de tweede na hem; Jeïel, en Semiramoth, en Jehiël, en Mattithja, en Eliab, en Benaja, en Obed-Edom, en Jeïel, met instrumenten van luiten en met harpen; en Asaf liet zich horen met cimbalen; Maar Benaja en Jahaziël, de priesters, voortdurend met trompetten voor de ark van het verbond van God.", "1 Sam 26:9": "David zei daarentegen tegen Abisai: Breng hem niet om; want wie heeft ooit zijn hand tegen de gezalfde van de HEERE opgeheven en is onschuldig gebleven?", "Ps 33:1-4": "Rechtvaardigen! Zingt vrolijk in de HEERE; lof past de oprechten. Looft de HEERE met de harp; zingt Hem psalmen met de luit, en het tiensnarig instrument. Zingt Hem een nieuw lied; speelt goed met vrolijk geschal.", "Ps 104:33": "Ik zal de HEERE zingen in mijn leven; ik zal mijn God psalmzingen, zolang ik nog ben.", "2 Sam 16:10": "Maar de koning zei: Wat heb ik met u te doen, zonen van Zeruja? Ja, laat hem vloeken; want de HEERE heeft immers tegen hem gezegd: Vloek David; wie zou dan zeggen: Waarom hebt u dat gedaan?", "Neh 12:24": "De hoofden dan van de Levieten waren Hasabja, Serebja, en Jesua, de zoon van Kadmiel, en hun broeders tegenover hen, om te prijzen en te danken, naar het gebod van David, de man van God, wacht tegenover wacht.", "1 Sam 24:23": "Toen zwoer David aan Saul; en Saul ging naar zijn huis, maar David en zijn mannen gingen op naar de vesting.", "1 Kon 21:11": "En de mannen van zijn stad, die oudsten en die edelen, die in zijn stad woonden, deden zoals Izebel hun gezonden had; zoals geschreven was in de brieven die zij hun gezonden had.", "Jak 1:20": "Want de toorn van de man werkt de gerechtigheid van God niet.", "2 Sam 16:5-9": "Toen koning David tot bij Bahurim kwam, zie, daar kwam een man vandaan uit het geslacht van het huis van Saul, van wie de naam Simeï was, de zoon van Gera; hij liep almaar door en vloekte. En hij gooide David met stenen, en ook alle knechten van koning David, hoewel al het volk en alle helden aan zijn rechter- en aan zijn linkerhand waren. Zo zei Simeï, terwijl hij vloekte: Ga weg, ga weg, man van bloed, en man van Belial!", "Ezra 3:10": "Toen nu de bouwers de grond van de tempel van de HEERE legden, stelden zij de priesters op, gekleed in hun ambtskleding, met trompetten, en de Levieten, de zonen van Asaf, met cimbalen, om de HEERE te loven, naar de instelling van David, de koning van Israël.", "Richt 5:1-3": "Verder zong Debora, en Barak, de zoon van Abinoam, op dezelfde dag, en zei: Looft de HEERE, om het wreken van de wraken in Israël, om dat het volk zich gewillig heeft aangeboden. Hoor, u koningen, neem het ter ore, u vorsten! Ik, den HEERE zal ik zingen, ik zal den HEERE, de God van Israël, psalmzingen.", "2 Sam 16:10-14": "Maar de koning zei: Wat heb ik met u te doen, zonen van Zeruja? Ja, laat hem vloeken; want de HEERE heeft immers tegen hem gezegd: Vloek David; wie zou dan zeggen: Waarom hebt u dat gedaan? Verder zei David tegen Abisai en tegen al zijn knechten: Zie, mijn zoon, die uit mijn lijf is voortgekomen, zoekt mijn leven; hoeveel te meer dan nu deze zoon van Jemini? Laat hem begaan, laat hij vloeken, want de HEERE heeft het hem gezegd. Misschien zal de HEERE naar mijn ellende omzien; en de HEERE zal mij goed vergelden voor zijn vloek van vandaag.", "2 Sam 2:8": "Abner nu, de zoon van Ner, de legeraanvoerder die Saul gehad had, nam Isboseth, Sauls zoon, en voerde hem over naar Mahanaim,", "Gen 27:27": "En hij kwam dichterbij, en hij kuste hem; toen rook hij de geur van zijn kleren, en zegende hem; en hij zei: Zie, de geur van mijn zoon is als de geur van het veld, dat de HEERE gezegend heeft.", "2 Sam 16:9": "Toen zei Abisai, de zoon van Zeruja, tegen de koning: Waarom zou deze dode hond mijn heer de koning vloeken? Laat mij toch oversteken en zijn kop wegnemen.", "2 Sam 20:2": "Toen trok alle man van Israël weg van achter David, Seba, de zoon van Bichri, achterna; maar de mannen van Juda kleefden hun koning aan, van de Jordaan af tot aan Jeruzalem.", "1 Sam 30:15": "Toen zei David tegen hem: Zou u mij naar beneden kunnen leiden naar deze bende? Hij dan zei: Zweer mij bij God, dat u mij niet zult doden, en dat u mij niet zult overleveren in de hand van mijn heer! Dan zal ik u naar deze bende leiden.", "2 Sam 16:1-4": "Toen David een klein stuk voorbij de top gegaan was, zie, daar ontmoette Ziba hem, de knecht van Mefiboseth, met een paar gezadelde ezels, en daarop tweehonderd broden, honderd stukken rozijnen, honderd stukken zomervruchten en een leren zak wijn. En de koning zei tegen Ziba: Wat wilt u daarmee? En Ziba zei: De ezels zijn voor het huis van de koning, om op te rijden, en het brood en de zomervruchten om te eten voor de knechten; en de wijn, opdat wie moede zijn in de woestijn, kunnen drinken. Toen zei de koning: Waar is dan de zoon van uw heer? En Ziba zei tegen de koning: Zie, hij blijft in Jeruzalem, want hij zei: Vandaag zal het huis van Israël mij het koninkrijk van mijn vader teruggeven.", "Ps 71:18-20": "Daarom ook, terwijl het ouderdom en de grijsheid daar zijn, verlaat mij niet, o God, totdat ik aan dit geslacht Uw arm verkondig, aan alle nakomelingen Uw macht. Ook is Uw gerechtigheid, o God, tot in de hoogte; Gij, Die grote dingen gedaan hebt; o God! wie is U gelijk? Gij, Die mij veel benauwdheden en kwaden hebt doen zien, zult mij weer levend maken, en zult mij weer ophalen uit de afgronden van de aarde.", "2 Sam 17:27": "En het gebeurde, toen David te Mahanaïm gekomen was, dat Sobi, de zoon van Nahas, uit Rabba van de kinderen van Ammon, en Machir, de zoon van Ammiël, uit Lodebar, en Barzillai, de Gileadiet, uit Rogelim,", "Deut 19:17-19": "dan zullen die twee mannen die de twist hebben, staan voor het aangezicht van de HEERE, voor het aangezicht van de priesters en de rechters, die er in die dagen zullen zijn. En de rechters zullen zorgvuldig onderzoek doen; en zie, de getuige is een valse getuige, hij heeft een valse verklaring afgelegd tegen zijn broeder; dan zult u hem doen zoals hij van plan was zijn broeder te doen; zo zult u het kwaad uit uw midden wegdoen;", "Ps 137:1-6": "Aan de rivieren van Babel, daar zaten wij, ook weenden wij, als wij dachten aan Sion. Wij hebben onze harpen gehangen aan de wilgen, die daar zijn. Toen zij die ons daar gevangen hielden, de woorden van een lied van ons vroegen, en zij die ons overhoop hadden geworpen, vreugde, en zeiden: Zingt ons een van de liederen van Sion;", "Richt 7:24": "Ook zond Gideon boden naar heel het gebergte van Efraïm, en zei: Kom naar beneden, de Midianieten tegemoet, en neem hun de wateren af, tot aan Beth-bara, namelijk de Jordaan; zo werd elke man van Efraïm bijeengeroepen, en zij namen hun de wateren af tot aan Beth-bara, en de Jordaan.", "Matt 25:34-40": "Dan zal de Koning zeggen tegen hen die aan Zijn rechterhand zijn: Kom, u gezegenden van Mijn Vader! Beërf het Koninkrijk dat voor u bereid is vanaf de grondlegging van de wereld. Want Ik ben hongerig geweest, en u hebt Mij te eten gegeven; Ik ben dorstig geweest, en u hebt Mij te drinken gegeven; Ik was een vreemdeling, en u hebt Mij een onderkomen gegeven. Ik was naakt, en u hebt Mij gekleed; Ik ben ziek geweest, en u hebt Mij bezocht; Ik was in de gevangenis, en u bent bij Mij gekomen.", "2 Sam 3:29": "Het moet blijven op het hoofd van Joab, en op heel het huis van zijn vader; en het mag van het huis van Joab niet ontbreken dat er iemand is die een vloed heeft, of melaats is, of zich aan de kruk moet vasthouden, of door het zwaard valt, of gebrek aan brood heeft!", "1 Sam 17:50": "Zo overweldigde David de Filistijn met een slinger en met een steen; en hij versloeg de Filistijn en doodde hem; doch David had geen zwaard in zijn hand.", "Hos 5:3": "Ik ken Efraïm, en Israël is voor Mij niet verborgen; want nu, Efraïm, hoereert u, en Israël is verontreinigd.", "Ps 78:34-37": "Toen Hij hen doodde, zochten zij Hem, en keerden weer, en zochten God vroeg; En zij dachten eraan, dat God hun Rotssteen was, en God, de Allerhoogste, hun Verlosser. En zij vleiden Hem met hun mond, en logen tegen Hem met hun tong.", "Ps 129:1": "Een lied Hammaaloth¹. Zij hebben mij dikwijls benauwd van mijn jeugd af, laat Israël nu zeggen:"}, "noten": {}, "koppeling": {"1": "<span class=\"wl\" data-l=\"L1\" data-code=\"H3097\">En</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H3097\">Joab</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H3097\">werd</span> verteld: <span class=\"wl\" data-l=\"L2\" data-code=\"H2009\">Zie</span>, <span class=\"wl\" data-l=\"L2\" data-code=\"H2009\">de</span> <spa "wl\" data-l=\"L12\" data-code=\"H4480\">dan</span> geringschat, zodat <span class=\"wl\" data-l=\"L14\" data-code=\"H7043\">ons</span> <span class=\"wl\" data-l=\"L15\" data-code=\"H1697\">woord</span> <span class=\"wl\" data-l=\"L16\" data-code=\"H3808\">niet</span> <span class=\"wl\" data-l=\"L16\" data-code=\"H3808\">het</span> <span class=\"wl\" data-l=\"L17\" data-code=\"H7223\">eerste</span> <span class=\"wl\" data-l=\"L18\" data-code=\"H1961\">geweest</span> <span class=\"wl\" data-l=\"L18\" data-code=\"H1961\">is</span> bij het terughalen van <span class=\"wl\" data-l=\"L8\" data-code=\"H4428\">onze</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H4428\">koning</span>? <span class=\"wl\" data-l=\"L19\" data-code=\"H1697\">Maar</span> <span class=\"wl\" data-l=\"L19\" data-code=\"H1697\">het</span> <span class=\"wl\" data-l=\"L23\" data-code=\"H1697\">woord</span> <span class=\"wl\" data-l=\"L23\" data-code=\"H1697\">van</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H376\">de</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H376\">mannen</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H376\">van</span> <span class=\"wl\" data-l=\"L20\" data-code=\"H3063\">Juda</span> <span class=\"wl\" data-l=\"L20\" data-code=\"H3063\">was</span> <span class=\"wl\" data-l=\"L21\" data-code=\"H7185\">harder</span> <span class=\"wl\" data-l=\"L22\" data-code=\"H4480\">dan</span> <span class=\"wl\" data-l=\"L19\" data-code=\"H1697\">het</span> <span class=\"wl\" data-l=\"L19\" data-code=\"H1697\">woord</span> <span class=\"wl\" data-l=\"L19\" data-code=\"H1697\">van</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H376\">de</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H376\">mannen</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H376\">van</span> <span class=\"wl\" data-l=\"L24\" data-code=\"H3478\">Israël</span>."}, "koppeling_kjv": {"1": "And it was <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab,</span> Behold, the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H1058\">weepeth</span> and <span class=\"wl wl-kjv\" data-code=\"H56\">mourneth</span> for <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom.</span>", "2": "And the <span class=\"wl wl-kjv\" data-code=\"H8668\">victory</span> that <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> was turned into <span class=\"wl wl-kjv\" data-code=\"H60\">mourning</span> unto all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people:</span> for the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> that <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> how the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> was <span class=\"wl wl-kjv\" data-code=\"H6087\">grieved</span> for his <span class=\"wl wl-kjv\" data-code=\"H1121\">son.</span>", "3": "And the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H935\">gat</span> them by <span class=\"wl wl-kjv\" data-code=\"H1589\">stealth</span> that <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> into the <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> as <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> being <span class=\"wl wl-kjv\" data-code=\"H3637\">ashamed</span> steal <span class=\"wl wl-kjv\" data-code=\"H1589\">away</span> when they <span class=\"wl wl-kjv\" data-code=\"H5127\">flee</span> in <span class=\"wl wl-kjv\" data-code=\"H4421\">battle.</span>", "4": "But the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H3813\">covered</span> his <span class=\"wl wl-kjv\" data-code=\"H6440\">face,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H2199\">cried</span> with a <span class=\"wl wl-kjv\" data-code=\"H1419\">loud</span> <span class=\"wl wl-kjv\" data-code=\"H6963\">voice,</span> O my <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom,</span> O <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom,</span> my <span class=\"wl wl-kjv\" data-code=\"H1121\">son,</span> my <span class=\"wl wl-kjv\" data-code=\"H1121\">son!</span>", "5": "And <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> into the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> to the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Thou hast <span class=\"wl wl-kjv\" data-code=\"H3001\">shamed</span> this <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> the <span class=\"wl wl-kjv\" data-code=\"H6440\">faces</span> of all thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servants,</span> which this <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> have <span class=\"wl wl-kjv\" data-code=\"H4422\">saved</span> thy <span class=\"wl wl-kjv\" data-code=\"H5315\">life,</span> and the <span class=\"wl wl-kjv\" data-code=\"H5315\">lives</span> of thy <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> and of thy <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters,</span> and the <span class=\"wl wl-kjv\" data-code=\"H5315\">lives</span> of thy <span class=\"wl wl-kjv\" data-code=\"H802\">wives,</span> and the <span class=\"wl wl-kjv\" data-code=\"H5315\">lives</span> of thy <span class=\"wl wl-kjv\" data-code=\"H6370\">concubines;</span>", "6": "In that thou <span class=\"wl wl-kjv\" data-code=\"H157\">lovest</span> thine <span class=\"wl wl-kjv\" data-code=\"H8130\">enemies,</span> and <span class=\"wl wl-kjv\" data-code=\"H8130\">hatest</span> thy <span class=\"wl wl-kjv\" data-code=\"H157\">friends.</span> For thou hast <span class=\"wl wl-kjv\" data-code=\"H5046\">declared</span> this <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> that thou regardest neither <span class=\"wl wl-kjv\" data-code=\"H8269\">princes</span> nor <span class=\"wl wl-kjv\" data-code=\"H5650\">servants:</span> for this <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> I <span class=\"wl wl-kjv\" data-code=\"H3045\">perceive,</span> that <span class=\"wl wl-kjv\" data-code=\"H3863\">if</span> <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom</span> had <span class=\"wl wl-kjv\" data-code=\"H2416\">lived,</span> and all we had <span class=\"wl wl-kjv\" data-code=\"H4191\">died</span> this <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> then it had pleased thee <span class=\"wl wl-kjv\" data-code=\"H3477\">well.</span>", "7": "Now therefore <span class=\"wl wl-kjv\" data-code=\"H6965\">arise,</span> go <span class=\"wl wl-kjv\" data-code=\"H3318\">forth,</span> and <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> <span class=\"wl wl-kjv\" data-code=\"H3820\">comfortably</span> unto thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servants:</span> for I <span class=\"wl wl-kjv\" data-code=\"H7650\">swear</span> by the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> if thou go not <span class=\"wl wl-kjv\" data-code=\"H3318\">forth,</span> there will not <span class=\"wl wl-kjv\" data-code=\"H3885\">tarry</span> <span class=\"wl wl-kjv\" data-code=\"H376\">one</span> with thee this <span class=\"wl wl-kjv\" data-code=\"H3915\">night:</span> and that will be <span class=\"wl wl-kjv\" data-code=\"H7489\">worse</span> unto thee than all the <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> that <span class=\"wl wl-kjv\" data-code=\"H935\">befell</span> thee from thy <span class=\"wl wl-kjv\" data-code=\"H5271\">youth</span> until now.", "8": "Then the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H6965\">arose,</span> and <span class=\"wl wl-kjv\" data-code=\"H3427\">sat</span> in the <span class=\"wl wl-kjv\" data-code=\"H8179\">gate.</span> And they <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> unto all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Behold, the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> doth <span class=\"wl wl-kjv\" data-code=\"H3427\">sit</span> in the <span class=\"wl wl-kjv\" data-code=\"H8179\">gate.</span> And all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king:</span> for <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> had <span class=\"wl wl-kjv\" data-code=\"H5127\">fled</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> to his <span class=\"wl wl-kjv\" data-code=\"H168\">tent.</span>", "9": "And all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> were at <span class=\"wl wl-kjv\" data-code=\"H1777\">strife</span> throughout all the <span class=\"wl wl-kjv\" data-code=\"H7626\">tribes</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> The <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H5337\">saved</span> us out of the <span class=\"wl wl-kjv\" data-code=\"H3709\">hand</span> of our <span class=\"wl wl-kjv\" data-code=\"H341\">enemies,</span> and he <span class=\"wl wl-kjv\" data-code=\"H4422\">delivered</span> us out of the <span class=\"wl wl-kjv\" data-code=\"H3709\">hand</span> of the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines;</span> and now he is <span class=\"wl wl-kjv\" data-code=\"H1272\">fled</span> out of the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> for <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom.</span>", "10": "And <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom,</span> whom we <span class=\"wl wl-kjv\" data-code=\"H4886\">anointed</span> over us, is <span class=\"wl wl-kjv\" data-code=\"H4191\">dead</span> in <span class=\"wl wl-kjv\" data-code=\"H4421\">battle.</span> Now therefore why <span class=\"wl wl-kjv\" data-code=\"H2790\">speak</span> ye not a word of <span class=\"wl wl-kjv\" data-code=\"H7725\">bringing</span> ➔ the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">back?</span>", "11": "And <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> to <span class=\"wl wl-kjv\" data-code=\"H6659\">Zadok</span> and to <span class=\"wl wl-kjv\" data-code=\"H54\">Abiathar</span> the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">Speak</span> unto the <span class=\"wl wl-kjv\" data-code=\"H2205\">elders</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Why are ye the <span class=\"wl wl-kjv\" data-code=\"H314\">last</span> to <span class=\"wl wl-kjv\" data-code=\"H7725\">bring</span> ➔ the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">back</span> to his <span class=\"wl wl-kjv\" data-code=\"H1004\">house?</span> seeing the <span class=\"wl wl-kjv\" data-code=\"H1697\">speech</span> of all <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> is <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> to the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> even to his <span class=\"wl wl-kjv\" data-code=\"H1004\">house.</span>", "12": "Ye are my <span class=\"wl wl-kjv\" data-code=\"H251\">brethren,</span> ye are my <span class=\"wl wl-kjv\" data-code=\"H6106\">bones</span> and my <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh:</span> wherefore then are ye the <span class=\"wl wl-kjv\" data-code=\"H314\">last</span> to bring <span class=\"wl wl-kjv\" data-code=\"H7725\">back</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king?</span>", "13": "And <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> ye to <span class=\"wl wl-kjv\" data-code=\"H6021\">Amasa,</span> Art thou not of my <span class=\"wl wl-kjv\" data-code=\"H6106\">bone,</span> and of my <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh?</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> so to me, and <span class=\"wl wl-kjv\" data-code=\"H3254\">more</span> also, if thou be not <span class=\"wl wl-kjv\" data-code=\"H8269\">captain</span> of the <span class=\"wl wl-kjv\" data-code=\"H6635\">host</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> me <span class=\"wl wl-kjv\" data-code=\"H3117\">continually</span> in the <span class=\"wl wl-kjv\" data-code=\"H8478\">room</span> of <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab.</span>", "14": "And he <span class=\"wl wl-kjv\" data-code=\"H5186\">bowed</span> the <span class=\"wl wl-kjv\" data-code=\"H3824\">heart</span> of all the <span class=\"wl wl-kjv\" data-code=\"H376\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> even as the heart of <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H376\">man;</span> so that they <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> this word unto the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">Return</span> thou, and all thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servants.</span>", "15": "So the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">returned,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to <span class=\"wl wl-kjv\" data-code=\"H3383\">Jordan.</span> And <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to <span class=\"wl wl-kjv\" data-code=\"H1537\">Gilgal,</span> to <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> to <span class=\"wl wl-kjv\" data-code=\"H7125\">meet</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> to <span class=\"wl wl-kjv\" data-code=\"H5674\">conduct</span> ➔ the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H5674\">over</span> <span class=\"wl wl-kjv\" data-code=\"H3383\">Jordan.</span>", "16": "And <span class=\"wl wl-kjv\" data-code=\"H8096\">Shimei</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H1617\">Gera,</span> a <span class=\"wl wl-kjv\" data-code=\"H1145\">Benjamite,</span> which was of <span class=\"wl wl-kjv\" data-code=\"H980\">Bahurim,</span> <span class=\"wl wl-kjv\" data-code=\"H4116\">hasted</span> and came <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> with the <span class=\"wl wl-kjv\" data-code=\"H376\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> to <span class=\"wl wl-kjv\" data-code=\"H7125\">meet</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David.</span>", "17": "And there were a <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> <span class=\"wl wl-kjv\" data-code=\"H376\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H1145\">Benjamin</span> with him, and <span class=\"wl wl-kjv\" data-code=\"H6717\">Ziba</span> the <span class=\"wl wl-kjv\" data-code=\"H5288\">servant</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul,</span> and his <span class=\"wl wl-kjv\" data-code=\"H2568\">fifteen</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> and his <span class=\"wl wl-kjv\" data-code=\"H6242\">twenty</span> <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> with him; and they went <span class=\"wl wl-kjv\" data-code=\"H6743\">over</span> <span class=\"wl wl-kjv\" data-code=\"H3383\">Jordan</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king.</span>", "18": "And there went <span class=\"wl wl-kjv\" data-code=\"H5674\">over</span> a ferry <span class=\"wl wl-kjv\" data-code=\"H5679\">boat</span> to carry <span class=\"wl wl-kjv\" data-code=\"H5674\">over</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">household,</span> and to <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> what he <span class=\"wl wl-kjv\" data-code=\"H5869\">thought</span> <span class=\"wl wl-kjv\" data-code=\"H2896\">good.</span> And <span class=\"wl wl-kjv\" data-code=\"H8096\">Shimei</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H1617\">Gera</span> fell <span class=\"wl wl-kjv\" data-code=\"H5307\">down</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> as he was come <span class=\"wl wl-kjv\" data-code=\"H5674\">over</span> <span class=\"wl wl-kjv\" data-code=\"H3383\">Jordan;</span>", "19": "And <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> Let not my <span class=\"wl wl-kjv\" data-code=\"H113\">lord</span> <span class=\"wl wl-kjv\" data-code=\"H2803\">impute</span> <span class=\"wl wl-kjv\" data-code=\"H5771\">iniquity</span> unto me, neither do thou <span class=\"wl wl-kjv\" data-code=\"H2142\">remember</span> that which thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> did <span class=\"wl wl-kjv\" data-code=\"H5753\">perversely</span> the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> that my <span class=\"wl wl-kjv\" data-code=\"H113\">lord</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> went <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> of <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> that the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> should <span class=\"wl wl-kjv\" data-code=\"H7760\">take</span> it to his <span class=\"wl wl-kjv\" data-code=\"H3820\">heart.</span>", "20": "For thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> doth <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> that I have <span class=\"wl wl-kjv\" data-code=\"H2398\">sinned:</span> therefore, behold, I am <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> the <span class=\"wl wl-kjv\" data-code=\"H7223\">first</span> this <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of all the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H3130\">Joseph</span> to go <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> to <span class=\"wl wl-kjv\" data-code=\"H7125\">meet</span> my <span class=\"wl wl-kjv\" data-code=\"H113\">lord</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king.</span>", "21": "But <span class=\"wl wl-kjv\" data-code=\"H52\">Abishai</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H6870\">Zeruiah</span> <span class=\"wl wl-kjv\" data-code=\"H6030\">answered</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Shall not <span class=\"wl wl-kjv\" data-code=\"H8096\">Shimei</span> be put to <span class=\"wl wl-kjv\" data-code=\"H4191\">death</span> for this, because he <span class=\"wl wl-kjv\" data-code=\"H7043\">cursed</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD'S</span> <span class=\"wl wl-kjv\" data-code=\"H4899\">anointed?</span>", "22": "And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> What have I to do with you, ye <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H6870\">Zeruiah,</span> that ye should this <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> be <span class=\"wl wl-kjv\" data-code=\"H7854\">adversaries</span> unto me? shall there any <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> be put to <span class=\"wl wl-kjv\" data-code=\"H4191\">death</span> this <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> in <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel?</span> for do not I <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> that I am this <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> over <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel?</span>", "23": "Therefore the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H8096\">Shimei,</span> Thou shalt not <span class=\"wl wl-kjv\" data-code=\"H4191\">die.</span> And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H7650\">sware</span> unto him.", "24": "And <span class=\"wl wl-kjv\" data-code=\"H4648\">Mephibosheth</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> came <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> to <span class=\"wl wl-kjv\" data-code=\"H7125\">meet</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> and had <span class=\"wl wl-kjv\" data-code=\"H3808\">neither</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">dressed</span> his <span class=\"wl wl-kjv\" data-code=\"H7272\">feet,</span> nor <span class=\"wl wl-kjv\" data-code=\"H6213\">trimmed</span> his <span class=\"wl wl-kjv\" data-code=\"H8222\">beard,</span> nor <span class=\"wl wl-kjv\" data-code=\"H3526\">washed</span> his <span class=\"wl wl-kjv\" data-code=\"H899\">clothes,</span> from the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">departed</span> until the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> he <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> again in <span class=\"wl wl-kjv\" data-code=\"H7965\">peace.</span>", "25": "And it came to pass, when he was <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> to <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> to <span class=\"wl wl-kjv\" data-code=\"H7125\">meet</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> that the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, Wherefore <span class=\"wl wl-kjv\" data-code=\"H1980\">wentest</span> not thou with me, <span class=\"wl wl-kjv\" data-code=\"H4648\">Mephibosheth?</span>", "26": "And he <span class=\"wl wl-kjv\" data-code=\"H559\">answered,</span> My <span class=\"wl wl-kjv\" data-code=\"H113\">lord,</span> O <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> my <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> <span class=\"wl wl-kjv\" data-code=\"H7411\">deceived</span> me: for thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> I will <span class=\"wl wl-kjv\" data-code=\"H2280\">saddle</span> me an <span class=\"wl wl-kjv\" data-code=\"H2543\">ass,</span> that I may <span class=\"wl wl-kjv\" data-code=\"H7392\">ride</span> thereon, and <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> to the <span class=\"wl wl-kjv\" data-code=\"H4428\">king;</span> because thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> is <span class=\"wl wl-kjv\" data-code=\"H6455\">lame.</span>", "27": "And he hath <span class=\"wl wl-kjv\" data-code=\"H7270\">slandered</span> thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> unto my <span class=\"wl wl-kjv\" data-code=\"H113\">lord</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king;</span> but my <span class=\"wl wl-kjv\" data-code=\"H113\">lord</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> is as an <span class=\"wl wl-kjv\" data-code=\"H4397\">angel</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God:</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> therefore what is <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> in thine <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes.</span>", "28": "For all of my <span class=\"wl wl-kjv\" data-code=\"H1\">father's</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> were <span class=\"wl wl-kjv\" data-code=\"H3808\">but</span> <span class=\"wl wl-kjv\" data-code=\"H4194\">dead</span> <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> before my <span class=\"wl wl-kjv\" data-code=\"H113\">lord</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king:</span> yet didst thou <span class=\"wl wl-kjv\" data-code=\"H7896\">set</span> thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> among them that did <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> at thine own <span class=\"wl wl-kjv\" data-code=\"H7979\">table.</span> What <span class=\"wl wl-kjv\" data-code=\"H6666\">right</span> therefore <span class=\"wl wl-kjv\" data-code=\"H3426\">have</span> I yet to <span class=\"wl wl-kjv\" data-code=\"H2199\">cry</span> any more unto the <span class=\"wl wl-kjv\" data-code=\"H4428\">king?</span>", "29": "And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, Why <span class=\"wl wl-kjv\" data-code=\"H1696\">speakest</span> thou any more of thy <span class=\"wl wl-kjv\" data-code=\"H1697\">matters?</span> I have <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Thou and <span class=\"wl wl-kjv\" data-code=\"H6717\">Ziba</span> <span class=\"wl wl-kjv\" data-code=\"H2505\">divide</span> the <span class=\"wl wl-kjv\" data-code=\"H7704\">land.</span>", "30": "And <span class=\"wl wl-kjv\" data-code=\"H4648\">Mephibosheth</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> Yea, let him <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> all, <span class=\"wl wl-kjv\" data-code=\"H310\">forasmuch</span> <span class=\"wl wl-kjv\" data-code=\"H834\">as</span> my <span class=\"wl wl-kjv\" data-code=\"H113\">lord</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> is come <span class=\"wl wl-kjv\" data-code=\"H935\">again</span> in <span class=\"wl wl-kjv\" data-code=\"H7965\">peace</span> unto his own <span class=\"wl wl-kjv\" data-code=\"H1004\">house.</span>", "31": "And <span class=\"wl wl-kjv\" data-code=\"H1271\">Barzillai</span> the <span class=\"wl wl-kjv\" data-code=\"H1569\">Gileadite</span> came <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> from <span class=\"wl wl-kjv\" data-code=\"H7274\">Rogelim,</span> and went <span class=\"wl wl-kjv\" data-code=\"H5674\">over</span> <span class=\"wl wl-kjv\" data-code=\"H3383\">Jordan</span> with the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> to <span class=\"wl wl-kjv\" data-code=\"H7971\">conduct</span> him over <span class=\"wl wl-kjv\" data-code=\"H3383\">Jordan.</span>", "32": "Now <span class=\"wl wl-kjv\" data-code=\"H1271\">Barzillai</span> was a <span class=\"wl wl-kjv\" data-code=\"H3966\">very</span> <span class=\"wl wl-kjv\" data-code=\"H2204\">aged</span> man, even <span class=\"wl wl-kjv\" data-code=\"H8084\">fourscore</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">old:</span> and he had provided the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3557\">sustenance</span> while he <span class=\"wl wl-kjv\" data-code=\"H7871\">lay</span> at <span class=\"wl wl-kjv\" data-code=\"H4266\">Mahanaim;</span> for he was a <span class=\"wl wl-kjv\" data-code=\"H3966\">very</span> <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H376\">man.</span>", "33": "And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H1271\">Barzillai,</span> Come thou <span class=\"wl wl-kjv\" data-code=\"H5674\">over</span> with me, and I will <span class=\"wl wl-kjv\" data-code=\"H3557\">feed</span> thee with me in <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem.</span>", "34": "And <span class=\"wl wl-kjv\" data-code=\"H1271\">Barzillai</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> How <span class=\"wl wl-kjv\" data-code=\"H3117\">long</span> have I to <span class=\"wl wl-kjv\" data-code=\"H8141\">live,</span> that I should go <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> with the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> unto <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem?</span>", "35": "I am this <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> <span class=\"wl wl-kjv\" data-code=\"H8084\">fourscore</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">old:</span> and can I <span class=\"wl wl-kjv\" data-code=\"H3045\">discern</span> between <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> and <span class=\"wl wl-kjv\" data-code=\"H7451\">evil?</span> can thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> <span class=\"wl wl-kjv\" data-code=\"H2938\">taste</span> <span class=\"wl wl-kjv\" data-code=\"H834\">what</span> I <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> or <span class=\"wl wl-kjv\" data-code=\"H834\">what</span> I <span class=\"wl wl-kjv\" data-code=\"H8354\">drink?</span> can I <span class=\"wl wl-kjv\" data-code=\"H8085\">hear</span> any more the <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> of singing <span class=\"wl wl-kjv\" data-code=\"H7891\">men</span> and singing <span class=\"wl wl-kjv\" data-code=\"H7891\">women?</span> wherefore then should thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> be yet a <span class=\"wl wl-kjv\" data-code=\"H4853\">burden</span> unto my <span class=\"wl wl-kjv\" data-code=\"H113\">lord</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king?</span>", "36": "Thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> will <span class=\"wl wl-kjv\" data-code=\"H5674\">go</span> ➔ a little <span class=\"wl wl-kjv\" data-code=\"H4592\">way</span> <span class=\"wl wl-kjv\" data-code=\"H5674\">over</span> <span class=\"wl wl-kjv\" data-code=\"H3383\">Jordan</span> with the <span class=\"wl wl-kjv\" data-code=\"H4428\">king:</span> and why should the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H1580\">recompense</span> it me with such a <span class=\"wl wl-kjv\" data-code=\"H1578\">reward?</span>", "37": "Let thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant,</span> I pray thee, turn back <span class=\"wl wl-kjv\" data-code=\"H7725\">again,</span> that I may <span class=\"wl wl-kjv\" data-code=\"H4191\">die</span> in mine own <span class=\"wl wl-kjv\" data-code=\"H589
