"../../hebreeen/1/"}, {"naam": "Jakobus", "href": "../../jakobus/1/"}, {"naam": "1 Petrus", "href": "../../1-petrus/1/"}, {"naam": "2 Petrus", "href": "../../2-petrus/1/"}, {"naam": "1 Johannes", "href": "../../1-johannes/1/"}, {"naam": "2 Johannes", "href": "../../2-johannes/1/"}, {"naam": "3 Johannes", "href": "../../3-johannes/1/"}, {"naam": "Judas", "href": "../../judas/1/"}, {"naam": "Openbaring", "href": "../../openbaring/1/"}], "slugmap": {"Gen": "genesis", "Ex": "exodus", "Lev": "leviticus", "Num": "numeri", "Deut": "deuteronomium", "Joz": "jozua", "Richt": "richteren", "Ruth": "ruth", "1 Sam": "1-samuel", "2 Sam": "2-samuel", "1 Kon": "1-koningen", "2 Kon": "2-koningen", "1 Kron": "1-kronieken", "2 Kron": "2-kronieken", "Ezra": "ezra", "Neh": "nehemia", "Est": "esther", "Job": "job", "Ps": "psalmen", "Spr": "spreuken", "Pred": "prediker", "Hoogl": "hooglied", "Jes": "jesaja", "Jer": "jeremia", "Klaagl": "klaagliederen", "Ezech": "ezechiel", "Dan": "daniel", "Hos": "hosea", "Joël": "joel", "Amos": "amos", "Obadja": "obadja", "Jona": "jona", "Micha": "micha", "Nahum": "nahum", "Hab": "habakuk", "Zef": "zefanja", "Hagg": "haggai", "Zach": "zacharia", "Mal": "maleachi", "Matt": "mattheus", "Mark": "markus", "Luk": "lukas", "Joh": "johannes", "Hand": "handelingen", "Rom": "romeinen", "1 Kor": "1-korinthe", "2 Kor": "2-korinthe", "Gal": "galaten", "Ef": "efeze", "Fil": "filippenzen", "Kol": "kolossenzen", "1 Tess": "1-thessalonicenzen", "2 Tess": "2-thessalonicenzen", "1 Tim": "1-timotheus", "2 Tim": "2-timotheus", "Tit": "titus", "Filem": "filemon", "Hebr": "hebreeen", "Jak": "jakobus", "1 Petr": "1-petrus", "2 Petr": "2-petrus", "1 Joh": "1-johannes", "2 Joh": "2-johannes", "3 Joh": "3-johannes", "Judas": "judas", "Openb": "openbaring"}}, "vertalingen": {"SVnu": {"1": "En Joab werd verteld: Zie, de koning huilt en bedrijft rouw over Absalom.", "2": "Toen werd de overwinning op diezelfde dag voor het hele volk tot rouw; want het volk had diezelfde dag horen zeggen: Het smart de koning over zijn zoon.", "3": "En het volk kwam diezelfde dag stiekem de stad binnen, zoals het volk zich wegsteelt, dat beschaamd is wanneer zij in de strijd gevlucht zijn.", "4": "De koning nu had zijn gezicht bedekt, en de koning riep met luide stem: Mijn zoon Absalom, Absalom, mijn zoon, mijn zoon!", "5": "Toen kwam Joab bij de koning in huis, en zei: U hebt vandaag het gezicht van al uw knechten beschaamd gemaakt, terwijl zij vandaag uw leven hebben gered, en het leven van uw zonen en uw dochters, en het leven van uw vrouwen, en het leven van uw bijvrouwen;", "6": "Door hen lief te hebben die u haten, en te haten die u liefhebben; want u geeft vandaag te kennen dat leiders en knechten voor u niets betekenen; want ik merk vandaag dat als Absalom in leven was gebleven, en wij vandaag allemaal dood waren, dat het u dan goed zou uitkomen.", "7": "Zo sta nu op, ga naar buiten, en spreek uw knechten moed in; want ik zweer bij de HEERE: als u niet naar buiten gaat, zal er vannacht niemand bij u blijven! En dat zal erger voor u zijn dan al het kwaad dat u overkomen is vanaf uw jeugd tot nu toe.", "8": "Toen stond de koning op, en ging in de poort zitten. En zij lieten heel het volk weten: Zie, de koning zit in de poort. Toen kwam heel het volk voor de koning, maar Israël was gevlucht, ieder naar zijn tent.", "9": "En heel het volk, in alle stammen van Israël, was onder elkaar aan het twisten en zei: De koning heeft ons gered uit de hand van onze vijanden en hij heeft ons bevrijd uit de hand van de Filistijnen, en nu is hij het land uit gevlucht vanwege Absalom;", "10": "En Absalom, die wij over ons gezalfd hadden, is in de strijd gestorven; waarom zwijgt u dan nu over het terughalen van de koning?", "11": "Toen zond koning David *een bericht* naar Zadok en naar Abjathar, de priesters, en zei: Spreek tegen de oudsten van Juda: Waarom zouden jullie de laatsten zijn om de koning terug te halen naar zijn huis? (Want wat er in heel Israël gezegd werd, was de koning ter ore gekomen in zijn huis.)", "12": "U bent mijn broeders; mijn gebeente en mijn vlees bent u; waarom zouden jullie dan de laatsten zijn om de koning terug te halen?", "13": "En tegen Amasa moet u zeggen: Bent u niet mijn gebeente en mijn vlees? God doe mij zo, en meer dan dat, als u niet legeraanvoerder wordt voor mijn aangezicht, alle dagen, in de plaats van Joab.", "14": "Zo boog hij het hart van alle mannen van Juda, als van één man; en zij stuurden een boodschap naar de koning: Keer terug, u en al uw knechten.", "15": "Toen keerde de koning terug, en kwam tot aan de Jordaan; en Juda kwam naar Gilgal, om de koning tegemoet te gaan, om de koning over de Jordaan te brengen.", "16": "En Simeï, de zoon van Gera, een Benjaminiet, die uit Bahurim was, haastte zich, en kwam met de mannen van Juda naar beneden, koning David tegemoet;", "17": "En duizend man van Benjamin met hem; ook Ziba, de knecht van Sauls huis, en zijn vijftien zonen en zijn twintig knechten met hem; en zij trokken vaardig de Jordaan over, voor de koning uit.", "18": "Toen het veer overstak, om het huis van de koning over te brengen, en te doen wat goed was in zijn ogen, viel Simeï, de zoon van Gera, neer voor het gezicht van de koning, toen hij de Jordaan overstak;", "19": "En hij zei tegen de koning: Mijn heer, rekent u mij de schuld niet toe, en gedenkt u niet wat uw knecht verkeerd gedaan heeft, op de dag dat mijn heer de koning uit Jeruzalem wegging, dat de koning het zich ter harte zou nemen.", "20": "Want uw knecht weet zeer goed dat ik gezondigd heb; maar zie, ik ben vandaag gekomen, als eerste van heel het huis van Jozef, om mijn heer de koning tegemoet te gaan.", "21": "Toen antwoordde Abisai, de zoon van Zeruja, en zei: Zou Simeï hiervoor niet gedood moeten worden? Hij heeft toch de gezalfde van de HEERE vervloekt?", "22": "Maar David zei: Wat heb ik met u te maken, zonen van Zeruja, dat u mij vandaag tot tegenstander zou willen zijn? Zou er vandaag iemand gedood moeten worden in Israël? Want weet ik niet dat ik vandaag koning geworden ben over Israël?", "23": "En de koning zei tegen Simeï: U zult niet sterven. En de koning zwoer het hem.", "24": "Mefiboseth, Sauls zoon, kwam ook de koning tegemoet; en hij had zijn voeten niet verzorgd, noch zijn baard geknipt, noch zijn kleren gewassen, vanaf de dag dat de koning weggegaan was, tot de dag dat hij met vrede terugkwam.", "25": "En het gebeurde, toen hij in Jeruzalem de koning tegemoet kwam, dat de koning tegen hem zei: Waarom bent u niet met mij meegegaan, Mefiboseth?", "26": "En hij zei: Mijn heer koning, mijn knecht heeft mij bedrogen; want uw knecht zei: Ik zal voor mij een ezel zadelen, en daarop rijden, en naar de koning trekken, want uw knecht is kreupel.", "27": "Bovendien heeft hij uw knecht bij mijn heer de koning valselijk beschuldigd; maar mijn heer de koning is als een engel van God; doe dan wat goed is in uw ogen.", "28": "Want heel mijn vaders huis was voor mijn heer de koning niets anders dan mensen die de dood verdienen; toch hebt u uw knecht een plaats gegeven onder hen die aan uw tafel eten; wat recht heb ik dan nog om verder te klagen bij de koning?", "29": "Toen zei de koning tegen hem: Waarom spreekt u nog meer over uw zaken? Ik heb gezegd: U en Ziba, verdeel het land.", "30": "En Mefiboseth zei tegen de koning: Laat hem het ook helemaal maar nemen, nu mijn heer de koning met vrede in zijn huis is teruggekomen.", "31": "Barzillai, de Gileadiet, kwam ook naar beneden uit Rogelim; en hij trok met de koning de Jordaan over, om hem over de Jordaan te begeleiden.", "32": "Barzillai nu was zeer oud, een man van tachtig jaar; en hij had de koning van voedsel voorzien toen hij in Mahanaïm verbleef; want hij was een zeer belangrijk man.", "33": "En de koning zei tegen Barzillai: Trek met mij mee, en ik zal u bij mij in Jeruzalem onderhouden.", "34": "Maar Barzillai zei tegen de koning: Hoeveel dagen zullen de jaren van mijn leven nog duren, dat ik met de koning zou optrekken naar Jeruzalem?", "35": "Ik ben vandaag tachtig jaar oud; zou ik nog kunnen onderscheiden tussen goed en kwaad? Zou uw knecht kunnen proeven wat ik eet en wat ik drink? Zou ik nog kunnen horen naar de stem van zangers en zangeressen? En waarom zou uw knecht mijn heer de koning nog langer tot last zijn?", "36": "Uw knecht zal maar een klein stukje met de koning de Jordaan overgaan; waarom toch zou de koning mij zo'n beloning geven?", "37": "Laat uw knecht toch terugkeren, zodat ik sterf in mijn eigen stad, bij het graf van mijn vader en mijn moeder; maar zie, daar is uw knecht Chimham, laat hem met mijn heer de koning meetrekken, en doe met hem wat goed is in uw ogen.", "38": "Toen zei de koning: Chimham zal met mij meetrekken, en ik zal met hem doen wat goed is in uw ogen; ja, alles wat u van mij zult verlangen, zal ik voor u doen.", "39": "Toen nu heel het volk de Jordaan overgegaan was, en de koning ook overgegaan was, kuste de koning Barzillai, en zegende hem; en die keerde terug naar zijn woonplaats.", "40": "En de koning trok verder naar Gilgal, en Chimham trok met hem mee; en heel het volk van Juda had de koning over de Jordaan geholpen, evenals de helft van het volk van Israël.", "41": "En zie, alle mannen van Israël kwamen naar de koning; en zij zeiden tegen de koning: Waarom hebben onze broeders, de mannen van Juda, u gestolen, en hebben zij de koning en zijn huis over de Jordaan gebracht, en alle mannen van David met hem?", "42": "Toen antwoordden alle mannen van Juda de mannen van Israël: Omdat de koning ons nauw verwant is; en waarom zijn jullie nu boos over deze zaak? Hebben wij dan ook maar iets gegeten op kosten van de koning, of heeft hij ons een geschenk gegeven?", "43": "En de mannen van Israël antwoordden de mannen van Juda, en zeiden: Wij hebben tien delen aan de koning, en ook aan David hebben wij, meer dan jullie, recht; waarom hebben jullie ons dan geringschat, zodat ons woord niet het eerste geweest is bij het terughalen van onze koning? Maar het woord van de mannen van Juda was harder dan het woord van de mannen van Israël."}, "SV": {"1": "En Joab werd aangezegd: Zie, de koning weent, en bedrijft rouw over Absalom.", "2": "Toen werd de verlossing te dienzelven dage het ganse volk tot rouw; want het volk had te dienzelven dage horen zeggen: Het smart den koning over zijn zoon.", "3": "En het volk kwam te dienzelven dage steelsgewijze in de stad, gelijk als het volk zich wegsteelt, dat beschaamd is, wanneer zij in den strijd gevloden zijn.", "4": "De koning nu had zijn aangezicht toegewonden, en de koning riep met luider stem: Mijn zoon Absalom, Absalom, mijn zoon, mijn zoon!", "5": "Toen kwam Joab tot den koning in het huis, en zeide: Gij hebt heden beschaamd het aangezicht van al uw knechten, die uw ziel, en de ziel uwer zonen en uwer dochteren, en de ziel uwer vrouwen, en de ziel uwer bijwijven heden hebben bevrijd;", "6": "Liefhebbende die u haten, en hatende die u liefhebben; want gij geeft heden te kennen, dat oversten en knechten bij u niets zijn; want ik merk heden, dat zo Absalom leefde, en wij heden allen dood waren, dat het alsdan recht zou zijn in uw ogen.", "7": "Zo sta nu op, ga uit, en spreek naar het hart uwer knechten; want ik zweer bij den HEERE, als gij niet uitgaat, zo er een man dezen nacht bij u zal vernachten! En dit zal u kwader zijn, dan al het kwaad, dat over u gekomen is van uw jeugd af tot nu toe.", "8": "Toen stond de koning op, en zette zich in de poort. En zij lieten al het volk weten, zeggende: Ziet, de koning zit in de poort. Toen kwam al het volk voor des konings aangezicht, maar Israël was gevloden, een iegelijk naar zijn tenten.", "9": "En al het volk, in alle stammen van Israël, was onder zich twistende, zeggende: De koning heeft ons gered van de hand onzer vijanden en hij heeft ons bevrijd van de hand der Filistijnen, en nu is hij uit het land gevlucht voor Absalom;", "10": "En Absalom, die wij over ons gezalfd hadden, is in den strijd gestorven; nu dan, waarom zwijgt gijlieden van den koning weder te halen?", "11": "Toen zond de koning David tot Zadok en tot Abjathar, de priesteren, zeggende: Spreekt tot de oudsten van Juda, zeggende: Waarom zoudt gijlieden de laatsten zijn, om den koning weder te halen in zijn huis? (Want de rede van het ganse Israël was tot den koning gekomen in zijn huis.)", "12": "Gij zijt mijn broederen; mijn been en mijn vlees zijt gij; waarom zoudt gij dan de laatsten zijn, om den koning weder te halen?", "13": "En tot Amasa zult gijlieden zeggen: Zijt gij niet mijn been en mijn vlees? God doe mij zo, en doe er zo toe, zo gij niet krijgsoverste zult zijn voor mijn aangezicht, te allen dage, in Joabs plaats.", "14": "Alzo neigde hij het hart aller mannen van Juda, als van een enigen man; en zij zonden henen tot den koning, *zeggende*: Keer weder, gij en al uw knechten.", "15": "Toen keerde de koning weder, en kwam tot aan de Jordaan; en Juda kwam te Gilgal, om den koning tegemoet te gaan, dat zij den koning over de Jordaan voerden.", "16": "En Simeï, de zoon van Gera, een zoon van Jemini, die van Bahurim was, haastte zich, en kwam af met de mannen van Juda, den koning David tegemoet;", "17": "En duizend man van Benjamin met hem; ook Ziba, de knecht van Sauls huis, en zijn vijftien zonen en zijn twintig knechten met hem; en zij togen vaardiglijk over de Jordaan, voor den koning.", "18": "Als nu de pont overvoer, om het huis des konings over te halen, en te doen, wat goed was in zijn ogen, zo viel Simeï, de zoon van Gera, neder voor het aangezicht des konings, als hij over de Jordaan voer;", "19": "En hij zeide tot den koning: Mijn heer rekene mij niet toe de misdaad, en gedenke niet, wat uw knecht verkeerdelijk gedaan heeft, te dien dage, als mijn heer de koning uit Jeruzalem uitging, dat het de koning zich ter harte zoude nemen.", "20": "Want uw knecht weet *het* zekerlijk, ik heb gezondigd; doch zie, ik ben heden gekomen, de eerste van het ganse huis van Jozef, om mijn heer den koning tegemoet af te komen.", "21": "Toen antwoordde Abisai, de zoon van Zeruja, en zeide: Zou dan Simeï hiervoor niet gedood worden? Zo hij toch den gezalfde des HEEREN gevloekt heeft.", "22": "Maar David zeide: Wat heb ik met ulieden te doen, gij zonen van Zeruja! Dat gij mij heden ten satan zoudt zijn? Zou heden iemand gedood worden in Israël? Want weet ik niet, dat ik heden koning geworden ben over Israël?", "23": "En de koning zeide tot Simeï: Gij zult niet sterven. En de koning zwoer hem.", "24": "Mefiboseth, Sauls zoon, kwam ook af den koning tegemoet; en hij had zijn voeten niet schoon gemaakt, noch zijn knevelbaard beschoren, noch zijn klederen gewassen, van dien dag af, dat de koning was weggegaan, tot dien dag toe, dat hij met vrede wederkwam.", "25": "En het geschiedde, als hij te Jeruzalem den koning tegemoet kwam, dat de koning tot hem zeide: Waarom zijt gij niet met mij getogen, Mefiboseth?", "26": "En hij zeide: Mijn heer koning, mijn knecht heeft mij bedrogen; want uw knecht zeide: Ik zal mij een ezel zadelen, en daarop rijden, en tot den koning trekken, want uw knecht is kreupel.", "27": "Daartoe heeft hij uw knecht bij mijn heer den koning valselijk aangedragen; doch mijn heer de koning is als een engel Gods; doe dan, wat goed is in uw ogen.", "28": "Want al mijns vaders huis is niet geweest, dan maar lieden des doods voor mijn heer den koning; nochtans hebt gij uw knecht gezet onder degenen, die aan uw tafel eten; wat heb ik dan meer voor gerechtigheid, en meer te roepen aan den koning?", "29": "Toen zeide de koning tot hem: Waarom spreekt gij meer *van* uw zaken? Ik heb gezegd: Gij en Ziba, deelt het land.", "30": "En Mefiboseth zeide tot den koning: Hij neme het ook gans weg, naardien mijn heer de koning met vrede in zijn huis is gekomen.", "31": "Barzillai, de Gileadiet, kwam ook af van Rogelim; en hij toog met den koning over de Jordaan, om hem over de Jordaan te geleiden.", "32": "Barzillai nu was zeer oud, een man van tachtig jaren; en hij had den koning onderhouden, toen hij te Mahanaim zijn verblijf had; want hij was een zeer groot man.", "33": "En de koning zeide tot Barzillai: Trekt gij met mij over, en ik zal u bij mij te Jeruzalem onderhouden.", "34": "Maar Barzillai zeide tot den koning: Hoe veel zullen de dagen der jaren mijns levens zijn, dat ik met den koning zou optrekken naar Jeruzalem?", "35": "Ik ben heden tachtig jaren oud; zou ik kunnen onderscheiden tussen goed en kwaad? Zou uw knecht kunnen smaken, wat ik eet en wat ik drink? Zoude ik meer kunnen horen naar de stem der zangers en zangeressen? En waarom zou uw knecht mijn heer den koning verder tot een last zijn?", "36": "Uw knecht zal maar een weinig met den koning over de Jordaan gaan; waarom toch zou mij de koning zulk een vergelding doen?", "37": "Laat toch uw knecht wederkeren, dat ik sterve in mijn stad, bij het graf mijns vaders en mijner moeder; maar zie, daar is uw knecht Chimham, laat dien met mijn heer den koning overtrekken, en doe hem, wat goed is in uw ogen.", "38": "Toen zeide de koning: Chimham zal met mij overtrekken, en ik zal hem doen, wat goed is in uw ogen; ja, alles, wat gij op mij begeren zult, zal ik u doen.", "39": "Toen nu al het volk over de Jordaan gegaan was, en de koning *ook* was overgegaan, kuste de koning Barzillai, en zegende hem; alzo keerde hij weder naar zijn plaats.", "40": "En de koning toog voort naar Gilgal, en Chimham toog met hem voort; en al het volk van Juda had den koning overgevoerd , als ook een gedeelte van het volk Israëls.", "41": "En ziet, alle mannen van Israël kwamen tot den koning; en zij zeiden tot den koning: Waarom hebben u onze broeders, de mannen van Juda, gestolen, en hebben den koning en zijn huis over de Jordaan gevoerd, en alle mannen Davids met hem?", "42": "Toen antwoordden alle mannen van Juda tegen de mannen van Israël: Omdat de koning ons na verwant is; en waarom zijt gij nu toornig over deze zaak? Hebben wij dan enigszins gegeten van des konings *kost*, of heeft hij ons een geschenk geschonken?", "43": "En de mannen van Israël antwoordden den mannen van Juda, en zeiden: Wij hebben tien delen aan den koning, en ook aan David, wij, meer dan gij; waarom hebt gij ons dan gering geacht, dat ons woord niet het eerste geweest is, om onzen koning weder te halen? Maar het woord der mannen van Juda was harder dan het woord der mannen van Israël."}, "KJV": {"1": "And it was told Joab, Behold, the king weepeth and mourneth for Absalom.", "2": "And the victory that day was turned into mourning unto all the people: for the people heard say that day how the king was grieved for his son.", "3": "And the people gat them by stealth that day into the city, as people being ashamed steal away when they flee in battle.", "4": "But the king covered his face, and the king cried with a loud voice, O my son Absalom, O Absalom, my son, my son!", "5": "And Joab came into the house to the king, and said, Thou hast shamed this day the faces of all thy servants, which this day have saved thy life, and the lives of thy sons and of thy daughters, and the lives of thy wives, and the lives of thy concubines;", "6": "In that thou lovest thine enemies, and hatest thy friends. For thou hast declared this day, that thou regardest neither princes nor servants: for this day I perceive, that if Absalom had lived, and all we had died this day, then it had pleased thee well.", "7": "Now therefore arise, go forth, and speak comfortably unto thy servants: for I swear by the LORD, if thou go not forth, there will not tarry one with thee this night: and that will be worse unto thee than all the evil that befell thee from thy youth until now.", "8": "Then the king arose, and sat in the gate. And they told unto all the people, saying, Behold, the king doth sit in the gate. And all the people came before the king: for Israel had fled every man to his tent.", "9": "And all the people were at strife throughout all the tribes of Israel, saying, The king saved us out of the hand of our enemies, and he delivered us out of the hand of the Philistines; and now he is fled out of the land for Absalom.", "10": "And Absalom, whom we anointed over us, is dead in battle. Now therefore why speak ye not a word of bringing ➔ the king back?", "11": "And king David sent to Zadok and to Abiathar the priests, saying, Speak unto the elders of Judah, saying, Why are ye the last to bring ➔ the king back to his house? seeing the speech of all Israel is come to the king, even to his house.", "12": "Ye are my brethren, ye are my bones and my flesh: wherefore then are ye the last to bring back the king?", "13": "And say ye to Amasa, Art thou not of my bone, and of my flesh? God do so to me, and more also, if thou be not captain of the host before me continually in the room of Joab.", "14": "And he bowed the heart of all the men of Judah, even as the heart of one man; so that they sent this word unto the king, Return thou, and all thy servants.", "15": "So the king returned, and came to Jordan. And Judah came to Gilgal, to go to meet the king, to conduct ➔ the king over Jordan.", "16": "And Shimei the son of Gera, a Benjamite, which was of Bahurim, hasted and came down with the men of Judah to meet king David.", "17": "And there were a thousand men of Benjamin with him, and Ziba the servant of the house of Saul, and his fifteen sons and his twenty servants with him; and they went over Jordan before the king.", "18": "And there went over a ferry boat to carry over the king's household, and to do what he thought good. And Shimei the son of Gera fell down before the king, as he was come over Jordan;", "19": "And said unto the king, Let not my lord impute iniquity unto me, neither do thou remember that which thy servant did perversely the day that my lord the king went out of Jerusalem, that the king should take it to his heart.", "20": "For thy servant doth know that I have sinned: therefore, behold, I am come the first this day of all the house of Joseph to go down to meet my lord the king.", "21": "But Abishai the son of Zeruiah answered and said, Shall not Shimei be put to death for this, because he cursed the LORD'S anointed?", "22": "And David said, What have I to do with you, ye sons of Zeruiah, that ye should this day be adversaries unto me? shall there any man be put to death this day in Israel? for do not I know that I am this day king over Israel?", "23": "Therefore the king said unto Shimei, Thou shalt not die. And the king sware unto him.", "24": "And Mephibosheth the son of Saul came down to meet the king, and had neither dressed his feet, nor trimmed his beard, nor washed his clothes, from the day the king departed until the day he came again in peace.", "25": "And it came to pass, when he was come to Jerusalem to meet the king, that the king said unto him, Wherefore wentest not thou with me, Mephibosheth?", "26": "And he answered, My lord, O king, my servant deceived me: for thy servant said, I will saddle me an ass, that I may ride thereon, and go to the king; because thy servant is lame.", "27": "And he hath slandered thy servant unto my lord the king; but my lord the king is as an angel of God: do therefore what is good in thine eyes.", "28": "For all of my father's house were but dead men before my lord the king: yet didst thou set thy servant among them that did eat at thine own table. What right therefore have I yet to cry any more unto the king?", "29": "And the king said unto him, Why speakest thou any more of thy matters? I have said, Thou and Ziba divide the land.", "30": "And Mephibosheth said unto the king, Yea, let him take all, forasmuch as my lord the king is come again in peace unto his own house.", "31": "And Barzillai the Gileadite came down from Rogelim, and went over Jordan with the king, to conduct him over Jordan.", "32": "Now Barzillai was a very aged man, even fourscore years old: and he had provided the king of sustenance while he lay at Mahanaim; for he was a very great man.", "33": "And the king said unto Barzillai, Come thou over with me, and I will feed thee with me in Jerusalem.", "34": "And Barzillai said unto the king, How long have I to live, that I should go up with the king unto Jerusalem?", "35": "I am this day fourscore years old: and can I discern between good and evil? can thy servant taste what I eat or what I drink? can I hear any more the voice of singing men and singing women? wherefore then should thy servant be yet a burden unto my lord the king?", "36": "Thy servant will go ➔ a little way over Jordan with the king: and why should the king recompense it me with such a reward?", "37": "Let thy servant, I pray thee, turn back again, that I may die in mine own city, and be buried by the grave of my father and of my mother. But behold thy servant Chimham; let him go over with my lord the king; and do to him what shall seem good unto thee.", "38": "And the king answered, Chimham shall go over with me, and I will do to him that which shall seem good unto thee: and whatsoever thou shalt require of me, that will I do for thee.", "39": "And all the people went over Jordan. And when the king was come over, the king kissed Barzillai, and blessed him; and he returned unto his own place.", "40": "Then the king went on to Gilgal, and Chimham went on with him: and all the people of Judah conducted the king, and also half the people of Israel.", "41": "And, behold, all the men of Israel came to the king, and said unto the king, Why have our brethren the men of Judah stolen thee away, and have brought the king, and his household, and all David's men with him, over Jordan?", "42": "And all the men of Judah answered the men of Israel, Because the king is near of kin to us: wherefore then be ye angry for this matter? have we eaten at all of the king's cost? or hath he given us any gift?", "43": "And the men of Israel answered the men of Judah, and said, We have ten parts in the king, and we have also more right in David than ye: why then did ye despise us, that our advice sho twoord terug en zei: Wat deel hebben wij aan David? Ja, wij hebben geen erfdeel aan de zoon van Isaï; naar uw tenten, o Israël! Zie nu naar uw eigen huis om, o David! Zo ging Israël naar zijn tenten.", "Richt 12:1-6": "Toen werden de mannen van Efraïm bijeengeroepen, en zij trokken naar het noorden; en zij zeiden tegen Jeftha: Waarom bent u doorgetrokken om te strijden tegen de kinderen van Ammon, en hebt u ons niet geroepen om met u mee te gaan? Wij zullen uw huis boven u met vuur verbranden. En Jeftha zei tegen hen: Ik en mijn volk waren in hevige strijd met de kinderen van Ammon; en ik heb u geroepen, maar u hebt mij niet uit hun hand verlost. Toen ik nu zag dat u mij niet verloste, zette ik mijn leven op het spel en trok tegen de kinderen van Ammon, en de HEERE gaf hen in mijn hand; waarom bent u dan vandaag naar mij toegekomen om tegen mij te strijden?", "Luk 6:38": "Geef, en u zal gegeven worden; een goede, ingedrukte, geschudde en overlopende maat zal men in uw schoot geven; want met dezelfde maat waarmee u meet, zal u weer gemeten worden.", "Job 34:18": "Zou men tot een koning zeggen: U bent Belial; tot de vorsten: U bent goddelozen!", "1 Kon 2:8": "En zie, bij u is Simeï, de zoon van Gera, de zoon van Jemini, uit Bahurim, die mij vervloekte met een zware vloek, op de dag dat ik naar Mahanaïm ging; maar hij kwam mij tegemoet bij de Jordaan, en ik zwoer hem bij de HEERE en zei: Ik zal u niet met het zwaard doden!", "Ps 95:1": "Komt, laat ons de HEERE vrolijk zingen; laat ons juichen voor de Rotssteen van ons heil.", "Jer 41:5": "Zo kwamen er mannen van Sichem, van Silo, en van Samaria, tachtig man, met de baard afgeschoren, en de kleren gescheurd, en zichzelf gesneden; en spijsoffer en wierook waren in hun hand, om naar het huis van de HEERE te brengen.", "1 Kron 15:24": "En Sebanja, en Josafat, en Nethaneel, en Amasai, en Zecharja, en Benaja, en Eliëzer, de priesters, bliezen op trompetten voor de ark van God; en Obed-edom en Jehia waren poortwachters van de ark.", "Pred 12:1": "Denk aan uw Schepper in de dagen van uw jeugd, voordat de kwade dagen komen en de jaren naderen waarvan u zult zeggen: Ik heb er geen vreugde in.", "Joz 5:9": "Verder zei de HEERE tegen Jozua: Vandaag heb Ik de smaad van Egypte van u afgewenteld; daarom noemde men de naam van die plaats Gilgal, tot op deze dag.", "2 Sam 14:20": "Om de zaak zo een andere gestalte te geven, dat heeft uw dienaar Joab gedaan; maar mijn heer is wijs, met de wijsheid van een Engel van God, om alles te doorzien wat op de aarde is.", "Spr 16:15": "In het licht van het gezicht van de koning is leven; en zijn welbehagen is als een wolk van de late regen.", "1 Kon 1:40": "En al het volk kwam achter hem aan omhoog, en het volk speelde op fluiten, en verblijdde zich met grote blijdschap, zodat de aarde van hun geluid barstte.", "2 Sam 14:1": "Joab, de zoon van Zeruja, merkte dat het hart van de koning naar Absalom uitging.", "Gen 49:29": "Daarna gaf hij hun een opdracht, en zei tegen hen: Ik word verzameld tot mijn volk: begraaf mij bij mijn vaders, in de spelonk die is in de akker van Efron, de Hethiet;", "Ps 144:9": "O God, ik zal U een nieuw lied zingen; met de luit en het tiensnarig instrument zal ik U lofzingen.", "1 Kon 2:42": "Toen stuurde de koning, en riep Simeï, en zei tegen hem: Heb ik u niet beëdigd bij de HEERE, en tegen u verklaard: Op de dag dat u weggaat, en naar hier of daar gaat, weet u zeker, dat u zult sterven? En u zei tegen mij: Dat woord is goed, dat heb ik gehoord.", "Ps 110:2": "De HEERE zal de scepter van Uw sterkte zenden uit Sion, en zeggen: Heers in het midden van Uw vijanden.", "Ps 148:12": "Jongemannen en ook meisjes; oude mensen met de jongeren!", "2 Kron 20:22": "Toen zij nu begonnen met vreugdegeroep en lofzang, stelde de HEERE hinderlagen tegen de kinderen van Ammon, Moab, en die van het gebergte Seir, die tegen Juda gekomen waren; en zij werden verslagen.", "Ps 39:7": "Zeker, de mens wandelt als in een beeld, zeker, zij maken zich druk voor niets; men brengt bijeen, en men weet niet, wie het naar zich toe zal halen.", "Spr 6:5": "red uzelf, als een ree uit de hand van de jager, en als een vogel uit de hand van de vogelvanger.", "2 Kron 5:12": "en de Levieten, die zangers waren, van hen allen, van Asaf, van Heman, van Jeduthun, en van hun zonen, en van hun broeders, in fijn linnen gekleed, met cimbalen, en met luiten, en harpen, stonden aan de oostzijde van het altaar, en met hen tot honderdtwintig priesters toe, die op trompetten trompetten);", "Ps 71:9": "Verwerp mij niet in de tijd van het ouderdom; verlaat mij niet, terwijl mijn kracht vergaat.", "Job 12:12": "In de stokoude is de wijsheid, en in de lengte van de dagen het verstand.", "2 Sam 18:4": "Toen zei de koning tegen hen: Ik zal doen wat goed is in uw ogen. De koning nu ging bij de poort staan, en al het volk trok uit bij honderdtallen en bij duizendtallen.", "2 Sam 16:5": "Toen koning David tot bij Bahurim kwam, zie, daar kwam een man vandaan uit het geslacht van het huis van Saul, van wie de naam Simeï was, de zoon van Gera; hij liep almaar door en vloekte.", "Jer 14:3": "En hun voortreffelijken zenden hun kleinen naar water; zij komen bij de putten, zij vinden geen water, zij komen met hun vaten leeg terug; zij zijn beschaamd, ja, worden schaamrood, en bedekken hun hoofd.", "Ps 92:15": "In de grijze ouderdom zullen zij nog vruchten dragen; zij zullen vet en groen zijn,", "2 Sam 16:3": "Toen zei de koning: Waar is dan de zoon van uw heer? En Ziba zei tegen de koning: Zie, hij blijft in Jeruzalem, want hij zei: Vandaag zal het huis van Israël mij het koninkrijk van mijn vader teruggeven.", "Hand 20:37": "En er ontstond een groot geween bij hen allen; en zij vielen Paulus om de hals en kusten hem;", "Ps 135:3": "Looft de HEERE, want de HEERE is goed; zingt psalmen voor Zijn Naam, want Hij is liefelijk.", "Ps 32:2": "Gelukkig is de mens, die de HEERE de ongerechtigheid niet toerekent, en in wiens geest geen bedrog is.", "2 Sam 19:1-6": "En Joab werd verteld: Zie, de koning huilt en bedrijft rouw over Absalom. Toen werd de overwinning op diezelfde dag voor het hele volk tot rouw; want het volk had diezelfde dag horen zeggen: Het smart de koning over zijn zoon. En het volk kwam diezelfde dag stiekem de stad binnen, zoals het volk zich wegsteelt, dat beschaamd is wanneer zij in de strijd gevlucht zijn.", "1 Sam 11:13": "Maar Saul zei: Er zal op deze dag geen man gedood worden, want de HEERE heeft heden een verlossing in Israël bewerkt.", "2 Kron 20:19": "En de Levieten uit de kinderen van de Kahathieten en uit de kinderen van de Korachieten stonden op om de HEERE, de God van Israël, met luide stem uitbundig te prijzen.", "Jes 14:11": "Uw hoogmoed is in het rijk van de dood neergestort, met het geschal van uw luiten; de maden zullen onder u gestrooid worden, en de wormen zullen u bedekken.", "Spr 16:31": "Grijs haar is een sierlijke kroon; zij wordt gevonden op de weg van de gerechtigheid.", "2 Sam 17:24": "David nu kwam te Mahanaïm, en Absalom trok de Jordaan over, hij en alle mannen van Israël met hem.", "Ps 150:1-6": "Halleluja! Loof God in Zijn heiligdom; loof Hem in het uitspansel van Zijn sterkte! Loof Hem vanwege Zijn machtige daden; loof Hem naar de overvloed van Zijn grootheid! Loof Hem met geschal van de bazuin; loof Hem met de luit en met de harp!", "Dan 3:7": "Daarom, op dat moment, toen al die volken het geluid hoorden van de hoorn, de pijp, de citer, de vedel, de psalters, en allerlei soorten muziek, vielen alle volken, naties en tongen neer en aanbaden het gouden beeld, dat de koning Nebukadnezar had opgericht.", "2 Sam 15:35": "En zijn niet Zadok en Abjathar, de priesters, daar bij u? Zo zal het gebeuren, dat u alles wat u uit het huis van de koning zult horen, aan de priesters, Zadok en Abjathar, zult bekendmaken.", "Richt 8:1": "Toen zeiden de mannen van Efraïm tegen hem: Wat is dit voor iets dat u ons hebt aangedaan, dat u ons niet riep toen u wegging om te strijden tegen de Midianieten? En zij verweten hem dat heftig.", "2 Tess 3:9": "Niet dat wij de macht niet hebben, maar opdat wij onszelf u zouden geven tot een voorbeeld, om ons na te volgen.", "Ps 71:18": "Daarom ook, terwijl het ouderdom en de grijsheid daar zijn, verlaat mij niet, o God, totdat ik aan dit geslacht Uw arm verkondig, aan alle nakomelingen Uw macht.", "2 Sam 19:26-29": "En hij zei: Mijn heer koning, mijn knecht heeft mij bedrogen; want uw knecht zei: Ik zal voor mij een ezel zadelen, en daarop rijden, en naar de koning trekken, want uw knecht is kreupel. Bovendien heeft hij uw knecht bij mijn heer de koning valselijk beschuldigd; maar mijn heer de koning is als een engel van God; doe dan wat goed is in uw ogen. Want heel mijn vaders huis was voor mijn heer de koning niets anders dan mensen die de dood verdienen; toch hebt u uw knecht een plaats gegeven onder hen die aan uw tafel eten; wat recht heb ik dan nog om verder te klagen bij de koning?", "Rom 4:6-8": "Zoals ook David de mens gelukkig noemt, aan wie God de rechtvaardigheid toerekent zonder werken: En zei: Gelukkig zijn zij wier ongerechtigheden vergeven zijn, en wier zonden bedekt zijn; Gelukkig is de man, aan wie de Heere de zonden niet toerekent.", "2 Kon 8:3": "En het gebeurde na het einde van de zeven jaar, dat de vrouw uit het land van de Filistijnen terugkeerde; en zij ging naar de koning om te smeken voor haar huis en voor haar akker.", "1 Kron 2:3-17": "De kinderen van Juda zijn: Er, en Onan, en Sela; drie zijn hem geboren van de dochter van Sua, de Kanaänietische; en Er, de eerstgeborene van Juda, was slecht in de ogen van de HEERE; daarom doodde Hij hem. Maar Thamar, zijn schoondochter, baarde hem Perez en Zerah. Al de zonen van Juda waren vijf. De kinderen van Perez waren Hezron en Hamul.", "Ex 12:4": "Maar als een huis te klein is voor een lam, dan moet hij het samen met zijn buurman, die het dichtst bij zijn huis woont, nemen, naar het aantal zielen; ieder naar wat hij eten kan, zo moet u het rekenen voor het lam.", "Richt 20:1": "Toen trokken alle kinderen van Israël uit, en de gemeenschap verzamelde zich, als één man, van Dan af tot Ber-seba toe, ook het land van Gilead, tot de HEERE te Mizpa.", "Jer 22:23": "O u, die nu op de Libanon woont, en in de ceders nestelt! hoe genadig zult u zijn, als de smarten u zullen overkomen, de pijn als van een barende vrouw!", "2 Sam 3:30": "Zo hebben Joab en zijn broer Abisaï Abner doodgeslagen, omdat hij hun broer Asaël te Gibeon in de strijd had gedood.", "Ps 95:2": "Laat ons Zijn aangezicht tegemoet gaan met lof; laat ons Hem juichen met psalmen.", "2 Kron 35:25": "En Jeremia maakte een klaaglied over Josia; evenzo spraken alle zangers en zangeressen in hun klaagliederen van Josia, tot op deze dag; want zij gaven ze tot een inzetting in Israël; en zie, zij zijn geschreven in de klaagliederen.", "Gen 48:21": "Daarna zei Israël tegen Jozef: Zie, ik sterf; maar God zal met u zijn, en Hij zal u terugbrengen naar het land van uw vaders.", "Jer 41:17": "En zij trokken weg, en vestigden zich te Geruth-Chimham, dat bij Bethlehem is, om verder te trekken, om naar Egypte te gaan,", "Ps 82:2": "Hoelang zult u onrecht oordelen, en het aangezicht van de goddelozen aannemen? Sela.", "Spr 19:9": "Een vals getuige zal niet onschuldig blijven; en die leugens waait, zal vergaan.", "Gen 2:23": "Toen zei Adam: Dit is ditmaal been van mijn benen, en vlees van mijn vlees! Men zal haar Manninne noemen, omdat zij uit de man genomen is.", "1 Kon 12:25": "Jerobeam nu bouwde Sichem op het gebergte van Efraïm, en woonde daarin, en trok van daar verder, en bouwde Penuël.", "2 Kron 31:2": "En Hizkia stelde de verdelingen van de priesters en de Levieten in, naar hun verdelingen, ieder naar zijn dienst, de priesters en de Levieten voor het brandoffer en voor de dankoffers, om te dienen, en om te loven, en om te prijzen in de poort van de legerplaatsen van de HEERE;", "Jer 9:4": "Wacht u, ieder voor zijn vriend, en vertrouw niet op enige broeder; want elke broeder doet niet dan bedriegen, en elke vriend gaat om met achterklap.", "1 Kron 22:5": "Want David zei: Mijn zoon Salomo is een jongeman en teder; en het huis dat men voor de HEERE bouwen zal, moet buitengewoon groot gemaakt worden, tot een naam en tot glorie in alle landen; ik zal er nu voorraad voor bereiden. Zo bereidde David voorraad in overvloed voor zijn dood.", "Job 30:31": "Hierom is mijn harp tot een rouwklacht geworden, en mijn orgel tot een stem van hen die wenen.", "Filem 1:1": "Paulus, een gevangene van Christus Jezus, en Timotheüs, de broeder, aan Filemon, de geliefde, en onze medearbeider,", "Jes 15:2": "Hij trekt op naar Baith en Dibon, naar de hoogten, om te wenen; over Nebo en over Medeba zal Moab huilen; op al hun hoofden is kaalheid, ieders baard is afgesneden.", "2 Kor 5:19": "Want God was in Christus de wereld met Zichzelf aan het verzoenen, doordat Hij hun zonden hun niet toerekende; en Hij heeft het woord van de verzoening in ons gelegd.", "2 Sam 18:5": "En de koning gaf bevel aan Joab, en Abisai, en Ithai, en zei: Ga zachtzinnig om met de jongeman, met Absalom. En al het volk hoorde het, toen de koning aan alle leiders bevel gaf over de zaak van Absalom.", "Jes 5:12": "En harp en luit, tamboerijn en fluit, en wijn zijn bij hun feesten; maar zij letten niet op het werk van de HEERE, en zij zien niet op het maaksel van Zijn handen.", "2 Sam 16:9-13": "Toen zei Abisai, de zoon van Zeruja, tegen de koning: Waarom zou deze dode hond mijn heer de koning vloeken? Laat mij toch oversteken en zijn kop wegnemen. Maar de koning zei: Wat heb ik met u te doen, zonen van Zeruja? Ja, laat hem vloeken; want de HEERE heeft immers tegen hem gezegd: Vloek David; wie zou dan zeggen: Waarom hebt u dat gedaan? Verder zei David tegen Abisai en tegen al zijn knechten: Zie, mijn zoon, die uit mijn lijf is voortgekomen, zoekt mijn leven; hoeveel te meer dan nu deze zoon van Jemini? Laat hem begaan, laat hij vloeken, want de HEERE heeft het hem gezegd.", "2 Sam 18:13": "Of had ik uit valsheid tegen mijn eigen leven gehandeld? Want geen ding blijft voor de koning verborgen; ook u zelf zou u er dan tegenover mij van afzijdig gehouden hebben.", "1 Sam 26:11": "De HEERE late het verre van mij zijn, dat ik mijn hand zou leggen aan de gezalfde van de HEERE! Neem toch nu de speer die bij zijn hoofdeinde ligt, en de waterfles, en laten we gaan.", "Ps 135:1": "Halleluja! Prijst de Naam van de HEERE, prijst Hem, u knechten van de HEERE!", "Ezra 2:64": "Deze hele gemeente samen was tweeënveertigduizend driehonderdzestig.", "Luk 2:37": "En zij was een weduwe van ongeveer vierentachtig jaar, die niet week uit de tempel, maar God diende met vasten en bidden, nacht en dag.", "1 Kron 12:18": "En de Geest bekleedde Amasai, de leider van de aanvoerders, en hij zei: Wij zijn van u, o David, en met u zijn wij, zoon van Isaï. Vrede, vrede zij u, en vrede uw helpers; want uw God helpt u. Toen nam David hen aan, en stelde hen tot aanvoerders van de benden.", "Ex 18:7": "Toen ging Mozes naar buiten, zijn schoonvader tegemoet, en hij boog zich, en kuste hem; en zij vroegen elkaar naar hun welstand, en zij gingen naar de tent.", "Spr 17:14": "Het begin van het krakeel is als iemand die het water opening geeft; laat daarom de twist varen, voordat hij losbarst.", "Hos 2:13": "Daarom, zie, Ik zal haar lokken, en haar leiden in de woestijn; en Ik zal naar haar hart spreken.", "1 Sam 14:50": "En de naam van Sauls vrouw was Ahinoam, een dochter van Ahimaäz; en de naam van zijn legeraanvoerder was Abner, een zoon van Ner, Sauls oom.", "1 Sam 26:8": "Toen zei Abisai tegen David: God heeft vandaag uw vijand in uw hand gegeven; laat mij hem toch nu met de speer in één keer aan de grond spijkeren, en ik zal het hem geen tweede keer hoeven te doen.", "2 Sam 9:7-13": "En David zei tegen hem: Wees niet bang, want ik zal zeker goedheid aan u bewijzen, omwille van uw vader Jonathan; en ik zal u alle akkers van uw vader Saul teruggeven; en u zult voortdurend brood eten aan mijn tafel. Toen boog hij zich neer, en zei: Wat is uw knecht, dat u omgezien hebt naar een dode hond, zoals ik ben? Toen riep de koning Ziba, de jongen van Saul, en zei tegen hem: Alles wat van Saul geweest is, en zijn hele huis, heb ik aan de zoon van uw heer gegeven.", "Gen 48:14": "Maar Israël strekte zijn rechterhand uit, en legde die op het hoofd van Efraïm, hoewel hij de jongste was, en zijn linkerhand op het hoofd van Manasse; hij stuurde zijn handen met inzicht; want Manasse was de eerstgeborene.", "1 Petr 2:3": "Als u tenminste geproefd hebt dat de Heere goedertieren is.", "Spr 25:20": "Wie liederen zingt bij een treurig hart, is als iemand die een kleed aflegt op de dag van de koude, en als azijn op salpeter.", "Ex 14:19": "En de Engel van God, Die voor het leger van Israël uit ging, vertrok, en ging achter hen; de wolkkolom vertrok ook van voor hun gezicht, en stond achter hen.", "Ps 87:7": "En de zangers, evenals de speellieden, alsook al mijn bronnen, zullen binnen u zijn.", "Ef 5:30": "Want wij zijn leden van Zijn lichaam, van Zijn vlees en van Zijn benen.", "1 Sam 18:25": "Toen zei Saul: Zo zult u tegen David zeggen: De koning heeft geen behoefte aan een bruidsschat, maar aan honderd voorhuiden van de Filistijnen, opdat men zich wreekt op de vijanden van de koning. Want Saul dacht David te doen vallen door de hand van de Filistijnen.", "Gen 47:28": "En Jakob leefde in het land van Egypte zeventien jaar; zodat de dagen van Jakob, de jaren van zijn leven, honderdzevenenveertig jaar geweest zijn.", "2 Sam 4:4": "En Jonathan, Sauls zoon, had een zoon die aan beide voeten gewond was; hij was vijf jaar oud toen het bericht over Saul en Jonathan uit Jizreël kwam; en zijn voedster nam hem op en vluchtte; en het gebeurde, toen zij zich haastte om te vluchten, dat hij viel en kreupel werd; en zijn naam was Mefiboseth.", "Hand 20:24": "Maar ik geef niets om mijn leven, en houd het niet dierbaar voor mijzelf, als ik mijn loop maar met blijdschap mag volbrengen, en de dienst die ik van de Heere Jezus ontvangen heb, om het Evangelie van de genade van God te betuigen.", "Mark 14:26": "En nadat zij de lofzang gezongen hadden, gingen zij naar de Olijfberg.", "Gen 50:26": "En Jozef stierf, honderdtien jaar oud zijnde; en zij balsemden hem, en men legde hem in een kist in Egypte.", "Ps 81:16": "Zij die de HEERE haten, zouden zich Hem geveinsd onderworpen hebben, maar hun tijd zou eeuwig geweest zijn.", "2 Petr 1:14": "Want ik weet dat het afleggen van mijn tent spoedig zal zijn, zoals ook onze Heere Jezus Christus mij heeft geopenbaard.", "1 Kron 25:1": "David, alsook de leiders van het leger, wees af voor de dienst enkele van de kinderen van Asaf, en van Heman, en van Jeduthun, die met harpen, met luiten en met cimbalen zouden profeteren; en zij die onder hen geteld werden, waren mannen die bekwaam waren tot het werk van hun dienst.", "2 Sam 9:11": "En Ziba zei tegen de koning: Naar alles wat mijn heer de koning zijn knecht gebiedt, zo zal uw knecht doen. Ook zou Mefiboseth, etend aan mijn tafel, als een van de zonen van de koning zijn.", "1 Sam 18:5-7": "En David trok uit, overal waar Saul hem zond; hij gedroeg zich voorzichtig, en Saul stelde hem aan over de krijgslieden; en hij was aangenaam in de ogen van het hele volk, en ook in de ogen van de knechten van Saul. Het gebeurde nu, toen zij kwamen, en David terugkeerde van het verslaan van de Filistijn, dat de vrouwen uit al de steden van Israël uitgingen, met gezang en reidansen, koning Saul tegemoet, met tamboerijnen, met vreugde en met muziekinstrumenten. En de vrouwen, spelend, antwoordden elkaar en zeiden: Saul heeft zijn duizenden verslagen, maar David zijn tienduizenden!", "2 Sam 3:16": "En haar man ging met haar mee, huilend achter haar aan lopend, tot Bahurim toe. Toen zei Abner tegen hem: Ga weg, keer terug. En hij keerde terug.", "2 Tim 4:6": "Want ik word al als een drankoffer geofferd, en de tijd van mijn heengaan is nabij.", "Ps 15:3": "Die met zijn tong niet lastert, zijn metgezellen geen kwaad doet, en geen smaad uit over zijn naaste;", "2 Sam 5:3": "Zo kwamen alle oudsten van Israël naar de koning in Hebron; en koning David sloot met hen een verbond in Hebron, voor het aangezicht van de HEERE; en zij zalfden David tot koning over Israël.", "Openb 14:2": "En ik hoorde een stem uit de hemel, als een stem van veel water, en als een stem van een grote donderslag. En ik hoorde een stem van citerspelers, spelend op hun citers;", "Luk 9:54-56": "Toen Zijn discipelen Jakobus en Johannes dit zagen, zeiden zij: Heere, wilt U dat wij zeggen dat er vuur uit de hemel neerdaalt om hen te verslinden, zoals ook Elia gedaan heeft? Maar Hij keerde Zich om, bestrafte hen en zei: U weet niet wat voor geest u hebt. Want de Zoon des mensen is niet gekomen om het leven van mensen te vernietigen, maar om het te behouden. En zij gingen naar een ander dorp.", "Pred 6:6": "Ja, al leefde hij wel tweemaal duizend jaren, en zag hij het goede niet; gaan zij niet allen naar één plaats?", "2 Sam 12:18-23": "En het gebeurde op de zevende dag, dat het kind stierf; en Davids knechten waren bang het hem te vertellen, dat het kind dood was, want zij zeiden: Zie, toen het kind nog leefde, spraken wij tegen hem, maar hij luisterde niet naar onze stem; hoe zullen wij dan tegen hem zeggen: Het kind is dood? Hij zou zichzelf iets kunnen aandoen. Maar David zag dat zijn knechten fluisterden; zo begreep David dat het kind dood was. Toen zei David tegen zijn knechten: Is het kind dood? En zij zeiden: Het is dood. Toen stond David op van de aarde, en waste zich, en zalfde zich, en trok andere kleren aan, en ging naar het huis van de HEERE, en aanbad Hem; daarna kwam hij in zijn eigen huis, en vroeg om brood; en zij zetten hem brood voor, en hij at.", "Amos 8:10": "En Ik zal uw feesten in rouw veranderen, en al uw liederen in weeklacht, en op alle lendenen een zak brengen, en op elk hoofd kaalheid; en Ik zal het land in rouw brengen als over een enige zoon, en het einde ervan als een bittere dag.", "1 Kon 4:23": "Tien vette runderen, en twintig weiderunderen, en honderd schapen; niet meegerekend de herten, en reeën, en buffels, en gemeste vogels.", "1 Kron 8:3": "Bela nu had deze kinderen: Addar, en Gera, en Abihud,", "1 Kron 16:42": "Met hen dan waren Heman en Jeduthun, met trompetten en cimbalen voor hen die zich lieten horen, en met instrumenten van de muziek van God; maar de zonen van Jeduthun waren aan de poort.", "Ezech 33:32": "En zie, u bent voor hen als een liefdeslied, als iemand die mooi zingt of goed op een instrument speelt; daarom horen zij uw woorden, maar zij doen ze niet.", "Spr 6:4": "Laat uw ogen geen slaap toe, en uw oogleden geen sluimering;", "Gen 48:20": "Zo zegende hij hen op die dag, en zei: In u zal Israël zegenen, en zeggen: God stelt u als Efraïm en als Manasse! En hij stelde Efraïm voor Manasse.", "2 Sam 13:20": "En haar broer Absalom zei tegen haar: Is uw broer Amnon bij u geweest? Nu dan, mijn zuster, zwijg stil, hij is uw broer; zet uw hart niet op deze zaak. Zo bleef Thamar, eenzaam, in het huis van haar broer Absalom.", "1 Sam 29:9": "Achis antwoordde en zei tegen David: Ik weet het; voorzeker, u bent aangenaam in mijn ogen, als een engel van God; maar de leiders van de Filistijnen hebben gezegd: Laat hem niet met ons optrekken in deze strijd.", "2 Sam 18:24": "David nu zat tussen de twee poorten; en de wachter ging op het dak van de poort bij de muur staan, en hief zijn ogen op, en zag, en zie, er liep een man alleen.", "Gen 34:3": "En zijn ziel hechtte zich aan Dina, Jakobs dochter; en hij had de jonge vrouw lief, en sprak naar het hart van de jonge vrouw.", "2 Sam 19:24-30": "Mefiboseth, Sauls zoon, kwam ook de koning tegemoet; en hij had zijn voeten niet verzorgd, noch zijn baard geknipt, noch zijn kleren gewassen, vanaf de dag dat de koning weggegaan was, tot de dag dat hij met vrede terugkwam. En het gebeurde, toen hij in Jeruzalem de koning tegemoet kwam, dat de koning tegen hem zei: Waarom bent u niet met mij meegegaan, Mefiboseth? En hij zei: Mijn heer koning, mijn knecht heeft mij bedrogen; want uw knecht zei: Ik zal voor mij een ezel zadelen, en daarop rijden, en naar de koning trekken, want uw knecht is kreupel.", "Matt 6:16": "En wanneer u vast, toon dan geen droevig gezicht, zoals de geveinsden; want zij mismaken hun gezicht, opdat zij door de mensen gezien worden als zij vasten. Voorwaar, Ik zeg u, dat zij hun loon al ontvangen hebben.", "Hebr 6:16": "Want mensen zweren wel bij iemand die groter is dan zij, en de eed tot bevestiging is voor hen een einde van alle tegenspraak;", "Jes 46:4": "En tot de ouderdom toe zal Ik Dezelfde zijn, ja, tot de grijsheid toe zal Ik u dragen; Ik heb het gedaan, en Ik zal u opnemen, en Ik zal dragen en redden.", "Gen 3:12": "Toen zei Adam: De vrouw die U bij mij gegeven hebt, die heeft mij van die boom gegeven, en ik heb gegeten.", "1 Kron 2:17": "En Abigaïl baarde Amasa; en de vader van Amasa was Jether, een Ismaëliet.", "Gen 9:29": "Zo waren al de dagen van Noach negenhonderdvijftig jaren; en hij stierf.", "Neh 12:27-31": "Bij de inwijding nu van de muur van Jeruzalem, zochten zij de Levieten op uit al hun plaatsen, om hen naar Jeruzalem te brengen, om de inwijding te doen met vreugde, en met dankzeggingen, en met gezang, cimbalen, luiten, en met harpen. Zo werden de kinderen van de zangers verzameld, zowel uit het vlakke veld rondom Jeruzalem, als uit de dorpen van de Netofathieten; En uit het huis van Gilgal, en uit de velden van Geba en Asmaveth; want de zangers hadden zich dorpen gebouwd rondom Jeruzalem.", "Richt 3:28": "En hij zei tegen hen: Volg mij na; want de HEERE heeft uw vijanden, de Moabieten, in uw hand gegeven. En zij trokken af, hem na, en namen de doorwaadbare plaatsen van de Jordaan in naar Moab, en lieten niemand oversteken.", "1 Kron 8:5": "En Gera, en Sefufan, en Huram.", "1 Kon 2:26": "En tegen Abjathar, de priester, zei de koning: Ga naar Anathoth, naar uw akkers; want u verdient de dood; maar op deze dag zal ik u niet doden, omdat u de ark van de Heere HEERE gedragen hebt voor het aangezicht van mijn vader David, en omdat u verdrukt bent geweest in alles waarin mijn vader verdrukt was.", "Jes 43:25": "Ik, Ik ben het, Die uw overtredingen uitwis, om Mijnentwil, en Ik denk aan uw zonden niet.", "Job 19:17": "Mijn adem is mijn vrouw vreemd; en ik smeek om de wil van de kinderen van mijn buik.", "2 Sam 2:29": "Abner dan en zijn mannen gingen diezelfde hele nacht over de vlakte; en zij gingen over de Jordaan en trokken heel Bithron door, en kwamen bij Mahanaim.", "Ezra 3:11": "En zij zongen bij beurten, om de HEERE te loven en te danken, omdat Hij goed is en Zijn goedertierenheid tot in eeuwigheid is over Israël. En heel het volk juichte met groot gejuich, toen men de HEERE loofde vanwege de grondlegging van het huis van de HEERE.", "2 Kron 5:13": "het gebeurde dan, toen zij eenparig trompetten en zongen, om één stem te laten horen, terwijl zij de HEERE prezen en loofden; en toen zij de stem verhieven met trompetten, en met cimbalen, en andere muzikale instrumenten, en toen zij de HEERE prezen, omdat Hij goed is, omdat Zijn goedertierenheid tot in eeuwigheid is; dat het huis met een wolk vervuld werd, namelijk het huis van de HEERE.", "1 Kron 19:17": "Toen dit aan David werd bericht, verzamelde hij heel Israël, en trok over de Jordaan, en kwam tot hen, en stelde de slagorde tegen hen op. Toen David de slagorde tegen de Syriërs opgesteld had, streden zij met hem.", "1 Kron 15:27": "David nu was gekleed met een mantel van fijn linnen; ook alle Levieten die de ark droegen, en de zangers, en Chenanja, de leider van het opheffen van de zang; ook had David een lijfrok van linnen aan.", "2 Sam 9:7": "En David zei tegen hem: Wees niet bang, want ik zal zeker goedheid aan u bewijzen, omwille van uw vader Jonathan; en ik zal u alle akkers van uw vader Saul teruggeven; en u zult voortdurend brood eten aan mijn tafel.", "2 Sam 19:1-8": "En Joab werd verteld: Zie, de koning huilt en bedrijft rouw over Absalom. Toen werd de overwinning op diezelfde dag voor het hele volk tot rouw; want het volk had diezelfde dag horen zeggen: Het smart de koning over zijn zoon. En het volk kwam diezelfde dag stiekem de stad binnen, zoals het volk zich wegsteelt, dat beschaamd is wanneer zij in de strijd gevlucht zijn.", "Ruth 1:14": "Toen huilden zij weer luid; en Orpa kuste haar schoonmoeder, maar Ruth bleef bij haar.", "2 Kron 23:13": "En zij keek toe; en zie, de koning stond bij zijn pilaar, bij de ingang; en de leiders en de trompetten waren bij de koning; en heel het volk van het land was blij, en blies op de trompetten; en de zangers waren er met muzikale instrumenten, en gaven aanwijzingen om lof te zingen; toen scheurde Athalia haar kleren, en riep: Verraad, verraad!", "Gen 32:10": "Ik ben geringer dan al de weldaden en al de trouw die U aan Uw knecht bewezen hebt; want met mijn staf ben ik deze Jordaan overgestoken, en nu ben ik tot twee legers geworden!", "1 Kron 29:28": "En hij stierf op hoge leeftijd, verzadigd van dagen, rijkdom en eer; en zijn zoon Salomo regeerde in zijn plaats.", "Luk 2:34": "En Simeon zegende hen, en zei tegen Maria, Zijn moeder: Zie, Deze wordt gezet tot een val en opstanding van velen in Israël, en tot een teken dat weersproken zal worden.", "Rom 12:21": "Word niet door het kwade overwonnen, maar overwin het kwade door het goede.", "2 Sam 3:19": "En Abner sprak ook ten aanhoren van Benjamin. Vervolgens ging Abner ook naar Hebron om ten aanhoren van David alles te vertellen wat goed was in de ogen van Israël, en in de ogen van heel het huis van Benjamin.", "Gal 4:14": "en mijn beproeving¹, die in mijn vlees gebeurde, hebt u niet veracht, en ook niet verafschuwd; maar u nam mij aan als een engel van God, ja, als Christus Jezus.", "Gen 49:29-31": "Daarna gaf hij hun een opdracht, en zei tegen hen: Ik word verzameld tot mijn volk: begraaf mij bij mijn vaders, in de spelonk die is in de akker van Efron, de Hethiet; In de spelonk die op de akker van Machpela is, die tegenover Mamre is, in het land Kanaän, die Abraham met die akker gekocht heeft van Efron, de Hethiet, tot een erfbegrafenis. Daar hebben zij Abraham begraven, en Sara, zijn vrouw; daar hebben zij Izak begraven, en Rebekka, zijn vrouw; en daar heb ik Lea begraven.", "1 Kron 25:6": "Dezen waren allemaal onder leiding van hun vader gesteld tot het gezang van het huis van de HEERE, op cimbalen, luiten, en harpen, tot de dienst van het huis van God, onder leiding van de koning, van Asaf, Jeduthun, en van Heman.", "2 Sam 15:36": "Zie, hun beide zonen zijn daar bij hen, Ahimaäz, de zoon van Zadok, en Jonathan, de zoon van Abjathar; zo zult u door hun hand alles wat u zult horen, naar mij laten overbrengen.", "Gen 3:13": "En de HEERE God zei tegen de vrouw: Wat is dit dat u gedaan hebt? En de vrouw zei: De slang heeft mij bedrogen, en ik heb gegeten.", "2 Kon 14:12": "En Juda werd verslagen voor Israël, en zij vluchtten, ieder naar zijn tent.", "Ps 18:49": "Die mij uithelpt van mijn vijanden; ja, U verhoogt mij boven hen die tegen mij opstaan; U redt mij van de man van het geweld.", "1 Kron 16:41": "En met hen Heman en Jeduthun, en de overige uitgelezen mannen, die met naam uitgedrukt zijn om de HEERE te loven; want Zijn goedertierenheid is tot in eeuwigheid.", "Ps 90:3-10": "U doet de mens wederkeren tot verbrijzeling, en zegt: Keer weder, mensenkinderen! Want duizend jaren zijn in Uw ogen als de dag van gisteren, als hij voorbijgegaan is, en als een nachtwaak. U overstroomt hen; zij zijn gelijk een slaap; in de morgenstond zijn zij gelijk het gras, dat verandert;", "2 Sam 13:25": "Maar de koning zei tegen Absalom: Nee, mijn zoon, laten we toch niet allemaal samen gaan, opdat wij u niet tot last zijn; en hij drong bij hem aan, doch hij wilde niet gaan, maar zegende hem.", "Gen 5:27": "Zo waren al de dagen van Methusalach negenhonderdnegenenzestig jaren; en hij stierf.", "Gen 50:13": "Want zijn zonen voerden hem naar het land Kanaän, en begroeven hem in de spelonk van de akker van Machpela, welke Abraham met de akker gekocht had tot een erfbegrafenis van Efron, de Hethiet, tegenover Mamre.", "Spr 18:19": "Een broeder is moeilijker te winnen dan een sterke stad; en geschillen zijn als de grendel van een paleis.", "1 Sam 18:7": "En de vrouwen, spelend, antwoordden elkaar en zeiden: Saul heeft zijn duizenden verslagen, maar David zijn tienduizenden!", "2 Sam 16:5-13": "Toen koning David tot bij Bahurim kwam, zie, daar kwam een man vandaan uit het geslacht van het huis van Saul, van wie de naam Simeï was, de zoon van Gera; hij liep almaar door en vloekte. En hij gooide David met stenen, en ook alle knechten van koning David, hoewel al het volk en alle helden aan zijn rechter- en aan zijn linkerhand waren. Zo zei Simeï, terwijl hij vloekte: Ga weg, ga weg, man van bloed, en man van Belial!", "2 Sam 19:5-7": "Toen kwam Joab bij de koning in huis, en zei: U hebt vandaag het gezicht van al uw knechten beschaamd gemaakt, terwijl zij vandaag uw leven hebben gered, en het leven van uw zonen en uw dochters, en het leven van uw vrouwen, en het leven van uw bijvrouwen; Door hen lief te hebben die u haten, en te haten die u liefhebben; want u geeft vandaag te kennen dat leiders en knechten voor u niets betekenen; want ik merk vandaag dat als Absalom in leven was gebleven, en wij vandaag allemaal dood waren, dat het u dan goed zou uitkomen. Zo sta nu op, ga naar buiten, en spreek uw knechten moed in; want ik zweer bij de HEERE: als u niet naar buiten gaat, zal er vannacht niemand bij u blijven! En dat zal erger voor u zijn dan al het kwaad dat u overkomen is vanaf uw jeugd tot nu toe.", "1 Sam 18:6": "Het gebeurde nu, toen zij kwamen, en David terugkeerde van het verslaan van de Filistijn, dat de vrouwen uit al de steden van Israël uitgingen, met gezang en reidansen, koning Saul tegemoet, met tamboerijnen, met vreugde en met muziekinstrumenten.", "Matt 9:23": "En toen Jezus in het huis van de leider kwam, en de fluitspelers zag en de rumoerige menigte,", "Jes 30:32": "En overal waar die gegrondveste staf doorgegaan zal zijn (waarop de HEERE hem zal hebben doen rusten), daar zal men met trommels en harpen zijn; want met bewegende bestrijdingen zal Hij tegen hen strijden.", "2 Sam 17:25": "En Absalom had Amasa in de plaats van Joab aangesteld over het leger. Amasa nu was de zoon van een man wiens naam Jethra was, de Israëliet, die bij Abigaïl was ingegaan, de dochter van Nahas, zuster van Zeruja, de moeder van Joab.", "2 Sam 20:25": "En Seja was schrijver; en Zadok en Abjathar waren priesters.", "2 Sam 17:22": "Toen stond David op, en al het volk dat bij hem was; en zij gingen de Jordaan over. Bij het morgenlicht ontbrak er niet één die niet de Jordaan overgegaan was.", "Ps 71:9-11": "Verwerp mij niet in de tijd van het ouderdom; verlaat mij niet, terwijl mijn kracht vergaat. Want mijn vijanden spreken van mij, en zij die op mijn ziel loeren, beraadslagen samen, En zeggen: God heeft hem verlaten; jaag hem na, en grijp hem, want er is geen verlosser.", "2 Sam 15:30": "En David ging op door de opgang van de olijven, terwijl hij opging en weende, en zijn hoofd was bedekt; en hij zelf ging blootsvoets; ook had heel het volk dat bij hem was, ieder zijn hoofd bedekt, en zij gingen op, terwijl zij opgingen en weenden.", "Jak 3:2-10": "Want wij struikelen allen in veel dingen. Als iemand in woorden niet struikelt, die is een volmaakt man, in staat om ook het hele lichaam in toom te houden. Zie, wij leggen de paarden tomen in de mond, opdat zij ons zouden gehoorzamen, en wij sturen daarmee hun hele lichaam om; Zie ook de schepen: hoewel ze zo groot zijn en door harde winden gedreven worden, worden ze omgestuurd door een heel klein roer, waarheen ook de wil van de stuurman verlangt.", "2 Sam 9:13": "Zo woonde Mefiboseth in Jeruzalem, omdat hij voortdurend at aan de tafel van de koning; en hij was kreupel aan beide voeten.", "Hand 27:23": "Want deze zelfde nacht heeft bij mij gestaan een engel van God, van Wie ik ben en Die ik ook dien,", "1 Sam 24:7": "En hij zei tegen zijn mannen: Laat het ver van mij zijn bij de HEERE, dat ik deze zaak zou doen aan mijn heer, de gezalfde van de HEERE, dat ik mijn hand tegen hem uit zou steken; want hij is de gezalfde van de HEERE!", "1 Kron 6:31": "Dezen nu zijn het die David heeft aangesteld voor het ambt van het gezang in het huis van de HEERE, nadat de ark tot rust was gekomen.", "2 Sam 2:4": "Daarna kwamen de mannen van Juda, en zalfden daar David tot koning over het huis van Juda. Toen lieten zij David weten en zeiden: Het zijn de mannen van Jabes in Gilead, die Saul begraven hebben.", "2 Sam 19:1-4": "En Joab werd verteld: Zie, de koning huilt en bedrijft rouw over Absalom. Toen werd de overwinning op diezelfde dag voor het hele volk tot rouw; want het volk had diezelfde dag horen zeggen: Het smart de koning over zijn zoon. En het volk kwam diezelfde dag stiekem de stad binnen, zoals het volk zich wegsteelt, dat beschaamd is wanneer zij in de strijd gevlucht zijn.", "2 Sam 20:1": "Toen was daar bij toeval een man van Belial, wiens naam was Seba, een zoon van Bichri, een man van Jemini; die blies op de bazuin, en zei: Wij hebben geen deel aan David, en wij hebben geen erfenis aan de zoon van Isaï, ieder naar zijn tenten, o Israël!", "Jer 31:34": "En zij zullen niet meer, ieder zijn naaste, en ieder zijn broeder, onderwijzen door te zeggen: Kent de HEERE! Want zij zullen Mij allen kennen, van hun kleinste tot hun grootste toe, spreekt de HEERE; want Ik zal hun ongerechtigheid vergeven, en aan hun zonden niet meer denken.", "Joh 7:6": "Jezus zei dan tegen hen: Mijn tijd is er nog niet, maar uw tijd is altijd klaar.", "Gal 5:20": "Afgoderij, toverij, vijandschappen, ruzies, jaloersheden, toorn, twisten, verdeeldheid, afwijkingen in de leer,", "Gen 46:21": "En de zonen van Benjamin: Bela, Becher en Asbel, Gera en Naäman, Echi en Ros, Muppim en Huppim, en Ard.", "Kol 3:16": "Laat het woord van Christus rijkelijk in u wonen, in alle wijsheid; leer en vermaan elkaar met psalmen en lofzangen en geestelijke liederen, en zing voor de Heere met aangenaamheid in uw hart.", "2 Sam 3:24": "Toen ging Joab naar de koning, en zei: Wat hebt u gedaan? Zie, Abner is bij u geweest; waarom hebt u hem laten gaan, zodat hij zomaar is weggegaan?", "Fil 1:20": "Overeenkomstig mijn oprechte verwachting en hoop, dat ik in geen enkele zaak beschaamd zal worden; maar dat, met alle vrijmoedigheid, zoals altijd, zo ook nu, Christus groot gemaakt zal worden in mijn lichaam, hetzij door het leven, hetzij door de dood.", "1 Kron 25:5": "Deze allen waren kinderen van Heman, de ziener van de koning, in de woorden van God, om de hoorn te verheffen; want God had Heman veertien zonen gegeven, en drie dochters.", "2 Sam 9:2": "Het huis van Saul had een knecht, wiens naam Ziba was; en zij riepen hem bij David. En de koning zei tegen hem: Bent u Ziba? En hij zei: Uw knecht.", "1 Kon 2:7": "Maar aan de zonen van Barzillai, de Gileadiet, zult u vriendelijkheid bewijzen, en zij zullen bij hen horen die aan uw tafel eten; want zo kwamen zij naar mij toe, toen ik vluchtte voor het aangezicht van uw broer Absalom.", "Gen 48:10": "Doch de ogen van Israël waren wazig door ouderdom; hij kon niet goed zien; en hij liet hen naar zich toe komen; toen kuste hij hen, en omhelsde hen.", "Ps 66:3": "Zegt tot God: Hoe ontzagwekkend bent U in Uw werken! Om de grootheid van Uw sterkte zullen Uw vijanden zich geveinsd aan U onderwerpen.", "2 Sam 15:29": "Zo brachten Zadok en Abjathar de ark van God terug naar Jeruzalem, en zij bleven daar.", "Dan 3:4": "En een heraut riep met kracht: Men zegt u aan, u volken, u naties en tongen!", "Job 21:12": "Zij heffen op met de trommel en de harp, en verblijden zich bij het geluid van de fluit.", "2 Kor 5:20": "Zo zijn wij dan gezanten namens Christus, alsof God door ons bad; wij bidden namens Christus: laat u met God verzoenen.", "Ex 15:21": "Toen antwoordde Mirjam hun: Zingt de HEERE; want Hij is hoog verheven! Hij heeft het paard met zijn ruiter in de zee gestort!", "2 Sam 6:18": "Toen David geëindigd had het brandoffer en de dankoffers te offeren, zegende hij het volk in de Naam van de HEERE van de heerscharen.", "Job 32:4-9": "Doch Elihu had gewacht op Job in het spreken, omdat zij ouder van dagen waren dan hij. Toen Elihu dan zag dat er geen antwoord was in de mond van die drie mannen, ontstak zijn toorn. Hierom antwoordde Elihu, de zoon van Baracheël, de Buziet, en zei: Ik ben jong van dagen, maar u bent stokoude; daarom heb ik geschroomd en gevreesd, u mijn mening te tonen.", "2 Sam 14:17": "Verder zei uw dienares: Het woord van mijn heer de koning zij toch tot rust; want zoals een Engel van God, zo is mijn heer de koning, om het goede en het kwade te onderscheiden; en de HEERE, uw God, zal met u zijn.", "Jak 3:14-16": "Maar als u bittere afgunst en eigenbelang in uw hart hebt, beroem u dan niet en lieg niet tegen de waarheid. Dat is de wijsheid niet die van boven komt, maar is aards, ongeestelijk, duivels. Want waar afgunst en eigenbelang is, daar is verwarring en allerlei kwade praktijk.", "2 Sam 19:41-43": "En zie, alle mannen van Israël kwamen naar de koning; en zij zeiden tegen de koning: Waarom hebben onze broeders, de mannen van Juda, u gestolen, en hebben zij de koning en zijn huis over de Jordaan gebracht, en alle mannen van David met hem? Toen antwoordden alle mannen van Juda de mannen van Israël: Omdat de koning ons nauw verwant is; en waarom zijn jullie nu boos over deze zaak? Hebben wij dan ook maar iets gegeten op kosten van de koning, of heeft hij ons een geschenk gegeven? En de mannen van Israël antwoordden de mannen van Juda, en zeiden: Wij hebben tien delen aan de koning, en ook aan David hebben wij, meer dan jullie, recht; waarom hebben jullie ons dan geringschat, zodat ons woord niet het eerste geweest is bij het terughalen van onze koning? Maar het woord van de mannen van Juda was harder dan het woord van de mannen van Israël.", "Richt 12:1": "Toen werden de mannen van Efraïm bijeengeroepen, en zij trokken naar het noorden; en zij zeiden tegen Jeftha: Waarom bent u doorgetrokken om te strijden tegen de kinderen van Ammon, en hebt u ons niet geroepen om met u mee te gaan? Wij zullen uw huis boven u met vuur verbranden.", "2 Sam 19:40-43": "En de koning trok verder naar Gilgal, en Chimham trok met hem mee; en heel het volk van Juda had de koning over de Jordaan geholpen, evenals de helft van het volk van Israël. En zie, alle mannen van Israël kwamen naar de koning; en zij zeiden tegen de koning: Waarom hebben onze broeders, de mannen van Juda, u gestolen, en hebben zij de koning en zijn huis over de Jordaan gebracht, en alle mannen van David met hem? Toen antwoordden alle mannen van Juda de mannen van Israël: Omdat de koning ons nauw verwant is; en waarom zijn jullie nu boos over deze zaak? Hebben wij dan ook maar iets gegeten op kosten van de koning, of heeft hij ons een geschenk gegeven?", "1 Sam 25:2": "En er was een man te Maon, en zijn bedrijf was te Karmel; en die man was zeer groot, en hij had drieduizend schapen, en duizend geiten; en hij was bezig met het scheren van zijn schapen te Karmel.", "2 Kron 35:15": "En de zangers, de zonen van Asaf, waren op hun standplaats, naar het gebod van David, en Asaf, en Heman, en Jeduthun, de ziener van de koning, alsook de poortwachters bij elke poort; zij hoefden niet te wijken van hun dienst, want hun broeders, de Levieten, bereidden voor hen.", "Ps 149:6": "De lofprijzingen van God zullen in hun keel zijn, en een tweesnijdend zwaard in hun hand,", "Ex 22:28": "U mag de rechters niet vervloeken, en de leiders van uw volk mag u niet belasteren.", "Ps 68:5": "Zingt voor God, zingt psalmen voor Zijn Naam; hoogt de wegen voor Hem, Die in de vlakke velden rijdt, omdat Zijn Naam is HEERE; en springt op van vreugde voor Zijn aangezicht.", "Jes 23:16": "Neem de harp, ga rond door de stad, u vergeten hoer! Speel mooi, zing veel liederen, opdat men weer aan u denkt!", "Gen 47:7": "En Jozef bracht zijn vader Jakob binnen en stelde hem voor Farao; en Jakob zegende Farao.", "1 Sam 11:14": "Verder zei Samuël tegen het volk: Komt, laten wij naar Gilgal gaan, en het koninkrijk daar vernieuwen.", "2 Sam 9:6": "Toen nu Mefiboseth, de zoon van Jonathan, de zoon van Saul, bij David kwam, viel hij op zijn aangezicht en boog zich neer. En David zei: Mefiboseth! En hij zei: Zie, hier is uw knecht.", "Ps 39:6": "Zie, U hebt mijn dagen een handbreed lang gemaakt, en mijn levensduur is als niets voor U; zeker, ieder mens, hoe vast hij ook staat, is enkel ijdelheid. Sela.", "Spr 14:28": "In de menigte van het volk is de heerlijkheid van de koning; maar in gebrek aan volk is het verval van een vorst.", "Jak 4:14": "U weet niet wat morgen gebeuren zal, want hoe is uw leven? Het is immers een damp, die voor een korte tijd zichtbaar is, en daarna verdwijnt.", "1 Kron 16:39": "En de priester Zadok, en zijn broeders, de priesters, voor de tabernakel van de HEERE op de hoogte, die te Gibeon is;", "Ps 135:2": "U, die staat in het huis van de HEERE, in de voorhoven van het huis van onze God!", "Jer 14:4": "Omdat het aardrijk gescheurd is, doordat er geen regen op de aarde is; de akkerlieden zijn beschaamd, zij bedekken hun hoofd.", "1 Kon 13:22": "maar bent teruggekeerd en hebt brood gegeten en water gedronken op de plaats waarvan Hij tegen u gezegd had: U zult geen brood eten en geen water drinken; zo zal uw dode lichaam niet in het graf van uw vader komen.", "2 Sam 19:33-37": "En de koning zei tegen Barzillai: Trek met mij mee, en ik zal u bij mij in Jeruzalem onderhouden. Maar Barzillai zei tegen de koning: Hoeveel dagen zullen de jaren van mijn leven nog duren, dat ik met de koning zou optrekken naar Jeruzalem? Ik ben vandaag tachtig jaar oud; zou ik nog kunnen onderscheiden tussen goed en kwaad? Zou uw knecht kunnen proeven wat ik eet en wat ik drink? Zou ik nog kunnen horen naar de stem van zangers en zangeressen? En waarom zou uw knecht mijn heer de koning nog langer tot last zijn?", "1 Kron 8:7": "En Naäman, en Ahia, en Gera; dezen voerde hij weg; en hij verwekte Uzza en Ahihud.", "Hos 5:15": "Ik zal heengaan en terugkeren naar Mijn plaats, totdat zij zichzelf schuldig weten en Mijn aangezicht zoeken; als het hun bang te moede is, zullen zij Mij vroeg zoeken.", "2 Sam 13:38": "Zo vluchtte Absalom, en ging naar Gesur; en hij was daar drie jaar.", "Richt 10:9": "Daarbij trokken de Ammonieten de Jordaan over om te strijden, ook tegen Juda, tegen Benjamin en tegen het huis van Efraïm, zodat Israël erg in het nauw kwam.", "1 Kon 4:22": "Het voedsel nu van Salomo was voor één dag: dertig kor meelbloem, en zestig kor meel;", "Job 11:17": "Ja, uw levenstijd zal helderder dan de middag oprijzen; u zult stralen, als de morgenstond zult u zijn.", "Gen 15:15": "En u zult tot uw vaderen gaan in vrede; u zult in goede ouderdom begraven worden.", "2 Sam 20:23": "Joab nu was over het hele leger van Israël; en Benaja, de zoon van Jojada, over de Krethi en over de Plethi;", "Ps 148:13": "Laat hen de Naam van de HEERE loven; want Zijn Naam alleen is hoog verheven; Zijn majesteit is over de aarde en de hemel.", "1 Kron 25:7": "En hun aantal, met hun broeders die onderwezen waren in het gezang van de HEERE, allen meesters, was tweehonderdachtentachtig.", "Jes 16:10": "zodat de blijdschap en vrolijkheid weggenomen is van het vruchtbare veld, en in de wijngaarden wordt niet gezongen, en er wordt geen gejuich gemaakt; de druiventreder treedt geen wijn uit in de wijnbakken, ik heb het vreugdegeroep doen ophouden.", "2 Sam 13:39": "Toen verlangde de ziel van koning David er zeer naar om naar Absalom uit te gaan; want hij had zich getroost over Amnon, omdat die dood was.", "2 Sam 16:2": "En de koning zei tegen Ziba: Wat wilt u daarmee? En Ziba zei: De ezels zijn voor het huis van de koning, om op te rijden, en het brood en de zomervruchten om te eten voor de knechten; en de wijn, opdat wie moede zijn in de woestijn, kunnen drinken.", "2 Sam 17:18": "Een jongen zag hen echter, en vertelde het aan Absalom; doch die beiden gingen haastig weg, en kwamen in het huis van een man te Bahurim, die een put had in zijn binnenplaats, en zij daalden daarin af.", "2 Sam 3:25": "U kent Abner, de zoon van Ner: hij is gekomen om u te bedriegen, en om uw uitgaan en ingaan te weten te komen, ja, om alles te weten te komen wat u doet.", "1 Kron 15:28": "Zo bracht heel Israël de ark van het verbond van de HEERE op, met gejuich, en met geluid van de bazuin, en met trompetten, en met cimbalen, en maakte geluid met luiten en met harpen.", "Ps 149:1-3": "Halleluja! Zing de HEERE een nieuw lied; Zijn lof zij in de gemeente van Zijn gunstgenoten. Laat Israël zich verblijden in Hem Die hem gemaakt heeft; laat de kinderen van Sion zich verheugen over hun Koning. Laat hen Zijn Naam loven met dans; laat hen Hem psalmzingen met trommel en harp.", "Joz 23:14": "En ziet, ik ga heden in de weg van de hele aarde; en u weet in uw hele hart en in uw hele ziel, dat er niet één woord gevallen is van al die goede woorden, die de HEERE, uw God, over u gesproken heeft; zij zijn u alle overkomen; er is daarvan niet één woord gevallen.", "1 Kon 4:28": "De gerst nu en het stro voor de paarden, en voor de snelle kamelen, brachten zij naar de plaats waar hij was, ieder naar zijn taak.", "1 Kon 22:36": "En er ging een oproep door het leger, toen de zon onderging, en men zei: Ieder keert naar zijn stad, en ieder naar zijn land!", "2 Sam 18:12": "Maar die man zei tegen Joab: Al zou ik duizend zilverstukken op mijn handen krijgen, dan nog zou ik mijn hand niet slaan aan de zoon van de koning; want de koning heeft u, en Abisai, en Ithai, voor onze oren bevolen en gezegd: Pas op, wie u ook bent, voor de jongeman, voor Absalom.", "2 Kron 20:21": "Hij nu overlegde met het volk, en hij stelde voor de HEERE zangers aan, die de heilige Majesteit zouden prijzen, uitgaande voor de toegeruste troepen, en die zeiden: Loof de HEERE, want Zijn goedertierenheid is voor eeuwig!", "2 Sam 9:10": "Daarom zult u voor hem het land bewerken, u, en uw zonen, en uw knechten, en de opbrengst inbrengen, zodat de zoon van uw heer brood heeft om te eten; en Mefiboseth, de zoon van uw heer, zal voortdurend brood eten aan mijn tafel. Ziba nu had vijftien zonen en twintig knechten.", "Gen 31:26": "Toen zei Laban tegen Jakob: Wat hebt u gedaan, dat u mij misleid hebt, en mijn dochters weggevoerd hebt, als gevangenen met het zwaard?", "Amos 6:5": "Die bij het geschal van de luit kwinkeleren, en zichzelf instrumenten van muziek bedenken, zoals David;", "1 Kon 2:35": "En de koning stelde Benaja, de zoon van Jojada, in zijn plaats aan over het leger; en Zadok, de priester, stelde de koning aan in de plaats van Abjathar.", "Ps 129:2": "Zij hebben mij dikwijls van mijn jeugd af benauwd; toch hebben zij niet de overhand op mij gekregen.", "Ex 10:16": "Toen haastte Farao zich om Mozes en Aäron te roepen, en zei: Ik heb gezondigd tegen de HEERE, uw God, en tegen u.", "Spr 13:10": "Door hoogmoed maakt men niet dan gekijf; maar bij hen die zich laten raden is wijsheid.", "Matt 5:16": "Laat uw licht zo schijnen voor de mensen, dat zij uw goede werken mogen zien en uw Vader, Die in de hemelen is, verheerlijken.", "2 Sam 18:6-8": "Zo trok het volk het veld in, Israël tegemoet, en de strijd vond plaats bij het woud van Efraïm. En het volk van Israël werd daar door Davids knechten verslagen; en daar gebeurde die dag een grote slachting, van twintigduizend man. Want de strijd verspreidde zich daar over dat hele land. En het woud verslond die dag meer van het volk dan het zwaard verslond.", "1 Kon 19:2": "Toen stuurde Izebel een bode naar Elia, om te zeggen: Zo mogen de goden mij doen, en nog erger, als ik uw leven niet morgen omstreeks deze tijd maak als het leven van één van hen.", "Gen 33:4": "Toen liep Ezau hem tegemoet, en nam hem in zijn armen, en viel hem om de hals, en kuste hem; en zij huilden.", "Ex 10:17": "En nu, vergeef mij toch mijn zonde alleen deze keer, en bid vurig tot de HEERE, uw God, dat Hij alleen deze dood van mij wegneemt.", "Job 14:14": "Als een man gestorven is, zal hij dan weer leven? Ik zou al de dagen van het strijd hopen, totdat mijn verandering zou komen.", "1 Kon 19:20": "En hij liet de runderen achter, en liep Elia achterna, en zei: Laat mij toch mijn vader en mijn moeder kussen, daarna zal ik u volgen. En hij zei tegen hem: Ga, keer terug; want wat heb ik u gedaan?", "Spr 19:10": "De weelde past een dwaas niet; hoeveel te minder past het een knecht om te heersen over vorsten!", "Num 24:25": "Toen stond Bileam op en ging heen, en keerde terug naar zijn plaats. Balak ging ook zijn weg.", "2 Sam 18:11": "Toen zei Joab tegen de man die het hem vertelde: Zie toch, u hebt het gezien, waarom hebt u hem daar dan niet ter aarde geslagen? Dan had ik u tien zilverstukken en een gordel gegeven.", "Ps 71:4-6": "Mijn God, bevrijd mij van de hand van de goddeloze, van de hand van hem die verkeerd handelt, en van de opgeblazene. Want Gij zijt mijn Verwachting, Heere HEERE! mijn Vertrouwen van mijn jeugd af aan. Op U heb ik gesteund van de buik af aan; van de ingewanden van mijn moeder af aan zijt Gij mijn Uithelper; mijn lof is voortdurend van U.", "Openb 3:9": "Zie, Ik geef u er sommigen uit de synagoge van de satan, van hen die zeggen dat zij Joden zijn, en het niet zijn, maar liegen; zie, Ik zal maken dat zij zullen komen, en aanbidden voor uw voeten, en erkennen dat Ik u liefheb.", "Neh 7:67": "Behalve hun knechten en hun dienstmaagden; dezen waren zevenduizend driehonderdzevenendertig; en zij hadden tweehonderdvijfenveertig zangers en zangeressen.", "1 Kron 2:16": "En hun zusters waren Zeruja en Abigaïl. De kinderen nu van Zeruja waren Abisai, en Joab, en Asa-el; drie.", "Est 6:12": "Daarna keerde Mordechai terug naar de poort van de koning; maar Haman ging haastig naar zijn huis, treurig en met bedekt hoofd.", "2 Sam 16:7": "Zo zei Simeï, terwijl hij
