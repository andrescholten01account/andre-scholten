l Edom legde hij bezettingen; en alle Edomieten werden David tot knechten; en de HEERE behoedde David overal waar hij heentrok.", "15": "Zo regeerde David over heel Israël, en David deed aan zijn hele volk recht en gerechtigheid.", "16": "Joab nu, de zoon van Zeruja, was over het leger; en Josafat, zoon van Achilud, was kanselier.", "17": "En Zadok, zoon van Ahitub, en Achimelech, zoon van Abjathar, waren priesters; en Seraja was schrijver.", "18": "Er was ook Benaja, zoon van Jojada, met de Krethi en de Plethi; maar Davids zonen waren prinsen."}, "SV": {"1": "En het geschiedde daarna, dat David de Filistijnen sloeg, en bracht hen ten onder; en David nam Meteg-amma uit der Filistijnen hand.", "2": "Ook sloeg hij de Moabieten, en mat hen met een snoer, doende hen ter aarde nederliggen; en hij mat *met* twee snoeren om te doden, en *met* een vol snoer om in het leven te laten. Alzo werden de Moabieten David tot knechten, brengende geschenken.", "3": "David sloeg ook Hadad-ezer, den zoon van Rechob, den koning van Zoba, toen hij heen toog, om zijn hand te wenden naar de rivier Frath.", "4": "En David nam hem duizend *wagens* af, en zevenhonderd ruiteren, en twintig duizend man te voet; en David ontzenuwde alle wagenpaarden, en hield daarvan honderd wagenen over.", "5": "En de Syriërs van Damaskus kwamen om Hadad-ezer, den koning van Zoba, te helpen; maar David sloeg van de Syriërs twee en twintig duizend man.", "6": "En David leide bezettingen in Syrië van Damaskus, en de Syriërs werden David tot knechten, brengende geschenken; en de HEERE behoedde David overal, waar hij heentoog.", "7": "En David nam de gouden schilden die bij Hadad-ezers knechten geweest waren, en bracht ze te Jeruzalem.", "8": "Daartoe nam de koning David zeer veel kopers uit Betach, en uit Berothai, steden van Hadad-ezer.", "9": "Als nu Thoi, de koning van Hamath, hoorde, dat David het ganse heir van Hadad-ezer geslagen had;", "10": "Zo zond Thoi zijn zoon Joram tot den koning David, om hem te vragen naar *zijn* welstand, en om hem te zegenen, vanwege dat hij tegen Hadad-ezer gekrijgd en hem geslagen had, ( want Hadad-ezer voerde steeds krijg tegen Thoi); en in zijn hand waren zilveren vaten, en gouden vaten, en koperen vaten;", "11": "Welke de koning David ook den HEERE heiligde, met het zilver en het goud, dat hij geheiligd had van alle heidenen, die hij *zich* onderworpen had;", "12": "Van Syrië, en van Moab, en van de kinderen Ammons, en van de Filistijnen, en van Amalek, en van den roof van Hadad-ezer, den zoon van Rechob, den koning van Zoba.", "13": "Ook maakte *zich* David een naam, als hij wederkwam, nadat hij de Syriërs geslagen had, in het Zoutdal, achttien duizend.", "14": "En hij leide bezettingen in Edom; in gans Edom leide hij bezettingen; en alle Edomieten werden David tot knechten; en de HEERE behoedde David overal, waar hij heentoog.", "15": "Alzo regeerde David over gans Israël, en David deed aan zijn ganse volk recht en gerechtigheid.", "16": "Joab nu, de zoon van Zeruja, was over het heir; en Josafat, zoon van Achilud, was kanselier.", "17": "En Zadok, zoon van Ahitub, en Achimelech, zoon van Abjathar, waren priesters; en Seraja was schrijver.", "18": "Er was ook Benaja, zoon van Jojada, met de Krethi en de Plethi; maar Davids zonen waren prinsen."}, "KJV": {"1": "And after this it came to pass, that David smote the Philistines, and subdued them: and David took Methegammah out of the hand of the Philistines.", "2": "And he smote Moab, and measured them with a line, casting them down to the ground; even with two lines measured he to put to death, and with one full line to keep alive. And so the Moabites became David's servants, and brought gifts.", "3": "David smote also Hadadezer, the son of Rehob, king of Zobah, as he went to recover his border at the river Euphrates.", "4": "And David took from him a thousand chariots, and seven hundred horsemen, and twenty thousand footmen: and David houghed all the chariot horses, but reserved of them for an hundred chariots.", "5": "And when the Syrians of Damascus came to succour Hadadezer king of Zobah, David slew of the Syrians two and twenty thousand men.", "6": "Then David put garrisons in Syria of Damascus: and the Syrians became servants to David, and brought gifts. And the LORD preserved David whithersoever he went.", "7": "And David took the shields of gold that were on the servants of Hadadezer, and brought them to Jerusalem.", "8": "And from Betah, and from Berothai, cities of Hadadezer, king David took exceeding much brass.", "9": "When Toi king of Hamath heard that David had smitten all the host of Hadadezer,", "10": "Then Toi sent Joram his son unto king David, to salute him, and to bless him, because he had fought against Hadadezer, and smitten him: for Hadadezer had wars with Toi. And Joram brought with him vessels of silver, and vessels of gold, and vessels of brass:", "11": "Which also king David did dedicate unto the LORD, with the silver and gold that he had dedicated of all nations which he subdued;", "12": "Of Syria, and of Moab, and of the children of Ammon, and of the Philistines, and of Amalek, and of the spoil of Hadadezer, son of Rehob, king of Zobah.", "13": "And David gat him a name when he returned from smiting of the Syrians in the valley of salt, being eighteen thousand men.", "14": "And he put garrisons in Edom; throughout all Edom put he garrisons, and all they of Edom became David's servants. And the LORD preserved David whithersoever he went.", "15": "And David reigned over all Israel; and David executed judgment and justice unto all his people.", "16": "And Joab the son of Zeruiah was over the host; and Jehoshaphat the son of Ahilud was recorder;", "17": "And Zadok the son of Ahitub, and Ahimelech the son of Abiathar, were the priests; and Seraiah was the scribe;", "18": "And Benaiah the son of Jehoiada was over both the Cherethites and the Pelethites; and David's sons were chief rulers."}}, "tsk": {"1": [{"kopje": "En het g  {"disp": "2 Sam 8:18", "href": "../../2-samuel/8/#v18", "ref": "2 Sam 8:18", "svLabel": null}, {"disp": "2 Sam 20:7", "href": "../../2-samuel/20/#v7", "ref": "2 Sam 20:7", "svLabel": null}, {"disp": "2 Sam 20:23", "href": "../../2-samuel/20/#v23", "ref": "2 Sam 20:23", "svLabel": null}, {"disp": "1 Kron 18:17", "href": "../../1-kronieken/18/#v17", "ref": "1 Kron 18:17", "svLabel": null}], "kinderen": []}]}], "torrey": [{"topic": "Kings", "href": "../../torrey/k/#t-kings", "kinderen": [{"label": "Attended by a body-guard", "href": "../../torrey/k/?hl=2Sam.8.18#i10930", "refs": [{"disp": "1 Sam 13:2", "href": "../../1-samuel/13/#v2", "ref": "1 Sam 13:2", "svLabel": null}, {"disp": "2 Sam 8:18", "href": "../../2-samuel/8/#v18", "ref": "2 Sam 8:18", "svLabel": null}, {"disp": "1 Kron 11:25", "href": "../../1-kronieken/11/#v25", "ref": "1 Kron 11:25", "svLabel": null}, {"disp": "2 Kron 12:10", "href": "../../2-kronieken/12/#v10", "ref": "2 Kron 12:10", "svLabel": null}], "kinderen": []}, {"label": "Officers Of", "href": "../../torrey/k/?hl=2Sam.8.18#i10934", "refs": [], "kinderen": [{"label": "Captain of the guard", "href": "../../torrey/k/?hl=2Sam.8.18#i10941", "refs": [{"disp": "2 Sam 8:18", "href": "../../2-samuel/8/#v18", "ref": "2 Sam 8:18", "svLabel": null}, {"disp": "2 Sam 20:23", "href": "../../2-samuel/20/#v23", "ref": "2 Sam 20:23", "svLabel": null}], "kinderen": []}]}]}, {"topic": "Philistines, The", "href": "../../torrey/p/#t-philistines-the", "kinderen": [{"label": "David", "href": "../../torrey/p/?hl=2Sam.8.18#i14991", "refs": [], "kinderen": [{"label": "Had a guard composed of", "href": "../../torrey/p/?hl=2Sam.8.18#i14999", "refs": [{"disp": "2 Sam 8:18", "href": "../../2-samuel/8/#v18", "ref": "2 Sam 8:18", "svLabel": null}, {"disp": "Ezech 25:16", "href": "../../ezechiel/25/#v16", "ref": "Ezech 25:16", "svLabel": null}, {"disp": "Zef 2:5", "href": "../../zefanja/2/#v5", "ref": "Zef 2:5", "svLabel": null}], "kinderen": []}]}]}]}}, "extern": {"Richt 7:25": "En zij vingen twee vorsten van de Midianieten, Oreb en Zeëb, en doodden Oreb op de rots Oreb, en Zeëb doodden zij bij de perskuip van Zeëb, en achtervolgden de Midianieten; en zij brachten de hoofden van Oreb en Zeëb naar Gideon, aan de overkant van de Jordaan.", "2 Kron 26:8": "En de Ammonieten gaven Uzzia geschenken; en zijn naam ging tot aan de ingang van Egypte, want hij sterkte zich tot het uiterste.", "Deut 21:10": "Wanneer u uittrekt ten strijde tegen uw vijanden, en de HEERE, uw God, hen in uw hand gegeven heeft, zodat u hun gevangenen gevankelijk wegvoert;", "Ezech 37:24": "En Mijn Knecht David zal Koning over hen zijn; en zij zullen allen samen één Herder hebben; en zij zullen in Mijn rechten wandelen, en Mijn inzettingen bewaren en die doen.", "2 Kon 3:4-27": "Mesa nu, de koning van de Moabieten, was een veehandelaar, en bracht aan de koning van Israël honderdduizend lammeren, en honderdduizend rammen met de wol. Maar het gebeurde, toen Achab gestorven was, dat de koning van de Moabieten van de koning van Israël afviel. Zo trok koning Joram op dezelfde tijd uit Samaria weg, en telde heel Israël.", "1 Kron 27:34": "En na Achitofel was Jojada, de zoon van Benaja, en Abjathar; maar Joab was de legeraanvoerder van de koning.", "1 Kon 4:2": "En dit waren de vorsten die hij had: Azaria, de zoon van Zadok, was opperambtman.", "Ps 101:1-8": "Een psalm van David. Ik zal van goedertierenheid en recht zingen; U zal ik psalmzingen, o HEERE! Ik zal verstandig handelen op de oprechte weg; wanneer zult U tot mij komen? Ik zal in het midden van mijn huis wandelen, in oprechtheid van mijn hart. Ik zal geen slechte zaak voor mijn ogen stellen; ik haat het doen van de afvalligen, het zal mij niet aankleven.", "Ps 108:10": "Moab is mijn waspot; op Edom zal ik mijn schoen werpen; over Palestina zal ik juichen.", "Ps 5:13": "Want U, HEERE, zult de rechtvaardige zegenen; U zult hem met goedgunstigheid kronen, als met een schild.", "2 Kon 25:13-16": "Verder braken de Chaldeeën de koperen pilaren, die in het huis van de HEERE waren, en de stellingen, en de koperen zee, die in het huis van de HEERE was; en zij voerden het koper daarvan naar Babel. Zij namen ook de potten, en de schoffels, en de gaffels, en de rookschalen, en al de koperen voorwerpen, waarmee men de dienst verrichtte. En de aanvoerder van de lijfwacht nam de wierookvaten en de sprenkelschalen weg, wat geheel goud en wat geheel zilver was.", "2 Kon 12:10": "Het gebeurde nu, toen zij zagen dat er veel geld in de kist was, dat de schrijver van de koning met de hogepriester opkwam, en zij bonden het samen en telden het geld dat in het huis van de HEERE gevonden werd.", "Deut 20:13": "En de HEERE, uw God, zal haar in uw hand geven; en u zult alles wat mannelijk daarin is, slaan met de scherpte van het zwaard;", "1 Kron 18:4": "En David nam hem duizend wagens af, en zevenduizend ruiters, en twintigduizend man te voet; en David sneed bij alle wagenpaarden de hezenpezen door; maar hij hield honderd wagens daarvan over.", "1 Sam 14:47": "Toen nam Saul het koningschap over Israël in bezit; en hij streed rondom tegen al zijn vijanden: tegen Moab, en tegen de kinderen van Ammon, en tegen Edom, en tegen de koningen van Zoba, en tegen de Filistijnen; en overal waarheen hij zich wendde, strafte hij hen.", "Jes 8:10": "Beraadslaag een plan, toch zal het vernietigd worden; spreek een woord, toch zal het niet standhouden; want God is met ons!", "1 Kron 18:13": "En hij legde bezetting in Edom, zodat alle Edomieten Davids knechten werden; en de HEERE gaf David de overwinning overal waar hij heenging.", "Ps 83:7": "de tenten van Edom en de Ismaëlieten, Moab en de Hagarenen;", "1 Kon 10:25": "En zij brachten ieder zijn geschenk, zilveren vaten, en gouden vaten, en klederen, en wapenrusting, en specerijen, paarden en muilezels, elk jaar opnieuw.", "2 Sam 5:5": "In Hebron regeerde hij over Juda zeven jaar en zes maanden; en in Jeruzalem regeerde hij drieëndertig jaar over heel Israël en Juda.", "1 Kron 6:8": "En Ahitub verwekte Zadok, en Zadok verwekte Ahimaäz;", "2 Sam 19:13": "En tegen Amasa moet u zeggen: Bent u niet mijn gebeente en mijn vlees? God doe mij zo, en meer dan dat, als u niet legeraanvoerder wordt voor mijn aangezicht, alle dagen, in de plaats van Joab.", "1 Kron 21:24": "En de koning David zei tegen Ornan: Nee, maar ik zal het zeker kopen voor het volle geld; want ik zal voor de HEERE niet nemen wat van u is, om een brandoffer voor niets te offeren.", "Amos 7:17": "Daarom zegt de HEERE zo: Uw vrouw zal in de stad hoereren, en uw zonen en uw dochters zullen door het zwaard vallen, en uw land zal met het meetsnoer verdeeld worden; en u zult in een onrein land sterven, en Israël zal zeker uit zijn land gevankelijk worden weggevoerd.", "1 Kon 4:26": "Salomo had ook veertigduizend paardenstallen voor zijn wagens, en twaalfduizend ruiters.", "1 Kron 18:2": "Hij sloeg ook de Moabieten, zodat de Moabieten Davids knechten werden, die geschenken brachten.", "1 Kron 18:5": "En de Syriërs van Damaskus kwamen om Hadar-ezer, de koning van Zoba, te helpen; maar David sloeg van de Syriërs tweeëntwintigduizend man.", "1 Kron 19:6-19": "Toen de kinderen van Ammon zagen dat zij zich stinkend gemaakt hadden bij David, stuurden Hanun en de kinderen van Ammon duizend talenten van het zilver, om zich wagens en ruiters te huren uit Mesopotamië, en uit Syrië-Maächa, en uit Zoba; zodat zij zich tweeëndertigduizend wagens huurden; en de koning van Maächa en zijn volk kwamen en legerden zich voor Medeba; ook verzamelden de kinderen van Ammon zich uit hun steden, en zij kwamen ten strijde. Toen David dit hoorde, stuurde hij Joab en het hele leger met de helden.", "2 Kon 18:18": "En zij riepen naar de koning; toen ging tot hen uit Eljakim, de zoon van Hilkia, de hofmeester, en Sebna, de schrijver, en Joah, de zoon van Asaf, de kanselier.", "Ezech 40:3": "Toen Hij mij daarheen gebracht had, zie, er was een man, wiens verschijning was als de verschijning van koper; en in zijn hand was een linnen snoer en een meetriet; en hij stond in de poort.", "1 Sam 15:33": "Maar Samuël zei: Zoals uw zwaard vrouwen van hun kinderen beroofd heeft, zo zal uw moeder van haar kinderen beroofd worden onder de vrouwen. Toen hieuw Samuël Agag in stukken, voor het aangezicht van de HEERE te Gilgal.", "1 Kon 8:17": "Het was ook in het hart van mijn vader David, een huis voor de Naam van de HEERE, de God van Israël, te bouwen.", "1 Sam 25:14": "Doch een van de jongemannen boodschapte het aan Abigaïl, de vrouw van Nabal, en zei: Zie, David heeft boden gezonden uit de woestijn om onze heer te zegenen; maar hij is tegen hen uitgevaren.", "1 Kon 3:16-28": "Toen kwamen er twee vrouwen, die hoeren waren, bij de koning, en zij stonden voor zijn aangezicht. En de ene vrouw zei: Och, mijn heer. Ik en deze vrouw wonen in één huis; en ik heb bij haar in dat huis een kind gekregen. Het is nu gebeurd op de derde dag na mijn bevalling, dat deze vrouw ook een kind gekregen heeft; en wij waren samen, er was geen vreemde bij ons in dat huis, behalve wij tweeën in het huis.", "Ps 121:4-8": "Zie, de Bewaarder van Israël zal niet sluimeren, ook niet slapen. De HEERE is uw Bewaarder, de HEERE is uw Schaduw, aan uw rechterhand. De zon zal u overdag niet steken, ook de maan niet 's nachts.", "1 Kon 1:44": "En de koning heeft met hem gezonden Zadok, de priester, en Nathan, de profeet, en Benaja, de zoon van Jojada, en de Krethi en de Plethi; en zij hebben hem laten rijden op de muilezelin van de koning.", "Jer 31:39": "En het meetsnoer zal verder daarnaast uitgaan tot aan de heuvel Gareb, en zich naar Goath omwenden.", "2 Sam 7:2": "Dat de koning zei tegen de profeet Nathan: Zie toch, ik woon in een huis van cederhout, en de ark van God woont in het midden van de tentkleden.", "1 Kron 18:1-17": "Het gebeurde nu hierna, dat David de Filistijnen sloeg, en hen onderwierp; en hij nam Gath en haar onderhorige plaatsen af van de Filistijnen. Hij sloeg ook de Moabieten, zodat de Moabieten Davids knechten werden, die geschenken brachten. David sloeg ook Hadar-ezer, de koning van Zoba, naar Hamath toe, toen hij optrok om zijn macht te vestigen aan de rivier de Eufraat.", "1 Sam 14:50": "En de naam van Sauls vrouw was Ahinoam, een dochter van Ahimaäz; en de naam van zijn legeraanvoerder was Abner, een zoon van Ner, Sauls oom.", "1 Kon 10:17": "Ook driehonderd rondassen van gehamerd goud; drie pond goud liet hij besteden aan elke rondas; en de koning legde ze in het huis van het woud van Libanon.", "2 Kon 18:37": "Toen kwam Eljakim, de zoon van Hilkia, de hofmeester, en Sebna, de schrijver, en Joah, de zoon van Asaf, de kanselier, tot Hizkia, met gescheurde kleren; en zij maakten hem de woorden van Rabsake bekend.", "1 Sam 30:16": "En hij leidde hem naar beneden, en zie, zij lagen verspreid over het hele land, etend, en drinkend, en dansend, vanwege al de grote buit die zij genomen hadden uit het land van de Filistijnen, en uit het land van Juda.", "Gen 27:29": "Volken zullen u dienen, en volken zullen zich voor u neerbuigen; wees heer over uw broers, en de zonen van uw moeder zullen zich voor u neerbuigen! Vervloekt moet hij zijn, wie u vervloekt; en wie u zegent, zij gezegend!", "2 Sam 11:1": "En het gebeurde met de terugkeer van het jaar, ten tijde dat de koningen uittrekken, dat David Joab, en zijn knechten met hem, en heel Israël, uitzond om de kinderen van Ammon te verderven, en Rabba te belegeren. Doch David bleef te Jeruzalem.", "2 Sam 10:11": "En hij zei: Als de Syriërs mij te sterk zullen zijn, zult u mij komen verlossen; en als de kinderen Ammons u te sterk zullen zijn, zal ik komen om u te verlossen.", "2 Sam 2:24": "Maar Joab en Abisai jaagden Abner achterna; en de zon ging onder, toen zij gekomen waren bij de heuvel van Amma, die voor Giach ligt, aan de weg van de woestijn van Gibeon.", "1 Kron 18:10": "zond hij zijn zoon Hadoram naar koning David, om naar zijn welzijn te vragen en om hem te feliciteren, omdat hij tegen Hadar-ezer gestreden en hem verslagen had (want Hadar-ezer voerde oorlog tegen Thou), en met hem allerlei gouden, zilveren en koperen voorwerpen.", "Jer 22:15": "Zou u regeren, omdat u zich omringt met ceder? Heeft uw vader niet gegeten en gedronken, en recht en gerechtigheid gedaan, en ging het hem toen niet goed?", "Joz 8:29": "En de koning van Ai hing hij aan een paal, tot de avond; en omtrent het ondergaan van de zon gebood Jozua dat men zijn dode lichaam van de paal zou afnemen; en zij wierpen het bij de ingang van de stadspoort, en richtten daarop een grote steenhoop op, die er is tot op deze dag.", "Richt 10:7-18": "Toen ontstak de toorn van de HEERE tegen Israël; en Hij verkocht hen in de hand van de Filistijnen en in de hand van de Ammonieten. Die verdrukten en vertrapten de Israëlieten in datzelfde jaar; achttien jaar lang onderdrukten zij alle Israëlieten die aan de overkant van de Jordaan waren, in het land van de Amorieten, dat in Gilead ligt. Daarbij trokken de Ammonieten de Jordaan over om te strijden, ook tegen Juda, tegen Benjamin en tegen het huis van Efraïm, zodat Israël erg in het nauw kwam.", "Jer 39:6": "En de koning van Babel slachtte de zonen van Zedekia te Ribla voor zijn ogen; ook slachtte de koning van Babel alle edelen van Juda.", "Ps 140:8": "HEERE, Heere, sterkte van mijn heil! U hebt mijn hoofd bedekt op de dag van de wapening.", "Ps 60:10": "Moab is mijn waspot; op Edom zal ik mijn schoen werpen! Juich over mij, o Filistea!", "1 Kon 9:22": "Doch van de kinderen van Israël maakte Salomo geen slaaf; maar zij waren krijgslieden, en zijn knechten, en zijn vorsten, en zijn hoofdlieden, en de aanvoerders van zijn wagens, en van zijn ruiters.", "1 Kron 20:1-3": "Het gebeurde nu in de tijd dat het jaar weer omging, in de tijd dat de koningen ten strijde uittrokken, dat Joab het leger aanvoerde en het land van de kinderen Ammons verwoestte; en hij kwam en belegerde Rabba. Maar David bleef in Jeruzalem. En Joab sloeg Rabba en verwoestte het. En David nam de kroon van hun koning van zijn hoofd, en hij bevond dat die in gewicht een talent goud woog, en er zat edelgesteente aan; en die werd op Davids hoofd gezet, en hij bracht zeer veel van het roof uit de stad naar buiten. Hij bracht ook al het volk dat daarin was naar buiten, en hij zaagde hen met de zaag, en met ijzeren dorswagens, en met bijlen; en zo deed David met al de steden van de kinderen Ammons. Toen keerde David met al het volk terug naar Jeruzalem.", "Ezra 6:5": "Daarbij moet men ook de gouden en zilveren vaten van het huis van God, die Nebukadnezar uit de tempel die te Jeruzalem was heeft weggevoerd en naar Babel gebracht, teruggeven, zodat zij teruggaan naar de tempel die te Jeruzalem is, ieder naar zijn plaats, en men zal ze brengen naar het huis van God.", "1 Kron 22:16": "Van het goud, van het zilver, en van het koper, en van het ijzer is geen getal; maak u op, en doe het, en de HEERE zal met u zijn.", "2 Sam 8:16-18": "Joab nu, de zoon van Zeruja, was over het leger; en Josafat, zoon van Achilud, was kanselier. En Zadok, zoon van Ahitub, en Achimelech, zoon van Abjathar, waren priesters; en Seraja was schrijver. Er was ook Benaja, zoon van Jojada, met de Krethi en de Plethi; maar Davids zonen waren prinsen.", "Ezra 1:6": "Allen nu die rondom hen waren, ondersteunden hen met zilveren voorwerpen, met goud, met bezit, en met vee, en met kostbaarheden; behalve alles wat vrijwillig gegeven werd.", "2 Sam 23:20": "Verder Benaja, de zoon van Jojada, de zoon van een dappere man, groot van daden, uit Kabzeel; die versloeg twee sterke leeuwen van Moab; ook ging hij af, en sloeg een leeuw in het midden van een kuil in de sneeuwtijd.", "1 Sam 30:14": "Wij waren binnengevallen in het zuiden van de Cherethieten, en in het gebied dat aan Juda toebehoort, en in het zuiden van Kaleb; en wij hebben Ziklag met vuur verbrand.", "2 Sam 10:14": "Toen de kinderen Ammons zagen, dat de Syriërs vluchtten, vluchtten zij ook voor het aangezicht van Abisaï, en kwamen in de stad. En Joab keerde terug van de kinderen Ammons, en kwam te Jeruzalem.", "1 Kron 28:2": "En koning David stond op zijn voeten en zei: Hoor mij, mijn broeders en mijn volk! Ik had het in mijn hart om een huis van rust te bouwen voor de ark van het verbond van de HEERE, en voor de voetbank van de voeten van onze God, en ik heb voorbereidingen getroffen om te bouwen.", "2 Sam 23:4": "En Hij zal zijn gelijk het licht van de morgen, wanneer de zon opgaat, een morgen zonder wolken, wanneer door de glans na de regen de grasscheutjes uit de aarde voortkomen.", "Dan 11:8": "Ook zal hij hun goden, met hun vorsten, met hun kostbare voorwerpen van zilver en goud, als gevangenen naar Egypte brengen; en hij zal enige jaren langer staande blijven dan de koning van het Noorden.", "Ps 89:20": "Toen hebt Gij in een gezicht gesproken van Uw heilige, en gezegd: Ik heb hulp besteld bij een held; Ik heb een verkorene uit het volk verhoogd.", "1 Kron 18:16": "en Zadok, de zoon van Ahitub, en Abimelech, de zoon van Abjathar, waren priesters, en Sausa was schrijver;", "2 Kron 17:2": "En hij legde krijgsvolk in alle versterkte steden van Juda, en legde bezettingen in het land van Juda, en in de steden van Efraïm, die zijn vader Asa had ingenomen.", "2 Sam 23:8-12": "Dit zijn de namen van de helden die David gehad heeft: Joscheb-Baschebeth, de zoon van Tachkemoni, de voornaamste van de hoofdlieden. Deze was Adino, de Ezniet, die zich stelde tegen achthonderd man, die door hem verslagen werden op één moment. En na hem was Eleazar, de zoon van Dodo, zoon van Ahohi; deze was onder de drie helden met David, toen zij de Filistijnen beschimpten, die daar ten strijde verzameld waren, en de mannen van Israël waren teruggetrokken. Deze stond op en sloeg onder de Filistijnen, totdat zijn hand moe werd, ja, zijn hand aan het zwaard kleefde; en de HEERE bracht een grote overwinning tot stand op die dag; en het volk keerde terug achter hem aan, alleen om te plunderen.", "Ps 72:10": "De koningen van Tharsis en de eilanden zullen geschenken aanbrengen; de koningen van Scheba en Seba zullen vereringen toevoeren.", "Jes 7:8": "Maar Damaskus zal het hoofd van Syrië zijn, en Rezin het hoofd van Damaskus; en over nog vijfenzestig jaar zal Efraïm verbroken worden, zodat het geen volk meer is.", "2 Kon 8:1-6": "Elisa had tegen de vrouw gesproken, van wie hij de zoon levend gemaakt had. Hij zei: Maak u klaar, en ga weg, u en uw huisgezin, en woon als vreemdeling waar u maar wonen kunt; want de HEERE heeft een hongersnood aangekondigd, die ook zeven jaar lang over het land zal komen. En de vrouw had zich klaargemaakt en had gedaan naar het woord van de man Gods; zij was met haar huisgezin weggegaan, en had als vreemdeling gewoond in het land van de Filistijnen, zeven jaar lang. En het gebeurde na het einde van de zeven jaar, dat de vrouw uit het land van de Filistijnen terugkeerde; en zij ging naar de koning om te smeken voor haar huis en voor haar akker.", "Ps 72:8": "En hij zal heersen van de zee tot aan de zee, en van de rivier tot aan de einden van de aarde.", "2 Kron 9:25": "Ook had Salomo vierduizend paardenstallen, en wagens, en twaalfduizend ruiters; en hij legerde ze in de wagensteden, en bij de koning te Jeruzalem.", "Ps 60:11": "Wie zal mij brengen in een vaste stad? Wie zal mij leiden tot in Edom?", "1 Kron 26:26": "Deze Selomith en zijn broers waren over al de schatten van de heilige dingen, die koning David geheiligd had, alsook de hoofden van de families, de leiders over duizenden en honderden, en de leiders van het leger;", "1 Kon 1:38": "Toen ging Zadok, de priester, met Nathan, de profeet, en Benaja, de zoon van Jojada, en de Krethi en de Plethi naar beneden, en zij lieten Salomo rijden op de muilezelin van de koning David, en geleidden hem naar Gihon.", "Joz 10:15-40": "Toen keerde Jozua terug, en heel Israël met hem, naar het leger te Gilgal. Maar die vijf koningen waren gevlucht, en hadden zich verborgen in de grot bij Makkeda. En aan Jozua werd gemeld: Die vijf koningen zijn gevonden, verborgen in de grot bij Makkeda.", "Ezra 5:14": "Ja, de vaten van het huis van God, die van goud en zilver waren, die Nebukadnezar uit de tempel die te Jeruzalem was, had weggenomen en had gebracht in de tempel van Babel, die heeft de koning Kores gehaald uit de tempel van Babel, en ze zijn gegeven aan iemand wiens naam Sesbazar was, die hij tot landvoogd had gesteld.", "1 Kron 24:31": "En zij wierpen ook loten, samen met hun broeders, de zonen van Aäron, voor het aangezicht van koning David, en Zadok, en Achimelech, en van de familiehoofden onder de priesters en onder de Levieten; het familiehoofd tegenover zijn jongste broer.", "1 Kron 29:2-5": "Ik heb nu uit al mijn kracht klaargemaakt voor het huis van mijn God: goud voor de gouden dingen, en zilver voor de zilveren, en koper voor de koperen, ijzer voor de ijzeren, en hout voor de houten werken; sardonyxstenen en stenen om in te zetten, glanzende stenen en stenen van verschillende kleuren, en allerlei kostbare stenen, en marmerstenen in overvloed. En daarbij, uit mijn genegenheid voor het huis van mijn God, geef ik mijn eigen goud en zilver, dat ik heb, aan het huis van mijn God, boven op alles wat ik al voor het heilige huis klaargemaakt heb; Drieduizend talenten goud, van het goud van Ofir, en zevenduizend talenten gelouterd zilver, om de wanden van de huizen mee te bekleden;", "Ps 108:11": "Wie zal mij voeren in een vaste stad? Wie zal mij leiden tot in Edom?", "Num 7:85": "Een zilveren schotel woog honderddertig sikkels, en een sprenkelschaal zeventig; al het zilver van de vaten was tweeduizend vierhonderd sikkels, naar de sikkel van het heiligdom.", "1 Kron 22:14": "Zie, ik heb in mijn verdrukking voor het huis van de HEERE honderdduizend talenten van het goud bereid, en duizend maal duizend talenten van het zilver; en van het koper en van het ijzer is er geen gewicht, want het is er in overvloed; ik heb ook hout en stenen bereid; voegt u er nog meer aan toe.", "1 Kron 18:7": "En David nam de gouden schilden die bij Hadar-ezers knechten waren geweest, en hij bracht ze naar Jeruzalem.", "Ps 18:35-47": "Hij leert mijn handen ten strijde, zodat een stalen boog met mijn armen verbroken is. Ook hebt U mij het schild van Uw heil gegeven, en Uw rechterhand heeft mij ondersteund, en Uw zachtmoedigheid heeft mij groot gemaakt. U hebt mijn voetstap ruim gemaakt onder mij, en mijn enkels hebben niet gewankeld.", "2 Kron 25:11": "Amazia nu sterkte zichzelf, en leidde zijn volk uit, en trok naar het Zoutdal, en sloeg van de kinderen van Seïr tienduizend.", "1 Kon 4:21": "En Salomo heerste over al de koninkrijken, van de rivier tot het land van de Filistijnen, en tot aan het gebied van Egypte; die brachten geschenken, en dienden Salomo al de dagen van zijn leven.", "Richt 8:21": "Toen zeiden Zebah en Tsalmuna: Sta zelf op en val ons aan, want zoals de man is, zo is zijn kracht. Toen stond Gideon op en doodde Zebah en Tsalmuna, en nam de maantjes die aan de halzen van hun kamelen zaten.", "1 Kron 6:53": "Zadok zijn zoon; Ahimaäz zijn zoon.", "Joz 11:9": "Jozua nu deed hun zoals de HEERE hem gezegd had; hun paarden verlamde hij, en hun wagens verbrandde hij met vuur.", "Richt 11:32": "Zo trok Jeftha door naar de kinderen van Ammon, om tegen hen te strijden; en de HEERE gaf hen in zijn hand.", "Num 31:9-20": "Maar de kinderen van Israël namen de vrouwen van de Midianieten, en hun kinderen gevangen; zij roofden ook al hun beesten, en al hun vee, en al hun bezit. Verder verbrandden zij al hun steden met hun woonplaatsen, en al hun burchten, met vuur. En zij namen alle buit en alle roof, van mensen en van beesten.", "Joz 6:24": "De stad nu verbrandden zij met vuur, en alles wat daarin was; alleen het zilver en goud, alsook de koperen en ijzeren voorwerpen, gaven zij bij de schat van het huis van de HEERE.", "2 Sam 15:2": "Ook stond Absalom 's morgens vroeg op, en ging staan aan de kant van de weg naar de poort. En het gebeurde dat Absalom iedere man die een geschil had en naar de koning wilde komen voor een rechtszaak, tot zich riep en zei: Uit welke stad bent u? Als hij dan zei: Uw knecht is uit een van de stammen van Israël,", "Jes 9:6": "De grootheid van deze heerschappij en van de vrede zal geen einde hebben op de troon van David en in zijn koninkrijk, om dat te bevestigen en te sterken met recht en met gerechtigheid, van nu af tot in eeuwigheid toe. De ijver van de HEERE van de heerscharen zal dit doen.", "Gen 27:40": "En van uw zwaard zult u leven, en u zult uw broer dienen; doch het zal gebeuren, wanneer u zult heersen, dan zult u zijn juk van uw hals afrukken.", "Openb 21:16": "En de stad lag vierkant, en haar lengte was zo groot als haar breedte. En hij mat de stad met de rietstok op twaalfduizend stadiën; de lengte, en de breedte, en de hoogte daarvan waren gelijk.", "Num 24:17": "Ik zal hem zien, maar nu niet; ik zal hem aanschouwen, maar niet van dichtbij. Er zal een ster voortkomen uit Jakob, en er zal een scepter uit Israël opkomen; die zal de gebieden van de Moabieten verslaan, en al de kinderen van Seth verstoren.", "Deut 1:7": "Keer u om, vertrek, en ga naar het gebergte van de Amorieten, en naar al hun buren, in het vlakke veld, op het gebergte, en in de laagte, en in het zuiden, en aan de kust van de zee; het land van de Kanaänieten, en de Libanon, tot aan die grote rivier, de rivier de Eufraat.", "1 Kron 17:1": "Het gebeurde nu, toen David in zijn huis woonde, dat David tegen Nathan, de profeet, zei: Zie, ik woon in een huis van cederhout, maar de ark van het verbond van de HEERE staat onder gordijnen.", "1 Kron 5:9": "en hij woonde in het oosten, tot aan de ingang van de woestijn, vanaf de rivier de Eufraat; want hun vee was veel geworden in het land Gilead.", "2 Kron 27:5": "Hij streed ook tegen de koning van de Ammonieten, en had de overhand over hen, zodat de Ammonieten hem in datzelfde jaar honderd talenten van het zilver gaven, en tienduizend kor tarwe, en tienduizend gerst; dit brachten de Ammonieten hem opnieuw, ook in het tweede en in het derde jaar.", "2 Sam 7:9": "En Ik ben met u geweest, overal waar u gegaan bent, en heb al uw vijanden voor uw aangezicht uitgeroeid; en Ik heb u een grote naam gemaakt, als de naam van de groten die op de aarde zijn.", "Ezech 25:16": "Daarom, zo zegt de Heere HEERE: Zie, Ik strek Mijn hand uit tegen de Filistijnen, en Ik zal de Cherethieten uitroeien, en het overblijfsel van de zeehaven doen verdwijnen.", "2 Kron 9:24": "En zij brachten ieder zijn geschenk, zilveren vaten, en gouden vaten, en kleding, wapenrusting, en specerijen, paarden, en muilezels, elk jaar opnieuw.", "1 Kon 10:2": "En zij kwam in Jeruzalem, met een zeer zwaar leger, met kamelen die specerijen droegen, en zeer veel goud, en kostbaar gesteente; en zij kwam bij Salomo, en sprak met hem over alles wat er in haar hart was.", "Jes 30:16": "En u zegt: Nee, maar op paarden zullen wij vluchten; daarom zult u vluchten! En: Op snelle paarden zullen wij rijden; daarom zullen uw vervolgers ook snel zijn!", "Ps 144:1": "Een psalm van David. Geprezen zij de HEERE, mijn Rotssteen, Die mijn handen leert voor de strijd, mijn vingers voor de oorlog;", "2 Sam 8:15-18": "Zo regeerde David over heel Israël, en David deed aan zijn hele volk recht en gerechtigheid. Joab nu, de zoon van Zeruja, was over het leger; en Josafat, zoon van Achilud, was kanselier. En Zadok, zoon van Ahitub, en Achimelech, zoon van Abjathar, waren priesters; en Seraja was schrijver.", "Jer 23:5": "Zie, de dagen komen, spreekt de HEERE, dat Ik voor David een rechtvaardige Spruit zal doen opstaan; Die zal Koning zijnde regeren, en voorspoedig zijn, en recht en gerechtigheid doen op de aarde.", "2 Sam 10:15-19": "Toen nu de Syriërs zagen, dat zij voor Israëls aangezicht geslagen waren, verzamelden zij zich weer samen. En Hadad-Ezer zond heen, en liet de Syriërs uitkomen, die aan de overzijde van de rivier zijn, en zij kwamen te Helam; en Sobach, Hadad-Ezers legeraanvoerder, trok voor hun aangezicht heen. Toen dat aan David werd bekendgemaakt, verzamelde hij heel Israël, en trok over de Jordaan, en kwam te Helam, en de Syriërs stelden de slagorde op tegen David, en streden met hem.", "2 Sam 17:25": "En Absalom had Amasa in de plaats van Joab aangesteld over het leger. Amasa nu was de zoon van een man wiens naam Jethra was, de Israëliet, die bij Abigaïl was ingegaan, de dochter van Nahas, zuster van Zeruja, de moeder van Joab.", "Hand 25:20": "En omdat ik in twijfel was over het onderzoek van deze zaak, vroeg ik of hij naar Jeruzalem wilde gaan en daar over deze dingen geoordeeld wilde worden.", "2 Sam 20:25": "En Seja was schrijver; en Zadok en Abjathar waren priesters.", "Ps 45:8": "U hebt gerechtigheid lief, en haat goddeloosheid; daarom heeft God, Uw God, U gezalfd met vreugdeolie, boven Uw metgezellen.", "1 Sam 10:27": "Doch de verdorven mensen zeiden: Wat zou deze man ons kunnen redden? En zij verachtten hem, en brachten hem geen geschenk. Doch hij deed alsof hij het niet hoorde.", "Gen 25:23": "En de HEERE zei tegen haar: Twee volken zijn in uw buik, en twee naties zullen zich uit uw ingewand van elkaar scheiden; en het ene volk zal sterker zijn dan het andere volk; en de oudste zal de jongste dienen.", "1 Sam 13:3": "Toen versloeg Jonathan de bezetting van de Filistijnen die te Geba was, en de Filistijnen hoorden dat. Daarom liet Saul de bazuin blazen door het hele land en zei: Laat de Hebreeën het horen.", "Ps 60:3": "O God! U had ons verstoten, U had ons uiteengescheurd, U bent toornig geweest; keer terug tot ons.", "1 Sam 13:2": "koos Saul zich drieduizend man uit Israël; er waren er bij Saul tweeduizend te Michmas en op het gebergte van Beth-el, en duizend waren er bij Jonathan te Gibea-benjamins; en de rest van het volk liet hij gaan, ieder naar zijn tent.", "Joz 11:6": "En de HEERE zei tegen Jozua: Wees niet bang voor hen; want morgen omtrent deze tijd zal Ik hen allemaal verslagen geven voor het aangezicht van Israël; hun paarden zult u verlammen, en hun wagens met vuur verbranden.", "Hand 23:34": "En de stadhouder, die de brief gelezen had, vroeg uit welke provincie hij was; en toen hij begreep dat hij uit Cilicië kwam,", "1 Kon 4:4": "En Benaja, de zoon van Jojada, was over het leger; en Zadok en Abjathar waren priesters.", "1 Kron 29:2": "Ik heb nu uit al mijn kracht klaargemaakt voor het huis van mijn God: goud voor de gouden dingen, en zilver voor de zilveren, en koper voor de koperen, ijzer voor de ijzeren, en hout voor de houten werken; sardonyxstenen en stenen om in te zetten, glanzende stenen en stenen van verschillende kleuren, en allerlei kostbare stenen, en marmerstenen in overvloed.", "2 Kron 7:17": "En wat u betreft, als u voor Mijn aangezicht wandelt, zoals uw vader David gewandeld heeft, en doet naar alles wat Ik u geboden heb, en Mijn inzettingen en Mijn rechten houdt;", "2 Sam 24:25": "En David bouwde daar de HEERE een altaar, en offerde brandoffers en dankoffers. Zo werd de HEERE verbeden voor het land, en deze plaag werd van over Israël opgehouden.", "Ps 121:8": "De HEERE zal uw uitgaan en uw ingaan bewaren, van nu aan tot in eeuwigheid.", "Ps 89:15": "Gerechtigheid en gericht zijn de vastigheid van Uw troon; goedertierenheid en waarheid gaan voor Uw aangezicht heen.", "Ps 33:16": "Een koning wordt niet gered door een groot leger; een held wordt niet gered door grote kracht;", "1 Kron 22:14-16": "Zie, ik heb in mijn verdrukking voor het huis van de HEERE honderdduizend talenten van het goud bereid, en duizend maal duizend talenten van het zilver; en van het koper en van het ijzer is er geen gewicht, want het is er in overvloed; ik heb ook hout en stenen bereid; voegt u er nog meer aan toe. Ook zijn er bij u in overvloed die het werk kunnen doen: houwers, en werkmeesters in steen en hout, en allerlei wijze mensen in allerlei werk. Van het goud, van het zilver, en van het koper, en van het ijzer is geen getal; maak u op, en doe het, en de HEERE zal met u zijn.", "2 Sam 20:23-26": "Joab nu was over het hele leger van Israël; en Benaja, de zoon van Jojada, over de Krethi en over de Plethi; En Adoram was over de schatting; en Josafat, de zoon van Ahilud, was kanselier; En Seja was schrijver; en Zadok en Abjathar waren priesters.", "Zach 12:8": "Op die dag zal de HEERE de inwoners van Jeruzalem beschutten; en wie onder hen struikelen zou, zal op die dag zijn als David; en het huis van David zal zijn als goden, als de Engel van de HEERE voor hun aangezicht.", "2 Kon 8:12": "Toen zei Hazaël: Waarom weent mijn heer? En hij zei: Omdat ik weet welk kwaad u de Israëlieten aan zult doen; u zult hun vestingen in vuur laten opgaan, en hun jonge mannen met het zwaard doden, en hun kleine kinderen verpletteren, en hun zwangere vrouwen opensnijden.", "Ps 72:1-4": "Voor Salomo. O God! Geef de koning Uw rechten, en Uw gerechtigheid de zoon van de koning. Zo zal hij Uw volk richten met gerechtigheid, en Uw ellendigen met recht. De bergen zullen aan het volk vrede dragen, ook de heuvels, met gerechtigheid.", "Ps 78:55": "En Hij verdreef voor hun aangezicht de heidenen, en liet hen vallen in het snoer van hun erfenis, en liet de stammen van Israël in hun tenten wonen.", "1 Sam 14:15": "En er kwam beving in het leger, op het veld en onder heel het volk; de bezetting en de plunderaars beefden ook zelf; ja, het land schudde, want het was een beving van God.", "2 Sam 12:31": "Het volk dat daarin was, voerde hij naar buiten, en zette hen aan het werk met zagen, en met ijzeren dorswagens, en met ijzeren bijlen, en liet hen door de steenoven gaan; en zo deed hij met alle steden van de kinderen van Ammon. Daarna keerde David, met heel het volk, terug naar Jeruzalem.", "1 Kon 2:34": "En Benaja, de zoon van Jojada, ging omhoog, en viel op hem aan, en doodde hem; en hij werd begraven in zijn huis, in de woestijn.", "2 Sam 6:18": "Toen David geëindigd had het brandoffer en de dankoffers te offeren, zegende hij het volk in de Naam van de HEERE van de heerscharen.", "Ps 33:17": "Het paard schiet tekort voor de overwinning, en bevrijdt niet door zijn grote sterkte.", "Jes 31:1": "Wee hun die naar Egypte om hulp aftrekken, en steunen op paarden, en vertrouwen op wagens, omdat er veel zijn, en op ruiters, omdat die zeer machtig zijn; en niet zien op de Heilige van Israël, en de HEERE niet zoeken.", "Jer 36:12": "ging hij naar het huis van de koning, naar de kamer van de schrijver; en zie, daar zaten al de vorsten: Elisama, de schrijver, en Delaja, de zoon van Semaja, en Elnathan, de zoon van Achbor, en Gemarja, de zoon van Safan, en Zedekia, de zoon van Hananja, en al de vorsten.", "2 Sam 8:3-13": "David sloeg ook Hadad-Ezer, de zoon van Rechob, de koning van Zoba, toen hij op weg ging om zijn macht te herstellen tot aan de rivier Frath. En David nam hem duizend wagens af, en zevenhonderd ruiters, en twintigduizend man voetvolk; en David sneed de pezen door van alle wagenpaarden, en hield daarvan honderd wagens over. En de Syriërs van Damaskus kwamen om Hadad-Ezer, de koning van Zoba, te helpen; maar David sloeg van de Syriërs tweeëntwintigduizend man.", "Amos 5:24": "Maar laat het oordeel zich voortbewegen als de wateren, en de gerechtigheid als een sterke beek.", "2 Sam 12:26-31": "Joab nu streed tegen Rabba van de kinderen van Ammon; en hij nam de koninklijke stad in. Toen zond Joab boden naar David, en zei: Ik heb gestreden tegen Rabba, en ik heb ook de waterstad ingenomen. Verzamel u nu het overige van het volk, en beleger de stad, en neem haar in; anders zou het, als ík de stad zou innemen, naar mijn naam genoemd worden.", "Hand 23:35": "zei hij: Ik zal u horen wanneer ook uw aanklagers hier gekomen zijn. En hij beval dat hij bewaard zou worden in het rechthuis van Herodes.", "Ps 45:7": "Uw troon, o God! is eeuwig en altijd; de scepter van Uw koninkrijk is een scepter van rechtmatigheid.", "1 Kon 11:24": "tegen wie hij ook mannen verzameld had, en hij werd aanvoerder van een bende, toen David hen doodde; en zij trokken naar Damascus, woonden daar en regeerden in Damascus.", "1 Kon 3:14": "En als u in Mijn wegen wandelt en Mijn inzettingen en Mijn geboden onderhoudt, zoals uw vader David gewandeld heeft, dan zal Ik ook uw dagen verlengen.", "1 Sam 13:5": "En de Filistijnen werden verzameld om tegen Israël te strijden, dertigduizend wagens en zesduizend ruiters, en volk in menigte als het zand dat aan de oever van de zee is; en zij trokken op en legerden zich te Michmas, ten oosten van Beth-aven.", "Ezra 7:25": "En u, Ezra, stel naar de wijsheid van uw God, die in uw hand is, regeerders en rechters aan, die al het volk rechtspreken dat aan de overkant van de rivier is, allen die de wetten van God kennen; en wie ze niet kent, moet u het bekendmaken.", "Ps 78:72": "Ook heeft hij hen geweid naar de oprechtheid van zijn hart, en heeft hen geleid met een zeer verstandig beleid van zijn handen.", "1 Kron 11:22": "Benaja, de zoon van Jojada, de zoon van een dapper man uit Kabzeël, was groot van daden; hij versloeg twee sterke leeuwen van Moab; ook ging hij af, en versloeg een leeuw in het midden van het kuil, in de sneeuwtijd.", "Ps 144:2": "Mijn Goedertierenheid en mijn Burg, mijn Hoog Vertrek en mijn Bevrijder voor mij, mijn Schild, en op Wie ik vertrouw; Die mijn volk aan mij onderwerpt!", "1 Sam 14:6": "Jonathan nu zei tegen de jongen die zijn wapens droeg: Kom, laten we naar de bezetting van deze onbesnedenen oversteken; misschien zal de HEERE voor ons werken, want bij de HEERE is geen belemmering om te verlossen door velen of door weinigen.", "Joz 1:4": "Van de woestijn en deze Libanon af tot aan de grote rivier, de rivier Frath, het hele land van de Hethieten, en tot aan de grote zee tegen de ondergang van de zon, zal uw gebied zijn.", "Gen 15:18": "Op dezelfde dag maakte de HEERE een verbond met Abram, en Hij zei: Aan uw nageslacht heb Ik dit land gegeven, van de rivier van Egypte af, tot aan die grote rivier, de rivier de Eufraat:", "2 Sam 20:23": "Joab nu was over het hele leger van Israël; en Benaja, de zoon van Jojada, over de Krethi en over de Plethi;", "Ps 72:2": "Zo zal hij Uw volk richten met gerechtigheid, en Uw ellendigen met recht.", "Gen 27:37": "Toen antwoordde Izak, en zei tegen Ezau: Zie, ik heb hem tot een heer over u gesteld, en al zijn broers heb ik hem tot knechten gegeven; en ik heb hem met koren en most ondersteund; wat zal ik dan nu voor u doen, mijn zoon?", "Gen 43:27": "En hij vroeg hun naar hun welzijn, en zei: Gaat het goed met uw vader, de oude man, over wie u zei? Leeft hij nog?", "2 Sam 20:26": "En ook was Ira, de Jaïriet, Davids opperofficier.", "Deut 11:24": "Elke plaats, waar uw voetzool op treedt, zal de uwe zijn; van de woestijn en de Libanon, van de rivier, de rivier de Eufraat, tot aan de verste zee, zal uw gebied zijn.", "2 Kron 12:10": "En koning Rehabeam maakte, in plaats daarvan, koperen schilden; en hij gaf die in bewaring bij de aanvoerders van de wacht, die de deur van het huis van de koning bewaakten.", "1 Kron 18:11": "Deze heiligde koning David ook aan de HEERE, met het zilver en het goud dat hij had meegebracht van alle heidenvolken: van de Edomieten, en van de Moabieten, en van de kinderen van Ammon, en van de Filistijnen, en van de Amalekieten.", "2 Kron 8:6": "alsook Baälath, en alle schatsteden die Salomo had, en alle wagensteden, en de steden van de ruiters, en alles wat de begeerte van Salomo begeerd had te bouwen in Jeruzalem, en in de Libanon, en in heel het land van zijn heerschappij.", "1 Kon 2:35": "En de koning stelde Benaja, de zoon van Jojada, in zijn plaats aan over het leger; en Zadok, de priester, stelde de koning aan in de plaats van Abjathar.", "Jer 4:29": "Van het geroep van de ruiters en boogschutters vluchten alle steden; zij gaan de wouden in, en klimmen op de rotsen; alle steden zijn verlaten, zodat niemand erin woont.", "Ex 14:23": "En de Egyptenaren vervolgden hen, en gingen achter hen aan, in het midden van de zee, met alle paarden van Farao, zijn wagens en zijn ruiters.", "Zach 2:1": "Opnieuw hief ik mijn ogen op, en ik zag; en zie, er was een man, en in zijn hand was een meetsnoer.", "1 Sam 14:1": "Het gebeurde nu op een dag dat Jonathan, de zoon van Saul, tegen de jongen die zijn wapens droeg, zei: Kom, laten we naar de bezetting van de Filistijnen oversteken, die aan de overkant is. Maar hij vertelde het zijn vader niet.", "2 Kron 24:14": "Toen zij het nu klaar hadden, brachten zij voor de koning en Jojada het overige van het geld, waarvan hij vaten maakte voor het huis van de HEERE, vaten om te dienen en te offeren, en rookschalen, en gouden en zilveren vaten; en zij offerden voortdurend brandoffers in het huis van de HEERE, al de dagen van Jojada.", "1 Kron 18:8": "Ook nam David heel veel koper uit Tibchath en uit Chun, steden van Hadar-ezer; daarvan heeft Salomo de koperen zee, en de pilaren, en de koperen voorwerpen gemaakt.", "2 Kron 4:1-18": "Hij maakte ook een koperen altaar, van twintig ellen in zijn lengte en twintig ellen in zijn breedte, en tien ellen in zijn hoogte. Daartoe maakte hij de gegoten zee; van tien ellen was zij, van de ene rand tot de andere rand, rondom rond, en van vijf ellen in haar hoogte, en een meetsnoer van dertig ellen omving haar rondom. Onder haar nu was de gelijkenis van runderen, die er rondom omheen stonden, tien in een el, die de zee omringden. Twee rijen van deze runderen waren in haar gieting gegoten.", "Ps 75:3": "Als ik het bestemde ambt zal ontvangen hebben, zal ik geheel rechtvaardig richten.", "Richt 12:1-3": "Toen werden de mannen van Efraïm bijeengeroepen, en zij trokken naar het noorden; en zij zeiden tegen Jeftha: Waarom bent u doorgetrokken om te strijden tegen de kinderen van Ammon, en hebt u ons niet geroepen om met u mee te gaan? Wij zullen uw huis boven u met vuur verbranden. En Jeftha zei tegen hen: Ik en mijn volk waren in hevige strijd met de kinderen van Ammon; en ik heb u geroepen, maar u hebt mij niet uit hun hand verlost. Toen ik nu zag dat u mij niet verloste, zette ik mijn leven op het spel en trok tegen de kinderen van Ammon, en de HEERE gaf hen in mijn hand; waarom bent u dan vandaag naar mij toegekomen om tegen mij te strijden?", "Ps 121:7": "De HEERE zal u bewaren voor alle kwaad; uw ziel zal Hij bewaren.", "2 Kon 12:13": "Toch werden er voor het huis van de HEERE geen zilveren schalen, gaffelen, sprenkelschalen, trompetten, of enig gouden of zilveren voorwerp gemaakt, van het geld dat naar het huis van de HEERE gebracht werd.", "1 Kron 11:25": "Zie, hij was de meest geëerde van die dertig; toch kwam hij niet aan de drie toe. En David stelde hem over zijn lijfwacht.", "2 Kron 17:5": "En de HEERE bevestigde het koninkrijk in zijn hand, en heel Juda gaf Josafat geschenken; en hij had rijkdom en eer in overvloed.", "Ps 132:1-5": "Een lied Hammaaloth. O HEERE, denk aan David, aan al zijn lijden; dat hij de HEERE gezworen heeft, de Machtige van Jakob een gelofte gedaan heeft, en zei: Zeker, ik zal in de tent van mijn huis niet ingaan, ik zal op de koets van mijn bed niet klimmen!", "1 Kon 10:16": "Ook maakte de koning Salomo tweehonderd schilden van gehamerd goud; zeshonderd sikkel goud liet hij besteden aan elk schild.", "Jer 23:6": "In Zijn dagen zal Juda verlost worden, en Israël zal zeker wonen; en dit zal Zijn naam zijn, waarmee men Hem zal noemen: De Heere: ONZE GERECHTIGHEID.", "Fil 2:9": "Daarom heeft God Hem ook uitermate verhoogd, en heeft Hem een Naam gegeven, die boven alle naam is;", "Ezra 8:26": "ik woog dan aan hun hand zeshonderdvijftig talenten van het zilver, en honderd zilveren vaten in talenten; aan goud, honderd talenten;", "2 Sam 10:8": "En de kinderen Ammons trokken uit, en stelden de slagorde op voor de ingang van de poort; maar de Syriërs van Zoba, en Rechob, en de mannen van Tob en Maächa waren afzonderlijk in het veld.", "2 Kron 9:15": "Daartoe maakte koning Salomo tweehonderd schilden van geslagen goud; zeshonderd sikkel geslagen goud liet hij besteden aan elk schild.", "1 Kon 10:9": "Geloofd zij de HEERE, uw God, Die behagen in u heeft gehad, om u op de troon van Israël te zetten! Omdat de HEERE Israël in eeuwigheid liefheeft, daarom heeft Hij u tot koning gesteld, om recht en gerechtigheid te doen.", "Jer 22:16": "Hij heeft de rechtszaak van de ellendige en behoeftige berecht, toen ging het hem goed; is dat niet Mij kennen? spreekt de HEERE.", "Ps 122:5": "Want daar staan de stoelen van het gericht, de stoelen van het huis van David.", "1 Kron 24:4": "En van de kinderen van Eleazar werden meer hoofden van de mannen gevonden dan van de kinderen van Ithamar, toen zij hen indeelden; van de kinderen van Eleazar waren zestien hoofden van de families, maar van de kinderen van Ithamar, naar hun families, acht.", "Ex 23:31": "En Ik zal uw grenzen vaststellen van de Schelfzee tot aan de zee van de Filistijnen, en van de woestijn tot aan de rivier; want Ik zal de inwoners van dat land in uw hand geven, zodat u hen voor uw aangezicht wegjaagt.", "2 Sam 7:18-29": "Toen ging koning David naar binnen, en bleef voor het aangezicht van de HEERE, en hij zei: Wie ben ik, Heere HEERE, en wat is mijn huis, dat U mij tot hiertoe gebracht hebt? Daarbij is dit in Uw ogen nog klein geweest, Heere HEERE, maar U hebt ook over het huis van uw knecht gesproken tot ver in de toekomst; en dit naar de wet van de mensen, Heere HEERE! En wat zal David nog meer tot U spreken? Want U kent Uw knecht, Heere HEERE!", "1 Kron 17:16-27": "Toen kwam koning David binnen, en bleef voor het aangezicht van de HEERE, en hij zei: Wie ben ik, HEERE God, en wat is mijn huis, dat U mij tot hiertoe gebracht hebt? En dit is nog klein geweest in Uw ogen, o God! Daarom hebt U over het huis van Uw knecht ook gesproken voor een verre toekomst, en U hebt mij naar menselijke maatstaf voorzien met deze verhoging, o HEERE God! Wat zal David hier verder aan toevoegen, vanwege de eer aan Uw knecht? Maar U kent Uw knecht wel.", "1 Kon 11:23-25": "Ook verwekte God tegen hem een tegenstander, Rezon, de zoon van Eljada, die gevlucht was van zijn heer Hadad-ezer, de koning van Zoba, tegen wie hij ook mannen verzameld had, en hij werd aanvoerder van een bende, toen David hen doodde; en zij trokken naar Damascus, woonden daar en regeerden in Damascus. En hij was Israëls tegenstander al de dagen van Salomo, naast het kwaad dat Hadad deed; want hij had een afkeer van Israël, en hij regeerde over Syrië.", "Jes 8:9": "Verzamel u samen, volken! Toch zult u verbroken worden; en neem het ter ore, allen die in verre landen bent, omgord u, toch zult u verbroken worden; omgord u, toch zult u verbroken worden!", "1 Sam 13:10": "En het gebeurde, toen hij klaar was met het offeren van het brandoffer, zie, dat Samuël kwam; en Saul ging naar buiten, hem tegemoet, om hem te groeten.", "Ps 89:21": "Ik heb David, Mijn knecht, gevonden; met Mijn heilige olie heb Ik hem gezalfd;", "2 Sam 21:15-22": "Verder hadden de Filistijnen nog een oorlog tegen Israël. En David trok af, en zijn knechten met hem, en zij streden tegen de Filistijnen, zodat David moe werd. En Isbi-Benob, die van de kinderen van Rafa was, met een speer die driehonderd sikkel koper woog, en hij was omgord met een nieuw zwaard; deze dacht David te doden. Maar Abisai, de zoon van Zeruja, hielp hem, en sloeg de Filistijn, en doodde hem. Toen zwoeren de mannen van David hem, en zeiden: U zult niet meer met ons uittrekken ten strijde, zodat u de lamp van Israël niet uitblust.", "Richt 3:29": "En zij sloegen de Moabieten in die tijd, ongeveer tienduizend man, allen sterke en allen strijdbare mannen, zodat er niet één man ontkwam.", "2 Sam 6:5": "En David en het hele huis van Israël speelden voor het aangezicht van de HEERE, met allerlei snarenspel van dennenhout, met harpen, en met luiten, en met trommels, ook met schellen, en met cimbalen.", "Ps 5:12": "Maar laat verblijd zijn allen die op U vertrouwen, tot in eeuwigheid; laat hen juichen, omdat U hen overdekt; en laat in U van vreugde opspringen die Uw Naam liefhebben.", "2 Sam 20:24": "En Adoram was over de schatting; en Josafat, de zoon van Ahilud, was kanselier;", "2 Sam 15:12": "Absalom zond ook om Achitofel, de Giloniet, Davids raadsman, te halen uit zijn stad, uit Gilo, terwijl hij offers bracht. En de samenzwering werd sterk, en het volk kwam gestaag toe en werd meer bij Absalom.", "Ps 27:7-14": "Hoor, HEERE, mijn stem, als ik roep; en wees mij genadig, en antwoord mij. Mijn hart zegt tegen U: U zegt: Zoek Mijn aangezicht; ik zoek Uw aangezicht, o HEERE! Verberg Uw aangezicht niet voor mij, keer Uw knecht niet af in toorn; U bent mijn Hulp geweest, verlaat mij niet, en begeef mij niet, o God van mijn heil!", "Richt 3:15": "Toen riepen de kinderen van Israël tot de HEERE, en de HEERE verwekte hun een verlosser, Ehud, de zoon van Gera, een zoon van Jemini, een man die links was. En de kinderen van Israël zonden door zijn hand een geschenk aan Eglon, de koning van de Moabieten.", "1 Kron 18:15-17": "Joab nu, de zoon van Zeruja, ging over het leger; en Josafat, de zoon van Ahilud, was kanselier; en Zadok, de zoon van Ahitub, en Abimelech, de zoon van Abjathar, waren priesters, en Sausa was schrijver; en Benaja, de zoon van Jojada, ging over de Krethi en Plethi; maar de zonen van David waren de eersten aan de hand van de koning.", "1 Sam 16:20": "Toen nam Isaï een ezel met brood, en een leren zak met wijn, en een geitenbokje; en hij stuurde ze door de hand van zijn zoon David naar Saul.", "2 Kron 26:7": "En God hielp hem tegen de Filistijnen, en tegen de Arabieren die te Gur-baal woonden, en tegen de Meunieten.", "1 Kron 18:6": "En David legde bezetting in Syrië van Damaskus, zodat de Syriërs Davids knechten werden, die geschenken brachten. En de HEERE gaf David de overwinning overal waar hij heenging.", "Neh 13:13": "En ik stelde tot schatmeesters over de schatten Selemja, de priester, en Zadok, de schrijver, en Pedaja, uit de Levieten; en aan hun zijde Hanan, de zoon van Zakkur, de zoon van Matthanja; want zij werden betrouwbaar geacht, en hun werd opgelegd het aan hun broeders uit te delen.", "1 Kron 18:2-11": "Hij sloeg ook de Moabieten, zodat de Moabieten Davids knechten werden, die geschenken brachten. David sloeg ook Hadar-ezer, de koning van Zoba, naar Hamath toe, toen hij optrok om zijn macht te vestigen aan de rivier de Eufraat. En David nam hem duizend wagens af, en zevenduizend ruiters, en twintigduizend man te voet; en David sneed bij alle wagenpaarden de hezenpezen door; maar hij hield honderd wagens daarvan over.", "Est 3:12": "Toen werden de schrijvers van de koning geroepen, in de eerste maand, op de dertiende dag daarvan, en er werd geschreven naar alles wat Haman beval, aan de stadhouders van de koning, en aan de landvoogden die over elk landschap waren, en aan de vorsten van elk volk, elk landschap naar zijn schrift, en elk volk naar zijn taal; er werd geschreven in de naam van de koning Ahasveros, en het werd met de ring van de koning verzegeld.", "2 Sam 23:20-23": "Verder Benaja, de zoon van Jojada, de zoon van een dappere man, groot van daden, uit Kabzeel; die versloeg twee sterke leeuwen van Moab; ook ging hij af, en sloeg een leeuw in het midden van een kuil in de sneeuwtijd. Daarbij versloeg hij een Egyptische man, een man van aanzien; en in de hand van de Egyptenaar was een speer, maar hij ging op hem af met een staf; en hij rukte de speer uit de hand van de Egyptenaar, en doodde hem met zijn eigen speer. Deze dingen deed Benaja, de zoon van Jojada; daarom had hij een naam onder de drie helden.", "2 Sam 5:17-23": "Toen de Filistijnen hoorden dat zij David tot koning over Israël gezalfd hadden, trokken alle Filistijnen op om David te zoeken; en David hoorde dat en trok af naar de burcht. En de Filistijnen kwamen en verspreidden zich in het dal Refaïm. Toen vroeg David de HEERE: Zal ik optrekken tegen de Filistijnen? Zult U hen in mijn hand geven? En de HEERE zei tegen David: Trek op, want Ik zal de Filistijnen zeker in uw hand geven.", "Ps 129:8": "en zij die voorbijgaan, niet zeggen: De zegen van de HEERE zij bij u! Wij zegenen u in de Naam van de HEERE.", "1 Kron 18:12": "Ook sloeg Abisaï, de zoon van Zeruja, de Edomieten in het Zoutdal, achttienduizend man.", "1 Kon 4:3": "Elihoref en Ahia, de zoon van Sisa, waren schrijvers; Josafat, de zoon van Ahilud, was kanselier.", "Joz 6:19": "Maar al het zilver en goud, en de koperen en ijzeren voorwerpen, zullen de HEERE heilig zijn; naar de schat van de HEERE zullen zij komen.", "Num 24:18": "En Edom zal een erfelijk bezit zijn; en Seir zal voor zijn vijanden een erfelijk bezit zijn; doch Israël zal met kracht handelen.", "1 Kon 10:26": "Verder verzamelde Salomo wagens en ruiters, en hij had duizend vierhonderd wagens, en twaalfduizend ruiters, en hij bracht ze onder in de wagensteden en bij de koning in Jeruzalem.", "1 Kron 18:14": "Zo regeerde David over heel Israël, en hij handelde met recht en gerechtigheid tegenover zijn hele volk.", "1 Kron 24:3": "David nu verdeelde hen, en Zadok uit de kinderen van Eleazar, en Abimelech uit de kinderen van Ithamar, naar hun ambt in hun dienst.", "1 Kron 24:6": "En Semaja, de zoon van Nethaneel, de schrijver, uit de Levieten, schreef hen op, voor het aangezicht van de koning, en van de vorsten, en van de priester Zadok, en van Achimelech, de zoon van Abjathar, en van de familiehoofden onder de priesters en onder de Levieten; één familie werd genomen voor Eleazar, en zo ook werd er één genomen voor Ithamar.", "Joz 17:14": "Toen spraken de kinderen van Jozef tot Jozua en zeiden: Waarom hebt u ons als erfdeel maar één lot en één snoer gegeven, terwijl wij toch een groot volk zijn, aangezien de HEERE ons tot nu toe zo gezegend heeft?", "1 Kron 27:32-34": "En Jonathan, de oom van David, was raadsman, een verstandig man; hij was ook schrijver; Jehiël nu, de zoon van Hachmoni, was bij de zonen van de koning. En Achitofel was raadsman van de koning; en Husai, de Archiet, was de vriend van de koning. En na Achitofel was Jojada, de zoon van Benaja, en Abjathar; maar Joab was de legeraanvoerder van de koning.", "Jes 36:16": "Luister niet naar Hizkia; want zo zegt de koning van Assyrië: Sluit vrede met mij door een geschenk, en kom naar buiten tot mij, en eet ieder van zijn wijnstok, en ieder van zijn vijgenboom, en drink ieder het water van zijn eigen bornput,", "Ps 20:8": "Dezen vermelden van wagens, en die van paarden; maar wij zullen vermelden van de Naam van de HEERE, onze God.", "1 Kon 1:47": "Ook zijn de knechten van de koning gekomen om onze heer, de koning David, te zegenen, en zeiden: Uw God make de naam van Salomo beter dan uw naam, en make zijn troon groter dan uw troon; en de koning heeft zich neergebogen op het bed.", "1 Kon 14:27": "En koning Rehabeam maakte in plaats daarvan koperen schilden; en hij vertrouwde die toe aan de hand van de aanvoerders van de lijfwacht, die de deur van het huis van de koning bewaakten.", "Amos 5:15": "Haat het kwade, en heb het goede lief, en zorg voor recht in de poort; misschien zal de HEERE, de God van de heerscharen, aan het overblijfsel van Jozef genadig zijn.", "1 Kron 18:3": "David sloeg ook Hadar-ezer, de koning van Zoba, naar Hamath toe, toen hij optrok om zijn macht te vestigen aan de rivier de Eufraat.", "Deut 17:16": "Maar hij mag voor zichzelf de paarden niet vermeerderen, en het volk niet laten terugkeren naar Egypte om paarden te vermeerderen; want de HEERE heeft tegen u gezegd: U mag voortaan niet meer terugkeren langs deze weg.", "Hand 25:12": "Toen antwoordde Festus, nadat hij met de raad gesproken had: Hebt u zich op de keizer beroepen? U zult naar de keizer gaan.", "1 Kon 15:15": "En hij bracht in het huis van de HEERE de geheiligde dingen van zijn vader, en zijn eigen geheiligde dingen: zilver, en goud, en vaten.", "2 Sam 10:6": "Toen nu de kinderen Ammons zagen, dat zij zich bij David stinkend gemaakt hadden, zonden de kinderen Ammons heen, en huurden van de Syriërs van Beth-Rechob, en van de Syriërs van Zoba, twintigduizend man van het voetvolk, en van de koning van Maächa duizend man, en van de mannen van Tob twaalfduizend man.", "2 Kon 1:1": "En Moab kwam in opstand tegen Israël, na de dood van Achab.", "1 Kon 11:23": "Ook verwekte God tegen hem een tegenstander, Rezon, de zoon van Eljada, die gevlucht was van zijn heer Hadad-ezer, de koning van Zoba,", "1 Kron 29:10": "Daarom loofde David de HEERE voor de ogen van de hele gemeente; en David zei: Geloofd bent U, HEERE, God van onze vader Israël, van eeuwigheid tot in eeuwigheid!", "Matt 27:11-26": "En Jezus stond voor de stadhouder; en de stadhouder vroeg Hem: Bent U de Koning van de Joden? En Jezus zei tegen hem: U zegt het. En toen Hij door de overpriesters en de oudsten beschuldigd werd, antwoordde Hij niets. Toen zei Pilatus tegen Hem: Hoort U niet hoeveel zij tegen U getuigen?", "1 Kron 18:15": "Joab nu, de zoon van Zeruja, ging over het leger; en Josafat, de zoon van Ahilud, was kanselier;", "2 Kron 8:3": "Daarna trok Salomo naar Hamath-Zoba, en hij overweldigde het.", "2 Kron 12:3": "met duizend tweehonderd wagens, en met zestigduizend ruiters; en van het volk dat met hem uit Egypte kwam was geen getal: Libiërs, Sukkieten en Cusjieten.", "1 Kon 10:10": "En zij gaf de koning honderdtwintig talenten goud, en zeer veel specerijen, en kostbaar gesteente; zoveel specerijen als de koningin van Scheba de koning Salomo gaf, is er nooit meer in zulke hoeveelheid gekomen.", "1 Kron 11:6": "Want David zei: Al wie de Jebusieten het eerst verslaat, zal tot hoofd en leider worden. Toen klom Joab, de zoon van Zeruja, er als eerste op; daarom werd hij tot hoofd.", "Zach 10:5": "En zij zullen zijn als de helden, die in het slijk van de straten treden in de strijd, en zij zullen strijden; want de HEERE zal met hen zijn, en zij zullen hen beschamen die op paarden rijden.", "2 Kon 19:2": "Daarna stuurde hij Eljakim, de hofmeester, en Sebna, de schrijver, en de oudsten van de priesters, met zakken bedekt, naar Jesaja, de profeet, de zoon van Amoz;", "Hand 25:11": "Want als ik onrecht doe en iets gedaan heb dat de dood verdient, weiger ik niet te sterven; maar als er niets waar is van wat dezen mij beschuldigen, kan niemand mij uit gunst aan hen overgeven. Ik beroep mij op de keizer.", "2 Kron 9:16": "Insgelijks driehonderd schilden van geslagen goud; driehonderd sikkel goud liet hij besteden aan elk schild; en de koning legde ze in het huis van het woud van de Libanon.", "2 Sam 8:12-14": "van Syrië, en van Moab, en van de kinderen van Ammon, en van de Filistijnen, en van Amalek, en van de buit van Hadad-Ezer, de zoon van Rechob, de koning van Zoba. Ook maakte David zich een naam, toen hij terugkwam nadat hij de Syriërs geslagen had in het Zoutdal, achttienduizend man. En hij legde bezettingen in Edom; in heel Edom legde hij bezettingen; en alle Edomieten werden David tot knechten; en de HEERE behoedde David overal waar hij heentrok.", "1 Kon 22:48": "Toen was er geen koning in Edom, maar een stadhouder van de koning.", "Zef 2:5": "Wee de inwoners van de kuststreek van de zee, het volk van de Cheretieten! Het woord van de HEERE zal tegen u zijn, gij Kanaän, land van de Filistijnen! En Ik zal u verdoen, zodat er geen inwoner zal zijn.", "1 Kron 18:9": "Toen Thou, de koning van Hamath, hoorde dat David de hele legermacht van Hadar-ezer, de koning van Zoba, verslagen had,", "2 Kon 14:7": "Hij sloeg de Edomieten in het Zoutdal, tienduizend man, en nam Sela in met oorlog, en noemde het Jokteel, tot op deze dag.", "Openb 9:16-18": "En het getal van de legers van de ruiterij was tweemaal tienduizend maal tienduizend; en ik hoorde hun getal. En ik zag zo de paarden in dit visioen, en hen die daarop zaten, met vurige, en hemelsblauwe, en zwavelkleurige borstwapens; en de hoofden van de paarden waren als hoofden van leeuwen, en uit hun monden ging vuur, en rook, en zwavel, Door deze drie werd het derde deel van de mensen gedood, namelijk door het vuur, en door de rook, en door het zwavel, dat uit hun monden uitging.", "Ps 72:11": "Ja, alle koningen zullen zich voor hem neerbuigen, alle heidenvolken zullen hem dienen.", "1 Kron 27:32": "En Jonathan, de oom van David, was raadsman, een verstandig man; hij was ook schrijver; Jehiël nu, de zoon van Hachmoni, was bij de zonen van de koning.", "1 Kron 29:7": "En zij gaven voor de dienst van het huis van God vijfduizend talenten goud, en tienduizend drachmen, en tienduizend talenten zilver, en achttienduizend talenten koper, en honderdduizend talenten ijzer.", "Job 9:13": "God zal Zijn toorn niet afkeren; onder Hem worden de hoogmoedige helpers gebogen.", "1 Kron 26:26-28": "Deze Selomith en zijn broers waren over al de schatten van de heilige dingen, die koning David geheiligd had, alsook de hoofden van de families, de leiders over duizenden en honderden, en de leiders van het leger; Van de oorlogen en van de buit hadden zij het geheiligd, om het huis van de HEERE te onderhouden. Ook alles wat Samuël, de ziener, geheiligd had, en Saul, de zoon van Kis, en Abner, de zoon van Ner, en Joab, de zoon van Zeruja; al wat iemand geheiligd had, was onder de hand van Selomith en zijn broers.", "1 Kron 18:3-10": "David sloeg ook Hadar-ezer, de koning van Zoba, naar Hamath toe, toen hij optrok om zijn macht te vestigen aan de rivier de Eufraat. En David nam hem duizend wagens af, en zevenduizend ruiters, en twintigduizend man te voet; en David sneed bij alle wagenpaarden de hezenpezen door; maar hij hield honderd wagens daarvan over. En de Syriërs van Damaskus kwamen om Hadar-ezer, de koning van Zoba, te helpen; maar David sloeg van de Syriërs tweeëntwintigduizend man.", "2 Kon 22:1-14": "Josia was acht jaar oud, toen hij koning werd, en regeerde eenendertig jaar te Jeruzalem; en de naam van zijn moeder was Jedida, een dochter van Adaja, uit Bozkath. En hij deed wat recht was in de ogen van de HEERE; en hij wandelde in heel de weg van zijn vader David, en week niet af naar rechts of naar links. Het gebeurde nu in het achttiende jaar van koning Josia, dat de koning de schrijver Safan, de zoon van Azalia, de zoon van Mesullam, zond naar het huis van de HEERE, en zei:", "1 Kron 19:6": "Toen de kinderen van Ammon zagen dat zij zich stinkend gemaakt hadden bij David, stuurden Hanun en de kinderen van Ammon duizend talenten van het zilver, om zich wagens en ruiters te huren uit Mesopotamië, en uit Syrië-Maächa, en uit Zoba;", "2 Sam 6:14": "En David huppelde met alle macht voor het aangezicht van de HEERE; en David was omgord met een linnen lijfrok.", "Jes 31:3": "Want de Egyptenaren zijn mensen, en geen God, en hun paarden zijn vlees, en geen geest; en de HEERE zal Zijn hand uitstrekken, zodat de helper struikelen zal, en die geholpen wordt, zal neervallen, en zij zullen allemaal samen te niet komen.", "2 Sam 8:3-8": "David sloeg ook Hadad-Ezer, de zoon van Rechob, de koning van Zoba, toen hij op weg ging om zijn macht te herstellen tot aan de rivier Frath. En David nam hem duizend wagens af, en zevenhonderd ruiters, en twintigduizend man voetvolk; en David sneed de pezen door van alle wagenpaarden, en hield daarvan honderd wagens over. En de Syriërs van Damaskus kwamen om Hadad-Ezer, de koning van Zoba, te helpen; maar David sloeg van de Syriërs tweeëntwintigduizend man.", "Dan 5:2": "Toen Belsazar de wijn geproefd had, zei hij dat men de gouden en zilveren vaten voor moest brengen, die zijn vader Nebukadnezar uit de tempel die te Jeruzalem geweest was, weggevoerd had; opdat de koning en zijn leiders, zijn vrouwen en zijn bijvrouwen daaruit zouden drinken.", "1 Kon 8:18": "Maar de HEERE zei tot David, mijn vader: Omdat het in uw hart geweest is Mijn Naam een huis te bouwen, hebt u welgedaan, dat het in uw hart geweest is.", "Spr 21:31": "Het paard wordt bereid tegen de dag van het strijd; maar de overwinning is van de HEERE.", "2 Sam 23:14": "En David was toen in een vesting; en de bezetting van de Filistijnen was toen te Bethlehem.", "2 Kon 12:10-12": "Het gebeurde nu, toen zij zagen dat er veel geld in de kist was, dat de schrijver van de koning met de hogepriester opkwam, en zij bonden het samen en telden het geld dat in het huis van de HEERE gevonden werd. En zij gaven het geld, goed gewogen, in handen van hen die het werk verzorgden en die aangesteld waren over het huis van de HEERE; en zij betaalden daarmee de timmerlieden en de bouwlieden die het huis van de HEERE herstelden; En de metselaars en de steenhouwers, en om hout en gehouwen stenen te kopen, om de breuken van het huis van de HEERE te herstellen, en voor alles wat uitgegeven werd voor het huis, om dat te herstellen.", "1 Kon 4:1-19": "Zo was de koning Salomo koning over heel Israël. En dit waren de vorsten die hij had: Azaria, de zoon van Zadok, was opperambtman. Elihoref en Ahia, de zoon van Sisa, waren schrijvers; Josafat, de zoon van Ahilud, was kanselier.", "1 Kon 14:26": "En hij nam de schatten van het huis van de HEERE, en de schatten van het huis van de koning weg, ja, hij nam alles weg; hij nam ook al de gouden schilden weg die Salomo gemaakt had.", "Joz 22:8": "En hij sprak tot hen, en zei: Keert terug naar uw tenten met veel rijkdom, en met heel veel vee, met zilver, en met goud, en met koper, en met ijzer, en met heel veel kleding; deelt de buit van uw vijanden met uw broeders.", "Est 8:9": "Toen werden de schrijvers van de koning geroepen, op datzelfde moment, in de derde maand (dat is de maand Sivan), op de drieëntwintigste daarvan, en er werd geschreven naar alles wat Mordechai gebood, aan de Joden, en aan de stadhouders, en landvoogden, en leiders van de landschappen, die van Indië af tot aan Morenland reiken, honderdzevenentwintig landschappen, ieder landschap naar zijn eigen schrift, ieder volk naar zijn eigen taal; ook aan de Joden naar hun schrift en naar hun taal.", "1 Sam 13:14": "Maar nu zal uw koningschap niet blijven bestaan. De HEERE heeft Zich een man gezocht naar Zijn hart, en de HEERE heeft hem bevolen een voorganger te zijn over Zijn volk, omdat u niet gehouden hebt wat de HEERE u geboden had.", "Richt 11:33": "En hij versloeg hen van Aroer af tot waar u komt bij Minnith, twintig steden, en tot aan Abel-Keramim, met een zeer grote slag. Zo werden de kinderen van Ammon onderworpen voor het aangezicht van de kinderen van Israël.", "Joz 11:11": "En zij versloegen alle mensen die daarin waren, met de scherpte van het zwaard, ze met de ban treffend; er bleef niets over dat adem had; en Hazor verbrandde hij met vuur.", "2 Sam 23:3": "De God van Israël heeft gezegd, de Rotssteen van Israël heeft tot mij gesproken: Er zal een Heerser zijn over de mensen, een Rechtvaardige, een Heerser in de vreze van God.", "2 Sam 20:7": "Toen trokken uit, hem achterna, de mannen van Joab, en de Krethi, en de Plethi, en al de helden. Dezen trokken uit van Jeruzalem, om Seba, de zoon van Bichri, achterna te jagen.", "Jes 39:1": "In die tijd stuurde Merodach-Baladan, de zoon van Baladan, de koning van Babel, brieven en een geschenk aan Hizkia; want hij had gehoord dat hij ziek was geweest en weer sterk geworden was.", "2 Sam 15:18": "En al zijn knechten trokken aan zijn zijde voorbij, ook alle Krethi en alle Plethi, en alle Gethieten, zeshonderd man die van Gath te voet gekomen waren, trokken voor het aangezicht van de koning voorbij.", "Micha 4:13": "Maak u op en dors, dochter van Sion! Want Ik zal uw hoorn ijzer maken, en uw hoeven koper maken, en u zult veel volken verpletteren; en Ik zal hun winst aan de HEERE toewijden, en hun bezit aan de Heere van de hele aarde.", "1 Kon 7:51": "Zo werd al het werk voltooid dat koning Salomo voor het huis van de HEERE maakte. Daarna bracht Salomo de geheiligde dingen van zijn vader David: het zilver, het goud, en de voorwerpen legde hij bij de schatten van het huis van de HEERE.", "2 Sam 3:12": "Toen zond Abner boden namens zich naar David, en zei: Van wie is het land? En hij zei verder: Sluit uw verbond met mij, en zie, mijn hand zal met u zijn, om heel Israël tot u te doen overgaan.", "2 Sam 2:8": "Abner nu, de zoon van Ner, de legeraanvoerder die Saul gehad had, nam Isboseth, Sauls zoon, en voerde hem over naar Mahanaim,", "1 Sam 25:5": "zond David tien jongemannen; en David zei tegen de jongemannen: Ga op naar Karmel, en als u bij Nabal komt, zult u hem in mijn naam naar zijn welstand vragen;", "1 Kron 18:2-9": "Hij sloeg ook de Moabieten, zodat de Moabieten Davids knechten werden, die geschenken brachten. David sloeg ook Hadar-ezer, de koning van Zoba, naar Hamath toe, toen hij optrok om zijn macht te vestigen aan de rivier de Eufraat. En David nam hem duizend wagens af, en zevenduizend ruiters, en twintigduizend man te voet; en David sneed bij alle wagenpaarden de hezenpezen door; maar hij hield honderd wagens daarvan over.", "1 Kron 18:17": "en Benaja, de zoon van Jojada, ging over de Krethi en Plethi; maar de zonen van David waren de eersten aan de hand van de koning.", "Ps 83:5-9": "Zij hebben gezegd: Kom, laten we hen uitroeien, zodat zij geen volk meer zijn, en aan de naam van Israël niet meer gedacht wordt. Want zij hebben in hun hart samen een plan beraamd; tegen U hebben zij een verbond gesloten; de tenten van Edom en de Ismaëlieten, Moab en de Hagarenen;", "1 Sam 17:54": "Daarna nam David het hoofd van de Filistijn en bracht het naar Jeruzalem; maar zijn wapens legde hij in zijn tent.", "Richt 3:30": "Zo werd Moab op die dag onder de hand van Israël onderworpen; en het land was stil tachtig jaren.", "2 Sam 17:27": "En het gebeurde, toen David te Mahanaïm gekomen was, dat Sobi, de zoon van Nahas, uit Rabba van de kinderen van Ammon, en Machir, de zoon van Ammiël, uit Lodebar, en Barzillai, de Gileadiet, uit Rogelim,", "1 Sam 15:32": "Toen zei Samuël: Breng Agag, de koning van de Amalekieten, hier bij mij. Agag nu ging vol vertrouwen naar hem toe; en Agag zei: Voorwaar, de bitterheid van de dood is geweken!", "Richt 21:11": "Doch dit is de zaak die u doen zult: al wat mannelijk is, en alle vrouwen die gemeenschap met een man gehad hebben, zult u met de ban slaan.", "2 Kon 14:17": "Amazia nu, de zoon van Joas, koning van Juda, leefde na de dood van Joas, de zoon van Joahaz, de koning van Israël, nog vijftien jaar.", "Ps 78:71": "Van achter de zogende schapen liet Hij hem komen, om Jakob te weiden, Zijn volk, en Israël, Zijn erfenis.", "Amos 6:2": "Ga over naar Kalne, en zie toe; en ga vandaar naar Hamath, de grote stad, en trek af naar Gath van de Filistijnen; zijn zij beter dan deze koninkrijken, of is hun gebied groter dan uw gebied?", "1 Kron 29:17": "En ik weet, mijn God, dat U het hart beproeft, en dat U een welgevallen hebt aan oprechtheid. Ik heb in oprechtheid van mijn hart al deze dingen vrijwillig gegeven, en ik heb nu met vreugde Uw volk, dat hier aanwezig is, gezien, dat het zich tegenover U vrijwillig gedragen heeft."}, "noten": {}, "koppeling": {"1": "<span class=\"wl\" data-l=\"L1\" data-code=\"H1961\">En</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H1961\">het</span> gebeurde <span class=\"wl\" data-l=\"L2\" data-code=\"H310\">daarna</span>, <span class=\"wl\" data-l=\"L3\" data-code=\"H1732\">dat</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H1732\">David</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H1732\">de</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H6430\">Filistijnen</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H5221\">sloeg</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H1732\">en</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H3665\">bracht</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H3665\">hen</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H3665\">ten</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H3665\">onder</span>; <span class=\"wl\" data-l=\"L6\" data-code=\"H3665\">en</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H1732\">David</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H3947\">nam</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H4965\">Meteg</span>-<span class=\"wl\" data-l=\"L8\" data-code=\"H4965\">Amma</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H4965\">uit</span> <span class=\"wl\
