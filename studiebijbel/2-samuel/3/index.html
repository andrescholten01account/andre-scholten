"wl wl-kjv\" data-code=\"H3678\">throne</span> of <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> over <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> and over <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> from <span class=\"wl wl-kjv\" data-code=\"H1835\">Dan</span> even to <span class=\"wl wl-kjv\" data-code=\"H884\">Beersheba.</span>", "11": "And he <span class=\"wl wl-kjv\" data-code=\"H3201\">could</span> not <span class=\"wl wl-kjv\" data-code=\"H7725\">answer</span> <span class=\"wl wl-kjv\" data-code=\"H74\">Abner</span> a <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> again, because he <span class=\"wl wl-kjv\" data-code=\"H3372\">feared</span> him.", "12": "And <span class=\"wl wl-kjv\" data-code=\"H74\">Abner</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> <span class=\"wl wl-kjv\" data-code=\"H4397\">messengers</span> to <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> on his behalf, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Whose is the <span class=\"wl wl-kjv\" data-code=\"H776\">land?</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying</span> also, <span class=\"wl wl-kjv\" data-code=\"H3772\">Make</span> thy <span class=\"wl wl-kjv\" data-code=\"H1285\">league</span> with me, and, behold, my <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> shall be with thee, to bring <span class=\"wl wl-kjv\" data-code=\"H5437\">about</span> all <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> unto thee.", "13": "And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H2896\">Well;</span> I will <span class=\"wl wl-kjv\" data-code=\"H3772\">make</span> a <span class=\"wl wl-kjv\" data-code=\"H1285\">league</span> with thee: but <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H1697\">thing</span> I <span class=\"wl wl-kjv\" data-code=\"H7592\">require</span> of thee, that <span class=\"wl wl-kjv\" data-code=\"H559\">is,</span> Thou shalt not <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> my <span class=\"wl wl-kjv\" data-code=\"H6440\">face,</span> except thou <span class=\"wl wl-kjv\" data-code=\"H6440\">first</span> <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> <span class=\"wl wl-kjv\" data-code=\"H4324\">Michal</span> <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul's</span> <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter,</span> when thou <span class=\"wl wl-kjv\" data-code=\"H935\">comest</span> to <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> my <span class=\"wl wl-kjv\" data-code=\"H6440\">face.</span>", "14": "And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> <span class=\"wl wl-kjv\" data-code=\"H4397\">messengers</span> to <span class=\"wl wl-kjv\" data-code=\"H378\">Ishbosheth</span> <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul's</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">son,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">Deliver</span> me my <span class=\"wl wl-kjv\" data-code=\"H802\">wife</span> <span class=\"wl wl-kjv\" data-code=\"H4324\">Michal,</span> which I <span class=\"wl wl-kjv\" data-code=\"H781\">espoused</span> to me for an <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> <span class=\"wl wl-kjv\" data-code=\"H6190\">foreskins</span> of the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines.</span>", "15": "And <span class=\"wl wl-kjv\" data-code=\"H378\">Ishbosheth</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent,</span> and <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> her from her <span class=\"wl wl-kjv\" data-code=\"H376\">husband,</span> even from <span class=\"wl wl-kjv\" data-code=\"H6409\">Phaltiel</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H3889\">Laish.</span>", "16": "And her <span class=\"wl wl-kjv\" data-code=\"H376\">husband</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> with her along <span class=\"wl wl-kjv\" data-code=\"H1980\">weeping</span> <span class=\"wl wl-kjv\" data-code=\"H310\">behind</span> her to <span class=\"wl wl-kjv\" data-code=\"H980\">Bahurim.</span> Then <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> <span class=\"wl wl-kjv\" data-code=\"H74\">Abner</span> unto him, <span class=\"wl wl-kjv\" data-code=\"H3212\">Go,</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">return.</span> And he <span class=\"wl wl-kjv\" data-code=\"H7725\">returned.</span>", "17": "And <span class=\"wl wl-kjv\" data-code=\"H74\">Abner</span> had <span class=\"wl wl-kjv\" data-code=\"H1961\">communication</span> with the <span class=\"wl wl-kjv\" data-code=\"H2205\">elders</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Ye <span class=\"wl wl-kjv\" data-code=\"H1245\">sought</span> for <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> in <span class=\"wl wl-kjv\" data-code=\"H8543\">times</span> <span class=\"wl wl-kjv\" data-code=\"H8032\">past</span> to be <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> over you:", "18": "Now then <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> it: for the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H559\">spoken</span> of <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> By the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of my <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> I will <span class=\"wl wl-kjv\" data-code=\"H3467\">save</span> my <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> out of the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines,</span> and out of the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of all their <span class=\"wl wl-kjv\" data-code=\"H341\">enemies.</span>", "19": "And <span class=\"wl wl-kjv\" data-code=\"H74\">Abner</span> also <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> in the <span class=\"wl wl-kjv\" data-code=\"H241\">ears</span> of <span class=\"wl wl-kjv\" data-code=\"H1144\">Benjamin:</span> and <span class=\"wl wl-kjv\" data-code=\"H74\">Abner</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> also to <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> in the <span class=\"wl wl-kjv\" data-code=\"H241\">ears</span> of <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> in <span class=\"wl wl-kjv\" data-code=\"H2275\">Hebron</span> all that <span class=\"wl wl-kjv\" data-code=\"H5869\">seemed</span> <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> to <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> and that seemed <span class=\"wl wl-kjv\" data-code=\"H5869\">good</span> to the whole <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H1144\">Benjamin.</span>", "20": "So <span class=\"wl wl-kjv\" data-code=\"H74\">Abner</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> to <span class=\"wl wl-kjv\" data-code=\"H2275\">Hebron,</span> and <span class=\"wl wl-kjv\" data-code=\"H6242\">twenty</span> <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> with him. And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">made</span> <span class=\"wl wl-kjv\" data-code=\"H74\">Abner</span> and the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> that were with him a <span class=\"wl wl-kjv\" data-code=\"H4960\">feast.</span>", "21": "And <span class=\"wl wl-kjv\" data-code=\"H74\">Abner</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> I will <span class=\"wl wl-kjv\" data-code=\"H6965\">arise</span> and <span class=\"wl wl-kjv\" data-code=\"H3212\">go,</span> and will <span class=\"wl wl-kjv\" data-code=\"H6908\">gather</span> all <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> unto my <span class=\"wl wl-kjv\" data-code=\"H113\">lord</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> that they may <span class=\"wl wl-kjv\" data-code=\"H3772\">make</span> a <span class=\"wl wl-kjv\" data-code=\"H1285\">league</span> with thee, and that thou mayest <span class=\"wl wl-kjv\" data-code=\"H4427\">reign</span> over all that thine <span class=\"wl wl-kjv\" data-code=\"H5315\">heart</span> <span class=\"wl wl-kjv\" data-code=\"H183\">desireth.</span> And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> ➔ <span class=\"wl wl-kjv\" data-code=\"H74\">Abner</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">away;</span> and he <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> in <span class=\"wl wl-kjv\" data-code=\"H7965\">peace.</span>", "22": "And, behold, the <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> of <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> and <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> from pursuing a <span class=\"wl wl-kjv\" data-code=\"H1416\">troop,</span> and brought <span class=\"wl wl-kjv\" data-code=\"H935\">in</span> a <span class=\"wl wl-kjv\" data-code=\"H7227\">great</span> <span class=\"wl wl-kjv\" data-code=\"H7998\">spoil</span> with them: but <span class=\"wl wl-kjv\" data-code=\"H74\">Abner</span> was not with <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> in <span class=\"wl wl-kjv\" data-code=\"H2275\">Hebron;</span> for he had sent him <span class=\"wl wl-kjv\" data-code=\"H7971\">away,</span> and he was <span class=\"wl wl-kjv\" data-code=\"H3212\">gone</span> in <span class=\"wl wl-kjv\" data-code=\"H7965\">peace.</span>", "23": "When <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab</span> and all the <span class=\"wl wl-kjv\" data-code=\"H6635\">host</span> that was with him were <span class=\"wl wl-kjv\" data-code=\"H935\">come,</span> they <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H74\">Abner</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H5369\">Ner</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> and he hath sent him <span class=\"wl wl-kjv\" data-code=\"H7971\">away,</span> and he is <span class=\"wl wl-kjv\" data-code=\"H3212\">gone</span> in <span class=\"wl wl-kjv\" data-code=\"H7965\">peace.</span>", "24": "Then <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> What hast thou <span class=\"wl wl-kjv\" data-code=\"H6213\">done?</span> behold, <span class=\"wl wl-kjv\" data-code=\"H74\">Abner</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> unto thee; why is it that thou hast sent him <span class=\"wl wl-kjv\" data-code=\"H7971\">away,</span> and he is <span class=\"wl wl-kjv\" data-code=\"H1980\">quite</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">gone?</span>", "25": "Thou <span class=\"wl wl-kjv\" data-code=\"H3045\">knowest</span> <span class=\"wl wl-kjv\" data-code=\"H74\">Abner</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H5369\">Ner,</span> that he <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to <span class=\"wl wl-kjv\" data-code=\"H6601\">deceive</span> thee, and to <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> thy going <span class=\"wl wl-kjv\" data-code=\"H4161\">out</span> and thy coming <span class=\"wl wl-kjv\" data-code=\"H4126\">in,</span> and to <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> all that thou <span class=\"wl wl-kjv\" data-code=\"H6213\">doest.</span>", "26": "And when <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab</span> was come <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> from <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> he <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> <span class=\"wl wl-kjv\" data-code=\"H4397\">messengers</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> <span class=\"wl wl-kjv\" data-code=\"H74\">Abner,</span> which brought him <span class=\"wl wl-kjv\" data-code=\"H7725\">again</span> from the <span class=\"wl wl-kjv\" data-code=\"H953\">well</span> of <span class=\"wl wl-kjv\" data-code=\"H5626\">Sirah:</span> but <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H3045\">knew</span> it not.", "27": "And when <span class=\"wl wl-kjv\" data-code=\"H74\">Abner</span> was <span class=\"wl wl-kjv\" data-code=\"H7725\">returned</span> to <span class=\"wl wl-kjv\" data-code=\"H2275\">Hebron,</span> <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab</span> took him <span class=\"wl wl-kjv\" data-code=\"H5186\">aside</span> <span class=\"wl wl-kjv\" data-code=\"H413\">in</span> the <span class=\"wl wl-kjv\" data-code=\"H8179\">gate</span> to <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> with him <span class=\"wl wl-kjv\" data-code=\"H7987\">quietly,</span> and <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> him there under the <span class=\"wl wl-kjv\" data-code=\"H2570\">fifth</span> rib, that he <span class=\"wl wl-kjv\" data-code=\"H4191\">died,</span> for the <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> of <span class=\"wl wl-kjv\" data-code=\"H6214\">Asahel</span> his <span class=\"wl wl-kjv\" data-code=\"H251\">brother.</span>", "28": "And <span class=\"wl wl-kjv\" data-code=\"H310\">afterward</span> when <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> it, he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> I and my <span class=\"wl wl-kjv\" data-code=\"H4467\">kingdom</span> are <span class=\"wl wl-kjv\" data-code=\"H5355\">guiltless</span> before the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H5704\">for</span> <span class=\"wl wl-kjv\" data-code=\"H5769\">ever</span> from the <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> of <span class=\"wl wl-kjv\" data-code=\"H74\">Abner</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H5369\">Ner:</span>", "29": "Let it <span class=\"wl wl-kjv\" data-code=\"H2342\">rest</span> on the <span class=\"wl wl-kjv\" data-code=\"H7218\">head</span> of <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab,</span> and on all his <span class=\"wl wl-kjv\" data-code=\"H1\">father's</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house;</span> and let there not <span class=\"wl wl-kjv\" data-code=\"H3772\">fail</span> from the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab</span> one that hath an <span class=\"wl wl-kjv\" data-code=\"H2100\">issue,</span> or that is a <span class=\"wl wl-kjv\" data-code=\"H6879\">leper,</span> or that <span class=\"wl wl-kjv\" data-code=\"H2388\">leaneth</span> on a <span class=\"wl wl-kjv\" data-code=\"H6418\">staff,</span> or that <span class=\"wl wl-kjv\" data-code=\"H5307\">falleth</span> on the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword,</span> or that <span class=\"wl wl-kjv\" data-code=\"H2638\">lacketh</span> <span class=\"wl wl-kjv\" data-code=\"H3899\">bread.</span>", "30": "So <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab</span> and <span class=\"wl wl-kjv\" data-code=\"H52\">Abishai</span> his <span class=\"wl wl-kjv\" data-code=\"H251\">brother</span> <span class=\"wl wl-kjv\" data-code=\"H2026\">slew</span> <span class=\"wl wl-kjv\" data-code=\"H74\">Abner,</span> because he had <span class=\"wl wl-kjv\" data-code=\"H4191\">slain</span> their <span class=\"wl wl-kjv\" data-code=\"H251\">brother</span> <span class=\"wl wl-kjv\" data-code=\"H6214\">Asahel</span> at <span class=\"wl wl-kjv\" data-code=\"H1391\">Gibeon</span> in the <span class=\"wl wl-kjv\" data-code=\"H4421\">battle.</span>", "31": "And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab,</span> and to all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> that were with him, <span class=\"wl wl-kjv\" data-code=\"H7167\">Rend</span> your <span class=\"wl wl-kjv\" data-code=\"H899\">clothes,</span> and <span class=\"wl wl-kjv\" data-code=\"H2296\">gird</span> you with <span class=\"wl wl-kjv\" data-code=\"H8242\">sackcloth,</span> and <span class=\"wl wl-kjv\" data-code=\"H5594\">mourn</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> <span class=\"wl wl-kjv\" data-code=\"H74\">Abner.</span> And <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> himself <span class=\"wl wl-kjv\" data-code=\"H1980\">followed</span> the <span class=\"wl wl-kjv\" data-code=\"H4296\">bier.</span>", "32": "And they <span class=\"wl wl-kjv\" data-code=\"H6912\">buried</span> <span class=\"wl wl-kjv\" data-code=\"H74\">Abner</span> in <span class=\"wl wl-kjv\" data-code=\"H2275\">Hebron:</span> and the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> lifted <span class=\"wl wl-kjv\" data-code=\"H5375\">up</span> his <span class=\"wl wl-kjv\" data-code=\"H6963\">voice,</span> and <span class=\"wl wl-kjv\" data-code=\"H1058\">wept</span> at the <span class=\"wl wl-kjv\" data-code=\"H6913\">grave</span> of <span class=\"wl wl-kjv\" data-code=\"H74\">Abner;</span> and all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H1058\">wept.</span>", "33": "And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H6969\">lamented</span> over <span class=\"wl wl-kjv\" data-code=\"H74\">Abner,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H4191\">Died</span> <span class=\"wl wl-kjv\" data-code=\"H74\">Abner</span> as a <span class=\"wl wl-kjv\" data-code=\"H5036\">fool</span> <span class=\"wl wl-kjv\" data-code=\"H4194\">dieth?</span>", "34": "Thy <span class=\"wl wl-kjv\" data-code=\"H3027\">hands</span> were not <span class=\"wl wl-kjv\" data-code=\"H631\">bound,</span> nor thy <span class=\"wl wl-kjv\" data-code=\"H7272\">feet</span> <span class=\"wl wl-kjv\" data-code=\"H5066\">put</span> into <span class=\"wl wl-kjv\" data-code=\"H5178\">fetters:</span> as a man <span class=\"wl wl-kjv\" data-code=\"H5307\">falleth</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> <span class=\"wl wl-kjv\" data-code=\"H5766\">wicked</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">men,</span> so <span class=\"wl wl-kjv\" data-code=\"H5307\">fellest</span> thou. And all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl w const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"
const ZELF = D.meta.zelf_abbr;      // afkorting binnen dit hoofdstuk, bv. "Joh 3"

const PARALLEL_VOLGORDE = ['SVnu', 'SV', 'KJV'];
let vertaling = 'SVnu';

const bijbel = document.getElementById('bijbel');

const nummers = Object.keys(D.vertalingen.SVnu);

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen bij dit vers.</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}
</script>
</body>
