/hebreeen/1/"}, {"naam": "Jakobus", "href": "../../jakobus/1/"}, {"naam": "1 Petrus", "href": "../../1-petrus/1/"}, {"naam": "2 Petrus", "href": "../../2-petrus/1/"}, {"naam": "1 Johannes", "href": "../../1-johannes/1/"}, {"naam": "2 Johannes", "href": "../../2-johannes/1/"}, {"naam": "3 Johannes", "href": "../../3-johannes/1/"}, {"naam": "Judas", "href": "../../judas/1/"}, {"naam": "Openbaring", "href": "../../openbaring/1/"}], "slugmap": {"Gen": "genesis", "Ex": "exodus", "Lev": "leviticus", "Num": "numeri", "Deut": "deuteronomium", "Joz": "jozua", "Richt": "richteren", "Ruth": "ruth", "1 Sam": "1-samuel", "2 Sam": "2-samuel", "1 Kon": "1-koningen", "2 Kon": "2-koningen", "1 Kron": "1-kronieken", "2 Kron": "2-kronieken", "Ezra": "ezra", "Neh": "nehemia", "Est": "esther", "Job": "job", "Ps": "psalmen", "Spr": "spreuken", "Pred": "prediker", "Hoogl": "hooglied", "Jes": "jesaja", "Jer": "jeremia", "Klaagl": "klaagliederen", "Ezech": "ezechiel", "Dan": "daniel", "Hos": "hosea", "Joël": "joel", "Amos": "amos", "Obadja": "obadja", "Jona": "jona", "Micha": "micha", "Nahum": "nahum", "Hab": "habakuk", "Zef": "zefanja", "Hagg": "haggai", "Zach": "zacharia", "Mal": "maleachi", "Matt": "mattheus", "Mark": "markus", "Luk": "lukas", "Joh": "johannes", "Hand": "handelingen", "Rom": "romeinen", "1 Kor": "1-korinthe", "2 Kor": "2-korinthe", "Gal": "galaten", "Ef": "efeze", "Fil": "filippenzen", "Kol": "kolossenzen", "1 Tess": "1-thessalonicenzen", "2 Tess": "2-thessalonicenzen", "1 Tim": "1-timotheus", "2 Tim": "2-timotheus", "Tit": "titus", "Filem": "filemon", "Hebr": "hebreeen", "Jak": "jakobus", "1 Petr": "1-petrus", "2 Petr": "2-petrus", "1 Joh": "1-johannes", "2 Joh": "2-johannes", "3 Joh": "3-johannes", "Judas": "judas", "Openb": "openbaring"}}, "vertalingen": {"SVnu": {"1": "Er was een lange oorlog tussen het huis van Saul en het huis van David. Maar David werd steeds sterker, terwijl het huis van Saul steeds zwakker werd.", "2": "En David werden zonen geboren in Hebron. Zijn eerstgeborene was Amnon, van Ahinoam, de Jizreëlietische;", "3": "en zijn tweede was Chileab, van Abigaïl, de vrouw van Nabal, de Karmeliet; en de derde, Absalom, de zoon van Maächa, de dochter van Thalmai, koning van Gesur;", "4": "en de vierde, Adonia, de zoon van Haggith; en de vijfde Sefatja, de zoon van Abital;", "5": "en de zesde, Jithream, van Egla, Davids vrouw. Deze zonen werden David geboren in Hebron.", "6": "Terwijl die oorlog was tussen het huis van Saul en het huis van David, gebeurde het dat Abner zich sterk maakte voor het huis van Saul.", "7": "Saul had een bijvrouw gehad, met de naam Rizpa, dochter van Aja; en *Isboseth* zei tegen Abner: Waarom bent u naar mijn vaders bijvrouw gegaan?", "8": "Toen ontstak Abner in grote woede over de woorden van Isboseth, en zei: Ben ik dan een hondenkop, ik, die tegen Juda, aan het huis van Saul, uw vader, aan zijn broers en aan zijn vrienden, tot op vandaag trouw bewijs, en u niet in Davids hand overgeleverd heb, dat u mij vandaag beschuldigt vanwege de schuld met deze vrouw?", "9": "God moet Abner zo doen, en meer nog daarbij, als ik niet, zoals de HEERE aan David gezworen heeft, precies zo aan hem zal doen:", "10": "het koninkrijk overbrengen van het huis van Saul, en de troon van David oprichten over Israël en over Juda, van Dan tot Ber-seba toe.", "11": "En hij kon Abner geen woord meer terugzeggen, omdat hij hem vreesde.", "12": "Toen zond Abner boden namens zich naar David, en zei: Van wie is het land? En hij zei verder: Sluit uw verbond met mij, en zie, mijn hand zal met u zijn, om heel Israël tot u te doen overgaan.", "13": "En hij zei: Goed, ik zal een verbond met u sluiten; maar één ding vraag ik van u: u zult mijn gezicht niet zien, als u niet eerst Michal, Sauls dochter, meebrengt, wanneer u komt om mijn gezicht te zien.", "14": "Ook zond David boden naar Isboseth, de zoon van Saul, en zei: Geef mij mijn vrouw Michal, die ik mij met honderd voorhuiden van de Filistijnen ondertrouwd heb.", "15": "Isboseth dan stuurde iemand, en nam haar van de man, van Paltiël, de zoon van Lais.", "16": "En haar man ging met haar mee, huilend achter haar aan lopend, tot Bahurim toe. Toen zei Abner tegen hem: Ga weg, keer terug. En hij keerde terug.", "17": "Abner nu had overleg met de oudsten van Israël, en zei: U hebt David al lang geleden als koning over u gewenst.", "18": "Doe het nu dan; want de HEERE heeft over David gesproken, en gezegd: Door de hand van David, Mijn dienaar, zal Ik Mijn volk Israël verlossen van de hand van de Filistijnen, en van de hand van al hun vijanden.", "19": "En Abner sprak ook ten aanhoren van Benjamin. Vervolgens ging Abner ook naar Hebron om ten aanhoren van David alles te vertellen wat goed was in de ogen van Israël, en in de ogen van heel het huis van Benjamin.", "20": "En Abner kwam bij David te Hebron, met twintig mannen. En David richtte voor Abner en de mannen die bij hem waren een maaltijd aan.", "21": "Toen zei Abner tegen David: Ik zal opstaan en heengaan, en heel Israël verzamelen bij mijn heer de koning, zodat zij een verbond met u sluiten, en u regeert over alles wat uw hart begeert. Zo liet David Abner gaan, en hij ging in vrede.", "22": "En zie, Davids dienaren en Joab kwamen terug van een strooptocht, en brachten een grote buit met zich mee. Abner was toen niet bij David te Hebron, want hij had hem laten gaan, en hij was in vrede vertrokken.", "23": "Toen Joab en het hele leger dat bij hem was aankwam, vertelden ze Joab: Abner, de zoon van Ner, is bij de koning geweest, en die heeft hem laten gaan, en hij is in vrede vertrokken.", "24": "Toen ging Joab naar de koning, en zei: Wat hebt u gedaan? Zie, Abner is bij u geweest; waarom hebt u hem laten gaan, zodat hij zomaar is weggegaan?", "25": "U kent Abner, de zoon van Ner: hij is gekomen om u te bedriegen, en om uw uitgaan en ingaan te weten te komen, ja, om alles te weten te komen wat u doet.", "26": "Toen Joab bij David wegging, stuurde hij boden achter Abner aan, die hem terughaalden van de put van Sira; maar David wist dat niet.", "27": "Toen Abner naar Hebron terugkwam, nam Joab hem apart in het midden van de poort om in stilte met hem te spreken; en hij sloeg hem daar onder de vijfde rib, zodat hij stierf, vanwege het bloed van zijn broer Asaël.", "28": "Toen David dat later hoorde, zei hij: Ik ben onschuldig, en mijn koninkrijk is dat, bij de HEERE, tot in eeuwigheid, aan het bloed van Abner, de zoon van Ner.", "29": "Het moet blijven op het hoofd van Joab, en op heel het huis van zijn vader; en het mag van het huis van Joab niet ontbreken dat er iemand is die een vloed heeft, of melaats is, of zich aan de kruk moet vasthouden, of door het zwaard valt, of gebrek aan brood heeft!", "30": "Zo hebben Joab en zijn broer Abisaï Abner doodgeslagen, omdat hij hun broer Asaël te Gibeon in de strijd had gedood.", "31": "David dan zei tegen Joab en tegen al het volk dat bij hem was: Scheur uw kleren, en doe rouwgewaden aan, en klaag over Abner. En koning David liep zelf achter de baar.", "32": "Toen zij Abner te Hebron begroeven, verhief de koning zijn stem, en huilde bij Abners graf; ook al het volk huilde.", "33": "En de koning hief een klaaglied aan over Abner, en zei: Moest Abner sterven zoals een dwaas sterft?", "34": "Uw handen waren niet gebonden, en uw voeten waren niet in koperen boeien gezet, *maar* u bent gevallen, zoals men valt voor het aangezicht van kinderen van onrecht. Toen huilde heel het volk nog meer over hem.", "35": "Daarna kwam al het volk om David brood te laten eten, terwijl het nog dag was; maar David zwoer: God moet mij zo doen, en er nog meer aan toevoegen, als ik vóór het ondergaan van de zon brood of iets anders smaak!", "36": "Toen al het volk dit merkte, was het goed in hun ogen; alles wat de koning gedaan had, was goed in de ogen van heel het volk.", "37": "En al het volk en heel Israël merkten op die dag dat het niet van de koning was gekomen dat Abner, de zoon van Ner, gedood was.", "38": "Verder zei de koning tegen zijn dienaren: Weet u niet dat er vandaag een vorst, ja, een groot man in Israël gevallen is?", "39": "Maar ik ben vandaag teder, hoewel tot koning gezalfd, en deze mannen, de zonen van Zeruja, zijn te hard voor mij; de HEERE zal de boosdoener vergelden naar zijn boosheid."}, "SV": {"1": "En er was een lange krijg tussen het huis van Saul, en tussen het huis van David. Doch David ging en werd sterker; maar die van het huis van Saul gingen en werden zwakker.", "2": "En David werden zonen geboren te Hebron. Zijn eerstgeborene nu was Amnon, van Ahinoam, de Jizreëlietische;", "3": "En zijn tweede was Chileab, van Abigaïl, de huisvrouw van Nabal, den Karmeliet; en de derde, Absalom, de zoon van Maacha, de dochter van Thalmai, koning van Gesur;", "4": "En de vierde, Adonia, de zoon van Haggith; en de vijfde Sefatja, de zoon van Abital;", "5": "En de zesde, Jithream, van Egla, Davids huisvrouw. Dezen zijn David geboren te Hebron.", "6": "Terwijl die krijg was tussen het huis van Saul, en tussen het huis van David, zo geschiedde het, dat Abner zich sterkte in het huis van Saul.", "7": "Saul nu had een bijwijf gehad, welker naam was Rizpa, dochter van Aja; en *Isboseth* zeide tot Abner: Waarom zijt gij ingegaan tot mijns vaders bijwijf?", "8": "Toen ontstak Abner zeer over Isboseths woorden, en zeide: Ben ik dan een hondskop, ik, die tegen Juda, aan het huis van Saul, uw vader, aan zijn broederen en aan zijn vrienden, heden weldadigheid doe, en u niet overgeleverd heb in Davids hand, dat gij heden aan mij onderzoekt de ongerechtigheid ener vrouw?", "9": "God doe Abner zo, en doe hem zo daartoe! Voorzeker, gelijk als de HEERE aan David gezworen heeft, dat ik even alzo aan hem zal doen.", "10": "Overbrengende het koninkrijk van het huis van Saul, en oprichtende den stoel van David over Israël en over Juda, van Dan tot Ber-seba toe.", "11": "En hij kon Abner verder niet een woord antwoorden, omdat hij hem vreesde.", "12": "Toen zond Abner boden voor zich tot David, zeggende: Wiens is het land? zeggende *wijders*: Maak uw verbond met mij, en zie, mijn hand zal met u zijn, om gans Israël tot u om te keren.", "13": "En hij zeide: Wel, ik zal een verbond met u maken; doch een ding begeer ik van u, zeggende: Gij zult mijn aangezicht niet zien, tenzij dat gij Michal, Sauls dochter, te voren inbrengt, als gij komt om mijn aangezicht te zien.", "14": "Ook zond David boden tot Isboseth, den zoon van Saul, zeggende: Geef *mij* mijn huisvrouw Michal, die ik mij met honderd voorhuiden der Filistijnen ondertrouwd heb.", "15": "Isboseth dan zond heen, en nam haar van den man, van Paltiel, den zoon van Lais.", "16": "En haar man ging met haar, al gaande en wenende achter haar, tot Bahurim toe. Toen zeide Abner tot hem: Ga weg, keer weder. En hij keerde weder.", "17": "Abner nu had woorden met de oudsten van Israël, zeggende: Gij hebt David te voren lang tot een koning over u begeerd.", "18": "Zo doet het nu; want de HEERE heeft tot David gesproken, zeggende: Door de hand van David, Mijn knecht, zal Ik Mijn volk Israël verlossen van de hand der Filistijnen, en van de hand van al hun vijanden.", "19": "En Abner sprak ook voor de oren van Benjamin. Voorts ging Abner ook heen, om te Hebron voor Davids oren te spreken alles, wat goed was in de ogen van Israël, en in de ogen van het ganse huis van Benjamin.", "20": "En Abner kwam tot David te Hebron, en twintig mannen met hem. En David maakte Abner, en den mannen, die met hem waren, een maaltijd.", "21": "Toen zeide Abner tot David: Ik zal mij opmaken, en heengaan, en vergaderen gans Israël tot mijn heer, den koning, dat zij een verbond met u maken, en gij regeert over alles, wat uw ziel begeert. Alzo liet David Abner gaan, en hij ging in vrede.", "22": "En ziet, Davids knechten en Joab kwamen van een bende, en brachten met zich een groten roof. Abner nu was niet bij David te Hebron; want hij had hem laten gaan, en hij was gegaan in vrede.", "23": "Als nu Joab en het ganse heir, dat met hem was, aankwamen, zo gaven zij Joab te kennen, zeggende: Abner, de zoon van Ner, is gekomen tot den koning, en hij heeft hem laten gaan, en hij is gegaan in vrede.", "24": "Toen ging Joab tot den koning in, en zeide: Wat hebt gij gedaan? Zie, Abner is tot u gekomen; waarom nu hebt gij hem laten gaan, dat hij zo vrij is weggegaan?", "25": "Gij kent Abner, den zoon van Ner; dat hij gekomen is om u te overreden, en om te weten uw uitgang en uw ingang, ja, om te weten alles, wat gij doet.", "26": "En Joab ging uit van David, en zond Abner boden na, die hem wederom haalden van den bornput van Sira; maar David wist het niet.", "27": "Als nu Abner weder te Hebron kwam, zo leidde Joab hem ter zijde af in het midden der poort, om in de stilte met hem te spreken; en hij sloeg hem aldaar aan de vijfde rib, dat hij stierf, om des bloeds wil van zijn broeder Asahel.", "28": "Als David dat daarna hoorde, zo zeide hij: Ik ben onschuldig, en mijn koninkrijk, bij den HEERE, tot in eeuwigheid, van het bloed van Abner, den zoon van Ner.", "29": "Het blijve op het hoofd van Joab, en op het ganse huis zijns vaders; en er worde van het huis van Joab niet afgesneden, die een vloed hebbe, en melaats zij, en zich aan den stok houde, en door het zwaard valle, en broodsgebrek hebbe!", "30": "Alzo hebben Joab en zijn broeder Abisai Abner doodgeslagen, omdat hij hun broeder Asahel te Gibeon in den strijd gedood had.", "31": "David dan zeide tot Joab en tot al het volk, dat bij hem was: Scheurt uw klederen, en gordt zakken aan, en weeklaagt voor Abner henen; en de koning David ging achter de baar.", "32": "Als zij nu Abner te Hebron begroeven, zo hief de koning zijn stem op, en weende bij Abners graf; ook weende al het volk.", "33": "En de koning maakte een klage over Abner, en zeide: Is dan Abner gestorven, als een dwaas sterft?", "34": "Uw handen waren niet gebonden, noch uw voeten in koperen boeien gedaan, *maar* gij zijt gevallen, gelijk men valt voor het aangezicht van kinderen der verkeerdheid. Toen weende het ganse volk nog meer over hem.", "35": "Daarna kwam al het volk, om David brood te doen eten, als het nog dag was; maar David zwoer, zeggende: God doe mij zo, en doe er zo toe, indien ik voor het ondergaan der zon brood of iets smake!", "36": "Als al het volk dit vernam, zo was het goed in hun ogen, alles, zoals de koning gedaan had, was goed in de ogen van het ganse volk.", "37": "En al het volk en gans Israël merkten te dienzelven dage, dat het van den koning niet was, dat men Abner, den zoon van Ner, gedood had.", "38": "Voorts zeide de koning tot zijn knechten: Weet gij niet, dat te dezen dage een vorst, ja, een grote in Israël gevallen is?", "39": "Maar ik ben heden teder, en gezalfd ten koning, en deze mannen, de zonen van Zeruja, zijn harder dan ik; de HEERE zal den boosdoener vergelden naar zijn boosheid."}, "KJV": {"1": "Now there was long war between the house of Saul and the house of David: but David waxed stronger and stronger, and the house of Saul waxed weaker and weaker.", "2": "And unto David were sons born in Hebron: and his firstborn was Amnon, of Ahinoam the Jezreelitess;", "3": "And his second, Chileab, of Abigail the wife of Nabal the Carmelite; and the third, Absalom the son of Maacah the daughter of Talmai king of Geshur;", "4": "And the fourth, Adonijah the son of Haggith; and the fifth, Shephatiah the son of Abital;", "5": "And the sixth, Ithream, by Eglah David's wife. These were born to David in Hebron.", "6": "And it came to pass, while there was war between the house of Saul and the house of David, that Abner made himself strong for the house of Saul.", "7": "And Saul had a concubine, whose name was Rizpah, the daughter of Aiah: and Ishbosheth said to Abner, Wherefore hast thou gone in unto my father's concubine?", "8": "Then was Abner very wroth for the words of Ishbosheth, and said, Am I a dog's head, which against Judah do shew kindness this day unto the house of Saul thy father, to his brethren, and to his friends, and have not delivered thee into the hand of David, that thou chargest me to day with a fault concerning this woman?", "9": "So do God to Abner, and more also, except, as the LORD hath sworn to David, even so I do to him;", "10": "To translate the kingdom from the house of Saul, and to set up the throne of David over Israel and over Judah, from Dan even to Beersheba.", "11": "And he could not answer Abner a word again, because he feared him.", "12": "And Abner sent messengers to David on his behalf, saying, Whose is the land? saying also, Make thy league with me, and, behold, my hand shall be with thee, to bring about all Israel unto thee.", "13": "And he said, Well; I will make a league with thee: but one thing I require of thee, that is, Thou shalt not see my face, except thou first bring Michal Saul's daughter, when thou comest to see my face.", "14": "And David sent messengers to Ishbosheth Saul's son, saying, Deliver me my wife Michal, which I espoused to me for an hundred foreskins of the Philistines.", "15": "And Ishbosheth sent, and took her from her husband, even from Phaltiel the son of Laish.", "16": "And her husband went with her along weeping behind her to Bahurim. Then said Abner unto him, Go, return. And he returned.", "17": "And Abner had communication with the elders of Israel, saying, Ye sought for David in times past to be king over you:", "18": "Now then do it: for the LORD hath spoken of David, saying, By the hand of my servant David I will save my people Israel out of the hand of the Philistines, and out of the hand of all their enemies.", "19": "And Abner also spake in the ears of Benjamin: and Abner went also to speak in the ears of David in Hebron all that seemed good to Israel, and that seemed good to the whole house of Benjamin.", "20": "So Abner came to David to Hebron, and twenty men with him. And David made Abner and the men that were with him a feast.", "21": "And Abner said unto David, I will arise and go, and will gather all Israel unto my lord the king, that they may make a league with thee, and that thou mayest reign over all that thine heart desireth. And David sent ➔ Abner away; and he went in peace.", "22": "And, behold, the servants of David and Joab came from pursuing a troop, and brought in a great spoil with them: but Abner was not with David in Hebron; for he had sent him away, and he was gone in peace.", "23": "When Joab and all the host that was with him were come, they told Joab, saying, Abner the son of Ner came to the king, and he hath sent him away, and he is gone in peace.", "24": "Then Joab came to the king, and said, What hast thou done? behold, Abner came unto thee; why is it that thou hast sent him away, and he is quite gone?", "25": "Thou knowest Abner the son of Ner, that he came to deceive thee, and to know thy going out and thy coming in, and to know all that thou doest.", "26": "And when Joab was come out from David, he sent messengers after Abner, which brought him again from the well of Sirah: but David knew it not.", "27": "And when Abner was returned to Hebron, Joab took him aside in the gate to speak with him quietly, and smote him there under the fifth rib, that he died, for the blood of Asahel his brother.", "28": "And afterward when David heard it, he said, I and my kingdom are guiltless before the LORD for ever from the blood of Abner the son of Ner:", "29": "Let it rest on the head of Joab, and on all his father's house; and let there not fail from the house of Joab one that hath an issue, or that is a leper, or that leaneth on a staff, or that falleth on the sword, or that lacketh bread.", "30": "So Joab and Abishai his brother slew Abner, because he had slain their brother Asahel at Gibeon in the battle.", "31": "And David said to Joab, and to all the people that were with him, Rend your clothes, and gird you with sackcloth, and mourn before Abner. And king David himself followed the bier.", "32": "And they buried Abner in Hebron: and the king lifted up his voice, and wept at the grave of Abner; and all the people wept.", "33": "And the king lamented over Abner, and said, Died Abner as a fool dieth?", "34": "Thy hands were not bound, nor thy feet put into fetters: as a man falleth before wicked men, so fellest thou. And all the people wept again over him.", "35": "And when all the people came to cause ➔ David to eat meat while it was yet day, David sware, saying, So do God to me, and more also, if I taste bread, or ought else, till the sun be down.", "36": "And all the people took notice of it, and it pleased them: as whatsoever the king did pleased all the people.", "37": "For all the people and all Israel understood that day that it was not of the king to slay Abner the son of Ner.", "38": "And the king said unto his servants, Know ye not that there is a prince and a great man fallen this day in Israel?", "39": "And I am this day weak, though anointed king; and these men the sons of Zeruiah be too hard for me: the LORD shall reward the doer of evil according to his wickedness."}}, "tsk": {"1": [{"kopje": "lange oorlog", "refs": ["1 Kon 14:30", "1 Kon 15:16", "1 Kon 15:32"]}, {"kopje": "tussen", "refs": ["Gen 3:15", "Ps 45:4-6", "Matt 10:35", "Matt 10:36", "Gal 5:17", "Ef 6:12"]}, {"kopje": "David werd steeds sterker", "refs": ["2 Sam 2:17", "Est 6:13", "Job 8:7", "Job 17:9", "Ps 84:8", "Spr 4:18", "Spr 4:19", "Dan 2:34", "Dan 2:35", "Dan 2:44", "Dan 2:45", "Openb 6:2"]}], "2": [{"kopje": "zonen geboren", "refs": ["1 Kron 3:1-4"]}, {"kopje": "Amnon", "refs": ["2 Sam 13:1-29", "Gen 49:3", "Gen 49:4"]}, {"kopje": "Ahinoam", "refs": ["1 Sam 25:43"]}], "3": [{"kopje": "Chileab", "refs": ["1 Kron 3:1"]}, {"kopje": "Abigaïl", "refs": ["2 Sam 2:2", "1 Sam 25:3", "1 Sam 25:42"]}, {"kopje": "Absalom", "refs": ["2 Sam 13:20-28", "2 Sam 14:24-33", "2 Sam 15:1-18", "2 Sam 17:1-14", "2 Sam 18:9-18", "2 Sam 18:33"]}, {"kopje": "Thalmai", "refs": ["2 Sam 13:37", "2 Sam 13:38"]}, {"kopje": "Gesur", "refs": ["Deut 3:14", "Joz 13:13", "1 Sam 0:15", "href": "../../openbaring/20/#v15", "ref": "Openb 20:15", "svLabel": null}, {"disp": "Openb 21:8", "href": "../../openbaring/21/#v8", "ref": "Openb 21:8", "svLabel": null}, {"disp": "Openb 21:27", "href": "../../openbaring/21/#v27", "ref": "Openb 21:27", "svLabel": null}, {"disp": "Openb 22:19", "href": "../../openbaring/22/#v19", "ref": "Openb 22:19", "svLabel": null}], "kinderen": []}]}, {"topic": "Zeruiah", "href": "../../nave/z/#t-zeruiah", "kinderen": [{"label": "Mother of three of David' s great soldiers", "href": "../../nave/z/?hl=2Sam.3.39#i22629", "refs": [{"disp": "1 Kron 2:16", "href": "../../1-kronieken/2/#v16", "ref": "1 Kron 2:16", "svLabel": null}, {"disp": "2 Sam 2:18", "href": "../../2-samuel/2/#v18", "ref": "2 Sam 2:18", "svLabel": null}, {"disp": "2 Sam 3:39", "href": "../../2-samuel/3/#v39", "ref": "2 Sam 3:39", "svLabel": null}, {"disp": "2 Sam 16:9-11", "href": "../../2-samuel/16/#v9", "ref": "2 Sam 16:9-11", "svLabel": null}, {"disp": "2 Sam 17:25", "href": "../../2-samuel/17/#v25", "ref": "2 Sam 17:25", "svLabel": null}], "kinderen": []}]}]}}, "extern": {"Ps 132:18": "Ik zal zijn vijanden met schaamte bekleden; maar op hem zal zijn kroon bloeien.", "Jak 5:20": "Laat die weten, dat wie een zondaar van de dwaling van zijn weg bekeert, een ziel van de dood zal behouden, en een menigte van zonden zal bedekken.", "Richt 12:1-6": "Toen werden de mannen van Efraïm bijeengeroepen, en zij trokken naar het noorden; en zij zeiden tegen Jeftha: Waarom bent u doorgetrokken om te strijden tegen de kinderen van Ammon, en hebt u ons niet geroepen om met u mee te gaan? Wij zullen uw huis boven u met vuur verbranden. En Jeftha zei tegen hen: Ik en mijn volk waren in hevige strijd met de kinderen van Ammon; en ik heb u geroepen, maar u hebt mij niet uit hun hand verlost. Toen ik nu zag dat u mij niet verloste, zette ik mijn leven op het spel en trok tegen de kinderen van Ammon, en de HEERE gaf hen in mijn hand; waarom bent u dan vandaag naar mij toegekomen om tegen mij te strijden?", "2 Sam 2:18": "Nu waren daar drie zonen van Zeruja, Joab, en Abisai en Asahel; en Asahel was licht op zijn voeten, als een van de reeën die in het veld zijn.", "Spr 24:22": "Want hun verderf zal snel ontstaan; en wie weet hun beider ondergang?", "Luk 12:20": "Maar God zei tegen hem: Jij dwaas! Nog deze nacht zal men uw ziel van u opeisen; en wat u hebt klaargemaakt, van wie zal het dan zijn?", "Job 24:14": "Met het licht staat de moordenaar op, doodt de arme en de behoeftige; en 's nachts is hij als een dief.", "2 Sam 24:2": "De koning zei toen tegen Joab, de legeraanvoerder die bij hem was: Trek nu rond door alle stammen van Israël, van Dan tot Ber-seba toe, en tel het volk, zodat ik het getal van het volk weet.", "Ps 104:35": "De zondaars zullen van de aarde weggevaagd worden, en de goddelozen zullen niet meer zijn. Loof de HEERE, mijn ziel! Hallelujah!", "Rom 8:13": "Want als u naar het vlees leeft, zult u sterven; maar als u door de Geest de daden van het lichaam doodt, zult u leven.", "1 Kon 2:8": "En zie, bij u is Simeï, de zoon van Gera, de zoon van Jemini, uit Bahurim, die mij vervloekte met een zware vloek, op de dag dat ik naar Mahanaïm ging; maar hij kwam mij tegemoet bij de Jordaan, en ik zwoer hem bij de HEERE en zei: Ik zal u niet met het zwaard doden!", "2 Sam 18:9-18": "Absalom nu kwam de knechten van David tegen; en Absalom reed op een muildier; en toen het muildier onder de dichte takken van een grote eik kwam, raakte zijn hoofd vast in de eik, zodat hij bleef hangen tussen hemel en aarde, en het muildier dat onder hem was, liep door. Toen een man dat zag, vertelde hij het aan Joab, en zei: Zie, ik heb Absalom zien hangen aan een eik. Toen zei Joab tegen de man die het hem vertelde: Zie toch, u hebt het gezien, waarom hebt u hem daar dan niet ter aarde geslagen? Dan had ik u tien zilverstukken en een gordel gegeven.", "Jes 9:17": "Want de goddeloosheid brandt als vuur, doornen en distels zal zij verteren, en zal aansteken de verwarde struiken van het woud, die zich verheven hebben als de verheffing van de rook.", "Est 1:3": "in het derde jaar van zijn regering, dat hij een maaltijd gaf voor al zijn vorsten en zijn knechten; de machthebbers van Perzië en Medië, de grootste heren en de leiders van de landschappen waren voor hem aanwezig.", "Spr 20:8": "Een koning, die op de troon van het gericht zit, verstrooit alle kwaad met zijn ogen.", "Luk 8:18": "Let er dan op hoe u hoort; want wie heeft, aan hem zal gegeven worden; en wie niet heeft, ook wat hij meent te hebben zal van hem afgenomen worden.", "Jes 37:28": "Maar Ik weet uw zitten, en uw uitgaan, en uw binnenkomen, en uw woede tegen Mij.", "2 Sam 19:14": "Zo boog hij het hart van alle mannen van Juda, als van één man; en zij stuurden een boodschap naar de koning: Keer terug, u en al uw knechten.", "Jer 41:5": "Zo kwamen er mannen van Sichem, van Silo, en van Samaria, tachtig man, met de baard afgeschoren, en de kleren gescheurd, en zichzelf gesneden; en spijsoffer en wierook waren in hun hand, om naar het huis van de HEERE te brengen.", "Rom 1:18": "Want de toorn van God wordt geopenbaard van de hemel over alle goddeloosheid en ongerechtigheid van de mensen, die de waarheid in ongerechtigheid ten onder houden.", "Luk 12:4": "En Ik zeg u, Mijn vrienden: wees niet bang voor hen die het lichaam doden, en daarna niets meer kunnen doen.", "Luk 17:2": "Het zou beter voor hem zijn dat een molensteen om zijn hals gedaan werd en hij in de zee geworpen werd, dan dat hij één van deze kleinen zou laten struikelen.", "Matt 12:34": "Adderengebroed! Hoe kunt u goede dingen spreken, terwijl u slecht bent? Want uit de overvloed van het hart spreekt de mond.", "Hos 2:8-12": "Daarom zal Ik terugkomen, en Mijn koren wegnemen op zijn tijd, en Mijn nieuwe wijn op zijn vastgestelde tijd; en Ik zal Mijn wol en Mijn vlas wegrukken, dat diende om haar naaktheid te bedekken. En nu zal Ik haar schaamteloosheid ontdekken voor de ogen van haar minnaars; en niemand zal haar uit Mijn hand redden. En Ik zal al haar vrolijkheid doen ophouden, haar feesten, haar nieuwe maanden, en haar sabbatten, ja, al haar vastgestelde hoogtijden.", "1 Sam 30:5": "Davids beide vrouwen waren ook gevangen weggevoerd, Ahinoam, de Jizreëlitische, en Abigaïl, de vrouw van Nabal, de Karmeliet.", "1 Kor 15:22": "Want zoals zij allen in Adam sterven, zo zullen zij ook in Christus allen levend gemaakt worden.", "Num 23:11": "Toen zei Balak tegen Bileam: Wat hebt u mij aangedaan? Ik heb u gehaald om mijn vijanden te vervloeken; maar zie, u hebt hen alleen maar gezegend!", "2 Sam 23:24": "Asahel, Joabs broer, was onder de dertig; Elhanan, de zoon van Dodo, van Bethlehem;", "Jes 26:21": "Want zie, de HEERE zal uit Zijn plaats uitgaan, om de ongerechtigheid van de inwoners van de aarde over hen te bezoeken; en de aarde zal haar bloed onthullen, en zal haar gedoden niet langer bedekt houden.", "Ezech 24:13": "In uw onreinheid is schandelijkheid, omdat Ik u gereinigd heb, en u niet gereinigd bent, zult u van uw onreinheid niet meer gereinigd worden, totdat Ik Mijn grimmigheid op u tot rust heb gebracht.", "Matt 26:24": "De Zoon des mensen gaat wel heen, zoals over Hem geschreven is; maar wee die mens door wie de Zoon des mensen verraden wordt; het zou beter voor hem geweest zijn als die mens niet geboren was.", "Spr 1:17": "Zeker, het net wordt tevergeefs gespreid voor de ogen van allerlei gevogelte;", "1 Kon 2:6": "Doe dan naar uw wijsheid, en laat zijn grijze hoofd niet in vrede naar het graf afdalen.", "Joh 8:21": "Jezus zei dan weer tegen hen: Ik ga heen, en u zult Mij zoeken, en in uw zonden zult u sterven; waar Ik heenga, kunt u niet komen.", "2 Sam 3:17-21": "Abner nu had overleg met de oudsten van Israël, en zei: U hebt David al lang geleden als koning over u gewenst. Doe het nu dan; want de HEERE heeft over David gesproken, en gezegd: Door de hand van David, Mijn dienaar, zal Ik Mijn volk Israël verlossen van de hand van de Filistijnen, en van de hand van al hun vijanden. En Abner sprak ook ten aanhoren van Benjamin. Vervolgens ging Abner ook naar Hebron om ten aanhoren van David alles te vertellen wat goed was in de ogen van Israël, en in de ogen van heel het huis van Benjamin.", "Ezra 9:3": "Toen ik deze zaak hoorde, scheurde ik mijn kleed en mijn mantel; en ik trok het haar van mijn hoofd en van mijn baard uit, en zat verbaasd neer.", "Ps 58:7-10": "O God, verbreek hun tanden in hun mond; breek de baktanden van de jonge leeuwen af, o HEERE! Laat hen wegsmelten als water, laat hen wegstromen; als hij zijn pijlen aanlegt, laat hen zijn alsof zij afgesneden waren. Laat hem heengaan als een wegsmeltende slak; laat hen, als de misdracht van een vrouw, de zon niet zien.", "Job 17:9": "En de rechtvaardige zal zijn weg vasthouden, en wie rein van handen is, zal in sterkte toenemen.", "Ps 62:10": "Zeker, de gewone mensen zijn nietigheid, de aanzienlijke mensen zijn leugen; in de weegschaal gewogen, zouden zij samen lichter zijn dan de nietigheid.", "Ps 45:4-6": "Gord Uw zwaard aan de heup, o Held! Uw Majesteit en Uw heerlijkheid. En rijd voorspoedig in Uw heerlijkheid, op het woord van de waarheid en rechtvaardige zachtmoedigheid; en Uw rechterhand zal U ontzagwekkende dingen leren. Uw pijlen zijn scherp; volken zullen onder U vallen; zij treffen in het hart van de vijanden van de Koning.", "2 Sam 16:5": "Toen koning David tot bij Bahurim kwam, zie, daar kwam een man vandaan uit het geslacht van het huis van Saul, van wie de naam Simeï was, de zoon van Gera; hij liep almaar door en vloekte.", "Ps 34:22": "Thau. De boosheid zal de goddeloze doden; en die de rechtvaardige haten, zullen schuldig verklaard worden.", "Ps 106:18": "En een vuur brandde onder hun groep, een vlam stak de goddelozen in brand.", "Luk 23:30": "Dan zullen zij beginnen te zeggen tegen de bergen: Valt op ons; en tegen de heuvels: Bedekt ons.", "Spr 21:15": "Het is voor de rechtvaardige een blijdschap recht te doen; maar voor de werkers van de ongerechtigheid is het verschrikking.", "Rom 8:7": "Daarom dat het bedenken van het vlees vijandschap is tegen God; want het onderwerpt zich niet aan de wet van God, want het kan ook niet.", "Luk 12:5": "Maar Ik zal u tonen voor wie u bang moet zijn: wees bang voor Hem, Die, nadat Hij gedood heeft, ook macht heeft om in de hel te werpen; ja, Ik zeg u, wees bang voor Hem!", "Ps 32:10": "De goddeloze heeft veel smarten, maar wie op de HEERE vertrouwt, die zal de goedertierenheid omringen.", "Luk 14:34": "Het zout is goed; maar als het zout smakeloos geworden is, waarmee zal het smakelijk gemaakt worden?", "Jes 8:10": "Beraadslaag een plan, toch zal het vernietigd worden; spreek een woord, toch zal het niet standhouden; want God is met ons!", "Num 14:6": "En Jozua, de zoon van Nun, en Kaleb, de zoon van Jefunne, die bij hen waren die dat land verspied hadden, scheurden hun kleren.", "Ps 11:6": "Hij zal op de goddelozen strikken doen regenen, vuur en zwavel; en een geweldige stormwind zal het deel van hun beker zijn.", "Spr 24:20": "Want de kwade zal geen beloning hebben, de lamp van de goddelozen zal uitgeblust worden.", "Amos 5:18-20": "Wee hen die de dag van de HEERE verlangen! Waartoe toch zal de dag van de HEERE u zijn? Hij zal duisternis zijn en geen licht. Zoals wanneer iemand vlucht voor het aangezicht van een leeuw, en een beer hem ontmoet; of dat hij in een huis komt, en met zijn hand tegen de wand leunt, en een slang hem bijt. Zal dan niet de dag van de HEERE duisternis zijn, en geen licht? En donkerheid, zodat er geen glans aan is?", "Gen 42:12": "En hij zei tegen hen: Nee, maar u bent gekomen om te bekijken waar het land onbeschermd is.", "1 Sam 25:44": "Want Saul had zijn dochter Michal, de vrouw van David, gegeven aan Palti, de zoon van Lais, die van Gallim was.", "Rom 6:21": "Wat voor vrucht had u toen van die dingen waarover u zich nu schaamt? Want het einde daarvan is de dood.", "1 Sam 16:1-13": "Toen zei de HEERE tegen Samuël: Hoe lang draagt u leed om Saul, die Ik toch verworpen heb, dat hij geen koning meer zal zijn over Israël? Vul uw hoorn met olie, en ga op weg; Ik zal u zenden naar Isaï, de Bethlehemiet; want Ik heb Mij een koning uitgekozen onder zijn zonen. Maar Samuël zei: Hoe zou ik kunnen gaan? Saul zal het horen en mij doden. Toen zei de HEERE: Neem een kalf van de runderen met u mee, en zeg: Ik ben gekomen om de HEERE een offer te brengen. En u zult Isaï uitnodigen voor het offer, en Ik zal u laten weten wat u moet doen; en u zult Mij zalven degene die Ik u zeggen zal.", "Hand 14:14": "Maar toen de apostelen Barnabas en Paulus dit hoorden, scheurden zij hun kleren, en sprongen onder de menigte, en riepen:", "Ps 37:13-22": "De Heere belacht hem, want Hij ziet dat zijn dag komt. Cheth. De goddelozen hebben het zwaard getrokken, en hun boog gespannen, om de ellendige en de arme neer te vellen, om te slachten wie oprecht van weg zijn. Maar hun zwaard zal in hun eigen hart gaan; en hun bogen zullen verbroken worden.", "2 Sam 2:19-23": "En Asahel jaagde Abner achterna; en hij week niet af, om van achter Abner naar rechts of naar links af te gaan. Toen keek Abner achter zich om, en zei: Bent u dit, Asahel? En hij zei: Ik ben het. En Abner zei tegen hem: Wijk naar rechts of naar links, en grijp u een van die jongens, en neem voor u zijn wapenrusting; maar Asahel wilde niet afwijken van achter hem.", "Openb 9:18": "Door deze drie werd het derde deel van de mensen gedood, namelijk door het vuur, en door de rook, en door het zwavel, dat uit hun monden uitging.", "Jes 36:22": "Toen kwam Eljakim, de zoon van Hilkia, de hofmeester, en Sebna, de schrijver, en Joah, de zoon van Asaf, de kanselier, naar Hizkia met gescheurde kleren; en zij vertelden hem de woorden van Rabsake.", "2 Sam 19:13": "En tegen Amasa moet u zeggen: Bent u niet mijn gebeente en mijn vlees? God doe mij zo, en meer dan dat, als u niet legeraanvoerder wordt voor mijn aangezicht, alle dagen, in de plaats van Joab.", "Hand 28:4": "En toen de inwoners het beest aan zijn hand zagen hangen, zeiden zij tegen elkaar: Deze man is zeker een moordenaar, die, hoewel hij uit de zee ontkomen is, door de wraak niet in leven gelaten wordt.", "Matt 25:33": "En Hij zal de schapen aan Zijn rechterhand zetten, maar de bokken aan Zijn linkerhand.", "1 Kon 20:11": "Maar de koning van Israël antwoordde en zei: Spreekt tot hem: Die zich aangordt, beroemt zich niet, als die zich los maakt.", "Matt 23:33": "Slangen, addergebroed! Hoe zou u de helse verdoemenis ontvluchten?", "Mark 9:43": "En als uw hand u doet struikelen, hak hem af; het is beter voor u verminkt het leven in te gaan, dan met twee handen naar de hel te gaan, in het onblusbare vuur;", "Openb 18:5": "Want haar zonden zijn de een na de ander gevolgd tot aan de hemel toe, en God is haar ongerechtigheden gaan gedenken.", "1 Sam 18:25-27": "Toen zei Saul: Zo zult u tegen David zeggen: De koning heeft geen behoefte aan een bruidsschat, maar aan honderd voorhuiden van de Filistijnen, opdat men zich wreekt op de vijanden van de koning. Want Saul dacht David te doen vallen door de hand van de Filistijnen. Zijn knechten nu boodschapten David deze woorden. En die zaak was goed in de ogen van David, dat hij de schoonzoon van de koning zou worden; maar de dagen waren nog niet vervuld. Toen maakte David zich op, en hij en zijn mannen gingen heen, en zij sloegen onder de Filistijnen tweehonderd man, en David bracht hun voorhuiden, en men leverde ze de koning volkomen, opdat hij schoonzoon van de koning zou worden. Toen gaf Saul hem zijn dochter Michal tot vrouw.", "Ps 5:6": "De onzinnigen zullen voor Uw ogen niet bestaan; U haat alle werkers van de ongerechtigheid.", "Hebr 2:2": "Want als het woord, dat door de engelen gesproken is, vast is geweest, en elke overtreding en ongehoorzaamheid rechtvaardige vergelding ontvangen heeft,", "Job 36:12": "Maar als zij niet horen, dan gaan zij door het zwaard om, en geven zij de geest zonder kennis.", "Gen 44:13": "Toen scheurden zij hun kleren, en ieder man laadde zijn ezel weer op, en zij keerden terug naar de stad.", "Job 20:5-29": "Dat het gejuich van de goddelozen van dichtbij geweest is², en de vreugde van de huichelaar maar voor een ogenblik? Al zou zijn hoogheid tot de hemel toe opklimmen, en zijn hoofd tot aan de wolken raken; Zal hij, net als zijn eigen drek, voor eeuwig vergaan; wie hem gezien hadden, zullen zeggen: Waar is hij?", "Ps 129:4": "De HEERE, Die rechtvaardig is, heeft de touwen van de goddelozen afgehakt.", "Richt 20:1": "Toen trokken alle kinderen van Israël uit, en de gemeenschap verzamelde zich, als één man, van Dan af tot Ber-seba toe, ook het land van Gilead, tot de HEERE te Mizpa.", "Ps 20:5": "Hij geeft u naar uw hart, en vervult al uw raad.", "Ezech 22:21": "Ja, Ik zal u bijeenbrengen, en op u blazen in het vuur van Mijn verbolgenheid, zodat u in het midden ervan zult smelten.", "Job 5:14": "Overdag ontmoeten zij de duisternis, en zoals 's nachts tasten zij rond in de middag.", "Pred 2:26": "Want Hij geeft wijsheid, kennis en vreugde aan de mens die goed is voor Zijn aangezicht; maar aan de zondaar geeft Hij de bezigheid om te verzamelen en te vergaderen, opdat Hij het geeft aan wie goed is voor Gods aangezicht. Dit is ook ijdelheid en kwelling van de geest.", "Mark 14:21": "De Zoon des mensen gaat wel heen, zoals van Hem geschreven is; maar wee die mens, door wie de Zoon des mensen verraden wordt! Het zou beter voor hem zijn, als die mens niet geboren was.", "Ps 55:24": "Maar U, o God! zult hen doen neerdalen in de put van het verderf; de mannen van het bloed en het bedrog zullen hun dagen niet tot de helft brengen; ik, daarentegen, zal op U vertrouwen.", "Gen 6:13": "Daarom zei God tegen Noach: Het einde van alle vlees is voor Mijn aangezicht gekomen; want de aarde is door hen vervuld met geweld; en zie, Ik zal hen met de aarde verderven.", "Ps 91:8": "Alleen zult u het met uw ogen aanschouwen; en u zult de vergelding van de goddelozen zien.", "Job 11:20": "Maar de ogen van de goddelozen zullen bezwijken, en de toevlucht zal van hen vergaan; en hun verwachting zal zijn de laatste ademtocht.", "1 Sam 30:18": "Zo redde David alles wat de Amalekieten genomen hadden; ook redde David zijn twee vrouwen.", "Jer 41:2": "En Ismaël, de zoon van Nethanja, maakte zich klaar, alsook de tien mannen die met hem waren, en zij sloegen Gedalia, de zoon van Ahikam, de zoon van Safan, met het zwaard; zo doodde hij hem, die de koning van Babel over het land had aangesteld.", "Jak 1:15": "Daarna, als de begeerte ontvangen is, baart zij zonde; en als de zonde volgroeid is, baart zij de dood.", "1 Kon 1:5": "Adonia nu, de zoon van Haggith, verhief zich en zei: Ik zal koning zijn; en hij bereidde zich wagens en ruiters, en vijftig mannen die voor hem uit liepen.", "1 Kon 2:32": "Zo zal de HEERE zijn bloed op zijn eigen hoofd doen terugkeren, omdat hij twee mannen heeft aangevallen die rechtvaardiger en beter waren dan hij, en hen met het zwaard gedood heeft, terwijl mijn vader David het niet wist: Abner, de zoon van Ner, de legeraanvoerder van Israël, en Amasa, de zoon van Jether, de legeraanvoerder van Juda.", "2 Kron 25:8": "Maar als u toch gaat, doe het dan, wees sterk voor de strijd; God zal u laten vallen voor de vijand; want in God is kracht om te helpen en om te doen vallen.", "2 Sam 14:24-33": "En de koning zei: Laat hij naar zijn huis gaan, en mijn gezicht niet zien. Zo ging Absalom naar zijn huis, en zag het gezicht van de koning niet. Nu was er in heel Israël geen man zo mooi als Absalom, zeer geprezen; van zijn voetzool af tot zijn hoofdschedel toe was er geen gebrek in hem. En als hij zijn hoofd liet scheren (dit gebeurde aan het einde van elk jaar, dat hij het liet scheren, omdat het hem te zwaar werd, daarom liet hij het scheren), dan woog het haar van zijn hoofd tweehonderd sikkel, naar het gewicht van de koning.", "Hand 9:5": "En hij zei: Wie bent U, Heere? En de Heere zei: Ik ben Jezus, Die u vervolgt. Het is u hard, de hielen tegen de prikkels te slaan.", "Luk 12:46": "dan zal de heer van die dienstknecht komen op een dag dat hij hem niet verwacht, en op een moment dat hij het niet weet; en hij zal hem in stukken houwen, en hem zijn deel geven met de ontrouwen.", "2 Kon 6:30": "En het gebeurde, toen de koning de woorden van deze vrouw gehoord had, dat hij zijn kleren scheurde, terwijl hij over de muur voortging; en het volk zag dat er, zie, een zak van binnen over zijn vlees was.", "Joh 5:14": "Daarna vond Jezus hem in de tempel, en zei tegen hem: Zie, u bent gezond geworden; zondig niet meer, opdat u niet iets ergers overkomt.", "1 Kron 22:5": "Want David zei: Mijn zoon Salomo is een jongeman en teder; en het huis dat men voor de HEERE bouwen zal, moet buitengewoon groot gemaakt worden, tot een naam en tot glorie in alle landen; ik zal er nu voorraad voor bereiden. Zo bereidde David voorraad in overvloed voor zijn dood.", "Lev 26:16-39": "Dan zal Ik u dit ook doen: Ik zal over u schrik stellen, tering en koorts, die de ogen verteren en de ziel pijnigen; u zult ook uw zaad tevergeefs zaaien, en uw vijanden zullen dat opeten. Daartoe zal Ik Mijn aangezicht tegen u zetten, zodat u geslagen zult worden voor het aangezicht van uw vijanden; en uw haters zullen over u heersen, en u zult vluchten, ook al vervolgt u niemand. En als u Mij ook na deze dingen niet zult horen, zal Ik nog daaraan toedoen, om u zevenvoudig over uw zonden te tuchtigen.", "Lev 13:44-46": "Is die man melaats, hij is onrein; de priester zal hem helemaal onrein verklaren, zijn plaag is op zijn hoofd. Verder zullen de kleren van de melaatse, in wie die plaag is, gescheurd zijn, en zijn hoofd zal onbedekt zijn, en hij zal zijn bovenlip bedekken; daarbij zal hij roepen: Onrein, onrein! Al de dagen waarin deze plaag in hem zal zijn, zal hij onrein zijn; onrein is hij, hij zal alleen wonen; buiten het leger zal zijn woning zijn.", "1 Sam 31:13": "En zij namen hun beenderen en begroeven ze onder het geboomte bij Jabes; en zij vastten zeven dagen.", "Ps 119:119": "U doet alle goddelozen van de aarde weg als schuim, daarom heb ik Uw getuigenissen lief.", "Ps 89:11": "Gij hebt Rahab verbrijzeld als een verslagene; Gij hebt Uw vijanden verstrooid met de arm van Uw sterkte.", "Hos 9:7": "De dagen van de vergelding zijn gekomen, de dagen van de vergelding zijn gekomen; zij van Israël zullen het gewaar worden; de profeet is een dwaas, de man van de geest is onzinnig; om de grootheid van uw ongerechtigheid is de haat ook groot.", "1 Kron 3:4": "Zes zijn hem in Hebron geboren; want hij regeerde daar zeven jaar en zes maanden; en drieëndertig jaar regeerde hij in Jeruzalem.", "Rom 8:2": "Want de wet van de Geest van het leven in Christus Jezus heeft mij vrijgemaakt van de wet van de zonde en van de dood.", "1 Sam 10:21": "Toen hij de stam van Benjamin liet aantreden naar zijn geslachten, werd het geslacht van Matri aangewezen; en Saul, de zoon van Kis, werd aangewezen. En zij zochten hem, maar hij werd niet gevonden.", "Gen 9:6": "Wie het bloed van een mens vergiet, diens bloed zal door de mens vergoten worden; want God heeft de mens naar Zijn beeld gemaakt.", "1 Kor 5:13": "Maar hen die buiten zijn oordeelt God. En doe deze boze man uit uw midden weg.", "Zach 5:2-4": "En Hij zei tegen mij: Wat ziet u? En ik zei: Ik zie een vliegende rol, de lengte ervan is twintig el, en de breedte ervan tien el. Toen zei Hij tegen mij: Dit is de vloek die uitgaan zal over heel het land; want ieder die steelt, zal hiervandaan, volgens deze vloek, uitgeroeid worden; en ieder die valselijk zweert, zal hiervandaan, volgens deze vloek, uitgeroeid worden. Ik breng deze vloek naar buiten, spreekt de HEERE van de heerscharen, dat hij komt in het huis van de dief, en in het huis van hem die bij Mijn Naam vals zweert; en hij zal midden in zijn huis overnachten, en hij zal het verteren, met zijn hout en zijn stenen.", "2 Sam 2:17": "En er was op diezelfde dag een heel zware strijd. Doch Abner en de mannen van Israël werden voor de ogen van de knechten van David verslagen.", "Klaagl 5:17": "Daarom is ons hart mat, om deze dingen zijn onze ogen duister geworden.", "Ps 56:8": "Zouden zij om hun ongerechtigheid vrijuit gaan? Stort de volken neder in toorn, o God!", "1 Sam 28:17": "Want de HEERE heeft voor Zich gedaan, zoals Hij door mijn dienst gesproken heeft; en Hij heeft het koninkrijk uit uw hand gescheurd, en Hij heeft het gegeven aan uw naaste, aan David.", "2 Sam 7:14": "Ik zal hem tot een Vader zijn, en hij zal Mij tot een zoon zijn; wanneer hij misdoet, zal Ik hem straffen met een mensenroede en met plagen van de mensenkinderen.", "Spr 11:23": "Het verlangen van de rechtvaardigen is alleen het goede; maar de verwachting van de goddelozen is verbolgenheid.", "1 Kron 15:29": "Het gebeurde nu, toen de ark van het verbond van de HEERE tot aan de stad van David gekomen was, dat Michal, de dochter van Saul, door een venster keek, en koning David zag, springend en spelend; toen verachtte zij hem in haar hart.", "1 Kon 2:33": "Zo zal hun bloed terugkeren op het hoofd van Joab, en op het hoofd van zijn nakomelingen voor eeuwig; maar David, en zijn nakomelingen, en zijn huis, en zijn troon zal vrede hebben van de HEERE tot in eeuwigheid.", "Luk 7:12": "En toen Hij de poort van de stad naderde, zie, er werd een dode uitgedragen, de enige zoon van zijn moeder, en zij was weduwe; en een grote menigte uit de stad was bij haar.", "Jer 21:14": "En Ik zal over u bezoeking doen naar de vrucht van uw daden, spreekt de HEERE; en Ik zal een vuur aansteken in haar woud, dat alles zal verteren wat rondom haar is.", "1 Sam 18:20-28": "Doch Michal, de dochter van Saul, had David lief. Toen dat Saul te kennen werd gegeven, was die zaak goed in zijn ogen. En Saul zei: Ik zal haar hem geven, zodat zij hem tot een valstrik is, en zodat de hand van de Filistijnen tegen hem is. Daarom zei Saul tegen David: Met de andere zult u vandaag mijn schoonzoon worden. En Saul gebood zijn knechten: Spreek in het geheim met David en zeg: Zie, de koning heeft welgevallen aan u, en al zijn knechten hebben u lief; word dan nu de schoonzoon van de koning.", "Amos 8:14": "Zij die zweren bij de schuld van Samaria, en zeggen: Zo waarachtig als uw God van Dan leeft, en de weg van Berseba leeft! zij zullen vallen, en niet meer opstaan.", "Jes 37:23": "Wie hebt u gehoond en gelasterd, en tegen wie hebt u de stem verheven en uw ogen omhoog opgeheven? Tegen de Heilige van Israël!", "1 Sam 14:50": "En de naam van Sauls vrouw was Ahinoam, een dochter van Ahimaäz; en de naam van zijn legeraanvoerder was Abner, een zoon van Ner, Sauls oom.", "Ezech 7:4-6": "En Mijn oog zal u niet verschonen, en Ik zal niet sparen; maar Ik zal uw wegen op u brengen, en uw gruwelen zullen in het midden van u zijn, en u zult weten dat Ik de HEERE ben. Zo zegt de Heere HEERE: Een kwaad, een enig kwaad, zie, is gekomen; Een einde is er gekomen, dat einde is gekomen, het is opgewaakt tegen u; zie, het kwaad is gekomen!", "Ps 7:12-14": "God is een rechtvaardige Rechter, en een God, Die iedere dag toornt. Als hij zich niet bekeert, zal Hij Zijn zwaard scherpen; Hij heeft Zijn boog gespannen, en hem gereedgemaakt. En heeft dodelijke wapens voor hem gereedgemaakt; Hij zal Zijn pijlen tegen de felle vervolgers inzetten.", "Ps 106:43": "Hij heeft hen dikwijls gered; maar zij verbitterden Hem door hun raad, en werden uitgeteerd door hun ongerechtigheid.", "2 Petr 2:3-9": "En zij zullen door hebzucht, met gemaakte woorden, van u een koopwaar maken; over hen is het oordeel van lang geleden niet werkeloos, en hun verderf sluimert niet. Want als God de engelen die gezondigd hebben niet gespaard heeft, maar hen in de hel geworpen heeft en overgegeven heeft aan de ketenen van de duisternis, om tot het oordeel bewaard te worden; en de oude wereld niet gespaard heeft, maar Noach, de prediker van de gerechtigheid, met zeven anderen bewaard heeft, toen Hij de zondvloed over de wereld van de goddelozen bracht;", "2 Sam 22:27": "Bij de reine houdt U Zich rein; maar bij de verkeerde houdt U Zich verdraaid.", "2 Kon 18:32": "Totdat ik kom, en u haal in een land, als uw land, een land van koren en van most, een land van brood en van wijngaarden, een land van olijven, van olie en van honing; zo zult u leven en niet sterven; en hoort niet naar Hizkia, want hij hitst u op, door te zeggen: De HEERE zal ons redden.", "1 Sam 18:25": "Toen zei Saul: Zo zult u tegen David zeggen: De koning heeft geen behoefte aan een bruidsschat, maar aan honderd voorhuiden van de Filistijnen, opdat men zich wreekt op de vijanden van de koning. Want Saul dacht David te doen vallen door de hand van de Filistijnen.", "2 Sam 19:6": "Door hen lief te hebben die u haten, en te haten die u liefhebben; want u geeft vandaag te kennen dat leiders en knechten voor u niets betekenen; want ik merk vandaag dat als Absalom in leven was gebleven, en wij vandaag allemaal dood waren, dat het u dan goed zou uitkomen.", "1 Kon 1:11": "Toen sprak Nathan tot Bathseba, de moeder van Salomo, en zei: Hebt u niet gehoord dat Adonia, de zoon van Haggith, koning is? En onze heer David weet dat niet.", "Job 5:3": "Ik heb een dwaas gezien die wortel schoot; doch meteen vervloekte ik zijn woning.", "2 Sam 16:22": "Zo spanden zij voor Absalom een tent op op het dak; en Absalom ging naar de bijvrouwen van zijn vader, voor de ogen van heel Israël.", "2 Sam 2:24": "Maar Joab en Abisai jaagden Abner achterna; en de zon ging onder, toen zij gekomen waren bij de heuvel van Amma, die voor Giach ligt, aan de weg van de woestijn van Gibeon.", "Spr 11:3": "De oprechtheid van de oprechten leidt hen; maar de verkeerdheid van de trouwelozen verstoort hen.", "Jes 57:21": "De goddelozen, zegt mijn God, hebben geen vrede.", "Luk 3:7": "Hij zei dan tegen de menigten die naar buiten kwamen om door hem gedoopt te worden: Adderengebroed, wie heeft u aangewezen te vluchten van de toekomende toorn?", "Luk 9:24-26": "Want wie zijn leven wil behouden, zal het verliezen; maar wie zijn leven verliest om Mij, die zal het behouden. Want wat baat het een mens als hij de hele wereld zou winnen, en zichzelf verliezen of schade lijden? Want wie zich voor Mij en Mijn woorden zal schamen, voor hem zal de Zoon des mensen Zich schamen wanneer Hij komt in Zijn heerlijkheid, en die van de Vader, en van de heilige engelen.", "2 Sam 3:7-21": "Saul had een bijvrouw gehad, met de naam Rizpa, dochter van Aja; en Isboseth zei tegen Abner: Waarom bent u naar mijn vaders bijvrouw gegaan? Toen ontstak Abner in grote woede over de woorden van Isboseth, en zei: Ben ik dan een hondenkop, ik, die tegen Juda, aan het huis van Saul, uw vader, aan zijn broers en aan zijn vrienden, tot op vandaag trouw bewijs, en u niet in Davids hand overgeleverd heb, dat u mij vandaag beschuldigt vanwege de schuld met deze vrouw? God moet Abner zo doen, en meer nog daarbij, als ik niet, zoals de HEERE aan David gezworen heeft, precies zo aan hem zal doen:", "Luk 13:9": "en als hij dan vrucht draagt, laat hem staan; maar zo niet, dan kunt u hem daarna omhakken.", "1 Sam 2:32-36": "En u zult de benauwdheid van de woning van God aanschouwen, in plaats van al het goede dat Hij Israël zou hebben gedaan; en er zal op geen dag een oud man in uw huis zijn. Doch de man die Ik u niet zal uitroeien van Mijn altaar, zou zijn om uw ogen te verteren, en om uw ziel te bedroeven; en alle nakomelingen van uw huis zullen sterven als zij mannen geworden zijn. Dit nu zal u een teken zijn, dat over uw beide zonen, over Hofni en Pinehas, komen zal: op één dag zullen zij beiden sterven.", "Richt 20:26": "Toen trokken alle kinderen van Israël en heel het volk op, en kwamen bij het huis van God, en weenden, en bleven daar voor het aangezicht van de HEERE, en vastten die dag tot de avond; en zij offerden brandoffers en dankoffers voor het aangezicht van de HEERE.", "Pred 7:17": "Wees niet al te goddeloos, en wees ook niet al te dwaas; waarom zou u sterven vóór uw tijd?", "Ps 73:2-21": "Maar wat mij aangaat, mijn voeten waren bijna uitgegleden; mijn schreden waren bijna weggegleden. Want ik was jaloers op de dwazen, toen ik de vrede van de goddelozen zag. Want er zijn geen boeien tot hun dood toe, en hun kracht is fris.", "Luk 13:28": "Daar zal het geween zijn en het geknars van de tanden, wanneer u Abraham, Izak en Jakob en al de profeten zult zien in het Koninkrijk van God, en uzelf eruit gezet.", "Hebr 6:8": "maar die doornen en distels draagt, is verwerpelijk, en dicht bij de vervloeking, waarvan het einde verbranding is.", "Openb 2:23": "En haar kinderen zal Ik door de dood ombrengen; en alle gemeenten zullen weten dat Ik het ben Die nieren en harten onderzoek. En Ik zal u geven, ieder naar uw werken.", "Joz 13:13": "Maar de kinderen van Israël verdreven de Gezurieten en de Maachathieten niet; maar Gezur en Maachath woonden midden in Israël tot op deze dag.", "1 Sam 15:28": "Toen zei Samuël tegen hem: De HEERE heeft heden het koninkrijk van Israël van u afgescheurd, en heeft het aan uw naaste gegeven, die beter is dan u.", "Luk 13:27": "En Hij zal zeggen: Ik zeg u, Ik weet niet waar u vandaan komt; ga weg van Mij, allen die ongerechtigheid werken!", "Ps 21:11": "U zult hun vrucht van de aarde verdoen, en hun nageslacht van de kinderen der mensen.", "2 Sam 5:3": "Zo kwamen alle oudsten van Israël naar de koning in Hebron; en koning David sloot met hen een verbond in Hebron, voor het aangezicht van de HEERE; en zij zalfden David tot koning over Israël.", "Job 4:9": "Van de adem van God komen zij om, en van het geblaas van Zijn neus worden zij verdaan.", "Job 10:15": "Ben ik goddeloos, wee mij! En ben ik rechtvaardig, ik zal mijn hoofd niet opheffen; ik ben verzadigd van schande, maar zie mijn ellende aan.", "Joël 2:2": "Een dag van duisternis en donkerheid, een dag van wolken en dikke duisternis, als de dageraad uitgespreid over de bergen; een groot en machtig volk, zoals er van oude tijden af niet geweest is, en na hen niet meer zal zijn tot in jaren van vele geslachten.", "2 Sam 18:3": "Maar het volk zei: U mag niet meetrekken; want als wij op de vlucht slaan, zullen zij zich niet om ons bekommeren; ja, al stierf de helft van ons, zij zullen zich niet om ons bekommeren; maar u bent nu als tienduizend van ons waard. Zo zal het nu beter zijn, dat u ons vanuit de stad te hulp komt.", "Joël 3:13-16": "Sla de sikkel erin, want de oogst is rijp geworden; kom, daal af, want de pers is vol, en de perskuipen lopen over; want hun slechtheid is groot. Menigten, menigten in het dal van de beslissing; want de dag van de HEERE is nabij, in het dal van de beslissing. De zon en de maan zijn zwart geworden, en de sterren hebben hun glans ingetrokken.", "Mal 3:18": "Dan zult u opnieuw zien het onderscheid tussen de rechtvaardige en de goddeloze, tussen wie God dient, en wie Hem niet dient.", "Gen 44:26": "Toen hebben wij gezegd: Wij kunnen niet aftrekken; als onze kleinste broer bij ons is, zullen wij aftrekken; want wij mogen het gezicht van die man niet zien, als deze onze kleinste broer niet bij ons is.", "Matt 25:46": "En dezen zullen weggaan in de eeuwige pijn; maar de rechtvaardigen in het eeuwige leven.", "1 Kron 10:13": "Zo stierf Saul in zijn overtreding, waarmee hij overtreden had tegen de HEERE, tegen het woord van de HEERE dat hij niet gehouden had; en ook omdat hij de waarzegster geraadpleegd had, haar zoekende,", "2 Sam 1:16": "En David zei tegen hem: Uw bloed komt op uw hoofd; want uw mond heeft tegen u getuigd, toen u zei: ik heb de gezalfde van de HEERE gedood.", "Dan 12:2": "En velen van hen die in het stof van de aarde slapen, zullen ontwaken, dezen tot eeuwig leven, en anderen tot versmaadheden en tot eeuwige afgrijzing.", "2 Sam 13:37": "(Absalom nu vluchtte, en ging naar Thalmai, de zoon van Ammihur, koning van Gesur.) En hij droeg rouw over zijn zoon, al die dagen.", "2 Sam 12:8": "en Ik heb u het huis van uw heer gegeven, en de vrouwen van uw heer in uw schoot; ja, Ik heb u het huis van Israël en Juda gegeven; en als dat weinig was, zou Ik u dit en dat er nog bij gegeven hebben.", "Ezech 11:21": "Maar van hen wier hart het hart van hun verfoeiselen en hun gruwelen navolgt, zal Ik de weg daarvan op hun hoofd geven, spreekt de Heere HEERE.", "Ps 89:20": "Toen hebt Gij in een gezicht gesproken van Uw heilige, en gezegd: Ik heb hulp besteld bij een held; Ik heb een verkorene uit het volk verhoogd.", "2 Sam 13:12": "Maar zij zei tegen hem: Nee, mijn broer, verkracht mij niet, want zo doet men niet in Israël; doe deze dwaasheid niet.", "Spr 28:14": "Gelukkig is de mens, die voortdurend vreest; maar wie zijn hart verhardt, zal in het kwaad vallen.", "Judas 1:1": "Judas, een dienstknecht van Jezus Christus, en broeder van Jakobus, aan de geroepenen, die door God de Vader geheiligd zijn, en door Jezus Christus bewaard:", "Deut 7:10": "En Hij vergeldt ieder van hen die Hem haten, in zijn aangezicht, om hem te verderven; Hij zal het voor wie Hem haat niet uitstellen, in zijn aangezicht zal Hij het hem vergelden.", "Matt 7:19": "Iedere boom die geen goede vrucht voortbrengt, wordt omgehakt en in het vuur geworpen.", "2 Sam 15:1-18": "Het gebeurde daarna dat Absalom voor zichzelf wagens en paarden liet klaarmaken, en vijftig mannen die voor hem uit renden. Ook stond Absalom 's morgens vroeg op, en ging staan aan de kant van de weg naar de poort. En het gebeurde dat Absalom iedere man die een geschil had en naar de koning wilde komen voor een rechtszaak, tot zich riep en zei: Uit welke stad bent u? Als hij dan zei: Uw knecht is uit een van de stammen van Israël, dan zei Absalom tegen hem: Zie, uw zaken zijn goed en juist; maar u hebt niemand die u namens de koning aanhoort.", "2 Sam 5:1-3": "Toen kwamen alle stammen van Israël naar David in Hebron, en zij zeiden: Zie, wij zijn uw gebeente en uw vlees. Ook al eerder, toen Saul koning over ons was, was u het die Israël uitleidde en terugbracht; ook heeft de HEERE tegen u gezegd: U zult Mijn volk Israël weiden, en u zult een leider zijn over Israël. Zo kwamen alle oudsten van Israël naar de koning in Hebron; en koning David sloot met hen een verbond in Hebron, voor het aangezicht van de HEERE; en zij zalfden David tot koning over Israël.", "Spr 12:7": "De goddelozen worden omgekeerd, zodat zij niet meer zijn; maar het huis van de rechtvaardigen zal bestaan.", "Luk 19:42": "en zei: Och, had u ook maar geweten, ook nog op deze dag van u, wat tot uw vrede dient! Maar nu is het verborgen voor uw ogen.", "Jer 14:10": "Zo zegt de HEERE van dit volk: Zij hebben zo liefgehad om te zwerven, zij hebben hun voeten niet bedwongen; daarom heeft de HEERE geen welgevallen aan hen, nu zal Hij aan hun ongerechtigheden denken, en hun zonden bezoeken.", "Spr 28:18": "Wie oprecht wandelt, zal behouden worden; maar wie zich verkeerd gedraagt op twee wegen, zal op een van de twee vallen.", "1 Sam 24:14": "Zoals het spreekwoord van de ouden zegt: Van de goddelozen komt goddeloosheid voort; maar mijn hand zal niet tegen u zijn.", "Matt 22:13": "Toen zei de koning tegen de dienaars: Bind zijn handen en voeten, neem hem mee en werp hem in de buitenste duisternis; daar zal het huilen zijn en het geknars van de tanden.", "Rom 2:5": "Maar naar uw hardheid en onbekeerlijk hart, verzamelt u voor uzelf toorn als een schat, voor de dag van de toorn en de openbaring van het rechtvaardig oordeel van God.", "Ps 84:8": "Zij gaan van kracht tot kracht; ieder van hen zal verschijnen voor God in Sion.", "Pred 2:16": "Want er zal in eeuwigheid niet meer herinnering aan een wijze zijn dan aan een dwaas; aangezien wat nu is, in de toekomstige dagen helemaal vergeten wordt; en hoe sterft de wijze? Net als de dwaas.", "Ps 75:11": "En ik zal alle hoorns van de goddelozen afhouwen; de hoorns van de rechtvaardige zullen verhoogd worden.", "Matt 13:12-15": "Want wie heeft, hem zal gegeven worden, en hij zal overvloedig hebben; maar wie niet heeft, van hem zal genomen worden ook wat hij heeft. Daarom spreek Ik tot hen door gelijkenissen, omdat zij ziende niet zien, en horende niet horen, en ook niet begrijpen. En in hen wordt de profetie van Jesaja vervuld, die zegt: Met het gehoor zult u horen, en geenszins begrijpen; en ziende zult u zien, en geenszins opmerken.", "Jer 41:7": "Maar het gebeurde, toen zij midden in de stad gekomen waren, dat Ismaël, de zoon van Nethanja, hen keelde, en hen wierp in het midden van het kuil, hij en de mannen die met hem waren.", "Jer 16:18": "Daarom zal Ik eerst hun ongerechtigheid en hun zonde dubbel vergelden, omdat zij Mijn land ontheiligd hebben; zij hebben Mijn erfenis met de dode lichamen van hun verfoeisels en hun gruwelen vervuld.", "Matt 3:10": "En ook ligt de bijl al aan de wortel van de bomen; elke boom dan die geen goede vrucht voortbrengt, wordt omgehakt en in het vuur geworpen.", "Matt 25:32": "En voor Hem zullen alle volken verzameld worden, en Hij zal ze van elkaar scheiden, zoals de herder de schapen van de bokken scheidt.", "1 Sam 14:51": "En Kis was Sauls vader, en Ner, Abners vader, was een zoon van Abiël.", "Jes 40:2": "Spreekt naar het hart van Jeruzalem, en roept haar toe, dat haar strijd vervuld is, dat haar ongerechtigheid verzoend is, dat zij van de hand van de HEERE dubbel ontvangen heeft voor al haar zonden.", "Gen 31:54": "Toen slachtte Jakob een offer op dat gebergte, en hij nodigde zijn broeders om brood te eten; en zij aten brood, en overnachtten op dat gebergte.", "2 Kron 15:2": "En hij ging Asa tegemoet, en hij zei tegen hem: Hoor mij, Asa, en heel Juda en Benjamin! De HEERE is met u, zolang u met Hem bent; en als u Hem zoekt, zal Hij door u gevonden worden; maar als u Hem verlaat, zal Hij u verlaten.", "Dan 2:44": "Maar in de dagen van die koningen zal de God van de hemel een Koninkrijk oprichten, dat in eeuwigheid niet zal worden verwoest; en dat Koninkrijk zal aan geen ander volk worden overgelaten; het zal al die koninkrijken verbrijzelen en tenietdoen, maar zelf zal het in alle eeuwigheid bestaan.", "Ps 64:8": "Maar God zal hen haastig met een pijl schieten; hun plagen zijn er.", "Jes 13:9": "Zie, de dag van de HEERE komt, gruwelijk, met verbolgenheid en hevige toorn, om het land tot verwoesting te stellen, en de zondaars daaruit te verdelgen.", "Job 19:29": "Schroom voor het zwaard; want de grimmigheid is over de misdaden van het zwaard; opdat u weet, dat er een gericht is.", "Openb 21:27": "En in haar zal niets binnenkomen dat verontreinigt, en gruwelijkheid doet, en leugen spreekt; maar alleen wie geschreven zijn in het boek van het leven van het Lam.", "Openb 20:10": "En de duivel, die hen verleidde, werd geworpen in de poel van het vuur en sulfer, waar het beest en de valse profeet zijn; en zij zullen gepijnigd worden dag en nacht in alle eeuwigheid.", "Gen 6:7": "En de HEERE zei: Ik zal de mens, die Ik geschapen heb, wegvagen van de aardbodem, van de mens tot het vee, tot het kruipend gedierte, en tot het gevogelte van de hemel toe; want het berouwt Mij dat Ik hen gemaakt heb.", "Jes 28:18-22": "En uw verbond met de dood zal teniet gedaan worden, en uw voorzichtig verdrag met het rijk van de dood zal niet standhouden; wanneer de overstromende gesel doortrekt, dan zult u erdoor vertrapt worden. Vanaf de tijd dat hij doortrekt, zal hij u wegnemen, want elke morgen zal hij doortrekken, bij dag en bij nacht; en het zal gebeuren, dat louter het verstaan van het gerucht een verschrikking zal zijn. Want het bed zal korter zijn dan dat men zich erop kan uitstrekken; en het deksel zal te smal zijn, als men zich eronder wikkelt.", "2 Sam 20:9": "En Joab zei tegen Amasa: Is het goed met u, mijn broeder? En Joab pakte met de rechterhand de baard van Amasa, om hem te kussen.", "Ps 2:1-4": "Waarom woeden de heidenen, en bedenken de volken iets zinloos? De koningen van de aarde stellen zich op, en de vorsten beraadslagen samen tegen de HEERE, en tegen Zijn Gezalfde, en zeggen: Laat ons hun banden verscheuren, en hun touwen van ons afwerpen.", "1 Kron 27:7": "De vierde, in de vierde maand, was Asaël, de broer van Joab, en na hem Zebadja, zijn zoon; in zijn verdeling waren er ook vierentwintigduizend.", "Matt 13:49": "Zo zal het bij de voleinding van de wereld zijn; de engelen zullen uitgaan, en de bozen uit het midden van de rechtvaardigen afscheiden;", "Spr 13:2": "Ieder zal van de vrucht van de mond het goede eten; maar de ziel van de trouwelozen het geweld.", "Jes 2:19": "Dan zullen zij in de spelonken van de rotsstenen gaan, en in de holen van de aarde, vanwege de schrik van de HEERE, en vanwege de heerlijkheid van Zijn majesteit, wanneer Hij Zich zal opmaken, om de aarde te verschrikken.", "1 Kor 10:5-11": "Maar in het meerdere deel van hen heeft God geen welgevallen gehad; want zij zijn in de woestijn neergeslagen. En deze dingen zijn ons tot voorbeelden gebeurd, opdat wij geen lust tot het kwade zouden hebben, zoals zij ook lust gehad hebben. En word geen afgodendienaars, zoals sommigen van hen, zoals geschreven staat: Het volk zat neer om te eten en te drinken, en zij stonden op om te spelen.", "1 Kon 2:17": "En hij zei: Spreek toch tot de koning Salomo, want hij zal uw aangezicht niet afwijzen, dat hij mij Abisag, de Sunamitische, tot vrouw geeft.", "Ps 9:18": "De goddelozen zullen terugkeren, naar de hel toe, alle heidenen die God vergeten zijn.", "Mark 12:40": "die de huizen van weduwen opeten, en dat onder de schijn van lang te bidden. Dezen zullen een zwaarder oordeel ontvangen.", "1 Sam 25:39-44": "Toen David hoorde dat Nabal dood was, zei hij: Gezegend zij de HEERE, Die de twist om mijn smaad getwist heeft met de hand van Nabal, en Zijn knecht onthouden heeft van het kwade, en dat de HEERE het kwaad van Nabal op zijn eigen hoofd heeft doen wederkeren! En David zond heen, en liet met Abigaïl spreken, om haar tot vrouw te nemen. Toen de knechten van David bij Abigaïl gekomen waren te Karmel, spraken zij tegen haar en zeiden: David heeft ons tot u gezonden, om u tot vrouw te nemen. Toen stond zij op, en boog zich met het aangezicht ter aarde, en zij zei: Zie, uw dienstmaagd zij een dienares, om de voeten van de knechten van mijn heer te wassen.", "Joh 3:18": "Wie in Hem gelooft, wordt niet veroordeeld, maar wie niet gelooft, is al veroordeeld, omdat hij niet geloofd heeft in de Naam van de eniggeboren Zoon van God.", "Matt 27:24": "Toen Pilatus nu zag dat hij niets bereikte, maar dat er juist meer oproer kwam, nam hij water en waste zijn handen voor de menigte, en zei: Ik ben onschuldig aan het bloed van deze Rechtvaardige; u moet maar toezien.", "1 Kron 15:13": "Want omdat u dit de eerste keer niet deed, heeft de HEERE, onze God, onder ons een scheur gemaakt, omdat wij Hem niet gezocht hebben naar het recht.", "Ezech 22:14": "Zal uw hart standhouden? Zullen uw handen sterk zijn, in de dagen dat Ik met u zal handelen? Ik, de HEERE, heb het gesproken, en zal het doen.", "Amos 9:10": "Alle zondaars van Mijn volk zullen door het zwaard sterven; zij die zeggen: Het kwaad zal ons niet naderen, en ons niet treffen.", "Jer 13:22": "Wanneer u dan in uw hart zult zeggen: Waarom zijn mij deze dingen overkomen? Om de veelheid van uw ongerechtigheid zijn uw zomen ontbloot, en uw hielen hebben geweld geleden.", "2 Sam 13:31": "Toen stond de koning op, en scheurde zijn kleren, en ging op de grond liggen; en al zijn knechten stonden erbij met gescheurde kleren.", "Jona 3:9": "Wie weet, God mocht Zich wenden, en berouw hebben; en Hij mocht Zich wenden van de gloed van Zijn toorn, zodat wij niet vergaan!", "Spr 14:32": "De goddeloze zal weggedreven worden in zijn kwaad; maar de rechtvaardige vertrouwt zelfs in zijn dood.", "Luk 13:24": "Strijd om binnen te gaan door de nauwe poort; want velen, zeg Ik u, zullen zoeken binnen te gaan en zullen dat niet kunnen;", "Matt 21:41": "Zij zeiden tegen hem: Hij zal die kwaden een kwade dood laten sterven, en de wijngaard verhuren aan andere landbouwers, die hem de vruchten op de juiste tijd zullen geven.", "1 Kron 12:29": "En van de kinderen van Benjamin, de broers van Saul, drieduizend; want tot dan toe hielden de meesten van hen het nog met het huis van Saul;", "2 Sam 13:29": "En Absaloms knechten deden met Amnon zoals Absalom geboden had. Toen stonden alle zonen van de koning op, en reden ieder op zijn muildier, en vluchtten.", "Ps 62:13": "En de goedertierenheid, o Heere! is van U; want U zult ieder vergelden naar zijn werk.", "Luk 17:1": "En Hij zei tegen de discipelen: Het kan niet anders, dan dat er ergernissen komen; maar wee hem, door wie ze komen.", "Ps 50:22": "Verstaat dit toch, u die God vergeet! opdat Ik niet verscheur en niemand redt.", "1 Tess 5:3": "Want wanneer zij zullen zeggen: Het is vrede en veilig; dan zal een plotseling verderf hun overkomen, zoals de barensweeën een zwangere vrouw overkomen; en zij zullen het geenszins ontvluchten;", "Jak 1:14": "Maar ieder wordt verzocht, als hij door zijn eigen begeerte afgetrokken en verlokt wordt.", "Gen 4:7": "Is het niet zo: als u goed doet, wordt u aanvaard? En als u niet goed doet, ligt de zonde aan de deur. Naar u gaat zijn begeerte uit, en u zult over hem heersen.", "Job 27:8-23": "Want wat is de verwachting van de huichelaar, als hij gierig geweest zal zijn, wanneer God zijn ziel zal uittrekken? Zal God zijn geroep horen, als benauwdheid over hem komt? Zal hij zich verlustigen in de Almachtige? Zal hij God aanroepen te aller tijd?", "1 Sam 16:1": "Toen zei de HEERE tegen Samuël: Hoe lang draagt u leed om Saul, die Ik toch verworpen heb, dat hij geen koning meer zal zijn over Israël? Vul uw hoorn met olie, en ga op weg; Ik zal u zenden naar Isaï, de Bethlehemiet; want Ik heb Mij een koning uitgekozen onder zijn zonen.", "Ps 97:3": "Een vuur gaat voor Zijn aangezicht heen, en het steekt Zijn tegenstanders rondom in brand.", "Gen 49:3": "Ruben! U bent mijn eerstgeborene, mijn kracht, en het begin van mijn macht; de voortreffelijkste in hoogheid, en de voortreffelijkste in sterkte!", "Jer 16:8": "Ga ook niet in een huis van het maaltijd, om bij hen te zitten, om te eten en te drinken.", "Gal 6:8": "Want die in zijn eigen vlees zaait, zal uit het vlees verderf maaien; maar die in de Geest zaait, zal uit de Geest het eeuwige leven maaien.", "Deut 28:6": "Gezegend zult u zijn in uw ingaan, gezegend zult u zijn in uw uitgaan.", "2 Sam 2:9": "en maakte hem koning over Gilead, en over de Aschurieten, en over Jizreël, en over Efraïm, en over Benjamin, en over heel Israël.", "2 Sam 1:2": "dat het op de derde dag gebeurde dat er, kijk, uit het leger van Saul een man kwam, wiens kleren gescheurd waren, en aarde was op zijn hoofd; en het gebeurde, toen hij bij David kwam, dat hij ter aarde viel en zich neerboog.", "Ps 18:28": "Want U verlost het bedrukte volk, maar de hoge ogen vernedert U.", "Spr 13:6": "De gerechtigheid bewaart de oprechte op de weg; maar de goddeloosheid zal de zondaar omkeren.", "Spr 22:23": "Want de HEERE zal hun rechtszaak voeren, en Hij zal aan hen die hen beroven, de ziel roven.", "Luk 19:41": "En toen Hij dichtbij kwam en de stad zag, weende Hij over haar,", "Ps 68:2": "God zal opstaan, Zijn vijanden zullen verstrooid worden, en Zij die Hem haten zullen van Zijn aangezicht vluchten.", "Hebr 10:27-31": "maar een schrikwekkend uitzicht op het oordeel, en een felle hitte van het vuur, die de tegenstanders zal verslinden. Als iemand de wet van Mozes heeft verworpen, sterft hij zonder ontferming, op het woord van twee of drie getuigen; hoeveel zwaarder straf, denkt u, zal hij waard geacht worden, die de Zoon van God met voeten heeft getreden, en het bloed van het testament, waardoor hij geheiligd was, als onrein heeft beschouwd, en de Geest van de genade smaad heeft aangedaan?", "1 Kor 9:27": "Maar ik bedwing mijn lichaam, en breng het tot dienstbaarheid, opdat ik niet, nadat ik anderen gepredikt heb, zelf verwerpelijk word.", "1 Kon 15:32": "En er was oorlog tussen Asa en Baësa, de koning van Israël, al hun dagen.", "Matt 5:19-30": "Wie dan een van deze minste geboden afschaft, en de mensen zo leert, die zal de minste genoemd worden in het Koninkrijk der hemelen; maar wie ze doet en leert, die zal groot genoemd worden in het Koninkrijk der hemelen. Want Ik zeg u: als uw gerechtigheid niet overvloediger is dan die van de Schriftgeleerden en de Farizeeën, zult u het Koninkrijk der hemelen beslist niet binnengaan. U hebt gehoord dat tot de ouden gezegd is: U zult niet doden; en wie doodt, die zal strafbaar zijn voor het gericht.", "Matt 7:27": "En de slagregen is neergevallen, en de waterstromen zijn gekomen, en de winden hebben gewaaid en zijn tegen dat huis aangeslagen, en het is gevallen, en zijn val was groot.", "Matt 15:13": "Maar Hij antwoordde en zei: Elke plant die Mijn hemelse Vader niet geplant heeft, zal uitgeroeid worden.", "Ezech 12:23": "Daarom, zeg tegen hen: Zo zegt de Heere HEERE: Ik zal dit spreekwoord doen ophouden, zodat zij het niet meer als spreekwoord zullen gebruiken in Israël. Maar spreek tot hen: De dagen zijn nabijgekomen, en het woord van elk visioen.", "Joh 3:16": "Want zo lief heeft God de wereld gehad, dat Hij Zijn eniggeboren Zoon gegeven heeft, opdat ieder die in Hem gelooft, niet verloren gaat, maar het eeuwige leven heeft.", "Deut 7:9": "U zult dan weten dat de HEERE, uw God, dié God is, de getrouwe God, Die het verbond en de goedertierenheid houdt met wie Hem liefhebben en Zijn geboden houden, tot in duizend geslachten.", "Matt 8:12": "maar de kinderen van het koninkrijk zullen uitgeworpen worden in de buitenste duisternis; daar zal gehuil zijn, en het geknars van de tanden.", "Ex 32:33-35": "Toen zei de HEERE tegen Mozes: Wie tegen Mij zondigt, die zal Ik uit Mijn boek delgen. Ga nu heen, leid dit volk naar waar Ik u gezegd heb; zie, Mijn Engel zal voor u uit gaan! Maar op de dag van het bezoeken zal Ik hun zonde over hen bezoeken! Zo trof de HEERE dit volk met een plaag, omdat zij dat kalf gemaakt hadden, dat Aäron gemaakt had.", "2 Sam 19:17": "En duizend man van Benjamin met hem; ook Ziba, de knecht van Sauls huis, en zijn vijftien zonen en zijn twintig knechten met hem; en zij trokken vaardig de Jordaan over, voor de koning uit.", "Amos 3:2": "Uit alle geslachten van de aardbodem heb Ik u alleen gekend; daarom zal Ik al uw ongerechtigheden over u bezoeken.", "Ezech 16:44": "Zie, ieder die spreekwoorden gebruikt, zal over u een spreekwoord gebruiken, en zeggen: Zo de moeder is, is haar dochter.", "2 Sam 19:5-7": "Toen kwam Joab bij de koning in huis, en zei: U hebt vandaag het gezicht van al uw knechten beschaamd gemaakt, terwijl zij vandaag uw leven hebben gered, en het leven van uw zonen en uw dochters, en het leven van uw vrouwen, en het leven van uw bijvrouwen; Door hen lief te hebben die u haten, en te haten die u liefhebben; want u geeft vandaag te kennen dat leiders en knechten voor u niets betekenen; want ik merk vandaag dat als Absalom in leven was gebleven, en wij vandaag allemaal dood waren, dat het u dan goed zou uitkomen. Zo sta nu op, ga naar buiten, en spreek uw knechten moed in; want ik zweer bij de HEERE: als u niet naar buiten gaat, zal er vannacht niemand bij u blijven! En dat zal erger voor u zijn dan al het kwaad dat u overkomen is vanaf uw jeugd tot nu toe.", "Matt 18:34": "En zijn heer werd toornig en leverde hem over aan de pijnigers, totdat hij alles zou betaald hebben wat hij hem schuldig was.", "Jes 5:11-14": "Wee hun die zich vroeg in de morgen opmaken om sterke drank na te jagen, en die doorgaan tot in de schemering, totdat de wijn hen verhit heeft! En harp en luit, tamboerijn en fluit, en wijn zijn bij hun feesten; maar zij letten niet op het werk van de HEERE, en zij zien niet op het maaksel van Zijn handen. Daarom zal mijn volk gevankelijk weggevoerd worden, omdat het geen kennis heeft; en zijn heerlijke mannen zullen honger lijden, en zijn menigte zal verdorren van dorst.", "Job 8:20": "Zie, God zal de oprechte niet verwerpen; Hij zal ook de boosdoeners niet bij de hand vatten;", "Jer 8:12-14": "Zijn zij beschaamd, omdat zij gruwel bedreven hebben? Nee, zij schamen zich in het geheel niet, en weten niet hoe ze schaamrood moeten worden; daarom zullen zij vallen onder de vallende; ten tijde van hun bezoeking zullen zij struikelen, zegt de HEERE. Ik zal hen voorzeker wegrapen, spreekt de HEERE; er zijn geen druiven aan de wijnstok, en geen vijgen aan de vijgenboom, ja, het blad is afgevallen; en de geboden die Ik hun gegeven heb, die overtreden zij. Waarom blijven wij zitten? Verzamel u, en laat ons ingaan in de versterkte steden, en daar stilzwijgen; zeker heeft de HEERE, onze God, ons doen stilzwijgen, en ons met gallewater gedrenkt, omdat wij tegen de HEERE gezondigd hebben.", "2 Sam 17:25": "En Absalom had Amasa in de plaats van Joab aangesteld over het leger. Amasa nu was de zoon van een man wiens naam Jethra was, de Israëliet, die bij Abigaïl was ingegaan, de dochter van Nahas, zuster van Zeruja, de moeder van Joab.", "1 Kor 6:9": "Of weet u niet, dat de onrechtvaardigen het Koninkrijk van God niet zullen beërven?", "Joh 15:2": "Elke rank die in Mij geen vrucht draagt, die neemt Hij weg; en elke rank die vrucht draagt, die reinigt Hij, zodat zij meer vrucht draagt.", "Num 27:17": "Die voor hen uitgaat, en die voor hen ingaat, en die hen uitleidt, en die hen inleidt; opdat de vergadering van de HEERE niet is als schapen die geen herder hebben.", "1 Kon 2:13-25": "Toen kwam Adonia, de zoon van Haggith, naar Bathseba, de moeder van Salomo; en zij zei: Komt u in vrede? En hij zei: In vrede. Daarna zei hij: Ik heb een woord voor u. En zij zei: Spreek. Hij zei dan: U weet dat het koninkrijk van mij was, en dat heel Israël zijn aangezicht op mij gericht had, dat ik koning zou worden; hoewel het koninkrijk is omgewend en van mijn broer geworden is; want het is van de HEERE aan hem gekomen.", "Matt 18:7-9": "Wee de wereld vanwege de struikelblokken, want het is onvermijdelijk dat de struikelblokken komen; maar wee die mens door wie het struikelblok komt! Als dan uw hand of uw voet u doet struikelen, hak ze af en werp ze van u weg. Het is beter voor u om kreupel of verminkt het leven
