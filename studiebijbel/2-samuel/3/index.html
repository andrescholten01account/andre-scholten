t voor mij; God doe u zo, en zo doe Hij daar nog aan toe, als u een woord voor mij verbergt van al de woorden die Hij tot u gesproken heeft!", "1 Kon 19:2": "Toen stuurde Izebel een bode naar Elia, om te zeggen: Zo mogen de goden mij doen, en nog erger, als ik uw leven niet morgen omstreeks deze tijd maak als het leven van één van hen.", "Jer 17:11": "Zoals een veldhoen eieren verzamelt, maar ze niet uitbroedt, zo is hij die rijkdom verzamelt, maar niet met recht; in de helft van zijn dagen zal hij die moeten verlaten, en in zijn laatste dagen een dwaas zijn.", "Ps 92:10": "Want zie, Uw vijanden, o HEERE! Want zie, Uw vijanden zullen vergaan; al de werkers van de ongerechtigheid zullen verstrooid worden.", "Luk 19:26": "Want ik zeg u dat ieder die heeft, gegeven zal worden; maar van hem die niet heeft, zal ook wat hij heeft afgenomen worden.", "2 Kon 2:12": "En Elisa zag het, en hij riep: Mijn vader, mijn vader, wagen van Israël en zijn ruiters! En hij zag hem niet meer; en hij greep zijn klederen en scheurde ze in twee stukken.", "Jes 65:12-14": "Ik zal u ook tellen voor het zwaard, zodat u zich allen ter slachting zult buigen, omdat Ik geroepen heb, maar u hebt niet geantwoord; Ik gesproken heb, maar u hebt niet gehoord; maar hebt gedaan wat kwaad was in Mijn ogen, en hebt gekozen waaraan Ik geen lust heb. Daarom zegt de Heere HEERE zo: Zie, Mijn knechten zullen eten, maar u zult hongeren; zie, Mijn knechten zullen drinken, maar u zult dorsten; zie, Mijn knechten zullen blij zijn, maar u zult beschaamd zijn. Zie, Mijn knechten zullen juichen van een goed hart, maar u zult schreeuwen van harteleed, en van verbreking van de geest zult u huilen.", "Joël 3:9-13": "Roept dit uit onder de heidenvolken, wijdt een oorlog; wekt de helden op, laat ze naderen, laat alle krijgslieden optrekken. Smeedt uw ploegscharen tot zwaarden, en uw snoeimessen tot speren; laat de zwakke zeggen: Ik ben een held. Verzamel u en kom aan, alle volken van rondom, en verzamel u! (O HEERE, laat Uw helden daarheen neerdalen!)", "1 Sam 10:20": "Toen Samuël nu al de stammen van Israël had laten aantreden, werd de stam van Benjamin aangewezen.", "Ps 139:19": "O God! Dat U de goddeloze zou ombrengen! En u, mannen van het bloed, wijkt van mij!", "Jer 25:31": "Het geschal zal komen tot aan het einde van de aarde; want de HEERE heeft een geschil met de volken, Hij zal gericht houden met alle vlees; de goddelozen heeft Hij aan het zwaard overgegeven, spreekt de HEERE.", "Ps 109:6-19": "Stel een goddeloze over hem, en de satan sta aan zijn rechterhand. Als hij geoordeeld wordt, laat hij dan schuldig uitgaan, en zijn gebed moet tot zonde worden. Laat zijn dagen weinig zijn; een ander neemt zijn ambt;", "Ezech 22:20": "Zoals zilver, of koper, of ijzer, of lood, of tin in het midden van een oven verzameld wordt, om het vuur daarover op te blazen, zodat men het smelt, zo zal Ik u verzamelen in Mijn toorn, en in Mijn grimmigheid daar laten liggen en smelten.", "Gen 50:9": "En met hem trokken op, zowel wagens als ruiters; en het was een zeer zwaar leger.", "Mal 4:1": "Want zie, die dag komt, brandend als een oven. Dan zullen alle hoogmoedigen, en ieder die goddeloosheid doet, een stoppel zijn, en de komende dag zal ze in vlam zetten, zegt de HEERE van de heerscharen, Die hun noch wortel, noch tak laten zal.", "2 Kron 19:6": "En hij zei tegen de rechters: Kijk uit wat u doet, want u spreekt geen recht voor de mens, maar voor de HEERE; en Hij is bij u in de rechtszaak.", "1 Sam 27:3": "En David bleef bij Achis in Gath, hij en zijn mannen, ieder met zijn huisgezin; David met zijn beide vrouwen, Ahinoam, de Jizreëlietische, en Abigaïl, de vrouw van Nabal, de Karmelietische.", "Spr 9:18": "Maar hij weet niet dat daar de doden zijn; haar genode gasten zijn in de diepten van het dodenrijk.", "Jes 13:11": "Want Ik zal over de wereld de boosheid bezoeken, en over de goddelozen hun ongerechtigheid; en Ik zal de hoogmoed van de trotsen doen ophouden, en de hovaardij van de tirannen zal Ik vernederen.", "2 Sam 17:11": "Maar ik raad aan dat heel Israël in alle haast bij u wordt verzameld, van Dan tot Berseba toe, talrijk als het zand dat aan de zee is; en dat u zelf mee optrekt in de strijd.", "2 Sam 2:12-32": "Toen trok Abner, de zoon van Ner, uit, met de knechten van Isboseth, de zoon van Saul, van Mahanaim naar Gibeon. Joab, de zoon van Zeruja, en de knechten van David, trokken ook uit; en zij ontmoetten elkaar bij de vijver van Gibeon; en zij bleven zitten, dezen aan deze zijde van de vijver, en die aan gene zijde van de vijver. En Abner zei tegen Joab: Laat de jongens nu opstaan, en voor onze ogen spelen. En Joab zei: Laat hen opstaan.", "1 Sam 17:43": "De Filistijn nu zei tegen David: Ben ik een hond, dat u met stokken naar mij toe komt? En de Filistijn vervloekte David bij zijn goden.", "Hos 9:4": "Zij zullen de Heere geen drankoffers doen van wijn, en die zouden Hem ook niet aangenaam zijn; hun offers zouden voor hen zijn als treurbrood; allen die daarvan zouden eten, zouden onrein worden; want hun brood zal voor henzelf zijn, het zal niet in het huis van de Heere komen.", "Dan 2:35": "Toen werden het ijzer, het leem, het koper, het zilver en het goud tegelijk verbrijzeld, en zij werden als kaf van de dorsvloeren in de zomer, en de wind voerde ze weg, zodat er geen plaats meer voor gevonden werd; maar de steen die het beeld verbrijzeld had, werd tot een grote berg, zodat hij de hele aarde vulde.", "1 Kron 2:16": "En hun zusters waren Zeruja en Abigaïl. De kinderen nu van Zeruja waren Abisai, en Joab, en Asa-el; drie.", "Matt 12:30": "Wie niet met Mij is, die is tegen Mij; en wie niet met Mij verzamelt, die verstrooit.", "2 Sam 22:28": "En U verlost het bedrukte volk; maar Uw ogen zijn tegen de hoogmoedigen, U zult hen vernederen.", "Hand 1:25": "om te ontvangen het lot van deze bediening en van het apostelschap, waarvan Judas afgeweken is om heen te gaan naar zijn eigen plaats.", "Jes 56:10": "Hun wachters zijn allemaal blind, zij weten niets; zij zijn allemaal stomme honden, zij kunnen niet blaffen; zij zijn slaperig, zij liggen neer, zij hebben het sluimeren lief.", "1 Sam 10:12": "Toen antwoordde een man vandaar, en zei: Wie is toch hun vader? Daarom is het een spreekwoord geworden: Is Saul ook onder de profeten?", "Spr 16:25": "Er is een weg, die iemand recht lijkt; maar het einde ervan zijn wegen van de dood.", "Hand 1:18": "Deze nu heeft een akker verworven van het loon van de ongerechtigheid, en voorover vallend is hij middenin opengebarsten, en al zijn ingewanden zijn eruit gestort.", "1 Kron 11:26": "De helden nu van de legers waren: Asahel, de broer van Joab; Elhanan, de zoon van Dodo, van Bethlehem;", "Micha 2:3": "Daarom, zo zegt de HEERE: Zie, Ik bedenk een kwaad over dit geslacht, waaruit u uw halzen niet zult uittrekken, en zo rechtop niet zult gaan; want het zal een boze tijd zijn.", "Matt 13:38-42": "En de akker is de wereld; en het goede zaad, dat zijn de kinderen van het koninkrijk; en het onkruid zijn de kinderen van de boze; En de vijand die het gezaaid heeft, is de duivel; en de oogst is de voleinding van de wereld; en de maaiers zijn de engelen. Zoals dan het onkruid verzameld en met vuur verbrand wordt, zo zal het ook zijn in de voleinding van deze wereld.", "Ezech 3:18-20": "Als Ik tot de goddeloze zeg: U zult zeker sterven, en u waarschuwt hem niet, en spreekt niet, om de goddeloze van zijn goddeloze weg te waarschuwen, opdat u hem in het leven behoudt; die goddeloze zal in zijn ongerechtigheid sterven, maar zijn bloed zal Ik van uw hand eisen. Doch als u de goddeloze waarschuwt, en hij zich van zijn goddeloosheid en van zijn goddeloze weg niet bekeert, zal hij in zijn ongerechtigheid sterven; maar u hebt uw ziel bevrijd. Als ook een rechtvaardige zich van zijn gerechtigheid afkeert, en onrecht doet, en Ik een aanstoot voor zijn gezicht leg, zal hij sterven; omdat u hem niet gewaarschuwd hebt, zal hij in zijn zonde sterven, en zijn gerechtigheden, die hij gedaan heeft, zullen niet gedacht worden; maar zijn bloed zal Ik van uw hand eisen.", "Ps 107:11": "Omdat zij opstandig waren geweest tegen Gods geboden, en de raad van de Allerhoogste onwaardig verworpen hadden.", "Spr 18:3": "Als de goddeloze komt, komt ook de verachting, en met schande smaad.", "2 Sam 23:6": "Maar de mannen van Belial zullen allemaal zijn als doornen, die weggeworpen worden, omdat men ze met de hand niet kan vatten;", "2 Kon 19:1": "En het gebeurde, toen koning Hizkia dat hoorde, dat hij zijn kleren scheurde en zich met een zak bedekte, en naar het huis van de HEERE ging.", "Ezech 24:22": "Dan zult u doen, zoals ik gedaan heb; de bovenlip zult u niet bedekken, en het brood van de mensen zult u niet eten.", "Ef 5:6": "Laat niemand u verleiden met loze woorden; want om deze dingen komt de toorn van God over de kinderen van de ongehoorzaamheid.", "2 Kon 22:19": "Omdat uw hart week geworden is, en u zich voor het aangezicht van de HEERE vernederd hebt, toen u hoorde wat Ik gesproken heb tegen deze plaats en haar inwoners, dat zij tot een verwoesting en vloek zullen worden, en dat u uw kleren gescheurd en voor Mijn aangezicht geweend hebt; zo heb Ik u ook verhoord, spreekt de HEERE.", "1 Tess 1:10": "En om Zijn Zoon uit de hemelen te verwachten, Die Hij uit de doden heeft opgewekt, namelijk Jezus, Die ons verlost van de toekomende toorn.", "Spr 14:19": "De kwaden buigen neer voor de goeden, en de goddelozen voor de poorten van de rechtvaardige.", "Jer 31:29": "In die dagen zullen zij niet meer zeggen: De vaders hebben onrijpe druiven gegeten, en de tanden van de kinderen zijn stomp geworden.", "1 Kron 14:3": "En David nam nog meer vrouwen te Jeruzalem, en David verwekte nog meer zonen en dochters.", "Spr 10:27-31": "De vreze van de HEERE vermeerdert de dagen; maar de jaren van de goddelozen worden verkort. De hoop van de rechtvaardigen is blijdschap; maar de verwachting van de goddelozen zal vergaan. De weg van de HEERE is sterkte voor de oprechte; maar ondergang voor de werkers van ongerechtigheid.", "Ps 119:118": "U vertreedt allen, die van Uw inzettingen afdwalen, want hun bedrog is leugen.", "Gen 2:17": "Maar van de boom van de kennis van goed en kwaad, daarvan mag u niet eten; want op de dag dat u daarvan eet, zult u de dood sterven.", "Jer 8:20-22": "De oogst is voorbij, de zomer is ten einde; nog zijn wij niet verlost. Ik ben gebroken vanwege de breuk van de dochter van mijn volk; ik ga gehuld in het zwart, ontzetting heeft mij aangegrepen. Is er geen balsem in Gilead? Is er geen heelmeester daar? Want waarom is de genezing van de dochter van mijn volk niet gekomen?", "Job 21:7-33": "Waarom leven de goddelozen, worden oud, ja, worden geweldig in vermogen? Hun nakomelingen zijn bestendig bij hen voor hun ogen, en hun spruiten voor hun aangezicht. Hun huizen hebben vrede zonder vrees, en de roede van God is niet op hen.", "2 Sam 2:10": "Veertig jaar was Isboseth, Sauls zoon, oud, toen hij koning werd over Israël; en hij regeerde het tweede jaar; alleen zij die van het huis van Juda waren, volgden David na.", "Matt 25:41": "Dan zal Hij ook zeggen tegen hen die aan de linkerhand zijn: Ga weg van Mij, u vervloekten, in het eeuwige vuur, dat voor de duivel en zijn engelen bereid is.", "2 Sam 4:6": "En zij kwamen daar tot midden in het huis, alsof zij tarwe kwamen halen, en zij sloegen hem in de buik; en Rechab en zijn broer Baëna ontkwamen.", "Luk 13:3": "Ik zeg u: Nee; maar als u zich niet bekeert, zult u allen net zo omkomen.", "Jer 49:12": "Want zo zegt de HEERE: Zie, van hen wier oordeel het niet is de beker te drinken, zullen er helemaal drinken; en zou u dan enigszins ongestraft blijven? U zult niet ongestraft blijven, maar u zult helemaal drinken.", "Ps 64:9": "En hun tong zal hen doen struikelen tegen zichzelf; ieder, die hen ziet, zal wegvluchten.", "Spr 26:23-26": "Brandende lippen en een kwaadaardig hart zijn als een potscherf overtrokken met een laagje zilverschuim. Wie haat draagt, houdt zich anders voor met zijn lippen; maar in zijn binnenste beraamt hij bedrog. Als hij vriendelijk spreekt, geloof hem niet, want zeven gruwelen zijn in zijn hart.", "Matt 10:36": "En zij zullen de vijanden van de mens worden, die zijn huisgenoten zijn.", "Gen 3:16-19": "Tegen de vrouw zei Hij: Ik zal uw smart zeer vermeerderen, namelijk de smart van uw zwangerschap; met smart zult u kinderen baren; en naar uw man zal uw begeerte uitgaan, en hij zal over u heersen. En tegen Adam zei Hij: Omdat u geluisterd hebt naar de stem van uw vrouw, en van die boom hebt gegeten waarvan Ik u geboden had: Daarvan zult u niet eten; is het aardrijk vervloekt om u; en met smart zult u daarvan eten, alle dagen van uw leven. Ook zal het u doornen en distels laten opgroeien, en u zult het gewas van het veld eten.", "1 Sam 10:24": "Toen zei Samuël tegen heel het volk: Ziet u wie de HEERE gekozen heeft? Want er is niemand zoals hij onder heel het volk. Toen juichte heel het volk, en zij zeiden: Leve de koning!", "Ps 89:32": "als zij Mijn inzettingen ontheiligen, en Mijn geboden niet houden;", "1 Petr 4:17": "Want het is de tijd dat het oordeel moet beginnen bij het huis van God; en als het eerst bij ons begint, wat zal dan het einde zijn van hen die het Evangelie van God ongehoorzaam zijn?", "Ps 107:17": "De zotten worden geplaagd om de weg van hun overtreding, en om hun ongerechtigheden;", "Rom 14:23": "Maar hij die twijfelt, is veroordeeld als hij eet, omdat hij niet uit het geloof eet. En alles wat niet uit het geloof is, dat is zonde.", "1 Kon 2:5": "U weet ook zelf wat Joab, de zoon van Zeruja, mij heeft aangedaan, en wat hij heeft gedaan aan de twee legeraanvoerders van Israël, Abner, de zoon van Ner, en Amasa, de zoon van Jether, die hij heeft gedood, en hij heeft krijgsbloed vergoten in vredestijd; en hij heeft krijgsbloed gedaan aan zijn gordel, die om zijn middel was, en aan zijn schoenen, die aan zijn voeten waren.", "Gen 6:3": "Toen zei de HEERE: Mijn Geest zal niet in eeuwigheid twisten met de mens, omdat hij ook vlees is; doch zijn dagen zullen honderdtwintig jaren zijn.", "Joh 3:36": "Wie in de Zoon gelooft, heeft het eeuwige leven; maar wie de Zoon ongehoorzaam is, zal het leven niet zien, maar de toorn van God blijft op hem.", "Luk 23:31": "Want als zij dit doen aan het groene hout, wat zal er dan aan het dorre gebeuren?", "Spr 12:3": "De mens zal niet bevestigd worden door goddeloosheid; maar de wortel van de rechtvaardigen zal niet bewogen worden.", "Jes 8:9": "Verzamel u samen, volken! Toch zult u verbroken worden; en neem het ter ore, allen die in verre landen bent, omgord u, toch zult u verbroken worden; omgord u, toch zult u verbroken worden!", "1 Kron 11:1-3": "Toen kwam heel Israël bijeen bij David in Hebron, en zei: Zie, wij zijn uw gebeente en uw vlees. Zelfs al eerder, toen Saul nog koning was, hebt u Israël uitgeleid en ingeleid; ook heeft de HEERE, uw God, tot u gezegd: U zult Mijn volk Israël weiden, en u zult voorganger zijn over Mijn volk Israël. Ook kwamen alle oudsten van Israël naar de koning in Hebron, en David maakte een verbond met hen te Hebron, voor het aangezicht van de HEERE; en zij zalfden David tot koning over Israël, naar het woord van de HEERE, door de dienst van Samuël.", "Jes 33:14": "De zondaars in Sion zijn verschrikt; beving heeft de huichelaars aangegrepen; zij zeggen: Wie onder ons kan bij een verterend vuur wonen? Wie onder ons kan bij een eeuwige gloed wonen?", "Job 4:8": "Maar zoals ik gezien heb: wie ondeugd ploegen en moeite zaaien, maaien dat ook.", "1 Sam 16:12": "Toen stuurde hij iemand, en liet hem komen; hij nu was roodachtig, en had daarbij mooie ogen en een knap voorkomen; en de HEERE zei: Sta op, zalf hem, want deze is het.", "Klaagl 3:3": "Aleph. Hij heeft Zich zeker tegen mij gewend, Hij heeft Zijn hand de hele dag veranderd.", "2 Sam 2:18-24": "Nu waren daar drie zonen van Zeruja, Joab, en Abisai en Asahel; en Asahel was licht op zijn voeten, als een van de reeën die in het veld zijn. En Asahel jaagde Abner achterna; en hij week niet af, om van achter Abner naar rechts of naar links af te gaan. Toen keek Abner achter zich om, en zei: Bent u dit, Asahel? En hij zei: Ik ben het.", "Jes 33:11": "U gaat met stro zwanger, u zult stoppels baren; uw geest zal u als vuur verslinden.", "Ps 92:8": "Dat de goddelozen groeien als het gras, en al de werkers van de ongerechtigheid bloeien, opdat zij tot in eeuwigheid weggevaagd worden.", "1 Sam 24:16": "Doch de HEERE zal Rechter zijn, en rechtspreken tussen mij en tussen u, en zien daarin, en mijn geschil beslechten, en mij redden uit uw hand.", "Ps 89:21": "Ik heb David, Mijn knecht, gevonden; met Mijn heilige olie heb Ik hem gezalfd;", "2 Tess 1:5-9": "Een bewijs van het rechtvaardige oordeel van God, opdat u waardig geacht wordt voor het Koninkrijk van God, waarvoor u ook lijdt; Aangezien het recht is bij God, verdrukking te vergelden aan hen die u verdrukken; En aan u, die verdrukt wordt, verkwikking te geven met ons, bij de openbaring van de Heere Jezus vanuit de hemel met de engelen van Zijn kracht;", "Joh 1:47": "En Nathanaël zei tegen hem: Kan uit Nazareth iets goeds komen? Filippus zei tegen hem: Kom en zie.", "Spr 28:17": "Een mens, gedrukt door het bloed van iemand, zal naar de kuil toevluchten; men houde hem niet tegen!", "Mark 6:19": "En Herodias had het op hem voorzien, en wilde hem doden, maar kon het niet;", "Jer 13:16": "Geeft eer aan de HEERE, uw God, voor Hij het duister maakt, en voor uw voeten zich stoten aan de schemerende bergen; terwijl u naar licht uitkijkt, en Hij dat tot een schaduw van de dood maakt, en tot diepe duisternis zet.", "Mark 4:25": "Want wie heeft, aan hem zal gegeven worden; en wie niet heeft, van hem zal ook afgenomen worden wat hij heeft.", "Spr 11:5-8": "De gerechtigheid van de oprechte maakt zijn weg recht; maar de goddeloze valt door zijn goddeloosheid. De gerechtigheid van de vromen zal hen redden; maar de trouwelozen worden gevangen in hun eigen verkeerdheid. Als de goddeloze mens sterft, vergaat zijn verwachting; zelfs de allersterkste hoop is vergaan.", "Job 10:14": "Als ik zondig, dan zult U mij in het oog houden, en van mijn misdaad zult U mij niet onschuldig houden.", "Ps 68:7": "Een God, Die de eenzamen zet in een gezin, uitleidt wie in boeien gevangen zitten; maar de afvalligen wonen in het dorre land.", "Dan 2:45": "Daarom hebt u gezien dat uit de berg een steen zonder handen werd afgehouwen, die het ijzer, koper, leem, zilver en goud verbrijzelde; de grote God heeft de koning bekendgemaakt wat hierna gebeuren zal; de droom is dus waar, en de uitleg ervan betrouwbaar.", "Openb 16:2-21": "En de eerste ging heen, en goot zijn schaal uit op de aarde; en er kwam een kwaad en boosaardig gezwel aan de mensen, die het merkteken van het beest hadden, en die zijn beeld aanbaden. En de tweede engel goot zijn schaal uit in de zee, en zij werd bloed als van een dode; en elke levende ziel in de zee stierf. En de derde engel goot zijn schaal uit in de rivieren en in de bronnen van het water; en het water werd bloed.", "1 Kron 3:3": "de vijfde Sefatja, van Abital; de zesde Jithream, van zijn vrouw Egla.", "Ps 2:5": "Dan zal Hij tot hen spreken in Zijn toorn, en in Zijn grimmigheid zal Hij hen verschrikken.", "2 Sam 3:24-27": "Toen ging Joab naar de koning, en zei: Wat hebt u gedaan? Zie, Abner is bij u geweest; waarom hebt u hem laten gaan, zodat hij zomaar is weggegaan? U kent Abner, de zoon van Ner: hij is gekomen om u te bedriegen, en om uw uitgaan en ingaan te weten te komen, ja, om alles te weten te komen wat u doet. Toen Joab bij David wegging, stuurde hij boden achter Abner aan, die hem terughaalden van de put van Sira; maar David wist dat niet.", "Luk 12:47": "En die dienstknecht die de wil van zijn heer geweten heeft, en zich niet klaargemaakt heeft, en ook niet naar zijn wil gehandeld heeft, die zal met veel slagen geslagen worden.", "Ps 107:34": "Het vruchtbare land tot zoute grond, om de boosheid van hen die daarin wonen.", "1 Kon 2:13": "Toen kwam Adonia, de zoon van Haggith, naar Bathseba, de moeder van Salomo; en zij zei: Komt u in vrede? En hij zei: In vrede.", "Job 8:22": "Wie u haten, zullen met schaamte bekleed worden; en de tent van de goddelozen zal er niet meer zijn.", "1 Kron 10:14": "en de HEERE niet gezocht had; daarom doodde Hij hem, en keerde het koninkrijk tot David, de zoon van Isaï.", "1 Kor 3:17": "Als iemand de tempel van God schendt, die zal God schenden; want de tempel van God is heilig, en dat bent u.", "Matt 7:26": "En ieder die deze woorden van Mij hoort en ze niet doet, zal vergeleken worden met een dwaze man, die zijn huis op het zand gebouwd heeft;", "Rom 13:4": "Want zij is Gods dienares, u ten goede. Maar als u kwaad doet, vrees dan; want zij draagt het zwaard niet zonder reden; want zij is Gods dienares, een wreekster tot straf voor hem die kwaad doet.", "1 Kon 11:37": "Zo zal Ik u nemen, en u zult regeren over alles wat uw ziel zal begeren; en u zult koning zijn over Israël.", "Jes 24:18": "En het zal gebeuren: wie voor het geluid van de angst vlucht, die zal in de kuil vallen; en wie uit de kuil opklimt, die zal in de strik gevangen worden; want de sluizen in de hoogte zijn opengedaan, en de fundamenten van de aarde zullen beven.", "Micha 6:13": "zo zal Ik u ook slaan met ziekte, u treffend, en u verwoestend om uw zonden.", "2 Sam 3:28-31": "Toen David dat later hoorde, zei hij: Ik ben onschuldig, en mijn koninkrijk is dat, bij de HEERE, tot in eeuwigheid, aan het bloed van Abner, de zoon van Ner. Het moet blijven op het hoofd van Joab, en op heel het huis van zijn vader; en het mag van het huis van Joab niet ontbreken dat er iemand is die een vloed heeft, of melaats is, of zich aan de kruk moet vasthouden, of door het zwaard valt, of gebrek aan brood heeft! Zo hebben Joab en zijn broer Abisaï Abner doodgeslagen, omdat hij hun broer Asaël te Gibeon in de strijd had gedood.", "Ezech 18:1-32": "Verder kwam het woord van de HEERE tot mij en Hij zei: Wat is er met u, dat u dit spreekwoord gebruikt over het land Israël, en zegt: De vaders hebben onrijpe druiven gegeten, en de tanden van de kinderen zijn stomp geworden? Zo waarachtig als Ik leef, spreekt de Heere HEERE, u zult geen aanleiding meer hebben om dit spreekwoord in Israël te gebruiken!", "Ps 146:9": "De HEERE bewaart de vreemdelingen; Hij houdt de wees en de weduwe staande; maar de weg van de goddelozen keert Hij om.", "2 Sam 19:7": "Zo sta nu op, ga naar buiten, en spreek uw knechten moed in; want ik zweer bij de HEERE: als u niet naar buiten gaat, zal er vannacht niemand bij u blijven! En dat zal erger voor u zijn dan al het kwaad dat u overkomen is vanaf uw jeugd tot nu toe.", "2 Tess 2:8-10": "En dan zal de onrechtvaardige geopenbaard worden, die de Heere zal doden door de Geest van Zijn mond, en teniet zal doen door de verschijning van Zijn komst; hem, zeg ik, wiens komst is naar de werking van de satan, met alle kracht en tekenen en wonderen van de leugen; en met alle verleiding van de onrechtvaardigheid in hen die verloren gaan; omdat zij de liefde voor de waarheid niet aangenomen hebben, om behouden te worden.", "Spr 13:9": "Het licht van de rechtvaardigen zal zich verblijden; maar de lamp van de goddelozen zal uitgeblust worden.", "Ezech 5:4": "En nog zult u daarvan nemen, en dat werpen in het midden van het vuur, en zult ze verbranden met vuur; daaruit zal een vuur voortkomen tegen het hele huis van Israël.", "Matt 15:26": "Maar Hij antwoordde en zei: Het is niet betamelijk het brood van de kinderen te nemen, en het aan de hondjes voor te werpen.", "2 Sam 19:16": "En Simeï, de zoon van Gera, een Benjaminiet, die uit Bahurim was, haastte zich, en kwam met de mannen van Juda naar beneden, koning David tegemoet;", "Luk 7:14": "En Hij kwam erbij en raakte de baar aan; (de dragers stonden toen stil) en Hij zei: Jongeman, Ik zeg u: sta op!", "Deut 31:29": "Want ik weet dat u na mijn dood zeker helemaal zult verdorven raken, en afwijken van de weg die ik u geboden heb; dan zal dit kwaad u in de laatste dagen overkomen, wanneer u zult hebben gedaan wat kwaad is in de ogen van de HEERE, om Hem door het werk van uw handen tot toorn te verwekken.", "Job 15:20-24": "Al zijn dagen doet de goddeloze zichzelf weedom aan; en weinige jaren in getal zijn voor de tiran weggelegd. Het geluid van verschrikkingen is in zijn oren; in de vrede zelf komt de verwoester hem over. Hij gelooft niet uit de duisternis terug te keren, maar dat hij beloerd wordt voor het zwaard.", "Ef 5:5": "Want dit weet u, dat geen hoereerder, of onreine, of hebzuchtige, die een afgodendienaar is, erfenis heeft in het Koninkrijk van Christus en van God.", "Spr 13:21": "Het kwaad zal de zondaars vervolgen; maar de rechtvaardige zal men met goed vergelden.", "Ps 59:9": "Maar U, HEERE, zult hen belachen; U zult alle heidenen bespotten.", "Rom 5:12": "Daarom, zoals door één mens de zonde in de wereld ingekomen is, en door de zonde de dood; en zo de dood tot alle mensen doorgegaan is, doordat allen gezondigd hebben.", "Est 6:13": "En Haman vertelde aan zijn vrouw Zeres en al zijn vrienden alles wat hem overkomen was. Toen zeiden zijn wijzen, en Zeres, zijn vrouw, tegen hem: Als Mordechai, voor wie u begonnen bent te vallen, uit het nageslacht van de Joden is, zult u tegen hem niets kunnen uitrichten; maar u zult zeker voor zijn aangezicht vallen.", "2 Tim 2:13": "als wij ontrouw zijn, blijft Hij trouw; Hij kan Zichzelf niet verloochenen.", "Gen 42:9": "Toen dacht Jozef aan de dromen die hij over hen gedroomd had; en hij zei tegen hen: U bent verspieders, u bent gekomen om te bekijken waar het land onbeschermd is.", "Ps 76:11": "Want de grimmigheid van de mens zal U loffelijk maken; het overblijfsel van de grimmigheden zult U opbinden.", "1 Sam 18:27": "Toen maakte David zich op, en hij en zijn mannen gingen heen, en zij sloegen onder de Filistijnen tweehonderd man, en David bracht hun voorhuiden, en men leverde ze de koning volkomen, opdat hij schoonzoon van de koning zou worden. Toen gaf Saul hem zijn dochter Michal tot vrouw.", "1 Sam 25:3": "En de naam van de man was Nabal, en de naam van zijn vrouw was Abigaïl; en de vrouw was goed van verstand, en mooi van gedaante; maar de man was hard en slecht van daden, en hij was een Kalebiet.", "Pred 2:15": "Daarom zei ik in mijn hart: Zoals het de dwaas vergaat, zal het ook mij vergaan; waarom heb ik dan toen meer naar wijsheid gestreefd? Toen sprak ik in mijn hart, dat ook dat ijdelheid was.", "2 Kon 11:14": "En zij zag toe, en zie, de koning stond bij de pilaar, naar de gewoonte, en de leiders en de trompetten bij de koning; en al het volk van het land was blij en blies op trompetten. Toen scheurde Athalia haar kleren en riep: Verraad, verraad!", "Ezech 20:8": "Maar zij waren opstandig tegen Mij, en wilden naar Mij niet horen; niemand wierp de verfoeisels van zijn ogen weg, en niemand verliet de drekgoden van Egypte; daarom zei Ik dat Ik Mijn grimmigheid over hen zou uitgieten, om Mijn toorn tegen hen te volbrengen midden in Egypteland.", "Hos 9:9": "Zij hebben zich zeer diep verdorven, zoals in de dagen van Gibea; Hij zal aan hun ongerechtigheid denken, Hij zal hun zonden straffen.", "Kol 3:25": "Maar wie onrecht doet, zal het onrecht dragen dat hij gedaan heeft; en er is geen aanneming van het persoon.", "2 Sam 23:7": "maar ieder die ze zal aantasten, voorziet zich met ijzer en het hout van een speer; en zij zullen helemaal met vuur verbrand worden, op dezelfde plaats.", "Matt 21:44": "En wie op deze steen valt, zal verpletterd worden; en op wie hij valt, die zal hij vermorzelen.", "1 Sam 14:44": "Toen zei Saul: Zo moet God mij doen, en nog erger, Jonathan! U moet zeker sterven.", "Openb 9:4-6": "En hun werd gezegd, dat zij het gras van de aarde niet zouden beschadigen, ook geen groente, ook geen boom, dan de mensen alleen, die het zegel van God niet aan hun voorhoofden hebben. En hun werd macht gegeven, niet dat zij hen zouden doden, maar dat zij door hen gepijnigd zouden worden vijf maanden; en hun pijniging was als de pijniging van een schorpioen, wanneer hij een mens gestoken heeft. En in die dagen zullen de mensen de dood zoeken, en zullen die niet vinden; en zij zullen ernaar verlangen te sterven, en de dood zal van hen wegvluchten.", "Joh 12:40": "Hij heeft hun ogen verblind, en hun hart verhard; opdat zij met de ogen niet zien, en met het hart niet verstaan, en zij zich bekeren, en Ik hen genees.", "Ps 7:17": "Zijn moeite zal op zijn eigen hoofd terugkeren, en zijn geweld op zijn eigen schedel neerdalen.", "Ezech 5:8-17": "Daarom zegt de Heere HEERE zo: Zie, Ik wil tegen u, ja Ik, want Ik zal gerichten in het midden van u oefenen, voor de ogen van die heidenvolken. En Ik zal onder u doen, wat Ik niet gedaan heb, en zoals Ik voortaan niet meer doen zal, vanwege al uw gruwelen. Daarom zullen de vaders de kinderen eten in het midden van u, en de kinderen zullen hun vaders eten; en Ik zal gerichten onder u oefenen, en al uw overblijfsel zal Ik naar alle windrichtingen verstrooien.", "2 Sam 9:8": "Toen boog hij zich neer, en zei: Wat is uw knecht, dat u omgezien hebt naar een dode hond, zoals ik ben?", "1 Kron 11:3": "Ook kwamen alle oudsten van Israël naar de koning in Hebron, en David maakte een verbond met hen te Hebron, voor het aangezicht van de HEERE; en zij zalfden David tot koning over Israël, naar het woord van de HEERE, door de dienst van Samuël.", "Spr 13:25": "De rechtvaardige eet tot verzadiging van zijn ziel toe; maar de buik van de goddelozen zal gebrek hebben.", "1 Kon 14:30": "En er was oorlog tussen Rehabeam en Jerobeam, al hun dagen.", "1 Kron 12:38-40": "Al deze krijgslieden, die zich in slagorde konden houden, kwamen met een volkomen hart naar Hebron om David koning te maken over heel Israël. En ook heel de rest van Israël was één van hart om David tot koning te maken. En zij waren daar bij David drie dagen lang, etend en drinkend; want hun broeders hadden voor hen iets toebereid. En ook degenen die dicht bij hen woonden, tot aan Issaschar, en Zebulon, en Nafthali, brachten brood op ezels, en op kamelen, en op muildieren, en op runderen, meel, klompen gedroogde vijgen, en rozijnenkoeken, en wijn, en olie, en runderen, en kleinvee in overvloed; want er was blijdschap in Israël.", "Mark 12:1-9": "En Hij begon door gelijkenissen tegen hen te spreken: Een man plantte een wijngaard, en zette er een omheining omheen, en groef een wijnpersbak, en bouwde een toren, en verhuurde hem aan de wijnbouwers, en reisde naar het buitenland. En toen het de tijd was, stuurde hij een dienaar naar de wijnbouwers, opdat hij van de wijnbouwers iets van de vrucht van de wijngaard zou ontvangen. Maar zij grepen hem, en sloegen hem, en stuurden hem met lege handen weg.", "Job 8:7": "Uw begin zal wel gering zijn geweest, maar uw einde zal zeer toenemen.", "Matt 21:8-10": "En de meeste van de menigte spreidden hun kleren op de weg, en anderen hakten takken van de bomen en spreidden ze op de weg. En de menigten die voor Hem uit gingen en die volgden, riepen: Hosanna, de Zoon van David! Gezegend is Hij Die komt in de Naam van de Heere! Hosanna in de hoogste hemelen! En toen Hij Jeruzalem binnenkwam, raakte de hele stad in opschudding en men zei: Wie is Deze?", "1 Kor 15:33": "Dwaal niet. Slechte omgang bederft goede zeden.", "1 Petr 3:12": "Want de ogen van de Heere zijn over de rechtvaardigen, en Zijn oren gericht op hun gebed; maar het aangezicht van de Heere is tegen hen die kwaad doen.", "Openb 19:15": "En uit Zijn mond ging een scherp zwaard, opdat Hij daarmee de heidenen slaan zou. En Hij zal hen hoeden met een ijzeren staf; en Hij treedt de wijnpersbak van de wijn van de toorn en van de gramschap van de Almachtige God.", "Spr 29:16": "Als de goddelozen talrijk worden, wordt de overtreding groot; maar de rechtvaardigen zullen hun val aanschouwen.", "2 Sam 3:27-39": "Toen Abner naar Hebron terugkwam, nam Joab hem apart in het midden van de poort om in stilte met hem te spreken; en hij sloeg hem daar onder de vijfde rib, zodat hij stierf, vanwege het bloed van zijn broer Asaël. Toen David dat later hoorde, zei hij: Ik ben onschuldig, en mijn koninkrijk is dat, bij de HEERE, tot in eeuwigheid, aan het bloed van Abner, de zoon van Ner. Het moet blijven op het hoofd van Joab, en op heel het huis van zijn vader; en het mag van het huis van Joab niet ontbreken dat er iemand is die een vloed heeft, of melaats is, of zich aan de kruk moet vasthouden, of door het zwaard valt, of gebrek aan brood heeft!", "Rom 5:21": "Opdat, zoals de zonde geheerst heeft tot de dood, zo ook de genade zou heersen door rechtvaardigheid tot het eeuwige leven, door Jezus Christus onze Heere.", "1 Kor 15:21": "Want omdat de dood door een mens is, is ook de opstanding van de doden door een Mens.", "Job 32:9": "De groten zijn niet altijd wijs, en de ouden verstaan het recht niet.", "Hos 7:13": "Wee hen, want zij zijn van Mij afgezworven; verwoesting over hen, want zij hebben tegen Mij overtreden! Ik zou hen wel verlossen, maar zij spreken leugens tegen Mij.", "1 Joh 3:14": "Wij weten dat wij overgegaan zijn uit de dood in het leven, omdat wij de broeders liefhebben; wie zijn broeder niet liefheeft, blijft in de dood.", "Matt 13:30": "Laat ze beide samen opgroeien tot de oogst, en in de tijd van de oogst zal ik tegen de maaiers zeggen: Verzamel eerst het onkruid, en bind het in bundels om het te verbranden; maar breng de tarwe samen in mijn schuur.", "Hos 6:9": "Zoals de benden van straatrovers op iemand wachten, zo is het gezelschap van de priesters; zij moorden op de weg naar Sichem, waarlijk, zij doen schandelijke daden.", "Mark 8:36": "Want wat zou het de mens baten als hij de hele wereld zou winnen, en schade zou lijden aan zijn ziel?", "Ps 37:34-38": "Koph. Wacht op de HEERE, en houd Zijn weg, en Hij zal u verhogen om de aarde erfelijk te bezitten; u zult zien dat de goddelozen worden uitgeroeid. Resch. Ik heb een geweldenaar gezien, een goddeloze, die zich uitbreidde als een groene inlandse boom. Maar hij ging voorbij, en zie, hij was er niet meer; en ik zocht hem, maar hij werd niet gevonden.", "Ex 21:12": "Wie iemand slaat, zodat hij sterft, die zal zeker gedood worden.", "Ezech 24:14": "Ik, de HEERE, heb het gesproken; het zal komen, en Ik zal het doen; Ik zal er niet van wijken, en Ik zal niet sparen, en geen berouw hebben; naar uw wegen en naar uw daden zullen zij u oordelen, spreekt de Heere HEERE.", "1 Kon 2:21": "En zij zei: Laat Abisag, de Sunamitische, aan Adonia, uw broer, tot vrouw gegeven worden.", "Deut 21:1-9": "Wanneer in het land, dat de HEERE, uw God, u geven zal om dat te erven, iemand gevonden wordt die gedood is, liggend in het veld, zonder dat bekend is wie hem gedood heeft; Dan zullen uw oudsten en uw rechters uitgaan, en zij zullen meten naar de steden die rondom de gedode liggen. De stad nu die het dichtst bij de gedode ligt, daar zullen de oudsten van die stad een jonge koe nemen waarmee niet gewerkt is, die aan het juk niet getrokken heeft.", "2 Sam 15:13": "Toen kwam er een boodschapper naar David, en zei: Het hart van ieder in Israël volgt Absalom na.", "Matt 13:50": "En zij zullen hen in de vurige oven werpen; daar zal geween zijn en het geknars van de tanden.", "Spr 11:19": "Zo is de gerechtigheid ten leven, zoals wie het kwade najaagt, naar zijn eigen dood jaagt.", "Klaagl 4:22": "Thau. Uw ongerechtigheid heeft een einde, o dochter van Sion! Hij zal u niet meer gevangen laten wegvoeren; maar uw ongerechtigheid, o dochter van Edom! zal Hij bezoeken; Hij zal uw zonden aan het licht brengen.", "1 Sam 27:8": "David nu trok op met zijn mannen, en zij overvielen de Gesurieten, en de Girzieten, en de Amalekieten (want dezen zijn van oude tijden af de inwoners van het land geweest), op de weg naar Sur, tot aan Egypteland.", "Openb 6:15-17": "En de koningen van de aarde, en de groten, en de rijken, en de leiders over duizend, en de machtigen, en alle dienstknechten, en alle vrijen, verborgen zichzelf in de spelonken, en in de steenrotsen van de bergen; En zeiden tot de bergen en tot de steenrotsen: Valt op ons, en verbergt ons van het aangezicht van Hem Die op de troon zit, en van de toorn van het Lam. Want de grote dag van Zijn toorn is gekomen, en wie kan bestaan?", "2 Sam 1:12": "En zij weeklaagden, en weenden, en vastten tot de avond, over Saul en over Jonathan, zijn zoon, en over het volk van de HEERE, en over het huis van Israël, omdat zij door het zwaard gevallen waren.", "Job 15:28-30": "En heeft verdelgde steden bewoond, en huizen die men niet bewoonde, die gereed waren om een puinhoop te worden. Hij zal niet rijk worden, en zijn vermogen zal niet bestaan; en hun volmaaktheid zal zich niet uitbreiden op de aarde. Hij zal van de duisternis niet ontwijken, de vlam zal zijn scheut verdrogen; hij zal wijken door het geblaas van zijn mond.", "Matt 3:12": "Zijn wan is in Zijn hand, en Hij zal Zijn dorsvloer helemaal zuiveren, en Zijn tarwe in Zijn schuur samenbrengen, en Hij zal het kaf met onblusbaar vuur verbranden.", "Ezech 24:17": "Houd stil met kermen, u zult geen dodenrouw bedrijven, bind uw hoofddeksel op u, en doe uw schoenen aan uw voeten; en de bovenlip zult u niet bedekken, en het brood van de mensen zult u niet eten.", "Amos 9:1-5": "Ik zag de Heere staan op het altaar, en Hij zei: Sla die knop, zodat de posten beven, en kloof ze allen in het hoofd; en Ik zal hun achterste met het zwaard doden; wie van hen probeert te vluchten, zal niet ontkomen, en wie van hen probeert te ontkomen, zal niet gered worden. Al groeven zij tot in het graf, dan zal Mijn hand ze vandaar halen, en al klommen zij in de hemel, dan zal Ik ze vandaar doen neerdalen. En al verstopten zij zich op de top van de Karmel, dan zal Ik ze opsporen en vandaar halen; en al verborgen zij zich voor Mijn ogen op de bodem van de zee, dan zal Ik vandaar de slang gebieden, die zal ze bijten.", "Luk 6:49": "Maar wie het gehoord heeft en het niet gedaan heeft, is als een mens die een huis bouwde op de aarde zonder fundament; de waterstroom sloeg ertegen aan, en het viel meteen om, en de val van dat huis was groot.", "Matt 10:35": "Want Ik ben gekomen om de mens tweedrachtig te maken tegen zijn vader, en de dochter tegen haar moeder, en de schoondochter tegen haar schoonmoeder.", "Deut 28:15-68": "Daarentegen zal het gebeuren, als u niet naar de stem van de HEERE, uw God, luistert, om op te letten dat u al Zijn geboden en Zijn inzettingen doet, die ik u heden gebied; zo zullen al deze vloeken over u komen, en u treffen. Vervloekt zult u zijn in de stad, en vervloekt zult u zijn op het veld. Vervloekt zal zijn uw korf, en uw baktrog.", "1 Kron 3:1": "Dit waren de kinderen van David die hem in Hebron geboren zijn: de eerstgeborene Amnon, van Ahinoam, de Jizreëlietische; de tweede Daniël, van Abigaïl, de Karmelietische;", "Spr 3:33": "De vloek van de HEERE is in het huis van de goddeloze; maar de woning van de rechtvaardigen zal Hij zegenen.", "Mal 3:17": "En zij zullen, zegt de HEERE van de heerscharen, op die dag, die Ik maken zal, Mij een eigendom zijn; en Ik zal hen verschonen, zoals een man zijn zoon verschoont, die hem dient.", "Ps 37:9": "Want de boosdoeners zullen uitgeroeid worden, maar wie de HEERE verwachten, die zullen de aarde erfelijk bezitten.", "Hos 7:12": "Wanneer zij zullen heengaan, zal Ik Mijn net over hen uitspreiden, Ik zal ze als vogels van de hemel doen neerdalen. Ik zal ze tuchtigen, zoals gehoord is in hun samenkomst.", "1 Kron 12:23": "En dit zijn de aantallen van de aanvoerders van hen die toegerust waren voor het leger, die naar David te Hebron kwamen om het koninkrijk van Saul aan hem over te dragen, naar het woord van de HEERE:", "Ps 18:15": "En Hij zond Zijn pijlen uit, en verstrooide ze; en Hij vermenigvuldigde de bliksemen, en verschrikte ze.", "Jer 16:7": "Ook zal men hun niets uitdelen bij de rouw, om iemand te troosten over een dode; noch hun te drinken geven uit de troostbeker, vanwege iemands vader of moeder.", "Matt 11:23": "En u, Kapernaüm! Die tot de hemel toe verhoogd bent, u zult tot de hel toe neergestoten worden. Want als in Sodom die krachten gebeurd waren die in u gebeurd zijn, zouden zij tot op deze huidige dag gebleven zijn.", "Joh 7:47": "De Farizeeën antwoordden hun dan: Bent ook u verleid?", "Ps 68:3": "U zult hen verdrijven, zoals rook verdreven wordt; zoals was voor het vuur smelt, zullen de goddelozen vergaan van Gods aangezicht.", "Spr 21:12": "De rechtvaardige let verstandig op het huis van de goddeloze, als God de goddelozen in het kwaad stort.", "1 Kor 5:5": "Hem over te geven aan de satan, tot verderf van het vlees, opdat de geest behouden mag worden op de dag van de Heere Jezus.", "Jes 56:11": "En deze honden zijn sterk van begeerte, zij kunnen niet verzadigd worden, ja, het zijn herders die niets kunnen begrijpen; zij keren zich allemaal naar hun eigen weg, ieder naar zijn eigen winst, elk uit zijn eigen hoek.", "Joz 7:6": "Toen scheurde Jozua zijn kleren, en viel op zijn gezicht ter aarde, voor de ark van de HEERE, tot de avond toe, hij en de oudsten van Israël; en zij wierpen stof op hun hoofd.", "Ps 89:5": "Ik zal uw zaad tot in eeuwigheid bevestigen, en uw troon opbouwen van geslacht tot geslacht. Sela.", "Luk 3:17": "Zijn wan is in Zijn hand, en Hij zal Zijn dorsvloer grondig reinigen, en de tarwe zal Hij in Zijn schuur samenbrengen; maar het kaf zal Hij met onblusbaar vuur verbranden.", "Hand 9:4": "en hij viel op de grond en hoorde een stem, die tegen hem zei: Saul, Saul, waarom vervolgt u Mij?", "Ezech 12:22": "Mensenkind, wat is dit voor een spreekwoord dat u hebt in het land Israël, namelijk: de dagen worden verlengd, en elk visioen vervalt?", "Rom 2:8": "Maar hun die twistgierig zijn, en die de waarheid ongehoorzaam zijn, maar de ongerechtigheid gehoorzaam zijn, zal verbolgenheid en toorn vergolden worden;", "2 Sam 2:32": "En zij namen Asahel op, en begroeven hem in het graf van zijn vader, dat te Bethlehem was. Joab nu en zijn mannen gingen de hele nacht, tot het licht hun aanbrak te Hebron.", "1 Kron 12:38": "Al deze krijgslieden, die zich in slagorde konden houden, kwamen met een volkomen hart naar Hebron om David koning te maken over heel Israël. En ook heel de rest van Israël was één van hart om David tot koning te maken.", "Gal 5:17": "Want het vlees begeert tegen de Geest, en de Geest tegen het vlees; en die staan tegenover elkaar, zodat u niet doet wat u zou willen.", "Spr 4:19": "De weg van de goddelozen is als donkerheid; zij weten niet, waarover zij zullen struikelen.", "1 Kon 16:21": "Toen werd het volk van Israël verdeeld in twee helften; de helft van het volk volgde Tibni, de zoon van Ginath, om hem koning te maken; en de andere helft volgde Omri.", "Ps 34:17": "Pe. Het aangezicht van de HEERE is tegen hen die kwaad doen, om hun gedachtenis van de aarde uit te roeien.", "Spr 10:6-8": "Zegeningen zijn op het hoofd van de rechtvaardige; maar het geweld bedekt de mond van de goddelozen. De gedachtenis aan de rechtvaardige zal tot zegening zijn; maar de naam van de goddelozen zal wegrotten. Wie wijs van hart is, neemt de geboden aan; maar wie dwaas is van lippen, zal ten val komen.", "Ps 107:10": "Die in duisternis en de schaduw van de dood zaten, gebonden met verdrukking en ijzer;", "Ps 37:1": "Een psalm van David. Aleph. Wind u niet op over de boosdoeners; benijd hen niet die onrecht doen.", "Richt 9:56": "Zo liet God het kwaad van Abimelech, dat hij aan zijn vader gedaan had door zijn zeventig broers te doden, op hem terugkomen.", "Spr 10:24": "Wat de goddeloze vreest, dat zal hem overkomen; maar wat de rechtvaardigen verlangen, zal God geven.", "Rom 8:6": "Want het bedenken van het vlees is de dood, maar het bedenken van de Geest is leven en vrede.", "Deut 30:15": "Zie, ik heb u heden voorgesteld het leven en het goede, en de dood en het kwade.", "1 Sam 30:4": "Toen verhieven David en het volk dat bij hem was hun stem, en huilden, tot er geen kracht meer in hen was om te huilen.", "Ps 55:20": "God zal horen, en zal hen vernederen, Hij die van oudsher zit, Sela; omdat er bij hen helemaal geen verandering is, en zij God niet vrezen.", "1 Sam 25:43": "Ook nam David Ahinoam van Jizreël; zo werden ook die beiden hem tot vrouwen.", "1 Tim 5:24": "Van sommige mensen zijn de zonden al vooraf openbaar, en gaan vooruit tot hun veroordeling; en bij sommigen komen zij later aan het licht.", "Ps 94:13": "Om hem rust te geven van de kwade dagen; totdat de kuil voor de goddeloze gegraven wordt.", "Matt 12:33": "Of maak de boom goed en zijn vrucht goed; of maak de boom slecht en zijn vrucht slecht; want aan de vrucht wordt de boom gekend.", "Ps 94:23": "En Hij zal hun ongerechtigheid op hen doen terugkeren, en Hij zal hen in hun boosheid verdelgen; de HEERE, onze God, zal hen verdelgen.", "Hos 10:8": "En de hoogten van Aven, Israëls zonde, zullen vernietigd worden; doorns en distels zullen op hun altaren opkomen; en zij zullen tegen de bergen zeggen: Bedek ons! en tegen de heuvels: Val op ons!", "Openb 9:15": "En de vier engelen zijn losgemaakt, die gereed waren gehouden tegen het uur, en dag, en maand, en jaar, opdat zij het derde deel van de mensen zouden doden.", "Ruth 1:17": "Waar u zult sterven, zal ik sterven, en daar zal ik begraven worden; zo doe mij de HEERE en zo doe Hij daar nog aan toe, als niet de dood alléén scheiding zal maken tussen mij en u!", "Job 31:28": "Dat ware ook een misdaad bij de rechter; want ik zou de God van boven verzaakt hebben.", "Spr 2:22": "Maar de goddelozen zullen van de aarde uitgeroeid worden, en de trouwelozen zullen eruit weggerukt worden.", "Matt 7:13": "Ga in door de nauwe poort; want wijd is de poort, en breed is de weg die naar het verderf leidt, en velen zijn er die daardoor ingaan.", "Ps 2:4": "Die in de hemel woont, zal lachen; de Heere zal hen bespotten.", "2 Sam 21:17": "Maar Abisai, de zoon van Zeruja, hielp hem, en sloeg de Filistijn, en doodde hem. Toen zwoeren de mannen van David hem, en zeiden: U zult niet meer met ons uittrekken ten strijde, zodat u de lamp van Israël niet uitblust.", "Openb 14:9-11": "En een derde engel is hen gevolgd, die met luide stem zei: Als iemand het beest aanbidt en zijn beeld, en het merkteken ontvangt aan zijn voorhoofd, of aan zijn hand, die zal ook drinken uit de wijn van de toorn van God, die onvermengd ingeschonken is in de drinkbeker van Zijn toorn; en hij zal gepijnigd worden met vuur en zwavel voor de heilige engelen en voor het Lam. En de rook van hun pijniging gaat op tot in alle eeuwigheid, en zij hebben geen rust, dag en nacht, zij die het beest aanbidden en zijn beeld, en zo iemand het merkteken van zijn naam ontvangt.", "Gen 4:10": "En Hij zei: Wat hebt u gedaan? Daar is een stem van het bloed van uw broeder, die tot Mij roept vanuit de aardbodem.", "Spr 10:25": "Zoals een wervelwind voorbijgaat, zo is de goddeloze niet meer; maar de rechtvaardige is een eeuwig fundament.", "Hos 9:15": "Al hun slechtheid is in Gilgal, want daar heb Ik ze gehaat, om de slechtheid van hun daden; Ik zal ze uit Mijn huis verdrijven, Ik zal ze voortaan niet meer liefhebben; al hun vorsten zijn afvalligen.", "Jes 10:3": "Maar wat zult u doen op de dag van de bezoeking, en van de verwoesting, die van verre komen zal? Naar wie zult u vluchten om hulp, en waar zult u uw heerlijkheid laten?", "Ps 89:36-38": "Ik heb eens gezworen bij Mijn heiligheid: Zeker zal Ik aan David niet liegen! Zijn zaad zal in eeuwigheid zijn, en zijn troon zal voor Mij zijn als de zon. Hij zal eeuwig bevestigd worden, als de maan; en de Getuige in de hemel is getrouw. Sela.", "2 Kon 10:23": "En Jehu kwam met Jonadab, de zoon van Rechab, in het huis van Baäl; en hij zei tot de dienaren van Baäl: Onderzoekt, en kijkt goed toe, dat hier misschien niemand bij u is van de dienaren van de HEERE, maar alleen van de dienaren van Baäl.", "Spr 11:31": "Zie, de rechtvaardige wordt vergolden op de aarde, hoeveel te meer de goddeloze en de zondaar!", "1 Kron 3:1-4": "Dit waren de kinderen van David die hem in Hebron geboren zijn: de eerstgeborene Amnon, van Ahinoam, de Jizreëlietische; de tweede Daniël, van Abigaïl, de Karmelietische; de derde Absalom, de zoon van Maächa, de dochter van Thalmai, de koning van Gesur; de vierde Adonia, de zoon van Haggith; de vijfde Sefatja, van Abital; de zesde Jithream, van zijn vrouw Egla.", "Ps 109:8-19": "Laat zijn dagen weinig zijn; een ander neemt zijn ambt; Laat zijn kinderen wezen worden, en zijn vrouw weduwe. En laat zijn kinderen hier en daar omzwerven, en bedelen, en de nooddruft uit hun verwoeste plaatsen zoeken.", "2 Sam 20:10": "En Amasa lette niet op het zwaard dat in Joabs hand was; zo sloeg hij hem daarmee aan de vijfde rib, en hij stortte zijn ingewanden op de aarde uit, en hij sloeg hem niet ten tweeden male, en hij stierf. Toen jaagden Joab en zijn broeder Abisai Seba, de zoon van Bichri, achterna.", "2 Kor 7:10": "Want de droefheid naar God werkt een onberouwelijke bekering tot zaligheid; maar de droefheid van de wereld werkt de dood.", "Jes 5:24": "Daarom, zoals de tong van het vuur de stoppel verteert, en het kaf door de vlam verteerd wordt, zo zal hun wortel als verrotting zijn; en hun bloesem zal als stof opstijgen; omdat zij de wet van de HEERE van de heerscharen verwerpen, en het woord van de Heilige van Israël versmaden.", "Job 2:12": "En toen zij hun ogen van verre opsloegen, herkenden zij hem niet, en zij verhieven hun stem en weenden; daarbij scheurden zij ieder hun mantel, en strooiden stof op hun hoofden, omhoog naar de hemel.", "Ps 75:9": "Want in de hand van de HEERE is een beker, en de wijn is beroerd, vol van mengeling, en Hij schenkt daaruit; doch alle goddelozen van de aarde zullen zijn droesems drinken, terwijl ze die uitzuigen.", "Ef 6:12": "Want wij hebben de strijd niet tegen vlees en bloed, maar tegen de overheden, tegen de machten, tegen de geweldhebbers van de wereld, van de duisternis van deze eeuw, tegen de geestelijke boosheden in de lucht.", "Hand 3:23": "En het zal gebeuren dat iedere ziel die niet naar deze Profeet zal hebben geluisterd, uitgeroeid zal worden uit het volk.", "1 Kon 2:31-34": "En de koning zei tegen hem: Doe zoals hij gesproken heeft, en val op hem aan, en begraaf hem, zodat u van mij en van het huis van mijn vader wegneemt het bloed dat Joab zonder reden vergoten heeft. Zo zal de HEERE zijn bloed op zijn eigen hoofd doen terugkeren, omdat hij twee mannen heeft aangevallen die rechtvaardiger en beter waren dan hij, en hen met het zwaard gedood heeft, terwijl mijn vader David het niet wist: Abner, de zoon van Ner, de legeraanvoerder van Israël, en Amasa, de zoon van Jether, de legeraanvoerder van Juda. Zo zal hun bloed terugkeren op het hoofd van Joab, en op het hoofd van zijn nakomelingen voor eeuwig; maar David, en zijn nakomelingen, en zijn huis, en zijn troon zal vrede hebben van de HEERE tot in eeuwigheid.", "Mark 4:12": "opdat zij ziende zien, en niet opmerken; en horende horen, en niet verstaan; opdat zij zich niet op enig moment bekeren en hun de zonden vergeven worden.", "1 Sam 29:4-6": "Maar de leiders van de Filistijnen werden zeer toornig op hem, en de leiders van de Filistijnen zeiden tegen hem: Laat de man teruggaan, zodat hij naar zijn plaats teruggaat, waar u hem hebt gesteld, en dat hij niet met ons meetrekt in de strijd, opdat hij niet een tegenstander voor ons wordt in de strijd; want waarmee zou hij zich bij zijn heer aangenaam kunnen maken? Is het niet met de hoofden van deze mannen? Is dit niet die David, over wie zij in de rei tegen elkaar antwoordden en zeiden: Saul heeft zijn duizenden geslagen, maar David zijn tienduizenden? Toen riep Achis David en zei tegen hem: Zo waar als de HEERE leeft, dat u oprecht bent, en uw uitgaan en uw ingaan met mij in het leger is goed in mijn ogen; want ik heb geen kwaad bij u gevonden, vanaf de dag dat u tot mij gekomen bent, tot op deze dag; maar u bent niet aangenaam in de ogen van de vorsten.", "Ezech 18:2-4": "Wat is er met u, dat u dit spreekwoord gebruikt over het land Israël, en zegt: De vaders hebben onrijpe druiven gegeten, en de tanden van de kinderen zijn stomp geworden? Zo waarachtig als Ik leef, spreekt de Heere HEERE, u zult geen aanleiding meer hebben om dit spreekwoord in Israël te gebruiken! Zie, alle zielen zijn van Mij; zoals de ziel van de vader, zo is ook de ziel van de zoon van Mij; de ziel die zondigt, die zal sterven.", "Luk 16:22-28": "En het gebeurde dat de bedelaar stierf, en door de engelen gedragen werd in de schoot van Abraham; en de rijke stierf ook, en werd begraven. En toen hij in de hel zijn ogen ophief, terwijl hij in de pijn was, zag hij Abraham van verre, en Lazarus in zijn schoot. En hij riep en zei: Vader Abraham, ontferm u over mij, en zend Lazarus, dat hij het uiterste puntje van zijn vinger in het water dompelt, en mijn tong verkoelt; want ik lijd pijn in deze vlam.", "Rom 6:16": "Weet u niet dat aan wie u uzelf ter beschikking stelt als dienstknechten tot gehoorzaamheid, u dienstknechten bent van hem die u gehoorzaamt, óf van de zonde tot de dood, óf van de gehoorzaamheid tot gerechtigheid?", "Matt 7:23": "En dan zal Ik hun openlijk zeggen: Ik heb u nooit gekend; ga weg van Mij, u die de ongerechtigheid werkt!", "Joh 17:12": "Toen Ik met hen in de wereld was, bewaarde Ik hen in Uw Naam. Hen die U Mij gegeven hebt, heb Ik bewaard, en niemand van hen is verloren gegaan, dan de zoon van het verderf, opdat de Schrift vervuld wordt.", "Matt 10:28": "En weest niet bang voor hen die het lichaam doden, en de ziel niet kunnen doden; maar vreest veel meer Hem, Die zowel ziel als lichaam kan verderven in de hel.", "Spr 14:12": "Er is een weg die iemand recht schijnt; maar het einde ervan is de weg van de dood.", "2 Kon 5:1": "Naäman nu, de legeraanvoerder van de koning van Syrië, was een groot man voor het aangezicht van zijn heer, en van hoog aanzien; want door hem had de HEERE de Syriërs verlossing gegeven; zo was deze man een strijdbaar held, doch melaats.", "Rom 9:22": "En wat nu, als God, terwijl Hij Zijn toorn wilde bewijzen en Zijn macht bekend wilde maken, met veel geduld de vaten van de toorn verdragen heeft, die klaargemaakt zijn tot verderf;", "Ps 37:10": "Vau. En nog een korte tijd, en de goddeloze zal er niet zijn; en u zult goed opletten op zijn plaats, maar hij zal er niet zijn.", "Spr 16:4": "De HEERE heeft alles gemaakt om Zichzelf; ja, ook de goddeloze tot de dag van het kwaad.", "Hos 13:3": "Daarom zullen zij zijn als een morgenwolk, en als een vroege dauw, die heengaat; als kaf van de dorsvloer, en als rook uit de schoorsteen, weggejaagd door de wind.", "Luk 20:18": "Ieder die op die steen valt, zal verpletterd worden, en op wie hij valt, die zal hij vermorzelen.", "Jes 3:11": "Wee de goddeloze, het zal hem kwalijk gaan, want de vergelding van zijn handen zal hem overkomen.", "2 Sam 1:11": "Toen greep David zijn kleren en scheurde ze; evenzo ook al de mannen die met hem waren.", "Joz 1:16-18": "Toen antwoordden zij Jozua: Alles wat u ons geboden hebt, zullen wij doen, en overal waar u ons zenden zult, zullen wij gaan. Zoals wij in alles naar Mozes geluisterd hebben, zo zullen wij naar u luisteren; alleen dat de HEERE, uw God, met u is, zoals Hij met Mozes geweest is! Elke man die uw mond opstandig zal zijn, en uw woorden niet horen zal in alles wat u hem gebieden zult, die zal gedood worden; wees alleen sterk en heb goede moed!", "1 Sam 16:13": "Toen nam Samuël de oliehoorn, en zalfde hem te midden van zijn broers. En de Geest van de HEERE kwam vanaf die dag over David, en bleef. Daarna stond Samuël op, en ging naar Rama.", "Richt 11:35": "En het gebeurde, toen hij haar zag, dat hij zijn kleren scheurde, en zei: Ach, mijn dochter! U hebt mij helemaal terneergeslagen, en u bent onder degenen die mij in het ongeluk storten; want ik heb mijn mond opengedaan tegen de HEERE, en ik kan niet terug.", "Ps 28:5": "Omdat zij niet letten op de daden van de HEERE, en ook niet op het werk van Zijn handen, zal Hij hen afbreken en niet meer opbouwen.", "2 Sam 17:1-14": "Verder zei Achitofel tegen Absalom: Laat mij nu twaalfduizend man uitkiezen, dan sta ik op en jaag David deze nacht achterna. Zo zal ik hem overvallen terwijl hij moe en slap van handen is, en zal hem schrik aanjagen; en al het volk dat bij hem is zal vluchten; dan zal ik de koning alleen doden. En ik zal al het volk naar u laten terugkeren; de man die u zoekt, is gelijk aan het terugkeren van allen; zo zal al het volk in vrede zijn.", "2 Sam 18:33": "Toen raakte de koning zeer ontroerd, en ging naar boven, naar de bovenzaal boven de poort, en huilde; en al gaande zei hij dit: Mijn zoon Absalom, mijn zoon, mijn zoon Absalom! Was ik maar, was ik maar in uw plaats gestorven, Absalom, mijn zoon, mijn zoon!", "Hos 12:15": "Efraïm daarentegen heeft Hem zeer bitter vertoornd; daarom zal Hij zijn bloed op hem laten komen, en zijn Heere zal hem zijn smaad vergelden.", "Deut 11:26": "Zie, ik stel u heden voor: zegen en vloek:", "Hos 4:9": "Daarom, zoals het volk, zo zal de priester zijn; en Ik zal zijn wegen aan hem bezoeken¹, en zijn daden hem vergelden.", "Spr 27:4-6": "Grimmigheid en overloping van toorn is wreedheid; maar wie zal voor jaloezie standhouden? Openbare bestraffing is beter dan verborgen liefde. De wonden van hem die liefheeft, zijn trouw; maar de kussen van hem die haat, zijn te verafschuwen.", "Deut 30:19": "Ik neem heden tegen u de hemel en de aarde tot getuigen; het leven en de dood heb ik u voorgesteld, de zegen en de vloek! Kies dan het leven, opdat u leeft, u en uw nageslacht;", "Gen 44:23": "Toen zei u tegen uw knechten: Als uw kleinste broer niet met u meekomt, zult u mijn gezicht niet meer zien.", "Gen 26:30": "Toen maakte hij voor hen een maaltijd, en zij aten en dronken.", "Ps 36:13": "Daar zijn de werkers van de ongerechtigheid gevallen; zij zijn neergestoten, en kunnen niet weer opstaan.", "Gen 50:10": "Toen zij nu bij het plein van het doornbos kwamen, dat aan de overzijde van de Jordaan is, hielden zij daar een grote en zeer zware rouwklacht; en hij maakte voor zijn vader een rouw van zeven dagen.", "Openb 3:3": "Bedenk dan hoe u het ontvangen en gehoord hebt, en bewaar het, en bekeer u. Als u dan niet waakt, zal Ik over u komen als een dief, en u zult niet weten op welk uur Ik over u komen zal.", "2 Sam 21:8-11": "Maar de koning nam de twee zonen van Rizpa, dochter van Aja, die zij Saul gebaard had, Armoni en Mefiboseth; en verder de vijf zonen van Michals zuster, Sauls dochter, die zij Adriël, de zoon van Barzillai, de Meholathiet, gebaard had; En hij gaf hen in de hand van de Gibeonieten, die hen ophingen op de berg voor het aangezicht van de HEERE; en die zeven vielen tegelijk; en zij werden gedood in de dagen van de oogst, in de eerste dagen, in het begin van de gersteoogst. Toen nam Rizpa, de dochter van Aja, een rouwkleed, en spande dit voor zich uit op een rotssteen, vanaf het begin van de oogst, totdat er water op hen drupte uit de hemel; en zij liet het gevogelte van de hemel overdag niet op hen rusten, en het gedierte van het veld 's nachts ook niet.", "Matt 24:50": "dan zal de heer van die dienstknecht komen op een dag waarop hij hem niet verwacht, en op een uur dat hij niet weet;", "1 Kor 6:10": "Vergis u niet; hoereerders, afgodendienaars, overspelers, ontuchtigen, mannen die bij mannen liggen, dieven, hebzuchtigen, dronkaards, geen lasteraars, geen rovers, zullen het Koninkrijk van God beërven.", "1 Sam 13:14": "Maar nu zal uw koningschap niet blijven bestaan. De HEERE heeft Zich een man gezocht naar Zijn hart, en de HEERE heeft hem bevolen een voorganger te zijn over Zijn volk, omdat u niet gehouden hebt wat de HEERE u geboden had.", "Jer 13:14": "En Ik zal hen tegen elkaar te pletter slaan, de een tegen de ander, zowel de vaders als de kinderen samen, spreekt de HEERE; Ik zal geen medelijden hebben, en niet sparen, en Mij niet ontfermen, zodat Ik hen zal verderven.", "2 Kon 22:11": "Het gebeurde nu, toen de koning de woorden van het wetboek hoorde, dat hij zijn kleren scheurde.", "Job 36:17": "Maar u hebt het oordeel van de goddeloze vervuld; het oordeel en het recht houden u vast.", "Ex 34:7": "Die de goedertierenheid bewaart aan vele duizenden, Die de ongerechtigheid, en overtreding, en zonde vergeeft; Die de schuldige geenszins onschuldig houdt, en de ongerechtigheid van de vaders bezoekt aan de kinderen, en aan de kindskinderen, tot in het derde en vierde geslacht.", "1 Kon 1:5-18": "Adonia nu, de zoon van Haggith, verhief zich en zei: Ik zal koning zijn; en hij bereidde zich wagens en ruiters, en vijftig mannen die voor hem uit liepen. En zijn vader had hem nooit bedroefd door te zeggen: Waarom hebt u zo gedaan? En ook was hij zeer knap van gedaante, en Haggith had hem gebaard na Absalom. En hij overlegde met Joab, de zoon van Zeruja, en met Abjathar, de priester; die hielpen hem, en volgden Adonia.", "1 Kron 2:15": "Ozem, de zesde, David, de zevende.", "2 Sam 13:20-28": "En haar broer Absalom zei tegen haar: Is uw broer Amnon bij u geweest? Nu dan, mijn zuster, zwijg stil, hij is uw broer; zet uw hart niet op deze zaak. Zo bleef Thamar, eenzaam, in het huis van haar broer Absalom. Toen koning David al deze dingen hoorde, werd hij zeer boos. Doch Absalom sprak niet met Amnon, noch kwaad noch goed; maar Absalom haatte Amnon, vanwege het feit dat hij zijn zuster Thamar verkracht had.", "2 Sam 20:18": "Toen sprak zij, en zei: In vroeger tijden spraken zij gewoonlijk, en zeiden: Zij zullen zeker te Abel vragen; en zo maakten zij de zaak af.", "1 Kron 29:22": "En zij aten en dronken op die dag voor het aangezicht van de HEERE met grote vreugde; en zij maakten Salomo, de zoon van David, voor de tweede keer koning, en zij zalfden hem voor de HEERE tot voorganger, en Zadok tot priester.", "Lev 26:14": "Maar als u Mij niet zult horen, en al deze geboden niet zult doen;", "2 Sam 1:21": "U, bergen van Gilboa, geen dauw en geen regen mag op u zijn, en geen velden met hefoffers; want daar is het schild van de helden smadelijk weggeworpen, het schild van Saul, alsof hij niet met olie gezalfd was geweest.", "Jes 33:12": "En de volken zullen zijn als de verbrandingen van het kalk; als afgehouwen doornen zullen zij met het vuur verbrand worden.", "2 Sam 2:8": "Abner nu, de zoon van Ner, de legeraanvoerder die Saul gehad had, nam Isboseth, Sauls zoon, en voerde hem over naar Mahanaim,", "Ps 18:27": "Bij de reine houdt U Zich rein, maar bij de verkeerde bewijst U Zich een Worstelaar.", "Ps 9:6": "Gij hebt de heidenen gescholden, de goddeloze verdaan, hun naam uitgedelgd, tot in eeuwigheid en altoos.", "Ps 101:8": "Elke morgen zal ik alle goddelozen van het land verdelgen, om uit de stad van de HEERE alle werkers van de ongerechtigheid uit te roeien.", "2 Sam 16:9": "Toen zei Abisai, de zoon van Zeruja, tegen de koning: Waarom zou deze dode hond mijn heer de koning vloeken? Laat mij toch oversteken en zijn kop wegnemen.", "Openb 19:17-21": "En ik zag een engel, staande in de zon; en hij riep met een grote stem, en zei tegen alle vogels, die in het midden van de hemel vlogen: Kom hierheen, en verzamel u tot het avondmaal van de grote God; Opdat u eet het vlees van de koningen, en het vlees van de aanvoerders over duizend, en het vlees van de sterken, en het vlees van de paarden en van hen die daarop zitten; en het vlees van alle vrijen en dienstknechten, en kleinen en groten. En ik zag het beest, en de koningen van de aarde, en hun legers verzameld, om krijg te voeren tegen Hem, Die op het paard zat, en tegen Zijn legers.", "2 Sam 20:2": "Toen trok alle man van Israël weg van achter David, Seba, de zoon van Bichri, achterna; maar de mannen van Juda kleefden hun koning aan, van de Jordaan af tot aan Jeruzalem.", "1 Kron 3:2": "de derde Absalom, de zoon van Maächa, de dochter van Thalmai, de koning van Gesur; de vierde Adonia, de zoon van Haggith;", "Dan 2:34": "Dat zag u, totdat er een steen werd afgehouwen zonder handen, die het beeld trof aan zijn voeten van ijzer en leem, en ze verbrijzelde.", "Spr 9:17": "Het gestolen water is zoet, en het verborgen brood is heerlijk.", "Job 31:3": "Is niet het verderf voor de verkeerde, ja, wat vreemds voor de werkers van ongerechtigheid?", "1 Kon 21:21": "Zie, Ik zal kwaad over u brengen, en uw nakomelingen wegdoen; en Ik zal van Achab uitroeien wie mannelijk is, alsook wie in Israël afgesloten is en wie verlaten is.", "Spr 29:1": "Een man die, vaak bestraft, zijn nek verhardt, zal plotseling verbroken worden, zodat er geen genezing meer mogelijk is.", "2 Sam 5:2": "Ook al eerder, toen Saul koning over ons was, was u het die Israël uitleidde en terugbracht; ook heeft de HEERE tegen u gezegd: U zult Mijn volk Israël weiden, en u zult een leider zijn over Israël.", "Jer 44:23": "Vanwege dat u wierook gebrand hebt, en dat u tegen de HEERE gezondigd hebt, en de stem van de HEERE niet gehoorzaam bent geweest, en in Zijn wet en in Zijn inzettingen, en in Zijn getuigenissen niet hebt gewandeld; daarom is u dit kwaad overkomen, zoals het is op deze dag.", "2 Kon 5:27": "Daarom zal de melaatsheid van Naäman u aankleven, en uw nageslacht voor eeuwig! Toen ging hij van voor zijn aangezicht weg, melaats, wit als de sneeuw.", "Luk 12:19": "en ik zal tegen mijn ziel zeggen: Ziel, je hebt veel goederen liggen, voor vele jaren; neem rust, eet, drink, wees vrolijk.", "1 Kon 21:20": "En Achab zei tegen Elia: Hebt u mij gevonden, o mijn vijand? En hij zei: Ik heb u gevonden, omdat u uzelf verkocht hebt om te doen wat kwaad is in de ogen van de HEERE.", "Ps 21:10": "U zult hen zetten als een vurige oven ter tijd van uw toornige aangezicht; de HEERE zal hen in Zijn toorn verslinden, en het vuur zal hen verteren.", "Ps 1:4-6": "Zo zijn de goddelozen niet, maar als het kaf dat de wind wegdrijft. Daarom zullen de goddelozen niet standhouden in het gericht, noch de zondaars in de vergadering van de rechtvaardigen. Want de HEERE kent de weg van de rechtvaardigen; maar de weg van de goddelozen zal vergaan.", "Gen 49:4": "Snelle afloop als van water, u zult niet de voortreffelijkste zijn! Want u hebt het bed van uw vader beklommen; toen hebt u het geschonden; hij heeft mijn bed beklommen!", "Spr 11:21": "Hand aan hand zal de boze niet onschuldig blijven; maar het nageslacht van de rechtvaardigen zal ontkomen.", "Klaagl 5:16": "De kroon van ons hoofd is afgevallen; o wee nu ons, dat wij zo gezondigd hebben!", "Ps 59:6": "Ja, U HEERE, God van de heerscharen, God van Israël! Ontwaak om al deze heidenen te bezoeken; wees niemand van hen genadig die trouweloos ongerechtigheid bedrijven. Sela.", "Spr 16:5": "Ieder die hoog van hart is, is de HEERE een gruwel; al slaat hij de handen ineen, hij zal niet onschuldig blijven.", "Ps 37:2": "Want als gras zullen zij snel worden afgesneden, en als het groene grasscheutje zullen zij afvallen.", "Openb 16:6": "Omdat zij het bloed van de heiligen en van de profeten vergoten hebben, hebt U hun ook bloed te drinken gegeven; want zij zijn het waard.", "Spr 13:5": "De rechtvaardige haat leugentaal; maar de goddeloze maakt zich stinkend, en doet zich schaamte aan.", "2 Sam 13:28": "Absalom nu gebood zijn knechten: Let er nu op, wanneer Amnons hart vrolijk is van de wijn, en ik tegen u zeg: Sla Amnon neer, dan zult u hem doden; wees niet bang; heb ik het u niet geboden? Wees sterk en wees dapper.", "Joh 7:12": "En er was veel gemurmel over Hem onder de menigten. Sommigen zeiden: Hij is goed; en anderen zeiden: Nee, maar Hij verleidt de menigte.", "Hos 12:3": "Ook heeft de Heere een twist met Juda, en Hij zal bezoeking doen over Jakob naar zijn wegen, naar zijn handelingen zal Hij hem vergelden.", "2 Sam 1:17": "David nu klaagde deze klaagzang over Saul en over Jonathan, zijn zoon;", "Jer 41:6": "En Ismaël, de zoon van Nethanja, ging uit Mizpa hun tegemoet, al gaande en huilend; en het gebeurde, toen hij hen aantrof, dat hij zei: Kom naar Gedalia, de zoon van Ahikam!", "Joh 7:34": "U zult Mij zoeken en u zult Mij niet vinden; en waar Ik ben, kunt u niet komen.", "Mark 7:37": "En zij waren bovenmate verbaasd, en zeiden: Hij heeft alles goed gedaan, en Hij maakt dat de doven horen, en de stommen spreken.", "Nahum 1:2": "Een ijverig God en een wreker is de HEERE, een wreker is de HEERE, en zeer grimmig; een wreker is de HEERE aan Zijn tegenstanders, en Hij bewaart de toorn voor Zijn vijanden.", "Deut 27:24": "Vervloekt is hij die zijn naaste in het verborgene doodslaat! En heel het volk zal zeggen: Amen.", "Spr 21:16": "Een mens die van de weg van het verstand afdwaalt, zal in de gemeente van de doden rusten.", "Mark 15:11-13": "Maar de overpriesters brachten de menigte ertoe dat hij hun liever Barabbas zou loslaten. En Pilatus antwoordde en zei weer tegen hen: Wat wilt u dan dat ik met Hem zal doen, Die u een Koning van de Joden noemt? En zij riepen weer: Kruisig Hem.", "2 Sam 10:3": "Toen zeiden de vorsten van de kinderen Ammons tegen hun heer Hanun: Eert u David uw vader in uw ogen, omdat hij troosters tot u gezonden heeft? Heeft David zijn knechten niet daarom tot u gezonden, dat hij deze stad doorzoekt, en die verspiedt, en die omkeert?", "Deut 11:28": "Maar de vloek, als u niet zult horen naar de geboden van de HEERE, uw God, en afwijkt van de weg, die ik u heden gebied, om andere goden na te wandelen, die u niet gekend hebt.", "Jes 64:5-7": "U ontmoet de vrolijke, en die gerechtigheid doet, hun die aan U denken op Uw wegen; zie, U was verbolgen, omdat wij gezondigd hebben; daarin is de eeuwigheid, opdat wij behouden werden. Doch wij allen zijn als een onreine, en al onze gerechtigheden zijn als een wegwerpkleed; en wij allen vallen af als een blad, en onze misdaden voeren ons weg als een wind. En er is niemand, die Uw Naam aanroept, die zichzelf opwekt, dat hij U aangrijpt; want U verbergt Uw aangezicht voor ons, en U doet ons smelten, door middel van onze ongerechtigheden."}, "noten": {}, "koppeling": {"1": "<span class=\"wl\" data-l=\"L1\" data-code=\"H1961\">Er</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H1961\">was</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H752\ v\" data-code=\"H3205\">born</span> to <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> in <span class=\"wl wl-kjv\" data-code=\"H2275\">Hebron.</span>", "6": "And it came to pass, while there was <span class=\"wl wl-kjv\" data-code=\"H4421\">war</span> between the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> and the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> that <span class=\"wl wl-kjv\" data-code=\"H74\">Abner</span> made himself <span class=\"wl wl-kjv\" data-code=\"H2388\">strong</span> for the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul.</span>", "7": "And <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> had a <span class=\"wl wl-kjv\" data-code=\"H6370\">concubine,</span> whose <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> was <span class=\"wl wl-kjv\" data-code=\"H7532\">Rizpah,</span> the <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> of <span class=\"wl wl-kjv\" data-code=\"H345\">Aiah:</span> and Ishbosheth <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to <span class=\"wl wl-kjv\" data-code=\"H74\">Abner,</span> Wherefore hast thou gone <span class=\"wl wl-kjv\" data-code=\"H935\">in</span> unto my <span class=\"wl wl-kjv\" data-code=\"H1\">father's</span> <span class=\"wl wl-kjv\" data-code=\"H6370\">concubine?</span>", "8": "Then was <span class=\"wl wl-kjv\" data-code=\"H74\">Abner</span> <span class=\"wl wl-kjv\" data-code=\"H3966\">very</span> <span class=\"wl wl-kjv\" data-code=\"H2734\">wroth</span> for the <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> of <span class=\"wl wl-kjv\" data-code=\"H378\">Ishbosheth,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Am I a <span class=\"wl wl-kjv\" data-code=\"H3611\">dog's</span> <span class=\"wl
