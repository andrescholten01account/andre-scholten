penbaring","href":"../../openbaring/1/"}],"slugmap":{"Gen":"genesis","Ex":"exodus","Lev":"leviticus","Num":"numeri","Deut":"deuteronomium","Joz":"jozua","Richt":"richteren","Ruth":"ruth","1 Sam":"1-samuel","2 Sam":"2-samuel","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Er was een lange oorlog tussen het huis van Saul en het huis van David. Maar David werd steeds sterker, terwijl het huis van Saul steeds zwakker werd.","2":"En David werden zonen geboren in Hebron. Zijn eerstgeborene was Amnon, van Ahinoam, de Jizreëlietische;","3":"en zijn tweede was Chileab, van Abigaïl, de vrouw van Nabal, de Karmeliet; en de derde, Absalom, de zoon van Maächa, de dochter van Thalmai, koning van Gesur;","4":"en de vierde, Adonia, de zoon van Haggith; en de vijfde Sefatja, de zoon van Abital;","5":"en de zesde, Jithream, van Egla, Davids vrouw. Deze zonen werden David geboren in Hebron.","6":"Terwijl die oorlog was tussen het huis van Saul en het huis van David, gebeurde het dat Abner zich sterk maakte voor het huis van Saul.","7":"Saul had een bijvrouw gehad, met de naam Rizpa, dochter van Aja; en *Isboseth* zei tegen Abner: Waarom bent u naar mijn vaders bijvrouw gegaan?","8":"Toen ontstak Abner in grote woede over de woorden van Isboseth, en zei: Ben ik dan een hondenkop, ik, die tegen Juda, aan het huis van Saul, uw vader, aan zijn broers en aan zijn vrienden, tot op vandaag trouw bewijs, en u niet in Davids hand overgeleverd heb, dat u mij vandaag beschuldigt vanwege de schuld met deze vrouw?","9":"God moet Abner zo doen, en meer nog daarbij, als ik niet, zoals de HEERE aan David gezworen heeft, precies zo aan hem zal doen:","10":"het koninkrijk overbrengen van het huis van Saul, en de troon van David oprichten over Israël en over Juda, van Dan tot Ber-seba toe.","11":"En hij kon Abner geen woord meer terugzeggen, omdat hij hem vreesde.","12":"Toen zond Abner boden namens zich naar David, en zei: Van wie is het land? En hij zei verder: Sluit uw verbond met mij, en zie, mijn hand zal met u zijn, om heel Israël tot u te doen overgaan.","13":"En hij zei: Goed, ik zal een verbond met u sluiten; maar één ding vraag ik van u: u zult mijn gezicht niet zien, als u niet eerst Michal, Sauls dochter, meebrengt, wanneer u komt om mijn gezicht te zien.","14":"Ook zond David boden naar Isboseth, de zoon van Saul, en zei: Geef mij mijn vrouw Michal, die ik mij met honderd voorhuiden van de Filistijnen ondertrouwd heb.","15":"Isboseth dan stuurde iemand, en nam haar van de man, van Paltiël, de zoon van Lais.","16":"En haar man ging met haar mee, huilend achter haar aan lopend, tot Bahurim toe. Toen zei Abner tegen hem: Ga weg, keer terug. En hij keerde terug.","17":"Abner nu had overleg met de oudsten van Israël, en zei: U hebt David al lang geleden als koning over u gewenst.","18":"Doe het nu dan; want de HEERE heeft over David gesproken, en gezegd: Door de hand van David, Mijn dienaar, zal Ik Mijn volk Israël verlossen van de hand van de Filistijnen, en van de hand van al hun vijanden.","19":"En Abner sprak ook ten aanhoren van Benjamin. Vervolgens ging Abner ook naar Hebron om ten aanhoren van David alles te vertellen wat goed was in de ogen van Israël, en in de ogen van heel het huis van Benjamin.","20":"En Abner kwam bij David te Hebron, met twintig mannen. En David richtte voor Abner en de mannen die bij hem waren een maaltijd aan.","21":"Toen zei Abner tegen David: Ik zal opstaan en heengaan, en heel Israël verzamelen bij mijn heer de koning, zodat zij een verbond met u sluiten, en u regeert over alles wat uw hart begeert. Zo liet David Abner gaan, en hij ging in vrede.","22":"En zie, Davids dienaren en Joab kwamen terug van een strooptocht, en brachten een grote buit met zich mee. Abner was toen niet bij David te Hebron, want hij had hem laten gaan, en hij was in vrede vertrokken.","23":"Toen Joab en het hele leger dat bij hem was aankwam, vertelden ze Joab: Abner, de zoon van Ner, is bij de koning geweest, en die heeft hem laten gaan, en hij is in vrede vertrokken.","24":"Toen ging Joab naar de koning, en zei: Wat hebt u gedaan? Zie, Abner is bij u geweest; waarom hebt u hem laten gaan, zodat hij zomaar is weggegaan?","25":"U kent Abner, de zoon van Ner: hij is gekomen om u te bedriegen, en om uw uitgaan en ingaan te weten te komen, ja, om alles te weten te komen wat u doet.","26":"Toen Joab bij David wegging, stuurde hij boden achter Abner aan, die hem terughaalden van de put van Sira; maar David wist dat niet.","27":"Toen Abner naar Hebron terugkwam, nam Joab hem apart in het midden van de poort om in stilte met hem te spreken; en hij sloeg hem daar onder de vijfde rib, zodat hij stierf, vanwege het bloed van zijn broer Asaël.","28":"Toen David dat later hoorde, zei hij: Ik ben onschuldig, en mijn koninkrijk is dat, bij de HEERE, tot in eeuwigheid, aan het bloed van Abner, de zoon van Ner.","29":"Het moet blijven op het hoofd van Joab, en op heel het huis van zijn vader; en het mag van het huis van Joab niet ontbreken dat er iemand is die een vloed heeft, of melaats is, of zich aan de kruk moet vasthouden, of door het zwaard valt, of gebrek aan brood heeft!","30":"Zo hebben Joab en zijn broer Abisaï Abner doodgeslagen, omdat hij hun broer Asaël te Gibeon in de strijd had gedood.","31":"David dan zei tegen Joab en tegen al het volk dat bij hem was: Scheur uw kleren, en doe rouwgewaden aan, en klaag over Abner. En koning David liep zelf achter de baar.","32":"Toen zij Abner te Hebron begroeven, verhief de koning zijn stem, en huilde bij Abners graf; ook al het volk huilde.","33":"En de koning hief een klaaglied aan over Abner, en zei: Moest Abner sterven zoals een dwaas sterft?","34":"Uw handen waren niet gebonden, en uw voeten waren niet in koperen boeien gezet, *maar* u bent gevallen, zoals men valt voor het aangezicht van kinderen van onrecht. Toen huilde heel het volk nog meer over hem.","35":"Daarna kwam al het volk om David brood te laten eten, terwijl het nog dag was; maar David zwoer: God moet mij zo doen, en er nog meer aan toevoegen, als ik vóór het ondergaan van de zon brood of iets anders smaak!","36":"Toen al het volk dit merkte, was het goed in hun ogen; alles wat de koning gedaan had, was goed in de ogen van heel het volk.","37":"En al het volk en heel Israël merkten op die dag dat het niet van de koning was gekomen dat Abner, de zoon van Ner, gedood was.","38":"Verder zei de koning tegen zijn dienaren: Weet u niet dat er vandaag een vorst, ja, een groot man in Israël gevallen is?","39":"Maar ik ben vandaag teder, hoewel tot koning gezalfd, en deze mannen, de zonen van Zeruja, zijn te hard voor mij; de HEERE zal de boosdoener vergelden naar zijn boosheid."},"SV":{"1":"En er was een lange krijg tussen het huis van Saul, en tussen het huis van David. Doch David ging en werd sterker; maar die van het huis van Saul gingen en werden zwakker.","2":"En David werden zonen geboren te Hebron. Zijn eerstgeborene nu was Amnon, van Ahinoam, de Jizreëlietische;","3":"En zijn tweede was Chileab, van Abigaïl, de huisvrouw van Nabal, den Karmeliet; en de derde, Absalom, de zoon van Maacha, de dochter van Thalmai, koning van Gesur;","4":"En de vierde, Adonia, de zoon van Haggith; en de vijfde Sefatja, de zoon van Abital;","5":"En de zesde, Jithream, van Egla, Davids huisvrouw. Dezen zijn David geboren te Hebron.","6":"Terwijl die krijg was tussen het huis van Saul, en tussen het huis van David, zo geschiedde het, dat Abner zich sterkte in het huis van Saul.","7":"Saul nu had een bijwijf gehad, welker naam was Rizpa, dochter van Aja; en *Isboseth* zeide tot Abner: Waarom zijt gij ingegaan tot mijns vaders bijwijf?","8":"Toen ontstak Abner zeer over Isboseths woorden, en zeide: Ben ik dan een hondskop, ik, die tegen Juda, aan het huis van Saul, uw vader, aan zijn broederen en aan zijn vrienden, heden weldadigheid doe, en u niet overgeleverd heb in Davids hand, dat gij heden aan mij onderzoekt de ongerechtigheid ener vrouw?","9":"God doe Abner zo, en doe hem zo daartoe! Voorzeker, gelijk als de HEERE aan David gezworen heeft, dat ik even alzo aan hem zal doen.","10":"Overbrengende het koninkrijk van het huis van Saul, en oprichtende den stoel van David over Israël en over Juda, van Dan tot Ber-seba toe.","11":"En hij kon Abner verder niet een woord antwoorden, omdat hij hem vreesde.","12":"Toen zond Abner boden voor zich tot David, zeggende: Wiens is het land? zeggende *wijders*: Maak uw verbond met mij, en zie, mijn hand zal met u zijn, om gans Israël tot u om te keren.","13":"En hij zeide: Wel, ik zal een verbond met u maken; doch een ding begeer ik van u, zeggende: Gij zult mijn aangezicht niet zien, tenzij dat gij Michal, Sauls dochter, te voren inbrengt, als gij komt om mijn aangezicht te zien.","14":"Ook zond David boden tot Isboseth, den zoon van Saul, zeggende: Geef *mij* mijn huisvrouw Michal, die ik mij met honderd voorhuiden der Filistijnen ondertrouwd heb.","15":"Isboseth dan zond heen, en nam haar van den man, van Paltiel, den zoon van Lais.","16":"En haar man ging met haar, al gaande en wenende achter haar, tot Bahurim toe. Toen zeide Abner tot hem: Ga weg, keer weder. En hij keerde weder.","17":"Abner nu had woorden met de oudsten van Israël, zeggende: Gij hebt David te voren lang tot een koning over u begeerd.","18":"Zo doet het nu; want de HEERE heeft tot David gesproken, zeggende: Door de hand van David, Mijn knecht, zal Ik Mijn volk Israël verlossen van de hand der Filistijnen, en van de hand van al hun vijanden.","19":"En Abner sprak ook voor de oren van Benjamin. Voorts ging Abner ook heen, om te Hebron voor Davids oren te spreken alles, wat goed was in de ogen van Israël, en in de ogen van het ganse huis van Benjamin.","20":"En Abner kwam tot David te Hebron, en twintig mannen met hem. En David maakte Abner, en den mannen, die met hem waren, een maaltijd.","21":"Toen zeide Abner tot David: Ik zal mij opmaken, en heengaan, en vergaderen gans Israël tot mijn heer, den koning, dat zij een verbond met u maken, en gij regeert over alles, wat uw ziel begeert. Alzo liet David Abner gaan, en hij ging in vrede.","22":"En ziet, Davids knechten en Joab kwamen van een bende, en brachten met zich een groten roof. Abner nu was niet bij David te Hebron; want hij had hem laten gaan, en hij was gegaan in vrede.","23":"Als nu Joab en het ganse heir, dat met hem was, aankwamen, zo gaven zij Joab te kennen, zeggende: Abner, de zoon van Ner, is gekomen tot den koning, en hij heeft hem laten gaan, en hij is gegaan in vrede.","24":"Toen ging Joab tot den koning in, en zeide: Wat hebt gij gedaan? Zie, Abner is tot u gekomen; waarom nu hebt gij hem laten gaan, dat hij zo vrij is weggegaan?","25":"Gij kent Abner, den zoon van Ner; dat hij gekomen is om u te overreden, en om te weten uw uitgang en uw ingang, ja, om te weten alles, wat gij doet.","26":"En Joab ging uit van David, en zond Abner boden na, die hem wederom haalden van den bornput van Sira; maar David wist het niet.","27":"Als nu Abner weder te Hebron kwam, zo leidde Joab hem ter zijde af in het midden der poort, om in de stilte met hem te spreken; en hij sloeg hem aldaar aan de vijfde rib, dat hij stierf, om des bloeds wil van zijn broeder Asahel.","28":"Als David dat daarna hoorde, zo zeide hij: Ik ben onschuldig, en mijn koninkrijk, bij den HEERE, tot in eeuwigheid, van het bloed van Abner, den zoon van Ner.","29":"Het blijve op het hoofd van Joab, en op het ganse huis zijns vaders; en er worde van het huis van Joab niet afgesneden, die een vloed hebbe, en melaats zij, en zich aan den stok houde, en door het zwaard valle, en broodsgebrek hebbe!","30":"Alzo hebben Joab en zijn broeder Abisai Abner doodgeslagen, omdat hij hun broeder Asahel te Gibeon in den strijd gedood had.","31":"David dan zeide tot Joab en tot al het volk, dat bij hem was: Scheurt uw klederen, en gordt zakken aan, en weeklaagt voor Abner henen; en de koning David ging achter de baar.","32":"Als zij nu Abner te Hebron begroeven, zo hief de koning zijn stem op, en weende bij Abners graf; ook weende al het volk.","33":"En de koning maakte een klage over Abner, en zeide: Is dan Abner gestorven, als een dwaas sterft?","34":"Uw handen waren niet gebonden, noch uw voeten in koperen boeien gedaan, *maar* gij zijt gevallen, gelijk men valt voor het aangezicht van kinderen der verkeerdheid. Toen weende het ganse volk nog meer over hem.","35":"Daarna kwam al het volk, om David brood te doen eten, als het nog dag was; maar David zwoer, zeggende: God doe mij zo, en doe er zo toe, indien ik voor het ondergaan der zon brood of iets smake!","36":"Als al het volk dit vernam, zo was het goed in hun ogen, alles, zoals de koning gedaan had, was goed in de ogen van het ganse volk.","37":"En al het volk en gans Israël merkten te dienzelven dage, dat het van den koning niet was, dat men Abner, den zoon van Ner, gedood had.","38":"Voorts zeide de koning tot zijn knechten: Weet gij niet, dat te dezen dage een vorst, ja, een grote in Israël gevallen is?","39":"Maar ik ben heden teder, en gezalfd ten koning, en deze mannen, de zonen van Zeruja, zijn harder dan ik; de HEERE zal den boosdoener vergelden naar zijn boosheid."},"KJV":{"1":"Now there was long war between the house of Saul and the house of David: but David waxed stronger and stronger, and the house of Saul waxed weaker and weaker.","2":"And unto David were sons born in Hebron: and his firstborn was Amnon, of Ahinoam the Jezreelitess;","3":"And his second, Chileab, of Abigail the wife of Nabal the Carmelite; and the third, Absalom the son of Maacah the daughter of Talmai king of Geshur;","4":"And the fourth, Adonijah the son of Haggith; and the fifth, Shephatiah the son of Abital;","5":"And the sixth, Ithream, by Eglah David's wife. These were born to David in Hebron.","6":"And it came to pass, while there was war between the house of Saul and the house of David, that Abner made himself strong for the house of Saul.","7":"And Saul had a concubine, whose name was Rizpah, the daughter of Aiah: and Ishbosheth said to Abner, Wherefore hast thou gone in unto my father's concubine?","8":"Then was Abner very wroth for the words of Ishbosheth, and said, Am I a dog's head, which against Judah do shew kindness this day unto the house of Saul thy father, to his brethren, and to his friends, and have not delivered thee into the hand of David, that thou chargest me to day with a fault concerning this woman?","9":"So do God to Abner, and more also, except, as the LORD hath sworn to David, even so I do to him;","10":"To translate the kingdom from the house of Saul, and to set up the throne of David over Israel and over Judah, from Dan even to Beersheba.","11":"And he could not answer Abner a word again, because he feared him.","12":"And Abner sent messengers to David on his behalf, saying, Whose is the land? saying also, Make thy league with me, and, behold, my hand shall be with thee, to bring about all Israel unto thee.","13":"And he said, Well; I will make a league with thee: but one thing I require of thee, that is, Thou shalt not see my face, except thou first bring Michal Saul's daughter, when thou comest to see my face.","14":"And David sent messengers to Ishbosheth Saul's son, saying, Deliver me my wife Michal, which I espoused to me for an hundred foreskins of the Philistines.","15":"And Ishbosheth sent, and took her from her husband, even from Phaltiel the son of Laish.","16":"And her husband went with her along weeping behind her to Bahurim. Then said Abner unto him, Go, return. And he returned.","17":"And Abner had communication with the elders of Israel, saying, Ye sought for David in times past to be king over you:","18":"Now then do it: for the LORD hath spoken of David, saying, By the hand of my servant David I will save my people Israel out of the hand of the Philistines, and out of the hand of all their enemies.","19":"And Abner also spake in the ears of Benjamin: and Abner went also to speak in the ears of David in Hebron all that seemed good to Israel, and that seemed good to the whole house of Benjamin.","20":"So Abner came to David to Hebron, and twenty men with him. And David made Abner and the men that were with him a feast.","21":"And Abner said unto David, I will arise and go, and will gather all Israel unto my lord the king, that they may make a league with thee, and that thou mayest reign over all that thine heart desireth. And David sent ➔ Abner away; and he went in peace.","22":"And, behold, the servants of David and Joab came from pursuing a troop, and brought in a great spoil with them: but Abner was not with David in Hebron; for he had sent him away, and he was gone in peace.","23":"When Joab and all the host that was with him were come, they told Joab, saying, Abner the son of Ner came to the king, and he hath sent him away, and he is gone in peace.","24":"Then Joab came to the king, and said, What hast thou done? behold, Abner came unto thee; why is it that thou hast sent him away, and he is quite gone?","25":"Thou knowest Abner the son of Ner, that he came to deceive thee, and to know thy going out and thy coming in, and to know all that thou doest.","26":"And when Joab was come out from David, he sent messengers after Abner, which brought him again from the well of Sirah: but David knew it not.","27":"And when Abner was returned to Hebron, Joab took him aside in the gate to speak with him quietly, and smote him there under the fifth rib, that he died, for the blood of Asahel his brother.","28":"And afterward when David heard it, he said, I and my kingdom are guiltless before the LORD for ever from the blood of Abner the son of Ner:","29":"Let it rest on the head of Joab, and on all his father's house; and let there not fail from the house of Joab one that hath an issue, or that is a leper, or that leaneth on a staff, or that falleth on the sword, or that lacketh bread.","30":"So Joab and Abishai his brother slew Abner, because he had slain their brother Asahel at Gibeon in the battle.","31":"And David said to Joab, and to all the people that were with him, Rend your clothes, and gird you with sackcloth, and mourn before Abner. And king David himself followed the bier.","32":"And they buried Abner in Hebron: and the king lifted up his voice, and wept at the grave of Abner; and all the people wept.","33":"And the king lamented over Abner, and said, Died Abner as a fool dieth?","34":"Thy hands were not bound, nor thy feet put into fetters: as a man falleth before wicked men, so fellest thou. And all the people wept again over him.","35":"And when all the people came to cause ➔ David to eat meat while it was yet day, David sware, saying, So do God to me, and more also, if I taste bread, or ought else, till the sun be down.","36":"And all the people took notice of it, and it pleased them: as whatsoever the king did pleased all the people.","37":"For all the people and all Israel understood that day that it was not of the king to slay Abner the son of Ner.","38":"And the king said unto his servants, Know ye not that there is a prince and a great man fallen this day in Israel?","39":"And I am this day weak, though anointed king; and these men the sons of Zeruiah be too hard for me: the LORD shall reward the doer of evil according to his wickedness."}},"tsk":{"1":[{"kopje":"lange oorlog","refs":["1 Kon 14:30","1 Kon 15:16","1 Kon 15:32"]},{"kopje":"tussen","refs":["Gen 3:15","Ps 45:4-6","Matt 10:35","Matt 10:36","Gal 5:17","Ef 6:12"]},{"kopje":"David werd steeds sterker","refs":["2 Sam 2:17","Est 6:13","Job 8:7","Job 17:9","Ps 84:8","Spr 4:18","Spr 4:19","Dan 2:34","Dan 2:35","Dan 2:44","Dan 2:45","Openb 6:2"]}],"2":[{"kopje":"zonen geboren","refs":["1 Kron 3:1-4"]},{"kopje":"Amnon","refs":["2 Sam 13:1-29","Gen 49:3","Gen 49:4"]},{"kopje":"Ahinoam","refs":["1 Sam 25:43"]}],"3":[{"kopje":"Chileab","refs":["1 Kron 3:1"]},{"kopje":"Abigaïl","refs":["2 Sam 2:2","1 Sam 25:3","1 Sam 25:42"]},{"kopje":"Absalom","refs":["2 Sam 13:20-28","2 Sam 14:24-33","2 Sam 15:1-18","2 Sam 17:1-14","2 Sam 18:9-18","2 Sam 18:33"]},{"kopje":"Thalmai","refs":["2 Sam 13:37","2 Sam 13:38"]},{"kopje":"Gesur","refs":["Deut 3:14","Joz 13:13","1 Sam 27:8"]}],"4":[{"kopje":"Adonia","refs":["1 Kon 1:5-18","1 Kon 2:13-25"]}],"6":[{"kopje":"Abner","refs":["2 Sam 2:8","2 Sam 2:9","2 Kon 10:23","2 Kron 25:8","Spr 21:30","Jes 8:9","Jes 8:10","Joël 3:9-13","Matt 12:30"]}],"7":[{"kopje":"Rizpa","refs":["2 Sam 21:8-11"]},{"kopje":"naar mijn vaders bijvrouw gegaan","refs":["2 Sam 12:8","2 Sam 16:21","2 Sam 16:22","1 Kon 2:17","1 Kon 2:21","1 Kon 2:22"]}],"8":[{"kopje":"Abner","refs":["Ps 76:11","Mark 6:18","Mark 6:19"]},{"kopje":"een hondenkop","refs":["2 Sam 9:8","2 Sam 16:9","Deut 23:18","1 Sam 24:15","1 Sam 24:16","2 Kon 8:13"]},{"kopje":"trouw bewijs","refs":["2 Sam 3:9","2 Sam 3:18","2 Sam 5:2","1 Sam 15:28","Ps 2:1-4","Jes 37:23","Hand 9:4","Hand 9:5"]}],"9":[{"kopje":"God moet Abner zo doen","refs":["2 Sam 3:35","2 Sam 19:13","Ruth 1:17","1 Sam 3:17","1 Sam 14:44","1 Sam 25:22 data-code=\"H1650\">Geshur;</span>","4":"And the <span class=\"wl wl-kjv\" data-code=\"H7243\">fourth,</span> <span class=\"wl wl-kjv\" data-code=\"H138\">Adonijah</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H2294\">Haggith;</span> and the <span class=\"wl wl-kjv\" data-code=\"H2549\">fifth,</span> <span class=\"wl wl-kjv\" data-code=\"H8203\">Shephatiah</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H37\">Abital;</span>","5":"And the <span class=\"wl wl-kjv\" data-code=\"H8345\">sixth,</span> <span class=\"wl wl-kjv\" data-code=\"H3507\">Ithream,</span> by <span class=\"wl wl-kjv\" data-code=\"H5698\">Eglah</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David's</span> <span class=\"wl wl-kjv\" data-code=\"H802\">wife.</span> These were <span class=\"wl wl-kjv\" data-code=\"H3205\">born</span> to <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> in <span class=\"wl wl-kjv\" data-code=\"H2275\">Hebron.</span>","6":"And it came to pass, while there was <span class=\"wl wl-kjv\" data-code=\"H4421\">war</span> between the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> and the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> that <span class=\"wl wl-kjv\" data-code=\"H74\">Abner</span> made himself <span class=\"wl wl-kjv\" data-code=\"H2388\">strong</span> for the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul.</span>","7":"And <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> had a <span class=\"wl wl-kjv\" data-code=\"H6370\">concubine,</span> whose <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> was <span class=\"wl wl-kjv\" data-code=\"H7532\">Rizpah,</span> the <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> of <span class=\"wl wl-kjv\" data-code=\"H345\">Aiah:</span> and Ishbosheth <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to <span class=\"wl wl-kjv\" data-code=\"H74\">Abner,</span> Wherefore hast thou gone <span class=\"wl wl-kjv\" data-code=\"H935\">in</span> unto my <span class=\"wl wl-kjv\" data-code=\"H1\">father's</span> <span class=\"wl wl-kjv\" data-code=\"H6370\">concubine?</span>","8":"Then was <span class=\"wl wl-kjv\" data-code=\"H74\">Abner</span> <span class=\"wl wl-kjv\" data-code=\"H3966\">very</span> <span class=\"wl wl-kjv\" data-code=\"H2734\">wroth</span> for the <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> of <span class=\"wl wl-kjv\" data-code=\"H378\">Ishbosheth,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Am I a <span class=\"wl wl-kjv\" data-code=\"H3611\">dog's</span> <span class=\"wl wl-kjv\" data-code=\"H7218\">head,</span> which against <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> do <span class=\"wl wl-kjv\" data-code=\"H6213\">shew</span> <span class=\"wl wl-kjv\" data-code=\"H2617\">kindness</span> this <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> unto the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> thy <span class=\"wl wl-kjv\" data-code=\"H1\">father,</span> to his <span class=\"wl wl-kjv\" data-code=\"H251\">brethren,</span> and to his <span class=\"wl wl-kjv\" data-code=\"H4828\">friends,</span> and have not <span class=\"wl wl-kjv\" data-code=\"H4672\">delivered</span> thee into the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> that thou <span class=\"wl wl-kjv\" data-code=\"H6485\">chargest</span> me to <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> with a <span class=\"wl wl-kjv\" data-code=\"H5771\">fault</span> concerning this <span class=\"wl wl-kjv\" data-code=\"H802\">woman?</span>","9":"So <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> to <span class=\"wl wl-kjv\" data-code=\"H74\">Abner,</span> and more <span class=\"wl wl-kjv\" data-code=\"H3254\">also,</span> except, as the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H7650\">sworn</span> to <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> even so I <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> to him;","10":"To <span class=\"wl wl-kjv\" data-code=\"H5674\">translate</span> the <span class=\"wl wl-kjv\" data-code=\"H4467\">kingdom</span> from the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul,</span> and to set <span class=\"wl wl-kjv\" data-code=\"H6965\">up</span> the <span class=\"wl wl-kjv\" data-code=\"H3678\">throne</span> of <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> over <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> and over <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> from <span class=\"wl wl-kjv\" data-code=\"H1835\">Dan</span> even to <span class=\"wl wl-kjv\" data-code=\"H884\">Beersheba.</span>","11":"And he <span class=\"wl wl-kjv\" data-code=\"H3201\">could</span> not <span class=\"wl wl-kjv\" data-code=\"H7725\">answer</span> <span class=\"wl wl-kjv\" data-code=\"H74\">Abner</span> a <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> again, because he <span class=\"wl wl-kjv\" data-code=\"H3372\">feared</span> him.","12":"And <span class=\"wl wl-kjv\" data-code=\"H74\">Abner</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> <span class=\"wl wl-kjv\" data-code=\"H4397\">messengers</span> to <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> on his behalf, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Whose is the <span class=\"wl wl-kjv\" data-code=\"H776\">land?</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying</span> also, <span class=\"wl wl-kjv\" data-code=\"H3772\">Make</span> thy <span class=\"wl wl-kjv\" data-code=\"H1285\">league</span> with me, and, behold, my <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> shall be with thee, to bring <span class=\"wl wl-kjv\" data-code=\"H5437\">about</span> all <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> unto thee.","13":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H2896\">Well;</span> I will <span class=\"wl wl-kjv\" data-code=\"H3772\">make</span> a <span class=\"wl wl-kjv\" data-code=\"H1285\">league</span> with thee: but <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H1697\">thing</span> I <span class=\"wl wl-kjv\" data-code=\"H7592\">require</span> of thee, that <span class=\"wl wl-kjv\" data-code=\"H559\">is,</span> Thou shalt not <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> my <span class=\"wl wl-kjv\" data-code=\"H6440\">face,</span> except thou <span class=\"wl wl-kjv\" data-code=\"H6440\">first</span> <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> <span class=\"wl wl-kjv\" data-code=\"H4324\">Michal</span> <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul's</span> <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter,</span> when thou <span class=\"wl wl-kjv\" data-code=\"H935\">comest</span> to <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> my <span class=\"wl wl-kjv\" data-code=\"H6440\">face.</span>","14":"And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> <span class=\"wl wl-kjv\" data-code=\"H4397\">messengers</span> to <span class=\"wl wl-kjv\" data-code=\"H378\">Ishbosheth</span> <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul's</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">son,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">Deliver</span> me my <span class=\"wl wl-kjv\" data-code=\"H802\">wife</span> <span class=\"wl wl-kjv\" data-code=\"H4324\">Michal,</span> which I <span class=\"wl wl-kjv\" data-code=\"H781\">espoused</span> to me for an <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> <span class=\"wl wl-kjv\" data-code=\"H6190\">foreskins</span> of the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines.</span>","15":"And <span class=\"wl wl-kjv\" data-code=\"H378\">Ishbosheth</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent,</span> and <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> her from her <span class=\"wl wl-kjv\" data-code=\"H376\">husband,</span> even from <span class=\"wl wl-kjv\" data-code=\"H6409\">Phaltiel</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H3889\">Laish.</span>","16":"And her <span class=\"wl wl-kjv\" data-code=\"H376\">husband</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> with her along <span class=\"wl wl-kjv\" data-code=\"H1980\">weeping</span> <span class=\"wl wl-kjv\" data-code=\"H310\">behind</span> her to <span class=\"wl wl-kjv\" data-code=\"H980\">Bahurim.</span> Then <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> <span class=\"wl wl-kjv\" data-code=\"H74\">Abner</span> unto him, <span class=\"wl wl-kjv\" data-code=\"H3212\">Go,</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">return.</span> And he <span class=\"wl wl-kjv\" data-code=\"H7725\">returned.</span>","17":"And <span class=\"wl wl-kjv\" data-code=\"H74\">Abner</span> had <span class=\"wl wl-kjv\" data-code=\"H1961\">communication</span> with the <span class=\"wl wl-kjv\" data-code=\"H2205\">elders</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Ye <span class=\"wl wl-kjv\" data-code=\"H1245\">sought</span> for <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> in <span class=\"wl wl-kjv\" data-code=\"H8543\">times</span> <span class=\"wl wl-kjv\" data-code=\"H8032\">past</span> to be <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> over you:","18":"Now then <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> it: for the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H559\">spoken</span> of <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> By the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of my <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> I will <span class=\"wl wl-kjv\" data-code=\"H3467\">save</span> my <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> out of the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines,</span> and out of the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of all their <span class=\"wl wl-kjv\" data-code=\"H341\">enemies.</span>","19":"And <span class=\"wl wl-kjv\" data-code=\"H74\">Abner</span> also <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> in the <span class=\"wl wl-kjv\" data-code=\"H241\">ears</span> of <span class=\"wl wl-kjv\" data-code=\"H1144\">Benjamin:</span> and <span class=\"wl wl-kjv\" data-code=\"H74\">Abner</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> also to <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> in the <span class=\"wl wl-kjv\" data-code=\"H241\">ears</span> of <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> in <span class=\"wl wl-kjv\" data-code=\"H2275\">Hebron</span> all that <span class=\"wl wl-kjv\" data-code=\"H5869\">seemed</span> <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> to <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> and that seemed <span class=\"wl wl-kjv\" data-code=\"H5869\">good</span> to the whole <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H1144\">Benjamin.</span>","20":"So <span class=\"wl wl-kjv\" data-code=\"H74\">Abner</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> to <span class=\"wl wl-kjv\" data-code=\"H2275\">Hebron,</span> and <span class=\"wl wl-kjv\" data-code=\"H6242\">twenty</span> <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> with him. And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">made</span> <span class=\"wl wl-kjv\" data-code=\"H74\">Abner</span> and the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> that were with him a <span class=\"wl wl-kjv\" data-code=\"H4960\">feast.</span>","21":"And <span class=\"wl wl-kjv\" data-code=\"H74\">Abner</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> I will <span class=\"wl wl-kjv\" data-code=\"H6965\">arise</span> and <span class=\"wl wl-kjv\" data-code=\"H3212\">go,</span> and will <span class=\"wl wl-kjv\" data-code=\"H6908\">gather</span> all <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> unto my <span class=\"wl wl-kjv\" data-code=\"H113\">lord</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> that they may <span class=\"wl wl-kjv\" data-code=\"H3772\">make</span> a <span class=\"wl wl-kjv\" data-code=\"H1285\">league</span> with thee, and that thou mayest <span class=\"wl wl-kjv\" data-code=\"H4427\">reign</span> over all that thine <span class=\"wl wl-kjv\" data-code=\"H5315\">heart</span> <span class=\"wl wl-kjv\" data-code=\"H183\">desireth.</span> And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> ➔ <span class=\"wl wl-kjv\" data-code=\"H74\">Abner</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">away;</span> and he <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> in <span class=\"wl wl-kjv\" data-code=\"H7965\">peace.</span>","22":"And, behold, the <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> of <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> and <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> from pursuing a <span class=\"wl wl-kjv\" data-code=\"H1416\">troop,</span> and brought <span class=\"wl wl-kjv\" data-code=\"H935\">in</span> a <span class=\"wl wl-kjv\" data-code=\"H7227\">great</span> <span class=\"wl wl-kjv\" data-code=\"H7998\">spoil</span> with them: but <span class=\"wl wl-kjv\" data-code=\"H74\">Abner</span> was not with <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> in <span class=\"wl wl-kjv\" data-code=\"H2275\">Hebron;</span> for he had sent him <span class=\"wl wl-kjv\" data-code=\"H7971\">away,</span> and he was <span class=\"wl wl-kjv\" data-code=\"H3212\">gone</span> in <span class=\"wl wl-kjv\" data-code=\"H7965\">peace.</span>","23":"When <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab</span> and all the <span class=\"wl wl-kjv\" data-code=\"H6635\">host</span> that was with him were <span class=\"wl wl-kjv\" data-code=\"H935\">come,</span> they <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H74\">Abner</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H5369\">Ner</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> and he hath sent him <span class=\"wl wl-kjv\" data-code=\"H7971\">away,</span> and he is <span class=\"wl wl-kjv\" data-code=\"H3212\">gone</span> in <span class=\"wl wl-kjv\" data-code=\"H7965\">peace.</span>","24":"Then <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> What hast thou <span class=\"wl wl-kjv\" data-code=\"H6213\">done?</span> behold, <span class=\"wl wl-kjv\" data-code=\"H74\">Abner</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> unto thee; why is it that thou hast sent him <span class=\"wl wl-kjv\" data-code=\"H7971\">away,</span> and he is <span class=\"wl wl-kjv\" data-code=\"H1980\">quite</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">gone?</span>","25":"Thou <span class=\"wl wl-kjv\" data-code=\"H3045\">knowest</span> <span class=\"wl wl-kjv\" data-code=\"H74\">Abner</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H5369\">Ner,</span> that he <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to <span class=\"wl wl-kjv\" data-code=\"H6601\">deceive</span> thee, and to <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> thy going <span class=\"wl wl-kjv\" data-code=\"H4161\">out</span> and thy coming <span class=\"wl wl-kjv\" data-code=\"H4126\">in,</span> and to <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> all that thou <span class=\"wl wl-kjv\" data-code=\"H6213\">doest.</span>","26":"And when <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab</span> was come <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> from <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> he <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> <span class=\"wl wl-kjv\" data-code=\"H4397\">messengers</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> <span class=\"wl wl-kjv\" data-code=\"H74\">Abner,</span> which brought him <span class=\"wl wl-kjv\" data-code=\"H7725\">again</span> from the <span class=\"wl wl-kjv\" data-code=\"H953\">well</span> of <span class=\"wl wl-kjv\" data-code=\"H5626\">Sirah:</span> but <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H3045\">knew</span> it not.","27":"And when <span class=\"wl wl-kjv\" data-code=\"H74\">Abner</span> was <span class=\"wl wl-kjv\" data-code=\"H7725\">returned</span> to <span class=\"wl wl-kjv\" data-code=\"H2275\">Hebron,</span> <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab</span> took him <span class=\"wl wl-kjv\" data-code=\"H5186\">aside</span> <span class=\"wl wl-kjv\" data-code=\"H413\">in</span> the <span class=\"wl wl-kjv\" data-code=\"H8179\">gate</span> to <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> with him <span class=\"wl wl-kjv\" data-code=\"H7987\">quietly,</span> and <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> him there under the <span class=\"wl wl-kjv\" data-code=\"H2570\">fifth</span> rib, that he <span class=\"wl wl-kjv\" data-code=\"H4191\">died,</span> for the <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> of <span class=\"wl wl-kjv\" data-code=\"H6214\">Asahel</span> his <span class=\"wl wl-kjv\" data-code=\"H251\">brother.</span>","28":"And <span class=\"wl wl-kjv\" data-code=\"H310\">afterward</span> when <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> it, he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> I and my <span class=\"wl wl-kjv\" data-code=\"H4467\">kingdom</span> are <span class=\"wl wl-kjv\" data-code=\"H5355\">guiltless</span> before the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H5704\">for</span> <span class=\"wl wl-kjv\" data-code=\"H5769\">ever</span> from the <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> of <span class=\"wl wl-kjv\" data-code=\"H74\">Abner</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H5369\">Ner:</span>","29":"Let it <span class=\"wl wl-kjv\" data-code=\"H2342\">rest</span> on the <span class=\"wl wl-kjv\" data-code=\"H7218\">head</span> of <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab,</span> and on all his <span class=\"wl wl-kjv\" data-code=\"H1\">father's</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house;</span> and let there not <span class=\"wl wl-kjv\" data-code=\"H3772\">fail</span> from the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab</span> one that hath an <span class=\"wl wl-kjv\" data-code=\"H2100\">issue,</span> or that is a <span class=\"wl wl-kjv\" data-code=\"H6879\">leper,</span> or that <span class=\"wl wl-kjv\" data-code=\"H2388\">leaneth</span> on a <span class=\"wl wl-kjv\" data-code=\"H6418\">staff,</span> or that <span class=\"wl wl-kjv\" data-code=\"H5307\">falleth</span> on the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword,</span> or that <span class=\"wl wl-kjv\" data-code=\"H2638\">lacketh</span> <span class=\"wl wl-kjv\" data-code=\"H3899\">bread.</span>","30":"So <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab</span> and <span class=\"wl wl-kjv\" data-code=\"H52\">Abishai</span> his <span class=\"wl wl-kjv\" data-code=\"H251\">brother</span> <span class=\"wl wl-kjv\" data-code=\"H2026\">slew</span> <span class=\"wl wl-kjv\" data-code=\"H74\">Abner,</span> because he had <span class=\"wl wl-kjv\" data-code=\"H4191\">slain</span> their <span class=\"wl wl-kjv\" data-code=\"H251\">brother</span> <span class=\"wl wl-kjv\" data-code=\"H6214\">Asahel</span> at <span class=\"wl wl-kjv\" data-code=\"H1391\">Gibeon</span> in the <span class=\"wl wl-kjv\" data-code=\"H4421\">battle.</span>","31":"And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span cl s=\"wl wl-kjv\" data-code=\"H5036\">fool</span> <span class=\"wl wl-kjv\" data-code=\"H4194\">dieth?</span>","34":"Thy <span class=\"wl wl-kjv\" data-code=\"H3027\">hands</span> were not <span class=\"wl wl-kjv\" data-code=\"H631\">bound,</span> nor thy <span class=\"wl wl-kjv\" data-code=\"H7272\">feet</span> <span class=\"wl wl-kjv\" data-code=\"H5066\">put</span> into <span class=\"wl wl-kjv\" data-code=\"H5178\">fetters:</span> as a man <span class=\"wl wl-kjv\" data-code=\"H5307\">falleth</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> <span class=\"wl wl-kjv\" data-code=\"H5766\">wicked</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">men,</span> so <span class=\"wl wl-kjv\" data-code=\"H5307\">fellest</span> thou. And all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H1058\">wept</span> <span class=\"wl wl-kjv\" data-code=\"H3254\">again</span> over him.","35":"And when <span class=\"wl wl-kjv\" data-code=\"H3605\">all</span> the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to <span class=\"wl wl-kjv\" data-code=\"H1262\">cause</span> ➔ <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> to <span class=\"wl wl-kjv\" data-code=\"H1262\">eat</span> <span class=\"wl wl-kjv\" data-code=\"H3899\">meat</span> while it was <span class=\"wl wl-kjv\" data-code=\"H5750\">yet</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H7650\">sware,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> So <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> to me, and more <span class=\"wl wl-kjv\" data-code=\"H3254\">also,</span> if I <span class=\"wl wl-kjv\" data-code=\"H2938\">taste</span> <span class=\"wl wl-kjv\" data-code=\"H3899\">bread 7\">day</span> <span class=\"wl wl-kjv\" data-code=\"H7390\">weak,</span> though <span class=\"wl wl-kjv\" data-code=\"H4886\">anointed</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king;</span> and these <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H6870\">Zeruiah</span> be too <span class=\"wl wl-kjv\" data-code=\"H7186\">hard</span> for me: the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall <span class=\"wl wl-kjv\" data-code=\"H7999\">reward</span> the doer of <span class=\"wl wl-kjv\" data-code=\"H6213\">evil</span> according to his <span class=\"wl wl-kjv\" data-code=\"H7451\">wickedness.</span>"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"lange krijg","tekst":"Deze krijg schijnt geduurd te hebben vijf jaren. Want ten tijde van den eersten strijd [waarvan 2Sa 2:12, enz.], hadden David en Isboseth twee jaren beiden geregeerd, gelijk afgenomen wordt uit 2Sa 2:10 en vergelijking van 2Sa 2:4, 2Sa 2:9 aldaar; waaruit te zien is dat zij beiden op één tijd begonnen hebben te regeren. David nu heeft te Hebron geregeerd zeven jaren en zes maanden, 2Sa 2:11, totdat, Isboseth omgebracht zijnde [onder, 2Sa 4:6-7 ] , David over gans Israël tot koning werd gezalfd, 2Sa 5:3. Zodat deze oorlog de vijf overige jaren en enige maanden schijnt geduurd te hebben."},{"catchword":"ging en werd sterker;","tekst":"Hebreeuws, was gaande en sterk wordende; dat is, werd al sterker en sterker."},{"catchword":"die van het huis Sauls werden zwakker","tekst":"Hebreeuws, het huis Sauls waren gaande en zwak, of, dun, uitgeput wordende; dat is, die van Sauls huis werden al kleiner en kleiner, of machtelozer. Zie Gen 26:13; Jon 1:11."}],"3":[{"catchword":"Chileab,","tekst":"Anders genaamd Daniël; 1Ch 3:1."},{"catchword":"de huisvrouw van Nabal,","tekst":"Zie boven, 2Sa 2:2."},{"catchword":"Absalom,","tekst":"Hebreeuws, Abschalom"},{"catchword":"Máächa,","tekst":"Bekeerd zijnde tot de ware religie."},{"catchword":"Gesur;","tekst":"Hebreeuws, Geschur; gelijk onder, 2Sa 13:37-38, en 2Sa 14:23, en 2Sa 15:8. Een stad, gelegen in het noorden, aan de grenzen van Gilead, vooraan in het gedeelte van Syrië, genaamd Trachonitis. Zie Deu 3:14; Jos 12:5; onder, 2Sa 15:8. Daar zijn ook Gerusieten geweest tegen het zuiden van Kanaän, naar Egypte toe, 1Sa 27:8, van welken David, te Ziklag zijnde, groten roof haalde."}],"4":[{"catchword":"Sefatja,","tekst":"Hebreeuws, Schepatia."}],"5":[{"catchword":"Davids huisvrouw","tekst":"Waarom deze hier alleen Davids huisvrouw genoemd wordt, daar zij toch allen zijn huisvrouwen waren, daarvan is verscheiden gevoelen. Sommigen menen dat deze de allervoortreffelijkste en voornaamste, anderen dat zij de geringste geweest is, en nergens zonderling door bekend dan dat David haar getrouwd had. Het eenvoudigste schijnt te wezen dat er een andere van dien naam geweest mag zijn, en deze hierdoor van die onderscheiden."}],"6":[{"catchword":"sterkte","tekst":"Bekomende, door zijn grote manhaftigheid en kloeke daden, zonderlinge macht, autoriteit en aanzien, zelfs bij den koning Isboseth, gelijk blijkt in het volgende. Anders, zich kloekelijk gedroeg voor Sauls huis."}],"7":[{"catchword":"Rizpa,","tekst":"Van deze, zie onder, 2Sa 21:8, 2Sa 21:10-11, enz."},{"catchword":"ingegaan","tekst":"Dat is, hebt bij haar gelegen. Het schijnt dat Isboseth vermoeden heeft gehad, alsof Abner wel mocht trachten naar het koninkrijk."}],"8":[{"catchword":"ontstak Abner zeer","tekst":"Hebreeuws, ontstak den Abner zeer; te weten de toorn. Zie Gen 4:5."},{"catchword":"hondskop,","tekst":"Dat is, veracht, of van geen waarde. Vergelijk 1Sa 24:15, en Deu 23:18, onder, 2Sa 9:8, en 2Sa 16:9."},{"catchword":"ik, die tegen Juda,","tekst":"Anders, die van, met, of voor Juda is? Zou ik heden, enz.; dat is, alsof ik het met Juda hield, of tot Juda overgelopen was, of tot Juda behoorde? Daar ik integendeel zo en zo gedaan heb en nog doe, enz."},{"catchword":"overgeleverd heb in Davids hand,","tekst":"Hebreeuws, heb doen vinden; dat is, heb doen vallen, of overgeleverd in Davids Hand."},{"catchword":"aan mij onderzoekt","tekst":"Of, gij legt mij te last, bezoekt mij heden [vanwege] enz. Of, bezoekt over mij; dat is, gij wilt mij onderzoeken en als terechtstellen en straffen om een misdaad, die ik aan deze vrouw zou hebben bedreven? Daar gij zulks behoordet over te zien. Of, gij straft mij alsof het waar is. Is dit mijn loon voor al mijn getrouwe diensten? Zo onverdragelijk viel hem deze bestraffing."},{"catchword":"ener vrouw?","tekst":"Dat is, met ene, of deze vrouw bedreven."}],"9":[{"catchword":"God doe Abner zo,","tekst":"Van deze manier van zweren, zie Rth 1:17, en 1Ki 19:2."},{"catchword":"HEERE aan David gezworen heeft,","tekst":"Niettegenstaande hij dat wel wist, had hij evenwel Sauls huis voorgestaan en David tegengestaan. Zie ook vs.18."}],"10":[{"catchword":"oprichtende","tekst":"Of, bevestigende"},{"catchword":"Dan tot Ber-séba toe","tekst":"Dit waren de uiterste landpalen van Kanaän: Dan in het noorden en Berseba in het zuiden. Zie 1Ki 4:25."}],"11":[{"catchword":"hij kon Abner verder niet een woord antwoorden,","tekst":"Isboseth."},{"catchword":"vreesde","tekst":"Zorgende dat hij harder behandeld zijnde, wel in ernst mocht doen, hetgeen hij maar uit toornigheid scheen te dreigen, en dat vanwege zijn macht en het aanzien, dat hij had; boven, vs.6."}],"12":[{"catchword":"voor zich tot David,","tekst":"Of, in zijn plaats; dat is, inplaats van zelf te komen, of, uit zijn eigen naam, maar niet uit des konings Isboseths of des rijks naam. Anders, inplaats van dat; dat is, daarom, derhalve."},{"catchword":"Wiens is het land?","tekst":"Hij wil zeggen: Het koninkrijk van Israëls land komt toch niemand toe dan u, wien het van God beloofd is."}],"13":[{"catchword":"hij zeide","tekst":"David."},{"catchword":"Wel,","tekst":"Of, het is wel, het is goed; dat is, uw voorslag bevalt mij wel, ik neem dat aan."},{"catchword":"zeggende","tekst":"Dat is, te weten dit, enz."},{"catchword":"aangezicht niet zien,","tekst":"Vergelijk Gen 43:3."},{"catchword":"Michal,","tekst":"Davids eerste huisvrouw, van welke de Schriftuur betuigt, dat zij hem beminde en hem getrouw was geweest; 1Sa 18:20, 1Sa 18:28, en 1Sa 19:11-12."}],"14":[{"catchword":"boden tot Isbóseth,","tekst":"Om alzo Abner gelegenheid te geven, dat hij, zonder Isboseths achterdenken, zijn belofte mocht volbrengen."},{"catchword":"honderd voorhuiden der Filistijnen","tekst":"Volgens Sauls eis, die David door dat middel meende van kant te helpen door de Filistijnen. Zie en 1Sa 18:25-27."}],"15":[{"catchword":"Isbóseth dan zond heen,","tekst":"Zonder twijfel door Abner overreed zijnde, dien hij, vermits vrees, niets durfde weigeren."},{"catchword":"nam haar","tekst":"Dat is, liet haar door de gezonden boden nemen."},{"catchword":"Paltiël,","tekst":"Ook genaamd Palti, aan wien Saul deze Michal, nadat David gevlucht was, ter vrouw gegeven heeft; 1Sa 25:44."}],"16":[{"catchword":"Bahurim toe","tekst":"Gelegen in Benjamin, onder, 2Sa 19:16, nabij de grenzen van Juda, naar uitwijzen der kaarten."}],"17":[{"catchword":"woorden met de oudsten van Israël,","tekst":"Hebreeuws, Abners woord [of handel, raadslag ] was, of was geweest met, enz. Vergelijk 1Ki 1:7, en Num 31:16."},{"catchword":"te voren lang tot een koning over u begeerd","tekst":"Hebreeuws, ook gisteren, ook eergisteren."}],"19":[{"catchword":"ook voor de oren van Benjamin","tekst":"Gelijk hij met de oudsten van Israël gedaan had."},{"catchword":"spreken","tekst":"Om David rapport te doen van al hetgeen dat Israël, en bijzonderlijk Benjamin, goedgevonden en verklaard hadden."},{"catchword":"ganse huis van Benjamin","tekst":"Versta, het merendeel; want er waren nog al velen het huis Sauls toegedaan, dewijl Saul uit Benjamins stam gesproten was. Zie 1Sa 9:16, en 1Sa 10:20-21; 1Ch 12:29, en vergelijk deze manier van spreken met Mat 3:5, en Phi 2:21, enz."}],"21":[{"catchword":"over alles,","tekst":"Of, naar alles, of, ganselijk als enz.; dat is, naar uws harten wens."}],"22":[{"catchword":"bende,","tekst":"Of, een troep, een hoop stropende krijgslieden, die zij achterhaald en geplunderd hadden."}],"24":[{"catchword":"vrij is weggegaan?","tekst":"Hebreeuws, gaande gegaan is."}],"25":[{"catchword":"overreden,","tekst":"Met zoete woorden te verleiden. Zie Jdg 14:15."},{"catchword":"uitgang en uw ingang,","tekst":"Dat is, uw handel en wandel, uw regering buiten en binnen. Zie Deu 28:6."}],"26":[{"catchword":"boden na,","tekst":"Alsof de koning hem nog iets te zeggen had, hoewel het buiten des konings weten was, gelijk volgt."},{"catchword":"bornput van Sira;","tekst":"Of, gracht, waterpoel, waterbak; gelegen ten noorden van Hebron, dicht bij, aan den weg, die van Hebron naar Jeruzalem en Benjamin gaat, volgens de kaarten."}],"27":[{"catchword":"stilte met hem te spreken;","tekst":"Of, vreedzaamlijk; alsof hij hem alleen en in het heimelijke vertrouwder wijze wat had te zeggen."},{"catchword":"vijfde rib,","tekst":"Gelijk boven, 2Sa 2:23."},{"catchword":"om des bloeds wil van zijn broeder Asahel","tekst":"Dat is, van den doodslag, dien hij aan zijn broeder Asahel begaan had, boven, 2Sa 2:23, en onder, vs.30. Zie Gen 4:9-10."}],"28":[{"catchword":"bij den HEERE,","tekst":"Hebreeuws, van bij den HEERE; alsof hij zeide: Ik ben vrij van straf bij den Heere, die dezen moord noch mij, noch mijn koninkrijk zal toerekenen."},{"catchword":"bloed van Abner,","tekst":"Hebreeuws, bloeden; gelijk Gen 4:9-10, enz."}],"29":[{"catchword":"Het blijve op het hoofd van Joab,","tekst":"Te weten, bloed; zie Jdg 9:24."},{"catchword":"afgesneden,","tekst":"Dat is, er zij in Joabs huis altijd iemand, die deze plagen of enige van die onderworpen is."},{"catchword":"vloed hebbe,","tekst":"Zie Lev 15:2, enz."},{"catchword":"aan den stok houde,","tekst":"Dat is, die ongezond, zwak, machteloos of lam is."}],"30":[{"catchword":"Abisai Abner doodgeslagen,","tekst":"Hieruit blijkt dat Abisai van dezen moord mede geweten en daartoe geraden heeft, hoewel hij in het voorgaande niet is genoemd."},{"catchword":"strijd gedood had","tekst":"En dienvolgens niet moorddadiglijk, gelijk Joab Abner had gedaan. Zie boven, 2Sa 2:20-23."}],"31":[{"catchword":"scheurt uw klederen,","tekst":"Zie Gen 37:29."},{"catchword":"zakken aan,","tekst":"Zie Gen 37:34."},{"catchword":"voor Abner henen;","tekst":"Dat is, voor het lijk, gelijk in het volgende wordt verklaard. Vergelijk Luk 7:14."},{"catchword":"baar","tekst":"Of, het lijk. Hebreeuws, bed; dat is, waarin Abner lag en gedragen werd."}],"33":[{"catchword":"Is dan Abner gestorven,","tekst":"Alsof hij zeide: Is het niet jammer dat zulk een dapper krijsheld zo deerlijk zijn leven heeft moeten verliezen, alsof hij een van de snoodste mensen ware, of iemand, die zich zonder enigen tegeweer zottelijk laat ombrengen. Doch dat zal [wil David zeggen] zijn krijgslof niet verduisteren."}],"34":[{"catchword":"Uw handen waren niet gebonden,","tekst":"David wil zeggen dat Joab wel bevonden zou hebben dat hij met een krijgsman te doen had, die handen en voeten reppen kon, indien hij hem voor de vuist [gelijk men zegt] had bevochten."},{"catchword":"kinderen der verkeerdheid","tekst":"Of, zonen der verkeerdheid, ongerechtigheid, schalkheid, gelijk onder, 2Sa 7:10, dat is, gans verkeerde mensen. Waarmede David Joab en zijn broeder openlijk doorstrijkt en dien schandelijken moord verwijt. Aangaande de manier van spreken [kinderen, of zonen der verkeerdheid] dezelve is in de Heilige Schrift elders dikwijls gebruikt. Alzo, kinderen Belials; dat is, der ondeugd, of ongebondenheid, halsstarrigheid, Deu 13:13; kinderen der overtreding, Isa 57:4; kinderen der ongehoorzaamheid, Eph 2:2; kinderen der duisternis, 1Th 5:5, gelijk ter contrarie, kinderen der kloekheid, of dapperheid, boven, 2Sa 2:7; kinderen des lichts, Eph 5:8, en dergelijke meer. Vergelijk onder, 2Sa 12:5."},{"catchword":"meer over hem","tekst":"Of, wederom. Hebreeuws, het ganse volk voeren voort, of deden toe te wenen over hem."}],"35":[{"catchword":"brood te doen eten,","tekst":"Dat is, om hem te vermanen dat hij wat zou nuttigen, zich met spijs verkwikken en sterken."},{"catchword":"God doe mij zo,","tekst":"Gelijk boven, vs.9."},{"catchword":"ondergaan der zon","tekst":"Want zulks was de orde in een recht vasten, dat men zich van alle spijs onthield tot op den avond; alzo boven, 2Sa 1:12, enz."}],"36":[{"catchword":"goed in hun ogen,","tekst":"Dat is, het beviel het volk wel."}],"37":[{"catchword":"van den koning niet was,","tekst":"Dat is, dat het des konings raad en wil gans niet geweest was."}],"38":[{"catchword":"gevallen is?","tekst":"En dat dienvolgens de moordenaar van zulk een personaadje tot een exempel van anderen strengelijk behoorde gestraft te worden?"}],"39":[{"catchword":"teder,","tekst":"Dat is, ik ben nog gering van macht. Een gelijkenis van een jong kind genomen."},{"catchword":"gezalfd ten koning,","tekst":"Dat is, ik ben nog zwak en jong in mijn koninkrijk. Ik ben wel van Samuel gezalfd tot een koning over gans Israël, maar heb nog inderdaad geen stam onder mij dan Juda alleen."},{"catchword":"harder dan ik;","tekst":"Dat is, machtiger en vaster, dan dat ik hen zou durven of kunnen naar behoren straffen, vermits het groot aanzien, dat zij bij het krijgsvolk hebben. Aldus schijnt David [die zoveel proeven van Gods genadigen bijstand had] de politieke consideratiën en menselijke vrees al te veel toegegeven te hebben, uitstellende de straf tot bekwamer gelegenheid, die hij nochtans bij zijn leven niet heeft gevonden of waargenomen, bevelende eindelijk de wraak zijnen zoon Salomo; 1Ki 2:5."},{"catchword":"de HEERE zal den boosdoener vergelden","tekst":"Dewijl het mij aan de macht nu ontbreekt, zo zal de Almachtige God hem straffen, of mij de macht nog verlenen, dat ik het doe of doe doen. Zie het begin hiervan onder, 2Sa 19:13, het vervolg 1Ki 2:5-6, en de volle uitvoering 1Ki 2:34."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"And there was a long war between the house of Saul and between the house of David: [This war seemeth to have lasted five years. For at the time of the first battle (whereof chap.2.12.etc.) David and Isboseth, both of them, had reigned two years, as appeareth from chap.2.10. compare with v.4.and 9. of the same chapter: from whence may be gathered, that they both began to reign at one and the same time. Now David reigned at Hebron seven years and six moneths, chap.2.11. until such time that Isboseth being slain, (below chap.4.6, 7.) he was anointed King over all Israel, chap 5.3. So that this war seemeth to have lasted the five remaining years and certain months] but David&acirc;&euro;&trade;s went and grew stronger, [Heb. was going, and growing strong: i.e. grew stronger] but those of the house of Saul went and grew weaker. [Heb. the house of Saul were going and growing weak, or, thin, exhausted: i.e. those of the house of Saul grew smaller and smaller, or lesse powerful. See Gen.26.on v.13. Jon.1.on v.11.]"}],"2":[{"catchword":null,"tekst":"And unto David were sons born at Hebron: Now his first-born was Amnon, of Achinoam, the Jizreelitesse."}],"3":[{"catchword":null,"tekst":"And his second was Chileab, [Otherwise called Daniel, 1 Chron.3.1.] of Abigail, the wife of Nabal, [see above chap.2.on vers.2.] the Carmelite: and the third Absalom, [Heb. Abslom] the son of Maacha [Being converted to the true Religion] the Daughter of Thalmai, King of Gesur: [Heb. Geschur, as below, chap.13.37, 38. & 14.13. & 15.8. A city lying in the North, on the frontiers or borders of Gilead, in the sore-part of the division of Syria, called Trachonites. See Deut.3.14. Jos.12.5. below chap.15.8. There were also Gestures on the South-side of Canaan, toward Egypt, 1 Sam.27.8. from whom David, being at Ziklag, fetched great store of prey.]"}],"4":[{"catchword":null,"tekst":"And the fourth Adonia, the son of Haggith: and the fifth Sephatia, [Heb. Schepatia] the son of Abital:"}],"5":[{"catchword":null,"tekst":"And the sixth, Jithream, by Egla, David&acirc;&euro;&trade;s wife: [There be divers opions concerning the question, why this woman only is called in this place David&acirc;&euro;&trade;s wife, whereas all the rest before mentioned were his wives like-wife? Some conceive that she was the most excellent and chiefest of all David&acirc;&euro;&trade;s wives; others, that she was the meanest, and of lowest condition among them all, and known by nothing peculiar and special, but that David had taken her to wife. But the truest and most probable opion seemeth to be this, that it&acirc;&euro;&trade;s possible there might have been another woman of the same name, and that this was distinguished from that other by this appellation, or addition] these were born to David at Hebron."}],"6":[{"catchword":null,"tekst":"While that war was between the house of Saul, and between the house of David, it came to pass&Atilde;&copy;, that Abner made himself strong in the house of Saul. [Getting by his great courage, and valiant acts, special power, authority, and respect, even with King Isboseth himself, as appeareth in the following verses. Oth behaved himself valiantly for Sauls house.]"}],"7":[{"catchword":null,"tekst":"Now Saul had a concubine, whose name was Rizpa, the daughter of Aija: [Of this woman, see below, chap.12.8,10,11, etc.] and (I boseth) said unto Abner, Wherefore hast thou gone unto my fathers concubine? [i.e. hast layen with her. It seemeth that Isboseth had a shrewd suspicion of Abner, as if he asired after the Crown.]"}],"8":[{"catchword":null,"tekst":"Then Abner was much incensed [Heb. kindled to Abner greatly; viz.anger, wrath. See Genes.4.on vers.5.] for Isboseth&acirc;&euro;&trade;s words, and said; Am I a Dogs heads, [i.ee. base and contemptible, of no worth, value, esteem. Compare 1 Sa.24.15. and Deu.23.18. below c.9.8. and 16.9.] I who against Juda do shew kindness this day unto the house of Saul thy father, to his brethren, and to his friends, [Oth. that I should be of, with, or, for Juda? Should I this day, etc. i.e. as if I held with Juda, or had revolted to Juda, or, belonged to Juda? whereas on the contrary I have done thus and thus, and yet still do, etc.] and have not delivered thee into the hand of David [Heb. have made to be found; i.e. have made to fall, or, delivered into David&acirc;&euro;&trade;s hand] that thou searchest on me the iniquity of a woman? [i.e. committed with a woman, or with this woman. Or, thou layest to my charge, visitest me to day (for, or, because of) etc. or, visitest upon me: i.e. thou wilt examine me, and bring me to a trial, and punish me, for a fault which I should have committed toward this woman? Whereas thou should have connived and wink at it: or reprovest me, as if it were true: Is this my reward for all my true and faithful services? So intolerable was this reproof unto him.]"}],"9":[{"catchword":null,"tekst":"Let God do so to Abner, and let him so add thereunto, [Of this manner of swearing, see Ruth 1.on v.17. and 1 Kings 19.on v.2.] surely, according as the LORD hath sworn to David, [Notwithstanding that he knew this full well, yet nevertheless he had assisted the house of Saul, and resisted or opposed David. See also v.18.] even so will I do to him;"}],"10":[{"catchword":null,"tekst":"Transforming the Kingdom from the house of Saul, and setting up [Or, establishing] the throne of David over Israel and over Juda, from Dan to Berseba. [These were the uttermost borders of Canaan. Dan in the North, and Berseba in the South. See 1 Kings 4.on v.25.]"}],"11":[{"catchword":null,"tekst":"And he [viz. Isboseth] could not answer Abner a word more, because he feared him. [Fearing, if he should be roughly dealt withal, he would do that in good earnest, which he only seemed to threaten in his passion: and that in regard of his power, and the authority which he had, above verse.6.]"}],"12":[{"catchword":null,"tekst":"Then Abner sent messengers to David in behalf of himself, [Or. In his stead; i.e. in stead of coming himself, or, in his own name, but not the name of King Isboseth, or the Kingdom. Oth. instead of that: i.e. therefore, in that respect, regard] saying; whose is the land? [As if he should say, the Kingdom of Israels Land, belongeth indeed to no man, but to thee, to whom it was promised by God] saying (further;) Make thee a league with me, and behold, my hand shall be with thee, to turn about all Israel unto thee."}],"13":[{"catchword":null,"tekst":"And he [viz. David] said, well, [Or, &acirc;&euro;&tilde;tis well, &acirc;&euro;&tilde;tis good: i.e. thy project pleaseth me well; I accept of it] I will make a covenant with thee: but one thing I reuire of thee, saying; [i.e. to wit this, etc.] Thou shall not see my face, [Compare Genes.43.3.] unless thou first bring in Michal, Sauls daughter, [David&acirc;&euro;&trade;s first wife, of ehom the Scripture witnesseth, that she loved him, and had been faithful to him, 1 Sam.18.20, 28. and 19.11, 12.] When thou comest to see my face."}],"14":[{"catchword":null,"tekst":"David also sent messengers unto Isboseth, the son of Saul, [Thus to give occasion to Abner, to fulfil his promise without the least suspicion of Isboseth] saying: Give (me) my wife Michal, whom I have espoused unto me, with a hundred foreskins of the Philistines. [According to Sauls bargain, who by that means thought to have destroyed David by the hands of the Philistines. See 1 Sam.18.25, 27.]"}],"15":[{"catchword":null,"tekst":"Then Isboseth sent forth, [Without doubt, being over-ruled and perswaded by Abner, whom through fear he durst deny nothing] etc took her [i.e. caused her to be taken by the messengers sent by him] from (her) husband, from Paltiel, [called also Palti, to whom Saul gave this Michal to wife, after David was sted, 1 Sa. 25.44.] the son of Lais."}],"16":[{"catchword":null,"tekst":"And her husband went with her, going and crying after her unto Bahurim: [Lying in Benjamin, below cha.19.16. hard by the borders of Juda, as the Maps do shew.] Then said Abner unto him; return; depart, return; and he returned."}],"17":[{"catchword":null,"tekst":"Now Abner had words with the eldest of Israel [Heb. Abners word, (or, dealing, advice) was, or, had been with,&c. Compare 1 Kings 17. and Num 31:16.] saying: Ye desire David long ago [Heb. also yesterday, also ere yesterday] to (be) King over you."}],"18":[{"catchword":null,"tekst":"Therefore do it now: for the LORD hath spoken unto David, saying, By the hand of my servant David I will deliver my people of Israel from the hand of the Philistines, and from the hand of all their enemies."}],"19":[{"catchword":null,"tekst":"And Abner also spake before the ears of Benjamin, [As he had done with the Eldest of Israel] moreover, Abner went also his way, to speak before the ears of David at Hebron, all that was good in the eyes of Israel, and in the eyes of the whole house of Benjamin. [Meaning the greatest part: for as yet many were addicted to the house of Saul, because Saul came of the tribe of Benjamin. See 1 Sam.16.and10.20, 21. 1 Chron.12.29. Compare this phrase with Mat 3:5.and Php 2:21,&c. To speak before the ears of David,&c. i.e. to report unto David all that Israel, and especially Benjamin had found good and declared]"}],"20":[{"catchword":null,"tekst":"And Abner came to David to Hesbron, and twenty men with him; and David made Abner, and the man that were with him, a feast."}],"21":[{"catchword":null,"tekst":"Then said Abner unto David; I will get me up, and go my ways, and gather all Israel together unto my Lord the King, that they may make a league with thee, and that thou mayest reign over all that thy soul desireth: [Or, according to all, or, altogether as, &c. i.e. according to thy hearts wish, and desire] So David let Abner go, and he went in peace."}],"22":[{"catchword":null,"tekst":"And behold David&acirc;&euro;&trade;s servant, and Joab came from a band, [Or, a troop, a company of roving Souldiers, whom they had overtaken and plundered] and brought with them great prey: now Abner, he was not with David at Hebron; for hre had let him go, and he was gone in peace."}],"23":[{"catchword":null,"tekst":"Now when Joab, etc all the host that was with him, were come, then they told Joab, saying; Abner, the son of Ner, is come to the King, and he hath let him go, and he is gone in peace."}],"24":[{"catchword":null,"tekst":"Then Joab went in to the King, etc said; what hast thou done? Behold, Abner is come unto thee; now, why hast thou let him go, that he is gone so free away? [Heb. going is gone]"}],"25":[{"catchword":null,"tekst":"Thou knowest Abner, the son of Ner that he is come to thee; [i.e. To seduce thee with sweet flattering words. See Judg.14.on v.15.] and to know thy going out, and thy coming in, [i.e. thy dealing & conversation thy managing of affairs both at home & abroad, within doors and without doors. See Deut.28.on vers.6.] yea to know all that thou doest."}],"26":[{"catchword":null,"tekst":"And Joab went forth from David, and sent messengers after Abner, [As if the King had yet something further to say to him: although it was without the Kings privity, as followeth] which brought him again from that well of Sira: [Or, fountain, or, well, pit, or pool of Sira: laying Northward off from Hebron, close by the way that goeth from Hebron to Jerusalem and Benjamin, as the Maps do shew] but David knew it not."}],"27":[{"catchword":null,"tekst":"Now when Abner returned to Hebron, then Joab led him aside in the midst of the gate, to speak with him quietly: [Or, peceaceably, as if he had something to tell him in a confident manner, secretly and in private] and he smote him there on the fifth rib, [As above chap.2.23.] that he died for his brother Asahels blood. [i.e. slaughter, which he had committed on his brother Asahel: above chap.2.23.and below v.30. See Gen 4:9, 10.]"}],"28":[{"catchword":null,"tekst":"Afterward when David heard that, he said; I am guiltless, and my Kingdom, with the LORD, [Heb. From, with the LORD: as if he had said, I am free from punishment before the Lord, who will not impute this murder to me, nor to my Kingdom] for ever from the blood [Heb. bloods: as Gen 4:9,10,&c.] of Abner the son of Ner."}],"29":[{"catchword":null,"tekst":"Let it [viz. Blood: see Judg.9.on ver.24.] rest on the head of Joab, and on all his fathers house: and let there not be out off from the houser of Joab, that hath an issue, [see Lev.15.2,&c.] and is leprous, and that leaneth on the staff, [i.e. that is crasie, weak, seeble, or lame] and falleth by the sword, and lacketh bread, [i.e. let there be ever in Joabs house some person that is subject and liable to these plagues, or some of them.]"}],"30":[{"catchword":null,"tekst":"Thus Joab and Abisai his brother slew Abner, [Hence it appeareth, that Abisai was privy to this murther, although he be not named in the foregoing verses] because he had slain their brother Asahel at Gibeon in the battle. [and consequently in a murderous way, as Joab had done Abner: see above chap. 2. 20, 21, 22, 23.]"}],"31":[{"catchword":null,"tekst":"Then David said unto Joab, and to all the people that was with him, Rent your garments, [See Gen.37.on v.24.] and gird you with sacks, [see Gen.37.on vers.34.] and mourn before Abner: [i.e. before the corps, as is declared in the following words. Compare Luk 7:14.] and King David went after the Bier. [or, Corps, Heb. Bed; i.e. wherein Abner lay and was carried.]"}],"32":[{"catchword":null,"tekst":"Now when they buried Abner at Hebron, then the King lift up his voice, and wept at Abners grave; also all the people wept."}],"33":[{"catchword":null,"tekst":"And the King made a lamentation over Abner, and said; Did then Abner die, as a fool dieth? [As if he had said, Is it not a sad thing that such a valiant champion hath been said to lose his life in such a piteous way, as if he had been one of the vil // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}

document.addEventListener('click', e => {
