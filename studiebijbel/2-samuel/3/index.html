 in te gaan, dan met twee handen of twee voeten in het eeuwige vuur geworpen te worden. En als uw oog u doet struikelen, trek het uit en werp het van u weg. Het is beter voor u om met één oog het leven in te gaan, dan met twee ogen in het helse vuur geworpen te worden.", "Gal 3:10": "Want zovelen als er uit de werken van de wet zijn, die zijn onder de vloek; want er is geschreven: Vervloekt is ieder die niet blijft in alles wat geschreven is in het boek van de wet, om dat te doen.", "Spr 18:7": "De mond van de dwaas is voor hemzelf een verstoring, en zijn lippen zijn een strik voor zijn ziel.", "2 Sam 3:6-21": "Terwijl die oorlog was tussen het huis van Saul en het huis van David, gebeurde het dat Abner zich sterk maakte voor het huis van Saul. Saul had een bijvrouw gehad, met de naam Rizpa, dochter van Aja; en Isboseth zei tegen Abner: Waarom bent u naar mijn vaders bijvrouw gegaan? Toen ontstak Abner in grote woede over de woorden van Isboseth, en zei: Ben ik dan een hondenkop, ik, die tegen Juda, aan het huis van Saul, uw vader, aan zijn broers en aan zijn vrienden, tot op vandaag trouw bewijs, en u niet in Davids hand overgeleverd heb, dat u mij vandaag beschuldigt vanwege de schuld met deze vrouw?", "2 Sam 15:30": "En David ging op door de opgang van de olijven, terwijl hij opging en weende, en zijn hoofd was bedekt; en hij zelf ging blootsvoets; ook had heel het volk dat bij hem was, ieder zijn hoofd bedekt, en zij gingen op, terwijl zij opgingen en weenden.", "Openb 2:22": "Zie, Ik werp haar op een bed, en hen die met haar overspel bedrijven in grote verdrukking, als zij zich niet bekeren van hun werken.", "1 Sam 25:42": "Abigaïl nu haastte zich, en maakte zich op, en zij reed op een ezel, met haar vijf jonge dienaressen, die haar voetstappen navolgden; zij dan volgde de boden van David na, en zij werd hem tot vrouw.", "1 Kon 2:28-33": "Toen het bericht Joab bereikte (want Joab had zich achter Adonia geschaard, hoewel hij zich niet achter Absalom had geschaard), vluchtte Joab naar de tent van de HEERE, en greep de hoornen van het altaar vast. En het werd de koning Salomo verteld dat Joab naar de tent van de HEERE gevlucht was, en zie, hij is bij het altaar. Toen stuurde Salomo Benaja, de zoon van Jojada, en zei: Ga, val op hem aan. En Benaja kwam bij de tent van de HEERE, en zei tegen hem: Zo zegt de koning: Kom naar buiten. En hij zei: Nee, hier zal ik sterven! En Benaja bracht het antwoord terug aan de koning en zei: Zo heeft Joab gesproken, en zo heeft hij mij geantwoord.", "Ex 20:5": "U zult zich daarvoor niet buigen, en ze niet dienen; want Ik, de HEERE, uw God, ben een ijverig God, Die de misdaad van de vaders bezoek aan de kinderen, aan het derde en aan het vierde geslacht van hen die Mij haten;", "Openb 22:19": "En als iemand iets afdoet van de woorden van het boek van deze profetie, zal God zijn deel afdoen uit het boek des levens, en uit de heilige stad, en uit wat in dit boek geschreven is.", "Joh 12:42": "Toch geloofden ook zelfs velen van de leiders in Hem; maar om de Farizeeën beleden zij het niet, opdat zij niet uit de synagoge geworpen zouden worden.", "Gal 6:7": "Dwaal niet; God laat Zich niet bespotten; want wat de mens ook zaait, dat zal hij ook maaien.", "Gen 6:12": "Toen zag God de aarde, en zie, zij was verdorven; want alle vlees had zijn weg verdorven op de aarde.", "Nahum 1:8-10": "En met een doorgaande vloed zal Hij haar plaats volledig vernietigen; en duisternis zal Zijn vijanden vervolgen. Wat bedenkt u tegen de HEERE? Hij zal zelf een einde maken; de benauwdheid zal niet tweemaal opkomen. Omdat zij als doornen ineengevlochten zijn, en dronken zijn zoals zij plegen dronken te zijn, zo worden zij helemaal verteerd, als een dorre stoppel.", "1 Kon 1:6": "En zijn vader had hem nooit bedroefd door te zeggen: Waarom hebt u zo gedaan? En ook was hij zeer knap van gedaante, en Haggith had hem gebaard na Absalom.", "Job 1:20": "Toen stond Job op, en scheurde zijn mantel, en schoor zijn hoofd, en viel op de aarde, en boog zich neer;", "Openb 6:2": "En ik zag, en zie, een wit paard, en Die daarop zat, had een boog; en Hem is een kroon gegeven, en Hij ging uit, overwinnend, en om te overwinnen!", "Jes 11:4": "Maar Hij zal de armen met gerechtigheid oordelen, en de zachtmoedigen van het land met rechtmatigheid bestraffen; doch Hij zal de aarde slaan met de roede van Zijn mond, en met de adem van Zijn lippen zal Hij de goddeloze doden.", "Openb 21:8": "Maar de bangen, en ongelovigen, en verfoeilijken, en moordenaars, en hoereerders, en tovenaars, en afgodendienaars, en alle leugenaars, hun deel is in de poel die daar brandt van vuur en zwavel; dat is de tweede dood.", "Ps 28:4": "Geef hun naar hun doen, en naar de boosheid van hun handelingen; geef hun naar het werk van hun handen; laat de vergelding voor hen tot hen terugkeren.", "Fil 3:19": "Van wie het einde het verderf is, van wie God de buik is, en van wie de heerlijkheid in hun schande is, die aardse dingen bedenken.", "2 Kon 8:13": "En Hazaël zei: Wat is uw dienaar toch, die een hond is, dat hij deze grote zaak zou doen? En Elisa zei: De HEERE heeft mij getoond dat u koning zult zijn over Syrië.", "2 Sam 3:28-37": "Toen David dat later hoorde, zei hij: Ik ben onschuldig, en mijn koninkrijk is dat, bij de HEERE, tot in eeuwigheid, aan het bloed van Abner, de zoon van Ner. Het moet blijven op het hoofd van Joab, en op heel het huis van zijn vader; en het mag van het huis van Joab niet ontbreken dat er iemand is die een vloed heeft, of melaats is, of zich aan de kruk moet vasthouden, of door het zwaard valt, of gebrek aan brood heeft! Zo hebben Joab en zijn broer Abisaï Abner doodgeslagen, omdat hij hun broer Asaël te Gibeon in de strijd had gedood.", "Ps 73:27": "Want zie, wie ver van U zijn, zullen vergaan; U roeit uit al wie van U afhoereert;", "Ps 147:6": "De HEERE houdt de zachtmoedigen staande; de goddelozen vernedert Hij, tot op de aarde toe.", "Ps 68:28": "Daar is Benjamin de kleine, die over hen heerste, de vorsten van Juda, met hun vergadering, de vorsten van Zebulon, de vorsten van Naftali.", "Spr 26:10": "De groten doen ieder verdriet aan, en huren de dwazen, en huren de overtreders.", "Hos 13:1": "Toen Efraïm sprak, beefde men; hij heeft zich verheven in Israël; maar hij is schuldig geworden aan de Baäl en is gestorven.", "Ezech 9:5-7": "Maar tot die anderen zei Hij voor mijn oren: Ga door de stad achter hem, en sla, uw oog verschoont niet, en spaar niet! Dood oude mensen, jonge mannen en meisjes, en kinderen en vrouwen, tot het verderven toe; maar kom niemand nabij op wie het teken is, en begin bij Mijn heiligdom. En zij begonnen bij de oude mannen, die vóór het huis waren. En Hij zei tot hen: Verontreinig het huis, en vervul de voorhoven met gedoden; ga naar buiten. En zij gingen naar buiten, en zij sloegen in de stad.", "Rom 11:22": "Zie dan de goedertierenheid en de strengheid van God; de strengheid wel over hen die gevallen zijn, maar de goedertierenheid over u, als u in de goedertierenheid blijft; anders zult ook u afgehouwen worden.", "Ps 3:8": "Sta op, HEERE, verlos mij, mijn God; want U hebt al mijn vijanden op het kinnebakken geslagen; de tanden van de goddelozen hebt U verbrijzeld.", "2 Sam 20:1": "Toen was daar bij toeval een man van Belial, wiens naam was Seba, een zoon van Bichri, een man van Jemini; die blies op de bazuin, en zei: Wij hebben geen deel aan David, en wij hebben geen erfenis aan de zoon van Isaï, ieder naar zijn tenten, o Israël!", "Ps 39:12": "Kastijdt U iemand met straffen om de ongerechtigheid, dan doet U zijn schoonheid wegteren als door een mot; zeker, ieder mens is ijdelheid. Sela.", "2 Sam 15:32": "En het gebeurde, toen David tot op de hoogte kwam, waar hij God aanbad, zie, toen ontmoette Husai, de Archiet, hem, met zijn kleed gescheurd, en aarde op zijn hoofd.", "2 Sam 13:13": "Want ik, waarheen zou ik mijn schande brengen? En u, u zou zijn als een van de dwazen in Israël; spreek toch nu met de koning, want hij zal mij niet aan u onthouden.", "Hos 14:10": "Wie is wijs? die begrijpt deze dingen; wie is verstandig? die bekent ze; want de wegen van de Heere zijn recht, en de rechtvaardigen zullen daarin wandelen, maar de overtreders zullen daarin vallen.", "Gal 5:20": "Afgoderij, toverij, vijandschappen, ruzies, jaloersheden, toorn, twisten, verdeeldheid, afwijkingen in de leer,", "1 Sam 3:11-14": "En de HEERE zei tegen Samuël: Zie, Ik doe een ding in Israël, dat bij ieder die het horen zal, beide oren zullen tuiten. Op diezelfde dag zal Ik over Eli alles tot stand brengen wat Ik tegen zijn huis gesproken heb; Ik zal het beginnen en voltooien. Want Ik heb hem laten weten dat Ik zijn huis zal oordelen tot in eeuwigheid, vanwege het ongerecht dat hij gekend heeft; want toen zijn zonen zich vervloekt hebben gemaakt, heeft hij hen niet eens streng aangezien.", "Ps 62:4": "Hoelang zult u kwaad aanstichten tegen een man? U zult allen gedood worden; u zult zijn als een ingebogen wand, een aangestoten muur.", "Jes 37:1": "Het gebeurde nu, toen koning Hizkia dat hoorde, dat hij zijn kleren scheurde, en zich met een zak bedekte, en het huis van de HEERE inging.", "2 Kron 19:7": "Nu dan, laat de vrees voor de HEERE op u zijn; wees zorgvuldig, en doe het; want bij de HEERE, onze God, is geen onrecht, geen aanneming van personen, en geen ontvangst van geschenken.", "Spr 25:5": "Doe de goddeloze weg van het aangezicht van de koning, en zijn troon zal door gerechtigheid bevestigd worden.", "1 Kon 15:16": "En er was oorlog tussen Asa en Baësa, de koning van Israël, al hun dagen.", "Pred 8:13": "Maar de goddeloze zal het niet goed gaan, en hij zal zijn dagen niet verlengen; hij zal zijn als een schaduw, omdat hij niet vreest voor het aangezicht van God.", "Num 27:18-23": "Toen zei de HEERE tegen Mozes: Neem Jozua, de zoon van Nun, een man in wie de Geest is, bij u; en leg uw hand op hem; En stel hem voor Eleazar, de priester, en voor de hele vergadering; en geef hem opdracht voor hun ogen; En leg iets van uw waardigheid op hem, opdat zij luisteren, namelijk de hele vergadering van de kinderen van Israël.", "Ezech 25:7": "Daarom, zie, Ik zal Mijn hand tegen u uitstrekken, en u aan de heidenvolken tot buit geven, en Ik zal u uit de volken uitroeien, en u uit de landen doen verdwijnen; Ik zal u verdelgen; en u zult weten dat Ik de HEERE ben.", "2 Sam 3:13-16": "En hij zei: Goed, ik zal een verbond met u sluiten; maar één ding vraag ik van u: u zult mijn gezicht niet zien, als u niet eerst Michal, Sauls dochter, meebrengt, wanneer u komt om mijn gezicht te zien. Ook zond David boden naar Isboseth, de zoon van Saul, en zei: Geef mij mijn vrouw Michal, die ik mij met honderd voorhuiden van de Filistijnen ondertrouwd heb. Isboseth dan stuurde iemand, en nam haar van de man, van Paltiël, de zoon van Lais.", "Jes 57:20": "Maar de goddelozen zijn als een voortgejaagde zee, want die kan niet tot rust komen, en haar water werpt slijk en modder op.", "Ezech 22:31": "Daarom heb Ik Mijn gramschap over hen uitgegoten; door het vuur van Mijn verbolgenheid heb Ik hen verteerd; hun weg heb Ik op hun hoofd gegeven, spreekt de Heere HEERE.", "Ps 121:8": "De HEERE zal uw uitgaan en uw ingaan bewaren, van nu aan tot in eeuwigheid.", "Joël 2:1": "Waait op de bazuin te Sion, en roept luide op de berg van Mijn heiligheid; laat alle inwoners van het land beroerd zijn, want de dag van de HEERE komt, want hij is nabij.", "1 Petr 4:18": "En als de rechtvaardige nauwelijks behouden wordt, waar zal dan de goddeloze en de zondaar verschijnen?", "Spr 22:5": "Doornen en strikken liggen op de weg van de verkeerde; wie zijn ziel bewaart, zal zich ver daarvan houden.", "Ezra 9:5": "En rond het avondoffer stond ik op uit mijn bedruktheid, nadat ik mijn kleed en mijn mantel gescheurd had; en ik boog mij op mijn knieën, en breidde mijn handen uit tot de HEERE, mijn God;", "1 Sam 25:22": "Zo doet God aan de vijanden van David, en zo doet Hij daar nog aan toe, als ik van allen die hij heeft iets tot morgen overlaat dat mannelijk is!", "2 Sam 3:2-5": "En David werden zonen geboren in Hebron. Zijn eerstgeborene was Amnon, van Ahinoam, de Jizreëlietische; en zijn tweede was Chileab, van Abigaïl, de vrouw van Nabal, de Karmeliet; en de derde, Absalom, de zoon van Maächa, de dochter van Thalmai, koning van Gesur; en de vierde, Adonia, de zoon van Haggith; en de vijfde Sefatja, de zoon van Abital;", "Spr 6:12-15": "Een nietsnut, een verdorven man, gaat om met een verkeerde mond; hij knipoogt met zijn ogen, spreekt met zijn voeten, wijst met zijn vingers; in zijn hart zijn verkeerdheden, hij smeedt voortdurend kwaad, hij zaait ruzie.", "2 Sam 13:36": "En het gebeurde, toen hij was uitgesproken, zie, dat de zonen van de koning kwamen, en hun stemmen verhieven en huilden; en de koning ook, en al zijn knechten, huilden zeer luid.", "Luk 19:27": "Maar breng die vijanden van mij, die niet wilden dat ik koning over hen zou zijn, hier, en dood ze hier voor mij.", "Mark 8:38": "Want wie zich voor Mij en Mijn woorden zal schamen, in dit overspelig en zondig geslacht, voor hem zal ook de Zoon des mensen Zich schamen, wanneer Hij komt in de heerlijkheid van Zijn Vader, met de heilige engelen.", "Gen 3:15": "En Ik zal vijandschap zetten tussen u en de vrouw, en tussen uw nageslacht en haar Nageslacht; Dat zal u de kop vermorzelen, en u zult Het de hiel vermorzelen.", "Luk 22:22": "En de Zoon des mensen gaat wel heen, zoals besloten is; maar wee die mens, door wie Hij verraden wordt!", "Jak 5:1-3": "Welaan nu, u rijken, huil en jammer over uw ellenden, die over u komen. Uw rijkdom is verrot, en uw kleren zijn door de motten opgegeten. Uw goud en zilver is verroest; en hun roest zal tegen u getuigen, en zal uw vlees verteren als een vuur. U hebt schatten verzameld in de laatste dagen.", "Zef 1:12-18": "En het zal gebeuren in die tijd, Ik zal Jeruzalem met lantaarns doorzoeken; en Ik zal bezoeking doen over de mannen die star geworden zijn op hun droesem, die in hun hart zeggen: De HEERE doet geen goed, en Hij doet geen kwaad. Daarom zal hun vermogen tot roof worden, en hun huizen tot verwoesting; zij bouwen wel huizen, maar zij zullen ze niet bewonen; en zij planten wijngaarden, maar zij zullen de wijn daarvan niet drinken. De grote dag van de HEERE is nabij; hij is nabij, en zeer haastende; de stem van de dag van de HEERE; de held zal daar bitter schreeuwen.", "Richt 9:57": "Op dezelfde manier liet God al het kwaad van de mensen van Sichem op hun hoofd terugkomen; en de vloek van Jotham, de zoon van Jerubbaäl, kwam over hen.", "Jes 13:8": "en zij zullen verschrikt worden, smarten en weeën zullen hen aangrijpen, zij zullen bang zijn als een barende vrouw; ieder zal over zijn naaste verbaasd zijn; hun gezichten zullen vlammende gezichten zijn.", "Spr 12:2": "De goede zal een welgevallen krijgen van de HEERE; maar een man van schandelijke verdichtsels zal Hij verdoemen.", "1 Sam 19:11-17": "Maar Saul zond boden naar Davids huis, om hem te bewaken, en om hem 's morgens te doden. Dit maakte Michal, zijn vrouw, aan David bekend, en zei: Als u vannacht uw leven niet redt, zult u morgen gedood worden. En Michal liet David door een venster naar beneden, en hij ging heen, en vluchtte, en ontkwam. En Michal nam een beeld, en legde het in het bed, en legde een geitenvel aan zijn hoofdkussen, en dekte het met een kleed toe.", "1 Kron 28:9": "En u, mijn zoon Salomo, ken de God van uw vader, en dien Hem met een volkomen hart en met een gewillige ziel; want de HEERE doorzoekt alle harten, en Hij doorziet elk bedenksel van de gedachten; als u Hem zoekt, zal Hij door u gevonden worden; maar als u Hem verlaat, zal Hij u voor altijd verstoten.", "Joh 18:35": "Pilatus antwoordde: Ben ik soms een Jood? Uw eigen volk en de overpriesters hebben U aan mij overgeleverd; wat hebt U gedaan?", "1 Kon 2:34": "En Benaja, de zoon van Jojada, ging omhoog, en viel op hem aan, en doodde hem; en hij werd begraven in zijn huis, in de woestijn.", "Openb 11:18": "en de volken waren toornig geworden, en Uw toorn is gekomen, en de tijd van de doden, om geoordeeld te worden, en om het loon te geven aan Uw dienstknechten, de profeten, en de heiligen, en aan hen die Uw Naam vrezen, de kleinen en de groten; en om hen te verderven die de aarde verdierven.", "1 Sam 12:25": "Maar als u toch kwaad blijft doen, zult u, evengoed als uw koning, omkomen.", "Gen 43:3": "Toen sprak Juda tegen hem en zei: Die man heeft ons op het hoogste betuigd en gezegd: U zult mijn gezicht niet zien, als uw broer niet bij u is.", "Mark 11:26": "Maar als u niet vergeeft, zal ook uw Vader, Die in de hemelen is, uw overtredingen niet vergeven.", "Jes 50:11": "Zie, u allen, die een vuur aansteekt, die u met vuurvonken omgordt! Wandel in de vlam van uw vuur, en in de vuurvonken die u ontstoken hebt. Dit overkomt u van Mijn hand: in smart zult u neerliggen.", "Deut 3:14": "Jaïr, de zoon van Manasse, kreeg de hele landstreek van Argob, tot aan het gebied van de Gezurieten en Maächatieten; en hij noemde ze naar zijn naam, Bazan-Havvoth-Jaïr, tot op deze dag.", "Spr 19:16": "Die het gebod bewaart, bewaart zijn ziel; die zijn wegen veracht, zal sterven.", "2 Sam 19:41-43": "En zie, alle mannen van Israël kwamen naar de koning; en zij zeiden tegen de koning: Waarom hebben onze broeders, de mannen van Juda, u gestolen, en hebben zij de koning en zijn huis over de Jordaan gebracht, en alle mannen van David met hem? Toen antwoordden alle mannen van Juda de mannen van Israël: Omdat de koning ons nauw verwant is; en waarom zijn jullie nu boos over deze zaak? Hebben wij dan ook maar iets gegeten op kosten van de koning, of heeft hij ons een geschenk gegeven? En de mannen van Israël antwoordden de mannen van Juda, en zeiden: Wij hebben tien delen aan de koning, en ook aan David hebben wij, meer dan jullie, recht; waarom hebben jullie ons dan geringschat, zodat ons woord niet het eerste geweest is bij het terughalen van onze koning? Maar het woord van de mannen van Juda was harder dan het woord van de mannen van Israël.", "Joh 3:15": "Opdat ieder die in Hem gelooft, niet verloren gaat, maar het eeuwige leven heeft.", "2 Sam 2:12-31": "Toen trok Abner, de zoon van Ner, uit, met de knechten van Isboseth, de zoon van Saul, van Mahanaim naar Gibeon. Joab, de zoon van Zeruja, en de knechten van David, trokken ook uit; en zij ontmoetten elkaar bij de vijver van Gibeon; en zij bleven zitten, dezen aan deze zijde van de vijver, en die aan gene zijde van de vijver. En Abner zei tegen Joab: Laat de jongens nu opstaan, en voor onze ogen spelen. En Joab zei: Laat hen opstaan.", "Spr 10:3": "De HEERE laat de ziel van de rechtvaardige niet hongeren; maar de have van de goddelozen stoot Hij weg.", "Ps 52:7": "God zal u ook afbreken voor eeuwig; Hij zal u wegrapen en u uit de tent uitrukken; ja, Hij zal u uitwortelen uit het land van de levenden. Sela.", "Ps 89:33": "dan zal Ik hun overtreding met de roede bezoeken, en hun ongerechtigheid met plagen.", "Hos 5:9": "Efraïm zal tot verwoesting worden, op de dag van de straf; onder de stammen van Israël heb Ik bekendgemaakt wat zeker is.", "Jer 36:31": "En Ik zal over hem, en over zijn nageslacht, en over zijn dienaren hun ongerechtigheid bezoeken; en Ik zal over hen, en over de inwoners van Jeruzalem, en over de mannen van Juda, al het kwaad brengen dat Ik tot hen gesproken heb; maar zij hebben niet geluisterd.", "1 Joh 3:15": "Ieder die zijn broeder haat, is een moordenaar; en u weet dat geen moordenaar het eeuwige leven in zich heeft blijven.", "Ps 89:4": "Ik heb een verbond gemaakt met Mijn uitverkorene; Ik heb Mijn knecht David gezworen:", "Job 34:22": "Er is geen duisternis, en er is geen schaduw van de dood, dat daar de werkers van de ongerechtigheid zich verbergen mochten.", "Ps 68:22": "Zeker zal God de kop van Zijn vijanden verslaan, de harige schedel van hem die in zijn schulden wandelt.", "Hos 5:4-6": "Zij richten hun daden niet zo in dat zij zich tot hun God bekeren; want de geest van de hoererijen is in hun midden, en de Heere kennen zij niet. Daarom zal Israël hoogmoed in zijn gezicht getuigen; en Israël en Efraïm zullen vallen door hun ongerechtigheid; ook Juda zal met hen vallen. Met hun schapen en met hun runderen zullen zij dan gaan om de Heere te zoeken, maar niet vinden; Hij heeft Zich van hen teruggetrokken.", "Ps 119:21": "U scheldt de vervloekte hoogmoedigen, die van Uw geboden afdwalen.", "Luk 6:44": "Want iedere boom wordt aan zijn eigen vrucht gekend; want men plukt geen vijgen van doornen, en men snijdt geen druif van bramen.", "2 Sam 3:14-16": "Ook zond David boden naar Isboseth, de zoon van Saul, en zei: Geef mij mijn vrouw Michal, die ik mij met honderd voorhuiden van de Filistijnen ondertrouwd heb. Isboseth dan stuurde iemand, en nam haar van de man, van Paltiël, de zoon van Lais. En haar man ging met haar mee, huilend achter haar aan lopend, tot Bahurim toe. Toen zei Abner tegen hem: Ga weg, keer terug. En hij keerde terug.", "Mark 6:18": "Want Johannes had tegen Herodes gezegd: Het is u niet geoorloofd de vrouw van uw broer te hebben.", "Num 15:31": "Want zij heeft het woord van de HEERE veracht en Zijn gebod vernietigd; die ziel zal helemaal uitgeroeid worden; haar ongerechtigheid is op haar.", "Jer 9:1": "Och, dat mijn hoofd water was, en mijn oog een springader van tranen! Dan zou ik dag en nacht bewenen de verslagenen van de dochter van mijn volk.", "Matt 10:33": "Maar wie Mij verloochend zal hebben voor de mensen, die zal Ik ook verloochenen voor Mijn Vader, Die in de hemelen is.", "Deut 23:18": "U zult geen hoerenloon noch hondenprijs in het huis van de HEERE, uw God, brengen, voor enige gelofte; want ook die beide zijn de HEERE, uw God, een gruwel.", "Gen 50:11": "Toen de inwoners van het land, de Kanaänieten, die rouw zagen op het plein van het doornbos, zeiden zij: Dit is een zware rouw van de Egyptenaars; daarom noemde men haar naam Abel-mizraim, dat aan de overzijde van de Jordaan is.", "Ps 145:20": "Schin. De HEERE bewaart allen die Hem liefhebben; maar Hij verdelgt alle goddelozen.", "Ezech 9:10": "Daarom ook, wat Mij aangaat, Mijn oog zal niet verschonen, en Ik zal niet sparen; Ik zal hun weg op hun hoofd geven.", "2 Kron 23:3": "En heel de gemeente sloot een verbond in het huis van God, met de koning; en hij zei tegen hen: Zie, de zoon van de koning zal koning zijn, zoals de HEERE over de zonen van David gesproken heeft.", "2 Sam 12:17": "Toen kwamen de oudsten van zijn huis naar hem toe, om hem te laten opstaan van de aarde; maar hij wilde niet, en at ook geen brood met hen.", "1 Kon 2:22": "Toen antwoordde de koning Salomo, en zei tegen zijn moeder: En waarom vraagt u Abisag, de Sunamitische, voor Adonia? Vraag ook het koninkrijk voor hem (want hij is mijn oudere broer), ja, voor hem, en voor Abjathar, de priester, en voor Joab, de zoon van Zeruja.", "Ps 89:20-24": "Toen hebt Gij in een gezicht gesproken van Uw heilige, en gezegd: Ik heb hulp besteld bij een held; Ik heb een verkorene uit het volk verhoogd. Ik heb David, Mijn knecht, gevonden; met Mijn heilige olie heb Ik hem gezalfd; met wie Mijn hand vast blijven zal; ook zal hem Mijn arm versterken.", "Joh 5:29": "en zij zullen uitgaan, zij die het goede gedaan hebben tot de opstanding van het leven, en zij die het kwade gedaan hebben tot de opstanding van het oordeel.", "2 Sam 3:20-23": "En Abner kwam bij David te Hebron, met twintig mannen. En David richtte voor Abner en de mannen die bij hem waren een maaltijd aan. Toen zei Abner tegen David: Ik zal opstaan en heengaan, en heel Israël verzamelen bij mijn heer de koning, zodat zij een verbond met u sluiten, en u regeert over alles wat uw hart begeert. Zo liet David Abner gaan, en hij ging in vrede. En zie, Davids dienaren en Joab kwamen terug van een strooptocht, en brachten een grote buit met zich mee. Abner was toen niet bij David te Hebron, want hij had hem laten gaan, en hij was in vrede vertrokken.", "2 Sam 16:9-11": "Toen zei Abisai, de zoon van Zeruja, tegen de koning: Waarom zou deze dode hond mijn heer de koning vloeken? Laat mij toch oversteken en zijn kop wegnemen. Maar de koning zei: Wat heb ik met u te doen, zonen van Zeruja? Ja, laat hem vloeken; want de HEERE heeft immers tegen hem gezegd: Vloek David; wie zou dan zeggen: Waarom hebt u dat gedaan? Verder zei David tegen Abisai en tegen al zijn knechten: Zie, mijn zoon, die uit mijn lijf is voortgekomen, zoekt mijn leven; hoeveel te meer dan nu deze zoon van Jemini? Laat hem begaan, laat hij vloeken, want de HEERE heeft het hem gezegd.", "Luk 16:5-8": "En hij riep ieder van de schuldenaars van zijn heer bij zich, en zei tegen de eerste: Hoeveel bent u mijn heer schuldig? En hij zei: Honderd vaten olie. En hij zei tegen hem: Neem uw schuldbekentenis, en ga zitten, en schrijf haastig vijftig. Daarna zei hij tegen een ander: En u, hoeveel bent u schuldig? En hij zei: Honderd mudden tarwe. En hij zei tegen hem: Neem uw schuldbekentenis, en schrijf tachtig.", "2 Sam 2:2": "Zo trok David daarheen op, en ook zijn twee vrouwen, Ahinoam, de Jizreëlietische, en Abigaïl, de vrouw van Nabal, de Karmeliet.", "Gen 50:7": "En Jozef trok op, om zijn vader te begraven; en met hem trokken op alle knechten van Farao, de oudsten van zijn huis, en al de oudsten van het land Egypte;", "Matt 21:19": "En Hij zag een vijgenboom aan de weg, ging ernaartoe, en vond er niets aan dan alleen bladeren; en Hij zei tegen hem: Laat er in eeuwigheid geen vrucht meer aan u komen! En de vijgenboom verdorde meteen.", "Mark 16:16": "Wie geloofd zal hebben, en gedoopt zal zijn, zal behouden worden; maar wie niet geloofd zal hebben, zal verdoemd worden.", "Richt 9:24": "opdat het geweld, gedaan aan de zeventig zonen van Jerubbaäl, tot uiting zou komen, en opdat hun bloed gelegd zou worden op Abimelech, hun broer, die hen gedood had, en op de burgers van Sichem, die zijn handen gesterkt hadden om zijn broers te doden.", "Jes 19:2": "Want Ik zal de Egyptenaren tegen de Egyptenaren verwarren, zodat zij zullen strijden, ieder tegen zijn broeder, en ieder tegen zijn naaste, stad tegen stad, koninkrijk tegen koninkrijk.", "2 Sam 15:23": "En heel het land weende met luide stem, terwijl heel het volk overging; ook ging de koning over de beek Kidron, en heel het volk ging over, recht in de richting van de weg naar de woestijn.", "1 Sam 24:15": "Achter wie is de koning van Israël uitgetrokken? Wie jaagt u na? Een dode hond, een enkele vlo!", "Joh 12:43": "Want zij hadden de eer van mensen lief, meer dan de eer van God.", "Gen 37:34": "Toen scheurde Jakob zijn kleren en legde een zak om zijn heupen; en hij bedreef rouw over zijn zoon, vele dagen.", "2 Tim 2:12": "als wij volharden, zullen wij ook met Hem heersen; als wij Hem verloochenen, zal Hij ons ook verloochenen;", "Fil 2:21": "Want zij zoeken allen hun eigen belang, niet wat van Christus Jezus is.", "Ps 2:9": "U zult hen verpletteren met een ijzeren scepter; U zult hen in stukken slaan als een pottenbakkersvat.", "Matt 16:26": "Want wat baat het een mens, als hij de hele wereld wint, en schade lijdt aan zijn ziel? Of wat zal een mens geven, als losprijs voor zijn ziel?", "2 Sam 13:38": "Zo vluchtte Absalom, en ging naar Gesur; en hij was daar drie jaar.", "Matt 26:65": "Toen scheurde de hogepriester zijn kleren en zei: Hij heeft God gelasterd, waarom hebben wij nog getuigen nodig? Zie, nu hebt u Zijn godslastering gehoord.", "Ps 119:155": "Het heil is ver van de goddelozen, want zij zoeken Uw inzettingen niet.", "Gal 5:19": "De werken van het vlees nu zijn openbaar; dat zijn: overspel, hoererij, onreinheid, losbandigheid,", "Ezech 33:7-20": "U dan, o mensenkind! Ik heb u tot een wachter gesteld over het huis van Israël; u zult dus het woord uit Mijn mond horen, en hen namens Mij waarschuwen. Als Ik tegen de goddeloze zeg: O goddeloze, u zult zeker sterven! en u spreekt niet, om de goddeloze van zijn weg af te manen, dan zal die goddeloze in zijn ongerechtigheid sterven, maar zijn bloed zal Ik van uw hand eisen. Maar als u de goddeloze van zijn weg an.", "2 Sam 17:18": "Een jongen zag hen echter, en vertelde het aan Absalom; doch die beiden gingen haastig weg, en kwamen in het huis van een man te Bahurim, die een put had in zijn binnenplaats, en zij daalden daarin af.", "Gen 37:29": "Toen Ruben nu naar de kuil terugkeerde, zie, Jozef was niet meer in de kuil; toen scheurde hij zijn kleren.", "Matt 24:51": "en hij zal hem in stukken houwen, en hem zijn deel geven met de huichelaars; daar zal geween zijn en het geknars van de tanden.", "2 Sam 15:6": "En op die manier deed Absalom met heel Israël, die tot de koning kwamen voor een rechtszaak. Zo stal Absalom het hart van de mannen van Israël.", "2 Sam 13:19": "Toen nam Thamar as en strooide die op haar hoofd, en scheurde de veelkleurige mantel die zij aanhad; en zij legde haar hand op haar hoofd, en liep luid schreiend weg.", "2 Tim 4:14": "Alexander, de kopersmid, heeft mij veel kwaad aangedaan; de Heere zal hem vergelden naar zijn werken.", "2 Kon 5:8": "Maar het gebeurde, toen Elisa, de man van God, gehoord had dat de koning van Israël zijn kleren had gescheurd, dat hij naar de koning stuurde, om te zeggen: Waarom hebt u uw kleren gescheurd? Laat hem nu naar mij toe komen, dan zal hij weten dat er een profeet in Israël is.", "Job 18:5-21": "Ja, het licht van de goddelozen zal uitgeblust worden, en de vonk van zijn vuur zal niet glinsteren. Het licht zal verduisteren in zijn tent, en zijn lamp zal boven hem uitgeblust worden. De stappen van zijn kracht zullen beperkt worden, en zijn eigen plan zal hem neerwerpen.", "1 Kon 4:25": "En Juda en Israël woonden zeker, ieder onder zijn wijnstok en onder zijn vijgenboom, van Dan tot Ber-seba toe, al de dagen van Salomo.", "2 Sam 20:1-13": "Toen was daar bij toeval een man van Belial, wiens naam was Seba, een zoon van Bichri, een man van Jemini; die blies op de bazuin, en zei: Wij hebben geen deel aan David, en wij hebben geen erfenis aan de zoon van Isaï, ieder naar zijn tenten, o Israël! Toen trok alle man van Israël weg van achter David, Seba, de zoon van Bichri, achterna; maar de mannen van Juda kleefden hun koning aan, van de Jordaan af tot aan Jeruzalem. Toen nu David in zijn huis te Jeruzalem kwam, nam de koning de tien vrouwen, zijn bijvrouwen, die hij achtergelaten had om het huis te bewaken, en bracht ze in een huis van bewaring, en onderhield ze, maar ging niet bij hen naar binnen. En zij bleven opgesloten tot de dag van hun dood, levend als weduwen.", "Matt 18:35": "Zo zal ook Mijn hemelse Vader met u doen, als u niet ieder van harte uw broeder zijn misdaden vergeeft.", "Ps 10:15": "Breek de arm van de goddeloze en de bozen; zoek zijn goddeloosheid, totdat U haar niet meer vindt.", "Jes 7:4": "En zeg tegen hem: Wees op uw hoede, en wees rustig, wees niet bang, en laat uw hart niet week worden vanwege die twee staarten van deze rokende vuurbranden, vanwege de ontsteking van de toorn van Rezin en van de Syriërs, en van de zoon van Remalia;", "Gen 42:16": "Stuur er één van u uit, die uw broer haalt; maar blijft u zelf gevangen, en uw woorden zullen beproefd worden, of de waarheid bij u is; en als dat niet zo is, zo waar als Farao leeft, dan bent u verspieders!", "Spr 24:17": "Verblijd u niet, als uw vijand valt; en als hij neerstruikelt, laat uw hart zich niet verheugen;", "2 Sam 3:6-12": "Terwijl die oorlog was tussen het huis van Saul en het huis van David, gebeurde het dat Abner zich sterk maakte voor het huis van Saul. Saul had een bijvrouw gehad, met de naam Rizpa, dochter van Aja; en Isboseth zei tegen Abner: Waarom bent u naar mijn vaders bijvrouw gegaan? Toen ontstak Abner in grote woede over de woorden van Isboseth, en zei: Ben ik dan een hondenkop, ik, die tegen Juda, aan het huis van Saul, uw vader, aan zijn broers en aan zijn vrienden, tot op vandaag trouw bewijs, en u niet in Davids hand overgeleverd heb, dat u mij vandaag beschuldigt vanwege de schuld met deze vrouw?", "Matt 3:7": "Toen hij dan velen van de Farizeeën en Sadduceeën naar zijn doop zag komen, zei hij tegen hen: Adderengebroed! Wie heeft u laten weten dat u moet vluchten voor de komende toorn?", "Luk 13:5-7": "Ik zeg u: Nee; maar als u zich niet bekeert, zult u allen net zo omkomen. En Hij vertelde deze gelijkenis: Iemand had een vijgenboom, geplant in zijn wijngaard; en hij kwam en zocht daarop vrucht, en vond ze niet. En hij zei tegen de wijngaardenier: Zie, ik kom nu al drie jaar vrucht zoeken op deze vijgenboom en vind ze niet; hak hem om; waarom put hij ook nog de grond onnodig uit?", "Spr 4:18": "Maar het pad van de rechtvaardigen is als een schijnend licht, dat voortgaat en meer licht geeft tot de volle dag toe.", "2 Petr 2:12-17": "Maar dezen, als onredelijke dieren, die de natuur volgen en geboren zijn om gevangen en gedood te worden, lasteren wat zij niet begrijpen, en zullen in hun verdorvenheid ook zelf verdorven worden; en zij zullen het loon van de onrechtvaardigheid ontvangen, omdat zij het als een genot beschouwen dagelijks in weelde te leven; zij zijn vlekken en smetten, en genieten uitbundig van hun eigen bedrog, terwijl zij met u aan de maaltijd zijn; zij hebben ogen vol overspel, die niet ophouden met zondigen; zij verleiden onvaste zielen, hebben een hart geoefend in hebzucht, en zijn kinderen van de vervloeking;", "Rom 2:1": "Daarom bent u niet te verontschuldigen, o mens, wie u ook bent die anderen oordeelt; want waarin u een ander oordeelt, veroordeelt u uzelf; want u, die anderen oordeelt, doet dezelfde dingen.", "Luk 4:23": "En Hij zei tegen hen: U zult zonder twijfel dit spreekwoord tegen Mij zeggen: Dokter, genees Uzelf; al wat wij gehoord hebben dat in Kapernaüm gebeurd is, doe dat ook hier in Uw vaderland.", "Num 35:33": "Zo zult u het land niet ontheiligen waarin u woont; want het bloed ontheiligt het land; en voor het land kan geen verzoening gedaan worden voor het bloed dat daarin vergoten is, dan door het bloed van hem die het vergoten heeft.", "2 Sam 5:13": "En David nam nog meer bijvrouwen en vrouwen uit Jeruzalem, nadat
