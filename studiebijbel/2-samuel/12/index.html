 ogen, laat men mij een plaats geven in een van de steden van het land, zodat ik daar kan wonen; want waarom zou uw knecht bij u in de koninklijke stad wonen?", "Jak 2:11": "Want Hij Die gezegd heeft: U zult geen overspel doen, heeft ook gezegd: U zult niet doden. Als u nu geen overspel doet, maar wel doodt, dan bent u een overtreder van de wet geworden.", "Ps 104:29": "Verbergt U Uw gezicht, zij worden angstig; neemt U hun adem weg, zij sterven, en zij keren terug tot hun stof.", "Mark 3:30": "Want zij zeiden: Hij heeft een onreine geest.", "Job 1:22": "In dit alles zondigde Job niet, en schreef God niets van het ongerijmd toe.", "Ezech 16:38": "Daarbij zal Ik u berechten naar de rechten van overspeelsters en bloedvergietsters; en Ik zal u overgeven aan het bloed van de grimmigheid en van het ijver.", "Joh 6:44": "Niemand kan tot Mij komen, als de Vader, Die Mij gezonden heeft, hem niet trekt; en Ik zal hem opwekken op de laatste dag.", "2 Kron 20:14": "Toen kwam de Geest van de HEERE in het midden van de samenkomst, op Jahaziël, de zoon van Zecharja, de zoon van Benaja, de zoon van Jehiël, de zoon van Matthanja, de Leviet, uit de zonen van Asaf;", "2 Petr 1:21": "Want de profetie is vroeger nooit voortgebracht door de wil van een mens, maar de heilige mensen van God hebben gesproken, gedreven door de Heilige Geest.", "2 Sam 7:1-5": "En het gebeurde, toen de koning in zijn huis zat, en de HEERE hem rust gegeven had van al zijn vijanden rondom, Dat de koning zei tegen de profeet Nathan: Zie toch, ik woon in een huis van cederhout, en de ark van God woont in het midden van de tentkleden. En Nathan zei tegen de koning: Ga heen, doe alles wat in uw hart is, want de HEERE is met u.", "2 Sam 24:10": "En het hart van David sloeg hem, nadat hij het volk geteld had; en David zei tegen de HEERE: Ik heb zwaar gezondigd in wat ik gedaan heb; maar neem nu toch, o HEERE, de misdaad van uw knecht weg, want ik heb heel dwaas gedaan.", "Job 13:15": "Zie, al doodde Hij mij, zou ik niet hopen? Toch zal ik mijn wegen voor Zijn aangezicht verdedigen.", "Ps 21:9": "Uw hand zal alle vijanden vinden; uw rechterhand zal uw haters vinden.", "Hand 15:20": "maar hun schrijven dat zij zich onthouden van de dingen die door de afgoden besmet zijn, en van hoererij, en van het verstikte, en van bloed.", "1 Kron 17:16-27": "Toen kwam koning David binnen, en bleef voor het aangezicht van de HEERE, en hij zei: Wie ben ik, HEERE God, en wat is mijn huis, dat U mij tot hiertoe gebracht hebt? En dit is nog klein geweest in Uw ogen, o God! Daarom hebt U over het huis van Uw knecht ook gesproken voor een verre toekomst, en U hebt mij naar menselijke maatstaf voorzien met deze verhoging, o HEERE God! Wat zal David hier verder aan toevoegen, vanwege de eer aan Uw knecht? Maar U kent Uw knecht wel.", "Joël 2:18": "Zo zal de HEERE ijveren over Zijn land, en Hij zal Zijn volk verschonen.", "Jes 54:10": "Want bergen zullen wijken, en heuvels wankelen; maar Mijn goedertierenheid zal van u niet wijken, en het verbond van Mijn vrede zal niet wankelen, zegt de HEERE, uw Ontfermer.", "Joh 3:36": "Wie in de Zoon gelooft, heeft het eeuwige leven; maar wie de Zoon ongehoorzaam is, zal het leven niet zien, maar de toorn van God blijft op hem.", "Ps 27:4": "Eén ding heb ik van de HEERE gevraagd, dat zal ik zoeken: dat ik alle dagen van mijn leven mag wonen in het huis van de HEERE, om de liefelijkheid van de HEERE te aanschouwen, en te onderzoeken in Zijn tempel.", "Dan 6:11": "Toen Daniël nu begreep dat dit geschrift ondertekend was, ging hij naar zijn huis (hij had namelijk in zijn bovenzaal open vensters in de richting van Jeruzalem), en hij knielde drie keer per dag op zijn knieën, en hij bad, en dankte voor het aangezicht van zijn God, geheel zoals hij hiervoor gedaan had.", "Ps 27:12": "Geef mij niet over in de begeerte van mijn tegenstanders; want valse getuigen zijn tegen mij opgestaan, alsook wie geweld uitblaast.", "Jer 1:2": "Tot wie het woord van de HEERE kwam, in de dagen van Josia, zoon van Amon, koning van Juda, in het dertiende jaar van zijn regering.", "Dan 11:36": "En die koning zal doen naar zijn welgevallen, en hij zal zichzelf verheffen, en zich groot maken boven elke god, en hij zal tegen de God der goden wonderlijke dingen spreken; en hij zal voorspoedig zijn, totdat de gramschap voltooid is, want het is vast besloten, het zal gebeuren.", "Luk 15:23": "en breng het gemeste kalf, en slacht het; en laten wij eten en vrolijk zijn.", "Ps 78:27-32": "En Hij regende op hen vlees als stof, en gevleugeld gevogelte als zand van de zeeën; En liet het vallen in het midden van zijn leger, rondom zijn woningen. Toen aten zij, en werden zeer zat; zodat Hij hun hun lust toebracht.", "Ps 40:18": "Ik ben wel ellendig en nooddruftig, maar de Heere denkt aan mij; Gij zijt mijn Hulp en mijn Bevrijder; o mijn God! wacht niet langer.", "Job 13:21": "Doe Uw hand ver van mij weg, en laat Uw verschrikking mij niet verbaasd maken.", "Ps 77:2": "Mijn stem is tot God, en ik roep; mijn stem is tot God, en Hij zal het oor tot mij neigen.", "Deut 7:13": "en Hij zal u liefhebben, en zal u zegenen, en u meer maken; en Hij zal de vrucht van uw buik zegenen, en de vrucht van uw land, uw koren, en uw most, en uw olie, de nakomelingen van uw koeien, en de kudden van uw kleinvee, in het land dat Hij uw vaderen gezworen heeft aan u te geven.", "Ps 39:14": "Wend U van mij af, dat ik verkwikt word, voordat ik heenga, en er niet meer ben.", "1 Joh 2:1": "Mijn kinderen, ik schrijf u deze dingen, opdat u niet zondigt. En als iemand gezondigd heeft, hebben wij een Voorspraak bij de Vader, Jezus Christus, de Rechtvaardige;", "Ps 80:2": "O Herder van Israël! Neem het ter oor, U Die Jozef als schapen leidde; U Die tussen de cherubs zit, verschijn blinkend.", "2 Tess 2:16": "En onze Heere Jezus Christus Zelf, en onze God en Vader, Die ons heeft liefgehad, en een eeuwige vertroosting en goede hoop gegeven heeft in genade,", "Lev 26:12": "En Ik zal in uw midden wandelen, en zal u tot een God zijn, en u zult Mij tot een volk zijn.", "Matt 17:5": "Terwijl hij nog sprak, zie, een lichtende wolk overschaduwde hen; en zie, een stem uit de wolk zei: Dit is Mijn geliefde Zoon, in wie Ik Mijn welbehagen heb; luister naar Hem!", "Gen 18:2-7": "En hij hief zijn ogen op en keek; en zie, daar stonden drie mannen tegenover hem; toen hij hen zag, liep hij hun tegemoet vanuit de deur van de tent, en boog zich tot op de grond. En hij zei: Heere! Als ik nu genade gevonden heb in Uw ogen, ga toch niet aan Uw knecht voorbij. Laat er toch een beetje water gebracht worden, en was Uw voeten, en rust onder deze boom.", "Deut 27:22": "Vervloekt is hij die bij zijn zuster ligt, de dochter van zijn vader of de dochter van zijn moeder! En heel het volk zal zeggen: Amen.", "Ps 119:154": "Twist mijn twistzaak, en verlos mij, maak mij levend, naar Uw toezegging.", "Jer 17:17": "Wees Gij mij niet tot een verschrikking; Gij zijt mijn Toevlucht ten dage van het kwaad.", "Deut 33:12": "En van Benjamin zei hij: De beminde van de HEERE, hij zal zeker bij Hem wonen. Hij zal hem de hele dag overdekken, en tussen Zijn schouders zal hij wonen!", "2 Kron 36:12": "En hij deed wat slecht was in de ogen van de HEERE, zijn God; hij verootmoedigde zich niet voor het aangezicht van de profeet Jeremia, die sprak uit de mond van de HEERE.", "1 Kor 6:20": "Want u bent duur gekocht: verheerlijk dan God in uw lichaam en in uw geest, die van God zijn.", "Luk 16:19-31": "En er was een zeker rijk mens, en die was gekleed met purper en zeer fijn linnen, en leefde elke dag vrolijk en overvloedig. En er was een zekere bedelaar, met de naam Lazarus, die voor zijn poort lag, vol zweren; En hij verlangde verzadigd te worden van de kruimels die van de tafel van de rijke vielen; maar ook de honden kwamen en likten zijn zweren.", "Fil 1:24": "Maar in het vlees te blijven is nodiger vanwege u.", "2 Sam 6:17": "Toen zij nu de ark van de HEERE naar binnen brachten, zetten zij die op haar plaats, in het midden van de tent die David voor haar gespannen had; en David offerde brandoffers voor het aangezicht van de HEERE, en dankoffers.", "2 Kon 10:10": "Weet nu, dat niets van het woord van de HEERE, dat de HEERE tegen het huis van Achab gesproken heeft, op de aarde zal vallen; want de HEERE heeft gedaan, wat Hij door de dienst van Zijn knecht Elia gesproken heeft.", "Openb 18:10": "Van verre staande uit vrees voor haar pijniging, en zeggen: Wee, wee, de grote stad Babylon, de sterke stad, want uw oordeel is in één uur gekomen.", "Num 16:48": "En hij stond tussen de doden en tussen de levenden; zo werd de plaag tot stilstand gebracht.", "1 Sam 16:3": "En u zult Isaï uitnodigen voor het offer, en Ik zal u laten weten wat u moet doen; en u zult Mij zalven degene die Ik u zeggen zal.", "1 Kor 14:32": "En de geesten der profeten zijn aan de profeten onderworpen.", "2 Kron 33:18": "Het overige nu van de geschiedenissen van Manasse, en zijn gebed tot zijn God, ook de woorden van de zieners, die tot hem gesproken hebben in de Naam van de HEERE, de God van Israël, zie, die staan in de geschiedenissen van de koningen van Israël;", "1 Tess 4:13": "Maar, broeders, ik wil niet dat u onwetend bent over hen die ontslapen zijn, opdat u niet bedroefd bent, zoals ook de anderen, die geen hoop hebben.", "Luk 9:55": "Maar Hij keerde Zich om, bestrafte hen en zei: U weet niet wat voor geest u hebt.", "Jer 20:9": "Daarom zei ik: Ik zal Hem niet meer noemen, en niet meer in Zijn Naam spreken; maar het werd in mijn hart als een brandend vuur, opgesloten in mijn beenderen; en ik werd moe van het verdragen, maar ik kon het niet.", "1 Kor 6:15-18": "Weet u niet, dat uw lichamen leden van Christus zijn? Zal ik dan de leden van Christus wegnemen, en ze maken tot leden van een hoer? Dat zij verre. Of weet u niet, dat wie zich aan een hoer hecht, één lichaam met haar is? Want die twee, zegt Hij, zullen tot één vlees worden. Maar wie zich aan de Heere hecht, is één geest met Hem.", "2 Kon 12:4": "En Joas zei tegen de priesters: Al het geld van de geheiligde dingen, dat gebracht zal worden in het huis van de HEERE, te weten het geld van hem die overgaat tot de getelden, het geld van ieder man naar zijn schatting, en al het geld, dat in het hart van ieder komt, om dat te brengen in het huis van de HEERE,", "2 Kon 14:27": "En de HEERE had niet gesproken dat Hij de naam van Israël van onder de hemel zou uitwissen; maar Hij verloste hen door de hand van Jerobeam, de zoon van Joas.", "Dan 4:22-27": "Dat bent u, o koning, die groot en sterk bent geworden; want uw grootheid is zo toegenomen, dat zij reikt aan de hemel, en uw heerschappij aan het einde van het aardrijk. Dat nu de koning een wachter, namelijk een heilige, gezien heeft, uit de hemel neerkomend, die zei: Houwt deze boom om, en verderf hem; maar laat de stronk met zijn wortels in de aarde, en met een ijzeren en koperen band in het tedere gras van het veld, en in de dauw van de hemel nat gemaakt worden, en dat zijn deel zij met het gedierte van het veld, totdat er zeven tijden over hem voorbijgaan; Dit is de uitleg, o koning, en dit is een besluit van de Allerhoogste, dat over mijn heer de koning komen zal:", "Hand 26:18": "Om hun ogen te openen en hen te bekeren van de duisternis tot het licht, en van de macht van de satan tot God; opdat zij vergeving van de zonden ontvangen, en een erfdeel onder de geheiligden, door het geloof in Mij.", "Ex 5:7-19": "U zult voortaan aan deze mensen geen stro meer geven, voor het maken van de tichelstenen, zoals gisteren en eergisteren; laat hen zelf heengaan, en stro voor zichzelf verzamelen. En het aantal tichelstenen, dat zij gisteren en eergisteren gemaakt hebben, zult u hun opleggen; u zult daarvan niet verminderen; want zij lopen leeg; daarom roepen zij en zeggen: Laat ons gaan, laat ons onze God offeren! Men verzwaart de dienst voor deze mannen, zodat zij daaraan te doen hebben, en zich niet vergapen aan leugenachtige woorden.", "Matt 18:11-14": "Want de Zoon des mensen is gekomen om dat wat verloren was, zalig te maken. Wat denkt u? Als iemand honderd schapen had en één daarvan zou afdwalen, zal hij niet de negenennegentig achterlaten en de bergen op gaan om het afgedwaalde te zoeken? En als het gebeurt dat hij het vindt, voorwaar, Ik zeg u, dat hij zich meer verblijdt over dat schaap dan over de negenennegentig die niet afgedwaald zijn.", "1 Sam 18:21": "En Saul zei: Ik zal haar hem geven, zodat zij hem tot een valstrik is, en zodat de hand van de Filistijnen tegen hem is. Daarom zei Saul tegen David: Met de andere zult u vandaag mijn schoonzoon worden.", "1 Kon 18:36": "En het gebeurde, toen men het spijsoffer offerde, dat de profeet Elia naderde en zei: HEERE, God van Abraham, Izak en Israël, laat het vandaag bekend worden, dat U God bent in Israël, en ik Uw knecht; en dat ik al deze dingen naar Uw woord gedaan heb.", "Hand 21:11": "En hij kwam naar ons toe, nam de gordel van Paulus, bond daarmee zijn eigen handen en voeten, en zei: Dit zegt de Heilige Geest: De man van wie deze gordel is, zullen de Joden zo te Jeruzalem binden en overleveren in de handen van de heidenen.", "Joh 11:11": "Dit sprak Hij; en daarna zei Hij tegen hen: Lazarus, onze vriend, slaapt; maar Ik ga heen om hem uit de slaap wakker te maken.", "Matt 14:3-5": "Want Herodes had Johannes gevangen genomen, en hem gebonden, en in de kerker gezet, vanwege Herodias, de vrouw van Filippus, zijn broer. Want Johannes zei tegen hem: Het is u niet geoorloofd haar te hebben. En hoewel hij hem wilde doden, vreesde hij het volk, omdat zij hem hielden voor een profeet.", "Mark 3:29": "Maar wie zal lasteren tegen de Heilige Geest, die heeft geen vergeving in eeuwigheid, maar is schuldig aan een eeuwig oordeel.", "Hand 21:14": "En toen hij zich niet liet overtuigen, hielden wij ons tevreden en zeiden: Laat de wil van de Heere gebeuren.", "1 Sam 15:5": "Toen Saul tot aan de stad Amalek kwam, legde hij een hinderlaag in het dal.", "Luk 6:42": "Of hoe kunt u tegen uw broeder zeggen: Broeder, laat toe dat ik de splinter die in uw oog is eruit haal, terwijl u zelf de balk die in uw oog is niet ziet? Huichelaar, haal eerst de balk uit uw eigen oog, en dan zult u goed genoeg zien om de splinter uit het oog van uw broeder te halen.", "Mal 3:17": "En zij zullen, zegt de HEERE van de heerscharen, op die dag, die Ik maken zal, Mij een eigendom zijn; en Ik zal hen verschonen, zoals een man zijn zoon verschoont, die hem dient.", "2 Kron 33:15": "En hij nam de vreemde goden en die gelijkenis weg uit het huis van de HEERE, alsook alle altaren die hij gebouwd had op de berg van het huis van de HEERE, en te Jeruzalem; en hij wierp ze buiten de stad.", "2 Kron 26:21": "Zo was de koning Uzzia melaats tot aan de dag van zijn dood; en melaats zijnde, woonde hij in een afgezonderd huis, want hij was van het huis van de HEERE afgesneden; Jotham nu, zijn zoon, was over het huis van de koning, en oordeelde het volk van het land.", "Jer 29:26": "De HEERE heeft u tot priester gesteld, in plaats van de priester Jojada, opdat u opzichters zou zijn in het huis van de HEERE over iedere man die onzinnig is en zich voor een profeet uitgeeft, om die te stellen in de gevangenis en in het blok.", "2 Sam 11:14-17": "'s Morgens nu gebeurde het, dat David een brief schreef aan Joab; en hij stuurde die door de hand van Uria. En hij schreef in die brief: Stel Uria vooraan tegenover de sterkste strijd, en trek u van achter hem terug, opdat hij geslagen wordt en sterft. Zo gebeurde het, toen Joab op de stad had gelet, dat hij Uria stelde op de plaats waarvan hij wist dat daar strijdbare mannen waren.", "Job 19:6": "Weet dan, dat God mij heeft omgekeerd, en mij met Zijn net omsingeld heeft.", "2 Kron 24:19": "Toch zond Hij profeten onder hen, om hen tot de HEERE te doen terugkeren; die waarschuwden hen, maar zij luisterden niet.", "Zach 2:9": "Want zie, Ik zal Mijn hand over hen bewegen, en zij zullen hun knechten een roof wezen. Zo zult u weten, dat de HEERE van de heerscharen mij gezonden heeft.", "Rom 9:13": "Zoals geschreven is: Jakob heb Ik liefgehad, en Ezau heb Ik gehaat.", "Ps 139:2": "U weet mijn zitten en mijn opstaan; U verstaat van verre mijn gedachten.", "Ezech 20:17": "Doch Mijn oog spaarde hen, zodat Ik hen niet verdierf, en geen einde met hen maakte in de woestijn.", "Ps 85:4": "U hebt al Uw verbolgenheid weggenomen; U hebt U afgewend van de gloed van Uw toorn.", "1 Sam 1:10": "Zij dan, bitter bedroefd zijnde, bad tot de HEERE, en zij weende zeer.", "2 Kor 1:10": "Die ons uit zo’n grote dood verlost heeft, en nog verlost; op Wie wij hopen dat Hij ons ook nog verlossen zal.", "Ps 51:3": "Wees mij genadig, o God! naar Uw goedertierenheid; delg mijn overtreding uit, naar de grootheid van Uw barmhartigheden.", "Neh 9:30": "Doch U hebt geduld met hen gehad, vele jaren lang, en tegen hen getuigd door Uw Geest, door de dienst van Uw profeten, maar zij neigden hun oor niet; daarom hebt U hen gegeven in de hand van de volken van de landen.", "Jes 61:3": "Om de treurenden van Sion te geven, dat hun sieraad gegeven wordt voor as, vreugdeolie voor treurigheid, het gewaad van lof voor een benauwde geest; opdat zij eikenbomen van de gerechtigheid genoemd worden, een planting van de HEERE, opdat Hij verheerlijkt wordt.", "Ps 42:9": "Maar de HEERE zal overdag Zijn goedertierenheid gebieden, en 's nachts zal Zijn lied bij mij zijn: het gebed tot de God van mijn leven.", "2 Kron 12:1": "Het gebeurde nu, toen Rehabeam het koninkrijk bevestigd had en hij sterk geworden was, dat hij de wet van de HEERE verliet, en heel Israël met hem.", "Jak 5:12": "Maar voor alle dingen, mijn broeders, zweer niet, noch bij de hemel, noch bij de aarde, noch bij enige andere eed; maar laat uw ja, ja zijn, en het nee, nee; opdat u niet onder het oordeel valt.", "Deut 32:9-12": "Want het deel van de HEERE is Zijn volk, Jakob is het snoer van Zijn erfenis. Hij vond hem in een land van de woestijn, en in een woeste huilende wildernis; Hij voerde hem rondom, Hij onderwees hem, Hij bewaarde hem als Zijn oogappel. Zoals een arend zijn nest opwekt, over zijn jongen zweeft, zijn vleugels uitbreidt, ze neemt en ze draagt op zijn vleugels;", "1 Kor 5:10": "Maar niet geheel met de hoereerders van deze wereld, of met de gierigaards, of met de rovers, of met de afgodendienaars; want dan zou u wel uit de wereld moeten gaan.", "1 Kon 13:20": "En het gebeurde, terwijl zij aan tafel zaten, dat het woord van de HEERE kwam tot de profeet die hem had laten terugkeren;", "2 Kon 11:3": "En hij was met haar verborgen in het huis van de HEERE, zes jaar; en Athalia regeerde over het land.", "Luk 1:67": "En Zacharias, zijn vader, werd vervuld met de Heilige Geest, en profeteerde, en zei:", "Joël 2:29": "Ja, ook over de dienstknechten, en over de dienstmaagden, zal Ik in die dagen Mijn Geest uitgieten.", "Ex 20:2": "Ik ben de HEERE, uw God, Die u uit Egypteland, uit het diensthuis, uitgeleid heb.", "Ps 89:3": "Want ik heb gezegd: Uw goedertierenheid zal eeuwig gebouwd worden; in de hemelen zelf hebt Gij Uw waarheid bevestigd, en gezegd:", "Ps 134:1": "Een lied Hammaaloth. Zie, loof de HEERE, alle knechten van de HEERE! U die iedere nacht in het huis van de HEERE staat!", "Ps 85:6-8": "Zult U eeuwig tegen ons toornen? Zult U Uw toorn uitstrekken van geslacht tot geslacht? Zult U ons niet weer levend maken, opdat Uw volk zich in U verblijdt? Toon ons Uw goedertierenheid, o HEERE, en geef ons Uw heil.", "Ps 106:1": "Halleluja! Loof de HEERE, want Hij is goed, want Zijn goedertierenheid is voor eeuwig.", "Jer 1:4-10": "Het woord van de HEERE dan kwam tot mij, en zei: Voordat Ik u in moeders buik vormde, heb Ik u gekend, en voordat u uit de baarmoeder voortkwam, heb Ik u geheiligd; Ik heb u de volken tot een profeet gesteld. Toen zei ik: Ach, Heere HEERE! zie, ik kan niet spreken, want ik ben jong.", "2 Kon 2:9": "Het gebeurde nu, toen zij overgekomen waren, dat Elia zei tegen Elisa: Vraag wat ik voor u doen zal, voordat ik van bij u weggenomen word. En Elisa zei: Laat toch een dubbel deel van uw geest op mij zijn!", "1 Petr 1:3": "Geloofd zij de God en Vader van onze Heere Jezus Christus, Die naar Zijn grote barmhartigheid ons opnieuw geboren heeft doen worden tot een levende hoop, door de opstanding van Jezus Christus uit de doden.", "Jer 31:32": "Niet naar het verbond dat Ik met hun vaderen gemaakt heb, op de dag dat Ik hun hand vastgreep om hen uit het land Egypte uit te leiden, welk verbond van Mij zij verbroken hebben, hoewel Ik hen getrouwd had, spreekt de HEERE;", "Zef 2:7": "En dat gebied zal zijn voor het overblijfsel van het huis van Juda, zodat zij daarin weiden; 's avonds zullen zij in de huizen van Askelon liggen, want de HEERE, hun God, zal hen bezoeken, en Hij zal hun gevangenschap wenden.", "Ezech 16:63": "opdat u eraan denkt, en zich schaamt, en niet meer uw mond opendoet vanwege uw schande, wanneer Ik verzoening voor u zal doen over alles wat u gedaan hebt, spreekt de Heere HEERE.", "Ps 108:13": "Geeft U ons hulp uit de benauwdheid; want het heil van de mens is ijdelheid.", "1 Kon 21:17-22": "Doch het woord van de HEERE kwam tot Elia, de Thisbiet: Maak u op, ga naar beneden, Achab, de koning van Israël, tegemoet, die in Samaria is; zie, hij is in de wijngaard van Naboth, waarheen hij afgegaan is om die in bezit te nemen. En u zult tot hem spreken en zeggen: Zo zegt de HEERE: Hebt u doodgeslagen, en ook een erfelijke bezitting ingenomen? Daartoe zult u tot hem spreken en zeggen: Zo zegt de HEERE: Op de plaats waar de honden het bloed van Naboth gelekt hebben, zullen de honden ook uw bloed lekken, ja, het uwe!", "Jona 2:1-10": "En Jona bad tot de HEERE, zijn God, uit het ingewand van de vis. En hij zei: Ik riep uit mijn benauwdheid tot de HEERE, en Hij antwoordde mij; uit de buik van het graf schreide ik, en U hoorde mijn stem. Want U had mij geworpen in de diepte, in het hart van de zeeën, en de stroom omving mij; al Uw baren en Uw golven gingen over mij heen.", "Jer 31:3": "De HEERE is mij verschenen van lang geleden! Ja, Ik heb u liefgehad met een eeuwige liefde; daarom heb Ik u getrokken met goedertierenheid.", "Neh 1:10": "Zij zijn toch Uw dienaren en Uw volk, dat U verlost hebt door Uw grote kracht en door Uw sterke hand.", "2 Sam 11:5": "En die vrouw werd zwanger; zo liet zij David weten, en zei: Ik ben zwanger geworden.", "Joh 11:25": "Jezus zei tegen haar: Ik ben de Opstanding en het Leven; wie in Mij gelooft zal leven, ook al was hij gestorven;", "Job 23:2-6": "Ook vandaag is mijn klacht bitter; mijn plaag is zwaarder dan mijn zuchten. Och, of ik wist waar ik Hem vinden zou, ik zou tot Zijn troon komen; Ik zou het recht voor Zijn aangezicht ordentelijk voorstellen, en mijn mond zou ik met verdedigingen vullen.", "2 Kon 6:17": "En Elisa bad, en zei: HEERE, open toch zijn ogen, dat hij ziet! En de HEERE opende de ogen van de knecht, dat hij zag; en zie, de berg was vol vurige paarden en wagens rondom Elisa.", "Ps 74:3": "Hef Uw voeten op naar de eeuwige verwoestingen; de vijand heeft alles in het heiligdom verdorven.", "Gen 40:8": "En zij zeiden tegen hem: Wij hebben een droom gehad, en er is niemand die hem uitlegt. En Jozef zei tegen hen: Zijn de uitleggingen niet van God? Vertel ze mij toch.", "Jer 13:11": "Want zoals een gordel zich hecht aan de middel van een man, zo heb Ik het hele huis van Israël en het hele huis van Juda aan Mij doen hechten, spreekt de HEERE, om Mij tot een volk te zijn, en tot een naam, en tot lof, en tot heerlijkheid; maar zij hebben niet gehoord.", "1 Sam 8:20": "en wij zullen ook zijn zoals alle volken; en onze koning zal ons richten, en hij zal voor ons uit gaan, en hij zal onze oorlogen voeren.", "2 Petr 2:14": "zij hebben ogen vol overspel, die niet ophouden met zondigen; zij verleiden onvaste zielen, hebben een hart geoefend in hebzucht, en zijn kinderen van de vervloeking;", "Luk 12:1": "Ondertussen, toen er vele duizenden mensen uit de menigte bijeengebracht waren, zodat zij elkaar vertraden, begon Hij tegen Zijn discipelen te zeggen: Let vooral op uzelf voor het zuurdeeg van de Farizeeën, dat is huichelarij.", "Matt 12:31": "Daarom zeg Ik u: alle zonde en lastering zal de mensen vergeven worden; maar de lastering tegen de Geest zal de mensen niet vergeven worden.", "Gen 17:7": "En Ik zal Mijn verbond oprichten tussen Mij en u, en uw nageslacht na u, in hun geslachten, tot een eeuwig verbond, om u en uw nageslacht na u tot een God te zijn.", "Ps 35:17": "Heere! Hoe lang zult U toezien? Breng mijn ziel weer van hun verwoestingen, mijn eenzame van de jonge leeuwen.", "Richt 3:9": "Toen riepen de kinderen van Israël tot de HEERE; en de HEERE verwekte de kinderen van Israël een verlosser, die hen verloste, Othniël, zoon van Kenaz, broer van Kaleb, die jonger was dan hij.", "Jer 38:14": "Toen zond de koning Zedekia iemand, en liet de profeet Jeremia bij zich halen, bij de derde ingang die aan het huis van de HEERE was; en de koning zei tegen Jeremia: Ik zal u iets vragen, verberg niets voor mij.", "Jak 3:10": "Uit dezelfde mond komt voort zegening en vervloeking. Dit moet, mijn broeders, zo niet gebeuren.", "Job 33:14-16": "Maar God spreekt eens of tweemaal; doch men let daar niet op. In de droom, door het gezicht 's nachts, als een diepe slaap op de mensen valt, in de sluimering op het leger; Dan openbaart Hij het voor het oor der mensen, en Hij verzegelt hun kastijding;", "2 Sam 19:21": "Toen antwoordde Abisai, de zoon van Zeruja, en zei: Zou Simeï hiervoor niet gedood moeten worden? Hij heeft toch de gezalfde van de HEERE vervloekt?", "Micha 6:3": "O Mijn volk! Wat heb Ik u gedaan, en waarmee heb Ik u vermoeid? Getuig tegen Mij.", "Tit 1:2": "In de hoop van het eeuwige leven, dat God, Die niet liegen kan, beloofd heeft vóór de tijden der eeuwen, maar geopenbaard heeft op Zijn tijd;", "2 Sam 23:3": "De God van Israël heeft gezegd, de Rotssteen van Israël heeft tot mij gesproken: Er zal een Heerser zijn over de mensen, een Rechtvaardige, een Heerser in de vreze van God.", "1 Petr 4:4": "waarin zij het vreemd vinden dat u niet meeloopt naar dezelfde uitspatting van losbandigheid, en u belasteren;", "Richt 9:7-15": "Toen ze dit aan Jotham vertelden, ging hij heen en ging op de top van de berg Gerizim staan, en verhief zijn stem, en riep, en hij zei tegen hen: Luistert naar mij, burgers van Sichem! Dan zal God ook naar u luisteren. De bomen gingen eens op weg om een koning over zich te zalven, en zij zeiden tegen de olijfboom: Wees u koning over ons. Maar de olijfboom zei tegen hen: Zou ik mijn vettigheid opgeven, waarmee men God en de mensen eert door mij? En zou ik heengaan om te zweven boven de bomen?", "Spr 6:32": "Maar wie met een vrouw overspel doet, mist verstand; hij die dat doet, richt zichzelf te gronde;", "Ps 117:2": "Want Zijn goedertierenheid is machtig over ons, en de waarheid van de HEERE is er voor eeuwig! Halleluja!", "Ezech 14:22": "Doch zie, daarin zullen mensen die ontkomen zijn overblijven, die uitgevoerd zullen worden, zonen en dochters; zie, zij zullen tot u uitkomen, en u zult hun weg zien en hun handelingen; en u zult vertroost worden over het kwaad dat Ik over Jeruzalem gebracht zal hebben, ja, al wat Ik over haar zal hebben gebracht.", "Jer 15:15": "O HEERE! U weet het, denk aan mij, en bezoek mij, en wreek mij op mijn vervolgers; neem mij niet weg in Uw lankmoedigheid over hen; weet dat ik omwille van U smaad draag.", "Micha 6:4": "Zeker heb Ik u uit Egypteland opgevoerd, en u uit het diensthuis verlost; en Ik heb voor uw aangezicht Mozes, Aäron en Mirjam heen gezonden.", "Ps 73:1": "Een psalm van Asaf. Zeker, God is goed voor Israël, voor hen die rein van hart zijn.", "Jes 62:3": "En u zult een sierlijke kroon zijn in de hand van de HEERE, en een koninklijke hoed in de hand van uw God.", "Jes 57:2": "Hij zal ingaan in de vrede; zij zullen rusten op hun slaapsteden, ieder die in zijn oprechtheid gewandeld heeft.", "Hand 26:7": "Waarnaar onze twaalf stammen, voortdurend nacht en dag God dienend, hopen te komen; over die hoop, o koning Agrippa, word ik door de Joden beschuldigd.", "Luk 19:8": "En Zacheüs stond op en zei tegen de Heere: Zie, Heere, de helft van mijn bezit geef ik aan de armen; en als ik iemand iets door bedrog afhandig gemaakt heb, geef ik dat viervoudig terug.", "Klaagl 5:16": "De kroon van ons hoofd is afgevallen; o wee nu ons, dat wij zo gezondigd hebben!", "Ps 16:1": "Een gouden kleinood van David. Bewaar mij, o God! Want ik vertrouw op U.", "Matt 12:32": "En wie een woord zal spreken tegen de Zoon des mensen, het zal hem vergeven worden; maar wie tegen de Heilige Geest zal spreken, het zal hem niet vergeven worden, niet in deze eeuw, en ook niet in de toekomende.", "Ps 30:11": "Hoor, HEERE! en wees mij genadig; HEERE! wees mij een Helper.", "Ezra 7:27": "Geloofd zij de HEERE, de God van onze vaderen, Die zoiets in het hart van de koning gegeven heeft, om het huis van de HEERE te versieren, dat te Jeruzalem is.", "Gen 19:16": "Maar hij aarzelde; toen grepen die mannen zijn hand, en de hand van zijn vrouw, en de hand van zijn twee dochters, omdat de HEERE hem genadig was; en zij brachten hem naar buiten, en zetten hem buiten de stad neer.", "Jes 44:22": "Ik delg uw overtredingen uit als een nevel, en uw zonden als een wolk; keer terug tot Mij, want Ik heb u verlost.", "Fil 1:21": "Want het leven is voor mij Christus, en het sterven is winst.", "Jer 30:22": "En u zult Mij tot een volk zijn, en Ik zal u tot een God zijn.", "Jona 1:1": "Het woord van de HEERE gebeurde tot Jona, de zoon van Amitthai, en Hij zei:", "Ps 146:7": "Die de verdrukte recht doet, Die de hongerige brood geeft; de HEERE maakt de gevangenen los.", "Ps 31:22": "Geloofd zij de HEERE, want Hij heeft Zijn goedertierenheid aan mij wonderlijk gemaakt, mij voerende als in een vaste stad.", "Jes 63:15-17": "Zie neer van de hemel, en aanschouw van Uw heilige en Uw heerlijke woning; waar zijn Uw ijver en Uw krachten, het gerommel van Uw ingewand en van Uw barmhartigheden? Zij houden zich tegen mij in. U bent toch onze Vader, want Abraham weet van ons niet, en Israël kent ons niet; U, o HEERE, bent onze Vader, onze Verlosser van ouds af is Uw Naam. HEERE! Waarom laat U ons van Uw wegen dwalen, waarom verstokt U ons hart, zodat wij U niet vrezen? Keer terug om Uw dienaren wil, de stammen van Uw erfdeel.", "Jer 41:5": "Zo kwamen er mannen van Sichem, van Silo, en van Samaria, tachtig man, met de baard afgeschoren, en de kleren gescheurd, en zichzelf gesneden; en spijsoffer en wierook waren in hun hand, om naar het huis van de HEERE te brengen.", "2 Kron 26:8": "En de Ammonieten gaven Uzzia geschenken; en zijn naam ging tot aan de ingang van Egypte, want hij sterkte zich tot het uiterste.", "Joh 7:18": "Wie uit zichzelf spreekt, zoekt zijn eigen eer; maar wie de eer zoekt van Hem die hem gezonden heeft, die is waarachtig, en er is geen ongerechtigheid in Hem.", "1 Tim 1:9": "En als hij dit weet, dat de wet niet gemaakt is voor de rechtvaardige, maar voor de onrechtvaardigen en de weerspannigen, de goddelozen en de zondaars, de onheiligen en de ongodsdienstigen, de vadermoordenaars en de moedermoordenaars, de doodslagers,", "1 Sam 23:26-28": "En Saul ging aan deze kant van de berg, en David en zijn mannen aan de andere kant van de berg. Het gebeurde nu dat David haastte om te ontkomen aan Saul; en Saul en zijn mannen omsingelden David en zijn mannen, om hen te grijpen. Maar er kwam een bode naar Saul, die zei: Haast u, en kom, want de Filistijnen zijn het land binnengevallen. Toen keerde Saul zich af van het najagen van David, en ging de Filistijnen tegemoet; daarom noemde men die plaats Sela-Machlekoth.", "Jes 8:11": "Want zo heeft de HEERE tegen mij gezegd, met een sterke hand, en Hij onderwees mij om niet te wandelen op de weg van dit volk, en zei:", "Gen 8:21": "En de HEERE rook die liefelijke reuk, en de HEERE zei in Zijn hart: Ik zal voortaan de aardbodem niet meer vervloeken om de mens; want het gedichtsel van het hart van de mens is slecht van zijn jeugd aan; en Ik zal voortaan niet meer al het levende slaan, zoals Ik gedaan heb.", "2 Kron 8:16": "Zo werd al het werk van Salomo klaargemaakt, tot de dag van de grondlegging van het huis van de HEERE, en tot het voltooien ervan, zodat het huis van de HEERE volmaakt werd.", "2 Sam 11:25": "Toen zei David tegen de bode: Zo moet u tegen Joab zeggen: Laat deze zaak niet kwaad zijn in uw ogen, want het zwaard verteert zowel de een als de ander; versterk uw strijd tegen de stad, en verstoor haar; bemoedig hem zo.", "Ezech 2:4": "En deze kinderen zijn hard van gezicht, en stijf van hart; Ik zend u tot hen, en u zult tegen hen zeggen: Zo zegt de Heere HEERE!", "Kol 3:8": "Maar leg nu ook u dit alles af: gramschap, toorn, kwaadheid, lastering, vuil spreken uit uw mond.", "Mark 14:36": "En Hij zei: Abba, Vader! Alle dingen zijn U mogelijk; neem deze drinkbeker van Mij weg; maar niet wat Ik wil, maar wat U wilt.", "2 Kron 14:11": "En Asa riep tot de HEERE, zijn God, en zei: HEERE, het is voor U niets, te helpen hetzij de machtige, hetzij de krachteloze; help ons, o HEERE, onze God! Want wij steunen op U, en in Uw Naam zijn wij gekomen tegen deze menigte; o HEERE! U bent onze God; laat een sterfelijk mens tegen U niets vermogen.", "Lev 26:40-45": "Dan zullen zij hun ongerechtigheid belijden, en de ongerechtigheid van hun vaderen met hun overtredingen, waarmee zij tegen Mij overtreden hebben, en ook dat zij tegen Mij in gewandeld hebben. Dat Ik ook tegen hen in gewandeld heb, en hen in het land van hun vijanden gebracht heb. Als dan hun onbesneden hart gebogen wordt, en zij dan de straf voor hun ongerechtigheid aanvaarden; Dan zal Ik denken aan Mijn verbond met Jakob, en ook aan Mijn verbond met Izak, en ook aan Mijn verbond met Abraham zal Ik denken, en aan het land zal Ik denken;", "Klaagl 3:32": "Caph. Maar als Hij bedroefd heeft, zo zal Hij Zich ontfermen, naar de grootheid van Zijn blijken van goedertierenheid.", "Job 13:7-9": "Zult u voor God onrecht spreken, en zult u voor Hem bedriegerij spreken? Zult u Zijn aangezicht aannemen? Zult u voor God twisten? Zal het goed zijn, als Hij u zal onderzoeken? Zult u met Hem spotten, zoals men met een mens spot?", "Jer 20:7": "HEERE! U hebt mij overgehaald, en ik ben overgehaald; U bent mij te sterk geweest, en hebt de overhand gehad; ik ben de hele dag tot een belaching, ieder van hen bespot mij.", "Jer 33:1": "Verder kwam het woord van de HEERE voor de tweede keer tot Jeremia, toen hij nog opgesloten was in het voorhof van de bewaring, en Hij zei:", "Ps 71:9": "Verwerp mij niet in de tijd van het ouderdom; verlaat mij niet, terwijl mijn kracht vergaat.", "Jes 36:20": "Welke zijn er onder al de goden van deze landen, die hun land uit mijn hand gered hebben, zodat de HEERE Jeruzalem uit mijn hand zou redden?", "2 Tim 4:6-8": "Want ik word al als een drankoffer geofferd, en de tijd van mijn heengaan is nabij. Ik heb de goede strijd gestreden, ik heb de loop tot een einde gebracht, ik heb het geloof behouden; Verder ligt voor mij de kroon van de rechtvaardigheid klaar, die de Heere, de rechtvaardige Rechter, mij op die dag geven zal; en niet alleen mij, maar ook allen die Zijn verschijning hebben liefgehad.", "Jes 62:4": "Tegen u zal niet meer gezegd worden: Wie verlaten is; en tegen uw land zal niet meer gezegd worden: Het verwoeste; maar u zult genoemd worden: Mijn lust is aan haar! en uw land: Het getrouwde; want de HEERE heeft een lust aan u, en uw land zal getrouwd worden.", "Hebr 11:37": "zij zijn gestenigd, in stukken gezaagd, beproefd, met het zwaard gedood; zij hebben rondgezworven in schapenvellen en geitenvellen; berooid, verdrukt, mishandeld;", "Spr 22:14": "De mond van vreemde vrouwen is een diepe kuil; op wie de HEERE vertoornd is, zal daarin vallen.", "Deut 28:10": "En alle volken van de aarde zullen zien dat de Naam van de HEERE over u uitgeroepen is, en zij zullen voor u vrezen.", "1 Kon 18:18": "Toen zei hij: Ik heb Israël niet in beroering gebracht, maar u en het huis van uw vader, doordat u de geboden van de HEERE verlaten hebt en de Baäls bent gaan navolgen.", "Deut 32:29": "O, dat zij wijs waren; zij zouden dit vernemen, zij zouden op hun einde letten.", "Deut 32:36": "Want de HEERE zal Zijn volk recht doen, en het zal Hem berouwen over Zijn knechten; want Hij zal zien, dat de hand is weggegaan, en er niemand meer over is, gebonden of vrij.", "Joh 16:27": "Want de Vader Zelf heeft u lief, omdat u Mij liefgehad hebt, en geloofd hebt dat Ik van God ben uitgegaan.", "Ps 77:3": "Ten dage van mijn benauwdheid zocht ik de Heere; mijn hand was 's nachts uitgestrekt, en liet niet af; mijn ziel weigerde getroost te worden.", "Ps 32:2": "Gelukkig is de mens, die de HEERE de ongerechtigheid niet toerekent, en in wiens geest geen bedrog is.", "Lev 22:33": "Die u uit het land Egypte heb uitgevoerd, opdat Ik u tot een God zou zijn; Ik ben de HEERE!", "1 Sam 3:20": "En heel Israël, van Dan tot Berseba toe, wist dat Samuël bevestigd was tot een profeet van de HEERE.", "2 Sam 5:5": "In Hebron regeerde hij over Juda zeven jaar en zes maanden; en in Jeruzalem regeerde hij drieëndertig jaar over heel Israël en Juda.", "Zach 1:14": "En de Engel Die met mij sprak, zei tegen mij: Roep uit en zeg: Zo zegt de HEERE van de heerscharen: Ik ijver over Jeruzalem en over Sion met een grote ijver.", "Job 9:16": "Al zou ik roepen en Hij mij antwoorden, ik zou niet geloven dat Hij mijn stem ter ore genomen heeft.", "Klaagl 3:31-33": "Caph. Want de Heere zal niet verstoten in eeuwigheid. Caph. Maar als Hij bedroefd heeft, zo zal Hij Zich ontfermen, naar de grootheid van Zijn blijken van goedertierenheid. Caph. Want Hij plaagt of bedroeft de kinderen van de mensen niet van harte.", "Ezech 20:26": "En Ik verontreinigde hen in hun eigen giften, doordat zij door het vuur lieten doorgaan al wat de baarmoeder opent; opdat Ik hen zou verwoesten, met als doel dat zij zouden weten dat Ik de HEERE ben.", "Rom 8:32": "Hij Die zelfs Zijn eigen Zoon niet gespaard heeft, maar Hem voor ons allen overgegeven heeft, hoe zal Hij ons ook met Hem niet alle dingen schenken?", "Ezech 3:14": "Toen hief de Geest mij op, en nam mij weg, en ik ging heen, bitter bedroefd door de hitte van mijn geest; maar de hand van de HEERE was sterk op mij.", "Joh 4:49": "De koninklijke hoveling zei tegen Hem: Heere, kom af voordat mijn kind sterft.", "Dan 9:14": "Daarom heeft de HEERE over het kwade gewaakt, en Hij heeft het over ons gebracht; want de HEERE, onze God, is rechtvaardig in al Zijn werken die Hij gedaan heeft, omdat wij Zijn stem niet gehoorzaamden.", "2 Petr 3:15": "En beschouw het geduld van onze Heere als redding; zoals ook onze geliefde broeder Paulus, naar de wijsheid die hem gegeven is, aan u geschreven heeft;", "1 Sam 15:20": "Toen zei Saul tegen Samuël: Ik heb zeker naar de stem van de HEERE gehoord, en ben gegaan op de weg waarop de HEERE mij gezonden heeft; en ik heb Agag, de koning van de Amalekieten, meegebracht, maar de Amalekieten heb ik verbannen.", "Jer 7:1": "Het woord dat tot Jeremia gebeurd is, van de HEERE, en Hij zei:", "Jak 5:15": "En het gebed van het geloof zal de zieke behouden, en de Heere zal hem oprichten; en als hij zonden gedaan heeft, zal het hem vergeven worden.", "Openb 3:12": "Wie overwint, hem zal Ik maken tot een pilaar in de tempel van Mijn God, en hij zal daar niet meer uitgaan; en Ik zal op hem de Naam van Mijn God schrijven, en de naam van de stad van Mijn God, namelijk het nieuwe Jeruzalem, dat uit de hemel neerdaalt van Mijn God vandaan, en ook Mijn nieuwe Naam.", "Ps 116:5": "De HEERE is genadig en rechtvaardig, en onze God ontfermt Zich.", "1 Sam 31:13": "En zij namen hun beenderen en begroeven ze onder het geboomte bij Jabes; en zij vastten zeven dagen.", "Jes 8:21": "En ieder van hen zal daar doorgaan, hard gedrukt en hongerig; en het zal gebeuren, wanneer hem hongert en hij zeer toornig zal zijn, dan zal hij vloeken op zijn koning en op zijn God, als hij opwaarts zal zien;", "Num 23:10": "Wie zal het stof van Jakob tellen, en het getal, ja, het vierde deel van Israël? Laat mijn ziel de dood van de oprechten sterven, en laat mijn einde net zo zijn als het zijne!", "Jak 5:14": "Is iemand ziek onder u? Laat hij de oudsten van de gemeente bij zich roepen, en laten zij over hem bidden, hem met olie zalvend in de Naam van de Heere.", "Neh 9:32": "Nu dan, o onze God, U grote, U machtige, en U ontzagwekkende God, Die het verbond en de weldadigheid houdt; laat voor Uw aangezicht niet gering zijn al de moeite, die ons getroffen heeft, onze koningen, onze vorsten, en onze priesters; en onze profeten, en onze vaderen, en Uw hele volk, vanaf de dagen van de koningen van Assur tot op deze dag.", "Ps 78:16": "Want Hij bracht stromen voort uit de steenrots, en liet de wateren afdalen als rivieren.", "Klaagl 5:17": "Daarom is ons hart mat, om deze dingen zijn onze ogen duister geworden.", "Ps 119:28": "Mijn ziel druipt weg van treurigheid; richt mij op naar Uw woord.", "Dan 1:17": "Aan deze vier jongemannen nu gaf God kennis en verstand in alle boeken, en wijsheid; maar Daniël gaf Hij inzicht in allerlei visioenen en dromen.", "Ps 23:4": "Al ging ik ook in een dal van de schaduw van de dood, ik zou geen kwaad vrezen, want U bent met mij; Uw stok en Uw staf, die troosten mij.", "Rom 6:22": "Maar nu, vrijgemaakt van de zonde, en dienstbaar gemaakt aan God, hebt u uw vrucht tot heiliging, en het einde het eeuwige leven.", "1 Kon 1:10": "Maar Nathan, de profeet, en Benaja, en de helden, en Salomo, zijn broer, nodigde hij niet.", "Ps 108:5": "Want Uw goedertierenheid is groot tot boven de hemelen, en Uw waarheid tot aan de bovenste wolken.", "Ex 22:1": "Wanneer iemand een os of een stuk klein vee steelt en het slacht of verkoopt, moet hij vijf runderen voor een os teruggeven, en vier schapen voor een stuk klein vee.", "Richt 14:19": "Toen kwam de Geest van de HEERE machtig over hem, en hij ging af naar de Askelonieten, en sloeg van hen dertig man; en hij nam hun kleren, en gaf de stellen (extra) kleren aan hen die het raadsel verklaard hadden. Maar zijn toorn ontstak, en hij ging naar het huis van zijn vader.", "1 Sam 27:11": "En David liet geen man en geen vrouw in leven om naar Gath te brengen, en hij zei: Anders zouden zij misschien over ons vertellen en zeggen: Zo heeft David gedaan! En zo was zijn gewoonte, al de dagen dat hij in het land van de Filistijnen gewoond heeft.", "Jes 49:13-17": "Juicht, hemelen! En verheug u, aarde! En bergen! Maakt gedreun met gejuich; want de HEERE heeft Zijn volk vertroost, en Hij zal Zich over Zijn ellendigen ontfermen. Doch Sion zegt: De HEERE heeft mij verlaten, en de Heere heeft mij vergeten. Kan ook een vrouw haar zuigeling vergeten, dat zij zich niet ontfermt over de zoon van haar buik? Ofschoon deze zou vergeten, zo zal Ik u toch niet vergeten.", "Ps 78:65": "Toen ontwaakte de Heere, als iemand die slaapt, als een held, die juicht van de wijn.", "Joh 4:46": "Zo kwam Jezus dan weer in Kana in Galilea, waar Hij het water wijn gemaakt had. En er was een zekere koninklijke hoveling, wiens zoon ziek was, in Kapernaüm.", "1 Kon 1:11": "Toen sprak Nathan tot Bathseba, de moeder van Salomo, en zei: Hebt u niet gehoord dat Adonia, de zoon van Haggith, koning is? En onze heer David weet dat niet.", "1 Joh 4:19": "Wij hebben Hem lief, omdat Hij ons eerst lief heeft gehad.", "2 Kor 6:3-11": "Wij geven nergens aanstoot in, opdat de bediening niet gelasterd wordt. Maar wij maken onszelf in alles aangenaam als dienaars van God, in veel verdraagzaamheid, in verdrukkingen, in noden, in benauwdheden, in slagen, in gevangenissen, in opschudding, in arbeid, in waken, in vasten,", "Job 16:20": "Mijn vrienden bespotten mij; maar mijn oog druipt tot God.", "Joël 2:13": "En scheurt uw hart en niet uw kleren, en bekeert u tot de HEERE, uw God; want Hij is genadig en barmhartig, geduldig en groot van goedertierenheid, en Hij heeft berouw over het kwade.", "Ps 71:4": "Mijn God, bevrijd mij van de hand van de goddeloze, van de hand van hem die verkeerd handelt, en van de opgeblazene.", "Zef 1:12": "En het zal gebeuren in die tijd, Ik zal Jeruzalem met lantaarns doorzoeken; en Ik zal bezoeking doen over de mannen die star geworden zijn op hun droesem, die in hun hart zeggen: De HEERE doet geen goed, en Hij doet geen kwaad.", "Joh 17:26": "En Ik heb hun Uw Naam bekendgemaakt, en zal Hem bekendmaken; opdat de liefde waarmee U Mij liefgehad hebt, in hen is, en Ik in hen.", "Ps 71:2": "Red mij door Uw gerechtigheid, en bevrijd mij; neig Uw oor tot mij, en verlos mij.", "Zach 7:12": "En zij maakten hun hart als een diamant, zodat zij niet hoorden de wet en de woorden die de HEERE van de heerscharen zond door Zijn Geest, door de dienst van de vorige profeten, waardoor een grote toorn is ontstaan van de HEERE van de heerscharen.", "Gen 43:14": "En God, de Almachtige, geve u barmhartigheid bij die man, dat hij uw andere broer en Benjamin met u laat teruggaan! En wat mij aangaat, als ik van mijn kinderen beroofd word, dan ben ik maar beroofd!", "Rom 10:13": "Want ieder die de Naam van de Heere zal aanroepen, zal zalig worden.", "Hab 1:12": "Bent U niet van ouds af de HEERE, mijn God, mijn Heilige? Wij zullen niet sterven; o HEERE! Tot een oordeel hebt U hem gesteld, en o Rots! Om te straffen hebt U hem gegrondvest.", "Richt 10:7-18": "Toen ontstak de toorn van de HEERE tegen Israël; en Hij verkocht hen in de hand van de Filistijnen en in de hand van de Ammonieten. Die verdrukten en vertrapten de Israëlieten in datzelfde jaar; achttien jaar lang onderdrukten zij alle Israëlieten die aan de overkant van de Jordaan waren, in het land van de Amorieten, dat in Gilead ligt. Daarbij trokken de Ammonieten de Jordaan over om te strijden, ook tegen Juda, tegen Benjamin en tegen het huis van Efraïm, zodat Israël erg in het nauw kwam.", "Gen 9:5": "En zeker, Ik zal uw bloed, het bloed van uw zielen, opeisen; van de hand van elk dier zal Ik het opeisen; ook van de hand van de mens, van de hand van ieders broeder zal Ik de ziel van de mens opeisen.", "Openb 22:15": "Maar buiten zullen zijn de honden, en de tovenaars, en de hoereerders, en de doodslagers, en de afgodendienaars, en ieder die de leugen liefheeft en doet.", "Jer 5:8": "Als goed gevoede hengsten zijn zij vroeg op; zij hunkeren, ieder naar de vrouw van zijn naaste.", "Ps 6:3": "Wees mij genadig, HEERE, want ik ben verzwakt; genees mij, HEERE, want mijn beenderen zijn verschrikt.", "Ps 60:13": "Geef Ú ons hulp uit de benauwdheid, want de hulp van de mens is ijdelheid.", "Openb 2:21": "En Ik heb haar tijd gegeven, opdat zij zich zou bekeren van haar hoererij, en zij heeft zich niet bekeerd.", "2 Sam 15:16": "En de koning ging weg te voet, met zijn hele huis; maar de koning liet tien bijvrouwen achter om het huis te bewaren.", "Dan 7:25": "En het zal woorden spreken tegen de Allerhoogste, en het zal de heiligen van de hoge plaatsen uitputten, en het zal proberen de tijden en de wet te veranderen, en zij zullen in zijn hand overgegeven worden tot een tijd, en tijden, en een deel van een tijd.", "1 Kron 16:34": "Looft de HEERE, want Hij is goed, want Zijn goedertierenheid is tot in eeuwigheid.", "Num 11:20": "maar een hele maand lang, totdat het uit uw neus uitkomt en u tot walging is; omdat u de HEERE, Die in uw midden is, verworpen hebt, en voor Zijn aangezicht geweend hebt en gezegd: Waarom zijn wij toch uit Egypte weggetrokken?", "Job 10:15": "Ben ik goddeloos, wee mij! En ben ik rechtvaardig, ik zal mijn hoofd niet opheffen; ik ben verzadigd van schande, maar zie mijn ellende aan.", "Hos 4:1": "Hoor het woord van de Heere, kinderen van Israël! Want de Heere heeft een geschil met de inwoners van het land, omdat er geen trouw, en geen goedertierenheid, en geen kennis van God in het land is;", "Ex 26:30": "Dan moet u de tabernakel oprichten volgens de manier die u op de berg getoond is.", "Dan 12:2": "En velen van hen die in het stof van de aarde slapen, zullen ontwaken, dezen tot eeuwig leven, en anderen tot versmaadheden en tot eeuwige afgrijzing.", "Ex 32:34": "Ga nu heen, leid dit volk naar waar Ik u gezegd heb; zie, Mijn Engel zal voor u uit gaan! Maar op de dag van het bezoeken zal Ik hun zonde over hen bezoeken!", "Deut 19:5": "zoals wanneer iemand met zijn naaste het bos in zal zijn gegaan om hout te hakken, en zijn hand met de bijl wordt uitgehaald om hout af te hakken, en het ijzer schiet af van de steel en treft zijn naaste, zodat hij sterft; die zal naar een van deze steden vluchten en in leven blijven;", "Hand 13:11": "En nu, zie, de hand van de Heere is tegen u, en u zult blind zijn, en de zon een tijdlang niet zien. En meteen viel er op hem donkerheid en duisternis; en rondlopend zocht hij mensen die hem bij de hand mochten leiden.", "Num 22:18": "Toen antwoordde Bileam, en zei tegen de dienaren van Balak: Al zou Balak mij zijn huis vol zilver en goud geven, dan nog zou ik het bevel van de HEERE, mijn God, niet kunnen overtreden, om iets kleins of groots te doen.", "2 Tess 2:4": "die zich tegenstelt en zich verheft boven alles wat God genoemd wordt, of als God vereerd wordt, zodat hij in de tempel van God als God zal zitten, zichzelf voordoend dat hij God is.", "Joh 1:11": "Hij is gekomen tot het Zijne, en de Zijnen hebben Hem niet aangenomen.", "1 Sam 25:38": "En het gebeurde ongeveer tien dagen later, dat de HEERE Nabal sloeg, zodat hij stierf.", "Hebr 10:34": "Want u hebt ook medelijden gehad met mij in mijn boeien, en de beroving van uw bezittingen met blijdschap aanvaard, wetende dat u voor uzelf een beter en blijvend bezit hebt in de hemelen.", "Deut 26:19": "opdat Hij u zo boven alle volken die Hij gemaakt heeft, hoog zet, tot lof, en tot een naam, en tot heerlijkheid; en opdat u een heilig volk bent voor de HEERE, uw God, zoals Hij gesproken heeft.", "Ps 31:2-5": "Op U, o HEERE! vertrouw ik, laat mij niet beschaamd worden in eeuwigheid; help mij eruit door Uw gerechtigheid. Neig Uw oor tot mij, red mij haastig; wees mij tot een sterke Rotssteen, tot een zeer vast Huis, om mij te behouden. Want U bent mijn Steenrots en mijn Burg; leid mij dan, en voer mij, omwille van Uw Naam.", "Deut 28:48": "Zo zult u uw vijanden, die de HEERE tegen u zenden zal, dienen, in honger en in dorst, en in naaktheid, en in gebrek aan alles; en Hij zal een ijzeren juk op uw hals leggen, totdat Hij u verdelgt.", "1 Sam 1:7": "En zo deed hij jaar op jaar; van toen af dat zij opging naar het huis van de HEERE, zo tergde zij haar steeds; daarom weende zij en at niet.", "1 Sam 15:19": "Waarom toch hebt u niet naar de stem van de HEERE gehoord, maar bent u op de buit afgevlogen, en hebt u gedaan wat kwaad was in de ogen van de HEERE?", "Rom 8:39": "Noch hoogte, noch diepte, noch enig ander schepsel ons zal kunnen scheiden van de liefde van God, die er is in Christus Jezus, onze Heere.", "Ps 94:1-23": "O God van de wraken! O HEERE, God van de wraken! Verschijn blinkend! Gij, Rechter der aarde! Verhef U; breng vergelding weer over de hoogmoedigen. Hoe lang zullen de goddelozen, o HEERE! hoe lang zullen de goddelozen van vreugde opspringen?", "Ps 27:11": "HEERE, leer mij Uw weg, en leid mij op het rechte pad, omwille van mijn verspieders.", "Ps 81:14": "Och, dat Mijn volk naar Mij geluisterd had, dat Israël in Mijn wegen had gewandeld!", "Jer 50:20": "In die dagen en op die tijd, spreekt de HEERE, zal de ongerechtigheid van Israël gezocht worden, maar zij zal er niet zijn, en de zonden van Juda, maar zullen niet gevonden worden; want Ik zal het vergeven aan hen die Ik zal doen overblijven.", "1 Kor 6:19": "Of weet u niet, dat uw lichaam een tempel is van de Heilige Geest, Die in u is, Die u van God hebt, en dat u niet van uzelf bent?", "1 Kon 22:14": "Doch Micha zei: Zo waarachtig als de HEERE leeft, wat de HEERE tegen mij zeggen zal, dat zal ik spreken.", "Matt 15:22-28": "En zie, een Kananese vrouw, die uit die omgeving kwam, riep tot Hem en zei: Heere! U Zoon van David, ontferm U over mij! mijn dochter is ernstig door de duivel bezeten. Maar Hij antwoordde haar geen woord. En Zijn discipelen kwamen tot Hem en baden Hem: Laat haar gaan; want zij roept ons na. Maar Hij antwoordde en zei: Ik ben niet gezonden dan naar de verloren schapen van het huis van Israël.", "Job 7:21": "En waarom vergeeft U mijn overtreding niet, en doet U mijn ongerechtigheid niet weg? Want nu zal ik in het stof liggen; en U zult mij vroeg zoeken, maar ik zal niet zijn.", "1 Joh 1:7": "Maar als wij in het licht wandelen, zoals Hij in het licht is, dan hebben wij gemeenschap met elkaar, en het bloed van Jezus Christus, Zijn Zoon, reinigt ons van alle zonde.", "Jer 26:2": "Zo zegt de HEERE: Sta in het voorhof van het huis van de HEERE, en spreek tot alle steden van Juda, die komen om aan te bidden in het huis van de HEERE, al de woorden die Ik u geboden heb tot hen te spreken; doe er niet één woord af.", "Jes 5:1-7": "Nu zal ik voor mijn Beminde een lied van mijn Liefste zingen, over Zijn wijngaard. Mijn Beminde heeft een wijngaard op een vruchtbare heuvel. En Hij heeft die omtuind en van stenen gezuiverd, en Hij heeft hem beplant met edele wijnstokken; en Hij heeft in het midden ervan een toren gebouwd, en ook een wijnbak daarin uitgehouwen; en Hij heeft verwacht dat hij goede druiven zou voortbrengen, maar hij heeft stinkende druiven voortgebracht. Nu dan, u, inwoners van Jeruzalem, en u, mannen van Juda, oordeel toch tussen Mij en tussen Mijn wijngaard.", "Klaagl 1:20": "Resch. Zie, HEERE, want mij is bang; mijn ingewand is beroerd, mijn hart heeft zich omgekeerd in het binnenste van mij, want ik ben zeer opstandig geweest; van buiten heeft mij het zwaard van kinderen beroofd, van binnen is het als de dood.", "Num 24:16": "Die hoort de woorden van God, spreekt, en die de kennis van de allerhoogste weet; die het gezicht van de Almachtige ziet, die in verrukking valt, en wiens ogen geopend worden.", "Hand 12:23": "En meteen sloeg hem een engel van de Heere, omdat hij God de eer niet gaf; en hij werd door de wormen opgegeten, en gaf de geest.", "2 Kron 5:13": "het gebeurde dan, toen zij eenparig trompetten en zongen, om één stem te laten horen, terwijl zij de HEERE prezen en loofden; en toen zij de stem verhieven met trompetten, en met cimbalen, en andere muzikale instrumenten, en toen zij de HEERE prezen, omdat Hij goed is, omdat Zijn goedertierenheid tot in eeuwigheid is; dat het huis met een wolk vervuld werd, namelijk het huis van de HEERE.", "Deut 28:30": "U zult een vrouw ondertrouwen, maar een ander zal met haar slapen; een huis zult u bouwen, maar er niet in wonen; een wijngaard zult u planten, maar de vrucht ervan niet gewoon gebruiken.", "Openb 3:19": "Ieder die Ik liefheb, die bestraf en tuchtig Ik; wees dan ijverig, en bekeer u.", "Ex 35:31": "En de Geest van God heeft hem vervuld met wijsheid, met verstand, en met kennis, namelijk in alle handwerk;", "Matt 23:25": "Wee u, Schriftgeleerden en Farizeeën, huichelaars, want u reinigt de buitenkant van de drinkbeker en de schotel, maar van binnen zijn ze vol roof en onmatigheid.", "Neh 9:35": "Want zij hebben U niet gediend in hun koninkrijk, en in Uw overvloedige goed, dat U hun gaf, en in dat wijde en dat vette land, dat U voor hun aangezicht gegeven had; en zij hebben zich niet bekeerd van hun slechte werken.", "Openb 17:3": "En hij bracht mij weg naar een woestijn, in de geest, en ik zag een vrouw zitten op een scharlaken rood beest, dat vol was van namen van godslastering, en dat zeven hoofden had en tien horens.", "Deut 33:3": "Zeker bemint Hij de volken! Al Zijn heiligen zijn in Uw hand; zij zullen in het midden tussen Uw voeten gezet worden; ieder zal ontvangen van Uw woorden.", "1 Sam 18:11": "En Saul wierp de speer, en zei: Ik zal David aan de wand spietsen; maar David week tweemaal voor hem opzij.", "Ps 79:9": "Help ons, o God van ons heil! Vanwege de eer van Uw Naam; en red ons, en doe verzoening over onze zonden, om Uw Naam.", "Rom 7:3": "Daarom dan, als zij bij een andere man gaat wonen terwijl de man leeft, zal zij een overspeelster genoemd worden; maar als de man gestorven is, dan is zij vrij van de wet, zodat zij geen overspeelster is als zij bij een andere man gaat wonen.", "Deut 32:39": "Zie nu, dat Ik, Ik DIE ben, en geen God met Mij; Ik dood en maak levend; Ik versla en Ik heel; en er is niemand die uit Mijn hand redt!", "Ps 119:64": "HEERE! de aarde is vol van Uw goedertierenheid; leer mij Uw inzettingen.", "2 Kron 36:15": "En de HEERE, de God van hun vaderen, zond tot hen, door de hand van Zijn boden, vroeg opstaand, om hen te zenden; want Hij spaarde Zijn volk en Zijn woning.", "Jona 3:9": "Wie weet, God mocht Zich wenden, en berouw hebben; en Hij mocht Zich wenden van de gloed van Zijn toorn, zodat wij niet vergaan!", "Lev 11:45": "Want Ik ben de HEERE, Die u uit het land Egypte doet optrekken, opdat Ik u tot een God zij, en opdat u heilig bent, omdat Ik heilig ben.", "Spr 14:32": "De goddeloze zal weggedreven worden in zijn kwaad; maar de rechtvaardige vertrouwt zelfs in zijn dood.", "1 Sam 15:17": "En Samuël zei: Is het niet zo, toen u klein was in uw eigen ogen, dat u het hoofd van de stammen van Israël geworden bent, en dat de HEERE u tot koning over Israël gezalfd heeft?", "1 Kon 16:1-3": "Toen kwam het woord van de HEERE tot Jehu, de zoon van Hanani, tegen Baësa, en Hij zei: Omdat Ik u uit het stof heb verheven, en u tot een voorganger over Mijn volk Israël heb aangesteld, en u gewandeld hebt in de weg van Jerobeam, en Mijn volk Israël hebt doen zondigen, en Mij tot toorn hebt verwekt door hun zonden; Zie, zo zal Ik de nakomelingen van Baësa, en de nakomelingen van zijn huis wegdoen; en Ik zal uw huis maken zoals het huis van Jerobeam, de zoon van Nebat.", "Ps 51:16": "Verlos mij van bloedschuld, o God, U, God van mijn heil! zo zal mijn tong Uw gerechtigheid vrolijk roemen.", "2 Sam 13:29": "En Absaloms knechten deden met Amnon zoals Absalom geboden had. Toen stonden alle zonen van de koning op, en reden ieder op zijn muildier, en vluchtten.", "Ps 20:3": "Hij zendt uw hulp uit het heiligdom, en ondersteunt u uit Sion.", "Hand 9:9": "En hij was drie dagen zonder te zien, en at niet en dronk niet.", "Job 21:13": "In het goede verslijten zij hun dagen; en in een ogenblik dalen zij af in het graf.", "Matt 26:39": "En toen Hij een weinig verder gegaan was, viel Hij op Zijn aangezicht, bad en zei: Mijn Vader, als het mogelijk is, laat deze drinkbeker aan Mij voorbijgaan! Maar toch niet zoals Ik wil, maar zoals U wilt.", "Lev 19:12": "U zult niet vals bij Mijn Naam zweren; want u zou de Naam van uw God ontheiligen; Ik ben de HEERE.", "2 Kron 20:4-13": "En Juda kwam bijeen om hulp te zoeken bij de HEERE; ook kwamen zij uit alle steden van Juda om de HEERE te zoeken. En Josafat stond in de samenkomst van Juda en Jeruzalem, in het huis van de HEERE, voor het nieuwe voorhof. En hij zei: HEERE, God van onze vaderen, bent U niet de God in de hemel? Ja, U heerst over alle koninkrijken van de heidenvolken; en in Uw hand is kracht en sterkte, zodat niemand tegen U stand kan houden.", "Jes 24:13": "Want in het binnenste van het land, in het midden van deze volken, zal het zo zijn als de afschudding van het olijfboom, als de nalezingen, wanneer de wijnoogst geëindigd is.", "Rom 1:29": "vervuld met alle ongerechtigheid, hoererij, boosheid, hebzucht, kwaadaardigheid; vol afgunst, moord, twist, bedrog, kwaadwilligheid;", "Ps 143:1-12": "Een psalm van David. O HEERE, hoor mijn gebed, neig de oren tot mijn smekingen; verhoor mij naar Uw waarheid, naar Uw gerechtigheid. En ga niet in het gericht met Uw knecht, want niemand die leeft, zal voor Uw aangezicht rechtvaardig zijn. Want de vijand vervolgt mijn ziel, hij vertreedt mijn leven ter aarde; hij legt mij in duisternissen, als hen die al lang dood zijn.", "1 Kon 11:39": "En Ik zal om die reden het nageslacht van David vernederen; maar niet voor altijd.", "Joh 3:16": "Want zo lief heeft God de wereld gehad, dat Hij Zijn eniggeboren Zoon gegeven heeft, opdat ieder die in Hem gelooft, niet verloren gaat, maar het eeuwige leven heeft.", "2 Kron 16:10": "Doch Asa werd toornig tegen de ziener, en zette hem in de gevangenis; want hij was hierover tegen hem ontstemd; daarbij onderdrukte Asa sommigen uit het volk op dezelfde tijd.", "Ps 103:13": "Zoals een vader zich ontfermt over zijn kinderen, ontfermt de HEERE Zich over hen die Hem vrezen.", "Ps 25:2": "Beth. Mijn God! op U vertrouw ik; laat mij niet beschaamd worden; laat mijn vijanden niet van vreugde opspringen over mij.", "2 Kron 32:19": "En zij spraken over de God van Jeruzalem zoals over de goden van de volken van de aarde, een werk van mensenhanden.", "Ps 119:173": "Laat Uw hand mij te hulp komen, want ik heb Uw bevelen gekozen.", "Hand 17:30": "God dan, Die de tijden van de onwetendheid door de vingers gezien heeft, verkondigt nu aan alle mensen, overal, dat zij zich bekeren.", "2 Sam 1:10": "Zo stond ik bij hem, en doodde hem; want ik wist dat hij na zijn val niet zou leven; en ik nam de kroon die op zijn hoofd was, en de armband die aan zijn arm was, en heb ze hier naar mijn heer gebracht.", "1 Kon 1:23": "En zij maakten dit aan de koning bekend en zeiden: Zie, de profeet Nathan is er; en hij kwam voor het aangezicht van de koning, en boog zich voor de koning met zijn gezicht ter aarde.", "Num 21:8": "En de HEERE zei tegen Mozes: Maak u een vurige slang, en zet die op een stang; en het zal gebeuren, dat ieder die gebeten is, als hij haar aanziet, zal leven.", "Ps 78:19": "En zij spraken tegen God, zij zeiden: Zou God een tafel kunnen aanrichten in de woestijn?", "Ps 106:43-46": "Hij heeft hen dikwijls gered; maar zij verbitterden Hem door hun raad, en werden uitgeteerd door hun ongerechtigheid. Toch zag Hij hun benauwdheid aan, toen Hij hun geschrei hoorde. En Hij dacht tot hun voordeel aan Zijn verbond, en het berouwde Hem naar de veelheid van Zijn blijken van goedertierenheid.", "Ef 1:3-6": "Gezegend zij de God en Vader van onze Heere Jezus Christus, Die ons gezegend heeft met alle geestelijke zegening in de hemel in Christus. Zoals Hij ons uitverkoren heeft in Hem, voor de grondlegging van de wereld, opdat wij heilig en onberispelijk zouden zijn voor Hem in de liefde; Die ons van tevoren voorbestemd heeft tot aanneming tot kinderen, door Jezus Christus, voor Zichzelf, naar het welbehagen van Zijn wil.", "1 Joh 2:25": "En dit is de belofte, die Hij ons beloofd heeft, namelijk het eeuwige leven.", "Ps 90:8": "U stelt onze ongerechtigheden voor U, onze heimelijke zonden in het licht van uw aangezicht.", "2 Sam 24:16": "Toen nu de engel zijn hand uitstrekte over Jeruzalem om haar te verderven, kreeg de HEERE berouw over dat kwaad, en Hij zei tegen de engel die het verderf onder het volk aanrichtte: Het is genoeg, trek uw hand nu terug. De engel van de HEERE was nu bij de dorsvloer van Arauna, de Jebusiet.", "Jer 27:2": "Zo zei de HEERE tegen mij: Maak u banden en jukken, en doe die om uw hals.", "2 Kron 25:16": "En het gebeurde, toen hij tot hem sprak, dat hij hem zei: Heeft men u tot raadgever van de koning aangesteld? Houd op; waarom zou men u slaan? Toen hield de profeet op, en zei: Ik merk dat God besloten heeft u te vernietigen, omdat u dit gedaan hebt, en naar mijn raad niet hebt geluisterd.", "Hos 7:15": "Ik heb hen wel getuchtigd, en hun armen gesterkt; maar zij denken kwaad tegen Mij.", "2 Sam 2:4": "Daarna kwamen de mannen van Juda, en zalfden daar David tot koning over het huis van Juda. Toen lieten zij David weten en zeiden: Het zijn de mannen van Jabes in Gilead, die Saul begraven hebben.", "2 Sam 15:21": "Maar Ithai antwoordde de koning en zei: Zo waarachtig als de HEERE leeft, en mijn heer de koning leeft, op de plaats waar mijn heer de koning zal zijn, hetzij ten dode, hetzij ten leven, daar zal uw knecht voorzeker ook zijn!", "Ex 19:4-6": "U hebt gezien wat Ik de Egyptenaren gedaan heb; hoe Ik u op vleugels van arenden gedragen heb, en u tot Mij gebracht heb. Nu dan, als u nauwgezet Mijn stem gehoorzaamt en Mijn verbond houdt, zult u Mijn eigendom zijn uit alle volken, want de hele aarde is Mijn; En u zult Mij een priesterlijk koninkrijk en een heilig volk zijn. Dit zijn de woorden die u tot de kinderen van Israël spreken zult.", "2 Kron 18:27": "En Micha zei: Als u werkelijk met vrede terugkomt, dan heeft de HEERE niet door mij gesproken. Verder zei hij: Hoor, alle volken!", "Jes 65:19": "En Ik zal Mij verheugen over Jeruzalem, en vrolijk zijn over Mijn volk; en in haar zal niet meer gehoord worden de stem van het wenen, noch de stem van het geschreeuw.", "1 Kron 3:5": "Dit nu zijn hem in Jeruzalem geboren: Simea, en Sobab, en Nathan, en Salomo; deze vier zijn van Bath-Sua, de dochter van Ammiël;", "Ps 4:2": "Als ik roep, verhoor mij, o God van mijn gerechtigheid! In benauwdheid hebt U mij ruimte gemaakt; wees mij genadig, en hoor mijn gebed.", "Openb 22:8": "En ik, Johannes, ben degene die deze dingen gezien en gehoord heeft. En toen ik ze gehoord en gezien had, viel ik neer om aan te bidden voor de voeten van de engel die mij deze dingen toonde.", "Joh 17:3": "En dit is het eeuwige leven, dat zij U kennen, de enige waarachtige God, en Jezus Christus, Die U gezonden hebt.", "Jes 62:5": "Want zoals een jongeling een jonkvrouw trouwt, zo zullen uw kinderen u trouwen; en zoals de bruidegom vrolijk is over de bruid, zo zal uw God over u vrolijk zijn.", "Hos 1:2": "Het begin van het woord van de Heere door Hosea. De Heere zei toen tegen Hosea: Ga heen, neem u een vrouw van hoererijen, en kinderen van hoererijen; want het land hoereert helemaal van achter de Heere vandaan.", "Jer 31:34": "En zij zullen niet meer, ieder zijn naaste, en ieder zijn broeder, onderwijzen door te zeggen: Kent de HEERE! Want zij zullen Mij allen kennen, van hun kleinste tot hun grootste toe, spreekt de HEERE; want Ik zal hun ongerechtigheid vergeven, en aan hun zonden niet meer denken.", "Dan 5:21": "En hij werd van de mensenkinderen verstoten, en zijn hart werd gelijk gemaakt aan de dieren, en zijn woning was bij de woudezels; men gaf hem gras te eten zoals de ossen; en zijn lichaam werd nat gemaakt door de dauw van de hemel, totdat hij erkende dat God, de Allerhoogste, Heerser is over de koninkrijken van de mensen, en daarover stelt wie Hij wil.", "Jer 20:2": "sloeg Pashur de profeet Jeremia, en zette hem in de gevangenis die in de bovenste poort van Benjamin is, die aan het huis van de HEERE ligt.", "Job 2:9": "Toen zei zijn vrouw tegen hem: Houdt u nog steeds vast aan uw oprechtheid? Vervloek God en sterf.", "2 Sam 12:1-4": "En de HEERE zond Nathan naar David. Toen hij bij hem kwam, zei hij tegen hem: Er waren twee mannen in één stad, de één rijk en de ander arm. De rijke had heel veel schapen en runderen. Maar de arme had helemaal niets, dan één enkel klein ooilam, dat hij gekocht had. Hij had het gevoed, zodat het groot werd bij hem en bij zijn kinderen samen; het at van zijn eigen stuk brood, en dronk uit zijn eigen beker, en sliep in zijn schoot, en het was voor hem als een dochter.", "Ps 99:8": "O HEERE, onze God! U hebt hen verhoord, U bent hun geweest een vergevend God, hoewel U wraak deed over hun daden.", "Mark 15:34": "En op het negende uur riep Jezus met luide stem: ELOÏ, ELOÏ, LAMMA SABACHTANI, dat vertaald betekent: Mijn God, Mijn God, waarom hebt U Mij verlaten?", "Ps 139:1": "Een psalm van David, voor de koorleider. HEERE! U doorgrondt en kent mij.", "Ps 74:18": "Denk hieraan; de vijand heeft de HEERE gesmaad, en een dwaas volk heeft Uw Naam gelasterd.", "Num 7:89": "En toen Mozes de tent van de samenkomst inging om met Hem te spreken, hoorde hij een stem tot hem spreken, van boven het verzoendeksel dat op de ark van de getuigenis was, van tussen de twee cherubs. Zo sprak Hij tot hem.", "Fil 1:20": "Overeenkomstig mijn oprechte verwachting en hoop, dat ik in geen enkele zaak beschaamd zal worden; maar dat, met alle vrijmoedigheid, zoals altijd, zo ook nu, Christus groot gemaakt zal worden in mijn lichaam, hetzij door het leven, hetzij door de dood.", "Jes 64:1": "Och, dat U de hemelen scheurde, dat U neerkwam, dat de bergen van Uw aangezicht wegsmolten;", "Ps 25:22": "O God! verlos Israël uit al zijn benauwdheden.", "Ps 49:15": "Men zet hen als schapen in het graf, de dood zal hen afweiden; en de oprechten zullen over hen heersen in die morgenstond; en het graf zal hun gedaante verslijten, elk uit zijn woning.", "1 Petr 1:3-5": "Geloofd zij de God en Vader van onze Heere Jezus Christus, Die naar Zijn grote barmhartigheid ons opnieuw geboren heeft doen worden tot een levende hoop, door de opstanding van Jezus Christus uit de doden. Tot een onvergankelijke, onbevlekte en onverwelkbare erfenis, die in de hemelen bewaard is voor u. Die in de kracht van God bewaard wordt door het geloof tot de zaligheid, die klaarligt om geopenbaard te worden in de laatste tijd.", "2 Kon 4:27": "Toen zij nu bij de man Gods op de berg kwam, greep zij zijn voeten vast. Maar Gehazi kwam dichterbij om haar weg te duwen. Maar de man Gods zei: Laat haar begaan; want haar ziel is in haar bitter bedroefd, en de HEERE heeft het voor mij verborgen, en het mij niet verteld.", "Jer 11:1": "Het woord dat tot Jeremia gebeurd is, van de HEERE, en Hij zei:", "Ps 70:2": "Haast U, o God, om mij te verlossen, o HEERE, tot mijn hulp.", "Ezech 11:1": "Toen tilde de Geest mij op en bracht mij naar de Oostpoort van het huis van de HEERE, die oostwaarts ziet; en zie, aan de deur van de poort waren vijfentwintig mannen, en in hun midden zag ik Jaazanja, de zoon van Azzur, en Pelatja, de zoon van Benaja, vorsten van het volk.", "1 Joh 4:15": "Wie beleden zal hebben dat Jezus de Zoon van God is, God blijft in hem, en hij in God.", "Jes 65:7": "Uw ongerechtigheden, en de ongerechtigheden van uw vaderen tegelijk, zegt de HEERE, die op de bergen wierook gebrand hebben, en Mij smaad aangedaan hebben op de heuvels; daarom zal Ik hun vorige werkloon weer in hun boezem toemeten.", "Hand 3:19": "Kom dus tot inkeer en bekeer u, opdat uw zonden uitgewist worden, wanneer de tijden van verkwikking gekomen zijn van het aangezicht van de Heere,", "Matt 26:42": "Opnieuw, voor de tweede keer, ging Hij heen en bad, en zei: Mijn Vader! Als deze drinkbeker niet aan Mij voorbij kan gaan zonder dat Ik hem drink, laat Uw wil dan gebeuren!", "Job 33:27": "Hij zal de mensen aanschouwen, en zeggen: Ik heb gezondigd, en het recht verkeerd, wat mij niet heeft gebaat;", "Jer 4:10": "Toen zei ik: Ach, Heere HEERE! werkelijk, U hebt dit volk en Jeruzalem grotelijks bedrogen, door te zeggen: U zult vrede hebben; terwijl het zwaard tot aan de ziel raakt.", "Hebr 2:15": "en zou verlossen allen die door angst voor de dood, heel hun leven lang, aan slavernij onderworpen waren.", "Dan 12:3": "De leraars nu zullen blinken als de glans van het uitspansel, en zij die er velen rechtvaardigen, gelijk de sterren, voor altijd en eeuwig.", "Matt 26:52": "Toen zei Jezus tegen hem: Steek uw zwaard terug op zijn plaats; want allen die het zwaard nemen, zullen door het zwaard omkomen.", "Ex 23:19": "De eerstelingen van de eerste vruchten van uw land zult u in het huis van de HEERE uw God brengen. U zult een bokje niet koken in de melk van zijn moeder.", "Spr 16:6": "Door goedertierenheid en trouw wordt de misdaad verzoend; en door de vreze van de HEERE wijkt men af van het kwade.", "Jer 36:6": "Ga daarom zelf heen, en lees uit de rol waarin u uit mijn mond geschreven hebt de woorden van de HEERE, voor de oren van het volk, in het huis van de HEERE, op de vastendag; en u zult ze ook lezen voor de oren van heel Juda, die uit hun steden komen.", "Ps 7:7": "Sta op, HEERE, in Uw toorn, verhef U om de woede van hen die mij benauwen, en ontwaak tot mij; U hebt het oordeel bevolen.", "2 Sam 14:14": "Want wij moeten sterven, en zijn als water dat, uitgestort op de aarde, niet meer verzameld kan worden. God zal echter het leven niet wegnemen, maar Hij zal er middelen op bedenken, dat Hij de verstotene niet van Zich verstoot.", "Jes 57:18": "Ik zie zijn wegen, en Ik zal hem genezen; en Ik zal hem leiden, en hem vertroostingen teruggeven, namelijk aan hen die om hem treuren.", "Num 24:2-4": "Toen Bileam zijn ogen ophief en Israël zag, wonend naar zijn stammen, kwam de Geest van God op hem. En hij hief zijn spreuk op en zei: Bileam, de zoon van Beor, spreekt, en de man wiens ogen geopend zijn, spreekt! Die hoort de woorden van God, spreekt, die het gezicht van de Almachtige ziet; die in verrukking valt, en wiens ogen geopend worden!", "Deut 28:47": "Omdat u de HEERE, uw God, niet gediend hebt met vreugde en blijdschap van hart, vanwege de overvloed van alles;", "2 Sam 7:24": "En U hebt Uw volk Israël voor Uzelf bevestigd, voor Uzelf tot een volk, tot in eeuwigheid; en U, HEERE, bent hun tot een God geworden.", "Jer 5:9": "Zou Ik hierom geen straf brengen? spreekt de HEERE. Of zou Mijn ziel zich niet wreken aan zo'n volk als dit is?", "2 Sam 12:1-15": "En de HEERE zond Nathan naar David. Toen hij bij hem kwam, zei hij tegen hem: Er waren twee mannen in één stad, de één rijk en de ander arm. De rijke had heel veel schapen en runderen. Maar de arme had helemaal niets, dan één enkel klein ooilam, dat hij gekocht had. Hij had het gevoed, zodat het groot werd bij hem en bij zijn kinderen samen; het at van zijn eigen stuk brood, en dronk uit zijn eigen beker, en sliep in zijn schoot, en het was voor hem als een dochter.", "Neh 4:9": "Maar wij baden tot onze God, en zetten wacht tegen hen, dag en nacht, vanwege hen.", "Jes 65:2": "Ik heb Mijn handen uitgebreid, de hele dag, tot een opstandig volk, dat wandelt op een weg die niet goed is, naar hun eigen gedachten.", "Ps 130:1-8": "Een lied van de hogere trappen. Uit de diepten roep ik tot U, o HEERE! Heere! Hoor naar mijn stem; laat Uw oren opmerkzaam zijn op de stem van mijn smekingen. Als U, HEERE, op de ongerechtigheden let, Heere, wie zal dan bestaan?", "Hos 12:11": "En Ik zal spreken tot de profeten, en Ik zal het gezicht vermenigvuldigen; en door de dienst van de profeten zal Ik gelijkenissen voorstellen.", "Hebr 3:5": "En Mozes is wel trouw geweest in heel Zijn huis, als een dienaar, tot getuigenis van de dingen die daarna gesproken zouden worden;", "Jer 31:37": "Zo zegt de HEERE: Als de hemelen daarboven gemeten, en de fundamenten van de aarde beneden doorgrond kunnen worden, dan zal Ik ook het hele nageslacht van Israël verwerpen, om alles wat zij gedaan hebben, spreekt de HEERE.", "1 Joh 2:17": "En de wereld gaat voorbij, en haar begeerte; maar wie de wil van God doet, blijft tot in eeuwigheid.", "1 Kor 5:9": "Ik heb u in de brief geschreven dat u zich niet moet inlaten met de hoereerders;", "Jes 12:1": "En diezelfde dag zult u zeggen: Ik dank U, HEERE! Dat U toornig op mij geweest bent, maar Uw toorn is afgekeerd, en U troost mij.", "Num 35:30-33": "Ieder die iemand doodslaat, moet men op grond van de verklaring van getuigen doden; maar één enkele getuige mag niet tegen iemand getuigen, zodat hij sterft. En u zult geen losgeld nemen voor het leven van de doodslager, die schuldig is te sterven; want hij zal zeker gedood worden. Ook zult u geen losgeld nemen voor hem die naar zijn vrijstad gevlucht is, zodat hij zou terugkeren om te wonen in het land, voor de dood van de hogepriester.", "Hab 1:13": "U bent te rein van ogen om het kwade te zien, en de kwelling kunt U niet aanschouwen; waarom zou U aanschouwen wie trouweloos handelen? Waarom zou U zwijgen, als de goddeloze verslindt wie rechtvaardiger is dan hij?", "Openb 14:13": "En ik hoorde een stem uit de hemel, die tegen mij zei: Schrijf, zalig zijn de doden die in de Heere sterven, van nu aan. Ja, zegt de Geest, opdat zij rusten van hun arbeid; en hun werken volgen met hen.", "1 Sam 13:21": "Maar zij hadden tandige vijlen voor hun houwelen, en voor hun spaden, en voor de drietandige vorken, en voor de bijlen, en om de prikkels scherp te maken.", "Jes 38:14-19": "Zoals een kraanvogel of zwaluw, zo piepte ik; ik kirde als een duif; mijn ogen keken smachtend omhoog; o HEERE! ik word onderdrukt, wees Gij mijn Borg. Wat zal ik spreken? Zoals Hij het mij heeft toegezegd, zo heeft Hij het gedaan; ik zal nu al zoetjes voortgaan al mijn jaren, vanwege de bitterheid van mijn ziel. Heere, door deze dingen leeft men, en in dit alles is het leven van mijn geest; want Gij hebt mij gezond gemaakt en mij genezen.", "Job 15:25": "Want hij strekt tegen God zijn hand uit, en tegen de Almachtige stelt hij zich geweldig aan.", "Ps 9:14": "Wees mij genadig, HEERE, zie mijn ellende aan, die mijn haters mij aandoen, Gij, Die mij verhoogt uit de poorten van de dood;", "Ps 136:3-26": "Loof de Heere der heren; want Zijn goedertierenheid is voor eeuwig. Hem, Die alleen grote wonderen doet; want Zijn goedertierenheid is voor eeuwig. Hem, Die de hemelen met verstand gemaakt heeft; want Zijn goedertierenheid is voor eeuwig.", "Jes 44:1": "Maar hoor nu Mijn knecht Jakob, en Israël, die Ik uitgekozen heb!", "Rom 1:2": "(Wat Hij van tevoren beloofd had door Zijn profeten, in de heilige Schriften),", "2 Sam 15:6": "En op die manier deed Absalom met heel Israël, die tot de koning kwamen voor een rechtszaak. Zo stal Absalom het hart van de mannen van Israël.", "Luk 15:4-7": "Welk mens onder u, die honderd schapen heeft, en één daarvan verliest, laat niet de negenennegentig achter in de woestijn, en gaat achter het verlorene aan, totdat hij dat vindt? En als hij het gevonden heeft, legt hij het op zijn schouders, verblijd. En als hij thuiskomt, roept hij de vrienden en de buren bijeen, en zegt tegen hen: Wees blij met mij; want ik heb mijn schaap gevonden, dat verloren was.", "Ps 73:9": "Zij zetten hun mond tegen de hemel, en hun tong gaat rond op de aarde.", "2 Sam 14:5-11": "En de koning zei tegen haar: Wat is er met u? En zij zei: Zeker, ik ben een weduwe, en mijn man is gestorven. Nu had uw dienares twee zonen, en deze twee vochten met elkaar in het veld, en er was niemand om hen uit elkaar te halen; zo sloeg de een de ander, en doodde hem. En zie, de hele familie is opgestaan tegen uw dienares, en heeft gezegd: Geef hem hier, die zijn broer geslagen heeft, zodat wij hem doden voor het leven van zijn broer, die hij doodgeslagen heeft, en ook de erfgenaam ombrengen; zo zullen zij mijn kool die is overgebleven uitblussen, zodat zij mijn man geen naam of nakomeling laten op de aardbodem.", "Ps 119:75": "Ik weet, HEERE! dat Uw gerichten de gerechtigheid zijn, en dat U mij uit getrouwheid verdrukt hebt.", "Micha 7:5": "Geloof een vriend niet, vertrouw niet op een boezemvriend; bewaar de deuren van uw mond voor haar die in uw schoot ligt.", "Ex 35:35": "Hij heeft hen vervuld met wijsheid van hart, om alle werk te maken van een werkmeester, en van de allervernuftigste handwerker, en van de borduurder in hemelsblauw, en in purper, in scharlaken, en in fijn linnen, en van de wever; die alle werk maken, en vernuftig werk bedenken.", "2 Kon 1:9": "En hij zond naar hem een leider over vijftig met zijn vijftigtal. En toen hij naar hem opklom (want zie, hij zat op de top van een berg), sprak hij tot hem: Man van God! De koning zegt: Kom naar beneden.", "2 Sam 18:12": "Maar die man zei tegen Joab: Al zou ik duizend zilverstukken op mijn handen krijgen, dan nog zou ik mijn hand niet slaan aan de zoon van de koning; want de koning heeft u, en Abisai, en Ithai, voor onze oren bevolen en gezegd: Pas op, wie u ook bent, voor de jongeman, voor Absalom.", "Ps 123:4": "Onze ziel is veel te zat van de spot van de weldenkenden, van de verachting van de hoogmoedigen.", "Zef 3:17": "De HEERE, uw God, is in uw midden, een Held, Die verlossen zal; Hij zal Zich over u verblijden met blijdschap, Hij zal zwijgen in Zijn liefde, Hij zal Zich over u verheugen met gejuich.", "Ezech 17:2-10": "Mensenkind, stel een raadsel voor, en gebruik een gelijkenis tegen het huis van Israël, en zeg: Zo zegt de Heere HEERE: Een arend, die groot was, groot van vleugels, lang van vlerken, vol van veren, die verschillende kleuren had, kwam op de Libanon, en nam de opperste tak van een ceder. Hij plukte de top van zijn jonge takjes af, en bra
