naam":"Openbaring","href":"../../openbaring/1/"}],"slugmap":{"Gen":"genesis","Ex":"exodus","Lev":"leviticus","Num":"numeri","Deut":"deuteronomium","Joz":"jozua","Richt":"richteren","Ruth":"ruth","1 Sam":"1-samuel","2 Sam":"2-samuel","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"En de HEERE zond Nathan naar David. Toen hij bij hem kwam, zei hij tegen hem: Er waren twee mannen in één stad, de één rijk en de ander arm.","2":"De rijke had heel veel schapen en runderen.","3":"Maar de arme had helemaal niets, dan één enkel klein ooilam, dat hij gekocht had. Hij had het gevoed, zodat het groot werd bij hem en bij zijn kinderen samen; het at van zijn eigen stuk brood, en dronk uit zijn eigen beker, en sliep in zijn schoot, en het was voor hem als een dochter.","4":"Toen er nu bij de rijke man een reiziger op bezoek kwam, wilde hij niet iets nemen van zijn eigen schapen of runderen om dat voor de reiziger die bij hem gekomen was te bereiden; maar hij nam het ooilam van de arme man, en bereidde dat voor de man die bij hem gekomen was.","5":"Toen ontstak Davids woede erg tegen die man, en hij zei tegen Nathan: Zo waar de HEERE leeft, de man die dat gedaan heeft, is een kind des doods!","6":"En dat ooilam zal hij viervoudig terugbetalen, omdat hij dit gedaan heeft, en omdat hij geen medelijden heeft gehad.","7":"Toen zei Nathan tegen David: U bent die man! Zo zegt de HEERE, de God van Israël: Ik heb u tot koning gezalfd over Israël, en Ik heb u uit de hand van Saul gered;","8":"en Ik heb u het huis van uw heer gegeven, en de vrouwen van uw heer in uw schoot; ja, Ik heb u het huis van Israël en Juda gegeven; en als dat weinig was, zou Ik u dit en dat er nog bij gegeven hebben.","9":"Waarom hebt u dan het woord van de HEERE veracht, door te doen wat kwaad is in Zijn ogen? U hebt Uria, de Hethiet, met het zwaard verslagen, en zijn vrouw hebt u tot uw vrouw genomen; en hem hebt u met het zwaard van de kinderen van Ammon gedood.","10":"Nu dan, het zwaard zal niet van uw huis wijken tot in eeuwigheid, omdat u Mij veracht hebt, en de vrouw van Uria, de Hethiet, genomen hebt, zodat zij uw vrouw is geworden.","11":"Zo zegt de HEERE: Zie, Ik zal kwaad over u verwekken uit uw eigen huis, en Ik zal uw vrouwen nemen voor uw ogen, en zal ze aan uw naaste geven; die zal bij uw vrouwen liggen, voor de ogen van deze zon.","12":"Want u hebt het in het verborgene gedaan, maar Ik zal deze zaak doen voor heel Israël, en voor de zon.","13":"Toen zei David tegen Nathan: Ik heb gezondigd tegen de HEERE! En Nathan zei tegen David: De HEERE heeft ook uw zonde weggenomen, u zult niet sterven.","14":"Toch, omdat u door deze daad de vijanden van de HEERE ernstig hebt doen lasteren, zal ook de zoon die u geboren is, zeker sterven.","15":"Toen ging Nathan naar zijn huis. En de HEERE trof het kind, dat de vrouw van Uria David gebaard had, zodat het erg ziek werd.","16":"En David zocht God voor dat jongetje; en David vastte een vasten, en ging naar binnen, en lag heel de nacht op de aarde.","17":"Toen kwamen de oudsten van zijn huis naar hem toe, om hem te laten opstaan van de aarde; maar hij wilde niet, en at ook geen brood met hen.","18":"En het gebeurde op de zevende dag, dat het kind stierf; en Davids knechten waren bang het hem te vertellen, dat het kind dood was, want zij zeiden: Zie, toen het kind nog leefde, spraken wij tegen hem, maar hij luisterde niet naar onze stem; hoe zullen wij dan tegen hem zeggen: Het kind is dood? Hij zou zichzelf iets kunnen aandoen.","19":"Maar David zag dat zijn knechten fluisterden; zo begreep David dat het kind dood was. Toen zei David tegen zijn knechten: Is het kind dood? En zij zeiden: Het is dood.","20":"Toen stond David op van de aarde, en waste zich, en zalfde zich, en trok andere kleren aan, en ging naar het huis van de HEERE, en aanbad Hem; daarna kwam hij in zijn eigen huis, en vroeg om brood; en zij zetten hem brood voor, en hij at.","21":"Zo zeiden zijn knechten tegen hem: Wat is dit voor iets dat u gedaan hebt? Om het levende kind hebt u gevast en gehuild; maar nadat het kind gestorven is, bent u opgestaan en hebt u brood gegeten.","22":"En hij zei: Toen het kind nog leefde, heb ik gevast en gehuild; want ik zei: Wie weet, de HEERE zou mij misschien genadig kunnen zijn, zodat het kind in leven bleef.","23":"Maar nu is het dood, waarom zou ik nu vasten? Zal ik het nog kunnen terughalen? Ik zal wel naar hem toe gaan, maar hij zal niet naar mij terugkomen.","24":"Daarna troostte David zijn vrouw Bathseba, en ging naar haar toe, en lag bij haar; en zij baarde een zoon, wiens naam zij Salomo noemde; en de HEERE had hem lief,","25":"en zond een boodschap door de hand van de profeet Nathan, en noemde zijn naam Jedid-jah, omwille van de HEERE.","26":"Joab nu streed tegen Rabba van de kinderen van Ammon; en hij nam de koninklijke stad in.","27":"Toen zond Joab boden naar David, en zei: Ik heb gestreden tegen Rabba, en ik heb ook de waterstad ingenomen.","28":"Verzamel u nu het overige van het volk, en beleger de stad, en neem haar in; anders zou het, als ík de stad zou innemen, naar mijn naam genoemd worden.","29":"Toen verzamelde David al het volk, en trok naar Rabba; en hij streed tegen haar, en nam haar in.","30":"En hij nam de kroon van hun koning van zijn hoofd af, waarvan het gewicht een talent goud was, met edelstenen; en die werd op Davids hoofd gezet; ook bracht hij een zeer grote roof van de stad naar buiten.","31":"Het volk dat daarin was, voerde hij naar buiten, en zette hen aan het werk met zagen, en met ijzeren dorswagens, en met ijzeren bijlen, en liet hen door de steenoven gaan; en zo deed hij met alle steden van de kinderen van Ammon. Daarna keerde David, met heel het volk, terug naar Jeruzalem."},"SV":{"1":"En de HEERE zond Nathan tot David. Als die tot hem inkwam, zeide hij tot hem: Er waren twee mannen in een stad, de een rijk en de ander arm.","2":"De rijke had zeer veel schapen en runderen.","3":"Maar de arme had gans niet dan een enig klein ooilam, dat hij gekocht had, en had het gevoed, dat het groot geworden was bij hem, en bij zijn kinderen tegelijk; het at van zijn bete, en dronk van zijn beker, en sliep in zijn schoot, en het was hem als een dochter.","4":"Toen nu den rijken man een wandelaar overkwam, verschoonde hij te nemen van zijn schapen en van zijn runderen, om voor den reizenden man, die tot hem gekomen was, *wat* te bereiden; en hij nam des armen mans ooilam, en bereidde dat voor den man, die tot hem gekomen was.","5":"Toen ontstak Davids toorn zeer tegen dien man; en hij zeide tot Nathan: *Zo* *waarachtig* *als* de HEERE leeft, de man, die dat gedaan heeft, is een kind des doods!","6":"En dat ooilam zal hij viervoudig wedergeven, daarom dat hij deze zaak gedaan, en omdat hij niet verschoond heeft.","7":"Toen zeide Nathan tot David: Gij zijt die man! Zo zegt de HEERE, de God Israëls: Ik heb u ten koning gezalfd over Israël, en Ik heb u uit Sauls hand gered;","8":"En Ik heb u uws heren huis gegeven, daartoe uws heren vrouwen in uw schoot, ja, Ik heb u het huis van Israël en Juda gegeven; en indien het weinig is, Ik zou u alzulks en alzulks daartoe doen.","9":"Waarom hebt gij *dan* het woord des HEEREN veracht, doende wat kwaad is in Zijn ogen? Gij hebt Uria, den Hethiet, met het zwaard verslagen, en zijn huisvrouw hebt gij u ter vrouwe genomen; en hem hebt gij met het zwaard van de kinderen Ammons doodgeslagen.","10":"Nu dan, het zwaard zal van uw huis niet afwijken tot in eeuwigheid; daarom dat gij Mij veracht hebt, en de huisvrouw van Uria, den Hethiet, genomen hebt, dat zij u ter vrouwe zij.","11":"Zo zegt de HEERE: Zie, Ik zal kwaad over u verwekken uit uw huis, en zal uw vrouwen nemen voor uw ogen, en zal haar aan uw naaste geven; die zal bij uw vrouwen liggen, voor de ogen dezer zon.","12":"Want gij hebt het in het verborgen gedaan; maar Ik zal deze zaak doen voor gans Israël, en voor de zon.","13":"Toen zeide David tot Nathan: Ik heb gezondigd tegen den HEERE! En Nathan zeide tot David: De HEERE heeft ook uw zonde weggenomen, gij zult niet sterven.","14":"Nochtans, dewijl gij door deze zaak de vijanden des HEEREN grotelijks hebt doen lasteren, zal ook de zoon, die u geboren is, den dood sterven.","15":"Toen ging Nathan naar zijn huis. En de HEERE sloeg het kind, dat de huisvrouw van Uria David gebaard had, dat het zeer krank werd.","16":"En David zocht God voor dat jongsken; en David vastte een vasten, en ging in, en lag den nacht over op de aarde.","17":"Toen maakten zich de oudsten van zijn huis op tot hem, om hem te doen opstaan van de aarde; maar hij wilde niet, en at geen brood met hen.","18":"En het geschiedde op den zevenden dag, dat het kind stierf; en Davids knechten vreesden hem aan te zeggen, dat het kind dood was, want zij zeiden: Ziet, als het kind nog levend was, spraken wij tot hem, maar hij hoorde naar onze stem niet, hoe zullen wij dan tot hem zeggen: Het kind is dood? Want het mocht kwaad doen.","19":"Maar David zag, dat zijn knechten mompelden; zo merkte David, dat het kind dood was. Dies zeide David tot zijn knechten: Is het kind dood? En zij zeiden: Het is dood.","20":"Toen stond David op van de aarde, en wies en zalfde zich, en veranderde zijn kleding, en ging in het huis des HEEREN, en bad aan; daarna kwam hij in zijn huis, en eiste *brood*; en zij zetten hem brood voor, en hij at.","21":"Zo zeiden zijn knechten tot hem: Wat is dit voor een ding, dat gij gedaan hebt? Om des levenden kinds wil hebt gij gevast en geweend; maar nadat het kind gestorven is, zijt gij opgestaan en hebt brood gegeten.","22":"En hij zeide: Als het kind nog leefde, heb ik gevast en geweend; want ik zeide: Wie weet, de HEERE zou mij mogen genadig zijn , dat het kind levend bleve.","23":"Maar nu is het dood, waarom zou ik nu vasten? Zal ik hem nog kunnen wederhalen? Ik zal wel tot hem gaan, maar hij zal tot mij niet wederkomen.","24":"Daarna troostte David zijn huisvrouw Bathseba, en ging tot haar in, en lag bij haar; en zij baarde een zoon, wiens naam zij noemde Salomo; en de HEERE had hem lief,","25":"En zond heen door de hand van den profeet Nathan, en noemde zijn naam Jedid-jah, om des HEEREN wil.","26":"Joab nu krijgde tegen Rabba der kinderen Ammons; en hij nam de koninklijke stad in.","27":"Toen zond Joab boden tot David, en zeide: Ik heb gekrijgd tegen Rabba, ook heb ik de waterstad ingenomen.","28":"Zo verzamel gij nu het overige des volks, en beleger de stad, en neem ze in; opdat niet, zo ik de stad zou innemen, mijn naam over haar uitgeroepen worde.","29":"Toen verzamelde David al dat volk, en toog naar Rabba; en hij krijgde tegen haar, en nam ze in.","30":"En hij nam de kroon haars konings van zijn hoofd af, welker gewicht was een talent gouds, met edelgesteente, en zij werd op Davids hoofd *gezet*; ook voerde hij uit een zeer groten roof der stad.","31":"Het volk nu, dat daarin was, voerde hij uit, en leide het onder zagen, en onder ijzeren dorswagens, en onder ijzeren bijlen, en deed hen door den ticheloven doorgaan; en alzo deed hij aan alle steden der kinderen Ammons. Daarna keerde David, en al het volk, weder naar Jeruzalem."},"KJV":{"1":"And the LORD sent Nathan unto David. And he came unto him, and said unto him, There were two men in one city; the one rich, and the other poor.","2":"The rich man had exceeding many flocks and herds:","3":"But the poor man had nothing, save one little ewe lamb, which he had bought and nourished up: and it grew up together with him, and with his children; it did eat of his own meat, and drank of his own cup, and lay in his bosom, and was unto him as a daughter.","4":"And there came a traveller unto the rich man, and he spared to take of his own flock and of his own herd, to dress for the wayfaring man that was come unto him; but took the poor man's lamb, and dressed it for the man that was come to him.","5":"And David's anger was greatly kindled against the man; and he said to Nathan, As the LORD liveth, the man that hath done this thing shall surely die:","6":"And he shall restore the lamb fourfold, because he did this thing, and because he had no pity.","7":"And Nathan said to David, Thou art the man. Thus saith the LORD God of Israel, I anointed thee king over Israel, and I delivered thee out of the hand of Saul;","8":"And I gave thee thy master's house, and thy master's wives into thy bosom, and gave thee the house of Israel and of Judah; and if that had been too little, I would moreover have given unto thee such and such things.","9":"Wherefore hast thou despised the commandment of the LORD, to do evil in his sight? thou hast killed Uriah the Hittite with the sword, and hast taken his wife to be thy wife, and hast slain him with the sword of the children of Ammon.","10":"Now therefore the sword shall never depart from thine house; because thou hast despised me, and hast taken the wife of Uriah the Hittite to be thy wife.","11":"Thus saith the LORD, Behold, I will raise up evil against thee out of thine own house, and I will take thy wives before thine eyes, and give them unto thy neighbour, and he shall lie with thy wives in the sight of this sun.","12":"For thou didst it secretly: but I will do this thing before all Israel, and before the sun.","13":"And David said unto Nathan, I have sinned against the LORD. And Nathan said unto David, The LORD also hath put away thy sin; thou shalt not die.","14":"Howbeit, because by this deed thou hast given ➔ great occasion to the enemies of the LORD to blaspheme, the child also that is born unto thee shall surely die.","15":"And Nathan departed unto his house. And the LORD struck the child that Uriah's wife bare unto David, and it was very sick.","16":"David therefore besought God for the child; and David fasted, and went in, and lay all night upon the earth.","17":"And the elders of his house arose, and went to him, to raise him up from the earth: but he would not, neither did he eat bread with them.","18":"And it came to pass on the seventh day, that the child died. And the servants of David feared to tell him that the child was dead: for they said, Behold, while the child was yet alive, we spake unto him, and he would not hearken unto our voice: how will he then ➔ vex himself, if we tell him that the child is dead?","19":"But when David saw that his servants whispered, David perceived that the child was dead: therefore David said unto his servants, Is the child dead? And they said, He is dead.","20":"Then David arose from the earth, and washed, and anointed himself, and changed his apparel, and came into the house of the LORD, and worshipped: then he came to his own house; and when he required, they set bread before him, and he did eat.","21":"Then said his servants unto him, What thing is this that thou hast done? thou didst fast and weep for the child, while it was alive; but when the child was dead, thou didst rise and eat bread.","22":"And he said, While the child was yet alive, I fasted and wept: for I said, Who can tell whether GOD will be gracious to me, that the child may live?","23":"But now he is dead, wherefore should I fast? can I bring him back again? I shall go to him, but he shall not return to me.","24":"And David comforted Bathsheba his wife, and went in unto her, and lay with her: and she bare a son, and he called his name Solomon: and the LORD loved him.","25":"And he sent by the hand of Nathan the prophet; and he called his name Jedidiah, because of the LORD.","26":"And Joab fought against Rabbah of the children of Ammon, and took the royal city.","27":"And Joab sent messengers to David, and said, I have fought against Rabbah, and have taken the city of waters.","28":"Now therefore gather ➔ the rest of the people together, and encamp against the city, and take it: lest I take the city, and it be called after my name.","29":"And David gathered ➔ all the people together, and went to Rabbah, and fought against it, and took it.","30":"And he took their king's crown from off his head, the weight whereof was a talent of gold with the precious stones: and it was set on David's head. And he brought forth the spoil of the city in great abundance.","31":"And he brought forth the people that were therein, and put them under saws, and under harrows of iron, and under axes of iron, and made them pass through the brickkiln: and thus did he unto all the cities of the children of Ammon. So David and all the people returned unto Jerusalem."}},"tsk":{"1":[{"kopje":"de HEERE","refs":["2 Sam 7:1-5","2 Sam 24:11-13","1 Kon 13:1","1 Kon 18:1","2 Kon 1:3"]},{"kopje":"naar David","refs":["2 Sam 11:10-17","2 Sam 11:25","2 Sam 14:14","Jes 57:17","Jes 57:18"]},{"kopje":"hij kwam","refs":["Ps 51:3"]},{"kopje":"Er waren","refs":["2 Sam 14:5-11","Richt 9:7-15","1 Kon 20:35-41","Jes 5:1-7","Matt 21:33-45","Luk 15:11-32","Luk 16:19-31"]}],"2":[{"kopje":"heel veel","refs":["2 Sam 12:8","2 Sam 3:2-5","2 Sam 5:13-16","2 Sam 15:16","Job 1:3"]}],"3":[{"kopje":"klein","refs":["2 Sam 11:3","Spr 5:18","Spr 5:19"]},{"kopje":"sliep in zijn schoot","refs":["Deu span> <span class=\"wl wl-kjv\" data-code=\"H7235\">many</span> <span class=\"wl wl-kjv\" data-code=\"H6629\">flocks</span> and <span class=\"wl wl-kjv\" data-code=\"H1241\">herds:</span>","3":"But the <span class=\"wl wl-kjv\" data-code=\"H7326\">poor</span> man had nothing, save <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H6996\">little</span> ewe <span class=\"wl wl-kjv\" data-code=\"H3535\">lamb,</span> which he had <span class=\"wl wl-kjv\" data-code=\"H7069\">bought</span> and nourished <span class=\"wl wl-kjv\" data-code=\"H2421\">up:</span> and it grew <span class=\"wl wl-kjv\" data-code=\"H1431\">up</span> <span class=\"wl wl-kjv\" data-code=\"H3162\">together</span> with him, and with his <span class=\"wl wl-kjv\" data-code=\"H1121\">children;</span> it did <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> of his own <span class=\"wl wl-kjv\" data-code=\"H6595\">meat,</span> and <span class=\"wl wl-kjv\" data-code=\"H8354\">drank</span> of his own <span class=\"wl wl-kjv\" data-code=\"H3563\">cup,</span> and <span class=\"wl wl-kjv\" data-code=\"H7901\">lay</span> in his <span class=\"wl wl-kjv\" data-code=\"H2436\">bosom,</span> and was unto him as a <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter.</span>","4":"And there <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> a <span class=\"wl wl-kjv\" data-code=\"H1982\">traveller</span> unto the <span class=\"wl wl-kjv\" data-code=\"H6223\">rich</span> <span class=\"wl wl-kjv\" data-code=\"H376\">man,</span> and he <span class=\"wl wl-kjv\" data-code=\"H2550\">spared</span> to <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> of his own <span class=\"wl wl-kjv\" data-code=\"H6629\">flock</span> and of his own <span class=\"wl wl-kjv\" data-code=\"H1241\">herd,</span> to <span class=\"wl wl-kjv\" data-code=\"H6213\">dress</span> for the wayfaring <span class=\"wl wl-kjv\" data-code=\"H732\">man</span> that was <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> unto him; but <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> the <span class=\"wl wl-kjv\" data-code=\"H7326\">poor</span> <span class=\"wl wl-kjv\" data-code=\"H376\">man's</span> <span class=\"wl wl-kjv\" data-code=\"H3535\">lamb,</span> and <span class=\"wl wl-kjv\" data-code=\"H6213\">dressed</span> it for the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> that was <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> to him.","5":"And <span class=\"wl wl-kjv\" data-code=\"H1732\">David's</span> <span class=\"wl wl-kjv\" data-code=\"H639\">anger</span> was <span class=\"wl wl-kjv\" data-code=\"H3966\">greatly</span> <span class=\"wl wl-kjv\" data-code=\"H2734\">kindled</span> against the <span class=\"wl wl-kjv\" data-code=\"H376\">man;</span> and he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to <span class=\"wl wl-kjv\" data-code=\"H5416\">Nathan,</span> As the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H2416\">liveth,</span> the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> that hath <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> this thing shall <span class=\"wl wl-kjv\" data-code=\"H1121\">surely</span> <span class=\"wl wl-kjv\" data-code=\"H4194\">die:</span>","6":"And he shall <span class=\"wl wl-kjv\" data-code=\"H7999\">restore</span> the <span class=\"wl wl-kjv\" data-code=\"H3535\">lamb</span> <span class=\"wl wl-kjv\" data-code=\"H706\">fourfold,</span> <span class=\"wl wl-kjv\" data-code=\"H6118\">because</span> he <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> this <span class=\"wl wl-kjv\" data-code=\"H1697\">thing,</span> and <span class=\"wl wl-kjv\" data-code=\"H834\">because</span> he had no <span class=\"wl wl-kjv\" data-code=\"H2550\">pity.</span>","7":"And <span class=\"wl wl-kjv\" data-code=\"H5416\">Nathan</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> Thou art the <span class=\"wl wl-kjv\" data-code=\"H376\">man.</span> Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> I <span class=\"wl wl-kjv\" data-code=\"H4886\">anointed</span> thee <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> over <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> and I <span class=\"wl wl-kjv\" data-code=\"H5337\">delivered</span> thee out of the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul;</span>","8":"And I <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> thee thy <span class=\"wl wl-kjv\" data-code=\"H113\">master's</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> and thy <span class=\"wl wl-kjv\" data-code=\"H113\">master's</span> <span class=\"wl wl-kjv\" data-code=\"H802\">wives</span> into thy <span class=\"wl wl-kjv\" data-code=\"H2436\">bosom,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> thee the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> and of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah;</span> and if that had been too <span class=\"wl wl-kjv\" data-code=\"H4592\">little,</span> I would moreover have <span class=\"wl wl-kjv\" data-code=\"H3254\">given</span> unto thee <span class=\"wl wl-kjv\" data-code=\"H2007\">such</span> and such <span class=\"wl wl-kjv\" data-code=\"H2007\">things.</span>","9":"Wherefore hast thou <span class=\"wl wl-kjv\" data-code=\"H959\">despised</span> the <span class=\"wl wl-kjv\" data-code=\"H1697\">commandment</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> to <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> in his <span class=\"wl wl-kjv\" data-code=\"H5869\">sight?</span> thou hast <span class=\"wl wl-kjv\" data-code=\"H5221\">killed</span> <span class=\"wl wl-kjv\" data-code=\"H223\">Uriah</span> the <span class=\"wl wl-kjv\" data-code=\"H2850\">Hittite</span> with the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword,</span> and hast <span class=\"wl wl-kjv\" data-code=\"H3947\">taken</span> his <span class=\"wl wl-kjv\" data-code=\"H802\">wife</span> to be thy <span class=\"wl wl-kjv\" data-code=\"H802\">wife,</span> and hast <span class=\"wl wl-kjv\" data-code=\"H2026\">slain</span> him with the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H5983\">Ammon.</span>","10":"Now therefore the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword</span> shall <span class=\"wl wl-kjv\" data-code=\"H5704\">never</span> <span class=\"wl wl-kjv\" data-code=\"H5493\">depart</span> from thine <span class=\"wl wl-kjv\" data-code=\"H1004\">house;</span> <span class=\"wl wl-kjv\" data-code=\"H6118\">because</span> thou hast <span class=\"wl wl-kjv\" data-code=\"H959\">despised</span> me, and hast <span class=\"wl wl-kjv\" data-code=\"H3947\">taken</span> the <span class=\"wl wl-kjv\" data-code=\"H802\">wife</span> of <span class=\"wl wl-kjv\" data-code=\"H223\">Uriah</span> the <span class=\"wl wl-kjv\" data-code=\"H2850\">Hittite</span> to be thy <span class=\"wl wl-kjv\" data-code=\"H802\">wife.</span>","11":"Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> Behold, I will raise <span class=\"wl wl-kjv\" data-code=\"H6965\">up</span> <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> against thee out of thine own <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> and I will <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> thy <span class=\"wl wl-kjv\" data-code=\"H802\">wives</span> before thine <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> them unto thy <span class=\"wl wl-kjv\" data-code=\"H7453\">neighbour,</span> and he shall <span class=\"wl wl-kjv\" data-code=\"H7901\">lie</span> with thy <span class=\"wl wl-kjv\" data-code=\"H802\">wives</span> in the <span class=\"wl wl-kjv\" data-code=\"H5869\">sight</span> of this <span class=\"wl wl-kjv\" data-code=\"H8121\">sun.</span>","12":"For thou <span class=\"wl wl-kjv\" data-code=\"H6213\">didst</span> it <span class=\"wl wl-kjv\" data-code=\"H5643\">secretly:</span> but I will <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> this <span class=\"wl wl-kjv\" data-code=\"H1697\">thing</span> before all <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> and before the <span class=\"wl wl-kjv\" data-code=\"H8121\">sun.</span>","13":"And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H5416\">Nathan,</span> I have <span class=\"wl wl-kjv\" data-code=\"H2398\">sinned</span> against the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD.</span> And <span class=\"wl wl-kjv\" data-code=\"H5416\">Nathan</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> also hath put <span class=\"wl wl-kjv\" data-code=\"H5674\">away</span> thy <span class=\"wl wl-kjv\" data-code=\"H2403\">sin;</span> thou shalt not <span class=\"wl wl-kjv\" data-code=\"H4191\">die.</span>","14":"<span class=\"wl wl-kjv\" data-code=\"H657\">Howbeit,</span> because by this <span class=\"wl wl-kjv\" data-code=\"H1697\">deed</span> thou hast <span class=\"wl wl-kjv\" data-code=\"H5006\">given</span> ➔ great <span class=\"wl wl-kjv\" data-code=\"H5006\">occasion</span> to the <span class=\"wl wl-kjv\" data-code=\"H341\">enemies</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> to <span class=\"wl wl-kjv\" data-code=\"H5006\">blaspheme,</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">child</span> also that is <span class=\"wl wl-kjv\" data-code=\"H3209\">born</span> unto thee shall <span class=\"wl wl-kjv\" data-code=\"H4191\">surely</span> <span class=\"wl wl-kjv\" data-code=\"H4191\">die.</span>","15":"And <span class=\"wl wl-kjv\" data-code=\"H5416\">Nathan</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">departed</span> unto his <span class=\"wl wl-kjv\" data-code=\"H1004\">house.</span> And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H5062\">struck</span> the <span class=\"wl wl-kjv\" data-code=\"H3206\">child</span> that <span class=\"wl wl-kjv\" data-code=\"H223\">Uriah's</span> <span class=\"wl wl-kjv\" data-code=\"H802\">wife</span> <span class=\"wl wl-kjv\" data-code=\"H3205\">bare</span> unto <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> and it was very <span class=\"wl wl-kjv\" data-code=\"H605\">sick.</span>","16":"<span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> therefore <span class=\"wl wl-kjv\" data-code=\"H1245\">besought</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> for the <span class=\"wl wl-kjv\" data-code=\"H5288\">child;</span> and <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H6684\">fasted,</span> and went <span class=\"wl wl-kjv\" data-code=\"H935\">in,</span> and <span class=\"wl wl-kjv\" data-code=\"H7901\">lay</span> all <span class=\"wl wl-kjv\" data-code=\"H3885\">night</span> upon the <span class=\"wl wl-kjv\" data-code=\"H776\">earth.</span>","17":"And the <span class=\"wl wl-kjv\" data-code=\"H2205\">elders</span> of his <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> <span class=\"wl wl-kjv\" data-code=\"H6965\">arose,</span> and went to him, to raise him <span class=\"wl wl-kjv\" data-code=\"H6965\">up</span> from the <span class=\"wl wl-kjv\" data-code=\"H776\">earth:</span> but he <span class=\"wl wl-kjv\" data-code=\"H14\">would</span> not, neither did he <span class=\"wl wl-kjv\" data-code=\"H1262\">eat</span> <span class=\"wl wl-kjv\" data-code=\"H3899\">bread</span> with them.","18":"And it came to pass on the <span class=\"wl wl-kjv\" data-code=\"H7637\">seventh</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> that the <span class=\"wl wl-kjv\" data-code=\"H3206\">child</span> <span class=\"wl wl-kjv\" data-code=\"H4191\">died.</span> And the <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> of <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H3372\">feared</span> to <span class=\"wl wl-kjv\" data-code=\"H5046\">tell</span> him that the <span class=\"wl wl-kjv\" data-code=\"H3206\">child</span> was <span class=\"wl wl-kjv\" data-code=\"H4191\">dead:</span> for they <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Behold, while the <span class=\"wl wl-kjv\" data-code=\"H3206\">child</span> was yet <span class=\"wl wl-kjv\" data-code=\"H2416\">alive,</span> we <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> unto him, and he would not <span class=\"wl wl-kjv\" data-code=\"H8085\">hearken</span> unto our <span class=\"wl wl-kjv\" data-code=\"H6963\">voice:</span> how will he <span class=\"wl wl-kjv\" data-code=\"H6213\">then</span> ➔ <span class=\"wl wl-kjv\" data-code=\"H7451\">vex</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">himself,</span> if we <span class=\"wl wl-kjv\" data-code=\"H559\">tell</span> him that the <span class=\"wl wl-kjv\" data-code=\"H3206\">child</span> is <span class=\"wl wl-kjv\" data-code=\"H4191\">dead?</span>","19":"But when <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> that his <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> <span class=\"wl wl-kjv\" data-code=\"H3907\">whispered,</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H995\">perceived</span> that the <span class=\"wl wl-kjv\" data-code=\"H3206\">child</span> was <span class=\"wl wl-kjv\" data-code=\"H4191\">dead:</span> therefore <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto his <span class=\"wl wl-kjv\" data-code=\"H5650\">servants,</span> Is the <span class=\"wl wl-kjv\" data-code=\"H3206\">child</span> <span class=\"wl wl-kjv\" data-code=\"H4191\">dead?</span> And they <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> He is <span class=\"wl wl-kjv\" data-code=\"H4191\">dead.</span>","20":"Then <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H6965\">arose</span> from the <span class=\"wl wl-kjv\" data-code=\"H776\">earth,</span> and <span class=\"wl wl-kjv\" data-code=\"H7364\">washed,</span> and <span class=\"wl wl-kjv\" data-code=\"H5480\">anointed</span> himself, and <span class=\"wl wl-kjv\" data-code=\"H2498\">changed</span> his <span class=\"wl wl-kjv\" data-code=\"H8071\">apparel,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> into the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and <span class=\"wl wl-kjv\" data-code=\"H7812\">worshipped:</span> then he <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to his own <span class=\"wl wl-kjv\" data-code=\"H1004\">house;</span> and when he <span class=\"wl wl-kjv\" data-code=\"H7592\">required,</span> they <span class=\"wl wl-kjv\" data-code=\"H7760\">set</span> <span class=\"wl wl-kjv\" data-code=\"H3899\">bread</span> before him, and he did <span class=\"wl wl-kjv\" data-code=\"H398\">eat.</span>","21":"Then <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> his <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> unto him, What <span class=\"wl wl-kjv\" data-code=\"H1697\">thing</span> is this that thou hast <span class=\"wl wl-kjv\" data-code=\"H6213\">done?</span> thou didst <span class=\"wl wl-kjv\" data-code=\"H6684\">fast</span> and <span class=\"wl wl-kjv\" data-code=\"H1058\">weep</span> for the <span class=\"wl wl-kjv\" data-code=\"H3206\">child,</span> while it was <span class=\"wl wl-kjv\" data-code=\"H2416\">alive;</span> but when the <span class=\"wl wl-kjv\" data-code=\"H3206\">child</span> was <span class=\"wl wl-kjv\" data-code=\"H4191\">dead,</span> thou didst <span class=\"wl wl-kjv\" data-code=\"H6965\">rise</span> and <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> <span class=\"wl wl-kjv\" data-code=\"H3899\">bread.</span>","22":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> While the <span class=\"wl wl-kjv\" data-code=\"H3206\">child</span> was yet <span class=\"wl wl-kjv\" data-code=\"H2416\">alive,</span> I <span class=\"wl wl-kjv\" data-code=\"H6684\">fasted</span> and <span class=\"wl wl-kjv\" data-code=\"H1058\">wept:</span> for I <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Who can <span class=\"wl wl-kjv\" data-code=\"H3045\">tell</span> whether <span class=\"wl wl-kjv\" data-code=\"H3068\">GOD</span> will be <span class=\"wl wl-kjv\" data-code=\"H2603\">gracious</span> to me, that the <span class=\"wl wl-kjv\" data-code=\"H3206\">child</span> may <span class=\"wl wl-kjv\" data-code=\"H2416\">live?</span>","23":"But now he is <span class=\"wl wl-kjv\" data-code=\"H4191\">dead,</span> wherefore should I <span class=\"wl wl-kjv\" data-code=\"H6684\">fast?</span> <span class=\"wl wl-kjv\" data-code=\"H3201\">can</span> I bring him back <span class=\"wl wl-kjv\" data-code=\"H7725\">again?</span> I shall <span class=\"wl wl-kjv\" data-cod </span>","27":"And <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> <span class=\"wl wl-kjv\" data-code=\"H4397\">messengers</span> to <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> I have <span class=\"wl wl-kjv\" data-code=\"H3898\">fought</span> against <span class=\"wl wl-kjv\" data-code=\"H7237\">Rabbah,</span> and have <span class=\"wl wl-kjv\" data-code=\"H3920\">taken</span> the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> of <span class=\"wl wl-kjv\" data-code=\"H4325\">waters.</span>","28":"Now therefore <span class=\"wl wl-kjv\" data-code=\"H622\">gather</span> ➔ the <span class=\"wl wl-kjv\" data-code=\"H3499\">rest</span> of the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H622\">together,</span> and <span class=\"wl wl-kjv\" data-code=\"H2583\">encamp</span> against the <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> and <span class=\"wl wl-kjv\" data-code=\"H3920\">take</span> it: lest I <span class=\"wl wl-kjv\" data-code=\"H3920\">take</span> the <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> and it be <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> after my <span class=\"wl wl-kjv\" data-code=\"H8034\">name.</span>","29":"And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H622\">gathered</span> ➔ all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H622\">together,</span> and <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> to <span class=\"wl wl-kjv\" data-code=\"H7237\">Rabbah,</span> and <span class=\"wl wl-kjv\" data-code=\"H3898\">fought</span> against it, and <span class=\"wl wl-kjv\" data-code=\"H3920\">took</span> it.","30":"And he <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> their <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H5850\">crown</span> from off his <span class=\"wl wl-kjv\" data-code=\"H7218\">head,</span> the <span class=\"wl wl-kjv\" data-code=\"H4948\">weight</span> whereof was a <span class=\"wl wl-kjv\" data-code=\"H3603\">talent</span> of <span class=\"wl wl-kjv\" data-code=\"H2091\">gold</span> with the <span class=\"wl wl-kjv\" data-code=\"H3368\">precious</span> <span class=\"wl wl-kjv\" data-code=\"H68\">stones:</span> and it was set on <span class=\"wl wl-kjv\" data-code=\"H1732\">David's</span> <span class=\"wl wl-kjv\" data-code=\"H7218\">head.</span> And he brought <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> the <span class=\"wl wl-kjv\" data-code=\"H7998\">spoil</span> of the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> in <span class=\"wl wl-kjv\" data-code=\"H3966\">great</span> <span class=\"wl wl-kjv\" data-code=\"H7235\">abundance.</span>","31":"And he brought <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> that were therein, and <span class=\"wl wl-kjv\" data-code=\"H7760\">put</span> them under <span class=\"wl wl-kjv\" data-code=\"H4050\">saws,</span> and under <span class=\"wl wl-kjv\" data-code=\"H2757\">harrows</span> of <span class=\"wl wl-kjv\" data-code=\"H1270\">iron,</span> and under <span class=\"wl wl-kjv\" data-code=\"H4037\">axes</span> of <span class=\"wl wl-kjv\" data-code=\"H1270\">iron,</span> and made them <span class=\"wl wl-kjv\" data-code=\"H5674\">pass</span> through the <span class=\"wl wl-kjv\" data-code=\"H4404\">brickkiln:</span> and thus <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> he unto all the <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H5983\">Ammon.</span> So <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> and all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">returned</span> unto <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem.</span>"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"Nathan tot David","tekst":"Den profeet, gelijk boven, 2Sa 7:2."},{"catchword":"Er waren twee mannen in een stad,","tekst":"Door middel van deze gelijkenis en hare verklaring heeft het den genadigen God beliefd zijn knecht David vooreerst daartoe te brengen, dat hij tegen zichzelven onwetend het vonnis zou uitspreken, en voorst door de krachtige werking des Heiligen Geestes uit den slaap zijner zonden ontwaken, derzelver gruwelijkheid behartigen, en een oprecht berouw bekomen en bewijzen, gelijk geschied is."}],"5":[{"catchword":"dien man;","tekst":"Versta, den rijken man."},{"catchword":"kind des doods","tekst":"Dat is, hij is des doods schuldig, hij heeft den dood verdiend, ten aanzien van de omstandigheden des bitteren gewelds, dat hij aan dien armen man gepleegd had. Vergelijk met deze manier van spreken, Gen 20:3; Deu 25:2; boven 2Sa 3:34, en Eph 2:3."}],"6":[{"catchword":"viervoudig wedergeven,","tekst":"Naar de wet, Exo 22:1."}],"7":[{"catchword":"zijt die man","tekst":"Dat is, gij zijt dien man gelijk, hebbende zoveel te grover en gruwelijker feit bedreven, als het meerder is iemand zijn enige echte vrouw te ontnemen, dan een enig lam, en nog daarenboven den onschuldigen man te doden."}],"8":[{"catchword":"heren huis gegeven,","tekst":"Sauls. Hebreeuws, Uwer heren; in het getal van velen, hetwelk voor het getal van enen in de Heilige Schrift pleegt gebruikt te worden. Zie Gen 39:2. Sommigen behouden, in de overzetting het getal van velen, aldus: uwer heren; dat is, dergenen, die meerder en machtiger waren dan gij, en alzo in de volgende woorden; verstaande dat het huwelijk tussen David en Saul vrouwen [vanwege de zwagerschap] ongeoorloofd is geweest. Sommigen verstaan door de vrouwen van Saul niet zijn huisvrouwen, maar andere staatsvrouwen."},{"catchword":"vrouwen","tekst":"Niet dat God de veelheid der vrouwen voor goed heeft gekend, maar in het Oude Testament verdragen zonder straf."},{"catchword":"schoot,","tekst":"Zie Gen 16:5; Deu 13:6. Anderen verstaan, in uw schoot; dat is, in uw macht; alzo nochtans dat hij haar tegen Gods wet niet mocht misbruiken. Vergelijk 1Sa 24:11."},{"catchword":"huis van Israël en Juda gegeven;","tekst":"Dat is, het koninkrijk van mijn ganse volk."},{"catchword":"indien het weinig is,","tekst":"Of, indien [u dit te] weinig [mocht hebben toegeschenen] ik zou u daarenboven alzulks en alzulks daartoe hebben gedaan. Hebreeuws, als, of, na die en na die dingen. God wil zeggen, dat Hij, die hem zoveel goeds gedaan had, machtig was hem wijders van alles naar zijns harten wens te verzorgen, indien hem iets mocht ontbreken. Zulks dat hij gans geen reden had zijn zo goedigen God alzo te vertoornen, en zijn boze lusten met zulke schandelijke middelen te voldoen."}],"9":[{"catchword":"woord des HEEREN veracht,","tekst":"Het zesde, zevende en achtste gebod van de wet des Heeren."},{"catchword":"verslagen,","tekst":"Beschikkende door Joab dat hij van de Ammonieten is omgebracht, gelijk in het volgende wordt verklaard. Zie boven, 2Sa 11:14-17."},{"catchword":"kinderen Ammons doodgeslagen","tekst":"Die onbesneden en vijanden van God en zijn volk waren."}],"10":[{"catchword":"eeuwigheid;","tekst":"Dat is, een langen tijd, of uw levenlang; gelijk 1Sa 1:22. Zie ook Deu 15:17."}],"11":[{"catchword":"uit uw huis,","tekst":"Versta, door Davids eigen zonen, Amnon, Absalom en Adonia, gelijk in 2Sa 13 en 1Ki 1 verhaald wordt. Door deze boosheid heeft God met een heilig en onstraffelijk oordeel David, om zijner zonden wil, scherpelijk getuchtigd en gekastijd. Zie vs.12."},{"catchword":"voor uw ogen,","tekst":"Dat is, bij uw leven, dat gij het met verdriet en hartzeer zult moeten horen en geloven, alsof gij het met uw ogen hadt gezien, zowel als gans Israël. Zie onder, 2Sa 16:22."},{"catchword":"naaste geven;","tekst":"Namelijk, Absalom"},{"catchword":"ogen dezer zon","tekst":"Dat is, bij lichten, hellen dag, bij den zonneschijn; alzo wordt van zulke schepselen dikwijls gesproken alsof zij gehoor, gezicht en verstand hadden. Zie Deu 32:1."}],"12":[{"catchword":"deze zaak doen voor gans Israël, en voor de zon","tekst":"ie in 2Sa 12:11 verhaald is, te weten, dat God Davids vrouwen zou nemen, en die Absalom geven enz. Is dan God een auteur van Absaloms gruwelijke zonden? Dat zij verre. Nochtans zegt Hij hier uitdrukkelijk dat Hij deze zaak doen zal, enz. Heeft Hij dan Absalom deze boosheid en zonde niet ingestort? Geenszins. Maar Hij heeft Absaloms en Achitofels en des duivels moedwillige boosheid, [die zij van zichzelven hadden] door zijn heilige voorzienigheid alzo geregeerd, dat zij die tot Davids verdriet hebben aangewend en gebruikt; hetwelk den duivel, Absalom en Achitofel [die hun hart en boze lusten gezocht hebben te volbrengen] zo weinig verschoont, als Gods raad van zijn welbeminden Zoon tot onze zaligheid in den dood over te leveren, den verrader Judas, de Joden en Pilatus heeft kunnen verschonen. Het werk van Absalom enz. is boos en duivels, maar Gods werk is heilig en goed; want Hij heeft door boze instrumenten zijn knecht David tot zijn eer en Davids best willen kastijden. Absaloms en Achitofels boosheid ontdekken en tot eer zijner rechtvaardigheid straffen. Van zulke exempelen van Gods voorzienigheid en regering over het kwaad is de Heilige Schrift overal vol. En dit heeft David zeer wel geweten en bekend, en deshalve zich voor God hartelijk verootmoedigd. Zie Gen 45:5."}],"13":[{"catchword":"Ik heb gezondigd tegen den HEERE","tekst":"Zie de verklaring van deze bekentenis in Psa 51."},{"catchword":"weggenomen,","tekst":"Hebreeuws eigenlijk, doen overgaan, doorgaan, voorbijgaan; dat is, vergeven, kwijtgescholden. Alzo onder, 2Sa 24:10; Job 7:21. Vergelijk 1Ch 21:8; Pro 19:11; Amo 7:8; Mic 7:18, en Zec 3:4."},{"catchword":"sterven","tekst":"Dat is, Ik zal u om deze zonde met den dood noch tijdelijk noch eeuwiglijk straffen, hoewel gij het volgens uw eigen vonnis, vs.5, en mijn rechtvaardigheid wel verdiend hadt."}],"14":[{"catchword":"grotelijks","tekst":"Hebreeuws, lasterende hebt doen lasteren. Vooreerst, den Ammonieten, die, Uria en anderen van uw knechten doodgeslagen hebbende, hun goden, naar de wijze der heidenen, hebben geroemd, en den God Israëls, als onmachtig, gelasterd, en ten tweede, in het algemeen alle omliggende vijanden, die kwalijk van God en zijn volk spreken, dat zij van zulk een koning veel meer werk maken, die zo lelijke stukken bedrijft aan zijn goede onderzaten. Of, gij hebt hun oorzaak gegeven om lasterlijk te spreken, wanneer zij dit zullen vernemen. Vergelijk Rom 2:24, en elders."},{"catchword":"den dood sterven","tekst":"Hebreeuws, stervende sterven."}],"15":[{"catchword":"van Uria David gebaard had,","tekst":"Dat is, die Uria's huisvrouw geweest was. Vergelijk boven, 2Sa 2:2."}],"16":[{"catchword":"zocht God","tekst":"Dat is hier te zeggen, hij bad God vuriglijk om des kinds gezondheid. Zie 2Ch 20:3-4; Psa 27:8, en Psa 34:5, en Psa 77:3; Isa 26:16, en Isa 31:1; Jer 50:4, enz."},{"catchword":"ging in,","tekst":"In zijn binnenkamer, of kabinet."},{"catchword":"lag den nacht over op de aarde","tekst":"Hebreeuws, hij vernachtte en lag op de aarde."}],"17":[{"catchword":"oudsten van zijn huis","tekst":"Dat is, zijn voornaamste officieren of hovelingen, die in het volgende zijn knechten genoemd worden."},{"catchword":"brood met hen","tekst":"Zie boven, 2Sa 3:35, en elders dikwijls."}],"18":[{"catchword":"kwaad doen","tekst":"Dat is, dit mocht hem nog meer kwellen en bedroeven dan tevoren."}],"19":[{"catchword":"mompelden;","tekst":"Binnensmonds en zachtjes, stillekens met elkander spraken, opdat het David niet mocht horen."}],"20":[{"catchword":"wies en zalfde zich,","tekst":"Zie Rth 3:3."},{"catchword":"huis des HEEREN,","tekst":"Versta, de tent, die David voor de ark had doen maken. Zie boven, 2Sa 6:17."},{"catchword":"brood voor,","tekst":"Gelijk boven, vs.17, en in vs.22."}],"22":[{"catchword":"zeide","tekst":"Te weten, bij mijzelven, dat is, ik dacht."}],"23":[{"catchword":"wederhalen?","tekst":"Te weten, in het leven."},{"catchword":"hem gaan,","tekst":"Te weten, tot het kind, naar het lichaam in het graf, naar de ziel in den hemel."},{"catchword":"wederkomen","tekst":"In dit leven."}],"24":[{"catchword":"Sálomo;","tekst":"Hebreeuws, Schelomoh. Dezen naam heeft David hem gegeven naar Gods bevel. Zie 1Ch 22:9."}],"25":[{"catchword":"En zond heen","tekst":"Te weten, de HEERE. Anders, hij [David] zond [hem] onder de hand van den profeet Nathan [dat is, om van Nathan geleerd en geregeerd te worden in des Heeren vreze], die zijn naam noemde Jedid-Jah"},{"catchword":"hand van den profeet Nathan,","tekst":"Dat is, door den dienst."},{"catchword":"Jedid-jah,","tekst":"Dat is, beminde des Heeren. Hebreeuws, Jedijde-Jah"},{"catchword":"om des HEEREN wil","tekst":"Dat is, omdat de Heere hem liefhad, gelijk vs.24 gezegd is, en omdat hij een voorbeeld zou zijn van den Heere Christus, die de welbeminde Zoon Gods, de stichter van Gods huis en de rechte koning des vredes is. Zie boven 2Sa 7:13, enz. 1Ch 22:9-10; Psa 45; Hooglied doorgaans; Isa 9:5, enz.; Mat 3:17; Luk 1:32-33; Heb 3:6."}],"26":[{"catchword":"Joab nu krijgde","tekst":"Hier wordt nu vervolgd de historie, die begonnen is boven, 2Sa 11."},{"catchword":"koninklijke stad in","tekst":"Hebreeuws, de stad des koninkrijks. Waardoor men verstaan kan dat deel der stad, waar het koninklijke hof in was, dat aan het water gelegen of met wateren omsingeld mag geweest zijn. Zie vs.27."}],"27":[{"catchword":"zeide","tekst":"Dat is, liet hem zeggen."},{"catchword":"waterstad ingenomen","tekst":"Zie vs.26."}],"28":[{"catchword":"over haar uitgeroepen worde","tekst":"Of, daarover genoemd worde; dat is, opdat gij de eer daarvan moogt hebben, en niet ik, die de eer zou hebben indien men zeide: Joab heeft Rabba gewonnen."}],"29":[{"catchword":"dat volk,","tekst":"Het overige volk, gelijk in vs.28 gezegd is."}],"30":[{"catchword":"gewicht was","tekst":"Anders, prijs, of, waardij"},{"catchword":"talent gouds,","tekst":"Zie Exo 25:39. Een burgerlijk talent gouds zou bedragen twee en zestig pond en een half, het pond van twaalf onsen, hetwelk is zes en veertig ponden [elk pond van zestien onsen] en veertien onsen."}],"31":[{"catchword":"volk nu,","tekst":"Versta, zovel van hen, als tot voorbeeldige straf nodig was. Onder, 2Sa 17:27, wordt verhaald van enen Sobi, die sommigen menen dat de zoon des konings van Rabba was, en niet alleen in het leven behouden, maar ook van David in zijns broeders Hanums plaats koning gemaakt is."},{"catchword":"legde het","tekst":"Deze harde straffen, in de oosterse landen [zo men meent] gebruikelijk, heeft David den Ammonieten aangedaan, omdat zij zijn vriendelijke intentie en daad zo bitterlijk misduid, en zijn gezanten, tegen alle volkenrecht, zo schandelijk behandeld hadden; zie boven, 2Sa 10:2-4, en daarenboven gruwelijke afgodendienaars, lasteraars en vijanden van God en zijn volk waren, die zonder twijfel zulke soorten van doden het volk Gods tirannelijk hadden aangedaan. Vergelijk boven 2Sa 8:2; Amo 1:3, en Heb 11:37, en zie van de getakte dorswagens Deu 25:4."},{"catchword":"zagen,","tekst":"Dat is, hij liet hen doorzagen, met ijzeren getakte dorswagens [gelijk koren] verpletteren, met bijlen doorhouwen en in tichelovens verbranden."},{"catchword":"ticheloven doorgaan;","tekst":"Anders, door den oven van Malchen, [dat is, Moloch ] welken afgod zij hun kinderen gewoon waren te offeren, latende die passeren door het vuur. Zie 2Ki 16:3, en 2Ki 23:10; idem Lev 18:21, en Lev 20:2, enz."}]},"kanttekeningen_en":{"1":[{"catchword":"And the LORD sent Nathan","tekst":"The Prophet, as above cha.7.2."},{"catchword":"unto David: When he came in unto him, he said unto him; there were two men in one city the one rich, and the other poor","tekst":"by means of this parable and the exposition thereof it pleased God first to bring his servant David to this, that he ignorantly passed sentence against himself, and the next place awaked out of the sleep of his sins, laid to heart the abomination and odiousness thereof, and obtained and manifested true sincere repentance for the same."}],"5":[{"catchword":"Then David&acirc;&euro;&trade;s anger kindled greatly against that man:","tekst":"Meaning the rich man"},{"catchword":"and he said unto Nathan; (as true as) the LORD liveth, that man that hath done that, is a child of death","tekst":"i.e. he is guilty of death, he hath deserved death: in regard of the circumstance of the merciless cruelty used toward that poor man. Compare with this phrase, Deut.25.on v.2. Gen 20:3. Eph.2.3. and above chap.3.on v.34."}],"6":[{"catchword":"And he shall restore that ew-lamb four fold","tekst":"According to the Law of God, Exod.22, 1. because he did this thing, and because he hath not spared."}],"7":[{"catchword":"Then said Nathan unto David; thou art that man:","tekst":"i.e. thou art like that man, having commited so much the grosser, and more abominable fact; as it is a far greater crime to take any mans wedded wife from him, then to take from any man an only lamb: and yet besides to put the guiltless man to death Thus saith the LORD, the God of Israel, and I delivered thee out of the hand of Saul:"}],"8":[{"catchword":"And I gave thee thy Lords house","tekst":"i.e. Sauls house. Heb. the house of thy Lords, in the plural number, which in the Holy Scripture is wont to be used for the singular number. See Gen.39.on v.2. Some retain in the translation the plural number thus: of thy Lords; that is, of those that were greater and mightier then thou: and so in the following words; understanding that the match or marriage between David and Sauls wives (in respect of the assinity) was unlawfull. Some understand by Sauls wives, not his wedded wives, but other Ladies of honour"},{"catchword":"besides thy Lords wives","tekst":"not that God approved of the plurality of wives, but tolerated or suffered it in the old Testament, without punishing the same"},{"catchword":"into thy besome","tekst":"see Gen 16:5. Deut.13.on v.6. Others understand, into thy bosome, that is, into thy power: yet so, as that he might not abuse them against the Law of God. Compare 1 Sam, 24.11."},{"catchword":"yea I gave thee the house of Israel and of Juda","tekst":"i.e. the Kingdom of all my people"},{"catchword":"and if it be little, I would do moreover such and such (things) for thee","tekst":"or if (this haf seemed too) little (for the), I would moreover have done such and such (things) for thee. Heb. as, or, according to those and according to these things. Intimating that God who had done him so much good, was able further to provide for him according to his own hearts desire, if any thing should be lacking unto him: So that he had no cause at all to provoke his so good and gracious God in such a manner as he had done; and to satisfy his wicked and sinful by such base and shameful means."}],"9":[{"catchword":"Wherefore (then) hast thou despised the word of the LORD","tekst":"viz. the sixth, seventh and eighth commandement of the Law of the Lord"},{"catchword":"doing that which is evil in his eyes? Thou hast smitten Uria the Hethite with the Sword","tekst":"procuring him by Joabs means, to be slain by the Ammonites, as in the following words is declared. See above chap.11.14, 15, 16, 17."},{"catchword":"and thou hast taken thee his wife to wife: and thou hast slain him with the Sword of the children of Ammon","tekst":"which were uncircumcised, and Enemies of God and his people."}],"10":[{"catchword":"Now then the Sword shall not depart from thine house for ever","tekst":"i.e. in a long time, or all thy life time, as 1 Sam,1.on v.22. See also Deu.15.on v.17. because thou hast despised me, and hast taken the wife of Uria the Hethite (to be) thy wife."}],"11":[{"catchword":"Thus saith the LORD, behold, I will raise up evil against thee out of thine (own) house","tekst":"Meaning by David&acirc;&euro;&trade;s own sons, Ammon, Absalom and Adonia, as in the following chapters, and 1 Kings 1. is related . By their wickedness did God, in his just and unrebukable judgement, severely punish and chasten David for his sins. See on the following verse"},{"catchword":"and will give them unto thy neighbour:","tekst":"namely, Absolom"},{"catchword":"he shall lie with thy wives before the eyes of this Sun","tekst":"i.e. in broad day-light, evening while the Sun shineth. Thus often mention is made of these creatures, as if they had hearing, sight and understanding. See Deu.32.on v.1."}],"12":[{"catchword":null,"tekst":"For thou didst it secretly; but I will do this thing take David&acirc;&euro;&trade;s wives, and give them unto Absalom, etc. Is God then the Author of Absaloms abominable sins? God forbid. Yet he faith here expressly, that he will do this thing, etc. Did he then not pour this sin and wickedness into Absalom. But he so ruled and ordered Absaloms, Achitophels, and the divers wilfull wickedness, (which they had of themselves) by his holy providence, that they practised and used the same to David&acirc;&euro;&trade;s grief and sorrow, which so little favoureth the Devil, Absalom, and Achitophel (who sought to fulfil their own hatred and wicked lusts) as Gods counsel of delivering up to death his well beloved Son for our salvation, did or could favour Judas the traitor, the Jews and Pilate. The work of Absalom, &c is wicked and devilish, but the work of God is holy and good: for he intended to chasten his servant David by evil instruments for his own glory and David&acirc;&euro;&trade;s good, to discover Absaloms and Achitophels wickedness, and to punish the same to the glory of his own righteousness. The holy Scripture every where aboundeth with such examples of Gods over-ruling providence in and concerning evil. And this David knew and Acknowledged full well, and therefore did heartily humble himself before God. See Gen.45.on v.5.] before all Israel, and before the Sun."}],"13":[{"catchword":"Then said David unto Nathan; I have sinned against the LORD","tekst":"See the declaration of this confession in the 51. Psalm"},{"catchword":"And Nathan said unto David; the LORD hath also taken away","tekst":"Heb. caused to pass over, pass thorow, pass by, i.e. forgiven, pardoned, remitted. So below chap.24.10. Job 7:21. Compare Mich. 7.18. and 1 Chron.21.8. Pro 19:11. Amos 7.8. Zach.3.4."},{"catchword":"thy sin, thou shalt not die","tekst":"i.e. I will not punish thee with death for this sin, either temporally, or eternally, although thou hast well deserved it, according to thine own sentence, v.5. and my justice."}],"14":[{"catchword":"Yet, because by this thing thou hast caused the Enemy of the LORD greatly to blasphem","tekst":"Heb. blaspheming hast caused to blasphem. First, the Ammonites, who having slain Uria and others of thy servants, have praised their Gods, after the manner of the heathen, and blasphemed the God of Israel, as void of power; and in the second place, generally all Enemies round about, who speak evil of God and his people, making much of such a King, who commited such soul acts upon his good subjects. Or thou hast given them occasion to speak blasphemously, when they shall hear of this, compare Rom 2:24. and elsewhere"},{"catchword":"also the child that is born unto thee, shall die the death","tekst":"Heb. dying die."}],"15":[{"catchword":"Then Nathan went unto his house; and the LORD smote the child, which the wife of Uria","tekst":"i.e. which had been Uria&acirc;&euro;&trade;s wife. Compare above chap.2.on v.2. had born unto David, (so) that it was very sick."}],"16":[{"catchword":"And David sought God for the child:","tekst":"That is to say in this place, he prayed servently unto God for the child&acirc;&euro;&trade;s health. See 2 Chron.20.3, 4. Psa 27:8. and 34.5. and 77.3. Isa, 26.26. and 31.1. Jer 50:4, etc."},{"catchword":"and David fasted a fast, and went in","tekst":"i.e. into his inne5r chamber, or closet"},{"catchword":"and lay all night on the ground","tekst":"Heb. he over-nighted, and lay on the ground."}],"17":[{"catchword":"Then the Eldest of his house","tekst":"i.e. his chiefest Officers and Courtiers, who in the following verse are called his servants"},{"catchword":"gat them up to him, to make him rise up from the ground; but he would not, and did eat no bread","tekst":"see above chap.3.on v.35. and elsewhere often with them."}],"18":[{"catchword":"And it came to pass on the seventh day, that the child died: and David&acirc;&euro;&trade;s servanrs feared to tell him that the child was dead: for they said; behold, when the child was yet alive, we spake unto him, but he hearkened not to our voice, how shall we then say unto him, the child is dead? For it might hurt","tekst":"i.e. this might vex and grieve him yet more then formerly."}],"19":[{"catchword":null,"tekst":"But David saw that his servants whispered; so David perceived that the child was dead: therefore David said unto his servants; Is the child dead? and they said; it is dead."}],"20":[{"catchword":"Then David arose from the ground, and washed, and anointed himself","tekst":"See Ruth 3.on ver.3."},{"catchword":"and changed his apparel, and went into the house of the LORD","tekst":"Meaning the Tent, which David had caused to be made for the Ark; see above chap.6.17."},{"catchword":"and worshipped: after that he came into his house, and required (bread), and they set bread","tekst":"as above ver 7. And in the following verse before him, and he did eat."}],"22":[{"catchword":"And he said; When the child yet lived, I fasted and wept: for I said","tekst":"viz. By my self; I thought Who knoweth, the LORD might be gracious to me, that the child might remain alive."}],"23":[{"catchword":"But now it is dead, wherefore should I now fast? Shall I be able yet to fetch him again","tekst":"viz, Into life"},{"catchword":"I shall indeed go to him","tekst":"viz. to the child, to the body into the grave, to the soul into heaven"},{"catchword":"but he shall not return","tekst":"into this life to me."}],"24":[{"catchword":"After that David comforted his wife bathseba, and went in unto her, and lay with her: And she bare a son whose name he called Salomon","tekst":"Heb. Schelomoh. This name David gave him according to Gods command. See 1 Chron.22.9. and the LORD loved him."}],"25":[{"catchword":"And sent forth","tekst":"viz. The LORD. Oth. he (viz. David) sent (him) under the hand of Nathan the Prophet, (i.e. to be taught and directed by Nathan in the fear of the Lord) who called his name Jedidjah"},{"catchword":"by the hand","tekst":"i.e. by the Ministery"},{"catchword":"of Nathan the Prophet, and called his name Jedid Jah","tekst":"i.e. beloved of the Lord. Heb. Idjide-Jah"},{"catchword":"for the LORDS sake","tekst":"i.e. because the Lord loved him, as is said ver.26. and because he should be a type and figure of the Lord Christ, who is the well beloved Son of God, the builder of his Church, and the right King of peace. See above chap 7.13, &c. 2 Chron.22.9, 10. Psa.45. Canticles, Math.3.17. Luke 1 32, 33. Heb 3:6. Isa 9:5, etc."}],"26":[{"catchword":"Now Joab warred against Rabba of the children of Ammon:","tekst":"Here is now prosecuted the History, which was begun above chap.11."},{"catchword":"and he took the Royal City","tekst":"Heb. the City of the Kingdom. Whereby may be understood that part of the City, where the Kings Court was, which perhaps lay by the water side, or was compassed about with waters. See the following verse."}],"27":[{"catchword":"Then Joab sent messengers to David, and said","tekst":"i.e. Sent him word"},{"catchword":"I have warred aginst Rabba, I have also taken the Water-city","tekst":"See on the former verse."}],"28":[{"catchword":"Now therefore gather the rest of the people together, and besiege the City, and take it; lest if I should take the City, my name be called out upon it","tekst":"or, named upon it: i.e. that thou mayest have the honour, and not I, who should have the honour, is they should say, Joab hath taken Rabba."}],"29":[{"catchword":"Then David gathered all that people","tekst":"i.e. The rest of the people, as was said in the former verse together, and marched to Rabba: and he warred against it, and took it."}],"30":[{"catchword":"And he took their Kings Crown from off his head, the weight","tekst":"Oth. price, value, worth,"},{"catchword":"whereof was a talent of gold","tekst":"See Exod.25.on ver.39. a civil talent amounted to threescore and two pound and an half, the pound consisting of twelve ounces, which maketh six and fourty pounds (each pound consisting of sixteen ounces, haver de pois) and fourteen ounces with precious stones, and it was (set) upon David&acirc;&euro;&trade;s head: he carried also a very great booty out of the City."}],"31":[{"catchword":"Now he brought forth the people","tekst":"Meaning as many of them as were needful to be exposed to exemplary punishment. Below chap.17.27. mention is made of one Sobi, whom some conceive to have been the King of also crowned King by David in Hanun his brothers stead"},{"catchword":"and he put them under saws, and under iron harrows, and under iron axes","tekst":"i.e. he called them to be sawed a sunder, to be brused in pieces (like corn) with iron-harrows, or threshing-catts tackt together, and to be cut in twain with axes, or hatchets"},{"catchword":"and made them pass thorow the brick-klin:","tekst":"i.e. to be burnt in brick-klins, or brick-ovens. Oth. thorough the furnace of Malchen, (that is, of Molech) unto which Idol they were wont to offer up their children, causing them to pass thorough the fire. See 2 King.16.3. & 23.10. Item, Levit.18.21. & 20.2, &c. David inflicted these hard and grievous punishments usual and common (as it is conceived in those Eastern Countrys) upon the Ammonites, because they had so basely misconstrued his friendly intent and act, and so disgracefully entreated his Ambassadors against the Law of Nations. See above chap. 10.2, 3, 4. And moreover were abominable Idolaters, Blasphemers, and enemies of God and his people, who without all question had tyrannically inflicted such kinds of deaths upon the people of God. Compare above chap.8 on ver.2. Amos 1.3. & Heb 11:37. and see of the tacked iron harrows, or threshing-carts, Deut.25.on ver.4."}]}}};

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const KJVKEY2AFK = {"Gen":"Gen","Exo":"Ex","Lev":"Lev","Num":"Num","Deu":"Deut","Jos":"Joz","Jdg":"Richt","Rth":"Ruth","1Sa":"1 Sam","2Sa":"2 Sam","1Ki":"1 Kon","2Ki":"2 Kon","1Ch":"1 Kron","2Ch":"2 Kron","Ezr":"Ezra","Neh":"Neh","Est":"Est","Job":"Job","Psa":"Ps","Pro":"Spr","Ecc":"Pred","Sng":"Hoogl","Isa":"Jes","Jer":"Jer","Lam":"Klaagl","Eze":"Ezech","Dan":"Dan","Hos":"Hos","Joe":"Joël","Amo":"Amos","Oba":"Obadja","Jon":"Jona","Mic":"Micha","Nah":"Nahum","Hab":"Hab","Zep":"Zef","Hag":"Hagg","Zec":"Zach","Mal":"Mal","Mat":"Matt","Mar":"Mark","Luk":"Luk","Jhn":"Joh","Act":"Hand","Rom":"Rom","1Co":"1 Kor","2Co":"2 Kor","Gal":"Gal","Eph":"Ef","Phl":"Fil","Col":"Kol","1Th":"1 Tess","2Th":"2 Tess","1Ti":"1 Tim","2Ti":"2 Tim","Tit":"Tit","Phm":"Filem","Heb":"Hebr","Jas":"Jak","1Pe":"1 Petr","2Pe":"2 Petr","1Jo":"1 Joh","2Jo":"2 Joh","3Jo":"3 Joh","Jde":"Judas","Rev":"Openb"};
const REF_RE = /\b(\d?[A-Za-z]{2,3})\s+(\d{1,3}):(\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek) => {
    const afk = KJVKEY2AFK[boek];
    return afk ? `<a class="refchip" data-ref="${heel.replace(boek, afk)}">${heel}</a>` : heel;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
