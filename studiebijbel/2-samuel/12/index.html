"3": "Maar de arme had helemaal niets, dan één enkel klein ooilam, dat hij gekocht had. Hij had het gevoed, zodat het groot werd bij hem en bij zijn kinderen samen; het at van zijn eigen stuk brood, en dronk uit zijn eigen beker, en sliep in zijn schoot, en het was voor hem als een dochter.", "4": "Toen er nu bij de rijke man een reiziger op bezoek kwam, wilde hij niet iets nemen van zijn eigen schapen of runderen om dat voor de reiziger die bij hem gekomen was te bereiden; maar hij nam het ooilam van de arme man, en bereidde dat voor de man die bij hem gekomen was.", "5": "Toen ontstak Davids woede erg tegen die man, en hij zei tegen Nathan: Zo waar de HEERE leeft, de man die dat gedaan heeft, is een kind des doods!", "6": "En dat ooilam zal hij viervoudig terugbetalen, omdat hij dit gedaan heeft, en omdat hij geen medelijden heeft gehad.", "7": "Toen zei Nathan tegen David: U bent die man! Zo zegt de HEERE, de God van Israël: Ik heb u tot koning gezalfd over Israël, en Ik heb u uit de hand van Saul gered;", "8": "en Ik heb u het huis van uw heer gegeven, en de vrouwen van uw heer in uw schoot; ja, Ik heb u het huis van Israël en Juda gegeven; en als dat weinig was, zou Ik u dit en dat er nog bij gegeven hebben.", "9": "Waarom hebt u dan het woord van de HEERE veracht, door te doen wat kwaad is in Zijn ogen? U hebt Uria, de Hethiet, met het zwaard verslagen, en zijn vrouw hebt u tot uw vrouw genomen; en hem hebt u met het zwaard van de kinderen van Ammon gedood.", "10": "Nu dan, het zwaard zal niet van uw huis wijken tot in eeuwigheid, omdat u Mij veracht hebt, en de vrouw van Uria, de Hethiet, genomen hebt, zodat zij uw vrouw is geworden.", "11": "Zo zegt de HEERE: Zie, Ik zal kwaad over u verwekken uit uw eigen huis, en Ik zal uw vrouwen nemen voor uw ogen, en zal ze aan uw naaste geven; die zal bij uw vrouwen liggen, voor de ogen van deze zon.", "12": "Want u hebt het in het verborgene gedaan, maar Ik zal deze zaak doen voor heel Israël, en voor de zon.", "13": "Toen zei David tegen Nathan: Ik heb gezondigd tegen de HEERE! En Nathan zei tegen David: De HEERE heeft ook uw zonde weggenomen, u zult niet sterven.", "14": "Toch, omdat u door deze daad de vijanden van de HEERE ernstig hebt doen lasteren, zal ook de zoon die u geboren is, zeker sterven.", "15": "Toen ging Nathan naar zijn huis. En de HEERE trof het kind, dat de vrouw van Uria David gebaard had, zodat het erg ziek werd.", "16": "En David zocht God voor dat jongetje; en David vastte een vasten, en ging naar binnen, en lag heel de nacht op de aarde.", "17": "Toen kwamen de oudsten van zijn huis naar hem toe, om hem te laten opstaan van de aarde; maar hij wilde niet, en at ook geen brood met hen.", "18": "En het gebeurde op de zevende dag, dat het kind stierf; en Davids knechten waren bang het hem te vertellen, dat het kind dood was, want zij zeiden: Zie, toen het kind nog leefde, spraken wij tegen hem, maar hij luisterde niet naar onze stem; hoe zullen wij dan tegen hem zeggen: Het kind is dood? Hij zou zichzelf iets kunnen aandoen.", "19": "Maar David zag dat zijn knechten fluisterden; zo begreep David dat het kind dood was. Toen zei David tegen zijn knechten: Is het kind dood? En zij zeiden: Het is dood.", "20": "Toen stond David op van de aarde, en waste zich, en zalfde zich, en trok andere kleren aan, en ging naar het huis van de HEERE, en aanbad Hem; daarna kwam hij in zijn eigen huis, en vroeg om brood; en zij zetten hem brood voor, en hij at.", "21": "Zo zeiden zijn knechten tegen hem: Wat is dit voor iets dat u gedaan hebt? Om het levende kind hebt u gevast en gehuild; maar nadat het kind gestorven is, bent u opgestaan en hebt u brood gegeten.", "22": "En hij zei: Toen het kind nog leefde, heb ik gevast en gehuild; want ik zei: Wie weet, de HEERE zou mij misschien genadig kunnen zijn, zodat het kind in leven bleef.", "23": "Maar nu is het dood, waarom zou ik nu vasten? Zal ik het nog kunnen terughalen? Ik zal wel naar hem toe gaan, maar hij zal niet naar mij terugkomen.", "24": "Daarna troostte David zijn vrouw Bathseba, en ging naar haar toe, en lag bij haar; en zij baarde een zoon, wiens naam zij Salomo noemde; en de HEERE had hem lief,", "25": "en zond een boodschap door de hand van de profeet Nathan, en noemde zijn naam Jedid-jah, omwille van de HEERE.", "26": "Joab nu streed tegen Rabba van de kinderen van Ammon; en hij nam de koninklijke stad in.", "27": "Toen zond Joab boden naar David, en zei: Ik heb gestreden tegen Rabba, en ik heb ook de waterstad ingenomen.", "28": "Verzamel u nu het overige van het volk, en beleger de stad, en neem haar in; anders zou het, als ík de stad zou innemen, naar mijn naam genoemd worden.", "29": "Toen verzamelde David al het volk, en trok naar Rabba; en hij streed tegen haar, en nam haar in.", "30": "En hij nam de kroon van hun koning van zijn hoofd af, waarvan het gewicht een talent goud was, met edelstenen; en die werd op Davids hoofd gezet; ook bracht hij een zeer grote roof van de stad naar buiten.", "31": "Het volk dat daarin was, voerde hij naar buiten, en zette hen aan het werk met zagen, en met ijzeren dorswagens, en met ijzeren bijlen, en liet hen door de steenoven gaan; en zo deed hij met alle steden van de kinderen van Ammon. Daarna keerde David, met heel het volk, terug naar Jeruzalem."}, "SV": {"1": "En de HEERE zond Nathan tot David. Als die tot hem inkwam, zeide hij tot hem: Er waren twee mannen in een stad, de een rijk en de ander arm.", "2": "De rijke had zeer veel schapen en runderen.", "3": "Maar de arme had gans niet dan een enig klein ooilam, dat hij gekocht had, en had het gevoed, dat het groot geworden was bij hem, en bij zijn kinderen tegelijk; het at van zijn bete, en dronk van zijn beker, en sliep in zijn schoot, en het was hem als een dochter.", "4": "Toen nu den rijken man een wandelaar overkwam, verschoonde hij te nemen van zijn schapen en van zijn runderen, om voor den reizenden man, die tot hem gekomen was, *wat* te bereiden; en hij nam des armen mans ooilam, en bereidde dat voor den man, die tot hem gekomen was.", "5": "Toen ontstak Davids toorn zeer tegen dien man; en hij zeide tot Nathan: *Zo* *waarachtig* *als* de HEERE leeft, de man, die dat gedaan heeft, is een kind des doods!", "6": "En dat ooilam zal hij viervoudig wedergeven, daarom dat hij deze zaak gedaan, en omdat hij niet verschoond heeft.", "7": "Toen zeide Nathan tot David: Gij zijt die man! Zo zegt de HEERE, de God Israëls: Ik heb u ten koning gezalfd over Israël, en Ik heb u uit Sauls hand gered;", "8": "En Ik heb u uws heren huis gegeven, daartoe uws heren vrouwen in uw schoot, ja, Ik heb u het huis van Israël en Juda gegeven; en indien het weinig is, Ik zou u alzulks en alzulks daartoe doen.", "9": "Waarom hebt gij *dan* het woord des HEEREN veracht, doende wat kwaad is in Zijn ogen? Gij hebt Uria, den Hethiet, met het zwaard verslagen, en zijn huisvrouw hebt gij u ter vrouwe genomen; en hem hebt gij met het zwaard van de kinderen Ammons doodgeslagen.", "10": "Nu dan, het zwaard zal van uw huis niet afwijken tot in eeuwigheid; daarom dat gij Mij veracht hebt, en de huisvrouw van Uria, den Hethiet, genomen hebt, dat zij u ter vrouwe zij.", "11": "Zo zegt de HEERE: Zie, Ik zal kwaad over u verwekken uit uw huis, en zal uw vrouwen nemen voor uw ogen, en zal haar aan uw naaste geven; die zal bij uw vrouwen liggen, voor de ogen dezer zon.", "12": "Want gij hebt het in het verborgen gedaan; maar Ik zal deze zaak doen voor gans Israël, en voor de zon.", "13": "Toen zeide David tot Nathan: Ik heb gezondigd tegen den HEERE! En Nathan zeide tot David: De HEERE heeft ook uw zonde weggenomen, gij zult niet sterven.", "14": "Nochtans, dewijl gij door deze zaak de vijanden des HEEREN grotelijks hebt doen lasteren, zal ook de zoon, die u geboren is, den dood sterven.", "15": "Toen ging Nathan naar zijn huis. En de HEERE sloeg het kind, dat de huisvrouw van Uria David gebaard had, dat het zeer krank werd.", "16": "En David zocht God voor dat jongsken; en David vastte een vasten, en ging in, en lag den nacht over op de aarde.", "17": "Toen maakten zich de oudsten van zijn huis op tot hem, om hem te doen opstaan van de aarde; maar hij wilde niet, en at geen brood met hen.", "18": "En het geschiedde op den zevenden dag, dat het kind stierf; en Davids knechten vreesden hem aan te zeggen, dat het kind dood was, want zij zeiden: Ziet, als het kind nog levend was, spraken wij tot hem, maar hij hoorde naar onze stem niet, hoe zullen wij dan tot hem zeggen: Het kind is dood? Want het mocht kwaad doen.", "19": "Maar David zag, dat zijn knechten mompelden; zo merkte David, dat het kind dood was. Dies zeide David tot zijn knechten: Is het kind dood? En zij zeiden: Het is dood.", "20": "Toen stond David op van de aarde, en wies en zalfde zich, en veranderde zijn kleding, en ging in het huis des HEEREN, en bad aan; daarna kwam hij in zijn huis, en eiste *brood*; en zij zetten hem brood voor, en hij at.", "21": "Zo zeiden zijn knechten tot hem: Wat is dit voor een ding, dat gij gedaan hebt? Om des levenden kinds wil hebt gij gevast en geweend; maar nadat het kind gestorven is, zijt gij opgestaan en hebt brood gegeten.", "22": "En hij zeide: Als het kind nog leefde, heb ik gevast en geweend; want ik zeide: Wie weet, de HEERE zou mij mogen genadig zijn , dat het kind levend bleve.", "23": "Maar nu is het dood, waarom zou ik nu vasten? Zal ik hem nog kunnen wederhalen? Ik zal wel tot hem gaan, maar hij zal tot mij niet wederkomen.", "24": "Daarna troostte David zijn huisvrouw Bathseba, en ging tot haar in, en lag bij haar; en zij baarde een zoon, wiens naam zij noemde Salomo; en de HEERE had hem lief,", "25": "En zond heen door de hand van den profeet Nathan, en noemde zijn naam Jedid-jah, om des HEEREN wil.", "26": "Joab nu krijgde tegen Rabba der kinderen Ammons; en hij nam de koninklijke stad in.", "27": "Toen zond Joab boden tot David, en zeide: Ik heb gekrijgd tegen Rabba, ook heb ik de waterstad ingenomen.", "28": "Zo verzamel gij nu het overige des volks, en beleger de stad, en neem ze in; opdat niet, zo ik de stad zou innemen, mijn naam over haar uitgeroepen worde.", "29": "Toen verzamelde David al dat volk, en toog naar Rabba; en hij krijgde tegen haar, en nam ze in.", "30": "En hij nam de kroon haars konings van zijn hoofd af, welker gewicht was een talent gouds, met edelgesteente, en zij werd op Davids hoofd *gezet*; ook voerde hij uit een zeer groten roof der stad.", "31": "Het volk nu, dat daarin was, voerde hij uit, en leide het onder zagen, en onder ijzeren dorswagens, en onder ijzeren bijlen, en deed hen door den ticheloven doorgaan; en alzo deed hij aan alle steden der kinderen Ammons. Daarna keerde David, en al het volk, weder naar Jeruzalem."}, "KJV": {"1": "And the LORD sent Nathan unto David. And he came unto him, and said unto him, There were two men in one city; the one rich, and the other poor.", "2": "The rich man had exceeding many flocks and herds:", "3": "But the poor man had nothing, save one little ewe lamb, which he had bought and nourished up: and it grew up together with him, and with his children; it did eat of his own meat, and drank of his own cup, and lay in his bosom, and was unto him as a daughter.", "4": "And there came a traveller unto the rich man, and he spared to take of his own flock and of his own herd, to dress for the wayfaring man that was come unto him; but took the poor man's lamb, and dressed it for the man that was come to him.", "5": "And David's anger was greatly kindled against the man; and he said to Nathan, As the LORD liveth, the man that hath done this thing shall surely die:", "6": "And he shall restore the lamb fourfold, because he did this thing, and because he had no pity.", "7": "And Nathan said to David, Thou art the man. Thus saith the LORD God of Israel, I anointed thee king over Israel, and I delivered thee out of the hand of Saul;", "8": "And I gave thee thy master's house, and thy master's wives into thy bosom, and gave thee the house of Israel and of Judah; and if that had been too little, I would moreover have given unto thee such and such things.", "9": "Wherefore hast thou despised the commandment of the LORD, to do evil in his sight? thou hast killed Uriah the Hittite with the sword, and hast taken his wife to be thy wife, and hast slain him with the sword of the children of Ammon.", "10": "Now therefore the sword shall never depart from thine house; because thou hast despised me, and hast taken the wife of Uriah the Hittite to be thy wife.", "11": "Thus saith the LORD, Behold, I will raise up evil against thee out of thine own house, and I will take thy wives before thine eyes, and give them unto thy neighbour, and he shall lie with thy wives in the sight of this sun.", "12": "For thou didst it secretly: but I will do this thing before all Israel, and before the sun.", "13": "And David said unto Nathan, I have sinned against the LORD. And Nathan said unto David, The LORD also hath put away thy sin; thou shalt not die.", "14": "Howbeit, because by this deed thou hast given ➔ great occasion to the enemies of the LORD to blaspheme, the child also that is born unto thee shall surely die.", "15": "And Nathan departed unto his house. And the LORD struck the child that Uriah's wife bare unto David, and it was very sick.", "16": "David therefore besought God for the child; and David fasted, and went in, and lay all night upon the earth.", "17": "And the elders of his house arose, and went to him, to raise him up from the earth: but he would not, neither did he eat bread with them.", "18": "And it came to pass on the seventh day, that the child died. And the servants of David feared to tell him that the child was dead: for they said, Behold, while the child was yet alive, we spake unto him, and he would not hearken unto our voice: how will he then ➔ vex himself, if we tell him that the child is dead?", "19": "But when David saw that his servants whispered, David perceived that the child was dead: therefore David said unto his servants, Is the child dead? And they said, He is dead.", "20": "Then David arose from the earth, and washed, and anointed himself, and changed his apparel, and came into the house of the LORD, and worshipped: then he came to his own house; and when he required, they set bread before him, and he did eat.", "21": "Then said his servants unto him, What thing is this that thou hast done? thou didst fast and weep for the child, while it was alive; but when the child was dead, thou didst rise and eat bread.", "22": "And he said, While the child was yet alive, I fasted and wept: for I said, Who can tell whether GOD will be gracious to me, that the child may live?", "23": "But now he is dead, wherefore should I fast? can I bring him back again? I shall go to him, but he shall not return to me.", "24": "And David comforted Bathsheba his wife, and went in unto her, and lay with her: and she bare a son, and he called his name Solomon: and the LORD loved him.", "25": "And he sent by the hand of Nathan the prophet; and he called his name Jedidiah, because of the LORD.", "26": "And Joab fought against Rabbah of the children of Ammon, and took the royal city.", "27": "And Joab sent messengers to David, and said, I have fought against Rabbah, and have taken the city of waters.", "28": "Now therefore gather ➔ the rest of the people together, and encamp against the city, and take it: lest I take the city, and it be called after my name.", "29": "And David gathered ➔ all the people together, and went to Rabbah, and fought against it, and took it.", "30": "And he took their king's crown from off his head, the weight whereof was a talent of gold with the precious stones: and it was set on David's head. And he brought forth the spoil of the city in great abundance.", "31": "And he brought forth the people that were therein, and put them under saws, and under harrows of iron, and under axes of iron, and made them pass through the brickkiln: and thus di [{"disp": "2 Sam 12:31", "href": "../../2-samuel/12/#v31", "ref": "2 Sam 12:31", "svLabel": null}, {"disp": "Hebr 11:37", "href": "../../hebreeen/11/#v37", "ref": "Hebr 11:37", "svLabel": null}], "kinderen": []}]}], "torrey": [{"topic": "Agriculture Or Husbandry", "href": "../../torrey/a/#t-agriculture-or-husbandry", "kinderen": [{"label": "Implements Of", "href": "../../torrey/a/?hl=2Sam.12.31#i286", "refs": [], "kinderen": [{"label": "The harrow", "href": "../../torrey/a/?hl=2Sam.12.31#i288", "refs": [{"disp": "2 Sam 12:31", "href": "../../2-samuel/12/#v31", "ref": "2 Sam 12:31", "svLabel": null}], "kinderen": []}]}]}, {"topic": "Ammonites, The", "href": "../../torrey/a/#t-ammonites-the", "kinderen": [{"label": "Of Rabbah reduced to hard bondage", "href": "../../torrey/a/?hl=2Sam.12.31#i534", "refs": [{"disp": "2 Sam 12:31", "href": "../../2-samuel/12/#v31", "ref": "2 Sam 12:31", "svLabel": null}], "kinderen": []}]}, {"topic": "Iron", "href": "../../torrey/i/#t-iron", "kinderen": [{"label": "Made Into", "href": "../../torrey/i/?hl=2Sam.12.31#i10077", "refs": [], "kinderen": [{"label": "Implements for husbandry", "href": "../../torrey/i/?hl=2Sam.12.31#i10081", "refs": [{"disp": "1 Sam 13:20", "href": "../../1-samuel/13/#v20", "ref": "1 Sam 13:20", "svLabel": null}, {"disp": "1 Sam 13:21", "href": "../../1-samuel/13/#v21", "ref": "1 Sam 13:21", "svLabel": null}, {"disp": "2 Sam 12:31", "href": "../../2-samuel/12/#v31", "ref": "2 Sam 12:31", "svLabel": null}], "kinderen": []}]}]}]}}, "extern": {"Ps 71:12": "O God, wees niet ver van mij; mijn God! haast U tot mijn hulp.", "Deut 27:23": "Vervloekt is hij die bij zijn schoonmoeder ligt! En heel het volk zal zeggen: Amen.", "Mal 3:6": "Want Ik, de HEERE, word niet veranderd; daarom zijn u, kinderen van Jakob, niet verteerd.", "Matt 14:30": "Maar toen hij de sterke wind zag, werd hij bevreesd, en toen hij begon te zinken, riep hij: Heere, red mij!", "Richt 11:29": "Toen kwam de Geest van de HEERE op Jeftha, zodat hij Gilead en Manasse doortrok; want hij trok door tot Mizpa in Gilead, en van Mizpa in Gilead trok hij door naar de kinderen van Ammon.", "Kol 1:6": "dat tot u gekomen is, zoals ook in de hele wereld, en het brengt vruchten voort, zoals ook onder u, vanaf de dag dat u het gehoord hebt en de genade van God in waarheid hebt leren kennen.", "Ps 57:3": "Ik zal roepen tot God, de Allerhoogste, tot God, Die het voor mij zal voltooien.", "Num 16:29": "Als dezen sterven zoals alle mensen sterven, en over hen een straf voltrokken wordt zoals over alle mensen, dan heeft de HEERE mij niet gezonden.", "Job 7:8-10": "Het oog van hem die mij nu ziet, zal mij niet zien; uw ogen zullen op mij zijn; maar ik zal niet meer zijn. Een wolk vergaat en vaart heen; zo zal hij die in het graf daalt, niet weer opkomen. Hij zal niet meer terugkeren naar zijn huis, en zijn plaats zal hem niet meer kennen.", "Jer 14:19-21": "Hebt U dan Juda helemaal verworpen? Heeft Uw ziel een walging aan Sion? Waarom hebt U ons geslagen, zodat er geen genezing voor ons is? Men wacht op vrede, maar daar is niets goeds, en op tijd van genezing, maar zie, daar is verschrikking. HEERE, wij kennen onze goddeloosheid, en de ongerechtigheid van onze vaderen, want wij hebben tegen U gezondigd. Versmaad ons niet, om Uw Naams wil; werp de troon van Uw heerlijkheid niet neer; denk aan ons, vernietig Uw verbond met ons niet.", "Ezech 3:16": "Het gebeurde nu aan het einde van zeven dagen, dat het woord van de HEERE tot mij kwam, en zei:", "Luk 1:41": "En het gebeurde, toen Elizabet de groet van Maria hoorde, dat het kindje opsprong in haar buik; en Elizabet werd vervuld met de Heilige Geest;", "2 Sam 11:13": "En David nodigde hem, zodat hij voor zijn aangezicht at en dronk, en hij maakte hem dronken. Daarna ging hij 's avonds naar buiten, om zich neer te leggen op zijn bed, bij de knechten van zijn heer, maar hij ging niet naar zijn huis.", "Ps 88:10-15": "Mijn oog treurt vanwege verdrukking; HEERE, ik roep tot U de hele dag; ik strek mijn handen naar U uit. Zult U een wonder doen aan de doden? Of zullen de overledenen opstaan, zullen zij U loven? Sela. Zal Uw goedertierenheid in het graf verteld worden, Uw trouw in het verderf?", "2 Sam 7:3-7": "En Nathan zei tegen de koning: Ga heen, doe alles wat in uw hart is, want de HEERE is met u. Maar het gebeurde in diezelfde nacht, dat het woord van de HEERE tot Nathan kwam, en Hij zei: Ga, en zeg tegen Mijn knecht, tegen David: Zo zegt de HEERE: Zou u Mij een huis bouwen om in te wonen?", "Ex 3:14": "En God zei tegen Mozes: IK ZAL ZIJN, DIE IK ZIJN ZAL! Ook zei Hij: Zo zult u tegen de kinderen van Israël zeggen: IK ZAL ZIJN heeft mij tot u gezonden!", "Job 10:2": "Ik zal tegen God zeggen: Verdoem mij niet; laat mij weten, waarom U met mij twist.", "Ps 23:6": "Zeker, het goede en de weldadigheid zullen mij volgen al de dagen van mijn leven; en ik zal in het huis van de HEERE blijven, tot in lengte van dagen.", "Job 9:34": "Laat Hij Zijn roede van op mij wegdoen, en laat Zijn verschrikking mij niet angstig maken;", "Klaagl 3:23": "Cheth. Zij zijn elke morgen nieuw, Uw trouw is groot.", "2 Sam 12:26-28": "Joab nu streed tegen Rabba van de kinderen van Ammon; en hij nam de koninklijke stad in. Toen zond Joab boden naar David, en zei: Ik heb gestreden tegen Rabba, en ik heb ook de waterstad ingenomen. Verzamel u nu het overige van het volk, en beleger de stad, en neem haar in; anders zou het, als ík de stad zou innemen, naar mijn naam genoemd worden.", "2 Kon 12:10": "Het gebeurde nu, toen zij zagen dat er veel geld in de kist was, dat de schrijver van de koning met de hogepriester opkwam, en zij bonden het samen en telden het geld dat in het huis van de HEERE gevonden werd.", "Jes 54:5": "Want uw Maker is uw Man, HEERE van de heerscharen is Zijn Naam; en de Heilige van Israël is uw Verlosser; Hij zal de God van de hele aardbodem genoemd worden.", "Ex 33:11": "En de HEERE sprak tot Mozes van aangezicht tot aangezicht, zoals een man met zijn vriend spreekt; daarna keerde hij terug naar het kamp; maar zijn dienaar Jozua, de zoon van Nun, de jongeman, week niet uit het midden van de tent.", "Jak 4:8": "Kom dicht bij God, en Hij zal dicht bij u komen. Reinig de handen, zondaars, en zuiver de harten, dubbelhartigen!", "Jer 36:5": "En Jeremia gebood Baruch: Ik word tegengehouden, ik zal niet in het huis van de HEERE kunnen gaan.", "Gen 26:11": "En Abimelech gebood het hele volk: Wie deze man of zijn vrouw aanraakt, zal zeker gedood worden!", "2 Sam 12:14-19": "Toch, omdat u door deze daad de vijanden van de HEERE ernstig hebt doen lasteren, zal ook de zoon die u geboren is, zeker sterven. Toen ging Nathan naar zijn huis. En de HEERE trof het kind, dat de vrouw van Uria David gebaard had, zodat het erg ziek werd. En David zocht God voor dat jongetje; en David vastte een vasten, en ging naar binnen, en lag heel de nacht op de aarde.", "Openb 13:6": "En het opende zijn mond tot lastering tegen God, om Zijn Naam te lasteren, en Zijn tabernakel, en hen die in de hemel wonen.", "Ps 123:3": "Wees ons genadig, HEERE! Wees ons genadig, want wij zijn de verachting veel te zat.", "Ps 21:5": "Het leven heeft hij van U begeerd. U hebt het hem gegeven; lengte van dagen, eeuwig en altoos.", "Matt 19:16": "En zie, er kwam iemand naar Hem toe, en zei tegen Hem: Goede Meester! Wat goeds zal ik doen, opdat ik het eeuwige leven heb?", "Jes 43:1-4": "Maar nu, zo zegt de HEERE, uw Schepper, o Jakob! en uw Formeerder, o Israël! Vrees niet, want Ik heb u verlost; Ik heb u bij uw naam geroepen, u bent van Mij. Wanneer u door het water zult gaan, Ik zal bij u zijn, en door de rivieren, zij zullen u niet overstromen; wanneer u door het vuur zult gaan, zult u niet verbranden, en de vlam zal u niet aansteken. Want Ik ben de HEERE, uw God, de Heilige van Israël, uw Heiland; Ik heb Egypte, Morenland en Seba gegeven tot uw losgeld in uw plaats.", "Ps 106:7": "Onze vaders in Egypte hebben niet gelet op Uw wonderen; zij zijn de veelheid van Uw goedertierenheid niet gedachtig geweest; maar zij waren opstandig aan de zee, bij de Schelfzee.", "Rom 11:28": "Zo zijn zij wel vijanden aangaande het Evangelie, om uwentwil, maar aangaande de verkiezing zijn zij geliefden, om de vaderen wil;", "Jes 57:1": "De rechtvaardige komt om, en er is niemand die het ter harte neemt; en de goede mensen worden weggenomen, zonder dat iemand erop let dat de rechtvaardige weggenomen wordt vóór het kwaad komt.", "Ps 78:62": "En Hij leverde Zijn volk over aan het zwaard, en werd verbolgen tegen Zijn erfenis.", "2 Sam 19:1-6": "En Joab werd verteld: Zie, de koning huilt en bedrijft rouw over Absalom. Toen werd de overwinning op diezelfde dag voor het hele volk tot rouw; want het volk had diezelfde dag horen zeggen: Het smart de koning over zijn zoon. En het volk kwam diezelfde dag stiekem de stad binnen, zoals het volk zich wegsteelt, dat beschaamd is wanneer zij in de strijd gevlucht zijn.", "Deut 32:15": "Toen Jeschurun vet werd, sloeg hij achteruit (u bent vet geworden, u bent dik geworden, ja, met vet overdekt geworden!); en hij liet God varen, Die hem gemaakt heeft, en versmaadde de Rotssteen van zijn heil.", "Hos 2:18": "En Ik zal u aan Mij verloven in eeuwigheid; ja, Ik zal u aan Mij verloven in gerechtigheid en in recht, en in goedertierenheid en in barmhartigheden.", "Ex 22:16": "Wanneer iemand een maagd verleidt die nog niet ondertrouwd is, en hij slaapt met haar, dan moet hij zonder uitstel een bruidsprijs voor haar betalen, zodat zij zijn vrouw wordt.", "Ps 60:3-5": "O God! U had ons verstoten, U had ons uiteengescheurd, U bent toornig geweest; keer terug tot ons. U hebt het land geschud, U hebt het gespleten; genees zijn breuken, want het wankelt. U hebt Uw volk een harde zaak laten zien; U hebt ons te drinken gegeven zwijmelwijn.", "Job 16:11": "God heeft mij overgegeven aan de verkeerde, en heeft mij overgeleverd in de handen van de goddelozen.", "Ps 122:9": "Om het huis van de HEERE, onze God, zal ik het goede voor u zoeken.", "Deut 14:2": "Want u bent een heilig volk voor de HEERE, uw God; en de HEERE heeft u uitgekozen om Hem tot een volk van het eigendom te zijn, uit alle volken die op de aardbodem zijn.", "2 Sam 12:1-9": "En de HEERE zond Nathan naar David. Toen hij bij hem kwam, zei hij tegen hem: Er waren twee mannen in één stad, de één rijk en de ander arm. De rijke had heel veel schapen en runderen. Maar de arme had helemaal niets, dan één enkel klein ooilam, dat hij gekocht had. Hij had het gevoed, zodat het groot werd bij hem en bij zijn kinderen samen; het at van zijn eigen stuk brood, en dronk uit zijn eigen beker, en sliep in zijn schoot, en het was voor hem als een dochter.", "Ps 16:11": "U zult mij het pad van het leven bekendmaken; overvloed van vreugde is bij Uw aangezicht; liefelijkheden zijn in Uw rechterhand, eeuwig.", "1 Kor 11:32": "Maar als wij geoordeeld worden, worden wij door de Heere getuchtigd, opdat wij niet met de wereld veroordeeld zouden worden.", "Ps 44:5": "U Zelf bent mijn Koning, o God! Gebied de verlossingen van Jakob.", "Ps 74:19": "Geef het leven van Uw tortelduif niet over aan het wilde gedierte; vergeet het leven van Uw ellendigen niet voor eeuwig.", "2 Kor 6:4-10": "Maar wij maken onszelf in alles aangenaam als dienaars van God, in veel verdraagzaamheid, in verdrukkingen, in noden, in benauwdheden, in slagen, in gevangenissen, in opschudding, in arbeid, in waken, in vasten, in reinheid, in kennis, in geduld, in vriendelijkheid, in de Heilige Geest, in ongeveinsde liefde,", "Jer 20:1": "Toen Pashur, de zoon van Immer, de priester (deze was aangesteld als voorganger in het huis van de HEERE), Jeremia hoorde deze woorden profeteren,", "Rom 14:7": "Want niemand van ons leeft voor zichzelf, en niemand sterft voor zichzelf.", "Ezech 8:12": "Toen zei Hij tegen mij: Hebt u gezien, mensenkind, wat de oudsten van het huis van Israël doen in de duisternis, ieder in zijn kamer vol afbeeldingen? Want zij zeggen: De HEERE ziet ons niet, de HEERE heeft het land verlaten.", "Luk 3:2": "onder de hogepriesters Annas en Kajafas, kwam het woord van God tot Johannes, de zoon van Zacharias, in de woestijn.", "Spr 9:13-18": "Een dwaze vrouw is druk en luidruchtig, zij is de eenvoud zelf, en weet helemaal niets. En zij zit aan de deur van haar huis, op een stoel, op de hoge plaatsen van de stad; om te roepen naar hen die op de weg voorbijgaan, die hun paden recht maken:", "Deut 32:14": "Boter van koeien, en melk van klein vee, met het vet van de lammeren en van de rammen, die in Basan weiden, en van de bokken, met het vette van de nieren van tarwe; en het druivenbloed, reine wijn, hebt u gedronken.", "Ps 105:6": "U, nakomelingen van Abraham, Zijn knecht, u, kinderen van Jakob, Zijn uitverkorene!", "Ps 35:25": "Laat hen niet zeggen in hun hart: Haha, onze ziel! Laat hen niet zeggen: Wij hebben hem verslonden!", "2 Kon 12:9": "Maar de priester Jojada nam een kist, en boorde een gat in het deksel ervan, en zette die bij het altaar aan de rechterkant, waar iemand het huis van de HEERE binnenkwam; en de priesters die de drempel bewaakten, staken daarin al het geld dat naar het huis van de HEERE gebracht werd.", "Lev 20:10": "Een man ook, die met de vrouw van een ander overspel doet, omdat hij overspel doet met de vrouw van zijn naaste, zal zeker gedood worden, de overspeler en de overspeelster.", "Ex 20:22": "Toen zei de HEERE tegen Mozes: Zo zult u tegen de kinderen van Israël zeggen: U hebt gezien dat Ik met u vanuit de hemel gesproken heb.", "Ezech 36:20-23": "Toen zij nu tot de heidenen kwamen waarheen zij getrokken waren, ontheiligden zij Mijn heilige Naam, omdat men van hen zei: Dezen zijn het volk van de HEERE, en zijn uit Zijn land uitgegaan. Maar Ik verschoonde hen om Mijn heilige Naam, die het huis van Israël ontheiligde onder de heidenen waarheen zij gekomen waren. Daarom, zeg tot het huis van Israël: Zo zegt de Heere HEERE: Ik doe het niet om u, huis van Israël! Maar om Mijn heilige Naam, die u ontheiligd hebt onder de heidenen waarheen u gekomen bent.", "2 Kor 9:7": "Ieder doe zoals hij in zijn hart voorneemt; niet uit droefheid of uit dwang; want God heeft een blijmoedige gever lief.", "2 Sam 18:5": "En de koning gaf bevel aan Joab, en Abisai, en Ithai, en zei: Ga zachtzinnig om met de jongeman, met Absalom. En al het volk hoorde het, toen de koning aan alle leiders bevel gaf over de zaak van Absalom.", "Ps 36:10": "Want bij U is de fontein van het leven; in Uw licht zien wij het licht.", "Job 7:20": "Heb ik gezondigd, wat zal ik U doen, o Mensenhoeder? Waarom hebt U mij tot een mikpunt voor Uzelf gesteld, dat ik mijzelf tot een last ben?", "2 Sam 18:13": "Of had ik uit valsheid tegen mijn eigen leven gehandeld? Want geen ding blijft voor de koning verborgen; ook u zelf zou u er dan tegenover mij van afzijdig gehouden hebben.", "Gen 9:6": "Wie het bloed van een mens vergiet, diens bloed zal door de mens vergoten worden; want God heeft de mens naar Zijn beeld gemaakt.", "Ps 116:4": "Maar ik riep de Naam van de HEERE aan: Och HEERE, bevrijd mijn ziel.", "1 Kon 21:19": "En u zult tot hem spreken en zeggen: Zo zegt de HEERE: Hebt u doodgeslagen, en ook een erfelijke bezitting ingenomen? Daartoe zult u tot hem spreken en zeggen: Zo zegt de HEERE: Op de plaats waar de honden het bloed van Naboth gelekt hebben, zullen de honden ook uw bloed lekken, ja, het uwe!", "Hos 9:10": "Ik vond Israël als druiven in de woestijn, Ik zag uw vaders als de eerste vrucht aan de vijgenboom in haar begintijd; maar zij gingen naar Baäl-peor, en zonderden zich af tot die schande, en werden helemaal verfoeilijk, net als datgene wat zij liefhadden.", "1 Kron 26:27": "Van de oorlogen en van de buit hadden zij het geheiligd, om het huis van de HEERE te onderhouden.", "1 Sam 15:33": "Maar Samuël zei: Zoals uw zwaard vrouwen van hun kinderen beroofd heeft, zo zal uw moeder van haar kinderen beroofd worden onder de vrouwen. Toen hieuw Samuël Agag in stukken, voor het aangezicht van de HEERE te Gilgal.", "Ezech 1:3": "Kwam het woord van de HEERE uitdrukkelijk tot Ezechiël, de zoon van Buzi, de priester, in het land van de Chaldeeën, bij de rivier Chebar; en de hand van de HEERE was daar op hem.", "Lev 24:17": "En als iemand enig mens doodslaat, zal hij zeker gedood worden.", "Num 22:38": "Toen zei Bileam tegen Balak: Zie, ik ben tot u gekomen; kan ik nu wel iets zeggen? Het woord dat God in mijn mond leggen zal, dat zal ik spreken.", "Jes 37:23": "Wie hebt u gehoond en gelasterd, en tegen wie hebt u de stem verheven en uw ogen omhoog opgeheven? Tegen de Heilige van Israël!", "2 Sam 11:15-27": "En hij schreef in die brief: Stel Uria vooraan tegenover de sterkste strijd, en trek u van achter hem terug, opdat hij geslagen wordt en sterft. Zo gebeurde het, toen Joab op de stad had gelet, dat hij Uria stelde op de plaats waarvan hij wist dat daar strijdbare mannen waren. Toen de mannen van de stad uittrokken en met Joab streden, vielen er van het volk, van Davids knechten, en Uria, de Hethiet, stierf ook.", "Rom 5:3-5": "En niet alleen dit, maar wij roemen ook in de verdrukkingen, wetende dat de verdrukking lijdzaamheid werkt; En de lijdzaamheid werkt bevinding, en de bevinding werkt hoop; En de hoop beschaamt niet, omdat de liefde van God in onze harten uitgestort is door de Heilige Geest, Die ons gegeven is.", "Ex 21:14": "Maar als iemand tegen zijn naaste moedwillig handelt om hem met list te doden, zult u die man van bij Mijn altaar weghalen, zodat hij moet sterven.", "Ps 114:2": "Werd Juda tot Zijn heiligdom, Israël Zijn volkomen heerschappij.", "1 Kron 22:11": "Nu, mijn zoon, de HEERE zal met u zijn, en u zult voorspoedig zijn, en u zult het huis van de HEERE, van uw God, bouwen, zoals Hij van u gesproken heeft.", "Ps 70:3": "Laat hen beschaamd en schaamrood worden, die mijn ziel zoeken; laat hen achterwaarts gedreven en te schande worden, die lust hebben aan mijn kwaad.", "2 Kon 15:5": "En de HEERE plaagde de koning, zodat hij melaats werd tot de dag van zijn dood; en hij woonde in een afgezonderd huis, terwijl Jotham, de zoon van de koning, over het huis ging en het volk van het land rechtsprak.", "Ps 80:15": "O God van de heerscharen! Keer toch terug; kijk uit de hemel, en zie, en zoek dan om te helpen deze wijnstok,", "1 Kon 8:10": "En het gebeurde, toen de priesters uit het heilige naar buiten gingen, dat een wolk het huis van de HEERE vervulde.", "Ps 17:13": "Sta op, HEERE, kom hem voor, werp hem neer; bevrijd mijn ziel met Uw zwaard van de goddeloze;", "2 Sam 16:22": "Zo spanden zij voor Absalom een tent op op het dak; en Absalom ging naar de bijvrouwen van zijn vader, voor de ogen van heel Israël.", "Dan 5:20": "Maar toen zijn hart zich verhief, en zijn geest verstijfd werd tot hoogmoed, werd hij van de troon van zijn koninkrijk afgestoten, en men nam de eer van hem weg.", "Job 4:17-21": "Zou een mens rechtvaardiger zijn dan God? Zou een man reiner zijn dan zijn Maker? Zie, op Zijn knechten zou Hij niet vertrouwen; ook Zijn engelen heeft Hij van dwaasheid beschuldigd. Hoeveel te meer dan hen die in lemen huizen wonen, waarvan de grondslag in het stof is? Zij worden verbrijzeld voor de mot.", "Hand 7:56": "En hij zei: Zie, ik zie de hemelen geopend, en de Zoon des mensen, staande aan de rechterhand van God.", "Ezech 32:31": "Farao zal hen zien, en zich troosten over zijn hele menigte; de verslagenen van het zwaard van Farao en zijn hele leger, spreekt de Heere HEERE.", "Num 16:9": "Is het u te weinig, dat de God van Israël u van de vergadering van Israël heeft afgescheiden, om u tot Zich te laten naderen; om de dienst van de tabernakel van de HEERE te verrichten, en te staan voor het aangezicht van de vergadering, om hen te dienen?", "Ezech 2:5": "En zij, hetzij dat zij het horen zullen, of hetzij dat zij het laten zullen (want zij zijn een opstandig huis), zo zullen zij weten, dat er een profeet in hun midden geweest is.", "Luk 23:46": "En Jezus riep met luide stem en zei: Vader, in Uw handen beveel Ik Mijn geest. En toen Hij dat gezegd had, gaf Hij de geest.", "Hos 11:9": "Ik zal de gloed van Mijn toorn niet uitvoeren; Ik zal niet terugkeren om Efraïm te verderven; want Ik ben God en geen mens, de Heilige in uw midden, en Ik zal niet in de stad komen.", "Hand 13:38": "Zo zij het u dan bekend, mannen broeders, dat door Hem u vergeving van de zonden verkondigd wordt;", "Hebr 11:13-16": "Deze allen zijn in het geloof gestorven, zonder de beloften ontvangen te hebben, maar zij hebben ze van verre gezien, en geloofd, en begroet, en beleden dat zij gasten en vreemdelingen op de aarde waren. Want wie zulke dingen zeggen, laten daarmee duidelijk zien dat zij een vaderland zoeken. En als zij aan dat vaderland gedacht hadden waar zij uit weggegaan waren, zouden zij de tijd gehad hebben om terug te keren;", "1 Kron 20:1-3": "Het gebeurde nu in de tijd dat het jaar weer omging, in de tijd dat de koningen ten strijde uittrokken, dat Joab het leger aanvoerde en het land van de kinderen Ammons verwoestte; en hij kwam en belegerde Rabba. Maar David bleef in Jeruzalem. En Joab sloeg Rabba en verwoestte het. En David nam de kroon van hun koning van zijn hoofd, en hij bevond dat die in gewicht een talent goud woog, en er zat edelgesteente aan; en die werd op Davids hoofd gezet, en hij bracht zeer veel van het roof uit de stad naar buiten. Hij bracht ook al het volk dat daarin was naar buiten, en hij zaagde hen met de zaag, en met ijzeren dorswagens, en met bijlen; en zo deed David met al de steden van de kinderen Ammons. Toen keerde David met al het volk terug naar Jeruzalem.", "Neh 9:25": "En zij hebben vaste steden en een vet land ingenomen, en erfelijk bezeten, huizen, vol van allerlei goed, uitgehouwen waterputten, wijngaarden, olijfgaarden en fruitbomen, in overvloed; en zij hebben gegeten, en zijn verzadigd en vet geworden, en hebben in weelde geleefd, door Uw grote goedheid.", "Jes 66:13": "Zoals iemand die zijn moeder troost, zo zal Ik u troosten; ja, u zult in Jeruzalem getroost worden.", "1 Kon 17:1": "En Elia, de Thisbiet, van de inwoners van Gilead, zei tegen Achab: Zo waarachtig als de HEERE, de God van Israël, leeft, voor Wiens aangezicht ik sta, indien deze jaren dauw of regen zijn zal, tenzij dan naar mijn woord!", "Ex 19:9": "En de HEERE zei tot Mozes: Zie, Ik zal tot u komen in een dikke wolk, opdat het volk het hoort als Ik met u spreek, en dat zij ook eeuwig aan u geloven. Want Mozes had de HEERE de woorden van het volk verkondigd.", "2 Sam 23:2": "De Geest van de HEERE heeft door mij gesproken, en Zijn woord is op mijn tong geweest.", "Rom 1:21": "Omdat zij, hoewel zij God kenden, Hem niet als God verheerlijkt of gedankt hebben; maar in hun overleggingen zijn zij verijdeld geworden, en hun onverstandig hart is verduisterd geworden;", "Matt 25:46": "En dezen zullen weggaan in de eeuwige pijn; maar de rechtvaardigen in het eeuwige leven.", "Hebr 11:16": "maar nu verlangen zij naar een beter vaderland, dat is, naar het hemelse. Daarom schaamt God Zich niet voor hen om hun God genoemd te worden; want Hij had voor hen een stad klaargemaakt.", "1 Kon 21:18-24": "Maak u op, ga naar beneden, Achab, de koning van Israël, tegemoet, die in Samaria is; zie, hij is in de wijngaard van Naboth, waarheen hij afgegaan is om die in bezit te nemen. En u zult tot hem spreken en zeggen: Zo zegt de HEERE: Hebt u doodgeslagen, en ook een erfelijke bezitting ingenomen? Daartoe zult u tot hem spreken en zeggen: Zo zegt de HEERE: Op de plaats waar de honden het bloed van Naboth gelekt hebben, zullen de honden ook uw bloed lekken, ja, het uwe! En Achab zei tegen Elia: Hebt u mij gevonden, o mijn vijand? En hij zei: Ik heb u gevonden, omdat u uzelf verkocht hebt om te doen wat kwaad is in de ogen van de HEERE.", "2 Sam 12:18-23": "En het gebeurde op de zevende dag, dat het kind stierf; en Davids knechten waren bang het hem te vertellen, dat het kind dood was, want zij zeiden: Zie, toen het kind nog leefde, spraken wij tegen hem, maar hij luisterde niet naar onze stem; hoe zullen wij dan tegen hem zeggen: Het kind is dood? Hij zou zichzelf iets kunnen aandoen. Maar David zag dat zijn knechten fluisterden; zo begreep David dat het kind dood was. Toen zei David tegen zijn knechten: Is het kind dood? En zij zeiden: Het is dood. Toen stond David op van de aarde, en waste zich, en zalfde zich, en trok andere kleren aan, en ging naar het huis van de HEERE, en aanbad Hem; daarna kwam hij in zijn eigen huis, en vroeg om brood; en zij zetten hem brood voor, en hij at.", "2 Kron 24:20": "En de Geest van God bekleedde Zacharia, de zoon van Jojada, de priester, die boven het volk stond, en hij zei tegen hen: Zo zegt God: Waarom overtreedt u de geboden van de HEERE? Daarom zult u niet voorspoedig zijn; omdat u de HEERE verlaten hebt, zo zal Hij u verlaten.", "Ezech 3:17": "Mensenkind! Ik heb u tot een wachter gesteld over het huis Israëls; zo zult u het woord uit Mijn mond horen, en hen namens Mij waarschuwen.", "Est 4:16": "Ga, verzamel alle Joden die te Susan gevonden worden, en vast voor mij, en eet of drink niet, drie dagen lang, nacht noch dag; ik en mijn jonge dochters zullen ook zo vasten, en zo zal ik tot de koning ingaan, wat niet naar de wet is. Wanneer ik dan omkom, dan kom ik om.", "Ps 61:3": "Van het einde van het land roep ik tot U als mijn hart overstelpt is; leid mij op een rotssteen, die mij te hoog zou zijn.", "Ps 74:5": "Ieder werd erkend als iemand die de bijlen omhoog hanteert in het dichte geboomte.", "Ezech 18:23": "Zou Ik enigszins lust hebben aan de dood van de goddeloze, spreekt de Heere HEERE; is het niet zo, dat als hij zich bekeert van zijn wegen, hij zal leven?", "1 Sam 19:10-15": "Saul nu probeerde David met de speer aan de wand te spietsen, doch hij ontweek Saul, die met de speer in de wand sloeg. Toen vluchtte David, en ontkwam diezelfde nacht. Maar Saul zond boden naar Davids huis, om hem te bewaken, en om hem 's morgens te doden. Dit maakte Michal, zijn vrouw, aan David bekend, en zei: Als u vannacht uw leven niet redt, zult u morgen gedood worden. En Michal liet David door een venster naar beneden, en hij ging heen, en vluchtte, en ontkwam.", "Lev 10:20": "Toen Mozes dit hoorde, was dat goed in zijn ogen.", "Jer 43:9": "Neem grote stenen in uw hand, en verberg ze in de klei in de ticheloven, die bij de deur van Farao's huis te Tachpanhes is, voor de ogen van de Joodse mannen;", "Jes 54:6": "Want de HEERE heeft u geroepen, als een verlaten vrouw en bedroefde van geest; toch bent u de huisvrouw van de jeugd, hoewel u versmaad bent geweest, zegt uw God.", "1 Kon 13:1": "En zie, een man van God kwam uit Juda, door het woord van de HEERE, naar Beth-el; en Jerobeam stond bij het altaar om te roken.", "2 Kon 19:22": "Wie hebt u gehoond en gelasterd? En tegen wie hebt u de stem verheven, en uw ogen omhoog opgeheven? Tegen de Heilige van Israël!", "Ex 2:24": "En God hoorde hun gekerm, en God dacht aan Zijn verbond met Abraham, met Izak, en met Jakob.", "Spr 29:3": "Een man die de wijsheid liefheeft, verblijdt zijn vader; maar wie omgaat met hoeren, brengt zijn bezit door.", "Ezra 5:1": "De profeten Haggai, de profeet, en Zacharia, de zoon van Iddo, profeteerden tot de Joden die in Juda en te Jeruzalem waren; in de naam van de God van Israël profeteerden zij tot hen.", "Job 9:17": "Want Hij vermorzelt mij door een onweer, en vermenigvuldigt mijn wonden zonder oorzaak.", "Ps 5:9": "HEERE! Leid mij in Uw gerechtigheid, om mijn verspieders wil; richt Uw weg voor mijn aangezicht.", "Mark 7:21-23": "Want van binnenuit, uit het hart van de mensen, komen voort kwade gedachten, overspel, hoererijen, moorden, diefstal, hebzucht, slechtheid, bedrog, losbandigheid, een boos oog, lastering, hoogmoed, dwaasheid. Al deze boze dingen komen van binnenuit voort, en verontreinigen de mens.", "Lev 21:9": "Als nu de dochter van een priester zal beginnen te hoereren, ontheiligt zij haar vader; met vuur zal zij verbrand worden.", "Deut 6:11": "En huizen, vol van alle goeds, die u niet gevuld hebt, en uitgehouwen putten, die u niet uitgehouwen hebt, wijngaarden en olijfgaarden, die u niet geplant hebt, en u gegeten hebt en verzadigd bent;", "Spr 25:12": "Een wijze bestraffer bij een luisterend oor, is een gouden oorsieraad, en een halssieraad van het fijnste goud.", "Zach 8:9": "Zo zegt de HEERE van de heerscharen: Laat uw handen sterk zijn, u die in deze dagen deze woorden gehoord hebt uit de mond van de profeten, die er geweest zijn op de dag dat de grond van het huis van de HEERE van de heerscharen gelegd is, zodat de tempel gebouwd zou worden.", "Jer 51:19": "Jakobs deel is niet gelijk aan hen; want Hij is de Formeerder van alles, en Israël is de stam van Zijn erfenis; HEERE van de heerscharen is Zijn Naam.", "Job 10:9": "Denk er toch aan, dat U mij als leem gevormd hebt, en mij tot stof zult doen terugkeren.", "1 Kron 22:14": "Zie, ik heb in mijn verdrukking voor het huis van de HEERE honderdduizend talenten van het goud bereid, en duizend maal duizend talenten van het zilver; en van het koper en van het ijzer is er geen gewicht, want het is er in overvloed; ik heb ook hout en stenen bereid; voegt u er nog meer aan toe.", "Matt 19:9": "Maar Ik zeg u, dat wie zijn vrouw verlaat, anders dan om hoererij, en een ander trouwt, die doet overspel, en wie haar trouwt die verlaten is, doet ook overspel.", "Deut 7:8": "Maar omdat de HEERE u liefhad, en omdat Hij de eed hield die Hij uw vaderen gezworen had, heeft de HEERE u met een sterke hand uitgevoerd, en u verlost uit het slavenhuis, uit de hand van de farao, koning van Egypte.", "Fil 1:23": "Want ik word door deze twee gedrongen: ik heb het verlangen om heen te gaan en met Christus te zijn, want dat is verreweg het beste;", "Lev 25:38": "Ik ben de HEERE, uw God, Die u uit het land Egypte geleid heb, om u het land Kanaän te geven, opdat Ik u tot een God ben.", "Gen 46:3": "En Hij zei: Ik ben die God, de God van uw vader; wees niet bang om af te trekken naar Egypte; want Ik zal u daar tot een groot volk maken.", "Richt 11:32": "Zo trok Jeftha door naar de kinderen van Ammon, om tegen hen te strijden; en de HEERE gaf hen in zijn hand.", "Lev 22:32": "En u zult Mijn heilige Naam niet ontheiligen, opdat Ik in het midden van de kinderen van Israël geheiligd word; Ik ben de HEERE, Die u heiligt!", "Ps 13:2-5": "Hoe lang, HEERE, zult U mij steeds vergeten? Hoe lang zult U Uw aangezicht voor mij verbergen? Hoe lang zal ik plannen maken in mijn ziel, verdriet in mijn hart bij dag? Hoe lang zal mijn vijand boven mij verheven zijn? Kijk naar mij, verhoor mij, HEERE, mijn God; verlicht mijn ogen, zodat ik niet in de dood ontslaap;", "1 Kron 22:12": "Laat de HEERE u alleen wijsheid en verstand geven, en u bevel geven over Israël, en dat om de wet van de HEERE, van uw God, te onderhouden.", "2 Sam 13:31": "Toen stond de koning op, en scheurde zijn kleren, en ging op de grond liggen; en al zijn knechten stonden erbij met gescheurde kleren.", "Richt 9:8-15": "De bomen gingen eens op weg om een koning over zich te zalven, en zij zeiden tegen de olijfboom: Wees u koning over ons. Maar de olijfboom zei tegen hen: Zou ik mijn vettigheid opgeven, waarmee men God en de mensen eert door mij? En zou ik heengaan om te zweven boven de bomen? Toen zeiden de bomen tegen de vijgenboom: Kom u, wees koning over ons.", "2 Kron 32:25": "Maar Jehizkia gaf geen vergelding naar de weldaad die hem was gebeurd, omdat zijn hart hoogmoedig werd; daarom kwam er over hem, en over Juda en Jeruzalem, een grote toorn.", "Joz 6:24": "De stad nu verbrandden zij met vuur, en alles wat daarin was; alleen het zilver en goud, alsook de koperen en ijzeren voorwerpen, gaven zij bij de schat van het huis van de HEERE.", "Ex 25:9": "Naar alles wat Ik u tot een voorbeeld van deze tabernakel, en een voorbeeld van al zijn gereedschap wijzen zal, precies zo zult u dat maken.", "Jes 37:10": "Zo moet u spreken tegen Hizkia, de koning van Juda: Laat uw God u niet bedriegen, op Wie u vertrouwt, door te zeggen: Jeruzalem zal niet in de hand van de koning van Assyrië gegeven worden.", "Jak 1:14": "Maar ieder wordt verzocht, als hij door zijn eigen begeerte afgetrokken en verlokt wordt.", "Gen 32:11": "Red mij toch uit de hand van mijn broer, uit de hand van Ezau; want ik vrees hem, dat hij misschien komt en mij verslaat, de moeder met de kinderen!", "Matt 10:25": "Het is de discipel genoeg dat hij wordt als zijn meester, en de dienstknecht als zijn heer. Als zij de heer des huizes Beëlzebul genoemd hebben, hoeveel te meer dan Zijn huisgenoten!", "Jer 27:1": "In het begin van het koningschap van Jojakim, zoon van Josia, koning van Juda, kwam dit woord van de HEERE tot Jeremia:", "Hos 11:4": "Ik trok ze met mensenzelen, met touwen van liefde, en was voor hen als degenen die het juk van op hun kaken oplichten, en Ik reikte hem voedsel toe.", "1 Kron 28:11": "En David gaf zijn zoon Salomo een bereiding van het voorhuis, met zijn gebouwen, en zijn schatkamers, en zijn bovenzalen, en zijn binnenkamers, en van het huis van het verzoendeksel;", "2 Kon 19:16": "HEERE, neig Uw oor en hoor, doe Uw ogen open, HEERE, en zie, en hoor de woorden van Sanherib, die deze man gezonden heeft om de levende God te honen.", "1 Petr 1:10": "Naar deze zaligheid hebben de profeten gezocht en onderzoek gedaan, zij die geprofeteerd hebben van de genade die voor u bestemd was;", "Joël 1:19": "Tot U, HEERE, roep ik; want een vuur heeft de weiden van de woestijn verteerd, en een vlam heeft alle bomen van het veld aangestoken.", "Ex 19:19": "Toen het geluid van de bazuin aanhield en zeer sterk werd, sprak Mozes; en God antwoordde hem met een stem.", "Dan 9:9": "Bij de Heere, onze God, zijn de barmhartigheden en vergevingen, hoewel wij tegen Hem gerebelleerd hebben.", "Job 16:14": "Hij heeft mij gebroken met breuk op breuk; Hij is tegen mij aangelopen als een geweldige.", "2 Kron 27:5": "Hij streed ook tegen de koning van de Ammonieten, en had de overhand over hen, zodat de Ammonieten hem in datzelfde jaar honderd talenten van het zilver gaven, en tienduizend kor tarwe, en tienduizend gerst; dit brachten de Ammonieten hem opnieuw, ook in het tweede en in het derde jaar.", "Ps 89:32-34": "als zij Mijn inzettingen ontheiligen, en Mijn geboden niet houden; dan zal Ik hun overtreding met de roede bezoeken, en hun ongerechtigheid met plagen. Maar Mijn goedertierenheid zal Ik van hem niet wegnemen, en in Mijn getrouwheid niet feilen.", "Deut 7:9": "U zult dan weten dat de HEERE, uw God, dié God is, de getrouwe God, Die het verbond en de goedertierenheid houdt met wie Hem liefhebben en Zijn geboden houden, tot in duizend geslachten.", "Jer 25:3": "Vanaf het dertiende jaar van Josia, de zoon van Amon, de koning van Juda, tot op deze dag toe (dit is het drieëntwintigste jaar) is het woord van de HEERE tot mij gebeurd; en ik heb tot u gesproken, vroeg opstaand en sprekend, maar u hebt niet gehoord.", "2 Sam 10:7-14": "Toen David dit hoorde, zond hij Joab heen, met heel het leger van de helden. En de kinderen Ammons trokken uit, en stelden de slagorde op voor de ingang van de poort; maar de Syriërs van Zoba, en Rechob, en de mannen van Tob en Maächa waren afzonderlijk in het veld. Toen Joab nu zag, dat de spits van de slagorde tegen hem was, van voren en van achteren, koos hij uit alle uitgelezen mannen van Israël, en stelde hen in slagorde op tegen de Syriërs;", "Jer 7:25": "Vanaf de dag dat uw vaders uit het land Egypte zijn uitgegaan, tot op deze dag, heb Ik tot u gezonden al Mijn knechten, de profeten, dagelijks vroeg opgestaan en hen zendend.", "Ps 78:68": "Maar Hij verkoos de stam van Juda, de berg Sion, die Hij liefhad.", "Ps 84:12": "Want God, de HEERE, is een Zon en Schild; de HEERE zal genade en eer geven; Hij zal het goede niet onthouden aan hen die in oprechtheid wandelen.", "2 Kron 26:5": "Want hij begaf zich om God te zoeken, in de dagen van Zacharia, die verstandig was in de gezichten van God; en in de dagen dat hij de HEERE zocht, maakte God hem voorspoedig.", "Spr 7:5-23": "Opdat zij u bewaren voor een vreemde vrouw, voor de onbekende, die met haar woorden vleit. Want door het venster van mijn huis, door mijn tralie keek ik uit; En ik zag onder de eenvoudigen; ik merkte onder de jonge mannen een verstandeloze jongeling;", "Deut 4:34": "Of: of God ooit beproefd heeft te gaan om Zich een volk uit het midden van een ander volk aan te nemen, door beproevingen, door tekenen, en door wonderen, en door strijd, en door een sterke hand, en door een uitgestrekte arm, en met grote verschrikkingen; naar alles wat de HEERE, uw God, voor u in Egypte voor uw ogen gedaan heeft?", "Ezech 23:48": "Zo zal Ik de schandelijkheid uit het land doen ophouden, opdat alle vrouwen onderwezen worden zodat zij niet naar uw schandelijkheid handelen.", "Ps 135:14": "Want de HEERE zal Zijn volk recht doen, en het zal Hem berouwen over Zijn knechten.", "1 Kron 29:19": "En geef mijn zoon Salomo een volkomen hart, om Uw geboden, Uw getuigenissen en Uw inzettingen te houden; en om alles te doen, en om dit paleis te bouwen, dat ik klaargemaakt heb.", "1 Joh 1:8-10": "Als wij zeggen dat wij geen zonde hebben, dan verleiden wij ons zelf, en de waarheid is niet in ons. Als wij onze zonden belijden: Hij is getrouw en rechtvaardig, om ons de zonden te vergeven, en ons te reinigen van alle ongerechtigheid. Als wij zeggen dat wij niet gezondigd hebben, dan maken wij Hem tot een leugenaar, en Zijn woord is niet in ons.", "Hos 4:11": "Hoererij, en wijn, en jonge wijn neemt het hart weg.", "1 Petr 2:10": "U, die vroeger geen volk was, maar nu het volk van God bent; die vroeger niet ontfermd was, maar nu ontfermd bent geworden.", "Jes 44:26": "Die het woord van Zijn knecht bevestigt, en de raad van Zijn boden volbrengt; Die tot Jeruzalem zegt: U zult bewoond worden; en tot de steden van Juda: U zult herbouwd worden, en Ik zal haar verwoeste plaatsen oprichten.", "Job 9:35": "Dan zal ik spreken en Hem niet vrezen; want zo ben ik niet bij mijzelf.", "2 Sam 11:4": "Toen zond David boden, en liet haar halen. En toen zij bij hem gekomen was, lag hij bij haar (zij had zich namelijk van haar onreinheid gezuiverd), daarna keerde zij terug naar haar huis.", "Jes 43:4": "Van toen af, dat u kostbaar bent geweest in Mijn ogen, bent u verheerlijkt geweest, en Ik heb u liefgehad; daarom heb Ik mensen in uw plaats gegeven, en volken in plaats van uw ziel.", "Rom 11:32": "Want God heeft hen allen onder de ongehoorzaamheid besloten, opdat Hij hun allen barmhartig zou zijn.", "1 Kon 20:35-41": "Toen zei een man uit de zonen van de profeten tegen zijn naaste, door het woord van de HEERE: Sla mij toch. En de man weigerde hem te slaan. En hij zei tegen hem: Omdat u de stem van de HEERE niet gehoorzaam bent geweest, zie, zodra u van mij weggegaan bent, zal een leeuw u doden. En toen hij van bij hem weggegaan was, vond een leeuw hem, die hem doodde. Daarna vond hij een andere man, en zei: Sla mij toch. En die man sloeg hem, en verwondde hem door hem te slaan.", "Ex 2:25": "En God zag de kinderen van Israël aan, en God kende hen.", "Ps 35:19": "Laat hen zich niet verblijden over mij, die mij om valse oorzaken vijand zijn; laat hen ook niet wenken met de ogen, die mij zonder oorzaak haten.", "Ps 17:6-9": "Ik roep U aan, omdat U mij verhoort; o God! Neig Uw oor tot mij; hoor mijn woorden. Maak Uw weldadigheden wonderbaar, U, die verlost wie op U vertrouwen, van hen die tegen Uw rechterhand opstaan! Bewaar mij als het zwart van de oogappel, verberg mij onder de schaduw van Uw vleugels,", "1 Kron 6:31": "Dezen nu zijn het die David heeft aangesteld voor het ambt van het gezang in het huis van de HEERE, nadat de ark tot rust was gekomen.", "Jes 14:9": "Het rijk van de dood van onderen is beroerd om uwentwil, om u tegemoet te gaan, toen u kwam; het wekt om uwentwil de doden op, al de bokken van de aarde; het doet al de koningen van de heidenvolken van hun tronen opstaan.", "Ps 108:7": "Opdat Uw beminden bevrijd worden; geef heil door Uw rechterhand, en verhoor ons.", "Openb 6:2": "En ik zag, en zie, een wit paard, en Die daarop zat, had een boog; en Hem is een kroon gegeven, en Hij ging uit, overwinnend, en om te overwinnen!", "Openb 21:8": "Maar de bangen, en ongelovigen, en verfoeilijken, en moordenaars, en hoereerders, en tovenaars, en afgodendienaars, en alle leugenaars, hun deel is in de poel die daar brandt van vuur en zwavel; dat is de tweede dood.", "1 Kron 20:3": "Hij bracht ook al het volk dat daarin was naar buiten, en hij zaagde hen met de zaag, en met ijzeren dorswagens, en met bijlen; en zo deed David met al de steden van de kinderen Ammons. Toen keerde David met al het volk terug naar Jeruzalem.", "Jer 33:8": "En Ik zal hen reinigen van al hun ongerechtigheid, waarmee zij tegen Mij gezondigd hebben; en Ik zal al hun ongerechtigheden vergeven, waarmee zij tegen Mij gezondigd en waarmee zij tegen Mij overtreden hebben.", "1 Kron 21:18": "Toen zei de engel van de HEERE tegen Gad, dat hij tegen David zou zeggen, dat David zou opgaan, om voor de HEERE een altaar op te richten op de dorsvloer van Ornan, de Jebusiet.", "Rom 2:7": "Hun die volhardend goeddoen en heerlijkheid, en eer, en onvergankelijkheid zoeken, het eeuwige leven;", "Ps 90:1": "Een gebed van Mozes, de man van God. Heere! U bent ons geweest een Toevlucht van geslacht tot geslacht.", "1 Sam 25:21": "David nu had gezegd: Zeker heb ik tevergeefs bewaakt al wat deze man in de woestijn heeft, zodat er niets gemist is van alles wat hij heeft; en hij heeft mij kwaad voor goed vergolden.", "Ps 74:6": "Zo hebben zij nu de graveersels daarvan samen met houwelen en beukhamers in stukken geslagen.", "Rom 6:23": "Want het loon van de zonde is de dood, maar de genadegift van God is het eeuwige leven, door Jezus Christus, onze Heere.", "Kol 3:12": "Doe dan aan, als uitverkorenen van God, heiligen en geliefden, de innerlijke bewegingen van barmhartigheid, goedertierenheid, ootmoedigheid, zachtmoedigheid, geduld;", "2 Petr 2:10": "maar vooral hen, die naar het vlees wandelen in onreine begeerte, en het gezag verachten; die vermetel zijn, zichzelf behagen, en die er niet voor terugschrikken de heerlijkheden te lasteren;", "1 Kon 1:17": "En zij zei tegen hem: Mijn heer! U hebt bij de HEERE, uw God, uw dienstmaagd gezworen: Zeker, Salomo, uw zoon, zal na mij koning zijn, en hij zal op mijn troon zitten!", "1 Sam 10:19": "Maar u hebt vandaag uw God verworpen, Die u Zelf uit al uw ellenden en uw noden verlost heeft, en u hebt tegen Hem gezegd: Nee, zet een koning over ons; nu dan, stel u voor het aangezicht van de HEERE, naar uw stammen en naar uw duizenden.", "Hos 1:1": "Het woord van de Heere, dat gebeurd is tot Hosea, de zoon van Beëri, in de dagen van Uzzia, Jotham, Achaz, Hizkia, koningen van Juda, en in de dagen van Jerobeam, zoon van Joas, koning van Israël.", "2 Kron 30:9": "Want als u zich bekeert tot de HEERE, zullen uw broeders en uw kinderen barmhartigheid vinden bij hen die hen gevangen hebben genomen, zodat zij in dit land zullen terugkomen; want de HEERE, uw God, is genadig en barmhartig, en zal Zijn aangezicht niet van u afwenden, als u zich tot Hem bekeert.", "Luk 15:11-27": "En Hij zei: Een zeker mens had twee zonen. En de jongste van hen zei tegen de vader: Vader, geef mij het deel van het bezit, dat mij toekomt. En hij verdeelde onder hen het bezit. En niet veel dagen daarna heeft de jongste zoon alles bijeengebracht, en is weggereisd naar een ver land, en heeft daar zijn bezit doorgebracht, terwijl hij overdadig leefde.", "Ps 130:4": "Maar bij U is vergeving, opdat U gevreesd wordt.", "Hos 4:7": "Zoals zij meer geworden zijn, zo hebben zij tegen Mij gezondigd; Ik zal hun eer in schande veranderen.", "Hebr 12:6": "Want die de Heere liefheeft, kastijdt Hij, en Hij geselt iedere zoon die Hij aanneemt.", "Ps 64:3": "Verberg mij voor de heimelijke afspraken van de boosdoeners, voor het oproer van de werkers van ongerechtigheid.", "Jes 17:6": "Toch zal er een nalezing in overblijven, zoals bij het afschudden van de olijfboom, twee of drie bezien in de top van de opperste twijg, en vier of vijf aan zijn vruchtbare takken, spreekt de HEERE, de God van Israël.", "Deut 3:11": "Want Og, de koning van Bazan, was als enige van de overgeblevenen van de reuzen overgebleven; zie, zijn bed, een bed van ijzer, staat dat niet in Rabba van de kinderen van Ammon? Negen el is zijn lengte, en vier el zijn breedte, naar de elleboogsmaat van een man.", "Ezech 20:27": "Daarom, mensenkind, spreek tot het huis van Israël, en zeg tegen hen: Zo zegt de Heere HEERE: Hiermee nog hebben uw vaderen Mij gesmaad, dat zij door overtreding tegen Mij hebben overtreden.", "Jer 8:2": "En zij zullen ze uitspreiden voor de zon, en voor de maan, en voor het hele heerleger van de hemel, die zij liefgehad hebben, en die zij gediend hebben, en die zij nagevolgd hebben, en die zij gezocht hebben, en voor wie zij zich neergebogen hebben; zij zullen niet verzameld noch begraven worden; tot mest op de aardbodem zullen zij zijn.", "2 Sam 3:35": "Daarna kwam al het volk om David brood te laten eten, terwijl het nog dag was; maar David zwoer: God moet mij zo doen, en er nog meer aan toevoegen, als ik vóór het ondergaan van de zon brood of iets anders smaak!", "Klaagl 2:19": "Koph. Maak u op, maak geschrei 's nachts, in het begin van de nachtwaken, stort uw hart uit voor het aangezicht van de Heere als water; hef uw handen tot Hem op voor de ziel van uw kinderen, die in onmacht gevallen zijn van honger, vooraan op alle straten.", "Joz 10:35": "En zij namen haar in op diezelfde dag, en sloegen haar met de scherpte van het zwaard, en elke ziel die daarin was, verbande hij op diezelfde dag, naar alles wat hij aan Lachis gedaan had.", "Ezech 40:1": "In het vijfentwintigste jaar van onze wegvoering, in het begin van het jaar, op de tiende van de maand, in het veertiende jaar nadat de stad was ingenomen, op diezelfde dag was de hand van de HEERE op mij, en Hij bracht mij daarheen.", "Jes 29:15": "Wee hun die zich diep willen verbergen voor de HEERE, hun raad verbergend; en wier werken in duisternis gebeuren, en zij zeggen: Wie ziet ons, en wie kent ons?", "Neh 4:4": "Hoor, o onze God, dat wij erg veracht worden, en keer hun smaad terug op hun eigen hoofd, en geef hen over als buit in een land van gevangenschap.", "Amos 2:4": "Zo zegt de HEERE: Om drie overtredingen van Juda, en om vier zal Ik dat niet afwenden; omdat zij de wet van de HEERE verworpen, en Zijn inzettingen niet bewaard hebben; en hun leugens hen verleid hebben, die hun vaders hebben nagevolgd.", "Hebr 10:28": "Als iemand de wet van Mozes heeft verworpen, sterft hij zonder ontferming, op het woord van twee of drie getuigen;", "Ps 61:2": "O God! hoor mijn geschrei, merk op mijn gebed.", "Deut 32:6": "Zult u dit de HEERE vergelden, u, dwaas en onwijs volk! Is Hij niet uw Vader, Die u verkregen heeft, Die u gemaakt en u bevestigd heeft?", "2 Kon 20:19": "Maar Hizkia zei tegen Jesaja: Het woord van de HEERE, dat u gesproken hebt, is goed. Ook zei hij: Zou het niet goed zijn, als er vrede en waarheid in mijn dagen zal zijn?", "Deut 32:13": "Hij deed hem rijden op de hoogten van de aarde, zodat hij at van de opbrengsten van het veld; en Hij deed hem honing zuigen uit de steenrots, en olie uit de harde rots;", "Rom 2:24": "Want de Naam van God wordt om u gelasterd onder de heidenen, zoals geschreven is.", "Luk 15:11-32": "En Hij zei: Een zeker mens had twee zonen. En de jongste van hen zei tegen de vader: Vader, geef mij het deel van het bezit, dat mij toekomt. En hij verdeelde onder hen het bezit. En niet veel dagen daarna heeft de jongste zoon alles bijeengebracht, en is weggereisd naar een ver land, en heeft daar zijn bezit doorgebracht, terwijl hij overdadig leefde.", "1 Tess 4:14": "Want als wij geloven dat Jezus gestorven is en opgestaan, zo zal God ook hen die in Jezus ontslapen zijn, met Hem terug brengen.", "Job 14:13": "Och, wilde U mij toch in het graf verbergen, mij verstoppen, totdat Uw toorn zich afkeerde; dat U mij een vaste tijd stelde, en aan mij zou denken!", "2 Sam 12:9-12": "Waarom hebt u dan het woord van de HEERE veracht, door te doen wat kwaad is in Zijn ogen? U hebt Uria, de Hethiet, met het zwaard verslagen, en zijn vrouw hebt u tot uw vrouw genomen; en hem hebt u met het zwaard van de kinderen van Ammon gedood. Nu dan, het zwaard zal niet van uw huis wijken tot in eeuwigheid, omdat u Mij veracht hebt, en de vrouw van Uria, de Hethiet, genomen hebt, zodat zij uw vrouw is geworden. Zo zegt de HEERE: Zie, Ik zal kwaad over u verwekken uit uw eigen huis, en Ik zal uw vrouwen nemen voor uw ogen, en zal ze aan uw naaste geven; die zal bij uw vrouwen liggen, voor de ogen van deze zon.", "Ps 3:3": "Velen zeggen van mijn ziel: Hij heeft geen heil bij God. Sela.", "1 Kor 15:10": "Maar door de genade van God ben ik wat ik ben; en Zijn genade die aan mij bewezen is, is niet tevergeefs geweest, maar ik heb overvloediger gewerkt dan zij allen; toch niet ik, maar de genade van God, Die met mij is.", "Ezech 2:2": "Zo kwam in mij, toen Hij tot mij sprak, de Geest, Die mij op mijn voeten zette; en ik hoorde Hem, Die tot mij sprak.", "Amos 3:1": "Hoort dit woord, dat de HEERE tegen u spreekt, kinderen van Israël! Namelijk tegen het gehele geslacht, dat Ik uit Egypteland heb opgevoerd, en Hij zei:", "Ps 118:1-4": "Loof de HEERE, want Hij is goed; want Zijn goedertierenheid is voor eeuwig. Laat Israël nu zeggen, dat Zijn goedertierenheid voor eeuwig is. Laat het huis van Aäron nu zeggen, dat Zijn goedertierenheid voor eeuwig is.", "2 Sam 12:26-31": "Joab nu streed tegen Rabba van de kinderen van Ammon; en hij nam de koninklijke stad in. Toen zond Joab boden naar David, en zei: Ik heb gestreden tegen Rabba, en ik heb ook de waterstad ingenomen. Verzamel u nu het overige van het volk, en beleger de stad, en neem haar in; anders zou het, als ík de stad zou innemen, naar mijn naam genoemd worden.", "Ps 95:7": "Want Hij is onze God, en wij zijn het volk van Zijn weide, en de schapen van Zijn hand. Heden, als u Zijn stem hoort,", "Num 1:1": "Verder sprak de HEERE tot Mozes, in de woestijn van Sinaï, in de tent van de samenkomst, op de eerste dag van de tweede maand, in het tweede jaar nadat zij uit het land Egypte vertrokken waren, en Hij zei:", "2 Kron 26:15": "Hij maakte ook te Jeruzalem kunstige werktuigen, bedacht door kunstige werkmeesters, om op de torens en op de hoeken te staan, om met pijlen en met grote stenen te schieten; zo ging zijn naam tot ver weg uit, want hij werd wonderlijk geholpen, totdat hij sterk was.", "Tit 3:5": "Heeft Hij ons zalig gemaakt, niet uit de werken van de rechtvaardigheid die wij gedaan hadden, maar naar Zijn barmhartigheid, door het bad van de wedergeboorte en de vernieuwing door de Heilige Geest;", "Joh 3:14-16": "En zoals Mozes de slang in de woestijn verhoogd heeft, zo moet de Zoon des mensen verhoogd worden; Opdat ieder die in Hem gelooft, niet verloren gaat, maar het eeuwige leven heeft. Want zo lief heeft God de wereld gehad, dat Hij Zijn eniggeboren Zoon gegeven heeft, opdat ieder die in Hem gelooft, niet verloren gaat, maar het eeuwige leven heeft.", "Richt 10:16": "En zij deden de vreemde goden uit hun midden weg, en dienden de HEERE. Toen werd Zijn ziel verdrietig over de ellende van Israël.", "Matt 19:17": "En Hij zei tegen hem: Wat noemt u Mij goed? Niemand is goed dan Eén, namelijk God. Maar wilt u het leven ingaan, onderhoud de geboden.", "Ps 119:76": "Laat toch Uw goedertierenheid zijn om mij te troosten, naar Uw toezegging aan Uw knecht.", "Jer 31:14": "En Ik zal de ziel van de priesters met overvloed dronken maken; en Mijn volk zal met Mijn goed verzadigd worden, spreekt de HEERE.", "Jes 57:19": "Ik schep de vrucht van de lippen: vrede, vrede voor hen die ver weg zijn, en voor hen die dichtbij zijn, zegt de HEERE, en Ik zal hen genezen.", "Hebr 11:10": "Want hij verwachtte de stad die fundamenten heeft, waarvan God de Ontwerper en Bouwer is.", "Ps 86:5": "Want Gij, Heere! zijt goed, en vergeeft graag, en van grote goedertierenheid voor allen die U aanroepen.", "Job 33:11": "Hij legt mijn voeten in de stok; Hij neemt al mijn paden waar.", "Ezech 33:11": "Zeg tegen hen: Zo waarachtig als Ik leef, spreekt de Heere HEERE, Ik heb geen behagen in de dood van de goddeloze! Maar hierin heb Ik behagen, dat de goddeloze zich bekeert van zijn weg en leeft. Bekeert u, bekeert u van uw slechte wegen, want waarom zou u sterven, o huis van Israël?", "2 Kor 1:9": "Ja, wij hadden zelf al in onszelf het vonnis van de dood, opdat wij niet op onszelf zouden vertrouwen, maar op God, Die de doden opwekt;", "Amos 7:9": "Maar de hoogten van Izak zullen verwoest worden, en de eigendommen van Israël zullen verstoord worden; en Ik zal tegen het huis van Jerobeam opstaan met het zwaard.", "Ps 64:2": "Hoor, o God, mijn stem in mijn geklaag; behoed mijn leven voor de schrik van de vijand.", "Mal 1:6": "Een zoon zal zijn vader eren, en een knecht zijn heer; ben Ik dan een Vader, waar is Mijn eer? En ben Ik een Heere, waar is de vrees voor Mij? zegt de HEERE van de heerscharen tegen u, priesters, verachters van Mijn Naam! Maar u zegt: Waarmee verachten wij Uw Naam?", "1 Sam 19:23": "Toen ging hij daarheen naar Najoth bij Rama; en dezelfde Geest van God kwam ook op hem, en al voortgaande profeteerde hij, totdat hij in Najoth in Rama aankwam.", "Ps 32:1": "Een onderwijzing van David. Gelukkig is hij, wiens overtreding vergeven is, wiens zonde bedekt is.", "Richt 14:6": "Toen kwam de Geest van de HEERE machtig over hem, zodat hij hem uiteenscheurde, zoals men een bokje uiteenscheurt, en er was niets in zijn hand; maar hij vertelde zijn vader en zijn moeder niet wat hij gedaan had.", "Ps 35:23": "Ontwaak en word wakker tot mijn recht; mijn God en Heere! Tot mijn twistzaak.", "Hagg 1:13": "Toen sprak Haggai, de bode van de HEERE, in de boodschap van de HEERE, tot het volk, en hij zei: Ik ben met u, spreekt de HEERE.", "Job 20:12-14": "Al is het kwaad zoet in zijn mond, al verbergt hij dat onder zijn tong, Al spaart hij het en laat het niet los, maar houdt het midden in zijn gehemelte binnen; Zijn voedsel zal in zijn ingewanden veranderd worden; gal van adders zal het in zijn binnenste zijn.", "2 Sam 13:38": "Zo vluchtte Absalom, en ging naar Gesur; en hij was daar drie jaar.", "Hand 2:30": "Omdat hij dan een profeet was, en wist dat God hem met een eed gezworen had dat Hij uit de vrucht van zijn lichaam, wat het vlees betreft, de Christus zou verwekken om Hem op zijn troon te zetten;", "1 Sam 1:11": "En zij deed een gelofte, en zei: HEERE van de heerscharen, als U werkelijk de ellende van Uw dienstmaagd aanziet, en aan mij denkt, en Uw dienstmaagd niet vergeet, maar aan Uw dienstmaagd een zoon geeft, dan zal ik hem aan de HEERE geven al de dagen van zijn leven, en er zal geen scheermes op zijn hoofd komen.", "2 Kron 13:20": "En Jerobeam kreeg geen kracht meer terug in de dagen van Abia; maar de HEERE sloeg hem, zodat hij stierf.", "Ps 49:8-10": "niemand van hen zal zijn broeder ooit kunnen verlossen; hij zal aan God zijn losprijs niet kunnen geven; (want de verlossing van hun ziel is te kostbaar, en zal voor eeuwig ophouden); dat hij ook voortaan voor altijd zou leven, en de vergankelijkheid niet zien.", "2 Sam 16:12": "Misschien zal de HEERE naar mijn ellende omzien; en de HEERE zal mij goed vergelden voor zijn vloek van vandaag.", "Klaagl 5:19-22": "U, o HEERE, zit in eeuwigheid, Uw troon is van geslacht tot geslacht. Waarom zou U ons voor altijd vergeten? Waarom zou U ons zo lange tijd verlaten? HEERE, bekeer ons tot U, dan zullen wij bekeerd zijn; vernieuw onze dagen als vanouds.", "Ps 79:5": "Hoe lang, HEERE? Zult U eeuwig toornen? Zal Uw ijver als vuur branden?", "Micha 7:19": "Hij zal Zich weer over ons ontfermen; Hij zal onze ongerechtigheden dempen; ja, U zult al hun zonden in de diepten van de zee werpen.", "2 Kron 7:14": "En Mijn volk, over wie Mijn Naam genoemd wordt, zich verootmoedigt en bidt, en zij Mijn aangezicht zoeken, en zich bekeren van hun slechte wegen; dan zal Ik uit de hemel horen, en hun zonden vergeven, en hun land genezen.", "Ps 103:7": "Hij heeft Mozes Zijn wegen bekendgemaakt, aan de kinderen van Israël Zijn daden.", "Deut 22:13-29": "Wanneer een man een vrouw genomen heeft, en tot haar ingegaan is, en haar dan haat, En haar oorzaak geeft tot naspraak, en een kwade naam over haar verspreidt, en zegt: Deze vrouw heb ik genomen, en toen ik tot haar naderde, heb ik haar maagdelijkheid niet gevonden; Dan zullen de vader van deze jonge dochter en haar moeder haar meenemen, en naar de oudsten van de stad brengen, bij de poort, met het bewijs van de maagdelijkheid van deze jonge vrouw.", "Ps 86:1-17": "Een gebed van David. HEERE! neig Uw oor, verhoor mij; want ik ben ellendig en nooddruftig. Bewaar mijn ziel, want ik ben Uw gunstgenoot, o Gij, mijn God! verlos Uw knecht, die op U vertrouwt. Wees mij genadig, Heere! want ik roep tot U de hele dag.", "Hebr 11:13": "Deze allen zijn in het geloof gestorven, zonder de beloften ontvangen te hebben, maar zij hebben ze van verre gezien, en geloofd, en begroet, en beleden dat zij gasten en vreemdelingen op de aarde waren.", "Jes 36:18": "Laat Hizkia u niet verleiden, door te zeggen: De HEERE zal ons redden; hebben de goden van de volken, ieder zijn eigen land, gered uit de hand van de koning van Assyrië?", "Lev 20:10-12": "Een man ook, die met de vrouw van een ander overspel doet, omdat hij overspel doet met de vrouw van zijn naaste, zal zeker gedood worden, de overspeler en de overspeelster. En een man, die gemeenschap heeft met de vrouw van zijn vader, heeft de schaamte van zijn vader ontdekt; zij beiden zullen zeker gedood worden; hun bloed is op hen! Ook als de man gemeenschap heeft met de vrouw van zijn zoon, zullen zij beiden zeker gedood worden; zij hebben een gruwelijke vermenging gedaan; hun bloed is op hen!", "Hebr 1:1": "Nadat God voortijds veelmaal en op velerlei wijze tot de vaderen gesproken heeft door de profeten, heeft Hij in deze laatste dagen tot ons gesproken door de Zoon;", "2 Kor 7:4": "Ik heb veel vrijmoedigheid in het spreken tegen u, ik heb veel roem over u; ik ben vervuld met vertroosting; ik ben zeer overvloedig van blijdschap in al onze verdrukking.", "Richt 6:7-10": "En het gebeurde, toen de Israëlieten tot de HEERE riepen vanwege de Midianieten, dat de HEERE een man zond, die een profeet was, naar de Israëlieten; die zei tegen hen: Zo zegt de HEERE, de God van Israël: Ik heb u uit Egypte doen optrekken, en u uit het slavenhuis uitgeleid; en Ik heb u verlost uit de hand van de Egyptenaren, en uit de hand van allen die u onderdrukten; en Ik heb hen voor uw ogen verdreven, en u hun land gegeven;", "Rom 2:1": "Daarom bent u niet te verontschuldigen, o mens, wie u ook bent die anderen oordeelt; want waarin u een ander oordeelt, veroordeelt u uzelf; want u, die anderen oordeelt, doet dezelfde dingen.", "Hand 28:25": "En omdat zij het onderling oneens waren, gingen zij uiteen, nadat Paulus dit ene woord gezegd had, namelijk: Terecht heeft de Heilige Geest gesproken door de profeet Jesaja tot onze voorvaders,", "2 Kon 1:3": "Maar de Engel van de HEERE sprak tot Elia, de Thisbiet: Maak u op, ga de boden van de koning van Samaria tegemoet, en spreek tot hen: Is het omdat er geen God in Israël is, dat u heengaat om Baäl-Zebub, de god van Ekron, te vragen?", "Ps 22:27": "De zachtmoedigen zullen eten en verzadigd worden; zij zullen de HEERE prijzen, die Hem zoeken; uw hart zal in eeuwigheid leven.", "Openb 2:7": "Wie oren heeft, laat hij horen wat de Geest tegen de gemeenten zegt. Wie overwint, hem zal Ik geven te eten van de boom des levens, die in het midden van het paradijs van God is.", "2 Kon 23:7": "Daartoe brak hij de huizen van de schandjongens af, die bij het huis van de HEERE waren, waar de vrouwen huisjes voor het beeld van het bos weefden.", "Luk 9:25": "Want wat baat het een mens als hij de hele wereld zou winnen, en zichzelf verliezen of schade lijden?", "Luk 15:21": "En de zoon zei tegen hem: Vader, ik heb gezondigd tegen de hemel, en tegenover u, en ben niet meer waard uw zoon genoemd te worden.", "Joh 18:11": "Jezus dan zei tegen Petrus: Steek uw zwaard in de schede. Zou Ik de drinkbeker die de Vader Mij gegeven heeft, niet drinken?", "Jer 33:11": "De stem van vreugde en de stem van blijdschap, de stem van de bruidegom en de stem van de bruid, de stem van hen die zeggen: Looft de HEERE van de heerscharen, want de HEERE is goed, want Zijn goedertierenheid is tot in eeuwigheid! de stem van hen die lof brengen naar het huis van de HEERE; want Ik zal de gevangenschap van het land wenden, als in het begin, zegt de HEERE.", "Ps 103:8-14": "Barmhartig en genadig is de HEERE, geduldig en groot van goedertierenheid. Hij zal niet altijd twisten, en ook niet eeuwig de toorn behouden. Hij doet ons niet naar onze zonden, en vergeldt ons niet naar onze ongerechtigheden.", "Hebr 11:5": "Door het geloof is Henoch weggenomen, zodat hij de dood niet zou zien; en hij werd niet gevonden, omdat God hem weggenomen had; want vóór zijn wegneming had hij het getuigenis dat hij God behaagde.", "Luk 20:36-38": "want zij kunnen niet meer sterven, want zij zijn gelijk aan de engelen; en zij zijn kinderen van God, omdat zij kinderen van de opstanding zijn. En dat de doden opgewekt zullen worden, heeft ook Mozes aangewezen bij de doornstruik, toen hij de Heere de God van Abraham noemt, en de God van Izak, en de God van Jakob. God is niet een God van de doden, maar van de levenden; want voor Hem leven zij allen.", "Joh 5:20": "Want de Vader heeft de Zoon lief, en toont Hem alles wat Hijzelf doet; en Hij zal Hem grotere werken tonen dan deze, zodat u zich verwondert.", "Jes 38:19": "De levende, de levende, die zal U loven, zoals ik heden doe; de vader zal aan de kinderen Uw waarheid bekendmaken.", "Ps 50:21": "Deze dingen doet u, en Ik zwijg; u meent dat Ik helemaal ben zoals u; Ik zal u straffen, en zal het ordelijk voor uw ogen op een rij zetten.", "Luk 16:18": "Ieder die zijn vrouw verlaat en een andere trouwt, doet overspel; en ieder die haar trouwt die door de man verlaten is, doet ook overspel.", "2 Sam 7:25-29": "Nu dan, HEERE God, doe dit woord, dat U over Uw knecht en over zijn huis gesproken hebt, blijven bestaan tot in eeuwigheid, en doe zoals U gesproken hebt. En laat Uw Naam groot gemaakt worden tot in eeuwigheid, zodat men zegt: De HEERE van de heerscharen is God over Israël; en het huis van Uw knecht David zal bestendig zijn voor Uw aangezicht. Want U, HEERE van de heerscharen, God van Israël! U hebt het voor het oor van Uw knecht geopenbaard, en gezegd: Ik zal u een huis bouwen; daarom heeft Uw knecht in zijn hart gevonden, dit gebed tot U te bidden.", "Jer 18:1": "Het woord dat van de HEERE tot Jeremia gebeurde, en Hij zei:", "Hagg 1:2": "Zo spreekt de HEERE van de heerscharen: Dit volk zegt: De tijd is niet gekomen, de tijd dat het huis van de HEERE gebouwd moet worden.", "Ex 22:27": "want dat is zijn enige bedekking, het is zijn kleding voor zijn huid; waarin zou hij anders slapen? Het zal dan gebeuren, wanneer hij tot Mij roept, dat Ik hem zal horen; want Ik ben genadig!", "Jer 51:5": "Want Israël of Juda zal niet in weduwschap gelaten worden door zijn God, door de HEERE van de heerscharen (hoewel hun land vol schuld is), door de Heilige van Israël.", "Ps 5:2": "O HEERE, neem mijn woorden ter oor; let op mijn overdenking.", "Ps 42:10": "Ik zal zeggen tot God: Mijn Steenrots! Waarom vergeet U mij? Waarom ga ik in het zwart, vanwege de onderdrukking van de vijand?", "Ex 29:45": "En Ik zal in het midden van de kinderen van Israël wonen, en Ik zal hun tot een God zijn.", "Luk 12:2": "Er is niets bedekt, dat niet onthuld zal worden, en niets verborgen, dat niet bekend zal worden.", "2 Kron 33:13": "En bad tot Hem; en Hij liet Zich door hem verbidden, en hoorde zijn smeking, en Hij bracht hem terug naar Jeruzalem, in zijn koninkrijk. Toen erkende Manasse, dat de HEERE God is.", "1 Sam 27:5": "En David zei tegen Achis: Als ik nu genade gevonden heb in uw
