 op te brengen, bij wie de Naam wordt aangeroepen, de Naam van de HEERE van de heerscharen[1], Die daarop woont tussen de cherubs.", "3": "En zij zetten de ark van God op een nieuwe wagen, en haalden die uit het huis van Abinadab, dat op een heuvel is; en Uza en Ahio, zonen van Abinadab, leidden de nieuwe wagen.", "4": "Toen zij hem nu uit het huis van Abinadab, dat op de heuvel is, met de ark van God, wegvoerden, ging Ahio voor de ark uit.", "5": "En David en het hele huis van Israël speelden voor het aangezicht van de HEERE, met allerlei *snarenspel* van dennenhout, met harpen, en met luiten, en met trommels, ook met schellen, en met cimbalen.", "6": "Toen zij nu kwamen tot aan de dorsvloer van Nachon, strekte Uza zijn hand uit naar de ark van God, en hield die vast, want de runderen struikelden.", "7": "Toen ontstak de toorn van de HEERE tegen Uza, en God sloeg hem daar, om deze onbedachtzaamheid; en hij stierf daar bij de ark van God.", "8": "En David werd toornig, omdat de HEERE een scheur gescheurd had aan Uza; en hij noemde die plaats Perez-uza, tot op deze dag.", "9": "En David vreesde de HEERE die dag; en hij zei: Hoe zal de ark van de HEERE bij mij komen?", "10": "David dan wilde de ark van de HEERE niet bij zich laten overbrengen naar de stad van David; maar David deed haar afwijken naar het huis van Obed-edom, de Gethiet.", "11": "En de ark van de HEERE bleef in het huis van Obed-edom, de Gethiet, drie maanden; en de HEERE zegende Obed-edom en zijn hele huis.", "12": "Toen berichtte men aan koning David: De HEERE heeft het huis van Obed-edom, en alles wat hij heeft, gezegend om de ark van God. Zo ging David heen en haalde de ark van God uit het huis van Obed-edom naar de stad van David, met vreugde.", "13": "En het gebeurde, toen zij die de ark van de HEERE droegen, zes treden voortgegaan waren, dat hij ossen en gemest *vee* offerde.", "14": "En David huppelde met alle macht voor het aangezicht van de HEERE; en David was omgord met een linnen lijfrok.", "15": "Zo brachten David en het hele huis van Israël de ark van de HEERE op, met gejuich en met geluid van bazuinen.", "16": "En het gebeurde, toen de ark van de HEERE in de stad van David kwam, dat Michal, de dochter van Saul, door het venster uitkeek. Toen zij nu koning David zag, springend en huppelend voor het aangezicht van de HEERE, verachtte zij hem in haar hart.", "17": "Toen zij nu de ark van de HEERE naar binnen brachten, zetten zij die op haar plaats, in het midden van de tent die David voor haar gespannen had; en David offerde brandoffers voor het aangezicht van de HEERE, en dankoffers.", "18": "Toen David geëindigd had het brandoffer en de dankoffers te offeren, zegende hij het volk in de Naam van de HEERE van de heerscharen.", "19": "En hij deelde uit aan het hele volk, aan de hele menigte van Israël, van de mannen tot de vrouwen toe, aan ieder een broodkoek, en een goed stuk *vlees*, en een fles *wijn*. Toen ging al dat volk heen, ieder naar zijn huis.", "20": "Toen David nu terugkwam om zijn huis te zegenen, ging Michal, de dochter van Saul, naar buiten, David tegemoet, en zei: Hoe is de koning van Israël vandaag geëerd, die zich vandaag voor de ogen van de dienstmaagden van zijn dienstknechten heeft ontbloot, zoals een van de nietswaardige mensen zich onbeschaamd ontbloot!", "21": "Maar David zei tegen Michal: Voor het aangezicht van de HEERE, Die mij verkozen heeft boven uw vader en boven zijn hele huis, om mij aan te stellen tot een voorganger over het volk van de HEERE, over Israël; ja, ik zal spelen voor het aangezicht van de HEERE.", "22": "Ook zal ik mij nog geringer houden dan dit, en nederig zijn in mijn ogen; en met de dienstmaagden waarvan u gesproken hebt, met hen zal ik geëerd worden.", "23": "Michal nu, de dochter van Saul, had geen kind, tot de dag van haar dood toe."}, "SV": {"1": "Daarna verzamelde David wederom alle uitgelezenen in Israël, dertig duizend.", "2": "En David maakte zich op, en ging heen met al het volk, dat bij hem was, van Baälim-juda, om van daar op te brengen de ark Gods, bij dewelke de Naam wordt aangeroepen, de Naam van den HEERE der heirscharen, Die daarop woont tussen de cherubim.", "3": "En zij voerden de ark Gods op een nieuwen wagen, en haalden ze uit het huis van Abinadab, dat op een heuvel is; en Uza en Ahio, zonen van Abinadab, leidden den nieuwen wagen.", "4": "Toen zij hem nu uit het huis van Abinadab, dat op den heuvel is, met de ark Gods, wegvoerden, zo ging Ahio voor de ark henen.", "5": "En David en het ganse huis Israëls speelden voor het aangezicht des HEEREN, met allerlei *snarenspel* van dennenhout, als met harpen, en met luiten, en met trommelen, ook met schellen, en met cimbalen.", "6": "Als zij nu kwamen tot aan Nachons dorsvloer, zo strekte Uza *zijn* *hand* uit aan de ark Gods, en hield ze, want de runderen struikelden.", "7": "Toen ontstak de toorn des HEEREN tegen Uza, en God sloeg hem aldaar, om deze onbedachtzaamheid; en hij stierf aldaar bij de ark Gods.", "8": "En David ontstak, omdat de HEERE een scheur gescheurd had aan Uza; en hij noemde dezelve plaats Perez-uza, tot op dezen dag.", "9": "En David vreesde den HEERE ten zelven dage; en hij zeide: Hoe zal de ark des HEEREN tot mij komen?", "10": "David dan wilde de ark des HEEREN niet tot zich *laten* overbrengen in de stad Davids; maar David deed ze afwijken in het huis van Obed-edom, den Gethiet.", "11": "En de ark des HEEREN bleef in het huis van Obed-edom, den Gethiet, drie maanden; en de HEERE zegende Obed-edom en zijn ganse huis.", "12": "Toen boodschapte men den koning David, zeggende: De HEERE heeft het huis van Obed-edom, en al wat hij heeft, gezegend om der ark Gods wil; zo ging David heen en haalde de ark Gods uit het huis van Obed-edom opwaarts in de stad Davids, met vreugde.", "13": "En het geschiedde, als zij, die de ark des HEEREN droegen, zes treden voortgetreden waren, dat hij ossen en gemest *vee* offerde.", "14": "En David huppelde met alle macht voor het aangezicht des HEEREN; en David was omgord met een linnen lijfrok.", "15": "Alzo brachten David en het ganse huis Israëls de ark des HEEREN op, met gejuich en met geluid der bazuinen.", "16": "En het geschiedde, als de ark des HEEREN in de stad Davids kwam, dat Michal, Sauls dochter, door het venster uitzag. Als zij nu den koning David zag, springende en huppelende voor het aangezicht des HEEREN, verachtte zij hem in haar hart.", "17": "Toen zij nu de ark des HEEREN inbrachten, stelden zij die in haar plaats, in het midden der tent, die David voor haar gespannen had; en David offerde brandofferen voor des HEEREN aangezicht, en dankofferen.", "18": "Als David geëindigd had het brandoffer en de dankofferen te offeren, zo zegende hij het volk in den Naam des HEEREN der heirscharen.", "19": "En hij deelde uit aan het ganse volk, aan de ganse menigte van Israël, van de mannen tot de vrouwen toe, aan een iegelijk een broodkoek, en een schoon stuk *vlees*, en een fles *wijn*. Toen ging al dat volk heen, een iegelijk naar zijn huis.", "20": "Als nu David wederkwam, om zijn huis te zegenen, ging Michal, Sauls dochter, uit, David tegemoet, en zeide: Hoe is heden de koning van Israël verheerlijkt, die zich heden voor de ogen van de dienstmaagden zijner dienstknechten heeft ontbloot, gelijk een van de ijdele lieden zich onbeschaamdelijk ontbloot?", "21": "Maar David zeide tot Michal: Voor het aangezicht des HEEREN, Die mij verkoren heeft voor uw vader en voor zijn ganse huis, mij instellende tot een voorganger over het volk des HEEREN, over Israël; ja, ik zal spelen voor het aangezicht des HEEREN.", "22": "Ook zal ik mij nog geringer houden dan alzo, en zal nederig zijn in mijn ogen, en met de dienstmaagden, waarvan gij gezegd hebt, met dezelve zal ik verheerlijkt worden.", "23": "Michal nu, Sauls dochter, had geen kind, tot den dag van haar dood toe."}, "KJV": {"1": "Again, David gathered together all the chosen men of Israel, thirty thousand.", "2": "And David arose, and went with all the people that were with him from Baale of Judah, to bring up from thence the ark of God, whose name is called by the name of the LORD of hosts that dwelleth between the cherubims.", "3": "And they set the ark of God upon a new cart, and brought it out of the house of Abinadab that was in Gibeah: and Uzzah and Ahio, the sons of Abinadab, drave the new cart.", "4": "And they brought it out of the house of Abinadab which was at Gibeah, accompanying the ark of God: and Ahio went before the ark.", "5": "And David and all the house of Israel played before the LORD on all manner of instruments made of fir wood, even on harps, and on psalteries, and on timbrels, and on cornets, and on cymbals.", "6": "And when they came to Nachon's threshingfloor, Uzzah put forth his hand to the ark of God, and took hold of it; for the oxen shook it.", "7": "And the anger of the LORD was kindled against Uzzah; and God smote him there for his error; and there he died by the ark of God.", "8": "And David was displeased, because the LORD had made a breach upon Uzzah: and he called the name of the place Perezuzzah to this day.", "9": "And David was afraid of the LORD that day, and said, How shall the ark of the LORD come to me?", "10": "So David would not remove the ark of the LORD unto him into the city of David: but David carried it aside into the house of Obededom the Gittite.", "11": "And the ark of the LORD continued in the house of Obededom the Gittite three months: and the LORD blessed Obededom, and all his household.", "12": "And it was told king David, saying, The LORD hath blessed the house of Obededom, and all that pertaineth unto him, because of the ark of God. So David went and brought up the ark of God from the house of Obededom into the city of David with gladness.", "13": "And it was so, that when they that bare the ark of the LORD had gone six paces, he sacrificed oxen and fatlings.", "14": "And David danced before the LORD with all his might; and David was girded with a linen ephod.", "15": "So David and all the house of Israel brought up the ark of the LORD with shouting, and with the sound of the trumpet.", "16": "And as the ark of the LORD came into the city of David, Michal Saul's daughter looked through a window, and saw king David leaping and dancing before the LORD; and she despised him in her heart.", "17": "And they brought in the ark of the LORD, and set it in his place, in the midst of the tabernacle that David had pitched for it: and David offered burnt offerings and peace offerings before the LORD.", "18": "And as soon as David had made an end of offering burnt offerings and peace offerings, he blessed the people in the name of the LORD of hosts.", "19": "And he dealt among all the people, even among the whole multitude of Israel, as well to the women as men, to every one a cake of bread, and a good piece of flesh, and a flagon of wine. So all the people departed every one to his house.", "20": "Then David returned to bless his household. And Michal the daughter of Saul came out to meet David, and said, How glorious was the king of Israel to day, who uncovered himself to day in the eyes of the handmaids of his servants, as one of the vain fellows shamelessly uncovereth himself!", "21": "And David said unto Michal, It was before the LORD, which chose me before thy father, and before all his house, to appoint me ruler over the people of the LORD, over Israel: therefore will I play before the LORD.", "22": "And I will yet be more vile than thus, and will be base in mine own sight: and of the maidservants which thou hast spoken of, of them shall I be had in honour.", "23": "Therefore Michal the daughter of Saul had no child unto the day of her death."}}, "tsk": {"2": [{"kopje": "Baälim-juda", "refs": ["Joz 15:9", "Joz 15:10", "Joz 15:60", "1 Sam 7:1", "1 Kron 13:5", "1 Kron 13:6"]}, {"kopje": "de Naam", "refs": ["Lev 24:11-16", "Jes 47:4", "Jes 54:5"]}, {"kopje": "woont", "refs": ["Ex 25:18-22", "1 Sam 4:4", "1 Kon 8:6", "1 Kon 8:7", "Ps l=2Sam.6.21#i13061", "refs": [{"disp": "2 Sam 6:21-23", "href": "../../2-samuel/6/#v21", "ref": "2 Sam 6:21-23", "svLabel": null}], "kinderen": []}]}]}, {"topic": "Retaliation", "href": "../../nave/r/#t-retaliation", "kinderen": [{"label": "Instances Of", "href": "../../nave/r/?hl=2Sam.6.21#i17292", "refs": [], "kinderen": [{"label": "David on Michal", "href": "../../nave/r/?hl=2Sam.6.21#i17298", "refs": [{"disp": "2 Sam 6:21-23", "href": "../../2-samuel/6/#v21", "ref": "2 Sam 6:21-23", "svLabel": null}], "kinderen": []}]}]}, {"topic": "Sarcasm", "href": "../../nave/s/#t-sarcasm", "kinderen": [{"label": "Instances Of", "href": "../../nave/s/?hl=2Sam.6.21#i17878", "refs": [], "kinderen": [{"label": "David' s reply to Michal' s irony", "href": "../../nave/s/?hl=2Sam.6.21#i17889", "refs": [{"disp": "2 Sam 6:21", "href": "../../2-samuel/6/#v21", "ref": "2 Sam 6:21", "svLabel": null}], "kinderen": []}]}]}, {"topic": "Thankfulness", "href": "../../nave/t/#t-thankfulness", "kinderen": [{"label": "To God, Instances Of", "href": "../../nave/t/?hl=2Sam.6.21#i20475", "refs": [], "kinderen": [{"label": "Of David", "href": "../../nave/t/?hl=2Sam.6.21#i20494", "refs": [{"disp": "2 Sam 6:21", "href": "../../2-samuel/6/#v21", "ref": "2 Sam 6:21", "svLabel": null}], "kinderen": []}]}]}]}}, "extern": {"Joz 3:3": "En zij geboden het volk: Wanneer u de ark van het verbond van de HEERE, uw God, ziet, en de Levitische priesters die dragende, verreis dan ook u van uw plaats, en volg haar na;", "Ps 132:18": "Ik zal zijn vijanden met schaamte bekleden; maar op hem zal zijn kroon bloeien.", "Pred 9:10": "Alles wat uw hand vindt om te doen, doe dat met al uw kracht; want er is geen werk, geen overleg, geen kennis en geen wijsheid in het graf, waar u heengaat.", "Jer 4:4": "Besnijd u voor de HEERE en doe de voorhuiden van uw hart weg, mannen van Juda en inwoners van Jeruzalem! Anders zal Mijn grimmigheid uitvaren als een vuur, en branden zodat niemand het kan blussen, vanwege de slechtheid van uw daden.", "1 Sam 5:11": "En zij zonden heen, en verzamelden alle vorsten van de Filistijnen, en zeiden: Zend de ark van de God van Israël heen, dat die terugkeert naar haar plaats, opdat zij mij en mijn volk niet doodt; want er was een dodelijke kwelling in de hele stad, en de hand van God was daar zeer zwaar.", "Num 17:4": "En u zult ze wegleggen in de tent van de samenkomst, voor de getuigenis, waar Ik met u samenkomen zal.", "Jes 53:2": "Want Hij is als een jonge loot voor Zijn aangezicht opgeschoten, en als een wortel uit een dorre aarde; Hij had geen gedaante en geen heerlijkheid; als wij Hem aanzagen, was er geen gestalte dat wij Hem begeerd zouden hebben.", "Ezech 10:18": "Toen ging de heerlijkheid van de HEERE weg van boven de drempel van het huis, en bleef staan boven de cherubs.", "2 Kron 6:3": "Daarna wendde de koning zijn gezicht om, en zegende de gehele gemeente van Israël; en de gehele gemeente van Israël stond.", "Hos 9:2": "De dorsvloer en de wijnkuip zullen hen niet voeden, en de most zal hen bedriegen.", "1 Sam 28:18": "Zoals u naar de stem van de HEERE niet geluisterd hebt, en de gloed van Zijn toorn niet uitgevoerd hebt tegen Amalek; daarom heeft de HEERE u deze zaak aangedaan op deze dag.", "Jer 51:45": "Ga uit, Mijn volk, uit haar midden, en red ieder zijn ziel, vanwege de gloed van de toorn van de HEERE.", "Jer 10:10": "Maar de HEERE God is de Waarheid, Hij is de levende God, en een eeuwige Koning; van Zijn verbolgenheid beeft de aarde, en de heidenen kunnen Zijn gramschap niet verdragen.", "Jer 3:12": "Ga heen, en roep deze woorden uit naar het noorden, en zeg: Bekeer u, afgekeerd Israël! spreekt de HEERE, dan zal Ik Mijn toorn niet op u laten vallen; want Ik ben goedertieren, spreekt de HEERE. Ik zal de toorn niet voor eeuwig behouden.", "1 Kron 11:5": "En de inwoners van Jebus zeiden tegen David: U zult hier niet binnenkomen. David veroverde toch de burcht Sion, dat is de stad van David.", "Rom 1:18": "Want de toorn van God wordt geopenbaard van de hemel over alle goddeloosheid en ongerechtigheid van de mensen, die de waarheid in ongerechtigheid ten onder houden.", "1 Kron 15:24": "En Sebanja, en Josafat, en Nethaneel, en Amasai, en Zecharja, en Benaja, en Eliëzer, de priesters, bliezen op trompetten voor de ark van God; en Obed-edom en Jehia waren poortwachters van de ark.", "Dan 3:5": "Op het moment dat u het geluid zult horen van de hoorn, de pijp, de citer, de vedel, de psalters, het akkoordgezang, en allerlei soorten muziek, dan zult u neervallen en aanbidden het gouden beeld, dat de koning Nebukadnezar heeft opgericht;", "Num 4:20": "Maar zij zullen niet binnenkomen om te kijken wanneer men het heiligdom inpakt, opdat zij niet sterven.", "Ps 144:9": "O God, ik zal U een nieuw lied zingen; met de luit en het tiensnarig instrument zal ik U lofzingen.", "Mark 14:51": "En een zekere jongeman volgde Hem, gekleed in een linnen doek over zijn naakte lichaam, en de jongemannen grepen hem.", "Joh 2:3": "En toen de wijn ontbrak, zei de moeder van Jezus tegen Hem: Zij hebben geen wijn.", "Jer 7:20": "Daarom zegt de Heere HEERE zo: Zie, Mijn toorn en Mijn grimmigheid zal uitgestort worden over deze plaats, over de mensen en over de dieren, en over de bomen van het veld, en over de vrucht van het aardrijk; en het zal branden, en niet uitgeblust worden.", "Num 7:9": "Maar aan de zonen van Kohath gaf hij niets; want de dienst van de heilige dingen die op hen rustte, moesten zij op de schouders dragen.", "Jes 54:5": "Want uw Maker is uw Man, HEERE van de heerscharen is Zijn Naam; en de Heilige van Israël is uw Verlosser; Hij zal de God van de hele aardbodem genoemd worden.", "Klaagl 4:11": "Caph. De HEERE heeft Zijn grimmigheid volbracht, Hij heeft de gloed van Zijn toorn uitgestort; en Hij heeft in Sion een vuur aangestoken, dat haar fundamenten verteerd heeft.", "2 Sam 6:12-15": "Toen berichtte men aan koning David: De HEERE heeft het huis van Obed-edom, en alles wat hij heeft, gezegend om de ark van God. Zo ging David heen en haalde de ark van God uit het huis van Obed-edom naar de stad van David, met vreugde. En het gebeurde, toen zij die de ark van de HEERE droegen, zes treden voortgegaan waren, dat hij ossen en gemest vee offerde. En David huppelde met alle macht voor het aangezicht van de HEERE; en David was omgord met een linnen lijfrok.", "1 Kron 15:26": "Zo gebeurde het, doordat God de Levieten hielp die de ark van het verbond van de HEERE droegen, dat zij zeven jonge stieren en zeven rammen offerden.", "Ps 106:23": "Daarom zei Hij dat Hij hen zou verdelgen, ware het niet dat Mozes, Zijn uitverkorene, in de scheur voor Zijn aangezicht gestaan had, om Zijn grimmigheid af te keren, zodat Hij hen niet verdierf.", "Jona 4:1": "Dit vond Jona heel erg vervelend, en zijn woede laaide op.", "2 Kron 30:19": "die zijn hele hart erop gericht heeft, om God, de HEERE, de God van zijn vaderen, te zoeken, ook al is dat niet naar de reinheid van het heiligdom.", "Ex 30:36": "En daarvan moet u een deel heel fijn stoten, en daarvan moet u leggen vóór de getuigenis, in de tent van de samenkomst, waar Ik tot u komen zal; het zal voor u allerheiligst zijn.", "Ps 78:21": "Daarom hoorde de HEERE, en werd verbolgen; en een vuur werd ontstoken tegen Jakob, en ook toorn ging op tegen Israël;", "Dan 3:7": "Daarom, op dat moment, toen al die volken het geluid hoorden van de hoorn, de pijp, de citer, de vedel, de psalters, en allerlei soorten muziek, vielen alle volken, naties en tongen neer en aanbaden het gouden beeld, dat de koning Nebukadnezar had opgericht.", "Deut 6:5": "Zo zult u de HEERE, uw God, liefhebben, met uw hele hart, en met uw hele ziel, en met al uw kracht.", "Kol 3:23": "En alles wat u doet, doe dat van harte, als voor de Heere en niet voor de mensen;", "Jes 9:18": "Vanwege de verbolgenheid van de HEERE van de heerscharen, zal het land verduisterd worden; en het volk zal zijn als een voedsel van het vuur: de een zal de ander niet ontzien.", "1 Kron 16:3": "En hij deelde ieder in Israël, van de man tot de vrouw, ieder een bol van het brood, en een goed stuk vlees, en een fles wijn.", "1 Kon 8:5": "De koning Salomo nu en de hele gemeente van Israël, die bij hem vergaderd waren, waren met hem voor de ark, terwijl zij schapen en runderen offerden, die vanwege de menigte niet te tellen en niet te berekenen waren.", "Job 25:6": "Hoeveel te minder de mens, die een made is, en het mensenkind, die een worm is!", "1 Sam 6:3": "Zij dan zeiden: Als u de ark van de God van Israël wegzendt, zend haar niet leeg weg, maar geef Hem in elk geval een schuldoffer terug; dan zult u genezen worden, en aan u zal bekend worden waarom Zijn hand niet van u afwijkt.", "1 Kon 8:66": "Op de achtste dag liet hij het volk gaan, en zij zegenden de koning; daarna gingen zij naar hun tenten, blij en welgemoed vanwege al het goede, dat de HEERE aan David, Zijn dienaar, en aan Israël, Zijn volk, gedaan had.", "2 Sam 6:3-6": "En zij zetten de ark van God op een nieuwe wagen, en haalden die uit het huis van Abinadab, dat op een heuvel is; en Uza en Ahio, zonen van Abinadab, leidden de nieuwe wagen. Toen zij hem nu uit het huis van Abinadab, dat op de heuvel is, met de ark van God, wegvoerden, ging Ahio voor de ark uit. En David en het hele huis van Israël speelden voor het aangezicht van de HEERE, met allerlei snarenspel van dennenhout, met harpen, en met luiten, en met trommels, ook met schellen, en met cimbalen.", "Openb 16:19": "En de grote stad werd in drie delen gescheurd, en de steden van de heidenvolken vielen; en aan het grote Babylon werd gedacht voor God, om haar de drinkbeker te geven van de wijn van de toorn van Zijn gramschap.", "1 Kron 13:6-8": "Toen trok David op met heel Israël naar Baäla, dat is Kirjath-jearim, dat in Juda ligt, om vandaar de ark van God op te halen, van de HEERE, Die tussen de cherubs woont, waar de Naam wordt aangeroepen. En zij voerden de ark van God op een nieuwe wagen uit het huis van Abinadab. Uza en Ahio leidden de wagen. En David en heel Israël speelden voor het aangezicht van God met alle kracht, zowel met liederen, als met harpen, en met luiten, en met trommels, en met cimbalen, en met trompetten.", "Num 10:1-10": "Verder sprak de HEERE tot Mozes en zei: Maak u twee zilveren trompetten; van dicht werk zult u ze maken; en zij zullen u zijn tot de heilige samenkomst en tot het optrekken van de legers. Als zij daarmee blazen zullen, dan zal de hele vergadering tot u verzameld worden, aan de deur van de tent der samenkomst.", "Klaagl 2:1": "Aleph. Hoe heeft de Heere de dochter Sion in Zijn toorn bewolkt? Hij heeft de heerlijkheid van Israël van de hemel op de aarde neergeworpen; en Hij heeft aan de voetbank van Zijn voeten niet gedacht in de dag van Zijn toorn.", "1 Kron 13:9": "Toen zij bij de dorsvloer van Chidon gekomen waren, strekte Uza zijn hand uit om de ark vast te houden, want de runderen struikelden.", "Job 25:5": "Zie, zelfs de maan geeft geen schijnsel, en de sterren zijn niet zuiver in Zijn ogen.", "Jer 30:24": "De gloed van de toorn van de HEERE zal zich niet afwenden, totdat Hij het gedaan heeft, en totdat Hij tot stand gebracht heeft de gedachten van Zijn hart; in het laatste van de dagen zult u daarop letten.", "Ps 90:11": "Wie kent de sterkte van de toorn van U, en Uw verbolgenheid, naarmate U te vrezen bent?", "1 Kron 15:29": "Het gebeurde nu, toen de ark van het verbond van de HEERE tot aan de stad van David gekomen was, dat Michal, de dochter van Saul, door een venster keek, en koning David zag, springend en spelend; toen verachtte zij hem in haar hart.", "2 Sam 7:2": "Dat de koning zei tegen de profeet Nathan: Zie toch, ik woon in een huis van cederhout, en de ark van God woont in het midden van de tentkleden.", "Ps 149:3": "Laat hen Zijn Naam loven met dans; laat hen Hem psalmzingen met trommel en harp.", "Joz 15:60": "Kirjath-baal, dat is Kirjath-jearim, en Rabba; twee steden en haar dorpen.", "Jes 28:27": "Want men dorst de wikken niet met de dorswagen, en men laat het wagenrad niet rondom over het komijn gaan; maar de wikken slaat men uit met een staf, en het komijn met een stok;", "Jes 9:20": "Manasse Efraïm, en Efraïm Manasse, en zij zullen samen tegen Juda zijn. Om dit alles keert Zijn toorn zich niet af, maar Zijn hand is nog uitgestrekt.", "1 Sam 30:16": "En hij leidde hem naar beneden, en zie, zij lagen verspreid over het hele land, etend, en drinkend, en dansend, vanwege al de grote buit die zij genomen hadden uit het land van de Filistijnen, en uit het land van Juda.", "2 Sam 6:6-8": "Toen zij nu kwamen tot aan de dorsvloer van Nachon, strekte Uza zijn hand uit naar de ark van God, en hield die vast, want de runderen struikelden. Toen ontstak de toorn van de HEERE tegen Uza, en God sloeg hem daar, om deze onbedachtzaamheid; en hij stierf daar bij de ark van God. En David werd toornig, omdat de HEERE een scheur gescheurd had aan Uza; en hij noemde die plaats Perez-uza, tot op deze dag.", "1 Sam 7:1": "Toen kwamen de mannen van Kirjath-jearim, en haalden de ark van de HEERE op, en zij brachten haar in het huis van Abinadab, op de heuvel; en zij heiligden zijn zoon Eleazar, om de ark van de HEERE te bewaren.", "2 Sam 6:12-16": "Toen berichtte men aan koning David: De HEERE heeft het huis van Obed-edom, en alles wat hij heeft, gezegend om de ark van God. Zo ging David heen en haalde de ark van God uit het huis van Obed-edom naar de stad van David, met vreugde. En het gebeurde, toen zij die de ark van de HEERE droegen, zes treden voortgegaan waren, dat hij ossen en gemest vee offerde. En David huppelde met alle macht voor het aangezicht van de HEERE; en David was omgord met een linnen lijfrok.", "Hos 13:11": "Ik gaf u een koning in Mijn toorn en nam hem weg in Mijn woede.", "Lev 16:2": "De HEERE dan zei tegen Mozes: Spreek tot uw broeder Aäron, dat hij niet op elk tijdstip het heilige binnengaat, binnen het voorhangsel, voor het verzoendeksel dat op de ark is, opdat hij niet sterft; want Ik verschijn in een wolk op het verzoendeksel.", "1 Kron 13:12": "En David vreesde de HEERE op die dag, en zei: Hoe zal ik de ark van God tot mij brengen?", "Deut 9:18-20": "En ik wierp mij neer voor het aangezicht van de HEERE, zoals de eerste keer, veertig dagen en veertig nachten; ik at geen brood, en dronk geen water; om al uw zonde, die u had gezondigd door te doen wat kwaad is in de ogen van de HEERE, om Hem tot toorn te verwekken. Want ik vreesde vanwege de toorn en de grimmigheid waarmee de HEERE zeer op u vertoornd was, om u te verdelgen; toch verhoorde de HEERE mij ook op dat moment. Ook vertoornde de HEERE Zich zeer tegen Aäron, om hem te verdelgen; toch bad ik ook op datzelfde tijdstip voor Aäron.", "Richt 10:7": "Toen ontstak de toorn van de HEERE tegen Israël; en Hij verkocht hen in de hand van de Filistijnen en in de hand van de Ammonieten.", "Ps 69:8": "Want om Uwentwil draag ik smaad; schande heeft mijn gezicht bedekt.", "1 Kron 16:2": "Toen David het brandoffer en de dankoffers geëindigd had te offeren, zegende hij het volk in de Naam van de HEERE.", "Ps 68:26-28": "De zangers gingen voorop, de speellieden erachteraan, in het midden de trommelende meisjes. Looft God in de gemeenten, de Heere, u die uit de bron van Israël bent! Daar is Benjamin de kleine, die over hen heerste, de vorsten van Juda, met hun vergadering, de vorsten van Zebulon, de vorsten van Naftali.", "Jer 23:20": "De toorn van de HEERE zal zich niet afwenden, totdat Hij het zal hebben gedaan, en totdat Hij de gedachten van Zijn hart tot stand zal hebben gebracht; in de laatste dagen zult u dat met verstand inzien.", "1 Tim 1:15": "Dit is een betrouwbaar woord, en alle aanneming waard, dat Christus Jezus in de wereld gekomen is om de zondaars zalig te maken, van wie ik de voornaamste ben.", "Richt 6:37": "zie, ik zal een wollen vlies op de dorsvloer leggen; als er dauw op het vlies alleen zal zijn, en droogte op de hele aarde, dan zal ik weten dat U Israël door mijn hand zult verlossen, zoals U gesproken hebt.", "1 Kron 13:13": "Daarom liet David de ark niet tot zich brengen in de stad van David, maar liet haar afwijken naar het huis van Obed-edom, de Gethiet.", "1 Kon 8:62-65": "En de koning, en heel Israël met hem, offerden slachtoffers voor het aangezicht van de HEERE. En Salomo offerde als dankoffer, dat hij de HEERE offerde, tweeëntwintigduizend runderen, en honderdtwintigduizend schapen. Zo hebben zij het huis van de HEERE ingewijd, de koning en al de kinderen van Israël. Op diezelfde dag heiligde de koning het middelste van de voorhof, dat voor het huis van de HEERE was, omdat hij daar het brandoffer en het spijsoffer bereid had, alsook het vet van de dankoffers; want het koperen altaar, dat voor het aangezicht van de HEERE was, was te klein, om de brandoffers, en de spijsoffers, en het vet van de dankoffers te bevatten.", "Hos 11:9": "Ik zal de gloed van Mijn toorn niet uitvoeren; Ik zal niet terugkeren om Efraïm te verderven; want Ik ben God en geen mens, de Heilige in uw midden, en Ik zal niet in de stad komen.", "2 Kron 30:18": "Want een menigte van het volk, velen uit Efraïm en Manasse, Issaschar en Zebulon, hadden zich niet gereinigd, maar aten het pascha, niet zoals geschreven is. Doch Hizkia bad voor hen, en zei: De HEERE, die goed is, doe verzoening voor ieder,", "1 Sam 4:6": "Toen de Filistijnen het geluid van dat gejuich hoorden, zeiden zij: Wat betekent dit grote gejuich in het leger van de Hebreeën? Toen begrepen zij dat de ark van de HEERE in het leger gekomen was.", "1 Kron 25:1": "David, alsook de leiders van het leger, wees af voor de dienst enkele van de kinderen van Asaf, en van Heman, en van Jeduthun, die met harpen, met luiten en met cimbalen zouden profeteren; en zij die onder hen geteld werden, waren mannen die bekwaam waren tot het werk van hun dienst.", "Num 17:12": "Toen spraken de kinderen van Israël tot Mozes en zeiden: Zie, wij geven de geest, wij vergaan, wij allen vergaan!", "1 Sam 15:28": "Toen zei Samuël tegen hem: De HEERE heeft heden het koninkrijk van Israël van u afgescheurd, en heeft het aan uw naaste gegeven, die beter is dan u.", "Num 7:3-8": "En zij brachten hun offergave voor het aangezicht van de HEERE: zes overdekte wagens en twaalf runderen; een wagen voor twee leiders, en een os voor ieder een; en zij brachten ze voor de tabernakel. En de HEERE sprak tot Mozes en zei: Neem ze van hen aan, opdat zij zijn om de dienst van de tent van de samenkomst te verrichten; en u zult ze aan de Levieten geven, ieder naar zijn dienst.", "Ruth 3:2-14": "Nu dan, is Boaz, met wiens dienstmeisjes u geweest bent, niet van onze bloedverwantschap? Zie, hij zal deze nacht gerst wannen op de dorsvloer. Was u dan, en zalf u, en trek uw kleren aan, en ga naar de dorsvloer; maar maak u aan de man niet bekend, totdat hij klaar is met eten en drinken. En het zal gebeuren, als hij neerligt, dat u de plaats zult merken waar hij zal neergelegen zijn; ga dan naar binnen, en sla zijn voetdeksel open, en ga liggen; dan zal hij u vertellen wat u doen moet.", "Gen 39:5": "En het gebeurde vanaf toen, dat hij hem aangesteld had over zijn huis en over alles wat hij had, dat de HEERE het huis van de Egyptenaar zegende, om Jozefs wil; ja, de zegen van de HEERE was op alles wat hij had, in het huis en op het veld.", "1 Petr 5:6": "Verneder u dan onder de krachtige hand van God, opdat Hij u verhoogt op Zijn tijd.", "Ps 116:10": "Ik heb geloofd, daarom sprak ik; ik ben zeer bedrukt geweest.", "Openb 14:10": "die zal ook drinken uit de wijn van de toorn van God, die onvermengd ingeschonken is in de drinkbeker van Zijn toorn; en hij zal gepijnigd worden met vuur en zwavel voor de heilige engelen en voor het Lam.", "Ps 89:20": "Toen hebt Gij in een gezicht gesproken van Uw heilige, en gezegd: Ik heb hulp besteld bij een held; Ik heb een verkorene uit het volk verhoogd.", "Fil 2:7": "Maar heeft Zichzelf ontledigd door de gestalte van een dienstknecht aan te nemen, en is de mensen gelijk geworden;", "1 Sam 19:24": "En hij trok zelf ook zijn kleren uit, en hij profeteerde zelf ook, voor het aangezicht van Samuël; en hij viel naakt neer, diezelfde hele dag en de hele nacht. Daarom zegt men: Is Saul ook onder de profeten?", "1 Kron 15:2": "Toen zei David: Niemand mag de ark van God dragen, dan de Levieten; want die heeft de HEERE uitgekozen, om de ark van God te dragen, en om Hem te dienen tot in eeuwigheid.", "1 Kron 16:5": "Asaf was het hoofd, en Zecharja de tweede na hem; Jeïel, en Semiramoth, en Jehiël, en Mattithja, en Eliab, en Benaja, en Obed-Edom, en Jeïel, met instrumenten van luiten en met harpen; en Asaf liet zich horen met cimbalen;", "Matt 22:13": "Toen zei de koning tegen de dienaars: Bind zijn handen en voeten, neem hem mee en werp hem in de buitenste duisternis; daar zal het huilen zijn en het geknars van de tanden.", "Ex 33:5": "En de HEERE had tot Mozes gezegd: Zeg tegen de Israëlieten: U bent een hardnekkig volk; in één ogenblik zou Ik in uw midden optrekken, en u vernietigen; doch nu, leg uw sieraad van u af, en Ik zal weten wat Ik u doen zal.", "Rom 2:5": "Maar naar uw hardheid en onbekeerlijk hart, verzamelt u voor uzelf toorn als een schat, voor de dag van de toorn en de openbaring van het rechtvaardig oordeel van God.", "Ex 30:6": "En u moet het zetten vóór het voorhangsel dat vóór de ark van de getuigenis zal zijn; vóór het verzoendeksel, dat boven de getuigenis zal zijn, waar Ik met u samen zal komen.", "Joh 21:7": "De discipel dan, die Jezus liefhad, zei tegen Petrus: Het is de Heere! Toen Simon Petrus dan hoorde dat het de Heere was, deed hij zijn bovenkleed om (want hij was naakt), en wierp zichzelf in de zee.", "2 Kron 35:12": "En zij namen het brandoffer daar af, opdat zij het naar de verdelingen van de vaderlijke huizen, aan het volk geven mochten, om de HEERE te offeren, zoals geschreven is in het boek van Mozes; en zo ook met de runderen.", "Fil 2:8": "En in gedaante gevonden als een mens, heeft Hij Zichzelf vernederd, gehoorzaam geworden tot de dood, ja, de dood van het kruis.", "Job 39:37": "Zie, ik ben te gering; wat zou ik U antwoorden? Ik leg mijn hand op mijn mond.", "Ps 69:25": "Stort over hen Uw gramschap uit; en de gloed van Uw toorn grijpt hen aan.", "Ps 78:49": "Hij zond onder hen de gloed van Zijn toorn, verbolgenheid, en verstoordheid, en benauwdheid, met uitzending van boden van veel kwaad.", "2 Sam 6:12-19": "Toen berichtte men aan koning David: De HEERE heeft het huis van Obed-edom, en alles wat hij heeft, gezegend om de ark van God. Zo ging David heen en haalde de ark van God uit het huis van Obed-edom naar de stad van David, met vreugde. En het gebeurde, toen zij die de ark van de HEERE droegen, zes treden voortgegaan waren, dat hij ossen en gemest vee offerde. En David huppelde met alle macht voor het aangezicht van de HEERE; en David was omgord met een linnen lijfrok.", "Ps 92:4": "Op het tiensnarig instrument en op de luit, met een voorbedacht lied op de harp.", "Num 25:11": "Pinehas, de zoon van Eleazar, de zoon van Aäron, de priester, heeft Mijn grimmigheid van over de kinderen van Israël afgewend, omdat hij Mijn ijver geijverd heeft in hun midden, zodat Ik de kinderen van Israël in Mijn ijver niet vernietigd heb.", "Ps 68:25-28": "O God! Zij hebben Uw gangen gezien, de gangen van mijn God, mijn Koning, in het heiligdom. De zangers gingen voorop, de speellieden erachteraan, in het midden de trommelende meisjes. Looft God in de gemeenten, de Heere, u die uit de bron van Israël bent!", "Hebr 9:5": "En boven over de ark waren de cherubs der heerlijkheid, die het verzoendeksel beschaduwden; van welke dingen wij nu niet stuk voor stuk zullen spreken.", "2 Kron 29:25": "En hij stelde de Levieten aan in het huis van de HEERE, met cimbalen, met luiten en harpen, naar het gebod van David, en van Gad, de ziener van de koning, en van Nathan, de profeet; want dit gebod kwam van de hand van de HEERE, door de hand van Zijn profeten.", "1 Petr 3:6": "zoals Sara Abraham gehoorzaam is geweest, hem heer noemend, van wie u dochters geworden bent, als u goed doet en voor geen enkele verschrikking bang bent.", "1 Sam 10:5": "Daarna zult u komen op de heuvel van God, waar de bezettingen van de Filistijnen zijn; en het zal gebeuren, als u daar in de stad komt, dat u een groep profeten zult ontmoeten, die van de hoogte afkomen, met voor zich uit luiten, en trommels, en pijpen, en harpen, en zij zullen profeteren.", "1 Sam 6:20": "Toen zeiden de mensen van Beth-Semes: Wie zou kunnen bestaan voor het aangezicht van de HEERE, deze heilige God? En naar wie zal Hij van ons wegtrekken?", "Ps 132:8": "Sta op, HEERE, tot Uw rust, U en de ark van Uw sterkte!", "Jes 13:9": "Zie, de dag van de HEERE komt, gruwelijk, met verbolgenheid en hevige toorn, om het land tot verwoesting te stellen, en de zondaars daaruit te verdelgen.", "Ps 116:11": "Ik zei in mijn haast: Alle mensen zijn leugenaars.", "1 Kron 13:5": "David dan verzamelde heel Israël, van het Egyptische Sichor af, tot waar men bij Hamath komt, om de ark van God te brengen vanuit Kirjath-jearim.", "Jer 25:37": "Want de landerijen van de vrede zullen uitgeroeid worden, vanwege de gloed van de toorn van de HEERE.", "Ezra 3:11": "En zij zongen bij beurten, om de HEERE te loven en te danken, omdat Hij goed is en Zijn goedertierenheid tot in eeuwigheid is over Israël. En heel het volk juichte met groot gejuich, toen men de HEERE loofde vanwege de grondlegging van het huis van de HEERE.", "1 Kron 13:5-8": "David dan verzamelde heel Israël, van het Egyptische Sichor af, tot waar men bij Hamath komt, om de ark van God te brengen vanuit Kirjath-jearim. Toen trok David op met heel Israël naar Baäla, dat is Kirjath-jearim, dat in Juda ligt, om vandaar de ark van God op te halen, van de HEERE, Die tussen de cherubs woont, waar de Naam wordt aangeroepen. En zij voerden de ark van God op een nieuwe wagen uit het huis van Abinadab. Uza en Ahio leidden de wagen.", "1 Kron 15:27": "David nu was gekleed met een mantel van fijn linnen; ook alle Levieten die de ark droegen, en de zangers, en Chenanja, de leider van het opheffen van de zang; ook had David een lijfrok van linnen aan.", "Ps 101:2": "Ik zal verstandig handelen op de oprechte weg; wanneer zult U tot mij komen? Ik zal in het midden van mijn huis wandelen, in oprechtheid van mijn hart.", "Dan 9:16": "O Heere! naar al Uw gerechtigheden, laat toch Uw toorn en Uw grimmigheid afgekeerd worden van Uw stad Jeruzalem, Uw heilige berg; want om onze zonden en om de ongerechtigheden van onze vaderen zijn Jeruzalem en Uw volk tot smaad bij allen die rondom ons zijn.", "1 Sam 7:2": "En het gebeurde, vanaf die dag, dat de ark van de Heere in Kirjath-jearim bleef, en de tijd werd lang; het werden twintig jaar; en heel het huis van Israël klaagde de HEERE achterna.", "2 Sam 5:7": "Maar David nam de burcht Sion in; dat is de stad van David.", "1 Sam 4:22": "En zij zei: De eer is gevankelijk weggevoerd uit Israël, want de ark van God is genomen.", "1 Sam 1:6-8": "En haar tegenpartij tergde haar ook met terging, om haar te ergeren, omdat de HEERE haar baarmoeder toegesloten had. En zo deed hij jaar op jaar; van toen af dat zij opging naar het huis van de HEERE, zo tergde zij haar steeds; daarom weende zij en at niet. Toen zei Elkana, haar man: Hanna, waarom weent u, en waarom eet u niet, en waarom is uw hart bedroefd? Ben ik u niet beter dan tien zonen?", "Mark 14:52": "Maar hij liet het linnen kleed achter, en vluchtte naakt van hen weg.", "1 Kron 15:16": "En David zei tegen de leiders van de Levieten, dat zij hun broeders, de zangers, moesten aanstellen met muziekinstrumenten, met luiten, en harpen, en cimbalen, zodat zij zich lieten horen, terwijl zij de stem verhieven met blijdschap.", "1 Kron 13:6": "Toen trok David op met heel Israël naar Baäla, dat is Kirjath-jearim, dat in Juda ligt, om vandaar de ark van God op te halen, van de HEERE, Die tussen de cherubs woont, waar de Naam wordt aangeroepen.", "Jes 63:3-6": "Ik heb de pers alleen getreden, en er was niemand van de volken met Mij; en Ik heb hen getreden in Mijn toorn, en heb hen vertrapt in Mijn grimmigheid; en hun bloed is gesprenkeld op Mijn kleren, en heel Mijn gewaad heb Ik bezoedeld. Want de dag van de wraak was in Mijn hart, en het jaar van Mijn verlosten was gekomen. En Ik zag toe, en er was niemand die hielp; en Ik ontzette Mij, en er was niemand die ondersteunde; daarom heeft Mijn arm Mij heil beschikt, en Mijn grimmigheid heeft Mij ondersteund,", "Ps 57:9": "Ontwaak, mijn eer! ontwaak, luit en harp! ik zal in de dageraad ontwaken.", "Gen 32:10": "Ik ben geringer dan al de weldaden en al de trouw die U aan Uw knecht bewezen hebt; want met mijn staf ben ik deze Jordaan overgestoken, en nu ben ik tot twee legers geworden!", "Openb 6:16": "En zeiden tot de bergen en tot de steenrotsen: Valt op ons, en verbergt ons van het aangezicht van Hem Die op de troon zit, en van de toorn van het Lam.", "1 Kron 15:13": "Want omdat u dit de eerste keer niet deed, heeft de HEERE, onze God, onder ons een scheur gemaakt, omdat wij Hem niet gezocht hebben naar het recht.", "1 Kron 16:43": "Zo ging het hele volk heen, ieder naar zijn huis; en David keerde zich om, om zijn huis te gaan zegenen.", "1 Petr 1:12": "Aan hen is geopenbaard dat zij niet zichzelf, maar ons dienden met deze dingen, die u nu aangekondigd zijn door hen die u het Evangelie verkondigd hebben door de Heilige Geest, Die van de hemel gezonden is; dingen waar de engelen graag een blik in willen werpen.", "1 Kron 25:6": "Dezen waren allemaal onder leiding van hun vader gesteld tot het gezang van het huis van de HEERE, op cimbalen, luiten, en harpen, tot de dienst van het huis van God, onder leiding van de koning, van Asaf, Jeduthun, en van Heman.", "Luk 15:23-25": "en breng het gemeste kalf, en slacht het; en laten wij eten en vrolijk zijn. Want deze zoon van mij was dood, en is weer levend geworden; en hij was verloren, en is gevonden! En zij begonnen vrolijk te zijn. En zijn oudste zoon was op het veld; en toen hij kwam en het huis naderde, hoorde hij het gezang en het gedans,", "1 Sam 2:28": "En Ik heb hem uit alle stammen van Israël voor Mij tot priester verkozen, om te offeren op Mijn altaar, om het reukwerk aan te steken, om de efod voor Mijn aangezicht te dragen; en heb aan het huis van uw vader al de vuuroffers van de kinderen van Israël gegeven.", "1 Sam 21:11": "Doch de knechten van Achis zeiden tegen hem: Is dit niet David, de koning van het land? Zong men niet van hem in de reidansen, en zei: Saul heeft zijn duizenden verslagen, maar David zijn tienduizenden?", "Richt 3:8": "Toen ontstak de toorn van de HEERE tegen Israël; en Hij verkocht hen in de hand van Cuschan-Rischataïm, koning van Mesopotamië; en de kinderen van Israël dienden Cuschan-Rischataïm acht jaren.", "2 Sam 4:3": "En de Beerothieten waren gevlucht naar Gitthaïm, en waren daar vreemdelingen tot op deze dag.", "1 Sam 16:1": "Toen zei de HEERE tegen Samuël: Hoe lang draagt u leed om Saul, die Ik toch verworpen heb, dat hij geen koning meer zal zijn over Israël? Vul uw hoorn met olie, en ga op weg; Ik zal u zenden naar Isaï, de Bethlehemiet; want Ik heb Mij een koning uitgekozen onder zijn zonen.", "Hand 13:22": "En nadat Hij hem afgezet had, verwekte Hij hun David tot koning; aan wie Hij ook getuigenis gaf, en zei: Ik heb David gevonden, de zoon van Isaï, een man naar Mijn hart, die al Mijn wil zal doen.", "2 Kon 22:13": "Ga heen, vraag de HEERE voor mij, en voor het volk, en voor heel Juda, over de woorden van dit boek dat gevonden is; want de grimmigheid van de HEERE is groot, die tegen ons ontstoken is, omdat onze vaderen niet geluisterd hebben naar de woorden van dit boek, om te doen naar alles wat voor ons geschreven is.", "2 Sam 6:1-11": "Daarna verzamelde David opnieuw alle uitgelezen mannen in Israël, dertigduizend. En David maakte zich op en ging heen met al het volk dat bij hem was, van Baälim-juda, om vandaar de ark van God op te brengen, bij wie de Naam wordt aangeroepen, de Naam van de HEERE van de heerscharen, Die daarop woont tussen de cherubs. En zij zetten de ark van God op een nieuwe wagen, en haalden die uit het huis van Abinadab, dat op een heuvel is; en Uza en Ahio, zonen van Abinadab, leidden de nieuwe wagen.", "Ps 69:8-10": "Want om Uwentwil draag ik smaad; schande heeft mijn gezicht bedekt. Ik ben mijn broeders vreemd geworden, en onbekend aan de kinderen van mijn moeder. Want de ijver voor Uw huis heeft mij verteerd; en de smaad van hen die U smaden, is op mij gevallen.", "Jer 25:15-17": "Want zo heeft de HEERE, de God van Israël, tot mij gezegd: Neem deze beker van de wijn van de grimmigheid van Mijn hand, en geef die te drinken aan alle volken, tot wie Ik u zend; Dat zij drinken, en beven, en dol worden, vanwege het zwaard, dat Ik onder hen zal zenden. En ik nam de beker uit de hand van de HEERE, en ik gaf te drinken aan alle volken, tot wie de HEERE mij gezonden had;", "Ps 106:29": "En zij hebben de Heere tot toorn verwekt met hun daden, zodat de plaag een inbreuk onder hen deed.", "Deut 32:21": "Zij hebben Mij tot ijver verwekt door wat geen God is; zij hebben Mij tot toorn verwekt door hun ijdelheden; Ik dan zal hen tot ijver verwekken door hen die geen volk zijn; door een dwaas volk zal Ik hen tot toorn verwekken.", "1 Kron 15:19": "De zangers nu, Heman, Asaf en Ethan, lieten zich horen met koperen cimbalen;", "1 Sam 4:17": "Toen antwoordde de brenger van de boodschap en zei: Israël is gevlucht voor de Filistijnen, en er is ook een grote nederlaag onder het volk gebeurd; bovendien zijn uw twee zonen, Hofni en Pinehas, gestorven, en de ark van God is genomen.", "1 Sam 18:6": "Het gebeurde nu, toen zij kwamen, en David terugkeerde van het verslaan van de Filistijn, dat de vrouwen uit al de steden van Israël uitgingen, met gezang en reidansen, koning Saul tegemoet, met tamboerijnen, met vreugde en met muziekinstrumenten.", "Ezech 45:17": "En het zal de vorst opgelegd zijn te offeren de brandoffers, en het spijsoffer, en het drankoffer, op de feesten, en op de nieuwe manen, en op de sabbatten, op alle vaste hoogtijden van het huis van Israël; hij zal het zondoffer, en het spijsoffer, en het brandoffer, en de dankoffers klaarmaken, om verzoening te doen voor het huis van Israël.", "Num 14:11": "En de HEERE zei tegen Mozes: Hoelang zal dit volk Mij tergen? En hoelang zullen zij niet aan Mij geloven, ondanks alle tekenen die Ik onder hen gedaan heb?", "Jer 4:26": "Ik keek, en zie, het vruchtbare land was een woestijn, en al zijn steden waren afgebroken, vanwege de HEERE, vanwege de gloed van Zijn toorn.", "Num 16:20": "En de HEERE sprak tot Mozes en tot Aäron, en zei:", "Mal 3:10": "Breng al de tienden in het schathuis, opdat er voedsel is in Mijn huis; en beproef Mij nu daarin, zegt de HEERE van de heerscharen, of Ik u dan niet zal opendoen de vensters van de hemel, en u zegen zal uitgieten, zodat er geen schuren genoeg zullen zijn.", "Ps 106:32": "Zij maakten Hem ook zeer toornig aan het twistwater, en het ging Mozes kwalijk om hunnentwil.", "2 Sam 6:21-23": "Maar David zei tegen Michal: Voor het aangezicht van de HEERE, Die mij verkozen heeft boven uw vader en boven zijn hele huis, om mij aan te stellen tot een voorganger over het volk van de HEERE, over Israël; ja, ik zal spelen voor het aangezicht van de HEERE. Ook zal ik mij nog geringer houden dan dit, en nederig zijn in mijn ogen; en met de dienstmaagden waarvan u gesproken hebt, met hen zal ik geëerd worden. Michal nu, de dochter van Saul, had geen kind, tot de dag van haar dood toe.", "Joz 7:1": "Maar de kinderen van Israël overtraden door overtreding met het verbannene; want Achan, de zoon van Charmi, de zoon van Zabdi, de zoon van Zerah, uit de stam van Juda, nam van het verbannene. Toen ontstak de toorn van de HEERE tegen de kinderen van Israël.", "Hand 5:41": "Zij dan gingen heen van voor de raad, verblijd dat zij waardig geacht waren om vanwege Zijn Naam smaad te lijden.", "1 Kron 6:31": "Dezen nu zijn het die David heeft aangesteld voor het ambt van het gezang in het huis van de HEERE, nadat de ark tot rust was gekomen.", "Jes 28:28": "Het koren voor brood moet verbrijzeld worden, maar hij dorst het niet voortdurend; noch breekt hij het met het wiel van zijn wagen, noch verbrijzelt hij het met zijn paarden.", "Joz 7:26": "En zij richtten over hem een grote steenhoop op, die er tot op deze dag nog is. Zo keerde de HEERE zich af van de gloed van Zijn toorn. Daarom noemde men de naam van die plaats het dal van Achor, tot op deze dag toe.", "Openb 5:8": "En toen Het dat boek genomen had, vielen de vier dieren en de vierentwintig oudsten voor het Lam neer, elk met een citer en gouden schalen vol reukwerk, dat zijn de gebeden van de heiligen.", "Ps 150:4": "Loof Hem met de trommel en fluit; loof Hem met snarenspel en orgel!", "Ps 78:50": "Hij baande een pad voor Zijn toorn; Hij onttrok hun ziel niet aan de dood; en hun gedierte gaf Hij over aan de pestilentie.", "1 Kor 2:14": "Maar de natuurlijke mens begrijpt niet de dingen die van de Geest van God zijn; want ze zijn hem dwaasheid, en hij kan ze niet verstaan, omdat ze geestelijk beoordeeld worden.", "2 Kron 30:27": "Toen stonden de Levitische priesters op, en zegenden het volk; en hun stem werd gehoord; want hun gebed kwam tot Zijn heilige woning in de hemel.", "1 Kon 16:2-13": "Omdat Ik u uit het stof heb verheven, en u tot een voorganger over Mijn volk Israël heb aangesteld, en u gewandeld hebt in de weg van Jerobeam, en Mijn volk Israël hebt doen zondigen, en Mij tot toorn hebt verwekt door hun zonden; Zie, zo zal Ik de nakomelingen van Baësa, en de nakomelingen van zijn huis wegdoen; en Ik zal uw huis maken zoals het huis van Jerobeam, de zoon van Nebat. Wie van Baësa in de stad sterft, zullen de honden opeten, en wie van hem in het veld sterft, zullen de vogels van de hemel opeten.", "2 Kron 1:4": "(Maar de ark van God had David opgebracht van Kirjath-jearim naar de plaats die David voor haar bereid had; want hij had voor haar een tent gespannen te Jeruzalem.)", "2 Kron 7:17": "En wat u betreft, als u voor Mijn aangezicht wandelt, zoals uw vader David gewandeld heeft, en doet naar alles wat Ik u geboden heb, en Mijn inzettingen en Mijn rechten houdt;", "2 Sam 24:25": "En David bouwde daar de HEERE een altaar, en offerde brandoffers en dankoffers. Zo werd de HEERE verbeden voor het land, en deze plaag werd van over Israël opgehouden.", "1 Kron 13:8": "En David en heel Israël speelden voor het aangezicht van God met alle kracht, zowel met liederen, als met harpen, en met luiten, en met trommels, en met cimbalen, en met trompetten.", "Num 7:89": "En toen Mozes de tent van de samenkomst inging om met Hem te spreken, hoorde hij een stem tot hem spreken, van boven het verzoendeksel dat op de ark van de getuigenis was, van tussen de twee cherubs. Zo sprak Hij tot hem.", "1 Kron 25:5": "Deze allen waren kinderen van Heman, de ziener van de koning, in de woorden van God, om de hoorn te verheffen; want God had Heman veertien zonen gegeven, en drie dochters.", "Ezra 6:16": "En de kinderen van Israël, de priesters en Levieten, en de overige kinderen van de wegvoering hielden de inwijding van dit huis van God met vreugde.", "Ps 108:3": "Ontwaak, u luit en harp! Ik zal in de dageraad ontwaken.", "Ps 24:7-10": "Heft uw hoofden op, poorten, en verhef u, eeuwige deuren, opdat de Koning der ere ingaat! Wie is de Koning der ere? De HEERE, sterk en geweldig, de HEERE, geweldig in de strijd. Heft uw hoofden op, poorten, ja, heft op, eeuwige deuren! opdat de Koning der ere ingaat!", "Ps 150:3-5": "Loof Hem met geschal van de bazuin; loof Hem met de luit en met de harp! Loof Hem met de trommel en fluit; loof Hem met snarenspel en orgel! Loof Hem met luid klinkende cimbalen; loof Hem met cimbalen van vreugdegeluid!", "Zach 12:8": "Op die dag zal de HEERE de inwoners van Jeruzalem beschutten; en wie onder hen struikelen zou, zal op die dag zijn als David; en het huis van David zal zijn als goden, als de Engel van de HEERE voor hun aangezicht.", "Matt 5:11": "Zalig bent u, als de mensen u smaden en vervolgen, en liegend allerlei kwaad tegen u spreken, omwille van Mij.", "Ps 74:1": "Een onderwijzing, voor Asaf. O God! Waarom verstoot U ons voor eeuwig? Waarom zou Uw toorn roken tegen de schapen van Uw weide?", "Neh 4:4": "Hoor, o onze God, dat wij erg veracht worden, en keer hun smaad terug op hun eigen hoofd, en geef hen over als buit in een land van gevangenschap.", "2 Sam 5:9": "Zo woonde David in de burcht en noemde die de stad van David. En David bouwde rondom, vanaf Millo naar binnen toe.", "Ex 25:22": "En daar zal Ik bij u komen, en Ik zal met u spreken van boven het verzoendeksel af, van tussen de twee cherubs die op de ark van de getuigenis zullen zijn, alles wat Ik u gebieden zal aan de kinderen van Israël.", "Jes 6:5": "Toen zei ik: Wee mij, want ik ga ten onder! Omdat ik een man van onreine lippen ben, en ik woon te midden van een volk dat onrein van lippen is; want mijn ogen hebben de Koning, de HEERE van de heerscharen, gezien.", "1 Kon 8:55": "zo stond hij, en zegende de hele gemeente van Israël, met luide stem, en zei:", "Jer 33:5": "Er zijn er wel gekomen om te strijden tegen de Chaldeeën, maar het is om die te vullen met de dode lichamen van mensen die Ik verslagen heb in Mijn toorn en in Mijn grimmigheid; en omdat Ik Mijn aangezicht van deze stad verborgen heb, vanwege al hun slechtheid.", "Jer 17:4": "Zo zult u aflaten (en dat om uzelf) van uw erfenis, die Ik u gegeven heb, en Ik zal u uw vijanden doen dienen in een land, dat u niet kent; want u hebt een vuur aangestoken in Mijn toorn, tot in eeuwigheid zal het branden.", "Jes 22:14": "Maar de HEERE van de heerscharen heeft Zich aan mijn oren geopenbaard, en zei: Zeker zal deze ongerechtigheid u niet verzoend worden, totdat u sterft! zegt de Heere, de HEERE van de heerscharen.", "1 Sam 22:18": "Toen zei de koning tegen Doeg: Wend u om, en val de priesters aan. Toen wendde Doeg, de Edomiet, zich om, en hij viel de priesters aan, en doodde op die dag vijfentachtig mannen die de linnen priesterrok droegen.", "1 Kon 8:7": "Want de cherubs spreidden hun beide vleugels uit over de plaats van de ark; en de cherubs overdekten de ark en haar draagstokken van boven.", "Lev 10:1-3": "En de zonen van Aäron, Nadab en Abihu, namen ieder zijn wierookvat en deden er vuur in, en legden er reukwerk op, en brachten vreemd vuur voor het aangezicht van de HEERE, wat Hij hun niet geboden had. Toen ging er een vuur uit van het aangezicht van de HEERE, en verteerde hen; en zij stierven voor het aangezicht van de HEERE. En Mozes zei tegen Aäron: Dit is het wat de HEERE gesproken heeft: In hen die tot Mij naderen zal Ik geheiligd worden, en voor het aangezicht van heel het volk zal Ik verheerlijkt worden. Maar Aäron zweeg stil.", "Gen 50:11": "Toen de inwoners van het land, de Kanaänieten, die rouw zagen op het plein van het doornbos, zeiden zij: Dit is een zware rouw van de Egyptenaars; daarom noemde men haar naam Abel-mizraim, dat aan de overzijde van de Jordaan is.", "Jer 21:5": "En Ik Zelf zal tegen u strijden, met een uitgestrekte hand en met een sterke arm, ja, met toorn, en met grimmigheid, en met grote verbolgenheid.", "1 Kron 11:7": "David nu woonde op de burcht; daarom noemt men die de stad van David.", "2 Sam 6:1-5": "Daarna verzamelde David opnieuw alle uitgelezen mannen in Israël, dertigduizend. En David maakte zich op en ging heen met al het volk dat bij hem was, van Baälim-juda, om vandaar de ark van God op te brengen, bij wie de Naam wordt aangeroepen, de Naam van de HEERE van de heerscharen, Die daarop woont tussen de cherubs. En zij zetten de ark van God op een nieuwe wagen, en haalden die uit het huis van Abinadab, dat op een heuvel is; en Uza en Ahio, zonen van Abinadab, leidden de nieuwe wagen.", "Jes 47:4": "Onze Verlossers Naam is HEERE van de heerscharen, de Heilige van Israël.", "1 Kon 3:14": "En als u in Mijn wegen wandelt en Mijn inzettingen en Mijn geboden onderhoudt, zoals uw vader David gewandeld heeft, dan zal Ik ook uw dagen verlengen.", "Jes 13:13": "Daarom zal Ik de hemel beroeren, en de aarde zal bewogen worden van haar plaats, vanwege de verbolgenheid van de HEERE van de heerscharen, en vanwege de dag van Zijn hevige toorn.", "Jes 57:16": "Want Ik zal niet eeuwig twisten, en Ik zal niet voortdurend toornig zijn; want de geest zou van voor Mijn aangezicht bezwijken, en de zielen die Ik gemaakt heb.", "2 Sam 3:14": "Ook zond David boden naar Isboseth, de zoon van Saul, en zei: Geef mij mijn vrouw Michal, die ik mij met honderd voorhuiden van de Filistijnen ondertrouwd heb.", "Jona 4:9": "Toen zei God tegen Jona: Is het terecht dat uw woede oplaait over de wonderboom? En hij zei: Terecht laait mijn woede op, tot de dood toe.", "2 Sam 8:11": "die de koning David ook aan de HEERE toewijdde, samen met het zilver en het goud dat hij toegewijd had van alle heidenvolken die hij zich onderworpen had;", "Num 32:13": "Zo ontstak de toorn van de HEERE tegen Israël, en Hij liet hen ronddwalen in de woestijn, veertig jaar lang, totdat heel het geslacht verteerd was dat gedaan had wat kwaad was in de ogen van de HEERE.", "Ps 150:3": "Loof Hem met geschal van de bazuin; loof Hem met de luit en met de harp!", "Jer 42:18": "Want zo zegt de HEERE van de heerscharen, de God van Israël: Zoals Mijn toorn en Mijn grimmigheid uitgestort is over de inwoners van Jeruzalem, zo zal Mijn grimmigheid over u uitgestort worden, als u in Egypte gekomen zult zijn; en u zult tot een vervloeking zijn, en tot een ontzetting, en tot een vloek, en tot smaad, en u zult deze plaats niet meer zien.", "Hebr 12:2": "Ziende op Jezus, de Leidsman en Voleinder van het geloof, Die om de vreugde die Hem voorgesteld was, het kruis heeft verdragen, en schande veracht heeft, en gezeten is aan de rechterhand van de troon van God.", "Spr 3:9": "Vereer de HEERE met uw goed, en met de eerstelingen van al uw inkomsten;", "1 Sam 19:23": "Toen ging hij daarheen naar Najoth bij Rama; en dezelfde Geest van God kwam ook op hem, en al voortgaande profeteerde hij, totdat hij in Najoth in Rama aankwam.", "1 Sam 14:18": "Toen zei Saul tegen Ahia: Breng de ark van God hierheen. Want de ark van God was op die dag bij de kinderen van Israël.", "Jes 12:1": "En diezelfde dag zult u zeggen: Ik dank U, HEERE! Dat U toornig op mij geweest bent, maar Uw toorn is afgekeerd, en U troost mij.", "1 Kron 15:25": "Het gebeurde nu, dat David en de oudsten van Israël, en de aanvoerders van de duizendtallen, heengingen, om de ark van het verbond van de HEERE op te halen, uit het huis van Obed-edom, met vreugde;", "Num 32:11": "Zeker, deze mannen die uit Egypte zijn opgetrokken, van twintig jaar oud en daarboven, zullen het land niet zien dat Ik Abraham, Izak en Jakob gezworen heb! Want zij hebben Mij niet volledig gevolgd;", "Joz 15:9": "Daarna zal deze grens zich uitstrekken van de top van de berg tot aan de waterbron Nefthoah, en uitgaan tot de steden van het gebergte Efron. Verder zal deze grens zich uitstrekken naar Baäla; dat is Kirjath-jearim.", "Hand 3:26": "God heeft, na Zijn Kind Jezus te hebben opgewekt, Hem eerst tot u gezonden, om u te zegenen, doordat Hij ieder van u afkeert van zijn slechte daden.", "2 Sam 6:14-16": "En David huppelde met alle macht voor het aangezicht van de HEERE; en David was omgord met een linnen lijfrok. Zo brachten David en het hele huis van Israël de ark van de HEERE op, met gejuich en met geluid van bazuinen. En het gebeurde, toen de ark van de HEERE in de stad van David kwam, dat Michal, de dochter van Saul, door het venster uitkeek. Toen zij nu koning David zag, springend en huppelend voor het aangezicht van de HEERE, verachtte zij hem in haar hart.", "1 Sam 5:10": "Toen zonden zij de ark van God naar Ekron; maar het gebeurde, toen de ark van God te Ekron kwam, dat die van Ekron riepen en zeiden: Zij hebben de ark van de God van Israël naar ons toe gebracht, om mij en mijn volk te doden.", "1 Kron 15:15": "En de nakomelingen van de Levieten droegen de ark van God op hun schouders, met de draagbomen die erop waren, zoals Mozes geboden had naar het woord van de HEERE.", "Num 12:9": "Zo ontstak de toorn van de HEERE tegen hen, en Hij ging weg.", "1 Kron 13:14": "Zo bleef de ark van God bij het huisgezin van Obed-edom, in zijn huis, drie maanden; en de HEERE zegende het huis van Obed-edom, en alles wat hij had.", "1 Kron 15:28": "Zo bracht heel Israël de ark van het verbond van de HEERE op, met gejuich, en met geluid van de bazuin, en met trompetten, en met cimbalen, en maakte geluid met luiten en met harpen.", "2 Kron 5:6": "De koning Salomo nu, en de hele vergadering van Israël, die bij hem verzameld waren voor de ark, offerden schapen en runderen, die vanwege de menigte niet geteld noch gerekend konden worden.", "Ps 78:38": "Doch Hij, barmhartig zijnde, verzoende de ongerechtigheid, en verdierf hen niet; maar wendde dikwijls Zijn toorn af, en wekte Zijn hele grimmigheid niet op.", "1 Kron 16:1": "Toen zij de ark van God binnenbrachten, zetten zij die in het midden van de tent die David voor haar gespannen had; en zij offerden brandoffers en dankoffers voor het aangezicht van God.", "Amos 5:23": "Doe het lawaai van uw liederen van Mij weg; ook wil Ik het spel van uw luiten niet horen.", "2 Kon 3:15": "Nu dan, brengt mij een speelman. En het gebeurde, toen de speelman op de snaren speelde, dat de hand van de HEERE op hem kwam.", "Amos 6:5": "Die bij het geschal van de luit kwinkeleren, en zichzelf instrumenten van muziek bedenken, zoals David;", "Klaagl 5:15": "De vreugde van ons hart houdt op, onze dans is in treurigheid veranderd.", "Openb 15:1": "En ik zag een ander groot en wonderlijk teken in de hemel: namelijk zeven engelen, die de zeven laatste plagen hadden; want in deze is de toorn van God geëindigd.", "Num 4:19": "Maar dit zult u voor hen doen, opdat zij leven en niet sterven, wanneer zij tot het allerheiligste naderen: Aäron en zijn zonen zullen komen, en hen ieder aanstellen over zijn dienst en zijn last.", "Jes 42:25": "Daarom heeft Hij over hen uitgestort de grimmigheid van Zijn toorn en de macht van de oorlog; en Hij heeft ze rondom in vlam gezet, doch zij merken het niet; en Hij heeft ze in brand gestoken, doch zij nemen het niet ter harte.", "Lev 9:23": "Toen ging Mozes met Aäron in de tent der samenkomst; daarna kwamen zij naar buiten, en zegenden het volk; en de heerlijkheid van de HEERE verscheen aan heel het volk.", "Mark 3:21": "En toen zijn verwanten dit hoorden, gingen zij eropuit om Hem vast te houden; want zij zeiden: Hij is buiten zichzelf.", "Jer 4:8": "Hierom, doe zakken aan, bedrijf misbaar en huil; want de gloed van de toorn van de HEERE is niet van ons afgekeerd.", "Ps 7:12": "God is een rechtvaardige Rechter, en een God, Die iedere dag toornt.", "1 Kon 11:9": "Daarom vertoornde de HEERE Zich tegen Salomo, omdat hij zijn hart van de HEERE, de God van Israël, had afgewend, Die hem tweemaal verschenen was,", "Matt 1:25": "en hij had geen gemeenschap met haar, totdat zij deze haar eerstgeboren Zoon gebaard had; en hij gaf Hem de naam JEZUS.", "2 Sam 15:19": "Toen zei de koning tegen Ithai, de Gethiet: Waarom zou u ook met ons meegaan? Keer terug, en blijf bij de koning; want u bent een vreemdeling, en bovendien bent u verbannen uit uw eigen plaats.", "1 Sam 23:1": "En men vertelde het David: Kijk, de Filistijnen strijden tegen Kehila, en zij beroven de dorsvloeren.", "Num 11:1": "En het gebeurde dat het volk zich beklaagde, en dat was kwaad in de oren van de HEERE; want de HEERE hoorde het, zodat Zijn toorn ontstak, en het vuur van de HEERE onder hen ontbrandde en verteerde hen die in het uiterste van het leger waren.", "Richt 9:4": "En zij gaven hem zeventig zilverlingen, uit het huis van Baäl-berith; en Abimelech huurde daarmee nietswaardige en lichtzinnige mannen, die hem volgden.", "1 Sam 6:19": "En de Heere sloeg onder de mensen van Beth-Semes, omdat zij in de ark van de HEERE gekeken hadden; ja, Hij sloeg van het volk zeventig mannen, en vijftigduizend mannen. Toen bedreef het volk rouw, omdat de HEERE een grote slag onder het volk geslagen had.", "Jes 9:16": "Daarom zal de Heere Zich niet verblijden over hun jongelingen, en over hun wezen en hun weduwen zal Hij Zich niet ontfermen, want zij zijn allen samen huichelaars en boosdoeners, en elke mond spreekt dwaasheid. Om dit alles keert Zijn toorn zich niet af, maar Zijn hand is nog uitgestrekt.", "Num 4:15": "Als Aäron en zijn zonen het dekken van het heiligdom, en van al het gereedschap van het heiligdom, bij het optrekken van het leger, voltooid hebben, dan zullen daarna de zonen van Kohath komen om te dragen; maar zij zullen dat heilige niet aanraken, opdat zij niet sterven. Dit is de last van de zonen van Kohath, in de tent der samenkomst.", "2 Kron 30:24": "Want Hizkia, de koning van Juda, gaf de gemeente duizend stieren en zevenduizend schapen; en de leiders gaven de gemeente duizend stieren en tienduizend schapen; de priesters nu hadden zich in groten getale geheiligd.", "2 Kon 23:26": "Toch keerde de HEERE Zich niet af van de brand van Zijn grote toorn, waarmee Zijn toorn tegen Juda ontbrand was, om alle tergingen waarmee Manasse Hem getergd had.", "Neh 4:3": "En Tobia, de Ammoniet, was bij hem, en zei: Al is het dat zij bouwen, als er een vos opklom, dan zou hij hun stenen muur al kunnen omverhalen.", "Jer 21:6": "En Ik zal de inwoners van deze stad slaan, zowel de mensen als de dieren; door een grote pest zullen zij sterven.", "Hand 5:42": "En zij hielden niet op, elke dag, in de tempel en bij de huizen, te leren, en Jezus Christus te verkondigen.", "Deut 6:14": "U zult andere goden niet navolgen, van de goden van de volken, die rondom u zijn.", "Ef 5:6": "Laat niemand u verleiden met loze woorden; want om deze dingen komt de toorn van God over de kinderen van de ongehoorzaamheid.", "2 Sam 16:4": "Zo zei de koning tegen Ziba: Zie, alles wat Mefiboseth heeft, zal van u zijn. En Ziba zei: Ik buig mij neer, laat mij genade vinden in uw ogen, mijn heer koning!", "Joz 15:10": "Daarna zal deze grens zich omkeren van Baäla tegen het westen, naar het gebergte Seïr, en zal doorgaan aan de kant van de berg Jearim van het noorden; dat is Chesalon; en zij zal afkomen naar Beth-semes, en door Timna gaan.", "Num 11:10": "Toen hoorde Mozes het volk wenen door hun huisgezinnen, ieder aan de deur van zijn tent; en de toorn van de HEERE ontstak zeer; ook was dat kwaad in de ogen van Mozes.", "2 Sam 6:6-11": "Toen zij nu kwamen tot aan de dorsvloer van Nachon, strekte Uza zijn hand uit naar de ark van God, en hield die vast, want de runderen struikelden. Toen ontstak de toorn van de HEERE tegen Uza, en God sloeg hem daar, om deze onbedachtzaamheid; en hij stierf daar bij de ark van God. En David werd toornig, omdat de HEERE een scheur gescheurd had aan Uza; en hij noemde die plaats Perez-uza, tot op deze dag.", "1 Sam 16:16": "Laat onze heer toch tegen zijn dienaren die voor hem staan zeggen dat zij een man zoeken die op de harp kan spelen; en het zal gebeuren, als de boze geest van God over u komt, dat hij met zijn hand speelt, zodat het beter met u wordt.", "2 Kon 13:3": "Daarom ontstak de toorn van de HEERE tegen Israël; en Hij gaf hen in de hand van Hazaël, de koning van Syrië, en in de hand van Benhadad, de zoon van Hazaël, al die dagen.", "Matt 22:7": "Toen de koning dat hoorde, werd hij toornig, en hij stuurde zijn legers en heeft die moordenaars omgebracht en hun stad in brand gestoken.", "1 Sam 4:11": "En de ark van God werd genomen, en de twee zonen van Eli, Hofni en Pinehas, stierven.", "Jes 5:25": "Daarom is de toorn van de HEERE ontstoken tegen Zijn volk, en heeft Hij Zijn hand tegen hen uitgestrekt, en heeft Hij hen geslagen, zodat de bergen hebben gebeefd, en hun dode lichamen zijn geworden als vuil in het midden van de straten. Om dit alles keert Zijn toorn zich niet af, maar Zijn hand is nog uitgestrekt.", "Ezech 9:3": "En de heerlijkheid van de God van Israël verhief zich van de cherub waarop Hij was, naar de drempel van het huis; en Hij riep tot de man die met linnen bekleed was, die de schrijversinktkoker aan zijn heup had.", "1 Sam 6:7-14": "Neem dan nu en maak een nieuwe wagen, en twee zogende koeien waarop geen juk gekomen is; span de koeien voor de wagen, en breng hun kalveren van achter hen terug naar huis. Neem dan de ark van de HEERE, en zet haar op de wagen, en leg de gouden kleinoden die u Hem als schuldoffer teruggeeft in een koffertje aan haar zijde; en zend haar weg, zodat zij vertrekt. Kijk dan toe: als zij de weg naar haar eigen gebied opgaat naar Beth-Semes, dan heeft Hij ons dit grote kwaad gedaan; maar zo niet, dan zullen wij weten dat Zijn hand ons niet geraakt heeft; het is ons een toeval geweest.", "Ezech 5:13": "Zo zal Mijn toorn volbracht worden, en Ik zal Mijn grimmigheid op hen laten rusten, en Mij troosten; en zij zullen weten dat Ik, de HEERE, in Mijn ijver gesproken heb, als Ik Mijn grimmigheid tegen hen volbracht zal hebben.", "Neh 8:11": "Verder zei hij tegen hen: Ga, eet het vette, en drink het zoete, en stuur delen aan hen voor wie niets bereid is, want deze dag is heilig voor onze Heere; wees dus niet bedroefd, want de blijdschap van de HEERE, die is uw sterkte.", "2 Sam 6:1-8": "Daarna verzamelde David opnieuw alle uitgelezen mannen in Israël, dertigduizend. En David maakte zich op en ging heen met al het volk dat bij hem was, van Baälim-juda, om vandaar de ark van God op te brengen, bij wie de Naam wordt aangeroepen, de Naam van de HEERE van de heerscharen, Die daarop woont tussen de cherubs. En zij zetten de ark van God op een nieuwe wagen, en haalden die uit het huis van Abinadab, dat op een heuvel is; en Uza en Ahio, zonen van Abinadab, leidden de nieuwe wagen.", "1 Sam 6:7": "Neem dan nu en maak een nieuwe wagen, en twee zogende koeien waarop geen juk gekomen is; span de koeien voor de wagen, en breng hun kalveren van achter hen terug naar huis.", "2 Sam 7:18-29": "Toen ging koning David naar binnen, en bleef voor het aangezicht van de HEERE, en hij zei: Wie ben ik, Heere HEERE, en wat is mijn huis, dat U mij tot hiertoe gebracht hebt? Daarbij is dit in Uw ogen nog klein geweest, Heere HEERE, maar U hebt ook over het huis van uw knecht gesproken tot ver in de toekomst; en dit naar de wet van de mensen, Heere HEERE! En wat zal David nog meer tot U spreken? Want U kent Uw knecht, Heere HEERE!", "Ps 103:8": "Barmhartig en genadig is de HEERE, geduldig en groot van goedertierenheid.", "1 Kron 17:16-27": "Toen kwam koning David binnen, en bleef voor het aangezicht van de HEERE, en hij zei: Wie ben ik, HEERE God, en wat is mijn huis, dat U mij tot hiertoe gebracht hebt? En dit is nog klein geweest in Uw ogen, o God! Daarom hebt U over het huis van Uw knecht ook gesproken voor een verre toekomst, en U hebt mij naar menselijke maatstaf voorzien met deze verhoging, o HEERE God! Wat zal David hier verder aan toevoegen, vanwege de eer aan Uw knecht? Maar U kent Uw knecht wel.", "Lev 24:11-16": "Toen lasterde de zoon van de Israëlitische vrouw uitdrukkelijk de NAAM, en vloekte; daarom brachten zij hem tot Mozes; de naam van zijn moeder nu was Selomith, de dochter van Dibri, van de stam Dan. En zij zetten hem in bewaring, totdat hun, naar de mond van de HEERE, uitspraak gedaan zou worden. En de HEERE sprak tot Mozes en zei:", "Hebr 4:16": "Laat ons dan met vrijmoedigheid toegaan tot de troon van de genade, opdat wij barmhartigheid mogen verkrijgen en genade vinden om geholpen te worden op de tijd dat wij het nodig hebben.", "Dan 3:10": "U, o koning, hebt een bevel gegeven, dat alle mensen die het geluid zouden horen van de hoorn, de pijp, de citer, de vedel, de psalters, en het akkoordgezang, en allerlei soorten muziek, moeten neervallen en het gouden beeld aanbidden;", "1 Sam 16:12": "Toen stuurde hij iemand, en liet hem komen; hij nu was roodachtig, en had daarbij mooie ogen en een knap voorkomen; en de HEERE zei: Sta op, zalf hem, want deze is het.", "Ps 89:21": "Ik heb David, Mijn knecht, gevonden; met Mijn heilige olie heb Ik hem gezalfd;", "Joël 2:24": "En de dorsvloeren zullen vol koren zijn, en de perskuipen zullen overlopen van most en olie.", "Ex 22:24": "en Mijn toorn zal ontbranden, en Ik zal u met het zwaard doden; en uw vrouwen zullen weduwen worden, en uw kinderen wezen.", "Richt 11:34": "Toen Jeftha nu bij Mizpa bij zijn huis kwam, zie, zo kwam zijn dochter hem tegemoet, met trommels en met reidansen. Zij was zijn enige kind; hij had verder geen zoon of dochter.", "Ex 39:43": "Mozes nu bezag het gehele werk, en zie, zij hadden het gemaakt zoals de HEERE geboden had; zo hadden zij het gemaakt. Toen zegende Mozes hen.", "Spr 9:2": "Zij heeft haar slachtvee geslacht. Zij heeft haar wijn gemengd; ook heeft zij haar tafel klaargemaakt.", "Spr 3:10": "Zo zullen uw schuren met overvloed gevuld worden, en uw perskuipen van most overlopen.", "Num 25:4": "En de HEERE zei tot Mozes: Neem alle hoofden van het volk, en hang hen op voor de HEERE tegen de zon, zo zal de gloed van de toorn van de HEERE gekeerd worden van Israël.", "2 Sam 6:20-23": "Toen David nu terugkwam om zijn huis te zegenen, ging Michal, de dochter van Saul, naar buiten, David tegemoet, en zei: Hoe is de koning van Israël vandaag geëerd, die zich vandaag voor de ogen van de dienstmaagden van zijn dienstknechten heeft ontbloot, zoals een van de nietswaardige mensen zich onbeschaamd ontbloot! Maar David zei tegen Michal: Voor het aangezicht van de HEERE, Die mij verkozen heeft boven uw vader en boven zijn hele huis, om mij aan te stellen tot een voorganger over het volk van de HEERE, over Israël; ja, ik zal spelen voor het aangezicht van de HEERE. Ook zal ik mij nog geringer houden dan dit, en nederig zijn in mijn ogen; en met de dienstmaagden waarvan u gesproken hebt, met hen zal ik geëerd worden.", "1 Sam 2:18": "Doch Samuël diende voor het aangezicht van de HEERE, terwijl hij een jongen was, omgord met de linnen efod.", "Joz 23:16": "Wanneer u het verbond van de HEERE, uw God, overtreedt, dat Hij u geboden heeft, en u heengaat en dient andere goden, en u voor hen neerbuigt, zo zal de toorn van de HEERE over u ontsteken, en u zult haastig omkomen van het goede land, dat Hij u gegeven heeft.", "Richt 2:12": "En zij verlieten de HEERE, de God van hun vaderen, Die hen uit Egypteland had uitgeleid, en volgden andere goden na, van de goden van de volken die rondom hen waren, en bogen zich voor die neer, en zij verwekten de HEERE tot toorn.", "2 Sam 15:12": "Absalom zond ook om Achitofel, de Giloniet, Davids raadsman, te halen uit zijn stad, uit Gilo, terwijl hij offers bracht. En de samenzwering werd sterk, en het volk kwam gestaag toe en werd meer bij Absalom.", "Ps 27:7-14": "Hoor, HEERE, mijn stem, als ik roep; en wees mij genadig, en antwoord mij. Mijn hart zegt tegen U: U zegt: Zoek Mijn aangezicht; ik zoek Uw aangezicht, o HEERE! Verberg Uw aangezicht niet voor mij, keer Uw knecht niet af in toorn; U bent mijn Hulp geweest, verlaat mij niet, en begeef mij niet, o God van mijn heil!", "Ps 80:2": "O Herder van Israël! Neem het ter oor, U Die Jozef als schapen leidde; U Die tussen de cherubs zit, verschijn blinkend.", "2 Sam 15:25": "Toen zei de koning tegen Zadok: Breng de ark van God terug in de stad; als ik genade zal vinden in de ogen van de HEERE, dan zal Hij mij terughalen, en zal Hij mij haar laten zien, alsook Zijn woning.", "Joh 2:10": "En hij zei tegen hem: Ieder mens zet eerst de goede wijn voor, en wanneer men goed gedronken heeft, dan de mindere; maar u hebt de goede wijn tot nu toe bewaard.", "Luk 5:9": "Want verbazing had hem en allen die met hem waren overweldigd, over de vangst van de vissen die zij gevangen hadden;", "1 Sam 3:3": "en Samuël zich ook had neergelegd, voordat de lamp van God uitgedaan werd, in de tempel van de HEERE, waar de ark van God was,", "Num 4:5-12": "Wanneer het leger optrekt, zullen Aäron en zijn zonen komen, en de voorhang van het deksel afnemen, en daarmee de ark der getuigenis bedekken. En zij zullen daarop een deksel van dassenvellen leggen, en daar bovenop een geheel kleed van hemelsblauw uitspreiden; en zij zullen de bijbehorende handbomen aanleggen. Zij zullen ook op de toontafel een kleed van hemelsblauw uitspreiden, en daarop zetten de schotels, en de reukschalen, en de kroezen, en de dekschotels; ook zal het gedurige brood daarop zijn.", "Luk 15:25": "En zijn oudste zoon was op het veld; en toen hij kwam en het huis naderde, hoorde hij het gezang en het gedans,", "Hand 2:13": "En anderen zeiden spottend: Zij zijn vol zoete wijn.", "2 Sam 18:2": "Verder zond David het volk uit, een derde deel onder leiding van Joab, en een derde deel onder leiding van Abisai, de zoon van Zeruja, Joabs broer, en een derde deel onder leiding van Ithai, de Gethiet. En de koning zei tegen het volk: Ik zal ook zelf zeker met u meetrekken.", "Hebr 7:1-7": "Want deze Melchizedek was koning van Salem, een priester van de allerhoogste God, die Abraham tegemoet ging toen hij terugkeerde van het verslaan van de koningen, en hem zegende; aan wie Abraham ook van alles de tienden gaf; hij wordt eerst vertaald met 'koning van de gerechtigheid', en daarna was hij ook koning van Salem, dat is: koning van de vrede; zonder vader, zonder moeder, zonder geslachtsregister, zonder begin van dagen of einde van leven, maar gelijk geworden aan de Zoon van God, blijft hij een priester voor eeuwig.", "Nahum 1:6": "Wie zal voor Zijn gramschap staan, en wie zal bestaan voor de gloed van Zijn toorn? Zijn grimmigheid is uitgestort als vuur, en de rotsen worden door Hem verbrijzeld.", "Openb 15:7": "En een van de vier dieren gaf de zeven engelen zeven gouden schalen, vol van de toorn van God, Die leeft in alle eeuwigheid.", "Ezech 5:15": "Zo zal de smaad en hoon een lering en ontzetting zijn voor de heidenvolken die rondom u zijn, wanneer Ik over u gerichten in toorn, en in grimmigheid, en in grimmige straffen oefenen zal; Ik, de HEERE, heb het gesproken!", "Jes 48:9": "Om Mijn Naams wil zal Ik Mijn toorn langer uitstellen, en om het roem van Mij wil zal Ik, u ten goede, Mij bedwingen, opdat Ik u niet afhouw.", "Ps 47:7": "Zingt psalmen voor God, zingt psalmen! Zingt psalmen voor onze Koning, zingt psalmen!", "Jer 31:13": "Dan zal de jonkvrouw zich verblijden in de rei, en ook de jongelingen en de ouderen samen; want Ik zal hun rouw in vrolijkheid veranderen, en zal hen troosten, en zal hen verblijden na hun droefenis.", "Joz 4:11": "En het gebeurde, toen al het volk geëindigd had over te gaan, dat de ark van de HEERE overging, en de priesters voor de ogen van het volk.", "Ex 15:20": "En Mirjam, de profetes, de zuster van Aäron, nam een trommel in haar hand; en alle vrouwen gingen achter haar aan, met trommels en met reidansen.", "Gen 14:19": "En hij zegende hem en zei: Gezegend zij Abram door God, de Allerhoogste, Die hemel en aarde bezit!", "Num 32:10": "Toen ontstak de toorn van de HEERE op die dag, en Hij zwoer en zei:", "Hos 3:1": "En de Heere zei tegen mij: Ga opnieuw heen, heb een vrouw lief, die, ook al is ze bemind door haar vriend, toch overspel doet; zoals de Heere de kinderen van Israël liefheeft, terwijl zij zich richten naar andere goden, en houden van de wijnkruiken.", "2 Kron 7:5-7": "En de koning Salomo offerde slachtoffers van runderen, tweeëntwintigduizend, en van schapen, honderdtwintigduizend. Zo hebben de koning en het hele volk het huis van God ingewijd. Ook stonden de priesters op hun posten, en de Levieten met de muzikale instrumenten van de HEERE, die de koning David gemaakt had, om de HEERE te loven, dat Zijn goedertierenheid in eeuwigheid is, wanneer David door hun dienst Hem prees; en de priesters bliezen de trompetten tegenover hen, en heel Israël stond. En Salomo heiligde het middelste van de voorhof, dat voor het huis van de HEERE was, omdat hij daar de brandoffers en het vette van de dankoffers bereid had; want het koperen altaar, dat Salomo gemaakt had, kon het brandoffer, en het spijsoffer, en het vette niet bevatten.", "Hos 9:11": "Wat
