met allerlei *snarenspel* van dennenhout, met harpen, en met luiten, en met trommels, ook met schellen, en met cimbalen.","6":"Toen zij nu kwamen tot aan de dorsvloer van Nachon, strekte Uza zijn hand uit naar de ark van God, en hield die vast, want de runderen struikelden.","7":"Toen ontstak de toorn van de HEERE tegen Uza, en God sloeg hem daar, om deze onbedachtzaamheid; en hij stierf daar bij de ark van God.","8":"En David werd toornig, omdat de HEERE een scheur gescheurd had aan Uza; en hij noemde die plaats Perez-uza, tot op deze dag.","9":"En David vreesde de HEERE die dag; en hij zei: Hoe zal de ark van de HEERE bij mij komen?","10":"David dan wilde de ark van de HEERE niet bij zich laten overbrengen naar de stad van David; maar David deed haar afwijken naar het huis van Obed-edom, de Gethiet.","11":"En de ark van de HEERE bleef in het huis van Obed-edom, de Gethiet, drie maanden; en de HEERE zegende Obed-edom en zijn hele huis.","12":"Toen berichtte men aan koning David: De HEERE heeft het huis van Obed-edom, en alles wat hij heeft, gezegend om de ark van God. Zo ging David heen en haalde de ark van God uit het huis van Obed-edom naar de stad van David, met vreugde.","13":"En het gebeurde, toen zij die de ark van de HEERE droegen, zes treden voortgegaan waren, dat hij ossen en gemest *vee* offerde.","14":"En David huppelde met alle macht voor het aangezicht van de HEERE; en David was omgord met een linnen lijfrok.","15":"Zo brachten David en het hele huis van Israël de ark van de HEERE op, met gejuich en met geluid van bazuinen.","16":"En het gebeurde, toen de ark van de HEERE in de stad van David kwam, dat Michal, de dochter van Saul, door het venster uitkeek. Toen zij nu koning David zag, springend en huppelend voor het aangezicht van de HEERE, verachtte zij hem in haar hart.","17":"Toen zij nu de ark van de HEERE naar binnen brachten, zetten zij die op haar plaats, in het midden van de tent die David voor haar gespannen had; en David offerde brandoffers voor het aangezicht van de HEERE, en dankoffers.","18":"Toen David geëindigd had het brandoffer en de dankoffers te offeren, zegende hij het volk in de Naam van de HEERE van de heerscharen.","19":"En hij deelde uit aan het hele volk, aan de hele menigte van Israël, van de mannen tot de vrouwen toe, aan ieder een broodkoek, en een goed stuk *vlees*, en een fles *wijn*. Toen ging al dat volk heen, ieder naar zijn huis.","20":"Toen David nu terugkwam om zijn huis te zegenen, ging Michal, de dochter van Saul, naar buiten, David tegemoet, en zei: Hoe is de koning van Israël vandaag geëerd, die zich vandaag voor de ogen van de dienstmaagden van zijn dienstknechten heeft ontbloot, zoals een van de nietswaardige mensen zich onbeschaamd ontbloot!","21":"Maar David zei tegen Michal: Voor het aangezicht van de HEERE, Die mij verkozen heeft boven uw vader en boven zijn hele huis, om mij aan te stellen tot een voorganger over het volk van de HEERE, over Israël; ja, ik zal spelen voor het aangezicht van de HEERE.","22":"Ook zal ik mij nog geringer houden dan dit, en nederig zijn in mijn ogen; en met de dienstmaagden waarvan u gesproken hebt, met hen zal ik geëerd worden.","23":"Michal nu, de dochter van Saul, had geen kind, tot de dag van haar dood toe."},"SV":{"1":"Daarna verzamelde David wederom alle uitgelezenen in Israël, dertig duizend.","2":"En David maakte zich op, en ging heen met al het volk, dat bij hem was, van Baälim-juda, om van daar op te brengen de ark Gods, bij dewelke de Naam wordt aangeroepen, de Naam van den HEERE der heirscharen, Die daarop woont tussen de cherubim.","3":"En zij voerden de ark Gods op een nieuwen wagen, en haalden ze uit het huis van Abinadab, dat op een heuvel is; en Uza en Ahio, zonen van Abinadab, leidden den nieuwen wagen.","4":"Toen zij hem nu uit het huis van Abinadab, dat op den heuvel is, met de ark Gods, wegvoerden, zo ging Ahio voor de ark henen.","5":"En David en het ganse huis Israëls speelden voor het aangezicht des HEEREN, met allerlei *snarenspel* van dennenhout, als met harpen, en met luiten, en met trommelen, ook met schellen, en met cimbalen.","6":"Als zij nu kwamen tot aan Nachons dorsvloer, zo strekte Uza *zijn* *hand* uit aan de ark Gods, en hield ze, want de runderen struikelden.","7":"Toen ontstak de toorn des HEEREN tegen Uza, en God sloeg hem aldaar, om deze onbedachtzaamheid; en hij stierf aldaar bij de ark Gods.","8":"En David ontstak, omdat de HEERE een scheur gescheurd had aan Uza; en hij noemde dezelve plaats Perez-uza, tot op dezen dag.","9":"En David vreesde den HEERE ten zelven dage; en hij zeide: Hoe zal de ark des HEEREN tot mij komen?","10":"David dan wilde de ark des HEEREN niet tot zich *laten* overbrengen in de stad Davids; maar David deed ze afwijken in het huis van Obed-edom, den Gethiet.","11":"En de ark des HEEREN bleef in het huis van Obed-edom, den Gethiet, drie maanden; en de HEERE zegende Obed-edom en zijn ganse huis.","12":"Toen boodschapte men den koning David, zeggende: De HEERE heeft het huis van Obed-edom, en al wat hij heeft, gezegend om der ark Gods wil; zo ging David heen en haalde de ark Gods uit het huis van Obed-edom opwaarts in de stad Davids, met vreugde.","13":"En het geschiedde, als zij, die de ark des HEEREN droegen, zes treden voortgetreden waren, dat hij ossen en gemest *vee* offerde.","14":"En David huppelde met alle macht voor het aangezicht des HEEREN; en David was omgord met een linnen lijfrok.","15":"Alzo brachten David en het ganse huis Israëls de ark des HEEREN op, met gejuich en met geluid der bazuinen.","16":"En het geschiedde, als de ark des HEEREN in de stad Davids kwam, dat Michal, Sauls dochter, door het venster uitzag. Als zij nu den koning David zag, springende en huppelende voor het aangezicht des HEEREN, verachtte zij hem in haar hart.","17":"Toen zij nu de ark des HEEREN inbrachten, stelden zij die in haar plaats, in het midden der tent, die David voor haar gespannen had; en David offerde brandofferen voor des HEEREN aangezicht, en dankofferen.","18":"Als David geëindigd had het brandoffer en de dankofferen te offeren, zo zegende hij het volk in den Naam des HEEREN der heirscharen.","19":"En hij deelde uit aan het ganse volk, aan de ganse menigte van Israël, van de mannen tot de vrouwen toe, aan een iegelijk een broodkoek, en een schoon stuk *vlees*, en een fles *wijn*. Toen ging al dat volk heen, een iegelijk naar zijn huis.","20":"Als nu David wederkwam, om zijn huis te zegenen, ging Michal, Sauls dochter, uit, David tegemoet, en zeide: Hoe is heden de koning van Israël verheerlijkt, die zich heden voor de ogen van de dienstmaagden zijner dienstknechten heeft ontbloot, gelijk een van de ijdele lieden zich onbeschaamdelijk ontbloot?","21":"Maar David zeide tot Michal: Voor het aangezicht des HEEREN, Die mij verkoren heeft voor uw vader en voor zijn ganse huis, mij instellende tot een voorganger over het volk des HEEREN, over Israël; ja, ik zal spelen voor het aangezicht des HEEREN.","22":"Ook zal ik mij nog geringer houden dan alzo, en zal nederig zijn in mijn ogen, en met de dienstmaagden, waarvan gij gezegd hebt, met dezelve zal ik verheerlijkt worden.","23":"Michal nu, Sauls dochter, had geen kind, tot den dag van haar dood toe."},"KJV":{"1":"Again, David gathered together all the chosen men of Israel, thirty thousand.","2":"And David arose, and went with all the people that were with him from Baale of Judah, to bring up from thence the ark of God, whose name is called by the name of the LORD of hosts that dwelleth between the cherubims.","3":"And they set the ark of God upon a new cart, and brought it out of the house of Abinadab that was in Gibeah: and Uzzah and Ahio, the sons of Abinadab, drave the new cart.","4":"And they brought it out of the house of Abinadab which was at Gibeah, accompanying the ark of God: and Ahio went before the ark.","5":"And David and all the house of Israel played before the LORD on all manner of instruments made of fir wood, even on harps, and on psalteries, and on timbrels, and on cornets, and on cymbals.","6":"And when they came to Nachon's threshingfloor, Uzzah put forth his hand to the ark of God, and took hold of it; for the oxen shook it.","7":"And the anger of the LORD was kindled against Uzzah; and God smote him there for his error; and there he died by the ark of God.","8":"And David was displeased, because the LORD had made a breach upon Uzzah: and he called the name of the place Perezuzzah to this day.","9":"And David was afraid of the LORD that day, and said, How shall the ark of the LORD come to me?","10":"So David would not remove the ark of the LORD unto him into the city of David: but David carried it aside into the house of Obededom the Gittite.","11":"And the ark of the LORD continued in the house of Obededom the Gittite three months: and the LORD blessed Obededom, and all his household.","12":"And it was told king David, saying, The LORD hath blessed the house of Obededom, and all that pertaineth unto him, because of the ark of God. So David went and brought up the ark of God from the house of Obededom into the city of David with gladness.","13":"And it was so, that when they that bare the ark of the LORD had gone six paces, he sacrificed oxen and fatlings.","14":"And David danced before the LORD with all his might; and David was girded with a linen ephod.","15":"So David and all the house of Israel brought up the ark of the LORD with shouting, and with the sound of the trumpet.","16":"And as the ark of the LORD came into the city of David, Michal Saul's daughter looked through a window, and saw king David leaping and dancing before the LORD; and she despised him in her heart.","17":"And they brought in the ark of the LORD, and set it in his place, in the midst of the tabernacle that David had pitched for it: and David offered burnt offerings and peace offerings before the LORD.","18":"And as soon as David had made an end of offering burnt offerings and peace offerings, he blessed the people in the name of the LORD of hosts.","19":"And he dealt among all the people, even among the whole multitude of Israel, as well to the women as men, to every one a cake of bread, and a good piece of flesh, and a flagon of wine. So all the people departed every one to his house.","20":"Then David returned to bless his household. And Michal the daughter of Saul came out to meet David, and said, How glorious was the king of Israel to day, who uncovered himself to day in the eyes of the handmaids of his servants, as one of the vain fellows shamelessly uncovereth himself!","21":"And David said unto Michal, It was before the LORD, which chose me before thy father, and before all his house, to appoint me ruler over the people of the LORD, over Israel: therefore will I play before the LORD.","22":"And I will yet be more vile than thus, and will be base in mine own sight: and of the maidservants which thou hast spoken of, of them shall I be had in honour.","23":"Therefore Michal the daughter of Saul had no child unto the day of her death."}},"tsk":{"2":[{"kopje":"Baälim-juda","refs":["Joz 15:9","Joz 15:10","Joz 15:60","1 Sam 7:1","1 Kron 13:5","1 Kron 13:6"]},{"kopje":"de Naam","refs":["Lev 24:11-16","Jes 47:4","Jes 54:5"]},{"kopje":"woont","refs":["Ex 25:18-22","1 Sam 4:4","1 Kon 8:6","1 Kon 8:7","Ps 80:2","1 Petr 1:12"]}],"3":[{"kopje":"zetten","refs":["Num 4:5-12","Num 7:9","1 Sam 6:7"]}],"5":[{"kopje":"David","refs":["1 Sam 10:5","1 Sam 16:16","2 Kon 3:15","1 Kron 13:8","1 Kron 15:10-24","Ps 47:6","Ps 68:26-28","Ps 150:3-5","Dan 3:5","Dan 3:7","Dan 3:10","Dan 3:15","Amos 5:23","Amos 6:5"]},{"kopje":"allerlei","refs":["1 Kron 13:8"]}],"6":[{"kopje":"Nachon","refs":["1 Kron 13:9"]},{"kopje":"uit","refs":["Num 4:15","Num 4:19","Num 4:20"]}],"7":[{"kopje":"sloeg hem","refs":["Lev 10:1-3","1 Sam 6:19","1 Kron 13:10","1 Kron 15:2","1 Kron 15:13","1 Kor 11:30-32"]}],"8":[{"kopje":"toornig","refs":["1 Kron 13:11","1 Kron 13:12","Jona 4:1","Jona 4:9"]}],"9":[{"kopje":"vreesde","re -kjv\" data-code=\"H3820\">heart.</span>","17":"And they <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> in the <span class=\"wl wl-kjv\" data-code=\"H727\">ark</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and <span class=\"wl wl-kjv\" data-code=\"H3322\">set</span> it in his <span class=\"wl wl-kjv\" data-code=\"H4725\">place,</span> in the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> of the <span class=\"wl wl-kjv\" data-code=\"H168\">tabernacle</span> that <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> had <span class=\"wl wl-kjv\" data-code=\"H5186\">pitched</span> for it: and <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H5927\">offered</span> burnt <span class=\"wl wl-kjv\" data-code=\"H5930\">offerings</span> and peace <span class=\"wl wl-kjv\" data-code=\"H8002\">offerings</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD.</span>","18":"And as soon as <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> had made an <span class=\"wl wl-kjv\" data-code=\"H3615\">end</span> of <span class=\"wl wl-kjv\" data-code=\"H5927\">offering</span> burnt <span class=\"wl wl-kjv\" data-code=\"H5930\">offerings</span> and peace <span class=\"wl wl-kjv\" data-code=\"H8002\">offerings,</span> he <span class=\"wl wl-kjv\" data-code=\"H1288\">blessed</span> the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> in the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts.</span>","19":"And he <span class=\"wl wl-kjv\" data-code=\"H2505\">dealt</span> among all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> even among the whole <span class=\"wl wl-kjv\" data-code=\"H1995\">multitude</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> as well to the <span class=\"wl wl-kjv\" data-code=\"H802\">women</span> as <span class=\"wl wl-kjv\" data-code=\"H376\">men,</span> to every <span class=\"wl wl-kjv\" data-code=\"H376\">one</span> <span class=\"wl wl-kjv\" data-code=\"H259\">a</span> <span class=\"wl wl-kjv\" data-code=\"H2471\">cake</span> of <span class=\"wl wl-kjv\" data-code=\"H3899\">bread,</span> and a good <span class=\"wl wl-kjv\" data-code=\"H829\">piece</span> of flesh, and a <span class=\"wl wl-kjv\" data-code=\"H809\">flagon</span> of wine. So all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">departed</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">one</span> to his <span class=\"wl wl-kjv\" data-code=\"H1004\">house.</span>","20":"Then <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">returned</span> to <span class=\"wl wl-kjv\" data-code=\"H1288\">bless</span> his <span class=\"wl wl-kjv\" data-code=\"H1004\">household.</span> And <span class=\"wl wl-kjv\" data-code=\"H4324\">Michal</span> the <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> of <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> came <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> to <span class=\"wl wl-kjv\" data-code=\"H7125\">meet</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> How <span class=\"wl wl-kjv\" data-code=\"H3513\">glorious</span> was the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> to <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> who <span class=\"wl wl-kjv\" data-code=\"H1540\">uncovered</span> himself to <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> in the <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes</span> of the <span class=\"wl wl-kjv\" data-code=\"H519\">handmaids</span> of his <span class=\"wl wl-kjv\" data-code=\"H5650\">servants,</span> as <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> of the vain <span class=\"wl wl-kjv\" data-code=\"H7386\">fellows</span> <span class=\"wl wl-kjv\" data-code=\"H1540\">shamelessly</span> <span class=\"wl wl-kjv\" data-code=\"H1540\">uncovereth</span> himself!","21":"And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H4324\">Michal,</span> It was <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> which <span class=\"wl wl-kjv\" data-code=\"H977\">chose</span> me before thy <span class=\"wl wl-kjv\" data-code=\"H1\">father,</span> and before all his <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> to <span class=\"wl wl-kjv\" data-code=\"H6680\">appoint</span> me <span class=\"wl wl-kjv\" data-code=\"H5057\">ruler</span> over the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> over <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel:</span> therefore will I <span class=\"wl wl-kjv\" data-code=\"H7832\">play</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD.</span>","22":"And I will yet be more <span class=\"wl wl-kjv\" data-code=\"H7043\">vile</span> than <span class=\"wl wl-kjv\" data-code=\"H2063\">thus,</span> and will be <span class=\"wl wl-kjv\" data-code=\"H8217\">base</span> in mine own <span class=\"wl wl-kjv\" data-code=\"H5869\">sight:</span> and of the <span class=\"wl wl-kjv\" data-code=\"H519\">maidservants</span> which thou hast <span class=\"wl wl-kjv\" data-code=\"H559\">spoken</span> of, of them shall I be had in <span class=\"wl wl-kjv\" data-code=\"H3513\">honour.</span>","23":"Therefore <span class=\"wl wl-kjv\" data-code=\"H4324\">Michal</span> the <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> of <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> had no <span class=\"wl wl-kjv\" data-code=\"H2056\">child</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of her <span class=\"wl wl-kjv\" data-code=\"H4194\">death.</span>"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"verzamelde David","tekst":"Vergelijk deze historie met 1Ch 13, alwaar zij wordt wederhaald."},{"catchword":"wederom","tekst":"Het schijnt dat hij tevoren gelijke verzameling gedaan had, als hij ten strijde zou gaan tegen de Filistijnen, boven, 2Sa 5:6, enz., en 2Sa 5:22, enz. Eenigen menen dat dit ziet op de voorgaande verzameling, waarvan boven, 2Sa 5:1, 2Sa 5:3."}],"2":[{"catchword":"maakte zich op,","tekst":"Toen hij van Jeruzalem te Baälim Juda, dat is, Kiriath-Jearim, gekomen was."},{"catchword":"Baälim-juda,","tekst":"Zie 1Ch 13:6, en 1Sa 7:1, en Jos 15:10, Jos 15:60."},{"catchword":"ark Gods,","tekst":"Dat is, die van God tot zijn dienst en troost zijns volks verordineerd was."},{"catchword":"bij dewelke de Naam wordt aangeroepen,","tekst":"Vergelijk Lev 24:11, en Deu 28:58. Anders, wiens [te weten, Gods] naam genoemd wordt, de naam, enz. Zie wijders 1Ki 8:29, en 1Ki 18:15."},{"catchword":"daarop woont","tekst":"Te weten, op de ark."},{"catchword":"cherubim","tekst":"Zie Gen 3:24."}],"3":[{"catchword":"voerden de ark Gods op een nieuwen wagen,","tekst":"Vergeten hebbende, of niet denkende aan het bevel des HEEREN, die geboden had dat de priesters de ark zouden dragen, Num 4:15, en Num 7:9. Het schijnt dat zij hierin het exempel der Filistijnen hebben nagevolgd. Zie 1Sa 6:7-8, enz."},{"catchword":"haalden haar uit het huis van Abinádab,","tekst":"Hebreeuws, hieven haar, namen haar op"},{"catchword":"op een heuvel is;","tekst":"Op een hoogte, die bij of in Kiriath-Jearim was. Hebreeuws, Gibea. Zie 1Sa 7:1."},{"catchword":"Ahio,","tekst":"Hebreeuws, Achio."}],"4":[{"catchword":"voor de ark henen","tekst":"Om de runderen, die den wagen trokken, te leiden. Zie vs.6. Anderen nemen de voorgaande woorden aldus: Als zij nu haar [te weten, de ark] wegvoerden uit het huis van Abinadab, dat op den heuvel was met de ark Gods. Sommigen verstaan het woordje hem van Uza, dat zij hem genomen hebben om nevens de ark te gaan."}],"5":[{"catchword":"schellen,","tekst":"Anders, trompen, cornetten."}],"6":[{"catchword":"Nachons dorsvloer,","tekst":"Hebreeuws, Goren Nachon, 1Ch 13:9 genaamd Chidons dorsvloer"},{"catchword":"zijn hand uit","tekst":"Deze woorden staan 1Ch 13:9."},{"catchword":"runderen","tekst":"Die den wagen met de ark trokken."},{"catchword":"struikelden","tekst":"Of, traden ter zijde uit, gleden. Anders, schudden, ontzetten zich in al hun leden, gelijk wanneer iemand met beroerte geslagen wordt; of, schudden [de ark] dat zij in gevaar scheen te zijn van af te vallen."}],"7":[{"catchword":"onbedachtzaamheid;","tekst":"Of, deze fout, dwaling, onvoorzichtigheid, vergrijping, vermetelheid. Want God had uitdrukkelijk bevolen dat niemand dan de priesters de heilige vaten zouden aanroeren, op straf van den dood; Num 4:15."}],"8":[{"catchword":"David ontstak,","tekst":"Hebreeuws, aan David ontstak; te weten, zijn gemoed, of de toornigheid met droefenis over de zonde en straf van Uza, door welke deze algemene blijdschap als gescheurd en ingebroken was. Zie voorts 1Ch 15:2, 1Ch 15:13."},{"catchword":"Perez-uza,","tekst":"Dat is, de scheur, of breuk, reet, van Uza"},{"catchword":"tot op dezen dag","tekst":"Te weten, blijft dezelfde naam."}],"9":[{"catchword":"vreesde den HEERE","tekst":"Verschrikt zijnde, en ontziende Gods majesteit, heiligheid, rechtvaardige gestrengheid en ijver, durfde hij niet wijders voortvaren, bekommerd zijnde hoe hij God welbehagelijk dit werk zou mogen voltrekken."},{"catchword":"Hoe zal de ark des HEEREN tot mij komen?","tekst":"Alsof hij zeide: Het schijnt des HEEREN wil nog niet te zijn [vermits deze droevige scheur], dat ik haar tot mij halen zal. Of, er moet nog iets ontbreken, dat ik niet weet en waarvan ik Gods openbaring zal moeten verwachten."}],"10":[{"catchword":"Obed-edom,","tekst":"Die een Leviet was, van de deurwachters en zangers. Zie 1Ch 15:18, 1Ch 15:21, en 1Ch 16:38."},{"catchword":"Gethiet","tekst":"Van Geth of Gath, een koninklijke hoofdstad der Filistijnen, onderscheiden [naar sommiger kaarten] van Gath-Rimmon, nabij gelegen, en den Levieten toegeëigend, Jos 21:24-25. Sommigen menen dat Obed-Edom met David ten tijde van Saul daarheen gevlucht is, 1Sa 21:10. Anderen dat hij in ballingschap aldaar geboren is. Anderen dat hij van Gath-Rimmon geboortig is geweest."}],"12":[{"catchword":"David heen","tekst":"Zo uit deze, alook uit andere zegeningen des HEEREN, die 1Ch 14, in orde verhaald worden, afnemende en vertrouwende dat de HEERE met hem en zijn volk tevreden was. De manier van deze inhaling der ark wordt breder 1Ch 15 beschreven."}],"13":[{"catchword":"droegen,","tekst":"Versta, de priesters en de Levieten. Zie 1Ch 15:2, 1Ch 15:12-14."},{"catchword":"zes treden voortgetreden waren,","tekst":"Zie 1Ch 15:26. Anders, zes gangen gegaan waren"},{"catchword":"hij ossen en gemest vee offerde","tekst":"Te weten, David, door de priesters; om God zo in het algemeen voor zijn genade te danken, alsook in het bijzonder dat er gene scheur, gelijk tevoren geschied was, en de dragers der ark van God gesterkt en voor ongeval bewaard waren. Dit offeren heeft kunnen geschieden op een altaar, dat in der haast was opgeworpen, naar het bevel, Exo 20:24. Vergelijk 1Ch 15:26."}],"14":[{"catchword":"huppelde met alle macht","tekst":"Het Hebreeuwse woord komt van Car, hetwelk betekent een lam, hetwelk, al voorgaande, huppelt en springt. Versta dit niet vleselijk, of naar de wijze van de kinderen dezer wereld, maar uit enkel heilige geestelijke vreugde, die de Heilige Geest in zijn hart ontstak over de bestelling van de reinen godsdienst, en de goddelijke voo // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle

// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}

      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
