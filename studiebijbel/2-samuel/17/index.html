s, en zal hem schrik aanjagen; en al het volk dat bij hem is zal vluchten; dan zal ik de koning alleen doden.", "3": "En ik zal al het volk naar u laten terugkeren; de man die u zoekt, is gelijk aan het terugkeren van allen; zo zal al het volk in vrede zijn.", "4": "Dit woord nu was recht in de ogen van Absalom, en in de ogen van alle oudsten van Israël.", "5": "Doch Absalom zei: Roep toch ook Husai, de Archiet, en laten we horen wat ook hij zegt.", "6": "En toen Husai bij Absalom binnenkwam, sprak Absalom tegen hem en zei: Zo heeft Achitofel gesproken; zullen wij doen wat hij zegt? Zo niet, spreek u dan.", "7": "Toen zei Husai tegen Absalom: De raad die Achitofel deze keer gegeven heeft, is niet goed.", "8": "Verder zei Husai: U kent uw vader en zijn mannen, dat zij helden zijn, en verbitterd van gemoed, als een beer die van haar jongen beroofd is in het veld; daarbij is uw vader een krijgsman, en zal niet overnachten bij het volk.", "9": "Zie, hij heeft zich nu verstopt in een van de holen, of op een van de andere plaatsen. En het zal gebeuren, als er in het begin sommigen van hen vallen, dat ieder die het hoort dan zal zeggen: Er is een slachting gebeurd onder het volk dat Absalom volgt.", "10": "Dan zal zelfs hij, die een dapper man is, wiens hart is als een leeuwenhart, helemaal smelten van angst; want heel Israël weet dat uw vader een held is, en dat het dappere mannen zijn die bij hem zijn.", "11": "Maar ik raad aan dat heel Israël in alle haast bij u wordt verzameld, van Dan tot Berseba toe, talrijk als het zand dat aan de zee is; en dat u zelf mee optrekt in de strijd.", "12": "Dan zullen wij hem overvallen op een van de plaatsen waar hij gevonden wordt, en hem gemakkelijk overvallen, zoals de dauw op de aardbodem valt; en van hem, en van alle mannen die bij hem zijn, zal ook niet één worden overgelaten.", "13": "En als hij zich in een stad terugtrekt, zal heel Israël koorden naar die stad brengen, en wij zullen hem tot in de beek neertrekken, totdat ook niet een steentje daar meer gevonden wordt.", "14": "Toen zeiden Absalom en alle mannen van Israël: De raad van Husai, de Archiet, is beter dan de raad van Achitofel. Doch de HEERE had het zo bepaald, om de goede raad van Achitofel te vernietigen, opdat de HEERE het kwaad over Absalom zou brengen.", "15": "En Husai zei tegen Zadok en tegen Abjathar, de priesters: Zo en zo heeft Achitofel Absalom en de oudsten van Israël geraden, maar zo en zo heb ik geraden.", "16": "Nu dan, stuur haastig iemand, en laat David weten: Overnacht deze nacht niet bij de vlakke velden van de woestijn, en ga ook snel over; anders wordt de koning verslonden, en al het volk dat bij hem is.", "17": "Jonathan nu en Ahimaäz stonden bij de bron Rogel; en een dienstmeisje ging heen en vertelde het hun; en zij gingen heen en vertelden het aan koning David; want zij mochten zich niet laten zien door in de stad te komen.", "18": "Een jongen zag hen echter, en vertelde het aan Absalom; doch die beiden gingen haastig weg, en kwamen in het huis van een man te Bahurim, die een put had in zijn binnenplaats, en zij daalden daarin af.", "19": "En de vrouw nam en spreidde een deksel over de opening van de put, en strooide daar gepelde granen overheen. Zo werd de zaak niet bekend.", "20": "Toen nu de knechten van Absalom bij de vrouw in het huis kwamen, zeiden zij: Waar zijn Ahimaäz en Jonathan? En de vrouw zei tegen hen: Zij zijn over dat waterstroompje gegaan. En toen zij hen gezocht en niet gevonden hadden, keerden zij terug naar Jeruzalem.", "21": "En het gebeurde, nadat zij weggegaan waren, dat zij uit de put klommen, en heengingen en het aan koning David vertelden; en zij zeiden tegen David: Sta op, en ga snel het water over, want zo heeft Achitofel tegen u geraden.", "22": "Toen stond David op, en al het volk dat bij hem was; en zij gingen de Jordaan over. Bij het morgenlicht ontbrak er niet één die niet de Jordaan overgegaan was.", "23": "Toen Achitofel nu zag dat zijn raad niet was opgevolgd, zadelde hij de ezel, stond op, en ging naar zijn huis in zijn stad, en gaf bevel aan zijn huis, en verhing zich. Zo stierf hij, en werd begraven in het graf van zijn vader.", "24": "David nu kwam te Mahanaïm, en Absalom trok de Jordaan over, hij en alle mannen van Israël met hem.", "25": "En Absalom had Amasa in de plaats van Joab aangesteld over het leger. Amasa nu was de zoon van een man wiens naam Jethra was, de Israëliet, die bij Abigaïl was ingegaan, de dochter van Nahas, zuster van Zeruja, de moeder van Joab.", "26": "Israël nu en Absalom legerden zich in het land Gilead.", "27": "En het gebeurde, toen David te Mahanaïm gekomen was, dat Sobi, de zoon van Nahas, uit Rabba van de kinderen van Ammon, en Machir, de zoon van Ammiël, uit Lodebar, en Barzillai, de Gileadiet, uit Rogelim,", "28": "Beddengoed, en schalen, en aarden vaten, en tarwe, en gerst, en meel, en geroosterd koren, en bonen, en linzen, ook geroosterd,", "29": "En honing, en boter, en schapen, en koeienkaas, brachten naar David, en naar het volk dat bij hem was, om te eten, want zij zeiden: Dit volk is hongerig, en moe, en dorstig in de woestijn."}, "SV": {"1": "Voorts zeide Achitofel tot Absalom: Laat mij nu twaalf duizend mannen uitlezen, dat ik mij opmake en David dezen nacht achterna jage.", "2": "Zo zal ik over hem komen, daar hij moede en slap van handen is, en zal hem verschrikken, en al het volk, dat met hem is, zal vluchten; dan zal ik den koning alleen slaan.", "3": "En ik zal al het volk tot u doen wederkeren; de man, dien gij zoekt, is gelijk het wederkeren van allen; zo zal al het volk in vrede zijn.", "4": "Dit woord nu was recht in Absaloms ogen, en in de ogen van alle oudsten Israëls.", "5": "Doch Absalom zeide: Roep toch ook Husai, den Archiet, en laat ons horen, wat hij ook zegt.", "6": "En als Husai tot Absalom inkwam, zo sprak Absalom tot hem, zeggende: Aldus heeft Achitofel gesproken; zullen wij zijn woord doen? Zo niet, spreek gij.", "7": "Toen zeide Husai tot Absalom: De raad, dien Achitofel op ditmaal geraden heeft, is niet goed.", "8": "Wijders zeide Husai: Gij kent uw vader en zijn mannen, dat zij helden zijn, dat zij bitter van gemoed zijn, als een beer, die van de jongen beroofd is in het veld; daartoe is uw vader een krijgsman, en zal niet vernachten met het volk.", "9": "Zie, nu heeft hij zich verstoken in een der holen, of in een der plaatsen. En het zal geschieden, als er in het eerst *sommigen* onder hen vallen, dat een ieder, die het zal horen, alsdan zal zeggen: Er is een slag geschied onder het volk, dat Absalom navolgt.", "10": "Zo zou hij, die ook een dapper man is, wiens hart is als een leeuwenhart, te enen male smelten; want gans Israël weet, dat uw vader een held is, en het dappere mannen zijn, die met hem zijn.", "11": "Maar ik rade, dat in alle haast tot u verzameld worde gans Israël, van Dan tot Ber-seba toe, als zand, dat aan de zee is, in menigte; en dat uw persoon medega in den strijd.", "12": "Dan zullen wij tot hem komen, in een der plaatsen, waar hij gevonden wordt, en hem gemakkelijk overvallen, gelijk als de dauw op den aardbodem valt; en er zal van hem, en van al de mannen, die met hem zijn, ook niet een worden overgelaten.", "13": "En indien hij zich in een stad zal begeven, zo zal gans Israël koorden tot dezelve stad aandragen, en wij zullen ze tot in de beek nedertrekken, totdat ook niet een steentje aldaar gevonden worde.", "14": "Toen zeide Absalom, en alle man van Israël: De raad van Husai, den Archiet, is beter dan Achitofels raad. Doch de HEERE had het geboden, om den goeden raad van Achitofel te vernietigen, opdat de HEERE het kwaad over Absalom bracht.", "15": "En Husai zeide tot Zadok en tot Abjathar, de priesters: Alzo en alzo heeft Achitofel Absalom en den oudsten van Israël geraden, maar alzo en alzo heb ik geraden.", "16": "Nu dan, zendt haastelijk henen, en boodschapt David, zeggende: Vernacht dezen nacht niet in de vlakke velden der woestijn, en ook ga spoedig over; opdat de koning niet verslonden worde, en al het volk, dat met hem is.", "17": "Jonathan nu en Ahimaäz stonden bij de fontein Rogel; en een dienstmaagd ging henen en zeide het hun aan; en zij gingen henen en zeiden het den koning David aan; want zij mochten zich niet zien laten, dat zij in de stad kwamen.", "18": "Een jongen dan nog zag hen, en zeide het Absalom aan; doch die beiden gingen haastelijk, en kwamen in eens mans huis te Bahurim, dewelke een put had in zijn voorhof, en zij daalden daarin.", "19": "En de vrouw nam en spreidde een deksel over het opene van den put, en strooide gort daarop. Alzo werd de zaak niet bekend.", "20": "Toen nu Absaloms knechten tot de vrouw in het huis kwamen, zeiden zij: Waar zijn Ahimaäz en Jonathan? En de vrouw zeide tot hen: Zij zijn over dat waterriviertje gegaan. En toen zij hen gezocht en niet gevonden hadden, keerden zij weder naar Jeruzalem.", "21": "En het geschiedde, nadat zij weggegaan waren, zo klommen zij uit den put, en gingen henen en boodschapten het den koning David; en zij zeiden tot David: Maakt ulieden op, en gaat haastelijk over het water, want alzo heeft Achitofel tegen ulieden geraden.", "22": "Toen maakte zich David op, en al het volk, dat met hem was; en zij gingen over de Jordaan. Aan het morgenlicht ontbrak er niet tot een toe, die niet over de Jordaan gegaan was.", "23": "Als nu Achitofel zag, dat zijn raad niet gedaan was, zadelde hij den ezel, en maakte zich op, en toog naar zijn huis in zijn stad, en gaf bevel aan zijn huis, en verhing zich. Alzo stierf hij, en werd begraven in zijns vaders graf.", "24": "David nu kwam te Mahanaim, en Absalom toog over de Jordaan, hij en alle mannen van Israël met hem.", "25": "En Absalom had Amasa in Joabs plaats gesteld over het heir. Amasa nu was eens mans zoon, wiens naam was Jethra, de Israëliet, die ingegaan was tot Abigaïl, dochter van Nahas, zuster van Zeruja, Joabs moeder.", "26": "Israël nu en Absalom legerden zich in het land van Gilead.", "27": "En het geschiedde, als David te Mahanaim gekomen was, dat Sobi, de zoon van Nahas, van Rabba der kinderen Ammons, en Machir, de zoon van Ammiël, van Lodebar, en Barzillai, de Gileadiet, van Rogelim,", "28": "Beddewerk, en schalen, en aarden vaten, en tarwe, en gerst, en meel, en geroost *koren*, en bonen, en linzen, ook geroost,", "29": "En honig, en boter, en schapen, en koeienkazen, brachten tot David, en tot het volk, dat met hem was, om te eten, want zij zeiden: Dit volk is hongerig, en moede, en dorstig in de woestijn."}, "KJV": {"1": "Moreover Ahithophel said unto Absalom, Let me now choose out twelve thousand men, and I will arise and pursue after David this night:", "2": "And I will come upon him while he is weary and weak handed, and will make him afraid: and all the people that are with him shall flee; and I will smite the king only:", "3": "And I will bring back all the people unto thee: the man whom thou seekest is as if all returned: so all the people shall be in peace.", "4": "And the saying pleased Absalom well, and all the elders of Israel.", "5": "Then said Absalom, Call now Hushai the Archite also, and let us hear likewise what he saith.", "6": "And when Hushai was come to Absalom, Absalom spake unto him, saying, Ahithophel hath spoken after this manner: shall we do after his saying? if not; speak thou.", "7": "And Hushai said unto Absalom, The counsel that Ahithophel hath given is not good at this time.", "8": "For, said Hushai, thou knowest thy father and his men, that they be mighty men, and they be chafed in their minds, as a bear robbed of her whelps in the field: and thy father is a man of war, and will not lodge with the people.", "9": "Behold, he is hid now in some pit, or in some other place: and it will come to pass, when some of them be overthrown at the first, that whosoever heareth it will say, There is a slaughter among the people that follow Absalom.", "10": "And he also that is valiant, whose heart is as the heart of a lion, shall utterly melt: for all Israel knoweth that thy father is a mighty man, and they which be with him are valiant men.", "11": "Therefore I counsel that all Israel be generally gathered unto thee, from Dan even to Beersheba, as the sand that is by the sea for multitude; and that thou go to battle in thine own person.", "12": "So shall we come upon him in some place where he shall be found, and we will light upon him as the dew falleth on the ground: and of him and of all the men that are with him there shall not be left so much as one.", "13": "Moreover, if he be gotten into a city, then shall all Israel bring ropes to that city, and we will draw it into the river, until there be not one small stone found there.", "14": "And Absalom and all the men of Israel said, The counsel of Hushai the Archite is better than the counsel of Ahithophel. For the LORD had appointed to defeat the good counsel of Ahithophel, to the intent that the LORD might bring evil upon Absalom.", "15": "Then said Hushai unto Zadok and to Abiathar the priests, Thus and thus did Ahithophel counsel Absalom and the elders of Israel; and thus and thus have I counselled.", "16": "Now therefore send quickly, and tell David, saying, Lodge not this night in the plains of the wilderness, but speedily pass over; lest the king be swallowed up, and all the people that are with him.", "17": "Now Jonathan and Ahimaaz stayed by Enrogel; for they might not be seen to come into the city: and a wench went and told them; and they went and told king David.", "18": "Nevertheless a lad saw them, and told Absalom: but they went both of them away quickly, and came to a man's house in Bahurim, which had a well in his court; whither they went down.", "19": "And the woman took and spread a covering over the well's mouth, and spread ground corn thereon; and the thing was not known.", "20": "And when Absalom's servants came to the woman to the house, they said, Where is Ahimaaz and Jonathan? And the woman said unto them, They be gone over the brook of water. And when they had sought and could not find them, they returned to Jerusalem.", "21": "And it came to pass, after they were departed, that they came up out of the well, and went and told king David, and said unto David, Arise, and pass quickly over the water: for thus hath Ahithophel counselled against you.", "22": "Then David arose, and all the people that were with him, and they passed over Jordan: by the morning light there lacked not one of them that was not gone over Jordan.", "23": "And when Ahithophel saw that his counsel was not followed, he saddled his ass, and arose, and gat him home to his house, to his city, and put his household in order, and hanged himself, and died, and was buried in the sepulchre of his father.", "24": "Then David came to Mahanaim. And Absalom passed over Jordan, he and all the men of Israel with him.", "25": "And Absalom made Amasa captain of the host instead of Joab: which Amasa was a man's son, whose name was Ithra an Israelite, that went in to Abigail the daughter of Nahash, sister to Zeruiah Joab's mother.", "26": "So Israel and Absalom pitched in the land of Gilead.", "27": "And it came to pass, when David was come to Mahanaim, that Shobi the son of Nahash of Rabbah of the children of Ammon, and Machir the son of Ammiel of Lodebar, and Barzillai the Gileadite of Rogelim,", "28": "Brought beds, and basons, and earthen vessels, and wheat, and barley, and flour, and parched corn, and beans, and lentiles, and parched pulse,", "29": "And honey, and butter, and sheep, and cheese of kine, for David, and for the people that were with him, to eat: for they said, The people is hungry, and weary, and thirsty, in the wilderness."}}, "tsk": {"1": [{"kopje": "sta ik op", "refs": ["Spr 1:16", "Spr 4:16", "Jes 59:7", "Jes 59:8"]}, {"kopje": "deze nacht", "refs": ["Ps 3:4-6", "Ps 4:9", "Ps 109:2-4"]}], "2": [{"kopje": "slap", "refs": ["2 Sam 16:14", "Deut 25:18"]}, {"kopje": "zal ik hem overvallen", "refs": ["1 Kon 22:31", "Zach 13:7", "Matt 21:38", "Mat  Dan tot Ber-seba toe, en tel het volk, zodat ik het getal van het volk weet.", "1 Kon 2:8": "En zie, bij u is Simeï, de zoon van Gera, de zoon van Jemini, uit Bahurim, die mij vervloekte met een zware vloek, op de dag dat ik naar Mahanaïm ging; maar hij kwam mij tegemoet bij de Jordaan, en ik zwoer hem bij de HEERE en zei: Ik zal u niet met het zwaard doden!", "2 Kron 26:8": "En de Ammonieten gaven Uzzia geschenken; en zijn naam ging tot aan de ingang van Egypte, want hij sterkte zich tot het uiterste.", "Hand 3:17": "En nu, broeders, ik weet dat u het door onwetendheid hebt gedaan, zoals ook uw leiders.", "Deut 1:28": "Waarheen zouden wij optrekken? Onze broeders hebben ons hart doen smelten, en zeiden: Het is een volk, groter en langer dan wij; de steden zijn groot, en versterkt tot aan de hemel toe; ook hebben wij daar kinderen van de Enakieten gezien.", "2 Sam 12:29": "Toen verzamelde David al het volk, en trok naar Rabba; en hij streed tegen haar, en nam haar in.", "2 Sam 23:9": "En na hem was Eleazar, de zoon van Dodo, zoon van Ahohi; deze was onder de drie helden met David, toen zij de Filistijnen beschimpten, die daar ten strijde verzameld waren, en de mannen van Israël waren teruggetrokken.", "Spr 17:12": "Beter dat een berin die van haar jongen beroofd is, een man tegemoetkomt, dan een dwaas in zijn dwaasheid.", "Joz 13:26": "En van Hesbon af tot Ramath-mizpa en Betonim toe; en van Mahanaim af tot aan de grens van Debir toe;", "Jes 13:7": "Daarom zullen alle handen slap worden, en het hart van elk mens zal versmelten;", "Ps 109:2-4": "Want de mond van de goddeloze en de mond van het bedrog zijn tegen mij opengedaan; zij hebben tegen mij gesproken met een valse tong. En met hatelijke woorden hebben zij mij omsingeld; ja, zij hebben mij bestreden zonder oorzaak. Voor mijn liefde staan zij mij tegen; maar ik was steeds in het gebed.", "Ezra 5:5": "Doch het oog van hun God was over de oudsten van de Joden, zodat men hen niet kon tegenhouden, totdat de zaak bij Darius kwam, en zij daarna daarover een brief terugbrachten.", "Ps 75:8": "Maar God is Rechter; Hij vernedert deze, en verhoogt die.", "Spr 6:5": "red uzelf, als een ree uit de hand van de jager, en als een vogel uit de hand van de vogelvanger.", "Jes 59:7": "Hun voeten lopen naar het kwade, en zij haasten zich om onschuldig bloed te vergieten; hun gedachten zijn gedachten van ongerechtigheid, verwoesting en verderf is op hun wegen.", "2 Sam 16:5": "Toen koning David tot bij Bahurim kwam, zie, daar kwam een man vandaan uit het geslacht van het huis van Saul, van wie de naam Simeï was, de zoon van Gera; hij liep almaar door en vloekte.", "1 Kor 1:19": "Want er is geschreven: Ik zal de wijsheid van de wijzen doen vergaan, en het verstand van de verstandigen zal Ik tenietdoen.", "Jes 8:10": "Beraadslaag een plan, toch zal het vernietigd worden; spreek een woord, toch zal het niet standhouden; want God is met ons!", "1 Sam 17:17": "En Isaï zei tegen zijn zoon David: Neem toch voor uw broers een efa van dit geroosterde koren, en deze tien broden, en breng ze snel naar het leger, naar uw broers.", "Ezech 29:19": "Daarom, zo zegt de Heere HEERE: Zie, Ik zal Nebukadrezar, de koning van Babel, Egypteland geven; en hij zal haar menigte wegvoeren, en haar buit buitmaken, en haar roof roven, en het zal het loon zijn voor zijn leger.", "Joz 7:4": "Zo trokken van het volk ongeveer drieduizend man daarheen op; en zij vluchtten voor de mannen van Ai.", "Hos 13:8": "Ik ontmoette hen als een berin die van haar jongen beroofd is, en scheurde het omhulsel van hun hart open; en Ik verslond hen daar als een leeuw; het wilde dier van het veld verscheurde hen.", "Ps 17:14": "Met Uw hand van de mensen, o HEERE! Van de mensen, die van de wereld zijn, wier deel in dit leven is, wier buik U vult met Uw verborgen schat; de kinderen worden verzadigd, en zij laten hun overschot achter aan hun kinderen.", "2 Sam 19:32": "Barzillai nu was zeer oud, een man van tachtig jaar; en hij had de koning van voedsel voorzien toen hij in Mahanaïm verbleef; want hij was een zeer belangrijk man.", "1 Kron 6:8": "En Ahitub verwekte Zadok, en Zadok verwekte Ahimaäz;", "2 Sam 19:13": "En tegen Amasa moet u zeggen: Bent u niet mijn gebeente en mijn vlees? God doe mij zo, en meer dan dat, als u niet legeraanvoerder wordt voor mijn aangezicht, alle dagen, in de plaats van Joab.", "2 Sam 15:35": "En zijn niet Zadok en Abjathar, de priesters, daar bij u? Zo zal het gebeuren, dat u alles wat u uit het huis van de koning zult horen, aan de priesters, Zadok en Abjathar, zult bekendmaken.", "Matt 26:31": "Toen zei Jezus tegen hen: U zult allen deze nacht aan Mij geërgerd worden; want er is geschreven: Ik zal de Herder slaan, en de schapen van de kudde zullen verstrooid worden.", "1 Sam 25:18": "Toen haastte Abigaïl zich, en nam tweehonderd broden, en twee lederzakken wijn, en vijf toebereide schapen, en vijf maten geroosterd koren, en honderd stukken rozijnen, en tweehonderd klompen vijgen, en legde die op ezels.", "2 Sam 17:17-21": "Jonathan nu en Ahimaäz stonden bij de bron Rogel; en een dienstmeisje ging heen en vertelde het hun; en zij gingen heen en vertelden het aan koning David; want zij mochten zich niet laten zien door in de stad te komen. Een jongen zag hen echter, en vertelde het aan Absalom; doch die beiden gingen haastig weg, en kwamen in het huis van een man te Bahurim, die een put had in zijn binnenplaats, en zij daalden daarin af. En de vrouw nam en spreidde een deksel over de opening van de put, en strooide daar gepelde granen overheen. Zo werd de zaak niet bekend.", "Ps 48:5-8": "Want zie, de koningen waren verzameld; zij waren samen doorgetrokken. Zoals zij het zagen, zo waren zij verwonderd; zij werden verschrikt, zij haastten weg. Beving greep hen daar aan, smart als van een barende vrouw.", "Ex 15:9-19": "De vijand zei: Ik zal vervolgen, ik zal achterhalen, ik zal de buit delen, mijn ziel zal van hen vervuld worden, ik zal mijn zwaard trekken, mijn hand zal hen uitroeien. U hebt met Uw wind geblazen; de zee heeft hen gedekt, zij zonken onder als lood in geweldige wateren! O HEERE! Wie is als U onder de goden? Wie is als U, verheerlijkt in heiligheid, ontzagwekkend in lofzangen, die wonderen doet?", "Gen 50:20": "U wel, u hebt kwaad tegen mij gedacht; doch God heeft dat ten goede gedacht; opdat Hij deed, zoals het op deze dag is, om een groot volk in het leven te behouden.", "2 Kron 36:23": "Zo zegt Kores, koning van Perzië: De HEERE, de God van de hemel, heeft mij alle koninkrijken van de aarde gegeven; en Hij heeft mij bevolen Hem een huis te bouwen te Jeruzalem, dat in Juda is; wie is er onder u van al Zijn volk? De HEERE, zijn God, zij met hem, en hij trekt op.", "Richt 20:1": "Toen trokken alle kinderen van Israël uit, en de gemeenschap verzamelde zich, als één man, van Dan af tot Ber-seba toe, ook het land van Gilead, tot de HEERE te Mizpa.", "2 Sam 17:1-22": "Verder zei Achitofel tegen Absalom: Laat mij nu twaalfduizend man uitkiezen, dan sta ik op en jaag David deze nacht achterna. Zo zal ik hem overvallen terwijl hij moe en slap van handen is, en zal hem schrik aanjagen; en al het volk dat bij hem is zal vluchten; dan zal ik de koning alleen doden. En ik zal al het volk naar u laten terugkeren; de man die u zoekt, is gelijk aan het terugkeren van allen; zo zal al het volk in vrede zijn.", "Jes 10:13": "Omdat hij gezegd heeft: Door de kracht van mijn hand heb ik het gedaan, en door mijn wijsheid, want ik ben verstandig; en ik heb de landpalen van de volken weggenomen, en heb hun voorraad geroofd, en heb als een geweldige de inwoners doen neerdalen;", "Pred 2:26": "Want Hij geeft wijsheid, kennis en vreugde aan de mens die goed is voor Zijn aangezicht; maar aan de zondaar geeft Hij de bezigheid om te verzamelen en te vergaderen, opdat Hij het geeft aan wie goed is voor Gods aangezicht. Dit is ook ijdelheid en kwelling van de geest.", "Ps 55:24": "Maar U, o God! zult hen doen neerdalen in de put van het verderf; de mannen van het bloed en het bedrog zullen hun dagen niet tot de helft brengen; ik, daarentegen, zal op U vertrouwen.", "Deut 32:14": "Boter van koeien, en melk van klein vee, met het vet van de lammeren en van de rammen, die in Basan weiden, en van de bokken, met het vette van de nieren van tarwe; en het druivenbloed, reine wijn, hebt u gedronken.", "Ps 35:25": "Laat hen niet zeggen in hun hart: Haha, onze ziel! Laat hen niet zeggen: Wij hebben hem verslonden!", "1 Sam 31:4": "Toen zei Saul tegen zijn wapendrager: Trek uw zwaard, en doorsteek mij daarmee, anders komen deze onbesnedenen mij doorsteken en de spot met mij drijven. Maar zijn wapendrager wilde dit niet, want hij was zeer bang. Toen nam Saul het zwaard en viel erin.", "Spr 28:8": "Wie zijn bezit vermeerdert met woeker en met overwinst, verzamelt dat voor hem die zich over de arme ontfermt.", "2 Sam 18:19-33": "Toen zei Ahimaäz, de zoon van Zadok: Laat mij toch snel gaan, en de koning berichten dat de HEERE hem recht gedaan heeft tegenover zijn vijanden. Maar Joab zei tegen hem: U zult vandaag geen boodschapper zijn, maar een andere dag zult u berichten; vandaag zult u niet berichten, omdat de zoon van de koning dood is. En Joab zei tegen Cuschi: Ga heen, en vertel de koning wat u gezien hebt; en Cuschi boog zich voor Joab, en liep heen.", "Ps 105:17": "Hij zond een man voor hun aangezicht heen; Jozef werd verkocht tot een slaaf.", "Joz 2:5": "En het gebeurde, toen men de poort zou sluiten, toen het donker was, dat die mannen naar buiten gingen; ik weet niet waarheen die mannen gegaan zijn; jaag hen snel na, want u zult ze inhalen.", "Filem 1:1": "Paulus, een gevangene van Christus Jezus, en Timotheüs, de broeder, aan Filemon, de geliefde, en onze medearbeider,", "1 Kron 11:25-47": "Zie, hij was de meest geëerde van die dertig; toch kwam hij niet aan de drie toe. En David stelde hem over zijn lijfwacht. De helden nu van de legers waren: Asahel, de broer van Joab; Elhanan, de zoon van Dodo, van Bethlehem; Sammoth, de Harodiet; Helez, de Peloniet;", "1 Sam 17:18": "Maar breng deze tien melkkazen naar de aanvoerder over duizend; en u zult naar uw broers omzien, of het hun goed gaat, en u zult van hen een teken meenemen.", "2 Sam 16:1": "Toen David een klein stuk voorbij de top gegaan was, zie, daar ontmoette Ziba hem, de knecht van Mefiboseth, met een paar gezadelde ezels, en daarop tweehonderd broden, honderd stukken rozijnen, honderd stukken zomervruchten en een leren zak wijn.", "2 Sam 10:2": "Toen zei David: Ik zal weldadigheid doen aan Hanun, de zoon van Nahas, zoals zijn vader weldadigheid aan mij gedaan heeft. Zo zond David heen, om hem door de dienst van zijn knechten te troosten over zijn vader. En de knechten van David kwamen in het land van de kinderen Ammons.", "2 Sam 19:31": "Barzillai, de Gileadiet, kwam ook naar beneden uit Rogelim; en hij trok met de koning de Jordaan over, om hem over de Jordaan te begeleiden.", "Job 20:17": "De stromen, rivieren, beken van honing en boter zal hij niet zien.", "Jes 43:14": "Zo zegt de HEERE, uw Verlosser, de Heilige van Israël: Om uw wil heb Ik naar Babel gezonden, en heb hen allen als vluchtelingen doen neerdalen, te weten de Chaldeeën, in de schepen, waarop zij juichten.", "Ex 16:31": "En het huis van Israël noemde het Man; en het was als korianderzaad, wit, en de smaak ervan was als honingkoeken.", "Spr 28:15": "De goddeloze, heersend over een arm volk, is een brullende leeuw, en een beer, die heen en weer rondloopt.", "Richt 5:25": "Water eiste hij, melk gaf zij; in een herenschaal bracht zij boter.", "2 Sam 3:21": "Toen zei Abner tegen David: Ik zal opstaan en heengaan, en heel Israël verzamelen bij mijn heer de koning, zodat zij een verbond met u sluiten, en u regeert over alles wat uw hart begeert. Zo liet David Abner gaan, en hij ging in vrede.", "Deut 2:30": "Maar Sihon, de koning van Hesbon, wilde ons daar niet doorheen laten trekken; want de HEERE, uw God, verhardde zijn geest en verstokte zijn hart, opdat Hij hem in uw hand zou geven, zoals het is op deze dag.", "1 Sam 2:6-9": "De HEERE doodt en maakt levend; Hij doet naar het graf neerdalen, en Hij doet weer opkomen. De HEERE maakt arm en maakt rijk; Hij vernedert, ook verhoogt Hij. Hij verheft de geringe uit het stof, en de nooddruftige verhoogt Hij uit de vuilnis, om hen te doen zitten bij de vorsten, dat Hij hen de stoel van de eer laat beërven; want de fundamenten van het aardrijk zijn van de HEERE, en Hij heeft de wereld daarop gezet.", "2 Sam 16:23": "In die dagen was de raad die Achitofel gaf, als had men naar het woord van God gevraagd; zo was alle raad van Achitofel, zowel bij David als bij Absalom.", "1 Sam 14:50": "En de naam van Sauls vrouw was Ahinoam, een dochter van Ahimaäz; en de naam van zijn legeraanvoerder was Abner, een zoon van Ner, Sauls oom.", "Neh 6:16": "En het gebeurde, toen al onze vijanden dit hoorden, dat alle heidenvolken die rondom ons waren, bevreesd werden en zeer in aanzien daalden in hun eigen ogen; want zij begrepen dat dit werk door onze God tot stand gebracht was.", "1 Sam 27:11": "En David liet geen man en geen vrouw in leven om naar Gath te brengen, en hij zei: Anders zouden zij misschien over ons vertellen en zeggen: Zo heeft David gedaan! En zo was zijn gewoonte, al de dagen dat hij in het land van de Filistijnen gewoond heeft.", "2 Sam 15:34": "maar als u teruggaat naar de stad, en tegen Absalom zegt: Uw knecht, ik zal van de koning zijn; ik ben eerder wel de knecht van uw vader geweest, maar nu zal ik uw knecht zijn; dan zou u voor mij de raad van Achitofel teniet doen.", "Hebr 11:32-34": "En wat zal ik nog meer zeggen? Want de tijd zou mij tekortschieten, als ik zou vertellen over Gideon, en Barak, en Simson, en Jefta, en David, en Samuël, en de profeten; die door het geloof koninkrijken hebben overwonnen, gerechtigheid gedaan, de beloften verkregen, de muilen van de leeuwen toegestopt, de kracht van het vuur hebben geblust, aan de scherpte van het zwaard zijn ontkomen, vanuit zwakheid kracht hebben gekregen, in de strijd sterk zijn geworden, legers van vreemden op de vlucht hebben gebracht;", "Num 31:6": "En Mozes zond hen ten strijde, duizend van elke stam, hen en Pinehas, de zoon van Eleazar, de priester, ten strijde, met de heilige voorwerpen en de trompetten om te schallen in zijn hand.", "2 Sam 11:1": "En het gebeurde met de terugkeer van het jaar, ten tijde dat de koningen uittrekken, dat David Joab, en zijn knechten met hem, en heel Israël, uitzond om de kinderen van Ammon te verderven, en Rabba te belegeren. Doch David bleef te Jeruzalem.", "Jes 19:1": "De last van Egypte. Zie, de HEERE rijdt op een snelle wolk, en Hij zal in Egypte komen; en de afgoden van Egypte zullen bewogen worden vanwege Zijn aangezicht, en het hart van de Egyptenaren zal smelten in hun binnenste.", "1 Kon 16:18": "En het gebeurde, toen Zimri zag dat de stad ingenomen was, dat hij het paleis van het huis van de koning inging, en het huis van de koning boven zich met vuur verbrandde, en stierf;", "Ps 17:13": "Sta op, HEERE, kom hem voor, werp hem neer; bevrijd mijn ziel met Uw zwaard van de goddeloze;", "Jes 57:21": "De goddelozen, zegt mijn God, hebben geen vrede.", "Gen 32:28": "Toen zei Hij: Uw naam zal voortaan niet meer Jakob heten, maar Israël; want u hebt zich als een vorst gedragen tegenover God en tegenover de mensen, en hebt de overhand gekregen.", "Richt 10:7-18": "Toen ontstak de toorn van de HEERE tegen Israël; en Hij verkocht hen in de hand van de Filistijnen en in de hand van de Ammonieten. Die verdrukten en vertrapten de Israëlieten in datzelfde jaar; achttien jaar lang onderdrukten zij alle Israëlieten die aan de overkant van de Jordaan waren, in het land van de Amorieten, dat in Gilead ligt. Daarbij trokken de Ammonieten de Jordaan over om te strijden, ook tegen Juda, tegen Benjamin en tegen het huis van Efraïm, zodat Israël erg in het nauw kwam.", "2 Sam 15:32-34": "En het gebeurde, toen David tot op de hoogte kwam, waar hij God aanbad, zie, toen ontmoette Husai, de Archiet, hem, met zijn kleed gescheurd, en aarde op zijn hoofd. En David zei tegen hem: Als u met mij meegaat, zult u mij tot een last zijn; maar als u teruggaat naar de stad, en tegen Absalom zegt: Uw knecht, ik zal van de koning zijn; ik ben eerder wel de knecht van uw vader geweest, maar nu zal ik uw knecht zijn; dan zou u voor mij de raad van Achitofel teniet doen.", "2 Sam 17:6-14": "En toen Husai bij Absalom binnenkwam, sprak Absalom tegen hem en zei: Zo heeft Achitofel gesproken; zullen wij doen wat hij zegt? Zo niet, spreek u dan. Toen zei Husai tegen Absalom: De raad die Achitofel deze keer gegeven heeft, is niet goed. Verder zei Husai: U kent uw vader en zijn mannen, dat zij helden zijn, en verbitterd van gemoed, als een beer die van haar jongen beroofd is in het veld; daarbij is uw vader een krijgsman, en zal niet overnachten bij het volk.", "1 Kron 20:1-3": "Het gebeurde nu in de tijd dat het jaar weer omging, in de tijd dat de koningen ten strijde uittrokken, dat Joab het leger aanvoerde en het land van de kinderen Ammons verwoestte; en hij kwam en belegerde Rabba. Maar David bleef in Jeruzalem. En Joab sloeg Rabba en verwoestte het. En David nam de kroon van hun koning van zijn hoofd, en hij bevond dat die in gewicht een talent goud woog, en er zat edelgesteente aan; en die werd op Davids hoofd gezet, en hij bracht zeer veel van het roof uit de stad naar buiten. Hij bracht ook al het volk dat daarin was naar buiten, en hij zaagde hen met de zaag, en met ijzeren dorswagens, en met bijlen; en zo deed David met al de steden van de kinderen Ammons. Toen keerde David met al het volk terug naar Jeruzalem.", "2 Sam 17:1-23": "Verder zei Achitofel tegen Absalom: Laat mij nu twaalfduizend man uitkiezen, dan sta ik op en jaag David deze nacht achterna. Zo zal ik hem overvallen terwijl hij moe en slap van handen is, en zal hem schrik aanjagen; en al het volk dat bij hem is zal vluchten; dan zal ik de koning alleen doden. En ik zal al het volk naar u laten terugkeren; de man die u zoekt, is gelijk aan het terugkeren van allen; zo zal al het volk in vrede zijn.", "2 Sam 3:16": "En haar man ging met haar mee, huilend achter haar aan lopend, tot Bahurim toe. Toen zei Abner tegen hem: Ga weg, keer terug. En hij keerde terug.", "Jes 58:7": "Is het niet dit, dat u de hongerige uw brood meedeelt, en de armen, verdrevenen, in huis brengt? Als u een naakte ziet, dat u hem dekt, en dat u zich voor uw eigen vlees niet verbergt?", "1 Sam 27:12": "En Achis geloofde David, en zei: Hij heeft zich helemaal onmogelijk gemaakt bij zijn volk, in Israël; daarom zal hij eeuwig mijn knecht zijn.", "2 Sam 23:20": "Verder Benaja, de zoon van Jojada, de zoon van een dappere man, groot van daden, uit Kabzeel; die versloeg twee sterke leeuwen van Moab; ook ging hij af, en sloeg een leeuw in het midden van een kuil in de sneeuwtijd.", "Openb 17:17": "Want God heeft hun in hun hart gegeven dat zij Zijn plan uitvoeren, en dat zij één en dezelfde gezindheid uitvoeren, en dat zij hun koninkrijk aan het beest geven, totdat de woorden van God vervuld zullen zijn.", "1 Sam 31:5": "Toen zijn wapendrager zag dat Saul dood was, viel hij ook in zijn zwaard en stierf met hem.", "Jes 44:28": "Die van Kores zegt: Hij is Mijn herder, en hij zal al Mijn welbehagen volbrengen; en zegt ook tot Jeruzalem: Word gebouwd; en tot de tempel: Word gegrondvest.", "Job 5:12": "Hij maakt teniet de gedachten van de arglistigen; zodat hun handen niets uitrichten.", "1 Sam 14:14": "Deze eerste aanval, waarmee Jonathan en zijn wapendrager ongeveer twintig man versloegen, gebeurde op ongeveer de helft van een halve morgen land, zoveel als een span ossen kan omploegen.", "Spr 6:4": "Laat uw ogen geen slaap toe, en uw oogleden geen sluimering;", "Ezech 21:27": "Ik zal die kroon omgekeerd, omgekeerd, omgekeerd neerzetten; ja, zij zal er niet zijn, totdat hij komt die daartoe recht heeft, en aan wie Ik hem geven zal.", "Ps 5:11": "Verklaar hen schuldig, o God; laat hen vervallen van hun raadslagen; drijf hen weg om de veelheid van hun overtredingen, want zij zijn opstandig tegen U.", "2 Sam 19:15": "Toen keerde de koning terug, en kwam tot aan de Jordaan; en Juda kwam naar Gilgal, om de koning tegemoet te gaan, om de koning over de Jordaan te brengen.", "1 Kron 5:26": "Zo verwekte de God van Israël de geest van Pul, de koning van Assyrië, en de geest van Tiglath-Pilneser, de koning van Assyrië, die voerde hen gevankelijk weg, te weten de Rubenieten, en de Gadieten, en de halve stam van Manasse; en hij bracht hen naar Halah, en Habor, en Hara, en aan de rivier Gozan, tot op deze dag.", "Matt 21:38": "Maar toen de landbouwers de zoon zagen, zeiden zij onder elkaar: Deze is de erfgenaam, kom, laten we hem doden en zijn erfenis voor onszelf houden.", "Est 5:14": "Toen zei zijn vrouw Zeres tegen hem, alsook al zijn vrienden: Laat men een galg maken, vijftig el hoog, en zeg morgen tegen de koning dat men Mordechai daaraan laat hangen; ga dan vrolijk met de koning naar die maaltijd. Dit voorstel nu leek Haman goed, en hij liet de galg maken.", "1 Sam 18:17": "Daarom zei Saul tegen David: Zie, mijn oudste dochter Merab zal ik u tot vrouw geven; alleen, wees mij een dapper man en voer de oorlogen van de HEERE. Want Saul zei: Laat mijn hand niet tegen hem zijn, maar laat de hand van de Filistijnen tegen hem zijn.", "2 Sam 23:16": "Toen braken die drie helden door het leger van de Filistijnen, en putten water uit Bethlehems bornput, die in de poort is, en droegen het, en kwamen bij David; maar hij wilde dat niet drinken, maar goot het uit voor de HEERE.", "1 Kron 2:17": "En Abigaïl baarde Amasa; en de vader van Amasa was Jether, een Ismaëliet.", "Jes 54:17": "Elk instrument dat tegen u gemaakt wordt, zal niet gelukken, en elke tong, die in het gericht tegen u opstaat, zult u verdoemen; dit is het erfdeel van de knechten van de HEERE, en hun gerechtigheid is uit Mij, spreekt de HEERE.", "Richt 3:28": "En hij zei tegen hen: Volg mij na; want de HEERE heeft uw vijanden, de Moabieten, in uw hand gegeven. En zij trokken af, hem na, en namen de doorwaadbare plaatsen van de Jordaan in naar Moab, en lieten niemand oversteken.", "2 Kon 18:23": "Nu dan, wed toch met mijn heer, de koning van Assyrië; en ik zal u tweeduizend paarden geven, als u de ruiters daarop zult kunnen geven.", "1 Kon 2:26": "En tegen Abjathar, de priester, zei de koning: Ga naar Anathoth, naar uw akkers; want u verdient de dood; maar op deze dag zal ik u niet doden, omdat u de ark van de Heere HEERE gedragen hebt voor het aangezicht van mijn vader David, en omdat u verdrukt bent geweest in alles waarin mijn vader verdrukt was.", "2 Sam 2:29": "Abner dan en zijn mannen gingen diezelfde hele nacht over de vlakte; en zij gingen over de Jordaan en trokken heel Bithron door, en kwamen bij Mahanaim.", "Richt 7:5": "En hij liet het volk afgaan naar het water. Toen zei de HEERE tegen Gideon: Ieder die met zijn tong uit het water zal lekken, zoals een hond zou lekken, hem zult u apart zetten; evenzo ieder die op zijn knieën zal bukken om te drinken.", "Ex 14:4": "En Ik zal het hart van Farao verstokken, dat hij hen najaagt; en Ik zal aan Farao en aan zijn hele leger verheerlijkt worden, zodat de Egyptenaren zullen weten dat Ik de HEERE ben. En zij deden zo.", "1 Kron 19:17": "Toen dit aan David werd bericht, verzamelde hij heel Israël, en trok over de Jordaan, en kwam tot hen, en stelde de slagorde tegen hen op. Toen David de slagorde tegen de Syriërs opgesteld had, streden zij met hem.", "2 Kor 5:4": "Want ook wij die in deze tent zijn, zuchten, bezwaard als wij zijn; omdat wij niet ontkleed willen worden, maar overkleed, opdat het sterfelijke door het leven verslonden wordt.", "1 Kron 6:53": "Zadok zijn zoon; Ahimaäz zijn zoon.", "Richt 11:32": "Zo trok Jeftha door naar de kinderen van Ammon, om tegen hen te strijden; en de HEERE gaf hen in zijn hand.", "Jes 41:4": "Wie heeft dit gedaan en tot stand gebracht, terwijl Hij de geslachten riep van het begin af? Ik, de HEERE, Die de Eerste ben, en met de Laatste ben Ik Dezelfde.", "2 Sam 17:17-20": "Jonathan nu en Ahimaäz stonden bij de bron Rogel; en een dienstmeisje ging heen en vertelde het hun; en zij gingen heen en vertelden het aan koning David; want zij mochten zich niet laten zien door in de stad te komen. Een jongen zag hen echter, en vertelde het aan Absalom; doch die beiden gingen haastig weg, en kwamen in het huis van een man te Bahurim, die een put had in zijn binnenplaats, en zij daalden daarin af. En de vrouw nam en spreidde een deksel over de opening van de put, en strooide daar gepelde granen overheen. Zo werd de zaak niet bekend.", "Gen 32:10": "Ik ben geringer dan al de weldaden en al de trouw die U aan Uw knecht bewezen hebt; want met mijn staf ben ik deze Jordaan overgestoken, en nu ben ik tot twee legers geworden!", "Spr 21:18": "De goddeloze is een rantsoen voor de rechtvaardigen, en de trouweloze voor de oprechten.", "1 Kon 18:5": "En Achab had tegen Obadja gezegd: Trek door het land, naar alle waterfonteinen en naar alle rivieren; misschien vinden wij gras, zodat wij de paarden en de muilezels in leven houden, en niets van het vee hoeven uit te roeien.", "Joz 8:6": "Laat hen dan achter ons aan komen, totdat wij hen van de stad weggetrokken hebben; want zij zullen zeggen: Zij vluchten voor ons, zoals eerst; zo zullen wij voor hen vluchten.", "Luk 8:3": "en Johanna, de vrouw van Chusas, de rentmeester van Herodes, en Susanna, en vele anderen, die Hem dienden met hun bezittingen.", "Gen 49:9": "Juda is een leeuwenwelp! U bent van de roof opgeklommen, mijn zoon! Hij kromt zich, hij legt zich neer als een leeuw, en als een oude leeuw; wie zal hem doen opstaan?", "1 Sam 22:1": "Toen ging David vandaar weg, en ontkwam naar de spelonk van Adullam. En zijn broers hoorden het, en het hele huis van zijn vader, en ze kwamen daarheen naar hem toe.", "2 Sam 15:36": "Zie, hun beide zonen zijn daar bij hen, Ahimaäz, de zoon van Zadok, en Jonathan, de zoon van Abjathar; zo zult u door hun hand alles wat u zult horen, naar mij laten overbrengen.", "Job 10:10": "Hebt U mij niet als melk uitgegoten, en mij als een kaas laten stremmen?", "Spr 19:21": "In het hart van de man zijn veel gedachten; maar de raad van de HEERE, die zal standhouden.", "1 Tess 5:3": "Want wanneer zij zullen zeggen: Het is vrede en veilig; dan zal een plotseling verderf hun overkomen, zoals de barensweeën een zwangere vrouw overkomen; en zij zullen het geenszins ontvluchten;", "Jes 48:14": "Verzamel u, u allen, en hoor; wie onder hen heeft deze dingen verkondigd? De HEERE heeft hem lief, Hij zal Zijn welbehagen tegen Babel doen, en Zijn arm zal tegen de Chaldeeën zijn.", "2 Sam 16:16-19": "En het gebeurde, toen Husai, de Archiet, Davids vriend, bij Absalom kwam, dat Husai tegen Absalom zei: Leve de koning, leve de koning! Maar Absalom zei tegen Husai: Is dit uw trouw aan uw vriend? Waarom bent u niet met uw vriend meegegaan? En Husai zei tegen Absalom: Nee, maar wie de HEERE verkiest, en dit hele volk, en alle mannen van Israël, van hem zal ik zijn, en bij hem zal ik blijven.", "Est 9:1": "In de twaalfde maand nu (dat is de maand Adar), op de dertiende dag daarvan, toen het woord en de wet van de koning nabij gekomen waren om uitgevoerd te worden, op de dag dat de vijanden van de Joden hoopten over hen te heersen, gebeurde het omgekeerde: de Joden zelf heersten over hun haters.", "Ezra 1:1": "In het eerste jaar nu van Kores, koning van Perzië, opdat het woord van de HEERE, uit de mond van Jeremia, volbracht werd, wekte de HEERE de geest van Kores, koning van Perzië, op, zodat hij een boodschap liet doorgeven door heel zijn koninkrijk, zelfs ook op schrift, en zei:", "Richt 20:32": "Toen zeiden de kinderen van Benjamin: Zij zijn voor ons aangezicht geslagen, zoals eerst; maar de kinderen van Israël zeiden: Laat ons vluchten, en hen van de stad aftrekken naar de wegen.", "Jer 52:3": "Want het gebeurde vanwege de toorn van de HEERE tegen Jeruzalem en Juda, totdat Hij hen van Zijn aangezicht weggeworpen had; en Zedekia kwam in opstand tegen de koning van Babel.", "2 Kron 27:5": "Hij streed ook tegen de koning van de Ammonieten, en had de overhand over hen, zodat de Ammonieten hem in datzelfde jaar honderd talenten van het zilver gaven, en tienduizend kor tarwe, en tienduizend gerst; dit brachten de Ammonieten hem opnieuw, ook in het tweede en in het derde jaar.", "2 Sam 20:19": "Ik ben een van de vreedzamen, van de getrouwen in Israël, en u zoekt een stad te doden, die een moeder is in Israël; waarom zou u het erfdeel van de HEERE verslinden?", "Ps 33:9": "Want Hij spreekt, en het is er; Hij gebiedt, en het staat er.", "2 Sam 17:5-15": "Doch Absalom zei: Roep toch ook Husai, de Archiet, en laten we horen wat ook hij zegt. En toen Husai bij Absalom binnenkwam, sprak Absalom tegen hem en zei: Zo heeft Achitofel gesproken; zullen wij doen wat hij zegt? Zo niet, spreek u dan. Toen zei Husai tegen Absalom: De raad die Achitofel deze keer gegeven heeft, is niet goed.", "Ps 84:12": "Want God, de HEERE, is een Zon en Schild; de HEERE zal genade en eer geven; Hij zal het goede niet onthouden aan hen die in oprechtheid wandelen.", "Jer 51:21": "En door u zal Ik in stukken slaan het paard en zijn ruiter; en door u zal Ik in stukken slaan de wagen en zijn ruiter.", "Spr 27:12": "De schrandere ziet het kwaad, en verbergt zich; de eenvoudigen gaan door, en worden gestraft.", "Num 24:10-13": "Toen ontstak de toorn van Balak tegen Bileam, en hij sloeg zijn handen samen; en Balak zei tegen Bileam: Ik heb u geroepen om mijn vijanden te vervloeken; maar zie, u hebt hen nu al driemaal gezegend! En nu, pak u weg naar uw plaats! Ik had gezegd dat ik u hoog zou eren; maar zie, de HEERE heeft u die eer onthouden! Toen zei Bileam tegen Balak: Heb ik ook niet tegen uw boden, die u naar mij gezonden hebt, gesproken en gezegd:", "Spr 16:33": "Het lot wordt in de schoot geworpen; maar de hele beschikking daarover is van de HEERE.", "Joz 18:16": "En dit gebied gaat af tot aan het uiterste van de berg, die tegenover het dal van de zoon van Hinnom is, dat in het dal van de Refaïeten is tegen het noorden; en gaat af door het dal van Hinnom, aan de zijde van de Jebusieten zuidwaarts, en gaat af naar de bron van Rogel;", "2 Sam 15:28": "Zie, ik zal wachten op de vlakke velden van de woestijn, totdat er een woord van u komt, dat men het mij aanzegt.", "2 Sam 16:14": "En de koning kwam aan, en al het volk dat bij hem was, moede zijnde; en hij verkwikte zich daar.", "2 Sam 17:15-22": "En Husai zei tegen Zadok en tegen Abjathar, de priesters: Zo en zo heeft Achitofel Absalom en de oudsten van Israël geraden, maar zo en zo heb ik geraden. Nu dan, stuur haastig iemand, en laat David weten: Overnacht deze nacht niet bij de vlakke velden van de woestijn, en ga ook snel over; anders wordt de koning verslonden, en al het volk dat bij hem is. Jonathan nu en Ahimaäz stonden bij de bron Rogel; en een dienstmeisje ging heen en vertelde het hun; en zij gingen heen en vertelden het aan koning David; want zij mochten zich niet laten zien door in de stad te komen.", "2 Sam 15:30": "En David ging op door de opgang van de olijven, terwijl hij opging en weende, en zijn hoofd was bedekt; en hij zelf ging blootsvoets; ook had heel het volk dat bij hem was, ieder zijn hoofd bedekt, en zij gingen op, terwijl zij opgingen en weenden.", "2 Sam 15:24-36": "En zie, Zadok was ook daar, en alle Levieten met hem, die de ark van het verbond van God droegen; en zij zetten de ark van God neer, en Abjathar klom op, totdat heel het volk uit de stad klaar was met overgaan. Toen zei de koning tegen Zadok: Breng de ark van God terug in de stad; als ik genade zal vinden in de ogen van de HEERE, dan zal Hij mij terughalen, en zal Hij mij haar laten zien, alsook Zijn woning. Maar als Hij zo zal zeggen: Ik heb geen behagen in u; zie, hier ben ik, laat Hij met mij doen zoals het goed is in Zijn ogen.", "Jes 7:22": "En het zal gebeuren, dat hij vanwege de overvloed van de melk, die zij geven zullen, boter zal eten; ja, ieder die overgebleven is in het midden van het land, die zal boter en honing eten.", "2 Kron 25:16": "En het gebeurde, toen hij tot hem sprak, dat hij hem zei: Heeft men u tot raadgever van de koning aangesteld? Houd op; waarom zou men u slaan? Toen hield de profeet op, en zei: Ik merk dat God besloten heeft u te vernietigen, omdat u dit gedaan hebt, en naar mijn raad niet hebt geluisterd.", "Spr 19:3": "De dwaasheid van de mens verdraait zijn weg; en zijn hart is boos op de HEERE.", "Pred 11:1": "Werp uw brood uit op het water, want u zult het vinden na veel dagen.", "Deut 23:4": "Vanwege dat zij u onderweg niet tegemoet gekomen zijn met brood en met water, toen u uit Egypte wegtrok; en omdat hij tegen u Bileam gehuurd heeft, de zoon van Beor, uit Pethor in Mesopotamië, om u te vloeken.", "2 Kon 19:24": "Ik heb gegraven en vreemd water gedronken; en ik heb met mijn voetzolen alle rivieren van de belegerde plaatsen droog gemaakt.", "Jes 59:11": "Wij brommen allen als de beren, en wij kirren voortdurend als de duiven; wij wachten op recht, maar er is geen, op heil, maar het is ver van ons.", "Richt 7:10": "Maar als u ervoor terugschrikt naar beneden te gaan, ga dan af, u en Pura, uw knecht, naar het leger.", "Est 9:25": "Maar toen zij voor de koning gekomen was, heeft hij door brieven bevolen dat zijn boze plan, dat hij bedacht had tegen de Joden, op zijn eigen hoofd zou terugkeren; en men heeft hem en zijn zonen aan de galg gehangen.", "1 Sam 17:34-36": "Toen zei David tegen Saul: Uw knecht weidde de schapen van zijn vader, en er kwam een leeuw en een beer, en nam een schaap uit de kudde weg. En ik ging hem achterna, en sloeg hem, en redde het uit zijn muil; toen hij tegen mij opstond, greep ik hem bij zijn baard, en sloeg hem, en doodde hem. Uw knecht heeft zowel de leeuw als de beer verslagen; zo zal het deze onbesneden Filistijn vergaan, zoals een van hen, omdat hij de slagorden van de levende God gehoond heeft.", "Dan 11:27": "En het hart van beide koningen zal erop gericht zijn kwaad te doen, en aan één tafel zullen zij leugen spreken; en het zal niet lukken, want het zal nog een einde hebben op de vastgestelde tijd.", "Joz 8:3": "Toen maakte Jozua zich klaar, en al het krijgsvolk, om op te trekken naar Ai. En Jozua koos dertigduizend mannen, strijdbare helden, en hij stuurde hen 's nachts erop uit,", "Joh 18:4-8": "Jezus dan, die alles wist wat over Hem komen zou, ging naar buiten en zei tegen hen: Wie zoekt u? Zij antwoordden Hem: Jezus de Nazarener. Jezus zei tegen hen: Ik ben het. En Judas, die Hem verried, stond ook bij hen. Toen Hij dan tegen hen zei: Ik ben het, gingen zij achteruit en vielen op de grond.", "Joz 11:4": "Dezen nu trokken uit, en al hun legers met hen; veel volk, als het zand dat aan de oever van de zee is, in aantal; en heel veel paarden en wagens.", "Hand 3:18": "Maar God heeft zo vervuld wat Hij door de mond van al Zijn profeten van tevoren had verkondigd, dat de Christus zou lijden.", "Ps 7:16": "Hij heeft een kuil gegraven, en hem uitgegraven, maar hij is gevallen in de groeve, die hij gemaakt heeft.", "Joh 18:9": "Zodat het woord vervuld zou worden dat Hij gezegd had: Van hen die U Mij gegeven hebt, heb Ik niemand verloren.", "Ps 127:1": "Een lied Hammaaloth¹, van Salomo. Als de HEERE het huis niet bouwt, werken de bouwers eraan tevergeefs; als de HEERE de stad niet bewaart, waakt de wachter tevergeefs.", "1 Kon 2:7": "Maar aan de zonen van Barzillai, de Gileadiet, zult u vriendelijkheid bewijzen, en zij zullen bij hen horen die aan uw tafel eten; want zo kwamen zij naar mij toe, toen ik vluchtte voor het aangezicht van uw broer Absalom.", "Joz 11:20": "Want het was van de HEERE om hun harten te verharden, zodat zij Israël in de strijd tegemoet gingen, opdat Hij hen met de ban zou treffen, zodat hun geen genade te beurt viel, maar opdat Hij hen zou vernietigen, zoals de HEERE Mozes geboden had.", "1 Sam 14:15": "En er kwam beving in het leger, op het veld en onder heel het volk; de bezetting en de plunderaars beefden ook zelf; ja, het land schudde, want het was een beving van God.", "2 Sam 20:4": "Verder zei de koning tegen Amasa: Roep mij de mannen van Juda samen, tegen de derde dag; en u, stel u dan hier op.", "2 Sam 9:4": "En de koning zei tegen hem: Waar is hij? En Ziba zei tegen de koning: Zie, hij is in het huis van Machir, de zoon van Ammiël, in Lodebar.", "Num 22:12-18": "Toen zei God tegen Bileam: U mag niet met hen meegaan; u mag dat volk niet vervloeken, want het is gezegend. Toen stond Bileam 's morgens op, en zei tegen de vorsten van Balak: Ga naar uw land; want de HEERE weigert mij toe te staan met u mee te gaan. Toen stonden de vorsten van Moab op, en kwamen bij Balak, en zij zeiden: Bileam heeft geweigerd met ons mee te gaan.", "Spr 4:16": "Want zij slapen niet, als zij geen kwaad gedaan hebben; en hun slaap wordt weggenomen, als zij niemand hebben doen struikelen.", "Klaagl 3:10": "Daleth. Hij is voor mij een loerende beer, een leeuw in verborgen plaatsen.", "Hoogl 3:7": "Zie, het bed, dat Salomo heeft, daar zijn zestig helden rondom van de helden van Israël;", "Matt 24:16-18": "laat dan wie in Judea zijn, vluchten naar de bergen; wie op het dak is, moet niet naar beneden komen om iets uit zijn huis weg te nemen; en wie op de akker is, moet niet terugkeren om zijn kleren weg te nemen.", "2 Sam 12:26-31": "Joab nu streed tegen Rabba van de kinderen van Ammon; en hij nam de koninklijke stad in. Toen zond Joab boden naar David, en zei: Ik heb gestreden tegen Rabba, en ik heb ook de waterstad ingenomen. Verzamel u nu het overige van het volk, en beleger de stad, en neem haar in; anders zou het, als ík de stad zou innemen, naar mijn naam genoemd worden.", "Matt 27:5": "En toen hij de zilverstukken in de tempel geworpen had, vertrok hij; en hij ging heen en verhing zichzelf.", "1 Sam 25:23-31": "Toen Abigaïl nu David zag, haastte zij zich, en kwam van de ezel af, en zij viel voor het aangezicht van David op haar aangezicht, en zij boog zich ter aarde. En zij viel aan zijn voeten en zei: Och, mijn heer, laat de misdaad op mij zijn, en laat toch uw dienstmaagd voor uw oren spreken, en hoor de woorden van uw dienstmaagd. Laat mijn heer toch zijn hart niet richten op deze Belials man, op Nabal; want zoals zijn naam is, zo is hij; zijn naam is Nabal, en dwaasheid is bij hem; en ik, uw dienstmaagd, heb de jongemannen van mijn heer niet gezien, die u gezonden hebt.", "Hand 5:38": "En nu zeg ik u: Houd u afzijdig van deze mensen, en laat hen gaan; want als deze raad of dit werk uit mensen is, zal het gebroken worden;", "1 Sam 18:13": "Daarom stuurde Saul hem van zich weg, en hij stelde hem aan tot leider van duizend; en hij ging uit en hij ging in voor het aangezicht van het volk.", "Fil 4:15-19": "En ook u, Filippenzen, weet dat in het begin van het Evangelie, toen ik uit Macedonië vertrokken ben, geen gemeente mij iets meegedeeld heeft tot rekening van uitgave en ontvangst, dan u alleen. Want ook in Thessalonica hebt u mij eenmaal en opnieuw iets gestuurd, voor wat ik nodig had. Niet dat ik de gave zoek, maar ik zoek de vrucht, die overvloedig wordt tot uw rekening.", "Jes 41:2": "Wie heeft van de opgang die rechtvaardige verwekt? Heeft hem geroepen om hem op zijn voet te doen staan? De heidenvolken voor zijn aangezicht gegeven, en gemaakt dat hij over koningen heerste? Heeft hun zijn zwaard gegeven als stof, zijn boog als een voortgedreven stoppel?", "Est 6:1-12": "Diezelfde nacht kon de koning niet slapen, en hij zei dat men het boek van de gedenkwaardigheden, de kronieken, moest brengen; en die werden voorgelezen in de tegenwoordigheid van de koning. En men vond geschreven dat Mordechai had bekendgemaakt dat Bigthana en Theres, twee kamerlingen van de koning, uit de dorpelwachters, van plan waren de hand te leggen aan koning Ahasveros. Toen zei de koning: Welke eer en verhoging is Mordechai hiervoor gegeven? En de knechten van de koning, zijn dienaars, zeiden: Aan hem is niets gegeven.", "Ex 1:19": "En de vroedvrouwen zeiden tegen Farao: Omdat de Hebreeuwse vrouwen niet zijn zoals de Egyptische vrouwen; want zij zijn sterk; voordat de vroedvrouw bij hen komt, hebben zij al gebaard.", "Ex 17:9": "Mozes zei toen tegen Jozua: Kies mannen voor ons uit, en trek eropuit, strijd tegen Amalek; morgen zal ik op de top van de heuvel staan, met de staf van God in mijn hand.", "1 Kor 1:20": "Waar is de wijze? Waar is de schriftgeleerde? Waar is de onderzoeker van deze eeuw? Heeft God de wijsheid van deze wereld niet dwaas gemaakt?", "2 Sam 17:1-3": "Verder zei Achitofel tegen Absalom: Laat mij nu twaalfduizend man uitkiezen, dan sta ik op en jaag David deze nacht achterna. Zo zal ik hem overvallen terwijl hij moe en slap van handen is, en zal hem schrik aanjagen; en al het volk dat bij hem is zal vluchten; dan zal ik de koning alleen doden. En ik zal al het volk naar u laten terugkeren; de man die u zoekt, is gelijk aan het terugkeren van allen; zo zal al het volk in vrede zijn.", "Jes 32:8": "Maar een milddadige bedenkt milddadige dingen, en staat op door milddadige dingen.", "2 Sam 16:9-11": "Toen zei Abisai, de zoon van Zeruja, tegen de koning: Waarom zou deze dode hond mijn heer de koning vloeken? Laat mij toch oversteken en zijn kop wegnemen. Maar de koning zei: Wat heb ik met u te doen, zonen van Zeruja? Ja, laat hem vloeken; want de HEERE heeft immers tegen hem gezegd: Vloek David; wie zou dan zeggen: Waarom hebt u dat gedaan? Verder zei David tegen Abisai en tegen al zijn knechten: Zie, mijn zoon, die uit mijn lijf is voortgekomen, zoekt mijn leven; hoeveel te meer dan nu deze zoon van Jemini? Laat hem begaan, laat hij vloeken, want de HEERE heeft het hem gezegd.", "1 Kor 16:7": "Want ik wil u nu niet zien terwijl ik onderweg ben, maar ik hoop enige tijd bij u te blijven, als de Heere het zal toelaten.", "1 Kon 4:20": "Juda nu en Israël waren met velen, als het zand dat aan de zee in menigte is; zij aten, en dronken, en waren blij.", "Joz 2:9-11": "En zij sprak tot die mannen: Ik weet dat de HEERE u dit land gegeven heeft, en dat de schrik voor u op ons gevallen is, en dat alle inwoners van dit land voor u vergaan zijn van angst. Want wij hebben gehoord dat de HEERE het water van de Schelfzee heeft laten opdrogen voor u, toen u uit Egypte trok; en wat u gedaan hebt aan de twee koningen van de Amorieten, Sihon en Og, die aan de overkant van de Jordaan waren, die u met de ban geslagen hebt. Toen wij dat hoorden, versmolt ons hart, en er bleef geen moed meer over in iemand, vanwege uw aanwezigheid; want de HEERE, uw God, is een God boven in de hemel, en beneden op de aarde.", "1 Kor 15:54": "En wanneer dit vergankelijke onvergankelijkheid zal hebben aangedaan, en dit sterfelijke onsterfelijkheid zal hebben aangedaan, dan zal het woord gebeuren dat geschreven is: De dood is verslonden tot overwinning.", "Richt 9:24": "opdat het geweld, gedaan aan de zeventig zonen van Jerubbaäl, tot uiting zou komen, en opdat hun bloed gelegd zou worden op Abimelech, hun broer, die hen gedood had, en op de burgers van Sichem, die zijn handen gesterkt hadden om zijn broers te doden.", "Richt 18:25": "Maar de kinderen van Dan zeiden tegen hem: Laat uw stem bij ons niet horen, anders vallen misschien mannen met een verbitterd gemoed u aan, en verliest u uw leven, en het leven van uw huis.", "2 Sam 18:1": "En David monsterde het volk dat bij hem was, en hij stelde over hen leiders van duizend, en leiders van honderd aan.", "Hebr 11:34": "de kracht van het vuur hebben geblust, aan de scherpte van het zwaard zijn ontkomen, vanuit zwakheid kracht hebben gekregen, in de strijd sterk zijn geworden, legers van vreemden op de vlucht hebben gebracht;", "Richt 10:9": "Daarbij trokken de Ammonieten de Jordaan over om te strijden, ook tegen Juda, tegen Benjamin en tegen het huis van Efraïm, zodat Israël erg in het nauw kwam.", "Pred 11:2": "Geef een deel aan zeven, ja, ook aan acht; want u weet niet wat voor kwaad er op de aarde zal zijn.", "2 Sam 20:23": "Joab nu was over het hele leger van Israël; en Benaja, de zoon van Jojada, over de Krethi en over de Plethi;", "Jes 48:22": "Maar de goddelozen hebben geen vrede, zegt de HEERE.", "2 Sam 16:2": "En de koning zei tegen Ziba: Wat wilt u daarmee? En Ziba zei: De ezels zijn voor het huis van de koning, om op te rijden, en het brood en de zomervruchten om te eten voor de knechten; en de wijn, opdat wie moede zijn in de woestijn, kunnen drinken.", "Spr 21:30": "Er is geen wijsheid, en er is geen verstand, en er is geen raad tegen de HEERE.", "Gen 45:5-7": "Maar nu, weest niet bekommerd, en de toorn ontsteekt niet in uw ogen, omdat u mij hierheen verkocht hebt; want God heeft mij voor uw aangezicht gezonden, tot behoud van het leven. Want het zijn nu twee jaren van de honger in het midden van het land; en er zijn nog vijf jaren, waarin geen ploeging noch oogst zal zijn. Doch God heeft mij voor uw aangezicht heen gezonden, om u een overblijfsel te stellen op de aarde, en om u bij het leven te behouden, door een grote verlossing.", "Hoogl 4:11": "Uw lippen, o bruid! druppen van honingzeem; honing en melk is onder uw tong, en de geur van uw kleren is als de geur van de Libanon.", "2 Sam 17:1-15": "Verder zei Achitofel tegen Absalom: Laat mij nu twaalfduizend man uitkiezen, dan sta ik op en jaag David deze nacht achterna. Zo zal ik hem overvallen terwijl hij moe en slap van handen is, en zal hem schrik aanjagen; en al het volk dat bij hem is zal vluchten; dan zal ik de koning alleen doden. En ik zal al het volk naar u laten terugkeren; de man die u zoekt, is gelijk aan het terugkeren van allen; zo zal al het volk in vrede zijn.", "1 Kon 11:14-40": "Zo verwekte de HEERE tegen Salomo een tegenstander, Hadad de Edomiet; hij was van het koninklijk geslacht in Edom. Want het was gebeurd, toen David in Edom was, en Joab, de legeraanvoerder, optrok om de gesneuvelden te begraven, dat hij alles wat mannelijk was in Edom versloeg; want Joab bleef daar zes maanden met heel Israël, totdat hij alles wat mannelijk was in Edom had uitgeroeid.", "1 Kor 4:19": "Maar ik zal spoedig naar u toe komen, als de Heere het wil, en dan zal ik niet de woorden leren kennen van hen die opgeblazen zijn, maar de kracht.", "1 Kron 18:11": "Deze heiligde koning David ook aan de HEERE, met het zilver en het goud dat hij had meegebracht van alle heidenvolken: van de Edomieten, en van de Moabieten, en van de kinderen van Ammon, en van de Filistijnen, en van de Amalekieten.", "2 Kron 10:15": "Zo luisterde de koning niet naar het volk; want deze ommekeer kwam van God, opdat de HEERE Zijn woord zou bevestigen, dat Hij door de dienst van Ahia, de Siloniet, gesproken had tot Jerobeam, de zoon van Nebat.", "Hos 3:3": "En ik zei tegen haar: U zult veel dagen bij mij blijven zitten (u zult niet hoereren, en niet de vrouw van een andere man worden), en ik ook bij u.", "1 Kron 2:13": "En Isaï verwekte Eliab, zijn eerstgeborene, en Abinadab, de tweede, en Simea, de derde,", "Jes 21:14": "Komt de dorstige tegemoet met water; de inwoners van het land Thema zijn de vluchtende met hun brood tegemoetgekomen.", "Spr 16:7": "Als iemands wegen de HEERE behagen, zo zal Hij ook zijn vijanden met hem verzoenen.", "Joz 22:10-34": "Toen zij aankwamen bij de grenzen van de Jordaan, die in het land Kanaän zijn, bouwden de kinderen van Ruben, en de kinderen van Gad, en de halve stam van Manasse daar een altaar bij de Jordaan, een altaar groot van aanzien. En de kinderen van Israël hoorden zeggen: Zie, de kinderen van Ruben, en de kinderen van Gad, en de halve stam van Manasse hebben een altaar gebouwd, tegenover het land Kanaän, aan de grenzen van de Jordaan, aan de zijde van de kinderen van Israël. Toen de kinderen van Israël dit hoorden, verzamelde de hele vergadering van de kinderen van Israël zich te Silo, om tegen hen op te trekken met een leger.", "2 Kon 2:24": "En hij keerde zich achterom, en hij zag hen, en vervloekte hen, in de Naam van de HEERE. Toen kwamen er twee berinnen uit het woud, en verscheurden van hen tweeënveertig kinderen.", "1 Kor 3:19": "Want de wijsheid van deze wereld is dwaasheid bij God; want er is geschreven: Hij vat de wijzen in hun sluwheid;", "2 Sam 17:17-22": "Jonathan nu en Ahimaäz stonden bij de bron Rogel; en een dienstmeisje ging heen en vertelde het hun; en zij gingen heen en vertelden het aan koning David; want zij mochten zich niet laten zien door in de stad te komen. Een jongen zag hen echter, en vertelde het aan Absalom; doch die beiden gingen haastig weg, en kwamen in het huis van een man te Bahurim, die een put had in zijn binnenplaats, en zij daalden daarin af. En de vrouw nam en spreidde een deksel over de opening van de put, en strooide daar gepelde granen overheen. Zo werd de zaak niet bekend.", "Richt 8:4-6": "Toen Gideon nu bij de Jordaan gekomen was, ging hij eroverheen, met de driehonderd mannen die bij hem waren, moe, maar toch nog vervolgend. En hij zei tegen de mannen van Sukkoth: Geef toch enige broden aan het volk dat mij volgt, want zij zijn moe; en ik jaag Zebah en Tsalmuna, de koningen van de Midianieten, achterna. Maar de leiders van Sukkoth zeiden: Is de handpalm van Zebah en Tsalmuna dan al in uw hand, dat wij aan uw leger brood zouden geven?", "1 Kron 12:40": "En ook degenen die dicht bij hen woonden, tot aan Issaschar, en Zebulon, en Nafthali, brachten brood op ezels, en op kamelen, en op muildieren, en op runderen, meel, klompen gedroogde vijgen, en rozijnenkoeken, en wijn, en olie, en runderen, en kleinvee in overvloed; want er was blijdschap in Israël.", "Richt 12:1-3": "Toen werden de mannen van Efraïm bijeengeroepen, en zij trokken naar het noorden; en zij zeiden tegen Jeftha: Waarom bent u doorgetrokken om te strijden tegen de kinderen van Ammon, en hebt u ons niet geroepen om met u mee te gaan? Wij zullen uw huis boven u met vuur verbranden. En Jeftha zei tegen hen: Ik en mijn volk waren in hevige strijd met de kinderen van Ammon; en ik heb u geroepen, maar u hebt mij niet uit hun hand verlost. Toen ik nu zag dat u mij niet verloste, zette ik mijn leven op het spel en trok tegen de kinderen van Ammon, en de HEERE gaf hen in mijn hand; waarom bent u dan vandaag naar mij toegekomen om tegen mij te strijden?", "Jes 59:8": "De weg van de vrede kennen zij niet; en er is geen recht in hun gangen; hun paden maken zij krom voor zichzelf; ieder die daarop gaat, kent de vrede niet.", "2 Sam 16:15": "Absalom nu en al het volk, de mannen van Israël, kwamen in Jeruzalem aan, en Achitofel met hem.", "1 Kon 22:31": "De koning van Syrië nu had zijn tweeëndertig aanvoerders van de wagens geboden en gezegd: U zult niet vechten tegen klein of groot, maar alleen tegen de koning van Israël.", "1 Kron 2:16": "En hun zusters waren Zeruja en Abigaïl. De kinderen nu van Zeruja waren Abisai, en Joab, en Asa-el; drie.", "Richt 9:23": "zond God een boze geest tussen Abimelech en de burgers van Sichem; en de burgers van Sichem handelden trouweloos tegen Abimelech;", "Joz 2:23": "Zo keerden die twee mannen terug, en gingen van het gebergte af, en staken over, en kwamen bij Jozua, de zoon van Nun; en zij vertelden hem alles wat hun overkomen was.", "Num 24:8": "God heeft hem uit Egypte uitgevoerd; zijn kracht is als die van een eenhoorn; hij zal de heidenvolken, zijn vijanden, verteren, en hun beenderen breken, en met zijn pijlen doorschieten.", "Num 31:5": "Zo werden geleverd uit de duizenden van Israël, duizend van elke stam, twaalfduizend toegeruste strijders.", "1 Sam 16:18": "Toen antwoordde een van de jongens, en zei: Zie, ik heb een zoon van Isaï gezien, de Bethlehemiet, die kan spelen, en hij is een dapper held en een krijgsman, en verstandig in zaken, en een knappe man, en de HEERE is met hem.", "2 Sam 15:27": "Verder zei de koning tegen de priester Zadok: Bent u niet een ziener? Keer terug in de stad met vrede; ook uw beide zonen, Ahimaäz, uw zoon, en Jonathan, Abjathars zoon, met u.", "Num 31:49": "En zij zeiden tegen Mozes: Uw dienaren hebben de som opgenomen van de krijgslieden die onder ons gezag geweest zijn; en van ons ontbreekt niet één man.", "Spr 14:19": "De kwaden buigen neer voor de goeden, en de goddelozen voor de poorten van de rechtvaardige.", "2 Sam 23:11": "Na hem nu was Samma, de zoon van Age, de Harariet. Toen de Filistijnen verzameld waren in een dorp, en daar een stuk akker was vol linzen, en het volk vluchtte voor de Filistijnen,", "Hand 7:10": "en verloste hem uit al zijn verdrukkingen, en gaf hem genade en wijsheid voor Farao, de koning van Egypteland; en hij stelde hem aan als leider over Egypte en zijn hele huis.", "2 Kron 36:22": "Maar in het eerste jaar van Kores, koning van Perzië, opdat het woord van de HEERE volbracht werd, door de mond van Jeremia, wekte de HEERE de geest op van Kores, koning van Perzië, zodat hij een stem liet doorgaan door zijn hele koninkrijk, ook zelfs op schrift, en hij zei:", "2 Sam 9:5": "Toen zond koning David heen, en hij haalde hem uit het huis van Machir, de zoon van Ammiël, uit Lodebar.", "Ezech 21:26": "Zo zegt de Heere HEERE: Doe die hoed weg, en neem die kroon af; deze zal niet dezelfde blijven; Ik zal verhogen wie nederig is, en vernederen wie hoog is.", "Num 23:1-30": "Toen zei Bileam tegen Balak: Bouw hier zeven altaren voor mij, en maak hier zeven stieren en zeven rammen voor mij klaar. Balak deed wat Bileam had gezegd; en Balak en Bileam offerden een stier en een ram op elk altaar. Toen zei Bileam tegen Balak: Blijf bij uw brandoffer staan, en ik zal weggaan; misschien zal de HEERE mij tegemoetkomen; en wat Hij mij laat zien, dat zal ik u bekendmaken. Toen ging hij naar de hoogte.", "Hand 5:39": "maar als het uit God is, dan kunt u dat niet breken; anders zou u misschien bevonden worden ook tegen God te strijden.", "Matt 3:4": "En dezelfde Johannes had zijn kleding van kameelhaar, en een leren gordel om zijn middel; en zijn voedsel was sprinkhanen en wilde honing.", "1 Sam 21:2": "En David zei tegen de priester Achimelech: De koning heeft mij een zaak opgedragen, en zei tegen mij: Laat niemand iets weten van de zaak waarvoor ik u gezonden heb, en die ik u opgedragen heb; en aan de knechten heb ik de plaats van zo'n bepaalde plek bekendgemaakt.", "2 Sam 8:16": "Joab nu, de zoon van Zeruja, was over het leger; en Josafat, zoon van Achilud, was kanselier.", "Gen 22:17": "Voorzeker zal Ik u rijk zegenen, en uw nageslacht zeer talrijk maken, als de sterren van de hemel, en als het zand dat aan de oever van de zee is; en uw nageslacht zal de poort van zijn vijanden erfelijk bezitten.", "Joz 2:4-24": "Maar die vrouw had die beide mannen genomen, en zij had hen verborgen; en zei: Er zijn mannen naar mij toe gekomen, maar ik wist niet waar zij vandaan waren. En het gebeurde, toen men de poort zou sluiten, toen het donker was, dat die mannen naar buiten gingen; ik weet niet waarheen die mannen gegaan zijn; jaag hen snel na, want u zult ze inhalen. Maar zij had hen op het dak laten klimmen, en zij had hen verstopt onder de vlasstoppels, die zij op het dak had klaargelegd.", "Deut 25:18": "hoe hij u op de weg tegemoetkwam, en van achteren allen sloeg die zwak waren en achterbleven, toen u moe en mat was; en hij vreesde God niet.", "1 Sam 20:38": "Wederom riep Jonathan de jongen na: Haast u, spoed u, sta niet stil! De jongen van Jonathan raapte de pijl op, en hij kwam bij zijn heer.", "Spr 16:18": "Hoogmoed komt vóór de ondergang, en hoogheid van geest vóór de val.", "Jes 7:15": "Boter en honing zal Hij eten, totdat Hij weet het kwade te verwerpen en het goede te verkiezen.", "Pred 3:1": "Alles heeft een vastgestelde tijd, en alle voornemen onder de hemel heeft zijn tijd.", "2 Sam 20:9-12": "En Joab zei tegen Amasa: Is het goed met u, mijn broeder? En Joab pakte met de rechterhand de baard van Amasa, om hem te kussen. En Amasa lette niet op het zwaard dat in Joabs hand was; zo sloeg hij hem daarmee aan de vijfde rib, en hij stortte zijn ingewanden op de aarde uit, en hij sloeg hem niet ten tweeden male, en hij stierf. Toen jaagden Joab en zijn broeder Abisai Seba, de zoon van Bichri, achterna. Maar een man, van Joabs jongens, bleef bij hem staan, en hij zei: Wie er lust in heeft in Joab, en wie er voor David is, die volgt Joab na!", "Jes 8:9": "Verzamel u samen, volken! Toch zult u verbroken worden; en neem het ter ore, allen die in verre landen bent, omgord u, toch zult u verbroken worden; omgord u, toch zult u verbroken worden!", "Ex 9:16": "Maar juist daarom heb Ik u laten opstaan, opdat Ik Mijn kracht aan u zou tonen, en opdat men Mijn Naam vertelt op de hele aarde.", "1 Sam 19:14-17": "Saul nu zond boden om David te halen. Toen zei zij: Hij is ziek. Toen zond Saul boden om David te bezien, en zei: Breng hem met bed en al bij mij, zodat men hem kan doden. Toen de boden kwamen, zie, er was een beeld in het bed, en er was een geitenvel aan zijn hoofdkussen.", "2 Sam 10:1": "En het gebeurde daarna, dat de koning van de kinderen Ammons stierf, en zijn zoon Hanun werd koning in zijn plaats.", "2 Sam 15:32-37": "En het gebeurde, toen David tot op de hoogte kwam, waar hij God aanbad, zie, toen ontmoette Husai, de Archiet, hem, met zijn kleed gescheurd, en aarde op zijn hoofd. En David zei tegen hem: Als u met mij meegaat, zult u mij tot een last zijn; maar als u teruggaat naar de stad, en tegen Absalom zegt: Uw knecht, ik zal van de koning zijn; ik ben eerder wel de knecht van uw vader geweest, maar nu zal ik uw knecht zijn; dan zou u voor mij de raad van Achitofel teniet doen.", "2 Sam 17:27-29": "En het gebeurde, toen David te Mahanaïm gekomen was, dat Sobi, de zoon van Nahas, uit Rabba van de kinderen van Ammon, en Machir, de zoon van Ammiël, uit Lodebar, en Barzillai, de Gileadiet, uit Rogelim, Beddengoed, en schalen, en aarden vaten, en tarwe, en gerst, en meel, en geroosterd koren, en bonen, en linzen, ook geroosterd, En honing, en boter, en schapen, en koeienkaas, brachten naar David, en naar het volk dat bij hem was, om te eten, want zij zeiden: Dit volk is hongerig, en moe, en dorstig in de woestijn.", "2 Sam 16:20-23": "Toen zei Absalom tegen Achitofel: Geef onder u raad, wat zullen wij doen? En Achitofel zei tegen Absalom: Ga naar de bijvrouwen van uw vader, die hij heeft achtergelaten om het huis te bewaren; zo zal heel Israël horen dat u zich bij uw vader gehaat gemaakt hebt, en de handen van allen die bij u zijn, zullen gesterkt worden. Zo spanden zij voor Absalom een tent op op het dak; en Absalom ging naar de bijvrouwen van zijn vader, voor de ogen van heel Israël.", "2 Sam 15:12": "Absalom zond ook om Achitofel, de Giloniet, Davids raadsman, te halen uit zijn stad, uit Gilo, terwijl hij offers bracht. En de samenzwering werd sterk, en het volk kwam gestaag toe en werd meer bij Absalom.", "Spr 25:27": "Veel honig eten is niet goed; maar het onderzoeken van de eigen eer is geen eer.", "Rom 1:32": "die, hoewel zij het recht van God kennen, namelijk dat zij die zulke dingen doen de dood waard zijn, deze dingen niet alleen doen, maar ook nog instemming betonen aan hen die ze doen.", "Ps 33:10": "De HEERE vernietigt de raad van de heidenen; Hij breekt de gedachten van de volken.", "2 Sam 15:10": "Absalom nu had verspieders uitgezonden naar alle stammen van Israël, om te zeggen: Zodra u het geluid van de bazuin hoort, moet u zeggen: Absalom is koning geworden te Hebron.", "Jes 13:3-5": "Ik heb Mijn geheiligden bevel gegeven; ook heb Ik tot Mijn toorn geroepen Mijn helden, hen die zich verheugen in Mijn hoogheid. Er is een ruisende stem op de bergen, gelijk aan een groot volk; een stem van gedruis van de koninkrijken, van de verzamelde heidenvolken; de HEERE van de heerscharen monstert het krijgsleger. Zij komen uit een ver land, van het einde van de hemel; de HEERE en de instrumenten van Zijn gramschap, om dat hele land te verderven.", "2 Kron 26:7": "En God hielp hem tegen de Filistijnen, en tegen de Arabieren die te Gur-baal woonden, en tegen de Meunieten.", "1 Sam 23:21": "Toen zei Saul: Gezegend bent u door de HEERE, dat u medelijden met mij hebt gehad!", "1 Sam 11:1": "Toen trok Nahas, de Ammoniet, op en belegerde Jabes in Gilead. En alle mannen van Jabes zeiden tegen Nahas: Sluit een verbond met ons, en wij zullen u dienen.", "2 Sam 19:16": "En Simeï, de zoon van Gera, een Benjaminiet, die uit Bahurim was, haastte zich, en kwam met de mannen van Juda naar beneden, koning David tegemoet;", "Richt 12:5": "Want de Gileadieten namen de Efraïmieten de doorwaadbare plaatsen van de Jordaan af; en het gebeurde, toen de vluchtelingen van Efraïm zeiden: Laat mij oversteken, dat de mannen van Gilead tegen hem zeiden: Bent u een Efraïmiet? En wanneer hij zei: Nee;", "2 Sam 15:14": "Toen zei David tegen al zijn knechten die met hem te Jeruzalem waren: Maak u op, en laten we vluchten, want anders zou er voor ons geen ontkomen zijn voor Absalom; haast u om weg te gaan, opdat hij ons niet misschien plotseling haast, en ons achterhaalt, en een kwaad over ons brengt, en deze stad slaat met de scherpte van het zwaard.", "1 Kon 12:15": "Zo hoorde de koning niet naar het volk; want deze ommekeer kwam van de HEERE, opdat Hij Zijn woord zou bevestigen, dat de HEERE door de dienst van Ahia, de Siloniet, gesproken had tot Jerobeam, de zoon van Nebat.", "Ps 3:4-6": "Maar U, HEERE, bent een Schild voor mij, mijn eer, en Die mijn hoofd opheft. Ik riep met mijn stem tot de HEERE, en Hij verhoorde mij van Zijn heilige berg. Sela. Ik lag neer en sliep; ik werd wakker, want de HEERE ondersteunde mij.", "Ps 76:11": "Want de grimmigheid van de mens zal U loffelijk maken; het overblijfsel van de grimmigheden zult U opbinden.", "Joz 7:5": "En de mannen van Ai versloegen van hen ongeveer zesendertig man, en achtervolgden hen vanaf de poort tot Schebarim toe, en versloegen hen bij de afgang. Toen versmolt het hart van het volk, en het werd tot water.", "Hand 7:9": "En de aartsvaders, jaloers geworden, verkochten Jozef om naar Egypte gebracht te worden; maar God was met hem,", "Pred 3:10": "Ik heb de bezigheid gezien, die God aan de kinderen van de mensen gegeven heeft, om zichzelf daarmee te bekommeren.", "Joh 11:50": "en u overweegt niet dat het nuttig voor ons is dat één mens sterft voor het volk, en niet het hele volk verloren gaat.", "2 Sam 17:1-17": "Verder zei Achitofel tegen Absalom: Laat mij nu twaalfduizend man uitkiezen, dan sta ik op en jaag David deze nacht achterna. Zo zal ik hem overvallen terwijl hij moe en slap van handen is, en zal hem schrik aanjagen; en al het volk dat bij hem is zal vluchten; dan zal ik de koning alleen doden. En ik zal al het volk naar u laten terugkeren; de man die u zoekt, is gelijk aan het terugkeren van allen; zo zal al het volk in vrede zijn.", "2 Sam 16:20": "Toen zei Absalom tegen Achitofel: Geef onder u raad, wat zullen wij doen?", "Jes 11:7": "De koe en de berin zullen samen weiden, hun jongen zullen samen neerliggen, en de leeuw zal stro eten, net als de os.", "Gen 25:34": "En Jakob gaf aan Ezau brood en het linzenkooksel; en hij at en dronk, en hij stond op en ging weg; zo verachtte Ezau het eerstgeboorterecht.", "Ps 7:17": "Zijn moeite zal op zijn eigen hoofd terugkeren, en zijn geweld op zijn eigen schedel neerdalen.", "Jes 48:15": "Ik, Ik heb het gesproken, ook heb Ik hem geroepen; Ik zal hem doen komen, en hij zal voorspoedig zijn op zijn weg.", "2 Sam 1:23": "Saul en Jonathan, die geliefd waren, en die liefelijke mensen in hun leven, zijn ook in hun dood niet gescheiden; zij waren sneller dan arenden, zij waren sterker dan leeuwen.", "Richt 20:33": "Toen maakten alle mannen van Israël zich op uit hun plaatsen, en schikten de strijd te Baäl-thamar; ook brak Israëls hinderlaag op uit haar plaats, vanuit de open plek bij Gibea.", "Richt 7:6": "Toen was het aantal van hen die met hun hand naar hun mond gelekt hadden, driehonderd man; maar alle overigen van het volk hadden op hun knieën gebukt om water te drinken.", "Ps 57:4": "Hij zal vanuit de hemel zenden, en mij verlossen, en te sch
