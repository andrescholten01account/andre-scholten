ande maken hem die mij zoekt te verslinden. Sela. God zal Zijn goedertierenheid en Zijn waarheid zenden.", "1 Sam 23:23": "Kijk daarom goed uit, en verneem naar alle schuilplaatsen waarin hij zich schuilhoudt; kom dan terug bij mij met zeker bericht, dan zal ik met u meegaan; en het zal gebeuren, als hij in het land is, dat ik hem opspoor onder alle duizenden van Juda.", "Ps 56:3": "Mijn verspieders zoeken mij de hele dag op te slokken; want ik heb veel bestrijders, o Allerhoogste!", "2 Sam 19:31-39": "Barzillai, de Gileadiet, kwam ook naar beneden uit Rogelim; en hij trok met de koning de Jordaan over, om hem over de Jordaan te begeleiden. Barzillai nu was zeer oud, een man van tachtig jaar; en hij had de koning van voedsel voorzien toen hij in Mahanaïm verbleef; want hij was een zeer belangrijk man. En de koning zei tegen Barzillai: Trek met mij mee, en ik zal u bij mij in Jeruzalem onderhouden.", "1 Sam 18:21": "En Saul zei: Ik zal haar hem geven, zodat zij hem tot een valstrik is, en zodat de hand van de Filistijnen tegen hem is. Daarom zei Saul tegen David: Met de andere zult u vandaag mijn schoonzoon worden.", "Jes 10:5-7": "Wee de Assyriër, die de roede van Mijn toorn is, en Mijn grimmigheid is een stok in hun hand! Ik zal hem zenden tegen een huichelachtig volk, en Ik zal hem bevel geven tegen het volk van Mijn verbolgenheid; opdat hij de roof rooft, en plundert de plundering, en het stelt ter vertreding, als het slijk van de straten. Hoewel hij het zo niet meent, en zijn hart zo niet denkt, maar hij zal in zijn hart hebben te verdelgen, en niet weinige volken uit te roeien.", "Gen 18:8": "En hij nam boter en melk, en het kalf dat hij klaargemaakt had, en zette het hun voor, en stond zelf bij hen onder de boom, en zij aten.", "Joz 2:22": "Zij dan gingen weg, en kwamen op het gebergte, en bleven daar drie dagen, totdat de achtervolgers teruggekeerd waren; want de achtervolgers hadden hen op heel de weg gezocht, maar niet gevonden.", "Ex 15:15": "Dan zullen de vorsten van Edom verbaasd zijn; beving zal de machtigen van de Moabieten bevangen; alle inwoners van Kanaän zullen wegsmelten!", "Richt 7:11": "En u zult horen wat zij zullen zeggen, en daarna zullen uw handen gesterkt worden, zodat u naar het leger zult aftrekken. Toen ging hij af, met Pura, zijn knecht, tot aan het uiterste van de gewapende mannen die in het leger waren.", "Job 5:12-14": "Hij maakt teniet de gedachten van de arglistigen; zodat hun handen niets uitrichten. Hij vangt de wijzen in hun arglistigheid; zodat de raad van de verdraaiden overhaast valt. Overdag ontmoeten zij de duisternis, en zoals 's nachts tasten zij rond in de middag.", "Ezech 4:9": "En neem u tarwe, gerst, bonen, linzen, gierst en spelt; doe die in één vat en maak daar brood van; naar het getal van de dagen dat u op uw zijde neerligt, driehonderdnegentig dagen, zult u dat eten.", "Spr 13:22": "De goede zal zijn kindskinderen doen erven; maar het vermogen van de zondaar is voor de rechtvaardige weggelegd.", "2 Kron 30:4": "En deze zaak was goed in de ogen van de koning, en in de ogen van de hele gemeente.", "Ruth 2:14": "Toen het etenstijd was, zei Boaz tegen haar: Kom hierbij, en eet van het brood, en doop uw stukje in de azijn. Zo zat zij neer aan de zijde van de maaiers, en hij reikte haar geroost koren aan, en zij at, en werd verzadigd, en hield over.", "2 Sam 8:12": "van Syrië, en van Moab, en van de kinderen van Ammon, en van de Filistijnen, en van Amalek, en van de buit van Hadad-Ezer, de zoon van Rechob, de koning van Zoba.", "Est 1:21": "Dit woord nu vond de koning en de vorsten goed; en de koning deed naar het woord van Memuchan.", "2 Sam 23:20-22": "Verder Benaja, de zoon van Jojada, de zoon van een dappere man, groot van daden, uit Kabzeel; die versloeg twee sterke leeuwen van Moab; ook ging hij af, en sloeg een leeuw in het midden van een kuil in de sneeuwtijd. Daarbij versloeg hij een Egyptische man, een man van aanzien; en in de hand van de Egyptenaar was een speer, maar hij ging op hem af met een staf; en hij rukte de speer uit de hand van de Egyptenaar, en doodde hem met zijn eigen speer. Deze dingen deed Benaja, de zoon van Jojada; daarom had hij een naam onder de drie helden.", "Ps 4:9": "Ik zal in vrede samen neerliggen en slapen; want U, o HEERE! alleen zult mij zeker doen wonen.", "Joz 2:7": "Die mannen dan achtervolgden hen op de weg naar de Jordaan, tot aan de doorwaadbare plaatsen; en men sloot de poort dicht, nadat zij naar buiten gegaan waren die hen achtervolgden.", "2 Sam 23:8": "Dit zijn de namen van de helden die David gehad heeft: Joscheb-Baschebeth, de zoon van Tachkemoni, de voornaamste van de hoofdlieden. Deze was Adino, de Ezniet, die zich stelde tegen achthonderd man, die door hem verslagen werden op één moment.", "2 Sam 17:7-14": "Toen zei Husai tegen Absalom: De raad die Achitofel deze keer gegeven heeft, is niet goed. Verder zei Husai: U kent uw vader en zijn mannen, dat zij helden zijn, en verbitterd van gemoed, als een beer die van haar jongen beroofd is in het veld; daarbij is uw vader een krijgsman, en zal niet overnachten bij het volk. Zie, hij heeft zich nu verstopt in een van de holen, of op een van de andere plaatsen. En het zal gebeuren, als er in het begin sommigen van hen vallen, dat ieder die het hoort dan zal zeggen: Er is een slachting gebeurd onder het volk dat Absalom volgt.", "Spr 28:1": "De goddelozen vluchten, terwijl geen vervolger er is; maar elke rechtvaardige is moedig, als een jonge leeuw.", "1 Kon 20:10": "En Benhadad zond naar hem en zei: De goden doen mij zo, en doen zo daartoe, als het stof van Samaria genoeg zal zijn tot handvollen voor al het volk, dat mijn voetstappen volgt!", "2 Sam 3:39": "Maar ik ben vandaag teder, hoewel tot koning gezalfd, en deze mannen, de zonen van Zeruja, zijn te hard voor mij; de HEERE zal de boosdoener vergelden naar zijn boosheid.", "Luk 24:42": "En zij gaven Hem een stuk gebraden vis, en wat honingraat.", "1 Kron 6:9": "En Ahimaäz verwekte Azarja, en Azarja verwekte Johanan;", "Dan 7:5": "Daarna, zie, het andere dier, het tweede, was gelijk een beer, en het richtte zich op aan de ene zijde, en het had drie ribben in zijn muil tussen zijn tanden; en men zei zo tegen hem: Sta op, eet veel vlees.", "2 Sam 16:15-19": "Absalom nu en al het volk, de mannen van Israël, kwamen in Jeruzalem aan, en Achitofel met hem. En het gebeurde, toen Husai, de Archiet, Davids vriend, bij Absalom kwam, dat Husai tegen Absalom zei: Leve de koning, leve de koning! Maar Absalom zei tegen Husai: Is dit uw trouw aan uw vriend? Waarom bent u niet met uw vriend meegegaan?", "Spr 31:8": "Open uw mond voor de stomme, voor de rechtszaak van allen die dreigen om te komen.", "Ezra 2:61": "En van de kinderen van de priesters, de kinderen van Habaja, de kinderen van Koz, de kinderen van Barzillai, die een vrouw genomen had van de dochters van Barzillai, de Gileadiet, en naar hun naam genoemd was.", "Joz 15:7": "Verder zal deze grens opgaan naar Debir, van het dal van Achor, en zal noordwaarts zien naar Gilgal, dat tegenover de opgang van Adummim is, die aan het zuiden van de beek is. Daarna zal deze grens doorgaan tot het water van En-semes, en haar uitgangen zullen zijn te En-rogel.", "Deut 23:5": "Doch de HEERE, uw God, heeft niet naar Bileam willen horen; maar de HEERE, uw God, heeft de vloek voor u in een zegen veranderd, omdat de HEERE, uw God, u liefhad.", "2 Sam 15:31": "Toen liet men David weten, en zei: Achitofel is onder degenen die zich met Absalom hebben verbonden. Toen zei David: HEERE, maak toch de raad van Achitofel tot dwaasheid.", "2 Sam 12:28": "Verzamel u nu het overige van het volk, en beleger de stad, en neem haar in; anders zou het, als ík de stad zou innemen, naar mijn naam genoemd worden.", "Ps 9:17": "De HEERE is bekend geworden; Hij heeft recht gedaan; de goddeloze is verstrikt in het werk van zijn handen! Higgajon, Sela.", "Neh 7:63": "En van de priesters: de kinderen van Habaja, de kinderen van Koz, de kinderen van Barzillai, die een vrouw van de dochters van Barzillai, de Gileadiet, genomen had, en naar hun naam genoemd was.", "2 Sam 17:1-4": "Verder zei Achitofel tegen Absalom: Laat mij nu twaalfduizend man uitkiezen, dan sta ik op en jaag David deze nacht achterna. Zo zal ik hem overvallen terwijl hij moe en slap van handen is, en zal hem schrik aanjagen; en al het volk dat bij hem is zal vluchten; dan zal ik de koning alleen doden. En ik zal al het volk naar u laten terugkeren; de man die u zoekt, is gelijk aan het terugkeren van allen; zo zal al het volk in vrede zijn.", "Jer 51:20": "U bent Mij een voorhamer, en oorlogswapens; en door u zal Ik volken in stukken slaan, en door u zal Ik koninkrijken verderven.", "Jak 4:15": "In plaats daarvan zou u moeten zeggen: Als de Heere het wil, en wij leven, zullen wij dit of dat doen.", "Fil 1:19": "Want ik weet dat dit mij ter zaligheid zal gedijen, door uw gebed en de toebrenging van de Geest van Jezus Christus.", "2 Sam 21:18-22": "En het gebeurde daarna, dat er opnieuw een oorlog was te Gob tegen de Filistijnen. Toen sloeg Sibbechai, de Husathiet, Saf, die van de kinderen van Rafa was. Verder was er nog een oorlog te Gob tegen de Filistijnen; en Elhanan, de zoon van Jaäre-Oregim, de Bethlehemiet, sloeg de broer van Goliath, de Gethiet, wiens speersteel was als een weversboom. Ook was er nog een oorlog te Gath; en er was een zeer lange man, die zes vingers had aan zijn handen, en zes tenen aan zijn voeten, vierentwintig in getal, en deze was ook aan Rafa geboren.", "Ezra 6:22": "En zij hielden het feest van de ongezuurde broden zeven dagen, met blijdschap; want de HEERE had hen verblijd, en het hart van de koning van Assur naar hen toe gewend, om hun handen te sterken in het werk van het huis van God, de God van Israël.", "Ps 55:9": "Ik zou mij haasten om te ontkomen, aan de drijvende wind, aan de storm.", "2 Kon 20:1": "In die dagen werd Hizkia ziek, tot aan het sterven toe; en de profeet Jesaja, de zoon van Amoz, kwam bij hem en zei tegen hem: Zo zegt de HEERE: Geef bevel aan uw huis, want u zult sterven en niet leven.", "Num 24:9": "Hij heeft zich gekromd, hij heeft zich neergelegd, als een leeuw, en als een oude leeuw; wie zal hem doen opstaan? Wie u zegent, die zij gezegend, en vervloekt zij wie u vervloekt!", "2 Kron 25:20": "Doch Amazia luisterde niet, want het was van God, opdat Hij hen in de hand van hun vijanden zou geven, omdat zij de goden van de Edomieten gezocht hadden.", "Jes 45:13": "Ik heb hem verwekt in gerechtigheid, en al zijn wegen zal Ik recht maken; hij zal Mijn stad bouwen, en hij zal Mijn gevangenen loslaten, niet voor prijs, en ook niet voor geschenk, zegt de HEERE van de heerscharen.", "Rom 1:10": "altijd in mijn gebeden biddend, of het mij misschien nog op een gegeven moment door de wil van God gegeven zou worden om naar u te komen.", "Zach 13:7": "Zwaard! Word wakker tegen Mijn Herder, en tegen de Man Die Mijn Metgezel is, spreekt de HEERE van de heerscharen; sla die Herder, en de schapen zullen verstrooid worden; maar Ik zal Mijn hand tot de kleinen wenden.", "Joz 2:4": "Maar die vrouw had die beide mannen genomen, en zij had hen verborgen; en zei: Er zijn mannen naar mij toe gekomen, maar ik wist niet waar zij vandaan waren.", "Ps 127:2": "Het is tevergeefs dat u vroeg opstaat, laat opblijft, brood eet met zorgen erbij; het is zo, dat Hij het aan hen die Hij liefheeft, geeft als in de slaap.", "Joz 2:4-6": "Maar die vrouw had die beide mannen genomen, en zij had hen verborgen; en zei: Er zijn mannen naar mij toe gekomen, maar ik wist niet waar zij vandaan waren. En het gebeurde, toen men de poort zou sluiten, toen het donker was, dat die mannen naar buiten gingen; ik weet niet waarheen die mannen gegaan zijn; jaag hen snel na, want u zult ze inhalen. Maar zij had hen op het dak laten klimmen, en zij had hen verstopt onder de vlasstoppels, die zij op het dak had klaargelegd.", "Jes 54:16": "Zie, Ik heb de smid geschapen, die de kolen in het vuur opblaast, en die het instrument voortbrengt tot zijn werk; ook heb Ik de verderver geschapen om te vernielen.", "Luk 16:8": "En de heer prees de onrechtvaardige rentmeester, omdat hij voorzichtig gehandeld had; want de kinderen van deze wereld zijn voorzichtiger dan de kinderen van het licht, in hun geslacht.", "Fil 1:12": "En ik wil dat u weet, broeders, dat wat er met mij gebeurd is, meer tot bevordering van het Evangelie gekomen is;", "Klaagl 3:37": "Mem. Wie zegt iets, en het gebeurt, als de Heere het niet beveelt?", "2 Sam 17:1-14": "Verder zei Achitofel tegen Absalom: Laat mij nu twaalfduizend man uitkiezen, dan sta ik op en jaag David deze nacht achterna. Zo zal ik hem overvallen terwijl hij moe en slap van handen is, en zal hem schrik aanjagen; en al het volk dat bij hem is zal vluchten; dan zal ik de koning alleen doden. En ik zal al het volk naar u laten terugkeren; de man die u zoekt, is gelijk aan het terugkeren van allen; zo zal al het volk in vrede zijn.", "Richt 12:6": "dan zeiden zij tegen hem: Zeg dan Schibboleth; maar hij zei: Sibbolet, en kon het zo niet goed uitspreken; dan grepen zij hem en doodden hem bij de doorwaadbare plaatsen van de Jordaan, zodat er in die tijd van Efraïm tweeënveertigduizend vielen.", "1 Sam 18:20": "Doch Michal, de dochter van Saul, had David lief. Toen dat Saul te kennen werd gegeven, was die zaak goed in zijn ogen.", "Est 7:10": "Zo hingen zij Haman aan de galg, die hij voor Mordechai had laten maken; en de grimmigheid van de koning werd gestild.", "1 Sam 24:4": "En hij kwam bij de schaapskooien aan de weg, waar een spelonk was; en Saul ging daarin, om zijn voeten te bedekken. David nu en zijn mannen zaten aan de zijkanten van de spelonk.", "Richt 8:4": "Toen Gideon nu bij de Jordaan gekomen was, ging hij eroverheen, met de driehonderd mannen die bij hem waren, moe, maar toch nog vervolgend.", "Rom 8:28": "En wij weten dat voor hen die God liefhebben, alle dingen meewerken ten goede, namelijk voor hen die naar Zijn voornemen geroepen zijn.", "2 Sam 12:30": "En hij nam de kroon van hun koning van zijn hoofd af, waarvan het gewicht een talent goud was, met edelstenen; en die werd op Davids hoofd gezet; ook bracht hij een zeer grote roof van de stad naar buiten.", "Gen 13:16": "En Ik zal uw nageslacht stellen als het stof van de aarde, zodat als iemand het stof van de aarde zal kunnen tellen, ook uw nageslacht geteld zal worden.", "2 Sam 23:18": "Abisai, Joabs broer, de zoon van Zeruja, die was ook een hoofd van drie; en hij hief zijn speer op tegen driehonderd man, die door hem verslagen werden; en hij had een naam onder die drie.", "Richt 11:33": "En hij versloeg hen van Aroer af tot waar u komt bij Minnith, twintig steden, en tot aan Abel-Keramim, met een zeer grote slag. Zo werden de kinderen van Ammon onderworpen voor het aangezicht van de kinderen van Israël.", "2 Sam 15:18": "En al zijn knechten trokken aan zijn zijde voorbij, ook alle Krethi en alle Plethi, en alle Gethieten, zeshonderd man die van Gath te voet gekomen waren, trokken voor het aangezicht van de koning voorbij.", "Ezech 29:20": "Als zijn arbeidsloon, omdat hij tegen haar gediend heeft, heb Ik hem Egypteland gegeven, omdat zij voor Mij gewerkt hebben, spreekt de Heere HEERE.", "Obadja 1:3": "De trots van uw hart heeft u bedrogen; u die woont in de kloven van de rotsen, in uw hoge woning; die in uw hart zegt: Wie zou mij ter aarde neerstoten?", "2 Sam 2:8": "Abner nu, de zoon van Ner, de legeraanvoerder die Saul gehad had, nam Isboseth, Sauls zoon, en voerde hem over naar Mahanaim,", "Spr 21:1": "Het hart van de koning is in de hand van de HEERE als waterbeken. Hij neigt het tot alles wat Hij wil.", "Job 31:3": "Is niet het verderf voor de verkeerde, ja, wat vreemds voor de werkers van ongerechtigheid?", "Mark 4:26-28": "En Hij zei: Zo is het Koninkrijk van God, alsof een mens het zaad in de aarde wierp; en vervolgens sliep en opstond, nacht en dag; en het zaad ontkiemde en groeide op, terwijl hij zelf niet wist hoe. Want de aarde brengt uit zichzelf vruchten voort: eerst het kruid, daarna de aar, daarna het volle koren in de aar.", "Spr 11:14": "Als er geen wijs beleid is, valt het volk; maar de behoudenis is in de veelheid van raadslieden.", "2 Sam 17:21-29": "En het gebeurde, nadat zij weggegaan waren, dat zij uit de put klommen, en heengingen en het aan koning David vertelden; en zij zeiden tegen David: Sta op, en ga snel het water over, want zo heeft Achitofel tegen u geraden. Toen stond David op, en al het volk dat bij hem was; en zij gingen de Jordaan over. Bij het morgenlicht ontbrak er niet één die niet de Jordaan overgegaan was. Toen Achitofel nu zag dat zijn raad niet was opgevolgd, zadelde hij de ezel, stond op, en ging naar zijn huis in zijn stad, en gaf bevel aan zijn huis, en verhing zich. Zo stierf hij, en werd begraven in het graf van zijn vader.", "Matt 10:16": "Zie, Ik zend u als schapen te midden van de wolven; wees dan voorzichtig zoals de slangen, en oprecht zoals de duiven.", "Gen 32:2": "En Jakob zei, toen hij hen zag: Dit is een leger van God! En hij noemde de naam van die plaats Mahanaim.", "Spr 20:18": "Elke gedachte wordt door raad bevestigd, voer daarom oorlog met wijze raadslagen.", "Jes 10:14": "en mijn hand heeft het vermogen van de volken gevonden, als een nest, en ik heb het hele aardrijk samengeraapt, zoals men de eieren die verlaten zijn samenraapt; en er is niemand geweest die een vleugel bewoog, of de bek opendeed, of piepte.", "Ps 34:9-11": "Teth. Proeft en ziet dat de HEERE goed is; gelukkig is de man die op Hem vertrouwt. Jod. Vreest de HEERE, u, Zijn heiligen! Want die Hem vrezen hebben geen gebrek. Caph. De jonge leeuwen lijden armoede en honger; maar die de HEERE zoeken hebben geen gebrek aan enig goed.", "Richt 7:24": "Ook zond Gideon boden naar heel het gebergte van Efraïm, en zei: Kom naar beneden, de Midianieten tegemoet, en neem hun de wateren af, tot aan Beth-bara, namelijk de Jordaan; zo werd elke man van Efraïm bijeengeroepen, en zij namen hun de wateren af tot aan Beth-bara, en de Jordaan.", "1 Kon 1:9": "En Adonia slachtte schapen en runderen en gemest vee bij de steen Zoheleth, die bij de bron Rogel is; en nodigde al zijn broers, de zonen van de koning, en alle mannen van Juda, de knechten van de koning.", "Amos 9:3": "En al verstopten zij zich op de top van de Karmel, dan zal Ik ze opsporen en vandaar halen; en al verborgen zij zich voor Mijn ogen op de bodem van de zee, dan zal Ik vandaar de slang gebieden, die zal ze bijten.", "1 Sam 17:50": "Zo overweldigde David de Filistijn met een slinger en met een steen; en hij versloeg de Filistijn en doodde hem; doch David had geen zwaard in zijn hand.", "Jes 45:1-6": "Zo zegt de HEERE tegen Zijn gezalfde, tegen Kores, wiens rechterhand Ik vastheb, om de volken voor zijn aangezicht neer te werpen; en Ik zal de lendenen van de koningen ontbinden, om voor zijn aangezicht de deuren te openen, en de poorten zullen niet gesloten worden: Ik zal voor uw aangezicht gaan, en Ik zal de kromme wegen recht maken; de koperen deuren zal Ik verbreken, en de ijzeren grendels zal Ik in stukken slaan. En Ik zal u de schatten geven die in de duisternissen zijn, en de verborgen rijkdommen; opdat u weet dat Ik de HEERE ben, Die u bij uw naam roept, de God van Israël;", "2 Sam 20:20": "Toen antwoordde Joab, en zei: Het zij verre, het zij verre van mij, dat ik zou verslinden, en dat ik zou verderven!", "Matt 24:2": "En Jezus zei tegen hen: Ziet u niet al deze dingen? Voorwaar, Ik zeg u: hier zal geen steen op de andere steen gelaten worden, die niet zal worden afgebroken.", "Spr 1:16": "Want hun voeten lopen tot het kwade; en zij haasten zich om bloed te storten."}, "noten": {}, "koppeling": {"1": "<span class=\"wl\" data-l=\"L1\" data-code=\"H559\">Verder</span> zei <span class=\"wl\" data-l=\"L2\" data-code=\"H302\">Achitofel</span> tegen <span class=\"wl\" data-l=\"L3\" data-code=\"H53\">Absalom</span>: <span class=\"wl\" data-l=\"L4\" data-code=\"H4994\">Laat</span> < \">is</span> <span class=\"wl\" data-l=\"L12\" data-code=\"H7457\">hongerig</span>, <span class=\"wl\" data-l=\"L14\" data-code=\"H6771\">en</span> moe, <span class=\"wl\" data-l=\"L13\" data-code=\"H5889\">en</span> <span class=\"wl\" data-l=\"L14\" data-code=\"H6771\">dorstig</span> <span class=\"wl\" data-l=\"L14\" data-code=\"H6771\">in</span> <span class=\"wl\" data-l=\"L15\" data-code=\"H4057\">de</span> <span class=\"wl\" data-l=\"L15\" data-code=\"H4057\">woestijn</span>."}, "koppeling_kjv": {"1": "Moreover <span class=\"wl wl-kjv\" data-code=\"H302\">Ahithophel</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom,</span> Let me now choose <span class=\"wl wl-kjv\" data-code=\"H977\">out</span> <span class=\"wl wl-kjv\" data-code=\"H8147\">twelve</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> <span class=\"wl wl-kjv\" data-code=\"H376\">men,</span> and I will <span class=\"wl wl-kjv\" data-code=\"H6965\">arise</span> and <span class=\"wl wl-kjv\" data-code=\"H7291\">pursue</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> this <span class=\"wl wl-kjv\" data-code=\"H3915\">night:</span>", "2": "And I will <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> upon him while he is <span class=\"wl wl-kjv\" data-code=\"H3023\">weary</span> and <span class=\"wl wl-kjv\" data-code=\"H7504\">weak</span> <span class=\"wl wl-kjv\" data-code=\"H3027\">handed,</span> and will make him <span class=\"wl wl-kjv\" data-code=\"H2729\">afraid:</span> and all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> that are with him shall <span class=\"wl wl-kjv\" data-code=\"H5127\">flee;</span> and I will <span class=\"wl wl-kjv\" data-code=\"H5221\">smite</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> only:", "3": "And I will bring <span class=\"wl wl-kjv\" data-code=\"H7725\">back</span> all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> unto thee: the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> whom thou <span class=\"wl wl-kjv\" data-code=\"H1245\">seekest</span> is as if all <span class=\"wl wl-kjv\" data-code=\"H7725\">returned:</span> so all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> shall be in <span class=\"wl wl-kjv\" data-code=\"H7965\">peace.</span>", "4": "And the <span class=\"wl wl-kjv\" data-code=\"H1697\">saying</span> <span class=\"wl wl-kjv\" data-code=\"H3474\">pleased</span> <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom</span> <span class=\"wl wl-kjv\" data-code=\"H5869\">well,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H2205\">elders</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel.</span>", "5": "Then <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom,</span> <span class=\"wl wl-kjv\" data-code=\"H7121\">Call</span> now <span class=\"wl wl-kjv\" data-code=\"H2365\">Hushai</span> the <span class=\"wl wl-kjv\" data-code=\"H757\">Archite</span> also, and let us <span class=\"wl wl-kjv\" data-code=\"H8085\">hear</span> likewise what he <span class=\"wl wl-kjv\" data-code=\"H6310\">saith.</span>", "6": "And when <span class=\"wl wl-kjv\" data-code=\"H2365\">Hushai</span> was <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> to <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom,</span> <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom</span> <span class=\"wl wl-kjv\" data-code=\"H559\">spake</span> unto him, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H302\">Ahithophel</span> hath <span class=\"wl wl-kjv\" data-code=\"H1696\">spoken</span> after this <span class=\"wl wl-kjv\" data-code=\"H1697\">manner:</span> shall we <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> after his <span class=\"wl wl-kjv\" data-code=\"H1697\">saying?</span> if not; <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> thou.", "7": "And <span class=\"wl wl-kjv\" data-code=\"H2365\">Hushai</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom,</span> The <span class=\"wl wl-kjv\" data-code=\"H6098\">counsel</span> that <span class=\"wl wl-kjv\" data-code=\"H302\">Ahithophel</span> hath <span class=\"wl wl-kjv\" data-code=\"H3289\">given</span> is not <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> at this <span class=\"wl wl-kjv\" data-code=\"H6471\">time.</span>", "8": "For, <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> <span class=\"wl wl-kjv\" data-code=\"H2365\">Hushai,</span> thou <span class=\"wl wl-kjv\" data-code=\"H3045\">knowest</span> thy <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> and his <span class=\"wl wl-kjv\" data-code=\"H582\">men,</span> that they be mighty <span class=\"wl wl-kjv\" data-code=\"H1368\">men,</span> and they be <span class=\"wl wl-kjv\" data-code=\"H4751\">chafed</span> in their <span class=\"wl wl-kjv\" data-code=\"H5315\">minds,</span> as a <span class=\"wl wl-kjv\" data-code=\"H1677\">bear</span> <span class=\"wl wl-kjv\" data-code=\"H7909\">robbed</span> of her whelps in the <span class=\"wl wl-kjv\" data-code=\"H7704\">field:</span> and thy <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> is a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H4421\">war,</span> and will not <span class=\"wl wl-kjv\" data-code=\"H3885\">lodge</span> with the <span class=\"wl wl-kjv\" data-code=\"H5971\">people.</span>", "9": "Behold, he is <span class=\"wl wl-kjv\" data-code=\"H2244\">hid</span> now in <span class=\"wl wl-kjv\" data-code=\"H259\">some</span> <span class=\"wl wl-kjv\" data-code=\"H6354\">pit,</span> or in <span class=\"wl wl-kjv\" data-code=\"H259\">some</span> other <span class=\"wl wl-kjv\" data-code=\"H4725\">place:</span> and it will come to pass, when some of them be <span class=\"wl wl-kjv\" data-code=\"H5307\">overthrown</span> at the <span class=\"wl wl-kjv\" data-code=\"H8462\">first,</span> that <span class=\"wl wl-kjv\" data-code=\"H8085\">whosoever</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">heareth</span> it will <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> There is a <span class=\"wl wl-kjv\" data-code=\"H4046\">slaughter</span> among the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> that <span class=\"wl wl-kjv\" data-code=\"H310\">follow</span> <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom.</span>", "10": "And he also that is <span class=\"wl wl-kjv\" data-code=\"H1121\">valiant,</span> whose <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> is as the <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> of a <span class=\"wl wl-kjv\" data-code=\"H738\">lion,</span> shall <span class=\"wl wl-kjv\" data-code=\"H4549\">utterly</span> <span class=\"wl wl-kjv\" data-code=\"H4549\">melt:</span> for all <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H3045\">knoweth</span> that thy <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> is a mighty <span class=\"wl wl-kjv\" data-code=\"H1368\">man,</span> and they which be with him are <span class=\"wl wl-kjv\" data-code=\"H2428\">valiant</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">men.</span>", "11": "Therefore I <span class=\"wl wl-kjv\" data-code=\"H3289\">counsel</span> that all <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> be <span class=\"wl wl-kjv\" data-code=\"H622\">generally</span> <span class=\"wl wl-kjv\" data-code=\"H622\">gathered</span> unto thee, from <span class=\"wl wl-kjv\" data-code=\"H1835\">Dan</span> even to <span class=\"wl wl-kjv\" data-code=\"H884\">Beersheba,</span> as the <span class=\"wl wl-kjv\" data-code=\"H2344\">sand</span> that is by the <span class=\"wl wl-kjv\" data-code=\"H3220\">sea</span> for <span class=\"wl wl-kjv\" data-code=\"H7230\">multitude;</span> and that thou <span class=\"wl wl-kjv\" data-code=\"H1980\">go</span> to <span class=\"wl wl-kjv\" data-code=\"H7128\">battle</span> in thine own <span class=\"wl wl-kjv\" data-code=\"H6440\">person.</span>", "12": "So shall we <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> upon him in <span class=\"wl wl-kjv\" data-code=\"H259\">some</span> <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> where he shall be <span class=\"wl wl-kjv\" data-code=\"H4672\">found,</span> and we will <span class=\"wl wl-kjv\" data-code=\"H5168\">light</span> upon him as the <span class=\"wl wl-kjv\" data-code=\"H2919\">dew</span> <span class=\"wl wl-kjv\" data-code=\"H5307\">falleth</span> on the <span class=\"wl wl-kjv\" data-code=\"H127\">ground:</span> and of him and of all the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> that are with him there shall not be <span class=\"wl wl-kjv\" data-code=\"H3498\">left</span> so much <span class=\"wl wl-kjv\" data-code=\"H1571\">as</span> <span class=\"wl wl-kjv\" data-code=\"H259\">one.</span>", "13": "Moreover, <span class=\"wl wl-kjv\" data-code=\"H518\">if</span> he be <span class=\"wl wl-kjv\" data-code=\"H622\">gotten</span> into a <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> then shall all <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H5375\">bring</span> <span class=\"wl wl-kjv\" data-code=\"H2256\">ropes</span> to that <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> and we will <span class=\"wl wl-kjv\" data-code=\"H5498\">draw</span> it into the <span class=\"wl wl-kjv\" data-code=\"H5158\">river,</span> until there be not <span class=\"wl wl-kjv\" data-code=\"H1571\">one</span> small <span class=\"wl wl-kjv\" data-code=\"H6872\">stone</span> <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> there.", "14": "And <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom</span> and all the <span class=\"wl wl-kjv\" data-code=\"H376\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> The <span class=\"wl wl-kjv\" data-code=\"H6098\">counsel</span> of <span class=\"wl wl-kjv\" data-code=\"H2365\">Hushai</span> the <span class=\"wl wl-kjv\" data-code=\"H757\">Archite</span> is <span class=\"wl wl-kjv\" data-code=\"H2896\">better</span> than the <span class=\"wl wl-kjv\" data-code=\"H6098\">counsel</span> of <span class=\"wl wl-kjv\" data-code=\"H302\">Ahithophel.</span> For the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> had <span class=\"wl wl-kjv\" data-code=\"H6680\">appointed</span> to <span class=\"wl wl-kjv\" data-code=\"H6565\">defeat</span> the <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> <span class=\"wl wl-kjv\" data-code=\"H6098\">counsel</span> of <span class=\"wl wl-kjv\" data-code=\"H302\">Ahithophel,</span> to the <span class=\"wl wl-kjv\" data-code=\"H5668\">intent</span> that the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> might <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> upon <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom.</span>", "15": "Then <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> <span class=\"wl wl-kjv\" data-code=\"H2365\">Hushai</span> unto <span class=\"wl wl-kjv\" data-code=\"H6659\">Zadok</span> and to <span class=\"wl wl-kjv\" data-code=\"H54\">Abiathar</span> the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests,</span> Thus and thus did <span class=\"wl wl-kjv\" data-code=\"H302\">Ahithophel</span> <span class=\"wl wl-kjv\" data-code=\"H3289\">counsel</span> <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom</span> and the <span class=\"wl wl-kjv\" data-code=\"H2205\">elders</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel;</span> and thus and thus have I <span class=\"wl wl-kjv\" data-code=\"H3289\">counselled.</span>", "16": "Now therefore <span class=\"wl wl-kjv\" data-code=\"H7971\">send</span> <span class=\"wl wl-kjv\" data-code=\"H4120\">quickly,</span> and <span class=\"wl wl-kjv\" data-code=\"H5046\">tell</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H3885\">Lodge</span> not this <span class=\"wl wl-kjv\" data-code=\"H3915\">night</span> in the <span class=\"wl wl-kjv\" data-code=\"H6160\">plains</span> of the <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness,</span> but <span class=\"wl wl-kjv\" data-code=\"H5674\">speedily</span> pass <span class=\"wl wl-kjv\" data-code=\"H5674\">over;</span> lest the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> be swallowed <span class=\"wl wl-kjv\" data-code=\"H1104\">up,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> that are with him.", "17": "Now <span class=\"wl wl-kjv\" data-code=\"H3083\">Jonathan</span> and <span class=\"wl wl-kjv\" data-code=\"H290\">Ahimaaz</span> <span class=\"wl wl-kjv\" data-code=\"H5975\">stayed</span> by <span class=\"wl wl-kjv\" data-code=\"H5883\">Enrogel;</span> for they <span class=\"wl wl-kjv\" data-code=\"H3201\">might</span> not be <span class=\"wl wl-kjv\" data-code=\"H7200\">seen</span> to <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> into the <span class=\"wl wl-kjv\" data-code=\"H5892\">city:</span> and a <span class=\"wl wl-kjv\" data-code=\"H8198\">wench</span> <span class=\"wl wl-kjv\" data-code=\"H1980\">went</span> and <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> them; and they <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> and <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David.</span>", "18": "Nevertheless a <span class=\"wl wl-kjv\" data-code=\"H5288\">lad</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> them, and <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom:</span> but they <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> <span class=\"wl wl-kjv\" data-code=\"H8147\">both</span> of them away <span class=\"wl wl-kjv\" data-code=\"H4120\">quickly,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to a <span class=\"wl wl-kjv\" data-code=\"H376\">man's</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> in <span class=\"wl wl-kjv\" data-code=\"H980\">Bahurim,</span> which had a <span class=\"wl wl-kjv\" data-code=\"H875\">well</span> in his <span class=\"wl wl-kjv\" data-code=\"H2691\">court;</span> <span class=\"wl wl-kjv\" data-code=\"H8033\">whither</span> they went <span class=\"wl wl-kjv\" data-code=\"H3381\">down.</span>", "19": "And the <span class=\"wl wl-kjv\" data-code=\"H802\">woman</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> and <span class=\"wl wl-kjv\" data-code=\"H6566\">spread</span> a <span class=\"wl wl-kjv\" data-code=\"H4539\">covering</span> over the <span class=\"wl wl-kjv\" data-code=\"H875\">well's</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">mouth,</span> and <span class=\"wl wl-kjv\" data-code=\"H7849\">spread</span> ground <span class=\"wl wl-kjv\" data-code=\"H7383\">corn</span> thereon; and the <span class=\"wl wl-kjv\" data-code=\"H1697\">thing</span> was not <span class=\"wl wl-kjv\" data-code=\"H3045\">known.</span>", "20": "And when <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom's</span> <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to the <span class=\"wl wl-kjv\" data-code=\"H802\">woman</span> to the <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> they <span clas const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    if (!kjvTekst && (!engels || !engels.length)) return '<em>Geen verwijzingen bij dit vers.</em>';
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    if (engels && engels.length) {
      h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}
</script>
</body>
</html>
