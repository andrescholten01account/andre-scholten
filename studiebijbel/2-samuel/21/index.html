oud van Saul en van zijn huis; ook gaat het ons niet om iemand te doden in Israël. En hij zei: Wat zegt u dan, dat ik voor u doen zal?","5":"En zij zeiden tegen de koning: De man die ons te gronde gericht heeft, en tegen ons beraamd heeft dat wij verdelgd zouden worden, zonder te kunnen bestaan in enig gebied van Israël;","6":"Laat ons zeven mannen van zijn zonen gegeven worden, zodat wij hen voor de HEERE ophangen te Gibea van Saul, o, u verkorene van de HEERE! En de koning zei: Ik zal hen geven.","7":"Doch de koning spaarde Mefiboseth, de zoon van Jonathan, de zoon van Saul, om de eed van de HEERE, die tussen hen was, tussen David en tussen Jonathan, Sauls zoon.","8":"Maar de koning nam de twee zonen van Rizpa, dochter van Aja, die zij Saul gebaard had, Armoni en Mefiboseth; en verder de vijf zonen van Michals zuster, Sauls dochter, die zij Adriël, de zoon van Barzillai, de Meholathiet, gebaard had;","9":"En hij gaf hen in de hand van de Gibeonieten, die hen ophingen op de berg voor het aangezicht van de HEERE; en die zeven vielen tegelijk; en zij werden gedood in de dagen van de oogst, in de eerste dagen, in het begin van de gersteoogst.","10":"Toen nam Rizpa, de dochter van Aja, een rouwkleed, en spande dit voor zich uit op een rotssteen, vanaf het begin van de oogst, totdat er water op hen drupte uit de hemel; en zij liet het gevogelte van de hemel overdag niet op hen rusten, en het gedierte van het veld 's nachts ook niet.","11":"En het werd David aangezegd, wat Rizpa, de dochter van Aja, Sauls bijvrouw, gedaan had.","12":"Toen ging David heen, en nam de beenderen van Saul, en de beenderen van Jonathan, zijn zoon, van de burgers van Jabes in Gilead, die ze gestolen hadden van de straat van Beth-San, waar de Filistijnen ze hadden opgehangen, op de dag dat de Filistijnen Saul sloegen op Gilboa.","13":"En hij bracht van daar de beenderen van Saul, en de beenderen van Jonathan, zijn zoon; ook verzamelden zij de beenderen van de gehangenen.","14":"En zij begroeven de beenderen van Saul en zijn zoon Jonathan in het land van Benjamin te Zela, in het graf van zijn vader Kis, en deden alles wat de koning geboden had. Zo werd God na dezen voor het land vermurwd[1].","15":"Verder hadden de Filistijnen nog een oorlog tegen Israël. En David trok af, en zijn knechten met hem, en zij streden tegen de Filistijnen, zodat David moe werd.","16":"En Isbi-Benob, die van de kinderen van Rafa was, met een speer die driehonderd sikkel koper woog, en hij was omgord met een nieuw zwaard; deze dacht David te doden.","17":"Maar Abisai, de zoon van Zeruja, hielp hem, en sloeg de Filistijn, en doodde hem. Toen zwoeren de mannen van David hem, en zeiden: U zult niet meer met ons uittrekken ten strijde, zodat u de lamp van Israël niet uitblust.","18":"En het gebeurde daarna, dat er opnieuw een oorlog was te Gob tegen de Filistijnen. Toen sloeg Sibbechai, de Husathiet, Saf, die van de kinderen van Rafa was.","19":"Verder was er nog een oorlog te Gob tegen de Filistijnen; en Elhanan, de zoon van Jaäre-Oregim, de Bethlehemiet, sloeg de broer van Goliath, de Gethiet, wiens speersteel was als een weversboom.","20":"Ook was er nog een oorlog te Gath; en er was een zeer lange man, die zes vingers had aan zijn handen, en zes tenen aan zijn voeten, vierentwintig in getal, en deze was ook aan Rafa geboren.","21":"En hij hoonde Israël; maar Jonathan, de zoon van Simea, Davids broer, sloeg hem.","22":"Deze vier waren aan Rafa geboren te Gath; en zij vielen door de hand van David, en door de hand van zijn knechten."},"SV":{"1":"En er was in Davids dagen een honger, drie jaren, jaar achter jaar; en David zocht het aangezicht des HEEREN. En de HEERE zeide: Het is om Saul en om des bloedhuizes wil, omdat hij de Gibeonieten gedood heeft.","2":"Toen riep de koning de Gibeonieten, en zeide tot hen: (De Gibeonieten nu waren niet van de kinderen Israëls, maar van het overblijfsel der Amorieten; en de kinderen Israëls hadden hun gezworen, maar Saul zocht hen te slaan in zijn ijver voor de kinderen van Israël en Juda.)","3":"David dan zeide tot de Gibeonieten: Wat zal ik ulieden doen, en waarmede zal ik verzoenen, dat gij het erfdeel des HEEREN zegent?","4":"Toen zeiden de Gibeonieten tot hem: Het is ons niet *te* *doen* *om* zilver en goud met Saul en met zijn huis; ook is het ons niet om iemand te doden in Israël. En hij zeide: Wat zegt gij dan, dat ik u doen zal?","5":"En zij zeiden tot den koning: De man die ons te niet gemaakt, en tegen ons gedacht heeft, dat wij zouden verdelgd worden, zonder te kunnen bestaan in enige landpale van Israël;","6":"Laat ons zeven mannen van zijn zonen gegeven worden, dat wij hen den HEERE ophangen te Gibea Sauls, o, gij verkorene des HEEREN! En de koning zeide: Ik zal hen geven.","7":"Doch de koning verschoonde Mefiboseth, den zoon van Jonathan, den zoon van Saul, om den eed des HEEREN, die tussen hen was, tussen David en tussen Jonathan, Sauls zoon.","8":"Maar de koning nam de twee zonen van Rizpa, dochter van Aja, die zij Saul gebaard had, Armoni en Mefiboseth; daartoe de vijf zonen van Michals *zuster*, Sauls dochter, die zij Adriël, den zoon van Barzillai, den Meholathiet, gebaard had;","9":"En hij gaf hen in de hand der Gibeonieten, die ze ophingen op den berg voor het aangezicht des HEEREN; en die zeven vielen tegelijk; en zij werden gedood in de dagen van den oogst, in de eerste *dagen*, in het begin van den gersteoogst.","10":"Toen nam Rizpa, de dochter van Aja, een zak, en spande dien voor zich uit op een rotssteen, van het begin van den oogst, totdat er water op hen drupte van den hemel; en zij liet het gevogelte des hemels op hen niet rusten des daags, noch het gedierte van het veld des nachts.","11":"En het werd David aangezegd, wat Rizpa, de dochter van Aja, Sauls bijwijf, gedaan had.","12":"Zo ging David henen, en nam de beenderen van Saul, en de beenderen van Jonathan, zijn zoon, van de burgeren van Jabes in Gilead, die dezelve gestolen hadden van de straat Beth-san, alwaar de Filistijnen ze hadden opgehangen , ten dage als de Filistijnen Saul sloegen op Gilboa.","13":"En hij bracht van daar op de beenderen van Saul, en de beenderen van Jonathan, zijn zoon; ook verzamelden zij de beenderen der gehangenen.","14":"En zij begroeven de beenderen van Saul en zijn zoon Jonathan in het land van Benjamin te Zela, in het graf van zijn vader Kis, en deden alles, wat de koning geboden had. Alzo werd God na dezen den lande verbeden.","15":"Voorts hadden de Filistijnen nog een krijg tegen Israël. En David toog af, en zijn knechten met hem, en streden tegen de Filistijnen, dat David moede werd.","16":"En Isbi Benob, die van de kinderen van Rafa was, en het gewicht zijner spies driehonderd gewicht kopers, en hij was aangegord met een nieuw *zwaard*; deze dacht David te slaan.","17":"Maar Abisai, de zoon van Zeruja, hielp hem, en sloeg den Filistijn, en doodde hem. Toen zwoeren hem de mannen van David, zeggende: Gij zult niet meer met ons uittrekken ten strijde, opdat gij de lamp van Israël niet uitblust.","18":"En het geschiedde daarna, dat er wederom een krijg was te Gob tegen de Filistijnen. Toen sloeg Sibbechai, de Husathiet, Saf, die van de kinderen van Rafa was.","19":"Voorts was er nog een krijg te Gob tegen de Filistijnen; en Elhanan, de zoon van Jaare-oregim, sloeg Beth-halachmi, *dewelke* *was* met Goliath, den Gethiet, wiens spiesenhout was als een weversboom.","20":"Nog was er ook een krijg te Gath; en er was een zeer lang man, die zes vingeren had aan zijn handen, en zes tenen aan zijn voeten, vier en twintig in getal, en deze was ook aan Rafa geboren.","21":"En hij hoonde Israël; maar Jonathan, de zoon van Simea, Davids broeder, sloeg hem.","22":"Deze vier waren aan Rafa geboren te Gath; en zij vielen door de hand van David, en door de hand zijner knechten."},"KJV":{"1":"Then there was a famine in the days of David three years, year after year; and David enquired of the LORD. And the LORD answered, It is for Saul, and for his bloody house, because he slew the Gibeonites.","2":"And the king called the Gibeonites, and said unto them; (now the Gibeonites were not of the children of Israel, but of the remnant of the Amorites; and the children of Israel had sworn unto them: and Saul sought to slay them in his zeal to the children of Israel and Judah.)","3":"Wherefore David said unto the Gibeonites, What shall I do for you? and wherewith shall I make the atonement, that ye may bless the inheritance of the LORD?","4":"And the Gibeonites said unto him, We will have no silver nor gold of Saul, nor of his house; neither for us shalt thou kill any man in Israel. And he said, What ye shall say, that will I do for you.","5":"And they answered the king, The man that consumed us, and that devised against us that we should be destroyed from remaining in any of the coasts of Israel,","6":"Let seven men of his sons be delivered unto us, and we will hang them up unto the LORD in Gibeah of Saul, whom the LORD did choose. And the king said, I will give them.","7":"But the king spared Mephibosheth, the son of Jonathan the son of Saul, because of the LORD'S oath that was between them, between David and Jonathan the son of Saul.","8":"But the king took the two sons of Rizpah the daughter of Aiah, whom she bare unto Saul, Armoni and Mephibosheth; and the five sons of Michal the daughter of Saul, whom she brought up for Adriel the son of Barzillai the Meholathite:","9":"And he delivered them into the hands of the Gibeonites, and they hanged them in the hill before the LORD: and they fell all seven together, and were put to death in the days of harvest, in the first days, in the beginning of barley harvest.","10":"And Rizpah the daughter of Aiah took sackcloth, and spread it for her upon the rock, from the beginning of harvest until water dropped upon them out of heaven, and suffered neither the birds of the air to rest on them by day, nor the beasts of the field by night.","11":"And it was told David what Rizpah the daughter of Aiah, the concubine of Saul, had done.","12":"And David went and took the bones of Saul and the bones of Jonathan his son from the men of Jabeshgilead, which had stolen them from the street of Bethshan, where the Philistines had hanged them, when the Philistines had slain Saul in Gilboa:","13":"And he brought up from thence the bones of Saul and the bones of Jonathan his son; and they gathered the bones of them that were hanged.","14":"And the bones of Saul and Jonathan his son buried they in the country of Benjamin in Zelah, in the sepulchre of Kish his father: and they performed all that the king commanded. And after that God was intreated for the land.","15":"Moreover the Philistines had yet war again with Israel; and David went down, and his servants with him, and fought against the Philistines: and David waxed faint.","16":"And Ishbibenob, which was of the sons of the giant, the weight of whose spear weighed three hundred shekels of brass in weight, he being girded with a new sword, thought to have slain David.","17":"But Abishai the son of Zeruiah succoured him, and smote the Philistine, and killed him. Then the men of David sware unto him, saying, Thou shalt go no more out with us to battle, that thou quench not the light of Israel.","18":"And it came to pass after this, that there was again a battle with the Philistines at Gob: then Sibbechai the Hushathite slew Saph, which was of the sons of the giant.","19":"And there was again a battle in Gob with the Philistines, where Elhanan the son of Jaareoregim, a Bethlehemite, slew the brother of Goliath the Gittite, the staff of whose spear was like a weaver's beam.","20":"And there was yet a battle in Gath, where was a man of great stature, that had on every hand six fingers, and on every foot six toes, four and twenty in number; and he also was born to the giant.","21":"And when he defied Israel, Jonathan the son of Shimea the brother of David slew him.","22":"These four were born to the giant in Gath, and fell by the hand of David, and by the hand of his servants."}},"tsk":{"1":[{"kopje":"een hongersnood","refs":["Gen 12:10","Gen 26:1","Gen 41:57","Gen 42:1","Gen 43:1","Lev 26:19","Lev 26:20","Lev 26:26","1 Kon 17:1","1 Kon 18:2","2 Kon 6:25","2 Kon 8:1","Jer 14:1-18"]},{"kopje":"van de HEERE","refs":["2 Sam 5:19","2 Sam 5:23","Num 27:21","1 Sam 23:2","1 Sam 23:4","1 Sam 23:11","Job 5:8-10","Job 10:2","Ps 50:15","Ps 91:15"]},{"kopje":"Het is","refs":["Joz 7:1","Joz 7:11","Joz 7:12"]},{"kopje":"Saul","refs":["1 Sam 22:17-19"]}],"2":[{"kopje":"nu waren","refs":["Joz 9:3-21"]},{"kopje":"de Amorieten","refs":["Joz 6:19","Gen 15:16"]},{"kopje":"in zijn ijver","refs":["Deut 7:16","1 Sam 14:44","1 Sam 15:8","1 Sam 15:9","2 Kon 10:16","2 Kon 10:31","Luk 9:54","Luk 9:55","Joh 16:2","Rom 10:2","Gal 4:17"]}],"3":[{"kopje":"waarmee","refs":["Ex 32:30","Lev 1:4","1 Sam 2:25","Micha 6:6","Micha 6:7","Hebr 9:22","Hebr 10:4-12"]},{"kopje":"zegent","refs":["2 Sam 20:19"]}],"4":[{"kopje":"Het gaat ons niet","refs":["Ps 49:7-9","1 Petr 1:18","1 Petr 1:19"]}],"5":[{"kopje":"De man","refs":["2 Sam 21:1","Est 9:24","Est 9:25","Matt 7:2"]},{"kopje":"beraamd","refs":["Dan 9:26"]}],"6":[{"kopje":"ophangen","refs":["2 Sam 17:23","2 Sam 18:10","Gen 40:19","Gen 40:22","Num 25:4","Num 25:5","Deut 21:22","Joz 8:29","Joz 10:26","Ezra 6:11","Est 9:10","Est 9:13","Est 9:14","Matt 27:5"]},{"kopje":"te","refs":["1 Sam 10:26","1 Sam 11:4"]},{"kopje":"u verkorene van de HEERE","refs":["1 Sam 9:16","1 Sam 9:17","1 Sam 10:1","1 Sam 10:24","Hand 13:21"]}],"7":[{"kopje":"Mefiboseth","refs":["2 Sam 4:4","2 Sam 9:10","2 Sam 16:4","2 Sam 19:25"]},{"kopje":"om","refs":["1 Sam 18:3","1 Sam 20:8","1 Sam 20:15","1 Sam 20:17","1 Sam 20:42","1 Sam 23:18"]}],"8":[{"kopje":"Rizpa","refs":["2 Sam 3:7"]},{"kopje":"de vijf zonen","refs":["1 Sam 18:19"]},{"kopje":"Michals","refs":["1 Sam 18:19"]}],"9":[{"kopje":"voor het aangezicht van de HEERE","refs":["2 Sam 21:6","2 Sam 6:17","2 Sam 6:21","Ex 20:5","Num 35:31-34","Deut 21:1-9"," heritance</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD?</span>","4":"And the <span class=\"wl wl-kjv\" data-code=\"H1393\">Gibeonites</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, We will have no <span class=\"wl wl-kjv\" data-code=\"H3701\">silver</span> nor <span class=\"wl wl-kjv\" data-code=\"H2091\">gold</span> <span class=\"wl wl-kjv\" data-code=\"H5973\">of</span> <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul,</span> nor of his <span class=\"wl wl-kjv\" data-code=\"H1004\">house;</span> neither for us shalt thou <span class=\"wl wl-kjv\" data-code=\"H4191\">kill</span> any <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> in <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel.</span> And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> What ye shall <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> that will I <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> for you.","5":"And they <span class=\"wl wl-kjv\" data-code=\"H559\">answered</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> The <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> that <span class=\"wl wl-kjv\" data-code=\"H3615\">consumed</span> us, and that <span class=\"wl wl-kjv\" data-code=\"H1819\">devised</span> against us that we should be <span class=\"wl wl-kjv\" data-code=\"H8045\">destroyed</span> from <span class=\"wl wl-kjv\" data-code=\"H3320\">remaining</span> in any of the <span class=\"wl wl-kjv\" data-code=\"H1366\">coasts</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span>","6":"Let <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> of his <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> be <span class=\"wl wl-kjv\" data-code=\"H5414\">delivered</span> unto us, and we will hang them <span class=\"wl wl-kjv\" data-code=\"H3363\">up</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> in <span class=\"wl wl-kjv\" data-code=\"H1390\">Gibeah</span> of <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul,</span> whom the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> did <span class=\"wl wl-kjv\" data-code=\"H972\">choose.</span> And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> I will <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> them.","7":"But the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H2550\">spared</span> <span class=\"wl wl-kjv\" data-code=\"H4648\">Mephibosheth,</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H3083\">Jonathan</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul,</span> because of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD'S</span> <span class=\"wl wl-kjv\" data-code=\"H7621\">oath</span> that was between them, between <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> and <span class=\"wl wl-kjv\" data-code=\"H3083\">Jonathan</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul.</span>","8":"But the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> the <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H7532\">Rizpah</span> the <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> of <span class=\"wl wl-kjv\" data-code=\"H345\">Aiah,</span> whom she <span class=\"wl wl-kjv\" data-code=\"H3205\">bare</span> unto <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul,</span> <span class=\"wl wl-kjv\" data-code=\"H764\">Armoni</span> and <span class=\"wl wl-kjv\" data-code=\"H4648\">Mephibosheth;</span> and the <span class=\"wl wl-kjv\" data-code=\"H2568\">five</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H4324\">Michal</span> the <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> of <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul,</span> whom she brought <span class=\"wl wl-kjv\" data-code=\"H3205\">up</span> for <span class=\"wl wl-kjv\" data-code=\"H5741\">Adriel</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H1271\">Barzillai</span> the <span class=\"wl wl-kjv\" data-code=\"H4259\">Meholathite:</span>","9":"And he <span class=\"wl wl-kjv\" data-code=\"H5414\">delivered</span> them into the <span class=\"wl wl-kjv\" data-code=\"H3027\">hands</span> of the <span class=\"wl wl-kjv\" data-code=\"H1393\">Gibeonites,</span> and they <span class=\"wl wl-kjv\" data-code=\"H3363\">hanged</span> them in the <span class=\"wl wl-kjv\" data-code=\"H2022\">hill</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD:</span> and they <span class=\"wl wl-kjv\" data-code=\"H5307\">fell</span> all <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H3162\">together,</span> and were put to <span class=\"wl wl-kjv\" data-code=\"H4191\">death</span> in the <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> of <span class=\"wl wl-kjv\" data-code=\"H7105\">harvest,</span> in the <span class=\"wl wl-kjv\" data-code=\"H7223\">first</span> days, in the <span class=\"wl wl-kjv\" data-code=\"H8462\">beginning</span> of <span class=\"wl wl-kjv\" data-code=\"H8184\">barley</span> <span class=\"wl wl-kjv\" data-code=\"H7105\">harvest.</span>","10":"And <span class=\"wl wl-kjv\" data-code=\"H7532\">Rizpah</span> the <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> of <span class=\"wl wl-kjv\" data-code=\"H345\">Aiah</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> <span class=\"wl wl-kjv\" data-code=\"H8242\">sackcloth,</span> and <span class=\"wl wl-kjv\" data-code=\"H5186\">spread</span> it for her upon the <span class=\"wl wl-kjv\" data-code=\"H6697\">rock,</span> from the <span class=\"wl wl-kjv\" data-code=\"H8462\">beginning</span> of <span class=\"wl wl-kjv\" data-code=\"H7105\">harvest</span> until <span class=\"wl wl-kjv\" data-code=\"H4325\">water</span> <span class=\"wl wl-kjv\" data-code=\"H5413\">dropped</span> upon them out of <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">suffered</span> neither the <span class=\"wl wl-kjv\" data-code=\"H5775\">birds</span> of the <span class=\"wl wl-kjv\" data-code=\"H8064\">air</span> to <span class=\"wl wl-kjv\" data-code=\"H5117\">rest</span> on them by <span class=\"wl wl-kjv\" data-code=\"H3119\">day,</span> nor the <span class=\"wl wl-kjv\" data-code=\"H2416\">beasts</span> of the <span class=\"wl wl-kjv\" data-code=\"H7704\">field</span> by <span class=\"wl wl-kjv\" data-code=\"H3915\">night.</span>","11":"And it was <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> what <span class=\"wl wl-kjv\" data-code=\"H7532\">Rizpah</span> the <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> of <span class=\"wl wl-kjv\" data-code=\"H345\">Aiah,</span> the <span class=\"wl wl-kjv\" data-code=\"H6370\">concubine</span> of <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul,</span> had <span class=\"wl wl-kjv\" data-code=\"H6213\">done.</span>","12":"And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> and <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> the <span class=\"wl wl-kjv\" data-code=\"H6106\">bones</span> of <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> and the <span class=\"wl wl-kjv\" data-code=\"H6106\">bones</span> of <span class=\"wl wl-kjv\" data-code=\"H3083\">Jonathan</span> his <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> from the <span class=\"wl wl-kjv\" data-code=\"H1167\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H3003\">Jabeshgilead,</span> which had <span class=\"wl wl-kjv\" data-code=\"H1589\">stolen</span> them from the <span class=\"wl wl-kjv\" data-code=\"H7339\">street</span> of <span class=\"wl wl-kjv\" data-code=\"H1052\">Bethshan,</span> where the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines</span> had <span class=\"wl wl-kjv\" data-code=\"H8511\">hanged</span> them, <span class=\"wl wl-kjv\" data-code=\"H3117\">when</span> the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines</span> had <span class=\"wl wl-kjv\" data-code=\"H5221\">slain</span> <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> in <span class=\"wl wl-kjv\" data-code=\"H1533\">Gilboa:</span>","13":"And he brought <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> from thence the <span class=\"wl wl-kjv\" data-code=\"H6106\">bones</span> of <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> and the <span class=\"wl wl-kjv\" data-code=\"H6106\">bones</span> of <span class=\"wl wl-kjv\" data-code=\"H3083\">Jonathan</span> his <span class=\"wl wl-kjv\" data-code=\"H1121\">son;</span> and they <span class=\"wl wl-kjv\" data-code=\"H622\">gathered</span> the <span class=\"wl wl-kjv\" data-code=\"H6106\">bones</span> of them that were <span class=\"wl wl-kjv\" data-code=\"H3363\">hanged.</span>","14":"And the <span class=\"wl wl-kjv\" data-code=\"H6106\">bones</span> of <span class=\"wl wl-kjv\" data-code=\"H7586\">Saul</span> and <span class=\"wl wl-kjv\" data-code=\"H3083\">Jonathan</span> his <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> <span class=\"wl wl-kjv\" data-code=\"H6912\">buried</span> they in the <span class=\"wl wl-kjv\" data-code=\"H776\">country</span> of <span class=\"wl wl-kjv\" data-code=\"H1144\">Benjamin</span> in <span class=\"wl wl-kjv\" data-code=\"H6762\">Zelah,</span> in the <span class=\"wl wl-kjv\" data-code=\"H6913\">sepulchre</span> of <span class=\"wl wl-kjv\" data-code=\"H7027\">Kish</span> his <span class=\"wl wl-kjv\" data-code=\"H1\">father:</span> and they <span class=\"wl wl-kjv\" data-code=\"H6213\">performed</span> all that the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded.</span> And <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> that <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> was <span class=\"wl wl-kjv\" data-code=\"H6279\">intreated</span> for the <span class=\"wl wl-kjv\" data-code=\"H776\">land.</span>","15":"Moreover the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines</span> had yet <span class=\"wl wl-kjv\" data-code=\"H4421\">war</span> again with <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel;</span> and <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> went <span class=\"wl wl-kjv\" data-code=\"H3381\">down,</span> and his <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> with him, and <span class=\"wl wl-kjv\" data-code=\"H3898\">fought</span> against the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines:</span> and <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> waxed <span class=\"wl wl-kjv\" data-code=\"H5774\">faint.</span>","16":"And <span class=\"wl wl-kjv\" data-code=\"H3430\">Ishbibenob,</span> which was of the <span class=\"wl wl-kjv\" data-code=\"H3211\">sons</span> of the <span class=\"wl wl-kjv\" data-code=\"H7497\">giant,</span> the <span class=\"wl wl-kjv\" data-code=\"H4948\">weight</span> of whose <span class=\"wl wl-kjv\" data-code=\"H7013\">spear</span> weighed <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> shekels of <span class=\"wl wl-kjv\" data-code=\"H5178\">brass</span> in <span class=\"wl wl-kjv\" data-code=\"H4948\">weight,</span> he being <span class=\"wl wl-kjv\" data-code=\"H2296\">girded</span> with a <span class=\"wl wl-kjv\" data-code=\"H2319\">new</span> sword, <span class=\"wl wl-kjv\" data-code=\"H559\">thought</span> to have <span class=\"wl wl-kjv\" data-code=\"H5221\">slain</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David.</span>","17":"But <span class=\"wl wl-kjv\" data-code=\"H52\">Abishai</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H6870\">Zeruiah</span> <span class=\"wl wl-kjv\" data-code=\"H5826\">succoured</span> him, and <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistine,</span> and <span class=\"wl wl-kjv\" data-code=\"H4191\">killed</span> him. Then the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H7650\">sware</span> unto him, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Thou shalt <span class=\"wl wl-kjv\" data-code=\"H3318\">go</span> no more out with us to <span class=\"wl wl-kjv\" data-code=\"H4421\">battle,</span> that thou <span class=\"wl wl-kjv\" data-code=\"H3518\">quench</span> not the <span class=\"wl wl-kjv\" data-code=\"H5216\">light</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel.</span>","18":"And it came to pass after <span class=\"wl wl-kjv\" data-code=\"H310\">this,</span> that there was again a <span class=\"wl wl-kjv\" data-code=\"H4421\">battle</span> with the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines</span> at <span class=\"wl wl-kjv\" data-code=\"H1359\">Gob:</span> then <span class=\"wl wl-kjv\" data-code=\"H5444\">Sibbechai</span> the <span class=\"wl wl-kjv\" data-code=\"H2843\">Hushathite</span> <span class=\"wl wl-kjv\" data-code=\"H5221\">slew</span> <span class=\"wl wl-kjv\" data-code=\"H5593\">Saph,</span> which was of the <span class=\"wl wl-kjv\" data-code=\"H3211\">sons</span> of the <span class=\"wl wl-kjv\" data-code=\"H7497\">giant.</span>","19":"And there was again a <span class=\"wl wl-kjv\" data-code=\"H4421\">battle</span> in <span class=\"wl wl-kjv\" data-code=\"H1359\">Gob</span> with the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines,</span> where <span class=\"wl wl-kjv\" data-code=\"H445\">Elhanan</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H3296\">Jaareoregim,</span> a <span class=\"wl wl-kjv\" data-code=\"H1022\">Bethlehemite,</span> <span class=\"wl wl-kjv\" data-code=\"H5221\">slew</span> the brother of <span class=\"wl wl-kjv\" data-code=\"H1555\">Goliath</span> the <span class=\"wl wl-kjv\" data-code=\"H1663\">Gittite,</span> the <span class=\"wl wl-kjv\" data-code=\"H6086\">staff</span> of whose <span class=\"wl wl-kjv\" data-code=\"H2595\">spear</span> was like a <span class=\"wl wl-kjv\" data-code=\"H707\">weaver's</span> <span class=\"wl wl-kjv\" data-code=\"H4500\">beam.</span>","20":"And there was yet a <span class=\"wl wl-kjv\" data-code=\"H4421\">battle</span> in <span class=\"wl wl-kjv\" data-code=\"H1661\">Gath,</span> where was a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of great <span class=\"wl wl-kjv\" data-code=\"H4067\">stature,</span> that had on every <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> <span class=\"wl wl-kjv\" data-code=\"H8337\">six</span> <span class=\"wl wl-kjv\" data-code=\"H676\">fingers,</span> and on every <span class=\"wl wl-kjv\" data-code=\"H7272\">foot</span> <span class=\"wl wl-kjv\" data-code=\"H8337\">six</span> <span class=\"wl wl-kjv\" data-code=\"H676\">toes,</span> <span class=\"wl wl-kjv\" data-code=\"H702\">four</span> and <span class=\"wl wl-kjv\" data-code=\"H6242\">twenty</span> in <span class=\"wl wl-kjv\" data-code=\"H4557\">number;</span> and he also was <span class=\"wl wl-kjv\" data-code=\"H3205\">born</span> to the <span class=\"wl wl-kjv\" data-code=\"H7497\">giant.</span>","21":"And when he <span class=\"wl wl-kjv\" data-code=\"H2778\">defied</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> <span class=\"wl wl-kjv\" data-code=\"H3083\">Jonathan</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H8092\">Shimea</span> the <span class=\"wl wl-kjv\" data-code=\"H251\">brother</span> of <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H5221\">slew</span> him.","22":"These <span class=\"wl wl-kjv\" data-code=\"H702\">four</span> were <span class=\"wl wl-kjv\" data-code=\"H3205\">born</span> to the <span class=\"wl wl-kjv\" data-code=\"H7497\">giant</span> in <span class=\"wl wl-kjv\" data-code=\"H1661\">Gath,</span> and <span class=\"wl wl-kjv\" data-code=\"H5307\">fell</span> by the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> and by the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of his <span class=\"wl wl-kjv\" data-code=\"H5650\">servants.</span>"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"zocht","tekst":"Om van God door urim en thummim de oorzaak van dezen duren tijd te weten, en alsdan behoorlijke middelen te gebruiken tot stilling van Gods toorn. Zie Num 27:21."},{"catchword":"gedood heeft","tekst":"Tegen de belofte, die hun met ede gedaan was, gelijk volgt. Zie Jos 9:15, Jos 9:18, enz.; om deze misdaad wordt het ganse land gestraft, dewijl het volk Sauls verkeerden ijver geprezen, of immers [gelijk het dan dikwijls gebeurt] niet had belet, noch daarover enige vergoeding aan de Gibeonieten tot dezen tijd toe gedaan was. Van deze daad Sauls heeft de Heilige Schrift tevoren niets vermeld."}],"2":[{"catchword":"overblijfsel der Amorieten;","tekst":"Dat is, overgebleven van de vorige heidense inwoners van het land Kanaän, die God bevolen had te verdelgen, en in het algemeen ook Amorieten genoemd worden. Anders waren zij Hevieten, Jos 9:7, en Jos 11:19."},{"catchword":"ijver","tekst":"Versta, een ongeregelden en geveinsden ijver, waardoor hij meende te verbeteren wat door Jozua en andere vrome regenten, naar zijn zin, verzuimd of kwalijk gedaan was. Maar het streed tegen den eed, die bij Gods naam, door zijn bijzondere voorzienigheid, gedaan was. Waarom ook God hierover nu vertoornd was, gelijk uit deze landplaag en Gods antwoord blijkt."}],"3":[{"catchword":"gij","tekst":"Hebreeuws, dat zij; te weten, uw landslieden."},{"catchword":"erfdeel des HEEREN zegent?","tekst":"Dat is, dat gij niet meer tot God klaagt, maar het volk Gods [gelijk 2Sa 20:19 ] deze straf helpt afbidden, en alles goeds weder toebidden."}],"4":[{"catchword":"Israël","tekst":"Uitgezonderd Sauls huis, gelijk volgt."},{"catchword":"hij zeide","tekst":"De koning."}],"5":[{"catchword":"De man die ons te niet gemaakt,","tekst":"Te weten, Saul; zo onwaardiglijk spreken zij van hem."},{"catchword":"gedacht heeft,","tekst":"Voorgehad, voorgenomen, gepraktiseerd heeft."}],"6":[{"catchword":"zonen gegeven worden,","tekst":"Dat is, van zijn nakomelingen, kinderen, of kindskinderen, enz. behorende tot het bloedhuis Sauls, vermeld vs.1."},{"catchword":"den HEERE ophangen","tekst":"Tot zijn eer, bij wiens naam de eed gedaan is van ons te verschonen; of om hem te bevredigen."},{"catchword":"o, gij verkorene des HEEREN","tekst":"Gelijk zij verachtelijk in vs.5 gesproken hebben van Saul, zo spreken zij hier ter contrarie David zeer eerbiediglijk aan. Anders, des verkorenen des Heeren, verstaande zulks van Saul; dien zij alzo zouden noemen om zijn misdaad aan hen begaan, tegen den eed Gods, te vergroten."}],"7":[{"catchword":"des HEEREN,","tekst":"Zie 1Sa 20:15-17."}],"8":[{"catchword":"Rizpa,","tekst":"Sauls bijwijf, boven, 2Sa 3:7, en onder, vs.11."},{"catchword":"zuster,","tekst":"Namelijk, Merab, die dezen Adriël tot een man gehad heeft, 1Sa 18:19. Alzo wordt het woord broeder van sommigen ingevoerd, onder, vs.19, en zoon, Jer 32:12. Sommigen verstaan hier door Michals zonen de zonen van haar zuster Merab, die Michal zou hebben opgevoed, en derhalve genoemd geweest haar moeder. Vergelijk Rth 4:17."},{"catchword":"Meholathiet,","tekst":"Hebreeuws, Mecholatiet. Uit Manasse aan de westzijde der Jordaan, waar Abel-Mehola lag. Zie Jdg 7:22, tot onderscheiding van Barzillai, den Gileadiet, Davids vriend, boven, 2Sa 19:31, enz."}],"9":[{"catchword":"berg","tekst":"Te Gibea Sauls, gelijk boven, vs.6, niet ver van Silo, Gibeon en Nobe, in welke plaatsen de tent der samenkomst geweest is. Zie boven, 2Sa 6:17."},{"catchword":"vielen tegelijk;","tekst":"Dat is, kwamen om."}],"10":[{"catchword":"zak,","tekst":"Dat is, een grof kleed, als een tent, om daaronder des nachts en des daags, uit moederlijke liefde bij de dode lichamen harer kinderen te blijven, die men anders gewoonlijk naar de wet, Deu 21:23, op denzelfden dag had moeten afnemen en begraven; maar het schijnt dat dezen hebben moeten hangen, totdat God door den regen betoonde met het land verzoend te zijn, dewijl God de duurte door droogte veroorzaakt had."},{"catchword":"spande dien","tekst":"Anders, spreidde"},{"catchword":"hen drupte van den hemel;","tekst":"De dode lichamen."},{"catchword":"op hen niet rusten des daags,","tekst":"Om de dode lichamen ongeschonden te houden ter begrafenis."}],"12":[{"catchword":"gestolen hadden","tekst":"Zie de historie 1Sa 31:10-13."},{"catchword":"Gilbóa","tekst":"Het gebergte van Gilboa."}],"13":[{"catchword":"beenderen van Saul,","tekst":"Nadat de lichamen verbrand waren, gelijk afgenomen wordt uit 1Sa 31:12. Zie aldaar."}],"14":[{"catchword":"Zela,","tekst":"Zie Jos 18:28."},{"catchword":"Kis,","tekst":"Zie 1Sa 9:1-2."},{"catchword":"den lande verbeden","tekst":"Dat is, den inwoners des lands, den Israëlieten, zodat Hij de plaag des hongers wegnam en weder regen gaf met vruchtbaarheid. Vergelijk onder, 2Sa 24:25."}],"15":[{"catchword":"hadden de Filistijnen","tekst":"Anders, hadden gehad; verstaande, dat deze krijgen tegen de Filistijnen hier wel tot een besluit van Davids victoriën worden verhaald, maar al tevoren zouden geschied zijn."}],"16":[{"catchword":"Rafa was,","tekst":"Anders, van den reus, die te Gath woonde, onder vs.22. Alzo in het volgende."},{"catchword":"spies","tekst":"Of, van het ijzer, scherp, of de spits zijner spies"},{"catchword":"gewicht kopers,","tekst":"Zie 1Sa 17:5."},{"catchword":"nieuw zwaard;","tekst":"Of, opnieuw; dat is, gewapend op een nieuwe wijze, tevoren in den krijg niet gebruikelijk."},{"catchword":"dacht David te slaan","tekst":"Hebreeuws, zeide; te weten, bij zichzelven, dat is, dacht; gelijk elders."}],"17":[{"catchword":"mannen van David,","tekst":"De officieren en krijgslieden van David zwoeren David."},{"catchword":"lamp van Israël","tekst":"Of, kaars, lantaarn; dat is, opdat gij, die Israël met raad en daad voorlicht, niet omkomt. Zie wijders van deze schone gelijkenis 1Ki 11:36."}],"18":[{"catchword":"Gob","tekst":"Gelegen bij Gezer, waar dit geschied is, 1Ch 20:4, in Efraïm, bij Benjamins grenzen, naar der Filistijnen land toe."},{"catchword":"Husathiet,","tekst":"Hebreeuws, Chuschatiet"},{"catchword":"Saf,","tekst":"Ook genoemd Sippai, 1Ch 20:4."}],"19":[{"catchword":"Elhanan,","tekst":"Hebreeuws, Elchanan"},{"catchword":"Jaäré-Oregim,","tekst":"Jaïr genoemd, 1Ch 20:5."},{"catchword":"met","tekst":"Anders, [broeder] van Goliath. Hetwelk sommigen hier invoegen uit 1Ch 20:5, waar hij genoemd wordt Lachmi; welke plaats de lezer met deze kan vergelijken."},{"catchword":"Goliath,","tekst":"Dien David verslagen had, 1Sa 17."}],"20":[{"catchword":"Gath;","tekst":"Een vermaarde stad der Filistijnen, gelegen aan de Middellandse zee."},{"catchword":"zeer lang man,","tekst":"Hebreeuws, een man van mate; dat is, bovenmate groot. Vergelijk Num 13:33."},{"catchword":"die zes vingeren had","tekst":"Hebreeuws, de vingers zijner handen en de vingers zijner voeten [waren] zes en zes, vier en twintig [in] getal."}],"21":[{"catchword":"hoonde Israël;","tekst":"Vergelijk 1Sa 17:10."},{"catchword":"Simea,","tekst":"Hebreeuws, Schima, ook genoemd Schamma, 1Sa 16:9."}],"22":[{"catchword":"vielen","tekst":"Gelijk Goliath ook tevoren van David was omgebracht, 1Sa 17, die hier ook is geweest hun hoofd en voorganger, waarom hem mede toegeschreven wordt hetgeen zijn knechten gedaan hebben. Anders, en; dat is, te weten."},{"catchword":"knechten","tekst":"Dat is, zijner officieren en helden."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"And there was a famine in the days of David, three years; and David sought the face of the LORD: [To know of God by Urim and Thummim the cause of this death, and then to use convenient means to pacify Gods wrath. See Num 27:21.] and the LORD said; it is for Sauls, and for (his) bloody house sake, because he slew the Gibeonites. [contrary to the promise made to them, and ratified by Oath, as followeth. See Jos.9.15, 18, etc. For this offence all the land is punished, because the people had commanded Sauls perverse zeal, or at least (as it often happeneth) had not hindred it, nor any satisfaction was hitherto made to the Gibeonites for the same. Of this fact of Saul the holy scripture hitherto is altogether silent.]"}],"2":[{"catchword":null,"tekst":"Then the King called the Gibeonites, and said unto them: (now the Gibeonites they were not of the children of Israel; but of the remnant of the Amorites, [i.e. remaining of the former heathenish inhabitants of the Land of Canaan, whom God had commanded to destroy, and are generally called Amorites. Otherwise they were Hivites, Jos.9.7. and 11.19.] and the children of Israel had sworn unto them, [see Jos.9.19.] but Saul sought to smite them in his zeal for the children of Israel and Juda). [understand an irregular and feigned zeal, whereby he thought to mend that which by Josua and other godly Governours (according to his opinion) was neglected, to ill done. But it was directly against the oath, made by Gods name, by his special providence. For which thing God was now greatly provoked, as by this plague upon the land, and Gods answer appeareth.]"}],"3":[{"catchword":null,"tekst":"Then David said unto the Gibeonites; what shall I do for you? and wherewith shall I make the atonement, that he [Heb. that they; to wit, your husband-men] may bless the inheritance of the LORD. [i.e. that ye may no more complain to God, but that ye may help to deprecate, or pray away this judgement from the people of God, (as chap.20.19.) and pray for all good to happen unto thee.]"}],"4":[{"catchword":null,"tekst":"Thenn said the Gibeonites unto him; we (require) not silver nor gold of Saul, nor of his house, neither (do) we (require) any man to be killed in Israel: [excepting. Sauls house, as followeth] And he [viz. the King] said; what do ye say then that I shall do for you."}],"5":[{"catchword":null,"tekst":"And they said unto the King; The man [i.e. Saul, so disdainfully they speak of him] that reduced us to nothing, and devised [intended, purposed, plotted, practised] against us, that we should be destroyed, without being able to subsist in any border of Israel;"}],"6":[{"catchword":null,"tekst":"Let seven men of his sons, [i.e. of his posterity, children, or children&acirc;&euro;&trade;s children, &c. pertaining to Sauls bloody house, mentioned ver.1.] be delivered to us, that we may hang them up unto the Lord [i.e. to his honour, by whose name the oath was made to spare us, or to pacify him] at Gibea of Saul, O thou chosen of the LORD: [as in tyhe former verse they spake contemptibly of Saul, so on the contrary in this verse they speak very reverently unto David. Oth. of the chosen of the LORD, understanding it of Saul whom they so called, to aggravate his offence committed on them against the oath of God] and the King said; I will deliver them."}],"7":[{"catchword":null,"tekst":"But the King spared Mephiboseth the son of Jonathan, the son of Saul, because of the LORDs oath that was between them, between David, and between Jonathan, the son of Saul. [see 1. Sam.18.3. and 26.15, 16, 17, 42. and 23.18.]"}],"8":[{"catchword":null,"tekst":"But the King took the two sons of Rispa [Sauls concubine: above ch.3.7. and below v.11.] the daughter of Aja, whom she had born unto Saul, Ammoni and Mephiboseth: besides the five sons of Michals (sister), [viz. Merah, who had been married to this Adriel here mentioned, 1 Sam.18.19. Thus the word brother is inserted below ver.19. and son, Jer 32:12. Some understand here by Michals sons, her sister Merabs sons, whom Michals bred up, and in that respect was called their mother. Compare Ruth 4.17.] Sauls daughter whom she had born unto Adriel the son of Barzillai the Meholathite. [Heb. Mecholathite; of Manasseh on the west-side of Jordan, where Abel-mohela lay. See Judg.7.on v.22. to distinguish him from Barzillai the Gileadite, David&acirc;&euro;&trade;s friend, above chap.19.31, &c.]"}],"9":[{"catchword":null,"tekst":"And he delivered them into the hands of the Gibeonites, who hanged them upon the hill [At Gibea of Saul, as above v.6. not far from Silo, Gibeon and Nob in which places the tent of the congregation was. See above chap.6.on v.17.] before the face of the LORD, and those seven fell [i.e. perished] all together: And they were put to death in the days of harvest, in the first (days), in the beginning of barley-harvest."}],"10":[{"catchword":null,"tekst":"Then Rispa the daughter of Aja, took a sack, [i.e. course cloth, like a rent, to abide under it both by night and by day, out of a motherly affection, by the dead bodies of the children, which otherwise by the Law, Deut.21.23. were usually taken down, and burned the same day. But it seemeth, that these were said to hang still, until God shewed by the rain, that he was appeased with the Land, forasmuch as God had occasioned the dearth or famine by immoderate drought] and stretched it out [oth. spread it] for her upon a rock, from the beginning of harvest, until there dropped water upon them [i.e. the dead bodies] from out of heaven; and she suffered not the fowls of heaven to rest upon them by day, nor the beast of the field by night. [preserve the dead bodies entire and unviolated for burial.]"}],"11":[{"catchword":null,"tekst":"And it was told David, what Rizpa, the brother of Aja, Sauls concubine had done."}],"12":[{"catchword":null,"tekst":"Then David went his ways, and took the bones of Saul, and the bones Jonathan, his son, from the Citizens Of Joabs in Gilead, who had stolen them from the tree of Beth-San, where the Philistines had hanged them, when the Philistines had slain Saul on Gilboa. [viz. Mount-Gilboa. See the story, 1 Samuel 31. 10, 11, 12, 13.]"}],"13":[{"catchword":null,"tekst":"And he brought up from thence, the bones of Saul, and the bones of Jonathan, his son; [After that their bones were burnt, as may be gathered from 1 Sam.31.12. see there] they also gathered the bones of them that were hanged."}],"14":[{"catchword":null,"tekst":"And they buried the bones of Saul and his son Jonathan in the Land of Benjamin at Zela, [See Jos.18.28.] in the Sepulchre of his Father Kis, [see 1 Sam.9.1, 2.] and did all that the King had commanded: Thus after this God was intreated for the Land. [i.e. the Israelites, the inhabitants of the Land, that he took away the judgement of famine, and gave rain again with fruitfulness. Compare below chap.24.25.]"}],"15":[{"catchword":null,"tekst":"Moreover, the Philistine had yet a war against Israel: [Oth. had had, etc. meaning that these wars against the Philistines are here onely related as a conclusion of David&acirc;&euro;&trade;s Victories, but were transacted long before] and David marched down, and his men with him, and fought against the Philistine, (so) that David waxed weary."}],"16":[{"catchword":null,"tekst":"And Isbi Benob, who was of the children of Rapha; [Oth. Of the Giant, that dwelt at Gath, below ver.22. so in the sequel] and thw weight of his spear, [or. of the iron sharp, or, the head of his spear] (was) three hundred weight of copper, [see 1 Sam.17.on verse 5.] and he was girded with a new [or, a new; i.e. armed in a new manner, or fashion, not used heretofore in War] (sword) This (man) thought [Heb. said, viz. by himself; i.e. thought; as elsewhere] to smite David."}],"17":[{"catchword":null,"tekst":"But Abisai, the son of Zeruja, succoured him, and smote the Philistine, and killed him: Then David&acirc;&euro;&trade;s men sware unto him, [i.e. David&acirc;&euro;&trade;s Officers and souldiers sware unto David] saying; Thou shalt no more march forth with us to battle, lest thou quench the Lamp of Israel. [or, candle, light, lanthorn of Israel; i.e. lest thou, who bearest the light before Israel, perish. See more of this excellent comparison, 1 King.11.on v.36.]"}],"18":[{"catchword":null,"tekst":"And it came to pass after that, that there was again a war at Gob, [Lying by Gezer, where this happened, 1 Chron 20 1. in Ephraim, by the borders of Benjamin, toward the Philistines Land] against the Philistines: Then Sibbechai, the Husathite, [Heb. the Cuschatite] smote Saph, [called also Sippai, 1 Chron.20.4.] who was of the children of Rapha."}],"19":[{"catchword":null,"tekst":"Moreover, there was yet a war at Gob, against the Philistines; and Elhanan [Heb. Elchanan] the son of Jaare Oregim, [called Jair, 1 Chron.20.5.] smote Beth-Halachmi, (who was) with Goliath [whom David slew, 1 Sam.17. Oth. (brother) of Goliath: which some insert here out of Chron.20.5. where he is called Lachmi: which place the Reader may compare with this] the Gethite, the wood of whose spear was, as a Weavers beam."}],"20":[{"catchword":null,"tekst":"There was also yet a war at Gath: [A known city of the Philistines, lying neer the mid-land sea] and there was a very tall man [Heb. a man of measure; i.e. great above, or, beyond measure. Compare Num 13:33.] that had six fingers on his hands, and six toes on hia feet, four and twenty in number, [Heb. the fingers of his hands, and the fingers of his feet (were) six and six, four and twenty (in) number] and this (man) was also born to Rapha."}],"21":[{"catchword":null,"tekst":"And he defied Israel, [Compare 1 Sam.17.10.] but Jonathan, the son of Simea, [Heb. Schima, called also Schamma, 1 Sam.16.9.] David&acirc;&euro;&trade;s brothers, smote him."}],"22":[{"catchword":null,"tekst":"These four were born to Rapha at Gath; and they fell by the hand of David, [As Goliath also was formerly slain by David, 1 Sam.17. who was also here their Head and Leader; wherefore that is likewise ascribed to him, which his servants did. Otherwise, and; i.e. to wit] and by the hand of his servants; [i.e. his Officers and Champions.]"}]}}};

function refUrl(ref) {

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');

}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;

document.addEventListener('click', e => {

    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
