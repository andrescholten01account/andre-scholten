"../../hebreeen/1/"}, {"naam": "Jakobus", "href": "../../jakobus/1/"}, {"naam": "1 Petrus", "href": "../../1-petrus/1/"}, {"naam": "2 Petrus", "href": "../../2-petrus/1/"}, {"naam": "1 Johannes", "href": "../../1-johannes/1/"}, {"naam": "2 Johannes", "href": "../../2-johannes/1/"}, {"naam": "3 Johannes", "href": "../../3-johannes/1/"}, {"naam": "Judas", "href": "../../judas/1/"}, {"naam": "Openbaring", "href": "../../openbaring/1/"}], "slugmap": {"Gen": "genesis", "Ex": "exodus", "Lev": "leviticus", "Num": "numeri", "Deut": "deuteronomium", "Joz": "jozua", "Richt": "richteren", "Ruth": "ruth", "1 Sam": "1-samuel", "2 Sam": "2-samuel", "1 Kon": "1-koningen", "2 Kon": "2-koningen", "1 Kron": "1-kronieken", "2 Kron": "2-kronieken", "Ezra": "ezra", "Neh": "nehemia", "Est": "esther", "Job": "job", "Ps": "psalmen", "Spr": "spreuken", "Pred": "prediker", "Hoogl": "hooglied", "Jes": "jesaja", "Jer": "jeremia", "Klaagl": "klaagliederen", "Ezech": "ezechiel", "Dan": "daniel", "Hos": "hosea", "Joël": "joel", "Amos": "amos", "Obadja": "obadja", "Jona": "jona", "Micha": "micha", "Nahum": "nahum", "Hab": "habakuk", "Zef": "zefanja", "Hagg": "haggai", "Zach": "zacharia", "Mal": "maleachi", "Matt": "mattheus", "Mark": "markus", "Luk": "lukas", "Joh": "johannes", "Hand": "handelingen", "Rom": "romeinen", "1 Kor": "1-korinthe", "2 Kor": "2-korinthe", "Gal": "galaten", "Ef": "efeze", "Fil": "filippenzen", "Kol": "kolossenzen", "1 Tess": "1-thessalonicenzen", "2 Tess": "2-thessalonicenzen", "1 Tim": "1-timotheus", "2 Tim": "2-timotheus", "Tit": "titus", "Filem": "filemon", "Hebr": "hebreeen", "Jak": "jakobus", "1 Petr": "1-petrus", "2 Petr": "2-petrus", "1 Joh": "1-johannes", "2 Joh": "2-johannes", "3 Joh": "3-johannes", "Judas": "judas", "Openb": "openbaring"}}, "vertalingen": {"SVnu": {"1": "En David monsterde het volk dat bij hem was, en hij stelde over hen leiders van duizend, en leiders van honderd aan.", "2": "Verder zond David het volk uit, een derde deel onder leiding van Joab, en een derde deel onder leiding van Abisai, de zoon van Zeruja, Joabs broer, en een derde deel onder leiding van Ithai, de Gethiet. En de koning zei tegen het volk: Ik zal ook zelf zeker met u meetrekken.", "3": "Maar het volk zei: U mag niet meetrekken; want als wij op de vlucht slaan, zullen zij zich niet om ons bekommeren; ja, al stierf de helft van ons, zij zullen zich niet om ons bekommeren; maar *u* *bent* nu als tienduizend van ons waard. Zo zal het nu beter zijn, dat u ons vanuit de stad te hulp komt.", "4": "Toen zei de koning tegen hen: Ik zal doen wat goed is in uw ogen. De koning nu ging bij de poort staan, en al het volk trok uit bij honderdtallen en bij duizendtallen.", "5": "En de koning gaf bevel aan Joab, en Abisai, en Ithai, en zei: Ga zachtzinnig om met de jongeman, met Absalom. En al het volk hoorde het, toen de koning aan alle leiders bevel gaf over de zaak van Absalom.", "6": "Zo trok het volk het veld in, Israël tegemoet, en de strijd vond plaats bij het woud van Efraïm.", "7": "En het volk van Israël werd daar door Davids knechten verslagen; en daar gebeurde die dag een grote slachting, van twintigduizend man.", "8": "Want de strijd verspreidde zich daar over dat hele land. En het woud verslond die dag meer van het volk dan het zwaard verslond.", "9": "Absalom nu kwam de knechten van David tegen; en Absalom reed op een muildier; en toen het muildier onder de dichte takken van een grote eik kwam, raakte zijn hoofd vast in de eik, zodat hij bleef hangen tussen hemel en aarde, en het muildier dat onder hem was, liep door.", "10": "Toen een man dat zag, vertelde hij het aan Joab, en zei: Zie, ik heb Absalom zien hangen aan een eik.", "11": "Toen zei Joab tegen de man die het hem vertelde: Zie toch, u hebt het gezien, waarom hebt u hem daar dan niet ter aarde geslagen? Dan had ik u tien zilverstukken en een gordel gegeven.", "12": "Maar die man zei tegen Joab: Al zou ik duizend zilverstukken op mijn handen krijgen, dan nog zou ik mijn hand niet slaan aan de zoon van de koning; want de koning heeft u, en Abisai, en Ithai, voor onze oren bevolen en gezegd: Pas op, wie u ook bent, voor de jongeman, voor Absalom.", "13": "Of had ik uit valsheid tegen mijn eigen leven gehandeld? Want geen ding blijft voor de koning verborgen; ook u zelf zou u er dan tegenover mij van afzijdig gehouden hebben.", "14": "Toen zei Joab: Ik zal hier zo niet langer bij u blijven wachten; en hij nam drie pijlen in zijn hand, en stak ze in het hart van Absalom, terwijl hij nog leefde, midden in de eik.", "15": "En tien jongemannen, wapendragers van Joab, omringden *hem*, en zij sloegen Absalom en doodden hem.", "16": "Toen blies Joab op de bazuin, en al het volk keerde terug van het achtervolgen van Israël, want Joab hield het volk tegen.", "17": "En zij namen Absalom en wierpen hem in het woud, in een grote kuil, en legden op hem een zeer grote steenhoop; en heel Israël vluchtte, ieder naar zijn tent.", "18": "Absalom nu had tijdens zijn leven voor zichzelf een gedenkzuil opgericht, die in het koningsdal staat; want hij zei: Ik heb geen zoon om aan mijn naam te doen denken; en hij had die zuil naar zijn eigen naam genoemd; daarom wordt die tot op deze dag Absaloms hand genoemd.", "19": "Toen zei Ahimaäz, de zoon van Zadok: Laat mij toch snel gaan, en de koning berichten dat de HEERE hem recht gedaan heeft tegenover zijn vijanden.", "20": "Maar Joab zei tegen hem: U zult vandaag geen boodschapper zijn, maar een andere dag zult u berichten; vandaag zult u niet berichten, omdat de zoon van de koning dood is.", "21": "En Joab zei tegen Cuschi: Ga heen, en vertel de koning wat u gezien hebt; en Cuschi boog zich voor Joab, en liep heen.", "22": "Doch Ahimaäz, de zoon van Zadok, hield vol en zei tegen Joab: Wat er ook gebeurt, laat mij toch ook achter Cuschi aan lopen. En Joab zei: Waarom zou u nu gaan lopen, mijn zoon, als u toch geen bericht hebt waarmee u iets bereikt?", "23": "Wat er ook gebeurt, zei hij, laat mij lopen; toen zei hij tegen hem: Loop dan. En Ahimaäz liep via de weg door de vlakte, en haalde Cuschi in.", "24": "David nu zat tussen de twee poorten; en de wachter ging op het dak van de poort bij de muur staan, en hief zijn ogen op, en zag, en zie, er liep een man alleen.", "25": "Toen riep de wachter, en meldde het de koning; en de koning zei: Als hij alleen is, dan is er een bericht in zijn mond; en hij liep maar door en kwam dichterbij.", "26": "Toen zag de wachter een andere man lopen, en de wachter riep naar de poortwachter en zei: Zie, er loopt *nog* een man alleen. Toen zei de koning: Dat is ook een boodschapper.", "27": "Verder zei de wachter: Ik zie de manier van lopen van de eerste, als de manier van lopen van Ahimaäz, de zoon van Zadok. Toen zei de koning: Dat is een goed man, en hij zal met een goed bericht komen.", "28": "Ahimaäz dan riep en zei tegen de koning: Vrede! En hij boog zich voor de koning met het gezicht ter aarde, en zei: Geloofd zij de HEERE, uw God, Die de mannen heeft overgegeven die hun hand tegen mijn heer de koning ophieven.", "29": "Toen zei de koning: Is het goed met de jongeman, met Absalom? En Ahimaäz zei: Ik zag een groot rumoer, toen Joab, de knecht van de koning, en *mij*, uw knecht, wegzond, maar ik weet niet wat het was.", "30": "En de koning zei: Ga opzij, blijf hier staan; zo ging hij opzij, en bleef staan.", "31": "En zie, Cuschi kwam aan; en Cuschi zei: Er is bericht voor mijn heer de koning, dat de HEERE u vandaag recht gedaan heeft tegenover allen die tegen u opstonden.", "32": "Toen zei de koning tegen Cuschi: Is het goed met de jongeman, met Absalom? En Cuschi zei: Laat het de vijanden van mijn heer de koning, en allen die tegen u opstaan om u kwaad te doen, vergaan als die jongeman.", "33": "Toen raakte de koning zeer ontroerd, en ging naar boven, naar de bovenzaal boven de poort, en huilde; en al gaande zei hij dit: Mijn zoon Absalom, mijn zoon, mijn zoon Absalom! Was ik maar, was ik maar in uw plaats gestorven, Absalom, mijn zoon, mijn zoon!"}, "SV": {"1": "En David monsterde het volk, dat met hem was; en hij stelde over hen oversten van duizenden, en oversten van honderden.", "2": "Voorts zond David het volk uit, een derde deel onder de hand van Joab, en een derde deel onder de hand van Abisai, den zoon van Zeruja, Joabs broeder, en een derde deel onder de hand van Ithai, den Gethiet. En de koning zeide tot het volk: Ik zal ook zelf zekerlijk met ulieden uittrekken.", "3": "Maar het volk zeide: Gij zult niet uittrekken; want of wij te enen male vloden, zij zullen het hart op ons niet stellen; ja, of de helft van ons stierf, zij zullen het hart op ons niet stellen; maar *gij* *zijt* nu als tien duizend onzer. Zo zal het nu beter zijn, dat gij ons uit de stad ter hulpe zijt.", "4": "Toen zeide de koning tot hen: Ik zal doen, wat goed is in uw ogen. De koning nu stond aan de zijde van de poort, en al het volk trok uit bij honderden en bij duizenden.", "5": "En de koning gebood Joab, en Abisai, en Ithai, zeggende: *Handelt* mij zachtkens met den jongeling, met Absalom. En al het volk hoorde het, als de koning aan al de oversten van Absaloms zaak gebood.", "6": "Alzo toog het volk uit in het veld, Israël tegemoet, en de strijd geschiedde bij Efraïms woud.", "7": "En het volk van Israël werd aldaar voor het aangezicht van Davids knechten geslagen; en aldaar geschiedde te dienzelven dage een grote slag, van twintig duizend.", "8": "Want de strijd werd aldaar verspreid over al dat land. En het woud verteerde meer van het volk, dan die het zwaard verteerde, te dienzelven dage.", "9": "Absalom nu ontmoette voor het aangezicht der knechten Davids; en Absalom reed op een muildier; en als het muildier kwam onder de dichte takken van een groten eik, zo werd zijn hoofd vast aan den eik, dat hij hangen bleef tussen den hemel en tussen de aarde, en het muildier, dat onder hem was, ging door.", "10": "Als dat een man zag, zo gaf hij het Joab te kennen, en zeide: Zie, ik heb Absalom zien hangen aan een eik.", "11": "Toen zeide Joab tot den man, die het hem te kennen gaf: Zie toch, gij hebt het gezien, waarom dan hebt gij hem niet aldaar ter aarde geslagen, alzo het aan mij *stond* om u tien zilverlingen en een gordel te geven?", "12": "Maar die man zeide tot Joab: En of ik al duizend zilverlingen op mijn handen mocht wegen, zo zou ik mijn hand aan des konings zoon niet slaan; want de koning heeft u, en Abisai, en Ithai, voor onze oren geboden, zeggende: Hoedt u, wie *gij* *zijt*, van den jongeling, van Absalom.", "13": "Of ik al valselijk tegen mijn ziel handelde, zo zou toch geen ding voor den koning verborgen worden; ook gij zelf zoudt er u van tegenover stellen.", "14": "Toen zeide Joab: Ik zal hier bij u alzo niet vertoeven; en hij nam drie pijlen, en stak ze in Absaloms hart, daar hij nog levend was in het midden van den eik.", "15": "En tien jongens, wapendragers van Joab, omringden *hem*, en zij sloegen Absalom, en doodden hem.", "16": "Toen blies Joab met de bazuin, en al het volk keerde af van Israël achterna te jagen, want Joab hield het volk terug.", "17": "En zij namen Absalom, en wierpen hem in het woud, in een groten kuil, en stelden op hem een zeer groten steenhoop; en gans Israël vluchtte, een iegelijk naar zijn tent.", "18": "Absalom nu had genomen, en in zijn leven voor zich opgericht een pilaar, die in het koningsdal is; want hij zeide: Ik heb geen zoon, om aan mijn naam te doen gedenken; en hij had dien pilaar genoemd naar zijn naam; daarom wordt hij tot op dezen dag genoemd: Absaloms hand.", "19": "Toen zeide Ahimaäz, Zadoks zoon: Laat mij toch heenlopen, en den koning boodschappen, dat de HEERE hem recht gedaan heeft van de hand zijner vijanden.", "20": "Maar Joab zeide tot hem: Gij zult dezen dag geen boodschapper zijn, maar op een anderen dag zult gij boodschappen; dezen dag nu zult gij niet boodschappen, daarom dat des konings zoon dood is.", "21": "En Joab zeide tot Cuschi: Ga heen, en zeg den koning aan, wat gij gezien hebt; en Cuschi boog zich voor Joab, en liep heen.", "22": "Doch Ahimaäz, Zadoks zoon, voer nog voort en zeide tot Joab: Wat het ook zij, laat mij toch ook Cuschi achterna lopen. En Joab zeide: Waarom zoudt gij nu heenlopen, mijn zoon! Zo gij toch geen bekwame boodschap hebt?", "23": "Wat het ook zij, *zeide* *hij*, laat mij heenlopen; zo zeide hij tot hem: Loop heen. En Ahimaäz liep den weg van het effen veld, en kwam Cuschi voorbij.", "24": "David nu zat tussen de twee poorten; en de wachter ging op het dak der poort aan den muur, en hief zijn ogen op, en zag, en ziet, er liep een man alleen.", "25": "Zo riep de wachter, en zeide het den koning aan; en de koning zeide: Indien hij alleen is, zo is er een boodschap in zijn mond; en hij ging al voort en naderde.", "26": "Toen zag de wachter een anderen man lopende, en de wachter riep tot den poortier en zeide: Zie, er loopt *nog* een man alleen. Toen zeide de koning: Die is ook een boodschapper.", "27": "Voorts zeide de wachter: Ik zie den loop des eersten aan, als den loop van Ahimaäz, Zadoks zoon. Toen zeide de koning: Dat is een goed man, en hij zal met een goede boodschap komen.", "28": "Ahimaäz dan riep en zeide tot den koning Vrede! En hij boog zich voor den koning met het aangezicht ter aarde, en hij zeide: Geloofd zij de HEERE, uw God, Die de mannen, dewelke hun hand tegen mijn heer den koning ophieven, heeft overgegeven.", "29": "Toen zeide de koning: Is het wel met den jongeling, met Absalom? En Ahimaäz zeide: Ik zag een groot rumoer, als Joab, den knecht des konings, en *mij* uw knecht afzond, maar ik weet niet wat.", "30": "En de koning zeide: Ga om, stel u hier; zo ging hij om, en bleef staan.", "31": "En ziet, Cuschi kwam aan; en Cuschi zeide: Mijn heer den koning wordt geboodschapt, dat u de HEERE heden heeft recht gedaan van de hand van al degenen, die tegen u opstonden.", "32": "Toen zeide de koning tot Cuschi: Is het wel met den jongeling, met Absalom? En Cuschi zeide: De vijanden van mijn heer den koning, en allen, die tegen u ten kwade opstaan, moeten worden als die jongeling.", "33": "Toen werd de koning zeer beroerd, en ging op naar de opperzaal der poort, en weende; en in zijn gaan zeide hij alzo: Mijn zoon Absalom, mijn zoon, mijn zoon Absalom! Och, dat ik, ik voor u gestorven ware, Absalom, mijn zoon, mijn zoon!"}, "KJV": {"1": "And David numbered the people that were with him, and set captains of thousands and captains of hundreds over them.", "2": "And David sent forth a third part of the people under the hand of Joab, and a third part under the hand of Abishai the son of Zeruiah, Joab's brother, and a third part under the hand of Ittai the Gittite. And the king said unto the people, I will surely go forth with you myself also.", "3": "But the people answered, Thou shalt not go forth: for if we flee away, they will not care for us; neither if half of us die, will they care for us: but now thou art worth ten thousand of us: therefore now it is better that thou succour us out of the city.", "4": "And the king said unto them, What seemeth you best I will do. And the king stood by the gate side, and all the people came out by hundreds and by thousands.", "5": "And the king commanded Joab and Abishai and Ittai, saying, Deal gently for my sake with the young man, even with Absalom. And all the people heard when the king gave all the captains charge concerning Absalom.", "6": "So the people went out into the field against Israel: and the battle was in the wood of Ephraim;", "7": "Where the people of Israel were slain before the servants of David, and there was there a great slaughter that day of twenty thousand men.", "8": "For the battle was there scattered over the face of all the country: and the wood devoured more people that day than the sword devoured.", "9": "And Absalom met the servants of David. And Absalom rode upon a mule, and the mule went under the thick boughs of a great oak, and his head caught hold of the oak, and he was taken up between the heaven and the earth; and the mule that was under him went away.", "10": "And a certain man saw it, and told Joab, and said, Behold, I saw Absalom hanged in an oak.", "11": "And Joab said unto the man that told him, And, behold, thou sawest him, and why didst thou not smite him there to the ground? and I would have given thee ten shekels of silver, and a girdle.", "12": "And the man said unto Joab, Though I should receive a thousand shekels of silver in mine hand, yet would I not put forth mine hand against the king's son: for in our hearing the king charged thee and Abishai and Ittai, saying, Beware that none touch the young man Absalom.", "13": "Otherwise I should have wrought falsehood against mine own life: for there is no matter hid from the king, and thou thyself wouldest have set thyself against me.", "14": "Then said Joab, I may not tarry thus with thee. And he took three darts in his hand, and thrust them through the heart of Absalom, while he was yet alive in the midst of the oak.", "15": "And ten young men that bare Joab's armour compassed about and smote Absalom, and slew him.", "16": "And Joab blew the trumpet, and the people returned from pursuing after Israel: for Joab held back the people.", "17": "And they took Absalom, and cast him into a great pit in the wood, and laid a very great heap of stones upon him: and all Israel fled every one to his tent.", "18": "Now Absalom in his lifetime had taken and reared up for himself a pillar, which is in the king's dale: for he said, I have no son to keep my name in remembrance: and he called the pillar after his own name: and it is called unto this day, Absalom's place.", "19": "Then said Ahimaaz the son of Zadok, Let me now run, and bear ➔ the king tidings, how that the LORD hath avenged him of his enemies.", "20": "And Joab said unto him, Thou shalt not bear tidings this day, but thou shalt bear tidings another day: but this day thou shalt bear no tidings, because the king's son is dead.", "21": "Then said Joab to Cushi, Go tell the king what thou hast seen. And Cushi bowed himself unto Joab, and ran.", "22": "Then said Ahimaaz the son of Zadok yet again to Joab, But howsoever, let me, I pray thee, also run after Cushi. And Joab said, Wherefore wilt thou run, my son, seeing that thou hast no tidings ready?", "23": "But howsoever, said he, let me run. And he said unto him, Run. Then Ahimaaz ran by the way of the plain, and overran Cushi.", "24": "And David sat between the two gates: and the watchman went up to the roof over the gate unto the wall, and lifted up his eyes, and looked, and behold a man running alone.", "25": "And the watchman cried, and told the king. And the king said, If he be alone, there is tidings in his mouth. And he came apace, and drew near.", "26": "And the watchman saw another man running: and the watchman called unto the porter, and said, Behold another man running alone. And the king said, He also bringeth tidings.", "27": "And the watchman said, Me thinketh the running of the foremost is like the running of Ahimaaz the son of Zadok. And the king said, He is a good man, and cometh with good tidings.", "28": "And Ahimaaz called, and said unto the king, All is well. And he fell down to the earth upon his face before the king, and said, Blessed be the LORD thy God, which hath delivered up the men that lifted up their hand against my lord the king.", "29": "And the king said, Is the young man Absalom safe? And Ahimaaz answered, When Joab sent the king's servant, and me thy servant, I saw a great tumult, but I knew not what it was.", "30": "And the king said unto him, Turn aside, and stand here. And he turned aside, and stood still.", "31": "And, behold, Cushi came; and Cushi said, Tidings, my lord the king: for the LORD hath avenged thee this day of all them that rose up against thee.", "32": "And the king said unto Cushi, Is the young man Absalom safe? And Cushi answered, The enemies of my lord the king, and all that rise against thee to do thee hurt, be as that young man is.", "33": "And the king was much moved, and went up to the chamber over the gate, and wept: and as he went, thus he said, O my son Absalom, my son, my son Absalom! would God I had died for thee, O Absalom, my son, my son!"}}, "tsk": {"1": [{"kopje": "monsterde", "refs": ["Ex 17:9", "Joz 8:10"]}, {"kopje": "leiders van duizend", "refs": ["1 Sam 8:12"]}], "2": [{"kopje": "een derde deel", "refs": ["Richt 7:16", "Richt 7:19", "Richt 9:43"]}, {"kopje": "leiding van Joab", "refs": ["2 Sam 10:7-10"]}, {"kopje": "Ithai", "refs": ["2 Sam 15:19-22"]}, {"kopje": "Ik zal ook zelf zeker", "refs": ["2 Sam 17:11", "Ps 3:7", "Ps 27:1-3", "Ps 118:6-8"]}], "3": [{"kopje": "U mag niet", "refs": ["2 Sam 21:17"]}, {"kopje": "als wij op de vlucht slaan", "refs": ["2 Sam 17:2", "1 Kon 22:31", "Zach 13:7"]}, {"kopje": "waard", "refs": ["Klaagl 4:20"]}, {"kopje": "te hulp komt", "refs": ["2 Sam 10:11", "Ex 17:10-12"]}], "4": [{"kopje": "bij de poort", "refs": ["2 Sam 18:24", "Jes 28:6"]}, {"kopje": "bij honderdtallen", "refs": ["2 Sam 18:1", "1 Sam 29:2"]}], "5": [{"kopje": "Ga zachtzinnig om", "refs": ["2 Sam 16:11", "2 Sam 17:1-4", "2 Sam 17:14", "Deut 21:18-21", "Ps 103:13", "Luk 23:34"]}, {"kopje": "al het volk", "refs": ["2 Sam 18:12"]}], "6": [{"kopje": "woud van Efraïm", "refs": ["Joz 17:15", "Joz 17:18", "Richt 12:4-6"]}], "7": [{"kopje": "het volk", "refs": ["2 Sam 2:17", "2 Sam 15:6", "2 Sam 19:41-43"]}, {"kopje": "een grote", "refs": ["Spr 11:21", "Spr 24:21"]}, {"kopje": "twintigduizend man", "refs": ["2 Sam 2:26", "2 Sam 2:31", "2 Kron 13:16", "2 Kron 13:17", "2 Kron 28:6"]}], "9": [{"kopje": "zijn hoofd", "refs": ["2 Sam 18:14", "2 Sam 14:26", "2 Sam 17:23", "Matt 27:5"]}, {"kopje": "bleef hangen", "refs": ["Deut 21:23", "Deut 27:16", "Deut 27:20", "Job 18:8-10", "Job 31:3", "Ps 63:10", "Ps 63:11", "Spr 20:20", "Spr 30:17", "Jer 48:44", "Mark 7:10", "Gal 3:13"]}], "12": [{"kopje": "voor onze oren", "refs": ["2 Sam 18:5"]}], "13": [{"kopje": "gehandeld", "refs": ["2 Sam 1:15", ing zei: Wat wilt u?", "1 Kon 10:15": "behalve wat er binnenkwam van de kramers, en van de handel van de kruideniers, en van alle koningen van Arabië, en van de bestuurders van dat land.", "Luk 18:8": "Ik zeg u dat Hij hun snel recht zal doen. Maar de Zoon des mensen, zal Hij, als Hij komt, geloof vinden op de aarde?", "Gen 18:2": "En hij hief zijn ogen op en keek; en zie, daar stonden drie mannen tegenover hem; toen hij hen zag, liep hij hun tegemoet vanuit de deur van de tent, en boog zich tot op de grond.", "1 Sam 18:17": "Daarom zei Saul tegen David: Zie, mijn oudste dochter Merab zal ik u tot vrouw geven; alleen, wees mij een dapper man en voer de oorlogen van de HEERE. Want Saul zei: Laat mijn hand niet tegen hem zijn, maar laat de hand van de Filistijnen tegen hem zijn.", "Jes 28:6": "en tot een Geest van het oordeel voor hem die te oordelen zit, en tot een sterkte voor hen die de strijd terugdrijven tot aan de poort toe.", "1 Sam 24:8": "En David hield zijn mannen met woorden tegen, en liet hun niet toe dat zij opstonden tegen Saul. En Saul maakte zich op uit de spelonk, en ging op de weg.", "1 Kron 11:31": "Ithai, de zoon van Ribai, uit Gibea van de kinderen van Benjamin; Benaja, de Pirhathoniet;", "2 Sam 23:16": "Toen braken die drie helden door het leger van de Filistijnen, en putten water uit Bethlehems bornput, die in de poort is, en droegen het, en kwamen bij David; maar hij wilde dat niet drinken, maar goot het uit voor de HEERE.", "1 Sam 29:2": "En de vorsten van de Filistijnen trokken daarheen met honderden en met duizenden; maar David met zijn mannen trokken met Achis in de achterhoede.", "Ps 144:2": "Mijn Goedertierenheid en mijn Burg, mijn Hoog Vertrek en mijn Bevrijder voor mij, mijn Schild, en op Wie ik vertrouw; Die mijn volk aan mij onderwerpt!", "2 Sam 15:23": "En heel het land weende met luide stem, terwijl heel het volk overging; ook ging de koning over de beek Kidron, en heel het volk ging over, recht in de richting van de weg naar de woestijn.", "2 Sam 14:27": "Ook werden aan Absalom drie zonen geboren, en één dochter, wier naam Tamar was; deze was een vrouw, mooi van uiterlijk.", "2 Sam 14:20": "Om de zaak zo een andere gestalte te geven, dat heeft uw dienaar Joab gedaan; maar mijn heer is wijs, met de wijsheid van een Engel van God, om alles te doorzien wat op de aarde is.", "Gen 11:4": "En zij zeiden: Kom aan, laten we voor onszelf een stad bouwen, en een toren, waarvan de top tot in de hemel reikt, en laten we voor onszelf een naam maken, opdat wij niet misschien over de hele aarde verstrooid worden!", "2 Sam 18:21-32": "En Joab zei tegen Cuschi: Ga heen, en vertel de koning wat u gezien hebt; en Cuschi boog zich voor Joab, en liep heen. Doch Ahimaäz, de zoon van Zadok, hield vol en zei tegen Joab: Wat er ook gebeurt, laat mij toch ook achter Cuschi aan lopen. En Joab zei: Waarom zou u nu gaan lopen, mijn zoon, als u toch geen bericht hebt waarmee u iets bereikt? Wat er ook gebeurt, zei hij, laat mij lopen; toen zei hij tegen hem: Loop dan. En Ahimaäz liep via de weg door de vlakte, en haalde Cuschi in.", "Job 18:17": "Zijn gedachtenis zal vergaan van de aarde, en hij zal geen naam hebben op de straten.", "2 Sam 13:38": "Zo vluchtte Absalom, en ging naar Gesur; en hij was daar drie jaar.", "Job 41:20": "De werpstenen worden door hem geacht als stoppels, en hij belacht het zwaaien van de lans.", "Jes 52:8": "Er is een stem van uw wachters; zij verheffen de stem, zij juichen samen; want zij zullen oog in oog zien, wanneer de HEERE Sion terugbrengen zal.", "2 Sam 18:24-27": "David nu zat tussen de twee poorten; en de wachter ging op het dak van de poort bij de muur staan, en hief zijn ogen op, en zag, en zie, er liep een man alleen. Toen riep de wachter, en meldde het de koning; en de koning zei: Als hij alleen is, dan is er een bericht in zijn mond; en hij liep maar door en kwam dichterbij. Toen zag de wachter een andere man lopen, en de wachter riep naar de poortwachter en zei: Zie, er loopt nog een man alleen. Toen zei de koning: Dat is ook een boodschapper.", "Gal 3:13": "Christus heeft ons verlost van de vloek van de wet, doordat Hij voor ons een vloek geworden is; want er is geschreven: Vervloekt is ieder die aan het hout hangt.", "2 Sam 14:1": "Joab, de zoon van Zeruja, merkte dat het hart van de koning naar Absalom uitging.", "Ezech 6:13": "Dan zult u weten dat Ik de HEERE ben, als hun gesneuvelden in het midden van hun drekgoden rondom hun altaren zullen liggen op alle hoge heuvels, op alle toppen van de bergen, en onder elke groene boom, en onder elke dichte eik, de plaats waar zij aan al hun drekgoden een liefelijke reuk brachten.", "Gen 33:3": "En hij ging voor hen uit heen, en boog zich zeven keer ter aarde, totdat hij bij zijn broer kwam.", "Ps 124:6": "Geloofd zij de HEERE, Die ons niet heeft overgegeven als een prooi in hun tanden.", "2 Sam 19:1-8": "En Joab werd verteld: Zie, de koning huilt en bedrijft rouw over Absalom. Toen werd de overwinning op diezelfde dag voor het hele volk tot rouw; want het volk had diezelfde dag horen zeggen: Het smart de koning over zijn zoon. En het volk kwam diezelfde dag stiekem de stad binnen, zoals het volk zich wegsteelt, dat beschaamd is wanneer zij in de strijd gevlucht zijn.", "2 Kon 4:13": "(Want hij had hem gezegd: Zeg toch tegen haar: Zie, u bent zo bezorgd voor ons geweest, met al deze zorg; wat kan er voor u gedaan worden? Moet er voor u gesproken worden tot de koning, of tot de legeraanvoerder? En zij had gezegd: Ik woon te midden van mijn volk.", "Spr 25:25": "Een goede tijding uit een ver land is als koud water op een vermoeide ziel.", "1 Sam 13:17": "En de verwoesters trokken uit het leger van de Filistijnen, in drie groepen; de ene groep sloeg de weg in naar Ofra, naar het land Sual;", "2 Sam 2:31": "Maar Davids knechten hadden van Benjamin en onder Abners mannen verslagen: driehonderdzestig man waren er dood gebleven.", "2 Sam 13:39": "Toen verlangde de ziel van koning David er zeer naar om naar Absalom uit te gaan; want hij had zich getroost over Amnon, omdat die dood was.", "2 Sam 15:1-13": "Het gebeurde daarna dat Absalom voor zichzelf wagens en paarden liet klaarmaken, en vijftig mannen die voor hem uit renden. Ook stond Absalom 's morgens vroeg op, en ging staan aan de kant van de weg naar de poort. En het gebeurde dat Absalom iedere man die een geschil had en naar de koning wilde komen voor een rechtszaak, tot zich riep en zei: Uit welke stad bent u? Als hij dan zei: Uw knecht is uit een van de stammen van Israël, dan zei Absalom tegen hem: Zie, uw zaken zijn goed en juist; maar u hebt niemand die u namens de koning aanhoort.", "Ps 49:12": "Hun diepste gedachte is dat hun huizen er voor eeuwig zullen zijn, hun woningen van geslacht tot geslacht; zij noemen de landen naar hun namen.", "Gen 11:9": "Daarom noemde men haar naam Babel; want daar verwarde de HEERE de taal van de hele aarde, en vandaar verstrooide de HEERE hen over de hele aarde.", "Spr 10:7": "De gedachtenis aan de rechtvaardige zal tot zegening zijn; maar de naam van de goddelozen zal wegrotten.", "1 Sam 18:11": "En Saul wierp de speer, en zei: Ik zal David aan de wand spietsen; maar David week tweemaal voor hem opzij.", "1 Kron 6:53": "Zadok zijn zoon; Ahimaäz zijn zoon.", "Rom 12:19": "Wreek uzelf niet, geliefden, maar geef de toorn plaats; want er is geschreven: Mij komt de wraak toe; Ik zal het vergelden, zegt de Heere.", "Job 41:17": "Raakt iemand hem met het zwaard, dat zal niet standhouden, speer, pijl, noch pantser.", "2 Sam 17:17-20": "Jonathan nu en Ahimaäz stonden bij de bron Rogel; en een dienstmeisje ging heen en vertelde het hun; en zij gingen heen en vertelden het aan koning David; want zij mochten zich niet laten zien door in de stad te komen. Een jongen zag hen echter, en vertelde het aan Absalom; doch die beiden gingen haastig weg, en kwamen in het huis van een man te Bahurim, die een put had in zijn binnenplaats, en zij daalden daarin af. En de vrouw nam en spreidde een deksel over de opening van de put, en strooide daar gepelde granen overheen. Zo werd de zaak niet bekend.", "2 Sam 15:6": "En op die manier deed Absalom met heel Israël, die tot de koning kwamen voor een rechtszaak. Zo stal Absalom het hart van de mannen van Israël.", "2 Sam 22:49": "En Die mij uitvoert van mijn vijanden; en U verhoogt mij boven degenen die tegen mij opstaan; U redt mij van de man van het geweld.", "1 Sam 23:7": "Toen aan Saul te kennen gegeven werd dat David in Kehila gekomen was, zei Saul: God heeft hem in mijn hand overgegeven, want hij zit vast, nu hij in een stad met poorten en grendels is gekomen.", "1 Sam 24:19": "En u hebt mij heden laten zien dat u mij goed gedaan hebt; want de HEERE had mij in uw hand overgeleverd, en u hebt mij niet gedood.", "Ps 27:1-3": "Een psalm van David. De HEERE is mijn Licht en mijn Heil, voor wie zou ik vrezen? De HEERE is de kracht van mijn leven, voor wie zou ik bang zijn? Toen de bozen, mijn tegenpartijen en mijn vijanden, tegen mij naar mij toe kwamen om mijn vlees te eten, stieten zij zelf aan en vielen. Ofschoon een leger mij belegerde, mijn hart zou niet vrezen; ofschoon een oorlog tegen mij opstond, toch vertrouw ik hierop.", "2 Sam 20:22": "En de vrouw kwam bij al het volk, met haar wijsheid; en zij hieuwen Seba, de zoon van Bichri, het hoofd af, en wierpen het naar Joab. Toen blies hij op de bazuin, en zij verstrooiden zich van de stad, ieder naar zijn tenten; en Joab keerde terug naar Jeruzalem tot de koning.", "2 Sam 3:36": "Toen al het volk dit merkte, was het goed in hun ogen; alles wat de koning gedaan had, was goed in de ogen van heel het volk.", "2 Kon 9:18-20": "En de ruiter te paard ging hem tegemoet, en zei: Zo zegt de koning: Is het vrede? En Jehu zei: Wat hebt u met de vrede te maken? Kom achter mij. En de wachter meldde het, en zei: De bode is bij hen gekomen, maar hij komt niet terug. Toen stuurde hij een tweede ruiter te paard; en toen deze bij hen gekomen was, zei hij: Zo zegt de koning: Is het vrede? En Jehu zei: Wat hebt u met de vrede te maken? Kom achter mij. En de wachter meldde dit, en zei: Hij is tot bij hen gekomen, maar hij komt niet terug; en het rijden is als het rijden van Jehu, de zoon van Nimsi, want hij rijdt onzinnig.", "Rom 1:28": "En zoals het hun niet goeddacht God te erkennen, zo heeft God hen overgegeven aan een verkeerd denken, om dingen te doen die niet betamen;", "2 Sam 15:36": "Zie, hun beide zonen zijn daar bij hen, Ahimaäz, de zoon van Zadok, en Jonathan, de zoon van Abjathar; zo zult u door hun hand alles wat u zult horen, naar mij laten overbrengen.", "2 Sam 14:26": "En als hij zijn hoofd liet scheren (dit gebeurde aan het einde van elk jaar, dat hij het liet scheren, omdat het hem te zwaar werd, daarom liet hij het scheren), dan woog het haar van zijn hoofd tweehonderd sikkel, naar het gewicht van de koning.", "Richt 7:19": "Zo kwam Gideon, en honderd mannen die met hem waren, aan het uiterste van het leger, aan het begin van de middelste nachtwaak, net toen zij de wachters gesteld hadden; en zij bliezen op de bazuinen, en sloegen de kruiken die in hun hand waren stuk.", "Jak 5:17": "Elia was een mens net zo onderhevig aan gevoelens als wij; en hij bad een gebed, dat het niet zou regenen; en het regende niet op de aarde, drie jaar en zes maanden lang.", "Ezech 33:2-7": "Mensenkind! Spreek tot de kinderen van uw volk, en zeg tegen hen: Wanneer Ik het zwaard over een land breng, en het volk van het land een man uit hun gebied neemt en hem voor zichzelf tot een wachter stelt; En hij het zwaard over het land ziet komen, en op de bazuin blaast en het volk waarschuwt; En iemand het geluid van de bazuin hoort, wel hoort, maar zich niet laat waarschuwen, en het zwaard komt en neemt hem weg, dan is zijn bloed op zijn eigen hoofd.", "Ex 17:13": "Zo versloeg Jozua Amalek en zijn volk, met de scherpte van het zwaard.", "1 Kor 14:8": "Want ook als de bazuin een onzeker geluid geeft, wie zal zich dan voorbereiden op de strijd?", "1 Kon 20:21": "En de koning van Israël trok uit, en sloeg paarden en wagens, zodat hij een grote slag aan de Syriërs toebracht.", "1 Kon 15:2": "Hij regeerde drie jaren te Jeruzalem; en de naam van zijn moeder was Maächa, een dochter van Abisalom.", "Gen 41:43": "En hij liet hem rijden op de tweede wagen die hij had; en zij riepen voor hem uit: Kniel! Zo stelde hij hem over heel Egypteland.", "2 Sam 13:29": "En Absaloms knechten deden met Amnon zoals Absalom geboden had. Toen stonden alle zonen van de koning op, en reden ieder op zijn muildier, en vluchtten.", "1 Tess 5:3": "Want wanneer zij zullen zeggen: Het is vrede en veilig; dan zal een plotseling verderf hun overkomen, zoals de barensweeën een zwangere vrouw overkomen; en zij zullen het geenszins ontvluchten;", "2 Sam 1:15": "En David riep een van de jongens, en zei: Kom dichterbij, val hem aan. En hij sloeg hem, zodat hij stierf.", "Jes 21:6-9": "Want zo heeft de Heere tegen mij gezegd: Ga heen, zet een wachter uit, laat hij aanzeggen wat hij ziet. En hij zag een wagen, een span ruiters, een wagen met ezels, een wagen met kamelen; en hij lette zeer nauwkeurig op, met grote oplettendheid. En hij riep: Een leeuw, Heere! Ik sta voortdurend op de wachttoren, overdag, en op mijn post sta ik hele nachten.", "Deut 32:36": "Want de HEERE zal Zijn volk recht doen, en het zal Hem berouwen over Zijn knechten; want Hij zal zien, dat de hand is weggegaan, en er niemand meer over is, gebonden of vrij.", "Est 8:3": "En Esther sprak verder voor de koning, en zij viel voor zijn voeten, en zij weende, en zij smeekte hem, dat hij de boosheid van Haman, de Agagiet, en zijn plan, dat hij tegen de Joden bedacht had, zou wegnemen.", "Dan 4:30": "Sprak de koning, en zei: Is dit niet het grote Babel, dat ik gebouwd heb tot een huis van het koninkrijk, door de sterkte van mijn macht, en tot eer van mijn heerlijkheid!", "Joh 20:4": "En deze twee liepen tegelijk; en de andere discipel liep vooruit, sneller dan Petrus, en kwam eerst bij het graf.", "Ps 94:1-4": "O God van de wraken! O HEERE, God van de wraken! Verschijn blinkend! Gij, Rechter der aarde! Verhef U; breng vergelding weer over de hoogmoedigen. Hoe lang zullen de goddelozen, o HEERE! hoe lang zullen de goddelozen van vreugde opspringen?", "1 Kron 11:6": "Want David zei: Al wie de Jebusieten het eerst verslaat, zal tot hoofd en leider worden. Toen klom Joab, de zoon van Zeruja, er als eerste op; daarom werd hij tot hoofd.", "2 Sam 19:1-6": "En Joab werd verteld: Zie, de koning huilt en bedrijft rouw over Absalom. Toen werd de overwinning op diezelfde dag voor het hele volk tot rouw; want het volk had diezelfde dag horen zeggen: Het smart de koning over zijn zoon. En het volk kwam diezelfde dag stiekem de stad binnen, zoals het volk zich wegsteelt, dat beschaamd is wanneer zij in de strijd gevlucht zijn.", "Ps 68:3": "U zult hen verdrijven, zoals rook verdreven wordt; zoals was voor het vuur smelt, zullen de goddelozen vergaan van Gods aangezicht.", "2 Kron 11:20": "En na haar nam hij Maächa, de dochter van Absalom; deze baarde hem Abia, en Attai, en Ziza, en Selomith.", "2 Sam 1:2": "dat het op de derde dag gebeurde dat er, kijk, uit het leger van Saul een man kwam, wiens kleren gescheurd waren, en aarde was op zijn hoofd; en het gebeurde, toen hij bij David kwam, dat hij ter aarde viel en zich neerboog.", "2 Kon 9:17-20": "De wachter nu stond op de toren te Jizreël, en zag de troep van Jehu, toen hij aankwam, en zei: Ik zie een troep. Toen zei Joram: Neem een ruiter, en stuur die hun tegemoet, en laat hij zeggen: Is het vrede? En de ruiter te paard ging hem tegemoet, en zei: Zo zegt de koning: Is het vrede? En Jehu zei: Wat hebt u met de vrede te maken? Kom achter mij. En de wachter meldde het, en zei: De bode is bij hen gekomen, maar hij komt niet terug. Toen stuurde hij een tweede ruiter te paard; en toen deze bij hen gekomen was, zei hij: Zo zegt de koning: Is het vrede? En Jehu zei: Wat hebt u met de vrede te maken? Kom achter mij.", "1 Kron 12:38": "Al deze krijgslieden, die zich in slagorde konden houden, kwamen met een volkomen hart naar Hebron om David koning te maken over heel Israël. En ook heel de rest van Israël was één van hart om David tot koning te maken.", "Hand 20:8": "En er waren veel lampen in de bovenzaal waar zij bijeen waren.", "2 Sam 17:14": "Toen zeiden Absalom en alle mannen van Israël: De raad van Husai, de Archiet, is beter dan de raad van Achitofel. Doch de HEERE had het zo bepaald, om de goede raad van Achitofel te vernietigen, opdat de HEERE het kwaad over Absalom zou brengen.", "Ps 7:9": "De HEERE zal de volken recht doen; doe mij recht, HEERE, naar mijn gerechtigheid, en naar mijn oprechtheid, die bij mij is.", "1 Kron 6:8": "En Ahitub verwekte Zadok, en Zadok verwekte Ahimaäz;", "Ps 63:11": "Men zal hen neervellen door het geweld van het zwaard; zij zullen het deel van de vossen worden.", "Ps 68:2": "God zal opstaan, Zijn vijanden zullen verstrooid worden, en Zij die Hem haten zullen van Zijn aangezicht vluchten.", "1 Kron 6:9": "En Ahimaäz verwekte Azarja, en Azarja verwekte Johanan;", "Mark 5:22": "En zie, er kwam een van de leiders van de synagoge, van wie de naam Jaïrus was; en toen hij Hem zag, viel hij aan Zijn voeten,", "1 Sam 18:4": "En Jonathan deed zijn mantel af, die hij aan had, en gaf hem aan David, ook zijn kleren, ja, zelfs zijn zwaard, en zijn boog, en zijn gordel.", "Gen 43:30": "En Jozef haastte zich; want zijn hart werd bewogen om zijn broer, en hij zocht een plek om te wenen; en hij ging een kamer in, en weende daar.", "2 Sam 19:23": "En de koning zei tegen Simeï: U zult niet sterven. En de koning zwoer het hem.", "Jes 62:6": "O Jeruzalem! Ik heb wachters op uw muren aangesteld, die voortdurend, de hele dag en de hele nacht, niet zullen zwijgen. U die de HEERE doet gedenken, laat geen stilzwijgen bij u zijn!", "Gen 43:26": "Toen Jozef nu thuisgekomen was, brachten zij hem het geschenk, dat in hun hand was, in het huis, en zij bogen zich voor hem ter aarde.", "Ps 103:13": "Zoals een vader zich ontfermt over zijn kinderen, ontfermt de HEERE Zich over hen die Hem vrezen.", "2 Kron 13:17": "Abia dan, en zijn volk, sloeg hen met een grote slag; want uit Israël vielen er vijfhonderdduizend gesneuvelde, uitgelezen mannen.", "2 Sam 19:4": "De koning nu had zijn gezicht bedekt, en de koning riep met luide stem: Mijn zoon Absalom, Absalom, mijn zoon, mijn zoon!", "2 Sam 16:11": "Verder zei David tegen Abisai en tegen al zijn knechten: Zie, mijn zoon, die uit mijn lijf is voortgekomen, zoekt mijn leven; hoeveel te meer dan nu deze zoon van Jemini? Laat hem begaan, laat hij vloeken, want de HEERE heeft het hem gezegd.", "2 Sam 17:2": "Zo zal ik hem overvallen terwijl hij moe en slap van handen is, en zal hem schrik aanjagen; en al het volk dat bij hem is zal vluchten; dan zal ik de koning alleen doden.", "Ps 9:17": "De HEERE is bekend geworden; Hij heeft recht gedaan; de goddeloze is verstrikt in het werk van zijn handen! Higgajon, Sela.", "Jer 48:44": "Wie voor de angst vlucht, zal in de kuil vallen, en wie uit de kuil opklimt, zal in de strik gevangen worden; want Ik zal over haar, over Moab, het jaar van hun bezoeking brengen, spreekt de HEERE.", "Matt 12:40": "Want zoals Jona drie dagen en drie nachten in de buik van de walvis was, zo zal de Zoon des mensen drie dagen en drie nachten in het hart van de aarde zijn.", "1 Sam 13:18": "en een groep sloeg de weg in naar Beth-horon; en een groep sloeg de weg in naar het gebied dat uitziet op het dal Zeboim, naar de woestijn toe.", "2 Sam 17:11": "Maar ik raad aan dat heel Israël in alle haast bij u wordt verzameld, van Dan tot Berseba toe, talrijk als het zand dat aan de zee is; en dat u zelf mee optrekt in de strijd.", "Neh 4:20": "Op de plaats waar u het geluid van de bazuin zult horen, daarheen moet u zich naar ons toe verzamelen; onze God zal voor ons strijden.", "Hand 1:13": "En toen zij binnengekomen waren, gingen zij naar boven, naar de bovenzaal, waar zij bleven, namelijk Petrus en Jakobus, en Johannes en Andreas, Filippus en Thomas, Bartholomeüs en Mattheüs, Jakobus, de zoon van Alfeüs, en Simon Zelotes, en Judas, de broer van Jakobus.", "Spr 10:1": "De spreuken van Salomo. Een wijze zoon verblijdt de vader; maar een dwaze zoon is het verdriet van zijn moeder.", "1 Kon 22:31": "De koning van Syrië nu had zijn tweeëndertig aanvoerders van de wagens geboden en gezegd: U zult niet vechten tegen klein of groot, maar alleen tegen de koning van Israël.", "2 Kron 20:26": "En op de vierde dag kwamen zij bijeen in het dal van Beracha, want daar loofden zij de HEERE; daarom noemden zij de naam van die plaats het dal van Beracha, tot op deze dag.", "Ps 10:18": "Om de wees en verdrukte recht te doen, opdat een mens van de aarde niet meer voortvaart geweld te bedrijven.", "Ps 10:14": "U ziet het zeker; want U aanschouwt de moeite en het verdriet, opdat men het in Uw hand geeft; op U verlaat de arme zich, U bent geweest een Helper van de wees.", "Ps 144:1": "Een psalm van David. Geprezen zij de HEERE, mijn Rotssteen, Die mijn handen leert voor de strijd, mijn vingers voor de oorlog;", "2 Sam 21:17": "Maar Abisai, de zoon van Zeruja, hielp hem, en sloeg de Filistijn, en doodde hem. Toen zwoeren de mannen van David hem, en zeiden: U zult niet meer met ons uittrekken ten strijde, zodat u de lamp van Israël niet uitblust.", "2 Kron 28:6": "Want Pekah, de zoon van Remalia, doodde in Juda honderdtwintigduizend man op één dag, allen strijdbare mannen, omdat zij de HEERE, de God van hun vaderen, verlaten hadden.", "Richt 7:16": "En hij deelde de driehonderd man in drie groepen; en hij gaf ieder een bazuin in zijn hand, en lege kruiken, en fakkels in het midden van de kruiken.", "Hand 1:18": "Deze nu heeft een akker verworven van het loon van de ongerechtigheid, en voorover vallend is hij middenin opengebarsten, en al zijn ingewanden zijn eruit gestort.", "2 Sam 18:6-17": "Zo trok het volk het veld in, Israël tegemoet, en de strijd vond plaats bij het woud van Efraïm. En het volk van Israël werd daar door Davids knechten verslagen; en daar gebeurde die dag een grote slachting, van twintigduizend man. Want de strijd verspreidde zich daar over dat hele land. En het woud verslond die dag meer van het volk dan het zwaard verslond.", "Joz 17:15": "Jozua nu zei tegen hen: Omdat u een groot volk bent, ga dan op naar het woud, en houw daar voor u af in het land van de Ferezieten en de Refaïeten, omdat het gebergte van Efraïm voor u te eng is.", "2 Sam 18:19-33": "Toen zei Ahimaäz, de zoon van Zadok: Laat mij toch snel gaan, en de koning berichten dat de HEERE hem recht gedaan heeft tegenover zijn vijanden. Maar Joab zei tegen hem: U zult vandaag geen boodschapper zijn, maar een andere dag zult u berichten; vandaag zult u niet berichten, omdat de zoon van de koning dood is. En Joab zei tegen Cuschi: Ga heen, en vertel de koning wat u gezien hebt; en Cuschi boog zich voor Joab, en liep heen.", "2 Sam 17:1-4": "Verder zei Achitofel tegen Absalom: Laat mij nu twaalfduizend man uitkiezen, dan sta ik op en jaag David deze nacht achterna. Zo zal ik hem overvallen terwijl hij moe en slap van handen is, en zal hem schrik aanjagen; en al het volk dat bij hem is zal vluchten; dan zal ik de koning alleen doden. En ik zal al het volk naar u laten terugkeren; de man die u zoekt, is gelijk aan het terugkeren van allen; zo zal al het volk in vrede zijn.", "Jes 21:12": "De wachter zei: De morgenstond is gekomen, en het is nog nacht; als u wilt vragen, vraag; keer terug, kom.", "2 Sam 4:10-12": "Toen hij die mij het bericht bracht en zei: Zie, Saul is dood – terwijl hij zelf dacht dat hij goed nieuws bracht – heb ik hem gegrepen en te Ziklag gedood, hoewel hij meende dat ik hem daarvoor loon zou geven; Hoeveel te meer, wanneer goddeloze mannen een rechtvaardig man in zijn eigen huis op zijn bed hebben gedood? Zou ik dan nu zijn bloed niet van uw handen eisen, en u van de aarde wegdoen? En David gaf zijn knechten bevel, en zij doodden hen, en hakten hun handen en hun voeten af, en hingen ze op bij de vijver te Hebron; maar het hoofd van Isboseth namen zij en begroeven het in Abners graf te Hebron.", "Joz 17:18": "Maar het gebergte zal het uwe zijn; en omdat het een woud is, houw het af, dan zullen de uitgangen ervan de uwe zijn; want u zult de Kanaänieten verdrijven, al hebben zij ijzeren wagens, al zijn zij sterk.", "2 Sam 17:25": "En Absalom had Amasa in de plaats van Joab aangesteld over het leger. Amasa nu was de zoon van een man wiens naam Jethra was, de Israëliet, die bij Abigaïl was ingegaan, de dochter van Nahas, zuster van Zeruja, de moeder van Joab.", "2 Sam 15:4": "Verder zei Absalom: Och, dat men mij tot rechter stelde in het land! Dat iedere man die een geschil of rechtszaak heeft, tot mij zou komen, opdat ik hem recht zou doen.", "2 Sam 14:4": "En de vrouw uit Thekoa sprak tot de koning, terwijl zij op haar gezicht ter aarde was gevallen, en zich neergebogen had, en zij zei: Help, o koning!", "Jes 52:7": "Hoe lieflijk zijn op de bergen de voeten van hem die het goede nieuws brengt, die de vrede laat horen; van hem die goed nieuws brengt van het goede, die heil laat horen; van hem die tegen Sion zegt: Uw God is Koning.", "Jes 21:6": "Want zo heeft de Heere tegen mij gezegd: Ga heen, zet een wachter uit, laat hij aanzeggen wat hij ziet.", "1 Sam 8:12": "en hij zal hen voor zich aanstellen als leiders over duizend, en als leiders over vijftigtallen; en hij zal hen zijn akker laten ploegen, en zijn oogst laten oogsten, en zijn oorlogswapens laten maken, alsook zijn wagentuig.", "Num 1:3": "Van twintig jaar oud en daarboven, allen die in Israël uittrekken ten leger; die zult u tellen naar hun legers, u en Aäron.", "Gen 14:20": "En gezegend zij de allerhoogste God, Die uw vijanden in uw hand overgeleverd heeft! En hij gaf hem het tiende deel van alles.", "2 Sam 17:17": "Jonathan nu en Ahimaäz stonden bij de bron Rogel; en een dienstmeisje ging heen en vertelde het hun; en zij gingen heen en vertelden het aan koning David; want zij mochten zich niet laten zien door in de stad te komen.", "Dan 4:19": "Toen schrok Daniël, wiens naam Beltsazar is, ongeveer een uur lang, en zijn gedachten verontrustten hem. De koning antwoordde en zei: Beltsazar, laat de droom en zijn uitleg u niet verontrusten. Beltsazar antwoordde en zei: Mijn heer! De droom moge uw haters wedervaren, en zijn uitleg uw tegenstanders!", "2 Sam 15:30": "En David ging op door de opgang van de olijven, terwijl hij opging en weende, en zijn hoofd was bedekt; en hij zelf ging blootsvoets; ook had heel het volk dat bij hem was, ieder zijn hoofd bedekt, en zij gingen op, terwijl zij opgingen en weenden.", "Hand 9:37": "En het gebeurde in die dagen dat zij ziek werd en stierf; en toen zij haar gewassen hadden, legden zij haar in de bovenzaal.", "2 Sam 15:19-22": "Toen zei de koning tegen Ithai, de Gethiet: Waarom zou u ook met ons meegaan? Keer terug, en blijf bij de koning; want u bent een vreemdeling, en bovendien bent u verbannen uit uw eigen plaats. Gisteren bent u gekomen, en zou ik u vandaag met ons laten meetrekken, terwijl ik zelf ga waarheen ik maar kan gaan? Keer terug, en breng uw broeders mee terug; goedertierenheid en trouw zij met u. Maar Ithai antwoordde de koning en zei: Zo waarachtig als de HEERE leeft, en mijn heer de koning leeft, op de plaats waar mijn heer de koning zal zijn, hetzij ten dode, hetzij ten leven, daar zal uw knecht voorzeker ook zijn!", "Joz 10:10": "En de HEERE bracht hen in verwarring voor het aangezicht van Israël; en hij sloeg hen met een grote slag te Gibeon, en vervolgde hen op de weg waar men naar Beth-horon opgaat, en sloeg hen tot Azeka en tot Makkeda toe.", "2 Sam 2:17": "En er was op diezelfde dag een heel zware strijd. Doch Abner en de mannen van Israël werden voor de ogen van de knechten van David verslagen.", "Deut 32:35": "Aan Mij is de wraak en de vergelding, op de tijd dat hun voet zal wankelen; want de dag van hun ondergang is nabij, en de dingen die hun zullen gebeuren, haasten zich.", "Mark 7:10": "Want Mozes heeft gezegd: Eer uw vader en uw moeder; en: Wie vader of moeder vervloekt, die zal zeker sterven.", "Jer 22:19": "Met een ezelsbegrafenis zal hij begraven worden; men zal hem slepen en wegwerpen, ver weg van de poorten van Jeruzalem.", "Gen 49:8": "Juda! U bent het, u zullen uw broers loven; uw hand zal zijn op de nek van uw vijanden; voor u zullen de zonen van uw vader zich neerbuigen.", "Jer 22:18": "Daarom zegt de HEERE zo van Jojakim, zoon van Josia, koning van Juda: Zij zullen hem niet beklagen: Och, mijn broeder! of, och, zuster! Zij zullen hem niet beklagen: Och, heer! of, och, zijn majesteit!", "Ps 45:6": "Uw pijlen zijn scherp; volken zullen onder U vallen; zij treffen in het hart van de vijanden van de Koning.", "2 Sam 17:16-21": "Nu dan, stuur haastig iemand, en laat David weten: Overnacht deze nacht niet bij de vlakke velden van de woestijn, en ga ook snel over; anders wordt de koning verslonden, en al het volk dat bij hem is. Jonathan nu en Ahimaäz stonden bij de bron Rogel; en een dienstmeisje ging heen en vertelde het hun; en zij gingen heen en vertelden het aan koning David; want zij mochten zich niet laten zien door in de stad te komen. Een jongen zag hen echter, en vertelde het aan Absalom; doch die beiden gingen haastig weg, en kwamen in het huis van een man te Bahurim, die een put had in zijn binnenplaats, en zij daalden daarin af.", "2 Kron 8:5": "Ook bouwde hij het hoge Beth-Horon en het lage Beth-Horon, vaste steden met muren, deuren en grendels;", "Ps 9:5": "Want Gij hebt mijn recht en mijn rechtszaak afgedaan; Gij hebt gezeten op de troon, o Rechter der gerechtigheid.", "Gen 14:17": "En de koning van Sodom trok uit, hem tegemoet (nadat hij teruggekeerd was van het verslaan van Kedor-laomer en de koningen die met hem waren), naar het dal Schave, dat is het dal van de koning.", "Joz 7:26": "En zij richtten over hem een grote steenhoop op, die er tot op deze dag nog is. Zo keerde de HEERE zich af van de gloed van Zijn toorn. Daarom noemde men de naam van die plaats het dal van Achor, tot op deze dag toe.", "2 Sam 3:37": "En al het volk en heel Israël merkten op die dag dat het niet van de koning was gekomen dat Abner, de zoon van Ner, gedood was.", "Klaagl 4:20": "Resch. De adem van onze neus, de gezalfde van de HEERE, is gevangen in hun kuilen; van wie wij zeiden: Wij zullen onder zijn schaduw leven onder de heidenen!", "2 Sam 19:1-4": "En Joab werd verteld: Zie, de koning huilt en bedrijft rouw over Absalom. Toen werd de overwinning op diezelfde dag voor het hele volk tot rouw; want het volk had diezelfde dag horen zeggen: Het smart de koning over zijn zoon. En het volk kwam diezelfde dag stiekem de stad binnen, zoals het volk zich wegsteelt, dat beschaamd is wanneer zij in de strijd gevlucht zijn.", "Spr 25:13": "Een trouwe gezant is voor hen die hem zenden, als de koelte van sneeuw op de dag van de oogst; want hij verkwikt de ziel van zijn heer.", "Ps 3:7": "Ik zal niet bang zijn voor tienduizenden van het volk, die zich rondom tegen mij opstellen.", "Gen 37:10": "En toen hij het aan zijn vader en aan zijn broers vertelde, bestrafte zijn vader hem en zei tegen hem: Wat is dit voor een droom die u gedroomd hebt? Zullen wij dan werkelijk komen, ik, en uw moeder, en uw broers, om ons voor u ter aarde te buigen?", "Ps 118:6-8": "De HEERE is bij mij, ik zal niet vrezen; wat zal een mens mij doen? De HEERE is bij mij onder degenen die mij helpen; daarom zal ik mijn lust zien aan degenen die mij haten. Het is beter tot de HEERE toevlucht te nemen, dan op de mens te vertrouwen.", "1 Sam 4:13": "En toen hij aankwam, zie, daar zat Eli op een stoel bij de kant van de weg, uit te kijken; want zijn hart beefde vanwege de ark van God. Toen de man de stad binnenkwam om het te vertellen, schreeuwde de hele stad het uit.", "Spr 30:17": "Het oog dat de vader bespot, of de gehoorzaamheid aan de moeder veracht, dat zullen de raven van de beek uitpikken, en de jongen van de arend zullen het eten.", "2 Kon 4:10": "Laten we toch een kleine bovenkamer aan een muur maken, en daar voor hem neerzetten een bed, en tafel, en stoel, en kandelaar; dan zal het gebeuren, wanneer hij bij ons komt, dat hij daar inwijkt.", "Job 18:8-10": "Want met zijn voeten zal hij in het net geworpen worden, en hij zal wandelen over het wargaren. De strik zal hem bij de hielen vatten; de struikrover zal hem overweldigen. Zijn touw is in de aarde verborgen, en zijn val op het pad.", "Zach 13:7": "Zwaard! Word wakker tegen Mijn Herder, en tegen de Man Die Mijn Metgezel is, spreekt de HEERE van de heerscharen; sla die Herder, en de schapen zullen verstrooid worden; maar Ik zal Mijn hand tot de kleinen wenden.", "2 Sam 2:26": "Toen riep Abner naar Joab en zei: Zal het zwaard dan eeuwig verslinden? Weet u niet, dat het uiteindelijk bitterheid zal zijn? En hoe lang zal het duren voordat u het volk zegt dat zij terugkeren van hun broeders te vervolgen?", "Job 1:17": "Terwijl deze nog sprak, kwam er een ander en zei: De Chaldeeën stelden drie groepen op, en vielen de kamelen aan, en namen ze mee, en sloegen de knechten met de scherpte van het zwaard; en ik ben maar alleen ontkomen om het u te vertellen.", "1 Sam 17:25": "En de mannen van Israël zeiden: Hebt u die man wel gezien, die is opgekomen? Want hij is opgekomen om Israël te honen; en het zal gebeuren dat de koning de man die hem verslaat, met grote rijkdom zal verrijken, en hij zal hem zijn dochter geven, en hij zal het huis van zijn vader vrijmaken in Israël.", "Joz 6:26": "En terzelfder tijd bezwoer Jozua hen, en zei: Vervloekt zij die man voor het aangezicht van de HEERE, die zich opmaakt en deze stad Jericho bouwen zal; dat hij haar grondvest op zijn eerstgeboren zoon, en haar poorten stelt op zijn jongste zoon!", "1 Sam 26:8": "Toen zei Abisai tegen David: God heeft vandaag uw vijand in uw hand gegeven; laat mij hem toch nu met de speer in één keer aan de grond spijkeren, en ik zal het hem geen tweede keer hoeven te doen.", "2 Sam 22:48": "De God, Die mij volkomen wraak geeft, en de volken onder mij neerwerpt;", "2 Sam 20:1": "Toen was daar bij toeval een man van Belial, wiens naam was Seba, een zoon van Bichri, een man van Jemini; die blies op de bazuin, en zei: Wij hebben geen deel aan David, en wij hebben geen erfenis aan de zoon van Isaï, ieder naar zijn tenten, o Israël!", "2 Kon 1:2": "En Ahazia viel door een traliewerk in zijn bovenzaal, die te Samaria was, en werd ziek. En hij zond boden en zei tegen hen: Ga heen, vraag Baäl-Zebub, de god van Ekron, of ik van deze ziekte genezen zal worden.", "2 Sam 23:15": "En David kreeg lust en zei: Wie zal mij water te drinken geven uit Bethlehems bornput, die in de poort is?", "Joz 15:16": "En Kaleb zei: Wie Kirjath-sefer zal verslaan en innemen, aan hem zal ik mijn dochter Achsa tot vrouw geven.", "2 Sam 22:27": "Bij de reine houdt U Zich rein; maar bij de verkeerde houdt U Zich verdraaid.", "Gen 27:29": "Volken zullen u dienen, en volken zullen zich voor u neerbuigen; wees heer over uw broers, en de zonen van uw moeder zullen zich voor u neerbuigen! Vervloekt moet hij zijn, wie u vervloekt; en wie u zegent, zij gezegend!", "Gen 23:7": "Toen stond Abraham op, en boog zich neer voor het volk van het land, voor de zonen van Heth;", "1 Kon 1:42": "Terwijl hij nog sprak, zie, kwam Jonathan, de zoon van Abjathar, de priester; en Adonia zei: Kom binnen, want u bent een dapper man, en zult goed nieuws brengen.", "2 Sam 10:11": "En hij zei: Als de Syriërs mij te sterk zullen zijn, zult u mij komen verlossen; en als de kinderen Ammons u te sterk zullen zijn, zal ik komen om u te verlossen.", "Ps 109:13": "Laat zijn nakomelingen uitgeroeid worden; hun naam moet uitgedelgd worden in het volgende geslacht.", "Joz 1:16-18": "Toen antwoordden zij Jozua: Alles wat u ons geboden hebt, zullen wij doen, en overal waar u ons zenden zult, zullen wij gaan. Zoals wij in alles naar Mozes geluisterd hebben, zo zullen wij naar u luisteren; alleen dat de HEERE, uw God, met u is, zoals Hij met Mozes geweest is! Elke man die uw mond opstandig zal zijn, en uw woorden niet horen zal in alles wat u hem gebieden zult, die zal gedood worden; wees alleen sterk en heb goede moed!", "Joz 8:10": "En Jozua maakte zich 's morgens vroeg op, en hij monsterde het volk; en hij trok op, hij en de oudsten van Israël, voor het volk uit, naar Ai.", "Hand 1:19": "En het is bekend geworden bij allen die in Jeruzalem wonen, zodat die akker in hun eigen taal Akeldama genoemd wordt, dat is: een akker van het bloed.", "Richt 9:43": "Toen nam hij het volk, en verdeelde hen in drie groepen, en legde een hinderlaag in het veld; en hij zag toe, en zie, het volk trok de stad uit, en hij kwam tegen hen op en sloeg hen.", "Jes 21:11": "De last van Duma. Men roept tot mij uit Seïr: Wachter! wat is er van de nacht? Wachter! wat is er van de nacht?", "Num 1:2": "Neem het aantal op van de gehele vergadering van de kinderen van Israël, naar hun geslachten, naar het huis van hun vaderen, in het getal van de namen, van al wat mannelijk is, hoofd voor hoofd.", "1 Kon 10:27": "En de koning maakte dat het zilver in Jeruzalem zo gewoon was als stenen, en de ceders maakte hij zo gewoon als de wilde vijgenbomen die in de laagte staan, in grote hoeveelheid.", "2 Sam 18:9-17": "Absalom nu kwam de knechten van David tegen; en Absalom reed op een muildier; en toen het muildier onder de dichte takken van een grote eik kwam, raakte zijn hoofd vast in de eik, zodat hij bleef hangen tussen hemel en aarde, en het muildier dat onder hem was, liep door. Toen een man dat zag, vertelde hij het aan Joab, en zei: Zie, ik heb Absalom zien hangen aan een eik. Toen zei Joab tegen de man die het hem vertelde: Zie toch, u hebt het gezien, waarom hebt u hem daar dan niet ter aarde geslagen? Dan had ik u tien zilverstukken en een gordel gegeven.", "Deut 21:23": "Dan zal zijn dode lichaam niet aan het hout overnachten; maar u zult hem beslist diezelfde dag begraven; want een opgehangene is door God vervloekt. Zo zult u uw land niet verontreinigen, dat de HEERE, uw God, u als erfdeel geeft.", "Jes 21:9": "En zie nu, daar komt een wagen mannen, met een span ruiters! Toen antwoordde hij en zei: Babel is gevallen, zij is gevallen! En al de gesneden beelden van haar goden heeft Hij tegen de grond verbrijzeld.", "Joz 8:29": "En de koning van Ai hing hij aan een paal, tot de avond; en omtrent het ondergaan van de zon gebood Jozua dat men zijn dode lichaam van de paal zou afnemen; en zij wierpen het bij de ingang van de stadspoort, en richtten daarop een grote steenhoop op, die er is tot op deze dag.", "Hebr 4:13": "En er is geen schepsel onzichtbaar voor Hem; maar alle dingen zijn naakt en geopend voor de ogen van Hem, met Wie wij te maken hebben.", "Num 10:2-10": "Maak u twee zilveren trompetten; van dicht werk zult u ze maken; en zij zullen u zijn tot de heilige samenkomst en tot het optrekken van de legers. Als zij daarmee blazen zullen, dan zal de hele vergadering tot u verzameld worden, aan de deur van de tent der samenkomst. Maar als zij met de ene zullen blazen, dan zullen tot u verzameld worden de leiders, de hoofden van de duizenden van Israël.", "2 Sam 13:36": "En het gebeurde, toen hij was uitgesproken, zie, dat de zonen van de koning kwamen, en hun stemmen verhieven en huilden; en de koning ook, en al zijn knechten, huilden zeer luid.", "2 Sam 14:19": "En de koning zei: Is de hand van Joab hierin met u? En de vrouw antwoordde en zei: Zo waarachtig als uw ziel leeft, mijn heer koning, niemand zou naar rechts of naar links kunnen afwijken van alles wat mijn heer de koning gesproken heeft; want uw dienaar Joab, hij heeft het mij opgedragen, en hij heeft al deze woorden in de mond van uw dienares gelegd;", "Deut 21:18-21": "Wanneer iemand een koppige en opstandige zoon heeft, die niet luistert naar de stem van zijn vader en de stem van zijn moeder; en zij hem gestraft hebben, en hij toch niet naar hen wil horen, Dan zullen zijn vader en zijn moeder hem grijpen, en hem brengen naar de oudsten van zijn stad, en naar de poort van zijn plaats. En zij zullen tegen de oudsten van zijn stad zeggen: Deze zoon van ons is koppig en opstandig, hij wil niet naar ons luisteren; hij is een brasser en een dronkaard.", "Richt 4:21": "Daarna nam Jaël, de vrouw van Heber, een tentpin, en greep een hamer in haar hand, en ging stilletjes naar hem toe, en dreef de pin in zijn slaap, zodat hij in de aarde vastzat; want hij was in diepe slaap en uitgeput, en stierf.", "2 Sam 12:10-23": "Nu dan, het zwaard zal niet van uw huis wijken tot in eeuwigheid, omdat u Mij veracht hebt, en de vrouw van Uria, de Hethiet, genomen hebt, zodat zij uw vrouw is geworden. Zo zegt de HEERE: Zie, Ik zal kwaad over u verwekken uit uw eigen huis, en Ik zal uw vrouwen nemen voor uw ogen, en zal ze aan uw naaste geven; die zal bij uw vrouwen liggen, voor de ogen van deze zon. Want u hebt het in het verborgene gedaan, maar Ik zal deze zaak doen voor heel Israël, en voor de zon.", "Matt 2:11": "En toen zij in het huis gekomen waren, vonden zij het Kindje met Maria, Zijn moeder, en zij vielen neer en aanbaden Het; en na hun schatten geopend te hebben, brachten zij Hem geschenken: goud, wierook en mirre.", "2 Kron 13:16": "En de kinderen van Israël vluchtten voor Juda; en God gaf hen in hun hand.", "Ef 5:4": "ook geen oneerbaarheid, geen zot geklap of grappenmakerij, wat niet betaamt; maar veelmeer dankzegging.", "1 Sam 18:10": "En het gebeurde de volgende dag, dat de boze geest van God vaardig werd over Saul, en hij profeteerde midden in het huis, en David speelde snarenspel met zijn hand, zoals van dag tot dag; Saul nu had een speer in zijn hand.", "2 Sam 2:28": "Toen blies Joab op de bazuin; en heel het volk stond stil, en zij jaagden Israël niet meer achterna, en gingen niet verder door met strijden.", "Joz 10:27": "En het gebeurde, ten tijde dat de zon onderging, dat Jozua beval dat men hen van de bomen afnam, en zij wierpen hen in de grot, waar zij verborgen geweest waren; en zij legden grote stenen voor de opening van de grot, die daar zijn tot op deze zelfde dag.", "1 Kon 20:15": "Toen telde hij de jongens van de leiders van de landschappen, en zij waren tweehonderdtwee en dertig; en na hen telde hij al het volk, alle kinderen van Israël, zevenduizend.", "Gen 24:27": "en hij zei: Geloofd zij de HEERE, de God van mijn heer Abraham, Die Zijn weldadigheid en trouw niet onthouden heeft aan mijn heer; wat mij betreft, de HEERE heeft mij op deze weg geleid, naar het huis van de broers van mijn heer.", "Openb 19:1-3": "En hierna hoorde ik als een grote stem van een grote menigte in de hemel, die zei: Halleluja, de zaligheid, en de heerlijkheid, en de eer, en de kracht zij de Heere, onze God. Want Zijn oordelen zijn waarachtig en rechtvaardig; omdat Hij de grote hoer geoordeeld heeft, die de aarde verdorven heeft met haar hoererij, en Hij het bloed van Zijn dienaren van haar hand gewroken heeft. En zij zeiden ten tweeden maal: Halleluja! En haar rook gaat op in alle eeuwigheid.", "Gen 19:2": "En hij zei: Zie toch, mijn heren! Keert u toch af naar het huis van uw knecht, en overnacht daar, en wast uw voeten; dan kunt u vroeg opstaan en verder gaan op uw weg. En zij zeiden: Nee, maar wij zullen op straat overnachten.", "2 Sam 24:1-9": "En de toorn van de HEERE ging verder tegen Israël ontsteken; en Hij porde David tegen hen aan en zei: Ga, tel Israël en Juda. De koning zei toen tegen Joab, de legeraanvoerder die bij hem was: Trek nu rond door alle stammen van Israël, van Dan tot Ber-seba toe, en tel het volk, zodat ik het getal van het volk weet. Toen zei Joab tegen de koning: Laat de HEERE, uw God, aan dit volk, hoeveel het er ook mogen zijn, honderdmaal meer toevoegen, zodat de ogen van mijn heer de koning het mogen aanzien; maar waarom heeft mijn heer de koning zin in deze zaak?", "Richt 11:33": "En hij versloeg hen van Aroer af tot waar u komt bij Minnith, twintig steden, en tot aan Abel-Keramim, met een zeer grote slag. Zo werden de kinderen van Ammon onderworpen voor het aangezicht van de kinderen van Israël.", "2 Kon 9:20": "En de wachter meldde dit, en zei: Hij is tot bij hen gekomen, maar hij komt niet terug; en het rijden is als het rijden van Jehu, de zoon van Nimsi, want hij rijdt onzinnig.", "Spr 24:21": "Mijn zoon! vrees de HEERE en de koning; vermeng u niet met hen, die naar verandering staan;", "Deut 3:5": "Al die steden waren met hoge muren, poorten en grendels versterkt, behalve heel veel onbemuurde steden.", "Rom 10:15": "En hoe zullen zij prediken, als zij niet gezonden worden? Zoals geschreven is: Hoe lieflijk zijn de voeten van hen die vrede verkondigen, van hen die het goede verkondigen!", "Spr 20:20": "Wie zijn vader of zijn moeder vervloekt, diens lamp zal uitgeblust worden in zwarte duisternis.", "Ps 31:9": "En mij niet hebt overgeleverd in de hand van de vijand; U hebt mijn voeten doen staan in de ruimte.", "Num 25:7": "Toen Pinehas, de zoon van Eleazar, de zoon van Aäron, de priester, dat zag, stond hij op uit het midden van de vergadering, en nam een spies in zijn hand;", "Ps 7:7": "Sta op, HEERE, in Uw toorn, verhef U om de woede van hen die mij benauwen, en ontwaak tot mij; U hebt het oordeel bevolen.", "2 Sam 3:32": "Toen zij Abner te Hebron begroeven, verhief de koning zijn stem, en huilde bij Abners graf; ook al het volk huilde.", "Spr 17:25": "Een dwaze zoon is een verdriet voor zijn vader, en bittere droefheid voor haar die hem gebaard heeft.", "2 Sam 1:16": "En David zei tegen hem: Uw bloed komt op uw hoofd; want uw mond heeft tegen u getuigd, toen u zei: ik heb de gezalfde van de HEERE gedood.", "Jes 21:7": "En hij zag een wagen, een span ruiters, een wagen met ezels, een wagen met kamelen; en hij lette zeer nauwkeurig op, met grote oplettendheid.", "1 Sam 11:11": "Het gebeurde nu de volgende dag, dat Saul het volk in drie groepen indeelde, en zij kwamen midden in het leger, tijdens de morgenwake, en zij versloegen Ammon, totdat de dag heet werd; en het gebeurde dat de overgeblevenen zo verstrooid werden, dat er onder hen geen twee samen bleven.", "2 Sam 19:41-43": "En zie, alle mannen van Israël kwamen naar de koning; en zij zeiden tegen de koning: Waarom hebben onze broeders, de mannen van Juda, u gestolen, en hebben zij de koning en zijn huis over de Jordaan gebracht, en alle mannen van David met hem? Toen antwoordden alle mannen van Juda de mannen van Israël: Omdat de koning ons nauw verwant is; en waarom zijn jullie nu boos over deze zaak? Hebben wij dan ook maar iets gegeten op kosten van de koning, of heeft hij ons een geschenk gegeven? En de mannen van Israël antwoordden de mannen van Juda, en zeiden: Wij hebben tien delen aan de koning, en ook aan David hebben wij, meer dan jullie, recht; waarom hebben jullie ons dan geringschat, zodat ons woord niet het eerste geweest is bij het terughalen van onze koning? Maar het woord van de mannen van Juda was harder dan het woord van de mannen van Israël.", "Ps 7:10": "Laat toch de slechtheid van de goddelozen een einde nemen, maar bevestig de rechtvaardige, U, Die harten en nieren doorziet, o rechtvaardige God!", "2 Sam 12:18-23": "En het gebeurde op de zevende dag, dat het kind stierf; en Davids knechten waren bang het hem te vertellen, dat het kind dood was, want zij zeiden: Zie, toen het kind nog leefde, spraken wij tegen hem, maar hij luisterde niet naar onze stem; hoe zullen wij dan tegen hem zeggen: Het kind is dood? Hij zou zichzelf iets kunnen aandoen. Maar David zag dat zijn knechten fluisterden; zo begreep David dat het kind dood was. Toen zei David tegen zijn knechten: Is het kind dood? En zij zeiden: Het is dood. Toen stond David op van de aarde, en waste zich, en zalfde zich, en trok andere kleren aan, en ging naar het huis van de HEERE, en aanbad Hem; daarna kwam hij in zijn eigen huis, en vroeg om brood; en zij zetten hem brood voor, en hij at.", "2 Sam 14:33": "Toen ging Joab naar de koning, en vertelde het hem. Toen riep hij Absalom, en hij kwam bij de koning, en boog zich voor hem op zijn gezicht ter aarde, voor het aangezicht van de koning; en de koning kuste Absalom.", "Dan 2:6": "Maar als u mij de droom en de uitleg ervan bekendmaakt, dan zult u geschenken en gaven, en grote eer van mij ontvangen; daarom, maak mij de droom en de uitleg ervan bekend.", "Luk 23:34": "En Jezus zei: Vader, vergeef het hun; want zij weten niet wat zij doen. En zij verdeelden Zijn kleren en wierpen erom het lot.", "Gen 19:1": "En die twee engelen kwamen 's avonds in Sodom aan; en Lot zat in de poort van Sodom; en toen Lot hen zag, stond hij op om hun tegemoet te gaan, en boog zich met het gezicht ter aarde.", "Job 31:3": "Is niet het verderf voor de verkeerde, ja, wat vreemds voor de werkers van ongerechtigheid?", "1 Sam 25:23": "Toen Abigaïl nu David zag, haastte zij zich, en kwam van de ezel af, en zij viel voor het aangezicht van David op haar aangezicht, en zij boog zich ter aarde.", "Ps 58:11": "De rechtvaardige zal zich verblijden, als hij de wraak aanschouwt; hij zal zijn voeten wassen in het bloed van de goddeloze.", "Job 18:16": "Van onderen zullen zijn wortels verdorren, en van boven zal zijn tak afgesneden worden.", "Ps 124:3": "dan zouden zij ons levend verslonden hebben, toen hun toorn tegen ons ontstak.", "Num 26:2": "Neem de som op van de hele vergadering van de kinderen van Israël, van twintig jaar oud en daarboven, naar het huis van hun vaderen, ieder die in Israël voor het leger uittrekt.", "Matt 27:5": "En toen hij de zilverstukken in de tempel geworpen had, vertrok hij; en hij ging heen en verhing zichzelf.", "Ps 63:10": "Maar zij die mijn ziel zoeken om die te verwoesten, zullen komen in de onderste plaatsen van de aarde.", "Spr 11:21": "Hand aan hand zal de boze niet onschuldig blijven; maar het nageslacht van de rechtvaardigen zal ontkomen.", "2 Kron 25:5": "En Amazia verzamelde Juda, en stelde hen, naar de families van hun vaderen, aan tot leiders van duizenden en tot leiders van honderden, door heel Juda en Benjamin; en hij monsterde hen, van twintig jaar oud en daarboven, en vond hen driehonderdduizend uitgelezen mannen, die uit konden trekken ten strijde, en die speer en schild konden hanteren.", "1 Kon 1:33": "En de koning zei tegen hen: Neem de knechten van uw heer met u mee, en laat mijn zoon Salomo rijden op de muilezelin die van mij is; en breng hem naar Gihon.", "1 Sam 18:13": "Daarom stuurde Saul hem van zich weg, en hij stelde hem aan tot leider van duizend; en hij ging uit en hij ging in voor het aangezicht van het volk.", "2 Sam 13:34": "Absalom nu vluchtte; en de knecht die de wacht hield, hief zijn ogen op, en keek toe, en zie, er kwam veel volk van de weg achter hem, aan de kant van het gebergte.", "Richt 5:26": "Haar hand sloeg zij aan de nagel, en haar rechterhand aan de hamer van de arbeidslieden; en zij klopte Sisera; zij streek zijn hoofd af, toen zij zijn slaap had doorgenageld en doorgedrongen.", "Gen 43:28": "En zij zeiden: Het gaat goed met uw dienaar, onze vader, hij leeft nog; en zij neigden het hoofd en bogen zich neer.", "Deut 27:20": "Vervloekt is hij die bij de vrouw van zijn vader ligt, omdat hij de slipt van zijn vader ontdekt heeft! En heel het volk zal zeggen: Amen.", "Deut 27:16": "Vervloekt is hij die zijn vader of zijn moeder veracht! En heel het volk zal zeggen: Amen.", "Neh 4:9": "Maar wij baden tot onze God, en zetten wacht tegen hen, dag en nacht, vanwege hen.", "Neh 4:18": "En de bouwers hadden ieder zijn zwaard aan zijn heup gegord en bouwden; en hij die op de bazuin blies, was bij mij.", "1 Sam 15:12": "Daarna maakte Samuël zich ‘s morgens vroeg op, Saul tegemoet; en het werd Samuël bericht: Saul is te Karmel gekomen, en zie, hij heeft voor zichzelf een gedenkteken opgericht; daarna is hij omgetrokken, en verdergegaan, en naar Gilgal afgedaald.", "Ps 124:2": "Als de HEERE niet bij ons geweest was, toen de mensen tegen ons opstonden,", "Ex 17:9": "Mozes zei toen tegen Jozua: Kies mannen voor ons uit, en trek eropuit, strijd tegen Amalek; morgen zal ik op de top van de heuvel staan, met de staf van God in mijn hand.", "Richt 12:4-6": "En Jeftha verzamelde alle mannen van Gilead, en streed met Efraïm; en de mannen van Gilead versloegen Efraïm, want de Gileadieten zeiden: U bent vluchtelingen van Efraïm, [wonend] tussen Efraïm en tussen Manasse. Want de Gileadieten namen de Efraïmieten de doorwaadbare plaatsen van de Jordaan af; en het gebeurde, toen de vluchtelingen van Efraïm zeiden: Laat mij oversteken, dat de mannen van Gilead tegen hem zeiden: Bent u een Efraïmiet? En wanneer hij zei: Nee; dan zeiden zij tegen hem: Zeg dan Schibboleth; maar hij zei: Sibbolet, en kon het zo niet goed uitspreken; dan grepen zij hem en doodden hem bij de doorwaadbare plaatsen van de Jordaan, zodat er in die tijd van Efraïm tweeënveertigduizend vielen.", "Luk 18:7": "Zal God dan geen recht doen aan Zijn uitverkorenen, die dag en nacht tot Hem roepen, hoewel Hij geduldig is met hen?", "Neh 7:3": "En ik zei tegen hen: Laat de poorten van Jeruzalem niet geopend worden, totdat de zon heet wordt, en terwijl zij daarbij staan, laat hen de deuren sluiten, grendel ze dan; en dat men wachten zette, inwoners van Jeruzalem, ieder op zijn wachtpost, en ieder tegenover zijn huis.", "1 Sam 11:8": "En hij telde hen in Bezek; en van de kinderen van Israël waren er driehonderdduizend, en van de mannen van Juda dertigduizend.", "Joz 10:20": "En het gebeurde, toen Jozua en de kinderen van Israël klaar waren met hen te slaan met een zeer grote slag, totdat zij vernietigd waren, en dat de overgeblevenen, die van hen overgebleven waren, in de versterkte steden gekomen waren;", "Ex 17:10-12": "Jozua deed zoals Mozes hem gezegd had, en streed tegen Amalek; maar Mozes, Aäron en Hur klommen op de top van de heuvel. En het gebeurde: terwijl Mozes zijn hand ophief, was Israël de sterkste; maar terwijl hij zijn hand neerliet, was Amalek de sterkste. Maar de handen van Mozes werden zwaar; daarom namen zij een steen, en legden die onder hem, zodat hij daarop kon zitten; en Aäron en Hur ondersteunden zijn handen, de een aan de ene kant, de ander aan de andere kant; zo bleven zijn handen standvastig, totdat de zon onderging.", "2 Sam 1:17": "David nu klaagde deze klaagzang over Saul en over Jonathan, zijn zoon;", "Ps 115:1": "Niet ons, o HEERE, niet ons, maar geef aan Uw Naam eer, om Uw goedertierenheid, om Uw waarheid.", "2 Sam 18:27-29": "Verder zei de wachter: Ik zie de manier van lopen van de eerste, als de manier van lopen van Ahimaäz, de zoon van Zadok. Toen zei de koning: Dat is een goed man, en hij zal met een goed bericht komen. Ahimaäz dan riep en zei tegen de koning: Vrede! En hij boog zich voor de koning met het gezicht ter aarde, en zei: Geloofd zij de HEERE, uw God, Die de mannen heeft overgegeven die hun hand tegen mijn heer de koning ophieven. Toen zei de koning: Is het goed met de jongeman, met Absalom? En Ahimaäz zei: Ik zag een groot rumoer, toen Joab, de knecht van de koning, en mij, uw knecht, wegzond, maar ik weet niet wat het was.", "2 Sam 10:7-10": "Toen David dit hoorde, zond hij Joab heen, met heel het leger van de helden. En de kinderen Ammons trokken uit, en stelden de slagorde op voor de ingang van de poort; maar de Syriërs van Zoba, en Rechob, en de mannen van Tob en Maächa waren afzonderlijk in het veld. Toen Joab nu zag, dat de spits van de slagorde tegen hem was, van voren en van achteren, koos hij uit alle uitgelezen mannen van Israël, en stelde hen in slagorde op tegen de Syriërs;", "Richt 5:31": "Zo moeten omkomen al Uw vijanden, o HEERE! Die Hem daarentegen liefhebben, moeten zijn, als wanneer de zon opgaat in haar kracht. En het land was stil, veertig jaren.", "Dan 2:48": "Toen maakte de koning Daniël groot, en gaf hem vele grote geschenken, en hij stelde hem aan als heerser over het hele landschap van Babel, en als hoofd der bestuurders over alle wijzen van Babel.", "Jer 22:30": "Zo zegt de HEERE: Schrijf deze man op als kinderloos, een man die niet voorspoedig zal zijn in zijn dagen; want niemand van zijn nageslacht zal voorspoedig zijn, zittend op de troon van David, en nog heersend in Juda.", "2 Sam 17:23": "Toen Achitofel nu zag dat zijn raad niet was opgevolgd, zadelde hij de ezel, stond op, en ging naar zijn huis in zijn stad, en gaf bevel aan zijn huis, en verhing zich. Zo stierf hij, en werd begraven in het graf van zijn vader."}, "noten": {}, "koppeling": {"1": "<span class=\"wl\" data-l=\"L1\" data-code=\"H1732\">En</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H1732\">David</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H6485\">monsterde</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H6485\">het</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H5971\">volk</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H834\">dat</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H834\">bij</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H854\">hem</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H854\">was</span>, <span class=\"wl\" data-l=\"L6\" data-code=\"H7760\">en</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H7760\">hij</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H7760\">stelde</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H7760\">over</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H8269\">hen</span> leiders <span class=\"wl\" data-l=\"L8\" data-code=\"H505\">van</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H505\">duizend</span>, <span class=\"wl\" data-l=\"L7\" data-code=\"H8269\">en</span> leiders <span class=\"wl\" data-l=\"L9\" data-code=\"H3967\">van</span> <span class=\"wl\" data-l=\"L9\" data-code=\"H3967\">honderd</span> <span class=\"wl\" data-l=\"L9\" data-code=\"H3967\">aan</span>.", "2": "Verder <span class=\"wl\" data-l=\"L1\" data-code=\"H7971\">zond</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H1732\">David</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H1732\">het</span> <span c
