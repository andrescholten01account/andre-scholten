naam":"Openbaring","href":"../../openbaring/1/"}],"slugmap":{"Gen":"genesis","Ex":"exodus","Lev":"leviticus","Num":"numeri","Deut":"deuteronomium","Joz":"jozua","Richt":"richteren","Ruth":"ruth","1 Sam":"1-samuel","2 Sam":"2-samuel","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"En David monsterde het volk dat bij hem was, en hij stelde over hen leiders van duizend, en leiders van honderd aan.","2":"Verder zond David het volk uit, een derde deel onder leiding van Joab, en een derde deel onder leiding van Abisai, de zoon van Zeruja, Joabs broer, en een derde deel onder leiding van Ithai, de Gethiet. En de koning zei tegen het volk: Ik zal ook zelf zeker met u meetrekken.","3":"Maar het volk zei: U mag niet meetrekken; want als wij op de vlucht slaan, zullen zij zich niet om ons bekommeren; ja, al stierf de helft van ons, zij zullen zich niet om ons bekommeren; maar *u* *bent* nu als tienduizend van ons waard. Zo zal het nu beter zijn, dat u ons vanuit de stad te hulp komt.","4":"Toen zei de koning tegen hen: Ik zal doen wat goed is in uw ogen. De koning nu ging bij de poort staan, en al het volk trok uit bij honderdtallen en bij duizendtallen.","5":"En de koning gaf bevel aan Joab, en Abisai, en Ithai, en zei: Ga zachtzinnig om met de jongeman, met Absalom. En al het volk hoorde het, toen de koning aan alle leiders bevel gaf over de zaak van Absalom.","6":"Zo trok het volk het veld in, Israël tegemoet, en de strijd vond plaats bij het woud van Efraïm.","7":"En het volk van Israël werd daar door Davids knechten verslagen; en daar gebeurde die dag een grote slachting, van twintigduizend man.","8":"Want de strijd verspreidde zich daar over dat hele land. En het woud verslond die dag meer van het volk dan het zwaard verslond.","9":"Absalom nu kwam de knechten van David tegen; en Absalom reed op een muildier; en toen het muildier onder de dichte takken van een grote eik kwam, raakte zijn hoofd vast in de eik, zodat hij bleef hangen tussen hemel en aarde, en het muildier dat onder hem was, liep door.","10":"Toen een man dat zag, vertelde hij het aan Joab, en zei: Zie, ik heb Absalom zien hangen aan een eik.","11":"Toen zei Joab tegen de man die het hem vertelde: Zie toch, u hebt het gezien, waarom hebt u hem daar dan niet ter aarde geslagen? Dan had ik u tien zilverstukken en een gordel gegeven.","12":"Maar die man zei tegen Joab: Al zou ik duizend zilverstukken op mijn handen krijgen, dan nog zou ik mijn hand niet slaan aan de zoon van de koning; want de koning heeft u, en Abisai, en Ithai, voor onze oren bevolen en gezegd: Pas op, wie u ook bent, voor de jongeman, voor Absalom.","13":"Of had ik uit valsheid tegen mijn eigen leven gehandeld? Want geen ding blijft voor de koning verborgen; ook u zelf zou u er dan tegenover mij van afzijdig gehouden hebben.","14":"Toen zei Joab: Ik zal hier zo niet langer bij u blijven wachten; en hij nam drie pijlen in zijn hand, en stak ze in het hart van Absalom, terwijl hij nog leefde, midden in de eik.","15":"En tien jongemannen, wapendragers van Joab, omringden *hem*, en zij sloegen Absalom en doodden hem.","16":"Toen blies Joab op de bazuin, en al het volk keerde terug van het achtervolgen van Israël, want Joab hield het volk tegen.","17":"En zij namen Absalom en wierpen hem in het woud, in een grote kuil, en legden op hem een zeer grote steenhoop; en heel Israël vluchtte, ieder naar zijn tent.","18":"Absalom nu had tijdens zijn leven voor zichzelf een gedenkzuil opgericht, die in het koningsdal staat; want hij zei: Ik heb geen zoon om aan mijn naam te doen denken; en hij had die zuil naar zijn eigen naam genoemd; daarom wordt die tot op deze dag Absaloms hand genoemd.","19":"Toen zei Ahimaäz, de zoon van Zadok: Laat mij toch snel gaan, en de koning berichten dat de HEERE hem recht gedaan heeft tegenover zijn vijanden.","20":"Maar Joab zei tegen hem: U zult vandaag geen boodschapper zijn, maar een andere dag zult u berichten; vandaag zult u niet berichten, omdat de zoon van de koning dood is.","21":"En Joab zei tegen Cuschi: Ga heen, en vertel de koning wat u gezien hebt; en Cuschi boog zich voor Joab, en liep heen.","22":"Doch Ahimaäz, de zoon van Zadok, hield vol en zei tegen Joab: Wat er ook gebeurt, laat mij toch ook achter Cuschi aan lopen. En Joab zei: Waarom zou u nu gaan lopen, mijn zoon, als u toch geen bericht hebt waarmee u iets bereikt?","23":"Wat er ook gebeurt, zei hij, laat mij lopen; toen zei hij tegen hem: Loop dan. En Ahimaäz liep via de weg door de vlakte, en haalde Cuschi in.","24":"David nu zat tussen de twee poorten; en de wachter ging op het dak van de poort bij de muur staan, en hief zijn ogen op, en zag, en zie, er liep een man alleen.","25":"Toen riep de wachter, en meldde het de koning; en de koning zei: Als hij alleen is, dan is er een bericht in zijn mond; en hij liep maar door en kwam dichterbij.","26":"Toen zag de wachter een andere man lopen, en de wachter riep naar de poortwachter en zei: Zie, er loopt *nog* een man alleen. Toen zei de koning: Dat is ook een boodschapper.","27":"Verder zei de wachter: Ik zie de manier van lopen van de eerste, als de manier van lopen van Ahimaäz, de zoon van Zadok. Toen zei de koning: Dat is een goed man, en hij zal met een goed bericht komen.","28":"Ahimaäz dan riep en zei tegen de koning: Vrede! En hij boog zich voor de koning met het gezicht ter aarde, en zei: Geloofd zij de HEERE, uw God, Die de mannen heeft overgegeven die hun hand tegen mijn heer de koning ophieven.","29":"Toen zei de koning: Is het goed met de jongeman, met Absalom? En Ahimaäz zei: Ik zag een groot rumoer, toen Joab, de knecht van de koning, en *mij*, uw knecht, wegzond, maar ik weet niet wat het was.","30":"En de koning zei: Ga opzij, blijf hier staan; zo ging hij opzij, en bleef staan.","31":"En zie, Cuschi kwam aan; en Cuschi zei: Er is bericht voor mijn heer de koning, dat de HEERE u vandaag recht gedaan heeft tegenover allen die tegen u opstonden.","32":"Toen zei de koning tegen Cuschi: Is het goed met de jongeman, met Absalom? En Cuschi zei: Laat het de vijanden van mijn heer de koning, en allen die tegen u opstaan om u kwaad te doen, vergaan als die jongeman.","33":"Toen raakte de koning zeer ontroerd, en ging naar boven, naar de bovenzaal boven de poort, en huilde; en al gaande zei hij dit: Mijn zoon Absalom, mijn zoon, mijn zoon Absalom! Was ik maar, was ik maar in uw plaats gestorven, Absalom, mijn zoon, mijn zoon!"},"SV":{"1":"En David monsterde het volk, dat met hem was; en hij stelde over hen oversten van duizenden, en oversten van honderden.","2":"Voorts zond David het volk uit, een derde deel onder de hand van Joab, en een derde deel onder de hand van Abisai, den zoon van Zeruja, Joabs broeder, en een derde deel onder de hand van Ithai, den Gethiet. En de koning zeide tot het volk: Ik zal ook zelf zekerlijk met ulieden uittrekken.","3":"Maar het volk zeide: Gij zult niet uittrekken; want of wij te enen male vloden, zij zullen het hart op ons niet stellen; ja, of de helft van ons stierf, zij zullen het hart op ons niet stellen; maar *gij* *zijt* nu als tien duizend onzer. Zo zal het nu beter zijn, dat gij ons uit de stad ter hulpe zijt.","4":"Toen zeide de koning tot hen: Ik zal doen, wat goed is in uw ogen. De koning nu stond aan de zijde van de poort, en al het volk trok uit bij honderden en bij duizenden.","5":"En de koning gebood Joab, en Abisai, en Ithai, zeggende: *Handelt* mij zachtkens met den jongeling, met Absalom. En al het volk hoorde het, als de koning aan al de oversten van Absaloms zaak gebood.","6":"Alzo toog het volk uit in het veld, Israël tegemoet, en de strijd geschiedde bij Efraïms woud.","7":"En het volk van Israël werd aldaar voor het aangezicht van Davids knechten geslagen; en aldaar geschiedde te dienzelven dage een grote slag, van twintig duizend.","8":"Want de strijd werd aldaar verspreid over al dat land. En het woud verteerde meer van het volk, dan die het zwaard verteerde, te dienzelven dage.","9":"Absalom nu ontmoette voor het aangezicht der knechten Davids; en Absalom reed op een muildier; en als het muildier kwam onder de dichte takken van een groten eik, zo werd zijn hoofd vast aan den eik, dat hij hangen bleef tussen den hemel en tussen de aarde, en het muildier, dat onder hem was, ging door.","10":"Als dat een man zag, zo gaf hij het Joab te kennen, en zeide: Zie, ik heb Absalom zien hangen aan een eik.","11":"Toen zeide Joab tot den man, die het hem te kennen gaf: Zie toch, gij hebt het gezien, waarom dan hebt gij hem niet aldaar ter aarde geslagen, alzo het aan mij *stond* om u tien zilverlingen en een gordel te geven?","12":"Maar die man zeide tot Joab: En of ik al duizend zilverlingen op mijn handen mocht wegen, zo zou ik mijn hand aan des konings zoon niet slaan; want de koning heeft u, en Abisai, en Ithai, voor onze oren geboden, zeggende: Hoedt u, wie *gij* *zijt*, van den jongeling, van Absalom.","13":"Of ik al valselijk tegen mijn ziel handelde, zo zou toch geen ding voor den koning verborgen worden; ook gij zelf zoudt er u van tegenover stellen.","14":"Toen zeide Joab: Ik zal hier bij u alzo niet vertoeven; en hij nam drie pijlen, en stak ze in Absaloms hart, daar hij nog levend was in het midden van den eik.","15":"En tien jongens, wapendragers van Joab, omringden *hem*, en zij sloegen Absalom, en doodden hem.","16":"Toen blies Joab met de bazuin, en al het volk keerde af van Israël achterna te jagen, want Joab hield het volk terug.","17":"En zij namen Absalom, en wierpen hem in het woud, in een groten kuil, en stelden op hem een zeer groten steenhoop; en gans Israël vluchtte, een iegelijk naar zijn tent.","18":"Absalom nu had genomen, en in zijn leven voor zich opgericht een pilaar, die in het koningsdal is; want hij zeide: Ik heb geen zoon, om aan mijn naam te doen gedenken; en hij had dien pilaar genoemd naar zijn naam; daarom wordt hij tot op dezen dag genoemd: Absaloms hand.","19":"Toen zeide Ahimaäz, Zadoks zoon: Laat mij toch heenlopen, en den koning boodschappen, dat de HEERE hem recht gedaan heeft van de hand zijner vijanden.","20":"Maar Joab zeide tot hem: Gij zult dezen dag geen boodschapper zijn, maar op een anderen dag zult gij boodschappen; dezen dag nu zult gij niet boodschappen, daarom dat des konings zoon dood is.","21":"En Joab zeide tot Cuschi: Ga heen, en zeg den koning aan, wat gij gezien hebt; en Cuschi boog zich voor Joab, en liep heen.","22":"Doch Ahimaäz, Zadoks zoon, voer nog voort en zeide tot Joab: Wat het ook zij, laat mij toch ook Cuschi achterna lopen. En Joab zeide: Waarom zoudt gij nu heenlopen, mijn zoon! Zo gij toch geen bekwame boodschap hebt?","23":"Wat het ook zij, *zeide* *hij*, laat mij heenlopen; zo zeide hij tot hem: Loop heen. En Ahimaäz liep den weg van het effen veld, en kwam Cuschi voorbij.","24":"David nu zat tussen de twee poorten; en de wachter ging op het dak der poort aan den muur, en hief zijn ogen op, en zag, en ziet, er liep een man alleen.","25":"Zo riep de wachter, en zeide het den koning aan; en de koning zeide: Indien hij alleen is, zo is er een boodschap in zijn mond; en hij ging al voort en naderde.","26":"Toen zag de wachter een anderen man lopende, en de wachter riep tot den poortier en zeide: Zie, er loopt *nog* een man alleen. Toen zeide de koning: Die is ook een boodschapper.","27":"Voorts zeide de wachter: Ik zie den loop des eersten aan, als den loop van Ahimaäz, Zadoks zoon. Toen zeide de koning: Dat is een goed man, en hij zal met een goede boodschap komen.","28":"Ahimaäz dan riep en zeide tot den koning Vrede! En hij boog zich voor den koning met het aangezicht ter aarde, en hij zeide: Geloofd zij de HEERE, uw God, Die de mannen, dewelke hun hand tegen mijn heer den koning ophieven, heeft overgegeven.","29":"Toen zeide de koning: Is het wel met den jongeling, met Absalom? En Ahimaäz zeide: Ik zag een groot rumoer, als Joab, den knecht des konings, en *mij* uw knecht afzond, maar ik weet niet wat.","30":"En de koning zeide: Ga om, stel u hier; zo ging hij om, en bleef staan.","31":"En ziet, Cuschi kwam aan; en Cuschi zeide: Mijn heer den koning wordt geboodschapt, dat u de HEERE heden heeft recht gedaan van de hand van al degenen, die tegen u opstonden.","32":"Toen zeide de koning tot Cuschi: Is het wel met den jongeling, met Absalom? En Cuschi zeide: De vijanden van mijn heer den koning, en allen, die tegen u ten kwade opstaan, moeten worden als die jongeling.","33":"Toen werd de koning zeer beroerd, en ging op naar de opperzaal der poort, en weende; en in zijn gaan zeide hij alzo: Mijn zoon Absalom, mijn zoon, mijn zoon Absalom! Och, dat ik, ik voor u gestorven ware, Absalom, mijn zoon, mijn zoon!"},"KJV":{"1":"And David numbered the people that were with him, and set captains of thousands and captains of hundreds over them.","2":"And David sent forth a third part of the people under the hand of Joab, and a third part under the hand of Abishai the son of Zeruiah, Joab's brother, and a third part under the hand of Ittai the Gittite. And the king said unto the people, I will surely go forth with you myself also.","3":"But the people answered, Thou shalt not go forth: for if we flee away, they will not care for us; neither if half of us die, will they care for us: but now thou art worth ten thousand of us: therefore now it is better that thou succour us out of the city.","4":"And the king said unto them, What seemeth you best I will do. And the king stood by the gate side, and all the people came out by hundreds and by thousands.","5":"And the king commanded Joab and Abishai and Ittai, saying, Deal gently for my sake with the young man, even with Absalom. And all the people heard when the king gave all the captains charge concerning Absalom.","6":"So the people went out into the field against Israel: and the battle was in the wood of Ephraim;","7":"Where the people of Israel were slain before the servants of David, and there was there a great slaughter that day of twenty thousand men.","8":"For the battle was there scattered over the face of all the country: and the wood devoured more people that day than the sword devoured.","9":"And Absalom met the servants of David. And Absalom rode upon a mule, and the mule went under the thick boughs of a great oak, and his head caught hold of the oak, and he was taken up between the heaven and the earth; and the mule that was under him went away.","10":"And a certain man saw it, and told Joab, and said, Behold, I saw Absalom hanged in an oak.","11":"And Joab said unto the man that told him, And, behold, thou sawest him, and why didst thou not smite him there to the ground? and I would have given thee ten shekels of silver, and a girdle.","12":"And the man said unto Joab, Though I should receive a thousand shekels of silver in mine hand, yet would I not put forth mine hand against the king's son: for in our hearing the king charged thee and Abishai and Ittai, saying, Beware that none touch the young man Absalom.","13":"Otherwise I should have wrought falsehood against mine own life: for there is no matter hid from the king, and thou thyself wouldest have set thyself against me.","14":"Then said Joab, I may not tarry thus with thee. And he took three darts in his hand, and thrust them through the heart of Absalom, while he was yet alive in the midst of the oak.","15":"And ten young men that bare Joab's armour compassed about and smote Absalom, and slew him.","16":"And Joab blew the trumpet, and the people returned from pursuing after Israel: for Joab held back the people.","17":"And they took Absalom, and cast him into a great pit in the wood, and laid a very great heap of stones upon him: and all Israel fled every one to his tent.","18":"Now Absalom in his lifetime had taken and reared up for himself a pillar, which is in the king's dale: for he said, I have no son to keep my name in remembrance: and he called the pillar after his own name: and it is called unto this day, Absalom's place.","19":"Then said Ahimaaz the son of Zadok, Let me now run, and bear ➔ the king tidings, how that the LORD hath avenged him of his enemies.","20":"And Joab said unto him, Thou shalt not bear tidings this day, but thou shalt bear tidings another day: but this day thou shalt bear no tidings, because the king's son is dead.","21":"Then said Joab to Cushi, Go tell the king what thou hast seen. And Cushi bowed himself unto Joab, and ran.","22":"Then said Ahimaaz the son of Zadok yet again to Joab, But howsoever, let me, I pray thee, also run after Cushi. And Joab said, Wherefore wilt thou run, my son, seeing that thou hast no tidings ready?","23":"But howsoever, said he, let me run. And he said unto him, Run. Then Ahimaaz ran by the way of the plain, and overran Cushi.","24":"And David sat between the two gates: and the watchman went up to the roof over the gate unto the wall, and lifted up his eyes, and looked, and behold a man running alone.","25":"And the watchman cried, and told the king. And the king said, If he be alone, there is tidings in his mouth. And he came apace, and drew near.","26":"And the watchman saw another man running: and the watchman called unto the porter, and said, Behold another man running alone. And the king said, He also bringeth tidings.","27":"And the watchman said, Me thinketh the running of the foremost is like the running of Ahimaaz the son of Zadok. And the king said, He is a good man, and cometh with good tidings.","28":"And Ahimaaz called, and said unto the king, All is well. And he fell down to the earth upon his face before the king, and said, Blessed be the LORD thy God, which hath delivered up the men that lifted up their hand against my lord the king.","29":"And the king said, Is the young man Absalom safe? And Ahimaaz answered, When Joab sent the king's servant, and me thy servant, I saw a great tumult, but I knew not what it was.","30":"And the king said unto him, Turn aside, and stand here. And he turned aside, and stood still.","31":"And, behold, Cushi came; and Cushi said, Tidings, my lord the king: for the LORD hath avenged thee this day of all them that rose up against thee.","32":"And the king said unto Cushi, Is the young man Absalom safe? And Cushi answered, The enemies of my lord the king, and all that rise against thee to do thee hurt, be as that young man is.","33":"And the king was much moved, and went up to the chamber over the gate, and wept: and as he went, thus he said, O my son Absalom, my son, my son Absalom! would God I had died for thee, O Absalom, my son, my son!"}},"tsk":{"1":[{"kopje":"monsterde","refs":["Ex 17:9","Joz 8:10"]},{"kopje":"leiders van duizend","refs":["1 Sam 8:12"]}],"2":[{"kopje":"een derde deel","refs":["Richt 7:16","Richt 7:19","Richt 9:43"]},{"kopje":"leiding van Joab","refs":["2 Sam 10:7-10"]},{"kopje":"Ithai","refs":["2 Sam 15:19-22"]},{"kopje":"Ik zal ook zelf zeker","refs":["2 Sam 17:11","Ps 3:7","Ps 27:1-3","Ps 118:6-8"]}],"3":[{"kopje":"U mag niet","refs":["2 Sam 21:17"]},{"kopje":"als wij op de vlucht slaan","refs":["2 Sam 17:2", wl-kjv\" data-code=\"H3027\">hand</span> of <span class=\"wl wl-kjv\" data-code=\"H863\">Ittai</span> the <span class=\"wl wl-kjv\" data-code=\"H1663\">Gittite.</span> And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> I will <span class=\"wl wl-kjv\" data-code=\"H3318\">surely</span> go <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> with you <span class=\"wl wl-kjv\" data-code=\"H589\">myself</span> also.","3":"But the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H559\">answered,</span> Thou shalt not go <span class=\"wl wl-kjv\" data-code=\"H3318\">forth:</span> for if we <span class=\"wl wl-kjv\" data-code=\"H5127\">flee</span> <span class=\"wl wl-kjv\" data-code=\"H5127\">away,</span> they will not <span class=\"wl wl-kjv\" data-code=\"H7760\">care</span> for us; neither if <span class=\"wl wl-kjv\" data-code=\"H2677\">half</span> of us <span class=\"wl wl-kjv\" data-code=\"H4191\">die,</span> will they <span class=\"wl wl-kjv\" data-code=\"H7760\">care</span> for us: but now thou art <span class=\"wl wl-kjv\" data-code=\"H3644\">worth</span> <span class=\"wl wl-kjv\" data-code=\"H6235\">ten</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> of us: therefore now it is <span class=\"wl wl-kjv\" data-code=\"H2896\">better</span> that thou <span class=\"wl wl-kjv\" data-code=\"H5826\">succour</span> us out of the <span class=\"wl wl-kjv\" data-code=\"H5892\">city.</span>","4":"And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto them, What <span class=\"wl wl-kjv\" data-code=\"H5869\">seemeth</span> you <span class=\"wl wl-kjv\" data-code=\"H3190\">best</span> I will <span class=\"wl wl-kjv\" data-code=\"H6213\">do.</span> And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H5975\">stood</span> by the <span class=\"wl wl-kjv\" data-code=\"H8179\">gate</span> <span class=\"wl wl-kjv\" data-code=\"H3027\">side,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> came <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> by <span class=\"wl wl-kjv\" data-code=\"H3967\">hundreds</span> and by <span class=\"wl wl-kjv\" data-code=\"H505\">thousands.</span>","5":"And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab</span> and <span class=\"wl wl-kjv\" data-code=\"H52\">Abishai</span> and <span class=\"wl wl-kjv\" data-code=\"H863\">Ittai,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Deal <span class=\"wl wl-kjv\" data-code=\"H328\">gently</span> for my sake with the young <span class=\"wl wl-kjv\" data-code=\"H5288\">man,</span> even with <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom.</span> And all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> when the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> gave all the <span class=\"wl wl-kjv\" data-code=\"H8269\">captains</span> <span class=\"wl wl-kjv\" data-code=\"H6680\">charge</span> <span class=\"wl wl-kjv\" data-code=\"H1697\">concerning</span> <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom.</span>","6":"So the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> went <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> into the <span class=\"wl wl-kjv\" data-code=\"H7704\">field</span> <span class=\"wl wl-kjv\" data-code=\"H7125\">against</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel:</span> and the <span class=\"wl wl-kjv\" data-code=\"H4421\">battle</span> was in the <span class=\"wl wl-kjv\" data-code=\"H3293\">wood</span> of <span class=\"wl wl-kjv\" data-code=\"H669\">Ephraim;</span>","7":"Where the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> were <span class=\"wl wl-kjv\" data-code=\"H5062\">slain</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> of <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> and there was there a <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H4046\">slaughter</span> that <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of <span class=\"wl wl-kjv\" data-code=\"H6242\">twenty</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> men.","8":"For the <span class=\"wl wl-kjv\" data-code=\"H4421\">battle</span> was there <span class=\"wl wl-kjv\" data-code=\"H6327\">scattered</span> over the <span class=\"wl wl-kjv\" data-code=\"H6440\">face</span> of all the <span class=\"wl wl-kjv\" data-code=\"H776\">country:</span> and the <span class=\"wl wl-kjv\" data-code=\"H3293\">wood</span> <span class=\"wl wl-kjv\" data-code=\"H398\">devoured</span> <span class=\"wl wl-kjv\" data-code=\"H7235\">more</span> <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> that <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> than the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword</span> <span class=\"wl wl-kjv\" data-code=\"H398\">devoured.</span>","9":"And <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom</span> <span class=\"wl wl-kjv\" data-code=\"H7122\">met</span> the <span class=\"wl wl-kjv\" data-code=\"H6440\">servants</span> of <span class=\"wl wl-kjv\" data-code=\"H1732\">David.</span> And <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom</span> <span class=\"wl wl-kjv\" data-code=\"H7392\">rode</span> upon a <span class=\"wl wl-kjv\" data-code=\"H6505\">mule,</span> and the <span class=\"wl wl-kjv\" data-code=\"H6505\">mule 4\">given</span> thee <span class=\"wl wl-kjv\" data-code=\"H6235\">ten</span> shekels of <span class=\"wl wl-kjv\" data-code=\"H3701\">silver,</span> and <span class=\"wl wl-kjv\" data-code=\"H259\">a</span> <span class=\"wl wl-kjv\" data-code=\"H2290\">girdle.</span>","12":"And the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab,</span> <span class=\"wl wl-kjv\" data-code=\"H3863\">Though</span> I should <span class=\"wl wl-kjv\" data-code=\"H8254\">receive</span> a <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> shekels of <span class=\"wl wl-kjv\" data-code=\"H3701\">silver</span> in mine <span class=\"wl wl-kjv\" data-code=\"H3709\">hand,</span> yet would I not put <span class=\"wl wl-kjv\" data-code=\"H7971\">forth</span> mine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> against the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">son:</span> for in our <span class=\"wl wl-kjv\" data-code=\"H241\">hearing</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H6680\">charged</span> thee and <span class=\"wl wl-kjv\" data-code=\"H52\">Abishai</span> and <span class=\"wl wl-kjv\" data-code=\"H863\">Ittai,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H8104\">Beware</span> that none touch the young <span class=\"wl wl-kjv\" data-code=\"H5288\">man</span> <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom.</span>","13":"<span class=\"wl wl-kjv\" data-code=\"H176\">Otherwise</span> I should have <span class=\"wl wl-kjv\" data-code=\"H6213\">wrought</span> <span class=\"wl wl-kjv\" data-code=\"H8267\">falsehood</span> against mine own <span class=\"wl wl-kjv\" data-code=\"H5315\">life:</span> for there is no <span class=\"wl wl-kjv\" data-code=\"H1697\">matter</span> <span class=\"wl wl-kjv\" data-code=\"H3582\">hid</span> from the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> and thou thyself wouldest have <span class=\"wl wl-kjv\" data-code=\"H3320\">set</span> thyself against me.","14":"Then <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab,</span> I may not <span class=\"wl wl-kjv\" data-code=\"H3176\">tarry</span> thus with <span class=\"wl wl-kjv\" data-code=\"H6440\">thee.</span> And he <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H7626\">darts</span> in his <span class=\"wl wl-kjv\" data-code=\"H3709\">hand,</span> and <span class=\"wl wl-kjv\" data-code=\"H8628\">thrust</span> them through the <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> of <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom,</span> while he was yet <span class=\"wl wl-kjv\" data-code=\"H2416\">alive</span> in the midst of the <span class=\"wl wl-kjv\" data-code=\"H424\">oak.</span>","15":"And <span class=\"wl wl-kjv\" data-code=\"H6235\">ten</span> young <span class=\"wl wl-kjv\" data-code=\"H5288\">men</span> that <span class=\"wl wl-kjv\" data-code=\"H5375\">bare</span> <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab's</span> <span class=\"wl wl-kjv\" data-code=\"H3627\">armour</span> compassed <span class=\"wl wl-kjv\" data-code=\"H5437\">about</span> and <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom,</span> and <span class=\"wl wl-kjv\" data-code=\"H4191\">slew</span> him.","16":"And <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab</span> <span class=\"wl wl-kjv\" data-code=\"H8628\">blew</span> the <span class=\"wl wl-kjv\" data-code=\"H7782\">trumpet,</span> and the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">returned</span> from <span class=\"wl wl-kjv\" data-code=\"H7291\">pursuing</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel:</span> for <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab</span> held <span class=\"wl wl-kjv\" data-code=\"H2820\">back</span> the <span class=\"wl wl-kjv\" data-code=\"H5971\">people.</span>","17":"And they <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom,</span> and <span class=\"wl wl-kjv\" data-code=\"H7993\">cast</span> him into a <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H6354\">pit</span> in the <span class=\"wl wl-kjv\" data-code=\"H3293\">wood,</span> and <span class=\"wl wl-kjv\" data-code=\"H5324\">laid</span> a <span class=\"wl wl-kjv\" data-code=\"H3966\">very</span> <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H1530\">heap</span> of <span class=\"wl wl-kjv\" data-code=\"H68\">stones</span> upon him: and all <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H5127\">fled</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">one</span> to his <span class=\"wl wl-kjv\" data-code=\"H168\">tent.</span>","18":"Now <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom</span> in his <span class=\"wl wl-kjv\" data-code=\"H2416\">lifetime</span> had <span class=\"wl wl-kjv\" data-code=\"H3947\">taken</span> and reared <span class=\"wl wl-kjv\" data-code=\"H5324\">up</span> for himself a <span class=\"wl wl-kjv\" data-code=\"H4678\">pillar,</span> which is in the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H6010\">dale:</span> for he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> I have no <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> to keep my <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> in <span class=\"wl wl-kjv\" data-code=\"H2142\">remembrance:</span> and he <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> the <span class=\"wl wl-kjv\" data-code=\"H4678\">pillar</span> after his own <span class=\"wl wl-kjv\" data-code=\"H8034\">name:</span> and it is <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> unto this <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom's</span> <span class=\"wl wl-kjv\" data-code=\"H3027\">place.</span>","19":"Then <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> <span class=\"wl wl-kjv\" data-code=\"H290\">Ahimaaz</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H6659\">Zadok,</span> Let me now <span class=\"wl wl-kjv\" data-code=\"H7323\">run,</span> and <span class=\"wl wl-kjv\" data-code=\"H1319\">bear</span> ➔ the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H1319\">tidings,</span> how that the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H8199\">avenged</span> him of his <span class=\"wl wl-kjv\" data-code=\"H3027\">enemies.</span>","20":"And <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, <span class=\"wl wl-kjv\" data-code=\"H376\">Thou</span> shalt not bear <span class=\"wl wl-kjv\" data-code=\"H1309\">tidings</span> this <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> but thou shalt bear <span class=\"wl wl-kjv\" data-code=\"H1319\">tidings</span> <span class=\"wl wl-kjv\" data-code=\"H312\">another</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day:</span> but this <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> thou shalt bear no <span class=\"wl wl-kjv\" data-code=\"H1319\">tidings,</span> because the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> is <span class=\"wl wl-kjv\" data-code=\"H4191\">dead.</span>","21":"Then <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab</span> to <span class=\"wl wl-kjv\" data-code=\"H3569\">Cushi,</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">Go</span> <span class=\"wl wl-kjv\" data-code=\"H5046\">tell</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> what thou hast <span class=\"wl wl-kjv\" data-code=\"H7200\">seen.</span> And <span class=\"wl wl-kjv\" data-code=\"H3569\">Cushi</span> <span class=\"wl wl-kjv\" data-code=\"H7812\">bowed</span> himself unto <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab,</span> and <span class=\"wl wl-kjv\" data-code=\"H7323\">ran.</span>","22":"Then <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> <span class=\"wl wl-kjv\" data-code=\"H290\">Ahimaaz</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H6659\">Zadok</span> yet <span class=\"wl wl-kjv\" data-code=\"H3254\">again</span> to <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab,</span> But <span class=\"wl wl-kjv\" data-code=\"H4100\">howsoever,</span> let me, I pray thee, also <span class=\"wl wl-kjv\" data-code=\"H7323\">run</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> <span class=\"wl wl-kjv\" data-code=\"H3569\">Cushi.</span> And <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Wherefore wilt thou <span class=\"wl wl-kjv\" data-code=\"H7323\">run,</span> my <span class=\"wl wl-kjv\" data-code=\"H1121\">son,</span> seeing that thou hast no <span class=\"wl wl-kjv\" data-code=\"H1309\">tidings</span> <span class=\"wl wl-kjv\" data-code=\"H4672\">ready?</span>","23":"But howsoever, said he, let me <span class=\"wl wl-kjv\" data-code=\"H7323\">run.</span> And he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, <span class=\"wl wl-kjv\" data-code=\"H7323\">Run.</span> Then <span class=\"wl wl-kjv\" data-code=\"H290\">Ahimaaz</span> <span class=\"wl wl-kjv\" data-code=\"H7323\">ran</span> by the <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> of the <span class=\"wl wl-kjv\" data-code=\"H3603\">plain,</span> and <span class=\"wl wl-kjv\" data-code=\"H5674\">overran</span> <span class=\"wl wl-kjv\" data-code=\"H3569\">Cushi.</span>","24":"And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H3427\">sat</span> between the <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H8179\">gates:</span> and the <span class=\"wl wl-kjv\" data-code=\"H6822\">watchman</span> went <span class=\"wl wl-kjv\" data-code=\"H3212\">up</span> to the <span class=\"wl wl-kjv\" data-code=\"H1406\">roof</span> over the <span class=\"wl wl-kjv\" data-code=\"H8179\">gate</span> unto the <span class=\"wl wl-kjv\" data-code=\"H2346\">wall,</span> and lifted <span class=\"wl wl-kjv\" data-code=\"H5375\">up</span> his <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes,</span> and <span class=\"wl wl-kjv\" data-code=\"H7200\">looked,</span> and behold a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> <span class=\"wl wl-kjv\" data-code=\"H7323\">running</span> alone.","25":"And the <span class=\"wl wl-kjv\" data-code=\"H6822\">watchman</span> <span class=\"wl wl-kjv\" data-code=\"H7121\">cried,</span> and <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king.</span> And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> If he be alone, there is <span class=\"wl wl-kjv\" data-code=\"H1309\">tidings</span> in his <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth.</span> And he <span class=\"wl wl-kjv\" data-code=\"H3212\">came</span> <span class=\"wl wl-kjv\" data-code=\"H1980\">apace,</span> and drew <span class=\"wl wl-kjv\" data-code=\"H7131\">near.</span>","26":"And the <span class=\"wl wl-kjv\" data-code=\"H6822\">watchman</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> <span class=\"wl wl-kjv\" data-code=\"H312\">another</span> <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> <span class=\"wl wl-kjv\" data-code=\"H7323\">running:</span> and the <span class=\"wl wl-kjv\" data-code=\"H6822\">watchman</span> <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> unto the <span class=\"wl wl-kjv\" data-code=\"H7778\">porter,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Behold another <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> <span class=\"wl wl-kjv\" data-code=\"H7323\">running</span> alone. And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> He also bringeth <span class=\"wl wl-kjv\" data-code=\"H1319\">tidings.</span>","27":"And the <span class=\"wl wl-kjv\" data-code=\"H6822\">watchman</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Me <span class=\"wl wl-kjv\" data-code=\"H7200\">thinketh</span> the <span class=\"wl wl-kjv\" data-code=\"H4794\">running</span> of the <span class=\"wl wl-kjv\" data-code=\"H7223\">foremost</span> is like the <span class=\"wl wl-kjv\" data-code=\"H4794\">running</span> of <span class=\"wl wl-kjv\" data-code=\"H290\">Ahimaaz</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H6659\">Zadok.</span> And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> He is a <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> <span class=\"wl wl-kjv\" data-code=\"H376\">man,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">cometh</span> with <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> <span class=\"wl wl-kjv\" data-code=\"H1309\">tidings.</span>","28":"And <span class=\"wl wl-kjv\" data-code=\"H290\">Ahimaaz</span> <span class=\"wl wl-kjv\" data-code=\"H7121\">called,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> All is <span class=\"wl wl-kjv\" data-code=\"H7965\">well.</span> And he fell <span class=\"wl wl-kjv\" data-code=\"H7812\">down</span> to the <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> upon his <span class=\"wl wl-kjv\" data-code=\"H639\">face</span> before the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H1288\">Blessed</span> be the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> which hath delivered <span class=\"wl wl-kjv\" data-code=\"H5462\">up</span> the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> that lifted <span class=\"wl wl-kjv\" data-code=\"H5375\">up</span> their <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> against my <span class=\"wl wl-kjv\" data-code=\"H113\">lord</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king.</span>","29":"And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Is the young <span class=\"wl wl-kjv\" data-code=\"H5288\">man</span> <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom</span> <span class=\"wl wl-kjv\" data-code=\"H7965\">safe?</span> And <span class=\"wl wl-kjv\" data-code=\"H290\">Ahimaaz</span> <span class=\"wl wl-kjv\" data-code=\"H559\">answered,</span> When <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H5650\">servant,</span> and me thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant,</span> I <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> a <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H1995\">tumult,</span> but I <span class=\"wl wl-kjv\" data-code=\"H3045\">knew</span> not what it was.","30":"And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, Turn <span class=\"wl wl-kjv\" data-code=\"H5437\">aside,</span> and <span class=\"wl wl-kjv\" data-code=\"H3320\">stand</span> <span class=\"wl wl-kjv\" data-code=\"H3541\">here.</span> And he turned <span class=\"wl wl-kjv\" data-code=\"H5437\">aside,</span> and stood <span class=\"wl wl-kjv\" data-code=\"H5975\">still.</span>","31":"And, behold, <span class=\"wl wl-kjv\" data-code=\"H3569\">Cushi</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came;</span> and <span class=\"wl wl-kjv\" data-code=\"H3569\">Cushi</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H1319\">Tidings,</span> my <span class=\"wl wl-kjv\" data-code=\"H113\">lord</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king:</span> for the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H8199\">avenged</span> thee this <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of all <span class=\"wl wl-kjv\" data-code=\"H3027\">them</span> that rose <span class=\"wl wl-kjv\" data-code=\"H6965\">up</span> against thee.","32":"And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H3569\">Cushi,</span> Is the young <span class=\"wl wl-kjv\" data-code=\"H5288\">man</span> <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom</span> <span class=\"wl wl-kjv\" data-code=\"H7965\">safe?</span> And <span class=\"wl wl-kjv\" data-code=\"H3569\">Cushi</span> <span class=\"wl wl-kjv\" data-code=\"H559\">answered,</span> The <span class=\"wl wl-kjv\" data-code=\"H341\">enemies</span> of my <span class=\"wl wl-kjv\" data-code=\"H113\">lord</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> and all that <span class=\"wl wl-kjv\" data-code=\"H6965\">rise</span> against thee to do thee <span class=\"wl wl-kjv\" data-code=\"H7451\">hurt,</span> be as that young <span class=\"wl wl-kjv\" data-code=\"H5288\">man</span> is.","33":"And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> was much <span class=\"wl wl-kjv\" data-code=\"H7264\">moved,</span> and went <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> to the <span class=\"wl wl-kjv\" data-code=\"H5944\">chamber</span> over the <span class=\"wl wl-kjv\" data-code=\"H8179\">gate,</span> and <span class=\"wl wl-kjv\" data-code=\"H1058\">wept:</span> and as he <span class=\"wl wl-kjv\" data-code=\"H3212\">went,</span> thus he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> O my <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom,</span> my <span class=\"wl wl-kjv\" data-code=\"H1121\">son,</span> my <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom!</span> would God I had <span class=\"wl wl-kjv\" data-code=\"H4191\">died</span> for <span class=\"wl wl-kjv\" data-code=\"H5414\">thee,</span> O <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom,</span> my <span class=\"wl wl-kjv\" data-code=\"H1121\">son,</span> my <span class=\"wl wl-kjv\" data-code=\"H1121\">son!</span>"},"bijbeluitleg":{"kanttekeningen_nl":{"2":[{"catchword":"Ithai,","tekst":"Zie boven, 2Sa 15:19."}],"3":[{"catchword":"het hart","tekst":"Dat is, zij zullen daarnaar niet vragen, zullen daarvan geen groot werk maken, want het is hun niet om ons, maar om uw persoon te doen."},{"catchword":"maar gij zijt","tekst":"Dat is, aan uw persoon is nu meer gelegen dan aan vele duizenden van ons. Vergelijk hiermede de woorden van Achitofel, boven 2Sa 17:2-3. Anders, al [waren] onzer, naardat wij nu [zijn], tienduizend maal meer"},{"catchword":"stad","tekst":"Mahanaïm; gelijk boven, 2Sa 17:24, 2Sa 17:27."},{"catchword":"ter hulpe zijt","tekst":"Hebreeuws, om te helpen; wanneer wij zouden mogen verlegen zijn."}],"4":[{"catchword":"wat goed is in uw ogen","tekst":"Dat is, wat u behaagt, of goeddunkt."},{"catchword":"aan de zijde van de poort,","tekst":"Of, op de plaats, tussen de twee poorten, onder vs.24. Hebreeuws eigenlijk, hand, maar van zulk een gebruik dezes woords, zie Deu 23:12, en onder vs.18, en elders."}],"6":[{"catchword":"Israël tegemoet,","tekst":"Dat is, Absalom en zijn volk, die hier doorgaans Israël worden genoemd, ten aanzien dat verre het merendeel van Israël bij hem was."},{"catchword":"Efraïms woud","tekst":"Dit woud was niet ver van Mahanaïm gelegen, aan de oostzijde van de Jordaan in Gilead, in den stam Gad; maar heeft den naam van Efraïms woud, [zoals enigen menen] gekregen van Efraïms nederlaag, ten tijde van Jeftha den Gileadiet. Zie Jdg 12:14-5. Efraïms land was aan de westzijde van de Jordaan, in het land Kanaän."}],"7":[{"catchword":"twintig duizend","tekst":"Der Israëlieten, die van Davids volk geslagen werden."}],"8":[{"catchword":"verteerde","tekst":"Dat is, die in het woud vluchtende, of gedreven zijnde, daarin omkwamen, zich in het een en het ander verwarrende, verwondende en in kuilen vallende, misschien ook van beesten verscheurd zijnde, of van honger en dorst stervende."},{"catchword":"meer van het volk,","tekst":"Hebreeuws, het woud vermenigvuldigde te verteren, enz."}],"9":[{"catchword":"dichte takken","tekst":"Hebreeuws, de dichtigheid"},{"catchword":"zijn hoofd vast","tekst":"Vermits zijn lang haar [waarvan boven, 2Sa 14:26 ] om de dichte takken van den elk slingerde, en daaraan vastrukte."},{"catchword":"hangen bleef","tekst":"Hebreeuws, gegeven werd."}],"11":[{"catchword":"zilverlingen en een gordel te geven?","tekst":"Zie Gen 20:16."}],"12":[{"catchword":"wegen,","tekst":"Dat is, mij toegewogen zijnde, in mijn handen ontvangen of tellen."},{"catchword":"Hoedt u,","tekst":"Versta, aan te roeren, of leed te doen. Hebreeuws eigenlijk, bezwaar, of let er op, neem waar, neem in acht, zie toe, [gelijk wij zeggen] wie aan, of tegen den jongeling, van Absalom. De zin is: wie hem leed doet, dien zal ik, enz., het is een afgebroken rede bij ons ook gebruikelijk. Of, let er op dat hem niemand leed doe. Anders, een ieder lette op den jongeling, op Absalom."}],"13":[{"catchword":"Of ik","tekst":"Dat is, of i, Absalom gedood hebbende, het valselijk mocht ontkennen, zo zou het toch niet verborgen blijven voor den koning, en dan zou ik gevaar mijns levens lopen. Anders, aan mijn ziel; dat is, aan, of tegen Absaloms leven of persoon."},{"catchword":"van tegenover stellen","tekst":"Dat is, gij zoudt mij verlaten en van verre blijven staan, zonder mij te helpen. Vergelijk Psa 38:12. Anders, tegenstellen."}],"14":[{"catchword":"Ik zal","tekst":"Of hij zeide: Het is geen tijd hier bij u lang te staan. Ik zal doen zo ik het versta."},{"catchword":"hier bij u","tekst":"Hebreeuws, voor uw aangezicht"},{"catchword":"pijlen,","tekst":"Versta, werppijlen, kleine spiesjes, of enig dergelijk scherp geweer in den oorlog te dien tijde gebruikelijk."},{"catchword":"hart,","tekst":"Dat is, in het midden zijns lichaams, omtrent het hart; want het blijkt vs.15, dat hij nog geleefd heeft."},{"catchword":"het midden van den eik","tekst":"Hebreeuws, in het hart van den eik; zie Deu 4:11."}],"17":[{"catchword":"steenhoop;","tekst":"Een geheel ander gedenkteken, door Gods rechtvaardig oordeel opgericht, dan hetgeen hij zichzelven in zijn leven had doen stellen. Zie vs.18."},{"catchword":"Israël vluchtte,","tekst":"Die Absalom gevolgd hadden."},{"catchword":"tent","tekst":"Dat is, woonplaatsen."}],"18":[{"catchword":"koningsdal is;","tekst":"Zie Gen 14:17."},{"catchword":"geen zoon,","tekst":"Hieruit wordt afgenomen dat Absaloms zonen, [waarvan boven, hfdst. Sam. 14:27] te dezer tijd gestorven waren."},{"catchword":"hand","tekst":"Dat is, gedenktteken, of hand; dat is, zijn werk. Sommigen menen dat het een pilaar geweest is, alzo genoemd van de gedaante ener hand. Anders, plaats, of ruimte. Zie boven, vs.4. Vergelijk 1Sa 15:12."}],"19":[{"catchword":"recht gedaan heeft","tekst":"Dat is, recht doende verlost heeft. Alzo onder vs.31. Vergelijk de aantekeningen Jdg 2:16."}],"20":[{"catchword":"geen boodschapper zijn,","tekst":"Hebreeuws, geen man des boodschaps, of der tijding. Vergelijk boven, 2Sa 8:10."},{"catchword":"daarom dat des konings zoon dood is","tekst":"Hij wil zeggen: Gij zoudt een tijding brengen, die den koning niet aangenaam zou zijn. Anders, want het zou zijn van den doden zoon des konings."}],"21":[{"catchword":"Cuschi","tekst":"Of, den Moriaan, of Arabier, [zie Num 12:1 ] ; zijnde ook een van Davids knechten, gelijk af te nemen is uit vs.31. Dezen schijnt Joab verkoren te hebben omdat hij een vreemdeling was. Sommigen houden het voor een eigennaam."}],"22":[{"catchword":"Wat het ook zij,","tekst":"Of hij zeide: Het zij zo het wil, daar kome van wat er van kome. Alzo in vs.23. Het schijnt dat hij zich wat beters liet voorstaan dan Joab gezegd had."},{"catchword":"zoon","tekst":"Dat is, lieve jongeling, dien ik als een zoon bemin. Alzo plegen personen, die ouder en meerder zijn, de jongeren en minderen lieflijk aan te spreken. Zie Gen 43:29."},{"catchword":"bekwame boodschap hebt?","tekst":"Hebreeuws, vindende; dat is, genoegzaam, bekwaam, wel passende, voegende. Vergelijk Num 11:22. Anders, dewijl het u geen profijtelijke boodschap zou zijn, of, dewijl zij u niets aanbrengen zou; dat is, geen bodenloon of gunst, maar het contrarie. Of aldus: dewijl u toch geen goede boodschap voorkomt."}],"23":[{"catchword":"hij","tekst":",] Ahimaäz."},{"catchword":"hij tot hem","tekst":"Joab."}],"25":[{"catchword":"hij ging","tekst":"Ahimaäz, dien de wachter eerst zag. Hebreeuws, hij ging gaande."}],"28":[{"catchword":"Vrede","tekst":"Dat is, alles is wel, ik breng wat goeds, wil hij zeggen."},{"catchword":"Geloofd zij de HEERE,","tekst":"Hebreeuws, gezegend"},{"catchword":"overgegeven","tekst":"Of, besloten; te weten, in de hand van Davids volk. Alzo 1Sa 24:19, en 1Sa 26:8, en elders."}],"29":[{"catchword":"Is het wel","tekst":"Hebreeuws, heeft hij vrede? Alzo onder, vs.32."},{"catchword":"zeide","tekst":"Hebbende zich op Joabs redenen nader bedacht, verzwijgt hij de tijding van Absalom."},{"catchword":"rumoer,","tekst":"Of, een grote menigte"},{"catchword":"knecht des konings,","tekst":"Cuschi."}],"31":[{"catchword":"recht gedaan","tekst":"Gelijk boven, vs.19."}],"32":[{"catchword":"Is het wel","tekst":"Gelijk vs.29."}],"33":[{"catchword":"zeide hij alzo","tekst":"David heeft verscheidene oorzaken gehad om zich hartelijk te bedroeven over dit ongeval, inzonderheid wanneer hij, boven zijns zoons tijdelijken dood, mocht vrezen zijn eeuwigen ondergang."},{"catchword":"Och, dat ik,","tekst":"Hebreeuws, wie zal geven, of, wie gave dat, enz. Zie van zulk een manier van spreken in het wensen, Exo 16:3; Deu 5:29, enz."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"And David mustered the people, that were with him: And he set Commanders of thousand, and Commanders of hundreds over them."}],"2":[{"catchword":null,"tekst":"Moreover, David sent the people forth, a third part under the hand of Joab, and a third part under the hand of Abisai, the son of Zeruja, Joabs brother, [See above chap. 15.on v.19.] and a third part under the hand of Ithai, [see above chap.15.on ver.19.] the Gethite: And the King said unto people; I; I will surely go forth with you my self also."}],"3":[{"catchword":null,"tekst":"But the people said, Thou shalt not march forth; for if we should quite flee (away), they would not set the heart upon us, [i.e. Not care for it, be much troubled at it, make much ado about it; for they do not mind or regard us, but thy person onely] yea if the (one) half of us should die, they would not set the heart upon us; but (thou art) now as ten thousand of us: [i.e. thy person is of more concernment, then many thousands of us. Compare herewith the words of Achitophel, above chap.17.2, 3. Oth. Though (there were) ten thousand times more of us, according as we (are) now] so it will be now heither, for thee to be a succour to us [heb. for thee to help. or, succour: when we should be in a strait] out of the city. [viz. Mahanaim; as above chap.17.24, 27.]"}],"4":[{"catchword":null,"tekst":"Then said the King unto them; I will do that which is good in your eyes: [i.e. That which pleaseth you, or seemeth good unto you] now the King stood by the side of the gate; [or, on the place, between the two gates, below ver.24. Heb. Properly hand: but of such use of this word, see Deut.23.on verse 18. and else-where] and all the people marched forth by hundreds, and by thousands."}],"5":[{"catchword":null,"tekst":"And the King commanded Joab, and Abisai, and Ithai, saying; (Deal) me gently with the young-man, with Absalom: and all the people heard it, when the King charged all the Commanders concerning the matters of Absalom."}],"6":[{"catchword":null,"tekst":"So the people marched forth into the field, to meet Israel: [i.e. Absalom and his men, who are constantly called Israel in this place, in regard the far greater part of Israel were joined with him] and the battle happened by the wood of Ephraim. [this wood lay not far from Mahanaim, or the East-side of the Jordan, in Gilead, in the tribes of Gad; but received the name of Ephraims wood (as some conceive) from the defeat of Ephraim, in the time of Jephte the Gileadite: see Judg. 12.1 4, 5. The Land of Ephraim was on the West side of the Jordan, in the Land of Canaan.]"}],"7":[{"catchword":null,"tekst":"And the people of Israel were smitten there before the face of David&acirc;&euro;&trade;s servants; and there happened that day a great slaughter of twenty thousand. [Of the Israelites, which were smitten by David&acirc;&euro;&trade;s men.]"}],"8":[{"catchword":null,"tekst":"For the battle was there spread over all that Land: And the wood devoured more of the people that day, then the sword devoured. [i.e. Those that fled into the wood, or were driven thither, perished in the wood, entangling and wounding themselves in one bush or other, and falling into pits and bogs, perhaps also being rent of wild beasts, and dying of hunger and thirst. Heb. The wood multiplied, to devour, &c.]"}],"9":[{"catchword":null,"tekst":"Now Absalom met before the face of David&acirc;&euro;&trade;s servants; and Absalom rode upon a Mule, and when the Mule came under the thick [Heb. The thickness] boughs of a great Oak, his head was fastened to the Oak, [in regard his long hair (whereof above chap.14.26.) slipped about the thick bough s of the Oak, and caught hold thereon] (so) that he continued [Heb. was given] hanging between the heaven, and between the earth; and the Mule that was under him, went away."}],"10":[{"catchword":null,"tekst":"When a man saw that, then he certified Joab thereof, and said, Behold, I saw Absalom hanging on an Oak."}],"11":[{"catchword":null,"tekst":"Then said Joab unto the man that certified him thereof; Behold now, thou sawest it, why then didst thou not smite him there to the ground? seeing it (appertained) to me, to give thee ten silverlings, [see Gen.20.on v.16.] and a girdle."}],"12":[{"catchword":null,"tekst":"But that man said unto Joab; And though I might weigh a thousand silverlings on mine hands, [i.e. Being weighed unto me, received them in mine hands, or tell them] I would not lay mine hand on the Kings son; for the King charge thee, and Abisai, and Ithai, before our ears, saying; Beware, whoever (thou art) of [meaning, touching or hurting] the young man, of Absalom, [Heb. Properly keep thy self, consider, lay hold of, take it into consideration, look to it, (as we say) whosoever, to, or, toward the young man, to Absalom. The meaning is, whosoever, or he that hurteth him, him will I, &c. &acirc;&euro;&tilde;Tis an abrupt kind of speech or sentence, much in use even among us; or look to it, that no man hurt him. Oth. let every man consider the young man, Absalom.]"}],"13":[{"catchword":null,"tekst":"If I should have dealt falsly against mine (own) soul, yet nothing would be bid from the King: [i.e. If having slain Absalom, I should fasly deny it, yet it would not be hid from the King, and then should I go in danger of my life. oth. his soul, i.e. toward, or against Absaloms life or person] also thou thy self wouldest set thy self against (me). [i.e. thou wouldest forsake me, and stand aloof off, without helping me. Compare Psal.38.12. oth. oppose.]"}],"14":[{"catchword":null,"tekst":"Then said Joab, I will not tarry thus here with thee [Heb. Before thy face: as if he should say, &acirc;&euro;&tilde;Tis no time to stay long herewith you. I&acirc;&euro;&trade;ll do as I please] and he took three arrows, [meaning darts, javelins, small lances, or any such like sharp weapon, used in war in those times] and thrust them into Absloms heart, [i.e. into the midst of his body, about the heart; for it appeareth v.15. that he lived yet a while] where he was yet alive in the midst of the Oak. [Heb. in the heart of the Oak. See Deut.4.on v.11.]"}],"15":[{"catchword":null,"tekst":"And ten Lads, Joabs armour-bearers, compassed (him) about, and they smote Absalom, and killed him."}],"16":[{"catchword":null,"tekst":"Then Joab blew with the trumpet, and all the people turned away from pursuing after Israel: for Joab held the people back."}],"17":[{"catchword":null,"tekst":"And they took Absalom, and threw him into a great pit in the wood, and laid a very great heap of stones upon him: [An other kind of Monument, set up by Gods righteous judgment, then that which he had caused to be set up for himself in his life-time: see the following verse] and all Israel [viz. which had followed Absalom] fled every one to his tent. [i.e. dwelling place.]"}],"18":[{"catchword":null,"tekst":"Now Absalom in his life-time had taken, and reason up for himself a Pillar, which is in the kings dale; [See Gen 14:17.] for he said, I have no son, [hence appeareth that Absaloms sons (whereof mention was made above chap.14.27.) were dead at this time] to cause my name to be remembered: and he called that Pillar after his (own) name, therefore it is called unto this day, Absaloms hand. [i.e. Monument, or, hand; i.e. his work: some conceive that it was a Pillar, so called from the fashion of an hand. Tooth place, or, room: see above on v.4. compare 1 Sam.15.on v.12.]"}],"19":[{"catchword":null,"tekst":"Then said Ahimaaz, the son of Zadok; Let me, I pray thee, run, and ber the King tidings, that the LORD hath done him right, [i.e. Doing right, hath delivered him: so below v.31. compare the annotate. Judg.2.on v.16.] from his enemies hand."}],"20":[{"catchword":null,"tekst":"But Joab said unto him; Thou shalt be no bringer of tidings [Heb. No man of errand, or, tidings: compare above chap.8 on v.10.] this day, but thou shalt bear tidings another day: now this day thou shalt not bear tidings, because the Kings son is dead. [As if he should say, Thou wilt carry such news or tidings, which will not please the King. Oth. for it would be of the Kings dead son.]"}],"21":[{"catchword":null,"tekst":"And Joab said unto Cuschi; [Or, the Blackamore, or Arabian: (see Numb.12.on v.4.) being also one of David&acirc;&euro;&trade;s servants, as appeareth by v.29. Joab seemeth to have made choice of this man, because he was a stranger. Some conceive it to be a proper name] Go thy ways, and tell the King what thou hast seen; and Cuschi; bowed himself before Joab, and ran his ways."}],"22":[{"catchword":null,"tekst":"But Ahimaaz, the son of Zadok, proceeded yet on, and said unto Joab; What ever it be, [As if he should say, be it what it will: Let there issue from, what will issue: so in the following verse. It seemeth, that he imagined a better thing then Joab had said] let me, I pray thee, run also after Cuschi: and Joab said; Wherefore shouldest thou now run, my son, [i.e. good young man, whom I love, as my son. Thus persons that are elder and greater, are wont to speak in a loving and friendly way to the younger and meaner sort: see Gen.43.on v.29.] seeing thou hast no fit tidings. [Heb. finding tidings: i.e. pleasant, sit,well agreeing, suitable: compare Num 11:22. Oth.seeing it would be no profitable tidings for thee; or, seeing it would bring thee nothing in: i.e. no messengers reward or favour, but the contrary. Or thus: seeing no good tidings is offered unto thee, or, offers it self unto thee.]"}],"23":[{"catchword":null,"tekst":"Whatsoever it be, (said he) [viz. Ahimaaz] let me run my ways; then he [viz. Joab] said unto him, Run thy ways: and Ahimaaz ran the way of the plain field, and out went Cuschi."}],"24":[{"catchword":null,"tekst":"Now David sat between the two gates: And the Watch-man went up to the roof of the gate unto the Wall, and lift up his eyes, and behold, there ran a man alone."}],"25":[{"catchword":null,"tekst":"So the Watch-man cried, and told the King; and the King said; If he be alone, then there is tidings in his mouth: and he [viz. Ahimaaz, whom the Watch-man saw first] went on and drew near. [Heb. he went going.]"}],"26":[{"catchword":null,"tekst":"Then the Watch-man saw another man running, and the Watch-man cried to the Porter, and said, Behold there runneth (yet) a man alone: Then said the King, he is also abringer of tidings."}],"27":[{"catchword":null,"tekst":"Moreover, the Watch-man said; I spy the running of the foremost, as the running of Ahimaaz, the son of Zadok. Then said the King; That is a good man, and will come with good tidings."}],"28":[{"catchword":null,"tekst":"Then Ahimaaz called, and said unto the King, Peace, [i.e. All is well; as if he should say, I bring good news] and he bowed himself before the King with his face to the ground; and he said, Praise [Heb. blessed] be the LORD thy God, which hath delivered up [or, shut up, viz. in the hand of David&acirc;&euro;&trade;s men; so 1 Sam.24.19. & 26.8. and elsewhere] the men that lifted up their hand against my Lord the King."}],"29":[{"catchword":null,"tekst":"Then said the King; Is it well with the young man, with Absalom? [Heb. Hath be peace? So below v.32.] And Ahimaaz said; When Joab sent away the Kings servant, [viz. Cuschi] and (me) thy servant, I saw a great tumult [or, a great multitude] but I know not, what. [Having further considered of Joabs words, he concealeth the news concerning Absalom.]"}],"30":[{"catchword":null,"tekst":"And the King said, Turn aside, set thy self here: so be turned aside and stood still."}],"31":[{"catchword":null,"tekst":"And behold, Cuschi came, and Cuschi said; Tidings is come to my Lord the King; that the LORD hath done thee right, [as above v.19.] this day of the hand of all them that rose up against thee."}],"32":[{"catchword":null,"tekst":"Then said the King unto Cuschi; Is it well with the young man, with Absalom? [As ver.29.] and all that rise up against thee for evil, be as that young man."}],"33":[{"catchword":null,"tekst":"Then the King was much troubled, and went up to the upper room of the gate, and wept, and in his going he said thus; My son Absalom, my son, my son Absalom! O that I, I, had died for thee, [Heb. Who will give, or, O that any man would give, that, etc. See of such phrase or manner of speaking in wishing, Exod.16. on verse 3. Deut.5. on verse 29, &c.] Absalom my son, my son! [David had sundry causes or occasions to be heartily grieved for his mishap, especially when besides his sons temporal death, he might fear his eternal ruin and destruction.]"}]}}};

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
