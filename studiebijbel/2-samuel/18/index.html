lom</span>! <span class=\"wl\" data-l=\"L13\" data-code=\"H53\">Was</span> <span class=\"wl\" data-l=\"L14\" data-code=\"H589\">ik</span> maar, <span class=\"wl\" data-l=\"L15\" data-code=\"H8478\">was</span> <span class=\"wl\" data-l=\"L15\" data-code=\"H8478\">ik</span> maar in uw plaats <span class=\"wl\" data-l=\"L16\" data-code=\"H4191\">gestorven</span>, <span class=\"wl\" data-l=\"L17\" data-code=\"H53\">Absalom</span>, <span class=\"wl\" data-l=\"L17\" data-code=\"H53\">mijn</span> <span class=\"wl\" data-l=\"L18\" data-code=\"H1121\">zoon</span>, <span class=\"wl\" data-l=\"L18\" data-code=\"H1121\">mijn</span> <span class=\"wl\" data-l=\"L19\" data-code=\"H1121\">zoon</span>!"}, "koppeling_kjv": {"1": "And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H6485\">numbered</span> the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> that were with him, and <span class=\"wl wl-kjv\" data-code=\"H7760\">set</span> <span class=\"wl wl-kjv\" data-code=\"H8269\">captains</span> of <span class=\"wl wl-kjv\" data-code=\"H505\">thousands</span> and <span class=\"wl wl-kjv\" data-code=\"H8269\">captains</span> of <span class=\"wl wl-kjv\" data-code=\"H3967\">hundreds</span> over them.", "2": "And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> sent <span class=\"wl wl-kjv\" data-code=\"H7971\">forth</span> a third <span class=\"wl wl-kjv\" data-code=\"H7992\">part</span> of the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> under the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab,</span> and a third <span class=\"wl wl-kjv\" data-code=\"H7992\">part</span> under the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of <span class=\"wl wl-kjv\" data-code=\"H52\">Abishai</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H6870\">Zeruiah,</span> <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab's</span> <span class=\"wl wl-kjv\" data-code=\"H251\">brother,</span> and a third <span class=\"wl wl-kjv\" data-code=\"H7992\">part</span> under the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of <span class=\"wl wl-kjv\" data-code=\"H863\">Ittai</span> the <span class=\"wl wl-kjv\" data-code=\"H1663\">Gittite.</span> And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> I will <span class=\"wl wl-kjv\" data-code=\"H3318\">surely</span> go <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> with you <span class=\"wl wl-kjv\" data-code=\"H589\">myself</span> also.", "3": "But the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H559\">answered,</span> Thou shalt not go <span class=\"wl wl-kjv\" data-code=\"H3318\">forth:</span> for if we <span class=\"wl wl-kjv\" data-code=\"H5127\">flee</span> <span class=\"wl wl-kjv\" data-code=\"H5127\">away,</span> they will not <span class=\"wl wl-kjv\" data-code=\"H7760\">care</span> for us; neither if <span class=\"wl wl-kjv\" data-code=\"H2677\">half</span> of us <span class=\"wl wl-kjv\" data-code=\"H4191\">die,</span> will they <span class=\"wl wl-kjv\" data-code=\"H7760\">care</span> for us: but now thou art <span class=\"wl wl-kjv\" data-code=\"H3644\">worth</span> <span class=\"wl wl-kjv\" data-code=\"H6235\">ten</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> of us: therefore now it is <span class=\"wl wl-kjv\" data-code=\"H2896\">better</span> that thou <span class=\"wl wl-kjv\" data-code=\"H5826\">succour</span> us out of the <span class=\"wl wl-kjv\" data-code=\"H5892\">city.</span>", "4": "And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto them, What <span class=\"wl wl-kjv\" data-code=\"H5869\">seemeth</span> you <span class=\"wl wl-kjv\" data-code=\"H3190\">best</span> I will <span class=\"wl wl-kjv\" data-code=\"H6213\">do.</span> And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H5975\">stood</span> by the <span class=\"wl wl-kjv\" data-code=\"H8179\">gate</span> <span class=\"wl wl-kjv\" data-code=\"H3027\">side,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> came <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> by <span class=\"wl wl-kjv\" data-code=\"H3967\">hundreds</span> and by <span class=\"wl wl-kjv\" data-code=\"H505\">thousands.</span>", "5": "And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab</span> and <span class=\"wl wl-kjv\" data-code=\"H52\">Abishai</span> and <span class=\"wl wl-kjv\" data-code=\"H863\">Ittai,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Deal <span class=\"wl wl-kjv\" data-code=\"H328\">gently</span> for my sake with the young <span class=\"wl wl-kjv\" data-code=\"H5288\">man,</span> even with <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom.</span> And all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> when the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> gave all the <span class=\"wl wl-kjv\" data-code=\"H8269\">captains</span> <span class=\"wl wl-kjv\" data-code=\"H6680\">charge</span> <span class=\"wl wl-kjv\" data-code=\"H1697\">concerning</span> <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom.</span>", "6": "So the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> went <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> into the <span class=\"wl wl-kjv\" data-code=\"H7704\">field</span> <span class=\"wl wl-kjv\" data-code=\"H7125\">against</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel:</span> and the <span class=\"wl wl-kjv\" data-code=\"H4421\">battle</span> was in the <span class=\"wl wl-kjv\" data-code=\"H3293\">wood</span> of <span class=\"wl wl-kjv\" data-code=\"H669\">Ephraim;</span>", "7": "Where the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> were <span class=\"wl wl-kjv\" data-code=\"H5062\">slain</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> of <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> and there was there a <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H4046\">slaughter</span> that <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of <span class=\"wl wl-kjv\" data-code=\"H6242\">twenty</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> men.", "8": "For the <span class=\"wl wl-kjv\" data-code=\"H4421\">battle</span> was there <span class=\"wl wl-kjv\" data-code=\"H6327\">scattered</span> over the <span class=\"wl wl-kjv\" data-code=\"H6440\">face</span> of all the <span class=\"wl wl-kjv\" data-code=\"H776\">country:</span> and the <span class=\"wl wl-kjv\" data-code=\"H3293\">wood</span> <span class=\"wl wl-kjv\" data-code=\"H398\">devoured</span> <span class=\"wl wl-kjv\" data-code=\"H7235\">more</span> <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> that <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> than the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword</span> <span class=\"wl wl-kjv\" data-code=\"H398\">devoured.</span>", "9": "And <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom</span> <span class=\"wl wl-kjv\" data-code=\"H7122\">met</span> the <span class=\"wl wl-kjv\" data-code=\"H6440\">servants</span> of <span class=\"wl wl-kjv\" data-code=\"H1732\">David.</span> And <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom</span> <span class=\"wl wl-kjv\" data-code=\"H7392\">rode</span> upon a <span class=\"wl wl-kjv\" data-code=\"H6505\">mule,</span> and the <span class=\"wl wl-kjv\" data-code=\"H6505\">mule</span> <span class=\"wl wl-kjv\" data-code=\"H935\">went</span> under the thick <span class=\"wl wl-kjv\" data-code=\"H7730\">boughs</span> of a <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H424\">oak,</span> and his <span class=\"wl wl-kjv\" data-code=\"H7218\">head</span> caught <span class=\"wl wl-kjv\" data-code=\"H2388\">hold</span> of the <span class=\"wl wl-kjv\" data-code=\"H424\">oak,</span> and he was taken <span class=\"wl wl-kjv\" data-code=\"H5414\">up</span> between the <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven</span> and the <span class=\"wl wl-kjv\" data-code=\"H776\">earth;</span> and the <span class=\"wl wl-kjv\" data-code=\"H6505\">mule</span> that was under him went <span class=\"wl wl-kjv\" data-code=\"H5674\">away.</span>", "10": "And a <span class=\"wl wl-kjv\" data-code=\"H259\">certain</span> <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> it, and <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Behold, I <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom</span> <span class=\"wl wl-kjv\" data-code=\"H8518\">hanged</span> in an <span class=\"wl wl-kjv\" data-code=\"H424\">oak.</span>", "11": "And <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> that <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> him, And, behold, thou <span class=\"wl wl-kjv\" data-code=\"H7200\">sawest</span> him, and why didst thou not <span class=\"wl wl-kjv\" data-code=\"H5221\">smite</span> him there to the <span class=\"wl wl-kjv\" data-code=\"H776\">ground?</span> and I would have <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> thee <span class=\"wl wl-kjv\" data-code=\"H6235\">ten</span> shekels of <span class=\"wl wl-kjv\" data-code=\"H3701\">silver,</span> and <span class=\"wl wl-kjv\" data-code=\"H259\">a</span> <span class=\"wl wl-kjv\" data-code=\"H2290\">girdle.</span>", "12": "And the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab,</span> <span class=\"wl wl-kjv\" data-code=\"H3863\">Though</span> I should <span class=\"wl wl-kjv\" data-code=\"H8254\">receive</span> a <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> shekels of <span class=\"wl wl-kjv\" data-code=\"H3701\">silver</span> in mine <span class=\"wl wl-kjv\" data-code=\"H3709\">hand,</span> yet would I not put <span class=\"wl wl-kjv\" data-code=\"H7971\">forth</span> mine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> against the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">son:</span> for in our <span class=\"wl wl-kjv\" data-code=\"H241\">hearing</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H6680\">charged</span> thee and <span class=\"wl wl-kjv\" data-code=\"H52\">Abishai</span> and <span class=\"wl wl-kjv\" data-code=\"H863\">Ittai,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H8104\">Beware</span> that none touch the young <span class=\"wl wl-kjv\" data-code=\"H5288\">man</span> <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom.</span>", "13": "<span class=\"wl wl-kjv\" data-code=\"H176\">Otherwise</span> I should have <span class=\"wl wl-kjv\" data-code=\"H6213\">wrought</span> <span class=\"wl wl-kjv\" data-code=\"H8267\">falsehood</span> against mine own <span class=\"wl wl-kjv\" data-code=\"H5315\">life:</span> for there is no <span class=\"wl wl-kjv\" data-code=\"H1697\">matter</span> <span class=\"wl wl-kjv\" data-code=\"H3582\">hid</span> from the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> and thou thyself wouldest have <span class=\"wl wl-kjv\" data-code=\"H3320\">set</span> thyself against me.", "14": "Then <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab,</span> I may not <span class=\"wl wl-kjv\" data-code=\"H3176\">tarry</span> thus with <span class=\"wl wl-kjv\" data-code=\"H6440\">thee.</span> And he <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H7626\">darts</span> in his <span class=\"wl wl-kjv\" data-code=\"H3709\">hand,</span> and <span class=\"wl wl-kjv\" data-code=\"H8628\">thrust</span> them through the <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> of <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom,</span> while he was yet <span class=\"wl wl-kjv\" data-code=\"H2416\">alive</span> in the midst of the <span class=\"wl wl-kjv\" data-code=\"H424\">oak.</span>", "15": "And <span class=\"wl wl-kjv\" data-code=\"H6235\">ten</span> young <span class=\"wl wl-kjv\" data-code=\"H5288\">men</span> that <span class=\"wl wl-kjv\" data-code=\"H5375\">bare</span> <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab's</span> <span class=\"wl wl-kjv\" data-code=\"H3627\">armour</span> compassed <span class=\"wl wl-kjv\" data-code=\"H5437\">about</span> and <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom,</span> and <span class=\"wl wl-kjv\" data-code=\"H4191\">slew</span> him.", "16": "And <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab</span> <span class=\"wl wl-kjv\" data-code=\"H8628\">blew</span> the <span class=\"wl wl-kjv\" data-code=\"H7782\">trumpet,</span> and the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">returned</span> from <span class=\"wl wl-kjv\" data-code=\"H7291\">pursuing</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel:</span> for <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab</span> held <span class=\"wl wl-kjv\" data-code=\"H2820\">back</span> the <span class=\"wl wl-kjv\" data-code=\"H5971\">people.</span>", "17": "And they <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom,</span> and <span class=\"wl wl-kjv\" data-code=\"H7993\">cast</span> him into a <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H6354\">pit</span> in the <span class=\"wl wl-kjv\" data-code=\"H3293\">wood,</span> and <span class=\"wl wl-kjv\" data-code=\"H5324\">laid</span> a <span class=\"wl wl-kjv\" data-code=\"H3966\">very</span> <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H1530\">heap</span> of <span class=\"wl wl-kjv\" data-code=\"H68\">stones</span> upon him: and all <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H5127\">fled</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">one</span> to his <span class=\"wl wl-kjv\" data-code=\"H168\">tent.</span>", "18": "Now <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom</span> in his <span class=\"wl wl-kjv\" data-code=\"H2416\">lifetime</span> had <span class=\"wl wl-kjv\" data-code=\"H3947\">taken</span> and reared <span class=\"wl wl-kjv\" data-code=\"H5324\">up</span> for himself a <span class=\"wl wl-kjv\" data-code=\"H4678\">pillar,</span> which is in the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H6010\">dale:</span> for he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> I have no <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> to keep my <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> in <span class=\"wl wl-kjv\" data-code=\"H2142\">remembrance:</span> and he <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> the <span class=\"wl wl-kjv\" data-code=\"H4678\">pillar</span> after his own <span class=\"wl wl-kjv\" data-code=\"H8034\">name:</span> and it is <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> unto this <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom's</span> <span class=\"wl wl-kjv\" data-code=\"H3027\">place.</span>", "19": "Then <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> <span class=\"wl wl-kjv\" data-code=\"H290\">Ahimaaz</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H6659\">Zadok,</span> Let me now <span class=\"wl wl-kjv\" data-code=\"H7323\">run,</span> and <span class=\"wl wl-kjv\" data-code=\"H1319\">bear</span> ➔ the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H1319\">tidings,</span> how that the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H8199\">avenged</span> him of his <span class=\"wl wl-kjv\" data-code=\"H3027\">enemies.</span>", "20": "And <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, <span class=\"wl wl-kjv\" data-code=\"H376\">Thou</span> shalt not bear <span class=\"wl wl-kjv\" data-code=\"H1309\">tidings</span> this <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> but thou shalt bear <span class=\"wl wl-kjv\" data-code=\"H1319\">tidings</span> <span class=\"wl wl-kjv\" data-code=\"H312\">another</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day:</span> but this <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> thou shalt bear no <span class=\"wl wl-kjv\" data-code=\"H1319\">tidings,</span> because the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> is <span class=\"wl wl-kjv\" data-code=\"H4191\">dead.</span>", "21": "Then <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab</span> to <span class=\"wl wl-kjv\" data-code=\"H3569\">Cushi,</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">Go</span> <span class=\"wl wl-kjv\" data-code=\"H5046\">tell</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> what thou hast <span class=\"wl wl-kjv\" data-code=\"H7200\">seen.</span> And <span class=\"wl wl-kjv\" data-code=\"H3569\">Cushi</span> <span class=\"wl wl-kjv\" data-code=\"H7812\">bowed</span> himself unto <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab,</span> and <span class=\"wl wl-kjv\" data-code=\"H7323\">ran.</span>", "22": "Then <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> <span class=\"wl wl-kjv\" data-code=\"H290\">Ahimaaz</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H6659\">Zadok</span> yet <span class=\"wl wl-kjv\" data-code=\"H3254\">again</span> to <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab,</span> But <span class=\"wl wl-kjv\" data-code=\"H4100\">howsoever,</span> let me, I pray thee, also <span class=\"wl wl-kjv\" data-code=\"H7323\">run</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> <span class=\"wl wl-kjv\" data-code=\"H3569\">Cushi.</span> And <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Wherefore wilt thou <span class=\"wl wl-kjv\" data-code=\"H7323\">run,</span> my <span class=\"wl wl-kjv\" data-code=\"H1121\">son,</span> seeing that thou hast no <span class=\"wl wl-kjv\" data-code=\"H1309\">tidings</span> <span class=\"wl wl-kjv\" data-code=\"H4672\">ready?</span>", "23": "But howsoever, said he, let me <span class=\"wl wl-kjv\" data-code=\"H7323\">run.</span> And he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, <span class=\"wl wl-kjv\" data-code=\"H7323\">Run.</span> Then <span class=\"wl wl-kjv\" data-code=\"H290\">Ahimaaz</span> <span class=\"wl wl-kjv\" data-code=\"H7323\">ran</span> by the <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> of the <span class=\"wl wl-kjv\" data-code=\"H3603\">plain,</span> and <span class=\"wl wl-kjv\" data-code=\"H5674\">overran</span> <span class=\"wl wl-kjv\" data-code=\"H3569\">Cushi.</span>", "24": "And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H3427\">sat</span> between the <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H8179\">gates:</span> and the <span class=\"wl wl-kjv\" data-code=\"H6822\">watchman</span> went <span class=\"wl wl-kjv\" data-code=\"H3212\">up</span> to the <span class=\"wl wl-kjv\" data-code=\"H1406\">roof</span> over the <span class=\"wl wl-kjv\" data-code=\"H8179\">gate</span> unto the <span class=\"wl wl-kjv\" data-code=\"H2346\">wall,</span> and lifted <span class=\"wl wl-kjv\" data-code=\"H5375\">up</span> his <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes,</span> and <span class=\"wl wl-kjv\" data-code=\"H7200\">looked,</span> and behold a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> <span class=\"wl wl-kjv\" data-code=\"H7323\">running</span> alone.", "25": "And the <span class=\"wl wl-kjv\" data-code=\"H6822\">watchman</span> <span class=\"wl wl-kjv\" data-code=\"H7121\">cried,</span> and <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king.</span> And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> If he be alone, there is <span class=\"wl wl-kjv\" data-code=\"H1309\">tidings</span> in his <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth.</span> And he <span class=\"wl wl-kjv\" data-code=\"H3212\">came</span> <span class=\"wl wl-kjv\" data-code=\"H1980\">apace,</span> and drew <span class=\"wl wl-kjv\" data-code=\"H7131\">near.</span>", "26": "And the <span class=\"wl wl-kjv\" data-code=\"H6822\">watchman</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> <span class=\"wl wl-kjv\" data-code=\"H312\">another</span> <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> <span class=\"wl wl-kjv\" data-code=\"H7323\">running:</span> and the <span class=\"wl wl-kjv\" data-code=\"H6822\">watchman</span> <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> unto the <span class=\"wl wl-kjv\" data-code=\"H7778\">porter,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Behold another <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> <span class=\"wl wl-kjv\" data-code=\"H7323\">running</span> alone. And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> He also bringeth <span class=\"wl wl-kjv\" data-code=\"H1319\">tidings.</span>", "27": "And the <span class=\"wl wl-kjv\" data-code=\"H6822\">watchman</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Me <span class=\"wl wl-kjv\" data-code=\"H7200\">thinketh</span> the <span class=\"wl wl-kjv\" data-code=\"H4794\">running</span> of the <span class=\"wl wl-kjv\" data-code=\"H7223\">foremost</span> is like the <span class=\"wl wl-kjv\" data-code=\"H4794\">running</span> of <span class=\"wl wl-kjv\" data-code=\"H290\">Ahimaaz</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H6659\">Zadok.</span> And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> He is a <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> <span class=\"wl wl-kjv\" data-code=\"H376\">man,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">cometh</span> with <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> <span class=\"wl wl-kjv\" data-code=\"H1309\">tidings.</span>", "28": "And <span class=\"wl wl-kjv\" data-code=\"H290\">Ahimaaz</span> <span class=\"wl wl-kjv\" data-code=\"H7121\">called,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> All is <span class=\"wl wl-kjv\" data-code=\"H7965\">well.</span> And he fell <span class=\"wl wl-kjv\" data-code=\"H7812\">down</span> to the <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> upon his <span class=\"wl wl-kjv\" data-code=\"H639\">face</span> before the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H1288\">Blessed</span> be the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> which hath delivered <span class=\"wl wl-kjv\" data-code=\"H5462\">up</span> the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> that lifted <span class=\"wl wl-kjv\" data-code=\"H5375\">up</span> their <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> against my <span class=\"wl wl-kjv\" data-code=\"H113\">lord</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king.</span>", "29": "And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Is the young <span class=\"wl wl-kjv\" data-code=\"H5288\">man</span> <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom</span> <span class=\"wl wl-kjv\" data-code=\"H7965\">safe?</span> And <span class=\"wl wl-kjv\" data-code=\"H290\">Ahimaaz</span> <span class=\"wl wl-kjv\" data-code=\"H559\">answered,</span> When <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H5650\">servant,</span> and me thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant,</span> I <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> a <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H1995\">tumult,</span> but I <span class=\"wl wl-kjv\" data-code=\"H3045\">knew</span> not what it was.", "30": "And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, Turn <span class=\"wl wl-kjv\" data-code=\"H5437\">aside,</span> and <span class=\"wl wl-kjv\" data-code=\"H3320\">stand</span> <span class=\"wl wl-kjv\" data-code=\"H3541\">here.</span> And he turned <span class=\"wl wl-kjv\" data-code=\"H5437\">aside,</span> and stood <span class=\"wl wl-kjv\" data-code=\"H5975\">still.</span>", "31": "And, behold, <span class=\"wl wl-kjv\" data-code=\"H3569\">Cushi</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came;</span> and <span class=\"wl wl-kjv\" data-code=\"H3569\">Cushi</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H1319\">Tidings,</span> my <span class=\"wl wl-kjv\" data-code=\"H113\">lord</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king:</span> for the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H8199\">avenged</span> thee this <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of all <span class=\"wl wl-kjv\" data-code=\"H3027\">them</span> that rose <span class=\"wl wl-kjv\" data-code=\"H6965\">up</span> against thee.", "32": "And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H3569\">Cushi,</span> Is the young <span class=\"wl wl-kjv\" data-code=\"H5288\">man</span> <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom</span> <span class=\"wl wl-kjv\" data-code=\"H7965\">safe?</span> And <span class=\"wl wl-kjv\" data-code=\"H3569\">Cushi</span> <span class=\"wl wl-kjv\" data-code=\"H559\">answered,</span> The <span class=\"wl wl-kjv\" data-code=\"H341\">enemies</span> of my <span class=\"wl wl-kjv\" data-code=\"H113\">lord</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> and all that <span class=\"wl wl-kjv\" data-code=\"H6965\">rise</span> against thee to do thee <span class=\"wl wl-kjv\" data-code=\"H7451\">hurt,</span> be as that young <span class=\"wl wl-kjv\" data-code=\"H5288\">man</span> is.", "33": "And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> was much <span class=\"wl wl-kjv\" data-code=\"H7264\">moved,</span> and went <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> to the <span class=\"wl wl-kjv\" data-code=\"H5944\">chamber</span> over the <span class=\"wl wl-kjv\" data-code=\"H8179\">gate,</span> and <span class=\"wl wl-kjv\" data-code=\"H1058\">wept:</span> and as he <span class=\"wl wl-kjv\" data-code=\"H3212\">went,</span> thus he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> O my <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom,</span> my <span class=\"wl wl-kjv\" data-code=\"H1121\">son,</span> my <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom!</span> would God I had <span class=\"wl wl-kjv\" data-code=\"H4191\">died</span> for <span class=\"wl wl-kjv\" data-code=\"H5414\">thee,</span> O <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom,</span> my <span class=\"wl wl-kjv\" data-code=\"H1121\">son,</span> my <span class=\"wl wl-kjv\" data-code=\"H1121\">son!</span>"}};

const nummers = Object.keys(D.vertalingen.SVnu);

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    const heeftB = D.koppeling && D.koppeling[n];
    const heeftK = D.koppeling_kjv && D.koppeling_kjv[n];
    let h = '<div class="verg-kop">Grondwoorden</div>';
    if (!heeftB && !heeftK) {
      h += '<em>Nog geen woordkoppeling voor dit vers.</em>';
    } else {
      if (heeftB) h += `<div class="tsk-kop">SVnu</div>` +
        `<div class="gw-tekst" style="font-family:Georgia,serif;line-height:1.8">${D.koppeling[n]}</div>` +
        `<div class="gw-detail" style="margin-top:.5rem"></div>`;
      if (heeftK) h += `<div class="tsk-kop" style="margin-top:.9rem">KJV</div>` +
        `<div class="gw-tekst" style="font-family:Georgia,serif;line-height:1.8">${D.koppeling_kjv[n]}</div>` +
        `<div class="gw-detail" style="margin-top:.5rem"></div>`;
      h += '<div class="bronregel">Klik op een onderstreept woord voor de vindplaatsen.</div>';
    }
    h += '<div class="verg-kop" style="margin-top:1.4rem">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const berea = D.tsk[n], engels = D.tsk_kjv[n];
    if ((!berea || !berea.length) && (!engels || !engels.length)) return '<em>Geen verwijzingen bij dit vers.</em>';
    let h = '';
    if (berea && berea.length) {
      h += '<div class="tsk-kop">Treasury of Scripture Knowledge | SVnu</div>';
      h += berea.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r}">${r}</a>`).join('') + '</div>').join('');
    }
    if (engels && engels.length) {
      h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.tsk[n] && D.tsk[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vergelijk</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een vers: snel wisselen van vertaling ---------- */
(function () {
  const menu = document.createElement('div');
  menu.id = 'vertmenu';
  menu.style.cssText = 'position:absolute;display:none;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.3rem;font-family:sans-serif;font-size:.85rem;z-index:30;min-width:7rem;';
  document.body.appendChild(menu);
  function toon(x, y) {
    menu.innerHTML = Object.keys(D.vertalingen).map(naam =>
      `<div class="vm-optie" data-v="${naam}" style="padding:.35rem .6rem;border-radius:5px;cursor:pointer;${naam === vertaling ? 'font-weight:700;color:var(--accent-donker)' : ''}">${naam}</div>`
    ).join('');
    const breedte = document.documentElement.clientWidth;
    menu.style.left = Math.max(4, Math.min(x, breedte - 130)) + 'px';
    menu.style.top = y + 'px';
    menu.style.display = 'block';
  }
  document.addEventListener('contextmenu', e => {
    const rij = e.target.closest('.vers');
    if (!rij) return;
    e.preventDefault();
    toon(e.pageX, e.pageY);
  });
  menu.addEventListener('mouseover', e => {
    const o = e.target.closest('.vm-optie');
    if (o) o.style.background = 'var(--bg-soft)';
  });
  menu.addEventListener('mouseout', e => {
    const o = e.target.closest('.vm-optie');
    if (o) o.style.background = '';
  });
  menu.addEventListener('click', e => {
    const o = e.target.closest('.vm-optie');
    if (!o) return;
    vertaling = o.dataset.v;
    const kies = document.getElementById('vertaalkies');
    if (kies) kies.value = vertaling;
    bouwRijen();
    menu.style.display = 'none';
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#vertmenu')) menu.style.display = 'none';
  });
  document.addEventListener('scroll', () => { menu.style.display = 'none'; }, true);
})();
</script>
