 dood, levend als weduwen.","4":"Verder zei de koning tegen Amasa: Roep mij de mannen van Juda samen, tegen de derde dag; en u, stel u dan hier op.","5":"En Amasa ging heen om Juda bijeen te roepen; maar hij bleef langer weg dan de gezette tijd die hij hem gezet had.","6":"Toen zei David tegen Abisai: Nu zal Seba, de zoon van Bichri, ons meer kwaad doen dan Absalom; neem u de knechten van uw heer, en jaag hem achterna, opdat hij niet misschien vaste steden voor zich vindt, en zich aan onze ogen onttrekt.","7":"Toen trokken uit, hem achterna, de mannen van Joab, en de Krethi, en de Plethi, en al de helden. Dezen trokken uit van Jeruzalem, om Seba, de zoon van Bichri, achterna te jagen.","8":"Toen zij nu bij de grote steen waren, die bij Gibeon is, kwam Amasa voor hun aangezicht. En Joab had zijn kleed omgord, dat hij aan had, en daarop was een gordel, waaraan het zwaard vastgemaakt was op zijn heupen in zijn schede; en toen hij vooruitging, viel het eruit.","9":"En Joab zei tegen Amasa: Is het goed met u, mijn broeder? En Joab pakte met de rechterhand de baard van Amasa, om hem te kussen.","10":"En Amasa lette niet op het zwaard dat in Joabs hand was; zo sloeg hij hem daarmee aan de vijfde rib, en hij stortte zijn ingewanden op de aarde uit, en hij sloeg hem niet ten tweeden male, en hij stierf. Toen jaagden Joab en zijn broeder Abisai Seba, de zoon van Bichri, achterna.","11":"Maar een man, van Joabs jongens, bleef bij hem staan, en hij zei: Wie er lust in heeft in Joab, en wie er voor David is, die volgt Joab na!","12":"Amasa nu lag in het bloed gewenteld, midden op de straat. Toen die man zag dat al het volk stil bleef staan, bracht hij Amasa weg van de straat naar het veld, en wierp een kleed op hem, omdat hij zag dat ieder die bij hem kwam, bleef staan.","13":"Nadat hij van de straat weggehaald was, trok alle man verder, Joab na, om Seba, de zoon van Bichri, achterna te jagen.","14":"En hij trok door alle stammen van Israël, naar Abel, dat is Beth-Maächa, en het hele Berim; en zij verzamelden zich, en kwamen hem ook na.","15":"En zij kwamen en belegerden hem in Abel Beth-Maächa, en zij wierpen een wal op tegen de stad, zodat hij tegen de buitenmuur stond; en al het volk dat met Joab was, beschadigde de muur, om die neer te vellen.","16":"Toen riep een wijze vrouw uit de stad: Hoort, hoort, zeg toch tegen Joab: Kom hierheen, dat ik tot u spreek.","17":"Toen hij nu tot haar naderde, zei de vrouw: Bent u Joab? En hij zei: Ik ben het; en zij zei tegen hem: Hoor de woorden van uw dienstmaagd; en hij zei: Ik luister.","18":"Toen sprak zij, en zei: In vroeger tijden spraken zij gewoonlijk, en zeiden: Zij zullen zeker te Abel vragen; en zo maakten zij de zaak af.","19":"Ik ben een van de vreedzamen, van de getrouwen in Israël, en u zoekt een stad te doden, die een moeder is in Israël; waarom zou u het erfdeel van de HEERE verslinden?","20":"Toen antwoordde Joab, en zei: Het zij verre, het zij verre van mij, dat ik zou verslinden, en dat ik zou verderven!","21":"De zaak is niet zo; maar een man van het gebergte van Efraïm, wiens naam Seba is, de zoon van Bichri, heeft zijn hand opgeheven tegen de koning, tegen David; lever hem alleen uit, dan zal ik van deze stad aftrekken. Toen zei de vrouw tegen Joab: Zie, zijn hoofd zal naar u toe over de muur geworpen worden.","22":"En de vrouw kwam bij al het volk, met haar wijsheid; en zij hieuwen Seba, de zoon van Bichri, het hoofd af, en wierpen het naar Joab. Toen blies hij op de bazuin, en zij verstrooiden zich van de stad, ieder naar zijn tenten; en Joab keerde terug naar Jeruzalem tot de koning.","23":"Joab nu was over het hele leger van Israël; en Benaja, de zoon van Jojada, over de Krethi en over de Plethi;","24":"En Adoram was over de schatting; en Josafat, de zoon van Ahilud, was kanselier;","25":"En Seja was schrijver; en Zadok en Abjathar waren priesters.","26":"En ook was Ira, de Jaïriet, Davids opperofficier."},"SV":{"1":"Toen was daar bij geval een Belials man, wiens naam was Seba, een zoon van Bichri, een man van Jemini; die blies met de bazuin, en zeide: Wij hebben geen deel aan David, en wij hebben geen erfenis aan den zoon van Isaï, een iegelijk naar zijn tenten, o Israël!","2":"Toen toog alle man van Israël op van achter David, Seba, den zoon van Bichri, achterna; maar de mannen van Juda kleefden hun koning aan, van de Jordaan af tot aan Jeruzalem.","3":"Toen nu David in zijn huis te Jeruzalem kwam, nam de koning de tien vrouwen, *zijn* bijwijven, die hij gelaten had, om het huis te bewaren, en deed ze in een huis van bewaring, en onderhield ze, maar ging tot haar niet in. En zij waren opgesloten tot op den dag van haarlieder dood, levende als weduwen.","4":"Voorts zeide de koning tot Amasa: Roep mij de mannen van Juda te zamen, tegen den derden dag; en gij, stel u *dan* hier.","5":"En Amasa ging heen, om Juda bijeen te roepen; maar hij bleef achter , boven den gezetten tijd, dien hij hem gezet had.","6":"Toen zeide David tot Abisai: Nu zal ons Seba, de zoon van Bichri, meer kwaads doen, dan Absalom; neem gij de knechten uws heren, en jaag hem achterna, opdat hij niet misschien vaste steden voor zich vinde, en zich aan onze ogen onttrekke.","7":"Toen togen uit, hem achterna, de mannen van Joab, en de Krethi, en de Plethi, en al de helden. Dezen togen uit van Jeruzalem, om Seba, den zoon van Bichri, achterna te jagen.","8":"Als zij nu waren bij den groten steen, die bij Gibeon is, zo kwam Amasa voor hun aangezicht. En Joab was omgord over zijn kleed, dat hij aan had, en daarop was een gordel, daar het zwaard aan vastgemaakt was op zijn lenden in zijn schede; en als hij voortging, zo viel het uit.","9":"En Joab zeide tot Amasa: Is het wel met u, mijn broeder? En Joab vatte met de rechterhand den baard van Amasa, om hem te kussen.","10":"En Amasa hoedde zich niet voor het zwaard, dat in Joabs hand was; zo sloeg hij hem daarmede aan de vijfde rib, en hij stortte zijn ingewand ter aarde uit, en hij sloeg hem niet ten tweeden male, en hij stierf. Toen jaagden Joab en zijn broeder Abisai, Seba, den zoon van Bichri, achterna.","11":"Maar een man, van Joabs jongens, bleef bij hem staan, en hij zeide: Wie is er, die lust heeft aan Joab, en wie is er, die voor David is, die volge Joab na!","12":"Amasa nu lag in het bloed gewenteld, midden op de straat. Als die man zag, dat al het volk staan bleef, zo deed hij Amasa weg van de straat in het veld, en wierp een kleed op hem, dewijl hij zag, dat al wie bij hem kwam, bleef staan.","13":"Toen hij nu van de straat weggenomen was, toog alle man voort, Joab na, om Seba, den zoon van Bichri, achterna te jagen.","14":"En hij toog heen door alle stammen van Israël, naar Abel, te weten, Beth-maacha, en het ganse Berim; en zij verzamelden zich , en kwamen hem ook na.","15":"En zij kwamen en belegerden hem in Abel Beth-maacha, en zij wierpen een wal op tegen de stad, dat hij aan den buitenmuur stond; en al het volk, dat met Joab was, verdorven den muur, om dien neder te vellen.","16":"Toen riep een wijze vrouw uit de stad: Hoort, hoort, zegt toch tot Joab: Nader tot hiertoe, dat ik tot u spreke.","17":"Toen hij nu tot haar naderde, zeide de vrouw: Zijt gij Joab? En hij zeide: Ik ben het; en zij zeide tot hem: Hoor de woorden uwer dienstmaagd; en hij zeide: Ik hoor.","18":"Toen sprak zij, zeggende: In voortijden spraken zij gemeenlijk, zeggende: Zij zullen zonder twijfel te Abel vragen; en alzo volbrachten zij het.","19":"Ik ben een van de vreedzamen, van de getrouwen in Israël, en gij zoekt te doden een stad, die een moeder is in Israël; waarom zoudt gij het erfdeel des HEEREN verslinden?","20":"Toen antwoordde Joab, en zeide: Het zij verre, het zij verre van mij, dat ik zou verslinden, en dat ik zou verderven!","21":"De zaak is niet alzo; maar een man van het gebergte van Efraïm, wiens naam is Seba, de zoon van Bichri, heeft zijn hand opgeheven tegen den koning, tegen David; lever hem alleen, zo zal ik van deze stad aftrekken. Toen zeide de vrouw tot Joab: Zie, zijn hoofd zal tot u over den muur geworpen worden.","22":"En de vrouw kwam in tot al het volk, met haar wijsheid; en zij hieuwen Seba, den zoon van Bichri, het hoofd af, en wierpen het tot Joab. Toen blies hij met de bazuin, en zij verstrooiden zich van de stad, een iegelijk naar zijn tenten; en Joab keerde weder naar Jeruzalem tot den koning.","23":"Joab nu was over het ganse heir van Israël; en Benaja, de zoon van Jojada, over de Krethi en over de Plethi;","24":"En Adoram was over de schatting; en Josafat, de zoon van Ahilud, was kanselier;","25":"En Seja was schrijver; en Zadok en Abjathar waren priesters.","26":"En ook was Ira, de Jaïriet, Davids opperofficier."},"KJV":{"1":"And there happened to be there a man of Belial, whose name was Sheba, the son of Bichri, a Benjamite: and he blew a trumpet, and said, We have no part in David, neither have we inheritance in the son of Jesse: every man to his tents, O Israel.","2":"So every man of Israel went up from after David, and followed Sheba the son of Bichri: but the men of Judah clave unto their king, from Jordan even to Jerusalem.","3":"And David came to his house at Jerusalem; and the king took the ten women his concubines, whom he had left to keep the house, and put them in ward, and fed them, but went not in unto them. So they were shut up unto the day of their death, living in widowhood.","4":"Then said the king to Amasa, Assemble me the men of Judah within three days, and be thou here present.","5":"So Amasa went to assemble the men of Judah: but he tarried longer than the set time which he had appointed him.","6":"And David said to Abishai, Now shall Sheba the son of Bichri do us more harm than did Absalom: take thou thy lord's servants, and pursue after him, lest he get him fenced cities, and escape us.","7":"And there went out after him Joab's men, and the Cherethites, and the Pelethites, and all the mighty men: and they went out of Jerusalem, to pursue after Sheba the son of Bichri.","8":"When they were at the great stone which is in Gibeon, Amasa went before them. And Joab's garment that he had put on was girded unto him, and upon it a girdle with a sword fastened upon his loins in the sheath thereof; and as he went forth it fell out.","9":"And Joab said to Amasa, Art thou in health, my brother? And Joab took Amasa by the beard with the right hand to kiss him.","10":"But Amasa took no heed to the sword that was in Joab's hand: so he smote him therewith in the fifth rib, and shed out his bowels to the ground, and struck him not again; and he died. So Joab and Abishai his brother pursued after Sheba the son of Bichri.","11":"And one of Joab's men stood by him, and said, He that favoureth Joab, and he that is for David, let him go after Joab.","12":"And Amasa wallowed in blood in the midst of the highway. And when the man saw that all the people stood still, he removed Amasa out of the highway into the field, and cast a cloth upon him, when he saw that every one that came by him stood still.","13":"When he was removed out of the highway, all the people went on after Joab, to pursue after Sheba the son of Bichri.","14":"And he went through all the tribes of Israel unto Abel, and to Bethmaachah, and all the Berites: and they were gathered together, and went also after him.","15":"And they came and besieged him in Abel of Bethmaachah, and they cast up a bank against the city, and it stood in the trench: and all the people that were with Joab battered the wall, to throw it down.","16":"Then cried a wise woman out of the city, Hear, hear; say, I pray you, unto Joab, Come near hither, that I may speak with thee.","17":"And when he was come near unto her, the woman said, Art thou Joab? And he answered, I am he. Then she said unto him, Hear the words of thine handmaid. And he answered, I do hear.","18":"Then she spake, saying, They were wont to speak in old time, saying, They shall surely ask counsel at Abel: and so they ended the matter.","19":"I am one of them that are peaceable and faithful in Israel: thou seekest to destroy a city and a mother in Israel: why wilt thou swallow up the inheritance of the LORD?","20":"And Joab answered and said, Far be it, far be it from me, that I should swallow up or destroy.","21":"The matter is not so: but a man of mount Ephraim, Sheba the son of Bichri by name, hath lifted up his hand against the king, even against David: deliver him only, and I will depart from the city. And the woman said unto Joab, Behold, his head shall be thrown to thee over the wall.","22":"Then the woman went unto all the people in her wisdom. And they cut off the head of Sheba the son of Bichri, and cast it out to Joab. And he blew a trumpet, and they retired from the city, every man to his tent. And Joab returned to Jerusalem unto the king.","23":"Now Joab was over all the host of Israel: and Benaiah the son of Jehoiada was over the Cherethites and over the Pelethites:","24":"And Adoram was over the tribute: and Jehoshaphat the son of Ahilud was recorder:","25":"And Sheva was scribe: and Zadok and Abiathar were the priests:","26":"And Ira also the Jairite was a chief ruler about David."}},"tsk":{"1":[{"kopje":"Toen was daar","refs":["2 Sam 19:41-43","Ps 34:20"]},{"kopje":"een man","refs":["2 Sam 23:6","Deut 13:13","Richt 19:22","1 Sam 2:12","1 Sam 30:22","Ps 17:13","Spr 26:21","Hab 1:12","Hab 1:13"]},{"kopje":"blies","refs":["2 Sam 15:10","Richt 3:27","Spr 24:21","Spr 24:22","Spr 25:8"]},{"kopje":"Wij hebben","refs":["2 Sam 19:43","1 Kon 12:16","2 Kron 10:6","Luk 19:14","Luk 19:27"]}],"2":[{"kopje":"alle man","refs":["2 Sam 19:41","Ps 62:10","Ps 118:8-10","Spr 17:14"]},{"kopje":"de mannen","refs":["Joh 6:66-68","Hand 11:23"]},{"kopje":"van de Jordaan af","refs":["2 Sam 19:15","2 Sam 19:40","2 Sam 19:41","2 Kron 10:17"]}],"3":[{"kopje":"tien vrouwen","refs":["2 Sam 15:16","2 Sam 16:21","2 Sam 16:22"]},{"kopje":"bewaring","refs":["Gen 40:3"]}],"4":[{"kopje":"Amasa","refs":["2 Sam 17:25","2 Sam 19:13","1 Kron 2:17"]}],"5":[{"kopje" ass=\"wl wl-kjv\" data-code=\"H309\">longer</span> than the set <span class=\"wl wl-kjv\" data-code=\"H4150\">time</span> which he had <span class=\"wl wl-kjv\" data-code=\"H3259\">appointed</span> him.","6":"And <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to <span class=\"wl wl-kjv\" data-code=\"H52\">Abishai,</span> Now shall <span class=\"wl wl-kjv\" data-code=\"H7652\">Sheba</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H1075\">Bichri</span> do us more <span class=\"wl wl-kjv\" data-code=\"H3415\">harm</span> than did <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom:</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> thou thy <span class=\"wl wl-kjv\" data-code=\"H113\">lord's</span> <span class=\"wl wl-kjv\" data-code=\"H5650\">servants,</span> and <span class=\"wl wl-kjv\" data-code=\"H7291\">pursue</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> him, lest he <span class=\"wl wl-kjv\" data-code=\"H4672\">get</span> him <span class=\"wl wl-kjv\" data-code=\"H1219\">fenced</span> <span class=\"wl wl-kjv\" data-code=\"H5892\">cities,</span> and <span class=\"wl wl-kjv\" data-code=\"H5337\">escape</span> <span class=\"wl wl-kjv\" data-code=\"H5869\">us.</span>","7":"And there went <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> him <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab's</span> <span class=\"wl wl-kjv\" data-code=\"H582\">men,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3774\">Cherethites,</span> and the <span class=\"wl wl-kjv\" data-code=\"H6432\">Pelethites,</span> and all the mighty <span class=\"wl wl-kjv\" data-code=\"H1368\">men:</span> and they went <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> of <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> to <span class=\"wl wl-kjv\" data-code=\"H7291\">pursue</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> <span class=\"wl wl-kjv\" data-code=\"H7652\">Sheba</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H1075\">Bichri.</span>","8":"When they were at the <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H68\">stone</span> which is in <span class=\"wl wl-kjv\" data-code=\"H1391\">Gibeon,</span> <span class=\"wl wl-kjv\" data-code=\"H6021\">Amasa</span> <span class=\"wl wl-kjv\" data-code=\"H935\">went</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> them. And <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab's</span> <span class=\"wl wl-kjv\" data-code=\"H4055\">garment</span> that he had put <span class=\"wl wl-kjv\" data-code=\"H3830\">on</span> was <span class=\"wl wl-kjv\" data-code=\"H2296\">girded</span> unto him, and upon it a <span class=\"wl wl-kjv\" data-code=\"H2289\">girdle</span> with a <span class=\"wl wl-kjv\" data-code=\"H2719\">sword</span> <span class=\"wl wl-kjv\" data-code=\"H6775\">fastened</span> upon his <span class=\"wl wl-kjv\" data-code=\"H4975\">loins</span> in the <span class=\"wl wl-kjv\" data-code=\"H8593\">sheath</span> thereof; and as he went <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> it fell <span class=\"wl wl-kjv\" data-code=\"H5307\">out.</span>","9":"And <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to <span class=\"wl wl-kjv\" data-code=\"H6021\">Amasa,</span> Art thou in <span class=\"wl wl-kjv\" data-code=\"H7965\">health,</span> my <span class=\"wl wl-kjv\" data-code=\"H251\">brother?</span> And <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab</span> <span class=\"wl wl-kjv\" data-code=\"H270\">took</span> <span class=\"wl wl-kjv\" data-code=\"H6021\">Amasa</span> by the <span class=\"wl wl-kjv\" data-code=\"H2206\">beard</span> with the <span class=\"wl wl-kjv\" data-code=\"H3225\">right</span> <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> to <span class=\"wl wl-kjv\" data-code=\"H5401\">kiss</span> him.","10":"But <span class=\"wl wl-kjv\" data-code=\"H6021\">Amasa</span> took no <span class=\"wl wl-kjv\" data-code=\"H8104\">heed</span> to the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword</span> that was in <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab's</span> <span class=\"wl wl-kjv\" data-code=\"H3027\">hand:</span> so he <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> him therewith in the <span class=\"wl wl-kjv\" data-code=\"H2570\">fifth</span> rib, and shed <span class=\"wl wl-kjv\" data-code=\"H8210\">out</span> his <span class=\"wl wl-kjv\" data-code=\"H4578\">bowels</span> to the <span class=\"wl wl-kjv\" data-code=\"H776\">ground,</span> and struck him not <span class=\"wl wl-kjv\" data-code=\"H8138\">again;</span> and he <span class=\"wl wl-kjv\" data-code=\"H4191\">died.</span> So <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab</span> and <span class=\"wl wl-kjv\" data-code=\"H52\">Abishai</span> his <span class=\"wl wl-kjv\" data-code=\"H251\">brother</span> <span class=\"wl wl-kjv\" data-code=\"H7291\">pursued</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> <span class=\"wl wl-kjv\" data-code=\"H7652\">Sheba</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H1075\">Bichri.</span>","11":"And <span class=\"wl wl-kjv\" data-code=\"H376\">one</span> of <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab's</span> <span class=\"wl wl-kjv\" data-code=\"H5288\">men</span> <span class=\"wl wl-kjv\" data-code=\"H5975\">stood</span> by him, and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H4310\">He</span> that <span class=\"wl wl-kjv\" data-code=\"H2654\">favoureth</span> <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab,</span> and he that is for <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> let him go <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab.</span>","12":"And <span class=\"wl wl-kjv\" data-code=\"H6021\">Amasa</span> <span class=\"wl wl-kjv\" data-code=\"H1556\">wallowed</span> in <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> in the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> of the <span class=\"wl wl-kjv\" data-code=\"H4546\">highway.</span> And when the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> that all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> stood <span class=\"wl wl-kjv\" data-code=\"H5975\">still,</span> he <span class=\"wl wl-kjv\" data-code=\"H5437\">removed</span> <span class=\"wl wl-kjv\" data-code=\"H6021\">Amasa</span> out of the <span class=\"wl wl-kjv\" data-code=\"H4546\">highway</span> into the <span class=\"wl wl-kjv\" data-code=\"H7704\">field,</span> and <span class=\"wl wl-kjv\" data-code=\"H7993\">cast</span> a <span class=\"wl wl-kjv\" data-code=\"H899\">cloth</span> upon him, when he <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> that every one that <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> by him stood <span class=\"wl wl-kjv\" data-code=\"H5975\">still.</span>","13":"When he was <span class=\"wl wl-kjv\" data-code=\"H3014\">removed</span> out of the <span class=\"wl wl-kjv\" data-code=\"H4546\">highway,</span> all the <span class=\"wl wl-kjv\" data-code=\"H376\">people</span> went <span class=\"wl wl-kjv\" data-code=\"H5674\">on</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab,</span> to <span class=\"wl wl-kjv\" data-code=\"H7291\">pursue</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> <span class=\"wl wl-kjv\" data-code=\"H7652\">Sheba</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H1075\">Bichri.</span>","14":"And he <span class=\"wl wl-kjv\" data-code=\"H5674\">went</span> through all the <span class=\"wl wl-kjv\" data-code=\"H7626\">tribes</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> unto <span class=\"wl wl-kjv\" data-code=\"H59\">Abel,</span> and to <span class=\"wl wl-kjv\" data-code=\"H1038\">Bethmaachah,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H1276\">Berites:</span> and they were gathered <span class=\"wl wl-kjv\" data-code=\"H6950\">together,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">went</span> also <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> him.","15":"And they <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> and <span class=\"wl wl-kjv\" data-code=\"H6696\">besieged</span> him in <span class=\"wl wl-kjv\" data-code=\"H59\">Abel</span> of <span class=\"wl wl-kjv\" data-code=\"H1038\">Bethmaachah,</span> and they cast <span class=\"wl wl-kjv\" data-code=\"H8210\">up</span> a <span class=\"wl wl-kjv\" data-code=\"H5550\">bank</span> against the <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> and it <span class=\"wl wl-kjv\" data-code=\"H5975\">stood</span> in the <span class=\"wl wl-kjv\" data-code=\"H2426\">trench:</span> and all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> that were with <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab</span> <span class=\"wl wl-kjv\" data-code=\"H7843\">battered</span> the <span class=\"wl wl-kjv\" data-code=\"H2346\">wall,</span> to throw it <span class=\"wl wl-kjv\" data-code=\"H5307\">down.</span>","16":"Then <span class=\"wl wl-kjv\" data-code=\"H7121\">cried</span> a <span class=\"wl wl-kjv\" data-code=\"H2450\">wise</span> <span class=\"wl wl-kjv\" data-code=\"H802\">woman</span> out of the <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">Hear,</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">hear;</span> <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> I pray you, unto <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab,</span> Come <span class=\"wl wl-kjv\" data-code=\"H7126\">near</span> hither, that I may <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> with thee.","17":"And when he was come <span class=\"wl wl-kjv\" data-code=\"H7126\">near</span> unto her, the <span class=\"wl wl-kjv\" data-code=\"H802\">woman</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Art thou <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab?</span> And he <span class=\"wl wl-kjv\" data-code=\"H559\">answered,</span> I am he. Then she <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, <span class=\"wl wl-kjv\" data-code=\"H8085\">Hear</span> the <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> of thine <span class=\"wl wl-kjv\" data-code=\"H519\">handmaid.</span> And he <span class=\"wl wl-kjv\" data-code=\"H559\">answered,</span> I do <span class=\"wl wl-kjv\" data-code=\"H8085\">hear.</span>","18":"Then she <span class=\"wl wl-kjv\" data-code=\"H559\">spake,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> They were <span class=\"wl wl-kjv\" data-code=\"H1696\">wont</span> to <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> in old <span class=\"wl wl-kjv\" data-code=\"H7223\">time,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> They shall <span class=\"wl wl-kjv\" data-code=\"H7592\">surely</span> <span class=\"wl wl-kjv\" data-code=\"H7592\">ask</span> counsel at <span class=\"wl wl-kjv\" data-code=\"H59\">Abel:</span> and so they <span class=\"wl wl-kjv\" data-code=\"H8552\">ended</span> the matter.","19":"I am one of them that are <span class=\"wl wl-kjv\" data-code=\"H7999\">peaceable</span> and <span class=\"wl wl-kjv\" data-code=\"H539\">faithful</span> in <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel:</span> thou <span class=\"wl wl-kjv\" data-code=\"H1245\">seekest</span> to <span class=\"wl wl-kjv\" data-code=\"H4191\">destroy</span> a <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> and a <span class=\"wl wl-kjv\" data-code=\"H517\">mother</span> in <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel:</span> why wilt thou swallow <span class=\"wl wl-kjv\" data-code=\"H1104\">up</span> the <span class=\"wl wl-kjv\" data-code=\"H5159\">inheritance</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD?</span>","20":"And <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab</span> <span class=\"wl wl-kjv\" data-code=\"H6030\">answered</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Far be <span class=\"wl wl-kjv\" data-code=\"H2486\">it,</span> far be <span class=\"wl wl-kjv\" data-code=\"H2486\">it</span> from me, that I should swallow <span class=\"wl wl-kjv\" data-code=\"H1104\">up</span> or <span class=\"wl wl-kjv\" data-code=\"H7843\">destroy.</span>","21":"The <span class=\"wl wl-kjv\" data-code=\"H1697\">matter</span> is not so: but a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H2022\">mount</span> <span class=\"wl wl-kjv\" data-code=\"H669\">Ephraim,</span> <span class=\"wl wl-kjv\" data-code=\"H7652\">Sheba</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H1075\">Bichri</span> by <span class=\"wl wl-kjv\" data-code=\"H8034\">name,</span> hath lifted <span class=\"wl wl-kjv\" data-code=\"H5375\">up</span> his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> against the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> even against <span class=\"wl wl-kjv\" data-code=\"H1732\">David:</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">deliver</span> him only, and I will <span class=\"wl wl-kjv\" data-code=\"H3212\">depart</span> from the <span class=\"wl wl-kjv\" data-code=\"H5892\">city.</span> And the <span class=\"wl wl-kjv\" data-code=\"H802\">woman</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab,</span> Behold, his <span class=\"wl wl-kjv\" data-code=\"H7218\">head</span> shall be <span class=\"wl wl-kjv\" data-code=\"H7993\">thrown</span> to thee <span class=\"wl wl-kjv\" data-code=\"H1157\">over</span> the <span class=\"wl wl-kjv\" data-code=\"H2346\">wall.</span>","22":"Then the <span class=\"wl wl-kjv\" data-code=\"H802\">woman</span> <span class=\"wl wl-kjv\" data-code=\"H935\">went</span> unto all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> in her <span class=\"wl wl-kjv\" data-code=\"H2451\">wisdom.</span> And they cut <span class=\"wl wl-kjv\" data-code=\"H3772\">off</span> the <span class=\"wl wl-kjv\" data-code=\"H7218\">head</span> of <span class=\"wl wl-kjv\" data-code=\"H7652\">Sheba</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H1075\">Bichri,</span> and <span class=\"wl wl-kjv\" data-code=\"H7993\">cast</span> it out to <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab.</span> And he <span class=\"wl wl-kjv\" data-code=\"H8628\">blew</span> a <span class=\"wl wl-kjv\" data-code=\"H7782\">trumpet,</span> and they <span class=\"wl wl-kjv\" data-code=\"H6327\">retired</span> from the <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> to his <span class=\"wl wl-kjv\" data-code=\"H168\">tent.</span> And <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">returned</span> to <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> unto the <span class=\"wl wl-kjv\" data-code=\"H4428\">king.</span>","23":"Now <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab</span> was over all the <span class=\"wl wl-kjv\" data-code=\"H6635\">host</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel:</span> and <span class=\"wl wl-kjv\" data-code=\"H1141\">Benaiah</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H3077\">Jehoiada</span> was over the <span class=\"wl wl-kjv\" data-code=\"H3774\">Cherethites</span> and over the <span class=\"wl wl-kjv\" data-code=\"H6432\">Pelethites:</span>","24":"And <span class=\"wl wl-kjv\" data-code=\"H151\">Adoram</span> was over the <span class=\"wl wl-kjv\" data-code=\"H4522\">tribute:</span> and <span class=\"wl wl-kjv\" data-code=\"H3092\">Jehoshaphat</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H286\">Ahilud</span> was <span class=\"wl wl-kjv\" data-code=\"H2142\">recorder:</span>","25":"And <span class=\"wl wl-kjv\" data-code=\"H7864\">Sheva</span> was <span class=\"wl wl-kjv\" data-code=\"H5608\">scribe:</span> and <span class=\"wl wl-kjv\" data-code=\"H6659\">Zadok</span> and <span class=\"wl wl-kjv\" data-code=\"H54\">Abiathar</span> were the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests:</span>","26":"And <span class=\"wl wl-kjv\" data-code=\"H5896\">Ira</span> also the <span class=\"wl wl-kjv\" data-code=\"H2972\">Jairite</span> was a chief <span class=\"wl wl-kjv\" data-code=\"H3548\">ruler</span> about <span class=\"wl wl-kjv\" data-code=\"H1732\">David.</span>"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"Belials man,","tekst":"Zie Deu 13:13."},{"catchword":"Seba,","tekst":"Hebreeuws, Scheba"},{"catchword":"Jemini;","tekst":"Zie boven, 2Sa 16:11."},{"catchword":"iegelijk","tekst":"Versta hierop, vertrekke, begeve zich."},{"catchword":"Israël","tekst":"Hij spreekt die van Israël aan, die met Juda getwist en zich beklaagd hadden dat zij verongelijkt waren. Zie 2Sa 19:41, 2Sa 19:43."}],"2":[{"catchword":"van achter David,","tekst":"Dat is, zij verlieten David en volgden Seba na."},{"catchword":"kleefden hun koning aan,","tekst":"Zij verlieten hem niet, gelijk de andere stammen, maar bleven bij hem, geleidende hem voorts tot Jeruzalem toe."}],"3":[{"catchword":"tien vrouwen,","tekst":"Zie boven, 2Sa 15:16."},{"catchword":"deed ze","tekst":"De oorzaak, zie boven, 2Sa 16:22."},{"catchword":"ging tot haar niet in","tekst":"Zie Gen 6:4."},{"catchword":"opgesloten","tekst":"Hebreeuws, gebonden; dat is, alzo besloten, alsof zij gevangen en gebonden waren geweest; tenware dan, dat zij in Absaloms feit mochten hebben geconsenteerd."},{"catchword":"levende als weduwen","tekst":"[In] weduwschap des levens; dat is, levende als weduwen, of als weduwen zijnde, haar leefdagen. Of, weduwen welker man nog leefde."}],"4":[{"catchword":"tegen den derden dag;","tekst":"Of, binnen drie dagen. Hebreeuws, den derden der dagen"},{"catchword":"stel u dan hier","tekst":"Dat is, stel u dan in en houd u bij mij, om last van mij te ontvangen; want David had hem generaal-krijgsoverste gemaakt in Joabs plaats; boven, 2Sa 19:13."}],"5":[{"catchword":"bleef achter,","tekst":"Anders, hij liet [hen], namelijk die van Juda vertoeven; dat is, hij gaf hun langer tijd."},{"catchword":"hij hem gezet had","tekst":"David."}],"6":[{"catchword":"Abisai","tekst":"Joabs broeder, zijnde mede een krijgsoverste. Zie boven, 2Sa 18:2, dien David hierin gebruikt, om Joab [die anderszins de naaste zou geweest zijn] geen gelegenheid te geven, dat hij zich in de plaats van Amasa mocht indringen, met belediging van Amasa, dien de koning het generaalschap met ede beloofd had."},{"catchword":"uws heren,","tekst":"Dat is, mijn officieren en soldaten. Sommigen verstaan hier Amasa, die nu, als generaal, Abisai's heer genoemd wordt."}],"7":[{"catchword":"mannen van Joab,","tekst":"Dat is, Joabs soldaten, alsook Joab zelf."},{"catchword":"Krethi,","tekst":"Zie 1Ki 1:38."}],"8":[{"catchword":"Gibeon is,","tekst":"Zie Jos 10."},{"catchword":"voor hun aangezicht","tekst":"Dat is, hij kwam hun recht in het gemoet, wederkerende van de reis, waartoe hem de koning gezonden had, of, Hij kwam voor, of nevens hen heen, langs den weg, daar zij mogen hebben vertoefd."},{"catchword":"kleed,","tekst":"Of, krijgsrok, kazak, krijgsmantel; een kleed [gelijk enigen menen] in den krijg gebruikelijk en te dien tijd bekend."},{"catchword":"dat hij aan had,","tekst":"Hebreeuws, zijner kleding"},{"catchword":"hij voortging,","tekst":"Te weten, Joab, aftredende uit zijn orde, of de plaats, waar zij vertoefden om Amasa te groeten."},{"catchword":"viel het uit","tekst":"Te weten, het zwaard; zulks, dat Amasa, hebbende het zwaard zien vallen, daarop niet verdacht was, dat Joab het met de linkerhand opgenomen had, gelijk sommigen uit het volgende vs. (9) afnemen."}],"9":[{"catchword":"Is het wel met u,","tekst":"Hebreeuws, [zijt] gij vrede? Gelijk 1Sa 25:6, en boven, 2Sa 17:3."},{"catchword":"broeder?","tekst":"Dat is, neef, bloedvriend. Zij waren twee zusterskinderen, 1Ch 2:16-17. Zie ook boven, 2Sa 17:25."},{"catchword":"Joab vatte","tekst":"Hebreeuws, Joabs rechterhand vatte den baard van Amasa"},{"catchword":"kussen","tekst":"Gelijk in het groeten gebruikelijk was, Gen 29:11."}],"10":[{"catchword":"sloeg","tekst":"Dat is, stak."},{"catchword":"vijfde rib,","tekst":"Zie boven, 2Sa 2:23."},{"catchword":"ten tweeden male,","tekst":"Hebreeuws, hij verdubbelde, of wederhaalde niet aan hem; te weten den slag; dat is, hij stak hem niet ten tweeden male, dewijl hij van den eersten steek terstond stierf. Vergelijk 1Sa 26:8; Job 29:22."}],"11":[{"catchword":"jongens,","tekst":"Dat is, dienaars."},{"catchword":"Wie is er,","tekst":"Dat is, allen, die het met Joab en David houden, die volgen Joab na. Vergelijk Deu 20:5, enz. Alzo dringt zich Joab bij het krijgsvolk terstond weder in het generaalschap, in de plaats van Amasa, dien hij daarom vermoord had."},{"catchword":"die volge Joab na","tekst":"Hebreeuws, [zij] achter Joab; gelijk boven dikwijls, en in het volgende."}],"12":[{"catchword":"die man zag,","tekst":"In vs.11 vermeld."},{"catchword":"het volk","tekst":"Dat dien weg passeerde, gelijk in het einde van dit vs. verklaard wordt."}],"14":[{"catchword":"hij toog heen","tekst":"Joab, die den vluchtenden Seba door Efraïm, Manasse, Issaschar, Zebulon en Nafthali vervolgde tot aan Abel toe, waar hij nu was."},{"catchword":"Beth-máächa,","tekst":"Met dezen toenaam was deze stad Abel genoemd, tot onderscheiding van de andere van dien naam. Deze stad lag in den stam van Nafthali, aan het noordelijke einde van Kanaän, tegen Syrië aan, waar een gedeelte van Syrië was, genoemd Maächa. Zie ook 2Ki 15:29, en hier, vs.15."},{"catchword":"Berim;","tekst":"Een landstreek bij Abel gelegen."},{"catchword":"zij verzamelden zich,","tekst":"De Israëlieten van de gemelde plaatsen volgden ook Joab."}],"15":[{"catchword":"hem","tekst":"Seba, den rebel."},{"catchword":"wierpen","tekst":"Hebreeuws, zij stortten uit"},{"catchword":"wal op","tekst":"Een opgehoogden aarden dijk; dat is, een bolwerk, of wal. Alzo 2Ki 19:32; Jer 32:24, en Jer 33:4."},{"catchword":"verdorven den muur,","tekst":"Hebreeuws, waren verdervende, om den muur neder te vellen; dat is, houwende, stotende, brekende, misschien ook ondergravende; want van het Hebreeuwse woord dat hier gebruikt wordt, komt een ander, dat ook een groef betekent."}],"16":[{"catchword":"uit de stad","tekst":"Van den stadsmuur af."}],"18":[{"catchword":"gemeenlijk,","tekst":"Hebreeuws, sprekende spraken zij"},{"catchword":"zonder twijfel","tekst":"Hebreeuws, vragende zullen zij vragen, of raadvragende zullen zij raadvragen. Het schijnt een oud spreekwoord geweest te zijn, tot eer der inwoners van deze stad gebruikt, omdat aldaar kloeke en wijze lieden gevonden werden, blijkende alhier uit het exempel dezer vrouw."},{"catchword":"alzo volbrachten zij het","tekst":"Dat is, als men den raad van deze stad volgde, zo ging het wel. Of, zo eindigden zij het geschil. Anders, alzo zullen zij het volbrengen, of eindigen."}],"19":[{"catchword":"Ik ben een","tekst":"Zij spreekt in den naam der stad Abel."},{"catchword":"stad,","tekst":"Hebreeuws, een stad en een moeder; enz.; dat is, een hoofdstad, hebbende onder haar andere steden en dorpen. Of, versta door de moeder de inwoners ener stad, die als ene moeder is van andere, die zij, als een moeder den kinderen, met wijzen en goeden raad pleegt voor te gaan."},{"catchword":"erfdeel des HEEREN","tekst":"Dat is, zijn volk, dat Hij bemint, als een mens zijn erfdeel."}],"20":[{"catchword":"dat ik zou verslinden,","tekst":"Hebreeuws, zo ik zal verslinden, enz. Versta hierop, zo doe mij God dit en dat, gelijk in het eedzweren gebruikelijk."}],"21":[{"catchword":"De zaak is niet alzo;","tekst":"Hij wil zeggen: Ik ben daarom niet gekomen, maar om Seba te hebben."},{"catchword":"hand","tekst":"Heeft zich opgeworpen en een rebellie gesticht."}],"22":[{"catchword":"met haar wijsheid;","tekst":"Met wijze redenen de inwoners bewegende om te doen wat zij Joab beloofd had."},{"catchword":"verstrooiden zich","tekst":"De belegeraars."}],"23":[{"catchword":"over het ganse heir van Israël;","tekst":"Na den dood van Amasa was hij in zijn vorigen staat hersteld. Zie boven, vs.4. Deze officieren worden hier andermaal opgenoemd, omdat David nu als opnieuw in zijn rijk was hersteld; boven, 2Sa 19:22, en omdat er enige verandering en ook bijvoeging schijnt gevallen te zijn. Vergelijk boven, 2Sa 8:17-18."},{"catchword":"Krethi en over de Plethi;","tekst":"Zie boven, vs.7."}],"24":[{"catchword":"schatting;","tekst":"Anders, uitschot. Zie 1Ki 4:6."},{"catchword":"kanselier;","tekst":"Zie 1Ki 4:3."}],"25":[{"catchword":"Seja was schrijver;","tekst":"Hebreeuws, Scheja. Boven, 2Sa 8:17 [naar sommiger gevoelen] genoemd Seraja"},{"catchword":"priesters","tekst":"Zie Num 3:32, en 2Ki 23:4."}],"26":[{"catchword":"opperofficier","tekst":"Hebreeuws, Cohen. Zie boven, 2Sa 8:18."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Then was there by chance a man of Belial, [See Deut.13.on vers.13.] whose name was Seba, [Heb. Schobi] a son of Bichri, a man of Jemini: [see above chap.16.on vers.11.] he blew with the trumpet, and said; We have no part in David, neither have we any inheritance in the son of Isai; every man to his tents, [Understand withal, depart, get him] O Israel. [He speaketh to those of Israel, that were at strife with Juda, and complained, that they were wronged. See chap.19.41, 43.]"}],"2":[{"catchword":null,"tekst":"Then all (or, every) man of Israel went up from after David, after Seba, the son of Bichri: [i.e. they left David, and followed after Seba] But the men of Juda clave unto their King, from Jordan to Jerusalem. [i.e. They left him, not as the other tribes had done, but continued with him, conducting him on to Jerusalem]"}],"3":[{"catchword":null,"tekst":"Now when David came into his house at Jerusalem, the King took the ten women, (his) concubines, whom he had left to keep the house [See above chap.15.16.] and put them in an house of custody, [the cause hereof see above chap.16.22.] and maintained them, and went not in unto them: [see Gen.6.on v.4.] and they were shut up [Heb.bound, that is so shut up, as if they had been imprisoned and bound: it may be they had consented to Absaloms fact] unto the day of their death, living as widows, [(in) a widow-estate, that is, living as widows, or being as widows all their life long, or widows whose husband were yet alive.]"}],"4":[{"catchword":null,"tekst":"Moreover, the King said unto Amasa; call me the men of Judah together, against the third day: [Or, within three days. Heb. the third of the days] and thou, set thy self (then) here; [that is, come in then, and keep by me, to receive charge from me; for David had made him Captain General in Joabs room, above chap 19.13.]"}],"5":[{"catchword":null,"tekst":"And Amasa went his way to call Juda together: But he stayed behind the set time, [Others he caused (them) namely, those of Juda, to carry, that is, he gave them longer time] that he [David] had appointed him."}],"6":[{"catchword":null,"tekst":"Then said David unto Abisai; [Joabs brother, being also a commander. See above chap.18.2. whom David herein useth, that he might give no occasion to Joab (who otherwise should have been the next) to intrude himself into the place of Amasa, with the offence of Amasa, with the offence of Amasa, to whom the king had promised and confirmed by oath the Generals place] Now shall Seba, the son of Bichri, do us more harm then Absalom: Take thou thy Lords servants, [that is, my officers and souldiers. Some understand here Amasa, who at this present, as General, is called Abisai&acirc;&euro;&trade;s Lord] and pursue after him, left peradventure he find fenced cities before him and withdraw himself from our eyes."}],"7":[{"catchword":null,"tekst":"Then (there) went out after him Joabs men, [That is, joabs souldiers, as alos Joabs himself] and the Crethi and the Plethi [see 1 Kings.1.on vers.38.] and all the champions: These marched forth from Jerusalem to pursue after Seba, the son of Bichri."}],"8":[{"catchword":null,"tekst":"Now when they were by the great stone, which is by Gibeon, [See Jos.10.] then came Amasa before their face; [i.e. he came directly to meet them, returning from the journey whereon the King had sent him; or he came before or beside them, or along the way, where ir may be they baited] and Joab was girt about upon his garment [or, souldiers coat, cassock, souldiers cloak; a garment (as some conceive) much used in war, and well known in those times] which he had on [Heb. of his cloathing] and upon it was a girdle, where the sword was fastned upon his loines in its shealth; and when he [to wit , Joab] went on, [stepping aside from his rank, or the place where they baited to salute Amasa] then it fell out . [to the sword: so that Amasa having seen the sword fall, suspect not that Joab had taken it with his left hand, as some do gather from the next verse.]"}],"9":[{"catchword":null,"tekst":"And Joab said unto Amasa; is it well thee [Heb. (art) thou peace, as 1 Sam.25.6. and above ch.17.3.] my brother? [that is, cousin, kinsman; they were two sister children, 1 Chron.2.16, 17. See also above chap.17.25.] and Joab took hold of the beard of Amasa with (the) right hand [Heb. Joabs right hand took hold of the heard of Amasa] To kiss him. [as was usual in saluting, Gen.29.on v.11.]"}],"10":[{"catchword":null,"tekst":"And Amasa took no heed to the sword that was in Joabs hand, therefore he smote [That is, stabbed] him therewith in the fifth rib [see above ch.2.on v.23.] and he shed out his bowels to the ground, and he smote him not the second time, [Heb. he doubled, or repeated not on him, to wit, the blow, i.e. he stabbed him not the second time, because he died presently of the first stab as followeth. Com.1 Sam.26 8. Job 29:22.] and he died: then Joab and his brother Amasa pursued after Seba the son of Birchri."}],"11":[{"catchword":null,"tekst":"But a man of Joabs lads [That is servants] stayed by him: and he said; who is there that hath a mind to Joab; and who is there that is for David; Let him follow Joab. [Heb. (let him be) after Joab: as above often, and in the sequel. The meaning is, let all those that side with Joab and David follow Joab. Compare Deut.20.5. Thus Joabs by means of the souldiery thrusteth himself straightway into the office or place of General in Amasa&acirc;&euro;&trade;s room, whom for that very intent and purpose he had murdered.]"}],"12":[{"catchword":null,"tekst":"Now Amasa lay wallowing in blood, in the midst of the street, when that man [Mentioned in the former verse] saw that all the people [that passed by that way, as in the end of this verse is declared] stood still, then he removed Amasa out of the street into the field, and cast a cloth upon him, because he saw, that all (or very one) that came by him, stood still."}],"13":[{"catchword":null,"tekst":"Now when he was removed out of the street, all (or every) man marched on after Joab, to pursue after Seba, the son of Bichri:"}],"14":[{"catchword":null,"tekst":"And he [viz. Joab] marched on thorough all the tribes of Israel unto Abel, [He persued Seba fleeing thorough Ephraim, Issaachar, Zebulon and Naphtali, unto Abel, where he now was] to wit, Beth-maacha, [by this sir-name was this city of Abel called, to distinguish it from another city of the same name, this city lay in the tribe of Naphtali, on the North-end of Canaan, over against Syria, where was a part of Syria called Maacha. See also 2 Kings 15.29. and here the following verse] and all Berim: [a country lying by Abel] and they [viz. the Israelites] gathered themselves together and went also after him. [of the fore-mentioned places followed Joab likewise.]"}],"15":[{"catchword":null,"tekst":"And they came and besiege him [viz. Seba the rebel] in Abel Beth-Maacha, and they cast up [Heb. they poured out] a wall [an earthen bank raised up high: that is, a bulwark or wall. So 2 Kings 19, 32. Jer 32:24. and 33.4.] against the city, (so) that it stood on the outward wall: and all the people that were with Joab, spoiled the wall, to throw it down. [Heb. were spoiling, to throw the wall down, i.e. hewing, pushing, breaking, battering perhaps also undermining; for from the Hebrew word here used, is derived another, which also signifieth a ditch.]"}],"16":[{"catchword":null,"tekst":"Then there cryed a wise woman out of the city: [from the wall of the city] here, here, say, I pray unto Joab; come near hither, that I may speak to thee."}],"17":[{"catchword":null,"tekst":"Now when he came neer unto her, the woman said; art thou Joab? And he said, I am: and she said unto him; hear the words of thine hand-maid, and he said, I hear."}],"18":[{"catchword":null,"tekst":"Then she spake, saying; they spake commonly [Heb. speaking they spake] in former time, saying; they shall undoubtedly enquire [Heb. enquiring they shall enquire, or asking counsel they shall ask counsel] at Abel, and so they accomplished it. [i.e. when the counsel of this city was followed, things went well. Or so they ended the difference, or controversy. Oth. so they shall accomplish, or, end the matter. It seemeth to have been an old proverb, used to the honour of the inhabitants of this city, because wise and understanding people were found there, as appeareth here by the example of this woman.]"}],"19":[{"catchword":null,"tekst":"I am one of the peaceable of the faithful (ones) in Israel [She speaketh in the name of the city of Abel] and thou sleekest to slay a city, which is mother in Israel; [heb. a city and a mother, etc. i.e. a metropolis or chief city, having under it other small towns and villages. Or understand by the mother, the inhabitants of a city, which is as it were a mother of others, which she is wont to go before good and wise counsel, as a mother doth her children] why shouldest thou swallow up the inheritance of the LORD? [i.e. his people, whom he loveth as a man doth his inheritance.]"}],"20":[{"catchword":null,"tekst":"Then Joab answered, and said; far be it far be it from me, that I should swallow up, and that I should destroy! [Hebr. If I shall swallow up, etc. Understand withal, the let God do this and that to me: as is used in swearing.]"}],"21":[{"catchword":null,"tekst":"The matter is not so; but a man of the mount of Ephraim, whose name is Seba the son Birchi; [As if he should say, I am not come for that intent, but to have Seba] hath lift up his hand [hath risen up, and raised rebellion] against the King, against David; deliver him only, then I will depart from this city; Then said the woman unto Joab; behold, his head shall be thrown to thee over the wall."}],"22":[{"catchword":null,"tekst":"And the woman came into all the people with her wisdom, [Moving the inhabitants withy wise and solid found arguments, to perform that which she had promised Joab] and they cut off the head of Seba the son of Bichri, and threw it unto Joab: Then he blew with the trumpet, and they [viz. the besiegers] scattered them // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

(function vulNoten() {

  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
