naam":"Openbaring","href":"../../openbaring/1/"}],"slugmap":{"Gen":"genesis","Ex":"exodus","Lev":"leviticus","Num":"numeri","Deut":"deuteronomium","Joz":"jozua","Richt":"richteren","Ruth":"ruth","1 Sam":"1-samuel","2 Sam":"2-samuel","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"En het gebeurde met de terugkeer van het jaar, ten tijde dat de koningen uittrekken, dat David Joab, en zijn knechten met hem, en heel Israël, uitzond om de kinderen van Ammon te verderven, en Rabba te belegeren. Doch David bleef te Jeruzalem.","2":"Zo gebeurde het tegen de avondtijd, dat David van zijn bed opstond, en wandelde op het dak van het koningshuis, en zag van het dak een vrouw die zich waste; deze vrouw nu was zeer schoon van uiterlijk.","3":"En David zond iemand, en liet naar deze vrouw navragen; en men zei: Is dat niet Bathseba, de dochter van Eliam, de vrouw van Uria, de Hethiet?","4":"Toen zond David boden, en liet haar halen. En toen zij bij hem gekomen was, lag hij bij haar (zij had zich namelijk van haar onreinheid gezuiverd), daarna keerde zij terug naar haar huis.","5":"En die vrouw werd zwanger; zo liet zij David weten, en zei: Ik ben zwanger geworden.","6":"Toen zond David naar Joab en zei: Stuur Uria, de Hethiet, naar mij. En Joab stuurde Uria naar David.","7":"Toen Uria bij hem kwam, vroeg David hoe het met Joab ging, en hoe het met het volk ging, en hoe het met de strijd stond.","8":"Daarna zei David tegen Uria: Ga naar uw huis, en was uw voeten. En toen Uria uit het huis van de koning wegging, volgde hem een gerecht van de koning achterna.","9":"Maar Uria legde zich neer voor de deur van het huis van de koning, bij alle knechten van zijn heer; en hij ging niet naar zijn huis.","10":"En zij lieten David weten: Uria is niet naar zijn huis gegaan. Toen zei David tegen Uria: Komt u niet van een reis? Waarom bent u niet naar uw huis gegaan?","11":"En Uria zei tegen David: De ark, en Israël, en Juda blijven in de tenten; en mijn heer Joab, en de knechten van mijn heer, zijn gelegerd op het open veld, en zou ik naar mijn huis gaan, om te eten en te drinken, en bij mijn vrouw te liggen? Zo waarachtig als u leeft en uw ziel leeft, ik zal dit niet doen!","12":"Toen zei David tegen Uria: Blijf ook vandaag hier, dan zal ik u morgen wegsturen. Zo bleef Uria te Jeruzalem, die dag en de dag daarna.","13":"En David nodigde hem, zodat hij voor zijn aangezicht at en dronk, en hij maakte hem dronken. Daarna ging hij 's avonds naar buiten, om zich neer te leggen op zijn bed, bij de knechten van zijn heer, maar hij ging niet naar zijn huis.","14":"'s Morgens nu gebeurde het, dat David een brief schreef aan Joab; en hij stuurde die door de hand van Uria.","15":"En hij schreef in die brief: Stel Uria vooraan tegenover de sterkste strijd, en trek u van achter hem terug, opdat hij geslagen wordt en sterft.","16":"Zo gebeurde het, toen Joab op de stad had gelet, dat hij Uria stelde op de plaats waarvan hij wist dat daar strijdbare mannen waren.","17":"Toen de mannen van de stad uittrokken en met Joab streden, vielen er van het volk, van Davids knechten, en Uria, de Hethiet, stierf ook.","18":"Toen zond Joab iemand heen, en liet David de hele stand van zaken van deze strijd weten.","19":"En hij gaf de bode bevel: Wanneer u geëindigd hebt de hele stand van zaken van deze strijd tegen de koning uit te spreken;","20":"En het zal gebeuren, als de grimmigheid van de koning opkomt, en hij tegen u zegt: Waarom bent u zo dicht bij de stad gekomen om te strijden? Wist u niet dat zij van de muur zouden schieten?","21":"Wie sloeg Abimelech, de zoon van Jerubbeseth? Wierp niet een vrouw een stuk van een molensteen op hem van de muur, zodat hij te Thebez stierf? Waarom bent u tot de muur genaderd? Dan moet u zeggen: Uw knecht, Uria, de Hethiet, is ook dood.","22":"En de bode ging heen, en kwam aan, en gaf David alles te kennen waarvoor Joab hem uitgezonden had.","23":"En de bode zei tegen David: Die mannen zijn ons zeker te machtig geweest, en zijn tegen ons uitgetrokken in het veld; maar wij zijn tegen hen opgetrokken tot aan de deur van de poort.","24":"Toen schoten de schutters van de muur af op uw knechten, zodat er van de knechten van de koning dood zijn; en uw knecht, Uria, de Hethiet, is ook dood.","25":"Toen zei David tegen de bode: Zo moet u tegen Joab zeggen: Laat deze zaak niet kwaad zijn in uw ogen, want het zwaard verteert zowel de een als de ander; versterk uw strijd tegen de stad, en verstoor haar; bemoedig hem zo.","26":"Toen de vrouw van Uria hoorde dat haar man Uria dood was, droeg zij leed over haar heer.","27":"En toen de rouw voorbij was, stuurde David iemand heen, en nam haar in zijn huis; en zij werd hem tot vrouw, en baarde hem een zoon. Doch deze daad, die David gedaan had, was kwaad in de ogen van de HEERE."},"SV":{"1":"En het geschiedde met de wederkomst van het jaar, ter tijde als de koningen uittrekken, dat David Joab, en zijn knechten met hem, en gans Israël henenzond, dat zij de kinderen Ammons verderven, en Rabba belegeren zouden. Doch David bleef te Jeruzalem.","2":"Zo geschiedde het tegen den avondtijd, dat David van zijn leger opstond, en wandelde op het dak van het koningshuis, en zag van het dak een vrouw, zich wassende; deze vrouw nu was zeer schoon van aanzien.","3":"En David zond henen, en ondervraagde naar deze vrouw; en men zeide: Is dat niet Bathseba, de dochter van Eliam, de huisvrouw van Uria, den Hethiet?","4":"Toen zond David boden henen, en liet haar halen. En als zij tot hem ingekomen was, lag hij bij haar, ( zij nu had zich van haar onreinigheid gezuiverd), daarna keerde zij weder naar haar huis.","5":"En die vrouw werd zwanger; zo zond zij henen, en liet David weten, en zeide: Ik ben zwanger geworden.","6":"Toen zond David tot Joab, *zeggende*: Zend Uria, den Hethiet, tot mij. En Joab zond Uria tot David.","7":"Als nu Uria tot hem kwam, zo vraagde David naar den welstand van Joab, en naar den welstand des volks, en naar den welstand des krijgs.","8":"Daarna zeide David tot Uria: Ga af naar uw huis, en was uw voeten. En toen Uria uit des konings huis uitging, volgde hem een gerecht des konings achterna.","9":"Maar Uria leide zich neder voor de deur van des konings huis, met al de knechten zijns heren; en hij ging niet af in zijn huis.","10":"En zij gaven het David te kennen, zeggende: Uria is niet afgegaan in zijn huis. Toen zeide David tot Uria: Komt gij niet van de reis? Waarom zijt gij niet afgegaan in uw huis?","11":"En Uria zeide tot David: De ark, en Israël, en Juda blijven in de tenten; en mijn heer Joab, en de knechten mijns heren zijn gelegerd op het open veld, en zou ik in mijn huis gaan, om te eten en te drinken, en bij mijn huisvrouw te liggen? *Zo* *waarachtig* *als* gij leeft en uw ziel leeft, indien ik deze zaak doen zal!","12":"Toen zeide David tot Uria: Blijf ook heden hier, zo zal ik u morgen afzenden. Alzo bleef Uria te Jeruzalem, dien dag en den anderen dag.","13":"En David nodigde hem, zodat hij voor zijn aangezicht at en dronk, en hij maakte hem dronken. Daarna ging hij in den avond uit, om zich neder te leggen op zijn leger, met zijns heren knechten, maar ging niet af in zijn huis.","14":"Des morgens nu geschiedde het, dat David een brief schreef aan Joab; en hij zond *dien* door de hand van Uria.","15":"En hij schreef in dien brief, zeggende: Stel Uria vooraan tegenover den sterksten strijd, en keer van achter hem af, opdat hij geslagen worde en sterve.","16":"Zo geschiedde het, als Joab op de stad gelet had, dat hij Uria stelde aan de plaats, waarvan hij wist, dat aldaar strijdbare mannen waren.","17":"Als nu de mannen der stad uittogen en met Joab streden, vielen er van het volk, van Davids knechten, en Uria, de Hethiet, stierf ook.","18":"Toen zond Joab heen, en liet David den gansen handel van dezen strijd weten.","19":"En hij beval den bode, zeggende: Als gij zult geëindigd hebben den gansen handel van dezen strijd tot den koning uit te spreken;","20":"En het zal geschieden, indien de grimmigheid des konings opkomt, en hij tot u zegt: Waarom zijt gij zo na aan de stad gekomen om te strijden? Wist gij niet, dat zij van den muur zouden schieten?","21":"Wie sloeg Abimelech, den zoon van Jerubbeseth? Wierp niet een vrouw een stuk van een molensteen op hem van den muur, dat hij te Thebez stierf? Waarom zijt gij tot den muur genaderd? Dan zult gij zeggen: Uw knecht, Uria, de Hethiet, is ook dood.","22":"En de bode ging heen, en kwam in, en gaf David te kennen alles, waar hem Joab om uitgezonden had.","23":"En de bode zeide tot David: Die mannen zijn ons zeker te machtig geweest, en zijn tot ons uitgetogen in het veld; maar wij zijn tegen hen aan geweest tot aan de deur der poort.","24":"Toen schoten de schutters van den muur af op uw knechten, dat er van des konings knechten dood gebleven zijn; en uw knecht, Uria, de Hethiet, is ook dood.","25":"Toen zeide David tot den bode: Zo zult gij tot Joab zeggen: Laat deze zaak niet kwaad zijn in uw ogen, want het zwaard verteert zowel dezen als genen; versterk uw strijd tegen de stad, en verstoor ze; versterk hem alzo.","26":"Als nu de huisvrouw van Uria hoorde, dat haar man Uria dood was, zo droeg zij leed over haar heer.","27":"En als de rouw was overgegaan, zond David heen, en nam haar in zijn huis; en zij werd hem ter vrouwe, en baarde hem een zoon. Doch deze zaak, die David gedaan had, was kwaad in de ogen des HEEREN."},"KJV":{"1":"And it came to pass, after the year was expired, at the time when kings go forth to battle, that David sent Joab, and his servants with him, and all Israel; and they destroyed the children of Ammon, and besieged Rabbah. But David tarried still at Jerusalem.","2":"And it came to pass in an eveningtide, that David arose from off his bed, and walked upon the roof of the king's house: and from the roof he saw a woman washing herself; and the woman was very beautiful to look upon.","3":"And David sent and enquired after the woman. And one said, Is not this Bathsheba, the daughter of Eliam, the wife of Uriah the Hittite?","4":"And David sent messengers, and took her; and she came in unto him, and he lay with her; for she was purified from her uncleanness: and she returned unto her house.","5":"And the woman conceived, and sent and told David, and said, I am with child.","6":"And David sent to Joab, saying, Send me Uriah the Hittite. And Joab sent Uriah to David.","7":"And when Uriah was come unto him, David demanded of him how Joab did, and how the people did, and how the war prospered.","8":"And David said to Uriah, Go down to thy house, and wash thy feet. And Uriah departed out of the king's house, and there followed him a mess of meat from the king.","9":"But Uriah slept at the door of the king's house with all the servants of his lord, and went not down to his house.","10":"And when they had told David, saying, Uriah went not down unto his house, David said unto Uriah, Camest thou not from thy journey? why then didst thou not go down unto thine house?","11":"And Uriah said unto David, The ark, and Israel, and Judah, abide in tents; and my lord Joab, and the servants of my lord, are encamped in the open fields; shall I then go into mine house, to eat and to drink, and to lie with my wife? as thou livest, and as thy soul liveth, I will not do this thing.","12":"And David said to Uriah, Tarry here to day also, and to morrow I will let thee depart. So Uriah abode in Jerusalem that day, and the morrow.","13":"And when David had called him, he did eat and drink before him; and he made him drunk: and at even he went out to lie on his bed with the servants of his lord, but went not down to his house.","14":"And it came to pass in the morning, that David wrote a letter to Joab, and sent it by the hand of Uriah.","15":"And he wrote in the letter, saying, Set ye Uriah in the forefront of the hottest battle, and retire ye from him, that he may be smitten, and die.","16":"And it came to pass, when Joab observed the city, that he assigned Uriah unto a place where he knew that valiant men were.","17":"And the men of the city went out, and fought with Joab: and there fell some of the people of the servants of David; and Uriah the Hittite died also.","18":"Then Joab sent and told David all the things concerning the war;","19":"And charged the messenger, saying, When thou hast made an end of telling the matters of the war unto the king,","20":"And if so be that the king's wrath arise, and he say unto thee, Wherefore approached ye so nigh unto the city when ye did fight? knew ye not that they would shoot from the wall?","21":"Who smote Abimelech the son of Jerubbesheth? did not a woman cast a piece of a millstone upon him from the wall, that he died in Thebez? why went ye nigh the wall? then say thou, Thy servant Uriah the Hittite is dead also.","22":"So the messenger went, and came and shewed David all that Joab had sent him for.","23":"And the messenger said unto David, Surely the men prevailed against us, and came out unto us into the field, and we were upon them even unto the entering of the gate.","24":"And the shooters shot from off the wall upon thy servants; and some of the king's servants be dead, and thy servant Uriah the Hittite is dead also.","25":"Then David said unto the messenger, Thus shalt thou say unto Joab, Let not this thing displease thee, for the sword devoureth one as well as another: make thy battle more strong against the city, and overthrow it: and encourage thou him.","26":"And when the wife of Uriah heard that Uriah her husband was dead, she mourned for her husband.","27":"And when the mourning was past, David sent and fetched her to his house, and she became his wife, and bare him a son. But the thing that David had done displeased the LORD."}},"tsk":{"1":[{"kopje":"terugkeer van het jaar","refs":["1 Kon 20:22","1 Kon 20:26","2 Kron 36:10","Pred 3:8"]},{"kopje":"David uitzond","refs":["1 Kron 20:1","Zach 14:3"]},{"kopje":"Rabba","refs":["2 Sam 12:26","Deut 3:11","1 Kron 20:1","Ezech 21:20"]}],"2":[{"kopje":"opstond","refs":["2 Sam 4:5","2 Sam 4:7","Spr 19:15","Spr 24:33","Spr 24:34","Matt 26:40","Matt 26:41","1 Tess 5:6","1 Tess 5:7","1 Petr 4:7"]},{"kopje":"het dak van","refs":["Deut 22:8","Jer 19:13","Matt 10:27","Hand 10:9"]},{"kopje":"zag","refs":["Gen 3:6","Gen 6:2","Gen 34:2","Job 31:1","Ps 119:37","Matt 5:28","1 Joh 2:16"]},{"kopje":"zeer schoon","refs":["Gen 39:6","Spr 6:25","Spr 31:30"]}],"3":[{"kopje":"zond","refs":["Jer 5:8","Hos 7:6","Hos 7:7","Jak 1:14","Jak 1:15"]},{"kopje":"Eliam","refs":["1 Kron 3:5"]},{"kopje":"Uria","refs":["2 Sam 23:39","1 Kron 11:41"]}],"4":[{"kopje":"zond boden","refs":["Gen 39:7","Job 31:9-11","Ps 50:18"]},{"kopje":"lag hij","refs":["Ps 51:3","Jak 1:14","Jak 1:15"]},{"kopje":"zij had zich","refs":["Spr 30:20"]},{"kopje":"gezuiverd","refs":["Lev 12:2-5","Lev 15:19-28","Lev 15:29-33","Lev 18:19"]}],"5":[{"kopje":"Ik ben zwanger geworden","refs":["Deut 22:22","Spr 6:34"]}],"6":[{"kopje":"Stuur","refs":["Gen 4:7","Gen 38:18-23","1 Sam 15:30","Job 20:12-14","Spr "H3318\">out</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> and there <span class=\"wl wl-kjv\" data-code=\"H310\">followed</span> him a <span class=\"wl wl-kjv\" data-code=\"H4864\">mess</span> of meat from the <span class=\"wl wl-kjv\" data-code=\"H4428\">king.</span>","9":"But <span class=\"wl wl-kjv\" data-code=\"H223\">Uriah</span> <span class=\"wl wl-kjv\" data-code=\"H7901\">slept</span> at the <span class=\"wl wl-kjv\" data-code=\"H6607\">door</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> with all the <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> of his <span class=\"wl wl-kjv\" data-code=\"H113\">lord,</span> and went not <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> to his <span class=\"wl wl-kjv\" data-code=\"H1004\">house.</span>","10":"And when they had <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H223\">Uriah</span> went not <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> unto his <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H223\">Uriah,</span> <span class=\"wl wl-kjv\" data-code=\"H935\">Camest</span> thou not from thy <span class=\"wl wl-kjv\" data-code=\"H1870\">journey?</span> why then didst thou not go <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> unto thine <span class=\"wl wl-kjv\" data-code=\"H1004\">house?</span>","11":"And <span class=\"wl wl-kjv\" data-code=\"H223\">Uriah</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H1732 \">depart.</span> So <span class=\"wl wl-kjv\" data-code=\"H223\">Uriah</span> <span class=\"wl wl-kjv\" data-code=\"H3427\">abode</span> in <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> that <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4283\">morrow.</span>","13":"And when <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> had <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> him, he did <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> and <span class=\"wl wl-kjv\" data-code=\"H8354\">drink</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> him; and he made him <span class=\"wl wl-kjv\" data-code=\"H7937\">drunk:</span> and at <span class=\"wl wl-kjv\" data-code=\"H6153\">even</span> he went <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> to <span class=\"wl wl-kjv\" data-code=\"H7901\">lie</span> on his <span class=\"wl wl-kjv\" data-code=\"H4904\">bed</span> with the <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> of his <span class=\"wl wl-kjv\" data-code=\"H113\">lord,</span> but went not <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> to his <span class=\"wl wl-kjv\" data-code=\"H1004\">house.</span>","14":"And it came to pass in the <span class=\"wl wl-kjv\" data-code=\"H1242\">morning,</span> that <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H3789\">wrote</span> a <span class=\"wl wl-kjv\" data-code=\"H5612\">letter</span> to <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab,</span> and <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> it by the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of <span class=\"wl wl-kjv\" data-code=\"H223\">Uriah.</span>","15":"And he <span class=\"wl wl-kjv\" data-code=\"H3789\">wrote</span> in the <span class=\"wl wl-kjv\" data-code=\"H5612\">letter,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">sayi e=\"H7993\">cast</span> a <span class=\"wl wl-kjv\" data-code=\"H6400\">piece</span> of a <span class=\"wl wl-kjv\" data-code=\"H7393\">millstone</span> upon him from the <span class=\"wl wl-kjv\" data-code=\"H2346\">wall,</span> that he <span class=\"wl wl-kjv\" data-code=\"H4191\">died</span> in <span class=\"wl wl-kjv\" data-code=\"H8405\">Thebez?</span> why went ye <span class=\"wl wl-kjv\" data-code=\"H5066\">nigh</span> the <span class=\"wl wl-kjv\" data-code=\"H2346\">wall?</span> then <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> thou, Thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> <span class=\"wl wl-kjv\" data-code=\"H223\">Uriah</span> the <span class=\"wl wl-kjv\" data-code=\"H2850\">Hittite</span> is <span class=\"wl wl-kjv\" data-code=\"H4191\">dead</span> also.","22":"So the <span class=\"wl wl-kjv\" data-code=\"H4397\">messenger</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">went,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> and <span class=\"wl wl-kjv\" data-code=\"H5046\">shewed</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> all that <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab</span> had <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> him for.","23":"And the <span class=\"wl wl-kjv\" data-code=\"H4397\">messenger</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> Surely the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> <span class=\"wl wl-kjv\" data-code=\"H1396\">prevailed</span> against us, and came <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> unto us into the <span class=\"wl wl-kjv\" data-code=\"H7704\">field,</span> and we were upon them even unto the <span class=\"wl wl-kjv\" data-code=\"H6607\">entering</span> of the <span class=\"wl wl-kjv\" data-code=\"H8179\">gate.</span>","24":"And the <span class=\"wl wl-kjv\" data-code=\"H3384\">shooters</span> <span class=\"wl wl-kjv\" data-code=\"H3384\">shot</span> from off the <span class=\"wl wl-kjv\" data-code=\"H2346\">wall</span> upon thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servants;</span> and some of the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> be <span class=\"wl wl-kjv\" data-code=\"H4191\">dead,</span> and thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> <span class=\"wl wl-kjv\" data-code=\"H223\">Uriah</span> the <span class=\"wl wl-kjv\" data-code=\"H2850\">Hittite</span> is <span class=\"wl wl-kjv\" data-code=\"H4191\">dead</span> also.","25":"Then <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto the <span class=\"wl wl-kjv\" data-code=\"H4397\">messenger,</span> Thus shalt thou <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> unto <span class=\"wl wl-kjv\" data-code=\"H3097\">Joab,</span> Let not this <span class=\"wl wl-kjv\" data-code=\"H1697\">thing</span> <span class=\"wl wl-kjv\" data-code=\"H3415\">displease</span> thee, for the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword</span> <span class=\"wl wl-kjv\" data-code=\"H398\">devoureth</span> one as well as <span class=\"wl wl-kjv\" data-code=\"H2090\">another:</span> make thy <span class=\"wl wl-kjv\" data-code=\"H4421\">battle</span> more <span class=\"wl wl-kjv\" data-code=\"H2388\">strong</span> against the <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> and <span class=\"wl wl-kjv\" data-code=\"H2040\">overthrow</span> it: and <span class=\"wl wl-kjv\" data-code=\"H2388\">encourage</span> thou him.","26":"And when the <span class=\"wl wl-kjv\" data-code=\"H802\">wife</span> of <span class=\"wl wl-kjv\" data-code=\"H223\">Uriah</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> that <span class=\"wl wl-kjv\" data-code=\"H223\">Uriah</span> her <span class=\"wl wl-kjv\" data-code=\"H3 :[{"catchword":"men zeide","tekst":"Hebreeuws, hij zeide. Dat is, iemand van zijn hofgezin zeide."},{"catchword":"Is dat niet","tekst":"Hij wil zeggen dat het zekerlijk Bathseba was. Zie van zulk vragen Jdg 4:6, en boven, 2Sa 10:3."},{"catchword":"Bathséba,","tekst":"Anders genoemd Bathsua, 1Ch 3:5."},{"catchword":"Eliam,","tekst":"Anders genoemd Ammiël; 1Ch 3:5."},{"catchword":"Hethiet?","tekst":"Maar bekeerd tot de ware religie, en daarin ijverende, gelijk te zien is onder, vs.11. Vergelijk 1Sa 26:6. Sommigen menen dat hij een Hethiet genoemd is, omdat hij bij de kinderen Heths gewoond had. Van dit volk, zie Gen 23:3, enz."}],"4":[{"catchword":"zond David boden henen,","tekst":"Niettegenstaande dat hij verstaan had, dat zij een echten had."},{"catchword":"liet haar halen","tekst":"Hebreeuws, nam haar; dat is, liet haar nemen en brengen."},{"catchword":"gezuiverd","tekst":"Hebreeuws, geheiligd; dat is, gezuiverd, gereinigd. Zie hiervan Lev 15:19-21, enz."}],"5":[{"catchword":"zond zij henen,","tekst":"Merkende dat zij zwanger geworden was van Davids bijligging."},{"catchword":"zeide","tekst":"Dat is, liet hem zeggen."}],"7":[{"catchword":"welstand van Joab,","tekst":"Hebreeuws, naar den vrede; en zo in het volgende. Zie boven, 2Sa 8:10, en Gen 43:27."}],"8":[{"catchword":"was uw voeten","tekst":"Zie Gen 18:4."},{"catchword":"volgde hem een gerecht des konings achterna","tekst":"Hebreeuws, ging een gerecht des konings achter hem uit. Versta een gerecht van des konings tafel, waardoor David Uria wilde verwekken om zich met zijn vrouw vrolijk te maken en bij haar te slapen, om daarna te doen geloven dat Uria des kinds vader was, en alzo zijn overspel voor de mensen te verbergen."}],"10":[{"catchword":"reis?","tekst":"Hebreeuws, weg."}],"11":[{"catchword":"ark,","tekst":"Die zij in zware oorlogen plachten mede te nemen, om, in den nood zijnde, den Heere raad te vragen, gelijk te zien is Num 31:6, 1Sa 4:4, en 1Sa 14:18, hoewel zulks ten aanzien der huichelaars [die onge // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

document.addEventListener('click', e => {

  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');

    toast.classList.add('zichtbaar');

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}

    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
