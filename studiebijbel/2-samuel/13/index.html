naam":"Openbaring","href":"../../openbaring/1/"}],"slugmap":{"Gen":"genesis","Ex":"exodus","Lev":"leviticus","Num":"numeri","Deut":"deuteronomium","Joz":"jozua","Richt":"richteren","Ruth":"ruth","1 Sam":"1-samuel","2 Sam":"2-samuel","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Het gebeurde daarna dat Absalom, Davids zoon, een mooie zuster had, wier naam Thamar was, en Amnon, Davids zoon, kreeg haar lief.","2":"En Amnon werd zo door haar in beslag genomen dat hij er ziek van werd, vanwege zijn zuster Thamar; want zij was een maagd, zodat het in Amnons ogen onmogelijk leek haar iets te doen.","3":"Maar Amnon had een vriend, wiens naam Jonadab was, een zoon van Simea, Davids broer; en Jonadab was een zeer sluwe man.","4":"Die zei tegen hem: Waarom bent u, dag na dag, zo mager, u koningszoon, zult u het mij niet vertellen? Toen zei Amnon tegen hem: Ik heb Thamar, de zuster van mijn broer Absalom, lief.","5":"En Jonadab zei tegen hem: Ga liggen op uw bed, en doe alsof u ziek bent; als dan uw vader komt om u te zien, zeg dan tegen hem: Laat toch mijn zuster Thamar komen, dat zij mij brood laat eten, en het voedsel voor mijn ogen klaarmaakt, zodat ik het zie, en het uit haar hand eet.","6":"Amnon legde zich toen neer, en deed alsof hij ziek was. Toen nu de koning kwam om hem te zien, zei Amnon tegen de koning: Laat toch mijn zuster Thamar komen, dat zij twee koekjes voor mijn ogen klaarmaakt, en ik ze uit haar hand eet.","7":"Toen zond David iemand naar Thamar in het huis, en zei: Ga toch naar het huis van uw broer Amnon, en maak voor hem voedsel klaar.","8":"En Thamar ging naar het huis van haar broer Amnon (hij lag namelijk neer), en zij nam deeg, en kneedde het, en maakte er voor zijn ogen koekjes van, en bakte de koekjes.","9":"En zij nam een pan, en goot ze voor hem uit; maar hij weigerde te eten. En Amnon zei: Laat iedereen bij mij weggaan. En iedereen ging bij hem weg.","10":"Toen zei Amnon tegen Thamar: Breng het voedsel in de kamer, dat ik het uit uw hand eet; zo nam Thamar de koekjes die zij gemaakt had, en bracht ze haar broer Amnon in de kamer.","11":"Toen zij ze naar hem toe bracht om te eten, greep hij haar vast, en zei tegen haar: Kom, lig bij mij, mijn zuster!","12":"Maar zij zei tegen hem: Nee, mijn broer, verkracht mij niet, want zo doet men niet in Israël; doe deze dwaasheid niet.","13":"Want ik, waarheen zou ik mijn schande brengen? En u, u zou zijn als een van de dwazen in Israël; spreek toch nu met de koning, want hij zal mij niet aan u onthouden.","14":"Doch hij wilde niet naar haar luisteren; maar omdat hij sterker was dan zij, verkrachtte hij haar, en lag bij haar.","15":"Daarna haatte Amnon haar met een zeer grote haat; want de haat waarmee hij haar haatte, was groter dan de liefde waarmee hij haar had liefgehad; en Amnon zei tegen haar: Sta op, ga weg.","16":"Toen zei zij tegen hem: Er is geen reden om mij weg te sturen; dit kwaad zou groter zijn dan het andere dat u mij hebt aangedaan; maar hij wilde niet naar haar luisteren.","17":"En hij riep zijn knecht die hem diende, en zei: Stuur haar naar buiten, weg van mij, en grendel de deur achter haar dicht.","18":"Zij droeg een veelkleurige mantel; want zo werden de dochters van de koning die nog maagd waren gekleed. En zijn dienaar bracht haar naar buiten, en grendelde de deur achter haar dicht.","19":"Toen nam Thamar as en strooide die op haar hoofd, en scheurde de veelkleurige mantel die zij aanhad; en zij legde haar hand op haar hoofd, en liep luid schreiend weg.","20":"En haar broer Absalom zei tegen haar: Is uw broer Amnon bij u geweest? Nu dan, mijn zuster, zwijg stil, hij is uw broer; zet uw hart niet op deze zaak. Zo bleef Thamar, eenzaam, in het huis van haar broer Absalom.","21":"Toen koning David al deze dingen hoorde, werd hij zeer boos.","22":"Doch Absalom sprak niet met Amnon, noch kwaad noch goed; maar Absalom haatte Amnon, vanwege het feit dat hij zijn zuster Thamar verkracht had.","23":"En het gebeurde, na twee volle jaren, dat Absalom schaapscheerders had bij Baäl-Hazor, dat bij Efraïm ligt; en Absalom nodigde alle zonen van de koning uit.","24":"En Absalom kwam bij de koning, en zei: Zie, uw knecht heeft nu schaapscheerders; laat toch de koning en zijn knechten met uw knecht meegaan.","25":"Maar de koning zei tegen Absalom: Nee, mijn zoon, laten we toch niet allemaal samen gaan, opdat wij u niet tot last zijn; en hij drong bij hem aan, doch hij wilde niet gaan, maar zegende hem.","26":"Toen zei Absalom: Als het dan niet kan, laat toch mijn broer Amnon met ons meegaan. Maar de koning zei tegen hem: Waarom zou hij met u meegaan?","27":"Toen Absalom bij hem aandrong, liet hij Amnon en alle zonen van de koning met hem meegaan.","28":"Absalom nu gebood zijn knechten: Let er nu op, wanneer Amnons hart vrolijk is van de wijn, en ik tegen u zeg: Sla Amnon neer, dan zult u hem doden; wees niet bang; heb ik het u niet geboden? Wees sterk en wees dapper.","29":"En Absaloms knechten deden met Amnon zoals Absalom geboden had. Toen stonden alle zonen van de koning op, en reden ieder op zijn muildier, en vluchtten.","30":"En het gebeurde, terwijl zij onderweg waren, dat het gerucht David bereikte, dat men zei: Absalom heeft alle zonen van de koning gedood, en er is niet één van hen overgebleven.","31":"Toen stond de koning op, en scheurde zijn kleren, en ging op de grond liggen; en al zijn knechten stonden erbij met gescheurde kleren.","32":"Maar Jonadab, de zoon van Simea, Davids broer, antwoordde en zei: Mijn heer moet niet denken dat zij alle jongemannen, de zonen van de koning, gedood hebben; maar Amnon alleen is dood; want Absalom had dit van tevoren zo besloten, vanaf de dag dat hij zijn zuster Thamar verkracht heeft.","33":"Zo moet mijn heer de koning nu de zaak niet ter harte nemen, door te denken dat alle zonen van de koning dood zijn; want Amnon alleen is dood.","34":"Absalom nu vluchtte; en de knecht die de wacht hield, hief zijn ogen op, en keek toe, en zie, er kwam veel volk van de weg achter hem, aan de kant van het gebergte.","35":"Toen zei Jonadab tegen de koning: Zie, de zonen van de koning komen; zoals uw knecht gezegd heeft, zo is het gebeurd.","36":"En het gebeurde, toen hij was uitgesproken, zie, dat de zonen van de koning kwamen, en hun stemmen verhieven en huilden; en de koning ook, en al zijn knechten, huilden zeer luid.","37":"(Absalom nu vluchtte, en ging naar Thalmai, de zoon van Ammihur, koning van Gesur.) En hij droeg rouw over zijn zoon, al die dagen.","38":"Zo vluchtte Absalom, en ging naar Gesur; en hij was daar drie jaar.","39":"Toen verlangde de ziel van koning David er zeer naar om naar Absalom uit te gaan; want hij had zich getroost over Amnon, omdat die dood was."},"SV":{"1":"En het geschiedde daarna, alzo Absalom, Davids zoon, een schone zuster had, welker naam was Thamar, dat Amnon, Davids zoon, haar lief kreeg.","2":"En Amnon was benauwd tot krank wordens toe, om zijner zuster Thamars wil; want zij was een maagd, zodat het in Amnons ogen zwaar was, haar iets te doen.","3":"Doch Amnon had een vriend, wiens naam was Jonadab, een zoon van Simea, Davids broeder; en Jonadab was een zeer wijs man.","4":"Die zeide tot hem: Waarom zijt gij van morgen tot morgen zo mager, gij koningszoon, zult gij het mij niet te kennen geven? Toen zeide Amnon tot hem: Ik heb Thamar, de zuster van mijn broeder Absalom, lief.","5":"En Jonadab zeide tot hem: Leg u op uw leger, en maak u krank; als dan uw vader zal komen om u te zien, zo zult gij tot hem zeggen: Dat toch mijn zuster Thamar kome, dat zij mij met brood spijzige, en de spijze voor mijn ogen toemake, opdat ik het aanzie, en van haar hand ete.","6":"Amnon dan leide zich, en maakte zich krank. Toen nu de koning kwam om hem te zien, zeide Amnon tot den koning: Dat toch mijn zuster Thamar kome, dat zij twee koekjes voor mijn ogen toemake, en ik van haar hand ete.","7":"Toen zond David heen tot Thamar in het huis, zeggende: Ga toch heen in het huis van uw broeder Amnon, en maak hem een spijze.","8":"En Thamar ging heen in het huis van haar broeder Amnon, ( hij nu was nederliggende), en zij nam deeg, en kneedde het, en maakte koekjes toe voor zijn ogen, en bakte de koekjes.","9":"En zij nam een pan, en goot ze uit voor zijn aangezicht; maar hij weigerde te eten. En Amnon zeide: Doet alle man van mij uitgaan. En alle man ging van hem uit.","10":"Toen zeide Amnon tot Thamar: Breng de spijze in de kamer, dat ik van uw hand ete; zo nam Thamar de koekjes, die zij gemaakt had, en bracht ze haar broeder Amnon in de kamer.","11":"Als zij ze nu tot hem nabij bracht, dat hij ate, zo greep hij haar, en zeide tot haar: Kom, lig bij mij, mijn zuster!","12":"Maar zij zeide tot hem: Niet, mijn broeder, verkracht mij niet, want alzo doet men niet in Israël; doe deze dwaasheid niet.","13":"Want ik, waarhenen zou ik mijn schande brengen? En gij, gij zoudt zijn als een der dwazen in Israël; zo spreek toch nu tot den koning, want hij zal mij van u niet onthouden.","14":"Doch hij wilde naar haar stem niet horen; maar sterker zijnde dan zij, zo verkrachtte hij haar, en lag bij haar.","15":"Daarna haatte haar Amnon met een zeer groten haat; want de haat, waarmede hij haar haatte, was groter dan de liefde, waarmede hij haar had liefgehad; en Amnon zeide tot haar: Maak u op, ga weg.","16":"Toen zeide zij tot hem: Er zijn geen oorzaken om mij uit te drijven; dit kwaad zou groter zijn dan het andere, dat gij bij mij gedaan hebt; maar hij wilde naar haar niet horen.","17":"En hij riep zijn jongen, die hem diende, en zeide: Drijf nu deze van mij uit naar buiten, en grendel de deur achter haar toe.","18":"Zij nu had een veelvervigen rok aan; want alzo werden des konings dochteren, die maagden waren, met mantels gekleed; en zijn dienaar bracht haar uit tot buiten, en grendelde de deur achter haar toe.","19":"Toen nam Thamar as op haar hoofd, en scheurde den veelvervigen rok, dien zij aanhad; en zij leide haar hand op haar hoofd, en ging vast henen en kreet.","20":"En haar broeder Absalom zeide tot haar: Is uw broeder Amnon bij u geweest? Nu dan, mijn zuster, zwijg stil, hij is uw broeder; zet uw hart niet op deze zaak. Alzo bleef Thamar en was eenzaam in het huis van haar broeder Absalom.","21":"Als de koning David al deze dingen hoorde, zo ontstak hij zeer.","22":"Doch Absalom sprak niet met Amnon, noch kwaad noch goed; maar Absalom haatte Amnon, ter oorzake dat hij zijn zuster Thamar verkracht had.","23":"En het geschiedde, na twee volle jaren, dat Absalom, *schaaps* scheerders had te Baäl-hazor, dat bij Efraïm is; zo nodigde Absalom al des konings zonen.","24":"En Absalom kwam tot den koning, en zeide: Zie, nu heeft uw knecht *schaaps* scheerders; dat toch de koning en zijn knechten met uw knecht gaan.","25":"Maar de koning zeide tot Absalom: Niet, mijn zoon, laat ons toch niet al te zamen gaan, opdat wij u niet bezwaarlijk zijn; en hij hield bij hem aan, doch hij wilde niet gaan, maar zegende hem.","26":"Toen zeide Absalom: Zo niet, laat toch mijn broeder Amnon met ons gaan. Maar de koning zeide tot hem: Waarom zou hij met u gaan?","27":"Als Absalom bij hem aanhield, zo liet hij Amnon en al des konings zonen met hem gaan.","28":"Absalom nu gebood zijn jongens, zeggende: Let er nu op, als Amnons hart vrolijk is van den wijn, en ik tot ulieden zal zeggen: Slaat Amnon, dan zult gij hem doden; vreest niet; is het niet, omdat ik het u geboden heb? Zijt sterk en weest dapper.","29":"En Absaloms jongens deden aan Amnon, gelijk als Absalom geboden had. Toen stonden alle zonen des konings op, en reden een iegelijk op zijn muildier, en vloden.","30":"En het geschiedde, als zij op den weg waren, dat het gerucht tot David kwam, dat men zeide: Absalom heeft al de zonen des konings geslagen, en er is niet een van hen overgelaten.","31":"Toen stond de koning op, en scheurde zijn klederen, en leide zich neder ter aarde; desgelijks stonden al zijn knechten met gescheurde klederen.","32":"Maar Jonadab, de zoon van Simea, Davids broeder, antwoordde en zeide: Mijn heer zegge niet, dat zij al de jongelingen, des konings zonen, gedood hebben; maar Amnon alleen is dood; want bij Absalom is er op toegeleid, van den dag af, dat hij zijn zuster Thamar verkracht heeft.","33":"Zo neme nu mijn heer de koning de zaak niet in zijn hart, denkende: al des konings zonen zijn dood; want Amnon alleen is dood.","34":"Absalom nu vluchtte; en de jongen, die de wacht hield, hief zijn ogen op, en zag toe, en ziet, er kwam veel volks van den weg achter hem, aan de zijde van het gebergte.","35":"Toen zeide Jonadab tot den koning: Zie, de zonen des konings komen; naar het woord uws knechts, alzo is het geschied.","36":"En het geschiedde, als hij geëindigd had te spreken, ziet, zo kwamen de zonen des konings, en hieven hun stemmen op en weenden; en de koning ook en al zijn knechten weenden met een zeer groot geween.","37":"( Absalom dan vluchtte, en toog tot Thalmai, den zoon van Ammihur, koning van Gesur.) En hij droeg rouw over zijn zoon, al die dagen.","38":"Alzo vluchtte Absalom, en toog naar Gesur; en hij was aldaar drie jaren.","39":"Toen verlangde *de* *ziel* van den koning David zeer om naar Absalom uit te trekken; want hij had zich getroost over Amnon, dat hij dood was."},"KJV":{"1":"And it came to pass after this, that Absalom the son of David had a fair sister, whose name was Tamar; and Amnon the son of David loved her.","2":"And Amnon was so vexed, that he fell sick for his sister Tamar; for she was a virgin; and Amnon thought it hard for him to do any thing to her.","3":"But Amnon had a friend, whose name was Jonadab, the son of Shimeah David's brother: and Jonadab was a very subtil man.","4":"And he said unto him, Why art thou, being the king's son, lean from day to day? wilt thou not tell me? And Amnon said unto him, I love Tamar, my brother Absalom's sister.","5":"And Jonadab said unto him, Lay thee down on thy bed, and make thyself sick: and when thy father cometh to see thee, say unto him, I pray thee, let my sister Tamar come, and give me meat, and dress the meat in my sight, that I may see it, and eat it at her hand.","6":"So Amnon lay down, and made himself sick: and when the king was come to see him, Amnon said unto the king, I pray thee, let Tamar my sister come, and make me a couple of cakes in my sight, that I may eat at her hand.","7":"Then David sent home to Tamar, saying, Go now to thy brother Amnon's house, and dress him meat.","8":"So Tamar went to her brother Amnon's house; and he was laid down. And she took flour, and kneaded it, and made cakes in his sight, and did bake the cakes.","9":"And she took a pan, and poured them out before him; but he refused to eat. And Amnon said, Have out all men from me. And they went out every man from him.","10":"And Amnon said unto Tamar, Bring the meat into the chamber, that I may eat of thine hand. And Tamar took the cakes which she had made, and brought them into the chamber to Amnon her brother.","11":"And when she had brought them unto him to eat, he took hold of her, and said unto her, Come lie with me, my sister.","12":"And she answered him, Nay, my brother, do not force me; for no such thing ought to be done in Israel: do not thou this folly.","13":"And I, whither shall I cause my shame to go? and as for thee, thou shalt be as one of the fools in Israel. Now therefore, I pray thee, speak unto the king; for he will not withhold me from thee.","14":"Howbeit he would not hearken unto her voice: but, being stronger than she, forced her, and lay with her.","15":"Then Amnon hated her exceedingly; so that the hatred wherewith he hated her was greater than the love wherewith he had loved her. And Amnon said unto her, Arise, be gone.","16":"And she said unto him, There is no cause: this evil in sending me away is greater than the other that thou didst unto me. But he would not hearken unto her.","17":"Then he called his servant that ministered unto him, and said, Put now this woman out from me, and bolt the door after her.","18":"And she had a garment of divers colours upon her: for with such robes were the king's daughters that were virgins apparelled. Then his servant brought her out, and bolted the door after her.","19":"And Tamar put ashes on her head, and rent her garment of divers colours that was on her, and laid her hand on her head, and went on crying.","20":"And Absalom her brother said unto her, Hath Amnon thy brother been with thee? but hold now thy peace, my sister: he is thy brother; regard not this thing. So Tamar remained desolate in her brother Absalom's house.","21":"But when king David heard of all these things, he was very wroth.","22":"And Absalom spake unto his brother Amnon neither good nor bad: for Absalom hated Amnon, because he had forced his sister Tamar.","23":"And it came to pass after two full years, that Absalom had sheepshearers in Baalhazor, which is beside Ephraim: and Absalom invited all the king's sons.","24":"And Absalom came to the king, and said, Behold now, thy servant hath sheepshearers; let ➔ the king, I beseech thee, and his servants go with thy servant.","25":"And the king said to Absalom, Nay, my son, let us not all now go, lest we be chargeable unto thee. And he pressed him: howbeit he would not go, but blessed him.","26":"Then said Absalom, If not, I pray thee, let my brother Amnon go with us. And the king said unto him, Why should he go with thee?","27":"But Absalom pressed him, that he let Amnon and all the king's sons go with him.","28":"Now Absalom had commanded his servants, saying, Mark ye now when Amnon's heart is merry with wine, and when I say unto you, Smite Amnon; then kill him, fear not: have not I commanded you? be courageous, and be valiant.","29":"And the servants of Absalom did unto Amnon as Absalom had commanded. Then all the king's sons arose, and every man gat him up upon his mule, and fled.","30":"And it came to pass, while they were in the way, that tidings came to David, saying, Absalom hath slain all the king's sons, and there is not one of them left.","31":"Then the king arose, and tare his garments, and lay on the earth; and all his servants stood by with their clothes rent.","32":"And Jonadab, the son of Shimeah David's brother, answered and said, Let not my lord suppose that they have slain all the young men the king's sons; for Amnon only is dead: for by the appointment of Absalom this hath been determined from the day that he forced his sister Tamar.","33":"Now therefore let not my lord the king take the thing to his heart, to think that all the king's sons are dead: for Amnon only is dead.","34":"But Absalom fled. And the young man that kept the watch lifted up his eyes, and looked, and, behold, there came much people by the way of the hill side behind him.","35":"And Jonadab said unto the king, Behold, the king's sons come: as thy servant said, so it is.","36":"And it came to pass, as soon as he had made an end of speaking, that, behold, the king's sons came, and lifted up their voice and wept: and the king also and all =\"L3\" data-code=\"H3212\">en</span> ging <span class=\"wl\" data-l=\"L4\" data-code=\"H1650\">naar</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H1650\">Gesur</span>; <span class=\"wl\" data-l=\"L5\" data-code=\"H1961\">en</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H1961\">hij</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H1961\">was</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H8033\">daar</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H7969\">drie</span> jaar.","39":"<span class=\"wl\" data-l=\"L1\" data-code=\"H3615\">Toen</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H3615\">verlangde</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H3615\">de</span> ziel <span class=\"wl\" data-l=\"L2\" data-code=\"H4428\">van</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H4428\">koning</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H1732\">David</span> er <span class=\"wl\" data-l=\"L4\" data-code=\"H413\">zeer</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H413\">naar</span> om <span class=\"wl\" data-l=\"L5\" data-code=\"H53\">naar</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H53\">Absalom</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H53\">uit</span> te gaan; <span class=\"wl\" data-l=\"L6\" data-code=\"H3588\">want</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H5162\">hij</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H5162\">had</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H5162\">zich</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H5162\">getroost</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H5162\">over</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H550\">Amnon</span>, omdat die <span class=\"wl\" data-l=\"L9\" data-code=\"H4191\">dood</span> <span class=\"wl\" data-l=\"L9\" data-code=\"H4191\">was</span>."},"koppeling_kjv":{"1":"And it came to pass <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> this, that <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> had a <span class=\"wl wl-kjv\" data-code=\"H3303\">fair</span> <span class=\"wl wl-kjv\" data-code=\"H269\">sister,</span> whose <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> was <span class=\"wl wl-kjv\" data-code=\"H8559\">Tamar;</span> and <span class=\"wl wl-kjv\" data-code=\"H550\">Amnon</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H157\">loved</span> her.","2":"And <span class=\"wl wl-kjv\" data-code=\"H550\">Amnon</span> was so <span class=\"wl wl-kjv\" data-code=\"H3334\">vexed,</span> that he fell <span class=\"wl wl-kjv\" data-code=\"H2470\">sick</span> for his <span class=\"wl wl-kjv\" data-code=\"H269\">sister</span> <span class=\"wl wl-kjv\" data-code=\"H8559\">Tamar;</span> for she was a <span class=\"wl wl-kjv\" data-code=\"H1330\">virgin;</span> and <span class=\"wl wl-kjv\" data-code=\"H550\">Amnon</span> <span class=\"wl wl-kjv\" data-code=\"H5869\">thought</span> it <span class=\"wl wl-kjv\" data-code=\"H6381\">hard</span> for him to <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> any <span class=\"wl wl-kjv\" data-code=\"H3972\">thing</span> to her.","3":"But <span class=\"wl wl-kjv\" data-code=\"H550\">Amnon</span> had a <span class=\"wl wl-kjv\" data-code=\"H7453\">friend,</span> whose <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> was <span class=\"wl wl-kjv\" data-code=\"H3122\">Jonadab,</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H8093\">Shimeah</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David's</span> <span class=\"wl wl-kjv\" data-code=\"H251\">brother:</span> and <span class=\"wl wl-kjv\" data-code=\"H3122\">Jonadab</span> was a <span class=\"wl wl-kjv\" data-code=\"H3966\">very</span> <span class=\"wl wl-kjv\" data-code=\"H2450\">subtil</span> <span class=\"wl wl-kjv\" data-code=\"H376\">man.</span>","4":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, Why art thou, being the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">son,</span> <span class=\"wl wl-kjv\" data-code=\"H1800\">lean</span> from <span class=\"wl wl-kjv\" data-code=\"H1242\">day</span> to <span class=\"wl wl-kjv\" data-code=\"H1242\">day?</span> wilt thou not <span class=\"wl wl-kjv\" data-code=\"H5046\">tell</span> me? And <span class=\"wl wl-kjv\" data-code=\"H550\">Amnon</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, I <span class=\"wl wl-kjv\" data-code=\"H157\">love</span> <span class=\"wl wl-kjv\" data-code=\"H8559\">Tamar,</span> my <span class=\"wl wl-kjv\" data-code=\"H251\">brother</span> <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom's</span> <span class=\"wl wl-kjv\" data-code=\"H269\">sister.</span>","5":"And <span class=\"wl wl-kjv\" data-code=\"H3082\">Jonadab</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, Lay thee <span class=\"wl wl-kjv\" data-code=\"H7901\">down</span> on thy <span class=\"wl wl-kjv\" data-code=\"H4904\">bed,</span> and make thyself <span class=\"wl wl-kjv\" data-code=\"H2470\">sick:</span> and when thy <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> <span class=\"wl wl-kjv\" data-code=\"H935\">cometh</span> to <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> thee, <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> unto him, I pray thee, let my <span class=\"wl wl-kjv\" data-code=\"H269\">sister</span> <span class=\"wl wl-kjv\" data-code=\"H8559\">Tamar</span> <span class=\"wl wl-kjv\" data-code=\"H935\">come,</span> and <span class=\"wl wl-kjv\" data-code=\"H1262\">give</span> me <span class=\"wl wl-kjv\" data-code=\"H3899\">meat,</span> and <span class=\"wl wl-kjv\" data-code=\"H6213\">dress</span> the <span class=\"wl wl-kjv\" data-code=\"H1279\">meat</span> in my <span class=\"wl wl-kjv\" data-code=\"H5869\">sight,</span> that I may <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> it, and <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> it at her <span class=\"wl wl-kjv\" data-code=\"H3027\">hand.</span>","6":"So <span class=\"wl wl-kjv\" data-code=\"H550\">Amnon</span> lay <span class=\"wl wl-kjv\" data-code=\"H7901\">down,</span> and made himself <span class=\"wl wl-kjv\" data-code=\"H2470\">sick:</span> and when the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> was <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> to <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> him, <span class=\"wl wl-kjv\" data-code=\"H550\">Amnon</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> I pray thee, let <span class=\"wl wl-kjv\" data-code=\"H8559\">Tamar</span> my <span class=\"wl wl-kjv\" data-code=\"H269\">sister</span> <span class=\"wl wl-kjv\" data-code=\"H935\">come,</span> and <span class=\"wl wl-kjv\" data-code=\"H3823\">make</span> me a <span class=\"wl wl-kjv\" data-code=\"H8147\">couple</span> of <span class=\"wl wl-kjv\" data-code=\"H3834\">cakes</span> in my <span class=\"wl wl-kjv\" data-code=\"H5869\">sight,</span> that I may <span class=\"wl wl-kjv\" data-code=\"H1262\">eat</span> at her <span class=\"wl wl-kjv\" data-code=\"H3027\">hand.</span>","7":"Then <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">home</span> to <span class=\"wl wl-kjv\" data-code=\"H8559\">Tamar,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">Go</span> now to thy <span class=\"wl wl-kjv\" data-code=\"H251\">brother</span> <span class=\"wl wl-kjv\" data-code=\"H550\">Amnon's</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> and <span class=\"wl wl-kjv\" data-code=\"H6213\">dress</span> him <span class=\"wl wl-kjv\" data-code=\"H1279\">meat.</span>","8":"So <span class=\"wl wl-kjv\" data-code=\"H8559\">Tamar</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> to her <span class=\"wl wl-kjv\" data-code=\"H251\">brother</span> <span class=\"wl wl-kjv\" data-code=\"H550\">Amnon's</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house;</span> and he was laid <span class=\"wl wl-kjv\" data-code=\"H7901\">down.</span> And she <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> <span class=\"wl wl-kjv\" data-code=\"H1217\">flour,</span> and <span class=\"wl wl-kjv\" data-code=\"H3888\">kneaded</span> it, and made <span class=\"wl wl-kjv\" data-code=\"H3823\">cakes</span> in his <span class=\"wl wl-kjv\" data-code=\"H5869\">sight,</span> and did <span class=\"wl wl-kjv\" data-code=\"H1310\">bake</span> the <span class=\"wl wl-kjv\" data-code=\"H3834\">cakes.</span>","9":"And she <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> a <span class=\"wl wl-kjv\" data-code=\"H4958\">pan,</span> and poured them <span class=\"wl wl-kjv\" data-code=\"H3332\">out</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> him; but he <span class=\"wl wl-kjv\" data-code=\"H3985\">refused</span> to <span class=\"wl wl-kjv\" data-code=\"H398\">eat.</span> And <span class=\"wl wl-kjv\" data-code=\"H550\">Amnon</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Have <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> all <span class=\"wl wl-kjv\" data-code=\"H376\">men</span> from me. And they went <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> from him.","10":"And <span class=\"wl wl-kjv\" data-code=\"H550\">Amnon</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H8559\">Tamar,</span> <span class=\"wl wl-kjv\" data-code=\"H935\">Bring</span> the <span class=\"wl wl-kjv\" data-code=\"H1279\">meat</span> into the <span class=\"wl wl-kjv\" data-code=\"H2315\">chamber,</span> that I may <span class=\"wl wl-kjv\" data-code=\"H1262\">eat</span> of thine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand.</span> And <span class=\"wl wl-kjv\" data-code=\"H8559\">Tamar</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> the <span class=\"wl wl-kjv\" data-code=\"H3834\">cakes</span> which she had <span class=\"wl wl-kjv\" data-code=\"H6213\">made,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> them into the <span class=\"wl wl-kjv\" data-code=\"H2315\">chamber</span> to <span class=\"wl wl-kjv\" data-code=\"H550\">Amnon</span> her <span class=\"wl wl-kjv\" data-code=\"H251\">brother.</span>","11":"And when she had <span class=\"wl wl-kjv\" data-code=\"H5066\">brought</span> them unto him to <span class=\"wl wl-kjv\" data-code=\"H398\">eat,</span> he took <span class=\"wl wl-kjv\" data-code=\"H2388\">hold</span> of her, and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto her, <span class=\"wl wl-kjv\" data-code=\"H935\">Come</span> <span class=\"wl wl-kjv\" data-code=\"H7901\">lie</span> with me, my <span class=\"wl wl-kjv\" data-code=\"H269\">sister.</span>","12":"And she <span class=\"wl wl-kjv\" data-code=\"H559\">answered</span> him, Nay, my <span class=\"wl wl-kjv\" data-code=\"H251\">brother,</span> do not <span class=\"wl wl-kjv\" data-code=\"H6031\">force</span> me; for no such thing <span class=\"wl wl-kjv\" data-code=\"H3651\">ought</span> to be <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> in <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel:</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> not thou this <span class=\"wl wl-kjv\" data-code=\"H5039\">folly.</span>","13":"And I, whither shall I cause my <span class=\"wl wl-kjv\" data-code=\"H2781\">shame</span> to <span class=\"wl wl-kjv\" data-code=\"H3212\">go?</span> and as for thee, thou shalt be as <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> of the <span class=\"wl wl-kjv\" data-code=\"H5036\">fools</span> in <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel.</span> Now therefore, I pray thee, <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> unto the <span class=\"wl wl-kjv\" data-code=\"H4428\">king;</span> for he will not <span class=\"wl wl-kjv\" data-code=\"H4513\">withhold</span> me from thee.","14":"Howbeit he <span class=\"wl wl-kjv\" data-code=\"H14\">would</span> not <span class=\"wl wl-kjv\" data-code=\"H8085\">hearken</span> unto her <span class=\"wl wl-kjv\" data-code=\"H6963\">voice:</span> but, being <span class=\"wl wl-kjv\" data-code=\"H2388\">stronger</span> than she, <span class=\"wl wl-kjv\" data-code=\"H6031\">forced</span> her, and <span class=\"wl wl-kjv\" data-code=\"H7901\">lay</span> with her.","15":"Then <span class=\"wl wl-kjv\" data-code=\"H550\">Amnon</span> <span class=\"wl wl-kjv\" data-code=\"H8130\">hated</span> her <span class=\"wl wl-kjv\" data-code=\"H3966\">exceedingly;</span> so that the <span class=\"wl wl-kjv\" data-code=\"H8135\">hatred</span> wherewith he <span class=\"wl wl-kjv\" data-code=\"H8130\">hated</span> her was <span class=\"wl wl-kjv\" data-code=\"H1419\">greater</span> than the <span class=\"wl wl-kjv\" data-code=\"H160\">love</span> wherewith he had <span class=\"wl wl-kjv\" data-code=\"H157\">loved</span> her. And <span class=\"wl wl-kjv\" data-code=\"H550\">Amnon</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto her, <span class=\"wl wl-kjv\" data-code=\"H6965\">Arise,</span> be <span class=\"wl wl-kjv\" data-code=\"H3212\">gone.</span>","16":"And she <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, There is no <span class=\"wl wl-kjv\" data-code=\"H182\">cause:</span> this <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> in sending me <span class=\"wl wl-kjv\" data-code=\"H7971\">away</span> is <span class=\"wl wl-kjv\" data-code=\"H1419\">greater</span> than the <span class=\"wl wl-kjv\" data-code=\"H312\">other</span> that thou <span class=\"wl wl-kjv\" data-code=\"H6213\">didst</span> unto me. But he <span class=\"wl wl-kjv\" data-code=\"H14\">would</span> not <span class=\"wl wl-kjv\" data-code=\"H8085\">hearken</span> unto her.","17":"Then he <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> his <span class=\"wl wl-kjv\" data-code=\"H5288\">servant</span> that <span class=\"wl wl-kjv\" data-code=\"H8334\">ministered</span> unto him, and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">Put</span> now this woman <span class=\"wl wl-kjv\" data-code=\"H2351\">out</span> from me, and <span class=\"wl wl-kjv\" data-code=\"H5274\">bolt</span> the <span class=\"wl wl-kjv\" data-code=\"H1817\">door</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> her.","18":"And she had a <span class=\"wl wl-kjv\" data-code=\"H3801\">garment</span> of divers <span class=\"wl wl-kjv\" data-code=\"H6446\">colours</span> upon her: for with such <span class=\"wl wl-kjv\" data-code=\"H4598\">robes</span> were the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters</span> that were <span class=\"wl wl-kjv\" data-code=\"H1330\">virgins</span> <span class=\"wl wl-kjv\" data-code=\"H3847\">apparelled.</span> Then his <span class=\"wl wl-kjv\" data-code=\"H8334\">servant</span> <span class=\"wl wl-kjv\" data-code=\"H3318\">brought</span> her <span class=\"wl wl-kjv\" data-code=\"H2351\">out,</span> and <span class=\"wl wl-kjv\" data-code=\"H5274\">bolted</span> the <span class=\"wl wl-kjv\" data-code=\"H1817\">door</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> her.","19":"And <span class=\"wl wl-kjv\" data-code=\"H8559\">Tamar</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">put</span> <span class=\"wl wl-kjv\" data-code=\"H665\">ashes</span> on her <span class=\"wl wl-kjv\" data-code=\"H7218\">head,</span> and <span class=\"wl wl-kjv\" data-code=\"H7167\">rent</span> her <span class=\"wl wl-kjv\" data-code=\"H3801\">garment</span> of divers <span class=\"wl wl-kjv\" data-code=\"H6446\">colours</span> that was on her, and <span class=\"wl wl-kjv\" data-code=\"H7760\">laid</span> her <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> on her <span class=\"wl wl-kjv\" data-code=\"H7218\">head,</span> and <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> <span class=\"wl wl-kjv\" data-code=\"H1980\">on</span> <span class=\"wl wl-kjv\" data-code=\"H2199\">crying.</span>","20":"And <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom</span> her <span class=\"wl wl-kjv\" data-code=\"H251\">brother</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto her, Hath <span class=\"wl wl-kjv\" data-code=\"H550\">Amnon</span> thy <span class=\"wl wl-kjv\" data-code=\"H251\">brother</span> been with thee? but hold now thy <span class=\"wl wl-kjv\" data-code=\"H2790\">peace,</span> my <span class=\"wl wl-kjv\" data-code=\"H269\">sister:</span> he is thy <span class=\"wl wl-kjv\" data-code=\"H251\">brother;</span> <span class=\"wl wl-kjv\" data-code=\"H7896\">regard</span> not this <span class=\"wl wl-kjv\" data-code=\"H1697\">thing.</span> So <span class=\"wl wl-kjv\" data-code=\"H8559\">Tamar</span> <span class=\"wl wl-kjv\" data-code=\"H3427\">remained</span> <span class=\"wl wl-kjv\" data-code=\"H8074\">desolate</span> in her <span class=\"wl wl-kjv\" data-code=\"H251\">brother</span> <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom's</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house.</span>","21":"But when <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> of all these <span class=\"wl wl-kjv\" data-code=\"H1697\">things,</span> he was <span class=\"wl wl-kjv\" data-code=\"H3966\">very</span> <span class=\"wl wl-kjv\" data-code=\"H2734\">wroth.</span>","22":"And <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> unto his brother <span class=\"wl wl-kjv\" data-code=\"H550\">Amnon</span> neither <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> nor <span class=\"wl wl-kjv\" data-code=\"H7451\">bad:</span> for <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom</span> <span class=\"wl wl-kjv\" data-code=\"H8130\">hated</span> <span class=\"wl wl-kjv\" data-code=\"H550\">Amnon,</span> <span class=\"wl wl-kjv\" data-code=\"H1697\">because</span> he had <span class=\"wl wl-kjv\" data-code=\"H6031\">forced</span> his <span class=\"wl wl-kjv\" data-code=\"H269\">sister</span> <span class=\"wl wl-kjv\" data-code=\"H8559\">Tamar.</span>","23":"And it came to pass after two <span class=\"wl wl-kjv\" data-code=\"H3117\">full</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years,</span> that <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom</span> had <span class=\"wl wl-kjv\" data-code=\"H1494\">sheepshearers</span> in <span class=\"wl wl-kjv\" data-code=\"H1178\">Baalhazor,</span> which is beside <span class=\"wl wl-kjv\" data-code=\"H669\">Ephraim:</span> and <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom</span> <span class=\"wl wl-kjv\" data-code=\"H7121\">invited</span> all the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">sons.</span>","24":"And <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Behold now, thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> hath <span class=\"wl wl-kjv\" data-code=\"H1494\">sheepshearers;</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">let</span> ➔ the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> I beseech thee, and his <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> with thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant.</span>","25":"And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom,</span> Nay, my <span class=\"wl wl-kjv\" data-code=\"H1121\">son,</span> let us not all now <span class=\"wl wl-kjv\" data-code=\"H3212\">go,</span> lest we be <span class=\"wl wl-kjv\" data-code=\"H3513\">chargeable</span> unto thee. And he <span class=\"wl wl-kjv\" data-code=\"H6555\">pressed</span> him: howbeit he <span class=\"wl wl-kjv\" data-code=\"H14\">would</span> not <span class=\"wl wl-kjv\" data-code=\"H3212\">go,</span> but <span class=\"wl wl-kjv\" data-code=\"H1288\">blessed</span> him.","26":"Then <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom,</span> If not, I pray thee, let my <span class=\"wl wl-kjv\" data-code=\"H251\">brother</span> <span class=\"wl wl-kjv\" data-code=\"H550\">Amnon</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> with us. And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, Why should he <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> with thee?","27":"But <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom</span> <span class=\"wl wl-kjv\" data-code=\"H6555\">pressed</span> him, that he let <span class=\"wl wl-kjv\" data-code=\"H550\">Amnon</span> and all the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">go</span> with him.","28":"Now <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom</span> had <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> his <span class=\"wl wl-kjv\" data-code=\"H5288\">servants,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">Mark</span> ye now when <span class=\"wl wl-kjv\" data-code=\"H550\">Amnon's</span> <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> is <span class=\"wl wl-kjv\" data-code=\"H2896\">merry</span> with <span class=\"wl wl-kjv\" data-code=\"H3196\">wine,</span> and when I <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> unto you, <span class=\"wl wl-kjv\" data-code=\"H5221\">Smite</span> <span class=\"wl wl-kjv\" data-code=\"H550\">Amnon;</span> then <span class=\"wl wl-kjv\" data-code=\"H4191\">kill</span> him, <span class=\"wl wl-kjv\" data-code=\"H3372\">fear</span> not: have not I <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> you? be <span class=\"wl wl-kjv\" data-code=\"H2388\">courageous,</span> and be <span class=\"wl wl-kjv\" data-code=\"H1121\">valiant.</span>","29":"And the <span class=\"wl wl-kjv\" data-code=\"H5288\">servants</span> of <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> unto <span class=\"wl wl-kjv\" data-code=\"H550\">Amnon</span> as <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom</span> had <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded.</span> Then all the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> <span class=\"wl wl-kjv\" data-code=\"H6965\">arose,</span> and every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> gat him <span class=\"wl wl-kjv\" data-code=\"H7392\">up</span> upon his <span class=\"wl wl-kjv\" data-code=\"H6505\">mule,</span> and <span class=\"wl wl-kjv\" data-code=\"H5127\">fled.</span>","30":"And it came to pass, while they were in the <span class=\"wl wl-kjv\" data-code=\"H1870\">way,</span> that <span class=\"wl wl-kjv\" data-code=\"H8052\">tidings</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom</span> hath <span class=\"wl wl-kjv\" data-code=\"H5221\">slain</span> all the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">sons,</span> and there is not <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> of them <span class=\"wl wl-kjv\" data-code=\"H3498\">left.</span>","31":"Then the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H6965\">arose,</span> and <span class=\"wl wl-kjv\" data-code=\"H7167\">tare</span> his <span class=\"wl wl-kjv\" data-code=\"H899\">garments,</span> and <span class=\"wl wl-kjv\" data-code=\"H7901\">lay</span> on the <span class=\"wl wl-kjv\" data-code=\"H776\">earth;</span> and all his <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> <span class=\"wl wl-kjv\" data-code=\"H5324\">stood</span> by with their <span class=\"wl wl-kjv\" data-code=\"H899\">clothes</span> <span class=\"wl wl-kjv\" data-code=\"H7167\">rent.</span>","32":"And <span class=\"wl wl-kjv\" data-code=\"H3122\">Jonadab,</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H8093\">Shimeah</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David's</span> <span class=\"wl wl-kjv\" data-code=\"H251\">brother,</span> <span class=\"wl wl-kjv\" data-code=\"H6030\">answered</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Let not my <span class=\"wl wl-kjv\" data-code=\"H113\">lord</span> <span class=\"wl wl-kjv\" data-code=\"H559\">suppose</span> that they have <span class=\"wl wl-kjv\" data-code=\"H4191\">slain</span> all the young <span class=\"wl wl-kjv\" data-code=\"H5288\">men</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">sons;</span> for <span class=\"wl wl-kjv\" data-code=\"H550\">Amnon</span> only is <span class=\"wl wl-kjv\" data-code=\"H4191\">dead:</span> for by the <span class=\"wl wl-kjv\" data-code=\"H6310\">appointment</span> of <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom</span> this hath been <span class=\"wl wl-kjv\" data-code=\"H7760\">determined</span> from the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> that he <span class=\"wl wl-kjv\" data-code=\"H6031\">forced</span> his <span class=\"wl wl-kjv\" data-code=\"H269\">sister</span> <span class=\"wl wl-kjv\" data-code=\"H8559\">Tamar.</span>","33":"Now therefore let not my <span class=\"wl wl-kjv\" data-code=\"H113\">lord</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H7760\">take</span> the <span class=\"wl wl-kjv\" data-code=\"H1697\">thing</span> to his <span class=\"wl wl-kjv\" data-code=\"H3820\">heart,</span> to <span class=\"wl wl-kjv\" data-code=\"H559\">think</span> that all the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> are <span class=\"wl wl-kjv\" data-code=\"H4191\">dead:</span> for <span class=\"wl wl-kjv\" data-code=\"H550\">Amnon</span> only is <span class=\"wl wl-kjv\" data-code=\"H4191\">dead.</span>","34":"But <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom</span> <span class=\"wl wl-kjv\" data-code=\"H1272\">fled.</span> And the young <span class=\"wl wl-kjv\" data-code=\"H5288\">man</span> that kept the <span class=\"wl wl-kjv\" data-code=\"H6822\">watch</span> lifted <span class=\"wl wl-kjv\" data-code=\"H5375\">up</span> his <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes,</span> and <span class=\"wl wl-kjv\" data-code=\"H7200\">looked,</span> and, behold, there <span class=\"wl wl-kjv\" data-code=\"H1980\">came</span> <span class=\"wl wl-kjv\" data-code=\"H7227\">much</span> <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> by the <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> of the <span class=\"wl wl-kjv\" data-code=\"H2022\">hill</span> <span class=\"wl wl-kjv\" data-code=\"H6654\">side</span> <span class=\"wl wl-kjv\" data-code=\"H310\">behind</span> him.","35":"And <span class=\"wl wl-kjv\" data-code=\"H3122\">Jonadab</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> Behold, the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> <span class=\"wl wl-kjv\" data-code=\"H935\">come:</span> as thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> <span class=\"wl wl-kjv\" data-code=\"H1697\">said,</span> so it is.","36":"And it came to pass, as soon as he had made an <span class=\"wl wl-kjv\" data-code=\"H3615\">end</span> of <span class=\"wl wl-kjv\" data-code=\"H1696\">speaking,</span> that, behold, the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came,</span> and lifted <span class=\"wl wl-kjv\" data-code=\"H5375\">up</span> their <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> and <span class=\"wl wl-kjv\" data-code=\"H1058\">wept:</span> and the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> also and all his <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> <span class=\"wl wl-kjv\" data-code=\"H1058\">wept</span> <span class=\"wl wl-kjv\" data-code=\"H3966\">very</span> <span class=\"wl wl-kjv\" data-code=\"H1065\">sore.</span>","37":"But <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom</span> <span class=\"wl wl-kjv\" data-code=\"H1 , de begeerte, de lust verteerde David. Het Hebreeuwse woord is gesteld in het vrouwelijke geslacht, zulks dat het op David niet past, maar wel op zijne ziel, welk woord hier ingevoegd is uit Psa 84:3, en Psa 119:81; waar dergelijke manier van spreken alzo voluit gevonden wordt. Zie ook Job 19:27."},{"catchword":"uit te trekken;","tekst":"Dit kan men verstaan van te doen uittrekken; dat is, iemand uit de zenden om Absalom weder te halen."},{"catchword":"getroost over Amnon,","tekst":"Dat is, hij had den rouw over Amnons dood afgelegd. Zie Gen 37:35, en Gen 38:12."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"And it came to pass after that, Absalom, David&acirc;&euro;&trade;s son, [By Maacha, the daughter of Talmai, King of Gesur, above chap.3.3. By this woman David had also Thamar: Absalom and Tamar, being both born of one father, and of one mother] having a fair sister, whose name was Thamar, that Ammon, David&acirc;&euro;&trade;s son, [by Ahinoam, above chap.3.2.] loved her."}],"2":[{"catchword":null,"tekst":"And Amnon was so troubled, that he fell sick for his sister Thamars sake, for she was a virgin; [And consequently so narrowly looked to, that it seemed impossible for Amnon to talk with her in private, and to prevail with her. Compare Pro 30:19.] so as that it was grievous [or, impossible. Heb. properly wonderfull, hidden. Compare Gen 18:14.] in Amnons eyes to do any thing to her."}],"3":[{"catchword":null,"tekst":"But Amnon had a friend, whose name was Jonadab a son of Simea, [See 1 Sam.16.9. and below chap.21, 21.] David&acirc;&euro;&trade;s brother: and Jonadab was a very wife man, [i.e. in this place, very crafty and cunning, to invent evil counsel, as he here did; whereas he ought rather to have reproved, and disswaded Amnon from this fact; and, if need required, to have told the King of it Compare below chap.14.2. Psal.58.6.]"}],"4":[{"catchword":null,"tekst":"The same said unto him, Why art thou so lean [Heb. so thin, consumed, wasted away] // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`

    return bijbeluitlegHtml(n);

    } else {

  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;

  const knoop = nd => {

    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:Lora;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
