961\">hij</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H1961\">was</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H8033\">daar</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H7969\">drie</span> jaar.", "39": "<span class=\"wl\" data-l=\"L1\" data-code=\"H3615\">Toen</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H3615\">verlangde</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H3615\">de</span> ziel <span class=\"wl\" data-l=\"L2\" data-code=\"H4428\">van</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H4428\">koning</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H1732\">David</span> er <span class=\"wl\" data-l=\"L4\" data-code=\"H413\">zeer</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H413\">naar</span> om <span class=\"wl\" data-l=\"L5\" data-code=\"H53\">naar</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H53\">Absalom</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H53\">uit</span> te gaan; <span class=\"wl\" data-l=\"L6\" data-code=\"H3588\">want</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H5162\">hij</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H5162\">had</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H5162\">zich</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H5162\">getroost</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H5162\">over</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H550\">Amnon</span>, omdat die <span class=\"wl\" data-l=\"L9\" data-code=\"H4191\">dood</span> <span class=\"wl\" data-l=\"L9\" data-code=\"H4191\">was</span>."}, "koppeling_kjv": {"1": "And it came to pass <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> this, that <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> had a <span class=\"wl wl-kjv\" data-code=\"H3303\">fair</span> <span class=\"wl wl-kjv\" data-code=\"H269\">sister,</span> whose <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> was <span class=\"wl wl-kjv\" data-code=\"H8559\">Tamar;</span> and <span class=\"wl wl-kjv\" data-code=\"H550\">Amnon</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H157\">loved</span> her.", "2": "And <span class=\"wl wl-kjv\" data-code=\"H550\">Amnon</span> was so <span class=\"wl wl-kjv\" data-code=\"H3334\">vexed,</span> that he fell <span class=\"wl wl-kjv\" data-code=\"H2470\">sick</span> for his <span class=\"wl wl-kjv\" data-code=\"H269\">sister</span> <span class=\"wl wl-kjv\" data-code=\"H8559\">Tamar;</span> for she was a <span class=\"wl wl-kjv\" data-code=\"H1330\">virgin;</span> and <span class=\"wl wl-kjv\" data-code=\"H550\">Amnon</span> <span class=\"wl wl-kjv\" data-code=\"H5869\">thought</span> it <span class=\"wl wl-kjv\" data-code=\"H6381\">hard</span> for him to <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> any <span class=\"wl wl-kjv\" data-code=\"H3972\">thing</span> to her.", "3": "But <span class=\"wl wl-kjv\" data-code=\"H550\">Amnon</span> had a <span class=\"wl wl-kjv\" data-code=\"H7453\">friend,</span> whose <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> was <span class=\"wl wl-kjv\" data-code=\"H3122\">Jonadab,</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H8093\">Shimeah</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David's</span> <span class=\"wl wl-kjv\" data-code=\"H251\">brother:</span> and <span class=\"wl wl-kjv\" data-code=\"H3122\">Jonadab</span> was a <span class=\"wl wl-kjv\" data-code=\"H3966\">very</span> <span class=\"wl wl-kjv\" data-code=\"H2450\">subtil</span> <span class=\"wl wl-kjv\" data-code=\"H376\">man.</span>", "4": "And he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, Why art thou, being the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">son,</span> <span class=\"wl wl-kjv\" data-code=\"H1800\">lean</span> from <span class=\"wl wl-kjv\" data-code=\"H1242\">day</span> to <span class=\"wl wl-kjv\" data-code=\"H1242\">day?</span> wilt thou not <span class=\"wl wl-kjv\" data-code=\"H5046\">tell</span> me? And <span class=\"wl wl-kjv\" data-code=\"H550\">Amnon</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, I <span class=\"wl wl-kjv\" data-code=\"H157\">love</span> <span class=\"wl wl-kjv\" data-code=\"H8559\">Tamar,</span> my <span class=\"wl wl-kjv\" data-code=\"H251\">brother</span> <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom's</span> <span class=\"wl wl-kjv\" data-code=\"H269\">sister.</span>", "5": "And <span class=\"wl wl-kjv\" data-code=\"H3082\">Jonadab</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, Lay thee <span class=\"wl wl-kjv\" data-code=\"H7901\">down</span> on thy <span class=\"wl wl-kjv\" data-code=\"H4904\">bed,</span> and make thyself <span class=\"wl wl-kjv\" data-code=\"H2470\">sick:</span> and when thy <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> <span class=\"wl wl-kjv\" data-code=\"H935\">cometh</span> to <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> thee, <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> unto him, I pray thee, let my <span class=\"wl wl-kjv\" data-code=\"H269\">sister</span> <span class=\"wl wl-kjv\" data-code=\"H8559\">Tamar</span> <span class=\"wl wl-kjv\" data-code=\"H935\">come,</span> and <span class=\"wl wl-kjv\" data-code=\"H1262\">give</span> me <span class=\"wl wl-kjv\" data-code=\"H3899\">meat,</span> and <span class=\"wl wl-kjv\" data-code=\"H6213\">dress</span> the <span class=\"wl wl-kjv\" data-code=\"H1279\">meat</span> in my <span class=\"wl wl-kjv\" data-code=\"H5869\">sight,</span> that I may <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> it, and <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> it at her <span class=\"wl wl-kjv\" data-code=\"H3027\">hand.</span>", "6": "So <span class=\"wl wl-kjv\" data-code=\"H550\">Amnon</span> lay <span class=\"wl wl-kjv\" data-code=\"H7901\">down,</span> and made himself <span class=\"wl wl-kjv\" data-code=\"H2470\">sick:</span> and when the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> was <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> to <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> him, <span class=\"wl wl-kjv\" data-code=\"H550\">Amnon</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> I pray thee, let <span class=\"wl wl-kjv\" data-code=\"H8559\">Tamar</span> my <span class=\"wl wl-kjv\" data-code=\"H269\">sister</span> <span class=\"wl wl-kjv\" data-code=\"H935\">come,</span> and <span class=\"wl wl-kjv\" data-code=\"H3823\">make</span> me a <span class=\"wl wl-kjv\" data-code=\"H8147\">couple</span> of <span class=\"wl wl-kjv\" data-code=\"H3834\">cakes</span> in my <span class=\"wl wl-kjv\" data-code=\"H5869\">sight,</span> that I may <span class=\"wl wl-kjv\" data-code=\"H1262\">eat</span> at her <span class=\"wl wl-kjv\" data-code=\"H3027\">hand.</span>", "7": "Then <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">home</span> to <span class=\"wl wl-kjv\" data-code=\"H8559\">Tamar,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">Go</span> now to thy <span class=\"wl wl-kjv\" data-code=\"H251\">brother</span> <span class=\"wl wl-kjv\" data-code=\"H550\">Amnon's</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> and <span class=\"wl wl-kjv\" data-code=\"H6213\">dress</span> him <span class=\"wl wl-kjv\" data-code=\"H1279\">meat.</span>", "8": "So <span class=\"wl wl-kjv\" data-code=\"H8559\">Tamar</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> to her <span class=\"wl wl-kjv\" data-code=\"H251\">brother</span> <span class=\"wl wl-kjv\" data-code=\"H550\">Amnon's</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house;</span> and he was laid <span class=\"wl wl-kjv\" data-code=\"H7901\">down.</span> And she <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> <span class=\"wl wl-kjv\" data-code=\"H1217\">flour,</span> and <span class=\"wl wl-kjv\" data-code=\"H3888\">kneaded</span> it, and made <span class=\"wl wl-kjv\" data-code=\"H3823\">cakes</span> in his <span class=\"wl wl-kjv\" data-code=\"H5869\">sight,</span> and did <span class=\"wl wl-kjv\" data-code=\"H1310\">bake</span> the <span class=\"wl wl-kjv\" data-code=\"H3834\">cakes.</span>", "9": "And she <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> a <span class=\"wl wl-kjv\" data-code=\"H4958\">pan,</span> and poured them <span class=\"wl wl-kjv\" data-code=\"H3332\">out</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> him; but he <span class=\"wl wl-kjv\" data-code=\"H3985\">refused</span> to <span class=\"wl wl-kjv\" data-code=\"H398\">eat.</span> And <span class=\"wl wl-kjv\" data-code=\"H550\">Amnon</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Have <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> all <span class=\"wl wl-kjv\" data-code=\"H376\">men</span> from me. And they went <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> from him.", "10": "And <span class=\"wl wl-kjv\" data-code=\"H550\">Amnon</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H8559\">Tamar,</span> <span class=\"wl wl-kjv\" data-code=\"H935\">Bring</span> the <span class=\"wl wl-kjv\" data-code=\"H1279\">meat</span> into the <span class=\"wl wl-kjv\" data-code=\"H2315\">chamber,</span> that I may <span class=\"wl wl-kjv\" data-code=\"H1262\">eat</span> of thine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand.</span> And <span class=\"wl wl-kjv\" data-code=\"H8559\">Tamar</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> the <span class=\"wl wl-kjv\" data-code=\"H3834\">cakes</span> which she had <span class=\"wl wl-kjv\" data-code=\"H6213\">made,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> them into the <span class=\"wl wl-kjv\" data-code=\"H2315\">chamber</span> to <span class=\"wl wl-kjv\" data-code=\"H550\">Amnon</span> her <span class=\"wl wl-kjv\" data-code=\"H251\">brother.</span>", "11": "And when she had <span class=\"wl wl-kjv\" data-code=\"H5066\">brought</span> them unto him to <span class=\"wl wl-kjv\" data-code=\"H398\">eat,</span> he took <span class=\"wl wl-kjv\" data-code=\"H2388\">hold</span> of her, and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto her, <span class=\"wl wl-kjv\" data-code=\"H935\">Come</span> <span class=\"wl wl-kjv\" data-code=\"H7901\">lie</span> with me, my <span class=\"wl wl-kjv\" data-code=\"H269\">sister.</span>", "12": "And she <span class=\"wl wl-kjv\" data-code=\"H559\">answered</span> him, Nay, my <span class=\"wl wl-kjv\" data-code=\"H251\">brother,</span> do not <span class=\"wl wl-kjv\" data-code=\"H6031\">force</span> me; for no such thing <span class=\"wl wl-kjv\" data-code=\"H3651\">ought</span> to be <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> in <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel:</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> not thou this <span class=\"wl wl-kjv\" data-code=\"H5039\">folly.</span>", "13": "And I, whither shall I cause my <span class=\"wl wl-kjv\" data-code=\"H2781\">shame</span> to <span class=\"wl wl-kjv\" data-code=\"H3212\">go?</span> and as for thee, thou shalt be as <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> of the <span class=\"wl wl-kjv\" data-code=\"H5036\">fools</span> in <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel.</span> Now therefore, I pray thee, <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> unto the <span class=\"wl wl-kjv\" data-code=\"H4428\">king;</span> for he will not <span class=\"wl wl-kjv\" data-code=\"H4513\">withhold</span> me from thee.", "14": "Howbeit he <span class=\"wl wl-kjv\" data-code=\"H14\">would</span> not <span class=\"wl wl-kjv\" data-code=\"H8085\">hearken</span> unto her <span class=\"wl wl-kjv\" data-code=\"H6963\">voice:</span> but, being <span class=\"wl wl-kjv\" data-code=\"H2388\">stronger</span> than she, <span class=\"wl wl-kjv\" data-code=\"H6031\">forced</span> her, and <span class=\"wl wl-kjv\" data-code=\"H7901\">lay</span> with her.", "15": "Then <span class=\"wl wl-kjv\" data-code=\"H550\">Amnon</span> <span class=\"wl wl-kjv\" data-code=\"H8130\">hated</span> her <span class=\"wl wl-kjv\" data-code=\"H3966\">exceedingly;</span> so that the <span class=\"wl wl-kjv\" data-code=\"H8135\">hatred</span> wherewith he <span class=\"wl wl-kjv\" data-code=\"H8130\">hated</span> her was <span class=\"wl wl-kjv\" data-code=\"H1419\">greater</span> than the <span class=\"wl wl-kjv\" data-code=\"H160\">love</span> wherewith he had <span class=\"wl wl-kjv\" data-code=\"H157\">loved</span> her. And <span class=\"wl wl-kjv\" data-code=\"H550\">Amnon</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto her, <span class=\"wl wl-kjv\" data-code=\"H6965\">Arise,</span> be <span class=\"wl wl-kjv\" data-code=\"H3212\">gone.</span>", "16": "And she <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, There is no <span class=\"wl wl-kjv\" data-code=\"H182\">cause:</span> this <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> in sending me <span class=\"wl wl-kjv\" data-code=\"H7971\">away</span> is <span class=\"wl wl-kjv\" data-code=\"H1419\">greater</span> than the <span class=\"wl wl-kjv\" data-code=\"H312\">other</span> that thou <span class=\"wl wl-kjv\" data-code=\"H6213\">didst</span> unto me. But he <span class=\"wl wl-kjv\" data-code=\"H14\">would</span> not <span class=\"wl wl-kjv\" data-code=\"H8085\">hearken</span> unto her.", "17": "Then he <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> his <span class=\"wl wl-kjv\" data-code=\"H5288\">servant</span> that <span class=\"wl wl-kjv\" data-code=\"H8334\">ministered</span> unto him, and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">Put</span> now this woman <span class=\"wl wl-kjv\" data-code=\"H2351\">out</span> from me, and <span class=\"wl wl-kjv\" data-code=\"H5274\">bolt</span> the <span class=\"wl wl-kjv\" data-code=\"H1817\">door</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> her.", "18": "And she had a <span class=\"wl wl-kjv\" data-code=\"H3801\">garment</span> of divers <span class=\"wl wl-kjv\" data-code=\"H6446\">colours</span> upon her: for with such <span class=\"wl wl-kjv\" data-code=\"H4598\">robes</span> were the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters</span> that were <span class=\"wl wl-kjv\" data-code=\"H1330\">virgins</span> <span class=\"wl wl-kjv\" data-code=\"H3847\">apparelled.</span> Then his <span class=\"wl wl-kjv\" data-code=\"H8334\">servant</span> <span class=\"wl wl-kjv\" data-code=\"H3318\">brought</span> her <span class=\"wl wl-kjv\" data-code=\"H2351\">out,</span> and <span class=\"wl wl-kjv\" data-code=\"H5274\">bolted</span> the <span class=\"wl wl-kjv\" data-code=\"H1817\">door</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> her.", "19": "And <span class=\"wl wl-kjv\" data-code=\"H8559\">Tamar</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">put</span> <span class=\"wl wl-kjv\" data-code=\"H665\">ashes</span> on her <span class=\"wl wl-kjv\" data-code=\"H7218\">head,</span> and <span class=\"wl wl-kjv\" data-code=\"H7167\">rent</span> her <span class=\"wl wl-kjv\" data-code=\"H3801\">garment</span> of divers <span class=\"wl wl-kjv\" data-code=\"H6446\">colours</span> that was on her, and <span class=\"wl wl-kjv\" data-code=\"H7760\">laid</span> her <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> on her <span class=\"wl wl-kjv\" data-code=\"H7218\">head,</span> and <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> <span class=\"wl wl-kjv\" data-code=\"H1980\">on</span> <span class=\"wl wl-kjv\" data-code=\"H2199\">crying.</span>", "20": "And <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom</span> her <span class=\"wl wl-kjv\" data-code=\"H251\">brother</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto her, Hath <span class=\"wl wl-kjv\" data-code=\"H550\">Amnon</span> thy <span class=\"wl wl-kjv\" data-code=\"H251\">brother</span> been with thee? but hold now thy <span class=\"wl wl-kjv\" data-code=\"H2790\">peace,</span> my <span class=\"wl wl-kjv\" data-code=\"H269\">sister:</span> he is thy <span class=\"wl wl-kjv\" data-code=\"H251\">brother;</span> <span class=\"wl wl-kjv\" data-code=\"H7896\">regard</span> not this <span class=\"wl wl-kjv\" data-code=\"H1697\">thing.</span> So <span class=\"wl wl-kjv\" data-code=\"H8559\">Tamar</span> <span class=\"wl wl-kjv\" data-code=\"H3427\">remained</span> <span class=\"wl wl-kjv\" data-code=\"H8074\">desolate</span> in her <span class=\"wl wl-kjv\" data-code=\"H251\">brother</span> <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom's</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house.</span>", "21": "But when <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> of all these <span class=\"wl wl-kjv\" data-code=\"H1697\">things,</span> he was <span class=\"wl wl-kjv\" data-code=\"H3966\">very</span> <span class=\"wl wl-kjv\" data-code=\"H2734\">wroth.</span>", "22": "And <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> unto his brother <span class=\"wl wl-kjv\" data-code=\"H550\">Amnon</span> neither <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> nor <span class=\"wl wl-kjv\" data-code=\"H7451\">bad:</span> for <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom</span> <span class=\"wl wl-kjv\" data-code=\"H8130\">hated</span> <span class=\"wl wl-kjv\" data-code=\"H550\">Amnon,</span> <span class=\"wl wl-kjv\" data-code=\"H1697\">because</span> he had <span class=\"wl wl-kjv\" data-code=\"H6031\">forced</span> his <span class=\"wl wl-kjv\" data-code=\"H269\">sister</span> <span class=\"wl wl-kjv\" data-code=\"H8559\">Tamar.</span>", "23": "And it came to pass after two <span class=\"wl wl-kjv\" data-code=\"H3117\">full</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years,</span> that <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom</span> had <span class=\"wl wl-kjv\" data-code=\"H1494\">sheepshearers</span> in <span class=\"wl wl-kjv\" data-code=\"H1178\">Baalhazor,</span> which is beside <span class=\"wl wl-kjv\" data-code=\"H669\">Ephraim:</span> and <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom</span> <span class=\"wl wl-kjv\" data-code=\"H7121\">invited</span> all the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">sons.</span>", "24": "And <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Behold now, thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> hath <span class=\"wl wl-kjv\" data-code=\"H1494\">sheepshearers;</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">let</span> ➔ the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> I beseech thee, and his <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> with thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant.</span>", "25": "And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom,</span> Nay, my <span class=\"wl wl-kjv\" data-code=\"H1121\">son,</span> let us not all now <span class=\"wl wl-kjv\" data-code=\"H3212\">go,</span> lest we be <span class=\"wl wl-kjv\" data-code=\"H3513\">chargeable</span> unto thee. And he <span class=\"wl wl-kjv\" data-code=\"H6555\">pressed</span> him: howbeit he <span class=\"wl wl-kjv\" data-code=\"H14\">would</span> not <span class=\"wl wl-kjv\" data-code=\"H3212\">go,</span> but <span class=\"wl wl-kjv\" data-code=\"H1288\">blessed</span> him.", "26": "Then <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom,</span> If not, I pray thee, let my <span class=\"wl wl-kjv\" data-code=\"H251\">brother</span> <span class=\"wl wl-kjv\" data-code=\"H550\">Amnon</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> with us. And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, Why should he <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> with thee?", "27": "But <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom</span> <span class=\"wl wl-kjv\" data-code=\"H6555\">pressed</span> him, that he let <span class=\"wl wl-kjv\" data-code=\"H550\">Amnon</span> and all the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">go</span> with him.", "28": "Now <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom</span> had <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> his <span class=\"wl wl-kjv\" data-code=\"H5288\">servants,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">Mark</span> ye now when <span class=\"wl wl-kjv\" data-code=\"H550\">Amnon's</span> <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> is <span class=\"wl wl-kjv\" data-code=\"H2896\">merry</span> with <span class=\"wl wl-kjv\" data-code=\"H3196\">wine,</span> and when I <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> unto you, <span class=\"wl wl-kjv\" data-code=\"H5221\">Smite</span> <span class=\"wl wl-kjv\" data-code=\"H550\">Amnon;</span> then <span class=\"wl wl-kjv\" data-code=\"H4191\">kill</span> him, <span class=\"wl wl-kjv\" data-code=\"H3372\">fear</span> not: have not I <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> you? be <span class=\"wl wl-kjv\" data-code=\"H2388\">courageous,</span> and be <span class=\"wl wl-kjv\" data-code=\"H1121\">valiant.</span>", "29": "And the <span class=\"wl wl-kjv\" data-code=\"H5288\">servants</span> of <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> unto <span class=\"wl wl-kjv\" data-code=\"H550\">Amnon</span> as <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom</span> had <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded.</span> Then all the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> <span class=\"wl wl-kjv\" data-code=\"H6965\">arose,</span> and every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> gat him <span class=\"wl wl-kjv\" data-code=\"H7392\">up</span> upon his <span class=\"wl wl-kjv\" data-code=\"H6505\">mule,</span> and <span class=\"wl wl-kjv\" data-code=\"H5127\">fled.</span>", "30": "And it came to pass, while they were in the <span class=\"wl wl-kjv\" data-code=\"H1870\">way,</span> that <span class=\"wl wl-kjv\" data-code=\"H8052\">tidings</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom</span> hath <span class=\"wl wl-kjv\" data-code=\"H5221\">slain</span> all the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">sons,</span> and there is not <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> of them <span class=\"wl wl-kjv\" data-code=\"H3498\">left.</span>", "31": "Then the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H6965\">arose,</span> and <span class=\"wl wl-kjv\" data-code=\"H7167\">tare</span> his <span class=\"wl wl-kjv\" data-code=\"H899\">garments,</span> and <span class=\"wl wl-kjv\" data-code=\"H7901\">lay</span> on the <span class=\"wl wl-kjv\" data-code=\"H776\">earth;</span> and all his <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> <span class=\"wl wl-kjv\" data-code=\"H5324\">stood</span> by with their <span class=\"wl wl-kjv\" data-code=\"H899\">clothes</span> <span class=\"wl wl-kjv\" data-code=\"H7167\">rent.</span>", "32": "And <span class=\"wl wl-kjv\" data-code=\"H3122\">Jonadab,</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H8093\">Shimeah</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David's</span> <span class=\"wl wl-kjv\" data-code=\"H251\">brother,</span> <span class=\"wl wl-kjv\" data-code=\"H6030\">answered</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Let not my <span class=\"wl wl-kjv\" data-code=\"H113\">lord</span> <span class=\"wl wl-kjv\" data-code=\"H559\">suppose</span> that they have <span class=\"wl wl-kjv\" data-code=\"H4191\">slain</span> all the young <span class=\"wl wl-kjv\" data-code=\"H5288\">men</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">sons;</span> for <span class=\"wl wl-kjv\" data-code=\"H550\">Amnon</span> only is <span class=\"wl wl-kjv\" data-code=\"H4191\">dead:</span> for by the <span class=\"wl wl-kjv\" data-code=\"H6310\">appointment</span> of <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom</span> this hath been <span class=\"wl wl-kjv\" data-code=\"H7760\">determined</span> from the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> that he <span class=\"wl wl-kjv\" data-code=\"H6031\">forced</span> his <span class=\"wl wl-kjv\" data-code=\"H269\">sister</span> <span class=\"wl wl-kjv\" data-code=\"H8559\">Tamar.</span>", "33": "Now therefore let not my <span class=\"wl wl-kjv\" data-code=\"H113\">lord</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H7760\">take</span> the <span class=\"wl wl-kjv\" data-code=\"H1697\">thing</span> to his <span class=\"wl wl-kjv\" data-code=\"H3820\">heart,</span> to <span class=\"wl wl-kjv\" data-code=\"H559\">think</span> that all the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> are <span class=\"wl wl-kjv\" data-code=\"H4191\">dead:</span> for <span class=\"wl wl-kjv\" data-code=\"H550\">Amnon</span> only is <span class=\"wl wl-kjv\" data-code=\"H4191\">dead.</span>", "34": "But <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom</span> <span class=\"wl wl-kjv\" data-code=\"H1272\">fled.</span> And the young <span class=\"wl wl-kjv\" data-code=\"H5288\">man</span> that kept the <span class=\"wl wl-kjv\" data-code=\"H6822\">watch</span> lifted <span class=\"wl wl-kjv\" data-code=\"H5375\">up</span> his <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes,</span> and <span class=\"wl wl-kjv\" data-code=\"H7200\">looked,</span> and, behold, there <span class=\"wl wl-kjv\" data-code=\"H1980\">came</span> <span class=\"wl wl-kjv\" data-code=\"H7227\">much</span> <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> by the <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> of the <span class=\"wl wl-kjv\" data-code=\"H2022\">hill</span> <span class=\"wl wl-kjv\" data-code=\"H6654\">side</span> <span class=\"wl wl-kjv\" data-code=\"H310\">behind</span> him.", "35": "And <span class=\"wl wl-kjv\" data-code=\"H3122\">Jonadab</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> Behold, the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> <span class=\"wl wl-kjv\" data-code=\"H935\">come:</span> as thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> <span class=\"wl wl-kjv\" data-code=\"H1697\">said,</span> so it is.", "36": "And it came to pass, as soon as he had made an <span class=\"wl wl-kjv\" data-code=\"H3615\">end</span> of <span class=\"wl wl-kjv\" data-code=\"H1696\">speaking,</span> that, behold, the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came,</span> and lifted <span class=\"wl wl-kjv\" data-code=\"H5375\">up</span> their <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> and <span class=\"wl wl-kjv\" data-code=\"H1058\">wept:</span> and the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> also and all his <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> <span class=\"wl wl-kjv\" data-code=\"H1058\">wept</span> <span class=\"wl wl-kjv\" data-code=\"H3966\">very</span> <span class=\"wl wl-kjv\" data-code=\"H1065\">sore.</span>", "37": "But <span class=\"wl wl-kjv\" data-code=\"H53\">Absalom</span> <span class=\"wl wl-kjv\" data-code=\"H1272\">fled,</span> and <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> to <span class=\"wl wl-kjv\" data-code=\"H8526\">Talmai,</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'

  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);

  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';

    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen bij dit vers.</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +

}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */

}

(function () {

  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
