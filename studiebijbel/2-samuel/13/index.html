"../../hebreeen/1/"}, {"naam": "Jakobus", "href": "../../jakobus/1/"}, {"naam": "1 Petrus", "href": "../../1-petrus/1/"}, {"naam": "2 Petrus", "href": "../../2-petrus/1/"}, {"naam": "1 Johannes", "href": "../../1-johannes/1/"}, {"naam": "2 Johannes", "href": "../../2-johannes/1/"}, {"naam": "3 Johannes", "href": "../../3-johannes/1/"}, {"naam": "Judas", "href": "../../judas/1/"}, {"naam": "Openbaring", "href": "../../openbaring/1/"}], "slugmap": {"Gen": "genesis", "Ex": "exodus", "Lev": "leviticus", "Num": "numeri", "Deut": "deuteronomium", "Joz": "jozua", "Richt": "richteren", "Ruth": "ruth", "1 Sam": "1-samuel", "2 Sam": "2-samuel", "1 Kon": "1-koningen", "2 Kon": "2-koningen", "1 Kron": "1-kronieken", "2 Kron": "2-kronieken", "Ezra": "ezra", "Neh": "nehemia", "Est": "esther", "Job": "job", "Ps": "psalmen", "Spr": "spreuken", "Pred": "prediker", "Hoogl": "hooglied", "Jes": "jesaja", "Jer": "jeremia", "Klaagl": "klaagliederen", "Ezech": "ezechiel", "Dan": "daniel", "Hos": "hosea", "Joël": "joel", "Amos": "amos", "Obadja": "obadja", "Jona": "jona", "Micha": "micha", "Nahum": "nahum", "Hab": "habakuk", "Zef": "zefanja", "Hagg": "haggai", "Zach": "zacharia", "Mal": "maleachi", "Matt": "mattheus", "Mark": "markus", "Luk": "lukas", "Joh": "johannes", "Hand": "handelingen", "Rom": "romeinen", "1 Kor": "1-korinthe", "2 Kor": "2-korinthe", "Gal": "galaten", "Ef": "efeze", "Fil": "filippenzen", "Kol": "kolossenzen", "1 Tess": "1-thessalonicenzen", "2 Tess": "2-thessalonicenzen", "1 Tim": "1-timotheus", "2 Tim": "2-timotheus", "Tit": "titus", "Filem": "filemon", "Hebr": "hebreeen", "Jak": "jakobus", "1 Petr": "1-petrus", "2 Petr": "2-petrus", "1 Joh": "1-johannes", "2 Joh": "2-johannes", "3 Joh": "3-johannes", "Judas": "judas", "Openb": "openbaring"}}, "vertalingen": {"SVnu": {"1": "Het gebeurde daarna dat Absalom, Davids zoon, een mooie zuster had, wier naam Thamar was, en Amnon, Davids zoon, kreeg haar lief.", "2": "En Amnon werd zo door haar in beslag genomen dat hij er ziek van werd, vanwege zijn zuster Thamar; want zij was een maagd, zodat het in Amnons ogen onmogelijk leek haar iets te doen.", "3": "Maar Amnon had een vriend, wiens naam Jonadab was, een zoon van Simea, Davids broer; en Jonadab was een zeer sluwe man.", "4": "Die zei tegen hem: Waarom bent u, dag na dag, zo mager, u koningszoon, zult u het mij niet vertellen? Toen zei Amnon tegen hem: Ik heb Thamar, de zuster van mijn broer Absalom, lief.", "5": "En Jonadab zei tegen hem: Ga liggen op uw bed, en doe alsof u ziek bent; als dan uw vader komt om u te zien, zeg dan tegen hem: Laat toch mijn zuster Thamar komen, dat zij mij brood laat eten, en het voedsel voor mijn ogen klaarmaakt, zodat ik het zie, en het uit haar hand eet.", "6": "Amnon legde zich toen neer, en deed alsof hij ziek was. Toen nu de koning kwam om hem te zien, zei Amnon tegen de koning: Laat toch mijn zuster Thamar komen, dat zij twee koekjes voor mijn ogen klaarmaakt, en ik ze uit haar hand eet.", "7": "Toen zond David iemand naar Thamar in het huis, en zei: Ga toch naar het huis van uw broer Amnon, en maak voor hem voedsel klaar.", "8": "En Thamar ging naar het huis van haar broer Amnon (hij lag namelijk neer), en zij nam deeg, en kneedde het, en maakte er voor zijn ogen koekjes van, en bakte de koekjes.", "9": "En zij nam een pan, en goot ze voor hem uit; maar hij weigerde te eten. En Amnon zei: Laat iedereen bij mij weggaan. En iedereen ging bij hem weg.", "10": "Toen zei Amnon tegen Thamar: Breng het voedsel in de kamer, dat ik het uit uw hand eet; zo nam Thamar de koekjes die zij gemaakt had, en bracht ze haar broer Amnon in de kamer.", "11": "Toen zij ze naar hem toe bracht om te eten, greep hij haar vast, en zei tegen haar: Kom, lig bij mij, mijn zuster!", "12": "Maar zij zei tegen hem: Nee, mijn broer, verkracht mij niet, want zo doet men niet in Israël; doe deze dwaasheid niet.", "13": "Want ik, waarheen zou ik mijn schande brengen? En u, u zou zijn als een van de dwazen in Israël; spreek toch nu met de koning, want hij zal mij niet aan u onthouden.", "14": "Doch hij wilde niet naar haar luisteren; maar omdat hij sterker was dan zij, verkrachtte hij haar, en lag bij haar.", "15": "Daarna haatte Amnon haar met een zeer grote haat; want de haat waarmee hij haar haatte, was groter dan de liefde waarmee hij haar had liefgehad; en Amnon zei tegen haar: Sta op, ga weg.", "16": "Toen zei zij tegen hem: Er is geen reden om mij weg te sturen; dit kwaad zou groter zijn dan het andere dat u mij hebt aangedaan; maar hij wilde niet naar haar luisteren.", "17": "En hij riep zijn knecht die hem diende, en zei: Stuur haar naar buiten, weg van mij, en grendel de deur achter haar dicht.", "18": "Zij droeg een veelkleurige mantel; want zo werden de dochters van de koning die nog maagd waren gekleed. En zijn dienaar bracht haar naar buiten, en grendelde de deur achter haar dicht.", "19": "Toen nam Thamar as en strooide die op haar hoofd, en scheurde de veelkleurige mantel die zij aanhad; en zij legde haar hand op haar hoofd, en liep luid schreiend weg.", "20": "En haar broer Absalom zei tegen haar: Is uw broer Amnon bij u geweest? Nu dan, mijn zuster, zwijg stil, hij is uw broer; zet uw hart niet op deze zaak. Zo bleef Thamar, eenzaam, in het huis van haar broer Absalom.", "21": "Toen koning David al deze dingen hoorde, werd hij zeer boos.", "22": "Doch Absalom sprak niet met Amnon, noch kwaad noch goed; maar Absalom haatte Amnon, vanwege het feit dat hij zijn zuster Thamar verkracht had.", "23": "En het gebeurde, na twee volle jaren, dat Absalom schaapscheerders had bij Baäl-Hazor, dat bij Efraïm ligt; en Absalom nodigde alle zonen van de koning uit.", "24": "En Absalom kwam bij de koning, en zei: Zie, uw knecht heeft nu schaapscheerders; laat toch de koning en zijn knechten met uw knecht meegaan.", "25": "Maar de koning zei tegen Absalom: Nee, mijn zoon, laten we toch niet allemaal samen gaan, opdat wij u niet tot last zijn; en hij drong bij hem aan, doch hij wilde niet gaan, maar zegende hem.", "26": "Toen zei Absalom: Als het dan niet kan, laat toch mijn broer Amnon met ons meegaan. Maar de koning zei tegen hem: Waarom zou hij met u meegaan?", "27": "Toen Absalom bij hem aandrong, liet hij Amnon en alle zonen van de koning met hem meegaan.", "28": "Absalom nu gebood zijn knechten: Let er nu op, wanneer Amnons hart vrolijk is van de wijn, en ik tegen u zeg: Sla Amnon neer, dan zult u hem doden; wees niet bang; heb ik het u niet geboden? Wees sterk en wees dapper.", "29": "En Absaloms knechten deden met Amnon zoals Absalom geboden had. Toen stonden alle zonen van de koning op, en reden ieder op zijn muildier, en vluchtten.", "30": "En het gebeurde, terwijl zij onderweg waren, dat het gerucht David bereikte, dat men zei: Absalom heeft alle zonen van de koning gedood, en er is niet één van hen overgebleven.", "31": "Toen stond de koning op, en scheurde zijn kleren, en ging op de grond liggen; en al zijn knechten stonden erbij met gescheurde kleren.", "32": "Maar Jonadab, de zoon van Simea, Davids broer, antwoordde en zei: Mijn heer moet niet denken dat zij alle jongemannen, de zonen van de koning, gedood hebben; maar Amnon alleen is dood; want Absalom had dit van tevoren zo besloten, vanaf de dag dat hij zijn zuster Thamar verkracht heeft.", "33": "Zo moet mijn heer de koning nu de zaak niet ter harte nemen, door te denken dat alle zonen van de koning dood zijn; want Amnon alleen is dood.", "34": "Absalom nu vluchtte; en de knecht die de wacht hield, hief zijn ogen op, en keek toe, en zie, er kwam veel volk van de weg achter hem, aan de kant van het gebergte.", "35": "Toen zei Jonadab tegen de koning: Zie, de zonen van de koning komen; zoals uw knecht gezegd heeft, zo is het gebeurd.", "36": "En het gebeurde, toen hij was uitgesproken, zie, dat de zonen van de koning kwamen, en hun stemmen verhieven en huilden; en de koning ook, en al zijn knechten, huilden zeer luid.", "37": "(Absalom nu vluchtte, en ging naar Thalmai, de zoon van Ammihur, koning van Gesur.) En hij droeg rouw over zijn zoon, al die dagen.", "38": "Zo vluchtte Absalom, en ging naar Gesur; en hij was daar drie jaar.", "39": "Toen verlangde de ziel van koning David er zeer naar om naar Absalom uit te gaan; want hij had zich getroost over Amnon, omdat die dood was."}, "SV": {"1": "En het geschiedde daarna, alzo Absalom, Davids zoon, een schone zuster had, welker naam was Thamar, dat Amnon, Davids zoon, haar lief kreeg.", "2": "En Amnon was benauwd tot krank wordens toe, om zijner zuster Thamars wil; want zij was een maagd, zodat het in Amnons ogen zwaar was, haar iets te doen.", "3": "Doch Amnon had een vriend, wiens naam was Jonadab, een zoon van Simea, Davids broeder; en Jonadab was een zeer wijs man.", "4": "Die zeide tot hem: Waarom zijt gij van morgen tot morgen zo mager, gij koningszoon, zult gij het mij niet te kennen geven? Toen zeide Amnon tot hem: Ik heb Thamar, de zuster van mijn broeder Absalom, lief.", "5": "En Jonadab zeide tot hem: Leg u op uw leger, en maak u krank; als dan uw vader zal komen om u te zien, zo zult gij tot hem zeggen: Dat toch mijn zuster Thamar kome, dat zij mij met brood spijzige, en de spijze voor mijn ogen toemake, opdat ik het aanzie, en van haar hand ete.", "6": "Amnon dan leide zich, en maakte zich krank. Toen nu de koning kwam om hem te zien, zeide Amnon tot den koning: Dat toch mijn zuster Thamar kome, dat zij twee koekjes voor mijn ogen toemake, en ik van haar hand ete.", "7": "Toen zond David heen tot Thamar in het huis, zeggende: Ga toch heen in het huis van uw broeder Amnon, en maak hem een spijze.", "8": "En Thamar ging heen in het huis van haar broeder Amnon, ( hij nu was nederliggende), en zij nam deeg, en kneedde het, en maakte koekjes toe voor zijn ogen, en bakte de koekjes.", "9": "En zij nam een pan, en goot ze uit voor zijn aangezicht; maar hij weigerde te eten. En Amnon zeide: Doet alle man van mij uitgaan. En alle man ging van hem uit.", "10": "Toen zeide Amnon tot Thamar: Breng de spijze in de kamer, dat ik van uw hand ete; zo nam Thamar de koekjes, die zij gemaakt had, en bracht ze haar broeder Amnon in de kamer.", "11": "Als zij ze nu tot hem nabij bracht, dat hij ate, zo greep hij haar, en zeide tot haar: Kom, lig bij mij, mijn zuster!", "12": "Maar zij zeide tot hem: Niet, mijn broeder, verkracht mij niet, want alzo doet men niet in Israël; doe deze dwaasheid niet.", "13": "Want ik, waarhenen zou ik mijn schande brengen? En gij, gij zoudt zijn als een der dwazen in Israël; zo spreek toch nu tot den koning, want hij zal mij van u niet onthouden.", "14": "Doch hij wilde naar haar stem niet horen; maar sterker zijnde dan zij, zo verkrachtte hij haar, en lag bij haar.", "15": "Daarna haatte haar Amnon met een zeer groten haat; want de haat, waarmede hij haar haatte, was groter dan de liefde, waarmede hij haar had liefgehad; en Amnon zeide tot haar: Maak u op, ga weg.", "16": "Toen zeide zij tot hem: Er zijn geen oorzaken om mij uit te drijven; dit kwaad zou groter zijn dan het andere, dat gij bij mij gedaan hebt; maar hij wilde naar haar niet horen.", "17": "En hij riep zijn jongen, die hem diende, en zeide: Drijf nu deze van mij uit naar buiten, en grendel de deur achter haar toe.", "18": "Zij nu had een veelvervigen rok aan; want alzo werden des konings dochteren, die maagden waren, met mantels gekleed; en zijn dienaar bracht haar uit tot buiten, en grendelde de deur achter haar toe.", "19": "Toen nam Thamar as op haar hoofd, en scheurde den veelvervigen rok, dien zij aanhad; en zij leide haar hand op haar hoofd, en ging vast henen en kreet.", "20": "En haar broeder Absalom zeide tot haar: Is uw broeder Amnon bij u geweest? Nu dan, mijn zuster, zwijg stil, hij is uw broeder; zet uw hart niet op deze zaak. Alzo bleef Thamar en was eenzaam in het huis van haar broeder Absalom.", "21": "Als de koning David al deze dingen hoorde, zo ontstak hij zeer.", "22": "Doch Absalom sprak niet met Amnon, noch kwaad noch goed; maar Absalom haatte Amnon, ter oorzake dat hij zijn zuster Thamar verkracht had.", "23": "En het geschiedde, na twee volle jaren, dat Absalom, *schaaps* scheerders had te Baäl-hazor, dat bij Efraïm is; zo nodigde Absalom al des konings zonen.", "24": "En Absalom kwam tot den koning, en zeide: Zie, nu heeft uw knecht *schaaps* scheerders; dat toch de koning en zijn knechten met uw knecht gaan.", "25": "Maar de koning zeide tot Absalom: Niet, mijn zoon, laat ons toch niet al te zamen gaan, opdat wij u niet bezwaarlijk zijn; en hij hield bij hem aan, doch hij wilde niet gaan, maar zegende hem.", "26": "Toen zeide Absalom: Zo niet, laat toch mijn broeder Amnon met ons gaan. Maar de koning zeide tot hem: Waarom zou hij met u gaan?", "27": "Als Absalom bij hem aanhield, zo liet hij Amnon en al des konings zonen met hem gaan.", "28": "Absalom nu gebood zijn jongens, zeggende: Let er nu op, als Amnons hart vrolijk is van den wijn, en ik tot ulieden zal zeggen: Slaat Amnon, dan zult gij hem doden; vreest niet; is het niet, omdat ik het u geboden heb? Zijt sterk en weest dapper.", "29": "En Absaloms jongens deden aan Amnon, gelijk als Absalom geboden had. Toen stonden alle zonen des konings op, en reden een iegelijk op zijn muildier, en vloden.", "30": "En het geschiedde, als zij op den weg waren, dat het gerucht tot David kwam, dat men zeide: Absalom heeft al de zonen des konings geslagen, en er is niet een van hen overgelaten.", "31": "Toen stond de koning op, en scheurde zijn klederen, en leide zich neder ter aarde; desgelijks stonden al zijn knechten met gescheurde klederen.", "32": "Maar Jonadab, de zoon van Simea, Davids broeder, antwoordde en zeide: Mijn heer zegge niet, dat zij al de jongelingen, des konings zonen, gedood hebben; maar Amnon alleen is dood; want bij Absalom is er op toegeleid, van den dag af, dat hij zijn zuster Thamar verkracht heeft.", "33": "Zo neme nu mijn heer de koning de zaak niet in zijn hart, denkende: al des konings zonen zijn dood; want Amnon alleen is dood.", "34": "Absalom nu vluchtte; en de jongen, die de wacht hield, hief zijn ogen op, en zag toe, en ziet, er kwam veel volks van den weg achter hem, aan de zijde van het gebergte.", "35": "Toen zeide Jonadab tot den koning: Zie, de zonen des konings komen; naar het woord uws knechts, alzo is het geschied.", "36": "En het geschiedde, als hij geëindigd had te spreken, ziet, zo kwamen de zonen des konings, en hieven hun stemmen op en weenden; en de koning ook en al zijn knechten weenden met een zeer groot geween.", "37": "( Absalom dan vluchtte, en toog tot Thalmai, den zoon van Ammihur, koning van Gesur.) En hij droeg rouw over zijn zoon, al die dagen.", "38": "Alzo vluchtte Absalom, en toog naar Gesur; en hij was aldaar drie jaren.", "39": "Toen verlangde *de* *ziel* van den koning David zeer om naar Absalom uit te trekken; want hij had zich getroost over Amnon, dat hij dood was."}, "KJV": {"1": "And it came to pass after this, that Absalom the son of David had a fair sister, whose name was Tamar; and Amnon the son of David loved her.", "2": "And Amnon was so vexed, that he fell sick for his sister Tamar; for she was a virgin; and Amnon thought it hard for him to do any thing to her.", "3": "But Amnon had a friend, whose name was Jonadab, the son of Shimeah David's brother: and Jonadab was a very subtil man.", "4": "And he said unto him, Why art thou, being the king's son, lean from day to day? wilt thou not tell me? And Amnon said unto him, I love Tamar, my brother Absalom's sister.", "5": "And Jonadab said unto him, Lay thee down on thy bed, and make thyself sick: and when thy father cometh to see thee, say unto him, I pray thee, let my sister Tamar come, and give me meat, and dress the meat in my sight, that I may see it, and eat it at her hand.", "6": "So Amnon lay down, and made himself sick: and when the king was come to see him, Amnon said unto the king, I pray thee, let Tamar my sister come, and make me a couple of cakes in my sight, that I may eat at her hand.", "7": "Then David sent home to Tamar, saying, Go now to thy brother Amnon's house, and dress him meat.", "8": "So Tamar went to her brother Amnon's house; and he was laid down. And she took flour, and kneaded it, and made cakes in his sight, and did bake the cakes.", "9": "And she took a pan, and poured them out before him; but he refused to eat. And Amnon said, Have out all men from me. And they went out every man from him.", "10": "And Amnon said unto Tamar, Bring the meat into the chamber, that I may eat of thine hand. And Tamar took the cakes which she had made, and brought them into the chamber to Amnon her brother.", "11": "And when she had brought them unto him to eat, he took hold of her, and said unto her, Come lie with me, my sister.", "12": "And she answered him, Nay, my brother, do not force me; for no such thing ought to be done in Israel: do not thou this folly.", "13": "And I, whither shall I cause my shame to go? and as for thee, thou shalt be as one of the fools in Israel. Now therefore, I pray thee, speak unto the king; for he will not withhold me from thee.", "14": "Howbeit he would not hearken unto her voice: but, being stronger than she, forced her, and lay with her.", "15": "Then Amnon hated her exceedingly; so that the hatred wherewith he hated her was greater than the love wherewith he had loved her. And Amnon said unto her, Arise, be gone.", "16": "And she said unto him, There is no cause: this evil in sending me away is greater than the other that thou didst unto me. But he would not hearken unto her.", "17": "Then he called his servant that ministered unto him, and said, Put now this woman out from me, and bolt the door after her.", "18": "And she had a garment of divers colours upon her: for with such robes were the king's daughters that were virgins apparelled. Then his servant brought her out, and bolted the door after her.", "19": "And Tamar put ashes on her head, and rent her garment of divers colours that was on her, and laid her hand on her head, and went on crying.", "20": "And Absalom her brother said unto her, Hath Amnon thy brother been with thee? but hold now thy peace, my sister: he is thy brother; regard not this thing. So Tamar remained desolate in her brother Absalom's house.", "21": "But when king David heard of all these things, he was very wroth.", "22": "And Absalom spake unto his brother Amnon neither good nor bad: for Absalom hated Amnon, because he had forced his sister Tamar.", "23": "And it came to pass after two full years, that Absalom had sheepshearers in Baalhazor, which is beside Ephraim: and Absalom invited all the king's sons.", "24": "And Absalom came to the king, and said, Behold now, thy servant hath sheepshearers; let ➔ the king, I beseech thee, and his servants go with thy servant.", "25": "And the king said to Absalom, Nay, my son, let us not all now go, lest we be chargeable unto thee. And he pressed him: howbeit he would not go, but blessed him.", "26": "Then said Absalom, If not, I pray thee, let my brother Amnon go with us. And the king said unto him, Why should he go with thee?", "27": "But Absalom pressed him, that he let Amnon and all the king's sons go with him.", "28": "Now Absalom had commanded his servants, saying, Mark ye now when Amnon's heart is merry with wine, and when I say unto you, Smite Amnon; then kill him, fear not: have not I commanded you? be courageous, and be valiant.", "29": "And the servants of Absalom did unto Amnon as Absalom had commanded. Then all the king's sons arose, and every man gat him up upon his mule, and fled.", "30": "And it came to pass, while they were in the way, that tidings came to David, saying, Absalom hath slain all the king's sons, and there is not one of them left.", "31": "Then the king arose, and tare his garments, and lay on the earth; and all his servants stood by with their clothes rent.", "32": "And Jonadab, the son of Shimeah David's brother, answered and said, Let not my lord suppose that they have slain all the young men the king's sons; for Amnon only is dead: for by the appointment of Absalom this hath been determined from the day that he forced his sister Tamar.", "33": "Now therefore let not my lord the king take the thing to his heart, to think that all the king's sons are dead: for Amnon only is dead.", "34": "But Absalom fled. And the young man that kept the watch lifted up his eyes, and looked, and, behold, there came much people by the way of the hill side behind him.", "35": "And Jonadab said unto the king, Behold, the king's sons come: as thy servant said, so it is.", "36": "And it came to pass, as soon as he had made an end of speaking, that, behold, the king's sons came, and lifted up their voice and wept: and the king also and all his servants wept very sore.", "37": "But Absalom fled, and went to Talmai, the son of Ammihud, king of Geshur. And David mourned for his son every day.", "38": "So Absalom fled, and went to Geshur, and was there three years.", "39": "And the soul of king David longed to go forth unto Absalom: for he was comforted concerning Amnon, seeing he was dead."}}, "tsk": {"1": [{"kopje": "Absalom", "refs": ["2 Sam 3:2", "2 Sam 3:3", "1 Kron 3:2"]}, {"kopje": "een mooie zuster", "refs": ["2 Sam 11:2", "Gen 6:2", "Gen 39:6", "Gen 39:7", "Spr 6:25", "Spr 31:30"]}, {"kopje": "Thamar", "refs": ["2 Sam 14:27", "1 Kron 3:9"]}, {"kopje": "kreeg haar lief", "refs": ["2 Sam 13:15", "Gen 29:18", "Gen 29:20", "Gen 34:3", "1 Kon 11:1"]}], "2": [{"kopje": "in beslag genomen", "refs": ["1 Kon 21:4", "Hoogl 5:8", "2 Kor 7:10"]}], "3": [{"kopje": "een vriend", "refs": ["Gen 38:1", "Gen 38:20", "Richt 14:20", "Est 5:10", "Est 5:14", "Est 6:13", "Spr 19:6"]}, {"kopje": "Simea", "refs": ["2 Sam 13:32", "1 Sam 16:9"]}, {"kopje": "Simea", "refs": ["2 Sam 14:2", "2 Sam 14:19", "2 Sam 14:20", "Gen 3:1", "Jer 4:22", "1 Kor 3:19", "Jak 3:15"]}], "4": [{"kopje": "Waarom bent u", "refs": ["1 Kon 21:7", "Est 5:13", "Est 5:14", "Luk 12:32"]}, {"kopje": "dag na dag", :5", "svLabel": null}, {"disp": "2 Sam 18:12", "href": "../../2-samuel/18/#v12", "ref": "2 Sam 18:12", "svLabel": null}, {"disp": "2 Sam 18:13", "href": "../../2-samuel/18/#v13", "ref": "2 Sam 18:13", "svLabel": null}, {"disp": "2 Sam 18:33", "href": "../../2-samuel/18/#v33", "ref": "2 Sam 18:33", "svLabel": null}, {"disp": "2 Sam 19:1-6", "href": "../../2-samuel/19/#v1", "ref": "2 Sam 19:1-6", "svLabel": null}], "kinderen": []}]}]}]}, "39": {"nave": [{"topic": "Parents", "href": "../../nave/p/#t-parents", "kinderen": [{"label": "Parental affection exemplified by", "href": "../../nave/p/?hl=2Sam.13.39#i15166", "refs": [], "kinderen": [{"label": "David", "href": "../../nave/p/?hl=2Sam.13.39#i15175", "refs": [{"disp": "2 Sam 12:18-23", "href": "../../2-samuel/12/#v18", "ref": "2 Sam 12:18-23", "svLabel": null}, {"disp": "2 Sam 13:38", "href": "../../2-samuel/13/#v38", "ref": "2 Sam 13:38", "svLabel": null}, {"disp": "2 Sam 13:39", "href": "../../2-samuel/13/#v39", "ref": "2 Sam 13:39", "svLabel": null}, {"disp": "2 Sam 14:1", "href": "../../2-samuel/14/#v1", "ref": "2 Sam 14:1", "svLabel": null}, {"disp": "2 Sam 14:33", "href": "../../2-samuel/14/#v33", "ref": "2 Sam 14:33", "svLabel": null}, {"disp": "2 Sam 18:5", "href": "../../2-samuel/18/#v5", "ref": "2 Sam 18:5", "svLabel": null}, {"disp": "2 Sam 18:12", "href": "../../2-samuel/18/#v12", "ref": "2 Sam 18:12", "svLabel": null}, {"disp": "2 Sam 18:13", "href": "../../2-samuel/18/#v13", "ref": "2 Sam 18:13", "svLabel": null}, {"disp": "2 Sam 18:33", "href": "../../2-samuel/18/#v33", "ref": "2 Sam 18:33", "svLabel": null}, {"disp": "2 Sam 19:1-6", "href": "../../2-samuel/19/#v1", "ref": "2 Sam 19:1-6", "svLabel": null}], "kinderen": []}]}]}]}}, "extern": {"2 Sam 13:1-20": "Het gebeurde daarna dat Absalom, Davids zoon, een mooie zuster had, wier naam Thamar was, en Amnon, Davids zoon, kreeg haar lief. En Amnon werd zo door haar in beslag genomen dat hij er ziek van werd, vanwege zijn zuster Thamar; want zij was een maagd, zodat het in Amnons ogen onmogelijk leek haar iets te doen. Maar Amnon had een vriend, wiens naam Jonadab was, een zoon van Simea, Davids broer; en Jonadab was een zeer sluwe man.", "Gen 39:11": "dat het op zo'n dag gebeurde, dat hij in het huis kwam om zijn werk te doen; en niemand van de mensen van het huis was daar binnen.", "Est 5:13": "Maar dit alles baat mij niet, zolang ik de Jood Mordechai zie zitten in de poort van de koning.", "Spr 19:27": "Laat af, mijn zoon, om, terwijl u de tucht hoort, af te dwalen van de woorden van de kennis.", "Jer 41:7": "Maar het gebeurde, toen zij midden in de stad gekomen waren, dat Ismaël, de zoon van Nethanja, hen keelde, en hen wierp in het midden van het kuil, hij en de mannen die met hem waren.", "2 Sam 14:22": "Toen viel Joab op zijn gezicht ter aarde, en boog zich, en dankte de koning; en Joab zei: Vandaag heeft uw dienaar gemerkt, dat ik genade gevonden heb in uw ogen, mijn heer koning! Omdat de koning gedaan heeft wat zijn dienaar gevraagd heeft.", "Est 5:14": "Toen zei zijn vrouw Zeres tegen hem, alsook al zijn vrienden: Laat men een galg maken, vijftig el hoog, en zeg morgen tegen de koning dat men Mordechai daaraan laat hangen; ga dan vrolijk met de koning naar die maaltijd. Dit voorstel nu leek Haman goed, en hij liet de galg maken.", "Joz 1:9": "Heb Ik het u niet bevolen? Wees sterk en heb goede moed, en wees niet bang, en wees niet ontzet; want de HEERE, uw God, is met u overal waar u heengaat.", "Gen 44:27-29": "Toen zei uw knecht, mijn vader, tegen ons: U weet dat mijn vrouw mij twee zonen gebaard heeft. En de één is bij mij weggegaan, en ik heb gezegd: Voorzeker, hij is zeker verscheurd! En ik heb hem niet meer gezien tot nu toe. Als u nu deze ook van mijn gezicht wegneemt, en hem een ongeluk overkomt, zult u mijn grijze haren met verdriet naar het graf doen afdalen!", "Spr 31:30": "Schin. De bevalligheid is bedrog, en de schoonheid vergankelijk; maar een vrouw die de HEERE vreest, die zal geprezen worden.", "Lev 20:17": "En als een man zijn zuster, de dochter van zijn vader, of de dochter van zijn moeder, neemt, en hij haar schaamte ziet, en zij zijn schaamte ziet, is het een schandvlek; daarom zullen zij voor de ogen van de kinderen van hun volk uitgeroeid worden; hij heeft de schaamte van zijn zuster ontdekt, hij zal zijn ongerechtigheid dragen.", "Ps 50:19": "Uw mond zet u in voor het kwade, en uw tong koppelt bedrog.", "Gen 37:32": "En zij zonden de veelkleurige rok en lieten hem naar hun vader brengen, en zeiden: Dit hebben wij gevonden; herken toch of dit de rok van uw zoon is, of niet.", "2 Sam 21:21": "En hij hoonde Israël; maar Jonathan, de zoon van Simea, Davids broer, sloeg hem.", "2 Sam 15:23": "En heel het land weende met luide stem, terwijl heel het volk overging; ook ging de koning over de beek Kidron, en heel het volk ging over, recht in de richting van de weg naar de woestijn.", "1 Sam 2:29": "Waarom trapt u achteruit tegen Mijn slachtoffer en tegen Mijn spijsoffer, dat Ik geboden heb in de woning; en eert u uw zonen meer dan Mij, dat u zich mest van het voornaamste van alle spijsoffers van Mijn volk Israël?", "Jer 41:5": "Zo kwamen er mannen van Sichem, van Silo, en van Samaria, tachtig man, met de baard afgeschoren, en de kleren gescheurd, en zichzelf gesneden; en spijsoffer en wierook waren in hun hand, om naar het huis van de HEERE te brengen.", "Gen 37:34": "Toen scheurde Jakob zijn kleren en legde een zak om zijn heupen; en hij bedreef rouw over zijn zoon, vele dagen.", "2 Sam 11:2": "Zo gebeurde het tegen de avondtijd, dat David van zijn bed opstond, en wandelde op het dak van het koningshuis, en zag van het dak een vrouw die zich waste; deze vrouw nu was zeer schoon van uiterlijk.", "2 Sam 14:27": "Ook werden aan Absalom drie zonen geboren, en één dochter, wier naam Tamar was; deze was een vrouw, mooi van uiterlijk.", "2 Sam 14:20": "Om de zaak zo een andere gestalte te geven, dat heeft uw dienaar Joab gedaan; maar mijn heer is wijs, met de wijsheid van een Engel van God, om alles te doorzien wat op de aarde is.", "Gen 31:29": "Het staat in de macht van mijn hand u kwaad te doen; maar de God van uw vader heeft gisteravond tegen mij gesproken en gezegd: Pas op, dat u met Jakob niet spreekt, noch goed, noch kwaad.", "Jes 52:8": "Er is een stem van uw wachters; zij verheffen de stem, zij juichen samen; want zij zullen oog in oog zien, wanneer de HEERE Sion terugbrengen zal.", "Richt 3:19": "maar hij zelf keerde terug van de gesneden beelden die bij Gilgal waren, en zei: Ik heb een geheime zaak aan u, o koning! Die zei: Zwijg! En allen die om hem heen stonden, gingen van hem weg.", "Hand 23:15": "Laat u dan nu, samen met de raad, de aanvoerder weten dat hij hem morgen naar u toe brengt, alsof u nadere kennis van zijn zaak zou willen nemen; en wij zijn bereid om hem te doden voordat hij bij u komt.", "Gen 24:50": "Toen antwoordden Laban en Bethuël, en zeiden: Van de HEERE is deze zaak uitgegaan; wij kunnen tot u niets kwaads of goeds zeggen.", "Gen 34:7": "En de zonen van Jakob kwamen van het veld toen zij dit hoorden; en het deed deze mannen verdriet, en zij ontstaken in grote woede, omdat hij dwaasheid in Israël gedaan had door bij Jakobs dochter te liggen, wat zo niet gedaan had mogen worden.", "1 Kon 21:11-13": "En de mannen van zijn stad, die oudsten en die edelen, die in zijn stad woonden, deden zoals Izebel hun gezonden had; zoals geschreven was in de brieven die zij hun gezonden had. Zij riepen een vasten uit; en zij zetten Naboth vooraan onder het volk. Toen kwamen de twee mannen, zonen van Belial, en gingen tegenover hem zitten; en de mannen van Belial getuigden tegen hem, tegen Naboth, voor het volk, en zeiden: Naboth heeft God en de koning gevloekt. En zij voerden hem de stad uit, en stenigden hem met stenen, zodat hij stierf.", "Gen 36:24": "En dit zijn de zonen van Zibeon: Aja en Ana; dat is die Ana, die de muildieren in de woestijn gevonden heeft, toen hij de ezels van zijn vader Zibeon weidde.", "Fil 2:26": "Omdat hij zeer begerig was naar u allen, en zeer beangst was, omdat u had gehoord dat hij ziek was geweest.", "Matt 26:65": "Toen scheurde de hogepriester zijn kleren en zei: Hij heeft God gelasterd, waarom hebben wij nog getuigen nodig? Zie, nu hebt u Zijn godslastering gehoord.", "2 Sam 14:1": "Joab, de zoon van Zeruja, merkte dat het hart van de koning naar Absalom uitging.", "Spr 5:23": "Hij zal sterven, omdat hij zonder tucht geweest is, en in de grootheid van zijn dwaasheid zal hij verdwalen.", "2 Sam 20:9": "En Joab zei tegen Amasa: Is het goed met u, mijn broeder? En Joab pakte met de rechterhand de baard van Amasa, om hem te kussen.", "Deut 22:25-27": "En als een man een verloofde jonge dochter op het veld vindt, en de man haar verkracht en bij haar ligt, dan zal alleen de man die bij haar gelegen heeft, sterven; Maar de jonge dochter zult u niets doen; de jonge dochter heeft geen zonde die de dood verdient; want zoals wanneer een man tegen zijn naaste opstaat en hem doodslaat, zo is ook deze zaak. Want hij heeft haar op het veld gevonden; de verloofde jonge dochter riep, maar er was niemand om haar te redden.", "Ex 1:16": "en hij zei: Wanneer u de Hebreeuwse vrouwen bij de bevalling helpt, en u ziet hen op de baarstoelen; is het een zoon, dood hem dan; maar is het een dochter, laat haar dan leven!", "2 Sam 11:13": "En David nodigde hem, zodat hij voor zijn aangezicht at en dronk, en hij maakte hem dronken. Daarna ging hij 's avonds naar buiten, om zich neer te leggen op zijn bed, bij de knechten van zijn heer, maar hij ging niet naar zijn huis.", "Gen 46:15": "Dit zijn de zonen van Lea, die zij Jakob gebaard heeft in Paddan-Aram, samen met Dina, zijn dochter; al de zielen van zijn zonen en zijn dochters waren drieëndertig.", "Lev 2:5": "En indien uw offer een spijsoffer is, in de pan gebakken, zal het van ongezuurde meelbloem zijn, met olie gemengd.", "Ex 12:34": "En het volk nam zijn deeg op, voordat het gedesemd was, hun deegbakken, gebonden in hun kleren, op hun schouders.", "Est 4:1": "Toen Mordechai wist wat er allemaal gebeurd was, verscheurde hij zijn kleren en trok een zak met as aan; en hij ging door het midden van de stad, en riep met een luid en bitter geroep.", "2 Sam 14:2": "Zo zond Joab iemand naar Thekoa, en liet vandaar een wijze vrouw halen; en hij zei tegen haar: Doe toch alsof u rouw draagt, en trek nu rouwkleren aan, en zalf u niet met olie, en wees als een vrouw die al veel dagen rouw heeft gedragen over een dode;", "Spr 29:12": "Een heerser die op leugentaal let, al zijn dienaars worden goddeloos.", "Gen 37:29": "Toen Ruben nu naar de kuil terugkeerde, zie, Jozef was niet meer in de kuil; toen scheurde hij zijn kleren.", "Gen 31:30": "En nu, u hebt zeker willen vertrekken, omdat u zo vurig verlangde naar het huis van uw vader; maar waarom hebt u mijn goden gestolen?", "Luk 21:34": "En let op uzelf, dat uw harten niet op enig moment bezwaard worden met brasserij en dronkenschap, en zorgen van dit leven, en dat die dag u niet onvoorzien overkomt.", "Rom 12:19": "Wreek uzelf niet, geliefden, maar geef de toorn plaats; want er is geschreven: Mij komt de wraak toe; Ik zal het vergelden, zegt de Heere.", "Zef 1:7": "Zwijg voor het aangezicht van de Heere HEERE; want de dag van de HEERE is nabij; want de HEERE heeft een slachtoffer bereid, Hij heeft Zijn genode geheiligd.", "Est 5:4": "Esther nu zei: Als het de koning goeddunkt, laat de koning dan met Haman vandaag komen naar de maaltijd die ik voor hem heb klaargemaakt.", "Hoogl 5:8": "Ik bezweer u, dochters van Jeruzalem! Als u mijn Liefste vindt, wat zult u Hem zeggen? Dat ik ziek ben van liefde.", "Ezra 9:3": "Toen ik deze zaak hoorde, scheurde ik mijn kleed en mijn mantel; en ik trok het haar van mijn hoofd en van mijn baard uit, en zat verbaasd neer.", "1 Sam 16:9": "Daarna liet Isaï Samma langslopen; doch hij zei: Ook deze heeft de HEERE niet uitgekozen.", "Jak 3:15": "Dat is de wijsheid niet die van boven komt, maar is aards, ongeestelijk, duivels.", "2 Kon 5:8": "Maar het gebeurde, toen Elisa, de man van God, gehoord had dat de koning van Israël zijn kleren had gescheurd, dat hij naar de koning stuurde, om te zeggen: Waarom hebt u uw kleren gescheurd? Laat hem nu naar mij toe komen, dan zal hij weten dat er een profeet in Israël is.", "1 Sam 25:11": "Zou ik dan mijn brood, en mijn water, en mijn geslacht vlees nemen, dat ik voor mijn scheerders geslacht heb, en zou ik dat geven aan mannen van wie ik niet weet waar zij vandaan komen?", "1 Sam 25:4": "Toen David in de woestijn hoorde dat Nabal zijn schapen schoor,", "Gen 29:20": "Zo diende Jakob zeven jaar voor Rachel; en die waren in zijn ogen als enkele dagen, omdat hij haar liefhad.", "Richt 19:6": "Zo gingen zij zitten, en zij beiden aten samen, en dronken. Toen zei de vader van de jonge vrouw tegen de man: Blijf toch, en overnacht, en laat uw hart vrolijk zijn.", "2 Sam 18:12": "Maar die man zei tegen Joab: Al zou ik duizend zilverstukken op mijn handen krijgen, dan nog zou ik mijn hand niet slaan aan de zoon van de koning; want de koning heeft u, en Abisai, en Ithai, voor onze oren bevolen en gezegd: Pas op, wie u ook bent, voor de jongeman, voor Absalom.", "Dan 5:2-6": "Toen Belsazar de wijn geproefd had, zei hij dat men de gouden en zilveren vaten voor moest brengen, die zijn vader Nebukadnezar uit de tempel die te Jeruzalem geweest was, weggevoerd had; opdat de koning en zijn leiders, zijn vrouwen en zijn bijvrouwen daaruit zouden drinken. Toen bracht men de gouden vaten, die men uit de tempel van het huis van God, die te Jeruzalem geweest was, weggevoerd had; en de koning en zijn leiders, zijn vrouwen en zijn bijvrouwen dronken daaruit. Zij dronken de wijn, en prezen de gouden, zilveren, koperen, ijzeren, houten en stenen goden.", "Gen 18:6": "En Abraham haastte zich naar de tent, naar Sara, en zei: Haast u; kneed drie maten meelbloem en maak koeken.", "2 Sam 3:2": "En David werden zonen geboren in Hebron. Zijn eerstgeborene was Amnon, van Ahinoam, de Jizreëlietische;", "2 Sam 13:22-29": "Doch Absalom sprak niet met Amnon, noch kwaad noch goed; maar Absalom haatte Amnon, vanwege het feit dat hij zijn zuster Thamar verkracht had. En het gebeurde, na twee volle jaren, dat Absalom schaapscheerders had bij Baäl-Hazor, dat bij Efraïm ligt; en Absalom nodigde alle zonen van de koning uit. En Absalom kwam bij de koning, en zei: Zie, uw knecht heeft nu schaapscheerders; laat toch de koning en zijn knechten met uw knecht meegaan.", "Num 14:6": "En Jozua, de zoon van Nun, en Kaleb, de zoon van Jefunne, die bij hen waren die dat land verspied hadden, scheurden hun kleren.", "Deut 28:32": "Uw zonen en uw dochters zullen aan een ander volk gegeven worden, terwijl uw ogen toekijken en de hele dag naar hen smachten; maar het zal niet in de macht van uw hand zijn.", "2 Sam 19:1-6": "En Joab werd verteld: Zie, de koning huilt en bedrijft rouw over Absalom. Toen werd de overwinning op diezelfde dag voor het hele volk tot rouw; want het volk had diezelfde dag horen zeggen: Het smart de koning over zijn zoon. En het volk kwam diezelfde dag stiekem de stad binnen, zoals het volk zich wegsteelt, dat beschaamd is wanneer zij in de strijd gevlucht zijn.", "Hand 14:14": "Maar toen de apostelen Barnabas en Paulus dit hoorden, scheurden zij hun kleren, en sprongen onder de menigte, en riepen:", "2 Sam 13:6-29": "Amnon legde zich toen neer, en deed alsof hij ziek was. Toen nu de koning kwam om hem te zien, zei Amnon tegen de koning: Laat toch mijn zuster Thamar komen, dat zij twee koekjes voor mijn ogen klaarmaakt, en ik ze uit haar hand eet. Toen zond David iemand naar Thamar in het huis, en zei: Ga toch naar het huis van uw broer Amnon, en maak voor hem voedsel klaar. En Thamar ging naar het huis van haar broer Amnon (hij lag namelijk neer), en zij nam deeg, en kneedde het, en maakte er voor zijn ogen koekjes van, en bakte de koekjes.", "1 Kon 10:25": "En zij brachten ieder zijn geschenk, zilveren vaten, en gouden vaten, en klederen, en wapenrusting, en specerijen, paarden en muilezels, elk jaar opnieuw.", "1 Kon 21:4": "Toen kwam Achab in zijn huis, knorrig en toornig over het woord dat Naboth, de Jizreëliet, tot hem gesproken had, want hij had gezegd: Ik zal de erfenis van mijn vaderen niet geven. En hij legde zich neer op zijn bed, keerde zijn gezicht om, en at geen brood.", "Joh 3:20": "Want ieder die kwaad doet, haat het licht en komt niet tot het licht, opdat zijn werken niet bestraft worden.", "Joz 7:6": "Toen scheurde Jozua zijn kleren, en viel op zijn gezicht ter aarde, voor de ark van de HEERE, tot de avond toe, hij en de oudsten van Israël; en zij wierpen stof op hun hoofd.", "Lev 19:17": "U zult uw broeder in uw hart niet haten; u zult uw naaste zeker berispen, en zult de zonde in hem niet laten voortbestaan.", "Spr 26:24-26": "Wie haat draagt, houdt zich anders voor met zijn lippen; maar in zijn binnenste beraamt hij bedrog. Als hij vriendelijk spreekt, geloof hem niet, want zeven gruwelen zijn in zijn hart. Wiens haat door bedrog bedekt is, diens slechtheid zal in de gemeente openbaar worden.", "2 Sam 1:2": "dat het op de derde dag gebeurde dat er, kijk, uit het leger van Saul een man kwam, wiens kleren gescheurd waren, en aarde was op zijn hoofd; en het gebeurde, toen hij bij David kwam, dat hij ter aarde viel en zich neerboog.", "Ps 84:3": "Mijn ziel is begerig, en bezwijkt ook van verlangen, naar de voorhoven van de HEERE; mijn hart en mijn vlees roepen uit tot de levende God.", "2 Sam 18:9": "Absalom nu kwam de knechten van David tegen; en Absalom reed op een muildier; en toen het muildier onder de dichte takken van een grote eik kwam, raakte zijn hoofd vast in de eik, zodat hij bleef hangen tussen hemel en aarde, en het muildier dat onder hem was, liep door.", "Jes 36:22": "Toen kwam Eljakim, de zoon van Hilkia, de hofmeester, en Sebna, de schrijver, en Joah, de zoon van Asaf, de kanselier, naar Hizkia met gescheurde kleren; en zij vertelden hem de woorden van Rabsake.", "1 Sam 28:24": "En de vrouw had een gemest kalf in het huis; en zij haastte zich en slachtte het; en zij nam meel, en kneedde het, en bakte daar ongezuurde koeken van.", "2 Kon 2:12": "En Elisa zag het, en hij riep: Mijn vader, mijn vader, wagen van Israël en zijn ruiters! En hij zag hem niet meer; en hij greep zijn klederen en scheurde ze in twee stukken.", "2 Kon 1:9-12": "En hij zond naar hem een leider over vijftig met zijn vijftigtal. En toen hij naar hem opklom (want zie, hij zat op de top van een berg), sprak hij tot hem: Man van God! De koning zegt: Kom naar beneden. Maar Elia antwoordde en sprak tot de leider over vijftig: Als ik dan een man van God ben, laat er dan vuur uit de hemel neerdalen, dat u en uw vijftigtal verteert. Toen daalde er vuur uit de hemel neer, en het verteerde hem en zijn vijftigtal. En hij zond weer naar hem een andere leider over vijftig met zijn vijftigtal. Deze antwoordde en sprak tot hem: Man van God! Zo zegt de koning: Kom snel naar beneden.", "1 Kron 3:9": "Deze allen zijn zonen van David, behalve de kinderen van de bijvrouwen, en Thamar hun zuster.", "1 Sam 2:22-25": "Doch Eli was zeer oud, en hoorde alles wat zijn zonen aan heel Israël deden, en dat zij sliepen bij de vrouwen die met velen samenkwamen bij de deur van de tent van de samenkomst. En hij zei tegen hen: Waarom doet u zulke dingen, dat ik deze uw slechte daden hoor van heel dit volk? Nee, mijn zonen; want dit is geen goed gerucht, dat ik hoor; u maakt dat het volk van de HEERE overtreedt.", "1 Sam 22:17": "En de koning zei tegen de lijfwachten die bij hem stonden: Wend u om, en dood de priesters van de HEERE, omdat hun hand ook met David is, en omdat zij geweten hebben dat hij vluchtte, en het mij niet hebben laten horen. Doch de knechten van de koning wilden hun hand niet uitsteken om de priesters van de HEERE aan te vallen.", "2 Sam 3:31": "David dan zei tegen Joab en tegen al het volk dat bij hem was: Scheur uw kleren, en doe rouwgewaden aan, en klaag over Abner. En koning David liep zelf achter de baar.", "Jes 62:6": "O Jeruzalem! Ik heb wachters op uw muren aangesteld, die voortdurend, de hele dag en de hele nacht, niet zullen zwijgen. U die de HEERE doet gedenken, laat geen stilzwijgen bij u zijn!", "1 Kor 3:19": "Want de wijsheid van deze wereld is dwaasheid bij God; want er is geschreven: Hij vat de wijzen in hun sluwheid;", "Gen 38:20": "En Juda stuurde het geitenbokje door de hand van zijn vriend, de Adullamiet, om het onderpand uit de hand van de vrouw terug te krijgen; maar hij vond haar niet.", "Spr 19:6": "Velen smeken de gunst van de vorst af; en ieder is een vriend van hem die geschenken geeft.", "2 Sam 13:6-14": "Amnon legde zich toen neer, en deed alsof hij ziek was. Toen nu de koning kwam om hem te zien, zei Amnon tegen de koning: Laat toch mijn zuster Thamar komen, dat zij twee koekjes voor mijn ogen klaarmaakt, en ik ze uit haar hand eet. Toen zond David iemand naar Thamar in het huis, en zei: Ga toch naar het huis van uw broer Amnon, en maak voor hem voedsel klaar. En Thamar ging naar het huis van haar broer Amnon (hij lag namelijk neer), en zij nam deeg, en kneedde het, en maakte er voor zijn ogen koekjes van, en bakte de koekjes.", "Gen 44:13": "Toen scheurden zij hun kleren, en ieder man laadde zijn ezel weer op, en zij keerden terug naar de stad.", "2 Sam 11:8-15": "Daarna zei David tegen Uria: Ga naar uw huis, en was uw voeten. En toen Uria uit het huis van de koning wegging, volgde hem een gerecht van de koning achterna. Maar Uria legde zich neer voor de deur van het huis van de koning, bij alle knechten van zijn heer; en hij ging niet naar zijn huis. En zij lieten David weten: Uria is niet naar zijn huis gegaan. Toen zei David tegen Uria: Komt u niet van een reis? Waarom bent u niet naar uw huis gegaan?", "Spr 10:18": "Wie haat bedekt, heeft valse lippen, en wie een kwaad gerucht verspreidt, is een dwaas.", "2 Sam 11:13-15": "En David nodigde hem, zodat hij voor zijn aangezicht at en dronk, en hij maakte hem dronken. Daarna ging hij 's avonds naar buiten, om zich neer te leggen op zijn bed, bij de knechten van zijn heer, maar hij ging niet naar zijn huis. 's Morgens nu gebeurde het, dat David een brief schreef aan Joab; en hij stuurde die door de hand van Uria. En hij schreef in die brief: Stel Uria vooraan tegenover de sterkste strijd, en trek u van achter hem terug, opdat hij geslagen wordt en sterft.", "2 Sam 13:23-29": "En het gebeurde, na twee volle jaren, dat Absalom schaapscheerders had bij Baäl-Hazor, dat bij Efraïm ligt; en Absalom nodigde alle zonen van de koning uit. En Absalom kwam bij de koning, en zei: Zie, uw knecht heeft nu schaapscheerders; laat toch de koning en zijn knechten met uw knecht meegaan. Maar de koning zei tegen Absalom: Nee, mijn zoon, laten we toch niet allemaal samen gaan, opdat wij u niet tot last zijn; en hij drong bij hem aan, doch hij wilde niet gaan, maar zegende hem.", "Luk 24:29": "En zij drongen bij Hem aan en zeiden: Blijf bij ons, want het is bijna avond, en de dag is bijna voorbij. En Hij ging naar binnen om bij hen te blijven.", "Luk 12:32": "Wees niet bang, klein kuddeke, want het is het welbehagen van uw Vader om u het Koninkrijk te geven.", "Gen 39:7": "En het gebeurde na deze dingen, dat de vrouw van zijn heer haar ogen op Jozef liet vallen; en zij zei: lig bij mij!", "Gen 38:13": "En men liet Thamar weten: Zie, uw schoonvader gaat naar Timna om zijn schapen te scheren.", "Ex 8:3": "Zodat de rivier van kikkers zal krioelen; die zullen opkomen en in uw huis komen, en in uw slaapkamer, ja, op uw bed; ook in de huizen van uw knechten, en op uw volk, en in uw bakovens, en in uw baktroggen.", "Est 4:3": "En in elk landschap en elke plaats, waar het woord van de koning en zijn wet aankwam, was er grote rouw onder de Joden, met vasten, geween en misbaar; velen lagen in zakken en as.", "Ruth 3:7": "Toen Boaz nu gegeten en gedronken had, en zijn hart vrolijk was, kwam hij om neer te liggen aan het uiterste van een korenhoop. Daarna kwam zij stilletjes binnen, en sloeg zijn voetdeksel open, en ging liggen.", "2 Sam 12:23": "Maar nu is het dood, waarom zou ik nu vasten? Zal ik het nog kunnen terughalen? Ik zal wel naar hem toe gaan, maar hij zal niet naar mij terugkomen.", "Dan 5:30": "In diezelfde nacht werd Belsazar, de koning van de Chaldeeën, gedood.", "2 Sam 13:24-28": "En Absalom kwam bij de koning, en zei: Zie, uw knecht heeft nu schaapscheerders; laat toch de koning en zijn knechten met uw knecht meegaan. Maar de koning zei tegen Absalom: Nee, mijn zoon, laten we toch niet allemaal samen gaan, opdat wij u niet tot last zijn; en hij drong bij hem aan, doch hij wilde niet gaan, maar zegende hem. Toen zei Absalom: Als het dan niet kan, laat toch mijn broer Amnon met ons meegaan. Maar de koning zei tegen hem: Waarom zou hij met u meegaan?", "2 Sam 13:34-38": "Absalom nu vluchtte; en de knecht die de wacht hield, hief zijn ogen op, en keek toe, en zie, er kwam veel volk van de weg achter hem, aan de kant van het gebergte. Toen zei Jonadab tegen de koning: Zie, de zonen van de koning komen; zoals uw knecht gezegd heeft, zo is het gebeurd. En het gebeurde, toen hij was uitgesproken, zie, dat de zonen van de koning kwamen, en hun stemmen verhieven en huilden; en de koning ook, en al zijn knechten, huilden zeer luid.", "Richt 20:6": "Toen greep ik mijn bijvrouw, en deelde haar in stukken, en zond haar in het hele land van de erfenis van Israël, omdat zij een schandelijke daad en dwaasheid in Israël gedaan hadden.", "Spr 26:24": "Wie haat draagt, houdt zich anders voor met zijn lippen; maar in zijn binnenste beraamt hij bedrog.", "Gen 39:6": "En hij liet alles wat hij had over aan Jozefs hand, zodat hij met hem van geen ding kennis had, behalve van het brood dat hij at. En Jozef was mooi van gestalte, en mooi van gezicht.", "Ezech 23:17": "De zonen van Babel nu kwamen tot haar, in het bed van de liefde, en verontreinigden haar met hun hoererij; ook verontreinigde zij zich met hen; daarna werd haar ziel van hen afgekeerd.", "Richt 14:20": "En de vrouw van Simson werd gegeven aan het metgezel van hem, die hem vergezeld had.", "Ex 1:17": "Maar de vroedvrouwen vreesden God, en deden niet wat de koning van Egypte tegen hen gezegd had, maar zij hielden de jongetjes in leven.", "Ps 45:14": "De Dochter van de Koning is geheel verheerlijkt van binnen; haar kleding is van gouden borduursel.", "Luk 7:36": "En een van de Farizeeën vroeg Hem of Hij met hem wilde eten; en Hij ging het huis van de Farizeeër binnen, en ging aanliggen.", "Est 5:10": "Toch bedwong Haman zich, en hij kwam bij zijn huis; en hij stuurde mensen, en liet zijn vrienden komen, en Zeres, zijn vrouw.", "Jer 2:37": "U zult ook van hier uitgaan met uw handen op uw hoofd; want de HEERE heeft al uw vertrouwen verworpen, zodat u daarmee niet zult gedijen.", "Gen 38:1": "En het gebeurde in die tijd, dat Juda van zijn broers wegtrok, en hij ging naar een man uit Adullam, wiens naam Hira was.", "2 Kron 26:10": "Hij bouwde ook torens in de woestijn, en hakte veel putten uit, omdat hij veel vee had, zowel in de laagten als in de effent velden; akkerlieden en wijngaardeniers op de bergen en op de vruchtbare velden; want hij was een liefhebber van het bewerken van het land.", "Lev 19:19": "U zult Mijn inzettingen houden; u zult uw vee niet van twee verschillende soorten met elkaar laten paren; uw akker zult u niet met tweeërlei zaad bezaaien, en een kleed van twee soorten stof, dooreen vermengd, zal u niet aandoen.", "Luk 11:7": "En dat die van binnen dan zou antwoorden en zeggen: Val mij niet lastig; de deur is al gesloten, en mijn kinderen zijn met mij in de slaapkamer; ik kan niet opstaan om u te geven.", "2 Sam 17:1-4": "Verder zei Achitofel tegen Absalom: Laat mij nu twaalfduizend man uitkiezen, dan sta ik op en jaag David deze nacht achterna. Zo zal ik hem overvallen terwijl hij moe en slap van handen is, en zal hem schrik aanjagen; en al het volk dat bij hem is zal vluchten; dan zal ik de koning alleen doden. En ik zal al het volk naar u laten terugkeren; de man die u zoekt, is gelijk aan het terugkeren van allen; zo zal al het volk in vrede zijn.", "Gen 34:2": "Sichem nu, de zoon van Hemor de Heviet, de landvorst, zag haar, en hij nam haar, en lag bij haar, en verkrachtte haar.", "Spr 24:12": "Wanneer u zegt: Zie, wij wisten dat niet; zal Hij, Die de harten weegt, dat niet merken? En Die uw ziel gadeslaat, zal Hij het niet weten? Want Hij zal de mens vergelden naar zijn werk.", "Hand 16:15": "En toen zij gedoopt was, en haar huis, smeekte zij ons: Als u geoordeeld hebt dat ik de Heere trouw ben, kom dan in mijn huis en blijf daar. En zij drong er sterk op aan.", "2 Kon 6:30": "En het gebeurde, toen de koning de woorden van deze vrouw gehoord had, dat hij zijn kleren scheurde, terwijl hij over de muur voortging; en het volk zag dat er, zie, een zak van binnen over zijn vlees was.", "2 Kon 19:1": "En het gebeurde, toen koning Hizkia dat hoorde, dat hij zijn kleren scheurde en zich met een zak bedekte, en naar het huis van de HEERE ging.", "Richt 19:23": "En de man, de heer van het huis, ging naar hen toe naar buiten, en zei tegen hen: Nee, mijn broeders, doe toch zo'n kwaad niet; omdat deze man in mijn huis gekomen is, doe zo'n dwaasheid niet.", "Ruth 2:4": "En zie, Boaz kwam van Bethlehem, en zei tegen de maaiers: De HEERE zij met u! En zij zeiden tegen hem: De HEERE zegent u!", "Gen 4:8-14": "En Kaïn sprak met zijn broeder Abel; en het gebeurde, toen zij op het veld waren, dat Kaïn tegen zijn broeder Abel opstond en hem doodsloeg. En de HEERE zei tegen Kaïn: Waar is Abel, uw broeder? En hij zei: Ik weet het niet; ben ik de hoeder van mijn broeder? En Hij zei: Wat hebt u gedaan? Daar is een stem van het bloed van uw broeder, die tot Mij roept vanuit de aardbodem.", "Hoogl 5:5": "Ik stond op om mijn Liefste open te doen; en mijn handen droppen, terwijl ze van mirre druppen, en mijn vingers van vloeiende mirre, op de handvaten van het slot.", "2 Kon 22:19": "Omdat uw hart week geworden is, en u zich voor het aangezicht van de HEERE vernederd hebt, toen u hoorde wat Ik gesproken heb tegen deze plaats en haar inwoners, dat zij tot een verwoesting en vloek zullen worden, en dat u uw kleren gescheurd en voor Mijn aangezicht geweend hebt; zo heb Ik u ook verhoord, spreekt de HEERE.", "Ef 4:31": "Alle bitterheid, en toorn, en gramschap, en geroep, en lastering worde van u geweerd, met alle boosheid;", "2 Sam 18:5": "En de koning gaf bevel aan Joab, en Abisai, en Ithai, en zei: Ga zachtzinnig om met de jongeman, met Absalom. En al het volk hoorde het, toen de koning aan alle leiders bevel gaf over de zaak van Absalom.", "2 Sam 15:30": "En David ging op door de opgang van de olijven, terwijl hij opging en weende, en zijn hoofd was bedekt; en hij zelf ging blootsvoets; ook had heel het volk dat bij hem was, ieder zijn hoofd bedekt, en zij gingen op, terwijl zij opgingen en weenden.", "Spr 6:25": "Begeer haar schoonheid niet in uw hart, en laat u door haar niet vangen met haar oogleden.", "2 Kor 7:10": "Want de droefheid naar God werkt een onberouwelijke bekering tot zaligheid; maar de droefheid van de wereld werkt de dood.", "2 Sam 3:3": "en zijn tweede was Chileab, van Abigaïl, de vrouw van Nabal, de Karmeliet; en de derde, Absalom, de zoon van Maächa, de dochter van Thalmai, koning van Gesur;", "Lev 18:9": "De schaamte van uw zuster, de dochter van uw vader, of de dochter van uw moeder, in huis geboren of buiten geboren, haar schaamte zult u niet ontdekken.", "Job 2:12": "En toen zij hun ogen van verre opsloegen, herkenden zij hem niet, en zij verhieven hun stem en weenden; daarbij scheurden zij ieder hun mantel, en strooiden stof op hun hoofden, omhoog naar de hemel.", "Hand 5:29": "Maar Petrus en de apostelen antwoordden, en zeiden: Men moet God meer gehoorzaam zijn dan de mensen.", "Pred 7:9": "Wees niet haastig in uw geest om te toornen; want de toorn rust in de boezem van de dwazen.", "Jer 6:26": "O dochter van Mijn volk! Gord een zak aan, en wentel u in de as, bedrijf rouw als om een enige zoon, een zeer bitter misbaar; want de verstoorder zal ons snel overkomen.", "2 Sam 18:13": "Of had ik uit valsheid tegen mijn eigen leven gehandeld? Want geen ding blijft voor de koning verborgen; ook u zelf zou u er dan tegenover mij van afzijdig gehouden hebben.", "2 Sam 19:19": "En hij zei tegen de koning: Mijn heer, rekent u mij de schuld niet toe, en gedenkt u niet wat uw knecht verkeerd gedaan heeft, op de dag dat mijn heer de koning uit Jeruzalem wegging, dat de koning het zich ter harte zou nemen.", "Nahum 1:10": "Omdat zij als doornen ineengevlochten zijn, en dronken zijn zoals zij plegen dronken te zijn, zo worden zij helemaal verteerd, als een dorre stoppel.", "2 Kon 3:4": "Mesa nu, de koning van de Moabieten, was een veehandelaar, en bracht aan de koning van Israël honderdduizend lammeren, en honderdduizend rammen met de wol.", "Job 1:20": "Toen stond Job op, en scheurde zijn mantel, en schoor zijn hoofd, en viel op de aarde, en boog zich neer;", "Luk 14:23": "En de heer zei tegen de dienstknecht: Ga de wegen en heggen langs, en dwing hen binnen te komen, zodat mijn huis vol wordt.", "Gen 27:41": "En Ezau haatte Jakob om die zegen, waarmee zijn vader hem gezegend had; en Ezau zei in zijn hart: De dagen van rouw om mijn vader komen dichterbij, en ik zal mijn broer Jakob doden.", "Gen 19:3": "En hij hield sterk bij hen aan, zodat zij bij hem introkken, en in zijn huis kwamen; en hij maakte hun een maaltijd, en bakte ongezuurde koeken, en zij aten.", "Ps 7:15": "Zie, hij is zwanger van onrecht, en heeft moeite ontvangen, hij zal leugen baren.", "Gen 19:8": "Zie toch, ik heb twee dochters, die nog met geen man gemeenschap gehad hebben; ik zal ze nu naar buiten brengen, naar u toe, en doe met hen zoals het goed is in uw ogen; alleen, doe deze mannen niets; want daarom zijn zij onder de bescherming van mijn dak gekomen.", "Jer 31:15": "Zo zegt de HEERE: Er is een stem gehoord in Rama, een geklaag, een zeer bitter geween; Rachel weent over haar kinderen; zij weigert zich te laten troosten over haar kinderen, omdat zij er niet meer zijn.", "Gen 6:2": "dat Gods zonen de dochters der mensen aanzagen, dat zij mooi waren, en zij namen zich vrouwen uit allen die zij verkozen hadden.", "Lev 2:7": "En als uw offer een spijsoffer uit de pan is, zal het van meelbloem met olie gemaakt worden.", "Num 22:16": "Zij kwamen bij Bileam, en zeiden tegen hem: Zo zegt Balak, de zoon van Zippor: Laat u toch niet weerhouden om naar mij te komen!", "1 Kon 21:7": "Toen zei Izebel, zijn vrouw, tegen hem: Regeert u nu het koninkrijk over Israël? Sta op, eet brood, en laat uw hart vrolijk zijn; ik zal u de wijngaard van Naboth, de Jizreëliet, geven.", "2 Sam 13:1-14": "Het gebeurde daarna dat Absalom, Davids zoon, een mooie zuster had, wier naam Thamar was, en Amnon, Davids zoon, kreeg haar lief. En Amnon werd zo door haar in beslag genomen dat hij er ziek van werd, vanwege zijn zuster Thamar; want zij was een maagd, zodat het in Amnons ogen onmogelijk leek haar iets te doen. Maar Amnon had een vriend, wiens naam Jonadab was, een zoon van Simea, Davids broer; en Jonadab was een zeer sluwe man.", "Gen 19:32-35": "Kom, laten we onze vader wijn te drinken geven, en bij hem liggen, opdat wij van onze vader nakomelingen in leven houden. En zij gaven die nacht hun vader wijn te drinken; en de oudste kwam, en lag bij haar vader, en hij merkte het niet toen zij ging liggen, en ook niet toen zij opstond. En het gebeurde de volgende dag, dat de oudste tegen de jongste zei: Zie, ik heb gisternacht bij mijn vader gelegen; laten wij hem ook deze nacht wijn te drinken geven; ga dan naar binnen, lig bij hem, opdat wij van onze vader nakomelingen in leven houden.", "2 Sam 15:32": "En het gebeurde, toen David tot op de hoogte kwam, waar hij God aanbad, zie, toen ontmoette Husai, de Archiet, hem, met zijn kleed gescheurd, en aarde op zijn hoofd.", "Mark 6:24": "En zij ging naar buiten en zei tegen haar moeder: Wat zal ik vragen? En die zei: Het hoofd van Johannes de Doper.", "2 Sam 13:6-9": "Amnon legde zich toen neer, en deed alsof hij ziek was. Toen nu de koning kwam om hem te zien, zei Amnon tegen de koning: Laat toch mijn zuster Thamar komen, dat zij twee koekjes voor mijn ogen klaarmaakt, en ik ze uit haar hand eet. Toen zond David iemand naar Thamar in het huis, en zei: Ga toch naar het huis van uw broer Amnon, en maak voor hem voedsel klaar. En Thamar ging naar het huis van haar broer Amnon (hij lag namelijk neer), en zij nam deeg, en kneedde het, en maakte er voor zijn ogen koekjes van, en bakte de koekjes.", "Jer 4:22": "Zeker, Mijn volk is dwaas, Mij kennen zij niet; het zijn zotte kinderen, en zij hebben geen inzicht; wijs zijn zij om kwaad te doen, maar goed te doen weten zij niet.", "Spr 25:9": "Voer uw geschil met uw naaste; maar openbaar het geheim van een ander niet;", "Ef 4:26": "Word toornig, en zondig niet; laat de zon niet ondergaan over uw toorn;", "2 Sam 1:11": "Toen greep David zijn kleren en scheurde ze; evenzo ook al de mannen die met hem waren.", "2 Sam 12:10": "Nu dan, het zwaard zal niet van uw huis wijken tot in eeuwigheid, omdat u Mij veracht hebt, en de vrouw van Uria, de Hethiet, genomen hebt, zodat zij uw vrouw is geworden.", "Richt 11:35": "En het gebeurde, toen hij haar zag, dat hij zijn kleren scheurde, en zei: Ach, mijn dochter! U hebt mij helemaal terneergeslagen, en u bent onder degenen die mij in het ongeluk storten; want ik heb mijn mond opengedaan tegen de HEERE, en ik kan niet terug.", "2 Sam 11:15": "En hij schreef in die brief: Stel Uria vooraan tegenover de sterkste strijd, en trek u van achter hem terug, opdat hij geslagen wordt en sterft.", "Jes 37:1": "Het gebeurde nu, toen koning Hizkia dat hoorde, dat hij zijn kleren scheurde, en zich met een zak bedekte, en het huis van de HEERE inging.", "Amos 5:19": "Zoals wanneer iemand vlucht voor het aangezicht van een leeuw, en een beer hem ontmoet; of dat hij in een huis komt, en met zijn hand tegen de wand leunt, en een slang hem bijt.", "2 Sam 14:30": "Toen zei hij tegen zijn knechten: Kijk, het stuk akker van Joab ligt naast het mijne, en hij heeft daar gerst op staan; ga erheen, en steek het in brand. En de knechten van Absalom staken dat stuk akker in brand.", "1 Sam 25:36-38": "Toen Abigaïl nu bij Nabal kwam, zie, zo had hij een maaltijd in zijn huis, als een koningsmaaltijd; en het hart van Nabal was vrolijk in hem, en hij was zeer dronken; daarom vertelde zij hem niets, klein of groot, tot het morgenlicht. Het gebeurde nu 's morgens, toen de wijn van Nabal uitgewerkt was, dat zijn vrouw hem die woorden vertelde. Toen bestierf zijn hart in zijn binnenste, en hij werd als een steen. En het gebeurde ongeveer tien dagen later, dat de HEERE Nabal sloeg, zodat hij stierf.", "Gen 37:35": "En al zijn zonen en al zijn dochters maakten zich op om hem te troosten; maar hij weigerde zich te laten troosten en zei: Want ik zal, rouw bedrijvend, tot mijn zoon in het graf neerdalen. Zo beweende zijn vader hem.", "Jer 8:12": "Zijn zij beschaamd, omdat zij gruwel bedreven hebben? Nee, zij schamen zich in het geheel niet, en weten niet hoe ze schaamrood moeten worden; daarom zullen zij vallen onder de vallende; ten tijde van hun bezoeking zullen zij struikelen, zegt de HEERE.", "2 Sam 18:33": "Toen raakte de koning zeer ontroerd, en ging naar boven, naar de bovenzaal boven de poort, en huilde; en al gaande zei hij dit: Mijn zoon Absalom, mijn zoon, mijn zoon Absalom! Was ik maar, was ik maar in uw plaats gestorven, Absalom, mijn zoon, mijn zoon!", "Spr 5:22": "De goddeloze zullen zijn eigen ongerechtigheden vangen, en met de banden van zijn zonden zal hij vastgehouden worden.", "Richt 19:7-10": "Maar de man stond op, om weg te trekken. Toen drong zijn schoonvader er bij hem op aan, dat hij daar weer overnachtte. Toen hij op de vijfde dag 's morgens vroeg op was, om weg te trekken, zei de vader van de jonge vrouw: Sterk toch uw hart. En zij bleven, totdat de dag zich neigde; en zij beiden aten samen. Toen maakte de man zich op, om weg te trekken, hij, en zijn bijvrouw, en zijn knecht; en zijn schoonvader, de vader van de jonge vrouw, zei: Zie toch, de dag is afgenomen, het wordt avond, overnacht toch; zie, de dag loopt ten einde, overnacht hier, en laat uw hart vrolijk zijn, en maak u morgen vroeg op voor uw reis, en ga naar uw tent.", "Ezra 9:5": "En rond het avondoffer stond ik op uit mijn bedruktheid, nadat ik mijn kleed en mijn mantel gescheurd had; en ik boog mij op mijn knieën, en breidde mijn handen uit tot de HEERE, mijn God;", "1 Sam 28:10": "Saul nu zwoer haar bij de HEERE en zei: Zo waarachtig als de HEERE leeft, u zal geen straf om deze zaak overkomen!", "Ps 119:20": "Mijn ziel is verbroken vanwege het verlangen naar Uw oordelen te aller tijd.", "Gen 39:12": "En zij greep hem bij zijn kleed en zei: Lig bij mij! En hij liet zijn kleed in haar hand, en vluchtte, en ging naar buiten.", "Pred 9:7": "Ga dan heen, eet uw brood met vreugde, en drink uw wijn met een vrolijk hart; want God heeft al een behagen in uw werken.", "Spr 28:17": "Een mens, gedrukt door het bloed van iemand, zal naar de kuil toevluchten; men houde hem niet tegen!", "2 Sam 12:16": "En David zocht God voor dat jongetje; en David vastte een vasten, en ging naar binnen, en lag heel de nacht op de aarde.", "2 Sam 14:19": "En de koning zei: Is de hand van Joab hierin met u? En de vrouw antwoordde en zei: Zo waarachtig als uw ziel leeft, mijn heer koning, niemand zou naar rechts of naar links kunnen afwijken van alles wat mijn heer de koning gesproken heeft; want uw dienaar Joab, hij heeft het mij opgedragen, en hij heeft al deze woorden in de mond van uw dienares gelegd;", "Pred 10:19": "Men maakt maaltijden om te lachen, en de wijn verheugt de levenden, en het geld verschaft alles.", "1 Kon 1:19": "En hij heeft ossen en gemest vee en schapen in overvloed geslacht, en alle zonen van de koning genodigd, en Abjathar, de priester, en Joab, de legeraanvoerder, maar uw knecht Salomo heeft hij niet genodigd.", "Ps 104:15": "En de wijn, die het hart van de mens verheugt, zodat het gezicht blinkt van olie; en het brood, dat het hart van de mens sterkt.", "2 Sam 12:11": "Zo zegt de HEERE: Zie, Ik zal kwaad over u verwekken uit uw eigen huis, en Ik zal uw vrouwen nemen voor uw ogen, en zal ze aan uw naaste geven; die zal bij uw vrouwen liggen, voor de ogen van deze zon.", "Spr 27:4-6": "Grimmigheid en overloping van toorn is wreedheid; maar wie zal voor jaloezie standhouden? Openbare bestraffing is beter dan verborgen liefde. De wonden van hem die liefheeft, zijn trouw; maar de kussen van hem die haat, zijn te verafschuwen.", "Gen 24:67": "En Izak bracht haar in de tent van zijn moeder Sara; en hij nam Rebekka, en zij werd hem tot vrouw, en hij had haar lief. Zo werd Izak getroost na de dood van zijn moeder.", "Ps 55:22": "Zijn mond is gladder dan boter, maar zijn hart is oorlog; zijn woorden zijn zachter dan olie, maar ze zijn blote zwaarden.", "1 Sam 25:36": "Toen Abigaïl nu bij Nabal kwam, zie, zo had hij een maaltijd in zijn huis, als een koningsmaaltijd; en het hart van Nabal was vrolijk in hem, en hij was zeer dronken; daarom vertelde zij hem niets, klein of groot, tot het morgenlicht.", "2 Sam 12:5": "Toen ontstak Davids woede erg tegen die man, en hij zei tegen Nathan: Zo waar de HEERE leeft, de man die dat gedaan heeft, is een kind des doods!", "Gen 38:12": "Toen er veel dagen verstreken waren, stierf de dochter van Sua, de vrouw van Juda; daarna vond Juda troost, en hij ging naar zijn schaapscheerders in Timna, hij en Hira, zijn vriend, de Adullamiet.", "Deut 22:29": "Dan zal de man die bij haar gelegen heeft, aan de vader van de jonge dochter vijftig zilverlingen geven, en zij zal hem tot vrouw zijn, omdat hij haar vernederd heeft; hij zal haar al zijn dagen niet mogen wegsturen.", "Gen 19:2": "En hij zei: Zie toch, mijn heren! Keert u toch af naar het huis van uw knecht, en overnacht daar, en wast uw voeten; dan kunt u vroeg opstaan en verder gaan op uw weg. En zij zeiden: Nee, maar wij zullen op straat overnachten.", "2 Kon 22:11": "Het gebeurde nu, toen de koning de woorden van het wetboek hoorde, dat hij zijn kleren scheurde.", "Richt 5:30": "Zouden zij dan de buit niet vinden en delen? Een liefje, of twee liefjes, voor ieder man? Voor Sisera een buit van verscheidene verven, een buit van verscheidene verven, gestikt; van verscheiden verf aan beide zijden gestikt, voor de buithalzen?", "Gen 45:1": "Toen kon Jozef zich niet bedwingen voor allen die bij hem stonden, en hij riep: Laat iedereen bij mij weggaan! En er stond niemand bij hem, toen Jozef zich aan zijn broers bekend maakte.", "Num 22:17": "Want ik zal u zeer hoog eren, en al wat u tegen mij zult zeggen, dat zal ik doen; kom toch, vervloek voor mij dit volk!", "Mark 6:25": "En zij ging meteen haastig naar de koning, en vroeg het, en zei: Ik wil dat u mij nu meteen op een schotel het hoofd van Johannes de Doper geeft.", "1 Kon 1:25": "Want hij is vandaag afgegaan en heeft ossen geslacht, en gemest vee, en schapen in overvloed, en heeft alle zonen van de koning genodigd, en de aanvoerders van het leger, en Abjathar, de priester; en zie, zij eten en drinken voor zijn aangezicht, en zeggen: Leve de koning Adonia!", "Richt 19:9": "Toen maakte de man zich op, om weg te trekken, hij, en zijn bijvrouw, en zijn knecht; en zijn schoonvader, de vader van de jonge vrouw, zei: Zie toch, de dag is afgenomen, het wordt avond, overnacht toch; zie, de dag loopt ten einde, overnacht hier, en laat uw hart vrolijk zijn, en maak u morgen vroeg op voor uw reis, en ga naar uw tent.", "1 Sam 22:19": "Hij sloeg ook Nob, de stad van deze priesters, met de scherpte van het zwaard, zowel de mannen als de vrouwen, zowel de kinderen als de zuigelingen, zelfs de ossen en ezels en de schapen sloeg hij met de scherpte van het zwaard.", "Gen 37:3": "En Israël had Jozef lief, boven al zijn zonen; want hij was hem een zoon van het ouderdom; en hij maakte hem een veelkleurige rok.", "1 Kon 20:16": "En zij trokken uit op de middag. Benhadad nu dronk zich dronken in de tenten, hij en de koningen, de twee en dertig koningen, die hem hielpen.", "Est 1:10": "Op de zevende dag, toen het hart van de koning vrolijk was van de wijn, zei hij tegen Mehuman, Biztha, Charbona, Bigtha en Abagtha, Zethar en Charchas, de zeven kamerlingen die dienden voor het aangezicht van de koning Ahasveros,", "Job 42:6": "Daarom verfoei ik mij, en ik heb berouw in stof en as.", "2 Sam 3:32": "Toen zij Abner te Hebron begroeven, verhief de koning zijn stem, en huilde bij Abners graf; ook al het volk huilde.", "Matt 13:33": "Een andere gelijkenis sprak Hij tot hen: Het Koninkrijk der hemelen is gelijk aan zuurdesem, die een vrouw nam en verborg in drie maten van het meel, totdat het geheel gezuurd was.", "1 Kon 11:1": "En koning Salomo had, behalve de dochter van Farao, veel vreemde vrouwen lief: Moabitische, Ammonitische, Edomitische, Sidonische en Hethitische vrouwen;", "Jes 3:9": "Het gelaat van hun aangezicht getuigt tegen hen, en hun zonden spreken zij vrij uit, net als Sodom; zij verbergen ze niet. Wee hun ziel; want zij doen zichzelf kwaad.", "Matt 18:15": "Maar als uw broeder tegen u gezondigd heeft, ga naar hem toe en wijs hem terecht tussen u en hem alleen; als hij naar u luistert, hebt u uw broeder gewonnen.", "Ps 101:8": "Elke morgen zal ik alle goddelozen van het land verdelgen, om uit de stad van de HEERE alle werkers van de ongerechtigheid uit te roeien.", "Est 7:8": "Toen de koning terugkwam uit de tuin van het paleis in het huis van het maaltijd van de wijn, was Haman gevallen op het bed waarop Esther was. Toen zei de koning: Zou hij ook wel de koningin verkrachten bij mij in het huis? Het woord ging uit van de mond van de koning, en zij bedekten Hamans aangezicht.", "2 Sam 12:18-23": "En het gebeurde op de zevende dag, dat het kind stierf; en Davids knechten waren bang het hem te vertellen, dat het kind dood was, want zij zeiden: Zie, toen het kind nog leefde, spraken wij tegen hem, maar hij luisterde niet naar onze stem; hoe zullen wij dan tegen hem zeggen: Het kind is dood? Hij zou zichzelf iets kunnen aandoen. Maar David zag dat zijn knechten fluisterden; zo begreep David dat het kind dood was. Toen zei David tegen zijn knechten: Is het kind dood? En zij zeiden: Het is dood. Toen stond David op van de aarde, en waste zich, en zalfde zich, en trok andere kleren aan, en ging naar het huis van de HEERE, en aanbad Hem; daarna kwam hij in zijn eigen huis, en vroeg om brood; en zij zetten hem brood voor, en hij at.", "2 Sam 14:33": "Toen ging Joab naar de koning, en vertelde het hem. Toen riep hij Absalom, en hij kwam bij de koning, en boog zich voor hem op zijn gezicht ter aarde, voor het aangezicht van de koning; en de koning kuste Absalom.", "1 Kron 3:2": "de derde Absalom, de zoon van Maächa, de dochter van Thalmai, de koning van Gesur; de vierde Adonia, de zoon van Haggith;", "Richt 20:5": "En de burgers van Gibea maakten zich tegen mij op, en omringden het huis in de nacht om mij heen; zij waren van plan mij te doden, en mijn bijvrouw hebben zij verkracht, zodat zij gestorven is.", "Spr 24:11": "Red hen die ter dood gegrepen zijn; want zij wankelen ter doding, als u zich onthoudt.", "Richt 19:22": "Toen zij nu hun hart vrolijk maakten, zie, omringden de mannen van die stad (mannen, die kinderen van Belial waren) het huis, en klopten op de deur; en zij spraken tegen de oude man, de heer van het huis, en zeiden: Breng de man die in uw huis gekomen is naar buiten, zodat wij hem bekennen.", "1 Sam 25:2": "En er was een man te Maon, en zijn bedrijf was te Karmel; en die man was zeer groot, en hij had drieduizend schapen, en duizend geiten; en hij was bezig met het scheren van zijn schapen te Karmel.", "1 Sam 22:18": "Toen zei de koning tegen Doeg: Wend u om, en val de priesters aan. Toen wendde Doeg, de Edomiet, zich om, en hij viel de priesters aan, en doodde op die dag vijfentachtig mannen die de linnen priesterrok droegen.", "Gen 31:24": "Doch God kwam tot Laban, de Syriër, in een droom 's nachts, en Hij zei tegen hem: Pas op, dat u met Jakob niet spreekt, noch goed, noch kwaad.", "Spr 7:7": "En ik zag onder de eenvoudigen; ik merkte onder de jonge mannen een verstandeloze jongeling;", "1 Joh 3:15": "Ieder die zijn broeder haat, is een moordenaar; en u weet dat geen moordenaar het eeuwige leven in zich heeft blijven.", "1 Sam 28:13": "En de koning zei tegen haar: Wees niet bang; maar wat ziet u? Toen zei de vrouw tegen Saul: Ik zie goden, opkomend uit de aarde.", "2 Sam 13:1-32": "Het gebeurde daarna dat Absalom, Davids zoon, een mooie zuster had, wier naam Thamar was, en Amnon, Davids zoon, kreeg haar lief. En Amnon werd zo door haar in beslag genomen dat hij er ziek van werd, vanwege zijn zuster Thamar; want zij was een maagd, zodat het in Amnons ogen onmogelijk leek haar iets te doen. Maar Amnon had een vriend, wiens naam Jonadab was, een zoon van Simea, Davids broer; en Jonadab was een zeer sluwe man.", "Gen 9:21": "En hij dronk van die wijn, en werd dronken; en hij ontblootte zich midden in zijn tent.", "Est 6:13": "En Haman vertelde aan zijn vrouw Zeres en al zijn vrienden alles wat hem overkomen was. Toen zeiden zijn wijzen, en Zeres, zijn vrouw, tegen hem: Als Mordechai, voor wie u begonnen bent te vallen, uit het nageslacht van de Joden is, zult u tegen hem niets kunnen uitrichten; maar u zult zeker voor zijn aangezicht vallen.", "1 Kon 1:33": "En de koning zei tegen hen: Neem de knechten van uw heer met u mee, en laat mijn zoon Salomo rijden op de muilezelin die van mij is; en breng hem naar Gihon.", "Gen 29:18": "En Jakob had Rachel lief; en hij zei: Ik zal u zeven jaar dienen, voor Rachel, uw jongste dochter.", "Richt 19:24": "Zie, mijn dochter die maagd is, en zijn bijvrouw, die zal ik nu naar buiten brengen, opdat u hen schendt, en met hen doet wat goed is in uw ogen; maar doe aan deze man zo'n dwaze zaak niet.", "Gen 3:1": "De slang was listiger dan al het gedierte van het veld, dat de HEERE God gemaakt had; en zij zei tegen de vrouw: Is het echt zo dat God gezegd heeft: U zult niet eten van alle bomen in de hof?", "Neh 4:9": "Maar wij baden tot onze God, en zetten wacht tegen hen, dag en nacht, vanwege hen.", "Ps 50:18": "Als u een dief ziet, dan loopt u met hem mee; en uw deel is met de overspelers.", "2 Sam 18:25": "Toen riep de wachter, en meldde het de koning; en de koning zei: Als hij alleen is, dan is er een bericht in zijn mond; en hij liep maar door en kwam dichterbij.", "1 Kon 1:9": "En Adonia slachtte schapen en runderen en gemest vee bij de steen Zoheleth, die bij de bron Rogel is; en nodigde al zijn broers, de zonen van de koning, en alle mannen van Juda, de knechten van de koning.", "2 Sam 3:27": "Toen Abner naar Hebron terugkwam, nam Joab hem apart in het midden van de poort om in stilte met hem te spreken; en hij sloeg hem daar onder de vijfde rib, zodat hij stierf, vanwege het bloed van zijn broer Asaël.", "2 Sam 3:29": "Het moet blijven op het hoofd van Joab, en op heel het huis van zijn vader; en het mag van het huis van Joab niet ontbreken dat er iemand is die een vloed heeft, of melaats is, of zich aan de kruk moet vasthouden, of door het zwaard valt, of gebrek aan brood heeft!", "Lev 18:11": "De schaamte van de dochter van de vrouw van uw vader, die uw vader geboren is (zij is uw zuster), haar schaamte zult u niet ontdekken.", "Jer 7:18": "De kinderen rapen hout, en de vaders steken het vuur aan, en de vrouwen kneden het deeg, om koeken te maken voor de koningin van de hemel, en drankoffers te offeren aan andere goden, om Mij verdriet aan te doen.", "Ps 12:3": "Zij spreken valsheid, ieder met zijn naaste, met vleiende lippen; zij spreken met een dubbel hart.", "2 Sam 12:21": "Zo zeiden zijn knechten tegen hem: Wat is dit voor iets dat u gedaan hebt? Om het levende kind hebt u gevast en gehuild; maar nadat het kind gestorven is, bent u opgestaan en hebt u brood gegeten.", "2 Sam 18:24": "David nu zat tussen de twee poorten; en de wachter ging op het dak van de poort bij de muur staan, en hief zijn ogen op, en zag, en zie, er liep een man alleen.", "Gen 34:3": "En zijn ziel hechtte zich aan Dina, Jakobs dochter; en hij had de jonge vrouw lief, en sprak naar het hart van de jonge vrouw.", "Micha 7:3": "Om met beide handen goed hun best te doen om kwaad te doen, zo eist de vorst, en de rechter oordeelt om vergelding; en de grote spreekt de verderving van zijn ziel uit, en zij draaien het samen dicht ineen.", "Jer 41:6": "En Ismaël, de zoon van Nethanja, ging uit Mizpa hun tegemoet, al gaande en huilend; en het gebeurde, toen hij hen aantrof, dat hij zei: Kom naar Gedalia, de zoon van Ahikam!", "Neh 7:3": "En ik zei tegen hen: Laat de poorten van Jeruzalem niet geopend worden, totdat de zon heet wordt, en terwijl zij daarbij staan, laat hen de deuren sluiten, grendel ze dan; en dat men wachten zette, inwoners van Jeruzalem, ieder op zijn wachtpost, en ieder tegenover zijn huis.", "2 Kon 11:14": "En zij zag toe, en zie, de koning stond bij de pilaar, naar de gewoonte, en de leiders en de trompetten bij de koning; en al het volk van het land was blij en blies op trompetten. Toen scheurde Athalia haar kleren en riep: Verraad, verraad!", "2 Sam 1:17": "David nu klaagde deze klaagzang over Saul en over Jonathan, zijn zoon;", "Ps 45:15": "In gestikte kleren zal zij tot de Koning geleid worden; de jonge dochters, die achter haar zijn, haar gezellinnen, zullen tot u gebracht worden.", "2 Sam 13:3-5": "Maar Amnon had een vriend, wiens naam Jonadab was, een zoon van Simea, Davids broer; en Jonadab was een zeer sluwe man. Die zei tegen hem: Waarom bent u, dag na dag, zo mager, u koningszoon, zult u het mij niet vertellen? Toen zei Amnon tegen hem: Ik heb Thamar, de zuster van mijn broer Absalom, lief. En Jonadab zei tegen hem: Ga liggen op uw bed, en doe alsof u ziek bent; als dan uw vader komt om u te zien, zeg dan tegen hem: Laat toch mijn zuster Thamar komen, dat zij mij brood laat eten, en het voedsel voor mijn ogen klaarmaakt, zodat ik het zie, en het uit haar hand eet.", "Hos 7:4": "Zij plegen allemaal samen overspel, zij zijn als een bakoven, die heet gemaakt is door de bakker; die ophoudt met opstoken nadat hij het deeg heeft gekneed, totdat het doorgezuurd is.", "2 Sam 13:32-35": "Maar Jonadab, de zoon van Simea, Davids broer, antwoordde en zei: Mijn heer moet niet denken dat zij alle jongemannen, de zonen van de koning, gedood hebben; maar Amnon alleen is dood; want Absalom had dit van tevoren zo besloten, vanaf de dag dat hij zijn zuster Thamar verkracht heeft. Zo moet mijn heer de koning nu de zaak niet ter harte nemen, door te denken dat alle zonen van de koning dood zijn; want Amnon alleen is dood. Absalom nu vluchtte; en de knecht die de wacht hield, hief zijn ogen op, en keek toe, en zie, er kwam veel volk van de weg achter hem, aan de kant van het gebergte.", "2 Sam 3:28": "Toen David dat later hoorde, zei hij: Ik ben onschuldig, en mijn koninkrijk is dat, bij de HEERE, tot in eeuwigheid, aan het bloed van Abner, de zoon van Ner.", "2 Sam 16:21-23": "En Achitofel zei tegen Absalom: Ga naar de bijvrouwen van uw vader, die hij heeft achtergelaten om het huis te bewaren; zo zal heel Israël horen dat u zich bij uw vader gehaat gemaakt hebt, en de handen van allen die bij u zijn, zullen gesterkt worden. Zo spanden zij voor Absalom een tent op op het dak; en Absalom ging naar de bijvrouwen van zijn vader, voor de ogen van heel Israël. In die dagen was de raad die Achitofel gaf, als had men naar het woord van God gevraagd; zo was alle raad van Achitofel, zowel bij David als bij Absalom.", "Lev 19:18": "U zult niet wreken, noch toorn koesteren tegen de kinderen van uw volk; maar u zult uw naaste liefhebben als uzelf; Ik ben de HEERE!"}, "noten": {}, "koppeling": {"1": "Het gebeurde <span class=\"wl\" data-l=\"L2\" data-code=\"H310\">daarna</span> <span
