judas/1/"},{"naam":"Openbaring","href":"../../openbaring/1/"}],"slugmap":{"Gen":"genesis","Ex":"exodus","Lev":"leviticus","Num":"numeri","Deut":"deuteronomium","Joz":"jozua","Richt":"richteren","Ruth":"ruth","1 Sam":"1-samuel","2 Sam":"2-samuel","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"En de toorn van de HEERE ging verder tegen Israël ontsteken; en Hij porde David tegen hen aan en zei: Ga, tel Israël en Juda.","2":"De koning zei toen tegen Joab, de legeraanvoerder die bij hem was: Trek nu rond door alle stammen van Israël, van Dan tot Ber-seba toe, en tel het volk, zodat ik het getal van het volk weet.","3":"Toen zei Joab tegen de koning: Laat de HEERE, uw God, aan dit volk, hoeveel het er ook mogen zijn, honderdmaal meer toevoegen, zodat de ogen van mijn heer de koning het mogen aanzien; maar waarom heeft mijn heer de koning zin in deze zaak?","4":"Doch het woord van de koning kreeg de overhand tegen Joab, en tegen de aanvoerders van het leger. Zo trok Joab uit, met de aanvoerders van het leger, van voor de koning, om het volk Israël te tellen.","5":"En zij gingen over de Jordaan, en legerden zich bij Aroer, aan de rechterkant van de stad die in het midden ligt van de beek van Gad, en bij Jaezer.","6":"Vervolgens kwamen zij in Gilead, en in het lage land Hodsi; ook kwamen zij bij Dan-jaän, en rondom bij Sidon.","7":"En zij kwamen bij de vesting van Tyrus, en alle steden van de Hevieten en de Kanaänieten; en zij kwamen uit bij het zuiden van Juda, te Ber-seba.","8":"Zo trokken zij rond door het hele land; en na negen maanden en twintig dagen kwamen zij in Jeruzalem.","9":"En Joab gaf de som van het getelde volk aan de koning; en in Israël waren achthonderdduizend strijdbare mannen die het zwaard trokken, en de mannen van Juda waren vijfhonderdduizend man.","10":"En het hart van David sloeg hem, nadat hij het volk geteld had; en David zei tegen de HEERE: Ik heb zwaar gezondigd in wat ik gedaan heb; maar neem nu toch, o HEERE, de misdaad van uw knecht weg, want ik heb heel dwaas gedaan.","11":"Toen David 's morgens opstond, kwam het woord van de HEERE tot de profeet Gad, Davids ziener, en zei:","12":"Ga heen, en spreek tot David: Zo zegt de HEERE: Drie dingen leg Ik u voor; kies u er een van uit, opdat Ik dat u doe.","13":"Zo kwam Gad bij David, en maakte het hem bekend, en zei tegen hem: Zal er een hongersnood van zeven jaar in uw land tot u komen? Of wilt u drie maanden vluchten voor uw vijanden, terwijl zij u achtervolgen? Of dat er drie dagen pestilentie in uw land is? Merk nu op, en zie toe, wat antwoord ik terug moet brengen aan Hem die mij gezonden heeft.","14":"Toen zei David tegen Gad: Het is mij zeer bang te moede; laat ons toch in de hand van de HEERE vallen, want Zijn barmhartigheden zijn groot, maar laat mij niet in de hand van mensen vallen.","15":"Toen gaf de HEERE een pestilentie in Israël, van de morgen af tot de vastgestelde tijd toe; en er stierven van het volk, van Dan tot Ber-seba toe, zeventigduizend man.","16":"Toen nu de engel zijn hand uitstrekte over Jeruzalem om haar te verderven, kreeg de HEERE berouw over dat kwaad, en Hij zei tegen de engel die het verderf onder het volk aanrichtte: Het is genoeg, trek uw hand nu terug. De engel van de HEERE was nu bij de dorsvloer van Arauna, de Jebusiet.","17":"En David, toen hij de engel zag die het volk sloeg, sprak tot de HEERE, en zei: Zie, ik, ik heb gezondigd, en ik, ik heb onrecht gehandeld, maar wat hebben deze schapen gedaan? Laat toch Uw hand tegen mij zijn en tegen het huis van mijn vader.","18":"En Gad kwam diezelfde dag bij David, en zei tegen hem: Ga op, richt de HEERE een altaar op, op de dorsvloer van Arauna, de Jebusiet.","19":"Zo ging David op naar het woord van Gad, zoals de HEERE geboden had.","20":"En Arauna keek toe, en zag de koning en zijn knechten naar zich toe komen; zo ging Arauna naar buiten, en boog zich voor de koning met zijn gezicht ter aarde.","21":"En Arauna zei: Waarom komt mijn heer de koning naar zijn knecht? En David zei: Om deze dorsvloer van u te kopen, om de HEERE een altaar te bouwen, opdat deze plaag wordt opgehouden van over het volk.","22":"Toen zei Arauna tegen David: Laat mijn heer de koning nemen en offeren wat goed is in zijn ogen; zie, daar zijn de runderen voor het brandoffer, en de sleden en het rundertuig als hout.","23":"Dit alles gaf Arauna, als een koning, aan de koning. Verder zei Arauna tegen de koning: Moge de HEERE uw God een welgevallen in u hebben!","24":"Doch de koning zei tegen Arauna: Nee, maar ik zal het zeker van u kopen voor de prijs; want ik zal de HEERE, mijn God, geen brandoffers offeren die mij niets kosten. Zo kocht David de dorsvloer en de runderen voor vijftig zilveren sikkels.","25":"En David bouwde daar de HEERE een altaar, en offerde brandoffers en dankoffers. Zo werd de HEERE verbeden voor het land, en deze plaag werd van over Israël opgehouden."},"SV":{"1":"En de toorn des HEEREN voer voort te ontsteken tegen Israël; en Hij porde David aan tegen henlieden, zeggende: Ga, tel Israël en Juda.","2":"De koning dan zeide tot Joab, den krijgsoverste, die bij hem was: Trek nu om, door alle stammen van Israël, van Dan tot Ber-seba toe, en tel het volk, opdat ik het getal des volks wete.","3":"Toen zeide Joab tot den koning: Nu doe de HEERE, uw God, tot dit volk, zoals deze en die nu zijn, honderdmaal meer, dat de ogen van mijn heer den koning het aanzien; maar waarom heeft mijn heer de koning lust tot deze zaak?","4":"Doch des konings woord nam de overhand tegen Joab, en tegen de oversten des heirs. Alzo toog Joab uit, met de oversten des heirs, van des konings aangezicht, om het volk Israël te tellen.","5":"En zij gingen over de Jordaan, en legerden zich bij Aroer, ter rechterhand der stad, die in het midden is van de beek van Gad, en aan Jaezer.","6":"Voorts kwamen zij in Gilead, en in het lage land Hodsi; ook kwamen zij tot Dan-jaan, en rondom bij Sidon.","7":"En zij kwamen tot de vesting van Tyrus, en alle steden der Hevieten en der Kanaänieten; en zij kwamen uit aan het zuiden van Juda te Ber-seba.","8":"Alzo togen zij om door het ganse land; en ten einde van negen maanden en twintig dagen kwamen zij te Jeruzalem.","9":"En Joab gaf de som van het getelde volk aan den koning; en in Israël waren achthonderd duizend strijdbare mannen, die het zwaard uittrokken, en de mannen van Juda waren vijfhonderd duizend man.","10":"En Davids hart sloeg hem, nadat hij het volk geteld had; en David zeide tot den HEERE: Ik heb zeer gezondigd *in* hetgeen ik gedaan heb; maar nu, o HEERE, neem toch de misdaad Uws knechts weg, want ik heb zeer zottelijk gedaan.","11":"Als nu David des morgens opstond, zo geschiedde het woord des HEEREN tot den profeet Gad, Davids ziener, zeggende:","12":"Ga heen, en spreek tot David: Alzo zegt de HEERE: Drie dingen draag Ik u voor; verkies u een uit die, dat Ik u doe.","13":"Zo kwam Gad tot David, en maakte het hem bekend, en zeide tot hem: Zal u een honger van zeven jaren in uw land komen? Of *wilt* gij drie maanden vlieden voor het aangezicht uwer vijanden, dat die u vervolgen? Of dat er drie dagen pestilentie in uw land zij? Merk nu, en zie toe, wat antwoord ik Dien zal wederbrengen, Die mij gezonden heeft.","14":"Toen zeide David tot Gad: Mij is zeer bange; laat ons toch in de hand des HEEREN vallen, want Zijn barmhartigheden zijn vele, maar laat mij in de hand van mensen niet vallen.","15":"Toen gaf de HEERE een pestilentie in Israël, van den morgen af tot den gezetten tijd toe; en er stierven van het volk, van Dan tot Ber-seba toe, zeventig duizend mannen.","16":"Toen nu de engel zijn hand uitstrekte over Jeruzalem, om haar te verderven, berouwde het den HEERE over dat kwaad, en Hij zeide tot den engel, die het verderf onder het volk maakte: Het is genoeg, trek uw hand nu af. De engel des HEEREN nu was bij den dorsvloer van Arauna, den Jebusiet.","17":"En David, als hij den engel zag, die het volk sloeg, sprak tot den HEERE, en zeide: Zie ik, ik heb gezondigd, en ik, ik heb onrecht gehandeld, maar wat hebben deze schapen gedaan? Uw hand zij toch tegen mij en tegen mijns vaders huis.","18":"En Gad kwam tot David op dienzelfden dag, en zeide tot hem: Ga op, richt den HEERE een altaar op, op den dorsvloer van Arauna, den Jebusiet.","19":"Alzo ging David op naar het woord van Gad, gelijk als de HEERE geboden had.","20":"En Arauna zag toe, en zag den koning en zijn knechten tot zich overkomen; zo ging Arauna uit, en boog zich voor den koning met zijn aangezicht ter aarde.","21":"En Arauna zeide: Waarom komt mijn heer de koning tot zijn knecht? En David zeide: Om dezen dorsvloer van u te kopen, om den HEERE een altaar te bouwen, opdat deze plage opgehouden worde van over het volk.","22":"Toen zeide Arauna tot David: Mijn heer de koning neme en offere, wat goed is in zijn ogen; zie, daar de runderen ten brandoffer, en de sleden en het rundertuig tot hout.","23":"Dit alles gaf Arauna, de koning, aan den koning. Voorts zeide Arauna tot den koning: De HEERE uw God neme een welgevallen in u!","24":"Doch de koning zeide tot Arauna: Neen, maar ik zal het zekerlijk van u kopen voor den prijs; want ik zal den HEERE, mijn God, niet offeren brandofferen om niet. Alzo kocht David den dorsvloer en de runderen voor vijftig zilveren sikkelen.","25":"En David bouwde aldaar den HEERE een altaar, en offerde brandofferen en dankofferen. Alzo werd de HEERE den lande verbeden, en deze plage van over Israël opgehouden."},"KJV":{"1":"And again the anger of the LORD was kindled against Israel, and he moved David against them to say, Go, number Israel and Judah.","2":"For the king said to Joab the captain of the host, which was with him, Go now through all the tribes of Israel, from Dan even to Beersheba, and number ye the people, that I may know the number of the people.","3":"And Joab said unto the king, Now the LORD thy God add unto the people, how many soever they be, an hundredfold, and that the eyes of my lord the king may see it: but why doth my lord the king delight in this thing?","4":"Notwithstanding the king's word prevailed against Joab, and against the captains of the host. And Joab and the captains of the host went out from the presence of the king, to number the people of Israel.","5":"And they passed over Jordan, and pitched in Aroer, on the right side of the city that lieth in the midst of the river of Gad, and toward Jazer:","6":"Then they came to Gilead, and to the land of Tahtimhodshi; and they came to Danjaan, and about to Zidon,","7":"And came to the strong hold of Tyre, and to all the cities of the Hivites, and of the Canaanites: and they went out to the south of Judah, even to Beersheba.","8":"So when they had gone through all the land, they came to Jerusalem at the end of nine months and twenty days.","9":"And Joab gave up the sum of the number of the people unto the king: and there were in Israel eight hundred thousand valiant men that drew the sword; and the men of Judah were five hundred thousand men.","10":"And David's heart smote him after that he had numbered the people. And David said unto the LORD, I have sinned greatly in that I have done: and now, I beseech thee, O LORD, take away the iniquity of thy servant; for I have done very foolishly.","11":"For when David was up in the morning, the word of the LORD came unto the prophet Gad, David's seer, saying,","12":"Go and say unto David, Thus saith the LORD, I offer thee three things; choose thee one of them, that I may do it unto thee.","13":"So Gad came to David, and told him, and said unto him, Shall seven years of famine come unto thee in thy land? or wilt thou flee three months before thine enemies, while they pursue thee? or that there be three days' pestilence in thy land? now advise, and see what answer I shall return to him that sent me.","14":"And David said unto Gad, I am in a great strait: let us fall now into the hand of the LORD; for his mercies are great: and let me not fall into the hand of man.","15":"So the LORD sent a pestilence upon Israel from the morning even to the time appointed: and there died of the people from Dan even to Beersheba seventy thousand men.","16":"And when the angel stretched out his hand upon Jerusalem to destroy it, the LORD repented him of the evil, and said to the angel that destroyed the people, It is enough: stay now thine hand. And the angel of the LORD was by the threshingplace of Araunah the Jebusite.","17":"And David spake unto the LORD when he saw the angel that smote the people, and said, Lo, I have sinned, and I have done wickedly: but these sheep, what have they done? let thine hand, I pray thee, be against me, and against my father's house.","18":"And Gad came that day to David, and said unto him, Go up, rear an altar unto the LORD in the threshingfloor of Araunah the Jebusite.","19":"And David, according to the saying of Gad, went up as the LORD commanded.","20":"And Araunah looked, and saw the king and his servants coming on toward him: and Araunah went out, and bowed himself before the king on his face upon the ground.","21":"And Araunah said, Wherefore is my lord the king come to his servant? And David said, To buy the threshingfloor of thee, to build an altar unto the LORD, that the plague may be stayed from the people.","22":"And Araunah said unto David, Let my lord the king take and offer up what seemeth good unto him: behold, here be oxen for burnt sacrifice, and threshing instruments and other instruments of the oxen for wood.","23":"All these things did Araunah, as a king, give unto the king. And Araunah said unto the king, The LORD thy God accept thee.","24":"And the king said unto Araunah, Nay; but I will surely buy it of thee at a price: neither will I offer burnt offerings unto the LORD my God of that which doth cost me nothing. So David bought the threshingfloor and the oxen for fifty shekels of silver.","25":"And David built there an altar unto the LORD, and offered burnt offerings and peace offerings. So the LORD was intreated for the land, and the plague was stayed from Israel."}},"tsk":{"1":[{"kopje":"verder","refs":["2 Sam 21:1-14"]},{"kopje":"Hij","refs":["1 Kron 21:1","Jak 1:13","Jak 1:14"]},{"kopje":"porde","refs":["2 Sam 12:11","2 Sam 16:10","Gen 45:5","Gen 50:20","Ex 7:3","1 Sam 26:19","1 Kon 22:20-23","Ezech 14:9","Ezech 20:25","Hand 4:28","2 Tess 2:11"]},{"kopje":"tel","refs":["1 Kron 27:23","1 Kron 27:24"]}],"2":[{"kopje":"Joab","refs":["2 Sam 2:13","2 Sam 8:16","2 Sam 20:23","2 Sam 23:37"]},{"kopje":"Trek nu rond","refs":["1 Kron 21:2"]},{"kopje":"van Dan","refs":["2 Sam 3:10","2 Sam 17:11","Richt 20:1"]},{"kopje":"zodat ik","refs":["Deut 8:13","Deut 8:14","2 Kron 32:25","2 Kron 32:26","2 Kron 32:31","Spr 29:23","Jer 17:5","2 Kor 12:7"]}],"4":[{"kopje":"de koning","refs":["1 Kron 21:4","Pred 8:4"]},{"kopje":"trok Joab uit","refs":["Ex 1:17","Hand 5:29"]}],"5":[{"kopje":"Aroer","refs":["Deut 2:36","Joz 13:9","Joz 13:16","1 Sam 30:28","Jes 17:2"]},{"kopje":"Jaezer","refs":["Num 32:1","Num 32:3","Num 32:35","Jes 16:8","J ue thee: Understand withal, & overtaking thee, dealing cruelly with thee. See 1 Chron.21.12.] or that there be three days pestilence in thy land? Now consider and look to (it) what answer I shall carry back to him, that sent me?"}],"14":[{"catchword":null,"tekst":"Then said David unto Gad: I am in a great straint, let us fall I pray into the hands of the LORD, [So that he himself may chastise us without the intervening of men] for his mercies are many, [or great] but let me not fall into the hand of men. [Heb. of a man, to wit, of mine enemies, with whom I have found no mercy at all.]"}],"15":[{"catchword":null,"tekst":"Then the LORD gave a pestilence in Israel, from the morning unto the time appointed: [Which God had specified by the Prophet Gad, to wit, for three days together. Some understand by the appointed time, the time of the Evening-offering of the first day: so that the time of David&acirc;&euro;&trade;s repentance and prayers (whereof mention is made in the sequel) was shortened by God] and there died of the people, from Dan to Berseba, [That is, thorough out the whole land; as v.2.] seventy thousand men."}],"16":[{"catchword":null,"tekst":"Now when the Angel [Whom God had sent forth for that intent, 1 Chron.21.15.] stretched out his hand upon Jerusalem to destroyed it, [viz. by the pestilence] it repented the LORD [see Gen.6.on v.6.] of that evil, and he said unto the Angel that made the destruction among the people, it is enough, withdraw now thine hand: now the Angel of the LORD was by the threshing floor of Arauna [called below v.18. Arauja, and 1 Chron.21.22. Ornan] the Jebusite. [but converted to the true religion. Jerusalem was formerly called Jebus, and inhabited by the heathenish Jebusites. See Judg.19.10, 12. and 1.21. and above chap.5.6.]"}],"17":[{"catchword":null,"tekst":"And David when he saw the Angel [For the Angel appeared in the shaped of a man, between heaven and earth, having a drawn sword in sword in his hand, 1 Chron.21.16.] tha smote the people, spake unto the LORD, and said; behold, I, I have sinned, [in numbering the people] and I, I have dealt unjustly, but what have these sheep done? [he meaneth the people, who indeed were innocent as touching this sin of David, but otherwise had justly deserved this punishment] Let thine hand I pray be against me, and against my fathers house. [i.e. my kinsmen that have also advised me, or at least not disswaded me.]"}],"18":[{"catchword":null,"tekst":"And Gad came that day to David, and said unto him; go up [Out of thy strong hold, to the mount called Morija, where Arauna dwelt, where Abraham was commanded to offer up his son, Gen.22.v.14. and afterward the temple was built. See 2 Chron.3.1. and 1 Chron.22. etc.] rear an altar unto the LORD, on the threshing-floor of Arauja [above and below called Arauna] the Jebusite."}],"19":[{"catchword":null,"tekst":"So David went up according to the word of Gad, according as the LORD had commanded. [By the Angel whom God had charged to inform the Prophet Gad thereof, 1 Chron.21.18.]"}],"20":[{"catchword":null,"tekst":"And Arauna looked and saw the King and his servants coming over to him; so Arauna went out and bowed himself before the King with his face toward the ground."}],"21":[{"catchword":null,"tekst":"And Arauna said; wherefore cometh my lord the King unto his servant? [i.e. unto me] and David said; to buy of thee this threshing-floor, to build an altar unto 16 48.] from the people."}],"22":[{"catchword":null,"tekst":"Then said Arauna unto David; Let my Lord the King take and offer (up) that which is good in his eyes, [That which pleaseth him] behold there (be) the oxen [for Aurana was busy with threshing, whereunto oxen were used, that drew about the threshing-cart, or fledge over the corn: see Deut.25.on ver.4.] for burnt-offering and the sledges, and the instruments of the oxen for wood. [to set the offering on fire.]"}],"23":[{"catchword":null,"tekst":"All these things did Arauna the King [Some think that const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"
const ZELF = D.meta.zelf_abbr;      // afkorting binnen dit hoofdstuk, bv. "Joh 3"
const BASIS_URL = D.meta.basis_url;
const PARALLEL_VOLGORDE = ['SVnu', 'SV', 'KJV'];
let vertaling = 'SVnu';
let openVers = null;

const bijbel = document.getElementById('bijbel');
const popup = document.getElementById('popup');
const toast = document.getElementById('toast');
const nummers = Object.keys(D.vertalingen.SVnu);

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    const inhoud = lijst.map(it => it.catchword
      ? `<div class="uitleg-item"><span class="uitleg-cw">${md(it.catchword)}</span>${md(it.tekst)}</div>`
      : `<div class="uitleg-item">${md(it.tekst)}</div>`
    ).join('');
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
