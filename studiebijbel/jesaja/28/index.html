l":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Wee de hoogmoedige kroon van de dronkaards van Efraïm, wiens heerlijke sieraad een verwelkende bloem is, die daar is op het hoofd van de zeer vruchtbare vallei, van hen die door de wijn geveld zijn.","2":"Zie, de Heere heeft een sterke en machtige, er is als een hagelvloed, een verwoestende storm; als een vloed van sterk, overstromend water zal Hij ze met de hand ter aarde neerwerpen.","3":"De hoogmoedige kroon van de dronkaards van Efraïm zal met voeten vertrapt worden.","4":"En de verwelkende bloem van zijn heerlijke sieraad, die op het hoofd van de zeer vruchtbare vallei is, zal zijn als een vroegrijpe vrucht vóór de zomer, die, wanneer iemand ze ziet, terwijl zij nog in zijn hand is, hij opslokt.","5":"Op die dag zal de HEERE van de heerscharen[1] tot een heerlijke kroon en tot een sierlijke krans zijn voor het overblijfsel van Zijn volk;","6":"en tot een Geest van het oordeel voor hem die te oordelen zit, en tot een sterkte voor hen die de strijd terugdrijven tot aan de poort toe.","7":"Maar ook dezen dwalen door de wijn, en zij dolen door de sterke drank; de priester en de profeet dwalen door de sterke drank; zij zijn verslonden door de wijn, zij dolen door sterke drank; zij dwalen in het zien van visioenen; zij waggelen in het rechtspreken.","8":"Want alle tafels zijn vol *uitspuwsel* en drek, zodat er geen *schone* plaats is.","9":"Aan wie zou Hij dan de kennis leren, en aan wie zou Hij het gehoorde te verstaan geven? Aan hen die van de melk gespeend zijn, die van de borsten weggehaald zijn?","10":"Want het is gebod op gebod, gebod op gebod, regel op regel, regel op regel, hier een weinig, daar een weinig.","11":"Daarom zal Hij door belachelijke lippen en door een andere tong tot dit volk spreken;","12":"tot wie Hij gezegd heeft: Dit is de rust, geef de moede rust, en dit is de verkwikking; toch hebben zij niet willen horen.","13":"Zo zal het woord van de HEERE voor hen zijn: gebod op gebod, gebod op gebod, regel op regel, regel op regel, hier een weinig, daar een weinig; opdat zij heengaan, en achterwaarts vallen, en gebroken, en verstrikt en gevangen worden.","14":"Daarom, hoor het woord van de HEERE, u bespotters, u die heersen over dit volk, dat in Jeruzalem is!","15":"Omdat u zegt: Wij hebben een verbond met de dood gemaakt, en met het rijk van de dood hebben wij een voorzichtig verdrag gemaakt; wanneer de overstromende gesel doortrekt, zal hij bij ons niet komen; want wij hebben de leugen ons tot een toevlucht gesteld, en onder de valsheid hebben wij ons verborgen.","16":"Daarom, zo zegt de Heere HEERE: Zie, Ik leg een grondsteen in Sion, een beproefde steen, een kostbare hoeksteen, die stevig gegrondvest is; wie gelooft, die zal niet haasten.","17":"En Ik zal het oordeel stellen naar het richtsnoer, en de gerechtigheid naar het paslood; en de hagel zal de toevlucht van de leugen wegvagen, en het water zal de schuilplaats overstromen.","18":"En uw verbond met de dood zal teniet gedaan worden, en uw voorzichtig verdrag met het rijk van de dood zal niet standhouden; wanneer de overstromende gesel doortrekt, dan zult u erdoor vertrapt worden.","19":"Vanaf de tijd dat hij doortrekt, zal hij u wegnemen, want elke morgen zal hij doortrekken, bij dag en bij nacht; en het zal gebeuren, dat louter het verstaan van het gerucht een verschrikking zal zijn.","20":"Want het bed zal korter zijn dan dat men zich erop kan uitstrekken; en het deksel zal te smal zijn, als men zich eronder wikkelt.","21":"Want de HEERE zal Zich opmaken, zoals op de berg Perazim, Hij zal beroerd zijn, zoals in het dal van Gibeon, om Zijn werk te doen, Zijn werk zal vreemd zijn; en om Zijn daad te doen, Zijn daad zal vreemd zijn!","22":"Nu dan, drijf de spot niet, opdat uw banden niet vaster gemaakt worden; want ik heb van de Heere HEERE van de heerscharen een verdelging gehoord, ja, een die vast besloten is over het hele land.","23":"Neem het ter ore en hoor mijn stem, let op en hoor mijn rede!","24":"Ploegt de ploeger de hele dag om te zaaien? Opent en egt hij zijn land de hele dag?","25":"Is het niet zo? Wanneer hij het bovenste ervan gelijk gemaakt heeft, dan strooit hij wikken, en spreidt komijn uit, of hij werpt er de beste tarwe in, of uitgelezen gerst, of spelt, elk op zijn plaats.","26":"En zijn God onderricht hem over de juiste wijze, Hij leert het hem.","27":"Want men dorst de wikken niet met de dorswagen, en men laat het wagenrad niet rondom over het komijn gaan; maar de wikken slaat men uit met een staf, en het komijn met een stok;","28":"Het koren voor brood moet verbrijzeld worden, maar hij dorst het niet voortdurend; noch breekt hij het met het wiel van zijn wagen, noch verbrijzelt hij het met zijn paarden.","29":"Ook dit komt voort van de HEERE van de heerscharen; Hij is wonderlijk van raad, Hij is groot van daad."},"SV":{"1":"Wee de hovaardige kroon der dronkenen van Efraïm, welker heerlijk sieraad is een afvallende bloem, die daar is op het hoofd der zeer vette vallei, der geslagenen van den wijn.","2":"Ziet, de Heere heeft een sterke en machtige, er is gelijk een hagelvloed, een poort des verderfs; gelijk een vloed der sterke wateren; die overvloeien, zal Hij ze ter aarde nederwerpen met de hand.","3":"De hovaardige kronen der dronkenen van Efraïm zullen met voeten vertreden worden.","4":"En de afvallende bloem zijns heerlijken sieraads, die op het hoofd der zeer vette vallei is, zal zijn gelijk een vroegrijpe vrucht voor den zomer, welke, wanneer ze iemand ziet, terwijl zij nog in zijn hand is, slokt hij ze op.","5":"Te dien dage zal de HEERE der heirscharen tot een heerlijke Kroon en tot een sierlijken Krans zijn den overgeblevenen Zijns volks;","6":"En tot een Geest des oordeels dien, die ten oordeel zit, en tot een sterkte dengenen, die den strijd afkeren tot de poort toe.","7":"En ook dwalen dezen van den wijn, en zij dolen van den sterken drank; de priester en de profeet dwalen van den sterken drank; zij zijn verslonden van den wijn, zij dolen van sterken drank; zij dwalen in het gezicht; zij waggelen in het gericht.","8":"Want alle tafels zijn vol van uitspuwsel *en* van drek, zodat er geen plaats *schoon* is.","9":"Wien zou Hij *dan* de kennis leren, en wien zou Hij het gehoorde te verstaan geven? Den gespeenden van de melk, den afgetrokkenen van de borsten?","10":"Want het is gebod op gebod, gebod op gebod, regel op regel, regel op regel, hier een weinig, daar een weinig.","11":"Daarom zal Hij door belachelijke lippen, en door een andere tong tot dit volk spreken;","12":"Tot dewelken Hij gezegd heeft: Dit is de rust, geeft den moeden rust, en dit is de verkwikking; doch zij hebben niet willen horen.","13":"Zo zal hun het woord des HEEREN zijn; gebod op gebod, gebod op gebod, regel op regel, regel op regel, hier een weinig, daar een weinig; opdat zij heengaan, en achterwaarts vallen, en verbreken, en verstrikt en gevangen worden.","14":"Daarom, hoort des HEEREN woord, gij bespotters, gij heersers over dit volk, dat te Jeruzalem is!","15":"Omdat gijlieden zegt: Wij hebben een verbond met den dood gemaakt, en met de hel hebben wij een voorzichtig verdrag gemaakt; wanneer de overvloeiende gesel doortrekken zal , zal hij tot ons niet komen; want wij hebben de leugen ons tot een toevlucht gesteld, en onder de valsheid hebben wij ons verborgen.","16":"Daarom, alzo zegt de Heere HEERE: Ziet, Ik leg een grondsteen in Sion, een beproefden steen, een kostelijken hoeksteen, die wel vast gegrondvest is; wie gelooft, die zal niet haasten.","17":"En Ik zal het gericht stellen naar het richtsnoer, en de gerechtigheid naar het paslood; en de hagel zal de toevlucht der leugen wegvagen, en de wateren zullen de schuilplaats overlopen.","18":"En ulieder verbond met den dood zal te niet worden, en uw voorzichtig verdrag met de hel zal niet bestaan; wanneer de overvloeiende gesel doortrekken zal, dan zult gijlieden van denzelven vertreden worden.","19":"Van den tijd af, als hij doortrekt, zal hij ulieden wegnemen, want allen morgen zal hij doortrekken, bij dag en bij nacht; en het zal geschieden, dat het gerucht te verstaan, enkel beroering wezen zal.","20":"Want het bed zal korter zijn, dan dat men zich daarop uitstrekken kunne; en het deksel zal te smal wezen, als men zich *daaronder* voegt.","21":"Want de HEERE zal Zich opmaken, gelijk op den berg Perazim, Hij zal beroerd zijn, gelijk *in* het dal van Gibeon, om Zijn werk te doen, Zijn werk zal vreemd zijn; en om Zijn daad te doen, Zijn daad zal vreemd zijn!","22":"Nu dan, drijft den spot niet, opdat uw banden niet vaster gemaakt worden; want ik heb van den Heere HEERE der heirscharen gehoord een verdelging, ja, een, die vast besloten is over het ganse land.","23":"Neemt ter ore en hoort mijn stem, merkt op en hoort mijn rede!","24":"Ploegt de ploeger den gehelen dag om te zaaien? Opent en egt hij zijn land *den* *gehelen* *dag*?","25":"Is het niet alzo? Wanneer hij het bovenste van hetzelve effen gemaakt heeft, dan strooit hij wikken, en spreidt komijn, of hij werpt er van de beste tarwe in, of uitgelezen gerst, of spelt, elk aan zijn plaats.","26":"En zijn God onderricht hem van de wijze, Hij leert hem.","27":"Want men dorst de wikken niet met den dorswagen, en men laat het wagenrad niet rondom over het komijn gaan; maar de wikken slaat men uit met een staf, en het komijn met een stok;","28":"Het brood *koren* moet verbrijzeld worden, maar hij dorst het niet geduriglijk dorsende; noch hij breekt *het* *met* het wiel zijns wagens, noch hij verbrijzelt het met zijn paarden.","29":"Zulks komt ook voort van den HEERE der heirscharen; Hij is wonderlijk van raad, Hij is groot van daad."},"KJV":{"1":"Woe to the crown of pride, to the drunkards of Ephraim, whose glorious beauty *is* a fading flower, which *are* on the head of the fat valleys of them that are overcome with wine!","2":"Behold, the Lord hath a mighty and strong one, *which* as a tempest of hail *and* a destroying storm, as a flood of mighty waters overflowing, shall cast down to the earth with the hand.","3":"The crown of pride, the drunkards of Ephraim, shall be trodden under feet:","4":"And the glorious beauty, which *is* on the head of the fat valley, shall be a fading flower, *and* as the hasty fruit before the summer; which *when* he that looketh upon it seeth, while it is yet in his hand he eateth it up.","5":"In that day shall the LORD of hosts be for a crown of glory, and for a diadem of beauty, unto the residue of his people,","6":"And for a spirit of judgment to him that sitteth in judgment, and for strength to them that turn the battle to the gate.","7":"But they also have erred through wine, and through strong drink are out of the way; the priest and the prophet have erred through strong drink, they are swallowed up of wine, they are out of the way through strong drink; they err in vision, they stumble *in* judgment.","8":"For all tables are full of vomit *and* filthiness, *so that there is* no place","9":"Whom shall he teach knowledge? and whom shall he make to understand doctrine? *them that are* weaned from the milk, *and* drawn from the breasts.","10":"For precept *must be* upon precept, precept upon precept; line upon line, line upon line; here a little, *and* there a little:","11":"For with stammering lips and another tongue will he speak to this people.","12":"To whom he said, This *is* the rest *wherewith* ye may cause the weary to rest; and this *is* the refreshing: yet they would not hear.","13":"But the word of the LORD was unto them precept upon precept, precept upon precept; line upon line, line upon line; here a little, *and* there a little; that they might go, and fall backward, and be broken, and snared, and taken.","14":"Wherefore hear the word of the LORD, ye scornful men, that rule this people which *is* in Jerusalem.","15":"Because ye have said, We have made a covenant with death, and with hell are we at agreement; when the overflowing scourge shall pass through, it shall not come unto us: for we have made lies our refuge, and under falsehood have we hid","16":"Therefore thus saith the Lord GOD, Behold, I lay in Zion for a foundation a stone, a tried stone, a precious corner *stone*, a sure foundation: he that believeth shall not make haste.","17":"Judgment also will I lay to the line, and righteousness to the plummet: and the hail shall sweep away the refuge of lies, and the waters shall overflow the hiding place.","18":"And your covenant with death shall be disannulled, and your agreement with hell shall not stand; when the overflowing scourge shall pass through, then ye shall be trodden down","19":"From the time that it goeth forth it shall take you: for morning by morning shall it pass over, by day and by night: and it shall be a vexation only *to* understand the report.","20":"For the bed is shorter than that *a man* can stretch himself *on it*: and the covering narrower than that he can wrap","21":"For the LORD shall rise up as *in* mount Perazim, he shall be wroth as *in* the valley of Gibeon, that he may do his work, his strange work; and bring to pass his act, his strange act.","22":"Now therefore be ye not mockers, lest your bands be made strong: for I have heard from the Lord GOD of hosts a consumption, even determined upon the whole earth.","23":"Give ye ear, and hear my voice; hearken, and hear my speech.","24":"Doth the plowman plow all day to sow? doth he open and break the clods of his ground?","25":"When he hath made plain the face thereof, doth he not cast abroad the fitches, and scatter the cummin, and cast in the principal wheat and the appointed barley and the rie in their place?","26":"F ass=\"wl wl-kjv\" data-code=\"H4294\">staff,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3646\">cummin</span> with a rod.","28":"<span class=\"wl wl-kjv\" data-code=\"H3899\">Bread</span> corn is <span class=\"wl wl-kjv\" data-code=\"H1854\">bruised;</span> because he will not <span class=\"wl wl-kjv\" data-code=\"H5331\">ever</span> be <span class=\"wl wl-kjv\" data-code=\"H156\">threshing</span> it, nor <span class=\"wl wl-kjv\" data-code=\"H2000\">break</span> it with the <span class=\"wl wl-kjv\" data-code=\"H1536\">wheel</span> of his <span class=\"wl wl-kjv\" data-code=\"H5699\">cart,</span> nor <span class=\"wl wl-kjv\" data-code=\"H1854\">bruise</span> it with his horsemen.","29":"This also cometh <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> from the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts,</span> which is <span class=\"wl wl-kjv\" data-code=\"H6381\">wonderful</span> in <span class=\"wl wl-kjv\" data-code=\"H6098\">counsel,</span> and <span class=\"wl wl-kjv\" data-code=\"H1431\">excellent</span> in working."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"de hovaardige","tekst":"Hebreeuws, wee de kroon der hovaardij, enz. Het is een beschrijving van het koninkrijk der tien stammen van Israël, waarvan Samaria de hoofdstad was, die hij hier noemt het hoofd der vette vallei, omdat zij lag op een berg en beneden dien was een zeer vruchtbare vallei. Zie onder vs.3; Hos 5:5 , en Hos 7:10 ."},{"catchword":"welker","tekst":"Dat is, welker heerlijke staat [te weten Efraïm, of het koninkrijk van Samaria ] die tevoren voortreffelijk gebloeid heeft, maar nu verwelkt en haast geheel vervallen zal."},{"catchword":"is een afvallende","tekst":"Of, verwelkende bloem."},{"catchword":"die","tekst":"Te weten, bloem."},{"catchword":"daar is","tekst":"Die over een zeer vet dal gezet is."},{"catchword":"der geslagenen","tekst":"Dat is, die van den wijn dagelijks vol en dol zijn, en welker hersenen van den wijn als geslagen en gekwetst zijn."}],"2":[{"catchword":"een sterke","tekst":"Te weten den koning van Assyrië, door wien de Heere had voorgenomen de tien stammen van Israël te straffen en hun land te verderven."},{"catchword":"een poort","tekst":"Dit betekent de verwoesting en ondergang van den gansen stand van het Israëlitische rijk. In de stadspoorten plachten de overheden te zitten ten gericht. Of men kan het zo nemen, poort des verderfs; dat is, een wijde opening tot ondergang. Anders: Een onweder des verderfs."},{"catchword":"sterke","tekst":"Of, veler wateren."},{"catchword":"met de hand","tekst":"Dat is, met kracht, Salmanassar heeft het koninkrijk der tien stammen in weinige jaren overmeesterd; 2Ki 18:10-11 ."}],"3":[{"catchword":"De hovaardige","tekst":"Of, met voeten zullen vertreden worden de kroon en de hovaardij der dronkenen van Efraïm."}],"4":[{"catchword":"zijns heerlijken","tekst":"Te weten van Efraïm."},{"catchword":"vroegrijpe","tekst":"Of, vroegtijdige."},{"catchword":"voor den zomer,","tekst":"Of, eer het zomer is; dat is vóór haar seizoen."},{"catchword":"wanneer","tekst":"Hebreeuws, [wanneer] de ziener dezelve ziet, of zo haast als hij ze in zijne hand [Hebreeuws, palm ] krijgt."},{"catchword":"terwijl","tekst":"Dat is, terstond."},{"catchword":"slokt","tekst":"Of, zwelgt hij ze in. De zin van dit vs. is dat Efraïm haastiglijk en met groten lust van zijne vijanden zal verslonden worden."}],"5":[{"catchword":"Te dien dage","tekst":"Te weten als de Heere zijnen toorn over de goddelozen zal uitgegoten hebben."},{"catchword":"tot een heerlijke","tekst":"De Heere zal hen ter ere brengen en heerlijk versieren."},{"catchword":"den overgeblevenen","tekst":"Hebreeuws, voor het overblijfsel."}],"6":[{"catchword":"die ten oordeel","tekst":"Of, die over het oordeel zitten zal; dat is, God zal den rechters en regenten van zijn volk zijn Heiligen Geest rijkelijk mededelen om wel te oordelen en hunne onderzaten wel voor te staan."},{"catchword":"tot een sterkte","tekst":"Dat is, God zal zijn volk ook dappere helden geven om tegen de vijanden te strijden en die terug te drijven tot aan de poorten hunner vijanden toe. Als men de vijanden van het land tot aan en in hun eigen poorten drijven en daar binnen houden kan, zo houden de verdrijvers hunne landpalen vrij."}],"7":[{"catchword":"dezen","tekst":"Te weten, velen onder de Joden, of van den stam van Juda."},{"catchword":"van den wijn,","tekst":"Of, in den wijn; dat is, zij hebben zich zo geheel begeven tot dronkenschap en vleselijke wellusten, dat zij schier van al hun verstand beroofd worden. Dit kan ook van de geestelijke dronkenschap verstaan worden, door welke men in de zonden versmoord ligt, gelijk onder Isa 29:9 . Zie Pro 20:1 ."},{"catchword":"de priester","tekst":"Of overste. Zie Gen 41:45 ."},{"catchword":"de profeet","tekst":"Te weten de valse profeten, gelijk onder Isa 29:10 ."},{"catchword":"zij zijn verslonden","tekst":"De zin is: Gelijk zij den wijn ingezopen hebben, alzo verslindt en verderft de wijn hen ook."},{"catchword":"zij dwalen","tekst":"Dat is, de priesters dolen in het uitleggen der profetieën, zij keren en draaien die naar hun eigen lusten en inbeeldingen."},{"catchword":"waggelen","tekst":"Of, struikelen in het oordelen."}],"8":[{"catchword":"zijn vol","tekst":"Of, zijn vervuld met uitbrakingen."},{"catchword":"drek,","tekst":"Of, van vuiligheid."},{"catchword":"zodat","tekst":"Versta hierbij, maar overal is het bespogen en vuil gemaakt, of, zodat er gene plaats meer is; te weten die niet vuil gemaakt of ontreinigd is."}],"9":[{"catchword":"Hij dan","tekst":"Te weten de Heere door zijne profeten."},{"catchword":"de kennis","tekst":"Te weten der noodwendige of kenwaardige zaken."},{"catchword":"het gehoorde","tekst":"Hebreeuws, het gehoor. De zin is: Hetgeen ik, Jesaja, van den Heere gehoord heb, of prediking. Zie Isa 53:1 ."},{"catchword":"Den gespeenden","tekst":"De profeet wil zeggen dat zij zo dol en vol zijn van den wijn, dat zij zijn gelijk de kleine kinderen, die tot geen onderwijs bekwaam zijn."}],"10":[{"catchword":"het is gebod","tekst":"Dit zijn Gods woorden door den mond des profeten, en dit is de zin: Men geeft hun het ene gebod na het andere, en evenwel helpt het niet, want zij zijn kinderen in het verstand, zowel de ouden als de jongen."}],"11":[{"catchword":"Daarom","tekst":"De zin is: Dewijl zich dit volk niet heeft willen laten onderwijzen door het klare woord Gods, zo zal Hij op een andere wijze met hen handelen; Hij zal met een onbekende taal hen laten aanspreken, tot straf hunner ondankbaarheid, en hardnekkigheid. Zie Isa 33:19 ; 1Co 14:21 ."},{"catchword":"door belachelijke","tekst":"Dat is, met vreemde talen; want men is gewoon die te belachen, die men niet verstaat. Anders: door belachelijken van lippen. De zin van deze woorden Gods, alsook der naastvolgende, is dat Hij hen met uitlandse vijanden en heirlegers, wier taal zij niet verstaan zouden, tehuiszoeken wilde."},{"catchword":"een andere","tekst":"Dat is, een vreemde taal."}],"12":[{"catchword":"dewelken","tekst":"Dat is, tot welk volk."},{"catchword":"Hij gezegd heeft","tekst":"Te weten de Heere, door zijne dienaren de profeten."},{"catchword":"Dit is de rust,","tekst":"Alzo zult gijlieden tot rust en vrede geraken en den zegen des Heeren verkrijgen, indien gij den vermoeiden troost en bijstand doet; zie Isa 1:17 ; of dat is de rust, dat gij Gods geboden houdt, en alzo doende zult gij uw vermoeid vaderland tot rust brengen."}],"13":[{"catchword":"Zo zal","tekst":"De zin is: Dewijl zij des Heeren woord veracht hebben, zo zullen zij in hun onverstand gelaten worden en den kleinen kinderen gelijk zijn, welke men het ene gebod na het andere, den enen regel op den anderen, enz., leren moet."},{"catchword":"opdat zij","tekst":"Dat is, opdat zij tot verderf en allerlei ellenden vervallen zouden, want dat volgt er gemeenlijk op als men Gods Woord niet wil aannemen."}],"14":[{"catchword":"gij bespotters,","tekst":"Hebreeuws, gij mannen der bespotting, gij heersers van het volk."}],"15":[{"catchword":"gemaakt,","tekst":"Zie de aantekening Gen 15:18 ."},{"catchword":"met de hel","tekst":"Of, wij hebben ene overlegging met het graf of de hel gemaakt. Dit zou men zeggen op de hedendaagse manier van spreken: wij hebben intelligentie, of een verbond met de hel, of het graf. De weelde en hoogheid dezer wereld maakt de goddelozen gemeenlijk zo verwaand en zo moedig, dat zij zich laten voorstaan dat zij dood noch hel hebben te vrezen, zodat zij zelfs den Almachtige durven uitdagen en trotseren. Zie Job 5:23 , en Isa 5:19 ."},{"catchword":"de overvloeiende","tekst":"Hij meent het heirleger van den koning van Babel, dat als een watervloed het land zou overstelpen en bedekken."},{"catchword":"doortrekken","tekst":"Anders: door [het land] passeert, of doorgaat."},{"catchword":"de leugen","tekst":"Aldus noemt de profeet de aanslagen van dit volk, die zij meenden dat hun niet zouden mislukken."},{"catchword":"de valsheid","tekst":"Dat is huichelarij."}],"16":[{"catchword":"een grondsteen","tekst":"Hebreeuws, Ik ben het [die] een steen in Zion grond. Christus is de rechte grondsteen van Zion, dat is van zijne kerk, die ons tegen den dood, de hel en alle onheil verzekert; Hij zou met recht de troost en toeverlaat der Joden behoren te zijn, niet hunne leugens en huichelarij."},{"catchword":"een beproefden","tekst":"En dienvolgens dierbaren en kostelijken, zie 1Pe 2:6 ; [ene gelijkenis, genomen van kostelijke stenen, die men door beproeving bevindt kostelijk te zijn] en bekwaam en genoegzaam om het gebouw der ganse kerk te dragen. Anders: een beproefsteen."},{"catchword":"die wel vast","tekst":"Hebreeuws, die gegrond gegrond is; dat is, die wel terdege gegrondvest of gefondeerd is."},{"catchword":"wie gelooft,","tekst":"Te weten in Christus, gelijk het de apostel verklaart 1Pe 2:6 ."},{"catchword":"die zal niet haasten","tekst":"Anders: Die verhaast zich niet. Versta hierbij: En derhalve komt hij niet te schande, Rom 5:4-5 ; maar hij krijgt eindelijk die zalige uitkomst, die hij met geduld verwacht heeft; gerust en wel tevreden zijnde, geen anderen troost noch toevlucht zoekende dat Christus Jezus. De apostel Paulus, Rom 9:33 , en de apostel Petrus, 1Pe 2:6 , stellen voor deze woorden, die zal niet haasten, deze, die zal niet beschaamd worden, ziende op den zin der woorden."}],"17":[{"catchword":"Ik zal","tekst":"God de Heere dreigt met deze woorden dat Hij dit volk behandelen zou naar hunne werken; zie 2Ki 21:13 ."},{"catchword":"de hagel","tekst":"De hagel, alsook straks de wateren, betekenen hier het krijgsheir der Babyloniërs, gelijk boven, vs.2. Sommigen duiden dit en enige navolgende verzen ook wijders van de eindelijke verwoesting der Joden door de Romeinen."},{"catchword":"de toevlucht","tekst":"Dat is, de valse toevlucht."},{"catchword":"wegvagen,","tekst":"Als met bezems wegkeren."},{"catchword":"overlopen","tekst":"Of, overvloeien, overstelpen."}],"18":[{"catchword":"zal te niet","tekst":"Hebreeuws, overpekt, of overkalkt worden, of oversmeerd, overstreken worden; dat is, het zal verdelgd, of tenietgedaan worden."},{"catchword":"met de hel","tekst":"Of, met het graf."},{"catchword":"dan zult","tekst":"Hebreeuws, zult gij dezelve ter vertreding zijn."}],"19":[{"catchword":"hij doortrekt,","tekst":"Te weten de overvloeiende gesel, of, [hij] te weten de vloed."},{"catchword":"ulieden","tekst":"O gij goddeloze en halsstarrige mensen."},{"catchword":"elken morgen","tekst":"De zin is: Hij zal des morgens aankomen, en voorts den dag en den nacht duren; dat is, hij zal niet ophouden, maar hij zal duren van tijd tot tijd. Hebreeuws, in morgen in morgen."},{"catchword":"gerucht","tekst":"Hebreeuws, het gehoor; dat is, het gerucht der straffen, die over u gaan zullen. De zin is: Als gijlieden zult te schande gemaakt en verwoest zijn, en in Babylonië zult gevankelijk weggevoerd zijn, zo zal dat een schrik aanjagen allen, die het horen. Anderen nemen het aldus: Het bloot gerucht van de aankomst der vijanden zal u verschrikking aanbrengen, alzo dat er raad noch daad bij ulieden zal te vinden zijn."}],"20":[{"catchword":"Want het bed","tekst":"De zin is: Gijlieden zult gebrek en kommer lijden in de Babylonische gevangenschap. Sommigen duiden het op de toevlucht en het deksel der valsheid, waarvan vs.15, 17."},{"catchword":"voegt","tekst":"Hebreeuws, verzamelt; te weten met intrekking der leden."}],"21":[{"catchword":"Perázim,","tekst":"Op dezen berg heeft God eertijds de Filistijnen door David geslagen; 2Sa 5:20 , en 1Ch 14:11 ."},{"catchword":"Hij zal beroerd","tekst":"Of, Hij zal bewogen worden; dat is, Hij zal zich vertoornen."},{"catchword":"in het dal","tekst":"Zie Jos 10:10 , en 1Ch 14:16 ."},{"catchword":"Zijn werk zal vreemd","tekst":"God is een goedertieren en barmhartig God, die langzaam tot het straffen komt, en derhalve in vergelijking van zijn vorige goedertierenheid en weldadigheid, doorgaans aan zijn volk bewezen, een vreemd werk genaamd wordt."}],"22":[{"catchword":"uw banden","tekst":"Waarmede de Babyloniërs u zullen binden. De zin is: door de dagelijkse zonden worden uwe banden dagelijks vaster en vaster gemaakt, maar door berouw en leedwezen slapper; derhalve, wenst gij verlichting en ontlossing van uwe banden, zo bekeert u tot den Heere en staat af van zonden."},{"catchword":"vast besloten","tekst":"Of, ene besluiting, alzo Isa 10:22-23 . Dat is, die bij den onveranderlijken God vast besloten is en voorzeker geschieden zal."}],"24":[{"catchword":"Ploegt de ploeger","tekst":"De zin van dit vs. is, gelijk een ervaren akkerman den tijd weet wanneer dat hij ploegen, braken, zaaien en eggen zal; alzo weet ook God de Heere zijn tijd, wanneer Hij het een of ander aan zijne gemeente zal voornemen en verrichten om de vromen te behouden en de bozen te straffen."},{"catchword":"den gehelen dag","tekst":"Dat is, altoos."},{"catchword":"Opent","tekst":"Of, voornt hij, of maakt gij altoos voren?"}],"25":[{"catchword":"het bovenste","tekst":"Hebreeuws, haar aangezicht; te weten der aarde, of, zijn aangezicht, te weten des lands."},{"catchword":"wikken,","tekst":"Of, vitsen. Doch wat het eigenlijk voor een zaad geweest is, is onzeker."},{"catchword":"spreidt komijn,","tekst":"Of, hij werpt er komijn in."},{"catchword":"beste tarwe","tekst":"Of, edelste. Hebreeuws, gevorste tarwe, of prinselijke, vorstelijke tarwe. Aldus wordt de tarwe genoemd, omdat zij prins of koning, dat is het voornaamste zaad onder alle zaden is."},{"catchword":"uitgelezen","tekst":"Hebreeuws, uitgetekende."},{"catchword":"zijn plaats","tekst":"Te weten des zaads, of, [ aan hare ] te weten der aarde, of des akkers; dat is, elk op zijn akker."}],"26":[{"catchword":"onderricht","tekst":"Dat is, God leert hem [te weten den landman] doen zoals het behoort, hoe hij met allerlei zaad naar zijn aard zal omgaan, op welken tijd hij het moet zaaien en maaien."},{"catchword":"van de wijze,","tekst":"Dat is, hoe hij behoort te doen. Het Hebreeuwse woord betekent hier ene wijze, of manier, hoe men ieder ding moet doen."}],"27":[{"catchword":"met den dorswagen,","tekst":"De Joden hebben eertijds hunne zaadvruchten op verscheidene wijzen uitgedorst, over sommig zaad sleepten zij een dorswagen of dorsslede, over sommig trokken of stieten zij een rad, ander deden zij de ossen uittreden; het zaad, dat in blaasjes wast, sloegen zij met stokken uit. Zo is dan dit de zin van dit vs.: Gelijk de akkerman niet alle zaad op eene wijze uitdorst, alzo straft ook God niet altoos op eene wijze, maar den een harder dan den ander, naar gelegenheid van zaken."}],"28":[{"catchword":"Het brood koren","tekst":"Vs.27 heeft hij gezegd, welk oordeel of overleg de landman gebruikt in het uitdorsen van die en die zaden; hier wijst hij aan, welk overleg de landman gebruikt in het hanteren der tarwe, die moet verbrijzeld worden, zal zij bekwaam gemaakt worden om brood daarvan te maken, nochtans verbrijzelt hij ze niet door het lang en veel dorsen en herdorsen, want zodoende zou zij op den dorsvloer bedorven worden en nergens bruikbaar toe wezen; derhalve moet de tarwe, nadat ze uitgedorst is, met de molenstenen klein gemalen en verbrijzeld worden; dewijl de landman dit wel weet en verstaat, zo gebruikt hij overleg en verstand in het omgaan met het broodzaad. Dit oordeel, of verstand en overleg komt ook van den Heere. In het Hebreeuws staat brood voor broodkoren, gelijk Psa 104:15 ."},{"catchword":"hij dorst","tekst":"Te weten de huisman."},{"catchword":"geduriglijk","tekst":"Hebreeuws, eeuwiglijk, altoos."},{"catchword":"noch hij breekt","tekst":"Of, noch het wiel van zijn wagen breekt het."}],"29":[{"catchword":"Zulks komt","tekst":"Te weten, deze landverderving, waarvan vs.22 gesproken is, komt ook van den Heere; zie 2Sa 16:10 ; 2Ki 18:25 ."},{"catchword":"Hij is wonderlijk","tekst":"Hebreeuws, Hij maakt wonderlijk den raad, Hij maakt groot de daad, of het wezen. Zie de aantekening Job 5:12 , en Job 38:2 ."},{"catchword":"Hij is groot","tekst":"De zin is: God is heerlijk metterdaad, makende dat zijn raad en voornemen in het werk gesteld worde en als zijn wezen bekome; Hij voert alles heerlijk uit."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Wo to the proud Crown of the drunkard of Ephraim, whose glorious ornament is a flower falling down, which is on the head of the very fat valley, of them that are smitten of wine. [Heb. Wo to the Crown of pride, etc. It is a description of the Kingdom of the ten tribes of Israel, when Samaria was the Chief city, which he here calleth the head of the fat valley: because it lay upon a mountain, and below it was a very fruitful valley. See below vers.3. Hos 5:5. and 7.10. (whose glorious ornament is a flower falling) or, a withering flower. That is, whose glorious state and condition (to wit, Ephraims, or the kingdom of Samaria&acirc;&euro;&trade;s state and condition) which heretofore flourished so mightily, but withereth and fadeth now, and will soon utterly decay and perish: (which) to wit, flower: (is on the head of the very fat valley) which is set upon a very fat valley: of the that are smitten of wine) that is, who are daily replenished with wine, so that their brains are as it were smitten and wounded by wine.]"}],"2":[{"catchword":null,"tekst":"Behold, the LORD hath a strong and mighty one, [To wit, the King of Assyria, by whom the Lord hath purposed to punish the ten tribes of Israel, and to destroy their land] there is as a flood of hail, a gate of destruction: [this signifieth the ruine and destruction of the whole state of the Kingdom of Israel. In the city-gates Magistrates did use to sit in judgement. Or it may be taken thus: a gate of destruction; that is, a wide opening unto ruine or destruction. Others a tempest of destruction] as a flood of strong waters [or of many waters] that overflow, will he cast them down to the earth with the hand. [that is, with power, or might. Salmasser in few years time subdued the Kingdom of the ten tribes, 2 Kings 18.10,11.]"}],"3":[{"catchword":null,"tekst":"The crowns of the drunkards of Ephraim shall be trodden under feet. [or, the crown, the pride of the drunkards of Ephraim shall be trodden under feet."}],"4":[{"catchword":null,"tekst":"And the falling flower of his, [to wit, Ephraims] glorious ornament, which is on the head of the very fat valley, shall be as the soon-ripe [or, too soon ripe, ripe before due time] fruit before the summer, [or, before it is summer; that is, before its season] which, when any man seeth it [Heb. (when) the seer seeth it] while it is yet in his hand, [that is, presently. Or, as soon as he getteth it into his hand (Heb. Palm)] he swalloweth it up. [Or, he swalloweth it down. The meaning of this verse is, that Ephraim shall be suddenly and with great pleasure be devoured of his enemies."}],"5":[{"catchword":null,"tekst":"In that day [To wit, when the Lord shall have poured out his wrath upon the wicked] shall the LORD of hosts be for a glorious crown, and for a beautiful garland, [that is, the Lord shall bring them to honour, and beautify or adorn them most gloriously] unto them that are left [Heb. Unto, or, for the remnant] of his people."}],"6":[{"catchword":null,"tekst":"And for a spirit of Judgement, to him that sitteth in judgement. [Or, to him that shall sit over the judgement. That is, God shall richly communicate his holy spirit unto the Judges and Rulers of his people, that they may rightly govern, and protect their subjects well] and for strength unto them that turn away the battle to the gate. [That is, God still also gave unto his people valiant champions, to sight against their enemies, and to beat and drive them back to the very gates of their enemies. When men are able to beat and chase their enemies unto and into their own gates, and are able to make them keep in, and not stir out, then those that beat or chase them in save their own borders.]"}],"7":[{"catchword":null,"tekst":"And also these [To wit, many among the Jews, or of the tribe of Juda] do erre through wine, [or, in wine. That is, they have so wholly given themselves to drunkenness, and to carnal pleasures and delights, that they are almost bereaved of all their wit. This maybe also understood of spiritual drunkenness, whereby men be drowned in sin and wickedness, as below chap.29.9. See Prov.20.on verse.1.] and they go astray through strong drink: the Priest [or, Prince, Ruler. See Genes.41.on verse 45.] and the Prophet [to wit, the false Prophets, as below chap.29.10.] erre through strong drink; they are swallowed up of wine, [the meaning is, as they have taken in or swallow and destroy them] they go astray through strong drink, they erre in vision, [that is, the Priests erre in expounding the prophesies, they wrest and turn them as they lift, and after their own pleasures and fancies] they stagger in judgement. [Or, stumble in judging.]"}],"8":[{"catchword":null,"tekst":"For all tables are full of vomit [Or, are filled with spuming] (and) dung, [or, filthiness] so that there is no place (clean.) [Understand withal, but all places are be spitted and bespawled or defiled. Or so that there is no place more; to wit, which is not polluted or defiled.]"}],"9":[{"catchword":null,"tekst":"Whom should he [To wit, the Lord by his Prophets] (then) teach knowledge? [to wit, the knowledge of necessary things, or, of things worthy to be known] and whom should he make to understand the thing that is heard? [Heb. Hearing. The meaning is, that which I Isaiah have heard of the Lord. Or praying. See below chap.53.1.] them that are weaned from the milk? Them that are drown from the beasts? [the Prophet doth intimate, that they are altogether so full of wind, as that they are like unto little children, that are uncapable of instruction.]"}],"10":[{"catchword":null,"tekst":"For it is precept upon precept, precept upon precept, line upon line, line upon line, here a little, there a little. [These are the words of God by the mouth of the Prophet, and this is the meaning of them: one precept or commandment is given after another, and yet it doth not avail: for they are children in understanding, both old and young.]"}],"11":[{"catchword":null,"tekst":"Therefore by ridiculous lips and by another tongue shall he speak unto this people. [The meaning is, forasmuch as this people would not suffer themselves to be instructed by the plain word of God, therefore he will deal with them after another manner, cause them to be spoken to in an unknown language, for a punishment of their unthankfulness and obstinacy. See 1 Cor.14.21. and below chap.33.19. (with credulous lips, and &c.) That is, with strange languages, or tongues; for men do use to laugh at them whom they do not understand. Others, by ridiculousness of lips. The meaning of these words of God, as also of the next following, is, that he would visit them with foreign or outlandish enemies and armies, whose language they should not understand.]"} function refUrl(ref) {

}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;

const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}

}

    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
