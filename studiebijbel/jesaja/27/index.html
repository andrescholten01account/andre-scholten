:"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Op die dag zal de HEERE met Zijn hard, groot en sterk zwaard de Leviathan bezoeken, de langwemelende slang, ja, de Leviathan, de kromme slomme slang; en Hij zal de draak die in de zee is, doden.","2":"Op die dag zal er een wijngaard van rode wijn zijn; zing daarvan bij beurte.","3":"Ik, de HEERE, behoed die, elk ogenblik zal Ik hem bevochtigen; opdat *de* *vijand* hem niet bezoekt, zal Ik hem bewaren, nacht en dag.","4":"Grimmigheid is bij Mij niet; wie zou Mij *als* een doorn *en* distel in oorlog willen zetten, zodat Ik tegen hem zou aanvallen, *en* hem tegelijk zou verbranden?","5":"Of hij moest Mijn sterkte aangrijpen, dan zal hij vrede met Mij maken; vrede zal hij met Mij maken.","6":"In de toekomst zal Jakob wortelen schieten, Israël zal bloeien en groeien; en zij zullen de wereld met inkomsten vervullen.","7":"Heeft Hij hem geslagen, zoals Hij hen geslagen heeft die hem sloegen? Is hij gedood, zoals zijn gedoden gedood zijn geworden?","8":"Met mate hebt U met hem getwist, toen U hem wegstootte; *toen* Hij *hem* wegnam door Zijn harde wind, op de dag van de oostenwind.","9":"Daarom zal daardoor de ongerechtigheid van Jakob verzoend worden, en dit is de hele vrucht, dat Hij zijn zonde zal wegdoen: wanneer Hij alle stenen van het altaar maakt als verstrooide kalkstenen, zullen de bossen[1] en de zonnebeelden[2] niet blijven bestaan.","10":"Want de versterkte stad zal eenzaam zijn, de woonplaats zal verstoten en verlaten worden, als een woestijn; daar zullen de kalveren weiden, en daar zullen ze neerliggen, en zullen haar takken opeten.","11":"Als haar takken verdord zijn, zullen ze afgebroken worden, *en* de vrouwen zullen komen en ze aansteken; want het is een volk zonder enig verstand; daarom zal Hij, Die het gemaakt heeft, Zich niet over hen ontfermen, en Die het geformeerd heeft, zal hun geen genade bewijzen.","12":"En het zal op die dag gebeuren, dat de HEERE zal dorsen, van de stroom van de rivier af tot aan de rivier van Egypte; maar u zult opgeraapt worden, één voor één, o kinderen van Israël!","13":"En het zal op die dag gebeuren, dat er met een grote bazuin geblazen zal worden; dan zullen zij komen die verloren dreigden te gaan in het land van Assur, en de weggejaagden in het land van Egypte; en zij zullen de HEERE aanbidden op de heilige berg te Jeruzalem."},"SV":{"1":"Te dien dage zal de HEERE met Zijn hard, en groot, en sterk zwaard bezoeken den Leviathan, de langwemelende slang, ja, den Leviathan, de kromme slomme slang; en Hij zal den draak, die in de zee is, doden.","2":"Te dien dage zal er een wijngaard van roden wijn zijn; zingt van denzelven bij beurte.","3":"Ik, de HEERE, behoede dien, alle ogenblik zal Ik hem bevochtigen; opdat *de* *vijand* hem niet bezoeke, zal Ik hem bewaren nacht en dag.","4":"Grimmigheid is bij Mij niet; wie zou Mij *als* een doorn *en* distel in oorlog stellen, dat Ik tegen hem zou aanvallen, *en* hem te gelijk verbranden zou?","5":"Of hij moest Mijn sterkte aangrijpen, hij zal vrede met Mij maken; vrede zal hij met Mij maken.","6":"In het toekomende zal Jakob wortelen schieten, Israël zal bloeien en groeien; en zij zullen de wereld met inkomsten vervullen.","7":"Heeft Hij hem geslagen, gelijk Hij dien geslagen heeft, die hem sloeg? Is hij gedood, gelijk zijn gedoden gedood zijn geworden?","8":"Met mate hebt Gij met hem getwist, wanneer Gij hem wegstiet; *als* Hij *hem* wegnam door Zijn harden wind, in den dag des oostenwinds.","9":"Daarom zal daardoor de ongerechtigheid van Jakob verzoend worden, en dit is de ganse vrucht, dat Hij deszelfs zonde zal wegdoen, wanneer Hij al de stenen des altaars maken zal als verstrooide kalkstenen, de bossen en de zonnebeelden zullen niet bestaan.","10":"Want de vaste stad zal eenzaam, de woonstede zal verstoten en verlaten worden, gelijk een woestijn; daar zullen de kalveren weiden, en daar zullen zij nederliggen, en zullen haar takken verslinden.","11":"Als haar takken verdord zullen zijn, zullen zij afgebroken worden, *en* de vrouwen, komende, zullen ze aansteken; want het is geen volk van enig verstand; daarom zal Hij, Die het gemaakt heeft, Zich deszelven niet ontfermen, en Die het geformeerd heeft, zal aan hetzelve geen genade bewijzen.","12":"En het zal te dien dage geschieden, dat de HEERE dorsen zal, van den stroom der rivier af tot aan de rivier van Egypte; doch gijlieden zult opgelezen worden, een bij een, o gij kinderen Israëls!","13":"En het zal te dien dage geschieden, dat er met een grote bazuin geblazen zal worden; dan zullen die komen, die in het land van Assur verloren zijn, en de heengedrevenen in het land van Egypte; en zij zullen den HEERE aanbidden op den heiligen berg te Jeruzalem."},"KJV":{"1":"In that day the LORD with his sore and great and strong sword shall punish leviathan the piercing serpent, even leviathan that crooked serpent; and he shall slay the dragon that *is* in the sea.","2":"In that day sing ye unto her, A vineyard of red wine.","3":"I the LORD do keep it; I will water it every moment: lest *any* hurt it, I will keep it night and day.","4":"Fury *is* not in me: who would set the briers *and* thorns against me in battle? I would go through them, I would burn them together.","5":"Or let him take hold of my strength, *that* he may make peace with me; *and* he shall make peace","6":"He shall cause them that come of Jacob to take root: Israel shall blossom and bud, and fill the face of the world with fruit.","7":"Hath he smitten him, as he smote those that smote him? *or* is he slain according to the slaughter of them that are slain","8":"In measure, when it shooteth forth, thou wilt debate with it: he stayeth his rough wind in the day of the east wind.","9":"By this therefore shall the iniquity of Jacob be purged; and this *is* all the fruit to take away his sin; when he maketh all the stones of the altar as chalkstones that are beaten in sunder, the groves and images shall not stand up.","10":"Yet the defenced city *shall be* desolate, *and* the habitation forsaken, and left like a wilderness: there shall the calf feed, and there shall he lie down, and consume the branches","11":"When the boughs thereof are withered, they shall be broken off: the women come, *and* set them on fire: for it *is* a people of no understanding: therefore he that made them will not have mercy on them, and he that formed them will shew them no favour.","12":"And it shall come to pass in that day, *that* the LORD shall beat off from the channel of the river unto the stream of Egypt, and ye shall be gathered one by one, O ye children of Israel.","13":"And it shall come to pass in that day, *that* the great trumpet shall be blown, and they shall come which were ready to perish in the land of Assyria, and the outcasts in the land of Egypt, and shall worship the LORD in the holy mount at Jerusalem."}},"tsk":{"1":[{"kopje":"die dag","refs":["Jes 26:21"]},{"kopje":"Zijn hard","refs":["Jes 34:5","Jes 34:6","Jes 66:16","Deut 32:41","Deut 32:42","Job 40:14","Ps 45:4","Jer 47:6","Openb 2:16","Openb 19:21"]},{"kopje":"Leviathan","refs":["Job 12:1-25","Ps 74:14","Ps 104:26"]},{"kopje":"kromme","refs":["Jes 65:25","Job 26:13"]},{"kopje":"de draak","refs":["Jes 51:9","Ps 74:13","Ps 74:14","Jer 51:34","Ezech 29:3","Ezech 32:2-5","Openb 12:3-17","Openb 13:2","Openb 13:4","Openb 13:11","Openb 16:13","Openb 20:2"]},{"kopje":"in de zee","refs":["Jer 51:13","Openb 12:18","Openb 17:1","Openb 17:15"]}],"2":[{"kopje":"zing","refs":["Jes 5:1-7","Num 21:17"]},{"kopje":"een wijngaard","refs":["Ps 80:9-20","Jer 2:21","Matt 21:33-46","Luk 20:9-18"]}],"3":[{"kopje":"Ik, de HEERE","refs" ata-code=\"H6524\">bud,</span> and <span class=\"wl wl-kjv\" data-code=\"H4390\">fill</span> the <span class=\"wl wl-kjv\" data-code=\"H6440\">face</span> of the <span class=\"wl wl-kjv\" data-code=\"H8398\">world</span> with fruit.","7":"Hath he <span class=\"wl wl-kjv\" data-code=\"H5221\">smitten</span> him, as he <span class=\"wl wl-kjv\" data-code=\"H4347\">smote</span> those that <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> him? or is he <span class=\"wl wl-kjv\" data-code=\"H2026\">slain</span> according to the <span class=\"wl wl-kjv\" data-code=\"H2027\">slaughter</span> of them that are slain","8":"In <span class=\"wl wl-kjv\" data-code=\"H5432\">measure,</span> when it shooteth <span class=\"wl wl-kjv\" data-code=\"H7971\">forth,</span> thou wilt <span class=\"wl wl-kjv\" data-code=\"H7378\">debate</span> with it: he <span class=\"wl wl-kjv\" data-code=\"H1898\">stayeth</span> his <span class=\"wl wl-kjv\" data-code=\"H7186\">rough</span> <span class=\"wl wl-kjv\" data-code=\"H7307\">wind</span> in the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of the east wind.","9":"By <span class=\"wl wl-kjv\" data-code=\"H2063\">this</span> therefore shall the <span class=\"wl wl-kjv\" data-code=\"H5771\">iniquity</span> of <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> be <span class=\"wl wl-kjv\" data-code=\"H3722\">purged;</span> and this is all the <span class=\"wl wl-kjv\" data-code=\"H6529\">fruit</span> to take <span class=\"wl wl-kjv\" data-code=\"H5493\">away</span> his <span class=\"wl wl-kjv\" data-code=\"H2403\">sin;</span> when he <span class=\"wl wl-kjv\" data-code=\"H7760\">maketh</span> all the <span class=\"wl wl-kjv\" data-code=\"H68\">stones</span> of the <span class=\"wl wl-kjv\" data-code=\"H4196\">altar</span> as <span class=\"wl wl-kjv\" data-code=\"H1615\">chalkstones</span> that are beaten in <span class=\"wl wl-kjv\" data-code=\"H5310\">sunder,</span> the <span class=\"wl wl-kjv\" data-code=\"H842\">groves</span> and <span class=\"wl wl-kjv\" data-code=\"H2553\">images</span> shall not stand up.","10":"Yet the <span class=\"wl wl-kjv\" data-code=\"H1219\">defenced</span> <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> shall be <span class=\"wl wl-kjv\" data-code=\"H910\">desolate,</span> and the <span class=\"wl wl-kjv\" data-code=\"H5116\">habitation</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">forsaken,</span> and <span class=\"wl wl-kjv\" data-code=\"H5800\">left</span> like a <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness:</span> there shall the <span class=\"wl wl-kjv\" data-code=\"H5695\">calf</span> <span class=\"wl wl-kjv\" data-code=\"H7462\">feed,</span> and there shall he lie <span class=\"wl wl-kjv\" data-code=\"H7257\">down,</span> and <span class=\"wl wl-kjv\" data-code=\"H3615\">consume</span> the branches","11":"When the <span class=\"wl wl-kjv\" data-code=\"H7105\">boughs</span> thereof are <span class=\"wl wl-kjv\" data-code=\"H3001\">withered,</span> they shall be broken <span class=\"wl wl-kjv\" data-code=\"H7665\">off:</span> the <span class=\"wl wl-kjv\" data-code=\"H802\">women</span> <span class=\"wl wl-kjv\" data-code=\"H935\">come,</span> and set them on <span class=\"wl wl-kjv\" data-code=\"H215\">fire:</span> for it is a <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> of no <span class=\"wl wl-kjv\" data-code=\"H998\">understanding:</span> therefore he that <span class=\"wl wl-kjv\" data-code=\"H6213\">made</span> them will not have <span class=\"wl wl-kjv\" data-code=\"H7355\">mercy</span> on them, and he that <span class=\"wl wl-kjv\" data-code=\"H3335\">formed</span> them will shew them no favour.","12":"And it shall come to pass in that <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> that the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall beat <span class=\"wl wl-kjv\" data-code=\"H2251\">off</span> from the <span class=\"wl wl-kjv\" data-code=\"H7641\">channel</span> of the <span class=\"wl wl-kjv\" data-code=\"H5104\">river</span> unto the <span class=\"wl wl-kjv\" data-code=\"H5158\">stream</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> and ye shall be <span class=\"wl wl-kjv\" data-code=\"H3950\">gathered</span> <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> by <span class=\"wl wl-kjv\" data-code=\"H259\">one,</span> O ye <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of Israel.","13":"And it shall come to pass in that <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> that the <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H7782\">trumpet</span> shall be <span class=\"wl wl-kjv\" data-code=\"H8628\">blown,</span> and they shall <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> which were ready to <span class=\"wl wl-kjv\" data-code=\"H6\">perish</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H804\">Assyria,</span> and the <span class=\"wl wl-kjv\" data-code=\"H5080\">outcasts</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> and shall <span class=\"wl wl-kjv\" data-code=\"H7812\">worship</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> in the <span class=\"wl wl-kjv\" data-code=\"H6944\">holy</span> <span class=\"wl wl-kjv\" data-code=\"H2022\">mount</span> at Jerusalem."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"dien dage","tekst":"Te weten, als God zijn volk uit de Babylonische gevangenschap verlossen zal."},{"catchword":"met Zijn hard,","tekst":"Dat is, door de Perzen en Meden; Isa 13:17 , en Isa 21:2 ."},{"catchword":"bezoeken","tekst":"Dat is, straffen, verdelgen; zie Gen 21:1 ."},{"catchword":"den Leviathan,","tekst":"Hierbij verstaan enigen den koning te Babel, listig als een slang, vergiftig of schadelijk als een draak. Anderen verstaan ook hier door leviathan den duivel, den antichrist en alle zo geestelijke als lichamelijke vijanden der kerk Gods. Zie breder van het woord leviathan Job 40:20 , en Psa 74:14 ."},{"catchword":"langwemelende slang,","tekst":"Zie Job 26:13 , met de aantekening."},{"catchword":"draak,","tekst":"Of, de zeedraak."}],"2":[{"catchword":"een wijngaard","tekst":"De rode wijn werd in het Joodse land voor den besten en sterksten wijn gehouden. Zie Gen 49:12 ; Pro 23:31 . Doch de woorden van dit vs. zijn te verstaan van de gemeente der gelovigen, die voortreffelijke vruchten der godzaligheid dragen zou. Van de geestelijke betekenis des wijngaards, zie de aantekening Isa 5:1 ."},{"catchword":"zingt","tekst":"Het Hebreeuwse woord betekent eigenlijk antwoorden, gelijk Exo 15:21 ; zie de aantekening aldaar. Het betekent ook bij beurten zingen in de reien als anderszins, 1Sa 18:7 ; alsook hier en elders meer. Het is hier ene vermaning aan alle godzaligen, dat zij zich verblijden vanwege hunne verlossing door Jezus Christus."}],"3":[{"catchword":"hem niet","tekst":"Dat is, hem beschadigen; zie Gen 21:1 ."}],"4":[{"catchword":"Grimmigheid","tekst":"Dit spreekt de profeet in den persoon Gods, alsof hij zeide: Ik ben nu met mijn volk ganselijk verzoend, om Christus' wil. Zodat niemand mij wederom tot toorn tegen hetzelve alzo ontstoken zal, dat Ik, daartegen oorlogende, hetzelve als een distel en doorn zou worden, of hetzelve verbranden zou. O dat zij verre van mij. Sommigen verstaan dat God, gesproken hebbende van zijne liefde tot de kerk, hier nu spreekt van zijne toorn en de straffen der vijanden: het is zaak dat zij zich oprecht tot hem bekeren, en zetten het aldus over: Zo wie mij [als] een doorn en distel in oorlog zal stellen, Ik zal tegen hem aanvallen, Ik zal hem tegelijk verbranden; of hij moest mijne sterkte aangrijpen, hij moest vrede met mij maken, enz."},{"catchword":"tegen hem","tekst":"Te weten tegen mijnen wijngaard."}],"5":[{"catchword":"Of hij moest","tekst":"Anders: of hij mijne sterkte aangreep? Te weten, den wijnstok, dat is, mijn volk, de kerk."},{"catchword":"aangrijpen,","tekst":"Dat is, hij zal zich vasthouden aan mijne sterkte, hij zal er zich op verlaten en rusten, te weten met berouw over zijne zonden, verbetering des levens en door een vast geloof."}],"6":[{"catchword":"In de toekomende","tekst":"Anders: O gij nakomelingen, Jakob zal wortelen schieten. Anders: Aangaande de nakomelingen, Jakob zal wortelen schieten; dat is, de kerk van God zal vaststaan, groeien en bloeien."},{"catchword":"Jakob","tekst":"Dat is, de nakomelingen van Jakob."},{"catchword":"zij zullen","tekst":"Te weten, de nakomelingen van Jakob, of Israël."},{"catchword":"inkomsten","tekst":"Of, vruchten."}],"7":[{"catchword":"Hij","tekst":"Te weten de Heere."},{"catchword":"hem geslagen,","tekst":"Te weten Jakob, dat is, het volk van God."},{"catchword":"gelijk","tekst":"Dat is, zo hard."},{"catchword":"dien","tekst":"Hebreeuws, gelijk Hij zijnen, [te weten, Jakobs] slager, [te weten, den Babyloniër] geslagen heeft?"},{"catchword":"hij gedood,","tekst":"Te weten Jakob."},{"catchword":"zijn gedoden","tekst":"Te weten, van den koning van Babel. Anders: [zijne gedoden] te weten, van God, die God in zijn toorn gedood heeft. De zin is: Dat God veel genadiger met zijn volk handelt als Hij het kastijdt, dan Hij met de vijanden zijns volks omgaat."}],"8":[{"catchword":"Met mate","tekst":"Zie van het Hebreeuwse woord Gen 18:6 ."},{"catchword":"Gij","tekst":"O Heere."},{"catchword":"met hem","tekst":"Met uw wijnstok, met uw volk."},{"catchword":"wegstiet;","tekst":"Te weten door de Babyloniërs. Hij spreekt van een zaak, die nog geschieden zou, alsof zij alrede geschied ware. Anders: Toen hem de [vijand] wegnam door zijn harden wind; dat is, door den krijg, of andere zware plagen."},{"catchword":"Hij hem","tekst":"Te weten de Heere. De profeet verandert den persoon, hetwelk wat duisterheid in zijne rede veroorzaakt."},{"catchword":"des oostenwinds","tekst":"Dat is, der vijanden, van wie een groot deel uit het oosten kwam, en het was een hard en wreed volk, gelijk de oostenwind in die landen een harde, scherpe, schadelijke wind is. Zie Job 15:2 ; Psa 48:8 ; en Hos 12:2 ."}],"9":[{"catchword":"daardoor","tekst":"Te weten door zulke straffen en vaderlijke kastijdingen, als daar is de Babylonische gevangenschap."},{"catchword":"verzoend worden,","tekst":"Te dien aanzien dat de uitverkorenen daardoor tot berouw en leedwezen over hunne zonden zullen gebracht worden en tot verbetering van hun leven; en alzo zouden zij vergeving van hunne zonden verkrijgen door een oprecht geloof aan Jezus Christus."},{"catchword":"vrucht,","tekst":"Te weten die van de Babylonische gevangenschap komen zal."},{"catchword":"Hij","tekst":"Te weten God de Heere."},{"catchword":"deszelfs","tekst":"Te weten Jakob."},{"catchword":"des altaars","tekst":"Versta dat hier gesproken wordt van de stenen dier altaren, die hier en daar op de hoogten gesticht waren, ter ere der afgoden."},{"catchword":"maken zal","tekst":"De zin is: Nadat Hij al de afgoderij, die een oorsprong is van alle andere zonden, zal weggedaan hebben."},{"catchword":"de","tekst":"Anders: als er geen bossen of zonnebeelden zullen staande gebleven zijn; versta hierbij, maar deze al tezamen zullen afgehouwen en verbroken zijn."},{"catchword":"bossen","tekst":"Van de afgodische bossen, zie Jdg 3:7 ."},{"catchword":"de zonnebeelden","tekst":"Zie de aantekening Lev 26:30 ."}],"10":[{"catchword":"Want","tekst":"Hier keert de profeet wederom tot de beschrijving der straffen met welke God de Heere die van Juda tehuis zoeken zou."},{"catchword":"de vaste stad","tekst":"Te weten, Jeruzalem; zie Isa 22:2 , en Isa 24:10 ; Eze 21 ."},{"catchword":"woonstede","tekst":"Of, woningen."},{"catchword":"haar takken","tekst":"Versta, de takken, die in haar [te weten in de stad Jeruzalem] wassen zullen aan de bomen, die in haar verlaten huizen en op hare straten, in hare hoven en tuinen, vanzelf zouden opschieten en wassen; zie de aantekening Job 18:16 ."}],"11":[{"catchword":"aansteken;","tekst":"Te weten, de takken, of de stad."},{"catchword":"volk","tekst":"Versta, het Joodse volk, bij hetwelk nu geen verstand was te zoeken of te vinden."},{"catchword":"Die het gemaakt heeft,","tekst":"Dat is, God de Heere. Hebreeuws, hun Maker."},{"catchword":"Zich deszelven","tekst":"Versta hierbij, maar Hij zal hen verdelgen; te weten door de Babyloniërs, g elijk straks volgt, vs.12."},{"catchword":"Die het geformeerd heeft,","tekst":"Hebreeuws, hun formeerder."}],"12":[{"catchword":"te dien dage","tekst":"Te weten, als het Joodse volk in de Babylonische gevangenschap zijn zal."},{"catchword":"dorsen zal,","tekst":"Hebreeuws, uitslaan, of uitkloppen zal. Vergelijk onder Isa 28:27 , alwaar dorsen en uitslaan onderscheiden worden, maar hier wordt het woord dorsen duidelijkheidshalve gebruikt."},{"catchword":"van den","tekst":"Anders: van den ruisenden stroom. Anders: van den grond. Anders: van het kanaal der rivier."},{"catchword":"stroom","tekst":"Dat is, van de rivier Eufraat af tot de rivier van Egypte toe, genaamd Sichor; zie Jos 13:3 ."},{"catchword":"doch gijlieden","tekst":"De zin is: Nadat gijlieden een tijdlang hier en daar zult zijn verstrooid geweest, zult gij weder in uw land gebracht en bijeen verzameld worden, gelijk men de aren op het veld in den oogst naleest, of opleest."},{"catchword":"een bij een,","tekst":"Of, tot een toe, of een voor een, elk in het bijzonder."}],"13":[{"catchword":"een grote bazuin","tekst":"Versta door deze grote bazuin, vooreerst, het edict en openbare toelating van den koning Cyrus, die den Joden heeft toegelaten wederom in hun vaderland te komen; 2Ch 36:22 ; Ezr 1:1 ; ten andere, geestelijkerwijze van den bazuin des Evangelies, door welke God zich een kerk samengeroepen en verzameld heeft uit alle volken en natiën der wereld."},{"catchword":"die komen,","tekst":"Zij zullen in hun vaderland, in het Joodse land, wederkomen."},{"catchword":"die in het land","tekst":"Dat is, de gevangenen der tien stammen van het koninkrijk van Israël."},{"catchword":"verloren zijn,","tekst":"Dat is, die ginds en weer omdwalen."},{"catchword":"in het land van Egypte","tekst":"Daarheen waren de overgeblevenen van den stam van Juda gevlucht; 2Ki 25:26 ."},{"catchword":"zij zullen","tekst":"Zie de aantekening Gen 24:27 ."},{"catchword":"op den heiligen berg","tekst":"Hebreeuws, op den berg der heiligheid; te weten in den nieuw herbouwden tempel, en voortaan in uw heilige en Christelijke gemeente."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"In the day [To wit, when God shall deliver his people out of the babylonish captivity] the LORD with his hard, and great, and strong sword [that is, by the Persians and Medes, above chap.13.17. and 21.2.] shall visit [that is, punish, destroy. See Genes.21.on vers.1.] the Leviathan, the long-winding serpent, See Job 26:13. with the Annotat.] yea the Leviathan, the crooked serpent: and he shall slay the dragon that is in the sea. [Or, the sea-dragon. [By the Leviathan here some do understand the King of Babel, who was crafty or subtle like a serpent, venomous or hurtful like a dragon. Others do also here understand by the Leviathan, the devil, Antichrist, and all both spiritual and corporal enemies of the Church of God. See further of the word Leviathan, Job chap.40.on ver.20. and Psal.74.14.]"}],"2":[{"catchword":null,"tekst":"In that day there shall be a vineyard of red wine, [Red wine was held in the land of Juda to be the best and strongest wine. See Gen 49:12. Pro 23:31. But the words of this verse are to be understood of the church of Believers, which should bring forth precious fruits of piety. Of the spiritual signification of the vineyard, see above chap.5. the Annotat. On verse 1.] sing of it by turns [the Hebrew word singing signifieth properly answering, as Exo 15:21. See the Annotat. There. It signifieth also to sing by turns in the dancer, as other ways; // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
