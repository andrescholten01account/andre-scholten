l":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Daal af en ga zitten in het stof, jonkvrouw, dochter van Babel! Zit op de aarde, er is geen troon *meer*, dochter van de Chaldeeën! Want u zult niet meer genoemd worden de tedere, of de wellustige.","2":"Neem de molen en maal meel; ontdek uw vlechten, ontbloot de enkels, ontdek de schenkels, ga door de rivieren.","3":"Uw schaamte zal ontdekt worden, ook zal uw schande gezien worden; Ik zal wraak nemen, en Ik zal *u* niet aanvallen *als* een mens.","4":"Onze Verlossers Naam is HEERE van de heerscharen[1], de Heilige van Israël.","5":"Zit zwijgend, en ga in de duisternis, dochter van de Chaldeeën! Want u zult niet meer genoemd worden koningin van de koninkrijken.","6":"Ik was op Mijn volk zeer toornig, Ik ontheiligde Mijn erfdeel, en Ik gaf hen over in uw hand; *toch* bewees u hun geen barmhartigheid, *ja*, *zelfs* over de oude maakte u uw juk zeer zwaar.","7":"En u zei: Ik zal koningin zijn in eeuwigheid; tot nog toe hebt u deze dingen niet in uw hart genomen, u hebt aan het einde daarvan niet gedacht.","8":"Nu dan, hoor dit, weelderige! Die zo zeker woont, die in haar hart zegt: Ik ben het, en niemand meer dan ik: ik zal geen weduwe zitten, en de beroving van kinderen niet kennen.","9":"Toch zullen deze beide dingen u in een ogenblik overkomen, op één dag, de beroving van kinderen en weduwschap; volkomen zullen zij u overkomen, vanwege de veelheid van uw toverijen, vanwege de grote menigte van uw bezweringen.","10":"Want u hebt op uw boosheid vertrouwd; u hebt gezegd: Niemand ziet mij; uw wijsheid en uw kennis heeft u afkerig gemaakt; en u hebt in uw hart gezegd: Ik ben het, en niemand meer dan ik.","11":"Daarom zal er over u een kwaad komen, u zult de dageraad daarvan niet weten; en een verderf zal er op u vallen, dat u niet zult kunnen verzoenen; want er zal snel een onstuimige verwoesting over u komen, zodat u het niet weten zult.","12":"Sta nu met uw bezweringen, en met de veelheid van uw toverijen, waarin u gearbeid hebt van uw jeugd af; misschien kunt u voordeel doen, misschien kunt u zich sterken.","13":"U bent moe geworden van de veelheid van uw raadslagen; laat nu opstaan die de hemel waarnemen, die naar de sterren kijken, die naar de nieuwe manen voorzeggen; en laat ze u verlossen van die dingen die over u komen zullen.","14":"Zie, zij zullen zijn als stoppels, het vuur zal ze verbranden, zij zullen zichzelf niet kunnen rukken uit de macht van de vlam; het zal geen kool zijn om *bij* te warmen, *geen* vuur om daarvoor bij neer te zitten.","15":"Zo zullen zij u zijn, met wie u gearbeid hebt, uw handelaars van uw jeugd af aan; ieder zal zijns weegs dwalen, niemand zal u verlossen."},"SV":{"1":"Daal af, en zit in het stof, gij jonkvrouw, dochter van Babel! zit op de aarde, er is geen troon *meer*, gij dochter der Chaldeen! want gij zult niet meer genaamd worden de tedere, noch de wellustige.","2":"Neem de molen, en maal meel; ontdek uw vlechten, ontbloot de enkelen, ontdek de schenkelen, ga door de rivieren.","3":"Uw schaamte zal ontdekt worden, ook zal uw schande gezien worden; Ik zal wraak nemen, en Ik zal *op* *u* niet aanvallen *als* een mens.","4":"Onzes Verlossers Naam is HEERE der heirscharen, de Heilige Israëls.","5":"Zit stilzwijgende, en ga in de duisternis, gij dochter der Chaldeen! want gij zult niet meer genoemd worden koningin der koninkrijken.","6":"Ik was op Mijn volk zeer toornig, Ik ontheiligde Mijn erve, en Ik gaf hen over in uw hand; *doch* gij beweest hun geen barmhartigheden, *ja*, *zelfs* over den oude maaktet gij uw juk zeer zwaar.","7":"En gij zeidet: Ik zal koningin zijn in eeuwigheid; tot nog toe hebt gij deze dingen niet in uw hart genomen, gij hebt aan het einde daarvan niet gedacht.","8":"Nu dan, hoor dit, gij weelderige! die zo zeker woont, die in haar hart zegt: Ik ben het, en niemand meer dan ik: ik zal geen weduwe zitten, noch de beroving van kinderen kennen.","9":"Doch deze beide dingen zullen u in een ogenblik overkomen, op een dag, de beroving van kinderen en weduwschap; volkomenlijk zullen zij u overkomen, vanwege de veelheid uwer toverijen, vanwege de menigte uwer bezweringen.","10":"Want gij hebt op uw boosheid vertrouwd; gij hebt gezegd: Niemand ziet mij; uw wijsheid en uw wetenschap heeft u afkerig gemaakt; en gij hebt in uw hart gezegd: Ik ben het, en niemand meer dan ik.","11":"Daarom zal er over u een kwaad komen, gij zult den dageraad daarvan niet weten; en een verderf zal er op u vallen, hetwelk gij niet zult kunnen verzoenen; want er zal snellijk een onstuimige verwoesting over u komen, dat gij het niet weten zult.","12":"Sta nu met uw bezweringen, en met de veelheid uwer toverijen, waarin gij gearbeid hebt van uw jeugd af; of gij misschien voordeel kondet doen, of gij misschien u *kondet* sterken.","13":"Gij zijt moede geworden in de veelheid uwer raadslagen; laat nu opstaan, die den hemel waarnemen, die in de sterren kijken, die naar de nieuwe manen voorzeggen; en laat ze u verlossen van die dingen, die over u komen zullen.","14":"Ziet, zij zullen zijn als stoppelen, het vuur zal ze verbranden, zij zullen zichzelven niet kunnen rukken uit de macht der vlam; het zal geen kool zijn om *bij* te warmen, *geen* vuur om daarvoor neder te zitten.","15":"Alzo zullen zij u zijn, met dewelke gij gearbeid hebt, uw handelaars van uw jeugd aan, elk zal zijns weegs dwalen, niemand zal u verlossen."},"KJV":{"1":"Come down, and sit in the dust, O virgin daughter of Babylon, sit on the ground: *there is* no throne, O daughter of the Chaldeans: for thou shalt no more be called tender and delicate.","2":"Take the millstones, and grind meal: uncover thy locks, make bare the leg, uncover the thigh, pass over the rivers.","3":"Thy nakedness shall be uncovered, yea, thy shame shall be seen: I will take vengeance, and I will not meet *thee as* a man.","4":"*As for* our redeemer, the LORD of hosts *is* his name, the Holy One of Israel.","5":"Sit thou silent, and get thee into darkness, O daughter of the Chaldeans: for thou shalt no more be called, The lady of kingdoms.","6":"I was wroth with my people, I have polluted mine inheritance, and given them into thine hand: thou didst shew them no mercy; upon the ancient hast thou very heavily laid thy yoke.","7":"And thou saidst, I shall be a lady for ever: *so* that thou didst not lay these *things* to thy heart, neither didst remember the latter end","8":"Therefore hear now this, *thou that art* given to pleasures, that dwellest carelessly, that sayest in thine heart, I *am*, and none else beside me; I shall not sit *as* a widow, neither shall I know the loss of children:","9":"But these two *things* shall come to thee in a moment in one day, the loss of children, and widowhood: they shall come upon thee in their perfection for the multitude of thy sorceries, *and* for the great abundance of thine enchantments.","10":"For thou hast trusted in thy wickedness: thou hast said, None seeth me. Thy wisdom and thy knowledge, it hath perverted thee; and thou hast said in thine heart, I *am*, and none else","11":"Therefore shall evil come upon thee; thou shalt not know from whence it riseth: and mischief shall fall upon thee; thou shalt not be able to put it off: and desolation shall come upon thee suddenly, *which* thou shalt not know.","12":"Stand now with thine enchantments, and with the multitude of thy sorceries, wherein thou hast laboured from thy youth; if so be thou shalt be able to profit, if so be thou mayest prevail.","13":"Thou art wearied in the multitude of thy counsels. Let now the astrologers, the stargazers, the monthly prognosticators, stand up, and save thee from *these things* that shall come","14":"Behold, they shall be as stubble; the fire shall burn them; they shall not deliver themselves from the power of the flame: *there shall* not *be* a coal to warm at, *nor* fire to sit","15":"Thus shall they be unto thee with whom thou hast laboured, *even* thy merchants, from thy youth: they shall wander every one to his quarter; none shall save"}},"tsk":{"1":[{"kopje":"Daal af","refs":["Jes 3:26","Jes 26:5","Jes 52:2","Job 2:8","Job 2:13","Ps 18:28","Jer 13:18","Jer 48:18","Klaagl 2:10","Klaagl 2:21","Ezech 26:16","Ezech 28:17","Obadja 1:3","Obadja 1:4","Jona 3:6"]},{"kopje":"jonkvrouw","refs":["Jes 37:22","Jer 46:11"]},{"kopje":"dochter","refs":["Ps 137:8","Jer 50:42","Jer 51:33","Zach 2:7"]},{"kopje":"er is","refs":["Jes 14:13","Jes 14:14","Ps 89:45","Hagg 2:23"]},{"kopje":"u zult","refs":["Jes 47:7-9","Jes 32:9-11","Deut 28:56","Deut 28:57","Klaagl 4:5","Openb 18:7"]}],"2":[{"kopje":"de molen","refs":["Ex 11:5","Richt 16:21","Job 31:10","Jer 27:7","Klaagl 5:13","Matt 24:41","Luk 17:35"]},{"kopje":"ontbloot","refs":["Jes 3:17","Jes 20:4","Jer 13:22","Jer 13:26","Ezech 16:37-39","Hos 2:2","Micha 1:11","Nahum 3:5","Nahum 3:6"]}],"3":[{"kopje":"Ik zal wraak nemen","refs":["Jes 34:1-8","Jes 59:17","Jes 59:18","Jes 63:4-6","Deut 32:35","Deut 32:41-43","Ps 94:1","Ps 94:2","Ps 137:8","Ps 137:9","Jer 13:22","Jer 13:26","Jer 50:27","Jer 50:28","Jer 51:4","Jer 51:11","Jer 51:20-24","Jer 51:34-36","Jer 51:56","Rom 12:19","Hebr 10:30","Hebr 10:31","Nahum 3:5","Openb 6:9","Openb 6:10","Openb 16:19","Openb 18:5-8","Openb 18:20"]}],"4":[{"kopje":"Verlossers","refs":["Jes 41:14","Jes 43:3","Jes 43:14","Jes 44:6","Jes 49:26","Jes 54:5","Jer 31:11","Jer 50:33","Jer 50:34"]}],"5":[{"kopje":"zwijgend","refs":["Jes 13:20","Jes 14:23","1 Sam 2:9","Ps 31:18","Ps 46:11","Jer 25:10","Klaagl 1:1","Hab 2:20","Zach 2:13","Matt 22:12","Matt 22:13","Judas 1:13","Openb 18:21-24"]},{"kopje":"Want","refs":["Jes 47:7","Jes 13:19","Jes 14:4","Dan 2:37","Dan 2: span class=\"wl wl-kjv\" data-code=\"H1350\">redeemer,</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts</span> is his <span class=\"wl wl-kjv\" data-code=\"H8034\">name,</span> the Holy <span class=\"wl wl-kjv\" data-code=\"H6918\">One</span> of Israel.","5":"<span class=\"wl wl-kjv\" data-code=\"H3427\">Sit</span> thou <span class=\"wl wl-kjv\" data-code=\"H1748\">silent,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">get</span> thee into <span class=\"wl wl-kjv\" data-code=\"H2822\">darkness,</span> O <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> of the <span class=\"wl wl-kjv\" data-code=\"H3778\">Chaldeans:</span> for thou shalt no <span class=\"wl wl-kjv\" data-code=\"H3254\">more</span> be <span class=\"wl wl-kjv\" data-code=\"H7121\">called,</span> The <span class=\"wl wl-kjv\" data-code=\"H1404\">lady</span> of kingdoms.","6":"I was <span class=\"wl wl-kjv\" data-code=\"H7107\">wroth</span> with my <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> I have <span class=\"wl wl-kjv\" data-code=\"H2490\">polluted</span> mine <span class=\"wl wl-kjv\" data-code=\"H5159\">inheritance,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> them into thine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand:</span> thou didst <span class=\"wl wl-kjv\" data-code=\"H7760\">shew</span> them no <span class=\"wl wl-kjv\" data-code=\"H7356\">mercy;</span> upon the <span class=\"wl wl-kjv\" data-code=\"H2205\">ancient</span> hast thou <span class=\"wl wl-kjv\" data-code=\"H3966\">very</span> <span class=\"wl wl-kjv\" data-code=\"H3513\">heavily</span> laid thy yoke.","7":"And thou <span class=\"wl wl-kjv\" data-code=\"H559\">saidst,</span> I shall be a <span class=\"wl wl-kjv\" data-code=\"H1404\">lady</span> for <span class=\"wl wl-kjv\" data-code=\"H5769\">ever:</span> so that thou didst not <span class=\"wl wl-kjv\" data-code=\"H7760\">lay</span> t hast <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> None <span class=\"wl wl-kjv\" data-code=\"H7200\">seeth</span> me. Thy <span class=\"wl wl-kjv\" data-code=\"H2451\">wisdom</span> and thy <span class=\"wl wl-kjv\" data-code=\"H1847\">knowledge,</span> it hath <span class=\"wl wl-kjv\" data-code=\"H7725\">perverted</span> thee; and thou hast <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> in thine <span class=\"wl wl-kjv\" data-code=\"H3820\">heart,</span> I am, and none else","11":"Therefore shall <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> upon thee; thou shalt not <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> from whence it <span class=\"wl wl-kjv\" data-code=\"H7837\">riseth:</span> and <span class=\"wl wl-kjv\" data-code=\"H1943\">mischief</span> shall <span class=\"wl wl-kjv\" data-code=\"H5307\">fall</span> upon thee; thou shalt not be <span class=\"wl wl-kjv\" data-code=\"H3201\">able</span> to put it <span class=\"wl wl-kjv\" data-code=\"H3722\">off:</span> and <span class=\"wl wl-kjv\" data-code=\"H7722\">desolation</span> shall <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> upon thee <span class=\"wl wl-kjv\" data-code=\"H6597\">suddenly,</span> which thou shalt not know.","12":"<span class=\"wl wl-kjv\" data-code=\"H5975\">Stand</span> now with thine <span class=\"wl wl-kjv\" data-code=\"H2267\">enchantments,</span> and with the <span class=\"wl wl-kjv\" data-code=\"H7230\">multitude</span> of thy <span class=\"wl wl-kjv\" data-code=\"H3785\">sorceries,</span> <span class=\"wl wl-kjv\" data-code=\"H834\">wherein</span> thou hast <span class=\"wl wl-kjv\" data-code=\"H3021\">laboured</span> from thy <span class=\"wl wl-kjv\" data-code=\"H5271\">youth;</span> if so be thou shalt be <span class=\"wl wl-kjv\" data-code=\"H3201\">able</span> to <span class=\"wl wl-kjv\" data-code=\"H3276\">profit,</span> if so be thou mayest prevail.","13":"Thou , uwe heerlijkheid, zal u nu haast benomen worden."},{"catchword":"zit in het stof,","tekst":"Of, zet u in het stof, gelijk die te doen plegen, die treuren vanwege enig groot leed, dat hun is overkomen. Zie Job 2:8 , Job 2:13 ."},{"catchword":"gij jonkvrouw,","tekst":"Aldus noemt de profeet het koninkrijk der Babyloniërs, dat toen ten hoogste bloeide, en dewijl het tot dezen tijd toe nog van gene vijanden was overheerd geweest, daar het zeer hovaardig op was, zijnde een voorbeeld van het Babel des Nieuwen Testaments of het rijk van den Antichrist."},{"catchword":"dochter van Babel","tekst":"Dat is, gij volk van Babel; zie 2Ki 19:21 ."},{"catchword":"er is geen troon","tekst":"Of, waar geen stoel is, te weten geen koninklijke stoel of troon."},{"catchword":"gij dochter der Chaldeën","tekst":"Dat is, Babylon, dat van de Chaldeën bewoond wordt."},{"catchword":"gij zult niet meer genoemd worden","tekst":"De zin is, uw wellust, dartelheid, overdaad, zal haast een einde nemen en in een ellendigen bedroefden staat veranderen. Hebreeuws, gij zult niet toedoen, dat zij u zullen noemen."}],"2":[{"catchword":"Neem de molen,","tekst":"Dat is, sla de hand aan den handmolen. Met deze woorden dreigt en voorzegt de Heere den Babyloniërs dat zij der Perzen lijfeigen knechten en maagden worden zouden, moetende den zwaren arbeid doen van het malen van het koren met handmolens. Zie Exo 11:5 ; Jdg 16:21 ."},{"catchword":"ontdek uw vlechten,","tekst":"Te weten gelijk de vrouwen plachten te doen, die tot een teken van droefenis het haar van het hoofd lostrokken en lieten hangen tot over het aangezicht. Of, ontbloot uw haar; te weten gelijk de slavinnen."},{"catchword":"de enkelen,","tekst":"Of, de koten; de slaven, knechten en maagden plachten barrevoets te gaan."},{"catchword":"ontdek de schenkelen,","tekst":"Dat is, schort u hoog op."},{"catchword":"ga door de rivieren","tekst":"Te weten de rivieren van Perzië; een dreigement dat zij gevankelijk zouden weggevoerd worden."}],"3":[{"catchword":"schaamte","tekst":"Hebreeuws, naaktheid."},{"catchword":"Ik zal wraak nemen,","tekst":"Dat is, Ik de Heere zal aan u, gij dochter van Babel, wraak doen, omdat gij zo onbarmhartig over mijn volk geweest zijt, vs.6."},{"catchword":"als een mens","tekst":"Maar als God. De zin is: Ik zal mijne sterkte aan u bewijzen, alzo dat gij te gronde zult moeten gaan. Of, Ik zal u aantasten, niet als een mens, maar als een leeuw of beer, of een ander wreed verscheurend dier, alzo dat men uit de grootheid of zwarigheid der straffen, die Ik over u brengen zal, wel lichtelijk zal kunnen afnemen dat het meer dan een menselijke kracht is, die u tenonder brengt."}],"4":[{"catchword":"Onzes Verlossers Naam","tekst":"Hebreeuws, onze Verlosser, Heere der heirscharen is zijn naam, enz."}],"5":[{"catchword":"Zit stilzwijgende,","tekst":"Verberg u gelijk de wanhopige mensen doen, die nergens hulp en troost van verwachten. Of, wees in de vergetelheid gesteld, als iets dat van gene waarde is."},{"catchword":"gij zult niet meer","tekst":"Dit is vervuld geworden als Cyrus de Babylonische monarchie op de Perzen gebracht heeft."},{"catchword":"koningin","tekst":"Of, vrouwe, regentes, souvereine, prinses, overste gebiedster. Zie de aantekening Jer 13:18 ."}],"6":[{"catchword":"Ik ontheiligde","tekst":"Ik liet ze verstoren en verwoesten, dezelve niet anders achtende dan een onheilige, ontreinigde of ontwijde zaak, deszelve aan de onheilige natiën overgevende."},{"catchword":"Mijn erve,","tekst":"Dat is, mijn volk Israël."},{"catchword":"over den oude","tekst":"De oude personen plachten wel somtijds van hunne vijanden zelfs verschoond te worden; maar deze barmhartigheid is bij de Babyloniërs niet te vinden geweest."},{"catchword":"maaktet gij","tekst":"Dat is, gij hebt hen zeer bezwaard en benauwd en wredelijk behandeld."}],"7":[{"catchword":"gij zeidet","tekst":"Te weten in uw hart, dat is, gij dacht, gelijk vs.10."},{"catchword":"koningin zijn","tekst":"Zie vs.5."},{"catchword":"gij hebt","tekst":"Te weten, wat het einde wezen zou, nadat Ik mijn volk zou gekastijd hebben in mijn rechtvaardig oordeel. Hebreeuws, aan het laatste."}],"8":[{"catchword":"die zo zeker","tekst":"Zie de aantekening Pro 1:33 ."},{"catchword":"Ik ben het,","tekst":"Of, Ik ben het, en is er behalve mij enige meer? of Ik ben het; ja, nog Ik alleenlijk."},{"catchword":"ik zal geen weduwe","tekst":"Dat is, ik zal van den koning, die als mijn man is, en van mijne burgers of onderzaten, die als mijne kinderen zijn, niet beroofd worden. De zin is: Ik zal altoos in de koninklijke waardigheid blijven, zij zal nimmermeer van mij genomen worden."},{"catchword":"kennen","tekst":"Of, weten; dat is, ondervinden."}],"9":[{"catchword":"volkomenlijk","tekst":"Hebreeuws, in, of naar hunne volmaaktheid."},{"catchword":"vanwege de menigte","tekst":"Of, om der grotere menigte wil van uwe bezweringen."}],"10":[{"catchword":"uw wijsheid","tekst":"Dat is, uw toverij en sterrekunst, op welke zich de Chaldeën zeer verlieten, alsof het de grootste wijsheid ware geweest. Zie Dan 2:2 , en Dan 5:7 ."},{"catchword":"afkerig gemaakt;","tekst":"Te weten van den rechten weg, of van wat goeds te doen."}],"11":[{"catchword":"den dageraad","tekst":"Dat is, zijn oorsprong, aanvang, begin. Aldus bespot hij de Babyloniërs, die op des hemels loop, [dat is, op den opgang en ondergang der sterren] acht gaven, om iets daaruit te voorzeggen."},{"catchword":"hetwelk","tekst":"Dat is, waaruit gij uzelven niet zult weten te ontwikkelen, noch uit te redden, of gij zult het niet kunnen verzachten."}],"12":[{"catchword":"waarin gij","tekst":"Anders, waarmede, of met welke gij u bemoeid hebt van, enz."},{"catchword":"of gij misschien","tekst":"Dit is spottenderwijze gesproken, om de ijdele hoop der Babyloniërs te openbaren."}],"13":[{"catchword":"die den hemel","tekst":"De mensen wijsmakende dat zij uit het aanschouwen der sterren toekomende dingen konden voorzeggen."},{"catchword":"die naar de nieuwe","tekst":"Of, die maandelijks, of naar de maanden voorspellen. Hebreeuws, te kennen geven."}],"14":[{"catchword":"zij zullen zijn","tekst":"Hebreeuws, zij zijn geweest; betekenende de zekerheid dezer profetie."},{"catchword":"zichzelven","tekst":"Hebreeuws, hunne ziel; gelijk Isa 46:2 . En kunnen zij zichzelven niet verlossen, veel minder zullen zij anderen kunnen verlossen uit de ellenden, die Babylon zullen overkomen."},{"catchword":"uit de macht","tekst":"Hebreeuws, uit de hand."},{"catchword":"der vlam;","tekst":"Dat is, van den vijandelijken aanval en inval hunner vijanden, der Perzen en Meden."},{"catchword":"het zal geen","tekst":"De zin is, dat de vlam, in het voorgaande vermeld, hen gewisselijk verteren zal, zijnde geen vuur om bij te warmen, maar om te verteren en te verslinden. Of, als anderen: Gelijk de stoppelen geen bestendigen gloed noch warmte geven, alzo is er bij de toverij en bij de sterrenkijkerij gene hulp te vinden. Anders: het zal geen kool zijn hunner spijze, dat is, om daarbij te koken."}],"15":[{"catchword":"met dewelke","tekst":"Dat is, met welke gij zolang grote moeite gedaan hebt, hun vragende van toekomende dingen, dat gij daar eindelijk moede van geworden zijt. Hij bedoelt de sterrenkijkers."},{"catchword":"uw handelaars","tekst":"Met welken gij dagelijks hebt omgegaan. Verstaande de astrologen."},{"catchword":"zijns weegs","tekst":"Of, zijn pas, zijn gang."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Come down, [To wit, from thy royal seat; as if he had said, thy royal seat, thy pomp, thy glory, shall be taken away from thee] and sit in the dust [Or, set thy self in the dust, as they are wont to do that mourn and grieve for some great evil or mischief that hath befallen them. See Job 2.ver.8, and 13.above chap.26.5.] thou Virgin, daughter of Babel, [Thou Virgin, so the Prophet calleth the kingdom of the Babylonians that then flourished exceedingly, or in the highest degree; and because hitherto it had not been conquered and subdued by any enemies; of which it was exceedingly proud, being a type of the Babel of the New Testament, or of the kingdom of Antichrist. (daughter of Babel) That is, the people of Babel. See 2 Kings 19.on verse 21. [sit on the ground, there is no throne (more) [Or where no seat is; To wit, no royal seat or throne] thou daughter of the Chaldeans; [That is, Babylon, which is inhabited by the Chaldeans] thou shalt be no more called tender, nor voluptuous, [the meaning is, thy pleasure, wantonness, and excess shall soon be at an end, and be turned into a miserable and sad estate and condition. Heb. Thou shalt not add that they shall call thee, &c.]"}],"2":[{"catchword":null,"tekst":"Take the mill, and grind meal: [That is, put your hands to the hand mills, &c. In these words the Lord threateneth & foretelleth the Babylonians that they should be bond-men and bond-women unto the Persians, being fain to do the great and hard labour of grinding corn with hand-mills. See Exo 11:5. Judg.16.21. uncover thy locks, [to wit, as women used to do, who in token of grief and sorrow tare the hare off their head, and let it hang down over their face: or, make bare thine hair; to wit, as bond-women do] make bare the ankles, or, the legs, uncover thy shanks, [that is, tuck up your selves high] pass through the rivers. [To wit, the rivers of Persia: a threatening that they should be carried away captive.]"}],"3":[{"catchword":null,"tekst":"Thy shame [Heb. Nakedness] shall be discovered, [Compare above chap.3.17. Nahum.3.5.] also thy filthiness shall be seen; I will take vengeance,] that is, I will execute vengeance upon thee, thou daughter of Babel, because thou hast been so unmerciful towards my people, vers.6. and I will not fall on (upon thee, as) a man. [But as God. The meaning is, I will shew my power upon thee, so that thou shalt utterly perish and be destroyed. Or, I will set upon thee not as a man, but as a Lion or Bear, or some other cruel devouring creature. So that from the greatness and grievousness of the judgements which I shall bring upon you, it may easily be gathered, that it is more then an humane strength or power that doth conquer or subdue you.]"}],"4":[{"catchword":null,"tekst":"Our redeemers name is LORD of hosts, the holy One of Israel. [Heb. Our Redeemer, Lord of hosts is his Name, etc.]"}],"5":[{"catchword":null,"tekst":"Sit silent, and get thee into darkness, thou daughter of the Chaldeans: [Hide thy self, as desolate men that can look for help and comfort no where. Or, be thou put in oblivion, as a thing of no value or esteem] for thou shalt no more be called the Queen, [Or, Lady, Regent, Sovereign, Princess, Supreme commander, or Governess. See Jerem.13.the Annotat. On vers.18.] of kingdoms. [This was fulfilled when Cyrus brought the Babylonian Monarchy unto the Persians.]"}],"6":[{"catchword":null,"tekst":"I was very angry with my people, I prophaned mine inheritance, [That is, my people of Israel. The meaning is, I suffered them to be destroyed and wasted, counting them to otherwise then profane, polluted, or an unhallowed thing, giving them over unto profane nations, as is intimated in the next words that follow] and I gave them over into thine hand: (but) thou didst shew them no mercies, (yea even) upon the ancient didst thou make thy yoke very heavy. [That is, thou hast grievously afflicted and oppressed them, and dealt cruelly with them. Aged persons were wont sometimes to be pitied and spared by their very enemies themselves; but thus mercy was not to be found with the Babylonians.]"}],"7":[{"catchword":null,"tekst":"And thou sadist, [To wit, in thine heart; that is, thou thoughest, as vers.10.] I shall be a Queen [see vers.5.] forever: [see Rev 18:7.] hitherto thou hast not laid these things to thine heart, thou hast not thought of the end thereof. [To wit, what the end would be, after that I should have chastised my people in my just judgement. Heb. Of the last.]"}],"8":[{"catchword":null,"tekst":"Now then hear this, thou voluptuous one, that dwellest so securely, [See Prov.1. the Annotat. On ver.33.] that sayest in thine heart, I am, and none more then I: [Or I am he: and is there anymore besides me? Or I am he, yea I alone] I shall not sit a widow, nor know [that is, experience] the bereaving of children, [that is, I shall not be bereaved of the King, who is as mine husband, nor of my citizens or subjects, which are as my children. The meaning is, I shall always continue in the royal dignity or glory, it shall be never taken away from me.]"}],"9":[{"catchword":null,"tekst":"But both these things shall come upon thee in a moment in one day, the bereaving of children and widowhood: [Compare below chap.51.19.] they shall come upon thee perfectly, [Heb. In or according to their perfection] by reason of the multitude of thy sorceries, by reason of the multitude of thy enchantments.]"}],"10":[{"catchword":null,"tekst":"For thou hast trusted in thy wickedness, thou hast said, none seeth me: thy wisdom and thy knowledge [That is, thy sorcery and Astrology, whereon the Chaldeans relied greatly, as if it had been the greatest wisdom and knowledge in the world. See Dan.2.2. and 5.7.] it hath made thee averse: [to wit, from the right way, from doing any thing that is, good] and thou hast said in thine heart, I am, and none more then I."}],"11":[{"catchword":null,"tekst":"Therefore there shall come upon thee an evil, thou shalt not know the morning thereof: [That is, its rise original, beginning. Thus he derideth the Babylonians that gave heed to the course of heaven; that is, to the rising and setting of the stars, to prognosticate somewhat from thence] and there shall fall upon thee a destruction which thou shalt not be able to oppose: [that is, out of which thou shalt not know how to rid and rescue and deliver thy self. Or thou shalt not be able to mitigate it] for there shall come upon thee suddenly a tempestuous desolation, (so) that thou shalt not know it."}],"12":[{"catchword":null,"tekst":"Stand now with thine enchantments, and with the multitude of thy sorceries, wherewith thou hast laboured from thy youth, [Others, wherewith thou hast wearied thy self, etc.] if perhaps thou mayest be able to make profit, if perhaps thou (mayest be able) so strengthen thy self. [this is spoken in a jeering way to discover the vain hope of the Babylonians]"}],"13":[{"catchword":null,"tekst":"Thou art grown weary in the multitude of thy counsels: let now them that observe the heaven, that gaze on the stars, that foretell according to the new Moons, months. Heb. Tel, or certify; making men believe that by looking on the stars they are able to foretell things to come] stand up, and let them deliver thee from those things that shall come upon thee."}],"14":[{"catchword":null,"tekst":"They shall be as stubble, [Heb. They were etc. signifying the certainly of this Prophesy] the fire shall burn them, they shall not be able to rescue themselves [Heb. Their soul, as above chap.46.ver.2.] from the power [Heb. From the hand] of the flame: [that is, of the hostile invasion and in rode of their enemies the Persians and Medes. And if they be not able to deliver others from the miseries that shall come upon Babylon] it shall not be a Cole to warm (at) (nor) fire to sit down before it, [the meaning is, that the flame mentioned in the former words, shall surely consume and devour. Or as others, as stubble giveth no lasting heat nor warmth; so neither is there any help or lasting comfort to be sought or sound by sorcery or star-gazing. Others, it shall not be a Cole unto their meat, that is, to dress their meat with.]"}],"15":[{"catchword":null,"tekst":"Thus shall they be unto thee, with whom thou hast laboured, [That is, with whom thou hast toiled and taken great pains such a long while, asking them about things to come so long, as that thou art grown weary of them at last: he meaneth the star-gazers] thy dealers from thy youth [with whom didst deal and trade daily. Meaning the Astrologers] everyone shall wander his (own) way, [or, his (own) pace, his (own) going] none shall deliver thee."}]}}};

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
