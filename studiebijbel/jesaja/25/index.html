l":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"HEERE! U bent mijn God, U zal ik verhogen, Uw Naam zal ik loven, want U hebt wonder gedaan; Uw raadslagen van verre zijn waarheid en vastigheid.","2":"Want U hebt van de stad een steenhoop gemaakt; de vaste stad tot een vervallen hoop; het paleis van de vreemdelingen, dat het geen stad meer is, in eeuwigheid zal het niet herbouwd worden.","3":"Daarom zal een machtig volk U eren, de stad van de tirannische volken zal U vrezen.","4":"Want U bent voor de arme een Sterkte geweest, een Sterkte voor de nooddruftige, toen het hem bang was; een Toevlucht tegen de vloed, een Schaduw tegen de hitte; want het blazen van de tirannen is als een vloed *tegen* een wand.","5":"Zoals de hitte in een dorre plaats, zult U de onstuimigheid van de vreemdelingen neerdrukken; *zoals* de hitte door de schaduw van een dikke wolk, zal het gezang van de tirannen vernederd worden.","6":"En de HEERE van de heerscharen[1] zal op deze berg voor alle volken een vette maaltijd maken, een maaltijd van reine wijn, van vet vol merg, van reine wijnen, die gezuiverd zijn.","7":"En Hij zal op deze berg verslinden het bewindsel van het aangezicht, waarmee alle volken bewonden zijn, en het deksel, waarmee alle naties bedekt zijn.","8":"Hij zal de dood verslinden tot overwinning, en de Heere HEERE zal de tranen van alle aangezichten afwissen; en Hij zal de smaad van Zijn volk van de hele aarde wegnemen; want de HEERE heeft het gesproken.","9":"En men zal op die dag zeggen: Zie, Deze is onze God; wij hebben Hem verwacht, en Hij zal ons zalig maken. Deze is de HEERE, wij hebben Hem verwacht, wij zullen ons verheugen en verblijden in Zijn zaligheid.","10":"Want de hand van de HEERE zal op deze berg rusten; maar Moab zal onder Hem verdorst worden, zoals het stro verdorst wordt tot mest.","11":"En Hij zal Zijn handen uitbreiden in het midden van hen, zoals een zwemmer *die* uitbreidt om te zwemmen, en Hij zal hun hoogmoed vernederen met de lagen van hun handen.","12":"En Hij zal de hoge vesten van uw muren buigen, vernederen, *ja*, Hij zal ze tot de aarde toe, tot het stof toe, doen reiken."},"SV":{"1":"HEERE! Gij zijt mijn God, U zal ik verhogen, Uw Naam zal ik loven, want Gij hebt wonder gedaan; *Uw* raadslagen van verre zijn waarheid *en* vastigheid.","2":"Want Gij hebt van de stad een steenhoop gemaakt; de vaste stad tot een vervallen hoop; het paleis der vreemdelingen, dat het geen stad meer zij, in eeuwigheid zal zij niet herbouwd worden.","3":"Daarom zal U een machtig volk eren, de stad der tirannische volken zal U vrezen.","4":"Want Gij zijt den arme een Sterkte geweest, een Sterkte den nooddruftige, als hem bange was; een Toevlucht tegen den vloed, een Schaduw tegen de hitte; want het blazen der tirannen is als een vloed *tegen* een wand.","5":"Gelijk de hitte in een dorre plaats, zult Gij de onstuimigheid der vreemdelingen nederdrukken; *gelijk* de hitte door de schaduw ener dikke wolk, zal het gezang der tirannen vernederd worden.","6":"En de HEERE der heirscharen zal op dezen berg allen volken een vetten maaltijd maken, een maaltijd van reinen wijn, van vet vol mergs, van reine wijnen, die gezuiverd zijn.","7":"En Hij zal op dezen berg verslinden het bewindsel des aangezichts, waarmede alle volken bewonden zijn, en het deksel, waarmede alle natiën bedekt zijn.","8":"Hij zal den dood verslinden tot overwinning, en de Heere HEERE zal de tranen van alle aangezichten afwissen; en Hij zal de smaadheid Zijns volks van de ganse aarde wegnemen; want de HEERE heeft het gesproken.","9":"En men zal te dien dage zeggen: Ziet, Deze is onze God; wij hebben Hem verwacht, en Hij zal ons zalig maken. Deze is de HEERE, wij hebben Hem verwacht, wij zullen ons verheugen en verblijden in Zijn zaligheid.","10":"Want de hand des HEEREN zal op dezen berg rusten; maar Moab zal onder Hem verdorst worden, gelijk het stro verdorst wordt tot mest.","11":"En Hij zal Zijn handen uitbreiden in het midden van hen, gelijk als een zwemmer *die* uitbreidt om te zwemmen, en Hij zal hun hoogmoed vernederen met de lagen hunner handen.","12":"En Hij zal de hoge vesten uwer muren buigen, vernederen, *ja*, Hij zal ze ter aarde tot het stof toe doen reiken."},"KJV":{"1":"O LORD, thou *art* my God; I will exalt thee, I will praise thy name; for thou hast done wonderful *things; thy* counsels of old *are* faithfulness *and* truth.","2":"For thou hast made of a city an heap; *of* a defenced city a ruin: a palace of strangers to be no city; it shall never be built.","3":"Therefore shall the strong people glorify thee, the city of the terrible nations shall fear","4":"For thou hast been a strength to the poor, a strength to the needy in his distress, a refuge from the storm, a shadow from the heat, when the blast of the terrible ones *is* as a storm *against* the wall.","5":"Thou shalt bring down the noise of strangers, as the heat in a dry place; *even* the heat with the shadow of a cloud: the branch of the terrible ones shall be brought low.","6":"And in this mountain shall the LORD of hosts make unto all people a feast of fat things, a feast of wines on the lees, of fat things full of marrow, of wines on the lees well refined.","7":"And he will destroy in this mountain the face of the covering cast over all people, and the vail that is spread over all nations.","8":"He will swallow up death in victory; and the Lord GOD will wipe away tears from off all faces; and the rebuke of his people shall he take away from off all the earth: for the LORD hath spoken","9":"And it shall be said in that day, Lo, this *is* our God; we have waited for him, and he will save us: this *is* the LORD; we have waited for him, we will be glad and rejoice in his salvation.","10":"For in this mountain shall the hand of the LORD rest, and Moab shall be trodden down under him, even as straw is trodden down for the dunghill.","11":"And he shall spread forth his hands in the midst of them, as he that swimmeth spreadeth forth *his hands* to swim: and he shall bring down their pride together with the spoils of their hands.","12":"And the fortress of the high fort of thy walls shall he bring down, lay low, *and* bring to the ground, *even* to the dust."}},"tsk":{"1":[{"kopje":"U bent","refs":["Jes 26:13","Jes 61:10","Ex 15:2","1 Kron 29:10-20","Ps 99:5","Ps 118:28","Ps 145:1","Ps 146:2","Openb 5:9-14","Openb 7:12"]},{"kopje":"U hebt","refs":["Ps 40:6","Ps 46:11","Ps 78:4","Ps 98:1","Ps 107:8-43","Ps 111:4","Dan 4:2","Dan 4:3","Openb 15:3"]},{"kopje":"Uw raadslagen","refs":["Jes 28:29","Jes 46:10","Num 23:19","Ps 33:10","Ps 33:11","Jer 32:17-24","Ezech 38:17-23","Rom 11:25-29","Ef 1:11","Hebr 6:17","Hebr 6:18","Openb 19:11"]}],"2":[{"kopje":"Want","refs":["Jes 25:12","Jes 14:23","Jes 17:1","Jes 21:9","Jes 23:13","Deut 13:16","Jer 51:26","Nahum 3:12-15"]},{"kopje":"paleis","refs":["Jes 13:22","Openb 18:2","Openb 18:3","Openb 18:19"]}],"4":[{"kopje":"U bent","refs":["Jes 11:4","Jes 14:32","Jes 29:19","Jes 33:2","Jes 66:2","Job 5:15","Job 5:16","Ps 12:6","Ps 35:10","Ps 72:4","Ps 72:13","Ps 107:41","Ps 119:31","Zef 3:12","Jak 2:5"]},{"kopje":"een Toevlucht","refs":["Jes 4:5","Jes 4:6","Jes 32:2"]},{"kopje":"toen","refs":["Jes 32:18","Jes 32:19","Jes 37:3","Jes 37:4","Jes 37:36","Ezech 13:11-13","Matt 7:25-27"]}],"5":[{"kopje":"zult U neerdrukken","refs":["Jes 10:8-15","Jes 10:32-34","Jes 13:11","Jes 14:10-16","Jes 17:12-14","Jes 30:30-33","Jes 49:25","Jes 49:26","Jes 54:15-17","Jes 64:1","Jes 64:2","Ps 74:3-23","Ps 79:10-12","Jer 50:11-15","Jer 51:38-43","Jer 51:53-57","Ezech 32:18-32","Ezech 38:9-23","Ezech 39:1-10","Dan 7:23-27","Dan 11:36-45","Openb 16:1","Openb n> a <span class=\"wl wl-kjv\" data-code=\"H4581\">strength</span> to the <span class=\"wl wl-kjv\" data-code=\"H34\">needy</span> in his <span class=\"wl wl-kjv\" data-code=\"H6862\">distress,</span> a <span class=\"wl wl-kjv\" data-code=\"H4268\">refuge</span> from the <span class=\"wl wl-kjv\" data-code=\"H2230\">storm,</span> a <span class=\"wl wl-kjv\" data-code=\"H6738\">shadow</span> from the <span class=\"wl wl-kjv\" data-code=\"H2721\">heat,</span> when the <span class=\"wl wl-kjv\" data-code=\"H7307\">blast</span> of the terrible <span class=\"wl wl-kjv\" data-code=\"H6184\">ones</span> is as a <span class=\"wl wl-kjv\" data-code=\"H2230\">storm</span> against the wall.","5":"Thou shalt bring <span class=\"wl wl-kjv\" data-code=\"H3665\">down</span> the <span class=\"wl wl-kjv\" data-code=\"H7588\">noise</span> of <span class=\"wl wl-kjv\" data-code=\"H2114\">strangers,</span> as the <span class=\"wl wl-kjv\" data-code=\"H2721\">heat</span> in a dry <span class=\"wl wl-kjv\" data-code=\"H6724\">place;</span> even the <span class=\"wl wl-kjv\" data-code=\"H2721\">heat</span> with the <span class=\"wl wl-kjv\" data-code=\"H6738\">shadow</span> of a <span class=\"wl wl-kjv\" data-code=\"H5645\">cloud:</span> the <span class=\"wl wl-kjv\" data-code=\"H2159\">branch</span> of the terrible <span class=\"wl wl-kjv\" data-code=\"H6184\">ones</span> shall be brought low.","6":"And in this <span class=\"wl wl-kjv\" data-code=\"H2022\">mountain</span> shall the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">make</span> unto all <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> a <span class=\"wl wl-kjv\" data-code=\"H4960\">feast</span> of fat <span class=\"wl wl-kjv\" data-code=\"H8081\">things,</span> a <span class=\"wl wl-kjv\" data-code=\"H4960\">feast</span> of wines on the <span class=\"wl wl-kjv\" data-code=\"H8105\">lees,</span> of fat <span class=\"wl wl-kjv\" data-code=\"H8081\">things</span> full of <span class=\"wl wl-kjv\" data-code=\"H4229\">marrow,</span> of wines on the <span class=\"wl wl-kjv\" data-code=\"H8105\">lees</span> well refined.","7":"And he will <span class=\"wl wl-kjv\" data-code=\"H1104\">destroy</span> in this <span class=\"wl wl-kjv\" data-code=\"H2022\">mountain</span> the <span class=\"wl wl-kjv\" data-code=\"H6440\">face</span> of the <span class=\"wl wl-kjv\" data-code=\"H3875\">covering</span> cast <span class=\"wl wl-kjv\" data-code=\"H3874\">over</span> all <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4541\">vail</span> that is <span class=\"wl wl-kjv\" data-code=\"H5259\">spread</span> over all nations.","8":"He will swallow <span class=\"wl wl-kjv\" data-code=\"H1104\">up</span> <span class=\"wl wl-kjv\" data-code=\"H4194\">death</span> in <span class=\"wl wl-kjv\" data-code=\"H5331\">victory;</span> and the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD</span> will wipe <span class=\"wl wl-kjv\" data-code=\"H4229\">away</span> <span class=\"wl wl-kjv\" data-code=\"H1832\">tears</span> from off all <span class=\"wl wl-kjv\" data-code=\"H6440\">faces;</span> and the <span class=\"wl wl-kjv\" data-code=\"H2781\">rebuke</span> of his <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> shall he take <span class=\"wl wl-kjv\" data-code=\"H5493\">away</span> from off all the <span class=\"wl wl-kjv\" data-code=\"H776\">earth:</span> for the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath spoken","9":"And it shall be <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> in that <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> Lo, this is our <span class=\"wl wl-kjv\" data-code=\"H430\">God;</span> we have <span class=\"wl wl-kjv\" data-code=\"H6960\">waited</span> for him, and he will <span class=\"wl wl-kjv\" data-code=\"H3467\">save</span> us: this is the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD;</span> we have <span class=\"wl wl-kjv\" data-code=\"H6960\">waited</span> for him, we will be <span class=\"wl wl-kjv\" data-code=\"H1523\">glad</span> and <span class=\"wl wl-kjv\" data-code=\"H8055\">rejoice</span> in his salvation.","10":"For in this <span class=\"wl wl-kjv\" data-code=\"H2022\">mountain</span> shall the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H5117\">rest,</span> and <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab</span> shall be trodden <span class=\"wl wl-kjv\" data-code=\"H1758\">down</span> under him, even as <span class=\"wl wl-kjv\" data-code=\"H4963\">straw</span> is trodden <span class=\"wl wl-kjv\" data-code=\"H1758\">down</span> for the <span class=\"wl wl-kjv\" data-code=\"H1119\">dunghill.</span>","11":"And he shall spread <span class=\"wl wl-kjv\" data-code=\"H6566\">forth</span> his <span class=\"wl wl-kjv\" data-code=\"H3027\">hands</span> in the <span class=\"wl wl-kjv\" data-code=\"H7130\">midst</span> of them, as he that <span class=\"wl wl-kjv\" data-code=\"H7811\">swimmeth</span> spreadeth <span class=\"wl wl-kjv\" data-code=\"H6566\">forth</span> his hands to <span class=\"wl wl-kjv\" data-code=\"H7811\">swim:</span> and he shall bring <span class=\"wl wl-kjv\" data-code=\"H8213\">down</span> their <span class=\"wl wl-kjv\" data-code=\"H1346\">pride</span> together with the <span class=\"wl wl-kjv\" data-code=\"H698\">spoils</span> of their hands.","12":"And the <span class=\"wl wl-kjv\" data-code=\"H4013\">fortress</span> of the high <span class=\"wl wl-kjv\" data-code=\"H4869\">fort</span> of thy <span class=\"wl wl-kjv\" data-code=\"H2346\">walls</span> shall he bring <span class=\"wl wl-kjv\" data-code=\"H7817\">down,</span> lay <span class=\"wl wl-kjv\" data-code=\"H8213\">low,</span> and <span class=\"wl wl-kjv\" data-code=\"H5060\">bring</span> to the <span class=\"wl wl-kjv\" data-code=\"H776\">ground,</span> even to the dust."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"Gij zijt mijn God,","tekst":"Dat is een lofzang van het volk Gods, te weten van de gemeente der gelovigen in het Nieuwe Testament."},{"catchword":"wonder gedaan;","tekst":"Of, wonderlijke dingen."},{"catchword":"van verre","tekst":"Dat is, vanouds af."},{"catchword":"vastigheid","tekst":"Of, trouw."}],"2":[{"catchword":"Want Gij hebt","tekst":"Duidelijkheidshalve zijn de woorden van dit vs. in een weinig andere orde gesteld dan zij in het Hebreeuws staan."},{"catchword":"stad","tekst":"Te weten Babylon, en voorts alle andere vijandelijke steden en volken, inzonderheid Rome."},{"catchword":"gemaakt;","tekst":"Hebreeuws, gesteld tot een steenhoop."}],"3":[{"catchword":"een machtig volk","tekst":"Versta, dat volk, dat zich tot U bekeren zal, dat U uit zulke verschrikkelijke straffen zal leren vrezen en eren."},{"catchword":"der tirannische volken","tekst":"Of, schrikkelijke, geweldige, gruwelijke heidenen."}],"4":[{"catchword":"den arme","tekst":"Of, een sterkte der armen."},{"catchword":"voor den vloed,","tekst":"Of, voor de overvloeiende wateren; gelijk Isa 4:6 ."},{"catchword":"want","tekst":"Of, toen het blazen der tirannen was als, enz."},{"catchword":"het blazen","tekst":"Hebreeuws, de wind, [of, als sommigen, geest, dat is, toorn] der tirannen, of der gruwzamen, of schrikkelijken."}],"5":[{"catchword":"Gelijk de hitte","tekst":"De zin is: Gelijk de hitte in een dorre plaats door den regen spoedig gedempt wordt, alzo heeft God door de wolk zijner genadige hulp, door welke Hij zijne kerk heeft willen verkwikken, de onstuimigheid der vreemdelingen, dat is der ongelovigen en der vijanden zijner kerk, gedempt."},{"catchword":"hitte door de schaduw","tekst":"Zie boven Isa 4:6 ."},{"catchword":"gezang","tekst":"Dat is, de vreugde, blijdschap en triomf, dat zij over de godzaligen plachten te bedrijven."}],"6":[{"catchword":"de HEERE","tekst":"Hier spreekt de profeet, alsook vs.7, 10."},{"catchword":"dezen berg","tekst":"Dat is, in de Christelijke kerk, die door den berg Zion wordt afgebeeld."},{"catchword":"allen volken","tekst":"Zowel de heidenen als de Joden, die Hij door de predikatie van het heilig Evangelie tot zijne kennis roepen zal."},{"catchword":"een vetten","tekst":"Hebreeuws, een maaltijd van vettigheden. Geestelijkerwijze te verstaan, is dit en wat er volgt te zeggen dat God zijne uitverkorenen zijn overgrote genade in Christus zal deelachtig maken, namelijk de eeuwige vreugde en zaligheid, die Hij ons boven in den hemel heeft bereid. Vergelijk hiermede Psa 22:27 , Psa 22:30 ; Mat 8:11 , en Mat 22:2 . Zie de aantekening Psa 36:9 ."},{"catchword":"reinen","tekst":"Of, gezuiverden wijn; dat is, waar geen hef in is, of die van den hef gezuiverd is, gelijk straks. Anders: die op den hef ligt."},{"catchword":"van vet","tekst":"Dat is, van vette welgemergde beesten."}],"7":[{"catchword":"verslinden","tekst":"Dat is, teniet doen."},{"catchword":"het bewindsel","tekst":"Hebreeuws, het aangezicht des bewindsels, of deksels, bewonden, of gedekt, over, enz. en zo in het volgende; en versta, de blindheid en onwetendheid in goddelijke en hemelse zaken, waar alle heidenen in staken vóór de verkondiging van het heilige Evangelie. Zie 2Co 3:16 ."},{"catchword":"en het deksel,","tekst":"Dat is, waarmede alle natiën of aller heidenen ogen des verstands bedekt en als verblind zijn, aangaande goddelijke zaken. Hetgeen straks tevoren gezegd is, wordt met andere woorden wederhaald."}],"8":[{"catchword":"verslinden","tekst":"Dat is, hunne macht benemen, alzo dat zij over zijne uitverkorenen te heersen gene macht hebben, en hen van zijne liefde niet scheiden kunnen."},{"catchword":"tot overwinning,","tekst":"Alzo heeft de apostel deze woorden genomen 1Co 15:54 . Anders, in eeuwigheid, of eeuwiglijk. Zie van het Hebreeuwse woord Psa 4:1 , en Psa 13:2 ."},{"catchword":"alle aangezichten","tekst":"Te weten van de aangezichten zijns volks; zie Rev 7:17 , en Rev 21:4 ."},{"catchword":"van de ganse aarde","tekst":"Dat is, in alle landen."}],"9":[{"catchword":"Deze","tekst":"Te weten Jezus Christus."},{"catchword":"zalig maken","tekst":"Of, verlossen, behoeden. Dit woord en het laatste van dit vs. komen beide van den Hebreeuwsen wortel, of van het oorspronkelijke woord, waar het woord Jezus van komt."},{"catchword":"in Zijn zaligheid","tekst":"Dat is, in de zaligheid, die Hij ons teweegbrengt. Anders: in zijne zaligmaking."}],"10":[{"catchword":"de hand","tekst":"Dat is, de macht. De zin is: God zal steeds zijne kerk beschutten en beschermen, want door den berg Zion wordt hier de kerk Gods verstaan."},{"catchword":"Moab","tekst":"Dat is, alle vijanden en vervolgers van het volk Gods."},{"catchword":"onder Hem","tekst":"Te weten onder den Heere, die hem vertreden en verdelgen zal."},{"catchword":"tot mest","tekst":"Versta hierdoor het allergeringste stro, hetwelk nergens anders toe deugt dan om mest daarvan te maken. Anders: vertreden wordt op den mesthoop. Anders: te Madmenahum Daar zijn twee steden van dien naam geweest, de ene in Juda, 1Ch 2:49 , de andere in het land der Moabieten; Jer 48:2 . Het schijnt dat daar overvloedig veel koren gewassen heeft; Isa 10:31 ."}],"11":[{"catchword":"Hij zal","tekst":"Te weten de Heere."},{"catchword":"Zijn handen","tekst":"Dat is, Hij zal met ganse macht zijne vijanden aantasten en verdelgen, gelijk een zwemmer zijn beide handen uitstrekt en kloekelijk voort te zwemmen."},{"catchword":"hun hoogmoed","tekst":"Te weten, der Moabieten."},{"catchword":"met de lagen","tekst":"De zin is: Moab is hovaardig van hart en in zijne handen is bedrog, weshalve hij zich grote dingen inbeeldt; maar God zal ze beide te schande maken, zo de hovaardij zijns harten als de lagen zijner handen. Zodat met hier betekent zoveel als mitsgaders. Anders: met zijn loerende handen, alsof hij zeide: Met zijne handen, die daarop loeren om de vromen te verscheuren, gelijk de leeuw op een prooi loert."}],"12":[{"catchword":"de hoge vesten","tekst":"Dat is, de vastigheden uwer hogere muren."},{"catchword":"uwer muren","tekst":"Te weten van Moab, dat is, van de vijanden van Gods kerk."},{"catchword":"Hij zal ze","tekst":"Te weten de Heere."},{"catchword":"ter aarde","tekst":"Dat is, Hij zal hen ten gronde werpen tot in het stof."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"LORD, thou art my God, I will extol thee, I will praise thy name, [This is a song of praise of the people of God; to wit, of the Church of believers in the new Testament] For thou hast done wonders: [Or, wonderful things] (thy) counsels from afar off, that is, of old] are truth (and) stability. [or faithfulness.]"}],"2":[{"catchword":null,"tekst":"For thou hast made of the city an heap of stones, [For clearness sake the words of this verse are somewhat otherwise disposed then they are in the Hebrew text. By the city here is meant Babylon, and consequently all other hostile cities and nations, and especially Rome. Heb. Set for an heap of stones. Compare above chap.21.9. and 23.13. Revel.14.8. and 18.2.] the fenced city a ruinous heap: the palace of strangers, that it be no more a city, it shall never be built again."}],"3":[{"catchword":null,"tekst":"Therefore a mighty people shall honour thee, the city of tyrannical nations [Or terrible, violent, cruel heathen] shall fear thee [A mighty people, meaning that people that will turn unto thee, that by such terrible judgements shall learn to fear and honour thee.]"}],"4":[{"catchword":null,"tekst":"For thou hast been a strength unto the poor, [Or a strength of the poor] a strength to the needy, when he was in distress a refuge from the flood, [or, from the overflowing waters: as above chap.4.ver.6.] a shadow from the heat: for the blowing of tyrants [Heb. The wind (or, as some, spirit; that is, wrath) of tyrants; or, of cruel, or terrible ones] is a flood (against) a wall. [or, when the blowing of tyrants was as, etc.]"}],"5":[{"catchword":null,"tekst":"Thou shalt press down the rage of stranger as the heat in a dry place, [The meaning is, as the heat in a dry place is soon quelled or allayed by the rain: So hath God by the cloud of his gracious help (whereby he refreshed and revived his Church) quelled and extinguished the raging heat of strangers; and that is, of infidels and enemies of his Church] the song of tyrants [that is, the unity, joy, and triumph, which they were wont to make over the godly] shall be brought down, (as) the heat by the shadow of a thick cloud. [See above chap.4.6.]"}],"6":[{"catchword":null,"tekst":"And the LORD of hosts shall make on this mountain [That is, in the Christian Church, which is typified and represented by mount Zion] unto all nations [as well Gentiles as Jews, whom by the preaching of the Gospel he will call to the knowledge of himself] a fat feast, [Heb. A feast of fatnesses. In a spiritual sense the meaning of this and of that which followeth is that God will make his elect partakers of his exceeding great grace and mercy in Christ, namely of everlasting joy and salvation, which he hath prepared for us above in heaven. Compare herewith Psal.22.27,30. Mat 8:11. and 22.2. See the Annotat. Psal.36.on ver.9. the Prophet speaketh in this verse, as he doth also verse 7 and verse 10.] a feast of pure wine, [or, refined wine] that is, in which there is no less, or which is refined or purified from the less. Others, that lieth on the less] of fat full of marrow, [that is, of fat well-marrowed beasts] of pure wines that are refined."}],"7":[{"catchword":null,"tekst":"And he shall devour [That is, disannul, make void] on this mountain the wrapping up of the face, wherewith all nations are wrapped up [Heb. The face of the wrapping up, or, covering, wrapped up or covered upon &c, and so in the sequel; and understand hereby the blindness and ignorance in divine and heavenly things wherein all the heathen or Gentiles stuck before the preaching of the Gospel. See 2 Cor.3.16.] and the covering wherewith all nations are covered. [that is, wherewith the eyes of the understanding of all nations, or all the heathen are covered, and as it were blinded, concerning things divine. That which was said immediately before, is repeated again in other words.]"}],"8":[{"catchword":null,"tekst":"He shall swallow up death, [That is, deprive it of its power to reign over his elect, or be able to separate them from his love] unto victory, [so the Apostle took these words, 1 Cor.15.54. Others, forever, or, everlasting. See of the Hebrew word, Psal.4.on ver.1. & 13.on ver.2.] and the Lord LORD will wipe away the tears from off all faces: [To wit, from off the faces of his people. See Revel.7.17,9, & 21.24.] and the reproach of his people he shall take away from off all the earth, [that is, in all lands] for the Lord hath spoken it."}],"9":[{"catchword":null,"tekst":"And men shall say in that day, Lo this [To wit, Jesus Christ is our God] we have waited for him, and he will save us: [or, deliver, preserve us. This word, and the last of this verse are both derived from the Hebrew or original word from whence the word Jesus is derived] this is the Lord, we have waited for him, we will rejoice and be glad in his salvation [that is, in the salvation which he procureth for us. Others, in his saving.]"}],"10":[{"catchword":null,"tekst":"For the hand [That is, the power] of the LORD shall rest upon this mountain: [that is, God will continually preserve and defend his Church. For by mount Zion here is meant the Church of God] but Moab [that is, all the enemies and persecutors of the people of God] shall be threshed under him] to wit, under the Lord, who shall tread down and destroy him] as straw is threshed to dung [understand hereby the worst sort of strew, which serveth for nothing else but to make dung of it. Others, is trodden down on the dung-hill. Others, at Madmanna, there were two cities of this name: one in Juda, 1 Chron.2.49. and another in the land of the land Moabites, Jer 48:2. it seemeth that abundance of corn grew there, above chap.10.31.]"}],"11":[{"catchword":null,"tekst":"And he [To wit, the Lord] shall spread forth his hands in the midst of them, like as a swimmer spreadeth (them) forth to swim, [that is, he will with all his strength and power seize upon and destroy his enemies, as a swimmer spreadeth forth both his hands to swim well] and he shall bring down their pride, [to wit, the pride of the Moabites] with the strength of their hands, [the meaning is, Moab is proud in heart, and in his hands is deceit or guide, in which respect he fancieth great things unto himself: but God will cons nares of his hands. So that the particle with signifieth here as much as together with. Others, with his lurking hands. As if he had said, with his hands that lurk or lie in wait for to rent the godly in pieces, as the lion lieth in wait for a prey.]"}],"12":[{"catchword":null,"tekst":"And he shall bow, (and) bring down the high fortresses of thy walls, [That is, the fortifications of thy high walls, (of thy walls) [to wit, Moabs walls; that is, the walls of the enemies of Gods Church] (yea) he [to wit, the Lord] shall cause them to carry to the earth, (even) to the dust, [That is, he shall cast them to the ground, even to the dust.]"}]}}};

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {

  if (!k) return;

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:"Lora";font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
