l":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"De last van het dal van het gezicht.[1] Wat is er nu met u, dat u helemaal naar de daken bent geklommen?","2":"U, die vol was van groot rumoer, u woelige stad, u, vrolijk huppelende stad, uw gesneuvelden zijn niet gesneuveld door het zwaard, en ook niet gestorven in de strijd.","3":"Al uw leiders zijn samen weggevlucht; zij zijn door de schutters gebonden, allen die in u gevonden zijn, zijn samen gebonden, zij zijn van ver gevlucht.","4":"Daarom zeg ik: Wend uw blik van mij af; laat mij bitter wenen; dring er niet op aan om mij te troosten over de verwoesting van de dochters van mijn volk.","5":"Want het is een dag van beroering, en van vertrapping, en van verwarring van de Heere, de HEERE van de heerscharen,[2] in het dal van het gezicht, *een dag* van afbraak van het muur, en van geschreeuw naar het gebergte toe.","6":"Want Elam heeft de pijlkoker genomen, de man is op de wagen, er zijn ruiters; en Kir ontbloot het schild.","7":"En het zal gebeuren, dat uw uitgelezen dalen vol wagens zullen zijn, en dat de ruiters zich zeker zullen opstellen bij de poorten.","8":"En hij zal het deksel van Juda wegnemen; en op die dag zult u kijken naar de wapens in het huis van het woud.","9":"En u zult de scheuren van de stad van David bekijken, omdat ze veel zijn; en u zult het water van de onderste vijver verzamelen.","10":"U zult ook de huizen van Jeruzalem tellen; en u zult huizen afbreken, om de muren te versterken.","11":"Ook zult u een gracht maken tussen beide de muren, voor het water van de oude vijver; maar u zult niet omhoogkijken naar Hem, Die dat gedaan heeft, en Hem niet aanmerken, Die dat van *verre tijden* gevormd heeft.","12":"En op die dag zal de Heere, de HEERE van de heerscharen, roepen tot geween, en tot rouwklacht, en tot kaalheid, en tot omgording met de zak.","13":"Maar zie, er is vreugde en blijdschap met runderen te doden, en schapen te slachten, vlees te eten, en wijn te drinken, *en te zeggen*: Laten we eten en drinken, want morgen zullen we sterven.","14":"Maar de HEERE van de heerscharen heeft Zich aan mijn oren geopenbaard, *en zei*: Zeker zal deze ongerechtigheid u niet verzoend worden, totdat u sterft! zegt de Heere, de HEERE van de heerscharen.","15":"Zo zegt de Heere, de HEERE van de heerscharen: Ga heen, ga naar die schatmeester, naar Sebna, de hofmeester, *en spreek*:","16":"Wat hebt u hier, of aan wie hebt u hier iets, dat u hier voor uzelf een graf hebt uitgehouwen, *zoals* iemand die zijn graf in de hoogte uithouwt, die voor zichzelf een woning in een rots laat uithakken?","17":"Zie, de HEERE zal u wegwerpen met een krachtige wegwerping, en Hij zal u helemaal bedekken.","18":"Hij zal u zeker voortrollen, zoals men een bal rolt, naar een land, wijd van omvang; daar zult u sterven, en daar zullen uw heerlijke wagens zijn, o u schandvlek van het huis van uw heer!","19":"En Ik zal u wegstoten van uw positie, en van uw plaats zal Hij u neerhalen.","20":"En het zal op die dag gebeuren, dat Ik Mijn knecht, Eljakim, de zoon van Hilkia, roepen zal.","21":"En Ik zal hem met uw gewaad bekleden, en Ik zal hem met uw gordel sterken, en uw heerschappij zal Ik in zijn hand geven; en hij zal voor de inwoners van Jeruzalem en voor het huis van Juda tot een vader zijn.","22":"En Ik zal de sleutel van het huis van David op zijn schouder leggen; en hij zal opendoen, en niemand zal sluiten, en hij zal sluiten, en niemand zal opendoen.","23":"En Ik zal hem *als* een nagel inslaan op een vaste plaats; en hij zal een stoel van eer zijn voor het huis van zijn vader.","24":"En men zal aan hem alle heerlijkheid van het huis van zijn vader hangen, van de nakomelingen en de afstammelingen, *ook* alle kleine vaten, van de bekers af, tot alle kannen toe.","25":"Op die dag, spreekt de HEERE van de heerscharen, zal die nagel, die op een vaste plaats gestoken was, weggenomen worden; en hij zal afgehouwen worden, en hij zal vallen, en de last die daaraan hangt, zal afgesneden worden; want de HEERE heeft het gesproken."},"SV":{"1":"De last van het dal des gezichts. Wat is u nu, dat gij altegader op de daken klimt?","2":"Gij, die vol van groot gedruis waart, gij woelige stad, gij, vrolijk huppelende stad, Uw verslagenen zijn niet verslagen met het zwaard, noch gestorven in den strijd.","3":"Al uw oversten zijn te zamen weggevlucht; zij zijn van de schutters gebonden, allen, die in u gevonden zijn, zijn samengebonden, zij zijn van verre gevloden.","4":"Daarom zeg ik: Wendt het gezicht van mij af; laat mij bitterlijk wenen; dringt niet aan, om mij te troosten over de verstoring der dochteren mijns volks.","5":"Want het is een dag van beroering, en van vertreding, en van verwarring van den Heere, den HEERE der heirscharen, in het dal des gezichts, *een* *dag* van ontmuring des muurs, en van geschreeuw naar het gebergte toe.","6":"Want Elam heeft den pijlkoker genomen, de man is op den wagen, er zijn ruiters; en Kir ontbloot het schild.","7":"En het zal geschieden, dat uw uitgelezen dalen vol wagenen zullen zijn, en dat de ruiters zich gewisselijk zullen zetten ter poorten aan.","8":"En hij zal het deksel van Juda ontdekken; en te dien dage zult gij zien naar de wapenen in het huis des wouds.","9":"En gijlieden zult bezien de reten der stad Davids, omdat zij vele zijn; en gij zult de wateren des ondersten vijvers vergaderen.","10":"Gij zult ook de huizen van Jeruzalem tellen; en gij zult huizen afbreken, om de muren te bevestigen.","11":"Ook zult gij een gracht maken tussen beide de muren, voor de wateren des ouden vijvers; maar gij zult niet opwaarts zien op Dien, Die zulks gedaan heeft, noch aanmerken Dien, Die dat van *verre* *tijden* geformeerd heeft.","12":"En te dien dage zal de Heere, de HEERE der heirscharen, roepen tot geween, en tot rouwklage, en tot kaalheid, en tot omgording des zaks.","13":"Maar ziet, er is vreugde en blijdschap met runderen te doden, en schapen te kelen, vlees te eten, en wijn te drinken, *en* *te* *zeggen*: Laat ons eten en drinken, want morgen zullen wij sterven.","14":"Maar de HEERE der heirscharen heeft Zich voor mijn oren geopenbaard, *zeggende*: Indien ulieden deze ongerechtigheid verzoend wordt, totdat gij sterft! zegt de Heere, de HEERE der heirscharen.","15":"Alzo zegt de Heere, de HEERE der heirscharen: Ga heen, ga in tot dien schatmeester, tot Sebna, den hofmeester, *en* *spreek*:","16":"Wat hebt gij hier, of wien hebt gij hier, dat gij u hier een graf uitgehouwen hebt *als* die zijn graf in de hoogte uithouwt, die een woning voor zich op een rotssteen laat aftekenen?","17":"Zie, de HEERE zal u wegwerpen met een mannelijke wegwerping, en Hij zal u ganselijk overdekken.","18":"Hij zal u gewisselijk voortrollen, gelijk men een bal rolt, in een land, wijd van begrip; aldaar zult gij sterven, en aldaar zullen uw heerlijke wagenen zijn, o gij schandvlek van het huis uws heren!","19":"En Ik zal u afstoten van uw staat, en van uw stand zal Hij u verstoren.","20":"En het zal te dien dage geschieden, dat Ik Mijn knecht, Eljakim, den zoon van Hilkia, roepen zal.","21":"En Ik zal hem met uw rok bekleden, en Ik zal hem met uw gordel sterken, en uw heerschappij zal Ik in zijn hand geven; en hij zal den inwoneren te Jeruzalem en den huize van Juda tot een vader zijn.","22":"En Ik zal den sleutel van het huis van David op zijn schouder leggen; en hij zal opendoen, en niemand zal sluiten, en hij zal sluiten, en niemand zal opendoen.","23":"En Ik zal hem *als* een nagel inslaan in een vaste plaats; en hij zal wezen tot een stoel der eer voor het huis zijns vaders.","24":"En men zal aan hem hangen alle heerlijkheid van het huis zijns vaders, der uitspruitelingen en der afkomelingen, *ook* alle kleine vaten, van de vaten der bekers af, zelfs tot al de vaten der flessen.","25":"Te dien dage, spreekt de HEERE der heirscharen, zal die nagel, die aan een vaste plaats gestoken was, weggenomen worden; en hij zal afgehouwen worden, en hij zal vallen, en de last, die daaraan is, zal afgesneden worden; want de HEERE heeft het gesproken."},"KJV":{"1":"The burden of the valley of vision. What aileth thee now, that thou art wholly gone up to the housetops?","2":"Thou that art full of stirs, a tumultuous city, a joyous city: thy slain *men are* not slain with the sword, nor dead in battle.","3":"All thy rulers are fled together, they are bound by the archers: all that are found in thee are bound together, *which* have fled from far.","4":"Therefore said I, Look away from me; I will weep bitterly, labour not to comfort me, because of the spoiling of the daughter of my people.","5":"For *it is* a day of trouble, and of treading down, and of perplexity by the Lord GOD of hosts in the valley of vision, breaking down the walls, and of crying to the mountains.","6":"And Elam bare the quiver with chariots of men *and* horsemen, and Kir uncovered the shield.","7":"And it shall come to pass, *that* thy choicest valleys shall be full of chariots, and the horsemen shall set themselves in array at the gate.","8":"And he discovered the covering of Judah, and thou didst look in that day to the armour of the house of the forest.","9":"Ye have seen also the breaches of the city of David, that they are many: and ye gathered together the waters of the lower pool.","10":"And ye have numbered the houses of Jerusalem, and the houses have ye broken down to fortify the wall.","11":"Ye made also a ditch between the two walls for the water of the old pool: but ye have not looked unto the maker thereof, neither had respect unto him that fashioned it long ago.","12":"And in that day did the Lord GOD of hosts call to weeping, and to mourning, and to baldness, and to girding with sackcloth:","13":"And behold joy and gladness, slaying oxen, and killing sheep, eating flesh, and drinking wine: let us eat and drink; for to morrow we shall die.","14":"And it was revealed in mine ears by the LORD of hosts, Surely this iniquity shall not be purged from you till ye die, saith the Lord GOD of hosts.","15":"Thus saith the Lord GOD of hosts, Go, get thee unto this treasurer, *even* unto Shebna, which *is* over the house,","16":"What hast thou here? and whom hast thou here, that thou hast hewed thee out a sepulchre here, *as* he that heweth him out a sepulchre on high, *and* that graveth an habitation for himself in a rock?","17":"Behold, the LORD will carry thee away with a mighty captivity, and will surely cover","18":"He will surely violently turn and toss thee *like* a ball into a large country: there shalt thou die, and there the chariots of thy glory *shall be* the shame of thy lord's house.","19":"And I will drive thee from thy station, and from thy state shall he pull thee down.","20":"And it shall come to pass in that day, that I will call my servant Eliakim the son of Hilkiah:","21":"And I will clothe him with thy robe, and strengthen him with thy girdle, and I will commit thy government into his hand: and he shall be a father to the inhabitants of Jerusalem, and to the house of Judah.","22":"And the key of the house of David will I lay upon his shoulder; so he shall open, and none shall shut; and he shall shut, and none shall open.","23":"And I will fasten him *as* a nail in a sure place; and he shall be for a glorious throne to his father's house.","24":"And they shall hang upon him all the glory of his father's house, the offspring and the issue, all vessels of small quantity, from the vessels of cups, even to all the vessels of flagons.","25":"In that day, saith the LORD of hosts, shall the nail that is fastened in the sure place be removed, and be cut down, and fall; and the burden that *was* upon it shall be cut off: for the LORD hath spoken"}},"tsk":{"1":[{"kopje":"het dal","refs":["Ps 125:2","Jer 21:13"]},{"kopje":"van het gezicht","refs":["1 Sam 3:1","Ps 147:19","Ps 147:20","Spr 29:18","Micha 3:6","Rom 3:2","Rom 9:4","Rom 9:5"]},{"kopje":"Wat","refs":["Gen 21:17","Richt 18:23","1 Sam 11:5","2 Sam 14:5","2 Kon 6:28","Ps 114:5"]},{"kopje":"dat u","refs":["Jes 15:3","Deut 22:8","Jer 48:38"]}],"2":[{"kopje":"die","refs":["Jes 22:12","Jes 22:13","Jes 23:7","Jes 32:13","Amos 6:3-6"]},{"kopje":"uw gesneuvelden","refs":["Jes 37:33","Jes 37:36","Jer 14:18","Jer 38:2","Jer 52:6","Klaagl 2:20","Klaagl 4:9","Klaagl 4:10"]}],"3":[{"kopje":"uw leiders","refs":["Jes 3:1-8","2 Kon 25:4-7","2 Kon 25:18-21","Jer 39:4-7","Jer 52:24-27"]}],"4":[{"kopje":"Wend uw blik","refs":["Ruth 1:20","Ruth 1:21","Jer 4:19","Jer 9:1","Jer 13:17","Luk 1:2"]},{"kopje":"bitter wenen","refs":["Jes 33:7","Jer 6:26","Micha 1:8","Matt 26:75"]},{"kopje":"dring","refs":["Ps 77:3","Jer 8:18","Jer 31:15","Matt 2:18"]}],"5":[{"kopje":"een dag","refs":["Jes 37:3","2 Kon 19:3","Jer 30:7","Amos 5:18-20"]},{"kopje":"vertrapping","refs":["Jes 5:5","Jes 10:6","Jes 25:10"]},{"kopje":"verwarring","refs":["Est 3:15","Micha 7:4"]},{"kopje":"afbraak","refs":["2 Kon 25:10","Klaagl 1:5","Klaagl 2:2"]},{"kopje":"geschreeuw","refs":["Hos 10:8","Matt 24:16","Luk 23:30","Openb 6:16","Openb 6:17"]}],"6":[{"kopje":"Elam","refs":["Jes 21:2","Gen 10:22","Jer 49:35-39"]},{"kopje":"Kir","refs":["Jes 15:1","2 Kon 16:9","Amos 1:5","Amos 9:7"]}],"7":[{"kopje":"vol","refs":["Jes 8:7","Jes 8:8","Jes 10:28-32","Jes 37:34","Jer 39:1-3"]}],"8":[{"kopje":"zal wegnemen","refs":["Jes 36:1-3"]},{"kopje":"de wapens","refs":["1 Kon 7:2","1 Kon 10:17","1 Kon 14:27","1 Kon 14:28","Hoogl 4:4"]}],"11":[{"kopje":"een gracht","refs":["Neh 3:16"]},{"kopje":"u zult","refs":["Jes 8:17","Jes 17:7","Jes 31:1","Jes 37:26","2 Kron 6:6","2 Kron 16:7-9","Jer 33:2","Jer 33:3","Micha 7:7"]}],"12":[{"kopje":"roepen","refs":["2 Kron 35:25","Neh 8:10-13","Neh e.","3":"All thy <span class=\"wl wl-kjv\" data-code=\"H7101\">rulers</span> are <span class=\"wl wl-kjv\" data-code=\"H5074\">fled</span> <span class=\"wl wl-kjv\" data-code=\"H3162\">together,</span> they are <span class=\"wl wl-kjv\" data-code=\"H631\">bound</span> by the <span class=\"wl wl-kjv\" data-code=\"H7198\">archers:</span> all that are <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> in thee are <span class=\"wl wl-kjv\" data-code=\"H631\">bound</span> <span class=\"wl wl-kjv\" data-code=\"H3162\">together,</span> which have <span class=\"wl wl-kjv\" data-code=\"H1272\">fled</span> from far.","4":"Therefore <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> I, Look <span class=\"wl wl-kjv\" data-code=\"H8159\">away</span> from me; I will <span class=\"wl wl-kjv\" data-code=\"H1065\">weep</span> <span class=\"wl wl-kjv\" data-code=\"H4843\">bitterly,</span> <span class=\"wl wl-kjv\" data-code=\"H213\">labour</span> not to <span class=\"wl wl-kjv\" data-code=\"H5162\">comfort</span> me, because of the <span class=\"wl wl-kjv\" data-code=\"H7701\">spoiling</span> of the <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> of my people.","5":"For it is a <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of <span class=\"wl wl-kjv\" data-code=\"H4103\">trouble,</span> and of treading <span class=\"wl wl-kjv\" data-code=\"H4001\">down,</span> and of <span class=\"wl wl-kjv\" data-code=\"H3998\">perplexity</span> by the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts</span> in the <span class=\"wl wl-kjv\" data-code=\"H1516\">valley</span> of <span class=\"wl wl-kjv\" data-code=\"H2384\">vision,</span> <span class=\"wl wl-kjv\" data-code=\"H6979\">breaking</span> down the <span class=\"wl wl-kjv\" data-code=\"H7023\">walls,</span> and of <span class=\"wl wl-kjv\" data-code=\"H7771\">crying</span> to the mountains.","6":"And <span class=\"wl wl-kjv\" data-code=\"H5867\">Elam</span> <span class=\"wl wl-kjv\" data-code=\"H5375\">bare</span> the <span class=\"wl wl-kjv\" data-code=\"H827\">quiver</span> with <span class=\"wl wl-kjv\" data-code=\"H7393\">chariots</span> of <span class=\"wl wl-kjv\" data-code=\"H120\">men</span> and <span class=\"wl wl-kjv\" data-code=\"H6571\">horsemen,</span> and <span class=\"wl wl-kjv\" data-code=\"H7024\">Kir</span> <span class=\"wl wl-kjv\" data-code=\"H6168\">uncovered</span> the shield.","7":"And it shall come to pass, that thy <span class=\"wl wl-kjv\" data-code=\"H4005\">choicest</span> <span class=\"wl wl-kjv\" data-code=\"H6010\">valleys</span> shall be <span class=\"wl wl-kjv\" data-code=\"H4390\">full</span> of <span class=\"wl wl-kjv\" data-code=\"H7393\">chariots,</span> and the <span class=\"wl wl-kjv\" data-code=\"H6571\">horsemen</span> shall <span class=\"wl wl-kjv\" data-code=\"H7896\">set</span> themselves in <span class=\"wl wl-kjv\" data-code=\"H7896\">array</span> at the gate.","8":"And he <span class=\"wl wl-kjv\" data-code=\"H1540\">discovered</span> the <span class=\"wl wl-kjv\" data-code=\"H4539\">covering</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> and thou didst <span class=\"wl wl-kjv\" data-code=\"H5027\">look</span> in that <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> to the <span class=\"wl wl-kjv\" data-code=\"H5402\">armour</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the forest.","9":"Ye have <span class=\"wl wl-kjv\" data-code=\"H7200\">seen</span> also the <span class=\"wl wl-kjv\" data-code=\"H1233\">breaches</span> of the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> of <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> that they are <span class=\"wl wl-kjv\" data-code=\"H7231\">many:</span> and ye gathered <span class=\"wl wl-kjv\" data-code=\"H6908\">together</span> the <span class=\"wl wl-kjv\" data-code=\"H4325\">waters</span> of the <span class=\"wl wl-kjv\" data-code=\"H8481\">lower</span> pool.","10":"And ye have <span class=\"wl wl-kjv\" data-code=\"H5608\">numbered</span> the <span class=\"wl wl-kjv\" data-code=\"H1004\">houses</span> of <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> and the <span class=\"wl wl-kjv\" data-code=\"H1004\">houses</span> have ye broken <span class=\"wl wl-kjv\" data-code=\"H5422\">down</span> to <span class=\"wl wl-kjv\" data-code=\"H1219\">fortify</span> the wall.","11":"Ye <span class=\"wl wl-kjv\" data-code=\"H6213\">made</span> also a <span class=\"wl wl-kjv\" data-code=\"H4724\">ditch</span> between the two <span class=\"wl wl-kjv\" data-code=\"H2346\">walls</span> for the <span class=\"wl wl-kjv\" data-code=\"H4325\">water</span> of the <span class=\"wl wl-kjv\" data-code=\"H3465\">old</span> <span class=\"wl wl-kjv\" data-code=\"H1295\">pool:</span> but ye have not <span class=\"wl wl-kjv\" data-code=\"H5027\">looked</span> unto the <span class=\"wl wl-kjv\" data-code=\"H6213\">maker</span> thereof, neither had <span class=\"wl wl-kjv\" data-code=\"H7200\">respect</span> unto him that <span class=\"wl wl-kjv\" data-code=\"H3335\">fashioned</span> it long ago.","12":"And in that <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> did the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts</span> <span class=\"wl wl-kjv\" data-code=\"H7121\">call</span> to <span class=\"wl wl-kjv\" data-code=\"H1065\">weeping,</span> and to <span class=\"wl wl-kjv\" data-code=\"H4553\">mourning,</span> and to <span class=\"wl wl-kjv\" data-code=\"H7144\">baldness,</span> and to <span class=\"wl wl-kjv\" data-code=\"H2296\">girding</span> with sackcloth:","13":"And behold <span class=\"wl wl-kjv\" data-code=\"H8342\">joy</span> and <span class=\"wl wl-kjv\" data-code=\"H8057\">gladness,</span> <span class=\"wl wl-kjv\" data-code=\"H2026\">slaying</span> <span class=\"wl wl-kjv\" data-code=\"H1241\">oxen,</span> and <span class=\"wl wl-kjv\" data-code=\"H7819\">killing</span> <span class=\"wl wl-kjv\" data-code=\"H6629\">sheep,</span> <span class=\"wl wl-kjv\" data-code=\"H398\">eating</span> <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh,</span> and <span class=\"wl wl-kjv\" data-code=\"H8354\">drinking</span> <span class=\"wl wl-kjv\" data-code=\"H3196\">wine:</span> let us <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> and <span class=\"wl wl-kjv\" data-code=\"H8354\">drink;</span> for to <span class=\"wl wl-kjv\" data-code=\"H4279\">morrow</span> we shall die.","14":"And it was <span class=\"wl wl-kjv\" data-code=\"H1540\">revealed</span> in mine <span class=\"wl wl-kjv\" data-code=\"H241\">ears</span> by the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts,</span> Surely this <span class=\"wl wl-kjv\" data-code=\"H5771\">iniquity</span> shall not be <span class=\"wl wl-kjv\" data-code=\"H3722\">purged</span> from you till ye <span class=\"wl wl-kjv\" data-code=\"H4191\">die,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD</span> of hosts.","15":"Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts,</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">Go,</span> <span class=\"wl wl-kjv\" data-code=\"H935\">get</span> thee unto this <span class=\"wl wl-kjv\" data-code=\"H5532\">treasurer,</span> even unto <span class=\"wl wl-kjv\" data-code=\"H7644\">Shebna,</span> which is over the house,","16":"What hast thou here? and whom hast thou here, that thou hast hewed thee <span class=\"wl wl-kjv\" data-code=\"H2672\">out</span> a <span class=\"wl wl-kjv\" data-code=\"H6913\">sepulchre</span> <span class=\"wl wl-kjv\" data-code=\"H6311\">here,</span> as he that heweth him <span class=\"wl wl-kjv\" data-code=\"H2672\">out</span> a <span class=\"wl wl-kjv\" data-code=\"H6913\">sepulchre</span> on <span class=\"wl wl-kjv\" data-code=\"H4791\">high,</span> and that <span class=\"wl wl-kjv\" data-code=\"H2710\">graveth</span> an <span class=\"wl wl-kjv\" data-code=\"H4908\">habitation</span> for himself in a rock?","17":"Behold, the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> will carry thee <span class=\"wl wl-kjv\" data-code=\"H2904\">away</span> with a <span class=\"wl wl-kjv\" data-code=\"H1397\">mighty</span> <span class=\"wl wl-kjv\" data-code=\"H2925\">captivity,</span> and will <span class=\"wl wl-kjv\" data-code=\"H5844\">surely</span> cover","18":"He will <span class=\"wl wl-kjv\" data-code=\"H6801\">surely</span> violently <span class=\"wl wl-kjv\" data-code=\"H6801\">turn</span> and <span class=\"wl wl-kjv\" data-code=\"H6802\">toss</span> thee like a <span class=\"wl wl-kjv\" data-code=\"H1754\">ball</span> into a <span class=\"wl wl-kjv\" data-code=\"H7342\">large</span> <span class=\"wl wl-kjv\" data-code=\"H776\">country:</span> there shalt thou <span class=\"wl wl-kjv\" data-code=\"H4191\">die,</span> and there the <span class=\"wl wl-kjv\" data-code=\"H4818\">chariots</span> of thy <span class=\"wl wl-kjv\" data-code=\"H3519\">glory</span> shall be the <span class=\"wl wl-kjv\" data-code=\"H7036\">shame</span> of thy <span class=\"wl wl-kjv\" data-code=\"H113\">lord's</span> house.","19":"And I will <span class=\"wl wl-kjv\" data-code=\"H1920\">drive</span> thee from thy <span class=\"wl wl-kjv\" data-code=\"H4673\">station,</span> and from thy <span class=\"wl wl-kjv\" data-code=\"H4612\">state</span> shall he pull thee down.","20":"And it shall come to pass in that <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> that I will <span class=\"wl wl-kjv\" data-code=\"H7121\">call</span> my <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> <span class=\"wl wl-kjv\" data-code=\"H471\">Eliakim</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of Hilkiah:","21":"And I will <span class=\"wl wl-kjv\" data-code=\"H3847\">clothe</span> him with thy <span class=\"wl wl-kjv\" data-code=\"H3801\">robe,</span> and <span class=\"wl wl-kjv\" data-code=\"H2388\">strengthen</span> him with thy <span class=\"wl wl-kjv\" data-code=\"H73\">girdle,</span> and I will <span class=\"wl wl-kjv\" data-code=\"H5414\">commit</span> thy <span class=\"wl wl-kjv\" data-code=\"H4475\">government</span> into his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand:</span> and he shall be a <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> to the <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitants</span> of <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> and to the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of Judah.","22":"And the <span class=\"wl wl-kjv\" data-code=\"H4668\">key</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> will I <span class=\"wl wl-kjv\" data-code=\"H5414\">lay</span> upon his <span class=\"wl wl-kjv\" data-code=\"H7926\">shoulder;</span> so he shall <span class=\"wl wl-kjv\" data-code=\"H6605\">open,</span> and none shall <span class=\"wl wl-kjv\" data-code=\"H5462\">shut;</span> and he shall <span class=\"wl wl-kjv\" data-code=\"H5462\">shut,</span> and none shall open.","23":"And I will <span class=\"wl wl-kjv\" data-code=\"H8628\">fasten</span> him as a <span class=\"wl wl-kjv\" data-code=\"H3489\">nail</span> in a <span class=\"wl wl-kjv\" data-code=\"H539\">sure</span> <span class=\"wl wl-kjv\" data-code=\"H4725\">place;</span> and he shall be for a <span class=\"wl wl-kjv\" data-code=\"H3519\">glorious</span> <span class=\"wl wl-kjv\" data-code=\"H3678\">throne</span> to his <span class=\"wl wl-kjv\" data-code=\"H1\">father's</span> house.","24":"And they shall <span class=\"wl wl-kjv\" data-code=\"H8518\">hang</span> upon him all the <span class=\"wl wl-kjv\" data-code=\"H3519\">glory</span> of his <span class=\"wl wl-kjv\" data-code=\"H1\">father's</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> the <span class=\"wl wl-kjv\" data-code=\"H6631\">offspring</span> and the <span class=\"wl wl-kjv\" data-code=\"H6849\">issue,</span> all <span class=\"wl wl-kjv\" data-code=\"H3627\">vessels</span> of <span class=\"wl wl-kjv\" data-code=\"H6996\">small</span> quantity, from the <span class=\"wl wl-kjv\" data-code=\"H3627\">vessels</span> of <span class=\"wl wl-kjv\" data-code=\"H101\">cups,</span> even to all the <span class=\"wl wl-kjv\" data-code=\"H3627\">vessels</span> of flagons.","25":"In that <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts,</span> shall the <span class=\"wl wl-kjv\" data-code=\"H3489\">nail</span> that is <span class=\"wl wl-kjv\" data-code=\"H8628\">fastened</span> in the <span class=\"wl wl-kjv\" data-code=\"H539\">sure</span> <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> be <span class=\"wl wl-kjv\" data-code=\"H4185\">removed,</span> and be cut <span class=\"wl wl-kjv\" data-code=\"H1438\">down,</span> and <span class=\"wl wl-kjv\" data-code=\"H5307\">fall;</span> and the <span class=\"wl wl-kjv\" data-code=\"H4853\">burden</span> that was upon it shall be cut <span class=\"wl wl-kjv\" data-code=\"H3772\">off:</span> for the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath spoken"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"last","tekst":"Zie Isa 13:1 ."},{"catchword":"het dal des gezichts","tekst":"Het Joodse land wordt een dal genoemd, omdat het rondom heen tussen vele bergen ligt, en zelf heeft; Psa 125:2 . En Jeruzalem wordt genoemd: een dal des gezichts, omdat in die stad veel zieners, dat is veel profeten waren, aan wie zich God de Heere in visioenen, of door gezichten placht te openbaren. Zodat de profeet hier voornamelijk die van Jeruzalem aanspreekt, hun voorzeggende de ellende, die hun was nakende."},{"catchword":"Wat is u nu,","tekst":"Eenigen duiden deze profetie op de tijden van den koning Hizkia, als Sanherib in Juda was ingevallen; anderen verstaan het van de belegering der twee koningen, Pekah en Rezin; zie boven Isa 7 ."},{"catchword":"dat gij altegader","tekst":"Te weten uit schrikt en verbaasdheid, om aldaar rouw te bedrijven; zie Isa 15:3 , en Jer 48:38 ."}],"2":[{"catchword":"Gij,","tekst":"Dat is, gij stad in welk groot rumoer, geraas en gekraak, en groot geruisch pleegt te zijn van vrolijkheid, van zingen en fluiten, van dansen en springen en allerlei ander gewoel."},{"catchword":"Uw","tekst":"Alsof hij zeide: Hoe zijn de zaken dus veranderd? gij placht tevoren kloekmoedig te zijn in den strijd en tegen uwe vijanden te staan, nu zijt gij allen vluchtende en moedeloos, of laat u gevankelijk wegvoeren, gelijk volgt. Anders, aldus [namelijk daarom dat] uwe verslagenen niet zijn verslagen met het zwaard, noch gestorven in den strijd? en zo in vs.3. Alsof hij zeide: Verblijdt gij u daarin, dat velen uwer medeburgers niet door de scherpte des zwaards omgekomen zijn, als eerlijke en dappere krijgslieden plegen, maar dat zij zich van hunne vijanden gevankelijk hebben laten wegvoeren, die hen zeer schandelijk hebben mishandeld? Zie vs.3."},{"catchword":"verslagenen","tekst":"Anders, gekwetsten."}],"3":[{"catchword":"weggevlucht;","tekst":"Niet wetende waar zij zich zullen keren of wenden, of wat zij beginnen zullen."},{"catchword":"schutters","tekst":"Hebreeuws, boog; dat is boogschutters, of mannen van den boog. Anders: zij zijn van den boog gebonden; dat is, alsof hun de handen gebonden waren, dat zij den boog niet spannen kunnen."},{"catchword":"allen,","tekst":"Hebreeuws, al uwe gevondenen; dat is, al degenen, die men van de uwen vindt."},{"catchword":"zij zijn van verre","tekst":"Dat is, terwijl de vijand nog verre van hen was, ja eer zij den vijand zagen. Anders: ver wegvloden."}],"4":[{"catchword":"Wendt","tekst":"Te weten, o gijlieden altegaar, die mij troosten wilt."},{"catchword":"laat mij","tekst":"Hebreeuws, laat mij verbitteren met wenen."},{"catchword":"dringt niet aan,","tekst":"Of, bemoeit u niet verder, en doet geen moeite meer om mij te troosten."},{"catchword":"der dochteren","tekst":"Dat is, van iedere kleine stad in het Joodse land, van welke Jeruzalem als de moederstad is."}],"5":[{"catchword":"van beroering,","tekst":"Of, van getummel, van gedruis, of van gekwel; dat is, een tijd in welken mijn volk van zijne vijanden gekweld en beroerd wordt. Zie 2Ki 19:3 ."},{"catchword":"van den Heere,","tekst":"Dat is, welke God de Heere als een rechtvaardig Rechter door verslagenheid, vanwege der vijanden inval, over hen zal doen komen."},{"catchword":"het dal des gezicht,","tekst":"Zie boven vs.1."},{"catchword":"een dag","tekst":"Dat is, een dag, die de muren verbreken zal."},{"catchword":"des muurs,","tekst":"Of, der muren; te weten der vaste steden in Juda; 2Ki 18:13 ."},{"catchword":"van geschreeuw","tekst":"Alsof hij zeide: De Joden zullen een ijselijk geschrei maken, lopende naar de bergen, om zich aldaar te verbergen voor hunne vijanden."}],"6":[{"catchword":"Elam","tekst":"Versta hier door Elam de Perzen gelijk Isa 21:2 . De zin van dit vs. is: Dat de Perzen en Meden, mitsgaders andere natiën, al gereed en in de wapens waren om het Joodse land aan te tasten en te overheersen."},{"catchword":"de man","tekst":"Anders: de paarden zijn al aan des mans wagens. Versta hier, legerwagens, of strijdwagens der Assyriërs."},{"catchword":"Kir","tekst":"Dat is, de Meden. Kir was een voortreffelijke stad in Medië, die hier gesteld wordt voor geheel Medië-land , of de inwoners deszelven. Zie Isa 15:1 ."},{"catchword":"ontbloot het schild","tekst":"Dat is, het brengt de schilden [versta hieronder ook andere wapens] te voorschijn, en het schikt zich tot den oorlog."}],"7":[{"catchword":"uw","tekst":"O gij dal des gezichts."},{"catchword":"uitgelezen","tekst":"Hebreeuws, de keur uwer dalen, dat is, uw allerbeste en vruchtbaarste lage landen. In het Hebreeuws staat dit en enige volgende verzen in den verleden tijd, naar de wijze der profeten."},{"catchword":"gewisselijk","tekst":"Hebreeuws, zettende hebben zij gezet."},{"catchword":"ter poorten","tekst":"Door de poorten moet men verstaan de vaste steden."}],"8":[{"catchword":"hij","tekst":"Te weten de koning Sanherib."},{"catchword":"zal","tekst":"De profeet spreekt in het Hebreeuws als van ene zaak, die alrede geschied was, alhoewel hetgeen daar hij van spreekt nog eerst geschieden zou. Anders: En men heeft het deksel van Juda ontdekt."},{"catchword":"het deksel","tekst":"Aldus noemt de profeet hier de vastigheden aan de grenzen van het Joodse land. Zodat het deksel van Juda ontdekken is te zeggen, de vaste plaatsen in Juda innemen."},{"catchword":"gij","tekst":"Te weten gij volk van Jeruzalem."},{"catchword":"zien","tekst":"Dat is, gij zult zien wapenen te krijgen uit het wapenhuis om u te verdedigen, op hoop dat gij uzelven uit uwen nood zult kunnen redden. Versta hierbij: doch het zal al vergeefs zijn."},{"catchword":"in het huis","tekst":"Men meent dat hier het tuighuis, of het wapenhuis van het rijk verstaan wordt. Vergelijk 1Ki 7:2 met de aantekening."}],"9":[{"catchword":"bezien","tekst":"Of, voorzien; dat is, beteren."},{"catchword":"der stad Davids,","tekst":"Van de stad Davids, zie 2Sa 5:7 , 2Sa 5:9 ."},{"catchword":"ondersten vijvers","tekst":"Aldus genoemd ten aanzien van den oppersten vijver, van welken gesproken wordt 2Ki 18:17 , en Isa 7:3 ."}],"10":[{"catchword":"de huizen","tekst":"Dat is, de mannen in de huizen, om te weten hoe sterk van volk gij zijt om den vijand wederstand te kunnen doen, en hoeveel levensmiddelen gij zult behoeven. Of naar de letter: Gij zult de huizen, die aan of bij de stadsmuren staan, niet alleen bezichtigen, maar ook tellen en aantekenen, welke en hoevele dat men er zal behoeven af te breken, als men de stadsmuren zal verbeteren."}],"11":[{"catchword":"gracht maken","tekst":"Hebreeuws, ene vergadering; te weten van wateren, gelijk Gen 1:9 ."},{"catchword":"tussen beide","tekst":"Te weten om het water Gihons uit den oppervijver te brengen in den ondervijver; vergelijk 2Ki 20:20 , en 2Ch 32:30 . De zin van deze woorden, en van die woorden vs.8. [ En te dien dage, enz.] tot hiertoe, is deze: Gijlieden zult op alle stukken zeer nauw letten, en gij zult verbeteren aan de steden hetgeen ten tijde uwer vaderen vervallen en verzuimd was; maar gij zult niet opwaarts zien, enz. alsof de profeet zeide: Gij zult u al verlaten op menselijke hulp en middelen, daarentussen zult gij vergeten den Heere uwen noodhelper."},{"catchword":"des ouden vijvers;","tekst":"Zie boven Isa 7:3 ."},{"catchword":"opwaarts","tekst":"Te weten tot God in den hemel, van wien deze plagen over u besloten zijn, en tot wien gij u moest bekeren, wilt gij van Hem geholpen zijn."}],"12":[{"catchword":"te dien dage","tekst":"Zie op vs.1."},{"catchword":"roepen","tekst":"Te weten door iemand van zijne profeten."},{"catchword":"tot kaalheid,","tekst":"Anders: tot kaal maken. Dit placht te zijn een bewijs van hartelijke droefenis. Zie Mic 1:16 ."}],"13":[{"catchword":"Laat ons eten","tekst":"Hebreeuws, eten en drinken; te weten, willen wij."},{"catchword":"want morgen","tekst":"Dit spreken de goddelozen spottenderwijze, alsof zij zeiden: Onze profeten zeggen dat wij haast zullen omgebracht worden; laat ons dan lustig en vrolijk zijn zolang het ons gebeuren mag."}],"14":[{"catchword":"Maar de HEERE","tekst":"Anders: Het is geopenbaard voor mijne oren, die Ik ben de Heere der heirscharen."},{"catchword":"Indien ulieden","tekst":"Een manier van eedzweren. Zie de aantekening Gen 14:23 . De zin is: Zekerlijk, die misdaad zal ulieden niet bedekt, dat is niet vergeven worden."},{"catchword":"totdat","tekst":"Dat is, uw levenlang niet, of nimmermeer. Zie Gen 28:15 . Versta hierbij, tenzij dat gij bijtijds van zonden afstaat."}],"15":[{"catchword":"schatmeester,","tekst":"Of, thesaurier, of bezorgers des huizes. Anders: helpmeester, of helper; dat is, goedgunner dezer goddelozen."},{"catchword":"Sebna,","tekst":"Deze Sebna is naderhand van hofmeester geworden secretaris; gelijk te zien is 2Ki 18:18 ."},{"catchword":"den hofmeester,","tekst":"Hebreeuws, die over het huis is; te weten over des konings huis. Zie de aantekening 1Ki 4:6 ."}],"16":[{"catchword":"Wat hebt gij","tekst":"Alsof hij zeide: Gij hebt hier te Jeruzalem noch erfgoederen, noch bloedvrienden, maar gij zijt hier een vreemdeling, derhalve behoordet gij hier u zo voortreffelijk niet te houden."},{"catchword":"hier,","tekst":"Te weten te Jeruzalem."},{"catchword":"uitgehouwen","tekst":"Dat is, hebt laten uithouwen."}],"17":[{"catchword":"Hij zal u","tekst":"Hebreeuws, overdekkende overdekken; te weten met oneer. Doch anderen vertalen en verklaren dit geheele vs. aldus: Zie, de Heere dekt u met het deksel eens voortreffelijken mans, en Hij overdekt u heerlijk; zodat het is een verhaal van de weldaden, die God hem bewezen heeft."}],"18":[{"catchword":"Hij","tekst":"Te weten de Heere."},{"catchword":"zal u gewisselijk","tekst":"Hebreeuws, Hij zal u rollende rollen, [met] rolling eens bals."},{"catchword":"in een land,","tekst":"Gelijk Gen 34:21 ."},{"catchword":"uw heerlijke","tekst":"Hebreeuws, de wagens uwer heerlijkheid."},{"catchword":"o gij schandvlek","tekst":"Of, [tot] een schandvlek van het huis uws heren."}],"19":[{"catchword":"Ik zal u afstoten","tekst":"Te weten Ik de Heere."},{"catchword":"Hij u","tekst":"Te weten de koning Hizkia uw heer. Dit is vervuld eer Sanherib Jeruzalem belegerde; 2Ki 18:21 ."},{"catch (function bouwHfdnav() {

  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'

  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
