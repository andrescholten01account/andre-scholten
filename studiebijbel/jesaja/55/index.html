l":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"O, alle dorstigen, kom tot de wateren, en u die geen geld heeft, kom, koop en eet, ja kom, koop zonder geld en zonder prijs, wijn en melk!","2":"Waarom weegt u geld uit voor wat geen brood is, en uw arbeid voor wat niet verzadigen kan? Hoor aandachtig naar Mij, en eet het goede, en laat uw ziel zich verlustigen in vettigheid.","3":"Neig uw oor, en kom tot Mij, hoor en uw ziel zal leven; want Ik zal met u een eeuwig verbond maken, *en* *u* *geven* de zekere weldaden[1] van David.","4":"Zie, Ik heb hem *tot* een getuige van de volken gegeven, een vorst en gebieder van de volken.","5":"Zie, u zult een volk roepen, dat u niet kende, en het volk, dat u niet kende, zal tot u lopen, om de wil van de HEERE, uw God, en om de wil van de Heilige van Israël, want Hij heeft u verheerlijkt.","6":"Zoek de HEERE, terwijl Hij te vinden is; roep Hem aan, terwijl Hij nabij is.","7":"De goddeloze verlaat zijn weg, en de onrechtvaardige man zijn gedachten; en hij bekeert zich tot de HEERE, zo zal Hij Zich over hem ontfermen, en tot onze God, want Hij vergeeft menigvuldig.","8":"Want Mijn gedachten zijn niet uw gedachten, en uw wegen zijn niet Mijn wegen, spreekt de HEERE.","9":"Want *zoals* de hemelen hoger zijn dan de aarde, zo zijn Mijn wegen hoger dan uw wegen, en Mijn gedachten dan uw gedachten.","10":"Want zoals de regen en de sneeuw van de hemel neerdaalt, en daarheen niet terugkeert; maar de aarde doorvochtigt, en maakt dat zij voortbrengt en uitspruit, en zaad geeft aan de zaaier, en brood aan de eter;","11":"Zo zal Mijn woord, dat uit Mijn mond uitgaat, *ook* zijn, het zal niet leeg naar Mij terugkeren; maar het zal doen wat Mij behaagt, en het zal voorspoedig zijn in wat, waartoe Ik het zend.","12":"Want in blijdschap zult u uittrekken, en met vrede voortgeleid worden; de bergen en heuvelen zullen geschal maken *met* vrolijk gezang voor uw aangezicht, en alle bomen van het veld zullen de handen samenklappen.","13":"Voor een doorn zal een dennenboom opgaan, voor een distel zal een mirteboom opgaan; en het zal de HEERE wezen tot een naam, tot een eeuwig teken, *dat* niet uitgeroeid zal worden."},"SV":{"1":"O alle gij dorstigen! komt tot de wateren, en gij, die geen geld hebt, komt, koopt en eet, ja komt, koopt zonder geld, en zonder prijs, wijn en melk!","2":"Waarom weegt gijlieden geld uit voor hetgeen geen brood is, en uw arbeid voor hetgeen niet verzadigen kan? Hoort aandachtiglijk naar Mij, en eet het goede, en laat uw ziel in vettigheid zich verlustigen.","3":"Neigt uw oor, en komt tot Mij, hoort en uw ziel zal leven; want Ik zal met u een eeuwig verbond maken, *en* *u* *geven* de gewisse weldadigheden van David.","4":"Ziet, Ik heb hem *tot* een getuige der volken gegeven, een vorst en gebieder der volken.","5":"Ziet, gij zult een volk roepen, dat gij niet kendet, en het volk, dat u niet kende, zal tot u lopen, om des HEEREN uws Gods wil, en om des Heiligen Israëls wil, want Hij heeft u verheerlijkt.","6":"Zoekt den HEERE, terwijl Hij te vinden is; roept Hem aan, terwijl Hij nabij is.","7":"De goddeloze verlate zijn weg, en de ongerechtige man zijn gedachten; en hij bekere zich tot den HEERE, zo zal Hij Zich Zijner ontfermen, en tot onzen God, want Hij vergeeft menigvuldiglijk.","8":"Want Mijn gedachten zijn niet ulieder gedachten, en uw wegen zijn niet Mijn wegen, spreekt de HEERE.","9":"Want *gelijk* de hemelen hoger zijn dan de aarde, alzo zijn Mijn wegen hoger dan uw wegen, en Mijn gedachten dan ulieder gedachten.","10":"Want gelijk de regen en de sneeuw van den hemel nederdaalt, en derwaarts niet wederkeert; maar doorvochtigt de aarde, en maakt, dat zij voortbrenge en uitspruite, en zaad geve den zaaier, en brood den eter;","11":"Alzo zal Mijn woord, dat uit Mijn mond uitgaat, *ook* zijn, het zal niet ledig tot Mij wederkeren; maar het zal doen, hetgeen Mij behaagt, en het zal voorspoedig zijn *in* hetgeen, waartoe Ik het zende.","12":"Want in blijdschap zult gijlieden uittrekken, en met vrede voortgeleid worden; de bergen en heuvelen zullen geschal maken *met* vrolijk gezang voor uw aangezicht, en alle bomen des velds zullen de handen samenklappen.","13":"Voor een doorn zal een denneboom opgaan, voor een distel zal een mirteboom opgaan; en het zal den HEERE wezen tot een naam, tot een eeuwig teken, *dat* niet uitgeroeid zal worden."},"KJV":{"1":"Ho, every one that thirsteth, come ye to the waters, and he that hath no money; come ye, buy, and eat; yea, come, buy wine and milk without money and without price.","2":"Wherefore do ye spend money for *that which is* not bread? and your labour for *that which* satisfieth not? hearken diligently unto me, and eat ye *that which is* good, and let your soul delight itself in fatness.","3":"Incline your ear, and come unto me: hear, and your soul shall live; and I will make an everlasting covenant with you, *even* the sure mercies of David.","4":"Behold, I have given him *for* a witness to the people, a leader and commander to the people.","5":"Behold, thou shalt call a nation *that* thou knowest not, and nations *that* knew not thee shall run unto thee because of the LORD thy God, and for the Holy One of Israel; for he hath glorified","6":"Seek ye the LORD while he may be found, call ye upon him while he is near:","7":"Let the wicked forsake his way, and the unrighteous man his thoughts: and let him return unto the LORD, and he will have mercy upon him; and to our God, for he will abundantly pardon.","8":"For my thoughts *are* not your thoughts, neither *are* your ways my ways, saith the LORD.","9":"For *as* the heavens are higher than the earth, so are my ways higher than your ways, and my thoughts than your thoughts.","10":"For as the rain cometh down, and the snow from heaven, and returneth not thither, but watereth the earth, and maketh it bring forth and bud, that it may give seed to the sower, and bread to the eater:","11":"So shall my word be that goeth forth out of my mouth: it shall not return unto me void, but it shall accomplish that which I please, and it shall prosper *in the thing* whereto I sent","12":"For ye shall go out with joy, and be led forth with peace: the mountains and the hills shall break forth before you into singing, and all the trees of the field shall clap *their* hands.","13":"Instead of the thorn shall come up the fir tree, and instead of the brier shall come up the myrtle tree: and it shall be to the LORD for a name, for an everlasting sign *that* shall not be cut off."}},"tsk":{"1":[{"kopje":"O","refs":["Ruth 4:1","Spr 1:21-23","Spr 8:4","Zach 2:6"]},{"kopje":"alle","refs":["Jes 41:17","Jes 41:18","Ps 42:2","Ps 42:3","Ps 63:2","Ps 143:6","Joh 4:10-14","Joh 7:37","Joh 7:38","Openb 21:6","Openb 22:1","Openb 22:17"]},{"kopje":"en","refs":["Matt 13:44","Openb 3:18"]},{"kopje":"koop wijn","refs":["Hoogl 1:2","Hoogl 1:4","Hoogl 5:1","Zach 9:15","Zach 10:7","Matt 26:29","Joh 2:3-10"]},{"kopje":"melk","refs":["Joël 3:18","1 Kor 3:2","1 Petr 2:2"]},{"kopje":"zonder geld","refs":["Jes 52:3","Rom 3:24","Ef 2:4-8"]}],"2":[{"kopje":"weegt u","refs":["Jes 44:20","Jer 2:13","Hos 8:7","Hos 12:2","Hab 2:13","Matt 15:9","Luk 15:15","Luk 15:16","Rom 9:31","Rom 10:2","Rom 10:3","Fil 3:4-7","Hebr 13:9"]},{"kopje":"uit","refs":["Jes 46:6"]},{"kopje":"Hoor aandachtig","refs":["Jes 51:1","Jes 51:4","Jes 51:7","Ex 15:26","Deut 11:13","Ps 34:12","Spr 1:33","Spr 7:23","Spr 8:32","Mark 7:14","Rom 10:17"]},{"kopje":"eet","refs":["Jes 25:6","Ps 22:27","Ps 36:9","Ps 63:6","Spr 9:5","Jer 31:14","Matt 22:4","Luk 15:23","Joh 6:48-58"]}],"3":[{"kopje":"Neig","refs":["Ps 78:1","Ps 119:112","Spr 4:20"]},{"kopje":"kom -kjv\" data-code=\"H7725\">return</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and he will have <span class=\"wl wl-kjv\" data-code=\"H7355\">mercy</span> upon him; and to our <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> for he will <span class=\"wl wl-kjv\" data-code=\"H7235\">abundantly</span> pardon.","8":"For my <span class=\"wl wl-kjv\" data-code=\"H4284\">thoughts</span> are not your <span class=\"wl wl-kjv\" data-code=\"H4284\">thoughts,</span> neither are your <span class=\"wl wl-kjv\" data-code=\"H1870\">ways</span> my <span class=\"wl wl-kjv\" data-code=\"H1870\">ways,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the LORD.","9":"For as the <span class=\"wl wl-kjv\" data-code=\"H8064\">heavens</span> are <span class=\"wl wl-kjv\" data-code=\"H1361\">higher</span> than the <span class=\"wl wl-kjv\" data-code=\"H776\">earth,</span> so are my <span class=\"wl wl-kjv\" data-code=\"H1870\">ways</span> <span class=\"wl wl-kjv\" data-code=\"H1361\">higher</span> than your <span class=\"wl wl-kjv\" data-code=\"H1870\">ways,</span> and my <span class=\"wl wl-kjv\" data-code=\"H4284\">thoughts</span> than your thoughts.","10":"For as the <span class=\"wl wl-kjv\" data-code=\"H1653\">rain</span> cometh <span class=\"wl wl-kjv\" data-code=\"H3381\">down,</span> and the <span class=\"wl wl-kjv\" data-code=\"H7950\">snow</span> from <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven,</span> and <span class=\"wl wl-kjv\" data-code=\"H7725\">returneth</span> not thither, but <span class=\"wl wl-kjv\" data-code=\"H7301\">watereth</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">earth,</span> and maketh it bring <span class=\"wl wl-kjv\" data-code=\"H3205\">forth</span> and <span class=\"wl wl-kjv\" data-code=\"H6779\">bud,</span> that it may <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> <span class=\"wl wl-kjv\" data-code=\"H2233\">seed</span> to the <span class=\"wl wl-kjv\" data-code=\"H2232\">sower,</span> and <span class=\"wl wl-kjv\" data-code=\"H3899\">bread</span> to the eater:","11":"So shall my <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> be that goeth <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> out of my <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth:</span> it shall not <span class=\"wl wl-kjv\" data-code=\"H7725\">return</span> unto me <span class=\"wl wl-kjv\" data-code=\"H7387\">void,</span> but it shall <span class=\"wl wl-kjv\" data-code=\"H6213\">accomplish</span> that which I <span class=\"wl wl-kjv\" data-code=\"H2654\">please,</span> and it shall <span class=\"wl wl-kjv\" data-code=\"H6743\">prosper</span> in the thing whereto I sent","12":"For ye shall go <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> with <span class=\"wl wl-kjv\" data-code=\"H8057\">joy,</span> and be led <span class=\"wl wl-kjv\" data-code=\"H2986\">forth</span> with <span class=\"wl wl-kjv\" data-code=\"H7965\">peace:</span> the <span class=\"wl wl-kjv\" data-code=\"H2022\">mountains</span> and the <span class=\"wl wl-kjv\" data-code=\"H1389\">hills</span> shall break <span class=\"wl wl-kjv\" data-code=\"H6476\">forth</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> you into <span class=\"wl wl-kjv\" data-code=\"H7440\">singing,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H6086\">trees</span> of the <span class=\"wl wl-kjv\" data-code=\"H7704\">field</span> shall <span class=\"wl wl-kjv\" data-code=\"H4222\">clap</span> their hands.","13":"Instead of the <span class=\"wl wl-kjv\" data-code=\"H5285\">thorn</span> shall come <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> the fir <span class=\"wl wl-kjv\" data-code=\"H1265\">tree,</span> and instead of the <span class=\"wl wl-kjv\" data-code=\"H5636\">brier</span> shall come <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> the myrtle <span class=\"wl wl-kjv\" data-code=\"H1918\">tree:</span> and it shall be to the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> for a <span class=\"wl wl-kjv\" data-code=\"H8034\">name,</span> for an <span class=\"wl wl-kjv\" data-code=\"H5769\">everlasting</span> <span class=\"wl wl-kjv\" data-code=\"H226\">sign</span> that shall not be cut off."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"O","tekst":"Het Hebreeuwse woord hol, hetwelk elders zoveel is als wee, is hier een woord van opwekking."},{"catchword":"alle gij dorstigen","tekst":"Gij allen, die naar de gerechtigheid zeer verlangt, gevoelende uwe zonden en ellenden; Psa 42:3 ; Mat 5:6 ; Joh 7:37 ."},{"catchword":"de wateren,","tekst":"Dat is, tot mij, of tot de hemelse goederen, die Ik u door het Evangelie aanbied, namelijk vergeving der zonden en de gerechtigheid, die ons omniet en zonder enige onzer verdiensten van God in Christus gegeven worden; idem, de gaven van den Heiligen Geest, en eindelijk het eeuwige leven; waartoe wij door het gebod moeten komen; Joh 7:37 ."},{"catchword":"die geen geld hebt,","tekst":"Hebreeuws, die geen geld heeft; dat is, die in of bij uzelven gene waardigheid noch verdiensten heeft."},{"catchword":"eet,","tekst":"Dat is, geniet. Alzo ook vs.2, eten voor genieten, is zeer algemeen bij de Hebreën. Zie de aantekening Job 21:25 ."},{"catchword":"komt, koopt zonder geld,","tekst":"Dat is, ontvangt omniet."},{"catchword":"wijn en melk","tekst":"Wijn en melk betekent hier hetzelfde, dat straks door water is te kennen gegeven; te weten alles wat tot het geestelijke leven van node is."}],"2":[{"catchword":"Waarom","tekst":"Dat is, waarom doet gij veel vergeefse kosten en moeite, drijvende uw afgoderij en bijgeloof, daar toch door zulke middelen geen leven noch vaste troost te verkrijgen is?"},{"catchword":"voor hetgeen geen brood is,","tekst":"Hebreeuws, voor niet brood; aldus noemt hij de valse leer en bijgelovigheden, die het hart der mensen niet kunnen spijzigen of verzadigen; als daar was de leer schriftgeleerden en Farizeën van eigen gerechtigheid, buiten Christus en zijne gerechtigheid."},{"catchword":"uw arbeid","tekst":"Dat is, het geld, dat gijlieden met uwen arbeid gewonnen hebt."},{"catchword":"voor hetgeen niet","tekst":"Hebreeuws, om niet ter verzadiging."},{"catchword":"Hoort aandachtiglijk","tekst":"Hebreeuws, hoort horende; dat is hoort aandachtiglijk, naarstiglijk, of ernstiglijk naar mij."},{"catchword":"eet het goede,","tekst":"Dit is ook al van een geestelijk eten te verstaan, gelijk ook wat er volgt."}],"3":[{"catchword":"Neigt uw oor,","tekst":"Dit spreekt God de Vader."},{"catchword":"uw ziel","tekst":"Dat is, zij zal troost en vreugde hebben als zij mij hoort."},{"catchword":"maken,","tekst":"Zie Gen 15:18 , en Jer 34:18-19 ."},{"catchword":"en u geven","tekst":"Deze woorden van Paulus, Act 13:34 , waar aldus staat: Ik zal ulieden die heilige en trouwe [beloften] van David geven."},{"catchword":"Davids","tekst":"Dat is, die Ik David heb beloofd. Zie 2Sa 7:13 , en Psa 89:29 . Tot voltrekking dezer weldadigheden was het van node dat Christus van de doden zou opstaan en alzo tot zijn eeuwig rijk ingaan. Tot zulk einde verhaalt de apostel Paulus deze spreuk, Act 13:34 om de opstanding van Christus te bewijzen. Eenigen verstaan hier door David den Heere Christus, alzo dat door de weldadigheden van David te verstaan zouden zijn de weldadigheden, die Christus het volk Gods verwerven en geven zou. Alzo ook Jer 30:9 ; Eze 34:23 , enz."}],"4":[{"catchword":"Ik heb","tekst":"Te weten God de Vader."},{"catchword":"Hem","tekst":"Te weten Christus, den zoon van David, die ook Davids Heere en Verlosser is."},{"catchword":"tot een getuige","tekst":"Dat is tot een profeet en leraar, die de hemelse waarheid betuigt; of die van mijnen wil getuigenis geeft."},{"catchword":"gebieder","tekst":"Om te gebieden en te bevelen wat Hem belieft."}],"5":[{"catchword":"gij zult een volk roepen,","tekst":"O Jezus Christus."},{"catchword":"dat gij niet kendet,","tekst":"Dat is, naar hetwelk gij niet vraagdet, maar liet het op zijne wegen wandelen. Zie Act 14:16 . Of, dat gij voor uw volk niet kendet."},{"catchword":"het volk,","tekst":"Hebreeuws, een volk, die u niet kenden, zullen tot u lopen, dat is, die naar u niet vraagden, noch u voor hunnen Zaligmaker kenden."},{"catchword":"zal tot u lopen,","tekst":"Dat is, met groten ijver en begeerte uwe leer aannemen."},{"catchword":"om des Heiligen","tekst":"Of, en tot den Heilige Israëls; zie Psa 71:22 ."},{"catchword":"want Hij heeft u verheerlijkt","tekst":"Of als Hij u [o Christus] zal verheerlijkt hebben; namelijk door de opstanding uit de doden, Rom 1:4 , en door de verhoging aan zijne rechterhand in de hemelen, vanwaar Hij den Heiligen Geest op de apostelen zenden zou, Hand. 2; doende grote wonderen door de kracht van denzelven; Act 3:13 , en Act 4:10 ."}],"6":[{"catchword":"terwijl Hij te vinden is;","tekst":"Dat is, terwijl Hij zijne goedertierenheid den armen zondaren aanbiedt, dezelven tot boete en bekering nodigende; zie Psa 32:6 . Het zijn de woorden van den profeet."}],"7":[{"catchword":"ongerechtige","tekst":"Hebreeuws, de man der boosheid, of der ongerechtigheid."},{"catchword":"vergeeft menigvuldiglijk","tekst":"Hebreeuws, Hij vermeerdert te vergeven, of met vergeven."}],"8":[{"catchword":"Want Mijn gedachten","tekst":"Hier spreekt God de Heere wederom, en het is zoveel als Hij zeide: Gij mensen zijt van zulken aard, dat gij het niet lichtelijk vergeeft noch vergeet als u iemand vertoornd heeft, inzonderheid als hij het te grof maakt; maar Ik vergeef spoedig al degenen, wien het leed is dat zij mij vertoornd hebben en die mij om vergeving bidden. Ik ben ook niet wankelmoedig, of ongetrouw, gelijk de mensen, maar al wat Ik beloof doe Ik gewisselijk."}],"9":[{"catchword":"gelijk","tekst":"Of, [zoveel] vergelijk hiermede Psa 103:11 ."}],"10":[{"catchword":"zij voortbrenge","tekst":"Te weten de aarde."}],"11":[{"catchword":"Mijn woord,","tekst":"Dat is, het woord mijner belofte."},{"catchword":"niet ledig","tekst":"Dat is, niet zonder iets uit te richten."},{"catchword":"voorspoedig zijn","tekst":"Of, geluk hebben, wel gedijen."},{"catchword":"in hetgeen","tekst":"Of, tot welk, of werwaarts."}],"12":[{"catchword":"uittrekken,","tekst":"Te weten uit de geestelijke gevangenis van den duivel, nadat gij door Christus zult verlost zijn, waarvan de Babylonische gevangenschap een beeld was."},{"catchword":"de bergen","tekst":"Zie Isa 35:1 . De zin is dat alle creaturen, al is het dat zij ongevoelig zijn, nochtans het werk des Heeren met vreugde zullen helpen bevorderen. Zie de aantekening Psa 98:8 ."}],"13":[{"catchword":"Voor een doorn","tekst":"Dat is, die tevoren al distelen en doornen waren, dat is onvruchtbaar en tot alle goed onbekwaam, zullen vruchtbaar worden, en als schone bomen opwassen, nadat zij door den Heiligen Geest zullen vernieuwd en wedergeboren zijn. Zie dergelijke manier van spreken Isa 41:19 ."},{"catchword":"het zal den HEERE","tekst":"De zin is: Door de verlossing en heiliging der kerk zal God zijn oneindige goedheid en almogendheid inzonderheid doen blijken, waarom Hij in der eeuwigheid zal geloofd en geprezen worden."},{"catchword":"een eeuwig teken,","tekst":"Te weten een gedenkteken."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"O [The Hebrew particle hoi, which elsewhere is as much as wo, is here a word of excitement or stirring up] all the thirsty, [all ye that greatly long after righteousness, being sensible of your own sins and miseries, Psal.42.3. Mat 5:6. Joh.7.37.] come o the waters, [that is, unto me, or to the heavenly goods which I offer unto you by the Gospel, namely forgiveness of sins and righteousness, which are given us of God in Christ for nought, and without any merits or deserts of our own, as followeth in the text: also the gifts of the holy ghost, and lastly life eternal, whereunto we must come by faith, Joh.7.37.] and he that hath no money; [that is, ye that in or of yourselves have no worthiness or merits] come buy, and eat, [that is enjoy. So likewise verse 2 eating for enjoying is very usual and common among the Hebrews. See Job chap.2 1. The Annotations on ver.25.] yea come, buy wine and milk [wine and milk signify here the same which was intimated even now by water, to wit, all things requisite and necessary for the spiritual life] without money and without price, [that is, receive them for nothing.]"}],"2":[{"catchword":null,"tekst":"Wherefore do ye weigh out money for that which is not bread, etc. your labour for which cannot satisfy? [That is, wherefore are ye at great costs and charges in vain, and take pains and toil to no purpose in committing your Idolatry and superstition, whereas indeed by such kind of means no life nor sound comfort is to be had? Wherefore do ye weigh out money for that which is no bread? Heb. For not bread. So he calleth false doctrine and superstition, which cannot seed or satisfy the hearts of men; as for example, the doctrine of the Scribes and Pharisees concerning a mans own righteousness without Christ and his righteousness. (and your labour) that is, that which ye have gotten and gained by your labour. (for that which cannot satisfy) Heb. Not to satisfy] hearken attentively unto me [Heb. Hearken hearkening, etc. that is, hearken attentively, diligently, or earnestly unto me] and eat that which is good [This is also to be understood of a spiritual eating, as also that which followeth] and let thy soul delight in fatness."}],"3":[{"catchword":null,"tekst":"Incline your ear and come unto me, [God the father speaketh this] hear and your soul shall live: [that is, it shall have comfort and joy when it heareth me] for I will make an everlasting covenant with thee, [See Gen.15.on ver.18. and Jer 34:18,19.] (and give thee,) the sure mercies of David, [these words of Paul, Act 13:34. where it is said thus, I will give you those holy and faithful (promises) of David (the sure mercies of David) that is, the mercies which I have promised unto David. See 2 Sam.7.13. and Psal.89.29. For the accomplishing of these mercies, it was requisite and needful that Christ should rise from the dead, and so enter into his everlasting kingdom: for which end the Apostles rehearseth this passage of the Prophet, Act 13:34. to prove the resurrection of Christ. Some understand here by David the Lord Christ; so that by the mercies which Christ should purchase for and give unto the people of God. So likewise Jer 30:9. Eze 34:29, etc.]"}],"4":[{"catchword":null,"tekst":"Behold I [To wit, God the father] have given him [to wit, Christ, the son of David, who was also David&acirc;&euro;&trade;s Lord and redeemer] (for) a witness of the nations, [that is, for a Prophet and Teachers that should witness the heavenly truth, or that should give testimony concerning my will] a prince and commander [to command and enjoin whatsoever he pleaseth] of the nations."}],"5":[{"catchword":null,"tekst":"Behold, thou [O Jesus Christ] shalt call a people that thou knowest not [that is, for whom thou didst not care, but didst suffer them to walk in their own ways. See Act 14:16. or whom thou dist not know and take to be thy people] and the people that knew not thee, [Heb. A people or nation that knew (in the plural number) thee not; that is, that cared not for thee, nor acknowledged thee for their Saviour] shall run unto thee, [that is, receive and embrace thy doctrine with great zeal and desire] for the LORD thy Gods sake, and for the holy One of Israels sake [or, and unto the holy One of Israel. See Psal.71.on ver.22.] for he hath glorified thee. [or when he shall glorify thee, O Christ; namely by the resurrection from the dead, Rom 1:4. and by the exaltation on his right hand in the heavens, from whence he should send the holy Ghost upon the Apostles, Act 3:3. and 4.10.]"}],"6":[{"catchword":null,"tekst":"Seek the LORD while he is to be found: call upon him while he is near. [That is, while he offereth his mercy unto poor sinners, calling and inverting them to repentance and conversion. See Psal.32.6. they are the words of the Prophet]"}],"7":[{"catchword":null,"tekst":"Let the wicked forsake his way, and the unrighteous man [Heb. The man of wickedness, or of iniquity] his thoughts: and let him turn unto the LORD, then will he have mercy upon him; and to our God, for he pardoneth abundantly. Heb. He increaseth to pardon, or with pardoning.]"}],"8":[{"catchword":null,"tekst":"For my thoughts are not your thoughts, neither are your ways my ways, saith the LORD. [Here God speaketh again, and it is as much as if he had said, ye men are of such a nature and disposition that ye will not easily forgive and forget when any one offendeth you, especially when he exceedeth therein: but I do soon forgive all those that are forty that they have offended me, and pray unto me for pardon and forgiveness. Neither am I wavering or unfaithful as men are, but whatsoever I promise I do surely perform.]"}],"9":[{"catchword":null,"tekst":"For (as) [Or (as much as) the heavens are higher then the earth, so are my thoughts higher then your thoughts, and my ways then your ways. [Compare herewith Psal.103.vers.11.]"}],"10":[{"catchword":null,"tekst":"For as the rain and the snow cometh down from heaven, and returneth not thither; but it moisteneth thereby, [to wit, the earth] and causeth it to bring forth and bud, to give seed to the sower, and bread to the eater:"}],"11":[{"catchword":null,"tekst":"So shall (also) my word be [That is, the word of my promise] that goeth forth out of my mouth, it shall not return unto me empty: [That is, without doing something] but it shall do that which pleaseth me, and it shall be prosperous [or have good success, prosper (in) that whereto [or for which, or whither] I send it."}],"12":[{"catchword":null,"tekst":"For ye shall go out [To wit, out of the spiritual captivity of the Devil, after ye shall be redeemed by Christ, whereof the Babylonian captivity was type] with joy, and be led forth with peace: the mountains and hills shall make a sound (with) joyful singing, before thy face, and all the trees of the field shall clap (their) hands together. See Isa 35:1. 1 Chron.16.33. The meaning is, that all creatures, though they be insensible, yet they shall help to advance and further the work of God with joy. See the Annotat.Psal.93 on verse 8.]"}],"13":[{"catchword":null,"tekst":"For a thorn (there) shall come up a fir-tree; for a thistle (there) shall come up a myrtle-tree: [That is, they that were formerly like briers and thorns, that is unfruitful and unfit for any good work, they shall become fruitful, and grow up like fair and goodly trees, after they shall be renewed and born again by the holy Ghost. See the like phrases above chap.41.19.] and it shall be to the LORD for a name, and for an everlasting token, [to wit a memorial] (that) shall not be cut off. [the meaning is, by the redemption and sanctification of the Church, God will especially manifest his goodness and omnipotence, for which he shall be praised and magnified forever.]"}]}}};

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');

}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;

const concordCache = {};

  if (!code) return null;

  try {
    const res = await fetch(`../../${map}/${code}.json`);

  } catch (e) { cache[code] = null; }

}

const popupCache = {};

  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];

// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;

document.addEventListener('mouseover', e => {

  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
