ten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Want zie, de Heere, HEERE van de heerscharen[1], zal van Jeruzalem en van Juda wegnemen de stok en de staf, elke stok van het brood, en elke stok van het water;","2":"De held en de krijgsman, de rechter en de profeet, en de waarzegger, en de oude;","3":"De leider van vijftig, en de aanzienlijke, en de raadsman, en de wijze onder de werkmeesters, en hem die welbespraakt is.","4":"En Ik zal jongelingen stellen tot hun vorsten, en kinderen zullen over hen heersen;","5":"En het volk zal gedrongen worden, de een zal zijn tegen de ander, en ieder tegen zijn naaste; de jongeling zal zich brutaal gedragen tegen de oude, de verachte tegen de eerlijke.","6":"Wanneer iemand zijn broeder uit het huis van zijn vader zal aangrijpen, en zegt: U hebt een kleed, wees onze leider, laat toch deze puinhoop onder uw hand wezen;","7":"Dan zal hij op die dag zijn hand opheffen, en zeggen: Ik kan geen heelmeester wezen; er is ook geen brood en geen kleed in mijn huis; zet mij niet aan tot leider van het volk.","8":"Want Jeruzalem is gestruikeld, en Juda is gevallen, omdat hun tong en hun daden tegen de HEERE zijn, om de ogen van Zijn heerlijkheid te verbitteren.","9":"Het gelaat van hun aangezicht getuigt tegen hen, en hun zonden spreken zij vrij uit, net als Sodom; zij verbergen ze niet. Wee hun ziel; want zij doen zichzelf kwaad.","10":"Zegt de rechtvaardige, dat het hem goed zal gaan; dat zij de vrucht van hun werken zullen eten.","11":"Wee de goddeloze, het zal hem kwalijk gaan, want de vergelding van zijn handen zal hem overkomen.","12":"De drijvers van Mijn volk zijn kinderen, en vrouwen heersen over hen. O Mijn volk! die u leiden, verleiden u, en de weg van uw paden slokken zij in.","13":"De HEERE stelt Zich op om te pleiten, en Hij staat om de volken te richten.","14":"De HEERE komt ten gerichte tegen de oudsten van Zijn volk en hun vorsten, want u hebt deze wijngaard verteerd; de roof van de ellendige is in uw huizen.","15":"Wat bezielt u, dat u Mijn volk verbrijzelt, en de aangezichten van de ellendigen vermaalt? spreekt de Heere, HEERE van de heerscharen[1].","16":"Verder zegt de HEERE: Omdat de dochters van Sion zich verheffen, en gaan met uitgestrekte hals, en lonken met de ogen, al gaande en trippelende daarheen treden, en alsof haar voeten gebonden waren.","17":"Zo zal de Heere de schedel van de dochters van Sion schurftig maken, en de HEERE zal haar schaamte ontbloten.","18":"Op diezelfde dag zal de Heere wegnemen het sieraad van de kousebanden, en de netjes, en de maantjes,","19":"De reukdoosjes, en de kleine ketentjes, en de glinsterende kledingen,","20":"De hoofdkroning, en de armversierselen, en de bindselen, en de reukballetjes, en de oorringen,","21":"De ringen en de voorhoofdsierselen,","22":"De stellen extra kleren, en de manteltjes, en de hoedjes, en de buidels,","23":"De spiegels, en de fijnlinnen deksels, en de hulledoeken, en de sluiers.","24":"En het zal gebeuren, dat er voor specerij stank zal zijn, en een touw voor een gordel, en kaalheid in plaats van haarvlechten, en omgording van een zak in plaats van een wijde rok, en verbranding in plaats van schoonheid.","25":"Uw mannen zullen door het zwaard vallen, en uw helden in de strijd.","26":"En haar poorten zullen treuren, en leed dragen, en zij zal, leeggemaakt, op de aarde zitten."},"SV":{"1":"Want ziet, de Heere, HEERE der heirscharen, zal van Jeruzalem en van Juda wegnemen den stok en den staf, allen stok des broods, en allen stok des waters;","2":"Den held en den krijgsman, den rechter en den profeet, en den waarzegger, en den oude;","3":"Den overste van vijftig, en den aanzienlijke, en den raadsman, en den wijze onder de werkmeesters, en dien, die kloek ter tale is.","4":"En Ik zal jongelingen stellen *tot* hun vorsten, en kinderen zullen over hen heersen;","5":"En het volk zal gedrongen worden, de een zal zijn tegen den ander, en een iegelijk tegen zijn naaste; de jongeling zal stout zijn tegen den oude, de verachte tegen den eerlijke.","6":"Wanneer iemand zijn broeder uit het huis zijns vaders zal aangrijpen, *zeggende*: Gij hebt een kleed, wees ons ten overste, laat toch dezen aanstoot onder uw hand wezen;","7":"*Zo* zal hij in dien dag *zijn* *hand* opheffen, zeggende: Ik kan geen heelmeester wezen; er is ook geen brood en geen kleed in mijn huis; zet mij niet tot een overste des volks.","8":"Want Jeruzalem heeft aangestoten, en Juda is gevallen, dewijl hun tong en zijn handelingen tegen den HEERE zijn, om de ogen Zijner heerlijkheid te verbitteren.","9":"Het gelaat huns aangezichts getuigt tegen hen, en hun zonden spreken zij vrij uit, gelijk Sodom; zij verbergen ze niet. Wee hunlieder ziel; want zij doen zichzelven kwaad.","10":"Zegt den rechtvaardige, dat het *hem* wel gaan zal; dat zij de vrucht hunner werken zullen eten.","11":"Wee den goddeloze, het zal *hem* kwalijk gaan, want de vergelding zijner handen zal hem geschieden.","12":"De drijvers Mijns volks zijn kinderen, en vrouwen heersen over hetzelve. O Mijn volk! die u leiden, verleiden *u*, en den weg uwer paden slokken zij in.","13":"De HEERE stelt Zich om te pleiten, en Hij staat, om de volken te richten.","14":"De HEERE komt ten gerichte tegen de oudsten Zijns volks en deszelfs vorsten, want gijlieden hebt dezen wijngaard verteerd; de roof des ellendigen is in uwe huizen.","15":"Wat is ulieden, dat gij Mijn volk verbrijzelt, en de aangezichten der ellendigen vermaalt? spreekt de Heere, HEERE der heirscharen.","16":"Verder zegt de HEERE: Daarom dat de dochteren van Sion zich verheffen, en gaan met uitgestrekten hals, en lonken met de ogen, al gaande en trippelende daarhenen treden, en alsof haar voeten gebonden waren.","17":"Zo zal de Heere den schedel der dochteren van Sion schurftig maken, en de HEERE zal haar schaamte ontbloten.","18":"Ten zelfden dage zal de Heere wegnemen het sieraad der kousebanden, en de netjes, en de maantjes,","19":"De reukdoosjes, en de kleine ketentjes, en de glinsterende kledingen,","20":"De hoofdkroning, en de armversierselen, en de bindselen, en de reukballetjes, en de oorringen,","21":"De ringen en de voorhoofdsierselen,","22":"De wisselklederen, en de manteltjes, en de hoedjes, en de buidels,","23":"De spiegels, en de fijn-linnen deksels, en de hulledoeken, en de sluiers.","24":"En het zal geschieden, dat er voor specerij stank zal zijn, en lossigheid voor een gordel, en kaalheid in plaats van haarvlechten, en omgording eens zaks in plaats van een wijden rok, en verbranding in plaats van schoonheid.","25":"Uw mannen zullen door het zwaard vallen, en uw helden in den strijd.","26":"En haar poorten zullen treuren, en leed dragen, en zij zal, ledig gemaakt zijnde, op de aarde zitten."},"KJV":{"1":"For, behold, the Lord, the LORD of hosts, doth take away from Jerusalem and from Judah the stay and the staff, the whole stay of bread, and the whole stay of water,","2":"The mighty man, and the man of war, the judge, and the prophet, and the prudent, and the ancient,","3":"The captain of fifty, and the honourable man, and the counsellor, and the cunning artificer, and the eloquent orator.","4":"And I will give children *to be* their princes, and babes shall rule","5":"And the people shall be oppressed, every one by another, and every one by his neighbour: the child shall behave himself proudly against the ancient, and the base against the honourable.","6":"When a man shall take hold of his brother of the house of his father, *saying*, Thou hast clothing, be thou our ruler, and *let* this ruin *be* under thy hand:","7":"In that day shall he swear, saying, I will not be an healer; for in my house *is* neither bread nor clothing: make me not a ruler of the people.","8":"For Jerusalem is ruined, and Judah is fallen: because their tongue and their doings *are* against the LORD, to provoke the eyes of his glory.","9":"The shew of their countenance doth witness against them; and they declare their sin as Sodom, they hide *it* not. Woe unto their soul! for they have rewarded evil","10":"Say ye to the righteous, that *it shall be* well *with him*: for they shall eat the fruit of their doings.","11":"Woe unto the wicked! *it shall be* ill *with him*: for the reward of his hands shall be given","12":"*As for* my people, children *are* their oppressors, and women rule over them. O my people, they which lead thee cause *thee* to err, and destroy the way of thy paths.","13":"The LORD standeth up to plead, and standeth to judge the people.","14":"The LORD will enter into judgment with the ancients of his people, and the princes thereof: for ye have eaten up the vineyard; the spoil of the poor *is* in your houses.","15":"What mean ye *that* ye beat my people to pieces, and grind the faces of the poor? saith the Lord GOD of hosts.","16":"Moreover the LORD saith, Because the daughters of Zion are haughty, and walk with stretched forth necks and wanton eyes, walking and mincing *as* they go, and making a tinkling with their feet:","17":"Therefore the Lord will smite with a scab the crown of the head of the daughters of Zion, and the LORD will discover their secret parts.","18":"In that day the Lord will take away the bravery of *their* tinkling ornaments *about their feet*, and *their* cauls, and *their* round tires like the moon,","19":"The chains, and the bracelets, and the mufflers,","20":"The bonnets, and the ornaments of the legs, and the headbands, and the tablets, and the earrings,","21":"The rings, and nose jewels,","22":"The changeable suits of apparel, and the mantles, and the wimples, and the crisping pins,","23":"The glasses, and the fine linen, and the hoods, and the vails.","24":"And it shall come to pass, *that* instead of sweet smell there shall be stink; and instead of a girdle a rent; and instead of well set hair baldness; and instead of a stomacher a girding of sackcloth; *and* burning instead of beauty.","25":"Thy men shall fall by the sword, and thy mighty in the war.","26":"And her gates shall lament and mourn; and she *being* desolate shall sit upon the ground."}},"tsk":{"1":[{"kopje":"zie","refs":["Jes 2:22"]},{"kopje":"de Heere","refs":["Jes 1:24","Jes 36:12","Jes 51:22"]},{"kopje":"de staf","refs":["Lev 26:26","Ps 105:16","Jer 37:21","Jer 38:9","Ezech 4:16","Ezech 4:17","Ezech 14:13"]}],"2":[{"kopje":"held","refs":["Jes 2:13-15","2 Kon 24:14-16","Ps 74:9","Klaagl 5:12-14","Amos 2:3"]},{"kopje":"de oude","refs":["Jes 9:14","Ezech 8:12","Ezech 9:5"]}],"3":[{"kopje":"leider","refs":["Ex 18:21","Deut 1:15","1 Sam 8:12"]},{"kopje":"de aanzienlijke","refs":["Richt 8:18"]},{"kopje":"welbespraakt is","refs":["Ex 4:10","Ex 4:14-16"]}],"4":[{"kopje":"kinderen","refs":["1 Kon 3:7-9","2 Kron 33:1","2 Kron 34:1","2 Kron 36:2","2 Kron 36:5","2 Kron 36:9","2 Kron 36:11","Pred 10:16"]}],"5":[{"kopje":"het volk","refs":["Jes 9:18-20","Jes 11:13","Jer 9:3-8","Jer 22:17","Ezech 22:6","Ezech 22:7","Ezech 22:12","Amos 4:1","Micha 3:1-3","Micha 3:11","Zach 7:9-11","Mal 3:5","Jak 2:6","Jak 5:4"]},{"kopje":"de jongeling","refs":["Jes 1:4","Lev 19:32","2 Kon 2:23","Job 30:1-12"]},{"kopje":"verachte","refs":["2 Sam 16:5-9","Pred 10:5-7","Matt 26:67","Matt 27:28-30","Mark 14:65","Luk 22:64"]}],"6":[{"kopje":"iemand","refs":["Jes 4:1","Richt 11:6-8","Joh 6:15"]}],"7":[{"kopje":"zeggen","refs":["Gen 14:22","Deut 32:40","Openb 10:5","Openb 10:6"]},{"kopje":"heelmeester","refs":["Jes 58:12","Jer 14:19","Klaagl 2:13","Hos 5:13","Hos 6:1"]},{"kopje":"geen brood","refs":["1 Kon 4:22","1 Kon 4:23","Neh 5:17","Neh 5:18"]}],"8":[{"kopje":"Jeruzalem","refs":["2 Kron 28:5-7","2 Kron 28:18","2 Kron 33:11","2 Kron 36:17-19","Jer 26:6","Jer 26:18","Klaagl 5:16","K ll <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> <span class=\"wl wl-kjv\" data-code=\"H5288\">children</span> to be their <span class=\"wl wl-kjv\" data-code=\"H8269\">princes,</span> and <span class=\"wl wl-kjv\" data-code=\"H8586\">babes</span> shall rule","5":"And the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> shall be <span class=\"wl wl-kjv\" data-code=\"H5065\">oppressed,</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">one</span> by <span class=\"wl wl-kjv\" data-code=\"H376\">another,</span> and every <span class=\"wl wl-kjv\" data-code=\"H376\">one</span> by his <span class=\"wl wl-kjv\" data-code=\"H7453\">neighbour:</span> the <span class=\"wl wl-kjv\" data-code=\"H5288\">child</span> shall behave himself <span class=\"wl wl-kjv\" data-code=\"H7292\">proudly</span> against the <span class=\"wl wl-kjv\" data-code=\"H2205\">ancient,</span> and the <span class=\"wl wl-kjv\" data-code=\"H7034\">base</span> against the honourable.","6":"When a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> shall take <span class=\"wl wl-kjv\" data-code=\"H8610\">hold</span> of his <span class=\"wl wl-kjv\" data-code=\"H251\">brother</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of his <span class=\"wl wl-kjv\" data-code=\"H1\">father,</span> saying, Thou hast <span class=\"wl wl-kjv\" data-code=\"H8071\">clothing,</span> be thou our <span class=\"wl wl-kjv\" data-code=\"H7101\">ruler,</span> and let this <span class=\"wl wl-kjv\" data-code=\"H4384\">ruin</span> be under thy hand:","7":"In that <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> shall he <span class=\"wl wl-kjv\" data-code=\"H5375\">swear,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> I will not be an <span class=\"wl wl-kjv\" data-code=\"H2280\">healer;</span> for in my <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> is neither <span class=\"wl wl-kjv\" data-code=\"H3899\">bread</span> nor <span class=\"wl wl-kjv\" data-code=\"H8071\">clothing:</span> <span class=\"wl wl-kjv\" data-code=\"H7760\">make</span> me not a <span class=\"wl wl-kjv\" data-code=\"H7101\">ruler</span> of the people.","8":"For <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> is <span class=\"wl wl-kjv\" data-code=\"H3782\">ruined,</span> and <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> is <span class=\"wl wl-kjv\" data-code=\"H5307\">fallen:</span> because their <span class=\"wl wl-kjv\" data-code=\"H3956\">tongue</span> and their <span class=\"wl wl-kjv\" data-code=\"H4611\">doings</span> are against the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> to <span class=\"wl wl-kjv\" data-code=\"H4784\">provoke</span> the <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes</span> of his glory.","9":"The <span class=\"wl wl-kjv\" data-code=\"H1971\">shew</span> of their <span class=\"wl wl-kjv\" data-code=\"H6440\">countenance</span> doth witness against <span class=\"wl wl-kjv\" data-code=\"H6030\">them;</span> and they <span class=\"wl wl-kjv\" data-code=\"H5046\">declare</span> their <span class=\"wl wl-kjv\" data-code=\"H2403\">sin</span> as <span class=\"wl wl-kjv\" data-code=\"H5467\">Sodom,</span> they <span class=\"wl wl-kjv\" data-code=\"H3582\">hide</span> it not. <span class=\"wl wl-kjv\" data-code=\"H188\">Woe</span> unto their <span class=\"wl wl-kjv\" data-code=\"H5315\">soul!</span> for they have <span class=\"wl wl-kjv\" data-code=\"H1580\">rewarded</span> evil","10":"<span class=\"wl wl-kjv\" data-code=\"H559\">Say</span> ye to the <span class=\"wl wl-kjv\" data-code=\"H6662\">righteous,</span> that it shall be <span class=\"wl wl-kjv\" data-code=\"H2896\">well</span> with him: for they shall <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> the <span class=\"wl wl-kjv\" data-code=\"H6529\">fruit</span> of their doings.","11":"<span class=\"wl wl-kjv\" data-code=\"H188\">Woe</span> unto the <span class=\"wl wl-kjv\" data-code=\"H7563\">wicked!</span> it shall be <span class=\"wl wl-kjv\" data-code=\"H7451\">ill</span> with him: for the <span class=\"wl wl-kjv\" data-code=\"H1576\">reward</span> of his <span class=\"wl wl-kjv\" data-code=\"H3027\">hands</span> shall be given","12":"As for my <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> <span class=\"wl wl-kjv\" data-code=\"H5953\">children</span> are their <span class=\"wl wl-kjv\" data-code=\"H5065\">oppressors,</span> and <span class=\"wl wl-kjv\" data-code=\"H802\">women</span> <span class=\"wl wl-kjv\" data-code=\"H4910\">rule</span> over them. O my <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> they which <span class=\"wl wl-kjv\" data-code=\"H833\">lead</span> thee cause thee to <span class=\"wl wl-kjv\" data-code=\"H8582\">err,</span> and <span class=\"wl wl-kjv\" data-code=\"H1104\">destroy</span> the <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> of thy paths.","13":"The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> standeth <span class=\"wl wl-kjv\" data-code=\"H5324\">up</span> to <span class=\"wl wl-kjv\" data-code=\"H7378\">plead,</span> and <span class=\"wl wl-kjv\" data-code=\"H5975\">standeth</span> to <span class=\"wl wl-kjv\" data-code=\"H1777\">judge</span> the people.","14":"The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> will <span class=\"wl wl-kjv\" data-code=\"H935\">enter</span> into <span class=\"wl wl-kjv\" data-code=\"H4941\">judgment</span> with the <span class=\"wl wl-kjv\" data-code=\"H2205\">ancients</span> of his <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> and the <span class=\"wl wl-kjv\" data-code=\"H8269\">princes</span> thereof: for ye have eaten <span class=\"wl wl-kjv\" data-code=\"H1197\">up</span> the <span class=\"wl wl-kjv\" data-code=\"H3754\">vineyard;</span> the <span class=\"wl wl-kjv\" data-code=\"H1500\">spoil</span> of the <span class=\"wl wl-kjv\" data-code=\"H6041\">poor</span> is in your houses.","15":"What mean ye that ye <span class=\"wl wl-kjv\" data-code=\"H1792\">beat</span> my <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> to <span class=\"wl wl-kjv\" data-code=\"H1792\">pieces,</span> and <span class=\"wl wl-kjv\" data-code=\"H2912\">grind</span> the <span class=\"wl wl-kjv\" data-code=\"H6440\">faces</span> of the <span class=\"wl wl-kjv\" data-code=\"H6041\">poor?</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD</span> of hosts.","16":"Moreover the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saith,</span> <span class=\"wl wl-kjv\" data-code=\"H3282\">Because</span> the <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters</span> of <span class=\"wl wl-kjv\" data-code=\"H6726\">Zion</span> are <span class=\"wl wl-kjv\" data-code=\"H1361\">haughty,</span> and <span class=\"wl wl-kjv\" data-code=\"H3212\">walk</span> with stretched <span class=\"wl wl-kjv\" data-code=\"H5186\">forth</span> <span class=\"wl wl-kjv\" data-code=\"H1627\">necks</span> and <span class=\"wl wl-kjv\" data-code=\"H8265\">wanton</span> <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes,</span> <span class=\"wl wl-kjv\" data-code=\"H1980\">walking</span> and <span class=\"wl wl-kjv\" data-code=\"H2952\">mincing</span> as they <span class=\"wl wl-kjv\" data-code=\"H3212\">go,</span> and making a <span class=\"wl wl-kjv\" data-code=\"H5913\">tinkling</span> with their feet:","17":"Therefore the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> will smite with a <span class=\"wl wl-kjv\" data-code=\"H5596\">scab</span> the crown of the <span class=\"wl wl-kjv\" data-code=\"H6936\">head</span> of the <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters</span> of <span class=\"wl wl-kjv\" data-code=\"H6726\">Zion,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> will <span class=\"wl wl-kjv\" data-code=\"H6168\">discover</span> their secret parts.","18":"In that <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> will take <span class=\"wl wl-kjv\" data-code=\"H5493\">away</span> the <span class=\"wl wl-kjv\" data-code=\"H8597\">bravery</span> of their tinkling <span class=\"wl wl-kjv\" data-code=\"H5914\">ornaments</span> about their feet, and their <span class=\"wl wl-kjv\" data-code=\"H7636\">cauls,</span> and their round tires like the moon,","19":"The <span class=\"wl wl-kjv\" data-code=\"H5188\">chains,</span> and the <span class=\"wl wl-kjv\" data-code=\"H8285\">bracelets,</span> and the mufflers,","20":"The <span class=\"wl wl-kjv\" data-code=\"H6287\">bonnets,</span> and the ornaments of the <span class=\"wl wl-kjv\" data-code=\"H6807\">legs,</span> and the <span class=\"wl wl-kjv\" data-code=\"H7196\">headbands,</span> and the <span class=\"wl wl-kjv\" data-code=\"H5315\">tablets,</span> and the earrings,","21":"The <span class=\"wl wl-kjv\" data-code=\"H2885\">rings,</span> and <span class=\"wl wl-kjv\" data-code=\"H639\">nose</span> jewels,","22":"The changeable suits of <span class=\"wl wl-kjv\" data-code=\"H4254\">apparel,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4595\">mantles,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4304\">wimples,</span> and the crisping pins,","23":"The <span class=\"wl wl-kjv\" data-code=\"H1549\">glasses,</span> and the fine <span class=\"wl wl-kjv\" data-code=\"H5466\">linen,</span> and the <span class=\"wl wl-kjv\" data-code=\"H6797\">hoods,</span> and the vails.","24":"And it shall come to pass, that instead of sweet <span class=\"wl wl-kjv\" data-code=\"H1314\">smell</span> there shall be <span class=\"wl wl-kjv\" data-code=\"H4716\">stink;</span> and instead of a <span class=\"wl wl-kjv\" data-code=\"H2290\">girdle</span> a <span class=\"wl wl-kjv\" data-code=\"H5364\">rent;</span> and instead of well <span class=\"wl wl-kjv\" data-code=\"H4639\">set</span> <span class=\"wl wl-kjv\" data-code=\"H4748\">hair</span> <span class=\"wl wl-kjv\" data-code=\"H7144\">baldness;</span> and instead of a <span class=\"wl wl-kjv\" data-code=\"H6614\">stomacher</span> a <span class=\"wl wl-kjv\" data-code=\"H4228\">girding</span> of <span class=\"wl wl-kjv\" data-code=\"H8242\">sackcloth;</span> and <span class=\"wl wl-kjv\" data-code=\"H3587\">burning</span> instead of beauty.","25":"Thy <span class=\"wl wl-kjv\" data-code=\"H4962\">men</span> shall <span class=\"wl wl-kjv\" data-code=\"H5307\">fall</span> by the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword,</span> and thy <span class=\"wl wl-kjv\" data-code=\"H1369\">mighty</span> in the war.","26":"And her <span class=\"wl wl-kjv\" data-code=\"H6607\">gates</span> shall <span class=\"wl wl-kjv\" data-code=\"H578\">lament</span> and <span class=\"wl wl-kjv\" data-code=\"H56\">mourn;</span> and she being <span class=\"wl wl-kjv\" data-code=\"H5352\">desolate</span> shall <span class=\"wl wl-kjv\" data-code=\"H3427\">sit</span> upon the ground."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"stok en den staf,","tekst":"Dat is, al hetgeen waar men zich op verlaat, hetzij klein of groot, aanzienlijk of slecht. Anders: den steunenden [man] en de steunende [vrouw]."},{"catchword":"stok des broods,","tekst":"Dat is, al de voedzame kracht van het brood, alzo dat zij niet zullen verzadigd worden ofschoon zij veel brood eten en veel water drinken. Deze straf dreigt ook God den overtreders zijner wetten, Lev 26:26 ; zie de aantekening aldaar; en zie daarvan een exempel Hag 1:6 ."}],"2":[{"catchword":"waarzegger,","tekst":"Dat is, verreziende, voorzinnige, voorzichtige, die ene zaak van verre ziet komen, of voorziet eer zij geschiedt. Zie Pro 16:10 ."},{"catchword":"den oude;","tekst":"Te weten niet alleen oud van jaren, maar ook wel ervaren, wijs, kloek in de regering, hetzij der kerk of der republiek."}],"3":[{"catchword":"den aanzienlijke,","tekst":"Hebreeuws, den verhevenen van aangezicht; dat is, den aanzienlijken, of die in autoriteit is."},{"catchword":"raadsman,","tekst":"Anders: raadgever."},{"catchword":"wijze","tekst":"Of, kundige, ervarene."},{"catchword":"dien,","tekst":"Die wel ter taal is, of verstandig in redenering, een welsprekend man."}],"4":[{"catchword":"jongelingen","tekst":"Te weten jong van jaren, of jong in verstand, of beide; zie Ecc 10:16 ."},{"catchword":"kinderen","tekst":"Anders: kinderachtige lieden."}],"5":[{"catchword":"gedrongen","tekst":"Of, hard gedreven worden; te weten tot betaling, of tot zwaren dienst en arbeid."},{"catchword":"stout zijn","tekst":"Of, trots, moedig."},{"catchword":"de verachte","tekst":"Dat is, slechten, ongeachten onder het volk."}],"6":[{"catchword":"zijn broeder","tekst":"Dat is, zijnen bloedverwant."},{"catchword":"uit het huis","tekst":"Dat is, die van zijns vaders huis of geslacht is."},{"catchword":"Gij hebt","tekst":"Dat is, gij zijt welhebbende, of, gij hebt middelen om te leven; gij zijt een van de aanzienlijksten onder ons; gemeenlijk openbaart zich de rijkdom in de klederen."},{"catchword":"dezen aanstoot","tekst":"Of, dit verderf, of ruïne, of ondergang. De zin is: Neem toch de vervallen zaak van onzen staat bij de hand, en help haar ondersteunen, zoveel het u mogelijk en doenlijk is. Anders: doch laat uwe hand onder deze ruïne zijn; een manier van spreken, genomen van een vallend huis."},{"catchword":"onder uw hand","tekst":"Dat is, onder uw beleid."}],"7":[{"catchword":"in dien dag","tekst":"Dat is, straks, zonder zich lang te beraden."},{"catchword":"opheffen,","tekst":"Te weten naar den hemel, dat is, hij zal zweren. Zie Gen 14:22 . Anders: hij zal [zijne stem] opheffen."},{"catchword":"heelmeester","tekst":"Hebreeuws, verbinder; te weten van uwe wonden, of geen chirurgijn, wondmeester, of medicijnmeester zijn. Alsof hij zeide: De zaken zijn in onzen staat te zeer verlopen, de wonde van onzen staat is te zeer vervuild, ik zal het vervallen werk niet kunnen redden. In een woord, de profeet wil zeggen dat het zo ellendig met de Joden zou gesteld wezen, dat onaangezien een ieder gaarne groot is, nochtans niemand het bestuur zou willen aannemen, ofschoon het hun werd aangeboden. Zie ook Job 34:17 ."},{"catchword":"is ook geen brood","tekst":"Alsof hij zeide: Ik ben zo arm dat ik mijzelven en de mijnen van nooddruft niet kan verzorgen, veel weiniger kan ik dan ulieden helpen."}],"8":[{"catchword":"heeft aangestoten,","tekst":"Dat is, het zal gewisselijk in het kort vallen."}],"9":[{"catchword":"Het gelaat","tekst":"Dat is, men kan het uit hun aangezicht bespeuren, dat zij boze, onbeschaamde mensen zijn. Anders: de hardnekkigheid van hun aangezicht; in welke betekenis het Hebreeuwse woord ook genomen wordt Job 19:3 ."},{"catchword":"spreken","tekst":"Dat is, roemen zij. Hebreeuws, verkondigen zij."},{"catchword":"gelijk Sodom;","tekst":"Dat is, gelijk de inwoners van Sodom. Zie Gen 13:13 , en Gen 18:20 , en Gen 19:5 ."},{"catchword":"zij doen zichzelven","tekst":"Te weten, met God den Heere door hunne zonden tot straf te verwekken. Zie van het Hebreeuwse woord gamal, Psa 13:6 ."}],"10":[{"catchword":"dat het hem","tekst":"Zie van zulk gebruik van het Hebreeuwse woord Tob, Jer 22:15-16 ."},{"catchword":"eten","tekst":"Dat is, genieten; dat is, God de Heere zal uit genade hunne godzaligheid belonen. Zie de aantekening Pro 1:31 ."}],"11":[{"catchword":"het zal hem","tekst":"In het Hebreeuws staat alleen het woord kwaad of boos. Anders: als hij boos is; dat is, als hij boos blijft."},{"catchword":"want de vergelding","tekst":"Dat is, hem zal wedervaren of overkomen even hetzelfde, dat hij anderen gedaan heeft; hij zal gestraft worden om zijner boosheden wil."}],"12":[{"catchword":"drijvers","tekst":"Dat is, strenge regeerders, of onderdrukkers."},{"catchword":"kinderen,","tekst":"Dat is, onervaren, hunne lusten volgende, als de kinderen."},{"catchword":"vrouwen heersen","tekst":"Dat is, verwijfde mannen, die geen moed hebben."},{"catchword":"u leiden,","tekst":"Of, uwe leiders; dat is, uwe leraars en regeerders. Anders: die u gelukzalig achten; of roemen; verstaande zulke predikers, die de lieden kussens onder de ellebogen leggen, roepende: Het heeft geen nood."},{"catchword":"slokken","tekst":"Dat is, den weg, dien gij behoort te wandelen, verderven zij, gelijk als die iets verslindt of inslokt; of zij bedekken en verduisteren den weg, gelijk het ingeslokte verborgen en als ingewonden is. Vergelijk Num 4:20 , of zij varen er heel lichtelijk over heen. Vergelijk Job 39:27 , met de aantekening."}],"13":[{"catchword":"om te pleiten,","tekst":"Dat is, om in het recht te treden, gelijk Isa 1:18 ."},{"catchword":"de volken","tekst":"Te weten, het volk Israël, hetwelk groot is en veel in getal, gelijk Act 4:27 ."}],"14":[{"catchword":"de oudsten","tekst":"Dat is, de rechters, regeerders, magistraten, die men uit oude bedaagde mannen pleegt te kiezen. Dezen zal de Heere voor het recht stellen, omdat zij zijn volk door ongerechtigheid onderdrukt hebben."},{"catchword":"dezen wijngaard","tekst":"Dat is, de gemeente Gods, of het volk Gods, dat u toevertrouwd was. Zie Isa 5:1 ; Mat 21:33 ."},{"catchword":"verteerd;","tekst":"Hebreeuws, verbrand, of met het vuur verslonden, zie Num 24:22 . De zin is: in plaats van mijnen wijngaard te bouwen en mij goede vruchten daarvan te brengen, maakt gij denzelven te schande."}],"15":[{"catchword":"Wat is ulieden,","tekst":"Dat is, wat recht of reden hebt gijlieden daartoe? dat gij, enz."},{"catchword":"de aangezichten","tekst":"Dat is de personen."},{"catchword":"vermaalt?","tekst":"Dat is, gans wredelijk en onmenselijk behandelt of mishandelt. Anders: als in een vijzel stoot, of met krabben en vuiligheid schendt."}],"16":[{"catchword":"dochteren","tekst":"Dat is, de vrouwen en jonge dochters te Jeruzalem, welke hier gedreigd worden vanwege hare hovaardij."},{"catchword":"zich verheffen,","tekst":"Het hoofd omhoog steken uit hoogvaardij."},{"catchword":"met uitgestrekten","tekst":"Hebreeuws, uitgestrekt van hals, of van keel."},{"catchword":"lonken","tekst":"Hebreeuws, bedriegende met de ogen, of lonkende met de ogen; dat is, met de ogen hare loosheid te kennen gevende."},{"catchword":"al gaande","tekst":"Anders: Zij gaan al trippelende alsof zij kleine kinderen waren, makende kleine treden."},{"catchword":"gebonden","tekst":"Of, geboeid. Anders: Ja aan hare voeten dragen zij boeitjes. Anders: Makende een geluid, of geril met hare voeten, alsof er schelletjes aan waren. Anderen nemen het aldus: Zij gaan half dansende, houden zekeren pas of maat in haren tred. Maar de meesten en voornaamsten verstaan het van kostelijke boeitjes, of versierselen aan de voeten, hebbende het fatsoen van boeitJes."}],"17":[{"catchword":"schurftig","tekst":"Of, schurft; anders kaal. Op de schurftheid volgt gemeenlijk kaalheid of uitvalling van het haar. Anderen verstaan het aldus: dat zij in der vijanden hand en geweld vervallen zouden, die haar het haar kaal afscheren zouden, gelijk men den slaven en lijfeigenen pleegt te doen."},{"catchword":"de HEERE zal","tekst":"Dat is, de Heere zal haar laten beroven van hare klederen, alzo dat zij zullen moeten naakt gaan, en niet zoveel hebben zullen, dat zij hare schaamte bedekken kunnen."}],"18":[{"catchword":"het sieraad","tekst":"Wat vs.18-24 aangaat, die worden zeer verscheidenlijk overgezet; de hovaardige pronksters hebben ook in die tijden al veel ander pronksel gehad als heden ten dage onze jonkvrouwen hebben, zodat vele van die namen ons onbekend zijn, vele derzelve den naam medebrengende uit dat land, waar zij eerst gedacht geweest zijn. Zij zijn hier gezet zo na als men ze heeft kunnen treffen. Voor sieraad der kousenbanden hebben anderen de netwerken of betraliede klederen; die doorschijnend gebreid of geborduurd waren, hetwelk enigen noemen vensteren der oneerbaarheid."},{"catchword":"de netjes,","tekst":"Of, sluiers, of schakelwerk, als daar zijn de fijngebreide netjes, dunne doekjes en allerlei gebreidsel, of geweefsel, dat doorluchtig is."},{"catchword":"de maantjes","tekst":"Dit was een sieraad als maantjes. Zie Jdg 8:21 . Heden ten dage dragen ook enige in de oorlapjes kleine maantjes van goud, zilver, of enig gesteente, of paarlen."}],"19":[{"catchword":"De reukdoosjes,","tekst":"Versta hier, de gouden of zilveren doosjes, waar muskus of andere welriekende specerijen in waren, die de jonkvrouwen aan den hals, of op de borsten, of tussen dezelve droegen. Anders, halsketentjes, of iets dergelijks."},{"catchword":"de glinsterende","tekst":"Dat is, de klederen bezaaid met dunne gouden of zilveren schubbetjes of flittertjes, die een glans gaven als er de zon op scheen, alsof het glinsterende sterretjes geweest waren. Anders, flitterende, of bevende lovertJes."}],"20":[{"catchword":"De hoofdkroning,","tekst":"Zie Eze 24:17 , en Eze 44:18 ."},{"catchword":"armversierselen,","tekst":"Zie 2Sa 1:10 ."},{"catchword":"bindselen,","tekst":"Of, hoofdsnoeren. Zie Jer 2:32 ."},{"catchword":"de reukballetjes,","tekst":"Hebreeuws, huisjes der ziel, of van den adem; aldus worden de reukballetjes genoemd, omdat zij het hart verkwikken en den adem versterken."}],"21":[{"catchword":"de voorhoofdsierselen,","tekst":"Dit waren enige versierselen, die op het voorhoofd tot op den neus hingen; Gen 24:24 ."}],"22":[{"catchword":"De wisselklederen,","tekst":"Gelijk Jdg 14:12 ."},{"catchword":"de manteltjes,","tekst":"Hebreeuws, de overdekselen. Het mogen wel grote floersen geweest zijn, die nu in het Frans genoemd worden la grand voile."},{"catchword":"de buidels,","tekst":"Gelijk 2Ki 5:23 . Anders: naalden, of spelden; te weten van goud of zilver, dergelijke nu ook enige jonge dochters in het haar dragen."}],"23":[{"catchword":"de hulledoeken,","tekst":"Of, tophuiven."},{"catchword":"de sluiers","tekst":"Anders: kedelen, of fijne, dunne en lichte kledingen, die men in Judea en omliggende hete landen droeg."}],"24":[ // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

function plaatsPopup(el, html) {
  popup.innerHTML = html;

  popup.style.display = 'block';

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);

function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}

  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
